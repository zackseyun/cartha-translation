  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ξενίζοντα γάρ τινα εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν· βουλόμεθα οὖν γνῶναι ⸂τίνα θέλει⸃ ταῦτα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/020.yaml
  text: For you are bringing some strange things to our ears[b][a]. Therefore we want to know what these things mean.
translation:
  language: id
  text: Sebab engkau membawa beberapa hal yang asing ke telinga kami.[a] Karena itu, kami ingin tahu apa arti hal-hal ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “beberapa hal yang tidak dikenal” atau “beberapa hal yang asing bagi kami.” Istilah Yunaninya dapat menunjuk pada sesuatu yang terasa asing karena baru atau berasal dari luar.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “hal-hal ini hendak menjadi apa,” sebuah ungkapan yang berarti “apa arti hal-hal ini” atau “apa maknanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζοντα τινα
  choice: beberapa hal yang asing
  rationale: Partisipel netral jamak bersama kata ganti tak tentu menunjuk pada sejumlah hal yang dianggap asing, baru, atau tidak dikenal oleh para pendengar. Ungkapan ini mempertahankan ketidaktentuan tanpa memberi kesan bahwa isinya pasti ganjil.
- source_word: εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν
  choice: engkau membawa ... ke telinga kami
  rationale: Terjemahan ini mempertahankan metafora sumber tentang membawa sesuatu kepada pendengaran, sekaligus tetap dapat dipahami dalam bahasa Indonesia modern.
- source_word: βουλόμεθα οὖν γνῶναι
  choice: Karena itu, kami ingin tahu
  rationale: βούλομαι menyatakan kehendak atau keinginan, sedangkan οὖν menandai kesimpulan dari pernyataan sebelumnya. 'Ingin tahu' alami dan langsung dalam konteks ini.
- source_word: τίνα θέλει ταῦτα εἶναι
  choice: apa arti semua hal ini
  rationale: Secara harfiah konstruksi ini berbunyi kurang lebih 'hal-hal ini hendak menjadi apa', tetapi dalam konteks merupakan idiom yang menanyakan arti atau maknanya.
- source_word: γάρ
  choice: Sebab
  rationale: γάρ memberi alasan atau penjelasan bagi permintaan yang disampaikan dalam konteks sebelumnya; 'Sebab' mempertahankan hubungan wacana tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal 'engkau' mempertahankan bentuk orang kedua tunggal εἰσφέρεις. Metafora 'ke telinga kami' sengaja dipertahankan karena jelas dan dekat dengan bentuk Yunani.
