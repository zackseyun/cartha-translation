  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ ⸀καθιστάνοντες τὸν Παῦλον ⸀ἤγαγον ἕως Ἀθηνῶν, καὶ λαβόντες ἐντολὴν πρὸς τὸν Σιλᾶν καὶ ⸀τὸν Τιμόθεον ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτὸν ἐξῄεσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/015.yaml
  text: Those who were escorting Paul brought him as far as Athens[a], and after receiving instructions for Silas and Timothy to come to him as quickly as possible[b], they departed.
translation:
  language: id
  text: Orang-orang yang mengantar Paulus membawanya sampai ke Atena[a]. Setelah menerima perintah untuk disampaikan kepada Silas dan Timotius agar mereka datang kepada Paulus secepat mungkin[b], mereka pun berangkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke Atena.” Ungkapan Yunani tersebut menunjukkan bahwa mereka menyertai Paulus hingga mencapai tempat itu.
    reason: lexical_alternative
  - marker: b
    text: Atau, “petunjuk.” Kata Yunani ini juga dapat menyatakan perintah yang berwenang.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθιστάνοντες
  choice: yang mengantar
  rationale: Dalam konteks perjalanan ini, partisip tersebut menunjuk kepada orang-orang yang menyertai dan membawa Paulus dengan aman ke tujuannya. 'Mengantar' alami dalam bahasa Indonesia dan mencakup nuansa penyertaan sampai tujuan.
- source_word: ἤγαγον
  choice: membawanya
  rationale: Verba aoris ini menyatakan tindakan selesai membawa Paulus ke Atena; akhiran '-nya' mempertahankan objek eksplisit, yaitu Paulus.
- source_word: ἕως Ἀθηνῶν
  choice: sampai ke Atena
  rationale: ἕως dengan nama tempat menyatakan batas atau tujuan yang dicapai. 'Sampai ke Atena' mempertahankan nuansa bahwa mereka mengantarnya hingga tempat itu.
- source_word: λαβόντες ἐντολήν
  choice: setelah menerima pesan
  rationale: Partisip diterjemahkan secara temporal. Dalam konteks ini ἐντολή adalah arahan yang harus disampaikan kepada Silas dan Timotius; 'pesan' terdengar alami tanpa meniadakan daya mengikatnya, yang dicatat dalam catatan kaki.
- source_word: πρὸς τὸν Σιλᾶν καὶ τὸν Τιμόθεον
  choice: untuk Silas dan Timotius
  rationale: πρός menunjukkan orang-orang yang menjadi penerima pesan. Bentuk 'untuk' ringkas dan idiomatis dalam bahasa Indonesia.
- source_word: ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτόν
  choice: agar mereka datang kepada Paulus secepat mungkin
  rationale: Klausa ini menyatakan isi pesan, dan 'secepat mungkin' mempertahankan urgensi ὡς τάχιστα. Nama 'Paulus' dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: ἐξῄεσαν
  choice: orang-orang itu pun berangkat pulang
  rationale: Imperfek ini menutup adegan dengan keberangkatan para pengantar. 'Berangkat pulang' memperjelas bahwa mereka meninggalkan Atena untuk menyampaikan pesan, sedangkan 'pun' memberi alur naratif yang alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. 'Atena' mengikuti bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia. Struktur kalimat dibagi dua agar mudah dipahami, sementara hubungan temporal dan urgensi teks Yunani tetap dipertahankan.
