base_translation:
  language: en
  yaml_path: translation/nt/acts/017/016.yaml
  text: While Paul was waiting for them in Athens[b][a], his spirit was provoked within him as he saw that the city was full of idols.
translation:
  language: id
  text: Sementara Paulus menantikan mereka di Atena, batinnya sangat terusik[a] ketika ia melihat bahwa kota itu penuh dengan berhala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “sangat gelisah” atau “sangat tergugah”; kata Yunani yang digunakan menyatakan gejolak batin yang tajam.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “kota itu dipenuhi berhala” atau “kota itu dikuasai oleh berhala-berhala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδεχομένου
  choice: menantikan
  rationale: Partisipel ini menyatakan keadaan yang sedang berlangsung ketika Paulus menunggu rekan-rekannya; “menantikan” alami dan tetap mempertahankan nuansa duratif.
- source_word: παρωξύνετο
  choice: bergejolak
  rationale: Bentuk imperfek ini menggambarkan reaksi batin yang berlangsung dan tajam. “Bergejolak” menyampaikan kegusaran atau agitasi kuat tanpa membatasinya hanya pada kesedihan.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: rohnya
  rationale: Ungkapan posesif ini paling langsung menunjuk pada roh atau batin Paulus sendiri; “rohnya” mempertahankan istilah sumber tanpa mengidentifikasikannya sebagai Roh Kudus.
- source_word: ἐν αὐτῷ
  choice: dalam dirinya
  rationale: Frasa ini menegaskan bahwa gejolak tersebut terjadi di dalam diri Paulus.
- source_word: θεωροῦντος
  choice: ketika ia melihat
  rationale: Partisipel ini menyatakan pengamatan yang berlangsung bersamaan dengan reaksi Paulus; terjemahan ini ringkas dan wajar dalam bahasa Indonesia.
- source_word: κατείδωλον
  choice: penuh dengan berhala
  rationale: Adjektiva ini menggambarkan kota yang dipenuhi berhala. Pilihan ini jelas, alami, dan kurang interpretatif daripada “dikuasai penyembahan berhala.”
- source_word: πόλιν
  choice: kota itu
  rationale: Teks Yunani menyebut “kota itu,” yang merujuk kembali kepada Atena; bentuk ini mempertahankan rujukan sumber.
- source_word: δὲ
  choice: Sementara
  rationale: δέ menandai peralihan naratif yang menyatu dengan konstruksi temporal partisipial; dalam bahasa Indonesia tidak diperlukan kata pembuka seperti “Adapun” atau “Namun.”
theological_decisions:
- issue: Rujukan “roh” dalam τὸ πνεῦμα αὐτοῦ
  choice: Roh atau batin Paulus sendiri
  alternative: Dorongan Roh Kudus
  rationale: Konstruksi posesif “rohnya” dan frasa “dalam dirinya” menunjuk pada reaksi batin Paulus. Ayat ini tidak secara eksplisit menyatakan bahwa Roh Kuduslah yang menggerakkannya, sehingga terjemahan tidak menambahkan penafsiran tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat yang alami dan bernada luhur. “Rohnya bergejolak dalam dirinya” mempertahankan unsur-unsur eksplisit teks Yunani sekaligus menyampaikan reaksi batin yang kuat. Semua penanda catatan kaki ditempatkan langsung pada bagian yang dijelaskan.
