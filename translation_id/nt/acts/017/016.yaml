  naturalness: Kalimat revisi memakai bahasa Indonesia baku yang lebih lancar. Frasa “rohnya bergejolak dalam dirinya” terdengar agak berlebihan dan kurang idiomatis karena “rohnya” dan “dalam dirinya” menumpuk gagasan batin yang sama.
  terminology: “Batinnya” tepat dalam konteks ini untuk τὸ πνεῦμα αὐτοῦ, yakni diri batin Paulus, dan menghindari pembacaan seolah-olah yang dimaksud adalah Roh Kudus. “Berhala” adalah padanan baku dan tepat bagi εἴδωλον dalam κατείδωλον.
