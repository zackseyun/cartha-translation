id: ACT.17.1
reference: Acts 17:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διοδεύσαντες δὲ τὴν Ἀμφίπολιν καὶ ⸀τὴν Ἀπολλωνίαν ἦλθον εἰς Θεσσαλονίκην, ὅπου ⸀ἦν συναγωγὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/001.yaml
  text: After passing through Amphipolis and Apollonia[a], they came to Thessalonica[b], where there was a synagogue of the Jews.
translation:
  language: id
  text: Setelah melewati Amfipolis dan Apolonia, mereka tiba di Tesalonika, tempat terdapat sebuah sinagoge orang Yahudi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διοδεύσαντες
  choice: Setelah melewati
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului kata kerja utama dan menggambarkan perjalanan melintasi kedua kota tersebut. Frasa ini alami dalam bahasa Indonesia tanpa menyiratkan bahwa mereka singgah lama.
- source_word: δὲ
  choice: —
  rationale: Partikel ini berfungsi sebagai penghubung naratif ringan. Tidak menerjemahkannya menghasilkan bahasa Indonesia yang lebih alami tanpa menghilangkan pertentangan atau makna penting.
- source_word: Ἀμφίπολιν καὶ Ἀπολλωνίαν
  choice: Amfipolis dan Apolonia
  rationale: Nama-nama tempat ditransliterasikan mengikuti bentuk yang lazim dalam bahasa Indonesia.
- source_word: ἦλθον εἰς Θεσσαλονίκην
  choice: mereka tiba di Tesalonika
  rationale: Bentuk ἔρχομαι dengan εἰς menyatakan gerak menuju kota itu. 'Tiba di' menyampaikan hasil perjalanan secara alami dan tidak mengubah arah deiktis berdasarkan sudut pandang pembaca.
- source_word: ὅπου
  choice: tempat
  rationale: Adverbia relatif lokatif ini mengawali klausa yang menerangkan Tesalonika. 'Tempat' menghasilkan konstruksi Indonesia yang lancar.
- source_word: συναγωγὴ τῶν Ἰουδαίων
  choice: sebuah sinagoge orang Yahudi
  rationale: Kata συναγωγή tidak memakai artikel, sehingga 'sebuah sinagoge' merupakan padanan yang wajar; bentuk genitif menyatakan keterkaitannya dengan komunitas Yahudi.
theological_decisions:
- issue: Cakupan makna Ἰουδαίων dalam konteks naratif
  choice: orang Yahudi
  alternative: orang Yudea
  rationale: Dalam konteks ini istilah tersebut menunjuk komunitas etnoreligius yang terkait dengan sinagoge di Tesalonika, bukan secara khusus penduduk wilayah Yudea.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan tindakan dalam bahasa Yunani dipertahankan, sementara susunan klausa dibuat alami bagi pembaca Indonesia.
