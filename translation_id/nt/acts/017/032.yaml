  text: Ἀκούσαντες δὲ ἀνάστασιν νεκρῶν οἱ μὲν ἐχλεύαζον οἱ δὲ εἶπαν Ἀκουσόμεθά σου ⸂περὶ τούτου καὶ πάλιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/032.yaml
  text: When they heard of the resurrection of the dead[a], some mocked, but others said, “We will hear you again about this.”
translation:
  language: id
  text: Ketika mereka mendengar tentang kebangkitan orang mati, sebagian orang mengejek, tetapi yang lain berkata, “Kami akan mendengarkan engkau lagi mengenai hal ini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Ketika mendengar
  rationale: Partisip aoris menyatakan keadaan waktu bagi reaksi berikutnya; δὲ menandai perkembangan ringan yang tidak perlu dinyatakan tersendiri dalam bahasa Indonesia.
- source_word: ἀνάστασιν νεκρῶν
  choice: kebangkitan orang mati
  rationale: Menyampaikan konsep kebangkitan yang melibatkan orang mati tanpa menambahkan penjelasan teologis yang tidak terdapat dalam teks.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: sebagian orang ... tetapi yang lain
  rationale: Mempertahankan kontras antara dua kelompok pendengar secara alami dan jelas.
- source_word: ἐχλεύαζον
  choice: mengejek
  rationale: Imperfek menggambarkan tindakan mereka, tetapi konteks tidak mengharuskan nuansa ingresif seperti 'mulai mengejek'; bentuk sederhana lebih alami.
- source_word: Ἀκουσόμεθά σου
  choice: Kami akan mendengarkan engkau
  rationale: ἀκούω dengan pronomina genitif berarti mendengarkan seseorang; 'mendengarkan engkau' jelas dan tetap bernada bermartabat.
- source_word: περὶ τούτου καὶ πάλιν
  choice: lagi mengenai hal ini
  rationale: Menjaga secara eksplisit unsur πάλιν ('lagi') dan topik περὶ τούτου ('mengenai hal ini') dalam susunan Indonesia yang alami.
theological_decisions:
- issue: Cakupan ungkapan kebangkitan dalam konteks pendengar non-Yahudi
  choice: kebangkitan orang mati
  alternative: kebangkitan dari antara orang mati
  rationale: νεκρῶν tanpa preposisi ἐκ paling langsung dipahami sebagai orang mati yang mengalami kebangkitan sebagai suatu kategori; terjemahan tidak menentukan lebih jauh sifat atau cakupannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, jelas, dan bermartabat. Pronomina 'engkau' dipakai dalam kutipan langsung kepada satu orang; struktur kalimat mempertahankan dua tanggapan pendengar yang berlawanan.
