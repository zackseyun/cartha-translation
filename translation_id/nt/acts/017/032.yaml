  terminology: “Kebangkitan orang mati” merupakan padanan yang tepat dan lazim untuk ἀνάστασιν νεκρῶν tanpa mempersempit maknanya. “Mendengarkan engkau” sesuai register baku dan mempertahankan alamat tunggal kepada Paulus.
