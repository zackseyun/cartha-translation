id: ACT.17.28
reference: Acts 17:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν αὐτῷ γὰρ ζῶμεν καὶ κινούμεθα καὶ ἐσμέν, ὡς καί τινες τῶν καθ’ ὑμᾶς ποιητῶν εἰρήκασιν· Τοῦ γὰρ καὶ γένος ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/028.yaml
  text: For in him we live and move and exist, as even some of your own poets have said, ‘For we also are his offspring.’
translation:
  language: id
  text: Sebab di dalam Dia kita hidup, bergerak, dan ada, seperti yang juga telah dikatakan oleh beberapa penyair kalian sendiri, “Sebab kita pun adalah keturunan-Nya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Mempertahankan ungkapan relasional-lokatif Yunani dan rujukan kepada Allah dalam konteks.
- source_word: κινούμεθα
  choice: bergerak
  rationale: Padanan langsung dan alami bagi bentuk medial/pasif yang dalam konteks ini menyatakan keberadaan serta aktivitas gerak manusia.
- source_word: ἐσμέν
  choice: ada
  rationale: Menerjemahkan verba 'adalah/berada' secara eksistensial tanpa mempersempitnya menjadi gagasan teologis tambahan.
- source_word: τῶν καθ’ ὑμᾶς ποιητῶν
  choice: penyair kalian sendiri
  rationale: Mengungkapkan idiom yang menunjuk kepada para penyair dari kalangan atau lingkungan pendengar Paulus.
- source_word: γένος
  choice: keturunan
  rationale: Sesuai dengan makna garis asal atau kaum yang berasal dari seseorang; dalam kutipan ini menyatakan bahwa manusia adalah keturunan Allah.
theological_decisions:
- issue: Makna keberadaan manusia 'di dalam Dia'
  choice: di dalam Dia kita hidup, bergerak, dan ada
  alternative: karena Dia kita hidup, bergerak, dan berada
  rationale: Bentuk sumber memakai ἐν αὐτῷ, sehingga citra 'di dalam Dia' dipertahankan dan tidak diubah menjadi hubungan sebab-akibat saja.
- issue: Bahasa 'keturunan' Allah
  choice: keturunan-Nya
  alternative: anak-anak-Nya
  rationale: γένος tidak dengan sendirinya menyatakan status adopsi atau relasi keselamatan sebagai anak; 'keturunan' menjaga cakupan argumen Paulus tentang asal-usul umat manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai orang kedua jamak secara jelas; susunan puitis tiga verba dipertahankan. Kutipan diberi tanda petik tanpa menambahkan identifikasi penyair yang tidak terdapat dalam ayat.
