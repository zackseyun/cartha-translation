id: ACT.17.12
reference: Acts 17:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πολλοὶ μὲν οὖν ἐξ αὐτῶν ἐπίστευσαν, καὶ τῶν Ἑλληνίδων γυναικῶν τῶν εὐσχημόνων καὶ ἀνδρῶν οὐκ ὀλίγοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/012.yaml
  text: Therefore many of them believed[b][a], and not a few of the prominent Greek women and men.
translation:
  language: id
  text: Karena itu, banyak dari antara mereka percaya, begitu pula tidak sedikit perempuan Yunani yang terpandang[a] dan laki-laki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang terhormat” atau “yang berkedudukan tinggi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ μὲν οὖν
  choice: Karena itu, banyak
  rationale: Gabungan partikel μὲν οὖν menandai peralihan sekaligus hasil dari tindakan orang Berea pada ayat sebelumnya. “Karena itu” menyampaikan hubungan tersebut secara wajar tanpa menerjemahkan setiap partikel secara terpisah.
- source_word: ἐξ αὐτῶν
  choice: dari antara mereka
  rationale: Ungkapan ini bersifat partitif dan menunjuk kembali kepada kelompok yang baru disebutkan. “Dari antara mereka” alami dalam bahasa Indonesia dan mempertahankan makna itu.
- source_word: ἐπίστευσαν
  choice: percaya
  rationale: Pilihan ini menerjemahkan πιστεύω secara langsung dan membiarkan objek kepercayaan dipahami dari konteks, sebagaimana dalam teks Yunani.
- source_word: τῶν Ἑλληνίδων γυναικῶν
  choice: perempuan Yunani
  rationale: Ἑλληνίδων menunjukkan bahwa para perempuan itu adalah orang Yunani, sedangkan γυναικῶν di sini berarti perempuan, bukan istri.
- source_word: τῶν εὐσχημόνων
  choice: yang terpandang
  rationale: Dalam konteks ini εὐσχήμων menunjuk pada kehormatan atau kedudukan sosial yang diakui. “Terpandang” ringkas, alami, dan tetap memungkinkan nuansa terhormat serta berkedudukan tinggi.
- source_word: καὶ ἀνδρῶν οὐκ ὀλίγοι
  choice: begitu pula tidak sedikit ... laki-laki
  rationale: “Tidak sedikit” mempertahankan litotes οὐκ ὀλίγοι, yang menyatakan jumlah cukup besar tanpa meratakannya menjadi sekadar “banyak.” “Begitu pula” menghubungkan kelompok tambahan secara alami.
theological_decisions:
- issue: Apakah ἐπίστευσαν perlu diterjemahkan dengan rumusan iman Kristen yang lebih eksplisit
  choice: percaya
  alternative: menjadi percaya kepada Mesias; percaya kepada pemberitaan itu
  rationale: Ayat ini tidak menyebutkan objeknya secara eksplisit. Terjemahan sederhana “percaya” menjaga rumusan teks dan membiarkan konteks menentukan objek kepercayaan tanpa menambahkan penjelasan doktrinal.
- issue: Cakupan keterangan εὐσχημόνων dan identitas Yunani pada kelompok laki-laki
  choice: “yang terpandang” ditempatkan langsung sesudah “perempuan Yunani,” sedangkan “laki-laki” dibiarkan tanpa sebutan Yunani yang diulang
  alternative: perempuan dan laki-laki Yunani yang terpandang
  rationale: Susunan Yunani secara eksplisit mengaitkan Ἑλληνίδων dan εὐσχημόνων dengan γυναικῶν, lalu menambahkan ἀνδρῶν. Terjemahan tidak memperluas kedua keterangan itu kepada para laki-laki secara pasti, sehingga tidak menutup kemungkinan sintaksis yang ada.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas dan bermartabat. Litotes “tidak sedikit” dipertahankan karena alami dalam bahasa Indonesia sekaligus mencerminkan gaya teks sumber. Penanda catatan kaki [a] ditempatkan tepat setelah kata yang dijelaskan.
