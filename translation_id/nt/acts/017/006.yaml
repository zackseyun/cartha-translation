  text: μὴ εὑρόντες δὲ αὐτοὺς ⸀ἔσυρον Ἰάσονα καί τινας ἀδελφοὺς ἐπὶ τοὺς πολιτάρχας, βοῶντες ὅτι Οἱ τὴν οἰκουμένην ἀναστατώσαντες οὗτοι καὶ ἐνθάδε πάρεισιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/006.yaml
  text: But when they did not find them[a], they dragged Jason and some brothers before the city authorities, shouting[c][b], “These men who have turned the world upside down have come here also,”
translation:
  language: id
  text: Namun, ketika tidak menemukan mereka, orang-orang itu menyeret Yason dan beberapa saudara seiman[a] ke hadapan para penguasa kota[b] sambil berteriak, “Orang-orang yang telah mengacaukan dunia[c] itu juga ada di sini,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “saudara seiman” secara harfiah berarti “saudara-saudara” dan di sini menunjuk kepada sesama orang percaya; sesuai konteks, sebutan jamak ini dapat mencakup perempuan.
    reason: lexical_alternative
  - marker: b
    text: Istilah Yunaninya adalah “politarkh”, gelar setempat di Makedonia bagi pejabat pemerintahan kota.
    reason: cultural_note
  - marker: c
    text: Atau “dunia yang berpenghuni”; ungkapan ini dapat menunjuk kepada dunia yang dikenal pada masa itu, sering kali khususnya wilayah Kekaisaran Romawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ εὑρόντες
  choice: ketika tidak menemukan mereka
  rationale: Partisip aoris dengan μή menyatakan keadaan yang mendahului tindakan utama; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan hubungan waktunya.
- source_word: ἔσυρον
  choice: menyeret
  rationale: Kata σύρω menyiratkan tarikan paksa secara fisik; “menyeret” mempertahankan kekerasan tindakan tersebut.
- source_word: τινας ἀδελφοὺς
  choice: beberapa saudara seiman
  rationale: Dalam konteks jemaat, ἀδελφοί menunjuk kepada sesama orang percaya. “Saudara seiman” jelas bagi pembaca modern tanpa memastikan bahwa kelompok itu hanya terdiri atas laki-laki.
- source_word: ἐπὶ τοὺς πολιτάρχας
  choice: ke hadapan para penguasa kota
  rationale: πολιτάρχης merupakan gelar pejabat kota khas Makedonia. Terjemahan fungsional ini menyampaikan bahwa Yason dan yang lain dibawa menghadap para pejabat tersebut.
- source_word: βοῶντες
  choice: sambil berteriak
  rationale: Partisip ini menggambarkan seruan keras yang menyertai tindakan menyeret mereka.
- source_word: οἱ τὴν οἰκουμένην ἀναστατώσαντες
  choice: orang-orang yang telah mengacaukan dunia
  rationale: ἀναστατόω berarti menimbulkan kekacauan atau pergolakan serius. “Mengacaukan” mempertahankan sifat tuduhan tanpa memasukkan gambaran harfiah yang tidak terdapat dalam kata Yunani; οἰκουμένη diterjemahkan secara alami sebagai “dunia” dengan cakupannya dijelaskan dalam catatan.
- source_word: οὗτοι καὶ ἐνθάδε πάρεισιν
  choice: itu sekarang ada juga di sini
  rationale: πάρειμι menyatakan keberadaan atau kehadiran. “Ada juga di sini” mempertahankan makna langsungnya, sedangkan “sekarang” membuat hasil kedatangan mereka wajar dalam bahasa Indonesia.
