  text: οὓς ὑποδέδεκται Ἰάσων· καὶ οὗτοι πάντες ἀπέναντι τῶν δογμάτων Καίσαρος πράσσουσι, βασιλέα ⸂ἕτερον λέγοντες⸃ εἶναι Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/007.yaml
  text: These men[a], whom Jason has welcomed, are all acting against Caesar’s decrees[c][b], saying that there is another king—Jesus.
translation:
  language: id
  text: Orang-orang ini, yang telah diterima Yason sebagai tamu,[a] semuanya bertindak menentang ketetapan-ketetapan Kaisar,[b] dengan mengatakan bahwa ada raja lain, yaitu Yesus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “diterima” atau “ditampung.” Kata Yunani ini dapat berarti menerima seseorang sebagai tamu atau memberinya tumpangan.
    reason: lexical_alternative
  - marker: b
    text: Atau “keputusan-keputusan resmi” atau “perintah-perintah.” Istilah ini menunjuk pada ketetapan penguasa.
    reason: lexical_alternative
  - marker: c
    text: Atau “raja yang berbeda.” Ungkapan Yunani secara harfiah menyebut “raja lain” dan menyajikan tuduhan tentang seorang raja tandingan bagi Kaisar.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδέδεκται
  choice: telah diterima sebagai tamu
  rationale: Bentuk perfektum menyatakan bahwa Yason telah menerima mereka dan tindakan itu tetap menjadi dasar tuduhan. Frasa ini secara alami menyampaikan nuansa penerimaan serta pemberian tumpangan.
- source_word: ἀπέναντι
  choice: menentang
  rationale: Dengan bentuk genitif, kata ini menyatakan pertentangan atau tindakan yang berlawanan dengan sesuatu; 'menentang' sesuai dengan konteks tuduhan hukum-politis.
- source_word: δογμάτων
  choice: ketetapan-ketetapan
  rationale: Dalam konteks pemerintahan Romawi, kata ini menunjuk pada keputusan atau aturan resmi. 'Ketetapan-ketetapan' jelas, formal, dan mudah dipahami.
- source_word: πράσσουσι
  choice: bertindak
  rationale: Bentuk kini menggambarkan perilaku yang sedang atau terus dilakukan; 'bertindak' mempertahankan daya verbal tuduhan tersebut.
- source_word: βασιλέα ἕτερον
  choice: raja lain
  rationale: βασιλεύς secara khusus berarti 'raja', sedangkan ἕτερον menunjuk kepada sosok lain atau berbeda sebagai tandingan. Pilihan ini mempertahankan bobot politis tuduhan.
- source_word: λέγοντες
  choice: dengan mengatakan
  rationale: Partisipel ini menjelaskan cara atau isi tindakan yang dituduhkan. 'Dengan mengatakan' tetap netral dan tidak menambahkan nada skeptis.
- source_word: εἶναι Ἰησοῦν
  choice: bahwa ada ... yaitu Yesus
  rationale: Susunan ini mengungkapkan isi ujaran tidak langsung secara wajar dalam bahasa Indonesia dan tetap menempatkan Yesus sebagai identifikasi raja yang dimaksud.
- source_word: οὗτοι πάντες
  choice: Orang-orang ini ... semuanya
  rationale: Susunan ini mempertahankan penunjukan kepada kelompok tertentu dan cakupan menyeluruh dari tuduhan.
theological_decisions:
- issue: Daya politis tuduhan bahwa Yesus adalah raja
  choice: Mempertahankan sebutan 'raja lain' sebagai tuduhan adanya klaim pemerintahan yang berhadapan dengan Kaisar.
  alternative: Melunakkan βασιλέα menjadi 'pemimpin' atau memahami kerajaan itu secara eksplisit hanya sebagai kerajaan rohani.
  rationale: Teks mengaitkan tuduhan tersebut langsung dengan ketetapan-ketetapan Kaisar. Terjemahan perlu mempertahankan ketegangan politis dan teologis ini tanpa menjelaskan atau melunakkannya secara denominatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-hukum yang jelas dan bermartabat. Nama Ἰάσων ditransliterasikan sebagai 'Yason', sedangkan Καῖσαρ dipertahankan sebagai gelar 'Kaisar'. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
