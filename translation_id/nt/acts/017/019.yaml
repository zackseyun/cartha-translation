id: ACT.17.19
reference: Acts 17:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπιλαβόμενοί ⸀τε αὐτοῦ ἐπὶ τὸν Ἄρειον Πάγον ἤγαγον, λέγοντες· Δυνάμεθα γνῶναι τίς ἡ καινὴ αὕτη ἡ ὑπὸ σοῦ λαλουμένη διδαχή;
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/019.yaml
  text: So they took hold of him and brought him to the Areopagus, saying, “May we know what this new teaching is that is being spoken by you?”
translation:
  language: id
  text: Lalu mereka memegang Paulus dan membawanya ke Areopagus[a], sambil berkata, “Bolehkah kami mengetahui ajaran baru apakah ini yang kamu sampaikan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Areopagus” dapat merujuk pada bukit itu sendiri atau pada dewan yang berkaitan dengannya; nama tradisional lainnya ialah “Bukit Mars”.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιλαβόμενοί
  choice: memegang
  rationale: Kata ini menyatakan tindakan fisik mengambil atau memegang seseorang. 'Memegang' mempertahankan kesan tegas tanpa menyimpulkan bahwa Paulus ditangkap secara resmi.
- source_word: τε
  choice: Lalu
  rationale: Partikel penghubung ringan ini melanjutkan alur cerita; 'lalu' terdengar alami dalam narasi Indonesia.
- source_word: ἐπὶ τὸν Ἄρειον Πάγον
  choice: ke Areopagus
  rationale: Transliterasi nama ini mempertahankan kemungkinan bahwa yang dimaksud ialah bukit tersebut atau dewan yang terkait dengannya.
- source_word: ἤγαγον
  choice: membawanya
  rationale: Bentuk dari ἄγω berarti memimpin atau membawa; 'membawanya' alami bersama keterangan tujuan.
- source_word: λέγοντες
  choice: Mereka berkata
  rationale: Partisipel ini menyertai tindakan utama. Kalimat mandiri menghasilkan bahasa Indonesia yang lebih wajar tanpa mengubah hubungan peristiwanya.
- source_word: Δυνάμεθα γνῶναι
  choice: Bolehkah kami mengetahui
  rationale: Ungkapan ini berfungsi sebagai permintaan yang sopan, bukan sekadar pertanyaan mengenai kemampuan.
- source_word: καινὴ
  choice: baru
  rationale: Kata καινός menunjuk pada sesuatu yang baru atau belum dikenal oleh para pendengar; 'baru' mempertahankan cakupan tersebut.
- source_word: ὑπὸ σοῦ λαλουμένη
  choice: yang kamu sampaikan
  rationale: Bentuk pasif Yunani secara harfiah berarti 'yang sedang diucapkan olehmu'. Dalam bahasa Indonesia, 'yang kamu sampaikan' lebih alami dan tetap menyatakan bahwa ajaran itu berasal dari tuturan Paulus.
- source_word: διδαχή
  choice: ajaran
  rationale: '''Ajaran'' merupakan padanan Indonesia yang jelas dan tidak seteknis ''doktrin''.'
theological_decisions:
- issue: Nuansa tindakan terhadap Paulus
  choice: Pendampingan fisik yang tegas, tetapi tidak dinyatakan sebagai penangkapan
  alternative: Mereka menangkap Paulus; atau mereka sekadar mengajaknya
  rationale: ἐπιλαμβάνομαι dapat menyiratkan tindakan fisik yang kuat, tetapi konteks langsung menonjolkan keingintahuan, bukan proses penangkapan yang dinyatakan secara eksplisit.
- issue: Arti Ἄρειος Πάγος
  choice: Nama 'Areopagus' tanpa menentukan apakah bukit atau dewan
  alternative: Bukit Mars; atau dewan Areopagus
  rationale: Ungkapan Yunani dapat menunjuk pada lokasi maupun badan yang terkait dengannya. Teks utama mempertahankan ambiguitas historis itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama Paulus digunakan untuk memperjelas rujukan pronomina dalam kutipan ayat yang berdiri sendiri. Susunan pasif Yunani dialihkan menjadi bentuk aktif yang alami dalam bahasa Indonesia, tanpa mengubah pelaku atau isi ajaran.
