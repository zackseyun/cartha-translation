  text: εὐθέως δὲ τότε τὸν Παῦλον ἐξαπέστειλαν οἱ ἀδελφοὶ πορεύεσθαι ⸀ἕως ἐπὶ τὴν θάλασσαν· ⸂ὑπέμεινάν τε⸃ ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/014.yaml
  text: Then the brothers immediately sent Paul away to go as far as the sea[b][a], but both Silas and Timothy remained there.
translation:
  language: id
  text: Kemudian saudara-saudara[a] segera mengirim Paulus pergi sampai ke pantai[b], tetapi Silas dan Timotius tetap tinggal di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudari”; kata Yunani yang diterjemahkan “saudara-saudara” dapat menunjuk kepada sesama orang percaya secara kolektif.
    reason: lexical_alternative
  - marker: b
    text: Atau “ke laut” atau “menuju laut”; ungkapan Yunani dapat berarti bergerak sampai ke kawasan pantai tanpa menjelaskan lebih lanjut.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως δὲ τότε
  choice: Saat itu juga ... segera
  rationale: Mengungkapkan peralihan waktu dan tindakan yang cepat dalam bahasa Indonesia yang alami, meskipun unsur kesegeraan dibuat eksplisit melalui 'segera'.
- source_word: ἐξαπέστειλαν
  choice: menyuruh ... pergi
  rationale: Dalam konstruksi dengan infinitif πορεύεσθαι, ungkapan ini secara alami menyatakan bahwa saudara-saudara mengatur atau memerintahkan keberangkatan Paulus.
- source_word: οἱ ἀδελφοὶ
  choice: saudara-saudara
  rationale: Mempertahankan bentuk maskulin jamak sumber; dalam konteks Kisah Para Rasul istilah ini juga dapat menunjuk kepada komunitas orang percaya secara kolektif.
- source_word: πορεύεσθαι
  choice: pergi
  rationale: Padanan sederhana dan alami bagi infinitif yang melengkapi tindakan menyuruh Paulus berangkat.
- source_word: ἕως ἐπὶ τὴν θάλασσαν
  choice: sampai ke pantai
  rationale: Menunjukkan gerak hingga kawasan laut atau pesisir tanpa menentukan apakah Paulus kemudian melanjutkan perjalanan melalui laut.
- source_word: ὑπέμεινάν
  choice: tetap tinggal
  rationale: Dalam konteks ini berarti tetap berada di tempat semula, berlawanan dengan keberangkatan Paulus, bukan bertahan dalam penderitaan.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: Silas dan Timotius
  rationale: Pasangan τε ... καὶ mencakup keduanya; bahasa Indonesia tidak memerlukan penanda khusus seperti 'baik ... maupun' dalam kalimat ini.
- source_word: ἐκεῖ
  choice: di sana
  rationale: Padanan lokatif yang alami dan langsung.
theological_decisions:
- issue: Cakupan ἀδελφοί bagi komunitas orang percaya
  choice: saudara-saudara
  alternative: saudara-saudari; orang-orang percaya
  rationale: Teks utama mempertahankan bentuk sumber, sementara catatan menjelaskan bahwa istilah itu dapat mencakup sesama orang percaya secara kolektif tanpa menetapkan bahwa hanya laki-laki yang dimaksud.
- issue: Arah perjalanan dalam ἕως ἐπὶ τὴν θάλασσαν
  choice: sampai ke pantai
  alternative: ke laut; menuju laut
  rationale: Pilihan ini mempertahankan gagasan bergerak sejauh pesisir dan tidak menyimpulkan bahwa Paulus pasti berlayar.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan naratif. Susunan penanda catatan [b][a] mengikuti titik keterkaitannya: [b] sesudah frasa tujuan dan [a] sesudah keseluruhan klausa yang memuat ''saudara-saudara''.'
