  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας ὑπεριδὼν ὁ θεὸς τὰ νῦν ⸀παραγγέλλει τοῖς ἀνθρώποις ⸀πάντας πανταχοῦ μετανοεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/030.yaml
  text: Therefore[a], having overlooked the times of ignorance, God now commands all people everywhere to repent[b],
translation:
  language: id
  text: Karena itu, setelah mengabaikan masa-masa ketidaktahuan itu[a], Allah sekarang memerintahkan semua orang di mana pun untuk bertobat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tidak memperhitungkan" atau "melewatkan". Maksudnya, dahulu Allah bersabar terhadap masa-masa ketidaktahuan itu, bukan menyetujuinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας
  choice: Karena itu, setelah ... masa-masa ketidaktahuan
  rationale: Frasa ini menjadi objek ὑπεριδών. 'Karena itu' menandai peralihan wacana, sedangkan 'masa-masa ketidaktahuan' mempertahankan bentuk jamak dan tidak menambahkan objek ketidaktahuan yang tidak dinyatakan secara eksplisit.
- source_word: ὑπεριδὼν
  choice: membiarkan berlalu
  rationale: Ungkapan ini menyampaikan bahwa Allah menahan tindakan penghakiman terhadap masa-masa tersebut, tanpa menyiratkan bahwa Ia menyetujui atau membenarkan ketidaktahuan itu.
- source_word: τὰ νῦν παραγγέλλει
  choice: sekarang ... memerintahkan
  rationale: Menjaga kontras waktu antara masa lampau dan keadaan sekarang serta mempertahankan kekuatan παραγγέλλω sebagai perintah.
- source_word: τοῖς ἀνθρώποις πάντας πανταχοῦ
  choice: semua orang di mana pun
  rationale: ἄνθρωποι digunakan secara generik bagi manusia, sementara πάντας dan πανταχοῦ menegaskan cakupan universal.
- source_word: μετανοεῖν
  choice: untuk bertobat
  rationale: '''Bertobat'' merupakan padanan baku yang mencakup perubahan pikiran dan arah hidup tanpa mempersempit maknanya menjadi perubahan intelektual semata.'
theological_decisions:
- issue: Tindakan Allah terhadap masa-masa ketidaktahuan
  choice: Allah membiarkan masa-masa itu berlalu dalam kesabaran-Nya, bukan menyetujuinya.
  alternative: Allah mengabaikan atau membenarkan ketidaktahuan dan dosa pada masa itu.
  rationale: ὑπεριδών mengungkapkan tindakan tidak langsung menjatuhkan penghakiman, sementara perintah sekarang untuk bertobat tetap mempertahankan tanggung jawab moral.
- issue: Cakupan perintah untuk bertobat
  choice: Perintah itu berlaku bagi semua manusia di segala tempat.
  alternative: Perintah itu hanya ditujukan kepada laki-laki atau hanya kepada bangsa-bangsa bukan Yahudi.
  rationale: Gabungan τοῖς ἀνθρώποις, πάντας, dan πανταχοῦ menyatakan cakupan manusia yang menyeluruh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan partisipial Yunani dibuat alami dengan 'setelah', sementara kontras masa lampau dan masa kini tetap jelas. Tanda koma akhir dipertahankan karena ayat berlanjut ke kalimat berikutnya.
