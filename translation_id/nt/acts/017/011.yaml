  text: οὗτοι δὲ ἦσαν εὐγενέστεροι τῶν ἐν Θεσσαλονίκῃ, οἵτινες ἐδέξαντο τὸν λόγον μετὰ πάσης προθυμίας, ⸀τὸ καθ’ ἡμέραν ἀνακρίνοντες τὰς γραφὰς εἰ ἔχοι ταῦτα οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/011.yaml
  text: These were more noble-minded than those in Thessalonica[a], for they received the word with all eagerness[b], examining the Scriptures daily to see whether these things were so.
translation:
  language: id
  text: Mereka lebih berbudi luhur daripada orang-orang di Tesalonika[a], sebab mereka menerima firman itu dengan segala kerelaan[b] dan setiap hari menyelidiki Kitab Suci untuk melihat apakah hal-hal itu memang demikian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “lebih mulia.” Kata Yunaninya dapat menunjuk pada watak yang lebih terpuji atau, meski tampaknya kurang mungkin di sini, kedudukan sosial yang lebih tinggi.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menyambut berita itu dengan penuh kesiapan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενέστεροι
  choice: lebih berbudi luhur
  rationale: Bentuk komparatif ini dapat menunjuk pada status sosial atau watak yang terpuji. Klausa berikutnya menjelaskan sikap mereka, sehingga terjemahan yang menonjolkan keluhuran budi paling sesuai sambil tetap mempertahankan nuansa evaluatifnya.
- source_word: οἵτινες
  choice: sebab mereka
  rationale: Kata ganti relatif ini memperkenalkan penjelasan mengenai alasan mereka disebut lebih berbudi luhur; 'sebab mereka' menyatakan fungsi penjelas itu secara alami dalam bahasa Indonesia.
- source_word: ἐδέξαντο τὸν λόγον
  choice: menerima firman itu
  rationale: '''Menerima'' mempertahankan makna dasar ἐδέξαντο, sedangkan ''firman'' menjaga gema naratif dan teologis λόγος dalam Kisah Para Rasul tanpa mempersempitnya menjadi sekadar informasi.'
- source_word: μετὰ πάσης προθυμίας
  choice: dengan penuh semangat
  rationale: Ungkapan ini menyatakan kesiapan, kerelaan, atau kesungguhan yang kuat. 'Dengan penuh semangat' alami dalam bahasa Indonesia dan mencerminkan daya penguat πάσης.
- source_word: τὸ καθ’ ἡμέραν
  choice: setiap hari
  rationale: Frasa ini berfungsi adverbial dan menyatakan tindakan yang dilakukan dari hari ke hari; 'setiap hari' jelas dan wajar.
- source_word: ἀνακρίνοντες
  choice: menyelidiki
  rationale: Kata ini dapat berarti memeriksa, menyelidiki, atau menanyai dengan saksama. Dalam konteks pengujian terhadap Kitab Suci, 'menyelidiki' menyampaikan pemeriksaan yang sungguh-sungguh tanpa terdengar terlalu teknis.
- source_word: τὰς γραφὰς
  choice: Kitab Suci
  rationale: Dalam konteks ini bentuk jamak γραφαί merujuk pada kumpulan tulisan suci Yahudi; 'Kitab Suci' adalah padanan baku dan mudah dipahami.
- source_word: εἰ ἔχοι ταῦτα οὕτως
  choice: untuk mengetahui apakah semuanya itu memang demikian
  rationale: Ungkapan ini menyatakan penyelidikan tidak langsung tentang kesesuaian hal-hal yang diberitakan dengan Kitab Suci. 'Memang demikian' mempertahankan pertanyaan apakah hal-hal itu benar-benar seperti yang dikatakan tanpa menambahkan kesimpulan.
theological_decisions:
- issue: Makna εὐγενέστεροι dalam konteks
  choice: watak terpuji ('lebih berbudi luhur')
  alternative: lebih mulia karena kelahiran atau kedudukan sosial
  rationale: Ayat ini sendiri menerangkan keluhuran mereka melalui kesediaan menerima firman dan menyelidiki Kitab Suci. Namun, kemungkinan leksikal mengenai status sosial tetap dicatat dalam catatan kaki.
- issue: Penerjemahan λόγος
  choice: '''firman'' dipertahankan dalam teks utama'
  alternative: '''berita'' atau ''pesan'''
  rationale: '''Firman'' mempertahankan kesinambungan ungkapan alkitabiah dalam Kisah Para Rasul, sedangkan catatan kaki menyediakan padanan komunikatif tanpa menambahkan klaim doktrinal.'
- issue: Sikap menerima dan menguji pemberitaan
  choice: kedua tindakan disajikan berdampingan tanpa menilai salah satunya sebagai lebih utama
  alternative: menafsirkan penyelidikan sebagai keraguan atau sebagai penerimaan tanpa sikap kritis
  rationale: Teks memuji baik penerimaan yang bersemangat maupun pemeriksaan Kitab Suci setiap hari; terjemahan mempertahankan ketegangan yang saling melengkapi itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Berbudi luhur' dipilih agar perbandingan watak terbaca alami tanpa langsung menghapus kemungkinan makna status sosial. Susunan kalimat dibuat lancar bagi pembaca umum, dan semua penanda catatan kaki dicantumkan dalam teks utama.
