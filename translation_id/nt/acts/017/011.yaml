  to: Mereka lebih berbudi luhur daripada orang-orang di Tesalonika[a], sebab mereka menerima firman itu dengan segala kerelaan[b] dan setiap hari menyelidiki Kitab Suci untuk melihat apakah hal-hal itu memang demikian.
