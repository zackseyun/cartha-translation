  text: ⸀οὕτως ὁ Παῦλος ἐξῆλθεν ἐκ μέσου αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/033.yaml
  text: So Paul went out from among them[a].
translation:
  language: id
  text: Demikianlah Paulus pergi meninggalkan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dengan demikian Paulus keluar dari tengah-tengah mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Demikianlah
  rationale: Di sini οὕτως berfungsi sebagai penghubung wacana yang menutup adegan tersebut. “Demikianlah” mempertahankan daya simpulan/naratifnya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: Παῦλος
  choice: Paulus
  rationale: Nama diri mengikuti bentuk baku yang lazim dalam bahasa Indonesia.
- source_word: ἐξῆλθεν
  choice: pergi meninggalkan
  rationale: Bentuk aoris ἐξέρχομαι menyatakan gerak keluar atau keberangkatan. “Pergi meninggalkan” terdengar alami dan, bersama frasa berikutnya, menyampaikan bahwa Paulus beranjak dari kelompok itu.
- source_word: ἐκ μέσου αὐτῶν
  choice: mereka
  rationale: Dalam konstruksi “pergi meninggalkan mereka,” objek “mereka” secara idiomatis menyampaikan bahwa Paulus keluar dari tengah-tengah hadirin; nuansa harfiahnya dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan mudah dipahami. Terjemahan utama mengutamakan kelancaran idiomatis, sedangkan catatan kaki mempertahankan bentuk spasial yang lebih harfiah dari ἐκ μέσου αὐτῶν.
