  text: Σταθεὶς ⸀δὲ Παῦλος ἐν μέσῳ τοῦ Ἀρείου Πάγου ἔφη· Ἄνδρες Ἀθηναῖοι, κατὰ πάντα ὡς δεισιδαιμονεστέρους ὑμᾶς θεωρῶ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/022.yaml
  text: So Paul[a], standing in the midst of the Areopagus, said, “Men of Athens, I see that in every way you are very religious.”
translation:
  language: id
  text: Lalu Paulus berdiri di tengah Areopagus dan berkata, “Hai para pria Atena, saya melihat bahwa dalam segala hal kalian sangat religius.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terlalu percaya pada takhayul” atau “lebih religius.” Kata Yunani ini dapat dipahami secara negatif ataupun positif.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς
  choice: berdiri
  rationale: Partisip aoris ini membentuk latar tindakan. Bentuk “berdiri” alami dalam bahasa Indonesia dan tidak memberi penekanan aspek yang berlebihan.
- source_word: δὲ
  choice: Lalu
  rationale: Partikel ini menandai peralihan ringan dalam narasi; “Lalu” memberikan alur wacana yang wajar tanpa nuansa pertentangan yang tidak diperlukan.
- source_word: ἐν μέσῳ τοῦ Ἀρείου Πάγου
  choice: di tengah-tengah Areopagus
  rationale: Terjemahan lokatif ini mempertahankan kemungkinan bahwa Areopagus menunjuk pada tempat atau badan persidangan, tanpa mempersempitnya menjadi “di hadapan sidang Areopagus.”
- source_word: Ἀρείου Πάγου
  choice: Areopagus
  rationale: Nama Yunani dipertahankan melalui transliterasi yang lazim, bukan diganti dengan padanan budaya Latin seperti “Bukit Mars.”
- source_word: ἔφη
  choice: berkata
  rationale: Imperfek φημί berfungsi sebagai pengantar ujaran sederhana dalam narasi; “berkata” merupakan bentuk Indonesia yang alami.
- source_word: Ἄνδρες Ἀθηναῖοι
  choice: Saudara-saudara warga Atena
  rationale: Sapaan ini terdengar formal dan alami dalam bahasa Indonesia, mempertahankan seruan langsung kepada orang-orang Atena tanpa ungkapan kaku “pria-pria Atena.”
- source_word: κατὰ πάντα
  choice: dalam segala hal
  rationale: Padanan ini mempertahankan cakupan luas ungkapan distributif Yunani.
- source_word: ὡς
  choice: bahwa
  rationale: Di sini ὡς memperkenalkan isi pengamatan Paulus; “bahwa” menghasilkan klausa Indonesia yang alami.
- source_word: δεισιδαιμονεστέρους
  choice: sangat religius
  rationale: Kata sifat komparatif ini dapat bernada positif atau negatif. “Sangat religius” menyampaikan penggunaan komparatif sebagai penguat secara alami, sementara kemungkinan makna negatif dan komparatif harfiah dicatat dalam catatan kaki.
- source_word: θεωρῶ
  choice: saya melihat
  rationale: θεωρέω menyatakan pengamatan atau persepsi; “saya melihat” ringkas, alami, dan sesuai dengan ragam pidato.
theological_decisions:
- issue: Nada penilaian Paulus terhadap agama orang Atena dalam δεισιδαιμονεστέρους
  choice: sangat religius
  alternative: terlalu percaya kepada takhayul; lebih religius
  rationale: Istilah Yunani ini lentur secara semantis dan mungkin sengaja dipakai secara diplomatis. Terjemahan negatif dalam teks utama akan terlalu cepat memastikan nada celaan, sedangkan bentuk komparatif “lebih religius” tidak menyebutkan pembandingnya. Teks utama memakai ungkapan yang relatif netral, dan ambiguitasnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam pidato yang formal tetapi mudah dipahami. “Saudara-saudara warga Atena” dipilih sebagai sapaan publik yang wajar; “kalian” menjaga pembedaan jamak dalam ujaran langsung. Nama Areopagus ditransliterasikan untuk mempertahankan ambiguitas antara lokasi dan badan persidangan.
