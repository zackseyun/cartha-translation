id: ACT.12.5
reference: Acts 12:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν Πέτρος ἐτηρεῖτο ἐν τῇ φυλακῇ· προσευχὴ δὲ ἦν ⸀ἐκτενῶς γινομένη ὑπὸ τῆς ἐκκλησίας πρὸς τὸν θεὸν ⸀περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/005.yaml
  text: So Peter was being kept in the prison[a], but earnest prayer was being made to God by the church for him.
translation:
  language: id
  text: Jadi, Petrus terus ditahan di dalam penjara, tetapi jemaat terus berdoa dengan sungguh-sungguh kepada Allah untuknya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan tekun”; kata Yunani yang digunakan dapat menekankan intensitas atau ketekunan dalam berdoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτηρεῖτο
  choice: terus ditahan
  rationale: Bentuk imperfek pasif menyatakan keadaan penahanan yang sedang berlangsung. Pilihan ini mempertahankan nuansa duratif dan pasif tanpa mempersempit makna menjadi cara penjagaan tertentu.
- source_word: ἐν τῇ φυλακῇ
  choice: di dalam penjara
  rationale: Frasa ini menunjuk pada tempat Petrus dikurung; 'penjara' merupakan padanan baku dan sesuai dengan ragam naratif.
- source_word: προσευχὴ ... ἦν ... γινομένη
  choice: terus berdoa
  rationale: Konstruksi perifrastis ἦν dengan partisip menunjukkan tindakan yang berlangsung. Bahasa Indonesia alami menyatakannya secara verbal dengan 'terus berdoa'.
- source_word: ἐκτενῶς
  choice: dengan sungguh-sungguh
  rationale: Adverbia ini dapat menekankan intensitas maupun ketekunan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kedua kemungkinan itu tanpa membatasinya secara berlebihan.
- source_word: ὑπὸ τῆς ἐκκλησίας
  choice: jemaat
  rationale: Dalam konteks ini ἐκκλησία menunjuk pada komunitas orang percaya yang berdoa, bukan terutama bangunan atau lembaga. 'Jemaat' paling jelas dan wajar dalam bahasa Indonesia.
- source_word: πρὸς τὸν θεὸν
  choice: kepada Allah
  rationale: πρός dengan objek personal menyatakan arah doa; 'kepada Allah' adalah ungkapan Indonesia yang alami.
- source_word: περὶ αὐτοῦ
  choice: untuknya
  rationale: Dalam konteks doa syafaat, περί dengan genitif berarti mendoakan kepentingan Petrus; 'untuknya' ringkas dan alami.
- source_word: μὲν οὖν ... δὲ
  choice: Jadi ... tetapi ...
  rationale: Pasangan partikel ini menggerakkan narasi sekaligus mengontraskan penahanan Petrus dengan doa jemaat.
theological_decisions:
- issue: Pemaknaan ἐκκλησία
  choice: jemaat
  alternative: gereja atau perhimpunan
  rationale: '''Jemaat'' menyatakan komunitas orang percaya yang berdoa dan menghindari kesan bahwa yang dimaksud terutama ialah gedung atau struktur kelembagaan.'
- issue: Intensitas atau ketekunan dalam ἐκτενῶς
  choice: dengan sungguh-sungguh
  alternative: dengan tekun atau dengan sangat giat
  rationale: Kata Yunani dapat menonjolkan intensitas atau ketekunan doa. Teks utama memakai ungkapan yang cukup luas, sedangkan catatan kaki menjaga kemungkinan nuansanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'terus' mempertahankan aspek berlangsung pada penahanan dan doa, sedangkan struktur kontras ayat tetap jelas.
