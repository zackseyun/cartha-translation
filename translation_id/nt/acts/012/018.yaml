  text: Γενομένης δὲ ἡμέρας ἦν τάραχος οὐκ ὀλίγος ἐν τοῖς στρατιώταις, τί ἄρα ὁ Πέτρος ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/018.yaml
  text: When day came[a], there was no small disturbance among the soldiers over what had become of Peter.
translation:
  language: id
  text: Ketika pagi tiba, terjadi kehebohan besar di antara para prajurit tentang apa yang telah terjadi pada Petrus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Ketika hari tiba
  rationale: Konstruksi genitif absolut menyatakan waktu, sedangkan δέ menandai peralihan. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan penanda wacana yang tidak dinyatakan secara eksplisit.
- source_word: τάραχος οὐκ ὀλίγος
  choice: kegemparan besar
  rationale: Litotes Yunani yang secara harfiah berarti 'kegemparan yang tidak kecil' menyatakan tingkat yang besar. Terjemahan positif ini lebih alami dalam bahasa Indonesia sambil mempertahankan intensitasnya.
- source_word: ἐν τοῖς στρατιώταις
  choice: di antara para prajurit
  rationale: στρατιώταις secara leksikal berarti 'prajurit'; 'di antara' menyatakan kelompok tempat kegemparan itu terjadi tanpa mempersempitnya menjadi 'penjaga'.
- source_word: τί ἄρα
  choice: mengenai apa
  rationale: Frasa ini memperkenalkan pertanyaan tidak langsung dengan nuansa kebingungan atau dugaan. 'Mengenai apa' menghubungkannya secara wajar dengan kegemparan para prajurit.
- source_word: ὁ Πέτρος
  choice: Petrus
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: ἐγένετο
  choice: telah terjadi dengan
  rationale: Dalam idiom τί ... ἐγένετο yang merujuk kepada seseorang, artinya ialah 'apa yang terjadi dengan' atau 'bagaimana nasibnya', bukan sekadar 'menjadi'.
