translation:
  language: id
  text: Ketika Petrus mengetuk pintu gerbang, seorang pelayan perempuan muda[a] bernama Rode datang untuk menjawab ketukan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "budak perempuan muda." Kata Yunani παιδίσκη dapat merujuk kepada pelayan perempuan muda atau budak perempuan muda; konteks ini tidak memastikan status hukumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρούσαντος δὲ αὐτοῦ
  choice: Ketika Petrus mengetuk
  rationale: Partisip aoris dengan δέ melanjutkan urutan cerita dan menyatakan waktu. Nama Petrus digunakan dalam bahasa Indonesia agar subjek pronominal tetap jelas dari konteks, tanpa mengubah acuannya.
- source_word: τὴν θύραν τοῦ πυλῶνος
  choice: pintu gerbang
  rationale: θύρα menunjuk pada pintu, sedangkan πυλών pada gerbang atau jalan masuk. 'Pintu gerbang' merupakan ungkapan Indonesia yang alami dan mempertahankan gambaran pintu pada gerbang luar rumah.
- source_word: προσῆλθε
  choice: datang
  rationale: Dalam adegan rumah tangga ini, προσέρχομαι paling alami diterjemahkan 'datang'; infinitif berikutnya menyatakan tujuannya.
- source_word: παιδίσκη
  choice: hamba perempuan
  rationale: παιδίσκη dapat menunjuk pada pelayan perempuan muda atau budak perempuan. 'Hamba perempuan' cukup alami, bermartabat, dan tidak memastikan status hukum yang tidak dijelaskan oleh konteks.
- source_word: ὑπακοῦσαι
  choice: untuk menjawab ketukan itu
  rationale: Dalam konteks seseorang mengetuk pintu, ὑπακούω berarti menanggapi atau menjawab ketukan. Objek tersirat dibuat eksplisit secara wajar dalam bahasa Indonesia.
- source_word: ὀνόματι Ῥόδη
  choice: bernama Rode
  rationale: Datif ὀνόματι memperkenalkan nama orang. Bentuk 'Rode' mengikuti penyesuaian nama Yunani Ῥόδη yang lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. 'Menjawab ketukan itu' dipakai agar makna kontekstual ὑπακοῦσαι langsung dipahami. Penanda catatan kaki [a] ditempatkan setelah nama Rode karena catatan menjelaskan sebutan bagi tokoh tersebut.
