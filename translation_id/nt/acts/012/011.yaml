id: ACT.12.11
reference: Acts 12:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ⸂ἐν ἑαυτῷ γενόμενος⸃ εἶπεν· Νῦν οἶδα ἀληθῶς ὅτι ἐξαπέστειλεν ⸀ὁ κύριος τὸν ἄγγελον αὐτοῦ καὶ ἐξείλατό με ἐκ χειρὸς Ἡρῴδου καὶ πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/011.yaml
  text: And Peter[a], coming to himself, said[c][b], “Now I truly know that the Lord sent his angel and rescued me from Herod’s hand and from all the expectation of the people of the Jews.”
translation:
  language: id
  text: Lalu Petrus tersadar[a] dan berkata, “Sekarang aku benar-benar tahu bahwa Tuhan telah mengutus malaikat-Nya dan menyelamatkan aku dari tangan Herodes[b] serta dari segala yang diharapkan orang-orang Yahudi[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kembali sadar” atau “sadar sepenuhnya.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “dari tangan Herodes” berarti dari kuasa atau kendali Herodes.
    reason: cultural_note
  - marker: c
    text: Atau, secara lebih harfiah, “dari seluruh harapan orang-orang Yahudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑαυτῷ γενόμενος
  choice: sadar akan dirinya
  rationale: Ungkapan ini menunjukkan bahwa Petrus kembali pada kesadaran penuh setelah pengalaman yang terasa seperti penglihatan. Pilihan ini mempertahankan citra Yunani, sementara catatan kaki memberi padanan idiomatis yang lebih langsung.
- source_word: ἀληθῶς
  choice: benar-benar
  rationale: Menyampaikan penegasan kuat dalam pengakuan Petrus dengan bahasa Indonesia modern dan alami.
- source_word: ἐξαπέστειλεν
  choice: telah mengutus
  rationale: Mengungkapkan tindakan pengutusan malaikat dengan wajar; aspek lampau yang hasilnya kini disadari Petrus dinyatakan dengan 'telah'.
- source_word: κύριος
  choice: Tuhan
  rationale: Mempertahankan sebutan κύριος tanpa menentukan secara lebih khusus apakah yang dimaksud adalah Allah atau Yesus yang bangkit.
- source_word: ἄγγελον
  choice: malaikat
  rationale: Konteks narasi jelas menunjuk kepada utusan surgawi, bukan sekadar utusan manusia.
- source_word: ἐξείλατό με
  choice: menyelamatkan aku
  rationale: Menyatakan pembebasan dari bahaya dan kuasa pihak yang menahan Petrus dengan jelas dalam bahasa Indonesia modern.
- source_word: ἐκ χειρὸς Ἡρῴδου
  choice: dari tangan Herodes
  rationale: Mempertahankan idiom sumber yang berarti keluar dari kuasa atau kendali Herodes dan tetap lazim dipahami dalam bahasa Indonesia.
- source_word: πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων
  choice: dari segala yang diharapkan orang-orang Yahudi
  rationale: Menjadikan objek harapan yang tersirat dalam bahasa Yunani terbaca secara alami, sambil mempertahankan keluasan πάσης dan tidak menetapkan secara terperinci hasil apa yang mereka nantikan.
theological_decisions:
- issue: Rujukan κύριος
  choice: Tuhan
  alternative: Allah; Yesus yang bangkit
  rationale: Teks Yunani hanya memakai κύριος. Terjemahan 'Tuhan' mempertahankan ketidakjelasan rujukan dan ketegangan teologis teks tanpa menentukannya secara denominatif.
- issue: Isi προσδοκία orang-orang Yahudi
  choice: segala yang diharapkan orang-orang Yahudi
  alternative: seluruh harapan orang-orang Yahudi; segala sesuatu yang hendak dilakukan orang-orang Yahudi terhadap Petrus
  rationale: Konstruksi Yunani menunjuk pada harapan atau penantian mereka, tetapi tidak secara eksplisit menyebut hasil akhirnya. Terjemahan tidak menambahkan bahwa yang diharapkan pasti kematian atau penghukuman Petrus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sementara idiom penting dari teks sumber dipertahankan dan dijelaskan melalui catatan kaki.
