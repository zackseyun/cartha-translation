id: ACT.12.17
reference: Acts 12:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κατασείσας δὲ αὐτοῖς τῇ χειρὶ σιγᾶν διηγήσατο αὐτοῖς πῶς ὁ κύριος αὐτὸν ἐξήγαγεν ἐκ τῆς φυλακῆς, εἶπέν ⸀τε· Ἀπαγγείλατε Ἰακώβῳ καὶ τοῖς ἀδελφοῖς ταῦτα. καὶ ἐξελθὼν ἐπορεύθη εἰς ἕτερον τόπον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/017.yaml
  text: But motioning to them with his hand to be silent[a], he explained to them how the Lord had brought him out of the prison. And he said, “Report these things to James and to the brothers.” Then he departed and went to another place.
translation:
  language: id
  text: Namun, sambil memberi isyarat dengan tangannya agar mereka diam, Petrus menjelaskan kepada mereka bagaimana Tuhan telah membawanya keluar dari penjara. Lalu katanya, “Sampaikanlah semua ini kepada Yakobus dan saudara-saudara[a].” Setelah itu, ia keluar dan pergi ke tempat lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudari”; teks Yunani berbunyi “saudara-saudara”, yang menurut konteks dapat merujuk kepada komunitas orang percaya yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασείσας ... τῇ χειρὶ σιγᾶν
  choice: sambil memberi isyarat dengan tangannya agar mereka diam
  rationale: Mengungkapkan tindakan fisik dan tujuan isyarat secara alami dalam bahasa Indonesia tanpa menentukan bentuk gerak tangan secara berlebihan.
- source_word: διηγήσατο
  choice: menjelaskan
  rationale: Kata ini menunjuk pada penyampaian kisah atau uraian mengenai peristiwa yang terjadi; 'menjelaskan' alami dalam konteks ini.
- source_word: πῶς
  choice: bagaimana
  rationale: Mempertahankan cara teks memperkenalkan isi uraian Petrus, yaitu cara Tuhan membawanya keluar.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Padanan baku dan wajar untuk κύριος dalam konteks ilahi, tanpa menentukan lebih lanjut apakah rujukannya secara khusus Yesus atau Allah.
- source_word: ἐξήγαγεν ἐκ τῆς φυλακῆς
  choice: telah membawanya keluar dari penjara
  rationale: Menyampaikan tindakan pembebasan yang sudah terjadi sebelum Petrus memberikan penjelasan.
- source_word: Ἀπαγγείλατε
  choice: Sampaikanlah
  rationale: Imperatif ini meminta para pendengar meneruskan informasi penting; 'sampaikanlah' jelas, alami, dan bermartabat.
- source_word: Ἰακώβῳ
  choice: Yakobus
  rationale: Bentuk nama yang baku dalam tradisi Alkitab bahasa Indonesia untuk Ἰάκωβος/Ἰακώβ.
- source_word: τοῖς ἀδελφοῖς
  choice: saudara-saudara
  rationale: Mempertahankan bentuk maskulin jamak Yunani, sementara kemungkinan cakupan komunitas orang percaya yang lebih luas dijelaskan dalam catatan kaki.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: ia keluar dan pergi
  rationale: 'Mempertahankan kedua unsur tindakan: meninggalkan lokasi saat itu dan bergerak menuju tempat lain.'
- source_word: εἰς ἕτερον τόπον
  choice: ke tempat lain
  rationale: Padanan sederhana dan alami yang mempertahankan ketidakspesifikan tempat tujuan.
theological_decisions:
- issue: Rujukan κύριος
  choice: Tuhan, dengan rujukan ilahi yang tidak diperinci
  alternative: Tuhan Yesus secara khusus; atau Allah secara lebih umum
  rationale: Teks hanya memakai ὁ κύριος. Terjemahan tidak mempersempit rujukan yang dibiarkan tidak eksplisit oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Nama Petrus dinyatakan untuk menghindari rentetan pronomina yang kurang jelas dalam bahasa Indonesia; rujukannya sudah tegas dari konteks. Bentuk 'saudara-saudara' dipertahankan dalam teks utama dengan catatan mengenai kemungkinan makna inklusif.
