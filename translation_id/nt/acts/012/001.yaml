  text: Κατ’ ἐκεῖνον δὲ τὸν καιρὸν ἐπέβαλεν Ἡρῴδης ὁ βασιλεὺς τὰς χεῖρας κακῶσαί τινας τῶν ἀπὸ τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/001.yaml
  text: About that time Herod the king laid hands on some from the church to mistreat them[a][b][c].
translation:
  language: id
  text: Sekitar waktu itu Raja Herodes mengambil tindakan terhadap beberapa orang dari jemaat untuk menganiaya mereka.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Pada waktu itu” atau “Kira-kira waktu itu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “meletakkan tangan pada.” Ungkapan ini menunjukkan tindakan bermusuhan terhadap beberapa orang dari jemaat.
    reason: lexical_alternative
  - marker: c
    text: Atau “mencelakakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατ’ ἐκεῖνον δὲ τὸν καιρόν
  choice: Kira-kira pada waktu itu
  rationale: κατά dengan ungkapan waktu berkasus akusatif menyatakan waktu secara kurang lebih, yakni 'kira-kira/sekitar pada waktu itu'. δέ berfungsi sebagai penghubung narasi yang ringan dan tidak perlu diterjemahkan dengan kata tersendiri.
- source_word: ἐπέβαλεν ... τὰς χεῖρας
  choice: mulai menindak
  rationale: Ungkapan harfiahnya ialah 'menimpakan tangan', tetapi dalam konteks ini menunjuk pada tindakan bermusuhan. 'Mulai menindak' alami dalam bahasa Indonesia, cukup luas untuk mencakup penangkapan maupun tindakan keras lain, dan sesuai dengan aspek ingresif yang dapat dibawa oleh aoristus bersama infinitif tujuan.
- source_word: Ἡρῴδης ὁ βασιλεύς
  choice: Raja Herodes
  rationale: Bentuk gelar di depan nama adalah susunan yang paling alami dalam bahasa Indonesia dan tetap menyampaikan aposisi Yunani.
- source_word: κακῶσαί
  choice: untuk menganiaya
  rationale: Kata ini berarti memperlakukan dengan buruk atau mendatangkan celaka. Dalam konteks tindakan penguasa terhadap anggota jemaat, 'menganiaya' menyampaikan perlakuan keras yang disengaja tanpa membatasi tindakan itu hanya pada penangkapan.
- source_word: τινας τῶν ἀπὸ τῆς ἐκκλησίας
  choice: beberapa orang dari jemaat
  rationale: Frasa ini menunjuk pada sejumlah orang yang berasal dari atau termasuk dalam komunitas Kristen. 'Beberapa orang dari jemaat' ringkas dan alami.
theological_decisions:
- issue: Penerjemahan ἐκκλησία
  choice: jemaat
  alternative: gereja; perhimpunan
  rationale: '''Jemaat'' dalam konteks Kisah Para Rasul dengan jelas menunjuk pada komunitas orang percaya, bukan gedung atau lembaga, serta merupakan istilah Indonesia yang baku dan alami.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Ungkapan Yunani diterjemahkan secara idiomatis, sedangkan arti harfiahnya dipertahankan dalam catatan kaki.
