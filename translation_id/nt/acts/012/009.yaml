  naturalness: Bahasa naratifnya baku dan mudah dipahami. "Ia sedang melihat suatu penglihatan" agak literal, tetapi tetap wajar dalam register Alkitab dan mempertahankan konstruksi ἐδόκει ... βλέπειν.
  terminology: '"Petrus," "malaikat," dan "penglihatan" merupakan istilah yang tepat dan lazim. Catatan kaki perlu ditambahkan pada "melalui malaikat itu" untuk mempertahankan alternatif agensi "oleh malaikat itu," sebagaimana ditandai dalam jejak audit Inggris.'
