  text: καὶ ἐξελθὼν ⸀ἠκολούθει, καὶ οὐκ ᾔδει ὅτι ἀληθές ἐστιν τὸ γινόμενον διὰ τοῦ ἀγγέλου, ἐδόκει δὲ ὅραμα βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/009.yaml
  text: And he went out and followed[a], and he did not know that what was happening through the angel was real, but thought he was seeing a vision.
translation:
  language: id
  text: Lalu Petrus keluar dan mengikuti malaikat itu. Ia tidak tahu bahwa apa yang sedang terjadi melalui malaikat itu[a] nyata, tetapi ia menyangka bahwa ia sedang melihat suatu penglihatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "oleh malaikat itu." Bahasa Yunani dapat menyatakan agensi; "melalui malaikat itu" mempertahankan nuansa perantaraan dari διά dengan genetif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: keluar
  rationale: Partisip aoristus ini menyatakan tindakan yang mendahului tindakan utama; koordinasi dengan “lalu” menghasilkan narasi Indonesia yang alami tanpa menghilangkan urutannya.
- source_word: ἠκολούθει
  choice: mengikuti malaikat itu
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung. Objek tersiratnya dijelaskan sebagai malaikat dari konteks langsung agar kalimat Indonesia tidak terasa menggantung.
- source_word: οὐκ ᾔδει
  choice: Ia tidak tahu
  rationale: Ungkapan langsung dan wajar untuk menyatakan bahwa Petrus tidak mengetahui atau menyadari kenyataan peristiwa tersebut.
- source_word: ἀληθές
  choice: benar-benar nyata
  rationale: Dalam pertentangan dengan penglihatan, kata ini menunjuk pada kenyataan faktual dari pengalaman itu; “benar-benar nyata” terdengar alami dan menegaskan kontras tanpa mengubah makna.
- source_word: τὸ γινόμενον
  choice: apa yang sedang terjadi
  rationale: Partisip berartikel menunjuk kepada peristiwa yang tengah berlangsung; bentuk ini mempertahankan aspek progresifnya.
- source_word: διὰ τοῦ ἀγγέλου
  choice: melalui malaikat itu
  rationale: διά dengan genitif menyatakan perantaraan atau agensi; “melalui” mempertahankan nuansa tindakan yang diperantarai.
- source_word: ἐδόκει
  choice: menyangka
  rationale: Kata ini mengungkapkan anggapan Petrus tentang apa yang dialaminya; “menyangka” alami dan menandai bahwa persepsinya keliru.
- source_word: ὅραμα
  choice: suatu penglihatan
  rationale: Padanan baku dan cukup luas bagi pengalaman visual luar biasa atau pewahyuan, tanpa menambahkan penafsiran.
- source_word: βλέπειν
  choice: sedang melihat
  rationale: Infinitif ini melengkapi ἐδόκει dan menggambarkan apa yang Petrus sangka sedang dialaminya.
theological_decisions:
- issue: Sifat tindakan malaikat
  choice: melalui malaikat itu
  alternative: oleh malaikat itu
  rationale: Pilihan “melalui” mempertahankan kemungkinan agensi yang diperantarai dalam διά dengan genitif dan tidak menyatakan lebih jauh apakah kuasa itu berasal secara mandiri dari malaikat.
translation_notes:
  register: Bahasa Indonesia baku modern, naratif, dan bermartabat. Nama Petrus serta objek “malaikat itu” dinyatakan untuk kejernihan rujukan dalam bahasa Indonesia; tidak ada catatan kaki karena alternatif “oleh malaikat itu” tidak menimbulkan perbedaan makna yang cukup penting untuk edisi pembaca umum.
