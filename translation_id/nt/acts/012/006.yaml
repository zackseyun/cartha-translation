translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Struktur kalimat dibagi menjadi dua agar mudah dibaca tanpa menghilangkan hubungan waktunya. Pengulangan nama Petrus menjaga kejelasan rujukan. Penanda catatan [b] ditempatkan pada frasa yang benar-benar dijelaskan oleh catatan, yaitu “menjaga penjara”.
