  text: Ὅτε δὲ ἤμελλεν ⸂προαγαγεῖν αὐτὸν⸃ ὁ Ἡρῴδης, τῇ νυκτὶ ἐκείνῃ ἦν ὁ Πέτρος κοιμώμενος μεταξὺ δύο στρατιωτῶν δεδεμένος ἁλύσεσιν δυσίν, φύλακές τε πρὸ τῆς θύρας ἐτήρουν τὴν φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/006.yaml
  text: When Herod was about to bring him out[a], on that very night Peter was sleeping between two soldiers, bound with two chains[b], and guards before the door were keeping watch over the prison.
translation:
  language: id
  text: Ketika Herodes hendak membawa Petrus keluar[a], pada malam itu juga Petrus sedang tidur di antara dua prajurit, terbelenggu oleh dua rantai, dan para penjaga di depan pintu sedang menjaga penjara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membawa Petrus ke hadapan.” Kata Yunani yang digunakan dapat menunjuk pada tindakan membawa seseorang keluar untuk tampil di depan umum atau untuk diadili.
    reason: lexical_alternative
  - marker: b
    text: Atau “sedang mengawasi penjara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμελλεν
  choice: hendak
  rationale: Dalam konteks ini μέλλω menunjukkan tindakan Herodes yang segera akan dilakukan; “hendak” mengungkapkan maksud sekaligus kedekatan waktunya secara alami.
- source_word: προαγαγεῖν αὐτόν
  choice: membawa Petrus keluar
  rationale: προάγω di sini menunjuk pada membawa Petrus keluar dari tahanan untuk dihadapkan dalam proses publik. Nama “Petrus” dipakai agar rujukan pronomina jelas dalam bahasa Indonesia.
- source_word: τῇ νυκτὶ ἐκείνῃ
  choice: pada malam itu juga
  rationale: Ungkapan ini mempertahankan kekhususan dan penekanan demonstratif ἐκείνῃ serta ketegangan narasi.
- source_word: κοιμώμενος
  choice: sedang tidur
  rationale: Bentuk partisipel kini menggambarkan tindakan yang sedang berlangsung.
- source_word: μεταξὺ δύο στρατιωτῶν
  choice: di antara dua prajurit
  rationale: Padanan spasial yang langsung, jelas, dan alami.
- source_word: δεδεμένος ἁλύσεσιν δυσίν
  choice: terbelenggu dengan dua rantai
  rationale: “Terbelenggu” menyatakan keadaan hasil dari tindakan sebelumnya, sedangkan “dengan dua rantai” mempertahankan jumlah dan sarana pengikat.
- source_word: φύλακες πρὸ τῆς θύρας
  choice: para penjaga di depan pintu
  rationale: Terjemahan ini mempertahankan pelaku dan letak mereka secara jelas.
- source_word: ἐτήρουν τὴν φυλακήν
  choice: sedang menjaga penjara
  rationale: τηρέω menyatakan tindakan menjaga yang berlangsung, sedangkan φυλακή dalam konteks ini paling wajar dipahami sebagai penjara.
