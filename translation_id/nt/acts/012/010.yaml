id: ACT.12.10
reference: Acts 12:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διελθόντες δὲ πρώτην φυλακὴν καὶ δευτέραν ἦλθαν ἐπὶ τὴν πύλην τὴν σιδηρᾶν τὴν φέρουσαν εἰς τὴν πόλιν, ἥτις αὐτομάτη ἠνοίγη αὐτοῖς, καὶ ἐξελθόντες προῆλθον ῥύμην μίαν, καὶ εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/010.yaml
  text: After they had passed the first guard and the second[a], they came to the iron gate leading into the city, which opened to them by itself; and after they went out, they went along one street[b], and immediately the angel departed from him.
translation:
  language: id
  text: Setelah melewati pos penjagaan pertama dan kedua, mereka sampai di pintu gerbang besi yang menuju ke dalam kota. Pintu itu terbuka dengan sendirinya bagi mereka.[a] Sesudah keluar, mereka berjalan sejauh satu jalan,[b] dan segera malaikat itu meninggalkan Petrus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terbuka bagi mereka atas kehendaknya sendiri.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “satu jalan” kemungkinan berarti mereka berjalan sejauh satu jalan sebelum malaikat itu meninggalkan Petrus.
    reason: cultural_note
lexical_decisions:
- source_word: διελθόντες
  choice: Setelah melewati
  rationale: Partisip aoris menunjukkan tindakan yang selesai sebelum mereka tiba di gerbang; bentuk ini alami dan mempertahankan urutan waktu.
- source_word: πρώτην φυλακὴν καὶ δευτέραν
  choice: pos penjagaan pertama dan kedua
  rationale: Dalam konteks pelarian melalui beberapa lapis pengamanan, φυλακή paling wajar menunjuk pada tempat atau lapis penjagaan, bukan penjara yang berbeda.
- source_word: πύλην τὴν σιδηρᾶν
  choice: pintu gerbang besi
  rationale: Menjaga penekanan pada bahan gerbang dan memakai ungkapan Indonesia yang lazim.
- source_word: τὴν φέρουσαν εἰς τὴν πόλιν
  choice: yang menuju ke dalam kota
  rationale: Partisip ini menjelaskan bahwa gerbang tersebut memberi jalan masuk ke kota.
- source_word: αὐτομάτη
  choice: dengan sendirinya
  rationale: Menyampaikan bahwa gerbang terbuka tanpa tindakan manusia, tanpa konotasi mekanis modern dari kata 'otomatis'.
- source_word: ἐξελθόντες
  choice: Sesudah keluar
  rationale: Mempertahankan urutan naratif yang ditandai partisip aoris.
- source_word: προῆλθον ῥύμην μίαν
  choice: mereka berjalan menyusuri satu ruas jalan
  rationale: ῥύμη dapat berarti jalan atau lorong, sedangkan μίαν dalam konstruksi ini kemungkinan menyatakan jarak sejauh satu jalan; 'satu ruas jalan' terdengar alami dan tetap cukup dekat dengan bentuk sumber.
- source_word: εὐθέως ἀπέστη
  choice: lalu tiba-tiba ... meninggalkan
  rationale: Dalam konteks lenyapnya pendamping secara tak terduga, 'tiba-tiba' menyampaikan peralihan mendadak yang dinyatakan εὐθέως dengan lebih alami daripada 'segera'.
- source_word: ἀπ’ αὐτοῦ
  choice: meninggalkan Petrus
  rationale: Mengganti pronomina dengan nama rujukannya menghindari ambiguitas dalam bahasa Indonesia tanpa mengubah identitas tokoh.
theological_decisions:
- issue: Sifat terbukanya gerbang
  choice: Pintu itu terbuka dengan sendirinya bagi mereka
  alternative: Pintu itu terbuka bagi mereka atas kemauannya sendiri
  rationale: Teks menyatakan kejadian luar biasa tanpa menjelaskan mekanismenya. Terjemahan ini mempertahankan hal tersebut dan tidak memasukkan gambaran teknologi otomatis.
- issue: Rujukan φυλακή
  choice: pos penjagaan pertama dan kedua
  alternative: penjagaan pertama dan kedua
  rationale: Konteks menggambarkan mereka melewati lapisan-lapisan pengamanan. 'Pos penjagaan' memperjelas rujukan konkret tanpa menambahkan gagasan tentang dua penjara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang jelas dan bermartabat. Kalimat Yunani yang panjang dibagi agar mudah dipahami. Nama Petrus dipakai pada akhir ayat untuk memperjelas rujukan pronomina.
