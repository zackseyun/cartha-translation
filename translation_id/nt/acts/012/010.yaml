revisions:
- from: Setelah melewati pos penjagaan pertama dan kedua, mereka sampai di pintu gerbang besi yang menuju ke dalam kota. Pintu itu terbuka dengan sendirinya bagi mereka.[a] Sesudah keluar, mereka berjalan menyusuri satu ruas jalan,[b] lalu tiba-tiba malaikat itu meninggalkan Petrus.
  to: Setelah melewati pos penjagaan pertama dan kedua, mereka sampai di pintu gerbang besi yang menuju ke dalam kota. Pintu itu terbuka dengan sendirinya bagi mereka.[a] Sesudah keluar, mereka berjalan sejauh satu jalan,[b] dan segera malaikat itu meninggalkan Petrus.
  rationale: Revisi mengganti “tiba-tiba” dengan “segera” untuk mencerminkan εὐθέως secara lebih tepat. Frasa perjalanan disederhanakan menjadi “berjalan sejauh satu jalan” agar lebih alami dalam bahasa Indonesia dan tetap menyampaikan kemungkinan makna ukuran jarak. Catatan a diperbaiki menjadi alternatif leksikal yang idiomatis dan tidak keliru disebut harfiah. Struktur, rujukan catatan, dan makna perikop tetap terjaga.
