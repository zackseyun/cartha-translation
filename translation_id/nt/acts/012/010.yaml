review_pass:
  verdict: revise
  source_fidelity: Sebagian besar setia pada urutan dan makna teks Yunani. Namun, εὐθέως berarti “segera/langsung” dan tidak terutama menandai kejadian yang mendadak; “lalu tiba-tiba” menggeser nuansa temporal. Catatan a juga menyebut “secara harfiah” tetapi parafrasenya (“atas kemauannya sendiri”) tidak alami dan kurang tepat sebagai padanan αὐτομάτη.
  naturalness: Bahasa draf umumnya baku dan jelas. “Pintu itu terbuka dengan sendirinya bagi mereka” dan “pos penjagaan pertama dan kedua” terdengar alami. “Sejauh satu jalan” lebih langsung dan idiomatis untuk konstruksi ῥύμην μίαν daripada “menyusuri satu ruas jalan,” sambil membiarkan fungsi μίαν sebagai ukuran jarak tetap jelas.
  terminology: “Pos penjagaan,” “pintu gerbang besi,” dan “malaikat” tepat dalam register modern baku. Penyebutan “Petrus” pada akhir ayat secara wajar memperjelas αὐτοῦ. Tidak ada istilah teologis yang perlu diubah.
  issues:
  - severity: medium
    issue: “lalu tiba-tiba” untuk εὐθέως
    rationale: εὐθέως menekankan kesegeraan urutan peristiwa (“segera” atau “langsung”), bukan sifat mendadak (“tiba-tiba”).
  - severity: low
    issue: Catatan a menyatakan “Secara harfiah” dan memakai “atas kemauannya sendiri.”
    rationale: Catatan itu tidak memberikan alternatif Indonesia yang wajar untuk αὐτομάτη. “Dengan sendirinya” sudah baik; alternatif yang lebih idiomatis adalah “atas kehendaknya sendiri,” tanpa klaim sebagai terjemahan harfiah.
  revised_text: Setelah melewati pos penjagaan pertama dan kedua, mereka sampai di pintu gerbang besi yang menuju ke dalam kota. Pintu itu terbuka dengan sendirinya bagi mereka.[a] Sesudah keluar, mereka berjalan sejauh satu jalan,[b] dan segera malaikat itu meninggalkan Petrus.
  revised_footnotes:
