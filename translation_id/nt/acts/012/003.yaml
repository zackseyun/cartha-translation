    rationale: Keterangan ini melampaui frasa Yunani ἡμέραι τῶν ἀζύμων dan dapat memberi kesan urutan yang terlalu kaku. Catatan sebaiknya hanya menjelaskan perayaan Roti Tidak Beragi tanpa menyamakan atau menetapkan relasi kronologis secara berlebihan dengan Paskah.
