  naturalness: Bahasa umumnya baku dan jelas. “Ia kemudian menangkap Petrus juga” lebih alami, ringkas, dan tepat dalam narasi Indonesia daripada “ia melanjutkan tindakannya dengan menangkap Petrus juga.”
  terminology: “orang-orang Yahudi” dan “Hari Raya Roti Tidak Beragi” tepat serta mempertahankan keterbukaan dan ketepatan istilah sumber. Catatan b perlu tidak menyatakan secara terlalu tegas bahwa perayaan itu “sesudah Paskah,” karena istilah Yunani sendiri hanya menyebut hari-hari Roti Tidak Beragi dan hubungan penanggalannya dengan Paskah perlu tidak dipersempit.
