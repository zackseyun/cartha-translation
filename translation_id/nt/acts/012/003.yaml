  text: ⸂ἰδὼν δὲ⸃ ὅτι ἀρεστόν ἐστιν τοῖς Ἰουδαίοις προσέθετο συλλαβεῖν καὶ Πέτρον (ἦσαν ⸀δὲ ἡμέραι τῶν ἀζύμων),
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/003.yaml
  text: And when he saw that it was pleasing to the Jews[a], he proceeded to arrest Peter also[b]. (Now these were the days of Unleavened Bread.)
translation:
  language: id
  text: Ketika Herodes melihat bahwa hal itu menyenangkan orang-orang Yahudi[a], ia kemudian menangkap Petrus juga. (Saat itu sedang berlangsung Hari Raya Roti Tidak Beragi[b].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Yudea,” atau, jika dipersempit berdasarkan konteks, “para pemimpin Yahudi.” Istilah Yunani dapat memiliki arti-arti tersebut dalam konteks tertentu, tetapi di sini teks hanya menyebut “orang-orang Yahudi.”
    reason: lexical_alternative
  - marker: b
    text: Yaitu masa perayaan yang ditandai dengan makan roti tanpa ragi.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Ketika Herodes melihat
  rationale: Partisip aoris ini paling wajar dipahami secara temporal dan menunjukkan bahwa persepsi tersebut mendahului tindakan berikutnya. Nama Herodes dijelaskan dari konteks dekat agar subjek tetap jelas dalam bahasa Indonesia.
- source_word: ἀρεστόν ἐστιν
  choice: hal itu menyenangkan hati
  rationale: Ungkapan ini menyampaikan bahwa tindakan sebelumnya mendapat sambutan baik; bentuk Indonesia ini alami dan tetap mempertahankan nuansa 'menyenangkan'.
- source_word: τοῖς Ἰουδαίοις
  choice: orang-orang Yahudi
  rationale: Istilah Yunani secara eksplisit menyebut orang-orang Yahudi dan tidak secara tegas membatasi rujukannya pada para pemimpin atau penduduk Yudea.
- source_word: προσέθετο συλλαβεῖν
  choice: ia melanjutkan tindakannya dengan menangkap
  rationale: Konstruksi προστίθημι dengan infinitif berarti meneruskan atau melakukan tindakan tambahan, bukan secara harfiah sekadar 'menambahkan'.
- source_word: καὶ Πέτρον
  choice: Petrus juga
  rationale: καί bersifat aditif dan menampilkan Petrus sebagai sasaran berikutnya setelah Yakobus.
- source_word: ἦσαν δὲ ἡμέραι τῶν ἀζύμων
  choice: Saat itu sedang berlangsung Hari Raya Roti Tidak Beragi
  rationale: Ini mengungkapkan latar waktu secara alami sambil mempertahankan nama khusus perayaan yang disebut oleh teks Yunani.
theological_decisions:
- issue: Cakupan τοῖς Ἰουδαίοις dalam Kisah Para Rasul
  choice: orang-orang Yahudi
  alternative: orang-orang Yudea; para pemimpin Yahudi
  rationale: Teks tidak secara eksplisit mempersempit kelompok itu secara geografis atau hanya kepada pemimpin. Terjemahan utama mempertahankan cakupan leksikal yang terbuka, sedangkan alternatif dicatat agar ambiguitas kontekstual tidak disembunyikan.
- issue: Penyebutan τῶν ἀζύμων
  choice: Hari Raya Roti Tidak Beragi
  alternative: Paskah
  rationale: Bahasa Yunani secara khusus menyebut masa Roti Tidak Beragi. Walaupun berkaitan erat dengan Paskah, kedua sebutan itu tidak disamakan dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang jelas dan bermartabat. Istilah perayaan dipertahankan sebagai nama khusus yang mudah dikenali; tanda kurung mempertahankan sifat keterangan latar dalam teks.
