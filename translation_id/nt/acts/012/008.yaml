  text: εἶπεν ⸀δὲ ὁ ἄγγελος πρὸς αὐτόν· ⸀Ζῶσαι καὶ ὑπόδησαι τὰ σανδάλιά σου· ἐποίησεν δὲ οὕτως. καὶ λέγει αὐτῷ· Περιβαλοῦ τὸ ἱμάτιόν σου καὶ ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/008.yaml
  text: And the angel said to him[a], “Tie on your belt and put on your sandals.” And he did so. And he says to him[c][b], “Put on your cloak and follow me.”
translation:
  language: id
  text: Lalu malaikat itu berkata kepadanya, “Ikatlah ikat pinggangmu[a] dan kenakanlah sandalmu.” Petrus pun melakukannya. Kemudian malaikat itu berkata[b] kepadanya, “Kenakanlah jubahmu[c] dan ikutlah aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kenakan ikat pinggangmu.” Perintah Yunani ini mengacu pada mengencangkan ikat pinggang agar siap bergerak.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Yunani memakai bentuk kala kini, “berkata,” sebagai kala kini historis untuk menghidupkan penuturan.
    reason: lexical_alternative
  - marker: c
    text: Atau, “Selubungkan jubahmu di sekeliling tubuhmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: malaikat
  rationale: Dalam konteks kisah ini, yang dimaksud adalah makhluk surgawi yang muncul di penjara, sehingga 'malaikat' lebih tepat daripada istilah umum 'utusan'.
- source_word: Ζῶσαι
  choice: Ikatlah ikat pinggangmu
  rationale: Bentuk perintah ini menunjuk pada tindakan mengencangkan ikat pinggang sebagai persiapan untuk bergerak; ungkapan ini konkret dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: ὑπόδησαι τὰ σανδάλιά σου
  choice: kenakanlah sandalmu
  rationale: Ungkapan ini secara langsung menyuruh Petrus memakai sandalnya; 'kenakanlah' menjaga nada perintah yang bermartabat dan alami.
- source_word: ἐποίησεν δὲ οὕτως
  choice: Petrus pun melakukannya
  rationale: Subjek tersirat dijelaskan sebagai Petrus agar rujukannya alami dan tidak rancu dalam bahasa Indonesia, sedangkan 'pun' menyampaikan kelanjutan narasi.
- source_word: λέγει
  choice: berkata
  rationale: Kala kini historis Yunani berfungsi menghidupkan narasi, tetapi dalam bahasa Indonesia bentuk verba tidak menandai kala; 'berkata' menyampaikan tindakan ujaran secara alami, dengan peralihan narasi dinyatakan oleh 'Kemudian'.
- source_word: Περιβαλοῦ τὸ ἱμάτιόν σου
  choice: Kenakanlah jubahmu
  rationale: ἱμάτιον di sini adalah pakaian luar atau jubah, dan περιβάλλω berarti mengenakannya dengan menyampirkannya pada tubuh. 'Kenakanlah jubahmu' merupakan padanan alami tanpa menambahkan cara yang tidak perlu.
- source_word: ἀκολούθει μοι
  choice: ikutlah aku
  rationale: Perintah ini meminta Petrus bergerak mengikuti malaikat. 'Ikutlah aku' idiomatis dalam bahasa Indonesia dan tetap mempertahankan gagasan mengikuti.
theological_decisions: []
