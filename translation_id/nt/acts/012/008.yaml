  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama Petrus dieksplisitkan sekali demi kejelasan rujukan. Semua penanda catatan kaki ditempatkan langsung pada bagian teks yang diterangkannya.
