id: ACT.12.23
reference: Acts 12:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: παραχρῆμα δὲ ἐπάταξεν αὐτὸν ἄγγελος κυρίου ἀνθ’ ὧν οὐκ ἔδωκεν ⸀τὴν δόξαν τῷ θεῷ, καὶ γενόμενος σκωληκόβρωτος ἐξέψυξεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/023.yaml
  text: Immediately an angel of the Lord struck him[a], because he did not give the glory to God, and becoming worm-eaten[c][b], he died.
translation:
  language: id
  text: Seketika itu juga seorang malaikat Tuhan memukul Herodes karena ia tidak memberikan kemuliaan kepada Allah. Ia pun dimakan cacing, lalu meninggal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: Seketika itu juga
  rationale: Ungkapan ini menyampaikan bahwa tindakan tersebut terjadi tanpa penundaan dan mempertahankan kesan mendadak dalam teks Yunani.
- source_word: ἐπάταξεν αὐτὸν
  choice: memukul Herodes
  rationale: Verba ἐπάταξεν berarti memukul atau menghantam. Nama “Herodes” dipakai sebagai pengganti pronomina agar rujukannya jelas dalam bahasa Indonesia, tanpa menyiratkan bahwa ia langsung tewas oleh pukulan itu.
- source_word: ἄγγελος κυρίου
  choice: seorang malaikat Tuhan
  rationale: Nomina Yunani tidak memakai artikel; bentuk tak tentu “seorang malaikat” paling wajar di sini. “Tuhan” mempertahankan gelar κύριος.
- source_word: ἀνθ’ ὧν
  choice: karena
  rationale: Dalam konteks ini, ungkapan tersebut menyatakan alasan penghukuman secara jelas dan alami.
- source_word: οὐκ ἔδωκεν τὴν δόξαν τῷ θεῷ
  choice: ia tidak memberikan kemuliaan kepada Allah
  rationale: Terjemahan ini mempertahankan tindakan mengakui atau mempersembahkan kemuliaan yang semestinya ditujukan kepada Allah.
- source_word: γενόμενος σκωληκόβρωτος
  choice: Ia pun dimakan cacing
  rationale: Ungkapan ini mempertahankan gambaran kuat bahwa tubuh Herodes menjadi sasaran santapan cacing, sambil mengungkapkan konstruksi partisipial Yunani secara alami dalam bahasa Indonesia.
- source_word: ἐξέψυξεν
  choice: lalu meninggal
  rationale: Verba ini berarti mengembuskan napas terakhir atau mati. “Meninggal” merupakan ungkapan bahasa Indonesia yang alami, sedangkan “lalu” menunjukkan urutan naratif tanpa menetapkan rincian medis atau jarak waktunya.
theological_decisions:
- issue: Sifat penghukuman yang digambarkan
  choice: Kematian Herodes ditampilkan sebagai penghukuman ilahi yang dilaksanakan melalui seorang malaikat Tuhan.
  alternative: Kematian yang sepenuhnya alamiah tetapi digambarkan dengan bahasa keagamaan; atau kematian seketika tepat saat malaikat memukulnya.
  rationale: Teks secara eksplisit menyebut malaikat Tuhan sebagai pelaku yang memukul Herodes dan kegagalan Herodes memberikan kemuliaan kepada Allah sebagai alasannya. Namun, rangkaian “dimakan cacing, lalu meninggal” tidak dipersempit menjadi rekonstruksi medis atau kronologi yang lebih terperinci daripada pernyataan Lukas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua kalimat dipilih agar alur penghukuman, kondisi dimakan cacing, dan kematian terbaca jelas. Diksi tetap gamblang tanpa menjadi arkais atau memperhalus gambaran keras dalam teks sumber.
