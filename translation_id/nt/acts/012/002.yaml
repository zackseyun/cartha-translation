  text: ἀνεῖλεν δὲ Ἰάκωβον τὸν ἀδελφὸν Ἰωάννου μαχαίρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/002.yaml
  text: And he killed James[a], the brother of John, with the sword.
translation:
  language: id
  text: Lalu Herodes membunuh Yakobus[a], saudara Yohanes, dengan pedang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghukum mati.” Bahasa Yunani hanya menyatakan bahwa Herodes menyebabkan Yakobus mati; konteks yang lebih luas mungkin menunjukkan suatu eksekusi resmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῖλεν
  choice: membunuh
  rationale: Kata ἀναιρέω di sini menyatakan tindakan menyebabkan kematian. “Membunuh” paling langsung dan alami; “menghukum mati” mungkin sesuai dengan konteks penganiayaan resmi, tetapi memberi nuansa proses hukum yang tidak dinyatakan secara tegas oleh ayat ini.
- source_word: δὲ
  choice: Lalu
  rationale: δέ menghubungkan dan melanjutkan alur cerita. “Lalu” wajar dalam narasi Indonesia dan tidak memberi pertentangan yang lebih kuat daripada teks Yunani.
- source_word: Ἰάκωβον
  choice: Yakobus
  rationale: Nama ini memakai bentuk baku yang telah mapan dalam tradisi Alkitab bahasa Indonesia.
- source_word: τὸν ἀδελφὸν Ἰωάννου
  choice: saudara Yohanes
  rationale: Frasa aposisional ini mengidentifikasi Yakobus yang dimaksud dan mengikuti struktur Yunani dengan bahasa Indonesia yang alami.
- source_word: μαχαίρῃ
  choice: dengan pedang
  rationale: μάχαιρα berarti pedang atau pedang pendek, dan bentuk datifnya menyatakan alat. “Dengan pedang” mempertahankan gambaran konkret serta hubungan instrumental dalam teks.
theological_decisions:
- issue: Sifat tindakan Herodes
  choice: Teks utama menyatakan tindakan membunuh tanpa secara khusus menyebut proses penghukuman resmi.
  alternative: “Menghukum mati Yakobus” untuk menonjolkan kemungkinan eksekusi oleh penguasa.
  rationale: Kata ἀνεῖλεν menyatakan bahwa Herodes menyebabkan kematian Yakobus, sedangkan μαχαίρῃ menyebut alatnya. Konteks yang lebih luas mungkin menunjukkan eksekusi resmi, tetapi ayat ini sendiri tidak mengharuskan nuansa hukum tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Nama-nama mengikuti bentuk Alkitab Indonesia yang lazim; susunan kalimat mempertahankan alur naratif dan kekonkretan teks sumber.
