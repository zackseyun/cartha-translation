  text: τακτῇ δὲ ἡμέρᾳ ὁ Ἡρῴδης ἐνδυσάμενος ἐσθῆτα βασιλικὴν ⸀καὶ καθίσας ἐπὶ τοῦ βήματος ἐδημηγόρει πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/021.yaml
  text: On an appointed day[a], Herod, having put on royal clothing and having sat down on the tribunal[b], was delivering a public address to them.
translation:
  language: id
  text: Pada hari yang telah ditentukan, Herodes mengenakan pakaian kerajaan, lalu duduk di atas panggung resmi[a] dan sedang menyampaikan pidato kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di kursi pengadilan” atau “di mimbar.” Kata Yunani βῆμα dapat menunjuk pada kursi resmi pengadilan atau pada panggung yang ditinggikan untuk berbicara di hadapan umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: τακτῇ ... ἡμέρᾳ
  choice: pada hari yang telah ditentukan
  rationale: Mengungkapkan hari yang sudah ditetapkan untuk acara itu secara alami dan tepat.
- source_word: ἐνδυσάμενος
  choice: mengenakan
  rationale: Partisip aoris menunjukkan tindakan Herodes berpakaian sebelum ia duduk dan berpidato; urutannya dipertahankan dengan susunan verba berantai yang alami dalam bahasa Indonesia.
- source_word: ἐσθῆτα βασιλικὴν
  choice: pakaian kerajaan
  rationale: ἐσθής menunjuk pada pakaian atau busana; pilihan ini tidak mempersempit makna menjadi jenis jubah tertentu.
- source_word: καθίσας
  choice: lalu duduk
  rationale: Menyampaikan tindakan berikutnya dalam rangkaian naratif secara wajar.
- source_word: ἐπὶ τοῦ βήματος
  choice: di kursi pengadilan
  rationale: βῆμα dapat menunjuk pada tempat duduk resmi atau panggung yang ditinggikan; dalam konteks penguasa, 'kursi pengadilan' mempertahankan nuansa resmi tanpa menyatakan bahwa persidangan sedang berlangsung.
- source_word: ἐδημηγόρει
  choice: menyampaikan pidato
  rationale: δημηγορέω berarti berpidato di hadapan khalayak. Bentuk imperfek menggambarkan tindakan yang sedang berlangsung; dalam narasi Indonesia, verba ini tetap menyampaikan adegan tersebut secara alami.
- source_word: πρὸς αὐτούς
  choice: kepada mereka
  rationale: Menunjukkan arah pembicaraan kepada khalayak yang dimaksud.
theological_decisions: []
