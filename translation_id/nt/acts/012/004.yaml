  source_fidelity: Teks utama pada umumnya setia pada Yunani. “Setelah menangkap,” “memasukkannya ke dalam penjara,” “menyerahkannya kepada empat regu prajurit untuk menjaganya,” dan “bermaksud menghadapkan ... kepada rakyat” menyampaikan struktur dan makna sumber dengan baik. Penyebutan Petrus dan Herodes memperjelas rujukan yang tersirat dari konteks langsung. Namun, catatan a menambahkan bahwa keenam belas prajurit “bertugas secara bergiliran,” sesuatu yang tidak dinyatakan dalam ayat ini.
  naturalness: Bahasa Indonesia baku, jelas, dan bernada naratif wajar. “Menghadapkan Petrus kepada rakyat” merupakan pilihan alami untuk tindakan presentasi publik tanpa memaksakan rincian persidangan formal.
  terminology: “Paskah” tepat untuk πάσχα; catatan b secara membantu membedakannya dari Paskah Kristen. “Empat regu prajurit” dapat dipertahankan apabila catatan menjelaskan bahwa masing-masing regu terdiri atas empat prajurit.
