  text: ὃν καὶ πιάσας ἔθετο εἰς φυλακήν, παραδοὺς τέσσαρσιν τετραδίοις στρατιωτῶν φυλάσσειν αὐτόν, βουλόμενος μετὰ τὸ πάσχα ἀναγαγεῖν αὐτὸν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/004.yaml
  text: After arresting him[a], he put him in prison, handing him over to four squads of soldiers to guard him[b], intending to bring him out to the people after the Passover.
translation:
  language: id
  text: Setelah menangkap Petrus, Herodes memasukkannya ke dalam penjara dan menyerahkannya kepada empat regu prajurit[a] untuk menjaganya. Ia bermaksud menghadapkan Petrus kepada rakyat sesudah perayaan Paskah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “empat kelompok yang masing-masing terdiri atas empat prajurit,” jadi seluruhnya enam belas prajurit.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah perayaan Paskah Yahudi.
    reason: cultural_clarification
lexical_decisions:
- source_word: πιάσας
  choice: setelah menangkap
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama; pilihan ini alami dalam bahasa Indonesia dan mempertahankan makna penangkapan.
- source_word: ἔθετο εἰς φυλακήν
  choice: memasukkannya ke dalam penjara
  rationale: Ungkapan idiomatis yang jelas untuk tindakan memenjarakan seseorang.
- source_word: παραδοὺς
  choice: menyerahkannya
  rationale: Menunjukkan pemindahan Petrus ke bawah penjagaan para prajurit.
- source_word: τέσσαρσιν τετραδίοις στρατιωτῶν
  choice: kepada empat regu prajurit
  rationale: τετράδιον adalah kelompok beranggotakan empat orang; ungkapan utama dibuat alami, sedangkan jumlah tepat tiap regu dijelaskan dalam catatan kaki.
- source_word: φυλάσσειν αὐτόν
  choice: untuk menjaganya
  rationale: Infinitif ini menyatakan tujuan penyerahan kepada para prajurit.
- source_word: βουλόμενος
  choice: bermaksud
  rationale: Menyampaikan rencana atau kehendak yang disengaja tanpa menambahkan nuansa emosional.
- source_word: μετὰ τὸ πάσχα
  choice: sesudah perayaan Paskah
  rationale: πάσχα menunjuk pada Paskah Yahudi; kata 'perayaan' membantu pembaca memahami bahwa yang dimaksud adalah masa perayaan, bukan hari raya Kristen modern.
- source_word: ἀναγαγεῖν αὐτὸν τῷ λαῷ
  choice: menghadapkan Petrus kepada rakyat
  rationale: Dalam konteks publik-yudisial ini, ἀνάγω berarti membawa keluar atau tampil ke hadapan umum; 'menghadapkan' alami tanpa memastikan adanya pengadilan formal.
- source_word: λαῷ
  choice: rakyat
  rationale: Menunjuk kepada khalayak sebagai suatu badan publik dan sesuai dengan konteks tindakan Herodes.
theological_decisions:
- issue: Makna πάσχα
  choice: Paskah, yakni perayaan Paskah Yahudi
  alternative: Easter/Paskah Kristen
  rationale: Secara leksikal πάσχα menunjuk kepada Paskah Yahudi. Catatan kaki mencegah pembaca modern menyamakannya dengan Paskah Kristen.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Nama Petrus dan Herodes diulangi untuk memperjelas rujukan pronomina Yunani dalam ayat yang dikutip secara mandiri.
