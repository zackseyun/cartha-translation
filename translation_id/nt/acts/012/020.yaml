id: ACT.12.20
reference: Acts 12:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἦν ⸀δὲ θυμομαχῶν Τυρίοις καὶ Σιδωνίοις· ὁμοθυμαδὸν δὲ παρῆσαν πρὸς αὐτόν, καὶ πείσαντες Βλάστον τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως ᾐτοῦντο εἰρήνην διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν ἀπὸ τῆς βασιλικῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/020.yaml
  text: He was very angry with the Tyrians and Sidonians[a]. But they came to him with one accord, and after persuading Blastus, the king’s chamberlain, they were asking for peace[d][c][b], because their country was fed from the king’s domain.
translation:
  language: id
  text: Ia sedang sangat marah terhadap penduduk Tirus dan Sidon[a]. Namun, mereka sepakat datang menghadap dia. Setelah membujuk Blastus, pejabat yang bertanggung jawab atas kamar pribadi raja[b], mereka memohon perdamaian, karena daerah mereka memperoleh pasokan makanan dari wilayah kekuasaan raja[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sedang bermusuhan dengan penduduk Tirus dan Sidon.” Kata Yunani yang digunakan menyatakan kemarahan hebat atau permusuhan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang yang mengurus kamar tidur raja,” kemungkinan seorang pejabat istana yang memiliki akses ke ruang pribadi raja.
    reason: cultural_note
  - marker: c
    text: Secara lebih harfiah, “karena daerah mereka diberi makan dari wilayah milik raja.” Maksudnya, daerah mereka bergantung pada wilayah kekuasaan raja untuk persediaan pangan.
    reason: clarification
lexical_decisions:
- source_word: θυμομαχῶν
  choice: sangat marah terhadap
  rationale: Partisip ini menyatakan kemarahan yang hebat atau sikap bermusuhan. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan intensitas ungkapan Yunani.
- source_word: Τυρίοις καὶ Σιδωνίοις
  choice: orang Tirus dan Sidon
  rationale: Bentuk datif ini menunjuk kepada penduduk kedua kota tersebut; penyebutan dengan 'orang' lebih wajar daripada membentuk kata etnik transliterasi dalam bahasa Indonesia.
- source_word: ὁμοθυμαδόν
  choice: sepakat
  rationale: Adverbia ini menekankan kesatuan maksud, bukan sekadar kehadiran mereka secara bersamaan.
- source_word: παρῆσαν πρὸς αὐτόν
  choice: datang menghadap dia
  rationale: Ungkapan ini berarti datang atau tampil di hadapan seseorang; 'menghadap' sesuai dengan konteks audiensi kerajaan.
- source_word: πείσαντες
  choice: setelah membujuk
  rationale: Partisip aoris menunjukkan tindakan yang mendahului permohonan mereka. 'Membujuk' mempertahankan gagasan bahwa mereka berhasil memperoleh dukungan atau kerja sama Blastus tanpa menentukan caranya.
- source_word: Βλάστον
  choice: Blastus
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dan dekat dengan bentuk Yunani.
- source_word: τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως
  choice: pejabat yang mengurus kamar pribadi raja
  rationale: Secara harfiah ungkapan ini menunjuk kepada orang yang bertanggung jawab atas kamar tidur raja, yakni pejabat istana yang memiliki akses dekat kepada raja. Terjemahan ini lebih mudah dipahami daripada istilah teknis yang kuno.
- source_word: ᾐτοῦντο εἰρήνην
  choice: mereka memohon perdamaian
  rationale: Bentuk imperfek menggambarkan permohonan yang sedang atau terus diajukan. Dalam konteks hubungan antardaerah, εἰρήνην menunjuk pada perdamaian atau pemulihan hubungan damai.
- source_word: διὰ τὸ τρέφεσθαι
  choice: karena ... memperoleh pasokan makanan
  rationale: Konstruksi διά dengan infinitif artikular menyatakan alasan. Bentuk pasif τρέφεσθαι di sini berkaitan dengan pemenuhan kebutuhan pangan.
- source_word: αὐτῶν τὴν χώραν
  choice: daerah mereka
  rationale: χώρα dapat berarti daerah, wilayah, atau negeri. 'Daerah' alami dalam konteks wilayah Tirus dan Sidon serta tidak menyiratkan negara modern.
- source_word: ἀπὸ τῆς βασιλικῆς
  choice: dari wilayah kekuasaan raja
  rationale: Adjektiva βασιλικῆς dipakai secara substantival untuk sesuatu yang menjadi milik atau berada di bawah kekuasaan raja, kemungkinan besar wilayah kerajaan yang memasok bahan pangan.
