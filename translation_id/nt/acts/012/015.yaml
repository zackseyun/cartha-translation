id: ACT.12.15
reference: Acts 12:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὴν εἶπαν· Μαίνῃ. ἡ δὲ διϊσχυρίζετο οὕτως ἔχειν. οἱ δὲ ἔλεγον· Ὁ ἄγγελός ⸂ἐστιν αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/015.yaml
  text: But they said to her[a], “You are out of your mind.” But she kept insisting that it was so. And they kept saying, “It is his angel.”
translation:
  language: id
  text: Namun, mereka berkata kepadanya, “Kamu tidak waras.” Akan tetapi, ia terus bersikeras bahwa memang demikian. Mereka pun terus berkata, “Itu malaikatnya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “Itu malaikat pelindungnya,” “Itu malaikat yang mewakilinya,” atau menurut sebagian penafsir, “Itu roh/arwahnya.” Teks Yunani hanya mengatakan “malaikatnya.”
    reason: alternative_reading
lexical_decisions:
- source_word: Μαίνῃ
  choice: Kamu tidak waras
  rationale: Ungkapan ini menyampaikan tuduhan bahwa Rode berbicara secara tidak masuk akal, dengan bahasa Indonesia modern yang tegas tetapi tidak terlalu klinis.
- source_word: διϊσχυρίζετο
  choice: ia terus bersikeras
  rationale: Bentuk imperfek dan daya tekan verba ini menunjukkan desakan yang berlangsung atau berulang.
- source_word: οὕτως ἔχειν
  choice: bahwa memang demikian
  rationale: Menerjemahkan ungkapan idiomatis bahwa keadaan itu benar seperti yang dikatakannya; 'memang' mempertahankan penegasan.
- source_word: ἔλεγον
  choice: mereka pun terus berkata
  rationale: Bentuk imperfek menunjukkan ujaran yang berlangsung atau diulang, bukan sekadar satu kali pernyataan.
- source_word: ἄγγελός
  choice: malaikat
  rationale: Dalam konteks ini, kata tersebut paling wajar dipahami sebagai makhluk adikodrati, meskipun secara leksikal juga dapat berarti utusan.
- source_word: αὐτοῦ
  choice: -nya
  rationale: Klitik posesif Indonesia secara alami menyatakan 'malaikat milik/yang terkait dengannya', dengan rujukan kepada Petrus.
theological_decisions:
- issue: Makna frasa ὁ ἄγγελός ἐστιν αὐτοῦ ('itu malaikatnya')
  choice: Itu malaikatnya
  alternative: Itu malaikat pelindungnya; itu malaikat yang mewakilinya; itu roh/arwahnya
  rationale: Teks Yunani hanya menyebut 'malaikatnya' tanpa menjelaskan keyakinan yang melatarinya. Terjemahan utama mempertahankan ketaksaan dan ketegangan teologis tersebut, sedangkan kemungkinan tafsir dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Pengulangan aspek duratif dipertahankan melalui 'terus bersikeras' dan 'terus berkata'. Penanda catatan kaki ditempatkan langsung sesudah frasa yang ambigu.
