id: ACT.12.25
reference: Acts 12:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ καὶ Σαῦλος ὑπέστρεψαν, ⸀εἰς Ἰερουσαλὴμ πληρώσαντες τὴν διακονίαν, ⸀συμπαραλαβόντες Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/025.yaml
  text: But Barnabas and Saul returned to Jerusalem after completing the ministry, taking along John, who was called Mark.
translation:
  language: id
  text: Namun, Barnabas dan Saulus kembali ke Yerusalem[a] setelah menyelesaikan pelayanan itu. Mereka membawa serta Yohanes, yang disebut Markus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “dari Yerusalem”, bukan “ke Yerusalem”.
    reason: textual_variant
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: kembali
  rationale: Bentuk aoris ὑποστρέφω lazim berarti kembali; padanan ini ringkas dan alami dalam bahasa Indonesia.
- source_word: εἰς Ἰερουσαλήμ
  choice: ke Yerusalem
  rationale: Dalam teks SBLGNT yang diberikan, εἰς secara langsung menyatakan arah ke suatu tempat. Varian yang berarti 'dari Yerusalem' dicatat dalam catatan kaki.
- source_word: πληρώσαντες τὴν διακονίαν
  choice: setelah menyelesaikan pelayanan itu
  rationale: πληρόω menyatakan penyelesaian, sedangkan διακονία berarti pelayanan. 'Pelayanan itu' mempertahankan keluasan istilah Yunani sekaligus merujuk secara alami pada pelayanan yang telah disebut dalam konteks.
- source_word: συμπαραλαβόντες
  choice: membawa serta
  rationale: Partisip ini menggambarkan tindakan membawa seseorang untuk ikut bersama mereka. 'Membawa serta' alami dan tepat dalam bahasa Indonesia.
- source_word: Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον
  choice: Yohanes, yang disebut Markus
  rationale: ἐπικαλέω pasif dapat berarti disebut atau dinamai. Terjemahan ini transparan dan tidak menambahkan kata 'juga' yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Varian tekstual pada frasa arah atau asal perjalanan
  choice: ke Yerusalem
  alternative: dari Yerusalem
  rationale: Teks sumber SBLGNT yang diberikan berbunyi εἰς Ἰερουσαλήμ, 'ke Yerusalem'. Meskipun konteks naratif dan sejumlah naskah mendukung 'dari Yerusalem', teks utama mengikuti edisi sumber, sementara alternatif bermakna itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Kalimat partisipial terakhir dipecah menjadi kalimat kedua agar jelas dan alami tanpa mengubah hubungan tindakannya.
