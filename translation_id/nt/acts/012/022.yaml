id: ACT.12.22
reference: Acts 12:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ δῆμος ἐπεφώνει· ⸂Θεοῦ φωνὴ⸃ καὶ οὐκ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/022.yaml
  text: And the crowd kept shouting[a], “The voice of a god, and not of a man!”
translation:
  language: id
  text: Namun, orang banyak itu terus berseru, “Ini suara dewa, bukan suara manusia!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ini suara Allah, bukan suara manusia!” Teks Yunani dapat dipahami demikian, tetapi dalam konteksnya makna “dewa” lebih mungkin karena seruan ini mencerminkan pujian ilahi dari khalayak non-Yahudi kepada Herodes.
    reason: alternative_reading
lexical_decisions:
- source_word: δῆμος
  choice: orang banyak
  rationale: Dalam konteks ini, δῆμος menunjuk kepada khalayak yang berkumpul, bukan badan politik resmi. “Orang banyak” alami dalam bahasa Indonesia dan sesuai dengan suasana sambutan umum.
- source_word: ἐπεφώνει
  choice: terus berseru
  rationale: Bentuk imperfek menggambarkan tindakan yang berlangsung atau berulang. “Terus berseru” mempertahankan aspek tersebut tanpa terdengar kaku.
- source_word: Θεοῦ
  choice: dewa
  rationale: Genitif tanpa artikel dalam konteks khalayak non-Yahudi yang menyanjung Herodes paling wajar dipahami sebagai “dewa,” bukan secara khusus Allah Israel.
- source_word: φωνὴ
  choice: suara
  rationale: “Suara” mempertahankan makna langsung φωνή dan cocok dengan ungkapan nominal yang bersifat seruan.
- source_word: ἀνθρώπου
  choice: manusia
  rationale: “Manusia” membentuk kontras langsung dan alami dengan “dewa.” Bahasa Indonesia tidak memerlukan bentuk singular berpenentu seperti “seorang manusia” dalam seruan ini.
theological_decisions:
- issue: Apakah Θεοῦ diterjemahkan sebagai “dewa” atau “Allah”
  choice: dewa
  alternative: Allah
  rationale: Konteksnya adalah khalayak non-Yahudi yang memberikan penghormatan ilahi kepada Herodes, sedangkan Θεοῦ tidak berartikel. “Dewa” lebih tepat mencerminkan latar sejarah dan keagamaan itu, sementara kemungkinan “Allah” tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. “Namun” menyampaikan δέ sebagai peralihan/kontras ringan; “Ini” ditambahkan secara idiomatis untuk membentuk seruan nominal yang alami tanpa mengubah isinya.
