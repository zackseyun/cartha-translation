id: ACT.12.12
reference: Acts 12:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Συνιδών τε ἦλθεν ἐπὶ τὴν οἰκίαν ⸀τῆς Μαρίας τῆς μητρὸς Ἰωάννου τοῦ ἐπικαλουμένου Μάρκου, οὗ ἦσαν ἱκανοὶ συνηθροισμένοι καὶ προσευχόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/012.yaml
  text: And when he realized this[a], he went to the house of Mary, the mother of John who was called Mark, where many had gathered together and were praying.
translation:
  language: id
  text: Setelah menyadari hal itu, Petrus pergi ke rumah Maria, ibu Yohanes yang disebut Markus.[a] Di sana banyak orang telah berkumpul dan sedang berdoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang juga disebut Markus.” Bahasa Yunani memperkenalkan Markus sebagai nama tambahan Yohanes tanpa mengharuskan adanya kata “juga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιδών
  choice: Setelah menyadari hal itu
  rationale: Partisip aoristus dari συνοράω menunjuk pada Petrus yang telah memahami sepenuhnya apa yang baru dialaminya setelah malaikat itu pergi. Frasa “hal itu” dipasok secara wajar dari konteks ayat sebelumnya.
- source_word: τε
  choice: lalu (terungkap melalui alur kalimat)
  rationale: Partikel ini merupakan penghubung naratif ringan. Dalam bahasa Indonesia, urutan tindakan sesudah frasa “Setelah ...” sudah menyampaikan hubungan tersebut secara alami tanpa perlu menerjemahkannya secara kaku.
- source_word: ἦλθεν ἐπὶ τὴν οἰκίαν
  choice: pergi ke rumah
  rationale: Ungkapan ini menyatakan gerak menuju suatu tempat; “pergi ke rumah” sesuai dengan sudut pandang narasi dan alami dalam bahasa Indonesia.
- source_word: τῆς Μαρίας
  choice: Maria
  rationale: Bentuk nama yang lazim dan baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: τῆς μητρὸς Ἰωάννου
  choice: ibu Yohanes
  rationale: Menyatakan hubungan genitif secara langsung dan membedakan Maria ini dari tokoh-tokoh lain yang bernama sama.
- source_word: τοῦ ἐπικαλουμένου Μάρκου
  choice: yang disebut Markus
  rationale: Partisip pasif ini memperkenalkan nama tambahan bagi Yohanes. Terjemahan utama tidak menambahkan kata “juga,” karena kata itu tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: οὗ
  choice: Di sana
  rationale: Adverbia relatif ini menunjuk kembali kepada rumah Maria. Pemisahan menjadi kalimat baru menghasilkan bahasa Indonesia yang jelas dan alami.
- source_word: ἱκανοὶ
  choice: banyak orang
  rationale: Dalam bentuk jamak, ἱκανός menyatakan jumlah yang cukup besar; “banyak orang” tepat, sederhana, dan alami.
- source_word: συνηθροισμένοι
  choice: telah berkumpul
  rationale: Konstruksi perifrastis dengan ἦσαν dan partisip perfek menyatakan keadaan yang merupakan hasil tindakan berkumpul sebelumnya; “telah berkumpul” mempertahankan nuansa hasil itu.
- source_word: καὶ προσευχόμενοι
  choice: dan sedang berdoa
  rationale: Partisip kini menggambarkan kegiatan yang tengah berlangsung ketika Petrus tiba; “sedang” membuat aspek progresifnya jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama tokoh mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia. Kalimat Yunani dibagi menjadi dua agar hubungan tempat dan kegiatan orang-orang di rumah itu tetap jelas tanpa terasa kaku.
