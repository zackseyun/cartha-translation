source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄγγελος κυρίου ἐπέστη, καὶ φῶς ἔλαμψεν ἐν τῷ οἰκήματι· πατάξας δὲ τὴν πλευρὰν τοῦ Πέτρου ἤγειρεν αὐτὸν λέγων· Ἀνάστα ἐν τάχει· καὶ ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/007.yaml
  text: And behold[a], an angel of the Lord stood near, and a light shone in the cell. Striking Peter on the side, he woke him, saying[b], “Get up quickly.” And his chains fell off from his hands.
translation:
  language: id
  text: Lihatlah, seorang malaikat Tuhan berdiri di dekat Petrus,[a] dan cahaya bersinar di dalam ruang tahanan.[b] Malaikat itu memukul Petrus pada sisi tubuhnya dan membangunkannya. Ia berkata, “Segera bangun!” Lalu rantai-rantai Petrus terlepas dari tangannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berdiri di sisinya” atau “muncul secara mendadak.” Kata kerja Yunani dapat menekankan baik posisi di dekat seseorang maupun kehadiran yang mendadak.
    reason: lexical_alternative
  - marker: b
    text: Atau “ruangan” atau “kamar.” Istilah Yunani bersifat umum, tetapi konteksnya menunjukkan sebuah ruang di dalam penjara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan fungsi penarik perhatian yang menghidupkan narasi. Bentuk ini agak tinggi, tetapi tetap jelas dan sesuai dengan gaya naratif Lukas.
- source_word: ἄγγελος κυρίου
  choice: seorang malaikat Tuhan
  rationale: Merupakan ungkapan Indonesia yang alami untuk konstruksi genitif ini dan mempertahankan pengertian utusan yang berasal dari atau diutus oleh Tuhan.
- source_word: ἐπέστη
  choice: berdiri di dekat Petrus
  rationale: Mengungkapkan kehadiran dan kedekatan fisik tanpa menutup kemungkinan bahwa kemunculannya terjadi secara mendadak; nuansa alternatif dijelaskan dalam catatan kaki.
- source_word: φῶς ἔλαμψεν
  choice: cahaya bersinar
  rationale: Padanan langsung dan alami bagi gabungan nomina dan verba Yunani tersebut.
- source_word: ἐν τῷ οἰκήματι
  choice: di dalam ruang tahanan
  rationale: οἴκημα secara umum berarti ruang atau kamar, sedangkan konteks penjara mendukung penjelasan fungsional 'ruang tahanan' tanpa mempersempitnya secara berlebihan menjadi jenis sel tertentu.
- source_word: πατάξας
  choice: memukul
  rationale: Mempertahankan daya verba yang berarti memukul atau mengenakan suatu pukulan; 'menepuk' berpotensi terlalu melemahkan tindakan tersebut.
- source_word: τὴν πλευρὰν τοῦ Πέτρου
  choice: sisi tubuh Petrus
  rationale: Menyampaikan bagian samping tubuh tanpa mempersempit makna menjadi rusuk atau pinggang.
- source_word: ἤγειρεν αὐτόν
  choice: membangunkannya
  rationale: Dalam konteks Petrus sedang tidur, makna kontekstual ἐγείρω adalah membangunkan, bukan sekadar mengangkat atau mendirikan.
- source_word: Ἀνάστα ἐν τάχει
  choice: Cepat, bangunlah!
  rationale: Ungkapan perintah yang alami dalam bahasa Indonesia modern serta mempertahankan urgensi frasa Yunani.
- source_word: ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν
  choice: rantai-rantai Petrus terlepas dari tangannya
  rationale: Menggambarkan rantai yang jatuh atau lepas secara mendadak, sambil mempertahankan 'tangan' sebagai padanan formal χείρ dan tidak menggantinya dengan 'pergelangan tangan'.
theological_decisions:
- issue: Penerjemahan κύριος dalam ἄγγελος κυρίου
  choice: Tuhan
  alternative: Tuan
  rationale: '''Tuhan'' merupakan padanan baku dalam konteks ini dan mempertahankan rujukan ilahi tanpa memasukkan penafsiran doktrinal tambahan.'
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. 'Lihatlah' mempertahankan gaya penarik perhatian dalam narasi, sedangkan 'ruang tahanan' membuat latar penjara mudah dipahami tanpa menghapus keluasan istilah Yunani.
