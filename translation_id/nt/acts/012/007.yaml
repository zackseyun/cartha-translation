  terminology: “Malaikat Tuhan” dan “Tuhan” sesuai untuk ἄγγελος κυρίου. “Ruang tahanan” mempertahankan latar penjara tanpa memaksakan rincian arsitektural yang tidak dinyatakan oleh οἴκημα. Catatan kaki ditempatkan pada unsur yang relevan dan alternatifnya tidak menambahkan ajaran atau tafsiran denominasi.
