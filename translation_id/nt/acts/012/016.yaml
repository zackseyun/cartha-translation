  yaml_path: translation/nt/acts/012/016.yaml
  text: But Peter kept on knocking[a], and when they opened the door[b], they saw him and were astonished.
translation:
  language: id
  text: Namun, Petrus terus mengetuk. Setelah mereka membuka pintu[a], mereka melihatnya dan tercengang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setelah membuka, mereka melihatnya dan tercengang.” Kata “pintu” tidak disebutkan dalam teks Yunani, tetapi tersirat dari konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμενεν κρούων
  choice: terus mengetuk
  rationale: Gabungan bentuk imperfek ἐπέμενεν dan partisipel κρούων menyatakan tindakan mengetuk yang berlanjut atau berulang; 'terus mengetuk' menyampaikan aspek tersebut secara alami dalam bahasa Indonesia.
- source_word: ἀνοίξαντες
  choice: ketika mereka membuka pintu
  rationale: Partisipel aoris diterjemahkan sebagai klausa waktu agar urutan tindakan jelas. Kata 'pintu' ditambahkan dari konteks, sebab objek yang dibuka tersirat oleh tindakan mengetuk.
- source_word: εἶδαν αὐτόν
  choice: melihat dia
  rationale: Terjemahan langsung dan wajar untuk tindakan melihat Petrus dalam narasi.
- source_word: ἐξέστησαν
  choice: sangat heran
  rationale: Kata ini menyatakan keheranan yang kuat; 'sangat heran' jelas, alami, dan mempertahankan intensitasnya.
- source_word: δὲ
  choice: Namun
  rationale: δέ pertama menandai kontras dengan keadaan pada ayat sebelumnya. δέ kedua terwakili secara alami dalam susunan kalimat tanpa padanan tersendiri.
- source_word: Πέτρος
  choice: Petrus
  rationale: Mengikuti bentuk nama yang baku dan luas dikenal dalam bahasa Indonesia.
