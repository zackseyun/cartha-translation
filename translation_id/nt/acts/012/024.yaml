  yaml_path: translation/nt/acts/012/024.yaml
  text: But the word of God continued to grow and multiply[a].
translation:
  language: id
  text: Namun, firman Allah terus bertumbuh dan berlipat ganda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Berita dari Allah terus bertumbuh dan berlipat ganda.”
    reason: Mencatat alternatif leksikal bagi λόγος tanpa mengganti metafora pertumbuhan dan pelipatgandaan dalam teks utama.
lexical_decisions:
- source_word: λόγος
  choice: firman
  rationale: Mempertahankan ungkapan khas Lukas “firman Allah” dan cakupan maknanya sebagai firman atau berita yang diberitakan; dalam konteks ini, “berita” juga mungkin.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Genitif diterjemahkan secara wajar dalam ungkapan Indonesia “firman Allah”, yakni firman yang berasal dari dan menjadi milik Allah.
- source_word: ηὔξανεν
  choice: terus bertumbuh
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung; “terus bertumbuh” menyampaikan aspek progresif tersebut.
- source_word: ἐπληθύνετο
  choice: makin tersebar luas
  rationale: Bentuk imperfek pasif secara harfiah dapat berarti “makin berlipat ganda”; dalam konteks firman, ungkapan ini menunjuk pada penyebaran dan jangkauannya yang terus meluas. Pilihan ini alami dalam bahasa Indonesia sekaligus membedakannya dari “bertumbuh”.
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras naratif dengan kematian Herodes dalam ayat sebelumnya.
theological_decisions:
- issue: Apakah λόγος τοῦ θεοῦ diterjemahkan sebagai “firman Allah” atau secara dinamis sebagai “berita dari Allah”
  choice: firman Allah
  alternative: berita dari Allah
  rationale: “Firman Allah” mempertahankan rumusan yang berulang dalam Kisah Para Rasul serta resonansi alkitabiahnya, tanpa meniadakan arti kontekstualnya sebagai berita yang diberitakan.
- issue: Apakah ἐπληθύνετο menggambarkan firman itu sendiri berlipat ganda atau penyebarannya meluas
  choice: makin tersebar luas
  alternative: makin berlipat ganda
  rationale: Bahasa sumber memakai metafora pertambahan pada firman. Terjemahan utama menyampaikan dampak kontekstualnya secara alami, sementara catatan kaki mempertahankan gambaran harfiahnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Namun” memperjelas kontras naratif; “firman Allah” mempertahankan idiom alkitabiah yang sudah dikenal, sedangkan “makin tersebar luas” membuat metafora Yunani dapat dipahami secara alami.
