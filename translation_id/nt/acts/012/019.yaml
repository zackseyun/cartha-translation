source:
  edition: SBLGNT
  text: Ἡρῴδης δὲ ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν ἀνακρίνας τοὺς φύλακας ἐκέλευσεν ἀπαχθῆναι, καὶ κατελθὼν ἀπὸ τῆς Ἰουδαίας ⸀εἰς Καισάρειαν διέτριβεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/019.yaml
  text: But Herod[a], after searching for him and not finding him, examined the guards and ordered them to be led away to execution. Then he went down from Judea to Caesarea and stayed there.
translation:
  language: id
  text: Namun, setelah mencari dia dan tidak menemukannya, Herodes menginterogasi para penjaga lalu memerintahkan agar mereka dibawa pergi untuk dihukum mati.[a] Kemudian Herodes turun dari Yudea ke Kaisarea dan tinggal di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memerintahkan agar mereka dibawa pergi.” Dalam konteks ini, kemungkinan besar mereka dibawa pergi untuk dihukum mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητήσας
  choice: setelah mencari
  rationale: Partisip aoristus menunjukkan tindakan yang mendahului pemeriksaan para penjaga; ungkapan ini menyampaikan upaya aktif untuk menemukan Petrus secara alami dalam bahasa Indonesia.
- source_word: μὴ εὑρὼν
  choice: dan tidak menemukannya
  rationale: Mempertahankan urutan pencarian yang gagal sebelum interogasi, dengan pronomina yang merujuk kepada Petrus dalam konteks.
- source_word: ἀνακρίνας
  choice: menginterogasi
  rationale: Kata ini menunjuk pada pemeriksaan atau penanyaan resmi; 'menginterogasi' menampilkan sifat penyelidikan terhadap para penjaga dengan lebih tepat daripada sekadar 'bertanya'.
- source_word: τοὺς φύλακας
  choice: para penjaga
  rationale: Padanan Indonesia yang jelas dan wajar bagi orang-orang yang ditugaskan menjaga Petrus.
- source_word: ἐκέλευσεν ἀπαχθῆναι
  choice: memerintahkan agar mereka dibawa pergi untuk dihukum mati
  rationale: Secara leksikal berarti diperintahkan untuk dibawa pergi, tetapi dalam konteks hukuman terhadap penjaga yang kehilangan tahanan, tindakan itu sangat mungkin berujung pada eksekusi. Makna kontekstual dibuat jelas, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: κατελθὼν
  choice: turun
  rationale: Mempertahankan ungkapan geografis perjalanan dari wilayah Yudea yang lebih tinggi menuju Kaisarea di pesisir.
- source_word: Ἰουδαίας
  choice: Yudea
  rationale: Bentuk nama wilayah yang lazim dalam bahasa Indonesia.
- source_word: Καισάρειαν
  choice: Kaisarea
  rationale: Bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: διέτριβεν
  choice: tinggal di sana
  rationale: Bentuk imperfek menunjukkan keberadaan yang berlangsung; ungkapan ini alami dan tetap menyampaikan durasi tanpa menentukan lamanya.
theological_decisions:
- issue: Apakah ἀπαχθῆναι diterjemahkan secara harfiah sebagai 'dibawa pergi' atau diperjelas sebagai hukuman mati
  choice: dibawa pergi untuk dihukum mati
  alternative: dibawa pergi
  rationale: Teks Yunani tidak memakai kata kerja eksplisit untuk membunuh, sehingga bentuk dasarnya tetap dicatat. Namun, konteks tindakan Herodes terhadap penjaga yang kehilangan tahanan kuat mengisyaratkan eksekusi; terjemahan utama menyampaikan implikasi itu tanpa menghapus ketegangan leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama 'Herodes' diulangi pada kalimat kedua untuk menghindari ketidakjelasan rujukan setelah penyebutan para penjaga. Catatan kaki ditempatkan tepat setelah frasa yang dijelaskannya.
