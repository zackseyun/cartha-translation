  text: καὶ ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου ἀπὸ τῆς χαρᾶς οὐκ ἤνοιξεν τὸν πυλῶνα, εἰσδραμοῦσα δὲ ἀπήγγειλεν ἑστάναι τὸν Πέτρον πρὸ τοῦ πυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/014.yaml
  text: And when she recognized Peter’s voice[a], because of her joy she did not open the gate[b], but ran in and reported that Peter was standing at the gate.
translation:
  language: id
  text: Ketika perempuan itu mengenali suara Petrus, karena kegembiraannya ia tidak membuka pintu gerbang[a], tetapi berlari masuk dan memberitahukan bahwa Petrus sedang berdiri di depan pintu gerbang itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gerbang” atau “pintu luar”; kata Yunani πυλών menunjuk pada pintu masuk luar dari jalan ke rumah atau pekarangan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “memberitahukan Petrus telah berdiri di depan pintu gerbang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοῦσα
  choice: ketika mengenali
  rationale: Partisip aoris menyatakan bahwa ia mengenali suara itu; bentuk ini alami dalam narasi Indonesia dan tetap menunjukkan tindakan yang mendahului responsnya.
- source_word: τὴν φωνὴν τοῦ Πέτρου
  choice: suara Petrus
  rationale: φωνή dalam konteks mendengar seseorang berbicara paling tepat diterjemahkan sebagai 'suara'.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: karena begitu gembira
  rationale: Frasa ini menyatakan sebab. 'Begitu gembira' secara alami menyampaikan kegembiraan besar yang menyebabkan tindakannya tanpa menambahkan emosi lain.
- source_word: οὐκ ἤνοιξεν
  choice: tidak membuka
  rationale: ἀνοίγω berarti 'membuka'; teks tidak menyatakan secara khusus bahwa pintu itu dikunci.
- source_word: τὸν πυλῶνα / τοῦ πυλῶνος
  choice: pintu gerbang
  rationale: πυλών menunjuk pada pintu atau gerbang luar yang menjadi jalan masuk dari jalan ke sebuah rumah atau pekarangan. 'Pintu gerbang' jelas dan alami dalam bahasa Indonesia.
- source_word: εἰσδραμοῦσα
  choice: berlari masuk
  rationale: Partisip ini menggambarkan gerakan cepat ke arah dalam dan mempertahankan laju narasi.
- source_word: ἀπήγγειλεν
  choice: memberitahukan
  rationale: ἀπαγγέλλω berarti menyampaikan atau melaporkan berita; 'memberitahukan' alami untuk konteks rumah tangga ini.
- source_word: ἑστάναι
  choice: sedang berdiri
  rationale: Infinitif perfektum dari ἵστημι memiliki makna keadaan yang berlanjut; 'sedang berdiri' mempertahankan keadaan Petrus saat berita itu disampaikan.
- source_word: πρὸ τοῦ πυλῶνος
  choice: di depan pintu gerbang itu
  rationale: πρό dengan genitif secara harfiah menunjukkan posisi di depan atau di luar pintu gerbang; pilihan ini mempertahankan rincian spasial sumber.
