revisions:
- from: Ketika mengenali suara Petrus, karena begitu gembira, ia tidak membuka pintu gerbang[a], tetapi berlari masuk dan memberitahukan bahwa Petrus sedang berdiri di depan pintu gerbang itu.[b]
  to: Ketika perempuan itu mengenali suara Petrus, karena kegembiraannya ia tidak membuka pintu gerbang[a], tetapi berlari masuk dan memberitahukan bahwa Petrus sedang berdiri di depan pintu gerbang itu.[b]
  rationale: Revisi menyatakan subjek perempuan yang tersirat dalam partisip feminin Yunani, memperhalus ungkapan sebab tanpa mengubah makna, dan memperbaiki ketepatan alternatif leksikal dalam catatan kaki. Bentuk “sedang berdiri” di teks utama tetap baik untuk menyampaikan keadaan yang diungkapkan oleh infinitif perfektum ἑστάναι.
