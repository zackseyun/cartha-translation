  text: Σαῦλος δὲ ἐλυμαίνετο τὴν ἐκκλησίαν κατὰ τοὺς οἴκους εἰσπορευόμενος, σύρων τε ἄνδρας καὶ γυναῖκας παρεδίδου εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/003.yaml
  text: But Saul was ravaging the church[a], entering house after house; dragging off both men and women[b], he was handing them over to prison.
translation:
  language: id
  text: Namun, Saulus terus mengganas terhadap jemaat[a] dengan memasuki rumah demi rumah[b], menyeret laki-laki maupun perempuan, dan menyerahkan mereka ke penjara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terus memorak-porandakan jemaat.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dari rumah ke rumah.” Ungkapan Yunani dapat diterjemahkan dengan kedua cara tersebut; “rumah demi rumah” lebih menonjolkan bahwa rumah-rumah itu didatangi satu per satu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλυμαίνετο
  choice: terus mengganas terhadap
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung atau berulang, sedangkan λυμαίνομαι menyatakan perlakuan brutal yang merusak, lebih kuat daripada sekadar ‘menganiaya’. Ungkapan ini mempertahankan daya kata Yunani tanpa menyiratkan bahwa jemaat benar-benar berhasil dimusnahkan.
- source_word: ἐκκλησίαν
  choice: jemaat
  rationale: Dalam konteks ini, ἐκκλησία menunjuk kepada komunitas orang percaya. ‘Jemaat’ merupakan padanan Indonesia yang wajar dan tidak membatasi maknanya pada gedung atau lembaga.
- source_word: κατὰ τοὺς οἴκους
  choice: rumah demi rumah
  rationale: 'κατά dengan bentuk jamak memiliki nuansa distributif: Saulus mendatangi rumah-rumah satu per satu. ‘Rumah demi rumah’ menyampaikan pengulangan itu dengan alami.'
- source_word: εἰσπορευόμενος
  choice: Ia masuk
  rationale: Partisip ini menjelaskan cara Saulus mengganas terhadap jemaat. Dalam bahasa Indonesia, klausa mandiri menghasilkan urutan tindakan yang lebih jelas dan alami.
- source_word: σύρων
  choice: menyeret
  rationale: σύρω menggambarkan penyeretan secara paksa. ‘Menyeret’ mempertahankan kekerasan tindakan tersebut tanpa penambahan tafsiran.
- source_word: ἄνδρας καὶ γυναῖκας
  choice: laki-laki maupun perempuan
  rationale: Pasangan ini menekankan bahwa tindakan Saulus tidak membedakan jenis kelamin. ‘Maupun’ menampilkan cakupan tersebut secara alami.
- source_word: παρεδίδου
  choice: lalu menyerahkan mereka
  rationale: παραδίδω menyatakan penyerahan kepada pihak yang berwenang atau ke dalam tahanan. Hubungan dengan tindakan berulang sudah ditopang oleh ‘terus’ dan ‘rumah demi rumah’.
- source_word: εἰς φυλακήν
  choice: untuk dipenjarakan
  rationale: φυλακή di sini menunjuk pada penahanan atau pemenjaraan. Bentuk ini alami sesudah ‘menyerahkan’ dan mempertahankan gagasan bahwa mereka diserahkan ke dalam tahanan.
theological_decisions:
- issue: Kerasnya tindakan Saulus sebelum pertobatannya
  choice: terus mengganas terhadap jemaat
  alternative: terus menganiaya jemaat
  rationale: Kata Yunani menggambarkan tindakan brutal dan merusak, sehingga padanan yang kuat diperlukan. Namun, terjemahan tidak boleh menambahkan penilaian teologis tentang Saulus di luar yang dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. ‘Mengganas terhadap’ dipilih untuk mempertahankan kekuatan verba Yunani, sedangkan pemecahan partisip menjadi kalimat kedua membuat urutan tindakan jelas bagi pembaca umum.
