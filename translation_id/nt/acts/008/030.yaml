  text: προσδραμὼν δὲ ὁ Φίλιππος ἤκουσεν αὐτοῦ ἀναγινώσκοντος ⸂Ἠσαΐαν τὸν προφήτην⸃ καὶ εἶπεν· Ἆρά γε γινώσκεις ἃ ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/030.yaml
  text: So Philip ran up and heard him reading Isaiah the prophet[a], and said, “Do you really understand what you are reading?”
translation:
  language: id
  text: Maka Filipus berlari mendekati orang itu dan mendengarnya sedang membaca kitab Nabi Yesaya. Filipus berkata, “Apakah Anda sungguh-sungguh mengerti apa yang sedang Anda baca?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah Anda benar-benar mengerti apa yang sedang Anda baca?” Partikel-partikel Yunani memberi penekanan pada pertanyaan Filipus.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμὼν
  choice: berlari mendekati
  rationale: Partisip aoris προστρέχω menggambarkan gerakan cepat menuju orang dan keretanya; ungkapan ini mempertahankan daya hidup tindakan serta alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Maka
  rationale: δέ menandai kelanjutan narasi yang terkait dengan perintah pada ayat sebelumnya; “Maka” menyampaikan perkembangan itu secara wajar.
- source_word: ἤκουσεν αὐτοῦ ἀναγινώσκοντος
  choice: mendengarnya sedang membaca
  rationale: Konstruksi ἀκούω dengan partisip genitif menyatakan bahwa Filipus mendengar orang itu ketika sedang membaca. Teks tidak secara eksplisit mengatakan “dengan suara keras,” sehingga hal tersebut tetap tersirat.
- source_word: Ἠσαΐαν τὸν προφήτην
  choice: kitab Nabi Yesaya
  rationale: Objek yang dibaca adalah tulisan Yesaya, bukan pribadi Yesaya; penambahan “kitab” membuat maksudnya alami dan jelas dalam bahasa Indonesia tanpa mengubah rujukan.
- source_word: εἶπεν
  choice: berkata
  rationale: Padanan langsung λέγω adalah “berkata”; bentuk kalimat langsung berikutnya sudah memperjelas bahwa ucapannya berupa pertanyaan.
- source_word: Ἆρά γε
  choice: Apakah ... sungguh-sungguh
  rationale: Gabungan partikel ini memberi tekanan pada pertanyaan Filipus. “Sungguh-sungguh” mempertahankan nuansa menyelidik tanpa menetapkan jawaban yang diharapkan secara terlalu tegas.
- source_word: γινώσκεις
  choice: mengerti
  rationale: Dalam konteks ini γινώσκω merujuk pada pemahaman akan makna bacaan, sehingga “mengerti” lebih tepat daripada sekadar “mengetahui”.
- source_word: ἃ ἀναγινώσκεις
  choice: apa yang sedang Anda baca
  rationale: Pronomina relatif menunjuk pada isi bacaan, dan bentuk kini cocok disampaikan dengan “sedang ... baca.” “Anda” menjaga kesopanan terhadap orang yang belum dikenal.
