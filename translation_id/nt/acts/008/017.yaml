translation:
  language: id
  text: Lalu mereka menumpangkan tangan ke atas orang-orang itu, dan orang-orang itu menerima Roh Kudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah, dengan mencerminkan aspek verba Yunani: “Pada waktu itu mereka sedang menumpangkan tangan ke atas orang-orang itu, dan orang-orang itu sedang menerima Roh Kudus.” Kedua verba Yunani berbentuk imperfek dan juga dapat menggambarkan tindakan yang berulang.'
    reason: Menjelaskan aspek kedua verba Yunani serta mempertahankan kemungkinan makna berlangsung atau berulang tanpa membebani teks utama.
lexical_decisions:
- source_word: τότε
  choice: Lalu
  rationale: Menandai urutan kejadian dalam narasi secara alami dan jelas dalam bahasa Indonesia modern.
- source_word: ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς
  choice: mereka menumpangkan tangan atas orang-orang itu
  rationale: Ungkapan «menumpangkan tangan atas» merupakan padanan Indonesia yang lazim untuk tindakan yang dinyatakan oleh idiom Yunani ini. Bentuk imperfek diterjemahkan dengan bentuk naratif alami tanpa menentukan apakah tindakannya berlangsung terus atau dilakukan berulang kali.
- source_word: ἐλάμβανον
  choice: orang-orang itu menerima
  rationale: Subjek tersirat diperjelas sebagai orang-orang yang menerima penumpangan tangan agar dua kelompok yang sama-sama dapat disebut «mereka» tidak tertukar dalam bahasa Indonesia. Bentuk «menerima» tetap alami dalam narasi; nuansa aspek imperfek dicatat dalam catatan kaki.
- source_word: πνεῦμα ἅγιον
  choice: Roh Kudus
  rationale: Dalam konteks Kisah Para Rasul, ungkapan ini menunjuk kepada Roh ilahi yang dijanjikan, bukan kepada suatu roh kudus yang tidak tentu. Bahasa Indonesia baku tidak memerlukan kata sandang.
theological_decisions:
- issue: Rujukan πνεῦμα ἅγιον
  choice: Roh Kudus
  alternative: suatu roh kudus
  rationale: Konteks langsung tentang doa para rasul agar orang-orang Samaria menerima Roh menunjukkan bahwa yang dimaksud ialah Roh Kudus. Terjemahan ini mempertahankan rujukan teks tanpa menambahkan rumusan doktrinal.
- issue: Cara menyampaikan kedua verba imperfek
  choice: Bentuk naratif alami «menumpangkan» dan «menerima», dengan keterangan aspek dalam catatan kaki
  alternative: «sedang menumpangkan ... sedang menerima» atau bentuk berulang «setiap kali ... mereka menerima»
  rationale: Kedua verba Yunani berbentuk imperfek, tetapi aspek itu tidak dengan sendirinya menentukan apakah tindakan sedang berlangsung atau berulang. Memaksakan «sedang» atau «setiap kali» akan mempersempit ambiguitas aspek yang ada dalam sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. «Orang-orang itu» diulang untuk mencegah kerancuan antara para rasul yang menumpangkan tangan dan orang-orang Samaria yang menerima Roh Kudus.
