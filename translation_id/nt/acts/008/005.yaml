  text: Φίλιππος δὲ κατελθὼν εἰς ⸀τὴν πόλιν τῆς Σαμαρείας ἐκήρυσσεν αὐτοῖς τὸν χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/005.yaml
  text: Philip went down to the city of Samaria and proclaimed the Messiah to them[a][b].
translation:
  language: id
  text: Filipus turun ke kota Samaria[a] dan memberitakan Mesias kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sebuah kota di Samaria.” Frasa Yunani ini dapat dipahami sebagai kota tertentu, yaitu Samaria, atau sebagai salah satu kota di wilayah Samaria.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini berfungsi sebagai penghubung ringan yang melanjutkan alur cerita. Dalam bahasa Indonesia, kesinambungan tersebut sudah alami tanpa kata penghubung eksplisit; menerjemahkannya sebagai “lalu” dapat memberi kesan urutan waktu yang lebih tegas daripada teks Yunani.
- source_word: κατελθὼν
  choice: pergi ke
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului pemberitaan Filipus. Bahasa Indonesia secara alami mengubahnya menjadi verba berurutan. Unsur arah harfiah “turun” tidak dinyatakan dalam teks utama karena kurang alami tanpa konteks geografis langsung, tetapi dicatat dalam catatan kaki.
- source_word: τὴν πόλιν τῆς Σαμαρείας
  choice: kota Samaria
  rationale: Pilihan ini mengikuti bentuk definit dalam teks Yunani dan tetap memungkinkan Samaria dipahami sebagai nama kota. Karena frasa Yunani juga dapat dipahami sebagai sebuah kota di wilayah Samaria, ambiguitas itu dipertahankan melalui catatan kaki.
- source_word: ἐκήρυσσεν
  choice: memberitakan
  rationale: Kata ini menyampaikan tindakan mengumumkan pesan secara terbuka dan berwibawa. “Memberitakan” alami dalam bahasa Indonesia serta tidak membatasi tindakan itu pada khotbah dalam pertemuan ibadah.
- source_word: αὐτοῖς
  choice: kepada orang-orang di sana
  rationale: Pronomina datif menunjuk kepada penduduk atau orang-orang di tempat tersebut. Bentuk eksplisit ini lebih jelas dan alami daripada “kepada mereka” ketika ayat dibaca tersendiri.
- source_word: τὸν χριστόν
  choice: Mesias
  rationale: Dengan artikel dan dalam konteks isi pemberitaan, Χριστός berfungsi sebagai gelar, bukan sekadar nama diri. “Mesias” mempertahankan arti gelar yang diurapi.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks ini Filipus memberitakan sosok yang dijanjikan sebagai Yang Diurapi. “Mesias” mempertahankan fungsi gelarnya dan latar pengharapan Yahudi, sedangkan “Kristus” mudah dipahami pembaca modern sebagai bagian dari nama diri.
- issue: Identitas πόλις τῆς Σαμαρείας
  choice: kota Samaria dalam teks utama, dengan alternatif sebuah kota di wilayah Samaria dalam catatan kaki
  alternative: sebuah kota di Samaria
  rationale: Artikel Yunani mendukung terjemahan definit, tetapi konstruksi genitifnya tidak meniadakan pemahaman regional. Karena pilihan ini dapat memengaruhi identifikasi lokasi, ambiguitas asli tidak diselesaikan secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Orang-orang di sana” memperjelas rujukan pronomina bagi pembacaan ayat secara mandiri. Penanda catatan kaki ditempatkan tepat setelah unsur yang diterangkan.
