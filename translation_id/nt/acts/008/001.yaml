    rationale: Walaupun dapat dipahami sebagai tindakan membunuh Stefanus, bentuk ini lebih kaku daripada ungkapan Indonesia yang lazim. “Pembunuhan itu” merujuk secara anaforis kepada peristiwa yang baru saja diceritakan dan mempertahankan fokus pada tindakan.
  - severity: low
    issue: “Ke berbagai daerah” sedikit kurang kuat untuk cakupan κατὰ τὰς χώρας.
    rationale: Frasa Yunani menunjuk persebaran melintasi wilayah-wilayah Yudea dan Samaria. “Ke seluruh wilayah Yudea dan Samaria” lebih langsung menyampaikan cakupan tersebut.
