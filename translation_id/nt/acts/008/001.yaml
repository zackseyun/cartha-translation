  to: Saulus menyetujui pembunuhan itu.[a] Pada hari itu terjadi penganiayaan besar terhadap jemaat di Yerusalem. Mereka semua tersebar ke seluruh wilayah Yudea dan Samaria, kecuali para rasul.
  rationale: Revisi hanya memperbaiki kelancaran dan kejelasan idiomatis. “Pembunuhan itu” mempertahankan arti ἀναίρεσις sebagai tindakan membunuh tanpa memilih istilah “eksekusi,” yang dapat menyiratkan legitimasi hukum. Catatan kaki tetap ditempatkan tepat pada frasa yang diterangkan dan mempertahankan alternatif yang relevan.
