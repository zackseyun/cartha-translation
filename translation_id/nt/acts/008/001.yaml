id: ACT.8.1
reference: Acts 8:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἦν συνευδοκῶν τῇ ἀναιρέσει αὐτοῦ. Ἐγένετο δὲ ἐν ἐκείνῃ τῇ ἡμέρᾳ διωγμὸς μέγας ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις· πάντες δὲ διεσπάρησαν κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας πλὴν τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/001.yaml
  text: Saul was approving of his execution. And on that day a great persecution arose against the church in Jerusalem[a], and they were all scattered throughout the regions of Judea and Samaria, except the apostles.
translation:
  language: id
  text: Saulus menyetujui pembunuhan itu.[a] Pada hari itu terjadi penganiayaan besar terhadap jemaat di Yerusalem. Mereka semua tersebar ke seluruh wilayah Yudea dan Samaria, kecuali para rasul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kematiannya”, “eksekusinya”, atau, secara lebih interpretatif, “pembunuhannya”. Kata Yunani menunjuk pada tindakan menghilangkan nyawanya.
    reason: Menjelaskan rentang arti ἀναίρεσις dan menghindari kesan bahwa teks dengan sendirinya menetapkan keabsahan hukum atau klasifikasi moral tertentu.
lexical_decisions:
- source_word: Σαῦλος
  choice: Saulus
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: συνευδοκῶν
  choice: menyetujui
  rationale: Menyatakan persetujuan atau dukungan Saulus terhadap tindakan tersebut tanpa menyiratkan bahwa ia sendiri melakukan pembunuhan itu.
- source_word: ἀναιρέσει αὐτοῦ
  choice: tindakan membunuhnya
  rationale: Mempertahankan acuan pada tindakan menghilangkan nyawa, bukan sekadar fakta kematian, sekaligus tidak memberi kesan bahwa tindakan itu merupakan pelaksanaan hukuman yang sah.
- source_word: Ἐγένετο
  choice: terjadilah
  rationale: Secara alami memperkenalkan timbulnya peristiwa penganiayaan pada hari itu.
- source_word: διωγμὸς μέγας
  choice: penganiayaan besar
  rationale: Mempertahankan nomina dan penekanan μέγας secara langsung.
- source_word: ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις
  choice: terhadap jemaat di Yerusalem
  rationale: Kata 'terhadap' menyampaikan arah permusuhan, sedangkan 'jemaat' merupakan padanan Indonesia yang alami bagi ἐκκλησία dalam konteks ini.
- source_word: πάντες δὲ διεσπάρησαν
  choice: Mereka semua tersebar
  rationale: Mempertahankan cakupan 'semua' serta bentuk pasif yang menggambarkan tercerai-berainya jemaat.
- source_word: κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας
  choice: ke berbagai daerah di Yudea dan Samaria
  rationale: Mengungkapkan penyebaran melintasi wilayah-wilayah geografis tersebut dalam bahasa Indonesia yang wajar.
- source_word: πλὴν τῶν ἀποστόλων
  choice: kecuali para rasul
  rationale: Menyatakan pengecualian secara langsung dan mempertahankan pembatasan atas kata 'semua'.
theological_decisions:
- issue: Makna ἀναιρέσει αὐτοῦ sehubungan dengan kematian Stefanus
  choice: tindakan membunuhnya
  alternative: kematiannya; pelaksanaan hukuman mati atasnya; pembunuhannya
  rationale: Pilihan ini menyatakan tindakan menghilangkan nyawa sebagaimana ditunjukkan oleh kata Yunani, tanpa mengesahkan tindakan itu secara hukum melalui istilah 'pelaksanaan hukuman mati' atau menambahkan penilaian hukum-moral yang lebih tegas melalui 'pembunuhan'.
- issue: Cakupan πάντες
  choice: Mereka semua tersebar ... kecuali para rasul
  alternative: semua orang percaya tersebar; semua anggota jemaat tersebar
  rationale: Teks mempertahankan daya retoris 'semua' lalu memberikan pengecualian eksplisit bagi para rasul; rujukan 'mereka' diperoleh dari jemaat Yerusalem dalam kalimat sebelumnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menambahkan penanda wacana yang tidak terdapat dalam sumber. Penanda catatan kaki [a] ditempatkan tepat sesudah frasa yang dijelaskannya.
