id: ACT.8.18
reference: Acts 8:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἰδὼν δὲ ὁ Σίμων ὅτι διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ ⸀πνεῦμα προσήνεγκεν αὐτοῖς χρήματα
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/018.yaml
  text: But when Simon saw that the Spirit was given through the laying on of the apostles’ hands[a], he offered them money,
translation:
  language: id
  text: Namun, ketika Simon melihat bahwa Roh diberikan melalui penumpangan tangan para rasul[a], ia menawarkan uang kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Roh Kudus.” Teks Yunani hanya menyebut “Roh”, tetapi dalam konteks ini yang dimaksud adalah Roh Kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: ketika ... melihat
  rationale: Partisip aorist ὁράω berfungsi secara temporal; bentuk ini alami dalam bahasa Indonesia dan mempertahankan urutan peristiwa.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai perkembangan dengan nuansa kontras ringan ketika narasi beralih kepada reaksi Simon.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν
  choice: melalui penumpangan tangan
  rationale: διά dengan genitif menyatakan sarana atau perantaraan. 'Penumpangan tangan' merupakan ungkapan Indonesia yang jelas dan lazim untuk tindakan ini.
- source_word: τῶν ἀποστόλων
  choice: para rasul
  rationale: Genitif ini mengaitkan tangan yang ditumpangkan dengan para rasul; susunan 'penumpangan tangan para rasul' alami dan tetap tepat.
- source_word: δίδοται
  choice: diberikan
  rationale: Bentuk kini pasif Yunani menyatakan bahwa Roh adalah pihak yang menerima tindakan; bahasa Indonesia dapat mempertahankan bentuk 'diberikan' tanpa memaksakan penanda waktu tambahan.
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Teks Yunani menyebut 'Roh' tanpa kata 'Kudus'; kapitalisasi menandai rujukan personal yang dalam konteksnya adalah Roh Kudus, sementara bentuk sumber tetap dipertahankan.
- source_word: προσήνεγκεν
  choice: menawarkan
  rationale: Dalam konteks usulan pembayaran, προσφέρω berarti menawarkan atau menyerahkan; 'menawarkan' paling alami dan tepat.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Pronomina ini merujuk kepada para rasul sebagai penerima tawaran Simon.
- source_word: χρήματα
  choice: uang
  rationale: χρήματα di sini berarti uang atau sejumlah uang; 'uang' adalah padanan langsung dan wajar.
theological_decisions:
- issue: Rujukan τὸ πνεῦμα
  choice: Roh, dengan rujukan kepada Roh Kudus
  alternative: Roh Kudus
  rationale: Konteks langsung dengan jelas merujuk kepada Roh Kudus, tetapi teks ayat ini hanya berbunyi 'Roh'. Teks utama mempertahankan bentuk ringkas itu dan catatan kaki menjelaskan rujukannya.
- issue: Perantaraan dalam pemberian Roh
  choice: Roh diberikan melalui penumpangan tangan para rasul
  alternative: Roh Kudus dianugerahkan oleh penumpangan tangan para rasul
  rationale: Ungkapan ini mempertahankan διά dengan genitif sebagai sarana tanpa menjadikan para rasul sebagai sumber utama Roh dan tanpa memaksakan kesimpulan sakramental maupun antisupranatural yang melampaui ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Penumpangan tangan' dipertahankan sebagai istilah yang dikenal luas, sedangkan susunan kalimat dibuat alami bagi pembaca umum.
