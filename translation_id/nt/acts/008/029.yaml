base_translation:
  language: en
  yaml_path: translation/nt/acts/008/029.yaml
  text: Then the Spirit said to Philip[a], “Go over and join this chariot.”
translation:
  language: id
  text: Lalu Roh berkata kepada Filipus, “Dekatilah kereta ini dan tetaplah dekat dengannya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: berkata
  rationale: Bentuk aoris λέγω dalam narasi dengan ujaran langsung paling alami diterjemahkan “berkata”.
- source_word: δὲ
  choice: Lalu
  rationale: Di sini δέ menandai kelanjutan peristiwa, bukan pertentangan kuat; “Lalu” menyampaikan urutan naratif secara wajar.
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Dalam konteks bimbingan ilahi di Kisah Para Rasul, ungkapan ini menunjuk kepada Roh Kudus. Karena teks Yunani tidak memuat ἅγιον, terjemahan mempertahankan bentuk ringkas “Roh” tanpa menambahkan “Kudus”.
- source_word: τῷ Φιλίππῳ
  choice: kepada Filipus
  rationale: Datif ini berfungsi sebagai objek tak langsung; “Filipus” adalah bentuk nama yang baku dalam bahasa Indonesia.
- source_word: Πρόσελθε
  choice: Dekatilah
  rationale: Imperatif aoris προσέρχομαι memerintahkan Filipus bergerak mendekati kereta; “Dekatilah” lugas dan alami.
- source_word: κολλήθητι
  choice: tetaplah dekat
  rationale: Imperatif κολλάομαι menyiratkan melekat atau berada sangat dekat. Dalam konteks kereta yang sedang berjalan, “tetaplah dekat” menyampaikan kedekatan yang berlanjut tanpa kekakuan harfiah “lekatkanlah dirimu”.
- source_word: τῷ ἅρματι τούτῳ
  choice: kereta ini
  rationale: ἅρμα menunjuk pada kereta atau kendaraan, sedangkan τούτῳ bersifat proksimal; “kereta ini” mempertahankan keduanya secara alami.
theological_decisions:
- issue: Rujukan τὸ πνεῦμα
  choice: “Roh” dipahami sebagai Roh Kudus, tetapi tidak diperluas menjadi “Roh Kudus” dalam teks
  alternative: Dorongan rohani yang disebut secara kurang personal atau terjemahan eksplisit “Roh Kudus”
  rationale: Pola bimbingan ilahi dalam Kisah Para Rasul mendukung rujukan kepada Roh Kudus, sementara bentuk sumber hanya berbunyi “Roh”. Terjemahan mempertahankan bentuk itu dan tidak menambahkan unsur yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dua imperatif diterjemahkan secara terpisah agar gerak mendekat dan tindakan tetap berada dekat sama-sama terpelihara. Tidak diperlukan catatan kaki karena nuansa leksikal κολλήθητι dapat ditampung langsung dalam teks.
