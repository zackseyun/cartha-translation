  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πέτρος δὲ εἶπεν πρὸς αὐτόν· Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν ὅτι τὴν δωρεὰν τοῦ θεοῦ ἐνόμισας διὰ χρημάτων κτᾶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/020.yaml
  text: But Peter said to him[a], “May your silver perish with you[b], because you thought you could acquire the gift of God with money.”
translation:
  language: id
  text: Namun Petrus berkata kepadanya, “Biarlah uangmu[a] binasa bersama dengan engkau, karena engkau mengira bahwa engkau dapat memperoleh[b] karunia Allah dengan uang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Biarlah perakmu binasa bersama dengan engkau.” Kata Yunani untuk “perak” lazim dipakai untuk menyebut uang.
    reason: lexical_alternative
  - marker: b
    text: Atau “mendapatkan” atau “membeli.” Maksudnya, Simon menganggap karunia Allah sebagai sesuatu yang dapat diperoleh melalui pembayaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριόν
  choice: uang
  rationale: Secara harfiah berarti ‘perak’ atau ‘uang perak’, tetapi dalam konteks ini merupakan sebutan umum untuk uang. ‘Uang’ paling jelas dan alami bagi pembaca Indonesia modern.
- source_word: σὺν σοὶ
  choice: bersama dengan engkau
  rationale: Mempertahankan kaitan tegas antara uang Simon dan dirinya dalam ucapan penghukuman Petrus.
- source_word: εἴη εἰς ἀπώλειαν
  choice: binasalah
  rationale: Bentuk optatif menyatakan harapan atau ucapan keras, bukan sekadar ramalan. ‘Binasalah’ mempertahankan daya ungkapnya tanpa mempersempitnya menjadi rumusan tentang penghukuman kekal.
- source_word: δωρεὰν
  choice: karunia
  rationale: ‘Karunia’ merupakan padanan alami dalam konteks pemberian Allah dan menonjolkan bahwa hal itu diberikan, bukan diperjualbelikan.
- source_word: ἐνόμισας
  choice: engkau mengira
  rationale: Menyampaikan arti ‘berpikir’ atau ‘menganggap’ dengan nada teguran yang sesuai konteks.
- source_word: διὰ χρημάτων
  choice: dengan uang
  rationale: διά dengan genitif menunjukkan sarana; ‘dengan uang’ adalah ungkapan Indonesia yang paling wajar.
- source_word: κτᾶσθαι
  choice: dapat diperoleh
  rationale: Kata ini berarti memperoleh atau mendapatkan. Bentuk pasif alami dalam bahasa Indonesia menjaga gagasan perolehan tanpa melebihkan nuansa komersial menjadi ‘membeli’.
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan antara permintaan Simon pada ayat sebelumnya dan jawaban keras Petrus.
theological_decisions:
- issue: Daya ucapan Petrus terhadap Simon dan uangnya
  choice: 'Ucapan imprekasi atau harapan kebinasaan: ‘Binasalah uangmu bersama dengan engkau’'
  alternative: Pernyataan ramalan kebinasaan, atau rumusan yang secara khusus menyatakan penghukuman kekal
  rationale: Optatif εἴη paling tepat dipertahankan sebagai ucapan atau harapan keras. Terjemahan ini tidak menentukan bahwa Petrus sedang menyatakan nasib kekal Simon, tetapi tetap mempertahankan beratnya teguran.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Engkau’ dipakai untuk mempertahankan nada langsung dan keras dalam teguran Petrus. Susunan ‘bersama dengan engkau’ sengaja agak formal agar cakupan ucapan terhadap uang dan orangnya tetap jelas.
