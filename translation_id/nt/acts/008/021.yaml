source:
  edition: SBLGNT
  text: οὐκ ἔστιν σοι μερὶς οὐδὲ κλῆρος ἐν τῷ λόγῳ τούτῳ, ἡ γὰρ καρδία σου οὐκ ἔστιν εὐθεῖα ⸀ἔναντι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/021.yaml
  text: You have neither part nor share in this matter, because your heart is not right before God.
translation:
  language: id
  text: Engkau tidak mempunyai bagian maupun hak dalam perkara ini, karena hatimu tidak lurus di hadapan Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερὶς οὐδὲ κλῆρος
  choice: bagian ataupun hak
  rationale: 'Mempertahankan pasangan istilah yang saling menguatkan: μερίς menunjuk pada bagian, sedangkan κλῆρος dalam konteks ini menunjuk pada hak atau andil yang diperoleh, tanpa memakai ungkapan Indonesia yang terasa ganjil seperti “undi”.'
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: dalam perkara ini
  rationale: λόγος di sini merujuk pada perkara atau urusan yang sedang dibicarakan, bukan semata-mata sebuah kata atau ucapan.
- source_word: εὐθεῖα
  choice: lurus
  rationale: Terjemahan langsung dan wajar bagi gambaran moral tentang keadaan hati yang benar atau tulus di hadapan Allah.
- source_word: ἔναντι τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: Ungkapan Indonesia alami yang mempertahankan gagasan penilaian dalam pandangan atau kehadiran Allah.
theological_decisions:
- issue: Cakupan penolakan terhadap Simon
  choice: Menyatakan bahwa ia tidak mendapat bagian atau hak “dalam perkara ini”.
  alternative: Menafsirkan secara khusus sebagai tidak memiliki bagian dalam keselamatan, pelayanan, atau Roh Kudus.
  rationale: Teks Yunani membatasi pernyataan pada τούτῳ, “perkara ini”; terjemahan tidak mempersempit atau memperluas acuannya secara doktrinal.
- issue: Keadaan hati Simon
  choice: “hatimu tidak lurus di hadapan Allah”
  alternative: “hatimu tidak benar di hadapan Allah”
  rationale: “Lurus” mempertahankan metafora εὐθεῖα dan ketegangan moral teks tanpa menjelaskan lebih jauh sifat atau akibat keadaan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Sapaan tunggal “engkau” sesuai teguran langsung Petrus. Tidak diperlukan catatan kaki karena nuansa sumber dapat disampaikan dengan jelas dalam teks utama.
