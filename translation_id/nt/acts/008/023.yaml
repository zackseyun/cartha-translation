  yaml_path: translation/nt/acts/008/023.yaml
  text: For I see that you are in the gall of bitterness and the bond of unrighteousness[a][b].
translation:
  language: id
  text: Sebab aku melihat bahwa engkau berada dalam empedu yang pahit[b] dan belenggu ketidakbenaran[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ikatan ketidakadilan” atau “belenggu kejahatan.”
    reason: lexical_alternative
  - marker: b
    text: “Empedu yang pahit” adalah metafora yang kuat dan tampaknya menggemakan bahasa Perjanjian Lama tentang kepahitan yang beracun (bandingkan Ulangan 29:18 LXX).
    reason: cross_reference
lexical_decisions:
- source_word: εἰς
  choice: berada dalam
  rationale: Dalam konstruksi dengan ὁρῶ σε ὄντα, εἰς menyatakan keadaan atau lingkungan metaforis tempat Simon berada, bukan gerak masuk.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memberikan alasan bagi teguran Petrus sebelumnya; “Sebab” mempertahankan hubungan penjelas itu secara wajar dalam bahasa Indonesia.
- source_word: χολὴν πικρίας
  choice: empedu kepahitan
  rationale: Ungkapan ini dipertahankan sebagai metafora padat yang bernuansa bahasa Kitab Suci dan kemungkinan menggemakan Ulangan 29:18 LXX, tanpa meratakannya menjadi sekadar “kepahitan” atau “racun pahit”.
- source_word: σύνδεσμον ἀδικίας
  choice: belenggu ketidakbenaran
  rationale: σύνδεσμος menunjuk pada sesuatu yang mengikat, sedangkan ἀδικία dapat berarti ketidakbenaran, kejahatan, atau ketidakadilan. “Belenggu ketidakbenaran” mempertahankan metafora ikatan dan cakupan moral yang luas.
- source_word: ὁρῶ
  choice: aku melihat
  rationale: Pilihan ini dekat dengan makna dasar verba Yunani dan juga alami dalam bahasa Indonesia untuk menyatakan pengamatan atau pemahaman.
- source_word: σε ὄντα
  choice: bahwa engkau berada
  rationale: Konstruksi akusatif dengan partisip sesudah ὁρῶ dialihkan menjadi klausa isi yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Gambaran metaforis tentang keadaan rohani dan moral Simon
  choice: 'Mempertahankan dua metafora sebagai keadaan kini: “dalam empedu kepahitan dan belenggu ketidakbenaran.”'
  alternative: Menafsirkannya secara lebih eksplisit sebagai “penuh racun kepahitan dan diperbudak dosa/kejahatan.”
  rationale: Teks Yunani memakai ungkapan metaforis yang padat dan tidak memberikan uraian doktrinal. Mempertahankannya menjaga ketegangan, kekerasan teguran, dan ambiguitas asli.
translation_notes:
  register: Bahasa Indonesia modern yang formal dan bermartabat. Kata ganti “engkau” sesuai dengan tuturan langsung dalam konteks Alkitab. Metafora sumber sengaja dipertahankan; catatan kaki menjelaskan alternatif leksikal dan kemungkinan gema Perjanjian Lama.
