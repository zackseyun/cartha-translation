  text: ἀνοίξας δὲ ὁ Φίλιππος τὸ στόμα αὐτοῦ καὶ ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/035.yaml
  text: Then Philip opened his mouth[a], and beginning from this Scripture[b], he proclaimed the good news about Jesus to him.
translation:
  language: id
  text: Lalu Filipus mulai berbicara dan, bertolak dari bagian Kitab Suci itu, memberitakan kabar baik tentang Yesus kepadanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνοίξας ... τὸ στόμα αὐτοῦ
  choice: mulai berbicara
  rationale: Ungkapan ini adalah idiom yang berarti mulai berbicara. Terjemahan maknawi ini lebih wajar dalam bahasa Indonesia modern daripada bentuk harfiah 'membuka mulutnya'.
- source_word: δὲ
  choice: Lalu
  rationale: Di sini δέ menandai kelanjutan alur cerita; 'Lalu' menyampaikan perkembangan narasi secara alami.
- source_word: ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης
  choice: Dengan bertolak dari nas Kitab Suci itu
  rationale: ἀπό menunjukkan titik awal penjelasan Filipus. 'Bertolak dari' mempertahankan nuansa tersebut, sedangkan 'nas Kitab Suci' secara alami menunjuk bagian tertentu dari tulisan suci yang baru dibaca.
- source_word: εὐηγγελίσατο
  choice: memberitakan kabar baik tentang
  rationale: Kata kerja ini berarti mengumumkan atau memberitakan kabar baik. Pilihan ini jelas bagi pembaca umum dan tidak memberi kesan kelembagaan seperti istilah 'berkhotbah'.
- source_word: αὐτῷ
  choice: kepada orang itu
  rationale: Kata ganti tersebut merujuk kepada pejabat Etiopia dalam konteks. 'Orang itu' memperjelas rujukan secara alami tanpa memasukkan gelar yang tidak terdapat dalam ayat ini.
- source_word: τὸν Ἰησοῦν
  choice: tentang Yesus
  rationale: Dalam konstruksi dengan εὐαγγελίζομαι, bentuk akusatif ini menyatakan isi pemberitaan. Ungkapan 'kabar baik tentang Yesus' alami dalam bahasa Indonesia dan mempertahankan Yesus sebagai pusat pemberitaan.
theological_decisions:
- issue: Makna εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν
  choice: Filipus memberitakan kabar baik tentang Yesus kepada orang itu.
  alternative: Filipus memberitakan Yesus kepadanya.
  rationale: Susunan Yunani menempatkan Yesus sebagai isi dan pusat tindakan memberitakan kabar baik. Terjemahan utama menyatakan hal itu dengan jelas tanpa menambahkan rumusan doktrinal.
translation_notes:
  register: Bahasa Indonesia standar modern, lugas, dan bermartabat. Idiom Yunani dialihkan secara alami, sedangkan hubungan 'bertolak dari' dipertahankan untuk menunjukkan bahwa nas tersebut menjadi titik awal penjelasan Filipus.
