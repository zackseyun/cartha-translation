  text: ὁ δὲ Σίμων καὶ αὐτὸς ἐπίστευσεν, καὶ βαπτισθεὶς ἦν προσκαρτερῶν τῷ Φιλίππῳ, θεωρῶν τε ⸂σημεῖα καὶ δυνάμεις μεγάλας γινομένας⸃ ἐξίστατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/013.yaml
  text: And Simon himself also believed[a], and after being baptized he continued with Philip, and as he saw signs and great works of power happening, he was amazed.
translation:
  language: id
  text: Simon sendiri juga percaya. Setelah dibaptis, ia terus bersama Filipus. Ketika menyaksikan tanda-tanda dan mukjizat-mukjizat besar[a] yang terjadi, ia takjub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karya-karya besar yang penuh kuasa.” Istilah Yunani ini dapat menunjuk pada perwujudan kuasa maupun mukjizat.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: sendiri pun
  rationale: Ungkapan ini mempertahankan penekanan pada Simon sekaligus arti tambahan bahwa ia juga memberikan tanggapan.
- source_word: ἐπίστευσεν
  choice: percaya
  rationale: Padanan langsung ini tidak menentukan apakah iman Simon sejati atau tidak, sehingga ketegangan dalam narasi tetap terpelihara.
- source_word: βαπτισθεὶς
  choice: setelah dibaptis
  rationale: Partisip aoris pasif menunjukkan tindakan yang mendahului keberlanjutan Simon bersama Filipus.
- source_word: ἦν προσκαρτερῶν τῷ Φιλίππῳ
  choice: ia terus bersama Filipus
  rationale: Bentuk imperfek perifrastis menyatakan keterikatan yang berlangsung; frasa ini alami dan tidak melebihkan nuansanya menjadi pemuridan formal.
- source_word: θεωρῶν
  choice: ketika menyaksikan
  rationale: Menyatakan pengamatan yang berlangsung dan menghubungkannya dengan ketakjuban Simon.
- source_word: σημεῖα
  choice: tanda-tanda
  rationale: Mempertahankan nuansa peristiwa yang menunjuk kepada atau menyatakan karya Allah.
- source_word: δυνάμεις μεγάλας
  choice: perbuatan-perbuatan besar yang penuh kuasa
  rationale: Mencerminkan manifestasi kuasa secara lebih dekat daripada langsung menafsirkannya hanya sebagai mukjizat, namun tetap dapat dipahami dalam bahasa Indonesia modern.
- source_word: γινομένας
  choice: terjadi
  rationale: Menggambarkan tanda-tanda dan perbuatan penuh kuasa sebagai kejadian yang sedang berlangsung di hadapan Simon.
- source_word: ἐξίστατο
  choice: ia pun takjub
  rationale: Padanan alami bagi keadaan tercengang atau sangat heran yang berlangsung, tanpa ungkapan berlebihan.
theological_decisions:
- issue: Apakah kepercayaan Simon harus diterjemahkan dengan cara yang memastikan pertobatan sejati atau iman palsu
  choice: Menerjemahkan ἐπίστευσεν hanya sebagai “percaya”
  alternative: “sungguh-sungguh percaya”, “mengaku percaya”, atau “percaya secara dangkal”
  rationale: Ayat ini menyatakan bahwa Simon percaya dan dibaptis, sedangkan kelanjutan kisahnya menimbulkan pertanyaan penafsiran. Terjemahan tidak menyelesaikan ketegangan teologis yang tidak diselesaikan oleh kata Yunani itu sendiri.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan tiga kalimat agar alurnya jelas dan alami. Nada tetap lugas dan bermartabat; istilah teknis teologis serta kesimpulan mengenai keadaan rohani Simon dihindari.
