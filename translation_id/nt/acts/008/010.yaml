  text: ᾧ προσεῖχον ⸀πάντες ἀπὸ μικροῦ ἕως μεγάλου λέγοντες· Οὗτός ἐστιν ἡ Δύναμις τοῦ θεοῦ ἡ ⸀καλουμένη Μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/010.yaml
  text: They all paid attention to him[a], from the least to the greatest, saying, “This man is the power of God that is called Great.”
translation:
  language: id
  text: Semua orang, dari yang kecil sampai yang besar, memberi perhatian kepadanya sambil berkata, “Orang ini adalah kuasa Allah yang disebut Agung.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang ini adalah yang disebut Kuasa Agung Allah.” Ungkapan Yunani ini dapat dipahami secara lebih ringkas sebagai sebuah gelar.
    reason: alternative_reading
lexical_decisions:
- source_word: ᾧ προσεῖχον
  choice: memperhatikan dia
  rationale: Kata προσέχω di sini menyatakan perhatian yang sungguh-sungguh dan terarah kepada Simon. Ungkapan ini alami dalam bahasa Indonesia tanpa menyiratkan kesetiaan yang lebih kuat daripada teks.
- source_word: πάντες
  choice: mereka semua
  rationale: Bentuk jamak yang menyeluruh dinyatakan secara eksplisit dan alami dalam bahasa Indonesia.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: dari yang kecil sampai yang besar
  rationale: Terjemahan ini mempertahankan merisme Yunani yang mencakup seluruh lapisan masyarakat, sekaligus membiarkan nuansa usia, kedudukan, atau pengaruh tetap terbuka.
- source_word: λέγοντες
  choice: dan berkata
  rationale: Partisipel ini berlangsung bersamaan dengan tindakan memperhatikan; konstruksi koordinatif lebih alami dalam bahasa Indonesia.
- source_word: Οὗτός
  choice: Orang ini
  rationale: Demonstrativa tersebut menunjuk kepada Simon sebagai pribadi; 'Orang ini' jelas dan idiomatis.
- source_word: ἡ Δύναμις τοῦ θεοῦ
  choice: kuasa Allah
  rationale: Pilihan ini mempertahankan klaim orang banyak bahwa Simon merupakan kuasa yang berasal dari atau terkait dengan Allah, tanpa membuat narator mendukung klaim itu.
- source_word: ἡ καλουμένη Μεγάλη
  choice: yang disebut Agung
  rationale: Bentuk pasif καλουμένη menyatakan sebutan atau gelar, sedangkan 'Agung' mempertahankan fungsi Μεγάλη sebagai julukan bagi 'kuasa'.
theological_decisions:
- issue: Apakah ucapan orang banyak merupakan gelar ilahi formal atau pernyataan deskriptif tentang Simon
  choice: Orang ini adalah kuasa Allah yang disebut Agung
  alternative: Orang ini adalah yang disebut Kuasa Agung Allah
  rationale: Susunan utama mengikuti struktur Yunani dan melaporkan atribusi orang banyak tanpa mengesahkannya sebagai penilaian narator. Catatan kaki mempertahankan kemungkinan bahwa keseluruhan frasa berfungsi sebagai ungkapan bergelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Diksi sederhana dipakai agar mudah dipahami, sementara struktur kutipan mempertahankan ambiguitas mengenai sifat gelar yang diberikan orang banyak kepada Simon.
