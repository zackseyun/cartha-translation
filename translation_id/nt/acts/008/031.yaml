  text: ὁ δὲ εἶπεν· Πῶς γὰρ ἂν δυναίμην ἐὰν μή τις ⸀ὁδηγήσει με; παρεκάλεσέν τε τὸν Φίλιππον ἀναβάντα καθίσαι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/031.yaml
  text: And he said[a], “How could I[b], unless someone guides me?” Then he urged Philip to come up and sit with him.
translation:
  language: id
  text: Ia menjawab, “Bagaimana mungkin aku dapat mengerti, kalau tidak ada yang membimbing aku?” Lalu ia mendesak Filipus untuk naik dan duduk bersamanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πῶς γὰρ ἂν δυναίμην
  choice: Bagaimana mungkin aku dapat mengerti
  rationale: Bentuk optatif dengan ἄν menyatakan kemungkinan atau kemampuan yang bergantung pada suatu syarat. Kata 'mengerti' dilengkapi dari konteks langsung, yakni memahami bacaan Kitab Suci, sehingga kalimatnya alami dalam bahasa Indonesia tanpa mengubah maksud.
- source_word: ἐὰν μή τις ὁδηγήσει με
  choice: kalau tidak ada yang membimbing aku
  rationale: ὁδηγέω dapat berarti menuntun atau membimbing, baik secara harfiah maupun menuju pemahaman. 'Membimbing' mempertahankan keluasan makna itu dan tidak mempersempitnya menjadi sekadar 'menjelaskan'.
- source_word: παρεκάλεσέν
  choice: meminta
  rationale: Dalam konteks ini παρακαλέω menunjuk pada permintaan atau undangan yang sungguh-sungguh. 'Meminta' terdengar alami dan bermartabat; intensitas yang berlebihan seperti 'memohon-mohon' tidak dituntut oleh konteks.
- source_word: τε
  choice: Lalu
  rationale: Partikel penghubung τέ mengaitkan tindakan berikutnya dalam alur cerita. 'Lalu' menyampaikan perkembangan naratif secara alami.
- source_word: ἀναβάντα
  choice: naik
  rationale: ἀναβαίνω secara dasar berarti naik. Konteks menunjukkan bahwa Filipus diminta naik ke kereta, tetapi mempertahankan 'naik' menjaga gambaran spasial teks tanpa menambahkan kata 'kereta' pada ayat ini.
- source_word: καθίσαι σὺν αὐτῷ
  choice: duduk bersamanya
  rationale: Frasa ini secara langsung berarti duduk bersama dia. 'Bersamanya' alami dalam bahasa Indonesia dan tidak menentukan posisi persis seperti 'di sebelahnya'.
- source_word: Φίλιππον
  choice: Filipus
  rationale: Nama Yunani Φίλιππος ditransliterasikan menurut bentuk baku yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Objek tersirat dari δυναίμην
  choice: Menambahkan 'mengerti' berdasarkan konteks pembacaan Kitab Suci
  alternative: Bagaimana mungkin aku dapat
  rationale: Bahasa Yunani membiarkan kata kerja kemampuan tanpa infinitif yang dinyatakan, tetapi konteks memasok gagasan memahami. Dalam bahasa Indonesia, penambahan 'mengerti' diperlukan agar pertanyaan lengkap dan wajar, tanpa menyelesaikan ketegangan teologis apa pun.
translation_notes:
  register: Bahasa Indonesia standar modern, alami, dan bermartabat. Pronomina 'ia' dan 'aku' menjaga kejernihan narasi serta kealamian ujaran langsung. Tidak diperlukan catatan kaki karena pilihan utama dapat memuat nuansa sumber tanpa alternatif tekstual atau ambiguitas yang harus ditandai.
