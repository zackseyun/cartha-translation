id: ACT.8.33
reference: Acts 8:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν τῇ ⸀ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη· ⸀τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/033.yaml
  text: In his humiliation justice was taken away from him[b][a]. Who will recount his generation? For his life is taken from the earth.
translation:
  language: id
  text: Dalam keadaan direndahkan, keadilan diambil darinya.[b] Siapa yang akan mengisahkan angkatannya?[a] Sebab hidupnya diambil dari bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keturunannya” atau “orang-orang sezamannya”; kata Yunani yang diterjemahkan “angkatan” mempertahankan ketaksaan dalam kutipan dari Yesaya 53.
    reason: alternative_reading
  - marker: b
    text: Atau “penghakiman diambil darinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώσει
  choice: dalam keadaan direndahkan
  rationale: Ungkapan ini menyampaikan keadaan perendahan atau penghinaan secara alami dalam bahasa Indonesia tanpa menambahkan tafsiran tentang penyebabnya.
- source_word: κρίσις
  choice: keadilan
  rationale: Dalam konteks penderitaan pasif ini, kata tersebut menunjuk pada keadilan atau proses hukum yang semestinya tetapi dirampas darinya. Alternatif 'penghakiman' dicantumkan dalam catatan kaki.
- source_word: ἤρθη
  choice: dirampas
  rationale: Bentuk pasif ini menyatakan pengambilan atau peniadaan. 'Dirampas' secara wajar menyampaikan bahwa keadilan tidak diberikan kepadanya.
- source_word: γενεὰν
  choice: angkatannya
  rationale: '''Angkatan'' mempertahankan keluasan makna γενεά dan tidak langsung membatasinya pada keturunan ataupun orang-orang sezaman.'
- source_word: διηγήσεται
  choice: akan mengisahkan
  rationale: Kata kerja ini berarti menceritakan atau menguraikan; 'akan mengisahkan' sesuai dengan bentuk mendatang dan pertanyaan retorisnya.
- source_word: αἴρεται
  choice: diambil
  rationale: Bentuk pasif kini diterjemahkan secara ringkas dan jelas sebagai 'diambil', selaras dengan frasa berikutnya.
- source_word: γῆς
  choice: bumi
  rationale: '''Bumi'' paling alami dalam ungkapan tentang hidup yang diambil dari ranah kehidupan duniawi, meskipun ''negeri'' dapat menjadi arti kata itu dalam konteks lain.'
- source_word: ζωὴ
  choice: hidup
  rationale: Di sini kata tersebut secara langsung menunjuk pada hidup jasmani yang berakhir.
theological_decisions:
- issue: Makna 'angkatannya'
  choice: Mempertahankan ungkapan yang ambigu, 'angkatannya', dalam teks utama.
  alternative: '''Keturunannya'' atau ''orang-orang sezamannya''.'
  rationale: Kutipan dari Yesaya 53 ini sulit ditafsirkan dan dapat menunjuk pada keturunan, orang-orang sezaman, atau angkatannya secara lebih luas. Teks utama tidak menyelesaikan ketegangan tersebut secara sepihak.
- issue: Makna κρίσις
  choice: Menerjemahkannya sebagai 'keadilan'.
  alternative: '''Penghakiman''.'
  rationale: Konteksnya mendukung gagasan bahwa perlakuan hukum yang adil dirampas darinya, tetapi kemungkinan arti 'penghakiman' tetap disajikan dalam catatan kaki.
- issue: Kapitalisasi kata ganti yang merujuk kepada tokoh dalam kutipan
  choice: 'Menggunakan huruf kecil: ''darinya'', ''angkatannya'', dan ''hidupnya''.'
  alternative: 'Menggunakan kapitalisasi penghormatan: ''dari-Nya'', ''angkatan-Nya'', dan ''hidup-Nya''.'
  rationale: Teks Yunani tidak membedakan kapitalisasi teologis pada kata ganti. Huruf kecil mempertahankan bentuk kutipan tanpa menambahkan identifikasi teologis melalui tipografi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Struktur kalimat mempertahankan corak puitis kutipan, sedangkan 'dalam keadaan direndahkan' menghindari ungkapan nominal yang kaku. Kata 'angkatan' sengaja dipertahankan untuk menjaga ketaksaan sumber.
