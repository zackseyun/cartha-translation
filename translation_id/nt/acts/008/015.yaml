translation:
  language: id
  text: Keduanya turun lalu berdoa bagi mereka supaya mereka menerima Roh Kudus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Setelah mereka turun, keduanya berdoa bagi mereka.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Keduanya, setelah turun, berdoa bagi mereka.”
    reason: previous_rendering
lexical_decisions:
- source_word: οἵτινες
  choice: Keduanya
  rationale: Kata ganti relatif ini menunjuk kembali kepada Petrus dan Yohanes dalam ayat sebelumnya. “Keduanya” membuat rujukan jamak tersebut jelas dan alami dalam bahasa Indonesia tanpa menambahkan nama mereka ke dalam ayat.
- source_word: καταβάντες
  choice: turun ke sana lalu
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. “Turun ke sana lalu” mempertahankan gagasan gerak turun serta urutan tindakan dengan ungkapan Indonesia yang mengalir.
- source_word: προσηύξαντο
  choice: berdoa
  rationale: Bentuk aoris dari προσεύχομαι secara langsung berarti berdoa; bentuk medialnya tidak memerlukan penandaan khusus dalam bahasa Indonesia.
- source_word: περὶ αὐτῶν
  choice: bagi orang-orang itu
  rationale: Dengan verba berdoa, περί diikuti genitif menyatakan doa demi kepentingan orang lain. “Bagi” menyampaikan makna perantaraan itu, sedangkan “orang-orang itu” memperjelas bahwa αὐτῶν merujuk kepada kelompok yang disebut sebelumnya.
- source_word: ὅπως
  choice: supaya
  rationale: Konjungsi ini menyatakan tujuan atau hasil yang dimaksudkan dari doa tersebut. “Supaya” mempertahankan daya purposifnya secara alami.
- source_word: λάβωσιν
  choice: mereka menerima
  rationale: Subjungtif aoris sesudah ὅπως berada dalam konstruksi tujuan. Dalam bahasa Indonesia, modalitas itu sudah disampaikan oleh “supaya”, sehingga tidak perlu ditambah kata yang menyiratkan keraguan.
- source_word: πνεῦμα ἅγιον
  choice: Roh Kudus
  rationale: Dalam konteks Kisah Para Rasul, ungkapan ini menunjuk kepada Roh ilahi yang dijanjikan. Bahasa Indonesia lazim memakai “Roh Kudus” tanpa artikel.
theological_decisions:
- issue: Apakah πνεῦμα ἅγιον menunjuk kepada roh yang kudus secara umum atau kepada Roh Kudus ilahi
  choice: Roh Kudus
  alternative: suatu roh kudus
  rationale: Dalam alur kisah ini, ungkapan tersebut menunjuk kepada Roh yang diberikan kepada orang percaya. Kapitalisasi mengidentifikasi referennya tanpa menambahkan penjelasan doktrinal yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang lugas dan bermartabat. Kata “lalu” menyampaikan urutan tindakan partisip aoris secara alami; “turun” mempertahankan sudut pandang geografis narasi. Kedua penanda catatan kaki ditempatkan dalam teks utama.
