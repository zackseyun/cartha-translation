id: ACT.8.22
reference: Acts 8:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μετανόησον οὖν ἀπὸ τῆς κακίας σου ταύτης, καὶ δεήθητι τοῦ ⸀κυρίου εἰ ἄρα ἀφεθήσεταί σοι ἡ ἐπίνοια τῆς καρδίας σου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/022.yaml
  text: Therefore repent of this wickedness of yours[a], and pray to the Lord, if perhaps the intent of your heart may be forgiven you.
translation:
  language: id
  text: Karena itu, bertobatlah dari kejahatanmu ini dan mohonlah kepada Tuhan, siapa tahu, niat hatimu itu[a] diampuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pikiran hatimu itu.”
    reason: ἐπίνοια dapat berarti “niat” atau “pikiran”.
lexical_decisions:
- source_word: μετανόησον
  choice: bertobatlah
  rationale: Imperatif aoris menyerukan pertobatan yang tegas; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya moral-rohaninya.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari teguran Petrus sebelumnya.
- source_word: ἀπὸ τῆς κακίας σου ταύτης
  choice: dari kejahatanmu ini
  rationale: Mempertahankan gagasan berbalik dari kejahatan moral serta penekanan posesif dan demonstratif dalam teks Yunani.
- source_word: δεήθητι
  choice: mohonlah
  rationale: δέομαι menyatakan permohonan yang sungguh-sungguh; 'mohonlah kepada Tuhan' lebih tepat daripada kata umum 'berdoalah' untuk nuansa ini.
- source_word: τοῦ κυρίου
  choice: kepada Tuhan
  rationale: Mempertahankan sebutan κύριος tanpa menentukan lebih jauh referennya dalam terjemahan.
- source_word: εἰ ἄρα
  choice: siapa tahu
  rationale: Ungkapan Indonesia ini secara alami mempertahankan kemungkinan yang dijaga dan tidak menjamin hasilnya.
- source_word: ἀφεθήσεταί σοι
  choice: diampuni
  rationale: Bentuk pasif dipertahankan dan, bersama 'siapa tahu', menyampaikan pengampunan yang diharapkan tanpa kepastian berlebihan.
- source_word: ἡ ἐπίνοια
  choice: niat
  rationale: Dalam konteks ini menunjuk pada maksud batin di balik permintaan Simon, bukan sekadar pikiran yang lewat.
- source_word: τῆς καρδίας σου
  choice: hatimu
  rationale: Mempertahankan ungkapan antropologis alkitabiah dan hubungan genitif secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Tingkat kepastian mengenai kemungkinan pengampunan
  choice: Petrus memerintahkan pertobatan dan permohonan sambil menyatakan kemungkinan pengampunan secara bersyarat melalui 'siapa tahu'.
  alternative: Menjamin pengampunan setelah pertobatan, atau menyiratkan bahwa pengampunan hampir mustahil.
  rationale: εἰ ἄρα dengan bentuk pasif futur sengaja bernada berhati-hati; terjemahan tidak mengubahnya menjadi kepastian ataupun keputusasaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Siapa tahu' dipakai dalam fungsi idiomatis yang serius untuk mempertahankan kontingensi εἰ ἄρα; 'mohonlah' menampilkan kesungguhan δεήθητι.
