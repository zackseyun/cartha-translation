id: ACT.8.38
reference: Acts 8:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐκέλευσεν στῆναι τὸ ἅρμα, καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος, καὶ ἐβάπτισεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/038.yaml
  text: And he ordered the chariot to stop[a], and both Philip and the eunuch went down into the water, and he baptized him.
translation:
  language: id
  text: Ia menyuruh kereta itu berhenti. Lalu keduanya—Filipus dan sida-sida itu—turun ke dalam air[a], dan Filipus membaptis dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “turun sampai ke air”; namun, preposisi Yunani biasanya menunjukkan gerak masuk ke dalam air.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: menyuruh
  rationale: Dalam konteks ini κέλευω menyatakan perintah. “Menyuruh” alami dalam bahasa Indonesia modern dan tetap menunjukkan bahwa ia memberikan instruksi agar kereta dihentikan.
- source_word: στῆναι τὸ ἅρμα
  choice: kereta itu berhenti
  rationale: Infinitif στῆναι dengan ἅρμα menyatakan bahwa kereta dibuat berhenti. Ungkapan ini lebih alami daripada terjemahan harfiah “berdiri”.
- source_word: ἅρμα
  choice: kereta
  rationale: Ἅρμα menunjuk pada kendaraan beroda yang ditarik hewan. “Kereta” merupakan padanan Indonesia yang alami dan tidak memberi gambaran yang terlalu sempit tentang bentuk kendaraannya.
- source_word: κατέβησαν
  choice: turun
  rationale: Καταβαίνω berarti bergerak turun; frasa berikutnya menyatakan arah atau tujuannya.
- source_word: ἀμφότεροι ... ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος
  choice: keduanya—Filipus dan sida-sida itu—
  rationale: Susunan ini mempertahankan penegasan ganda dalam bahasa Yunani bahwa kedua orang tersebut bersama-sama turun.
- source_word: εἰς τὸ ὕδωρ
  choice: ke dalam air
  rationale: Εἰς biasanya menandai gerak masuk ke dalam. Pilihan ini mempertahankan daya arah preposisi tanpa menarik kesimpulan tambahan mengenai cara baptisan dilaksanakan.
- source_word: εὐνοῦχος
  choice: sida-sida
  rationale: “Sida-sida” adalah istilah Indonesia yang mapan untuk εὐνοῦχος dan mempertahankan kesinambungan penyebutan tokoh ini dalam kisah tersebut.
- source_word: ἐβάπτισεν
  choice: membaptis
  rationale: “Membaptis” adalah padanan baku dan netral bagi βαπτίζω; pilihan ini tidak memasukkan kesimpulan denominasi tertentu tentang tata cara baptisan.
- source_word: αὐτόν
  choice: dia
  rationale: Pronomina ini menunjuk kepada sida-sida sebagai orang yang menerima baptisan.
theological_decisions:
- issue: Apakah terjemahan harus menetapkan cara atau bentuk baptisan
  choice: Mempertahankan frasa arah “turun ke dalam air” dan memakai verba netral “membaptis”.
  alternative: Menerjemahkan βαπτίζω sebagai “menyelamkan” atau melemahkan εἰς menjadi sekadar “ke air”.
  rationale: Teks Yunani menyatakan bahwa keduanya turun ke dalam air dan bahwa Filipus membaptis sida-sida itu, tetapi tidak dengan sendirinya merinci seluruh tata cara baptisan. Terjemahan mempertahankan keterangan gerak tersebut tanpa menyelesaikan perdebatan denominasi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Tanda pisah membantu mempertahankan penegasan Yunani pada “keduanya” sekaligus menyebut kedua tokoh secara alami. Subjek tindakan terakhir dinyatakan sebagai “Filipus” agar rujukannya jelas dalam bahasa Indonesia, sedangkan objeknya tetap diterjemahkan dengan pronomina “dia”.
