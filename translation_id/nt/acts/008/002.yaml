  yaml_path: translation/nt/acts/008/002.yaml
  text: But devout men buried Stephen and made great lamentation over him[a][b].
translation:
  language: id
  text: Namun, sejumlah laki-laki saleh menguburkan Stefanus[a] dan mengadakan ratapan besar atasnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengurus jenazah Stefanus” atau “membawa jenazah Stefanus untuk dikuburkan”; kata Yunani ini dapat menekankan penanganan jenazah maupun pemakamannya.
    reason: lexical_alternative
  - marker: b
    text: Ratapan ini dapat mencakup ungkapan dukacita yang terdengar dan dilakukan di depan umum, bukan hanya kesedihan dalam hati.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκόμισαν
  choice: menguburkan
  rationale: Dalam konteks sesudah kematian Stefanus, verba ini merujuk pada pengurusan jenazah yang berujung pada pemakaman. 'Menguburkan' merupakan ungkapan Indonesia yang alami, sementara cakupan harfiahnya—mengangkat, membawa, atau mempersiapkan jenazah—dicatat dalam catatan kaki.
- source_word: δέ
  choice: Namun
  rationale: Partikel ini menandai peralihan dengan nuansa kontras ringan terhadap kisah kematian Stefanus sebelumnya. 'Namun' mempertahankan hubungan naratif itu tanpa memberi kontras yang terlalu keras.
- source_word: ἄνδρες εὐλαβεῖς
  choice: beberapa orang saleh
  rationale: ἄνδρες menunjukkan sejumlah laki-laki, tetapi dalam bahasa Indonesia 'orang' lazim dipakai sebagai nomina insan tanpa mengubah rujukan konteks; 'beberapa' diperlukan agar bentuk jamaknya alami. 'Saleh' menyampaikan sikap takut akan Allah dan kesungguhan beragama.
- source_word: ἐποίησαν κοπετὸν μέγαν
  choice: meratapinya dengan sangat
  rationale: Ungkapan Yunani secara idiomatis berarti melakukan ratapan besar. Bentuk verbal Indonesia ini alami dan mempertahankan intensitas μέγαν; ratapan tersebut dapat berupa ungkapan duka yang terdengar dan tampak.
- source_word: ἐπ’ αὐτῷ
  choice: -nya (dalam 'meratapinya')
  rationale: Dengan kosakata ratapan, frasa ini menunjuk Stefanus sebagai orang yang diratapi. Sufiks '-nya' menyampaikannya secara ringkas dan alami dalam bahasa Indonesia.
