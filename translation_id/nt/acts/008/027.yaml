- from: Ia pun bangkit lalu pergi. Ternyata, ada seorang laki-laki Etiopia, seorang sida-sida[a], pejabat tinggi Kandake[b], ratu orang Etiopia. Ia bertanggung jawab atas seluruh perbendaharaan ratu itu dan telah datang ke Yerusalem untuk beribadah.
  to: Ia pun bangkit lalu pergi. Tampaklah seorang laki-laki Etiopia, seorang sida-sida[a], pejabat tinggi Kandake[b], ratu orang Etiopia. Ia bertanggung jawab atas seluruh perbendaharaan ratu itu dan telah datang ke Yerusalem untuk beribadah.
  rationale: Revisi terbatas pada penggantian “Ternyata, ada” dengan “Tampaklah” agar penanda perhatian ἰδού diterjemahkan secara lebih setia tanpa menambahkan nuansa bahwa informasi itu baru terbukti atau mengejutkan. Makna selebihnya dan semua jangkar catatan kaki dipertahankan.
