source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἐπορεύθη, καὶ ἰδοὺ ἀνὴρ Αἰθίοψ εὐνοῦχος δυνάστης ⸀Κανδάκης βασιλίσσης Αἰθιόπων, ὃς ἦν ἐπὶ πάσης τῆς γάζης αὐτῆς, ὃς ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/027.yaml
  text: So he got up and went[a]. And behold, an Ethiopian man, a eunuch, a high official of Candace, queen of the Ethiopians, who was over all her treasury, had come to Jerusalem to worship[b],
translation:
  language: id
  text: Ia pun bangkit lalu pergi. Tampaklah seorang laki-laki Etiopia, seorang sida-sida[a], pejabat tinggi Kandake[b], ratu orang Etiopia. Ia bertanggung jawab atas seluruh perbendaharaan ratu itu dan telah datang ke Yerusalem untuk beribadah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pejabat istana”. Istilah Yunani ini dapat dipakai dalam arti tersebut, meskipun arti harfiahnya, “sida-sida”, kemungkinan besar dimaksudkan di sini.
    reason: lexical_alternative
  - marker: b
    text: “Kandake” mungkin merupakan gelar turun-temurun bagi ratu, bukan nama pribadinya.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς
  choice: bangkit
  rationale: Partisip aoris ini mendahului verba utama dan menyatakan tindakan awal; “bangkit lalu pergi” mempertahankan urutan tindakan secara wajar dalam bahasa Indonesia.
- source_word: ἐπορεύθη
  choice: pergi
  rationale: Padanan naratif yang langsung dan alami untuk verba gerak ini.
- source_word: ἰδοὺ
  choice: ternyata
  rationale: Berfungsi sebagai penanda perhatian naratif yang memperkenalkan tokoh baru secara hidup tanpa memakai ungkapan yang terasa kaku seperti “lihatlah”.
- source_word: ἀνὴρ Αἰθίοψ
  choice: seorang laki-laki Etiopia
  rationale: Mempertahankan unsur ἀνήρ, yang secara eksplisit menyebut laki-laki, sekaligus menyampaikan identitas geografis-etnisnya.
- source_word: εὐνοῦχος
  choice: seorang sida-sida
  rationale: Mempertahankan arti harfiah dan sosial yang paling mungkin dimaksudkan; kemungkinan arti yang lebih luas, yaitu pejabat istana, dicatat dalam catatan kaki.
- source_word: δυνάστης
  choice: pejabat tinggi
  rationale: Menyatakan kedudukan dan kewenangan orang itu dengan jelas tanpa menyiratkan bahwa ia seorang penguasa berdaulat.
- source_word: Κανδάκης βασιλίσσης Αἰθιόπων
  choice: Kandake, ratu orang Etiopia
  rationale: Mentransliterasikan Κανδάκη sebagai Kandake dan mempertahankan bentuk jamak etnonim Yunani melalui “orang Etiopia”.
- source_word: ἐπὶ πάσης τῆς γάζης αὐτῆς
  choice: bertanggung jawab atas seluruh perbendaharaan ratu itu
  rationale: Menyampaikan fungsi administratif ἐπὶ dan arti institusional γάζα, sekaligus memperjelas bahwa pronomina tersebut merujuk kepada sang ratu.
- source_word: ἐληλύθει
  choice: telah datang
  rationale: Bentuk pluskuamperfek menunjukkan bahwa kedatangannya terjadi sebelum adegan yang sedang diceritakan.
- source_word: προσκυνήσων
  choice: untuk beribadah
  rationale: Partisip futur menyatakan tujuan; ungkapan ini alami untuk konteks perjalanan ziarah ke Yerusalem.
- source_word: εἰς Ἰερουσαλήμ
  choice: ke Yerusalem
  rationale: Padanan arah yang lazim dan tepat dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah εὐνοῦχος harus diterjemahkan secara harfiah atau diperluas menjadi “pejabat istana”
  choice: Diterjemahkan secara harfiah sebagai “sida-sida” dalam teks utama
  alternative: pejabat istana
  rationale: Arti dasar istilah ini adalah seorang sida-sida, dan δυνάστης sudah menyatakan kedudukannya sebagai pejabat berwenang. Terjemahan harfiah juga mempertahankan status jasmani dan sosial tokoh tersebut tanpa memastikan lebih jauh daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ternyata” mempertahankan fungsi penanda perhatian ἰδοὺ secara alami; “sida-sida” dipertahankan karena tepat secara historis dan dikenal dalam ragam Alkitab Indonesia, dengan alternatif leksikal dijelaskan dalam catatan kaki.
