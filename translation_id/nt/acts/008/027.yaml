    rationale: Dalam bahasa Indonesia, “ternyata” lazimnya menandai hasil penemuan, koreksi harapan, atau kesimpulan. Yunani ἰδού terutama menarik perhatian pembaca pada tokoh/peristiwa yang diperkenalkan. “Tampaklah” menjalankan fungsi naratif itu tanpa menambahkan nuansa inferensial.
