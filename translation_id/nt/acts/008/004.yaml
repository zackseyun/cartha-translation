  text: Οἱ μὲν οὖν διασπαρέντες διῆλθον εὐαγγελιζόμενοι τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/004.yaml
  text: So those who had been scattered went through the region proclaiming the word[a][b][c].
translation:
  language: id
  text: Karena itu, orang-orang yang telah tercerai-berai pergi dari satu tempat ke tempat lain sambil memberitakan firman.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “memberitakan” mengandung arti menyampaikan sesuatu sebagai kabar baik.
    reason: lexical_alternative
  - marker: b
    text: Atau “pesan”; dalam konteks ini, pesan tentang Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν
  choice: Karena itu, orang-orang
  rationale: οὖν menghubungkan tindakan ini sebagai akibat dari penganiayaan dan tercerai-berainya para percaya dalam konteks sebelumnya. μέν terutama berfungsi menata alur wacana dan tidak perlu diterjemahkan tersendiri.
- source_word: διασπαρέντες
  choice: yang telah tercerai-berai
  rationale: Partisipel aoris pasif ini menunjuk pada tindakan yang mendahului perjalanan mereka. Bentuk 'telah tercerai-berai' mempertahankan nuansa bahwa mereka disebarkan oleh keadaan atau pihak lain tanpa membuat pelakunya eksplisit.
- source_word: διῆλθον
  choice: pergi dari satu tempat ke tempat lain
  rationale: Dalam konteks ini, kata tersebut menggambarkan perjalanan berkeliling atau melintasi berbagai tempat, bukan sekadar melewati satu lokasi.
- source_word: εὐαγγελιζόμενοι
  choice: sambil memberitakan
  rationale: Partisipel ini menyatakan kegiatan yang menyertai perjalanan mereka. 'Sambil memberitakan' alami dalam bahasa Indonesia; unsur kabar baik yang melekat pada verba Yunani dijelaskan dalam catatan.
- source_word: τὸν λόγον
  choice: firman
  rationale: λόγος di sini adalah pesan yang diberitakan para pengikut Yesus. 'Firman' mempertahankan ungkapan ringkas Lukas dan kosakata Alkitab yang dikenal, sedangkan makna kontekstualnya diterangkan dalam catatan.
theological_decisions:
- issue: Hubungan εὐαγγελιζόμενοι dengan τὸν λόγον
  choice: memberitakan firman
  alternative: menyampaikan firman sebagai kabar baik
  rationale: τὸν λόγον merupakan objek langsung dari verba yang bermakna memberitakan kabar baik. Terjemahan utama mempertahankan hubungan sintaksis itu dan menghindari ungkapan kaku seperti 'kabar baik tentang firman'; kandungan semantis 'kabar baik' dijaga melalui catatan kaki.
- issue: Rujukan 'firman'
  choice: mempertahankan istilah ringkas sambil menjelaskan bahwa yang dimaksud ialah pesan tentang Yesus
  alternative: pesan tentang Yesus
  rationale: Teks Yunani hanya mengatakan 'firman/pesan'. Menambahkan 'tentang Yesus' langsung ke dalam ayat akan memperjelas secara interpretatif sesuatu yang dipahami dari konteks, tetapi tidak dinyatakan secara eksplisit di sini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Tercerai-berai' mempertahankan gambaran kuat dari teks sumber; 'dari satu tempat ke tempat lain' mengungkapkan gerak berkeliling secara alami; 'firman' menjaga istilah ringkas Lukas tanpa menambahkan 'Allah' yang tidak terdapat dalam ayat ini.
