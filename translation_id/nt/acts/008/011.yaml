  yaml_path: translation/nt/acts/008/011.yaml
  text: And they paid attention to him because for a considerable time he had amazed them with his magic arts[a][b].
translation:
  language: id
  text: Mereka terus memperhatikan dia karena sudah cukup lama ia membuat mereka takjub dengan praktik sihirnya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "selama waktu yang lama."
    reason: lexical_alternative
  - marker: b
    text: Atau "dengan ilmu sihirnya."
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: terus memperhatikan
  rationale: Bentuk imperfek menunjukkan perhatian yang berlangsung; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan aspek tersebut.
- source_word: αὐτῷ
  choice: dia
  rationale: Datif sebagai objek προσέχω diterjemahkan secara alami sebagai objek langsung setelah 'memperhatikan' dalam bahasa Indonesia.
- source_word: διὰ τὸ ἱκανῷ χρόνῳ
  choice: karena selama waktu yang cukup lama
  rationale: διά dengan infinitif berartikel menyatakan sebab, sedangkan ἱκανῷ χρόνῳ menunjukkan jangka waktu yang cukup panjang atau cukup berarti.
- source_word: ταῖς μαγείαις
  choice: dengan praktik-praktik sihirnya
  rationale: μαγεία merujuk pada praktik sihir. Bentuk jamak 'praktik-praktik' mencerminkan bentuk Yunani dan tidak menentukan apakah praktik itu tipuan, kegiatan gaib, atau keduanya; '-nya' diperjelas dari konteks sebagai milik Simon.
- source_word: ἐξεστακέναι
  choice: telah membuat ... takjub
  rationale: Infinitif perfek ἐξίστημι di sini berarti menyebabkan ketakjuban; 'telah membuat ... takjub' menyatakan akibat yang sudah ditimbulkan dan mendasari perhatian mereka.
- source_word: αὐτούς
  choice: mereka
  rationale: Objek langsung ἐξεστακέναι, mengacu kepada orang-orang yang disebut dalam konteks.
theological_decisions:
- issue: Hakikat praktik Simon dalam μαγείαις
  choice: praktik-praktik sihir
  alternative: ilmu sihir; tenung
  rationale: Ayat ini menyebut praktik Simon sebagai μαγεία dan menggambarkan pengaruhnya atas orang banyak, tetapi tidak menetapkan apakah praktik tersebut berupa tipuan, aktivitas gaib, atau keduanya. Terjemahan mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. 'Terus memperhatikan' menangkap nuansa imperfek tanpa terasa kaku; 'praktik-praktik sihir' mudah dipahami dan menghindari istilah yang terlalu arkais atau terlalu menentukan hakikat kegiatannya.
