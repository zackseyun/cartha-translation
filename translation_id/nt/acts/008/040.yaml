id: ACT.8.40
reference: Acts 8:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/040.yaml
  text: But Philip was found at Azotus[a], and as he passed through, he was proclaiming the good news to all the cities until he came to Caesarea.
translation:
  language: id
  text: Namun, Filipus didapati berada di Asdod[a]. Sambil melintasi daerah itu, ia memberitakan kabar baik di semua kota sampai ia tiba di Kaisarea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “muncul di Asdod.” Secara lebih harfiah, teks Yunani berbunyi “didapati di Asdod.” Dalam konteks ini, ungkapan tersebut mungkin menyiratkan bahwa Allah memindahkan Filipus secara tiba-tiba, tetapi tidak menyatakannya secara langsung.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan naratif dengan sedikit kontras terhadap tindakan Roh pada ayat sebelumnya, tanpa memberi kesan pertentangan yang kuat.
- source_word: εὑρέθη εἰς Ἄζωτον
  choice: didapati berada di Asdod
  rationale: Mempertahankan bentuk pasif dan ungkapan netral teks Yunani. Tambahan 'berada' membuat hasil keberadaan pada suatu tempat jelas dan alami dalam bahasa Indonesia tanpa menafsirkan tindakan itu secara eksplisit sebagai kemunculan ajaib.
- source_word: Ἄζωτον
  choice: Asdod
  rationale: Menggunakan bentuk nama kota yang lazim dalam tradisi dan pemakaian Alkitab bahasa Indonesia, alih-alih transliterasi Yunani 'Azotus'.
- source_word: διερχόμενος
  choice: Sambil melintasi daerah itu
  rationale: Partisipel ini menyatakan tindakan yang berlangsung bersamaan dengan pemberitaan. 'Daerah itu' menjadikan pemakaian absolut verba tersebut alami dalam bahasa Indonesia dan menyiratkan perjalanan melalui kota-kota di sepanjang rute.
- source_word: εὐηγγελίζετο
  choice: ia memberitakan kabar baik
  rationale: Mengungkapkan tindakan yang sedang berlangsung atau berulang dalam bentuk imperfek dengan bahasa modern dan mudah dipahami, tanpa jargon gerejawi.
- source_word: τὰς πόλεις πάσας
  choice: di semua kota
  rationale: Menunjukkan bahwa Filipus memberitakan kabar baik di kota-kota sepanjang perjalanannya; preposisi 'di' alami karena kota-kota itu merupakan tempat berlangsungnya pemberitaan.
- source_word: ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν
  choice: sampai ia tiba di Kaisarea
  rationale: Menyampaikan batas akhir tindakan berkelanjutan secara alami; 'tiba di' secara tepat menyatakan tujuan gerak.
theological_decisions:
- issue: Apakah εὑρέθη harus diterjemahkan dengan secara eksplisit menyatakan bahwa Filipus muncul secara ajaib atau dipindahkan oleh Allah
  choice: Mempertahankan ungkapan netral 'didapati berada di Asdod' dalam teks utama
  alternative: '''tiba-tiba muncul di Asdod'' atau ''mendapati dirinya berada di Asdod'''
  rationale: Konteks mengisyaratkan tindakan ilahi yang luar biasa, tetapi bentuk Yunani secara harfiah menyatakan bahwa Filipus 'didapati'. Terjemahan utama mempertahankan ketegangan itu dan tidak menambahkan cara perpindahan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Didapati berada' dipilih untuk menjaga bentuk pasif sumber sambil tetap jelas bagi pembaca umum; nama tempat memakai bentuk Indonesia yang lazim, Asdod dan Kaisarea.
