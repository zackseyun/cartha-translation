  text: Οἱ μὲν οὖν διαμαρτυράμενοι καὶ λαλήσαντες τὸν λόγον τοῦ κυρίου ⸀ὑπέστρεφον εἰς ⸀Ἱεροσόλυμα, πολλάς τε κώμας τῶν Σαμαριτῶν ⸀εὐηγγελίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/025.yaml
  text: So[a], after they had solemnly testified and spoken the word of the Lord, they were returning to Jerusalem[b], and were proclaiming the good news in many Samaritan villages.
translation:
  language: id
  text: Setelah bersaksi dengan sungguh-sungguh dan menyampaikan firman Tuhan, mereka pun kembali ke Yerusalem dan memberitakan kabar baik di banyak desa orang Samaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαμαρτυράμενοι
  choice: bersaksi dengan sungguh-sungguh
  rationale: Mengungkapkan kesaksian yang tegas dan berbobot tanpa mempersempit maknanya menjadi peringatan.
- source_word: λαλήσαντες
  choice: menyampaikan
  rationale: Dalam konstruksi dengan objek langsung 'firman Tuhan', 'menyampaikan' terdengar alami dalam bahasa Indonesia dan tetap mempertahankan tindakan berbicara.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: firman Tuhan
  rationale: Padanan baku dan bermartabat dalam konteks pemberitaan Perjanjian Baru; tetap mempertahankan resonansi λόγος dan κύριος.
- source_word: ὑπέστρεφον
  choice: kembali
  rationale: Dalam rangkaian 'kembali ... sambil memberitakan', tindakan yang sedang berlangsung pada bentuk imperfek tersampaikan secara alami tanpa ungkapan Indonesia yang kaku.
- source_word: πολλάς τε κώμας τῶν Σαμαριτῶν
  choice: di banyak desa orang Samaria
  rationale: Menjaga penyebutan etnis secara eksplisit dan secara alami dapat berarti desa-desa yang dihuni atau dimiliki komunitas Samaria.
- source_word: εὐηγγελίζοντο
  choice: memberitakan kabar baik
  rationale: Mengungkapkan tindakan pemberitaan yang berlangsung, jelas bagi pembaca modern, dan menghindari jargon gerejawi.
theological_decisions:
- issue: Identitas subjek tersirat
  choice: Tetap memakai 'mereka' tanpa menyisipkan nama.
  alternative: Menyebut 'Petrus dan Yohanes'.
  rationale: Konteks menunjuk kepada Petrus dan Yohanes, tetapi ayat Yunani hanya memiliki subjek jamak tersirat; terjemahan tidak menambahkan nama yang tidak terdapat dalam ayat.
- issue: Hubungan waktu antara kembali dan memberitakan
  choice: Menerjemahkan tindakan kedua dengan 'sambil', sebagai kegiatan yang berlangsung selama perjalanan kembali.
  alternative: 'Memisahkannya sebagai dua tindakan berurutan: ''mereka kembali ... dan memberitakan ...''.'
  rationale: Kedua verba berbentuk imperfek dan paling wajar dipahami sebagai tindakan yang berlangsung secara bersamaan; 'sambil' menyampaikan hubungan ini secara alami tanpa mengubah isi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Mereka pun' menangkap fungsi penghubung μὲν οὖν secara idiomatis. Tidak diperlukan catatan kaki karena tidak ada varian atau ambiguitas penting yang harus ditampilkan pada tingkat teks pembaca.
