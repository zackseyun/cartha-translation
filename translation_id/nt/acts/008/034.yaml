translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan “Saya mohon” mempertahankan kesantunan permintaan. Istilah “sida-sida” dipertahankan demi ketepatan identitas tokoh, bukan digeneralisasi menjadi “pejabat.”
