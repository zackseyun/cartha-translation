base_translation:
  language: en
  yaml_path: translation/nt/acts/008/034.yaml
  text: Then the eunuch answered Philip and said[a], “I ask you, about whom does the prophet say this—about himself or about someone else?”
translation:
  language: id
  text: Lalu sida-sida itu menjawab Filipus, “Saya mohon kepada Anda[a], tentang siapakah nabi itu mengatakan hal ini—tentang dirinya sendiri atau tentang orang lain?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Saya sangat memohon kepada Anda.” Ungkapan Yunani ini menyampaikan permintaan yang hormat dan dapat diterjemahkan dengan tingkat kesungguhan yang berbeda.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Lalu ... berkata
  rationale: Partisip ἀποκριθείς bersama verba ujar εἶπεν merupakan ungkapan naratif yang memperkenalkan tanggapan. Bahasa Indonesia alami cukup memakai “berkata,” sedangkan δέ diterjemahkan “Lalu” sebagai penanda kelanjutan narasi.
- source_word: εὐνοῦχος
  choice: sida-sida
  rationale: Istilah ini secara khusus menunjuk pada laki-laki yang dikebiri, bukan sekadar pejabat. “Sida-sida” mempertahankan identitas tokoh dalam teks Yunani dan merupakan istilah Indonesia baku.
- source_word: τῷ Φιλίππῳ
  choice: kepada Filipus
  rationale: Bentuk datif menandai orang yang menjadi tujuan perkataan; “kepada Filipus” wajar dalam konstruksi ujar bahasa Indonesia.
- source_word: Δέομαί σου
  choice: Saya mohon
  rationale: δέομαι menyatakan permintaan yang hormat dan dapat mengandung kesungguhan. “Saya mohon” mempertahankan daya permohonan itu tanpa membuatnya berlebihan.
- source_word: περὶ τίνος
  choice: tentang siapakah
  rationale: περί dengan genitif menyatakan pokok atau acuan. Bentuk “siapakah” sesuai untuk pertanyaan langsung yang bernada hormat.
- source_word: ὁ προφήτης λέγει τοῦτο
  choice: nabi itu mengatakan hal ini
  rationale: Frasa tersebut merujuk pada kutipan yang baru dibaca. “Nabi itu” mempertahankan kedefinitan, dan “hal ini” secara alami menunjuk pada isi kutipan.
- source_word: περὶ ἑαυτοῦ
  choice: tentang dirinya sendiri
  rationale: Pronomina refleksif mengacu kembali kepada nabi dan diterjemahkan secara langsung tanpa menentukan identitas tokoh yang dinubuatkan.
- source_word: περὶ ἑτέρου τινός
  choice: tentang orang lain
  rationale: ἑτέρου τινός berarti seseorang yang lain dan membentuk kontras langsung dengan “dirinya sendiri.”
