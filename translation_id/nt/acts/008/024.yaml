  text: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν· Δεήθητε ὑμεῖς ὑπὲρ ἐμοῦ πρὸς τὸν κύριον ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ ὧν εἰρήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/024.yaml
  text: But Simon answered[a], “You pray to the Lord for me, so that nothing of what you have said may come upon me.”
translation:
  language: id
  text: Namun Simon menjawab, “Berdoalah kalian kepada Tuhan untuk saya, supaya tidak satu pun dari apa yang telah kalian katakan menimpa saya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν
  choice: Namun Simon menjawab
  rationale: Gabungan partisip ἀποκριθείς dengan εἶπεν merupakan ungkapan idiomatis untuk memperkenalkan jawaban. 'Menjawab' menghindari pengulangan yang kaku, sedangkan 'namun' menandai peralihan bernuansa kontras dari teguran Petrus.
- source_word: Δεήθητε ὑμεῖς
  choice: Berdoalah kalian
  rationale: Imperatif jamak meminta Petrus dan Yohanes berdoa, dan pronomina eksplisit ὑμεῖς memberi penekanan kepada mereka. 'Kalian' menyatakan jumlah jamak dan penekanan itu secara wajar dalam bahasa Indonesia.
- source_word: ὑπὲρ ἐμοῦ
  choice: bagi saya
  rationale: ὑπέρ dengan genitif menyatakan doa perantaraan demi kepentingan Simon. 'Bagi saya' alami dan mempertahankan nuansa perwakilan.
- source_word: πρὸς τὸν κύριον
  choice: kepada Tuhan
  rationale: πρός menunjukkan arah doa kepada pihak yang disapa. 'Kepada Tuhan' merupakan ungkapan Indonesia yang alami tanpa mempersempit rujukan κύριος.
- source_word: ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ
  choice: supaya tidak satu pun ... menimpa saya
  rationale: ὅπως memperkenalkan hasil yang dimohonkan; μηδέν dinyatakan dengan 'tidak satu pun', dan ἐπέρχομαι dengan ἐπί dipertahankan sebagai 'menimpa', yang sesuai untuk ancaman atau hukuman.
- source_word: ὧν εἰρήκατε
  choice: dari apa yang telah kalian katakan
  rationale: Konstruksi relatif genitif bergantung pada μηδέν, sedangkan bentuk perfek εἰρήκατε menunjukkan perkataan yang tetap relevan. 'Telah kalian katakan' mempertahankan relevansi itu secara alami.
theological_decisions:
- issue: Rujukan τὸν κύριον
  choice: Tuhan
  alternative: Allah; Tuhan Yesus
  rationale: Teks Yunani hanya menyebut 'Tuhan'. Terjemahan tidak menentukan apakah rujukannya Allah atau Tuhan Yesus, sehingga tingkat kekhususan dan ketegangan teologis sumber tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Kalian' dipakai untuk memperjelas bahwa imperatif dan pronomina Yunani berbentuk jamak serta bertekanan; 'saya' cocok sebagai sapaan Simon kepada para rasul. Tidak diperlukan catatan kaki karena susunan 'tidak satu pun dari apa yang telah kalian katakan' secara langsung dan alami mewakili konstruksi Yunani.
