  text: ⸀πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα βοῶντα φωνῇ μεγάλῃ ⸀ἐξήρχοντο, πολλοὶ δὲ παραλελυμένοι καὶ χωλοὶ ἐθεραπεύθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/007.yaml
  text: For many who had unclean spirits[a], they came out crying with a loud voice; and many who were paralyzed and lame were healed.
translation:
  language: id
  text: Sebab dari banyak orang yang kerasukan roh-roh najis, roh-roh itu keluar sambil berteriak dengan suara nyaring; dan banyak orang lumpuh serta pincang disembuhkan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ γὰρ τῶν ἐχόντων
  choice: Sebab dari banyak orang yang kerasukan
  rationale: γάρ mempertahankan hubungan penjelas dengan ayat sebelumnya melalui “Sebab”. Konstruksi genitif τῶν ἐχόντων dinyatakan secara alami sebagai “dari banyak orang yang kerasukan”, yakni orang-orang yang berada di bawah kuasa roh-roh itu.
- source_word: πνεύματα ἀκάθαρτα
  choice: roh-roh najis
  rationale: Ungkapan ini merupakan padanan baku dan tepat dalam konteks pengusiran roh jahat di Lukas–Kisah Para Rasul.
- source_word: βοῶντα φωνῇ μεγάλῃ
  choice: sambil berteriak dengan suara nyaring
  rationale: Terjemahan ini mempertahankan tindakan partisipial dan keterangan suara, serta menjelaskan bahwa tindakan tersebut berlangsung ketika roh-roh itu keluar.
- source_word: ἐξήρχοντο
  choice: keluar
  rationale: Bentuk imperfek menggambarkan kejadian berulang atau berlangsung dalam narasi; bahasa Indonesia secara alami dapat memakai bentuk sederhana “keluar” dalam konteks ini.
- source_word: παραλελυμένοι
  choice: orang lumpuh
  rationale: Partisip perfek pasif menyatakan keadaan menetap; “orang lumpuh” menyampaikannya secara ringkas dan wajar.
- source_word: χωλοὶ
  choice: timpang
  rationale: “Timpang” menyatakan gangguan berjalan dan membedakannya dari kelumpuhan yang disebut sebelumnya.
- source_word: ἐθεραπεύθησαν
  choice: disembuhkan
  rationale: Bentuk pasif dipertahankan dan tidak menambahkan pelaku yang tidak disebutkan secara eksplisit dalam klausa.
theological_decisions:
- issue: Pelaku yang berteriak dan keluar
  choice: Roh-roh najis adalah pihak yang berteriak dan keluar dari orang-orang yang kerasukan.
  alternative: Orang-orang yang kerasukan berteriak ketika roh-roh itu keluar.
  rationale: Partisip neuter jamak βοῶντα secara gramatikal bersesuaian dengan πνεύματα ἀκάθαρτα, sehingga paling alami menerangkan roh-roh najis. Subjek “roh-roh itu” diulang dalam bahasa Indonesia agar rujukannya jelas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan hubungan penjelas γάρ atau rujukan gramatikal bahwa roh-roh najislah yang berteriak dan keluar.
