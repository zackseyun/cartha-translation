id: ACT.8.16
reference: Acts 8:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀οὐδέπω γὰρ ἦν ἐπ’ οὐδενὶ αὐτῶν ἐπιπεπτωκός, μόνον δὲ βεβαπτισμένοι ὑπῆρχον εἰς τὸ ὄνομα τοῦ ⸀κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/016.yaml
  text: For he had not yet fallen upon any of them[b][a]; they had only been baptized into the name of the Lord Jesus.
translation:
  language: id
  text: Sebab Roh Kudus belum turun ke atas seorang pun di antara mereka; mereka hanya telah dibaptis dalam nama Tuhan Yesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδέπω
  choice: belum
  rationale: Adverbia temporal ini menyatakan bahwa peristiwa tersebut belum terjadi sampai saat itu; “belum” merupakan padanan Indonesia yang alami dan tepat.
- source_word: ἐπ’ οὐδενὶ αὐτῶν
  choice: ke atas seorang pun dari antara mereka
  rationale: ἐπί dengan datif menunjuk kepada datangnya Roh atas orang-orang; ungkapan ini mempertahankan citra spasial yang digunakan dalam Kisah Para Rasul.
- source_word: ἐπιπεπτωκός
  choice: turun
  rationale: Secara harfiah verba ini berarti “jatuh/menimpa,” tetapi dalam konteks datangnya Roh Kudus, “turun ke atas” menyampaikan citra tersebut dengan bahasa Indonesia yang alami dan bermartabat.
- source_word: μόνον
  choice: hanya
  rationale: Menandai pembatasan dan kontras antara baptisan yang telah diterima dan turunnya Roh yang belum terjadi.
- source_word: βεβαπτισμένοι ὑπῆρχον
  choice: telah dibaptis
  rationale: Konstruksi perifrastis ini menggambarkan tindakan baptisan yang sudah berlangsung dengan keadaan hasil yang masih berlaku; “telah dibaptis” menyampaikannya secara wajar.
- source_word: εἰς τὸ ὄνομα
  choice: dalam nama
  rationale: Walaupun εἰς secara dasar dapat berarti “ke dalam,” “dibaptis dalam nama” adalah ungkapan Indonesia yang alami tanpa menentukan perdebatan teologis kemudian.
- source_word: κυρίου Ἰησοῦ
  choice: Tuhan Yesus
  rationale: Menerjemahkan gelar κύριος secara langsung dan lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Subjek tersirat dari ἐπιπεπτωκός
  choice: Roh Kudus disebutkan secara eksplisit
  alternative: Membiarkan subjek tersirat atau memakai kata ganti “Ia”
  rationale: Bahasa Yunani tidak mengulang subjek, tetapi ayat sebelumnya dengan jelas menyebut Roh Kudus. Pengulangan “Roh Kudus” membuat kalimat Indonesia mandiri dan jelas tanpa menambahkan tafsiran di luar konteks.
- issue: Ungkapan baptisan εἰς τὸ ὄνομα
  choice: dibaptis dalam nama Tuhan Yesus
  alternative: dibaptis ke dalam nama Tuhan Yesus
  rationale: “Dalam nama” lebih alami dalam bahasa Indonesia, sedangkan ayat ini tidak perlu dibuat untuk memutuskan perdebatan mengenai formula atau teologi baptisan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Struktur sebab-akibat dipertahankan melalui “Sebab,” dan kontras μόνον disampaikan dengan “hanya.”
