  text: λέγων· Δότε κἀμοὶ τὴν ἐξουσίαν ταύτην ἵνα ᾧ ἐὰν ἐπιθῶ τὰς χεῖρας λαμβάνῃ πνεῦμα ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/019.yaml
  text: saying[a], “Give me also this authority, so that anyone on whom I lay my hands may receive the Holy Spirit.”
translation:
  language: id
  text: katanya, “Berikan juga kepadaku wewenang[a] ini, supaya setiap orang yang kepadanya kutumpangkan tangan menerima Roh Kudus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kuasa” untuk “wewenang” (Yunani exousia). Istilah ini dapat berarti wewenang yang diberikan, hak, atau kuasa untuk bertindak.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: katanya
  rationale: Partisipel kini ini memperkenalkan ucapan Simon dan secara alami diterjemahkan dengan bentuk naratif Indonesia yang menghubungkannya dengan ayat sebelumnya.
- source_word: Δότε
  choice: Berikan
  rationale: Imperatif aoris jamak dari δίδωμι secara langsung berarti permintaan agar sesuatu diberikan; bentuk Indonesia ini wajar dan tetap tegas.
- source_word: κἀμοί
  choice: juga kepadaku
  rationale: Gabungan καί dan ἐμοί menekankan bahwa Simon menginginkan hal yang sama bagi dirinya.
- source_word: ἐξουσίαν
  choice: wewenang
  rationale: ἐξουσία dapat menunjuk pada wewenang, hak, atau kuasa untuk bertindak. 'Wewenang' mempertahankan nuansa otoritas dan membedakannya dari istilah Yunani lain yang lebih langsung berarti kuasa.
- source_word: ταύτην
  choice: ini
  rationale: Kata tunjuk ini merujuk pada wewenang khusus yang baru saja dilihat Simon.
- source_word: ἵνα
  choice: supaya
  rationale: Mengungkapkan tujuan atau hasil yang dimaksudkan secara alami dalam bahasa Indonesia modern.
- source_word: ᾧ ἐὰν
  choice: siapa pun yang
  rationale: Gabungan pronomina relatif dan ἐάν menyatakan orang yang tidak ditentukan secara umum.
- source_word: ἐπιθῶ τὰς χεῖρας
  choice: kutumpangi tangan
  rationale: Ungkapan ini mempertahankan tindakan konkret penumpangan tangan dan memakai bentuk Indonesia yang lazim dalam konteks Alkitab.
- source_word: λαμβάνῃ
  choice: menerima
  rationale: Subjungtif kini di bawah ἵνα menyatakan hasil yang dimaksudkan; 'supaya ... menerima' sudah menandai hubungan itu secara alami tanpa modal tambahan.
- source_word: πνεῦμα ἅγιον
  choice: Roh Kudus
  rationale: Dalam konteks Kisah Para Rasul, frasa tanpa artikel ini merujuk kepada Roh ilahi; bahasa Indonesia tidak memerlukan artikel definit seperti bahasa Inggris.
theological_decisions:
- issue: Apakah πνεῦμα ἅγιον tanpa artikel berarti suatu roh yang kudus atau Roh Kudus
  choice: Roh Kudus
  alternative: suatu roh kudus
  rationale: Konteks narasi Kisah Para Rasul menunjukkan Roh Allah. Ketidakhadiran artikel dalam bahasa Yunani tidak menuntut makna tak tentu, dan bahasa Indonesia secara alami memakai 'Roh Kudus' tanpa artikel.
- issue: Nuansa ἐξουσία sebagai otoritas atau daya efektif
  choice: wewenang
  alternative: kuasa
  rationale: Konteks menyiratkan daya efektif, tetapi istilah Yunani menyoroti wewenang atau hak untuk bertindak. Pilihan ini mempertahankan ketegangan leksikal tanpa menyamakan ἐξουσία dengan δύναμις.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Bentuk 'katanya' menjaga kesinambungan dengan ayat sebelumnya; 'kutumpangi tangan' ringkas dan sesuai idiom Alkitab Indonesia. Penanda catatan kaki ditempatkan setelah kalimat yang memuat istilah terkait.
