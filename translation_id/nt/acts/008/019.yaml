  naturalness: “Katanya” dan “Berikan juga kepadaku” wajar dalam narasi Indonesia modern. Frasa “siapa pun yang kutumpangi tangan” perlu diperbaiki karena kurang idiomatis dan berpotensi dipahami sebagai ‘membebani dengan tangan’, bukan tindakan penumpangan tangan.
  terminology: “Wewenang” merupakan padanan yang layak untuk ἐξουσίαν dan catatan alternatif “kuasa” berguna. “Roh Kudus” tepat dalam konteks ini. Istilah “menumpangkan tangan” dipertahankan, dengan sintaks yang lebih jelas.
