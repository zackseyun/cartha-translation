id: ACT.8.39
reference: Acts 8:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος, πνεῦμα κυρίου ἥρπασεν τὸν Φίλιππον, καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος, ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/039.yaml
  text: And when they came up out of the water[a], the Spirit of the Lord carried Philip away, and the eunuch saw him no longer, for he went on his way rejoicing.
translation:
  language: id
  text: Ketika mereka keluar dari air, Roh Tuhan membawa Filipus pergi[a]. Sida-sida itu tidak melihatnya lagi, sebab ia melanjutkan perjalanannya dengan sukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “merenggut Filipus pergi.” Kata kerja Yunani dapat menekankan pemindahan yang mendadak dan kuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν ἐκ τοῦ ὕδατος
  choice: keduanya keluar dari air
  rationale: Ungkapan ini menyatakan gerak keluar dari air. Penambahan 'keduanya' memperjelas bentuk jamak verba tanpa menentukan cara baptisan.
- source_word: πνεῦμα κυρίου
  choice: Roh Tuhan
  rationale: Dalam pemakaian Lukas-Kisah Para Rasul, ungkapan ini secara wajar menunjuk kepada Roh Allah yang bertindak sebagai pelaku ilahi.
- source_word: ἥρπασεν
  choice: membawa Filipus pergi
  rationale: Pilihan ini menyampaikan pemindahan Filipus oleh Roh Tuhan dalam bahasa Indonesia yang alami; nuansa mendadak dan kuat dari verba Yunani dicatat dalam catatan kaki.
- source_word: οὐκ εἶδεν αὐτὸν οὐκέτι
  choice: tidak melihatnya lagi
  rationale: Menyampaikan bahwa sejak saat itu pejabat tersebut tidak lagi melihat Filipus.
- source_word: ὁ εὐνοῦχος
  choice: pejabat istana itu
  rationale: Dalam konteks sebelumnya, εὐνοῦχος adalah seorang pejabat tinggi istana Etiopia. Pilihan ini alami bagi pembaca modern dan mempertahankan fungsi naratif tokoh, meskipun istilah Yunani secara harfiah juga dapat berarti 'sida-sida'.
- source_word: ἐπορεύετο ... τὴν ὁδὸν αὐτοῦ
  choice: meneruskan perjalanannya
  rationale: Bentuk imperfek menggambarkan perjalanan yang berlanjut; ungkapan ini lebih alami daripada terjemahan harfiah 'menempuh jalannya'.
- source_word: χαίρων
  choice: dengan sukacita
  rationale: Mengungkapkan keadaan penuh sukacita yang menyertai kelanjutan perjalanannya.
theological_decisions:
- issue: Apakah πνεῦμα κυρίου menunjuk kepada Roh Kudus atau daya ilahi yang tidak berpribadi
  choice: Roh Tuhan sebagai pelaku ilahi
  alternative: roh dari Tuhan atau daya ilahi yang tidak berpribadi
  rationale: Pemakaian ungkapan ini dalam Lukas-Kisah Para Rasul paling wajar menunjuk kepada Roh Allah. Huruf kapital mencerminkan pembacaan tersebut tanpa menambahkan 'Kudus', yang tidak tertulis dalam ayat ini.
- issue: Apakah ἥρπασεν perlu secara eksplisit menyatakan pemindahan yang mendadak dan penuh kekuatan
  choice: Teks utama memakai 'membawa Filipus pergi', dengan nuansa kuat dicatat dalam catatan kaki
  alternative: '''menyambar Filipus'' atau ''merenggut Filipus pergi'''
  rationale: Konteks jelas menunjukkan tindakan ilahi yang luar biasa, tetapi padanan yang terlalu keras dapat memberi kesan kekerasan yang tidak diperlukan. Catatan kaki mempertahankan cakupan leksikalnya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur kalimat dibagi agar alur peristiwa mudah diikuti. 'Pejabat istana' dipakai demi kesinambungan konteks dan keterbacaan; istilah sumber εὐνοῦχος tetap diakui dalam keputusan leksikal.
