  source_fidelity: Teks utama secara akurat menerjemahkan περιοχή τῆς γραφῆς sebagai “Bagian Kitab Suci,” mempertahankan aspek imperfek dalam “sedang dibacanya,” bentuk pasif “dibawa,” serta perbedaan πρόβατον (“domba”) dan ἀμνός (“anak domba”). “Ia tidak membuka mulutnya” mempertahankan kala kini dalam kutipan Yunani. Namun, catatan a memakai “pembantaian,” yang biasanya bernuansa pembunuhan massal dalam bahasa Indonesia dan kurang tepat untuk σφαγή dalam citra seekor domba yang disembelih.
