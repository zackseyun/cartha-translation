  text: ἡ δὲ περιοχὴ τῆς γραφῆς ἣν ἀνεγίνωσκεν ἦν αὕτη· Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ ⸀κείραντος αὐτὸν ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/032.yaml
  text: 'The passage of Scripture that he was reading was this: “Like a sheep he was led to slaughter[a], and like a lamb before the one shearing it is silent[b], so he does not open his mouth.”'
translation:
  language: id
  text: 'Bagian Kitab Suci yang sedang dibacanya berbunyi demikian: “Seperti seekor domba ia dibawa untuk disembelih[a], dan seperti anak domba yang diam di hadapan orang yang mencukur bulunya[b], demikianlah ia tidak membuka mulutnya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dibawa ke tempat penyembelihan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di hadapan orang yang mencukurnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιοχὴ τῆς γραφῆς
  choice: bagian Kitab Suci
  rationale: περιοχή menunjuk pada bagian tertentu dari tulisan yang sedang dibaca, sedangkan γραφή dalam konteks ini merujuk pada Kitab Suci. Ungkapan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: ἀνεγίνωσκεν
  choice: sedang dibacanya
  rationale: Bentuk imperfek menyatakan kegiatan yang tengah berlangsung pada waktu lampau; 'sedang dibacanya' mempertahankan aspek tersebut.
- source_word: Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη
  choice: Seperti seekor domba ia dibawa untuk disembelih
  rationale: Terjemahan ini mempertahankan perbandingan, bentuk pasif ἤχθη, dan tujuan yang dinyatakan oleh ἐπὶ σφαγήν dengan bahasa Indonesia yang alami.
- source_word: ἀμνὸς
  choice: anak domba
  rationale: ἀμνός secara khusus berarti anak domba, sehingga perbedaannya dari πρόβατον ('domba') tetap dipertahankan.
- source_word: ἐναντίον τοῦ κείραντος αὐτὸν ἄφωνος
  choice: diam di hadapan orang yang mencukur bulunya
  rationale: Ungkapan ini mempertahankan posisi 'di hadapan', tindakan mencukur, dan keadaan diam yang dinyatakan oleh ἄφωνος, sambil terdengar alami dalam bahasa Indonesia.
- source_word: οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ
  choice: demikianlah ia tidak membuka mulutnya
  rationale: Bentuk kini pada ἀνοίγει dipertahankan untuk menjaga gaya kutipan Kitab Suci yang hidup, dan οὕτως diterjemahkan sebagai kesimpulan perbandingan.
theological_decisions:
- issue: Kutipan mesianik dari Yesaya 53 yang dalam konteks Kisah Para Rasul diterapkan kepada Yesus
  choice: Kutipan dipertahankan dalam bentuk perumpamaan literal tanpa menyebut Yesus secara eksplisit dalam ayat ini.
  alternative: Menambahkan identifikasi langsung bahwa tokoh yang dimaksud adalah Yesus atau Sang Mesias.
  rationale: Ayat ini sendiri menyajikan kutipan Kitab Suci; identifikasi kristologis muncul dari konteks berikutnya. Terjemahan tidak mendahului penjelasan naratif atau memasukkan penafsiran ke dalam kutipan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa menjadi arkais. Susunan kutipan dibuat puitis tetapi tetap mudah dipahami; pembedaan antara 'domba' dan 'anak domba' dipertahankan.
