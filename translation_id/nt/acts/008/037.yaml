  yaml_path: translation/nt/acts/008/037.yaml
  text: And Philip[a] said, “If you believe with all your heart, you may.” And he answered and said, “I believe that Jesus is the Messiah, the Son of God.”
translation:
  language: id
  text: Lalu Filipus[a] berkata, “Jika engkau percaya dengan segenap hatimu, engkau boleh.” Ia menjawab, “Aku percaya bahwa Yesus adalah Mesias, Anak Allah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini tidak terdapat dalam naskah-naskah Yunani paling awal, termasuk papirus abad ke-3 serta Kodeks Sinaitikus dan Vatikanus dari abad ke-4, dan juga tidak terdapat dalam terjemahan-terjemahan Koptik awal. Ayat ini terdapat dalam tradisi mayoritas Bizantin dan tradisi Latin, serta dikutip oleh bapa-bapa gereja awal seperti Ireneus dan Siprianus sejak akhir abad ke-2. Banyak ahli menilainya sebagai rumusan liturgis baptisan awal yang kemudian dimasukkan ke dalam teks Kisah Para Rasul.
    reason: textual_critical
lexical_decisions:
- source_word: ἔξεστιν
  choice: engkau boleh
  rationale: Kata kerja impersonal ini menyatakan bahwa sesuatu diperbolehkan atau dimungkinkan. Dalam konteks permintaan untuk dibaptis, “engkau boleh” menyampaikan izin secara alami tanpa kesan legalistis.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: dengan segenap hatimu
  rationale: Ungkapan ini merupakan idiom alkitabiah yang menunjuk pada ketulusan dan penyerahan batin secara utuh; bentuk yang dekat dengan sumber tetap alami dalam bahasa Indonesia.
- source_word: Πιστεύω
  choice: Aku percaya
  rationale: Dalam pengakuan iman ini, “percaya” mencakup penerimaan dan kepercayaan terhadap identitas Yesus.
- source_word: τὸν Ἰησοῦν Χριστόν
  choice: Yesus Kristus
  rationale: Susunan akusatif dengan infinitif menyatakan bahwa Yesus Kristus adalah Anak Allah. “Kristus” dipertahankan sebagai gelar yang telah mapan dalam bahasa Indonesia dan tidak mengubahnya menjadi nama diri semata.
theological_decisions:
- issue: Hubungan gelar Kristus dan predikat Anak Allah
  choice: “Yesus Kristus adalah Anak Allah”
  alternative: “Yesus adalah Mesias, Anak Allah”
  rationale: Teks Yunani secara sintaksis berbunyi bahwa “Yesus Kristus” adalah “Anak Allah”; Χριστόν berada bersama Ἰησοῦν sebagai objek dari konstruksi infinitif, bukan sebagai predikat terpisah yang secara eksplisit disejajarkan dengan “Anak Allah.” Terjemahan ini mempertahankan bentuk dan ketegangan teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina “engkau” dipakai untuk dialog individual dalam konteks Alkitab. Penanda catatan kaki [a] ditempatkan langsung sesudah nama Filipus sesuai lapisan konsultasi dan menjelaskan persoalan tekstual ayat secara transparan.
