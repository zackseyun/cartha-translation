id: ACT.8.9
reference: Acts 8:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀνὴρ δέ τις ὀνόματι Σίμων προϋπῆρχεν ἐν τῇ πόλει μαγεύων καὶ ⸀ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας, λέγων εἶναί τινα ἑαυτὸν μέγαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/009.yaml
  text: A certain man named Simon had previously been in the city practicing magic and astonishing the people of Samaria[a], saying that he himself was someone great[b],
translation:
  language: id
  text: Sebelumnya, di kota itu ada seorang laki-laki bernama Simon yang mempraktikkan ilmu sihir[a] dan membuat orang-orang Samaria takjub. Ia mengatakan bahwa dirinya adalah seorang yang hebat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melakukan praktik-praktik magis.” Kata Yunani ini berarti menjalankan seni atau praktik magis.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dirinya seseorang yang penting.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις ὀνόματι Σίμων
  choice: ada seorang laki-laki bernama Simon
  rationale: Ungkapan ini memperkenalkan tokoh baru secara wajar dalam bahasa Indonesia. “Laki-laki” mempertahankan makna khusus ἀνήρ, τις memberi makna tak tentu “seorang”, dan ὀνόματι Σίμων diterjemahkan idiomatis sebagai “bernama Simon”. Daya penghubung δέ dibiarkan tersirat karena konteks sudah cukup menandai peralihan.
- source_word: προϋπῆρχεν ἐν τῇ πόλει
  choice: Sebelumnya, di kota itu ada
  rationale: προϋπῆρχεν menunjukkan keberadaan yang telah berlangsung sebelum peristiwa yang baru diceritakan. Penempatan “sebelumnya” di awal menghasilkan susunan Indonesia yang alami, sedangkan “kota itu” merujuk pada kota yang telah disebut dalam konteks.
- source_word: μαγεύων
  choice: mempraktikkan ilmu sihir
  rationale: Kata kerja ini menunjuk pada kegiatan dalam seni atau praktik magis. Pilihan ini jelas bagi pembaca modern tanpa menambahkan penilaian tentang sumber kuasanya.
- source_word: ἐξιστάνων
  choice: membuat ... takjub
  rationale: Bentuk partisipel kausatif ini berarti membuat orang tercengang atau takjub. Ungkapan “membuat ... takjub” alami dan mempertahankan peran aktif Simon.
- source_word: τὸ ἔθνος τῆς Σαμαρείας
  choice: rakyat Samaria
  rationale: ἔθνος di sini menunjuk kepada penduduk atau kelompok masyarakat Samaria secara kolektif. “Rakyat Samaria” lebih sesuai dengan konteks daripada istilah politis “negara” atau “bangsa” dalam pengertian modern.
- source_word: λέγων εἶναί τινα ἑαυτὸν μέγαν
  choice: Ia mengatakan bahwa dirinya adalah seorang yang hebat
  rationale: “Mengatakan” mempertahankan λέγων tanpa memperkuatnya menjadi “mengaku”. “Dirinya” mencerminkan ἑαυτόν dan menonjolkan pembesaran diri, sedangkan “seorang yang hebat” menyampaikan τινα ... μέγαν tanpa menentukan secara berlebihan jenis kebesarannya.
theological_decisions:
- issue: Karakterisasi kegiatan Simon
  choice: mempraktikkan ilmu sihir
  alternative: melakukan praktik-praktik magis; mempraktikkan tenung
  rationale: Ayat ini menyatakan bahwa Simon menjalankan kegiatan magis, tetapi tidak menjelaskan sumber metafisisnya dan tidak menyebutnya sebagai penipuan. Terjemahan tidak menambahkan penilaian teologis yang tidak dinyatakan oleh teks.
- issue: Sifat klaim kebesaran Simon
  choice: dirinya adalah seorang yang hebat
  alternative: dirinya seseorang yang penting; dirinya seorang tokoh besar
  rationale: Teks menggambarkan pembesaran diri Simon, tetapi μέγαν tidak menjelaskan apakah kebesaran itu berupa status sosial, kuasa, atau identitas religius tertentu. Pilihan utama mempertahankan keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi dua agar mudah dipahami tanpa mengubah hubungan antargagasan.
