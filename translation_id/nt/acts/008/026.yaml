  text: Ἄγγελος δὲ κυρίου ἐλάλησεν πρὸς Φίλιππον λέγων· Ἀνάστηθι καὶ πορεύου κατὰ μεσημβρίαν ἐπὶ τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν· αὕτη ἐστὶν ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/026.yaml
  text: An angel of the Lord spoke to Philip[a], saying[b], “Get up and go south to the road that goes down from Jerusalem to Gaza.” This is a deserted road.
translation:
  language: id
  text: Seorang malaikat Tuhan berbicara kepada Filipus, “Bangunlah dan pergilah ke arah selatan[a], menuju jalan yang menurun dari Yerusalem ke Gaza.” Jalan itu sepi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada tengah hari.” Ungkapan Yunani ini dapat menunjuk arah (“ke arah selatan”) atau waktu (“pada tengah hari”).
    reason: alternative_reading
  - marker: b
    text: Atau, “Ini adalah gurun.” Ungkapan Yunani ini mungkin menunjuk kawasan gurun yang dilalui jalan tersebut, bukan terutama keadaan jalan yang sepi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγγελος δὲ κυρίου
  choice: Lalu seorang malaikat Tuhan
  rationale: δὲ diberi fungsi penghubung naratif yang wajar melalui “Lalu”; bentuk tunggal tanpa artikel diterjemahkan “seorang malaikat,” dan κυρίου dipertahankan sebagai “Tuhan” tanpa memperinci identitas utusan itu melampaui teks.
- source_word: ἐλάλησεν πρὸς Φίλιππον λέγων
  choice: berkata kepada Filipus
  rationale: Dalam bahasa Indonesia, penggabungan verba utama dan partisipel menjadi “berkata kepada” menyampaikan tindakan ujaran secara alami tanpa pengulangan kaku seperti “berbicara ... dengan berkata.”
- source_word: Ἀνάστηθι καὶ πορεύου
  choice: Bangunlah dan pergilah
  rationale: Dua bentuk imperatif dipertahankan sebagai dua perintah langsung; partikel -lah memberi nada perintah yang tegas namun wajar.
- source_word: κατὰ μεσημβρίαν
  choice: ke arah selatan
  rationale: Dalam konteks verba gerak, makna arah paling mungkin. Makna waktu “pada tengah hari” tetap dicantumkan dalam catatan kaki karena ambiguitas leksikalnya nyata.
- source_word: ἐπὶ τὴν ὁδὸν
  choice: menuju jalan
  rationale: “Menuju” menyatakan gerak ke suatu rute dengan alami dalam bahasa Indonesia.
- source_word: τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν
  choice: yang menurun dari Yerusalem ke Gaza
  rationale: “Menurun” mempertahankan gambaran topografis perjalanan turun dari Yerusalem.
- source_word: αὕτη ἐστὶν ἔρημος
  choice: Jalan itu sunyi
  rationale: Bentuk feminin αὕτη paling alami merujuk kembali kepada ὁδός, sehingga “jalan” dinyatakan kembali demi kejelasan. “Sunyi” menyampaikan keadaan sepi atau tak berpenghuni tanpa menutup kemungkinan bahwa ungkapan itu menunjuk kawasan gurun.
theological_decisions:
- issue: Identitas “malaikat Tuhan”
  choice: malaikat Tuhan
  alternative: malaikat yang diutus oleh Tuhan; sosok khusus “Malaikat TUHAN”
  rationale: Frasa itu diterjemahkan langsung sebagai utusan surgawi yang berkaitan dengan Tuhan, tanpa menetapkan identitas kristologis atau kategori teologis tertentu yang tidak dijelaskan oleh ayat ini.
- issue: Hubungan ujaran terakhir dengan perkataan malaikat
  choice: “Jalan itu sunyi” disajikan sebagai keterangan narator di luar kutipan
  alternative: 'Memasukkannya ke dalam perkataan malaikat: “Jalan itu sunyi.”'
  rationale: Naskah Yunani kuno tidak memiliki tanda kutip modern sehingga batas ujaran tidak mutlak. Susunan ini mengikuti pembacaan wajar bahwa kalimat terakhir merupakan keterangan narator, tanpa membangun ajaran dari batas kutipan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang sederhana dan bermartabat. “Lalu” mengalirkan hubungan naratif δὲ; “berkata kepada” menghindari pengulangan yang kaku; ambiguitas mengenai selatan/tengah hari dan sunyi/gurun dipertahankan melalui catatan kaki.
