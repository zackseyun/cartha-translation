  text: Dan ada sukacita besar di kota itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: ada
  rationale: Dalam konstruksi ini, ἐγένετο menyatakan muncul atau hadirnya suatu keadaan. Bentuk “ada” alami dalam bahasa Indonesia dan menyampaikan makna eksistensialnya tanpa kekakuan harfiah.
- source_word: δὲ
  choice: Maka
  rationale: Partikel δέ melanjutkan alur narasi dan di sini menghubungkan sukacita kota itu dengan peristiwa-peristiwa sebelumnya. “Maka” menyatakan kesinambungan serta akibat secara wajar tanpa menjadikannya hubungan sebab-akibat yang terlalu tegas.
- source_word: πολλὴ χαρά
  choice: sukacita besar
  rationale: πολλή menguatkan nomina abstrak χαρά. “Sukacita besar” merupakan ungkapan Indonesia yang alami, jelas, dan mempertahankan intensitas frasa Yunani.
- source_word: ἐν τῇ πόλει ἐκείνῃ
  choice: di kota itu
  rationale: πόλις menunjuk pada kota yang disebut dalam konteks, sedangkan ἐκείνῃ bersifat demonstratif. “Di kota itu” menerjemahkan lokasi dan acuannya secara langsung.
theological_decisions: []
