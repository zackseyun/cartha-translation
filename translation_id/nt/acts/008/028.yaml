  text: ἦν ⸀τε ὑποστρέφων καὶ καθήμενος ἐπὶ τοῦ ἅρματος αὐτοῦ καὶ ἀνεγίνωσκεν τὸν προφήτην Ἠσαΐαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/028.yaml
  text: And he was returning[a], seated in his chariot[b], and was reading Isaiah the prophet.
translation:
  language: id
  text: Ia sedang dalam perjalanan kembali, duduk di keretanya, dan sedang membaca Kitab Nabi Yesaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pada zaman itu, membaca sering dilakukan dengan suara keras. Karena itu, frasa ini juga mungkin diterjemahkan “sedang membaca dengan suara keras,” meskipun kata kerja Yunaninya sendiri tidak menyatakannya secara tegas.
    reason: cultural_note
lexical_decisions:
- source_word: ἦν τε ὑποστρέφων
  choice: Ia sedang dalam perjalanan pulang
  rationale: Konstruksi ἦν dengan partisipel kini menggambarkan tindakan yang sedang berlangsung pada masa lampau. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan tujuan khusus seperti rumah.
- source_word: καθήμενος ἐπὶ τοῦ ἅρματος αὐτοῦ
  choice: sambil duduk di keretanya
  rationale: Partisipel menyatakan keadaan yang menyertai perjalanan. 'Di keretanya' merupakan padanan Indonesia yang alami bagi posisi di dalam atau di atas kendaraan tersebut tanpa memaksakan rincian bentuk kendaraan kuno.
- source_word: ἀνεγίνωσκεν
  choice: membaca
  rationale: Bentuk imperfek menunjukkan kegiatan yang sedang berlangsung. Kata kerja Yunani tidak dengan sendirinya menegaskan bahwa bacaan itu dilafalkan, meskipun membaca dengan suara terdengar lazim pada zaman itu.
- source_word: τὸν προφήτην Ἠσαΐαν
  choice: kitab Nabi Yesaya
  rationale: Objek yang dibaca secara wajar dipahami sebagai tulisan atau kitab Nabi Yesaya. Penambahan 'kitab' membuat maksudnya jelas dan alami dalam bahasa Indonesia tanpa menyiratkan bahwa ia membaca pribadi Yesaya.
