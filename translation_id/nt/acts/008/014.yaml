id: ACT.8.14
reference: Acts 8:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ οἱ ἐν Ἱεροσολύμοις ἀπόστολοι ὅτι δέδεκται ἡ Σαμάρεια τὸν λόγον τοῦ θεοῦ, ἀπέστειλαν πρὸς ⸀αὐτοὺς Πέτρον καὶ Ἰωάννην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/014.yaml
  text: When the apostles in Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them,
translation:
  language: id
  text: Ketika para rasul di Yerusalem mendengar bahwa Samaria telah menerima firman Allah, mereka mengutus Petrus dan Yohanes kepada mereka,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Ketika ... mendengar
  rationale: Partisip aoristis menyatakan keadaan yang mendahului verba utama. 'Ketika ... mendengar' alami dalam bahasa Indonesia; δέ berfungsi sebagai penghubung naratif ringan dan tidak perlu diterjemahkan dengan kata tersendiri.
- source_word: οἱ ἐν Ἱεροσολύμοις ἀπόστολοι
  choice: rasul-rasul di Yerusalem
  rationale: Menyatakan para rasul yang berada di Yerusalem secara lugas dan wajar.
- source_word: δέδεκται
  choice: telah menerima
  rationale: Bentuk perfektum menunjukkan penerimaan yang sudah terjadi dengan hasil yang tetap relevan; 'telah menerima' mempertahankan aspek itu secara alami.
- source_word: ἡ Σαμάρεια
  choice: Samaria
  rationale: Nama tempat dipakai secara metonimis bagi penduduknya. Mempertahankan 'Samaria' dekat dengan bentuk Yunani tanpa mempersempit acuannya.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: firman Allah
  rationale: '''Firman Allah'' merupakan ungkapan Alkitabiah Indonesia yang mapan dan mempertahankan bobot λόγος, sekaligus menunjuk pada berita ilahi yang diberitakan.'
- source_word: ἀπέστειλαν
  choice: mereka mengutus
  rationale: '''Mengutus'' sesuai untuk tindakan para rasul yang mengirim Petrus dan Yohanes dengan suatu tugas, serta lebih tepat dalam register ini daripada sekadar ''mengirim''.'
- source_word: πρὸς αὐτοὺς
  choice: kepada orang-orang di sana
  rationale: Pronomina maskulin jamak mengacu pada orang-orang yang tercakup dalam sebutan kolektif 'Samaria'. Perumusan ini menjernihkan acuan yang dalam bahasa Indonesia akan kurang alami bila diterjemahkan hanya 'kepada mereka' setelah nama tempat.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: Petrus dan Yohanes
  rationale: Menggunakan bentuk nama yang mapan dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Pemakaian metonimis 'Samaria'
  choice: Samaria telah menerima firman Allah
  alternative: orang-orang Samaria telah menerima firman Allah
  rationale: Teks Yunani menyebut 'Samaria' secara kolektif. Bentuk ini dipertahankan agar tidak diam-diam mempersempitnya menjadi suatu kelompok etnis tertentu, sementara konteks tetap menunjukkan bahwa yang menerima adalah orang-orang di sana.
- issue: Penerjemahan λόγος sebagai 'firman'
  choice: firman Allah
  alternative: berita Allah
  rationale: '''Firman Allah'' mempertahankan ungkapan sumber dan resonansi teologisnya; dalam konteks ini ungkapan tersebut merujuk pada berita yang diberitakan tanpa perlu diparafrasakan dalam teks utama.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan koma akhir dipertahankan karena ayat ini berlanjut ke ayat berikutnya.
