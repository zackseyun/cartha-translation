  text: ὡς δὲ ἐπορεύοντο κατὰ τὴν ὁδόν, ἦλθον ἐπί τι ὕδωρ, καί φησιν ὁ εὐνοῦχος· Ἰδοὺ ὕδωρ, τί κωλύει με ⸀βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/036.yaml
  text: And as they were going along the road, they came to some water, and the eunuch says, “Look, water! What prevents me from being baptized?”
translation:
  language: id
  text: Ketika mereka meneruskan perjalanan di jalan itu, mereka tiba di suatu tempat yang terdapat air. Sida-sida itu berkata, “Lihat, ada air! Apa yang menghalangi aku untuk dibaptis?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἐπορεύοντο κατὰ τὴν ὁδόν
  choice: Ketika mereka melanjutkan perjalanan
  rationale: Mengungkapkan tindakan yang sedang berlangsung secara alami dalam bahasa Indonesia; κατὰ τὴν ὁδόν tercakup dalam ‘perjalanan’ tanpa pengulangan kaku ‘di sepanjang jalan’.
- source_word: ἐπί τι ὕδωρ
  choice: di suatu tempat yang berair
  rationale: τι menyatakan air yang tidak ditentukan; ungkapan ini alami dan tidak menentukan apakah yang dimaksud sungai, kolam, atau sumber air lain.
- source_word: ὁ εὐνοῦχος
  choice: sida-sida itu
  rationale: Istilah Indonesia yang mapan untuk pejabat istana yang dikebiri, mempertahankan makna historis εὐνοῦχος.
- source_word: φησιν
  choice: berkata
  rationale: Present historis Yunani dialihkan ke bentuk naratif Indonesia yang alami tanpa mengubah isi ujaran.
- source_word: Ἰδοὺ ὕδωρ
  choice: Lihat, ada air!
  rationale: Ἰδού berfungsi sebagai seruan penarik perhatian; ‘ada’ diperlukan agar kalimat Indonesia terdengar wajar.
- source_word: τί κωλύει με βαπτισθῆναι
  choice: Apa yang menghalangi aku untuk dibaptis?
  rationale: Mempertahankan pertanyaan terbuka dan bentuk pasif aoristus βαπτισθῆναι tanpa menambahkan syarat atau penjelasan.
theological_decisions:
- issue: Syarat bagi baptisan
  choice: 'Pertanyaan dibiarkan terbuka: “Apa yang menghalangi aku untuk dibaptis?”'
  alternative: Menambahkan pengakuan iman atau syarat tertentu ke dalam ayat ini
  rationale: Teks SBLGNT ayat 36 tidak memuat tambahan tersebut; terjemahan tidak boleh mengimpor bacaan tekstual atau rumusan doktrinal dari ayat lain.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. ‘Sida-sida’ dipertahankan sebagai istilah historis yang lazim dalam terjemahan Alkitab; dialog dibuat langsung dan alami.
