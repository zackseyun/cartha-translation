id: ACT.8.6
reference: Acts 8:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: προσεῖχον ⸀δὲ οἱ ὄχλοι τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου ὁμοθυμαδὸν ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/006.yaml
  text: And the crowds with one accord paid close attention to what was being said by Philip[b][a], as they heard him and saw the signs that he was doing.
translation:
  language: id
  text: Orang banyak itu dengan sehati[a] memperhatikan baik-baik[b] apa yang dikatakan Filipus, ketika mereka mendengar dan melihat tanda-tanda yang dilakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersama-sama” atau “dengan satu tekad”; kata Yunaninya menekankan tanggapan bersama yang bersatu.
    reason: lexical_alternative
  - marker: b
    text: Atau “memberi perhatian penuh kepada” atau “menyimak dengan sungguh-sungguh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: memperhatikan baik-baik
  rationale: Kata ini menyatakan bahwa orang banyak terus mengarahkan perhatian kepada perkataan Filipus. Bentuk imperfeknya mendukung gambaran perhatian yang berlangsung, dan ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: δὲ
  choice: tidak diterjemahkan secara eksplisit
  rationale: Partikel ini merupakan penghubung naratif ringan. Dalam konteks ayat ini, alur bahasa Indonesia lebih alami tanpa kata penghubung khusus, dan tidak ada pertentangan kuat yang perlu dinyatakan dengan “tetapi”.
- source_word: οἱ ὄχλοι
  choice: orang banyak itu
  rationale: Ungkapan ini menunjuk kepada kumpulan orang yang telah disebut dalam konteks. Bahasa Indonesia lazim memakai bentuk kolektif tunggal “orang banyak” meskipun bentuk Yunaninya jamak.
- source_word: τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου
  choice: apa yang dikatakan Filipus
  rationale: Terjemahan ini mempertahankan isi perkataan sebagai fokus dan menyampaikan pelaku pasif Yunani secara alami tanpa mengubahnya menjadi istilah tafsiran seperti “pesan”.
- source_word: ὁμοθυμαδὸν
  choice: dengan sehati
  rationale: Keterangan ini menekankan tanggapan bersama yang bersatu, bukan sekadar bahwa mereka berada atau bertindak di tempat yang sama.
- source_word: ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν
  choice: ketika mereka mendengar dan melihat
  rationale: Konstruksi ἐν τῷ dengan infinitif menyatakan keadaan atau waktu. αὐτούς paling wajar dipahami sebagai subjek akusatif kedua infinitif tersebut, yaitu orang banyak, bukan sebagai objek “mendengar”.
- source_word: τὰ σημεῖα
  choice: tanda-tanda
  rationale: Pilihan ini menerjemahkan istilah Yunani secara langsung dan membiarkan konteks menunjukkan sifat luar biasa dari perbuatan tersebut tanpa menambahkan kata “mukjizat”.
- source_word: ἃ ἐποίει
  choice: yang dilakukannya
  rationale: Bentuk imperfek menggambarkan tindakan Filipus yang sedang atau berulang kali berlangsung. Akhiran “-nya” secara alami merujuk kepada Filipus dalam konteks kalimat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Susunan “dengan sehati” ditempatkan dekat dengan subjek untuk menonjolkan tanggapan bersama orang banyak. Ungkapan “memperhatikan baik-baik” mudah dipahami pembaca umum dan tetap menyampaikan perhatian yang berkelanjutan.
