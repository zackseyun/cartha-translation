id: ACT.8.12
reference: Acts 8:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐπίστευσαν τῷ Φιλίππῳ εὐαγγελιζομένῳ ⸀περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ, ἐβαπτίζοντο ἄνδρες τε καὶ γυναῖκες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/012.yaml
  text: But when they believed Philip as he proclaimed the good news about the kingdom of God and the name of Jesus the Messiah[a], they were being baptized, both men and women.
translation:
  language: id
  text: Namun, ketika mereka memercayai Filipus yang memberitakan kabar baik tentang Kerajaan Allah dan nama Yesus Sang Mesias[a], mereka dibaptis, baik laki-laki maupun perempuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nama Yesus Kristus.” Kata Yunani Χριστός merupakan gelar yang berarti “Mesias.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Namun, ketika
  rationale: ὅτε memperkenalkan anak kalimat waktu, sedangkan δέ menandai peralihan dengan kontras ringan terhadap keadaan sebelumnya. Frasa ini alami dalam bahasa Indonesia tanpa memperkeras kontras.
- source_word: ἐπίστευσαν τῷ Φιλίππῳ
  choice: mereka memercayai Filipus
  rationale: πιστεύω dengan datif di sini berarti menerima Filipus sebagai pemberita yang dapat dipercaya, bukan menaruh iman keselamatan di dalam dirinya. Bentuk transitif 'memercayai' menghindari kesan bahwa Filipus adalah objek iman.
- source_word: εὐαγγελιζομένῳ
  choice: yang memberitakan kabar baik
  rationale: Partisipel kini ini menerangkan Filipus dan kegiatan yang berlangsung ketika orang-orang memercayainya. 'Memberitakan kabar baik' menyampaikan daya verbal dan makna evangelistiknya dengan bahasa yang mudah dipahami.
- source_word: περὶ
  choice: tentang
  rationale: περί dengan genitif memperkenalkan pokok pemberitaan Filipus; 'tentang' merupakan padanan Indonesia yang alami dan tepat.
- source_word: τῆς βασιλείας τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ini adalah padanan baku dan transparan bagi frasa tersebut, serta tetap memungkinkan nuansa pemerintahan maupun ranah kekuasaan Allah.
- source_word: τοῦ ὀνόματος Ἰησοῦ Χριστοῦ
  choice: nama Yesus Sang Mesias
  rationale: Ungkapan 'nama' dipertahankan karena dapat menunjuk pada pribadi, kewibawaan, dan jati diri yang dinyatakan melalui nama itu. Χριστός dipahami sebagai gelar dan diterjemahkan 'Sang Mesias' agar alami dalam bahasa Indonesia.
- source_word: ἐβαπτίζοντο
  choice: mereka dibaptis
  rationale: Imperfek pasif menggambarkan tindakan yang berlangsung atau berulang ketika orang-orang memberi tanggapan. Bahasa Indonesia tidak wajib menandai aspek ini secara gramatikal; bentuk pasif sederhana tetap alami dan konteks jamak memungkinkan pembacaan bahwa pembaptisan terjadi atas mereka satu demi satu.
- source_word: ἄνδρες τε καὶ γυναῖκες
  choice: baik laki-laki maupun perempuan
  rationale: Konstruksi τε ... καὶ menyebut kedua kelompok secara inklusif. Padanan ini alami dan mempertahankan penyebutan eksplisit keduanya.
theological_decisions:
- issue: Makna percaya dalam ἐπίστευσαν τῷ Φιλίππῳ
  choice: memercayai Filipus
  alternative: percaya kepada Filipus
  rationale: Pilihan ini menunjukkan bahwa mereka menerima kesaksian atau pemberitaan Filipus sebagai benar, tanpa menyiratkan bahwa Filipus menjadi objek iman keagamaan mereka.
- issue: Penerjemahan Χριστοῦ dalam Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: Dalam konteks pemberitaan tentang Kerajaan Allah dan nama Yesus, Χριστός tetap membawa daya gelar mesianik. 'Sang Mesias' mempertahankan daya gelar itu, sedangkan bentuk tradisional 'Kristus' dicantumkan sebagai alternatif.
- issue: Cakupan 'nama' dalam τοῦ ὀνόματος
  choice: nama dipertahankan secara harfiah
  alternative: pribadi dan kewibawaan Yesus
  rationale: ὄνομα dapat mencakup pribadi, kewibawaan, atau jati diri yang diwakilinya. Mempertahankan 'nama' menjaga keluasan makna dan tidak memutuskan satu nuansa saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur Yunani tetapi tetap alami; 'memercayai' dipilih secara sengaja untuk membedakan menerima kesaksian seseorang dari beriman kepadanya sebagai objek iman.
