  text: as you are able to ascertain[a], that it has been no more than twelve days since I went up to Jerusalem to worship,
translation:
  language: id
  text: sebagaimana Tuan dapat memastikan[a], bahwa tidak lebih dari dua belas hari telah berlalu sejak saya pergi ke Yerusalem untuk beribadah,
  philosophy: optimal-equivalence
  footnotes:
