    reason: lexical_alternative
lexical_decisions:
- source_word: δυναμένου σου ἐπιγνῶναι
  choice: sebagaimana dapat Tuan pastikan
  rationale: Ungkapan ini menyatakan kemampuan lawan bicara untuk memastikan fakta-fakta yang dikemukakan Paulus. “Pastikan” sesuai dengan konteks pembelaan hukum, sedangkan “sebagaimana” mempertahankan nuansa sirkumstansial tanpa menjadikannya sebab yang tegas.
- source_word: οὐ πλείους εἰσίν μοι ἡμέραι δώδεκα
  choice: belum lebih dari dua belas hari
  rationale: Ungkapan Yunani secara idiomatis menunjuk pada waktu yang telah berlalu. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan batas maksimum dua belas hari.
- source_word: ἀφ’ ἧς
  choice: sejak
  rationale: Menandai titik awal rentang waktu secara ringkas dan alami.
- source_word: ἀνέβην
  choice: saya pergi
  rationale: Kata Yunani secara harfiah berarti “naik”, mengikuti ungkapan konvensional tentang perjalanan ke Yerusalem. Dalam bahasa Indonesia, “pergi” menyampaikan gerak menuju kota itu secara alami tanpa menonjolkan arah vertikal yang mungkin disalahpahami.
- source_word: προσκυνήσων
  choice: untuk beribadah
  rationale: Partisipel futurum menyatakan tujuan perjalanan. “Untuk beribadah” menyampaikan tujuan tersebut tanpa menambahkan objek yang tidak disebutkan secara eksplisit.
- source_word: εἰς Ἰερουσαλήμ
  choice: ke Yerusalem
  rationale: Padanan Indonesia yang alami untuk tujuan perjalanan menuju sebuah kota.
