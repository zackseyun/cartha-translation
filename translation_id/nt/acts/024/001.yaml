  text: Μετὰ δὲ πέντε ἡμέρας κατέβη ὁ ἀρχιερεὺς Ἁνανίας μετὰ ⸂πρεσβυτέρων τινῶν⸃ καὶ ῥήτορος Τερτύλλου τινός, οἵτινες ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/001.yaml
  text: After five days[a], the high priest Ananias came down with some elders and a certain orator named Tertullus, and they brought charges against Paul before the governor.
translation:
  language: id
  text: Lima hari kemudian, Imam Besar Ananias turun bersama beberapa orang tua-tua dan seorang ahli pidato[a] bernama Tertulus. Mereka mengajukan tuduhan terhadap Paulus kepada gubernur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang kuasa hukum bernama Tertulus”; kata Yunani ini dapat berarti pembicara di depan umum atau juru bicara dalam perkara hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ πέντε ἡμέρας
  choice: Lima hari kemudian
  rationale: μετά dengan akusatif menyatakan waktu yang telah berlalu. Ungkapan ini alami dalam narasi Indonesia; daya penghubung δέ cukup tersirat oleh kesinambungan konteks.
- source_word: κατέβη
  choice: datang dari Yerusalem
  rationale: καταβαίνω berarti turun/pergi atau datang ke bawah. Dalam konteks perjalanan dari Yerusalem ke Kaisarea, frasa ini mempertahankan titik asal dan menghasilkan bahasa Indonesia yang alami, meskipun gambaran arah 'turun' dibuat tersirat.
- source_word: ὁ ἀρχιερεὺς Ἁνανίας
  choice: Imam Besar Ananias
  rationale: ἀρχιερεύς menunjuk pada jabatan imam besar Yahudi; nama Ἁνανίας ditransliterasikan menurut kebiasaan bahasa Indonesia.
- source_word: μετὰ πρεσβυτέρων τινῶν
  choice: bersama beberapa orang tua-tua
  rationale: πρεσβύτεροι di sini adalah para pemimpin tua Yahudi, sedangkan τινῶν bersifat tak tentu dan diterjemahkan 'beberapa'.
- source_word: ῥήτορος Τερτύλλου τινός
  choice: seorang ahli pidato bernama Tertulus
  rationale: ῥήτωρ dapat menunjuk pada pembicara terlatih atau juru bicara hukum. 'Ahli pidato' mempertahankan makna leksikal, sementara catatan kaki menyajikan kemungkinan hukum yang penting.
- source_word: οἵτινες ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου
  choice: Mereka menghadap gubernur dan mengajukan tuduhan terhadap Paulus
  rationale: Dalam konteks hukum, ἐμφανίζω menyatakan penyampaian resmi suatu perkara atau tuduhan. Pemecahan menjadi kalimat baru menghasilkan alur Indonesia yang jelas tanpa mengubah pelaku jamaknya.
