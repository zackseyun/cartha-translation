source:
  edition: SBLGNT
  text: διαλεγομένου δὲ αὐτοῦ περὶ δικαιοσύνης καὶ ἐγκρατείας καὶ τοῦ κρίματος τοῦ ⸀μέλλοντος ἔμφοβος γενόμενος ὁ Φῆλιξ ἀπεκρίθη· Τὸ νῦν ἔχον πορεύου, καιρὸν δὲ μεταλαβὼν μετακαλέσομαί σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/025.yaml
  text: But as he was discussing righteousness and self-control and the coming judgment, Felix became afraid and answered, “For now, go away. When I get an opportunity, I will summon you.”
translation:
  language: id
  text: Namun, ketika Paulus berbicara tentang kebenaran, penguasaan diri, dan penghakiman yang akan datang, Feliks menjadi takut dan menjawab, “Sekarang pergilah dahulu. Apabila aku mendapat kesempatan, aku akan memanggilmu lagi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαλεγομένου
  choice: berbicara
  rationale: Dalam konteks ini menunjuk pada pembahasan atau penyampaian yang bernalar; ‘berbicara tentang’ terdengar alami dan tidak mengharuskan adanya perdebatan dua arah.
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: Mempertahankan cakupan makna moral dan relasional δικαιοσύνη tanpa mempersempitnya menjadi sekadar keadilan hukum.
- source_word: ἐγκρατείας
  choice: penguasaan diri
  rationale: Padanan Indonesia yang lazim untuk kemampuan mengendalikan keinginan dan perilaku diri.
- source_word: τοῦ κρίματος τοῦ μέλλοντος
  choice: penghakiman yang akan datang
  rationale: Menyampaikan κρίμα sebagai tindakan/kenyataan penghakiman dan μέλλοντος sebagai sesuatu yang akan datang.
- source_word: ἔμφοβος γενόμενος
  choice: menjadi takut
  rationale: Mereproduksi perubahan keadaan yang dinyatakan secara langsung dalam teks Yunani.
- source_word: Τὸ νῦν ἔχον
  choice: Untuk sekarang
  rationale: Ungkapan idiomatis yang menandai penundaan pada keadaan sekarang.
- source_word: καιρὸν ... μεταλαβών
  choice: Bila ada kesempatan
  rationale: Menjaga nuansa kesempatan atau waktu yang sesuai tanpa memastikan bahwa kesempatan itu pasti akan muncul.
- source_word: μετακαλέσομαί σε
  choice: aku akan memanggilmu
  rationale: Mengungkapkan panggilan kembali untuk menghadap Feliks secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Arti δικαιοσύνη dalam rangkaian topik Paulus
  choice: kebenaran
  alternative: keadilan
  rationale: ‘Kebenaran’ mempertahankan keluasan makna moral yang mungkin mencakup hidup benar dan adil; teks tidak membatasi istilah itu pada ranah yuridis.
- issue: Sifat penghakiman yang akan datang
  choice: penghakiman yang akan datang
  alternative: hukuman yang akan datang
  rationale: ‘Penghakiman’ tidak terlebih dahulu menentukan hasil putusan sebagai hukuman dan dengan demikian menjaga ketegangan teks sumber.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama Paulus disebut untuk memperjelas subjek pronominal Yunani dalam ayat yang berdiri sendiri; tuturan Feliks memakai ‘aku–mu’ karena hubungan penguasa kepada tahanan dan bentuk tunggal dalam sumber.
