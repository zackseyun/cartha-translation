source:
  edition: SBLGNT
  text: πάντῃ τε καὶ πανταχοῦ ἀποδεχόμεθα, κράτιστε Φῆλιξ, μετὰ πάσης εὐχαριστίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/003.yaml
  text: In every way and everywhere we acknowledge this[a], most excellent Felix, with all gratitude.
translation:
  language: id
  text: Dalam segala hal dan di mana-mana kami mengakuinya[a], Yang Mulia Feliks, dengan penuh rasa syukur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kami menerimanya” atau “kami menyambutnya.” Kata kerja Yunani ini dapat bermakna menerima atau menyambut, tetapi di sini kemungkinan berarti mengakui secara terbuka manfaat-manfaat yang dikaitkan dengan Feliks.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντῃ
  choice: dalam segala hal
  rationale: Adverbia ini menyatakan keluasan dalam setiap segi atau hal, bukan terutama waktu; ungkapan ini juga berpasangan secara alami dengan πανταχοῦ.
- source_word: τε καὶ
  choice: dan
  rationale: Partikel korelatif ini menghubungkan πάντῃ dan πανταχοῦ; bentuk sederhana 'dan' paling alami dalam bahasa Indonesia.
- source_word: πανταχοῦ
  choice: di mana-mana
  rationale: Adverbia lokatif ini berarti 'di setiap tempat'; 'di mana-mana' alami dan mempertahankan cakupan universalnya.
- source_word: ἀποδεχόμεθα
  choice: kami mengakuinya
  rationale: Dalam konteks pidato resmi yang menyanjung Feliks, verba ini dapat berarti menerima atau menyambut, tetapi kemungkinan menunjuk pada pengakuan terbuka terhadap manfaat yang baru disebutkan. Enklitik '-nya' menyatakan objek yang tersirat tanpa menguraikannya secara berlebihan.
- source_word: κράτιστε
  choice: Yang Mulia
  rationale: Sapaan kehormatan superlatif bagi pejabat tinggi. 'Yang Mulia' merupakan padanan Indonesia yang alami dan bermartabat dalam konteks sapaan resmi.
- source_word: Φῆλιξ
  choice: Feliks
  rationale: Nama pribadi ditransliterasikan menurut konvensi ejaan Alkitab bahasa Indonesia.
- source_word: μετὰ πάσης εὐχαριστίας
  choice: dengan penuh rasa syukur
  rationale: Frasa ini menyatakan sikap yang menyertai pengakuan tersebut; pilihan ini alami dalam bahasa Indonesia dan mempertahankan intensitas πάσης.
theological_decisions: []
