  text: καὶ οὔτε ἐν τῷ ἱερῷ εὗρόν με πρός τινα διαλεγόμενον ἢ ⸀ἐπίστασιν ποιοῦντα ὄχλου οὔτε ἐν ταῖς συναγωγαῖς οὔτε κατὰ τὴν πόλιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/012.yaml
  text: And they found me neither in the temple arguing with anyone nor stirring up a crowd[b][a], neither in the synagogues nor throughout the city.
translation:
  language: id
  text: Mereka tidak mendapati aku, baik di kompleks Bait Allah[a] maupun di rumah-rumah ibadat ataupun di seluruh kota, sedang berdebat dengan siapa pun atau menimbulkan kerumunan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bertukar pikiran dengan siapa pun” atau “berdiskusi dengan siapa pun.” Kata Yunani ini dapat berarti bernalar, berdiskusi, atau berdebat; dalam konteks ini, nuansa yang lebih konfrontatif sesuai dengan pembelaan Paulus terhadap tuduhan bahwa ia menimbulkan keresahan umum.
    reason: lexical_alternative
  - marker: b
    text: Atau “menyebabkan orang banyak berkerumun.” Ungkapan Yunani ini menunjuk pada timbulnya kerumunan atau gangguan umum, tetapi tidak selalu berarti kerusuhan besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερῷ
  choice: kompleks Bait Allah
  rationale: Dalam Kisah Para Rasul, ἱερόν biasanya menunjuk pada seluruh kompleks atau pelataran Bait Allah, bukan hanya ruang kudus di bagian dalam.
- source_word: εὗρόν με
  choice: mereka tidak mendapati aku
  rationale: Bentuk aoris aktif ini melaporkan bahwa para penuduh tidak menyaksikan Paulus melakukan tindakan yang dituduhkan; 'mendapati' alami dalam konteks pembelaan hukum.
- source_word: πρός τινα διαλεγόμενον
  choice: sedang berdebat dengan siapa pun
  rationale: διαλέγομαι dapat berarti berbicara, bertukar pikiran, bernalar, atau berdebat. Dalam konteks penyangkalan terhadap tuduhan menimbulkan keresahan, 'berdebat' paling sesuai tanpa menutup kemungkinan nuansa yang lebih netral.
- source_word: ἐπίστασιν ποιοῦντα ὄχλου
  choice: sedang menghasut orang banyak
  rationale: Ungkapan ini menggambarkan tindakan menimbulkan kerumunan atau kegemparan. 'Menghasut orang banyak' menyampaikan tuduhan agitasi publik, sementara catatan kaki mempertahankan kemungkinan bahwa maksudnya sekadar menyebabkan orang berkerumun.
- source_word: ὄχλου
  choice: orang banyak
  rationale: Nomina tanpa artikel ini merujuk secara umum pada kerumunan; 'orang banyak' tidak menambahkan nuansa kekerasan seperti 'gerombolan'.
- source_word: συναγωγαῖς
  choice: rumah-rumah ibadat
  rationale: Padanan Indonesia yang lazim dan mudah dipahami untuk tempat pertemuan serta ibadah Yahudi; bentuk jamak dipertahankan.
- source_word: κατὰ τὴν πόλιν
  choice: di seluruh kota
  rationale: κατά dengan akusatif di sini menyatakan sebaran tempat, yakni tidak ditemukan di bagian mana pun di kota.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan jelas. Struktur 'baik ... maupun ...' menghubungkan lokasi-lokasi tempat penyangkalan itu berlaku. 'Kompleks Bait Allah' memperjelas cakupan ἱερόν, dan semua alternatif leksikal penting dipertahankan dalam catatan kaki.
