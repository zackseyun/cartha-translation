  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κληθέντος δὲ αὐτοῦ ἤρξατο κατηγορεῖν ὁ Τέρτυλλος λέγων· Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ καὶ ⸀διορθωμάτων γινομένων τῷ ἔθνει τούτῳ διὰ τῆς σῆς προνοίας
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/002.yaml
  text: 'And when he had been summoned[a], Tertullus began to accuse him, saying: “Since through you we are enjoying much peace[b], and reforms are being brought to this nation through your foresight,”'
translation:
  language: id
  text: 'Ketika ia dipanggil menghadap, Tertulus mulai mendakwanya dengan berkata: “Berkat Tuan, kami menikmati kedamaian yang besar, dan berkat kebijaksanaan Tuan[b], berbagai pembaruan[a] terlaksana bagi bangsa ini.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbagai perbaikan” atau “berbagai tindakan korektif.”
    reason: lexical_alternative
  - marker: b
    text: “Kebijaksanaan” juga dapat diterjemahkan “perencanaan” atau “pertimbangan ke depan.” Kata Yunani di sini menunjuk pada pertimbangan atau pengelolaan seorang penguasa, bukan harus berarti pemeliharaan ilahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθέντος δὲ αὐτοῦ
  choice: Setelah dia dipanggil menghadap
  rationale: Konstruksi genitif absolut ini menyatakan keadaan yang mendahului tindakan utama. “Dipanggil menghadap” sesuai dengan suasana persidangan tanpa menambahkan nama Paulus yang tidak disebutkan dalam frasa Yunani.
- source_word: ἤρξατο κατηγορεῖν
  choice: mulai mendakwa dia
  rationale: Mempertahankan aspek ingresif “mulai” dan makna hukum κατηγορέω sebagai mengajukan tuduhan terhadap seseorang.
- source_word: ὁ Τέρτυλλος
  choice: Tertulus
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ
  choice: Berkat Tuan, kami menikmati kedamaian yang besar
  rationale: Menyampaikan pengalaman akan keadaan damai serta perantaraan atau jasa Feliks. “Tuan” mempertahankan sapaan hormat yang wajar dalam retorika kepada penguasa.
- source_word: διορθωμάτων γινομένων
  choice: berbagai pembaruan terlaksana
  rationale: διόρθωμα menunjuk pada tindakan korektif, perbaikan, atau pembaruan. Bentuk ini menjaga ungkapan bahwa hal-hal tersebut terjadi atau dilaksanakan tanpa mempertegas pelaku yang tidak dinyatakan.
- source_word: τῷ ἔθνει τούτῳ
  choice: bagi bangsa ini
  rationale: ἔθνος di sini menunjuk pada bangsa Yahudi sebagai suatu rakyat dalam konteks pemerintahan Romawi; datifnya menyatakan pihak yang menerima manfaat.
- source_word: διὰ τῆς σῆς προνοίας
  choice: melalui kebijaksanaan Tuan
  rationale: πρόνοια dalam konteks ini menunjuk pada pertimbangan ke depan dan pengelolaan seorang penguasa. “Kebijaksanaan” alami dalam bahasa Indonesia dan tidak menyiratkan pemeliharaan ilahi.
theological_decisions:
- issue: Makna πρόνοια dalam pujian kepada penguasa manusia
  choice: kebijaksanaan Tuan
  alternative: pemeliharaan Tuan; perencanaan Tuan
  rationale: Konteksnya adalah sanjungan retoris kepada Feliks atas pertimbangan dan pemerintahannya, bukan pernyataan tentang providensi ilahi. Pilihan ini menghindari muatan teologis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tuturan Tertulus dibuat formal serta menyanjung, sesuai dengan pidato pembukaan di hadapan gubernur. Kedua pronomina tetap dipertahankan agar tidak menambahkan nama yang tidak muncul dalam ayat ini; konteks mengidentifikasi orang yang dipanggil dan didakwa sebagai Paulus.
