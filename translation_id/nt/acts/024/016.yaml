  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀καὶ αὐτὸς ἀσκῶ ἀπρόσκοπον συνείδησιν ⸀ἔχειν πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους διὰ παντός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/016.yaml
  text: In view of this[a], I myself also strive always to have a blameless conscience before God and men.
translation:
  language: id
  text: Karena itu, aku sendiri pun senantiasa berusaha menjaga hati nuraniku tetap tidak bercela di hadapan Allah dan manusia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Karena itu
  rationale: Ungkapan ini merujuk kembali pada harapan akan kebangkitan dalam konteks sebelumnya dan secara wajar menyatakan dasar atau kesimpulan tindakan Paulus.
- source_word: καὶ αὐτὸς
  choice: aku sendiri pun
  rationale: Kata 'pun' mempertahankan daya aditif καί, sedangkan 'sendiri' menyampaikan penekanan αὐτός.
- source_word: ἀσκῶ
  choice: berusaha
  rationale: Dalam konteks etis ini, verba tersebut menyatakan upaya yang sungguh-sungguh dan terus-menerus; 'berusaha' alami dalam bahasa Indonesia modern.
- source_word: ἀπρόσκοπον
  choice: tetap tidak bercela
  rationale: Adjektiva ini menggambarkan hati nurani yang tidak menjadi batu sandungan atau alasan untuk dicela. 'Tidak bercela' mempertahankan nuansa moral dan relasionalnya.
- source_word: συνείδησιν
  choice: hati nurani
  rationale: Padanan baku dan alami dalam bahasa Indonesia untuk kesadaran moral batin.
- source_word: ἔχειν
  choice: menjaga ... tetap
  rationale: Infinitif ini menyatakan sasaran usaha Paulus. Dalam bahasa Indonesia, 'menjaga ... tetap' secara alami mengungkapkan upaya untuk memiliki atau mempertahankan keadaan tersebut tanpa mengubah makna dasarnya.
- source_word: πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους
  choice: di hadapan Allah dan manusia
  rationale: πρός di sini menyatakan hubungan dan pertanggungjawaban. 'Di hadapan' alami serta mencakup dimensi vertikal dan horizontal; 'manusia' bersifat generik sebagaimana ἀνθρώπους dalam konteks ini.
- source_word: διὰ παντός
  choice: senantiasa
  rationale: Ungkapan ini menyatakan keberlangsungan pada setiap waktu; 'senantiasa' ringkas, jelas, dan sesuai dengan ragam bahasa Alkitab yang bermartabat.
theological_decisions:
- issue: Cakupan ἀνθρώπους yang berbentuk jamak maskulin
  choice: manusia
  alternative: orang-orang; sesama manusia
  rationale: Dalam konteks ini ἀνθρώπους digunakan secara representatif untuk manusia pada umumnya, bukan khusus laki-laki. Bahasa Indonesia 'manusia' mempertahankan cakupan generiknya tanpa perlu penjelasan tambahan.
- issue: Hubungan ἐν τούτῳ dengan konteks sebelumnya
  choice: Karena itu
  alternative: Dalam hal ini; Oleh sebab itu
  rationale: Ungkapan tersebut kemungkinan besar menunjuk pada pengakuan dan harapan akan kebangkitan pada ayat sebelumnya. 'Karena itu' menyatakan kaitan inferensial tanpa mempersempit isi rujukannya lebih lanjut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan penekanan 'aku sendiri pun', sifat berkelanjutan dari usaha Paulus, serta pertanggungjawaban kepada Allah dan manusia.
