  text: ἅμα καὶ ἐλπίζων ὅτι χρήματα δοθήσεται αὐτῷ ὑπὸ τοῦ ⸀Παύλου· διὸ καὶ πυκνότερον αὐτὸν μεταπεμπόμενος ὡμίλει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/026.yaml
  text: At the same time he was hoping that money would be given to him by Paul[a]; therefore he also sent for him more often and talked with him.
translation:
  language: id
  text: Pada saat yang sama, ia berharap bahwa Paulus akan memberinya uang[a]. Karena itu, ia juga lebih sering menyuruh orang memanggil Paulus dan berbicara dengannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih khusus dalam konteks ini, “ia mengharapkan suap dari Paulus.” Teks Yunani hanya mengatakan “uang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα καὶ
  choice: Pada saat yang sama
  rationale: Ungkapan ini menandai tindakan atau keadaan yang berlangsung bersamaan dengan narasi sebelumnya; bentuk ini alami dalam bahasa Indonesia dan mempertahankan nuansa temporalnya.
- source_word: ἐλπίζων
  choice: ia berharap
  rationale: Partisipel kini ini menggambarkan harapan Feliks yang terus berlangsung bersamaan dengan tindakannya.
- source_word: χρήματα
  choice: uang
  rationale: Kata Yunani ini secara langsung berarti 'uang'. Konteks menyiratkan suap, tetapi teks tidak memakai istilah khusus yang berarti 'suap'.
- source_word: δοθήσεται αὐτῷ ὑπὸ τοῦ Παύλου
  choice: Paulus akan memberinya
  rationale: Susunan aktif dalam bahasa Indonesia lebih alami, sambil tetap mempertahankan Paulus sebagai sumber uang dan Feliks sebagai penerimanya.
- source_word: διὸ καὶ
  choice: Karena itu
  rationale: Ungkapan ini menyatakan akibat atau kesimpulan dari harapan Feliks akan uang. Unsur καί tercermin secara wajar dalam kesinambungan tindakannya dan tidak perlu diterjemahkan secara mekanis sebagai 'juga'.
- source_word: πυκνότερον
  choice: lebih sering
  rationale: Adverbia komparatif ini menunjukkan frekuensi yang meningkat.
- source_word: μεταπεμπόμενος
  choice: menyuruh orang memanggil Paulus
  rationale: Bentuk medial ini berarti menyuruh agar seseorang dipanggil atau didatangkan; pilihan ini jelas dan alami dalam konteks Paulus yang sedang ditahan.
- source_word: ὡμίλει αὐτῷ
  choice: berbicara dengannya
  rationale: Kata kerja ini menunjuk pada percakapan atau interaksi langsung, bukan pidato resmi.
theological_decisions:
- issue: Apakah motif korup Feliks harus dibuat eksplisit sebagai 'suap' dalam teks utama
  choice: Memakai 'uang' dalam teks utama dan menjelaskan implikasi suap dalam catatan kaki
  alternative: ia berharap Paulus akan menyuapnya / ia mengharapkan suap dari Paulus
  rationale: Konteks kuat mengisyaratkan suap, tetapi χρήματα secara leksikal hanya berarti 'uang'. Pilihan ini mempertahankan ketepatan terhadap sumber sekaligus tidak menutupi implikasi naratifnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Nama Paulus diulang pada klausa kedua untuk menghindari ketidakjelasan rujukan pronomina dalam bahasa Indonesia.
