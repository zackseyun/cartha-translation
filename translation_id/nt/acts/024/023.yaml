  text: ⸀διαταξάμενος τῷ ἑκατοντάρχῃ τηρεῖσθαι ⸀αὐτὸν ἔχειν τε ἄνεσιν καὶ μηδένα κωλύειν τῶν ἰδίων αὐτοῦ ⸀ὑπηρετεῖν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/023.yaml
  text: And he ordered the centurion to keep him in custody[a], yet to let him have some freedom[b], and to prevent none of his own people from attending to his needs.
translation:
  language: id
  text: Ia memerintahkan perwira itu supaya menahan Paulus, tetapi memberinya kelonggaran[a] dan tidak menghalangi seorang pun dari orang-orangnya sendiri[b] untuk melayaninya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberinya kebebasan tertentu” atau “memberinya kelegaan.” Kata Yunani ini dapat berarti kelegaan, kemudahan, atau kebebasan dari pengekangan ketat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang-orangnya sendiri.” Ungkapan ini mungkin merujuk kepada para rekan, sahabat, atau pendukung Paulus yang diizinkan membantunya.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαταξάμενος
  choice: Ia memerintahkan
  rationale: Partisip aoris ini menyatakan tindakan tokoh yang disebut dalam konteks sebelumnya. Bentuk verba utama menghasilkan narasi Indonesia yang alami tanpa mengurangi daya perintahnya.
- source_word: τῷ ἑκατοντάρχῃ
  choice: perwira itu
  rationale: ἑκατοντάρχης adalah perwira Romawi yang secara tradisional mengepalai sekitar seratus prajurit. Dalam bahasa Indonesia, “perwira” jelas dan alami; konteks menentukan perwira yang dimaksud.
- source_word: τηρεῖσθαι αὐτόν
  choice: untuk tetap menahan Paulus
  rationale: Dalam konteks hukum dan penjagaan ini, τηρέω berarti menjaga seseorang tetap berada dalam tahanan. Nama “Paulus” dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: ἔχειν τε ἄνεσιν
  choice: tetapi memberinya sedikit kelonggaran
  rationale: ἄνεσις dapat berarti kelegaan, kemudahan, atau kebebasan dari pembatasan. “Sedikit kelonggaran” menyampaikan bahwa Paulus tetap ditahan, tetapi tidak dikenai pengekangan yang paling ketat.
- source_word: τε ... καὶ
  choice: tetapi ... dan
  rationale: Pasangan ini mengoordinasikan dua ketentuan. “Tetapi” secara alami menandai kontras antara penahanan dan kelonggaran, sedangkan “dan” menghubungkan izin berikutnya.
- source_word: μηδένα κωλύειν
  choice: tidak menghalangi seorang pun
  rationale: Ungkapan ini mempertahankan cakupan negatif universal dari μηδένα dan makna κωλύω, yaitu menghalangi atau mencegah.
- source_word: τῶν ἰδίων αὐτοῦ
  choice: dari kalangan orang-orang dekatnya
  rationale: Secara harfiah frasa ini menunjuk kepada “orang-orangnya sendiri” tanpa menetapkan apakah mereka keluarga, sahabat, atau rekan. “Orang-orang dekatnya” tetap luas dan alami dalam bahasa Indonesia.
- source_word: ὑπηρετεῖν αὐτῷ
  choice: untuk mengurus kebutuhannya
  rationale: Dalam konteks tahanan, verba ini menunjuk pada pemberian pelayanan atau bantuan praktis. Terjemahan ini menghindari kesan jabatan keagamaan yang dapat timbul dari kata “melayani” saja.
