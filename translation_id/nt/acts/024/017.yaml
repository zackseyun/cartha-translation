id: ACT.24.17
reference: Acts 24:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: δι’ ἐτῶν δὲ πλειόνων ⸂ἐλεημοσύνας ποιήσων εἰς τὸ ἔθνος μου παρεγενόμην⸃ καὶ προσφοράς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/017.yaml
  text: After several years I came to bring alms to my nation[a], and offerings.
translation:
  language: id
  text: Setelah beberapa tahun, aku datang untuk membawa sedekah[a] bagi bangsaku dan persembahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bantuan bagi orang-orang miskin.” Kata Yunani ini menunjuk pada pemberian belas kasih kepada orang yang membutuhkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἐτῶν δὲ πλειόνων
  choice: Setelah beberapa tahun
  rationale: Ungkapan διά dengan genitif menunjukkan selang waktu yang telah berlalu. πλειόνων dalam konteks ini secara idiomatis berarti ‘beberapa’ atau ‘bertahun-tahun’. δέ hanya bersifat penghubung ringan sehingga tidak perlu diterjemahkan sebagai pertentangan yang tegas.
- source_word: ἐλεημοσύνας
  choice: sedekah
  rationale: Kata ini menunjuk pada pemberian belas kasih atau bantuan kepada orang yang membutuhkan. ‘Sedekah’ ringkas, dikenal luas dalam bahasa Indonesia modern, dan mempertahankan bentuk nomina konkret dari teks Yunani.
- source_word: ποιήσων
  choice: untuk membawa
  rationale: Secara harfiah berarti ‘untuk melakukan/membuat’, tetapi bersama ἐλεημοσύνας membentuk ungkapan idiomatis tentang pemberian sedekah. Dalam konteks perjalanan Paulus ke Yerusalem, ‘membawa’ menyampaikan maksudnya secara alami.
- source_word: εἰς τὸ ἔθνος μου
  choice: bagi bangsaku
  rationale: ἔθνος di sini menunjuk pada bangsa Yahudi sebagai bangsa Paulus sendiri. ‘Bangsaku’ mempertahankan unsur kebangsaan tanpa mempersempitnya menjadi kelompok tertentu.
- source_word: παρεγενόμην
  choice: aku datang
  rationale: Kata kerja ini menyatakan kedatangan atau hadirnya seseorang. ‘Aku datang’ alami dalam laporan pribadi Paulus.
- source_word: προσφοράς
  choice: persembahan
  rationale: Kata ini dapat menunjuk pada persembahan, termasuk dalam konteks ibadah. Teks tidak menjelaskan jenisnya, sehingga ‘persembahan’ mempertahankan keluasan makna tersebut.
theological_decisions:
- issue: Sifat pemberian yang dibawa Paulus ke Yerusalem
  choice: sedekah
  alternative: bantuan bagi orang-orang miskin
  rationale: Pilihan ini mempertahankan istilah pemberian belas kasih tanpa menentukan lebih jauh penerima atau tata penyalurannya daripada yang dinyatakan teks.
- issue: Hubungan antara sedekah dan persembahan
  choice: Mempertahankannya sebagai dua unsur yang disejajarkan
  alternative: Menggabungkannya sebagai satu jenis pemberian
  rationale: Kata καί menghubungkan ἐλεημοσύνας dan προσφοράς. Terjemahan tidak memutuskan apakah keduanya sepenuhnya terpisah atau saling berkaitan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Kata ganti ‘aku’ mengikuti tuturan langsung Paulus. ‘Sedekah’ dipakai dalam arti umum sebagai bantuan amal, bukan sebagai istilah khas denominasi atau agama tertentu.
