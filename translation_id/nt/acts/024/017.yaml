  source_fidelity: 'Terjemahan setia pada susunan dan makna utama Yunani: δι’ ἐτῶν πλειόνων diterjemahkan "Setelah beberapa tahun"; ἐλεημοσύνας sebagai "sedekah"; tujuan bagi bangsa Paulus dipertahankan dalam "bagi bangsaku"; dan προσφοράς tetap luas sebagai "persembahan." Bentuk "untuk membawa" menyampaikan fungsi idiomatis ποιήσων dalam konteks ini tanpa menerjemahkannya secara kaku.'
  naturalness: Bahasa Indonesia baku, ringkas, dan wajar untuk tuturan pembelaan Paulus. "Aku datang" cocok dalam ujaran langsung, sedangkan "sedekah" dan "persembahan" mudah dipahami dalam register Alkitab modern.
  terminology: '"Sedekah" secara leksikal memadai untuk ἐλεημοσύνας dan tidak secara tidak sah mempersempit penerima atau cara penyalurannya. Catatan kaki dengan tepat menyediakan "bantuan bagi orang-orang miskin" sebagai penjelasan/alternatif yang lebih eksplisit. "Persembahan" mempertahankan ketidakspesifikan προσφοράς, yang dapat bernuansa kultis tetapi tidak dirinci oleh teks.'
