  to: 'atau tentang satu pernyataan ini yang saya teriakkan ketika berdiri di tengah-tengah mereka: ‘Mengenai kebangkitan orang mati, saya diadili hari ini di hadapan kalian.’[a][b]'
  rationale: Revisi mengganti “Karena” dengan “Mengenai” agar relasi yang ditandai περὶ tetap berupa pokok perkara, bukan kausalitas yang diperkuat. “Saya teriakkan” lebih alami untuk ἐκέκραξα sambil tetap menyatakan seruan lantang. Susunan lain, termasuk “kebangkitan orang mati,” “diadili,” serta kedua catatan kaki, dipertahankan karena setia pada teks sumber dan wajar dalam bahasa Indonesia baku modern.
