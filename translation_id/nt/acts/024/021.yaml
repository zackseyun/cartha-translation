  text: ἢ περὶ μιᾶς ταύτης φωνῆς ἧς ἐκέκραξα ⸂ἐν αὐτοῖς ἑστὼς⸃ ὅτι Περὶ ἀναστάσεως νεκρῶν ἐγὼ κρίνομαι σήμερον ⸀ἐφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/021.yaml
  text: 'or about this one statement that I shouted while standing among them: ‘It is concerning the resurrection of the dead that I am being judged before you today.’[a][b]'
translation:
  language: id
  text: 'atau tentang satu pernyataan ini yang saya teriakkan ketika berdiri di tengah-tengah mereka: ‘Mengenai kebangkitan orang mati, saya diadili hari ini di hadapan kalian.’[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seruan” atau “suara” sebagai ganti “pernyataan”; istilah Yunani dapat menunjuk pada ujaran itu sendiri atau pada suara maupun seruan yang menyampaikannya.
    reason: lexical_alternative
  - marker: b
    text: Atau “kebangkitan dari antara orang mati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς
  choice: pernyataan
  rationale: Dalam konstruksi dengan περὶ dan klausa isi sesudahnya, kata ini menunjuk pada ujaran tertentu; ‘pernyataan’ alami dalam konteks pembelaan hukum, sementara nuansa suara atau seruan dicatat dalam catatan kaki.
- source_word: ἐκέκραξα
  choice: saya serukan
  rationale: Kata kerja ini menyatakan ujaran lantang di muka umum. ‘Saya serukan’ mempertahankan daya ungkapnya dengan ragam yang wajar dan bermartabat.
- source_word: ἐν αὐτοῖς ἑστὼς
  choice: ketika berdiri di tengah-tengah mereka
  rationale: Terjemahan ini mempertahankan keadaan partisipial dan makna lokasi di antara kelompok tersebut.
- source_word: ἀναστάσεως νεκρῶν
  choice: kebangkitan orang mati
  rationale: Genitif ini paling langsung menyatakan kebangkitan orang-orang mati secara umum, tanpa mempersempitnya hanya kepada kebangkitan Yesus.
- source_word: κρίνομαι
  choice: saya diadili
  rationale: Bentuk pasif kini menunjuk pada proses pengadilan yang sedang dialami Paulus; ‘diadili’ lebih alami dalam bahasa Indonesia daripada terjemahan harfiah ‘dihakimi’ dalam konteks hukum ini.
- source_word: ἐφ’ ὑμῶν
  choice: di hadapan kalian
  rationale: Dalam konteks yudisial, frasa ini menyatakan tampil di hadapan suatu otoritas atau sidang dan tidak harus berarti bahwa para pendengar adalah satu-satunya pelaku penghakiman.
- source_word: ἢ
  choice: atau
  rationale: Kata ini menghubungkan kalimat dengan pembelaan sebelumnya dan mempertahankan bentuk hubungan Yunani tanpa menjadikannya ‘kecuali’ secara eksplisit.
- source_word: μιᾶς ταύτης
  choice: satu ... ini
  rationale: Susunan ini menekankan bahwa hanya satu ujaran tertentu yang mungkin dipersoalkan.
- source_word: σήμερον
  choice: hari ini
  rationale: Padanan temporal yang langsung dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Cakupan pokok kebangkitan yang diperselisihkan
  choice: kebangkitan orang mati secara umum
  alternative: kebangkitan Yesus secara khusus atau kebangkitan dari antara orang mati
  rationale: Frasa Yunani περὶ ἀναστάσεως νεκρῶν bersifat umum. Teks utama mempertahankan keluasan itu dan tidak memasukkan pembatasan kristologis yang tidak dinyatakan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam pembelaan hukum yang jelas dan bermartabat. ‘Kalian’ dipakai untuk bentuk jamak ὑμῶν dan membedakannya dari sapaan tunggal, tanpa menambah gelar yang tidak terdapat dalam teks sumber.
