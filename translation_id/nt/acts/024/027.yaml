  source_fidelity: 'Terjemahan menyampaikan dengan tepat urutan dan makna pokok teks Yunani: berakhirnya masa dua tahun, pergantian Feliks oleh Perkius Festus, motif Feliks terkait orang-orang Yahudi, serta Paulus yang dibiarkan dalam keadaan tetap terbelenggu. "Setelah genap dua tahun" wajar untuk genitif absolut Διετίας ... πληρωθείσης, dan "tetap terbelenggu" menyampaikan keadaan berkelanjutan dari δεδεμένον tanpa menambahkan rincian tentang jenis belenggu.'
