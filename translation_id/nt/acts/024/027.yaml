id: ACT.24.27
reference: Acts 24:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διετίας δὲ πληρωθείσης ἔλαβεν διάδοχον ὁ Φῆλιξ Πόρκιον Φῆστον· θέλων τε ⸀χάριτα καταθέσθαι τοῖς Ἰουδαίοις ὁ Φῆλιξ κατέλιπε τὸν Παῦλον δεδεμένον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/027.yaml
  text: But when two years had been completed[a], Felix was succeeded by Porcius Festus; and because Felix wanted to lay up favor with the Jews, he left Paul bound.
translation:
  language: id
  text: Namun, setelah genap dua tahun, Feliks digantikan oleh Perkius Festus. Karena ingin mengambil hati orang-orang Yahudi[a], Feliks membiarkan Paulus tetap terbelenggu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani ini juga dapat berarti "berbuat baik kepada orang-orang Yahudi" atau "mendapatkan dukungan orang-orang Yahudi."
    reason: lexical_alternative
lexical_decisions:
- source_word: Διετίας δὲ πληρωθείσης
  choice: Namun, setelah genap dua tahun
  rationale: Konstruksi genitif absolut menyatakan waktu. Ungkapan "setelah genap dua tahun" alami dalam bahasa Indonesia dan tetap mencerminkan bahwa masa dua tahun itu telah terpenuhi.
- source_word: ἔλαβεν διάδοχον
  choice: digantikan oleh
  rationale: Secara harfiah berarti "mendapat seorang pengganti", tetapi bentuk pasif ini paling wajar untuk menyatakan pergantian jabatan dalam bahasa Indonesia.
- source_word: Πόρκιον Φῆστον
  choice: Perkius Festus
  rationale: Nama ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: θέλων τε χάριτα καταθέσθαι τοῖς Ἰουδαίοις
  choice: Karena ingin mengambil hati orang-orang Yahudi
  rationale: Partisip θέλων menyatakan motif. Idiom "mengambil hati" menyampaikan usaha memperoleh perkenanan atau niat menyenangkan pihak Yahudi dengan alami, sambil mempertahankan ambiguitas apakah Feliks memberi mereka suatu kebaikan atau mencari dukungan mereka.
- source_word: κατέλιπε
  choice: membiarkan
  rationale: Kata ini menyatakan bahwa ketika meninggalkan jabatan, Feliks membiarkan keadaan Paulus tidak berubah.
- source_word: τὸν Παῦλον δεδεμένον
  choice: Paulus tetap terbelenggu
  rationale: Partisip perfek pasif menekankan keadaan yang terus berlangsung. "Tetap terbelenggu" mempertahankan gambaran keterikatan tanpa mempersempitnya menjadi jenis belenggu tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. "Mengambil hati" dipilih sebagai idiom umum yang alami; catatan kaki mempertahankan dua kemungkinan nuansa ungkapan Yunani.
