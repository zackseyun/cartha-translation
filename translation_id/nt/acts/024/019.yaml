  text: τινὲς δὲ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι, οὓς ⸀ἔδει ἐπὶ σοῦ παρεῖναι καὶ κατηγορεῖν εἴ τι ἔχοιεν πρὸς ⸀ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/019.yaml
  text: But there are some Jews from Asia who ought to have been present before you and to accuse me[b][a], if they had anything against me.
translation:
  language: id
  text: Namun, ada beberapa orang Yahudi dari Asia[a] yang seharusnya hadir di hadapanmu dan menuduh aku[b], jika mereka mempunyai sesuatu untuk dituduhkan kepadaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Asia” di sini adalah provinsi Romawi di Asia Kecil, bukan benua Asia pada masa kini.
    reason: cultural_note
  - marker: b
    text: Atau “mengajukan dakwaan terhadap aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ
  choice: Namun, ada beberapa
  rationale: δὲ menyatakan kontras dengan uraian sebelumnya, sedangkan τινὲς menunjuk pada sejumlah orang yang tidak disebutkan secara khusus.
- source_word: ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: orang Yahudi dari Asia
  rationale: Frasa ini menunjuk kepada orang-orang Yahudi yang berasal dari provinsi Romawi Asia; nama geografis dipertahankan dan dijelaskan dalam catatan kaki.
- source_word: οὓς ἔδει
  choice: yang seharusnya
  rationale: Bentuk imperfek ἔδει menyatakan kewajiban yang semestinya telah dipenuhi, tetapi ternyata tidak dipenuhi.
- source_word: ἐπὶ σοῦ παρεῖναι
  choice: hadir di hadapanmu
  rationale: Dalam konteks pengadilan, ungkapan ini berarti hadir di hadapan pejabat yang mengadili.
- source_word: κατηγορεῖν
  choice: menuduh aku
  rationale: Kata ini merupakan istilah forensik untuk mengajukan tuduhan; terjemahan langsung ini alami, sementara nuansa dakwaan hukum dicatat sebagai alternatif.
- source_word: εἴ τι ἔχοιεν πρὸς ἐμέ
  choice: jika mereka mempunyai sesuatu terhadap aku
  rationale: Konstruksi optatif mempertahankan sifat hipotesis dan kemungkinan pada masa lampau tanpa mempersempit τι menjadi 'dakwaan'.
