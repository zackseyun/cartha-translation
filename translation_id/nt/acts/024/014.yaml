  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁμολογῶ δὲ τοῦτό σοι ὅτι κατὰ τὴν ὁδὸν ἣν λέγουσιν αἵρεσιν οὕτως λατρεύω τῷ πατρῴῳ θεῷ, πιστεύων πᾶσι τοῖς κατὰ τὸν νόμον καὶ ⸂τοῖς ἐν⸃ τοῖς προφήταις γεγραμμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/014.yaml
  text: But I confess this to you[a], that according to the Way, which they call a sect, so I worship the God of our fathers, believing everything written in the Law and in the Prophets[b],
translation:
  language: id
  text: 'Namun, aku mengakui hal ini kepadamu: menurut Jalan yang mereka sebut sekte[a], demikianlah aku beribadah kepada Allah nenek moyang kami[b], sambil memercayai segala sesuatu yang tertulis dalam Hukum Taurat dan Para Nabi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “golongan.” Kata Yunani yang digunakan dapat berarti kelompok atau sekte; di sini kata itu tidak harus berarti “bidat” dalam pengertian doktrinal yang muncul kemudian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Allah leluhur”; maksudnya ialah Allah yang disembah oleh nenek moyang Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογῶ
  choice: aku mengakui
  rationale: Dalam konteks pembelaan Paulus di hadapan Feliks, kata ini menyatakan pengakuan terbuka tanpa harus menyiratkan pengakuan bersalah.
- source_word: κατὰ τὴν ὁδόν
  choice: menurut Jalan
  rationale: ὁδός merupakan sebutan bagi gerakan para pengikut Yesus dalam Kisah Para Rasul; huruf kapital mempertahankannya sebagai sebutan historis, sedangkan κατά menyatakan kesesuaian atau jalan yang diikuti.
- source_word: αἵρεσιν
  choice: sekte
  rationale: Dalam konteks ini kata tersebut menunjuk kepada kelompok atau golongan, bukan kepada ‘bidat’ dalam pengertian doktrinal teknis yang berkembang kemudian.
- source_word: οὕτως λατρεύω
  choice: aku beribadah
  rationale: λατρεύω menyatakan pelayanan religius atau ibadah kepada Allah; kaitan οὕτως dengan frasa sebelumnya disampaikan secara alami melalui susunan ‘menurut Jalan ... aku beribadah’.
- source_word: τῷ πατρῴῳ θεῷ
  choice: Allah nenek moyang kami
  rationale: Ungkapan ini menegaskan Allah yang diwarisi dan disembah dalam tradisi leluhur Israel. Bentuk komunal ‘kami’ menyampaikan klaim Paulus tentang kesinambungan dengan iman Israel.
- source_word: πιστεύων
  choice: dan memercayai
  rationale: Partisipel ini menjelaskan sikap yang menyertai ibadah Paulus. Penghubung ‘dan’ menghasilkan bahasa Indonesia yang alami tanpa memutus hubungan maknanya.
- source_word: πᾶσι τοῖς ... γεγραμμένοις
  choice: segala sesuatu yang tertulis
  rationale: Terjemahan ini mempertahankan cakupan menyeluruh serta keadaan teks yang telah tertulis.
- source_word: κατὰ τὸν νόμον καὶ τοῖς ἐν τοῖς προφήταις
  choice: dalam Hukum Taurat dan Kitab Para Nabi
  rationale: Ungkapan ini menunjuk kepada dua kelompok Kitab Suci Yahudi. ‘Kitab Para Nabi’ memperjelas bahwa yang dimaksud ialah kumpulan tulisan kenabian.
theological_decisions:
- issue: Hubungan Jalan dengan iman Israel
  choice: Paulus beribadah menurut Jalan kepada Allah nenek moyang Israel dan tetap memercayai Hukum Taurat serta Kitab Para Nabi.
  alternative: Jalan dipahami sebagai agama terpisah yang berlawanan dengan Yudaisme.
  rationale: Teks secara sengaja mempertahankan kesinambungan antara Jalan, Allah leluhur Israel, dan Kitab Suci Israel; terjemahan tidak memasukkan pemisahan agama yang muncul kemudian.
- issue: Makna αἵρεσις
  choice: sekte
  alternative: bidat
  rationale: Konteksnya adalah label kelompok yang diberikan para penentang. Terjemahan ‘bidat’ akan memasukkan penilaian doktrinal teknis yang tidak diwajibkan oleh kata Yunani di sini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti ‘aku/kamu’ mengikuti tuturan langsung Paulus kepada Feliks. Susunan kalimat dibuat alami dengan titik dua untuk memperkenalkan isi pengakuan, sementara istilah ‘Jalan’, ‘Hukum Taurat’, dan ‘Kitab Para Nabi’ dipertahankan sebagai sebutan historis dan korpus Kitab Suci.
