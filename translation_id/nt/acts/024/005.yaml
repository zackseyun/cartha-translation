id: ACT.24.5
reference: Acts 24:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εὑρόντες γὰρ τὸν ἄνδρα τοῦτον λοιμὸν καὶ κινοῦντα ⸀στάσεις πᾶσι τοῖς Ἰουδαίοις τοῖς κατὰ τὴν οἰκουμένην πρωτοστάτην τε τῆς τῶν Ναζωραίων αἱρέσεως,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/005.yaml
  text: For we have found this man to be a plague, stirring up riots among all the Jews throughout the inhabited world, and also a ringleader of the sect of the Nazarenes,
translation:
  language: id
  text: Sebab kami telah mendapati bahwa orang ini adalah pembawa bencana, yang mengobarkan kerusuhan di antara semua orang Yahudi di seluruh dunia, dan tokoh utama golongan orang Nazaret.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιμόν
  choice: pengacau yang berbahaya
  rationale: Secara harfiah berarti ‘wabah’ atau ‘sampar’, tetapi di sini dipakai sebagai sebutan menghina bagi orang yang dianggap sangat merusak dan membahayakan masyarakat.
- source_word: κινοῦντα στάσεις
  choice: menghasut ... untuk memberontak
  rationale: Ungkapan ini menuduh Paulus menggerakkan pergolakan, huru-hara, atau pemberontakan; terjemahan ini mempertahankan beratnya dakwaan tanpa menyatakan bahwa pemberontakan itu benar-benar terjadi.
- source_word: οἰκουμένην
  choice: dunia
  rationale: Dalam konteks Romawi, kata ini menunjuk dunia yang dihuni atau dunia yang dikenal; ‘di seluruh dunia’ merupakan ungkapan Indonesia yang alami.
- source_word: πρωτοστάτην
  choice: pemimpin utama
  rationale: Menunjuk orang yang berdiri paling depan, pemuka, atau penggerak utama.
- source_word: αἱρέσεως
  choice: golongan
  rationale: Dalam konteks ini berarti kelompok atau aliran; ‘golongan’ menghindari konotasi teologis modern yang terlalu dini dari kata ‘sekte’.
- source_word: Ναζωραίων
  choice: orang-orang Nazaret
  rationale: Mempertahankan nama yang digunakan pihak penuduh bagi para pengikut Yesus dari Nazaret.
theological_decisions:
- issue: Status tuduhan terhadap Paulus
  choice: 'Diformulasikan sebagai isi kesaksian pihak penuduh: ‘kami mendapati’ dan ‘Ia menghasut’.'
  alternative: Menghaluskan tuduhan menjadi ‘menimbulkan keresahan’.
  rationale: στάσεις adalah tuduhan serius tentang pergolakan atau pemberontakan; narasi tidak mengharuskan penerjemah mengesahkan tuduhan tersebut sebagai fakta.
- issue: Makna αἵρεσις bagi komunitas Kristen awal
  choice: golongan
  alternative: sekte
  rationale: Kata Yunani dapat berarti golongan, aliran, atau kelompok tanpa selalu memuat penilaian doktrinal modern; konteks permusuhan tetap tampak dari keseluruhan dakwaan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Metafora λοιμός diungkapkan secara idiomatis agar daya tuduhnya terbaca, sedangkan struktur kalimat dipecah demi kelancaran tanpa mengubah hubungan antarunsur dakwaan.
