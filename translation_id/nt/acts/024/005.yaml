revisions:
- from: Sebab, kami mendapati bahwa orang ini adalah pengacau yang berbahaya. Ia menghasut semua orang Yahudi di seluruh dunia untuk memberontak dan juga menjadi pemimpin utama golongan orang-orang Nazaret.
  to: Sebab kami telah mendapati bahwa orang ini adalah pembawa bencana, yang mengobarkan kerusuhan di antara semua orang Yahudi di seluruh dunia, dan tokoh utama golongan orang Nazaret.
  rationale: 'Revisi memulihkan hubungan sintaksis tiga tuduhan yang sejajar: orang ini disebut pembawa bencana, pengobar kerusuhan, dan tokoh utama golongan orang Nazaret. "Di antara" menghindari pergeseran makna yang menjadikan semua orang Yahudi sasaran hasutan untuk melakukan pemberontakan. Istilah "golongan" dipertahankan untuk αἵρεσις agar tidak memuat penghakiman teologis modern.'
