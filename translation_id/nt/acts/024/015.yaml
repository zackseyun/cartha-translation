  yaml_path: translation/nt/acts/024/015.yaml
  text: having hope in God—which these men themselves also accept—that there is going to be a resurrection of both the righteous and the unrighteous[a].
translation:
  language: id
  text: Aku menaruh harapan kepada Allah—harapan yang juga mereka sendiri nantikan[a]—bahwa akan ada kebangkitan orang-orang benar maupun orang-orang tidak benar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang juga mereka sendiri terima” atau “akui.” Kata ini dapat berarti menantikan dengan penuh harap atau menerima/mengakui; dalam konteks ini Paulus menekankan pengharapan yang juga dianut oleh mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδα ἔχων εἰς τὸν θεόν
  choice: Aku menaruh harapan kepada Allah
  rationale: Bentuk partisipial Yunani bergantung pada konteks ucapan Paulus; bahasa Indonesia yang alami mengungkapkannya sebagai klausa orang pertama. ‘Menaruh harapan kepada Allah’ mempertahankan Allah sebagai arah dan tumpuan harapan.
- source_word: ἣν καὶ αὐτοὶ οὗτοι προσδέχονται
  choice: harapan yang juga mereka sendiri nantikan
  rationale: Kata ganti relatif merujuk pada ‘harapan’. ‘Mereka sendiri’ mempertahankan penekanan αὐτοὶ οὗτοι dalam konteks Paulus menunjuk orang-orang yang hadir, sedangkan ‘nantikan’ menyampaikan makna pengharapan dari προσδέχονται. Kemungkinan arti ‘akui/terima’ dicatat dalam catatan kaki.
- source_word: ἀνάστασιν
  choice: kebangkitan
  rationale: Istilah baku dan jelas untuk bangkitnya orang mati dalam konteks ini.
- source_word: μέλλειν ἔσεσθαι
  choice: akan ada
  rationale: Menyampaikan gagasan masa depan dari konstruksi μέλλω dan ἔσεσθαι tanpa memaksakan arti bahwa peristiwa itu pasti segera terjadi.
- source_word: δικαίων τε καὶ ἀδίκων
  choice: baik orang benar maupun orang tidak benar
  rationale: Konstruksi ‘baik ... maupun ...’ mencerminkan τε καὶ dan mempertahankan kontras moral antara kedua kelompok.
theological_decisions:
- issue: Cakupan kebangkitan dalam pernyataan Paulus
  choice: kebangkitan, baik orang benar maupun orang tidak benar
  alternative: kebangkitan umum tanpa menonjolkan pembedaan moral
  rationale: Teks Yunani secara eksplisit mencakup dua kelompok. Terjemahan mempertahankan cakupan itu tanpa menentukan waktu, urutan, atau sistem doktrinal mengenai kebangkitan dan penghakiman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar. Tanda pisah mempertahankan klausa sisipan yang menjelaskan bahwa pihak lawan Paulus memiliki pengharapan yang sama.
