  yaml_path: translation/nt/acts/024/018.yaml
  text: In these things they found me purified in the temple[a], not with a crowd nor with an uproar[b],
translation:
  language: id
  text: Dalam hal-hal itulah[a] mereka mendapati aku telah menjalani penyucian ritual[b] di Bait Allah, tanpa kerumunan dan tanpa keributan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ketika melakukan hal-hal itu.” Ungkapan Yunani ἐν αἷς secara lebih harfiah dapat diterjemahkan “di dalam hal-hal itu” atau “di dalamnya.”
    reason: lexical_alternative
  - marker: b
    text: Penyucian ini adalah penyucian ritual atau upacara keagamaan.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν αἷς
  choice: Dalam keadaan itu
  rationale: Frasa relatif jamak ini merujuk kembali pada rangkaian kegiatan yang baru disebutkan. Terjemahan ini alami dalam bahasa Indonesia dan tetap mempertahankan rujukan anaforisnya; bentuk yang lebih harfiah dicatat dalam catatan kaki.
- source_word: εὗρόν με
  choice: mereka mendapati aku
  rationale: Dalam konteks ini εὑρίσκω berarti menjumpai atau menemukan seseorang dalam suatu keadaan. 'Mendapati aku' secara alami mengantar pada pelengkap keadaan berikutnya.
- source_word: ἡγνισμένον
  choice: sudah menyucikan diri
  rationale: Partisip perfek pasif menunjukkan bahwa Paulus didapati dalam keadaan telah menjalani penyucian ritual. Bahasa Indonesia lazim mengungkap tindakan ritual ini secara refleksif, tanpa menghilangkan hasil keadaan yang tersirat dalam bentuk perfek.
- source_word: ἐν τῷ ἱερῷ
  choice: di Bait Allah
  rationale: ἱερόν menunjuk pada kompleks Bait Allah. 'Di Bait Allah' merupakan padanan baku, alami, dan tidak membatasi makna pada ruang kudus bagian dalam.
- source_word: οὐ μετὰ ὄχλου
  choice: tanpa kerumunan
  rationale: Ungkapan ini menyangkal bahwa Paulus disertai sekumpulan orang. 'Kerumunan' netral dan tidak melebihkan maknanya menjadi gerombolan rusuh.
- source_word: οὐδὲ μετὰ θορύβου
  choice: dan tanpa keributan
  rationale: θόρυβος dapat berarti kegaduhan, kekacauan, atau keributan. 'Keributan' sesuai dengan konteks pembelaan hukum tentang gangguan ketertiban umum.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan kalimat mempertahankan bentuk pembelaan Paulus serta koma akhir yang menunjukkan bahwa kalimat berlanjut ke ayat berikutnya. Istilah 'Bait Allah' dipakai sebagai sebutan baku untuk kompleks bait di Yerusalem.
