  yaml_path: translation/nt/acts/024/020.yaml
  text: Or let these men themselves say what wrongdoing they found when I stood before the council,[a]
translation:
  language: id
  text: Atau, biarlah orang-orang ini sendiri mengatakan pelanggaran apa yang mereka temukan ketika aku berdiri di hadapan Mahkamah Agama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di hadapan Sanhedrin.” Kata Yunani συνέδριον merujuk pada dewan Yahudi.
