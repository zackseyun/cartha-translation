lexical_decisions:
- source_word: ἢ
  choice: Atau
  rationale: Memperkenalkan tantangan alternatif dalam pembelaan Paulus dan mempertahankan fungsi penghubung Yunani secara alami.
- source_word: αὐτοὶ οὗτοι
  choice: orang-orang ini sendiri
  rationale: Mempertahankan baik rujukan demonstratif maupun penekanan pada orang-orang yang hadir itu.
- source_word: εἰπάτωσαν
  choice: biarlah ... mengatakan
  rationale: Mencerminkan imperatif orang ketiga dalam retorika hukum dengan ungkapan Indonesia yang langsung dan wajar.
- source_word: τί εὗρον
  choice: pelanggaran apa yang mereka temukan
  rationale: Menanyakan secara langsung pelanggaran tertentu yang didapati; susunan ini alami dalam bahasa Indonesia.
- source_word: ἀδίκημα
  choice: pelanggaran
  rationale: Mencakup tindakan salah atau pelanggaran hukum tanpa mempersempit makna menjadi kejahatan pidana tertentu.
- source_word: στάντος μου
  choice: ketika aku berdiri
  rationale: Menyampaikan fungsi temporal partisip aoris dan kemunculan Paulus dalam sidang.
- source_word: ἐπὶ τοῦ συνεδρίου
  choice: di hadapan Mahkamah Agama
  rationale: Dalam konteks ini συνέδριον menunjuk kepada dewan pengadilan Yahudi; istilah Indonesia ini jelas dan lazim, sementara alternatif transliterasi dicatat dalam catatan kaki.
