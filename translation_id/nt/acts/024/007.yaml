  text: But[a] Lysias the commander came and took him out of our hands with great force,
translation:
  language: id
  text: Namun, Lisias, komandan pasukan itu, datang dan dengan kekuatan yang besar membawa dia pergi dari tangan kami,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini—bersama bagian akhir ayat 6 dan bagian awal ayat 8—tidak terdapat dalam naskah-naskah Yunani paling awal, termasuk Papirus 74 dari abad ke-3 serta Kodeks Sinaitikus dan Vatikanus dari abad ke-4, maupun dalam terjemahan-terjemahan Koptik awal. Teks ini dipertahankan dalam tradisi mayoritas Bizantin, tradisi Latin, dan naskah-naskah Yunani yang lebih kemudian. Bagian ini tampaknya merupakan perluasan redaksional awal yang menceritakan campur tangan komandan Romawi sebelum Feliks.
    reason: textual_critical
lexical_decisions:
- source_word: παρελθών
  choice: datang
  rationale: Partisip aoris ini menyatakan kedatangan Lisias ke tempat kejadian; dijadikan verba finit agar alur narasi alami dalam bahasa Indonesia.
- source_word: χιλίαρχος
  choice: komandan pasukan
  rationale: Istilah ini secara harfiah menunjuk komandan seribu prajurit dan dalam konteks Romawi berarti tribun militer. 'Komandan pasukan' mudah dipahami tanpa memberi padanan pangkat modern yang terlalu spesifik.
- source_word: μετὰ πολλῆς βίας
  choice: dengan kekuatan besar
  rationale: Ungkapan ini menekankan penggunaan kekuatan fisik yang besar. Pilihan ini mempertahankan arti tanpa menyiratkan secara berlebihan bahwa tindakan itu merupakan kekerasan yang jahat.
- source_word: ἐκ τῶν χειρῶν ἡμῶν ἀπήγαγεν
  choice: merebut dia dari tangan kami
  rationale: ἀπάγω berarti membawa atau menggiring pergi, sedangkan frasa 'dari tangan kami' menunjukkan bahwa Paulus dikeluarkan dari penguasaan mereka. 'Merebut' secara alami menyampaikan tindakan paksa tersebut.
