  text: From him[a], by examining him yourself[b], you will be able to learn about all these things of which we accuse him.
translation:
  language: id
  text: Darinya, setelah memeriksanya sendiri, Tuan akan dapat mengetahui segala hal yang kami tuduhkan kepadanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah memuat tambahan pada ayat 7 tentang Komandan Lisias yang merebut Paulus dengan paksa, lalu menyuruh para penuduhnya menghadap Feliks. Tambahan itu tidak terdapat dalam teks SBLGNT yang diterjemahkan di sini.
    reason: textual_variant
lexical_decisions:
- source_word: παρ’ οὗ
  choice: darinya
  rationale: παρά dengan bentuk genitif menyatakan sumber informasi; “darinya” alami dalam bahasa Indonesia dan tetap menunjuk kepada Paulus sebagai orang yang darinya Feliks dapat memperoleh keterangan.
- source_word: δυνήσῃ
  choice: Tuan akan dapat
  rationale: Bentuk futurum δύναμαι menyatakan kemampuan yang akan nyata melalui pemeriksaan; sapaan “Tuan” membuat rujukan orang kedua kepada gubernur jelas dan sesuai dengan konteks resmi.
- source_word: αὐτὸς
  choice: sendiri
  rationale: Pronomina ini bersifat menegaskan bahwa Feliks secara pribadi dapat melakukan pemeriksaan.
- source_word: ἀνακρίνας
  choice: Dengan memeriksa dia
  rationale: Dalam konteks hukum, ἀνακρίνω berarti memeriksa atau menanyai. “Dengan memeriksa dia” mempertahankan kemungkinan bahwa partisipel ini menyatakan sarana, tanpa mempersempit maknanya hanya menjadi bertanya.
- source_word: περὶ πάντων τούτων
  choice: semua hal
  rationale: περί dengan genitif berarti mengenai atau tentang; dalam susunan Indonesia ini, “mengetahui ... semua hal” menyampaikan objek penyelidikan secara alami.
- source_word: ἐπιγνῶναι
  choice: mengetahui
  rationale: Dalam konteks ini kata tersebut berarti memperoleh pengetahuan yang pasti atau memastikan. “Mengetahui” adalah ungkapan modern yang wajar dan tidak melebihkan nuansa intensifnya.
- source_word: ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ
  choice: yang kami tuduhkan kepadanya
  rationale: κατηγορέω dengan genitif menyatakan pengajuan tuduhan terhadap seseorang; frasa ini alami dalam bahasa Indonesia dan mempertahankan nuansa hukum.
