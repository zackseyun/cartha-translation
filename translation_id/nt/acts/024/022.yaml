base_translation:
  language: en
  yaml_path: translation/nt/acts/024/022.yaml
  text: But Felix, having a more accurate knowledge about the Way, put them off, saying, “When Lysias the commander comes down, I will decide your case.”
translation:
  language: id
  text: Namun, Feliks, yang mengetahui lebih saksama mengenai Jalan itu, menunda perkara mereka[a] dengan berkata, “Apabila Lisias, komandan itu, datang turun, aku akan memutuskan perkara kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menangguhkan sidang mereka”; kata kerja Yunani dapat berarti menunda atau menangguhkan tindakan peradilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνεβάλετο ... αὐτούς
  choice: menunda perkara mereka
  rationale: Dalam konteks peradilan, verba ini berarti menangguhkan tindakan atau keputusan. Frasa ini mempertahankan rujukan pronomina jamak kepada para pihak, sambil menyatakan secara wajar apa yang ditunda dalam bahasa Indonesia.
- source_word: ἀκριβέστερον εἰδὼς
  choice: yang mengetahui dengan lebih saksama
  rationale: Mempertahankan daya komparatif ἀκριβέστερον dan menyatakan bahwa Feliks memiliki pengetahuan yang relatif lebih teliti mengenai gerakan tersebut.
- source_word: τὰ περὶ τῆς ὁδοῦ
  choice: hal-hal mengenai Jalan itu
  rationale: ἡ ὁδός dipakai dalam Kisah Para Rasul sebagai sebutan bagi gerakan pengikut Yesus. Huruf kapital menandai penggunaan khusus ini tanpa menggantinya dengan istilah teologis yang lebih belakangan.
- source_word: Ὅταν ... καταβῇ
  choice: Apabila ... datang kemari
  rationale: Konstruksi ini menyatakan peristiwa mendatang yang masih dinantikan. 'Datang kemari' alami dalam bahasa Indonesia dan menyampaikan gerak menuju tempat Feliks tanpa memaksakan idiom geografis Yunani 'turun'.
- source_word: χιλίαρχος
  choice: sang komandan
  rationale: Istilah ini menunjuk kepada perwira tinggi Romawi. 'Komandan' mudah dipahami pembaca modern, sedangkan kata sandang diterjemahkan dengan 'sang' karena Lisias telah dikenal dalam narasi.
- source_word: διαγνώσομαι
  choice: aku akan memutuskan
  rationale: Dalam konteks hukum, verba ini berarti menetapkan atau memutuskan setelah pemeriksaan.
- source_word: τὰ καθ’ ὑμᾶς
  choice: perkara kalian
  rationale: Ungkapan Yunani berarti hal-hal yang berkenaan dengan pihak-pihak yang hadir; dalam adegan hukum, 'perkara kalian' merupakan padanan Indonesia yang jelas dan wajar.
theological_decisions:
- issue: Identitas 'Jalan'
  choice: Jalan itu
  alternative: agama Kristen / gerakan Kristen
  rationale: Sebutan metaforis asli dipertahankan karena merupakan istilah khas dalam Kisah Para Rasul dan tidak boleh diganti secara diam-diam dengan label yang lebih belakangan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'aku/kalian' dipakai dalam kutipan langsung untuk mencerminkan relasi pejabat dengan para pihak tanpa kekakuan 'saya/Anda'. Struktur ayat dibuat alami sambil mempertahankan hubungan sebab-latar pada pengetahuan Feliks dan nuansa hukum teks sumber.
