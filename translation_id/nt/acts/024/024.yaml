id: ACT.24.24
reference: Acts 24:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μετὰ δὲ ἡμέρας τινὰς παραγενόμενος ὁ Φῆλιξ σὺν Δρουσίλλῃ τῇ ⸀ἰδίᾳ γυναικὶ οὔσῃ Ἰουδαίᾳ μετεπέμψατο τὸν Παῦλον καὶ ἤκουσεν αὐτοῦ περὶ τῆς εἰς Χριστὸν ⸀Ἰησοῦν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/024.yaml
  text: After some days[a], Felix came with Drusilla, his own wife, who was Jewish[b], and sent for Paul and heard him concerning faith in Messiah Jesus.
translation:
  language: id
  text: Beberapa hari kemudian, Feliks datang bersama Drusila, istrinya sendiri, yang adalah seorang Yahudi. Ia menyuruh memanggil Paulus, lalu mendengarkan Paulus berbicara tentang iman kepada Mesias Yesus[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus Yesus” atau “Yesus sang Mesias.” Kata Yunani Χριστός merupakan gelar yang berarti “Mesias.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kepercayaan kepada Mesias Yesus” atau “percaya kepada Mesias Yesus.” Kata yang diterjemahkan “iman” juga dapat mengandung nuansa kepercayaan atau memercayai.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ἡμέρας τινὰς
  choice: Beberapa hari kemudian
  rationale: Ungkapan waktu μετά dengan akusatif berarti ‘setelah beberapa hari’; dalam narasi bahasa Indonesia, ‘beberapa hari kemudian’ menyampaikan urutan waktunya secara wajar. Partikel δέ cukup tercermin dalam kelanjutan narasi tanpa harus diterjemahkan tersendiri.
- source_word: παραγενόμενος
  choice: datang
  rationale: Partisip ini menunjukkan kedatangan Feliks dan secara alami diterjemahkan sebagai verba utama dalam bahasa Indonesia.
- source_word: σὺν Δρουσίλλῃ τῇ ἰδίᾳ γυναικὶ
  choice: bersama Drusila, istrinya sendiri
  rationale: σύν menyatakan penyertaan, sedangkan ἰδίᾳ memberi penegasan posesif yang dipertahankan dengan ‘sendiri’.
- source_word: οὔσῃ Ἰουδαίᾳ
  choice: yang adalah orang Yahudi
  rationale: Frasa ini menerangkan Drusila. ‘Orang Yahudi’ merupakan ungkapan modern dan netral yang tidak memaksakan apakah yang terutama dimaksud ialah identitas etnis atau agama.
- source_word: μετεπέμψατο τὸν Παῦλον
  choice: menyuruh memanggil Paulus
  rationale: Bentuk medial μεταπέμπομαι berarti menyuruh orang menjemput atau memanggil seseorang; ungkapan ini idiomatis dalam bahasa Indonesia.
- source_word: ἤκουσεν αὐτοῦ
  choice: mendengarkan Paulus berbicara
  rationale: ἀκούω dengan genitif di sini menyatakan tindakan mendengarkan Paulus. Penambahan ‘berbicara’ membuat konstruksinya alami tanpa menambah pokok isi baru.
- source_word: περὶ τῆς εἰς Χριστὸν Ἰησοῦν πίστεως
  choice: tentang iman kepada Mesias Yesus
  rationale: περί memperkenalkan pokok pembicaraan, sedangkan πίστις dengan εἰς + akusatif menunjuk pada iman yang diarahkan kepada seseorang. ‘Kepada’ lebih idiomatis daripada ‘di dalam’ untuk konstruksi ini dalam bahasa Indonesia.
- source_word: Χριστὸν Ἰησοῦν
  choice: Mesias Yesus
  rationale: Χριστός masih berfungsi sebagai gelar dan diterjemahkan ‘Mesias’; urutan unsur Yunani dipertahankan sejauh tetap dapat dipahami dalam bahasa Indonesia.
- source_word: πίστεως
  choice: iman
  rationale: Dalam konteks ini πίστις paling wajar berarti iman yang diarahkan kepada Mesias Yesus; nuansa ‘kepercayaan’ atau ‘percaya’ dicatat sebagai alternatif.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias Yesus
  alternative: Kristus Yesus; Yesus sang Mesias
  rationale: ‘Mesias’ mempertahankan fungsi Χριστός sebagai gelar. Bentuk tradisional ‘Kristus Yesus’ dan susunan yang lebih eksplisit ‘Yesus sang Mesias’ tetap merupakan padanan yang mungkin.
- issue: Makna τῆς εἰς Χριστὸν Ἰησοῦν πίστεως
  choice: iman kepada Mesias Yesus
  alternative: percaya kepada Mesias Yesus
  rationale: Konstruksi πίστις + εἰς paling alami menunjuk pada iman atau kepercayaan yang diarahkan kepada Yesus, bukan pada kesetiaan milik Yesus. Alternatif verbal ‘percaya’ mempertahankan nuansa relasionalnya.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar hubungan pelaku jelas. Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim: Feliks, Drusila, dan Paulus.'
