  text: And the Jews also joined in the charge[a], asserting that these things were so.
translation:
  language: id
  text: Orang-orang Yahudi juga ikut mendukung tuduhan itu[a] dengan menyatakan bahwa semua itu memang demikian adanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ikut menyerang”; dalam konteks persidangan, yaitu ikut mendukung tuduhan itu.
    reason: Kata Yunani ini dapat berarti bergabung dalam serangan, termasuk serangan lisan. Dalam konteks ini, maknanya adalah turut mendukung tuduhan yang telah disampaikan.
lexical_decisions:
- source_word: συνεπέθεντο
  choice: ikut menuduh Paulus
  rationale: Kata kerja ini dapat berarti ikut menyerang atau bergabung melawan seseorang. Dalam konteks persidangan, tindakan itu berupa dukungan lisan terhadap tuduhan Tertulus. Objek “Paulus” dibuat eksplisit dari konteks agar kalimat Indonesia alami.
- source_word: δὲ
  choice: juga (bersama καί)
  rationale: δέ merupakan penghubung ringan yang melanjutkan narasi; dalam bahasa Indonesia tidak perlu diterjemahkan secara terpisah karena hubungan antarkalimat sudah jelas dan unsur penambah dinyatakan oleh “juga”.
- source_word: καὶ
  choice: juga
  rationale: Menandai bahwa orang-orang Yahudi turut mengambil bagian dalam tuduhan yang sudah disampaikan Tertulus.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Merujuk pada kelompok Yahudi yang hadir sebagai pihak penuduh dalam sidang, tanpa menggeneralisasi kepada semua orang Yahudi.
- source_word: φάσκοντες
  choice: dengan menyatakan
  rationale: Partisip ini menjelaskan tindakan verbal mereka ketika mendukung tuduhan; “menyatakan” sesuai dengan suasana hukum dan tidak menambahkan penilaian tentang kebenarannya.
- source_word: ταῦτα
  choice: semua itu
  rationale: Menunjuk kembali pada keseluruhan tuduhan yang baru saja dikemukakan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan cakupan luas demonstratif Yunani.
- source_word: οὕτως ἔχειν
  choice: memang benar
  rationale: Idiom Yunani ini berarti bahwa segala sesuatu itu demikian atau benar adanya. “Memang benar” menyampaikan penegasan para penuduh secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Terjemahan mempertahankan konteks hukum tanpa membuat istilahnya terlalu teknis. Frasa “orang-orang Yahudi” dipahami sebagai kelompok yang hadir dalam sidang ini, bukan semua orang Yahudi.
