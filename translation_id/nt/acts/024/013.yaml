base_translation:
  language: en
  yaml_path: translation/nt/acts/024/013.yaml
  text: Nor can they prove to you the things of which they are now accusing me[a].
translation:
  language: id
  text: Mereka juga tidak dapat membuktikan kepadamu hal-hal yang sekarang mereka tuduhkan kepadaku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengemukakan kepadamu” atau “menunjukkan kepadamu”; kata kerja Yunani yang digunakan dapat berarti mengemukakan atau menegakkan sesuatu, di sini dalam arti mendukung tuduhan hukum dengan bukti.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: juga tidak
  rationale: Melanjutkan pembelaan Paulus dengan negasi yang terkait erat dengan ayat sebelumnya; ungkapan ini alami dalam bahasa Indonesia.
- source_word: παραστῆσαι
  choice: membuktikan
  rationale: Dalam konteks persidangan, verba ini menyatakan tindakan mengemukakan atau menegakkan bukti yang mendukung tuduhan; 'membuktikan' menyampaikan daya hukumnya dengan jelas.
- source_word: δύνανταί
  choice: dapat
  rationale: Menyatakan kemampuan secara langsung dan wajar dalam bahasa Indonesia modern.
- source_word: σοι
  choice: kepadamu
  rationale: Mempertahankan datif yang ditujukan kepada Feliks tanpa menambahkan tafsiran; 'di hadapanmu' juga mungkin dalam konteks pengadilan.
- source_word: περὶ ὧν
  choice: hal-hal yang
  rationale: Merujuk pada perkara-perkara yang menjadi pokok tuduhan tanpa mempersempitnya menjadi rumusan dakwaan tertentu.
- source_word: νυνὶ
  choice: sekarang
  rationale: Mempertahankan penanda waktu yang menunjuk pada tuduhan yang sedang diajukan.
- source_word: κατηγοροῦσίν μου
  choice: mereka tuduhkan kepadaku
  rationale: Mengungkapkan tindakan menuduh dalam konteks hukum dan relasi objek yang dinyatakan oleh μου secara alami dalam bahasa Indonesia.
