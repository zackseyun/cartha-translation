base_translation:
  language: en
  yaml_path: translation/nt/acts/024/010.yaml
  text: 'Then Paul answered[a], after the governor had nodded to him to speak: “Knowing that for many years you have been a judge over this nation, I gladly make my defense concerning myself.'
translation:
  language: id
  text: Lalu Paulus menjawab setelah gubernur memberi isyarat kepadanya untuk berbicara, “Karena saya tahu bahwa selama bertahun-tahun Tuan telah menjadi hakim atas bangsa ini, dengan penuh keyakinan[a] saya menyampaikan pembelaan diri saya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan senang hati.” Kata ini dapat menyatakan kesiapan, keberanian, keyakinan, atau kegembiraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθη τε
  choice: Lalu Paulus menjawab
  rationale: Kata kerja ἀποκρίνομαι berarti menjawab atau menanggapi, sedangkan τε menghubungkan alur cerita secara ringan; 'lalu' merupakan penghubung naratif yang wajar dalam bahasa Indonesia.
- source_word: νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν
  choice: setelah gubernur memberi isyarat kepadanya untuk berbicara
  rationale: Konstruksi genitif absolut diterjemahkan sebagai anak kalimat waktu. νεύω dapat menunjuk pada anggukan atau isyarat; 'memberi isyarat' mempertahankan maknanya tanpa menentukan gerak tubuh secara berlebihan.
- source_word: ἡγεμόνος
  choice: gubernur
  rationale: Dalam konteks Kisah Para Rasul, istilah ini menunjuk pada penguasa provinsi Romawi; 'gubernur' adalah padanan Indonesia yang jelas dan lazim.
- source_word: Ἐκ πολλῶν ἐτῶν
  choice: selama bertahun-tahun
  rationale: Ungkapan ini menyatakan jangka waktu panjang yang bermula pada masa lampau dan berlanjut hingga saat itu.
- source_word: ὄντα σε κριτὴν
  choice: Tuan telah menjadi hakim
  rationale: Bentuk partisipial dalam kaitannya dengan keterangan durasi menyatakan peranan yang telah berlangsung selama beberapa tahun. 'Tuan' memberi sapaan hormat yang alami dalam konteks sidang tanpa menambahkan gelar khusus.
- source_word: τῷ ἔθνει τούτῳ
  choice: atas bangsa ini
  rationale: ἔθνος dapat berarti bangsa atau rakyat; 'bangsa ini' mempertahankan corak formal-politis dan merujuk pada bangsa Yahudi di bawah kewenangan Feliks.
- source_word: ἐπιστάμενος
  choice: Karena saya tahu
  rationale: Partisip ini menyatakan dasar bagi sikap Paulus saat mengajukan pembelaan; bentuk kausal eksplisit menghasilkan bahasa Indonesia yang alami.
- source_word: εὐθύμως
  choice: dengan penuh keyakinan
  rationale: Adverbia ini dapat menyatakan kesiapan, keteguhan hati, atau kegembiraan. Dalam suasana pengadilan, 'dengan penuh keyakinan' menyampaikan keberanian dan kesiapan tanpa memberi kesan bahwa Paulus sekadar merasa senang.
- source_word: τὰ περὶ ἐμαυτοῦ ἀπολογοῦμαι
  choice: saya menyampaikan pembelaan diri saya
  rationale: ἀπολογέομαι merupakan istilah forensik untuk mengajukan pembelaan, sementara τὰ περὶ ἐμαυτοῦ menunjuk pada perkara yang menyangkut Paulus sendiri. Rumusan ini mempertahankan latar persidangan dan tetap alami.
