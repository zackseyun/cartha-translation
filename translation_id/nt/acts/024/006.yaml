  text: He even tried to defile the temple[a], and we seized him,
translation:
  language: id
  text: Ia bahkan berusaha menajiskan Bait Allah[a], dan kami menangkapnya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah menambahkan bacaan yang lebih panjang di sini, termasuk bahwa mereka hendak menghakimi Paulus menurut hukum mereka dan bahwa Lisias, sang komandan, mengambilnya dari tangan mereka.
    reason: textual_variant
lexical_decisions:
- source_word: ὃς
  choice: Ia
  rationale: Kata ganti relatif ini merujuk kembali kepada Paulus. Dalam fragmen tuduhan ini, “Ia” lebih alami dalam bahasa Indonesia daripada memulai dengan “yang”.
- source_word: καὶ
  choice: bahkan
  rationale: Dalam konteks tuduhan, καὶ memberi penekanan bahwa Paulus sampai berusaha menajiskan Bait Allah.
- source_word: τὸ ἱερὸν
  choice: Bait Allah
  rationale: Ἱερόν menunjuk pada kompleks Bait Allah, bukan hanya ruang kudus bagian dalam. “Bait Allah” merupakan padanan baku, jelas, dan wajar dalam konteks Yerusalem.
- source_word: ἐπείρασεν
  choice: berusaha
  rationale: Bentuk aoris dari πειράζω di sini berarti mencoba atau berupaya melakukan sesuatu; “berusaha” berpadu alami dengan infinitif berikutnya.
- source_word: βεβηλῶσαι
  choice: menajiskan
  rationale: Βεβηλόω berarti mencemarkan atau membuat tidak suci, khususnya dalam konteks kemurnian ritual. “Menajiskan” mempertahankan nuansa keagamaan tuduhan tersebut.
- source_word: ὃν
  choice: -nya
  rationale: Kata ganti relatif akusatif ini kembali menunjuk kepada Paulus sebagai objek penangkapan; bentuk enklitik “-nya” menghasilkan bahasa Indonesia yang alami.
- source_word: ἐκρατήσαμεν
  choice: kami menangkapnya
  rationale: Κρατέω di sini berarti memegang, menangkap, atau menguasai seseorang. “Menangkapnya” jelas dan alami, sekaligus tidak mengharuskan nuansa prosedural resmi dari “menahannya”.
theological_decisions:
- issue: Bentuk teks Kisah Para Rasul 24:6 dibandingkan dengan bacaan Bizantin yang lebih panjang
  choice: Menerjemahkan hanya klausa SBLGNT yang berakhir dengan “lalu kami menangkapnya,”
  alternative: Bacaan yang lebih panjang mencakup keterangan bahwa mereka hendak menghakimi Paulus menurut hukum mereka, tetapi Lisias merebutnya dari tangan mereka.
  rationale: Naskah sumber yang diberikan memuat bacaan kritis yang lebih pendek. Bacaan panjang tidak dimasukkan ke teks utama, tetapi dicatat sebagai varian tekstual agar pembaca mengetahui tradisi naskah lain.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Bait Allah” dipakai sebagai istilah umum untuk kompleks bait di Yerusalem. Tanda koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis ke bagian berikutnya dalam bacaan pendek.
