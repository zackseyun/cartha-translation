  text: And from there[a], after putting out to sea, we sailed under the lee of Cyprus, because the winds were against us.
translation:
  language: id
  text: Dari sana, setelah bertolak ke laut, kami berlayar di sisi Siprus yang terlindung dari angin[a], karena angin berlawanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kami berlayar di sisi bawah angin Siprus.” Kata kerja Yunani yang dipakai adalah istilah bahari untuk berlayar di sisi sebuah pulau yang terlindung dari angin.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Dari sana
  rationale: Menyampaikan ἐκεῖθεν secara alami; hubungan naratif yang dinyatakan καί tetap jelas dari konteks tanpa perlu memakai pembuka yang kaku.
- source_word: ἀναχθέντες
  choice: setelah bertolak ke laut
  rationale: Dalam pemakaian bahari, ἀνάγω berarti bertolak atau mulai berlayar. Bentuk 'setelah' mempertahankan tindakan partisip yang mendahului pelayaran berikutnya tanpa mempersempit makna menjadi 'mengangkat jangkar'.
- source_word: ὑπεπλεύσαμεν
  choice: kami berlayar menyusuri sisi ... yang terlindung dari angin
  rationale: Kata kerja bahari ὑποπλέω menunjuk pada pelayaran di sisi bawah angin atau sisi pulau yang terlindung. Ungkapan ini akurat sekaligus mudah dipahami pembaca Indonesia yang tidak mengenal istilah bahari teknis.
- source_word: τὴν Κύπρον
  choice: Pulau Siprus
  rationale: Siprus adalah bentuk baku nama Κύπρος dalam bahasa Indonesia; 'Pulau' ditambahkan secara wajar untuk memperjelas bahwa yang dimaksud ialah sebuah pulau.
- source_word: διὰ τὸ ... εἶναι
  choice: karena
  rationale: διά dengan infinitif berartikel menyatakan sebab; 'karena' merupakan padanan modern yang langsung dan alami.
- source_word: τοὺς ἀνέμους
  choice: angin
  rationale: Bahasa Indonesia lazim memakai nomina massal 'angin' tanpa pengulangan meskipun bentuk Yunani jamak.
- source_word: ἐναντίους
  choice: bertiup berlawanan dengan arah pelayaran kami
  rationale: Menyatakan bahwa angin menghambat pelayaran. Frasa 'arah pelayaran kami' membuat hubungan yang tersirat dalam bahasa Yunani jelas secara alami tanpa mengubah sebab yang diberikan teks.
