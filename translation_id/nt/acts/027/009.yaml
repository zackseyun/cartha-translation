  text: Ἱκανοῦ δὲ χρόνου διαγενομένου καὶ ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι, παρῄνει ὁ Παῦλος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/009.yaml
  text: Since considerable time had passed and the voyage was already dangerous[a], because even the Fast had already gone by, Paul was advising them[b],
translation:
  language: id
  text: Setelah waktu yang cukup lama berlalu dan pelayaran sudah berbahaya[a], karena bahkan Hari Puasa[b] sudah lewat, Paulus menasihati mereka,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pelayaran sudah penuh risiko.”
    reason: lexical_alternative
  - marker: b
    text: Hari Puasa kemungkinan besar adalah hari puasa tahunan Yahudi pada Hari Pendamaian. Waktu perayaannya menandai musim ketika pelayaran di laut mulai berbahaya.
    reason: cultural_note
lexical_decisions:
- source_word: Ἱκανοῦ ... χρόνου διαγενομένου
  choice: Setelah waktu yang cukup lama berlalu
  rationale: Ungkapan genitivus absolutus ini menyatakan berlalunya waktu dalam jumlah yang berarti; susunan ini alami dalam bahasa Indonesia dan tidak melebih-lebihkan lamanya penundaan.
- source_word: ὄντος ἤδη ἐπισφαλοῦς
  choice: sudah berbahaya
  rationale: Klausa partisipial ini menggambarkan keadaan pelayaran pada saat itu; 'berbahaya' menyampaikan makna ἐπισφαλής dengan jelas.
- source_word: τοῦ πλοὸς
  choice: pelayaran
  rationale: Dalam konteks ini πλοῦς menunjuk pada kegiatan atau perjalanan melalui laut, bukan kapalnya.
- source_word: διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι
  choice: karena bahkan Hari Puasa sudah lewat
  rationale: Susunan διά dengan infinitif berartikel menyatakan sebab, sedangkan bentuk perfek menandakan bahwa Hari Puasa itu telah berlalu.
- source_word: τὴν νηστείαν
  choice: Hari Puasa
  rationale: Kata benda tunggal dengan artikel tampaknya menunjuk pada hari puasa Yahudi yang dikenal, kemungkinan besar Hari Pendamaian; kapitalisasi mempertahankan sifat rujukan khusus tanpa memasukkan identifikasi itu ke teks utama.
- source_word: παρῄνει
  choice: menasihati mereka
  rationale: Verba ini dapat berarti menasihati atau mendesak. 'Menasihati' memperkenalkan perkataan Paulus pada ayat berikut tanpa memperkuatnya menjadi peringatan secara tidak perlu; objek 'mereka' tersirat dari konteks dan wajar dinyatakan dalam bahasa Indonesia.
