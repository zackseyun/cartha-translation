  text: As we were being violently storm-tossed[a], on the next day they began to throw the cargo overboard.
translation:
  language: id
  text: Kami diombang-ambingkan oleh badai dengan dahsyat; keesokan harinya mereka membuang muatan kapal ke laut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “mereka melakukan pembuangan.” Bahasa Yunani memakai istilah pelayaran untuk membuang barang dari kapal agar kapal menjadi lebih ringan; “muatan kapal” tersirat oleh konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σφοδρῶς
  choice: dengan hebat
  rationale: Keterangan ini memperkuat dahsyatnya dampak badai; ungkapan tersebut alami dalam bahasa Indonesia dan tidak melemahkan intensitasnya.
- source_word: χειμαζομένων
  choice: terus diombang-ambingkan badai
  rationale: Bentuk pasif partisipial menunjukkan bahwa kami sedang mengalami guncangan atau tekanan badai. Kata 'terus' membantu menyampaikan aspek tindakan yang sedang berlangsung.
- source_word: ἡμῶν
  choice: kami
  rationale: Genitif absolut dialihkan menjadi anak kalimat dengan subjek orang pertama jamak eksklusif, sesuai konteks narator dan rombongannya.
- source_word: τῇ ἑξῆς
  choice: keesokan harinya
  rationale: Ungkapan waktu ini berarti hari berikutnya; 'keesokan harinya' ringkas dan alami dalam narasi Indonesia.
- source_word: ἐκβολὴν
  choice: membuang muatan kapal ke laut
  rationale: Nomina ini merupakan istilah pelayaran untuk tindakan membuang barang dari kapal guna meringankannya. 'Muatan kapal' tersirat oleh konteks, tetapi tidak dinyatakan secara eksplisit dalam bahasa Yunani sehingga diberi catatan kaki.
- source_word: ἐποιοῦντο
  choice: mulai membuang
  rationale: Bentuk imperfek tengah menggambarkan tindakan mereka yang mulai atau sedang berlangsung; dalam alur narasi, 'mulai membuang' menyatakan permulaan tindakan secara wajar.
