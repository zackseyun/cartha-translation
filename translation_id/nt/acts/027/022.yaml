  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kata ganti jamak “kalian” memperjelas bahwa Paulus berbicara kepada seluruh orang di kapal. Struktur klausa terakhir dibuat alami dalam bahasa Indonesia sambil mempertahankan kontras antara keselamatan semua orang dan hilangnya kapal.
