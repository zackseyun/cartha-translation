  text: καὶ τὰ νῦν παραινῶ ὑμᾶς εὐθυμεῖν, ἀποβολὴ γὰρ ψυχῆς οὐδεμία ἔσται ἐξ ὑμῶν πλὴν τοῦ πλοίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/022.yaml
  text: And now I urge you to take courage[a], for there will be no loss of life among you[b], except for the ship.
translation:
  language: id
  text: Dan sekarang aku menasihati kalian agar tetap bersemangat[a], sebab tidak seorang pun di antara kalian akan kehilangan nyawanya[b]; yang akan hilang hanyalah kapal itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tetap tabah” atau “jangan kehilangan keberanian.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak akan ada kehilangan nyawa”; ψυχή di sini mengacu pada hidup fisik, bukan secara khusus jiwa sebagai unsur nonjasmani.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τὰ νῦν
  choice: Namun sekarang
  rationale: Ungkapan waktu ini memperkenalkan nasihat Paulus dalam keadaan yang sedang berlangsung. “Namun” menghubungkannya secara alami dengan bahaya yang baru saja ia uraikan.
- source_word: παραινῶ
  choice: aku menasihati
  rationale: Kata ini menyatakan nasihat atau anjuran yang sungguh-sungguh. “Menasihati” alami dalam bahasa Indonesia dan tidak sekeras “mendesak”.
- source_word: εὐθυμεῖν
  choice: agar tetap tabah
  rationale: Kata kerja ini berarti berada dalam keadaan bersemangat atau berani. Dalam situasi badai, “tetap tabah” menyampaikan seruan untuk mempertahankan keberanian tanpa terdengar kuno.
- source_word: ἀποβολὴ ψυχῆς
  choice: kehilangan nyawanya
  rationale: Dalam konteks ini ψυχή menunjuk pada hidup jasmani, sedangkan ἀποβολή berarti kehilangan. Ungkapan ini jelas menyatakan bahwa tidak seorang pun akan mati.
- source_word: οὐδεμία ἔσται ἐξ ὑμῶν
  choice: tidak seorang pun di antara kalian akan
  rationale: Rumusan ini mempertahankan penyangkalan menyeluruh dan menjelaskan kelompok yang dimaksud dengan bahasa Indonesia yang wajar.
- source_word: πλὴν τοῦ πλοίου
  choice: yang akan hilang hanyalah kapal ini
  rationale: 'πλήν menandai pengecualian: semua orang akan selamat, tetapi kapal akan hilang. Susunan ini menghindari kesan tidak alami bahwa kapal memiliki nyawa.'
