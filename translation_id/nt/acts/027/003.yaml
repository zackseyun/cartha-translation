base_translation:
  language: en
  yaml_path: translation/nt/acts/027/003.yaml
  text: And on the next day we put in at Sidon[a], and Julius, treating Paul kindly[b], permitted him to go to his friends and receive care.
translation:
  language: id
  text: Keesokan harinya kami singgah di Sidon. Yulius memperlakukan Paulus dengan ramah[a] dan mengizinkannya pergi menemui sahabat-sahabatnya untuk menerima perawatan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “secara manusiawi”; ungkapan Yunaninya menekankan perlakuan Yulius yang penuh kebaikan terhadap seorang tahanan.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani ini juga dapat berarti “perhatian” atau bantuan praktis; maknanya mencakup pemeliharaan yang mungkin diberikan sahabat-sahabat Paulus.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἑτέρᾳ
  choice: Keesokan harinya
  rationale: Ungkapan datif temporal ini dalam alur narasi menunjuk pada hari berikutnya; bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: κατήχθημεν εἰς Σιδῶνα
  choice: kami singgah di Sidon
  rationale: Dalam konteks pelayaran, κατάγω berarti membawa kapal ke darat atau masuk ke suatu pelabuhan. 'Singgah di Sidon' mempertahankan nuansa baharinya.
- source_word: φιλανθρώπως ... χρησάμενος
  choice: memperlakukan Paulus dengan baik hati
  rationale: Gabungan ini menggambarkan tindakan Yulius yang baik dan manusiawi terhadap Paulus; terjemahan ini alami tanpa menghilangkan unsur kemurahan hatinya.
- source_word: ἐπέτρεψεν
  choice: mengizinkannya
  rationale: Kata kerja ini berarti memberi izin; bentuk dengan pronomina merangkai kalimat secara alami.
- source_word: πρὸς τοὺς φίλους
  choice: pergi menemui sahabat-sahabatnya
  rationale: Kata sandang menunjuk kepada orang-orang yang dikenal Paulus di Sidon. 'Menemui' menyampaikan arah gerak kepada mereka secara wajar.
- source_word: ἐπιμελείας τυχεῖν
  choice: menerima perhatian dan bantuan
  rationale: Ungkapan ini luas, yakni memperoleh perhatian, perawatan, atau pertolongan yang dibutuhkan. Pasangan kata ini mempertahankan keluasan maknanya dalam konteks praktis.
