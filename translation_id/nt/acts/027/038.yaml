  text: κορεσθέντες ⸀δὲ τροφῆς ἐκούφιζον τὸ πλοῖον ἐκβαλλόμενοι τὸν σῖτον εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/038.yaml
  text: And when they had eaten enough[c][b][a], they began to lighten the ship by throwing the wheat into the sea.
translation:
  language: id
  text: Setelah mereka makan sampai kenyang[a], mereka mulai meringankan kapal dengan membuang gandum[b] ke laut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setelah mereka kenyang oleh makanan” atau “setelah mereka makan secukupnya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “biji-bijian.” Kata Yunani yang dipakai dapat bermakna lebih luas, tetapi di sini kemungkinan besar menunjuk pada gandum.
    reason: lexical_alternative
lexical_decisions:
- source_word: κορεσθέντες … τροφῆς
  choice: setelah mereka makan sampai kenyang
  rationale: Partisip aoristus pasif menyatakan bahwa mereka telah dikenyangkan oleh makanan. Ungkapan ini menyampaikan urutan waktu dan maknanya secara wajar dalam bahasa Indonesia.
- source_word: δὲ
  choice: setelah
  rationale: δέ merupakan penghubung ringan yang melanjutkan alur cerita; dalam susunan Indonesia, kelanjutan naratif sudah tersampaikan secara alami melalui klausa waktu tanpa perlu menerjemahkannya sebagai kata tersendiri.
- source_word: ἐκούφιζον τὸ πλοῖον
  choice: mereka mulai meringankan kapal
  rationale: Imperfek dapat menyoroti berlangsungnya atau dimulainya tindakan. 'Mulai meringankan' wajar dalam konteks naratif dan mempertahankan nuansa inseptif yang mungkin.
- source_word: ἐκβαλλόμενοι
  choice: dengan membuang
  rationale: Partisip kini menjelaskan cara mereka meringankan kapal; 'dengan membuang' menyatakan hubungan sarana itu secara jelas.
- source_word: τὸν σῖτον
  choice: gandum
  rationale: σῖτος dapat berarti biji-bijian secara umum, tetapi dalam konteks muatan kapal ini kemungkinan besar menunjuk pada gandum.
- source_word: εἰς τὴν θάλασσαν
  choice: ke laut
  rationale: Padanan arah yang langsung, tepat, dan alami dalam konteks pelayaran.
