  text: διὸ εὐθυμεῖτε, ἄνδρες· πιστεύω γὰρ τῷ θεῷ ὅτι οὕτως ἔσται καθ’ ὃν τρόπον λελάληταί μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/025.yaml
  text: Therefore[a], take courage, men, for I believe God that it will be just as it has been told to me.
translation:
  language: id
  text: Karena itu, tetaplah berani, hai Saudara-saudara! Sebab aku percaya kepada Allah[a] bahwa akan terjadi sebagaimana yang telah dikatakan kepadaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku memercayai Allah.” Konstruksi bahasa Yunani ini dapat menekankan tindakan memercayai Allah atau mempercayai apa yang telah Allah katakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan dari jaminan dan dorongan pada ayat sebelumnya serta mempertahankan hubungan logis secara alami.
- source_word: εὐθυμεῖτε
  choice: tetaplah berani
  rationale: Imperatif ini menyerukan keteguhan hati di tengah bahaya; unsur 'tetaplah' sesuai dengan konteks dorongan yang sedang berlangsung.
- source_word: ἄνδρες
  choice: Saudara-saudara
  rationale: Sapaan Indonesia yang wajar dan bermartabat kepada sekelompok laki-laki; konteks kapal tetap menunjukkan bahwa yang disapa adalah para pria.
- source_word: πιστεύω τῷ θεῷ
  choice: aku percaya kepada Allah
  rationale: Konstruksi πιστεύω dengan datif menyatakan bahwa Paulus memercayai Allah atau menaruh kepercayaan kepada-Nya; ungkapan ini alami dalam bahasa Indonesia dan tetap membuka nuansa personal serta proposisional.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi kepercayaan Paulus, bukan alasan ia percaya.
- source_word: οὕτως ἔσται καθ’ ὃν τρόπον
  choice: semuanya akan terjadi tepat seperti
  rationale: Menyampaikan kesesuaian erat antara peristiwa mendatang dan pesan yang telah diterima, dengan bentuk Indonesia yang jelas dan alami.
- source_word: λελάληταί μοι
  choice: yang telah dikatakan kepadaku
  rationale: 'Mempertahankan bentuk pasif dan aspek perfektif: perkataan terdahulu tetap berlaku pada saat Paulus berbicara.'
theological_decisions:
- issue: Makna πιστεύω τῷ θεῷ
  choice: aku percaya kepada Allah
  alternative: aku memercayai Allah / aku yakin akan firman Allah
  rationale: Bentuk datif dapat menonjolkan kepercayaan kepada pribadi Allah sekaligus penerimaan atas apa yang telah Ia katakan. Terjemahan utama tidak membatasi ungkapan itu hanya pada salah satu nuansa.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan 'Saudara-saudara' dipakai sebagai vokatif alami kepada kelompok laki-laki, sedangkan 'tetaplah berani' sesuai dengan situasi krisis yang sedang berlangsung.
