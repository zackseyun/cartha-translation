    text: Atau, “aku memercayai Allah.” Konstruksi bahasa Yunani ini dapat menekankan tindakan memercayai Allah atau mempercayai apa yang telah Allah katakan.
    reason: lexical_alternative
  revision_rationale: Revisi menghapus “semuanya,” yang merupakan penambahan makna, dan memakai “sebagaimana” untuk menyatakan korespondensi οὕτως ... καθ’ ὃν τρόπον tanpa penegasan berlebih. Sapaan langsung dipertegas dengan “hai,” sambil mempertahankan bentuk sapaan Indonesia yang lazim untuk kelompok laki-laki. Catatan kaki diperjelas agar mencerminkan ambiguitas nuansa πιστεύω τῷ θεῷ.
