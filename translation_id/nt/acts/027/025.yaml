revisions:
- from: Karena itu, tetaplah berani, Saudara-saudara! Sebab aku percaya kepada Allah[a] bahwa semuanya akan terjadi tepat seperti yang telah dikatakan kepadaku.
  to: Karena itu, tetaplah berani, hai Saudara-saudara! Sebab aku percaya kepada Allah[a] bahwa akan terjadi sebagaimana yang telah dikatakan kepadaku.
  rationale: Revisi menghapus “semuanya,” yang merupakan penambahan makna, dan memakai “sebagaimana” untuk menyatakan korespondensi οὕτως ... καθ’ ὃν τρόπον tanpa penegasan berlebih. Sapaan langsung dipertegas dengan “hai,” sambil mempertahankan bentuk sapaan Indonesia yang lazim untuk kelompok laki-laki. Catatan kaki diperjelas agar mencerminkan ambiguitas nuansa πιστεύω τῷ θεῷ.
