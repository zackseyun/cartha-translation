review_pass:
  verdict: revise
  source_fidelity: Sapaan ἄνδρες perlu tetap tampak sebagai sapaan kepada laki-laki, bukan dinetralkan. Selain itu, “semuanya” tidak dinyatakan dalam teks Yunani; predikasi impersonal “akan terjadi” lebih dekat dengan ἔσται.
  naturalness: Revisi mempertahankan bahasa Indonesia modern dan wajar. “Hai, Saudara-saudara” adalah sapaan langsung yang lazim dalam register Alkitab Indonesia, sementara “akan terjadi sebagaimana ...” mengalir alami.
  terminology: “Aku percaya kepada Allah” dapat dipertahankan sebagai padanan yang wajar untuk πιστεύω τῷ θεῷ, dengan catatan yang secara tepat menyatakan kemungkinan nuansa “memercayai Allah”/mempercayai perkataan-Nya.
  issues:
  - severity: medium
    issue: “Saudara-saudara” tidak secara eksplisit menyatakan bahwa ἄνδρες menyapa para laki-laki.
    rationale: Ἄνδρες adalah vokatif maskulin dan, dalam konteks kapal ini, ditujukan kepada kelompok laki-laki. Penambahan “hai” memperjelas bahwa ini sapaan langsung, sedangkan bentuk “Saudara-saudara” dipertahankan sebagai konvensi Indonesia bagi sapaan kelompok laki-laki tanpa menjadikannya sapaan netral semata.
  - severity: medium
    issue: “Semuanya akan terjadi” menambahkan kuantifikasi yang tidak eksplisit dalam οὕτως ἔσται.
    rationale: Teks Yunani memakai bentuk tunggal impersonal, “akan demikian/akan terjadi demikian.” Menghilangkan “semuanya” menghindari perluasan makna sambil mempertahankan maksud prediktifnya.
  - severity: low
    issue: Catatan kaki dapat menyatakan alternatif semantis dengan lebih tepat dan idiomatis.
    rationale: Kontrasnya bukan sekadar “kepercayaan kepada Allah” versus “keyakinan terhadap” sesuatu, melainkan memercayai Allah atau menerima sebagai benar apa yang telah Ia katakan.
  revised_text: Karena itu, tetaplah berani, hai Saudara-saudara! Sebab aku percaya kepada Allah[a] bahwa akan terjadi sebagaimana yang telah dikatakan kepadaku.
  revised_footnotes:
