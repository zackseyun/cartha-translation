  text: παρέστη γάρ μοι ταύτῃ τῇ ⸀νυκτὶ τοῦ θεοῦ, οὗ ⸀εἰμι, ᾧ καὶ λατρεύω, ⸀ἄγγελος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/023.yaml
  text: For this very night an angel of the God to whom I belong and whom I also worship stood by me[b][a],
translation:
  language: id
  text: Sebab malam ini seorang malaikat dari Allah—Allah yang memiliki aku dan yang juga kusembah[b]—berdiri di sisiku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berdiri di dekatku.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “yang juga kulayani”; kata Yunani ini dapat berarti melakukan pelayanan ibadah atau menyembah Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέστη
  choice: berdiri di sisiku
  rationale: Mempertahankan gambaran spasial bahwa malaikat itu hadir berdiri di dekat Paulus, tanpa mempersempit maknanya menjadi sekadar 'menampakkan diri'.
- source_word: γάρ
  choice: Sebab
  rationale: Menandai bahwa ayat ini memberikan dasar bagi keyakinan Paulus dalam konteks sebelumnya.
- source_word: ταύτῃ τῇ νυκτί
  choice: pada malam ini juga
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menangkap penekanan demonstratif pada malam yang sedang berlangsung.
- source_word: τοῦ θεοῦ
  choice: dari Allah
  rationale: Genitif tersebut menerangkan malaikat sebagai utusan yang berasal dari dan menjadi milik Allah; bentuk ini alami dalam bahasa Indonesia.
- source_word: οὗ εἰμι
  choice: yang kepada-Nya aku ini milik
  rationale: Menyampaikan arti harfiah 'yang empunya aku' sebagai hubungan kepemilikan atau keberpihakan, dengan susunan yang tetap dapat dipahami dalam bahasa Indonesia modern.
- source_word: ᾧ καὶ λατρεύω
  choice: yang juga kusembah
  rationale: λατρεύω ketika ditujukan kepada Allah lazim menunjuk pada pelayanan religius atau ibadah; 'kusembah' menyampaikan daya religiusnya dengan jelas, sedangkan kemungkinan 'kulayani' dipertahankan dalam catatan kaki.
- source_word: ἄγγελος
  choice: seorang malaikat
  rationale: Konteks penyampaian penguatan ilahi menunjukkan utusan surgawi, bukan utusan manusia.
theological_decisions:
- issue: Penerjemahan οὗ εἰμι
  choice: yang kepada-Nya aku ini milik
  alternative: yang empunya aku / yang memiliki aku
  rationale: Pilihan ini mempertahankan pernyataan Paulus bahwa dirinya adalah milik Allah, tanpa menambahkan penjelasan doktrinal di luar ungkapan Yunani.
- issue: Penerjemahan λατρεύω
  choice: kusembah
  alternative: kulayani / kuberibadah kepada-Nya
  rationale: Kata Yunani ini dapat mencakup pelayanan sakral dan penyembahan kepada Allah. Teks utama memakai ungkapan yang jelas secara religius, sementara keluasan maknanya dijaga dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Tanda pisah mengapit dua klausa relatif agar hubungan 'malaikat dari Allah' tetap jelas. Semua penanda catatan kaki ditempatkan langsung pada unsur yang diterangkan.
