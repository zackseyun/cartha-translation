  source_fidelity: 'Terjemahan dengan setia mencerminkan unsur-unsur Yunani: larangan Μὴ φοβοῦ, keharusan δεῖ, tampil di hadapan Kaisar, penanda perhatian ἰδοὺ, bentuk perfektum κεχάρισται, serta cakupan semua orang yang berlayar bersama Paulus. Frasa “telah mengaruniakan kepadamu semua orang” mempertahankan bahasa pemberian/kemurahan dari χαρίζομαι tanpa mengubahnya menjadi pernyataan eksplisit tentang keselamatan.'
