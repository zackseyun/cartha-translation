id: ACT.27.24
reference: Acts 27:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγων· Μὴ φοβοῦ, Παῦλε· Καίσαρί σε δεῖ παραστῆναι, καὶ ἰδοὺ κεχάρισταί σοι ὁ θεὸς πάντας τοὺς πλέοντας μετὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/024.yaml
  text: saying, ‘Do not be afraid, Paul. You must stand before Caesar, and look, God has granted to you all those sailing with you.’
translation:
  language: id
  text: katanya, “Jangan takut, Paulus. Engkau harus menghadap Kaisar. Dan lihatlah, Allah telah mengaruniakan kepadamu semua orang yang berlayar bersamamu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: katanya
  rationale: Partisipel ini secara alami melanjutkan perkataan malaikat pada ayat sebelumnya.
- source_word: Μὴ φοβοῦ
  choice: Jangan takut
  rationale: Padanan langsung dan wajar untuk larangan dalam bentuk kini.
- source_word: δεῖ παραστῆναι
  choice: harus menghadap
  rationale: Menyampaikan unsur keharusan ilahi serta gagasan tampil atau berdiri di hadapan penguasa dalam bahasa Indonesia yang alami.
- source_word: Καίσαρί
  choice: Kaisar
  rationale: Gelar penguasa Romawi dipertahankan dalam bentuk baku bahasa Indonesia.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan penanda perhatian yang eksplisit tanpa membuat ungkapan terasa kuno secara berlebihan.
- source_word: κεχάρισταί σοι ὁ θεὸς
  choice: Allah telah mengaruniakan kepadamu
  rationale: Bentuk perfektum menyatakan pemberian yang sudah dianugerahkan dan tetap berlaku; susunan ini juga mempertahankan nuansa kemurahan ilahi.
- source_word: πάντας τοὺς πλέοντας μετὰ σοῦ
  choice: semua orang yang berlayar bersamamu
  rationale: Menerjemahkan cakupan πάντας dan tindakan berlayar secara langsung.
theological_decisions:
- issue: Makna Allah 'mengaruniakan' semua rekan pelayaran kepada Paulus
  choice: Allah telah mengaruniakan kepadamu semua orang yang berlayar bersamamu
  alternative: Allah telah menyelamatkan semua orang yang berlayar bersamamu demi engkau
  rationale: Teks Yunani memakai χαρίζομαι, bukan kata kerja eksplisit untuk 'menyelamatkan'. Terjemahan mempertahankan metafora pemberian dan tidak memastikan lebih jauh hubungan antara permohonan Paulus, kemurahan Allah, dan keselamatan mereka.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan 'Engkau' dipakai dalam kutipan langsung kepada Paulus; 'Kaisar' diperlakukan sebagai gelar/nama penguasa. Tidak diperlukan catatan kaki.
