  text: ὁ δὲ ⸀ἑκατοντάρχης βουλόμενος διασῶσαι τὸν Παῦλον ἐκώλυσεν αὐτοὺς τοῦ βουλήματος, ἐκέλευσέν τε τοὺς δυναμένους κολυμβᾶν ἀπορίψαντας πρώτους ἐπὶ τὴν γῆν ἐξιέναι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/043.yaml
  text: But the centurion[a], wanting to save Paul, kept them from their plan, and ordered those who were able to swim to jump overboard first and get to land[b],
translation:
  language: id
  text: Namun, perwira itu ingin menyelamatkan Paulus. Karena itu, ia mencegah mereka melaksanakan niat tersebut, lalu memerintahkan orang-orang yang dapat berenang untuk terlebih dahulu terjun dari kapal dan menuju daratan,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “setelah menjatuhkan diri, pergi lebih dahulu ke daratan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: perwira
  rationale: Istilah ini menunjuk kepada seorang centurion, yaitu perwira Romawi. Dalam bahasa Indonesia, “perwira” alami dan cukup tepat dalam konteks yang telah memperkenalkan jabatan tersebut.
- source_word: βουλόμενος διασῶσαι τὸν Παῦλον
  choice: ingin menyelamatkan Paulus
  rationale: Partisipel βουλόμενος menyatakan keinginan atau maksud, sedangkan διασῶσαι dalam konteks ini berarti mempertahankan Paulus tetap hidup.
- source_word: ἐκώλυσεν αὐτοὺς τοῦ βουλήματος
  choice: mencegah mereka melaksanakan niat tersebut
  rationale: Konstruksi ini menyatakan bahwa perwira itu menghalangi para prajurit menjalankan niat mereka, yakni niat yang disebutkan dalam ayat sebelumnya.
- source_word: ἐκέλευσέν τε
  choice: lalu memerintahkan
  rationale: κελεύω menyatakan pemberian perintah; “lalu” secara alami menunjukkan kelanjutan tindakan dalam narasi.
- source_word: τοὺς δυναμένους κολυμβᾶν
  choice: orang-orang yang dapat berenang
  rationale: Frasa partisipial ini mengidentifikasi kelompok di kapal yang memiliki kemampuan berenang.
- source_word: ἀπορίψαντας πρώτους
  choice: untuk terlebih dahulu terjun dari kapal
  rationale: ἀπορίψαντας secara harfiah menggambarkan mereka melemparkan diri turun; dalam konteks kapal, “terjun dari kapal” menyampaikan tindakan itu secara wajar, sementara πρώτους menunjukkan urutan.
- source_word: ἐπὶ τὴν γῆν ἐξιέναι
  choice: menuju daratan
  rationale: Frasa ini menggambarkan gerak keluar dari air ke darat. “Menuju daratan” mempertahankan arah tanpa memastikan bahwa mereka langsung berhasil mencapainya.
