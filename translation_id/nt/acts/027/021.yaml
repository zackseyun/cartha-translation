  to: Setelah mereka lama tidak makan,[a] Paulus berdiri di tengah-tengah mereka dan berkata, “Saudara-saudara, seharusnya kalian mendengarkan nasihat saya[b] dan tidak berlayar meninggalkan Kreta, dan dengan demikian menghindari kerusakan dan kerugian ini.”[c]
