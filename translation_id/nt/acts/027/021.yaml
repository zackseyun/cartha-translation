  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πολλῆς ⸀τε ἀσιτίας ὑπαρχούσης τότε σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν εἶπεν· Ἔδει μέν, ὦ ἄνδρες, πειθαρχήσαντάς μοι μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/021.yaml
  text: Since they had gone a long time without food, then Paul stood up among them and said, “Men, you should have listened to me and not set sail from Crete, and so have avoided this damage and loss.”
translation:
  language: id
  text: Setelah mereka lama tidak makan,[a] Paulus berdiri di tengah-tengah mereka dan berkata, “Saudara-saudara, seharusnya kalian mendengarkan nasihat saya[b] dan tidak berlayar meninggalkan Kreta, dan dengan demikian menghindari kerusakan dan kerugian ini.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Setelah mereka lama berpuasa.” Kata Yunani yang dipakai dapat berarti tidak mendapat makanan atau berpantang makan; dalam konteks badai ini, lama tidak makan lebih mungkin.
    reason: lexical_alternative
  - marker: b
    text: Atau “menaati saya.” Kata kerjanya dapat berarti menaati perintah atau kewenangan; di sini maksudnya ialah mengindahkan nasihat Paulus.
    reason: lexical_alternative
  - marker: c
    text: Pasangan “kerusakan dan kerugian” mungkin membedakan kerusakan atau penderitaan fisik dari kerugian materi.
    reason: cultural_note
lexical_decisions:
- source_word: Πολλῆς τε ἀσιτίας ὑπαρχούσης
  choice: Setelah mereka lama tidak makan
  rationale: Konstruksi genitif absolut menyatakan keadaan yang mendahului ucapan Paulus. ἀσιτία dapat berarti kekurangan makanan atau berpantang makan; dalam konteks badai, keadaan lama tidak makan lebih mungkin daripada puasa keagamaan.
- source_word: σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν
  choice: Paulus berdiri di tengah-tengah mereka
  rationale: Ungkapan ini mempertahankan tindakan Paulus mengambil posisi di tengah kelompok untuk berbicara kepada mereka.
- source_word: Ἔδει μέν, ὦ ἄνδρες
  choice: Saudara-saudara, seharusnya kalian
  rationale: ἔδει menyatakan sesuatu yang semestinya telah dilakukan. Sapaan 'Saudara-saudara' merupakan sapaan wajar dan bermartabat kepada kelompok laki-laki tanpa terdengar kaku dalam bahasa Indonesia modern.
- source_word: πειθαρχήσαντάς μοι
  choice: mendengarkan nasihat saya
  rationale: πειθαρχέω dapat berarti menaati atau mengindahkan. Dalam konteks ini Paulus sebelumnya memberi nasihat, sehingga pilihan ini menyampaikan bahwa nasihatnya seharusnya diikuti tanpa melebih-lebihkan kedudukan formalnya.
- source_word: μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης
  choice: tidak berlayar meninggalkan Kreta
  rationale: Dalam konteks pelayaran, ἀνάγω berarti bertolak atau berlayar ke laut; frasa ini jelas menyatakan keberangkatan dari Kreta.
- source_word: κερδῆσαί τε
  choice: Dengan demikian, kalian dapat menghindari
  rationale: κερδαίνω secara harfiah berkaitan dengan memperoleh keuntungan, tetapi dalam konteks ini bermakna tidak mengalami atau terhindar dari akibat buruk.
- source_word: τὴν ὕβριν ταύτην καὶ τὴν ζημίαν
  choice: kerusakan dan kerugian ini
  rationale: Dalam konteks maritim, ὕβρις menunjuk pada kerusakan atau penderitaan berat yang dialami, sedangkan ζημία menunjuk pada kerugian. Pasangan istilah ini dipertahankan tanpa menyamakannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang jelas dan bermartabat. Pronomina 'kalian' dipakai karena Paulus menyapa kelompok secara langsung; 'Saudara-saudara' mengungkapkan sapaan kepada para laki-laki secara alami. Semua penanda catatan kaki ditempatkan dalam teks utama.
