id: ACT.27.10
reference: Acts 27:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Ἄνδρες, θεωρῶ ὅτι μετὰ ὕβρεως καὶ πολλῆς ζημίας οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ τῶν ψυχῶν ἡμῶν μέλλειν ἔσεσθαι τὸν πλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/010.yaml
  text: saying to them[a], “Men, I perceive that the voyage is about to be with disaster and great loss, not only of the cargo and the ship[b], but also of our lives.”
translation:
  language: id
  text: katanya kepada mereka, “Saudara-saudara, saya menilai bahwa pelayaran ini akan disertai malapetaka dan kerugian besar[a], bukan hanya pada muatan dan kapal, tetapi juga pada nyawa kita[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan disertai penderitaan hebat dan banyak kerusakan.” Ungkapan Yunani ini dapat menekankan kesukaran dahsyat atau kerusakan yang menyertai pelayaran.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jiwa kita”; dalam konteks ancaman karam dan kematian, maksudnya adalah “nyawa kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: katanya kepada mereka
  rationale: Partisipel ini memperkenalkan ucapan Paulus sebagai keadaan penyerta dalam alur narasi. Bentuk ini ringkas dan alami dalam bahasa Indonesia.
- source_word: Ἄνδρες
  choice: Saudara-saudara
  rationale: Sapaan ini ditujukan kepada para lelaki dalam rombongan kapal. “Saudara-saudara” merupakan sapaan langsung yang alami dan bermartabat dalam bahasa Indonesia modern tanpa kekakuan “Tuan-tuan”.
- source_word: θεωρῶ
  choice: saya menilai
  rationale: Kata ini di sini menyatakan penilaian atau kesimpulan berdasarkan pengamatan, bukan sekadar tindakan melihat dengan mata.
- source_word: μετὰ ὕβρεως καὶ πολλῆς ζημίας
  choice: akan disertai malapetaka dan kerugian besar
  rationale: μετά dengan genitif menyatakan keadaan yang menyertai pelayaran. Dalam konteks bahaya laut, ὕβρις menunjuk pada pengalaman dahsyat atau mencelakakan, sedangkan ζημία menunjuk pada kerugian atau kerusakan.
- source_word: οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ
  choice: bukan hanya pada muatan dan kapal, tetapi juga pada
  rationale: Genitifnya berkaitan dengan gagasan kerugian. Preposisi “pada” secara alami menunjukkan hal-hal yang akan terkena kerugian tersebut.
- source_word: τῶν ψυχῶν ἡμῶν
  choice: nyawa kita
  rationale: Dalam konteks ancaman karam dan kematian, ψυχή berarti kehidupan jasmani atau nyawa, bukan secara khusus unsur rohani manusia.
- source_word: μέλλειν ἔσεσθαι
  choice: akan
  rationale: Gabungan infinitif ini menyatakan sesuatu yang diperkirakan segera atau pasti terjadi. “Akan” menyampaikan orientasi ke masa depan secara alami, sementara unsur penilaian sudah dinyatakan oleh “saya menilai”.
- source_word: τὸν πλοῦν
  choice: pelayaran ini
  rationale: πλοῦς berarti perjalanan melalui laut. Kata sandang dan konteks menunjuk pada pelayaran yang sedang dibicarakan, sehingga “ini” wajar dalam bahasa Indonesia.
