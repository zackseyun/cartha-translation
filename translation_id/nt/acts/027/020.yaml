source:
  edition: SBLGNT
  text: μήτε δὲ ἡλίου μήτε ἄστρων ἐπιφαινόντων ἐπὶ πλείονας ἡμέρας, χειμῶνός τε οὐκ ὀλίγου ἐπικειμένου, λοιπὸν περιῃρεῖτο ⸂ἐλπὶς πᾶσα⸃ τοῦ σῴζεσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/020.yaml
  text: And when neither sun nor stars appeared for many days[a], and no small storm was pressing on us, from then on all hope of our being saved was gradually taken away.
translation:
  language: id
  text: Ketika matahari maupun bintang-bintang tidak tampak selama berhari-hari dan badai dahsyat terus melanda kami, sejak saat itu segala harapan bahwa kami akan diselamatkan[a] berangsur-angsur sirna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kami akan lolos.” Kata kerja Yunani ini dapat berarti “menyelamatkan” atau “menolong keluar dari bahaya”; di sini yang dimaksud ialah keselamatan jasmani dari badai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφαινόντων
  choice: tidak tampak
  rationale: Dalam konteks benda-benda langit dan pelayaran, verba ini menyatakan bahwa matahari dan bintang-bintang tidak terlihat atau tidak menampakkan cahayanya. ‘Tidak tampak’ alami dalam bahasa Indonesia dan tidak membatasi maknanya hanya pada cahaya.
- source_word: ἐπὶ πλείονας ἡμέρας
  choice: selama berhari-hari
  rationale: Ungkapan ini menunjukkan rentang waktu yang panjang. ‘Selama berhari-hari’ merupakan padanan Indonesia yang alami dan mempertahankan kesan berlarut-larut.
- source_word: χειμῶνός
  choice: badai
  rationale: Dalam konteks pelayaran ini, kata tersebut menunjuk pada cuaca berbadai, bukan musim dingin.
- source_word: οὐκ ὀλίγου
  choice: yang tidak ringan
  rationale: Padanan ini mempertahankan litotes Yunani (‘tidak kecil/tidak sedikit’) sambil memakai ungkapan Indonesia yang dapat dipahami sebagai badai yang berat atau hebat.
- source_word: ἐπικειμένου
  choice: terus menerpa kami
  rationale: Partisip ini menggambarkan badai yang terus menimpa atau menekan mereka. ‘Terus menerpa kami’ menyampaikan tekanan yang berlangsung dan terdengar alami untuk badai.
- source_word: λοιπὸν
  choice: akhirnya
  rationale: Di sini kata tersebut menandai tahap akhir yang timbul dari keadaan yang berkepanjangan. ‘Akhirnya’ menyampaikan peralihan akibat tersebut secara alami.
- source_word: περιῃρεῖτο
  choice: berangsur-angsur lenyap
  rationale: Bentuk imperfek pasif menggambarkan proses hilangnya harapan yang sedang berlangsung, bukan satu kejadian sesaat.
- source_word: ἐλπὶς πᾶσα
  choice: segala harapan
  rationale: Padanan ini mempertahankan cakupan menyeluruh dari frasa Yunani dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: τοῦ σῴζεσθαι ἡμᾶς
  choice: bahwa kami akan diselamatkan
  rationale: Infinitif berartikel menyatakan isi harapan, sedangkan bentuk pasif dipertahankan. Konteks menunjukkan penyelamatan jasmani dari badai dan kematian di laut.
theological_decisions:
- issue: Makna σῴζεσθαι dalam kisah pelayaran
  choice: penyelamatan jasmani dari bahaya di laut, diterjemahkan ‘akan diselamatkan’
  alternative: akan selamat; akan diluputkan
  rationale: Konteks Kisah Para Rasul 27 membicarakan badai, karamnya kapal, dan kelangsungan hidup. Karena itu, kata ini menunjuk pada penyelamatan jasmani, bukan secara khusus pada keselamatan rohani. Bentuk ‘diselamatkan’ mempertahankan bentuk pasif dan kesinambungan leksikal, sementara catatan kaki menjelaskan maksud kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Litotes ‘tidak ringan’ dipertahankan, sedangkan aspek berkelanjutan pada badai dan hilangnya harapan dinyatakan dengan ‘terus’ dan ‘berangsur-angsur’.
