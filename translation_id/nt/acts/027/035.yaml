  text: ⸀εἴπας δὲ ταῦτα καὶ λαβὼν ἄρτον εὐχαρίστησεν τῷ θεῷ ἐνώπιον πάντων καὶ κλάσας ἤρξατο ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/035.yaml
  text: And after saying these things and taking bread[a], he gave thanks to God in the presence of all, and after breaking it, he began to eat.
translation:
  language: id
  text: Setelah mengatakan hal-hal itu, ia mengambil roti, mengucap syukur kepada Allah di hadapan semua orang,[a] lalu memecahkannya dan mulai makan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: di depan semua orang.'
    reason: Alternatif leksikal bagi ἐνώπιον πάντων; keduanya menyatakan bahwa tindakan itu berlangsung secara terbuka dalam pandangan semua orang.
lexical_decisions:
- source_word: εἴπας δὲ ταῦτα
  choice: Sesudah mengatakan hal-hal itu
  rationale: Partisip aoristus menunjukkan tindakan yang mendahului tindakan utama. “Sesudah mengatakan” menyampaikan urutan itu secara alami; δέ berfungsi sebagai penghubung naratif ringan dan tidak perlu diterjemahkan tersendiri dalam susunan bahasa Indonesia ini.
- source_word: λαβὼν ἄρτον
  choice: ia mengambil roti
  rationale: ἄρτον tanpa artikel tidak memastikan apakah yang dimaksud satu ketul utuh atau sejumlah roti. “Mengambil roti” mempertahankan ketidakpastian itu dan terdengar wajar.
- source_word: εὐχαρίστησεν τῷ θεῷ
  choice: mengucap syukur kepada Allah
  rationale: Ungkapan ini menyampaikan arti lazim εὐχαριστέω dan mempertahankan penerima ucapan syukur yang dinyatakan secara eksplisit.
- source_word: ἐνώπιον πάντων
  choice: di hadapan semua orang
  rationale: Frasa ini menandakan bahwa tindakan tersebut dilakukan secara terbuka dalam kehadiran atau pandangan semua orang. “Di hadapan” sesuai dengan ragam narasi yang bermartabat.
- source_word: κλάσας
  choice: lalu memecah-mecahkan roti itu
  rationale: Partisip aoristus menyatakan tindakan sebelum ia mulai makan. Objek “roti itu” dibuat eksplisit demi kejelasan bahasa Indonesia tanpa menambahkan rujukan baru.
- source_word: ἤρξατο ἐσθίειν
  choice: mulai makan
  rationale: Konstruksi ἄρχομαι dengan infinitif menyatakan permulaan tindakan; “mulai makan” mempertahankan aspek ingresifnya secara ringkas dan alami.
theological_decisions:
- issue: Kemungkinan gema Perjamuan Tuhan dalam rangkaian mengambil roti, mengucap syukur, memecah-mecahkan, dan makan
  choice: Tindakan-tindakan itu diterjemahkan sebagai narasi makan biasa tanpa penafsiran sakramental eksplisit.
  alternative: Menggunakan ungkapan liturgis tradisional yang lebih kuat mengisyaratkan Perjamuan Tuhan.
  rationale: Rangkaian katanya dapat mengingatkan pembaca pada adegan Perjamuan Tuhan, tetapi ayat ini sendiri menggambarkan Paulus makan di kapal dan tidak secara eksplisit menyebut peristiwa itu sebagai perjamuan sakramental. Terjemahan mempertahankan kemungkinan gema tersebut tanpa menetapkan kesimpulan doktrinal.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam naratif yang jelas dan bermartabat. Susunan partisip Yunani diubah menjadi rangkaian verba yang alami dalam bahasa Indonesia, sambil mempertahankan urutan tindakan dan tanpa mempertegas nuansa sakramental.
