  text: τῶν δὲ στρατιωτῶν βουλὴ ἐγένετο ἵνα τοὺς δεσμώτας ἀποκτείνωσιν, μή τις ἐκκολυμβήσας διαφύγῃ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/042.yaml
  text: The soldiers’ plan was to kill the prisoners, so that no one might swim away and escape.
translation:
  language: id
  text: Para prajurit berencana membunuh para tahanan supaya jangan ada yang berenang menjauh dan melarikan diri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλὴ ἐγένετο
  choice: berencana
  rationale: Ungkapan idiomatis ini menyatakan bahwa para prajurit menetapkan atau mempunyai rencana; bentuk verbal alami dalam bahasa Indonesia menyampaikan maknanya dengan jelas.
- source_word: τοὺς δεσμώτας
  choice: para tahanan
  rationale: Merujuk kepada orang-orang yang berada dalam penahanan; 'tahanan' lebih alami dan tepat dalam konteks pengawalan militer daripada istilah yang menyiratkan putusan pidana tertentu.
- source_word: ἐκκολυμβήσας
  choice: berenang menjauh
  rationale: Prefiks ἐκ- memberi nuansa berenang keluar atau menjauh dari kapal/pantai tempat mereka terdampar.
- source_word: διαφύγῃ
  choice: melarikan diri
  rationale: Menyampaikan arti berhasil lolos dari penjagaan, bukan sekadar bergerak pergi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Konjungsi δέ tidak diterjemahkan secara mekanis karena di sini terutama menandai kelanjutan/kontras wacana. Frasa μή τις dipertahankan sebagai tujuan pencegahan dengan 'supaya jangan ada yang', tanpa mengubahnya menjadi kepastian hasil.
