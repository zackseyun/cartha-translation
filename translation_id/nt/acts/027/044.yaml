  text: and the rest[a], some on planks and some on pieces from the ship. And so it happened that all were brought safely to land.
translation:
  language: id
  text: dan yang lainnya, ada yang di atas papan-papan dan ada yang di atas benda-benda dari kapal itu. Dengan demikian, semua orang tiba dengan selamat ke darat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “semua orang diselamatkan ke darat” atau “semua orang lolos dengan selamat ke pantai.” Kata kerja Yunani di sini mengacu pada keselamatan jasmani dari kapal karam.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς λοιποὺς
  choice: yang lain
  rationale: Menunjuk kepada orang-orang selebihnya yang belum disebut pada ayat sebelumnya; bentuk ini alami dalam bahasa Indonesia.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: sebagian ... dan sebagian lagi
  rationale: Mencerminkan pembagian dua kelompok dalam konstruksi korelatif Yunani secara wajar.
- source_word: ἐπὶ σανίσιν
  choice: dengan berpegangan pada papan-papan
  rationale: σανίς berarti papan; tambahan 'berpegangan' menyatakan hubungan yang wajar dalam konteks orang menyelamatkan diri dari kapal karam tanpa mengubah sarana yang disebut.
- source_word: ἐπί τινων τῶν ἀπὸ τοῦ πλοίου
  choice: pada benda-benda dari kapal itu
  rationale: Mempertahankan sifat tak tentu dari τινων dan tidak mempersempitnya secara tidak berdasar menjadi hanya pecahan kapal.
- source_word: οὕτως
  choice: dengan cara demikian
  rationale: Merangkum cara penyelamatan yang baru saja dijelaskan.
- source_word: ἐγένετο πάντας διασωθῆναι
  choice: semua orang berhasil tiba dengan selamat
  rationale: Menyampaikan hasil bahwa mereka seluruhnya luput dari bahaya; 'berhasil' secara alami mengungkapkan konstruksi hasil ἐγένετο dengan infinitif.
- source_word: ἐπὶ τὴν γῆν
  choice: di darat
  rationale: Dalam konteks pelayaran, γῆ berlawanan dengan laut dan secara alami diterjemahkan 'darat'.
theological_decisions:
- issue: Kemungkinan nuansa teologis pada διασωθῆναι
  choice: tiba dengan selamat di darat
  alternative: diselamatkan sampai ke darat / lolos dengan selamat ke pantai
  rationale: Konteksnya adalah keselamatan jasmani dari kapal karam. Pilihan ini tidak memasukkan gagasan keselamatan rohani, tetapi catatan kaki mempertahankan alternatif leksikal verba Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Susunan kalimat mempertahankan alur naratif serta pembagian dua kelompok dalam teks Yunani.
