  source_fidelity: Draf secara keseluruhan menyampaikan hasil seluruh penumpang selamat mencapai darat. Namun, “dengan berpegangan pada” menambahkan tindakan spesifik yang tidak dinyatakan oleh ἐπί; teks Yunani hanya menyebut mereka berada/ditopang di atas papan atau benda-benda dari kapal. “Di darat” juga kurang menandai arah hasil ἐπὶ τὴν γῆν, yang lebih baik dinyatakan “ke darat.”
  naturalness: Susunan revisi “yang lainnya, ada yang ... dan ada yang ...” alami dalam bahasa Indonesia baku dan jelas mempertahankan pembagian dua kelompok. “Dengan demikian” merupakan penghubung naratif yang lebih ringkas dan wajar.
  terminology: “Papan-papan” sesuai untuk σανίσιν. “Benda-benda dari kapal itu” menjaga ketidakpastian τινων dan tidak mengkhususkan benda tersebut sebagai pecahan. “Tiba dengan selamat ke darat” tepat dalam konteks keselamatan fisik dan menghindari nuansa keselamatan rohani yang tidak dimaksudkan konteks ini.
