base_translation:
  language: en
  yaml_path: translation/nt/acts/027/029.yaml
  text: And fearing that we might run aground on rocky places[b][a], they dropped four anchors from the stern and prayed for day to come.
translation:
  language: id
  text: Karena takut kapal itu akan terdampar di tempat-tempat berbatu[a], mereka menurunkan empat jangkar dari buritan dan berdoa agar hari menjadi terang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kapal itu akan terbawa ke tempat-tempat yang terjal” atau “terdampar di antara karang-karang tajam.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “berdoa agar hari menjadi”; maksudnya, mereka merindukan datangnya cahaya pagi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβούμενοί
  choice: Karena takut
  rationale: Partisip ini menyatakan keadaan sekaligus alasan bagi tindakan berikutnya; bentuk kausal ini alami dalam narasi Indonesia.
- source_word: μή που κατὰ τραχεῖς τόπους ἐκπέσωμεν
  choice: kapal itu akan terdampar di tempat-tempat berbatu
  rationale: Dalam konteks pelayaran, frasa ini menyatakan kekhawatiran bahwa kapal akan terbawa atau kandas pada kawasan pantai atau karang yang kasar dan berbahaya. Kata 'kapal itu' ditambahkan secara implisit agar acuannya jelas dalam bahasa Indonesia.
- source_word: ἐκπέσωμεν
  choice: akan terdampar
  rationale: Dalam konteks maritim, verba ini merujuk pada kapal yang terbawa hingga kandas atau menabrak daratan, karang, atau gosong.
- source_word: ἐκ πρύμνης
  choice: dari buritan
  rationale: '''Buritan'' merupakan istilah Indonesia yang tepat dan lazim untuk bagian belakang kapal.'
- source_word: ῥίψαντες ἀγκύρας τέσσαρας
  choice: mereka menurunkan empat jangkar
  rationale: Ungkapan ini menyampaikan tindakan melempar atau menjatuhkan jangkar dengan idiom pelayaran Indonesia yang alami; partisip aoris menunjukkan tindakan yang mendahului doa.
- source_word: ηὔχοντο
  choice: berdoa
  rationale: Dalam konteks ini εὔχομαι paling wajar dipahami sebagai berdoa, sambil tetap mengakui bahwa kata tersebut dapat pula menyatakan harapan atau kerinduan.
- source_word: ἡμέραν γενέσθαι
  choice: agar hari segera terang
  rationale: Frasa infinitif ini secara harfiah berarti 'agar hari menjadi/terjadi'; terjemahan ini secara alami menunjuk pada tibanya cahaya pagi. 'Segera' mengungkapkan kerinduan mendesak dalam konteks, bukan unsur leksikal tersendiri.
