  text: Ἄχρι δὲ οὗ ⸂ἡμέρα ἤμελλεν⸃ γίνεσθαι παρεκάλει ὁ Παῦλος ἅπαντας μεταλαβεῖν τροφῆς λέγων· Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν προσδοκῶντες ἄσιτοι διατελεῖτε, μηθὲν προσλαβόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/033.yaml
  text: Until the day was about to dawn[a], Paul kept urging them all to take some food, saying, “Today is the fourteenth day that you have continued in suspense without eating, having taken nothing.”
translation:
  language: id
  text: Sampai fajar hampir menyingsing, Paulus terus mendesak mereka semua untuk makan. Katanya, “Hari ini genap empat belas hari kalian terus menanti dengan cemas[a] tanpa makan dan tidak menyantap apa pun.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menanti”; kata Yunani ini dapat berarti menanti atau mengharapkan. Dalam konteks badai ini, penantian tersebut kemungkinan disertai kecemasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄχρι δὲ οὗ
  choice: Sampai
  rationale: Menandai batas waktu berlangsungnya desakan Paulus dan mempertahankan daya temporal frasa Yunani.
- source_word: ἡμέρα ἤμελλεν γίνεσθαι
  choice: hari hampir menyingsing
  rationale: Ungkapan harfiah ‘hari akan segera menjadi’ secara idiomatis menunjuk pada datangnya fajar.
- source_word: παρεκάλει
  choice: terus mendesak
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung atau berulang; ‘mendesak’ sesuai dengan kuatnya ajakan Paulus dalam konteks ini.
- source_word: ἅπαντας
  choice: mereka semua
  rationale: Menunjuk secara menyeluruh kepada semua orang yang berada di kapal.
- source_word: μεταλαβεῖν τροφῆς
  choice: untuk makan
  rationale: Mengungkapkan tindakan mengambil makanan secara alami dalam bahasa Indonesia tanpa menambahkan nuansa ritual.
- source_word: Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν
  choice: Hari ini genap empat belas hari
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penekanan bahwa hari itu merupakan hari keempat belas.
- source_word: προσδοκῶντες
  choice: menanti dengan cemas
  rationale: Partisip ini berarti menanti atau mengharapkan; konteks badai mendukung nuansa kecemasan, tetapi alternatif yang lebih netral dicatat dalam catatan kaki.
- source_word: ἄσιτοι διατελεῖτε
  choice: kalian terus ... tanpa makan
  rationale: Mempertahankan gagasan keadaan tidak makan yang berlangsung hingga saat Paulus berbicara, tanpa menyiratkan puasa keagamaan yang disengaja.
- source_word: μηθὲν προσλαβόμενοι
  choice: tidak menyantap apa pun
  rationale: Mempertahankan penegasan tambahan dalam teks Yunani bahwa mereka tidak mengambil makanan apa pun, meskipun ada pengulangan makna dengan frasa sebelumnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Pengulangan ‘tanpa makan dan tidak menyantap apa pun’ dipertahankan karena mencerminkan penegasan dalam teks Yunani. Penanda catatan kaki ditempatkan pada terjemahan προσδοκῶντες, yaitu unsur yang memiliki alternatif leksikal.
