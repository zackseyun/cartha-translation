  yaml_path: translation/nt/acts/027/008.yaml
  text: And with difficulty coasting along it[a], we came to a certain place called Fair Havens, near which was a city named Lasea.
translation:
  language: id
  text: Dengan susah payah kami berlayar menyusuri pantai pulau itu[a] dan tiba di suatu tempat yang disebut Pelabuhan Indah. Di dekatnya terdapat sebuah kota bernama Lasea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kami dengan susah payah berlayar di sepanjang pantainya dan tiba …” Kata Yunani παραλεγόμενοι merupakan istilah pelayaran yang berarti bergerak menyusuri garis pantai.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις
  choice: dengan susah payah
  rationale: Mengungkapkan bahwa perjalanan itu berhasil ditempuh hanya dengan kesulitan besar dan mempertahankan tekanan naratif pada pelayaran yang berat.
- source_word: τε
  choice: dan
  rationale: Menghubungkan tindakan ini dengan alur sebelumnya secara wajar dalam narasi bahasa Indonesia.
- source_word: παραλεγόμενοι
  choice: berlayar menyusuri pantai
  rationale: Dalam konteks pelayaran, verba ini menunjuk pada gerakan kapal di sepanjang garis pantai; ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: αὐτὴν
  choice: pantai pulau itu
  rationale: Pronomina ini merujuk pada Kreta dalam konteks sebelumnya. Penyebutan eksplisit pantai pulau menghindari pronomina Indonesia yang rancu sekaligus sesuai dengan makna nautis verba.
- source_word: ἤλθομεν
  choice: tiba
  rationale: Secara alami menyatakan tercapainya tujuan perjalanan dalam konteks pelayaran.
- source_word: εἰς τόπον τινά
  choice: di suatu tempat
  rationale: Mempertahankan sifat tak tentu dari τινά dengan bentuk Indonesia yang alami.
- source_word: καλούμενον
  choice: yang disebut
  rationale: Padanan langsung dan lazim untuk memperkenalkan nama tempat.
- source_word: Καλοὺς Λιμένας
  choice: Pelabuhan Indah
  rationale: Nama Yunani ini bermakna harfiah 'pelabuhan-pelabuhan yang indah/baik'. Bentuk Indonesia menerjemahkan nama tempat secara transparan dan wajar; bentuk tunggal kolektif terdengar alami sebagai toponim.
- source_word: ᾧ ἐγγὺς ἦν πόλις Λασαία
  choice: Di dekatnya terdapat sebuah kota bernama Lasea
  rationale: Menjaga hubungan kedekatan dengan tempat yang baru disebut serta mempertahankan πόλις tanpa artikel sebagai 'sebuah kota'.
