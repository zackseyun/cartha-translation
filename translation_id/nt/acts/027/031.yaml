id: ACT.27.31
reference: Acts 27:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν ὁ Παῦλος τῷ ἑκατοντάρχῃ καὶ τοῖς στρατιώταις· Ἐὰν μὴ οὗτοι μείνωσιν ἐν τῷ πλοίῳ, ὑμεῖς σωθῆναι οὐ δύνασθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/031.yaml
  text: Paul said to the centurion and the soldiers[a], “Unless these men remain in the ship, you cannot be saved.”
translation:
  language: id
  text: Paulus berkata kepada perwira dan para prajurit, “Jika orang-orang ini tidak tetap berada di kapal, kalian tidak dapat diselamatkan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “selamat.” Kata Yunani memakai verba “menyelamatkan”; di sini maksudnya adalah luput dari kematian dalam bahaya kapal karam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: perwira
  rationale: Dalam konteks militer Romawi, kata ini menunjuk kepada seorang centurion. “Perwira” merupakan padanan Indonesia yang alami dan cukup jelas; sebutan pangkat khusus “centurion” kurang lazim bagi pembaca umum.
- source_word: οὗτοι
  choice: orang-orang ini
  rationale: Kata tunjuk ini merujuk kepada para awak kapal yang hendak meninggalkan kapal. Penambahan “orang-orang” membuat acuannya jelas dalam bahasa Indonesia tanpa mengubah makna.
- source_word: μείνωσιν
  choice: tetap berada
  rationale: Ungkapan ini menyampaikan makna bertahan atau tetap tinggal di suatu tempat dan terdengar alami dalam syarat yang dinyatakan Paulus.
- source_word: πλοίῳ
  choice: kapal
  rationale: πλοῖον di sini adalah kapal laut dalam kisah pelayaran, sehingga “kapal” lebih tepat daripada “perahu”.
- source_word: σωθῆναι
  choice: diselamatkan
  rationale: Bentuk pasif dari σῴζω dipertahankan dengan padanan luas “diselamatkan”; konteks karamnya kapal menunjukkan bahwa yang dimaksud ialah keselamatan jasmani.
- source_word: οὐ δύνασθε
  choice: kalian tidak dapat
  rationale: Padanan langsung dan alami untuk penyangkalan kemampuan. “Kalian” membedakan sapaan jamak kepada perwira dan para prajurit dari orang-orang yang disebut sebelumnya.
theological_decisions:
- issue: Apakah σωθῆναι harus diterjemahkan dengan istilah yang secara eksplisit hanya menunjuk pada keselamatan jasmani.
  choice: diselamatkan
  alternative: selamat; diselamatkan dari bahaya
  rationale: Konteks jelas berbicara tentang bertahan hidup dari bahaya kapal karam, tetapi kata Yunani memakai verba umum untuk menyelamatkan. “Diselamatkan” mempertahankan keluasan leksikal sumber tanpa menjadikan ayat ini pernyataan tentang keselamatan kekal; catatan kaki memperjelas konteks jasmaninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Perwira” dipilih agar mudah dipahami pembaca umum, sedangkan “kalian” menyatakan orang kedua jamak secara jelas. Penanda catatan kaki ditempatkan tepat sesudah ungkapan yang dijelaskan.
