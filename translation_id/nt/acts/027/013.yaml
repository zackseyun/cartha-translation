base_translation:
  language: en
  yaml_path: translation/nt/acts/027/013.yaml
  text: And when a south wind began to blow gently[a], thinking that they had obtained their purpose, they weighed anchor and sailed along Crete[c][b], close inshore.
translation:
  language: id
  text: Ketika angin selatan mulai bertiup sepoi-sepoi, mereka mengira bahwa mereka telah mencapai tujuan mereka[a]. Mereka mengangkat jangkar[b] dan berlayar menyusuri Kreta, lebih dekat ke pantai[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka mengira telah memperoleh rencana mereka.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “setelah mengangkat”; dalam konteks pelayaran, yang diangkat adalah jangkar.
    reason: lexical_alternative
  - marker: c
    text: Atau, “berlayar menyusuri pantai Kreta dengan lebih dekat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποπνεύσαντος
  choice: mulai bertiup sepoi-sepoi
  rationale: Kata kerja ὑποπνέω menggambarkan angin yang bertiup lembut; ungkapan ini juga menyampaikan munculnya tiupan angin dalam konteks.
- source_word: νότου
  choice: angin selatan
  rationale: νότος menunjuk pada angin yang bertiup dari selatan.
- source_word: δόξαντες
  choice: mereka mengira
  rationale: Di sini δοκέω menyatakan penilaian subjektif para pelaut, bukan kepastian.
- source_word: τῆς προθέσεως κεκρατηκέναι
  choice: bahwa rencana mereka telah berhasil
  rationale: Ungkapan ini berarti mereka menyangka telah memperoleh atau mengamankan apa yang mereka rencanakan. Bentuk Indonesia ini alami tanpa mengubah sangkaan mereka menjadi fakta.
- source_word: ἄραντες
  choice: mereka mengangkat jangkar
  rationale: Walaupun objeknya tidak dinyatakan dalam bahasa Yunani, αἴρω dalam konteks pelayaran merujuk pada pengangkatan jangkar untuk berangkat.
- source_word: ἆσσον
  choice: dekat pantai
  rationale: Adverbia komparatif ini berarti lebih dekat; dalam konteks menyusuri pulau, yang dimaksud ialah berlayar dekat garis pantai.
- source_word: παρελέγοντο τὴν Κρήτην
  choice: berlayar menyusuri Kreta
  rationale: παραλέγομαι adalah istilah pelayaran untuk bergerak menyusuri pesisir; objek Yunani secara harfiah ialah Kreta.
