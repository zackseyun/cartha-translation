  naturalness: Bahasa Indonesia draft pada umumnya baku dan lancar. “Maka,” setelah anak kalimat pembuka tidak diperlukan dan membuat alur sedikit kaku; “lalu” cukup alami.
  terminology: “Angin selatan,” “mengangkat jangkar,” dan “berlayar menyusuri Kreta” tepat dalam register naratif-pelayaran. “Rencana mereka telah berhasil” dapat dipahami, tetapi “telah mencapai tujuan mereka” lebih langsung mencerminkan idiom Yunani tentang memperoleh/meraih maksud mereka.
  issues:
