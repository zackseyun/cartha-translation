  to: Ketika angin selatan mulai bertiup sepoi-sepoi, mereka mengira bahwa mereka telah mencapai tujuan mereka[a]. Mereka mengangkat jangkar[b] dan berlayar menyusuri Kreta, lebih dekat ke pantai[c].
