  text: Ὡς δὲ τεσσαρεσκαιδεκάτη νὺξ ἐγένετο διαφερομένων ἡμῶν ἐν τῷ Ἀδρίᾳ, κατὰ μέσον τῆς νυκτὸς ὑπενόουν οἱ ναῦται προσάγειν τινὰ αὐτοῖς χώραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/027.yaml
  text: When the fourteenth night had come[a], as we were being driven along in the Adriatic Sea[b], about midnight the sailors began to suspect that some land was drawing near to them.
translation:
  language: id
  text: Ketika malam yang keempat belas tiba, sementara kami terus terombang-ambing di Laut Adria[a], kira-kira tengah malam para pelaut mulai menduga bahwa suatu daratan sedang mendekat kepada mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah kuno “Adria” dapat merujuk secara luas pada perairan Laut Tengah bagian tengah di kawasan ini, bukan hanya pada Laut Adriatik modern.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “para pelaut menduga bahwa suatu daratan mendekat kepada mereka.” Bahasa Yunani menggambarkan daratan itu sebagai yang mendekat kepada mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσαρεσκαιδεκάτη νὺξ ἐγένετο
  choice: malam yang keempat belas tiba
  rationale: Ungkapan waktu ini menyatakan tibanya malam keempat belas dalam rangkaian perjalanan; bentuk Indonesia ini alami dan mempertahankan daya temporal ἐγένετο.
- source_word: διαφερομένων ἡμῶν
  choice: sementara kami terus terombang-ambing
  rationale: Partisipel pasif kini menunjukkan gerak yang berlangsung dan tidak berada di bawah kendali mereka. Dalam konteks badai, 'terombang-ambing' menyampaikan gerak kapal yang dibawa angin dan gelombang.
- source_word: ἐν τῷ Ἀδρίᾳ
  choice: di Laut Adria
  rationale: Nama kuno Adria dipertahankan agar tidak disamakan secara terlalu sempit dengan Laut Adriatik modern; catatan kaki menjelaskan cakupan geografisnya.
- source_word: κατὰ μέσον τῆς νυκτός
  choice: kira-kira tengah malam
  rationale: Mempertahankan nuansa perkiraan dalam κατά dan menyajikannya secara ringkas serta wajar dalam bahasa Indonesia.
- source_word: ὑπενόουν
  choice: mulai menduga
  rationale: Imperfek dapat menyatakan proses atau awal timbulnya dugaan, sedangkan 'menduga' mempertahankan sifat kesimpulan yang belum pasti.
- source_word: οἱ ναῦται
  choice: para pelaut
  rationale: Padanan modern yang jelas dan lazim untuk awak yang menangani pelayaran kapal.
- source_word: προσάγειν τινὰ αὐτοῖς χώραν
  choice: bahwa suatu daratan sedang mendekat kepada mereka
  rationale: Mempertahankan konstruksi dan perspektif Yunani, yang menggambarkan daratan sebagai mendekat kepada para pelaut, serta τινά sebagai penanda ketidakpastian identitas daratan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Nama geografis kuno 'Adria' dipertahankan untuk menghindari penyempitan geografis. Susunan yang tidak biasa mengenai daratan yang 'mendekat' sengaja dipertahankan dalam teks untuk mencerminkan perspektif sumber, lalu dijelaskan dalam catatan.
