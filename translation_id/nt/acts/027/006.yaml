id: ACT.27.6
reference: Acts 27:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κἀκεῖ εὑρὼν ὁ ⸀ἑκατοντάρχης πλοῖον Ἀλεξανδρῖνον πλέον εἰς τὴν Ἰταλίαν ἐνεβίβασεν ἡμᾶς εἰς αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/006.yaml
  text: There the centurion found an Alexandrian ship sailing for Italy[a], and he put us on board it.
translation:
  language: id
  text: Di sana perwira itu menemukan sebuah kapal dari Aleksandria yang sedang berlayar menuju Italia, lalu ia membawa kami naik ke kapal itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖ
  choice: Di sana
  rationale: Bentuk ini berarti “dan di sana” atau “di sana juga.” Dalam narasi bahasa Indonesia, hubungan dengan kalimat sebelumnya sudah mengalir tanpa harus menyatakan καί secara terpisah.
- source_word: εὑρὼν
  choice: menemukan
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului tindakan utama. Susunan verba berurutan lebih alami dalam bahasa Indonesia.
- source_word: ἑκατοντάρχης
  choice: perwira
  rationale: Istilah ini menunjuk perwira Romawi yang secara tradisional disebut senturion. “Perwira” jelas dan alami bagi pembaca umum dalam konteks yang telah memperkenalkan tokoh tersebut.
- source_word: πλοῖον Ἀλεξανδρῖνον
  choice: sebuah kapal dari Aleksandria
  rationale: Adjektiva Ἀλεξανδρῖνον mengaitkan kapal itu dengan Aleksandria, mungkin berdasarkan asal atau registrasinya. “Dari Aleksandria” mempertahankan hubungan geografis tanpa menentukan lebih jauh.
- source_word: πλέον εἰς τὴν Ἰταλίαν
  choice: yang sedang berlayar menuju Italia
  rationale: Partisip kini πλέον dengan εἰς dan tujuan menunjukkan pelayaran atau arah tujuan kapal. Terjemahan ini alami dan mempertahankan aspek tindakan yang sedang berlangsung.
- source_word: ἐνεβίβασεν ἡμᾶς εἰς αὐτό
  choice: ia membawa kami naik ke kapal itu
  rationale: Verba kausatif ini berarti membuat atau membawa seseorang naik ke kapal. Rumusan ini jelas, alami, dan mempertahankan peran aktif perwira tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. “Kapal dari Aleksandria” lebih mudah dipahami daripada bentuk adjektival “kapal Aleksandria,” dan pengulangan “kapal itu” menghindari rujukan pronominal yang kaku.
