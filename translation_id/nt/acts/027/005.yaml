id: ACT.27.5
reference: Acts 27:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τό τε πέλαγος τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν διαπλεύσαντες κατήλθομεν εἰς Μύρα τῆς Λυκίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/005.yaml
  text: After sailing across the open sea along Cilicia and Pamphylia[b][a], we came down to Myra in Lycia.
translation:
  language: id
  text: Setelah berlayar melintasi laut lepas di sepanjang Kilikia dan Pamfilia[a], kami tiba di Mira di wilayah Likia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di lepas pantai Kilikia dan Pamfilia.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kami turun ke Mira di Likia.” Dalam konteks perjalanan, kata Yunani ini dapat berarti tiba di suatu tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέλαγος
  choice: laut lepas
  rationale: Istilah ini menunjuk pada laut terbuka, bukan sekadar laut secara umum; 'laut lepas' mempertahankan kekhususan maritimnya dalam bahasa Indonesia yang alami.
- source_word: τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν
  choice: di sepanjang Kilikia dan Pamfilia
  rationale: Kata κατά dengan akusatif dalam ungkapan geografis ini menggambarkan pelayaran menyusuri atau di lepas pantai kedua wilayah tersebut.
- source_word: διαπλεύσαντες
  choice: setelah berlayar melintasi
  rationale: Partisip aoris ini menyatakan perjalanan yang selesai sebelum tindakan verba utama; 'setelah' memperjelas urutan waktunya.
- source_word: κατήλθομεν
  choice: kami tiba
  rationale: Dalam kisah perjalanan, κατέρχομαι dapat berfungsi sebagai verba kedatangan. 'Tiba' alami dalam bahasa Indonesia, sedangkan arti harfiahnya, 'turun', dicatat dalam catatan kaki.
- source_word: Μύρα τῆς Λυκίας
  choice: Mira di wilayah Likia
  rationale: Genitif tersebut menunjukkan bahwa Mira terletak di Likia; penambahan 'wilayah' memperjelas bahwa Likia adalah nama kawasan.
- source_word: τε
  choice: tidak dinyatakan secara tersendiri
  rationale: Daya penghubung ringan τε sudah terserap secara alami dalam kesinambungan narasi Indonesia.
theological_decisions: []
