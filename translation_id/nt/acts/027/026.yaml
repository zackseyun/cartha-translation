  yaml_path: translation/nt/acts/027/026.yaml
  text: But we must run aground on some island[a].
translation:
  language: id
  text: Namun, kita harus terdampar di suatu pulau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terbawa hingga kandas di suatu pulau.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δέ
  choice: Namun
  rationale: Partikel ini menandai peralihan dengan kontras ringan terhadap perkataan sebelumnya; “Namun” alami dan mempertahankan hubungan wacananya.
- source_word: εἰς
  choice: di
  rationale: Bersama ἐκπεσεῖν dalam konteks pelayaran, arah menuju pulau secara idiomatis sudah tercakup dalam ungkapan “terdampar di,” bukan diterjemahkan secara harfiah sebagai preposisi tersendiri.
- source_word: νῆσον
  choice: pulau
  rationale: Kata benda ini secara langsung berarti pulau.
- source_word: τινα
  choice: suatu
  rationale: Pronomina tak tentu ini menunjukkan pulau yang tidak disebutkan secara khusus; “suatu” mempertahankan ketidakpastian tersebut dalam bahasa Indonesia yang wajar.
- source_word: δεῖ
  choice: harus
  rationale: Kata ini menyatakan keharusan atau keniscayaan; “harus” ringkas dan mempertahankan daya ungkapnya.
- source_word: ἡμᾶς
  choice: kita
  rationale: Bentuk ini adalah orang pertama jamak inklusif dalam konteks Paulus berbicara kepada orang-orang yang bersamanya; “kita” merupakan subjek alami bagi konstruksi bahasa Indonesia.
- source_word: ἐκπεσεῖν
  choice: terdampar
  rationale: Dalam pemakaian bahari, kata ini dapat menggambarkan kapal yang terbawa hingga kandas atau terdampar. “Terdampar” alami dalam bahasa Indonesia dan tidak menetapkan secara berlebihan apakah kapal pasti kandas pada dasar laut atau terdorong sampai ke pantai.
