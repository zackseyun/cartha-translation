  text: περιπεσόντες δὲ εἰς τόπον διθάλασσον ⸀ἐπέκειλαν τὴν ναῦν, καὶ ἡ μὲν πρῷρα ἐρείσασα ἔμεινεν ἀσάλευτος, ἡ δὲ πρύμνα ἐλύετο ὑπὸ τῆς ⸀βίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/041.yaml
  text: But falling into a place where two seas met[a], they ran the ship aground; and the bow, having stuck fast, remained immovable, but the stern was being broken up by the force.
translation:
  language: id
  text: Namun, ketika mereka tiba di suatu tempat di mana dua laut bertemu[a], mereka mengandaskan kapal itu. Haluan kapal tertancap kuat dan tetap tidak bergeser, sedangkan buritannya terus hancur akibat kekuatan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat di antara dua laut.” Ungkapan Yunani ini jarang digunakan dan dapat merujuk pada sebuah alur, gosong pasir, atau tempat bertemunya dua badan air atau dua arus.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπεσόντες
  choice: ketika kapal itu memasuki
  rationale: Partisip aoris ini menyatakan keadaan saat kapal tiba-tiba berhadapan dengan lokasi tersebut. Penyebutan kapal sebagai subjek tersirat membuat bahasa Indonesia lebih alami tanpa menentukan secara berlebihan apakah kapal menabrak atau sekadar memasuki tempat itu.
- source_word: τόπον διθάλασσον
  choice: tempat pertemuan dua arus laut
  rationale: Ungkapan Yunani yang langka ini berkaitan dengan dua laut atau dua badan/arus air. Pilihan ini jelas dalam konteks pelayaran, sementara catatan kaki mempertahankan kemungkinan arti lain dan tidak memastikan bahwa tempat itu adalah gosong pasir.
- source_word: ἐπέκειλαν τὴν ναῦν
  choice: mereka mengandaskannya
  rationale: ἐπικέλλω merupakan istilah pelayaran untuk membuat kapal kandas atau mendamparkannya. Bentuk pronominal menghindari pengulangan kata 'kapal' dan tetap jelas.
- source_word: πρῷρα
  choice: haluan kapal
  rationale: Istilah Indonesia baku dan lazim untuk bagian depan kapal.
- source_word: ἐρείσασα
  choice: tertancap kuat
  rationale: Menggambarkan haluan yang tertahan atau terbenam kukuh setelah kapal kandas, tanpa menambahkan jenis permukaan tempat haluan itu tertancap.
- source_word: ἔμεινεν ἀσάλευτος
  choice: tidak dapat bergerak
  rationale: Menyampaikan keadaan haluan yang tetap kukuh dan tidak bergeser dengan bahasa Indonesia yang alami.
- source_word: πρύμνα
  choice: buritannya
  rationale: Istilah Indonesia baku untuk bagian belakang kapal; sufiks posesif menjaga kohesi kalimat.
- source_word: ἐλύετο
  choice: mulai hancur
  rationale: Imperfek pasif menggambarkan proses disintegrasi yang sedang berlangsung. 'Mulai hancur' menyampaikan perkembangan proses itu secara wajar.
- source_word: ὑπὸ τῆς βίας
  choice: oleh kuatnya hantaman
  rationale: βία berarti kekuatan atau kedahsyatan. Dalam konteks laut, 'hantaman' menyampaikan daya perusak yang tersirat tanpa secara eksplisit menambahkan 'ombak', yang tidak terdapat dalam teks Yunani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Istilah pelayaran baku 'haluan' dan 'buritan' dipertahankan karena jelas dari konteks. Ambiguitas ungkapan διθάλασσον dijaga melalui catatan kaki, dan sumber kekuatan perusak tidak diperinci sebagai ombak karena teks Yunani hanya menyebut 'kekuatan/ kedahsyatan'.
