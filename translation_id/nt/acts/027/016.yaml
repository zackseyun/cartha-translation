  yaml_path: translation/nt/acts/027/016.yaml
  text: But after running under the shelter of a small island called Cauda[a], we were barely able to secure the ship’s boat.
translation:
  language: id
  text: Namun, setelah kami berlayar ke sisi sebuah pulau kecil bernama Kauda yang terlindung dari angin,[a] kami hanya dengan susah payah berhasil mengamankan perahu kapal itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “setelah kami berlayar di bawah lindungan sebuah pulau kecil bernama Kauda.” Bahasa Yunani memakai istilah pelayaran untuk bergerak ke sisi pulau yang terlindung dari angin.
    reason: lexical_alternative
lexical_decisions:
- source_word: νησίον ... τι
  choice: sebuah pulau kecil
  rationale: νησίον berbentuk diminutif dan secara wajar menunjuk pada pulau kecil; frasa ini alami dan jelas dalam bahasa Indonesia.
- source_word: δέ
  choice: Namun
  rationale: δέ menandai peralihan naratif dengan sedikit kontras, dari terpaan badai menuju perlindungan sementara.
- source_word: ὑποδραμόντες
  choice: setelah berlayar menyusuri sisi teduh
  rationale: Dalam konteks pelayaran, kata ini menggambarkan kapal bergerak di sisi pulau yang terlindung dari angin; ungkapan ini mempertahankan citra bahari tanpa terlalu teknis.
- source_word: καλούμενον Καῦδα
  choice: yang bernama Kauda
  rationale: Terjemahan langsung dan alami untuk ungkapan partisipial yang menyebut nama pulau; Kauda mengikuti bentuk nama dalam teks SBLGNT.
- source_word: ἰσχύσαμεν μόλις
  choice: kami nyaris tidak mampu
  rationale: Gabungan ini menyatakan bahwa tindakan berikut hanya dapat dilakukan dengan kesulitan besar dan hampir tidak berhasil.
- source_word: περικρατεῖς γενέσθαι
  choice: menguasai
  rationale: Frasa ini secara harfiah menyatakan berhasil mendapatkan kendali atau pegangan atas sesuatu. 'Menguasai' mempertahankan nuansa tersebut dan tidak secara berlebihan menetapkan tindakan teknis tertentu.
- source_word: τῆς σκάφης
  choice: sekoci kapal itu
  rationale: σκάφη menunjuk pada perahu kecil yang menyertai kapal, kemungkinan sedang ditarik; 'sekoci kapal' jelas bagi pembaca Indonesia dan membedakannya dari kapal utama.
