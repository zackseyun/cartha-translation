id: ACT.27.1
reference: Acts 27:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐκρίθη τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν, παρεδίδουν τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ σπείρης Σεβαστῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/001.yaml
  text: When it was decided that we should sail for Italy[a], they handed over both Paul and some other prisoners to a centurion named Julius, of the Augustan Cohort.
translation:
  language: id
  text: Setelah diputuskan bahwa kami akan berlayar ke Italia, Paulus dan beberapa tahanan lain diserahkan kepada seorang senturion bernama Yulius dari Kohor Augusta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kohor Kekaisaran”; mungkin juga “kohor dari Sebaste”. Kata Yunani Σεβαστῆς berkaitan dengan gelar Augustus atau kaisar, tetapi satuan militer yang dimaksud tidak dapat dipastikan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκρίθη
  choice: diputuskan
  rationale: Bentuk aoristus pasif ini digunakan secara impersonal untuk suatu keputusan resmi; “diputuskan” mempertahankan nuansa pasif dan administratif secara wajar dalam bahasa Indonesia.
- source_word: τοῦ ἀποπλεῖν ἡμᾶς
  choice: bahwa kami harus berlayar
  rationale: Infinitif artikular ini menyatakan isi keputusan. “Berlayar” mempertahankan kekhususan perjalanan laut, sedangkan “kami” mencerminkan narasi orang pertama.
- source_word: παρεδίδουν
  choice: diserahkan
  rationale: Konstruksi pasif bahasa Indonesia menghasilkan kalimat yang alami sekaligus menyatakan pemindahan resmi atas tahanan; pelaku yang tidak disebut dalam bahasa Yunani tetap tidak ditentukan.
- source_word: τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας
  choice: Paulus dan beberapa tahanan lain
  rationale: “Dan” secara alami menyampaikan pasangan τε...καί dalam bahasa Indonesia, dan “tahanan” merupakan padanan modern yang jelas bagi δεσμώτας.
- source_word: ἑκατοντάρχῃ
  choice: kepada seorang perwira
  rationale: Datif menandai penerima penyerahan. “Seorang” tepat karena tokoh ini baru diperkenalkan; “perwira” lebih mudah dipahami pembaca umum daripada istilah teknis “senturion”.
- source_word: ὀνόματι Ἰουλίῳ
  choice: bernama Yulius
  rationale: Ini merupakan bentuk Indonesia yang alami untuk formula penyebutan nama tersebut.
- source_word: σπείρης Σεβαστῆς
  choice: dari Kohor Augusta
  rationale: “Kohor” mempertahankan istilah satuan militer Romawi, sedangkan “Augusta” mempertahankan sifat nama resmi dan tidak memastikan identifikasi historis yang masih diperdebatkan.
theological_decisions:
- issue: Identitas dan arti σπείρης Σεβαστῆς sebagai sebutan satuan militer yang diperdebatkan
  choice: Kohor Augusta
  alternative: Kohor Kekaisaran; kohor dari Sebaste
  rationale: Pilihan ini cukup formal untuk mempertahankan sebutan historis tanpa secara diam-diam memastikan apakah yang dimaksud adalah unit kekaisaran tertentu atau kohor yang terkait dengan Sebaste. Ketidakpastian dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan pasif mempertahankan pelaku keputusan dan penyerahan sebagai tidak disebut. Istilah teknis “kohor” dipertahankan karena merupakan nama satuan militer Romawi, dengan ketidakpastian historis dijelaskan melalui catatan kaki.
