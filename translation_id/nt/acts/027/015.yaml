  yaml_path: translation/nt/acts/027/015.yaml
  text: And when the ship was caught and could not face the wind[a], we gave way and were driven along.
translation:
  language: id
  text: Ketika kapal itu terseret dan tidak sanggup menghadapi angin, kami menyerah dan membiarkan kapal itu terbawa angin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναρπασθέντος
  choice: terseret
  rationale: Partisip pasif ini menggambarkan kapal yang dikuasai secara tiba-tiba oleh kekuatan dari luar. Dalam konteks badai, 'terseret' alami dan tidak mengulang secara penuh gagasan gerak berkelanjutan pada ἐφερόμεθα.
- source_word: πλοίου
  choice: kapal
  rationale: '''Kapal'' adalah padanan Indonesia modern yang wajar dalam konteks pelayaran ini.'
- source_word: μὴ δυναμένου
  choice: tidak sanggup
  rationale: Ungkapan ini menyatakan ketidakmampuan kapal; bentuk verba finit menghasilkan bahasa Indonesia yang alami.
- source_word: ἀντοφθαλμεῖν
  choice: menghadapi
  rationale: Dalam konteks bahari, verba ini berarti mengarahkan atau mempertahankan kapal melawan angin. 'Menghadapi angin' mempertahankan citra sumber tanpa terlalu banyak menafsirkan.
- source_word: ἀνέμῳ
  choice: angin
  rationale: Kata sumber berarti 'angin'; kekuatan badai sudah jelas dari konteks dan tidak perlu ditambahkan ke nomina ini.
- source_word: ἐπιδόντες
  choice: kami membiarkannya terbawa
  rationale: Partisip ini menunjukkan bahwa mereka berhenti melawan dan menyerahkan kapal kepada daya angin. Objek tersirat dibuat eksplisit secara alami dalam bahasa Indonesia.
- source_word: ἐφερόμεθα
  choice: hanyut dibawa angin
  rationale: Imperfek pasif menggambarkan gerak yang terus berlangsung di bawah kekuatan luar. 'Hanyut dibawa angin' jelas dan sesuai dengan konteks badai.
- source_word: δέ
  choice: Ketika
  rationale: Hubungan naratif diterjemahkan bersama konstruksi partisip sebagai klausa waktu yang alami dalam bahasa Indonesia; tidak diperlukan kata sambung tambahan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah bahari teknis dihindari agar ayat mudah dipahami, sementara urutan tindakan—kapal dikuasai angin, upaya melawan dihentikan, lalu kapal hanyut—tetap terpelihara.
