  text: Then the soldiers cut away the ropes of the skiff and let it fall off[a][b].
translation:
  language: id
  text: Lalu para prajurit memotong tali-tali sekoci itu dan membiarkannya terlepas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hanyut menjauh.” Secara harfiah, kata Yunani ini dapat berarti “jatuh” atau “lepas”; dalam konteks kelautan, sekoci itu dapat dipahami sebagai terlepas dari kapal lalu hanyut menjauh.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Lalu
  rationale: Menandai urutan tindakan berikutnya dalam narasi secara alami dan ringkas.
- source_word: ἀπέκοψαν
  choice: memotong
  rationale: Menyatakan tindakan memutuskan tali; akibat terlepasnya sekoci sudah jelas dari konteks.
- source_word: οἱ στρατιῶται
  choice: para prajurit
  rationale: Padanan Indonesia yang tepat dan lazim bagi subjek jamak ini.
- source_word: τὰ σχοινία τῆς σκάφης
  choice: tali-tali sekoci itu
  rationale: σχοινία adalah tali-tali pengikat, sedangkan σκάφη menunjuk pada perahu kecil yang dibawa kapal; 'sekoci' membedakannya secara alami dari kapal utama.
- source_word: εἴασαν αὐτὴν
  choice: membiarkannya
  rationale: Mempertahankan konstruksi 'membiarkan' dengan pronomina yang merujuk kepada sekoci.
- source_word: ἐκπεσεῖν
  choice: hanyut
  rationale: Dalam konteks kelautan, verba ini dapat menyatakan terlepas lalu terbawa menjauh; 'hanyut' paling alami dalam bahasa Indonesia, sementara makna harfiahnya dicatat dalam catatan kaki.
