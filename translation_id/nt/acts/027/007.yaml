  text: ἐν ἱκαναῖς δὲ ἡμέραις βραδυπλοοῦντες καὶ μόλις γενόμενοι κατὰ τὴν Κνίδον, μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου, ὑπεπλεύσαμεν τὴν Κρήτην κατὰ Σαλμώνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/007.yaml
  text: For many days we were sailing slowly[a], and with difficulty we came opposite Cnidus. Since the wind did not allow us to go farther, we sailed under the lee of Crete[b], off Salmone.
translation:
  language: id
  text: Selama berhari-hari kami berlayar perlahan-lahan, dan dengan susah payah kami sampai di perairan di hadapan Knidus. Karena angin tidak mengizinkan kami maju lebih jauh,[a] kami berlayar menyusuri sisi Pulau Kreta yang terlindung dari angin,[b] di lepas pantai Salmone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “angin tidak mengizinkan kami mendekat.” Konstruksi Yunani ini menjelaskan alasan mereka mengubah arah pelayaran.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kami berlayar di bawah Kreta,” yaitu menyusuri sisi pulau yang terlindung dari angin.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἱκαναῖς δὲ ἡμέραις
  choice: Selama berhari-hari
  rationale: Frasa ἐν dengan datif waktu menunjukkan berlangsungnya pelayaran dalam rentang waktu yang cukup panjang; ungkapan ini alami dalam bahasa Indonesia tanpa menentukan jumlah hari.
- source_word: βραδυπλοοῦντες
  choice: kami berlayar dengan lambat
  rationale: Partisip ini secara khusus menggambarkan pelayaran atau kemajuan kapal yang lambat, dibedakan dari μόλις yang menyatakan kesukaran.
- source_word: μόλις γενόμενοι κατὰ τὴν Κνίδον
  choice: dengan susah payah kami tiba di perairan yang berhadapan dengan Knidus
  rationale: μόλις menyatakan bahwa pencapaian itu sulit, sedangkan κατά dalam konteks pelayaran menunjukkan posisi di depan atau berhadapan dengan tempat tersebut, bukan masuk ke kotanya.
- source_word: μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου
  choice: Karena angin tidak memungkinkan kami maju lebih jauh
  rationale: Konstruksi genitif absolut memberi alasan bagi perubahan rute. προσεάω dapat menunjuk pada pemberian kesempatan untuk mendekat atau bergerak maju; konteks mendukung gagasan bahwa angin menghalangi kelanjutan arah semula.
- source_word: ὑπεπλεύσαμεν τὴν Κρήτην
  choice: kami berlayar menyusuri sisi Pulau Kreta yang terlindung dari angin
  rationale: Dalam pemakaian bahari, ὑποπλέω berarti berlayar di bawah perlindungan daratan, yakni pada sisi pulau yang terlindung dari angin. Terjemahan deskriptif ini lebih mudah dipahami daripada istilah teknis bahari.
- source_word: κατὰ Σαλμώνην
  choice: di lepas pantai Salmone
  rationale: κατά dengan tanjung atau penanda pesisir menunjukkan posisi di dekat atau sejajar dengan tempat itu dalam rute pelayaran.
- source_word: Κνίδον / Κρήτην / Σαλμώνην
  choice: Knidus / Kreta / Salmone
  rationale: Nama-nama geografis memakai bentuk yang sesuai dengan kebiasaan transliterasi dan penggunaan modern dalam bahasa Indonesia.
