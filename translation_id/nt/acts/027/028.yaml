  text: καὶ βολίσαντες εὗρον ὀργυιὰς εἴκοσι, βραχὺ δὲ διαστήσαντες καὶ πάλιν βολίσαντες εὗρον ὀργυιὰς δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/028.yaml
  text: And after taking soundings[a], they found twenty fathoms; then after going a little farther and taking soundings again, they found fifteen fathoms.
translation:
  language: id
  text: Setelah mengukur kedalaman[a], mereka mendapati kedalaman dua puluh depa. Setelah maju sedikit, mereka mengukur lagi dan mendapati kedalaman lima belas depa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “melemparkan batu duga”; maksudnya mengukur kedalaman laut dengan tali yang diberi pemberat.
    reason: lexical_alternative
lexical_decisions:
- source_word: βολίσαντες
  choice: setelah mengukur kedalaman
  rationale: Partisip ini menunjuk pada tindakan mengukur kedalaman laut dengan tali yang diberi pemberat. Ungkapan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: εὗρον
  choice: mereka mendapati kedalamannya
  rationale: Kata kerja ini melaporkan hasil yang diperoleh dari pengukuran; penambahan objek 'kedalamannya' membuat maksudnya jelas tanpa mengubah isi.
- source_word: ὀργυιὰς
  choice: depa
  rationale: ὀργυιά adalah satuan panjang berdasarkan rentangan kedua lengan, kira-kira 1,8 meter, dan digunakan di sini untuk kedalaman laut. 'Depa' merupakan padanan tradisional dan ringkas dalam bahasa Indonesia.
- source_word: εἴκοσι
  choice: dua puluh
  rationale: Padanan langsung untuk bilangan tersebut.
- source_word: βραχὺ
  choice: sedikit
  rationale: Dipakai secara adverbial untuk menunjukkan jarak pendek sebelum pengukuran berikutnya.
- source_word: διαστήσαντες
  choice: sesudah maju
  rationale: Dalam konteks perjalanan kapal, partisip ini berarti bergerak atau melanjutkan perjalanan sejauh tertentu.
- source_word: πάλιν
  choice: lagi
  rationale: Menandai pengulangan tindakan mengukur.
- source_word: δεκαπέντε
  choice: lima belas
  rationale: Padanan langsung untuk bilangan tersebut.
- source_word: καὶ ... δὲ ... καὶ
  choice: Setelah ... Sesudah ... lagi
  rationale: Rangkaian penghubung ini terutama menyatakan urutan naratif, bukan pertentangan kuat; susunan Indonesia dibuat alami sambil mempertahankan tahap-tahap tindakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah 'depa' dipertahankan sebagai satuan panjang yang sesuai dengan ὀργυιά; konteks dan kata 'kedalaman' memperjelas pemakaiannya.
