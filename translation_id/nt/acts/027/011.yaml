  text: ὁ δὲ ἑκατοντάρχης τῷ κυβερνήτῃ καὶ τῷ ναυκλήρῳ ⸂μᾶλλον ἐπείθετο⸃ ἢ τοῖς ⸀ὑπὸ Παύλου λεγομένοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/011.yaml
  text: But the centurion paid more attention to the pilot and the shipowner than to what was being said by Paul[a].
translation:
  language: id
  text: Namun, perwira itu lebih memercayai juru mudi dan pemilik kapal daripada perkataan Paulus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “lebih terbujuk oleh juru mudi dan pemilik kapal daripada oleh apa yang dikatakan Paulus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: perwira
  rationale: Dalam konteks Kisah Para Rasul, istilah ini menunjuk kepada seorang perwira Romawi yang biasanya memimpin sekitar seratus prajurit. 'Perwira' alami dalam bahasa Indonesia; identitas khususnya sudah jelas dari konteks narasi.
- source_word: κυβερνήτῃ
  choice: juru mudi
  rationale: Istilah ini menunjuk kepada orang yang mengemudikan atau mengarahkan pelayaran kapal. 'Juru mudi' mempertahankan perbedaannya dari pemilik kapal.
- source_word: ναυκλήρῳ
  choice: pemilik kapal
  rationale: Dalam konteks ini kata tersebut kemungkinan besar menunjuk kepada pemilik atau pengusaha utama kapal. Terjemahan ini membedakan perannya dari juru mudi.
- source_word: μᾶλλον ἐπείθετο
  choice: lebih memercayai
  rationale: Bentuk ini menyatakan bahwa perwira itu lebih dipengaruhi, diyakinkan, atau menaruh kepercayaan pada pendapat kedua tokoh pelayaran tersebut. 'Lebih memercayai' alami dan mempertahankan daya banding μᾶλλον tanpa menyatakan kepastian batin secara berlebihan.
- source_word: τοῖς ὑπὸ Παύλου λεγομένοις
  choice: perkataan Paulus
  rationale: Konstruksi partisipial berartikel ini mengacu pada hal-hal yang dikatakan Paulus, khususnya nasihat atau peringatannya. 'Perkataan Paulus' ringkas dan alami.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai pertentangan dengan peringatan Paulus pada ayat sebelumnya.
- source_word: ἢ
  choice: daripada
  rationale: Penanda perbandingan yang berpasangan dengan μᾶλλον diterjemahkan secara langsung dengan 'daripada'.
theological_decisions: []
