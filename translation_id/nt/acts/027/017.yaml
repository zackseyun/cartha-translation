base_translation:
  language: en
  yaml_path: translation/nt/acts/027/017.yaml
  text: After hoisting it up[a], they used supporting cables to undergird the ship; and fearing that they might run aground on the Syrtis[c][b], they lowered the sea anchor and so were driven along.
translation:
  language: id
  text: Setelah menaikkan sekoci itu, mereka memakai tali-tali penguat untuk melilitkan tali-tali itu mengelilingi badan kapal.[a] Karena takut akan kandas di Sirtis,[b] mereka menurunkan perlengkapan kapal,[c] dan dengan demikian mereka terus terbawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, tali-tali dililitkan mengelilingi badan kapal untuk memperkuatnya.
    reason: cultural_note
  - marker: b
    text: Sirtis adalah kawasan perairan dangkal dan beting pasir yang berbahaya di lepas pantai Afrika Utara.
    reason: cultural_note
  - marker: c
    text: Atau “tali-temali kapal” atau “jangkar apung.” Kata Yunani yang dipakai berarti “alat/perlengkapan”; benda nautis yang dimaksud di sini tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ἄραντες
  choice: Setelah menaikkan sekoci itu
  rationale: Kata ganti feminin ἣν merujuk kepada sekoci pada ayat sebelumnya, sedangkan partisip aoris ἄραντες menyatakan tindakan yang mendahului tindakan utama. Penyebutan ulang “sekoci” membuat rujukannya jelas dalam bahasa Indonesia.
- source_word: βοηθείαις ἐχρῶντο
  choice: mereka memakai tali-tali penguat
  rationale: βοηθείαις secara harfiah berarti sarana-sarana penolong atau penopang. Dalam konteks pelayaran, yang dimaksud ialah sarana untuk memperkuat badan kapal; “tali-tali penguat” menyampaikan fungsi itu secara jelas tanpa memakai istilah teknis yang asing.
- source_word: ὑποζωννύντες τὸ πλοῖον
  choice: untuk melilit kapal dari bawah
  rationale: Ungkapan teknis ini menggambarkan pemasangan tali mengelilingi atau di bawah badan kapal untuk memperkuatnya. Terjemahan ini mempertahankan gambaran konkret tindakan tersebut.
- source_word: μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν
  choice: akan kandas di Sirtis
  rationale: ἐκπίπτω dalam konteks ini menunjuk pada bahaya kapal terdorong ke daerah dangkal lalu kandas. Nama geografis Σύρτις ditransliterasikan sebagai “Sirtis” dan dijelaskan dalam catatan kaki.
- source_word: χαλάσαντες τὸ σκεῦος
  choice: mereka menurunkan perlengkapan kapal
  rationale: σκεῦος adalah istilah umum untuk alat, perlengkapan, atau perangkat. Karena benda nautis yang dimaksud tidak dapat dipastikan, terjemahan utama mempertahankan keluasan makna teks Yunani.
- source_word: οὕτως ἐφέροντο
  choice: dan dengan demikian mereka terus terbawa angin
  rationale: Bentuk imperfek pasif menggambarkan gerakan berkelanjutan akibat kekuatan dari luar. “Terus terbawa angin” wajar dalam konteks badai dan mempertahankan sifat pasif tindakan itu.
