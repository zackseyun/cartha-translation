  text: τῶν δὲ ναυτῶν ζητούντων φυγεῖν ἐκ τοῦ πλοίου καὶ χαλασάντων τὴν σκάφην εἰς τὴν θάλασσαν προφάσει ὡς ἐκ πρῴρης ⸂ἀγκύρας μελλόντων⸃ ἐκτείνειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/030.yaml
  text: And when the sailors were seeking to escape from the ship and had lowered the skiff into the sea under the pretense of being about to lay out anchors from the bow[b][a],
translation:
  language: id
  text: Ketika para pelaut berusaha melarikan diri dari kapal dan telah menurunkan sekoci[a] ke laut dengan berpura-pura hendak menurunkan jangkar-jangkar dari haluan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perahu kecil”. Kata Yunani skaphē menunjuk pada perahu kecil milik kapal.
    reason: lexical_alternative
  - marker: b
    text: Atau “bagian depan kapal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δὲ ναυτῶν
  choice: Ketika para pelaut
  rationale: Konstruksi genitif absolut dialihkan secara alami menjadi anak kalimat waktu; ναῦται berarti para pelaut atau awak yang mengoperasikan kapal.
- source_word: ζητούντων φυγεῖν
  choice: berusaha melarikan diri
  rationale: ζητέω dengan infinitif di sini menyatakan upaya atau maksud; ungkapan ini jelas menggambarkan usaha meninggalkan kapal.
- source_word: ἐκ τοῦ πλοίου
  choice: dari kapal
  rationale: Padanan Indonesia yang langsung dan alami untuk titik keberangkatan.
- source_word: χαλασάντων τὴν σκάφην
  choice: telah menurunkan sekoci
  rationale: χαλάω berarti menurunkan, sedangkan σκάφη menunjuk perahu kecil milik kapal; 'sekoci' merupakan istilah Indonesia yang ringkas dan lazim.
- source_word: εἰς τὴν θάλασσαν
  choice: ke laut
  rationale: Terjemahan langsung dan idiomatis dalam konteks menurunkan perahu dari kapal.
- source_word: προφάσει ὡς
  choice: dengan berpura-pura
  rationale: πρόφασις menunjukkan alasan lahiriah yang menutupi maksud sebenarnya; frasa Indonesia ini mengungkapkan penipuan itu secara wajar.
- source_word: ἐκ πρῴρης
  choice: dari haluan
  rationale: πρῷρα adalah bagian depan kapal; 'haluan' merupakan istilah bahari Indonesia yang baku.
- source_word: ἀγκύρας μελλόντων ἐκτείνειν
  choice: hendak mengulurkan jangkar-jangkar
  rationale: μέλλω menyatakan niat yang segera dilakukan, dan ἐκτείνω secara harfiah berarti mengulurkan atau membentangkan. Bentuk plural jangkar dipertahankan tanpa menentukan teknik pemasangannya secara lebih khusus.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah bahari 'sekoci' dan 'haluan' dipakai karena ringkas serta lazim, dengan alternatif yang lebih umum dalam catatan kaki. Kalimat diakhiri koma karena ayat ini secara sintaksis berlanjut ke ayat 31.
