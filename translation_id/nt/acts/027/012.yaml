    rationale: πρὸς παραχειμασίαν menyatakan kesesuaian pelabuhan sebagai tempat kapal/rombongan melewati musim dingin. “Ditinggali” cenderung menyiratkan hunian, bukan perlindungan atau tempat berlabuh dalam konteks pelayaran.
  - severity: low
