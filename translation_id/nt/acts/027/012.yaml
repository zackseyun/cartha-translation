    rationale: οἱ πλείονες menunjuk pada bagian terbesar dari kelompok yang sedang dibicarakan. “Sebagian besar dari mereka” mempertahankan rujukan kelompok itu tanpa mengandaikan siapa yang memiliki kewenangan formal.
  - severity: low
    issue: “Dengan harapan bahwa entah bagaimana mereka dapat” melemahkan bentuk pengandaian εἴ πως.
    rationale: Ungkapan Yunani ini menyatakan kemungkinan yang tidak pasti. “Kalau-kalau mereka dapat” mempertahankan nuansa pengandaian dan harapan tersebut secara ringkas.
