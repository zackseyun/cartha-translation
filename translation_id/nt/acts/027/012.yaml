id: ACT.27.12
reference: Acts 27:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀνευθέτου δὲ τοῦ λιμένος ὑπάρχοντος πρὸς παραχειμασίαν οἱ πλείονες ἔθεντο βουλὴν ἀναχθῆναι ⸀ἐκεῖθεν, εἴ πως δύναιντο καταντήσαντες εἰς Φοίνικα παραχειμάσαι, λιμένα τῆς Κρήτης βλέποντα κατὰ λίβα καὶ κατὰ χῶρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/012.yaml
  text: And because the harbor was unsuitable for wintering[a], the majority decided to put out from there[c][b], if somehow they might reach Phoenix and spend the winter there—a harbor of Crete facing southwest and northwest.
translation:
  language: id
  text: Karena pelabuhan itu tidak layak untuk berlabuh selama musim dingin, sebagian besar dari mereka memutuskan untuk berlayar dari sana, kalau-kalau mereka dapat mencapai Feniks[a] dan melewatkan musim dingin di sana—sebuah pelabuhan di Kreta yang menghadap ke barat daya dan barat laut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Feniks adalah nama sebuah pelabuhan di Kreta.
    reason: cultural_note
  - marker: b
    text: Frasa arah pada akhir ayat ini sulit dipastikan. Secara tradisional diterjemahkan “menghadap ke barat daya dan barat laut”; istilah kedua juga dapat dipahami secara lebih khusus sebagai “barat-barat laut.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνευθέτου
  choice: tidak cocok
  rationale: Menyatakan bahwa pelabuhan tersebut tidak sesuai untuk tujuan menetap sepanjang musim dingin; ungkapan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: λιμένος
  choice: pelabuhan
  rationale: Padanan lazim bagi λιμήν dalam konteks pelayaran dan tempat kapal berlindung.
- source_word: πρὸς παραχειμασίαν
  choice: untuk ditinggali selama musim dingin
  rationale: Menjelaskan ketidakcocokan pelabuhan sebagai tempat menetap sepanjang musim dingin, bukan sekadar keadaan cuaca.
- source_word: οἱ πλείονες
  choice: kebanyakan orang
  rationale: Merujuk pada bagian yang lebih besar dari kelompok tanpa menentukan secara eksplisit siapa yang mempunyai hak formal untuk mengambil keputusan.
- source_word: ἔθεντο βουλήν
  choice: memutuskan
  rationale: Ungkapan idiomatis Yunani ini menyampaikan tercapainya suatu keputusan atau rencana bersama.
- source_word: ἀναχθῆναι ἐκεῖθεν
  choice: bertolak dari sana
  rationale: ἀνάγω merupakan istilah pelayaran untuk meninggalkan tempat berlabuh dan mulai berlayar; 'bertolak' ringkas serta idiomatis.
- source_word: εἴ πως δύναιντο
  choice: dengan harapan bahwa entah bagaimana mereka dapat
  rationale: Mempertahankan unsur harapan sekaligus ketidakpastian yang diungkapkan oleh εἴ πως dengan bentuk optatif.
- source_word: καταντήσαντες εἰς Φοίνικα
  choice: mencapai Feniks
  rationale: Mengungkapkan tibanya mereka di tempat tujuan dengan bahasa perjalanan yang alami.
- source_word: Φοίνικα
  choice: Feniks
  rationale: Transliterasi nama tempat Φοῖνιξ yang disesuaikan dengan ejaan Indonesia; catatan membedakannya dari makna lain kata tersebut.
- source_word: παραχειμάσαι
  choice: tinggal di sana selama musim dingin
  rationale: Menyatakan maksud menetap di tempat tersebut sepanjang musim dingin secara alami dan jelas.
- source_word: βλέποντα κατὰ λίβα καὶ κατὰ χῶρον
  choice: menghadap ke barat daya dan barat laut
  rationale: Mengikuti pemahaman geografis tradisional atas kedua istilah arah sambil mempertahankan kesulitan istilah kedua dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, naratif, dan bermartabat. Istilah pelayaran 'bertolak' dipakai karena mudah dipahami dan tepat dalam konteks. Susunan kalimat dibagi menjadi dua agar informasi geografis tetap jelas tanpa menghilangkan hubungan penjelas dengan Feniks.
