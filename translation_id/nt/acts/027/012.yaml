  to: Karena pelabuhan itu tidak layak untuk berlabuh selama musim dingin, sebagian besar dari mereka memutuskan untuk berlayar dari sana, kalau-kalau mereka dapat mencapai Feniks[a] dan melewatkan musim dingin di sana—sebuah pelabuhan di Kreta yang menghadap ke barat daya dan barat laut.[b]
