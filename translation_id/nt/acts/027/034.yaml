  text: διὸ παρακαλῶ ὑμᾶς ⸀μεταλαβεῖν τροφῆς, τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει· οὐδενὸς γὰρ ὑμῶν θρὶξ ⸀ἀπὸ τῆς κεφαλῆς ⸀ἀπολεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/034.yaml
  text: Therefore I urge you to take some food[a], for this is for your preservation; for not a hair from the head of any of you will perish.
translation:
  language: id
  text: Karena itu, saya mendesak kalian untuk makan, sebab hal ini berguna bagi kelangsungan hidup kalian. Sebab, tidak satu helai pun rambut di kepala kalian akan hilang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan dari keadaan dan perkataan sebelumnya serta mempertahankan hubungan logis secara alami dalam bahasa Indonesia.
- source_word: παρακαλῶ
  choice: saya mendesak
  rationale: Menyampaikan permohonan Paulus yang sungguh-sungguh dan kuat tanpa menjadi terlalu formal.
- source_word: μεταλαβεῖν τροφῆς
  choice: untuk makan
  rationale: Ungkapan ini berarti mengambil atau menyantap makanan; 'makan' adalah padanan modern yang alami dan jelas dalam konteks.
- source_word: τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει
  choice: Hal ini penting bagi keselamatan kalian
  rationale: Konstruksi tersebut menunjukkan manfaat atau tujuan. 'Penting bagi' menyampaikan bahwa makan menunjang keselamatan mereka tanpa menambahkan gagasan keharusan yang tidak dinyatakan secara eksplisit.
- source_word: σωτηρίας
  choice: keselamatan
  rationale: Kata Yunani ini dapat berarti keselamatan, pembebasan, atau kelangsungan hidup. 'Keselamatan' mempertahankan keluasan leksikalnya, sedangkan catatan kaki menjelaskan bahwa konteks menunjuk pada selamat secara jasmani.
- source_word: οὐδενὸς γὰρ ὑμῶν
  choice: seorang pun dari kalian
  rationale: Mempertahankan daya distributif ungkapan Yunani dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: θρὶξ ἀπὸ τῆς κεφαλῆς
  choice: tidak sehelai pun rambut di kepala
  rationale: Menyampaikan idiom tentang perlindungan menyeluruh secara alami; 'sehelai pun' mempertahankan penekanan pada satu rambut sekalipun.
- source_word: ἀπολεῖται
  choice: akan hilang
  rationale: Dalam kaitannya dengan rambut, 'akan hilang' adalah ungkapan Indonesia yang alami dan tetap menyampaikan makna ἀπόλλυμι dalam konteks ini.
theological_decisions:
- issue: Makna σωτηρία dalam konteks
  choice: keselamatan, dengan penjelasan bahwa yang dimaksud ialah selamat secara jasmani
  alternative: kelangsungan hidup; keselamatan jasmani
  rationale: Konteks langsungnya adalah bahaya badai dan karamnya kapal. Namun, memakai 'keselamatan' dalam teks utama mempertahankan cakupan istilah Yunani dan ketegangan leksikalnya, sementara catatan kaki mencegah pembaca menganggap bahwa ayat ini terutama berbicara tentang keselamatan rohani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pronomina 'kalian' dipakai karena Paulus berbicara kepada banyak orang dan bentuk ini jelas bagi pembaca modern. Idiom rambut dipertahankan karena alami dan penting bagi penegasan ayat.
