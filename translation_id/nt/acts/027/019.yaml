  text: καὶ τῇ τρίτῃ αὐτόχειρες τὴν σκευὴν τοῦ πλοίου ⸀ἔρριψαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/019.yaml
  text: And on the third day they threw the ship’s gear overboard with their own hands[a].
translation:
  language: id
  text: Pada hari ketiga, mereka membuang perlengkapan kapal ke laut dengan tangan mereka sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka sendiri membuang perlengkapan kapal.”
    reason: Alternatif ini menyampaikan penekanan αὐτόχειρες dengan kata ganti penegas, tanpa gambaran harfiah 'dengan tangan mereka sendiri'.
lexical_decisions:
- source_word: τῇ τρίτῃ
  choice: pada hari ketiga
  rationale: Datif dengan bilangan bertingkat berfungsi sebagai keterangan waktu; kata 'hari' dibuat eksplisit agar alami dan jelas dalam bahasa Indonesia.
- source_word: αὐτόχειρες
  choice: dengan tangan mereka sendiri
  rationale: Ungkapan ini mempertahankan penekanan bahwa mereka sendiri turun tangan melakukan tindakan tersebut, bukan sekadar memerintahkannya.
- source_word: τὴν σκευὴν τοῦ πλοίου
  choice: perlengkapan kapal
  rationale: Dalam konteks pelayaran, σκευή menunjuk pada peralatan atau perlengkapan kapal. 'Perlengkapan kapal' alami, cukup luas, dan tidak membatasi makna pada tali-temali saja.
- source_word: ἔρριψαν
  choice: membuang ... ke laut
  rationale: Verba ini berarti melempar atau membuang. Konteks kapal di tengah badai menunjukkan bahwa perlengkapan itu dibuang dari kapal ke laut; ungkapan ini alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan urutan waktu, tindakan, objek, lalu penekanan pelaku. Penanda catatan kaki ditempatkan sesudah kalimat.
