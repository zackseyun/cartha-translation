  text: But not long after[b][a], a typhonic wind called Euraquilo rushed down against it.
translation:
  language: id
  text: Namun, tidak lama kemudian, dari pulau itu menerjang angin badai yang dahsyat, yang disebut Eurakilon[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “Euroklidon” alih-alih “Eurakilon”.
    reason: textual_variant
  - marker: b
    text: Atau, “angin timur laut yang dahsyat”; nama ini kemungkinan menunjuk pada angin badai dari arah timur laut, tetapi teks Yunani menyajikannya sebagai nama diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολὺ
  choice: tidak lama kemudian
  rationale: Ungkapan waktu idiomatis yang berarti sesaat kemudian; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan narasi dengan kontras ringan ketika keadaan tiba-tiba memburuk.
- source_word: ἔβαλεν κατ’ αὐτῆς
  choice: dari pulau itu menerjang
  rationale: Dengan angin sebagai subjek, ἔβαλεν menggambarkan gerakan kuat, sedangkan κατά dengan genitif dapat menyatakan gerakan turun dari suatu tempat. Pronomina feminin αὐτῆς paling wajar merujuk kepada Kreta dalam konteks dekat.
- source_word: ἄνεμος τυφωνικὸς
  choice: angin badai yang dahsyat
  rationale: τυφωνικός menggambarkan angin badai yang berpusar dan sangat keras. Padanan ini mempertahankan daya ungkapnya tanpa menyamakan badai kuno tersebut secara terlalu teknis dengan kategori meteorologi modern 'topan'.
- source_word: ὁ καλούμενος
  choice: yang disebut
  rationale: Rumus partisipial biasa untuk memperkenalkan nama atau sebutan.
- source_word: Εὐρακύλων
  choice: Eurakuilon
  rationale: Mentransliterasikan bentuk nama diri dalam teks Yunani SBLGNT ke ejaan yang mudah dibaca dalam bahasa Indonesia, tanpa menggantinya dengan tafsiran arah angin.
