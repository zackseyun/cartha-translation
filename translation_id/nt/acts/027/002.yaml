  - severity: low
    issue: “Kapal asal Adramitium” kurang langsung dalam bahasa Indonesia modern.
    rationale: Adjektiva Ἀδραμυττηνῷ menghubungkan kapal dengan Adramitium. “Kapal dari Adramitium” menyampaikan hubungan tersebut secara alami tanpa memastikan secara berlebihan bahwa kota itu adalah asal pembangunan atau pelabuhan asal kapal.
