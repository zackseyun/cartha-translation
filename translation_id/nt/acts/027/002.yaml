revisions:
- from: Kami naik ke sebuah kapal asal Adramitium yang akan berlayar menuju berbagai tempat di sepanjang pesisir Asia[a][b], lalu bertolak ke laut. Aristarkhus, seorang Makedonia dari Tesalonika, menyertai kami.
  to: Kami naik ke sebuah kapal dari Adramitium yang akan berlayar ke berbagai tempat di wilayah Asia[a][b], lalu bertolak ke laut. Aristarkhus, seorang Makedonia dari Tesalonika, menyertai kami.
  rationale: Revisi membatasi penafsiran geografis dalam teks utama pada apa yang dinyatakan sumber, yakni berbagai tempat di wilayah Asia, sambil mempertahankan kemungkinan pembacaan pesisir/pelabuhan dalam catatan kaki. Ungkapan untuk asal/hubungan kapal dengan Adramitium juga dibuat lebih idiomatis.
