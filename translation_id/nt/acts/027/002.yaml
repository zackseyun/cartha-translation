id: ACT.27.2
reference: Acts 27:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπιβάντες δὲ πλοίῳ Ἀδραμυττηνῷ ⸀μέλλοντι πλεῖν ⸀εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους ἀνήχθημεν ὄντος σὺν ἡμῖν Ἀριστάρχου Μακεδόνος Θεσσαλονικέως·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/002.yaml
  text: So we boarded an Adramyttian ship that was about to sail to the places along Asia, and put out to sea, with Aristarchus, a Macedonian from Thessalonica, being with us.
translation:
  language: id
  text: Kami naik ke sebuah kapal dari Adramitium yang akan berlayar ke berbagai tempat di wilayah Asia[a][b], lalu bertolak ke laut. Aristarkhus, seorang Makedonia dari Tesalonika, menyertai kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud adalah Provinsi Asia dalam Kekaisaran Romawi, di bagian barat Asia Kecil, bukan benua Asia modern.
    reason: cultural_note
  - marker: b
    text: Atau, “menuju pelabuhan-pelabuhan di sepanjang pesisir Asia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιβάντες
  choice: naik ke
  rationale: Dalam konteks pelayaran, verba ini berarti naik ke kapal. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan urutan tindakan sebelum bertolak.
- source_word: δὲ
  choice: lalu
  rationale: Partikel ini meneruskan alur narasi tanpa menyatakan pertentangan yang kuat.
- source_word: πλοίῳ Ἀδραμυττηνῷ
  choice: sebuah kapal asal Adramitium
  rationale: Adjektiva tersebut menunjukkan hubungan kapal itu dengan Adramitium, kemungkinan sebagai pelabuhan asalnya. Bentuk ini lebih jelas dan alami daripada membentuk adjektiva nama tempat dalam bahasa Indonesia.
- source_word: μέλλοντι πλεῖν
  choice: yang akan berlayar
  rationale: μέλλω dengan infinitif menyatakan tindakan yang segera atau diniatkan akan dilakukan; 'akan berlayar' sesuai dengan konteks perjalanan.
- source_word: εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους
  choice: menuju berbagai tempat di sepanjang pesisir Asia
  rationale: κατά dengan akusatif memiliki nuansa geografis-distributif, yaitu sejumlah tempat sepanjang wilayah Asia. Konteks kapal mendukung penyebutan pesisir, sementara catatan kaki mempertahankan kemungkinan bahwa yang dimaksud secara khusus ialah pelabuhan-pelabuhan.
- source_word: Ἀσίαν
  choice: Asia
  rationale: Nama historis dipertahankan dalam teks utama, sedangkan catatan kaki menjelaskan bahwa ini adalah provinsi Romawi, bukan benua Asia modern.
- source_word: ἀνήχθημεν
  choice: bertolak ke laut
  rationale: Bentuk pasif ἀνάγω merupakan ungkapan bahari yang lazim untuk meninggalkan pelabuhan dan mulai berlayar.
- source_word: ὄντος σὺν ἡμῖν
  choice: menyertai kami
  rationale: Genitivus absolutus menyatakan keadaan penyerta. Ungkapan ini menyampaikan bahwa Aristarkhus ikut bersama rombongan dengan bahasa Indonesia yang wajar.
- source_word: Ἀριστάρχου
  choice: Aristarkhus
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: Μακεδόνος
  choice: seorang Makedonia
  rationale: Nomina ini mengidentifikasi asal kedaerahan Aristarkhus.
- source_word: Θεσσαλονικέως
  choice: dari Tesalonika
  rationale: Frasa ini memperinci kota asal Aristarkhus dan menghindari penumpukan dua sebutan kedaerahan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Istilah bahari 'bertolak ke laut' dipakai agar makna teknis ἀνήχθημεν tetap jelas. Nama-nama mengikuti bentuk yang umum dikenal pembaca Alkitab Indonesia.
