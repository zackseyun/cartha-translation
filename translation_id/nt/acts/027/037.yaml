base_translation:
  language: en
  yaml_path: translation/nt/acts/027/037.yaml
  text: There were 276 persons in the ship in all[a].
translation:
  language: id
  text: Jumlah kami semua yang berada di kapal itu adalah 276 orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Kami semua, yaitu jiwa-jiwa yang berada di kapal itu, berjumlah 276.” Di sini “jiwa-jiwa” berarti orang-orang atau nyawa, bukan secara khusus jiwa yang tidak berwujud.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμεθα
  choice: Jumlah kami ... 276 orang
  rationale: Bentuk orang pertama jamak secara harfiah berarti 'kami adalah'. Dalam bahasa Indonesia, susunan 'jumlah kami ... 276 orang' secara alami mempertahankan sudut pandang orang pertama sekaligus menyatakan jumlah keseluruhan.
- source_word: δὲ
  choice: tidak dinyatakan secara tersendiri
  rationale: δέ adalah penghubung naratif ringan. Dalam ayat yang berdiri sesudah uraian sebelumnya, hubungan itu sudah alami tanpa perlu menambahkan 'adapun', 'lalu', atau penanda waktu yang tidak eksplisit.
- source_word: αἱ πᾶσαι ψυχαὶ
  choice: kami semua ... orang
  rationale: ψυχαί di sini menunjuk kepada orang-orang atau nyawa yang berada di kapal, bukan secara khusus kepada jiwa tak berwujud. πᾶσαι tercermin dalam 'semua'.
- source_word: ἐν τῷ πλοίῳ
  choice: yang berada di kapal itu
  rationale: Frasa ini menyatakan lokasi seluruh orang yang dihitung. 'Di kapal itu' alami dalam bahasa Indonesia dan artikel Yunani tercermin melalui 'itu'.
- source_word: διακόσιαι ἑβδομήκοντα ἕξ
  choice: '276'
  rationale: Angka Arab mempertahankan jumlah tepat dan mudah dibaca.
theological_decisions:
- issue: Makna ψυχαί
  choice: orang
  alternative: jiwa
  rationale: Dalam konteks penghitungan penumpang, istilah ini merupakan sebutan bagi manusia atau nyawa secara utuh; 'jiwa' dapat disalahpahami sebagai penegasan mengenai bagian manusia yang tidak berwujud.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Susunan kalimat mempertahankan sudut pandang orang pertama dari ἤμεθα, tetapi menghindari terjemahan kaku 'kami adalah 276 jiwa'.
