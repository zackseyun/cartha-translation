  yaml_path: translation/nt/acts/027/039.yaml
  text: When day came[a], they did not recognize the land, but they noticed a certain bay with a beach, into which they planned, if they could, to run the ship ashore.
translation:
  language: id
  text: Ketika hari mulai terang, mereka tidak mengenali daratan itu. Namun, mereka melihat sebuah teluk dengan pantai, dan mereka berencana, jika mampu, untuk mengarahkan kapal itu hingga kandas di pantai teluk itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mendorong kapal itu ke pantai.” Kata kerja Yunani ini menunjuk pada tindakan membawa atau memaksa kapal hingga kandas di pantai.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ ἡμέρα ἐγένετο
  choice: Ketika hari mulai terang
  rationale: Ungkapan temporal yang alami dalam bahasa Indonesia dan sesuai dengan konteks datangnya cahaya pagi; δέ berfungsi sebagai penghubung naratif ringan dan tidak perlu diterjemahkan secara tersendiri.
- source_word: τὴν γῆν οὐκ ἐπεγίνωσκον
  choice: mereka tidak mengenali daratan itu
  rationale: ἐπιγινώσκω berarti mengenali atau mengidentifikasi; γῆ diterjemahkan secara langsung sebagai 'daratan', dengan konteks yang menunjuk pada wilayah pantai yang tampak.
- source_word: κόλπον δέ τινα κατενόουν
  choice: Namun, mereka melihat sebuah teluk
  rationale: κόλπος dalam konteks pelayaran berarti teluk; τινα mempertahankan ketidakspesifikan melalui 'sebuah', sedangkan κατενόουν menyatakan pengamatan yang disengaja dan wajar diterjemahkan 'melihat'.
- source_word: ἔχοντα αἰγιαλὸν
  choice: yang memiliki pantai
  rationale: αἰγιαλός berarti pantai atau tepi laut. Terjemahan ini tidak menambahkan keterangan bahwa pantai itu berpasir.
- source_word: εἰς ὃν
  choice: ke sana
  rationale: Frasa ini menunjuk secara terarah kepada teluk sebagai tujuan kapal; 'ke sana' alami dalam bahasa Indonesia dan menghindari konstruksi relatif yang kaku.
- source_word: ἐβουλεύοντο εἰ δύναιντο
  choice: lalu berencana ... jika memungkinkan
  rationale: βουλεύομαι menyatakan rencana atau maksud, sedangkan optatif dalam εἰ δύναιντο mempertahankan unsur kemungkinan atau ketidakpastian.
- source_word: ἐξῶσαι τὸ πλοῖον
  choice: mengandaskan kapal
  rationale: Dalam konteks nautis, ἐξωθέω berarti mendorong atau membawa kapal hingga naik ke pantai. 'Mengandaskan kapal' merupakan ungkapan Indonesia yang ringkas dan tepat untuk tindakan yang disengaja ini.
