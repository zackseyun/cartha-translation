  text: καὶ τὰς ἀγκύρας περιελόντες εἴων εἰς τὴν θάλασσαν, ἅμα ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων, καὶ ἐπάραντες τὸν ἀρτέμωνα τῇ πνεούσῃ κατεῖχον εἰς τὸν αἰγιαλόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/040.yaml
  text: And after casting off the anchors[a], they left them in the sea; at the same time loosening the ropes of the rudders, and hoisting the foresail to the wind[b], they made for the beach.
translation:
  language: id
  text: Setelah melepaskan jangkar-jangkar itu dan meninggalkannya di laut, bersamaan dengan itu mereka melonggarkan tali-tali pengikat kemudi[a] dan menaikkan layar depan ke arah angin yang bertiup[b], lalu mengarahkan kapal ke pantai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Yunani yang langka ini dapat berarti “tali-tali”, “pengikat-pengikat”, atau “pengencang-pengencang” pada alat kemudi.
    reason: lexical_alternative
  - marker: b
    text: Atau “layar atas” atau “layar di bagian haluan”; rujukan tepat istilah bahari Yunani ini tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελόντες ... τὰς ἀγκύρας
  choice: melepaskan jangkar-jangkar itu
  rationale: Partisipel aoris menyatakan tindakan yang mendahului tindakan utama. Dalam konteks pelayaran, frasa ini berarti menanggalkan atau melepaskan jangkar, bukan sekadar memindahkannya.
- source_word: εἴων εἰς τὴν θάλασσαν
  choice: membiarkannya di laut
  rationale: ἐάω dapat berarti membiarkan atau meninggalkan. Objek tersiratnya ialah jangkar-jangkar yang baru dilepaskan, sehingga terjemahan ini menyampaikan bahwa jangkar itu ditinggalkan di laut.
- source_word: ἅμα
  choice: pada saat yang sama
  rationale: Menandai bahwa tindakan berikut berlangsung serentak dengan pelepasan jangkar.
- source_word: ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων
  choice: melonggarkan tali-tali pengikat kemudi
  rationale: ἀνίημι berarti melepaskan atau melonggarkan, sedangkan ζευκτηρίας adalah istilah bahari langka bagi pengikat alat kemudi. Ungkapan ini jelas dalam bahasa Indonesia modern tanpa menghilangkan unsur pengikatnya.
- source_word: ἐπάραντες τὸν ἀρτέμωνα
  choice: mengembangkan layar depan
  rationale: ἐπαίρω berarti mengangkat atau menaikkan; dalam konteks layar, 'mengembangkan' menyatakan tindakan memasang layar agar menangkap angin. ἀρτέμων adalah istilah bahari yang rujukan tepatnya tidak pasti, tetapi kemungkinan menunjuk pada layar di bagian depan kapal.
- source_word: τῇ πνεούσῃ
  choice: ke arah angin
  rationale: Partisipel dari πνέω mengacu pada angin yang sedang bertiup. Ungkapan ini alami dalam konteks mengembangkan layar untuk menangkap angin.
- source_word: κατεῖχον εἰς τὸν αἰγιαλόν
  choice: melaju menuju pantai
  rationale: κατέχω di sini dipakai dalam arti bahari, yakni mengarahkan atau mempertahankan haluan menuju suatu tempat; αἰγιαλός menunjuk pada pantai atau garis pantai.
