  text: τῇ δὲ ἐπαύριον ἐάσαντες τοὺς ἱππεῖς ⸀ἀπέρχεσθαι σὺν αὐτῷ ὑπέστρεψαν εἰς τὴν παρεμβολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/032.yaml
  text: But on the next day[a], after letting the horsemen go on with him, they returned to the barracks.
translation:
  language: id
  text: Keesokan harinya, mereka membiarkan pasukan berkuda meneruskan perjalanan bersama Paulus, lalu kembali ke barak militer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke perkemahan.” Istilah Yunani yang dipakai dapat berarti perkemahan atau tempat tinggal pasukan; di sini kemungkinan besar yang dimaksud ialah barak atau benteng Romawi di Yerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Keesokan harinya
  rationale: Ungkapan ini berarti “pada hari berikutnya.” Dalam bahasa Indonesia, “Keesokan harinya” merupakan peralihan naratif yang alami; δέ tidak perlu diterjemahkan tersendiri karena tidak menyatakan pertentangan yang kuat.
- source_word: ἐάσαντες
  choice: membiarkan
  rationale: Partisip aoris dari ἐάω menyatakan bahwa mereka mengizinkan pasukan berkuda melanjutkan perjalanan sebelum mereka sendiri kembali.
- source_word: τοὺς ἱππεῖς
  choice: pasukan berkuda
  rationale: Istilah ini menunjuk kepada tentara berkuda. “Pasukan berkuda” jelas dan alami dalam konteks pengawalan militer.
- source_word: ἀπέρχεσθαι σὺν αὐτῷ
  choice: meneruskan perjalanan bersama Paulus
  rationale: Dalam konteks ini, pasukan berkuda terus mengawal Paulus sementara prajurit lainnya kembali. Nama “Paulus” dipakai untuk memperjelas rujukan kata ganti tanpa mengubah makna.
- source_word: ὑπέστρεψαν
  choice: lalu kembali
  rationale: Kata kerja ini berarti “kembali” atau “berbalik kembali.” “Lalu” memperjelas urutan tindakan partisip dan verba utama.
- source_word: εἰς τὴν παρεμβολήν
  choice: ke barak militer
  rationale: παρεμβολή dapat berarti perkemahan atau tempat tinggal pasukan. Dalam konteks Yerusalem, istilah ini kemungkinan menunjuk pada barak atau benteng tempat pasukan Romawi bermarkas.
theological_decisions: []
