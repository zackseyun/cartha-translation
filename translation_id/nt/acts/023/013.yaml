  text: Ada lebih dari empat puluh orang yang telah membentuk persekongkolan ini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείους τεσσεράκοντα
  choice: lebih dari empat puluh orang
  rationale: Ungkapan komparatif ini berarti jumlah yang melampaui empat puluh. Kata 'orang' ditambahkan secara wajar dalam bahasa Indonesia karena kelompok pelakunya tersirat dalam konstruksi Yunani.
- source_word: συνωμοσίαν
  choice: persekongkolan
  rationale: Kata ini menunjuk pada kesepakatan rahasia untuk melakukan suatu rencana bersama; 'persekongkolan' mempertahankan nuansa formalnya tanpa memasukkan rincian sumpah dari konteks sebelumnya.
- source_word: ποιησάμενοι
  choice: telah membentuk
  rationale: Partisip aoris medium bersama 'persekongkolan' secara idiomatis menyatakan bahwa mereka membuat atau membentuk persekongkolan tersebut.
- source_word: ἦσαν δὲ
  choice: Jumlah ...
  rationale: Konstruksi eksistensial Yunani dialihkan menjadi kalimat kuantitatif yang alami dalam bahasa Indonesia. Partikel δέ bersifat penghubung ringan dan tidak perlu dinyatakan tersendiri.
- source_word: οἱ ταύτην τὴν συνωμοσίαν ποιησάμενοι
  choice: orang yang telah membentuk persekongkolan ini
  rationale: Artikel dengan partisip berfungsi substantival, yakni menunjuk kepada orang-orang yang melakukan tindakan itu; klausa relatif merupakan padanan Indonesia yang alami.
