id: ACT.23.27
reference: Acts 23:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὸν ἄνδρα τοῦτον συλλημφθέντα ὑπὸ τῶν Ἰουδαίων καὶ μέλλοντα ἀναιρεῖσθαι ὑπ’ αὐτῶν ἐπιστὰς σὺν τῷ στρατεύματι ⸀ἐξειλάμην, μαθὼν ὅτι Ῥωμαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/027.yaml
  text: This man was seized by the Jews and was about to be killed by them[a], and I came with the troops and rescued him, having learned that he is a Roman.
translation:
  language: id
  text: Orang ini ditangkap oleh orang-orang Yahudi[a] dan hendak dibunuh oleh mereka, lalu aku datang bersama pasukan dan menyelamatkannya, setelah mengetahui bahwa ia orang Romawi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Yudea.” Istilah Yunani ini dapat menunjuk orang Yahudi dalam arti etnis-keagamaan atau penduduk Yudea dalam arti geografis; di sini kemungkinan besar yang dimaksud ialah kelompok orang Yahudi di Yerusalem yang menentang Paulus.
    reason: lexical_alternative
lexical_decisions:
- source_word: συλλημφθέντα
  choice: ditangkap
  rationale: Bentuk pasif συλλαμβάνω menyatakan bahwa orang itu ditangkap atau dikuasai. Dalam konteks tindakan massa yang bermusuhan, “ditangkap” alami dan tidak harus menyiratkan penangkapan resmi oleh aparat.
- source_word: Ἰουδαίων
  choice: orang-orang Yahudi
  rationale: Ἰουδαῖοι dapat menunjuk orang Yahudi secara etnis-keagamaan atau orang Yudea secara geografis. Di sini kelompok penentang Paulus di Yerusalem dimaksud; kemungkinan alternatif dicatat dalam catatan kaki.
- source_word: μέλλοντα ἀναιρεῖσθαι
  choice: hampir dibunuh
  rationale: μέλλω dengan infinitif menyatakan tindakan yang segera akan terjadi, sedangkan ἀναιρέω di sini berarti membunuh. “Hampir dibunuh” ringkas, wajar, dan menyampaikan ancaman yang sudah dekat.
- source_word: ἐπιστὰς
  choice: aku datang
  rationale: Partisip aoris ἐφίστημι menunjukkan kedatangan yang mendadak atau tindakan mendatangi tempat kejadian. Nuansa campur tangan tampak melalui tindakan penyelamatan dalam klausa berikutnya.
- source_word: σὺν τῷ στρατεύματι
  choice: bersama pasukan
  rationale: στράτευμα menunjuk satu pasukan atau detasemen militer tanpa menentukan ukurannya. “Pasukan” mempertahankan cakupan tersebut.
- source_word: ἐξειλάμην
  choice: menyelamatkannya
  rationale: Bentuk medium ἐξαιρέω di sini berarti melepaskan atau menyelamatkan seseorang dari bahaya, tepat dalam konteks ancaman pembunuhan.
- source_word: μαθὼν
  choice: setelah mengetahui
  rationale: Partisip aoris μανθάνω secara gramatikal menyajikan pengetahuan itu sebagai keadaan atau tindakan yang mendahului penyelamatan. Terjemahan mempertahankan penyajian surat tersebut tanpa menyelaraskannya dengan urutan peristiwa sebelumnya.
- source_word: Ῥωμαῖός ἐστιν
  choice: ia seorang warga Roma
  rationale: Ῥωμαῖος secara harfiah berarti orang Roma, tetapi dalam konteks hukum dan perlindungan yang sedang dibicarakan, maksudnya ialah status kewarganegaraan Romawi. “Warga Roma” menyampaikan implikasi kontekstual itu secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penyajian historis-retoris dalam surat kepala pasukan
  choice: Menerjemahkan pernyataan kepala pasukan sebagaimana disusun dalam bahasa Yunani, yaitu bahwa ia menyelamatkan Paulus setelah mengetahui status Romawinya.
  alternative: Mengubah urutannya agar selaras secara eksplisit dengan kisah yang lebih lengkap dalam Kisah Para Rasul 21–22.
  rationale: Ayat ini mengutip cara Klaudius Lisias menggambarkan tindakannya sendiri dengan nada yang menguntungkan dirinya. Terjemahan tidak boleh diam-diam menghapus ketegangan dengan narasi sebelumnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif resmi yang sesuai dengan isi surat. Koordinasi Yunani dengan καί diwujudkan sebagai pemisahan kalimat lalu “Lalu”, tanpa menambahkan kontras seperti “tetapi”. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa terkait.
