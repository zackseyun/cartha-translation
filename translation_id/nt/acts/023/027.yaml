revisions:
- from: Orang ini ditangkap oleh orang-orang Yahudi[a] dan hampir dibunuh oleh mereka. Lalu aku datang bersama pasukan dan menyelamatkannya, setelah mengetahui bahwa ia seorang warga Roma.
  to: Orang ini ditangkap oleh orang-orang Yahudi[a] dan hendak dibunuh oleh mereka, lalu aku datang bersama pasukan dan menyelamatkannya, setelah mengetahui bahwa ia orang Romawi.
  rationale: Mengganti "hampir dibunuh" dengan "hendak dibunuh" untuk menyatakan ancaman pembunuhan yang segera sesuai μέλλω dengan infinitif. Mengganti "seorang warga Roma" dengan "orang Romawi" untuk mencerminkan Ῥωμαῖος secara langsung dan tidak menambahkan perincian di luar bentuk leksikal sumber. Catatan kaki dipertahankan dengan jangkar yang benar.
