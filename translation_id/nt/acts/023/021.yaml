  text: σὺ οὖν μὴ πεισθῇς αὐτοῖς, ἐνεδρεύουσιν γὰρ αὐτὸν ἐξ αὐτῶν ἄνδρες πλείους τεσσεράκοντα, οἵτινες ἀνεθεμάτισαν ἑαυτοὺς μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀνέλωσιν αὐτόν, καὶ νῦν ⸂εἰσιν ἕτοιμοι⸃ προσδεχόμενοι τὴν ἀπὸ σοῦ ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/021.yaml
  text: So do not be persuaded by them, for more than forty men from among them are lying in ambush for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. And now they are ready, waiting for the promise from you.
translation:
  language: id
  text: Jadi, janganlah engkau terbujuk oleh mereka, sebab lebih dari empat puluh orang dari antara mereka sedang menunggu untuk menyergapnya. Mereka telah mengikat diri dengan sumpah yang disertai kutuk[a] untuk tidak makan ataupun minum sampai mereka membunuhnya. Sekarang mereka sudah siap dan sedang menantikan janji darimu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah mengikat diri di bawah kutuk.” Ungkapan Yunani ini mencakup gagasan bahwa mereka mendatangkan kutuk atas diri sendiri jika gagal menepati sumpah itu.
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ini, janji itu tampaknya berupa persetujuan atau izin darimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθῇς
  choice: biarkan dirimu dibujuk
  rationale: Bentuk pasif ini mempertahankan gagasan bahwa kepala pasukan tidak boleh membiarkan permintaan mereka memengaruhi atau membujuknya.
- source_word: ἐνεδρεύουσιν
  choice: sedang mengadang
  rationale: Dalam konteks rencana penyerangan tersembunyi, 'mengadang' menyampaikan tindakan menunggu untuk menyergap secara alami dalam bahasa Indonesia.
- source_word: ἐξ αὐτῶν
  choice: dari antara mereka
  rationale: Menunjukkan bahwa para lelaki itu berasal dari kelompok yang baru disebutkan.
- source_word: ἄνδρες πλείους τεσσεράκοντα
  choice: lebih dari empat puluh orang
  rationale: Padanan Indonesia yang alami dan tepat bagi konstruksi komparatif dengan bilangan.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: telah mengikat diri di bawah kutuk
  rationale: Mempertahankan unsur ikrar yang disertai kutuk atas diri sendiri jika mereka gagal melaksanakannya.
- source_word: μήτε φαγεῖν μήτε πιεῖν
  choice: untuk tidak makan ataupun minum
  rationale: Mempertahankan pasangan negatif yang mencakup kedua tindakan secara tegas.
- source_word: ἕως οὗ ἀνέλωσιν αὐτόν
  choice: sebelum membunuh dia
  rationale: Mengungkap batas waktu ikrar dan arti kekerasan ἀναιρέω secara jelas; 'sebelum' alami dalam konstruksi Indonesia ini.
- source_word: εἰσιν ἕτοιμοι
  choice: mereka sudah siap
  rationale: Padanan langsung dan alami yang juga menangkap keadaan siap pada saat itu.
- source_word: προσδεχόμενοι
  choice: sedang menantikan
  rationale: Menyatakan penantian penuh harap terhadap tanggapan kepala pasukan.
- source_word: τὴν ἀπὸ σοῦ ἐπαγγελίαν
  choice: persetujuan darimu
  rationale: Dalam konteks ini, yang mereka nantikan ialah kesediaan atau persetujuan kepala pasukan untuk memenuhi permintaan mereka; catatan kaki mempertahankan arti harfiah 'janji'.
