revisions:
- from: Karena itu, jangan biarkan dirimu dibujuk oleh mereka, sebab lebih dari empat puluh orang dari antara mereka sedang mengadang dia. Mereka telah mengikat diri di bawah kutuk[a] untuk tidak makan ataupun minum sebelum membunuh dia. Sekarang mereka sudah siap dan sedang menantikan persetujuan darimu.[b]
  to: Jadi, janganlah engkau terbujuk oleh mereka, sebab lebih dari empat puluh orang dari antara mereka sedang menunggu untuk menyergapnya. Mereka telah mengikat diri dengan sumpah yang disertai kutuk[a] untuk tidak makan ataupun minum sampai mereka membunuhnya. Sekarang mereka sudah siap dan sedang menantikan janji darimu.[b]
  rationale: Revisi memulihkan makna temporal “sampai,” memperjelas bahwa orang-orang itu menanti dalam penyergapan, dan mempertahankan “janji” sebagai padanan utama ἐπαγγελία. Penjelasan bahwa janji tersebut berkaitan dengan persetujuan atau izin dipertahankan sebagai kemungkinan kontekstual dalam catatan kaki, bukan sebagai penggantian makna leksikal di teks utama.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:53:19Z'
review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan. Draf menangkap struktur dan sebagian besar makna dengan baik, tetapi “sebelum membunuh dia” mengubah batas sumpah Yunani ἕως οὗ menjadi tindakan yang harus terjadi sesudah batas itu, bukan “sampai mereka membunuhnya.” “Sedang mengadang” juga kurang jelas menyampaikan unsur bersembunyi/menanti untuk menyergap dalam ἐνεδρεύουσιν. Selain itu, τὴν ἀπὸ σοῦ ἐπαγγελίαν secara leksikal adalah “janji darimu”; “persetujuan” merupakan penjelasan kontekstual yang sebaiknya ditempatkan dalam catatan kaki.
  naturalness: Teks revisi memakai Bahasa Indonesia baku modern, tetap bernada naratif, dan menggunakan “menunggu untuk menyergapnya” untuk menyatakan ancaman secara jelas tanpa menambah rincian. “Janganlah engkau terbujuk” adalah bentuk langsung yang alami bagi larangan pasif Yunani.
  terminology: “Sumpah yang disertai kutuk” menyampaikan unsur pengikatan diri dan kutuk diri dalam ἀνεθεμάτισαν ἑαυτούς tanpa menyederhanakannya menjadi sumpah biasa. “Janji darimu” mempertahankan istilah ἐπαγγελία, sedangkan kemungkinan makna persetujuan atau izin dijelaskan secara hati-hati dalam catatan kaki.
  issues:
  - severity: high
    issue: “sebelum membunuh dia” untuk ἕως οὗ ἀνέλωσιν αὐτόν
    rationale: ἕως οὗ berarti “sampai/h hingga,” yakni mereka bersumpah tidak makan atau minum sampai berhasil membunuhnya. “Sebelum” dalam bahasa Indonesia menyatakan relasi waktu yang berbeda.
  - severity: medium
    issue: “sedang mengadang” untuk ἐνεδρεύουσιν
    rationale: Kata Yunani ini secara khusus menyatakan bersembunyi atau menunggu dalam penyergapan. “Mengadang” dapat berarti menghadang secara terbuka dan tidak selalu memuat unsur ambush.
  - severity: medium
    issue: “persetujuan darimu” ditempatkan sebagai teks utama untuk ἐπαγγελίαν
    rationale: Walaupun persetujuan/izin cocok sebagai penjelasan konteks, arti dasar kata tersebut ialah “janji.” Teks utama perlu mempertahankan istilah sumber dan catatan kaki dapat menjelaskan rujukan kontekstualnya.
  revised_text: Jadi, janganlah engkau terbujuk oleh mereka, sebab lebih dari empat puluh orang dari antara mereka sedang menunggu untuk menyergapnya. Mereka telah mengikat diri dengan sumpah yang disertai kutuk[a] untuk tidak makan ataupun minum sampai mereka membunuhnya. Sekarang mereka sudah siap dan sedang menantikan janji darimu.[b]
