revisions:
- from: Maka prajurit itu membawa pemuda itu menghadap komandan dan berkata, “Tahanan bernama Paulus itu memanggil saya dan meminta saya membawa pemuda ini menghadap Bapak, karena ia hendak menyampaikan sesuatu kepada Bapak.”
  to: Maka prajurit itu membawa pemuda itu menghadap komandan dan berkata, “Paulus, sang tahanan, memanggil saya dan meminta saya membawa pemuda ini menghadapmu, karena ia mempunyai sesuatu untuk dikatakan kepadamu.”
  rationale: Revisi menghapus tambahan “bernama” dan sapaan “Bapak,” serta menerjemahkan frasa partisipial terakhir lebih dekat kepada makna Yunani. Struktur naratif dan register modern tetap dipertahankan.
