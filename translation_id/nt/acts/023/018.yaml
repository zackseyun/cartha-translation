  text: So he took him and brought him to the commander and said[a], “The prisoner Paul called me to him and asked me to bring this young man to you[b], because he has something to say to you.”
translation:
  language: id
  text: Maka prajurit itu membawa pemuda itu menghadap komandan dan berkata, “Paulus, sang tahanan, memanggil saya dan meminta saya membawa pemuda ini menghadapmu, karena ia mempunyai sesuatu untuk dikatakan kepadamu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραλαβὼν αὐτὸν ἤγαγεν
  choice: membawa pemuda itu menghadap
  rationale: Kedua verba menggambarkan prajurit yang menerima lalu mengantar pemuda itu kepada atasannya. Dalam bahasa Indonesia, satu konstruksi alami menghindari pengulangan kaku tanpa menghilangkan gerak pengantaran.
- source_word: χιλίαρχον
  choice: komandan
  rationale: Istilah ini menunjuk perwira militer Romawi. “Komandan” jelas bagi pembaca modern dan tidak memakai jargon seperti “kiliark” atau istilah historis yang kurang dikenal.
- source_word: φησίν
  choice: berkata
  rationale: Bentuk kini historis Yunani dialihkan ke bentuk naratif Indonesia yang wajar.
- source_word: δέσμιος
  choice: tahanan
  rationale: Dalam konteks ini Paulus berada dalam penahanan militer. “Tahanan” lebih tepat daripada “narapidana,” yang dapat menyiratkan bahwa ia telah dijatuhi hukuman.
- source_word: προσκαλεσάμενός με
  choice: memanggil saya
  rationale: Mengungkapkan bahwa Paulus meminta prajurit itu datang kepadanya, dengan susunan yang alami dan cukup jelas dalam konteks.
- source_word: ἠρώτησεν
  choice: meminta
  rationale: Di sini verba tersebut menyatakan permintaan, bukan pertanyaan.
- source_word: νεανίαν
  choice: pemuda
  rationale: Padanan alami untuk seorang laki-laki muda; ringkas dan bermartabat.
- source_word: ἔχοντά τι λαλῆσαί σοι
  choice: karena ia hendak menyampaikan sesuatu kepada Bapak
  rationale: Mengungkapkan secara idiomatis bahwa pemuda itu memiliki sesuatu untuk disampaikan kepada komandan. “Bapak” menandai sapaan hormat seorang bawahan kepada atasannya.
