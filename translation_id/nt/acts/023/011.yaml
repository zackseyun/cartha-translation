id: ACT.23.11
reference: Acts 23:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπιούσῃ νυκτὶ ἐπιστὰς αὐτῷ ὁ κύριος εἶπεν· ⸀Θάρσει, ὡς γὰρ διεμαρτύρω τὰ περὶ ἐμοῦ εἰς Ἰερουσαλὴμ οὕτω σε δεῖ καὶ εἰς Ῥώμην μαρτυρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/011.yaml
  text: But on the following night[a], the Lord stood by him and said, “Take courage, for just as you have testified about me in Jerusalem[b], so you must also testify in Rome.”
translation:
  language: id
  text: Pada malam berikutnya, Tuhan berdiri di sisi Paulus dan berkata, “Kuatkanlah hatimu![a] Sebab, sebagaimana kamu telah memberi kesaksian[b] tentang Aku di Yerusalem, demikian juga kamu harus memberi kesaksian di Roma.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tabahkanlah hatimu!”
    reason: lexical_alternative
  - marker: b
    text: Atau, “bersaksi”. Kedua kata kerja yang menggambarkan kesaksian Paulus di masa lalu dan di masa mendatang berasal dari kelompok kata Yunani yang sama tentang saksi atau kesaksian.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπιούσῃ νυκτί
  choice: Pada malam berikutnya
  rationale: Frasa ini menunjuk pada malam sesudah peristiwa sebelumnya. δέ berfungsi sebagai penghubung ringan dalam alur cerita sehingga tidak perlu dipaksakan menjadi pertentangan kuat seperti “tetapi”.
- source_word: ἐπιστὰς αὐτῷ
  choice: berdiri di sisi Paulus
  rationale: Ungkapan ini menyatakan bahwa Tuhan datang dan berdiri dekat dengannya. “Di sisi” mempertahankan gambaran kehadiran yang dekat dan menguatkan; nama Paulus dipakai agar rujukan pronomina jelas dalam bahasa Indonesia.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Padanan baku dan wajar untuk κύριος dalam konteks naratif ini, tanpa menambahkan nama yang tidak disebutkan secara eksplisit dalam ayat.
- source_word: Θάρσει
  choice: Kuatkanlah hatimu!
  rationale: Imperatif ini menyerukan keberanian atau keteguhan hati. Ungkapan tersebut alami dalam bahasa Indonesia dan mempertahankan nada dorongan langsung.
- source_word: διεμαρτύρω
  choice: telah memberi kesaksian
  rationale: Bentuk aoris merujuk pada kesaksian yang sudah Paulus sampaikan. Padanan ini juga mempertahankan kaitan leksikal dengan μαρτυρῆσαι di bagian akhir ayat.
- source_word: τὰ περὶ ἐμοῦ
  choice: tentang Aku
  rationale: Padanan ringkas dan alami bagi hal-hal yang berkenaan dengan pribadi pembicara. Huruf kapital mengikuti kebiasaan bahasa Indonesia untuk pronomina yang merujuk kepada Tuhan.
- source_word: εἰς Ἰερουσαλήμ
  choice: di Yerusalem
  rationale: Walaupun εἰς secara dasar dapat berarti “ke”, dalam pemakaian ini frasa tersebut menunjuk pada tempat kesaksian yang telah diberikan, sehingga bahasa Indonesia secara alami memakai “di”.
- source_word: οὕτω
  choice: demikian juga
  rationale: Ungkapan ini menyatakan kesejajaran antara kesaksian Paulus di Yerusalem dan kesaksiannya kelak di Roma.
- source_word: σε δεῖ
  choice: kamu harus
  rationale: δεῖ menyatakan keharusan, yang dalam konteks Kisah Para Rasul dapat mengandung keharusan ilahi. “Harus” mempertahankan daya keharusan tanpa menjelaskannya sebagai nasib atau determinisme.
- source_word: καὶ εἰς Ῥώμην μαρτυρῆσαι
  choice: juga ... memberi kesaksian di Roma
  rationale: καί menambahkan Roma sebagai tempat kesaksian berikutnya. “Memberi kesaksian” menjaga hubungan dengan διεμαρτύρω dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Identitas ὁ κύριος
  choice: Diterjemahkan “Tuhan” tanpa perluasan menjadi “Tuhan Yesus”.
  alternative: “Tuhan Yesus”
  rationale: Dalam konteks Kisah Para Rasul, pembicara yang menyebut kesaksian “tentang Aku” dipahami sebagai Yesus yang bangkit. Namun, teks Yunani hanya menyatakan “Tuhan”, sehingga terjemahan mempertahankan bentuk itu dan tidak menambahkan nama secara interpretatif.
- issue: Daya keharusan dalam δεῖ
  choice: Diterjemahkan “kamu harus”.
  alternative: “sudah ditentukan bahwa kamu akan” atau “perlu bagimu”
  rationale: Pilihan ini menyampaikan keharusan yang kuat dan membuka kemungkinan nuansa rencana ilahi, tetapi tidak mengubahnya menjadi pernyataan eksplisit tentang takdir atau mekanisme penentuan.
translation_notes:
  register: Bahasa yang dipakai bersifat modern, lugas, dan bermartabat. Sapaan “kamu” sesuai dengan ujaran langsung tunggal kepada Paulus. Nama “Paulus” dipakai menggantikan pronomina pada klausa awal untuk mencegah ketidakjelasan, sementara struktur “sebagaimana ... demikian juga ...” mempertahankan kesejajaran retoris teks Yunani.
