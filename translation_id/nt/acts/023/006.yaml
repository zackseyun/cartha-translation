revisions:
- from: Namun, ketika Paulus mengetahui bahwa sebagian dari mereka adalah orang Saduki dan sebagian lainnya orang Farisi, ia berseru di hadapan Mahkamah Agama[a], “Saudara-saudara, saya adalah orang Farisi, keturunan orang-orang Farisi[b]. Karena pengharapan dan kebangkitan orang mati[c]lah saya diadili.”
  to: Namun, ketika Paulus mengetahui bahwa sebagian dari mereka adalah orang Saduki dan sebagian lainnya orang Farisi, ia berseru dalam sidang Mahkamah Agama[a], “Saudara-saudara, saya adalah orang Farisi, keturunan orang-orang Farisi[b]. Mengenai pengharapan dan kebangkitan orang mati[c], saya diadili.”
  rationale: Revisi mengganti “di hadapan” dengan “dalam sidang” untuk mencerminkan ἐν τῷ συνεδρίῳ dan mengganti “Karena” dengan “Mengenai” untuk mempertahankan fungsi περί sebagai penanda pokok perkara. Koordinasi “pengharapan dan kebangkitan orang mati” serta ambiguitas idiom “keturunan orang-orang Farisi” tetap dipertahankan.
