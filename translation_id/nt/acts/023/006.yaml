id: ACT.23.6
reference: Acts 23:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Γνοὺς δὲ ὁ Παῦλος ὅτι τὸ ἓν μέρος ἐστὶν Σαδδουκαίων τὸ δὲ ἕτερον Φαρισαίων ⸀ἔκραζεν ἐν τῷ συνεδρίῳ· Ἄνδρες ἀδελφοί, ἐγὼ Φαρισαῖός εἰμι, υἱὸς ⸀Φαρισαίων· περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν ⸀ἐγὼ κρίνομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/006.yaml
  text: But Paul[a], knowing that one part were Sadducees and the other Pharisees, cried out in the council, “Men, brothers, I am a Pharisee, a son of Pharisees[c][b]. It is concerning the hope and resurrection of the dead that I am being judged.”
translation:
  language: id
  text: Namun, ketika Paulus mengetahui bahwa sebagian dari mereka adalah orang Saduki dan sebagian lainnya orang Farisi, ia berseru dalam sidang Mahkamah Agama[a], “Saudara-saudara, saya adalah orang Farisi, keturunan orang-orang Farisi[b]. Mengenai pengharapan dan kebangkitan orang mati[c], saya diadili.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di dalam dewan”; dalam konteks ini dapat merujuk kepada Sanhedrin, dewan tertinggi Yahudi.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “anak dari orang tua Farisi” atau “keturunan kaum Farisi.”
    reason: alternative_reading
  - marker: c
    text: Dapat juga dipahami, “Mengenai pengharapan akan kebangkitan orang mati, saya diadili.”
    reason: alternative_reading
lexical_decisions:
- source_word: Γνοὺς δὲ ὁ Παῦλος
  choice: Namun, ketika Paulus mengetahui
  rationale: Partisip aoris menyatakan keadaan yang melatarbelakangi tindakan Paulus; bentuk anak kalimat ini alami dalam bahasa Indonesia dan tetap menunjukkan hubungan waktunya.
- source_word: τὸ ἓν μέρος ... τὸ δὲ ἕτερον
  choice: sebagian dari mereka ... sebagian lainnya
  rationale: Mengungkapkan dua bagian dalam sidang dengan jelas dan alami tanpa memberi kesan bahwa keduanya merupakan lembaga terpisah.
- source_word: Σαδδουκαίων / Φαρισαίων
  choice: orang Saduki / orang Farisi
  rationale: Istilah baku bahasa Indonesia untuk kedua kelompok Yahudi tersebut.
- source_word: ἔκραζεν
  choice: berseru
  rationale: Menunjukkan ucapan lantang di muka umum dengan ragam yang bermartabat.
- source_word: ἐν τῷ συνεδρίῳ
  choice: di hadapan Mahkamah Agama
  rationale: Dalam konteks ini συνέδριον menunjuk pada dewan pemerintahan dan pengadilan Yahudi; pilihan ini jelas bagi pembaca Indonesia, sementara nama teknisnya dicatat dalam catatan kaki.
- source_word: Ἄνδρες ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan Indonesia ini alami dan mencakup daya sapaan idiomatis frasa Yunani tanpa menghasilkan bentuk kaku seperti 'pria-pria, saudara-saudara'.
- source_word: Φαρισαῖός εἰμι
  choice: saya adalah orang Farisi
  rationale: Menyampaikan identifikasi diri dalam kala kini secara langsung.
- source_word: υἱὸς Φαρισαίων
  choice: keturunan orang-orang Farisi
  rationale: Bahasa Indonesia tidak lazim memakai 'anak orang-orang Farisi'; 'keturunan' mempertahankan metafora hubungan keluarga sekaligus tidak memastikan apakah yang dimaksud orang tua langsung atau leluhur.
- source_word: περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν
  choice: karena pengharapan dan kebangkitan orang mati
  rationale: Mempertahankan koordinasi eksplisit antara 'pengharapan' dan 'kebangkitan' dalam bahasa Yunani, tanpa meleburkannya menjadi satu gagasan yang sudah ditafsirkan.
- source_word: κρίνομαι
  choice: saya diadili
  rationale: Mengungkapkan keadaan yudisial kini dan bentuk pasif secara idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Makna υἱὸς Φαρισαίων
  choice: keturunan orang-orang Farisi
  alternative: anak dari orang tua Farisi
  rationale: Bentuk jamak Yunani memungkinkan rujukan kepada orang tua atau garis keturunan. Pilihan utama tidak mempersempit klaim historis Paulus melebihi teks.
- issue: Hubungan antara 'pengharapan' dan 'kebangkitan'
  choice: pengharapan dan kebangkitan orang mati
  alternative: pengharapan akan kebangkitan orang mati
  rationale: Teks Yunani menghubungkan ἐλπίδος dan ἀναστάσεως dengan καί. Terjemahan utama mempertahankan kedua unsur yang dikoordinasikan; catatan kaki menyajikan kemungkinan bahwa keduanya membentuk satu gagasan terpadu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan memakai 'Saudara-saudara' dan pronomina 'saya' agar terdengar alami dalam sidang resmi. Semua penanda catatan kaki ditempatkan tepat pada unsur yang diterangkannya.
