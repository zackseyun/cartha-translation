  naturalness: Bahasa draft sudah baku dan jelas. “Dalam sidang Mahkamah Agama” lebih alami sekaligus lebih tepat daripada “di hadapan Mahkamah Agama.” Penggunaan “Saya” dan “Saudara-saudara” sesuai register pidato resmi modern.
  terminology: “Orang Saduki,” “orang Farisi,” “Mahkamah Agama,” “pengharapan,” dan “kebangkitan orang mati” dapat dipertahankan. “Keturunan orang-orang Farisi” adalah pemilihan Indonesia yang wajar untuk idiom υἱὸς Φαρισαίων, dengan catatan kaki yang mempertahankan kemungkinan maknanya.
