base_translation:
  language: en
  yaml_path: translation/nt/acts/023/035.yaml
  text: “I will hear your case,” he said[b][a], “when your accusers also arrive.” And he ordered that he be kept under guard in Herod’s praetorium.
translation:
  language: id
  text: “Aku akan mendengarkan perkaramu,” katanya, “ketika para penuduhmu juga tiba.” Lalu ia memerintahkan agar Paulus dijaga di pretorium[a] Herodes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pretorium adalah kediaman atau markas resmi gubernur Romawi; di sini kemungkinan yang dimaksud ialah istana Herodes di Kaisarea.
    reason: cultural_note
lexical_decisions:
- source_word: Διακούσομαί σου
  choice: Aku akan memeriksa perkaramu
  rationale: Dalam konteks hukum, διακούω berarti mendengarkan atau memeriksa suatu perkara secara tuntas. Ungkapan ini menyampaikan fungsi yudisialnya secara alami tanpa harus menambahkan kata 'sepenuhnya' dalam teks utama.
- source_word: ὅταν καὶ οἱ κατήγοροί σου παραγένωνται
  choice: setelah para pendakwamu juga tiba
  rationale: ὅταν dengan bentuk subjungtif menyatakan keadaan yang akan terjadi; dalam bahasa Indonesia, 'setelah ... tiba' secara alami menunjukkan bahwa pemeriksaan menunggu kedatangan para penuduh. κατήγοροι adalah para pendakwa atau penuduh dalam perkara hukum.
- source_word: κελεύσας
  choice: Lalu ia memerintahkan
  rationale: Partisip aoris ini diterjemahkan sebagai verba finit untuk menghasilkan narasi Indonesia yang lancar dan tetap menunjukkan urutan tindakan.
- source_word: ἐν τῷ πραιτωρίῳ τοῦ Ἡρῴδου
  choice: di dalam pretorium Herodes
  rationale: πραιτώριον adalah kediaman atau markas resmi gubernur Romawi. Istilah historis 'pretorium' dipertahankan, sedangkan catatan kaki menjelaskannya.
- source_word: φυλάσσεσθαι αὐτόν
  choice: agar Paulus tetap dijaga
  rationale: Bentuk pasif menunjukkan bahwa ia ditempatkan dalam penjagaan atau tahanan. Nama 'Paulus' dipakai untuk memperjelas acuan pronomina dalam bahasa Indonesia; 'tetap' menyampaikan keadaan penjagaan yang berlanjut tanpa menyiratkan hukuman.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Dialog memakai 'aku' sesuai ujaran langsung seorang pejabat kepada Paulus. Istilah hukum 'memeriksa perkara' dan 'pendakwa' dipilih agar konteks persidangan jelas; istilah historis 'pretorium' dipertahankan serta dijelaskan dalam catatan kaki.
