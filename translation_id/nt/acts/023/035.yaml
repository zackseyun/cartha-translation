  naturalness: Bahasa draf sudah jelas dan bermartabat. «Ketika para penuduhmu juga tiba» lebih dekat dengan sumber dan tetap alami dalam bahasa Indonesia modern. «Di pretorium Herodes» lebih idiomatis daripada «di dalam pretorium Herodes».
  terminology: «Pretorium» tepat sebagai istilah historis dan layak dipertahankan dengan catatan kaki. «Penuduh» merupakan padanan langsung dan netral untuk κατήγοροι; «pendakwa» dapat terdengar lebih teknis dan berpotensi mengesankan pejabat penuntut.
