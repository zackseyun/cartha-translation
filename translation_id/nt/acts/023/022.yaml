  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan hubungan antara pelepasan pemuda itu dan pesan kerahasiaan yang diberikan komandan.
