  text: ὁ μὲν οὖν χιλίαρχος ἀπέλυσε τὸν ⸀νεανίσκον παραγγείλας μηδενὶ ἐκλαλῆσαι ὅτι ταῦτα ἐνεφάνισας πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/022.yaml
  text: So the commander dismissed the young man[a], instructing him, “Tell no one that you have reported these things to me.”
translation:
  language: id
  text: Lalu komandan itu menyuruh pemuda tersebut pergi dan berpesan kepadanya, “Jangan beri tahu siapa pun bahwa kamu telah melaporkan hal-hal ini kepadaku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιλίαρχος
  choice: komandan
  rationale: Istilah ini menunjuk kepada perwira militer Romawi yang memimpin satuan setingkat kohor. “Komandan” jelas dan alami dalam bahasa Indonesia modern tanpa memasukkan gelar teknis yang mungkin kurang dikenal.
- source_word: ἀπέλυσε
  choice: menyuruh ... pergi
  rationale: Dalam konteks ini, sang perwira mengakhiri pertemuan dan mempersilakan atau menyuruh pemuda itu pergi. Ungkapan ini menghindari kesan bahwa ia sebelumnya ditahan, yang dapat timbul dari “membebaskan”.
- source_word: νεανίσκον
  choice: pemuda tersebut
  rationale: Kata ini menyebut seorang laki-laki muda. “Pemuda” ringkas, wajar, dan tidak memberi kesan terlalu muda seperti “anak laki-laki”.
- source_word: παραγγείλας
  choice: berpesan kepadanya
  rationale: Partisip ini menyatakan pemberian arahan yang berwibawa. “Berpesan” terdengar alami dalam konstruksi kalimat ini, sedangkan isi kutipan tetap menunjukkan larangan yang tegas.
- source_word: μηδενὶ ἐκλαλῆσαι
  choice: Jangan beri tahu siapa pun
  rationale: Ungkapan ini melarang pemuda itu mengungkapkan informasi tersebut kepada siapa pun. Terjemahan ini idiomatis dan langsung.
- source_word: ἐνεφάνισας
  choice: telah melaporkan
  rationale: Verba ini berarti memberitahukan atau menyampaikan sesuatu, khususnya kepada pihak yang berwenang. “Melaporkan” sesuai dengan konteks pemuda yang membawa informasi kepada komandan.
- source_word: ταῦτα
  choice: hal-hal ini
  rationale: Pilihan ini mempertahankan bentuk jamak demonstratif yang merujuk kepada informasi yang baru saja disampaikan.
- source_word: πρὸς ἐμέ
  choice: kepadaku
  rationale: Setelah verba penyampaian informasi, frasa ini secara idiomatis menunjukkan pihak yang menerima laporan.
