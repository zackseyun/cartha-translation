lexical_decisions:
- source_word: Κλαύδιος Λυσίας
  choice: Klaudius Lisias
  rationale: Nama pribadi ditransliterasikan menurut ejaan Indonesia yang lazim.
- source_word: τῷ κρατίστῳ
  choice: Yang Mulia
  rationale: Bentuk superlatif ini berfungsi sebagai sapaan kehormatan resmi bagi pejabat tinggi; “Yang Mulia” menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia modern.
- source_word: ἡγεμόνι
  choice: Gubernur
  rationale: Dalam konteks pemerintahan provinsi Romawi, istilah ini menunjuk kepada pejabat pemerintahan; “Gubernur” adalah padanan yang jelas tanpa menetapkan jabatan teknis yang lebih khusus daripada teks sumber.
- source_word: Φήλικι
  choice: Feliks
  rationale: Nama pribadi ditransliterasikan sesuai kaidah ejaan Indonesia.
- source_word: χαίρειν
  choice: Salam
  rationale: Dalam pembukaan surat, kata ini merupakan rumusan salam konvensional, bukan perintah harfiah untuk bersukacita.
