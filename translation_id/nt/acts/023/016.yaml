  text: Ἀκούσας δὲ ὁ υἱὸς τῆς ἀδελφῆς Παύλου ⸂τὴν ἐνέδραν⸃ παραγενόμενος καὶ εἰσελθὼν εἰς τὴν παρεμβολὴν ἀπήγγειλεν τῷ Παύλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/016.yaml
  text: But when Paul’s sister’s son heard of the ambush[c][b][a], he came and entered the barracks and reported it to Paul.
translation:
  language: id
  text: Namun, ketika anak laki-laki dari saudara perempuan Paulus mendengar tentang penyergapan itu[b], ia datang, masuk ke markas[c], lalu melaporkannya kepada Paulus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Atau “rencana” atau “persekongkolan.” Kata Yunani yang dipakai lebih khusus berarti penyergapan, atau bersembunyi sambil menunggu untuk menyerang.
    reason: lexical_alternative
  - marker: c
    text: Atau “perkemahan.” Dalam konteks ini, istilah tersebut kemungkinan besar menunjuk pada markas pasukan Romawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: ketika ... mendengar
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama; bentuk temporal ini alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: 'Partikel ini menandai perkembangan narasi dengan kontras ringan: rencana penyergapan beralih kepada terbongkarnya rencana itu.'
- source_word: ὁ υἱὸς τῆς ἀδελφῆς Παύλου
  choice: anak laki-laki dari saudara perempuan Paulus
  rationale: Ungkapan ini mempertahankan hubungan keluarga yang dinyatakan secara eksplisit dalam bahasa Yunani, tanpa menggantinya dengan istilah kekerabatan yang lebih ringkas.
- source_word: τὴν ἐνέδραν
  choice: penyergapan itu
  rationale: ἐνέδρα secara khusus menunjuk pada tindakan menghadang atau menunggu diam-diam untuk menyerang; 'penyergapan' mempertahankan gambaran konkretnya.
- source_word: παραγενόμενος
  choice: ia datang
  rationale: Partisip ini menyatakan kedatangan sebelum tindakan masuk; klausa mandiri menghasilkan urutan yang wajar dalam bahasa Indonesia.
- source_word: εἰσελθὼν εἰς τὴν παρεμβολὴν
  choice: masuk ke markas
  rationale: παρεμβολή dapat berarti perkemahan atau kompleks militer. Dalam konteks pasukan Romawi di Yerusalem, 'markas' merupakan padanan alami yang mencakup tempat pasukan bermarkas.
- source_word: ἀπήγγειλεν
  choice: melaporkannya
  rationale: Verba ini menyatakan penyampaian atau pelaporan informasi; akhiran '-nya' merujuk secara alami kepada penyergapan yang baru disebutkan.
- source_word: τῷ Παύλῳ
  choice: kepada Paulus
  rationale: Dativus objek tak langsung diterjemahkan secara langsung dengan 'kepada'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Susunan partisip Yunani diubah menjadi rangkaian klausa yang alami, sementara hubungan waktu dan urutan tindakannya dipertahankan. Tidak digunakan catatan [a] karena teks utama sudah menerjemahkan ungkapan kekerabatan Yunani secara eksplisit, sehingga alternatif 'keponakan Paulus' tidak diperlukan untuk menjelaskan makna.
