  text: Καὶ προσκαλεσάμενός ⸂τινας δύο⸃ τῶν ἑκατονταρχῶν εἶπεν· Ἑτοιμάσατε στρατιώτας διακοσίους ὅπως πορευθῶσιν ἕως Καισαρείας, καὶ ἱππεῖς ἑβδομήκοντα καὶ δεξιολάβους διακοσίους, ἀπὸ τρίτης ὥρας τῆς νυκτός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/023.yaml
  text: And calling two of the centurions to him[a], he said, “Prepare two hundred soldiers to go as far as Caesarea, and seventy horsemen and two hundred spearmen[b], at the third hour of the night.”
translation:
  language: id
  text: Lalu ia memanggil dua orang perwira pasukan seratus dan berkata, “Siapkan dua ratus prajurit, tujuh puluh prajurit berkuda, dan dua ratus prajurit bersenjatakan tombak[a] untuk berangkat sampai ke Kaisarea mulai jam ketiga malam[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dua ratus pengawal tangan kanan”; arti tepat istilah langka yang diterjemahkan “prajurit bersenjatakan tombak” ini tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Artinya, kira-kira tiga jam sesudah malam mulai, sekitar pukul 21.00 menurut perhitungan waktu Yahudi.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενός
  choice: memanggil ... dan berkata
  rationale: Partisip aoris ini mendahului kata kerja utama εἶπεν. Susunan tersebut dialihkan secara alami ke dalam bahasa Indonesia sebagai dua tindakan berurutan.
- source_word: τινας δύο τῶν ἑκατονταρχῶν
  choice: dua orang perwira pasukan seratus
  rationale: τινας δύο secara wajar berarti 'dua orang', sedangkan ἑκατοντάρχης menunjuk pada perwira Romawi yang mengepalai satuan sekitar seratus prajurit. Ungkapan ini mempertahankan ciri pangkatnya tanpa memakai istilah serapan yang kurang umum.
- source_word: Ἑτοιμάσατε
  choice: Siapkan
  rationale: Bentuk imperatif ini merupakan perintah militer langsung; 'Siapkan' ringkas, jelas, dan sesuai dengan ragam narasi yang bermartabat.
- source_word: στρατιώτας διακοσίους
  choice: dua ratus prajurit
  rationale: Padanan langsung yang tetap membedakan kelompok prajurit umum ini dari pasukan berkuda dan δεξιολάβοι.
- source_word: ὅπως πορευθῶσιν
  choice: untuk berangkat
  rationale: ὅπως dengan bentuk subjungtif menyatakan tujuan. 'Untuk berangkat' menyampaikan daya purposifnya secara alami dalam bahasa Indonesia.
- source_word: ἕως Καισαρείας
  choice: sampai ke Kaisarea
  rationale: ἕως dengan genitif menyatakan batas atau jangkauan perjalanan hingga suatu tempat; 'sampai ke' mempertahankan nuansa tersebut.
- source_word: ἱππεῖς ἑβδομήκοντα
  choice: tujuh puluh pasukan berkuda
  rationale: ἱππεῖς menunjuk pada prajurit berkuda. Padanan ini jelas bagi pembaca modern dan sesuai dengan konteks militer.
- source_word: δεξιολάβους διακοσίους
  choice: dua ratus prajurit bersenjatakan tombak
  rationale: δεξιολάβος adalah istilah militer yang langka dan makna tepatnya diperdebatkan. Padanan ini menyajikan salah satu pemahaman yang lazim, sementara ketidakpastiannya dinyatakan dalam catatan kaki.
- source_word: ἀπὸ τρίτης ὥρας τῆς νυκτός
  choice: mulai jam ketiga malam
  rationale: ἀπό secara dasar berarti 'mulai dari' dan di sini menandai waktu dimulainya keberangkatan. Ungkapan waktu kuno dipertahankan dalam teks, dengan perkiraan modern dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah pangkat Romawi dijelaskan secara fungsional sebagai 'perwira pasukan seratus'. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskannya; ketidakpastian leksikal δεξιολάβους dipertahankan, dan ungkapan waktu kuno tidak diganti dengan waktu modern di dalam teks utama.
