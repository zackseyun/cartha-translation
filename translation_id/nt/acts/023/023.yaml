    rationale: Dalam teks draft, "untuk berangkat sampai ke Kaisarea" muncul segera setelah "dua ratus prajurit", sehingga dapat dipahami hanya kelompok itu yang berangkat. Teks Yunani mencantumkan tiga kelompok sebagai persiapan untuk perjalanan yang sama, dengan keterangan waktu sesudah daftar tersebut.
  - severity: low
    issue: '"Tujuh puluh pasukan berkuda" kurang tepat secara kolokasional'
    rationale: 'Numeralia tujuh puluh lebih alami menerangkan individu prajurit: "tujuh puluh prajurit berkuda".'
  - severity: low
