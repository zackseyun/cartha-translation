  naturalness: Bahasa surat secara keseluruhan baku dan sesuai register resmi. "Setelah aku diberi tahu" lebih lancar daripada "Ketika diberitahukan kepadaku," dan "mengajukan tuduhan mereka terhadapnya" lebih alami serta jelas dalam konteks peradilan.
