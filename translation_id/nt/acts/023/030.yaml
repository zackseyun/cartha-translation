base_translation:
  language: en
  yaml_path: translation/nt/acts/023/030.yaml
  text: And when I was informed that there would be a plot against the man[a], I sent him to you at once, also ordering his accusers to state their case before you.
translation:
  language: id
  text: Setelah aku diberi tahu bahwa akan ada rencana jahat terhadap orang itu, aku segera mengirimnya kepadamu. Aku juga memerintahkan para penuduhnya untuk mengajukan tuduhan mereka terhadapnya di hadapanmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbicara kepada/melawan dia di hadapanmu,” sebuah ungkapan dalam konteks pengadilan; dapat juga diterjemahkan, “menyampaikan perkara mereka terhadapnya di hadapanmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηνυθείσης
  choice: Ketika diberitahukan kepadaku
  rationale: Klausa absolut genitif aoristus pasif ini secara alami dinyatakan sebagai anak kalimat waktu dalam bahasa Indonesia dan tetap mempertahankan makna pasif.
- source_word: ἐπιβουλῆς
  choice: rencana jahat
  rationale: Kata ini menunjuk pada rencana atau siasat yang bermaksud mencelakakan. Pilihan ini tidak mempersempit makna menjadi penyergapan tertentu.
- source_word: εἰς τὸν ἄνδρα
  choice: terhadap orang itu
  rationale: Preposisi menunjukkan arah permusuhan, sedangkan 'orang itu' mempertahankan penyebutan ἀνήρ dengan artikel dan merujuk kepada Paulus.
- source_word: ἔσεσθαι
  choice: akan ada
  rationale: Infinitif futur ini menyatakan keberadaan rencana jahat yang akan terjadi dalam isi laporan.
- source_word: ἐξαυτῆς
  choice: segera
  rationale: Adverbia ini menyatakan tindakan tanpa penundaan.
- source_word: ἔπεμψα πρὸς σέ
  choice: aku ... mengirimnya kepadamu
  rationale: Objek tersiratnya adalah Paulus; pronomina objek diperlukan agar ungkapan alami dan jelas dalam bahasa Indonesia.
- source_word: παραγγείλας
  choice: Aku juga memerintahkan
  rationale: Partisip aoristus menyatakan tindakan yang menyertai pengiriman. Kalimat baru menghasilkan bahasa Indonesia yang lebih alami tanpa menghilangkan hubungan tambahan yang ditandai καί.
- source_word: κατηγόροις
  choice: para penuduhnya
  rationale: Konteks menunjukkan bahwa mereka adalah para penuduh Paulus; akhiran '-nya' memperjelas acuan.
- source_word: λέγειν πρὸς αὐτὸν
  choice: menyampaikan perkara mereka terhadap dia
  rationale: Ungkapan harfiahnya 'berbicara kepada/melawan dia' memiliki nuansa ruang pengadilan. Terjemahan ini menyampaikan tindakan mengemukakan dakwaan tanpa menetapkan bentuk hukum yang lebih khusus daripada teks.
- source_word: ἐπὶ σοῦ
  choice: di hadapanmu
  rationale: Dalam konteks yudisial, frasa ini berarti menghadap otoritas Feliks untuk menyampaikan perkara.
