id: ACT.23.10
reference: Acts 23:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀γινομένης στάσεως ⸀φοβηθεὶς ὁ χιλίαρχος μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν ἐκέλευσεν τὸ στράτευμα ⸀καταβὰν ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν, ἄγειν ⸀τε εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/010.yaml
  text: And when a great dispute arose[a], the commander, fearing that Paul might be torn apart by them, ordered the troops to go down, seize him from among them[c][b], and bring him into the barracks.
translation:
  language: id
  text: Ketika perselisihan besar terjadi[a], komandan itu, karena takut Paulus akan dicabik-cabik oleh mereka[b], memerintahkan pasukan itu untuk turun, merebut Paulus dari antara mereka, dan membawanya ke barak[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pertentangan besar” atau “kegemparan besar”. Kata Yunani στάσις dapat menunjuk pada perselisihan atau pertentangan yang tajam dan, dalam konteks tertentu, kerusuhan atau pemberontakan.
    reason: lexical_alternative
  - marker: b
    text: Atau “dicabik sampai hancur oleh mereka”. Kata Yunani διασπάω menggambarkan tindakan kekerasan yang dapat merobek atau mencabik seseorang.
    reason: lexical_alternative
  - marker: c
    text: Kata Yunani παρεμβολή dapat berarti “perkemahan”; di sini yang dimaksud ialah barak atau tempat pasukan Romawi ditempatkan di Yerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: πολλῆς ... γινομένης στάσεως
  choice: Ketika keributan besar terjadi
  rationale: Konstruksi genitif absolut diterjemahkan sebagai klausa keadaan. Dalam konteks perselisihan yang sudah mengarah pada kekerasan, "keributan besar" menyampaikan intensitas πολλῆς dan rentang makna στάσις tanpa menyiratkan pemberontakan resmi.
- source_word: φοβηθεὶς
  choice: karena takut
  rationale: Partisip aoristus ini menyatakan alasan tindakan komandan; bentuk kausal alami dalam bahasa Indonesia.
- source_word: ὁ χιλίαρχος
  choice: komandan itu
  rationale: Istilah ini menunjuk pada perwira Romawi yang memimpin satuan besar. "Komandan" jelas bagi pembaca modern, sedangkan artikel diterjemahkan dengan "itu" karena tokohnya sudah dikenal dari konteks.
- source_word: μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν
  choice: Paulus akan dicabik-cabik oleh mereka
  rationale: '"Dicabik-cabik" mempertahankan gambaran keras διασπάω. Dalam konstruksi sesudah verba takut, "akan" menyatakan hasil yang dikhawatirkan, bukan kepastian.'
- source_word: ἐκέλευσεν
  choice: memerintahkan
  rationale: Padanan langsung dan alami dalam konteks komando militer.
- source_word: τὸ στράτευμα
  choice: pasukan
  rationale: Kata ini bersifat kolektif dan menunjuk pada para prajurit di bawah komando perwira tersebut.
- source_word: καταβὰν
  choice: turun
  rationale: Mempertahankan gerak spasial dari kawasan benteng ke tempat persidangan yang lebih rendah; dalam bahasa Indonesia, verba ini secara alami mengikuti "memerintahkan pasukan".
- source_word: ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν
  choice: merebut Paulus dari tengah-tengah mereka
  rationale: '"Merebut" menyampaikan tindakan pengambilan paksa ἁρπάζω, sedangkan "dari tengah-tengah mereka" mempertahankan ungkapan sumber dalam bahasa Yunani.'
- source_word: ἄγειν τε
  choice: dan membawanya
  rationale: Menyampaikan tindakan mengawal Paulus menuju tempat tujuan secara alami.
- source_word: παρεμβολήν
  choice: markas
  rationale: Secara harfiah dapat berarti perkemahan, tetapi dalam konteks Yerusalem menunjuk pada tempat pasukan Romawi bermarkas; "markas" alami dan tidak memberi kesan perkemahan terbuka.
