  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ποιήσαντες ⸂συστροφὴν οἱ Ἰουδαῖοι⸃ ἀνεθεμάτισαν ἑαυτοὺς λέγοντες μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/012.yaml
  text: When day came[a], the Jews formed a conspiracy and bound themselves under a curse[b], saying that they would neither eat nor drink until they had killed Paul.
translation:
  language: id
  text: Ketika hari mulai terang, orang-orang Yahudi[a] bersekongkol dan mengikat diri mereka dengan sumpah kutuk[b]. Mereka berkata bahwa mereka tidak akan makan atau minum sampai mereka membunuh Paulus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks ini, “orang-orang Yahudi” merujuk pada kelompok tertentu yang terlibat dalam persekongkolan tersebut, bukan seluruh orang Yahudi.
    reason: cultural_note
  - marker: b
    text: Atau “menempatkan diri mereka di bawah kutuk.” Maksudnya, mereka bersumpah dengan memohon agar hukuman menimpa diri mereka sendiri jika sumpah itu tidak dipenuhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Ketika hari tiba
  rationale: Konstruksi genitif absolut menandai peralihan waktu. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan arti umum ‘ketika hari datang/menjadi siang’ tanpa mempersempitnya menjadi waktu pagi tertentu.
- source_word: ποιήσαντες συστροφὴν
  choice: mengadakan persekongkolan
  rationale: Gabungan ini menunjuk pada pembentukan komplotan atau rencana bersama. ‘Persekongkolan’ menyampaikan koordinasi rahasia untuk membunuh Paulus, bukan sekadar kerumunan.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Terjemahan mempertahankan sebutan eksplisit dalam teks Yunani. Catatan kaki menjelaskan bahwa dalam konteks ini acuannya adalah kelompok tertentu, bukan seluruh orang Yahudi.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: mengikat diri dengan sumpah kutuk
  rationale: Ungkapan ini menyatakan sumpah yang disertai kutuk atas diri sendiri apabila sumpah itu tidak dipenuhi. Pilihan ini mempertahankan unsur ikatan sumpah dan kutuk tanpa memakai istilah ‘menganatema’ yang kurang lazim.
- source_word: λέγοντες μήτε φαγεῖν μήτε πιεῖν
  choice: Mereka menyatakan bahwa mereka tidak akan makan ataupun minum
  rationale: Konstruksi infinitif menyampaikan isi sumpah. Pasangan ‘tidak ... ataupun ...’ mempertahankan kedua penyangkalan dengan bahasa Indonesia yang alami.
- source_word: ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον
  choice: sampai mereka membunuh Paulus
  rationale: Klausa ini menyatakan batas berlakunya pantangan mereka. Bentuk Indonesia ini mempertahankan hubungan temporal dan tujuan pembunuhan secara langsung.
theological_decisions:
- issue: Cakupan sebutan ‘orang-orang Yahudi’
  choice: Mempertahankan ‘orang-orang Yahudi’ dalam teks utama dengan penjelasan kontekstual dalam catatan kaki
  alternative: Mengganti teks utama dengan ‘beberapa orang Yahudi’ atau ‘para pemimpin Yahudi’
  rationale: Teks Yunani memakai bentuk οἱ Ἰουδαῖοι tanpa pembatas eksplisit, tetapi konteks ayat berikutnya menunjukkan kelompok pelaku tertentu. Catatan kaki menjaga bentuk sumber sekaligus mencegah generalisasi terhadap seluruh bangsa Yahudi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Persekongkolan’ dipilih untuk rencana rahasia yang terorganisasi, sedangkan ‘sumpah kutuk’ mempertahankan bobot ungkapan Yunani dengan penjelasan dalam catatan kaki.
