  yaml_path: translation/nt/acts/023/004.yaml
  text: Those standing nearby said[a], “Are you insulting God’s high priest?”
translation:
  language: id
  text: Orang-orang yang berdiri di situ berkata, “Apakah kamu menghina Imam Besar Allah?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ παρεστῶτες
  choice: Orang-orang yang berdiri di dekat Paulus
  rationale: Partisipel berartikel ini berfungsi sebagai nomina dan menunjuk kepada orang-orang yang berdiri di dekatnya. Nama Paulus ditambahkan sebagai rujukan implisit agar ungkapan Indonesia jelas dan alami tanpa mengubah pelaku.
- source_word: εἶπαν
  choice: berkata
  rationale: Bentuk aoristus indikatif memajukan narasi dan paling wajar diterjemahkan dengan bentuk lampau naratif yang dalam bahasa Indonesia cukup dinyatakan sebagai 'berkata'.
- source_word: ἀρχιερέα
  choice: Imam Besar
  rationale: Dalam konteks ini istilah tersebut menunjuk pada jabatan imam besar Yahudi; 'Imam Besar' merupakan padanan Indonesia yang baku dan tepat.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Genitif ini menyatakan hubungan jabatan imam besar dengan Allah. Susunan 'Imam Besar Allah' ringkas dan alami serta tidak menambahkan penilaian terhadap perilaku orang yang memegang jabatan itu.
- source_word: λοιδορεῖς
  choice: menghina
  rationale: Kata kerja ini berarti mencaci, mencela, atau menghina dengan perkataan. 'Menghina' jelas bagi pembaca modern dan sesuai dengan pertanyaan bernada teguran.
theological_decisions:
- issue: Daya makna τοῦ θεοῦ sehubungan dengan imam besar
  choice: Imam Besar Allah
  alternative: imam besar milik Allah; imam besar dari Allah
  rationale: Frasa ini menghubungkan jabatan imam besar dengan Allah, tetapi tidak dengan sendirinya menyatakan persetujuan ilahi atas perilaku pribadi pemegang jabatan tersebut. Terjemahan mempertahankan hubungan itu tanpa menambahkan klaim teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pertanyaan langsung dipertahankan sebagai teguran. Huruf kapital pada 'Imam Besar' menandai jabatan khusus dalam konteks ini.
