  text: Οἱ μὲν οὖν στρατιῶται κατὰ τὸ διατεταγμένον αὐτοῖς ἀναλαβόντες τὸν Παῦλον ἤγαγον ⸀διὰ νυκτὸς εἰς τὴν Ἀντιπατρίδα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/031.yaml
  text: So the soldiers[a], according to what had been ordered them[b], took Paul and brought him by night to Antipatris.
translation:
  language: id
  text: Maka, sesuai dengan perintah yang telah diberikan kepada mereka, para prajurit mengambil Paulus dan membawanya pada malam hari ke Antipatris.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ μὲν οὖν στρατιῶται
  choice: Maka para prajurit
  rationale: οὖν melanjutkan alur narasi dengan nuansa konsekuensi, sedangkan μέν menyiapkan kontras dengan ayat berikutnya dan tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia.
- source_word: κατὰ τὸ διατεταγμένον αὐτοῖς
  choice: sesuai dengan perintah yang telah diberikan kepada mereka
  rationale: 'Frasa ini mempertahankan makna partisipel perfek pasif substantival: perintah itu telah diberikan sebelumnya kepada para prajurit.'
- source_word: ἀναλαβόντες τὸν Παῦλον ἤγαγον
  choice: membawa Paulus
  rationale: Partisipel ἀναλαβόντες menyatakan tindakan yang mengiringi dan mendahului ἤγαγον. Dalam bahasa Indonesia, satu ungkapan 'membawa Paulus' menyampaikan tindakan membawa serta mengantarnya ke tujuan tanpa konstruksi yang kaku atau pengulangan.
- source_word: διὰ νυκτός
  choice: pada malam hari
  rationale: Ungkapan διά dengan genitif νυκτός menyatakan waktu berlangsungnya tindakan. 'Pada malam hari' alami dan tidak menyiratkan bahwa perjalanan berlangsung sepanjang malam.
- source_word: Ἀντιπατρίδα
  choice: Antipatris
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
