  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἵτινες προσελθόντες τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις εἶπαν· Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς μηδενὸς γεύσασθαι ἕως οὗ ἀποκτείνωμεν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/014.yaml
  text: These men came to the chief priests and the elders and said[a], “We have bound ourselves under a curse to taste nothing until we kill Paul.”
translation:
  language: id
  text: Mereka mendatangi imam-imam kepala dan para tua-tua lalu berkata, “Kami telah mengikat diri dengan sumpah yang disertai kutuk atas diri sendiri[a] untuk tidak mencicipi apa pun sampai kami membunuh Paulus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Kami telah mengikat diri dengan kutuk.” Bahasa Yunani menyatakan sumpah yang mengundang kutuk atas diri sendiri jika sumpah itu dilanggar.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Mereka
  rationale: Kata ganti relatif ini merujuk kepada para anggota persekongkolan pada ayat sebelumnya. “Mereka” wajar dalam narasi Indonesia dan mempertahankan rujukannya tanpa penjelasan berlebihan.
- source_word: προσελθόντες
  choice: mendatangi
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului kata kerja utama “berkata”; “mendatangi” ringkas dan alami.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: imam-imam kepala
  rationale: Ini adalah padanan Indonesia yang lazim bagi kelompok pemimpin imam dalam konteks Yahudi zaman Bait Allah Kedua.
- source_word: τοῖς πρεσβυτέροις
  choice: para tua-tua
  rationale: Dalam konteks kelembagaan ini, istilah tersebut menunjuk kepada pemimpin yang diakui, bukan sekadar laki-laki lanjut usia.
- source_word: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: Kami telah mengikat diri di bawah kutuk
  rationale: Gabungan nomina dan verba serumpun menekankan sumpah yang menyertakan kutuk atas diri sendiri. Ungkapan ini menyampaikan daya ikat dan keseriusannya tanpa memakai jargon gerejawi “anathema”.
- source_word: μηδενὸς γεύσασθαι
  choice: untuk tidak mencicipi apa pun
  rationale: Terjemahan ini dekat dengan arti harfiah γεύομαι dan mempertahankan penekanan μηδενός, meskipun dalam konteks ini maksud praktisnya ialah tidak makan atau minum apa pun.
- source_word: ἕως οὗ
  choice: sebelum
  rationale: Dalam bahasa Indonesia, konstruksi negatif “tidak ... sebelum” secara alami menyatakan batas waktu sumpah tersebut.
- source_word: ἀποκτείνωμεν
  choice: kami membunuh
  rationale: Aoris subjungtif menyatakan peristiwa yang hendak dicapai. “Membunuh” adalah padanan langsung dan tidak menambahkan kategori hukum yang tidak dinyatakan oleh verba Yunani.
- source_word: τὸν Παῦλον
  choice: Paulus
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Makna rumusan sumpah Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: Kami telah mengikat diri di bawah kutuk
  alternative: Kami telah menjatuhkan kutuk atas diri kami sendiri
  rationale: Pilihan utama mempertahankan unsur ikatan sumpah sekaligus kutuk yang akan menimpa diri mereka bila sumpah dilanggar, tanpa mengimpor pengertian teknis “anathema” dari tradisi gerejawi kemudian.
translation_notes:
  register: Bahasa naratif modern, lugas, dan bermartabat. Bentuk “imam-imam kepala” dan “para tua-tua” mempertahankan istilah kelembagaan yang dikenal pembaca Alkitab Indonesia. Penanda catatan kaki ditempatkan sesudah seluruh ucapan karena menjelaskan rumusan sumpah di dalamnya.
