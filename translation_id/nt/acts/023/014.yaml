  to: Mereka mendatangi imam-imam kepala dan para tua-tua lalu berkata, “Kami telah mengikat diri dengan sumpah yang disertai kutuk atas diri sendiri[a] untuk tidak mencicipi apa pun sampai kami membunuh Paulus.”
  rationale: Revisi memperjelas idiom sumpah berkutuk dalam bahasa Indonesia modern, sambil mempertahankan intensitas ungkapan Yunani, ketidakspesifikan objek “apa pun,” dan batas waktu “sampai kami membunuh Paulus.” Penanda catatan kaki dipindahkan ke rumusan sumpah yang dijelaskannya.
