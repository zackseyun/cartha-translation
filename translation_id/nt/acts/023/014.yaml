review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat mengenali para pelaku sebagai para persekongkol dari ayat sebelumnya, kelompok pemimpin Yahudi sebagai imam-imam kepala dan tua-tua, serta isi sumpah untuk berpantang sampai Paulus dibunuh. Namun, “mengikat diri di bawah kutuk” kurang jelas menyatakan bahwa kutuk itu merupakan sanksi yang mereka kenakan atas diri sendiri dalam sumpah tersebut.
  naturalness: “Mengikat diri di bawah kutuk” tidak sepenuhnya idiomatis dalam bahasa Indonesia modern dan dapat terdengar seolah-olah mereka sudah berada dalam keadaan terkutuk. “Mengikat diri dengan sumpah yang disertai kutuk atas diri sendiri” lebih alami dan secara eksplisit menyampaikan daya self-imprecatory dari rumusan Yunani.
  terminology: “Imam-imam kepala,” “para tua-tua,” dan “Paulus” sesuai dengan penggunaan Alkitab bahasa Indonesia. “Tidak mencicipi apa pun” mempertahankan pilihan leksikal dekat γεύσασθαι; catatan kaki perlu menjelaskan bahwa ini adalah sumpah dengan kutuk atas diri sendiri, bukan sekadar tindakan ‘mengutuk diri.’
  issues:
  - severity: medium
    issue: Rumusan sumpah “mengikat diri di bawah kutuk” kurang idiomatis dan kurang eksplisit tentang kutuk atas diri sendiri.
    rationale: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτούς adalah ungkapan intensif mengenai pengikatan diri dengan sumpah yang mengundang kutuk atas diri sendiri bila sumpah itu gagal. Revisi mempertahankan kedua unsur—sumpah yang mengikat dan kutuk—tanpa memakai makna teknis gerejawi kemudian dari “anathema.”
  - severity: low
    issue: Keterangan catatan kaki “mengutuk diri kami dengan kutuk” bukan penjelasan harfiah yang paling tepat dalam bahasa Indonesia.
    rationale: Verba serumpun itu dalam konteks ini mengungkapkan pengikatan diri melalui sumpah berkutuk, bukan terutama tindakan mengucapkan kutuk. Catatan yang direvisi menjelaskan fungsi idiomatisnya secara lebih akurat.
  revised_text: Mereka mendatangi imam-imam kepala dan para tua-tua lalu berkata, “Kami telah mengikat diri dengan sumpah yang disertai kutuk atas diri sendiri[a] untuk tidak mencicipi apa pun sampai kami membunuh Paulus.”
