  text: Σαδδουκαῖοι ⸀μὲν γὰρ λέγουσιν μὴ εἶναι ἀνάστασιν ⸀μήτε ἄγγελον μήτε πνεῦμα, Φαρισαῖοι δὲ ὁμολογοῦσιν τὰ ἀμφότερα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/008.yaml
  text: For the Sadducees say there is no resurrection[a], nor angel nor spirit, but the Pharisees acknowledge both.
translation:
  language: id
  text: Sebab orang-orang Saduki mengatakan bahwa tidak ada kebangkitan, tidak ada malaikat ataupun roh, tetapi orang-orang Farisi mengakui keduanya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang Farisi mengakui ketiganya”—yaitu kebangkitan, malaikat, dan roh. Teks Yunani berbunyi “keduanya”, yang paling langsung menunjuk pada “malaikat” dan “roh”, tetapi sebagian orang memahaminya secara lebih luas berdasarkan konteks.
    reason: Mempertahankan kemungkinan perbedaan cakupan kata Yunani τὰ ἀμφότερα.
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: orang-orang Saduki
  rationale: Bentuk baku dan alami dalam bahasa Indonesia untuk nama kelompok Yahudi ini.
- source_word: μὲν γὰρ
  choice: Sebab
  rationale: Menyampaikan fungsi penjelas atau kausal frasa tersebut dalam hubungan dengan konteks sebelumnya.
- source_word: λέγουσιν
  choice: mengatakan
  rationale: Padanan langsung untuk verba kini yang melaporkan keyakinan umum kelompok tersebut.
- source_word: μὴ εἶναι
  choice: tidak ada
  rationale: Ungkapan idiomatis bahasa Indonesia untuk penyangkalan keberadaan dalam klausa infinitif Yunani.
- source_word: ἀνάστασιν
  choice: kebangkitan
  rationale: Mengacu pada kebangkitan sebagai kenyataan atau ajaran, tanpa membatasinya pada satu peristiwa tertentu.
- source_word: μήτε ἄγγελον μήτε πνεῦμα
  choice: tidak ada malaikat ataupun roh
  rationale: Mempertahankan penyangkalan berpasangan dan nomina tunggal dalam bahasa Indonesia yang alami.
- source_word: Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Bentuk baku dan mudah dipahami untuk nama kelompok Yahudi ini.
- source_word: ὁμολογοῦσιν
  choice: mengakui
  rationale: Dalam konteks ini berarti menerima atau menegaskan sebagai benar; pilihan ini tidak memberi nuansa pengakuan dosa.
- source_word: τὰ ἀμφότερα
  choice: keduanya
  rationale: Menerjemahkan secara langsung bentuk Yunani yang berarti 'kedua-duanya' dan paling dekat menunjuk pada pasangan 'malaikat' dan 'roh', sambil mempertahankan kemungkinan cakupan lain dalam catatan kaki.
theological_decisions:
- issue: Cakupan kata τὰ ἀμφότερα ('keduanya') dalam pengakuan orang Farisi
  choice: Teks utama mempertahankan 'keduanya', yang paling langsung menunjuk pada malaikat dan roh.
  alternative: 'Orang-orang Farisi mengakui ketiganya: kebangkitan, malaikat, dan roh.'
  rationale: Bahasa Yunani memakai bentuk 'keduanya', bukan 'semuanya' atau 'ketiganya'. Namun, konteks yang lebih luas mencakup kebangkitan sebagai keyakinan orang Farisi, sehingga kemungkinan pengertian yang lebih luas dicatat tanpa dimasukkan secara diam-diam ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'tidak ada' memperjelas tiga penyangkalan, sedangkan 'ataupun' menjaga hubungan erat antara malaikat dan roh. Penanda catatan kaki [a] ditempatkan setelah 'kebangkitan' sesuai lapisan konsultasi, walaupun catatan menjelaskan cakupan 'keduanya' pada akhir ayat.
