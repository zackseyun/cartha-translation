  text: ἀναγνοὺς ⸀δὲ καὶ ἐπερωτήσας ἐκ ποίας ⸀ἐπαρχείας ἐστὶν καὶ πυθόμενος ὅτι ἀπὸ Κιλικίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/034.yaml
  text: After reading it and asking what province he was from[a], and learning that he was from Cilicia,
translation:
  language: id
  text: Setelah membaca surat itu dan bertanya dari provinsi mana Paulus berasal, lalu mengetahui bahwa ia berasal dari Kilikia,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγνοὺς
  choice: Setelah membaca surat itu
  rationale: Partisip aoris menunjukkan tindakan yang mendahului pertanyaan. Objeknya tidak dinyatakan dalam bahasa Yunani, tetapi konteks langsung menunjukkan bahwa yang dibaca adalah surat tersebut; penyebutan ini membuat bahasa Indonesia alami dan jelas.
- source_word: δὲ
  choice: —
  rationale: Partikel ini berfungsi sebagai penghubung ringan dalam alur narasi dan tidak memerlukan padanan tersendiri dalam bahasa Indonesia.
- source_word: καὶ ἐπερωτήσας
  choice: gubernur bertanya
  rationale: ἐπερωτάω menyatakan tindakan bertanya atau meminta keterangan. Subjek 'gubernur' disediakan dari konteks untuk menghindari rangkaian bentuk partisipial yang kaku dan untuk memperjelas pelaku.
- source_word: ἐκ ποίας ἐπαρχείας ἐστίν
  choice: dari provinsi mana Paulus berasal
  rationale: ἐπαρχία adalah provinsi administratif Romawi. Susunan ini alami dalam bahasa Indonesia dan mempertahankan makna asal atau yurisdiksi; nama Paulus disediakan dari konteks untuk memperjelas rujukan pronomina.
- source_word: καὶ πυθόμενος
  choice: Ketika mengetahui
  rationale: Partisip πυνθάνομαι menyatakan memperoleh atau mengetahui informasi. 'Ketika mengetahui' mempertahankan urutan naratif dan menghubungkan anak kalimat ini dengan kelanjutan pada ayat berikutnya.
- source_word: ὅτι ἀπὸ Κιλικίας
  choice: bahwa ia berasal dari Kilikia
  rationale: ἀπό dengan nama tempat menunjukkan asal. Kopula dan subjek tersirat dilengkapi secara alami dalam bahasa Indonesia.
- source_word: Κιλικίας
  choice: Kilikia
  rationale: Bentuk nama wilayah yang lazim dalam bahasa Indonesia untuk provinsi Romawi Cilicia.
