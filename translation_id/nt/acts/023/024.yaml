translation:
  language: id
  text: Sediakan juga hewan-hewan[a], supaya mereka dapat menaikkan Paulus ke atas salah satu hewan itu dan membawanya dengan selamat kepada Gubernur Feliks.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hewan tunggangan” atau “binatang beban”; kata Yunani tidak menentukan jenis hewannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήνη
  choice: hewan tunggangan
  rationale: κτήνη menunjuk secara umum pada hewan untuk ditunggangi atau mengangkut beban tanpa menentukan jenisnya; pilihan ini mempertahankan keluasan makna tersebut dan sesuai dengan konteks menaikkan Paulus.
- source_word: τε
  choice: juga
  rationale: τε menghubungkan perintah ini dengan rangkaian perintah sebelumnya; “juga” menyampaikan kesinambungan itu secara wajar dalam bahasa Indonesia.
- source_word: παραστῆσαι
  choice: sediakan
  rationale: Dalam konteks perintah, infinitif ini berarti menghadirkan atau menyiapkan sesuatu agar tersedia; “sediakan” menyampaikan fungsi praktisnya dengan jelas.
- source_word: ἵνα
  choice: supaya
  rationale: ἵνα memperkenalkan tujuan dari penyediaan hewan-hewan tersebut.
- source_word: ἐπιβιβάσαντες
  choice: menaikkan Paulus ke atasnya
  rationale: 'Partisip ini bersifat kausatif: para prajurit membuat Paulus naik ke atas hewan tunggangan. Susunan dengan “dan” mengungkapkan urutan tindakan secara alami tanpa menghilangkan hubungan maknanya.'
- source_word: διασώσωσι
  choice: membawanya dengan selamat
  rationale: διασώσωσι menekankan bahwa Paulus dibawa hingga tiba dengan aman, bukan sekadar dipindahkan atau diselamatkan secara abstrak.
- source_word: πρὸς
  choice: kepada
  rationale: Dengan sasaran berupa orang, πρός menyatakan gerak menuju atau dibawa menghadap orang tersebut.
- source_word: ἡγεμόνα
  choice: Gubernur
  rationale: ἡγεμών di sini adalah pejabat pemerintahan Romawi atas provinsi; “Gubernur” merupakan padanan yang jelas dan lazim.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk imperatif “Sediakan” mengikuti konteks perintah dari ayat sebelumnya. “Ke atasnya” merujuk pada kelompok hewan tunggangan tanpa menyiratkan bahwa Paulus menaiki semuanya sekaligus; konstruksi ini mempertahankan bentuk jamak sumber secara idiomatis.
