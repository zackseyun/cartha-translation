translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada laporan resmi. Bentuk 'Aku' mengikuti tuturan orang pertama dalam surat, sedangkan 'ia' menjaga gaya naratif yang bermartabat. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
