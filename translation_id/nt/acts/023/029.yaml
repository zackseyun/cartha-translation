  text: ὃν εὗρον ἐγκαλούμενον περὶ ζητημάτων τοῦ νόμου αὐτῶν, μηδὲν ⸀δὲ ἄξιον θανάτου ἢ δεσμῶν ⸂ἔχοντα ἔγκλημα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/029.yaml
  text: I found that he was being accused concerning questions of their law[b][a], but charged with nothing deserving death or imprisonment.
translation:
  language: id
  text: Aku mendapati bahwa ia dituduh sehubungan dengan persoalan-persoalan hukum mereka[a], tetapi ia tidak didakwa atas sesuatu pun yang layak dihukum mati atau dipenjarakan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengenai hal-hal yang diperselisihkan dalam hukum mereka.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “layak menerima kematian atau belenggu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαλούμενον
  choice: dituduh
  rationale: Partisip pasif ini menyatakan bahwa tuduhan diajukan terhadap Paulus; 'dituduh' alami dalam bahasa Indonesia dan tidak menyiratkan bahwa ia telah dinyatakan bersalah.
- source_word: περὶ ζητημάτων
  choice: mengenai persoalan-persoalan
  rationale: ζητήματα menunjuk pada persoalan atau pokok yang diperdebatkan. 'Persoalan-persoalan' mempertahankan keluasan makna tanpa secara berlebihan menentukan sifat sengketanya.
- source_word: τοῦ νόμου αὐτῶν
  choice: dalam hukum mereka
  rationale: Frasa genitif ini membatasi ranah persoalan tersebut. 'Hukum mereka' mempertahankan sudut pandang pejabat Romawi dan kata ganti αὐτῶν.
- source_word: μηδὲν ... ἄξιον θανάτου ἢ δεσμῶν
  choice: tidak ada satu pun ... yang membuatnya layak dihukum mati atau dibelenggu
  rationale: Ungkapan ini menyatakan bahwa tidak ada tuduhan yang setimpal dengan hukuman mati atau belenggu. 'Dibelenggu' mempertahankan gambaran harfiah δεσμῶν sekaligus dapat dipahami sebagai penahanan.
- source_word: ἔχοντα ἔγκλημα
  choice: ada satu pun tuduhan terhadapnya
  rationale: Gabungan partisip dan nomina ini menyatakan adanya dakwaan terhadap seseorang. Terjemahan ini mempertahankan nuansa hukum tanpa menyatakan kesalahan terbukti.
- source_word: εὗρον
  choice: Aku mendapati
  rationale: Dalam konteks penyelidikan komandan, bentuk aoris ini menyampaikan kesimpulan yang diperolehnya. 'Mendapati' alami dan sesuai dengan nada laporan resmi.
