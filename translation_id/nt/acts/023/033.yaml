id: ACT.23.33
reference: Acts 23:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἵτινες εἰσελθόντες εἰς τὴν Καισάρειαν καὶ ἀναδόντες τὴν ἐπιστολὴν τῷ ἡγεμόνι παρέστησαν καὶ τὸν Παῦλον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/033.yaml
  text: When they entered Caesarea and delivered the letter to the governor[b][a], they also presented Paul to him.
translation:
  language: id
  text: Setelah tiba di Kaisarea, mereka menyerahkan surat itu kepada gubernur, lalu menghadapkan Paulus kepadanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: mereka
  rationale: Merujuk kembali kepada pasukan pengawal berkuda pada ayat sebelumnya; pronomina ini alami sebagai subjek dalam bahasa Indonesia.
- source_word: εἰσελθόντες
  choice: setelah tiba di
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama. Dalam konteks perjalanan menuju sebuah kota, 'setelah tiba di' lebih alami daripada terjemahan harfiah 'setelah masuk ke'.
- source_word: Καισάρειαν
  choice: Kaisarea
  rationale: Transliterasi baku nama tempat dalam bahasa Indonesia.
- source_word: ἀναδόντες
  choice: menyerahkan
  rationale: Menggambarkan penyampaian resmi surat kepada pejabat tanpa menambahkan gagasan yang tidak terdapat dalam teks.
- source_word: ἐπιστολὴν
  choice: surat
  rationale: Padanan biasa dan tepat bagi komunikasi tertulis resmi dalam konteks ini.
- source_word: ἡγεμόνι
  choice: gubernur
  rationale: Sebutan yang jelas dan lazim bagi pejabat pemerintahan provinsi Romawi yang dimaksud.
- source_word: παρέστησαν
  choice: menghadapkan
  rationale: Dalam konteks resmi atau hukum, verba ini menyatakan membawa seseorang ke hadapan seorang pejabat.
- source_word: καὶ
  choice: lalu
  rationale: Menghubungkan dua tindakan berurutan dalam narasi secara alami; tindakan kedua juga menyertai penyerahan surat.
- source_word: Παῦλον
  choice: Paulus
  rationale: Bentuk baku nama Παῦλος dalam tradisi bahasa Indonesia.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Pronomina datif merujuk kepada gubernur dan melengkapi verba 'menghadapkan' secara alami.
