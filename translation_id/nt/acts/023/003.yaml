id: ACT.23.3
reference: Acts 23:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν· Τύπτειν σε μέλλει ὁ θεός, τοῖχε κεκονιαμένε· καὶ σὺ κάθῃ κρίνων με κατὰ τὸν νόμον, καὶ παρανομῶν κελεύεις με τύπτεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/003.yaml
  text: Then Paul said to him[a], “God is about to strike you, you whitewashed wall! And do you sit judging me according to the law, and yet in violation of the law command me to be struck?”
translation:
  language: id
  text: Lalu Paulus berkata kepadanya, “Allah akan segera memukul engkau[a], hai tembok yang dikapur putih! Engkau duduk menghakimi aku menurut hukum, tetapi dengan melanggar hukum itu engkau menyuruh aku dipukul?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Allah akan memukul engkau.” Secara harfiah, bahasa Yunaninya menyatakan, “Allah akan segera memukul engkau,” yang dapat menekankan dekatnya tindakan itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τύπτειν σε μέλλει ὁ θεός
  choice: Allah akan segera memukul engkau
  rationale: Konstruksi μέλλει dengan infinitif menyatakan tindakan yang akan segera atau hampir terjadi. Ungkapan ini mempertahankan nuansa kedekatan waktunya, sedangkan 'memukul' mencerminkan τύπτειν tanpa memperberatnya menjadi 'menghajar'.
- source_word: τοῖχε κεκονιαμένε
  choice: hai tembok yang dikapur putih
  rationale: Terjemahan ini mempertahankan metafora konkret serta bentuk partisip perfektum yang menggambarkan tembok dalam keadaan telah dilapisi kapur. Bentuk sapaan 'hai' menyampaikan ketajaman teguran secara wajar dalam bahasa Indonesia.
- source_word: κάθῃ
  choice: Engkau duduk
  rationale: Kata kerja konkret 'duduk' dipertahankan dan tidak diratakan menjadi sekadar 'bertindak sebagai hakim', sehingga gambaran serta daya retoris teks Yunani tetap terasa.
- source_word: κρίνων με κατὰ τὸν νόμον
  choice: untuk menghakimi aku menurut hukum Taurat
  rationale: κατά menyatakan kesesuaian dengan suatu standar. Dalam konteks persidangan Yahudi ini, νόμος secara alami merujuk pada hukum Taurat, bukan hukum secara umum.
- source_word: παρανομῶν
  choice: dengan melanggar hukum itu
  rationale: Partisip ini menunjukkan tindakan yang bertentangan dengan hukum. 'Hukum itu' mengacu kembali pada hukum Taurat dan mempertahankan pertentangan sengaja antara menghakimi menurut hukum dan melanggarnya.
- source_word: κελεύεις με τύπτεσθαι
  choice: engkau menyuruh orang memukul aku
  rationale: Bahasa Indonesia lazim memakai konstruksi kausatif aktif ini untuk perintah agar seseorang dikenai tindakan. Kata 'orang' tersirat oleh bentuk pasif Yunani dan membuat kalimat alami tanpa menentukan pelaku tertentu.
- source_word: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν
  choice: Lalu Paulus berkata kepadanya
  rationale: Terjemahan naratif yang langsung, alami, dan tidak menambahkan gagasan menjawab atau membalas yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Sifat pernyataan Paulus bahwa Allah akan memukul orang itu
  choice: Diterjemahkan sebagai pernyataan tentang tindakan ilahi yang segera terjadi, tanpa dilunakkan atau diperluas
  alternative: Semoga Allah memukul engkau
  rationale: Konstruksi Yunani μέλλει + infinitif paling wajar menyatakan tindakan yang akan atau segera terjadi, bukan suatu harapan atau kutukan. Terjemahan membiarkan ketegangan moral dan teologis perkataan Paulus tetap terbuka.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan berwibawa. Sapaan 'engkau' dipakai karena konteks teguran langsung yang tajam. 'Hukum Taurat' memperjelas konteks νόμος bagi pembaca umum, sementara metafora 'tembok yang dikapur putih' sengaja dipertahankan tanpa menafsirkan maknanya di dalam teks.
