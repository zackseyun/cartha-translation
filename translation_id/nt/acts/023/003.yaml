  terminology: “Allah” sesuai untuk ὁ θεός. “Hukum” mempertahankan keluasan νόμος; konteks dapat mengarahkan pembaca kepada hukum Yahudi, tetapi teks ayat sendiri tidak menuntut penambahan “Taurat.”
