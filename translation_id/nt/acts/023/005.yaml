id: ACT.23.5
reference: Acts 23:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔφη τε ὁ Παῦλος· Οὐκ ᾔδειν, ἀδελφοί, ὅτι ἐστὶν ἀρχιερεύς· γέγραπται γὰρ ⸀ὅτι Ἄρχοντα τοῦ λαοῦ σου οὐκ ἐρεῖς κακῶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/005.yaml
  text: And Paul said, “I did not know, brothers, that he is the high priest; for it is written, ‘You shall not speak evil of a ruler of your people.’”
translation:
  language: id
  text: Lalu Paulus berkata, “Saudara-saudara, saya tidak tahu bahwa ia adalah Imam Besar. Sebab, ada tertulis, ‘Janganlah engkau berkata buruk tentang seorang pemimpin bangsamu.’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Janganlah engkau mencaci seorang pemimpin bangsamu.”
    reason: Alternatif leksikal bagi οὐκ ἐρεῖς κακῶς yang dapat menyiratkan perkataan menghina atau mencerca.
lexical_decisions:
- source_word: ἔφη τε ὁ Παῦλος
  choice: Lalu Paulus berkata
  rationale: τέ menghubungkan tuturan ini dengan alur sebelumnya secara ringan; “lalu” terdengar alami dalam narasi Indonesia tanpa memberi tekanan kausal yang tidak ada dalam teks.
- source_word: Οὐκ ᾔδειν
  choice: saya tidak tahu
  rationale: Ungkapan ini menyatakan ketidaktahuan Paulus secara langsung. “Saya” sesuai dengan sapaan lisan Paulus dalam bahasa Indonesia modern.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan jamak ini alami dan bermartabat dalam bahasa Indonesia serta sesuai untuk Paulus yang berbicara kepada anggota Mahkamah Agama.
- source_word: ὅτι ἐστὶν ἀρχιερεύς
  choice: bahwa ia adalah Imam Besar
  rationale: Bentuk kini ἐστίν dipertahankan melalui “adalah”; “Imam Besar” menunjuk pada jabatan tertentu dalam konteks ini.
- source_word: γέγραπται γὰρ
  choice: Sebab, ada tertulis
  rationale: Rumusan ini mempertahankan formula pengutipan Kitab Suci dan nuansa hasil yang tetap berlaku dari bentuk perfek pasif γέγραπται.
- source_word: Ἄρχοντα
  choice: seorang pemimpin
  rationale: ἄρχων merujuk secara umum kepada orang yang memegang kepemimpinan atau kekuasaan; “seorang pemimpin” alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi jenis pejabat tertentu.
- source_word: τοῦ λαοῦ σου
  choice: bangsamu
  rationale: λαός di sini menunjuk pada umat atau bangsa yang menjadi komunitas lawan bicara; bentuk “bangsamu” ringkas dan wajar dalam kutipan hukum.
- source_word: οὐκ ἐρεῖς κακῶς
  choice: Janganlah engkau berkata buruk tentang
  rationale: Bentuk futur berfungsi sebagai larangan. Terjemahan ini mempertahankan cakupan umum κακῶς, sementara alternatif yang lebih kuat dicatat dalam catatan kaki.
theological_decisions:
- issue: Waktu pada ἐστὶν dalam pernyataan Paulus
  choice: ia adalah Imam Besar
  alternative: ia adalah seorang Imam Besar; ia merupakan Imam Besar
  rationale: Terjemahan mempertahankan bentuk kini Yunani dan jabatan yang diketahui dalam konteks, tanpa mencoba menjelaskan alasan ketidaktahuan Paulus.
- issue: Kekuatan larangan dalam kutipan Kitab Suci
  choice: Janganlah engkau berkata buruk tentang seorang pemimpin bangsamu
  alternative: Janganlah engkau mencaci seorang pemimpin bangsamu
  rationale: Teks utama mempertahankan keluasan makna κακῶς dan bahasa yang mudah dipahami; alternatif “mencaci” menyatakan kemungkinan nuansa yang lebih keras tanpa menjadikannya satu-satunya tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lisan-bermartabat. Sapaan “Saudara-saudara” serta kata ganti “saya” sesuai dengan pidato langsung; kutipan Kitab Suci memakai “engkau” untuk mempertahankan bentuk tunggal sumber dan corak hukum yang khidmat.
