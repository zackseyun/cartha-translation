  text: He wrote a letter having this form:[a]
translation:
  language: id
  text: Ia menulis sepucuk surat yang berbunyi demikian:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia menulis sepucuk surat dengan rumusan seperti ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψας
  choice: Ia menulis
  rationale: Partisip aoris ini merujuk pada tindakan menyusun surat oleh subjek dalam ayat sebelumnya. Dalam narasi bahasa Indonesia, bentuk verba finit “Ia menulis” lebih alami tanpa mengubah urutan tindakan.
- source_word: ἐπιστολὴν
  choice: sepucuk surat
  rationale: ἐπιστολή berarti komunikasi tertulis atau surat. “Sepucuk surat” merupakan padanan Indonesia yang wajar dalam konteks naratif ini.
- source_word: ἔχουσαν
  choice: yang bentuknya
  rationale: Partisip kini ini menerangkan surat tersebut. Susunan “yang bentuknya” mempertahankan hubungan gramatikalnya secara alami dalam bahasa Indonesia.
- source_word: τύπον
  choice: bentuk
  rationale: τύπος di sini menunjuk pada bentuk, pola, atau rumusan surat yang akan dikutip. “Bentuk” adalah padanan dekat yang tidak mempersempit makna menjadi hanya isi atau kata-kata.
- source_word: τοῦτον
  choice: demikian
  rationale: Kata penunjuk ini mengarah ke depan kepada kutipan surat. “Demikian” mempertahankan fungsi deiktis tersebut dan sesuai dengan idiom Indonesia.
