  rationale: Revisi mengganti ungkapan yang menyatakan niat ("hendak") dengan "harus" untuk mempertahankan force konstruksi ἔχεις + infinitif. Klausa tujuan tambahan dihilangkan. "Mulai bertanya" secara wajar menangkap kemungkinan nuansa inkoatif dari imperfek ἐπυνθάνετο, tanpa mengubah isi pertanyaan. Catatan a mempertahankan bentuk lebih harfiah yang tidak menyebut objek gerakan secara eksplisit.
