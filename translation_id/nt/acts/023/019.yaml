translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan partisipial Yunani diurai menjadi dua klausa agar alami. Sapaan “kau-” dipakai dalam dialog langsung untuk keakraban netral, sedangkan “kepadaku” mempertahankan nada percakapan yang sopan namun langsung.
