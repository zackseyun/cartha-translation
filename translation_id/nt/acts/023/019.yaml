  text: ἐπιλαβόμενος δὲ τῆς χειρὸς αὐτοῦ ὁ χιλίαρχος καὶ ἀναχωρήσας κατ’ ἰδίαν ἐπυνθάνετο· Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/019.yaml
  text: So the commander took him by the hand and[a], drawing aside in private, began asking[b], “What is it that you have to report to me?”
translation:
  language: id
  text: Lalu komandan itu memegang tangan pemuda itu dan membawanya ke tempat tersendiri.[a] Ia mulai bertanya, “Apa yang harus kaulaporkan kepadaku?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “lalu menyingkir secara pribadi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Apa yang perlu kausampaikan kepadaku?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιλαβόμενος ... τῆς χειρὸς αὐτοῦ
  choice: memegang tangan pemuda tersebut
  rationale: Ungkapan ini secara konkret berarti memegang atau menggenggam tangannya. “Memegang tangan” wajar dalam bahasa Indonesia dan tidak menyiratkan kekerasan. “Pemuda tersebut” menjelaskan rujukan pronomina dari konteks terdekat tanpa mengubah identitas tokoh.
- source_word: δὲ
  choice: Lalu
  rationale: δέ berfungsi menggerakkan alur narasi; “lalu” merupakan penghubung naratif yang alami dalam bahasa Indonesia.
- source_word: ὁ χιλίαρχος
  choice: komandan
  rationale: χιλίαρχος menunjuk kepada perwira militer Romawi berpangkat tinggi, secara harfiah pemimpin seribu orang. “Komandan” jelas bagi pembaca umum tanpa memakai istilah teknis yang asing.
- source_word: ἀναχωρήσας κατ’ ἰδίαν
  choice: membawanya menyingkir agar dapat berbicara secara pribadi
  rationale: ἀναχωρέω menyatakan gerakan menyingkir, sedangkan κατ’ ἰδίαν menyatakan keadaan tersendiri atau pribadi. Objek tersirat diperjelas secara alami dari konteks; unsur “berbicara” menjelaskan tujuan pragmatis tanpa menjadikannya bagian terpisah dari tindakan.
- source_word: ἐπυνθάνετο
  choice: Ia bertanya
  rationale: Bentuk imperfek dapat menggambarkan tindakan bertanya yang sedang berlangsung atau mulai dilakukan, tetapi dalam bahasa Indonesia bentuk sederhana “bertanya” paling alami dan tidak memaksakan nuansa aspektual yang tidak pasti.
- source_word: Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι
  choice: Apa yang hendak kaulaporkan kepadaku?
  rationale: Pertanyaan ini secara idiomatis menanyakan informasi yang ingin disampaikan pemuda itu. “Laporkan” mempertahankan nuansa penyampaian berita atau informasi yang terkandung dalam ἀπαγγέλλω dan sesuai dengan konteks seorang komandan.
