  - severity: low
    issue: “Mahkamah Agama” kurang spesifik sebagai padanan συνέδριον
    rationale: Dalam konteks Yerusalem, συνέδριον menunjuk pada Sanhedrin. Nama lembaga tersebut lebih akurat; penjelasan singkat dapat diberikan dalam catatan kaki.
