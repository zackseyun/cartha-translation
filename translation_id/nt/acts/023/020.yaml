  verdict: revise
  source_fidelity: Perlu revisi kecil. “Perkaranya” mempersempit περὶ αὐτοῦ (“tentang dia”) menjadi perkara hukum dan tidak lagi menyatakan objek taktentu τι (“sesuatu”). Selain itu, “Sanhedrin” lebih tepat sebagai nama lembaga συγκεκριμένου yang dimaksud oleh συνέδριον daripada istilah umum “Mahkamah Agama.”
  naturalness: Kalimatnya pada dasarnya baku dan alami. Revisi “menyelidiki sesuatu tentang dia dengan lebih teliti” mempertahankan makna sumber dan tetap jelas dalam bahasa Indonesia modern.
  terminology: “Sanhedrin” dipertahankan sebagai nama dewan Yahudi di Yerusalem; catatan kaki menerangkan istilah itu. “Orang-orang Yahudi” mengikuti Οἱ Ἰουδαῖοι, dengan konteks naratif membatasi acuannya pada kelompok yang terlibat, bukan semua orang Yahudi.
