id: ACT.23.20
reference: Acts 23:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὅτι Οἱ Ἰουδαῖοι συνέθεντο τοῦ ἐρωτῆσαί σε ὅπως αὔριον ⸂τὸν Παῦλον καταγάγῃς εἰς τὸ συνέδριον⸃ ὡς ⸀μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/020.yaml
  text: He said[a], “The Jews have agreed to ask you to bring Paul down to the Sanhedrin tomorrow[b], as though they were going to inquire more accurately about him.”
translation:
  language: id
  text: Ia berkata[a], “Orang-orang Yahudi telah sepakat untuk memintamu membawa Paulus turun ke Sanhedrin besok, seolah-olah mereka hendak menyelidiki sesuatu tentang dia dengan lebih teliti.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sanhedrin adalah dewan agama Yahudi.
    reason: identifikasi_lembaga
lexical_decisions:
- source_word: συνέθεντο
  choice: telah sepakat
  rationale: Bentuk medial συντίθεμαι menyatakan bahwa mereka mencapai kesepakatan atau menyusun rencana bersama; pilihan ini wajar dalam bahasa Indonesia dan tidak memasukkan maksud jahat yang hanya diketahui dari konteks.
- source_word: τοῦ ἐρωτῆσαί σε
  choice: untuk memintamu
  rationale: Infinitif berartikel menyatakan isi atau tujuan kesepakatan, sedangkan ἐρωτάω dalam konteks ini berarti mengajukan permintaan kepada kepala pasukan.
- source_word: καταγάγῃς
  choice: membawa ... turun
  rationale: Mempertahankan unsur arah pada κατάγω, yakni membawa Paulus turun dari benteng menuju tempat persidangan.
- source_word: συνέδριον
  choice: Mahkamah Agama
  rationale: Di sini συνέδριον menunjuk pada Sanhedrin, dewan pemerintahan dan pengadilan tertinggi Yahudi; istilah Indonesia ini jelas dan lazim dipahami sebagai nama lembaga tersebut.
- source_word: Οἱ Ἰουδαῖοι
  choice: Orang-orang Yahudi
  rationale: Menerjemahkan ungkapan Yunani secara langsung tanpa mempersempitnya menjadi para pemimpin; konteks membatasi acuannya pada kelompok Yahudi yang terlibat dalam rencana terhadap Paulus.
- source_word: ὡς μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ
  choice: seolah-olah mereka hendak menyelidiki perkaranya dengan lebih teliti
  rationale: ὡς menyatakan dalih atau kesan yang tidak sesuai dengan maksud sebenarnya; μέλλον menyatakan niat, πυνθάνομαι pemerolehan informasi melalui penyelidikan, dan ἀκριβέστερον tingkat ketelitian yang lebih tinggi. 'Perkaranya' menyampaikan τι ... περὶ αὐτοῦ secara alami.
theological_decisions:
- issue: Acuan ungkapan Οἱ Ἰουδαῖοι dalam narasi yang bermusuhan
  choice: Orang-orang Yahudi
  alternative: para pemimpin Yahudi / orang-orang Yudea
  rationale: Teks Yunani tidak secara eksplisit menyebut para pemimpin. Terjemahan mempertahankan bentuk sumber, sementara konteks menunjukkan bahwa yang dimaksud ialah kelompok tertentu yang merencanakan serangan terhadap Paulus, bukan seluruh orang Yahudi.
- issue: Sifat tujuan pemeriksaan yang dikemukakan
  choice: seolah-olah mereka hendak menyelidiki perkaranya dengan lebih teliti
  alternative: dengan dalih hendak memperoleh keterangan yang lebih tepat tentang dia
  rationale: Pilihan ini mempertahankan nuansa kepura-puraan pada ὡς tanpa menjelaskan tipu daya secara berlebihan, sekaligus menjaga gagasan penyelidikan yang lebih cermat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'ia' dan enklitik '-mu' sesuai dengan dialog naratif. 'Mahkamah Agama' dipakai sebagai nama lembaga Sanhedrin. Tidak diperlukan catatan kaki karena pilihan leksikal dapat disampaikan secara jelas dalam teks utama tanpa menghilangkan ambiguitas penting.
