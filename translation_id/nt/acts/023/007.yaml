  text: τοῦτο δὲ αὐτοῦ ⸀λαλοῦντος ἐγένετο στάσις τῶν Φαρισαίων ⸂καὶ Σαδδουκαίων⸃, καὶ ἐσχίσθη τὸ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/007.yaml
  text: And as he was saying this[a], a dispute arose between the Pharisees and Sadducees[b], and the assembly was divided.
translation:
  language: id
  text: Sementara Paulus mengatakan hal itu, timbullah perselisihan antara orang-orang Farisi dan orang-orang Saduki, lalu sidang itu terpecah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δὲ αὐτοῦ λαλοῦντος
  choice: Ketika Paulus sedang mengatakan hal itu
  rationale: Konstruksi genitif absolut dengan partisipel kini menunjukkan tindakan yang sedang berlangsung. Nama “Paulus” dipakai sebagai rujukan alami bagi αὐτοῦ dalam bahasa Indonesia agar pelakunya jelas tanpa mengubah makna.
- source_word: ἐγένετο στάσις
  choice: timbullah perselisihan
  rationale: Gabungan ini menyatakan muncul atau pecahnya pertentangan. “Timbullah perselisihan” alami dalam narasi Indonesia dan mempertahankan nuansa konflik antarkelompok.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: antara orang-orang Farisi dan orang-orang Saduki
  rationale: Genitif Yunani di sini menunjukkan kedua pihak yang berselisih; “antara” merupakan ungkapan Indonesia yang paling wajar.
- source_word: ἐσχίσθη
  choice: terpecah
  rationale: Bentuk pasif σχίζω menggambarkan kumpulan itu terbagi menjadi pihak-pihak yang berlawanan. “Terpecah” mempertahankan daya metaforis kata sumber.
- source_word: τὸ πλῆθος
  choice: seluruh sidang itu
  rationale: Dalam konteks ini πλῆθος menunjuk kepada badan yang sedang berkumpul dalam sidang, bukan kerumunan acak. “Seluruh sidang itu” menyampaikan rujukan kolektif dan formal tersebut.
