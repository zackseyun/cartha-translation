id: ACT.23.1
reference: Acts 23:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀτενίσας δὲ ⸂ὁ Παῦλος τῷ συνεδρίῳ⸃ εἶπεν· Ἄνδρες ἀδελφοί, ἐγὼ πάσῃ συνειδήσει ἀγαθῇ πεπολίτευμαι τῷ θεῷ ἄχρι ταύτης τῆς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/001.yaml
  text: And Paul[a], looking intently at the council, said, “Brothers, I have lived before God with an entirely good conscience up to this day.”
translation:
  language: id
  text: Paulus menatap Mahkamah Agama itu dengan saksama, lalu berkata, “Saudara-saudara, sampai hari ini aku telah menjalani hidup di hadapan Allah dengan hati nurani yang sepenuhnya baik.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku telah berlaku sebagai warga di hadapan Allah,” untuk mempertahankan nuansa kewargaan dalam kata Yunaninya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: menatap ... dengan saksama
  rationale: Partisip aoris ini menggambarkan pandangan yang terarah dan sungguh-sungguh; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan tekanannya.
- source_word: δὲ
  choice: lalu
  rationale: Di sini δέ merupakan penghubung ringan yang melanjutkan adegan; “lalu” mengalir alami dalam narasi Indonesia.
- source_word: τῷ συνεδρίῳ
  choice: anggota-anggota Mahkamah Agama itu
  rationale: Dalam konteks ini συνέδριον menunjuk kepada dewan pemimpin Yahudi. Karena Paulus menatap dan menyapa orang-orang yang bersidang, penyebutan anggotanya menghasilkan bahasa Indonesia yang alami, sedangkan “Mahkamah Agama” menjelaskan lembaganya tanpa transliterasi teknis.
- source_word: Ἄνδρες ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan konvensional ini ditujukan kepada para laki-laki dalam dewan. “Saudara-saudara” merupakan padanan Indonesia yang wajar tanpa mempertahankan vokatif ganda secara kaku.
- source_word: πάσῃ συνειδήσει ἀγαθῇ
  choice: dengan hati nurani yang sepenuhnya baik
  rationale: Frasa datif ini menyatakan cara atau lingkup, sementara πάσῃ menguatkan sifat menyeluruh dari pengakuan Paulus. “Sepenuhnya baik” mempertahankan tekanan itu tanpa menjadikannya klaim kesempurnaan moral mutlak.
- source_word: πεπολίτευμαι
  choice: aku telah menjalani hidup
  rationale: Bentuk perfektum πολιτεύομαι merangkum perilaku hidup sampai saat berbicara. Padanan ini alami dan mempertahankan daya retrospektifnya; nuansa kewargaan yang mungkin terkandung dicatat dalam catatan kaki.
- source_word: τῷ θεῷ
  choice: di hadapan Allah
  rationale: Datif ini menyatakan kehidupan yang dijalani dalam hubungan dengan dan di bawah pandangan Allah; “di hadapan Allah” cocok dengan konteks hati nurani.
- source_word: ἄχρι ταύτης τῆς ἡμέρας
  choice: sampai hari ini
  rationale: Ungkapan temporal ini menunjukkan kesinambungan dari masa lalu hingga saat Paulus berbicara dan diterjemahkan secara lugas serta alami.
theological_decisions:
- issue: Makna πεπολίτευμαι dalam pernyataan Paulus
  choice: Pernyataan umum mengenai cara Paulus menjalani hidup di hadapan Allah
  alternative: “Aku telah berlaku sebagai warga di hadapan Allah,” dengan nuansa kewargaan yang lebih kentara
  rationale: πολιτεύομαι dapat memiliki nuansa kewargaan, tetapi dalam konteks ini menunjuk secara lebih luas pada perilaku hidup Paulus. Teks utama tidak mengubahnya menjadi pernyataan teknis tentang status kewargaan atau klaim bahwa Paulus sama sekali tanpa dosa; alternatif leksikalnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. “Aku” dipakai dalam tuturan langsung sesuai konteks naratif Alkitab, sedangkan “Mahkamah Agama” membantu pembaca umum mengenali dewan Yahudi yang dimaksud.
