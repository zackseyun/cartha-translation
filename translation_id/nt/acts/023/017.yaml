    rationale: Konstruksi pasif "untuk dilaporkan" dapat mengaburkan bahwa "ia" (pemuda itu) adalah pihak yang akan melapor, sedangkan Yunani ἔχει + infinitif menyatakan bahwa ia memiliki sesuatu yang hendak ia sampaikan.
  - severity: low
