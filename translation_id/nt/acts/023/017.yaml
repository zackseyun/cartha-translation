  source_fidelity: Revisi diperlukan untuk memperjelas bahwa pemuda itu sendiri yang akan menyampaikan informasi tersebut. Frasa draft "mempunyai sesuatu untuk dilaporkan" dapat terbaca sebagai bentuk pasif yang tidak jelas pelakunya. Pangkat ἑκατοντάρχης juga sebaiknya dinyatakan sebagai "perwira seratus," bukan hanya "perwira," agar kekhususan sumber tetap terjaga.
  naturalness: '"Salah seorang perwira seratus" dan "sesuatu yang hendak ia laporkan kepadanya" adalah bentuk baku, jelas, dan wajar dalam narasi Indonesia modern. "Lalu," "Bawalah," dan "komandan" sesuai register.'
  terminology: '"Perwira seratus" mencerminkan ἑκατοντάρχης secara historis tanpa memakai istilah asing. "Komandan" merupakan padanan yang cukup untuk χιλίαρχος dalam konteks ini. "Melaporkan" mempertahankan nuansa ἀπαγγέλλω, sementara catatan kaki menyediakan alternatif yang lebih umum.'
  issues:
