base_translation:
  language: en
  yaml_path: translation/nt/acts/023/017.yaml
  text: So Paul called one of the centurions and said[a], “Take this young man to the commander, for he has something to report to him.”
translation:
  language: id
  text: Lalu Paulus memanggil salah seorang perwira seratus dan berkata, “Bawalah pemuda ini kepada komandan, sebab ia mempunyai sesuatu yang hendak ia laporkan kepadanya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang hendak ia beritahukan kepadanya.” Kata Yunani yang dipakai dapat berarti melaporkan, mengumumkan, atau memberitahukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: memanggil
  rationale: Partisip aoristus ini menyatakan tindakan Paulus memanggil seseorang untuk datang kepadanya sebelum ia berbicara. 'Memanggil' alami dan tepat dalam narasi Indonesia.
- source_word: δὲ
  choice: Lalu
  rationale: Di sini δέ terutama menandai kelanjutan narasi, bukan pertentangan. 'Lalu' mengalir wajar dalam bahasa Indonesia.
- source_word: ἕνα τῶν ἑκατονταρχῶν
  choice: salah seorang perwira
  rationale: ἑκατοντάρχης adalah perwira Romawi yang memimpin sekitar seratus prajurit. 'Perwira' mudah dipahami dan sesuai konteks militer, meski tidak menyatakan pangkat teknis secara penuh.
- source_word: ἔφη
  choice: berkata
  rationale: Padanan langsung dan tidak mencolok bagi verba pengantar ujaran φημί.
- source_word: νεανίαν
  choice: pemuda
  rationale: νεανίας menunjuk laki-laki muda; 'pemuda' ringkas, alami, dan bermartabat dalam bahasa Indonesia modern.
- source_word: ἄπαγε
  choice: Bawalah
  rationale: Imperatif ἀπάγω di sini berarti membawa atau mengantar seseorang kepada pihak lain. 'Bawalah' merupakan perintah yang alami dalam konteks ini.
- source_word: πρὸς τὸν χιλίαρχον
  choice: kepada komandan
  rationale: χιλίαρχος menunjuk komandan militer Romawi, dalam konteks ini seorang tribun. 'Komandan' mempertahankan fungsi jabatan dan lebih mudah dipahami daripada istilah teknis.
- source_word: ἔχει γὰρ ἀπαγγεῖλαί τι αὐτῷ
  choice: karena ia mempunyai sesuatu untuk dilaporkan kepadanya
  rationale: Konstruksi ἔχει dengan infinitif menyatakan bahwa pemuda itu mempunyai sesuatu yang hendak disampaikan. ἀπαγγέλλω dapat berarti melaporkan, memberitakan, atau memberi tahu; 'dilaporkan' cocok dengan penyampaian informasi penting kepada komandan.
