  to: Jadi, sekarang, hendaklah kalian bersama dewan memberitahukan kepada komandan agar ia membawa dia turun kepada kalian[a], seolah-olah kalian hendak memeriksa perkaranya dengan lebih teliti[b]. Namun, kami siap membunuhnya sebelum ia mendekat[c].
