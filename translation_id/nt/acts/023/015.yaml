  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: νῦν οὖν ὑμεῖς ἐμφανίσατε τῷ χιλιάρχῳ σὺν τῷ συνεδρίῳ ⸀ὅπως ⸂καταγάγῃ αὐτὸν εἰς⸃ ὑμᾶς ὡς μέλλοντας διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ· ἡμεῖς δὲ πρὸ τοῦ ἐγγίσαι αὐτὸν ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/015.yaml
  text: Now therefore[a], you, together with the council, make it known to the commander so that he may bring him down to you, as though you were about to examine more carefully the things concerning him[c][b]. But we are ready to kill him before he comes near.
translation:
  language: id
  text: Jadi, sekarang, hendaklah kalian bersama dewan memberitahukan kepada komandan agar ia membawa dia turun kepada kalian[a], seolah-olah kalian hendak memeriksa perkaranya dengan lebih teliti[b]. Namun, kami siap membunuhnya sebelum ia mendekat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membawanya menghadap kalian.” Kata kerja Yunaninya secara harfiah memuat gagasan membawa orang itu turun.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menyelidiki hal-hal mengenai dirinya dengan lebih saksama.” Ungkapan ini menggambarkan dalih untuk melakukan pemeriksaan hukum lebih lanjut.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “sebelum ia tiba.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφανίσατε
  choice: harus menyampaikan kepada
  rationale: Imperatif aoris ini meminta mereka secara resmi menyampaikan suatu hal kepada komandan. Ungkapan ini alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi sekadar permohonan.
- source_word: χιλιάρχῳ
  choice: komandan
  rationale: Istilah ini menunjuk kepada perwira Romawi yang memimpin pasukan setingkat kohor. 'Komandan' jelas bagi pembaca modern tanpa memakai gelar teknis yang kurang dikenal.
- source_word: σὺν τῷ συνεδρίῳ
  choice: bersama Dewan
  rationale: σύν menyatakan kebersamaan, sedangkan συνέδριον di sini ialah badan penguasa Yahudi yang telah dikenal dalam konteks. 'Dewan' dekat dengan bentuk Yunani dan tidak menambahkan penjelasan denominatif.
- source_word: καταγάγῃ αὐτὸν εἰς ὑμᾶς
  choice: ia membawa orang itu turun kepada kalian
  rationale: κατάγω memuat nuansa arah 'membawa turun'. 'Orang itu' mempertahankan rujukan pronominal tanpa secara eksplisit memasukkan nama Paulus yang tidak terdapat dalam ayat ini.
- source_word: ὡς μέλλοντας
  choice: seolah-olah kalian hendak
  rationale: ὡς dengan partisipel menyajikan maksud yang dikemukakan sebagai dalih. 'Seolah-olah' mempertahankan unsur kepura-puraan tanpa penjelasan tambahan.
- source_word: διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ
  choice: memeriksa perkaranya dengan lebih teliti
  rationale: διαγινώσκω dalam konteks yudisial berarti memeriksa atau menyelidiki untuk mengambil keputusan; ἀκριβέστερον menyatakan tingkat ketelitian yang lebih besar. 'Perkaranya' adalah padanan idiomatis bagi τὰ περὶ αὐτοῦ.
- source_word: πρὸ τοῦ ἐγγίσαι αὐτόν
  choice: sebelum ia mendekat
  rationale: Konstruksi ini menyatakan waktu sebelumnya, sedangkan ἐγγίζω secara harfiah berarti datang mendekat. Terjemahan mempertahankan nuansa spasial yang dapat juga dipahami sebagai tiba.
- source_word: ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν
  choice: kami sudah siap membunuhnya
  rationale: ἕτοιμοί ἐσμεν menyatakan kesiapan, dan ἀναιρέω dalam konteks ini berarti membunuh. 'Membunuh' langsung dan tidak menambahkan penilaian leksikal seperti 'murder'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Kalian' dipakai karena bentuk Yunani jamak; 'Dewan' dipertahankan sebagai sebutan kontekstual bagi badan penguasa Yahudi. Susunan kalimat dibuat alami tanpa menghilangkan unsur dalih, arah gerak turun, atau nuansa 'mendekat' dalam teks Yunani.
