base_translation:
  language: en
  yaml_path: translation/nt/acts/023/002.yaml
  text: But the high priest Ananias ordered those standing by him to strike him on the mouth[a].
translation:
  language: id
  text: Namun, Imam Besar Ananias memerintahkan orang-orang yang berdiri di dekatnya untuk memukul Paulus pada mulutnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menampar Paulus pada mulutnya.” Kata kerja Yunani yang dipakai dapat berarti memukul secara umum; “menampar” mungkin sesuai dengan konteks, tetapi lebih khusus.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai tanggapan yang berlawanan dan mendadak terhadap pernyataan Paulus sebelumnya tanpa memberi tekanan yang berlebihan.
- source_word: ὁ ἀρχιερεὺς
  choice: Imam Besar
  rationale: Padanan baku dan tepat untuk jabatan tunggal ἀρχιερεύς dalam konteks Yahudi.
- source_word: Ἁνανίας
  choice: Ananias
  rationale: Nama pribadi dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: ἐπέταξεν
  choice: memerintahkan
  rationale: Menyampaikan tindakan memberi perintah dengan kewenangan dan tetap alami dalam bahasa Indonesia modern.
- source_word: τοῖς παρεστῶσιν αὐτῷ
  choice: orang-orang yang berdiri di dekatnya
  rationale: Mempertahankan arti kehadiran dan kedekatan ruang dari bentuk partisip παρίστημι tanpa mengandaikan bahwa mereka adalah pelayan resmi.
- source_word: τύπτειν
  choice: memukul
  rationale: Padanan umum yang mempertahankan keluasan makna τύπτω dan tidak menentukan cara pukulan secara lebih khusus.
- source_word: αὐτοῦ τὸ στόμα
  choice: mulut Paulus
  rationale: Bahasa Indonesia secara alami dapat memakai sasaran tubuh sebagai objek langsung. Nama Paulus memperjelas rujukan pronomina Yunani yang dapat terasa rancu jika diterjemahkan hanya sebagai 'mulutnya'.
