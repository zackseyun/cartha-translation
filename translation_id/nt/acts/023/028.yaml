base_translation:
  language: en
  yaml_path: translation/nt/acts/023/028.yaml
  text: And wanting to know the charge for which they were accusing him[a], I brought him down to their council.
translation:
  language: id
  text: Dan karena ingin mengetahui tuduhan yang mereka ajukan terhadapnya, aku membawanya turun ke dewan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sanhedrin mereka.” Kata Yunani συνέδριον berarti “dewan”; dalam konteks ini kemungkinan besar merujuk kepada dewan pemerintahan Yahudi di Yerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενός τε ἐπιγνῶναι
  choice: Karena ingin mengetahui
  rationale: Partisip menyatakan motif tindakan berikutnya; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan hubungan kausal yang tersirat.
- source_word: τὴν αἰτίαν δι’ ἣν
  choice: tuduhan apa yang
  rationale: Dalam konteks hukum, αἰτία menunjuk pada dasar atau pokok tuduhan. Susunan ini menyampaikan hubungan relatif Yunani secara wajar.
- source_word: ἐνεκάλουν αὐτῷ
  choice: mereka ajukan terhadap dia
  rationale: ἐγκαλέω dengan datif berarti mengajukan tuduhan terhadap seseorang; bentuk imperfek tercakup dalam tindakan menuduh yang sedang berlangsung.
- source_word: κατήγαγον
  choice: aku membawanya turun
  rationale: Mempertahankan unsur arah 'turun' dalam verba Yunani, sekaligus menyatakan objek tersirat secara jelas dalam bahasa Indonesia.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: ke hadapan Mahkamah Agama mereka
  rationale: Dalam konteks ini συνέδριον menunjuk pada dewan pemerintahan dan pengadilan Yahudi di Yerusalem. 'Ke hadapan' lebih alami untuk membawa seseorang menghadap lembaga bersidang.
