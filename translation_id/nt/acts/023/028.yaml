  terminology: “Dewan mereka” menerjemahkan συνέδριον tanpa menetapkan label tradisional sebagai teks utama. “Sanhedrin” dipertahankan sebagai kemungkinan dalam catatan kaki. “Terhadapnya” merupakan bentuk baku dan lebih ringkas daripada “terhadap dia” dalam register laporan resmi.
