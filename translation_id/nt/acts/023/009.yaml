id: ACT.23.9
reference: Acts 23:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγένετο δὲ κραυγὴ μεγάλη, καὶ ἀναστάντες ⸂τινὲς τῶν γραμματέων⸃ τοῦ μέρους τῶν Φαρισαίων διεμάχοντο λέγοντες· Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ· εἰ δὲ πνεῦμα ἐλάλησεν αὐτῷ ἢ ⸀ἄγγελος—
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/009.yaml
  text: Then a great outcry arose[a], and some of the scribes of the party of the Pharisees stood up and contended, saying, “We find nothing wrong in this man[b]. But if a spirit or an angel has spoken to him—”
translation:
  language: id
  text: Lalu timbullah teriakan besar, dan beberapa ahli Taurat dari golongan orang Farisi bangkit lalu berdebat dengan sengit sambil berkata, “Kami tidak menemukan kesalahan apa pun pada orang ini. Tetapi jika roh atau malaikat telah berbicara kepadanya—”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kalimat ini terputus secara mendadak dalam teks Yunani.
    reason: source_clarity
lexical_decisions:
- source_word: κραυγὴ μεγάλη
  choice: teriakan yang hebat
  rationale: Menyampaikan seruan atau kegaduhan keras dengan bentuk nomina dan sifat yang alami dalam bahasa Indonesia.
- source_word: ἀναστάντες
  choice: berdiri
  rationale: Mempertahankan tindakan fisik bangkit untuk menyampaikan pendapat dalam persidangan.
- source_word: τινὲς τῶν γραμματέων
  choice: beberapa ahli Taurat
  rationale: Dalam konteks kepemimpinan Yahudi, γραμματεῖς merujuk kepada orang-orang yang ahli dalam hukum Taurat; padanan ini lebih mudah dipahami pembaca Indonesia daripada istilah teknis 'juru tulis'.
- source_word: τοῦ μέρους τῶν Φαρισαίων
  choice: dari golongan orang Farisi
  rationale: μέρος menunjuk kepada pihak atau golongan dalam sidang; frasa ini menyatakan afiliasi mereka secara jelas dan alami.
- source_word: διεμάχοντο
  choice: membantah dengan keras
  rationale: Menangkap perselisihan sengit dan berkelanjutan yang dinyatakan oleh verba imperfek ini.
- source_word: Οὐδὲν κακὸν εὑρίσκομεν
  choice: Kami tidak menemukan kesalahan apa pun
  rationale: 'Sesuai dengan konteks penilaian hukum: mereka tidak mendapati sesuatu yang jahat, salah, atau patut dipersalahkan pada Paulus.'
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: pada orang ini
  rationale: Padanan idiomatis Indonesia untuk kesalahan yang ditemukan pada diri seseorang tanpa mengubah rujukan kepada Paulus.
- source_word: εἰ δὲ
  choice: Tetapi jika
  rationale: Mempertahankan hubungan adversatif dan bentuk syarat dalam Yunani, khususnya karena kalimat itu terputus.
- source_word: πνεῦμα
  choice: suatu roh
  rationale: Kontras dengan 'malaikat' paling wajar menunjuk kepada makhluk rohani secara umum, tanpa memastikan bahwa yang dimaksud ialah Roh Kudus.
- source_word: ἐλάλησεν αὐτῷ
  choice: telah berbicara kepadanya
  rationale: Menyatakan tindakan berbicara yang telah terjadi dan masih relevan terhadap pembelaan mereka.
- source_word: ἄγγελος
  choice: malaikat
  rationale: Konteks makhluk adikodrati menunjukkan malaikat, bukan utusan manusia.
theological_decisions:
- issue: Makna πνεῦμα dalam kontras dengan ἄγγελος
  choice: suatu roh, yakni makhluk rohani yang tidak ditentukan lebih lanjut
  alternative: Roh, yakni Roh Kudus
  rationale: Pasangan 'roh atau malaikat' mencerminkan kategori makhluk rohani dan tidak mengharuskan identifikasi dengan Roh Kudus. Terjemahan mempertahankan ketidakpastian narasi.
- issue: Klausa penutup yang terputus
  choice: Mempertahankan kalimat tidak selesai dengan tanda pisah panjang
  alternative: 'Melengkapinya sebagai pertanyaan retoris: “Bagaimana jika suatu roh atau malaikat telah berbicara kepadanya?”'
  rationale: Teks Yunani berakhir secara mendadak, sehingga tidak tepat melengkapi kesimpulan yang tidak tertulis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Ahli Taurat' dipilih sebagai istilah umum yang mudah dipahami; susunan akhir sengaja dibiarkan terputus agar bentuk sumber tetap terlihat.
