id: ACT.21.35
reference: Acts 21:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐγένετο ἐπὶ τοὺς ἀναβαθμούς, συνέβη βαστάζεσθαι αὐτὸν ὑπὸ τῶν στρατιωτῶν διὰ τὴν βίαν τοῦ ὄχλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/035.yaml
  text: When he came to the steps[a], it happened that he was being carried by the soldiers because of the violence of the crowd[b],
translation:
  language: id
  text: Ketika Paulus sampai di tangga[a], ia terpaksa diusung oleh para prajurit karena kekerasan orang banyak,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tangga ini kemungkinan adalah tangga yang menuju ke barak pasukan Romawi (lihat Kisah Para Rasul 21:34, 37).
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ketika
  rationale: ὅτε memperkenalkan anak kalimat waktu, sedangkan δέ bersifat penghubung ringan dan dapat tersirat secara alami dalam bahasa Indonesia.
- source_word: ἐγένετο ἐπὶ τοὺς ἀναβαθμούς
  choice: Paulus sampai di tangga
  rationale: γίνομαι dengan ἐπί dan akusatif di sini berarti tiba atau sampai di suatu tempat. Nama Paulus digunakan untuk memperjelas rujukan pronomina secara alami dalam bahasa Indonesia.
- source_word: ἀναβαθμούς
  choice: tangga
  rationale: Kata ini menunjuk pada anak-anak tangga atau tangga naik; 'tangga' merupakan padanan Indonesia yang alami dalam konteks jalan menuju markas.
- source_word: συνέβη βαστάζεσθαι
  choice: terpaksa diusung
  rationale: συνέβη memperkenalkan keadaan yang timbul akibat kekerasan orang banyak. Dalam konteks ini, 'terpaksa' menyampaikan keharusan yang dihasilkan oleh keadaan, sedangkan bentuk pasif 'diusung' mempertahankan bahwa para prajuritlah pelakunya.
- source_word: ὑπὸ τῶν στρατιωτῶν
  choice: oleh para prajurit
  rationale: Frasa ini menyatakan pelaku tindakan pasif; στρατιῶται berarti para prajurit.
- source_word: διὰ τὴν βίαν τοῦ ὄχλου
  choice: karena kekerasan orang banyak
  rationale: διά dengan akusatif menyatakan sebab. βία berarti kekerasan atau daya paksa, dan ὄχλος diterjemahkan netral sebagai 'orang banyak' agar unsur permusuhannya dinyatakan oleh 'kekerasan'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Diusung' dipilih karena Paulus dibawa secara fisik oleh para prajurit, bukan sekadar ditemani. Tanda koma akhir dipertahankan karena ayat ini secara sintaksis berlanjut ke ayat berikutnya.
