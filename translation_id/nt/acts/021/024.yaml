revisions:
- from: Bawalah orang-orang ini bersamamu, tahirkanlah dirimu bersama mereka, dan tanggunglah biaya mereka supaya mereka dapat mencukur kepala. Dengan demikian, semua orang akan tahu bahwa kabar yang telah mereka dengar tentang dirimu[a] tidak benar, tetapi bahwa engkau sendiri juga hidup tertib dengan menaati hukum Taurat.[b]
  to: Bawalah orang-orang ini bersamamu, sucikanlah dirimu bersama mereka, dan tanggunglah biaya mereka supaya mereka dapat mencukur rambut kepala mereka. Dengan demikian, semua orang akan tahu bahwa tidak ada benarnya pada kabar yang telah mereka dengar tentang dirimu[a], melainkan bahwa engkau sendiri juga hidup menurut hukum Taurat dengan menaatinya.[b]
  rationale: Revisi memperbaiki kelancaran dan struktur kontras dalam bahasa Indonesia tanpa mengubah makna. “Sementara” tidak ditambahkan; “melainkan bahwa” mempertahankan pertentangan eksplisit dalam teks Yunani. Terjemahan tetap menggambarkan perilaku Paulus dalam narasi ini tanpa menyelesaikan pertanyaan teologis yang lebih luas.
