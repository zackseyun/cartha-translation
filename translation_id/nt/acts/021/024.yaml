  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τούτους παραλαβὼν ἁγνίσθητι σὺν αὐτοῖς καὶ δαπάνησον ἐπ’ αὐτοῖς ἵνα ⸀ξυρήσονται τὴν κεφαλήν, καὶ ⸀γνώσονται πάντες ὅτι ὧν κατήχηνται περὶ σοῦ οὐδέν ἐστιν, ἀλλὰ στοιχεῖς καὶ αὐτὸς ⸂φυλάσσων τὸν νόμον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/024.yaml
  text: Take these men[a], purify yourself along with them, and pay their expenses so that they may shave their heads. Then everyone will know that there is nothing to the things they have been told about you[b], but that you yourself also are living in observance of the law.
translation:
  language: id
  text: Bawalah orang-orang ini bersamamu, sucikanlah dirimu bersama mereka, dan tanggunglah biaya mereka supaya mereka dapat mencukur rambut kepala mereka. Dengan demikian, semua orang akan tahu bahwa tidak ada benarnya pada kabar yang telah mereka dengar tentang dirimu[a], melainkan bahwa engkau sendiri juga hidup menurut hukum Taurat dengan menaatinya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunaninya dapat berarti “diberi tahu” atau “diajar.” Dalam konteks ini, kata tersebut menunjuk pada kabar yang beredar mengenai Paulus.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “berjalan menurut aturan sambil menaati hukum Taurat,” yakni hidup selaras dengan tuntutannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους παραλαβὼν
  choice: Bawalah orang-orang ini bersamamu
  rationale: Partisipel παραλαβών berfungsi menyertai perintah dan berarti membawa atau menerima mereka untuk menyertai diri. 'Orang-orang' dijelaskan oleh konteks ayat sebelumnya.
- source_word: ἁγνίσθητι σὺν αὐτοῖς
  choice: tahirkanlah dirimu bersama mereka
  rationale: ἁγνίζω di sini menunjuk pada tindakan pentahiran ritual; bentuk imperatifnya secara alami diterjemahkan secara refleksif.
- source_word: δαπάνησον ἐπ’ αὐτοῖς
  choice: tanggunglah biaya mereka
  rationale: Ungkapan ini berarti mengeluarkan biaya bagi mereka, yakni menanggung biaya yang berkaitan dengan nazar.
- source_word: ἵνα ξυρήσονται τὴν κεφαλήν
  choice: supaya mereka dapat mencukur kepala
  rationale: ἵνα dengan bentuk futur menyatakan tujuan atau hasil yang dimaksud. Bentuk tunggal 'kepala' dipertahankan secara distributif dan tetap wajar dalam bahasa Indonesia.
- source_word: γνώσονται πάντες
  choice: semua orang akan tahu
  rationale: Menerjemahkan bentuk futur γινώσκω secara langsung; 'Dengan demikian' memperjelas hubungan hasil dalam alur kalimat.
- source_word: ὧν κατήχηνται περὶ σοῦ
  choice: kabar yang telah mereka dengar tentang dirimu
  rationale: κατηχέω dapat berarti mengajar atau memberi tahu. Dalam konteks laporan yang beredar mengenai Paulus, 'kabar yang telah mereka dengar' alami tanpa menyiratkan pengajaran formal.
- source_word: οὐδέν ἐστιν
  choice: tidak benar
  rationale: Ungkapan tersebut menyatakan bahwa laporan itu tidak berdasar atau tidak sesuai kenyataan. 'Tidak benar' menyampaikan maksudnya secara lugas.
- source_word: ἀλλὰ στοιχεῖς καὶ αὐτὸς φυλάσσων τὸν νόμον
  choice: tetapi bahwa engkau sendiri juga hidup tertib dengan menaati hukum Taurat
  rationale: στοιχέω menggambarkan hidup atau berjalan selaras dengan suatu patokan, sedangkan φυλάσσω berarti menaati. Terjemahan mempertahankan kedua unsur tanpa ungkapan harfiah yang kabur.
- source_word: νόμον
  choice: hukum Taurat
  rationale: Dalam konteks Yahudi ini νόμος merujuk pada Taurat. Pilihan ini lebih jelas dalam bahasa Indonesia daripada 'hukum' saja tanpa menambahkan penjelasan doktrinal.
theological_decisions:
- issue: Hubungan Paulus dengan hukum Taurat dalam narasi ini
  choice: engkau sendiri juga hidup tertib dengan menaati hukum Taurat
  alternative: engkau sendiri juga menaati hukum Taurat
  rationale: Rumusan ini menggambarkan perilaku Paulus yang akan tampak melalui tindakannya dalam episode tersebut, tanpa menarik kesimpulan lebih luas tentang teologi Paulus mengenai Taurat atau menghilangkan ketegangan dengan bagian lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tahirkanlah' mempertahankan nuansa ritual, sedangkan 'hukum Taurat' memperjelas acuan νόμος bagi pembaca umum. Kedua penanda catatan kaki muncul dalam teks utama.
