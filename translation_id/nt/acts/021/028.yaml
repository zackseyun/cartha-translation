id: ACT.21.28
reference: Acts 21:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κράζοντες· Ἄνδρες Ἰσραηλῖται, βοηθεῖτε· οὗτός ἐστιν ὁ ἄνθρωπος ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου πάντας ⸀πανταχῇ διδάσκων, ἔτι τε καὶ Ἕλληνας εἰσήγαγεν εἰς τὸ ἱερὸν καὶ κεκοίνωκεν τὸν ἅγιον τόπον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/028.yaml
  text: shouting[a], “Men of Israel, help! This is the man who teaches everyone everywhere against the people and the law and this place. And besides that, he has even brought Greeks into the temple and has defiled this holy place.”
translation:
  language: id
  text: sambil berteriak, “Hai orang-orang Israel, tolong! Inilah orang yang di mana-mana mengajar semua orang untuk menentang bangsa ini, hukum Taurat, dan tempat ini. Selain itu, ia bahkan membawa orang-orang Yunani masuk ke kompleks Bait Allah[a] dan menajiskan tempat suci ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ἱερόν menunjuk pada kompleks Bait Allah, termasuk pelatarannya, bukan secara khusus ruang suci bagian dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράζοντες
  choice: sambil berteriak
  rationale: Partisipel kini ini menyatakan cara mereka melontarkan tuduhan; bentuk ini alami dalam bahasa Indonesia dan mempertahankan suasana seruan keras yang mendesak.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Hai orang-orang Israel
  rationale: Sapaan vokatif kepada para laki-laki Israel. Dalam bahasa Indonesia modern, 'orang-orang Israel' merupakan sapaan kolektif yang alami tanpa perlu menambahkan kata 'laki-laki', yang akan terdengar kaku.
- source_word: βοηθεῖτε
  choice: tolong!
  rationale: Imperatif berupa seruan meminta bantuan. 'Tolong!' ringkas dan tidak menambahkan objek yang tidak dinyatakan dalam bahasa Yunani.
- source_word: οὗτός ἐστιν ὁ ἄνθρωπος
  choice: Inilah orang
  rationale: Ungkapan identifikasi yang menunjuk langsung kepada Paulus; 'Inilah orang' mempertahankan daya tuduhnya secara alami.
- source_word: ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου
  choice: yang ... menentang bangsa kita, hukum Taurat, dan tempat ini
  rationale: κατά dengan genitif menyatakan pertentangan. 'Bangsa kita' menjelaskan acuan kontekstual τοῦ λαοῦ kepada bangsa Yahudi tanpa memperluas makna; 'hukum Taurat' mengidentifikasi hukum Musa secara wajar dalam bahasa Indonesia.
- source_word: πάντας πανταχῇ διδάσκων
  choice: di mana-mana mengajar semua orang
  rationale: Mempertahankan cakupan ganda dan penekanan πάντας serta πανταχῇ dalam susunan yang alami.
- source_word: ἔτι τε καὶ
  choice: Bahkan, ia juga
  rationale: Menandai tuduhan tambahan yang semakin berat dan mempertahankan daya kumulatif ungkapan Yunani.
- source_word: Ἕλληνας
  choice: orang-orang Yunani
  rationale: Menerjemahkan acuan etnis spesifik secara langsung, bukan memperluasnya menjadi 'orang bukan Yahudi'.
- source_word: εἰσήγαγεν εἰς τὸ ἱερὸν
  choice: membawa orang-orang Yunani masuk ke kompleks Bait Allah
  rationale: ἱερόν menunjuk seluruh kompleks atau pelataran Bait Allah, bukan khusus ruang suci bagian dalam. Terjemahan utama dibuat eksplisit demi ketepatan historis.
- source_word: κεκοίνωκεν
  choice: menajiskan
  rationale: Dalam konteks kultis, κοινόω berarti menjadikan najis atau tidak kudus; 'menajiskan' adalah padanan Indonesia yang tepat dan jelas.
- source_word: τὸν ἅγιον τόπον τοῦτον
  choice: tempat suci ini
  rationale: Mempertahankan sifat kudus dan penunjukan demonstratif dalam ungkapan yang alami.
theological_decisions:
- issue: Acuan τοῦ νόμου
  choice: hukum Taurat
  alternative: hukum
  rationale: Dalam konteks Yerusalem dan Bait Allah, tuduhan itu mengacu pada hukum Musa. 'Hukum Taurat' menyampaikan acuan tersebut secara alami tanpa menjadikannya hukum secara abstrak.
- issue: Cakupan ἱερόν
  choice: kompleks Bait Allah
  alternative: Bait Allah; pelataran Bait Allah
  rationale: ἱερόν mencakup kawasan atau pelataran Bait Allah dan dibedakan dari ναός, tempat suci bagian dalam. Pilihan ini mempertahankan ketepatan leksikal tanpa menyiratkan bahwa orang-orang Yunani memasuki ruang mahakudus.
- issue: Acuan τοῦ λαοῦ
  choice: bangsa kita
  alternative: bangsa itu; umat ini
  rationale: Dalam seruan kepada 'orang-orang Israel', acuan tersebut adalah bangsa Israel/Yahudi. Kata 'kita' membuat acuan pragmatisnya jelas, tetapi tetap menyajikannya sebagai bagian dari tuduhan para penentang Paulus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada mendesak dan menuduh. Susunan dibuat mudah dipahami saat dibacakan, sambil mempertahankan pengulangan cakupan 'semua orang' dan 'di mana-mana'. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskannya.
