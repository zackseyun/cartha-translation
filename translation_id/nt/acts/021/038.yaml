  text: Then you are not the Egyptian who some days ago stirred up a revolt and led the four thousand men of the assassins out into the wilderness?[a]
translation:
  language: id
  text: “Jadi, bukankah kamu orang Mesir yang beberapa waktu lalu mengobarkan pemberontakan dan memimpin empat ribu orang Sicarii ke padang belantara?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “empat ribu pembunuh” atau “empat ribu orang berbelati”; bahasa Yunani: “Sicarii”, kelompok yang dikenal melakukan pembunuhan dengan belati tersembunyi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἄρα
  choice: Jadi, bukankah
  rationale: Gabungan ini menyatakan kesimpulan dalam bentuk pertanyaan. Ungkapan “Jadi, bukankah” terdengar alami dalam bahasa Indonesia dan mempertahankan dugaan sang komandan.
- source_word: ὁ Αἰγύπτιος
  choice: orang Mesir
  rationale: Artikelnya menunjuk kepada tokoh tertentu yang dikenal dalam konteks. Bahasa Indonesia tidak memiliki kata sandang tentu yang sepadan; konstruksi dan keterangan selanjutnya membuat rujukannya jelas.
- source_word: πρὸ τούτων τῶν ἡμερῶν
  choice: beberapa waktu lalu
  rationale: Ungkapan ini menunjuk pada waktu yang relatif belum lama sebelum percakapan tersebut tanpa menetapkan jumlah hari secara persis.
- source_word: ἀναστατώσας
  choice: mengobarkan pemberontakan
  rationale: Dalam konteks politik ini, verba tersebut berarti menimbulkan kekacauan atau menghasut pergolakan. “Mengobarkan pemberontakan” menyampaikan tindakan aktif memicu gerakan tersebut.
- source_word: ἐξαγαγὼν
  choice: membawa ... ke
  rationale: Partisip ini menggambarkan tindakan membawa atau memimpin kelompok itu keluar menuju padang belantara. “Membawa ... ke” alami dalam kalimat Indonesia dan tidak menambahkan asal yang tidak disebutkan.
- source_word: εἰς τὴν ἔρημον
  choice: ke padang belantara
  rationale: ἔρημος dapat berarti daerah sepi, gurun, atau wilayah tak berpenghuni. “Padang belantara” mempertahankan cakupan luas itu tanpa mengharuskan gambaran gurun pasir.
- source_word: τοὺς τετρακισχιλίους ἄνδρας
  choice: keempat ribu orang
  rationale: Artikelnya menandai kelompok tertentu. Bentuk “keempat ribu orang” mempertahankan ketentuan itu dan tidak membatasi ἄνδρας secara tidak perlu menjadi “laki-laki” dalam bahasa sasaran.
- source_word: τῶν σικαρίων
  choice: dari antara para pembunuh itu
  rationale: Genitif partitif menunjukkan bahwa empat ribu orang tersebut berasal dari kelompok Sicarii. “Para pembunuh” menyampaikan fungsi kelompok itu secara jelas, sedangkan nama dan arti harfiahnya dipertahankan dalam catatan kaki.
