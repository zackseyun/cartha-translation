- from: “Jadi, bukankah kamu orang Mesir yang beberapa waktu lalu mengobarkan pemberontakan dan membawa keempat ribu orang dari antara para pembunuh itu ke padang belantara?[a]”
  to: “Jadi, bukankah kamu orang Mesir yang beberapa waktu lalu mengobarkan pemberontakan dan memimpin empat ribu orang Sicarii ke padang belantara?[a]”
  rationale: Revisi memperbaiki bentuk bilangan agar menyatakan ‘empat ribu’, mempertahankan Sicarii sebagai penanda kelompok historis dalam teks utama, dan menjelaskan alternatif makna leksikalnya dalam catatan kaki. Pergantian “membawa” menjadi “memimpin” lebih mencerminkan fungsi partisip ἐξαγαγών dalam konteks ini.
