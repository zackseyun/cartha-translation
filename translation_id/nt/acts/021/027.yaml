translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat yang alami dan bermartabat. Kalimat panjang Yunani dibagi menjadi dua untuk keterbacaan. Istilah 'Bait Allah' dipertahankan sebagai sebutan yang umum dipahami, sedangkan cakupan ἱερόν dibuat eksplisit sebagai 'kompleks'.
