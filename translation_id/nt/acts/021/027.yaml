  text: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι, οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ συνέχεον πάντα τὸν ὄχλον καὶ ἐπέβαλον ⸂ἐπ’ αὐτὸν τὰς χεῖρας⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/027.yaml
  text: As the seven days were about to be completed[a], the Jews from Asia, seeing him in the temple, stirred up the whole crowd and laid hands on him[c][b],
translation:
  language: id
  text: Ketika masa tujuh hari itu hampir selesai, orang-orang Yahudi dari Asia melihat Paulus di kompleks Bait Allah[c]. Mereka menghasut seluruh orang banyak[a] dan menangkapnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membuat seluruh orang banyak menjadi kacau.” Kata kerja Yunani ini dapat menekankan tindakan menghasut ataupun membuat orang banyak kebingungan dan kacau.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “meletakkan tangan ke atasnya,” suatu ungkapan yang berarti memegang seseorang dengan paksa.
    reason: lexical_alternative
  - marker: c
    text: Istilah Yunani di sini menunjuk pada kompleks atau pelataran Bait Allah, bukan secara khusus ruang kudus bagian dalam.
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι
  choice: Ketika masa tujuh hari itu hampir selesai
  rationale: Ungkapan ini menyatakan bahwa berakhirnya masa tujuh hari sudah dekat. Penambahan 'masa' menghasilkan bahasa Indonesia yang alami tanpa menjelaskan secara berlebihan apa yang terjadi selama tujuh hari itu.
- source_word: οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: orang-orang Yahudi dari Asia
  rationale: Asia di sini adalah nama provinsi Romawi. Bentuk ini mempertahankan nama geografis sumber dan menghindari kesan bahwa yang dimaksud ialah seluruh benua Asia modern.
- source_word: θεασάμενοι αὐτὸν
  choice: melihat Paulus
  rationale: Partisip Yunani dialihkan menjadi klausa verbal alami. Nama Paulus dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: ἐν τῷ ἱερῷ
  choice: di kompleks Bait Allah
  rationale: ἱερόν menunjuk pada seluruh kawasan atau pelataran Bait Allah, bukan secara khusus ruang kudus bagian dalam.
- source_word: συνέχεον πάντα τὸν ὄχλον
  choice: menghasut seluruh orang banyak
  rationale: Dalam konteks pengeroyokan, συνέχεον menggambarkan tindakan yang mengobarkan atau mengacaukan kerumunan. 'Menghasut' menyampaikan dorongan aktif terhadap orang banyak, sementara alternatif semantis dicatat dalam catatan kaki.
- source_word: ἐπέβαλον ἐπ’ αὐτὸν τὰς χεῖρας
  choice: menangkapnya
  rationale: Idiom harfiah 'meletakkan tangan ke atasnya' menyatakan tindakan memegang seseorang secara paksa. 'Menangkapnya' jelas dan alami dalam bahasa Indonesia; bentuk yang lebih harfiah dicatat sebagai alternatif.
