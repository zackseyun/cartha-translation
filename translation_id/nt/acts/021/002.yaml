translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Struktur partisip Yunani diungkapkan sebagai rangkaian tindakan yang jelas, sementara ungkapan 'menyeberang ke Fenisia' dipertahankan dalam teks utama untuk menjaga gambaran sumber.
