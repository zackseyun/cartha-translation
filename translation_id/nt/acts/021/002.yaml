  text: καὶ εὑρόντες πλοῖον διαπερῶν εἰς Φοινίκην ἐπιβάντες ἀνήχθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/002.yaml
  text: And after finding a ship crossing over to Phoenicia[a], we went aboard and set sail.
translation:
  language: id
  text: Setelah menemukan sebuah kapal yang menyeberang ke Fenisia[a], kami naik ke kapal itu lalu berlayar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebuah kapal yang menuju Fenisia.” Secara harfiah, bahasa Yunani menggambarkan kapal itu sebagai kapal yang “menyeberang ke Fenisia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρόντες
  choice: setelah menemukan
  rationale: Partisip aoristus ini menyatakan tindakan yang mendahului tindakan utama; frasa ini menyampaikan urutan waktunya secara alami.
- source_word: πλοῖον
  choice: sebuah kapal
  rationale: Istilah umum untuk kapal; dalam konteks pelayaran Laut Tengah, 'kapal' lebih tepat daripada 'perahu'.
- source_word: διαπερῶν
  choice: yang menyeberang
  rationale: Partisip kini ini menerangkan kapal dan mempertahankan gambaran verbal tentang perjalanan melintasi laut tanpa mempersempitnya menjadi sekadar keterangan tujuan.
- source_word: εἰς Φοινίκην
  choice: ke Fenisia
  rationale: Preposisi εἰς menunjukkan arah atau tujuan.
- source_word: ἐπιβάντες
  choice: kami naik ke kapal itu
  rationale: Dalam konteks pelayaran, verba ini berarti naik atau masuk ke kapal. Penyebutan 'kapal itu' alami dalam bahasa Indonesia dan memperjelas acuannya.
- source_word: ἀνήχθημεν
  choice: lalu berlayar
  rationale: Dalam pemakaian bahari, verba ini berarti bertolak atau mulai berlayar. 'Lalu berlayar' menyampaikan tindakan utama dan urutan narasi dengan wajar.
