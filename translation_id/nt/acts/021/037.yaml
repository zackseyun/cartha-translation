  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μέλλων τε εἰσάγεσθαι εἰς τὴν παρεμβολὴν ὁ Παῦλος λέγει τῷ χιλιάρχῳ· Εἰ ἔξεστίν μοι εἰπεῖν ⸀τι πρὸς σέ; ὁ δὲ ἔφη· Ἑλληνιστὶ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/037.yaml
  text: As Paul was about to be brought into the barracks[a], he said to the tribune, “Is it permitted for me to say something to you?” And he said[c][b], “Do you know Greek?”
translation:
  language: id
  text: Ketika Paulus hendak dibawa masuk ke markas tentara[a], ia berkata kepada komandan pasukan itu[b], “Bolehkah saya mengatakan sesuatu kepada Anda?” Komandan itu berkata, “Kamu tahu bahasa Yunani?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Markas tentara” menunjuk pada tempat tinggal dan pusat kegiatan pasukan Romawi, kemungkinan di dalam kompleks benteng.
    reason: cultural_note
  - marker: b
    text: Istilah Yunani yang diterjemahkan “komandan pasukan” dapat merujuk pada seorang tribun militer Romawi. Secara harfiah, istilah itu berarti “pemimpin seribu.”
    reason: cultural_note
lexical_decisions:
- source_word: Μέλλων τε εἰσάγεσθαι
  choice: Ketika ... hendak dibawa masuk
  rationale: Konstruksi temporal ini menyampaikan tindakan yang segera akan terjadi, sedangkan bentuk pasif εἰσάγεσθαι dipertahankan dengan “dibawa masuk”.
- source_word: παρεμβολή
  choice: markas tentara
  rationale: Dalam konteks Yerusalem, istilah ini menunjuk pada kawasan tempat pasukan Romawi bermarkas, kemungkinan di kompleks benteng; “markas tentara” lebih wajar dalam bahasa Indonesia modern daripada “perkemahan” dan tidak menyamakan istilah ini begitu saja dengan benteng.
- source_word: χιλίαρχος
  choice: komandan pasukan
  rationale: Istilah ini menyebut seorang perwira tinggi Romawi yang memimpin pasukan dalam jumlah besar. “Komandan pasukan” mudah dipahami dan mempertahankan fungsi militernya tanpa memakai gelar historis yang asing.
- source_word: Εἰ ἔξεστίν μοι εἰπεῖν τι πρὸς σέ
  choice: Bolehkah saya mengatakan sesuatu kepada Anda?
  rationale: ἔξεστιν menyatakan izin. Bentuk Indonesia ini mempertahankan pertanyaan sopan dan makna permohonan izin secara alami.
- source_word: τι
  choice: sesuatu
  rationale: Kata ganti tak tentu ini secara langsung dan alami berarti “sesuatu” dalam konteks tersebut.
- source_word: Ἑλληνιστί γινώσκεις
  choice: Kamu tahu bahasa Yunani?
  rationale: Ἑλληνιστί berarti “dalam bahasa Yunani,” sedangkan γινώσκεις berarti “tahu/mengenal.” Terjemahan ini mempertahankan ungkapan sumber dan tetap wajar sebagai pertanyaan mengenai penguasaan bahasa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Anda” mencerminkan sapaan sopan Paulus kepada atasannya, sedangkan “kamu” dalam jawaban komandan sesuai dengan relasi sosial dalam adegan. Pengulangan “komandan” menghindari rujukan pronominal yang kabur.
