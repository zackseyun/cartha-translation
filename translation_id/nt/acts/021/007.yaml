  text: Ἡμεῖς δὲ τὸν πλοῦν διανύσαντες ἀπὸ Τύρου κατηντήσαμεν εἰς Πτολεμαΐδα, καὶ ἀσπασάμενοι τοὺς ἀδελφοὺς ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/007.yaml
  text: We[a], having finished the voyage from Tyre, arrived at Ptolemais, and after greeting the brothers, we stayed with them one day.
translation:
  language: id
  text: Setelah menyelesaikan pelayaran dari Tirus, kami tiba di Ptolemais. Sesudah memberi salam kepada saudara-saudara[a], kami tinggal bersama mereka selama satu hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudari”; teks Yunani mengatakan “saudara-saudara,” bentuk jamak maskulin yang dapat merujuk secara lebih luas kepada sesama orang percaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: kami
  rationale: Pronomina eksplisit menandai subjek narasi, sedangkan δέ meneruskan atau mengalihkan alur. Dalam bahasa Indonesia, transisi itu cukup terserap dalam kelanjutan narasi tanpa perlu dipaksakan menjadi “tetapi”.
- source_word: τὸν πλοῦν διανύσαντες
  choice: setelah menyelesaikan pelayaran
  rationale: διανύω menyatakan penyelesaian suatu perjalanan atau rentang, dan πλοῦς adalah perjalanan melalui laut. Bentuk “setelah” menyampaikan bahwa tindakan ini mendahului tibanya mereka.
- source_word: ἀπὸ Τύρου
  choice: dari Tirus
  rationale: ἀπό menandai titik keberangkatan secara langsung.
- source_word: κατηντήσαμεν εἰς Πτολεμαΐδα
  choice: kami tiba di Ptolemais
  rationale: Dalam konteks perjalanan, καταντάω berarti tiba atau mencapai tujuan, sementara εἰς menandai tempat tujuan. “Tiba di” adalah ungkapan Indonesia yang alami.
- source_word: ἀσπασάμενοι
  choice: sesudah memberi salam kepada
  rationale: ἀσπάζομαι berarti menyapa atau memberi salam. “Sesudah” mempertahankan urutan tindakan partisipel aoris sebelum mereka tinggal di sana.
- source_word: τοὺς ἀδελφοὺς
  choice: saudara-saudara
  rationale: ἀδελφοί berbentuk jamak maskulin dan dalam pemakaian komunitas Kristen dapat menunjuk sesama orang percaya secara lebih luas. “Saudara-saudara” mempertahankan bentuk kekerabatan dan kemungkinan cakupan yang dijelaskan dalam catatan kaki.
- source_word: ἐμείναμεν ἡμέραν μίαν
  choice: kami tinggal ... selama satu hari
  rationale: μένω berarti tinggal atau menetap, sedangkan akusatif ἡμέραν μίαν menunjukkan lamanya waktu. “Selama satu hari” membuat fungsi duratifnya jelas dan alami.
- source_word: παρ’ αὐτοῖς
  choice: bersama mereka
  rationale: παρά dengan datif di sini menunjukkan keberadaan dalam lingkungan atau kebersamaan dengan orang-orang tersebut.
theological_decisions:
- issue: Cakupan τοὺς ἀδελφοὺς dalam konteks jemaat Kristen
  choice: saudara-saudara
  alternative: saudara-saudari; sesama orang percaya
  rationale: Teks Yunani memakai bentuk jamak maskulin, tetapi dalam konteks komunitas Kristen istilah itu dapat mencakup orang percaya perempuan. Teks utama mempertahankan ungkapan kekerabatan yang dekat dengan bentuk sumber, dan catatan kaki menjaga kemungkinan cakupan yang lebih luas tanpa menentukannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Ayat dibagi menjadi dua kalimat agar rangkaian perjalanan mudah dipahami; “di sana” memperjelas bahwa saudara-saudara itu berada di Ptolemais tanpa menambah informasi baru.
