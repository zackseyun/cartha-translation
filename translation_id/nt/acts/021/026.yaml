revisions:
- from: Kemudian Paulus mengajak orang-orang itu bersamanya. Keesokan harinya, setelah menjalani pentahiran bersama mereka, ia masuk ke kompleks Bait Allah[a] dan memberitahukan kapan masa pentahiran akan berakhir, yaitu ketika persembahan dipersembahkan[b] bagi masing-masing dari mereka.
  to: Kemudian Paulus membawa serta para pria itu. Keesokan harinya, setelah menjalani pentahiran bersama mereka, ia masuk ke kompleks Bait Allah[a], seraya memberitahukan selesainya masa pentahiran, sampai persembahan dipersembahkan[b] bagi masing-masing dari mereka.
  rationale: Revisi memulihkan nilai temporal ἕως οὗ sebagai “sampai,” mempertahankan keterpadatan dan kemungkinan ambiguitas sintaksis sumber, serta memperjelas bahwa orang-orang yang dibawa Paulus adalah para pria. Istilah ritual dipertahankan tanpa memasukkan penilaian teologis mengenai tindakan Paulus.
  reviewer_model: gpt-5.6-terra
