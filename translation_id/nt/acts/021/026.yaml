id: ACT.21.26
reference: Acts 21:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος παραλαβὼν τοὺς ἄνδρας τῇ ἐχομένῃ ἡμέρᾳ σὺν αὐτοῖς ἁγνισθεὶς εἰσῄει εἰς τὸ ἱερόν, διαγγέλλων τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ ἕως οὗ προσηνέχθη ὑπὲρ ἑνὸς ἑκάστου αὐτῶν ἡ προσφορά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/026.yaml
  text: Then Paul took the men[a], and on the next day, having purified himself with them, he entered the temple, giving notice of the completion of the days of purification[b], until the offering was presented for each one of them.
translation:
  language: id
  text: Kemudian Paulus membawa serta para pria itu. Keesokan harinya, setelah menjalani pentahiran bersama mereka, ia masuk ke kompleks Bait Allah[a], seraya memberitahukan selesainya masa pentahiran, sampai persembahan dipersembahkan[b] bagi masing-masing dari mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ἱερόν menunjuk pada seluruh kompleks Bait Allah, bukan secara khusus ruang kudus bagian dalam.
    reason: lexical_clarification
  - marker: b
    text: Atau “persembahan itu dibawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν τοὺς ἄνδρας
  choice: mengajak orang-orang itu bersamanya
  rationale: Partisip aoris ini menyatakan bahwa Paulus membawa atau mengikutsertakan orang-orang tersebut. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan unsur kebersamaan.
- source_word: τῇ ἐχομένῃ ἡμέρᾳ
  choice: keesokan harinya
  rationale: Ungkapan waktu ini menunjuk pada hari yang langsung menyusul dan paling wajar diterjemahkan demikian dalam bahasa Indonesia modern.
- source_word: σὺν αὐτοῖς ἁγνισθεὶς
  choice: setelah menjalani pentahiran bersama mereka
  rationale: Konteksnya adalah pentahiran ritual. 'Menjalani pentahiran' tidak memaksakan apakah bentuk Yunani ini harus dipahami secara refleksif atau pasif.
- source_word: εἰσῄει
  choice: ia masuk
  rationale: Walaupun bentuk imperfek dapat memberi nuansa tindakan yang sedang berlangsung atau berulang, bentuk lampau sederhana paling alami dalam narasi Indonesia dan tidak meniadakan kemungkinan aspek tersebut.
- source_word: τὸ ἱερόν
  choice: kompleks Bait Allah
  rationale: ἱερόν menunjuk pada kawasan atau kompleks Bait Allah, bukan secara khusus ruang kudus bagian dalam. Pilihan ini menyampaikan perbedaan leksikal itu langsung dalam teks.
- source_word: διαγγέλλων
  choice: memberitahukan
  rationale: Kata ini menggambarkan penyampaian pemberitahuan, kemungkinan kepada pihak yang mengurus tata cara Bait Allah, tanpa menambahkan pelaku penerima yang tidak disebutkan.
- source_word: τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ
  choice: kapan masa pentahiran akan berakhir
  rationale: Terjemahan ini menyampaikan berakhir atau genapnya jangka waktu pentahiran dengan bahasa Indonesia yang jelas, tanpa mempertahankan konstruksi nominal Yunani secara kaku.
- source_word: ἕως οὗ
  choice: yaitu ketika
  rationale: Dalam susunan kalimat ini, frasa tersebut menghubungkan berakhirnya masa pentahiran dengan saat persembahan diberikan. 'Yaitu ketika' membuat hubungan waktunya jelas tanpa mengubah isi.
- source_word: προσηνέχθη ... ἡ προσφορά
  choice: persembahan dipersembahkan
  rationale: Bentuk pasif dan konteks ibadah dipertahankan. Pengulangan akar kata terdengar formal tetapi jelas; alternatif 'diberikan' dicatat dalam catatan kaki.
- source_word: ὑπὲρ ἑνὸς ἑκάστου αὐτῶν
  choice: bagi masing-masing dari mereka
  rationale: ὑπέρ menyatakan hubungan untuk kepentingan atau atas nama tiap orang; 'bagi' mempertahankan keluasan makna itu.
theological_decisions:
- issue: Makna keikutsertaan Paulus dalam tata cara pentahiran
  choice: Menerjemahkan tindakan Paulus secara langsung sebagai partisipasi dalam pentahiran ritual Yahudi
  alternative: Memberi kesan bahwa tindakan itu mendukung atau menolak keberlakuan teologis tata cara Bait Allah bagi orang Kristen
  rationale: Ayat ini bersifat naratif dan tidak secara eksplisit menilai tindakan Paulus atau menyelesaikan perdebatan tentang Taurat dan ibadah Bait Allah.
- issue: Hubungan antara berakhirnya masa pentahiran dan persembahan
  choice: 'Mempertahankan hubungan waktu: masa itu berakhir ketika persembahan dipersembahkan'
  alternative: Menafsirkan pemberitahuan hanya sebagai pengumuman bahwa seluruh proses sudah selesai
  rationale: Susunan Yunani cukup padat dan dapat dipahami dengan beberapa cara. Terjemahan ini mengikuti hubungan temporal yang paling masuk akal tanpa menambahkan rincian ritual yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah 'pentahiran' dipakai untuk menandai konteks ritual, sedangkan struktur kalimat Yunani yang padat diuraikan secukupnya agar mudah dipahami tanpa memasukkan penilaian teologis.
