  text: ⸀ἀναφάναντες δὲ τὴν Κύπρον καὶ καταλιπόντες αὐτὴν εὐώνυμον ἐπλέομεν εἰς Συρίαν, καὶ ⸀κατήλθομεν εἰς Τύρον, ἐκεῖσε γὰρ ⸂τὸ πλοῖον ἦν⸃ ἀποφορτιζόμενον τὸν γόμον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/003.yaml
  text: After sighting Cyprus and leaving it on our left[a], we sailed on to Syria and came down to Tyre[d][c][b], for there the ship was unloading its cargo.
translation:
  language: id
  text: Setelah melihat Pulau Siprus dan meninggalkannya di sebelah kiri kami[a], kami terus berlayar menuju Siria, lalu tiba di Tirus[b], sebab di sanalah kapal itu sedang menurunkan muatannya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “meninggalkannya di sebelah kiri”; maksudnya, Pulau Siprus berada di sisi kiri kapal ketika mereka melewatinya.
    reason: cultural_note
  - marker: b
    text: Secara lebih harfiah, “turun ke Tirus”; dapat juga diterjemahkan “sampai di Tirus.”
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan, “muatan kapal itu sedang dibongkar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναφάναντες
  choice: setelah melihat Pulau Siprus
  rationale: Partisip aoristus ini menyatakan tindakan yang mendahului pelayaran selanjutnya. Dalam konteks perjalanan laut, frasa ini berarti bahwa Siprus mulai terlihat; terjemahan ini ringkas dan alami.
- source_word: καταλιπόντες αὐτὴν εὐώνυμον
  choice: membiarkannya di sebelah kiri kami
  rationale: εὐώνυμος berarti 'sebelah kiri'. Ungkapan ini menjelaskan bahwa kapal melewati Siprus dengan pulau itu tetap berada di sisi kiri arah pelayaran.
- source_word: ἐπλέομεν εἰς Συρίαν
  choice: kami terus berlayar menuju Siria
  rationale: Bentuk imperfek menggambarkan pelayaran yang sedang berlanjut. 'Terus berlayar' menyampaikan kesinambungan itu secara wajar.
- source_word: κατήλθομεν εἰς Τύρον
  choice: tiba di Tirus
  rationale: κατέρχομαι secara harfiah dapat berarti 'turun' atau 'datang turun', tetapi dalam laporan perjalanan laut juga dipakai untuk mencapai atau mendarat di suatu tempat. 'Tiba' paling alami dalam bahasa Indonesia, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ἐκεῖσε
  choice: di sanalah
  rationale: Kata keterangan ini menunjuk kepada Tirus sebagai tempat pembongkaran. Partikel '-lah' menegaskan hubungan alasan dengan tempat tujuan tanpa menambah makna baru.
- source_word: ἀποφορτιζόμενον
  choice: sedang membongkar
  rationale: Partisip kini medio-pasif bersama ἦν membentuk konstruksi perifrastis yang menggambarkan proses pembongkaran. Bentuk Yunaninya dapat dipahami secara aktif dengan kapal sebagai subjek idiomatis atau secara pasif.
- source_word: τὸν γόμον
  choice: muatannya
  rationale: γόμος adalah muatan atau kargo kapal. Sufiks posesif membuat hubungan dengan kapal jelas dan alami dalam bahasa Indonesia.
