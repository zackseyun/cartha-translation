translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama tempat mengikuti bentuk Indonesia yang lazim, yaitu Siprus, Siria, dan Tirus. Istilah teknis pelayaran seperti 'lambung kiri' dihindari demi kejelasan bagi pembaca umum.
