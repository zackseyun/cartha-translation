id: ACT.21.4
reference: Acts 21:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂ἀνευρόντες δὲ τοὺς⸃ μαθητὰς ἐπεμείναμεν αὐτοῦ ἡμέρας ἑπτά, οἵτινες τῷ Παύλῳ ἔλεγον διὰ τοῦ πνεύματος μὴ ⸀ἐπιβαίνειν εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/004.yaml
  text: After finding the disciples[a], we stayed there seven days. They kept telling Paul through the Spirit not to go up to Jerusalem.
translation:
  language: id
  text: Setelah menemukan murid-murid, kami tinggal di sana selama tujuh hari. Melalui Roh, mereka berulang kali mengatakan kepada Paulus agar tidak pergi ke Yerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa ini mungkin berarti bahwa Roh menyatakan penderitaan yang akan dialami Paulus, lalu murid-murid itu menyimpulkan bahwa ia tidak boleh melanjutkan perjalanan ke Yerusalem.
    reason: Menjaga kemungkinan penafsiran dan ketegangan dengan Kisah Para Rasul 19:21 serta 20:22–23 tanpa mengubah pernyataan teks utama.
lexical_decisions:
- source_word: ἀνευρόντες
  choice: Setelah menemukan
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama; terjemahan ini mempertahankan urutan tersebut secara alami.
- source_word: μαθητάς
  choice: murid-murid
  rationale: Padanan baku bagi μαθητής dalam Kisah Para Rasul dan lebih tepat daripada istilah yang lebih umum seperti 'orang-orang percaya'.
- source_word: ἐπεμείναμεν αὐτοῦ
  choice: kami tinggal di sana
  rationale: ἐπιμένω berarti tetap atau tinggal, sedangkan αὐτοῦ di sini merupakan keterangan tempat, 'di sana'.
- source_word: ἡμέρας ἑπτά
  choice: selama tujuh hari
  rationale: Bentuk akusatif menyatakan rentang waktu; 'selama' membuat fungsi duratifnya jelas dan alami dalam bahasa Indonesia.
- source_word: οἵτινες
  choice: mereka
  rationale: Kata ini merujuk kembali kepada murid-murid. Memulai kalimat baru dengan 'mereka' menghasilkan bahasa Indonesia yang wajar.
- source_word: ἔλεγον
  choice: berulang kali mengatakan
  rationale: Bentuk imperfek dapat menunjukkan tindakan yang berlanjut atau berulang; frasa ini mempertahankan aspek tersebut.
- source_word: διὰ τοῦ πνεύματος
  choice: Melalui Roh
  rationale: διά dengan genitif menyatakan perantaraan atau sarana. 'Roh' secara wajar merujuk kepada Roh Kudus dalam konteks Kisah Para Rasul tanpa menambahkan kata yang tidak dinyatakan secara eksplisit dalam teks Yunani.
- source_word: μὴ ἐπιβαίνειν
  choice: agar tidak pergi
  rationale: Dalam konteks perjalanan menuju suatu kota, ἐπιβαίνω berarti melanjutkan perjalanan atau pergi ke tujuan. Bahasa Indonesia tidak memerlukan ungkapan arah 'naik' untuk Yerusalem.
- source_word: εἰς Ἱεροσόλυμα
  choice: ke Yerusalem
  rationale: Padanan tujuan yang baku dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan frasa διὰ τοῦ πνεύματος dengan larangan pergi ke Yerusalem
  choice: Melalui Roh, mereka berulang kali mengatakan kepada Paulus agar tidak pergi ke Yerusalem.
  alternative: Roh menyatakan penderitaan yang menanti Paulus, lalu murid-murid menyimpulkan bahwa ia tidak boleh pergi.
  rationale: Teks secara gramatikal menghubungkan perkataan mereka dengan perantaraan Roh, tetapi konteks Kisah Para Rasul menimbulkan ketegangan mengenai apakah Roh memberikan larangan langsung atau menyingkapkan penderitaan yang kemudian mendasari kesimpulan para murid. Teks utama mempertahankan susunan sumber, sedangkan catatan kaki mengakui kemungkinan penafsiran tanpa memaksakannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Berulang kali mengatakan' mempertahankan nuansa imperfek tanpa terdengar kuno. Ungkapan 'pergi ke Yerusalem' dipilih daripada 'naik ke Yerusalem' karena lebih alami bagi pembaca Indonesia masa kini.
