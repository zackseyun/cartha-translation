  text: ⸂τότε ἐγγίσας⸃ ὁ χιλίαρχος ἐπελάβετο αὐτοῦ καὶ ἐκέλευσε δεθῆναι ἁλύσεσι δυσί, καὶ ἐπυνθάνετο ⸀τίς εἴη καὶ τί ἐστιν πεποιηκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/033.yaml
  text: Then the commander came up[a], seized him, and ordered him to be bound with two chains[b], and was asking who he was and what he had done.
translation:
  language: id
  text: Kemudian perwira[a] itu mendekat, menangkap Paulus, dan memerintahkan agar Paulus dibelenggu dengan dua rantai[b], lalu menanyakan siapa Paulus itu dan apa yang telah dilakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tribun”. Istilah Yunani χιλίαρχος secara harfiah berarti “pemimpin seribu orang” dan dalam konteks ini menunjuk seorang perwira militer Romawi.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “dua rantai” mungkin menggemakan nubuat dalam Kisah Para Rasul 21:11 bahwa Paulus akan diikat di Yerusalem.
    reason: cross_reference
lexical_decisions:
- source_word: χιλίαρχος
  choice: perwira
  rationale: Istilah ini menunjuk kepada perwira tinggi Romawi yang memimpin satu kohor. 'Perwira' alami dan mudah dipahami dalam bahasa Indonesia; rincian pangkat harfiahnya dijelaskan dalam catatan kaki.
- source_word: ἐγγίσας
  choice: mendekat
  rationale: Partisip aoris ini menyatakan tindakan mendekat yang mendahului tindakan utama.
- source_word: ἐπελάβετο αὐτοῦ
  choice: menangkap Paulus
  rationale: Dalam konteks penahanan, frasa ini menyatakan tindakan memegang atau menguasai seseorang. Nama 'Paulus' dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: ἐκέλευσε δεθῆναι
  choice: memerintahkan agar dia dibelenggu
  rationale: Mempertahankan perintah berwibawa dan bentuk pasif dari infinitif δεθῆναι; 'dibelenggu' cocok dengan konteks tahanan.
- source_word: ἁλύσεσι δυσί
  choice: dengan dua rantai
  rationale: Padanan langsung bagi frasa Yunani dan mempertahankan kemungkinan kaitan naratif dengan Kisah Para Rasul 21:11.
- source_word: ἐπυνθάνετο
  choice: menanyakan
  rationale: Bentuk imperfek menggambarkan proses penyelidikan yang sedang berlangsung; dalam narasi Indonesia, 'lalu ia menanyakan' menyampaikan alur itu secara alami.
- source_word: τίς εἴη
  choice: siapa Paulus
  rationale: Pertanyaan tidak langsung diterjemahkan secara alami; nama dipakai untuk menghindari rentetan pronomina yang berpotensi kabur.
- source_word: τί ἐστιν πεποιηκώς
  choice: apa yang telah dilakukannya
  rationale: Konstruksi perfektum perifrastis menunjuk kepada tindakan yang sudah dilakukan dengan akibat yang masih relevan.
