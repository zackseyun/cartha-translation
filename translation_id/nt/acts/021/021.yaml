  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κατηχήθησαν δὲ περὶ σοῦ ὅτι ἀποστασίαν διδάσκεις ἀπὸ Μωϋσέως τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους, λέγων μὴ περιτέμνειν αὐτοὺς τὰ τέκνα μηδὲ τοῖς ἔθεσιν περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/021.yaml
  text: But they have been informed about you that you are teaching all the Jews among the Gentiles to forsake Moses[c][b][a], telling them not to circumcise their children nor to walk according to the customs.
translation:
  language: id
  text: Namun, mereka telah diberi tahu tentang engkau bahwa engkau mengajar semua orang Yahudi yang tinggal di antara bangsa-bangsa lain untuk meninggalkan Musa,[a][b] dengan mengatakan agar mereka tidak menyunat anak-anak mereka dan tidak hidup menurut adat istiadat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bahwa engkau mengajarkan kemurtadan dari Musa.” Kata Yunani ἀποστασία berarti tindakan membelot atau meninggalkan.
    reason: lexical_alternative
  - marker: b
    text: “Musa” di sini mewakili hukum Musa dan praktik Yahudi yang diwariskan turun-temurun.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “dan tidak berjalan menurut adat istiadat.” Dalam konteks ini, “berjalan” berarti menjalani hidup atau berperilaku.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηχήθησαν
  choice: telah diberi tahu
  rationale: Bentuk pasif ini dalam konteks tersebut menunjuk pada informasi lisan yang telah diterima mengenai Paulus; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan relevansi laporan itu saat ini.
- source_word: ἀποστασίαν ... ἀπὸ Μωϋσέως
  choice: untuk meninggalkan Musa
  rationale: Kata benda ἀποστασία menyatakan tindakan meninggalkan atau membelot. Bentuk verbal Indonesia menyampaikan tuduhan itu dengan jelas tanpa menjadikannya istilah teologis teknis; 'Musa' tetap dipertahankan sebagai metonimia.
- source_word: τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους
  choice: semua orang Yahudi yang tinggal di antara bangsa-bangsa lain
  rationale: Frasa ini menunjuk pada orang Yahudi diaspora yang hidup di tengah bangsa-bangsa non-Yahudi. Terjemahan ini jelas dan alami.
- source_word: λέγων
  choice: dengan mengatakan agar mereka
  rationale: Partisipel ini menjelaskan isi atau cara pengajaran yang dituduhkan kepada Paulus dan merujuk kembali kepada orang-orang Yahudi yang baru disebut.
- source_word: μὴ περιτέμνειν αὐτοὺς τὰ τέκνα
  choice: tidak menyunat anak-anak mereka
  rationale: αὐτούς memberi gagasan kepunyaan terhadap τὰ τέκνα. 'Anak-anak' mempertahankan cakupan leksikal teks Yunani tanpa mempersempitnya menjadi 'anak laki-laki'.
- source_word: μηδὲ τοῖς ἔθεσιν περιπατεῖν
  choice: dan tidak hidup menurut adat istiadat itu
  rationale: περιπατεῖν secara harfiah berarti 'berjalan', tetapi di sini secara idiomatis berarti menjalani hidup atau berperilaku. 'Hidup menurut' alami dalam bahasa Indonesia, sedangkan 'adat istiadat itu' menunjuk pada praktik Yahudi yang diwariskan.
theological_decisions:
- issue: Sifat tuduhan terhadap Paulus mengenai Musa dan hukum Taurat
  choice: Menerjemahkannya sebagai laporan bahwa Paulus mengajar orang Yahudi 'untuk meninggalkan Musa', tanpa membenarkan tuduhan tersebut.
  alternative: Mengajar kemurtadan dari Musa; mengajar untuk meninggalkan hukum Musa.
  rationale: Ayat ini melaporkan apa yang telah didengar orang lain mengenai Paulus, bukan menyatakan kesimpulan teologis Lukas. Rumusan ini mempertahankan kerasnya tuduhan dan ketegangan naratif tanpa menambahkan penilaian doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. 'Engkau' dipakai sesuai sapaan langsung kepada Paulus. Metafora 'berjalan' dialihkan secara idiomatis menjadi 'hidup' dalam teks utama, dengan bentuk harfiahnya dicatat dalam catatan kaki. Urutan penanda catatan kaki disesuaikan agar mengikuti kemunculan unsur terkait dalam teks.
