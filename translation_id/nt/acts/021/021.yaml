  naturalness: Bahasa Indonesia baku, jelas, dan sesuai register naratif. “Telah diberi tahu” dan “dengan mengatakan agar” dapat dipertahankan. Penghapusan “itu” membuat bagian akhir lebih idiomatis sekaligus lebih dekat kepada sumber.
  terminology: “Musa” secara tepat mempertahankan metonimia Yunani, dengan penjelasan budaya yang memadai. “Anak-anak” mengikuti τέκνα tanpa mempersempitnya menjadi anak laki-laki. “Adat istiadat” merupakan padanan yang baik bagi ἔθη.
