revisions:
- from: Beberapa murid dari Kaisarea juga ikut bersama kami. Mereka mengantar kami kepada Mnason, seorang Siprus yang sudah lama menjadi murid,[a] dan kami akan menginap di rumahnya.[b]
  to: Beberapa murid dari Kaisarea juga pergi bersama kami. Mereka mengantar kami kepada seorang bernama Mnason, yang berasal dari Siprus dan sudah lama menjadi murid; kami akan menginap di rumahnya.[a]
  rationale: Revisi kecil ini meningkatkan kelancaran bahasa Indonesia dan secara lebih eksplisit mencerminkan τινι tanpa mengubah makna. Catatan kaki digabungkan agar kedua ambiguitas yang relevan—hubungan ἄγοντες dengan Mnason dan nuansa ἀρχαίῳ μαθητῇ—tetap tersedia bagi pembaca, sementara teks utama tetap memakai pembacaan yang paling wajar dalam konteks.
