  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν, ἄγοντες παρ’ ᾧ ξενισθῶμεν Μνάσωνί τινι Κυπρίῳ, ἀρχαίῳ μαθητῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/016.yaml
  text: And some of the disciples from Caesarea also went with us, bringing us to Mnason, a certain Cypriot, an early disciple, with whom we were to stay.
translation:
  language: id
  text: Beberapa murid dari Kaisarea juga pergi bersama kami. Mereka mengantar kami kepada seorang bernama Mnason, yang berasal dari Siprus dan sudah lama menjadi murid; kami akan menginap di rumahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka membawa serta seorang bernama Mnason, yang berasal dari Siprus dan sudah lama menjadi murid, yang akan menerima kami sebagai tamu.” Susunan partisipel Yunani dan frasa tentang penginapan dapat dipahami dengan cara yang sedikit berbeda tetapi berkaitan erat. “Sudah lama menjadi murid” juga dapat berarti “seorang murid sejak masa awal.”
    reason: syntactical_and_lexical_alternative
lexical_decisions:
- source_word: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν
  choice: Beberapa murid dari Kaisarea juga ikut bersama kami
  rationale: Bentuk genitif partitif menyatakan beberapa dari antara para murid, sedangkan συνῆλθον dan σὺν ἡμῖν dalam konteks perjalanan menyatakan bahwa mereka menyertai rombongan.
- source_word: ἄγοντες
  choice: Mereka mengantar kami
  rationale: 'Partisipel ini menjelaskan peran para murid dari Kaisarea: mereka membawa atau menuntun rombongan menuju tempat menginap. ''Mengantar'' alami dalam konteks perjalanan.'
- source_word: Μνάσωνί τινι Κυπρίῳ
  choice: kepada Mnason, seorang Siprus
  rationale: τινι memperkenalkan tokoh yang belum disebut, sementara Κυπρίῳ menunjukkan asalnya. Dalam bahasa Indonesia, 'seorang Siprus' ringkas dan wajar tanpa perlu menerjemahkan τινι secara kaku sebagai 'seorang tertentu'.
- source_word: ἀρχαίῳ μαθητῇ
  choice: yang sudah lama menjadi murid
  rationale: ἀρχαίῳ dapat menunjuk pada lamanya Mnason menjadi murid atau keterkaitannya dengan masa awal gerakan. Pilihan ini alami dan tidak menyatakan secara berlebihan bahwa ia pasti termasuk murid yang paling pertama.
- source_word: παρ’ ᾧ ξενισθῶμεν
  choice: kami akan menginap di rumahnya
  rationale: ξενίζω dalam konteks ini berkaitan dengan penerimaan sebagai tamu atau penyediaan penginapan. Ungkapan Indonesia ini menyampaikan tujuan praktisnya dengan jelas.
theological_decisions:
- issue: Makna ἀρχαίῳ μαθητῇ
  choice: yang sudah lama menjadi murid
  alternative: seorang murid sejak masa awal
  rationale: Frasa Yunani memungkinkan penekanan pada lamanya ia menjadi murid maupun pada masa awal ketika ia mulai menjadi murid. Teks utama memilih ungkapan yang paling alami, sementara catatan mempertahankan kemungkinan lainnya.
- issue: Hubungan ἄγοντες dengan παρ’ ᾧ ξενισθῶμεν
  choice: mereka mengantar rombongan kepada Mnason, lalu rombongan menginap di rumahnya
  alternative: mereka membawa Mnason bersama rombongan agar rombongan menginap di tempatnya
  rationale: Susunan Yunani dapat dipahami dengan beberapa cara yang berdekatan. Pilihan utama mengikuti pengertian bahwa para murid Kaisarea menunjukkan atau mengantar rombongan ke rumah sang tuan rumah, tanpa menjadikan alternatif tata bahasa sebagai kepastian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Ikut bersama kami' menyampaikan penyertaan dalam perjalanan; 'mengantar' dan 'menginap di rumahnya' mudah dipahami pembaca umum. Semua kemungkinan penting dalam frasa ἀρχαίῳ μαθητῇ dan susunan bagian akhir dipertahankan melalui catatan kaki.
