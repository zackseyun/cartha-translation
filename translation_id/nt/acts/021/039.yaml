  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· Ἐγὼ ἄνθρωπος μέν εἰμι Ἰουδαῖος, Ταρσεὺς τῆς Κιλικίας, οὐκ ἀσήμου πόλεως πολίτης· δέομαι δέ σου, ἐπίτρεψόν μοι λαλῆσαι πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/039.yaml
  text: But Paul said[a], “I am indeed a Jewish man, a citizen of Tarsus in Cilicia, of no insignificant city. And I beg you, permit me to speak to the people.”
translation:
  language: id
  text: Namun Paulus berkata, “Saya seorang Yahudi, warga kota Tarsus di Kilikia, sebuah kota yang tidak kecil artinya. Saya mohon kepadamu, izinkan saya berbicara kepada orang banyak.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος ... Ἰουδαῖος
  choice: seorang Yahudi
  rationale: Dalam bahasa Indonesia, frasa ini merupakan pengungkapan identitas yang alami dan tepat; unsur ἄνθρωπος tidak perlu diterjemahkan secara kaku sebagai ‘laki-laki’ karena Paulus sedang menyatakan identitas etnis-keagamaannya.
- source_word: Ταρσεὺς τῆς Κιλικίας ... πολίτης
  choice: warga kota Tarsus di Kilikia
  rationale: Menggabungkan sebutan asal Tarsus dengan πολίτης menghasilkan susunan Indonesia yang alami sekaligus mempertahankan penekanan pada status kewargaan kota.
- source_word: οὐκ ἀσήμου πόλεως
  choice: sebuah kota yang bukan tidak terkenal
  rationale: Mempertahankan litotes Yunani, yakni penegasan melalui dua bentuk negatif, tanpa mengubahnya langsung menjadi ‘kota penting’.
- source_word: δέομαι δέ σου
  choice: Saya mohon kepadamu
  rationale: Menyampaikan permohonan yang sungguh-sungguh kepada pejabat militer dengan ragam bahasa yang sopan dan bermartabat.
- source_word: ἐπίτρεψόν μοι λαλῆσαι
  choice: izinkan saya berbicara
  rationale: Ungkapan Indonesia yang alami untuk permintaan izin formal dan tetap mencerminkan arti kedua verba Yunani.
- source_word: πρὸς τὸν λαόν
  choice: kepada rakyat
  rationale: λαός secara harfiah menunjuk kepada rakyat atau umat; ‘rakyat’ mempertahankan nuansa komunal yang lebih luas daripada sekadar kerumunan.
- source_word: μέν
  choice: tidak dinyatakan tersendiri
  rationale: Fungsi penekanan partikel ini sudah tersampaikan secara wajar melalui susunan pernyataan identitas; padanan eksplisit seperti ‘memang’ akan terasa kurang alami dalam konteks ini.
theological_decisions:
- issue: Makna Ἰουδαῖος dalam pengenalan diri Paulus
  choice: Yahudi
  alternative: orang Yudea
  rationale: Paulus menyebut Tarsus di Kilikia sebagai kota asalnya, sehingga Ἰουδαῖος di sini paling wajar menyatakan identitas etnis-keagamaan, bukan asal geografis dari Yudea.
translation_notes:
  register: Bahasa Indonesia modern, sopan, dan layak untuk dialog dengan pejabat militer. Kata ganti ‘saya’ dipilih karena Paulus berbicara secara hormat kepada komandan; ‘kepadamu’ mempertahankan objek tunggal Yunani tanpa menjadi terlalu kaku. Litotes dipertahankan meski sedikit lebih formal daripada ungkapan sehari-hari.
