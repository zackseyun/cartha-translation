revisions:
- from: Namun Paulus berkata, “Saya seorang Yahudi, warga kota Tarsus di Kilikia, sebuah kota yang bukan tidak terkenal.[a] Saya mohon kepadamu, izinkan saya berbicara kepada rakyat.”
  to: Namun Paulus berkata, “Saya seorang Yahudi, warga kota Tarsus di Kilikia, sebuah kota yang tidak kecil artinya. Saya mohon kepadamu, izinkan saya berbicara kepada orang banyak.”
  rationale: Revisi mempertahankan seluruh isi teks sumber dan urutan gagasannya, tetapi mengganti negasi ganda yang janggal dengan litotes Indonesia yang lazim, “tidak kecil artinya.” Istilah audiens juga dibuat lebih idiomatis bagi konteks naratif langsung. Catatan kaki diselaraskan dengan redaksi yang diperbaiki.
  reviewer_model: gpt-5.6-terra
