  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦτο οὖν ποίησον ὅ σοι λέγομεν· εἰσὶν ἡμῖν ἄνδρες τέσσαρες εὐχὴν ἔχοντες ⸀ἀφ’ ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/023.yaml
  text: 'Therefore do what we tell you: we have four men who are under a vow of their own[a][b].'
translation:
  language: id
  text: 'Karena itu, lakukanlah apa yang kami katakan kepadamu: Di kalangan kami ada empat orang laki-laki yang masing-masing terikat oleh nazar mereka sendiri[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang memiliki nazar.” Secara harfiah, bahasa Yunani berbunyi “memiliki nazar”; ungkapan ini menyatakan bahwa nazar itu melekat pada mereka.
    reason: lexical_alternative
  - marker: b
    text: Konteks yang lebih luas mungkin menunjukkan nazar sejenis nazar orang nazir, tetapi ayat ini sendiri hanya menyebut “nazar.”
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο οὖν
  choice: Karena itu
  rationale: οὖν menandai kesimpulan dari pembicaraan sebelumnya, sedangkan τοῦτο tercakup secara alami dalam isi perintah yang langsung menyusul.
- source_word: ποίησον
  choice: lakukanlah
  rationale: Bentuk imperatif aoristus ποιέω menyampaikan perintah langsung; akhiran -lah memberi nada tegas namun wajar dalam bahasa Indonesia.
- source_word: ὅ σοι λέγομεν
  choice: apa yang kami katakan kepadamu
  rationale: Klausa relatif ini menyatakan isi tindakan yang diperintahkan dan diterjemahkan secara idiomatis tanpa mengubah aspek teologis apa pun.
- source_word: εἰσὶν ἡμῖν
  choice: Di antara kami ada
  rationale: Konstruksi eksistensial dengan datif ἡμῖν paling alami dipahami sebagai keberadaan orang-orang itu dalam lingkungan kelompok pembicara; bentuk ini lebih wajar daripada 'kami mempunyai empat orang'.
- source_word: ἄνδρες τέσσαρες
  choice: empat orang
  rationale: Dalam konteks ini ἄνδρες menunjuk empat laki-laki dewasa. Bahasa Indonesia lazim memakai 'orang' ketika jenis kelamin sudah tidak perlu ditekankan, tetapi rujukannya tetap kepada para pria dalam konteks.
- source_word: εὐχὴν ἔχοντες
  choice: yang terikat oleh nazar
  rationale: Ungkapan partisipial harfiahnya berarti 'mempunyai nazar' dan menunjukkan keadaan berkelanjutan sebagai orang yang berada di bawah kewajiban nazar. 'Terikat oleh nazar' menyampaikan makna itu secara alami.
- source_word: ἀφ’ ἑαυτῶν
  choice: yang mereka buat sendiri
  rationale: Frasa refleksif ini menunjukkan bahwa nazar tersebut melekat pada atau berasal dari mereka sendiri. Ungkapan ini alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan kemungkinan ungkapan yang lebih harfiah.
theological_decisions:
- issue: Jenis nazar dalam konteks
  choice: nazar
  alternative: nazar kenaziran
  rationale: Walaupun konteks yang lebih luas mungkin mengarah pada nazar sejenis nazar orang nazir, ayat ini sendiri hanya memakai εὐχή dan tidak menyebut kenaziran secara khusus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Susunan kalimat mempertahankan hubungan kesimpulan, perintah, dan penjelasan dalam teks Yunani. Istilah 'nazar' dipertahankan karena dikenal luas dan tepat bagi janji keagamaan yang dimaksud.
