review_pass:
  verdict: revise
  source_fidelity: Bagian akhir draf, “nazar yang mereka buat sendiri,” menambahkan gagasan bahwa keempat orang itu secara khusus membuat nazar tersebut sendiri. Frasa ἀφ’ ἑαυτῶν lebih aman dipahami dalam kaitan dengan nazar yang melekat pada mereka/merupakan nazar mereka sendiri, tanpa menegaskan cara atau kemandirian mereka dalam membuatnya. Selain itu, ἄνδρες secara eksplisit menunjuk laki-laki dan sebaiknya tidak dihilangkan dalam terjemahan utama.
  naturalness: 'Revisi memakai susunan baku dan alami: “Di kalangan kami ada ...” serta “masing-masing terikat oleh nazar mereka sendiri.” Bentuk ini mempertahankan nada langsung dan jelas tanpa ungkapan harfiah yang janggal seperti “nazar atas diri mereka sendiri.”'
  terminology: “Nazar” tepat untuk εὐχή dan tidak boleh dispesifikkan menjadi nazar kenaziran dalam teks utama. “Terikat oleh nazar” mengomunikasikan keadaan berkelanjutan dari ἔχοντες secara wajar. “Orang laki-laki” mempertahankan makna ἄνδρες.
  issues:
  - severity: medium
    issue: “yang mereka buat sendiri” terlalu mempersempit ἀφ’ ἑαυτῶν.
    rationale: Ungkapan itu dapat menyatakan bahwa mereka secara mandiri atau pribadi membuat nazar itu, sedangkan konstruksi Yunani lebih aman diterjemahkan sebagai nazar yang ada pada/melekat pada mereka, tanpa menguraikan asal atau cara pembuatannya.
  - severity: low
    issue: “empat orang” tidak menandai ἄνδρες.
    rationale: Walaupun “orang” lazim dalam bahasa Indonesia, teks Yunani secara khusus menyebut empat laki-laki dewasa; penandaan ini dapat dipertahankan secara alami.
  - severity: low
    issue: Catatan a memakai padanan harfiah yang janggal dan dapat mengesankan makna yang terlalu teknis.
    rationale: “Mempunyai nazar atas diri mereka sendiri” bukan bahasa Indonesia yang alami. Catatan dapat menyebut harfiah “memiliki nazar,” sambil menjelaskan bahwa ungkapan itu menyatakan nazar yang melekat pada mereka.
