id: ACT.21.11
reference: Acts 21:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν πρὸς ἡμᾶς καὶ ἄρας τὴν ζώνην τοῦ Παύλου δήσας ⸀ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας εἶπεν· Τάδε λέγει τὸ πνεῦμα τὸ ἅγιον Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη, οὕτως δήσουσιν ἐν Ἰερουσαλὴμ οἱ Ἰουδαῖοι καὶ παραδώσουσιν εἰς χεῖρας ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/011.yaml
  text: 'And coming to us[a], and taking Paul’s belt, he bound his own feet and hands and said[b], “Thus says the Holy Spirit: ‘In this way the Jews in Jerusalem will bind the man to whom this belt belongs and will hand him over into the hands of the Gentiles.’”'
translation:
  language: id
  text: Ia datang kepada kami, mengambil ikat pinggang Paulus, lalu mengikat kaki dan tangannya sendiri. Kemudian ia berkata, “Beginilah firman Roh Kudus:[a] ‘Orang yang memiliki ikat pinggang ini[b] akan diikat seperti ini oleh orang-orang Yahudi di Yerusalem dan diserahkan ke tangan orang-orang bukan Yahudi.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Inilah yang dikatakan Roh Kudus.”
    reason: alternative_reading
  - marker: b
    text: Secara lebih harfiah, “yang ikat pinggang ini adalah miliknya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζώνην
  choice: ikat pinggang
  rationale: Istilah ini menunjuk pada sabuk atau kain pengikat yang dikenakan di pinggang; “ikat pinggang” adalah padanan modern yang jelas dan wajar.
- source_word: δήσας ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας
  choice: mengikat kaki dan tangannya sendiri
  rationale: Kata ganti refleksif ἑαυτοῦ merujuk kepada pelaku, yaitu Agabus, sehingga ia mengikat dirinya sendiri sebagai tindakan simbolis. “Mengikat” juga mempertahankan hubungan dengan bentuk mendatang δήσουσιν.
- source_word: Τάδε λέγει
  choice: Beginilah firman
  rationale: Padanan ini mempertahankan corak khidmat formula kenabian Alkitab sekaligus tetap dikenal dan dapat dipahami dalam bahasa Indonesia.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roh Kudus
  rationale: Ini adalah padanan baku dan alami dalam bahasa Indonesia modern bagi sebutan ilahi tersebut.
- source_word: Τὸν ἄνδρα
  choice: Orang
  rationale: Dalam konteks ini ἀνήρ menunjuk kepada seorang laki-laki tertentu, yakni Paulus. “Orang” menghasilkan ungkapan Indonesia yang alami tanpa mengaburkan acuannya.
- source_word: οὗ ἐστιν ἡ ζώνη αὕτη
  choice: yang memiliki ikat pinggang ini
  rationale: Ungkapan ini menyampaikan hubungan kepemilikan secara alami; bentuk yang lebih harfiah dicatat dalam catatan kaki.
- source_word: οὕτως
  choice: seperti ini
  rationale: Ungkapan ini menghubungkan secara langsung tindakan simbolis Agabus dengan cara Paulus kelak diikat.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Teks Yunani menyebut orang-orang Yahudi tanpa membatasinya secara eksplisit pada para pemimpin atau penduduk Yudea; terjemahan tidak menambahkan pembatasan tersebut.
- source_word: παραδώσουσιν
  choice: akan ... diserahkan
  rationale: Bentuk pasif Indonesia dalam rangkaian kalimat ini secara alami menyatakan tindakan menyerahkan Paulus kepada kekuasaan pihak lain dan tetap memiliki subjek pelaku yang jelas dari klausa sebelumnya.
- source_word: εἰς χεῖρας ἐθνῶν
  choice: ke tangan bangsa-bangsa lain
  rationale: Padanan ini mempertahankan idiom “ke tangan,” yang menyatakan penyerahan ke bawah kuasa pihak lain, serta bentuk jamak ἐθνῶν bagi bangsa-bangsa bukan Yahudi.
theological_decisions:
- issue: Formula kenabian sebagai perkataan langsung Roh Kudus
  choice: Beginilah firman Roh Kudus
  alternative: Inilah yang dikatakan Roh Kudus
  rationale: Pilihan utama mempertahankan gema formula kenabian dan klaim kewibawaan yang terdapat dalam teks, tanpa menambahkan penjelasan doktrinal.
- issue: Acuan kata ganti refleksif ἑαυτοῦ
  choice: Agabus mengikat kaki dan tangannya sendiri
  alternative: Agabus mengikat kaki dan tangan Paulus
  rationale: Secara tata bahasa, kata ganti refleksif paling wajar merujuk kepada subjek partisipel, yaitu Agabus. Karena itu, tindakan tersebut diterjemahkan sebagai tindakan simbolis Agabus atas dirinya sendiri.
- issue: Cakupan οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  alternative: para pemimpin Yahudi
  rationale: Teks tidak secara eksplisit menyebut para pemimpin. Terjemahan mempertahankan sebutan umum dalam sumber dan tidak menyisipkan pembatasan penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Formula “Beginilah firman” mempertahankan corak kenabian, sedangkan susunan narasi dibuat lancar bagi pembaca umum. Pengulangan “mengikat/diikat” dipertahankan untuk menonjolkan hubungan antara tindakan simbolis dan nubuatnya.
