    rationale: Kata Yunani itu menunjukkan perpisahan yang sulit atau terasa kuat, tetapi tidak secara eksplisit menyatakan keadaan batin “berat hati.” “Dengan susah payah berpisah” mempertahankan daya ungkapan tanpa menambahkan motivasi emosional spesifik.
  revised_text: Setelah kami dengan susah payah berpisah dari mereka dan bertolak, kami berlayar lurus ke Kos; keesokan harinya ke Rodos, dan dari sana ke Patara.
