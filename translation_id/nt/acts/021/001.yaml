id: ACT.21.1
reference: Acts 21:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐγένετο ἀναχθῆναι ἡμᾶς ἀποσπασθέντας ἀπ’ αὐτῶν, εὐθυδρομήσαντες ἤλθομεν εἰς τὴν ⸀Κῶ, τῇ δὲ ἑξῆς εἰς τὴν Ῥόδον, κἀκεῖθεν εἰς Πάταρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/001.yaml
  text: After we had torn ourselves away from them and put out to sea[a], we ran a straight course and came to Cos, and on the next day to Rhodes, and from there to Patara.
translation:
  language: id
  text: Setelah kami dengan susah payah berpisah dari mereka dan bertolak, kami berlayar lurus ke Kos; keesokan harinya ke Rodos, dan dari sana ke Patara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἐγένετο
  choice: Setelah
  rationale: Ungkapan ini mengantar peristiwa berikutnya dalam urutan narasi; 'Setelah' alami dalam bahasa Indonesia dan mempertahankan hubungan waktunya.
- source_word: ἀποσπασθέντας ἀπ’ αὐτῶν
  choice: dengan berat hati berpisah dari mereka
  rationale: Kata ἀποσπάω menggambarkan pemisahan yang terasa berat, bukan sekadar keberangkatan biasa. Ungkapan ini menyampaikan daya emosionalnya tanpa memakai metafora yang kaku.
- source_word: ἀναχθῆναι
  choice: bertolak
  rationale: Dalam konteks pelayaran, ἀνάγω berarti bertolak atau mulai berlayar. 'Bertolak' ringkas, alami, dan jelas dalam rangkaian perjalanan laut ini.
- source_word: εὐθυδρομήσαντες
  choice: berlayar langsung
  rationale: Verba bahari ini berarti menempuh jalur lurus. 'Berlayar langsung' mempertahankan unsur pelayaran dan gagasan rute yang tidak berbelok.
- source_word: Κῶ
  choice: Kos
  rationale: Kos adalah bentuk nama pulau yang lazim dalam bahasa Indonesia modern dan dekat dengan transliterasi Yunani.
- source_word: τῇ δὲ ἑξῆς
  choice: Keesokan harinya
  rationale: Ungkapan datif temporal ini berarti pada hari berikutnya; padanan ini alami dan tepat.
- source_word: Ῥόδον
  choice: Rodos
  rationale: Rodos merupakan bentuk Indonesia yang lazim untuk nama pulau Yunani ini.
- source_word: κἀκεῖθεν
  choice: dan dari sana
  rationale: Padanan ini mempertahankan kaitan koordinatif καί serta gerak perjalanan dari tempat sebelumnya.
- source_word: Πάταρα
  choice: Patara
  rationale: Transliterasi langsung dan lazim bagi nama tempat tersebut.
