  rationale: Revisi mempertahankan kekuatan perpisahan, makna bahari “bertolak” dan “berlayar lurus,” serta cakupan verba kedatangan untuk seluruh rangkaian Kos–Rodos–Patara. Struktur eliptis sesudah titik koma lazim dalam daftar perjalanan bahasa Indonesia dan membuat “ke Patara” dipahami sebagai tujuan yang dicapai, bukan sekadar arah perjalanan.
