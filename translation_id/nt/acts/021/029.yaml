    rationale: Teks Yunani menyatakan alasan dan dugaan mereka, bukan terutama peristiwa yang terjadi "lalu" sesudah penglihatan itu. "Dan mereka menyangka" lebih netral dan dekat dengan bentuk relatif ὃν ἐνόμιζον.
  - severity: low
    issue: Aposisi "orang Efesus itu" kurang alami.
    rationale: '"Trofimus, seorang Efesus" menyampaikan identifikasi asal yang sama dengan lebih lancar dalam bahasa Indonesia modern.'
  - severity: low
    issue: Catatan kaki mengenai Yerusalem tidak diperlukan untuk makna ayat ini.
    rationale: '"Di kota itu" sudah mempertahankan rujukan kontekstual χωρίς menambahkan informasi penjelas di luar ayat; sementara nuansa penting ἱερόν telah diterjemahkan langsung sebagai "kompleks Bait Allah."'
  revised_text: Sebab mereka sebelumnya telah melihat Trofimus, seorang Efesus, bersama Paulus di kota itu, dan mereka menyangka bahwa Paulus telah membawanya ke dalam kompleks Bait Allah.
