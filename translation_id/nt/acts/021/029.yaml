- from: Sebab sebelumnya mereka telah melihat Trofimus, orang Efesus itu, bersama Paulus di kota[a], lalu menyangka bahwa Paulus telah membawanya masuk ke kompleks Bait Allah.
  to: Sebab mereka sebelumnya telah melihat Trofimus, seorang Efesus, bersama Paulus di kota itu, dan mereka menyangka bahwa Paulus telah membawanya ke dalam kompleks Bait Allah.
  rationale: Revisi mempertahankan seluruh makna sumber, sambil menghilangkan "lalu" yang terlalu menekankan kronologi, memperlancar aposisi etnis, dan memakai konstruksi verba yang lebih idiomatis. "Kompleks Bait Allah" tetap dipertahankan untuk menerjemahkan ἱερόν secara tepat.
