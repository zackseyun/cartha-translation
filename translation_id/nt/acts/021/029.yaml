  text: ἦσαν γὰρ ⸀προεωρακότες Τρόφιμον τὸν Ἐφέσιον ἐν τῇ πόλει σὺν αὐτῷ, ὃν ἐνόμιζον ὅτι εἰς τὸ ἱερὸν εἰσήγαγεν ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/029.yaml
  text: For they had previously seen Trophimus the Ephesian in the city with him[a], and they supposed that Paul had brought him into the temple.
translation:
  language: id
  text: Sebab mereka sebelumnya telah melihat Trofimus, seorang Efesus, bersama Paulus di kota itu, dan mereka menyangka bahwa Paulus telah membawanya ke dalam kompleks Bait Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν ... προεωρακότες
  choice: sebelumnya mereka telah melihat
  rationale: Konstruksi perifrastis ini menunjukkan bahwa tindakan melihat terjadi lebih dahulu daripada tuduhan tersebut; susunan ini alami dalam bahasa Indonesia.
- source_word: Τρόφιμον τὸν Ἐφέσιον
  choice: Trofimus, orang Efesus itu
  rationale: Adjektiva substantival dalam aposisi mengenali Trofimus berdasarkan asalnya; bentuk ini wajar dan mempertahankan sifat identifikasinya.
- source_word: ἐν τῇ πόλει
  choice: di kota
  rationale: Mengacu pada Yerusalem sebagai lingkungan perkotaan, dibedakan dari kawasan Bait Allah.
- source_word: σὺν αὐτῷ
  choice: bersama Paulus
  rationale: Acuan pronomina αὐτῷ adalah Paulus. Menyebut namanya secara eksplisit menghindari ambiguitas pronomina yang tidak alami dalam bahasa Indonesia tanpa mengubah makna.
- source_word: ἐνόμιζον
  choice: menyangka
  rationale: Menyatakan kesimpulan atau dugaan berdasarkan apa yang telah mereka lihat, bukan pengetahuan yang pasti.
- source_word: εἰς τὸ ἱερὸν
  choice: masuk ke kompleks Bait Allah
  rationale: ἱερόν menunjuk pada kompleks atau kawasan Bait Allah, bukan secara khusus ruang suci bagian dalam; pilihan ini menjaga ketepatan historis dan leksikal.
- source_word: εἰσήγαγεν
  choice: telah membawanya masuk
  rationale: Menyampaikan tindakan membawa seseorang ke dalam suatu kawasan, dengan aspek waktu yang mendahului dugaan mereka.
theological_decisions:
- issue: Cakupan makna ἱερόν dalam tuduhan terhadap Paulus
  choice: kompleks Bait Allah
  alternative: Bait Allah; pelataran Bait Allah; kawasan Bait Allah
  rationale: Istilah Yunani ini mencakup kawasan Bait Allah secara luas, berbeda dari ναός yang lebih khusus menunjuk tempat suci. Terjemahan ini tidak menentukan secara lebih sempit bagian persis yang dituduhkan telah dimasuki Trofimus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata “sebab” mempertahankan fungsi penjelas γάρ; “lalu” menghubungkan pengamatan sebelumnya dengan dugaan yang timbul darinya. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskannya.
