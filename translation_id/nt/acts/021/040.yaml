  text: ἐπιτρέψαντος δὲ αὐτοῦ ὁ Παῦλος ἑστὼς ἐπὶ τῶν ἀναβαθμῶν κατέσεισε τῇ χειρὶ τῷ λαῷ, πολλῆς δὲ σιγῆς γενομένης ⸀προσεφώνησεν τῇ Ἑβραΐδι διαλέκτῳ λέγων
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/040.yaml
  text: 'And when he had given permission[a], Paul, standing on the steps, motioned with his hand to the people. And when a great silence had come, he addressed them in the Hebrew language, saying:'
translation:
  language: id
  text: 'Setelah komandan itu memberikan izin, Paulus berdiri di anak tangga dan memberi isyarat dengan tangannya kepada orang banyak. Ketika suasana menjadi sangat hening, ia berbicara kepada mereka dalam bahasa Ibrani[a], katanya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “bahasa Aram.” Teks Yunani berbunyi “dialek/bahasa Ibrani,” yang dalam konteks ini mungkin merujuk pada bahasa Semitik setempat yang lazim disebut bahasa Aram.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτρέψαντος δὲ αὐτοῦ
  choice: Setelah komandan itu memberikan izin
  rationale: Konstruksi genitif absolut menyatakan keadaan yang mendahului tindakan Paulus. Subjek tersirat dijelaskan sebagai “komandan itu” berdasarkan konteks sebelumnya agar rujukannya jelas dalam bahasa Indonesia.
- source_word: ἑστὼς ἐπὶ τῶν ἀναβαθμῶν
  choice: Paulus berdiri di anak tangga
  rationale: Partisipel perfek menggambarkan posisi Paulus. “Anak tangga” merupakan padanan alami bagi ἀναβαθμοί dalam konteks tangga menuju markas.
- source_word: κατέσεισε τῇ χειρὶ τῷ λαῷ
  choice: memberi isyarat dengan tangannya kepada orang banyak
  rationale: κατασείω menunjuk pada gerakan tangan untuk menarik perhatian atau menenangkan para pendengar. “Orang banyak” menyampaikan λαός secara alami dalam konteks kumpulan massa.
- source_word: πολλῆς δὲ σιγῆς γενομένης
  choice: Ketika suasana menjadi sangat hening
  rationale: Konstruksi genitif absolut kedua menggambarkan timbulnya keheningan yang mendalam. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa peristiwa pada γενομένης.
- source_word: προσεφώνησεν
  choice: ia berbicara kepada mereka
  rationale: Kata kerja ini berarti menyapa atau berbicara kepada suatu kelompok. Pilihan ini jelas dan wajar untuk pidato di depan umum tanpa memberi kesan bahwa Paulus sekadar memanggil mereka.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: dalam bahasa Ibrani
  rationale: Terjemahan utama mempertahankan penyebutan eksplisit Yunani, “dialek/bahasa Ibrani,” sedangkan kemungkinan bahwa istilah itu merujuk pada bahasa Aram dijelaskan dalam catatan kaki.
- source_word: λέγων
  choice: 'katanya:'
  rationale: Partisipel ini memperkenalkan perkataan langsung yang dimulai pada ayat berikutnya. “Katanya:” merupakan pengantar yang ringkas dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang jelas dan bermartabat. Penanda catatan kaki ditempatkan setelah “bahasa Ibrani,” yaitu pada frasa yang memang dijelaskan oleh catatan tersebut.
