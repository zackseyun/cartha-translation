  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς ἐξαυτῆς παραλαβὼν στρατιώτας καὶ ἑκατοντάρχας κατέδραμεν ἐπ’ αὐτούς, οἱ δὲ ἰδόντες τὸν χιλίαρχον καὶ τοὺς στρατιώτας ἐπαύσαντο τύπτοντες τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/032.yaml
  text: He immediately took soldiers and centurions and ran down to them[a], and when they saw the tribune and the soldiers, they stopped beating Paul.
translation:
  language: id
  text: Ia segera mengajak serta para prajurit dan para senturion, lalu berlari turun ke arah mereka. Ketika orang banyak itu melihat komandan pasukan[a] dan para prajurit, mereka berhenti memukuli Paulus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tribun militer”; istilah Yunani χιλίαρχος menunjuk perwira Romawi yang memimpin satu kohor.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: segera
  rationale: Ungkapan adverbial ini menunjukkan tindakan tanpa penundaan; “segera” alami dan jelas dalam bahasa Indonesia modern.
- source_word: παραλαβὼν
  choice: membawa
  rationale: Partisip ini menyatakan bahwa sang komandan mengikutsertakan para prajurit dan perwira sebelum bergerak menuju kerumunan.
- source_word: στρατιώτας
  choice: beberapa prajurit
  rationale: Bentuk jamak tak tentu menunjuk sejumlah prajurit; “beberapa” membuat konstruksi Indonesia alami tanpa menentukan jumlah.
- source_word: ἑκατοντάρχας
  choice: perwira
  rationale: ἑκατοντάρχης adalah perwira Romawi yang lazim disebut senturion; “perwira” mudah dipahami dalam teks utama, sementara hierarki tepatnya tidak perlu diperberat di sini.
- source_word: κατέδραμεν ἐπ’ αὐτούς
  choice: berlari turun ke arah mereka
  rationale: Pilihan ini mempertahankan gerak cepat, arah menuju kerumunan, dan nuansa turun dari lokasi benteng tanpa menyiratkan serangan secara berlebihan.
- source_word: χιλίαρχον
  choice: komandan pasukan
  rationale: Istilah ini menunjuk perwira Romawi yang memimpin satu kohor; padanan fungsional ini jelas bagi pembaca modern, dengan keterangan historis pada catatan kaki.
- source_word: ἐπαύσαντο
  choice: berhenti
  rationale: Verba medial ini menyatakan penghentian tindakan yang sedang berlangsung.
- source_word: τύπτοντες
  choice: memukuli
  rationale: Bentuk partisip kini menunjukkan pukulan berulang dan berkelanjutan; “memukuli” menyampaikan kekerasan berulang secara idiomatis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Subjek tersirat pada awal ayat diterjemahkan “Ia” karena konteks ayat sebelumnya mengidentifikasi komandan pasukan. “Orang banyak itu” memperjelas acuan οἱ δέ secara alami. Penanda catatan kaki [a] ditempatkan langsung sesudah istilah yang dijelaskan.
