id: ACT.21.12
reference: Acts 21:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς δὲ ἠκούσαμεν ταῦτα, παρεκαλοῦμεν ἡμεῖς τε καὶ οἱ ἐντόπιοι τοῦ μὴ ἀναβαίνειν αὐτὸν εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/012.yaml
  text: When we heard these things[a], we and the local people urged him not to go up to Jerusalem.
translation:
  language: id
  text: Ketika kami mendengar hal-hal itu, kami dan orang-orang setempat terus mendesak[a] Paulus agar tidak naik ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terus memohon kepada Paulus agar ia tidak naik ke Yerusalem.” Kata Yunani ini dapat menyatakan desakan atau permohonan yang sungguh-sungguh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἠκούσαμεν ταῦτα
  choice: Ketika kami mendengar hal-hal itu
  rationale: Menyampaikan keadaan waktu dan acuan jamak ταῦτα kepada isi nubuat sebelumnya; δέ berfungsi sebagai penghubung wacana ringan dan tidak perlu diterjemahkan tersendiri.
- source_word: παρεκαλοῦμεν
  choice: mendesak
  rationale: παρακαλέω dalam konteks ini menyatakan permohonan sungguh-sungguh atau desakan. 'Mendesak' alami dalam bahasa Indonesia dan tidak melebih-lebihkan kadar emosinya.
- source_word: ἡμεῖς τε καὶ οἱ ἐντόπιοι
  choice: kami dan orang-orang setempat
  rationale: 'Mempertahankan dua kelompok yang bersama-sama mengajukan permohonan: rombongan narator dan penduduk tempat itu.'
- source_word: αὐτὸν
  choice: Paulus
  rationale: Pronomina Yunani merujuk kepada Paulus. Pengulangan nama dalam bahasa Indonesia memperjelas rujukan tanpa mengubah makna.
- source_word: τοῦ μὴ ἀναβαίνειν ... εἰς Ἰερουσαλήμ
  choice: agar tidak pergi ke Yerusalem
  rationale: Menyatakan isi desakan dengan konstruksi Indonesia yang alami. Secara harfiah ἀναβαίνειν berarti 'naik', tetapi dalam konteks perjalanan ke Yerusalem ini merupakan ungkapan arah konvensional; 'pergi' menghindari kesan bahwa teks terutama menjelaskan gerak medan.
theological_decisions:
- issue: Ungkapan arah untuk perjalanan ke Yerusalem
  choice: pergi ke Yerusalem
  alternative: naik ke Yerusalem
  rationale: Kata ἀναβαίνειν secara harfiah berarti 'naik' dan lazim digunakan untuk perjalanan ke Yerusalem. Dalam bahasa Indonesia modern, 'pergi ke Yerusalem' lebih alami; alternatif harfiah dicatat agar unsur sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Nama 'Paulus' dipakai untuk memperjelas rujukan pronomina. Penanda catatan kaki [a] ditempatkan sesudah objek dari verba yang diberi alternatif leksikal.
