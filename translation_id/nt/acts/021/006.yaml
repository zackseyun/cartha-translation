  text: ⸂ἀπησπασάμεθα ἀλλήλους, καὶ⸃ ⸀ἐνέβημεν εἰς τὸ πλοῖον, ἐκεῖνοι δὲ ὑπέστρεψαν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/006.yaml
  text: After we had said farewell to one another[a], we boarded the ship[b], and they returned to their own homes.
translation:
  language: id
  text: Setelah kami saling berpamitan[a], kami naik ke kapal, sedangkan mereka pulang ke rumah masing-masing[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saling mengucapkan selamat tinggal.” Ungkapan Yunani ini dapat dipakai untuk memberi salam ketika bertemu maupun ketika berpisah; konteks keberangkatan mendukung arti perpisahan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ke hal-hal yang menjadi milik mereka sendiri.” Ungkapan ini dapat berarti “ke rumah mereka sendiri” atau “ke tempat mereka masing-masing.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπησπασάμεθα ἀλλήλους
  choice: kami saling mengucapkan selamat tinggal
  rationale: Dalam konteks keberangkatan ini, ungkapan tersebut menunjuk pada perpisahan. Bentuk saling diterjemahkan secara alami dengan 'saling mengucapkan selamat tinggal'.
- source_word: ἐνέβημεν
  choice: kami naik ke
  rationale: Kata kerja ini berarti masuk atau naik ke kendaraan; bersama 'kapal', 'naik ke kapal' merupakan ungkapan Indonesia yang alami.
- source_word: πλοῖον
  choice: kapal
  rationale: Istilah ini dapat berarti perahu atau kapal; dalam kisah perjalanan laut di Kisah Para Rasul, 'kapal' sesuai dengan konteks dan pemakaian umum.
- source_word: ὑπέστρεψαν
  choice: mereka pulang
  rationale: Kata ini berarti kembali. Karena tujuannya adalah tempat mereka sendiri, 'pulang' menyampaikan gerak kembali itu secara ringkas dan alami.
- source_word: εἰς τὰ ἴδια
  choice: ke rumah masing-masing
  rationale: Secara harfiah ungkapan ini berarti menuju milik atau tempat sendiri dan secara idiomatis mengacu pada rumah atau tempat mereka sendiri. 'Rumah masing-masing' wajar dalam bahasa Indonesia sambil mempertahankan sifat distributifnya.
