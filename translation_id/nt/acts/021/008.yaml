  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τῇ δὲ ἐπαύριον ἐξελθόντες ⸀ἤλθομεν εἰς Καισάρειαν, καὶ εἰσελθόντες εἰς τὸν οἶκον Φιλίππου τοῦ εὐαγγελιστοῦ ὄντος ἐκ τῶν ἑπτὰ ἐμείναμεν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/008.yaml
  text: On the next day we departed and came to Caesarea[a], and entering the house of Philip the evangelist, who was one of the seven, we stayed with him.
translation:
  language: id
  text: Keesokan harinya kami berangkat dan tiba di Kaisarea. Kami masuk ke rumah Filipus, sang pemberita Injil, yang adalah salah satu dari ketujuh orang itu,[a] lalu tinggal bersamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, salah satu dari ketujuh orang yang sebelumnya ditunjuk untuk melayani di Yerusalem (lihat Kisah Para Rasul 6:3–6).
    reason: cross_reference
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Keesokan harinya
  rationale: Ungkapan waktu ini secara alami menyatakan kelanjutan urutan cerita; δέ tidak perlu diterjemahkan tersendiri.
- source_word: ἐξελθόντες
  choice: kami berangkat
  rationale: Dalam konteks perjalanan, bentuk partisip ini menunjuk pada keberangkatan dari tempat sebelumnya dan wajar dirangkai dengan verba utama.
- source_word: ἤλθομεν εἰς Καισάρειαν
  choice: tiba di Kaisarea
  rationale: Ungkapan ini menyatakan tercapainya tujuan perjalanan; 'tiba di' lebih alami daripada terjemahan harfiah 'datang ke' dalam narasi Indonesia ini.
- source_word: εἰσελθόντες εἰς τὸν οἶκον
  choice: Kami masuk ke rumah
  rationale: Mempertahankan urutan tindakan dalam bentuk kalimat yang alami dan jelas dalam bahasa Indonesia.
- source_word: Φιλίππου
  choice: Filipus
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: τοῦ εὐαγγελιστοῦ
  choice: sang pemberita Injil
  rationale: Menyampaikan fungsi εὐαγγελιστής dengan bahasa yang mudah dimengerti, sambil mempertahankan nuansa sebutan khusus bagi Filipus.
- source_word: ὄντος ἐκ τῶν ἑπτὰ
  choice: yang termasuk salah satu dari ketujuh orang itu
  rationale: Menunjukkan hubungan Filipus dengan kelompok tujuh orang yang telah disebut dalam Kisah Para Rasul 6 tanpa menjadikannya nama jabatan gerejawi.
- source_word: ἐμείναμεν παρ’ αὐτῷ
  choice: lalu tinggal bersamanya
  rationale: Dalam konteks keramahtamahan, frasa ini secara alami berarti menetap atau menumpang bersama Filipus.
theological_decisions:
- issue: Identitas Filipus sebagai seorang dari ketujuh orang
  choice: yang termasuk salah satu dari ketujuh orang itu
  alternative: yang merupakan salah seorang dari Tujuh Pelayan
  rationale: Teks mengacu pada kelompok dalam Kisah Para Rasul 6, tetapi tidak menyebut mereka dengan nama jabatan tertentu. Terjemahan ini mempertahankan rujukan historis tanpa memasukkan struktur gerejawi yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Dua klausa partisip Yunani ditata sebagai rangkaian tindakan yang jelas. Istilah 'pemberita Injil' dipilih agar mudah dipahami tanpa kehilangan fungsi pelayanan yang dinyatakan teks.
