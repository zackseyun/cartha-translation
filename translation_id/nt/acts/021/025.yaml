    issue: Hubungan sintaksis κρίναντες kurang dipertahankan.
    rationale: Kata Yunani κρίναντες adalah partisipel yang menyatakan keputusan yang mendahului pengiriman. "Pesan tentang keputusan kami bahwa" menjadikannya keterangan nominal dan membuat konstruksi "keputusan ... bahwa" kurang alami. "Setelah memutuskan agar" mempertahankan hubungan tersebut.
  - severity: low
    issue: εἰδωλόθυτον diterjemahkan terlalu umum sebagai "apa yang dipersembahkan kepada berhala".
    rationale: Istilah ini secara khusus merujuk pada makanan yang terkait dengan persembahan berhala. Menyebut "makanan" membuat rujukan leksikalnya jelas tanpa melampaui makna sumber.
  revised_text: Namun, mengenai orang-orang bukan Yahudi yang telah percaya, kami telah mengirim pesan, setelah memutuskan agar mereka menjauhkan diri dari makanan yang dipersembahkan kepada berhala, dari darah, dari daging hewan yang dicekik, dan dari percabulan.
