  text: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν ἡμεῖς ⸀ἀπεστείλαμεν ⸀κρίναντες φυλάσσεσθαι αὐτοὺς τό τε εἰδωλόθυτον ⸀καὶ αἷμα καὶ πνικτὸν καὶ πορνείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/025.yaml
  text: But concerning the Gentiles who have believed[a], we sent word, having decided that they should keep themselves from what is sacrificed to idols, and from blood, and from what is strangled[c][b], and from sexual immorality.
translation:
  language: id
  text: Namun, mengenai orang-orang bukan Yahudi yang telah percaya, kami telah mengirim pesan, setelah memutuskan agar mereka menjauhkan diri dari makanan yang dipersembahkan kepada berhala, dari darah, dari daging hewan yang dicekik, dan dari percabulan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ
  choice: Namun, mengenai
  rationale: περὶ dengan genitif memperkenalkan pokok pembicaraan, sedangkan δέ menandai peralihan atau kontras ringan dengan pembahasan sebelumnya.
- source_word: τῶν πεπιστευκότων ἐθνῶν
  choice: orang-orang bukan Yahudi yang telah percaya
  rationale: Partisipel perfektum menunjukkan bahwa mereka telah menjadi percaya dan tetap berada dalam keadaan itu; ἐθνῶν dalam konteks ini menunjuk kepada orang bukan Yahudi.
- source_word: ἡμεῖς ἀπεστείλαμεν
  choice: kami telah mengirim pesan
  rationale: Pronomina eksplisit ἡμεῖς dipertahankan sebagai 'kami'. Objek verba 'mengirim' tersirat; 'pesan' menyampaikan tindakan komunikasi tanpa mempersempitnya secara tidak perlu menjadi 'surat', walaupun konteks Kisah Para Rasul 15 menunjuk kepada surat keputusan.
- source_word: κρίναντες
  choice: tentang keputusan kami
  rationale: Partisipel aoris ini menunjukkan keputusan yang mendahului tindakan mengirim. Susunan nominal ini alami dalam bahasa Indonesia dan tetap menyampaikan keputusan resmi hasil pertimbangan.
- source_word: φυλάσσεσθαι αὐτοὺς
  choice: bahwa mereka harus menjauhkan diri dari
  rationale: Bentuk medial mempertahankan nuansa menjaga diri dari hal-hal yang dilarang; 'menjauhkan diri' merupakan ungkapan Indonesia yang jelas dan wajar.
- source_word: τό τε εἰδωλόθυτον
  choice: apa yang dipersembahkan kepada berhala
  rationale: Terjemahan ini mengikuti keluasan bentuk Yunani dan tidak membatasinya hanya pada jenis makanan tertentu, meskipun konteksnya berkaitan dengan makanan atau daging persembahan.
- source_word: αἷμα
  choice: darah
  rationale: Padanan langsung yang mempertahankan bentuk ringkas teks Yunani tanpa memasukkan penjelasan tafsir ke dalam teks utama.
- source_word: πνικτόν
  choice: daging binatang yang mati dicekik
  rationale: Istilah ini menunjuk kepada binatang yang dibunuh dengan cara dicekik atau dibuat mati lemas sehingga darahnya tidak ditiriskan. Penambahan 'daging binatang' membuat acuannya jelas dan alami dalam bahasa Indonesia.
- source_word: πορνείαν
  choice: percabulan
  rationale: Dalam ragam Alkitab Indonesia, 'percabulan' adalah istilah yang bermartabat dan cukup luas untuk perilaku seksual yang tidak sah, tanpa membatasinya pada hubungan pranikah saja.
theological_decisions:
- issue: Sifat dan jangka waktu larangan dalam keputusan para rasul
  choice: Keempat larangan diterjemahkan secara langsung tanpa menetapkan alasan atau masa berlakunya.
  alternative: Menafsirkannya hanya sebagai kelonggaran sementara demi persekutuan makan, atau sebagai hukum universal yang berlaku tetap.
  rationale: Ayat ini melaporkan isi keputusan terdahulu, tetapi tidak menjelaskan seluruh dasar teologis ataupun jangka waktu setiap larangan. Terjemahan mempertahankan ketegangan itu.
- issue: Cakupan πορνεία
  choice: percabulan
  alternative: perbuatan seksual yang tidak bermoral
  rationale: Kata sumber mencakup perilaku seksual terlarang secara luas. Pilihan ini mempertahankan istilah yang ringkas dan tidak menguncinya pada satu pelanggaran tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Struktur kalimat dibuat lancar tanpa menghilangkan kontras, keadaan telah percaya, keputusan kolektif, atau daftar empat larangan.
