id: ACT.21.18
reference: Acts 21:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τῇ δὲ ἐπιούσῃ εἰσῄει ὁ Παῦλος σὺν ἡμῖν πρὸς Ἰάκωβον, πάντες τε παρεγένοντο οἱ πρεσβύτεροι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/018.yaml
  text: On the next day[a], Paul went in with us to James[b], and all the elders were present.
translation:
  language: id
  text: Keesokan harinya[a], Paulus pergi bersama kami menemui Yakobus, dan semua penatua hadir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Pada hari berikutnya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dan semua penatua datang” atau “dan semua penatua tiba.” Kata kerja Yunani dapat menekankan kedatangan ataupun kehadiran.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπιούσῃ
  choice: Keesokan harinya
  rationale: Ungkapan datif ini merupakan idiom waktu yang berarti hari berikutnya; “Keesokan harinya” alami dan ringkas dalam bahasa Indonesia modern.
- source_word: εἰσῄει
  choice: pergi ... menemui
  rationale: Bentuk imperfek εἴσειμι menyatakan gerak masuk atau pergi menuju suatu tempat. Dalam konstruksi dengan πρὸς Ἰάκωβον, ungkapan “pergi ... menemui Yakobus” menyampaikan gerak menuju orang yang dikunjungi secara alami tanpa menambahkan identitas atau jabatan.
- source_word: σὺν ἡμῖν
  choice: bersama kami
  rationale: σύν dengan datif menyatakan penyertaan; “bersama kami” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: πρὸς Ἰάκωβον
  choice: menemui Yakobus
  rationale: πρός dengan akusatif menunjukkan gerak menuju seseorang. Dalam bahasa Indonesia, “menemui Yakobus” lebih alami daripada “kepada Yakobus” dan tidak menentukan lokasi yang tidak disebutkan teks.
- source_word: πάντες τε
  choice: dan semua
  rationale: Partikel τέ menghubungkan klausa dengan daya penghubung ringan; “dan” cukup menyampaikan hubungan itu tanpa penekanan berlebih.
- source_word: παρεγένοντο
  choice: hadir
  rationale: παραγίνομαι dapat menyoroti kedatangan ataupun keadaan hadir. “Hadir” sesuai dengan konteks pertemuan, sedangkan alternatif yang mempertahankan nuansa kedatangan dicatat dalam catatan kaki.
- source_word: οἱ πρεσβύτεροι
  choice: para penatua
  rationale: πρεσβύτεροι menunjuk para pemimpin yang diakui dalam jemaat. “Para penatua” adalah istilah Indonesia yang lazim dan tidak memaksakan struktur denominasi tertentu.
theological_decisions:
- issue: Identitas dan peran Ἰάκωβον
  choice: Nama “Yakobus” diterjemahkan tanpa keterangan tambahan.
  alternative: Yakobus, saudara Tuhan; atau Yakobus, pemimpin jemaat Yerusalem.
  rationale: Ayat ini hanya menyebut nama Yakobus. Menambahkan hubungan keluarga atau jabatan akan memasukkan informasi yang tidak dinyatakan dalam ayat.
- issue: Makna gerejawi οἱ πρεσβύτεροι
  choice: Diterjemahkan “para penatua” tanpa penjelasan denominasi.
  alternative: para presbiter; atau para pemimpin jemaat.
  rationale: Istilah ini menunjukkan para pemimpin yang diakui, tetapi teks tidak menetapkan padanannya dalam tata gereja denominasi tertentu.
- issue: Nuansa παρεγένοντο
  choice: Teks utama memakai “hadir”.
  alternative: datang; atau tiba.
  rationale: Kata Yunani dapat menekankan kedatangan maupun kehadiran. Terjemahan utama mengikuti keadaan mereka dalam pertemuan, sementara ambiguitas leksikal dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. “Menemui Yakobus” dipilih agar konstruksi gerak menuju seseorang terdengar alami. Semua penanda catatan kaki muncul dalam teks utama.
