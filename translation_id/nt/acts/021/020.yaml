id: ACT.21.20
reference: Acts 21:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐδόξαζον τὸν ⸀θεόν, ⸂εἶπόν τε⸃ αὐτῷ· Θεωρεῖς, ἀδελφέ, πόσαι μυριάδες εἰσὶν ⸂ἐν τοῖς Ἰουδαίοις⸃ τῶν πεπιστευκότων, καὶ πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/020.yaml
  text: When they heard this[a], they glorified God, and they said to him, “You see, brother, how many myriads there are among the Jews who have believed[b], and they are all zealous for the law.”
translation:
  language: id
  text: Ketika mendengar hal itu, mereka memuliakan Allah. Lalu mereka berkata kepada Paulus, “Saudara, engkau melihat betapa banyak puluhan ribu[a] orang Yahudi[b] yang telah percaya, dan mereka semua bersemangat terhadap hukum Taurat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “beribu-ribu.” Kata Yunani yang dipakai dapat berarti kelipatan sepuluh ribu atau, secara lebih umum, jumlah yang sangat besar.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang Yudea,” jika istilah ini dipahami secara geografis, bukan secara etnis-keagamaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Ketika mendengar hal itu
  rationale: Partisip aoris menyatakan hubungan waktu; objek yang tersirat dari laporan sebelumnya dilengkapi secara wajar dengan ‘hal itu’.
- source_word: ἐδόξαζον
  choice: mereka memuliakan
  rationale: Mempertahankan makna memberi kemuliaan kepada Allah dan aspek imperfek yang menggambarkan tanggapan mereka, tanpa perlu membuat durasinya eksplisit.
- source_word: εἶπόν τε αὐτῷ
  choice: Lalu mereka berkata kepada Paulus
  rationale: τέ menghubungkan tindakan berikutnya dalam alur narasi. Nama Paulus dipakai sebagai rujukan alami bagi pronomina αὐτῷ dalam bahasa Indonesia.
- source_word: Θεωρεῖς
  choice: engkau melihat
  rationale: Bentuk kini ini mengarahkan perhatian Paulus pada keadaan yang nyata; ‘melihat’ mempertahankan gambaran sumber.
- source_word: ἀδελφέ
  choice: Saudara
  rationale: Sapaan kepada seorang laki-laki tertentu; ‘Saudara’ terdengar alami dan bermartabat dalam bahasa Indonesia.
- source_word: πόσαι μυριάδες
  choice: betapa banyak puluhan ribu
  rationale: μυριάς secara harfiah menunjuk satuan sepuluh ribu dan dalam bentuk jamak juga dapat menandakan jumlah yang amat besar. Ungkapan ini mempertahankan besarnya jumlah tanpa memakai serapan ‘miriad’ yang tidak lazim.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: orang Yahudi
  rationale: Dalam konteks ini istilah tersebut terutama menunjuk identitas etnis-keagamaan, bukan semata-mata penduduk wilayah Yudea.
- source_word: τῶν πεπιστευκότων
  choice: yang telah percaya
  rationale: Bentuk perfektum menunjukkan orang-orang yang telah percaya dan tetap berada dalam keadaan sebagai orang percaya.
- source_word: ζηλωταὶ τοῦ νόμου
  choice: giat membela hukum Taurat
  rationale: ζηλωτής menyatakan semangat atau keterikatan yang kuat terhadap sesuatu. ‘Giat membela’ menyampaikan intensitasnya dengan bahasa Indonesia yang alami, sedangkan ‘hukum Taurat’ memperjelas bahwa νόμος merujuk pada hukum Musa.
- source_word: ὑπάρχουσιν
  choice: mereka semua giat membela
  rationale: Di sini ὑπάρχω berfungsi seperti kopula; bahasa Indonesia tidak memerlukan verba tersendiri yang setara dengan ‘adalah’.
theological_decisions:
- issue: Cakupan ἐν τοῖς Ἰουδαίοις
  choice: orang Yahudi
  alternative: orang Yudea
  rationale: Pembicaraan berpusat pada para penganut Yahudi yang tetap bersemangat terhadap hukum Musa, sehingga identitas etnis-keagamaan paling mungkin dimaksud. Alternatif geografis tetap dicatat.
- issue: Nilai bilangan μυριάδες
  choice: puluhan ribu
  alternative: beribu-ribu / jumlah yang sangat besar
  rationale: Kata Yunani dapat menyatakan kelipatan sepuluh ribu maupun jumlah besar secara umum. Teks utama mempertahankan nilai leksikal yang lebih konkret, sementara catatan menjaga ketidakpastiannya.
- issue: Makna τοῦ νόμου
  choice: hukum Taurat
  alternative: hukum
  rationale: Konteks menunjuk hukum Musa. Penambahan ‘Taurat’ membuat rujukannya jelas tanpa memasukkan penilaian teologis tentang hubungan para percaya dengan hukum tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Sapaan ‘Saudara’ dipertahankan sebagai bentuk alami bagi ἀδελφέ. Struktur kalimat dipecah setelah ‘Allah’ agar alurnya jelas. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
