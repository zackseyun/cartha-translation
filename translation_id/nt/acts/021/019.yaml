id: ACT.21.19
reference: Acts 21:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀσπασάμενος αὐτοὺς ἐξηγεῖτο καθ’ ἓν ἕκαστον ὧν ἐποίησεν ὁ θεὸς ἐν τοῖς ἔθνεσιν διὰ τῆς διακονίας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/019.yaml
  text: And after greeting them[b][a], he began to relate one by one the things that God had done among the Gentiles through his ministry.
translation:
  language: id
  text: Setelah menyapa mereka, Paulus menceritakan satu per satu apa yang telah Allah lakukan di antara bangsa-bangsa bukan Yahudi[a] melalui pelayanannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di antara bangsa-bangsa.” Dalam konteks ini, yang dimaksud ialah bangsa-bangsa bukan Yahudi.
    reason: lexical_alternative
  - marker: b
    text: Atau “melalui pengabdiannya.” Kata Yunani yang dipakai dapat berarti pelayanan atau pengabdian yang dilakukan bagi orang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασάμενος
  choice: Setelah menyapa
  rationale: Partisip aoristis ini menyatakan tindakan yang mendahului kata kerja utama. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan urutan peristiwa.
- source_word: ἐξηγεῖτο
  choice: menceritakan
  rationale: Verba imperfek ini menggambarkan laporan yang berlangsung dan terperinci. Bersama frasa καθ’ ἓν ἕκαστον, 'menceritakan' menyampaikan makna penuturan tanpa menambahkan gagasan bahwa Paulus hanya mulai tetapi tidak menyelesaikannya.
- source_word: καθ’ ἓν ἕκαστον
  choice: satu per satu
  rationale: Ungkapan distributif ini menekankan bahwa berbagai tindakan Allah dituturkan secara terperinci, satu demi satu.
- source_word: ὧν ἐποίησεν ὁ θεὸς
  choice: apa yang telah Allah lakukan
  rationale: Terjemahan ini mempertahankan Allah sebagai pelaku utama dan memakai 'telah' secara alami untuk tindakan-tindakan yang terjadi sebelum laporan Paulus.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: di antara bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks ini, ἔθνη menunjuk pada kelompok-kelompok non-Yahudi. Bentuk ini lebih mudah dipahami pembaca umum daripada istilah gerejawi 'bangsa-bangsa lain', sekaligus tetap memperlihatkan unsur jamaknya.
- source_word: διὰ τῆς διακονίας αὐτοῦ
  choice: melalui pelayanannya
  rationale: διά dengan genetif menyatakan perantaraan atau sarana. 'Pelayanan' secara wajar menunjuk pada karya Paulus tanpa mengubahnya menjadi jabatan gerejawi tertentu.
- source_word: αὐτοὺς / αὐτοῦ
  choice: mereka / pelayanannya (Paulus)
  rationale: Rujukan kedua pronomina dibuat jelas oleh konteks. Nama 'Paulus' ditambahkan pada awal kalimat agar subjek tidak kabur ketika ayat dibaca tersendiri.
theological_decisions:
- issue: Pelaku dalam laporan misi Paulus
  choice: Allah ditampilkan sebagai pelaku utama, sedangkan pelayanan Paulus menjadi sarana tindakan-Nya.
  alternative: Paulus menceritakan pencapaiannya sendiri di antara bangsa-bangsa bukan Yahudi.
  rationale: ὁ θεὸς adalah subjek eksplisit dari ἐποίησεν, sementara διὰ τῆς διακονίας αὐτοῦ menunjukkan pelayanan Paulus sebagai perantara. Terjemahan mempertahankan baik tindakan Allah maupun peran instrumental Paulus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bangsa-bangsa bukan Yahudi' dipilih demi kejelasan bagi pembaca umum. Nama Paulus disebut secara eksplisit karena ayat ini disajikan tersendiri, walaupun teks Yunani memakai subjek tersirat.
