  yaml_path: translation/nt/acts/021/010.yaml
  text: While we were staying there for several days, a prophet named Agabus came down from Judea.
translation:
  language: id
  text: Sementara kami tinggal di sana selama beberapa hari, seorang nabi bernama Agabus turun dari Yudea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμενόντων
  choice: sementara kami tinggal di sana
  rationale: Partisipel kini genitif jamak ini membentuk konstruksi genitif absolut dengan fungsi temporal. Subjek tersiratnya, menurut konteks bagian narasi 'kami', adalah Paulus beserta rekan-rekannya. Ungkapan ini menyampaikan keadaan mereka yang terus menetap di tempat yang baru disebutkan.
- source_word: δὲ
  choice: sementara
  rationale: Partikel ini menandai peralihan ringan dan, bersama konstruksi genitif absolut, secara alami tercakup dalam penghubung temporal 'sementara'.
- source_word: ἡμέρας πλείους
  choice: beberapa hari lagi
  rationale: Frasa ini menyatakan rentang waktu. Bentuk komparatif πλείους secara harfiah menunjuk pada hari-hari tambahan; 'beberapa hari lagi' wajar dalam bahasa Indonesia dan lebih tepat mempertahankan unsur tambahan daripada sekadar 'beberapa hari'.
- source_word: κατῆλθέν
  choice: datang
  rationale: Aoristus κατέρχομαι dapat berarti 'turun' atau 'datang'. Dalam bahasa Indonesia, 'datang dari Yudea' terdengar alami; arah turun tidak perlu dinyatakan karena dapat merupakan idiom geografis dan tujuan kedatangannya tersirat sebagai lokasi narator.
- source_word: τις
  choice: seorang
  rationale: Pronomina tak tentu ini memperkenalkan tokoh baru. 'Seorang nabi' mempertahankan ketaktentuan secara alami.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: dari Yudea
  rationale: Padanan langsung dan lazim untuk asal geografis yang dinyatakan dalam teks sumber.
- source_word: προφήτης
  choice: nabi
  rationale: Padanan baku yang mempertahankan sebutan peran Agabus tanpa parafrasa atau penafsiran tambahan.
- source_word: ὀνόματι Ἅγαβος
  choice: bernama Agabus
  rationale: ὀνόματι merupakan idiom datif yang berarti 'bernama'; padanan ini alami dalam bahasa Indonesia modern.
