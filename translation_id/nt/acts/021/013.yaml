  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂τότε ἀπεκρίθη⸃ ὁ Παῦλος· Τί ποιεῖτε κλαίοντες καὶ συνθρύπτοντές μου τὴν καρδίαν; ἐγὼ γὰρ οὐ μόνον δεθῆναι ἀλλὰ καὶ ἀποθανεῖν εἰς Ἰερουσαλὴμ ἑτοίμως ἔχω ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/013.yaml
  text: Then Paul answered[a], “What are you doing[b], weeping and breaking my heart? For I am ready not only to be bound but even to die in Jerusalem for the name of the Lord Jesus.”
translation:
  language: id
  text: Lalu Paulus menjawab, “Apa yang kalian lakukan dengan menangis dan meremukkan hatiku?[a] Sebab aku siap bukan hanya untuk diikat, tetapi juga untuk mati di Yerusalem demi nama Tuhan Yesus.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menghancurkan hatiku.” Kata Yunani yang dipakai menggambarkan remuknya batin yang kuat, bukan sekadar kesedihan.
    reason: lexical_alternative
  - marker: b
    text: “Nama” merupakan cara alkitabiah untuk menunjuk kepada Yesus sendiri, kewibawaan-Nya, dan perkara yang berkaitan dengan-Nya.
    reason: lexical_explanation
lexical_decisions:
- source_word: ⸂τότε ἀπεκρίθη⸃ ὁ Παῦλος
  choice: Lalu Paulus menjawab
  rationale: Menyampaikan urutan naratif dan verba ujaran secara alami dalam bahasa Indonesia. Tanda varian pada sumber tidak memerlukan catatan dalam ayat ini.
- source_word: Τί ποιεῖτε
  choice: Apa yang kalian lakukan?
  rationale: Terjemahan langsung yang mempertahankan bentuk pertanyaan dan nada protes emosional Paulus.
- source_word: κλαίοντες
  choice: Kalian menangis
  rationale: Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan tindakan yang menyertai pertanyaan Paulus.
- source_word: συνθρύπτοντές μου τὴν καρδίαν
  choice: menghancurkan hatiku
  rationale: συνθρύπτω lebih kuat daripada sekadar menyedihkan; pilihan ini mempertahankan metafora hati dan daya emosional verba Yunani.
- source_word: δεθῆναι
  choice: untuk diikat
  rationale: Mempertahankan arti pasif yang konkret dari δέω tanpa mempersempitnya menjadi dipenjarakan.
- source_word: ἀποθανεῖν
  choice: untuk mati
  rationale: Padanan langsung dan wajar bagi infinitif Yunani.
- source_word: εἰς Ἰερουσαλήμ
  choice: di Yerusalem
  rationale: Dalam konteks penderitaan yang akan dialami di tempat itu, preposisi lokasi 'di' paling alami dalam bahasa Indonesia.
- source_word: ἑτοίμως ἔχω
  choice: aku siap
  rationale: Padanan idiomatis yang ringkas untuk ungkapan berada dalam kesiapan.
- source_word: ὑπὲρ τοῦ ὀνόματος
  choice: demi nama
  rationale: Mempertahankan idiom alkitabiah 'nama' sekaligus menyatakan makna ὑπέρ secara alami.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Tuhan Yesus
  rationale: κύριος diterjemahkan sebagai gelar kristologis 'Tuhan'; konstruksi Indonesia tidak memerlukan kata sandang.
theological_decisions:
- issue: Penerjemahan κύριος sebagai gelar bagi Yesus
  choice: Tuhan Yesus
  alternative: Tuan Yesus
  rationale: Dalam konteks ini κύριος adalah gelar kristologis; 'Tuhan' mempertahankan bobot teologisnya dan merupakan bentuk baku dalam bahasa Indonesia.
- issue: Pelestarian idiom 'nama'
  choice: demi nama Tuhan Yesus
  alternative: demi Tuhan Yesus
  rationale: Teks Yunani secara eksplisit menyebut 'nama'. Idiom ini dapat menunjuk kepada pribadi, kewibawaan, dan perkara Yesus, sehingga tidak dipersempit melalui parafrasa.
- issue: Kekuatan metafora συνθρύπτω
  choice: menghancurkan hatiku
  alternative: mematahkan semangatku
  rationale: Pilihan utama mempertahankan metafora hati dan kekuatan verba sumber tanpa menafsirkan 'hati' hanya sebagai semangat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'aku' dan 'kalian' dipakai agar dialog terdengar alami serta membedakan pembicara dari kelompok pendengar. Struktur kalimat dipecah sesudah pertanyaan agar hubungan partisipial Yunani terbaca jelas tanpa kehilangan tekanan emosional.
