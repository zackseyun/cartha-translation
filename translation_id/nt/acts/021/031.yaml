  text: ζητούντων ⸀τε αὐτὸν ἀποκτεῖναι ἀνέβη φάσις τῷ χιλιάρχῳ τῆς σπείρης ὅτι ὅλη ⸀συγχύννεται Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/031.yaml
  text: And as they were seeking to kill him[b][a], a report went up to the commander of the cohort that all Jerusalem was in an uproar.
translation:
  language: id
  text: Ketika mereka sedang berusaha membunuh Paulus, suatu laporan sampai kepada komandan kohort[a] bahwa seluruh Yerusalem sedang dilanda kekacauan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Komandan kohort” menerjemahkan seorang perwira militer Romawi (tribun) yang memimpin kohort, yaitu satuan militer Romawi.
    reason: cultural_note
  - marker: b
    text: 'Dapat juga diterjemahkan: “sedang dalam kebingungan” atau “sedang gempar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητούντων τε αὐτὸν ἀποκτεῖναι
  choice: Ketika mereka sedang berusaha membunuh Paulus
  rationale: Konstruksi genitivus absolutus dengan partisipel kini menunjukkan tindakan yang sedang berlangsung bersamaan dengan peristiwa utama. Nama “Paulus” dipakai agar rujukan pronomina jelas dan alami dalam bahasa Indonesia.
- source_word: ἀνέβη φάσις
  choice: sampailah laporan
  rationale: Ungkapan Yunani secara harfiah menggambarkan laporan yang ‘naik’, sesuai lokasi benteng, tetapi ‘sampailah laporan’ menyampaikan gerak dan hasilnya secara alami dalam bahasa Indonesia.
- source_word: τῷ χιλιάρχῳ τῆς σπείρης
  choice: kepada komandan pasukan
  rationale: χιλίαρχος adalah perwira tinggi Romawi, kira-kira tribun, sedangkan σπεῖρα menunjuk satuan militer yang dipimpinnya. Frasa ini jelas bagi pembaca umum tanpa memakai istilah teknis yang asing.
- source_word: ὅτι ὅλη συγχύννεται Ἰερουσαλήμ
  choice: bahwa seluruh Yerusalem sedang kacau
  rationale: Bentuk kini pasif menggambarkan Yerusalem berada dalam keadaan terguncang, bingung, atau rusuh. ‘Sedang kacau’ alami dan cukup luas untuk mempertahankan cakupan makna verba.
