  text: ἐκινήθη τε ἡ πόλις ὅλη καὶ ἐγένετο συνδρομὴ τοῦ λαοῦ, καὶ ἐπιλαβόμενοι τοῦ Παύλου εἷλκον αὐτὸν ἔξω τοῦ ἱεροῦ, καὶ εὐθέως ἐκλείσθησαν αἱ θύραι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/030.yaml
  text: And the whole city was stirred up[a], and a crowd of the people formed; and after seizing Paul, they dragged him outside the temple[c][b], and immediately the doors were shut.
translation:
  language: id
  text: Seluruh kota menjadi gempar, dan orang-orang berkerumun. Mereka menangkap Paulus lalu menyeretnya ke luar dari kompleks Bait Allah[a], dan seketika itu juga pintu-pintu[b] ditutup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani di sini menunjuk kompleks atau pelataran Bait Allah, bukan secara khusus ruang kudus bagian dalam.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “pintu-pintu”; dalam konteks ini kata tersebut dapat merujuk pada pintu-pintu gerbang kompleks Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκινήθη ... ἡ πόλις ὅλη
  choice: Seluruh kota menjadi gempar
  rationale: Bentuk pasif κινέω dalam konteks ini menyatakan kegemparan atau pergolakan warga, bukan gerakan harfiah. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan cakupan seluruh kota.
- source_word: ἐγένετο συνδρομὴ τοῦ λαοῦ
  choice: orang-orang berkerumun
  rationale: συνδρομή menggambarkan orang banyak yang datang atau berlari bersama dan berhimpun. 'Berkerumun' menyampaikan konvergensi mendadak itu secara ringkas dan alami.
- source_word: ἐπιλαβόμενοι τοῦ Παύλου
  choice: Mereka menangkap Paulus
  rationale: Partisipel ἐπιλαμβάνομαι menunjukkan tindakan memegang dengan paksa. 'Menangkap' sesuai dengan tindakan massa terhadap Paulus dan mengalir alami menuju verba utama.
- source_word: εἷλκον αὐτὸν
  choice: lalu menyeretnya
  rationale: Imperfek εἷλκον menggambarkan tindakan menyeret yang sedang berlangsung. Dalam narasi Indonesia, bentuk verba sederhana tetap alami, sedangkan 'menyeret' mempertahankan unsur paksaan.
- source_word: ἔξω τοῦ ἱεροῦ
  choice: ke luar dari kompleks Bait Allah
  rationale: ἱερόν menunjuk seluruh kompleks atau pelataran Bait Allah, bukan secara khusus ruang kudus bagian dalam. Penjelasan eksplisit mencegah salah pengertian pembaca modern.
- source_word: εὐθέως
  choice: seketika itu juga
  rationale: Ungkapan ini menyampaikan kesegeraan tindakan dengan jelas dan alami.
- source_word: ἐκλείσθησαν αἱ θύραι
  choice: pintu-pintu gerbang ditutup
  rationale: θύραι secara leksikal berarti pintu-pintu, tetapi dalam konteks akses kompleks Bait Allah kemungkinan menunjuk pintu gerbang. Bentuk gabungan menjaga citra pintu sekaligus memperjelas konteks.
