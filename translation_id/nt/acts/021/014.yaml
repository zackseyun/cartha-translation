  text: μὴ πειθομένου δὲ αὐτοῦ ἡσυχάσαμεν εἰπόντες· ⸂Τοῦ κυρίου τὸ θέλημα⸃ ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/014.yaml
  text: And since he would not be persuaded[a], we became quiet, saying, “The Lord’s will be done.”
translation:
  language: id
  text: Karena ia tidak mau dibujuk, kami pun diam[a] dan berkata, “Biarlah kehendak Tuhan terjadi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kami pun berhenti mendesaknya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πειθομένου δὲ αὐτοῦ
  choice: Karena ia tidak juga dapat dibujuk
  rationale: Genitivus absolutus ini menyatakan keadaan yang melatarbelakangi tindakan berikutnya. Bentuk pasif πειθομένου dipertahankan dengan “dapat dibujuk”; “tidak juga” secara wajar menyampaikan bahwa upaya membujuk Paulus terus dilakukan tetapi tidak berhasil.
- source_word: ἡσυχάσαμεν
  choice: kami pun berhenti mendesaknya
  rationale: Dalam konteks ini ἡσυχάζω berarti berhenti memperdebatkan atau mendesakkan perkara tersebut. Terjemahan ini menyampaikan maksud kontekstualnya secara alami, sedangkan kemungkinan yang lebih harfiah dipertahankan dalam catatan kaki.
- source_word: εἰπόντες
  choice: dan berkata
  rationale: Partisip aoris ini menyertai verba utama. Susunan koordinatif “dan berkata” lebih alami dalam bahasa Indonesia daripada konstruksi partisipial, tanpa mengubah hubungan tindakannya.
- source_word: Τοῦ κυρίου
  choice: Tuhan
  rationale: κύριος diterjemahkan “Tuhan”, dengan rujukannya tidak dibuat lebih eksplisit daripada teks Yunani. Hubungan genitif dinyatakan secara alami dalam frasa “kehendak Tuhan”.
- source_word: τὸ θέλημα
  choice: kehendak
  rationale: θέλημα menunjuk pada apa yang dikehendaki atau dimaksudkan; “kehendak” merupakan padanan Indonesia yang baku dan tepat dalam ungkapan penyerahan ini.
- source_word: γινέσθω
  choice: Biarlah ... terlaksana
  rationale: Imperatif γίνομαι mengungkapkan penyerahan agar kehendak Tuhan terjadi atau terwujud. “Biarlah ... terlaksana” alami, bermartabat, dan mempertahankan daya imperatifnya.
theological_decisions:
- issue: Rujukan κύριος
  choice: Tuhan
  alternative: Tuan
  rationale: “Tuhan” merupakan padanan yang paling wajar dalam konteks ucapan penyerahan kepada kehendak ilahi. Terjemahan tidak menambahkan nama atau secara eksplisit menentukan rujukan yang tidak disebutkan dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan “berhenti mendesaknya” memperjelas tindakan yang dihentikan dalam konteks, sementara catatan kaki mempertahankan terjemahan yang lebih harfiah dari ἡσυχάσαμεν.
