id: ACT.21.17
reference: Acts 21:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Γενομένων δὲ ἡμῶν εἰς Ἱεροσόλυμα ἀσμένως ⸀ἀπεδέξαντο ἡμᾶς οἱ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/017.yaml
  text: When we arrived in Jerusalem[a], the brothers welcomed us gladly.
translation:
  language: id
  text: Ketika kami tiba di Yerusalem, saudara-saudara[a] menyambut kami dengan gembira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudari”; teks Yunani berbunyi “saudara-saudara”, yang juga dapat merujuk secara lebih luas kepada sesama orang percaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένων δὲ ἡμῶν
  choice: Ketika kami tiba
  rationale: Konstruksi genitif absolut ini menyatakan keadaan atau waktu kedatangan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna temporalnya.
- source_word: εἰς Ἱεροσόλυμα
  choice: di Yerusalem
  rationale: Dengan verba 'tiba', bahasa Indonesia secara idiomatis memakai 'di' untuk tempat tujuan yang telah dicapai.
- source_word: ἀσμένως
  choice: dengan gembira
  rationale: Adverbia ini menyatakan kegembiraan atau kesediaan hati saat menerima seseorang; frasa ini dekat secara makna dan alami dalam bahasa Indonesia.
- source_word: ἀπεδέξαντο
  choice: menyambut
  rationale: Dalam konteks menerima kedatangan orang, kata ini mengacu pada penerimaan yang ramah; 'menyambut' lebih tepat daripada 'menerima' dalam bahasa Indonesia modern.
- source_word: οἱ ἀδελφοί
  choice: saudara-saudara
  rationale: Bentuk Yunani adalah nomina maskulin jamak yang dalam pemakaian Kristen awal juga dapat menunjuk lebih luas kepada sesama orang percaya. Teks utama mempertahankan bentuk sumber, sedangkan kemungkinan cakupan inklusif dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Cakupan gender οἱ ἀδελφοί bagi komunitas Kristen di Yerusalem
  choice: saudara-saudara
  alternative: saudara-saudari; orang-orang percaya
  rationale: Pilihan utama mempertahankan bentuk maskulin jamak dalam teks Yunani tanpa menutup kemungkinan bahwa istilah itu mencakup perempuan di dalam komunitas orang percaya; kemungkinan tersebut dicatat, bukan dipastikan dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, wajar, dan bermartabat. 'Dengan gembira' mempertahankan nuansa ἀσμένως tanpa menambahkan intensitas yang tidak dinyatakan sumber.
