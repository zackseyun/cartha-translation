  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan hubungan penjelas serta gerak tindakan yang berkelanjutan. Tidak diperlukan catatan kaki karena alternatif idiomatis utama dapat diwakili langsung oleh “Enyahkan dia!” tanpa menghilangkan ambiguitas penting.
