  source_fidelity: Draf ini mempertahankan penghubung penjelas γάρ, aspek imperfek ἠκολούθει, dan seruan imperatif Αἶρε αὐτόν dengan cukup baik. Namun, τὸ πλῆθος τοῦ λαοῦ lebih tepat dan alami diterjemahkan sebagai “orang banyak itu” daripada “kerumunan rakyat”; yang terakhir terdengar janggal dan dapat menggeser rujukan netral “people” ke kategori sosial-politik “rakyat.”
  naturalness: “Kerumunan rakyat” tidak lazim dalam bahasa Indonesia modern, terutama dalam narasi. “Orang banyak itu” adalah ungkapan baku, jelas, dan sesuai register naratif. “Singkirkan dia!” menyampaikan tuntutan keras untuk menyingkirkan dia tanpa menentukan lebih jauh apakah yang dimaksud adalah pemindahan, pengusiran, atau kematian.
  terminology: Tidak ada istilah teologis khusus. “Orang banyak” mempertahankan sifat kolektif dan netral dari πλῆθος τοῦ λαοῦ. “Singkirkan dia!” merupakan padanan idiomatis yang setia bagi Αἶρε αὐτόν dalam konteks permusuhan ini.
