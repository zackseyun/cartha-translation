  text: For the crowd of the people was following[a], shouting, “Take him away!”
translation:
  language: id
  text: Sebab, orang banyak itu terus mengikuti sambil berteriak, “Singkirkan dia!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθει
  choice: terus mengikuti
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung pada waktu lampau; dalam konteks narasi Indonesia, aspek berkelanjutan dinyatakan secara alami dengan “terus”.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan fungsi penghubung yang menjelaskan tindakan pada ayat sebelumnya.
- source_word: τὸ πλῆθος τοῦ λαοῦ
  choice: kerumunan rakyat
  rationale: “Kerumunan” menyampaikan kelompok besar yang berhimpun, sedangkan “rakyat” tetap netral dan tidak menambahkan nuansa merendahkan seperti “gerombolan”.
- source_word: κράζοντες
  choice: sambil berteriak
  rationale: Partisip ini menyatakan tindakan yang menyertai mereka mengikuti; “sambil berteriak” alami dan cukup kuat dalam bahasa Indonesia modern.
- source_word: Αἶρε αὐτόν
  choice: Enyahkan dia!
  rationale: Dalam konteks permusuhan ini, imperatif αἴρω merupakan seruan untuk menyingkirkan Paulus, dengan kemungkinan implisit untuk membunuhnya; “Enyahkan dia!” mempertahankan daya seru dan ambiguitas sasaran akhirnya tanpa mereduksinya menjadi sekadar memindahkan tempat.
