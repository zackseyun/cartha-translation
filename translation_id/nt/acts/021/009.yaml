  text: τούτῳ δὲ ἦσαν θυγατέρες ⸂τέσσαρες παρθένοι⸃ προφητεύουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/009.yaml
  text: He had four unmarried daughters who were prophesying.
translation:
  language: id
  text: Ia mempunyai empat anak perempuan yang masih perawan dan yang bernubuat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτῳ
  choice: Ia
  rationale: Bentuk datif ini menunjuk kembali kepada Filipus dalam konteks langsung; konstruksi kepemilikan bahasa Indonesia paling alami memakai subjek pronominal.
- source_word: δὲ
  choice: —
  rationale: Partikel penghubung ringan ini tidak perlu diterjemahkan tersendiri karena kesinambungan sudah jelas dari alur kalimat.
- source_word: ἦσαν
  choice: mempunyai
  rationale: 'Konstruksi eksistensial τούτῳ ... ἦσαν θυγατέρες secara idiomatis menyatakan kepemilikan: ia mempunyai anak-anak perempuan.'
- source_word: θυγατέρες
  choice: anak perempuan
  rationale: Padanan keluarga yang tepat dan alami dalam bahasa Indonesia.
- source_word: τέσσαρες
  choice: empat
  rationale: Bilangan pokok yang langsung menerangkan anak perempuan.
- source_word: παρθένοι
  choice: yang masih perawan
  rationale: Menyampaikan makna langsung παρθένοι, yaitu perempuan yang belum pernah melakukan hubungan seksual, tanpa mereduksinya hanya menjadi status belum menikah.
- source_word: προφητεύουσαι
  choice: yang bernubuat
  rationale: Partisipel kini feminin jamak menerangkan keempat anak perempuan sebagai orang-orang yang melakukan kegiatan bernubuat; bentuk Indonesia ini alami dan tidak memaksakan apakah kegiatan itu sedang berlangsung tepat pada saat tersebut atau menjadi kebiasaan mereka.
theological_decisions:
- issue: Status παρθένοι dan kegiatan kenabian para anak perempuan
  choice: yang masih perawan dan yang bernubuat
  alternative: anak perempuan yang belum menikah dan bernubuat
  rationale: Teks menyebut status keperawanan dan kegiatan bernubuat tanpa menjelaskan hubungan teologis di antara keduanya. Terjemahan mempertahankan kedua keterangan itu tanpa menambahkan penilaian tentang pelayanan perempuan atau keperawanan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pengulangan “yang” membantu memperjelas bahwa “masih perawan” dan “bernubuat” merupakan dua keterangan sejajar tentang keempat anak perempuan itu.
