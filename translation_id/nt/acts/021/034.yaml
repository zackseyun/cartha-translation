base_translation:
  language: en
  yaml_path: translation/nt/acts/021/034.yaml
  text: But some in the crowd were shouting one thing[a], and others another. Since he was not able to learn the facts because of the uproar[b], he ordered him to be brought into the barracks.
translation:
  language: id
  text: Namun, di tengah orang banyak itu, yang satu meneriakkan ini, yang lain meneriakkan itu. Karena kepala pasukan itu tidak dapat mengetahui apa yang pasti[a] akibat keributan tersebut, ia memerintahkan agar Paulus dibawa ke dalam barak[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebenaran perkara itu” atau “apa yang sebenarnya terjadi.”
    reason: lexical_alternative
  - marker: b
    text: “Barak” merujuk pada tempat pasukan Romawi ditempatkan, kemungkinan di dalam kompleks benteng yang terhubung dengan kawasan Bait Allah.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλοι δὲ ἄλλο τι ἐπεφώνουν ἐν τῷ ὄχλῳ
  choice: di tengah orang banyak itu ada yang meneriakkan satu hal, dan yang lain hal yang lain
  rationale: Mempertahankan kontras distributif ἄλλοι...ἄλλο τι dan nuansa tindakan yang berlangsung pada bentuk imperfek ἐπεφώνουν. 'Orang banyak' netral dan tidak menambahkan penilaian 'gerombolan'.
- source_word: μὴ δυναμένου δὲ αὐτοῦ γνῶναι
  choice: karena kepala pasukan itu tidak dapat mengetahui
  rationale: Genetif absolut dipahami secara kausal. Penyebutan kembali 'kepala pasukan' memperjelas rujukan αὐτοῦ secara alami dalam bahasa Indonesia berdasarkan konteks dekat, tanpa mengubah pelaku.
- source_word: τὸ ἀσφαλές
  choice: apa yang sebenarnya terjadi
  rationale: Mengungkapkan hal yang pasti atau dapat dipercaya mengenai perkara tersebut dalam bahasa Indonesia yang wajar, sambil memberi catatan tentang alternatif yang lebih harfiah.
- source_word: διὰ τὸν θόρυβον
  choice: akibat keributan tersebut
  rationale: θόρυβος menunjuk pada kegaduhan dan kekacauan, bukan sekadar bunyi; 'keributan' sesuai dengan suasana peristiwa.
- source_word: ἐκέλευσεν ἄγεσθαι αὐτὸν
  choice: ia memerintahkan agar Paulus dibawa
  rationale: Mempertahankan sifat pasif infinitif ἄγεσθαι sehingga pelaksana perintah tidak ditambahkan. Nama Paulus dipakai untuk memperjelas rujukan αὐτόν dalam bahasa Indonesia.
- source_word: εἰς τὴν παρεμβολήν
  choice: ke dalam markas
  rationale: Dalam konteks ini παρεμβολή menunjuk pada tempat pasukan Romawi bermarkas di kompleks benteng dekat Bait Allah. 'Markas' alami dan tidak menyiratkan perkemahan sementara.
