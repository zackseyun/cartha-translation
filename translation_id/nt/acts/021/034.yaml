  to: Namun, di tengah orang banyak itu, yang satu meneriakkan ini, yang lain meneriakkan itu. Karena kepala pasukan itu tidak dapat mengetahui apa yang pasti[a] akibat keributan tersebut, ia memerintahkan agar Paulus dibawa ke dalam barak[b].
