  text: Μετὰ δὲ τὰς ἡμέρας ταύτας ἐπισκευασάμενοι ἀνεβαίνομεν εἰς ⸀Ἱεροσόλυμα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/015.yaml
  text: After these days[a], having packed up, we went up to Jerusalem.
translation:
  language: id
  text: Setelah hari-hari itu berlalu, kami bersiap-siap[a] lalu naik ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengemas barang-barang kami.” Kata Yunani ini dapat berarti mempersiapkan diri secara umum untuk perjalanan, bukan hanya mengemas barang bawaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: Sesudah beberapa hari itu
  rationale: μετά dengan akusatif menyatakan urutan waktu. Dalam konteks ini, frasa tersebut menunjuk pada hari-hari yang baru saja disebutkan; bentuk ini alami dalam bahasa Indonesia dan tidak mengharuskan pembaca memahami bahwa semua persiapan baru dilakukan sesudah masa itu berakhir.
- source_word: ἐπισκευασάμενοι
  choice: kami bersiap-siap
  rationale: Partisip ini berarti mempersiapkan atau memperlengkapi diri untuk perjalanan dan mungkin mencakup mengemas barang. Pilihan yang lebih umum mempertahankan keluasan makna Yunani tanpa membatasi tindakan itu hanya pada pengepakan.
- source_word: ἀνεβαίνομεν
  choice: lalu berangkat menuju
  rationale: Imperfek menarasikan perjalanan pada masa lampau. Dalam bahasa Indonesia, 'berangkat menuju' menyampaikan dimulainya gerak ke Yerusalem secara wajar; unsur harfiah 'naik' tidak harus dinyatakan karena dapat terdengar seperti keterangan medan atau sarana perjalanan, meskipun Yunani memakai ungkapan lazim tentang pergi naik ke Yerusalem.
- source_word: εἰς Ἱεροσόλυμα
  choice: menuju Yerusalem
  rationale: εἰς menyatakan arah atau tujuan gerak. 'Menuju Yerusalem' merupakan padanan idiomatis dalam narasi perjalanan.
