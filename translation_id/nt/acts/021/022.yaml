  text: τί οὖν ἐστιν; πάντως ⸀ἀκούσονται ὅτι ἐλήλυθας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/022.yaml
  text: What then is to be done? They will certainly hear that you have come[a].
translation:
  language: id
  text: Jadi, apa yang harus dilakukan? Mereka pasti akan mendengar bahwa engkau sudah datang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Jadi, apakah itu?” Ungkapan Yunani ini menanyakan apa yang harus dilakukan mengingat keadaan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: Jadi, apa yang harus dilakukan?
  rationale: Secara harfiah berarti “Jadi, apakah itu?”, tetapi dalam konteks ungkapan ini berfungsi sebagai pertanyaan praktis tentang langkah yang perlu diambil. Terjemahan ini menyampaikan daya ungkapan Yunani secara wajar dalam bahasa Indonesia.
- source_word: πάντως
  choice: pasti
  rationale: Adverbia ini menegaskan kepastian bahwa kabar tentang kedatangan Paulus akan terdengar.
- source_word: ἀκούσονται
  choice: mereka ... akan mendengar
  rationale: Bentuk futurum medial ini bermakna aktif. Subjek jamaknya tersirat dari konteks dan dinyatakan dengan “mereka” dalam bahasa Indonesia.
- source_word: ὅτι
  choice: bahwa
  rationale: Kata ini memperkenalkan isi kabar yang akan mereka dengar, bukan alasan sebab-akibat.
- source_word: ἐλήλυθας
  choice: engkau sudah datang
  rationale: Bentuk perfektum menyoroti kedatangan yang telah terjadi beserta keadaan kini bahwa Paulus berada di sana. “Sudah datang” mempertahankan nuansa tersebut secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai untuk sapaan tunggal dalam konteks Kitab Suci; susunan kalimat dibuat alami tanpa menghilangkan daya praktis pertanyaan Yunani.
