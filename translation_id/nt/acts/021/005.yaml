source:
  edition: SBLGNT
  text: ὅτε δὲ ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας, ἐξελθόντες ἐπορευόμεθα προπεμπόντων ἡμᾶς πάντων σὺν γυναιξὶ καὶ τέκνοις ἕως ἔξω τῆς πόλεως, καὶ θέντες τὰ γόνατα ἐπὶ τὸν αἰγιαλὸν ⸀προσευξάμενοι
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/005.yaml
  text: When it came time for us to complete those days[a], we departed and went on our way, while they all, with wives and children, were accompanying us as far as outside the city. And after kneeling down on the beach[b], we prayed.
translation:
  language: id
  text: Ketika tiba waktunya bagi kami untuk mengakhiri hari-hari itu, kami berangkat dan meneruskan perjalanan. Mereka semua, bersama istri dan anak-anak mereka, mengantar kami sampai ke luar kota.[a] Lalu, setelah berlutut di pantai,[b] kami berdoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melepas kepergian kami.” Kata kerja Yunani yang dipakai dapat berarti menyertai orang yang akan berangkat sebagai tindakan perpisahan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “di tepi laut.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐξαρτίσαι ἡμᾶς τὰς ἡμέρας
  choice: Ketika tiba waktunya bagi kami untuk mengakhiri hari-hari itu
  rationale: Konstruksi ἐγένετο dengan infinitif menandai tibanya suatu waktu, sedangkan ἐξαρτίσαι di sini berarti menyelesaikan atau mengakhiri masa yang telah ditentukan. Ungkapan 'hari-hari itu' mempertahankan rujukan konkret teks Yunani.
- source_word: ἐξελθόντες ἐπορευόμεθα
  choice: kami berangkat dan meneruskan perjalanan
  rationale: Partisip aoris menyatakan keberangkatan yang mendahului verba imperfek tentang perjalanan yang berlanjut. Rumusan ini mempertahankan kedua unsur dengan bahasa Indonesia yang alami.
- source_word: προπεμπόντων ἡμᾶς πάντων
  choice: Mereka semua ... mengantar kami
  rationale: προπέμπω dalam konteks keberangkatan berarti menyertai atau mengantar seseorang sebagai tindakan perpisahan. 'Mengantar kami' paling wajar dalam bahasa Indonesia dan mencakup gagasan menyertai hingga titik tertentu.
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: bersama istri dan anak-anak mereka
  rationale: Karena πάντων berbentuk maskulin jamak dan adegan ini menggambarkan keluarga-keluarga yang ikut mengantar, γυναιξὶ paling mungkin berarti 'istri'. Kata 'mereka' ditambahkan secara implisit untuk memperjelas hubungan keluarga dalam bahasa Indonesia.
- source_word: ἕως ἔξω τῆς πόλεως
  choice: sampai ke luar kota
  rationale: Frasa ini menunjukkan bahwa rombongan mengantar hingga suatu tempat di luar batas kota. 'Sampai ke luar kota' mempertahankan daya arah frasa Yunani dan tetap alami.
- source_word: θέντες τὰ γόνατα
  choice: setelah berlutut
  rationale: Secara harfiah ungkapan ini berarti 'meletakkan lutut' dan merupakan idiom untuk berlutut. Bentuk 'setelah berlutut' juga menunjukkan bahwa tindakan itu mendahului doa.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: di pantai
  rationale: αἰγιαλός menunjuk pada pantai atau tepi laut. 'Di pantai' adalah padanan modern yang jelas; kemungkinan 'di tepi laut' dicatat dalam catatan kaki.
- source_word: προσευξάμενοι
  choice: kami berdoa
  rationale: Partisip jamak ini melanjutkan urutan tindakan dalam narasi orang pertama. Mengalihkannya menjadi verba finit menghasilkan kalimat Indonesia yang alami tanpa menghilangkan urutan peristiwa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Susunan kalimat dibagi agar mudah dipahami, sementara urutan keberangkatan, pengantaran, berlutut, dan berdoa tetap dipertahankan.
