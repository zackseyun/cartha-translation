  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi dua agar hubungan antarketerangan jelas bagi pembaca umum, tanpa mengubah urutan pokok informasi. Kapitalisasi “Kitab Suci” menandai tulisan-tulisan suci yang dimaksud dalam konteks Yahudi.
