base_translation:
  language: en
  yaml_path: translation/nt/acts/018/024.yaml
  text: A certain Jew named Apollos[a], an Alexandrian by birth, an eloquent man, arrived in Ephesus, being mighty in the Scriptures.
translation:
  language: id
  text: Seorang Yahudi bernama Apolos, yang berasal dari Aleksandria, seorang pria yang fasih berbicara[a] dan sangat menguasai Kitab Suci, tiba di Efesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: terpelajar; kata Yunani λόγιος dapat berarti fasih berbicara atau terpelajar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: orang Yahudi
  rationale: Dalam konteks ini, istilah tersebut menunjukkan identitas etnis-keagamaan Apolos, bukan sekadar asal geografis dari Yudea.
- source_word: δέ
  choice: tidak dinyatakan secara tersendiri
  rationale: Partikel ini menandai peralihan narasi yang sudah terasa secara alami pada awal kalimat baru; menambahkan “kemudian” akan memberi nuansa waktu yang tidak dinyatakan secara eksplisit.
- source_word: τις
  choice: seorang
  rationale: Kata sandang tak tentu dalam bahasa Indonesia secara alami memperkenalkan tokoh baru dan menyampaikan ketaktentuan τις tanpa ungkapan kaku seperti “seorang tertentu”.
- source_word: Ἀπολλῶς ὀνόματι
  choice: bernama Apolos
  rationale: Ini adalah ungkapan Indonesia yang wajar untuk idiom Yunani yang memperkenalkan nama seseorang.
- source_word: Ἀλεξανδρεὺς τῷ γένει
  choice: kelahiran Aleksandria
  rationale: Ungkapan ini menyampaikan asal Apolos sejak lahir tanpa memakai istilah “ras” yang dapat menyesatkan pembaca modern.
- source_word: ἀνὴρ λόγιος
  choice: seorang yang fasih berbicara
  rationale: λόγιος dapat menunjuk pada kefasihan atau keterpelajaran. “Fasih berbicara” sesuai dengan konteks dan tetap membedakannya dari penguasaan Kitab Suci pada frasa berikutnya; kemungkinan makna lainnya dicatat dalam catatan kaki.
- source_word: κατήντησεν εἰς Ἔφεσον
  choice: tiba di Efesus
  rationale: Kata kerja ini menyatakan sampainya seseorang di suatu tujuan; “tiba di” merupakan ungkapan Indonesia yang ringkas dan alami.
- source_word: δυνατὸς ὢν ἐν ταῖς γραφαῖς
  choice: sangat menguasai Kitab Suci
  rationale: Ungkapan ini menyampaikan kemampuan kuat Apolos berkenaan dengan Kitab Suci dalam bahasa Indonesia modern, tanpa memberi kesan bahwa kuasa yang dimaksud adalah kekuatan fisik atau kuasa gaib.
