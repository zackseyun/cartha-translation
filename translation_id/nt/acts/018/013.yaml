  text: λέγοντες ὅτι Παρὰ τὸν νόμον ⸂ἀναπείθει οὗτος⸃ τοὺς ἀνθρώπους σέβεσθαι τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/013.yaml
  text: saying[b][a], “This man is persuading people to worship God contrary to the law.”
translation:
  language: id
  text: Mereka berkata, “Orang ini membujuk orang-orang untuk menyembah Allah bertentangan dengan hukum.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melawan hukum” atau “dengan melanggar hukum.”
    reason: lexical_alternative
  - marker: b
    text: Para penuduh kemungkinan memaksudkan hukum Yahudi, meskipun teks Yunani hanya menyebut “hukum.” Frasa “bertentangan dengan hukum” juga dapat dipahami sebagai keterangan atas tindakan membujuk orang-orang, bukan hanya atas ibadah yang diajarkan.
    reason: cultural_note
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: Mereka berkata, “...”
  rationale: Partisipel kini λέγοντες memperkenalkan isi tuduhan, sedangkan ὅτι dapat diungkapkan secara alami melalui kutipan langsung dalam bahasa Indonesia.
- source_word: Παρὰ τὸν νόμον
  choice: dengan cara yang bertentangan dengan hukum
  rationale: παρά dengan akusatif menyatakan pertentangan atau pelanggaran terhadap suatu norma. Frasa ini mempertahankan nuansa hukum dan mengaitkan pertentangan itu dengan cara beribadah yang dituduhkan.
- source_word: ἀναπείθει
  choice: membujuk
  rationale: Kata ini berarti memengaruhi atau meyakinkan orang agar mengikuti sesuatu. 'Membujuk' mempertahankan unsur persuasi tanpa menambahkan makna negatif yang lebih kuat seperti 'menyesatkan'.
- source_word: οὗτος
  choice: Orang ini
  rationale: Menjaga daya tunjuk demonstratif dalam tuduhan tanpa memakai ungkapan yang terlalu merendahkan.
- source_word: τοὺς ἀνθρώπους
  choice: orang-orang
  rationale: ἄνθρωποι bersifat generik dan merujuk kepada manusia tanpa pembatasan gender.
- source_word: σέβεσθαι τὸν θεόν
  choice: untuk menyembah Allah
  rationale: Dalam konteks keagamaan ini, σέβομαι menunjuk pada penghormatan religius atau ibadah; 'menyembah Allah' merupakan padanan Indonesia yang jelas dan wajar.
- source_word: τὸν νόμον
  choice: hukum
  rationale: Teks Yunani hanya menyebut 'hukum' tanpa secara eksplisit menambahkan 'Yahudi' atau 'kami', sehingga terjemahan utama tetap menahan diri.
theological_decisions:
- issue: Rujukan 'hukum' dalam tuduhan
  choice: Mempertahankan ungkapan umum 'hukum' dalam teks utama.
  alternative: hukum Yahudi; hukum kami
  rationale: Dalam konteksnya para penuduh kemungkinan besar memaksudkan hukum Yahudi, tetapi teks Yunani hanya berbunyi τὸν νόμον. Kekhususan kontekstual dijelaskan dalam catatan kaki agar tidak disisipkan ke dalam teks.
- issue: Hubungan frasa Παρὰ τὸν νόμον dengan tuduhan
  choice: 'Menerjemahkannya sebagai keterangan cara: ''menyembah Allah dengan cara yang bertentangan dengan hukum''.'
  alternative: membujuk orang-orang, dengan melanggar hukum, untuk menyembah Allah
  rationale: Susunan Yunani memungkinkan ketegangan mengenai apakah pelanggaran itu terutama terletak pada tindakan membujuk atau pada bentuk ibadah yang diajarkan. Pilihan utama mengikuti pemahaman kontekstual yang alami, sementara catatan mempertahankan alternatif cakupan sintaksis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-forensik yang wajar. 'Orang ini' menjaga tekanan tuduhan, sedangkan 'membujuk' menghindari penilaian tambahan yang tidak diwajibkan oleh verba Yunani.
