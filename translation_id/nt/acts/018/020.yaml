  text: ἐρωτώντων δὲ αὐτῶν ἐπὶ πλείονα χρόνον ⸀μεῖναι οὐκ ἐπένευσεν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/020.yaml
  text: But when they asked him to stay for a longer time[a], he did not consent,
translation:
  language: id
  text: Namun, ketika mereka meminta dia tinggal lebih lama, dia tidak menyetujui permintaan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dia tidak mengiyakan permintaan itu” atau “dia tidak bersedia.” Kata Yunani yang dipakai berarti mengiyakan atau menyetujui suatu permintaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτώντων
  choice: ketika mereka meminta
  rationale: Partisipel kini dalam konstruksi genitif absolut paling wajar dialihkan menjadi anak kalimat waktu; konteks menunjukkan suatu permintaan, bukan sekadar pertanyaan.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan kontras ringan terhadap sambutan mereka pada ayat sebelumnya.
- source_word: αὐτῶν
  choice: mereka
  rationale: Pronomina ini mengacu kepada orang-orang di Efesus yang mengajukan permintaan; subjek dibuat eksplisit agar alami dalam bahasa Indonesia.
- source_word: ἐπὶ πλείονα χρόνον
  choice: lebih lama
  rationale: Ungkapan idiomatis yang mempertahankan makna komparatif πλείονα tanpa terjemahan yang kaku.
- source_word: μεῖναι
  choice: tinggal
  rationale: Dalam konteks perjalanan, 'tinggal' merupakan padanan modern dan alami untuk tindakan menetap sementara di suatu tempat.
- source_word: οὐκ ἐπένευσεν
  choice: dia tidak menyetujuinya
  rationale: ἐπινεύω berarti mengiyakan atau menyetujui suatu permintaan; pilihan ini tidak sekeras 'menolak' dan objek implisitnya dijelaskan secara alami dengan '-nya'.
