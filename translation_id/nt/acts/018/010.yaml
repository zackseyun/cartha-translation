  text: διότι ἐγώ εἰμι μετὰ σοῦ καὶ οὐδεὶς ἐπιθήσεταί σοι τοῦ κακῶσαί σε, διότι λαός ἐστί μοι πολὺς ἐν τῇ πόλει ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/010.yaml
  text: because I am with you[a], and no one will attack you to harm you[b], because I have many people in this city.
translation:
  language: id
  text: sebab Aku menyertaimu, dan tidak seorang pun akan menyerangmu untuk mencelakakanmu, sebab banyak orang adalah milik-Ku di kota ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Banyak orang adalah milik-Ku di kota ini’ kemungkinan menunjuk kepada banyak orang di Korintus yang menjadi milik Tuhan, termasuk mereka yang kelak akan percaya.
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: sebab
  rationale: Kata ini menyatakan alasan bagi perintah pada ayat sebelumnya dan, pada kemunculan kedua, alasan bagi janji perlindungan. 'Sebab' jelas, wajar, dan bermartabat dalam bahasa Indonesia.
- source_word: ἐγώ εἰμι μετὰ σοῦ
  choice: Aku menyertai engkau
  rationale: Ungkapan ini menjanjikan kehadiran ilahi. 'Aku' mempertahankan penekanan dari ἐγώ, sedangkan 'menyertai engkau' lebih alami dalam ragam Alkitab Indonesia daripada bentuk harfiah 'ada bersama engkau'.
- source_word: οὐδεὶς
  choice: tidak seorang pun
  rationale: Padanan alami yang mempertahankan penyangkalan menyeluruh.
- source_word: ἐπιθήσεταί σοι
  choice: akan menyerang engkau
  rationale: Dalam konteks ini, ἐπιτίθημι dengan datif menunjuk pada tindakan bermusuhan terhadap Paulus. 'Menyerang' menyampaikan makna itu tanpa mempersempitnya menjadi tindakan fisik tertentu.
- source_word: τοῦ κακῶσαί σε
  choice: untuk mencelakakan engkau
  rationale: Infinitif berartikel ini menyatakan tujuan atau akibat dari serangan. 'Mencelakakan' mencakup tindakan yang mendatangkan bahaya atau penderitaan dan terdengar alami setelah 'menyerang'.
- source_word: λαός
  choice: orang
  rationale: Dalam konstruksi 'banyak orang', kata ini menyatakan kumpulan orang yang diklaim sebagai milik Tuhan. Terjemahan ini alami dan tidak memaksakan bentuk tunggal kolektif yang kaku.
- source_word: ἐστί μοι
  choice: adalah milik-Ku
  rationale: Konstruksi εἰμί dengan datif menyatakan kepunyaan. 'Adalah milik-Ku' mempertahankan gagasan relasional dalam klaim ilahi dan tetap membiarkan terbuka apakah mereka sudah percaya atau kelak akan percaya.
- source_word: πολὺς
  choice: banyak
  rationale: Padanan kuantitatif yang langsung dan alami.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: di kota ini
  rationale: Padanan langsung dan wajar; πόλις tepat diterjemahkan 'kota' untuk Korintus.
theological_decisions:
- issue: Makna 'banyak orang' di kota itu
  choice: Teks utama menyatakan bahwa banyak orang di Korintus adalah milik Tuhan tanpa menentukan apakah semuanya sudah percaya pada saat itu.
  alternative: Ungkapan ini dapat dipahami hanya sebagai orang-orang yang telah menjadi percaya, atau secara lebih umum sebagai orang-orang yang berpihak kepada Paulus.
  rationale: Klaim ilahi tentang 'milik-Ku' mengisyaratkan hubungan dengan Tuhan dan menopang pelayanan Paulus, tetapi teks tidak menjelaskan tahap iman setiap orang tersebut. Terjemahan mempertahankan ketegangan ini; catatan kaki menyebut kemungkinan bahwa ungkapan itu mencakup mereka yang kelak percaya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang wajar dan bermartabat. Pronomina 'Aku', '-Ku', dan 'engkau' dipakai karena tuturan langsung Tuhan kepada Paulus. Penanda catatan kaki ditempatkan segera setelah klausa yang dijelaskan.
