- from: Setiap hari Sabat, Paulus berdiskusi di rumah ibadat[a] dan berusaha meyakinkan orang-orang Yahudi maupun orang-orang Yunani[b][c].
  to: Setiap Sabat, Paulus berdiskusi[a] di sinagoge dan berusaha meyakinkan[b] orang-orang Yahudi dan orang-orang Yunani[c].
  rationale: Revisi ini mempertajam padanan συναγωγή menjadi "sinagoge", memakai koordinasi netral "dan", dan memperbaiki lokasi semua jangkar catatan kaki. Catatan mengenai Ἕλληνες dilunakkan agar tidak melampaui informasi yang diberikan ayat. Makna pokok serta nuansa tindakan persuasif yang berulang tetap dipertahankan.
