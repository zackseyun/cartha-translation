  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διελέγετο δὲ ἐν τῇ συναγωγῇ κατὰ πᾶν σάββατον, ἔπειθέν τε Ἰουδαίους καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/004.yaml
  text: And he was reasoning in the synagogue every Sabbath and persuading Jews and Greeks[a][b][c].
translation:
  language: id
  text: Setiap Sabat, Paulus berdiskusi[a] di sinagoge dan berusaha meyakinkan[b] orang-orang Yahudi dan orang-orang Yunani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "bertukar pikiran" atau "berdebat." Kata Yunaninya dapat menunjuk pada dialog bernalar maupun argumentasi.
    reason: lexical_alternative
  - marker: b
    text: Atau "meyakinkan." Bentuk kata kerja Yunaninya menggambarkan tindakan yang berlangsung atau berulang dan tidak dengan sendirinya menyatakan bahwa setiap pendengar akhirnya berhasil diyakinkan.
    reason: lexical_alternative
  - marker: c
    text: Dalam konteks sinagoge, istilah ini mungkin merujuk kepada orang-orang Yunani yang berhubungan dengan sinagoge; sebagian memahami istilah ini secara lebih luas sebagai "orang-orang bukan Yahudi."
    reason: alternative_reading
lexical_decisions:
- source_word: διελέγετο
  choice: berdiskusi
  rationale: Bentuk imperfek menyatakan kegiatan yang berlangsung atau berulang. Dalam konteks ini, verba tersebut menunjuk pada pembahasan bernalar yang dapat mencakup dialog atau perdebatan.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini hanya menghubungkan dan melanjutkan narasi secara ringan; susunan kalimat Indonesia sudah menyampaikan alurnya dengan alami.
- source_word: ἐν τῇ συναγωγῇ
  choice: di rumah ibadat
  rationale: Frasa ini bersifat lokatif. 'Rumah ibadat' merupakan padanan Indonesia yang jelas bagi tempat pertemuan ibadah Yahudi.
- source_word: κατὰ πᾶν σάββατον
  choice: setiap hari Sabat
  rationale: κατά dengan πᾶν memiliki arti distributif, selaras dengan tindakan berulang yang dinyatakan oleh bentuk imperfek.
- source_word: ἔπειθέν
  choice: berusaha meyakinkan
  rationale: Bentuk imperfek menggambarkan upaya persuasif yang terus atau berulang tanpa mengharuskan kesimpulan bahwa semua pendengar akhirnya berhasil diyakinkan.
- source_word: τε
  choice: dan
  rationale: Partikel ini menghubungkan kegiatan berdiskusi dengan upaya meyakinkan; dalam bahasa Indonesia hubungan tersebut paling alami dinyatakan dengan 'dan'.
- source_word: Ἰουδαίους
  choice: orang-orang Yahudi
  rationale: Istilah ini menunjuk kelompok etnoreligius Yahudi, bukan khusus penduduk Yudea.
- source_word: Ἕλληνας
  choice: orang-orang Yunani
  rationale: Terjemahan ini mempertahankan sebutan eksplisit teks dan tidak mempersempitnya menjadi kategori 'orang yang takut akan Allah' yang tidak dinyatakan di ayat ini.
theological_decisions:
- issue: Identitas Ἕλληνας dalam konteks rumah ibadat
  choice: orang-orang Yunani
  alternative: orang-orang bukan Yahudi; orang-orang Yunani yang takut akan Allah
  rationale: Teks menyebut mereka sebagai Ἕλληνες. Konteks memungkinkan bahwa mereka berhubungan dengan rumah ibadat, tetapi ayat ini tidak secara eksplisit menyebut mereka 'orang yang takut akan Allah'; karena itu terjemahan mempertahankan ambiguitas tersebut.
- issue: Hasil dari tindakan meyakinkan
  choice: berusaha meyakinkan
  alternative: meyakinkan
  rationale: Imperfek dapat menggambarkan kegiatan persuasif yang sedang atau berulang. Pilihan ini menghindari kesan bahwa semua orang Yahudi dan Yunani pasti berhasil diyakinkan, sambil tetap menyatakan tujuan tindakan Paulus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama 'Paulus' dipakai untuk memperjelas subjek tersirat dari konteks, sedangkan 'rumah ibadat' dipilih sebagai istilah yang mudah dipahami. Penempatan keterangan waktu di awal membuat pola kegiatan berulang terdengar alami.
