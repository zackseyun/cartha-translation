  naturalness: Susunan dengan keterangan waktu di awal wajar dalam bahasa Indonesia baku. "Setiap hari Sabat" dapat dipakai, tetapi "setiap Sabat" lebih ringkas dan alami dalam register Alkitab modern. Penempatan jangkar catatan kaki perlu dipindahkan agar masing-masing melekat pada unsur yang benar.
  terminology: '"Sinagoge," "orang-orang Yahudi," dan "orang-orang Yunani" adalah istilah yang tepat dan tidak mempersempit Ἕλληνας menjadi kelompok sosial-keagamaan tertentu. "Berusaha meyakinkan" dengan baik menyampaikan aspek imperfek sebagai kegiatan/upaya berulang tanpa menyatakan keberhasilan persuasinya.'
