  text: καὶ κατελθὼν εἰς Καισάρειαν, ἀναβὰς καὶ ἀσπασάμενος τὴν ἐκκλησίαν, κατέβη εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/022.yaml
  text: And after going down to Caesarea[a], he went up and greeted the church, then went down to Antioch.
translation:
  language: id
  text: Sesudah turun ke Kaisarea, ia naik[a] dan memberi salam kepada jemaat, lalu turun ke Antiokhia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tujuan “naik” ini kemungkinan besar Yerusalem; dengan demikian, jemaat yang dikunjunginya kemungkinan jemaat di Yerusalem. Banyak terjemahan menyebut Yerusalem secara eksplisit di sini, tetapi nama itu tidak terdapat dalam teks Yunani.
    reason: alternative_reading
lexical_decisions:
- source_word: κατελθὼν
  choice: sesudah turun
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama; bentuk ini juga mempertahankan bahasa arah dan topografi khas Lukas.
- source_word: Καισάρειαν
  choice: Kaisarea
  rationale: Transliterasi baku dalam bahasa Indonesia; konteks menunjuk kepada Kaisarea di pesisir tanpa perlu memperpanjang nama dalam teks utama.
- source_word: ἀναβὰς
  choice: ia naik
  rationale: Mempertahankan makna arah tanpa menambahkan tujuan yang tidak disebutkan secara eksplisit dalam teks Yunani.
- source_word: ἀσπασάμενος
  choice: memberi salam kepada
  rationale: Padanan alami dan langsung untuk tindakan menyapa dalam konteks kunjungan ini.
- source_word: τὴν ἐκκλησίαν
  choice: jemaat
  rationale: Padanan baku dan alami dalam bahasa Indonesia untuk komunitas orang percaya yang dimaksud dalam Kisah Para Rasul.
- source_word: κατέβη
  choice: turun
  rationale: Mempertahankan ungkapan arah dan topografi dalam narasi perjalanan Lukas.
- source_word: Ἀντιόχειαν
  choice: Antiokhia
  rationale: Bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia; konteks menunjuk kepada Antiokhia di Siria.
theological_decisions:
- issue: Apakah tujuan tersirat dari frasa 'ia naik' harus disebut sebagai Yerusalem
  choice: Tujuan tetap tersirat dalam teks utama
  alternative: Menerjemahkan secara eksplisit, 'ia naik ke Yerusalem'
  rationale: Urutan perjalanan dari Kaisarea, naik dan memberi salam kepada jemaat, lalu turun ke Antiokhia sangat mungkin menyiratkan Yerusalem. Namun, teks Yunani tidak menyebut nama Yerusalem, sehingga terjemahan utama tidak menambahkannya dan penjelasan diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Kata-kata arah 'turun' dan 'naik' dipertahankan untuk mencerminkan gaya perjalanan dan topografi Lukas.
