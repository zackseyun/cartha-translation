  text: ⸂ἀλλὰ ἀποταξάμενος καὶ⸃ ⸀εἰπών· ⸀Πάλιν ἀνακάμψω πρὸς ὑμᾶς τοῦ θεοῦ θέλοντος ἀνήχθη ἀπὸ τῆς Ἐφέσου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/021.yaml
  text: but after taking leave and saying[a], “I will return to you again[b], if God wills,” he set sail from Ephesus.
translation:
  language: id
  text: Namun, setelah berpamitan dan berkata[a], “Aku akan kembali lagi kepada kalian, jika Allah menghendaki[b],” ia berlayar dari Efesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah tidak memuat kata-kata ‘dan berkata, “Aku akan kembali lagi kepada kalian, jika Allah menghendaki.”’
    reason: textual_variant
  - marker: b
    text: Atau, ‘bila Allah berkenan.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan dengan permintaan sebelumnya agar Paulus tinggal lebih lama, sekaligus mengalir alami dalam narasi bahasa Indonesia.
- source_word: ἀποταξάμενος
  choice: setelah berpamitan
  rationale: Partisip aoris medium ini menyatakan tindakan berpamitan sebelum keberangkatan; pilihan ini alami dan tetap mempertahankan urutan tindakan.
- source_word: καὶ εἰπών
  choice: dan berkata
  rationale: Mencerminkan partisip kedua yang menyertai tindakan berpamitan tanpa membuat susunan kalimat Indonesia terasa kaku.
- source_word: Πάλιν
  choice: lagi
  rationale: Menyampaikan makna pengulangan secara wajar bersama verba 'kembali'.
- source_word: ἀνακάμψω
  choice: Aku akan kembali
  rationale: Menyatakan rencana pada masa mendatang untuk datang kembali, sesuai makna verba dalam konteks perjalanan.
- source_word: πρὸς ὑμᾶς
  choice: kepada kalian
  rationale: Menerjemahkan arah kepada sekelompok orang yang disapa; 'kalian' memperjelas bentuk jamak ὑμᾶς dalam bahasa Indonesia modern.
- source_word: τοῦ θεοῦ θέλοντος
  choice: jika Allah menghendakinya
  rationale: Mewakili konstruksi genitif absolut yang menyatakan bahwa rencana itu bergantung pada kehendak Allah.
- source_word: ἀνήχθη
  choice: ia berlayar
  rationale: Dalam narasi perjalanan, verba ini merupakan istilah pelayaran yang berarti bertolak melalui laut.
- source_word: ἀπὸ τῆς Ἐφέσου
  choice: dari Efesus
  rationale: Menyatakan tempat keberangkatan secara langsung dan mempertahankan bentuk nama kota yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Ketergantungan rencana perjalanan Paulus pada kehendak ilahi
  choice: jika Allah menghendakinya
  alternative: jika Tuhan menghendakinya; bila Allah berkenan
  rationale: Teks Yunani secara eksplisit memakai τοῦ θεοῦ, 'Allah', bukan 'Tuhan'. Terjemahan mempertahankan sifat bersyarat dari rencana Paulus tanpa memperlunak atau mengganti rujukan ilahinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menunjukkan bahwa kata ganti Yunani berbentuk jamak. Susunan partisip diterjemahkan secara alami tanpa menghilangkan urutan berpamitan, berbicara, lalu berlayar.
