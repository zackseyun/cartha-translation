  text: ἐπιλαβόμενοι δὲ ⸀πάντες Σωσθένην τὸν ἀρχισυνάγωγον ἔτυπτον ἔμπροσθεν τοῦ βήματος· καὶ οὐδὲν τούτων τῷ Γαλλίωνι ⸀ἔμελεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/017.yaml
  text: Then they all seized Sosthenes[a], the synagogue ruler, and beat him in front of the tribunal. But Gallio paid no attention to these things.
translation:
  language: id
  text: Lalu mereka semua menangkap Sostenes[a], pemimpin rumah ibadat, dan memukulinya di depan kursi pengadilan. Namun, Galio sama sekali tidak memedulikan hal-hal itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah memuat “semua orang Yunani”, bukan hanya “mereka semua”. Teks yang paling awal lebih singkat dan tidak menyebutkan identitas kelompok itu.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: menangkap
  rationale: Partisip aoris dari ἐπιλαμβάνομαι berarti memegang atau menangkap; dalam konteks tindakan massa yang dilanjutkan dengan pemukulan, “menangkap” menyampaikan tindakan paksa secara alami.
- source_word: πάντες
  choice: mereka semua
  rationale: Adjektiva nominatif jamak ini dipakai secara substantival. “Mereka semua” mempertahankan cakupan menyeluruh sekaligus membiarkan identitas kelompok tidak disebutkan, seperti dalam teks Yunani.
- source_word: ἀρχισυνάγωγον
  choice: pemimpin rumah ibadat
  rationale: Istilah ini menunjuk pejabat utama sinagoge. “Pemimpin rumah ibadat” jelas bagi pembaca Indonesia dan sesuai dengan istilah yang lazim dalam konteks Alkitab.
- source_word: ἔτυπτον
  choice: memukulinya
  rationale: Bentuk imperfek menggambarkan tindakan memukul yang berlangsung atau berulang; “memukulinya” secara alami menyampaikan aspek iteratif tersebut.
- source_word: ἔμπροσθεν τοῦ βήματος
  choice: di depan kursi pengadilan
  rationale: βῆμα di sini adalah tempat duduk atau panggung resmi pejabat pengadil. “Kursi pengadilan” mempertahankan gambaran konkret sekaligus memperjelas latar yudisial.
- source_word: οὐδὲν τούτων ... ἔμελεν
  choice: sama sekali tidak memedulikan hal-hal itu
  rationale: Ungkapan ini menyatakan bahwa semua kejadian tersebut tidak menjadi perhatian Galio. “Sama sekali” mencerminkan daya penyangkalan οὐδέν secara wajar.
- source_word: δέ
  choice: Lalu
  rationale: δέ menandai kelanjutan narasi; “Lalu” menghasilkan alur yang alami.
- source_word: καί
  choice: Namun
  rationale: Walaupun καί biasanya berarti “dan”, di sini terdapat kontras pragmatis antara kekerasan massa dan ketidakpedulian Galio; “Namun” menyatakannya secara alami tanpa mengubah isi.
theological_decisions:
- issue: Identitas πάντες (“semua”)
  choice: Identitas kelompok dibiarkan tidak disebutkan dalam teks utama melalui “mereka semua”.
  alternative: semua orang Yunani; semua orang Yahudi
  rationale: Teks SBLGNT hanya memuat πάντες tanpa nomina yang mengidentifikasi kelompok. Terjemahan tidak boleh menetapkan identitas yang tidak dinyatakan sumber; varian yang menyebut orang Yunani dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat alami, ambiguitas identitas massa dipertahankan, dan aspek tindakan berulang pada ἔτυπτον diungkapkan dengan “memukulinya”.
