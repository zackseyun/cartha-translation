id: ACT.18.2
reference: Acts 18:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εὑρών τινα Ἰουδαῖον ὀνόματι Ἀκύλαν, Ποντικὸν τῷ γένει, προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ διὰ τὸ ⸀διατεταχέναι Κλαύδιον χωρίζεσθαι πάντας τοὺς Ἰουδαίους ⸀ἀπὸ τῆς Ῥώμης, προσῆλθεν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/002.yaml
  text: And he found a Jew named Aquila[a], a native of Pontus, who had recently come from Italy with Priscilla his wife because Claudius had ordered all the Jews to leave Rome; and he went to them.
translation:
  language: id
  text: Ia menjumpai seorang Yahudi bernama Akwila, yang berasal dari Pontus dan belum lama datang dari Italia bersama istrinya, Priskila, karena Klaudius telah memerintahkan agar semua orang Yahudi meninggalkan Roma.[a] Lalu ia mendatangi mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “diusir dari Roma.” Secara lebih harfiah, bahasa Yunani menyatakan bahwa mereka harus dipisahkan dari Roma; teks utama memakai ungkapan Indonesia yang alami, “meninggalkan Roma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρών
  choice: menjumpai
  rationale: Partisip aoristis ini mengantar tindakan berikutnya. “Menjumpai” menyampaikan makna menemukan atau bertemu dengan seseorang secara alami dalam narasi Indonesia.
- source_word: τινα Ἰουδαῖον
  choice: seorang Yahudi
  rationale: τις bersifat tak tentu, sedangkan Ἰουδαῖον di sini menunjuk identitas etnis-keagamaan orang tersebut.
- source_word: ὀνόματι Ἀκύλαν
  choice: bernama Akwila
  rationale: Ungkapan idiomatis untuk memperkenalkan nama seseorang; bentuk “bernama” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: Ποντικὸν τῷ γένει
  choice: yang berasal dari Pontus
  rationale: Frasa ini menyatakan asal-usul geografis atau kelahiran, bukan sekadar tempat tinggal.
- source_word: προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας
  choice: belum lama datang dari Italia
  rationale: Partisip perfek bersama προσφάτως menunjukkan kedatangan yang baru terjadi sebelum peristiwa utama dan masih relevan pada saat itu.
- source_word: καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ
  choice: bersama istrinya, Priskila
  rationale: καί menghubungkan Priskila dengan kedatangan Akwila dari Italia. Susunan ini alami dalam bahasa Indonesia dan menyatakan hubungan mereka dengan jelas.
- source_word: διὰ τὸ διατεταχέναι Κλαύδιον
  choice: karena Klaudius telah memerintahkan
  rationale: διά dengan infinitif berartikel menyatakan sebab, dan διατάσσω dalam konteks ini menunjuk perintah resmi penguasa.
- source_word: χωρίζεσθαι πάντας τοὺς Ἰουδαίους ἀπὸ τῆς Ῥώμης
  choice: agar semua orang Yahudi meninggalkan Roma
  rationale: χωρίζεσθαι dengan ἀπό menyatakan pemisahan dari Roma. “Meninggalkan Roma” menyampaikan hasil perintah itu secara alami tanpa memperkuatnya menjadi pengusiran secara eksplisit.
- source_word: προσῆλθεν αὐτοῖς
  choice: ia mendatangi mereka
  rationale: προσέρχομαι berarti pergi atau datang mendekati seseorang. “Mendatangi” sesuai dengan gerak naratif dan tetap mempertahankan subjek tersirat dalam bahasa Yunani.
theological_decisions:
- issue: Makna Ἰουδαῖον / Ἰουδαίους
  choice: Yahudi / orang Yahudi
  alternative: orang Yudea
  rationale: Konteksnya adalah komunitas Yahudi di Roma yang dikenai perintah Klaudius, bukan semata-mata penduduk wilayah Yudea. Karena itu, makna etnis-keagamaan paling sesuai.
- issue: Kekuatan makna χωρίζεσθαι ἀπὸ τῆς Ῥώμης
  choice: meninggalkan Roma
  alternative: diusir dari Roma
  rationale: Teks Yunani secara langsung menyatakan pemisahan atau keberangkatan dari Roma. “Diusir” mungkin menggambarkan dampak perintah itu, tetapi lebih tegas daripada bentuk leksikal Yunani dan karena itu dicatat sebagai alternatif.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia: Akwila, Priskila, Klaudius, Pontus, dan Roma. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.'
