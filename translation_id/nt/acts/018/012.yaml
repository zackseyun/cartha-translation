id: ACT.18.12
reference: Acts 18:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Γαλλίωνος δὲ ⸂ἀνθυπάτου ὄντος⸃ τῆς Ἀχαΐας κατεπέστησαν ⸂ὁμοθυμαδὸν οἱ Ἰουδαῖοι⸃ τῷ Παύλῳ καὶ ἤγαγον αὐτὸν ἐπὶ τὸ βῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/012.yaml
  text: But while Gallio was proconsul of Achaia[a], the Jews rose up together against Paul and brought him before the tribunal[b],
translation:
  language: id
  text: Namun, ketika Galio menjabat sebagai prokonsul Akhaya, orang-orang Yahudi[a] bersama-sama bangkit melawan Paulus dan membawanya ke hadapan pengadilan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud di sini ialah kelompok orang Yahudi setempat yang bertindak melawan Paulus, bukan semua orang Yahudi tanpa terkecuali.
    reason: cultural_note
  - marker: b
    text: Atau, “ke kursi pengadilan.” Istilah Yunani ini menunjuk pada panggung atau kursi resmi tempat seorang pejabat mengadili perkara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γαλλίωνος
  choice: Galio
  rationale: Nama diri ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan naratif dengan nuansa pertentangan ringan menuju munculnya perlawanan.
- source_word: ἀνθυπάτου ὄντος
  choice: ketika ... menjadi prokonsul
  rationale: Konstruksi genitif absolut memberi latar waktu; bentuk ini alami dalam bahasa Indonesia dan mempertahankan fungsi temporalnya.
- source_word: ἀνθύπατος
  choice: prokonsul
  rationale: Gelar resmi kepala provinsi Romawi ini lebih tepat secara historis daripada istilah umum seperti 'gubernur'.
- source_word: Ἀχαΐας
  choice: Akhaya
  rationale: Transliterasi nama provinsi Romawi yang jelas dan lazim dalam konteks Alkitab berbahasa Indonesia.
- source_word: κατεπέστησαν
  choice: bangkit melawan
  rationale: Mengungkapkan tindakan bermusuhan terhadap Paulus tanpa menambahkan kekerasan fisik yang tidak dinyatakan secara eksplisit.
- source_word: ὁμοθυμαδὸν
  choice: bersama-sama
  rationale: Menyampaikan tindakan yang dilakukan secara serentak dan seia sekata dengan bahasa Indonesia yang alami.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Mempertahankan penyebutan langsung dalam teks Yunani tanpa mempersempitnya menjadi para pemimpin; catatan kaki menjelaskan cakupan setempatnya.
- source_word: τῷ Παύλῳ
  choice: melawan Paulus
  rationale: Dalam kaitannya dengan κατεπέστησαν, bentuk datif ini menunjuk sasaran tindakan bermusuhan.
- source_word: ἤγαγον αὐτὸν
  choice: membawanya
  rationale: Padanan netral yang sesuai dengan suasana hukum dan tidak memasukkan nuansa 'menyeret' yang tidak diwajibkan oleh teks.
- source_word: ἐπὶ τὸ βῆμα
  choice: ke hadapan pengadilan
  rationale: Menyampaikan bahwa Paulus dibawa menghadap tempat atau lembaga pengadilan resmi, dengan ungkapan yang mudah dipahami pembaca modern.
theological_decisions:
- issue: Penerjemahan οἱ Ἰουδαῖοι dalam kisah konflik
  choice: orang-orang Yahudi
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Teks menyebut 'orang-orang Yahudi' dan tidak secara eksplisit membatasi mereka pada para pemimpin. Catatan kaki mencegah generalisasi seolah-olah yang dimaksud ialah seluruh orang Yahudi di mana pun.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Istilah administratif Romawi 'prokonsul' dipertahankan demi ketepatan sejarah; catatan kaki membantu pembaca pada dua ungkapan yang berpotensi disalahpahami.
