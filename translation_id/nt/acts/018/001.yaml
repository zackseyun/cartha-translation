id: ACT.18.1
reference: Acts 18:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Μετὰ ταῦτα ⸀χωρισθεὶς ἐκ τῶν Ἀθηνῶν ἦλθεν εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/001.yaml
  text: After this[a], he left Athens and went to Corinth.
translation:
  language: id
  text: Setelah itu[a], ia meninggalkan Atena dan pergi ke Korintus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Sesudah hal-hal ini, setelah berangkat dari Atena, ia datang ke Korintus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Setelah itu
  rationale: Ungkapan ini menjadi peralihan waktu dalam narasi. “Setelah itu” alami dalam bahasa Indonesia modern dan tetap menunjukkan urutan peristiwa.
- source_word: χωρισθεὶς
  choice: ia meninggalkan
  rationale: Partisip aoris pasif χωρίζω di sini digunakan secara idiomatis untuk tindakan berangkat atau meninggalkan suatu tempat; terjemahan aktif ini menyampaikan maknanya secara wajar tanpa memaksakan bentuk pasif yang kaku.
- source_word: ἐκ τῶν Ἀθηνῶν
  choice: Atena
  rationale: ἐκ menandai tempat asal, tetapi bersama verba “meninggalkan”, bahasa Indonesia secara alami menjadikan nama tempat sebagai objek langsung.
- source_word: ἦλθεν
  choice: pergi
  rationale: Walaupun ἔρχομαι dapat berarti “datang”, sudut pandang naratif mengenai perjalanan dari Atena ke kota lain lebih alami dinyatakan dengan “pergi” dalam bahasa Indonesia.
- source_word: εἰς Κόρινθον
  choice: ke Korintus
  rationale: εἰς menyatakan gerak menuju suatu tempat; “ke Korintus” merupakan bentuk Indonesia yang baku dan alami.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia modern, lugas, dan bermartabat. Nama tempat mengikuti bentuk Indonesia yang lazim: Atena dan Korintus. Pronomina “ia” dipertahankan karena rujukannya tersedia dari konteks sebelumnya.'
