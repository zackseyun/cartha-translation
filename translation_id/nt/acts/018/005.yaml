  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὡς δὲ κατῆλθον ἀπὸ τῆς Μακεδονίας ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος, συνείχετο τῷ ⸀λόγῳ ὁ Παῦλος, διαμαρτυρόμενος τοῖς Ἰουδαίοις ⸀εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/005.yaml
  text: But when Silas and Timothy came down from Macedonia[a], Paul was occupied with the word[b], solemnly testifying to the Jews that Jesus is the Messiah.
translation:
  language: id
  text: Namun, ketika Silas dan Timotius turun dari Makedonia, Paulus mencurahkan perhatiannya pada pemberitaan firman[a] sambil bersaksi dengan sungguh-sungguh kepada orang-orang Yahudi bahwa Yesus adalah Mesias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani juga dapat diterjemahkan ‘didesak oleh firman’ atau ‘sepenuhnya menekuni pemberitaan.’ Kata kerjanya dapat menyatakan keadaan tersita, terdesak, atau sepenuhnya menekuni sesuatu.
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: ‘Kristus.’ Di sini kata itu berfungsi sebagai gelar, sehingga diterjemahkan ‘Mesias’ untuk mempertahankan makna mesianiknya.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Namun, ketika
  rationale: Mengungkapkan peralihan wacana melalui δέ dan hubungan waktu melalui ὡς dalam bahasa Indonesia yang alami.
- source_word: κατῆλθον ἀπὸ τῆς Μακεδονίας
  choice: turun dari Makedonia
  rationale: Mempertahankan ungkapan perjalanan κατέρχομαι, ‘turun/dat ang turun’, tanpa menambahkan gagasan ‘kembali’ yang tidak dinyatakan dalam teks.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: Silas dan Timotius
  rationale: Menyampaikan kedua subjek yang dipasangkan oleh τε ... καί secara wajar dalam bahasa Indonesia.
- source_word: συνείχετο τῷ λόγῳ
  choice: mencurahkan seluruh perhatiannya kepada firman
  rationale: Konstruksi ini menggambarkan Paulus sebagai orang yang tersita, terdorong, atau sepenuhnya menekuni firman. Pilihan ini alami dan menyampaikan pengabdian yang intens tanpa menetapkan bahwa firman bertindak sebagai pelaku; kemungkinan nuansa lain dicatat dalam catatan kaki.
- source_word: διαμαρτυρόμενος
  choice: bersaksi dengan sungguh-sungguh
  rationale: Mempertahankan unsur kesaksian dari διαμαρτύρομαι sekaligus daya tekan atau kesungguhan yang terkandung dalam verba tersebut.
- source_word: τοῖς Ἰουδαίοις
  choice: kepada orang-orang Yahudi
  rationale: Dalam konteks Kisah Para Rasul, istilah ini menunjuk kepada orang Yahudi sebagai kelompok etnoreligius, bukan khusus penduduk Yudea.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: bahwa Yesus adalah Mesias
  rationale: Susunan predikatif ini menyatakan identitas Yesus sebagai sosok yang dijanjikan; ‘Mesias’ mempertahankan fungsi χριστός sebagai gelar.
theological_decisions:
- issue: Apakah Χριστός diterjemahkan sebagai gelar atau bentuk nama
  choice: Mesias
  alternative: Kristus
  rationale: 'Χριστός berfungsi sebagai predikat bergelar dalam kesaksian kepada orang-orang Yahudi: Paulus menyatakan bahwa Yesus adalah Mesias. ‘Mesias’ membuat makna gelar itu jelas tanpa menambahkan penafsiran denominasi.'
- issue: Daya hubungan συνείχετο dengan τῷ λόγῳ
  choice: mencurahkan seluruh perhatiannya kepada firman
  alternative: didesak/dikuasai oleh firman
  rationale: Bentuk Yunani dapat menggambarkan keadaan tersita atau tertekan oleh sesuatu, sedangkan datif dapat dipahami sebagai bidang perhatian maupun sarana/penyebab. Teks utama memilih ungkapan yang alami dan tidak mengunci penyebab teologis tertentu; ambiguitasnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. ‘Firman’ dipertahankan sebagai padanan ringkas bagi λόγος dalam pemakaian khas Kisah Para Rasul. Penanda catatan kaki ditempatkan tepat pada ungkapan yang dijelaskan.
