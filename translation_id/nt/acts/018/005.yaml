  naturalness: Bahasa draf pada umumnya baku dan lancar. “Mencurahkan perhatiannya pada pemberitaan firman” lebih idiomatis daripada “mencurahkan seluruh perhatiannya kepada firman” dan lebih jelas bahwa λόγος di sini adalah pesan yang diberitakan.
  terminology: “Orang-orang Yahudi” tepat untuk τοῖς Ἰουδαίοις dalam konteks ini. “Mesias” tepat untuk χριστός yang berfungsi sebagai gelar predikatif. “Pemberitaan firman” mempertahankan register Alkitab Indonesia yang wajar sekaligus menjelaskan fungsi λόγος secara kontekstual.
