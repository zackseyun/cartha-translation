revisions:
- from: Lalu ia meninggalkan tempat itu dan masuk ke rumah seorang bernama Titius Yustus, yang menyembah Allah,[a] dan rumahnya berbatasan langsung dengan sinagoge.[b]
  to: Setelah meninggalkan tempat itu, ia masuk ke rumah seorang laki-laki bernama Titius Yustus, yang menyembah Allah.[a] Rumahnya berbatasan langsung dengan sinagoge.[b]
  rationale: Revisi melengkapi rujukan kepada seorang laki-laki, menyatakan urutan tindakan Yunani secara idiomatis, dan memperlancar relasi antarklausa tanpa mengubah makna. Catatan a dipersempit menjadi alternatif leksikal agar tidak menetapkan status sosial-keagamaan yang tidak perlu dipastikan oleh ayat.
