  text: καὶ μεταβὰς ἐκεῖθεν ⸀εἰσῆλθεν εἰς οἰκίαν τινὸς ὀνόματι ⸀Τιτίου Ἰούστου σεβομένου τὸν θεόν, οὗ ἡ οἰκία ἦν συνομοροῦσα τῇ συναγωγῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/007.yaml
  text: And after leaving there[a], he entered the house of a man named Titius Justus, who worshiped God[b], whose house was next to the synagogue.
translation:
  language: id
  text: Setelah meninggalkan tempat itu, ia masuk ke rumah seorang laki-laki bernama Titius Yustus, yang menyembah Allah.[a] Rumahnya berbatasan langsung dengan sinagoge.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang takut akan Allah” atau “seorang yang beribadah kepada Allah.”
    reason: lexical_alternative
  - marker: b
    text: Atau “berdampingan dengan” atau “memiliki batas bersama dengan sinagoge.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: meninggalkan tempat itu
  rationale: Gabungan partisip aoris dan adverbia tempat menyatakan perpindahan dari lokasi sebelumnya; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan urutan tindakan sebelum verba utama.
- source_word: εἰσῆλθεν εἰς οἰκίαν τινὸς
  choice: masuk ke rumah seorang
  rationale: Menyampaikan gerak masuk serta konstruksi tak tentu secara ringkas dan wajar.
- source_word: ὀνόματι Τιτίου Ἰούστου
  choice: bernama Titius Yustus
  rationale: ὀνόματι diterjemahkan secara idiomatis sebagai 'bernama'; nama Latin ditransliterasikan dengan bentuk yang jelas bagi pembaca Indonesia.
- source_word: σεβομένου τὸν θεόν
  choice: yang menyembah Allah
  rationale: Partisip ini menggambarkan orang non-Yahudi yang berbakti kepada Allah Israel. Terjemahan deskriptif menghindari pemberian label sosial-keagamaan yang terlalu teknis.
- source_word: συνομοροῦσα
  choice: berbatasan langsung dengan
  rationale: Kata ini menunjukkan letak yang berdampingan atau memiliki batas bersama; pilihan ini mempertahankan nuansa spasial yang lebih tepat daripada sekadar 'dekat'.
- source_word: συναγωγῇ
  choice: sinagoge
  rationale: Padanan baku untuk tempat ibadah Yahudi dalam konteks Kisah Para Rasul.
theological_decisions:
- issue: Status Titius Yustus dalam ungkapan σεβόμενος τὸν θεόν
  choice: yang menyembah Allah
  alternative: yang takut akan Allah; seorang yang beribadah kepada Allah
  rationale: Teks menunjukkan baktinya kepada Allah Israel, tetapi tidak dengan sendirinya mengharuskan label teknis suatu golongan tertentu. Terjemahan utama mempertahankan deskripsi tanpa mempersempit statusnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Lalu' menjaga alur naratif tanpa membuat konstruksi partisip Yunani terasa kaku. 'Berbatasan langsung' dipilih untuk ketepatan makna, sedangkan alternatif yang lebih umum dicatat dalam catatan kaki.
