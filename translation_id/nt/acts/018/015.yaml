  naturalness: '"Jika ini adalah persoalan" kurang luwes dalam Bahasa Indonesia karena subjek Yunani adalah ζητήματα, bukan kata tunjuk "ini". "Jika terdapat persoalan-persoalan mengenai ..." lebih jelas dan tetap bernada baku-modern. "Suatu kata" lebih idiomatis daripada "suatu perkataan" untuk mempertahankan singular λόγος tanpa mempersempitnya menjadi ajaran.'
  terminology: '"Hukum kalian sendiri," "hakim," dan "perkara-perkara ini" sesuai dengan konteks yudisial dan sikap menjauh yang tersirat dalam νόμου τοῦ καθ’ ὑμᾶς. Catatan kaki mempertahankan keluasan λόγος dan tidak memaksakan pembacaan teologis tertentu.'
