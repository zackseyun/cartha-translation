  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ ⸀ζητήματά ἐστιν περὶ λόγου καὶ ὀνομάτων καὶ νόμου τοῦ καθ’ ὑμᾶς, ὄψεσθε αὐτοί· ⸀κριτὴς ἐγὼ τούτων οὐ βούλομαι εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/015.yaml
  text: But if these are questions about a word and names and your own law[a], you yourselves will see to it; I do not want to be a judge of these things.
translation:
  language: id
  text: Namun, jika terdapat persoalan-persoalan mengenai suatu kata[a], nama-nama, dan hukum kalian sendiri, kalian sendirilah yang akan menanganinya; aku tidak mau menjadi hakim atas perkara-perkara ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suatu pesan” atau “ajaran.” Kata Yunani λόγος memiliki cakupan makna yang luas dan dapat menunjuk pada ajaran atau istilah yang diperdebatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματά
  choice: persoalan
  rationale: Kata ini menunjuk pada hal yang diperdebatkan atau diselidiki. “Persoalan” mempertahankan nuansa sengketa tanpa membuatnya terdengar lebih bermusuhan daripada teks Yunani.
- source_word: περὶ λόγου
  choice: tentang suatu perkataan
  rationale: λόγος memiliki cakupan makna yang luas dan dalam konteks ini dapat menunjuk pada perkataan, pesan, atau ajaran. “Suatu perkataan” dekat dengan bentuk Yunani dan mempertahankan ketidakpastiannya; pilihan lain dicatat dalam catatan kaki.
- source_word: ὀνομάτων
  choice: nama-nama
  rationale: Terjemahan langsung ini membiarkan rujukan nama atau gelar yang dipersoalkan tetap terbuka sebagaimana dalam teks sumber.
- source_word: νόμου τοῦ καθ’ ὑμᾶς
  choice: hukum kalian sendiri
  rationale: Ungkapan καθ’ ὑμᾶς menandai hukum itu sebagai hukum yang berlaku bagi pihak-pihak Yahudi, bukan perkara hukum Romawi. “Hukum kalian sendiri” juga menyampaikan sikap Gallio yang menjaga jarak.
- source_word: ὄψεσθε αὐτοί
  choice: kalian sendirilah yang harus menanganinya
  rationale: Bentuk ini dipakai secara idiomatis dengan arti mengurus atau menangani sesuatu. “Kalian sendirilah” mempertahankan penekanan αὐτοί, sedangkan “harus” menyampaikan daya pragmatis perintah dari bentuk futurum.
- source_word: κριτὴς
  choice: hakim
  rationale: Istilah ini sesuai dengan konteks pengadilan dan penolakan Gallio untuk mengadili sengketa tersebut.
- source_word: τούτων
  choice: perkara-perkara ini
  rationale: Kata tunjuk ini merujuk kembali kepada persoalan yang baru disebutkan. “Perkara-perkara” mempertahankan konteks hukum dan bentuk jamak gagasannya.
- source_word: οὐ βούλομαι εἶναι
  choice: Aku tidak mau menjadi
  rationale: βούλομαι menyatakan kehendak atau kesediaan. “Tidak mau” merupakan ungkapan Indonesia yang alami dan tidak melebihkannya menjadi penolakan hukum formal.
theological_decisions:
- issue: Cakupan λόγος dalam penolakan Gallio
  choice: suatu perkataan
  alternative: suatu pesan; ajaran
  rationale: Teks tidak menentukan apakah λόγος menunjuk pada istilah tertentu, pesan, atau ajaran. Terjemahan utama mempertahankan keluasan itu dan catatan kaki menyajikan kemungkinan lain tanpa menetapkan tafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pronomina “kalian” menandai orang kedua jamak secara jelas; “Aku” mempertahankan gaya ujaran langsung yang tegas. Susunan kalimat dibuat alami dalam bahasa Indonesia sambil mempertahankan daftar tiga pokok sengketa dan ketidakjelasan makna λόγος.
