id: ACT.18.18
reference: Acts 18:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁ δὲ Παῦλος ἔτι προσμείνας ἡμέρας ἱκανὰς τοῖς ἀδελφοῖς ἀποταξάμενος ἐξέπλει εἰς τὴν Συρίαν, καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας, κειράμενος ⸂ἐν Κεγχρεαῖς τὴν κεφαλήν⸃, εἶχεν γὰρ εὐχήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/018.yaml
  text: After Paul had remained many more days[a], he said farewell to the brothers and sailed away for Syria, and with him were Priscilla and Aquila. In Cenchreae he had his head shaved[e][d][c][b], for he had a vow.
translation:
  language: id
  text: Setelah Paulus tinggal cukup lama lagi, ia berpamitan kepada saudara-saudara seiman, lalu berlayar menuju Siria; Priskila dan Akwila menyertainya. Di Kengkrea ia mencukur rambut kepalanya[a] karena ia sedang terikat oleh suatu nazar.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ini juga dapat diterjemahkan “memotong” atau “memangkas rambut kepalanya”; tidak harus berarti mencukur sampai habis.
    reason: lexical_alternative
  - marker: b
    text: Teks hanya menyebut “suatu nazar”; ayat ini tidak secara khusus menyatakannya sebagai nazar orang Nazir.
    reason: cultural_note
  - marker: c
    text: Secara tata bahasa, orang yang mencukur rambutnya paling mungkin adalah Paulus. Namun, sebagian penafsir menganggapnya Akwila.
    reason: alternative_reading
lexical_decisions:
- source_word: προσμείνας ἡμέρας ἱκανὰς
  choice: tinggal beberapa hari lagi
  rationale: Mengungkapkan tindakan tinggal yang mendahului keberangkatan; ἔτι memberi nuansa ‘lagi’, sedangkan ἱκανὰς menunjukkan jumlah yang cukup banyak tanpa menentukan lamanya.
- source_word: τοῖς ἀδελφοῖς
  choice: saudara-saudara seiman
  rationale: Dalam konteks jemaat, ἀδελφοί merujuk pada komunitas orang percaya. Pilihan ini mempertahankan bahasa kekeluargaan sekaligus wajar dan inklusif dalam bahasa Indonesia.
- source_word: ἀποταξάμενος
  choice: berpamitan kepada
  rationale: Bentuk medial ini berarti meminta diri atau mengucapkan perpisahan; ‘berpamitan’ merupakan padanan Indonesia yang alami.
- source_word: ἐξέπλει εἰς τὴν Συρίαν
  choice: berlayar menuju Siria
  rationale: ἐκπλέω menyatakan berangkat dengan kapal, sedangkan εἰς menandai tujuan.
- source_word: καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας
  choice: Priskila dan Akwila menyertainya
  rationale: Mengungkapkan bahwa keduanya ikut bersama Paulus dengan susunan yang alami dalam bahasa Indonesia.
- source_word: κειράμενος ... τὴν κεφαλήν
  choice: mencukur rambut kepalanya
  rationale: κείρω dapat berarti memotong, memangkas, atau mencukur rambut. Dalam konteks nazar dan dengan objek ‘kepala’, ‘mencukur rambut kepalanya’ menyampaikan tindakan yang paling mungkin, sementara cakupan maknanya dijelaskan dalam catatan.
- source_word: ἐν Κεγχρεαῖς
  choice: Di Kengkrea
  rationale: Menunjukkan tempat tindakan tersebut; ‘Kengkrea’ adalah bentuk nama tempat yang wajar dalam bahasa Indonesia.
- source_word: εἶχεν γὰρ εὐχήν
  choice: karena ia sedang terikat oleh suatu nazar
  rationale: Ungkapan ἔχειν εὐχήν menunjukkan keadaan berada di bawah kewajiban suatu nazar. ‘Sedang terikat’ menyampaikan keadaan berkelanjutan tanpa menambahkan jenis nazarnya.
theological_decisions:
- issue: Pelaku tindakan κειράμενος (‘mencukur/memotong rambut’)
  choice: Kata ganti ‘ia’ merujuk kepada Paulus.
  alternative: Sebagian penafsir menghubungkannya dengan Akwila.
  rationale: Partisip maskulin tunggal κειράμενος paling alami kembali kepada Paulus, subjek utama kalimat. Namun, karena Akwila juga maskulin tunggal dan disebut tepat sebelumnya, penafsiran alternatif dicatat tanpa dijadikan teks utama.
- issue: Jenis nazar yang dimaksud oleh εὐχή
  choice: Diterjemahkan secara umum sebagai ‘suatu nazar’.
  alternative: Nazar kenaziran atau nazar yang menyerupai nazar orang Nazir.
  rationale: Teks tidak menyebutkan jenis nazarnya. Menentukan bahwa ini nazar kenaziran akan menambahkan kekhususan yang tidak dinyatakan oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada naratif yang wajar dan bermartabat. ‘Saudara-saudara seiman’ memperjelas bahwa yang dimaksud ialah komunitas orang percaya tanpa membatasi rujukan hanya kepada laki-laki. Tanda titik koma mempertahankan aliran satu kalimat Yunani sambil menjaga keterbacaan.
