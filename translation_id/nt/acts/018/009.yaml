  text: εἶπεν δὲ ὁ κύριος ⸂ἐν νυκτὶ δι’ ὁράματος⸃ τῷ Παύλῳ· Μὴ φοβοῦ, ἀλλὰ λάλει καὶ μὴ σιωπήσῃς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/009.yaml
  text: And the Lord said to Paul in the night through a vision[a], “Do not be afraid, but keep speaking and do not be silent,”
translation:
  language: id
  text: Pada malam hari, Tuhan berkata kepada Paulus melalui suatu penglihatan[a], “Jangan takut, tetapi teruslah berbicara dan jangan diam.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam suatu penglihatan.” Secara harfiah, frasa Yunani berbunyi “melalui suatu penglihatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Dengan artikel tertentu dan dalam konteks penyataan kepada Paulus, gelar ini paling wajar merujuk kepada Tuhan yang bangkit; terjemahan mempertahankan gelarnya tanpa menambahkan nama Yesus.
- source_word: ἐν νυκτὶ
  choice: pada malam hari
  rationale: Frasa ini menyatakan waktu. Bentuk ini alami dalam bahasa Indonesia modern dan tetap jelas.
- source_word: δι’ ὁράματος
  choice: melalui suatu penglihatan
  rationale: διά dengan bentuk genitif menyatakan sarana atau perantaraan; “melalui” mempertahankan nuansa itu, sedangkan “dalam suatu penglihatan” tetap mungkin sebagai ungkapan yang lebih idiomatis.
- source_word: Μὴ φοβοῦ
  choice: Jangan takut
  rationale: Larangan ini diterjemahkan dengan ungkapan Indonesia yang langsung, alami, dan sepadan.
- source_word: ἀλλὰ λάλει
  choice: Teruslah berbicara
  rationale: Imperatif kini λάλει mengandung aspek tindakan yang berlangsung atau berlanjut; “teruslah” menyampaikan daya tersebut.
- source_word: καὶ μὴ σιωπήσῃς
  choice: dan jangan diam
  rationale: Larangan aoris ini secara alami berarti agar Paulus tidak berhenti bersuara; bentuk ringkas ini mempertahankan pasangan retoris dengan perintah sebelumnya.
theological_decisions:
- issue: Rujukan gelar ὁ κύριος
  choice: Tuhan
  alternative: Tuhan Yesus
  rationale: Teks Yunani hanya menyebut ὁ κύριος. Dalam Kisah Para Rasul gelar ini lazimnya merujuk kepada Yesus, tetapi menambahkan nama “Yesus” akan memperjelas sesuatu yang tidak dinyatakan secara eksplisit di ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara aspek berkelanjutan pada λάλει dan nuansa sarana pada δι’ ὁράματος dipertahankan.
