  yaml_path: translation/nt/acts/018/011.yaml
  text: So he stayed there a year and six months, teaching the word of God among them.
translation:
  language: id
  text: Jadi, Paulus tinggal di sana selama satu tahun enam bulan sambil mengajarkan firman Allah di antara mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: tinggal di sana
  rationale: 'Secara harfiah verba ini dapat berarti “duduk”, tetapi dalam konteks naratif dengan keterangan durasi, maknanya idiomatis: menetap atau tinggal di suatu tempat selama jangka waktu tertentu.'
- source_word: δὲ
  choice: Jadi
  rationale: Partikel ini merupakan penghubung ringan. “Jadi” secara wajar mengaitkan tindakan Paulus dengan dorongan ilahi pada ayat sebelumnya tanpa memberi kesan pertentangan yang kuat.
- source_word: ἐνιαυτὸν καὶ μῆνας ἓξ
  choice: selama satu tahun enam bulan
  rationale: Frasa akusatif ini menyatakan durasi. “Selama satu tahun enam bulan” jelas dan alami dalam bahasa Indonesia modern.
- source_word: διδάσκων
  choice: sambil mengajarkan
  rationale: Partisipel kini menunjukkan kegiatan yang berlangsung bersamaan dengan masa tinggal Paulus. “Sambil mengajarkan” mempertahankan hubungan temporal tersebut.
- source_word: ἐν αὐτοῖς
  choice: di antara mereka
  rationale: Preposisi ἐν dengan pronomina datif di sini paling tepat dipahami secara lokatif-sosial, yakni bahwa Paulus mengajar di tengah komunitas itu.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: firman Allah
  rationale: Dalam Kisah Para Rasul, λόγος sering menunjuk pada berita yang berasal dari Allah dan diberitakan. “Firman Allah” mempertahankan ungkapan alkitabiah yang dikenal serta bobot teologisnya.
- source_word: subjek tersirat dalam ἐκάθισεν
  choice: Paulus
  rationale: Bahasa Yunani tidak menyebut ulang subjek, tetapi konteks langsung menunjukkan Paulus. Penyebutan namanya membuat kalimat Indonesia mandiri dan jelas.
