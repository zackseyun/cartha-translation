  text: οὗτός τε ἤρξατο παρρησιάζεσθαι ἐν τῇ συναγωγῇ· ἀκούσαντες δὲ αὐτοῦ ⸂Πρίσκιλλα καὶ Ἀκύλας⸃ προσελάβοντο αὐτὸν καὶ ἀκριβέστερον αὐτῷ ἐξέθεντο τὴν ⸂ὁδὸν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/026.yaml
  text: And he began to speak boldly in the synagogue. But when Priscilla and Aquila heard him[a], they took him aside and explained the way of God to him more accurately.
translation:
  language: id
  text: Ia mulai berbicara dengan berani di sinagoge. Namun, ketika Priskila dan Akwila mendengarnya, mereka mengajaknya ke tempat tersendiri[a] dan menjelaskan jalan Allah kepadanya dengan lebih tepat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka membawanya bersama mereka” atau “mereka menerimanya.” Kata kerja Yunani ini dapat berarti menerima seseorang maupun membawanya ke samping untuk berbicara.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός τε
  choice: Ia
  rationale: Kata tunjuk ini merujuk kembali kepada Apolos; dalam bahasa Indonesia, pronomina “ia” alami dan jelas. Partikel τέ hanya memberi hubungan ringan dengan konteks sebelumnya dan tidak perlu diterjemahkan tersendiri.
- source_word: ἤρξατο παρρησιάζεσθαι
  choice: mulai berbicara dengan berani
  rationale: ἤρξατο menyatakan permulaan tindakan, sedangkan παρρησιάζεσθαι menunjuk pada tutur kata yang terbuka, yakin, dan berani.
- source_word: ἐν τῇ συναγωγῇ
  choice: di sinagoge
  rationale: Padanan lokatif langsung; “sinagoge” merupakan istilah baku dalam bahasa Indonesia.
- source_word: ἀκούσαντες δὲ αὐτοῦ
  choice: Namun, ketika Priskila dan Akwila mendengarnya
  rationale: Partisip aoris dipahami secara temporal. δέ menandai perkembangan atau kontras ringan, sehingga diterjemahkan “Namun”.
- source_word: Πρίσκιλλα καὶ Ἀκύλας
  choice: Priskila dan Akwila
  rationale: Transliterasi Indonesia yang lazim untuk kedua nama tersebut, dengan urutan nama mengikuti teks Yunani.
- source_word: προσελάβοντο αὐτὸν
  choice: mereka mengajaknya berbicara secara pribadi
  rationale: Kata kerja ini dapat berarti menerima, mengajak serta, atau membawa seseorang ke samping. Dalam konteks penjelasan lanjutan, pilihan ini menyampaikan percakapan pribadi tanpa menyiratkan kecaman publik; ambiguitas leksikal dicatat dalam catatan kaki.
- source_word: ἐξέθεντο
  choice: menjelaskan
  rationale: Dalam bentuk medium di sini, kata ini berarti memaparkan atau menjelaskan; “menjelaskan” jelas dan alami dalam bahasa Indonesia modern.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: jalan Allah
  rationale: Mempertahankan ungkapan sumber yang dapat menunjuk pada jalan atau ajaran Allah tanpa mempersempitnya menjadi rumusan doktrinal tertentu.
- source_word: ἀκριβέστερον
  choice: dengan lebih tepat
  rationale: Adverbia komparatif ini menyatakan tingkat ketepatan atau kecermatan yang lebih tinggi daripada pemahaman sebelumnya.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Dativus ini berfungsi sebagai objek tak langsung dari tindakan menjelaskan.
theological_decisions:
- issue: Sifat tindakan Priskila dan Akwila terhadap Apolos
  choice: mengajaknya berbicara secara pribadi untuk memberi penjelasan yang lebih tepat
  alternative: menerimanya atau mengajaknya bersama mereka
  rationale: Konteks berikutnya mendukung percakapan pribadi yang membina, tetapi verba Yunani juga dapat menekankan penerimaan atau tindakan mengajak serta. Catatan kaki mempertahankan kemungkinan tersebut dan teks tidak menyiratkan teguran publik atau struktur kewenangan tertentu.
- issue: Makna “jalan Allah”
  choice: mempertahankan ungkapan luas “jalan Allah”
  alternative: menjelaskannya secara eksplisit sebagai iman Kristen sepenuhnya atau hanya jalan moral Allah
  rationale: Dalam konteks Kisah Para Rasul, ungkapan ini kemungkinan mengacu pada berita dan kehidupan yang berpusat pada karya penyelamatan Allah, tetapi teks tidak merincinya di ayat ini. Terjemahan mempertahankan keluasan dan ketegangan ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Ia” dipakai untuk rujukan naratif kepada Apolos; “berbicara dengan berani” mempertahankan nuansa keterbukaan dan keyakinan. Frasa “mengajaknya berbicara secara pribadi” dipilih agar alur mudah dipahami, sedangkan keluasan makna verba Yunani tetap disajikan dalam catatan kaki.
