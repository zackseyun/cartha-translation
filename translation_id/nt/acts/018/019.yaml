id: ACT.18.19
reference: Acts 18:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀κατήντησαν δὲ εἰς Ἔφεσον, κἀκείνους κατέλιπεν αὐτοῦ, αὐτὸς δὲ εἰσελθὼν εἰς τὴν συναγωγὴν ⸀διελέξατο τοῖς Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/019.yaml
  text: They came to Ephesus[a], and he left them there[c][b]; but he himself entered into the synagogue and reasoned with the Jews.
translation:
  language: id
  text: Mereka tiba di Efesus[a]. Ia meninggalkan mereka di sana[b], tetapi ia sendiri masuk ke sinagoge dan berdialog dengan orang-orang Yahudi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sampai di Efesus.”
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah rekan-rekannya, yaitu Priskila dan Akwila yang disebut pada ayat sebelumnya.
    reason: cross_reference
  - marker: c
    text: Atau “berdiskusi dengan” atau “bertukar pikiran dengan.” Kata Yunaninya menunjukkan percakapan yang melibatkan penalaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατήντησαν
  choice: tiba
  rationale: Kata kerja ini menyatakan sampainya seseorang di suatu tujuan. “Tiba di Efesus” alami dalam bahasa Indonesia dan tepat bagi alur perjalanan.
- source_word: δὲ
  choice: (tidak diterjemahkan) / tetapi
  rationale: Kemunculan pertama berfungsi sebagai penghubung naratif ringan dan tidak perlu dinyatakan secara eksplisit setelah kalimat sebelumnya; kemunculan kedua menandai kontras dan diterjemahkan “tetapi”.
- source_word: κἀκείνους
  choice: mereka
  rationale: Bentuk ini berarti “dan mereka itu” serta merujuk kepada rekan-rekan yang disebut pada ayat sebelumnya. Pronomina “mereka” mempertahankan rujukan kontekstual tanpa memasukkan nama ke dalam teks ayat.
- source_word: κατέλιπεν
  choice: meninggalkan
  rationale: Kata ini berarti meninggalkan seseorang di suatu tempat. Bersama αὐτοῦ, frasa “meninggalkan mereka di sana” menyampaikan maknanya dengan wajar.
- source_word: αὐτοῦ
  choice: di sana
  rationale: Bentuk ini dipakai secara adverbial untuk menunjukkan tempat, yaitu Efesus.
- source_word: αὐτὸς
  choice: ia sendiri
  rationale: Pronomina ini bersifat emfatis dan mengontraskan tindakan tokoh utama dengan rekan-rekannya yang ditinggalkan.
- source_word: εἰσελθὼν
  choice: masuk
  rationale: Partisip ini memberi tindakan pendahuluan yang berkaitan erat dengan verba utama; susunan Indonesia “masuk ... dan berdialog” menyatakannya secara alami.
- source_word: συναγωγήν
  choice: sinagoge
  rationale: Dalam konteks Yahudi ini, kata tersebut merujuk pada tempat pertemuan dan ibadah Yahudi. “Sinagoge” adalah istilah Indonesia modern yang tepat.
- source_word: διελέξατο
  choice: berdialog dengan
  rationale: διαλέγομαι di sini menunjuk pada percakapan atau pembahasan yang melibatkan penalaran. “Berdialog dengan” mempertahankan sifat timbal baliknya tanpa memberi kesan pertengkaran.
- source_word: τοῖς Ἰουδαίοις
  choice: orang-orang Yahudi
  rationale: Ini merupakan sebutan etnis-keagamaan umum dalam Kisah Para Rasul. Bentuk jamak eksplisit alami dan tidak mempersempit rujukannya hanya kepada para pemimpin.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Sinagoge” dipilih sebagai istilah umum masa kini. Struktur kalimat mempertahankan penekanan pada “ia sendiri” serta kontras antara tokoh utama dan rekan-rekannya.
