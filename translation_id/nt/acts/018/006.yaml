  to: Namun, ketika mereka menentang dan menghujat[a], Paulus mengibaskan pakaiannya lalu berkata kepada mereka, “Darah kalian ada di atas kepala kalian sendiri![b] Aku tidak bersalah. Mulai sekarang aku akan pergi kepada bangsa-bangsa lain.[c]”
