  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀντιτασσομένων δὲ αὐτῶν καὶ βλασφημούντων ἐκτιναξάμενος τὰ ἱμάτια εἶπεν πρὸς αὐτούς· Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν· καθαρὸς ἐγώ· ἀπὸ τοῦ νῦν εἰς τὰ ἔθνη πορεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/006.yaml
  text: But when they opposed and reviled him, he shook out his garments and said to them, “Your blood be on your own heads. I am innocent. From now on I will go to the Gentiles.”
translation:
  language: id
  text: Namun, ketika mereka menentang dan menghujat[a], Paulus mengibaskan pakaiannya lalu berkata kepada mereka, “Darah kalian ada di atas kepala kalian sendiri![b] Aku tidak bersalah. Mulai sekarang aku akan pergi kepada bangsa-bangsa lain.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ini juga dapat berarti “berkata-kata menghina” atau “mencaci.” Teks tidak menyebutkan secara eksplisit siapa atau apa yang menjadi sasaran perkataan itu.
    reason: lexical_alternative
  - marker: b
    text: “Darah kalian ada di atas kepala kalian sendiri” adalah ungkapan yang berarti bahwa tanggung jawab atas akibatnya berada pada mereka sendiri.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “kepada bangsa-bangsa”; dalam konteks ini maksudnya bangsa-bangsa bukan Yahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιτασσομένων
  choice: menentang
  rationale: Partisip ini menyatakan perlawanan aktif terhadap Paulus dan pemberitaannya; “menentang” ringkas, alami, dan mempertahankan daya adversatifnya.
- source_word: βλασφημούντων
  choice: menghujat
  rationale: Kata Yunani ini dapat menunjuk pada penghujatan atau perkataan yang sangat menghina. “Menghujat” mempertahankan keluasan dan bobot istilah tanpa menambahkan objek yang tidak dinyatakan dalam teks.
- source_word: ἐκτιναξάμενος τὰ ἱμάτια
  choice: mengebaskan pakaiannya
  rationale: Ungkapan ini menggambarkan tindakan simbolis melepaskan diri dari tanggung jawab; “mengebaskan pakaiannya” dekat dengan bentuk Yunani dan wajar dalam bahasa Indonesia.
- source_word: Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν
  choice: Darahmu tertanggung atas kepalamu sendiri
  rationale: Terjemahan ini mempertahankan idiom tanggung jawab dan nada pernyataan yang khidmat. Bentuk Indonesia memakai kata ganti kolektif secara alami, sedangkan maknanya tetap ditujukan kepada para pendengar.
- source_word: καθαρὸς ἐγώ
  choice: Aku tidak bersalah
  rationale: Adjektiva “bersih” digunakan secara metaforis untuk bebas dari kesalahan atau tanggung jawab; “tidak bersalah” menyampaikan maksud itu dengan jelas.
- source_word: ἀπὸ τοῦ νῦν
  choice: Mulai sekarang
  rationale: Frasa ini menandai peralihan tegas dalam arah pelayanan Paulus dan diterjemahkan dengan ungkapan Indonesia yang alami.
- source_word: εἰς τὰ ἔθνη
  choice: kepada bangsa-bangsa lain
  rationale: Dalam konteks kontras dengan para pendengar di rumah ibadat, frasa ini menunjuk kepada bangsa-bangsa bukan Yahudi. Pilihan ini alami dan tetap mempertahankan nuansa harfiah “bangsa-bangsa.”
- source_word: πορεύσομαι
  choice: aku akan pergi
  rationale: Bentuk futurum menyatakan gerak dan niat Paulus; “akan pergi” adalah padanan langsung dan alami.
theological_decisions:
- issue: Rumus tanggung jawab dalam “Darahmu tertanggung atas kepalamu sendiri”
  choice: Pernyataan bahwa tanggung jawab atas akibat penolakan mereka berada pada diri mereka, bukan pada Paulus.
  alternative: Rumus kutukan dengan daya imprekasi yang lebih kuat.
  rationale: Ungkapan ini menggemakan bahasa alkitabiah tentang darah dan tanggung jawab setelah seorang saksi menunaikan kewajibannya. Idiom dipertahankan tanpa memperkuatnya menjadi kutukan yang tidak diwajibkan oleh konteks.
- issue: Objek βλασφημούντων
  choice: Tidak menambahkan objek eksplisit; diterjemahkan “menghujat.”
  alternative: “menghina Paulus” atau “menghujat Allah/pesan itu.”
  rationale: Teks Yunani tidak menyebut objeknya. Terjemahan mempertahankan ambiguitas apakah perkataan itu terutama diarahkan kepada Paulus, pesannya, atau bersifat menghujat secara religius.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang khidmat. “Paulus” dinyatakan untuk memperjelas subjek setelah klausa partisipial, tanpa mengubah rujukan teks. Idiom darah dipertahankan dan dijelaskan dalam catatan kaki; ambiguitas βλασφημούντων juga dipelihara.
