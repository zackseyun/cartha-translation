id: ACT.18.8
reference: Acts 18:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Κρίσπος δὲ ὁ ἀρχισυνάγωγος ἐπίστευσεν τῷ κυρίῳ σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ, καὶ πολλοὶ τῶν Κορινθίων ἀκούοντες ἐπίστευον καὶ ἐβαπτίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/008.yaml
  text: But Crispus[a], the synagogue ruler, believed in the Lord together with his whole household, and many of the Corinthians, hearing, were believing and were being baptized.
translation:
  language: id
  text: Namun, Krispus, pemimpin rumah ibadat itu, percaya kepada Tuhan bersama seluruh rumah tangganya. Banyak orang Korintus yang mendengar juga menjadi percaya dan dibaptis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan lebih idiomatis, “Banyak orang Korintus, setelah mendengar, percaya dan dibaptis.” Bentuk-bentuk Yunani menggambarkan tanggapan itu sebagai sesuatu yang sedang berlangsung atau terjadi berulang kali.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κρίσπος
  choice: Krispus
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia yang lazim untuk nama Alkitab.
- source_word: ἀρχισυνάγωγος
  choice: pemimpin rumah ibadat
  rationale: Menunjuk pejabat utama sinagoge; 'pemimpin rumah ibadat' jelas dan alami dalam bahasa Indonesia tanpa merinci struktur jabatan yang tidak dinyatakan.
- source_word: ἐπίστευσεν τῷ κυρίῳ
  choice: percaya kepada Tuhan
  rationale: Dalam bahasa Indonesia, konstruksi ini secara alami menyatakan arah atau objek kepercayaan dengan 'kepada'; gelar κύριος dipertahankan sebagai 'Tuhan' tanpa menambahkan 'Yesus'.
- source_word: σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: bersama seluruh rumah tangganya
  rationale: οἶκος di sini merujuk kepada satuan rumah tangga, bukan bangunan rumah, sedangkan ὅλῳ dipertahankan dengan 'seluruh'.
- source_word: πολλοὶ τῶν Κορινθίων
  choice: banyak orang Korintus
  rationale: Mengungkapkan secara alami bahwa banyak orang dari kalangan penduduk Korintus memberikan tanggapan.
- source_word: ἀκούοντες
  choice: yang mendengar
  rationale: Mempertahankan hubungan partisipial dan membiarkan objek yang didengar tetap tersirat sebagaimana dalam bahasa Yunani.
- source_word: ἐπίστευον
  choice: menjadi percaya
  rationale: Bentuk imperfek menggambarkan tanggapan yang berlangsung atau terjadi berulang di antara banyak orang; 'menjadi percaya' lebih alami daripada bentuk progresif yang kaku.
- source_word: ἐβαπτίζοντο
  choice: dibaptis
  rationale: Bentuk pasif dipertahankan. Nuansa proses yang berlangsung dijelaskan dalam catatan kaki karena ungkapan 'sedang dibaptis' kurang alami dalam konteks ini.
theological_decisions:
- issue: Cakupan iman seluruh rumah tangga
  choice: Frasa diterjemahkan langsung sebagai 'bersama seluruh rumah tangganya' tanpa menjelaskan cara setiap anggota beriman.
  alternative: Menegaskan bahwa setiap anggota secara pribadi percaya, atau memahami rumah tangga hanya sebagai ringkasan korporat.
  rationale: Teks Yunani tidak menguraikan mekanisme partisipasi setiap anggota; terjemahan menjaga ketegangan itu tanpa memasukkan kesimpulan denominasi mengenai iman atau baptisan seisi rumah.
- issue: Rujukan gelar κύριος
  choice: Menerjemahkannya sebagai 'Tuhan' tanpa perluasan.
  alternative: Tuhan Yesus
  rationale: Dalam konteks Kisah Para Rasul rujukannya kemungkinan adalah Yesus, tetapi teks ayat ini hanya menyebut κύριος; bentuk sumber dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Rumah ibadat' dipilih untuk συναγωγή dalam nama jabatan, sedangkan aspek imperfektif pada dua verba terakhir disampaikan melalui pilihan 'menjadi percaya' dan dijelaskan lebih lengkap dalam catatan kaki.
