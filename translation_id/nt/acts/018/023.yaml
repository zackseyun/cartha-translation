  text: καὶ ποιήσας χρόνον τινὰ ἐξῆλθεν, διερχόμενος καθεξῆς τὴν Γαλατικὴν χώραν καὶ Φρυγίαν, ⸀στηρίζων πάντας τοὺς μαθητάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/023.yaml
  text: And after spending some time there[a], he departed and traveled from place to place through the Galatian region and Phrygia, strengthening all the disciples.
translation:
  language: id
  text: Setelah tinggal beberapa waktu di sana, Paulus berangkat dan melakukan perjalanan melalui wilayah Galatia dan Frigia secara berturut-turut, sambil menguatkan semua murid.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας χρόνον τινά
  choice: setelah tinggal beberapa waktu di sana
  rationale: Ungkapan ποιέω + χρόνον berarti menghabiskan atau melewatkan waktu. Dalam bahasa Indonesia, “tinggal beberapa waktu” secara alami menyatakan bahwa Paulus menetap sementara di tempat yang disebut sebelumnya; “di sana” dipasok dari konteks.
- source_word: ἐξῆλθεν
  choice: berangkat
  rationale: Dalam konteks kisah perjalanan, verba ini menyatakan keberangkatan dari suatu tempat, bukan sekadar tindakan harfiah keluar.
- source_word: διερχόμενος
  choice: menjelajahi
  rationale: Partisip ini menggambarkan perjalanan berkelanjutan melintasi beberapa daerah. “Menjelajahi” menyampaikan gerak melalui wilayah-wilayah itu dengan wajar, tanpa menyiratkan bahwa ia hanya lewat sepintas.
- source_word: καθεξῆς
  choice: dari satu tempat ke tempat berikutnya
  rationale: Kata ini menunjukkan pergerakan secara berurutan. Pilihan ini mempertahankan unsur kesinambungan rute dengan bahasa Indonesia yang jelas.
- source_word: τὴν Γαλατικὴν χώραν
  choice: wilayah Galatia
  rationale: χώρα menunjuk pada daerah atau wilayah yang lebih luas; terjemahan ini tidak membatasi rujukannya secara teknis hanya kepada provinsi Romawi.
- source_word: καὶ Φρυγίαν
  choice: dan Frigia
  rationale: Nama tempat ditransliterasikan sesuai bentuk Indonesia. Kata “wilayah” secara makna dapat dipahami menaungi kedua nama geografis tersebut.
- source_word: στηρίζων
  choice: sambil menguatkan
  rationale: στηρίζω berarti menguatkan, meneguhkan, atau membuat teguh. “Menguatkan” mempertahankan cakupan luas pelayanan Paulus tanpa mempersempitnya menjadi pengajaran atau penghiburan saja.
- source_word: πάντας τοὺς μαθητάς
  choice: semua murid
  rationale: μαθηταί adalah sebutan lazim bagi para pengikut Yesus dalam Kisah Para Rasul, dan πάντας dinyatakan dengan “semua”.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan corak naratif yang alami dan bermartabat. Subjek “Paulus” dinyatakan agar rujukan pronominal jelas dalam ayat yang berdiri sendiri. Tidak ada catatan kaki karena alternatif dalam English POB tampaknya salah ditempatkan: isinya menjelaskan καθεξῆς, sedangkan penandanya muncul setelah “there”; makna berurutan sudah dinyatakan langsung dalam teks Indonesia.'
