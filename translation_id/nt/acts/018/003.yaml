  yaml_path: translation/nt/acts/018/003.yaml
  text: And because he was of the same trade[a], he stayed with them and worked, for they were tentmakers by trade.
translation:
  language: id
  text: Karena Paulus mempunyai pekerjaan yang sama dengan mereka, ia tinggal bersama mereka dan bekerja, sebab pekerjaan mereka adalah membuat tenda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “mengerjakan kulit.” Istilah Yunani ini terutama berarti pembuat tenda, tetapi dapat juga mencakup pekerja dalam kerajinan terkait, termasuk pengolahan kulit.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ ὁμότεχνον εἶναι
  choice: Karena pekerjaannya sama dengan mereka
  rationale: Konstruksi διά dengan infinitif artikular menyatakan alasan, sedangkan ὁμότεχνος berarti memiliki keahlian atau pekerjaan yang sama. Ungkapan ini alami dalam bahasa Indonesia dan belum menyebut jenis pekerjaannya sebelum klausa berikut menjelaskannya.
- source_word: ἔμενεν παρ’ αὐτοῖς
  choice: Paulus tinggal bersama mereka
  rationale: μένω dalam konteks ini berarti tinggal atau menetap bersama Akwila dan Priskila. Nama Paulus dinyatakan agar subjek tetap jelas dalam bahasa Indonesia, sebab bentuk verba Yunani hanya menyiratkannya dari konteks.
- source_word: ἠργάζετο
  choice: bekerja
  rationale: ἐργάζομαι di sini menunjuk pada kegiatan bekerja dalam suatu kerajinan. Bentuk imperfek menggambarkan kegiatan yang berlangsung, tetapi bahasa Indonesia secara alami cukup memakai 'bekerja'.
- source_word: σκηνοποιοὶ
  choice: membuat tenda
  rationale: Arti tradisional dan paling mungkin ialah pembuat tenda. Bentuk verbal 'membuat tenda' lebih alami dalam kalimat Indonesia daripada nomina pelaku yang kurang lazim 'pembuat tenda', sementara kemungkinan arti yang lebih luas dipertahankan dalam catatan kaki.
- source_word: τῇ τέχνῃ
  choice: pekerjaan mereka adalah
  rationale: τέχνη berarti kerajinan, keahlian, atau pekerjaan. Susunan ini menyampaikan secara alami bahwa pembuatan tenda merupakan mata pencaharian mereka, bukan kegiatan sesaat.
theological_decisions: []
