id: ACT.18.27
reference: Acts 18:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: βουλομένου δὲ αὐτοῦ διελθεῖν εἰς τὴν Ἀχαΐαν προτρεψάμενοι οἱ ἀδελφοὶ ἔγραψαν τοῖς μαθηταῖς ἀποδέξασθαι αὐτόν· ὃς παραγενόμενος συνεβάλετο πολὺ τοῖς πεπιστευκόσιν διὰ τῆς χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/027.yaml
  text: And when he wanted to go across to Achaia[a], the brothers encouraged him and wrote to the disciples to welcome him. When he arrived[b], he greatly helped those who had believed through grace.
translation:
  language: id
  text: Ketika Apolos ingin menyeberang ke Akhaya, saudara-saudara[a] mendorongnya dan menulis kepada murid-murid supaya menyambutnya. Ketika ia tiba, ia sangat menolong orang-orang yang telah percaya melalui anugerah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “saudara-saudara” berbentuk maskulin, tetapi dalam pemakaian komunitas Kristen dapat merujuk kepada kelompok orang percaya yang lebih luas, termasuk perempuan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “melalui anugerah ia sangat menolong orang-orang yang telah percaya.” Frasa Yunani “melalui anugerah” dapat dikaitkan dengan pertolongan Apolos, bukan dengan tindakan mereka percaya.
    reason: alternative_reading
lexical_decisions:
- source_word: βουλομένου δὲ αὐτοῦ
  choice: Ketika Apolos ingin
  rationale: Konstruksi genitivus absolutus menyatakan keadaan yang berkaitan dengan niat Apolos. Nama Apolos disebut agar rujukan pronomina jelas dalam bahasa Indonesia.
- source_word: διελθεῖν εἰς τὴν Ἀχαΐαν
  choice: menyeberang ke Akhaya
  rationale: διέρχομαι dalam konteks perjalanan dari Efesus ke Akhaya wajar dipahami sebagai menyeberang; pilihan ini mempertahankan nuansa perjalanan tanpa menjadi kaku.
- source_word: προτρεψάμενοι
  choice: menyemangatinya
  rationale: Partisip ini menunjukkan dorongan positif dan dukungan terhadap rencana Apolos. 'Menyemangati' alami dalam bahasa Indonesia modern dan tidak sekeras 'mendesak'.
- source_word: οἱ ἀδελφοὶ
  choice: saudara-saudara seiman
  rationale: Ungkapan ini mempertahankan metafora kekerabatan komunitas Kristen sekaligus menjelaskan bahwa yang dimaksud adalah sesama orang percaya; kemungkinan cakupannya yang lebih luas dicatat dalam catatan kaki.
- source_word: ἔγραψαν τοῖς μαθηταῖς
  choice: menulis surat kepada murid-murid di sana
  rationale: γράπω dengan datif berarti menulis kepada. 'Surat' tersirat oleh tindakan menulis kepada pihak yang jauh, sedangkan 'di sana' memperjelas bahwa para murid berada di Akhaya tanpa mengubah isi.
- source_word: ἀποδέξασθαι αὐτόν
  choice: supaya menyambut dia
  rationale: ἀποδέχομαι di sini menyatakan penerimaan yang ramah; 'menyambut' lebih idiomatis daripada 'menerima' dalam konteks kedatangan seorang rekan pelayanan.
- source_word: ὃς παραγενόμενος
  choice: Setibanya di sana, ia
  rationale: Ungkapan ini secara alami menyampaikan hubungan waktu dari pronomina relatif dan partisip, sambil mempertahankan Apolos sebagai subjek.
- source_word: συνεβάλετο πολὺ
  choice: sangat menolong
  rationale: Bentuk tengah συμβάλλω dalam konteks ini berarti memberi banyak bantuan atau manfaat. 'Sangat menolong' jelas, alami, dan sesuai dengan datif orang-orang yang ditolong.
- source_word: τοῖς πεπιστευκόσιν
  choice: orang-orang yang ... telah percaya
  rationale: Partisip perfek menyatakan bahwa mereka telah sampai pada iman dan tetap berada dalam keadaan sebagai orang percaya; 'telah percaya' mempertahankan aspek tersebut.
- source_word: διὰ τῆς χάριτος
  choice: oleh anugerah
  rationale: διά dengan genitif menyatakan sarana atau perantaraan. 'Oleh anugerah' ringkas dan tidak menambahkan 'Allah', yang tidak tersurat dalam teks Yunani.
theological_decisions:
- issue: Keterkaitan frasa διὰ τῆς χάριτος
  choice: 'Dihubungkan dengan ''telah percaya'': ''orang-orang yang oleh anugerah telah percaya.'''
  alternative: 'Dihubungkan dengan pertolongan Apolos: ''oleh anugerah ia sangat menolong orang-orang yang telah percaya.'''
  rationale: Urutan kata dan konteks mendukung hubungan frasa itu dengan tindakan percaya, tetapi secara sintaksis frasa tersebut juga mungkin menerangkan pertolongan Apolos. Bacaan utama memakai hubungan yang lebih mungkin, sementara ambiguitas asli dipertahankan dalam catatan kaki.
- issue: Cakupan οἱ ἀδελφοὶ
  choice: Diterjemahkan 'saudara-saudara seiman' dengan bentuk gramatikal maskulin tetap tercermin.
  alternative: Dipahami sebagai seluruh komunitas orang percaya, termasuk perempuan.
  rationale: Bahasa Yunani memakai bentuk maskulin jamak, tetapi dalam pemakaian komunitas Kristen bentuk itu dapat mencakup kelompok yang lebih luas. Catatan kaki menjaga kemungkinan tersebut tanpa menentukannya secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama geografis memakai bentuk Indonesia yang lazim, 'Akhaya'. Struktur kalimat dibuat alami bagi pembaca umum, sementara ambiguitas teologis pada διὰ τῆς χάριτος dipertahankan melalui catatan kaki.
