  to: Ketika Apolos ingin menyeberang ke Akhaya, saudara-saudara[a] mendorongnya dan menulis kepada murid-murid supaya menyambutnya. Ketika ia tiba, ia sangat menolong orang-orang yang telah percaya melalui anugerah.[b]
