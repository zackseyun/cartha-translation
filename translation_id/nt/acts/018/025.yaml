id: ACT.18.25
reference: Acts 18:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτος ἦν κατηχημένος τὴν ὁδὸν τοῦ κυρίου, καὶ ζέων τῷ πνεύματι ἐλάλει καὶ ἐδίδασκεν ἀκριβῶς τὰ περὶ τοῦ ⸀Ἰησοῦ, ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/025.yaml
  text: This man had been instructed in the way of the Lord[a], and being fervent in spirit, he was speaking and teaching accurately the things concerning Jesus, knowing only the baptism of John.
translation:
  language: id
  text: Orang ini telah menerima pengajaran tentang jalan Tuhan. Ia berkobar-kobar dalam roh[a] dan berbicara serta mengajar dengan tepat tentang Yesus, meskipun ia hanya mengenal baptisan Yohanes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berkobar-kobar dalam Roh,” jika yang dimaksud adalah Roh Kudus, bukan roh Apolos sendiri.
    reason: alternative_reading
lexical_decisions:
- source_word: κατηχημένος
  choice: telah menerima pengajaran
  rationale: Bentuk partisipel perfek pasif menunjukkan pengajaran yang telah diterima dengan hasil yang berlanjut. Ungkapan ini alami dalam bahasa Indonesia dan tidak memasukkan nuansa teknis gerejawi dari istilah seperti 'dikatekisasi'.
- source_word: τὴν ὁδὸν τοῦ κυρίου
  choice: tentang jalan Tuhan
  rationale: Mempertahankan idiom Kristen awal 'jalan' dan menerjemahkan κύριος sebagai 'Tuhan'; preposisi 'tentang' diperlukan secara alami setelah 'menerima pengajaran'.
- source_word: ζέων τῷ πνεύματι
  choice: dengan semangat yang menyala-nyala
  rationale: ζέων menyatakan gairah yang mendidih atau berkobar. 'Semangat yang menyala-nyala' menyampaikan intensitas secara wajar, sementara kemungkinan rujukan kepada Roh Kudus dipertahankan dalam catatan kaki.
- source_word: ἐλάλει καὶ ἐδίδασκεν
  choice: ia berbicara dan mengajarkan
  rationale: Kedua bentuk imperfek menggambarkan kegiatan yang berlangsung atau menjadi kebiasaan. Pilihan ini dekat dengan makna leksikal tanpa mempersempit 'berbicara' menjadi 'memberitakan'.
- source_word: ἀκριβῶς
  choice: dengan tepat
  rationale: Menyatakan ketepatan atau kecermatan isi pengajarannya dan tetap alami dalam bahasa Indonesia.
- source_word: τὰ περὶ τοῦ Ἰησοῦ
  choice: hal-hal mengenai Yesus
  rationale: Mempertahankan cakupan luas frasa Yunani tanpa menentukan secara lebih sempit isi yang dimaksud.
- source_word: ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου
  choice: meskipun ia hanya mengenal baptisan Yohanes
  rationale: Partisipel ini menyatakan keadaan yang berbarengan dan, dalam konteks, memiliki nuansa konsesif terhadap ketepatan pengajarannya. 'Mengenal' cocok untuk pengetahuan yang dimilikinya, sedangkan 'baptisan Yohanes' ringkas dan jelas.
theological_decisions:
- issue: Makna τῷ πνεύματι dalam ζέων τῷ πνεύματι
  choice: semangat batin Apolos
  alternative: Roh Kudus
  rationale: Frasa Yunani dapat menunjuk pada semangat batin Apolos atau pada Roh Kudus. Teks utama memakai ungkapan idiomatis 'semangat yang menyala-nyala', sedangkan kemungkinan rujukan kepada Roh Kudus dicantumkan dalam catatan kaki agar ketegangan teologis tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Struktur dibuat lancar bagi pembaca umum sambil mempertahankan idiom 'jalan Tuhan', ketepatan pengajaran Apolos, keterbatasan pengetahuannya, serta ambiguitas πνεῦμα.
