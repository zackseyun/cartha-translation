  naturalness: Teks revisi memakai bahasa Indonesia baku modern yang lancar. “Berbicara dan mengajar dengan tepat tentang Yesus” lebih idiomatis daripada “mengajarkan dengan tepat hal-hal mengenai Yesus,” tanpa mempersempit objek pengajaran secara berarti.
  terminology: “Jalan Tuhan,” “Roh,” “Yesus,” dan “baptisan Yohanes” dipertahankan. Huruf kecil pada “roh” di teks utama tidak memutuskan apakah yang dimaksud roh Apolos atau Roh Kudus; alternatif kapitalisasi dijelaskan dalam catatan kaki.
