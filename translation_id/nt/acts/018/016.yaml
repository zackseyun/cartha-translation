  text: καὶ ἀπήλασεν αὐτοὺς ἀπὸ τοῦ βήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/016.yaml
  text: And he drove them away from the judgment seat[a].
translation:
  language: id
  text: Lalu ia mengusir mereka dari kursi pengadilan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tribunal” atau “mimbar pengadilan”; kata Yunani βῆμα merujuk pada kursi resmi hakim atau panggung tempat persidangan berlangsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Dalam alur narasi ini, καί menghubungkan tindakan berikutnya secara berurutan; “Lalu” terdengar alami dalam bahasa Indonesia tanpa menambahkan hubungan sebab-akibat.
- source_word: ἀπήλασεν
  choice: mengusir
  rationale: Bentuk aoris dari ἀπελαύνω menyatakan tindakan menyuruh pergi dengan tegas atau memaksa menjauh; “mengusir” mempertahankan kekuatan tindakan resmi tersebut.
- source_word: αὐτοὺς
  choice: mereka
  rationale: Pronomina ini merujuk kepada pihak yang berada di hadapan Galio; “mereka” mempertahankan rujukan kontekstual tanpa memperjelasnya secara berlebihan.
- source_word: ἀπὸ τοῦ βήματος
  choice: dari kursi pengadilan
  rationale: Frasa ini menyatakan bahwa mereka disingkirkan dari tempat berlangsungnya sidang resmi. “Kursi pengadilan” mempertahankan gambaran βῆμα sebagai tempat duduk atau panggung pejabat yang menjalankan pengadilan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan naratif. Kata “mengusir” mempertahankan ketegasan tindakan, sedangkan catatan kaki menjelaskan cakupan institusional dan fisik dari βῆμα.
