  text: μέλλοντος δὲ τοῦ Παύλου ἀνοίγειν τὸ στόμα εἶπεν ὁ Γαλλίων πρὸς τοὺς Ἰουδαίους· Εἰ ⸀μὲν ἦν ἀδίκημά τι ἢ ῥᾳδιούργημα πονηρόν, ὦ Ἰουδαῖοι, κατὰ λόγον ἂν ἀνεσχόμην ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/014.yaml
  text: But as Paul was about to open his mouth[a], Gallio said to the Jews, “If it were some wrongdoing or a serious crime, O Jews[c][b], I would reasonably put up with you.
translation:
  language: id
  text: Namun, ketika Paulus hendak membuka mulutnya[a], Galio berkata kepada orang-orang Yahudi, “Jika ini suatu pelanggaran atau suatu kejahatan yang serius, hai orang-orang Yahudi, sudah sewajarnya aku bersabar terhadap kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika Paulus hendak berbicara.” Bahasa Yunani secara harfiah memakai ungkapan “membuka mulut” untuk mulai berbicara.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “sudah sewajarnya aku menanggung kalian.” Dalam konteks ini, Galio menyatakan bahwa ia akan bersabar terhadap mereka apabila perkara itu benar-benar menyangkut pelanggaran atau kejahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλοντος ... τοῦ Παύλου ἀνοίγειν τὸ στόμα
  choice: ketika Paulus baru saja hendak membuka mulutnya
  rationale: Konstruksi genitif absolut dengan μέλλω + infinitif menyatakan tindakan yang segera akan terjadi. Ungkapan ‘membuka mulut’ mempertahankan idiom Yunani yang juga dapat dipahami secara alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: 'Menandai peralihan naratif dengan kontras ringan: Paulus hendak berbicara, tetapi Galio terlebih dahulu menanggapi.'
- source_word: Γαλλίων
  choice: Galio
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: kepada orang-orang Yahudi
  rationale: Menerjemahkan arah ujaran secara langsung tanpa menambahkan keterangan interpretatif seperti ‘para penuduh’.
- source_word: Εἰ μὲν ἦν
  choice: Jika perkara ini menyangkut
  rationale: Mengungkapkan premis bersyarat secara alami dalam konteks persidangan; ‘perkara ini’ tersirat oleh situasi, sementara μέν tidak perlu diterjemahkan secara tersendiri.
- source_word: ἀδίκημά τι
  choice: suatu pelanggaran
  rationale: ἀδίκημα menunjuk pada perbuatan salah atau pelanggaran yang dapat menjadi pokok perkara hukum.
- source_word: ῥᾳδιούργημα πονηρόν
  choice: tindak kejahatan
  rationale: Frasa ini menunjuk pada perbuatan kriminal yang jahat. ‘Tindak kejahatan’ mempertahankan nuansa hukum dan moral tanpa memakai ungkapan arkais.
- source_word: ὦ Ἰουδαῖοι
  choice: hai orang-orang Yahudi
  rationale: ‘Hai’ mempertahankan sapaan langsung dan nada retoris partikel vokatif ὦ dalam bahasa Indonesia yang tetap wajar dan bermartabat.
- source_word: κατὰ λόγον
  choice: sudah sewajarnya
  rationale: Idiom ini berarti ‘dengan alasan yang patut’ atau ‘secara masuk akal’; ‘sudah sewajarnya’ menyampaikan bahwa Galio patut menerima pengaduan semacam itu.
- source_word: ἀνεσχόμην ὑμῶν
  choice: aku mendengarkan kalian dengan sabar
  rationale: Secara harfiah dapat berarti ‘menanggung’ atau ‘bersabar terhadap kalian’. Dalam konteks pengadilan, maksudnya adalah bersedia menoleransi dan mendengarkan pengaduan mereka; terjemahan ini membuat implikasi kontekstual jelas tanpa menghilangkan nada enggan Galio.
