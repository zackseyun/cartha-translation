    rationale: Terjemahan ini memasukkan objek dan tindakan ‘mendengarkan’ dari konteks pengadilan. Kata kerja sumber secara langsung berarti bersabar terhadap atau menanggung mereka; implikasi bahwa Galio akan mendengarkan perkara itu dapat dijelaskan dalam catatan kaki, bukan dijadikan terjemahan utama.
