translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif dan yudisial. Sapaan ‘hai’ mempertahankan retorika teks sumber; ‘aku’ sesuai dengan ujaran langsung seorang pejabat dan praktik umum terjemahan Alkitab Indonesia. Idiom sumber dipertahankan dalam teks utama dan dijelaskan melalui catatan kaki.
