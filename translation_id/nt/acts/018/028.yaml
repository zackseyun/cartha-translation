source:
  edition: SBLGNT
  text: εὐτόνως γὰρ τοῖς Ἰουδαίοις διακατηλέγχετο δημοσίᾳ ἐπιδεικνὺς διὰ τῶν γραφῶν εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/028.yaml
  text: For he powerfully refuted the Jews in public[b][a], demonstrating through the Scriptures that Jesus is the Messiah.
translation:
  language: id
  text: Sebab ia dengan kuat membantah orang-orang Yahudi di depan umum sambil membuktikan melalui Kitab Suci bahwa Yesus adalah Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mesias itu adalah Yesus.” Klausa infinitif Yunani dapat diungkapkan dengan kedua urutan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐτόνως
  choice: dengan penuh kekuatan
  rationale: Mengungkapkan intensitas sekaligus daya persuasif pembantahan Apolos dengan bahasa Indonesia yang wajar.
- source_word: διακατηλέγχετο
  choice: membantah
  rationale: Kata ini menunjuk pada tindakan menyanggah secara tuntas atau membuktikan pihak lawan keliru; konteks dan keterangan cara menyampaikan kekuatan argumentatifnya.
- source_word: τοῖς Ἰουδαίοις
  choice: orang-orang Yahudi
  rationale: Padanan langsung bagi kelompok lawan bicara Yahudi dalam konteks ini, tanpa memperluas acuannya kepada semua orang Yahudi.
- source_word: δημοσίᾳ
  choice: di depan umum
  rationale: Menyatakan bahwa pembantahan berlangsung secara terbuka di hadapan publik.
- source_word: ἐπιδεικνὺς
  choice: menunjukkan
  rationale: Menyampaikan tindakan memperlihatkan atau mendemonstrasikan suatu kesimpulan berdasarkan bukti.
- source_word: διὰ τῶν γραφῶν
  choice: melalui Kitab Suci
  rationale: 'διά dengan genitif menyatakan sarana: Kitab Suci menjadi dasar dan sarana pembuktiannya.'
- source_word: τὸν χριστὸν
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar bagi Yang Diurapi yang dijanjikan, sehingga 'Mesias' paling jelas mempertahankan latar Yahudi-kitab suci.
- source_word: Ἰησοῦν
  choice: Yesus
  rationale: Bentuk baku nama Ἰησοῦς dalam bahasa Indonesia.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: bahwa Yesus adalah Mesias
  rationale: Susunan ini alami dalam bahasa Indonesia, sambil mempertahankan alternatif sintaksis Yunani dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam proposisi ini istilah tersebut berfungsi sebagai gelar yang identitasnya dibuktikan dari Kitab Suci, bukan sekadar unsur nama.
- issue: Susunan klausa infinitif εἶναι τὸν χριστὸν Ἰησοῦν
  choice: Yesus adalah Mesias
  alternative: Mesias itu adalah Yesus
  rationale: Bahasa Yunani memungkinkan kedua representasi; teks utama memakai susunan Indonesia yang paling alami, sedangkan ambiguitas yang nyata dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Di depan umum' dipilih sebagai ungkapan yang alami; 'Kitab Suci' dan 'Mesias' mempertahankan konteks argumentasi berdasarkan tulisan-tulisan suci Yahudi.
