id: ACT.2.29
reference: Acts 2:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἐξὸν εἰπεῖν μετὰ παρρησίας πρὸς ὑμᾶς περὶ τοῦ πατριάρχου Δαυίδ, ὅτι καὶ ἐτελεύτησεν καὶ ἐτάφη, καὶ τὸ μνῆμα αὐτοῦ ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/029.yaml
  text: Men[a], brothers, I may speak to you with boldness about the patriarch David, that he both died and was buried, and his tomb is among us to this day.
translation:
  language: id
  text: 'Saudara-saudara[a], tentang Daud, sang bapa leluhur, saya dapat berbicara terus terang kepada kalian: ia telah mati dan dikuburkan, dan makamnya masih ada di tengah-tengah kita sampai hari ini.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Laki-laki, saudara-saudara,” yaitu sapaan resmi kepada sesama orang Israel yang berkumpul.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Saudara-saudara[a]
  rationale: Sapaan ganda Yunani secara harfiah berbentuk maskulin, tetapi dalam bahasa Indonesia penggandaan harfiah seperti 'Laki-laki, saudara-saudara' tidak wajar. 'Saudara-saudara' merupakan sapaan formal yang alami kepada orang-orang sebangsa; bentuk aslinya dijelaskan dalam catatan kaki.
- source_word: ἐξὸν εἰπεῖν
  choice: saya dapat berbicara
  rationale: Ungkapan ini menyatakan kebebasan atau kelayakan untuk berbicara, bukan sekadar kemampuan fisik. Dalam gabungan dengan μετὰ παρρησίας, terjemahan ini alami dan jelas.
- source_word: μετὰ παρρησίας
  choice: terus terang
  rationale: παρρησία menunjuk pada keterbukaan dan keberanian berbicara tanpa berbelit-belit. 'Terus terang' menangkap keterusterangan itu secara alami dalam bahasa Indonesia.
- source_word: περὶ τοῦ πατριάρχου Δαυίδ
  choice: tentang Daud, sang bapa leluhur
  rationale: '''Bapa leluhur'' lebih mudah dipahami pembaca umum daripada serapan ''patriark'', sedangkan ''sang'' menandai gelar atau kedudukan Daud tanpa menambahkan kata ''kita'' yang tidak terdapat dalam teks.'
- source_word: καὶ ἐτελεύτησεν καὶ ἐτάφη
  choice: ia telah mati dan dikuburkan
  rationale: Kedua καί menegaskan kedua fakta tersebut. Bahasa Indonesia tidak memerlukan padanan kaku 'baik ... maupun' agar penekanannya tetap jelas.
- source_word: τὸ μνῆμα αὐτοῦ
  choice: makamnya
  rationale: μνῆμα di sini adalah tempat pemakaman yang dikenal dan masih dapat ditunjuk; 'makam' merupakan padanan Indonesia yang alami.
- source_word: ἔστιν ἐν ἡμῖν
  choice: masih ada di tengah-tengah kita
  rationale: Frasa ini menyatakan keberadaan makam itu di lingkungan komunitas atau tempat para pendengar. 'Masih ada' juga menyatu alami dengan keterangan waktu berikutnya.
- source_word: ἄχρι τῆς ἡμέρας ταύτης
  choice: sampai hari ini
  rationale: Padanan idiomatis yang mempertahankan makna keberlanjutan hingga waktu Petrus berbicara.
theological_decisions:
- issue: Cakupan dan bentuk sapaan Ἄνδρες ἀδελφοί
  choice: Saudara-saudara[a]
  alternative: Laki-laki, saudara-saudara; Saudara-saudara sekalian
  rationale: Teks Yunani memakai dua vokatif maskulin secara berurutan. Terjemahan utama mengutamakan sapaan Indonesia yang wajar tanpa memperluasnya secara eksplisit menjadi 'saudara-saudari'; catatan kaki mempertahankan informasi bentuk asli dan kemungkinan nuansa sapaan kepada sesama orang Israel.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat diatur agar hubungan 'tentang Daud ... berbicara terus terang' jelas, sementara fakta kematian, penguburan, dan keberadaan makam tetap tegas. Semua penanda catatan kaki muncul dalam teks utama.
