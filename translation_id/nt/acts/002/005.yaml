id: ACT.2.5
reference: Acts 2:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ⸀ἐν Ἰερουσαλὴμ κατοικοῦντες Ἰουδαῖοι, ἄνδρες εὐλαβεῖς ἀπὸ παντὸς ἔθνους τῶν ὑπὸ τὸν οὐρανόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/005.yaml
  text: There were Jews living in Jerusalem[b][a], devout men from every nation under heaven.
translation:
  language: id
  text: Di Yerusalem tinggal orang-orang Yahudi[a], laki-laki yang saleh, yang berasal dari setiap bangsa di bawah langit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Yudea”. Di sini konteks lebih mendukung arti etnis-keagamaan yang lebih luas karena mereka dikatakan berasal dari setiap bangsa di bawah langit.
    reason: alternative_reading
  - marker: b
    text: Ungkapan “di bawah langit” adalah idiom Alkitab yang berarti di seluruh dunia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: tinggallah
  rationale: δέ adalah penghubung ringan yang melanjutkan narasi; tidak perlu diterjemahkan dengan penanda waktu eksplisit. Konstruksi inversi dengan 'tinggallah' menyampaikan keberadaan sekaligus keadaan menetap secara alami.
- source_word: ἐν Ἰερουσαλὴμ
  choice: Di Yerusalem
  rationale: Frasa lokatif langsung dengan bentuk baku nama tempat dalam bahasa Indonesia.
- source_word: κατοικοῦντες
  choice: tinggallah
  rationale: Partisip ini menunjukkan tinggal atau menetap di suatu tempat, bukan sekadar singgah sementara.
- source_word: Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Konteks orang-orang yang berasal dari berbagai bangsa mendukung pengertian etnis-keagamaan yang luas, bukan hanya penduduk wilayah Yudea.
- source_word: ἄνδρες
  choice: orang-orang
  rationale: Dalam aposisi ini kata tersebut menunjuk para lelaki yang baru disebut, tetapi pengulangan 'laki-laki' akan terasa kaku dalam bahasa Indonesia. 'Orang-orang' mempertahankan rujukan personal tanpa mengubah kelompok acuannya.
- source_word: εὐλαβεῖς
  choice: saleh
  rationale: Menyatakan sikap hormat dan kesungguhan dalam ibadah kepada Allah; 'saleh' alami, jelas, dan bermartabat dalam bahasa Indonesia.
- source_word: ἀπὸ παντὸς ἔθνους
  choice: yang berasal dari setiap bangsa
  rationale: Mengungkapkan asal geografis-etnis secara wajar dan mempertahankan cakupan distributif παντός.
- source_word: τῶν ὑπὸ τὸν οὐρανόν
  choice: di bawah langit
  rationale: Mempertahankan idiom Alkitabiah yang menunjuk seluruh dunia yang dikenal, dengan penjelasan dalam catatan kaki.
theological_decisions:
- issue: Makna Ἰουδαῖοι
  choice: orang-orang Yahudi
  alternative: orang-orang Yudea
  rationale: Keterangan bahwa mereka berasal dari setiap bangsa menunjukkan orang Yahudi diaspora, sehingga makna etnis-keagamaan lebih sesuai daripada makna regional semata.
- issue: Pengungkapan ἄνδρες yang maskulin
  choice: orang-orang dalam aposisi yang tetap merujuk kepada orang-orang Yahudi yang disebut
  alternative: laki-laki
  rationale: Bahasa sumber memakai nomina maskulin. Namun, dalam susunan Indonesia, 'yaitu orang-orang saleh' secara alami menerangkan kelompok yang sama; menerjemahkan 'laki-laki' secara eksplisit akan menimbulkan kekakuan. Nuansa leksikal dicatat tanpa memperluas acuan menjadi kelompok baru.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Inversi 'Di Yerusalem tinggallah' menjaga alur naratif dan menyatukan makna keberadaan dengan κατοικοῦντες. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
