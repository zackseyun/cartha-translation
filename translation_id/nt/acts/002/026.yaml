  text: διὰ τοῦτο ηὐφράνθη ⸂ἡ καρδία μου⸃ καὶ ἠγαλλιάσατο ἡ γλῶσσά μου, ἔτι δὲ καὶ ἡ σάρξ μου κατασκηνώσει ἐπ’ ἐλπίδι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/026.yaml
  text: Because of this my heart was glad[a], and my tongue rejoiced; moreover, even my flesh will dwell in hope.
translation:
  language: id
  text: Karena itulah hatiku bersukacita dan lidahku bersorak; bahkan dagingku pun akan tinggal dalam pengharapan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tubuhku akan beristirahat dalam pengharapan.”
    reason: Alternatif ini memakai padanan kontekstual bagi σάρξ dan menafsirkan κατασκηνώσει sebagai istirahat, khususnya dalam konteks kematian dan pengharapan akan kebangkitan.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena hal ini
  rationale: Mempertahankan daya kausal frasa Yunani, bukan sekadar menarik kesimpulan seperti “karena itu” atau “oleh sebab itu”.
- source_word: ηὐφράνθη ἡ καρδία μου
  choice: hatiku bersukacita
  rationale: Mengungkapkan keadaan sukacita secara alami dalam bahasa Indonesia sambil mempertahankan idiom alkitabiah “hati” bagi batin manusia.
- source_word: ἠγαλλιάσατο ἡ γλῶσσά μου
  choice: lidahku bergembira
  rationale: Mempertahankan gambaran puitis “lidah” sebagai alat ungkapan sukacita dan membedakannya dari kata kerja pada klausa sebelumnya.
- source_word: ἔτι δὲ καὶ
  choice: bahkan ... pun
  rationale: Menyampaikan kelanjutan sekaligus penekanan yang terkandung dalam rangkaian partikel Yunani.
- source_word: ἡ σάρξ μου
  choice: dagingku
  rationale: Menerjemahkan σάρξ secara langsung dalam arti jasmaniah, tanpa mengubahnya menjadi konsep etis seperti “tabiat berdosa” atau langsung menafsirkannya sebagai “tubuh”.
- source_word: κατασκηνώσει
  choice: akan berdiam
  rationale: Mempertahankan citra tinggal atau berkemah dalam verba Yunani; “beristirahat” mungkin sesuai konteks, tetapi mempersempit metaforanya.
- source_word: ἐπ’ ἐλπίδι
  choice: dalam pengharapan
  rationale: Ungkapan Indonesia yang alami untuk menyampaikan lingkup atau dasar pengharapan tanpa menambahkan kepastian teologis yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Makna σάρξ dalam kutipan yang berkonteks kebangkitan
  choice: dagingku
  alternative: tubuhku
  rationale: Istilah ini bersifat jasmaniah, bukan etis. “Dagingku” menjaga hubungan leksikal dengan σάρξ dan membiarkan konteks selanjutnya menjelaskan kaitannya dengan kematian dan kebangkitan.
- issue: Nuansa κατασκηνώσει ἐπ’ ἐλπίδι
  choice: akan berdiam dalam pengharapan
  alternative: akan beristirahat dalam pengharapan
  rationale: Pilihan utama mempertahankan metafora tinggal dengan aman dan tidak secara diam-diam menyamakannya hanya dengan istirahat dalam kematian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis-luhur. Paralelisme “hatiku ... lidahku” serta metafora “dagingku ... berdiam” dipertahankan. Penanda catatan kaki [a] ditempatkan sesudah frasa yang memiliki alternatif terjemahan.
