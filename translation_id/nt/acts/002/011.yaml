  text: Ἰουδαῖοί τε καὶ προσήλυτοι, Κρῆτες καὶ Ἄραβες, ἀκούομεν λαλούντων αὐτῶν ταῖς ἡμετέραις γλώσσαις τὰ μεγαλεῖα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/011.yaml
  text: both Jews and proselytes[a], Cretans and Arabs—we hear them speaking in our own languages the mighty works of God.
translation:
  language: id
  text: baik orang Yahudi maupun orang yang telah masuk agama Yahudi, orang Kreta dan orang Arab—kita mendengar mereka berbicara dalam bahasa kami masing-masing[a] tentang perbuatan-perbuatan besar Allah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam lidah-lidah kami sendiri.” Kata Yunani yang dipakai dapat berarti “lidah” atau “bahasa”; dalam konteks ini, yang dimaksud adalah bahasa manusia yang dapat dikenali.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖοί
  choice: orang Yahudi
  rationale: Dalam daftar bangsa dan kelompok pada konteks ini, istilah tersebut menunjuk kepada orang Yahudi sebagai kelompok etnoreligius, bukan hanya penduduk Yudea.
- source_word: τε καὶ
  choice: baik ... maupun
  rationale: Bentuk korelatif ini secara alami mempertahankan pemasangan orang Yahudi dengan orang yang masuk agama Yahudi.
- source_word: προσήλυτοι
  choice: orang yang masuk agama Yahudi
  rationale: Ungkapan ini jelas bagi pembaca umum dan secara khusus menyatakan orang bukan Yahudi yang telah memeluk agama Yahudi; istilah teknis “proselit” kurang umum.
- source_word: Κρῆτες καὶ Ἄραβες
  choice: orang Kreta dan orang Arab
  rationale: Nama-nama kelompok ini mengikuti pemakaian modern yang lazim dalam bahasa Indonesia.
- source_word: ἀκούομεν λαλούντων αὐτῶν
  choice: kita mendengar mereka berbicara
  rationale: Terjemahan ini mempertahankan pengalaman langsung yang dinyatakan oleh verba kini serta konstruksi mendengar seseorang sedang berbicara.
- source_word: ταῖς ἡμετέραις γλώσσαις
  choice: dalam bahasa kita sendiri
  rationale: Dalam konteks kerumunan multibangsa yang mendengar bahasa asal masing-masing, γλῶσσαι paling wajar menunjuk kepada bahasa manusia yang dapat dikenali; “sendiri” mempertahankan penekanan ἡμετέραις.
- source_word: τὰ μεγαλεῖα τοῦ θεοῦ
  choice: perbuatan-perbuatan besar Allah
  rationale: Ungkapan ini menyampaikan tindakan-tindakan besar atau dahsyat yang berasal dari Allah tanpa mempersempitnya menjadi jenis mukjizat tertentu.
theological_decisions:
- issue: Makna γλώσσαις dalam peristiwa Pentakosta
  choice: bahasa manusia yang dapat dikenali
  alternative: ucapan ekstatis atau bahasa yang bukan bahasa manusia
  rationale: Konteks langsung menekankan bahwa orang-orang dari berbagai bangsa mendengar dalam bahasa mereka sendiri. Terjemahan “bahasa” mengikuti fokus narasi tanpa memasukkan kesimpulan dari perdebatan teologis yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Orang yang masuk agama Yahudi” dipilih daripada istilah teknis “proselit” agar mudah dipahami. Tanda pisah mempertahankan peralihan dari daftar kelompok kepada seruan bersama para pendengar.
