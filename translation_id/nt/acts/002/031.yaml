  text: προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ χριστοῦ ὅτι ⸂οὔτε ἐγκατελείφθη⸃ εἰς ⸀ᾅδην ⸀οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/031.yaml
  text: 'Foreseeing this[a], he spoke about the resurrection of the Messiah: that he was neither abandoned to Hades[d][c][b], nor did his flesh see decay.'
translation:
  language: id
  text: 'Daud telah melihat hal ini sebelumnya dan berbicara tentang kebangkitan Mesias: Ia tidak ditinggalkan di alam kematian,[a] dan daging-Nya tidak mengalami pembusukan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: “Hades”, yaitu ranah orang mati, bukan secara khusus tempat hukuman terakhir. Atau “ditinggalkan kepada alam kematian.”'
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “daging-Nya tidak melihat pembusukan”; ungkapan ini berarti tidak mengalami pembusukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδὼν
  choice: karena telah melihatnya sebelumnya
  rationale: Partisip aoris ini menyatakan bahwa Daud mengetahui lebih dahulu apa yang akan terjadi. Kata ganti “-nya” dipasok dari konteks agar ungkapannya alami dalam bahasa Indonesia.
- source_word: ἐλάλησεν
  choice: berbicara
  rationale: λαλέω berarti berbicara; bentuk ini sesuai dengan tindakan Daud menyampaikan nubuat dalam kutipan Kitab Suci.
- source_word: περὶ τῆς ἀναστάσεως
  choice: tentang kebangkitan
  rationale: περί dengan genitif berarti “tentang” atau “mengenai”; pilihan ini alami dan tepat.
- source_word: τοῦ χριστοῦ
  choice: Mesias
  rationale: Χριστός di sini menonjol sebagai gelar bagi Yang Diurapi yang dinantikan dalam Kitab Suci, bukan terutama sebagai nama diri.
- source_word: οὔτε ἐγκατελείφθη
  choice: tidak ditinggalkan
  rationale: Bentuk pasif ἐγκαταλείπω berarti ditinggalkan atau ditelantarkan. “Tidak ditinggalkan” mempertahankan makna dasar tanpa memberi nuansa emosional tambahan.
- source_word: εἰς ᾅδην
  choice: di alam kematian
  rationale: Dalam konstruksi ini, εἰς bersama verba pasif dapat menyampaikan keadaan atau tempat ia dibiarkan. “Alam kematian” menjelaskan ᾅδης sebagai ranah orang mati dan menghindari penyamaan dengan tempat hukuman terakhir.
- source_word: ἡ σὰρξ αὐτοῦ
  choice: tubuh-Nya
  rationale: Secara harfiah berarti “daging-Nya”, tetapi dalam konteks pembusukan jasmani, bahasa Indonesia alami memakai “tubuh-Nya”. Makna fisik dan realitas kebangkitan tetap dipertahankan.
- source_word: εἶδεν διαφθοράν
  choice: mengalami kebinasaan
  rationale: Ungkapan harfiah “melihat kebinasaan” merupakan idiom bagi mengalami pembusukan atau kehancuran jasmani. “Mengalami kebinasaan” mempertahankan cakupan διαφθορά tanpa ungkapan yang janggal.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam argumen Petrus dari Kitab Suci, istilah ini berfungsi jelas sebagai gelar bagi Yang Diurapi. “Mesias” membuat fungsi gelar itu nyata.
- issue: Penerjemahan ᾅδης
  choice: alam kematian
  alternative: Hades
  rationale: Istilah ini menunjuk pada ranah orang mati, bukan secara khusus tempat hukuman terakhir. Terjemahan maknawi ini mencegah pembaca menyamakannya dengan neraka.
- issue: Penerjemahan σάρξ
  choice: tubuh-Nya
  alternative: daging-Nya
  rationale: σάρξ di sini bersifat harfiah dan menunjuk pada tubuh jasmani Mesias. “Tubuh” merupakan ungkapan Indonesia yang lebih alami dalam kaitannya dengan pembusukan, tanpa mengurangi penegasan kebangkitan jasmani.
- issue: Hubungan εἰς ᾅδην dengan ἐγκατελείφθη
  choice: ditinggalkan di alam kematian
  alternative: diserahkan kepada alam kematian
  rationale: Konstruksi Yunani memungkinkan nuansa lokasi atau arah. Pilihan utama mengikuti makna kontekstual bahwa Mesias tidak dibiarkan tetap berada dalam ranah orang mati, sementara catatan kaki mempertahankan alternatif bentuknya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama “Daud” dinyatakan untuk memperjelas subjek partisip Yunani berdasarkan ayat sebelumnya. Kapitalisasi pronomina “Ia” dan “-Nya” mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Tanda pasangan οὔτε ... οὔτε diterjemahkan secara alami sebagai “tidak ... dan ... tidak”.
