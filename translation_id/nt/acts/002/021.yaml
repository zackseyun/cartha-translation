  text: καὶ ἔσται πᾶς ὃς ⸀ἐὰν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/021.yaml
  text: And it shall be that everyone who calls on the name of the Lord will be saved[a].
translation:
  language: id
  text: Dan akan terjadi bahwa setiap orang yang berseru kepada nama Tuhan akan diselamatkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “siapa pun yang berseru kepada nama Tuhan.” Ungkapan ini menggemakan Yoel 2:32, tempat “Tuhan” merujuk kepada YHWH; dalam Kisah Para Rasul, Petrus memakai kutipan ini dalam pemberitaannya tentang Yesus.
    reason: Mencatat padanan alternatif bagi konstruksi universal dan menjelaskan latar kutipan serta ketegangan mengenai rujukan 'Tuhan' tanpa menyelesaikannya di dalam teks utama.
lexical_decisions:
- source_word: ἔσται
  choice: akan terjadi
  rationale: Bentuk futur εἰμί berfungsi sebagai rumusan pengantar kutipan profetis. 'Akan terjadi' alami dalam bahasa Indonesia dan tetap mempertahankan nuansa penggenapan nubuat.
- source_word: πᾶς ὃς ἐὰν
  choice: setiap orang yang
  rationale: Konstruksi ini menyatakan syarat universal yang tidak terbatas; 'setiap orang yang' jelas, alami, dan mempertahankan cakupan universalnya.
- source_word: ἐπικαλέσηται
  choice: berseru kepada
  rationale: Dalam ungkapan alkitabiah ini, verba tersebut berarti memanggil atau memohon kepada Tuhan dengan ketergantungan dan ibadah. 'Berseru kepada' merupakan padanan Indonesia yang lazim dan bermartabat.
- source_word: τὸ ὄνομα
  choice: nama
  rationale: Dipertahankan secara harfiah karena 'berseru kepada nama Tuhan' adalah ungkapan alkitabiah dengan makna relasional, perjanjian, dan ibadah yang tidak sebaiknya diparafrasakan.
- source_word: κυρίου
  choice: Tuhan
  rationale: κύριος diterjemahkan 'Tuhan'. Frasa genitif τὸ ὄνομα κυρίου secara alami menjadi 'nama Tuhan'; rujukannya tidak dipersempit dalam teks utama.
- source_word: σωθήσεται
  choice: akan diselamatkan
  rationale: Bentuk futur pasif σῴζω. 'Akan diselamatkan' mempertahankan bentuk pasif serta cakupan makna pertolongan dan keselamatan dalam konteks kutipan ini.
theological_decisions:
- issue: Rujukan 'Tuhan' dalam kutipan Yoel sebagaimana digunakan dalam Kisah Para Rasul
  choice: Menerjemahkan κύριος sebagai 'Tuhan' tanpa menentukan rujukannya dalam teks utama.
  alternative: YHWH dalam konteks asli Yoel; atau Yesus dalam penerapan kristologis khotbah Petrus di Kisah Para Rasul.
  rationale: Teks Yunani berbunyi κύριος dan tidak secara eksplisit mempersempit rujukannya. Kutipan itu menggemakan Yoel 2:32, tempat rujukannya adalah YHWH, tetapi Petrus menggunakannya dalam pemberitaan yang berpusat pada Yesus. Terjemahan 'Tuhan' mempertahankan kata-kata dan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada kitab suci yang khidmat tetapi mudah dipahami. 'Dan akan terjadi bahwa' mempertahankan bentuk pengantar profetis Yunani, sedangkan 'berseru kepada nama Tuhan' menjaga idiom alkitabiahnya.
