  source_fidelity: 'Terjemahan dengan setia menyampaikan rangkaian tindakan dalam teks Yunani: ketekunan setiap hari, kesatuan hati di kompleks Bait Allah, pemecahan roti secara berpindah-pindah dari rumah ke rumah, serta mengambil bagian dalam makanan dengan sukacita dan ketulusan hati. Pembagian menjadi dua kalimat tidak mengubah hubungan tindakan-tindakan tersebut.'
  naturalness: Bahasa Indonesia baku, jelas, dan bernada naratif wajar. “Hari demi hari,” “sehati,” “dari rumah ke rumah,” dan “dengan sukacita dan ketulusan hati” terdengar alami. “Menikmati makanan” dapat dipahami sebagai turut makan dan, dalam konteks sukacita, tetap idiomatis.
  terminology: “Kompleks Bait Allah” tepat untuk ἱερόν dan membedakannya dari ruang kudus bagian dalam. “Memecah-mecahkan roti” mempertahankan keluasan ungkapan tanpa menetapkan pembacaan sakramental. Catatan kaki dengan tepat menjaga kemungkinan-kemungkinan leksikal dan penafsiran yang diperselisihkan.
