id: ACT.2.46
reference: Acts 2:46
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν τε προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ, κλῶντές τε κατ’ οἶκον ἄρτον, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/046.yaml
  text: And day by day[a], continuing together with one purpose in the temple courts, and breaking bread from house to house, they were sharing meals with gladness and simplicity of heart[d][c][b],
translation:
  language: id
  text: Hari demi hari mereka terus berkumpul sehati di kompleks Bait Allah[a]. Mereka memecah-mecahkan roti dari rumah ke rumah[b] dan menikmati makanan[c] dengan sukacita dan ketulusan hati[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang dipakai menunjuk pada kompleks Bait Allah, bukan secara khusus ruang kudus bagian dalam.
    reason: cultural_note
  - marker: b
    text: Ungkapan “memecah-mecahkan roti” dapat menunjuk pada makan bersama biasa, meskipun sebagian orang memahaminya juga mencakup Perjamuan Tuhan.
    reason: alternative_reading
  - marker: c
    text: 'Secara harfiah: “mengambil bagian dalam makanan.”'
    reason: lexical_alternative
  - marker: d
    text: 'Atau: “kesederhanaan hati” atau “kemurahan hati.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Hari demi hari
  rationale: Ungkapan distributif ini menyatakan kegiatan yang berlangsung berulang kali setiap hari; bentuk ini alami dalam bahasa Indonesia dan mempertahankan nuansa keberlanjutan.
- source_word: προσκαρτεροῦντες
  choice: terus berkumpul
  rationale: Partisipel kini menandakan ketekunan yang berkelanjutan. Dalam kaitannya dengan frasa tempat, 'terus berkumpul' menyampaikan bahwa mereka tetap tekun hadir tanpa menambahkan nuansa bakti yang tidak dinyatakan secara eksplisit.
- source_word: ὁμοθυμαδόν
  choice: sehati
  rationale: Kata ini menunjukkan kesatuan sikap dan tujuan. 'Sehati' ringkas, wajar, dan mempertahankan dimensi kebersamaan serta kesatuan maksud.
- source_word: ἐν τῷ ἱερῷ
  choice: di kompleks Bait Allah
  rationale: ἱερόν menunjuk pada seluruh kompleks Bait Allah, bukan secara khusus ruang kudus bagian dalam; 'kompleks Bait Allah' mempertahankan pembedaan tersebut.
- source_word: κλῶντές ... ἄρτον
  choice: memecah-mecahkan roti
  rationale: Ungkapan ini mempertahankan idiom Lukas-Kisah Para Rasul dan tidak membatasi maknanya hanya pada perjamuan biasa atau Perjamuan Tuhan.
- source_word: κατ’ οἶκον
  choice: dari rumah ke rumah
  rationale: κατά memiliki makna distributif di sini, sehingga frasa ini menggambarkan kegiatan yang dilakukan di berbagai rumah.
- source_word: μετελάμβανον τροφῆς
  choice: menikmati makanan
  rationale: Imperfek menggambarkan kegiatan makan yang berulang atau berkelanjutan. 'Menikmati makanan' mengungkapkan turut mengambil bagian dalam makanan secara alami tanpa memaksakan arti bahwa makanannya dibagikan.
- source_word: ἐν ἀγαλλιάσει
  choice: dengan sukacita
  rationale: ἀγαλλίασις menyatakan kegembiraan yang kuat; 'sukacita' merupakan padanan modern, bermartabat, dan mudah dipahami.
- source_word: ἀφελότητι καρδίας
  choice: ketulusan hati
  rationale: Frasa ini dapat menyatakan kepolosan, ketulusan, atau kemurahan yang tidak dibuat-buat. 'Ketulusan hati' alami dalam bahasa Indonesia dan tidak membatasi frasa itu pada kemurahan materi.
theological_decisions:
- issue: Apakah ungkapan 'memecah-mecahkan roti' harus diterjemahkan secara eksplisit sebagai Perjamuan Tuhan
  choice: Mempertahankan ungkapan luas 'memecah-mecahkan roti' dalam teks utama.
  alternative: Menafsirkannya hanya sebagai makan bersama biasa, atau secara eksplisit sebagai Perjamuan Tuhan.
  rationale: Konteks menyebut makanan dan mendukung perjamuan bersama biasa, tetapi ungkapan dalam Lukas-Kisah Para Rasul juga dapat mengandung gema praktik Perjamuan Tuhan. Terjemahan utama dan catatan kaki mempertahankan ketegangan ini.
- issue: Makna ἀφελότητι καρδίας
  choice: ketulusan hati
  alternative: kesederhanaan hati atau kemurahan hati
  rationale: Kata Yunani tersebut jarang dan memiliki cakupan yang mencakup keterbukaan, ketulusan, serta kesederhanaan yang tidak dibuat-buat. Pilihan utama dibuat alami dalam bahasa Indonesia, sedangkan kemungkinan lain dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Struktur Yunani yang panjang dibagi menjadi dua kalimat agar alami, tanpa menghilangkan hubungan antartindakan. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
