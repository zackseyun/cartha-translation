  yaml_path: translation/nt/acts/002/012.yaml
  text: And they all were amazed and perplexed[a], saying to one another, “What does this mean?”
translation:
  language: id
  text: Mereka semua tercengang dan bingung, sambil berkata satu sama lain, “Apa arti hal ini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξίσταντο
  choice: tercengang
  rationale: Kata kerja ini menggambarkan keadaan takjub yang kuat dan sedang berlangsung. “Tercengang” alami dalam bahasa Indonesia modern serta tidak menimbulkan kesan kehilangan kewarasan seperti terjemahan yang terlalu harfiah.
- source_word: δὲ
  choice: lalu
  rationale: Di sini δέ merupakan penghubung ringan yang melanjutkan narasi, bukan penanda pertentangan yang kuat. “Lalu” menjaga alur kalimat secara alami.
- source_word: πάντες
  choice: mereka semua
  rationale: Pilihan ini mempertahankan penekanan bahwa seluruh kelompok yang disebut dalam konteks mengalami reaksi tersebut.
- source_word: διηπόρουν
  choice: kebingungan
  rationale: Kata ini menyatakan keadaan sangat bingung atau tidak tahu bagaimana memahami kejadian itu. Bentuk “kebingungan” berpasangan secara alami dengan “tercengang” dan mencerminkan keadaan yang berlangsung.
- source_word: ἄλλος πρὸς ἄλλον
  choice: satu sama lain
  rationale: Ini adalah padanan timbal balik yang alami dan tepat dalam bahasa Indonesia modern.
- source_word: λέγοντες
  choice: berkata
  rationale: Partisipel ini memperkenalkan isi ucapan mereka. “Berkata” mempertahankan makna yang netral tanpa secara tidak perlu mengubahnya menjadi verba lain.
- source_word: Τί θέλει τοῦτο εἶναι;
  choice: Apa arti hal ini?
  rationale: Ungkapan τί θέλει + infinitif menanyakan makna atau arti penting suatu kejadian. Terjemahan ini menyampaikan fungsi idiom tersebut dengan wajar tanpa menambahkan penafsiran khusus.
