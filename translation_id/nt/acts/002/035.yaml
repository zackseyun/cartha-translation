id: ACT.2.35
reference: Acts 2:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/035.yaml
  text: until I make your enemies a footstool for your feet[a][b].
translation:
  language: id
  text: sampai Aku menjadikan musuh-musuh-Mu tumpuan kaki-Mu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “sampai Aku menempatkan musuh-musuh-Mu sebagai tumpuan kaki-Mu.”
    reason: lexical_alternative
  - marker: b
    text: Baris ini menggemakan Mazmur 110:1, sebuah teks tentang penobatan raja yang memiliki makna mesianik.
    reason: cross_reference
lexical_decisions:
- source_word: ἕως ἂν
  choice: sampai
  rationale: Gabungan ini menunjuk pada batas waktu pada masa mendatang; “sampai” menyampaikan makna temporal itu secara alami dan ringkas.
- source_word: θῶ
  choice: Aku menjadikan
  rationale: Bentuk dari τίθημι secara harfiah berarti “menaruh/menempatkan”, tetapi bersama pelengkap predikatif ὑποπόδιον, “menjadikan” paling alami dalam bahasa Indonesia dan mempertahankan struktur maknanya.
- source_word: τοὺς ἐχθρούς σου
  choice: musuh-musuh-Mu
  rationale: Padanan langsung yang mempertahankan baik hubungan pribadi maupun nuansa para penentang raja dalam kutipan mazmur.
- source_word: ὑποπόδιον
  choice: tumpuan kaki
  rationale: Istilah ini mempertahankan gambaran konkret tentang tempat menumpukan kaki dan simbol penaklukan, tanpa mengubah metafora menjadi penjelasan.
- source_word: τῶν ποδῶν σου
  choice: kaki-Mu
  rationale: Genitif ini merupakan bagian dari ungkapan “tumpuan kaki”; bentuk Indonesia tersebut alami, tidak berlebihan, dan tetap mempertahankan citranya.
theological_decisions:
- issue: Gambaran penaklukan kerajaan dalam kutipan Mazmur 110:1
  choice: Mempertahankan gambaran konkret “menjadikan musuh-musuh-Mu tumpuan kaki-Mu”.
  alternative: “sampai Aku menaklukkan seluruh musuh-Mu di bawah kaki-Mu”
  rationale: Teks menggemakan Mazmur 110:1 dan memuat nuansa kerajaan/mesianik. Mempertahankan metafora menjaga hubungan antarteks dan daya teologisnya tanpa memasukkan tafsiran eksplisit tentang penaklukan total ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan bermartabat. Kapital pada “Aku” dan akhiran pronomina “-Mu” mengikuti rujukan ilahi dalam konteks kutipan, tanpa menambahkan penafsiran ke dalam isi ayat.
