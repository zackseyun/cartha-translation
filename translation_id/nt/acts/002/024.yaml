  text: ὃν ὁ θεὸς ἀνέστησεν λύσας τὰς ὠδῖνας τοῦ θανάτου, καθότι οὐκ ἦν δυνατὸν κρατεῖσθαι αὐτὸν ὑπ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/024.yaml
  text: whom God raised up[a], having loosed the pains of death[b], because it was not possible for him to be held by it.
translation:
  language: id
  text: Dia itulah yang dibangkitkan Allah dengan membebaskan-Nya dari sengsara maut,[a] sebab tidak mungkin Dia ditahan olehnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “rasa sakit maut.” Kata Yunani yang digunakan juga dapat berarti “nyeri bersalin,” sehingga mungkin mempertahankan gambaran tentang cengkeraman maut yang dipatahkan.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, “ditahan olehnya.” Kata ganti ini paling wajar merujuk kepada maut: “ditahan oleh maut.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: Dia itulah yang
  rationale: Kata ganti relatif ini menunjuk kembali kepada Yesus dalam ayat sebelumnya. Bentuk ini mempertahankan kaitan antarayat secara wajar dalam bahasa Indonesia.
- source_word: ἀνέστησεν
  choice: dibangkitkan Allah
  rationale: Dalam konteks ini, kata kerja tersebut menyatakan tindakan Allah membangkitkan Yesus dari kematian tanpa perlu menggantinya dengan istilah teologis yang lebih teknis.
- source_word: λύσας
  choice: dengan membebaskan-Nya
  rationale: Partisip aoris ini menyertai tindakan utama dan dapat menyatakan cara atau tindakan yang mengiringinya. Pilihan ini menyampaikan gagasan melepaskan atau membebaskan secara alami dalam bahasa Indonesia.
- source_word: τὰς ὠδῖνας τοῦ θανάτου
  choice: dari sengsara maut
  rationale: ὠδῖνας dapat berarti rasa sakit yang hebat atau nyeri bersalin. 'Sengsara maut' mempertahankan gagasan penderitaan dan kuasa maut dalam ungkapan Indonesia yang ringkas, sedangkan nuansa nyeri bersalin dicatat dalam catatan kaki.
- source_word: καθότι
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi tindakan Allah; 'sebab' jelas, wajar, dan sesuai dengan ragam naratif yang bermartabat.
- source_word: οὐκ ἦν δυνατὸν
  choice: tidak mungkin
  rationale: Ungkapan ini secara langsung dan alami menyampaikan konstruksi impersonal Yunani.
- source_word: κρατεῖσθαι
  choice: terus ditahan
  rationale: Bentuk pasif ini menggambarkan seseorang yang berada dalam cengkeraman atau kuasa sesuatu. 'Terus' memperjelas aspek keberlanjutan yang tersirat dalam keadaan ditahan, tanpa mengubah inti maknanya.
- source_word: ὑπ’ αὐτοῦ
  choice: olehnya
  rationale: Kata ganti ini paling wajar merujuk kepada maut, tetapi bentuk pronominal dipertahankan dalam teks utama agar struktur dan sedikit ambiguitas bahasa sumber tidak dihapus.
theological_decisions:
- issue: Rujukan ὑπ’ αὐτοῦ
  choice: Kata ganti dipertahankan sebagai 'olehnya', dengan maut sebagai rujukan yang paling alami.
  alternative: '''oleh maut'' atau, secara gramatikal tetapi kurang mungkin, ''oleh dia'' dengan rujukan personal lain.'
  rationale: θανάτου adalah anteseden terdekat dan alur kalimat menyatakan bahwa maut tidak sanggup terus menahan Yesus. Catatan kaki menjelaskan rujukan ini tanpa membuat teks utama lebih eksplisit daripada bahasa Yunani.
- issue: Makna ὠδῖνας
  choice: '''sengsara'' dalam teks utama'
  alternative: '''rasa sakit'', ''penderitaan'', atau ''nyeri bersalin'''
  rationale: Kata Yunani dapat menunjuk pada nyeri bersalin maupun rasa sakit yang hebat. 'Sengsara maut' dapat dipahami pembaca modern dan sesuai dengan konteks cengkeraman maut, sementara citra nyeri bersalin yang sungguh terdapat dalam jangkauan katanya tetap dipelihara dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Dia itulah yang' menjaga hubungan dengan ayat sebelumnya; kapitalisasi kata ganti untuk Yesus mengikuti kebiasaan luas dalam terjemahan Alkitab Indonesia. Ungkapan yang terlalu teknis atau khas denominasi dihindari.
