revisions:
- from: 'Namun Petrus berdiri bersama kesebelas rasul itu, lalu mengangkat suaranya dan berbicara dengan lantang kepada orang banyak: “Saudara-saudara sebangsa dari Yudea dan kalian semua yang tinggal di Yerusalem, ketahuilah hal ini dan dengarkanlah perkataanku baik-baik.”'
  to: Namun, Petrus berdiri bersama kesebelas orang itu, lalu mengangkat suaranya dan berkata kepada mereka, “Saudara-saudara dari Yudea dan kalian semua yang tinggal di Yerusalem, ketahuilah hal ini dan dengarkanlah perkataanku.”
  rationale: Revisi mempertahankan peralihan kontras melalui “Namun,” tindakan Petrus berdiri bersama kesebelas orang itu, serta register resmi pidatonya. Unsur-unsur yang tidak eksplisit dalam teks Yunani—“rasul,” “orang banyak,” “sebangsa,” dan “baik-baik”—dihilangkan. “Berkata kepada mereka” menerjemahkan ἀπεφθέγξατο αὐτοῖς tanpa menduplikasi unsur volume yang telah diungkapkan oleh “mengangkat suaranya.”
