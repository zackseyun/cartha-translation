id: ACT.2.14
reference: Acts 2:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Σταθεὶς δὲ ⸀ὁ Πέτρος σὺν τοῖς ἕνδεκα ἐπῆρεν τὴν φωνὴν αὐτοῦ καὶ ἀπεφθέγξατο αὐτοῖς· Ἄνδρες Ἰουδαῖοι καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ ⸀πάντες, τοῦτο ὑμῖν γνωστὸν ἔστω καὶ ἐνωτίσασθε τὰ ῥήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/014.yaml
  text: 'But Peter[a], standing with the eleven, raised his voice and declared to them: “Men of Judea and all who dwell in Jerusalem, let this be known to you[b], and give ear to my words.”'
translation:
  language: id
  text: Namun, Petrus berdiri bersama kesebelas orang itu, lalu mengangkat suaranya dan berkata kepada mereka, “Saudara-saudara dari Yudea dan kalian semua yang tinggal di Yerusalem, ketahuilah hal ini dan dengarkanlah perkataanku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σταθεὶς δὲ ὁ Πέτρος
  choice: Namun Petrus berdiri
  rationale: Partisip aoris Σταθείς membuka adegan dengan tindakan atau sikap Petrus; bentuk verba berurutan lebih alami dalam bahasa Indonesia. δέ menandai peralihan yang berlawanan dengan ejekan pada ayat sebelumnya, sehingga diterjemahkan “Namun”.
- source_word: σὺν τοῖς ἕνδεκα
  choice: bersama kesebelas rasul itu
  rationale: σύν dengan datif menyatakan kebersamaan. Penambahan “rasul” memperjelas rujukan kesebelas orang tersebut dalam bahasa Indonesia tanpa mengubah identitas kontekstual mereka.
- source_word: ἐπῆρεν τὴν φωνὴν αὐτοῦ
  choice: mengangkat suaranya
  rationale: Ungkapan ini secara idiomatis berarti bersuara keras agar didengar; terjemahan tersebut mempertahankan gambaran Yunani dan tetap wajar dalam bahasa Indonesia.
- source_word: ἀπεφθέγξατο αὐτοῖς
  choice: berbicara dengan lantang kepada orang banyak
  rationale: Verba ini menunjuk pada ujaran terbuka atau khidmat. “Berbicara dengan lantang” cocok dengan suasana pidato umum tanpa secara tersirat menetapkan bahwa verba itu sendiri berarti perkataan yang diilhami. “Orang banyak” menjelaskan rujukan pronomina αὐτοῖς dari konteks.
- source_word: Ἄνδρες Ἰουδαῖοι
  choice: Saudara-saudara sebangsa dari Yudea
  rationale: Sapaan Indonesia “saudara-saudara” mempertahankan bentuk sapaan kepada laki-laki secara wajar, sedangkan “sebangsa dari Yudea” menyampaikan identitas Yahudi/Yudea dalam konteks Yerusalem tanpa memakai ungkapan kaku “laki-laki Yudea”.
- source_word: καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ πάντες
  choice: dan kalian semua yang tinggal di Yerusalem
  rationale: Terjemahan langsung dan alami bagi partisip kini κατοικοῦντες serta πάντες; “kalian” sesuai dengan sapaan langsung jamak.
- source_word: τοῦτο ὑμῖν γνωστὸν ἔστω
  choice: ketahuilah hal ini
  rationale: Konstruksi imperatival ἔστω dengan γνωστόν menyatakan seruan resmi agar para pendengar mengetahui atau memahami hal yang akan dijelaskan. Bentuk imperatif ini alami dan ringkas dalam bahasa Indonesia.
- source_word: ἐνωτίσασθε τὰ ῥήματά μου
  choice: dengarkanlah perkataanku baik-baik
  rationale: ἐνωτίσασθε menuntut perhatian sungguh-sungguh, bukan sekadar mendengar. “Baik-baik” menyampaikan unsur perhatian itu, sementara “perkataanku” mewakili τὰ ῥήματά μου secara langsung.
theological_decisions:
- issue: Kekhususan gender dalam Ἄνδρες Ἰουδαῖοι
  choice: Saudara-saudara sebangsa dari Yudea
  alternative: Orang-orang Yudea; Saudara-saudara Yahudi
  rationale: Ἄνδρες secara gramatikal merujuk kepada laki-laki. “Saudara-saudara” merupakan sapaan maskulin jamak yang wajar dalam bahasa Indonesia, sedangkan “orang-orang” akan menetralkan unsur tersebut. Unsur Yudea tetap dipertahankan karena Ἰουδαῖοι dapat memuat identitas geografis maupun etnis.
- issue: Bobot ujaran dalam ἀπεφθέγξατο
  choice: berbicara dengan lantang
  alternative: menyatakan; menyampaikan perkataan yang diilhami
  rationale: Konteks Pentakosta dapat memberi bobot khusus pada ucapan Petrus, tetapi verba ini tidak perlu dibuat secara eksplisit berarti “diilhami.” Terjemahan mempertahankan sifat ujaran publik yang tegas tanpa menambahkan kesimpulan teologis.
- issue: Identitas “kesebelas”
  choice: kesebelas rasul itu
  alternative: kesebelas orang itu
  rationale: Konteks Kisah Para Rasul 1–2 mengidentifikasi kelompok ini sebagai para rasul. Penjelasan tersebut mencegah ungkapan Indonesia yang terasa menggantung, tanpa menyatakan bahwa Petrus berada di luar kelompok kerasulan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pidato publik yang bermartabat. Kalimat dibuat mudah didengar ketika dibacakan. “Kalian” dipakai karena Petrus menyapa banyak orang secara langsung; “baik-baik” memberi daya perhatian pada imperatif terakhir tanpa terdengar kuno.
