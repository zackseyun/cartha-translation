  naturalness: “Ketika hari Pentakosta tiba” adalah bahasa Indonesia modern yang jelas dan wajar. “Mereka semua berada bersama-sama di satu tempat” dapat diringankan menjadi “mereka semua berkumpul di satu tempat”; tetapi “berkumpul” sedikit lebih aktif daripada ἦσαν. Karena itu, “mereka semua bersama-sama di satu tempat” lebih dekat kepada verba keadaan dan tetap alami.
  terminology: “Pentakosta” adalah istilah baku dan tepat. Tidak ada istilah teologis lain yang memerlukan perubahan.
