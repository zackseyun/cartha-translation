source:
  edition: SBLGNT
  text: Καὶ ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς ἦσαν ⸂πάντες ὁμοῦ⸃ ἐπὶ τὸ αὐτό,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/001.yaml
  text: And when the day of Pentecost had fully come[a], they were all together in one place.
translation:
  language: id
  text: Ketika hari Pentakosta tiba[a], mereka semua bersama-sama di satu tempat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika hari Pentakosta telah tiba sepenuhnya.” Bentuk Yunani dapat menekankan proses tibanya hari itu.
    reason: Alternatif ini mencerminkan nuansa proses/penyelesaian dari συμπληροῦσθαι, sementara teks utama memakai ungkapan Indonesia yang alami.
lexical_decisions:
- source_word: συμπληροῦσθαι
  choice: sedang mencapai kepenuhannya
  rationale: Konstruksi kini pasif infinitif dengan ἐν τῷ bernuansa proses temporal. Ungkapan ini mempertahankan gagasan bahwa hari itu sedang digenapi atau mencapai kepenuhannya, tanpa mengubahnya begitu saja menjadi pernyataan hasil.
- source_word: πεντηκοστῆς
  choice: Pentakosta
  rationale: Pentakosta adalah nama baku dalam bahasa Indonesia untuk hari raya Yahudi yang dalam bahasa Yunani disebut Πεντηκοστή.
- source_word: πάντες
  choice: semua
  rationale: Kata ini mencakup seluruh kelompok yang disebut dalam konteks sebelumnya.
- source_word: ὁμοῦ
  choice: bersama-sama
  rationale: Kata keterangan ini menyatakan kebersamaan kelompok tersebut.
- source_word: ἐπὶ τὸ αὐτό
  choice: di satu tempat
  rationale: Ungkapan ini dapat menyatakan kebersamaan atau tempat yang sama. Karena ὁμοῦ sudah diterjemahkan 'bersama-sama', pilihan ini mempertahankan nuansa lokatif dan menghindari pengulangan makna.
theological_decisions:
- issue: Identitas subjek tersirat dari ἦσαν
  choice: mereka semua
  alternative: semua orang itu
  rationale: Bahasa Yunani tidak mengulangi subjek, tetapi konteks sebelumnya menyediakannya. 'Mereka' diperlukan dalam bahasa Indonesia yang wajar dan tidak menentukan identitas kelompok melampaui konteks narasi.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Frasa 'sedang mencapai kepenuhannya' sengaja mempertahankan ketegangan ungkapan Yunani; alternatif yang lebih idiomatis dicantumkan dalam catatan kaki.
