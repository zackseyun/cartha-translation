  text: καὶ ἐπλήσθησαν ⸀πάντες πνεύματος ἁγίου, καὶ ἤρξαντο λαλεῖν ἑτέραις γλώσσαις καθὼς τὸ πνεῦμα ἐδίδου ⸂ἀποφθέγγεσθαι αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/004.yaml
  text: And they were all filled with the Holy Spirit and began to speak in other tongues[a], as the Spirit was giving them utterance.
translation:
  language: id
  text: Mereka semua dipenuhi dengan Roh Kudus dan mulai berbicara dalam bahasa-bahasa lain[a], sebagaimana Roh Kudus terus memberi mereka kemampuan untuk berbicara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “bahasa-bahasa” juga dapat berarti “lidah-lidah”. Dalam ayat-ayat berikutnya, para pendengar memahami perkataan itu sebagai bahasa-bahasa manusia yang nyata.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: dipenuhi
  rationale: Bentuk aoristus pasif πίμπλημι di sini menyatakan bahwa seluruh kelompok menerima kepenuhan atau pemberdayaan; “dipenuhi” merupakan padanan Indonesia yang alami dan tepat.
- source_word: πάντες
  choice: semua
  rationale: Kata ini menegaskan keseluruhan orang dalam kelompok yang hadir.
- source_word: πνεύματος ἁγίου
  choice: dengan Roh Kudus
  rationale: Dalam konteks Kisah Para Rasul 2, frasa ini merujuk kepada Roh ilahi yang dijanjikan dan yang bertindak sebagai pelaku dalam klausa berikutnya.
- source_word: ἤρξαντο λαλεῖν
  choice: mulai berbicara
  rationale: Konstruksi ἄρχομαι dengan infinitif menunjukkan dimulainya tindakan dan diterjemahkan secara langsung serta alami.
- source_word: ἑτέραις γλώσσαις
  choice: dalam bahasa-bahasa lain
  rationale: γλῶσσα dapat berarti organ lidah, bahasa, atau tuturan yang disebut “bahasa lidah”. Dalam bahasa Indonesia, “bahasa-bahasa lain” paling alami di sini dan didukung oleh konteks Kisah Para Rasul 2:6–11, sedangkan catatan kaki mempertahankan keluasan istilah Yunaninya.
- source_word: καθὼς
  choice: sebagaimana
  rationale: Kata penghubung ini menyatakan kesesuaian cara atau kadar tutur mereka dengan pemberian Roh.
- source_word: ἐδίδου
  choice: terus memberi
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung; “terus memberi” menyampaikan aspek progresif itu dengan jelas.
- source_word: ἀποφθέγγεσθαι
  choice: kemampuan untuk mengucapkannya
  rationale: Kata ini berarti mengucapkan atau menyatakan sesuatu dengan lantang. Penambahan “kemampuan” membuat hubungan idiomatis dalam bahasa Indonesia tanpa membatasi tuturan itu secara khusus sebagai nubuat.
- source_word: αὐτοῖς
  choice: mereka
  rationale: Pronomina datif ini secara alami menjadi penerima dalam frasa “memberi mereka”.
theological_decisions:
- issue: Apakah πνεύματος ἁγίου merujuk kepada Roh ilahi yang personal atau sekadar roh yang kudus.
  choice: Roh Kudus
  alternative: roh kudus
  rationale: Konteks pasal ini mengidentifikasi referennya sebagai Roh yang dijanjikan dan yang secara aktif memungkinkan mereka berbicara. Kapitalisasi menyatakan referen khusus tersebut tanpa menambahkan rumusan doktrinal.
- issue: Apakah γλώσσαις diterjemahkan sebagai “bahasa-bahasa” atau “lidah-lidah/bahasa lidah”.
  choice: bahasa-bahasa lain
  alternative: lidah-lidah lain; bahasa lidah yang lain
  rationale: Konteks sesudah ayat ini menyebut para pendengar mengenali bahasa mereka masing-masing. “Bahasa-bahasa lain” adalah bahasa Indonesia yang paling jelas dan alami, sementara catatan kaki mempertahankan kemungkinan cakupan istilah Yunani itu dan menghindari pemaksaan istilah denominasi.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat mengikuti alur Yunani, tetapi ungkapan “memberi mereka kemampuan untuk mengucapkannya” dipilih agar klausa penutup terdengar wajar. Penanda catatan kaki [a] dicantumkan langsung setelah frasa yang dijelaskan.
