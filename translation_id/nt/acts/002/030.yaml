  rationale: 'Revisi memperbaiki padanan harfiah yang salah dalam catatan kaki: “buah sulbi” menyampaikan citra keturunan jasmani dari ἐκ καρποῦ τῆς ὀσφύος αὐτοῦ, sedangkan “buah pinggang” merujuk pada ginjal. Susunan sumpah dirapikan agar baku dan alami, dan “di takhtanya” dipilih sebagai ungkapan penobatan yang lebih idiomatis. Makna dinasti dan rujukan “takhtanya” kepada Daud tetap dipertahankan.'
