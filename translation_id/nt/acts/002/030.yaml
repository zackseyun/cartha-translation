  text: προφήτης οὖν ὑπάρχων, καὶ εἰδὼς ὅτι ὅρκῳ ὤμοσεν αὐτῷ ὁ θεὸς ἐκ καρποῦ τῆς ὀσφύος ⸀αὐτοῦ καθίσαι ἐπὶ ⸂τὸν θρόνον⸃ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/030.yaml
  text: Therefore[a], being a prophet and knowing that God had sworn to him with an oath to seat one from the fruit of his loins on his throne,
translation:
  language: id
  text: Karena itu, sebagai seorang nabi, Daud tahu bahwa Allah telah bersumpah kepadanya dengan suatu sumpah untuk mendudukkan salah seorang keturunannya[a] di takhtanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari buah sulbinya,” yaitu dari keturunan jasmaninya.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφήτης
  choice: nabi
  rationale: Padanan baku bagi orang yang berbicara berdasarkan penyataan ilahi.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari pembahasan sebelumnya tentang Daud.
- source_word: ὑπάρχων
  choice: sebagai seorang nabi
  rationale: Mengungkapkan keadaan yang melatarbelakangi pengetahuan Daud secara alami dalam bahasa Indonesia.
- source_word: εἰδὼς
  choice: Daud tahu
  rationale: Partisip aoris diterjemahkan sebagai verba finit agar kalimat Indonesia jelas; nama Daud dinyatakan dari konteks untuk menghindari subjek yang kabur.
- source_word: ὅρκῳ ὤμοσεν αὐτῷ ὁ θεὸς
  choice: Allah telah bersumpah dengan sumpah kepadanya
  rationale: Mempertahankan unsur nomina dan verba sumpah serta kekhidmatan penegasannya, meski pengulangannya terasa sengaja formal.
- source_word: ἐκ καρποῦ τῆς ὀσφύος αὐτοῦ
  choice: salah seorang keturunannya
  rationale: Menyampaikan idiom keturunan jasmani dengan bahasa Indonesia yang wajar; citra harfiahnya dicatat dalam catatan kaki.
- source_word: καθίσαι
  choice: untuk mendudukkan
  rationale: 'Mempertahankan nuansa kausatif: Allah menempatkan atau menobatkan keturunan itu.'
- source_word: ἐπὶ τὸν θρόνον αὐτοῦ
  choice: di atas takhtanya
  rationale: Mempertahankan bahasa penobatan dan rujukan paling alami kepada takhta Daud.
theological_decisions:
- issue: Janji kerajaan Mesianik kepada Daud
  choice: Mempertahankan bahasa keturunan dan penobatan tanpa memasukkan istilah “Mesias” ke dalam ayat.
  alternative: Menerjemahkan secara eksplisit bahwa Mesias akan duduk di takhta Daud.
  rationale: Dalam konteksnya Petrus menerapkan sumpah kepada Yesus, tetapi ayat ini sendiri menyatakan janji itu melalui keturunan dan takhta Daud; penerapan kristologis dibiarkan muncul dari konteks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur partisipial Yunani disesuaikan agar alami, sedangkan pengulangan ‘bersumpah dengan sumpah’ dipertahankan demi penekanan teks sumber.
