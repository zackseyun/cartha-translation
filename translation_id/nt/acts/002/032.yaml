  yaml_path: translation/nt/acts/002/032.yaml
  text: God raised up this Jesus[a], of whom we all are witnesses.
translation:
  language: id
  text: Allah membangkitkan Yesus ini, dan kami semua adalah saksi tentang Dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: Yesus yang ini
  rationale: Demonstrativa τοῦτον bersifat menegaskan dan menunjuk secara khusus kepada Yesus yang baru saja dibicarakan. Ungkapan ini mempertahankan daya tunjuk tersebut dalam bahasa Indonesia.
- source_word: ἀνέστησεν
  choice: telah membangkitkan
  rationale: Dalam konteks ini verba ἀνίστημι merujuk pada kebangkitan dari kematian. Bentuk aktif transitif dipertahankan, dengan Allah sebagai pelaku.
- source_word: ὁ θεός
  choice: Allah
  rationale: Subjek eksplisit diterjemahkan secara langsung dengan sebutan baku bahasa Indonesia untuk Allah.
- source_word: οὗ
  choice: -Nya
  rationale: Pronomina relatif genitif menyatakan bahwa mereka adalah saksi mengenai Yesus. Bentuk posesif pada 'saksi-Nya' ringkas dan wajar, meskipun dapat pula dipahami secara lebih eksplisit sebagai 'saksi tentang Dia'.
- source_word: πάντες ἡμεῖς
  choice: kami semua
  rationale: Kombinasi πάντες ἡμεῖς bersifat emfatis. 'Kami semua' mempertahankan penekanan itu dan memakai pronomina eksklusif yang sesuai bagi Petrus dan kelompok saksi yang dibedakan dari para pendengar.
- source_word: ἐσμεν μάρτυρες
  choice: adalah saksi
  rationale: Nomina μάρτυρες dipertahankan sebagai nomina 'saksi', bukan diubah menjadi verba, sehingga struktur Yunani tetap tercermin secara alami.
theological_decisions:
- issue: Ungkapan kebangkitan
  choice: Allah telah membangkitkan Yesus yang ini
  alternative: Allah membangkitkan Yesus yang ini
  rationale: Ayat ini secara eksplisit menyatakan Allah sebagai pelaku kebangkitan Yesus. 'Telah membangkitkan' memperjelas tindakan yang sudah terjadi tanpa menambahkan penjelasan doktrinal.
- issue: Rujukan kesaksian
  choice: kami semua adalah saksi-Nya
  alternative: kami semua adalah saksi tentang Dia
  rationale: Genitif οὗ dapat dinyatakan secara ringkas sebagai 'saksi-Nya', sementara maksud kontekstualnya ialah kesaksian mengenai Yesus—khususnya kebangkitan-Nya. Terjemahan tidak mempersempit kesaksian itu dengan menambahkan objek yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Yesus yang ini' dipilih untuk mempertahankan penegasan demonstratif Yunani, sedangkan catatan kaki memberi bentuk alternatif yang lebih ringkas. 'Kami' dipakai karena pembicara menunjuk kelompok para saksi dan tidak memasukkan para pendengar.
