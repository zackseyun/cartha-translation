id: ACT.2.38
reference: Acts 2:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πέτρος δὲ ⸂πρὸς αὐτούς· Μετανοήσατε⸃, καὶ βαπτισθήτω ἕκαστος ὑμῶν ⸀ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν ⸀τῶν ἁμαρτιῶν ⸀ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/038.yaml
  text: And Peter said to them[a], “Repent, and let each of you be baptized in the name of Jesus the Messiah for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
translation:
  language: id
  text: Lalu Petrus berkata kepada mereka, “Bertobatlah, dan hendaklah kamu masing-masing dibaptis dalam nama Yesus Sang Mesias[a] untuk pengampunan dosa-dosamu[b], dan kamu akan menerima karunia Roh Kudus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yesus Kristus.” Kata Yunani Χριστός dapat diterjemahkan sebagai “Mesias” atau “Kristus”; di sini “Mesias” dipakai untuk mempertahankan makna gelar itu dalam pemberitaan Petrus.
    reason: alternative_reading
  - marker: b
    text: Ungkapan “untuk pengampunan dosa-dosamu” menerjemahkan bahasa Yunani secara langsung. Para penafsir berbeda pendapat tentang hubungan baptisan dengan pengampunan di sini; terjemahan ini tidak menyelesaikan perdebatan itu melampaui bunyi teks.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετανοήσατε
  choice: Bertobatlah
  rationale: Imperatif aoris jamak yang menyerukan pertobatan secara tegas. 'Bertobatlah' merupakan padanan Indonesia yang ringkas dan mencakup perubahan pikiran, hati, serta arah hidup.
- source_word: βαπτισθήτω ἕκαστος ὑμῶν
  choice: hendaklah kamu masing-masing dibaptis
  rationale: Mempertahankan imperatif pasif orang ketiga tunggal dan tekanan distributif ἕκαστος, sambil tetap alami dalam bahasa Indonesia.
- source_word: ἐπὶ τῷ ὀνόματι
  choice: dalam nama
  rationale: Padanan idiomatis dalam konteks baptisan yang tidak mempersempit nuansanya hanya menjadi dasar, wewenang, atau pengakuan.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός berfungsi sebagai gelar dalam konteks pemberitaan mesianik Petrus. 'Sang Mesias' menyampaikan fungsi gelar itu secara alami dan bermartabat.
- source_word: εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: untuk pengampunan dosa-dosamu
  rationale: Menerjemahkan ungkapan Yunani secara langsung, mempertahankan bentuk jamak 'dosa-dosa', dan tidak memaksakan penjelasan tertentu mengenai hubungan baptisan dengan pengampunan.
- source_word: λήμψεσθε τὴν δωρεὰν
  choice: kamu akan menerima karunia
  rationale: Menyampaikan janji dalam bentuk futur secara lugas; 'karunia' cocok dengan konteks pemberian ilahi.
- source_word: τοῦ ἁγίου πνεύματος
  choice: Roh Kudus
  rationale: Padanan baku dan kontemporer dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan baptisan dan pengampunan dalam εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: untuk pengampunan dosa-dosamu
  alternative: supaya dosa-dosamu diampuni; karena dosa-dosamu telah diampuni
  rationale: Terjemahan langsung ini mempertahankan ketegangan teologis teks tanpa menetapkan apakah hubungan tersebut harus dipahami secara sakramental, instrumental, simbolis, atau dengan cara lain.
- issue: Penerjemahan Χριστοῦ
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam khotbah Petrus di Kisah Para Rasul 2, gelar mesianik masih menonjol; 'Sang Mesias' menyatakan makna gelar tersebut, sementara bentuk tradisional dicatat dalam catatan kaki.
- issue: Hubungan καί terakhir dengan janji
  choice: maka kamu akan menerima
  alternative: dan kamu akan menerima
  rationale: '''Maka'' secara alami mengungkapkan kelanjutan janji dalam bahasa Indonesia tanpa menambahkan syarat atau urutan teologis yang tidak dinyatakan secara eksplisit.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'hendaklah kamu masing-masing dibaptis' mempertahankan struktur distributif dan daya imperatif teks sumber. Pronomina '-mu' sesuai dengan sapaan jamak dalam konteks ini, meskipun bentuknya tidak membedakan tunggal dan jamak dalam bahasa Indonesia.
