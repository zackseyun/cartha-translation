id: ACT.2.25
reference: Acts 2:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Δαυὶδ γὰρ λέγει εἰς αὐτόν· Προορώμην τὸν κύριον ἐνώπιόν μου διὰ παντός, ὅτι ἐκ δεξιῶν μού ἐστιν ἵνα μὴ σαλευθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/025.yaml
  text: For David says concerning him, ‘I kept seeing the Lord before me continually, because he is at my right hand, so that I may not be shaken.’
translation:
  language: id
  text: Sebab Daud berkata tentang Dia, “Aku senantiasa melihat Tuhan di hadapanku,[a] karena Ia berada di sebelah kananku, supaya aku tidak goyah.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku melihat Tuhan sebelumnya.” Dalam konteks ini, ungkapan “senantiasa ... di hadapanku” lebih mendukung arti melihat Tuhan terus-menerus.
    reason: lexical_alternative
  - marker: b
    text: Petrus mengutip Mazmur 16:8. Dalam teks Ibrani mazmur itu, sebutan yang mendasarinya adalah nama ilahi, yang lazim diterjemahkan “TUHAN”.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει εἰς αὐτόν
  choice: berkata tentang Dia
  rationale: Dalam formula pengantar kutipan ini, εἰς αὐτόν berarti berbicara mengenai seseorang, bukan berbicara langsung kepadanya. Huruf kapital pada “Dia” mengikuti kebiasaan ejaan Indonesia untuk rujukan ilahi tanpa menambahkan identifikasi yang tidak dinyatakan oleh frasa Yunani.
- source_word: Προορώμην
  choice: Aku senantiasa melihat
  rationale: Bentuk imperfek menyatakan tindakan yang berlangsung atau berulang; bersama διὰ παντός, makna kontekstualnya ialah terus melihat atau menempatkan Tuhan di hadapan diri, bukan terutama melihat sebelumnya secara nubuat.
- source_word: κύριον
  choice: Tuhan
  rationale: Menerjemahkan κύριος secara langsung dan mempertahankan sebutan dalam kutipan tanpa menggantinya dengan identifikasi teologis yang lebih khusus.
- source_word: ἐνώπιόν μου
  choice: di hadapanku
  rationale: Ungkapan Indonesia yang alami serta mempertahankan gambaran relasional-spasial teks sumber.
- source_word: διὰ παντός
  choice: senantiasa
  rationale: Menyatakan kesinambungan atau kebiasaan secara alami dalam bahasa Indonesia dan mendukung daya duratif bentuk imperfek.
- source_word: ἐκ δεξιῶν μού
  choice: di sebelah kananku
  rationale: Padanan idiomatis yang jelas untuk posisi di sisi kanan, dengan implikasi dukungan atau perlindungan tetap dibiarkan tersirat.
- source_word: ἵνα μὴ σαλευθῶ
  choice: supaya aku tidak goyah
  rationale: “Supaya” mempertahankan nuansa tujuan/hasil dari ἵνα, sedangkan “goyah” menyampaikan metafora hilangnya kestabilan secara alami.
theological_decisions:
- issue: Rujukan “Tuhan” dalam kutipan Mazmur sebagaimana digunakan Petrus
  choice: Mempertahankan “Tuhan” tanpa mengidentifikasi-Nya lebih lanjut dalam teks terjemahan
  alternative: TUHAN; Mesias
  rationale: Petrus menggunakan kutipan ini secara kristologis, sedangkan teks kutipan sendiri memakai κύριον. Terjemahan mempertahankan ketegangan itu dan tidak mengganti sebutan tersebut dengan tafsiran eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan tetap mudah dipahami. Susunan “senantiasa melihat Tuhan di hadapanku” alami dalam bahasa Indonesia, menjaga aspek berkelanjutan tanpa ungkapan kaku seperti “terus melihat”. Pronomina ilahi memakai kapital sesuai kebiasaan penerbitan Alkitab Indonesia.
