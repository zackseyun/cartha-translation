id: ACT.2.9
reference: Acts 2:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πάρθοι καὶ Μῆδοι καὶ Ἐλαμῖται, καὶ οἱ κατοικοῦντες τὴν Μεσοποταμίαν, Ἰουδαίαν τε καὶ Καππαδοκίαν, Πόντον καὶ τὴν Ἀσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/009.yaml
  text: Parthians and Medes and Elamites[a], and those living in Mesopotamia, Judea and Cappadocia, Pontus and Asia[b],
translation:
  language: id
  text: orang Partia, Media, dan Elam, serta mereka yang tinggal di Mesopotamia, Yudea dan Kapadokia, Pontus dan Asia[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud adalah Provinsi Asia milik Kekaisaran Romawi di bagian barat Asia Kecil, bukan benua Asia masa kini.
    reason: cultural_note
lexical_decisions:
- source_word: Πάρθοι
  choice: orang Partia
  rationale: Bentuk etnonim yang lazim dan mudah dipahami dalam bahasa Indonesia, dengan 'orang' untuk menandai kelompok bangsa.
- source_word: Μῆδοι
  choice: orang Media
  rationale: Nama baku bagi bangsa yang berasal dari Media; kata 'orang' dipahami dari unsur pertama dalam rangkaian.
- source_word: Ἐλαμῖται
  choice: orang Elam
  rationale: Nama yang lazim bagi penduduk atau bangsa Elam, sesuai bentuk etnonim Yunani.
- source_word: οἱ κατοικοῦντες
  choice: mereka yang tinggal di
  rationale: Mempertahankan fungsi partisipel substantival dan terdengar alami dalam bahasa Indonesia modern.
- source_word: τὴν Μεσοποταμίαν
  choice: Mesopotamia
  rationale: Nama geografis baku dalam bahasa Indonesia.
- source_word: Ἰουδαίαν
  choice: Yudea
  rationale: Bentuk nama wilayah yang lazim dalam bahasa Indonesia Alkitabiah dan tetap jelas bagi pembaca umum.
- source_word: τε καὶ
  choice: dan
  rationale: Dalam rangkaian geografis ini, 'dan' menyampaikan koordinasi dengan alami tanpa memaksakan nuansa tambahan yang tidak pasti.
- source_word: Καππαδοκίαν
  choice: Kapadokia
  rationale: Bentuk nama wilayah yang lazim dalam bahasa Indonesia.
- source_word: Πόντον
  choice: Pontus
  rationale: Bentuk geografis yang lazim dalam bahasa Indonesia.
- source_word: τὴν Ἀσίαν
  choice: Asia
  rationale: Mempertahankan nama wilayah dalam teks sumber; catatan kaki menjelaskan bahwa yang dimaksud ialah provinsi Romawi, bukan benua modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam bermartabat dan mudah dibaca. Daftar bangsa dan wilayah dipertahankan secara ringkas; pengulangan kata 'orang' dihindari karena sudah jelas mencakup tiga etnonim pertama. Koma akhir dipertahankan karena ayat ini berlanjut ke ayat berikutnya.
