  terminology: Partia, Media, Elam, Mesopotamia, Yudea, Kapadokia, Pontus, dan Asia merupakan bentuk nama yang lazim dalam penggunaan Alkitabiah Indonesia. Catatan kaki pada Asia ditempatkan pada jangkar yang tepat dan dengan benar membedakan provinsi Romawi itu dari benua Asia modern.
