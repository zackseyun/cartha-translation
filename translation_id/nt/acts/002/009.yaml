  source_fidelity: 'Teks dengan setia mempertahankan urutan dan cakupan daftar Yunani: tiga kelompok etnis, diikuti para penghuni Mesopotamia serta wilayah Yudea, Kapadokia, Pontus, dan Asia. "Serta mereka yang tinggal di" secara wajar menerjemahkan καὶ οἱ κατοικοῦντες tanpa menambahkan penafsiran. "Dan" untuk τε καί cukup tepat dalam daftar ini dan tidak memaksakan nuansa yang diperdebatkan.'
