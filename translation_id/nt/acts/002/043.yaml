id: ACT.2.43
reference: Acts 2:43
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Ἐγίνετο δὲ πάσῃ ψυχῇ φόβος, πολλά ⸀τε τέρατα καὶ σημεῖα διὰ τῶν ἀποστόλων ἐγίνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/043.yaml
  text: And fear came upon every soul[a], and many wonders and signs were being done through the apostles.
translation:
  language: id
  text: Lalu rasa takut meliputi setiap orang[a], dan banyak perbuatan ajaib serta tanda terjadi melalui para rasul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rasa gentar meliputi semua orang.” Secara harfiah, bahasa Yunani berbunyi “rasa takut meliputi setiap jiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγίνετο ... φόβος
  choice: rasa takut meliputi
  rationale: Bentuk imperfek γίνομαι dengan φόβος menggambarkan keadaan yang timbul lalu berlangsung. 'Rasa takut meliputi' alami dalam bahasa Indonesia dan mempertahankan daya ungkap teks.
- source_word: δὲ
  choice: Lalu
  rationale: δέ meneruskan alur narasi tanpa menyatakan pertentangan kuat; 'lalu' menghubungkan ayat ini dengan uraian sebelumnya secara wajar.
- source_word: πάσῃ ψυχῇ
  choice: setiap orang
  rationale: Secara harfiah berarti 'setiap jiwa', tetapi ψυχή di sini merujuk kepada pribadi. 'Setiap orang' menyampaikan maksud ungkapan itu secara alami tanpa menimbulkan kesan bahwa hanya unsur batin manusia yang dimaksud.
- source_word: φόβος
  choice: rasa takut
  rationale: φόβος dapat mencakup rasa takut maupun gentar atau takjub di hadapan karya ilahi. 'Rasa takut' merupakan padanan langsung yang mempertahankan ketegangan maknanya; alternatif dicatat dalam catatan kaki.
- source_word: πολλά
  choice: banyak
  rationale: Padanan kuantitatif yang langsung dan alami.
- source_word: τέρατα
  choice: perbuatan ajaib
  rationale: τέρατα menekankan sifat kejadian yang mencengangkan. 'Perbuatan ajaib' alami dalam bahasa Indonesia dan tetap dibedakan dari σημεῖα.
- source_word: σημεῖα
  choice: tanda
  rationale: σημεῖα menyoroti fungsi kejadian sebagai penunjuk atau bukti; 'tanda' mempertahankan nuansa itu.
- source_word: διὰ τῶν ἀποστόλων
  choice: melalui para rasul
  rationale: διά dengan genitif menunjukkan perantaraan atau sarana. 'Melalui para rasul' mempertahankan kemungkinan bahwa Allah adalah pelaku utama yang tersirat dan para rasul adalah perantara-Nya.
- source_word: ἐγίνετο
  choice: terjadi
  rationale: Imperfek kedua menggambarkan banyak perbuatan ajaib dan tanda yang terus berlangsung atau berulang. 'Terjadi' tidak memaksakan bentuk pasif yang tidak dinyatakan secara gramatikal, sementara konteks perantara tetap hadir dalam frasa 'melalui para rasul'.
theological_decisions:
- issue: Nuansa φόβος sebagai tanggapan terhadap karya ilahi
  choice: rasa takut
  alternative: rasa gentar atau takjub
  rationale: '''Rasa takut'' mempertahankan kekuatan leksikal φόβος dan tidak mempersempitnya menjadi kekaguman religius saja. Catatan kaki mengakui nuansa alternatifnya.'
- issue: Pelaku utama perbuatan ajaib dan tanda
  choice: terjadi melalui para rasul
  alternative: dilakukan oleh para rasul
  rationale: Ungkapan Yunani memakai γίνομαι dan διά dengan genitif. Terjemahan ini mempertahankan para rasul sebagai perantara tanpa secara eksplisit menjadikan mereka pelaku utama atau menambahkan penyebutan Allah yang tidak tertulis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat lancar bagi pembaca umum, sementara catatan kaki mempertahankan ungkapan harfiah dan ambiguitas φόβος.
