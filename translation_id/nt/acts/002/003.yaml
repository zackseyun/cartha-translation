  text: καὶ ὤφθησαν αὐτοῖς διαμεριζόμεναι γλῶσσαι ὡσεὶ πυρός, ⸂καὶ ἐκάθισεν⸃ ἐφ’ ἕνα ἕκαστον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/003.yaml
  text: And tongues like fire appeared to them, being divided, and it came to rest on each one of them[a].
translation:
  language: id
  text: Lalu tampaklah kepada mereka lidah-lidah yang terbagi-bagi, seperti api, dan hinggaplah pada setiap orang di antara mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “lidah-lidah seperti api yang sedang terbagi-bagi” atau “lidah-lidah, seolah-olah dari api.” Susunan bahasa Yunani menonjolkan baik wujud yang tampak maupun pembagiannya kepada mereka. Kata kerja “hinggaplah” dalam bahasa Yunani berbentuk tunggal, walaupun “lidah-lidah” berbentuk jamak; rujukan tunggalnya tidak dinyatakan secara tegas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθησαν αὐτοῖς
  choice: tampaklah kepada mereka
  rationale: Mengungkapkan kemunculan yang dapat dilihat oleh mereka secara alami dalam bahasa Indonesia tanpa memberi kesan bahwa mereka sekadar melihat sesuatu yang sudah ada.
- source_word: διαμεριζόμεναι
  choice: yang terbagi-bagi
  rationale: Mempertahankan bentuk partisip yang menerangkan 'lidah-lidah' serta membiarkan terbuka apakah tekanannya pada proses pemisahan atau penyebarannya kepada orang-orang yang hadir.
- source_word: γλῶσσαι
  choice: lidah-lidah
  rationale: Mempertahankan citra bentuk lidah sekaligus kaitan leksikal dengan tema bahasa dan ujaran dalam konteks berikutnya; 'nyala api' akan menghilangkan kaitan tersebut.
- source_word: ὡσεὶ πυρός
  choice: seperti api
  rationale: Menjaga perbandingan yang dinyatakan ὡσεὶ dan tidak menyatakan bahwa gejala itu benar-benar api.
- source_word: ἐκάθισεν
  choice: sesuatu itu hinggap
  rationale: Kata kerja Yunani berbentuk tunggal. 'Hinggap' wajar untuk sesuatu yang turun lalu berhenti di atas seseorang, sedangkan subjek eksplisit 'sesuatu itu' mempertahankan ketegangan antara lidah-lidah yang jamak dan kata kerja yang tunggal tanpa memaksakan rujukan tertentu.
- source_word: ἐφ’ ἕνα ἕκαστον αὐτῶν
  choice: pada masing-masing dari mereka
  rationale: Mempertahankan penekanan distributif bahwa setiap orang menerima manifestasi itu.
theological_decisions:
- issue: Hakikat manifestasi pada hari Pentakosta
  choice: lidah-lidah seperti api
  alternative: nyala-nyala api; bahasa-bahasa seperti api
  rationale: Teks Yunani menggunakan kata perbandingan ὡσεὶ dan nomina γλῶσσαι. Terjemahan ini tidak menjadikannya api harfiah dan tidak pula lebih dahulu membatasinya sebagai bahasa yang diucapkan.
- issue: Ketidaksesuaian gramatikal antara subjek jamak dan verba tunggal
  choice: mempertahankan verba tunggal dengan 'sesuatu itu hinggap'
  alternative: lidah-lidah itu hinggap
  rationale: ἐκάθισεν berbentuk tunggal, sementara γλῶσσαι berbentuk jamak. Terjemahan mempertahankan ketegangan teks dan tidak diam-diam mengubah verba menjadi jamak, meskipun rujukan subjek tunggalnya tetap tidak tegas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Partikel '-lah' pada 'tampaklah' memberi kelancaran narasi tanpa membuat gaya terlalu arkais. Frasa 'sesuatu itu' sengaja digunakan untuk menjaga bentuk tunggal ἐκάθισεν dan ambiguitas rujukannya.
