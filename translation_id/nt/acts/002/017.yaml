  source_fidelity: 'Draf pada dasarnya setia kepada teks Yunani: urutan kelompok, janji bernubuat, penglihatan, dan mimpi semuanya dipertahankan. Namun formula kutipan dalam teks utama perlu ditata ulang agar sintaks bahasa Indonesia jelas, dan catatan b saat ini secara keliru mengontraskan “dari Roh-Ku” dengan “Roh-Ku,” padahal yang perlu dijelaskan ialah pilihan untuk menerjemahkan ἀπό sebagai “dari” alih-alih menghilangkannya.'
  naturalness: “Laki-laki yang tua di antara kamu” terdengar berbelit dalam bahasa Indonesia modern. “Laki-laki tuamu” lebih ringkas, tetap maskulin, dan mempertahankan kontras usia dengan “para pemudamu.” Susunan tanda kutip yang direvisi juga lebih alami untuk formula kenabian.
  terminology: “Roh-Ku,” “bernubuat,” dan “penglihatan” tepat untuk register kenabian. “Semua manusia” merupakan pengungkapan idiomatis yang dapat diterima untuk πᾶσα σάρξ, dengan “segala daging” dipertahankan dalam catatan kaki. “Laki-laki tuamu” menghindari kesan jabatan yang mungkin timbul dari “para penatuamu.”
