    rationale: Penataan “Pada hari-hari terakhir akan terjadi, firman Allah:” membuat hubungan formula ilahi dengan isi kutipan jelas. “Laki-laki tuamu” lebih idiomatis daripada “laki-laki yang tua di antara kamu,” tanpa mengubah rujukan usia dan gender.
