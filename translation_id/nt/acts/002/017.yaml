id: ACT.2.17
reference: Acts 2:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἔσται ἐν ταῖς ἐσχάταις ἡμέραις, λέγει ὁ θεός, ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα, καὶ προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν, καὶ οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται, καὶ οἱ πρεσβύτεροι ὑμῶν ⸀ἐνυπνίοις ἐνυπνιασθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/017.yaml
  text: And it will be in the last days[a], says God, that I will pour out from my Spirit on all flesh, and your sons and your daughters will prophesy, and your young men will see visions[b], and your old men will dream dreams.
translation:
  language: id
  text: '“Pada hari-hari terakhir akan terjadi, firman Allah: Aku akan mencurahkan dari Roh-Ku[b] ke atas semua manusia[a]. Anak-anak lelakimu dan anak-anak perempuanmu akan bernubuat, para pemudamu akan melihat penglihatan, dan laki-laki tuamu akan bermimpi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke atas segala daging,” suatu ungkapan kenabian yang berarti manusia secara luas.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Yunani secara harfiah berbunyi “dari Roh-Ku”; terjemahan lain dapat menghilangkan unsur “dari.” Ungkapan ini tidak harus berarti bahwa Roh Allah terbagi-bagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: pada hari-hari terakhir
  rationale: Ungkapan waktu yang alami dan mapan dalam bahasa Indonesia serta mempertahankan nuansa eskatologis tanpa menentukan cakupannya lebih jauh.
- source_word: λέγει ὁ θεός
  choice: firman Allah
  rationale: Formula kutipan kenabian yang wajar dan bermartabat dalam bahasa Indonesia; menyampaikan bahwa perkataan tersebut sedang ditegaskan sebagai ucapan Allah.
- source_word: ἐκχεῶ
  choice: Aku akan mencurahkan
  rationale: Mempertahankan metafora konkret pencurahan dan bentuk futurum.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: dari Roh-Ku
  rationale: Mempertahankan preposisi ἀπό, ‘dari’, sambil memakai huruf kapital karena konteks menunjuk kepada Roh Allah; catatan kaki menjelaskan bentuk yang agak tidak lazim ini tanpa menyiratkan bahwa Roh terbagi-bagi.
- source_word: ἐπὶ πᾶσαν σάρκα
  choice: ke atas semua manusia
  rationale: Menyampaikan makna idiom kenabian σάρξ secara alami dalam bahasa Indonesia; citra harfiahnya dipertahankan dalam catatan kaki.
- source_word: προφητεύσουσιν
  choice: akan bernubuat
  rationale: Padanan langsung dan lazim yang mempertahankan istilah kenabian.
- source_word: οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν
  choice: anak-anak lelakimu dan anak-anak perempuanmu
  rationale: Mempertahankan kedua kelompok yang disebut secara eksplisit dan penekanan pada keikutsertaan laki-laki maupun perempuan.
- source_word: οἱ νεανίσκοι ὑμῶν
  choice: pemuda-pemudamu
  rationale: Padanan alami yang mempertahankan rujukan kepada laki-laki muda.
- source_word: ὁράσεις ὄψονται
  choice: akan melihat penglihatan
  rationale: Ungkapan yang dapat dipahami dan mempertahankan hubungan leksikal antara melihat dan penglihatan.
- source_word: οἱ πρεσβύτεροι ὑμῶν
  choice: laki-laki yang tua di antara kamu
  rationale: Menunjukkan kontras usia dengan para pemuda dan menghindari ‘penatua’, yang dapat disalahpahami sebagai jabatan.
- source_word: ἐνυπνίοις ἐνυπνιασθήσονται
  choice: akan bermimpi
  rationale: Padanan Indonesia yang alami bagi konstruksi serumpun ‘memimpikan mimpi’; pengulangan harfiah akan terdengar janggal.
theological_decisions:
- issue: Cakupan dan daya idiomatis ἐπὶ πᾶσαν σάρκα
  choice: semua manusia dalam teks utama, dengan bentuk harfiah ‘segala daging’ dalam catatan kaki
  alternative: segala daging
  rationale: Ungkapan Yunani memakai citra ‘daging’ sebagai idiom kenabian bagi manusia secara luas. Teks utama dibuat alami, sedangkan catatan mempertahankan citra dan hubungan antarteksnya.
- issue: Rujukan πνεῦμα dalam pencurahan ilahi
  choice: Roh-Ku
  alternative: roh-Ku
  rationale: Konteks secara langsung menyebut Roh milik Allah; kapitalisasi membantu menunjukkan referen ilahi tanpa menambahkan penafsiran tentang cara keberadaan-Nya.
- issue: Arti preposisi ἀπό pada ἀπὸ τοῦ πνεύματός μου
  choice: mempertahankan ‘dari Roh-Ku’
  alternative: mencurahkan Roh-Ku
  rationale: Bentuk ‘dari’ mengikuti teks Yunani dan mempertahankan ketegangan ungkapannya. Catatan menegaskan bahwa konstruksi itu tidak harus berarti Roh Allah dibagi menjadi bagian-bagian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada kenabian. Susunan kutipan mempertahankan formula ‘firman Allah’. Istilah ‘bernubuat’ dan ‘penglihatan’ dipertahankan karena jelas dan lazim dalam konteks Alkitab. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya.
