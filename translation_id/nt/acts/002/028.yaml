  yaml_path: translation/nt/acts/002/028.yaml
  text: You made known to me the paths of life[b][a]; you will fill me with gladness with your presence.
translation:
  language: id
  text: Engkau telah memberitahukan kepadaku jalan-jalan kehidupan[a]; Engkau akan memenuhi aku dengan sukacita di hadapan-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “jalan-jalan menuju kehidupan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bersama wajah-Mu”; maksudnya, dalam kehadiran-Mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισάς μοι
  choice: Engkau telah memberitahukan kepadaku
  rationale: Bentuk aoris orang kedua tunggal menyatakan bahwa Allah membuat sesuatu diketahui oleh pembicara. Bentuk ‘telah memberitahukan’ alami dalam kutipan ini dan mempertahankan objek tak langsung μοι.
- source_word: ὁδοὺς ζωῆς
  choice: jalan-jalan kehidupan
  rationale: '‘Jalan-jalan’ mempertahankan bentuk jamak dan gambaran konkret ὁδός. Frasa genitif ‘kehidupan’ dibiarkan cukup terbuka: jalan yang bercirikan kehidupan atau yang menuju kehidupan.'
- source_word: πληρώσεις με
  choice: Engkau akan memenuhi aku
  rationale: Menerjemahkan secara langsung bentuk future aktif orang kedua tunggal dan objeknya, tanpa mengurangi kepastian pernyataan.
- source_word: εὐφροσύνης
  choice: dengan sukacita
  rationale: Genitif ini menyatakan isi dari tindakan memenuhi. ‘Sukacita’ menyampaikan kegembiraan mendalam dan sesuai dengan ragam bahasa Alkitab yang tetap mudah dipahami.
- source_word: μετὰ τοῦ προσώπου σου
  choice: di hadapan-Mu
  rationale: Secara harfiah frasa ini berarti ‘bersama wajah-Mu’, tetapi merupakan ungkapan tentang kehadiran pribadi. ‘Di hadapan-Mu’ terdengar alami dalam bahasa Indonesia dan tetap mempertahankan gambaran relasionalnya.
theological_decisions:
- issue: Ungkapan kehadiran ilahi dalam kutipan Mazmur
  choice: di hadapan-Mu
  alternative: bersama wajah-Mu
  rationale: Pilihan utama menyampaikan kedekatan dengan Allah secara alami tanpa menambahkan penafsiran doktrinal. Catatan kaki mempertahankan bentuk harfiahnya agar citra ‘wajah’ dalam teks sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Paralelisme kedua klausa dan bentuk sapaan langsung dipertahankan.
