base_translation:
  language: en
  yaml_path: translation/nt/acts/002/044.yaml
  text: And all the believers were together and had all things in common,[a]
translation:
  language: id
  text: Semua orang percaya itu berkumpul dan memiliki segala sesuatu sebagai milik bersama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berada bersama-sama” atau “berada di tempat yang sama.” Ungkapan Yunani ini dapat menunjuk pada kebersamaan atau pertemuan di satu tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: semua
  rationale: Mempertahankan cakupan menyeluruh yang menerangkan kelompok orang percaya.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai kelanjutan narasi; dalam bahasa Indonesia modern, hubungan itu sudah wajar tanpa kata penghubung khusus.
- source_word: οἱ πιστεύοντες
  choice: orang yang percaya itu
  rationale: Menyampaikan partisipel substantival sebagai sebutan bagi komunitas yang percaya, dengan bentuk yang alami dan tetap dekat dengan struktur Yunani.
- source_word: ἦσαν ἐπὶ τὸ αὐτό
  choice: berkumpul
  rationale: Ungkapan ini dapat menyatakan kebersamaan atau keberadaan di tempat yang sama; 'berkumpul' menyampaikan nuansa komunal tanpa menentukan lokasi secara berlebihan.
- source_word: εἶχον
  choice: memiliki
  rationale: Menerjemahkan verba imperfek secara alami; konteks narasi mendukung keadaan atau kebiasaan yang berlangsung.
- source_word: ἅπαντα κοινά
  choice: memiliki segala sesuatu bersama-sama
  rationale: Mengungkapkan bahwa segala milik mereka diperlakukan sebagai milik bersama, sambil menghindari penambahan rincian yang tidak dinyatakan dalam ayat.
theological_decisions:
- issue: Sifat kehidupan bersama komunitas
  choice: Ayat ini diterjemahkan sebagai laporan deskriptif bahwa orang-orang percaya memiliki segala sesuatu bersama-sama.
  alternative: Menjadikannya perintah tentang sistem ekonomi yang wajib berlaku bagi semua komunitas Kristen.
  rationale: Teks Yunani melaporkan keadaan dan praktik komunitas itu, bukan memberikan perintah eksplisit atau menetapkan aturan universal.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Orang yang percaya itu' mempertahankan acuan kepada kelompok yang baru disebutkan dalam narasi, sedangkan 'berkumpul' dipilih untuk kelancaran tanpa meniadakan alternatif lokatif yang dicatat dalam catatan kaki.
