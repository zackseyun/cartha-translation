id: ACT.2.22
reference: Acts 2:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἄνδρες Ἰσραηλῖται, ἀκούσατε τοὺς λόγους τούτους. Ἰησοῦν τὸν Ναζωραῖον, ἄνδρα ⸂ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ⸃ εἰς ὑμᾶς δυνάμεσι καὶ τέρασι καὶ σημείοις οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς ἐν μέσῳ ὑμῶν, ⸀καθὼς αὐτοὶ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/022.yaml
  text: 'Men of Israel[a], hear these words: Jesus the Nazarene, a man attested to you by God with miracles and wonders and signs that God did through him in your midst[b], just as you yourselves know—'
translation:
  language: id
  text: '“Wahai para pria Israel, dengarkanlah kata-kata ini: Yesus, orang Nazaret[a], seorang laki-laki yang telah Allah teguhkan di hadapan kalian melalui perbuatan-perbuatan penuh kuasa, keajaiban-keajaiban, dan tanda-tanda[b] yang Allah lakukan melalui dia di tengah-tengah kalian, sebagaimana kalian sendiri ketahui—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yesus dari Nazaret” atau “Yesus orang Nazorean.” Sebutan Yunani Ναζωραῖος dapat diterjemahkan dalam lebih dari satu bentuk.
    reason: lexical_alternative
  - marker: b
    text: Atau, “mukjizat, keajaiban, dan tanda-tanda.” Kata Yunani δυνάμεσι dapat diterjemahkan lebih harfiah sebagai “kuasa-kuasa” atau, dalam konteks ini, secara idiomatis sebagai “mukjizat”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Saudara-saudara laki-laki Israel
  rationale: Sapaan ini mempertahankan bentuk maskulin ἄνδρες sekaligus identitas etnis Ἰσραηλῖται. Walaupun sedikit lebih formal daripada sapaan sehari-hari, bentuk ini jelas dan tidak menetralkan unsur laki-laki dalam bahasa sumber.
- source_word: ἀκούσατε τοὺς λόγους τούτους
  choice: dengarkanlah perkataan ini
  rationale: Bentuk imperatif ἀκούσατε meminta perhatian langsung. 'Perkataan ini' dekat dengan λόγους τούτους tanpa memperluasnya secara interpretatif menjadi 'pesan berikut ini'.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Yesus orang Nazaret
  rationale: Ungkapan ini merupakan sebutan yang menghubungkan Yesus dengan Nazaret. 'Orang Nazaret' alami dalam bahasa Indonesia serta mempertahankan fungsi deskriptif atau sebutannya.
- source_word: ἄνδρα ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ εἰς ὑμᾶς
  choice: seorang yang telah Allah nyatakan kepadamu
  rationale: '''Seorang'' merujuk kepada seorang laki-laki yang baru disebut tanpa pengulangan kaku. ''Telah Allah nyatakan kepadamu'' menyampaikan tindakan Allah yang menunjukkan atau membuktikan siapa Yesus di hadapan para pendengar, sambil membiarkan sarana pembuktiannya dijelaskan oleh frasa berikut.'
- source_word: δυνάμεσι καὶ τέρασι καὶ σημείοις
  choice: melalui perbuatan penuh kuasa, keajaiban, dan tanda-tanda
  rationale: Tiga unsur formula Yunani dipertahankan. 'Perbuatan penuh kuasa' menampilkan hubungan δυνάμεσι dengan kuasa secara lebih transparan daripada hanya 'mukjizat', sedangkan 'keajaiban' dan 'tanda-tanda' mempertahankan nuansa dua istilah berikutnya.
- source_word: οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς
  choice: yang Allah lakukan melalui dia
  rationale: Allah tetap menjadi pelaku gramatikal, sedangkan Yesus dinyatakan sebagai perantara tindakan itu, sesuai ὁ θεὸς dan δι’ αὐτοῦ.
- source_word: ἐν μέσῳ ὑμῶν
  choice: di tengah-tengah kalian
  rationale: Ungkapan ini mempertahankan gambaran tindakan yang berlangsung di antara para pendengar. 'Kalian' menjelaskan bahwa kata ganti orang kedua berbentuk jamak.
- source_word: καθὼς αὐτοὶ οἴδατε
  choice: seperti yang kalian sendiri ketahui
  rationale: '''Kalian sendiri'' mempertahankan penekanan αὐτοὶ, yaitu bahwa para pendengar mempunyai pengetahuan langsung mengenai peristiwa tersebut.'
theological_decisions:
- issue: Penyebutan kemanusiaan Yesus dalam ἄνδρα
  choice: Menerjemahkan rujukannya dengan 'seorang' setelah nama Yesus
  alternative: seorang laki-laki; seorang manusia
  rationale: Bahasa Yunani secara eksplisit menyebut Yesus sebagai ἄνδρα. Dalam susunan bahasa Indonesia, 'Yesus ..., seorang yang ...' secara alami merujuk kepada seorang laki-laki dan mempertahankan pernyataan tentang kemanusiaannya tanpa membuat ungkapan terasa klinis atau menambahkan penjelasan teologis.
- issue: Pelaku dalam klausa mengenai perbuatan penuh kuasa
  choice: 'Menjadikan Allah subjek: ''yang Allah lakukan melalui dia'''
  alternative: yang dilakukannya; yang Allah kerjakan olehnya
  rationale: Teks Yunani secara eksplisit menempatkan Allah sebagai subjek dan Yesus sebagai perantara. Terjemahan mempertahankan bentuk penyajian ayat ini tanpa menggunakannya untuk mengurangi atau memperluas kristologi Perjanjian Baru secara keseluruhan.
- issue: Makna ἀποδεδειγμένον
  choice: telah Allah nyatakan kepadamu
  alternative: telah Allah buktikan kepadamu; telah Allah teguhkan di hadapanmu
  rationale: Kata Yunani dapat menyatakan tindakan menunjukkan, membuktikan, atau meneguhkan secara terbuka. 'Nyatakan' cukup luas untuk menjaga rentang itu dan menghindari tambahan objek pelengkap seperti 'sebagai Mesias' yang tidak terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lisan yang khidmat karena ayat ini merupakan pidato publik. 'Kalian' dipakai untuk memperjelas bentuk jamak kata ganti Yunani; 'dengarkanlah' dan 'seperti yang kalian sendiri ketahui' menjaga tekanan retoris. Tanda pisah pada akhir ayat dipertahankan karena kalimat berlanjut ke ayat berikutnya.
