base_translation:
  language: en
  yaml_path: translation/nt/acts/002/041.yaml
  text: So those who received his word were baptized[a], and about three thousand souls were added on that day.
translation:
  language: id
  text: Jadi, mereka yang menerima perkataannya dibaptis, dan pada hari itu ditambahkan kira-kira tiga ribu jiwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang.” Kata Yunani yang diterjemahkan “jiwa” lazim digunakan untuk menghitung manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν οὖν
  choice: Jadi, mereka yang
  rationale: Gabungan partikel ini menandai kelanjutan sekaligus hasil dari pemberitaan Petrus. “Jadi” menyampaikan alur tersebut secara alami tanpa membuat hubungan logisnya terlalu kaku.
- source_word: ἀποδεξάμενοι
  choice: menerima
  rationale: Kata ini menunjukkan sambutan positif terhadap pemberitaan. “Menerima” mempertahankan keluasan maknanya tanpa menambahkan penafsiran lebih jauh.
- source_word: τὸν λόγον αὐτοῦ
  choice: perkataannya
  rationale: Dalam konteks ini λόγος menunjuk pada perkataan atau pesan yang diberitakan Petrus. “Perkataannya” dekat dengan bentuk Yunani dan tetap wajar dalam bahasa Indonesia; “pesannya” merupakan alternatif yang lebih dinamis.
- source_word: ἐβαπτίσθησαν
  choice: dibaptis
  rationale: Bentuk pasif aoris diterjemahkan langsung sebagai peristiwa yang terjadi, tanpa memasukkan pandangan denominasi tertentu tentang cara atau dampak baptisan.
- source_word: προσετέθησαν
  choice: ditambahkan
  rationale: Bentuk pasif ini menyatakan bahwa mereka dimasukkan ke dalam kelompok yang sedang bertumbuh. Objeknya tidak disebutkan secara eksplisit dalam ayat Yunani, sehingga tidak ditambahkan dalam teks utama.
- source_word: ψυχαὶ
  choice: jiwa
  rationale: “Jiwa” mempertahankan padanan formal bagi ψυχή dan juga dapat dipakai dalam bahasa Indonesia untuk menghitung manusia. Catatan kaki menjelaskan bahwa yang dimaksud ialah orang-orang, sehingga istilah ini tidak disalahpahami sebagai pernyataan antropologis teknis.
- source_word: ὡσεὶ τρισχίλιαι
  choice: kira-kira tiga ribu
  rationale: ὡσεί menandai perkiraan; “kira-kira tiga ribu” merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: pada hari itu
  rationale: Ungkapan ini adalah padanan temporal yang alami dan langsung dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah objek dari “ditambahkan” perlu dinyatakan sebagai jemaat atau kelompok orang percaya
  choice: 'Objek dibiarkan tersirat: “ditambahkan”'
  alternative: “ditambahkan kepada mereka” atau “ditambahkan kepada jemaat”
  rationale: Teks Yunani ayat ini tidak menyebutkan objek secara eksplisit. Konteks mengarah kepada komunitas orang percaya, tetapi menyatakannya dalam teks utama akan menambahkan unsur eklesiologis yang hanya tersirat.
- issue: Makna antropologis ψυχαί
  choice: “jiwa” dalam teks utama dengan catatan bahwa artinya dapat berupa “orang” atau “orang-orang”
  alternative: “orang” atau “orang-orang” langsung dalam teks utama
  rationale: Padanan “jiwa” menjaga keterlihatan istilah Yunani, sedangkan catatan kaki mencegah pembaca menganggapnya sebagai penegasan teknis mengenai unsur nonjasmani manusia.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mengikuti gerak narasi Yunani, tetapi tetap alami. Istilah “jiwa” dipertahankan karena transparan terhadap sumber dan juga dikenal sebagai satuan penghitung manusia dalam bahasa Indonesia; penjelasan diberikan agar tidak dibaca secara terlalu teknis.
