id: ACT.2.33
reference: Acts 2:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τῇ δεξιᾷ οὖν τοῦ θεοῦ ὑψωθεὶς τήν τε ἐπαγγελίαν τοῦ ⸂πνεύματος τοῦ ἁγίου⸃ λαβὼν παρὰ τοῦ πατρὸς ἐξέχεεν τοῦτο ⸀ὃ ⸀ὑμεῖς βλέπετε καὶ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/033.yaml
  text: Therefore[a], having been exalted to the right hand of God, and having received from the Father the promise of the Holy Spirit[b], he has poured out this that you yourselves are seeing and hearing.
translation:
  language: id
  text: Karena itu[a], setelah ditinggikan ke sebelah kanan Allah dan menerima dari Bapa janji tentang Roh Kudus[b], Ia telah mencurahkan ini, yang kamu sendiri lihat dan dengar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “oleh tangan kanan Allah.” Bentuk datif dalam bahasa Yunani dapat dipahami sebagai tempat atau tujuan pemuliaan (“ke sebelah kanan”) maupun sebagai sarana (“oleh tangan kanan”).
    reason: alternative_reading
  - marker: b
    text: Atau, “Roh Kudus yang dijanjikan.” Frasa Yunani dapat menunjuk kepada Roh sendiri sebagai karunia yang dijanjikan atau kepada janji mengenai Roh.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δεξιᾷ τοῦ θεοῦ
  choice: ke sebelah kanan Allah
  rationale: Datif dipahami secara lokatif, selaras dengan tema pemuliaan dan penobatan dalam konteks dekat; kemungkinan instrumental tetap dicatat dalam catatan kaki.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya mengenai kebangkitan Yesus dan nubuat Daud.
- source_word: ὑψωθεὶς
  choice: setelah ditinggikan
  rationale: Partisip aoris pasif menyatakan tindakan pemuliaan yang mendahului tindakan utama; bentuk ini alami dalam bahasa Indonesia dan mempertahankan bahwa Yesus menerima tindakan tersebut.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου
  choice: janji tentang Roh Kudus
  rationale: Mempertahankan bentuk eksplisit 'janji' dan membiarkan terbuka apakah genitif menunjuk kepada Roh sebagai karunia yang dijanjikan atau kepada janji mengenai Roh.
- source_word: λαβὼν παρὰ τοῦ πατρὸς
  choice: menerima dari Bapa
  rationale: Mempertahankan Bapa sebagai sumber dan menyajikan tindakan yang mendahului pencurahan.
- source_word: ἐξέχεεν
  choice: Ia telah mencurahkan
  rationale: Mengungkapkan tindakan yang telah terjadi dengan akibat yang sedang nyata di hadapan para pendengar.
- source_word: τοῦτο ὃ ὑμεῖς βλέπετε καὶ ἀκούετε
  choice: apa yang sekarang kamu sendiri lihat dan dengar ini
  rationale: Menjaga demonstratif 'ini', penekanan pada ὑμεῖς melalui 'kamu sendiri', serta sifat langsung dari apa yang sedang disaksikan dan didengar.
theological_decisions:
- issue: Apakah τῇ δεξιᾷ τοῦ θεοῦ berarti ditinggikan 'ke sebelah kanan Allah' atau 'oleh tangan kanan Allah'
  choice: ke sebelah kanan Allah
  alternative: oleh tangan kanan Allah
  rationale: Bacaan lokatif paling sesuai dengan motif penobatan dan kutipan Mazmur 110 dalam konteks, tetapi bentuk datif Yunani juga memungkinkan pengertian instrumental sehingga alternatif tersebut dipertahankan.
- issue: Apakah τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου menunjuk kepada Roh sebagai karunia yang dijanjikan atau janji mengenai Roh
  choice: janji tentang Roh Kudus
  alternative: Roh Kudus yang dijanjikan
  rationale: Terjemahan utama mengikuti susunan Yunani dengan wajar dan tidak menutup ambiguitas genitif. Konteks pencurahan mendukung pemahaman Roh sebagai karunia yang dijanjikan, yang dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Ia' dipakai untuk subjek Yesus agar rujukannya jelas; 'kamu sendiri' mempertahankan penekanan pada kata ganti Yunani. Susunan akhir dengan 'ini' dipertahankan secara idiomatis untuk menunjuk kepada peristiwa yang sedang dialami para pendengar.
