  text: καὶ δώσω τέρατα ἐν τῷ οὐρανῷ ἄνω καὶ σημεῖα ἐπὶ τῆς γῆς κάτω, αἷμα καὶ πῦρ καὶ ἀτμίδα καπνοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/019.yaml
  text: 'And I will give wonders in the heaven above and signs on the earth below: blood and fire and a cloud of smoke.'
translation:
  language: id
  text: 'Aku akan mengadakan keajaiban-keajaiban di langit di atas dan tanda-tanda di bumi di bawah: darah, api, dan kepulan asap.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “uap asap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δώσω
  choice: Aku akan mengadakan
  rationale: Secara harfiah berarti 'Aku akan memberikan', tetapi dalam bahasa Indonesia 'mengadakan' secara alami menyatakan bahwa Allah menyebabkan atau menghadirkan keajaiban dan tanda, tanpa menyempitkannya menjadi sekadar memperlihatkan.
- source_word: τέρατα
  choice: berbagai keajaiban
  rationale: Mengacu pada fenomena luar biasa yang membangkitkan rasa gentar atau takjub. 'Keajaiban' mempertahankan pasangan biblis dengan 'tanda-tanda' dan tidak membatasinya pada mukjizat penyembuhan.
- source_word: ἐν τῷ οὐρανῷ ἄνω
  choice: di langit di atas
  rationale: Dalam konteks gejala kosmis yang kasatmata dan berlawanan dengan bumi di bawah, 'langit' merupakan padanan Indonesia yang alami bagi οὐρανός sekaligus tidak menafikan cakupan kosmis ungkapan itu.
- source_word: σημεῖα
  choice: tanda-tanda
  rationale: Menyatakan fenomena yang memiliki makna sebagai petunjuk, serta mempertahankan pasangan umum 'keajaiban dan tanda-tanda'.
- source_word: ἐπὶ τῆς γῆς κάτω
  choice: di bumi di bawah
  rationale: γῆ di sini berkontras dengan langit dan karena itu berarti bumi, bukan sekadar tanah atau suatu negeri.
- source_word: αἷμα
  choice: darah
  rationale: Padanan langsung yang mempertahankan gambaran apokaliptis yang konkret.
- source_word: πῦρ
  choice: api
  rationale: Padanan langsung yang mempertahankan gambaran unsur alam yang kuat.
- source_word: ἀτμίδα καπνοῦ
  choice: gumpalan asap
  rationale: ἀτμίς dapat berarti uap, kabut, atau embusan. 'Gumpalan asap' alami dalam bahasa Indonesia dan menggambarkan massa asap yang tampak; bentuk yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Lokasi kosmis dalam kutipan nubuat Yoel
  choice: langit di atas ... bumi di bawah
  alternative: surga di atas ... negeri di bawah
  rationale: Konteks menyebut fenomena kosmis yang tampak dan membentuk kontras vertikal antara langit dan bumi. Pilihan ini mempertahankan cakupan nubuat tanpa mengartikannya khusus sebagai tempat kediaman ilahi ataupun membatasinya pada suatu negeri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada nubuat. Kata ganti 'Aku' mempertahankan ujaran langsung Allah dalam konteks kutipan. Tanda titik dua dipakai secara alami untuk memperkenalkan rincian tanda-tanda yang menyusul.
