  yaml_path: translation/nt/acts/002/013.yaml
  text: But others[a], mocking, were saying, “They are filled with sweet wine.”
translation:
  language: id
  text: Namun, yang lain mengejek sambil berkata, “Mereka sudah penuh dengan anggur manis[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anggur baru.” Kata Yunani γλεῦκος merujuk pada anggur segar yang manis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: yang lain
  rationale: Adjektiva ini dipakai secara substantival untuk menunjuk kelompok lain di antara orang banyak; “yang lain” paling alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai pertentangan dengan tanggapan pada ayat sebelumnya; “Namun” menyampaikan kontras itu dengan jelas.
- source_word: διαχλευάζοντες
  choice: mengejek
  rationale: Partisip ini menyatakan olok-olok yang merendahkan; “mengejek” jelas dan wajar tanpa melebih-lebihkan nuansanya.
- source_word: ἔλεγον
  choice: terus berkata
  rationale: Bentuk imperfek menunjukkan perkataan yang berlangsung atau berulang; “terus berkata” mempertahankan aspek tersebut secara alami.
- source_word: ὅτι
  choice: memperkenalkan kutipan langsung
  rationale: ὅτι memperkenalkan isi perkataan; kutipan langsung paling alami dan hidup dalam bahasa Indonesia.
- source_word: Γλεύκους
  choice: anggur manis
  rationale: γλεῦκος merujuk pada anggur segar yang manis; “anggur manis” lebih tepat secara leksikal daripada sekadar “anggur baru”.
- source_word: μεμεστωμένοι
  choice: sudah penuh
  rationale: Partisip perfek pasif menggambarkan keadaan sebagai hasil yang telah tercapai. “Sudah penuh” mempertahankan nuansa keadaan hasil itu dan cocok dengan konstruksi genitif.
- source_word: εἰσίν
  choice: tersirat dalam frasa “sudah penuh”
  rationale: Kopula kini Yunani tidak perlu diterjemahkan secara terpisah karena predikat bahasa Indonesia secara alami tidak memakai kata “adalah”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. “Terus berkata” mempertahankan aspek imperfek, sedangkan “sudah penuh” mencerminkan keadaan hasil dari bentuk perfek tanpa menambahkan penafsiran bahwa mereka benar-benar mabuk.
