  yaml_path: translation/nt/acts/002/016.yaml
  text: But this is what was spoken through the prophet Joel:[a]
translation:
  language: id
  text: Namun, inilah yang telah dikatakan melalui Nabi Yoel:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “oleh Nabi Yoel.” Kata depan Yunani ini dapat menyatakan pelaku, tetapi “melalui” lebih jelas mempertahankan peran Yoel sebagai perantara kenabian yang menyampaikan pesan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai sanggahan terhadap kesalahpahaman orang banyak pada konteks sebelumnya dengan penghubung pertentangan yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: τοῦτό
  choice: inilah
  rationale: Menunjuk secara tegas pada peristiwa yang sedang disaksikan; bentuk ini alami dalam konstruksi penjelasan bahasa Indonesia.
- source_word: ἐστιν
  choice: adalah (terungkap dalam konstruksi “inilah”)
  rationale: Kopula Yunani dipertahankan secara idiomatis melalui konstruksi ekuatif “inilah”, tanpa menafsirkannya sebagai 'berarti' atau 'merupakan penggenapan'.
- source_word: τὸ εἰρημένον
  choice: yang telah difirmankan
  rationale: Partisip perfekt pasif substantival menyatakan sesuatu yang sudah diucapkan dan tetap berlaku sebagai perkataan tertulis. 'Difirmankan' sesuai dengan konteks ujaran kenabian ilahi, sementara 'telah' mencerminkan aspek perfekt tanpa kekakuan.
- source_word: διὰ
  choice: melalui
  rationale: Dengan genitif dan perantara manusia, διά menyatakan perantaraan atau keagenan; 'melalui' mempertahankan peran Yoel sebagai penyampai pesan.
- source_word: τοῦ προφήτου
  choice: Nabi
  rationale: Gelar yang menerangkan nama Yoel paling alami tanpa artikel dalam bahasa Indonesia; kapitalisasi mengikuti pemakaian gelar sebelum nama diri.
- source_word: Ἰωήλ
  choice: Yoel
  rationale: Bentuk nama yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Perantaraan kenabian dalam διὰ τοῦ προφήτου Ἰωήλ
  choice: melalui Nabi Yoel
  alternative: oleh Nabi Yoel
  rationale: '''Melalui'' menjaga gambaran bahwa Yoel merupakan perantara kenabian tanpa menetapkan lebih jauh siapa pelaku utama yang tidak disebut secara eksplisit dalam klausa pasif Yunani. Pilihan ini juga tidak memasukkan teori tertentu mengenai cara pengilhaman.'
- issue: Hubungan peristiwa Pentakosta dengan nubuat Yoel
  choice: inilah yang telah difirmankan
  alternative: inilah penggenapan dari apa yang telah difirmankan
  rationale: Terjemahan mempertahankan kopula sederhana ἐστιν dan tidak menambahkan istilah 'penggenapan', sehingga kekuatan identifikasi dan ketegangan teologis teks tetap terjaga tanpa penjelasan tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. 'Namun' memberi koreksi wacana yang alami; 'inilah' mempertahankan penunjukan kuat pada peristiwa yang sedang terjadi. Tanda titik dua mengantar kutipan nubuat pada ayat berikutnya.
