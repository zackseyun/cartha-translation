  text: καὶ τὰ κτήματα καὶ τὰς ὑπάρξεις ἐπίπρασκον καὶ διεμέριζον αὐτὰ πᾶσιν καθότι ἄν τις χρείαν εἶχεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/045.yaml
  text: And they were selling their property and possessions and distributing them to all[a], as anyone had need.
translation:
  language: id
  text: Mereka terus menjual harta milik serta barang-barang mereka, lalu membagikannya kepada semua orang[a] menurut kebutuhan setiap orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “tanah dan harta benda.” Kedua istilah Yunani tampaknya membedakan jenis milik: κτήματα sering dapat menunjuk pada tanah atau properti, sedangkan ὑπάρξεις menunjuk pada barang-barang atau milik secara lebih umum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήματα
  choice: tanah milik
  rationale: Istilah ini sering menunjuk pada milik yang diperoleh, khususnya tanah atau properti tak bergerak; pilihan ini membedakannya dari ὑπάρξεις.
- source_word: ὑπάρξεις
  choice: harta benda
  rationale: Istilah ini menunjuk pada barang atau milik seseorang secara lebih umum; 'harta benda' alami dalam bahasa Indonesia dan tetap berbeda dari 'tanah milik'.
- source_word: ἐπίπρασκον
  choice: terus menjual
  rationale: Bentuk imperfek menggambarkan tindakan yang berlangsung atau dilakukan berulang kali pada masa lampau, bukan semata-mata satu penjualan yang telah selesai.
- source_word: διεμέριζον
  choice: membagikannya
  rationale: Dalam konteks ini, kata tersebut menggambarkan pembagian atau penyaluran milik yang dijual, atau hasilnya, kepada anggota komunitas.
- source_word: αὐτά
  choice: -nya
  rationale: Pronomina ini dibiarkan merujuk secara ringkas kepada tanah milik dan harta benda tadi, tanpa mempersempitnya secara eksplisit menjadi 'hasil penjualan'.
- source_word: πᾶσιν
  choice: kepada semua orang
  rationale: Datif jamak menunjukkan para penerima secara luas dalam konteks komunitas orang percaya.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: sesuai dengan kebutuhan masing-masing
  rationale: Ungkapan ini menyatakan bahwa pembagian dilakukan menurut kebutuhan setiap orang; rumusan Indonesia ini alami dan mempertahankan daya tak tentu dari ἄν τις.
theological_decisions:
- issue: Sifat praktik berbagi milik di antara orang percaya
  choice: Ayat ini menggambarkan penjualan dan pembagian yang berlangsung atau berulang sesuai kebutuhan, tanpa menyatakan bahwa kepemilikan pribadi dihapus sebagai doktrin formal.
  alternative: Ayat ini mengajarkan kepemilikan komunal penuh sebagai kewajiban normatif bagi semua orang Kristen.
  rationale: Kedua verba imperfek menggambarkan praktik berulang, sedangkan teks tidak secara eksplisit mengatakan bahwa seluruh kepemilikan pribadi berakhir atau bahwa pola ini diwajibkan secara universal. Terjemahan tetap bersifat deskriptif.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. 'Terus menjual' mempertahankan aspek tindakan yang berlangsung atau berulang. 'Sesuai dengan kebutuhan masing-masing' lebih alami daripada susunan harfiah, tanpa menambahkan gagasan bahwa semua milik dijual sekaligus.
