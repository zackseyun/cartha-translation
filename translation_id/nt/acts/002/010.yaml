id: ACT.2.10
reference: Acts 2:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Φρυγίαν τε καὶ Παμφυλίαν, Αἴγυπτον καὶ τὰ μέρη τῆς Λιβύης τῆς κατὰ Κυρήνην, καὶ οἱ ἐπιδημοῦντες Ῥωμαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/010.yaml
  text: Phrygia and Pamphylia[a], Egypt and the parts of Libya toward Cyrene, and the visiting Romans[b],
translation:
  language: id
  text: Frigia dan Pamfilia, Mesir dan wilayah-wilayah Libya di sekitar Kirene[a], serta orang-orang Roma yang sedang berkunjung[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “wilayah-wilayah Libya ke arah Kirene.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “orang-orang Roma yang sedang tinggal sementara di sini” atau “para pengunjung dari Roma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Φρυγίαν
  choice: Frigia
  rationale: Menggunakan bentuk nama wilayah yang lazim dalam Alkitab bahasa Indonesia.
- source_word: τε καὶ
  choice: dan
  rationale: Gabungan ini menghubungkan unsur-unsur dalam daftar; 'dan' paling alami dalam bahasa Indonesia.
- source_word: Παμφυλίαν
  choice: Pamfilia
  rationale: Menggunakan bentuk nama wilayah yang lazim dalam bahasa Indonesia.
- source_word: Αἴγυπτον
  choice: Mesir
  rationale: Nama baku bahasa Indonesia untuk negeri tersebut.
- source_word: τὰ μέρη
  choice: wilayah-wilayah
  rationale: Dalam konteks geografis, bentuk ini menyampaikan bagian-bagian atau kawasan suatu negeri secara wajar.
- source_word: τῆς Λιβύης
  choice: Libya
  rationale: Nama baku bahasa Indonesia, dengan hubungan genitif dinyatakan alami dalam frasa 'wilayah-wilayah Libya'.
- source_word: τῆς κατὰ Κυρήνην
  choice: di sekitar Kirene
  rationale: κατά dengan nama tempat di sini menunjukkan kawasan Libya yang dikaitkan secara geografis dengan Kirene; 'di sekitar' mempertahankan keluwesan cakupan itu tanpa menetapkan batas politik.
- source_word: οἱ ἐπιδημοῦντες
  choice: yang sedang berkunjung
  rationale: Partisip ini menunjukkan orang yang berada di suatu tempat untuk sementara; frasa ini tidak menyiratkan bahwa mereka menetap secara permanen.
- source_word: Ῥωμαῖοι
  choice: orang-orang Roma
  rationale: Sebutan geografis bagi mereka yang berasal dari Roma, dinyatakan dengan bentuk yang jelas dan alami dalam bahasa Indonesia.
