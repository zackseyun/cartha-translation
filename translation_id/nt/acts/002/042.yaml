  text: ἦσαν δὲ προσκαρτεροῦντες τῇ διδαχῇ τῶν ἀποστόλων καὶ τῇ ⸀κοινωνίᾳ, τῇ κλάσει τοῦ ἄρτου καὶ ταῖς προσευχαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/042.yaml
  text: And they were devoting themselves to the apostles' teaching and the fellowship[c][b][a], to the breaking of bread and the prayers.
translation:
  language: id
  text: Mereka terus bertekun dalam pengajaran para rasul dan dalam persekutuan[a], dalam memecahkan roti[b] dan dalam doa-doa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saling berbagi”, “partisipasi”, atau “komuni”.
    reason: lexical_alternative
  - marker: b
    text: “Memecahkan roti” dapat menunjuk pada makan bersama secara umum, meskipun banyak orang memahami bahwa ungkapan ini juga mencakup Perjamuan Tuhan.
    reason: alternative_reading
  - marker: c
    text: Atau “doa-doa tetap”; bentuk jamak dengan kata sandang dalam bahasa Yunani mungkin menunjuk pada waktu atau bentuk doa yang dikenal bersama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ προσκαρτεροῦντες
  choice: Mereka terus bertekun
  rationale: Bentuk imperfektum perifrastis menyatakan tindakan yang berlangsung dan menjadi kebiasaan pada masa lampau. “Terus bertekun” menyampaikan kesinambungan sekaligus kesungguhan komitmen mereka.
- source_word: τῇ διδαχῇ τῶν ἀποστόλων
  choice: dalam pengajaran para rasul
  rationale: “Pengajaran” merupakan padanan Indonesia yang alami dan tidak memberi kesan sistem teologi formal seperti “doktrin”. Genitifnya paling wajar dipahami sebagai pengajaran yang diberikan oleh para rasul.
- source_word: τῇ κοινωνίᾳ
  choice: dalam persekutuan
  rationale: κοινωνία mencakup kebersamaan, saling berbagi, dan partisipasi dalam kehidupan bersama. “Persekutuan” mempertahankan keluasan makna itu tanpa membatasinya pada pembagian harta atau perjamuan sakramental.
- source_word: τῇ κλάσει τοῦ ἄρτου
  choice: dalam memecahkan roti
  rationale: Ungkapan ini mempertahankan idiom Lukas-Kisah Para Rasul dan tetap alami dalam bahasa Indonesia. Ungkapan tersebut dapat menunjuk pada makan bersama dan mungkin juga mencakup Perjamuan Tuhan, sehingga tidak diperjelas secara sempit dalam teks utama.
- source_word: ταῖς προσευχαῖς
  choice: dalam doa-doa
  rationale: Bentuk jamak berartikel dapat menunjuk pada doa-doa yang dikenal bersama atau waktu dan bentuk doa tertentu. “Doa-doa” mempertahankan bentuk jamaknya, sedangkan kemungkinan nuansa khusus artikelnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Apakah κλάσει τοῦ ἄρτου harus diterjemahkan secara eksplisit sebagai Perjamuan Tuhan atau Ekaristi
  choice: memecahkan roti
  alternative: Perjamuan Tuhan; Ekaristi; makan bersama yang mencakup Perjamuan Tuhan
  rationale: Ungkapan Yunani ini dapat mengacu pada perjamuan bersama dan, dalam konteks Kristen, mungkin mencakup perjamuan peringatan akan Yesus. Namun, ayat ini tidak secara tegas menuntut istilah sakramental tertentu, sehingga ambiguitasnya dipertahankan.
- issue: Apakah κοινωνία harus dibatasi pada berbagi harta atau persekutuan sakramental
  choice: persekutuan
  alternative: saling berbagi; partisipasi bersama; komuni
  rationale: Istilah ini kemungkinan mencakup kehidupan bersama dalam arti luas, baik secara rohani maupun material. Padanan yang lebih sempit akan menyelesaikan keluasan maknanya secara prematur.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pengulangan “dalam” memperjelas unsur-unsur daftar serta mencerminkan konstruksi Yunani tanpa membuat kalimat terasa kaku. Istilah tradisional yang masih umum, seperti “bertekun”, dipertahankan karena tepat dan mudah dimengerti.
