  text: ὅτι οὐκ ἐγκαταλείψεις τὴν ψυχήν μου εἰς ⸀ᾅδην, οὐδὲ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/027.yaml
  text: because you will not abandon my soul to Hades[c][b][a], nor will you let your Holy One see decay.
translation:
  language: id
  text: sebab Engkau tidak akan meninggalkan jiwaku di Hades[a], dan tidak akan membiarkan Yang Kudus-Mu[b] mengalami pembusukan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di Syeol,” mengikuti teks Ibrani yang mendasari kutipan ini; teks Yunani di sini memakai “Hades.”
    reason: alternative_reading
  - marker: b
    text: Atau “orang yang setia kepada-Mu.”
    reason: lexical_alternative
  - marker: c
    text: Maksudnya, pembusukan atau penguraian tubuh setelah kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείψεις
  choice: tidak akan meninggalkan
  rationale: Bentuk futur aktif ini menyatakan bahwa seseorang tidak dibiarkan tetap dalam suatu tempat atau keadaan. “Meninggalkan” alami dalam bahasa Indonesia dan cukup kuat dalam konteks ini.
- source_word: ψυχήν
  choice: jiwaku
  rationale: ψυχή dapat berarti jiwa, hidup, atau diri. “Jiwaku” mempertahankan bentuk kutipan Mazmur serta ambiguitas antropologisnya tanpa menjadikannya pernyataan teknis tentang keadaan antara kematian dan kebangkitan.
- source_word: εἰς ᾅδην
  choice: di Hades
  rationale: ᾅδης dipertahankan sebagai “Hades” agar tidak disamakan dengan neraka atau sekadar kubur. Dengan verba “meninggalkan”, bahasa Indonesia secara alami memakai “di” untuk keadaan atau tempat seseorang ditinggalkan; catatan kaki mempertahankan latar Ibrani “Syeol”.
- source_word: δώσεις ... ἰδεῖν
  choice: membiarkan ... mengalami
  rationale: Secara harfiah δώσεις berarti “memberikan”, tetapi bersama infinitif membentuk ungkapan izin. “Membiarkan ... mengalami” menyampaikan maknanya secara wajar dalam bahasa Indonesia.
- source_word: τὸν ὅσιόν σου
  choice: Yang Kudus-Mu
  rationale: ὅσιος mencakup makna kudus, saleh, dan setia dalam hubungan dengan Allah. “Yang Kudus-Mu” mempertahankan nuansa kristologis dalam konteks Kisah Para Rasul 2, sedangkan alternatif “orang yang setia kepada-Mu” dicatat.
- source_word: ἰδεῖν διαφθοράν
  choice: mengalami kebinasaan
  rationale: Ungkapan harfiah “melihat kebinasaan” kurang alami dalam bahasa Indonesia. “Mengalami kebinasaan” mempertahankan idiom semitis-Yunani sambil menunjuk pada pembusukan jasmani dalam konteks kematian dan kebangkitan.
theological_decisions:
- issue: Terjemahan ᾅδης dalam kutipan tentang kebangkitan
  choice: Hades
  alternative: alam orang mati; Syeol; kubur
  rationale: “Hades” mempertahankan istilah Yunani dan menghindari penyamaan dengan neraka. Catatan kaki menyebut “Syeol” sebagai istilah Ibrani dalam Mazmur yang dikutip.
- issue: Identifikasi kristologis τὸν ὅσιόν σου
  choice: Yang Kudus-Mu
  alternative: orang yang setia kepada-Mu; orang saleh-Mu
  rationale: Konteks Kisah Para Rasul 2 menerapkan Mazmur ini kepada Yesus. Pilihan ini mempertahankan jangkauan leksikal dan daya kristologis teks tanpa menambahkan penjelasan doktrinal.
- issue: Makna διαφθορά dalam konteks kebangkitan
  choice: kebinasaan, dijelaskan sebagai pembusukan jasmani
  alternative: pembusukan; kehancuran
  rationale: Konteks langsung mengarah pada pembusukan tubuh setelah kematian, bukan kerusakan moral. Catatan kaki menjelaskan makna tersebut tanpa menghilangkan keluasan istilah dari teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Kapitalisasi pada “Engkau” dan “Yang Kudus-Mu” mengikuti rujukan kepada Allah dan identifikasi kristologis dalam konteks. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang diterangkan.
