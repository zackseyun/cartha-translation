  text: γενομένης δὲ τῆς φωνῆς ταύτης συνῆλθε τὸ πλῆθος καὶ συνεχύθη, ὅτι ⸀ἤκουον εἷς ἕκαστος τῇ ἰδίᾳ διαλέκτῳ λαλούντων αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/006.yaml
  text: And when this sound occurred[a], the crowd came together and was bewildered[b], because each one was hearing them speaking in his own dialect.
translation:
  language: id
  text: Ketika bunyi itu terdengar, orang banyak berkumpul dan menjadi bingung, karena masing-masing mendengar mereka berbicara dalam bahasanya sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam dialeknya sendiri.” Kata Yunani yang dipakai dapat berarti bahasa atau dialek, khususnya ragam tutur asli atau setempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης ... τῆς φωνῆς ταύτης
  choice: Ketika bunyi itu terdengar
  rationale: Genitivus absolutus ini menyatakan keadaan waktu. φωνή dapat berarti suara, bunyi, atau bunyi gaduh; dalam konteks ini, 'bunyi' menunjuk secara alami pada gejala yang terdengar tanpa menentukan sumbernya secara berlebihan. 'Terdengar' merupakan ungkapan Indonesia yang wajar untuk kemunculan bunyi.
- source_word: δέ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ adalah penghubung naratif ringan. Hubungan antarkalimat sudah tersampaikan secara alami oleh 'Ketika' sehingga penambahan 'dan' atau 'lalu' tidak diperlukan.
- source_word: συνῆλθε τὸ πλῆθος
  choice: orang banyak berkumpul
  rationale: συνέρχομαι menggambarkan orang-orang yang datang menjadi satu kelompok, sedangkan πλῆθος berarti sejumlah besar orang. Ungkapan ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: συνεχύθη
  choice: menjadi bingung
  rationale: Bentuk pasif συγχέω di sini menyatakan bahwa orang banyak mengalami kebingungan atau kekacauan batin. 'Menjadi bingung' jelas dan tidak melebihkan intensitas maknanya.
- source_word: ὅτι
  choice: karena
  rationale: Kata ini memperkenalkan alasan orang banyak menjadi bingung.
- source_word: ἤκουον
  choice: mendengar
  rationale: Imperfek Yunani menggambarkan pengalaman yang sedang berlangsung. Dalam bahasa Indonesia, aspek berkelanjutan dapat dipahami dari konteks tanpa harus memakai 'sedang', yang dapat terasa lebih sempit.
- source_word: εἷς ἕκαστος
  choice: masing-masing
  rationale: 'Ungkapan ini mempertahankan tekanan distributif: setiap orang secara pribadi mengalami hal tersebut.'
- source_word: τῇ ἰδίᾳ διαλέκτῳ
  choice: dalam bahasanya sendiri
  rationale: διάλεκτος dapat berarti bahasa atau dialek, khususnya ragam tutur asli atau setempat. Dalam bahasa Indonesia modern, 'bahasa' paling alami dalam kalimat utama, sementara alternatif yang lebih harfiah 'dialek' dicatat dalam catatan kaki.
- source_word: λαλούντων αὐτῶν
  choice: mereka berbicara
  rationale: Frasa partisipial ini merujuk kepada para penutur yang telah disebut dalam konteks. 'Mereka' mempertahankan rujukan teks tanpa mempersempitnya secara eksplisit menjadi 'para rasul'.
theological_decisions:
- issue: 'Cakupan διάλεκτος: bahasa atau dialek'
  choice: bahasanya sendiri
  alternative: dialeknya sendiri
  rationale: Teks menekankan bahwa setiap pendengar mengenali tuturannya sendiri. Pemakaian 'bahasa' memberi ungkapan Indonesia yang alami tanpa memutuskan secara dogmatis apakah perbedaannya harus dipahami sebagai bahasa tersendiri atau ragam regional; alternatif leksikal dipertahankan dalam catatan kaki.
- issue: Identitas para penutur dalam λαλούντων αὐτῶν
  choice: mereka berbicara
  alternative: para rasul berbicara
  rationale: Kata ganti Yunani hanya mengatakan 'mereka'. Terjemahan tidak memasukkan identifikasi yang lebih sempit daripada yang dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Struktur dibuat alami bagi pembaca umum, dengan tekanan distributif 'masing-masing' dipertahankan. Catatan kaki menjaga keluasan makna διάλεκτος tanpa membebani teks utama.
