  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἄφνω ἐκ τοῦ οὐρανοῦ ἦχος ὥσπερ φερομένης πνοῆς βιαίας καὶ ἐπλήρωσεν ὅλον τὸν οἶκον οὗ ἦσαν καθήμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/002.yaml
  text: And suddenly there came from heaven a sound like that of a violent rushing wind[a], and it filled the whole house where they were sitting.
translation:
  language: id
  text: Tiba-tiba, dari surga terdengar suatu bunyi seperti bunyi angin kencang yang bertiup[a], dan bunyi itu memenuhi seluruh rumah tempat mereka sedang duduk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bunyi seperti angin dahsyat yang sedang bergerak.” Bahasa Yunani membandingkan bunyi itu dengan udara atau angin yang bergerak kuat; ayat ini tidak secara eksplisit mengatakan bahwa benar-benar ada angin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: terdengarlah
  rationale: Dalam konstruksi peristiwa impersonal bersama ἦχος, bentuk ini alami dalam bahasa Indonesia dan menyatakan munculnya bunyi tanpa menerjemahkan secara kaku sebagai 'terjadilah'.
- source_word: ἄφνω
  choice: Tiba-tiba
  rationale: Menyampaikan kemunculan yang mendadak dengan ragam modern dan bermartabat.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: dari surga
  rationale: Menjaga kemungkinan sumber surgawi atau ilahi yang lazim dalam Lukas–Kisah Para Rasul, bukan membatasinya pada langit atmosferis.
- source_word: ἦχος
  choice: bunyi
  rationale: Padanan luas dan netral; 'suara' dapat mengesankan suara makhluk, sedangkan 'gemuruh' terlalu spesifik.
- source_word: ὥσπερ
  choice: seperti
  rationale: Menandai perbandingan dengan jelas dan tidak menyatakan bahwa angin sungguhan pasti hadir.
- source_word: φερομένης πνοῆς βιαίας
  choice: tiupan angin keras yang menderu
  rationale: Mengungkapkan gerak dan daya udara secara alami dalam bahasa Indonesia. 'Menderu' menggambarkan bunyi dan gerakan kuat tanpa mengubah perbandingan menjadi pernyataan bahwa angin literal hadir.
- source_word: ἐπλήρωσεν
  choice: bunyi itu memenuhi
  rationale: Menyebut ulang subjek secara eksplisit agar rujukannya jelas dan mempertahankan bahwa bunyilah yang memenuhi rumah.
- source_word: ὅλον τὸν οἶκον
  choice: seluruh rumah
  rationale: Padanan langsung yang mempertahankan cakupan total.
- source_word: οὗ ἦσαν καθήμενοι
  choice: tempat mereka sedang duduk
  rationale: Menyampaikan keadaan yang sedang berlangsung secara wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Hakikat gejala yang dibandingkan dengan angin
  choice: 'Teks utama mempertahankan simile: bunyi seperti tiupan angin keras yang menderu.'
  alternative: Angin keras yang sungguh-sungguh memenuhi rumah.
  rationale: ὥσπερ secara eksplisit menandai perbandingan. Terjemahan tidak menyamakan bunyi itu dengan angin literal dan dengan demikian mempertahankan kehati-hatian teks.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara perbandingan dalam teks Yunani dan ambiguitas mengenai hadir tidaknya angin sungguhan tetap dipertahankan.
