  terminology: “Janji”, “anak-anakmu”, “semua orang yang jauh”, dan “Tuhan, Allah kita” sesuai dengan sumber dan register modern baku. “Orang yang jauh” mempertahankan ambiguitas yang disengaja; catatan kaki membantu tanpa membatasi rujukan menjadi kelompok tertentu.
