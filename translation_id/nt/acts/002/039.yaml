  source_fidelity: 'Terjemahan mempertahankan unsur-unsur utama ayat: γάρ sebagai alasan, ἐπαγγελία sebagai “janji”, penerima yang mencakup pendengar, anak-anak mereka, dan orang-orang yang jauh, serta pembatasan/penjelasan oleh panggilan Tuhan, Allah kita. Namun, “yaitu sebanyak orang yang dipanggil” tidak alami dan “yaitu” terlalu tegas mengarahkan hubungan sintaktis frasa penutup sebagai penjelasan langsung atas kelompok sebelumnya. Bentuk “sebanyak yang akan dipanggil” lebih setia pada cakupan tak-tertentu ὅσους ἂν προσκαλέσηται tanpa menambahkan mekanisme teologis.'
