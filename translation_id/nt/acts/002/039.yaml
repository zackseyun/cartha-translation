  text: ὑμῖν γάρ ἐστιν ἡ ἐπαγγελία καὶ τοῖς τέκνοις ὑμῶν καὶ πᾶσι τοῖς εἰς μακρὰν ὅσους ἂν προσκαλέσηται κύριος ὁ θεὸς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/039.yaml
  text: For the promise is for you and for your children and for all who are far off[b][a], as many as the Lord our God calls.
translation:
  language: id
  text: Sebab janji itu adalah bagi kamu, bagi anak-anakmu, dan bagi semua orang yang jauh[a]—sebanyak yang akan dipanggil oleh Tuhan, Allah kita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua orang yang berada jauh.” Ungkapan ini dapat menunjuk kepada orang yang jauh secara geografis, yang jauh dalam hubungan perjanjian, atau keduanya.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “sebanyak yang kiranya akan dipanggil oleh Tuhan, Allah kita.” Frasa Yunani ini menyatakan cakupan yang tidak ditentukan tetapi menyeluruh, tanpa menjelaskan bagaimana panggilan Allah itu bekerja.'
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Sebab
  rationale: Menunjukkan bahwa ayat ini memberi dasar bagi seruan Petrus sebelumnya; bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan penalarannya.
- source_word: ἐπαγγελία
  choice: janji itu
  rationale: Nomina Yunani menyebut janji, bukan secara eksplisit pemberian yang dijanjikan. Kata penunjuk 'itu' mengacu pada janji yang telah dibicarakan dalam konteks.
- source_word: τέκνοις
  choice: anak-anak
  rationale: Mempertahankan makna kekeluargaan yang wajar tanpa membatasi usia; dalam konteks ini dapat pula mencakup keturunan.
- source_word: πᾶσι τοῖς εἰς μακράν
  choice: semua orang yang jauh
  rationale: Mempertahankan keluasan ungkapan Yunani serta kemungkinan jarak geografis, jarak dalam hubungan perjanjian, atau keduanya.
- source_word: ὅσους ἂν προσκαλέσηται
  choice: sebanyak orang yang dipanggil
  rationale: Mencerminkan kelompok yang tidak ditentukan tetapi menyeluruh menurut cakupan panggilan Tuhan. Bentuk pasif Indonesia alami dan tidak menambahkan 'kepada diri-Nya', yang tidak dinyatakan secara eksplisit.
- source_word: κύριος ὁ θεὸς ἡμῶν
  choice: Tuhan, Allah kita
  rationale: Mempertahankan sebutan κύριος dan frasa aposisional yang mengidentifikasi-Nya sebagai Allah kita.
theological_decisions:
- issue: Cakupan 'orang yang jauh'
  choice: Diterjemahkan secara luas sebagai 'semua orang yang jauh'.
  alternative: Orang Yahudi diaspora saja; bangsa-bangsa bukan Yahudi saja; atau orang yang jauh secara geografis sekaligus dalam hubungan perjanjian.
  rationale: Ayat ini tidak mengharuskan satu identifikasi sempit, sehingga terjemahan mempertahankan ambiguitas dan keluasan ungkapan sumber.
- issue: Makna panggilan ilahi dalam ὅσους ἂν προσκαλέσηται
  choice: Dinyatakan sebagai orang-orang yang dipanggil oleh Tuhan tanpa menjelaskan mekanisme panggilan tersebut.
  alternative: Panggilan efektif dalam sistem teologis tertentu; atau undangan umum.
  rationale: Teks menegaskan cakupan janji menurut panggilan Allah, tetapi tidak mendefinisikan di sini bagaimana panggilan itu bekerja. Terjemahan tidak memasukkan kekhasan denominasi.
- issue: Hubungan frasa ὅσους ἂν προσκαλέσηται dengan kelompok sebelumnya
  choice: Tanda pisah dan 'yaitu' menunjukkan bahwa frasa ini membatasi atau menjelaskan keseluruhan cakupan penerima janji.
  alternative: Membacanya hanya sebagai keterangan bagi 'semua orang yang jauh'.
  rationale: Secara sintaksis, frasa tersebut paling alami merangkum cakupan orang-orang yang menerima janji, tetapi susunan Yunani dapat terasa terkait erat dengan kelompok terakhir; catatan kaki mempertahankan kemungkinan pembacaan lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Berlaku bagi' dipilih agar konstruksi kepemilikan Yunani terdengar alami tanpa mengubah 'janji' menjadi 'pemberian yang dijanjikan'. Tanda pisah dan 'yaitu' memperjelas fungsi frasa penutup, sedangkan catatan kaki menjaga kemungkinan sintaksis dan teologis yang tidak sepenuhnya tunggal.
