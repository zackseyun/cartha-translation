revisions:
- from: Sebab janji itu berlaku bagi kamu, bagi anak-anakmu, dan bagi semua orang yang jauh[a]—yaitu sebanyak orang yang dipanggil oleh Tuhan, Allah kita.[b]
  to: Sebab janji itu adalah bagi kamu, bagi anak-anakmu, dan bagi semua orang yang jauh[a]—sebanyak yang akan dipanggil oleh Tuhan, Allah kita.[b]
  rationale: Revisi mengganti konstruksi yang janggal “yaitu sebanyak orang yang dipanggil” dengan “sebanyak yang akan dipanggil”, yang lebih alami dan menyampaikan nilai tak-tertentu ὅσους ἂν beserta aspek prospektif dari subjungtif aoris. “Adalah bagi” memperlihatkan hubungan langsung antara janji dan para penerimanya. Tanda pisah mempertahankan daya kualifikasi frasa penutup tanpa memaksakan bahwa frasa itu hanya menjelaskan “semua orang yang jauh” atau secara eksklusif membatasi kelompok tertentu.
