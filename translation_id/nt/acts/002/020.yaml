  verdict: revise
  source_fidelity: 'Secara umum setia pada teks Yunani: bentuk futur pasif pada μεταστραφήσεται, citra literal “menjadi kegelapan/darah”, dan hubungan waktu πρὶν ἢ telah dipertahankan. Namun, demonstratif “itu” tidak terdapat dalam teks sumber dan tidak diperlukan dalam bahasa Indonesia pada kalimat ini.'
  naturalness: “Hari Tuhan yang besar dan nyata” kurang lazim dan kurang padu dalam bahasa Indonesia baku, karena “nyata” umumnya tidak berkolokasi alami dengan “hari” dalam pengertian profetis ini. “Hari Tuhan yang besar dan mulia” lebih idiomatis dan tetap berada dalam rentang makna ἐπιφανής. Penghilangan “itu” juga membuat susunan lebih langsung.
  terminology: “Hari Tuhan” tepat untuk ἡμέραν κυρίου dan mempertahankan idiom profetis. “Mul ia” merupakan padanan utama yang wajar bagi ἐπιφανῆ dalam konteks ini; alternatif yang menonjolkan keterlihatan atau ketermasyhuran perlu tetap dicatat.
  issues:
  - severity: low
    issue: Demonstratif “itu” ditambahkan pada “hari Tuhan”.
    rationale: Teks Yunani hanya memiliki frasa berartikel “hari Tuhan yang besar dan ἐπιφανής”, tanpa demonstratif. Dalam bahasa Indonesia, “itu” tidak dibutuhkan untuk kelancaran dan dapat memberi penegasan deiktis yang tidak dinyatakan sumber.
  - severity: medium
    issue: “Nyata” sebagai padanan utama ἐπιφανῆ terdengar kurang alami dalam kolokasi “hari ... yang nyata”.
    rationale: ἐπιφανής mencakup “tampak/menonjol/tersohor” dan, dalam konteks ini, “mulia”. “Mulia” menyampaikan nada luhur secara alami dalam bahasa Indonesia tanpa menutup alternatif leksikal melalui catatan kaki.
  revised_text: Matahari akan diubah menjadi kegelapan dan bulan menjadi darah sebelum hari Tuhan yang besar dan mulia datang.
  revised_footnotes:
