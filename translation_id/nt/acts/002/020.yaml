  text: ὁ ἥλιος μεταστραφήσεται εἰς σκότος καὶ ἡ σελήνη εἰς αἷμα πρὶν ⸀ἢ ⸀ἐλθεῖν ἡμέραν κυρίου τὴν μεγάλην καὶ ἐπιφανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/020.yaml
  text: The sun will be turned into darkness[a], and the moon into blood, before the great and glorious day of the Lord comes.
translation:
  language: id
  text: Matahari akan diubah menjadi kegelapan dan bulan menjadi darah sebelum hari Tuhan yang besar dan mulia datang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεταστραφήσεται
  choice: akan diubah
  rationale: Bentuk pasif futur dipertahankan, sekaligus menyampaikan perubahan keadaan tanpa menjelaskan pelakunya atau mekanismenya.
- source_word: εἰς σκότος
  choice: menjadi kegelapan
  rationale: εἰς menandai hasil perubahan; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran nubuat.
- source_word: εἰς αἷμα
  choice: menjadi darah
  rationale: Terjemahan harfiah ini mempertahankan gambaran nubuat yang tegas dan tidak mempersempitnya menjadi sekadar warna merah darah.
- source_word: πρὶν ἢ ἐλθεῖν
  choice: sebelum ... datang
  rationale: Menyatakan bahwa tanda-tanda tersebut mendahului kedatangan hari Tuhan dalam susunan bahasa Indonesia yang wajar.
- source_word: ἡμέραν κυρίου
  choice: hari Tuhan
  rationale: Mempertahankan ungkapan profetis yang dikenal untuk waktu campur tangan atau penghakiman ilahi, tanpa menimbulkan kerancuan dengan sebutan bagi hari Minggu.
- source_word: μεγάλην
  choice: besar
  rationale: Padanan langsung yang mempertahankan nada profetis dan agung.
- source_word: ἐπιφανῆ
  choice: nyata
  rationale: Kata Yunani ini terutama menunjuk pada sesuatu yang tampak, kentara, atau tersohor. 'Nyata' mempertahankan unsur kemunculan yang terlihat tanpa secara otomatis menafsirkannya sebagai kemuliaan.
theological_decisions:
- issue: Ungkapan profetis ἡμέραν κυρίου dalam kutipan Kitab Yoel di khotbah Petrus
  choice: hari Tuhan
  alternative: harinya Tuhan
  rationale: '''Hari Tuhan'' mempertahankan ungkapan teologis Perjanjian Lama tentang hari campur tangan ilahi dan tidak mengimpornya sebagai istilah bagi hari ibadah tertentu.'
- issue: Makna ἐπιφανῆ dalam konteks eskatologis
  choice: nyata
  alternative: mulia atau mencolok
  rationale: Bahasa Yunani memungkinkan nuansa tampak/kentara dan juga mengesankan kemegahan. Teks utama memakai padanan yang dekat dengan unsur keterlihatan, sedangkan nuansa lain dicatat agar ketegangan leksikal tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nubuat yang ringkas dan bermartabat. Susunan 'sebelum hari Tuhan ... itu datang' dipilih agar alami, sementara citra 'kegelapan' dan 'darah' dipertahankan secara harfiah.
