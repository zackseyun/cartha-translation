revisions:
- from: Dia ini, yang diserahkan sesuai dengan rencana yang telah ditetapkan dan pengetahuan sebelumnya dari Allah, kamu bunuh dengan memakukannya pada salib melalui tangan orang-orang yang tidak mengenal hukum.
  to: Dia ini, yang diserahkan sesuai dengan rencana yang telah ditetapkan dan pengetahuan Allah sebelumnya, kamu bunuh dengan memakukan Dia pada salib melalui tangan orang-orang durhaka.
  rationale: Revisi mengganti ungkapan yang dapat menyiratkan bahwa para pelaku sekadar tidak mengetahui hukum dengan “orang-orang durhaka,” yang lebih langsung mencerminkan ἀνόμων. Catatan kaki mempertahankan kemungkinan nuansa “di luar hukum Taurat” dalam konteks historis tanpa memaksakan identifikasi tunggal. Susunan “pengetahuan Allah sebelumnya” diperbaiki demi kelancaran bahasa Indonesia tanpa mengubah makna πρόγνωσις.
