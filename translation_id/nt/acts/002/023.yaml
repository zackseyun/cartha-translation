  text: τοῦτον τῇ ὡρισμένῃ βουλῇ καὶ προγνώσει τοῦ θεοῦ ⸀ἔκδοτον διὰ ⸀χειρὸς ἀνόμων προσπήξαντες ἀνείλατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/023.yaml
  text: this man[a], delivered up according to the determined plan and foreknowledge of God[b], you killed by nailing him to a cross through the hands of lawless men.
translation:
  language: id
  text: Dia ini, yang diserahkan sesuai dengan rencana yang telah ditetapkan dan pengetahuan Allah sebelumnya, kamu bunuh dengan memakukan Dia pada salib melalui tangan orang-orang durhaka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον
  choice: Dia ini
  rationale: Kata tunjuk akusatif ini menunjuk langsung kepada Yesus dalam pidato Petrus. 'Dia ini' mempertahankan daya deiktisnya dengan bahasa Indonesia yang wajar.
- source_word: τῇ ὡρισμένῃ βουλῇ
  choice: sesuai dengan rencana yang telah ditetapkan
  rationale: Ungkapan ini menyatakan bahwa penyerahan Yesus berlangsung selaras dengan maksud Allah yang sudah ditentukan; pilihan ini menjaga unsur ketetapan tanpa bahasa arkais.
- source_word: καὶ προγνώσει τοῦ θεοῦ
  choice: dan pengetahuan sebelumnya dari Allah
  rationale: Menerjemahkan πρόγνωσις secara transparan sebagai pengetahuan yang mendahului peristiwa, tanpa menambahkan kesimpulan teologis di luar teks.
- source_word: ἔκδοτον
  choice: yang diserahkan
  rationale: ἔκδοτον berarti diserahkan atau diberikan ke dalam kuasa pihak lain. Bentuk pasif mempertahankan ketidaktersuratan pelaku langsung dalam klausa ini.
- source_word: διὰ χειρὸς ἀνόμων
  choice: melalui tangan orang-orang yang tidak mengenal hukum
  rationale: διά dengan genitif menunjukkan perantaraan. 'Tangan' mempertahankan bentuk tunggal kolektif Yunani, sedangkan ἀνόμων dalam konteks ini kemungkinan menunjuk kepada orang-orang di luar hukum Taurat, yakni para pelaksana Romawi, tanpa menghilangkan nuansa ketiadaan hukum.
- source_word: προσπήξαντες
  choice: dengan memakukannya pada salib
  rationale: Kata kerja ini berarti memasang atau memakukan; konteks eksekusi Yesus membenarkan penyebutan salib secara eksplisit.
- source_word: ἀνείλατε
  choice: kamu bunuh
  rationale: Bentuk orang kedua jamak ini merupakan tuduhan langsung dan berarti membunuh atau menyingkirkan dengan membunuh. 'Kamu bunuh' mempertahankan ketegasan Petrus.
theological_decisions:
- issue: Hubungan antara ketetapan Allah dan tanggung jawab manusia
  choice: Mempertahankan sekaligus rencana serta pengetahuan Allah dan tuduhan langsung 'kamu bunuh'.
  alternative: Melunakkan ketetapan Allah atau menjadikan orang-orang tanpa hukum sebagai satu-satunya pihak yang bertanggung jawab.
  rationale: 'Teks Yunani menempatkan kedua hal itu berdampingan tanpa menjelaskan hubungan sistematisnya: Yesus diserahkan sesuai rencana dan pengetahuan Allah, tetapi para pendengar tetap dituduh membunuh-Nya melalui perantaraan pihak lain.'
- issue: Makna ἀνόμων
  choice: orang-orang yang tidak mengenal hukum
  alternative: orang-orang durhaka / pelanggar hukum
  rationale: Dalam konteks Kisah Para Rasul 2, ungkapan ini dapat menunjuk kepada bangsa-bangsa bukan Yahudi atau orang Romawi yang tidak berada di bawah hukum Taurat. Pilihan ini mempertahankan kemungkinan tersebut tanpa meniadakan nuansa negatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan khidmat. Susunan kalimat mempertahankan ketegangan antara tindakan Allah dan pertanggungjawaban manusia. Tidak ada catatan kaki karena tidak ada alternatif yang mutlak perlu bagi pembaca dalam ayat tunggal ini.
