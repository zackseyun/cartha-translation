id: ACT.2.36
reference: Acts 2:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀσφαλῶς οὖν γινωσκέτω πᾶς οἶκος Ἰσραὴλ ὅτι καὶ κύριον ⸂αὐτὸν καὶ χριστὸν⸃ ⸂ἐποίησεν ὁ θεός⸃, τοῦτον τὸν Ἰησοῦν ὃν ὑμεῖς ἐσταυρώσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/036.yaml
  text: Therefore let all the house of Israel know for certain that God has made him both Lord and Messiah—this Jesus whom you crucified[a][b].
translation:
  language: id
  text: Karena itu, hendaklah seluruh kaum Israel mengetahui dengan pasti bahwa Allah telah menjadikan Yesus ini Tuhan dan Mesias[a]—Dia yang kamu salibkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Kata Yunani Χριστός (Christos) adalah gelar yang berarti “Mesias.”
    reason: alternative_reading
  - marker: b
    text: Ungkapan “telah menjadikan ... Tuhan dan Mesias” menunjuk pada peninggian Yesus dan penetapan-Nya secara terbuka dalam kedudukan tersebut; ungkapan ini tidak dengan sendirinya menyatakan perubahan dalam hakikat-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλῶς
  choice: dengan pasti
  rationale: Menjaga penekanan pada kepastian pernyataan Petrus dalam ungkapan Indonesia yang alami.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan logis dari uraian sebelumnya mengenai kebangkitan dan peninggian Yesus.
- source_word: γινωσκέτω
  choice: hendaklah ... mengetahui
  rationale: Mencerminkan imperatif orang ketiga tunggal yang ditujukan secara kolektif kepada kaum Israel.
- source_word: πᾶς οἶκος Ἰσραήλ
  choice: seluruh kaum Israel
  rationale: Mempertahankan cakupan korporat ungkapan Semitis itu tanpa menghasilkan frasa Indonesia yang kaku.
- source_word: κύριον
  choice: Tuhan
  rationale: Menyampaikan gelar dan kewibawaan Yesus yang ditinggikan serta kaitannya dengan kutipan sebelumnya.
- source_word: Χριστόν
  choice: Mesias
  rationale: Dalam pidato kepada Israel, kata ini jelas berfungsi sebagai gelar; 'Mesias' menyatakan makna gelar itu secara langsung.
- source_word: ἐποίησεν
  choice: telah menjadikan
  rationale: Mempertahankan arti leksikal verba Yunani dan menyatakan tindakan yang telah selesai dengan dampak yang tetap berlaku.
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: Yesus ini
  rationale: Menjaga daya tunjuk dan penekanan pada Yesus historis yang sedang dibicarakan.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: Dia yang kamu salibkan
  rationale: Terjemahan langsung dan alami yang mempertahankan tekanan tuduhan terhadap para pendengar.
theological_decisions:
- issue: Makna 'Allah telah menjadikan ... Tuhan dan Mesias' bagi kristologi
  choice: Klausa diterjemahkan secara lugas sebagai tindakan Allah menjadikan atau menetapkan Yesus dalam kedudukan yang dinyatakan melalui peninggian-Nya.
  alternative: Menerjemahkan ἐποίησεν secara interpretatif sebagai 'mengangkat' atau 'menetapkan', atau membacanya sebagai perubahan hakikat Yesus.
  rationale: Kata 'menjadikan' mempertahankan ketegangan dan daya leksikal teks. Catatan menjelaskan konteks peninggian tanpa memasukkan perubahan hakikat ke dalam ayat atau mengganti verba Yunani dengan tafsiran.
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Sapaan kepada seluruh kaum Israel menonjolkan fungsi Χριστός sebagai gelar mesianik, sehingga 'Mesias' paling transparan bagi pembaca modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Seluruh kaum Israel' dipilih sebagai padanan alami bagi idiom korporat 'seluruh rumah Israel'. Tanda pisah mempertahankan fokus retoris pada identitas Yesus yang disalibkan.
