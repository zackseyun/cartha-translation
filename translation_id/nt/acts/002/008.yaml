  text: And how is it that each of us hears in our own native language?[a]
translation:
  language: id
  text: Bagaimana mungkin kita masing-masing mendengar dalam bahasa kita sendiri, bahasa yang kita miliki sejak lahir?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam dialek kita sendiri, yang kita miliki sejak lahir.”
    reason: διάλεκτος dapat diterjemahkan sebagai “bahasa” atau “dialek”; alternatif ini mempertahankan bentuk relatif Yunani secara lebih harfiah.
lexical_decisions:
- source_word: πῶς
  choice: Bagaimana mungkin
  rationale: Mengungkapkan pertanyaan bernada heran secara alami dalam bahasa Indonesia tanpa mengubahnya menjadi pernyataan tentang ketidakmungkinan.
- source_word: ἡμεῖς ... ἕκαστος
  choice: kita masing-masing
  rationale: Mempertahankan penekanan inklusif ἡμεῖς dan makna distributif ἕκαστος dalam susunan Indonesia yang wajar.
- source_word: ἀκούομεν
  choice: mendengar mereka berbicara
  rationale: Dalam konteks, yang didengar ialah para pembicara menggunakan bahasa para pendengar. Tambahan 'mereka berbicara' membuat hubungan dengan frasa bahasa jelas dalam bahasa Indonesia, meski unsur itu tersirat dalam bahasa Yunani.
- source_word: τῇ ἰδίᾳ διαλέκτῳ ἡμῶν
  choice: dalam bahasa kita sendiri
  rationale: διάλεκτος dapat menunjuk bahasa atau dialek; 'bahasa' lebih alami dan tidak terlalu teknis bagi pembaca umum, sedangkan 'sendiri' menerjemahkan ἰδίᾳ.
- source_word: ἐν ᾗ ἐγεννήθημεν
  choice: bahasa tempat kita dilahirkan
  rationale: Mempertahankan keterangan eksplisit tentang kelahiran, alih-alih meleburkannya ke dalam kata 'ibu', sehingga struktur dan nuansa sumber tetap terlihat.
