  text: ἑτέροις τε λόγοις πλείοσιν διεμαρτύρατο, καὶ παρεκάλει ⸀αὐτοὺς λέγων· Σώθητε ἀπὸ τῆς γενεᾶς τῆς σκολιᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/040.yaml
  text: And with many other words he solemnly testified and kept urging them[a], saying, “Be saved from this crooked generation.”
translation:
  language: id
  text: Dengan banyak perkataan lain, Petrus memberikan kesaksian dengan sungguh-sungguh dan terus mendesak mereka, katanya, “Hendaklah kalian diselamatkan[a] dari angkatan yang bengkok ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Selamatkanlah diri kalian dari angkatan yang bengkok ini.” Kata kerja Yunaninya berbentuk pasif (“hendaklah kalian diselamatkan”), tetapi dalam konteks ini perintah tersebut juga menyerukan tanggapan para pendengar.
    reason: alternative_reading
lexical_decisions:
- source_word: ἑτέροις τε λόγοις πλείοσιν
  choice: Dengan banyak perkataan lain
  rationale: Ungkapan ini mempertahankan unsur ‘lain’ dan ‘banyak’, sekaligus terdengar alami sebagai keterangan tentang kelanjutan perkataan Petrus.
- source_word: διεμαρτύρατο
  choice: memberikan kesaksian dengan sungguh-sungguh
  rationale: Pilihan ini menyampaikan nuansa kesaksian atau penegasan yang kuat dan serius, tanpa mempersempit maknanya hanya menjadi peringatan.
- source_word: παρεκάλει
  choice: terus mendesak
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung atau berulang, sedangkan ‘mendesak’ menyampaikan daya imbauan dalam konteks ini.
- source_word: αὐτοὺς
  choice: mereka
  rationale: Pronomina ini menunjuk kepada para pendengar Petrus dan diterjemahkan secara langsung.
- source_word: Σώθητε
  choice: Biarlah kalian diselamatkan
  rationale: Bentuk imperatif pasif dipertahankan agar panggilan kepada para pendengar tetap nyata tanpa mengubahnya menjadi gagasan bahwa mereka menyelamatkan diri sendiri.
- source_word: ἀπὸ
  choice: dari
  rationale: Kata depan ini menyatakan pemisahan dan secara alami diterjemahkan ‘dari’.
- source_word: γενεᾶς
  choice: angkatan
  rationale: ‘Angkatan’ menunjuk kepada kelompok orang sezaman dan mempertahankan gema ungkapan alkitabiah dengan bahasa Indonesia yang tetap dapat dipahami.
- source_word: σκολιᾶς
  choice: bengkok
  rationale: ‘Bengkok’ mempertahankan metafora moral yang konkret dalam kata Yunani, alih-alih langsung menafsirkannya sebagai ‘jahat’ atau ‘sesat’.
theological_decisions:
- issue: Bentuk pasif dan peran pelaku dalam Σώθητε
  choice: Biarlah kalian diselamatkan
  alternative: Selamatkanlah diri kalian
  rationale: Bahasa Yunani memakai imperatif pasif. Terjemahan utama mempertahankan bentuk itu dan ketegangan antara keselamatan yang diterima dan panggilan nyata untuk menanggapinya, tanpa menegaskan penyelamatan diri secara otonom.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur namun mudah dipahami. Nama ‘Petrus’ dinyatakan untuk memperjelas subjek tersirat dalam bahasa Yunani. ‘Kalian’ dipakai karena Petrus berbicara kepada banyak pendengar; ‘angkatan yang bengkok’ mempertahankan metafora teks sumber.
