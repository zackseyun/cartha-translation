id: ACT.2.34
reference: Acts 2:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ γὰρ Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς, λέγει δὲ αὐτός· Εἶπεν ⸀ὁ κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/034.yaml
  text: For David did not ascend into the heavens[a], but he himself says, ‘The Lord said to my Lord, “Sit at my right hand,”’
translation:
  language: id
  text: Sebab Daud tidak naik ke surga[a], tetapi ia sendiri berkata, “Tuhan berkata kepada Tuanku, ‘Duduklah di sebelah kanan-Ku,’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mazmur 110:1. Dalam teks Ibrani, kata pertama yang diterjemahkan “Tuhan” mewakili nama ilahi YHWH; bandingkan, “TUHAN berkata kepada Tuanku.”
    reason: Menjelaskan latar teks Ibrani dan alternatif penyajian nama ilahi yang tidak tampak langsung dalam teks Yunani.
lexical_decisions:
- source_word: ἀνέβη
  choice: naik
  rationale: Dalam konteks ini ἀναβαίνω menunjuk pada naik ke surga. Kata “naik” alami dalam bahasa Indonesia dan tetap mempertahankan gema kenaikan.
- source_word: τοὺς οὐρανούς
  choice: surga
  rationale: Walaupun bentuk Yunani jamak, bahasa Indonesia modern secara alami memakai bentuk tunggal “surga” untuk ranah surgawi; pemaksaan bentuk jamak akan terdengar tidak wajar dan dapat mengisyaratkan beberapa surga yang terpisah.
- source_word: λέγει δὲ αὐτός
  choice: tetapi ia sendiri berkata
  rationale: “Tetapi” menyatakan kontras ringan dari δέ, sedangkan “ia sendiri” mempertahankan penekanan αὐτός. Bentuk “berkata” merupakan pengantar kutipan Kitab Suci yang alami dalam bahasa Indonesia.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: κύριος diterjemahkan “Tuhan” sesuai arti dalam teks Yunani. Latar nama ilahi YHWH dalam Mazmur 110:1 dijelaskan dalam catatan kaki.
- source_word: τῷ κυρίῳ μου
  choice: kepada Tuanku
  rationale: “Tuanku” mempertahankan pembedaan relasional dari μου dan daya mesianik kutipan, sekaligus membedakannya secara alami dari “Tuhan” pertama.
- source_word: Κάθου
  choice: Duduklah
  rationale: Imperatif ini diterjemahkan dengan bentuk perintah yang langsung, wajar, dan bermartabat dalam bahasa Indonesia.
- source_word: ἐκ δεξιῶν μου
  choice: di sebelah kanan-Ku
  rationale: Ini adalah ungkapan idiomatis bagi tempat kehormatan dan kekuasaan; “di sebelah kanan-Ku” menyampaikan maknanya secara alami.
theological_decisions:
- issue: Penerjemahan dua kemunculan κύριος dalam kutipan Mazmur 110:1
  choice: “Tuhan berkata kepada Tuanku” dalam teks utama.
  alternative: “TUHAN berkata kepada Tuanku” untuk menampilkan nama ilahi YHWH yang mendasari kemunculan pertama dalam teks Ibrani Mazmur.
  rationale: Teks sumber Yunani memakai κύριος pada kedua tempat, sehingga teks utama menerjemahkan bentuk Yunani itu tanpa memasukkan tetragramaton secara langsung. Perbedaan antara “Tuhan” dan “Tuanku” mempertahankan hubungan gramatikal, sedangkan latar YHWH dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kontras serta penekanan “ia sendiri” dipertahankan. Kapitalisasi “-Ku” mengikuti rujukan kepada Allah dalam kutipan.
