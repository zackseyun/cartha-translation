  text: Ἀκούσαντες δὲ κατενύγησαν ⸂τὴν καρδίαν⸃, εἶπόν τε πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους· Τί ⸀ποιήσωμεν, ἄνδρες ἀδελφοί;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/037.yaml
  text: When they heard this[a], they were pierced to the heart, and they said to Peter and the rest of the apostles, “What should we do[b], brothers?”
translation:
  language: id
  text: Ketika mereka mendengar hal itu, hati mereka tertusuk[a], lalu mereka berkata kepada Petrus dan rasul-rasul lainnya, “Apa yang harus kami lakukan, saudara-saudara[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “hati mereka tersayat.” Ungkapan Yunani menggambarkan rasa tergugah atau tertekan secara tajam dalam batin.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pria-pria, saudara-saudara.” Ini merupakan sapaan konvensional; bergantung pada konteks, sapaan tersebut dapat mencakup laki-laki dan perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Ketika mendengar itu
  rationale: Partisip aoristus menyatakan keadaan yang mengawali tanggapan terhadap khotbah Petrus. Kata “itu” disuplai secara wajar dari konteks, sedangkan δέ tidak perlu diterjemahkan tersendiri karena hanya menandai kelanjutan wacana.
- source_word: κατενύγησαν τὴν καρδίαν
  choice: hati mereka tertusuk
  rationale: Mempertahankan metafora Yunani tentang dampak batin yang tajam, yakni rasa tergugah, terinsafkan, atau tertekan secara mendalam, tanpa membatasi maknanya pada satu keadaan psikologis.
- source_word: εἶπόν τε
  choice: lalu mereka berkata
  rationale: τε menghubungkan tindakan ini erat dengan reaksi sebelumnya. “Berkata” menerjemahkan λέγω secara langsung; “lalu” membuat urutan narasi alami dalam bahasa Indonesia.
- source_word: πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους
  choice: kepada Petrus dan rasul-rasul lainnya
  rationale: λοιπούς menunjuk kepada para rasul selebihnya, dengan Petrus disebut secara khusus.
- source_word: Τί ποιήσωμεν
  choice: Apa yang harus kami lakukan
  rationale: Subjungtif deliberatif menanyakan tindakan yang semestinya mereka ambil. “Harus” menyampaikan pertimbangan praktis itu secara alami dalam bahasa Indonesia modern.
- source_word: ἄνδρες ἀδελφοί
  choice: Saudara-saudara
  rationale: Ungkapan vokatif konvensional ini secara harfiah berunsur maskulin, tetapi dalam bahasa Indonesia “Saudara-saudara” merupakan sapaan hormat yang alami dan tetap mempertahankan nuansa kekeluargaan; bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan gender dalam sapaan ἄνδρες ἀδελφοί
  choice: Saudara-saudara
  alternative: Saudara-saudara laki-laki; Bapak-bapak dan saudara-saudara
  rationale: Teks Yunani memakai bentuk maskulin, tetapi ungkapan tersebut merupakan sapaan konvensional dan cakupan aktualnya dapat bergantung pada konteks. Terjemahan utama tidak menegaskan bahwa hanya laki-laki yang dimaksud, sementara bentuk Yunani dijelaskan dalam catatan kaki.
- issue: Sifat tanggapan batin κατενύγησαν τὴν καρδίαν
  choice: hati mereka tertusuk
  alternative: mereka sangat terharu; hati mereka tersayat
  rationale: Metafora dipertahankan agar teks tidak secara dini menentukan apakah tanggapan itu terutama rasa bersalah, penyesalan, kesedihan, atau kegelisahan batin, meskipun semua nuansa itu mungkin terkandung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Metafora sumber dipertahankan, sedangkan susunan kalimat disesuaikan agar alami bagi pembaca umum.
