  text: ἐξίσταντο ⸀δὲ καὶ ἐθαύμαζον ⸀λέγοντες· ⸀Οὐχ ἰδοὺ ⸀πάντες οὗτοί εἰσιν οἱ λαλοῦντες Γαλιλαῖοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/007.yaml
  text: And they were astonished and amazed[a], saying, “Look, are not all these who are speaking Galileans?”
translation:
  language: id
  text: Mereka tercengang dan takjub, sambil berkata, “Lihatlah,[a] bukankah semua orang ini yang sedang berbicara adalah orang Galilea?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Perhatikanlah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: tercengang
  rationale: Bentuk imperfek ini menyatakan keadaan sangat heran atau tercengang yang sedang berlangsung; ‘tercengang’ alami dalam bahasa Indonesia dan tetap kuat.
- source_word: δὲ
  choice: lalu
  rationale: Di sini δέ merupakan penghubung ringan yang melanjutkan narasi; ‘lalu’ mengalir alami tanpa memberi kontras yang tidak perlu.
- source_word: καὶ
  choice: dan
  rationale: 'Menghubungkan dua reaksi yang bersifat kumulatif: tercengang dan takjub.'
- source_word: ἐθαύμαζον
  choice: takjub
  rationale: Kata ini menyatakan rasa heran atau kagum; ‘takjub’ membedakannya dari ‘tercengang’ sambil mempertahankan penumpukan reaksi.
- source_word: λέγοντες
  choice: lalu berkata
  rationale: Partisipel ini memperkenalkan isi perkataan mereka; bentuk verbal ‘lalu berkata’ lebih alami dalam narasi Indonesia.
- source_word: Οὐχ
  choice: bukankah
  rationale: Partikel negatif dalam pertanyaan ini mengharapkan jawaban afirmatif; ‘bukankah’ menyampaikan nuansa tersebut dengan tepat.
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Partikel penarik perhatian ini diterjemahkan secara langsung dan wajar dengan ‘Lihatlah’.
- source_word: πάντες οὗτοί
  choice: semua orang ... ini
  rationale: Merujuk kepada seluruh kelompok yang sedang dibicarakan. ‘Orang’ melengkapi ungkapan Indonesia secara alami tanpa menambahkan keterangan gender.
- source_word: οἱ λαλοῦντες
  choice: yang sedang berbicara
  rationale: Partisipel substantival kini menunjukkan para pembicara dan tindakan yang sedang berlangsung.
- source_word: Γαλιλαῖοι
  choice: orang Galilea
  rationale: Sebutan asal daerah ini paling alami dalam bahasa Indonesia sebagai ‘orang Galilea’ dan tidak menambahkan alasan bagi keterkejutan orang banyak.
theological_decisions:
- issue: Nuansa sosial atau regional sebutan ‘orang Galilea’
  choice: Mempertahankan sebutan daerah tanpa penjelasan tambahan
  alternative: orang Galilea yang tidak berpendidikan; orang Galilea dari utara
  rationale: Ayat ini menyatakan keterkejutan atas asal Galilea para pembicara, tetapi tidak menjelaskan alasannya. Menambahkan aksen, pendidikan, atau status sosial akan memasukkan kesimpulan kontekstual ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Pasangan ‘tercengang dan takjub’ mempertahankan dua verba reaksi dalam Yunani; pertanyaan dengan ‘bukankah’ menjaga harapan akan jawaban afirmatif.
