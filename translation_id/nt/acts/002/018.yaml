  text: καί γε ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου ἐν ταῖς ἡμέραις ἐκείναις ἐκχεῶ ἀπὸ τοῦ πνεύματός μου, καὶ προφητεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/018.yaml
  text: Even on my male servants and my female servants in those days I will pour out from my Spirit[b][a], and they will prophesy.
translation:
  language: id
  text: Bahkan kepada budak-budak-Ku, laki-laki maupun perempuan[a], pada hari-hari itu akan Kucurahkan Roh-Ku[b], dan mereka akan bernubuat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba-hamba-Ku, laki-laki maupun perempuan.” Istilah Yunani dapat berarti hamba atau budak; di sini “budak” mempertahankan penekanan pada kedudukan sosial yang rendah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bahasa Yunani berbunyi “akan Kucurahkan dari Roh-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καί γε
  choice: Bahkan
  rationale: Gabungan partikel ini memberi penekanan. “Bahkan” menyampaikan daya klimaksnya secara wajar dalam bahasa Indonesia.
- source_word: ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου
  choice: ke atas budak-budak-Ku, baik laki-laki maupun perempuan
  rationale: δοῦλος dan δούλη dapat berarti hamba atau budak. “Budak” mempertahankan penekanan pada kedudukan sosial yang rendah, sedangkan frasa “baik laki-laki maupun perempuan” mempertahankan pembedaan gender yang dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: pada hari-hari itu
  rationale: Ungkapan waktu yang alami dan tetap mempertahankan unsur penunjuk “itu”.
- source_word: ἐκχεῶ
  choice: akan Kucurahkan
  rationale: Mempertahankan metafora pencurahan yang melimpah dan memakai bentuk ilahi yang ringkas serta lazim dalam ragam Alkitab bahasa Indonesia.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: dari Roh-Ku
  rationale: Menyatakan preposisi ἀπό secara langsung dan tidak menghapus kemungkinan nuansa bahwa pencurahan itu berasal dari Roh Allah.
- source_word: προφητεύσουσιν
  choice: mereka akan bernubuat
  rationale: Padanan langsung, jelas, dan mempertahankan istilah biblis tanpa parafrasa yang tidak perlu.
theological_decisions:
- issue: Makna sosial δοῦλος/δούλη dalam konteks pencurahan Roh
  choice: budak-budak-Ku, baik laki-laki maupun perempuan
  alternative: hamba-hamba-Ku, baik laki-laki maupun perempuan
  rationale: Penyebutan bentuk maskulin dan feminin menyoroti luasnya pemberian Roh sampai kepada orang-orang berkedudukan sosial rendah. “Budak” mempertahankan daya sosial tersebut tanpa menambahkan kesimpulan teologis di luar teks.
- issue: Ungkapan ἀπὸ τοῦ πνεύματός μου
  choice: dari Roh-Ku
  alternative: Roh-Ku / sebagian dari Roh-Ku
  rationale: “Dari Roh-Ku” mempertahankan ἀπό dan ambiguitas ungkapan sumber/partitif. Terjemahan utama tidak menentukan bahwa Roh diberikan secara terbagi-bagi, tetapi juga tidak menghapus bentuk asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “akan Kucurahkan” mempertahankan nada puitis-profetis tanpa menjadi kuno. Bentuk “budak-budak-Ku, baik laki-laki maupun perempuan” dipilih agar perbedaan gender tetap jelas namun alami.
