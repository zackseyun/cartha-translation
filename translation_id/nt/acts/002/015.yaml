  text: For these are not drunk[a], as you suppose, for it is the third hour of the day.
translation:
  language: id
  text: Sebab orang-orang ini tidak mabuk seperti yang kamu sangka, karena sekarang baru jam ketiga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Menurut cara penghitungan waktu Yahudi, sekitar pukul sembilan pagi.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Sebab ... tidak
  rationale: γάρ menghubungkan ayat ini sebagai penjelasan terhadap tuduhan pada ayat sebelumnya, sedangkan οὐ menyangkal tuduhan tersebut secara langsung.
- source_word: ὡς ὑμεῖς ὑπολαμβάνετε
  choice: seperti yang kamu sangka
  rationale: ὑπολαμβάνω di sini berarti menyangka atau mengira; bentuk ini mempertahankan sapaan langsung kepada para pendengar.
- source_word: οὗτοι
  choice: orang-orang ini
  rationale: Kata tunjuk ini merujuk kepada kelompok yang dituduh mabuk. Penambahan 'orang-orang' diperlukan agar ungkapannya alami dan jelas dalam bahasa Indonesia tanpa menentukan gender yang tidak dinyatakan oleh kata Yunani tersebut.
- source_word: μεθύουσιν
  choice: mabuk
  rationale: Bentuk kini ini dalam konteks menggambarkan keadaan mabuk yang dituduhkan, dan 'mabuk' merupakan padanan Indonesia yang paling langsung dan alami.
- source_word: ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας
  choice: karena sekarang baru jam ketiga pada hari itu
  rationale: γάρ kedua menyatakan alasan penolakan Petrus. 'Sekarang baru' mengungkapkan bahwa waktu tersebut masih pagi, sedangkan 'jam ketiga' mempertahankan cara penghitungan waktu Yahudi dalam teks utama.
- source_word: ὥρα τρίτη
  choice: jam ketiga
  rationale: Ungkapan waktu sumber dipertahankan dalam teks utama; padanan waktu modern dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada argumentatif yang lugas. Pengulangan hubungan sebab dipertahankan untuk mencerminkan dua kemunculan γάρ, sementara 'sekarang baru' membuat alasan Petrus alami bagi pembaca Indonesia.
