  text: αἰνοῦντες τὸν θεὸν καὶ ἔχοντες χάριν πρὸς ὅλον τὸν λαόν. ὁ δὲ κύριος προσετίθει τοὺς σῳζομένους καθ’ ἡμέραν ⸂ἐπὶ τὸ αὐτό⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/047.yaml
  text: praising God and having favor with all the people[a]. And the Lord was adding day by day those who were being saved to them.
translation:
  language: id
  text: Sambil memuji Allah dan disenangi oleh seluruh rakyat. Setiap hari Tuhan menambahkan kepada mereka[a] orang-orang yang sedang diselamatkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Yunani yang diterjemahkan “kepada mereka” juga dapat berarti “bersama-sama” atau “di tempat yang sama.”
    reason: alternative_reading
lexical_decisions:
- source_word: αἰνοῦντες τὸν θεόν
  choice: sambil memuji Allah
  rationale: Partisipel kini menggambarkan kegiatan yang berlangsung dan berkaitan dengan tindakan komunitas pada konteks sebelumnya; “sambil memuji” wajar dalam bahasa Indonesia.
- source_word: ἔχοντες χάριν πρὸς ὅλον τὸν λαόν
  choice: disenangi oleh seluruh rakyat
  rationale: Ungkapan ini paling wajar dipahami sebagai menikmati perkenanan atau niat baik dari masyarakat luas, bukan menunjukkan kemurahan kepada mereka.
- source_word: ὁ δὲ κύριος
  choice: Tuhan
  rationale: κύριος dipertahankan sebagai gelar “Tuhan”; δέ diwakili secara ringan oleh pergantian kalimat tanpa konjungsi yang kaku.
- source_word: προσετίθει
  choice: menambahkan
  rationale: Bentuk imperfek menyatakan tindakan yang terus atau berulang; keterangan “setiap hari” membuat sifat berulang itu jelas.
- source_word: τοὺς σῳζομένους
  choice: orang-orang yang sedang diselamatkan
  rationale: Partisipel kini pasif dipertahankan sebagai proses yang sedang berlangsung dan tindakan yang diterima, tanpa mengubahnya menjadi label statis.
- source_word: καθ’ ἡμέραν
  choice: Setiap hari
  rationale: Ungkapan Indonesia yang alami untuk tindakan yang berlangsung dari hari ke hari.
- source_word: ἐπὶ τὸ αὐτό
  choice: kepada mereka
  rationale: Dalam hubungan dengan “menambahkan,” frasa ini dipahami sebagai penambahan kepada komunitas yang telah disebut. Terjemahan ini menghindari penyisipan kata “jumlah” yang tidak tersurat, sementara ambiguitas frasa dicatat.
theological_decisions:
- issue: Aspek dan teologi keselamatan dalam τοὺς σῳζομένους
  choice: orang-orang yang sedang diselamatkan
  alternative: orang-orang yang diselamatkan; mereka yang telah diselamatkan
  rationale: Bentuk partisipel kini pasif menampilkan keselamatan sebagai tindakan yang sedang dialami dalam sudut pandang narasi. Terjemahan tidak dimaksudkan untuk memutuskan perdebatan teologis yang lebih luas.
- issue: Makna ἐπὶ τὸ αὐτό
  choice: kepada mereka
  alternative: bersama-sama; di tempat yang sama; kepada kelompok mereka
  rationale: Dengan προσετίθει, makna penambahan kepada komunitas paling sesuai dengan konteks, tetapi frasa Yunani itu sendiri dapat berarti “bersama-sama” atau “di tempat yang sama”; kemungkinan ini dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. “Seluruh rakyat” menunjuk masyarakat luas; “sedang diselamatkan” sengaja mempertahankan aspek proses dalam teks Yunani. Penanda catatan kaki ditempatkan sesudah klausa yang memuat frasa ambigu.
