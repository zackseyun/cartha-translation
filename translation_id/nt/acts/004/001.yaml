id: ACT.4.1
reference: Acts 4:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Λαλούντων δὲ αὐτῶν πρὸς τὸν λαὸν ἐπέστησαν αὐτοῖς οἱ ⸀ἱερεῖς καὶ ὁ στρατηγὸς τοῦ ἱεροῦ καὶ οἱ Σαδδουκαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/001.yaml
  text: While they were speaking to the people[a], the priests and the captain of the temple and the Sadducees came upon them[b],
translation:
  language: id
  text: Ketika mereka sedang berbicara kepada orang banyak, para imam, kepala pengawal Bait Allah[a], dan orang-orang Saduki menghampiri mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kepala pengawal Bait Allah adalah pejabat yang bertanggung jawab atas ketertiban dan keamanan di lingkungan Bait Allah.
    reason: cultural_note
  - marker: b
    text: Atau “mendatangi mereka.” Kata Yunani yang dipakai dapat berarti datang atau mendekat, dan dapat menyiratkan kedatangan yang mendadak; dalam konteks ini para pejabat menyela kegiatan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαλούντων δὲ αὐτῶν
  choice: Ketika mereka sedang berbicara
  rationale: Konstruksi genitif absolut dialihkan menjadi anak kalimat temporal yang alami dalam bahasa Indonesia. Partikel δέ menandai kelanjutan narasi dan tidak perlu diterjemahkan dengan kata tersendiri di sini.
- source_word: πρὸς τὸν λαὸν
  choice: kepada orang banyak
  rationale: Dalam latar Bait Allah ini, λαός menunjuk kepada masyarakat yang sedang berkumpul. 'Orang banyak' alami dan tidak menyiratkan seluruh bangsa.
- source_word: ἐπέστησαν αὐτοῖς
  choice: menghampiri mereka
  rationale: Kata kerja ini dapat menyatakan datang atau mendekat kepada seseorang, kadang secara mendadak. 'Menghampiri' menyampaikan kedatangan yang menyela tanpa menambahkan permusuhan secara eksplisit.
- source_word: οἱ ἱερεῖς
  choice: para imam
  rationale: Teks menyebut ἱερεῖς, bukan ἀρχιερεῖς; karena itu tidak diterjemahkan sebagai 'imam-imam kepala'.
- source_word: ὁ στρατηγὸς τοῦ ἱεροῦ
  choice: kepala pengawal Bait Allah
  rationale: στρατηγός menunjuk pejabat komando. Ungkapan ini menyampaikan fungsi jabatan tersebut secara jelas dalam bahasa Indonesia, sedangkan catatan kaki memberi konteks sejarahnya.
- source_word: οἱ Σαδδουκαῖοι
  choice: orang-orang Saduki
  rationale: Nama kelompok ini diterjemahkan dengan bentuk baku dan mudah dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Nuansa permusuhan dalam kedatangan para pejabat
  choice: menghampiri mereka
  alternative: menghadapi mereka / menyergap mereka
  rationale: Konteks selanjutnya memperlihatkan pertentangan, tetapi kata kerja dalam ayat ini sendiri tidak mengharuskan nuansa konfrontasi atau kekerasan. Pilihan netral mempertahankan perkembangan ketegangan dalam narasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Bait Allah' dipertahankan sebagai istilah yang dikenal luas untuk kompleks suci di Yerusalem. Urutan ketiga kelompok dipertahankan sesuai teks Yunani.
