id: ACT.4.8
reference: Acts 4:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε Πέτρος πλησθεὶς πνεύματος ἁγίου εἶπεν πρὸς αὐτούς· Ἄρχοντες τοῦ λαοῦ καὶ ⸀πρεσβύτεροι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/008.yaml
  text: Then Peter, filled with the Holy Spirit, said to them, “Rulers of the people and elders,”
translation:
  language: id
  text: Lalu Petrus, yang dipenuhi Roh Kudus, berkata kepada mereka, “Hai para penguasa rakyat dan para tua-tua,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Lalu
  rationale: Penanda urutan waktu yang secara alami melanjutkan peristiwa dalam narasi.
- source_word: Πέτρος
  choice: Petrus
  rationale: Bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: πλησθεὶς
  choice: yang dipenuhi
  rationale: Menjaga makna partisip aoris pasif πίμπλημι sekaligus menghasilkan susunan bahasa Indonesia yang wajar.
- source_word: πνεύματος ἁγίου
  choice: Roh Kudus
  rationale: Genitif sesudah πλησθεὶς menyatakan isi atau sarana pemenuhan; ungkapan baku bahasa Indonesia ialah 'dipenuhi Roh Kudus'.
- source_word: εἶπεν πρὸς αὐτούς
  choice: berkata kepada mereka
  rationale: Padanan langsung dan alami untuk formula ujaran naratif ini.
- source_word: Ἄρχοντες
  choice: para penguasa
  rationale: Menunjuk orang-orang yang memegang kewenangan pemerintahan atau pengadilan, bukan sekadar pemimpin dalam arti umum.
- source_word: τοῦ λαοῦ
  choice: rakyat
  rationale: Dalam konteks ini λαός menunjuk umat atau rakyat Israel; bentuk 'penguasa rakyat' mempertahankan hubungan genitif secara ringkas.
- source_word: πρεσβύτεροι
  choice: para tua-tua
  rationale: Menunjuk jabatan para tua-tua yang diakui dalam kepemimpinan masyarakat, bukan hanya laki-laki lanjut usia.
theological_decisions:
- issue: Rujukan πνεύματος ἁγίου
  choice: Roh Kudus
  alternative: roh kudus
  rationale: Dalam Kisah Para Rasul, ungkapan ini merujuk kepada Roh Kudus ilahi yang memperlengkapi saksi untuk berbicara; kapitalisasi menandai nama atau sebutan diri tanpa menambahkan gagasan di luar konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'Hai' memperjelas bentuk vokatif Yunani; 'para tua-tua' mempertahankan istilah kelembagaan yang lazim dalam terjemahan Alkitab Indonesia.
