  yaml_path: translation/nt/acts/004/003.yaml
  text: And they laid hands on them and put them in custody until the next day[b][a], for it was already evening.
translation:
  language: id
  text: Lalu mereka menangkap Petrus dan Yohanes[a] dan menahan mereka[b] sampai keesokan harinya, sebab hari sudah petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “meletakkan tangan pada mereka”; dalam konteks ini, ungkapan Yunani tersebut berarti menangkap mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau “menempatkan mereka dalam tahanan” atau “menempatkan mereka di bawah penjagaan.” Bahasa Yunani tidak menyebutkan secara khusus tempat mereka ditahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον αὐτοῖς τὰς χεῖρας
  choice: menangkap Petrus dan Yohanes
  rationale: Ungkapan Yunani ini secara harfiah berarti 'menumpangkan tangan atas mereka', tetapi dalam konteks tindakan bermusuhan oleh pihak berwenang bermakna menangkap. Nama Petrus dan Yohanes dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: ἔθεντο εἰς τήρησιν
  choice: menahan keduanya
  rationale: τήρησις menunjuk pada penjagaan atau penahanan tanpa menentukan apakah mereka dimasukkan ke penjara atau ditempatkan di fasilitas tertentu. 'Menahan' alami dalam bahasa Indonesia dan tidak menambahkan rincian yang tidak dinyatakan teks.
- source_word: εἰς τὴν αὔριον
  choice: sampai keesokan harinya
  rationale: Frasa ini menyatakan batas waktu penahanan. 'Sampai keesokan harinya' sesuai dengan gaya naratif dan makna sumber.
- source_word: ἦν γὰρ ἑσπέρα ἤδη
  choice: sebab hari sudah malam
  rationale: Klausa ini menjelaskan alasan penundaan sampai hari berikutnya. Terjemahan tersebut mempertahankan penyebutan waktu malam secara jelas dan alami.
