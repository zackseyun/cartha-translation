  register: Bahasa Indonesia baku, modern, dan naratif. Terjemahan mengutamakan makna idiom Yunani dalam teks utama, sedangkan bentuk harfiahnya dicatat dalam catatan kaki. 'Keduanya' menjaga kejelasan bahwa yang ditahan ialah Petrus dan Yohanes.
