  text: ἐτῶν γὰρ ἦν πλειόνων τεσσεράκοντα ὁ ἄνθρωπος ἐφ’ ὃν ⸀γεγόνει τὸ σημεῖον τοῦτο τῆς ἰάσεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/022.yaml
  text: For the man on whom this sign of healing had happened was more than forty years old[a].
translation:
  language: id
  text: Sebab, orang yang mengalami tanda penyembuhan ini berusia lebih dari empat puluh tahun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “tanda berupa penyembuhan ini” atau “mukjizat penyembuhan ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτῶν ... πλειόνων τεσσεράκοντα
  choice: telah berusia lebih dari empat puluh tahun
  rationale: Konstruksi genitif dengan bentuk komparatif πλειόνων menyatakan umur. Ungkapan ini menyampaikan bahwa usia orang itu melampaui empat puluh tahun; kata 'telah' juga sesuai dengan sudut pandang narasi terhadap keadaannya saat itu.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memberikan alasan atau penjelasan yang mendukung pernyataan sebelumnya. 'Sebab' mempertahankan hubungan wacana tersebut secara jelas dan wajar dalam bahasa Indonesia.
- source_word: ὁ ἄνθρωπος
  choice: orang
  rationale: ἄνθρωπος menunjuk kepada laki-laki tertentu yang sudah dikenal dari konteks. Bahasa Indonesia secara alami dapat menyebutnya 'orang' tanpa menghilangkan identitasnya yang telah jelas dalam narasi.
- source_word: ἐφ’ ὃν
  choice: yang mengalami
  rationale: Secara harfiah frasa ini berarti 'yang atasnya/padanya', yakni orang yang terkena atau menjadi penerima peristiwa tersebut. 'Yang mengalami' merupakan padanan Indonesia yang alami tanpa menambahkan pelaku yang tidak dinyatakan secara eksplisit.
- source_word: γεγόνει
  choice: mengalami ... itu
  rationale: Bentuk pluperfek γίνομαι menyatakan peristiwa yang sudah terjadi sebelumnya pada orang tersebut. Dalam susunan Indonesia, maknanya disampaikan secara idiomatis melalui 'orang yang mengalami', sedangkan 'itu' menunjuk kembali pada tanda yang telah terjadi.
- source_word: τὸ σημεῖον τοῦτο
  choice: tanda ... itu
  rationale: σημεῖον diterjemahkan 'tanda' untuk mempertahankan penekanan Lukas pada makna pembuktian atau penunjukan dari peristiwa tersebut, bukan hanya sifatnya yang ajaib.
- source_word: τῆς ἰάσεως
  choice: penyembuhan
  rationale: ἴασις berarti penyembuhan atau pemulihan dari penyakit. 'Penyembuhan' adalah padanan yang paling langsung, jelas, dan wajar dalam konteks ini.
theological_decisions:
- issue: Penerjemahan σημεῖον dalam konteks mukjizat
  choice: tanda
  alternative: mukjizat
  rationale: '''Tanda'' mempertahankan nuansa bahwa tindakan tersebut memiliki makna yang menunjuk pada dan membuktikan karya Allah. ''Mukjizat'' mungkin benar secara kontekstual, tetapi lebih menonjolkan keajaibannya daripada fungsi tandanya.'
- issue: Pelaku yang tersirat dalam γεγόνει
  choice: mengalami tanda penyembuhan itu
  alternative: tanda penyembuhan itu telah dilakukan atasnya
  rationale: γίνομαι berfokus pada terjadinya peristiwa dan tidak secara eksplisit menyatakan pelaku. Terjemahan yang dipilih tidak memasukkan pelaku tambahan, sementara konteks yang lebih luas tetap menjelaskan sumber kuasa penyembuhan tersebut.
- issue: Hubungan genitif τῆς ἰάσεως dengan σημεῖον
  choice: tanda penyembuhan
  alternative: tanda berupa penyembuhan
  rationale: Bentuk ringkas 'tanda penyembuhan' mempertahankan hubungan genitif Yunani tanpa menetapkan secara berlebihan apakah penyembuhan itu isi, jenis, atau ciri tanda tersebut. Alternatif dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Susunan 'orang yang mengalami' dipilih agar alami bagi pembaca umum, sedangkan 'tanda' dipertahankan untuk mencerminkan istilah Yunani dan nuansa teologis Lukas.
