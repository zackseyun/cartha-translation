  text: καὶ καλέσαντες αὐτοὺς παρήγγειλαν ⸀τὸ καθόλου μὴ φθέγγεσθαι μηδὲ διδάσκειν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/018.yaml
  text: And after calling them in[a], they ordered them not to speak at all nor teach in the name of Jesus.
translation:
  language: id
  text: Setelah memanggil mereka masuk, mereka memerintahkan agar mereka sama sekali tidak berbicara ataupun mengajar dalam nama Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “agar mereka tidak mengatakan apa pun sama sekali ataupun mengajar dalam nama Yesus.”
    reason: Alternatif leksikal bagi μὴ φθέγγεσθαι; penempatan “sama sekali” dapat dipahami menegaskan seluruh larangan (τὸ καθόλου).
lexical_decisions:
- source_word: καλέσαντες αὐτούς
  choice: Setelah memanggil mereka masuk
  rationale: Partisip aoris dipahami secara temporal sebagai tindakan yang mendahului perintah utama. Kata “masuk” dibuat eksplisit secara kontekstual karena mereka dipanggil kembali ke hadapan sidang.
- source_word: παρήγγειλαν
  choice: mereka memerintahkan
  rationale: Kata kerja ini menyatakan arahan yang berwibawa; “memerintahkan” mempertahankan kekuatan tersebut dalam bahasa Indonesia modern.
- source_word: τὸ καθόλου
  choice: sama sekali tidak
  rationale: Ungkapan ini menegaskan larangan secara menyeluruh dan paling wajar disampaikan dengan “sama sekali tidak”.
- source_word: μὴ φθέγγεσθαι
  choice: tidak berbicara
  rationale: φθέγγομαι berarti berbicara atau mengucapkan sesuatu. “Berbicara” alami dan tetap cukup luas dalam konteks larangan ini.
- source_word: μηδὲ διδάσκειν
  choice: ataupun mengajar
  rationale: μηδέ mengoordinasikan kegiatan kedua yang turut dilarang; “ataupun” mempertahankan hubungan negatif yang seimbang.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: dalam nama Yesus
  rationale: Ungkapan ini dapat menunjuk pada berbicara atau bertindak dengan mengacu kepada atau berdasarkan wewenang nama Yesus. Terjemahan tradisional yang masih alami ini mempertahankan keluasan maknanya.
theological_decisions:
- issue: Cakupan larangan mengenai kesaksian tentang Yesus
  choice: Larangan menyeluruh untuk berbicara maupun mengajar dalam kaitan dengan nama Yesus
  alternative: Larangan yang khusus ditujukan pada pemberitaan di muka umum
  rationale: Gabungan τὸ καθόλου, μὴ φθέγγεσθαι, dan μηδὲ διδάσκειν menyatakan larangan tegas atas ujaran dan pengajaran. Terjemahan tidak mempersempitnya hanya menjadi pemberitaan publik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “mereka” pada awal ayat mengikuti subjek dan objek Yunani, sedangkan “keduanya” menjelaskan bahwa larangan ditujukan kepada dua orang yang dipanggil tanpa menambahkan identitas yang tidak dinyatakan dalam ayat ini.
