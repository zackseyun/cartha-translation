id: ACT.4.25
reference: Acts 4:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃ διὰ ⸂πνεύματος ἁγίου⸃ στόματος Δαυὶδ παιδός σου εἰπών· Ἱνατί ἐφρύαξαν ἔθνη καὶ λαοὶ ἐμελέτησαν κενά;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/025.yaml
  text: 'who[a], through the Holy Spirit, by the mouth of David your servant, said: ‘Why did the nations rage[b], and the peoples devise vain things?’'
translation:
  language: id
  text: 'yang[a], melalui Roh Kudus, melalui mulut Daud, hamba-Mu, berfirman: “Mengapa bangsa-bangsa mengamuk[b], dan suku-suku bangsa merancang hal-hal yang sia-sia[c]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sebagian naskah berbunyi “bapa kami, Daud, hamba-Mu”, sehingga pengantarnya dapat dipahami: “yang, melalui Roh Kudus, melalui mulut bapa kami, Daud, hamba-Mu, berfirman.”'
    reason: textual_variant
  - marker: b
    text: Atau “bergejolak”. Kata Yunani ini menggambarkan kegaduhan atau gejolak yang menentang.
    reason: lexical_alternative
  - marker: c
    text: Atau “merenungkan hal-hal yang sia-sia”. Dalam konteks ini kata Yunaninya dapat pula menunjuk pada menyusun rencana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃
  choice: yang
  rationale: Kata penghubung relatif ini mengaitkan ucapan tersebut kembali kepada Allah dalam ayat 24. Frasa tekstual yang sulit dan diperselisihkan, ‘bapa kami’, tidak dipaksakan ke dalam teks utama, tetapi dicatat dalam catatan kaki.
- source_word: διὰ πνεύματος ἁγίου
  choice: melalui Roh Kudus
  rationale: διά dengan bentuk genitif menyatakan sarana atau perantaraan; ‘melalui’ mempertahankan peran Roh Kudus secara eksplisit.
- source_word: στόματος Δαυὶδ
  choice: dengan perantaraan mulut Daud
  rationale: Ungkapan ini mempertahankan gambaran alkitabiah tentang Allah yang menyampaikan firman melalui ucapan Daud, sekaligus tetap dapat dipahami dalam bahasa Indonesia.
- source_word: παιδός σου
  choice: hamba-Mu
  rationale: παῖς dapat berarti anak atau hamba. Dalam konteks Daud sebagai pelayan Allah dan pembawa perkataan ilahi, ‘hamba’ adalah makna yang paling sesuai.
- source_word: εἰπών
  choice: berfirman
  rationale: Partisipel aoris ini memperkenalkan kutipan. Karena subjek utamanya adalah Allah, ‘berfirman’ merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: Ἱνατί
  choice: Mengapa
  rationale: Padanan interogatif langsung dan alami.
- source_word: ἐφρύαξαν
  choice: mengamuk
  rationale: Kata ini menggambarkan gejolak keras dan pembangkangan; ‘mengamuk’ menyampaikan daya emosional serta permusuhannya.
- source_word: ἔθνη
  choice: bangsa-bangsa
  rationale: Dalam kutipan Mazmur ini, istilah tersebut menunjuk secara luas kepada berbagai bangsa, bukan khususnya orang bukan Yahudi sebagai kategori keagamaan.
- source_word: λαοὶ
  choice: suku-suku bangsa
  rationale: Pilihan ini mempertahankan bentuk jamak dan paralelisme dengan ‘bangsa-bangsa’, serta terdengar lebih alami daripada ‘kaum-kaum’ dalam bahasa Indonesia modern.
- source_word: ἐμελέτησαν
  choice: merancang
  rationale: Walaupun dapat berarti ‘merenungkan’, dalam konteks perlawanan kata ini bermakna memikirkan atau menyusun suatu rencana.
- source_word: κενά
  choice: hal-hal yang sia-sia
  rationale: Ungkapan ini mempertahankan gagasan tentang kehampaan sekaligus ketidakberhasilan tanpa menjadikannya terlalu abstrak.
theological_decisions:
- issue: Bentuk tekstual pengantar kutipan
  choice: Teks utama memakai ‘yang’ tanpa memasukkan frasa ‘bapa kami’.
  alternative: Sebagian naskah menghasilkan pengantar yang menyebut ‘Daud, bapa kami dan hamba-Mu’.
  rationale: Frasa τοῦ πατρὸς ἡμῶν diperselisihkan secara tekstual dan posisinya sulit. Teks utama mempertahankan hubungan sintaksis dengan Allah sebagai pembicara, sedangkan varian penting itu disajikan secara transparan dalam catatan kaki.
- issue: Nuansa ἐμελέτησαν
  choice: merancang
  alternative: merenungkan
  rationale: Konteks kutipan Mazmur menggambarkan perlawanan bangsa-bangsa, sehingga nuansa menyusun rencana lebih menonjol; kemungkinan makna harfiahnya tetap dicatat.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dengan corak kutipan Mazmur tetap terasa. Kapitalisasi pronomina ‘-Mu’ mengikuti kebiasaan hormat dalam penerbitan Alkitab Indonesia. Susunan awal sengaja berupa klausa relatif karena ayat ini melanjutkan kalimat dari ayat 24.
