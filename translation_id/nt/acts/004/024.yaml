id: ACT.4.24
reference: Acts 4:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ὁμοθυμαδὸν ἦραν φωνὴν πρὸς τὸν θεὸν καὶ εἶπαν· Δέσποτα, ⸀σὺ ὁ ποιήσας τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/024.yaml
  text: When they heard this[a], they lifted their voices together to God and said, “Master, you are the one who made heaven and earth and sea[b], and everything in them,”
translation:
  language: id
  text: Setelah mendengar hal itu, mereka dengan sehati[a] mengangkat suara kepada Allah dan berkata, “Ya Penguasa[b], Engkaulah yang menjadikan langit, bumi, laut, dan segala sesuatu yang ada di dalamnya,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan satu hati”; kata Yunani ini menyatakan kesatuan dalam sikap dan tindakan.
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: Δέσποτα (Despota), gelar yang menekankan wewenang mutlak seorang penguasa atau tuan; berbeda dari κύριος (“Tuhan”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Setelah mendengar hal itu
  rationale: Partisip aoris ini berfungsi temporal. Frasa “hal itu” disediakan dari konteks wacana agar alami dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: ὁμοθυμαδόν
  choice: dengan sehati
  rationale: Mengungkapkan kesatuan sikap dan tindakan kelompok dalam doa; lebih tepat daripada “dengan suara bulat,” yang bernuansa pengambilan keputusan.
- source_word: ἦραν φωνήν
  choice: mengangkat suara
  rationale: Mempertahankan metafora Yunani dan bentuk kolektif tunggal “suara,” sambil tetap dapat dipahami sebagai tindakan bersama.
- source_word: πρὸς τὸν θεόν
  choice: kepada Allah
  rationale: Dalam konteks doa, πρός menunjukkan arah sapaan kepada Allah.
- source_word: Δέσποτα
  choice: Ya Penguasa
  rationale: Menyampaikan gelar bagi pribadi yang memiliki wewenang mutlak dan membedakannya dari κύριος, yang lazim diterjemahkan “Tuhan.” Partikel vokatif “Ya” membuat sapaan alami dalam bahasa Indonesia.
- source_word: σὺ ὁ ποιήσας
  choice: Engkaulah yang menjadikan
  rationale: Bentuk “-lah” mempertahankan penekanan pada σὺ dan konstruksi partisip artikular yang mengidentifikasi Allah sebagai Sang Pencipta.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: langit, bumi, laut
  rationale: Mempertahankan rumusan penciptaan yang baku dan cakupan tiga ranah dalam teks Yunani; penghilangan artikel sesuai tata bahasa Indonesia.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: segala sesuatu yang ada di dalamnya
  rationale: Ungkapan Indonesia yang alami dan menyeluruh bagi seluruh isi langit, bumi, dan laut.
theological_decisions:
- issue: Penerjemahan Δέσποτα sebagai gelar ilahi
  choice: Ya Penguasa
  alternative: Ya Tuan; ya Tuhan Yang Berdaulat
  rationale: “Penguasa” menjaga penekanan pada kewenangan mutlak dan perbedaan leksikal dari κύριος. “Tuan” lebih harfiah dalam relasi tuan-hamba tetapi dalam bahasa Indonesia modern dapat terdengar terlalu duniawi; “Tuhan Yang Berdaulat” menambahkan gelar κύριος yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Engkaulah” dipakai untuk mempertahankan penekanan sumber sekaligus register doa. Metafora “mengangkat suara” dipertahankan karena masih jelas dan menjaga bentuk kolektif teks Yunani.
