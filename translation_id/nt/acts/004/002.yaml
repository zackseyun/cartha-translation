  source_fidelity: Revisi diperlukan karena “bahwa dalam Yesus ada kebangkitan” menambahkan klausa eksistensial (“ada”) yang tidak dinyatakan dalam bahasa Yunani dan menggeser hubungan ἐν τῷ Ἰησοῦ dengan “kebangkitan.” Susunan revisi mempertahankan frasa itu sebagai keterangan yang terbuka bagi “kebangkitan.”
  naturalness: “Sangat kesal,” “orang banyak,” dan “memberitakan kebangkitan dari antara orang mati dalam Yesus” merupakan bahasa Indonesia baku yang lebih idiomatis dalam konteks ini. “Rakyat” dapat bernuansa politis-modern, sedangkan λαός di sini menunjuk orang banyak secara kolektif.
  terminology: “Kebangkitan dari antara orang mati” dengan tepat mencerminkan τὴν ἀνάστασιν τὴν ἐκ νεκρῶν. “Memberitakan” memadai untuk καταγγέλλειν. Frasa “dalam Yesus” dipertahankan tanpa menentukannya sebagai kebangkitan Yesus saja atau sebagai kebangkitan melalui Yesus.
  issues:
  - severity: medium
    issue: Klausa “bahwa dalam Yesus ada kebangkitan” menambahkan makna eksistensial.
    rationale: Bahasa Yunani menyatakan bahwa mereka memberitakan “kebangkitan dari antara orang mati” dengan frasa ἐν τῷ Ἰησοῦ; tidak terdapat padanan untuk “ada.” Tambahan itu juga membuat frasa preposisional terdengar sebagai dasar keberadaan kebangkitan, bukan sebagai kualifikasi pemberitaan/kebangkitan.
  - severity: low
    issue: “Rakyat” kurang netral untuk τὸν λαόν dalam konteks ini.
    rationale: Dalam bahasa Indonesia modern, “rakyat” dapat membangkitkan register kenegaraan atau politis. “Orang banyak” lebih alami untuk kelompok pendengar yang dimaksud.
  - severity: low
    issue: “Sangat terganggu” kurang tepat untuk διαπονούμενοι.
    rationale: Partisip ini terutama menyatakan kejengkelan atau kekesalan kuat, bukan keadaan seseorang yang aktivitasnya terganggu. “Sangat kesal” menyampaikan reaksi emosionalnya dengan lebih tepat.
