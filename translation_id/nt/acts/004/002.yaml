  text: διαπονούμενοι διὰ τὸ διδάσκειν αὐτοὺς τὸν λαὸν καὶ καταγγέλλειν ἐν τῷ Ἰησοῦ τὴν ἀνάστασιν ⸂τὴν ἐκ⸃ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/002.yaml
  text: being greatly disturbed because they were teaching the people and proclaiming in Jesus the resurrection from the dead,[a]
translation:
  language: id
  text: Mereka sangat kesal karena keduanya mengajar orang banyak dan memberitakan kebangkitan dari antara orang mati dalam Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memberitakan, dalam hal Yesus, kebangkitan dari antara orang mati.” Ungkapan Yunani “dalam Yesus” dapat menunjuk secara khusus kepada kebangkitan sebagaimana nyata dalam kebangkitan Yesus sendiri.
    reason: alternative_reading
lexical_decisions:
- source_word: διαπονούμενοι
  choice: sangat terganggu
  rationale: Partisip ini menyatakan kekesalan atau keresahan yang kuat. 'Sangat terganggu' menyampaikan intensitasnya secara wajar tanpa menjadi terlalu percakapan atau berlebihan.
- source_word: διὰ τὸ διδάσκειν αὐτοὺς
  choice: karena keduanya mengajar
  rationale: διά dengan infinitif berartikel menyatakan sebab. 'Keduanya' merujuk secara alami kepada Petrus dan Yohanes dalam konteks dekat tanpa menyisipkan sebutan jabatan.
- source_word: τὸν λαὸν
  choice: rakyat
  rationale: λαός menunjuk kepada umat atau masyarakat secara kolektif, bukan sekadar kerumunan sesaat. 'Rakyat' ringkas dan sesuai dalam konteks ini.
- source_word: καταγγέλλειν
  choice: memberitakan
  rationale: Kata kerja ini menyatakan pengumuman atau pewartaan di muka umum. 'Memberitakan' alami, bermartabat, dan tidak mempersempitnya menjadi bentuk khotbah tertentu.
- source_word: ἐν τῷ Ἰησοῦ
  choice: dalam Yesus
  rationale: 'Terjemahan langsung ini mempertahankan keterbukaan ἐν: kebangkitan dapat dipahami sebagai nyata, berpusat, atau diperlihatkan dalam diri Yesus.'
- source_word: τὴν ἀνάστασιν τὴν ἐκ νεκρῶν
  choice: kebangkitan dari antara orang mati
  rationale: Ungkapan ini mempertahankan gambaran bangkit keluar dari kalangan orang-orang mati dan lebih jelas daripada sekadar 'kebangkitan orang mati', yang dapat terdengar hanya sebagai kebangkitan umum.
theological_decisions:
- issue: Makna ἐν τῷ Ἰησοῦ dalam pemberitaan kebangkitan
  choice: dalam Yesus ada kebangkitan
  alternative: dalam hal Yesus, kebangkitan dari antara orang mati; atau melalui Yesus ada kebangkitan
  rationale: Preposisi ἐν memungkinkan beberapa nuansa yang berdekatan. Teks utama mempertahankan ungkapan 'dalam Yesus' agar tidak menentukan secara berlebihan apakah yang dimaksud terutama kebangkitan Yesus sendiri, kebangkitan yang diperlihatkan dalam dirinya, atau kebangkitan yang tersedia melalui dirinya.
- issue: Cakupan kebangkitan dari antara orang mati
  choice: rumusan yang dapat mencakup kebangkitan Yesus dan harapan kebangkitan yang dinyatakan di dalam dirinya
  alternative: rujukan khusus hanya kepada kebangkitan Yesus; atau ajaran umum tentang kebangkitan akhir
  rationale: Susunan Yunani dapat mengarahkan perhatian kepada kebangkitan yang nyata dalam kasus Yesus sekaligus pemberitaan kebangkitan yang lebih luas. Terjemahan tidak mempersempit cakupannya melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Karena ayat ini meneruskan kalimat dari ayat 1, teks dimulai dengan frasa keadaan tanpa menambahkan subjek para pemimpin yang tidak terdapat secara eksplisit dalam ayat ini. 'Keduanya' memperjelas αὐτούς berdasarkan konteks Petrus dan Yohanes.
