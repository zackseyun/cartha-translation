id: ACT.4.26
reference: Acts 4:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: παρέστησαν οἱ βασιλεῖς τῆς γῆς καὶ οἱ ἄρχοντες συνήχθησαν ἐπὶ τὸ αὐτὸ κατὰ τοῦ κυρίου καὶ κατὰ τοῦ χριστοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/026.yaml
  text: The kings of the earth took their stand[a], and the rulers were gathered together against the Lord and against his Messiah.
translation:
  language: id
  text: Raja-raja di bumi mengambil sikap, dan para penguasa berkumpul bersama untuk melawan Tuhan dan melawan Mesias-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus”; kata Yunani Christos berarti “Yang Diurapi.”
    reason: Menjaga pilihan terjemahan tradisional dan menjelaskan arti gelar Yunani yang mendasari “Mesias”.
lexical_decisions:
- source_word: παρέστησαν
  choice: mengambil sikap
  rationale: Ungkapan ini menyampaikan tindakan sengaja untuk berdiri dalam perlawanan, bukan sekadar posisi tubuh, sekaligus mempertahankan gema Mazmur 2:2.
- source_word: βασιλεῖς τῆς γῆς
  choice: raja-raja di bumi
  rationale: βασιλεῖς secara khusus berarti para raja, sedangkan τῆς γῆς dalam konteks Mazmur 2 menunjuk pada cakupan dunia, bukan sekadar suatu negeri tertentu.
- source_word: ἄρχοντες
  choice: para penguasa
  rationale: Pilihan ini mempertahankan kesejajaran dengan “raja-raja” dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: συνήχθησαν ἐπὶ τὸ αὐτό
  choice: berkumpul bersama
  rationale: Bentuk pasif Yunani dan gagasan berkumpul di tempat atau tujuan yang sama dipertahankan secara alami; dalam bahasa Indonesia, bentuk ber- sudah dapat menyatakan keadaan tanpa agen yang disebutkan.
- source_word: κατὰ ... κατὰ
  choice: melawan ... dan melawan
  rationale: Pengulangan preposisi Yunani dipertahankan untuk menonjolkan permusuhan yang diarahkan baik kepada Tuhan maupun kepada Mesias-Nya.
- source_word: κυρίου
  choice: Tuhan
  rationale: Dalam kutipan Kitab Suci ini, κύριος merujuk kepada Allah dan paling tepat diterjemahkan dengan gelar baku “Tuhan”.
- source_word: χριστοῦ αὐτοῦ
  choice: Mesias-Nya
  rationale: Dalam kutipan Mazmur 2, Χριστός berfungsi sebagai gelar bagi sosok yang diurapi Tuhan. “Mesias” mempertahankan latar Ibrani dan nuansa gelarnya, sedangkan enklitik “-Nya” menyatakan hubungan dengan Tuhan.
theological_decisions:
- issue: Penerjemahan Χριστός dalam kutipan Mazmur 2
  choice: Mesias
  alternative: Kristus; Yang Diurapi
  rationale: Konteks kutipan Mazmur 2 menampilkan istilah ini sebagai gelar, sehingga “Mesias” paling jelas mempertahankan kerangka mesianik Perjanjian Lama. “Kristus” tetap dicantumkan dalam catatan kaki karena lazim dalam pemakaian Perjanjian Baru, sementara makna harfiahnya ialah “Yang Diurapi”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan kesejajaran puitis kutipan Mazmur 2, termasuk pengulangan “melawan”. Penanda catatan kaki ditempatkan sesudah “Mesias-Nya” karena catatan menerangkan Χριστός.
