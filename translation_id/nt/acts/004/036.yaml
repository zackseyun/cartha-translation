  text: ⸀Ἰωσὴφ δὲ ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων, ὅ ἐστιν μεθερμηνευόμενον υἱὸς παρακλήσεως, Λευίτης, Κύπριος τῷ γένει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/036.yaml
  text: Joseph[a], who was called Barnabas by the apostles—which translated means son of encouragement—a Levite, a native of Cyprus,
translation:
  language: id
  text: Adapun Yusuf, yang oleh rasul-rasul disebut Barnabas—yang jika diterjemahkan berarti “anak yang memberi semangat”[a]—adalah seorang Lewi asal Siprus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak yang menasihati,” “anak penghiburan,” atau “anak yang menghibur.” Kata Yunani yang dipakai dapat mengandung arti memberi semangat, mendesak atau menasihati, maupun menghibur.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωσὴφ
  choice: Yusuf
  rationale: Bentuk baku bahasa Indonesia untuk nama Ibrani ini dalam konteks Alkitab.
- source_word: δὲ
  choice: Adapun
  rationale: Menandai peralihan ringan kepada Yusuf sebagai contoh khusus tanpa memberi kesan pertentangan yang kuat.
- source_word: ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων
  choice: yang oleh rasul-rasul disebut Barnabas
  rationale: Mengungkapkan bahwa sebutan Barnabas berasal dari para rasul, tanpa menambahkan makna 'juga' yang tidak dinyatakan secara eksplisit.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: yang jika diterjemahkan berarti
  rationale: Menyampaikan keterangan Lukas mengenai arti nama tersebut secara jelas dan alami.
- source_word: υἱὸς παρακλήσεως
  choice: anak pemberi semangat
  rationale: Ungkapan ini alami bagi pembaca Indonesia dan mempertahankan arti luas παράκλησις sebagai dorongan atau penguatan, sementara nuansa nasihat dan penghiburan dicatat dalam catatan kaki.
- source_word: Λευίτης
  choice: seorang Lewi
  rationale: Padanan baku bagi identitas suku dan keagamaan tersebut.
- source_word: Κύπριος τῷ γένει
  choice: asal Siprus
  rationale: Secara alami menyatakan asal-usul atau tempat kelahiran yang ditunjukkan oleh τῷ γένει.
theological_decisions:
- issue: Cakupan makna παρακλήσεως dalam penjelasan nama Barnabas
  choice: anak pemberi semangat
  alternative: anak pemberi nasihat; anak penghiburan; anak pemberi penghiburan
  rationale: Kata παράκλησις dapat menunjuk pada dorongan, desakan atau nasihat, dan penghiburan. Teks tidak mengharuskan satu nuansa teologis yang sempit, sehingga teks utama memakai ungkapan yang luas dan catatan kaki mempertahankan kemungkinan lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan appositif Yunani dijadikan kalimat Indonesia yang utuh agar ayat dapat dibaca secara mandiri; tanda pisah mempertahankan keterangan sisipan tentang arti nama Barnabas.
