  text: καὶ τὰ νῦν, κύριε, ἔπιδε ἐπὶ τὰς ἀπειλὰς αὐτῶν καὶ δὸς τοῖς δούλοις σου μετὰ παρρησίας πάσης λαλεῖν τὸν λόγον σου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/029.yaml
  text: And now[a], Lord, look upon their threats and grant your servants to speak your word with all boldness,
translation:
  language: id
  text: Dan sekarang, ya Tuhan, perhatikanlah ancaman-ancaman mereka dan karuniakanlah keberanian penuh kepada hamba-hamba-Mu[a] untuk menyampaikan firman-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “budak-budak-Mu”. Kata Yunani doulos dapat menunjuk kepada orang yang menjadi milik seorang tuan. Di sini dipakai “hamba-hamba-Mu” karena konteks doa menonjolkan sikap rendah hati dalam melayani dan ketundukan kepada Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τὰ νῦν
  choice: Dan sekarang
  rationale: Ungkapan adverbial ini mengalihkan doa dari uraian sebelumnya kepada permohonan dalam keadaan yang sedang dihadapi; bentuk ini alami dalam bahasa Indonesia.
- source_word: κύριε
  choice: ya Tuhan
  rationale: Sapaan langsung kepada Allah dalam doa; partikel “ya” menandai sapaan secara alami dan khidmat.
- source_word: ἔπιδε ἐπὶ
  choice: perhatikanlah
  rationale: Imperatif ini meminta Allah memandang dengan perhatian atau mengindahkan ancaman tersebut. “Perhatikanlah” mempertahankan maksudnya tanpa menjadi kaku.
- source_word: τὰς ἀπειλὰς αὐτῶν
  choice: ancaman-ancaman mereka
  rationale: Bentuk ulang menyatakan nomina jamak Yunani secara jelas dan mempertahankan rujukan kepada ancaman para lawan.
- source_word: δὸς
  choice: karuniakanlah
  rationale: Secara harfiah berarti “berikanlah”, tetapi dalam bahasa doa kata ini secara alami menyatakan permohonan agar Allah memberi kemampuan atau kesempatan.
- source_word: τοῖς δούλοις σου
  choice: kepada hamba-hamba-Mu
  rationale: δοῦλος menyatakan orang yang berada di bawah kuasa dan menjadi milik seorang tuan. “Hamba” cocok dengan sikap tunduk kepada Allah dalam konteks doa, sementara nuansa yang lebih kuat dicatat dalam catatan kaki.
- source_word: μετὰ παρρησίας πάσης
  choice: dengan penuh keberanian
  rationale: παρρησία dalam konteks ini menunjuk pada keterbukaan dan keberanian untuk berbicara tanpa gentar; “penuh” menyampaikan penguatan oleh πάσης secara alami.
- source_word: λαλεῖν τὸν λόγον σου
  choice: untuk menyampaikan firman-Mu
  rationale: λαλεῖν berarti berbicara, sedangkan λόγος di sini adalah firman atau pesan Allah. “Menyampaikan firman-Mu” merupakan ungkapan Indonesia yang alami tanpa menambahkan objek atau isi yang tidak dinyatakan.
theological_decisions:
- issue: Makna δοῦλος dalam hubungan dengan Allah
  choice: hamba-hamba-Mu
  alternative: budak-budak-Mu
  rationale: Konteks doa menonjolkan ketundukan dan pelayanan kepada Allah. “Hamba” menyampaikan hubungan itu secara wajar dan khidmat dalam bahasa Indonesia, sedangkan alternatif “budak” lebih tegas menonjolkan status sebagai milik tuan dan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat dan mudah dipahami. Bentuk “-Mu” mengikuti ejaan penghormatan bagi rujukan kepada Allah; susunan kalimat mempertahankan gerak dari perhatian Allah terhadap ancaman menuju permohonan akan keberanian.
