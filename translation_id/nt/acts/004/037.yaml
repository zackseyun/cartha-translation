  text: ὑπάρχοντος αὐτῷ ἀγροῦ πωλήσας ἤνεγκεν τὸ χρῆμα καὶ ἔθηκεν ⸀παρὰ τοὺς πόδας τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/037.yaml
  text: Since he owned a field[b][a], he sold it and brought the money and laid it at the apostles’ feet.
translation:
  language: id
  text: Ia mempunyai sebidang tanah[a]; setelah menjualnya, ia membawa uang itu[b] dan meletakkannya di kaki para rasul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Karena ia memiliki sebidang tanah.” Bahasa Yunani memakai konstruksi genitif absolut untuk menyatakan keadaan latar.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “uang itu”; yakni uang hasil penjualan tanah tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπάρχοντος αὐτῷ ἀγροῦ
  choice: Karena ia memiliki sebidang tanah
  rationale: Konstruksi genitif absolut memberi latar keadaan. Dalam bahasa Indonesia modern, kepemilikan dan hubungan keadaan ini paling alami dinyatakan dengan “karena ia memiliki”.
- source_word: ἀγροῦ
  choice: sebidang tanah
  rationale: ἀγρός dapat menunjuk ladang atau bidang tanah. “Sebidang tanah” cukup luas, alami, dan tidak mengandaikan bahwa tanah itu merupakan usaha pertanian.
- source_word: πωλήσας
  choice: ia menjualnya
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama. Bentuk finit dalam bahasa Indonesia menyampaikan urutan tindakan dengan jelas; “-nya” merujuk pada bidang tanah tersebut.
- source_word: ἤνεγκεν
  choice: membawa
  rationale: Dalam konteks ini φέρω berarti membawa sesuatu kepada pihak lain.
- source_word: τὸ χρῆμα
  choice: uang hasil penjualan itu
  rationale: χρῆμα berarti uang, dan konteks menunjukkan bahwa uang tersebut merupakan hasil penjualan tanah. Pilihan ini alami dalam bahasa Indonesia sambil membuat rujukannya jelas.
- source_word: ἔθηκεν
  choice: meletakkannya
  rationale: τίθημι berarti menaruh atau meletakkan. “Meletakkannya” mempertahankan tindakan konkret dalam narasi.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: di dekat kaki para rasul
  rationale: παρά dengan akusatif di sini secara konkret menunjukkan penempatan di sisi atau dekat kaki para rasul. Ungkapan ini mempertahankan gambaran fisik dan implikasi penyerahan untuk pengelolaan mereka tanpa menggantinya dengan tafsiran saja.
theological_decisions:
- issue: Apakah gambaran fisik penyerahan uang kepada kewenangan para rasul perlu dipertahankan
  choice: Mempertahankan ungkapan konkret “meletakkannya di dekat kaki para rasul.”
  alternative: Menyatakan maknanya saja sebagai “menyerahkannya kepada para rasul.”
  rationale: Teks menggambarkan tindakan penempatan yang nyata dan sekaligus menyiratkan bahwa pemberian itu diserahkan untuk pengelolaan para rasul. Mempertahankan gambaran fisiknya menjaga kekuatan naratif tanpa menambahkan klaim eklesiologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang lugas dan bermartabat. “Sebidang tanah” dipilih daripada “ladang” agar cakupan makna ἀγρός tidak dipersempit. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
