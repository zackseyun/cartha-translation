  text: εἰ ἡμεῖς σήμερον ἀνακρινόμεθα ἐπὶ εὐεργεσίᾳ ἀνθρώπου ἀσθενοῦς, ἐν τίνι οὗτος ⸀σέσωσται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/009.yaml
  text: If we are being examined today concerning a good deed done to a sick man[b][a], by what means this man has been healed—
translation:
  language: id
  text: Jika hari ini kami diperiksa karena suatu perbuatan baik terhadap seorang yang sakit—dengan cara apa[b] orang ini telah disembuhkan[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah diselamatkan” atau “telah dipulihkan.” Kata kerja Yunani dapat berarti menyelamatkan, melepaskan, atau menyembuhkan; dalam konteks langsung ini, yang dimaksud terutama ialah penyembuhan fisik.
    reason: lexical_alternative
  - marker: b
    text: “Dengan cara apa” dapat juga diterjemahkan “oleh siapa.” Ungkapan Yunani dapat menunjuk pada sarana atau perantara yang olehnya orang itu disembuhkan.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἀνακρινόμεθα
  choice: kami diperiksa
  rationale: Kata kerja ini dapat menunjuk pada pemeriksaan atau pertanyaan dalam suasana hukum. “Diperiksa” mempertahankan nuansa resmi tanpa menyatakan secara berlebihan bahwa mereka sudah diadili.
- source_word: ἐπὶ εὐεργεσίᾳ
  choice: karena suatu perbuatan baik
  rationale: ἐπί dengan datif menyatakan dasar atau alasan pemeriksaan, sedangkan εὐεργεσία berarti tindakan yang mendatangkan kebaikan. Pilihan ini juga mempertahankan ironi bahwa mereka diperiksa karena berbuat baik.
- source_word: ἀνθρώπου ἀσθενοῦς
  choice: kepada seorang yang sakit
  rationale: Frasa genitif ini menyebut penerima perbuatan baik tersebut. Dalam konteks pemulihan fisik orang yang sebelumnya lumpuh, “seorang yang sakit” merupakan ungkapan Indonesia yang wajar tanpa mempersempit kondisi orang itu melebihi teks Yunani.
- source_word: ἐν τίνι
  choice: dengan cara apa
  rationale: Ungkapan ini menanyakan sarana atau perantaraan pemulihan. “Dengan cara apa” tetap cukup luas dan tidak lebih dahulu menentukan apakah jawabannya berupa kuasa, sarana, atau pribadi; kemungkinan “oleh siapa” dicatat dalam catatan kaki.
- source_word: σέσωσται
  choice: telah disembuhkan
  rationale: Bentuk dari σῴζω ini dapat berarti diselamatkan, dilepaskan, atau dibuat sembuh. Konteks langsung menunjuk pada pemulihan fisik, sehingga “telah disembuhkan” paling jelas, sementara cakupan makna keselamatannya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna σέσωσται dalam konteks penyembuhan
  choice: telah disembuhkan
  alternative: telah diselamatkan; telah dipulihkan
  rationale: Pemulihan orang yang sebelumnya lumpuh membuat makna penyembuhan menjadi makna utama di sini. Namun, karena σῴζω juga merupakan kata penting untuk keselamatan, kemungkinan itu tidak dihapus, melainkan dicatat agar hubungan maknanya dalam Kisah Para Rasul tetap terlihat.
- issue: Agen atau sarana dalam ἐν τίνι
  choice: dengan cara apa
  alternative: oleh siapa
  rationale: Bentuk Yunani dapat dipahami sebagai pertanyaan tentang sarana maupun agen. Terjemahan utama mempertahankan rumusan yang luas, sedangkan catatan kaki menjaga kemungkinan rujukan langsung kepada pribadi yang menjadi nyata dalam ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dengan tanda pisah mempertahankan bentuk kalimat yang berlanjut ke ayat berikutnya serta menunjukkan bahwa pertanyaan tentang cara penyembuhan menjelaskan pokok pemeriksaan mereka.
