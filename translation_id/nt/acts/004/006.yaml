id: ACT.4.6
reference: Acts 4:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: (καὶ ⸂Ἅννας ὁ ἀρχιερεὺς καὶ Καϊάφας καὶ Ἰωάννης καὶ Ἀλέξανδρος⸃ καὶ ὅσοι ἦσαν ἐκ γένους ἀρχιερατικοῦ),
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/006.yaml
  text: and Annas the high priest[a], and Caiaphas, and John, and Alexander, and all who were of the high-priestly family,
translation:
  language: id
  text: dan Hanas, imam besar, Kayafas, Yohanes, Aleksander, serta semua orang yang berasal dari keluarga imam besar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἅννας
  choice: Hanas
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: ὁ ἀρχιερεὺς
  choice: Imam Besar
  rationale: Mempertahankan gelar tunggal yang secara langsung diberikan teks Yunani kepada Hanas.
- source_word: Καϊάφας
  choice: Kayafas
  rationale: Menggunakan bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: Ἰωάννης
  choice: Yohanes
  rationale: Menggunakan bentuk tradisional dan baku nama ini dalam Alkitab bahasa Indonesia.
- source_word: Ἀλέξανδρος
  choice: Aleksander
  rationale: Transliterasi alami ke dalam ejaan bahasa Indonesia.
- source_word: ὅσοι
  choice: semua orang yang
  rationale: Padanan Indonesia yang alami bagi ungkapan kuantitatif-relatif ini.
- source_word: ἦσαν
  choice: berasal
  rationale: Dalam konstruksi ἦσαν ἐκ γένους, 'berasal dari' menyampaikan hubungan dengan keluarga atau garis keturunan secara alami.
- source_word: ἐκ γένους ἀρχιερατικοῦ
  choice: berasal dari keluarga imam besar
  rationale: γένος dapat menunjuk keluarga, kaum, atau garis keturunan; ungkapan ini menyatakan hubungan dengan keluarga imam besar tanpa menyiratkan bahwa semuanya sedang memegang jabatan tersebut.
theological_decisions:
- issue: Gelar 'Imam Besar' bagi Hanas meskipun Kayafas merupakan imam besar yang sedang menjabat pada masa itu
  choice: Mempertahankan 'Imam Besar Hanas' sesuai dengan ὁ ἀρχιερεύς
  alternative: Hanas, mantan imam besar
  rationale: Teks Yunani secara eksplisit memberi Hanas gelar tersebut. Terjemahan tidak boleh menyelaraskan atau menjelaskan ketegangan historis dengan menambahkan 'mantan'.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan daftar dipertahankan, sedangkan nama-nama memakai bentuk yang lazim bagi pembaca Alkitab Indonesia.
