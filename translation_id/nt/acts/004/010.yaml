id: ACT.4.10
reference: Acts 4:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: γνωστὸν ἔστω πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραὴλ ὅτι ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/010.yaml
  text: let it be known to all of you and to all the people of Israel that in the name of Jesus the Messiah the Nazarene[a], whom you crucified[c][b], whom God raised from the dead—by this name this man stands before you healthy.
translation:
  language: id
  text: Hendaklah kamu semua dan seluruh bangsa Israel mengetahui bahwa dalam nama Yesus Sang Mesias, orang Nazaret itu,[a] yang kamu salibkan dan yang Allah bangkitkan dari antara orang mati, oleh nama inilah[b] orang ini berdiri di hadapan kamu dalam keadaan sehat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yesus Kristus, orang Nazaret itu.” Gelar Yunani Χριστός dapat diterjemahkan “Mesias” atau, dalam pemakaian yang lebih menyerupai nama, “Kristus.”
    reason: alternative_reading
  - marker: b
    text: Atau “oleh Dia.” Frasa Yunani ἐν τούτῳ paling langsung dapat merujuk kepada nama Yesus yang baru disebutkan, tetapi juga dapat dipahami secara instrumental dengan merujuk kepada Yesus sendiri.
    reason: lexical_alternative
  - marker: c
    text: Atau “sembuh” atau “pulih.” Kata Yunani ὑγιής menyatakan keadaan sehat, utuh, atau kesehatan yang telah dipulihkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: hendaklah ... mengetahui
  rationale: Mengungkapkan daya imperatif dari pernyataan resmi Yunani secara wajar dalam bahasa Indonesia.
- source_word: πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραήλ
  choice: kamu semua dan seluruh bangsa Israel
  rationale: 'Mempertahankan dua kelompok pendengar: para pemimpin yang hadir dan bangsa Israel secara lebih luas.'
- source_word: ἐν τῷ ὀνόματι
  choice: dalam nama
  rationale: Mempertahankan idiom sumber yang di sini menyatakan sarana, kuasa, atau otoritas yang terkait dengan nama Yesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus, Sang Mesias
  rationale: Menerjemahkan Χριστός sebagai gelar yang masih bermakna, bukan sebagai nama keluarga; tanda koma memperjelas fungsi gelarnya.
- source_word: τοῦ Ναζωραίου
  choice: orang Nazaret itu
  rationale: Menampilkan sebutan Ναζωραῖος sebagai penanda asal atau julukan secara alami tanpa menghapus nuansa definitnya.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: yang telah kamu salibkan
  rationale: Mempertahankan tuduhan langsung terhadap para pendengar dan tindakan lampau yang selesai.
- source_word: ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν
  choice: yang telah Allah bangkitkan dari antara orang mati
  rationale: Mempertahankan Allah sebagai pelaku serta ungkapan kebangkitan dari lingkup orang-orang mati.
- source_word: ἐν τούτῳ
  choice: oleh Dia
  rationale: Demonstrativa ini paling alami merujuk kembali kepada Yesus dan berfungsi instrumental; kemungkinan rujukan khusus kepada nama-Nya dicatat dalam catatan kaki.
- source_word: οὗτος
  choice: orang ini
  rationale: Merujuk kepada orang yang disembuhkan dan hadir di hadapan Mahkamah; nomina 'orang' ditambahkan demi kejelasan.
- source_word: παρέστηκεν ἐνώπιον ὑμῶν
  choice: berdiri di hadapan kamu
  rationale: Menangkap keadaan kini yang dihasilkan oleh tindakan sebelumnya, sebagaimana nilai perfektum Yunani.
- source_word: ὑγιής
  choice: dalam keadaan sehat
  rationale: Menggambarkan kondisi jasmani yang telah dipulihkan dalam bahasa Indonesia modern dan jelas.
theological_decisions:
- issue: Χριστός sebagai gelar atau unsur nama
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam proklamasi kepada para pemimpin Israel, daya gelar Χριστός tetap menonjol; terjemahan ini mempertahankan klaim mesianik tanpa menambahkan penafsiran denominasi.
- issue: Rujukan ἐν τούτῳ
  choice: oleh Dia
  alternative: oleh nama ini
  rationale: Bentuk Yunani dapat menunjuk kepada Yesus sendiri atau, mengingat frasa sebelumnya, secara lebih khusus kepada nama-Nya. Teks utama memilih rujukan personal yang alami sambil mempertahankan alternatif dalam catatan kaki.
- issue: Rumusan kebangkitan
  choice: yang telah Allah bangkitkan dari antara orang mati
  alternative: yang telah Allah bangkitkan dari kematian
  rationale: Rumusan terpilih mempertahankan pelaku ilahi dan bentuk jamak νεκρῶν tanpa menguraikan mekanisme atau implikasi teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “hendaklah ... mengetahui” mempertahankan nada deklarasi publik, sedangkan “kamu” menjaga tuduhan langsung bentuk jamak tanpa memakai bentuk kehormatan yang tidak terdapat dalam sumber.
