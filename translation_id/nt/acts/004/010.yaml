revisions:
- from: Hendaklah kamu semua dan seluruh bangsa Israel mengetahui bahwa dalam nama Yesus, Sang Mesias, orang Nazaret itu,[a] yang telah kamu salibkan dan yang telah Allah bangkitkan dari antara orang mati—oleh Dia[b] orang ini berdiri di hadapan kamu dalam keadaan sehat.[c]
  to: Hendaklah kamu semua dan seluruh bangsa Israel mengetahui bahwa dalam nama Yesus Sang Mesias, orang Nazaret itu,[a] yang kamu salibkan dan yang Allah bangkitkan dari antara orang mati, oleh nama inilah[b] orang ini berdiri di hadapan kamu dalam keadaan sehat.[c]
  rationale: Revisi mengubah rujukan utama frasa netral ἐν τούτῳ menjadi ‘oleh nama inilah,’ selaras dengan anteseden netral τῷ ὀνόματι yang baru disebutkan dan dengan penempatan frasa tersebut sebagai sarana penyembuhan. Kemungkinan bahwa frasa itu menunjuk kepada Yesus sendiri tidak dihapus, melainkan dipindahkan ke catatan kaki agar ambiguitas yang mungkin tetap terjaga. Rangkaian ‘Yesus Sang Mesias’ juga dinormalkan tanpa koma yang tidak diperlukan.
