  text: ὁ δὲ Πέτρος καὶ Ἰωάννης ἀποκριθέντες ⸂εἶπον πρὸς αὐτούς⸃· Εἰ δίκαιόν ἐστιν ἐνώπιον τοῦ θεοῦ ὑμῶν ἀκούειν μᾶλλον ἢ τοῦ θεοῦ, κρίνατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/019.yaml
  text: But Peter and John answered and said to them[a], “If it is right in the sight of God to listen to you rather than to God, judge for yourselves.”
translation:
  language: id
  text: Namun Petrus dan Yohanes menjawab mereka, “Jika benar di hadapan Allah untuk lebih mendengarkan kalian daripada Allah, nilailah sendiri.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan mengungkapkan maksudnya secara lebih langsung, “menaati kalian daripada Allah.” Kata Yunani secara harfiah berarti “mendengarkan,” tetapi dalam konteks ini juga dapat berarti mengindahkan otoritas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Πέτρος καὶ Ἰωάννης
  choice: Namun Petrus dan Yohanes
  rationale: δέ menandai pertentangan dengan perintah para pemimpin sebelumnya; “Namun” menyampaikan peralihan adversatif itu secara wajar dan bermartabat.
- source_word: ἀποκριθέντες εἶπον πρὸς αὐτούς
  choice: menjawab mereka
  rationale: Gabungan partisip dan verba finit ini merupakan ungkapan Yunani bercorak Semitis. Dalam bahasa Indonesia modern, “menjawab mereka” menyampaikan seluruh fungsi ungkapan itu tanpa pengulangan yang kaku seperti “menjawab dan berkata kepada mereka”.
- source_word: δίκαιόν
  choice: benar
  rationale: Dalam konteks ini kata tersebut menunjuk pada apa yang patut atau dapat dibenarkan menurut penilaian Allah. “Benar” alami dalam pertanyaan moral ini dan tetap mempertahankan daya evaluatifnya.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: Ungkapan ini mempertahankan gambaran tindakan yang dinilai dalam kehadiran dan penghakiman Allah; bentuk tersebut juga alami dalam bahasa Indonesia.
- source_word: ἀκούειν
  choice: mendengarkan
  rationale: Kata Yunani secara leksikal berarti mendengar atau mendengarkan, meskipun dalam konteks ini mengandung makna mengindahkan otoritas. Pilihan ini mempertahankan bentuk sumber tanpa mempersempitnya menjadi “menaati” dalam teks utama.
- source_word: μᾶλλον ἢ
  choice: lebih ... daripada
  rationale: Bentuk komparatif ini secara langsung mempertahankan struktur Yunani yang membandingkan mendengarkan manusia dengan mendengarkan Allah.
- source_word: κρίνατε
  choice: Nilailah sendiri
  rationale: Imperatif ini menantang para pendengar untuk membuat penilaian. “Nilailah” cocok dengan pertanyaan tentang apa yang benar, sedangkan “sendiri” memperjelas daya retoris tantangan tersebut tanpa mengubah acuannya.
theological_decisions:
- issue: Apakah ἀκούειν harus diterjemahkan secara interpretatif sebagai “menaati” dalam pertentangan antara penguasa manusia dan Allah
  choice: Mempertahankan “mendengarkan kalian daripada Allah” dalam teks utama
  alternative: “menaati kalian daripada Allah”
  rationale: Konteks memang menyangkut ketaatan, tetapi teks memakai ἀκούω, bukan verba yang secara lebih tegas berarti menaati. Terjemahan utama mempertahankan pilihan leksikal dan ketegangan sumber, sementara catatan kaki menjelaskan implikasi kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara komparasi Yunani dan nuansa antara mendengarkan serta menaati tetap dipertahankan. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskannya.
