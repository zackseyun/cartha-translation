id: ACT.4.27
reference: Acts 4:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: συνήχθησαν γὰρ ἐπ’ ἀληθείας ⸂ἐν τῇ πόλει ταύτῃ⸃ ἐπὶ τὸν ἅγιον παῖδά σου Ἰησοῦν, ὃν ἔχρισας, Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/027.yaml
  text: For truly in this city Herod and Pontius Pilate[a], together with the Gentiles and the peoples of Israel, were gathered against your holy servant Jesus, whom you anointed[b],
translation:
  language: id
  text: Sebab sesungguhnya, di kota ini Herodes dan Pontius Pilatus, bersama bangsa-bangsa bukan Yahudi dan umat-umat Israel[b], telah berkumpul melawan Yesus, hamba-Mu yang kudus[a], yang telah Engkau urapi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-Mu yang kudus.” Kata Yunani παῖς dapat berarti “hamba” atau “anak”; “hamba” dipilih di sini karena kemungkinan besar menggemakan gambaran Hamba TUHAN dalam Yesaya.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “bangsa-bangsa dan umat-umat Israel.” Dalam bahasa Yunani, kata yang diterjemahkan “bangsa-bangsa bukan Yahudi” juga dapat berarti “bangsa-bangsa”, dan kata “umat” berbentuk jamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: telah berkumpul
  rationale: Bentuk aoris pasif menunjuk pada peristiwa berkumpul yang telah terjadi. Dalam bahasa Indonesia, bentuk alami ini mempertahankan gagasan perhimpunan tanpa menentukan pelaku yang menyebabkan mereka berkumpul.
- source_word: γὰρ
  choice: Sebab
  rationale: Menghubungkan ayat ini dengan kutipan dan penjelasan dalam doa sebelumnya.
- source_word: ἐπ’ ἀληθείας
  choice: sesungguhnya
  rationale: Ungkapan adverbial ini menegaskan bahwa peristiwa tersebut benar-benar menggenapi apa yang baru dikutip.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: di kota ini
  rationale: Mempertahankan rujukan deiktis kepada Yerusalem tanpa menambahkan nama kota yang tidak disebut dalam ayat.
- source_word: ἐπὶ τὸν
  choice: melawan
  rationale: Dengan verba berkumpul dalam konteks permusuhan, ἐπί dengan akusatif menyatakan arah perlawanan.
- source_word: ἅγιον
  choice: yang kudus
  rationale: Menyampaikan kekudusan sekaligus pengkhususan Yesus sebagai milik Allah.
- source_word: παῖδά σου
  choice: hamba-Mu
  rationale: παῖς dapat berarti hamba atau anak, tetapi konteks Kisah Para Rasul dan gema Hamba TUHAN dalam Yesaya mendukung 'hamba'. Huruf kapital pada pronomina mengikuti kebiasaan Indonesia untuk sapaan kepada Allah.
- source_word: Ἰησοῦν
  choice: Yesus
  rationale: Bentuk baku nama tersebut dalam bahasa Indonesia.
- source_word: ὃν ἔχρισας
  choice: yang telah Engkau urapi
  rationale: Mempertahankan arti harfiah χρίω serta resonansi mesianik dan pengutusan ilahi tanpa menggantinya dengan gelar yang tidak dipakai di sini.
- source_word: Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος
  choice: Herodes dan Pontius Pilatus
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia dan menyampaikan koordinasi τε καὶ secara alami.
- source_word: σὺν ἔθνεσιν
  choice: bersama bangsa-bangsa bukan Yahudi
  rationale: Dalam kontras dengan Israel, ἔθνη menunjuk pada bangsa-bangsa non-Yahudi; frasa ini lebih mudah dipahami pembaca umum daripada istilah khusus.
- source_word: καὶ λαοῖς Ἰσραήλ
  choice: dan kelompok-kelompok bangsa Israel
  rationale: Bentuk jamak λαοῖς dipertahankan melalui 'kelompok-kelompok', sedangkan 'bangsa Israel' tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna παῖς bagi Yesus
  choice: hamba
  alternative: anak
  rationale: Gema bahasa Hamba TUHAN dalam Yesaya dan pemakaian paralel dalam Kisah Para Rasul mendukung 'hamba'. Alternatif leksikal yang sungguh mungkin tetap dicatat tanpa menerjemahkannya sebagai 'Anak Allah', yang terlalu menafsirkan istilah ini.
- issue: Makna ἔθνεσιν dalam kontras dengan Israel
  choice: bangsa-bangsa bukan Yahudi
  alternative: bangsa-bangsa
  rationale: Koordinasinya dengan kelompok-kelompok Israel menunjukkan kontras etnis-keagamaan. Pilihan ini memperjelas kontras tersebut tanpa memakai jargon yang kurang transparan.
- issue: Bentuk jamak λαοῖς Ἰσραήλ
  choice: kelompok-kelompok bangsa Israel
  alternative: umat Israel
  rationale: Pilihan utama mempertahankan bentuk jamak Yunani yang tidak biasa; alternatif tunggal lebih idiomatis tetapi menghilangkan nuansa tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan subjek dipindahkan ke depan agar kalimat alami, sementara hubungan sebab, penegasan, lokasi, koalisi para penentang, dan arah permusuhan tetap dipertahankan. Penanda catatan kaki ditempatkan langsung pada frasa yang diterangkannya.
