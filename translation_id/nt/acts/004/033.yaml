  text: καὶ ⸂δυνάμει μεγάλῃ⸃ ἀπεδίδουν τὸ μαρτύριον οἱ ἀπόστολοι ⸂τῆς ἀναστάσεως τοῦ κυρίου Ἰησοῦ⸃, χάρις τε μεγάλη ἦν ἐπὶ πάντας αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/033.yaml
  text: And with great power the apostles were giving their testimony about the resurrection of the Lord Jesus[a], and great favor was upon them all.
translation:
  language: id
  text: Dengan kuasa yang besar, rasul-rasul terus memberikan kesaksian tentang kebangkitan Tuhan Yesus, dan anugerah besar[a] menyertai mereka semua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka semua mendapat perkenanan yang besar.” Kata Yunani χάρις dapat berarti “anugerah” atau “perkenanan”; ungkapan ini mungkin mencakup anugerah Allah, perkenanan orang terhadap orang-orang percaya, atau keduanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμει μεγάλῃ
  choice: dengan kuasa yang besar
  rationale: Datif instrumental menyatakan cara atau sarana kesaksian para rasul. 'Kuasa' alami dalam konteks Lukas–Kisah Para Rasul dan tidak membatasi maknanya pada mukjizat.
- source_word: ἀπεδίδουν
  choice: terus memberikan
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung atau berulang; 'terus memberikan' menyampaikan aspek tersebut secara wajar.
- source_word: τὸ μαρτύριον
  choice: kesaksian
  rationale: Dalam rangkaian dengan ἀποδίδωμι, kata ini berarti kesaksian yang diberikan para rasul. Bahasa Indonesia tidak memerlukan penambahan pronomina posesif.
- source_word: τῆς ἀναστάσεως
  choice: tentang kebangkitan
  rationale: Genitif ini paling wajar dipahami sebagai isi kesaksian; 'tentang' jelas dan alami dalam bahasa Indonesia modern.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Tuhan Yesus
  rationale: Genitif menghubungkan kebangkitan itu dengan Yesus; κύριος diterjemahkan 'Tuhan' sesuai pemakaian kristologis dalam konteks.
- source_word: χάρις ... μεγάλη
  choice: anugerah besar
  rationale: '''Anugerah'' mempertahankan keluasan makna χάρις dan kemungkinan nuansa ilahi, tanpa menentukan secara tegas sumber atau wujudnya.'
- source_word: ἐπὶ πάντας αὐτούς
  choice: menyertai mereka semua
  rationale: Ungkapan ini menyampaikan bahwa χάρις berlaku atas seluruh komunitas. 'Menyertai' lebih alami daripada terjemahan spasial harfiah 'di atas'.
theological_decisions:
- issue: Makna dan sumber χάρις dalam konteks
  choice: anugerah besar menyertai seluruh komunitas
  alternative: mereka semua sangat disukai; rahmat besar ada atas mereka semua
  rationale: Teks Yunani tidak menyebutkan apakah χάρις terutama menunjuk pada anugerah Allah, perkenanan manusia, atau keduanya. Teks utama mempertahankan istilah luas, dan catatan kaki menjelaskan alternatif leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Susunan kalimat dibuat alami, aspek imperfek dipertahankan melalui 'terus', dan ambiguitas χάρις dijaga melalui teks utama serta catatan kaki.
