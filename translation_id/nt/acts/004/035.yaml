  text: καὶ ἐτίθουν παρὰ τοὺς πόδας τῶν ἀποστόλων· διεδίδετο δὲ ἑκάστῳ καθότι ἄν τις χρείαν εἶχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/035.yaml
  text: and they were laying them at the apostles’ feet[b][a], and it was being distributed to each one according as anyone had need.
translation:
  language: id
  text: dan mereka meletakkannya[b] di kaki para rasul.[a] Kemudian, itu dibagikan kepada setiap orang sesuai dengan kebutuhan setiap orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di hadapan para rasul.” Secara harfiah, bahasa Yunani mengatakan “di/dekat kaki para rasul,” suatu gambaran tentang penyerahan hasil penjualan ke dalam pengawasan mereka.
    reason: lexical_alternative
  - marker: b
    text: Yang mereka letakkan dan yang kemudian dibagikan tersirat dari ayat sebelumnya, yaitu hasil penjualan milik mereka.
    reason: cross_reference
lexical_decisions:
- source_word: ἐτίθουν
  choice: mereka meletakkannya
  rationale: Bentuk imperfek menggambarkan tindakan yang berlangsung atau berulang dalam narasi. Dalam bahasa Indonesia, nuansa itu dapat dipahami dari konteks tanpa ungkapan progresif yang kaku.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: di kaki para rasul
  rationale: Terjemahan ini mempertahankan gambaran konkret Yunani sekaligus tetap wajar dalam bahasa Indonesia sebagai tindakan menyerahkan sesuatu ke dalam pengawasan para rasul.
- source_word: διεδίδετο
  choice: dibagikanlah
  rationale: Bentuk pasif dipertahankan tanpa menyebut pelaku pembagian, sebagaimana teks Yunani. Partikel -lah menandai kelanjutan tindakan dalam narasi tanpa menentukan pelakunya.
- source_word: ἑκάστῳ
  choice: kepada setiap orang
  rationale: Ungkapan ini mempertahankan daya distributif bentuk datif tunggal dan terdengar jelas serta alami.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: sesuai dengan kebutuhannya
  rationale: Frasa ini menyatakan bahwa pembagian dilakukan sebanding dengan kebutuhan tiap-tiap orang, dengan bentuk Indonesia yang ringkas dan alami.
- source_word: χρείαν
  choice: kebutuhan
  rationale: Kata ini paling langsung dan lazim menyampaikan makna keperluan atau kebutuhan dalam konteks pemberian bantuan.
theological_decisions:
- issue: Apakah objek yang diletakkan dan dibagikan perlu disebut secara eksplisit
  choice: Memakai pronomina “-nya” pada klausa pertama dan membiarkan objek klausa pasif kedua tidak disebutkan.
  alternative: Menambahkan “uang” atau “hasil penjualan” pada kedua klausa.
  rationale: Teks Yunani mengandalkan ayat sebelumnya untuk menjelaskan bahwa yang dimaksud ialah hasil penjualan. Pilihan ini menjaga keterkaitan konteks tanpa menambahkan kekhususan yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan pasif pada klausa kedua mempertahankan ketidakjelasan pelaku dalam teks sumber, sedangkan “di kaki para rasul” mempertahankan gambaran konkret aslinya.
