  text: Ἀπολυθέντες δὲ ἦλθον πρὸς τοὺς ἰδίους καὶ ἀπήγγειλαν ὅσα πρὸς αὐτοὺς οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/023.yaml
  text: After they were released[a], they went to their own people and reported all that the chief priests and the elders had said to them.
translation:
  language: id
  text: Setelah dibebaskan, mereka pergi kepada rekan-rekan mereka[a] dan melaporkan semua yang dikatakan imam-imam kepala dan para tua-tua kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "orang-orang mereka sendiri"; secara lebih harfiah, "kepada milik mereka sendiri."
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπολυθέντες
  choice: Setelah dibebaskan
  rationale: Partisip aoris pasif menunjukkan tindakan yang mendahului kata kerja utama. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan konteks pembebasan dari penahanan.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini merupakan penghubung ringan; alur peralihannya sudah tersampaikan secara alami melalui klausa pembuka 'Setelah dibebaskan'.
- source_word: ἦλθον
  choice: mereka pergi
  rationale: ἔρχομαι dapat berarti datang atau pergi menurut sudut pandang. Narasi tidak berjangkar pada tempat tujuan, sehingga 'pergi' paling alami.
- source_word: πρὸς τοὺς ἰδίους
  choice: kepada rekan-rekan mereka
  rationale: Secara harfiah berarti 'kepada orang-orang mereka sendiri' dan dalam konteks menunjuk kepada kelompok atau komunitas yang berhubungan dengan Petrus dan Yohanes. 'Rekan-rekan mereka' jelas tanpa membatasi rujukannya secara berlebihan; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ἀπήγγειλαν
  choice: melaporkan
  rationale: Kata ini menyatakan penyampaian kembali suatu informasi; 'melaporkan' cocok dengan penuturan tentang perkataan para pemimpin.
- source_word: ὅσα
  choice: semua yang
  rationale: Mempertahankan cakupan menyeluruh dari kata ganti relatif jamak ini dengan bentuk Indonesia yang ringkas dan alami.
- source_word: πρὸς αὐτοὺς
  choice: kepada mereka
  rationale: Dengan verba berkata, πρός ditambah akusatif lazim menunjukkan pihak yang diajak bicara, bukan dengan sendirinya makna 'menentang'.
- source_word: οἱ ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Istilah ini menunjuk kepada kalangan pemimpin imam, bukan kepada beberapa orang yang masing-masing memegang jabatan tunggal imam besar.
- source_word: οἱ πρεσβύτεροι
  choice: para tua-tua
  rationale: Dalam konteks kelembagaan Yahudi, istilah ini menunjuk kepada para pemimpin atau anggota senior yang diakui, bukan sekadar orang-orang lanjut usia.
- source_word: εἶπαν
  choice: telah dikatakan
  rationale: Bentuk 'telah dikatakan' memperjelas bahwa perkataan itu mendahului laporan mereka, sekaligus mempertahankan hubungan pasif yang alami dalam susunan kalimat Indonesia.
