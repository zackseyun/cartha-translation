base_translation:
  language: en
  yaml_path: translation/nt/acts/004/011.yaml
  text: This is the stone that was rejected by you[a], the builders, which has become the cornerstone.
translation:
  language: id
  text: Dialah batu yang telah kamu tolak, kamu para tukang bangunan, dan yang telah menjadi batu penjuru.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batu puncak”; secara harfiah, “kepala sudut.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: Dialah
  rationale: Kata tunjuk ini dengan tegas merujuk kepada Yesus dalam konteks sebelumnya. “Dialah” menyampaikan penegasan itu secara alami dalam bahasa Indonesia.
- source_word: λίθος
  choice: batu
  rationale: “Batu” adalah padanan lazim dan mempertahankan gambaran serta kaitan dengan Mazmur 118:22.
- source_word: ἐξουθενηθεὶς
  choice: yang kamu tolak
  rationale: Kata ini dapat berarti memandang hina atau menganggap tidak bernilai. Dalam gambaran pembangunan, “tolak” menyampaikan tindakan para tukang terhadap batu tersebut dengan jelas.
- source_word: ὑφ’ ὑμῶν
  choice: kamu
  rationale: Mempertahankan tuduhan langsung kepada para pemimpin yang sedang disapa; bentuk “kamu” dalam bahasa Indonesia dapat merujuk kepada jamak.
- source_word: τῶν οἰκοδόμων
  choice: hai para tukang bangunan
  rationale: Mempertahankan metafora pembangunan dan menjelaskan bahwa “kamu” adalah para tukang bangunan. Partikel “hai” menandai sapaan secara wajar.
- source_word: ὁ γενόμενος
  choice: tetapi yang telah menjadi
  rationale: “Telah menjadi” mengungkapkan perubahan yang sudah terjadi dan hasilnya tetap berlaku. “Tetapi” memperjelas pertentangan yang tersirat antara penolakan dan pengangkatan batu itu.
- source_word: κεφαλὴν γωνίας
  choice: batu penjuru
  rationale: Ini adalah ungkapan idiomatis dari Mazmur 118:22. “Batu penjuru” jelas bagi pembaca modern dan mempertahankan gambaran tentang batu utama pada sudut bangunan, sementara kemungkinan arsitektural lain dicatat dalam catatan kaki.
theological_decisions:
- issue: Gambaran kutipan Mazmur 118:22
  choice: batu penjuru
  alternative: batu puncak; secara harfiah, kepala sudut
  rationale: Ayat ini mengidentifikasi Yesus sebagai batu yang ditolak tetapi kemudian mendapat kedudukan utama. “Batu penjuru” mempertahankan pengertian arsitektural yang lazim tanpa menambahkan klaim doktrinal. Karena letak dan fungsi persis batu tersebut diperdebatkan, alternatifnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan tuduhan langsung kepada para pendengar serta kontras antara penolakan dan kedudukan utama batu itu.
