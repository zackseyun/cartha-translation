  naturalness: Bahasa baku dan mudah dipahami. Susunan “Sebab, di antara mereka bahkan tidak ada seorang pun ...” lebih alami sekaligus mencerminkan penegasan Yunani.
  terminology: “Berkekurangan”, “ladang”, “rumah”, dan “uang hasil penjualannya” sesuai konteks dan register modern baku. “Uang hasil penjualannya” menyampaikan makna kontekstual τὰς τιμὰς tanpa memaksakan arti harfiah semata.
