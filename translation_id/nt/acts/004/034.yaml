  text: οὐδὲ γὰρ ἐνδεής τις ⸀ἦν ἐν αὐτοῖς· ὅσοι γὰρ κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον, πωλοῦντες ἔφερον τὰς τιμὰς τῶν πιπρασκομένων
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/034.yaml
  text: For there was not even any needy person among them[a], for as many as were owners of fields or houses were selling them and bringing the proceeds of what was sold.
translation:
  language: id
  text: Sebab, di antara mereka bahkan tidak ada seorang pun yang berkekurangan, karena semua orang yang memiliki ladang atau rumah menjual milik mereka dan membawa uang hasil penjualannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “harga dari apa yang dijual.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Sebab, tidak seorang pun
  rationale: γάρ menghubungkan ayat ini sebagai penjelasan atas pernyataan sebelumnya, sedangkan οὐδέ memberi penegasan. Dalam bahasa Indonesia, gabungan “tidak seorang pun” menyampaikan penyangkalan yang tegas secara alami.
- source_word: ἐνδεής
  choice: berkekurangan
  rationale: Mengungkapkan keadaan membutuhkan atau kekurangan tanpa membatasi maknanya pada label sosial “miskin”; bentuk ini juga alami dalam konteks dukungan jemaat.
- source_word: τις ἦν ἐν αὐτοῖς
  choice: seorang pun di antara mereka
  rationale: Menghasilkan konstruksi eksistensial yang wajar dalam bahasa Indonesia dan mempertahankan lingkup komunitas yang disebutkan.
- source_word: ὅσοι
  choice: semua orang yang
  rationale: Menyampaikan cakupan distributif, yaitu semua orang dalam kelompok pemilik yang sedang dibicarakan, tanpa memperluasnya melampaui kelompok itu.
- source_word: κτήτορες χωρίων ἢ οἰκιῶν
  choice: memiliki ladang atau rumah
  rationale: Mengungkapkan kepemilikan secara jelas dan alami; “ladang” mewakili bidang tanah dalam konteks ini, sementara “rumah” mempertahankan nomina konkret.
- source_word: πωλοῦντες
  choice: menjual milik mereka
  rationale: Partisip ini berkaitan dengan properti yang baru disebut. “Milik mereka” menghindari kesan bahwa setiap orang pasti menjual kedua jenis properti sekaligus.
- source_word: ἔφερον
  choice: membawa
  rationale: Imperfek Yunani menggambarkan tindakan yang berlangsung atau berulang dalam narasi. Bahasa Indonesia tidak wajib menandai aspek itu pada verba; konteks dan bentuk jamak kolektif sudah mendukung pembacaan berulang.
- source_word: τὰς τιμὰς τῶν πιπρασκομένων
  choice: uang hasil penjualannya
  rationale: Secara harfiah berarti “harga dari hal-hal yang dijual,” tetapi dalam konteks ini menunjuk pada uang yang diperoleh dari penjualan. Ungkapan pilihan alami dan tepat dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah tindakan menjual properti dinyatakan dilakukan tanpa kecuali atau sebagai praktik para pemilik dalam komunitas
  choice: Mempertahankan “semua orang yang memiliki ... menjual” sebagai gambaran kelompok yang disebutkan
  alternative: Menambahkan pelemahan seperti “sebagian pemilik” atau kewajiban seperti “harus menjual”
  rationale: ὅσοι mencakup semua yang termasuk dalam golongan yang dinyatakan teks, tetapi ayat ini tidak secara eksplisit merumuskan perintah universal. Terjemahan tidak menambahkan kewajiban atau pengecualian teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan hubungan penjelas ganda dengan “sebab” dan “karena,” sambil memakai ungkapan yang mudah dipahami pembaca umum.
