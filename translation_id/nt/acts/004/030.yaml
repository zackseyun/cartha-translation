id: ACT.4.30
reference: Acts 4:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν τῷ τὴν χεῖρά ⸀σου ἐκτείνειν σε εἰς ἴασιν καὶ σημεῖα καὶ τέρατα γίνεσθαι διὰ τοῦ ὀνόματος τοῦ ἁγίου παιδός σου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/030.yaml
  text: while you stretch out your hand for healing[a], and signs and wonders are done through the name of your holy servant Jesus.
translation:
  language: id
  text: sementara Engkau mengulurkan tangan-Mu untuk menyembuhkan, dan tanda-tanda serta mukjizat-mukjizat terjadi melalui nama Yesus, hamba-Mu yang kudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yesus, Anak-Mu yang kudus.” Kata Yunani pais dapat berarti “anak” atau “hamba”; di sini “hamba” dipilih karena bagian ini menggemakan bahasa tentang Hamba dalam kitab Yesaya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ ... ἐκτείνειν
  choice: sementara ... mengulurkan
  rationale: Konstruksi ἐν τῷ dengan infinitif menyatakan keadaan yang berlangsung bersamaan. “Sementara” alami dalam bahasa Indonesia dan mempertahankan hubungan temporalnya dengan permohonan sebelumnya.
- source_word: τὴν χεῖρά σου
  choice: tangan-Mu
  rationale: Terjemahan langsung ini alami dan mempertahankan kiasan alkitabiah tentang tindakan serta kuasa Allah.
- source_word: εἰς ἴασιν
  choice: untuk menyembuhkan
  rationale: Frasa ini menyatakan tujuan. Bentuk verbal “untuk menyembuhkan” lebih alami daripada nomina abstrak “untuk penyembuhan” dan tetap setia pada maknanya.
- source_word: σημεῖα καὶ τέρατα
  choice: tanda-tanda serta mukjizat-mukjizat
  rationale: “Tanda-tanda” menerjemahkan σημεῖα, sedangkan “mukjizat-mukjizat” menyampaikan τέρατα sebagai kejadian luar biasa yang menimbulkan keheranan. “Serta” menghindari rangkaian berulang dengan kata “dan” dalam kalimat ini.
- source_word: γίνεσθαι
  choice: terjadi
  rationale: γίνομαι di sini menunjuk pada peristiwa yang berlangsung atau menjadi nyata. “Terjadi” merupakan padanan Indonesia yang alami tanpa menambahkan pelaku yang tidak dinyatakan secara gramatikal.
- source_word: διὰ τοῦ ὀνόματος
  choice: melalui nama
  rationale: διά dengan genitif menyatakan perantaraan atau sarana. “Melalui nama” mempertahankan ungkapan sumber tanpa menjabarkan konsep otoritas secara interpretatif.
- source_word: τοῦ ἁγίου παιδός σου Ἰησοῦ
  choice: Yesus, hamba-Mu yang kudus
  rationale: παῖς dapat berarti anak atau hamba. Dalam Kisah Para Rasul 3–4, gema bahasa Hamba dalam Yesaya mendukung “hamba.” Susunan ini alami dalam bahasa Indonesia dan jelas mengaitkan “yang kudus” dengan Yesus.
theological_decisions:
- issue: Pemaknaan παῖς bagi Yesus
  choice: hamba
  alternative: anak
  rationale: παῖς memang dapat berarti “anak” ataupun “hamba,” tetapi konteks Kisah Para Rasul 3:13, 3:26, dan 4:27, 30 menggemakan sosok Hamba dalam Yesaya. Karena ambiguitas leksikalnya tetap nyata, alternatif “anak” dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Huruf kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan ejaan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan langsung sesudah frasa yang diterangkannya.
