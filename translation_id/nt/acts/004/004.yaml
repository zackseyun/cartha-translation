  text: πολλοὶ δὲ τῶν ἀκουσάντων τὸν λόγον ἐπίστευσαν, καὶ ἐγενήθη ⸀ὁ ἀριθμὸς τῶν ἀνδρῶν ⸀ὡς χιλιάδες πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/004.yaml
  text: But many of those who had heard the message believed[b][a], and the number of the men became about five thousand.
translation:
  language: id
  text: Namun, banyak orang yang telah mendengar pesan itu menjadi percaya,[a] dan jumlah laki-laki mencapai kira-kira lima ribu orang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “firman itu.” Di sini kata Yunani logos menunjuk pada pemberitaan atau pesan para rasul.
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani secara harfiah menyebut “jumlah laki-laki,” yang kemungkinan menunjukkan penghitungan laki-laki, bukan seluruh kumpulan yang terdiri dari laki-laki dan perempuan.
    reason: cultural_note
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: Namun, banyak orang
  rationale: δὲ menandai kontras dengan penentangan dan penangkapan dalam konteks sebelumnya; 'namun' alami dalam narasi Indonesia. 'Banyak orang' mengungkapkan πολλοί secara wajar tanpa menentukan jumlah.
- source_word: τῶν ἀκουσάντων τὸν λόγον
  choice: yang telah mendengar pesan itu
  rationale: Partisip aoris menunjukkan tindakan yang mendahului tindakan percaya. Dalam konteks ini λόγος adalah pemberitaan para rasul, sehingga 'pesan' lebih transparan bagi pembaca modern; alternatif harfiahnya, 'firman', dicatat dalam catatan kaki.
- source_word: ἐπίστευσαν
  choice: menjadi percaya
  rationale: Mengungkapkan tindakan mulai percaya dalam alur narasi tanpa menambahkan objek atau rumusan teologis yang tidak dinyatakan dalam teks Yunani.
- source_word: ἐγενήθη ὁ ἀριθμὸς
  choice: jumlah ... menjadi
  rationale: Mempertahankan gambaran hasil keadaan dari γίνομαι dan bentuk langsung frasa Yunani, meskipun susunan Indonesia sedikit formal.
- source_word: τῶν ἀνδρῶν
  choice: laki-laki itu
  rationale: ἀνήρ biasanya menunjuk laki-laki, bukan manusia secara generik. Pilihan ini mempertahankan kekhususan gender dari teks tanpa menyimpulkan bahwa tidak ada perempuan dalam komunitas tersebut.
- source_word: ὡς χιλιάδες πέντε
  choice: kira-kira lima ribu orang
  rationale: ὡς di depan bilangan menyatakan perkiraan. Kata penggolong 'orang' membuat jumlah manusia terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penghitungan khusus laki-laki dalam τῶν ἀνδρῶν
  choice: Menerjemahkannya secara eksplisit sebagai 'laki-laki itu'.
  alternative: '''orang-orang itu'' atau ''orang-orang percaya itu'''
  rationale: Bentuk Yunani ἀνδρῶν lazimnya berarti laki-laki. Terjemahan mempertahankan bentuk maskulin itu, tetapi tidak memutuskan apakah perempuan tidak termasuk dalam keseluruhan jemaat.
- issue: Objek atau corak iman dalam ἐπίστευσαν
  choice: Menggunakan 'menjadi percaya' tanpa menambahkan objek.
  alternative: '''percaya kepada Yesus'' atau ''beriman'''
  rationale: Teks Yunani tidak menyatakan objek secara eksplisit. Rumusan sederhana menjaga kelugasan dan ambiguitas sumber tanpa memasukkan penjelasan teologis dari konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Namun' mempertahankan kontras konteks; 'pesan' dipilih demi kejelasan, dengan alternatif formal 'firman' dalam catatan. Semua penanda catatan kaki ditempatkan sesudah klausa yang dijelaskan.
