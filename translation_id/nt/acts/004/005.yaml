  yaml_path: translation/nt/acts/004/005.yaml
  text: And it happened that on the next day their rulers and elders and scribes were gathered together in Jerusalem,[a]
translation:
  language: id
  text: Keesokan harinya, para penguasa, para tetua, dan para ahli Taurat mereka dikumpulkan di Yerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berhimpun” atau “berkumpul.” Kata kerja Yunaninya berbentuk pasif (“dikumpulkan”).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: terjadilah bahwa
  rationale: Formula naratif ini menggerakkan kisah ke peristiwa berikutnya. Ungkapan ini mempertahankan nuansa kejadian tanpa memakai bahasa Indonesia yang usang.
- source_word: ἐπὶ τὴν αὔριον
  choice: Keesokan harinya
  rationale: Ungkapan ini secara idiomatis menunjuk pada hari berikutnya; pilihan ini alami dan ringkas dalam bahasa Indonesia modern.
- source_word: συναχθῆναι
  choice: dikumpulkan
  rationale: Bentuk infinitif aoris pasif dipertahankan dengan bentuk pasif bahasa Indonesia, sekaligus menyampaikan tindakan berhimpun.
- source_word: αὐτῶν
  choice: mereka
  rationale: Pronomina relasional Yunani dipertahankan tanpa menetapkan anteseden secara lebih sempit daripada yang dinyatakan ayat ini.
- source_word: τοὺς ἄρχοντας
  choice: para penguasa
  rationale: Dalam konteks ini istilah tersebut menunjuk kepada pihak-pihak yang memegang wewenang pemerintahan atau kepemimpinan.
- source_word: τοὺς πρεσβυτέρους
  choice: tua-tua
  rationale: Dalam konteks kelembagaan, istilah ini menunjuk pada para pemimpin masyarakat yang diakui, bukan sekadar laki-laki lanjut usia.
- source_word: τοὺς γραμματεῖς
  choice: ahli-ahli Taurat
  rationale: Dalam konteks Yahudi abad pertama, istilah ini menunjuk pada golongan ahli kitab dan hukum Taurat; pilihan ini lebih mudah dipahami pembaca Indonesia daripada 'juru tulis'.
- source_word: ἐν Ἰερουσαλήμ
  choice: di Yerusalem
  rationale: Padanan lokatif langsung dan alami.
theological_decisions:
- issue: Acuan αὐτῶν dalam penyebutan para pemimpin yang berhimpun
  choice: mereka
  alternative: Menghilangkan pronomina itu atau memperjelasnya menjadi 'para penguasa Yahudi'
  rationale: Teks Yunani memuat pronomina tersebut, tetapi antesedennya bergantung pada konteks. Terjemahan mempertahankannya tanpa memasukkan identifikasi yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan daftar mempertahankan tiga kelompok kepemimpinan dalam teks Yunani; bentuk pasif yang agak lebih formal sengaja dipertahankan dan dijelaskan dalam catatan kaki.
