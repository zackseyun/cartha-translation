  text: to do whatever your hand and your purpose had predestined to happen[a].
translation:
  language: id
  text: untuk melakukan segala sesuatu yang telah tangan dan rencana-Mu tentukan sebelumnya untuk terjadi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah ditetapkan terlebih dahulu” atau “telah diputuskan sebelumnya.” Kata kerja Yunani menunjukkan penentuan yang dilakukan terlebih dahulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι
  choice: untuk melakukan
  rationale: Infinitif aoris ini menyatakan tujuan/hasil dalam kesinambungan dengan konteks sebelumnya; bentuk ini langsung dan alami.
- source_word: ὅσα
  choice: segala sesuatu yang
  rationale: Pronomina relatif netral jamak ini memiliki cakupan luas; pilihan ini menyampaikan sifat menyeluruhnya dengan wajar.
- source_word: χείρ
  choice: tangan
  rationale: Mempertahankan gambaran konkret dalam bahasa Yunani, yang secara metaforis menunjuk pada kuasa atau tindakan Allah.
- source_word: βουλή
  choice: kehendak
  rationale: Dalam konteks ini βουλή menunjuk pada maksud yang disengaja atau keputusan; 'kehendak' alami dalam bahasa Indonesia dan tetap menyatakan intensionalitas, meski 'rencana' juga mungkin.
- source_word: προώρισεν
  choice: telah ditentukan sebelumnya
  rationale: Kata kerja ini berarti menetapkan atau menentukan terlebih dahulu. Bentuk pasif bahasa Indonesia diperlukan karena subjek Yunani majemuk ('tangan dan kehendak-Mu') mendahului verba aktif, sedangkan susunan ini lebih alami dan menghindari kesan bahwa 'tangan' dan 'kehendak' adalah dua pelaku terpisah.
- source_word: γενέσθαι
  choice: untuk terjadi
  rationale: Infinitif γίνομαι di sini mengacu pada berlangsungnya berbagai peristiwa; 'terjadi' adalah padanan modern dan alami.
theological_decisions:
- issue: Terjemahan προώρισεν dalam konteks kedaulatan Allah dan tanggung jawab manusia
  choice: telah ditentukan sebelumnya
  alternative: telah ditetapkan sebelumnya; telah diputuskan sebelumnya
  rationale: Terjemahan ini mempertahankan penentuan ilahi yang mendahului peristiwa tanpa memasukkan sistem teologis tertentu. Ketegangan konteks antara maksud Allah dan tindakan manusia tetap dibiarkan sebagaimana dalam teks.
- issue: Hubungan 'tangan' dan 'kehendak' sebagai subjek majemuk
  choice: yang telah ditentukan sebelumnya oleh tangan dan kehendak-Mu
  alternative: yang oleh tangan dan rencana-Mu telah Engkau tentukan sebelumnya
  rationale: Pilihan utama mengikuti struktur Yunani dengan lebih dekat dan mempertahankan personifikasi 'tangan dan kehendak-Mu'. Alternatif lebih eksplisit menjadikan Allah pelaku, tetapi menambahkan 'Engkau' yang tidak tertulis sebagai subjek verba.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Idiom alkitabiah 'tangan-Mu' dipertahankan. Huruf kapital pada '-Mu' menandai sapaan kepada Allah sesuai kebiasaan ejaan religius Indonesia.
