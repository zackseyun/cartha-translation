  register: Bahasa Indonesia baku, modern, dan wajar untuk pembaca umum. Subjek 'para pemimpin itu' dibuat eksplisit berdasarkan konteks agar pergantian klausa jelas. Ungkapan 'karena takut kepada rakyat' mengungkapkan implikasi pragmatis konteks, bukan unsur leksikal eksplisit dalam frasa Yunani.
