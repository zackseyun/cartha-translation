  text: οἱ δὲ προσαπειλησάμενοι ἀπέλυσαν αὐτούς, μηδὲν εὑρίσκοντες τὸ πῶς ⸀κολάσωνται αὐτούς, διὰ τὸν λαόν, ὅτι πάντες ἐδόξαζον τὸν θεὸν ἐπὶ τῷ γεγονότι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/021.yaml
  text: So after further threatening them[a], they released them, finding no way to punish them because of the people, since everyone was glorifying God for what had happened.
translation:
  language: id
  text: Namun, setelah kembali mengancam mereka[a], mereka melepaskan mereka. Mereka tidak menemukan cara untuk menghukum mereka karena rakyat, sebab semua orang memuliakan Allah atas apa yang telah terjadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “setelah mengancam mereka lagi” atau “setelah menambahkan ancaman.” Kata Yunani ini menunjukkan ancaman tambahan atau lanjutan sesudah ancaman sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαπειλησάμενοι
  choice: mengancam mereka lebih keras lagi
  rationale: Partisip berprefiks ini menunjukkan ancaman tambahan atau yang diperkuat sesudah ancaman sebelumnya; frasa ini menyampaikan kedua nuansa itu secara alami.
- source_word: ἀπέλυσαν
  choice: melepaskan mereka
  rationale: Dalam konteks penahanan, kata ini berarti membebaskan atau melepaskan seseorang dari tahanan.
- source_word: μηδὲν εὑρίσκοντες τὸ πῶς κολάσωνται αὐτούς
  choice: tidak menemukan cara untuk menghukum mereka
  rationale: Ungkapan harfiah 'tidak menemukan apa pun tentang bagaimana' secara idiomatis menunjuk pada tidak ditemukannya cara untuk menjatuhkan hukuman.
- source_word: διὰ τὸν λαόν
  choice: karena takut kepada rakyat
  rationale: διά dengan akusatif menyatakan sebab. Unsur 'takut' tersirat dari konteks bahwa reaksi rakyat menghalangi para pemimpin; penambahan ini membuat hubungan kausal jelas dalam bahasa Indonesia.
- source_word: πάντες
  choice: semua orang
  rationale: Bentuk jamak ini merujuk secara umum kepada seluruh orang yang menyaksikan atau mengetahui peristiwa tersebut.
- source_word: ἐδόξαζον τὸν θεόν
  choice: memuliakan Allah
  rationale: Mempertahankan bahasa penghormatan kepada Allah yang khas pada δοξάζω; konteks dan bentuk imperfek menggambarkan tindakan yang sedang berlangsung, yang dalam bahasa Indonesia cukup alami tanpa penanda aspek eksplisit.
- source_word: ἐπὶ τῷ γεγονότι
  choice: atas apa yang telah terjadi
  rationale: Partisip perfek menunjuk pada peristiwa yang sudah terjadi dan tetap menjadi dasar orang-orang memuliakan Allah.
