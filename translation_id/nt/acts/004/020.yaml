  yaml_path: translation/nt/acts/004/020.yaml
  text: For we are not able not to speak about what we have seen and heard[a].
translation:
  language: id
  text: Sebab kami tidak dapat tidak berbicara tentang apa yang telah kami lihat dan dengar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “Sebab kami tidak mungkin berdiam diri mengenai apa yang telah kami lihat dan dengar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δυνάμεθα ... μὴ λαλεῖν
  choice: kami tidak dapat tidak berbicara
  rationale: Ungkapan ini mempertahankan susunan ketidakmampuan untuk tidak berbicara, sekaligus memakai bentuk bahasa Indonesia yang baku dan dapat dipahami.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi pernyataan sebelumnya dan mempertahankan fungsi penjelas dari γάρ.
- source_word: ἡμεῖς
  choice: kami
  rationale: Kata ganti eksplisit menunjuk kepada para rasul yang sedang berbicara. 'Kami' tepat karena tidak mencakup para pendengar yang mereka hadapi.
- source_word: ἃ
  choice: apa yang
  rationale: Pilihan ini menyatakan isi kesaksian mereka secara alami tanpa menambahkan rincian yang tidak ada dalam teks.
- source_word: εἴδαμεν καὶ ἠκούσαμεν
  choice: telah kami lihat dan dengar
  rationale: '''Telah'' menyatakan tindakan lampau yang tetap relevan bagi kesaksian mereka dan secara alami menaungi kedua verba yang dikoordinasikan.'
- source_word: λαλεῖν
  choice: berbicara tentang
  rationale: Dalam konteks ini, verba tersebut mengacu pada pemberitaan mengenai hal-hal yang mereka saksikan; 'tentang' menjadikan hubungan dengan objeknya jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Perkataan para rasul digambarkan sebagai ketidakmampuan untuk berdiam diri, bukan sekadar ketidakmauan.
  choice: Mempertahankan bentuk 'tidak dapat tidak berbicara'.
  alternative: Menerjemahkannya sebagai tekad, misalnya 'kami tidak mau berhenti berbicara'.
  rationale: οὐ δυνάμεθα ... μὴ λαλεῖν secara langsung menyatakan ketidakmampuan untuk tidak berbicara. Terjemahan tidak memperlemahnya menjadi sekadar pilihan atau tekad manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'tidak dapat tidak' agak formal, tetapi mapan dan sengaja dipakai untuk mempertahankan ketegangan susunan Yunani; catatan kaki menyediakan ungkapan yang lebih idiomatis.
