base_translation:
  language: en
  yaml_path: translation/nt/acts/004/014.yaml
  text: And seeing the man who had been healed standing with them[a], they had nothing to say in reply.
translation:
  language: id
  text: Dan ketika mereka melihat orang yang telah disembuhkan itu berdiri bersama Petrus dan Yohanes, mereka tidak dapat membantah apa pun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mereka tidak mempunyai apa pun untuk dikatakan sebagai jawaban” atau “mereka tidak dapat mengatakan apa pun sebagai bantahan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τόν τε ἄνθρωπον
  choice: Namun, ... orang itu
  rationale: Artikel menunjuk kepada orang tertentu yang telah dikenal dari konteks, sedangkan τε menghubungkan pengamatan ini dengan uraian sebelumnya. Dalam bahasa Indonesia, “Namun” secara alami menandai bahwa kehadiran orang yang sembuh menjadi kendala bagi para pemimpin untuk membantah.
- source_word: βλέποντες
  choice: ketika melihat
  rationale: Partisipel kini menyatakan tindakan yang berlangsung bersamaan dan secara alami diungkapkan sebagai anak kalimat waktu dalam bahasa Indonesia.
- source_word: σὺν αὐτοῖς
  choice: bersama Petrus dan Yohanes
  rationale: Kata ganti αὐτοῖς merujuk kepada Petrus dan Yohanes dalam konteks dekat. Menyebut nama mereka menghindari ketidakjelasan rujukan dalam bahasa Indonesia tanpa menambah tokoh baru.
- source_word: ἑστῶτα
  choice: berdiri
  rationale: Partisipel perfek ἵστημι menggambarkan keadaan orang itu yang sedang berdiri; “berdiri” merupakan padanan Indonesia yang ringkas dan wajar.
- source_word: τεθεραπευμένον
  choice: yang telah disembuhkan
  rationale: Bentuk perfek pasif menunjukkan tindakan penyembuhan yang sudah terjadi dengan hasil yang masih nyata. “Telah disembuhkan” mempertahankan aspek selesai dan bentuk pasif.
- source_word: οὐδὲν εἶχον ἀντειπεῖν
  choice: mereka tidak dapat membantah apa pun
  rationale: Ungkapan ἔχω dengan infinitif menyatakan tidak adanya sesuatu yang dapat dikatakan, sedangkan ἀντειπεῖν memuat nuansa menentang atau membantah. Terjemahan ini alami dan mempertahankan daya adversatifnya.
theological_decisions:
- issue: Sasaran bantahan dalam οὐδὲν εἶχον ἀντειπεῖν tidak dinyatakan secara eksplisit
  choice: tidak dapat membantah apa pun
  alternative: tidak mempunyai apa pun untuk dikatakan sebagai jawaban
  rationale: Terjemahan utama tidak menambahkan objek tersirat seperti mukjizat, kesaksian, atau ajaran para rasul, sehingga ambiguitas sumber tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Struktur partisipial dialihkan menjadi anak kalimat waktu agar mudah dipahami. Nama Petrus dan Yohanes dipakai untuk memperjelas rujukan kata ganti berdasarkan konteks langsung.
