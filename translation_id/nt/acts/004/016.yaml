id: ACT.4.16
reference: Acts 4:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγοντες· Τί ⸀ποιήσωμεν τοῖς ἀνθρώποις τούτοις; ὅτι μὲν γὰρ γνωστὸν σημεῖον γέγονεν δι’ αὐτῶν πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν, καὶ οὐ δυνάμεθα ⸀ἀρνεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/016.yaml
  text: saying[a], “What should we do with these men? For indeed, a notable sign has happened through them, evident to all who live in Jerusalem, and we cannot deny it.”
translation:
  language: id
  text: kata mereka, “Apa yang harus kita lakukan terhadap kedua orang ini? Sebab, suatu tanda yang sudah diketahui umum telah terjadi melalui mereka; hal itu nyata bagi semua penduduk Yerusalem, dan kita tidak dapat menyangkalnya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: kata mereka
  rationale: Partisipel kini ini memperkenalkan isi perkataan para anggota sidang dan secara alami menghubungkannya dengan konteks sebelumnya.
- source_word: Τί ποιήσωμεν
  choice: Apa yang harus kita lakukan
  rationale: Subjungtif aoris menyatakan pertanyaan deliberatif; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: τοῖς ἀνθρώποις τούτοις
  choice: terhadap kedua orang ini
  rationale: Datif sesudah ποιέω menyatakan sasaran tindakan. Konteks mengacu khusus kepada Petrus dan Yohanes, sehingga 'kedua orang' tepat dan jelas.
- source_word: ὅτι μὲν γὰρ
  choice: Sebab
  rationale: Mengungkapkan hubungan penjelasan; nuansa penegasan juga terbawa oleh susunan keseluruhan kalimat tanpa ungkapan Indonesia yang kaku.
- source_word: γνωστὸν σημεῖον
  choice: suatu tanda yang sudah diketahui umum
  rationale: γνωστός di sini menunjuk pada sesuatu yang diketahui atau diakui secara luas; terjemahan ini selaras dengan penjelasan berikutnya bahwa hal itu nyata bagi seluruh penduduk Yerusalem.
- source_word: γέγονεν
  choice: telah terjadi
  rationale: Bentuk perfektum menyatakan peristiwa yang sudah berlangsung dengan hasil yang tetap relevan pada saat pembicaraan.
- source_word: δι’ αὐτῶν
  choice: melalui mereka
  rationale: διά dengan genitif menyatakan perantaraan atau sarana, tanpa mengesankan bahwa mereka adalah sumber kuasa yang mandiri.
- source_word: πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ
  choice: bagi semua penduduk Yerusalem
  rationale: Padanan yang ringkas dan alami untuk semua orang yang tinggal di Yerusalem.
- source_word: φανερόν
  choice: nyata
  rationale: Menunjukkan bahwa kenyataan tersebut terbuka dan jelas bagi masyarakat.
- source_word: οὐ δυνάμεθα ἀρνεῖσθαι
  choice: kita tidak dapat menyangkalnya
  rationale: Objek tersirat dalam bahasa Yunani dibuat eksplisit dengan '-nya', yakni kenyataan terjadinya tanda tersebut.
theological_decisions:
- issue: Makna σημεῖον dalam konteks penyembuhan yang diketahui umum
  choice: tanda
  alternative: mukjizat
  rationale: '''Tanda'' mempertahankan istilah khas Lukas dan kemungkinan bobot teologisnya sebagai peristiwa yang menunjuk melampaui tindakan itu sendiri; sifat mukjizatnya sudah jelas dari konteks.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan hubungan penjelasan, sifat publik dari tanda itu, serta perantaraan para rasul.
