  text: Θεωροῦντες δὲ τὴν τοῦ Πέτρου παρρησίαν καὶ Ἰωάννου καὶ καταλαβόμενοι ὅτι ἄνθρωποι ἀγράμματοί εἰσιν καὶ ἰδιῶται, ἐθαύμαζον, ἐπεγίνωσκόν τε αὐτοὺς ὅτι σὺν τῷ Ἰησοῦ ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/013.yaml
  text: As they observed the boldness of Peter and John[a], and realized that they were uneducated and ordinary men, they were astonished, and they recognized that they had been with Jesus.
translation:
  language: id
  text: Ketika mereka mengamati keberanian Petrus dan Yohanes serta menyadari bahwa keduanya tidak terpelajar dan merupakan orang biasa[a], mereka tercengang; mereka juga mengenali bahwa keduanya pernah bersama Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak mendapat pendidikan formal dan orang awam.” Istilah Yunaninya menggambarkan orang yang tidak memperoleh pendidikan akademis resmi dan tidak memiliki status profesional atau jabatan khusus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωροῦντες
  choice: ketika mereka mengamati
  rationale: Partisip ini menunjukkan pengamatan yang disengaja dan menjadi latar bagi reaksi para pemimpin; “mengamati” lebih tepat daripada sekadar “melihat”.
- source_word: παρρησίαν
  choice: keberanian
  rationale: Dalam konteks Kisah Para Rasul, kata ini menunjuk pada keterbukaan dan keberanian dalam berbicara; “keberanian” wajar dalam bahasa Indonesia dan sesuai dengan konteks kesaksian di hadapan para pemimpin.
- source_word: καταλαβόμενοι
  choice: menyadari
  rationale: Bentuk ini menggambarkan sampainya mereka pada suatu pemahaman mengenai Petrus dan Yohanes.
- source_word: ἄνθρωποι ἀγράμματοί ... καὶ ἰδιῶται
  choice: keduanya tidak terpelajar dan orang biasa
  rationale: Ungkapan ini menyatakan bahwa Petrus dan Yohanes tidak memperoleh pendidikan keilmuan formal serta tidak termasuk kalangan ahli atau pejabat; terjemahan ini tidak menyiratkan bahwa mereka bodoh atau sama sekali buta huruf.
- source_word: ἐθαύμαζον
  choice: mereka merasa heran
  rationale: Bentuk imperfek menunjukkan reaksi keheranan yang berlangsung; ungkapan Indonesia ini alami tanpa melebihkan intensitasnya.
- source_word: ἐπεγίνωσκόν
  choice: mereka pun mengenali
  rationale: Kata kerja ini menyatakan pengenalan atau identifikasi, sedangkan “pun” mencerminkan hubungan tambahan yang ditandai τε.
- source_word: σὺν τῷ Ἰησοῦ ἦσαν
  choice: keduanya pernah bersama Yesus
  rationale: Dalam konteks retrospektif, frasa ini menunjuk pada hubungan mereka dengan Yesus pada waktu sebelumnya; “pernah bersama” menyampaikan hal itu secara alami.
- source_word: δὲ ... τε
  choice: ketika ... pun
  rationale: Partikel-partikel ini terutama menata alur narasi. Tidak ditambahkan kata pembuka seperti “sekarang”; hubungan antarklausa disampaikan secara alami melalui susunan kalimat dan “pun”.
theological_decisions:
- issue: Gambaran sosial dan pendidikan Petrus serta Yohanes
  choice: tidak terpelajar dan orang biasa
  alternative: tidak berpendidikan formal dan orang awam
  rationale: Teks menggambarkan penilaian para pemimpin bahwa Petrus dan Yohanes tidak memiliki pendidikan keilmuan resmi maupun status profesional atau elite. Pilihan ini mempertahankan kontras tersebut tanpa menyebut mereka bodoh atau tidak mampu membaca.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Keduanya” dipakai untuk memperjelas bahwa penilaian dan pengenalan itu menyangkut Petrus dan Yohanes. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar mudah dipahami tanpa mengubah hubungan gagasannya.
