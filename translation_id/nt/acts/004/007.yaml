  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ στήσαντες αὐτοὺς ἐν ⸀τῷ μέσῳ ἐπυνθάνοντο· Ἐν ποίᾳ δυνάμει ἢ ἐν ποίῳ ὀνόματι ἐποιήσατε τοῦτο ὑμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/007.yaml
  text: And after setting them in the midst[a], they began asking, “By what power or in what name did you do this?”
translation:
  language: id
  text: Setelah menempatkan mereka di tengah-tengah, para pemimpin itu mulai bertanya[a], “Dengan kuasa apa atau dalam nama siapa kalian melakukan hal ini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terus bertanya” atau “menanyai mereka.” Bentuk imperfek Yunani dapat menekankan berlangsungnya pertanyaan, bukan mulainya tindakan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσαντες
  choice: Setelah menempatkan
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului pemeriksaan; bentuk ini menyampaikan urutan waktunya secara alami dalam bahasa Indonesia.
- source_word: αὐτοὺς
  choice: mereka
  rationale: Pronomina ini merujuk kepada Petrus dan Yohanes dalam konteks terdekat tanpa menambahkan nama ke dalam ayat.
- source_word: ἐν τῷ μέσῳ
  choice: di tengah-tengah
  rationale: Terjemahan ini mempertahankan gambaran harfiah bahwa mereka ditempatkan di tengah sidang, tanpa mempersempitnya menjadi sekadar 'di hadapan mereka'.
- source_word: ἐπυνθάνοντο
  choice: mulai bertanya
  rationale: Bentuk imperfek dapat bernuansa inseptif atau menunjukkan tindakan yang sedang berlangsung. 'Mulai bertanya' sesuai dengan alur narasi, sementara kemungkinan lainnya dicatat dalam catatan kaki.
- source_word: Ἐν ποίᾳ δυνάμει
  choice: Dengan kuasa apa
  rationale: Preposisi ἐν berfungsi instrumental dalam konteks ini, dan δύναμις paling langsung berarti 'kuasa', bukan 'wewenang'.
- source_word: ἢ ἐν ποίῳ ὀνόματι
  choice: atau dalam nama siapa
  rationale: Ungkapan 'dalam nama' mempertahankan idiom sumber mengenai tindakan berdasarkan nama atau perwakilan seseorang. 'Siapa' lebih alami daripada 'apa' dalam bahasa Indonesia karena nama yang dimaksud menunjuk kepada pribadi.
- source_word: ἐποιήσατε τοῦτο
  choice: kalian melakukan hal ini
  rationale: Aoris indikatif diterjemahkan sebagai tindakan lampau yang dipahami dari konteks; bahasa Indonesia tidak wajib menandai kala pada verba. 'Hal ini' tetap membiarkan acuannya ditentukan oleh konteks.
- source_word: ὑμεῖς
  choice: kalian
  rationale: Pronomina eksplisit Yunani bersifat menegaskan. 'Kalian' jelas menunjukkan orang kedua jamak dan membedakannya dari bentuk sopan tunggal.
theological_decisions:
- issue: Apakah δύναμις diterjemahkan sebagai 'kuasa' atau ditafsirkan sebagai 'wewenang'
  choice: kuasa
  alternative: wewenang
  rationale: δύναμις secara langsung menunjuk pada kuasa atau kemampuan yang bekerja, sedangkan frasa pasangan 'dalam nama siapa' sudah memuat gagasan otoritas perwakilan. Pembedaan dalam pertanyaan sumber dipertahankan.
- issue: Makna tindakan 'dalam nama'
  choice: mempertahankan idiom 'dalam nama siapa'
  alternative: dengan wewenang siapa
  rationale: Terjemahan idiom yang lebih formal menjaga keterbukaan makna antara pemanggilan nama, perwakilan, dan otoritas, tanpa menyelesaikan ketegangan itu secara interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar. Sebutan 'para pemimpin itu' dipakai sebagai subjek tersirat berdasarkan konteks agar kalimat Indonesia jelas; ungkapan 'di tengah-tengah' dan 'dalam nama siapa' mempertahankan citra serta idiom sumber. Pronomina 'kalian' menyatakan bentuk jamak secara terang.
