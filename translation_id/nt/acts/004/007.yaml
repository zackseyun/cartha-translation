  terminology: Istilah “kuasa” adalah padanan langsung dan tepat untuk δύναμις; tidak disamakan secara tidak perlu dengan “wewenang.” Idiom “dalam nama siapa” mempertahankan keluasan makna ungkapan Yunani tanpa memaksakan tafsiran tertentu.
