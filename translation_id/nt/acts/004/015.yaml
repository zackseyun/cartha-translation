  text: But after ordering them to go outside the council[a], they began conferring with one another[b],
translation:
  language: id
  text: Namun, setelah menyuruh mereka keluar dari sidang Mahkamah Agama[a], mereka mulai berunding satu sama lain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keluar dari Sanhedrin.” Kata Yunani συνέδριον dapat menunjuk kepada Mahkamah Agama Yahudi atau sidang yang sedang berlangsung.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “berdiskusi di antara mereka sendiri” atau “berunding bersama-sama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κελεύσαντες
  choice: setelah menyuruh
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama. 'Setelah menyuruh' alami dalam bahasa Indonesia dan tetap mencerminkan kewenangan dewan tanpa melebih-lebihkan nadanya.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan nuansa kontras ringan dari pemeriksaan terbuka kepada perundingan tertutup.
- source_word: αὐτοὺς
  choice: mereka
  rationale: Mengacu kepada Petrus dan Yohanes; pronomina cukup jelas dari konteks.
- source_word: ἔξω τοῦ συνεδρίου
  choice: keluar dari ruang sidang Mahkamah Agama
  rationale: Dalam konteks ini συνέδριον dapat menunjuk badan penguasa Yahudi, sidangnya, atau tempat sidang itu berlangsung. Ungkapan ini secara alami menyampaikan bahwa mereka diperintahkan meninggalkan hadapan sidang.
- source_word: ἀπελθεῖν
  choice: keluar
  rationale: Infinitif ini melengkapi κελεύσαντες; bersama ἔξω, 'keluar' merupakan padanan Indonesia yang ringkas dan idiomatis.
- source_word: συνέβαλλον
  choice: mulai berunding
  rationale: Imperfek menggambarkan tindakan yang sedang berlangsung atau mulai berlangsung. Dalam konteks ini verba tersebut berarti berunding atau bertukar pikiran, bukan makna harfiahnya.
- source_word: πρὸς ἀλλήλους
  choice: satu sama lain
  rationale: Menjaga sifat timbal balik dari perundingan yang dinyatakan frasa Yunani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. 'Mahkamah Agama' dipakai sebagai sebutan yang mudah dipahami untuk Sanhedrin; penambahan 'ruang sidang' menjelaskan makna spasial ἔξω tanpa mengubah pelaku. Subjek eksplisit 'para pemimpin itu' ditambahkan demi kejelasan karena perubahan rujukan pronomina dapat terasa kabur dalam bahasa Indonesia.
