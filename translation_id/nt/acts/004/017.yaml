id: ACT.4.17
reference: Acts 4:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα μὴ ἐπὶ πλεῖον διανεμηθῇ εἰς τὸν λαόν, ⸀ἀπειλησώμεθα αὐτοῖς μηκέτι λαλεῖν ἐπὶ τῷ ὀνόματι τούτῳ μηδενὶ ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/017.yaml
  text: But so that it may not spread any further among the people, let us warn them not to speak any longer to anyone in this name.
translation:
  language: id
  text: Namun, supaya hal ini tidak semakin tersebar di antara rakyat, marilah kita mengancam mereka[a] agar mereka tidak lagi berbicara kepada siapa pun dalam nama ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memperingatkan mereka dengan keras.” Kata Yunani yang dipakai terutama berarti mengancam dan menyiratkan intimidasi oleh pihak yang berkuasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: διανεμηθῇ
  choice: tersebar
  rationale: Bentuk pasif ini secara harfiah dapat berarti 'dibagikan' atau 'disebarkan'; dalam konteks kabar dan ajaran yang meluas di tengah masyarakat, 'tersebar' merupakan padanan Indonesia yang alami dan tepat.
- source_word: ἐπὶ πλεῖον
  choice: semakin
  rationale: Ungkapan ini menunjukkan perluasan melampaui keadaan sekarang; bersama 'tersebar', 'semakin' menyampaikan arti 'lebih jauh/lebih luas' secara alami.
- source_word: εἰς τὸν λαόν
  choice: di antara rakyat
  rationale: λαός menunjuk kepada masyarakat luas, khususnya khalayak Yahudi dalam konteks Kisah Para Rasul; 'rakyat' mempertahankan cakupan kolektifnya.
- source_word: ἀπειλησώμεθα
  choice: marilah kita mengancam mereka
  rationale: Verba ini pada dasarnya berarti 'mengancam' dan menyatakan intimidasi koersif oleh para penguasa. Bahasa Indonesia dapat memakai konstruksi ini secara alami, sehingga kekuatan leksikalnya tidak perlu dilemahkan menjadi sekadar 'memperingatkan'.
- source_word: μηκέτι λαλεῖν
  choice: agar mereka tidak lagi berbicara
  rationale: '''Tidak lagi'' mempertahankan unsur negatif sekaligus temporal μηκέτι, yakni penghentian mulai saat itu.'
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: dalam nama ini
  rationale: Ungkapan ini mempertahankan rumusan sumber dan dapat mencakup berbicara dengan dasar, kuasa, atau kaitan pada nama yang dimaksud tanpa mempersempit ambiguitasnya.
- source_word: μηδενὶ ἀνθρώπων
  choice: kepada siapa pun
  rationale: Dativus ini menyatakan pihak yang menjadi sasaran bicara; setelah larangan negatif, 'kepada siapa pun' adalah bentuk Indonesia yang alami dan inklusif.
theological_decisions:
- issue: Kekuatan ἀπειλησώμεθα dalam tanggapan Mahkamah Agama
  choice: mengancam
  alternative: memperingatkan dengan keras
  rationale: Adegan ini bersifat yudisial dan koersif. Padanan 'mengancam' mempertahankan kekuatan dasar verba Yunani serta tidak melunakkan tindakan para pemimpin.
- issue: Makna ἐπὶ τῷ ὀνόματι τούτῳ
  choice: dalam nama ini
  alternative: berdasarkan nama ini / sehubungan dengan nama ini
  rationale: Terjemahan formal yang tetap alami ini tidak memutuskan secara sempit apakah frasa tersebut terutama menunjuk pada kuasa, dasar, atau hubungan dengan nama Yesus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-yudisial yang lugas dan bermartabat. Susunan kalimat menjaga hubungan tujuan dari ἵνα dan mempertahankan kekuatan koersif verba utama tanpa menjadi kaku.
