  source_fidelity: Terjemahan dengan tepat mempertahankan hubungan tujuan ἵνα (“supaya”), perluasan ἐπὶ πλεῖον (“semakin”), dan larangan μηκέτι (“tidak lagi”). “Marilah kita mengancam mereka” secara langsung mencerminkan daya koersif ἀπειλησώμεθα; ini lebih setia kepada sumber Yunani daripada pelunakan “memperingatkan.” “Kepada siapa pun” dengan tepat menyampaikan μηδενὶ ἀνθρώπων.
  naturalness: Bahasa Indonesia baku, lugas, dan sesuai register naratif-yudisial. “Di antara rakyat” dan “dalam nama ini” dapat dipahami secara alami dalam konteks ini. Susunan “mengancam mereka agar mereka tidak lagi berbicara” juga jelas dan idiomatis.
  terminology: “Mengancam” mempertahankan kekuatan leksikal verba Yunani tanpa penafsiran doktrinal. “Dalam nama ini” mempertahankan keluasan frasa ἐπὶ τῷ ὀνόματι τούτῳ, tanpa memaksakan makna sempit seperti ‘atas otoritas’ atau ‘tentang.’ Catatan kaki memberikan alternatif yang lebih lunak sambil menjelaskan bahwa makna utama tetap ‘mengancam.’
