id: ACT.4.31
reference: Acts 4:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ δεηθέντων αὐτῶν ἐσαλεύθη ὁ τόπος ἐν ᾧ ἦσαν συνηγμένοι, καὶ ἐπλήσθησαν ἅπαντες ⸂τοῦ ἁγίου πνεύματος⸃, καὶ ἐλάλουν τὸν λόγον τοῦ θεοῦ μετὰ παρρησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/031.yaml
  text: And when they had prayed[a], the place in which they were gathered was shaken[b], and they were all filled with the Holy Spirit and were speaking the word of God with boldness.
translation:
  language: id
  text: Setelah mereka berdoa, tempat mereka berkumpul itu berguncang. Mereka semua dipenuhi Roh Kudus dan terus menyampaikan firman Allah dengan penuh keberanian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan penuh keyakinan” atau “dengan terus terang.” Istilah Yunaninya menunjukkan perkataan yang terbuka dan tidak takut.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεηθέντων αὐτῶν
  choice: Setelah mereka berdoa
  rationale: Genitif absolut dengan partisip aoristus memberi latar waktu. 'Setelah mereka berdoa' alami dalam bahasa Indonesia dan mempertahankan urutan tindakan tanpa memakai istilah yang lebih teknis seperti 'memanjatkan permohonan'.
- source_word: ἐσαλεύθη
  choice: berguncang
  rationale: Bentuk pasif aoristus menyatakan bahwa tempat itu mengalami guncangan. Dalam konstruksi Indonesia, 'tempat ... berguncang' menyampaikan peristiwa fisik itu secara alami tanpa harus memakai pasif yang kaku.
- source_word: ὁ τόπος ἐν ᾧ ἦσαν συνηγμένοι
  choice: tempat mereka berkumpul itu
  rationale: Ungkapan ini mengidentifikasi tempat mereka berada dalam keadaan sudah berkumpul. Susunan Indonesia ini ringkas, jelas, dan tetap mencerminkan keadaan berkumpul tersebut.
- source_word: ἐπλήσθησαν ἅπαντες
  choice: Mereka semua dipenuhi
  rationale: Mempertahankan bentuk pasif dan penekanan ἅπαντες bahwa seluruh kelompok mengalami hal tersebut.
- source_word: τοῦ ἁγίου πνεύματος
  choice: Roh Kudus
  rationale: 'Pelengkap genitif sesudah πίμπλημι secara idiomatis diterjemahkan sebagai isi: ''dipenuhi Roh Kudus''. Kapitalisasi menunjukkan rujukan kepada Roh ilahi tanpa menambahkan rumusan doktrinal di luar teks.'
- source_word: ἐλάλουν
  choice: terus menyampaikan
  rationale: Imperfek menunjukkan tindakan yang berlangsung. 'Terus menyampaikan' mengungkapkan aspek duratif dengan alami dan, bersama objeknya, menunjuk pada pewartaan pesan, bukan sekadar aktivitas berbicara umum.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: firman Allah
  rationale: '''Firman Allah'' merupakan ungkapan Alkitabiah yang mapan dan dapat dipahami sebagai pesan yang berasal dari Allah, sambil mempertahankan bobot istilah λόγος.'
- source_word: μετὰ παρρησίας
  choice: dengan penuh keberanian
  rationale: παρρησία dalam konteks Kisah Para Rasul menunjuk pada keterbukaan dan keberanian berbicara tanpa takut. 'Dengan penuh keberanian' alami dalam bahasa Indonesia; nuansa alternatif dicatat dalam catatan kaki.
theological_decisions:
- issue: Bahasa tentang dipenuhi Roh
  choice: Mereka semua dipenuhi Roh Kudus
  alternative: Mereka semua dipenuhi oleh Roh Kudus
  rationale: Konstruksi genitif sesudah ἐπλήσθησαν paling wajar menyatakan isi, yaitu dipenuhi dengan Roh Kudus. Terjemahan ini mempertahankan idiom Lukas tanpa menentukan bahwa Roh hanya pelaku eksternal atau mengimpor doktrin denominasi tentang pengalaman tertentu.
- issue: Aspek ἐλάλουν
  choice: terus menyampaikan
  alternative: menyampaikan; mulai menyampaikan
  rationale: Bentuk imperfek menggambarkan pewartaan yang sedang atau terus berlangsung. Terjemahan tidak menambahkan nuansa permulaan yang tidak dinyatakan secara pasti oleh bentuk Yunani.
- issue: Makna παρρησία
  choice: dengan penuh keberanian
  alternative: dengan penuh keyakinan; dengan terus terang
  rationale: Dalam konteks kesaksian publik sesudah ancaman, keberanian paling menonjol, tetapi istilah Yunani juga mencakup keterusterangan dan kebebasan berbicara; ambiguitas itu dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur kalimat dipecah menjadi dua agar alami. 'Terus menyampaikan' mempertahankan aspek imperfek, sedangkan 'firman Allah' mempertahankan idiom Alkitabiah yang lazim. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskannya.
