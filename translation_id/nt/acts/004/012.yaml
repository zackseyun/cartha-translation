  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία, ⸀οὐδὲ γὰρ ὄνομά ἐστιν ἕτερον ⸂ὑπὸ τὸν οὐρανὸν⸃ τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/012.yaml
  text: And there is salvation in no one else[a], for there is no other name under heaven given among men by which we must be saved.
translation:
  language: id
  text: Dan keselamatan tidak ada pada siapa pun yang lain, sebab di bawah langit tidak ada nama lain yang telah diberikan di antara manusia[a] yang olehnya kita harus diselamatkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang telah diberikan kepada manusia.”
    reason: 'Alternatif sintaksis: ἐν ἀνθρώποις paling wajar berarti “di antara manusia”, tetapi dalam konteks pemberian dapat pula dipahami secara lebih langsung sebagai “kepada manusia”.'
lexical_decisions:
- source_word: σωτηρία
  choice: keselamatan
  rationale: Dalam pemberitaan Petrus tentang peran Yesus yang unik, istilah ini mencakup penyelamatan dan keadaan selamat; “keselamatan” mempertahankan daya langsung sekaligus teologisnya.
- source_word: ἐν ἄλλῳ οὐδενί
  choice: tidak ada di dalam siapa pun yang lain
  rationale: Ungkapan ini mempertahankan konstruksi personal dan eksklusif bahasa Yunani serta kaitannya dengan frasa berikutnya, tanpa mengubahnya menjadi gagasan abstrak seperti “tidak ada jalan lain”.
- source_word: ὄνομα
  choice: nama
  rationale: “Nama” dipertahankan, bukan diparafrasakan sebagai “pribadi” atau “kuasa”, sehingga cakupan makna alkitabiahnya—identitas, pribadi, dan wewenang—tetap tersirat.
- source_word: ἕτερον
  choice: lain
  rationale: Dalam konstruksi negatif ini, “tidak ada nama lain” merupakan ungkapan Indonesia yang alami dan menyampaikan eksklusivitas teks.
- source_word: ὑπὸ τὸν οὐρανόν
  choice: di bawah langit
  rationale: Idiom ini dipertahankan karena wajar dalam bahasa Indonesia yang bermartabat dan menyatakan cakupan dunia manusia.
- source_word: δεδομένον ἐν ἀνθρώποις
  choice: yang telah diberikan di antara manusia
  rationale: Partisip tersebut menerangkan “nama”; “di antara manusia” mempertahankan nuansa lingkup manusia dan makna generik ἀνθρώποις, bukan membatasinya pada laki-laki.
- source_word: ἐν ᾧ
  choice: yang olehnya
  rationale: Frasa ini merujuk kepada “nama” dan menyatakan sarana; “yang olehnya” menjaga hubungan gramatikal itu dengan gaya yang khidmat dan jelas.
- source_word: δεῖ
  choice: harus
  rationale: “Harus” secara ringkas mempertahankan unsur keharusan dalam δεῖ tanpa menambahkan penjelasan mengenai sumber keharusan tersebut.
- source_word: σωθῆναι
  choice: diselamatkan
  rationale: Bentuk pasif dipertahankan dan diselaraskan secara leksikal dengan σωτηρία, tanpa menentukan lebih jauh pelaku yang tersirat.
theological_decisions:
- issue: Eksklusivitas keselamatan dalam hubungan dengan Yesus
  choice: “keselamatan tidak ada di dalam siapa pun yang lain”
  alternative: “tidak ada jalan keselamatan yang lain”
  rationale: Bahasa Yunani menyatakan bahwa keselamatan tidak ada dalam pribadi lain dan mendasarkannya pada tidak adanya nama lain. Terjemahan mempertahankan klaim eksklusif itu tanpa menambahkan rumusan doktrinal di luar ayat.
- issue: Cakupan ἀνθρώποις
  choice: “di antara manusia”
  alternative: “kepada manusia”
  rationale: Preposisi ἐν secara paling langsung menyatakan keberadaan atau pemberian nama itu di tengah umat manusia. “Manusia” juga menyampaikan rujukan generik kepada seluruh kemanusiaan tanpa ambiguitas gender yang tidak terdapat dalam konteks.
- issue: Keharusan dalam δεῖ
  choice: “kita harus diselamatkan”
  alternative: “kita dapat diselamatkan”
  rationale: δεῖ menyatakan keharusan, bukan sekadar kemungkinan. Bentuk pasif dan ketegangan teologis mengenai keharusan itu dipertahankan tanpa penjelasan tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat menjaga paralelisme dan eksklusivitas teks Yunani. “Di dalam siapa pun yang lain” sengaja mempertahankan metafora relasional ἐν, sedangkan “yang olehnya” menyampaikan fungsi instrumental dari ἐν ᾧ. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskan.
