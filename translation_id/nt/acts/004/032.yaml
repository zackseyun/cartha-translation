id: ACT.4.32
reference: Acts 4:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τοῦ δὲ πλήθους τῶν πιστευσάντων ἦν ⸀καρδία καὶ ⸀ψυχὴ μία, καὶ οὐδὲ εἷς τι τῶν ὑπαρχόντων ⸀αὐτῷ ἔλεγεν ἴδιον εἶναι, ἀλλ’ ἦν αὐτοῖς ⸀πάντα κοινά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/032.yaml
  text: The multitude of those who had believed were of one heart and soul[a], and not even one of them said that anything belonging to him was his own[b], but all things were held in common among them.
translation:
  language: id
  text: Kumpulan orang yang telah percaya itu sehati dan sejiwa[a]. Tidak seorang pun mengatakan bahwa sesuatu yang dimilikinya adalah miliknya sendiri[b], melainkan segala sesuatu merupakan milik bersama mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “satu hati dan satu jiwa.”
    reason: lexical_alternative
  - marker: b
    text: Bentuk tunggal dalam bahasa Yunani menunjuk kepada setiap orang secara individual.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθους
  choice: kumpulan
  rationale: Menunjukkan himpunan orang dalam jumlah besar sebagai satu komunitas, tanpa menambahkan gagasan yang tidak dinyatakan dalam teks.
- source_word: τῶν πιστευσάντων
  choice: orang yang telah percaya
  rationale: Mempertahankan sifat verbal partisip aoris dan menggambarkan tindakan percaya yang mendahului keadaan yang sedang dilaporkan.
- source_word: καρδία καὶ ψυχὴ μία
  choice: sehati dan sejiwa
  rationale: Ungkapan Indonesia yang alami dan bermartabat ini mempertahankan kedua unsur Yunani serta menyatakan kesatuan batin dan tujuan.
- source_word: οὐδὲ εἷς
  choice: tidak seorang pun
  rationale: Menyampaikan penyangkalan yang tegas dan cocok dengan bentuk tunggal distributif dalam klausa berikutnya.
- source_word: τι τῶν ὑπαρχόντων αὐτῷ
  choice: sesuatu yang dimilikinya
  rationale: Mengungkapkan benda atau harta yang menjadi kepunyaan tiap-tiap orang tanpa membatasi maknanya pada jenis harta tertentu.
- source_word: ἔλεγεν ἴδιον εἶναι
  choice: mengatakan bahwa ... adalah miliknya sendiri
  rationale: Tetap dekat dengan susunan Yunani dan mempertahankan tekanan pada kepunyaan pribadi tanpa menafsirkannya sebagai klaim hukum tertentu.
- source_word: πάντα κοινά
  choice: segala sesuatu merupakan milik bersama mereka
  rationale: Mempertahankan struktur predikatif dan gagasan bahwa segala sesuatu tersedia atau dimiliki secara komunal, tanpa mengubahnya menjadi pernyataan tentang suatu sistem ekonomi tertentu.
theological_decisions:
- issue: Gambaran kepemilikan bersama dalam jemaat Yerusalem
  choice: Ayat diterjemahkan sebagai laporan deskriptif tentang sikap dan praktik berbagi dalam komunitas orang percaya.
  alternative: Menerjemahkannya sebagai kepemilikan kolektif yang diwajibkan atau, sebaliknya, melemahkan unsur kebersamaan menjadi kemurahan hati individual saja.
  rationale: Teks Yunani menyatakan bahwa tidak seorang pun memperlakukan miliknya sebagai kepunyaan eksklusif dan bahwa segala sesuatu merupakan milik bersama. Terjemahan mempertahankan ketegangan ini tanpa memasukkan sistem politik, ekonomi, atau gerejawi dari masa kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Ungkapan “sehati dan sejiwa” alami bagi pembaca umum, sedangkan “milik bersama” mempertahankan bobot komunal teks tanpa menjadikannya rumusan ideologis.
