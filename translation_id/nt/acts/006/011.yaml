  yaml_path: translation/nt/acts/006/011.yaml
  text: Then they secretly induced men to say[a], “We have heard him speaking blasphemous words against Moses and God.”
translation:
  language: id
  text: Kemudian mereka diam-diam menghasut beberapa pria untuk berkata[a], “Kami telah mendengar dia mengucapkan kata-kata hujatan terhadap Musa dan Allah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membujuk beberapa pria” atau “menggerakkan beberapa pria.” Kata kerja Yunani ini menyiratkan dorongan atau hasutan yang dilakukan secara tersembunyi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Penghubung waktu yang wajar dalam narasi dan menandai tindakan berikutnya.
- source_word: ὑπέβαλον
  choice: secara diam-diam mereka membujuk
  rationale: Dalam konteks ini, verba tersebut menyatakan tindakan mendorong atau membujuk secara tersembunyi dan licik, bukan sekadar mengajukan orang.
- source_word: ἄνδρας
  choice: beberapa orang
  rationale: ἀνήρ menunjuk kepada laki-laki; dalam bahasa Indonesia, 'beberapa orang' terdengar alami dalam konstruksi ini, sedangkan konteks tetap berbicara tentang sejumlah pria yang direkrut sebagai penuduh.
- source_word: λέγοντας
  choice: untuk berkata
  rationale: Partisipel ini secara idiomatis menyatakan isi tindakan pembujukan.
- source_word: Ἀκηκόαμεν
  choice: Kami telah mendengar
  rationale: Bentuk perfektum dipertahankan dengan 'telah', yang menyampaikan akibat kini dari tindakan mendengar.
- source_word: αὐτοῦ λαλοῦντος
  choice: dia mengucapkan
  rationale: Konstruksi sesudah verba mendengar menyatakan bahwa mereka mengaku mendengar dia sedang berbicara; 'mengucapkan' berpadu alami dengan objek 'kata-kata'.
- source_word: ῥήματα βλάσφημα
  choice: kata-kata hujatan
  rationale: Mencerminkan ungkapan Yunani secara dekat dan mempertahankan bobot hukum-keagamaan tuduhan tersebut.
- source_word: εἰς Μωϋσῆν καὶ τὸν θεόν
  choice: terhadap Musa dan Allah
  rationale: Dalam konteks tuduhan yang bermusuhan, εἰς menunjukkan sasaran penghinaan; 'terhadap' menyampaikannya secara alami tanpa pengulangan.
theological_decisions:
- issue: Sifat tuduhan terhadap Stefanus
  choice: Melaporkan bahwa para penuduh menyebut perkataan Stefanus sebagai 'kata-kata hujatan terhadap Musa dan Allah'.
  alternative: '''kata-kata fitnah terhadap Musa dan Allah'''
  rationale: βλάσφημα memiliki daya hukum dan keagamaan yang tepat disampaikan dengan 'hujatan'. Narasi melaporkan isi tuduhan tanpa membenarkan kebenarannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Susunan dibuat alami bagi pembaca umum sambil mempertahankan nuansa tindakan tersembunyi dan bobot tuduhan keagamaan.
