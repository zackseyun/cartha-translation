  verdict: revise
  source_fidelity: Makna pokok dan daftar tujuh orang telah diterjemahkan dengan tepat. Namun, πλῆθος lebih netral daripada “jemaat”; dalam konteks ini kata itu menunjuk pada seluruh kelompok yang hadir, tanpa perlu memberi label eklesial yang tidak ada dalam kata Yunani.
  naturalness: Kalimatnya pada dasarnya alami. “Seluruh kumpulan itu” lebih netral dan tetap wajar dalam narasi modern. Menghapus “juga” membuat daftar nama lebih lancar dan menghindari kesan bahwa Filipus dan yang lain merupakan tambahan tersendiri.
  terminology: “Usul,” “iman,” “Roh Kudus,” dan nama-nama tersebut tepat. Keterangan “seorang penganut agama Yahudi dari Antiokhia” dengan benar membatasi keterangan itu pada Nikolaus; catatan kaki secara tepat menjelaskan bahwa ia seorang bukan Yahudi yang menjadi penganut Yudaisme.
  issues:
