    issue: “seluruh jemaat” untuk παντὸς τοῦ πλήθους
    rationale: Walaupun dapat dipahami dari konteks para murid, “jemaat” menambahkan penandaan komunitas gerejawi yang tidak dinyatakan oleh πλῆθος. “Seluruh kumpulan itu” mempertahankan rujukan kolektif secara lebih netral.
  - severity: low
    issue: Kata “juga” sebelum “Filipus”
    rationale: Bahasa Yunani hanya meneruskan daftar dengan καί. Dalam bahasa Indonesia, “juga” tidak diperlukan dan dapat memberi kesan pemisahan retoris antara Stefanus dan enam nama berikutnya.
