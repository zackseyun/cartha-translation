id: ACT.6.5
reference: Acts 6:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἤρεσεν ὁ λόγος ἐνώπιον παντὸς τοῦ πλήθους, καὶ ἐξελέξαντο Στέφανον, ἄνδρα ⸀πλήρης πίστεως καὶ πνεύματος ἁγίου, καὶ Φίλιππον καὶ Πρόχορον καὶ Νικάνορα καὶ Τίμωνα καὶ Παρμενᾶν καὶ Νικόλαον προσήλυτον Ἀντιοχέα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/005.yaml
  text: And the proposal pleased the whole multitude[a], and they chose Stephen, a man full of faith and of the Holy Spirit, Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus[c][b], a proselyte of Antioch.
translation:
  language: id
  text: Usul itu disambut baik oleh seluruh kumpulan itu, lalu mereka memilih Stefanus, seorang yang penuh dengan iman[a] dan Roh Kudus, Filipus, Prokhorus, Nikanor, Timon, Parmenas, dan Nikolaus, seorang penganut agama Yahudi[b] dari Antiokhia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesetiaan”. Kata Yunani yang dipakai dapat berarti iman, kepercayaan, atau kesetiaan.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah seorang bukan Yahudi yang telah beralih menjadi penganut agama Yahudi.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος
  choice: usul itu
  rationale: Dalam konteks ini λόγος menunjuk pada usul yang baru saja disampaikan para rasul, bukan pada 'firman' secara abstrak.
- source_word: ἤρεσεν ... ἐνώπιον παντὸς τοῦ πλήθους
  choice: disambut baik oleh seluruh jemaat
  rationale: Ungkapan ini menyatakan bahwa usul tersebut mendapat persetujuan seluruh kelompok yang berkumpul. 'Jemaat' wajar dalam konteks komunitas murid tanpa menjadikannya istilah kelembagaan yang lebih teknis.
- source_word: ἐξελέξαντο
  choice: mereka memilih
  rationale: Menyampaikan secara langsung tindakan kelompok itu dalam memilih ketujuh orang tersebut.
- source_word: ἄνδρα πλήρης πίστεως
  choice: seorang yang penuh dengan iman
  rationale: Bahasa Indonesia tidak perlu mengulang kata 'laki-laki' dalam aposisi ini; frasa tersebut tetap menggambarkan Stefanus sebagai orang yang penuh iman. Bentuk πλήρης yang secara tata bahasa tidak mengikuti kasus yang diharapkan tidak mengubah maknanya.
- source_word: πίστεως
  choice: iman
  rationale: πίστις di sini paling wajar menunjuk pada iman atau kepercayaan Stefanus, sementara nuansa 'kesetiaan' tetap mungkin dan dicatat dalam catatan kaki.
- source_word: πνεύματος ἁγίου
  choice: Roh Kudus
  rationale: Dalam Kisah Para Rasul frasa ini secara teratur menunjuk pada Roh Kudus sebagai pribadi ilahi.
- source_word: προσήλυτον
  choice: seorang penganut agama Yahudi
  rationale: Istilah ini menunjuk pada orang bukan Yahudi yang telah beralih menjadi penganut Yudaisme; terjemahan deskriptif lebih mudah dipahami daripada kata serapan 'proselit'.
- source_word: Ἀντιοχέα
  choice: dari Antiokhia
  rationale: Kata sifat tersebut menunjukkan asal atau hubungan Nikolaus dengan kota Antiokhia.
- source_word: Στέφανον ... Νικόλαον
  choice: Stefanus ... Nikolaus
  rationale: Nama-nama dialihaksarakan mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia; daftar disusun dengan tanda koma dan penghubung yang alami.
theological_decisions:
- issue: Makna πίστις dalam gambaran tentang Stefanus
  choice: iman
  alternative: kesetiaan
  rationale: Konteks paling alami menggambarkan Stefanus sebagai orang yang penuh iman, tetapi πίστις juga dapat menyatakan kesetiaan; kemungkinan itu tidak dihapus dan dicantumkan dalam catatan kaki.
- issue: Rujukan πνεύματος ἁγίου
  choice: Roh Kudus
  alternative: roh yang kudus
  rationale: Pemakaian khas frasa ini dalam Kisah Para Rasul mendukung rujukan kepada Roh Kudus, bukan sekadar sifat rohani seseorang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Pola penghubung Yunani yang berulang disajikan sebagai daftar alami dalam bahasa Indonesia. Kata 'juga' memperjelas bahwa keterangan tentang iman dan Roh Kudus khusus menerangkan Stefanus, sementara ketujuh nama tetap merupakan satu kelompok yang dipilih.
