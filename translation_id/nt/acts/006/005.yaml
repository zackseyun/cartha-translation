  to: Usul itu disambut baik oleh seluruh kumpulan itu, lalu mereka memilih Stefanus, seorang yang penuh dengan iman[a] dan Roh Kudus, Filipus, Prokhorus, Nikanor, Timon, Parmenas, dan Nikolaus, seorang penganut agama Yahudi[b] dari Antiokhia.
