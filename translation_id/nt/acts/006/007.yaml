id: ACT.6.7
reference: Acts 6:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος τοῦ θεοῦ ηὔξανεν, καὶ ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν ἐν Ἰερουσαλὴμ σφόδρα, πολύς τε ὄχλος τῶν ἱερέων ὑπήκουον τῇ πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/007.yaml
  text: And the word of God kept increasing[a], and the number of the disciples in Jerusalem kept multiplying greatly, and a large crowd of the priests were becoming obedient to the faith.
translation:
  language: id
  text: Firman Allah semakin berkembang, dan jumlah murid di Yerusalem semakin bertambah dengan sangat pesat. Sejumlah besar imam pun menjadi taat kepada iman itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “menaati iman” atau “menjadi taat kepada pesan iman.” Ungkapan Yunani ini dapat menunjuk pada ketaatan kepada pesan atau ajaran yang dipercayai, bukan hanya pada tindakan percaya dalam batin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: Firman Allah
  rationale: Mempertahankan ungkapan alkitabiah yang merujuk pada berita yang berasal dari Allah tanpa mempersempitnya menjadi hanya ucapan atau pemberitaan Injil.
- source_word: ηὔξανεν
  choice: terus tersebar
  rationale: Secara harfiah berarti 'terus bertumbuh'. Dalam konteks firman atau berita, 'terus tersebar' menyampaikan perkembangan pemberitaan secara alami dalam bahasa Indonesia, sedangkan aspek imperfek dipertahankan dengan 'terus'.
- source_word: ἐπληθύνετο
  choice: bertambah sangat pesat
  rationale: Menyatakan pertambahan yang terus berlangsung; bersama σφόδρα, ungkapan ini alami dan tetap membedakannya dari pertumbuhan firman pada klausa sebelumnya.
- source_word: ὁ ἀριθμὸς τῶν μαθητῶν
  choice: jumlah murid
  rationale: Mencerminkan konstruksi Yunani secara ringkas dan mempertahankan istilah penting Lukas, μαθηταί, sebagai 'murid'.
- source_word: ἐν Ἰερουσαλὴμ
  choice: di Yerusalem
  rationale: Padanan lokatif langsung dan alami.
- source_word: σφόδρα
  choice: sangat pesat
  rationale: Menyampaikan penegasan kuat atas pertambahan jumlah murid dengan idiom Indonesia yang alami.
- source_word: πολύς τε ὄχλος
  choice: sejumlah besar
  rationale: Dalam konteks kelompok imam, ungkapan ini lebih alami daripada 'kerumunan besar' sambil tetap menyampaikan banyaknya orang secara kolektif.
- source_word: τῶν ἱερέων
  choice: imam
  rationale: Padanan langsung bagi para imam Yahudi yang melayani dalam lingkungan Bait Allah.
- source_word: ὑπήκουον
  choice: menjadi taat
  rationale: Mengungkapkan proses yang sedang berlangsung dalam bentuk imperfek dan cocok dengan konteks banyak imam yang beralih menyambut iman.
- source_word: τῇ πίστει
  choice: kepada iman itu
  rationale: Artikel Yunani dan konstruksi 'taat kepada' mendukung arti objektif, yaitu iman sebagai berita atau pengakuan yang diterima, tanpa menjelaskannya secara berlebihan sebagai 'iman Kristen'.
theological_decisions:
- issue: Arti πίστις dalam frasa τῇ πίστει
  choice: iman itu
  alternative: iman; berita iman
  rationale: Konteks dan artikel tertentu mendukung arti objektif—iman sebagai isi kepercayaan atau berita yang ditaati—namun kata Yunani tetap dapat didengar sebagai 'iman'. Terjemahan utama mempertahankan ketegangan itu, dan catatan menjelaskan alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dibuat alami dengan dua kalimat, sementara hubungan antarklausa dipertahankan melalui 'dan' serta 'pun'. Istilah 'Firman Allah', 'murid', 'imam', dan 'iman' mempertahankan kosakata alkitabiah yang umum dipahami.
