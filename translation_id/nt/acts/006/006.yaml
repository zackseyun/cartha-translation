id: ACT.6.6
reference: Acts 6:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὓς ἔστησαν ἐνώπιον τῶν ἀποστόλων, καὶ προσευξάμενοι ἐπέθηκαν αὐτοῖς τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/006.yaml
  text: These they set before the apostles[a], and after praying[b], they laid their hands on them.
translation:
  language: id
  text: Mereka menghadapkan ketujuh orang itu di hadapan para rasul[a]. Setelah berdoa, para rasul menumpangkan tangan ke atas mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mereka membawa ketujuh orang itu ke hadapan para rasul.”'
    reason: lexical_alternative
  - marker: b
    text: Penumpangan tangan dapat menandakan pemberkatan atau penugasan. Bahasa Yunani menyebut tindakannya tanpa menjelaskan lebih lanjut makna gerejawinya di sini.
    reason: cultural_note
lexical_decisions:
- source_word: οὓς
  choice: ketujuh orang itu
  rationale: Kata ganti relatif maskulin jamak ini mengacu kepada tujuh orang yang disebut pada ayat sebelumnya. Penyebutan eksplisit membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: ἔστησαν ἐνώπιον
  choice: membawa ... ke hadapan
  rationale: Dalam konstruksi kausatif ini, frasa tersebut berarti menempatkan atau menghadirkan seseorang di hadapan pihak lain. 'Membawa ... ke hadapan' alami untuk konteks presentasi resmi tanpa menentukan makna upacaranya.
- source_word: τῶν ἀποστόλων
  choice: para rasul
  rationale: '''Rasul'' adalah istilah baku bagi kelompok apostolik yang dimaksud dalam Kisah Para Rasul.'
- source_word: προσευξάμενοι
  choice: setelah berdoa
  rationale: Partisip aoris ini paling wajar menunjukkan tindakan yang mendahului tindakan utama, sehingga urutannya diterjemahkan secara jelas.
- source_word: ἐπέθηκαν αὐτοῖς τὰς χεῖρας
  choice: menumpangkan tangan atas mereka
  rationale: Ini merupakan ungkapan ritual yang lazim diterjemahkan 'menumpangkan tangan'. Bentuk Indonesia ini mempertahankan tindakan yang dinyatakan teks tanpa menambahkan tafsir mengenai fungsi gerejawinya.
theological_decisions:
- issue: Pelaku doa dan penumpangan tangan
  choice: Mengulang 'para rasul' pada kalimat kedua
  alternative: Membiarkan subjek tersirat sebagai 'mereka'
  rationale: Secara sintaksis, subjek verba jamak dapat dipahami sebagai para rasul yang baru disebut, dan konteks paling dekat mendukung hal itu. Pengulangan nomina menghindari ambiguitas pronominal yang lebih besar dalam bahasa Indonesia.
- issue: Makna penumpangan tangan
  choice: Menggambarkan tindakan secara harfiah tanpa menyebutnya sebagai pentahbisan atau penugasan
  alternative: Menerjemahkan 'mereka menahbiskan mereka' atau 'mereka menugaskan mereka'
  rationale: Bahasa Yunani menyebut tindakan ritualnya, tetapi tidak secara eksplisit mendefinisikan seluruh makna eklesialnya dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dua kalimat digunakan agar pergantian subjek menjadi jelas. Istilah 'menumpangkan tangan' dipertahankan sebagai ungkapan Alkitabiah yang masih mudah dipahami, sementara catatan kaki menjaga agar makna ritualnya tidak dipersempit secara denominatif.
