  text: Στέφανος δὲ πλήρης ⸀χάριτος καὶ δυνάμεως ἐποίει τέρατα καὶ σημεῖα μεγάλα ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/008.yaml
  text: Stephen[a], full of grace and power, was doing great wonders and signs among the people.
translation:
  language: id
  text: Stefanus[a], yang penuh dengan anugerah dan kuasa, terus melakukan keajaiban-keajaiban besar dan tanda-tanda besar di antara orang banyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi “penuh dengan iman dan kuasa”, bukan “penuh dengan anugerah dan kuasa”.
    reason: textual_variant
lexical_decisions:
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini merupakan penghubung ringan yang melanjutkan narasi. Dalam bahasa Indonesia, alur tersebut sudah wajar tanpa kata penghubung eksplisit; menerjemahkannya sebagai "tetapi" akan memberi kesan pertentangan yang terlalu kuat.
- source_word: πλήρης χάριτος καὶ δυνάμεως
  choice: penuh dengan anugerah dan kuasa
  rationale: Ungkapan dengan bentuk genitif menyatakan bahwa Stefanus dicirikan atau dipenuhi oleh kedua hal ini. "Anugerah" mempertahankan gema teologis χάρις, sedangkan "kuasa" sesuai dengan konteks perbuatan ajaib.
- source_word: χάριτος
  choice: anugerah
  rationale: Teks SBLGNT memakai χάριτος, bukan πίστεως. "Anugerah" dapat menunjuk pada kemurahan Allah yang bekerja dalam diri Stefanus; varian "iman" dicatat dalam catatan kaki.
- source_word: δυνάμεως
  choice: kuasa
  rationale: Dalam Kisah Para Rasul, δύναμις kerap menunjuk pada kuasa ilahi yang nyata dalam pelayanan dan mukjizat.
- source_word: ἐποίει
  choice: terus mengadakan
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung atau berulang pada masa lampau. "Terus mengadakan" menyampaikan aspek tersebut secara alami.
- source_word: τέρατα καὶ σημεῖα
  choice: berbagai keajaiban dan tanda
  rationale: 'Pasangan istilah khas Lukas ini dipertahankan: τέρατα menyoroti sifat yang menimbulkan rasa takjub, sedangkan σημεῖα menyoroti fungsi sebagai tanda. Kata "berbagai" membuat rangkaian tindakan berulang terdengar alami tanpa menghapus perbedaan kedua istilah.'
- source_word: μεγάλα
  choice: besar
  rationale: Kata ini menerangkan pasangan "keajaiban dan tanda" dan diterjemahkan secara langsung tanpa mempersempit jenis kebesarannya.
- source_word: ἐν τῷ λαῷ
  choice: di antara orang banyak
  rationale: Frasa ini menunjukkan lingkungan publik tempat tindakan itu terjadi. "Orang banyak" secara alami merujuk kepada masyarakat yang menyaksikan atau mengalami peristiwa tersebut.
theological_decisions:
- issue: Varian teks χάριτος/πίστεως
  choice: anugerah
  alternative: iman
  rationale: Teks utama mengikuti SBLGNT yang membaca χάριτος ("anugerah"). Bacaan πίστεως ("iman") memiliki arti teologis yang nyata dan didukung sebagian naskah, sehingga dipertahankan dalam catatan kaki, bukan dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Nama "Stefanus" mengikuti bentuk Indonesia yang lazim. Susunan kalimat mempertahankan fokus pada keadaan Stefanus dan berlangsungnya karya-karya ajaibnya.
