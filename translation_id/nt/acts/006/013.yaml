  yaml_path: translation/nt/acts/006/013.yaml
  text: They also set up false witnesses who said[c][b][a], “This man does not stop speaking against this holy place and the law,”
translation:
  language: id
  text: Mereka juga mengajukan saksi-saksi palsu yang berkata, “Orang ini tidak henti-hentinya berbicara menentang tempat kudus ini[a] dan hukum Taurat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat kudus itu.” Dalam konteks ini, ungkapan Yunani tersebut secara khusus merujuk kepada Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησάν
  choice: mengajukan
  rationale: Dalam konteks hukum, kata ini menyatakan tindakan menghadirkan atau mengemukakan para saksi; “mengajukan” alami dalam bahasa Indonesia dan mempertahankan nuansa forensik.
- source_word: τε
  choice: juga
  rationale: Menunjukkan bahwa tindakan ini merupakan tambahan dalam rangkaian tindakan sebelumnya.
- source_word: μάρτυρας ψευδεῖς
  choice: saksi-saksi palsu
  rationale: Ungkapan hukum yang lazim untuk orang yang memberikan kesaksian palsu.
- source_word: λέγοντας
  choice: yang berkata
  rationale: Klausa relatif ini alami dalam bahasa Indonesia dan memperkenalkan isi kesaksian mereka dengan jelas.
- source_word: Ὁ ἄνθρωπος οὗτος
  choice: Orang ini
  rationale: Menyampaikan ungkapan langsung yang bernada merendahkan tanpa menambah kekasaran yang tidak pasti dalam bahasa Yunani.
- source_word: οὐ παύεται
  choice: tidak henti-hentinya
  rationale: Mengungkapkan tindakan yang terus berlangsung dan merupakan padanan Indonesia yang alami bagi idiom Yunani tersebut.
- source_word: λαλῶν ῥήματα
  choice: mengucapkan perkataan
  rationale: Mempertahankan objek eksplisit ῥήματα serta nada tuduhan, meskipun ungkapannya sengaja lebih bertanda daripada sekadar “berbicara”.
- source_word: κατὰ
  choice: yang menentang
  rationale: Dalam tuduhan yang bermusuhan ini, κατά dengan genitif menunjukkan perkataan yang diarahkan melawan tempat kudus dan hukum Taurat.
- source_word: τοῦ τόπου τοῦ ἁγίου
  choice: tempat kudus ini
  rationale: Secara harfiah berbentuk definit, tetapi dalam konteks tuduhan di Yerusalem menunjuk secara deiktis kepada tempat suci yang hadir dan dikenal, yaitu Bait Allah.
- source_word: νόμου
  choice: hukum Taurat
  rationale: Dalam konteks Yahudi dan kaitannya dengan Musa, νόμος merujuk pada Taurat; pilihan ini memperjelas referen tanpa mengembangkan tuduhan itu lebih jauh.
theological_decisions:
- issue: Rujukan “tempat kudus” dan “hukum”
  choice: Tuduhan itu menyangkut Bait Allah di Yerusalem dan hukum Taurat.
  alternative: Rujukan umum kepada tempat sakral dan tradisi hukum.
  rationale: Konteks langsung Kisah Para Rasul mengaitkan tuduhan terhadap Stefanus dengan Bait Allah dan Musa. Teks utama mempertahankan ungkapan para penuduh, sedangkan catatan menjelaskan rujukan kontekstual tempat kudus itu.
- issue: Nada tuduhan
  choice: Mempertahankan nada hukum yang bermusuhan tanpa memperkuatnya.
  alternative: Menggunakan istilah interpretatif seperti “menghujat” atau “memfitnah”.
  rationale: Bahasa Yunani menyatakan bahwa Stefanus mengucapkan perkataan yang menentang, bukan secara eksplisit memakai kata yang berarti menghujat atau memfitnah.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat mempertahankan nuansa persidangan dan isi tuduhan palsu. “Mengucapkan perkataan” dipertahankan untuk mewakili λαλῶν ῥήματα secara eksplisit, sedangkan “hukum Taurat” digunakan sebagai padanan kontekstual νόμος yang mudah dipahami pembaca Indonesia.
