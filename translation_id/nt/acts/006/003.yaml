review_pass:
  verdict: revise
  source_fidelity: Perlu revisi kecil. Karena itu menerjemahkan δέ secara terlalu inferensial; dalam ayat ini δέ lebih tepat diberi padanan transisional ringan seperti Tetapi. Rujukan relatif οὓς juga sebaiknya tetap tampak dalam struktur Indonesia. Selebihnya, pemilihan tujuh laki-laki dari komunitas, kualifikasi mereka, dan pengangkatan mereka atas tanggung jawab tersebut telah disampaikan dengan setia.
  naturalness: Teks draf pada umumnya baku dan jelas. Namun, pengubahan kalimat terakhir menjadi klausa relatif menghasilkan hubungan antarklausa yang lebih dekat dengan sumber tanpa membuat bahasa Indonesia tidak alami. Frasa yang dikenal memiliki nama baik menghindari kemungkinan ambiguitas yang dikenal baik, yang dapat berarti sekadar terkenal atau dikenal secara akrab.
  terminology: Saudara-saudara mempertahankan bentuk maskulin ἀδελφοί dan catatannya cukup menjelaskan cakupan yang mungkin lebih luas. Orang laki-laki tepat untuk ἄνδρας. Roh mempertahankan ketidakadaan kata Kudus dalam teks Yunani, dengan alternatif yang tepat dalam catatan. Kesaksian baik/nama baik mencerminkan μαρτυρουμένους tanpa menghilangkan unsur penilaian positif oleh orang lain.
  issues:
  - severity: medium
    issue: Karena itu untuk δέ
    rationale: δέ sendiri terutama menandai transisi atau kontras ringan dan tidak secara leksikal menyatakan kesimpulan. Tetapi lebih dekat dengan bentuk sumber serta dengan jejak audit bahasa Inggris yang memilih But.
  - severity: low
    issue: yang dikenal baik
    rationale: Ungkapan ini dapat dibaca sebagai terkenal atau dikenal secara akrab, bukan secara khusus bereputasi baik berdasarkan kesaksian orang lain. Yang dikenal memiliki nama baik lebih jelas.
  - severity: low
    issue: Mereka akan kami angkat
    rationale: Pemecahan kalimat tidak salah, tetapi mengaburkan sedikit hubungan relatif οὓς dengan tujuh laki-laki yang dipilih. Klausa yang akan kami angkat mempertahankan hubungan itu secara langsung.
