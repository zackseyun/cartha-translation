id: ACT.6.3
reference: Acts 6:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπισκέψασθε ⸀δέ, ἀδελφοί, ἄνδρας ἐξ ὑμῶν μαρτυρουμένους ἑπτὰ πλήρεις ⸀πνεύματος καὶ σοφίας, οὓς ⸀καταστήσομεν ἐπὶ τῆς χρείας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/003.yaml
  text: But brothers[a], select from among yourselves seven men who are well attested, full of the Spirit and wisdom[d][c][b], whom we will appoint over this duty.
translation:
  language: id
  text: Tetapi, Saudara-saudara[a], pilihlah dari antara kalian tujuh orang laki-laki yang dikenal memiliki nama baik[b], penuh dengan Roh dan hikmat[c], yang akan kami angkat untuk menangani tugas ini[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk sapaan Yunani yang dipakai di sini bersifat maskulin; dalam konteks ini sapaan tersebut mungkin mencakup seluruh komunitas orang percaya.
    reason: cultural_note
  - marker: b
    text: 'Atau: “yang memiliki nama baik” atau “yang mendapat kesaksian baik.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “penuh dengan Roh Kudus dan hikmat.” Teks Yunani berbunyi “penuh dengan Roh dan hikmat.”'
    reason: alternative_reading
  - marker: d
    text: “Tugas ini” mengacu pada urusan praktis pembagian bantuan sehari-hari yang disebutkan dalam konteks sekitar.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέψασθε
  choice: pilihlah
  rationale: Imperatif ini meminta jemaat mengenali lalu memilih orang-orang yang memenuhi syarat; 'pilihlah' alami dalam bahasa Indonesia dan menyampaikan tindakan komunal tersebut.
- source_word: δέ
  choice: Karena itu
  rationale: Dalam konteks, partikel ini mengalihkan pembicaraan dari alasan para rasul pada ayat sebelumnya kepada tindakan yang perlu dilakukan jemaat; 'Karena itu' menyampaikan alur inferensial secara wajar.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan maskulin jamak diterjemahkan secara formal dengan 'Saudara-saudara'; sebuah catatan menjelaskan kemungkinan cakupan sapaan terhadap komunitas orang percaya yang lebih luas.
- source_word: ἄνδρας
  choice: orang laki-laki
  rationale: ἀνήρ secara khusus menunjuk laki-laki dewasa, bukan orang secara umum; unsur gender ini dipertahankan.
- source_word: ἐξ ὑμῶν
  choice: dari antara kalian
  rationale: Frasa ini menunjukkan bahwa ketujuh orang tersebut harus dipilih dari dalam komunitas itu sendiri.
- source_word: μαρτυρουμένους
  choice: yang dikenal baik
  rationale: Partisip ini menyatakan bahwa orang lain memberikan kesaksian yang baik tentang mereka. 'Dikenal baik' alami dan mempertahankan gagasan reputasi berdasarkan kesaksian.
- source_word: ἑπτὰ
  choice: tujuh
  rationale: Angka diterjemahkan langsung.
- source_word: πλήρεις πνεύματος καὶ σοφίας
  choice: penuh dengan Roh dan hikmat
  rationale: Dalam konteks Lukas–Kisah Para Rasul, πνεῦμα kemungkinan besar menunjuk kepada Roh Allah. Kata 'kudus' tidak terdapat dalam frasa Yunani ini, sehingga tidak ditambahkan ke teks utama.
- source_word: οὓς καταστήσομεν
  choice: Mereka akan kami angkat
  rationale: Konstruksi ini menyatakan penetapan resmi oleh para rasul. Pemecahan menjadi kalimat baru menghasilkan bahasa Indonesia yang alami tanpa mengubah hubungan rujukannya.
- source_word: ἐπὶ τῆς χρείας ταύτης
  choice: untuk menangani tugas ini
  rationale: χρεία menunjuk pada perkara atau tanggung jawab yang perlu ditangani, yaitu pembagian bantuan sehari-hari dalam konteks dekat.
theological_decisions:
- issue: Apakah πνεύματος menunjuk pada roh secara umum atau secara khusus pada Roh Kudus
  choice: Roh
  alternative: roh; Roh Kudus
  rationale: Pemakaian dalam Lukas–Kisah Para Rasul dan konteks pemberdayaan pelayanan mendukung rujukan kepada Roh Allah. Namun, karena teks Yunani hanya berbunyi πνεύματος tanpa ἁγίου, teks utama memakai 'Roh' dan catatan mempertahankan kemungkinan pengungkapan eksplisit 'Roh Kudus'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan yang bermartabat dan mudah dipahami. 'Kalian' dipakai untuk membedakan orang kedua jamak dari 'kami' yang merujuk kepada para rasul. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
