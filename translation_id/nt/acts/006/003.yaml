  to: Tetapi, Saudara-saudara[a], pilihlah dari antara kalian tujuh orang laki-laki yang dikenal memiliki nama baik[b], penuh dengan Roh dan hikmat[c], yang akan kami angkat untuk menangani tugas ini[d].
