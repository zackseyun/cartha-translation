id: ACT.6.14
reference: Acts 6:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀκηκόαμεν γὰρ αὐτοῦ λέγοντος ὅτι Ἰησοῦς ὁ Ναζωραῖος οὗτος καταλύσει τὸν τόπον τοῦτον καὶ ἀλλάξει τὰ ἔθη ἃ παρέδωκεν ἡμῖν Μωϋσῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/014.yaml
  text: For we heard him saying that this Jesus the Nazarene will destroy this place and will change the customs that Moses handed down to us[a][b][c].
translation:
  language: id
  text: Sebab kami telah mendengar dia berkata bahwa Yesus orang Nazaret ini[a] akan menghancurkan tempat ini[b] dan mengubah adat istiadat yang telah Musa wariskan kepada kami.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yesus ini, orang Nazaret itu.”
    reason: lexical_alternative
  - marker: b
    text: “Tempat ini” merujuk kepada Bait Allah.
    reason: cultural_note
  - marker: c
    text: Atau “tradisi yang Musa sampaikan kepada kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκόαμεν
  choice: kami telah mendengar
  rationale: Bentuk perfektum menyatakan tindakan mendengar yang tetap relevan dalam kesaksian para penuduh; bentuk ini wajar dalam bahasa Indonesia dan mempertahankan nuansa tersebut.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan pernyataan ini dengan tuduhan pada ayat sebelumnya.
- source_word: αὐτοῦ λέγοντος
  choice: dia berkata
  rationale: Sesudah verba mendengar, konstruksi partisipial ini secara alami diungkapkan sebagai klausa objek dalam bahasa Indonesia.
- source_word: Ἰησοῦς ὁ Ναζωραῖος οὗτος
  choice: Yesus, orang Nazaret ini
  rationale: Ungkapan ini mempertahankan identifikasi Ναζωραῖος dengan Nazaret serta penekanan demonstratif οὗτος, yang dalam konteks tuduhan dapat bernada merendahkan.
- source_word: καταλύσει
  choice: akan menghancurkan
  rationale: Dalam kaitannya dengan 'tempat ini', yaitu Bait Allah, verba ini paling wajar berarti meruntuhkan atau menghancurkan.
- source_word: τὸν τόπον τοῦτον
  choice: tempat ini
  rationale: Menerjemahkan ungkapan Yunani secara langsung tanpa mengganti rujukan implisitnya dengan 'Bait Allah' di dalam teks utama.
- source_word: ἀλλάξει
  choice: mengubah
  rationale: Padanan langsung dan alami untuk tindakan mengganti atau mengubah.
- source_word: τὰ ἔθη
  choice: adat istiadat
  rationale: Merujuk pada kebiasaan dan praktik komunal yang diwarisi; 'adat istiadat' jelas dan tidak memberi istilah 'tradisi' muatan teknis yang tidak diperlukan.
- source_word: ἃ παρέδωκεν ἡμῖν Μωϋσῆς
  choice: yang diwariskan Musa kepada kita
  rationale: Menyampaikan gagasan penerusan kebiasaan yang diterima dari generasi terdahulu, dengan Musa sebagai pelaku yang disebut dalam teks.
theological_decisions:
- issue: Rujukan 'tempat ini'
  choice: Mempertahankan 'tempat ini' dalam teks utama.
  alternative: Bait Allah ini; tempat suci ini
  rationale: Bahasa Yunani berbunyi 'tempat ini'. Konteks menunjukkan Bait Allah sebagai rujukannya, tetapi penerjemahan tidak perlu mengubah kata-kata tuduhan menjadi lebih eksplisit.
- issue: Nada tuduhan terhadap Yesus
  choice: Mempertahankan demonstratif dalam 'Yesus, orang Nazaret ini'.
  alternative: Yesus dari Nazaret; Yesus orang Nazaret
  rationale: οὗτος memberi penekanan yang dapat membawa nada merendahkan dalam ucapan para penuduh; unsur retoris ini dipertahankan tanpa menambah penghinaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'kami' dipakai bagi kelompok penuduh yang berbicara kepada pihak lain; 'kita' dipertahankan untuk warisan bersama yang mencakup para pendengar. Susunan kalimat dibuat alami sambil menjaga nada tuduhan dan rujukan implisit teks Yunani.
