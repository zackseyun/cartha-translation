  text: καὶ οὐκ ἴσχυον ἀντιστῆναι τῇ σοφίᾳ καὶ τῷ πνεύματι ᾧ ἐλάλει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/010.yaml
  text: And they were not able to withstand the wisdom and the Spirit by which he was speaking[a].
translation:
  language: id
  text: Dan mereka tidak sanggup melawan hikmat dan Roh[a] yang dengannya Stefanus berbicara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “roh,” jika πνεύματι dipahami sebagai roh Stefanus sendiri dan bukan Roh Kudus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσχυον
  choice: tidak sanggup
  rationale: Bentuk imperfek ἰσχύω dalam konstruksi negatif menyatakan ketidakmampuan yang terus tampak dalam perdebatan; 'tidak sanggup' alami dalam bahasa Indonesia.
- source_word: ἀντιστῆναι
  choice: membantah
  rationale: Dalam konteks perdebatan pada ayat sebelumnya, kata ini berarti melawan atau menghadapi dengan berhasil. 'Membantah' menyampaikan bahwa mereka tidak mampu menjawab perkataan Stefanus secara efektif.
- source_word: τῇ σοφίᾳ
  choice: hikmat
  rationale: Merujuk pada hikmat khusus yang nyata ketika Stefanus berbicara. Bahasa Indonesia tidak memerlukan artikel tersendiri untuk menyatakan kekhususan itu.
- source_word: τῷ πνεύματι
  choice: Roh
  rationale: Konteks Kisah Para Rasul 6, khususnya ayat 5, paling kuat menunjuk kepada Roh Kudus. Huruf kapital menandai keputusan kontekstual ini tanpa menambahkan kata 'Kudus' yang tidak terdapat dalam ayat.
- source_word: ᾧ ἐλάλει
  choice: yang memampukan Stefanus berbicara
  rationale: Datif relatif dapat menyatakan sarana atau kuasa yang dengannya Stefanus berbicara. Ungkapan ini alami dalam bahasa Indonesia, memperjelas subjek tersirat, dan mempertahankan aspek berlangsung tanpa konstruksi yang kaku.
theological_decisions:
- issue: Apakah πνεύματι menunjuk kepada Roh Kudus atau roh Stefanus sendiri
  choice: Roh
  alternative: roh
  rationale: Penyebutan Stefanus sebagai orang yang penuh dengan Roh Kudus dalam konteks dekat dan pasangan 'hikmat dan Roh' mendukung rujukan kepada Roh Kudus. Karena bentuk Yunani sendiri masih memungkinkan rujukan kepada roh Stefanus, alternatif tersebut dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Namun' menghubungkan kontras dengan tindakan perdebatan pada ayat sebelumnya. Nama 'Stefanus' dinyatakan untuk menghindari ambiguitas pronomina dalam bahasa Indonesia.
