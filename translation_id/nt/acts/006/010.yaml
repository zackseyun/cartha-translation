  naturalness: “Dan mereka tidak sanggup melawan hikmat dan Roh yang dengannya Stefanus berbicara” adalah bahasa Indonesia baku dan jelas. “Melawan” mencakup gagasan ἀντιστῆναι, yaitu tidak mampu menghadapi atau menandingi secara berhasil, tanpa membatasi makna menjadi sekadar bantahan lisan.
  terminology: “Hikmat” tepat untuk σοφία; “Roh” dengan kapitalisasi dapat menyampaikan pembacaan kontekstual sebagai Roh Kudus tanpa menambahkan “Kudus” ke dalam teks. Catatan kaki harus mempertahankan alternatif “roh,” bukan menggantinya dengan “semangat” atau memparafrasakan relasi Yunani secara berbeda.
