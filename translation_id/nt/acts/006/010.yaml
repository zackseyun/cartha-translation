  - severity: medium
    issue: “yang memampukan Stefanus berbicara” memperluas fungsi ᾧ ἐλάλει.
    rationale: Ungkapan itu menyatakan bahwa Roh memberi kemampuan, sedangkan bentuk Yunani secara langsung menyatakan Roh sebagai sarana/kuasa yang dengannya Stefanus berbicara.
  - severity: high
    issue: Catatan kaki mengubah alternatif πνεύματι menjadi “semangat” dan mengubah klausa relatif menjadi “yang tampak ketika Stefanus berbicara.”
    rationale: Alternatif yang perlu dipertahankan adalah “roh” Stefanus sendiri; “semangat” dan parafrasa tersebut tidak setia pada ambiguitas leksikal maupun sintaksis teks sumber.
