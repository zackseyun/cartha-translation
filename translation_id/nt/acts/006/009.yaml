id: ACT.6.9
reference: Acts 6:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀνέστησαν δέ τινες τῶν ἐκ τῆς συναγωγῆς τῆς λεγομένης Λιβερτίνων καὶ Κυρηναίων καὶ Ἀλεξανδρέων καὶ τῶν ἀπὸ Κιλικίας καὶ Ἀσίας συζητοῦντες τῷ Στεφάνῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/009.yaml
  text: But some of those from the synagogue called the Synagogue of the Freedmen[a], and of the Cyrenians and Alexandrians, and of those from Cilicia and Asia[b], stood up and began arguing with Stephen.
translation:
  language: id
  text: Namun, beberapa orang dari rumah ibadat yang disebut Rumah Ibadat Orang-orang yang Dimerdekakan, orang-orang dari Kirene dan Aleksandria, serta orang-orang dari Kilikia dan Asia[b], bangkit dan berdebat dengan Stefanus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Asia” di sini adalah provinsi Romawi di bagian barat Asia Kecil, bukan seluruh benua Asia dalam pengertian modern.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστησαν
  choice: bangkit
  rationale: Kata kerja ini secara konkret berarti bangkit atau berdiri; dalam konteks ini tindakan tersebut mengawali perlawanan, tetapi terjemahan tidak perlu menambahkan motif yang tidak dinyatakan.
- source_word: δέ
  choice: Namun
  rationale: Menandai peralihan narasi dengan kontras ringan dari pelayanan Stefanus kepada munculnya perlawanan.
- source_word: τινες τῶν ἐκ τῆς συναγωγῆς
  choice: beberapa orang dari rumah ibadat
  rationale: 'Menjaga nuansa partitif: yang bertindak hanyalah sebagian dari kelompok yang terkait dengan rumah ibadat itu.'
- source_word: συναγωγῆς
  choice: rumah ibadat
  rationale: Istilah Indonesia yang lazim dan mudah dipahami untuk tempat pertemuan serta ibadah komunitas Yahudi.
- source_word: τῆς λεγομένης
  choice: yang disebut
  rationale: Mengungkapkan penamaan yang dikenal tanpa nada meremehkan yang dapat timbul dari bentuk seperti 'yang konon disebut'.
- source_word: Λιβερτίνων
  choice: Orang-Orang Merdeka
  rationale: Merujuk pada libertini, yakni orang yang telah dibebaskan dari perbudakan atau kemungkinan keturunan mereka. Pilihan ini mempertahankan nama kelompok tanpa memakai transliterasi yang mudah disalahpahami.
- source_word: Κυρηναίων καὶ Ἀλεξανδρέων
  choice: orang-orang Kirene dan Aleksandria
  rationale: Kedua bentuk gentilik menunjukkan orang yang berasal dari Kirene dan Aleksandria; penyebutan dengan nama tempat lebih alami dalam bahasa Indonesia.
- source_word: τῶν ἀπὸ Κιλικίας καὶ Ἀσίας
  choice: orang-orang dari Kilikia dan Asia
  rationale: ἀπό bersama nama tempat menyatakan asal. Nama 'Asia' dipertahankan dalam teks dan cakupan historisnya dijelaskan dalam catatan kaki.
- source_word: συζητοῦντες
  choice: berdebat dengan
  rationale: Dalam konteks pertentangan, kata ini menunjuk pada adu pendapat, bukan percakapan netral. Bentuk partisipel bersamaan diterjemahkan secara alami sebagai predikat kedua.
- source_word: τῷ Στεφάνῳ
  choice: dengan Stefanus
  rationale: Dativus setelah συζητέω menyatakan pihak yang diajak berdebat.
theological_decisions:
- issue: Susunan kelompok yang terkait dengan rumah ibadat
  choice: Memakai tanda pisah dan 'termasuk' untuk menyajikan orang Kirene, Aleksandria, Kilikia, dan Asia sebagai kelompok-kelompok yang terkait dengan rumah ibadat yang disebutkan.
  alternative: Memahami teks sebagai dua atau lebih rumah ibadat yang berbeda.
  rationale: Bahasa Yunani secara eksplisit memakai συναγωγῆς dalam bentuk tunggal, tetapi rangkaian genitif dan penghubungnya dapat dipetakan secara sintaksis dengan lebih dari satu cara. Terjemahan mengikuti pembacaan satu rumah ibadat tanpa mengembangkan identitas kelompok secara teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Rumah ibadat' dipilih sebagai padanan yang umum bagi συναγωγή. Tanda pisah membantu pembaca mengikuti daftar kelompok yang panjang tanpa mengubah isi pokok ayat.
