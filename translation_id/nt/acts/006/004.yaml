  text: ἡμεῖς δὲ τῇ προσευχῇ καὶ τῇ διακονίᾳ τοῦ λόγου προσκαρτερήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/004.yaml
  text: But we will devote ourselves to prayer and to the ministry of the word[a].
translation:
  language: id
  text: Namun, kami akan mengabdikan diri pada doa dan pelayanan firman[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melayani firman.” Kata Yunani yang dipakai dapat menunjuk pada pelayanan maupun tindakan melayani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: kami
  rationale: Pronomina orang pertama jamak ini dinyatakan secara eksplisit untuk memberi penekanan dan kontras. Dalam konteks, “kami” merujuk kepada para rasul dan membedakan mereka dari jemaat yang diajak memilih tujuh orang.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai kontras dengan tugas pelayanan meja yang akan dipercayakan kepada orang lain pada ayat sebelumnya. “Namun” menyampaikan daya adversatif itu secara wajar dalam bahasa Indonesia.
- source_word: τῇ προσευχῇ
  choice: pada doa
  rationale: Bentuk datif bersama προσκαρτερέω menunjukkan hal yang menjadi pusat ketekunan atau pengabdian. “Mengabdikan diri pada doa” merupakan ungkapan Indonesia yang alami.
- source_word: διακονίᾳ
  choice: pelayanan
  rationale: Kata ini dapat berarti pelayanan atau tindakan melayani. “Pelayanan” sesuai untuk tugas penyampaian firman, tanpa mengesankan jabatan khusus yang tidak dinyatakan oleh teks.
- source_word: τοῦ λόγου
  choice: firman
  rationale: Dalam konteks Kisah Para Rasul, λόγος menunjuk pada berita atau firman Allah yang diberitakan. “Firman” mempertahankan ungkapan Kristen awal yang sudah dipahami luas, sedangkan makna ‘berita’ tetap tersirat oleh konteks.
- source_word: προσκαρτερήσομεν
  choice: akan mengabdikan diri
  rationale: Bentuk futur aktif ini menyatakan ketekunan dan komitmen yang berkelanjutan. “Akan mengabdikan diri” alami dalam bahasa Indonesia dan menangkap unsur keteguhan tersebut.
theological_decisions:
- issue: Makna διακονία dalam kontras dengan pelayanan meja pada konteks langsung
  choice: pelayanan firman
  alternative: melayani firman
  rationale: “Pelayanan firman” membedakan tugas para rasul dari pelayanan meja tanpa membentuk pemisahan kaku antara rohaniwan dan awam. Catatan kaki mempertahankan alternatif leksikal yang menonjolkan tindakan melayani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. “Namun” menjaga kontras; “kami” mempertahankan penekanan pronomina Yunani; dan susunan kalimat dibuat ringkas agar mudah dipahami pembaca umum.
