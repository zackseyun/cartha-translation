  text: καὶ ἀτενίσαντες εἰς αὐτὸν ⸀πάντες οἱ καθεζόμενοι ἐν τῷ συνεδρίῳ εἶδον τὸ πρόσωπον αὐτοῦ ὡσεὶ πρόσωπον ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/015.yaml
  text: And all who were sitting in the council[a], fixing their eyes on him, saw his face like the face of an angel.
translation:
  language: id
  text: Semua orang yang duduk dalam dewan itu[a] menatap Stefanus dengan saksama dan melihat wajahnya seperti wajah malaikat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sanhedrin.” Kata Yunani ini menunjuk kepada dewan penguasa Yahudi.
    reason: cultural_note
lexical_decisions:
- source_word: ἀτενίσαντες
  choice: menatap ... dengan saksama
  rationale: Partisip ini menyatakan pandangan yang terarah dan sungguh-sungguh, bukan sekadar melihat sepintas; ungkapan ini alami dalam narasi Indonesia.
- source_word: πάντες οἱ καθεζόμενοι
  choice: semua orang yang duduk
  rationale: Mempertahankan cakupan πάντες dan gambaran bahwa para anggota sedang duduk dalam sidang.
- source_word: συνεδρίῳ
  choice: sidang itu
  rationale: Dalam konteks ini συνέδριον dapat menunjuk kepada dewan penguasa Yahudi sekaligus persidangannya. 'Sidang itu' alami dalam bahasa Indonesia dan catatan kaki mempertahankan alternatif nama historisnya.
- source_word: πρόσωπον
  choice: wajah
  rationale: Πρόσωπον secara langsung menunjuk pada wajah Stefanus yang terlihat.
- source_word: ὡσεὶ
  choice: seperti
  rationale: Menjaga bentuk perbandingan tanpa menjelaskan sifat kemiripan secara berlebihan.
- source_word: ἀγγέλου
  choice: malaikat
  rationale: Dalam konteks narasi ini, ἄγγελος paling wajar dipahami sebagai makhluk surgawi, bukan sekadar utusan manusia.
- source_word: αὐτόν / αὐτοῦ
  choice: Stefanus / -nya
  rationale: Penyebutan nama Stefanus memperjelas rujukan pronomina Yunani dalam bahasa Indonesia setelah batas perikop, sedangkan bentuk posesif tetap alami pada kalimat berikutnya.
theological_decisions:
- issue: Sifat kemiripan dalam frasa 'seperti wajah malaikat'
  choice: Mempertahankan simile tanpa menentukan sifat kemiripannya.
  alternative: Menjelaskannya secara khusus sebagai wajah yang bercahaya, tenang, tidak bersalah, atau berwibawa surgawi.
  rationale: Teks Yunani hanya menyatakan kemiripan dan tidak menentukan apakah yang dimaksud ialah cahaya, ketenangan, kemuliaan, kewibawaan, atau gabungan beberapa hal itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi dua agar alami dan mudah dipahami tanpa mengubah hubungan tindakan. Nama Stefanus dipakai untuk memperjelas pronomina dalam ayat yang dapat dibaca secara mandiri.
