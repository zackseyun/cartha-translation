  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: συνεκίνησάν τε τὸν λαὸν καὶ τοὺς πρεσβυτέρους καὶ τοὺς γραμματεῖς, καὶ ἐπιστάντες συνήρπασαν αὐτὸν καὶ ἤγαγον εἰς τὸ συνέδριον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/012.yaml
  text: So they stirred up the people and the elders and the scribes[a], and coming upon him, they seized him and brought him before the Sanhedrin,
translation:
  language: id
  text: Lalu mereka menghasut rakyat, para tua-tua, dan para ahli Taurat. Mereka mendatangi Stefanus secara tiba-tiba, menangkapnya, lalu membawanya ke hadapan Mahkamah Agama[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dewan” atau “Sanhedrin.” Kata Yunani συνέδριον dapat menunjuk kepada sebuah dewan; di sini tampaknya yang dimaksud adalah dewan penguasa Yahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκίνησάν
  choice: menghasut
  rationale: Dalam konteks permusuhan yang sengaja dibangkitkan, kata ini menyatakan tindakan menggerakkan atau mengobarkan orang-orang untuk menentang Stefanus. “Menghasut” alami dalam bahasa Indonesia dan mempertahankan daya kausatifnya.
- source_word: τε
  choice: Lalu
  rationale: Partikel ini merupakan penghubung ringan dalam alur narasi. “Lalu” menyampaikan kelanjutan tindakan secara alami tanpa memberinya tekanan berlebihan.
- source_word: τὸν λαὸν
  choice: rakyat
  rationale: λαός di sini menunjuk kepada khalayak atau masyarakat umum, dibedakan dari para tua-tua dan ahli Taurat. “Rakyat” ringkas dan sesuai dengan konteks publik.
- source_word: τοὺς πρεσβυτέρους
  choice: para tua-tua
  rationale: Istilah ini menunjuk kepada para pemimpin yang diakui dalam masyarakat Yahudi, bukan sekadar laki-laki lanjut usia. “Para tua-tua” mempertahankan istilah historis yang lazim dalam terjemahan Alkitab Indonesia.
- source_word: τοὺς γραμματεῖς
  choice: para ahli Taurat
  rationale: Dalam konteks Yahudi abad pertama, γραμματεῖς adalah ahli Kitab Suci dan hukum Taurat. “Ahli Taurat” lebih langsung dipahami pembaca Indonesia daripada terjemahan harfiah “juru tulis”.
- source_word: ἐπιστάντες
  choice: mendatangi Stefanus secara tiba-tiba
  rationale: Partisip ini menyiratkan bahwa mereka datang atau menyerbu secara mendadak. Frasa tersebut menjaga unsur ketiba-tibaan tanpa menambahkan kekerasan yang baru dinyatakan oleh verba berikutnya. Nama Stefanus dipakai untuk menjernihkan rujukan pronomina dalam bahasa Indonesia.
- source_word: συνήρπασαν αὐτὸν
  choice: menangkapnya
  rationale: συναρπάζω menyatakan tindakan memegang atau merenggut seseorang dengan paksa. “Menangkapnya” alami dan cukup kuat dalam konteks penahanan bermusuhan.
- source_word: ἤγαγον
  choice: membawanya
  rationale: ἄγω adalah verba luas yang berarti membawa atau menggiring. Karena pemaksaan sudah jelas dari tindakan menangkap, “membawanya” menghasilkan urutan yang alami.
- source_word: εἰς τὸ συνέδριον
  choice: ke hadapan Mahkamah Agama
  rationale: Dalam konteks Yerusalem ini, συνέδριον menunjuk kepada dewan penguasa Yahudi. “Ke hadapan” menyampaikan bahwa Stefanus dihadapkan kepada lembaga tersebut, sedangkan “Mahkamah Agama” adalah sebutan historis yang lazim dan mudah dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Identitas συνέδριον
  choice: Mahkamah Agama
  alternative: dewan; Sanhedrin
  rationale: Konteks para tua-tua dan ahli Taurat di Yerusalem menunjukkan dewan penguasa Yahudi. Pilihan ini mempertahankan kekhususan historis tanpa menjadikan istilah asing sebagai satu-satunya keterangan; catatan kaki menyediakan alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar jelas dan alami. Istilah historis “para tua-tua,” “ahli Taurat,” dan “Mahkamah Agama” dipertahankan karena dikenal luas dalam konteks Alkitab Indonesia.
