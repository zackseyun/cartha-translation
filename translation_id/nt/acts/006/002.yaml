  text: προσκαλεσάμενοι δὲ οἱ δώδεκα τὸ πλῆθος τῶν μαθητῶν εἶπαν· Οὐκ ἀρεστόν ἐστιν ἡμᾶς καταλείψαντας τὸν λόγον τοῦ θεοῦ διακονεῖν τραπέζαις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/002.yaml
  text: So the Twelve called together the whole group of the disciples and said[c][b][a], “It is not right for us to abandon the word of God to serve tables.”
translation:
  language: id
  text: Maka Kedua Belas memanggil seluruh kumpulan murid[a] dan berkata, “Tidak sepatutnya kami meninggalkan firman Allah untuk mengurus meja-meja[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segenap murid” atau “kumpulan besar para murid.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, menangani pembagian praktis yang berkaitan dengan makanan dan sumber daya jemaat.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: memanggil
  rationale: Partisip aoris ini menyatakan tindakan menghimpun para murid sebelum kedua belas rasul berbicara; “memanggil” alami dalam bahasa Indonesia dan sesuai dengan konteks pertemuan bersama.
- source_word: δὲ
  choice: Maka
  rationale: Di sini δέ mengembangkan alur cerita sebagai tanggapan terhadap persoalan pada ayat sebelumnya, bukan menyatakan pertentangan yang kuat.
- source_word: οἱ δώδεκα
  choice: kedua belas rasul
  rationale: Ungkapan ini merupakan sebutan tetap bagi kelompok apostolik. Penambahan “rasul” membuat acuannya jelas dan alami bagi pembaca Indonesia tanpa mengubah identitas kelompok yang dimaksud.
- source_word: τὸ πλῆθος τῶν μαθητῶν
  choice: seluruh kumpulan murid
  rationale: πλῆθος menunjuk pada kumpulan besar atau keseluruhan sidang; pilihan ini mempertahankan daya kolektifnya dalam bahasa Indonesia modern.
- source_word: Οὐκ ἀρεστόν ἐστιν
  choice: Tidak sepatutnya
  rationale: ἀρεστόν dapat berarti berkenan, dapat diterima, atau patut. Dalam konteks pembagian tanggung jawab, “tidak sepatutnya” menyampaikan persoalan kepantasan tanpa menyiratkan bahwa pelayanan praktis tidak bernilai.
- source_word: ἡμᾶς καταλείψαντας
  choice: kami meninggalkan
  rationale: καταλείπω berarti meninggalkan atau membiarkan terbengkalai. “Meninggalkan” cukup langsung dan mempertahankan ketegangan pernyataan Yunani tanpa menambahkan gagasan penelantaran yang tidak eksplisit.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: firman Allah
  rationale: Ini adalah padanan Indonesia yang mapan dan tetap mempertahankan cakupan λόγος sebagai firman atau berita yang diberitakan.
- source_word: διακονεῖν
  choice: melayani
  rationale: Kata kerja ini menunjuk pada pelayanan praktis; “melayani” merupakan padanan umum yang tidak memasukkan jabatan gerejawi tertentu.
- source_word: τραπέζαις
  choice: meja-meja
  rationale: Bentuk jamak Yunani diterjemahkan secara transparan. Konteks mengarah pada pengurusan pembagian makanan dan sumber daya, tetapi teks hanya menyebut “meja-meja,” sehingga penjelasan diberikan dalam catatan kaki.
theological_decisions:
- issue: Prioritas tugas para rasul dibandingkan pelayanan praktis
  choice: 'Menerjemahkan sebagai persoalan kepantasan pembagian tanggung jawab: “Tidak sepatutnya kami meninggalkan firman Allah untuk melayani meja-meja.”'
  alternative: “Tidak berkenan bagi kami ...” atau terjemahan yang dapat terdengar merendahkan pelayanan meja.
  rationale: Pernyataan ini membedakan tanggung jawab, bukan martabat rohani. Terjemahan mempertahankan prioritas pelayanan firman bagi para rasul tanpa menyatakan bahwa pelayanan praktis lebih rendah nilainya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Tidak sepatutnya” terdengar alami sekaligus mempertahankan nuansa kepantasan; “meja-meja” sengaja dipertahankan secara harfiah dan dijelaskan melalui catatan kaki.
