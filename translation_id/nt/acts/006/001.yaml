id: ACT.6.1
reference: Acts 6:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ταύταις πληθυνόντων τῶν μαθητῶν ἐγένετο γογγυσμὸς τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους ὅτι παρεθεωροῦντο ἐν τῇ διακονίᾳ τῇ καθημερινῇ αἱ χῆραι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/001.yaml
  text: In those days[a], as the disciples were increasing in number, a complaint arose from the Hellenists against the Hebrews[b], because their widows were being overlooked in the daily distribution.
translation:
  language: id
  text: Pada masa itu, ketika jumlah murid makin bertambah, timbullah keluhan dari kaum Helenis terhadap kaum Ibrani[a], karena para janda mereka terabaikan dalam pembagian sehari-hari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kaum Helenis kemungkinan adalah orang Yahudi berbahasa Yunani, sedangkan kaum Ibrani kemungkinan adalah orang Yahudi berbahasa Aram atau Ibrani.
    reason: cultural_note
  - marker: b
    text: Atau “dalam pelayanan sehari-hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ταύταις
  choice: Pada masa itu
  rationale: Mengungkapkan latar waktu sekaligus peralihan naratif ringan dari δέ secara wajar dalam bahasa Indonesia, tanpa menambahkan penanda waktu yang tidak ada dalam sumber.
- source_word: πληθυνόντων τῶν μαθητῶν
  choice: ketika jumlah murid makin bertambah
  rationale: Menyampaikan keadaan latar dari konstruksi genitif absolut dan pertumbuhan jumlah murid dalam ungkapan Indonesia yang alami.
- source_word: ἐγένετο γογγυσμός
  choice: timbullah keluhan
  rationale: Menggambarkan munculnya ketidakpuasan yang dinyatakan sebagai keluhan; pilihan ini alami dan tidak melebih-lebihkan nuansa menjadi pemberontakan.
- source_word: τῶν Ἑλληνιστῶν
  choice: kaum Helenis
  rationale: Mempertahankan sebutan kelompok historis dalam teks utama tanpa langsung menyempitkannya menjadi definisi linguistik tertentu; penjelasan diberikan dalam catatan kaki.
- source_word: πρὸς τοὺς Ἑβραίους
  choice: terhadap kaum Ibrani
  rationale: πρός menandai sasaran keluhan. 'Terhadap' menyampaikan ketegangan antarkelompok tanpa terdengar lebih bermusuhan daripada sumber.
- source_word: παρεθεωροῦντο
  choice: terabaikan
  rationale: Bentuk imperfek pasif menunjukkan keadaan yang berlangsung. 'Terabaikan' mempertahankan kemungkinan bahwa mereka luput dari perhatian tanpa memastikan adanya kesengajaan.
- source_word: ἐν τῇ διακονίᾳ τῇ καθημερινῇ
  choice: dalam pembagian sehari-hari
  rationale: Konteks para janda dan pelayanan meja pada ayat-ayat berikutnya mendukung pembagian kebutuhan sebagai wujud konkret διακονία, sementara catatan kaki mempertahankan cakupan leksikal yang lebih luas.
- source_word: αἱ χῆραι αὐτῶν
  choice: para janda mereka
  rationale: Mempertahankan bentuk posesif sumber; dalam konteks, 'mereka' paling wajar merujuk kepada kaum Helenis.
theological_decisions:
- issue: Identitas kelompok Ἑλληνισταί dan Ἑβραῖοι
  choice: Mempertahankan sebutan 'kaum Helenis' dan 'kaum Ibrani' dalam teks utama, dengan penjelasan dalam catatan kaki.
  alternative: Menerjemahkannya langsung sebagai 'orang Yahudi berbahasa Yunani' dan 'orang Yahudi berbahasa Aram atau Ibrani'.
  rationale: Sebutan sumber memiliki kekhususan historis dan mungkin mencakup lebih dari sekadar bahasa. Mempertahankan labelnya menghindari penyempitan tafsiran, sedangkan catatan kaki memberikan penjelasan yang paling mungkin.
- issue: Cakupan makna διακονία
  choice: Menggunakan 'pembagian' sesuai konteks bantuan material kepada para janda.
  alternative: pelayanan atau pelayanan sehari-hari
  rationale: Konteks langsung mendukung kegiatan pembagian kebutuhan, tetapi istilah Yunani tetap lebih luas; karena itu alternatif yang lebih umum dicatat agar nuansa sumber tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Istilah historis 'Helenis' dan 'Ibrani' dipertahankan, sedangkan konstruksi kalimat dibuat alami bagi pembaca umum.
