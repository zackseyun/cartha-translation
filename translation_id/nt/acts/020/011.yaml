  naturalness: Teks revisi tetap memakai Bahasa Indonesia baku modern dan alur naratif yang alami. “Naik ke atas” menyampaikan arah ἀναβὰς tanpa mengharuskan penambahan “kembali” atau “ruang atas,” sedangkan “lalu ia berangkat” wajar untuk penutupan adegan.
