id: ACT.20.11
reference: Acts 20:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀναβὰς δὲ καὶ κλάσας ⸀τὸν ἄρτον καὶ γευσάμενος ἐφ’ ἱκανόν τε ὁμιλήσας ἄχρι αὐγῆς, οὕτως ἐξῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/011.yaml
  text: Then he went upstairs[a], broke the bread, and ate; and after talking for a long time, until dawn[b], he departed.
translation:
  language: id
  text: Kemudian Paulus naik ke atas, memecahkan roti[a], dan makan[b]. Setelah bercakap-cakap cukup lama hingga fajar, lalu ia berangkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani ini dapat merujuk pada makan bersama; sebagian orang memahaminya di sini sebagai tindakan yang juga mencakup Perjamuan Tuhan.
    reason: alternative_reading
  - marker: b
    text: Atau “mencicipi” atau “mengambil bagian dalam makanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβὰς
  choice: naik
  rationale: Partisip aoris dari ἀναβαίνω menyatakan gerak naik; konteks menunjukkan Paulus kembali ke ruang atas. Bahasa Indonesia cukup alami dengan 'naik' tanpa menambahkan keterangan yang tidak tersurat.
- source_word: κλάσας τὸν ἄρτον
  choice: memecah-mecahkan roti
  rationale: Mengungkapkan tindakan konkret memecahkan roti dan tetap netral mengenai apakah ini perjamuan biasa atau Perjamuan Tuhan.
- source_word: γευσάμενος
  choice: lalu makan
  rationale: Dalam konteks perjamuan, γεύομαι dapat berarti mengambil bagian dalam makanan, bukan sekadar mencicipi sedikit. 'Makan' merupakan padanan Indonesia yang alami.
- source_word: ἐφ’ ἱκανόν
  choice: cukup lama
  rationale: Idiom ini menunjukkan jangka waktu yang cukup panjang; 'cukup lama' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: ὁμιλήσας
  choice: setelah bercakap-cakap
  rationale: ὁμιλέω menunjukkan percakapan atau pembicaraan yang berlangsung; bentuk ini mempertahankan nuansa interaksi, bukan semata-mata pidato satu arah.
- source_word: ἄχρι αὐγῆς
  choice: sampai fajar
  rationale: αὐγή berarti fajar atau saat hari mulai terang.
- source_word: οὕτως ἐξῆλθεν
  choice: ia pun berangkat
  rationale: '''Pun'' menandai hasil atau tahap penutup rangkaian tersebut secara alami, sedangkan ''berangkat'' menyampaikan ἐξῆλθεν tanpa ungkapan Indonesia yang kaku.'
theological_decisions:
- issue: Apakah κλάσας τὸν ἄρτον secara khusus menunjuk kepada Perjamuan Tuhan
  choice: Diterjemahkan secara netral sebagai 'memecah-mecahkan roti'.
  alternative: Ungkapan ini dapat dipahami sebagai makan bersama biasa atau sebagai tindakan yang mencakup Perjamuan Tuhan.
  rationale: Teks Yunani tidak secara tegas menentukan salah satu tafsiran. Terjemahan mempertahankan ambiguitas dan tidak memasukkan penetapan sakramental ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Nama 'Paulus' dipakai untuk memperjelas subjek yang tersirat dalam verba Yunani. Penanda catatan kaki ditempatkan langsung dalam teks utama.
