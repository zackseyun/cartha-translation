  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διαμαρτυρόμενος Ἰουδαίοις τε καὶ Ἕλλησιν τὴν ⸀εἰς θεὸν μετάνοιαν καὶ ⸀πίστιν εἰς τὸν κύριον ἡμῶν ⸀Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/021.yaml
  text: solemnly testifying to both Jews and Greeks about repentance toward God and faith in our Lord Jesus[a].
translation:
  language: id
  text: Dengan sungguh-sungguh aku bersaksi kepada orang Yahudi maupun orang Yunani tentang pertobatan kepada Allah dan iman kepada Tuhan kita Yesus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “percaya kepada Tuhan kita Yesus.”
    reason: Alternatif leksikal untuk πίστις yang menonjolkan unsur kepercayaan pribadi tanpa mengubah Yesus sebagai sasarannya.
lexical_decisions:
- source_word: διαμαρτυρόμενος
  choice: dengan sungguh-sungguh aku bersaksi
  rationale: Partisip ini menerangkan pelayanan Paulus dalam konteks kalimat sebelumnya dan menyatakan kesaksian yang tegas serta penuh kesungguhan. Bentuk orang pertama dibuat eksplisit agar alami dalam bahasa Indonesia.
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: kepada orang Yahudi maupun orang Yunani
  rationale: Pasangan τε καὶ mencakup kedua kelompok. 'Orang Yunani' mempertahankan istilah Lukas dan tidak memperluasnya secara diam-diam menjadi semua bangsa bukan Yahudi.
- source_word: μετάνοιαν
  choice: pertobatan
  rationale: Istilah ini menunjuk pada perubahan hati dan arah hidup, bukan sekadar perubahan pikiran. 'Pertobatan' merupakan padanan Indonesia yang alami dan berbobot tepat.
- source_word: εἰς θεόν
  choice: kepada Allah
  rationale: εἰς menunjukkan arah atau orientasi pertobatan, yakni kepada Allah. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan hubungan langsung dengan μετάνοιαν.
- source_word: πίστιν
  choice: iman
  rationale: Dalam konstruksi ini Yesus disebut jelas sebagai sasaran iman. 'Iman' mempertahankan istilah utama Perjanjian Baru, sedangkan nuansa 'percaya' dicatat sebagai alternatif.
- source_word: εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  choice: kepada Tuhan kita Yesus
  rationale: Dengan πίστις, εἰς menyatakan arah atau sasaran iman. 'Iman kepada' adalah ungkapan Indonesia yang wajar; κύριος dipertahankan sebagai gelar 'Tuhan'.
theological_decisions:
- issue: Arti πίστις dalam ungkapan yang menyebut Yesus sebagai sasarannya
  choice: iman kepada Tuhan kita Yesus
  alternative: percaya kepada Tuhan kita Yesus
  rationale: Teks Yunani secara eksplisit menempatkan Yesus sebagai sasaran πίστις, sehingga ini bukan konstruksi genitif yang dapat berarti iman atau kesetiaan Kristus. 'Iman' dipakai dalam teks utama, sementara padanan relasional 'percaya' dipertahankan dalam catatan kaki.
- issue: Hubungan pertobatan dan iman
  choice: mempertahankan keduanya sebagai dua unsur yang dihubungkan dengan 'dan'
  alternative: menafsirkan salah satunya sebagai penjelasan bagi yang lain
  rationale: καί menghubungkan pertobatan kepada Allah dan iman kepada Tuhan Yesus tanpa menjelaskan lebih lanjut hubungan sistematis keduanya; terjemahan tidak boleh menyelesaikan ketegangan teologis tersebut secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Karena ayat ini secara sintaksis melanjutkan ucapan Paulus dari ayat sebelumnya, subjek orang pertama dibuat eksplisit. Penanda catatan kaki [a] ditempatkan langsung setelah 'Yesus'.
