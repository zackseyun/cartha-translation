  text: κἀκεῖθεν ἀποπλεύσαντες τῇ ἐπιούσῃ κατηντήσαμεν ⸀ἄντικρυς Χίου, τῇ δὲ ἑτέρᾳ παρεβάλομεν εἰς ⸀Σάμον, τῇ ⸀δὲ ἐχομένῃ ἤλθομεν εἰς Μίλητον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/015.yaml
  text: And from there[a], after setting sail, on the next day we came opposite Chios; on the following day we touched at Samos[b]; and on the day after that we came to Miletus.
translation:
  language: id
  text: Dari sana kami berlayar, dan keesokan harinya kami tiba berhadapan dengan Khios[a]. Hari berikutnya kami singgah di Samos[b], dan sehari sesudahnya kami tiba di Miletus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di seberang Khios” atau “di lepas pantai Khios.” Kata Yunaninya menunjukkan posisi berhadapan dengan pulau itu, bukan bahwa mereka pasti mendarat di sana.
    reason: lexical_alternative
  - marker: b
    text: Atau “kami merapat di Samos.” Kata kerjanya merupakan istilah pelayaran yang dapat berarti merapatkan kapal atau singgah di suatu tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν ἀποπλεύσαντες
  choice: Dari sana kami berlayar
  rationale: Crasis κἀκεῖθεν menyatakan kesinambungan dan titik keberangkatan, sedangkan partisip aoris ἀποπλεύσαντες menyatakan tindakan berlayar yang mendahului verba utama. Susunan Indonesia ini alami dan tetap mempertahankan urutan perjalanan.
- source_word: τῇ ἐπιούσῃ
  choice: keesokan harinya
  rationale: Ungkapan datif temporal ini berarti hari berikut sesudah keberangkatan; 'keesokan harinya' merupakan padanan Indonesia yang alami.
- source_word: κατηντήσαμεν ἄντικρυς Χίου
  choice: kami sampai di perairan seberang Khios
  rationale: καταντάω dalam kisah perjalanan berarti mencapai atau sampai, sedangkan ἄντικρυς menunjukkan posisi berhadapan dengan Khios, bukan bahwa mereka mendarat di pulau itu. Penambahan 'di perairan' memperjelas konteks pelayaran tanpa menyatakan pendaratan.
- source_word: τῇ δὲ ἑτέρᾳ
  choice: Hari berikutnya
  rationale: Ungkapan idiomatis ini melanjutkan urutan hari perjalanan.
- source_word: παρεβάλομεν εἰς Σάμον
  choice: kami singgah di Samos
  rationale: Dalam konteks kelautan, παραβάλλω dapat berarti membawa kapal mendekat atau berhenti di suatu tempat. 'Singgah' jelas dan wajar dalam bahasa Indonesia.
- source_word: τῇ δὲ ἐχομένῃ
  choice: sehari sesudahnya
  rationale: Ungkapan ini menunjuk hari selanjutnya dalam rangkaian dan dibedakan secara alami dari penanda hari sebelumnya.
- source_word: ἤλθομεν εἰς Μίλητον
  choice: kami tiba di Miletus
  rationale: Verba gerak dengan εἰς menyatakan kedatangan ke tujuan; 'tiba di' alami bagi tahap akhir rute ini.
- source_word: Χίου / Σάμον / Μίλητον
  choice: Khios / Samos / Miletus
  rationale: Nama-nama tempat ditransliterasikan menurut bentuk yang jelas dan lazim dalam bahasa Indonesia; Khios mempertahankan bunyi konsonan awal Yunani χ lebih transparan daripada ejaan Inggris.
