  register: Bahasa Indonesia baku modern dengan gaya naratif perjalanan yang ringkas dan bermartabat. Penanda waktu dibuat bervariasi secara alami sambil mempertahankan urutan tiga hari. Istilah pelayaran dijelaskan secukupnya tanpa menambahkan pendaratan yang tidak dinyatakan teks Yunani.
