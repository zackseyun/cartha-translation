  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ ⸂δεδεμένος ἐγὼ⸃ τῷ πνεύματι πορεύομαι εἰς Ἰερουσαλήμ, τὰ ἐν αὐτῇ συναντήσοντά ⸀μοι μὴ εἰδώς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/022.yaml
  text: And now, behold, bound in the Spirit, I am going to Jerusalem, not knowing what will happen to me there,
translation:
  language: id
  text: Dan sekarang, lihatlah, aku pergi ke Yerusalem, terikat dalam roh[a], tanpa mengetahui apa yang akan terjadi padaku di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terikat oleh Roh” atau “didorong oleh Roh.” Frasa Yunani ini dapat menunjuk pada roh Paulus sendiri atau pada Roh Kudus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan fungsi penanda wacana yang menegaskan peralihan perkataan Paulus, dengan bentuk yang tetap wajar dan khidmat dalam bahasa Indonesia.
- source_word: δεδεμένος
  choice: terikat
  rationale: Mempertahankan metafora harfiah dari bentuk perfect passive participle δέω dan tidak langsung menafsirkannya sebagai sekadar 'didorong' atau 'dipaksa'.
- source_word: τῷ πνεύματι
  choice: dengan roh
  rationale: Ungkapan ini sengaja tidak memakai huruf kapital agar teks utama mempertahankan ambiguitas antara roh Paulus dan Roh Kudus; konstruksi 'dengan roh yang terikat' juga mempertahankan kemungkinan hubungan datif dengan keadaan terikat.
- source_word: πορεύομαι
  choice: aku pergi
  rationale: Padanan alami untuk tindakan yang sedang atau segera dijalani Paulus.
- source_word: τὰ ἐν αὐτῇ συναντήσοντά μοι
  choice: apa yang akan terjadi padaku di sana
  rationale: Mengungkapkan secara idiomatis gambaran Yunani harfiah tentang hal-hal di Yerusalem yang akan 'menemui' Paulus.
- source_word: μὴ εἰδώς
  choice: tanpa mengetahui
  rationale: Menyampaikan keterangan partisipial secara alami dan langsung.
- source_word: Ἰερουσαλήμ
  choice: Yerusalem
  rationale: Bentuk baku nama tempat tersebut dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan τῷ πνεύματι
  choice: Teks utama memakai 'dengan roh yang terikat' tanpa kapitalisasi untuk menjaga ambiguitas.
  alternative: Ungkapan itu dapat berarti 'terikat oleh Roh' atau 'didorong oleh Roh', dengan Roh Kudus sebagai pelaku.
  rationale: Konteks Kisah Para Rasul mendukung kemungkinan rujukan kepada Roh Kudus, khususnya kesaksian Roh pada ayat berikutnya, tetapi tata bahasa frasa ini tidak menutup kemungkinan bahwa yang dimaksud ialah roh Paulus sendiri. Ambiguitas asli dipertahankan dan dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Lihatlah' mempertahankan penekanan ἰδοὺ, sedangkan susunan 'dengan roh yang terikat' dipilih untuk menjaga ketegangan penafsiran sumber tanpa membebani teks utama.
