id: ACT.20.24
reference: Acts 20:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδενὸς ⸀λόγου ⸀ποιοῦμαι τὴν ⸀ψυχὴν τιμίαν ἐμαυτῷ ὡς ⸀τελειῶσαι τὸν δρόμον ⸀μου καὶ τὴν διακονίαν ἣν ἔλαβον παρὰ τοῦ κυρίου Ἰησοῦ, διαμαρτύρασθαι τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/024.yaml
  text: 'But I do not count my life as of any value to myself[c][b][a], if only I may finish my course and the ministry that I received from the Lord Jesus: to testify to the gospel of the grace of God.'
translation:
  language: id
  text: Namun, aku sama sekali tidak menganggap hidupku berharga bagi diriku sendiri[a], asalkan aku dapat menyelesaikan perlombaanku[b] dan pelayanan yang kuterima dari Tuhan Yesus, yaitu bersaksi[c] tentang Injil anugerah Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “jiwaku berharga bagi diriku sendiri.” Di sini “hidupku” dipilih karena Paulus sedang berbicara tentang kesediaannya menghadapi kematian demi menyelesaikan tugasnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “lintasanku.” Kata Yunani yang digunakan dapat menggambarkan lintasan atau perlombaan yang harus diselesaikan.
    reason: lexical_alternative
  - marker: c
    text: Atau “memberikan kesaksian dengan sungguh-sungguh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδενὸς λόγου ποιοῦμαι ... τιμίαν ἐμαυτῷ
  choice: aku sama sekali tidak menganggap ... berharga bagi diriku sendiri
  rationale: Ungkapan ini menyatakan penilaian pribadi Paulus terhadap hidupnya. Susunan Indonesia ini alami, mempertahankan penyangkalan yang kuat, dan tidak menyiratkan bahwa hidup pada dirinya tidak bernilai.
- source_word: ψυχήν
  choice: hidupku
  rationale: Dalam konteks ancaman penderitaan dan kematian, kata ini menunjuk pada kehidupan Paulus, bukan secara khusus pada jiwa sebagai unsur tak berjasad.
- source_word: ὡς τελειῶσαι
  choice: asalkan aku dapat menyelesaikan
  rationale: Konstruksi Yunani yang padat ini menonjolkan tujuan utama Paulus. 'Asalkan' mempertahankan daya retorisnya tanpa membatasinya menjadi klausa tujuan biasa.
- source_word: δρόμον
  choice: perlombaanku
  rationale: Kata ini dapat berarti lintasan atau perlombaan yang dijalani sampai selesai. 'Perlombaan' mempertahankan metafora atletik yang lazim dan jelas dalam bahasa Indonesia.
- source_word: διακονίαν
  choice: pelayanan
  rationale: Dalam konteks ini, kata tersebut menunjuk pada tugas pelayanan yang dipercayakan kepada Paulus oleh Yesus.
- source_word: παρὰ τοῦ κυρίου Ἰησοῦ
  choice: yang kuterima dari Tuhan Yesus
  rationale: Preposisi dengan bentuk genitif menyatakan sumber; terjemahan ini mempertahankan bahwa pelayanan itu berasal dari Tuhan Yesus.
- source_word: διαμαρτύρασθαι
  choice: bersaksi
  rationale: Kata kerja ini berarti memberikan kesaksian dengan sungguh-sungguh. 'Bersaksi' alami dalam bahasa Indonesia, sedangkan nuansa kesungguhannya dicatat dalam catatan kaki.
- source_word: εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ
  choice: Injil anugerah Allah
  rationale: Ungkapan ini mempertahankan hubungan genitif Yunani yang dapat menunjuk pada Injil yang bercirikan atau memberitakan anugerah Allah, tanpa mempersempitnya menjadi hanya salah satu arti.
theological_decisions:
- issue: Makna ψυχή dalam pernyataan Paulus
  choice: hidup
  alternative: jiwa
  rationale: Konteksnya adalah kesediaan Paulus menghadapi penderitaan dan kematian demi menuntaskan tugasnya. 'Hidup' tidak memasukkan pertentangan tubuh-jiwa yang tidak ditonjolkan teks.
- issue: Daya ungkap ὡς τελειῶσαι
  choice: asalkan aku dapat menyelesaikan
  alternative: supaya aku menyelesaikan; untuk menyelesaikan
  rationale: Pilihan ini menyampaikan bahwa penyelesaian tugas merupakan perhatian utama Paulus, sambil mempertahankan kepadatan dan ketegangan konstruksi sumber.
- issue: Hubungan genitif dalam τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ
  choice: Injil anugerah Allah
  alternative: Injil tentang anugerah Allah
  rationale: Bentuk yang dipilih tidak memutuskan secara berlebihan apakah genitif itu semata-mata menyatakan isi atau juga ciri dan sumber Injil tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Bentuk terikat 'kut­erima' dipakai secara wajar untuk menjaga kelancaran; 'Injil' dan 'anugerah' mempertahankan istilah Kristen yang luas dan tidak khas denominasi tertentu.
