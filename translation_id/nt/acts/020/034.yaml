  text: You yourselves know that these hands served my needs and the needs of those who were with me[a].
translation:
  language: id
  text: Kalian sendiri tahu bahwa kedua tangan ini telah mencukupi kebutuhanku dan kebutuhan orang-orang yang bersama denganku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah menyediakan kebutuhanku dan kebutuhan orang-orang yang bersama denganku.” Kata kerja Yunaninya dapat menekankan pelayanan atau bantuan praktis yang menghasilkan dukungan materi.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: kamu sendiri
  rationale: Pronomina nominatif ini bersifat emfatis; “kamu sendiri” mempertahankan penekanan bahwa para pendengar mengetahui hal itu secara langsung.
- source_word: γινώσκετε
  choice: tahu
  rationale: Bentuk kini indikatif ini secara alami menyatakan pengetahuan langsung para pendengar tentang perilaku Paulus.
- source_word: ταῖς χρείαις μου
  choice: kebutuhanku
  rationale: χρεία menunjuk pada kebutuhan atau keperluan praktis; bentuk ini alami dan sesuai dengan konteks dukungan materi.
- source_word: τοῖς οὖσι μετ’ ἐμοῦ
  choice: orang-orang yang menyertaiku
  rationale: Partisipel berartikel ini secara harfiah menunjuk kepada mereka yang berada bersama Paulus. “Menyertaiku” alami dalam bahasa Indonesia tanpa menentukan hubungan mereka secara lebih sempit.
- source_word: ὑπηρέτησαν
  choice: telah melayani
  rationale: Kata kerja ini berarti memberikan pelayanan atau bantuan. Dengan “kedua tangan ini” sebagai subjek, pilihan ini mempertahankan gambaran hidup tentang kerja tangan Paulus; konteks kebutuhan menyiratkan hasil materi.
- source_word: αἱ χεῖρες αὗται
  choice: kedua tangan ini
  rationale: Demonstratifnya menonjolkan tangan yang Paulus tunjuk sebagai alat kerjanya. “Kedua tangan ini” merupakan ungkapan Indonesia yang alami dan tetap dekat dengan bentuk Yunani.
