  rationale: Revisi menghapus tambahan “Allah” agar teks sasaran mencerminkan frasa sumber secara langsung, mengganti penanda retoris yang kurang tepat, dan mempertahankan makna perjalanan pelayanan Paulus, pewartaan, serta penegasan bahwa seluruh pendengar tidak akan melihatnya lagi.
