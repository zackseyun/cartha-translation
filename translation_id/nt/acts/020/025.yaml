review_pass:
  verdict: revise
  source_fidelity: Frasa τὴν βασιλείαν hanya menyatakan “Kerajaan”; penambahan “Allah” dalam teks utama, walaupun diberi catatan, melampaui bentuk eksplisit sumber. Susunan revisi mempertahankan cakupan ὑμεῖς πάντες (“kamu semua”) dan hubungan relatif ἐν οἷς διῆλθον κηρύσσων.
  naturalness: “Sekarang, ketahuilah” terdengar kurang alami dan dapat dibaca sebagai perintah agar pendengar mengetahui sesuatu. “Dan sekarang, lihatlah” lebih dekat dengan penanda retoris ἰδού dan tetap wajar dalam register Alkitab Indonesia modern. “Tidak akan lagi melihat wajahku” adalah ungkapan perpisahan yang alami.
  terminology: “Kerajaan” dipertahankan tanpa melengkapi “Allah,” sesuai teks Yunani. Kapitalisasi dipertahankan sebagai istilah yang merujuk pada pemerintahan/kerajaan yang diberitakan Paulus, tanpa menambahkan unsur leksikal yang tidak ada dalam ayat.
  issues:
  - severity: medium
    issue: “Allah” ditambahkan dalam “Kerajaan Allah.”
    rationale: SBLGNT berbunyi τὴν βασιλείαν (“Kerajaan”) tanpa θεοῦ (“Allah”). Catatan kaki tidak sepenuhnya mengatasi penambahan ini dalam teks utama; bentuk singkat sumber dapat diterjemahkan langsung tanpa kehilangan kejelasan.
  - severity: low
    issue: “ketahuilah” untuk ἰδού
    rationale: ἰδού adalah penanda perhatian/penekanan (“lihatlah” atau “sesungguhnya”), bukan imperatif yang bermakna “ketahuilah.”
