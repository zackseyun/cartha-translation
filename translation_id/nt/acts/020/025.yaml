  text: Καὶ νῦν ἰδοὺ ἐγὼ οἶδα ὅτι οὐκέτι ὄψεσθε τὸ πρόσωπόν μου ὑμεῖς πάντες ἐν οἷς διῆλθον κηρύσσων τὴν ⸀βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/025.yaml
  text: And now, look, I know that none of you among whom I went about proclaiming the kingdom will see my face again.
translation:
  language: id
  text: Dan sekarang, lihatlah, aku tahu bahwa kamu semua yang di tengah-tengahmu aku berkeliling memberitakan Kerajaan tidak akan lagi melihat wajahku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ νῦν ἰδοὺ
  choice: Sekarang, ketahuilah
  rationale: Mengungkap peralihan wacana dan penanda penekanan ἰδού secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: ἐν οἷς διῆλθον
  choice: yang di tengah-tengahmu aku telah berkeliling
  rationale: Mempertahankan gambaran pelayanan Paulus yang bergerak di antara para pendengar, tanpa mempersempitnya menjadi satu kunjungan.
- source_word: κηρύσσων
  choice: memberitakan
  rationale: Menyampaikan tindakan pewartaan publik yang terkandung dalam verba Yunani.
- source_word: τὴν βασιλείαν
  choice: Kerajaan Allah
  rationale: Dalam konteks Kisah Para Rasul, 'Kerajaan' merujuk pada Kerajaan Allah; unsur 'Allah' dibuat eksplisit demi kejelasan, dengan catatan bahwa teks Yunani hanya berbunyi 'Kerajaan'.
- source_word: οὐκέτι ὄψεσθε τὸ πρόσωπόν μου
  choice: tidak akan melihat wajahku lagi
  rationale: Terjemahan langsung dan alami dari ungkapan perpisahan Yunani.
theological_decisions:
- issue: Rujukan frasa 'Kerajaan'
  choice: Kerajaan Allah
  alternative: Kerajaan
  rationale: Referennya jelas dalam konteks pelayanan Paulus, tetapi bentuk singkat naskah sumber tetap dicatat agar pembaca mengetahui ambiguitas bentuknya.
- issue: Cakupan ὑμεῖς πάντες
  choice: kamu semua
  alternative: tidak seorang pun dari kamu
  rationale: Bentuk Yunani secara harfiah menyapa 'kamu semua' sebagai subjek kalimat negatif; pilihan ini menjaga susunan dan penekanan teks sumber.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina 'aku/kamu' mengikuti tuturan langsung Paulus kepada para penatua; 'ketahuilah' dipakai sebagai penanda perhatian yang lebih alami daripada terjemahan harfiah 'lihatlah'.
