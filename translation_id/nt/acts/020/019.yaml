  yaml_path: translation/nt/acts/020/019.yaml
  text: serving the Lord with all humility and with tears and trials that happened to me through the plots of the Jews[a][b].
translation:
  language: id
  text: sambil melayani Tuhan dengan segala kerendahan hati, air mata, serta ujian[a] yang saya alami melalui rencana jahat orang-orang Yahudi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pencobaan”, “pengujian”, atau “kesukaran”; dalam konteks ini yang dimaksud adalah ujian dari luar yang timbul karena perlawanan.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud adalah orang-orang Yahudi tertentu yang merencanakan kejahatan terhadap Paulus, bukan semua orang Yahudi.
    reason: cultural_note
lexical_decisions:
- source_word: δουλεύων
  choice: melayani
  rationale: Partisipel kini ini menggambarkan cara Paulus terus-menerus menjalankan pelayanannya. 'Melayani' alami dalam bahasa Indonesia dan tetap menyampaikan pengabdian kepada Tuhan tanpa secara berlebihan menonjolkan status budak.
- source_word: τῷ κυρίῳ
  choice: Tuhan
  rationale: Mempertahankan gelar κύριος tanpa memperjelas rujukannya melebihi teks Yunani; dalam konteks Kisah Para Rasul, gelar ini paling wajar merujuk kepada Tuhan Yesus.
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: dengan segala kerendahan hati
  rationale: πάσης memberi daya menyeluruh atau penguatan pada ταπεινοφροσύνης; ungkapan ini formal namun tetap wajar dalam bahasa Indonesia modern.
- source_word: δακρύων
  choice: air mata
  rationale: Terjemahan konkret ini mempertahankan daya emosional bentuk jamak Yunani dan lebih idiomatis daripada bentuk harfiah 'air-air mata'.
- source_word: πειρασμῶν
  choice: berbagai pencobaan
  rationale: Kata ini dapat berarti pencobaan, pengujian, atau kesukaran. Dalam konteks ini yang dimaksud ialah kesukaran eksternal akibat perlawanan; 'berbagai' menyampaikan bentuk jamaknya, sedangkan catatan kaki mempertahankan rentang maknanya.
- source_word: τῶν συμβάντων μοι
  choice: yang menimpa saya
  rationale: Menyampaikan berbagai pengalaman berat yang terjadi pada Paulus dengan bahasa Indonesia yang alami dan ringkas.
- source_word: ἐν ταῖς ἐπιβουλαῖς
  choice: akibat persekongkolan
  rationale: ἐν di sini paling mungkin menyatakan keadaan atau sarana yang menyebabkan pencobaan itu. 'Akibat' membuat hubungan tersebut jelas, sementara 'persekongkolan' menyampaikan rencana rahasia untuk mencelakakan.
- source_word: τῶν Ἰουδαίων
  choice: orang-orang Yahudi
  rationale: Menerjemahkan bentuk Yunani secara langsung tanpa mempersempitnya menjadi para pemimpin atau mengalihkannya menjadi orang Yudea. Catatan kaki membatasi rujukannya secara kontekstual pada para penentang tertentu.
theological_decisions:
- issue: Kemungkinan pembacaan anti-Yahudi atas τῶν Ἰουδαίων
  choice: Mempertahankan 'orang-orang Yahudi' dalam teks utama dan menjelaskan batas rujukannya dalam catatan kaki.
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Teks Yunani secara eksplisit memakai Ἰουδαίων dan tidak membatasi kelompok itu pada para pemimpin. Namun konteksnya menunjuk pada orang-orang Yahudi tertentu yang bersekongkol melawan Paulus, bukan semua orang Yahudi.
- issue: Rentang makna πειρασμῶν
  choice: Menggunakan 'pencobaan' sambil menjelaskan bahwa konteks ini menunjuk pada kesukaran atau pengujian eksternal.
  alternative: pengujian; berbagai kesukaran
  rationale: Pilihan ini mempertahankan ambiguitas leksikal yang nyata, sedangkan konteks persekongkolan menunjukkan bahwa yang terutama dimaksud bukan godaan batin untuk berbuat dosa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'saya' sesuai dengan tuturan Paulus kepada para penatua. Pengulangan 'dengan' memperjelas koordinasi cara dan keadaan pelayanan; 'berbagai' digunakan untuk menyampaikan bentuk jamak πειρασμῶν. Semua penanda catatan kaki dicantumkan dalam teks utama.
