base_translation:
  language: en
  yaml_path: translation/nt/acts/020/010.yaml
  text: But Paul went down and fell upon him[a], and embracing him said, “Do not be alarmed[b], for his life is in him.”
translation:
  language: id
  text: Namun, Paulus turun lalu menjatuhkan diri ke atas orang muda itu dan memeluknya. Ia berkata, “Jangan panik,[b] sebab nyawanya[a] ada di dalam dirinya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “jiwanya ada di dalam dirinya.” Kata Yunani psychē dapat berarti “nyawa”, “kehidupan”, “diri”, atau “jiwa”; dalam konteks hidup dan mati ini, “nyawa” paling sesuai.'
    reason: lexical_alternative
  - marker: b
    text: Perkataan Paulus dapat dipahami bahwa orang muda itu sebenarnya belum mati, atau bahwa nyawanya telah dipulihkan. Susunan bahasa Yunani sendiri tidak secara tegas menentukan yang mana.
    reason: alternative_reading
lexical_decisions:
- source_word: καταβὰς δὲ ὁ Παῦλος
  choice: Namun, Paulus turun
  rationale: Partisip aoris καταβάς menyatakan tindakan Paulus turun ke tempat orang muda itu berada. δέ menandai perkembangan yang agak kontras dengan laporan kematiannya pada ayat sebelumnya; “Namun” menyampaikan hubungan itu secara wajar.
- source_word: ἐπέπεσεν αὐτῷ
  choice: merebahkan diri ke atas orang muda itu
  rationale: Ungkapan ini menggambarkan Paulus menjatuhkan atau membaringkan tubuhnya di atas orang muda itu. Pilihan ini mempertahankan tindakan fisik serta kemungkinan gema kisah kenabian tanpa terdengar seperti ia terjatuh secara tidak sengaja.
- source_word: συμπεριλαβὼν
  choice: memeluknya
  rationale: Kata ini berarti merangkul atau mendekap dengan lengan; “memeluknya” ringkas, alami, dan mempertahankan tindakan tubuh yang penuh perhatian.
- source_word: Μὴ θορυβεῖσθε
  choice: Jangan panik
  rationale: θορυβέω dapat menunjuk pada kegemparan, kegelisahan, atau keributan. Dalam konteks ini, “Jangan panik” secara alami mencakup keadaan batin dan reaksi gaduh orang-orang yang berkumpul.
- source_word: ἡ γὰρ ψυχὴ αὐτοῦ
  choice: sebab nyawanya
  rationale: ψυχή memiliki rentang makna ‘nyawa’, ‘kehidupan’, ‘diri’, atau ‘jiwa’. Karena konteksnya menyangkut keadaan hidup atau mati, “nyawa” paling langsung dan tidak memasukkan pengertian antropologis teknis.
- source_word: ἐν αὐτῷ ἐστιν
  choice: masih ada dalam dirinya
  rationale: Terjemahan ini mempertahankan gambaran bahwa nyawanya ada di dalam dirinya. “Masih” membuat ungkapan Indonesia lebih alami, tetapi tidak menentukan apakah ia sebenarnya belum mati atau telah dipulihkan kepada kehidupan.
theological_decisions:
- issue: Makna ψυχή dalam konteks hidup dan mati
  choice: Diterjemahkan “nyawa”, bukan “jiwa”.
  alternative: “jiwanya” atau “hidupnya”
  rationale: Pokok langsung ayat ini ialah keadaan jasmani Eutikhus setelah jatuh. “Nyawa” mencerminkan penggunaan ψυχή dalam konteks hidup dan mati tanpa menjadikan ayat ini pernyataan teknis mengenai hakikat jiwa.
- issue: Apakah Eutikhus sebenarnya belum mati atau telah dihidupkan kembali
  choice: 'Teks utama dibiarkan terbuka: “nyawanya masih ada dalam dirinya.”'
  alternative: Terjemahan penafsir seperti “ia masih hidup” atau “nyawanya telah kembali”
  rationale: Bahasa Yunani menyatakan bahwa nyawanya ada di dalam dirinya, tetapi tidak secara eksplisit menjelaskan apakah ia tidak benar-benar mati atau telah dipulihkan kepada kehidupan. Terjemahan tidak semestinya menutup ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. “Orang muda itu” memperjelas rujukan pronomina tanpa mengulang nama yang tidak terdapat dalam ayat Yunani ini. Struktur partisip Yunani diubah menjadi rangkaian verba alami dalam bahasa Indonesia, sementara ambiguitas mengenai keadaan Eutikhus dipertahankan.
