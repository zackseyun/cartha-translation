  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kalimat Yunani yang panjang dipecah agar mudah dipahami, sementara urutan perjalanan, durasi lima hari, dan masa tinggal tujuh hari tetap dipertahankan.
