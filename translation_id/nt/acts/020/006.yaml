  text: ἡμεῖς δὲ ἐξεπλεύσαμεν μετὰ τὰς ἡμέρας τῶν ἀζύμων ἀπὸ Φιλίππων, καὶ ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα ἄχρι ἡμερῶν πέντε, ⸀οὗ διετρίψαμεν ἡμέρας ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/006.yaml
  text: But we sailed away from Philippi after the days of Unleavened Bread[a], and came to them at Troas within five days, where we stayed seven days.
translation:
  language: id
  text: Namun, sesudah hari-hari Perayaan Roti Tidak Beragi, kami berlayar dari Filipi. Dalam lima hari kami sampai kepada mereka di Troas. Di sana kami tinggal selama tujuh hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπλεύσαμεν
  choice: kami berlayar dari
  rationale: Kata kerja ἐκπλέω menyatakan keberangkatan dengan kapal; bentuk ini alami dalam bahasa Indonesia dan bersama ἀπό menyebut titik keberangkatan.
- source_word: μετὰ τὰς ἡμέρας τῶν ἀζύμων
  choice: sesudah hari-hari Perayaan Roti Tidak Beragi
  rationale: Ungkapan Yunani secara harfiah menunjuk pada hari-hari roti tidak beragi; penambahan 'Perayaan' memperjelas bahwa yang dimaksud ialah masa perayaan Yahudi tanpa mengubah penanda waktunya.
- source_word: ἀπὸ Φιλίππων
  choice: dari Filipi
  rationale: Preposisi ἀπό menandai tempat keberangkatan, dan Φίλιπποι lazim dialihaksarakan sebagai Filipi dalam bahasa Indonesia.
- source_word: ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα
  choice: kami tiba di Troas dan bertemu dengan mereka di sana
  rationale: Rangkaian ini menyatakan kedatangan kepada rombongan yang sudah berada di Troas. Susunan Indonesia dibuat alami sambil mempertahankan tujuan tempat dan orang yang ditemui.
- source_word: ἄχρι ἡμερῶν πέντε
  choice: Dalam lima hari
  rationale: ἄχρι dengan ukuran waktu menandai lamanya perjalanan sampai kedatangan. 'Dalam lima hari' mempertahankan durasi tersebut tanpa menyiratkan bahwa kedatangan baru terjadi sesudah lima hari penuh berlalu.
- source_word: οὗ
  choice: di sana
  rationale: Adverbia relatif ini merujuk kembali kepada Troas; 'di sana' jelas dan alami setelah struktur kalimat Indonesia dipecah.
- source_word: διετρίψαμεν ἡμέρας ἑπτά
  choice: Kami tinggal di sana selama tujuh hari
  rationale: διατρίβω dalam konteks perjalanan berarti menetap atau tinggal untuk suatu jangka waktu; 'selama' memperjelas durasinya.
