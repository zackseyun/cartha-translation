  text: ἦσαν δὲ λαμπάδες ἱκαναὶ ἐν τῷ ὑπερῴῳ οὗ ἦμεν συνηγμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/008.yaml
  text: There were many lamps in the upper room where we were gathered[a].
translation:
  language: id
  text: Ada banyak pelita di ruang atas tempat kami berkumpul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “obor”. Kata Yunani yang digunakan dapat merujuk secara lebih luas pada alat penerangan yang dapat dibawa, tetapi dalam konteks ruangan tertutup ini, “pelita” lebih mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ merupakan penghubung ringan; dalam bahasa Indonesia, alur peralihan adegan sudah alami tanpa menambahkan kata yang dapat menyiratkan pertentangan atau waktu.
- source_word: λαμπάδες
  choice: pelita
  rationale: λαμπάς dapat berarti pelita atau obor. Dalam konteks ruang tertutup, 'pelita' lebih mungkin dan lebih alami.
- source_word: ἱκαναὶ
  choice: banyak
  rationale: Di sini ἱκανός menerangkan jumlah pelita dan menyatakan jumlah yang cukup besar; 'banyak' menyampaikan makna itu secara wajar.
- source_word: ἐν τῷ ὑπερῴῳ
  choice: di ruang atas
  rationale: ὑπερῷον menunjuk pada ruangan di bagian atas rumah; 'ruang atas' jelas, ringkas, dan mempertahankan gambaran lokasinya.
- source_word: οὗ
  choice: tempat
  rationale: Kata keterangan relatif ini menyatakan lokasi; 'tempat' menghasilkan konstruksi Indonesia yang alami setelah 'ruang atas'.
- source_word: ἦμεν συνηγμένοι
  choice: kami berkumpul
  rationale: Bentuk perifrasis ini menggambarkan kelompok yang telah datang bersama dan berada dalam keadaan berkumpul. Bentuk lampau tidak perlu ditandai secara khusus dalam bahasa Indonesia karena konteks naratif sudah menjelaskannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan wajar. 'Pelita' dipilih karena tetap mudah dipahami, bernuansa dignified, dan sesuai dengan alat penerangan dalam ruangan pada konteks kuno.
