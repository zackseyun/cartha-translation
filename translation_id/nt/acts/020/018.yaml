  text: ὡς δὲ παρεγένοντο πρὸς αὐτὸν εἶπεν αὐτοῖς· Ὑμεῖς ἐπίστασθε ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην εἰς τὴν Ἀσίαν πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/018.yaml
  text: When they came to him[a], he said to them[b], “You yourselves know how I lived among you the whole time from the first day that I set foot in Asia,”
translation:
  language: id
  text: Ketika mereka datang menemuinya, ia berkata kepada mereka, “Kalian sendiri tahu bagaimana aku hidup di antara kalian sepanjang waktu[b], sejak hari pertama aku menginjakkan kaki di Asia[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Asia di sini adalah provinsi Romawi di bagian barat Asia Kecil, bukan benua Asia dalam pengertian modern.
    reason: cultural_note
  - marker: b
    text: Atau “bagaimana aku berada bersama kalian sepanjang waktu.” Ungkapan Yunani ini dapat menekankan cara hidup Paulus ataupun keberadaannya yang terus-menerus bersama mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ παρεγένοντο πρὸς αὐτόν
  choice: Ketika mereka datang menemuinya
  rationale: Ungkapan ini menyatakan kedatangan para penatua kepada Paulus. ‘Datang menemuinya’ alami dalam bahasa Indonesia dan tetap mempertahankan arah gerak menuju dirinya.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: Kalian sendiri tahu
  rationale: ‘Kalian’ memperjelas bahwa sapaan ditujukan kepada sejumlah orang, sedangkan ‘sendiri’ mempertahankan penekanan pada pronomina Yunani yang dinyatakan secara eksplisit.
- source_word: ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην
  choice: sejak hari pertama aku menginjakkan kaki
  rationale: ‘Sejak hari pertama’ menyatakan titik awal, dan ‘menginjakkan kaki’ mempertahankan gambaran hidup dari ἐπιβαίνω.
- source_word: εἰς τὴν Ἀσίαν
  choice: di Asia
  rationale: Sesudah ungkapan ‘menginjakkan kaki’, preposisi ‘di’ merupakan bentuk Indonesia yang idiomatis. Nama ‘Asia’ dipertahankan dalam teks, sedangkan cakupan geografis kunonya dijelaskan dalam catatan kaki.
- source_word: πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην
  choice: bagaimana aku hidup di antara kalian sepanjang waktu
  rationale: Dalam konteks pidato Paulus, frasa ini dapat menunjuk pada cara hidupnya sekaligus keberadaannya terus-menerus bersama mereka. Terjemahan utama menyampaikan segi cara hidup secara alami, sementara alternatif yang lebih harfiah dicatat agar ambiguitas Yunani tetap terlihat.
