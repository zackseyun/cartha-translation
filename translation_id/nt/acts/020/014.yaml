source:
  edition: SBLGNT
  text: ὡς δὲ ⸀συνέβαλλεν ἡμῖν εἰς τὴν Ἆσσον, ἀναλαβόντες αὐτὸν ἤλθομεν εἰς Μιτυλήνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/014.yaml
  text: And when he met us at Assos[a], we took him on board and came to Mitylene.
translation:
  language: id
  text: Ketika ia bertemu dengan kami di Asos[a], kami membawanya naik ke kapal, lalu tiba di Mitilene.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bergabung dengan kami di Asos” atau “berkumpul bersama kami di Asos.” Verba Yunani ini dapat berarti bertemu atau berkumpul; dalam konteks ini, maksudnya Paulus kembali bergabung dengan rombongan di sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλεν
  choice: bertemu dengan
  rationale: Dalam konteks perjalanan ini, verba tersebut paling wajar menyatakan bahwa Paulus bertemu kembali dengan rombongan di Asos. Pilihan ini tetap membuka nuansa 'bergabung' melalui catatan kaki tanpa menambahkan gagasan bahwa pertemuan itu diatur sebelumnya.
- source_word: ἡμῖν
  choice: dengan kami
  rationale: Pronomina datif jamak menunjuk kepada rombongan narator yang bepergian dengan kapal; bentuk 'dengan kami' alami sesudah verba 'bertemu'.
- source_word: εἰς τὴν Ἆσσον
  choice: di Asos
  rationale: Walaupun εἰς biasanya menyatakan arah, bersama verba pertemuan frasa ini secara idiomatis menunjukkan tempat mereka bertemu.
- source_word: ἀναλαβόντες
  choice: membawanya naik ke kapal
  rationale: Partisip ini dalam konteks pelayaran menyatakan bahwa rombongan menerima Paulus ke atas kapal. Penyebutan kapal membuat konteks maritim yang tersirat menjadi jelas dalam bahasa Indonesia.
- source_word: αὐτόν
  choice: -nya
  rationale: Merujuk kepada Paulus dari konteks sebelumnya dan secara alami dilekatkan pada verba 'membawa'.
- source_word: ἤλθομεν
  choice: tiba
  rationale: Dalam narasi perjalanan menuju suatu tempat, 'tiba' menyampaikan hasil gerak secara alami tanpa perlu mempertahankan secara kaku verba umum 'datang'.
- source_word: εἰς Μιτυλήνην
  choice: di Metilene
  rationale: Dengan verba Indonesia 'tiba', tujuan lazim dinyatakan memakai 'di'. Bentuk nama 'Metilene' mengikuti transliterasi yang wajar dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Struktur dua tindakan dipertahankan, sementara 'lalu' memperjelas urutan partisip dan verba utama. Penanda catatan kaki ditempatkan langsung sesudah 'Asos'.
