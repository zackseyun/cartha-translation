  text: καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες λαλοῦντες διεστραμμένα τοῦ ἀποσπᾶν τοὺς μαθητὰς ὀπίσω ⸀ἑαυτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/030.yaml
  text: and from among your own selves men will arise[a], speaking twisted things, to draw away the disciples after themselves.
translation:
  language: id
  text: Bahkan dari antara kamu sendiri akan muncul laki-laki yang mengucapkan hal-hal yang diputarbalikkan,[a] untuk menarik murid-murid agar mengikuti mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hal-hal yang menyimpang” atau “hal-hal yang sesat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: dari antara kamu sendiri
  rationale: Ungkapan ini menegaskan bahwa ancaman tersebut akan timbul dari dalam komunitas mereka sendiri.
- source_word: ἀναστήσονται
  choice: akan muncul
  rationale: Dalam konteks ini bentuk mendatang dari ἀνίστημι berarti tampil atau muncul; pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya prediktifnya.
- source_word: ἄνδρες
  choice: orang-orang
  rationale: Dalam konteks kelompok penatua yang sedang disapa, bentuk ini merujuk kepada sejumlah laki-laki, tetapi bahasa Indonesia lazim memakai 'orang-orang' tanpa harus menghapus konteks rujukan tersebut.
- source_word: λαλοῦντες
  choice: yang mengatakan
  rationale: Partisip ini menerangkan kegiatan verbal mereka; 'mengatakan' merupakan padanan Indonesia yang alami dalam konstruksi ini.
- source_word: διεστραμμένα
  choice: hal-hal yang menyimpang
  rationale: Bentuk netral jamak yang disubstantivakan menunjuk pada ajaran atau pernyataan yang telah diputarbalikkan dari yang benar. 'Menyimpang' mempertahankan cakupan doktrinal maupun moral tanpa mempersempitnya.
- source_word: τοῦ ἀποσπᾶν
  choice: dengan maksud menarik
  rationale: Infinitif berartikel dengan τοῦ menyatakan tujuan, sedangkan ἀποσπάω menggambarkan tindakan menarik atau memisahkan dari kelompok semula.
- source_word: τοὺς μαθητὰς
  choice: murid-murid
  rationale: Istilah ini merupakan sebutan baku dalam Kisah Para Rasul bagi para murid atau pengikut Yesus.
- source_word: ὀπίσω ἑαυτῶν
  choice: supaya mengikuti mereka
  rationale: Ungkapan idiomatis ini menyatakan pengikutan atau loyalitas kepada para pengajar itu sendiri, bukan sekadar posisi fisik di belakang mereka.
theological_decisions:
- issue: Sifat perkataan para pengajar palsu
  choice: hal-hal yang menyimpang
  alternative: hal-hal yang diputarbalikkan; hal-hal yang sesat
  rationale: Ayat ini memperingatkan adanya penyimpangan tanpa menyebut ajaran sesat tertentu. Terjemahan ini menjaga keluasan makna dan tidak menetapkan kategori teologis yang lebih sempit.
- issue: Penerjemahan ἄνδρες
  choice: orang-orang
  alternative: laki-laki
  rationale: ἄνδρες secara leksikal berjenis kelamin laki-laki, dan konteks sapaan kepada para penatua mendukung rujukan itu. Namun, dalam bahasa Indonesia 'orang-orang' adalah ungkapan paling alami untuk subjek jamak ini; pilihan tersebut tidak dimaksudkan untuk menyelesaikan pertanyaan tentang cakupan pelayanan berdasarkan gender.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bahkan' meneruskan καί dengan nuansa penambahan yang menguatkan peringatan sebelumnya. Susunan kalimat dibuat alami tanpa menghilangkan penekanan bahwa bahaya muncul dari dalam komunitas.
