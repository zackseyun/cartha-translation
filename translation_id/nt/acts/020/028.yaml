  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ ⸀θεοῦ, ἣν περιεποιήσατο διὰ τοῦ ⸂αἵματος τοῦ ἰδίου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/028.yaml
  text: Pay careful attention to yourselves and to all the flock[a], in which the Holy Spirit has appointed you overseers, to shepherd the church of God[c][b], which he obtained through the blood of his own.
translation:
  language: id
  text: Jagalah diri kalian sendiri dan seluruh kawanan itu. Di tengah kawanan itulah Roh Kudus telah menetapkan kalian sebagai para pengawas untuk menggembalakan jemaat Allah,[a] yang telah diperoleh-Nya melalui darah Anak-Nya sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah membaca “jemaat Tuhan” sebagai ganti “jemaat Allah”.
    reason: textual_variant
  - marker: b
    text: Secara harfiah, “melalui darah milik-Nya sendiri”; atau, menurut terjemahan tradisional, “dengan darah-Nya sendiri”.
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχετε ἑαυτοῖς
  choice: Jagalah dirimu
  rationale: Imperatif kini menuntut kewaspadaan yang terus-menerus; bentuk ini alami dan tetap mempertahankan sasaran refleksifnya.
- source_word: παντὶ τῷ ποιμνίῳ
  choice: seluruh kawanan itu
  rationale: Mempertahankan metafora pastoral kolektif dan menerjemahkan παντί sebagai keseluruhan kawanan.
- source_word: ἐν ᾧ
  choice: Di tengah kawanan itulah
  rationale: Mengungkapkan bahwa para pengawas ditempatkan sebagai bagian dari kawanan, dengan susunan yang lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'di dalamnya'.
- source_word: ἔθετο ἐπισκόπους
  choice: telah menetapkan kamu sebagai para pengawas
  rationale: τίθημι menyatakan penugasan atau penetapan pada suatu peran, sedangkan ἐπίσκοπος diterjemahkan menurut fungsi pengawasan tanpa memasukkan perkembangan jabatan gerejawi kemudian.
- source_word: ποιμαίνειν
  choice: untuk menggembalakan
  rationale: Mempertahankan metafora gembala yang berhubungan langsung dengan 'kawanan'.
- source_word: τὴν ἐκκλησίαν τοῦ θεοῦ
  choice: jemaat Allah
  rationale: Dalam konteks ini ἐκκλησία menunjuk umat Kristen yang berhimpun; 'jemaat' alami dalam bahasa Indonesia dan teks SBLGNT dibaca θεοῦ, 'Allah'.
- source_word: περιεποιήσατο
  choice: telah diperoleh-Nya
  rationale: Menyampaikan tindakan memperoleh bagi diri sendiri tanpa mempersempitnya menjadi metafora komersial 'membeli'.
- source_word: διὰ τοῦ αἵματος τοῦ ἰδίου
  choice: melalui darah Anak-Nya sendiri
  rationale: διά dengan genitif menyatakan sarana. Secara sintaksis τοῦ ἰδίου dapat dipakai secara substantival, 'milik-Nya sendiri/Orang-Nya sendiri', yang dalam konteks ini lazim dipahami sebagai Anak-Nya; penambahan penjelas dicatat dalam catatan kaki agar bentuk ringkas Yunani dan pembacaan tradisional tetap terlihat.
theological_decisions:
- issue: Rujukan dan daya ungkap τοῦ αἵματος τοῦ ἰδίου
  choice: melalui darah Anak-Nya sendiri
  alternative: melalui darah-Nya sendiri; secara harfiah, melalui darah milik-Nya sendiri
  rationale: Bahasa Indonesia tidak dapat membiarkan 'darah milik-Nya sendiri' tanpa terdengar tidak lengkap atau mengaburkan rujukan. Pemakaian substantival ἴδιος memungkinkan makna 'Orang-Nya sendiri', lazim dipahami sebagai Anak. Namun, karena 'Anak' tidak dinyatakan secara eksplisit dan pembacaan tradisional memahami frasa itu sebagai 'darah-Nya sendiri', kedua hal tersebut dipertahankan dalam catatan.
- issue: Varian τοῦ θεοῦ / τοῦ κυρίου
  choice: jemaat Allah
  alternative: jemaat Tuhan
  rationale: Teks utama mengikuti SBLGNT, τοῦ θεοῦ. Varian penting 'Tuhan' dicatat tanpa mengganti teks dasar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Metafora kawanan–menggembalakan dipertahankan. Klausa panjang Yunani dibagi menjadi dua kalimat demi kejelasan tanpa mengubah hubungan gagasannya.
