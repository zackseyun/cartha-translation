  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω καὶ ἤρθη νεκρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/009.yaml
  text: And a certain young man named Eutychus[a], sitting in the window, was sinking into a deep sleep while Paul was speaking at length; and being overcome by sleep, he fell down from the third story and was picked up dead.
translation:
  language: id
  text: Seorang pemuda bernama Eutikhus sedang duduk di ambang jendela. Sementara Paulus berbicara panjang lebar, ia makin terlelap dalam tidur nyenyak. Setelah dikuasai tidur, ia jatuh dari lantai tiga ke bawah, lalu ia diangkat[a] dalam keadaan mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dibawa dalam keadaan mati.” Kata Yunani yang dipakai dapat berarti “diangkat” atau “dibawa.”
    reason: Alternatif leksikal bagi bentuk pasif ἤρθη.
lexical_decisions:
- source_word: καθεζόμενος δέ τις νεανίας
  choice: Seorang pemuda ... sedang duduk
  rationale: Bentuk partisip kini menggambarkan keadaan yang sedang berlangsung. Dalam bahasa Indonesia, "seorang pemuda" menyampaikan ketakrifan τις secara alami tanpa ungkapan kaku seperti "seorang pemuda tertentu".
- source_word: ὀνόματι Εὔτυχος
  choice: bernama Eutikhus
  rationale: Padanan idiomatis untuk datif ὀνόματι; bentuk nama "Eutikhus" mengikuti transliterasi Yunani yang mudah dibaca dalam bahasa Indonesia.
- source_word: ἐπὶ τῆς θυρίδος
  choice: di ambang jendela
  rationale: θυρίς menunjuk pada bukaan jendela. Konteks jatuhnya Eutikhus menunjukkan bahwa ia duduk pada bagian bukaan atau ambangnya; pilihan ini lebih jelas dan alami daripada "di dalam jendela".
- source_word: καταφερόμενος ὕπνῳ βαθεῖ
  choice: makin terlelap dalam tidur yang nyenyak
  rationale: Ungkapan ini menggambarkan proses ketika ia semakin dibawa turun atau dikuasai oleh tidur lelap. "Makin terlelap" mempertahankan gerak progresif itu dengan bahasa Indonesia yang wajar.
- source_word: διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον
  choice: Ketika Paulus berbicara panjang lebar
  rationale: Konstruksi genitif absolut memberi latar waktu, sedangkan ἐπὶ πλεῖον menyatakan bahwa Paulus berbicara cukup lama. Dalam konteks ini διαλέγομαι berarti menyampaikan pembicaraan atau uraian, bukan semata-mata berdialog.
- source_word: κατενεχθεὶς ἀπὸ τοῦ ὕπνου
  choice: Setelah benar-benar dikuasai tidur
  rationale: Partisip aoris menandai saat proses mengantuk mencapai akibat yang menentukan. "Benar-benar dikuasai tidur" mempertahankan pengulangan gagasan dari καταφερόμενος sekaligus membedakan tahap akhirnya.
- source_word: ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω
  choice: ia jatuh dari tingkat tiga ke bawah
  rationale: τρίστεγον menunjuk tingkat ketiga sebuah bangunan dan κάτω menegaskan arah ke bawah. "Tingkat tiga" menghindari kemungkinan salah paham bahwa yang dimaksud ialah lantai permukaan tanah dalam sistem penomoran tertentu.
- source_word: ἤρθη νεκρός
  choice: lalu diangkat dalam keadaan mati
  rationale: Bentuk pasif αἴρω dapat berarti diangkat atau dibawa, sedangkan νεκρός secara tegas berarti mati. Terjemahan utama memakai "diangkat" dan mencatat alternatif leksikal tanpa melunakkan kematian menjadi sekadar tampak mati.
theological_decisions:
- issue: Apakah νεκρός perlu dilunakkan menjadi "tampaknya mati"
  choice: dalam keadaan mati
  alternative: tampaknya sudah mati
  rationale: Teks Yunani menyatakan νεκρός secara langsung dan tidak memuat penanda ketidakpastian. Terjemahan mempertahankan ketegasan narasi tanpa menyelesaikan atau mengurangi ketegangan dengan peristiwa berikutnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kalimat Yunani yang panjang dibagi agar mudah dipahami, sementara urutan kejadian, pengulangan gambaran tentang tidur, dan pernyataan tegas bahwa Eutikhus mati tetap dipertahankan.
