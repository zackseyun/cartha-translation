  text: ἐγὼ ⸀οἶδα ὅτι εἰσελεύσονται μετὰ τὴν ἄφιξίν μου λύκοι βαρεῖς εἰς ὑμᾶς μὴ φειδόμενοι τοῦ ποιμνίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/029.yaml
  text: I know that after my departure fierce wolves will come in among you[b][a], not sparing the flock.
translation:
  language: id
  text: Aku tahu bahwa sesudah kepergianku[a], serigala-serigala ganas[b] akan masuk ke tengah-tengah kalian dan tidak akan mengasihani kawanan domba itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sesudah kedatanganku”; dalam konteks ini maksudnya ialah “sesudah kepergianku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “serigala-serigala buas.” Kata sifat Yunani yang dipakai dapat menyatakan kekerasan, kekejaman, atau keganasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Aku tahu
  rationale: Mengungkapkan pengetahuan Paulus yang pasti secara langsung dan wajar.
- source_word: εἰσελεύσονται
  choice: akan masuk
  rationale: Mempertahankan gagasan gerak masuk ke dalam komunitas.
- source_word: μετὰ τὴν ἄφιξίν μου
  choice: sesudah kepergianku
  rationale: Walaupun ἄφιξις biasanya berarti kedatangan, konteks menunjukkan masa sesudah Paulus meninggalkan mereka; catatan kaki mempertahankan persoalan leksikal tersebut.
- source_word: λύκοι βαρεῖς
  choice: serigala-serigala ganas
  rationale: βαρεῖς di sini menyatakan sifat keras, berbahaya, atau buas, bukan berat secara harfiah; pilihan ini mempertahankan metafora pemangsa.
- source_word: εἰς ὑμᾶς
  choice: ke tengah-tengah kalian
  rationale: Menyampaikan penyusupan ke dalam komunitas dengan alami tanpa menghilangkan arah yang dinyatakan εἰς.
- source_word: μὴ φειδόμενοι
  choice: tidak akan menyayangkan
  rationale: Padanan yang dekat dengan teks dan menyatakan tindakan tanpa belas kasihan tanpa memperinci bentuk bahayanya.
- source_word: τοῦ ποιμνίου
  choice: kawanan domba itu
  rationale: Mempertahankan gambaran pastoral dan selaras dengan metafora serigala; kata domba membuat nomina kolektif ini jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Identitas metaforis serigala
  choice: Mempertahankan ungkapan serigala-serigala ganas tanpa mengidentifikasi mereka dalam teks utama.
  alternative: Menafsirkannya secara eksplisit sebagai guru palsu, penganiaya, atau orang-orang perusak.
  rationale: Ayat ini sendiri memakai metafora dan tidak secara eksplisit menentukan identitas mereka; mempertahankannya menjaga daya retoris serta ambiguitas teks.
- issue: Makna ἄφιξις dalam konteks
  choice: Menerjemahkannya sebagai kepergian.
  alternative: kedatangan
  rationale: Makna leksikal yang lazim adalah kedatangan, tetapi alur pidato menunjuk pada apa yang akan terjadi setelah Paulus tidak lagi bersama mereka. Catatan kaki menyatakan bentuk harfiahnya agar ketegangan leksikal tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian” yang sesuai dengan para penatua sebagai kelompok. Susunan kalimat dibuat alami dan bermartabat, sementara metafora gembala dan kawanan tetap dipertahankan.
