  source_fidelity: 'Terjemahan mempertahankan unsur-unsur utama teks Yunani: pengetahuan Paulus yang pasti, waktu sesudah kepergiannya yang dituntut konteks, metafora serigala, gerak masuk ke dalam kelompok, dan kawanan sebagai objek ancaman. Namun, “tidak akan menyayangkan kawanan domba itu” kurang tepat dan kurang alami untuk μὴ φειδόμενοι, karena “menyayangkan” terutama berarti merasa menyesal atau merasa kasihan atas kehilangan, bukan ‘tidak mengampuni/tidak mengasihani’ dalam tindakan terhadap kawanan.'
  naturalness: Kalimatnya umumnya baku dan jelas. “Ke tengah-tengah kalian” serta “serigala-serigala ganas” dapat diterima dalam ragam modern. Revisi pada predikat terakhir membuat ancamannya lebih idiomatis dan jelas. Catatan kaki a juga perlu membetulkan bentuk yang tidak alami, “tibanya aku.”
  terminology: Metafora “serigala-serigala ganas” dan “kawanan domba” dipertahankan tanpa mengidentifikasi serigala secara tafsiriah. “Kepergianku” tepat secara kontekstual untuk ἄφιξις, dengan catatan kaki yang secara transparan mencatat arti leksikal lazimnya.
