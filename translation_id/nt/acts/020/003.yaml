id: ACT.20.3
reference: Acts 20:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ποιήσας τε μῆνας τρεῖς· γενομένης ⸂ἐπιβουλῆς αὐτῷ⸃ ὑπὸ τῶν Ἰουδαίων μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν ἐγένετο ⸀γνώμης τοῦ ὑποστρέφειν διὰ Μακεδονίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/003.yaml
  text: After spending three months there[a], when a plot was made against him by the Jews as he was about to sail for Syria[d][c][b], he decided to return through Macedonia.
translation:
  language: id
  text: Setelah tinggal di sana selama tiga bulan, ketika orang-orang Yahudi[a] membuat rencana jahat terhadapnya saat ia hendak berlayar ke Siria, Paulus memutuskan untuk kembali melalui Makedonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks ini, “orang-orang Yahudi” mengacu pada kelompok tertentu yang menentang Paulus, bukan pada semua orang Yahudi tanpa kecuali.
    reason: cultural_note
lexical_decisions:
- source_word: ποιήσας τε μῆνας τρεῖς
  choice: Setelah tinggal di sana selama tiga bulan
  rationale: Dengan keterangan waktu, ποιέω berarti menghabiskan suatu jangka waktu. 'Tinggal ... selama' alami dalam bahasa Indonesia; 'di sana' dipasok dari konteks ayat sebelumnya.
- source_word: γενομένης ἐπιβουλῆς αὐτῷ
  choice: ketika ... membuat rencana jahat terhadapnya
  rationale: Konstruksi genitif absolut menyatakan keadaan waktu, sedangkan ἐπιβουλή menunjuk pada rencana bermusuhan atau persekongkolan untuk mencelakakan.
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: orang-orang Yahudi
  rationale: Mempertahankan sebutan eksplisit dalam teks Yunani, sementara catatan kaki mencegah generalisasi kepada seluruh orang Yahudi.
- source_word: μέλλοντι ἀνάγεσθαι
  choice: saat ia hendak berlayar
  rationale: μέλλω menyatakan tindakan yang segera akan dilakukan, dan ἀνάγω dalam konteks perjalanan berarti bertolak atau berlayar.
- source_word: εἰς τὴν Συρίαν
  choice: ke Siria
  rationale: εἰς menandai tujuan perjalanan; 'ke Siria' merupakan bentuk Indonesia yang langsung dan alami.
- source_word: ἐγένετο γνώμης
  choice: Paulus memutuskan
  rationale: Ungkapan ini menyatakan terbentuknya suatu keputusan. Nama 'Paulus' digunakan untuk memperjelas subjek setelah beberapa klausa tanpa mengubah acuannya.
- source_word: τοῦ ὑποστρέφειν
  choice: untuk kembali
  rationale: Infinitif berartikel menyatakan isi keputusan, dan ὑποστρέφω berarti kembali.
- source_word: διὰ Μακεδονίας
  choice: melalui Makedonia
  rationale: διά dengan genitif menunjukkan rute yang ditempuh.
theological_decisions:
- issue: Acuan sebutan 'orang-orang Yahudi' dalam kisah konflik
  choice: Mempertahankan 'orang-orang Yahudi' dalam teks utama dengan penjelasan kontekstual dalam catatan kaki.
  alternative: '''lawan-lawan Yahudi'' atau ''beberapa orang Yahudi'''
  rationale: Teks sumber secara eksplisit memakai τῶν Ἰουδαίων. Namun, dalam konteks ini ungkapan tersebut mengacu pada kelompok tertentu yang menentang Paulus, bukan semua orang Yahudi tanpa kecuali.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. 'Rencana jahat' dipilih agar sifat bermusuhan ἐπιβουλή jelas tanpa menentukan secara berlebihan bentuk persekongkolannya.
