  text: διὸ γρηγορεῖτε, μνημονεύοντες ὅτι τριετίαν νύκτα καὶ ἡμέραν οὐκ ἐπαυσάμην μετὰ δακρύων νουθετῶν ἕνα ἕκαστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/031.yaml
  text: Therefore stay alert[a], remembering that for three years, night and day, I did not stop admonishing each one with tears.
translation:
  language: id
  text: Karena itu, tetaplah waspada sambil mengingat bahwa selama tiga tahun, siang dan malam, aku tidak berhenti menasihati[a] setiap orang dengan air mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memperingatkan”. Kata kerja Yunani ini dapat menekankan peringatan atau teguran yang bersifat korektif, maupun pemberian nasihat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari peringatan sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: γρηγορεῖτε
  choice: tetaplah berjaga-jaga
  rationale: Imperatif kini menyatakan kewaspadaan yang harus terus dipertahankan; pilihan ini menjaga gambaran berjaga tanpa dipahami sekadar tidak tidur.
- source_word: μνημονεύοντες
  choice: dan ingatlah
  rationale: Partisip ini menyertai perintah utama. Bentuk koordinatif lebih alami dalam bahasa Indonesia sambil mempertahankan kaitan bahwa kewaspadaan mereka disertai dengan mengingat teladan Paulus.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi yang harus mereka ingat.
- source_word: τριετίαν
  choice: selama tiga tahun
  rationale: Menyatakan rentang waktu secara jelas dan idiomatis.
- source_word: νύκτα καὶ ἡμέραν
  choice: malam dan siang
  rationale: Mempertahankan urutan Yunani dan mengungkapkan kegiatan yang berlangsung terus-menerus.
- source_word: οὐκ ἐπαυσάμην
  choice: aku tidak berhenti
  rationale: Menyampaikan bahwa Paulus tidak menghentikan atau mengendurkan kegiatan tersebut dalam ungkapan Indonesia yang wajar.
- source_word: μετὰ δακρύων
  choice: dengan air mata
  rationale: Mempertahankan unsur penyertaan dan bobot emosional pelayanan Paulus.
- source_word: νουθετῶν
  choice: menasihati
  rationale: Dalam bahasa Indonesia modern, 'menasihati' dapat mencakup pengajaran yang bersifat korektif dan peringatan pastoral; catatan kaki menjaga kemungkinan penekanan pada tindakan memperingatkan.
- source_word: ἕνα ἕκαστον
  choice: setiap orang
  rationale: Mengungkapkan perhatian distributif kepada masing-masing individu tanpa menambahkan 'dari kalian' yang hanya tersirat oleh konteks.
theological_decisions:
- issue: Daya pastoral dan korektif νουθετῶν
  choice: menasihati
  alternative: memperingatkan
  rationale: '''Menasihati'' mempertahankan sifat personal dan pastoral tindakan Paulus, sedangkan catatan kaki menyatakan bahwa verba Yunani juga dapat menonjolkan peringatan korektif. Dengan demikian, cakupan makna tidak dipersempit secara diam-diam.'
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. 'Tetaplah berjaga-jaga' mempertahankan seruan untuk kewaspadaan berkelanjutan; 'aku' sesuai dengan tuturan langsung Paulus dan register Alkitab Indonesia yang natural.
