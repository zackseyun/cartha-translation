  yaml_path: translation/nt/acts/020/002.yaml
  text: After passing through those regions and encouraging them with many words[a], he came into Greece.
translation:
  language: id
  text: Setelah melintasi daerah-daerah itu dan menguatkan mereka dengan banyak perkataan[a], ia pergi ke Yunani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “secara panjang lebar” atau “dengan banyak nasihat”; harfiahnya, bahasa Yunani berbunyi “dengan banyak perkataan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθὼν
  choice: Setelah menjelajahi
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. 'Setelah menjelajahi' menyampaikan perjalanan Paulus melintasi sejumlah daerah dengan wajar dalam bahasa Indonesia.
- source_word: τὰ μέρη ἐκεῖνα
  choice: daerah-daerah itu
  rationale: μέρη menunjuk pada bagian-bagian atau kawasan geografis; bentuk ulang 'daerah-daerah' wajar untuk cakupan jamak ini.
- source_word: παρακαλέσας
  choice: menguatkan
  rationale: παρακαλέω dapat berarti mendorong, menasihati, menghibur, atau menguatkan. Dalam konteks kunjungan kepada orang-orang percaya, 'menguatkan' mempertahankan cakupan pastoral tanpa membatasinya hanya pada teguran.
- source_word: αὐτοὺς
  choice: mereka
  rationale: Pronomina ini merujuk kepada orang-orang percaya atau para murid di daerah-daerah yang baru disebutkan.
- source_word: λόγῳ πολλῷ
  choice: dengan banyak perkataan
  rationale: Frasa ini secara dekat berarti 'dengan banyak perkataan/pembicaraan'. Terjemahan utama mempertahankan bentuk ungkapan Yunani, sedangkan kemungkinan makna idiomatisnya dijelaskan dalam catatan kaki.
- source_word: ἦλθεν εἰς τὴν Ἑλλάδα
  choice: ia pergi ke Yunani
  rationale: ἔρχομαι dapat diterjemahkan 'datang' atau 'pergi' menurut sudut pandang. Karena narasi mengikuti perjalanan Paulus tanpa titik pandang yang berada di Yunani, 'pergi ke Yunani' lebih alami dalam bahasa Indonesia; εἰς tetap menyatakan tujuan gerak.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ adalah penghubung ringan. Fungsi peralihannya terserap secara alami dalam konstruksi pembuka 'Setelah ...'.
