  yaml_path: translation/nt/acts/020/005.yaml
  text: These men went on ahead and were waiting for us in Troas[a].
translation:
  language: id
  text: Mereka ini pergi lebih dahulu dan sedang menunggu kami di Troas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Mereka ini, setelah pergi lebih dahulu, tetap berada di Troas sambil menunggu kami.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Mereka ini
  rationale: Kata ganti penunjuk nominatif maskulin jamak ini merujuk kepada para rekan yang disebut sebelumnya. 'Mereka ini' alami dalam bahasa Indonesia dan tetap mempertahankan daya tunjuknya.
- source_word: δὲ
  choice: —
  rationale: δέ merupakan penghubung ringan. Dalam konteks ini hubungan dengan kalimat sebelumnya sudah jelas, sehingga tidak perlu diterjemahkan secara eksplisit dalam bahasa Indonesia.
- source_word: προσελθόντες
  choice: telah pergi lebih dahulu
  rationale: Dalam konteks perjalanan ini, bentuk partisip tersebut menunjukkan bahwa mereka mendahului rombongan narator. Pilihan ini menyampaikan tindakan yang berlangsung sebelum mereka menunggu di Troas.
- source_word: ἔμενον
  choice: sedang menunggu
  rationale: Walaupun μένω pada dasarnya berarti 'tinggal' atau 'tetap berada', dengan objek personal ἡμᾶς dalam konteks perjalanan maknanya ialah menantikan kedatangan mereka. 'Sedang' menyampaikan aspek berkelanjutan dari bentuk imperfek.
- source_word: ἡμᾶς
  choice: kami
  rationale: Kata ganti orang pertama jamak sebagai objek. 'Kami' tepat karena kelompok narator tidak mencakup pembaca.
- source_word: ἐν Τρῳάδι
  choice: di Troas
  rationale: Padanan lokatif yang alami bagi ἐν dengan nama tempat Τρῳάς dalam bahasa Indonesia.
