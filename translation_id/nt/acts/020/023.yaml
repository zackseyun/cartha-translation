  text: except that the Holy Spirit testifies to me in city after city[c][b][a], saying that chains and afflictions await me.
translation:
  language: id
  text: Hanya saja, Roh Kudus bersaksi kepadaku di kota demi kota bahwa belenggu dan kesengsaraan menantikan aku.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari kota ke kota” atau “di setiap kota.” Ungkapan Yunani ini bersifat distributif dan menunjukkan kesaksian yang berulang di kota-kota berturut-turut.
    reason: lexical_alternative
  - marker: b
    text: Atau “rantai.” Kata Yunani ini secara konkret menunjuk pada ikatan atau belenggu dan, menurut konteks, dapat menyiratkan pemenjaraan.
    reason: lexical_alternative
  - marker: c
    text: 'Sejumlah naskah memiliki sedikit perbedaan dalam keberadaan atau letak kata “aku” sehubungan dengan “kesengsaraan,” tetapi makna pokoknya tetap: belenggu dan kesengsaraan menantikan Paulus.'
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν ὅτι
  choice: hanya saja
  rationale: Ungkapan ini memperkenalkan satu-satunya pengecualian atau pembatasan terhadap pernyataan pada ayat sebelumnya; “hanya saja” alami dalam bahasa Indonesia dan mempertahankan daya adversatifnya.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roh Kudus
  rationale: Padanan baku dan wajar dalam bahasa Indonesia untuk frasa definit yang merujuk kepada Roh ilahi.
- source_word: κατὰ πόλιν
  choice: dari kota ke kota
  rationale: Konstruksi distributif κατά dengan nomina tunggal menunjukkan kesaksian yang berulang di berbagai kota secara berturut-turut, tanpa harus menyatakan secara mutlak “setiap kota”.
- source_word: διαμαρτύρεταί μοι
  choice: bersaksi kepadaku
  rationale: Mempertahankan makna memberi kesaksian dengan sungguh-sungguh tanpa mempersempitnya menjadi sekadar “memperingatkan”.
- source_word: λέγον
  choice: bahwa
  rationale: Dalam bahasa Indonesia, isi kesaksian paling alami diperkenalkan langsung dengan “bahwa”; makna partisipel “dengan mengatakan” tetap tersampaikan tanpa ungkapan yang kaku.
- source_word: δεσμὰ
  choice: belenggu
  rationale: Mempertahankan gambaran konkret tentang ikatan atau rantai sekaligus dapat menyiratkan pemenjaraan.
- source_word: θλίψεις
  choice: kesengsaraan
  rationale: Menyampaikan tekanan, penderitaan, dan kesusahan yang berat dengan bahasa modern yang bermartabat.
- source_word: με
  choice: aku
  rationale: Pronomina orang pertama tunggal sesuai dengan suara Paulus dan berfungsi sebagai objek dari hal-hal yang menantikannya.
- source_word: μένουσιν
  choice: menantikan
  rationale: Dalam konteks ini verba tersebut menyatakan bahwa belenggu dan kesengsaraan telah tersedia atau berada di depan bagi Paulus; “menantikan” mempertahankan daya prospektifnya.
theological_decisions:
- issue: Rujukan dan tindakan Roh Kudus
  choice: Roh Kudus tampil sebagai pelaku yang bersaksi kepada Paulus
  alternative: Roh Kudus dipahami sebagai pengaruh rohani yang tidak berpribadi
  rationale: Tata bahasa ayat ini menggambarkan Roh Kudus melakukan tindakan bersaksi atau berbicara. Terjemahan mempertahankan agensi itu tanpa menambahkan rumusan doktrinal yang tidak dinyatakan oleh ayat.
translation_notes:
  register: Bahasa Indonesia standar modern, alami, dan bermartabat. Susunan kalimat dibuat ringkas; ambiguitas distributif κατὰ πόλιν dan nuansa konkret δεσμά dipertahankan serta dijelaskan dalam catatan kaki.
