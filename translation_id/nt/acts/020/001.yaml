id: ACT.20.1
reference: Acts 20:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον ⸀μεταπεμψάμενος ὁ Παῦλος τοὺς μαθητὰς καὶ ⸀παρακαλέσας, ἀσπασάμενος ἐξῆλθεν ⸀πορεύεσθαι ⸀εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/001.yaml
  text: After the uproar had ceased[a], Paul sent for the disciples, and after encouraging them and saying farewell, he departed to go to Macedonia.
translation:
  language: id
  text: Setelah kerusuhan itu reda, Paulus menyuruh orang memanggil murid-murid. Sesudah menguatkan mereka dan berpamitan kepada mereka[a], ia berangkat menuju Makedonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberi salam kepada mereka”; kata Yunani dapat berarti memberi salam atau, dalam konteks keberangkatan, berpamitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὸ παύσασθαι
  choice: Setelah ... reda
  rationale: Konstruksi infinitif artikular dengan μετά menyatakan waktu sesudah peristiwa sebelumnya berakhir. Dalam konteks kerusuhan, “reda” terdengar alami dan menunjukkan bahwa kegaduhan telah berhenti.
- source_word: θόρυβον
  choice: kerusuhan itu
  rationale: θόρυβος menunjuk pada kegemparan atau kerusuhan umum di Efesus yang baru saja diceritakan. Kata “itu” mengaitkannya dengan peristiwa tersebut.
- source_word: μεταπεμψάμενος
  choice: menyuruh orang memanggil
  rationale: Bentuk medial ini berarti mengutus seseorang untuk meminta orang lain datang. Ungkapan ini lebih tepat daripada sekadar “memanggil”, yang dapat menyiratkan Paulus memanggil mereka secara langsung.
- source_word: τοὺς μαθητὰς
  choice: murid-murid
  rationale: Istilah μαθηταί dalam Kisah Para Rasul lazim menunjuk kepada para pengikut Yesus; “murid-murid” mempertahankan istilah khas Lukas.
- source_word: παρακαλέσας
  choice: menguatkan
  rationale: παρακαλέω dapat berarti menasihati, menghibur, atau memberi semangat. Dalam suasana sesudah kerusuhan dan menjelang perpisahan, “menguatkan” mempertahankan keluasan makna dukungan tanpa membatasinya pada teguran atau penghiburan.
- source_word: ἀσπασάμενος
  choice: berpamitan kepada mereka
  rationale: ἀσπάζομαι biasanya berarti memberi salam, tetapi dalam konteks keberangkatan dapat menyatakan berpamitan. Pilihan utama mengikuti fungsi kontekstualnya, sementara kemungkinan leksikal lainnya dipertahankan dalam catatan kaki.
- source_word: ἐξῆλθεν
  choice: ia berangkat
  rationale: Dalam narasi perjalanan, ἐξέρχομαι dapat berfungsi sebagai ungkapan keberangkatan. “Berangkat” alami dalam bahasa Indonesia dan selaras dengan tujuan perjalanan yang mengikutinya.
- source_word: πορεύεσθαι εἰς Μακεδονίαν
  choice: menuju Makedonia
  rationale: Infinitif ini menyatakan perjalanan yang dituju setelah Paulus berangkat. “Menuju Makedonia” menyampaikan arah dan maksud perjalanan secara ringkas dan alami.
