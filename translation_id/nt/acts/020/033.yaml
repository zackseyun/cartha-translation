  text: ἀργυρίου ἢ χρυσίου ἢ ἱματισμοῦ οὐδενὸς ἐπεθύμησα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/033.yaml
  text: I coveted no one's silver or gold or clothing[a].
translation:
  language: id
  text: Aku tidak mengingini perak, emas, atau pakaian milik siapa pun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku tidak menginginkan perak, emas, atau pakaian milik siapa pun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργυρίου
  choice: perak
  rationale: Mempertahankan benda konkret dalam daftar barang berharga, sejajar dengan emas dan pakaian.
- source_word: χρυσίου
  choice: emas
  rationale: Padanan langsung dan alami bagi benda berharga yang disebut dalam teks.
- source_word: ἱματισμοῦ
  choice: pakaian
  rationale: Istilah Indonesia modern dan luas untuk pakaian atau busana, tanpa kesan arkais.
- source_word: οὐδενὸς
  choice: siapa pun
  rationale: Dalam konstruksi dengan ketiga nomina sebelumnya, kata ini menyatakan bahwa barang-barang itu milik orang lain; susunan 'perak, emas, atau pakaian siapa pun' menyampaikan daya posesif tersebut secara alami.
- source_word: ἐπεθύμησα
  choice: mengingini
  rationale: Dalam konteks pembelaan Paulus terhadap ketamakan, 'mengingini' menyampaikan hasrat terhadap milik orang lain dan mempertahankan nuansa etis, tanpa mempersempit maknanya secara berlebihan.
- source_word: ἢ ... ἢ ... ἢ
  choice: atau ... atau ... atau
  rationale: Pengulangan disjungtif Yunani dipertahankan secara wajar dalam daftar Indonesia setelah verba negatif.
theological_decisions:
- issue: Nuansa moral ἐπιθυμέω terhadap harta milik orang lain
  choice: mengingini
  alternative: menginginkan
  rationale: Konteks menekankan integritas Paulus dan ketiadaan ketamakan. 'Mengingini' memiliki nuansa etis yang sesuai, sedangkan 'menginginkan' dapat terdengar lebih netral; alternatif itu tetap dicatat karena verba Yunani juga dapat berarti sekadar berhasrat.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pronomina 'Aku' mengikuti ujaran langsung Paulus; daftar konkret dan ambiguitas terbatas antara hasrat netral dan keinginan yang salah dipertahankan melalui catatan kaki.
