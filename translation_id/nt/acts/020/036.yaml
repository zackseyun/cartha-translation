  text: Καὶ ταῦτα εἰπὼν θεὶς τὰ γόνατα αὐτοῦ σὺν πᾶσιν αὐτοῖς προσηύξατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/036.yaml
  text: And after saying these things, he knelt down with them all and prayed.
translation:
  language: id
  text: Setelah mengatakan hal-hal itu, ia berlutut bersama mereka semua dan berdoa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Setelah
  rationale: Dalam bahasa Indonesia, hubungan naratif dan urutan waktu Καὶ dengan partisip aoristus berikutnya tersampaikan secara alami melalui klausa pembuka “Setelah ...”; penambahan “dan” pada awal ayat tidak diperlukan.
- source_word: ταῦτα εἰπὼν
  choice: Setelah mengatakan hal-hal itu
  rationale: Partisip aoristus εἰπών menyatakan tindakan yang mendahului verba utama. Ungkapan ini mempertahankan acuan jamak ταῦτα tanpa mengubahnya menjadi penafsiran yang lebih spesifik.
- source_word: θεὶς τὰ γόνατα αὐτοῦ
  choice: ia berlutut
  rationale: Secara harfiah berarti “menempatkan lututnya” dan merupakan ungkapan idiomatis untuk berlutut. Terjemahan ini alami dan tidak menyiratkan bahwa ia jatuh tersungkur.
- source_word: σὺν πᾶσιν αὐτοῖς
  choice: bersama mereka semua
  rationale: σύν dengan datif menyatakan kebersamaan, sedangkan πᾶσιν menekankan bahwa seluruh kelompok menyertainya.
- source_word: προσηύξατο
  choice: berdoa
  rationale: Bentuk aoristus medium dari προσεύχομαι adalah verba umum untuk berdoa; “berdoa” merupakan padanan langsung dan wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami, ringkas, dan bermartabat. Pronomina “ia” dipakai dalam gaya naratif Alkitab tanpa menambahkan nama Paulus yang tidak disebut dalam ayat ini.
