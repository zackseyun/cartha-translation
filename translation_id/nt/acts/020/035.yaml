id: ACT.20.35
reference: Acts 20:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι αὐτὸς εἶπεν Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/035.yaml
  text: In everything I showed you that by laboring in this way it is necessary to help the weak[a], and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’
translation:
  language: id
  text: Dalam segala hal aku telah menunjukkan kepadamu bahwa dengan bekerja keras seperti ini, orang harus menolong orang-orang yang lemah[a] dan mengingat perkataan Tuhan Yesus, bahwa Ia sendiri berkata, ‘Lebih berbahagia memberi daripada menerima.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mendukung orang-orang yang lemah.” Kata kerja Yunani ini dapat menyiratkan bantuan yang berkelanjutan, bukan hanya pertolongan sesaat.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: Dalam segala hal
  rationale: Dipahami secara adverbial bersama ὑπέδειξα, menunjuk pada keseluruhan teladan Paulus.
- source_word: ὑπέδειξα
  choice: aku telah menunjukkan
  rationale: Menyampaikan tindakan menunjukkan atau memperagakan melalui teladan, dengan bentuk lampau yang wajar dalam bahasa Indonesia.
- source_word: οὕτως κοπιῶντας
  choice: dengan bekerja keras seperti ini
  rationale: κοπιάω menyiratkan jerih payah, sedangkan οὕτως merujuk kembali pada cara Paulus bekerja.
- source_word: δεῖ
  choice: kita harus
  rationale: Mengungkapkan keharusan; subjek inklusif 'kita' wajar karena Paulus mengarahkan teladannya kepada para pendengar, meski subjek tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: ἀντιλαμβάνεσθαι
  choice: menolong
  rationale: Dalam konteks ini berarti memberikan bantuan atau dukungan; pilihan yang alami dan mudah dipahami.
- source_word: τῶν ἀσθενούντων
  choice: orang-orang yang lemah
  rationale: Mempertahankan keluasan makna bagi mereka yang lemah secara fisik, ekonomi, sosial, atau dalam arti lain tanpa mempersempitnya.
- source_word: μνημονεύειν τε
  choice: dan mengingat
  rationale: τε mengoordinasikan kewajiban ini dengan kewajiban menolong sebelumnya.
- source_word: τῶν λόγων
  choice: perkataan
  rationale: Dalam konteks ini menunjuk pada ucapan Yesus yang diingat; 'perkataan' alami dalam bahasa Indonesia.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Tuhan Yesus
  rationale: Mempertahankan gelar κύριος dan nama Ἰησοῦ dalam bentuk baku Indonesia.
- source_word: αὐτὸς εἶπεν
  choice: Ia sendiri berkata
  rationale: Mempertahankan penekanan αὐτός bahwa perkataan tersebut berasal dari Yesus sendiri.
- source_word: Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν
  choice: Lebih berbahagia memberi daripada menerima
  rationale: Menyampaikan perbandingan secara langsung dan alami sambil mempertahankan μακάριον sebagai keadaan berbahagia atau diberkati.
theological_decisions:
- issue: Cakupan 'orang-orang yang lemah'
  choice: Dibiarkan luas sebagai 'orang-orang yang lemah'.
  alternative: orang miskin; orang sakit; orang yang lemah secara rohani
  rationale: ἀσθενούντων memiliki jangkauan semantis yang luas. Konteks kerja dan pemberian menunjuk pada orang rentan, tetapi tidak mengharuskan satu jenis kelemahan tertentu.
- issue: Subjek keharusan dalam δεῖ
  choice: Dinyatakan secara inklusif sebagai 'kita harus'.
  alternative: orang harus; haruslah
  rationale: Bahasa Yunani memakai konstruksi impersonal. 'Kita harus' sesuai dengan Paulus yang memasukkan dirinya dalam teladan dan menasihati para penatua, tanpa menjadikan perintah itu eksklusif bagi satu kelompok.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Struktur kalimat mempertahankan alur argumentasi Yunani sambil menghindari susunan yang kaku; kutipan Yesus dibuat ringkas dan mudah diingat.
