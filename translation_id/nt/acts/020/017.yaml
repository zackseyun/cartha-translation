  text: Ἀπὸ δὲ τῆς Μιλήτου πέμψας εἰς Ἔφεσον μετεκαλέσατο τοὺς πρεσβυτέρους τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/017.yaml
  text: From Miletus he sent to Ephesus and called for the elders of the church[a].
translation:
  language: id
  text: Dari Miletus ia mengirim pesan ke Efesus dan memanggil para penatua jemaat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dari Miletus ia mengutus orang ke Efesus dan memanggil para penatua jemaat datang kepadanya.” Bahasa Yunani menyebut tindakan mengirim ke Efesus dan memanggil para penatua. Yang dikirim tidak disebutkan; dapat dipahami sebagai pesan atau utusan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς Μιλήτου
  choice: Dari Miletus
  rationale: ἀπό dengan bentuk genitif menyatakan titik asal atau lokasi. Partikel δέ merupakan penghubung ringan dan tidak perlu diterjemahkan secara tersendiri dalam susunan bahasa Indonesia ini.
- source_word: πέμψας εἰς Ἔφεσον
  choice: mengirim pesan ke Efesus
  rationale: Partisip aoris πέμψας menyatakan tindakan yang mendahului atau menyertai verba utama. Objek yang dikirim tidak disebutkan; 'pesan' menyampaikan maksud kontekstual tanpa menentukan apakah yang diutus seorang atau beberapa orang.
- source_word: μετεκαλέσατο
  choice: untuk memanggil
  rationale: Bentuk medium ini berarti memanggil atau meminta seseorang datang kepada dirinya. Ungkapan ini alami dalam bahasa Indonesia dan tidak memberi kesan memaksa sekuat 'memerintahkan datang'.
- source_word: τοὺς πρεσβυτέρους
  choice: para penatua
  rationale: Dalam konteks Kisah Para Rasul, πρεσβύτεροι menunjuk para pemimpin yang diakui dalam komunitas Kristen, bukan sekadar laki-laki lanjut usia.
- source_word: τῆς ἐκκλησίας
  choice: jemaat
  rationale: ἐκκλησία di sini menunjuk komunitas orang percaya setempat. 'Jemaat' merupakan padanan Indonesia yang alami dan tidak menyiratkan gedung atau struktur denominasi tertentu.
theological_decisions:
- issue: Makna πρεσβυτέρους dalam konteks gerejawi
  choice: para pemimpin jemaat yang disebut 'penatua'
  alternative: orang-orang yang lebih tua dalam jemaat; presbiter sebagai istilah teknis
  rationale: Konteks naratif menunjukkan bahwa Paulus meminta para pemimpin yang diakui dari jemaat Efesus datang kepadanya. 'Penatua' mempertahankan istilah kepemimpinan Perjanjian Baru tanpa menetapkan bentuk tata gereja denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Nama 'Paulus' dinyatakan untuk memperjelas subjek tersirat verba Yunani dalam konteks ayat, sedangkan 'mengirim pesan' menjaga ketidakjelasan sumber mengenai apakah ia mengutus seorang utusan atau lebih.
