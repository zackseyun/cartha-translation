  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ⸀προελθόντες ⸀ἐπὶ τὸ πλοῖον ἀνήχθημεν ἐπὶ τὴν Ἆσσον, ἐκεῖθεν μέλλοντες ἀναλαμβάνειν τὸν Παῦλον, οὕτως γὰρ ⸂διατεταγμένος ἦν⸃ μέλλων αὐτὸς πεζεύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/013.yaml
  text: But we[a], having gone ahead to the ship, set sail for Assos, intending to take Paul on board from there, for so he had arranged[b], since he himself intended to go by land.
translation:
  language: id
  text: Namun, kami pergi lebih dahulu ke kapal lalu berlayar menuju Asos. Dari sana kami bermaksud membawa Paulus naik ke kapal, sebab demikianlah yang telah diatur[a], karena ia sendiri bermaksud pergi melalui darat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sebab demikianlah yang telah diaturnya.” Bentuk Yunani διατεταγμένος ἦν secara gramatikal bersifat pasif, tetapi dalam konteks mungkin menunjuk pada pengaturan atau petunjuk yang sebelumnya dibuat Paulus sendiri.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “karena ia sendiri bermaksud berjalan kaki.” Kata kerja Yunani πεζεύειν secara khusus membedakan perjalanan melalui darat dari pelayaran rombongan itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθόντες
  choice: berangkat lebih dahulu
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama dan menunjukkan bahwa rombongan penutur pergi lebih dahulu daripada Paulus.
- source_word: ἐπὶ τὸ πλοῖον
  choice: ke kapal
  rationale: Dengan verba gerak, frasa ini menunjuk gerakan menuju atau naik ke kapal; implikasi menaiki kapal diperjelas oleh verba berikutnya, 'berlayar'.
- source_word: ἀνήχθημεν
  choice: berlayar
  rationale: Dalam konteks pelayaran, ἀνάγω berarti bertolak ke laut atau mulai berlayar. 'Berlayar' alami dan jelas dalam narasi perjalanan.
- source_word: ἐπὶ τὴν Ἆσσον
  choice: menuju Asos
  rationale: Preposisi bersama verba gerak menyatakan tujuan pelayaran; 'Asos' mengikuti transliterasi nama tempat Yunani.
- source_word: μέλλοντες ἀναλαμβάνειν
  choice: bermaksud membawa Paulus naik ke kapal
  rationale: μέλλω menyatakan maksud atau rencana, sedangkan ἀναλαμβάνω dalam konteks ini berarti membawa atau menerima seseorang ke atas kapal.
- source_word: ἐκεῖθεν
  choice: dari sana
  rationale: Adverbia ini memiliki arti asal tempat, yaitu Asos sebagai lokasi Paulus akan dibawa naik ke kapal.
- source_word: διατεταγμένος ἦν
  choice: demikianlah yang telah diaturnya
  rationale: Bentuk perifrastik lampau pasif ini menunjuk pengaturan yang sudah dibuat sebelumnya. Terjemahan utama secara alami mengaitkannya dengan Paulus, sambil mempertahankan unsur 'yang telah diatur' dari bentuk pasif.
- source_word: μέλλων αὐτὸς πεζεύειν
  choice: karena ia sendiri bermaksud pergi melalui darat
  rationale: πεζεύω menandai perjalanan darat sebagai lawan pelayaran; αὐτός bersifat emfatis, sehingga diterjemahkan 'ia sendiri'. Hubungannya dengan pengaturan sebelumnya bersifat menjelaskan atau kausal.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai kontras ringan antara rombongan 'kami' yang berlayar dan Paulus yang menempuh jalur darat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. 'Membawa Paulus naik ke kapal' memperjelas konteks maritim, sedangkan catatan kaki mempertahankan ambiguitas bentuk pasif dan cakupan makna perjalanan darat/berjalan kaki.
