  yaml_path: translation/nt/acts/020/012.yaml
  text: And they took the boy away alive[a], and were not a little comforted.
translation:
  language: id
  text: Lalu mereka membawa pemuda itu pergi dalam keadaan hidup, dan mereka sangat terhibur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: membawa pulang
  rationale: Aoristus ἄγω dapat berarti membawa atau menuntun. Dalam konteks ini, setelah Eutikhus dipulihkan, 'membawa pulang' secara alami menyatakan bahwa mereka membawanya pergi dari tempat pertemuan.
- source_word: παῖδα
  choice: pemuda itu
  rationale: παῖς dapat berarti anak, pemuda, atau hamba. Karena orang yang sama disebut νεανίας ('pemuda') pada ayat 9, 'pemuda itu' menjaga kesinambungan rujukan tanpa menyiratkan status sebagai hamba atau usia kanak-kanak.
- source_word: ζῶντα
  choice: dalam keadaan hidup
  rationale: Partisip ini menerangkan keadaan pemuda tersebut ketika dibawa; ungkapan ini jelas dan alami dalam konteks pemulihannya dari kematian.
- source_word: παρεκλήθησαν
  choice: merasa ... terhibur
  rationale: Bentuk pasif παρακαλέω dapat berarti dihibur, dikuatkan, atau didorong. Setelah mereka menyangka Eutikhus mati lalu mendapatinya hidup, nuansa penghiburan dan kelegaan paling sesuai.
- source_word: οὐ μετρίως
  choice: sangat
  rationale: Ungkapan litotes ini secara harfiah berarti 'tidak secara sedang' dan secara idiomatis berarti sangat atau amat. 'Sangat' menyampaikan tekanannya dengan wajar dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Terjemahan menghindari ungkapan harfiah yang kaku seperti 'tidak sedikit terhibur' serta memakai 'pemuda' agar selaras dengan sebutan bagi Eutikhus dalam konteks terdekat.
