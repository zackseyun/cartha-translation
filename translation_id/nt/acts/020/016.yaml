id: ACT.20.16
reference: Acts 20:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀κεκρίκει γὰρ ὁ Παῦλος παραπλεῦσαι τὴν Ἔφεσον, ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι ἐν τῇ Ἀσίᾳ, ἔσπευδεν γὰρ εἰ δυνατὸν ⸀εἴη αὐτῷ τὴν ἡμέραν τῆς πεντηκοστῆς γενέσθαι εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/016.yaml
  text: For Paul had decided to sail past Ephesus[a], so that he might not have to spend time in Asia; for he was hurrying to be in Jerusalem, if possible[b], on the day of Pentecost.
translation:
  language: id
  text: Sebab Paulus telah memutuskan untuk berlayar melewati Efesus[a] agar ia tidak perlu berlama-lama di Asia; sebab ia bergegas supaya, jika mungkin[b], dapat berada di Yerusalem pada hari Pentakosta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Asia” di sini adalah provinsi Romawi Asia di bagian barat Asia Kecil, bukan benua Asia masa kini.
    reason: cultural_note
  - marker: b
    text: Atau “dapat tiba di Yerusalem pada hari Pentakosta.” Ungkapan Yunani dapat menekankan baik keberadaannya di sana pada hari itu maupun kedatangannya pada waktu itu.
    reason: alternative_reading
lexical_decisions:
- source_word: κεκρίκει
  choice: telah memutuskan
  rationale: Bentuk pluperfek menunjukkan keputusan yang sudah ditetapkan sebelum perjalanan yang sedang dikisahkan.
- source_word: παραπλεῦσαι
  choice: berlayar melewati
  rationale: Mempertahankan arti khusus perjalanan laut sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι
  choice: agar ia tidak menghabiskan waktu
  rationale: Mengungkapkan secara alami maksud Paulus untuk menghindari tertahannya perjalanan tanpa konstruksi harfiah yang kaku.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: di Asia
  rationale: Mempertahankan nama geografis dalam teks utama; catatan kaki menjelaskan bahwa yang dimaksud ialah provinsi Romawi.
- source_word: ἔσπευδεν
  choice: ia bergegas
  rationale: Menyampaikan tindakan tergesa-gesa yang berlangsung dalam konteks perjalanan.
- source_word: εἰ δυνατὸν εἴη αὐτῷ
  choice: jika mungkin
  rationale: Padanan idiomatis yang ringkas dan tetap menyatakan unsur kemungkinan, bukan kepastian.
- source_word: τὴν ἡμέραν τῆς πεντηκοστῆς
  choice: pada hari Pentakosta
  rationale: Menyatakan sasaran waktu secara langsung sambil mempertahankan nama perayaan yang lazim.
- source_word: γενέσθαι εἰς Ἱεροσόλυμα
  choice: dapat berada di Yerusalem
  rationale: Menekankan hasil yang dituju, yakni kehadiran di Yerusalem; kemungkinan arti 'tiba' dipertahankan dalam catatan kaki.
- source_word: Ἱεροσόλυμα
  choice: Yerusalem
  rationale: Bentuk baku nama tempat tersebut dalam bahasa Indonesia.
- source_word: πεντηκοστῆς
  choice: Pentakosta
  rationale: Nama perayaan yang mapan dan mudah dikenali dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah γενέσθαι εἰς Ἱεροσόλυμα menekankan keberadaan atau kedatangan di Yerusalem
  choice: berada di Yerusalem pada hari Pentakosta
  alternative: tiba di Yerusalem pada hari Pentakosta
  rationale: Ungkapan Yunani memungkinkan penekanan pada keadaan hadir maupun kedatangan. Teks utama memakai ungkapan yang alami dan berorientasi pada hasil, sedangkan alternatif dicatat agar ambiguitas sumber tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibagi menjadi dua kalimat agar alasan ganda dalam bahasa Yunani tetap jelas dan mudah dibaca. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
