  register: Bahasa Indonesia modern, jelas, dan bermartabat. Tanda titik koma memisahkan pengantar dari rangkaian nama, sementara koma dan konjungsi mempertahankan struktur daftar. Nama Paulus digunakan untuk memperjelas pronomina Yunani berdasarkan konteks langsung.
