source:
  edition: SBLGNT
  text: συνείπετο δὲ ⸀αὐτῷ Σώπατρος ⸀Πύρρου Βεροιαῖος, Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος, καὶ Γάϊος Δερβαῖος καὶ Τιμόθεος, Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/004.yaml
  text: And Sopater son of Pyrrhus[a], a Berean, accompanied him; and Aristarchus and Secundus from Thessalonica; and Gaius of Derbe, and Timothy[b]; and Tychicus and Trophimus from Asia.
translation:
  language: id
  text: Sopater, anak Pirus, seorang dari Berea, menyertai Paulus; begitu pula Aristarkhus dan Sekundus dari Tesalonika, Gayus dari Derbe dan Timotius, serta Tikhikus dan Trofimus dari Asia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah Provinsi Asia dalam Kekaisaran Romawi, bukan benua Asia masa kini.
    reason: cultural_note
lexical_decisions:
- source_word: συνείπετο
  choice: menyertai
  rationale: Bentuk imperfek συνέπομαι menggambarkan tindakan ikut dalam perjalanan; 'menyertai' alami dan cukup formal dalam konteks daftar rekan seperjalanan.
- source_word: αὐτῷ
  choice: Paulus
  rationale: Pronomina datif merujuk kepada Paulus dalam konteks sebelumnya. Penyebutan nama memperjelas rujukan dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: Σώπατρος Πύρρου Βεροιαῖος
  choice: Sopater anak Pirus, seorang dari Berea
  rationale: Genitif Πύρρου paling wajar dipahami sebagai patronimik, sedangkan Βεροιαῖος menunjukkan asal Sopater.
- source_word: Θεσσαλονικέων
  choice: dari Tesalonika
  rationale: Genitif jamak mengelompokkan Aristarkhus dan Sekundus sebagai orang-orang yang berasal dari kalangan Tesalonika; bentuk geografis ini paling alami dalam bahasa Indonesia.
- source_word: Ἀρίσταρχος καὶ Σεκοῦνδος
  choice: Aristarkhus dan Sekundus
  rationale: Transliterasi nama pribadi mengikuti bentuk Indonesia yang lazim dan mendekati bunyi Yunani.
- source_word: Γάϊος Δερβαῖος
  choice: Gayus dari Derbe
  rationale: Δερβαῖος merupakan penanda geografis; 'dari Derbe' merupakan padanan Indonesia yang alami.
- source_word: Τιμόθεος
  choice: Timotius
  rationale: Bentuk nama yang sudah mapan dalam tradisi Alkitab bahasa Indonesia.
- source_word: Ἀσιανοὶ
  choice: dari Asia
  rationale: Kata ini menunjukkan asal dari provinsi Romawi Asia; catatan kaki mencegah pembaca menyamakannya dengan benua Asia masa kini.
- source_word: Τυχικὸς καὶ Τρόφιμος
  choice: Tikhikus dan Trofimus
  rationale: Transliterasi nama pribadi yang mempertahankan bentuk Yunani dan tetap mudah dibaca dalam bahasa Indonesia.
- source_word: δέ ... δέ ... δέ
  choice: juga ... serta
  rationale: Partikel-partikel ini menambahkan kelompok demi kelompok dalam daftar; variasi konjungsi menghasilkan bahasa Indonesia yang lancar tanpa memberi pertentangan yang tidak ada.
