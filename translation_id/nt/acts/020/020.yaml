  - severity: low
    issue: “Menyampaikan” kurang menampilkan nuansa pemberitaan dari ἀναγγεῖλαι.
    rationale: “Memberitakan” adalah padanan Indonesia yang lebih tepat bagi tindakan menyatakan atau mengumumkan dalam konteks pelayanan, dan tetap berbeda dari “mengajar.”},{
