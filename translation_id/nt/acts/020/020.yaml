  text: ὡς οὐδὲν ὑπεστειλάμην τῶν συμφερόντων τοῦ μὴ ἀναγγεῖλαι ὑμῖν καὶ διδάξαι ὑμᾶς δημοσίᾳ καὶ κατ’ οἴκους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/020.yaml
  text: how I did not shrink back from declaring to you anything that was profitable and teaching you publicly and from house to house,[a]
translation:
  language: id
  text: bahwa aku tidak pernah enggan untuk memberitakan kepada kalian apa pun yang bermanfaat dan untuk mengajar kalian, baik di depan umum maupun dari rumah ke rumah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bahwa aku tidak menahan diri untuk memberitakan kepada kalian apa pun yang berguna.”
    reason: Alternatif leksikal untuk ὑπεστειλάμην, ἀναγγεῖλαι, dan τῶν συμφερόντων.
lexical_decisions:
- source_word: ὡς
  choice: bahwa
  rationale: Dalam konteks kalimat yang berlanjut dari ayat sebelumnya, ὡς memperkenalkan isi yang Paulus minta mereka ketahui atau ingat. 'Bahwa' paling alami dalam bahasa Indonesia.
- source_word: ὑπεστειλάμην
  choice: tidak menahan diri
  rationale: Bentuk medial ini menyatakan tidak menarik diri atau tidak menahan diri dari suatu tindakan. Pilihan ini alami dan tetap mempertahankan gagasan bahwa Paulus tidak enggan menjalankan pelayanannya.
- source_word: τῶν συμφερόντων
  choice: apa pun yang bermanfaat
  rationale: Partisip ini menunjuk pada hal-hal yang berguna atau membawa manfaat. Ungkapan ini mempertahankan cakupan umum kata sumber tanpa menyempitkannya secara eksplisit menjadi manfaat rohani saja.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: untuk menyampaikan
  rationale: Infinitif artikular dengan μή sesudah ὑπεστειλάμην menjelaskan tindakan yang tidak Paulus tahan. Struktur 'tidak menahan diri untuk' menyampaikan maknanya secara alami dalam bahasa Indonesia.
- source_word: ἀναγγεῖλαι
  choice: menyampaikan
  rationale: Kata ini berarti memberitakan, melaporkan, atau memberitahukan. 'Menyampaikan' sesuai untuk konteks pengajaran Paulus dan tidak terlalu mempersempit tindakan itu menjadi khotbah formal.
- source_word: διδάξαι
  choice: mengajar
  rationale: Padanan langsung dan alami bagi διδάσκω; dikoordinasikan dengan 'menyampaikan' sebagai tindakan kedua yang berada di bawah verba utama yang sama.
- source_word: δημοσίᾳ
  choice: di depan umum
  rationale: Adverbia ini menunjuk pada ruang atau suasana publik. 'Di depan umum' jelas dan alami bagi pembaca Indonesia modern.
- source_word: κατ’ οἴκους
  choice: dari rumah ke rumah
  rationale: κατά dengan bentuk jamak bersifat distributif. Ungkapan ini mempertahankan nuansa pelayanan yang dilakukan secara berulang di berbagai rumah.
theological_decisions:
- issue: Cakupan makna 'yang bermanfaat'
  choice: Mempertahankan rumusan luas 'apa pun yang bermanfaat'
  alternative: Menjelaskan sebagai 'apa pun yang bermanfaat secara rohani'
  rationale: Konteks pelayanan Paulus memberi nuansa rohani dan pastoral, tetapi teks Yunani sendiri tidak menyatakan pembatas itu secara eksplisit. Terjemahan utama mempertahankan keluasan leksikalnya.
- issue: Hubungan antara menyampaikan dan mengajar
  choice: Keduanya diperlakukan sebagai tindakan sejajar di bawah satu ungkapan 'tidak menahan diri'
  alternative: Mengulang 'tidak menahan diri' atau 'untuk' sebelum 'mengajar'
  rationale: Dua infinitif Yunani dikoordinasikan oleh καί dan bergantung pada verba utama yang sama. Rumusan Indonesia menghindari kesan bahwa Paulus membuat dua klaim terpisah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'aku' dan 'kalian' mengikuti tuturan langsung Paulus kepada para penatua sebagai kelompok. Pasangan 'di depan umum maupun dari rumah ke rumah' menampilkan kontras dua lingkup pelayanan secara alami.
