  text: ἱκανὸς δὲ ⸂κλαυθμὸς ἐγένετο⸃ πάντων, καὶ ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου κατεφίλουν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/037.yaml
  text: They all wept a great deal, threw their arms around Paul’s neck, and kept kissing him.
translation:
  language: id
  text: Mereka semua menangis tersedu-sedu, lalu merangkul leher Paulus dan terus-menerus menciumnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανὸς δὲ κλαυθμὸς ἐγένετο πάντων
  choice: Mereka semua menangis tersedu-sedu
  rationale: Ungkapan Yunani menyatakan tangisan hebat yang dilakukan semua orang. Bahasa Indonesia ini alami dan mempertahankan kuatnya emosi tanpa mengikuti susunan nominal Yunani secara kaku.
- source_word: ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου
  choice: lalu merangkul leher Paulus
  rationale: Secara harfiah ungkapan ini menggambarkan mereka menjatuhkan diri pada leher Paulus; dalam konteks perpisahan, ini merupakan pelukan. Pilihan ini mempertahankan gambaran leher sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: κατεφίλουν αὐτόν
  choice: terus-menerus menciumnya
  rationale: Bentuk imperfek menggambarkan tindakan mencium yang berlangsung atau berulang. 'Terus-menerus' menyampaikan aspek tersebut tanpa menambahkan penafsiran tentang jenis ciumannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang hangat dan bermartabat. Struktur dibuat lancar bagi pembaca umum, sementara intensitas tangisan, gambaran pelukan pada leher, dan keberlangsungan atau pengulangan ciuman tetap dipertahankan.
