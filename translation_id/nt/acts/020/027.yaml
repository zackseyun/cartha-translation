  text: οὐ γὰρ ὑπεστειλάμην τοῦ μὴ ἀναγγεῖλαι ⸂πᾶσαν τὴν βουλὴν τοῦ θεοῦ ὑμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/027.yaml
  text: For I did not shrink back from declaring to you the whole counsel of God[a].
translation:
  language: id
  text: Sebab aku tidak menahan diri dalam memberitakan kepada kalian seluruh maksud Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh rencana Allah,” “seluruh kehendak Allah,” atau “seluruh keputusan Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Menunjukkan bahwa pernyataan ini memberikan dasar bagi ucapan sebelumnya; “Sebab” alami dan mempertahankan hubungan logis itu.
- source_word: οὐ ... ὑπεστειλάμην
  choice: aku tidak menahan diri
  rationale: Bentuk medial ὑποστέλλω menyatakan tindakan mundur atau menahan diri dari suatu tindakan. Pilihan ini alami dalam bahasa Indonesia dan selaras dengan konteks Kisah Para Rasul 20:20.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: untuk memberitakan
  rationale: Infinitif berartikel dengan μή melengkapi ὑπεστειλάμην dan menyatakan tindakan yang tidak Paulus tahan. “Memberitakan” sesuai dengan konteks penyampaian ajaran secara terbuka.
- source_word: πᾶσαν
  choice: seluruh
  rationale: Dengan nomina tunggal βουλήν, kata ini menekankan kelengkapan atau keseluruhan dari apa yang diberitakan.
- source_word: τὴν βουλὴν τοῦ θεοῦ
  choice: maksud Allah
  rationale: βουλή dapat berarti maksud, rencana, kehendak, atau keputusan yang dipertimbangkan. “Maksud Allah” cukup luas dan alami tanpa mempersempitnya menjadi ketetapan atau kehendak moral saja.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: Datif ini menandai para penerima pemberitaan, yaitu para penatua Efesus yang disapa sebagai kelompok.
theological_decisions:
- issue: Makna βουλή τοῦ θεοῦ
  choice: seluruh maksud Allah
  alternative: seluruh rencana Allah; seluruh kehendak Allah; seluruh keputusan Allah
  rationale: Ungkapan Yunani dapat menekankan maksud, rencana, kehendak, atau keputusan Allah. Teks utama memakai “maksud” karena luas dan wajar, sedangkan catatan kaki mempertahankan alternatif yang sungguh-sungguh dimungkinkan tanpa menetapkan satu rumusan teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Kalian” memperjelas bahwa ὑμῖν berbentuk jamak dan sesuai untuk sapaan langsung kepada sekelompok penatua.
