  text: grieving especially over the word that he had spoken[a], that they would no longer see his face[d][c][b]. And they were accompanying him to the ship.
translation:
  language: id
  text: Mereka berdukacita, terutama karena perkataan yang telah dikatakannya, yaitu bahwa mereka tidak akan lagi melihat wajahnya[a]. Mereka pun mengantarnya ke kapal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka tidak lagi akan melihat wajahnya,” suatu ungkapan personal bahwa mereka tidak akan melihatnya lagi.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “menyertainya ke kapal” atau “mengantarnya sebagai penghormatan.” Kata Yunaninya dapat menyiratkan tindakan mengantar sebagai bagian dari perpisahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀδυνώμενοι
  choice: berdukacita
  rationale: Partisip ini menyatakan kepedihan atau kesedihan batin; 'berdukacita' alami, bermartabat, dan sesuai dengan suasana perpisahan.
- source_word: μάλιστα
  choice: terutama
  rationale: Menandai hal yang paling kuat menyebabkan dukacita mereka.
- source_word: ἐπὶ τῷ λόγῳ ᾧ εἰρήκει
  choice: karena perkataan yang telah disampaikannya
  rationale: Mengungkapkan hubungan sebab secara alami dalam bahasa Indonesia sambil mempertahankan nomina λόγος dan aspek tindakan yang telah terjadi.
- source_word: οὐκέτι μέλλουσιν
  choice: tidak akan ... lagi
  rationale: Gabungan ini menunjuk pada keadaan mendatang dari sudut pandang saat itu. Bentuk Indonesia ini alami dan mempertahankan οὐκέτι tanpa memperkuatnya menjadi 'tidak pernah lagi'.
- source_word: τὸ πρόσωπον αὐτοῦ θεωρεῖν
  choice: melihat wajahnya
  rationale: Mempertahankan ungkapan personal dan konkret dalam bahasa Yunani, bukan meratakannya menjadi sekadar 'bertemu dengannya'.
- source_word: προέπεμπον
  choice: mengantarnya
  rationale: Dalam konteks perpisahan, verba ini berarti menyertai atau mengantar seseorang sebagai penghormatan; 'mengantarnya' paling alami dalam bahasa Indonesia.
- source_word: εἰς τὸ πλοῖον
  choice: sampai ke kapal
  rationale: '''Kapal'' sesuai dengan konteks pelayaran. ''Sampai ke'' secara idiomatis menyatakan tujuan tindakan mengantar.'
