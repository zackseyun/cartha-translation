translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Susunan dibuat alami bagi pembaca umum, sementara ungkapan konkret ''melihat wajahnya'' dipertahankan. Referen pronomina mengikuti konteks: mereka berdukacita atas perkataan Paulus dan kemudian mengantarnya.'
