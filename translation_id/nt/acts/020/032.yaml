  source_fidelity: 'Teks menerjemahkan unsur-unsur utama Yunani dengan setia: παρατίθεμαι sebagai “memercayakan,” dua datif kepada Allah dan firman anugerah-Nya, kemampuan untuk membangun dan mengaruniakan warisan, serta kelompok “semua orang yang telah dikuduskan.” Objek jamak “kalian” pada “membangun” merupakan pelengkapan konteks yang wajar dalam bahasa Indonesia dan tidak mengubah makna. “Di antara semua orang yang telah dikuduskan” mempertahankan cakupan ἐν τοῖς ἡγιασμένοις πᾶσιν secara memadai.'
