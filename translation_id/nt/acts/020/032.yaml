id: ACT.20.32
reference: Acts 20:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παρατίθεμαι ⸀ὑμᾶς τῷ ⸀θεῷ καὶ τῷ λόγῳ τῆς χάριτος αὐτοῦ, τῷ δυναμένῳ ⸀οἰκοδομῆσαι καὶ δοῦναι ⸀τὴν κληρονομίαν ἐν τοῖς ἡγιασμένοις πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/032.yaml
  text: And now I entrust you to God and to the word of his grace[a], which is able to build up and to give the inheritance among all those who have been sanctified.
translation:
  language: id
  text: Dan sekarang aku memercayakan kalian kepada Allah dan kepada firman anugerah-Nya[a], yang sanggup membangun kalian dan mengaruniakan warisan di antara semua orang yang telah dikuduskan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa “yang sanggup” juga dapat dipahami sebagai merujuk terutama kepada Allah, bukan kepada “firman anugerah-Nya”.
    reason: alternative_reading
lexical_decisions:
- source_word: παρατίθεμαι
  choice: aku memercayakan
  rationale: Bentuk medial ini menyatakan penyerahan seseorang ke dalam pemeliharaan pihak lain. “Memercayakan” alami dalam bahasa Indonesia modern dan mempertahankan gagasan bahwa Paulus menempatkan para pendengarnya dalam pemeliharaan Allah.
- source_word: τῷ θεῷ
  choice: kepada Allah
  rationale: Datif ini menunjukkan pihak yang kepadanya Paulus memercayakan mereka.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: kepada firman anugerah-Nya
  rationale: Ungkapan ini mempertahankan struktur genitif dan bobot teologis λόγος. “Firman” di sini dapat menunjuk pada berita yang diberitakan, sedangkan “anugerah-Nya” mempertahankan hubungan genitif tanpa mempersempitnya menjadi satu penjelasan saja.
- source_word: τῷ δυναμένῳ
  choice: yang sanggup
  rationale: Ungkapan relatif bahasa Indonesia ini mengikuti anteseden terdekat, yaitu “firman anugerah-Nya”, tetapi tidak memakai kata ganti yang secara tegas menutup kemungkinan bahwa frasa tersebut terutama merujuk kepada Allah. Ambiguitas sintaksis dijelaskan dalam catatan kaki.
- source_word: οἰκοδομῆσαι
  choice: membangun kalian
  rationale: Kata kerja ini digunakan secara metaforis untuk pertumbuhan dan penguatan rohani. Objek “kalian” tersirat dari konteks dan dinyatakan agar kalimat Indonesia jelas dan alami.
- source_word: δοῦναι τὴν κληρονομίαν
  choice: mengaruniakan warisan
  rationale: “Mengaruniakan” sesuai dengan konteks pemberian ilahi, sedangkan “warisan” mempertahankan gambaran dan resonansi teologis κληρονομία.
- source_word: ἐν τοῖς ἡγιασμένοις πᾶσιν
  choice: di antara semua orang yang telah dikuduskan
  rationale: Bentuk partisipel perfek pasif diterjemahkan secara verbal untuk mempertahankan tindakan pengudusan beserta hasilnya yang berlanjut. “Di antara” mencerminkan ἐν dalam arti lingkungan atau persekutuan kelompok tersebut.
theological_decisions:
- issue: Rujukan τῷ δυναμένῳ (“yang sanggup”)
  choice: Dalam teks utama, frasa ini secara paling langsung mengikuti “firman anugerah-Nya”.
  alternative: Frasa itu dapat dipahami terutama merujuk kepada Allah sebagai Dia yang sanggup membangun dan mengaruniakan warisan.
  rationale: Baik θεῷ maupun λόγῳ berjenis maskulin dan berada dalam bentuk datif tunggal, sehingga bentuk partisipelnya secara tata bahasa dapat dikaitkan dengan salah satunya. Anteseden terdekat mendukung “firman anugerah-Nya”, sedangkan tindakan mengaruniakan warisan dapat mendukung rujukan kepada Allah. Teks utama dan catatan kaki bersama-sama mempertahankan ketegangan ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. “Aku” dan “kalian” mempertahankan perbedaan orang pertama tunggal dan orang kedua jamak. Istilah “firman”, “anugerah”, “warisan”, dan “dikuduskan” dipertahankan karena jelas dalam register Alkitabiah Indonesia dan membawa bobot konseptual teks sumber.
