  verdict: revise
  source_fidelity: Makna pokok terjaga, termasuk sudut pandang «kami», tujuan berkumpul untuk memecahkan roti, dan batas waktu sampai tengah malam. Namun, pemenggalan kalimat serta «sehingga» membuat hubungan antarklausa kurang langsung dan berpotensi menggeser partisip μέλλων menjadi akibat yang terlalu tegas.
  naturalness: «Pada hari pertama minggu itu» dan «memecahkan roti» lebih lazim serta alami dalam bahasa Indonesia baku daripada «pada hari pertama dalam minggu itu» dan «memecah-mecahkan roti». Struktur kalimat yang direvisi juga lebih mengalir.
  terminology: «Memecahkan roti» mempertahankan idiom tanpa menetapkan apakah yang dimaksud hanya makan bersama atau Perjamuan Kudus. «Hendak berangkat» menyampaikan nilai prospektif/dekat dari μέλλων tanpa mereduksinya menjadi sekadar rencana atau niat.
  issues:
  - severity: medium
    issue: Hubungan klausa Paulus hendak berangkat dan ia memperpanjang pembicaraannya kurang tepat ditata dalam draf.
    rationale: Kalimat terpisah «Ia akan berangkat ... sehingga ia memperpanjang ...» memakai «sehingga», yang secara normal menyatakan akibat. Partisip μέλλων terutama merupakan keterangan yang melekat pada Paulus; konteks dapat mendukung alasan, tetapi hubungan sebab tidak perlu dipaksakan dalam teks utama.
  - severity: low
    issue: Beberapa pilihan ungkapan kurang idiomatis.
    rationale: Dalam bahasa Indonesia Alkitabiah-modern yang baku, «hari pertama minggu itu» dan «memecahkan roti» lebih wajar. Bentuk reduplikasi «memecah-mecahkan» tidak dituntut oleh infinitif Yunani κλάσαι.
