  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων συνηγμένων ⸀ἡμῶν κλάσαι ἄρτον ὁ Παῦλος διελέγετο αὐτοῖς, μέλλων ἐξιέναι τῇ ἐπαύριον, παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/007.yaml
  text: On the first day of the week[a], when we had gathered to break bread, Paul was speaking to them, intending to depart the next day[b], and he prolonged the message until midnight.
translation:
  language: id
  text: Pada hari pertama minggu itu, ketika kami berkumpul untuk memecahkan roti[a], Paulus berbicara dengan mereka. Karena ia hendak berangkat keesokan harinya[b], ia memperpanjang pembicaraannya sampai tengah malam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini dapat menunjuk pada makan bersama dan juga dapat mengandung nuansa Perjamuan Kudus.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, «karena/hendak berangkat keesokan harinya». Bentuk partisip dalam bahasa Yunani juga dapat dipahami sebagai keterangan keadaan, tanpa menyatakan hubungan sebab secara eksplisit.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων
  choice: Pada hari pertama dalam minggu itu
  rationale: Ungkapan ini merupakan idiom Yunani Koine untuk hari pertama dalam satu minggu. δέ adalah penghubung ringan yang tidak perlu dinyatakan secara kaku dalam bahasa Indonesia.
- source_word: συνηγμένων ἡμῶν
  choice: ketika kami berkumpul
  rationale: Konstruksi genitif absolut menyatakan keadaan yang menyertai tindakan utama dan tetap mempertahankan sudut pandang orang pertama jamak.
- source_word: κλάσαι ἄρτον
  choice: untuk memecah-mecahkan roti
  rationale: Infinitif menyatakan tujuan. Idiom sumber dipertahankan agar tidak membatasi maknanya hanya pada perjamuan biasa atau hanya pada Perjamuan Tuhan.
- source_word: διελέγετο αὐτοῖς
  choice: berbicara dengan mereka
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung, sedangkan διαλέγομαι dapat menyiratkan komunikasi yang melibatkan para pendengar, bukan semata-mata khotbah satu arah.
- source_word: μέλλων ἐξιέναι τῇ ἐπαύριον
  choice: Ia akan berangkat keesokan harinya
  rationale: μέλλω dengan infinitif menyatakan tindakan yang segera atau sudah direncanakan, dan ἐξέρχομαι dalam konteks perjalanan paling wajar diterjemahkan 'berangkat'.
- source_word: παρέτεινέν τε τὸν λόγον
  choice: sehingga ia memperpanjang pembicaraannya
  rationale: παρατείνω berarti memperpanjang, sedangkan λόγος di sini menunjuk pada penyampaian atau pembicaraan Paulus. 'Pembicaraan' selaras dengan nuansa interaktif διελέγετο.
- source_word: μέχρι μεσονυκτίου
  choice: sampai tengah malam
  rationale: Frasa ini menyatakan batas waktu secara langsung.
theological_decisions:
- issue: Makna 'memecah-mecahkan roti' dalam pertemuan jemaat mula-mula
  choice: Idiom sumber dipertahankan tanpa menentukan satu jenis perjamuan tertentu.
  alternative: makan bersama; merayakan Perjamuan Tuhan
  rationale: Dalam Kisah Para Rasul, ungkapan tersebut dapat menunjuk pada perjamuan bersama sekaligus memiliki nuansa Perjamuan Tuhan. Terjemahan tidak menyelesaikan ketegangan itu secara denominatif.
- issue: Hubungan partisip μέλλων dengan tindakan Paulus memperpanjang pembicaraan
  choice: Dinyatakan sebagai latar yang menjelaskan mengapa pembicaraan diperpanjang, dengan catatan yang mengakui bentuk Yunani yang lebih longgar.
  alternative: 'Sekadar keterangan keadaan: Paulus akan berangkat pada hari berikutnya, tanpa menyatakan hubungan sebab secara eksplisit.'
  rationale: Konteks mendukung hubungan sebab, tetapi partisip Yunani sendiri tidak memakai konjungsi sebab yang eksplisit; catatan kaki mempertahankan kemungkinan sintaksis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar. 'Memecah-mecahkan roti' mempertahankan idiom Alkitabiah yang masih mudah dipahami, sedangkan 'berbicara dengan mereka' menjaga kemungkinan interaksi dalam pertemuan itu.
