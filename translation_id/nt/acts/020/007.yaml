revisions:
- from: Pada hari pertama dalam minggu itu, ketika kami berkumpul untuk memecah-mecahkan roti[a], Paulus berbicara dengan mereka. Ia akan berangkat keesokan harinya[b], sehingga ia memperpanjang pembicaraannya sampai tengah malam.
  to: Pada hari pertama minggu itu, ketika kami berkumpul untuk memecahkan roti[a], Paulus berbicara dengan mereka. Karena ia hendak berangkat keesokan harinya[b], ia memperpanjang pembicaraannya sampai tengah malam.
  rationale: Revisi menormalkan idiom bahasa Indonesia, mempertahankan «berbicara dengan mereka» untuk nuansa διαλέγετο, dan menata kembali klausa agar Paulus sebagai subjek partisip μέλλων jelas. «Karena» dipertahankan sebagai pembacaan kontekstual yang wajar, sementara catatan kaki menjaga kelonggaran sintaksis Yunani dan tidak memaksakan hubungan kausal sebagai satu-satunya kemungkinan.
