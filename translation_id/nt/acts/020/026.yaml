  text: ⸀διότι μαρτύρομαι ὑμῖν ἐν τῇ σήμερον ἡμέρᾳ ὅτι καθαρός ⸀εἰμι ἀπὸ τοῦ αἵματος πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/026.yaml
  text: Therefore I testify to you on this day that I am innocent of the blood of all[a][b].
translation:
  language: id
  text: Karena itu, pada hari ini aku bersaksi kepada kalian bahwa aku tidak bersalah atas darah semua orang[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersih dari darah semua orang”; ungkapan Yunani ini berarti bebas dari kesalahan atau tanggung jawab sehubungan dengan orang lain.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan ini kemungkinan menggemakan gambaran tentang penjaga dalam Yehezkiel, yang berkaitan dengan utang darah (mis. Yeh. 3:18–19; 33:6–9).
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: Karena itu
  rationale: Dalam konteks ini kata tersebut menarik kesimpulan dari pernyataan sebelumnya; “Karena itu” menyatakan hubungan inferensial secara alami.
- source_word: μαρτύρομαι
  choice: aku bersaksi
  rationale: Bentuk ini menyampaikan kesaksian pribadi yang sungguh-sungguh; “bersaksi” mempertahankan nuansa formal dan yuridis.
- source_word: ὑμῖν
  choice: kepadamu
  rationale: Datif ini paling wajar diterjemahkan sebagai objek tidak langsung tanpa menambahkan nuansa publik atau forensik yang tidak dinyatakan.
- source_word: ἐν τῇ σήμερον ἡμέρᾳ
  choice: pada hari ini
  rationale: Ungkapan ini lebih khidmat daripada sekadar “hari ini” dan tetap alami dalam bahasa Indonesia.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi kesaksian Paulus secara langsung dan idiomatis.
- source_word: καθαρός
  choice: tidak bersalah
  rationale: Dalam ungkapan tentang darah, kata ini menunjuk pada kebebasan dari kesalahan atau tanggung jawab; pilihan ini menyampaikan makna tersebut lebih jelas daripada terjemahan harfiah “bersih”.
- source_word: εἰμι
  choice: aku ...
  rationale: Kopula Yunani diwujudkan secara alami dalam predikasi bahasa Indonesia “aku tidak bersalah”.
- source_word: ἀπὸ τοῦ αἵματος
  choice: atas darah
  rationale: Preposisi ini bersama “darah” membentuk ungkapan tentang kesalahan atau tanggung jawab atas nasib orang lain. “Tidak bersalah atas darah” mempertahankan citra sumber dan dapat dipahami dalam bahasa Indonesia.
- source_word: πάντων
  choice: siapa pun
  rationale: Bentuk jamak ini merujuk luas kepada semua orang. “Siapa pun” menghasilkan ungkapan Indonesia yang alami tanpa membatasi kelompok yang dimaksud.
theological_decisions:
- issue: Makna “tidak bersalah atas darah siapa pun”
  choice: Ungkapan tentang bebas dari kesalahan atau tanggung jawab atas orang lain karena Paulus telah menunaikan kewajibannya untuk memperingatkan dan mengajar mereka.
  alternative: Rujukan sempit pada ketidaklibatan secara harfiah dalam kematian fisik siapa pun.
  rationale: Konteks Kisah Para Rasul 20 menekankan bahwa Paulus tidak menahan diri untuk menyampaikan seluruh maksud Allah, dan bahasanya menggemakan gambaran penjaga dalam Yehezkiel. Teks utama mempertahankan metafora darah agar hubungan Kitab Suci dan ketegangan ungkapannya tidak diratakan menjadi parafrasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina “aku” dan “kepadamu” mengikuti tuturan langsung Paulus kepada para penatua sebagai satu kelompok, sedangkan susunan “pada hari ini aku bersaksi” mempertahankan penekanan formal dari sumber.
