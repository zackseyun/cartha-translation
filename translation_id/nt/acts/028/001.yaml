id: ACT.28.1
reference: Acts 28:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ διασωθέντες τότε ⸀ἐπέγνωμεν ὅτι ⸀Μελίτη ἡ νῆσος καλεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/001.yaml
  text: After we had been brought safely through[d][c][b][a], we then learned that the island was called Malta.
translation:
  language: id
  text: Setelah kami selamat[a], barulah kami mengetahui bahwa pulau itu bernama Malta[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “setelah kami diselamatkan” atau “setelah kami berhasil lolos dengan selamat.” Kata Yunani ini menekankan keselamatan setelah melewati bahaya.
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: Melitē, pulau yang secara tradisional diidentifikasi sebagai Malta.'
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “pulau itu disebut Malta.” Bahasa Yunani memakai bentuk pasif kala kini dalam informasi yang dilaporkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: διασωθέντες
  choice: setelah kami selamat
  rationale: Partisipel aoris pasif ini menyatakan bahwa mereka telah melewati bahaya dan berada dalam keadaan selamat sebelum mengetahui nama pulau itu. Ungkapan ini alami dalam bahasa Indonesia dan tidak menentukan siapa pelaku penyelamatan.
- source_word: τότε
  choice: barulah
  rationale: Kata ini menandai urutan waktu. Dalam susunan kalimat Indonesia, “barulah” secara alami menunjukkan bahwa mereka mengetahui nama pulau itu sesudah selamat.
- source_word: ἐπέγνωμεν
  choice: kami mengetahui
  rationale: Dalam konteks ini, verba tersebut berarti memperoleh atau mengetahui informasi yang sebelumnya belum diketahui.
- source_word: Μελίτη
  choice: Malta
  rationale: Malta adalah bentuk nama baku dalam bahasa Indonesia bagi pulau yang secara tradisional diidentifikasi dengan Μελίτη.
- source_word: ἡ νῆσος
  choice: pulau itu
  rationale: Artikel Yunani menunjuk pada pulau tempat mereka terdampar; “pulau itu” jelas dan alami dalam konteks narasi.
- source_word: καλεῖται
  choice: bernama
  rationale: Bentuk pasif kini secara harfiah berarti “disebut,” tetapi “bernama” merupakan padanan Indonesia yang alami untuk menyampaikan nama suatu tempat tanpa mengubah isinya.
theological_decisions:
- issue: Pelaku dalam penyelamatan
  choice: 'Tidak menyebutkan pelaku: “kami selamat”'
  alternative: “kami diselamatkan” atau “kami berhasil lolos dengan selamat”
  rationale: Bentuk Yunani adalah pasif, tetapi pelakunya tidak dinyatakan. Terjemahan utama mempertahankan ketidakjelasan itu dan menghindari penetapan pelaku secara teologis; alternatif formal dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Barulah” menjaga alur waktu tanpa konstruksi yang berlebihan, sedangkan “kami selamat” mempertahankan ketidakjelasan mengenai pelaku penyelamatan.
