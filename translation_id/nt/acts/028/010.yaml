  text: They also honored us greatly[a], and when we were setting sail[c][b], they put on board what we needed.
translation:
  language: id
  text: Mereka juga memberikan banyak tanda penghormatan kepada kami[a]. Ketika kami hendak berlayar[b], mereka memuatkan ke kapal segala sesuatu yang kami perlukan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “menghormati kami dengan banyak penghormatan.” Bahasa Yunani mengulang kata yang berakar sama untuk menekankan banyaknya tanda penghormatan yang diberikan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “ketika kami mulai bertolak ke laut.” Kata Yunaninya merupakan istilah pelayaran untuk memulai perjalanan dengan kapal.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “mereka membekali kami dengan segala sesuatu yang kami perlukan.” Secara lebih harfiah, mereka “menaruh barang-barang untuk kebutuhan” kami.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλαῖς τιμαῖς ἐτίμησαν
  choice: memberikan berbagai tanda penghormatan kepada
  rationale: Ungkapan ini mempertahankan makna konkret dari bentuk jamak τιμαῖς sebagai berbagai pernyataan atau tanda penghormatan, sekaligus menyampaikan verba ἐτίμησαν secara alami dalam bahasa Indonesia.
- source_word: ἀναγομένοις
  choice: ketika kami hendak berlayar
  rationale: Dalam konteks kelautan, ἀνάγω berarti mulai berlayar atau bertolak ke laut. Bentuk partisipelnya menunjukkan keadaan menjelang keberangkatan dengan kapal.
- source_word: ἐπέθεντο
  choice: mereka memuatkan ke kapal
  rationale: Verba ini secara harfiah menggambarkan tindakan menaruh atau menempatkan barang. Konteks pelayaran memungkinkan objek tersirat, yaitu kapal, dinyatakan agar kalimat jelas dan alami.
- source_word: τὰ πρὸς τὰς χρείας
  choice: segala sesuatu yang kami perlukan
  rationale: Frasa berartikel ini menunjuk pada barang-barang yang berkaitan dengan kebutuhan mereka, yakni perbekalan yang diperlukan. Terjemahan ini menghindari pengulangan yang kaku tanpa menghilangkan maknanya.
