id: ACT.28.22
reference: Acts 28:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀξιοῦμεν δὲ παρὰ σοῦ ἀκοῦσαι ἃ φρονεῖς, περὶ μὲν γὰρ τῆς αἱρέσεως ταύτης γνωστὸν ⸂ἡμῖν ἐστιν⸃ ὅτι πανταχοῦ ἀντιλέγεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/022.yaml
  text: But we consider it proper to hear from you what you think[a], for concerning this sect it is known to us that it is spoken against everywhere.
translation:
  language: id
  text: Namun, kami menganggap patut untuk mendengar langsung darimu apa pandanganmu. Sebab, mengenai kelompok ini[a], kami tahu bahwa di mana-mana orang menentangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sekte” atau “aliran”. Kata Yunani αἵρεσις di sini tidak mesti berarti “ajaran sesat” dalam pengertian teknis yang berkembang kemudian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιοῦμεν
  choice: kami menganggap patut
  rationale: Mengungkapkan penilaian tentang kepatutan dengan nada sopan dan formal, bukan tuntutan atau sekadar keinginan.
- source_word: παρὰ σοῦ ἀκοῦσαι
  choice: mendengar langsung darimu
  rationale: Kata 'langsung' memperjelas nuansa bahwa mereka ingin mendengar dari Paulus sendiri tanpa membuat ungkapan Indonesia terasa kaku.
- source_word: ἃ φρονεῖς
  choice: apa pandanganmu
  rationale: Dalam konteks ini φρονέω menunjuk pada pandangan atau pendirian seseorang; ungkapan ini alami dan lebih tepat daripada sekadar proses berpikir.
- source_word: αἱρέσεως
  choice: kelompok
  rationale: Istilah ini menunjuk pada kelompok atau aliran keagamaan dan belum tentu bermakna teknis 'ajaran sesat'; 'kelompok' netral dan mudah dipahami.
- source_word: γνωστὸν ἡμῖν ἐστιν
  choice: kami tahu
  rationale: Menyampaikan makna konstruksi impersonal Yunani dalam bentuk Indonesia yang alami tanpa menambahkan penekanan yang tidak ada.
- source_word: πανταχοῦ
  choice: di mana-mana
  rationale: Padanan Indonesia yang alami bagi cakupan tempat yang luas.
- source_word: ἀντιλέγεται
  choice: orang menentangnya
  rationale: Bentuk aktif tak tentu ini secara alami mewakili pasif Yunani dan mempertahankan gagasan bahwa orang-orang berbicara atau bersikap menentang kelompok tersebut.
theological_decisions:
- issue: Pemaknaan αἵρεσις
  choice: kelompok
  alternative: sekte; aliran; ajaran sesat
  rationale: Konteksnya adalah gerakan Kristen sebagaimana dipandang pihak luar, bukan penyimpangan doktrinal dalam pengertian teknis yang muncul kemudian. Catatan kaki mempertahankan alternatif sosial-keagamaan tanpa memasukkan penilaian teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sementara nada sopan-formal para pembicara dan ketidaknetralan tanggapan publik tetap dipertahankan.
