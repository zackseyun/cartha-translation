id: ACT.28.27
reference: Acts 28:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/027.yaml
  text: For the heart of this people has become dull[a], and with their ears they heard heavily, and they closed their eyes; otherwise they might see with their eyes and hear with their ears and understand with their heart and turn back[b], and I would heal them.
translation:
  language: id
  text: Sebab hati bangsa ini telah menjadi tumpul, mereka sulit mendengar dengan telinga mereka, dan mereka memejamkan mata mereka; kalau tidak[a], mereka mungkin melihat dengan mata, mendengar dengan telinga, mengerti dengan hati, dan berbalik[b], lalu Aku akan menyembuhkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jangan sampai mereka melihat dengan mata, mendengar dengan telinga, mengerti dengan hati, dan berbalik, lalu Aku akan menyembuhkan mereka.” Kata penghubung Yunani dalam kutipan dari Yesaya ini dapat mengandung nuansa yang lebih kuat, yaitu “jangan sampai” atau “supaya tidak.”
    reason: alternative_reading
  - marker: b
    text: “Berbalik” juga dapat diterjemahkan “kembali” atau, dalam konteks ini, “bertobat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: telah menjadi tumpul
  rationale: Kata ini secara harfiah menggambarkan sesuatu yang menjadi tebal atau gemuk, tetapi di sini dipakai sebagai metafora bagi ketidakpekaan batin. “Menjadi tumpul” mempertahankan metafora itu dalam bahasa Indonesia yang wajar.
- source_word: καρδία
  choice: hati
  rationale: “Hati” mempertahankan istilah antropologis Alkitab dan kesatuan dengan frasa berikutnya, “mengerti dengan hati.”
- source_word: βαρέως ἤκουσαν
  choice: mereka sulit mendengar
  rationale: Secara harfiah frasa ini berarti mereka mendengar dengan berat. “Sulit mendengar” menyampaikan gambaran pendengaran yang berat atau tumpul secara alami dalam bahasa Indonesia tanpa mengubahnya menjadi sekadar ketidakmauan untuk mendengarkan.
- source_word: ἐκάμμυσαν
  choice: mereka memejamkan
  rationale: Kata kerja ini menyatakan tindakan menutup mata. “Memejamkan” jelas, alami, dan mempertahankan tindakan aktif para pelakunya.
- source_word: μήποτε
  choice: kalau tidak
  rationale: Dalam kutipan ini, kata penghubung tersebut dapat menyatakan akibat yang dihindari maupun nuansa tujuan negatif yang lebih kuat. “Kalau tidak” menghasilkan kalimat Indonesia yang terbaca alami sambil membiarkan nuansa yang lebih kuat dijelaskan dalam catatan kaki.
- source_word: συνῶσιν
  choice: mengerti
  rationale: “Mengerti” adalah padanan alami dan sesuai dengan ungkapan sumber tentang pengertian yang berlangsung di dalam hati.
- source_word: ἐπιστρέψωσιν
  choice: berbalik
  rationale: “Berbalik” mempertahankan metafora arah dan cakupan makna kembali kepada Allah tanpa mempersempitnya secara eksplisit menjadi “bertobat.”
- source_word: ἰάσομαι
  choice: Aku akan menyembuhkan
  rationale: Bentuk mendatang Yunani dipertahankan secara langsung. Dalam rangkaian bersyarat ini, bahasa Indonesia tetap dapat memahami tindakan tersebut sebagai hasil yang akan menyusul jika mereka berbalik.
theological_decisions:
- issue: Maksud ilahi dalam kutipan Yesaya
  choice: Memakai “kalau tidak” dalam teks utama dan mencatat kemungkinan “jangan sampai.”
  alternative: “Jangan sampai mereka melihat ...” atau “supaya mereka tidak melihat ...”
  rationale: Pilihan ini tidak meniadakan ketegangan antara penghakiman ilahi dan tanggung jawab manusia. Catatan kaki mempertahankan nuansa tujuan negatif yang dapat dikandung μήποτε tanpa menjadikannya satu-satunya penafsiran.
- issue: Makna ἐπιστρέψωσιν
  choice: berbalik
  alternative: kembali; bertobat
  rationale: “Berbalik” mempertahankan citra sumber dan makna yang mengarah pada pertobatan tanpa memasukkan rumusan teologis yang lebih sempit daripada kata Yunani itu sendiri.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur paralel mata–telinga–hati dipertahankan, sedangkan ungkapan harfiah yang kaku “mendengar dengan berat” dialihkan menjadi “sulit mendengar” agar mudah dipahami. Kapital pada “Aku” menandai Allah sebagai pembicara dalam kutipan.
