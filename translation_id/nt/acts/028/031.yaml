id: ACT.28.31
reference: Acts 28:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κηρύσσων τὴν βασιλείαν τοῦ θεοῦ καὶ διδάσκων τὰ περὶ τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ πάσης παρρησίας ἀκωλύτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/031.yaml
  text: proclaiming the kingdom of God and teaching the things concerning the Lord Jesus the Messiah with all boldness[a], unhindered.
translation:
  language: id
  text: memberitakan Kerajaan Allah dan mengajarkan hal-hal mengenai Tuhan Yesus Sang Mesias,[a] dengan penuh keberanian dan tanpa halangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tuhan Yesus Kristus.” Kata Yunani Χριστός dapat berfungsi sebagai gelar (“Mesias”) atau, dalam konteks tertentu, sebagai sebutan yang menyerupai nama (“Kristus”).'
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσων
  choice: memberitakan
  rationale: Partisipel kini ini merangkum kegiatan Paulus yang terus berlangsung. 'Memberitakan' mempertahankan nuansa penyampaian di muka umum tanpa membatasinya pada khotbah formal.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ungkapan baku dan alami dalam bahasa Indonesia yang tetap dapat mencakup wilayah kerajaan maupun pemerintahan Allah.
- source_word: διδάσκων
  choice: mengajarkan
  rationale: Mencerminkan kegiatan mengajar yang berjalan sejajar dengan kegiatan memberitakan.
- source_word: τὰ περὶ
  choice: segala sesuatu tentang
  rationale: Mengungkapkan konstruksi Yunani secara alami dan jelas dalam bahasa Indonesia tanpa menguraikan isinya melebihi teks.
- source_word: κυρίου
  choice: Tuhan
  rationale: Mempertahankan κύριος sebagai gelar kristologis yang lazim dalam Perjanjian Baru.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus, Sang Mesias
  rationale: Menerjemahkan Χριστός sebagai gelar bermakna, sedangkan tanda koma dan 'Sang' membuat hubungan gelarnya jelas dan idiomatis dalam bahasa Indonesia.
- source_word: μετὰ πάσης παρρησίας
  choice: dengan penuh keberanian
  rationale: Menyampaikan gagasan berbicara secara terbuka, bebas, dan berani; 'penuh' membawa daya penguat πάσης secara alami.
- source_word: ἀκωλύτως
  choice: tanpa halangan
  rationale: Penutup yang ringkas dan alami, serta mempertahankan penekanan bahwa pelayanan pemberitaan itu tidak dicegah.
theological_decisions:
- issue: Pemaknaan Χριστός dalam rangkaian gelar kristologis
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam konteks ini Χριστός masih dapat terdengar sebagai gelar yang bermakna. Terjemahan utama menyatakan makna gelar tersebut, sementara bentuk tradisional 'Kristus' dipertahankan dalam catatan karena kata Yunani itu juga dapat berfungsi sebagai sebutan yang menyerupai nama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur dua kegiatan Paulus dipertahankan, sedangkan ungkapan penutup dibuat alami dan tegas. Penanda catatan kaki [a] ditempatkan langsung sesudah gelar yang dijelaskan.
