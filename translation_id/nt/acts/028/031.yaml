  terminology: '"Kerajaan Allah," "Tuhan," and "Sang Mesias" appropriately render βασιλεία τοῦ θεοῦ, κύριος, and Χριστός. The alternative "Tuhan Yesus Kristus" is accurately retained in the footnote.'
