id: ACT.28.17
reference: Acts 28:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς συγκαλέσασθαι ⸀αὐτὸν τοὺς ὄντας τῶν Ἰουδαίων πρώτους· συνελθόντων δὲ αὐτῶν ἔλεγεν πρὸς αὐτούς· ⸂Ἐγώ, ἄνδρες ἀδελφοί⸃, οὐδὲν ἐναντίον ποιήσας τῷ λαῷ ἢ τοῖς ἔθεσι τοῖς πατρῴοις δέσμιος ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/017.yaml
  text: It happened that after three days he called together the leading men of the Jews[a]. And when they had come together, he said to them, “I, brothers, though I had done nothing against the people or the customs of our fathers[d][c][b], was delivered as a prisoner from Jerusalem into the hands of the Romans.”
translation:
  language: id
  text: Tiga hari kemudian, Paulus memanggil para pemimpin orang Yahudi[a] untuk berkumpul. Setelah mereka berkumpul, ia berkata kepada mereka, “Saudara-saudara, saya tidak berbuat apa pun yang menentang bangsa Yahudi atau adat istiadat nenek moyang[c]; namun saya diserahkan sebagai tahanan dari Yerusalem ke tangan orang-orang Romawi[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang terkemuka di antara orang Yahudi.”
    reason: lexical_alternative
  - marker: c
    text: Atau “adat istiadat warisan leluhur.”
    reason: lexical_alternative
  - marker: d
    text: Ungkapan Yunani secara lebih harfiah berbunyi “diserahkan ... ke tangan orang-orang Romawi.”
    reason: lexical_note
lexical_decisions:
- source_word: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς
  choice: Tiga hari kemudian
  rationale: Mengungkapkan peralihan naratif dan keterangan waktu secara alami dalam bahasa Indonesia tanpa menambahkan kata penanda waktu yang tidak eksplisit.
- source_word: συγκαλέσασθαι αὐτὸν
  choice: Paulus memanggil ... untuk berkumpul
  rationale: Nama Paulus dipakai untuk memperjelas acuan pronomina dalam kutipan ayat tunggal; ungkapan ini mempertahankan unsur memanggil dan menghimpunkan.
- source_word: τοὺς ὄντας τῶν Ἰουδαίων πρώτους
  choice: para pemimpin orang Yahudi
  rationale: πρώτους menunjuk pada kedudukan atau keutamaan sosial, bukan urutan waktu.
- source_word: συνελθόντων δὲ αὐτῶν
  choice: Setelah mereka berkumpul
  rationale: Genitivus absolutus dialihkan menjadi anak kalimat temporal yang alami.
- source_word: Ἐγώ, ἄνδρες ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan ini menyatakan rasa hormat dan solidaritas kepada para pemimpin laki-laki Yahudi; pronomina orang pertama diteruskan oleh 'saya' dalam klausa berikutnya.
- source_word: οὐδὲν ἐναντίον ποιήσας
  choice: meskipun saya tidak berbuat apa pun yang menentang
  rationale: Partisip dipahami secara konsesif sesuai kontras antara pengakuan tidak bersalah dan penyerahan Paulus.
- source_word: τῷ λαῷ
  choice: bangsa kita
  rationale: λαός di sini menunjuk pada bangsa Yahudi. 'Kita' membuat solidaritas Paulus dengan para pendengarnya yang tersirat dalam konteks menjadi alami dalam bahasa Indonesia.
- source_word: τοῖς ἔθεσι τοῖς πατρῴοις
  choice: adat istiadat nenek moyang
  rationale: Menyampaikan kebiasaan warisan leluhur secara alami dan bermartabat.
- source_word: δέσμιος
  choice: sebagai tahanan
  rationale: Menjelaskan status Paulus ketika diserahkan dalam konteks hukum dan penahanan.
- source_word: ἐξ Ἱεροσολύμων
  choice: dari Yerusalem
  rationale: Padanan langsung untuk asal atau titik pemberangkatan.
- source_word: παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων
  choice: saya diserahkan ... ke tangan orang-orang Romawi
  rationale: Mempertahankan bentuk pasif dan idiom 'ke tangan' dari bahasa Yunani, sekaligus tetap jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Sapaan ἀδελφοί kepada para pemimpin Yahudi
  choice: Saudara-saudara
  alternative: Saudara-saudara sekalian; Bapak-bapak dan saudara-saudara
  rationale: Sapaan Indonesia ini wajar, menjaga solidaritas persaudaraan, dan tidak memperluas rujukan kepada perempuan ketika konteks secara khusus menyebut para pemimpin laki-laki.
- issue: Daya partisip οὐδὲν ἐναντίον ποιήσας
  choice: 'konsesif: ''meskipun saya tidak berbuat apa pun'''
  alternative: 'temporal/keadaan penyerta: ''setelah/tanpa berbuat apa pun'''
  rationale: Konteks menonjolkan ketegangan antara tidak adanya pelanggaran dan penyerahan Paulus kepada pihak Romawi, tanpa menambahkan penilaian teologis.
- issue: Cakupan τῷ λαῷ
  choice: bangsa kita
  alternative: bangsa itu; umat ini
  rationale: Rujukannya adalah bangsa Yahudi, dan bentuk inklusif mencerminkan solidaritas Paulus dengan para pemimpin Yahudi. Catatan tidak diperlukan karena konteks cukup jelas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Saya' dipilih dalam ujaran Paulus sebagai sapaan formal kepada para pemimpin yang baru ditemuinya. Susunan kalimat dibuat alami tanpa menghilangkan bentuk pasif, kontras konsesif, atau idiom hukum-penahanan dalam sumber.
