  to: Tiga hari kemudian, Paulus memanggil para pemimpin orang Yahudi[a] untuk berkumpul. Setelah mereka berkumpul, ia berkata kepada mereka, “Saudara-saudara, saya tidak berbuat apa pun yang menentang bangsa Yahudi atau adat istiadat nenek moyang[c]; namun saya diserahkan sebagai tahanan dari Yerusalem ke tangan orang-orang Romawi[d].”
  rationale: Teks direvisi untuk tidak menambahkan “kita” pada τῷ λαῷ, untuk menampilkan penegasan “saya” dari Ἐγώ secara lebih langsung, dan untuk memperbaiki uraian bentuk sapaan Yunani dalam catatan b. Konjungsi “namun” menyampaikan daya konsesif partisip tanpa mengubah makna. Catatan b dipertahankan sebagai bagian dari set catatan lengkap, tetapi tidak diberi jangkar karena teks utama tidak memerlukan catatan tersebut.
