id: ACT.28.4
reference: Acts 28:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς δὲ εἶδον οἱ βάρβαροι κρεμάμενον τὸ θηρίον ἐκ τῆς χειρὸς αὐτοῦ, ⸂πρὸς ἀλλήλους ἔλεγον⸃· Πάντως φονεύς ἐστιν ὁ ἄνθρωπος οὗτος ὃν διασωθέντα ἐκ τῆς θαλάσσης ἡ δίκη ζῆν οὐκ εἴασεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/004.yaml
  text: When the islanders saw the creature hanging from his hand[a], they said to one another, “Surely this man is a murderer, whom Justice has not allowed to live[d][c][b], though he was brought safely from the sea.”
translation:
  language: id
  text: Ketika penduduk pulau itu melihat binatang itu tergantung pada tangan Paulus, mereka berkata seorang kepada yang lain, “Orang ini pasti seorang pembunuh. Meskipun ia telah selamat dari laut, Keadilan[a] tidak membiarkannya tetap hidup.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Keadilan” menerjemahkan kata Yunani dikē, yang di sini tampaknya dipersonifikasikan sebagai kuasa yang membalas kejahatan; mungkin juga menunjuk kepada sosok dewi dalam kepercayaan penduduk pulau itu.
    reason: cultural_note
lexical_decisions:
- source_word: βάρβαροι
  choice: penduduk pulau itu
  rationale: Istilah Yunani ini menunjuk kepada penduduk setempat yang tidak berbahasa Yunani, bukan menyatakan bahwa mereka biadab. Konteks Malta membuat ‘penduduk pulau itu’ jelas dan alami.
- source_word: κρεμάμενον
  choice: tergantung
  rationale: Partisip ini menggambarkan binatang itu menggantung atau melekat pada tangan Paulus; ‘tergantung’ mempertahankan gambaran tanpa menentukan posturnya secara berlebihan.
- source_word: τὸ θηρίον
  choice: binatang tersebut
  rationale: Nomina ini bersifat umum, berarti binatang atau makhluk. Konteks sebelumnya mengidentifikasinya sebagai ular berbisa, tetapi ayat ini memakai istilah umum.
- source_word: πρὸς ἀλλήλους ἔλεγον
  choice: mereka berkata satu sama lain
  rationale: Ungkapan ini mempertahankan unsur timbal balik secara jelas; bentuk imperfek dapat menyiratkan percakapan yang berlangsung, tetapi bentuk sederhana lebih alami dalam bahasa Indonesia.
- source_word: Πάντως
  choice: pasti
  rationale: Adverbia ini menyatakan kesimpulan yang dianggap kuat atau pasti oleh para penutur.
- source_word: φονεύς
  choice: seorang pembunuh
  rationale: Padanan langsung dan umum bagi orang yang melakukan pembunuhan.
- source_word: διασωθέντα
  choice: telah selamat
  rationale: Partisip pasif ini menekankan bahwa orang tersebut berhasil melewati bahaya dengan selamat. Dalam bahasa Indonesia, ‘telah selamat’ alami dan tidak harus mengandung makna keselamatan rohani.
- source_word: ἡ δίκη
  choice: Keadilan
  rationale: Huruf kapital menandai bahwa keadilan dipersonifikasikan sebagai kuasa pembalas dalam pandangan para penduduk, tanpa secara eksplisit menetapkannya sebagai nama dewi.
- source_word: ζῆν οὐκ εἴασεν
  choice: tidak membiarkannya tetap hidup
  rationale: Ungkapan ini berarti tidak mengizinkan orang itu terus hidup; ‘tetap hidup’ menyampaikan aspek keberlanjutan secara alami.
- source_word: ἐκ τῆς θαλάσσης
  choice: dari laut
  rationale: Preposisi ἐκ menyatakan asal atau keluarnya dari laut. Bersama ‘telah selamat’, frasa ini secara alami menyampaikan bahwa ia lolos dari bencana di laut.
theological_decisions:
- issue: Personifikasi δίκη
  choice: Keadilan dengan huruf kapital
  alternative: keadilan; pembalasan; Dewi Keadilan
  rationale: Teks melaporkan keyakinan penduduk pulau tentang keadilan pembalas yang dipersonifikasikan. Huruf kapital mempertahankan nuansa itu tanpa menyatakan bahwa narator membenarkan keyakinan tersebut atau tanpa memastikan identitas mitologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama Paulus dipakai untuk memperjelas rujukan pronomina dalam konteks ayat tunggal. Susunan kalimat langsung dipecah menjadi dua kalimat agar alami, sementara hubungan konsesif dan personifikasi dalam sumber tetap dipertahankan.
