reference: Acts 28:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: συστρέψαντος δὲ τοῦ Παύλου φρυγάνων ⸀τι πλῆθος καὶ ἐπιθέντος ἐπὶ τὴν πυράν, ἔχιδνα ⸀ἀπὸ τῆς θέρμης ⸀ἐξελθοῦσα καθῆψε τῆς χειρὸς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/003.yaml
  text: But when Paul had gathered a bundle of sticks and put them on the fire[b][a], a viper came out because of the heat and fastened onto his hand.
translation:
  language: id
  text: Ketika Paulus mengumpulkan sejumlah ranting kering dan menaruhnya di atas api, seekor ular berbisa keluar karena panasnya[a] lalu melekat pada tangannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “keluar dari panas itu.” Kata depan Yunani dapat diterjemahkan secara lebih harfiah demikian, meskipun di sini kemungkinan besar menyatakan sebab: ular itu keluar akibat panas api.'
    reason: lexical_alternative
  - marker: b
    text: Atau “mencengkeram tangannya” atau “menggigit tangannya.” Kata kerja Yunani memiliki arti yang lebih luas, yaitu “melekat pada” atau “berpegang pada.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συστρέψαντος
  choice: mengumpulkan
  rationale: Partisip aoris dalam konstruksi genitif absolut menyatakan tindakan Paulus yang mendahului peristiwa utama. Dalam konteks bahan bakar, maknanya ialah mengumpulkan, bukan secara harfiah memilin.
- source_word: φρυγάνων τι πλῆθος
  choice: sejumlah ranting kering
  rationale: φρύγανα menunjuk pada ranting atau semak kering yang dipakai sebagai bahan bakar, sedangkan τι πλῆθος menyatakan jumlah yang tidak tentu. Ungkapan ini alami dan tidak mengandaikan bahwa ranting-ranting itu telah diikat menjadi satu berkas.
- source_word: ἐπιθέντος ἐπὶ τὴν πυράν
  choice: menaruhnya di atas api
  rationale: Terjemahan ini menyampaikan tindakan meletakkan bahan bakar pada api dengan bahasa Indonesia modern dan wajar.
- source_word: ἔχιδνα
  choice: ular berbisa
  rationale: ἔχιδνα menunjuk pada jenis ular berbisa, bukan sekadar ular secara umum. 'Ular berbisa' lebih mudah dipahami pembaca Indonesia daripada nama jenis 'beludak' yang dapat terasa kurang umum atau terlalu spesifik secara zoologis.
- source_word: ἀπὸ τῆς θέρμης
  choice: karena panasnya
  rationale: 'ἀπό secara harfiah dapat berarti ''dari'', tetapi dalam konteks ini kemungkinan besar menyatakan sebab: ular itu keluar akibat panas api. Ambiguitas sumber dipertahankan dalam catatan kaki.'
- source_word: ἐξελθοῦσα
  choice: keluar
  rationale: Partisip aoris yang menerangkan ular itu disampaikan secara alami sebagai rangkaian tindakan dalam bahasa Indonesia.
- source_word: καθῆψε τῆς χειρὸς αὐτοῦ
  choice: melekat pada tangannya
  rationale: καθάπτω berarti berpegang, melekat, atau mencengkeram. 'Melekat pada' mempertahankan gambaran umum verba itu tanpa memastikan bahwa yang dimaksud secara khusus adalah menggigit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. 'Ranting kering' dipilih sebagai istilah bahan bakar yang konkret dan umum; 'ular berbisa' menghindari istilah zoologis yang kurang dikenal. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskan.
