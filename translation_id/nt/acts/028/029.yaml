  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara nuansa kuat pada πολλήν συζήτησιν dipertahankan melalui 'perdebatan sengit'. Penanda catatan ditempatkan setelah klausa ujaran karena catatan tersebut menyangkut keseluruhan ayat.
