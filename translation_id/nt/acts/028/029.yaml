  text: And when he had [a]said these things, the Jews departed, having a great dispute among themselves.
translation:
  language: id
  text: Setelah Paulus mengatakan hal-hal itu,[a] orang-orang Yahudi pergi sambil terlibat dalam perdebatan sengit di antara mereka sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Seluruh ayat ini tidak terdapat dalam naskah-naskah Yunani tertua, termasuk Papirus 74 dari abad ke-3, Kodeks Sinaiticus dari abad ke-4, dan Kodeks Vaticanus dari abad ke-4, maupun dalam terjemahan-terjemahan Koptik awal. Ayat ini terdapat dalam tradisi mayoritas Bizantin serta terjemahan-terjemahan Latin dan Suryani awal. Kemungkinan besar ayat ini merupakan tambahan penyalin pada masa kemudian untuk melengkapi kisah kepergian orang-orang Yahudi.
    reason: textual_critical
lexical_decisions:
- source_word: συζήτησις
  choice: perdebatan sengit
  rationale: Kata ini dapat berarti pembahasan, perdebatan, atau pertengkaran. Dalam konteks tanggapan mereka yang terpecah terhadap perkataan Paulus, frasa ini menyampaikan kuatnya perselisihan tanpa mengharuskan adanya pertengkaran terbuka.
- source_word: ἀπῆλθον (ἀπέρχομαι)
  choice: pergi
  rationale: Padanan Indonesia yang alami dan langsung untuk tindakan meninggalkan tempat itu; lebih wajar dalam narasi modern daripada 'berangkat' atau 'meninggalkan tempat itu'.
- source_word: ἐν ἑαυτοῖς
  choice: di antara mereka sendiri
  rationale: Mempertahankan penekanan refleksif bahwa perdebatan berlangsung dalam kelompok orang-orang Yahudi tersebut.
- source_word: πολλὴν ἔχοντες
  choice: sambil terlibat dalam ... sengit
  rationale: Secara idiomatis menyampaikan konstruksi partisipial Yunani yang secara harfiah berarti 'dengan mempunyai perdebatan besar', dan menunjukkan keadaan yang menyertai kepergian mereka.
