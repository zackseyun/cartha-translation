    text: Secara harfiah, βάρβαροι berarti “orang-orang barbar”, yaitu orang-orang yang tidak berbahasa Yunani. Di sini istilah itu menunjuk kepada penduduk setempat di pulau tersebut dan tidak harus menyiratkan bahwa mereka biadab.
    reason: lexical_alternative
  - marker: b
    text: Atau, “menunjukkan kebaikan yang tidak biasa kepada kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βάρβαροι
  choice: penduduk setempat
  rationale: Istilah ini menunjuk kepada orang-orang yang tidak berbahasa Yunani, yakni penduduk pulau itu, tanpa harus bermakna biadab. Pilihan ini alami dalam bahasa Indonesia modern dan menghindari kesan merendahkan dari 'orang barbar'.
- source_word: οὐ τὴν τυχοῦσαν φιλανθρωπίαν
  choice: kebaikan yang luar biasa
  rationale: Ungkapan Yunani ini secara idiomatis berarti kebaikan yang bukan biasa-biasa saja. Terjemahan ini menyampaikan intensitasnya dengan jelas dan alami.
- source_word: παρεῖχον
  choice: menunjukkan
  rationale: Bersama kata φιλανθρωπίαν, kata kerja ini secara alami berarti menunjukkan atau memberikan kebaikan.
- source_word: ἅψαντες πυρὰν
  choice: menyalakan api
  rationale: Partisip ἅψαντες dengan πυράν menyatakan tindakan menyalakan api; bentuk verbal biasa lebih alami dalam narasi bahasa Indonesia.
- source_word: προσελάβοντο
  choice: menyambut
  rationale: Dalam konteks keramahan, kata ini berarti menerima dengan baik atau menyambut, bukan secara khusus menyediakan penginapan.
- source_word: πάντας ἡμᾶς
  choice: kami semua
  rationale: Susunan ini mempertahankan penekanan bahwa seluruh rombongan diterima.
- source_word: διὰ τὸν ὑετὸν τὸν ἐφεστῶτα
  choice: karena hujan yang sedang turun
  rationale: Partisip ἐφεστῶτα menggambarkan hujan yang telah datang dan masih berlangsung. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan keadaan yang sedang dialami.
- source_word: διὰ τὸ ψῦχος
  choice: karena udara dingin
  rationale: ψῦχος menunjuk pada hawa atau keadaan dingin; 'udara dingin' terdengar alami dalam konteks cuaca.
