id: ACT.28.13
reference: Acts 28:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅθεν ⸀περιελόντες κατηντήσαμεν εἰς Ῥήγιον. καὶ μετὰ μίαν ἡμέραν ἐπιγενομένου νότου δευτεραῖοι ἤλθομεν εἰς Ποτιόλους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/013.yaml
  text: From there[a], after weighing anchor, we came to Rhegium. And after one day, when a south wind came up, on the second day we came to Puteoli,
translation:
  language: id
  text: Dari sana, setelah mengangkat sauh[a], kami tiba di Regium. Setelah satu hari, ketika angin selatan mulai bertiup, pada hari kedua kami tiba di Puteoli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mulai berlayar.” Partisip Yunani περιελόντες merupakan istilah pelayaran dan mungkin secara khusus berarti mengangkat sauh atau secara lebih umum bertolak ke laut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Dari sana
  rationale: Ungkapan peralihan tempat yang alami dalam narasi dan mempertahankan acuan spasial teks Yunani.
- source_word: περιελόντες
  choice: setelah mengangkat sauh
  rationale: Dalam konteks pelayaran, bentuk partisip ini menunjuk pada tindakan melepaskan kapal untuk berangkat, kemungkinan khususnya dengan mengangkat sauh. Kemungkinan makna yang lebih umum dicatat dalam catatan kaki.
- source_word: κατηντήσαμεν
  choice: kami tiba
  rationale: Kata kerja ini menyatakan sampainya orang pada suatu tujuan; 'tiba' alami dan tepat dalam bahasa Indonesia.
- source_word: Ῥήγιον
  choice: Regium
  rationale: Bentuk nama tempat kuno yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: μετὰ μίαν ἡμέραν
  choice: Setelah satu hari
  rationale: Mempertahankan susunan dan nilai waktu ungkapan Yunani tanpa menyamakannya secara tidak perlu dengan 'keesokan harinya'.
- source_word: ἐπιγενομένου νότου
  choice: ketika angin selatan mulai bertiup
  rationale: Menyampaikan konstruksi genitif absolut sebagai keadaan yang muncul; ungkapan ini alami untuk datangnya angin dalam bahasa Indonesia.
- source_word: δευτεραῖοι
  choice: pada hari kedua
  rationale: Mempertahankan penandaan eksplisit tentang hari kedua dan tidak mengurangi ketepatannya menjadi sekadar 'hari berikutnya'.
- source_word: ἤλθομεν
  choice: kami tiba
  rationale: Walaupun secara dasar berarti 'datang', bersama tujuan geografis kata ini secara alami menyatakan kedatangan dalam bahasa Indonesia.
- source_word: Ποτιόλους
  choice: Puteoli
  rationale: Mempertahankan bentuk baku nama tempat kuno yang dikenal secara internasional.
