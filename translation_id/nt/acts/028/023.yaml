id: ACT.28.23
reference: Acts 28:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ταξάμενοι δὲ αὐτῷ ἡμέραν ⸀ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν πλείονες, οἷς ἐξετίθετο διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ πείθων τε ⸀αὐτοὺς περὶ τοῦ Ἰησοῦ ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν ἀπὸ πρωῒ ἕως ἑσπέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/023.yaml
  text: After they had arranged a day with him[a], more of them came to him at his lodging. To them he was explaining, solemnly testifying about the kingdom of God and persuading them concerning Jesus from both the Law of Moses and the Prophets[c][b], from morning until evening.
translation:
  language: id
  text: Setelah mereka menetapkan suatu hari bersama Paulus, lebih banyak orang datang kepadanya di tempat ia menginap.[a] Ia menjelaskan kepada mereka sambil dengan sungguh-sungguh memberi kesaksian tentang Kerajaan Allah dan berusaha meyakinkan mereka tentang Yesus berdasarkan Hukum Musa dan para nabi, dari pagi sampai petang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke penginapannya” atau “ke tempat tinggal sementaranya.” Kata Yunani yang digunakan menunjuk pada penginapan atau akomodasi.
    reason: lexical_alternative
  - marker: b
    text: Atau “ia meyakinkan mereka tentang Yesus.” Partisipel Yunani ini dapat menekankan tindakan meyakinkan ataupun usaha untuk meyakinkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενοι ... αὐτῷ ἡμέραν
  choice: Setelah mereka menetapkan suatu hari bersama Paulus
  rationale: Ungkapan ini berarti menetapkan hari pertemuan. Nama Paulus dipakai untuk memperjelas rujukan pronomina secara alami dalam bahasa Indonesia.
- source_word: εἰς τὴν ξενίαν
  choice: ke tempat ia menginap
  rationale: ξενία menunjuk pada penginapan atau tempat tinggal sementara; pilihan ini alami dan tidak menentukan jenis tempatnya secara berlebihan.
- source_word: πλείονες
  choice: lebih banyak orang
  rationale: Mempertahankan bentuk komparatif Yunani, yang menunjukkan jumlah lebih besar daripada pertemuan sebelumnya.
- source_word: ἐξετίθετο
  choice: ia menguraikan
  rationale: Imperfek menggambarkan penjelasan yang berlangsung; 'menguraikan' sesuai dengan paparan panjang berdasarkan Kitab Suci.
- source_word: διαμαρτυρόμενος
  choice: memberikan kesaksian yang sungguh-sungguh
  rationale: Menjaga unsur kesaksian yang kuat atau khidmat tanpa memakai ungkapan yang kaku.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Padanan baku, transparan, dan teologis yang tidak menambahkan penafsiran.
- source_word: πείθων τε αὐτοὺς
  choice: ia berusaha meyakinkan mereka
  rationale: Menampilkan kegiatan persuasif yang sedang berlangsung tanpa menyatakan bahwa semua pendengar benar-benar berhasil diyakinkan.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: tentang Yesus
  rationale: Padanan Indonesia yang langsung dan alami.
- source_word: ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν
  choice: Berdasarkan Hukum Musa dan Kitab Para Nabi
  rationale: ἀπό menyatakan sumber atau dasar argumentasi. 'Kitab Para Nabi' memperjelas bahwa yang dimaksud ialah bagian Kitab Suci.
- source_word: ἀπὸ πρωῒ ἕως ἑσπέρας
  choice: dari pagi sampai petang
  rationale: Menyampaikan rentang waktu secara tepat dan idiomatis tanpa mempersempit πρωῒ menjadi fajar.
theological_decisions:
- issue: Hubungan kesaksian tentang Kerajaan Allah dengan upaya meyakinkan tentang Yesus
  choice: Keduanya disajikan sebagai bagian dari satu paparan berkelanjutan yang didasarkan pada Hukum Musa dan Kitab Para Nabi.
  alternative: Menganggap Kerajaan Allah dan Yesus sebagai dua pokok terpisah yang tidak memiliki hubungan langsung.
  rationale: Susunan Yunani menghubungkan kesaksian tentang Kerajaan Allah dan persuasi mengenai Yesus dalam satu kegiatan penguraian, tetapi terjemahan tidak merumuskan sistem teologis yang melampaui ayat.
- issue: Hasil dari πείθων
  choice: berusaha meyakinkan
  alternative: meyakinkan
  rationale: Partisipel dapat menggambarkan tindakan atau usaha persuasi. Karena konteks berikutnya menunjukkan tanggapan yang terbagi, pilihan ini menjaga agar keberhasilan universal tidak tersirat; catatan kaki mempertahankan alternatif yang lebih formal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kalimat Yunani yang panjang dibagi menjadi dua agar mudah dipahami, sambil mempertahankan hubungan antara penguraian, kesaksian, persuasi, dasar Kitab Suci, dan rentang waktunya.
