  terminology: “Kerajaan Allah,” “Hukum Musa,” dan “Yesus” sudah tepat. “Para nabi” menerjemahkan τῶν προφητῶν secara langsung tanpa menambahkan kata “Kitab,” yang tidak ada dalam teks Yunani meskipun yang dimaksud jelas kesaksian para nabi dalam Kitab Suci.
