  to: Setelah mereka menetapkan suatu hari bersama Paulus, lebih banyak orang datang kepadanya di tempat ia menginap.[a] Ia menjelaskan kepada mereka sambil dengan sungguh-sungguh memberi kesaksian tentang Kerajaan Allah dan berusaha meyakinkan mereka tentang Yesus berdasarkan Hukum Musa dan para nabi, dari pagi sampai petang.[b]
