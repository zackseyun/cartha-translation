  text: ⸀λέγων· Πορεύθητι πρὸς τὸν λαὸν τοῦτον καὶ εἰπόν· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/026.yaml
  text: 'saying[a], ‘Go to this people and say: You will indeed hear, but you will never understand; and seeing, you will indeed see[b], but you will never perceive.’'
translation:
  language: id
  text: 'sambil berkata, “Pergilah kepada bangsa ini dan katakanlah: ‘Kamu pasti akan mendengar, tetapi sama sekali tidak akan mengerti; dan sambil melihat, kamu akan melihat, tetapi sama sekali tidak akan memahami.[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Dengan pendengaran kamu akan mendengar, tetapi sama sekali tidak akan mengerti; dan sambil melihat kamu akan melihat, tetapi sama sekali tidak akan melihat.” Pengulangan kata-kata serumpun merupakan bentuk penegasan bercorak Ibrani dalam kutipan dari Yesaya; verba terakhir juga dapat bermakna memahami atau menangkap apa yang dilihat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: dengan berkata
  rationale: Partisipel kini ini menghubungkan kutipan dengan klausa sebelumnya; bentuk ini mempertahankan hubungan partisipial secara wajar dalam bahasa Indonesia.
- source_word: Πορεύθητι
  choice: Pergilah
  rationale: Imperatif pergerakan ini paling alami dan tepat diterjemahkan sebagai perintah langsung.
- source_word: λαὸν τοῦτον
  choice: bangsa ini
  rationale: λαός menunjuk suatu kelompok kolektif; dalam konteks kutipan kenabian tentang Israel, 'bangsa ini' terdengar alami dan mempertahankan nuansa kolektif.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Kamu akan terus mendengar
  rationale: Gabungan nomina dan verba serumpun memberi penegasan berlanggam Semitis. 'Terus mendengar' menyampaikan tindakan berulang atau berkepanjangan tanpa menghasilkan pengertian.
- source_word: οὐ μὴ συνῆτε
  choice: sama sekali tidak akan mengerti
  rationale: οὐ μή dengan bentuk subjungtif merupakan penyangkalan yang sangat tegas; 'sama sekali tidak' mempertahankan kekuatan itu.
- source_word: βλέποντες βλέψετε
  choice: kamu akan terus melihat
  rationale: Partisipel dan verba serumpun membentuk kesejajaran emphatik dengan ungkapan tentang mendengar. Terjemahan ini alami sekaligus mempertahankan gagasan melihat berulang kali.
- source_word: οὐ μὴ ἴδητε
  choice: sama sekali tidak akan memahami
  rationale: Walaupun verba ini secara leksikal dapat berarti 'melihat', dalam pertentangan ini ia juga dapat menunjuk pada penangkapan makna batiniah; 'memahami' menyampaikan fungsi kontekstual tersebut.
theological_decisions:
- issue: Kegagalan indrawi atau kegagalan memahami dalam kutipan Yesaya
  choice: Menerjemahkan verba terakhir sebagai 'memahami' sambil mencatat arti harfiahnya 'melihat'.
  alternative: Menerjemahkan verba terakhir sebagai 'melihat' untuk mempertahankan pengulangan leksikal sepenuhnya.
  rationale: Konteks mempertentangkan kegiatan mendengar dan melihat dengan kegagalan menangkap maknanya. Terjemahan utama menyatakan dimensi batiniah itu, sedangkan catatan kaki mempertahankan ambiguitas dan pengulangan verba penglihatan dalam bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada kenabian yang lugas dan bermartabat. Sapaan 'kamu' mengikuti bentuk jamak dalam bahasa Yunani dan cocok bagi alamat kolektif; 'bangsa ini' mempertahankan acuan kolektif λαός.
