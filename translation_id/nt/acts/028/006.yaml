id: ACT.28.6
reference: Acts 28:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ προσεδόκων αὐτὸν μέλλειν πίμπρασθαι ἢ καταπίπτειν ἄφνω νεκρόν. ἐπὶ πολὺ δὲ αὐτῶν προσδοκώντων καὶ θεωρούντων μηδὲν ἄτοπον εἰς αὐτὸν γινόμενον, ⸀μεταβαλόμενοι ἔλεγον ⸂αὐτὸν εἶναι θεόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/006.yaml
  text: But they were expecting him to swell up or suddenly fall down dead. But after they had waited a long time and saw that nothing unusual was happening to him[a], they changed their minds and began saying that he was a god.
translation:
  language: id
  text: Namun, mereka menyangka bahwa ia akan membengkak atau tiba-tiba rebah dan mati. Setelah lama menunggu dan melihat bahwa tidak terjadi apa pun yang luar biasa pada dirinya[a], mereka berubah pikiran dan mulai berkata bahwa ia adalah dewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak terjadi apa pun yang aneh pada dirinya” atau “tidak terjadi apa pun yang tidak beres pada dirinya.”
    reason: Alternatif leksikal untuk μηδὲν ἄτοπον, yang dapat menunjuk pada sesuatu yang aneh, tidak lazim, atau tidak beres.
lexical_decisions:
- source_word: προσεδόκων
  choice: mereka menyangka
  rationale: Bentuk imperfek menunjukkan dugaan yang terus berlangsung ketika mereka mengamati Paulus; 'menyangka' alami dalam bahasa Indonesia untuk harapan akan akibat buruk.
- source_word: μέλλειν πίμπρασθαι
  choice: akan membengkak
  rationale: Dalam konteks gigitan ular, πίμπρασθαι menunjuk pada pembengkakan tubuh, sedangkan μέλλειν menyatakan akibat yang diperkirakan segera terjadi.
- source_word: καταπίπτειν ἄφνω νεκρόν
  choice: tiba-tiba rebah dan mati
  rationale: Ungkapan ini mempertahankan unsur keruntuhan mendadak dan hasilnya, yaitu kematian, dalam susunan Indonesia yang wajar.
- source_word: ἐπὶ πολὺ ... προσδοκώντων
  choice: setelah lama menunggu
  rationale: Idiom ἐπὶ πολὺ menyatakan rentang waktu yang panjang, dan konstruksi partisipialnya paling alami dijadikan anak kalimat temporal.
- source_word: θεωρούντων
  choice: melihat
  rationale: Kata ini menyiratkan pengamatan saksama; dalam konteks gabungan ini, 'melihat' ringkas dan alami tanpa menghilangkan hasil pengamatan.
- source_word: μηδὲν ἄτοπον
  choice: tidak terjadi apa pun yang luar biasa
  rationale: ἄτοπον dapat berarti aneh, tidak lazim, atau tidak semestinya. Pilihan ini mempertahankan keluasan makna tanpa mempersempitnya menjadi hanya 'berbahaya'.
- source_word: μεταβαλόμενοι
  choice: mereka berubah pikiran
  rationale: Partisip medium ini menyatakan perubahan penilaian atau kesimpulan, bukan sekadar perubahan keadaan.
- source_word: ἔλεγον
  choice: mulai berkata
  rationale: Imperfek dapat bernuansa inkoatif atau berkelanjutan; 'mulai berkata' menandai munculnya kesimpulan baru setelah perubahan pikiran.
- source_word: θεόν
  choice: dewa
  rationale: Dalam latar politeistis dan tanpa artikel, θεόν merujuk pada salah satu sosok ilahi menurut anggapan penduduk, bukan mengidentifikasi Paulus sebagai Allah.
theological_decisions:
- issue: Cara menerjemahkan αὐτὸν εἶναι θεόν tanpa memasukkan klaim Kristen bahwa Paulus memiliki status ilahi
  choice: bahwa ia adalah dewa
  alternative: bahwa ia adalah Allah; bahwa ia bersifat ilahi
  rationale: Narasi melaporkan kesimpulan keliru penduduk setempat dalam kerangka politeistis. 'Dewa' membedakannya dengan jelas dari Allah dan tidak mengubah laporan itu menjadi pernyataan teologis Kristen.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. 'Ia' dipakai untuk kesinambungan narasi, sedangkan 'dewa' dipilih agar konteks kepercayaan politeistis penduduk tetap jelas.
