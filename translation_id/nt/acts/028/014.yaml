  text: οὗ εὑρόντες ἀδελφοὺς παρεκλήθημεν ⸀παρ’ αὐτοῖς ἐπιμεῖναι ἡμέρας ἑπτά· καὶ οὕτως εἰς τὴν Ῥώμην ἤλθαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/014.yaml
  text: There we found brothers, and we were invited to stay with them seven days. And so we came to Rome.
translation:
  language: id
  text: Di sana kami menemukan saudara-saudara[a], dan kami diminta untuk tinggal bersama mereka selama tujuh hari. Demikianlah kami sampai di Roma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudara-saudara”; dalam konteks ini kemungkinan besar yang dimaksud ialah sesama orang percaya, baik laki-laki maupun perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: Di sana
  rationale: Adverbia tempat ini merujuk kembali kepada Putioli yang disebut pada ayat sebelumnya; “Di sana” alami dalam bahasa Indonesia.
- source_word: εὑρόντες
  choice: kami menemukan
  rationale: Partisip aoris dengan subjek yang sama diungkapkan sebagai verba finit agar urutan tindakan jelas dan alami.
- source_word: ἀδελφοὺς
  choice: saudara-saudara seiman
  rationale: Dalam konteks perjalanan Kisah Para Rasul, kata ini menunjuk kepada anggota komunitas orang percaya, bukan saudara kandung; “seiman” memperjelas referennya tanpa menentukan jenis kelamin seluruh kelompok.
- source_word: παρεκλήθημεν
  choice: kami diminta
  rationale: Bentuk pasif παρακαλέω di sini menyatakan permintaan dari orang-orang percaya setempat. “Diminta” mempertahankan bentuk pasif dan tidak melebihkan nuansanya menjadi desakan.
- source_word: παρ’ αὐτοῖς ἐπιμεῖναι
  choice: untuk tinggal bersama mereka
  rationale: Gabungan ini menyatakan menetap sementara dalam kebersamaan atau sebagai tamu mereka.
- source_word: ἡμέρας ἑπτά
  choice: selama tujuh hari
  rationale: Bentuk akusatif menyatakan rentang waktu; “selama” membuat fungsi duratifnya jelas dalam bahasa Indonesia.
- source_word: καὶ οὕτως
  choice: Demikianlah
  rationale: Mengungkapkan cara atau hasil rangkaian perjalanan yang baru diceritakan, sekaligus menjaga hubungan dengan kalimat sebelumnya.
- source_word: εἰς τὴν Ῥώμην ἤλθαμεν
  choice: kami sampai di Roma
  rationale: ἔρχομαι dengan εἰς menunjukkan tercapainya tujuan; “sampai di Roma” paling alami dalam narasi perjalanan Indonesia.
theological_decisions:
- issue: Referen ἀδελφοὺς
  choice: sesama orang percaya dalam komunitas Kristen setempat
  alternative: saudara kandung atau sesama orang Yahudi secara umum
  rationale: Konteks penerimaan dan penginapan dalam narasi perjalanan Kisah Para Rasul paling kuat mendukung arti sesama orang percaya. Teks utama memakai “saudara-saudara seiman,” sementara catatan menjelaskan bentuk leksikal Yunani dan cakupan kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku yang modern, lugas, dan bermartabat. Struktur naratif orang pertama jamak dipertahankan; ungkapan perjalanan dibuat alami tanpa menghilangkan hubungan antarklausa Yunani.
