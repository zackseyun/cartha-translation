  text: Ὅτε δὲ ⸀εἰσήλθομεν εἰς Ῥώμην, ⸂ἐπετράπη τῷ Παύλῳ⸃ μένειν καθ’ ἑαυτὸν σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/016.yaml
  text: When we entered Rome[a], Paul was permitted to stay by himself with the soldier guarding him.
translation:
  language: id
  text: Ketika kami memasuki Roma, Paulus diizinkan tinggal sendiri dengan prajurit yang menjaganya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε
  choice: Ketika
  rationale: Konjungsi temporal ini memperkenalkan keadaan saat mereka memasuki Roma; “ketika” merupakan padanan Indonesia yang alami dan tepat.
- source_word: δὲ
  choice: —
  rationale: δέ berfungsi sebagai penghubung ringan dalam alur cerita. Dalam bahasa Indonesia modern, unsur ini dapat tidak diterjemahkan agar kalimat tetap wajar tanpa kehilangan makna.
- source_word: εἰσήλθομεν εἰς Ῥώμην
  choice: kami memasuki Roma
  rationale: Bentuk aoris εἰσέρχομαι dengan εἰς menyatakan gerak masuk. “Memasuki Roma” mempertahankan gambaran tersebut secara langsung.
- source_word: ἐπετράπη τῷ Παύλῳ
  choice: Paulus diizinkan
  rationale: Bentuk pasif ἐπιτρέπω menyatakan bahwa izin diberikan kepada Paulus. Susunan pasif ini dekat dengan bahasa sumber sekaligus alami dalam bahasa Indonesia.
- source_word: μένειν
  choice: tinggal
  rationale: Dalam konteks tempat kediaman selama penahanan, “tinggal” lebih alami daripada “tetap” atau “berdiam” dan tidak menentukan lamanya secara berlebihan.
- source_word: καθ’ ἑαυτὸν
  choice: sendiri
  rationale: Ungkapan ini berarti tinggal secara terpisah atau sendiri. Kata “sendiri” tidak menyiratkan bahwa Paulus sama sekali tanpa pendamping, sebab frasa berikutnya menyebut prajurit penjaganya.
- source_word: σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ
  choice: dengan prajurit yang menjaganya
  rationale: σύν menyatakan penyertaan, sedangkan partisipel kini φυλάσσοντι menggambarkan tugas prajurit itu. “Prajurit yang menjaganya” mempertahankan sifat tertentu dari prajurit yang ditugaskan tersebut tanpa memerlukan kata sandang yang tidak tersedia dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kalimat mengikuti alur Yunani tanpa menjadi kaku. Tidak diperlukan catatan kaki karena alternatif “tinggal sendiri dengan seorang prajurit yang menjaganya” tidak membawa perbedaan makna yang cukup berarti dalam bahasa Indonesia; ketiadaan kata sandang Indonesia juga mempertahankan keluwesan rujukan.
