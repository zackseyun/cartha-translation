  source_fidelity: 'Teks secara akurat menerjemahkan seluruh unsur utama Yunani: penanda waktu Ὅτε, subjek jamak orang pertama dalam “kami memasuki Roma,” izin pasif yang diberikan kepada Paulus, infinitif μένειν, keadaan καθ’ ἑαυτόν, dan penyertaan prajurit yang sedang menjaganya. “Tinggal sendiri dengan prajurit yang menjaganya” mempertahankan ketegangan yang disengaja dalam sumber: Paulus memiliki tempat tinggal terpisah, tetapi tetap berada di bawah penjagaan.'
