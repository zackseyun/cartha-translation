source:
  edition: SBLGNT
  text: οἵτινες ἀνακρίναντές με ἐβούλοντο ἀπολῦσαι διὰ τὸ μηδεμίαν αἰτίαν θανάτου ὑπάρχειν ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/018.yaml
  text: who[a], after examining me, wanted to release me because there was no basis for the death penalty in my case.
translation:
  language: id
  text: Setelah memeriksa saya, mereka hendak membebaskan saya karena dalam perkara saya tidak ada dasar untuk menjatuhkan hukuman mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena mereka tidak menemukan tuduhan terhadap saya yang patut dihukum mati.”
    reason: αἰτία dapat berarti “dasar/alasan” atau, dalam konteks peradilan, “tuduhan”; alternatif ini mempertahankan kemungkinan nuansa kedua.
lexical_decisions:
- source_word: οἵτινες
  choice: mereka
  rationale: Pronomina relatif Yunani melanjutkan rujukan kepada penguasa Romawi pada ayat sebelumnya. Dalam bahasa Indonesia, kalimat baru dengan “mereka” lebih alami tanpa menonjolkan nuansa kualitatif yang tidak kuat dalam konteks ini.
- source_word: ἀνακρίναντές με
  choice: Setelah memeriksa saya
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama; “memeriksa” mempertahankan konteks penyelidikan hukum tanpa memberi kesan interogasi keras yang tidak dinyatakan teks.
- source_word: ἐβούλοντο
  choice: hendak
  rationale: Bentuk imperfek menunjukkan kehendak atau niat pada masa lampau. “Hendak” sesuai dengan register naratif yang bermartabat dan tidak menyiratkan bahwa pembebasan itu benar-benar terlaksana.
- source_word: ἀπολῦσαι
  choice: membebaskan
  rationale: Dalam konteks hukum dan penahanan, kata ini berarti melepaskan atau membebaskan seseorang dari tahanan.
- source_word: διὰ τὸ ... ὑπάρχειν
  choice: karena ... tidak ada
  rationale: Konstruksi infinitif berartikula dengan διά menyatakan sebab; susunan ini menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: tidak ada dasar untuk menjatuhkan hukuman mati
  rationale: αἰτία dapat menunjuk pada alasan, dasar hukum, atau tuduhan, sedangkan θανάτου menunjukkan akibat berupa kematian. Pilihan utama mempertahankan nuansa yuridis tanpa membatasi αἰτία hanya pada “tuduhan”.
- source_word: ἐν ἐμοί
  choice: dalam perkara saya
  rationale: Secara harfiah berarti “dalam diri saya,” tetapi dalam konteks forensik frasa ini menunjuk pada perkara yang menyangkut Paulus. Terjemahan ini menghindari kesan bahwa yang dimaksud semata-mata kualitas batiniah.
