  text: τούτου ⸀δὲ γενομένου καὶ οἱ λοιποὶ οἱ ⸂ἐν τῇ νήσῳ ἔχοντες ἀσθενείας⸃ προσήρχοντο καὶ ἐθεραπεύοντο,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/009.yaml
  text: And after this happened[a], the rest of those on the island who had diseases also came and were healed.
translation:
  language: id
  text: Setelah hal itu terjadi, orang-orang lain di pulau itu yang menderita penyakit juga berdatangan dan disembuhkan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτου δὲ γενομένου
  choice: Setelah hal itu terjadi
  rationale: Ungkapan genitif absolut dengan δέ mengalihkan narasi sekaligus menunjukkan urutan waktu; bentuk ini alami dalam bahasa Indonesia dan tetap merujuk pada peristiwa sebelumnya.
- source_word: οἱ λοιποί
  choice: orang-orang lain
  rationale: Menunjuk kepada orang-orang selain kasus yang baru diceritakan. Pilihan ini lebih alami daripada 'sisanya' untuk menyebut manusia dalam konteks ini.
- source_word: οἱ ἐν τῇ νήσῳ
  choice: di pulau itu
  rationale: Frasa ini menerangkan lokasi kelompok tersebut; 'pulau itu' mempertahankan bentuk definit yang merujuk kepada Malta dalam konteks.
- source_word: ἔχοντες ἀσθενείας
  choice: yang menderita berbagai penyakit
  rationale: ἔχοντες secara harfiah berarti 'mempunyai', tetapi 'menderita' merupakan kolokasi Indonesia yang alami untuk penyakit. 'Berbagai' menyampaikan bentuk jamak ἀσθενείας tanpa menyiratkan bahwa setiap orang mengidap lebih dari satu penyakit.
- source_word: προσήρχοντο
  choice: berdatangan
  rationale: Bentuk imperfek menggambarkan kedatangan yang berlangsung atau berulang dari sejumlah orang; 'berdatangan' menyampaikan nuansa distributif tersebut tanpa menambahkan tujuan yang tidak dinyatakan eksplisit.
- source_word: ἐθεραπεύοντο
  choice: disembuhkan
  rationale: Mempertahankan bentuk pasif dan makna pemulihan dari penyakit. Dalam rangkaian dengan 'berdatangan', bentuk ini menyatakan bahwa mereka menerima kesembuhan ketika datang.
- source_word: καὶ
  choice: juga
  rationale: Menautkan peristiwa ini dengan penyembuhan sebelumnya dan menegaskan bahwa orang-orang lain pun mengalami hal serupa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Berdatangan' dipakai untuk membawa nuansa imperfek, sedangkan susunan kalimat dijaga tetap mudah dipahami oleh pembaca umum.
