id: ACT.28.21
reference: Acts 28:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὸν εἶπαν· Ἡμεῖς οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας, οὔτε παραγενόμενός τις τῶν ἀδελφῶν ἀπήγγειλεν ἢ ἐλάλησέν τι περὶ σοῦ πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/021.yaml
  text: But they said to him[a], “We have received no letters from Judea about you[b], nor has any of the brothers who came reported or spoken anything evil about you.”
translation:
  language: id
  text: Namun, mereka berkata kepadanya, “Kami tidak menerima surat apa pun dari Yudea tentang kamu. Tidak seorang pun dari antara saudara-saudara[a] yang datang melaporkan atau mengatakan sesuatu yang buruk tentang kamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebutan “saudara-saudara” mungkin merujuk kepada sesama orang Yahudi dari Yudea; teks tidak secara tegas menyebut mereka sebagai orang percaya Kristen.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ... εἶπαν
  choice: Namun, mereka berkata
  rationale: δέ menandai tanggapan dengan peralihan atau pertentangan ringan; “namun” tetap alami dalam dialog tanpa memberi tekanan berlebihan.
- source_word: γράμματα
  choice: surat apa pun
  rationale: Dalam konteks ini γράμματα berarti surat atau komunikasi tertulis. Bentuk “surat apa pun” secara alami menyampaikan penyangkalan οὔτε.
- source_word: ἐδεξάμεθα
  choice: kami tidak menerima
  rationale: δέχομαι di sini menunjuk pada penerimaan surat, bukan penerimaan dalam arti menyambut atau menyetujui.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: dari Yudea
  rationale: Terjemahan geografis langsung dan wajar; teks tidak perlu diperluas menjadi nama administratif.
- source_word: παραγενόμενός τις τῶν ἀδελφῶν
  choice: tidak seorang pun dari antara saudara-saudara yang datang
  rationale: Ungkapan ini mempertahankan arti seseorang dari kelompok saudara-saudara yang telah tiba, tanpa menambahkan lokasi “ke sini” yang tidak dinyatakan secara eksplisit.
- source_word: ἀπήγγειλεν ἢ ἐλάλησέν τι
  choice: melaporkan atau mengatakan sesuatu
  rationale: 'Dua verba Yunani tetap dibedakan secara ringan: ἀπαγγέλλω sebagai menyampaikan laporan dan λαλέω sebagai mengatakan atau membicarakan sesuatu.'
- source_word: πονηρόν
  choice: yang buruk
  rationale: Dalam konstruksi “sesuatu ... tentang kamu,” πονηρόν paling alami berarti sesuatu yang buruk atau merugikan; pilihan ini tidak mempersempitnya menjadi tuduhan resmi.
theological_decisions:
- issue: Identitas “saudara-saudara” (τῶν ἀδελφῶν)
  choice: Diterjemahkan secara harfiah sebagai “saudara-saudara,” dengan catatan bahwa rujukannya tidak dinyatakan secara tegas.
  alternative: sesama orang Yahudi; saudara-saudara seiman Kristen
  rationale: Para penutur adalah pemimpin Yahudi di Roma yang membicarakan orang-orang yang datang dari Yudea. Konteks memungkinkan rujukan kepada sesama orang Yahudi, tetapi teks tidak secara eksplisit menentukan apakah mereka adalah orang Yahudi secara umum atau orang percaya Kristen.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kamu” dipakai sebagai sapaan tunggal yang alami dalam percakapan masa kini. Dua bagian negatif Yunani disajikan sebagai dua kalimat agar jelas dan lancar, sementara hubungan “tidak ... tidak seorang pun” tetap dipertahankan.
