  text: ἀντιλεγόντων δὲ τῶν Ἰουδαίων ἠναγκάσθην ἐπικαλέσασθαι Καίσαρα, οὐχ ὡς τοῦ ἔθνους μου ἔχων τι ⸀κατηγορεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/019.yaml
  text: But because the Jews objected[b][a], I was compelled to appeal to Caesar—not because I had anything to accuse my nation of.
translation:
  language: id
  text: Namun, karena orang-orang Yahudi[a][b] menentang aku, aku terpaksa naik banding kepada Kaisar—bukan karena aku mempunyai tuduhan terhadap bangsaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika orang-orang Yahudi menentang aku” atau “karena orang-orang Yahudi membantah aku.”
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks perkara hukum ini, “orang-orang Yahudi” menunjuk kepada pihak Yahudi yang menentang Paulus, bukan kepada semua orang Yahudi tanpa kecuali.
    reason: cultural_note
lexical_decisions:
- source_word: ἀντιλεγόντων
  choice: karena ... menentang
  rationale: Partisipel kini dalam konstruksi genitif absolut menyatakan keadaan yang mendorong tindakan Paulus. “Menentang” alami dalam bahasa Indonesia dan mencakup keberatan atau perlawanan dalam konteks hukum tanpa membatasinya pada bantahan lisan saja.
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras ringan dengan pernyataan sebelumnya dan terdengar wajar dalam tuturan formal Paulus.
- source_word: τῶν Ἰουδαίων
  choice: orang-orang Yahudi
  rationale: Menerjemahkan sebutan Yunani secara langsung tanpa mempersempitnya menjadi “para pemimpin Yahudi”; konteks menentukan bahwa yang dimaksud ialah para penentang Paulus dalam perkara ini.
- source_word: ἠναγκάσθην
  choice: aku terpaksa
  rationale: Bentuk pasif menyampaikan tekanan atau keharusan. “Terpaksa” merupakan padanan Indonesia yang ringkas dan alami.
- source_word: ἐπικαλέσασθαι Καίσαρα
  choice: naik banding kepada Kaisar
  rationale: Ungkapan ini bersifat teknis dalam konteks hukum, yakni menggunakan hak untuk mengajukan perkara kepada kaisar. “Naik banding kepada Kaisar” jelas dan lazim dalam bahasa Indonesia.
- source_word: οὐχ ὡς
  choice: bukan karena
  rationale: Memperkenalkan penjelasan yang menyangkal motif bermusuhan Paulus; bentuk ini alami dalam bahasa Indonesia.
- source_word: τοῦ ἔθνους μου
  choice: bangsaku
  rationale: ἔθνος menunjuk pada kelompok kebangsaan atau etnis Paulus sendiri. “Bangsaku” mempertahankan pengertian kolektif dan cocok dengan konteks publik-hukum.
- source_word: ἔχων τι κατηγορεῖν
  choice: aku mempunyai sesuatu untuk dituduhkan
  rationale: Mempertahankan makna forensik bahwa Paulus tidak memiliki tuduhan untuk diajukan terhadap bangsanya.
theological_decisions:
- issue: Rujukan ungkapan “orang-orang Yahudi” yang berpotensi disalahpahami sebagai pernyataan menyeluruh tentang suatu kelompok
  choice: Mempertahankan “orang-orang Yahudi” dalam teks utama dan menjelaskan batas rujukannya melalui catatan kaki.
  alternative: “para pemimpin Yahudi” atau “orang-orang Yudea”
  rationale: Bahasa Yunani tidak secara eksplisit mengatakan “para pemimpin”. Dalam konteks hukum ini, ungkapan tersebut menunjuk kepada pihak Yahudi yang menentang atau mendakwa Paulus, bukan kepada seluruh orang Yahudi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “aku” mengikuti tuturan langsung Paulus. Susunan kalimat mempertahankan kontras dan penjelasan motif dalam teks Yunani, sedangkan istilah “naik banding” menyampaikan konteks hukum secara alami.
