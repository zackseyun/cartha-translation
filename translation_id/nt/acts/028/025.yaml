  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους ἀπελύοντο, εἰπόντος τοῦ Παύλου ῥῆμα ἓν ὅτι Καλῶς τὸ πνεῦμα τὸ ἅγιον ἐλάλησεν διὰ Ἠσαΐου τοῦ προφήτου πρὸς τοὺς πατέρας ⸀ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/025.yaml
  text: 'And since they were disagreeing with one another, they were leaving after Paul had said one final word: “The Holy Spirit spoke rightly through Isaiah the prophet to your fathers'
translation:
  language: id
  text: 'Karena mereka tidak sependapat satu sama lain, mereka pun mulai pergi setelah Paulus mengatakan satu pernyataan penutup[a]: “Roh Kudus telah berbicara dengan tepat melalui Nabi Yesaya kepada nenek moyang kalian[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “satu perkataan”; maksudnya di sini ialah sebuah pernyataan penutup.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bapa-bapa kalian,” yaitu para leluhur Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσύμφωνοι ... ὄντες πρὸς ἀλλήλους
  choice: karena mereka tidak sependapat satu sama lain
  rationale: Konstruksi partisipial ini menggambarkan keadaan mereka yang saling berbeda pendapat; bentuk kausal dengan 'karena' wajar dalam bahasa Indonesia dan sesuai dengan alur konteks.
- source_word: ἀπελύοντο
  choice: mereka pun mulai pergi
  rationale: Bentuk imperfek tengah/pasif di sini menunjukkan rombongan itu mulai membubarkan diri; 'mulai pergi' mempertahankan nuansa proses tanpa menyiratkan bahwa mereka diusir.
- source_word: εἰπόντος τοῦ Παύλου
  choice: setelah Paulus menyampaikan
  rationale: Genitif absolut paling alami dialihkan menjadi anak kalimat waktu. 'Menyampaikan' sesuai dengan objek berupa perkataan penutup, sedangkan verba Yunani dasarnya berarti 'mengatakan'.
- source_word: ῥῆμα ἓν
  choice: satu perkataan terakhir
  rationale: Secara harfiah berarti 'satu perkataan', tetapi dalam konteks berfungsi sebagai pernyataan penutup; kata 'terakhir' menjelaskan fungsi wacananya.
- source_word: Καλῶς
  choice: dengan tepat
  rationale: Adverbia ini menilai kebenaran atau ketepatan ucapan Roh Kudus; 'dengan tepat' lebih jelas daripada 'dengan baik'.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roh Kudus
  rationale: Padanan baku dan alami untuk sebutan ilahi yang definit ini.
- source_word: ἐλάλησεν
  choice: telah berkata
  rationale: Bentuk aoristus menyatakan tindakan berbicara yang telah terjadi; 'telah berkata' alami saat memperkenalkan kutipan nubuat.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: melalui Nabi Yesaya
  rationale: 'διά dengan genitif menyatakan perantaraan: Roh Kudus berbicara melalui Yesaya. Susunan ''Nabi Yesaya'' lebih alami dalam bahasa Indonesia.'
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: kepada nenek moyang kalian
  rationale: πατέρες secara harfiah 'bapa-bapa', tetapi dalam konteks ini menunjuk para leluhur Israel. 'Nenek moyang' menyampaikan referen historis itu secara alami tanpa mengubah cakupannya.
theological_decisions:
- issue: Perantaraan dalam perkataan nubuat
  choice: Roh Kudus telah berkata dengan tepat melalui Nabi Yesaya
  alternative: Roh Kudus telah berkata dengan tepat oleh Nabi Yesaya
  rationale: Pilihan 'melalui' mempertahankan atribusi perkataan kepada Roh Kudus sekaligus peranan Yesaya sebagai perantara, sesuai dengan διά berkasus genitif.
- issue: Referen 'para bapa kalian'
  choice: nenek moyang kalian
  alternative: bapa-bapa kalian
  rationale: Dalam konteks sapaan kepada orang Yahudi, frasa itu merujuk pada leluhur Israel. Padanan idiomatis 'nenek moyang' menyatakan maksud tersebut, sedangkan bentuk harfiah 'bapa-bapa' terasa tidak alami dan dapat disalahpahami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk mempertahankan bentuk orang kedua jamak ὑμῶν secara jelas. Tanda titik dua dibiarkan membuka kutipan yang berlanjut ke ayat berikutnya.
