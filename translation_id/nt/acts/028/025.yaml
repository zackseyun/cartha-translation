  to: 'Karena mereka tidak sependapat satu sama lain, mereka pun mulai pergi setelah Paulus mengatakan satu pernyataan penutup[a]: “Roh Kudus telah berbicara dengan tepat melalui Nabi Yesaya kepada nenek moyang kalian[b]:'
