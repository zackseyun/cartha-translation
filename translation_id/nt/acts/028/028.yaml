id: ACT.28.28
reference: Acts 28:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: γνωστὸν οὖν ⸂ἔστω ὑμῖν⸃ ὅτι τοῖς ἔθνεσιν ἀπεστάλη ⸀τοῦτο τὸ σωτήριον τοῦ θεοῦ· αὐτοὶ καὶ ⸀ἀκούσονται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/028.yaml
  text: Therefore let it be known to you that this salvation of God has been sent to the Gentiles[b][a]; they also will listen.
translation:
  language: id
  text: Karena itu, ketahuilah bahwa keselamatan Allah ini[a] telah dikirim kepada bangsa-bangsa bukan Yahudi; mereka pun akan mendengarkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keselamatan dari Allah ini.” Bentuk genitif Yunani dapat dipahami dalam lebih dari satu arti yang saling berkaitan.
    reason: lexical_alternative
  - marker: b
    text: Atau “mereka pun akan mendengar.” Kata kerja Yunaninya dapat berarti “mendengar” atau “mendengarkan/menanggapi,” bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: Karena itu, ketahuilah
  rationale: Ungkapan ini menyatakan kesimpulan sekaligus seruan resmi agar para pendengar mengetahui hal berikut. Bentuk “ketahuilah” alami dalam bahasa Indonesia dan tetap mempertahankan daya imperatifnya.
- source_word: τοῖς ἔθνεσιν
  choice: kepada bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks pertentangan Yahudi–non-Yahudi di Kisah Para Rasul, ἔθνη menunjuk kepada bangsa-bangsa non-Yahudi. Pilihan ini lebih jelas bagi pembaca modern daripada sekadar “bangsa-bangsa lain”.
- source_word: ἀπεστάλη
  choice: telah dikirim
  rationale: Aoristus pasif menyatakan tindakan pengiriman yang telah terjadi. “Telah dikirim” mempertahankan bentuk pasif dan relevansi hasil tindakan itu dalam konteks sekarang.
- source_word: τοῦτο τὸ σωτήριον τοῦ θεοῦ
  choice: keselamatan Allah ini
  rationale: σωτήριον dipakai sebagai nomina, yaitu “keselamatan,” bukan secara eksplisit “berita keselamatan.” Susunan “keselamatan Allah” mempertahankan hubungan genitif tanpa memutuskan secara mutlak apakah Allah terutama dipandang sebagai sumber, pemilik, atau pelaku keselamatan itu.
- source_word: αὐτοὶ καὶ ἀκούσονται
  choice: mereka pun akan mendengarkan
  rationale: ἀκούω dapat berarti mendengar atau mendengarkan. Konteks mengisyaratkan penerimaan yang kontras dengan penolakan sebelumnya, sehingga “mendengarkan” menyampaikan kemungkinan respons yang reseptif tanpa menambahkan gagasan pertobatan. “Pun” mewakili penekanan αὐτοὶ καί.
theological_decisions:
- issue: Makna σωτήριον dalam konteks
  choice: keselamatan
  alternative: berita keselamatan
  rationale: Kata Yunani itu sendiri menunjuk pada keselamatan. Walaupun konteksnya mencakup pemberitaan, menerjemahkannya sebagai “berita keselamatan” akan mempersempit cakupan teologis ungkapan tersebut.
- issue: Hubungan genitif dalam τοῦ θεοῦ
  choice: keselamatan Allah
  alternative: keselamatan dari Allah
  rationale: Bentuk utama mempertahankan keluasan hubungan genitif. Alternatif “dari Allah” sah, tetapi lebih tegas menafsirkan Allah sebagai sumber; karena itu dicatat dalam catatan kaki.
- issue: Daya ἀκούσονται
  choice: akan mendengarkan
  alternative: akan mendengar
  rationale: Konteks mendukung nuansa mendengar dengan sikap menerima. Namun, karena verba Yunani juga dapat berarti sekadar “mendengar,” alternatif yang lebih netral tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada deklaratif yang khidmat tetapi tetap mudah dipahami. “Bangsa-bangsa bukan Yahudi” dipilih demi kejelasan kontekstual; struktur pasif dan ambiguitas genitif sebisa mungkin dipertahankan.
