source:
  edition: SBLGNT
  text: Μετὰ δὲ τρεῖς μῆνας ⸀ἀνήχθημεν ἐν πλοίῳ παρακεχειμακότι ἐν τῇ νήσῳ Ἀλεξανδρίνῳ, παρασήμῳ Διοσκούροις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/011.yaml
  text: After three months we set sail in an Alexandrian ship that had wintered on the island[a], with the Dioscuri as its figurehead.
translation:
  language: id
  text: Sesudah tiga bulan, kami berlayar dengan sebuah kapal dari Aleksandria yang telah menghabiskan musim dingin di pulau itu dan berlambang Dioskuri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dioskuri adalah Kastor dan Poluks, saudara kembar yang dalam mitologi Yunani-Romawi dikaitkan dengan Zeus.
    reason: Menjelaskan nama mitologis Yunani yang mungkin tidak dikenal oleh pembaca modern.
lexical_decisions:
- source_word: Μετὰ δὲ τρεῖς μῆνας
  choice: Sesudah tiga bulan
  rationale: μετά dengan akusatif menyatakan waktu sesudah suatu selang; δέ hanya merupakan penghubung ringan dan tidak perlu dinyatakan tersendiri dalam bahasa Indonesia.
- source_word: ἀνήχθημεν
  choice: kami berlayar
  rationale: Dalam konteks pelayaran, ἀνάγω berarti bertolak atau mulai berlayar; bentuk ini alami dan ringkas dalam narasi perjalanan.
- source_word: ἐν πλοίῳ ... Ἀλεξανδρίνῳ
  choice: dengan sebuah kapal dari Aleksandria
  rationale: πλοῖον menunjuk kapal, sedangkan Ἀλεξανδρίνῳ menerangkan asal atau kaitannya dengan Aleksandria. Ungkapan 'kapal dari Aleksandria' lebih alami daripada 'kapal Aleksandria' dan tidak menentukan jenis muatannya.
- source_word: παρακεχειμακότι ἐν τῇ νήσῳ
  choice: yang melewatkan musim dingin di pulau itu
  rationale: Partisipel perfek παρακεχειμακότι menunjukkan bahwa kapal itu telah tinggal di sana sepanjang musim dingin; 'pulau itu' merujuk kembali kepada Malta dalam konteks.
- source_word: παρασήμῳ Διοσκούροις
  choice: Kapal itu berlambangkan Dioskuri
  rationale: παράσημος mengacu pada tanda atau lambang pembeda kapal. 'Berlambangkan' mempertahankan keluasan makna tanpa memastikan bahwa lambang itu secara khusus berupa patung pada haluan. Διόσκουροι dipertahankan sebagai nama mitologis dan dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penyebutan lambang keagamaan pagan Διοσκούροις
  choice: Dioskuri
  alternative: Dewa Kembar; Kastor dan Poluks
  rationale: Nama yang ditransliterasikan paling langsung mencerminkan istilah Yunani dan melaporkan lambang pagan itu tanpa memberi kesan dukungan. Catatan kaki menjelaskan identitasnya bagi pembaca umum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Kalimat kedua dipisahkan demi kejelasan hubungan παρασήμῳ dengan kapal. 'Berlambangkan' dipilih daripada 'berpatungkan di haluan' agar tidak mempersempit makna sumber secara berlebihan.
