  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγένετο δὲ τὸν πατέρα τοῦ Ποπλίου πυρετοῖς καὶ ⸀δυσεντερίῳ συνεχόμενον κατακεῖσθαι, πρὸς ὃν ὁ Παῦλος εἰσελθὼν καὶ προσευξάμενος ἐπιθεὶς τὰς χεῖρας αὐτῷ ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/008.yaml
  text: It happened that the father of Publius was lying sick with fevers and dysentery. Paul went in to him[a], and after praying and laying his hands on him, healed him.
translation:
  language: id
  text: Pada waktu itu, ayah Publius sedang terbaring sakit karena demam yang berulang dan disentri. Paulus masuk menemuinya, lalu setelah berdoa, ia menumpangkan kedua tangannya ke atasnya dan menyembuhkannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Kebetulan
  rationale: Memperkenalkan keadaan baru dalam alur narasi secara alami tanpa menambahkan penanda waktu yang tidak ada dalam bahasa Yunani.
- source_word: τὸν πατέρα τοῦ Ποπλίου
  choice: ayah Publius
  rationale: Bentuk genitif ini paling alami dan jelas dalam bahasa Indonesia.
- source_word: πυρετοῖς
  choice: demam yang berulang
  rationale: Bentuk jamak Yunani dipertahankan secara idiomatis sebagai serangan atau episode demam, bukan satu demam saja.
- source_word: δυσεντερίῳ
  choice: disentri
  rationale: Istilah medis langsung yang lazim dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: συνεχόμενον κατακεῖσθαι
  choice: sedang terbaring sakit karena
  rationale: Menggabungkan keadaan terbaring dengan makna terus didera penyakit secara alami tanpa melebihkan menjadi lumpuh total atau sama sekali tidak dapat bangun.
- source_word: πρὸς ὃν ὁ Παῦλος εἰσελθὼν
  choice: Paulus masuk menemuinya
  rationale: Menyampaikan bahwa Paulus masuk ke tempat orang sakit itu berada dan mendekatinya.
- source_word: προσευξάμενος
  choice: setelah berdoa
  rationale: Partisip aoris menyatakan tindakan yang mendahului tindakan utama; urutannya disampaikan dengan jelas.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: menumpangkan kedua tangannya ke atas orang itu
  rationale: Menggunakan ungkapan Indonesia yang lazim untuk tindakan ini serta mempertahankan bentuk jamak 'tangan'.
- source_word: ἰάσατο αὐτόν
  choice: menyembuhkannya
  rationale: Padanan langsung yang mempertahankan klaim naratif tentang kesembuhan tanpa menambahkan penjelasan teologis.
theological_decisions:
- issue: Sifat tindakan penyembuhan Paulus
  choice: Urutan doa, penumpangan tangan, dan penyembuhan dinyatakan secara langsung.
  alternative: Menyebutnya secara eksplisit sebagai mukjizat, tindakan sakramental, atau pemulihan medis.
  rationale: Ayat menyatakan bahwa Paulus berdoa, menumpangkan tangan, dan menyembuhkan orang itu, tetapi tidak memberi label teknis tentang cara, kecepatan, atau sifat penyembuhan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Demam yang berulang' menyampaikan bentuk jamak πυρετοῖς dengan lebih alami daripada 'demam-demam'. Tidak diperlukan catatan kaki karena nuansa συνεχόμενον telah diwakili dalam teks utama.
