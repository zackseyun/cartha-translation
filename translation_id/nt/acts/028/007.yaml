id: ACT.28.7
reference: Acts 28:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον ὑπῆρχεν χωρία τῷ πρώτῳ τῆς νήσου ὀνόματι Ποπλίῳ, ὃς ἀναδεξάμενος ἡμᾶς ⸂τρεῖς ἡμέρας⸃ φιλοφρόνως ἐξένισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/007.yaml
  text: In the area around that place there were lands belonging to the chief man of the island[a], named Publius[c][b], who welcomed us and hosted us courteously for three days.
translation:
  language: id
  text: Di daerah sekitar tempat itu terdapat sejumlah bidang tanah[a] milik orang terkemuka di pulau itu[b]. Namanya Publius. Ia menyambut kami dan menjamu kami dengan ramah selama tiga hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah-tanah milik” atau “perkebunan-perkebunan”; kata Yunani χωρία mengacu pada lahan atau harta tak bergerak di daerah itu.
    reason: lexical_alternative
  - marker: b
    text: Atau “pemimpin pulau itu.” Ungkapan Yunani τῷ πρώτῳ τῆς νήσου menunjuk pada orang yang berkedudukan utama atau tertinggi di pulau tersebut dan mungkin merupakan gelar setempat.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον
  choice: Di daerah sekitar tempat itu
  rationale: Ungkapan ini menunjuk pada wilayah di sekitar tempat yang baru disebutkan. δέ berfungsi sebagai penghubung naratif ringan dan tidak perlu diterjemahkan dengan kata temporal tersendiri.
- source_word: ὑπῆρχεν χωρία
  choice: terdapat sejumlah bidang tanah
  rationale: χωρία berbentuk jamak dan dalam konteks ini mengacu pada tanah atau harta tak bergerak. 'Sejumlah bidang tanah' alami dalam bahasa Indonesia serta mempertahankan makna jamaknya tanpa menentukan jenis lahannya.
- source_word: τῷ πρώτῳ τῆς νήσου
  choice: orang terkemuka di pulau itu
  rationale: πρῶτος di sini menyatakan kedudukan utama atau tertinggi, mungkin sebagai gelar setempat. Pilihan ini menyampaikan statusnya tanpa memastikan jabatan resmi yang tidak disebutkan secara eksplisit.
- source_word: ὀνόματι Ποπλίῳ
  choice: Namanya Publius
  rationale: Konstruksi ὀνόματι dengan datif memperkenalkan nama orang tersebut. Pemisahan menjadi kalimat singkat mencegah kerancuan acuan dalam bahasa Indonesia.
- source_word: ἀναδεξάμενος ἡμᾶς
  choice: Ia menyambut kami
  rationale: Partisip ini menggambarkan tindakan menerima atau menyambut para tamu dan sesuai dengan konteks keramahtamahan.
- source_word: φιλοφρόνως ἐξένισεν
  choice: menjamu kami dengan ramah
  rationale: ξενίζω berarti menerima dan memelihara sebagai tamu, sedangkan φιλοφρόνως menerangkan sikap ramah atau baik hati. Ungkapan ini menyampaikan kedua unsur tersebut secara wajar.
- source_word: τρεῖς ἡμέρας
  choice: selama tiga hari
  rationale: Bentuk akusatif menyatakan rentang waktu; 'selama tiga hari' merupakan padanan Indonesia yang langsung dan alami.
