  text: So he[a], after shaking the creature off into the fire, suffered no harm.
translation:
  language: id
  text: Paulus pun, setelah mengibaskan binatang itu[a] ke dalam api, tidak mengalami bahaya apa pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “binatang buas itu” atau “makhluk itu”; istilah Yunani yang dipakai bersifat umum, meskipun konteks menunjukkan bahwa binatang itu adalah ular.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν οὖν
  choice: Lalu Paulus
  rationale: Artikel berfungsi pronominal dan menunjuk kembali kepada Paulus. Nama Paulus dinyatakan demi kejelasan dalam bahasa Indonesia, sedangkan partikel μέν dan οὖν diberi daya peralihan naratif yang ringan melalui “Lalu”.
- source_word: ἀποτινάξας
  choice: mengebaskan
  rationale: Kata ini menggambarkan tindakan mengibaskan sesuatu agar terlepas. Bentuk partisip aoris menunjukkan tindakan ini mendahului hasil yang dinyatakan oleh verba utama; urutan klausa bahasa Indonesia sudah menyampaikan hubungan tersebut secara alami.
- source_word: τὸ θηρίον
  choice: binatang itu
  rationale: θηρίον adalah istilah umum bagi binatang, sering kali binatang liar. Konteks ayat sebelumnya menunjukkan bahwa yang dimaksud ialah ular, tetapi pilihan umum ini mempertahankan keluasan leksikal teks sumber.
- source_word: εἰς τὸ πῦρ
  choice: ke dalam api
  rationale: Ini mempertahankan arah gerak yang dinyatakan oleh εἰς dengan bentuk yang wajar dalam bahasa Indonesia.
- source_word: ἔπαθεν
  choice: mengalami
  rationale: πάσχω dapat berarti mengalami atau menderita. Bersama οὐδὲν κακόν, “mengalami ... bahaya” terdengar alami dan tidak menambahkan gagasan rasa sakit yang tidak dinyatakan secara khusus.
- source_word: οὐδὲν κακόν
  choice: tidak mengalami bahaya apa pun
  rationale: Ungkapan ini menyatakan bahwa tidak ada cedera atau akibat buruk yang menimpa Paulus. “Bahaya apa pun” ringkas, jelas, dan sesuai dengan cakupan κακόν dalam konteks.
