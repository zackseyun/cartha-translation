  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama Paulus dipakai untuk menghindari rujukan pronominal yang canggung; istilah umum “binatang” mempertahankan pilihan leksikal Yunani, sementara catatan kaki menjelaskan alternatif dan konteksnya.
