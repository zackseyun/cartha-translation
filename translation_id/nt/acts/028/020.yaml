  text: διὰ ταύτην οὖν τὴν αἰτίαν παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι, ἕνεκεν γὰρ τῆς ἐλπίδος τοῦ Ἰσραὴλ τὴν ἅλυσιν ταύτην περίκειμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/020.yaml
  text: For this reason[a], therefore, I asked to see you and to speak with you, for it is because of the hope of Israel that I am wearing this chain.
translation:
  language: id
  text: Karena alasan inilah maka saya meminta Saudara-saudara untuk bertemu dan berbicara dengan saya. Sebab, karena pengharapan Israel[a] inilah saya terikat dengan rantai ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pengharapan milik Israel” atau “pengharapan yang dijanjikan kepada Israel.” Frasa ini dapat mencakup pengharapan perjanjian dan kebangkitan yang diberitakan Paulus.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ ταύτην οὖν τὴν αἰτίαν
  choice: Karena alasan inilah, maka
  rationale: Mempertahankan baik ungkapan sebab maupun partikel kesimpulan οὖν. Bentuk ini sedikit berulang, tetapi masih wajar dalam bahasa Indonesia dan mencerminkan hubungan logis yang dinyatakan secara eksplisit.
- source_word: παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι
  choice: saya meminta untuk bertemu dan berbicara dengan Saudara-saudara
  rationale: Dalam konteks Paulus memanggil para pemimpin Yahudi setempat, παρεκάλεσα paling alami berarti 'meminta'. 'Bertemu' menyampaikan maksud idiomatis ἰδεῖν, sedangkan 'berbicara dengan' mempertahankan nuansa percakapan dalam προσλαλῆσαι.
- source_word: ἕνεκεν γὰρ
  choice: Sebab, karena ... inilah
  rationale: Mempertahankan γάρ sebagai penjelasan dan ἕνεκεν sebagai penanda sebab tanpa menghasilkan susunan yang kaku.
- source_word: τῆς ἐλπίδος τοῦ Ἰσραήλ
  choice: pengharapan Israel
  rationale: Mempertahankan bentuk genitif yang ringkas dan tidak mempersempitnya secara eksplisit menjadi hanya pengharapan akan Mesias atau kebangkitan.
- source_word: τὴν ἅλυσιν ταύτην περίκειμαι
  choice: saya terbelenggu dengan rantai ini
  rationale: ἅλυσις berbentuk tunggal dan berarti 'rantai'. περίκειμαι secara harfiah menggambarkan sesuatu yang dikenakan atau melingkari seseorang; 'terbelenggu dengan rantai ini' menyampaikan keadaan tahanan secara alami tanpa kesan bahwa Paulus mengenakannya secara sukarela.
theological_decisions:
- issue: Makna 'pengharapan Israel'
  choice: pengharapan Israel
  alternative: pengharapan yang dijanjikan kepada Israel; pengharapan Israel akan kebangkitan atau Mesias
  rationale: Ungkapan Yunani bersifat padat dan dapat membangkitkan keseluruhan pengharapan perjanjian Israel, termasuk kebangkitan dan penggenapannya dalam Mesias. Teks utama tidak mempersempitnya pada satu aspek tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Saudara-saudara' dipakai sebagai sapaan hormat kepada kelompok pemimpin Yahudi. Pemenggalan menjadi dua kalimat menjaga kejelasan tanpa menghilangkan hubungan sebab-akibat dalam bahasa Yunani.
