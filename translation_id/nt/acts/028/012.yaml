id: ACT.28.12
reference: Acts 28:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ καταχθέντες εἰς Συρακούσας ἐπεμείναμεν ἡμέρας τρεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/012.yaml
  text: And after putting in at Syracuse[a], we stayed there three days.
translation:
  language: id
  text: Setelah singgah di Sirakusa[a], kami tinggal di sana selama tiga hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setelah berlabuh di Sirakusa” atau “setelah mendarat di Sirakusa.” Kata Yunani yang dipakai memiliki arti khusus dalam konteks pelayaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταχθέντες
  choice: setelah singgah
  rationale: Dalam konteks pelayaran, bentuk partisipel κατάγω berarti masuk atau tiba di pelabuhan. 'Setelah singgah' menyampaikan nuansa bahari dan cocok dengan keberadaan mereka selama tiga hari, tanpa memakai terjemahan harfiah 'dibawa turun' yang tidak alami.
- source_word: εἰς Συρακούσας
  choice: di Sirakusa
  rationale: Walaupun εἰς pada dasarnya menyatakan gerak menuju atau masuk ke suatu tempat, sesudah verba bahari ini bahasa Indonesia secara alami memakai 'singgah di Sirakusa'.
- source_word: ἐπεμείναμεν
  choice: kami tinggal di sana
  rationale: Verba ini berarti tetap berada atau tinggal. 'Tinggal di sana' merupakan ungkapan Indonesia yang alami; 'di sana' memperjelas lokasi yang sudah tersirat oleh konteks.
- source_word: ἡμέρας τρεῖς
  choice: selama tiga hari
  rationale: Bentuk akusatif menyatakan rentang waktu. Kata 'selama' mengungkapkan fungsi duratif itu dengan jelas dan alami dalam bahasa Indonesia.
- source_word: Συρακούσας
  choice: Sirakusa
  rationale: '''Sirakusa'' adalah bentuk nama tempat yang lazim dalam bahasa Indonesia untuk kota kuno Syracuse.'
theological_decisions: []
