  register: Bahasa Indonesia baku modern dengan susunan yang ringkas dan alami. 'Singgah' dipilih dalam teks utama karena mudah dipahami dan sesuai dengan konteks perjalanan laut; alternatif yang lebih eksplisit diberikan dalam catatan kaki.
