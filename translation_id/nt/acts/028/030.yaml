id: ACT.28.30
reference: Acts 28:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Ἐνέμεινεν ⸀δὲ διετίαν ὅλην ἐν ἰδίῳ μισθώματι, καὶ ἀπεδέχετο πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/030.yaml
  text: And he stayed for two whole years in his own rented lodging[a], and he welcomed all who came in to him[b],
translation:
  language: id
  text: Paulus tinggal selama dua tahun penuh di tempat tinggal yang disewanya sendiri[a], dan ia menyambut semua orang yang datang menemuinya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di rumah yang disewanya sendiri.” Kata Yunani μίσθωμα merujuk pada tempat tinggal sewaan tanpa memastikan jenis bangunannya.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “semua orang yang masuk untuk menemuinya,” kemungkinan menggambarkan para pengunjung yang masuk ke tempat tinggal Paulus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνέμεινεν
  choice: tinggal
  rationale: Dalam konteks ini, bentuk aoristus ἐμμένω menyatakan bahwa Paulus terus menetap di suatu tempat. “Tinggal” merupakan ungkapan Indonesia modern yang alami dan tidak menambahkan gagasan di luar teks.
- source_word: δὲ
  choice: dan
  rationale: δέ berfungsi sebagai penghubung ringan yang melanjutkan narasi, bukan sebagai penanda pertentangan yang kuat.
- source_word: διετίαν ὅλην
  choice: selama dua tahun penuh
  rationale: Frasa ini menyatakan rentang waktu dan menekankan bahwa seluruh masa dua tahun itu dijalani.
- source_word: ἐν ἰδίῳ μισθώματι
  choice: di tempat tinggal yang disewanya sendiri
  rationale: μίσθωμα menunjuk pada akomodasi sewaan, sedangkan ἰδίῳ menunjukkan bahwa tempat itu disewa atau diatur untuk penggunaannya sendiri. Pilihan ini alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi jenis bangunan tertentu.
- source_word: ἀπεδέχετο
  choice: ia menyambut
  rationale: Bentuk imperfek menggambarkan tindakan yang berlangsung atau biasa dilakukan. “Menyambut” mempertahankan nuansa penerimaan yang ramah.
- source_word: πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν
  choice: semua orang yang datang menemuinya
  rationale: Partisipel εἰσπορευομένους secara harfiah mengandung gagasan masuk atau datang ke dalam. Dalam bahasa Indonesia, “datang menemuinya” menyampaikan maksud kunjungan secara alami; nuansa masuk dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Nama “Paulus” dipakai untuk memperjelas subjek yang tersirat dalam verba Yunani dan yang telah jelas dari konteks, sesuai kelaziman bahasa Indonesia. Tanda koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat 31.
