  terminology: “Tempat tinggal yang disewanya sendiri” secara memadai mencakup μίσθωμα sebagai akomodasi sewaan dan ἰδίῳ sebagai miliknya sendiri. Catatan kaki a secara tepat menghindari pengertian bahwa bangunan itu pasti sebuah rumah. Istilah dan nama diri sesuai dengan pemakaian Indonesia modern.
