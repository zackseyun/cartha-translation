  source_fidelity: 'Terjemahan secara akurat mencerminkan pembagian kontrasif οἱ μὲν ... οἱ δέ: sebagian pendengar diyakinkan oleh isi pemberitaan, sedangkan yang lain tidak percaya. “Diyakinkan” merupakan padanan yang layak untuk ἐπείθοντο dan tidak menyamakan respons itu secara berlebihan dengan iman dalam pengertian teologis penuh. “Apa yang disampaikan” dengan tepat menyampaikan τοῖς λεγομένοις sebagai isi pemberitaan yang sedang berlangsung. “Tidak percaya” adalah padanan langsung dan tidak berlebihan untuk ἠπίστουν.'
  naturalness: Bahasa Indonesia baku, jelas, dan mengalir alami. Susunan “Sebagian orang ... tetapi yang lain ...” efektif menyatakan kontras antarkelompok. Penghilangan padanan eksplisit untuk καί dapat diterima dalam bahasa Indonesia tanpa kehilangan kesinambungan naratif.
  terminology: Istilah yang dipakai bersifat netral dan tepat register. Terjemahan tidak menambahkan keputusan doktrinal mengenai status rohani akhir kedua kelompok. Catatan kaki secara tepat menandai “tidak mau percaya” sebagai kemungkinan bernuansa lebih kuat, bukan sebagai arti yang harus dipaksakan dalam teks utama.
