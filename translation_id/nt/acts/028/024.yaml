  text: καὶ οἱ μὲν ἐπείθοντο τοῖς λεγομένοις οἱ δὲ ἠπίστουν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/024.yaml
  text: And some were persuaded by what was being said[a], but others disbelieved.
translation:
  language: id
  text: Sebagian orang diyakinkan oleh apa yang disampaikan, tetapi yang lain tidak percaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: tidak mau percaya; atau: tetap tidak percaya.'
    reason: ἀπιστέω dapat menyatakan tidak percaya dan, menurut konteks, dapat mengandung nuansa enggan atau menolak untuk percaya; terjemahan utama menghindari penegasan nuansa kehendak yang tidak pasti.
lexical_decisions:
- source_word: ἐπείθοντο
  choice: diyakinkan
  rationale: Bentuk imperfek pasif/medium menggambarkan tanggapan yang berlangsung terhadap pemberitaan Paulus. “Diyakinkan” mempertahankan gagasan bahwa perkataan itu meyakinkan mereka tanpa langsung menyamakannya dengan rumusan iman yang lebih penuh.
- source_word: τοῖς λεγομένοις
  choice: oleh apa yang disampaikan
  rationale: Partisipel kini pasif berartikel menunjuk pada isi yang sedang dikatakan. Ungkapan ini alami dalam bahasa Indonesia dan tetap mencerminkan proses penyampaian yang berlangsung.
- source_word: ἠπίστουν
  choice: tidak percaya
  rationale: Pilihan ini secara langsung menyampaikan arti ἀπιστέω dalam konteks dan tidak menambahkan unsur kesengajaan yang lebih kuat seperti “menolak untuk percaya.”
- source_word: οἱ μὲν ... οἱ δὲ
  choice: sebagian orang ... tetapi yang lain
  rationale: Konstruksi korelatif ini membagi kelompok pendengar menjadi dua dan menandai pertentangan respons mereka.
- source_word: καὶ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Dalam bahasa Indonesia, kesinambungan dengan kalimat sebelumnya dapat dipertahankan secara alami tanpa membuka ayat dengan “dan”; hubungan naratifnya tetap jelas dari konteks.
theological_decisions:
- issue: Sifat pertentangan tanggapan
  choice: Ayat ini membedakan orang-orang yang diyakinkan oleh pesan Paulus dari orang-orang yang tidak memercayainya, tanpa menetapkan keadaan rohani akhir masing-masing.
  alternative: Menerjemahkan kelompok pertama sebagai orang beriman sejati dan kelompok kedua sebagai orang yang secara sengaja menolak atau mengeraskan hati.
  rationale: Teks Yunani menyatakan perbedaan respons langsung terhadap pemberitaan, tetapi tidak dengan sendirinya menjabarkan kategori doktrinal yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. “Apa yang disampaikan” lebih alami daripada terjemahan harfiah “hal-hal yang sedang dikatakan,” sedangkan “diyakinkan” menjaga kontras leksikal dengan “tidak percaya.”
