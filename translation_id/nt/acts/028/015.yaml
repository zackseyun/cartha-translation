  to: Dari sana, saudara-saudara[a], setelah mendengar tentang kami, datang menemui kami sampai ke Forum Apius dan Tiga Kedai. Ketika Paulus melihat mereka, ia mengucap syukur kepada Allah dan memberanikan diri.
  rationale: Revisi membentuk partisip “setelah mendengar” secara eksplisit sebagai tindakan pendahuluan dan mengganti “menjadi tabah” dengan “memberanikan diri” agar idiom ἔλαβε θάρσος tercermin lebih dekat. Catatan kaki dipertahankan karena secara tepat menjelaskan kemungkinan cakupan inklusif dari ἀδελφοί tanpa mengubah bentuk utama.
