id: ACT.28.15
reference: Acts 28:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κἀκεῖθεν οἱ ἀδελφοὶ ἀκούσαντες τὰ περὶ ἡμῶν ⸀ἦλθαν εἰς ἀπάντησιν ἡμῖν ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν, οὓς ἰδὼν ὁ Παῦλος εὐχαριστήσας τῷ θεῷ ἔλαβε θάρσος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/015.yaml
  text: And from there the brothers[a], when they heard about us, came to meet us as far as Appius Forum and Three Taverns. When Paul saw them, he gave thanks to God and took courage.
translation:
  language: id
  text: Dari sana, saudara-saudara[a], setelah mendengar tentang kami, datang menemui kami sampai ke Forum Apius dan Tiga Kedai. Ketika Paulus melihat mereka, ia mengucap syukur kepada Allah dan memberanikan diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saudara-saudari.” Kata Yunani yang digunakan berarti “saudara-saudara” dan lazim dipakai untuk sesama orang percaya; dalam konteks tertentu, sebutan ini dapat mencakup perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Dari sana
  rationale: Menyatakan peralihan tempat dalam kelanjutan kisah perjalanan; unsur penghubung καί tercermin secara alami melalui kesinambungan narasi tanpa perlu diterjemahkan tersendiri.
- source_word: οἱ ἀδελφοὶ
  choice: saudara-saudara
  rationale: Mempertahankan bentuk kekerabatan yang lazim dipakai bagi sesama orang percaya; cakupannya yang mungkin meliputi perempuan dijelaskan dalam catatan kaki.
- source_word: ἀκούσαντες τὰ περὶ ἡμῶν
  choice: mendengar tentang kami
  rationale: Partisip aoris dipahami secara temporal dan frasa τὰ περὶ ἡμῶν diterjemahkan secara idiomatis tanpa menambahkan kata 'berita' yang tidak dinyatakan secara eksplisit.
- source_word: ἦλθαν εἰς ἀπάντησιν ἡμῖν
  choice: datang menyongsong kami
  rationale: '''Menyongsong'' secara alami menyampaikan tindakan pergi keluar untuk menemui rombongan yang sedang datang.'
- source_word: ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν
  choice: sampai ke Forum Apius dan Tiga Kedai
  rationale: Kata ἄχρι menandai batas jangkauan perjalanan. Nama tempat pertama ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia, sedangkan nama kedua diterjemahkan.
- source_word: οὓς ἰδὼν ὁ Παῦλος
  choice: Ketika melihat mereka, Paulus
  rationale: Mengungkapkan partisip secara temporal sambil mempertahankan bahwa 'mereka' merujuk kepada saudara-saudara yang baru disebut.
- source_word: εὐχαριστήσας τῷ θεῷ
  choice: mengucap syukur kepada Allah
  rationale: Ungkapan Indonesia yang baku dan bermartabat untuk tindakan bersyukur yang ditujukan kepada Allah.
- source_word: ἔλαβε θάρσος
  choice: menjadi tabah
  rationale: Menyampaikan idiom harfiah 'menerima keberanian' sebagai penguatan batin dalam bahasa Indonesia yang alami, tanpa menggesernya menjadi keberanian berbicara.
theological_decisions:
- issue: Cakupan οἱ ἀδελφοὶ dalam kelompok orang percaya
  choice: saudara-saudara
  alternative: saudara-saudari; orang-orang percaya
  rationale: Bentuk leksikal Yunani dipertahankan dalam teks utama, sementara kemungkinan bahwa kelompok tersebut juga mencakup perempuan dinyatakan dalam catatan kaki agar makna inklusif tidak hilang ataupun dipastikan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat dibuat mengalir sebagai narasi perjalanan, dengan nama tempat yang mudah dikenali dan tanpa menambahkan rincian yang tidak eksplisit dalam teks Yunani.
