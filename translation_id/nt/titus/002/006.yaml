  text: Likewise[b][a], urge the younger men to be self-controlled.
translation:
  language: id
  text: Demikian juga, nasihatilah laki-laki yang lebih muda agar mengendalikan diri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berpikiran sehat” atau “bersikap bijaksana.” Kata Yunani ini menekankan penilaian yang sehat dan pengendalian diri yang disiplin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοὺς νεωτέρους
  choice: laki-laki yang lebih muda
  rationale: Bentuk Yunani berupa akusatif maskulin jamak dengan artikel dan, dalam rangkaian kelompok pada konteks ini, secara khusus menunjuk kepada kaum laki-laki yang lebih muda, bukan orang muda secara umum.
- source_word: ὡσαύτως
  choice: Demikian juga
  rationale: Ungkapan ini menghubungkan nasihat tersebut dengan petunjuk-petunjuk sejajar sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: παρακάλει
  choice: nasihatilah
  rationale: Imperatif kini ini menyampaikan tindakan Titus yang terus dilakukan dalam bentuk dorongan atau nasihat yang cukup kuat; 'nasihatilah' alami dan bermartabat dalam konteks pengajaran.
- source_word: σωφρονεῖν
  choice: agar dapat mengendalikan diri
  rationale: Kata ini mencakup penilaian yang sehat, pikiran yang bijaksana, dan pengendalian diri. Pilihan ini menyampaikan unsur disiplin perilaku secara jelas tanpa meniadakan cakupan makna lainnya, yang dicatat dalam catatan kaki.
theological_decisions:
- issue: Rujukan gender dalam νεωτέρους
  choice: rujukan khusus kepada laki-laki yang lebih muda
  alternative: orang-orang yang lebih muda tanpa pembedaan gender
  rationale: Konteks langsung menyapa kelompok-kelompok menurut usia dan jenis kelamin. Bentuk maskulin dan susunan wacana mendukung rujukan khusus kepada laki-laki muda.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang lugas dan bermartabat. 'Laki-laki yang lebih muda' mempertahankan kekhususan gender serta hubungan perbandingan usia dalam teks Yunani.
