  text: Σὺ δὲ λάλει ἃ πρέπει τῇ ὑγιαινούσῃ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/001.yaml
  text: But as for you[a], speak the things that are fitting for sound teaching.
translation:
  language: id
  text: Namun, engkau berbicaralah tentang hal-hal yang sesuai dengan ajaran yang sehat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengajaran yang sehat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Namun engkau
  rationale: Pronomina yang dinyatakan secara eksplisit bersama δέ memberi penekanan kontras terhadap para pengajar sesat sebelumnya. “Namun engkau” menyampaikan peralihan dan kontras itu secara wajar dalam bahasa Indonesia.
- source_word: λάλει
  choice: katakanlah
  rationale: Bentuk imperatif ini memerintahkan Titus untuk berbicara atau mengatakan sesuatu. “Katakanlah” mempertahankan keluasan maknanya tanpa membatasinya hanya pada kegiatan mengajar secara formal.
- source_word: ἃ
  choice: hal-hal yang
  rationale: Pronomina relatif netral jamak menunjuk pada isi yang harus disampaikan Titus; “hal-hal yang” mempertahankan nuansa jamaknya.
- source_word: πρέπει
  choice: sesuai dengan
  rationale: Kata ini menyatakan apa yang patut, cocok, atau selaras. Dalam konstruksi ini, “sesuai dengan” terdengar alami dan menunjukkan hubungan yang tepat dengan ajaran tersebut.
- source_word: ὑγιαινούσῃ
  choice: sehat
  rationale: Secara metaforis kata ini menggambarkan sesuatu yang sehat, benar, dan tidak rusak. “Sehat” mempertahankan metafora bahasa Yunani.
- source_word: διδασκαλίᾳ
  choice: ajaran
  rationale: Kata ini dapat menunjuk pada kegiatan maupun isi pengajaran. “Ajaran” alami dalam bahasa Indonesia dan cocok untuk isi pengajaran yang dimaksud dalam konteks ini.
theological_decisions:
- issue: Penerjemahan τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: ajaran yang sehat
  alternative: pengajaran yang sehat
  rationale: “Ajaran yang sehat” mempertahankan metafora kesehatan dan mencakup isi pengajaran rasuli tanpa memakai istilah teknis yang lebih sempit. Alternatif “pengajaran yang sehat” dapat lebih menonjolkan kegiatan mengajar, sedangkan bahasa Yunani memungkinkan isi maupun kegiatan.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan berwibawa. Bentuk “engkau” dipakai untuk sapaan tunggal dalam konteks pastoral, sementara susunan kalimat mempertahankan kontras eksplisit dari teks Yunani.
