  text: προσδεχόμενοι τὴν μακαρίαν ἐλπίδα καὶ ἐπιφάνειαν τῆς δόξης τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/013.yaml
  text: as we await the blessed hope and the appearing of the glory of our great God and Savior[a], Jesus the Messiah,
translation:
  language: id
  text: sambil menantikan pengharapan yang penuh berkat dan penyataan kemuliaan Allah yang agung dan Juru Selamat kita, yaitu Yesus Sang Mesias,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, meskipun kurang mungkin, “kemuliaan Allah yang agung dan kemuliaan Juru Selamat kita, Yesus Sang Mesias,” jika “Allah” dan “Juru Selamat” dipahami sebagai dua rujukan yang berbeda, bukan satu sebutan bagi Yesus.
    reason: alternative_reading
lexical_decisions:
- source_word: προσδεχόμενοι
  choice: sambil menantikan
  rationale: Partisipel ini melanjutkan hubungan dengan ayat sebelumnya dan menyatakan penantian yang terus berlangsung; bentuk ini alami dalam bahasa Indonesia.
- source_word: τὴν μακαρίαν ἐλπίδα
  choice: pengharapan yang penuh berkat
  rationale: Ungkapan ini mempertahankan bobot eskatologis μακαρίαν dan menghindari kesan bahwa pengharapan itu sekadar perasaan bahagia atau keberuntungan.
- source_word: ἐπιφάνειαν
  choice: penampakan
  rationale: Kata ini menyatakan manifestasi yang menjadi tampak, sesuai dengan konteks kedatangan eskatologis, tanpa memakai istilah teknis yang kurang mudah dipahami.
- source_word: δόξης
  choice: kemuliaan
  rationale: Padanan baku yang mempertahankan konstruksi genitif Yunani dalam frasa 'penampakan kemuliaan'.
- source_word: τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν
  choice: Allah dan Juru Selamat kita yang agung
  rationale: Susunan ini secara alami membaca kedua nomina sebagai satu sebutan bagi satu pribadi, sesuai konstruksi satu artikel dalam bahasa Yunani, sambil menempatkan 'yang agung' pada keseluruhan sebutan secara wajar dalam bahasa Indonesia.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός diterjemahkan menurut makna gelarnya, 'Mesias'; 'Sang' menandai gelar itu secara idiomatis dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah 'Allah dan Juru Selamat kita yang agung' menunjuk kepada satu pribadi, yaitu Yesus, atau kepada Allah dan Yesus sebagai dua pribadi yang berbeda
  choice: 'Satu rujukan: Yesus Sang Mesias diidentifikasi sebagai Allah dan Juru Selamat kita yang agung.'
  alternative: 'Dua rujukan: kemuliaan Allah yang agung dan kemuliaan Juru Selamat kita, Yesus Sang Mesias.'
  rationale: Satu artikel Yunani menaungi dua nomina personal tunggal, θεοῦ dan σωτῆρος, lalu diikuti Ἰησοῦ Χριστοῦ; secara sintaksis, pembacaan satu rujukan paling alami. Kata 'yaitu' memperjelas aposisi dalam bahasa Indonesia, sementara alternatif yang lebih kecil kemungkinannya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur tetapi mudah dipahami. 'Juru Selamat' dipertahankan sebagai istilah umum yang mapan; 'penampakan' dipilih daripada istilah pinjaman atau ungkapan yang terlalu teknis.
