  naturalness: '“Sambil menantikan” dan “Juru Selamat” baku dan alami. “Penyataan kemuliaan” lebih idiomatis dalam ragam Indonesia modern yang luhur daripada “penampakan kemuliaan.” “Pengharapan yang penuh berkat” dapat dipertahankan: ungkapan ini komunikatif dan mempertahankan sifat positif-eskatologis dari μακαρίαν tanpa mengubahnya menjadi sekadar kebahagiaan psikologis.'
  terminology: “Allah,” “Juru Selamat,” dan “Mesias” tepat. “Sang Mesias” merupakan cara idiomatis untuk menyampaikan nilai gelar pada Χριστός. Catatan kaki secara tepat menandai alternatif dua rujukan sebagai kurang mungkin dan tidak menjadikannya pembacaan utama.
