  text: πρεσβύτας νηφαλίους εἶναι, σεμνούς, σώφρονας, ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/002.yaml
  text: Older men are to be temperate[a], dignified, self-controlled, sound in faith, in love, and in steadfastness.
translation:
  language: id
  text: Hendaklah laki-laki yang lebih tua berpikiran jernih[a], terhormat, mampu mengendalikan diri, serta sehat dalam iman[b], kasih, dan ketekunan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak mabuk.” Kata Yunaninya juga dapat menunjuk pada sikap sadar, tenang, dan terkendali.
    reason: alternative_reading
  - marker: b
    text: Atau “kesetiaan.” Kata Yunani yang diterjemahkan “iman” dapat juga berarti kesetiaan, bergantung pada konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: πρεσβύτας
  choice: laki-laki yang lebih tua
  rationale: Dalam konteks petunjuk bagi kelompok usia, kata ini menunjuk kepada laki-laki lanjut usia, bukan jabatan penatua gereja.
- source_word: νηφαλίους
  choice: hidup sederhana
  rationale: Kata ini mencakup sikap bebas dari kemabukan serta kewaspadaan dan penguasaan diri; ungkapan ini menyampaikan makna etis yang lebih luas daripada sekadar tidak mabuk.
- source_word: σεμνούς
  choice: terhormat
  rationale: Menunjukkan sikap bermartabat dan kesungguhan yang patut dihormati.
- source_word: σώφρονας
  choice: dapat mengendalikan diri
  rationale: Menyatakan pertimbangan yang tertib dan kemampuan menguasai diri, dengan bahasa Indonesia yang alami.
- source_word: ὑγιαίνοντας
  choice: sehat
  rationale: Mempertahankan metafora kesehatan rohani atau moral yang terdapat dalam verba Yunani.
- source_word: τῇ πίστει
  choice: dalam iman
  rationale: Πίστις secara wajar dapat berarti iman dalam rangkaian kebajikan ini, sementara kemungkinan arti kesetiaan dipertahankan dalam catatan kaki.
- source_word: τῇ ἀγάπῃ
  choice: dalam kasih
  rationale: Padanan baku dan alami bagi ἀγάπη; datif mengikuti ὑγιαίνοντας dan diterjemahkan dengan 'dalam'.
- source_word: τῇ ὑπομονῇ
  choice: dalam ketekunan
  rationale: Menunjukkan daya tahan yang sabar dan tetap teguh ketika menghadapi kesulitan.
- source_word: εἶναι
  choice: hendaklah ...
  rationale: Infinitif bergantung pada perintah yang tersirat dari ayat sebelumnya; bentuk 'hendaklah' menyampaikan daya nasihat dalam bahasa Indonesia.
theological_decisions:
- issue: Makna πίστις dalam daftar kebajikan
  choice: iman
  alternative: kesetiaan
  rationale: Dalam rangkaian iman, kasih, dan ketekunan, πίστις dapat menunjuk pada iman atau kesetiaan. Teks utama memakai 'iman' tanpa meniadakan alternatif yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Struktur daftar kebajikan dipertahankan, dengan penghubung yang alami. Penanda catatan kaki [a] tercantum dalam teks utama.
