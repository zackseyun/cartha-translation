  terminology: “Mendidik,” “kefasikan,” “keinginan duniawi,” “penguasaan diri,” dan “saleh” layak dipertahankan. “Dengan adil” menghindari makna sempit “dengan benar” (= secara tepat/benar) dan mempertahankan kesejajaran tiga adverbia Yunani.
