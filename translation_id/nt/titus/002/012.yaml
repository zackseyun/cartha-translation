base_translation:
  language: en
  yaml_path: translation/nt/titus/002/012.yaml
  text: training us[a], so that, having renounced ungodliness and worldly desires, we might live self-controlled, righteous, and godly lives in the present age[c][b],
translation:
  language: id
  text: Ia mendidik kita[a] agar kita, setelah menolak kefasikan dan keinginan-keinginan duniawi[b], hidup dengan penguasaan diri, dengan adil, dan dengan saleh[c] di zaman sekarang ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membina kita” atau “melatih kita”. Kata Yunani ini mencakup pengajaran, pembentukan, dan juga disiplin yang mendidik.
    reason: lexical_alternative
  - marker: b
    text: Atau “hasrat-hasrat duniawi”.
    reason: lexical_alternative
  - marker: c
    text: Bahasa Yunani memakai tiga kata keterangan yang secara harfiah berarti “dengan penguasaan diri, dengan adil, dan dengan saleh”; ketiganya menerangkan cara kita hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύουσα
  choice: mendidik
  rationale: Partisip ini menggambarkan tindakan anugerah yang membentuk melalui pengajaran dan pembinaan moral. “Mendidik” mencakup kedua unsur itu secara alami dalam bahasa Indonesia.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai maksud atau hasil yang dituju dan diterjemahkan secara alami tanpa menghilangkan daya purposifnya.
- source_word: ἀρνησάμενοι
  choice: menolak
  rationale: Partisip aoris ini menyatakan penyangkalan atau penolakan tegas terhadap cara hidup lama. Dalam susunan Indonesia, hubungan dengan verba utama dinyatakan alami sebagai “menolak ... serta hidup” tanpa memaksakan bentuk temporal yang kaku.
- source_word: ἀσέβειαν
  choice: kefasikan
  rationale: Menunjuk pada sikap dan kehidupan yang tidak menghormati Allah. “Kefasikan” mempertahankan dimensi moral dan religius istilah tersebut.
- source_word: κοσμικὰς ἐπιθυμίας
  choice: keinginan-keinginan duniawi
  rationale: Menunjuk pada berbagai hasrat yang bercorak tatanan dunia sekarang. Bentuk jamak mempertahankan bentuk Yunani, sedangkan “duniawi” tidak menyempitkannya menjadi sekadar hal sekuler.
- source_word: σωφρόνως
  choice: dengan penguasaan diri
  rationale: Mengungkapkan kehidupan yang tertib, bijaksana, dan mampu mengendalikan diri; pilihan ini juga mempertahankan tema etis penting dalam surat Titus.
- source_word: δικαίως
  choice: dengan benar
  rationale: Menunjuk pada perilaku yang sesuai dengan apa yang benar atau adil. Bentuk adverbial dipertahankan secara alami.
- source_word: εὐσεβῶς
  choice: dengan saleh
  rationale: Menunjuk pada cara hidup yang hormat dan terarah kepada Allah. “Saleh” ringkas, wajar, dan mempertahankan dimensi religiusnya.
- source_word: ζήσωμεν
  choice: hidup
  rationale: Subjungtif dalam klausa ἵνα menyatakan kehidupan yang menjadi tujuan didikan anugerah; bahasa Indonesia tidak memerlukan verba modal tambahan.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: pada zaman sekarang ini
  rationale: αἰών menunjuk pada zaman atau tatanan masa kini, secara tersirat berlawanan dengan zaman yang akan datang. “Zaman sekarang ini” menjaga nuansa eskatologis tersebut.
theological_decisions:
- issue: Hubungan tindakan menolak kefasikan dengan hidup saleh
  choice: “supaya kita menolak ... serta hidup ...”
  alternative: “supaya, setelah menolak ..., kita hidup ...”
  rationale: Partisip aoris dapat menggambarkan penolakan sebagai tindakan yang secara logis mendahului kehidupan baru, tetapi konstruksi ini juga menyatukan keduanya sebagai tujuan didikan anugerah. Terjemahan tidak mengunci hubungan itu menjadi urutan waktu yang terlalu kaku.
- issue: Tiga adverbia etis σωφρόνως καὶ δικαίως καὶ εὐσεβῶς
  choice: “dengan penguasaan diri, dengan benar, dan dengan saleh”
  alternative: “menjalani hidup yang terkendali, benar, dan saleh”
  rationale: Bahasa Yunani memakai tiga adverbia yang menerangkan cara hidup. Terjemahan mempertahankan ketiganya sebagai keterangan cara, sehingga pola etis dan perbedaan nuansanya tetap terlihat tanpa mengubahnya menjadi tiga identitas atau status teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Ia” mempertahankan hubungan gramatikal dengan “anugerah Allah” pada ayat sebelumnya. Pengulangan “dengan” sengaja dipakai untuk menjaga tiga unsur adverbial Yunani dan memperjelas kesejajarannya.
