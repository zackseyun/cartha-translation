  source_fidelity: Secara umum setia pada struktur dan makna Yunani. Namun, “orang yang menentang kita” menjadikan hubungan permusuhan itu secara eksplisit tertuju kepada “kita,” padahal ὁ ἐξ ἐναντίας hanya menyebut pihak/lawan yang berseberangan; “tentang kita” baru dinyatakan kemudian dalam περὶ ἡμῶν. Catatan a juga memberi alternatif “tidak dapat dihukum,” yang kurang tepat untuk ἀκατάγνωστον dalam konteks perkataan.
  naturalness: “Perkataan yang sehat” dan “tidak dapat dicela” dapat diterima dalam ragam Alkitab Indonesia baku. Revisi “pihak lawan” terdengar wajar dan mempertahankan ketakterincian rujukan lawan. “Apa pun yang buruk untuk dikatakan” lebih idiomatis daripada “hal buruk apa pun untuk dikatakan.”
  terminology: “Sehat” dengan “perkataan” mempertahankan metafora ὑγιής yang lazim dalam Surat-Surat Pastoral. “Tidak dapat dicela” tepat untuk ἀκατάγνωστον. “Menjadi malu” cukup netral untuk ἐντραπῇ dan tidak memaksakan pelaku yang mempermalukan.
