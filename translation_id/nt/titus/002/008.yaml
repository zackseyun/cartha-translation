base_translation:
  language: en
  yaml_path: translation/nt/titus/002/008.yaml
  text: sound speech that cannot be condemned[a], so that the one who opposes us may be put to shame[c][b], having nothing evil to say about us.
translation:
  language: id
  text: perkataan yang sehat dan tidak dapat dicela[a], supaya pihak lawan[b] menjadi malu karena tidak mempunyai apa pun yang buruk untuk dikatakan tentang kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak tercela” atau “tidak terbuka terhadap kecaman.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang dari pihak yang berlawanan,” yaitu seorang lawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  choice: perkataan
  rationale: Dalam konteks pengajaran Titus, kata ini mencakup isi dan cara berbicara; “perkataan” alami dalam bahasa Indonesia dan tidak membatasinya pada satu kata saja.
- source_word: ὑγιῆ
  choice: yang sehat
  rationale: Mempertahankan metafora khas Surat-Surat Pastoral tentang pengajaran dan tutur kata yang benar serta menyehatkan secara rohani.
- source_word: ἀκατάγνωστον
  choice: tidak dapat dicela
  rationale: Menyatakan bahwa perkataan itu tidak memberi dasar yang sah untuk kecaman; bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan atau hasil yang dimaksudkan secara wajar dalam bahasa Indonesia.
- source_word: ὁ ἐξ ἐναντίας
  choice: orang yang menentang kita
  rationale: Ungkapan harfiahnya menunjuk orang dari pihak yang berlawanan; terjemahan ini menyampaikan fungsi lawan tersebut dengan jelas.
- source_word: ἐντραπῇ
  choice: menjadi malu
  rationale: Bentuk pasif dapat menyatakan bahwa lawan dibuat atau menjadi malu; ungkapan Indonesia ini menjaga daya sosial-moralnya tanpa menambahkan pelaku yang tidak disebutkan.
- source_word: μηδὲν ἔχων λέγειν
  choice: tidak mempunyai hal ... apa pun untuk dikatakan
  rationale: Mengungkapkan secara alami bahwa lawan tidak memiliki bahan atau tuduhan yang dapat disampaikan.
- source_word: περὶ ἡμῶν
  choice: tentang kita
  rationale: Mempertahankan kata ganti orang pertama jamak tanpa mempersempit atau memperluas rujukannya.
- source_word: φαῦλον
  choice: hal buruk
  rationale: Dalam konteks ucapan menentang komunitas, kata ini menunjuk sesuatu yang buruk, tercela, atau jahat; “hal buruk” paling alami sebagai objek dari “dikatakan”.
theological_decisions:
- issue: Cakupan kata ganti dalam περὶ ἡμῶν
  choice: tentang kita
  alternative: tentang kamu; tentang orang-orang Kristen; tentang ajaran kita
  rationale: Teks Yunani memakai orang pertama jamak. Mempertahankan “kita” menghindari penentuan identitas kelompok yang tidak dijelaskan oleh ayat ini.
- issue: Nuansa ἐντραπῇ
  choice: menjadi malu
  alternative: dipermalukan; merasa malu
  rationale: Bentuk Yunani dapat dipahami secara pasif atau sebagai keadaan malu. “Menjadi malu” mempertahankan ruang makna itu dan tidak menyiratkan tindakan mempermalukan secara sengaja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan ayat melanjutkan rangkaian nasihat dari ayat sebelumnya. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
