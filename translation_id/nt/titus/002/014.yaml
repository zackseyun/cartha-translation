  text: ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν ἵνα λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας καὶ καθαρίσῃ ἑαυτῷ λαὸν περιούσιον, ζηλωτὴν καλῶν ἔργων.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/014.yaml
  text: who gave himself for us[a], so that he might redeem us from all lawlessness and purify for himself a people for his own possession, zealous for good works.
translation:
  language: id
  text: yang menyerahkan diri-Nya bagi kita, agar Ia menebus kita dari segala kedurhakaan dan menyucikan bagi diri-Nya suatu umat milik-Nya sendiri,[a] yang bersemangat melakukan perbuatan baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “umat yang berharga bagi-Nya” atau “umat yang istimewa.” Ungkapan Yunani “umat milik-Nya sendiri” mempertahankan makna perjanjian, yaitu umat yang secara khusus menjadi kepunyaan-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν ἑαυτὸν
  choice: telah memberikan diri-Nya
  rationale: Mempertahankan gambaran pemberian diri secara sukarela dan daya refleksif ἑαυτόν tanpa menambahkan penjelasan tentang cara kematian-Nya.
- source_word: ὑπὲρ ἡμῶν
  choice: bagi kita
  rationale: Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan cakupan makna demi kepentingan kita dan kemungkinan nuansa mewakili kita tanpa menetapkan satu rumusan pendamaian tertentu.
- source_word: ἵνα λυτρώσηται
  choice: agar Ia menebus
  rationale: “Agar” menyatakan tujuan, sedangkan “menebus” mempertahankan gagasan pembebasan yang terkait dengan harga tebusan dan gema teologis λυτρόομαι.
- source_word: ἀπὸ πάσης ἀνομίας
  choice: dari segala kedurhakaan
  rationale: “Kedurhakaan” menyampaikan penolakan terhadap hukum atau kehendak Allah dengan lebih wajar daripada ungkapan hukum pidana modern; “segala” mempertahankan cakupan menyeluruh πάσης.
- source_word: καθαρίσῃ
  choice: menyucikan
  rationale: Pilihan ini mempertahankan dimensi kemurnian moral dan kekudusan umat dalam konteks perjanjian.
- source_word: ἑαυτῷ
  choice: bagi diri-Nya
  rationale: Menyatakan bahwa tindakan penyucian itu menghasilkan umat yang diperuntukkan bagi dan menjadi milik-Nya.
- source_word: λαὸν περιούσιον
  choice: suatu umat milik-Nya sendiri
  rationale: Ungkapan ini alami dan tetap mempertahankan nuansa kuat tentang umat yang secara khusus menjadi kepunyaan-Nya serta gema bahasa perjanjian dalam Septuaginta.
- source_word: ζηλωτὴν καλῶν ἔργων
  choice: yang penuh semangat untuk melakukan perbuatan-perbuatan baik
  rationale: Mengungkapkan kegairahan dan komitmen aktif ζηλωτής, bukan sekadar kesediaan pasif, dalam bahasa Indonesia yang mudah dipahami.
theological_decisions:
- issue: Daya ὑπὲρ ἡμῶν dalam pemberian diri Kristus
  choice: bagi kita
  alternative: demi kita; sebagai pengganti kita
  rationale: Teks mendukung makna demi kepentingan kita dan dapat mengandung nuansa perwakilan atau penggantian, tetapi ayat ini sendiri tidak menguraikan satu model pendamaian secara eksklusif.
- issue: Nuansa perjanjian λαὸν περιούσιον
  choice: suatu umat milik-Nya sendiri
  alternative: umat yang berharga; umat yang istimewa
  rationale: Pilihan utama menonjolkan kepemilikan khusus dan mempertahankan gema Perjanjian Lama tanpa mereduksinya menjadi sekadar nilai atau keistimewaan umum.
- issue: Arah rujukan ἑαυτῷ
  choice: bagi diri-Nya
  alternative: bagi-Nya
  rationale: Bentuk refleksif dipertahankan agar jelas bahwa pribadi yang memberikan diri juga menebus dan menyucikan umat itu bagi diri-Nya sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “Ia” dan “-Nya” dipakai untuk rujukan kepada Kristus sesuai kelaziman tulisan keagamaan Indonesia. Struktur kalimat mempertahankan hubungan tujuan dari ἵνα dan rangkaian dua tindakan, yaitu menebus dan menyucikan.
