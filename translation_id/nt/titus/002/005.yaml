  text: σώφρονας, ἁγνάς, ⸀οἰκουργούς, ἀγαθάς, ὑποτασσομένας τοῖς ἰδίοις ἀνδράσιν, ἵνα μὴ ὁ λόγος τοῦ θεοῦ βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/005.yaml
  text: self-controlled[a], pure, working at home, kind, being subject to their own husbands[c][b], so that the word of God may not be slandered.
translation:
  language: id
  text: menguasai diri, murni, bekerja mengurus rumah tangga[a], baik hati, tunduk kepada suami mereka sendiri[b], supaya firman Allah tidak dicela[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bekerja di rumah” atau “sibuk mengurus rumah.” Kata Yunani ini langka dan menunjuk pada keterlibatan dalam pekerjaan rumah tangga.
    reason: lexical_alternative
  - marker: b
    text: Atau “menundukkan diri kepada suami mereka sendiri.”
    reason: lexical_alternative
  - marker: c
    text: Atau “dihujat” atau “difitnah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σώφρονας
  choice: menguasai diri
  rationale: Kata sifat ini menunjuk pada pikiran yang sehat dan bijaksana yang tampak dalam pengendalian diri. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan bentuk daftar kebajikan.
- source_word: ἁγνάς
  choice: murni
  rationale: Kata ini menyatakan kemurnian, khususnya kemurnian moral. Pilihan ini mempertahankan cakupan yang lebih luas daripada sekadar kesucian seksual.
- source_word: οἰκουργούς
  choice: rajin mengurus rumah tangga[a]
  rationale: Kata Yunani yang langka ini menggabungkan gagasan rumah dan pekerjaan. Terjemahan ini menyampaikan keterlibatan aktif dalam pekerjaan rumah tangga tanpa menyiratkan bahwa perempuan harus terkurung di rumah; kata 'rajin' membantu mengungkapkan unsur kesibukan atau kerja.
- source_word: ἀγαθάς
  choice: baik hati
  rationale: Dalam daftar kebajikan yang berhubungan dengan perilaku, 'baik hati' secara alami menyampaikan mutu etis dan relasional; 'baik' saja terlalu luas.
- source_word: ὑποτασσομένας
  choice: tunduk kepada
  rationale: Partisip ini menyatakan ketundukan dalam suatu tatanan relasional. 'Tunduk kepada' ringkas, alami, dan tidak menambahkan sistem teologis di luar pernyataan ayat.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: suami mereka sendiri
  rationale: Dalam konteks rumah tangga, ἀνήρ berarti 'suami'. Kata 'sendiri' mempertahankan ἰδίοις dan membatasi hubungan tersebut pada suami masing-masing.
- source_word: ἵνα μὴ
  choice: supaya ... tidak
  rationale: Ungkapan ini mempertahankan daya tujuan dari konstruksi Yunani dengan bentuk Indonesia yang wajar.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: firman Allah
  rationale: Ini adalah padanan yang langsung, mapan, dan bermartabat bagi pesan atau firman yang berasal dari Allah.
- source_word: βλασφημῆται
  choice: dicela[c]
  rationale: Verba ini mencakup tindakan berbicara buruk, memfitnah, atau menghujat. Dalam konteks reputasi firman Allah di hadapan orang lain, 'dicela' menyampaikan makna secara jelas tanpa mempersempitnya hanya pada penghujatan langsung terhadap Allah.
theological_decisions:
- issue: Menerjemahkan οἰκουργούς tanpa melebih-lebihkan pembatasan domestik
  choice: rajin mengurus rumah tangga
  alternative: bekerja di rumah; sibuk mengurus rumah; penjaga rumah
  rationale: Istilah langka ini menekankan pekerjaan atau tanggung jawab rumah tangga, bukan secara eksplisit keterkurungan di rumah. Pilihan ini mempertahankan tuntutan akan kegiatan domestik yang produktif tanpa menambahkan larangan yang tidak dinyatakan teks.
- issue: Mempertahankan ketundukan dalam hubungan perkawinan tanpa memasukkan kerangka denominasi
  choice: tunduk kepada suami mereka sendiri
  alternative: menundukkan diri kepada suami mereka sendiri
  rationale: Teks menyatakan ketundukan dalam perkawinan, tetapi tidak menguraikan seluruh sistem tentang peran gender. Kata 'sendiri' mempertahankan batas lingkup yang ada dalam bahasa Yunani.
- issue: Cakupan βλασφημῆται ketika objeknya adalah firman Allah
  choice: dicela
  alternative: dihujat; difitnah
  rationale: Pilihan utama mempertahankan gagasan bahwa perilaku yang buruk dapat membuat pesan Allah menjadi sasaran ucapan buruk. Catatan kaki menjaga padanan yang lebih harfiah dan kuat, 'dihujat'.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan daftar dipertahankan secara ringkas. 'Mengurus rumah tangga' dipilih agar tidak disalahpahami sebagai pekerjaan jarak jauh modern, sedangkan catatan kaki mempertahankan bentuk yang lebih harfiah. Semua penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskan.
