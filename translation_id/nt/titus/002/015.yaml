  text: Ταῦτα λάλει καὶ παρακάλει καὶ ἔλεγχε μετὰ πάσης ἐπιταγῆς· μηδείς σου περιφρονείτω.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/015.yaml
  text: Speak these things[a], and exhort and rebuke with all authority. Let no one disregard you.
translation:
  language: id
  text: Sampaikanlah semua ini, nasihatilah dan tegurlah dengan segala wewenang. Janganlah seorang pun meremehkanmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Janganlah seorang pun memandang rendah dirimu” atau “mengabaikanmu.”'
    reason: περιφρονέω dapat berarti memandang rendah, meremehkan, atau tidak mengindahkan; teks utama memakai padanan yang ringkas dan alami.
lexical_decisions:
- source_word: Ταῦτα
  choice: semuanya ini
  rationale: Kata tunjuk netral jamak ini merujuk kembali secara luas kepada berbagai petunjuk sebelumnya tanpa mempersempitnya menjadi hanya ajaran atau perkara tertentu.
- source_word: λάλει
  choice: sampaikanlah
  rationale: Imperatif kini menuntut tindakan verbal yang berkelanjutan. 'Sampaikanlah' terdengar alami dalam konteks pengajaran dan tetap lebih luas daripada 'ajarkanlah'.
- source_word: παρακάλει
  choice: nasihatilah
  rationale: Kata ini dapat berarti mendorong, mendesak, atau menasihati. 'Nasihatilah' mempertahankan daya pastoral dan direktifnya dalam bahasa Indonesia yang wajar.
- source_word: ἔλεγχε
  choice: tegurlah
  rationale: Kata ini menunjuk pada penyingkapan kesalahan disertai koreksi. 'Tegurlah' sesuai dengan konteks pelayanan dan mempertahankan ketegasan imperatif.
- source_word: μετὰ πάσης ἐπιταγῆς
  choice: dengan penuh kewibawaan
  rationale: ἐπιταγή dapat berarti perintah atau wewenang. Dalam konstruksi ini, ungkapan tersebut menyatakan bobot penuh kewenangan dalam melaksanakan ketiga tindakan; 'kewibawaan' secara alami menyampaikan otoritas yang diakui tanpa menyiratkan kekuasaan pribadi yang mandiri.
- source_word: μηδείς
  choice: seorang pun
  rationale: Dalam larangan ini, bentuk tersebut berarti tidak seorang pun; susunan 'jangan ... seorang pun' adalah idiom Indonesia yang jelas.
- source_word: σου
  choice: -mu
  rationale: Pronomina genitif ini adalah orang yang menjadi sasaran sikap περιφρονέω; dalam bahasa Indonesia dinyatakan secara alami dengan enklitik objek '-mu'.
- source_word: περιφρονείτω
  choice: meremehkan
  rationale: Kata ini berarti memandang rendah, meremehkan, atau tidak mengindahkan. 'Meremehkan' mempertahankan unsur penilaian rendah terhadap Titus, sedangkan kemungkinan nuansa pengabaian dicatat dalam catatan kaki.
theological_decisions:
- issue: Daya kewenangan pelayanan Titus dalam μετὰ πάσης ἐπιταγῆς
  choice: Titus diperintahkan untuk menyampaikan, menasihati, dan menegur dengan penuh kewibawaan yang melekat pada tugas yang dipercayakan kepadanya.
  alternative: Ungkapan itu hanya menunjuk pada nada memerintah, atau hanya pada kewenangan pesan tanpa kaitan dengan peranan Titus.
  rationale: Frasa tersebut secara alami menerangkan rangkaian imperatif dan menunjukkan bobot kewenangan dalam pelaksanaannya. Terjemahan ini tidak menjadikannya kuasa pribadi yang otonom dan tidak menentukan secara berlebihan sumber atau struktur kewenangan itu.
- issue: Bentuk larangan μηδείς σου περιφρονείτω
  choice: Jangan biarkan seorang pun meremehkanmu.
  alternative: Jangan seorang pun meremehkanmu.
  rationale: Imperatif orang ketiga Yunani dapat diungkapkan secara alami sebagai larangan langsung atau sebagai 'jangan biarkan'. Pilihan ini menghasilkan bahasa Indonesia yang lancar tanpa menyiratkan bahwa Titus dapat mengendalikan setiap tanggapan orang; maksudnya ialah ia tidak boleh memberi ruang bagi pelayanannya untuk dipandang rendah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada pastoral-tegas. Tiga imperatif dipertahankan secara sejajar. 'Penuh kewibawaan' dipilih daripada 'dengan segala wewenang' agar alami bagi pembaca umum sambil tetap mempertahankan bobot ἐπιταγή. Penanda catatan kaki [a] ditempatkan pada klausa yang memiliki alternatif leksikal.
