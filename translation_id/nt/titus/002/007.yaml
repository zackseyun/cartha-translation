lexical_decisions:
- source_word: περὶ πάντα
  choice: dalam segala hal
  rationale: Frasa ini berfungsi secara adverbial dan menyatakan keluasan seluruh perilaku Titus. Ungkapan ini alami dalam bahasa Indonesia sekaligus mempertahankan kemungkinan arti 'dalam segala sesuatu'.
- source_word: σεαυτὸν παρεχόμενος
  choice: tunjukkanlah dirimu
  rationale: Pilihan ini mempertahankan daya refleksif frasa Yunani dan menyampaikan bahwa Titus harus menampilkan dirinya sebagai teladan. Bentuk perintah dipakai agar hubungan nasihatnya jelas dan alami dalam konteks Indonesia, meskipun bentuk Yunani adalah partisipel yang meneruskan nasihat sebelumnya.
- source_word: τύπον
  choice: teladan
  rationale: Dalam konteks etis, kata ini menunjuk pada contoh atau pola yang patut ditiru. 'Teladan' merupakan padanan Indonesia yang jelas dan wajar.
- source_word: καλῶν ἔργων
  choice: dalam perbuatan baik
  rationale: Frasa ini menjelaskan ranah tempat Titus menjadi teladan. 'Perbuatan baik' mempertahankan istilah etis yang luas tanpa menambahkan muatan doktrinal.
- source_word: ἐν τῇ διδασκαλίᾳ
  choice: dalam pengajaranmu
  rationale: Konteks menunjuk pada kegiatan Titus mengajar. Akhiran '-mu' membuat rujukan itu jelas dalam bahasa Indonesia, tanpa membatasi makna pada rumusan doktrin formal.
- source_word: ἀφθορίαν
  choice: kemurnian
  rationale: Kata ini menyatakan keadaan yang tidak rusak atau tidak tercemar. Dalam konteks pengajaran, 'kemurnian' alami dan cukup luas untuk mencakup ketidakcemaran isi maupun integritas pengajar tanpa memutuskan lebih jauh.
- source_word: σεμνότητα
  choice: kewibawaan
  rationale: Kata ini menunjuk pada kesungguhan yang patut dihormati. 'Kewibawaan' menyampaikan martabat dan bobot yang menimbulkan rasa hormat dalam bahasa Indonesia modern.
theological_decisions:
- issue: Apakah διδασκαλία harus diterjemahkan dengan istilah gerejawi yang lebih teknis
  choice: pengajaranmu
  alternative: ajaran atau doktrin
  rationale: '''Pengajaran'' dapat mencakup isi dan kegiatan mengajar Titus tanpa mempersempitnya menjadi formulasi dogmatis formal.'
- issue: Seberapa khusus makna ἀφθορίαν dalam kaitannya dengan pengajaran
  choice: kemurnian
  alternative: ketidakcemaran atau integritas
  rationale: Teks memungkinkan nuansa pengajaran yang tidak rusak maupun integritas dalam mengajar. 'Kemurnian' menjaga keluasan tersebut, sedangkan catatan kaki mempertahankan alternatif yang lebih harfiah dan interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat jelas bagi pembaca umum. Pengulangan 'tunjukkanlah' pada kalimat kedua tersirat dari struktur Yunani dan dipakai demi kelancaran bahasa Indonesia. Semua alternatif penting yang mencerminkan ambiguitas leksikal dicatat tanpa memasukkan istilah khas denominasi tertentu.
