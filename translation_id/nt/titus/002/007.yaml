  - marker: a
    text: Atau “dalam segala sesuatu” atau “dalam segala segi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pola” atau “contoh yang patut ditiru.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dalam pengajaran”; dapat juga dipahami sebagai “dalam ajaran.”
