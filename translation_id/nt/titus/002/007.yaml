translation:
  language: id
  text: Dalam segala hal[a], tunjukkanlah dirimu sebagai teladan[b] dalam perbuatan baik. Dalam pengajaranmu[c], tunjukkanlah kemurnian[d] dan martabat[e].
  philosophy: optimal-equivalence
