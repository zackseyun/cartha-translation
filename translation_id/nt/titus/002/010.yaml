  text: not pilfering[a], but showing all good faith, so that in everything they may adorn the teaching of God our Savior.
translation:
  language: id
  text: tidak mencuri, melainkan menunjukkan kesetiaan yang sungguh-sungguh[a], supaya dalam segala hal mereka menghiasi ajaran Allah, Juru Selamat kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang dipakai juga sering berarti “iman”; di sini konteksnya menunjuk pada kesetiaan, keteguhan memegang kepercayaan, atau sifat dapat dipercaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: νοσφιζομένους
  choice: mencuri
  rationale: Dalam konteks hamba dan tuan, verba ini berarti mengambil bagi diri sendiri sesuatu yang menjadi milik orang lain. “Mencuri” jelas dan alami; “menggelapkan” akan memberi nuansa hukum yang terlalu khusus.
- source_word: πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν
  choice: menunjukkan kesetiaan yang sepenuhnya tulus
  rationale: Dalam konteks perilaku hamba terhadap tuannya, πίστις terutama menunjuk pada kesetiaan atau sifat dapat dipercaya. “Sepenuhnya” menyampaikan daya intensif πᾶσαν, sedangkan “tulus” mengungkapkan mutu positif ἀγαθήν secara alami dalam bahasa Indonesia.
- source_word: κοσμῶσιν
  choice: menghiasi
  rationale: Pilihan ini mempertahankan metafora Yunani tentang memperindah atau membuat sesuatu tampak menarik melalui perilaku.
- source_word: διδασκαλίαν
  choice: ajaran
  rationale: “Ajaran” merupakan padanan modern dan mudah dipahami untuk διδασκαλία tanpa nuansa teknis yang tidak diperlukan.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Allah, Juru Selamat kita
  rationale: Susunan ini secara wajar menyatakan bahwa Allah adalah Juru Selamat kita dan tidak menambahkan identifikasi yang tidak dinyatakan secara eksplisit dalam klausa ini.
- source_word: ἐν πᾶσιν
  choice: dalam segala hal
  rationale: Padanan ini mempertahankan cakupan luas frasa Yunani dan cocok dengan keseluruhan perilaku yang sedang dibicarakan.
theological_decisions:
- issue: Makna πίστις dalam konteks etis
  choice: kesetiaan
  alternative: iman; sifat dapat dipercaya; keteguhan memegang kepercayaan
  rationale: Konteks hubungan hamba dengan tuan menekankan perilaku yang setia dan dapat dipercaya, bukan tindakan percaya sebagai pokok utama. Catatan kaki mempertahankan rentang makna istilah Yunani tersebut.
- issue: Rujukan gelar “Juru Selamat”
  choice: Allah, Juru Selamat kita
  alternative: memahami gelar ini dalam kaitannya dengan pemakaian gelar “Juru Selamat” bagi Kristus di bagian lain Surat-Surat Pastoral
  rationale: Klausa ini sendiri secara langsung menyebut Allah sebagai Juru Selamat; terjemahan tidak menyisipkan identifikasi kristologis yang tidak dinyatakan di sini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Metafora “menghiasi ajaran” sengaja dipertahankan karena dapat dipahami dan mencerminkan gambaran teks sumber.
