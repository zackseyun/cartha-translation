  text: Δούλους ἰδίοις δεσπόταις ὑποτάσσεσθαι ἐν πᾶσιν, εὐαρέστους εἶναι, μὴ ἀντιλέγοντας,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/009.yaml
  text: Servants are to submit to their own masters in everything[a], to be pleasing, not argumentative[b],
translation:
  language: id
  text: Para budak hendaklah tunduk kepada tuan mereka sendiri dalam segala hal[a], menyenangkan hati tuan mereka, dan tidak membantah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dalam semuanya” atau “dalam setiap hal.”'
    reason: Frasa Yunani ἐν πᾶσιν memiliki cakupan luas yang dipertahankan dalam teks utama.
  - marker: b
    text: 'Atau: “tidak menyangkal” atau “tidak melawan dengan kata-kata.”'
    reason: ἀντιλέγω dapat berarti membantah, menyangkal, atau berbicara menentang.
lexical_decisions:
- source_word: Δούλους
  choice: para budak
  rationale: Dalam konteks hubungan dengan δεσπόταις, istilah ini menunjuk kepada orang-orang yang berstatus budak, bukan sekadar pelayan; pilihan ini mempertahankan kenyataan sosial yang terikat tanpa menyiratkan dukungan terhadap lembaga perbudakan.
- source_word: ἰδίοις δεσπόταις
  choice: tuan mereka sendiri
  rationale: δεσπότης menunjuk kepada pihak yang memiliki dan menjalankan wewenang atas budak; 'tuan' merupakan padanan Indonesia yang alami, sedangkan ἰδίοις dipertahankan sebagai 'mereka sendiri'.
- source_word: ὑποτάσσεσθαι
  choice: hendaklah ... tunduk
  rationale: Infinitif ini berada dalam rangkaian nasihat dan menyatakan sikap menempatkan diri di bawah wewenang; bentuk 'hendaklah' menyampaikan daya nasihat secara wajar dalam bahasa Indonesia.
- source_word: ἐν πᾶσιν
  choice: dalam segala hal
  rationale: Padanan ini mempertahankan cakupan luas frasa Yunani tanpa menambahkan pembatas yang tidak terdapat dalam ayat.
- source_word: εὐαρέστους εἶναι
  choice: berusaha menyenangkan hati mereka
  rationale: εὐάρεστος berarti 'menyenangkan' atau 'berkenan'. Penambahan objek tersirat 'mereka' merujuk secara alami kepada para tuan; 'berusaha' mengungkapkan perilaku yang dikehendaki tanpa menjanjikan hasil.
- source_word: μὴ ἀντιλέγοντας
  choice: tidak membantah
  rationale: ἀντιλέγω dapat berarti berbicara menentang, menyangkal, atau melawan secara verbal. 'Tidak membantah' ringkas, bermartabat, dan sesuai dengan konteks perilaku terhadap tuan.
theological_decisions:
- issue: Pemaknaan δοῦλος dalam aturan rumah tangga
  choice: budak
  alternative: hamba atau pelayan
  rationale: Penyebutan δεσπόταις menunjukkan status sosial yang terikat dan berada di bawah kuasa tuan. 'Budak' mempertahankan realitas historis tersebut dan tidak melunakkannya menjadi hubungan kerja biasa; penerjemahan ini tidak berarti mengesahkan lembaga perbudakan.
- issue: Cakupan 'dalam segala hal'
  choice: mempertahankan ungkapan luas tanpa pembatas tambahan
  alternative: menambahkan batas moral secara eksplisit dalam teks
  rationale: ἐν πᾶσιν memang luas, tetapi ayat ini sendiri tidak menyatakan pengecualian. Terjemahan mempertahankan ketegangan teks dan tidak menyisipkan penyelesaian teologis yang berasal dari luar ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Para budak' dipilih demi ketepatan sejarah; 'tuan' mempertahankan relasi sosial dalam dunia kuno. Struktur kalimat mengikuti rangkaian nasihat Yunani sambil tetap alami dalam bahasa Indonesia.
