  text: For the grace of God has appeared[b][a], bringing salvation to all people.
translation:
  language: id
  text: Sebab anugerah Allah telah nyata, membawa keselamatan bagi semua orang.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “telah tampak” atau “telah muncul.”'
    reason: lexical_alternative
  - marker: b
    text: Susunan Yunani juga dapat dipahami sebagai “anugerah Allah telah nyata kepada semua orang” atau sebagai “anugerah Allah telah nyata, yang menyelamatkan semua orang.”
    reason: syntactical_alternative
lexical_decisions:
- source_word: Ἐπεφάνη
  choice: telah dinyatakan
  rationale: Bentuk aoris ini dipakai secara intransitif dengan arti ‘telah tampak/menjadi nyata’. ‘Telah dinyatakan’ menyampaikan kemunculan nyata anugerah Allah secara wajar dan bermartabat dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memberikan dasar atau alasan bagi nasihat sebelumnya; ‘Sebab’ mempertahankan hubungan penjelas tersebut.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: anugerah Allah
  rationale: ‘Anugerah’ merupakan padanan yang lazim dan jelas bagi χάρις dalam konteks Paulus, sedangkan bentuk ringkas ‘Allah’ secara alami menyatakan genitif τοῦ θεοῦ.
- source_word: σωτήριος
  choice: yang membawa keselamatan
  rationale: Adjektiva ini menerangkan anugerah sebagai sesuatu yang menyelamatkan atau membawa keselamatan. Bentuk klausa relatif ini lebih alami daripada ‘anugerah yang menyelamatkan’ dan tidak menambahkan teori keselamatan tertentu.
- source_word: πᾶσιν ἀνθρώποις
  choice: bagi semua orang
  rationale: ἄνθρωποι bersifat generik dan mengacu kepada manusia, bukan hanya laki-laki. Dativus dapat menyatakan pihak yang menerima manfaat atau arah; ‘bagi semua orang’ sesuai dengan ‘membawa keselamatan’ sambil mempertahankan cakupan luas ungkapan Yunani.
theological_decisions:
- issue: Cakupan πᾶσιν ἀνθρώποις dalam hubungannya dengan keselamatan
  choice: bagi semua orang
  alternative: kepada semua orang; bagi segala macam orang
  rationale: Terjemahan mempertahankan cakupan universal ungkapan Yunani tanpa menentukan apakah yang dimaksud ialah setiap individu tanpa kecuali atau semua golongan manusia.
- issue: Hubungan sintaksis σωτήριος πᾶσιν ἀνθρώποις
  choice: σωτήριος dipahami menerangkan ‘anugerah’, dengan πᾶσιν ἀνθρώποις sebagai pihak yang menjadi sasaran atau penerima manfaat keselamatan
  alternative: ‘telah dinyatakan kepada semua orang’; ‘telah dinyatakan dan menyelamatkan semua orang’
  rationale: Susunan Yunani memungkinkan sedikit perbedaan pengaitan. Teks utama memilih pembacaan yang paling alami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan ambiguitas yang nyata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Anugerah’ dipilih sebagai istilah yang umum dipahami dalam konteks Alkitab. Penempatan verba ‘telah dinyatakan’ di akhir menghasilkan susunan alami sambil menjaga fokus pada anugerah Allah dan sifatnya yang membawa keselamatan.
