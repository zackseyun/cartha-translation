lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan atau hasil yang dimaksud dan terdengar alami dalam bahasa Indonesia modern.
- source_word: σωφρονίζωσι
  choice: mereka membimbing
  rationale: Kata kerja ini mencakup tindakan menasihati, melatih, atau mengarahkan seseorang kepada sikap dan perilaku yang bijaksana. “Membimbing” mempertahankan unsur pembentukan perilaku tanpa membatasinya pada pengajaran kognitif.
- source_word: τὰς νέας
  choice: perempuan-perempuan yang lebih muda
  rationale: Adjektiva feminin jamak dengan artikel menunjuk kepada perempuan yang lebih muda, sebagai kontras dengan perempuan yang lebih tua dalam konteks sebelumnya. Terjemahan ini tidak mempersempit maknanya menjadi “istri-istri muda”.
- source_word: φιλάνδρους
  choice: mengasihi suami
  rationale: Adjektiva ini menggambarkan kasih kepada suami. Bentuk verbal “mengasihi” merupakan ungkapan Indonesia yang alami dan tetap menyampaikan watak penuh kasih yang dimaksud.
- source_word: εἶναι
  choice: untuk
  rationale: Dalam susunan Indonesia, infinitif εἶναι beserta adjektiva pelengkapnya paling alami diungkapkan dengan konstruksi “membimbing ... untuk mengasihi”.
- source_word: φιλοτέκνους
  choice: mengasihi ... anak-anak mereka
  rationale: Adjektiva ini menggambarkan kasih kepada anak-anak. Perumusan ini dibuat sejajar dengan φιλάνδρους sambil memperjelas bahwa anak-anak itu adalah anak-anak perempuan yang lebih muda tersebut.
theological_decisions:
- issue: Cakupan sebutan bagi perempuan yang lebih muda dalam konteks kehidupan rumah tangga
  choice: Menerjemahkan τὰς νέας sebagai “perempuan-perempuan yang lebih muda” dan mempertahankan rujukan konkret kepada suami serta anak-anak.
  alternative: Menerjemahkannya sebagai “istri-istri muda” atau mengubah ayat ini menjadi pernyataan umum tentang peran semua perempuan.
  rationale: Bahasa Yunani menunjuk kepada perempuan yang lebih muda tanpa secara eksplisit menyebut mereka “istri”, meskipun gambaran berikutnya mengandaikan keadaan mereka yang memiliki suami dan anak. Terjemahan tidak boleh mempersempit rujukan atau menjadikannya definisi menyeluruh tentang perempuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Membimbing” dipilih sebagai ungkapan yang cukup luas bagi nasihat dan pembentukan perilaku, sedangkan “mengasihi” menghindari susunan yang kaku tanpa menghilangkan kesejajaran kedua adjektiva Yunani.
