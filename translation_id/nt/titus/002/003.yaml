  text: Πρεσβύτιδας ὡσαύτως ἐν καταστήματι ἱεροπρεπεῖς, μὴ διαβόλους ⸀μηδὲ οἴνῳ πολλῷ δεδουλωμένας, καλοδιδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/003.yaml
  text: Older women likewise are to be reverent in behavior[a], not slanderers nor enslaved to much wine, teachers of what is good[b],
translation:
  language: id
  text: Demikian juga, perempuan-perempuan yang lebih tua hendaklah bersikap saleh, bukan pemfitnah dan tidak diperbudak oleh anggur dalam jumlah banyak[a], serta menjadi pengajar tentang hal-hal yang baik,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak kecanduan anggur dalam jumlah banyak.” Secara lebih harfiah, teks Yunani mengatakan “telah diperbudak oleh anggur dalam jumlah banyak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβύτιδας
  choice: perempuan-perempuan yang lebih tua
  rationale: Menunjuk khusus kepada perempuan yang sudah lanjut usia, sejajar dengan laki-laki yang lebih tua pada ayat sebelumnya. Ungkapan ini alami dalam bahasa Indonesia modern dan mempertahankan acuan usia.
- source_word: ὡσαύτως
  choice: Demikian juga
  rationale: Mempertahankan kaitan wacana dengan nasihat sebelumnya secara ringkas dan alami.
- source_word: ἐν καταστήματι ἱεροπρεπεῖς
  choice: berperilaku layaknya orang yang mengabdi kepada Allah
  rationale: κατάστημα menunjuk pada perilaku atau pembawaan yang tampak, sedangkan ἱεροπρεπής berarti patut bagi ranah sakral. Rumusan ini menyampaikan gabungan maknanya dengan bahasa Indonesia yang jelas tanpa menyatakan bahwa perempuan itu sendiri bersifat ilahi atau secara teknis memegang jabatan keagamaan.
- source_word: μὴ διαβόλους
  choice: tidak suka memfitnah
  rationale: Dalam daftar etis ini, διάβολος menunjuk kepada orang yang memfitnah atau membuat tuduhan jahat, bukan kepada Iblis. Bentuk 'tidak suka memfitnah' lebih alami daripada nomina pelaku dalam kalimat Indonesia.
- source_word: μηδὲ οἴνῳ πολλῷ δεδουλωμένας
  choice: tidak diperbudak oleh banyak anggur
  rationale: Bentuk perfektum pasif δουλόω mempertahankan gambaran perbudakan atau penguasaan oleh anggur. 'Diperbudak' lebih dekat kepada metafora Yunani daripada 'kecanduan'.
- source_word: καλοδιδασκάλους
  choice: mengajarkan apa yang baik
  rationale: Kata majemuk langka ini menggambarkan orang yang mengajarkan hal-hal baik. Pilihan verbal ini alami dalam bahasa Indonesia dan menghindari ambiguitas 'pengajar yang baik', yang dapat berarti pengajar yang cakap.
theological_decisions:
- issue: Gambaran δουλόω dalam nasihat etis mengenai anggur
  choice: 'Mempertahankan bahasa perbudakan: ''diperbudak oleh banyak anggur'''
  alternative: '''kecanduan banyak anggur'' atau ''dikuasai oleh banyak anggur'''
  rationale: Teks Yunani menggambarkan dominasi anggur sebagai perbudakan. Mempertahankan metafora ini menjaga daya teologis dan etis teks tanpa menggantinya dengan kategori klinis modern.
- issue: Makna sakral dalam ἱεροπρεπεῖς
  choice: '''layaknya orang yang mengabdi kepada Allah'''
  alternative: '''penuh hormat'', ''patut bagi orang kudus'', atau ''sesuai dengan kekudusan'''
  rationale: Kata itu menyatakan perilaku yang pantas dalam kaitannya dengan yang sakral. Pilihan ini menjaga nuansa tersebut dengan ungkapan yang dapat dipahami pembaca umum, tanpa memasukkan jabatan gerejawi tertentu.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Struktur daftar nasihat dipertahankan; tanda koma akhir mengikuti kelanjutan sintaksis ke ayat berikutnya. Penanda catatan kaki [a] tercantum dalam teks utama.
