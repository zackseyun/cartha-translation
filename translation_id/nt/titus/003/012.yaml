id: TIT.3.12
reference: Titus 3:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὅταν πέμψω Ἀρτεμᾶν πρὸς σὲ ἢ Τυχικόν, σπούδασον ἐλθεῖν πρός με εἰς Νικόπολιν, ἐκεῖ γὰρ κέκρικα παραχειμάσαι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/012.yaml
  text: When I send Artemas or Tychicus to you[a], make every effort to come to me at Nicopolis[b], for I have decided to spend the winter there.
translation:
  language: id
  text: Ketika aku mengutus Artemas atau Tikhikus kepadamu, berusahalah sungguh-sungguh untuk datang kepadaku di Nikopolis, sebab aku telah memutuskan untuk melewatkan musim dingin di sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν πέμψω
  choice: Ketika aku mengutus
  rationale: Konstruksi ὅταν dengan aoristus subjungtif menunjuk pada peristiwa mendatang yang diantisipasi; bentuk kini bahasa Indonesia sesudah 'ketika' secara alami menyampaikan makna tersebut.
- source_word: Ἀρτεμᾶν
  choice: Artemas
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan dekat dengan bentuk Yunani.
- source_word: ἢ Τυχικόν
  choice: atau Tikhikus
  rationale: ἤ menyatakan pilihan antara dua utusan; Τυχικός ditransliterasikan sebagai Tikhikus agar χ tercermin tanpa mengganggu keterbacaan Indonesia.
- source_word: σπούδασον
  choice: berusahalah sungguh-sungguh
  rationale: Imperatif ini menekankan kesungguhan dan upaya yang tekun, bukan semata-mata kecepatan.
- source_word: ἐλθεῖν πρός με
  choice: untuk datang kepadaku
  rationale: Gerak diarahkan kepada penulis, sehingga 'datang kepadaku' paling alami dan tepat.
- source_word: εἰς Νικόπολιν
  choice: di Nikopolis
  rationale: Sesudah 'datang kepadaku', lokasi tujuan dinyatakan secara alami dengan 'di Nikopolis', tanpa mengulang 'ke' dan tanpa mengubah arah gerak.
- source_word: γὰρ
  choice: sebab
  rationale: Menghubungkan keputusan Paulus sebagai alasan bagi permintaan sebelumnya dalam ragam bahasa yang dignified dan alami.
- source_word: κέκρικα
  choice: aku telah memutuskan
  rationale: Bentuk perfek menyatakan keputusan yang sudah diambil dan tetap berlaku pada saat penulisan.
- source_word: παραχειμάσαι
  choice: untuk melewatkan musim dingin
  rationale: Kata ini berarti tinggal atau bermukim selama musim dingin; ungkapan ini jelas dan wajar bagi pembaca modern.
theological_decisions: []
