  source_fidelity: 'Teks Indonesia menyampaikan keempat unsur utama dengan setia: αἱρετικὸν sebagai orang yang dicirikan oleh tindakan memecah belah, ἄνθρωπον sebagai “orang”, urutan dua νουθεσία sebagai “peringatan pertama dan kedua”, dan παραιτοῦ sebagai perintah tegas “Tolaklah.” Pilihan “setelah” mempertahankan urutan tindakan dalam μετὰ tanpa menambahkan syarat-syarat disiplin yang tidak disebutkan.'
  naturalness: “Tolaklah orang yang suka menimbulkan perpecahan setelah peringatan pertama dan kedua” adalah bahasa Indonesia baku, jelas, dan lugas. Frasa “suka menimbulkan perpecahan” secara wajar menyatakan sifat yang dicakup oleh adjektiva αἱρετικός dan tidak terdengar sebagai istilah teknis gerejawi yang anakronistis.
  terminology: “Orang” tepat untuk ἄνθρωπον dalam pemakaian generik. “Peringatan” merupakan padanan modern yang baik untuk νουθεσία dalam konteks koreksi. Terjemahan utama menghindari “orang sesat,” yang dapat memaksakan pengertian teknis teologis kemudian. Catatan kaki dengan tepat melestarikan alternatif tradisional dan alternatif leksikal.
