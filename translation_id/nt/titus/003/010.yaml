  text: Reject a divisive person after a first and second warning,[a]
translation:
  language: id
  text: Tolaklah orang yang suka menimbulkan perpecahan setelah peringatan pertama dan kedua,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang membentuk golongan”; dalam terjemahan tradisional, “orang sesat.” Istilah Yunani ini kemungkinan menunjuk kepada orang yang menciptakan perpecahan antargolongan.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρετικὸν
  choice: yang suka menimbulkan perpecahan
  rationale: Dalam konteks Yunani Koine, istilah ini terutama menunjuk kepada orang yang membentuk golongan atau menimbulkan perpecahan, bukan semata-mata kepada penganut ajaran sesat dalam pengertian teknis gerejawi yang berkembang kemudian.
- source_word: ἄνθρωπον
  choice: orang
  rationale: Kata ini menunjuk kepada seorang individu; 'orang' adalah padanan Indonesia yang alami dan tidak menambahkan penekanan gender yang tidak diperlukan oleh konteks.
- source_word: μετὰ μίαν καὶ δευτέραν νουθεσίαν
  choice: setelah peringatan pertama dan kedua
  rationale: Ungkapan ini menunjukkan tindakan berurutan setelah dua kali teguran korektif. 'Peringatan' menyampaikan daya korektif νουθεσία secara jelas dalam bahasa Indonesia modern.
- source_word: παραιτοῦ
  choice: Tolaklah
  rationale: Imperatif ini memerintahkan penolakan tegas terhadap hubungan atau penerimaan lebih lanjut terhadap orang tersebut; 'Tolaklah' ringkas dan mempertahankan kekuatan perintah.
theological_decisions:
- issue: Apakah αἱρετικὸν harus diterjemahkan dengan istilah doktrinal teknis atau menurut makna perpecahan golongan
  choice: orang yang suka menimbulkan perpecahan
  alternative: orang sesat; orang yang membentuk golongan
  rationale: Pilihan ini mempertahankan makna yang paling mungkin dalam konteks disiplin jemaat dan tidak memasukkan konsep teknis tentang bidah yang berkembang pada masa kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Bentuk 'suka menimbulkan' menyatakan kecenderungan yang mencirikan orang tersebut, sedangkan susunan 'peringatan pertama dan kedua' mempertahankan urutan tindakan disipliner dalam teks sumber.
