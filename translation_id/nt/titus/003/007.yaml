reference: Titus 3:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα δικαιωθέντες τῇ ἐκείνου χάριτι κληρονόμοι ⸀γενηθῶμεν κατ’ ἐλπίδα ζωῆς αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/007.yaml
  text: so that[a], having been justified by his grace[b], we might become heirs according to the hope of eternal life.
translation:
  language: id
  text: supaya setelah dibenarkan[a] oleh anugerah-Nya, kita menjadi ahli waris sesuai dengan pengharapan akan hidup kekal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dibenarkan” juga dapat diterjemahkan “dinyatakan benar.”
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dalam pengharapan akan hidup kekal.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan atau hasil; “supaya” alami dalam bahasa Indonesia dan mempertahankan daya purposif klausa.
- source_word: δικαιωθέντες
  choice: setelah dibenarkan
  rationale: Mempertahankan bentuk pasif dan tindakan yang mendahului verba utama. Alternatif “setelah dinyatakan benar” dicatat tanpa membatasi maknanya di dalam teks utama.
- source_word: τῇ ἐκείνου χάριτι
  choice: oleh anugerah-Nya
  rationale: Datif instrumental diterjemahkan secara alami. Akhiran “-Nya” tidak memaksakan penyebutan eksplisit siapa yang dirujuk oleh ἐκείνου.
- source_word: κληρονόμοι
  choice: ahli waris
  rationale: Padanan Indonesia yang lazim dan tetap mempertahankan gambaran tentang warisan.
- source_word: γενηθῶμεν
  choice: kita menjadi
  rationale: Menggambarkan masuknya kita ke dalam suatu kedudukan tanpa menambahkan gagasan kausatif yang lebih tegas daripada teks Yunani.
- source_word: κατ’ ἐλπίδα
  choice: sesuai dengan pengharapan
  rationale: Mempertahankan hubungan yang dinyatakan oleh κατά, meskipun ungkapan “dalam pengharapan” juga mungkin.
- source_word: ζωῆς αἰωνίου
  choice: akan hidup kekal
  rationale: Dalam bahasa Indonesia, “pengharapan akan hidup kekal” secara alami menyatakan hidup kekal sebagai isi atau sasaran pengharapan.
theological_decisions:
- issue: Makna δικαιωθέντες dalam konteks keselamatan
  choice: dibenarkan
  alternative: dinyatakan benar
  rationale: “Dibenarkan” mempertahankan hubungan istilah δικαιόω dengan bahasa teologis Perjanjian Baru tanpa menetapkan mekanismenya secara lebih sempit; alternatif dijelaskan dalam catatan kaki.
- issue: Rujukan ἐκείνου
  choice: -Nya
  alternative: Allah atau Yesus Kristus disebutkan secara eksplisit
  rationale: Pronomina Yunani tidak menyebutkan rujukannya kembali secara eksplisit dalam ayat ini. “-Nya” menjaga ketegangan rujukan tersebut dan tidak memaksakan identifikasi.
- issue: Hubungan κατ’ ἐλπίδα dengan warisan dan hidup kekal
  choice: sesuai dengan pengharapan akan hidup kekal
  alternative: dalam pengharapan akan hidup kekal
  rationale: Teks utama mempertahankan nilai dasar κατά, sedangkan alternatif yang lebih idiomatis dan mungkin secara sintaksis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan hubungan logis dengan ayat sebelumnya. Istilah “anugerah,” “ahli waris,” dan “hidup kekal” dipilih karena jelas bagi pembaca umum sekaligus mempertahankan citra dan kosakata teologis sumber.
