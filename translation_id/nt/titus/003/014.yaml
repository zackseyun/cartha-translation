id: TIT.3.14
reference: Titus 3:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μανθανέτωσαν δὲ καὶ οἱ ἡμέτεροι καλῶν ἔργων προΐστασθαι εἰς τὰς ἀναγκαίας χρείας, ἵνα μὴ ὦσιν ἄκαρποι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/014.yaml
  text: And let our people also learn to engage in good works for necessary needs[c][b][a], so that they may not be unfruitful.
translation:
  language: id
  text: Orang-orang kita[a] juga hendaklah belajar untuk giat melakukan perbuatan baik[b] demi memenuhi kebutuhan yang mendesak[c], supaya mereka tidak hidup tanpa buah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang kita sendiri.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menekuni perbuatan baik” atau “memelopori perbuatan baik.”
    reason: lexical_alternative
  - marker: c
    text: Atau “kebutuhan yang perlu dipenuhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μανθανέτωσαν
  choice: hendaklah belajar
  rationale: Bentuk imperatif orang ketiga jamak dipertahankan sebagai ajakan/perintah yang wajar dalam bahasa Indonesia tanpa memperkerasnya secara berlebihan.
- source_word: οἱ ἡμέτεροι
  choice: orang-orang kita
  rationale: Secara harfiah berarti 'milik kita/orang kita' dan dalam konteks menunjuk kepada anggota komunitas yang terkait dengan Paulus dan Titus; bentuk ini tidak membatasi rujukannya hanya kepada laki-laki.
- source_word: καλῶν ἔργων
  choice: perbuatan baik
  rationale: Padanan Indonesia yang alami dan transparan, sekaligus mempertahankan tema perbuatan baik yang berulang dalam surat Titus.
- source_word: προΐστασθαι
  choice: giat melakukan
  rationale: Dalam konstruksi dengan 'perbuatan baik', verba ini menunjuk pada keterlibatan yang aktif dan bersungguh-sungguh. Pilihan ini tetap membuka nuansa menekuni atau tampil di depan tanpa menjadikannya jabatan kepemimpinan.
- source_word: εἰς τὰς ἀναγκαίας χρείας
  choice: demi memenuhi kebutuhan yang mendesak
  rationale: Mengungkapkan tujuan praktis perbuatan baik, yaitu menanggapi kebutuhan nyata yang perlu atau mendesak, dalam susunan Indonesia yang tidak berulang secara janggal.
- source_word: ἵνα μὴ ὦσιν ἄκαρποι
  choice: supaya mereka tidak hidup tanpa buah
  rationale: Mempertahankan klausa tujuan dan citra 'tanpa buah', sambil memakai ungkapan Indonesia yang alami untuk keadaan hidup yang tidak menghasilkan manfaat.
theological_decisions:
- issue: Cakupan οἱ ἡμέτεροι
  choice: anggota komunitas Kristen yang terkait dengan Paulus dan Titus ('orang-orang kita')
  alternative: orang-orang kita sendiri, mungkin dalam kontras dengan orang luar
  rationale: Ungkapan Yunani bersifat relasional dan komunal serta tidak secara gramatikal membatasi rujukannya kepada laki-laki; terjemahan tidak mempersempit kelompok yang dimaksud.
- issue: Nuansa προΐστασθαι
  choice: keterlibatan aktif dan tekun dalam perbuatan baik
  alternative: memelopori atau memimpin dalam perbuatan baik
  rationale: Verba tersebut dapat memiliki nuansa memimpin, mengurus, atau mencurahkan perhatian. Konteks tidak menuntut rujukan kepada jabatan gerejawi, sehingga ambiguitas penting dicatat tanpa dimasukkan secara dogmatis ke dalam teks utama.
- issue: Metafora ἄκαρποι
  choice: mempertahankan citra hidup tanpa buah
  alternative: tidak berguna atau tidak efektif
  rationale: Metafora buah memiliki daya moral dan rohani yang lebih luas daripada sekadar keefektifan; terjemahan tidak mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang hangat dan bermartabat. 'Hendaklah' mempertahankan daya imperatif; 'giat melakukan' mudah dipahami pembaca umum; dan 'hidup tanpa buah' mempertahankan metafora sumber tanpa ungkapan negatif ganda yang kaku.
