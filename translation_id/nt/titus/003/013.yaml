base_translation:
  language: en
  yaml_path: translation/nt/titus/003/013.yaml
  text: Diligently send Zenas the lawyer and Apollos on their way[a], so that they may lack nothing.
translation:
  language: id
  text: Bantulah Zenas, ahli hukum, dan Apolos dengan sungguh-sungguh dalam perjalanan mereka, supaya mereka tidak kekurangan apa pun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ζηνᾶν
  choice: Zenas
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: τὸν νομικόν
  choice: ahli hukum itu
  rationale: νομικός menyebut orang yang terampil dalam bidang hukum. Dalam konteks ini frasa tersebut paling wajar dipahami sebagai keterangan profesi Zenas, tanpa menentukan secara berlebihan jenis hukum yang dimaksud.
- source_word: Ἀπολλῶν
  choice: Apolos
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: σπουδαίως
  choice: dengan sungguh-sungguh
  rationale: Adverbia ini menyatakan kesungguhan, ketekunan, dan perhatian serius; pilihan ini tidak mempersempit maknanya menjadi sekadar kecepatan.
- source_word: πρόπεμψον
  choice: Bantulah ... dalam perjalanan mereka
  rationale: Dalam konteks perjalanan, προπέμπω dapat mencakup mengantar atau melepas seseorang dengan menyediakan dukungan praktis yang diperlukan. Rumusan ini menyampaikan unsur bantuan perjalanan dengan jelas dan alami.
- source_word: ἵνα μηδὲν αὐτοῖς λείπῃ
  choice: supaya mereka tidak kekurangan apa pun
  rationale: Klausa tujuan ini dipertahankan secara langsung dan mencakup segala kebutuhan mereka tanpa membatasi jenis perbekalannya.
