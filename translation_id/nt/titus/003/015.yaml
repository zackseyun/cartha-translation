id: TIT.3.15
reference: Titus 3:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀσπάζονταί σε οἱ μετ’ ἐμοῦ πάντες. ἄσπασαι τοὺς φιλοῦντας ἡμᾶς ἐν πίστει. ἡ χάρις μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/015.yaml
  text: All who are with me greet you[a]. Greet those who love us in faith. Grace be with all of you.
translation:
  language: id
  text: Semua orang yang bersama saya menyampaikan salam kepadamu. Sampaikan salam kepada mereka yang mengasihi kami dalam iman.[a] Anugerah menyertai kamu semua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam iman yang sama”; mungkin juga “dengan setia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονταί
  choice: menyampaikan salam
  rationale: Dalam penutup surat, verba ini menyatakan penyampaian salam. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan arah salam kepada Titus.
- source_word: οἱ μετ’ ἐμοῦ πάντες
  choice: Semua orang yang bersama saya
  rationale: Mempertahankan πάντες ('semua') dan relasi kebersamaan yang dinyatakan oleh μετά dengan genitif.
- source_word: ἄσπασαι
  choice: Sampaikan salam kepada
  rationale: Bentuk imperatif ini merupakan perintah untuk meneruskan salam dalam konteks penutup surat; pilihan ini lebih idiomatis daripada sekadar 'salamilah'.
- source_word: φιλοῦντας
  choice: yang mengasihi
  rationale: φιλέω di sini menunjukkan kasih atau keakraban pribadi; 'mengasihi' menyampaikan daya relasionalnya dengan register yang pantas.
- source_word: ἐν πίστει
  choice: dalam iman
  rationale: Terjemahan ini mempertahankan bentuk tanpa artikel dan membiarkan frasa tersebut menunjuk pada iman sebagai lingkungan atau dasar kasih. Kemungkinan 'dalam iman yang sama' dan 'dengan setia' dicatat dalam catatan kaki.
- source_word: ἡ χάρις
  choice: Anugerah
  rationale: Merupakan rumusan berkat penutup Paulus. 'Anugerah' adalah padanan teologis yang alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: μετὰ πάντων ὑμῶν
  choice: menyertai kamu semua
  rationale: Kata kerja yang tersirat dilengkapi secara alami, sementara πάντων tetap dinyatakan dengan 'semua'. Bentuk ὑμῶν adalah jamak, yang tercermin melalui 'kamu semua'.
theological_decisions:
- issue: Makna πίστις dalam ἐν πίστει
  choice: iman
  alternative: iman yang sama; kesetiaan
  rationale: Dalam konteks salam penutup, 'dalam iman' paling langsung mempertahankan ungkapan Yunani dan kemungkinan bahwa iman adalah lingkungan atau dasar kasih. Teks tidak secara tegas menentukan apakah yang dimaksud ialah iman bersama sebagai isi kepercayaan atau kesetiaan, sehingga alternatifnya tidak disingkirkan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Saya' dan 'kamu' dipakai agar surat terdengar pribadi dan alami; bentuk jamak pada ὑμῶν diperjelas dengan 'kamu semua'. Ungkapan epistoler diterjemahkan secara idiomatis tanpa menghilangkan pengulangan salam.
