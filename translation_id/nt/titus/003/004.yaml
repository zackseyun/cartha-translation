  yaml_path: translation/nt/titus/003/004.yaml
  text: But when the kindness and love for humanity of God our Savior appeared,[a]
translation:
  language: id
  text: Namun, ketika kebaikan hati Allah, Juru Selamat kita, dan kasih-Nya kepada manusia tampak,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kasih kepada umat manusia”; istilah Yunani ini berarti kemurahan atau kasih terhadap manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Namun, ketika
  rationale: ὅτε memperkenalkan anak kalimat waktu, sedangkan δέ menandai peralihan yang bernuansa kontras dari keadaan manusia dalam ayat sebelumnya kepada tindakan penyelamatan Allah.
- source_word: χρηστότης
  choice: kebaikan hati
  rationale: Ungkapan ini menyampaikan kebaikan yang nyata dalam sikap dan tindakan terhadap pihak lain, sekaligus tetap dapat dibedakan dari kasih yang disebut sesudahnya.
- source_word: φιλανθρωπία
  choice: kasih ... terhadap umat manusia
  rationale: Istilah Yunani ini menunjuk pada kasih atau kemurahan terhadap manusia. Terjemahan ini transparan, alami dalam bahasa Indonesia modern, dan tidak memakai istilah teknis modern.
- source_word: ἐπεφάνη
  choice: menjadi nyata
  rationale: Bentuk ini menyatakan kemunculan atau manifestasi. 'Menjadi nyata' terdengar alami dan mempertahankan gagasan bahwa sifat Allah tampil secara nyata tanpa menentukan secara berlebihan cara penampakannya.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Allah, Juru Selamat kita
  rationale: Susunan ini mempertahankan 'Juru Selamat kita' sebagai sebutan bagi Allah dan menyatakan bahwa kebaikan hati serta kasih yang disebutkan adalah milik Allah.
theological_decisions:
- issue: Rujukan frasa 'Allah, Juru Selamat kita'
  choice: Terjemahan mempertahankan gelar itu bagi Allah tanpa menambahkan identifikasi pribadi ke dalam ayat.
  alternative: Menafsirkan secara eksplisit bahwa gelar tersebut merujuk kepada Allah Bapa berdasarkan konteks, terutama pembedaan dengan Yesus Kristus dalam ayat 6.
  rationale: Dalam konteks Surat-Surat Pastoral, frasa ini lazim merujuk kepada Allah Bapa, tetapi ayat ini sendiri tidak menyebut 'Bapa'. Karena itu, terjemahan mempertahankan rumusan sumber dan tidak menyelesaikan lebih jauh apa yang dibiarkan implisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kebaikan hati' dipilih agar berbeda secara wajar dari 'kasih', sedangkan 'umat manusia' menyatakan cakupan manusia secara kolektif. Tanda koma mengapit gelar aposisional 'Juru Selamat kita'.
