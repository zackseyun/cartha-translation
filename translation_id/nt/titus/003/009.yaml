id: TIT.3.9
reference: Titus 3:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μωρὰς δὲ ζητήσεις καὶ γενεαλογίας καὶ ⸀ἔρεις καὶ μάχας νομικὰς περιΐστασο, εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/009.yaml
  text: But avoid foolish controversies and genealogies and strife and quarrels about the law[b][a], for they are unprofitable and futile.
translation:
  language: id
  text: Namun, hindarilah perdebatan bodoh[a], silsilah-silsilah, pertengkaran, dan perselisihan tentang hukum[b], sebab semuanya tidak berguna dan sia-sia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “persoalan bodoh”, “perbantahan bodoh”, atau “spekulasi bodoh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “perselisihan yang berkaitan dengan hukum”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς ζητήσεις
  choice: perdebatan bodoh
  rationale: ζητήσεις dalam konteks Surat-Surat Pastoral menunjuk pada pembahasan yang mengundang pertikaian, bukan pertanyaan netral; μωράς menilainya sebagai bodoh atau tidak masuk akal. 'Perdebatan bodoh' alami dalam bahasa Indonesia dan mempertahankan daya moral-praktis frasa itu.
- source_word: γενεαλογίας
  choice: silsilah-silsilah
  rationale: Padanan langsung bentuk jamak ini mempertahankan ketidakjelasan mengenai jenis atau penggunaan silsilah yang dimaksud tanpa memasukkan rekonstruksi historis tertentu.
- source_word: ἔρεις
  choice: pertengkaran
  rationale: ἔρις menyatakan perselisihan atau pertikaian. 'Pertengkaran' membedakannya secara cukup alami dari μάχας, meskipun makna keduanya bertumpang tindih.
- source_word: μάχας νομικὰς
  choice: perselisihan tentang hukum
  rationale: μάχας di sini menunjuk pada konflik verbal, sedangkan νομικάς menerangkan kaitannya dengan hukum. Ungkapan ini jelas dan tidak menimbulkan kesan perkara di pengadilan.
- source_word: περιΐστασο
  choice: hindarilah
  rationale: Imperatif medial ini memerintahkan Titus untuk menjauhkan diri dari hal-hal tersebut. 'Hindarilah' ringkas, wajar, dan mempertahankan daya perintahnya.
- source_word: ἀνωφελεῖς
  choice: tidak berguna
  rationale: Kata ini berarti tidak bermanfaat atau tidak mendatangkan faedah. 'Tidak berguna' merupakan padanan Indonesia modern yang jelas.
- source_word: μάταιοι
  choice: sia-sia
  rationale: μάταιος menyatakan kehampaan atau kesia-siaan. 'Sia-sia' mempertahankan gagasan bahwa kegiatan itu tidak menghasilkan tujuan yang bernilai.
theological_decisions:
- issue: Sifat 'silsilah-silsilah' dan 'perselisihan tentang hukum'
  choice: Istilah-istilah tersebut diterjemahkan secara umum tanpa mengaitkannya secara khusus dengan suatu sistem Yahudi, Gnostik, atau ajaran sesat tertentu.
  alternative: Menafsirkannya secara eksplisit sebagai perdebatan silsilah Yahudi atau spekulasi mitologis proto-Gnostik.
  rationale: Ayat ini menyebut praktik-praktik tersebut tetapi tidak mendefinisikannya dengan cukup khusus. Terjemahan umum menjaga transparansi dan tidak memasukkan rekonstruksi historis atau teologis yang melampaui teks.
- issue: Rujukan νόμος dalam νομικὰς
  choice: Dipertahankan sebagai 'hukum' tanpa menentukan secara eksplisit bahwa yang dimaksud ialah Hukum Musa.
  alternative: Menerjemahkannya sebagai 'Hukum Taurat'.
  rationale: Konteks mungkin mengarah pada perdebatan mengenai Hukum Taurat, tetapi bentuk adjektival νομικάς dalam ayat ini sendiri tidak menyebut Musa atau Taurat secara eksplisit. 'Hukum' mempertahankan keluasan ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat pastoral yang tegas dan bermartabat. Bentuk jamak 'silsilah-silsilah' dipertahankan untuk mencerminkan γενεαλογίας. Penambahan 'semuanya' memperjelas rujukan subjek jamak εἰσίν secara alami tanpa mempersempit makna.
