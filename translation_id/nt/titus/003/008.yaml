revisions:
- from: Perkataan ini dapat dipercaya. Mengenai hal-hal ini, aku ingin engkau menegaskannya dengan penuh keyakinan, supaya mereka yang telah percaya kepada Allah[a] sungguh-sungguh memperhatikan untuk tekun melakukan perbuatan-perbuatan baik[b]. Hal-hal ini baik dan bermanfaat bagi semua orang.
  to: Perkataan ini dapat dipercaya. Mengenai hal-hal ini, aku ingin engkau menegaskannya dengan penuh keyakinan, supaya mereka yang telah memercayai Allah[a] berusaha tekun melakukan perbuatan-perbuatan baik[b]. Hal-hal ini baik dan bermanfaat bagi manusia.
