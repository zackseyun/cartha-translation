id: TIT.3.8
reference: Titus 3:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος, καὶ περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι, ἵνα φροντίζωσιν καλῶν ἔργων προΐστασθαι οἱ πεπιστευκότες θεῷ. ταῦτά ⸀ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/008.yaml
  text: This saying is trustworthy[a], and concerning these things I want you to insist confidently, so that those who have believed God may be careful to devote themselves to good works[b]. These things are good and beneficial for people.
translation:
  language: id
  text: Perkataan ini dapat dipercaya. Mengenai hal-hal ini, aku ingin engkau menegaskannya dengan penuh keyakinan, supaya mereka yang telah memercayai Allah[a] berusaha tekun melakukan perbuatan-perbuatan baik[b]. Hal-hal ini baik dan bermanfaat bagi manusia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “percaya kepada Allah” atau “menaruh kepercayaan kepada Allah.”
    reason: lexical_alternative
  - marker: b
    text: Atau “mencurahkan diri untuk melakukan perbuatan-perbuatan baik” atau “giat dalam perbuatan-perbuatan baik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Perkataan ini dapat dipercaya
  rationale: Ungkapan ini menunjuk pada pesan atau pernyataan sebelumnya, bukan satu kata saja. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan penilaian bahwa perkataan tersebut layak dipercaya.
- source_word: περὶ τούτων
  choice: Mengenai hal-hal ini
  rationale: Menerjemahkan περί dengan genitif secara langsung dan menghubungkan perintah Titus dengan pokok-pokok yang baru dinyatakan.
- source_word: βούλομαί σε διαβεβαιοῦσθαι
  choice: aku ingin engkau menegaskannya dengan penuh keyakinan
  rationale: βούλομαι menyatakan kehendak, sedangkan διαβεβαιόομαι menunjuk pada penegasan yang kuat dan yakin. Pronomina objek tersirat ditambahkan secara wajar dengan merujuk pada 'hal-hal ini'.
- source_word: ἵνα φροντίζωσιν
  choice: supaya ... sungguh-sungguh memperhatikan
  rationale: φροντίζω menyatakan perhatian atau pemikiran yang saksama. 'Sungguh-sungguh memperhatikan' mempertahankan unsur kesengajaan tanpa mereduksinya menjadi sekadar kehati-hatian.
- source_word: καλῶν ἔργων προΐστασθαι
  choice: untuk tekun melakukan perbuatan-perbuatan baik
  rationale: Dalam konteks ini προΐστασθαι paling mungkin berarti mencurahkan diri, menerapkan diri, atau giat dalam perbuatan baik, bukan memimpin secara organisatoris. 'Tekun melakukan' alami dan menyampaikan keterlibatan berkelanjutan.
- source_word: οἱ πεπιστευκότες θεῷ
  choice: mereka yang telah percaya kepada Allah
  rationale: Perfect participle menyatakan orang-orang yang telah percaya dan tetap berada dalam keadaan itu. Dativus θεῷ dapat berarti mempercayai Allah atau menaruh kepercayaan kepada-Nya; bentuk Indonesia ini mempertahankan ketaksaan tersebut lebih baik daripada 'percaya akan keberadaan Allah'.
- source_word: ταῦτά ἐστιν καλὰ καὶ ὠφέλιμα
  choice: Hal-hal ini baik dan bermanfaat
  rationale: Kata tunjuk netral jamak diterjemahkan sebagai 'hal-hal ini'; καλά menyatakan kebaikan dan ὠφέλιμα manfaat praktis.
- source_word: τοῖς ἀνθρώποις
  choice: bagi semua orang
  rationale: ἀνθρώποις bersifat generik bagi manusia. 'Semua orang' merupakan ungkapan Indonesia yang alami untuk cakupan umum tersebut, tanpa membatasinya pada laki-laki.
theological_decisions:
- issue: Hubungan iman dan perbuatan baik
  choice: Perbuatan baik disajikan sebagai hasil yang disengaja dari orang-orang yang telah percaya.
  alternative: Perbuatan baik sebagai dasar untuk memperoleh keselamatan.
  rationale: Susunan Yunani terlebih dahulu menyebut orang-orang yang telah percaya, lalu mendorong mereka untuk tekun melakukan perbuatan baik. Terjemahan mempertahankan urutan ini tanpa menambahkan rumusan doktrinal.
- issue: Makna πιστεύω dengan dativus θεῷ
  choice: percaya kepada Allah
  alternative: memercayai Allah; menaruh kepercayaan kepada Allah
  rationale: Konstruksi Yunani dapat menekankan mempercayai Allah atau menaruh kepercayaan kepada-Nya. Ungkapan utama Indonesia cukup alami sekaligus tidak menyempitkan makna menjadi sekadar percaya bahwa Allah ada.
- issue: Cakupan τοῖς ἀνθρώποις
  choice: bagi semua orang
  alternative: bagi manusia
  rationale: Rujukannya bersifat umum. Terjemahan inklusif ini mencerminkan ἄνθρωπος generik tanpa memasukkan pembatasan gender.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. 'Aku' dan 'engkau' mempertahankan hubungan pribadi tunggal dalam surat. Bentuk ulang 'perbuatan-perbuatan baik' memperjelas bahwa yang dimaksud ialah berbagai tindakan baik; penanda catatan kaki [a] dan [b] muncul dalam teks utama.
