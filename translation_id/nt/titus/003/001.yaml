  text: Ὑπομίμνῃσκε αὐτοὺς ⸀ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι πειθαρχεῖν, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/001.yaml
  text: Remind them to be subject to rulers and authorities[a], to be obedient, to be ready for every good work,
translation:
  language: id
  text: Ingatkanlah mereka agar tunduk kepada para penguasa dan pihak berwenang, taat kepada mereka, serta siap untuk setiap perbuatan baik.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπομίμνῃσκε
  choice: Ingatkanlah
  rationale: Imperatif kini aktif orang kedua tunggal memerintahkan Titus untuk terus mengingatkan; bentuk Indonesia ini wajar, dan sifat berkelanjutannya dapat dipahami dari konteks tanpa harus dieksplisitkan.
- source_word: αὐτοὺς
  choice: mereka
  rationale: Pronomina akusatif jamak ini merujuk kepada orang-orang percaya yang dinasihati melalui Titus.
- source_word: ἀρχαῖς
  choice: para penguasa
  rationale: Dalam konteks kewargaan, kata ini menunjuk kepada pihak-pihak yang memerintah, bukan kuasa kosmis.
- source_word: ἐξουσίαις
  choice: orang-orang yang berwenang
  rationale: Bersama ἀρχαῖς, kata ini menunjuk kepada pihak yang memiliki kewenangan pemerintahan; terjemahan ini mempertahankan dua unsur ungkapan Yunani.
- source_word: ὑποτάσσεσθαι
  choice: tunduk kepada
  rationale: Infinitif ini menyatakan penempatan diri di bawah tatanan atau kewenangan; 'tunduk kepada' alami dalam bahasa Indonesia dan tidak dengan sendirinya menyiratkan kepatuhan mutlak.
- source_word: πειθαρχεῖν
  choice: taat
  rationale: Kata kerja ini berarti menaati pihak yang memerintah atau berwenang; 'taat' ringkas dan alami dalam rangkaian nasihat ini.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: melakukan setiap perbuatan baik
  rationale: Frasa ini menyatakan arah kesiapan kepada segala tindakan yang baik; penambahan 'melakukan' diperlukan agar ungkapannya alami dalam bahasa Indonesia.
- source_word: ἑτοίμους εἶναι
  choice: siap
  rationale: Ungkapan infinitif ini menggambarkan keadaan siap sedia; 'siap' merupakan padanan yang langsung dan wajar.
theological_decisions:
- issue: Cakupan ketundukan kepada struktur pemerintahan
  choice: Ayat diterjemahkan sebagai nasihat umum untuk tunduk dan taat kepada penguasa serta pihak berwenang, tanpa menyatakan bahwa ketaatan itu mutlak dalam segala keadaan.
  alternative: Menerjemahkannya dengan cara yang menyiratkan ketaatan tanpa syarat kepada pemerintah.
  rationale: Teks memberikan nasihat kewargaan secara lugas, tetapi tidak membahas batas-batas ketaatan dalam ayat ini. Terjemahan mempertahankan ketegangan tersebut tanpa menambahkan pembatas maupun memutlakkan perintah.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Pengulangan 'supaya' mempertahankan susunan rangkaian infinitif Yunani sekaligus membuat hubungan antarnasihat jelas bagi pembaca umum.
