translation:
  language: id
  text: yang[a] Ia curahkan atas kita dengan berlimpah melalui Yesus Sang Mesias, Penyelamat kita,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “yang” merujuk kepada Roh Kudus yang disebut dalam ayat 5. Bentuk relatif Yunani di sini dapat merujuk kepada “Roh”; bahasa Indonesia memakai “yang” baik untuk acuan personal maupun nonpersonal.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: yang
  rationale: Kata penghubung relatif bahasa Indonesia ini secara alami merujuk kepada Roh Kudus dalam ayat sebelumnya tanpa memaksakan pembedaan personal/nonpersonal yang tidak ditandai dalam bentuk Indonesia.
- source_word: ἐξέχεεν
  choice: telah dicurahkan-Nya
  rationale: Kata kerja ἐκχέω berarti 'mencurahkan' dan lazim dipakai bagi pencurahan Roh. Akhiran -Nya mempertahankan Allah sebagai pelaku yang tersirat dari konteks, sedangkan 'telah' menyampaikan aspek tindakan lampau tanpa mencoba mereproduksi kala aoristus secara mekanis.
- source_word: ἐφ’ ἡμᾶς
  choice: ke atas kita
  rationale: ἐπί dengan akusatif menyatakan arah kepada atau ke atas penerima. Ungkapan ini mempertahankan citra pencurahan dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: πλουσίως
  choice: dengan berlimpah
  rationale: Adverbia ini menyatakan kelimpahan. 'Dengan berlimpah' alami dalam konteks pencurahan dan lebih tepat daripada terjemahan harfiah yang berkonotasi kekayaan materi.
- source_word: διὰ
  choice: melalui
  rationale: διά dengan genitif menyatakan perantaraan atau sarana; 'melalui' adalah padanan ringkas dan alami.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός mempertahankan maknanya sebagai gelar 'Mesias'. Penambahan 'Sang' membuat gelar tersebut idiomatis dan bermartabat dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: Penyelamat kita
  rationale: σωτήρ adalah gelar bagi Yesus. 'Penyelamat kita' menyampaikan konstruksi genitif secara alami dan mempertahankan fungsi kristologis gelar itu.
theological_decisions:
- issue: Acuan kata relatif οὗ
  choice: '''yang'' merujuk kepada Roh Kudus yang disebut dalam Titus 3:5'
  alternative: Membuat acuannya eksplisit dengan 'Roh yang' atau memakai bentuk yang sengaja lebih impersonal
  rationale: Roh Kudus adalah anteseden terdekat. Kata 'yang' mempertahankan hubungan gramatikal itu serta tidak memasukkan pembedaan personal/nonpersonal yang tidak diwajibkan oleh tata bahasa Indonesia.
- issue: Penerjemahan Χριστοῦ
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam frasa Ἰησοῦ Χριστοῦ, Χριστός masih dapat dibaca sebagai gelar. 'Sang Mesias' menyatakan isi gelar tersebut, sementara bentuk tradisional dicatat dalam catatan kaki.
- issue: Pelaku tindakan mencurahkan
  choice: Allah, dinyatakan secara kontekstual melalui akhiran hormat -Nya
  alternative: Mengulang 'Allah' secara eksplisit
  rationale: Subjek ἐξέχεεν diteruskan dari konteks sebelumnya. Bentuk '-Nya' menghasilkan bahasa Indonesia yang alami tanpa menambahkan nomina yang tidak terdapat dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan klausa dipertahankan sebagai lanjutan dari ayat 5. Ungkapan 'dicurahkan-Nya dengan berlimpah ke atas kita' menjaga metafora sumber sekaligus tetap jelas bagi pembaca umum.
