base_translation:
  language: en
  yaml_path: translation/nt/titus/003/002.yaml
  text: to slander no one[a], to be peaceable, gentle[c][b], showing all meekness toward all people.
translation:
  language: id
  text: jangan mencela siapa pun[a], jangan suka bertengkar, hendaklah bersikap penuh pengertian[b] dan menunjukkan kelemahlembutan sepenuhnya kepada semua orang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jangan menjelek-jelekkan atau memfitnah siapa pun.” Kata Yunani ini dapat mencakup perkataan buruk atau abusif secara lebih luas daripada fitnah dalam arti tuduhan palsu.
    reason: lexical_alternative
  - marker: b
    text: Atau, “bersikap lemah lembut,” “bertenggang rasa,” atau “tidak bersikeras.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “memperlihatkan segala kelembutan kepada semua orang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδένα
  choice: siapa pun
  rationale: Sebagai objek βλασφημεῖν, bentuk ini menyatakan cakupan universal; dalam konstruksi negatif, 'siapa pun' merupakan ungkapan Indonesia yang alami.
- source_word: βλασφημεῖν
  choice: memfitnah
  rationale: Dalam konteks etika antarmanusia, verba ini menunjuk pada perkataan yang mencemarkan atau menghina orang lain, bukan penghujatan terhadap Allah. Catatan kaki mempertahankan cakupan makna yang lebih luas.
- source_word: ἀμάχους εἶναι
  choice: jangan suka bertengkar
  rationale: Adjektiva ἄμαχος secara harfiah berkenaan dengan tidak berkelahi atau tidak bertengkar. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan unsur negatifnya.
- source_word: ἐπιεικεῖς
  choice: bersikap penuh pengertian
  rationale: ἐπιεικής mencakup sikap lemah lembut, wajar, tenggang rasa, dan tidak bersikeras menuntut hak sendiri. Pilihan ini membedakannya dari πραΰτης tanpa mempersempitnya menjadi kelembutan semata.
- source_word: πᾶσαν ἐνδεικνυμένους πραΰτητα
  choice: menunjukkan segala kelemahlembutan
  rationale: Partisipel ἐνδεικνυμένους menyatakan perbuatan memperlihatkan suatu sifat, sementara πᾶσαν menegaskan kepenuhannya. 'Kelemahlembutan' menyampaikan πραΰτης secara wajar dan bermartabat.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: kepada semua orang
  rationale: πρός menyatakan arah sikap terhadap orang lain, dan ἄνθρωποι di sini bersifat generik serta mencakup seluruh manusia.
theological_decisions:
- issue: Cakupan βλασφημεῖν dalam etika antarmanusia
  choice: memfitnah
  alternative: menjelek-jelekkan / menghina
  rationale: Objeknya adalah manusia, sehingga maknanya bukan 'menghujat' dalam arti khusus terhadap Allah. Namun, karena verba Yunani dapat mencakup perkataan buruk atau abusif lebih luas daripada tuduhan palsu, alternatif itu dicatat.
- issue: Pembedaan ἐπιεικεῖς dan πραΰτητα
  choice: penuh pengertian untuk ἐπιεικεῖς; kelemahlembutan untuk πραΰτητα
  alternative: lemah lembut untuk keduanya
  rationale: Dua istilah yang berdekatan memiliki wilayah makna bertumpang tindih, tetapi bukan identik. Terjemahan ini mempertahankan perbedaannya tanpa menetapkan suatu tafsir doktrinal khusus.
- issue: Makna generik πάντας ἀνθρώπους
  choice: semua orang
  alternative: semua manusia
  rationale: Ungkapan Yunani mencakup manusia tanpa pembatasan jenis kelamin; 'semua orang' paling alami dalam bahasa Indonesia modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rangkaian infinitif/partisipel Yunani disajikan sebagai rangkaian perintah agar alami dalam konteks nasihat. 'Jangan suka bertengkar' dipilih alih-alih istilah abstrak seperti 'tidak suka berbantah-bantahan'; 'penuh pengertian' membedakan ἐπιεικής dari πραΰτης.
