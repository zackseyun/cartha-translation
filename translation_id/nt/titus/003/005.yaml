  text: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ⸀ἃ ἐποιήσαμεν ἡμεῖς ἀλλὰ κατὰ ⸂τὸ αὐτοῦ ἔλεος⸃ ἔσωσεν ἡμᾶς διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/005.yaml
  text: not from works done in righteousness, which we ourselves did, but according to his mercy he saved us, through the washing of regeneration and renewal by the Holy Spirit,
translation:
  language: id
  text: bukan karena perbuatan-perbuatan dalam kebenaran[a] yang kita sendiri lakukan, melainkan sesuai dengan belas kasihan-Nya, Ia menyelamatkan kita melalui pembasuhan[b] kelahiran kembali dan pembaruan oleh Roh Kudus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perbuatan-perbuatan dalam keadilan.” Kata Yunani yang dipakai dapat berarti “kebenaran” atau “keadilan”; dalam pemakaian Paulus, teks utama memakai “kebenaran.”
    reason: alternative_reading
  - marker: b
    text: “Pembasuhan” dapat merujuk pada baptisan, gambaran pembersihan, atau keduanya; bahasa Yunani sendiri tidak mengharuskan penerjemah menetapkan salah satunya dalam teks utama.
    reason: lexical_alternative
  - marker: c
    text: Atau “pembaruan Roh Kudus.” Susunan bahasa Yunani memungkinkan beberapa cara yang sedikit berbeda untuk menghubungkan “Roh Kudus” dengan “pembaruan.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: bukan karena perbuatan-perbuatan
  rationale: ἐκ menandai sumber atau dasar. Dalam bahasa Indonesia, “bukan karena” menyatakan bahwa perbuatan bukanlah dasar keselamatan dan membentuk kontras alami dengan belas kasihan Allah.
- source_word: τῶν ἐν δικαιοσύνῃ
  choice: dalam kebenaran
  rationale: Frasa berartikel ini menerangkan “perbuatan-perbuatan.” δικαιοσύνη dipertahankan sebagai “kebenaran,” padanan lazim dalam konteks Paulus, tanpa mengubahnya menjadi gagasan pembenaran.
- source_word: ἃ ἐποιήσαμεν ἡμεῖς
  choice: yang telah kita lakukan sendiri
  rationale: Kata ganti eksplisit ἡμεῖς bersifat menegaskan; “sendiri” mempertahankan tekanan bahwa perbuatan itu dilakukan oleh kita.
- source_word: κατὰ τὸ αὐτοῦ ἔλεος
  choice: sesuai dengan belas kasihan-Nya
  rationale: κατά menyatakan tolok ukur atau dasar. “Sesuai dengan” cukup formal namun alami serta mempertahankan kontras dengan perbuatan.
- source_word: ἔσωσεν ἡμᾶς
  choice: Ia menyelamatkan kita
  rationale: “Menyelamatkan” merupakan padanan langsung dan baku bagi σῴζω dalam konteks keselamatan.
- source_word: διὰ λουτροῦ
  choice: melalui pembasuhan
  rationale: διά dengan genitif menyatakan sarana. “Pembasuhan” mempertahankan citra pencucian tanpa menetapkan apakah yang dimaksud secara khusus adalah baptisan, pemurnian metaforis, atau keduanya.
- source_word: παλιγγενεσίας
  choice: kelahiran kembali
  rationale: “Kelahiran kembali” menyampaikan makna παλιγγενεσία secara jelas dan alami bagi pembaca Indonesia, sambil mempertahankan bobot teologis istilah itu.
- source_word: καὶ ἀνακαινώσεως
  choice: dan pembaruan
  rationale: Nomina “pembaruan” mempertahankan kesejajaran struktur dengan “kelahiran kembali.”
- source_word: πνεύματος ἁγίου
  choice: oleh Roh Kudus
  rationale: Genitif ini paling dekat menerangkan “pembaruan” dan dapat menyatakan pelaku atau sumber. “Oleh Roh Kudus” mengomunikasikan kemungkinan utama tanpa memaksakan bahwa frasa itu menerangkan kedua nomina.
theological_decisions:
- issue: Makna δικαιοσύνη dalam konteks Paulus
  choice: kebenaran
  alternative: keadilan
  rationale: Dalam konteks ini istilah tersebut mencirikan perbuatan. “Kebenaran” adalah padanan utama yang lazim, sedangkan kemungkinan “keadilan” dicatat agar jangkauan katanya tidak disempitkan.
- issue: Makna διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου
  choice: 'bahasa sarana tanpa menetapkan mekanisme sakramental: “melalui pembasuhan kelahiran kembali dan pembaruan oleh Roh Kudus”'
  alternative: menyebut baptisan secara eksplisit atau mengubahnya menjadi bahasa pemurnian yang sepenuhnya metaforis
  rationale: λουτρόν dapat membangkitkan baptisan, citra pembersihan, atau keduanya. Teks utama mempertahankan “pembasuhan” agar ketegangan penafsirannya tidak diselesaikan oleh penerjemah.
- issue: Hubungan πνεύματος ἁγίου dengan nomina sebelumnya
  choice: 'menghubungkan pelaku paling langsung dengan “pembaruan”: “pembaruan oleh Roh Kudus”'
  alternative: “pembaruan Roh Kudus,” yang dapat dibaca sebagai pembaruan milik atau berasal dari Roh Kudus dan mungkin dikaitkan lebih luas
  rationale: Secara sintaksis πνεύματος ἁγίου paling dekat dengan ἀνακαινώσεως, tetapi konstruksi genitif membuka lebih dari satu nuansa hubungan. Catatan kaki mempertahankan alternatif itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan kontras kuat antara perbuatan manusia dan belas kasihan Allah. Istilah “pembasuhan” sengaja dipilih untuk menjaga ambiguitas teologis teks sumber; semua penanda catatan kaki ditempatkan tepat setelah unsur terkait.
