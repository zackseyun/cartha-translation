translation:
  language: id
  text: Sebab engkau tahu bahwa orang semacam itu telah menyimpang[a] dan terus berbuat dosa, serta terhukum oleh dirinya sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah berbalik dari jalan yang benar” atau “telah menjadi rusak.” Bentuk perfek kata Yunani menunjukkan keadaan yang terjadi sebagai akibat penyimpangan sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “menghukum dirinya sendiri.” Kata Yunani ini dapat berarti bahwa orang itu terhukum oleh tindakan atau kesaksiannya sendiri, tanpa menuntut bahwa ia telah mengucapkan vonis resmi terhadap dirinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: Sebab engkau tahu
  rationale: Partisipel ini mengacu kepada orang yang harus melaksanakan perintah pada ayat sebelumnya. Dalam bahasa Indonesia, bentuk kausal ini mengungkapkan hubungannya secara alami tanpa mengubah subjek tersiratnya.
- source_word: ἐξέστραπται
  choice: telah menyimpang
  rationale: Bentuk perfek menyatakan keadaan kini yang timbul karena penyimpangan sebelumnya. 'Telah menyimpang' mempertahankan unsur tindakan lampau beserta akibatnya tanpa memakai istilah yang mudah disalahpahami seperti 'sesat' atau 'bejat'.
- source_word: ὁ τοιοῦτος
  choice: orang semacam itu
  rationale: Ungkapan ini menunjuk kembali kepada orang yang menimbulkan perpecahan. Bahasa Indonesia tidak menandai gender gramatikal pada 'orang', sehingga terjemahan ini tepat dan alami tanpa memastikan jenis kelamin yang tidak dituntut oleh konteks.
- source_word: ἁμαρτάνει
  choice: terus berbuat dosa
  rationale: Bentuk kini menggambarkan perbuatan yang sedang berlangsung. Kata 'terus' membuat aspek berkelanjutan itu jelas dalam bahasa Indonesia tanpa menyatakan bahwa keadaan tersebut tidak mungkin berubah.
- source_word: ὢν
  choice: ia
  rationale: Klausa partisipial Yunani diungkapkan sebagai klausa mandiri agar alami dan jelas dalam bahasa Indonesia, sambil tetap menghubungkan keadaan orang itu dengan perilakunya.
- source_word: αὐτοκατάκριτος
  choice: mendatangkan hukuman atas dirinya sendiri
  rationale: Ungkapan ini menyampaikan bahwa keadaan dan tindakannya sendiri membuatnya patut dihukum, tanpa menyiratkan bahwa ia secara sadar mengucapkan vonis resmi terhadap dirinya.
theological_decisions:
- issue: Sifat penyimpangan dalam ἐξέστραπται
  choice: telah menyimpang
  alternative: telah menjadi rusak / telah berbalik dari jalan yang benar
  rationale: Teks menyatakan keadaan menyimpang yang menetap sebagai akibat tindakan terdahulu, tetapi tidak merinci apakah penyimpangan itu terutama bersifat moral, ajaran, atau keduanya.
- issue: Makna αὐτοκατάκριτος
  choice: mendatangkan hukuman atas dirinya sendiri
  alternative: terhukum oleh dirinya sendiri / menghukum dirinya sendiri
  rationale: Terjemahan pilihan mempertahankan bobot penghakiman sambil membiarkan terbuka apakah kecaman itu berasal dari kesadaran orang tersebut atau dari tindakan dan kesaksiannya sendiri. Teks ini tidak dengan sendirinya menetapkan cakupan hukuman terakhir.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Tanda titik koma mempertahankan hubungan erat antara penyimpangan, dosa yang berlanjut, dan keadaan orang tersebut. Istilah 'orang semacam itu' sesuai dengan pemakaian generik dalam bahasa Indonesia dan tidak memaksakan gender biologis dari bentuk gramatikal Yunani.
