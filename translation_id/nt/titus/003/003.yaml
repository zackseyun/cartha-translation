source:
  edition: SBLGNT
  text: ἦμεν γάρ ποτε καὶ ἡμεῖς ἀνόητοι, ἀπειθεῖς, πλανώμενοι, δουλεύοντες ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις, ἐν κακίᾳ καὶ φθόνῳ διάγοντες, στυγητοί, μισοῦντες ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/003.yaml
  text: For we ourselves also were once foolish[a], disobedient, being led astray, enslaved to various desires and pleasures, spending our lives in malice and envy, hateful[b], hating one another.
translation:
  language: id
  text: Sebab, dahulu kita sendiri juga bodoh, tidak taat, tersesat, diperbudak oleh berbagai keinginan dan kesenangan, menjalani hidup dalam kedengkian dan iri hati, dibenci[a], serta saling membenci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjijikkan” atau “patut dibenci.” Kata Yunani ini dapat dipahami secara pasif (“dibenci”) atau aktif/evaluatif (“menjijikkan, patut dibenci”).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦμεν γάρ ποτε καὶ ἡμεῖς
  choice: Sebab dahulu kita sendiri juga
  rationale: “Sebab” mempertahankan hubungan penjelasan γάρ dengan konteks sebelumnya; “kita sendiri juga” menyampaikan penekanan inklusif καὶ ἡμεῖς, dan “dahulu” menyatakan ποτε secara wajar dalam bahasa Indonesia.
- source_word: ἀνόητοι
  choice: tidak berakal
  rationale: Ungkapan ini menyampaikan kurangnya pengertian dan pertimbangan moral, dengan nada yang lebih bermartabat dan tepat daripada makian sehari-hari seperti “bodoh”.
- source_word: ἀπειθεῖς
  choice: tidak taat
  rationale: Pilihan ini mempertahankan makna penolakan untuk menurut atau diyakinkan dalam konteks daftar keburukan etis.
- source_word: πλανώμενοι
  choice: tersesat
  rationale: Bentuk ini dapat bernuansa pasif atau medial. “Tersesat” mempertahankan gagasan berada dalam kesesatan tanpa membatasinya hanya pada penipuan intelektual.
- source_word: δουλεύοντες
  choice: diperbudak
  rationale: Kata ini mempertahankan kuatnya gambaran perbudakan dan keterikatan kepada keinginan serta kesenangan, bukan sekadar tindakan melayani.
- source_word: ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις
  choice: oleh berbagai keinginan dan kesenangan
  rationale: “Keinginan” cukup luas untuk mencakup hasrat yang tidak teratur tanpa mempersempitnya pada nafsu seksual; ποικίλαις secara makna mencakup kedua nomina.
- source_word: ἐν κακίᾳ καὶ φθόνῳ διάγοντες
  choice: menjalani hidup dalam kedengkian dan iri hati
  rationale: “Menjalani hidup” menyampaikan sifat duratif διάγοντες. Dalam konteks antarpribadi ini, κακία paling tepat dipahami sebagai kedengkian atau niat jahat, sedangkan φθόνος adalah iri hati.
- source_word: στυγητοί
  choice: dibenci
  rationale: Adjektiva verbal ini secara bentuk paling alami dapat dipahami secara pasif, “dibenci.” Namun makna aktif “menjijikkan” juga mungkin dan dipertahankan dalam catatan kaki.
- source_word: μισοῦντες ἀλλήλους
  choice: saling membenci
  rationale: Terjemahan idiomatis dan langsung bagi partisipel dengan pronomina resiprokal.
theological_decisions:
- issue: Nuansa keterikatan dalam δουλεύοντες dengan keinginan dan kesenangan sebagai tuan
  choice: diperbudak oleh berbagai keinginan dan kesenangan
  alternative: melayani berbagai keinginan dan kesenangan
  rationale: Konteks menggambarkan keterikatan moral yang kuat dalam kehidupan dahulu. “Diperbudak” mempertahankan daya metafora bahasa sumber tanpa memasukkan sistem doktrinal dari luar ayat.
- issue: 'Daya στυγητοί: pasif atau aktif'
  choice: dibenci
  alternative: menjijikkan
  rationale: Keduanya didukung secara leksikal. Terjemahan utama memakai nuansa pasif yang dekat dengan bentuk adjektiva verbal, sedangkan alternatif aktif dicatat agar ambiguitas asli tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan daftar yang mengalir dan bermartabat. “Tidak berakal” dipilih daripada “bodoh” untuk menghindari kesan makian, sementara “diperbudak” mempertahankan kekuatan metafora sumber. Penanda catatan kaki [a] ditempatkan langsung setelah kata yang diterangkan.
