  text: εἴ τίς ἐστιν ἀνέγκλητος, μιᾶς γυναικὸς ἀνήρ, τέκνα ἔχων πιστά, μὴ ἐν κατηγορίᾳ ἀσωτίας ἢ ἀνυπότακτα.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/006.yaml
  text: if anyone is above reproach[a], the husband of one wife[c][b], having faithful children not under accusation of debauchery or insubordinate.
translation:
  language: id
  text: jika ada seseorang yang tidak bercela, suami dari satu istri,[a] yang mempunyai anak-anak yang setia[b] dan tidak dituduh hidup liar atau tidak mau tunduk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “laki-laki yang setia kepada satu perempuan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “yang percaya.” Kata Yunani πιστά dapat berarti “setia” atau “percaya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέγκλητος
  choice: tidak bercela
  rationale: Menyatakan bahwa orang itu tidak terbuka terhadap tuduhan yang sah, tanpa menyiratkan kesempurnaan mutlak.
- source_word: μιᾶς γυναικὸς ἀνήρ
  choice: suami dari satu istri
  rationale: Terjemahan transparan yang mempertahankan bentuk ungkapan Yunani serta tidak memutuskan perdebatan tentang seluruh implikasinya.
- source_word: τέκνα
  choice: anak-anak
  rationale: Padanan Indonesia yang alami dalam konteks rumah tangga.
- source_word: πιστά
  choice: setia
  rationale: Kata Yunani ini dapat berarti setia/dapat dipercaya atau percaya; teks utama memakai arti yang lebih luas dan alternatifnya dicatat.
- source_word: ἐν κατηγορίᾳ ἀσωτίας
  choice: dituduh hidup liar
  rationale: Menjaga unsur tuduhan dalam κατηγορία sekaligus mengungkapkan perilaku boros dan tak terkendali dari ἀσωτία dengan bahasa Indonesia yang wajar.
- source_word: ἀνυπότακτα
  choice: memberontak
  rationale: Mengungkapkan penolakan untuk tunduk pada tata atau wewenang yang semestinya secara alami dalam konteks anak-anak.
theological_decisions:
- issue: Makna πιστά dalam τέκνα ἔχων πιστά
  choice: anak-anak yang setia
  alternative: anak-anak yang percaya
  rationale: πιστά sungguh ambigu antara kesetiaan/keandalan dan iman kepada Kristus; alternatif dipertahankan dalam catatan kaki agar ketegangan teologis tidak dihapus.
- issue: Daya ungkapan μιᾶς γυναικὸς ἀνήρ
  choice: suami dari satu istri
  alternative: laki-laki yang setia kepada satu perempuan
  rationale: Bentuk transparan menghindari penetapan kesimpulan denominasi mengenai status perkawinan, kesetiaan seksual, atau perkawinan kembali.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan diawali “yaitu” karena ayat ini melanjutkan kalimat dan daftar persyaratan dari ayat 5. Penanda catatan kaki ditempatkan tepat sesudah frasa yang dijelaskan.
