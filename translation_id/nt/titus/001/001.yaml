id: TIT.1.1
reference: Titus 1:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Παῦλος δοῦλος θεοῦ, ἀπόστολος δὲ Ἰησοῦ Χριστοῦ κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας τῆς κατ’ εὐσέβειαν
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/001.yaml
  text: Paul[a], a servant of God and an apostle of Jesus the Messiah, for the faith of God’s chosen ones and the knowledge of the truth that accords with godliness[c][b],
translation:
  language: id
  text: Paulus, hamba Allah dan rasul Yesus Sang Mesias, demi iman orang-orang pilihan Allah[a] dan pengetahuan[b] akan kebenaran yang selaras dengan kesalehan[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang dipilih Allah.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pengenalan penuh.”
    reason: lexical_alternative
  - marker: c
    text: Atau “kebenaran yang menghasilkan kesalehan.”
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: hamba
  rationale: Dalam penyebutan diri Paulus, “hamba” menyatakan kepemilikan dan ketundukan penuh kepada Allah, sekaligus lebih wajar dan bermartabat dalam bahasa Indonesia daripada “budak” tanpa menghilangkan kuatnya relasi tersebut.
- source_word: ἀπόστολος
  choice: rasul
  rationale: “Rasul” adalah istilah Indonesia yang mapan untuk seorang utusan yang menerima panggilan dan wewenang khusus.
- source_word: δὲ
  choice: dan
  rationale: δέ di sini menghubungkan dua sebutan diri Paulus tanpa pertentangan yang nyata.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός dipertahankan sebagai gelar “Mesias”; “Sang” menandai gelar itu secara idiomatis dan penuh hormat dalam bahasa Indonesia.
- source_word: κατὰ
  choice: demi
  rationale: “Demi” menyampaikan orientasi atau tujuan kerasulan Paulus, sambil tidak memaksakan hubungan sebab-akibat yang lebih sempit.
- source_word: πίστιν
  choice: iman
  rationale: Dalam konteks ini πίστις paling wajar menunjuk pada iman atau kepercayaan orang-orang pilihan Allah.
- source_word: ἐκλεκτῶν θεοῦ
  choice: orang-orang pilihan Allah
  rationale: Ungkapan ini mempertahankan tindakan pemilihan oleh Allah tanpa memasukkan sistem teologis denominasi tertentu.
- source_word: ἐπίγνωσιν
  choice: pengetahuan
  rationale: “Pengetahuan” merupakan padanan alami; kemungkinan nuansa intensif “pengenalan penuh” dicatat dalam catatan kaki.
- source_word: ἀληθείας
  choice: kebenaran
  rationale: Kata ini menunjuk pada kebenaran yang diketahui, dan konstruksi Indonesia “pengetahuan akan kebenaran” terdengar alami.
- source_word: τῆς κατ’ εὐσέβειαν
  choice: yang selaras dengan kesalehan
  rationale: Padanan ini mempertahankan hubungan kesesuaian yang luas antara kebenaran dan kesalehan tanpa memutuskan bahwa frasa tersebut semata-mata menyatakan hasil.
- source_word: εὐσέβειαν
  choice: kesalehan
  rationale: “Kesalehan” secara alami mencakup sikap hormat kepada Allah dan kehidupan yang dibentuk olehnya.
theological_decisions:
- issue: Makna ἐκλεκτῶν θεοῦ
  choice: orang-orang pilihan Allah
  alternative: orang-orang yang dipilih Allah
  rationale: Pilihan utama ringkas dan mempertahankan gagasan pemilihan ilahi, tetapi tidak menjelaskan lebih jauh cara atau dasar pemilihan itu.
- issue: Hubungan κατὰ dengan πίστιν dan ἐπίγνωσιν
  choice: demi iman ... dan pengetahuan
  alternative: sesuai dengan iman ... dan pengetahuan / untuk membawa ... kepada iman dan pengetahuan
  rationale: Sintaksis Yunani bersifat padat. “Demi” mempertahankan orientasi kerasulan Paulus tanpa menjadikannya secara tegas hanya ukuran kesesuaian atau hanya hasil misioner.
- issue: Hubungan κατ’ εὐσέβειαν dengan kebenaran
  choice: kebenaran yang selaras dengan kesalehan
  alternative: kebenaran yang menghasilkan kesalehan
  rationale: Frasa Yunani dapat menyatakan kesesuaian atau arah/hasil. Teks utama mempertahankan hubungan yang lebih luas, sedangkan kemungkinan hasil dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Koma penutup dipertahankan karena ayat ini merupakan awal kalimat panjang yang berlanjut ke ayat berikutnya. Semua penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskan.
