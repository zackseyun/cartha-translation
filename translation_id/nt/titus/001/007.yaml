id: TIT.1.7
reference: Titus 1:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸν ἐπίσκοπον ἀνέγκλητον εἶναι ὡς θεοῦ οἰκονόμον, μὴ αὐθάδη, μὴ ὀργίλον, μὴ πάροινον, μὴ πλήκτην, μὴ αἰσχροκερδῆ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/007.yaml
  text: For an overseer must be above reproach as God's steward[a], not self-willed, not quick-tempered, not given to wine, not violent, not greedy for shameful gain[b],
translation:
  language: id
  text: Sebab seorang penilik jemaat haruslah tidak bercela sebagai pengelola rumah tangga Allah[a], tidak mementingkan diri sendiri, tidak lekas marah, tidak dikuasai anggur, tidak suka melakukan kekerasan, dan tidak serakah akan keuntungan tercela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengurus Allah.” Kata Yunani ini menunjuk seorang pengelola atau penatalayan yang bertanggung jawab atas rumah tangga milik Allah.
    reason: clarification
  - marker: b
    text: Dapat juga diterjemahkan “serakah akan keuntungan yang tidak jujur.” Kata Yunaninya menekankan keuntungan yang dicari dengan cara atau untuk tujuan yang tercela secara moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: haruslah
  rationale: Menyampaikan keharusan atau kewajiban dengan jelas dan wajar dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelasan dengan ayat sebelumnya.
- source_word: ἐπίσκοπον
  choice: penilik jemaat
  rationale: Menyampaikan fungsi mengawasi dalam konteks jemaat tanpa memasukkan konotasi hierarki gerejawi yang berkembang kemudian.
- source_word: ἀνέγκλητον
  choice: tidak bercela
  rationale: Ungkapan Indonesia yang alami untuk keadaan tidak terbuka terhadap tuduhan yang sah, tanpa menyiratkan kesempurnaan mutlak.
- source_word: ὡς θεοῦ οἰκονόμον
  choice: sebagai pengelola milik Allah
  rationale: Mempertahankan gagasan pengelolaan atas sesuatu yang dipercayakan Allah dan pertanggungjawaban kepada-Nya.
- source_word: αὐθάδη
  choice: keras kepala
  rationale: Menangkap sikap bersikeras mengikuti kehendak sendiri; nuansa kesombongan tetap tersirat tanpa mempersempit makna hanya pada keangkuhan.
- source_word: ὀργίλον
  choice: lekas marah
  rationale: Menggambarkan kecenderungan watak untuk mudah marah, bukan satu kejadian kemarahan.
- source_word: πάροινον
  choice: gemar minum anggur
  rationale: Menunjukkan keterikatan atau kebiasaan berlebihan terkait anggur tanpa melebihkan makna menjadi selalu mabuk.
- source_word: πλήκτην
  choice: suka melakukan kekerasan
  rationale: Menyampaikan kecenderungan memukul atau bertindak kasar dalam bahasa Indonesia modern.
- source_word: αἰσχροκερδῆ
  choice: serakah akan keuntungan yang memalukan
  rationale: Mempertahankan unsur kerakusan dan sifat keuntungan yang tercela secara moral, yang lebih luas daripada sekadar keuntungan ilegal.
theological_decisions:
- issue: Penerjemahan ἐπίσκοπος dalam konteks jabatan jemaat
  choice: penilik jemaat
  alternative: uskup
  rationale: Pilihan ini mencerminkan fungsi pengawasan dalam bahasa sumber tanpa memasukkan struktur hierarkis atau konotasi denominasi dari masa kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Deretan sifat negatif dipertahankan dengan bentuk yang sejajar dan mudah dipahami; istilah jabatan diterjemahkan secara fungsional agar tidak membawa kekhasan denominasi.
