revisions:
- from: Sebab seorang penilik jemaat haruslah tidak bercela sebagai pengelola milik Allah[a], tidak keras kepala, tidak lekas marah, tidak gemar minum anggur, tidak suka melakukan kekerasan, dan tidak serakah akan keuntungan yang memalukan[b].
  to: Sebab seorang penilik jemaat haruslah tidak bercela sebagai pengelola rumah tangga Allah[a], tidak mementingkan diri sendiri, tidak lekas marah, tidak dikuasai anggur, tidak suka melakukan kekerasan, dan tidak serakah akan keuntungan tercela[b].
  rationale: Revisi mempertahankan hubungan penjelas “Sebab,” kewajiban dalam “haruslah,” serta deret sifat negatif dari teks Yunani. Perubahan pada metafora pengelola, sikap terhadap anggur, dan istilah bagi keuntungan bertujuan meningkatkan ketepatan makna tanpa mengimpor struktur gerejawi atau penafsiran denominasi.
