  text: εἶπέν τις ἐξ αὐτῶν, ἴδιος αὐτῶν προφήτης, Κρῆτες ἀεὶ ψεῦσται, κακὰ θηρία, γαστέρες ἀργαί·
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/012.yaml
  text: One of them[a], their own prophet, said, “Cretans are always liars, evil beasts, lazy gluttons.”
translation:
  language: id
  text: Salah seorang di antara mereka, nabi mereka sendiri, berkata, “Orang Kreta selalu pendusta, binatang buas yang jahat, pelahap yang malas.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perut-perut yang malas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπέν τις ἐξ αὐτῶν
  choice: Salah seorang dari antara mereka ... berkata
  rationale: Frasa ini mempertahankan sifat tak tentu dari τις sekaligus makna partitif ἐξ αὐτῶν, yaitu bahwa orang yang berbicara berasal dari kelompok mereka sendiri.
- source_word: ἴδιος αὐτῶν προφήτης
  choice: yaitu nabi mereka sendiri
  rationale: ἴδιος menekankan bahwa nabi tersebut berasal dari dan diakui sebagai milik kalangan orang Kreta sendiri. Kata 'yaitu' memperjelas bahwa frasa ini menerangkan orang yang baru disebut, tanpa mengubah maknanya.
- source_word: Κρῆτες
  choice: Orang Kreta
  rationale: Ini adalah sebutan bagi penduduk atau orang yang berasal dari Pulau Kreta; 'orang Kreta' merupakan bentuk baku dan alami dalam bahasa Indonesia.
- source_word: ἀεὶ
  choice: selalu
  rationale: Padanan langsung dan alami untuk makna 'senantiasa' atau 'terus-menerus' dalam pernyataan yang berbentuk pepatah ini.
- source_word: ψεῦσται
  choice: pendusta
  rationale: Kata benda ini menunjuk kepada orang yang berdusta. 'Pendusta' mempertahankan bentuk sebutan nominal dan nada kecaman dari bahasa Yunani.
- source_word: κακὰ θηρία
  choice: binatang buas yang jahat
  rationale: Terjemahan ini mempertahankan gambaran metaforis θηρία dan penilaian moral κακά, tanpa melunakkannya menjadi sekadar perilaku yang kasar atau berbahaya.
- source_word: γαστέρες ἀργαί
  choice: pelahap yang malas
  rationale: Secara harfiah frasa ini berarti 'perut-perut yang malas'. 'Pelahap yang malas' menyampaikan metonimia tentang orang yang gemar makan tetapi enggan bekerja, dengan bahasa Indonesia yang wajar; bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Pernyataan negatif tentang suatu kelompok etnis dalam kutipan
  choice: Mempertahankan bahasa keras itu sebagai kutipan yang secara eksplisit dikatakan berasal dari nabi mereka sendiri
  alternative: Melunakkan atau menggeneralisasi pernyataannya agar tidak menyebut orang Kreta secara langsung
  rationale: Teks Yunani menyajikan penilaian tersebut sebagai kutipan langsung dan sengaja mengaitkannya dengan seorang nabi dari kalangan mereka sendiri. Terjemahan perlu mempertahankan ketegangan retoris dan tidak mengubah kutipan itu menjadi rumusan yang lebih lunak atau menjadi penjelasan teologis di luar teks.
translation_notes:
  register: Bahasa dibuat modern, jelas, dan bermartabat. 'Pendusta' dipilih untuk menjaga bentuk sebutan nominal serta nada kutipan, sedangkan 'pelahap yang malas' membuat ungkapan idiomatis Yunani dapat dipahami oleh pembaca Indonesia masa kini. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskannya.
