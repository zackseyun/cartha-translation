  text: μὴ προσέχοντες Ἰουδαϊκοῖς μύθοις καὶ ἐντολαῖς ἀνθρώπων ἀποστρεφομένων τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/014.yaml
  text: not paying attention to Jewish myths and commandments of people who turn away from the truth[a].
translation:
  language: id
  text: dengan tidak memberi perhatian kepada mitos-mitos Yahudi dan perintah manusia yang berpaling dari kebenaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan tidak mengabdikan diri kepada mitos-mitos Yahudi dan perintah manusia dari orang-orang yang berpaling dari kebenaran.”
    reason: Alternatif leksikal untuk μὴ προσέχοντες serta pengungkapan hubungan genitif secara lebih eksplisit.
lexical_decisions:
- source_word: μὴ προσέχοντες
  choice: dengan tidak memberi perhatian kepada
  rationale: Partisipel kini ini melanjutkan nasihat pada ayat sebelumnya. Ungkapan ini mempertahankan gagasan mengarahkan pikiran atau perhatian kepada sesuatu.
- source_word: Ἰουδαϊκοῖς μύθοις
  choice: dongeng-dongeng Yahudi
  rationale: μῦθος menunjuk pada kisah rekaan atau legenda; 'dongeng' jelas dan wajar dalam bahasa Indonesia modern. Ἰουδαϊκοῖς menyatakan sifat atau asal Yahudinya.
- source_word: ἐντολαῖς ἀνθρώπων
  choice: perintah-perintah manusia
  rationale: Terjemahan ini dekat dengan bentuk Yunani dan mempertahankan pertentangan antara ketentuan yang semata-mata berasal dari manusia dan kebenaran.
- source_word: ἀποστρεφομένων
  choice: yang berpaling dari
  rationale: Partisipel genitif jamak ini paling wajar menerangkan ἀνθρώπων. 'Berpaling dari' mempertahankan citra gerak dalam verba sumber tanpa mempersempitnya menjadi sekadar 'menolak'.
- source_word: τὴν ἀλήθειαν
  choice: kebenaran
  rationale: Padanan baku bagi ἀλήθεια. Konteks dapat mengarah pada kebenaran Injil, tetapi terjemahan tidak menambahkan penjelasan yang tidak dinyatakan oleh teks.
theological_decisions:
- issue: Acuan partisipel genitif ἀποστρεφομένων
  choice: 'Partisipel menerangkan ''manusia'': ''perintah-perintah manusia yang berpaling dari kebenaran.'''
  alternative: Partisipel dapat dipahami secara lebih longgar sebagai mengaitkan baik dongeng maupun perintah dengan orang-orang yang berpaling dari kebenaran.
  rationale: Kesesuaian kasus dan jumlah serta kedekatan letaknya membuat ἀνθρώπων menjadi acuan gramatikal yang paling alami. Terjemahan ini tidak menambahkan klaim doktrinal di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'dongeng-dongeng' dan 'perintah-perintah' mempertahankan jumlah jamak; 'manusia' digunakan secara inklusif. Frasa ini sengaja tetap berupa lanjutan sintaksis dari ayat sebelumnya.
