id: TIT.1.3
reference: Titus 1:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐφανέρωσεν δὲ καιροῖς ἰδίοις, τὸν λόγον αὐτοῦ ἐν κηρύγματι ὃ ἐπιστεύθην ἐγὼ κατ’ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/003.yaml
  text: but in his own times he revealed his word through the proclamation with which I was entrusted[a], according to the command of God our Savior[c][b],
translation:
  language: id
  text: tetapi pada waktu-waktu yang ditentukan-Nya[a], Ia menyatakan firman-Nya melalui pemberitaan[b] yang dipercayakan kepadaku[c], sesuai dengan perintah Allah, Juru Selamat kita,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada waktu-waktu-Nya sendiri”; maksudnya dapat berupa waktu-waktu yang telah Allah tetapkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “melalui kegiatan memberitakan.” Istilah Yunaninya dapat menunjuk pada tindakan pemberitaan ataupun pesan yang diberitakan.
    reason: lexical_alternative
  - marker: c
    text: 'Klausa ini juga dapat dipahami berhubungan dengan “firman-Nya”: “firman-Nya ... yang dipercayakan kepadaku.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφανέρωσεν
  choice: Ia menyatakan
  rationale: Bentuk aoristus aktif menunjukkan tindakan Allah membuat firman-Nya dikenal secara terbuka. “Menyatakan” alami dalam bahasa Indonesia dan tidak menyiratkan sekadar penyampaian informasi biasa.
- source_word: καιροῖς ἰδίοις
  choice: pada waktu-waktu yang ditentukan-Nya
  rationale: Frasa datif ini menunjuk pada waktu-waktu yang berada dalam penetapan Allah. Pilihan ini menyampaikan nuansa kepunyaan atau kewenangan dalam ἰδίοις dengan bahasa Indonesia yang wajar; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: τὸν λόγον αὐτοῦ
  choice: firman-Nya
  rationale: λόγος di sini adalah pesan Allah yang dinyatakan, dalam konteks berkaitan dengan janji dan kabar baik. “Firman-Nya” mempertahankan istilah teologis yang dikenal tanpa mempersempitnya menjadi sekadar perkataan tertentu.
- source_word: ἐν κηρύγματι
  choice: melalui pemberitaan
  rationale: ἐν berfungsi secara instrumental, sedangkan κήρυγμα dapat menunjuk pada tindakan memberitakan maupun pesan yang diberitakan. “Melalui pemberitaan” cukup luas untuk mempertahankan kedua kemungkinan itu.
- source_word: ὃ
  choice: yang
  rationale: Kata ganti relatif netral tunggal ini paling dekat dengan κήρυγμα dan dalam susunan terjemahan merujuk pada “pemberitaan.” Kemungkinan bahwa kata ini merujuk kembali kepada “firman-Nya” dipertahankan dalam catatan kaki.
- source_word: ἐπιστεύθην
  choice: dipercayakan kepadaku
  rationale: Bentuk pasif πιστεύω dalam konstruksi ini berarti sesuatu dipercayakan kepada Paulus, bukan bahwa Paulus percaya. Terjemahan ini menyatakan tanggung jawab yang diterimanya.
- source_word: κατ’ ἐπιταγὴν
  choice: sesuai dengan perintah
  rationale: κατά dengan akusatif menunjukkan kesesuaian dengan atau dasar berupa arahan yang berwenang. “Sesuai dengan perintah” akurat dan idiomatis.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Allah, Juru Selamat kita
  rationale: Frasa genitif ini memberi gelar “Juru Selamat kita” kepada Allah. Tanda koma memperjelas hubungan aposisional tersebut dalam bahasa Indonesia.
theological_decisions:
- issue: Subjek tersirat dari ἐφανέρωσεν dan nuansa καιροῖς ἰδίοις
  choice: 'Allah menjadi subjek pribadi: “pada waktu-waktu yang ditentukan-Nya, Ia menyatakan.”'
  alternative: Terjemahan impersonal, misalnya “pada waktu yang tepat hal itu dinyatakan.”
  rationale: Konteks sebelumnya berbicara tentang Allah yang berjanji, lalu ayat ini beralih kepada tindakan-Nya menyatakan firman. Subjek pribadi mempertahankan kesinambungan itu dan nuansa kepunyaan atau penetapan dalam ἰδίοις.
- issue: Acuan kata ganti relatif ὃ
  choice: Kata itu dipahami merujuk pada “pemberitaan.”
  alternative: 'Kata itu dapat dipahami merujuk pada “firman-Nya”: “firman-Nya ... yang dipercayakan kepadaku.”'
  rationale: κῆρυγμα adalah anteseden terdekat, dan ungkapan pasif ἐπιστεύθην wajar menyatakan isi pemberitaan yang dipercayakan kepada Paulus. Karena kedua nomina berjenis netral tunggal dan secara makna saling berkaitan, kemungkinan alternatif dicatat tanpa diputuskan secara dogmatis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina “Ia” dan sufiks “-Nya” merujuk kepada Allah; “kepadaku” mempertahankan suara pribadi Paulus. Koma penutup dipertahankan karena ayat ini merupakan bagian dari kalimat pembuka yang berlanjut ke ayat berikutnya.
