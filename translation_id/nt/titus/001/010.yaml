  text: Εἰσὶν γὰρ πολλοὶ ⸀καὶ ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται, μάλιστα οἱ ἐκ ⸀τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/010.yaml
  text: For there are many rebellious people[a], empty talkers and deceivers, especially those of the circumcision,
translation:
  language: id
  text: Sebab ada banyak orang yang tidak mau tunduk, yang berbicara omong kosong, dan yang menipu, terutama mereka yang berasal dari golongan bersunat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka yang berasal dari sunat.” Ungkapan ini mungkin menunjuk kepada orang Yahudi atau kepada orang-orang yang mengajarkan kewajiban sunat, tetapi teks Yunani tidak menyatakannya secara lebih khusus.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai bahwa pernyataan ini memberikan alasan bagi petunjuk sebelumnya dan mempertahankan hubungan wacananya secara alami dalam bahasa Indonesia.
- source_word: πολλοὶ καὶ ἀνυπότακτοι
  choice: banyak orang yang tidak mau tunduk
  rationale: Adjektiva substantival diterjemahkan dengan menambahkan 'orang'. Frasa 'tidak mau tunduk' menyampaikan penolakan terhadap otoritas yang semestinya dengan bahasa modern dan jelas; καί dalam susunan ini dipahami menghubungkan banyaknya orang dengan sifat mereka, tanpa perlu diterjemahkan secara kaku sebagai 'dan'.
- source_word: ματαιολόγοι
  choice: yang perkataannya sia-sia
  rationale: Mengungkapkan orang-orang yang berbicara tentang hal yang kosong, tidak berguna, atau tanpa isi; bentuk ini lebih alami daripada sebutan harfiah 'pembicara sia-sia'.
- source_word: φρεναπάται
  choice: yang menyesatkan pikiran
  rationale: Mempertahankan nuansa unsur φρήν, yaitu pikiran atau pengertian, sekaligus menyampaikan tindakan memperdaya dengan bahasa Indonesia yang wajar.
- source_word: μάλιστα
  choice: terutama
  rationale: Menandai satu kelompok yang secara khusus disoroti dalam kelompok yang lebih luas.
- source_word: οἱ ἐκ τῆς περιτομῆς
  choice: mereka dari kalangan orang bersunat
  rationale: Menjaga ungkapan Yunani yang ringkas dan identitasnya dengan sunat tanpa secara tegas menggantinya dengan 'orang Yahudi' atau menambahkan gagasan sebuah partai yang tidak dinyatakan langsung.
theological_decisions:
- issue: Rujukan οἱ ἐκ τῆς περιτομῆς
  choice: mereka dari kalangan orang bersunat
  alternative: mereka dari kelompok yang mewajibkan sunat; orang-orang Yahudi
  rationale: Ungkapan itu mungkin menunjuk kepada penentang Yahudi atau penganut ajaran yang mewajibkan sunat, tetapi teks Yunani tidak menentukan identitas tersebut secara eksplisit. Terjemahan utama mempertahankan keluasan rujukannya, sedangkan catatan menjelaskan kemungkinan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel 'yang ... dan yang ...' menjaga tiga gambaran terhadap para penentang tetap jelas. Istilah 'orang bersunat' dipertahankan untuk menghindari penafsiran historis atau denominasi yang terlalu sempit.
