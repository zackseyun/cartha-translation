  text: ἡ μαρτυρία αὕτη ἐστὶν ἀληθής. δι’ ἣν αἰτίαν ἔλεγχε αὐτοὺς ἀποτόμως, ἵνα ὑγιαίνωσιν ἐν τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/013.yaml
  text: This testimony is true. For this reason[a], rebuke them sharply, so that they may be sound in the faith,
translation:
  language: id
  text: Kesaksian ini benar. Karena itu, tegurlah mereka dengan tajam, supaya mereka sehat dalam iman[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Yunani ini dapat berarti bahwa mereka sehat dalam iman mereka atau sehat dalam iman Kristen sebagai isi ajaran.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ μαρτυρία αὕτη
  choice: Kesaksian itu
  rationale: Merujuk kembali pada kutipan tentang orang Kreta dalam ayat sebelumnya. “Kesaksian” mempertahankan nuansa pernyataan yang memberikan kesaksian, sedangkan “itu” wajar dalam bahasa Indonesia untuk rujukan anaforis ini.
- source_word: ἀληθής
  choice: benar
  rationale: Adjektiva predikatif ini menyatakan bahwa kesaksian tersebut sesuai dengan kenyataan; “benar” adalah padanan Indonesia yang langsung dan alami.
- source_word: δι’ ἣν αἰτίαν
  choice: Karena itu
  rationale: Ungkapan ini menarik kesimpulan berdasarkan pernyataan sebelumnya. “Karena itu” ringkas, alami, dan mempertahankan hubungan sebab-akibat.
- source_word: ἔλεγχε
  choice: tegurlah
  rationale: Imperatif kini ini memerintahkan Titus untuk menghadapi dan mengoreksi kesalahan mereka secara langsung. “Tegurlah” mempertahankan daya korektif serta konfrontatifnya.
- source_word: ἀποτόμως
  choice: dengan keras
  rationale: Adverbia ini menunjukkan ketajaman atau ketegasan yang kuat dalam teguran. “Dengan keras” menyampaikan daya tersebut tanpa menambahkan gagasan hukuman.
- source_word: ὑγιαίνωσιν
  choice: mereka sehat
  rationale: Kata kerja ini secara harfiah berkaitan dengan kesehatan dan di sini digunakan secara kiasan. Terjemahan ini mempertahankan metafora sumber, alih-alih menjelaskannya secara berlebihan sebagai semata-mata ketepatan doktrin.
- source_word: ἐν τῇ πίστει
  choice: dalam iman
  rationale: Ungkapan Indonesia ini mempertahankan kemungkinan bahwa yang dimaksud ialah kesehatan dalam iman mereka ataupun keteguhan dalam iman Kristen sebagai isi kepercayaan. Konteks pengajaran sesat mendukung makna kedua, tetapi bentuk Yunani tidak mengharuskan ambiguitas itu dihapus.
theological_decisions:
- issue: Makna ἐν τῇ πίστει
  choice: dalam iman
  alternative: sehat dalam kepercayaan mereka; teguh dalam ajaran iman Kristen
  rationale: Dalam Surat-Surat Pastoral, πίστις dengan artikel dapat menunjuk pada iman Kristen sebagai isi atau kumpulan kepercayaan, khususnya dalam konteks pengajaran sesat. Namun, ungkapan itu juga dapat dipahami sebagai iman yang mereka miliki. Teks utama memakai bentuk Indonesia yang tetap terbuka, dan catatan kaki menerangkan kedua kemungkinan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan berwibawa. Metafora kesehatan dipertahankan karena dapat dipahami dalam konteks dan mencerminkan diksi khas surat ini. Tanda koma penutup dipertahankan karena ayat berlanjut secara sintaksis ke ayat berikutnya.
