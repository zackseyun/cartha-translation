base_translation:
  language: en
  yaml_path: translation/nt/titus/001/009.yaml
  text: holding firmly to the trustworthy word in accordance with the teaching[b][a], so that he may be able both to exhort by sound teaching and to rebuke those who contradict it.
translation:
  language: id
  text: Ia harus berpegang teguh pada perkataan yang dapat dipercaya, yang sesuai dengan ajaran[a], supaya ia mampu menasihati dengan ajaran yang sehat dan menegur[b] orang-orang yang menentang ajaran itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berpegang teguh pada perkataan yang setia menurut ajaran.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “membantah” atau “membuktikan bahwa mereka salah.” Kata Yunani ini dapat berarti menunjukkan atau membuktikan bahwa seseorang salah, maupun menegurnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντεχόμενον
  choice: berpegang teguh pada
  rationale: Ungkapan ini menyampaikan ketekunan dan keterikatan aktif pada sesuatu, serta alami dalam bahasa Indonesia untuk konteks syarat seorang penatua.
- source_word: πιστοῦ λόγου
  choice: firman yang dapat dipercaya
  rationale: πιστός di sini paling wajar menyatakan bahwa λόγος itu andal atau layak dipercaya. “Firman” mempertahankan istilah λόγος dalam konteks pesan ajaran Kristen.
- source_word: κατὰ τὴν διδαχήν
  choice: yang sesuai dengan ajaran
  rationale: κατά dengan akusatif menunjukkan kesesuaian dengan suatu patokan. Artikel pada διδαχή menunjuk kepada ajaran yang dikenal, tanpa perlu menambahkan kategori dogmatis belakangan.
- source_word: παρακαλεῖν
  choice: menasihati
  rationale: Dalam konteks pelayanan, παρακαλέω mencakup dorongan dan desakan berdasarkan ajaran. “Menasihati” terdengar alami dan cukup luas dalam bahasa Indonesia modern.
- source_word: ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ
  choice: dengan ajaran yang sehat
  rationale: ἐν dapat menyatakan sarana, sedangkan ὑγιαίνω secara metaforis berarti sehat atau benar. Terjemahan ini mempertahankan metafora sumber dan menghindari jargon yang tidak perlu.
- source_word: ἀντιλέγοντας
  choice: mereka yang menentangnya
  rationale: Partisip ini menunjuk kepada orang-orang yang berbicara menentang atau membantah. Akhiran “-nya” secara wajar merujuk pada firman atau ajaran dalam konteks terdekat.
- source_word: ἐλέγχειν
  choice: menegur
  rationale: Kata ini dapat mencakup penyingkapan kesalahan, pembuktian bahwa seseorang keliru, dan teguran korektif. “Menegur” cocok dengan dimensi pastoral, sedangkan nuansa “membantah” dipertahankan dalam catatan kaki.
- source_word: δυνατὸς ᾖ
  choice: ia mampu
  rationale: Bentuk ini menyatakan kemampuan dalam klausa tujuan sesudah ἵνα. “Ia mampu” ringkas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan “ajaran” dan “firman yang dapat dipercaya”
  choice: Keduanya dipahami sebagai pesan atau ajaran Kristen yang telah diterima dan menjadi patokan bagi pemimpin jemaat.
  alternative: Ajaran moral yang lebih umum atau pendapat pribadi penatua.
  rationale: Artikel pada διδαχή dan pemakaian πιστὸς λόγος dalam konteks Surat-Surat Pastoral mendukung rujukan kepada ajaran yang dikenal. Terjemahan tidak mempersempitnya menjadi rumusan dogmatis dari masa kemudian.
- issue: Arti ἐλέγχειν terhadap para penentang
  choice: “Menegur” sebagai tindakan korektif yang dapat mencakup menunjukkan kesalahan.
  alternative: “Membantah” atau “membuktikan bahwa mereka salah.”
  rationale: Konteks memasangkan pelayanan positif berupa nasihat dengan tanggapan korektif kepada para penentang. Karena verba Yunani juga dapat menekankan penolakan argumen, alternatif itu dicatat tanpa menghapus daya pastoralnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur ayat mempertahankan hubungan syarat dan tujuan, sedangkan istilah “ajaran yang sehat” mempertahankan metafora Yunani yang lazim dan jelas.
