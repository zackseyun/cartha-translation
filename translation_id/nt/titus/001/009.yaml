  to: Ia harus berpegang teguh pada perkataan yang dapat dipercaya, yang sesuai dengan ajaran[a], supaya ia mampu menasihati dengan ajaran yang sehat dan menegur[b] orang-orang yang menentang ajaran itu.
  rationale: Revisi mengganti “firman” dengan “perkataan” untuk mencerminkan λόγος secara netral dalam konteks ini, menghapus objek tambahan “orang” yang tidak dinyatakan dalam teks Yunani, dan memperjelas bahwa para penentang menentang ajaran/pesan, bukan semata-mata sang penatua. Hubungan tujuan serta pasangan tindakan positif (menasihati) dan korektif (menegur) dipertahankan.
