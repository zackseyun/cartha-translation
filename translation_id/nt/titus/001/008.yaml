    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: melainkan
  rationale: Menandai pertentangan tegas dengan sifat-sifat buruk pada ayat sebelumnya dan terdengar alami dalam daftar ini.
- source_word: φιλόξενον
  choice: suka menerima tamu
  rationale: Mengungkapkan kesediaan menyambut tamu atau orang asing dengan bahasa Indonesia yang wajar dan mudah dipahami.
- source_word: φιλάγαθον
  choice: mencintai apa yang baik
  rationale: Mempertahankan makna kata majemuk ini sebagai kasih kepada segala sesuatu yang baik, bukan sekadar sebutan umum bagi orang baik.
- source_word: σώφρονα
  choice: bijaksana dalam mengendalikan diri
  rationale: Mencakup unsur pikiran yang sehat, kewajaran, dan pengendalian diri, sekaligus membedakannya dari ἐγκρατῆ.
- source_word: δίκαιον
  choice: adil
  rationale: Padanan langsung yang dalam daftar watak ini menyatakan perilaku yang benar dan lurus terhadap orang lain.
- source_word: ὅσιον
  choice: saleh
  rationale: Mengungkapkan kesetiaan dan kesungguhan hidup di hadapan Allah tanpa menyamakan istilah ini secara penuh dengan kata Yunani yang biasanya diterjemahkan 'kudus'.
- source_word: ἐγκρατῆ
  choice: mampu menguasai diri
  rationale: Menekankan kemampuan menahan dan menguasai keinginan atau dorongan diri, serta mempertahankan perbedaannya dari σώφρονα.
theological_decisions:
- issue: Pembedaan antara σώφρονα dan ἐγκρατῆ
  choice: Menerjemahkan σώφρονα sebagai 'bijaksana dalam mengendalikan diri' dan ἐγκρατῆ sebagai 'mampu menguasai diri'.
  alternative: Menerjemahkan keduanya dengan istilah yang hampir sama, seperti 'dapat mengendalikan diri' dan 'berdisiplin', atau memakai 'bijaksana' untuk σώφρονα.
  rationale: 'Kedua sifat ini bertumpang tindih tetapi tidak identik: yang pertama turut menunjuk pada kewarasan pertimbangan dan sikap terukur, sedangkan yang kedua lebih khusus menekankan penguasaan atas dorongan diri.'
- issue: Nuansa ὅσιον
  choice: saleh
  alternative: kudus; berbakti kepada Allah
  rationale: Dalam daftar watak ini, 'saleh' mempertahankan nuansa kesetiaan religius dan hidup yang berkenan kepada Allah. Catatan kaki menjaga kemungkinan padanan 'kudus' atau 'berbakti kepada Allah' tanpa memaksakan satu nuansa teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan berupa rangkaian sifat yang ringkas. 'Suka menerima tamu' dipilih daripada istilah yang lebih formal seperti 'ramah terhadap orang asing'; dua ungkapan tentang pengendalian diri sengaja dibedakan dan dijelaskan dalam catatan.
