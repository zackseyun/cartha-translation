  text: melainkan suka menerima tamu, mencintai apa yang baik, bijaksana[a], adil[b], saleh[c], dan dapat menguasai diri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Yunani memakai dua sifat yang berkaitan: σώφρονα menunjuk pada pertimbangan yang sehat, sikap terukur, dan pengendalian diri, sedangkan ἐγκρατῆ menekankan kemampuan menguasai keinginan dan dorongan diri.'
    reason: lexical_alternative
  - marker: b
    text: Atau "benar" atau "lurus dalam hidup".
