  text: Τούτου χάριν ⸀ἀπέλιπόν σε ἐν Κρήτῃ ἵνα τὰ λείποντα ἐπιδιορθώσῃ, καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/005.yaml
  text: For this reason I left you in Crete[a], so that you might set in order what remained and appoint elders in every city[c][b], as I directed you.
translation:
  language: id
  text: Itulah sebabnya aku meninggalkanmu di Kreta, agar engkau menata hal-hal yang masih perlu diselesaikan[a] dan mengangkat para penatua di setiap kota[b], sebagaimana telah kuperintahkan kepadamu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hal-hal yang masih kurang.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “dari kota ke kota.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “sebagaimana telah kuarahkan kepadamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Karena alasan inilah
  rationale: Ungkapan ini menyatakan alasan bagi tindakan Paulus dan diterjemahkan secara alami sambil mempertahankan daya penjelasnya.
- source_word: ἀπέλιπόν
  choice: aku meninggalkan
  rationale: Bentuk aoris ini merujuk pada tindakan Paulus meninggalkan Titus di Kreta; terjemahan ini jelas tanpa memberi penekanan berlebih pada gagasan 'meninggalkan di belakang'.
- source_word: ἐν Κρήτῃ
  choice: di Kreta
  rationale: Frasa lokatif langsung dengan bentuk baku nama pulau tersebut dalam bahasa Indonesia.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan tindakan Paulus secara wajar dalam bahasa Indonesia modern.
- source_word: τὰ λείποντα
  choice: hal-hal yang masih belum selesai
  rationale: Frasa partisipial ini menunjuk pada berbagai urusan yang masih tersisa atau belum lengkap. Pilihan ini mempertahankan nuansa ketidaktuntasan, sedangkan nuansa kekurangan dicatat dalam catatan kaki.
- source_word: ἐπιδιορθώσῃ
  choice: membereskan
  rationale: Kata kerja ini menyampaikan tindakan membenahi dan menata lebih lanjut hal-hal yang belum selesai. 'Membereskan' alami, mudah dipahami, dan mencakup kedua nuansa itu.
- source_word: καταστήσῃς
  choice: mengangkat
  rationale: Dalam konteks kepemimpinan jemaat, kata ini berarti menetapkan atau menunjuk seseorang ke dalam suatu peranan. 'Mengangkat' merupakan ungkapan Indonesia yang alami untuk tindakan tersebut.
- source_word: κατὰ πόλιν
  choice: di setiap kota
  rationale: Konstruksi distributif κατά dengan nomina tunggal menunjukkan penetapan dari kota ke kota; 'di setiap kota' menyampaikan makna itu dengan jelas.
- source_word: πρεσβυτέρους
  choice: para penatua
  rationale: Dalam konteks ini istilah tersebut menunjuk pada pemimpin jemaat, bukan sekadar laki-laki lanjut usia. 'Penatua' adalah istilah gerejawi Indonesia yang luas dan tidak dengan sendirinya menentukan suatu tata gereja tertentu.
- source_word: ὡς ἐγώ σοι διεταξάμην
  choice: seperti yang telah kuarahkan kepadamu
  rationale: διατάσσομαι dapat menyatakan arahan atau perintah yang berwibawa. 'Kuarahkan' mempertahankan kewibawaan Paulus tanpa memaksakan kadar ketegasan maksimum; alternatif yang lebih kuat dicatat dalam catatan kaki.
theological_decisions:
- issue: Istilah jabatan jemaat dalam πρεσβυτέρους
  choice: Diterjemahkan 'para penatua' tanpa memasukkan struktur denominasi yang berkembang kemudian.
  alternative: '''para presbiter'' atau ''orang-orang yang lebih tua'''
  rationale: Konteksnya menyangkut kepemimpinan jemaat yang diakui, tetapi ayat ini tidak merinci seluruh bentuk tata gereja. 'Para penatua' mencerminkan makna leksikal dan konteks langsung tanpa menyelesaikan perdebatan eklesiologis di luar teks.
- issue: Kekuatan διεταξάμην
  choice: Diterjemahkan 'telah kuarahkan' dalam teks utama.
  alternative: '''telah kuperintahkan'' atau ''telah kuinstruksikan'''
  rationale: Kata Yunani ini mencakup instruksi yang berwibawa. 'Kuarahkan' menjaga unsur kewibawaan sambil mempertahankan keluasan maknanya; kemungkinan terjemahan yang lebih tegas tetap disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat, dengan pronomina tunggal 'engkau' serta bentuk terikat 'ku-' yang sesuai dengan wacana surat. Susunan kalimat mempertahankan hubungan alasan, tujuan, dan dua tugas Titus dengan jelas.
