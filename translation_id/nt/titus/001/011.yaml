id: TIT.1.11
reference: Titus 1:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/011.yaml
  text: They must be silenced[c][b][a], since they are upsetting whole households by teaching what they ought not for the sake of shameful gain.
translation:
  language: id
  text: Mereka harus dibungkam[a], sebab mereka mengacaukan seluruh rumah tangga[b] dengan mengajarkan hal-hal yang tidak sepatutnya demi keuntungan yang tercela[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “mulut mereka harus ditutup.”
    reason: lexical_alternative
  - marker: b
    text: “Seluruh rumah tangga” menunjuk pada keluarga dan orang-orang yang termasuk dalam lingkup sebuah rumah, bukan sekadar bangunan rumah.
    reason: cultural_note
  - marker: c
    text: Atau, “demi keuntungan yang memalukan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς
  choice: Mereka
  rationale: Kata ganti relatif ini mengacu kepada para pengajar sesat pada ayat sebelumnya. Dalam kalimat baru, “mereka” secara alami mempertahankan acuan tersebut.
- source_word: δεῖ
  choice: harus
  rationale: Menyatakan keharusan atau kewajiban dengan tegas.
- source_word: ἐπιστομίζειν
  choice: dibungkam
  rationale: Secara harfiah berarti “ditutup mulutnya”; “dibungkam” mempertahankan daya ungkap idiom itu sambil menunjukkan bahwa pengajaran mereka harus dihentikan, tanpa menentukan caranya.
- source_word: οἵτινες
  choice: sebab mereka
  rationale: Kata ganti relatif ini memberi alasan mengapa mereka harus dibungkam; “sebab mereka” menyampaikan fungsi penjelas tersebut secara wajar.
- source_word: ὅλους οἴκους
  choice: seluruh rumah tangga
  rationale: οἶκος dalam konteks sosial ini menunjuk pada kesatuan keluarga beserta orang-orang dalam lingkup rumah, bukan hanya bangunannya.
- source_word: ἀνατρέπουσιν
  choice: mengacaukan
  rationale: Kata ini dapat berarti menjungkirbalikkan, merusak, atau mengguncangkan. “Mengacaukan” menyampaikan gangguan serius terhadap rumah tangga tanpa memastikan kehancuran total.
- source_word: διδάσκοντες
  choice: dengan mengajarkan
  rationale: 'Partisipel ini paling wajar dipahami sebagai sarana: mereka mengacaukan rumah tangga melalui pengajaran mereka.'
- source_word: ἃ μὴ δεῖ
  choice: hal-hal yang tidak sepatutnya
  rationale: Ungkapan ini menyatakan bahwa isi ajaran tersebut tidak patut diajarkan, dengan tetap mempertahankan penilaian moral dalam teks.
- source_word: αἰσχροῦ κέρδους χάριν
  choice: demi keuntungan yang memalukan
  rationale: Frasa ini menunjukkan motivasi memperoleh keuntungan dengan cara atau tujuan yang tercela; pilihan ini jelas bagi pembaca modern dan mempertahankan kecaman etisnya.
theological_decisions:
- issue: Sifat tindakan terhadap para pengajar sesat
  choice: Mereka harus dibungkam
  alternative: Mulut mereka harus ditutup
  rationale: Ungkapan Yunani menuntut dihentikannya pengajaran yang merusak, tetapi tidak menyebut metode sipil, fisik, atau kelembagaan tertentu. Terjemahan ini mempertahankan ketegasannya tanpa menambahkan cara yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara idiom Yunani, cakupan sosial rumah tangga, dan kecaman terhadap motif keuntungan tetap dipertahankan.
