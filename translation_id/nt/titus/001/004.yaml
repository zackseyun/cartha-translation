base_translation:
  language: en
  yaml_path: translation/nt/titus/001/004.yaml
  text: 'To Titus[b][a], my true child according to our common faith: grace and peace from God the Father and Messiah Jesus our Savior.'
translation:
  language: id
  text: Kepada Titus, anakku yang sejati berdasarkan iman yang kita miliki bersama:[a] Anugerah dan damai sejahtera dari Allah Bapa dan Mesias Yesus,[b] Juru Selamat kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “sesuai dengan iman yang sama-sama kita miliki.”
    reason: lexical_alternative
  - marker: b
    text: Secara tradisional diterjemahkan “Kristus Yesus”; kata Yunani Χριστός berarti “Mesias” dan digunakan di sini sebagai gelar.
    reason: alternative_reading
lexical_decisions:
- source_word: γνησίῳ τέκνῳ
  choice: anakku yang sejati
  rationale: Ungkapan ini menyatakan keaslian hubungan rohani Paulus dengan Titus, bukan hubungan biologis atau status hukum. Bentuk posesif “anakku” mengungkapkan relasi yang tersirat secara wajar dalam sapaan Yunani.
- source_word: κατὰ κοινὴν πίστιν
  choice: dalam iman yang kita miliki bersama
  rationale: κατά menyatakan hubungan atau kesesuaian, sedangkan κοινή menandakan sesuatu yang dimiliki bersama. Rumusan ini alami dalam bahasa Indonesia dan tetap mempertahankan gagasan iman bersama.
- source_word: χάρις καὶ εἰρήνη
  choice: anugerah dan damai sejahtera
  rationale: Ini adalah rumusan berkat dalam surat-surat Paulus. “Anugerah” menyampaikan χάρις, sedangkan “damai sejahtera” merupakan padanan Indonesia yang lazim dan utuh bagi εἰρήνη.
- source_word: θεοῦ πατρὸς
  choice: Allah Bapa
  rationale: Teks Yunani tidak memuat kata “kita” setelah “Bapa”; karena itu “Allah Bapa” lebih tepat daripada “Allah Bapa kita”.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός dipertahankan sebagai gelar yang bermakna “Mesias”, bukan sekadar dialihaksarakan sebagai nama.
- source_word: σωτῆρος ἡμῶν
  choice: Juru Selamat kita
  rationale: Frasa ini secara langsung mengidentifikasi Mesias Yesus sebagai Juru Selamat kita.
theological_decisions:
- issue: Fungsi Χριστός dalam Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Terjemahan “Mesias” menyampaikan arti gelar Yunani Χριστός dan menghindari hilangnya muatan gelarnya melalui alih aksara semata.
- issue: Acuan σωτῆρος ἡμῶν
  choice: “Juru Selamat kita” menerangkan Mesias Yesus
  alternative: Frasa itu dapat didengar secara lebih longgar dalam rangkaian sumber berkat
  rationale: Susunan Χριστοῦ Ἰησοῦ τοῦ σωτῆρος ἡμῶν paling wajar menempatkan frasa berartikel tersebut sebagai aposisi bagi Mesias Yesus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada surat resmi yang hangat. “Anakku” mempertahankan metafora keluarga rohani; “damai sejahtera” dipilih sebagai ungkapan Indonesia yang alami dalam rumusan berkat. Tanda baca dan pemenggalan menampilkan sapaan lalu berkat dengan jelas.
