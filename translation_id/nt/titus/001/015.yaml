id: TIT.1.15
reference: Titus 1:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀πάντα καθαρὰ τοῖς καθαροῖς· τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν, ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/015.yaml
  text: All things are pure to the pure; but to those who are defiled and unbelieving[a], nothing is pure. Instead, both their mind and their conscience are defiled.
translation:
  language: id
  text: Segala sesuatu adalah murni bagi orang-orang yang murni. Namun, bagi orang-orang yang tercemar dan tidak beriman, tidak ada sesuatu pun yang murni. Sebaliknya, baik pikiran maupun hati nurani mereka tercemar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα
  choice: Segala sesuatu
  rationale: Bentuk jamak netral ini bersifat menyeluruh; “segala sesuatu” mempertahankan cakupan luas dan corak aforistis kalimat.
- source_word: καθαρά / καθαρόν / καθαροῖς
  choice: murni / orang-orang yang murni
  rationale: καθαρός dapat menunjuk pada kemurnian ritual maupun moral. “Murni” lebih mampu mempertahankan kedua nuansa itu daripada “bersih” dalam bahasa Indonesia masa kini.
- source_word: τοῖς δὲ μεμιαμμένοις
  choice: bagi orang-orang yang tercemar
  rationale: Partisipel perfektum menunjukkan keadaan tercemar sebagai hasil yang menetap; “yang tercemar” menyampaikan daya statif tersebut secara alami.
- source_word: ἀπίστοις
  choice: tidak percaya
  rationale: Dalam konteks ini, istilah tersebut terutama berlawanan dengan kepercayaan yang sejati; “tidak percaya” jelas tanpa mempersempitnya menjadi sekadar ketidaksetiaan.
- source_word: οὐδὲν καθαρόν
  choice: tidak ada sesuatu pun yang murni
  rationale: Pilihan ini mempertahankan struktur predikatif dan pengulangan bidang makna καθαρός dari klausa pertama.
- source_word: ἀλλὰ
  choice: Sebaliknya
  rationale: Kata ini menandai kontras kuat dan mengalihkan perhatian kepada keadaan batin mereka.
- source_word: μεμίανται
  choice: telah tercemar
  rationale: Bentuk perfektum menekankan keadaan kini yang merupakan hasil pencemaran; “telah tercemar” mengungkapkan unsur resultatif itu dengan wajar.
- source_word: νοῦς
  choice: pikiran
  rationale: Padanan alami untuk kemampuan berpikir dan memahami.
- source_word: συνείδησις
  choice: hati nurani
  rationale: Padanan baku dalam bahasa Indonesia untuk kesadaran dan penilaian moral batin.
- source_word: καὶ ... καὶ
  choice: baik ... maupun
  rationale: Konstruksi berpasangan ini menegaskan bahwa kedua unsur tersebut sama-sama tercemar.
theological_decisions:
- issue: Cakupan bahasa kemurnian
  choice: καθαρός diterjemahkan secara konsisten sebagai “murni” agar nuansa ritual dan moral tetap terbuka.
  alternative: “Bersih” di seluruh ayat, yang dapat lebih menonjolkan kategori kenajisan ritual.
  rationale: Konteksnya bersinggungan dengan aturan kemurnian, tetapi pernyataan ini juga menjangkau keadaan batin manusia. “Murni” mempertahankan keluasan dan ketegangan tersebut tanpa membatasinya hanya pada kebersihan seremonial.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur antitesis Yunani dipertahankan, sementara susunan kalimat dibuat alami bagi pembaca umum. Tidak diperlukan catatan kaki karena alternatif “bersih” tidak cukup diperlukan untuk memahami teks dan nuansa gandanya dijelaskan melalui pilihan “murni”.
