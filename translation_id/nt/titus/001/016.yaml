  text: θεὸν ὁμολογοῦσιν εἰδέναι, τοῖς δὲ ἔργοις ἀρνοῦνται, βδελυκτοὶ ὄντες καὶ ἀπειθεῖς καὶ πρὸς πᾶν ἔργον ἀγαθὸν ἀδόκιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/016.yaml
  text: They profess to know God[a], but by their works they deny him[d][c][b], being detestable and disobedient and unfit for every good work.
translation:
  language: id
  text: Mereka mengaku mengenal Allah[a], tetapi melalui perbuatan mereka, mereka menyangkal Dia[b]. Mereka keji, tidak taat, dan tidak layak untuk melakukan perbuatan baik apa pun[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mereka menyatakan bahwa mereka mengenal Allah.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tetapi dalam perbuatan mereka, mereka menyangkal Dia.”'
    reason: grammatical_alternative
  - marker: c
    text: 'Atau: “tidak lulus uji untuk setiap perbuatan baik.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν ὁμολογοῦσιν εἰδέναι
  choice: Mereka mengaku mengenal Allah
  rationale: Ungkapan ini menyatakan klaim terbuka yang kemudian dipertentangkan dengan perilaku mereka. 'Mengaku' alami dalam bahasa Indonesia dan tidak memastikan ketulusan klaim tersebut.
- source_word: τοῖς δὲ ἔργοις
  choice: tetapi melalui perbuatan mereka
  rationale: Dativus dapat menunjukkan sarana atau ranah. 'Melalui perbuatan mereka' memperjelas bahwa tindakan merekalah yang menjadi cara penyangkalan itu tampak, tanpa menghapus kemungkinan nuansa 'dalam perbuatan'.
- source_word: ἀρνοῦνται
  choice: mereka menyangkal Dia
  rationale: Objek 'Dia' diteruskan secara alami dari 'Allah' pada klausa pertama. 'Menyangkal' mempertahankan kontras kuat antara pengakuan lisan dan tindakan.
- source_word: βδελυκτοὶ
  choice: menjijikkan
  rationale: Kata ini menyatakan sesuatu yang secara moral sangat dibenci atau memuakkan. 'Menjijikkan' kuat, jelas, dan modern.
- source_word: ἀπειθεῖς
  choice: tidak taat
  rationale: Dalam konteks etis, istilah ini menunjuk pada penolakan untuk taat; terjemahan ini lebih langsung bagi pembaca umum daripada bentuk yang menekankan ketidakmauan untuk diyakinkan.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν ἀδόκιμοι
  choice: tidak layak untuk melakukan perbuatan baik apa pun
  rationale: ἀδόκιμοι menggambarkan kegagalan memenuhi standar atau ketidaklayakan. Frasa Indonesia ini idiomatis dan mempertahankan cakupan πᾶν sebagai 'apa pun'.
theological_decisions:
- issue: Hubungan antara pengakuan lisan dan penyangkalan melalui tindakan
  choice: Mereka mengaku mengenal Allah, tetapi tindakan mereka menyangkal Dia.
  alternative: Penyangkalan itu dapat dipahami lebih umum sebagai penolakan terhadap kebenaran Allah.
  rationale: Allah adalah objek pada klausa pertama dan secara alami tetap menjadi objek tersirat bagi ἀρνοῦνται. Terjemahan mempertahankan ketegangan antara klaim dan perilaku tanpa memperluasnya menjadi pernyataan doktrinal yang tidak eksplisit.
- issue: Nuansa ἀδόκιμοι
  choice: tidak layak
  alternative: tidak lulus uji; tidak memenuhi syarat; tidak berguna
  rationale: Kata Yunani dapat menyoroti kegagalan dalam pengujian dan akibatnya ketidaklayakan. 'Tidak layak' paling alami dalam teks utama, sedangkan nuansa 'tidak lulus uji' dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dua kalimat dipakai agar rangkaian sifat pada bagian akhir mudah dipahami, sementara kontras klaim dan tindakan tetap tegas. Kapitalisasi 'Dia' mengikuti kebiasaan penghormatan dalam bahasa Indonesia tanpa menambahkan unsur yang tidak terdapat dalam teks sumber.
