  text: in the hope of eternal life[a], which the God who does not lie promised before the ages began
translation:
  language: id
  text: dalam pengharapan akan hidup kekal, yang telah dijanjikan oleh Allah yang tidak berdusta sebelum segala zaman bermula.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebelum zaman-zaman yang kekal” (atau, “yang sudah lama”); dapat juga diterjemahkan, “sebelum waktu bermula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπ’ ἐλπίδι
  choice: dalam pengharapan akan
  rationale: Frasa ini mempertahankan hubungan pelayanan Paulus dengan pengharapan tanpa mempersempit ἐπί menjadi sebab atau dasar semata-mata; bentuk ini juga wajar dalam bahasa Indonesia.
- source_word: ζωῆς αἰωνίου
  choice: hidup kekal
  rationale: Genitif menyatakan isi atau sasaran pengharapan. 'Hidup kekal' adalah padanan Indonesia yang baku dan mempertahankan cakupan temporal serta bobot teologis ungkapan tersebut.
- source_word: ἣν
  choice: yang
  rationale: Pronomina relatif feminin tunggal ini paling wajar merujuk kepada 'hidup kekal', bukan kepada 'pengharapan'.
- source_word: ἐπηγγείλατο
  choice: telah dijanjikan
  rationale: Konstruksi pasif alami dalam bahasa Indonesia memungkinkan 'hidup kekal' tetap menjadi anteseden langsung, sementara pelaku ilahi dinyatakan dengan 'oleh Allah'.
- source_word: ὁ ἀψευδὴς θεὸς
  choice: Allah yang tidak berdusta
  rationale: Padanan ini menyatakan sifat ἀψευδής secara langsung tanpa memperkuatnya secara interpretatif menjadi 'tidak mungkin berdusta'.
- source_word: πρὸ χρόνων αἰωνίων
  choice: sebelum permulaan segala zaman
  rationale: Ungkapan ini mempertahankan unsur χρόνοι dan daya pretemporal frasa Yunani, sambil tetap terdengar alami. Catatan kaki menyajikan bentuk yang lebih harfiah dan alternatif idiomatis.
theological_decisions:
- issue: Frasa temporal πρὸ χρόνων αἰωνίων dan janji ilahi
  choice: sebelum permulaan segala zaman
  alternative: sebelum waktu bermula; sebelum zaman-zaman yang kekal
  rationale: Terjemahan menyatakan bahwa janji Allah mendahului segala zaman, tetapi tidak menentukan kepada siapa janji itu diberikan atau mekanisme metafisisnya.
- issue: Sebutan Allah sebagai ἀψευδής
  choice: Allah yang tidak berdusta
  alternative: Allah yang tidak mungkin berdusta; Allah yang benar
  rationale: Pilihan ini mempertahankan pernyataan moral dalam kata Yunani tanpa menambahkan klaim modal yang lebih kuat daripada bentuk sumber.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan klausa dibuat alami tanpa menghilangkan rujukan pronomina kepada hidup kekal atau ketegangan dalam frasa temporal.
