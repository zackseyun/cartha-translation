lexical_decisions:
- source_word: ὁ δι’ ἀγγέλων λαληθεὶς λόγος
  choice: pesan yang disampaikan melalui malaikat-malaikat
  rationale: λόγος dalam konteks ini menunjuk pada pesan ilahi yang dikomunikasikan. 'Disampaikan' mengungkapkan λαληθείς secara alami dalam bahasa Indonesia, sedangkan 'melalui' mempertahankan διά sebagai perantaraan tanpa menyatakan bahwa malaikat adalah sumber pesannya.
- source_word: ἀγγέλων
  choice: malaikat-malaikat
  rationale: Dalam konteks Ibrani 2, yang dimaksud kemungkinan besar adalah makhluk surgawi dalam tradisi tentang penyampaian Taurat, bukan utusan manusia.
- source_word: ἐγένετο βέβαιος
  choice: terbukti teguh
  rationale: Ungkapan ini menyatakan bahwa pesan tersebut berlaku secara kukuh dan dapat ditegakkan. 'Terbukti teguh' mempertahankan nuansa hasil tanpa mempersempitnya menjadi sekadar 'dikonfirmasi' atau menambahkan kata 'mengikat' yang tidak eksplisit.
- source_word: πᾶσα παράβασις
  choice: setiap pelanggaran
  rationale: παράβασις adalah tindakan melampaui batas atau melanggar suatu perintah; 'pelanggaran' merupakan padanan Indonesia yang alami dan bernuansa hukum-moral.
- source_word: παρακοὴ
  choice: ketidaktaatan
  rationale: παρακοή secara harfiah berkaitan dengan kegagalan mendengar atau mengindahkan, lalu menyatakan ketidaktaatan. Pilihan ini sesuai dengan kesejajarannya dengan παράβασις.
- source_word: ἔλαβεν
  choice: menerima
  rationale: Padanan langsung ini mempertahankan tindakan pelanggaran dan ketidaktaatan sebagai subjek gramatikal yang menerima balasan.
- source_word: ἔνδικον μισθαποδοσίαν
  choice: hukuman yang setimpal
  rationale: μισθαποδοσία berarti balasan atau pembayaran kembali, sedangkan ἔνδικος menunjukkan bahwa balasan itu adil atau layak. Dalam konteks sanksi, 'hukuman yang setimpal' alami dan mempertahankan unsur keadilan serta kesepadanan.
theological_decisions:
- issue: Hakikat 'pesan yang disampaikan melalui malaikat-malaikat'
  choice: Mempertahankan ungkapan umum sebagai kiasan yang kemungkinan menunjuk pada Taurat yang diperantarai malaikat.
  alternative: Menyebutnya secara eksplisit sebagai Taurat, atau memahaminya sebagai pesan ilahi yang lebih umum yang disampaikan oleh malaikat.
  rationale: Konteks dan tradisi Yahudi sangat mendukung acuan kepada Taurat di Sinai, tetapi teks Yunani hanya menyebut 'pesan'. Karena itu, terjemahan utama tidak menyisipkan 'Taurat' dan catatan kaki menjelaskan kemungkinan acuannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pengandaian dibiarkan terbuka dengan tanda koma karena ayat ini merupakan anak kalimat yang berlanjut ke ayat 3. Bentuk ulang 'malaikat-malaikat' dipakai untuk menyatakan jamak Yunani secara jelas.
