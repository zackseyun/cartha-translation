base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/005.yaml
  text: For he did not subject the world to come to angels[a], about which we are speaking.
translation:
  language: id
  text: Sebab, bukan kepada para malaikat Ia menundukkan dunia yang akan datang[a], yang sedang kita bicarakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dunia yang didiami manusia yang akan datang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Sebab, bukan
  rationale: γάρ menghubungkan ayat ini sebagai penjelasan bagi uraian sebelumnya, sedangkan οὐ menyangkal bahwa dunia yang akan datang ditundukkan kepada para malaikat.
- source_word: ἀγγέλοις
  choice: kepada malaikat-malaikat
  rationale: Dalam konteks Ibrani, yang dimaksud ialah makhluk surgawi, bukan utusan manusia; bentuk jamak Yunani dipertahankan secara alami dalam bahasa Indonesia.
- source_word: ὑπέταξεν
  choice: Ia menundukkan
  rationale: Kata ini menyatakan tindakan menempatkan sesuatu di bawah kekuasaan atau pemerintahan. 'Menundukkan' mempertahankan nuansa otoritas tanpa menambahkan pelaku atau cara yang tidak dinyatakan.
- source_word: τὴν οἰκουμένην
  choice: dunia
  rationale: οἰκουμένη dapat berarti dunia yang didiami atau tatanan dunia. 'Dunia' merupakan padanan Indonesia yang alami, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: τὴν μέλλουσαν
  choice: yang akan datang
  rationale: Partisip μέλλουσαν menyatakan masa mendatang dan menerangkan οἰκουμένη; frasa ini mempertahankan arah eskatologis tanpa menentukan lebih jauh sifat zaman tersebut.
- source_word: περὶ ἧς λαλοῦμεν
  choice: yang sedang kita bicarakan
  rationale: Bentuk kini λαλοῦμεν menunjuk pada pembahasan yang sedang berlangsung. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan rujukan relatif kepada 'dunia yang akan datang'.
theological_decisions:
- issue: Rujukan 'dunia yang akan datang'
  choice: Diterjemahkan sebagai dunia atau tatanan yang akan datang, dengan nuansa eskatologis tetap terbuka.
  alternative: Dunia yang didiami secara umum atau zaman Injil secara khusus.
  rationale: τὴν οἰκουμένην τὴν μέλλουσαν secara alami menunjuk kepada dunia yang akan datang. Terjemahan tidak mempersempitnya menjadi suatu sistem eskatologi tertentu.
- issue: Subjek tersirat ὑπέταξεν
  choice: Menggunakan 'Ia' tanpa menyebut nama, mengikuti subjek tersirat dalam bahasa Yunani dan hubungan konteksnya.
  alternative: Menyebut 'Allah' secara eksplisit.
  rationale: Konteks mendukung Allah sebagai pelaku, tetapi nama itu tidak tertulis dalam ayat ini. Memakai 'Ia' menjaga bentuk teks serta tidak menghilangkan rujukan personal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'bukan kepada ... Ia menundukkan' mempertahankan penekanan awal Yunani pada pihak yang tidak menerima kekuasaan, meskipun sedikit lebih formal daripada susunan percakapan biasa.
