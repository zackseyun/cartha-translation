  text: πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ· ἐν ⸂τῷ γὰρ⸃ ⸀ὑποτάξαι τὰ πάντα οὐδὲν ἀφῆκεν αὐτῷ ἀνυπότακτον. νῦν δὲ οὔπω ὁρῶμεν αὐτῷ τὰ πάντα ὑποτεταγμένα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/008.yaml
  text: You subjected all things under his feet.” For in subjecting all things to him[a], he left nothing not subjected to him[b]. But now we do not yet see all things subjected to him.
translation:
  language: id
  text: “Segala sesuatu telah Engkau taklukkan di bawah kakinya.” Sebab dalam menaklukkan segala sesuatu kepadanya[a], Ia tidak membiarkan sesuatu pun tetap tidak takluk kepadanya[b]. Namun sekarang, kita belum melihat segala sesuatu takluk kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata ganti “-nya” dan “kepadanya” menggemakan Mazmur 8. Dalam konteks, kata-kata itu dapat menunjuk kepada manusia dalam makna awal mazmur tersebut dan kepada Yesus dalam penerapannya di surat Ibrani.
    reason: cross_reference
  - marker: b
    text: Atau, “Sebab, ketika Ia menaklukkan segala sesuatu kepadanya.” Konstruksi bahasa Yunani ini juga dapat dipahami dengan nuansa waktu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: segala sesuatu
  rationale: Bentuk jamak netral ini mencakup keseluruhan secara menyeluruh; “segala sesuatu” alami dan menjaga cakupan universalnya.
- source_word: ὑπέταξας
  choice: telah Engkau taklukkan
  rationale: Aoristus aktif ini menggemakan Mazmur 8. “Taklukkan” mempertahankan medan makna penundukan dan cocok dengan idiom di bawah kaki.
- source_word: ὑποκάτω τῶν ποδῶν αὐτοῦ
  choice: di bawah kakinya
  rationale: Ungkapan baku tentang kekuasaan dan penaklukan yang sekaligus mempertahankan gema Kitab Suci.
- source_word: ἐν τῷ ... ὑποτάξαι
  choice: dengan menaklukkan
  rationale: Konstruksi infinitif berartikel dengan ἐν dapat bernuansa keadaan, cara, atau waktu. Pilihan ini alami dalam bahasa Indonesia dan tidak menutup alternatif temporal yang dicatat dalam catatan kaki.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai penjelasan atas kutipan sebelumnya dan mempertahankan alur argumentasi.
- source_word: οὐδὲν ἀφῆκεν
  choice: Dia tidak membiarkan apa pun
  rationale: Ungkapan Indonesia yang wajar untuk klaim bahwa tidak ada sesuatu pun yang dikecualikan.
- source_word: ἀνυπότακτον
  choice: tidak takluk
  rationale: Menjaga pengulangan akar kata ὑποτάσσω dan menyatakan keadaan tidak berada dalam ketundukan.
- source_word: νῦν δὲ
  choice: Namun sekarang
  rationale: Menandai kontras antara pernyataan Kitab Suci dan apa yang saat ini tampak.
- source_word: οὔπω ὁρῶμεν
  choice: kita belum melihat
  rationale: Menyampaikan keadaan sekarang ketika penggenapan itu belum terlihat, dengan bahasa Indonesia yang alami.
- source_word: ὑποτεταγμένα
  choice: takluk
  rationale: Partisipel perfek pasif menyatakan keadaan hasil penaklukan; “takluk” menyampaikan keadaan tersebut secara ringkas dan mempertahankan kaitan leksikal dalam ayat.
theological_decisions:
- issue: Acuan kata ganti αὐτοῦ / αὐτῷ
  choice: Dipertahankan sebagai “-nya/kepadanya” tanpa menyebut acuannya secara eksplisit dalam teks utama.
  alternative: Menafsirkannya secara tegas sebagai manusia/umat manusia dalam Mazmur 8, atau sebagai Yesus dalam penerapan kristologis surat Ibrani.
  rationale: Mazmur 8 mula-mula berbicara tentang manusia, sedangkan konteks Ibrani menerapkannya secara memuncak kepada Yesus. Mempertahankan kata ganti menjaga ambiguitas dan ketegangan teologis dalam argumentasi penulis.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Kapitalisasi “Engkau” mengikuti sapaan kepada Allah dalam kutipan; “Dia” dipakai untuk subjek ilahi dalam penjelasan. Pengulangan “takluk/menaklukkan” sengaja dipertahankan untuk mencerminkan pengulangan kelompok kata ὑποτάσσω.
