  text: ὅθεν ὤφειλεν κατὰ πάντα τοῖς ἀδελφοῖς ὁμοιωθῆναι, ἵνα ἐλεήμων γένηται καὶ πιστὸς ἀρχιερεὺς τὰ πρὸς τὸν θεόν, εἰς τὸ ἱλάσκεσθαι τὰς ἁμαρτίας τοῦ λαοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/017.yaml
  text: Therefore he had to become like his brothers in every respect[a], so that he might become a merciful and faithful high priest in the things pertaining to God[b], to make atonement for the sins of the people.
translation:
  language: id
  text: Karena itu, Ia harus menjadi sama dengan saudara-saudara-Nya dalam segala hal[a], supaya Ia menjadi Imam Besar yang berbelas kasih dan setia dalam perkara-perkara yang berkaitan dengan Allah, untuk mengadakan pendamaian atas dosa-dosa umat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saudara-saudari-Nya.” Bahasa Yunani memakai istilah kekerabatan maskulin jamak yang dalam konteks dapat mencakup seluruh keluarga orang percaya.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Yunani juga dapat menonjolkan penghapusan kesalahan karena dosa atau peredaan murka atas dosa-dosa umat.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: Karena itu
  rationale: Menandai kesimpulan dari uraian sebelumnya dengan penghubung yang alami dalam bahasa Indonesia modern.
- source_word: ὤφειλεν
  choice: Ia harus
  rationale: Menyampaikan keharusan yang timbul dari tujuan penyelamatan Allah tanpa menyiratkan paksaan dari luar.
- source_word: κατὰ πάντα
  choice: dalam segala hal
  rationale: Mempertahankan cakupan menyeluruh dari keserupaan yang dinyatakan teks.
- source_word: τοῖς ἀδελφοῖς
  choice: saudara-saudara-Nya
  rationale: Mempertahankan bentuk kekerabatan maskulin jamak dalam sumber; dalam konteks, istilah ini dapat mencakup seluruh keluarga orang percaya, yang dijelaskan dalam catatan kaki.
- source_word: ὁμοιωθῆναι
  choice: menjadi sama dengan
  rationale: Ungkapan alami yang menyampaikan bahwa Ia mengambil kesamaan dengan saudara-saudara-Nya, tanpa menjelaskan lebih jauh cara terjadinya.
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan tujuan dengan jelas dan alami.
- source_word: ἐλεήμων
  choice: berbelaskasihan
  rationale: Menyampaikan sifat penuh belas kasihan dalam konteks pelayanan imamat.
- source_word: πιστὸς
  choice: setia
  rationale: Mempertahankan makna kesetiaan dan keterandalan dalam pelaksanaan tugas keimaman.
- source_word: ἀρχιερεὺς
  choice: Imam Besar
  rationale: Padanan baku dan mudah dipahami untuk gelar keimaman ini.
- source_word: τὰ πρὸς τὸν θεόν
  choice: dalam perkara-perkara yang berkaitan dengan Allah
  rationale: Mempertahankan ungkapan formal mengenai ranah pelayanan imam di hadapan Allah tanpa mempersempitnya menjadi satu tugas tertentu.
- source_word: εἰς τὸ ἱλάσκεσθαι
  choice: untuk mengadakan pendamaian bagi
  rationale: Padanan yang dapat dipahami dalam konteks imamat dan sengaja tidak memutuskan secara sempit antara nuansa penebusan dosa dan peredaan murka.
- source_word: τὰς ἁμαρτίας τοῦ λαοῦ
  choice: dosa-dosa umat itu
  rationale: Menyatakan dosa sebagai sasaran tindakan pendamaian dan mempertahankan rujukan tertentu kepada umat.
theological_decisions:
- issue: Makna ἱλάσκεσθαι dalam konteks pendamaian yang diperdebatkan
  choice: mengadakan pendamaian bagi
  alternative: menghapus kesalahan karena; meredakan murka atas
  rationale: Pilihan utama mempertahankan keluasan tindakan keimaman terhadap dosa tanpa secara diam-diam membatasi maknanya hanya pada penghapusan dosa atau peredaan murka; alternatif dicatat agar ketegangan leksikal tetap terlihat.
- issue: Cakupan istilah kekerabatan ἀδελφοῖς
  choice: saudara-saudara-Nya
  alternative: saudara-saudari-Nya
  rationale: Teks Yunani memakai bentuk maskulin jamak, sedangkan konteks keluarga umat percaya dapat mencakup laki-laki dan perempuan. Bentuk sumber dipertahankan dalam teks utama dan cakupan inklusif dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur tujuan dan corak keimaman dipertahankan, sementara istilah teknis yang diperdebatkan dijelaskan melalui catatan kaki.
