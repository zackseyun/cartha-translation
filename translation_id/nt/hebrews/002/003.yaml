id: HEB.2.3
reference: Hebrews 2:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πῶς ἡμεῖς ἐκφευξόμεθα τηλικαύτης ἀμελήσαντες σωτηρίας, ἥτις, ἀρχὴν λαβοῦσα λαλεῖσθαι διὰ τοῦ κυρίου, ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/003.yaml
  text: How will we escape if we neglect so great a salvation? This salvation[a], having at first been spoken through the Lord, was confirmed to us by those who heard him,
translation:
  language: id
  text: Bagaimanakah kita akan luput jika kita mengabaikan keselamatan yang sedemikian besar? Keselamatan ini[a] mula-mula diberitakan melalui Tuhan, lalu dikukuhkan bagi kita oleh mereka yang telah mendengar-Nya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang, setelah mula-mula diberitakan melalui Tuhan, dikukuhkan bagi kita oleh mereka yang telah mendengar-Nya.”'
    reason: Alternatif ini mempertahankan struktur klausa relatif ἥτις secara lebih langsung.
lexical_decisions:
- source_word: πῶς
  choice: Bagaimanakah
  rationale: Mempertahankan bentuk pertanyaan retoris dan daya peringatannya tanpa mengubahnya menjadi pernyataan eksplisit bahwa kelolosan mustahil.
- source_word: ἐκφευξόμεθα
  choice: kita akan luput
  rationale: Mencerminkan bentuk futur Yunani dan memakai ungkapan Indonesia yang wajar bagi lolos dari akibat atau hukuman.
- source_word: τηλικαύτης
  choice: yang sedemikian besar
  rationale: Menjaga penekanan pada keagungan atau besarnya keselamatan dengan susunan yang alami dalam bahasa Indonesia.
- source_word: ἀμελήσαντες
  choice: jika kita mengabaikan
  rationale: Partisip aoris ini berfungsi secara kondisional dalam pertanyaan peringatan; terjemahan ini alami dan mempertahankan relasinya dengan verba utama.
- source_word: σωτηρίας
  choice: keselamatan
  rationale: Istilah baku yang mencakup pembebasan sekaligus bobot penebusan dan eskatologis dalam konteks Ibrani.
- source_word: ἥτις
  choice: Keselamatan ini
  rationale: Mengulangi anteseden agar rujukannya jelas dalam bahasa Indonesia, sambil mencatat bentuk relatif yang lebih harfiah dalam catatan kaki.
- source_word: ἀρχὴν λαβοῦσα λαλεῖσθαι
  choice: mula-mula diberitakan
  rationale: Menyampaikan idiom inkoatif bahwa pemberitaan keselamatan bermula melalui Tuhan; 'diberitakan' lebih alami daripada bentuk pasif harfiah 'mulai diperkatakan'.
- source_word: διὰ τοῦ κυρίου
  choice: melalui Tuhan
  rationale: Mempertahankan διά dengan genitif sebagai perantaraan atau agensi, tanpa meratakan maknanya menjadi sekadar 'oleh'.
- source_word: κυρίου
  choice: Tuhan
  rationale: Gelar baku bagi κύριος; dalam konteks ini rujukannya paling kuat kepada Yesus.
- source_word: ὑπὸ τῶν ἀκουσάντων
  choice: oleh mereka yang telah mendengar-Nya
  rationale: Menjaga agensi pasif dan memperjelas objek tersirat, yakni Tuhan, dengan pronomina hormat yang lazim dalam penulisan Alkitab bahasa Indonesia.
- source_word: εἰς ἡμᾶς
  choice: kepada kita
  rationale: Mempertahankan arah kesaksian atau peneguhan menuju para penerima pesan.
- source_word: ἐβεβαιώθη
  choice: diteguhkan
  rationale: Mengungkapkan bahwa berita keselamatan dikukuhkan atau dijamin kebenarannya oleh para saksi pendengar.
theological_decisions:
- issue: Rujukan 'Tuhan' (τοῦ κυρίου)
  choice: Dipahami sebagai Yesus, yang melalui-Nya berita keselamatan mula-mula disampaikan.
  alternative: Rujukan yang lebih umum kepada Allah sebagai Tuhan.
  rationale: Konteks dekat menyebut orang-orang yang mendengar-Nya lalu meneguhkan berita itu kepada komunitas berikutnya, sehingga paling wajar menunjuk pada pemberitaan Yesus dan kesaksian para pendengar langsung.
- issue: Daya pertanyaan peringatan
  choice: 'Dipertahankan sebagai pertanyaan retoris: ''Bagaimanakah kita akan luput ...?'''
  alternative: 'Diubah menjadi pernyataan tegas: ''Kita pasti tidak akan luput ...'''
  rationale: Bentuk interogatif Yunani menyiratkan peringatan yang sangat keras, tetapi tidak secara gramatikal menyatakannya sebagai proposisi negatif langsung.
- issue: Hubungan ἥτις dengan σωτηρίας
  choice: Anteseden diulang sebagai 'Keselamatan ini' demi kejelasan.
  alternative: 'Memakai klausa relatif langsung: ''yang mula-mula diberitakan ...'''
  rationale: Keduanya mungkin; teks utama mengutamakan kelancaran Indonesia, sedangkan alternatif yang lebih dekat dengan struktur Yunani dicatat agar ambiguitas sintaksis tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Luput', 'keselamatan', dan 'diteguhkan' mempertahankan register kitab suci tanpa menjadi arkais. Huruf kapital pada pronomina '-Nya' mengikuti konvensi penghormatan yang umum dalam penerbitan Alkitab Indonesia.
