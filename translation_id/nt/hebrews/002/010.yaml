  text: Ἔπρεπεν γὰρ αὐτῷ, δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα, πολλοὺς υἱοὺς εἰς δόξαν ἀγαγόντα τὸν ἀρχηγὸν τῆς σωτηρίας αὐτῶν διὰ παθημάτων τελειῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/010.yaml
  text: For it was fitting for him—for whom are all things and through whom are all things—in bringing many sons to glory[d][c][b][a], to perfect the pioneer of their salvation through sufferings.
translation:
  language: id
  text: Sebab memang pantas bagi Dia—yang bagi-Nya segala sesuatu ada dan yang melalui-Nya segala sesuatu ada—dalam membawa banyak anak laki-laki kepada kemuliaan, untuk menyempurnakan perintis keselamatan mereka melalui berbagai penderitaan.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Banyak anak laki-laki” mempertahankan kata Yunani yang menekankan status sebagai anak dan ahli waris; ungkapan ini mencakup semua anak Allah, bukan hanya laki-laki.
    reason: lexical_alternative
  - marker: b
    text: Atau “pemimpin,” “pelopor,” atau “pendiri” keselamatan mereka.
    reason: lexical_alternative
  - marker: c
    text: “Menyempurnakan” di sini berarti membawa kepada sasaran atau penyelesaian yang dimaksudkan melalui penderitaan, bukan memperbaiki suatu cacat moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔπρεπεν
  choice: memang pantas
  rationale: Imperfek impersonal πρέπω menyatakan apa yang sesuai atau layak dalam maksud Allah; “memang pantas” alami dalam bahasa Indonesia dan mempertahankan bobot penegas γάρ dalam konteks.
- source_word: αὐτῷ
  choice: bagi Dia
  rationale: Pronomina datif ini merujuk kepada Allah dalam konteks; huruf kapital membantu pembaca mengenali rujukannya tanpa mengganti pronomina Yunani dengan nama eksplisit.
- source_word: δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα
  choice: yang bagi-Nya segala sesuatu ada dan yang melalui-Nya segala sesuatu ada
  rationale: 'Dua frasa διά dibedakan: yang pertama menyatakan tujuan akhir (“bagi-Nya”), sedangkan yang kedua menyatakan perantaraan atau sarana (“melalui-Nya”). Kata “ada” disediakan agar konstruksi eliptis Yunani jelas dan wajar dalam bahasa Indonesia.'
- source_word: πολλοὺς υἱοὺς
  choice: banyak anak laki-laki
  rationale: υἱούς secara leksikal berarti “anak-anak laki-laki/putra-putra” dan di sini membawa gema status keanakan serta warisan. Catatan kaki menjelaskan bahwa cakupannya tidak dibatasi pada laki-laki.
- source_word: εἰς δόξαν
  choice: kepada kemuliaan
  rationale: εἰς menyatakan gerak menuju tujuan; “kepada kemuliaan” mempertahankan arah dan tujuan tersebut.
- source_word: ἀγαγόντα
  choice: ketika membawa
  rationale: Partisip aoris ini dikaitkan secara sirkumstansial dengan τελειῶσαι. “Ketika membawa” mempertahankan hubungan yang cukup terbuka dan tidak mengubahnya secara tegas menjadi klausa tujuan.
- source_word: ἀρχηγὸν
  choice: perintis
  rationale: ἀρχηγός menunjuk kepada sosok yang memulai dan membuka jalan sekaligus memimpin. “Perintis” menangkap unsur pembuka jalan lebih baik daripada “pengarang”.
- source_word: τῆς σωτηρίας αὐτῶν
  choice: keselamatan mereka
  rationale: Padanan genitif yang alami dan langsung dalam bahasa Indonesia.
- source_word: διὰ παθημάτων
  choice: melalui berbagai penderitaan
  rationale: Bentuk jamak παθημάτων dipertahankan melalui “berbagai penderitaan,” yang menunjuk pada pengalaman-pengalaman penderitaan konkret.
- source_word: τελειῶσαι
  choice: menyempurnakan
  rationale: Dalam Ibrani, τελειόω berarti membawa kepada sasaran, kelengkapan, atau penyelesaian yang dimaksudkan. Istilah “menyempurnakan” mempertahankan kaitan leksikal kitab ini, dengan penjelasan dalam catatan kaki agar tidak dipahami sebagai perbaikan cacat moral.
theological_decisions:
- issue: Makna τελειῶσαι ketika dikenakan kepada Sang Anak
  choice: menyempurnakan
  alternative: membawa kepada penyelesaian; menjadikan lengkap
  rationale: Kata ini dipertahankan untuk menjaga jaringan istilah dalam Surat Ibrani, tetapi dipahami sebagai membawa peran dan karya-Nya kepada sasaran melalui penderitaan, bukan mengoreksi kekurangan moral.
- issue: Cakupan πολλοὺς υἱοὺς
  choice: banyak anak laki-laki
  alternative: banyak anak
  rationale: Bentuk maskulin dan gema status anak/ahli waris dipertahankan dalam teks utama. Catatan menjelaskan bahwa ungkapan itu mencakup umat Allah secara luas, bukan hanya laki-laki.
- issue: Hubungan ἀγαγόντα dengan τελειῶσαι
  choice: ketika membawa ... menyempurnakan
  alternative: untuk membawa ... menyempurnakan; setelah membawa ... menyempurnakan
  rationale: Partisip aoris dapat dipahami dengan beberapa nuansa sirkumstansial. Terjemahan tidak menetapkannya sebagai tujuan secara eksklusif dan mempertahankan hubungan sintaksis Yunani sedekat mungkin tanpa menjadi tidak terbaca.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur sisipan dipertahankan karena merupakan bagian penting dari argumentasi ayat, tetapi tanda pisah membantu keterbacaan. Pilihan “ketika membawa” sengaja menjaga hubungan partisipial yang tidak sepenuhnya dipastikan sebagai tujuan atau hasil.
