id: HEB.2.9
reference: Hebrews 2:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὸν δὲ βραχύ τι παρ’ ἀγγέλους ἠλαττωμένον βλέπομεν Ἰησοῦν διὰ τὸ πάθημα τοῦ θανάτου δόξῃ καὶ τιμῇ ἐστεφανωμένον, ὅπως ⸀χωρὶς θεοῦ ὑπὲρ παντὸς γεύσηται θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/009.yaml
  text: But we see Jesus[a], who was made lower than the angels for a little while, crowned with glory and honor because of the suffering of death, so that by the grace of God he might taste death for everyone.
translation:
  language: id
  text: Namun, kita melihat Yesus, yang untuk waktu yang singkat dibuat lebih rendah daripada para malaikat, dimahkotai dengan kemuliaan dan kehormatan karena penderitaan maut, supaya tanpa Allah[a] Ia mengecap maut bagi setiap orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “oleh anugerah Allah” dan bukan “tanpa Allah.”
    reason: textual_variant
lexical_decisions:
- source_word: βραχύ τι
  choice: untuk waktu yang singkat
  rationale: 'Dalam konteks kutipan Mazmur 8, frasa ini paling wajar dipahami secara temporal: keadaan Yesus yang lebih rendah daripada para malaikat berlangsung untuk waktu terbatas.'
- source_word: παρ’ ἀγγέλους
  choice: daripada para malaikat
  rationale: Setelah ἐλαττόω, παρά dengan akusatif menyatakan perbandingan; bentuk ini alami dalam bahasa Indonesia.
- source_word: ἠλαττωμένον
  choice: dibuat lebih rendah
  rationale: Bentuk pasif dipertahankan tanpa mempersempit maknanya menjadi sekadar penghinaan atau kerendahan hati.
- source_word: διὰ τὸ πάθημα τοῦ θανάτου
  choice: karena penderitaan maut
  rationale: διά dengan akusatif paling alami menyatakan alasan bagi pemahkotaan Yesus. Ungkapan ini mempertahankan hubungan gramatikal πάθημα dan θάνατος tanpa parafrasa berlebihan.
- source_word: δόξῃ καὶ τιμῇ ἐστεφανωμένον
  choice: dimahkotai dengan kemuliaan dan kehormatan
  rationale: Terjemahan ini mempertahankan metafora pemahkotaan dan motif pengagungan dalam teks.
- source_word: ὅπως
  choice: supaya
  rationale: Kata ini memperkenalkan tujuan atau hasil; 'supaya' mempertahankan daya teleologisnya secara alami.
- source_word: χωρὶς θεοῦ
  choice: tanpa Allah
  rationale: Naskah sumber yang diberikan berbunyi χωρὶς θεοῦ, sehingga bacaan ini ditempatkan dalam teks utama. 'Tanpa Allah' mempertahankan ungkapan ringkas dan ketegangan maknanya tanpa menjelaskan secara berlebihan.
- source_word: ὑπὲρ παντός
  choice: bagi setiap orang
  rationale: Dalam konteks ini, bentuk tunggal distributif paling wajar merujuk kepada setiap orang; 'bagi' juga mempertahankan nuansa tindakan demi kepentingan atau atas nama mereka.
- source_word: γεύσηται θανάτου
  choice: mengecap maut
  rationale: Metafora sumber dipertahankan dan tetap dapat dipahami dalam bahasa Indonesia Alkitabiah modern.
theological_decisions:
- issue: Varian tekstual dalam klausa tujuan
  choice: tanpa Allah
  alternative: oleh anugerah Allah
  rationale: Teks Yunani yang ditetapkan dalam permintaan berbunyi χωρὶς θεοῦ ('tanpa Allah'), sedangkan banyak saksi tekstual membaca χάριτι θεοῦ ('oleh anugerah Allah'). Karena penerjemahan berangkat dari edisi sumber yang diberikan, bacaan χωρὶς θεοῦ dipakai dalam teks utama, sementara bacaan penting lainnya dicatat dalam catatan kaki tanpa menyelesaikan ketegangan teologisnya secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti alur Yunani sejauh tetap alami; istilah 'maut' dan metafora 'mengecap maut' dipertahankan karena jelas dalam register Alkitabiah dan menjaga citra teks sumber.
