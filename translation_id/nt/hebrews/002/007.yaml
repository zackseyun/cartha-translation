  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἠλάττωσας αὐτὸν βραχύ τι παρ’ ἀγγέλους, δόξῃ καὶ τιμῇ ἐστεφάνωσας ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/007.yaml
  text: You made him lower than the angels for a little while[a]; you crowned him with glory and honor.
translation:
  language: id
  text: Engkau membuat dia lebih rendah daripada para malaikat untuk waktu yang singkat[a]; Engkau memahkotai dia dengan kemuliaan dan kehormatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau membuat dia sedikit lebih rendah daripada para malaikat.” Frasa Yunani ini dapat menyatakan derajat, bukan lamanya waktu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάττωσας
  choice: Engkau membuat ... lebih rendah
  rationale: Bentuk aoristus aktif indikatif orang kedua tunggal dari ἐλαττόω dipahami secara kausatif-komparatif. Ungkapan Indonesia ini menyatakan tindakan menjadikan lebih rendah dan berpadu wajar dengan παρά + akusatif.
- source_word: αὐτὸν
  choice: dia
  rationale: Pronomina objek tunggal dipertahankan tanpa menambahkan nomina yang tidak terdapat dalam klausa Yunani. Huruf kecil menghindari penafsiran eksplisit yang melampaui bentuk sumber.
- source_word: βραχύ τι
  choice: untuk waktu yang singkat
  rationale: Frasa ini dapat menunjuk pada durasi atau derajat. Makna temporal cocok dengan penerapan dalam konteks Ibrani 2, sedangkan makna derajat tetap dicantumkan dalam catatan kaki.
- source_word: παρ’ ἀγγέλους
  choice: daripada para malaikat
  rationale: παρά dengan akusatif sesudah ἐλαττόω memiliki daya komparatif, sehingga diterjemahkan 'daripada'. Bentuk jamak tertentu diungkapkan secara idiomatis sebagai 'para malaikat'.
- source_word: δόξῃ
  choice: dengan kemuliaan
  rationale: Datif menyatakan sesuatu yang dipakai untuk memahkotai. 'Dengan kemuliaan' alami dalam bahasa Indonesia dan mempertahankan citra sumber.
- source_word: τιμῇ
  choice: dan kehormatan
  rationale: τιμή menunjuk pada kehormatan atau status yang dianugerahkan. 'Kemuliaan dan kehormatan' mempertahankan pasangan makna δόξα dan τιμή.
- source_word: ἐστεφάνωσας
  choice: Engkau memahkotai
  rationale: Bentuk aoristus aktif indikatif orang kedua tunggal diterjemahkan sebagai tindakan tuntas dalam kutipan. Verba 'memahkotai' mempertahankan metafora Yunani.
- source_word: αὐτόν
  choice: dia
  rationale: Pronomina objek yang diulang dalam sumber juga dipertahankan agar struktur kedua klausa tetap jelas.
theological_decisions:
- issue: Makna βραχύ τι dalam kutipan Mazmur 8 yang diterapkan dalam Ibrani
  choice: 'Temporal: ''untuk waktu yang singkat'''
  alternative: 'Derajat: ''sedikit lebih rendah'''
  rationale: Bahasa Yunani memungkinkan kedua makna. Dalam konteks Ibrani 2, makna temporal selaras dengan perendahan sementara sebelum pemuliaan, tetapi ambiguitas sumber tidak dihapus; bacaan derajat disajikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai 'Engkau'; pronomina 'dia' tidak dikapitalisasi agar tidak memasukkan identifikasi teologis secara eksplisit ke dalam bentuk pronomina. Susunan kalimat mengikuti paralelisme kutipan sambil tetap alami bagi pembaca umum.
