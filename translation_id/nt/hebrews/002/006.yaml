  terminology: “Manusia” dan “anak manusia” tepat sebagai kesejajaran puitis Mazmur dan tidak memaksakan pembacaan gelar mesianik. Kapitalisasi “Engkau” sesuai konvensi penerbitan yang dipakai draf. Catatan b sebaiknya menyebut “Surat Ibrani” agar tidak rancu dengan bahasa atau bangsa Ibrani.
