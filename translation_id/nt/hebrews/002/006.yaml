  text: διεμαρτύρατο δέ πού τις λέγων· Τί ἐστιν ἄνθρωπος ὅτι μιμνῄσκῃ αὐτοῦ, ἢ υἱὸς ἀνθρώπου ὅτι ἐπισκέπτῃ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/006.yaml
  text: But someone has testified somewhere[a], saying, “What is man, that you remember him, or the son of man[c][b], that you care for him?”
translation:
  language: id
  text: 'Namun, seseorang pernah memberi kesaksian di suatu tempat:


    “Apakah manusia, sehingga Engkau mengingatnya,

    atau anak manusia[b], sehingga Engkau peduli kepadanya?[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Dalam Mazmur 8, “anak manusia” merupakan ungkapan puitis bagi manusia; dalam konteks Surat Ibrani yang lebih luas, kutipan ini juga memperoleh makna khusus sehubungan dengan Yesus.
    reason: theological_ambiguity
  - marker: c
    text: Atau “mengunjunginya” atau “memeliharanya.” Kata Yunani ini dapat berarti memberi perhatian melalui kunjungan atau kepedulian aktif.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεμαρτύρατο
  choice: telah bersaksi
  rationale: Kata ini menyatakan pemberian kesaksian yang tegas. “Telah bersaksi” wajar dalam bahasa Indonesia dan sesuai dengan fungsi kutipan Kitab Suci sebagai kesaksian.
- source_word: δέ
  choice: Namun
  rationale: Partikel ini menandai peralihan dengan sedikit pertentangan terhadap pembahasan sebelumnya; “Namun” menyampaikan hubungan itu tanpa membuat pertentangannya terlalu keras.
- source_word: πού τις
  choice: di suatu tempat seseorang
  rationale: Gabungan kata tak tentu ini memperkenalkan kutipan tanpa menyebut lokasi maupun penuturnya. Ungkapan tersebut tidak harus menyiratkan bahwa penulis tidak mengetahui sumber kutipan.
- source_word: Τί ἐστιν ἄνθρωπος
  choice: Apakah manusia
  rationale: Bentuk tunggal dipertahankan sebagai ungkapan puitis yang mewakili umat manusia secara umum.
- source_word: μιμνῄσκῃ αὐτοῦ
  choice: Engkau mengingatnya
  rationale: Kata kerja ini berarti mengingat atau tetap menaruh seseorang dalam ingatan. “Mengingatnya” mempertahankan gambaran sumber dan mudah dipahami.
- source_word: υἱὸς ἀνθρώπου
  choice: anak manusia
  rationale: Ungkapan ini mempertahankan bentuk puitis Mazmur 8 dan tetap membuka hubungannya dengan manusia pada umumnya serta penerapannya kepada Yesus dalam konteks Ibrani.
- source_word: ἐπισκέπτῃ αὐτόν
  choice: Engkau memperhatikannya
  rationale: Kata kerja ini dapat menyatakan kunjungan yang disertai kepedulian, pengawasan, atau pemeliharaan. “Memperhatikannya” cukup luas untuk menyampaikan perhatian aktif tanpa membatasinya pada kunjungan fisik.
theological_decisions:
- issue: Apakah υἱὸς ἀνθρώπου harus diterjemahkan secara eksplisit sebagai gelar mesianik
  choice: Mempertahankan “anak manusia” tanpa kapitalisasi sebagai ungkapan dalam kutipan Mazmur.
  alternative: “Anak Manusia” sebagai gelar, atau “seorang manusia” sebagai ungkapan yang sepenuhnya generik.
  rationale: Dalam Mazmur 8 ungkapan ini sejajar dengan “manusia” dan menunjuk kepada kemanusiaan, sedangkan konteks Ibrani selanjutnya menerapkannya kepada Yesus. Terjemahan ini mempertahankan ketegangan antara kedua cakupan tersebut tanpa memutuskannya terlalu dini.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan khidmat. Susunan kutipan dibuat dalam dua baris untuk mempertahankan kesejajaran puitis. Kata ganti yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
