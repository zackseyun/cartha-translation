  to: 'Namun, seseorang pernah memberi kesaksian di suatu tempat:


    “Apakah manusia, sehingga Engkau mengingatnya,

    atau anak manusia[b], sehingga Engkau peduli kepadanya?[c]”'
  rationale: Revisi memperlancar pengantar kutipan dan memilih “peduli kepadanya” untuk menyampaikan kepedulian aktif dalam ἐπισκέπτῃ. Bentuk puitis dan ambiguitas yang disengaja pada “anak manusia” tetap dipertahankan. Catatan kaki a tetap disediakan karena merupakan bagian dari set catatan yang ada, meskipun jangkar a tidak ditempatkan dalam teks draf yang diberikan; jangkar a seharusnya ditempatkan setelah “di suatu tempat” bila sistem penerbitan mengharuskan semua catatan memiliki jangkar.
