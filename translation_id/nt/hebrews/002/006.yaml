  source_fidelity: 'Makna kutipan diterjemahkan dengan setia: δέ sebagai peralihan, πού τις sebagai pengantar kutipan tanpa penyebutan sumber, ἄνθρωπος dan υἱὸς ἀνθρώπου tetap sejajar secara puitis, dan kedua kata kerja ilahi dipertahankan. Namun, “memperhatikannya” dapat hanya berarti menyadari atau mengamati, sedangkan ἐπισκέπτῃ dalam konteks ini mengandung perhatian yang peduli dan aktif.'
