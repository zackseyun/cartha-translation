base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/001.yaml
  text: For this reason[a], we must pay much closer attention to what we have heard, lest we drift away.
translation:
  language: id
  text: Karena itu, kita harus lebih sungguh-sungguh memperhatikan apa yang telah kita dengar, agar kita jangan sampai hanyut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “agar kita jangan sampai hanyut melewatinya” atau “agar kita jangan sampai membiarkannya terlepas.” Kata Yunani παραρυῶμεν membangkitkan gambaran tentang hanyut atau terlepas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Karena itu
  rationale: Ungkapan inferensial yang alami dalam bahasa Indonesia dan mempertahankan hubungan logis dengan uraian sebelumnya.
- source_word: δεῖ
  choice: kita harus
  rationale: Menyampaikan unsur keharusan dengan tegas dan wajar; subjek 'kita' mencerminkan ἡμᾶς dalam konstruksi infinitif.
- source_word: περισσοτέρως
  choice: semakin sungguh-sungguh
  rationale: Mempertahankan daya komparatif/intensif dan berpadu secara alami dengan 'memperhatikan' tanpa membatasi makna hanya pada ketelitian intelektual.
- source_word: προσέχειν ἡμᾶς
  choice: kita harus ... memperhatikan
  rationale: Mengungkapkan tindakan mengarahkan perhatian dan mengindahkan secara jelas dalam bahasa Indonesia modern.
- source_word: τοῖς ἀκουσθεῖσιν
  choice: apa yang telah kita dengar
  rationale: Bentuk idiomatis yang mempertahankan acuan pada hal-hal yang sudah didengar serta relevansinya yang berkelanjutan, tanpa menambahkan kata 'pesan' yang tidak tersurat.
- source_word: μήποτε
  choice: supaya jangan
  rationale: Memperkenalkan kemungkinan akibat negatif sebagai peringatan secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: παραρυῶμεν
  choice: kita hanyut menjauh
  rationale: Mempertahankan citra gerakan perlahan seperti terbawa arus dan menempatkan para pendengar sebagai pihak yang berada dalam bahaya, seraya tidak menentukan secara berlebihan hakikat teologis keadaan itu.
theological_decisions:
- issue: Arah metafora παραρυῶμεν
  choice: Peringatan bahwa 'kita hanyut menjauh'
  alternative: Kita hanyut melewatinya; atau kita membiarkan apa yang didengar itu terlepas
  rationale: Sintaks dan konteks peringatan mendukung penggambaran para pendengar sebagai pihak yang hanyut, tetapi verba Yunani memungkinkan nuansa hanyut melewati sesuatu atau membiarkan sesuatu terlepas. Teks utama menjaga daya pastoral peringatan tanpa memasukkan sistem doktrinal tertentu; alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang tegas dan bermartabat. 'Semakin sungguh-sungguh memperhatikan' dipilih agar mudah dipahami sekaligus mempertahankan intensitas teks Yunani; metafora 'hanyut' dipertahankan.
