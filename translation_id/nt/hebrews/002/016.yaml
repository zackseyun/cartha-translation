  text: For surely it is not angels that he helps[a], but the offspring of Abraham.
translation:
  language: id
  text: Sebab jelas bahwa bukan malaikat yang ditolong-Nya[a], melainkan keturunan Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dipegang-Nya” atau “diambil-Nya”; kata Yunani ini secara harfiah dapat berarti “memegang” atau “mengambil,” tetapi di sini kemungkinan besar berarti “menolong” atau “memberi pertolongan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δήπου
  choice: jelas bahwa
  rationale: Partikel ini memberi penegasan inferensial, yakni sesuatu yang dianggap nyata bagi pembaca. Ungkapan 'jelas bahwa' menyampaikan daya tersebut secara alami dalam bahasa Indonesia modern.
- source_word: ἀγγέλων
  choice: malaikat
  rationale: Genitif jamak ini menyatakan golongan yang dikontraskan dengan keturunan Abraham; 'malaikat' adalah padanan langsung dan alami.
- source_word: ἐπιλαμβάνεται
  choice: ditolong-Nya
  rationale: Dalam konteks ini verba tersebut paling mungkin berarti memegang untuk menolong, yakni datang memberi pertolongan. Bentuk ini mempertahankan Kristus sebagai pelaku sambil menghasilkan bahasa Indonesia yang wajar; arti lebih harfiahnya dicatat dalam catatan kaki.
- source_word: σπέρματος Ἀβραὰμ
  choice: keturunan Abraham
  rationale: σπέρμα di sini merupakan nomina kolektif yang dapat berarti benih atau keturunan. 'Keturunan Abraham' alami dalam bahasa Indonesia dan tidak memaksakan apakah acuannya dipahami secara tunggal atau jamak.
- source_word: οὐ γὰρ ... ἀλλὰ
  choice: Sebab ... bukan ... melainkan ...
  rationale: Susunan ini mempertahankan hubungan penjelasan dengan ayat sebelumnya sekaligus kontras tegas antara malaikat dan keturunan Abraham.
theological_decisions:
- issue: Makna ἐπιλαμβάνεται dalam kaitannya dengan karya penyelamatan Kristus
  choice: Ayat ini menyatakan bahwa Kristus menolong keturunan Abraham, bukan malaikat.
  alternative: Ayat ini menyatakan bahwa Kristus memegang atau mengambil keturunan Abraham, yang dapat dipahami dengan penekanan pada pengambilan kodrat manusia.
  rationale: Konteks dekat membahas solidaritas Sang Anak dengan manusia dan tindakan-Nya yang menyelamatkan, sehingga arti idiomatis 'menolong' paling sesuai. Namun, arti dasar 'memegang' tetap memiliki dukungan leksikal dan sejarah penafsiran, sehingga dipertahankan dalam catatan kaki tanpa meniadakan ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Jelas bahwa' mengungkapkan penegasan δήπου tanpa terasa kaku; 'ditolong-Nya' menggunakan bentuk pasif yang alami untuk mempertahankan kontras golongan dalam teks Yunani.
