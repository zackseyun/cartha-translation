  text: καὶ ἀπαλλάξῃ τούτους, ὅσοι φόβῳ θανάτου διὰ παντὸς τοῦ ζῆν ἔνοχοι ἦσαν δουλείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/015.yaml
  text: and free those who[a], through fear of death, were subject to slavery all their lives.
translation:
  language: id
  text: dan membebaskan semua orang yang, karena takut akan kematian, sepanjang hidup mereka berada di bawah perbudakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tunduk pada perbudakan” atau “terikat dalam perbudakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαλλάξῃ
  choice: membebaskan
  rationale: Verba ini berarti melepaskan atau membebaskan dari suatu keadaan atau ikatan; “membebaskan” alami dan selaras dengan gambaran perbudakan.
- source_word: τούτους, ὅσοι
  choice: semua orang yang
  rationale: Gabungan demonstratif dan relatif ini menunjuk kepada seluruh golongan yang dicirikan oleh klausa berikutnya; bentuk Indonesia ini alami sekaligus mempertahankan cakupan inklusif ὅσοι.
- source_word: φόβῳ θανάτου
  choice: oleh ketakutan akan kematian
  rationale: Dativus φόβῳ dapat menyatakan sarana atau sebab. Dalam susunan “diperbudak oleh,” pilihan ini secara alami menunjukkan ketakutan akan kematian sebagai kuasa atau keadaan yang mengikat.
- source_word: διὰ παντὸς τοῦ ζῆν
  choice: sepanjang hidup mereka
  rationale: Ungkapan ini menunjuk pada seluruh rentang kehidupan; terjemahan tersebut jelas dan idiomatis dalam bahasa Indonesia modern.
- source_word: ἔνοχοι ἦσαν δουλείας
  choice: diperbudak
  rationale: Ungkapan ini menyatakan keadaan berada di bawah atau terikat pada perbudakan, bukan sekadar kemungkinan hukum. “Diperbudak” menyampaikan keadaan nyata itu secara ringkas tanpa menentukan pelaku personal.
- source_word: δουλείας
  choice: diperbudak
  rationale: Makna perbudakan dipertahankan dalam bentuk verbal yang alami dalam kalimat Indonesia dan tetap menyampaikan kuatnya ikatan tersebut.
- source_word: καὶ
  choice: dan
  rationale: Kata hubung ini mengaitkan klausa dengan tujuan atau hasil yang disebut dalam ayat sebelumnya.
theological_decisions:
- issue: Sifat perbudakan yang berkaitan dengan ketakutan akan kematian
  choice: Teks menyatakan bahwa ketakutan akan kematian memperbudak mereka sepanjang hidup, tanpa mempersempitnya menjadi perbudakan kepada Iblis atau dosa.
  alternative: “tunduk pada perbudakan” atau penjelasan eksplisit bahwa mereka diperbudak oleh Iblis, dosa, atau kefanaan
  rationale: Konteks ayat 14 menyebut Iblis dan kuasa maut, tetapi ayat 15 sendiri tidak menyebut objek atau mekanisme doktrinal yang lebih khusus. Terjemahan mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. “Ketakutan akan kematian” lebih alami daripada “ketakutan terhadap kematian,” sedangkan “sepanjang hidup mereka” menerjemahkan idiom duratif Yunani dengan jelas.
