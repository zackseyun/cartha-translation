review_pass:
  verdict: revise
  source_fidelity: Draf menyampaikan pembebasan, ketakutan akan kematian, dan durasi sepanjang hidup. Namun, “diperbudak oleh ketakutan akan kematian” menjadikan ketakutan itu secara langsung sebagai pelaku/kuasa yang memperbudak. Dalam Yunani, φόβῳ θανάτου lebih tepat menyatakan keadaan atau sebab/sarana yang berkaitan dengan keadaan ἔνοχοι δουλείας (“berada di bawah/tunduk pada perbudakan”). Revisi mempertahankan hubungan tersebut tanpa memperjelas mekanisme perbudakan melampaui teks.
  naturalness: “Karena takut akan kematian, sepanjang hidup mereka berada di bawah perbudakan” adalah bahasa Indonesia baku modern, jelas, dan alami. Susunan ini juga menghindari ambiguitas bahwa ketakutan secara harfiah adalah agen yang memperbudak.
  terminology: “Membebaskan” tepat untuk ἀπαλλάξῃ. “Kematian” tepat untuk θανάτου, dan “perbudakan” mempertahankan kekuatan δουλεία tanpa menambahkan objek doktrinal seperti Iblis atau dosa.
  issues:
  - severity: medium
    issue: Hubungan antara “ketakutan akan kematian” dan “perbudakan” terlalu dipersempit menjadi konstruksi pelaku-pasien.
    rationale: Frasa “diperbudak oleh ketakutan akan kematian” dapat dibaca seolah-olah φόβος adalah pelaku langsung. Teks Yunani menyatakan bahwa orang-orang itu, karena/melalui takut akan kematian, berada dalam keadaan perbudakan. “Berada di bawah perbudakan karena takut akan kematian” mempertahankan ambiguitas kausal/instrumental sumber.
  revised_text: dan membebaskan semua orang yang, karena takut akan kematian, sepanjang hidup mereka berada di bawah perbudakan.[a]
