  text: ὅ τε γὰρ ἁγιάζων καὶ οἱ ἁγιαζόμενοι ἐξ ἑνὸς πάντες· δι’ ἣν αἰτίαν οὐκ ἐπαισχύνεται ἀδελφοὺς αὐτοὺς καλεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/011.yaml
  text: For both the one who sanctifies and those who are being sanctified are all from one[a]; for this reason he is not ashamed to call them brothers[b],
translation:
  language: id
  text: Sebab baik Dia yang menguduskan maupun mereka yang sedang dikuduskan, semuanya berasal dari satu[a]. Karena itulah Dia tidak malu menyebut mereka saudara-saudara-Nya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berasal dari satu Bapa,” “berasal dari satu sumber,” atau “berasal dari satu leluhur.” Teks Yunani tidak menyebutkan siapa atau apa yang dimaksud dengan “satu.”
    reason: alternative_reading
  - marker: b
    text: “Saudara-saudara” menerjemahkan bentuk jamak maskulin ἀδελφοὺς; dalam konteks, sebutan ini dapat mencakup seluruh keluarga orang percaya, termasuk perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅ τε γὰρ ἁγιάζων
  choice: Sebab baik Dia yang menguduskan
  rationale: Partisipel aktif kini dipakai sebagai nomina. Ungkapan ini mempertahankan hubungan leksikal dengan bentuk pasif berikutnya; kapitalisasi “Dia” menunjukkan bahwa konteks menunjuk kepada Sang Anak, tanpa menambahkan nama yang tidak terdapat dalam ayat.
- source_word: καὶ οἱ ἁγιαζόμενοι
  choice: maupun mereka yang sedang dikuduskan
  rationale: Partisipel pasif kini dapat menggambarkan tindakan atau keadaan yang sedang berlangsung. “Sedang dikuduskan” mencerminkan aspek tersebut dan mempertahankan akar kata yang sama dengan “menguduskan”.
- source_word: ἐξ ἑνὸς πάντες
  choice: semuanya berasal dari satu
  rationale: “Satu” dibiarkan tanpa acuan eksplisit sebagaimana teks Yunani, sedangkan kopula dan gagasan asal dinyatakan secara alami dalam bahasa Indonesia.
- source_word: δι’ ἣν αἰτίαν
  choice: Karena itulah
  rationale: Ungkapan idiomatis ini menyatakan akibat atau alasan berdasarkan pernyataan sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: οὐκ ἐπαισχύνεται
  choice: Dia tidak malu
  rationale: Padanan langsung dan wajar yang mempertahankan nuansa malu serta kehormatan.
- source_word: ἀδελφοὺς αὐτοὺς καλεῖν
  choice: menyebut mereka saudara-saudara-Nya
  rationale: “Saudara-saudara” mempertahankan nomina maskulin jamak dan metafora kekeluargaan. Akhiran “-Nya” secara alami menyatakan hubungan dengan subjek dalam bahasa Indonesia, bukan menambahkan kepemilikan yang terpisah dari konstruksi menyebut seseorang sebagai saudara.
theological_decisions:
- issue: Acuan subjek yang menguduskan dan acuan frasa “berasal dari satu”
  choice: Subjek ditampilkan sebagai “Dia” sesuai konteks yang menunjuk kepada Sang Anak, sedangkan “satu” tetap tidak dijelaskan.
  alternative: “berasal dari satu Bapa,” “berasal dari satu sumber,” atau “berasal dari satu leluhur”
  rationale: Konteks langsung mengidentifikasi pribadi yang menguduskan, tetapi ἐξ ἑνὸς tidak menyebutkan acuan ἑνός. Terjemahan tidak mempersempit kemungkinan teologis yang dibiarkan terbuka oleh teks.
- issue: Cakupan ἀδελφοὺς
  choice: “saudara-saudara-Nya” dalam teks utama, dengan catatan bahwa konteks dapat mencakup perempuan.
  alternative: “saudara-saudari-Nya” atau “sesama anggota keluarga-Nya”
  rationale: Bentuk sumber adalah maskulin jamak. Padanan formal dipertahankan, sementara cakupan komunitas orang percaya dijelaskan dalam catatan tanpa mengubah bentuk leksikal utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur korelatif “baik ... maupun ...” mempertahankan hubungan kedua kelompok dalam teks Yunani. Istilah “menguduskan/dikuduskan” dipilih karena dikenal luas sekaligus menjaga pengulangan akar kata sumber. Ambiguitas “satu” dipertahankan dan dijelaskan dalam catatan.
