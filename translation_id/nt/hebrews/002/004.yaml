  text: while God also bore witness with signs and wonders and various miracles and distributions of the Holy Spirit according to his will.
translation:
  language: id
  text: Allah turut memberikan kesaksian melalui tanda-tanda dan keajaiban-keajaiban, berbagai mukjizat[a], serta pembagian Roh Kudus[b], sesuai dengan kehendak-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbagai kuasa” atau “berbagai perbuatan penuh kuasa.” Istilah Yunani ini dapat menunjuk pada perwujudan kuasa dan, dalam konteks ini, pada perbuatan ajaib.
    reason: lexical_alternative
  - marker: b
    text: Atau “pengalokasian” atau “bagian-bagian Roh Kudus.” Teks ini tidak secara eksplisit menambahkan kata “karunia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπιμαρτυροῦντος τοῦ θεοῦ
  choice: Allah pun turut memberikan kesaksian
  rationale: Partisipel genitif ini menyatakan tindakan Allah yang menyertai pemberitaan para saksi pada ayat sebelumnya. Kata “turut” mempertahankan daya prefiks συν-, sedangkan “memberikan kesaksian” merupakan ungkapan Indonesia yang wajar.
- source_word: σημείοις τε καὶ τέρασιν
  choice: melalui tanda-tanda dan keajaiban-keajaiban
  rationale: Bentuk datif menunjukkan sarana yang Allah pakai untuk memberikan kesaksian. Pasangan istilah ini mempertahankan fungsi pembuktian dari σημεῖον dan kesan takjub dari τέρας.
- source_word: ποικίλαις δυνάμεσιν
  choice: berbagai mukjizat
  rationale: Dalam konteks ini δύναμις menunjuk pada perwujudan kuasa ilahi berupa tindakan ajaib. “Mukjizat” menyampaikan makna kontekstual secara alami, sementara catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
- source_word: πνεύματος ἁγίου μερισμοῖς
  choice: pembagian-pembagian Roh Kudus
  rationale: μερισμός berarti pembagian atau pengalokasian. Terjemahan ini tidak menambahkan kata “karunia,” yang tidak dinyatakan secara eksplisit dalam teks Yunani, dan mempertahankan hubungan genitif dengan Roh Kudus.
- source_word: κατὰ τὴν αὐτοῦ θέλησιν
  choice: sesuai dengan kehendak-Nya
  rationale: Frasa κατά dengan akusatif menyatakan kesesuaian dengan kehendak. Akhiran “-Nya” secara paling alami merujuk kepada Allah, subjek partisipel tersebut.
theological_decisions:
- issue: Rujukan αὐτοῦ dalam frasa “sesuai dengan kehendak-Nya”
  choice: Akhiran “-Nya” dipahami merujuk kepada Allah.
  alternative: Akhiran itu dapat dipahami lebih longgar sebagai merujuk kepada Roh Kudus, meskipun secara sintaksis kurang mungkin.
  rationale: Allah adalah subjek pengendali dalam klausa ini dan memberikan kesaksian melalui semua sarana yang disebutkan. Terjemahan tidak menambahkan penjelasan doktrinal di luar struktur kalimat.
- issue: Makna πνεύματος ἁγίου μερισμοῖς
  choice: pembagian-pembagian Roh Kudus
  alternative: pembagian karunia-karunia Roh Kudus
  rationale: Teks menyebut “pembagian-pembagian” tetapi tidak secara eksplisit menyebut “karunia-karunia.” Pilihan utama menjaga keluasan ungkapan Yunani dan menghindari penambahan penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Allah pun turut memberikan kesaksian” menghubungkan klausa ini dengan kesaksian manusia pada ayat sebelumnya. “Melalui” menyatakan sarana secara alami. Bentuk ulang pada “keajaiban-keajaiban” dan “pembagian-pembagian” mempertahankan bentuk jamak tanpa membuat kalimat terlalu teknis.
