id: HEB.2.12
reference: Hebrews 2:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγων· Ἀπαγγελῶ τὸ ὄνομά σου τοῖς ἀδελφοῖς μου, ἐν μέσῳ ἐκκλησίας ὑμνήσω σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/012.yaml
  text: saying[a], “I will proclaim your name to my brothers[b]; in the midst of the assembly I will sing praise to you.”
translation:
  language: id
  text: dengan berkata, “Aku akan memberitakan nama-Mu kepada saudara-saudara-Ku[a]; di tengah-tengah jemaah[b] Aku akan menyanyikan pujian bagi-Mu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bentuk Yunani berarti “saudara-saudara lelaki,” tetapi dalam konteks sebutan keluarga ini dapat mencakup semua saudara seiman, baik laki-laki maupun perempuan.
    reason: lexical_alternative
  - marker: b
    text: Atau “perhimpunan” atau “jemaat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: dengan berkata
  rationale: Partisipel kini ini memperkenalkan kutipan dan meneruskan struktur kalimat dari ayat sebelumnya. “Dengan berkata” mempertahankan kaitan sintaksis itu tanpa menambahkan subjek yang tidak dinyatakan di sini.
- source_word: Ἀπαγγελῶ
  choice: Aku akan memberitakan
  rationale: Kata kerja ini menyatakan tindakan menyampaikan atau menyatakan secara terbuka. “Memberitakan” menjaga daya deklaratif dan corak khidmat kutipan.
- source_word: τὸ ὄνομά σου
  choice: nama-Mu
  rationale: Diterjemahkan secara langsung. Dalam pemakaian alkitabiah, “nama” dapat mencakup identitas dan sifat yang dinyatakan, tetapi makna itu tidak dieksplisitkan melebihi teks.
- source_word: τοῖς ἀδελφοῖς μου
  choice: kepada saudara-saudara-Ku
  rationale: “Saudara-saudara” adalah padanan Indonesia yang alami untuk bentuk jamak ἀδελφοί dan dapat berfungsi secara kolektif. Catatan kaki menjaga informasi bahwa bentuk Yunani secara gramatikal maskulin dan dalam konteks dapat mencakup seluruh keluarga orang percaya.
- source_word: ἐν μέσῳ
  choice: di tengah-tengah
  rationale: Padanan yang cukup harfiah ini jelas dalam bahasa Indonesia dan mempertahankan nada puitis kutipan.
- source_word: ἐκκλησίας
  choice: jemaah
  rationale: Dalam kutipan Mazmur ini, kata tersebut menunjuk pada umat yang sedang berkumpul. “Jemaah” mengungkapkan kumpulan orang yang beribadah tanpa harus membawa pengertian institusional yang lebih kemudian.
- source_word: ὑμνήσω
  choice: Aku akan menyanyikan pujian
  rationale: Kata kerja ini secara khusus mengacu pada pujian yang dinyanyikan. Frasa ini alami dan mempertahankan unsur musikalnya.
- source_word: σε
  choice: bagi-Mu
  rationale: Dalam konstruksi Indonesia “menyanyikan pujian bagi-Mu,” preposisi “bagi” menyatakan arah atau penerima pujian secara alami.
theological_decisions:
- issue: Cakupan ἀδελφοῖς sebagai sebutan kekeluargaan
  choice: saudara-saudara-Ku
  alternative: saudara-saudara lelaki-Ku; saudara-saudari-Ku
  rationale: Bentuk Yunani adalah jamak maskulin, tetapi dalam konteks keluarga umat beriman acuannya dapat bersifat inklusif. Padanan utama Indonesia dibiarkan wajar dan tidak memaksakan pembatasan gender; bentuk Yunani dan kemungkinan cakupannya dijelaskan dalam catatan.
- issue: Arti ἐκκλησία dalam kutipan Perjanjian Lama
  choice: jemaah
  alternative: jemaat; perhimpunan
  rationale: Kutipan ini membayangkan umat Allah yang berkumpul. “Jemaah” menjaga arti dasar tersebut tanpa secara otomatis menjadikannya istilah bagi lembaga gereja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kutipan yang puitis dipertahankan dengan “di tengah-tengah,” sedangkan “jemaah” dipilih untuk menekankan umat yang berkumpul. Huruf kapital pada pronomina terikat mengikuti kebiasaan ejaan teks keagamaan Indonesia dalam sapaan kepada Allah dan rujukan kepada Sang Anak sebagai penutur kutipan.
