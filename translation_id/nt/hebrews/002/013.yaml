base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/013.yaml
  text: And again[a], “I will put my trust in him.” And again, “Behold[d][c][b], I and the children whom God has given me.”
translation:
  language: id
  text: Dan lagi, “Aku akan menaruh kepercayaan kepada-Nya.”[a] Dan lagi, “Lihatlah, Aku dan anak-anak yang telah Allah berikan kepada-Ku.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Aku akan tetap percaya kepada-Nya” atau “Aku akan menaruh keyakinan kepada-Nya.”'
    reason: lexical_alternative
  - marker: b
    text: Pembicara tidak disebutkan dalam teks Yunani ayat ini; dalam konteksnya, Surat Ibrani menerapkan kutipan-kutipan ini kepada Sang Anak.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Dan lagi
  rationale: Mempertahankan rumusan pengantar kutipan yang ringkas tanpa menambahkan kata kerja seperti ‘Ia berkata’, yang tidak terdapat dalam teks Yunani.
- source_word: Ἐγὼ
  choice: Aku
  rationale: Pronomina eksplisit dipertahankan untuk mencerminkan penekanan suara orang pertama dalam kutipan.
- source_word: ἔσομαι πεποιθὼς ἐπ’ αὐτῷ
  choice: Aku akan menaruh kepercayaan kepada-Nya
  rationale: Konstruksi perifrasis dengan bentuk mendatang εἰμί dan partisip perfek πείθω menyatakan sikap percaya atau yakin yang mantap. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan orientasi mendatang.
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Penanda deiktis ini mempertahankan daya retoris kutipan dalam bahasa Indonesia modern yang wajar dan bermartabat.
- source_word: τὰ παιδία
  choice: anak-anak
  rationale: Dalam kutipan ini παιδία menunjuk kepada anak-anak dalam hubungan dengan sang pembicara; terjemahan umum ini tidak mempersempit usia secara tidak perlu.
- source_word: ἅ μοι ἔδωκεν ὁ θεός
  choice: yang telah Allah berikan kepada-Ku
  rationale: Kata penghubung ‘yang’ alami untuk orang maupun benda dalam bahasa Indonesia. ‘Telah ... berikan’ menyampaikan tindakan pemberian dengan relevansi kini, tanpa mengubah identitas pemberi atau penerima.
- source_word: ὁ θεός
  choice: Allah
  rationale: Padanan baku θεός dalam penerjemahan Alkitab bahasa Indonesia.
theological_decisions:
- issue: Suara kristologis dalam kutipan
  choice: Menyajikan kutipan sebagai ujaran orang pertama tanpa menambahkan identitas pembicara dalam teks utama.
  alternative: Menambahkan ‘Ia berkata’ atau ‘Mesias berkata’.
  rationale: Teks Yunani hanya memakai rumusan ‘dan lagi’. Konteks Surat Ibrani menerapkan kutipan-kutipan ini kepada Sang Anak, tetapi terjemahan tidak seharusnya memasukkan penjelasan itu ke dalam kata-kata ayat.
- issue: Kapitalisasi pronomina ilahi
  choice: Memakai ‘-Nya’ dan ‘-Ku’ sesuai kebiasaan ortografis Indonesia untuk rujukan ilahi, tanpa menyebut nama pembicara.
  alternative: Memakai ‘-nya’ dan ‘-ku’ agar identitas pembicara sepenuhnya dibiarkan pada konteks.
  rationale: Konteks terdekat menerapkan ucapan ini kepada Sang Anak dan rujukan ‘kepada-Nya’ kepada Allah. Kapitalisasi membantu keterbacaan menurut konvensi Indonesia, sedangkan catatan kaki tetap menjelaskan bahwa teks Yunani ayat ini sendiri tidak menyebut pembicara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Gaya kutipan dipertahankan tanpa menjadi kuno; ‘Lihatlah’ dipilih daripada ‘Sesungguhnya’ karena lebih langsung mencerminkan Ἰδοὺ. Penanda catatan kaki ditempatkan langsung setelah bagian yang diterangkan.
