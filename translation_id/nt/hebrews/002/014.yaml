id: HEB.2.14
reference: Hebrews 2:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐπεὶ οὖν τὰ παιδία κεκοινώνηκεν ⸂αἵματος καὶ σαρκός⸃, καὶ αὐτὸς παραπλησίως μετέσχεν τῶν αὐτῶν, ἵνα διὰ τοῦ θανάτου καταργήσῃ τὸν τὸ κράτος ἔχοντα τοῦ θανάτου, τοῦτ’ ἔστι τὸν διάβολον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/014.yaml
  text: Therefore[a], since the children share in flesh and blood, he himself likewise partook of the same things, so that through death he might nullify the one who has the power of death—that is, the devil[b],
translation:
  language: id
  text: Oleh karena itu, karena anak-anak itu mendapat bagian dalam darah dan daging[a], Ia sendiri juga mengambil bagian dalam hal-hal yang sama, supaya melalui kematian Ia membuat tidak berdaya dia yang memegang kuasa atas kematian, yaitu Iblis[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “darah dan daging”; ungkapan Indonesia yang lazim adalah “daging dan darah.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “meniadakan” atau “membinasakan.” Kata Yunaninya dapat berarti membuat tidak efektif, meniadakan, atau menghapuskan, dan tidak harus berarti memusnahkan keberadaannya.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπεὶ οὖν
  choice: Karena itu, sebab
  rationale: Mempertahankan daya simpulan οὖν sekaligus hubungan kausal ἐπεί, meskipun susunannya sengaja agak formal agar kedua unsur tetap tampak.
- source_word: τὰ παιδία
  choice: anak-anak itu
  rationale: Merujuk kembali kepada anak-anak dalam konteks sebelumnya tanpa menambahkan tafsiran tentang identitas mereka.
- source_word: κεκοινώνηκεν
  choice: mendapat bagian dalam
  rationale: Menyatakan partisipasi yang telah menghasilkan keadaan yang tetap berlaku; lebih wajar daripada mempertahankan bentuk perfek secara harfiah.
- source_word: αἵματος καὶ σαρκός
  choice: darah dan daging
  rationale: Mempertahankan urutan Yunani dan arti jasmani σάρξ, tanpa mengalihkannya menjadi konsep 'tabiat berdosa'.
- source_word: παραπλησίως
  choice: juga
  rationale: Dalam konstruksi 'Dia sendiri juga turut mengambil bagian', kata ini menyampaikan keserupaan partisipasi secara alami; unsur keserupaan diperjelas oleh 'dalam hal-hal yang sama'.
- source_word: μετέσχεν τῶν αὐτῶν
  choice: turut mengambil bagian dalam hal-hal yang sama
  rationale: Mempertahankan kesejajaran dengan partisipasi anak-anak sekaligus membedakan pilihan kata dari κοινωνέω.
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan tujuan secara jelas dan alami dalam bahasa Indonesia.
- source_word: διὰ τοῦ θανάτου
  choice: melalui kematian
  rationale: 'Menjaga fungsi instrumental διά: kematian merupakan sarana bagi tindakan tersebut.'
- source_word: καταργήσῃ
  choice: meniadakan kuasa
  rationale: Dalam konteks objek personal, frasa ini menyampaikan tindakan membuat tidak berdaya atau tidak efektif tanpa menyiratkan pemusnahan keberadaan Iblis.
- source_word: τὸν τὸ κράτος ἔχοντα τοῦ θανάτου
  choice: pihak yang memegang kuasa atas kematian
  rationale: Mengungkapkan κράτος sebagai kuasa atau kekuasaan dan mempertahankan konstruksi 'yang memegang' secara jelas.
- source_word: τοῦτ’ ἔστι
  choice: yaitu
  rationale: Penanda identifikasi yang ringkas dan baku dalam bahasa Indonesia.
- source_word: τὸν διάβολον
  choice: Iblis
  rationale: Sebutan personal yang mapan dalam bahasa Indonesia dan sesuai dengan pemakaian Perjanjian Baru.
theological_decisions:
- issue: Keikutsertaan Kristus dalam kondisi jasmani manusia
  choice: Dia sendiri juga turut mengambil bagian dalam hal-hal yang sama
  alternative: Dia juga memiliki kemanusiaan yang sama seperti mereka
  rationale: Pilihan ini menegaskan partisipasi yang nyata dalam darah dan daging, tetapi tidak memasukkan rumusan teologis yang lebih luas daripada pernyataan ayat.
- issue: Makna καταργήσῃ terhadap Iblis
  choice: meniadakan kuasa
  alternative: membinasakan; membuat tidak berdaya
  rationale: Kata kerja ini dapat berarti membuat tidak efektif, membatalkan, atau meniadakan. Terjemahan utama menghindari kesan bahwa keberadaan Iblis langsung dimusnahkan, sementara alternatif yang tradisional dicatat secara transparan.
- issue: Kuasa Iblis atas kematian
  choice: memegang kuasa atas kematian
  alternative: memiliki kekuasaan maut
  rationale: Terjemahan mempertahankan pernyataan teks tanpa menjelaskan asal, batas, atau sifat kuasa tersebut secara sistematis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Urutan sumber 'darah dan daging' dipertahankan dengan catatan tentang idiom Indonesia. Klausa panjang dan koma akhir dipertahankan karena ayat ini berlanjut ke ayat berikutnya.
