  naturalness: “Karena itu, sebab” terasa kaku dalam bahasa Indonesia modern. Selain itu, “Dia sendiri juga turut mengambil bagian” mengandung penumpukan penanda aditif. Revisi memakai susunan yang lebih wajar tanpa mengurangi penekanan sumber.
