  yaml_path: translation/nt/hebrews/002/018.yaml
  text: For because he himself suffered when he was tempted[a], he is able to help those who are being tempted.
translation:
  language: id
  text: Sebab Ia sendiri telah menderita ketika dicobai[a], Ia sanggup menolong mereka yang sedang dicobai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “diuji” dalam kedua kemunculannya: “Sebab Ia sendiri telah menderita ketika diuji, Ia sanggup menolong mereka yang sedang diuji.” Kata kerja Yunani ini dapat berarti “mencobai” atau “menguji,” bergantung pada konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: karena
  rationale: Ungkapan ini berfungsi secara kausal, yaitu “karena/dalam hal bahwa,” dan memperkenalkan dasar bagi kesanggupan Sang Anak untuk menolong.
- source_word: γὰρ
  choice: sebab
  rationale: Partikel ini menghubungkan ayat dengan penjelasan sebelumnya. Gabungan “Sebab, karena” mempertahankan fungsi penjelas γὰρ sekaligus nuansa kausal ἐν ᾧ tanpa menghilangkan salah satunya.
- source_word: πέπονθεν
  choice: telah menderita
  rationale: Bentuk perfektum menunjuk pada penderitaan yang sungguh telah dialami dan tetap relevan bagi kesanggupan-Nya sekarang.
- source_word: αὐτὸς
  choice: Ia sendiri
  rationale: Mempertahankan penekanan bahwa Ia secara pribadi mengalami penderitaan tersebut.
- source_word: πειρασθείς
  choice: ketika dicobai
  rationale: Bentuk partisip diterjemahkan secara alami sebagai keadaan yang menyertai penderitaan-Nya. Kata Yunani dapat berarti “dicobai” atau “diuji”; pilihan utama mempertahankan hubungan dengan Ibrani 4:15, sedangkan alternatif dicatat dalam catatan kaki.
- source_word: δύναται
  choice: Ia sanggup
  rationale: “Sanggup” menyatakan kemampuan secara jelas dan bermartabat serta lebih alami daripada konstruksi yang lebih panjang.
- source_word: τοῖς πειραζομένοις
  choice: mereka yang sedang dicobai
  rationale: Partisip kini menunjukkan orang-orang yang tengah mengalami pencobaan atau pengujian; “sedang” mempertahankan aspek berlangsung.
- source_word: βοηθῆσαι
  choice: menolong
  rationale: Kata ini berarti menolong atau datang memberi pertolongan; “menolong” jelas, alami, dan tepat dalam konteks.
theological_decisions:
- issue: Makna bahasa πειράζω ketika diterapkan kepada Yesus dan orang percaya
  choice: dicobai
  alternative: diuji
  rationale: “Dicobai” mempertahankan pengertian Perjanjian Baru yang umum dan kaitan dekat dengan Ibrani 4:15, tanpa menyiratkan bahwa Yesus menyerah kepada dosa. Karena kata Yunani juga dapat berarti “diuji,” kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. “Ia” digunakan untuk rujukan kepada Sang Anak. Susunan “Sebab, karena” agak bertanda tetapi sengaja mempertahankan kedua unsur penghubung Yunani; selebihnya kalimat dibuat langsung dan mudah dipahami.
