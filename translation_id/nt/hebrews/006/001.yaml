  source_fidelity: Makna pokoknya setia pada Yunani. Namun, susunan “marilah kita meninggalkan ... dan dibawa maju” tidak memadankan partisip aoris ἀφέντες dengan baik dalam bahasa Indonesia dan menghasilkan koordinasi yang janggal. “Setelah meninggalkan” menyatakan gerak beranjak dari pengajaran dasar menuju kedewasaan, selaras dengan metafora “tidak meletakkan kembali dasar.”
  naturalness: 'Terjemahan revisi memakai struktur ajakan yang baku dan alami: “setelah meninggalkan ..., marilah kita dibawa menuju ...”. Frasa “dibawa maju menuju” dihindari karena bertumpuk; “dibawa menuju” sudah menyampaikan bentuk pasif dan arah gerak.'
  terminology: “Mesias,” “kedewasaan,” “pertobatan,” “perbuatan-perbuatan mati,” dan “iman kepada Allah” tepat serta mempertahankan metafora dan ambiguitas yang relevan. “Dasar pertobatan ... dan iman ...” lebih langsung mencerminkan genitif-genitif yang menerangkan “dasar.”
