  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διὸ ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον ἐπὶ τὴν τελειότητα φερώμεθα, μὴ πάλιν θεμέλιον καταβαλλόμενοι μετανοίας ἀπὸ νεκρῶν ἔργων, καὶ πίστεως ἐπὶ θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/001.yaml
  text: Therefore[a], leaving the elementary message about the Messiah, let us be carried on to maturity, not laying again a foundation of repentance from dead works and of faith toward God[d][c][b],
translation:
  language: id
  text: Karena itu, setelah meninggalkan ajaran dasar tentang Mesias[a], marilah kita dibawa menuju kedewasaan,[b] tanpa meletakkan kembali dasar pertobatan dari perbuatan-perbuatan mati dan iman kepada Allah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ajaran awal tentang Mesias.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menuju kelengkapan” atau “menuju kesempurnaan.” Secara lebih harfiah, bentuk Yunani “marilah kita dibawa” bersifat pasif; dapat juga diterjemahkan “marilah kita maju.”
    reason: lexical_alternative
  - marker: c
    text: Atau “kepercayaan kepada Allah” atau “iman yang diarahkan kepada Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari pembahasan sebelumnya dan mengantar kepada ajakan.
- source_word: ἀφέντες
  choice: meninggalkan
  rationale: Mempertahankan gagasan beranjak dari pokok dasar sebagai fokus, bukan menolak atau membuangnya.
- source_word: τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον
  choice: ajaran dasar tentang Mesias
  rationale: Ungkapan genitif ini menunjuk pada pengajaran permulaan mengenai Mesias; 'ajaran dasar' alami dalam bahasa Indonesia dan sesuai dengan kontras terhadap kedewasaan.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar dalam konteks ini.
- source_word: ἐπὶ τὴν τελειότητα
  choice: menuju kedewasaan
  rationale: Dalam konteks perkembangan melampaui pengajaran dasar, τελειότης menunjuk pada kematangan atau kelengkapan, bukan secara niscaya kesempurnaan tanpa dosa.
- source_word: φερώμεθα
  choice: marilah kita ... dibawa maju
  rationale: Mempertahankan bentuk pasif Yunani sekaligus menghasilkan ajakan yang dapat dipahami dalam bahasa Indonesia.
- source_word: θεμέλιον καταβαλλόμενοι
  choice: meletakkan lagi dasar
  rationale: Mempertahankan metafora pembangunan dan hubungan dengan pengajaran mendasar.
- source_word: μετανοίας ἀπὸ νεκρῶν ἔργων
  choice: pertobatan dari perbuatan-perbuatan yang mati
  rationale: '''Pertobatan'' merupakan padanan baku dan tepat bagi μετάνοια, sedangkan ''perbuatan-perbuatan yang mati'' mempertahankan metafora serta ambiguitas ungkapan asli.'
- source_word: πίστεως ἐπὶ θεόν
  choice: iman kepada Allah
  rationale: Konstruksi ἐπί dengan akusatif memiliki nuansa arah; 'kepada Allah' mempertahankannya secara alami.
theological_decisions:
- issue: Apakah meninggalkan ajaran dasar berarti menolak ajaran tentang Mesias
  choice: Beranjak dari ajaran dasar sebagai fokus untuk maju, bukan menolaknya
  alternative: Meninggalkan atau menolak berita tentang Mesias sama sekali
  rationale: Klausa berikutnya tentang tidak meletakkan dasar lagi menunjukkan perkembangan di atas dasar yang sudah ada.
- issue: Makna τελειότης
  choice: kedewasaan
  alternative: kesempurnaan atau kelengkapan
  rationale: Konteks membandingkan pengajaran dasar dengan perkembangan yang lebih penuh; 'kedewasaan' menyampaikan kontras itu tanpa memasukkan gagasan kesempurnaan mutlak.
- issue: Diatesis φερώμεθα
  choice: 'Bentuk pasif dipertahankan: ''dibawa maju'''
  alternative: 'Bentuk aktif yang lebih idiomatis: ''maju'' atau ''melangkah maju'''
  rationale: Bentuk pasif sumber layak dipertahankan karena dapat menyiratkan bahwa kemajuan tidak digambarkan semata-mata sebagai usaha diri, tanpa menentukan siapa pelakunya.
- issue: Makna 'perbuatan-perbuatan yang mati'
  choice: Metafora dipertahankan tanpa penjelasan dalam teks utama
  alternative: Perbuatan yang sia-sia atau perbuatan yang membawa kepada kematian
  rationale: Teks Yunani memungkinkan beberapa nuansa; terjemahan literal yang wajar tidak menutup ambiguitas teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ajakan dibuat alami, sementara bentuk pasif φερώμεθα dan metafora 'perbuatan-perbuatan yang mati' dipertahankan. Semua penanda catatan kaki muncul dalam teks utama.
