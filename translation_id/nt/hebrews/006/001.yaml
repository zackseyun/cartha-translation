    issue: Koordinasi “marilah kita meninggalkan ... dan dibawa maju” janggal dan tidak jelas secara sintaksis.
    rationale: “Meninggalkan” adalah tindakan yang dilakukan subjek, sedangkan “dibawa” pasif; keduanya tidak dapat dikoordinasikan secara lancar setelah “marilah kita.” Partisip ἀφέντες lebih baik diungkapkan sebagai anak kalimat pendahuluan.
  - severity: low
