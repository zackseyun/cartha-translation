  text: ἣν ὡς ἄγκυραν ἔχομεν τῆς ψυχῆς, ⸀ἀσφαλῆ τε καὶ βεβαίαν καὶ εἰσερχομένην εἰς τὸ ἐσώτερον τοῦ καταπετάσματος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/019.yaml
  text: We have this as an anchor of the soul[a], both secure and firm, and entering into the inner place behind the curtain,
translation:
  language: id
  text: Pengharapan itu kita miliki sebagai sauh bagi jiwa, yaitu sauh yang aman dan teguh serta masuk ke bagian terdalam di balik tabir[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ke ruang di sebelah dalam tabir.”'
    reason: alternatif leksikal yang lebih dekat dengan bentuk harfiah Yunani; dalam konteks tempat kudus, ungkapan ini menunjuk ruang di balik tabir.
lexical_decisions:
- source_word: ἣν
  choice: Pengharapan itu
  rationale: Kata ganti relatif feminin ini merujuk kembali kepada pengharapan dalam ayat sebelumnya. Menyebutkan acuannya secara eksplisit menghasilkan bahasa Indonesia yang alami dan menjaga hubungan antarayat.
- source_word: ὡς ἄγκυραν
  choice: sebagai sauh
  rationale: ὡς memperkenalkan perbandingan, sedangkan 'sauh' mempertahankan metafora nautis secara ringkas dan lazim dalam gaya Alkitab Indonesia.
- source_word: ἔχομεν
  choice: kita miliki
  rationale: Menyampaikan bentuk kini indikatif secara langsung dan alami; susunan ini juga mengaitkan pengharapan dengan fungsi metaforisnya sebagai sauh.
- source_word: τῆς ψυχῆς
  choice: bagi jiwa
  rationale: Genitif menyatakan hubungan sauh dengan jiwa. 'Bagi jiwa' lebih alami dalam metafora Indonesia daripada 'dari jiwa' dan tidak mempersempit ψυχή menjadi sekadar keadaan psikologis.
- source_word: ἀσφαλῆ
  choice: aman
  rationale: Menyatakan keamanan atau ketidakmungkinan mendatangkan kegagalan dalam citra sauh, sambil tetap dibedakan dari βεβαίαν.
- source_word: τε καὶ
  choice: yang ... dan ... serta
  rationale: Koordinasi kualitas-kualitas sauh dipertahankan secara alami dalam bahasa Indonesia; 'aman dan teguh' menyatukan pasangan adjektiva, lalu 'serta' menghubungkan partisip berikutnya.
- source_word: βεβαίαν
  choice: teguh
  rationale: Mengungkapkan kemantapan dan keterandalan sauh serta mempertahankan perbedaan makna dari ἀσφαλῆ, 'aman'.
- source_word: εἰσερχομένην
  choice: masuk
  rationale: Partisip ini meneruskan gambaran sauh. Klausa relatif tersirat melalui 'yang' menghasilkan susunan Indonesia yang lancar tanpa menjelaskan bagaimana metafora itu bekerja.
- source_word: εἰς τὸ ἐσώτερον
  choice: ke ruang di sebelah dalam
  rationale: Adjektiva komparatif substantival menunjuk kawasan bagian dalam. 'Ruang di sebelah dalam' jelas tanpa langsung menyamakannya dengan istilah teknis tertentu.
- source_word: τοῦ καταπετάσματος
  choice: tabir
  rationale: καταπέτασμα adalah tirai pemisah tempat kudus. 'Tabir' mempertahankan citra tempat ibadah dan cukup dikenal dalam bahasa Indonesia, sementara hubungan ruangnya sengaja dibiarkan mengikuti konstruksi genitif Yunani.
theological_decisions:
- issue: Gambaran tempat kudus dan hubungan ruang dengan καταπέτασμα
  choice: ruang di sebelah dalam tabir
  alternative: ruang di balik tabir
  rationale: Bentuk Yunani secara harfiah menyebut 'bagian dalam dari tabir' dan dalam konteks tempat kudus menunjuk ruang pada sisi dalam atau di balik tabir. Teks utama mempertahankan ungkapan yang dekat dengan sumber, sedangkan catatan kaki menjelaskan alternatif spasial tanpa menentukan lebih jauh referen surgawinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Sauh' dipilih karena merupakan istilah Indonesia yang ringkas untuk jangkar kapal dan mempertahankan metafora tradisional; 'tabir' menjaga citra kultis tanpa uraian denominatif. Tanda koma penutup dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
