  text: βαπτισμῶν ⸀διδαχὴν ἐπιθέσεώς τε χειρῶν, ἀναστάσεώς ⸀τε νεκρῶν καὶ κρίματος αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/002.yaml
  text: instruction about washings[a], the laying on of hands, the resurrection of the dead, and eternal judgment.
translation:
  language: id
  text: ajaran tentang berbagai pembasuhan[a], penumpangan tangan, kebangkitan orang mati, dan penghakiman kekal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ajaran tentang baptisan.” Bentuk jamak dalam bahasa Yunani dapat merujuk lebih luas pada pembasuhan ritual, bukan hanya pada baptisan Kristen.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισμῶν
  choice: berbagai pembasuhan
  rationale: Bentuk jamaknya dipertahankan melalui 'berbagai', sedangkan 'pembasuhan' dapat mencakup pembasuhan ritual secara luas dan tidak membatasi maknanya pada baptisan Kristen.
- source_word: διδαχὴν
  choice: ajaran
  rationale: Kata ini melanjutkan daftar hal-hal mendasar dari ayat sebelumnya; 'ajaran tentang' merupakan ungkapan Indonesia yang alami untuk menaungi unsur-unsur berikutnya.
- source_word: ἐπιθέσεώς τε χειρῶν
  choice: penumpangan tangan
  rationale: Ini adalah padanan Indonesia yang lazim, jelas, dan langsung bagi praktik yang disebut dalam frasa Yunani.
- source_word: ἀναστάσεώς τε νεκρῶν
  choice: kebangkitan orang mati
  rationale: Padanan ini alami dalam bahasa Indonesia dan mempertahankan daya kolektif νεκρῶν tanpa menjelaskan lebih jauh siapa yang dibangkitkan.
- source_word: κρίματος αἰωνίου
  choice: penghakiman kekal
  rationale: Padanan ini mempertahankan makna 'penghakiman', bukan mempersempitnya menjadi penghukuman, serta menyampaikan αἰωνίου secara lugas.
- source_word: τε ... τε καὶ
  choice: '..., ..., dan ...'
  rationale: Partikel-partikel penghubung Yunani membentuk daftar; koordinasi biasa dalam bahasa Indonesia menyampaikan strukturnya secara alami.
theological_decisions:
- issue: Makna βαπτισμῶν dalam daftar ajaran dasar
  choice: Diterjemahkan 'berbagai pembasuhan'.
  alternative: '''berbagai baptisan'' atau ''baptisan-baptisan'' sebagai rujukan kepada baptisan Kristen'
  rationale: Bentuk jamak dan pemakaian leksikalnya memungkinkan, dan kemungkinan mendukung, arti pembasuhan ritual yang lebih luas. Catatan kaki mempertahankan kemungkinan 'baptisan' tanpa memasukkan pembacaan sakramental denominasi tertentu ke dalam teks utama.
- issue: Cakupan κρίματος αἰωνίου
  choice: Diterjemahkan 'penghakiman kekal' tanpa membatasinya pada penghukuman.
  alternative: '''penghukuman kekal'''
  rationale: Teks Yunani menyebut penghakiman, bukan secara khusus penghukuman; padanan ini mempertahankan keluasan dan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Frasa ini sengaja tetap berupa kelanjutan daftar dari ayat sebelumnya. 'Berbagai pembasuhan' mempertahankan bentuk jamak secara alami, dan penanda catatan kaki [a] dicantumkan langsung setelah frasa terkait.
