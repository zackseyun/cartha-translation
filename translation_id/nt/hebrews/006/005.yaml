  text: καὶ καλὸν γευσαμένους θεοῦ ῥῆμα δυνάμεις τε μέλλοντος αἰῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/005.yaml
  text: and have tasted the good word of God and the powers of the coming age[b][a],
translation:
  language: id
  text: dan telah mengecap firman Allah yang baik serta kuasa-kuasa dari zaman yang akan datang[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mukjizat-mukjizat” atau “perbuatan-perbuatan penuh kuasa.”
    reason: lexical_alternative
  - marker: b
    text: Atau “zaman yang akan tiba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: yang baik
  rationale: Kata καλόν menerangkan ῥῆμα dan paling wajar menyatakan bahwa firman itu baik, bermanfaat, atau luhur tanpa mempersempit maknanya.
- source_word: γευσαμένους
  choice: telah mengecap
  rationale: Pilihan ini mempertahankan metafora γεύομαι dan kesinambungan bentuk partisip dengan rangkaian pada ayat sebelumnya; 'telah' sesuai dengan konteks sintaksisnya.
- source_word: θεοῦ ῥῆμα
  choice: firman Allah
  rationale: Ungkapan ini alami dan bermartabat dalam bahasa Indonesia, serta menyampaikan perkataan yang berasal dari atau merupakan milik Allah.
- source_word: δυνάμεις
  choice: kuasa-kuasa
  rationale: Bentuk jamak dipertahankan dan cakupan maknanya dibiarkan terbuka antara kuasa, perbuatan penuh kuasa, dan mukjizat.
- source_word: τε
  choice: serta
  rationale: Kata 'serta' menghubungkan objek ini dengan yang sebelumnya secara lancar dalam rangkaian kalimat.
- source_word: μέλλοντος αἰῶνος
  choice: zaman yang akan datang
  rationale: Ungkapan ini mempertahankan orientasi eskatologis frasa Yunani dan tetap jelas bagi pembaca Indonesia modern.
theological_decisions:
- issue: Makna 'mengecap' dalam konteks bagian peringatan
  choice: Mempertahankan 'telah mengecap' tanpa menjelaskan kadar pengalaman itu.
  alternative: '''telah mengalami'' atau ''hanya mencicipi'''
  rationale: Metafora sumber tidak memastikan apakah pengalaman tersebut harus dipahami sebagai partisipasi penuh atau dangkal; terjemahan tidak seharusnya menyelesaikan perdebatan teologis itu.
- issue: Cakupan makna δυνάμεις dalam konteks eskatologis
  choice: Menerjemahkannya sebagai 'kuasa-kuasa'.
  alternative: '''mukjizat-mukjizat'' atau ''perbuatan-perbuatan penuh kuasa'''
  rationale: Pilihan ini mempertahankan kemungkinan bahwa yang dimaksud ialah manifestasi ajaib maupun kuasa ilahi dalam arti yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ayat ini merupakan kelanjutan sintaksis dari ayat sebelumnya, sehingga diawali dengan 'dan' dan diakhiri koma. 'Mengecap' mempertahankan metafora sumber; 'kuasa-kuasa' sengaja mempertahankan ambiguitas leksikal.
