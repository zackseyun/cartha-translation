- from: Namun, kami ingin agar kamu masing-masing terus menunjukkan kesungguhan yang sama, sehingga pengharapanmu menjadi penuh kepastian sampai pada akhirnya.[a][b]
  to: Dan kami menginginkan agar kamu masing-masing menunjukkan kesungguhan yang sama untuk memperoleh kepastian penuh mengenai pengharapan itu sampai akhir.[a][b]
  rationale: Revisi memulihkan struktur tujuan dari πρός serta relasi genitif antara “kepastian penuh” dan “pengharapan,” sambil mempertahankan ambiguitas yang wajar mengenai nuansa subjektif atau objektif dari πληροφορία. Penanda catatan kaki tetap ditempatkan pada unsur yang dijelaskan dan urutannya konsisten.
