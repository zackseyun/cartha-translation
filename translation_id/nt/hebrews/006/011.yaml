  yaml_path: translation/nt/hebrews/006/011.yaml
  text: And we desire each one of you to show the same diligence for the full assurance of hope until the end[b][a],
translation:
  language: id
  text: Dan kami menginginkan agar kamu masing-masing menunjukkan kesungguhan yang sama untuk memperoleh kepastian penuh mengenai pengharapan itu sampai akhir.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keyakinan penuh mengenai pengharapan itu.” Istilah Yunani dapat menunjuk pada kepenuhan kepastian atau keyakinan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “hingga akhir.” Frasa ini menekankan ketekunan sampai tuntas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμοῦμεν
  choice: kami ingin
  rationale: Menyampaikan keinginan pastoral yang sungguh-sungguh secara alami tanpa memberi kesan hasrat emosional yang berlebihan.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan ringan dari keyakinan pada ayat sebelumnya kepada dorongan yang diperbarui; tidak dimaksudkan sebagai pertentangan tajam.
- source_word: ἕκαστον ὑμῶν
  choice: kamu masing-masing
  rationale: Mempertahankan tekanan distributif bahwa nasihat ini berlaku kepada setiap anggota komunitas.
- source_word: τὴν αὐτὴν
  choice: yang sama
  rationale: Merujuk kembali pada kesungguhan yang telah tampak dalam kasih dan pelayanan mereka.
- source_word: ἐνδείκνυσθαι
  choice: terus menunjukkan
  rationale: Kata kerja berarti memperlihatkan atau membuktikan suatu kualitas. Unsur 'terus' menyatakan tindakan berkelanjutan yang dituntut hingga akhir dalam konteks ayat.
- source_word: σπουδὴν
  choice: kesungguhan
  rationale: Mencakup ketekunan aktif, kerajinan, dan perhatian serius; lebih alami daripada 'kerajinan' untuk kualitas sikap dalam konteks ini.
- source_word: πρὸς τὴν πληροφορίαν τῆς ἐλπίδος
  choice: sehingga pengharapanmu menjadi penuh kepastian
  rationale: πρός menyatakan sasaran atau hasil yang dituju. Susunan ini alami dalam bahasa Indonesia serta tetap membuka hubungan antara kesungguhan dan kepastian pengharapan.
- source_word: πληροφορίαν
  choice: penuh kepastian
  rationale: Menunjukkan kepenuhan keyakinan atau kepastian tanpa menentukan secara sempit apakah tekanannya terutama subjektif atau objektif.
- source_word: ἐλπίδος
  choice: pengharapanmu
  rationale: Menerjemahkan gagasan pengharapan yang dimiliki para pembaca; pronomina tersirat ditambahkan demi kejelasan idiomatis dalam bahasa Indonesia.
- source_word: ἄχρι τέλους
  choice: sampai pada akhirnya
  rationale: Mempertahankan daya temporal frasa dan tekanannya pada ketekunan hingga penyelesaian.
theological_decisions:
- issue: Arti 'kepastian penuh dari pengharapan' dalam hubungannya dengan ketekunan
  choice: Diterjemahkan sebagai pengharapan yang menjadi penuh kepastian dan bertahan sampai akhir, tanpa memasukkannya ke dalam sistem doktrinal tertentu.
  alternative: Frasa dapat dipahami terutama sebagai kepastian batin sepenuhnya mengenai keselamatan, atau sebagai realisasi penuh dari janji yang diharapkan.
  rationale: Bahasa Yunani memungkinkan tumpang tindih antara keyakinan subjektif dan kepastian yang melekat pada pengharapan kepada janji Allah. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pastoral yang bermartabat. Bentuk 'kamu masing-masing' menjaga sapaan jamak sekaligus tekanan pada setiap orang. Kedua penanda catatan kaki dicantumkan dalam teks utama sesuai urutan penjelasannya.
