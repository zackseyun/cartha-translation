id: HEB.6.15
reference: Hebrews 6:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οὕτως μακροθυμήσας ἐπέτυχεν τῆς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/015.yaml
  text: And so[a], after waiting patiently, he obtained the promise.
translation:
  language: id
  text: Demikianlah, setelah menanti dengan sabar, Abraham memperoleh janji itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menerima apa yang dijanjikan.” Secara lebih harfiah, teks Yunani berbunyi “memperoleh janji itu.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ οὕτως
  choice: Demikianlah
  rationale: Menghubungkan ayat ini dengan tindakan Allah dan respons Abraham dalam konteks sebelumnya serta menyatakan hasil atau cara secara alami dalam bahasa Indonesia.
- source_word: μακροθυμήσας
  choice: setelah menanti dengan sabar
  rationale: Partisip aoris ini menggambarkan kesabaran dalam jangka waktu panjang. Ungkapan temporal ini alami dan sesuai dengan konteks Abraham yang menantikan penggenapan.
- source_word: ἐπέτυχεν
  choice: memperoleh
  rationale: Menyatakan bahwa Abraham berhasil mencapai atau mendapatkan sesuatu, tanpa dengan sendirinya menentukan bahwa seluruh isi janji telah tergenapi.
- source_word: τῆς ἐπαγγελίας
  choice: janji itu
  rationale: Mempertahankan nomina 'janji' dan kaitan leksikalnya dengan konteks, alih-alih menafsirkannya langsung sebagai hal yang dijanjikan.
- source_word: implicit subject
  choice: Abraham
  rationale: Subjek tersiratnya jelas dari ayat sebelumnya; penyebutan nama diperlukan agar kalimat bahasa Indonesia berdiri alami dan tidak ambigu.
theological_decisions:
- issue: Apakah frasa ἐπέτυχεν τῆς ἐπαγγελίας berarti Abraham menerima seluruh penggenapan janji atau memperoleh janji tersebut.
  choice: memperoleh janji itu
  alternative: menerima apa yang dijanjikan
  rationale: Terjemahan utama mempertahankan bentuk Yunani dan tidak menegaskan penggenapan penuh, sehingga ketegangan dengan pembahasan lain dalam Surat Ibrani tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. 'Demikianlah' lebih alami daripada 'dan demikian' pada awal kalimat; nama Abraham dieksplisitkan dari konteks.
