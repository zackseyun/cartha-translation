source:
  edition: SBLGNT
  text: καὶ παραπεσόντας, πάλιν ἀνακαινίζειν εἰς μετάνοιαν, ἀνασταυροῦντας ἑαυτοῖς τὸν υἱὸν τοῦ θεοῦ καὶ παραδειγματίζοντας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/006.yaml
  text: and having fallen away[a], to renew them again to repentance[b], since they are crucifying again for themselves the Son of God and exposing him to public shame.
translation:
  language: id
  text: dan yang telah murtad[a], untuk dipulihkan kembali kepada pertobatan,[b] sebab mereka menyalibkan lagi Anak Allah bagi diri mereka sendiri dan mempermalukan-Nya di depan umum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah menyimpang.” Kata kerja Yunani ini dapat menunjuk pada tindakan berpaling yang serius atau kemurtadan.
    reason: lexical_alternative
  - marker: b
    text: Atau “selama mereka menyalibkan lagi Anak Allah bagi diri mereka sendiri dan mempermalukan-Nya di depan umum.” Partisip-partisip Yunani dapat dipahami sebagai tindakan yang berlangsung bersamaan, bukan hanya sebagai penjelasan sebab.
    reason: alternative_reading
lexical_decisions:
- source_word: παραπεσόντας
  choice: yang telah murtad
  rationale: Partisip aoris ini menunjuk pada tindakan berpaling yang serius. “Murtad” menyampaikan bobot konteks dengan ringkas, sementara catatan kaki menyediakan padanan yang lebih harfiah.
- source_word: πάλιν ἀνακαινίζειν
  choice: untuk kembali diperbarui
  rationale: πάλιν menyatakan pengulangan, sedangkan infinitif pasif dalam konstruksi konteks berarti membawa mereka kembali kepada keadaan yang diperbarui. Susunan ini alami dalam bahasa Indonesia dan tetap bergantung secara sintaksis pada ayat sebelumnya.
- source_word: εἰς μετάνοιαν
  choice: sehingga bertobat
  rationale: εἰς menyatakan arah atau hasil, dan μετάνοια dalam konteks ini paling alami diterjemahkan dengan verba Indonesia “bertobat” tanpa mereduksinya menjadi perubahan pikiran semata.
- source_word: ἀνασταυροῦντας ἑαυτοῖς
  choice: sebab bagi diri mereka sendiri mereka menyalibkan lagi
  rationale: Partisip kini dapat menjelaskan keadaan atau alasan. “Bagi diri mereka sendiri” mempertahankan datif refleksif ἑαυτοῖς tanpa menentukan secara berlebihan nuansanya.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: Anak Allah
  rationale: Ini adalah padanan baku dan langsung bagi gelar kristologis tersebut.
- source_word: παραδειγματίζοντας
  choice: mempermalukan-Nya di depan umum
  rationale: Verba ini menggambarkan tindakan menjadikan seseorang tontonan yang mendatangkan aib; terjemahan ini mempertahankan unsur publik dan penghinaan.
theological_decisions:
- issue: Ketergantungan sintaksis pada Ibrani 6:4–5
  choice: Ayat dimulai dengan “dan” serta tidak mengulang “mustahil,” sehingga tetap merupakan kelanjutan kalimat sebelumnya.
  alternative: Mengulang secara eksplisit “mustahil ... memperbarui kembali.”
  rationale: Teks Yunani ayat ini bergantung pada pernyataan ketidakmungkinan dalam konteks sebelumnya. Mempertahankan ketergantungan itu menghindari penambahan yang tidak terdapat dalam ayat ini.
- issue: Sifat kemurtadan
  choice: “yang telah murtad,” tanpa menjelaskan status keselamatan orang-orang tersebut menurut sistem teologis tertentu.
  alternative: “yang telah menyimpang” atau “yang telah jatuh.”
  rationale: παραπίπτω menyampaikan tindakan berpaling yang serius, tetapi teks tidak menyelesaikan perdebatan teologis kemudian tentang ketekunan dan hilangnya keselamatan.
- issue: Hubungan partisip ἀνασταυροῦντας dan παραδειγματίζοντας dengan pembaruan
  choice: Teks utama memakai hubungan penjelas/kausal, “sebab,” dengan catatan mengenai kemungkinan hubungan temporal.
  alternative: “selama mereka menyalibkan lagi ... dan mempermalukan-Nya.”
  rationale: Partisip-partisip itu dapat menerangkan alasan ketidakmungkinan tersebut, tetapi secara tata bahasa juga dapat dipahami sebagai keadaan yang berlangsung bersamaan. Ambiguitas ini dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ayat sengaja tetap menjadi kelanjutan dari ayat sebelumnya. Kapitalisasi pronomina “-Nya” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Kristus.
