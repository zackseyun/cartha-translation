  naturalness: “Tanah yang menghasilkan semak duri dan rumput duri” lebih langsung, baku, dan alami untuk gambaran pertanian daripada “Namun, jika tanah itu menghasilkan…”. Pengulangan “tanah itu” sebelum klausa akhir tidak diperlukan dan membuat kalimat lebih berat.
  terminology: “Semak duri dan rumput duri” membedakan ἀκάνθας dan τριβόλους dengan istilah yang lazim serta mudah dipahami. “Tidak berguna” tepat dalam konteks tanah; catatan “ditolak” tetap berguna sebagai alternatif bagi ἀδόκιμος. Istilah “kutuk” dan gambaran “dibakar” dipertahankan tanpa penafsiran tambahan.
