  text: ἐκφέρουσα δὲ ἀκάνθας καὶ τριβόλους ἀδόκιμος καὶ κατάρας ἐγγύς, ἧς τὸ τέλος εἰς καῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/008.yaml
  text: But if it bears thorns and thistles[a], it is worthless and near to being cursed, and its end is for burning.
translation:
  language: id
  text: Namun, tanah yang menghasilkan semak duri dan rumput duri tidak berguna[a] dan hampir terkena kutuk; akhirnya akan dibakar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: ditolak.'
    reason: Alternatif leksikal bagi ἀδόκιμος yang mempertahankan nuansa gagal dalam pengujian atau tidak diterima.
lexical_decisions:
- source_word: ἐκφέρουσα
  choice: menghasilkan
  rationale: Partisipel kini feminin tunggal melanjutkan subjek 'tanah' dari ayat sebelumnya. 'Menghasilkan' alami dalam gambaran pertanian dan menyampaikan hasil yang terus muncul.
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan dengan tanah subur dalam ayat 7.
- source_word: ἀκάνθας καὶ τριβόλους
  choice: semak berduri dan rumput berduri
  rationale: Membedakan dua jenis tumbuhan pengganggu berduri dalam gambaran pertanian, dengan bahasa Indonesia yang jelas dan umum.
- source_word: ἀδόκιμος
  choice: tidak berguna
  rationale: Dalam konteks tanah pertanian, istilah ini menyatakan bahwa tanah tersebut gagal terbukti berguna. Alternatif 'ditolak' dipertahankan dalam catatan kaki karena juga merupakan arti leksikal yang sah.
- source_word: κατάρας ἐγγύς
  choice: hampir terkena kutuk
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa kutuk sudah dekat tanpa menyatakan bahwa kutuk itu telah terjadi.
- source_word: ἧς τὸ τέλος
  choice: akhirnya tanah itu
  rationale: Pronomina relatif feminin merujuk kepada tanah yang tersirat dari ayat sebelumnya. Pengulangan 'tanah itu' mencegah ketaksaan dalam bahasa Indonesia.
- source_word: εἰς καῦσιν
  choice: akan dibakar
  rationale: Menyampaikan arah atau hasil akhir berupa pembakaran secara alami, tanpa menambahkan penafsiran khusus tentang hakikat penghukuman.
theological_decisions:
- issue: Apakah subjek yang tersirat perlu dinyatakan sebagai tanah
  choice: Menyebut 'tanah itu' secara eksplisit
  alternative: Memakai 'itu' saja tanpa mengulang 'tanah'
  rationale: Bahasa Yunani melanjutkan kata feminin untuk tanah dari ayat 7. Dalam bahasa Indonesia, penyebutan eksplisit menjaga kesinambungan metafora dan memperjelas rujukan tanpa mengubah makna.
- issue: Kekuatan makna ἀδόκιμος
  choice: Memakai 'tidak berguna' dalam teks utama dan mencatat 'ditolak' sebagai alternatif
  alternative: ditolak
  rationale: Konteks langsung menilai kegunaan tanah, sedangkan 'ditolak' dapat membawa tekanan teologis yang lebih kuat. Catatan kaki mempertahankan ambiguitas leksikal yang asli.
- issue: Apakah εἰς καῦσιν harus dijelaskan sebagai penghukuman terakhir
  choice: Mempertahankan gambaran bahwa tanah akan dibakar
  alternative: akan dihukum dengan api
  rationale: Teks memakai metafora pertanian dan tidak secara eksplisit menyebut neraka atau bentuk tertentu dari penghukuman terakhir.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. 'Namun' memberi kontras yang jelas; istilah pertanian dibuat mudah dipahami. Catatan kaki mempertahankan alternatif penting tanpa membebani teks utama.
