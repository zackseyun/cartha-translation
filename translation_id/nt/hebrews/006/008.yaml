    rationale: ἐκφέρουσα adalah partisipel yang melanjutkan rujukan kepada tanah dari ayat sebelumnya, bukan klausa bersyarat dengan εἰ. Bentuk relatif “tanah yang menghasilkan” mempertahankan hubungan sintaktis dan kontrasnya secara lebih dekat.
