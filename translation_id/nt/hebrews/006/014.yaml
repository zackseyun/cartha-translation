  text: saying[a], “Surely I will bless you and surely multiply you.”
translation:
  language: id
  text: dengan berfirman[a], “Sesungguhnya, Aku akan sungguh-sungguh memberkati engkau dan sungguh-sungguh memperbanyak engkau.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Yunani berbunyi, “memberkati Aku akan memberkati engkau dan memperbanyak Aku akan memperbanyak engkau,” suatu konstruksi penegasan yang menggemakan Kejadian 22:17.
    reason: Menjelaskan pengulangan intensif dalam bahasa Yunani dan hubungan antarteksnya.
lexical_decisions:
- source_word: λέγων
  choice: dengan berfirman
  rationale: Partisipel ini memperkenalkan isi sumpah Allah. Karena subjeknya Allah, ‘berfirman’ wajar dan bermartabat; ‘dengan’ menghubungkannya dengan tindakan bersumpah pada ayat sebelumnya.
- source_word: Εἰ μὴν
  choice: Sesungguhnya
  rationale: Gabungan idiomatis ini merupakan penegasan kuat dalam rumusan sumpah, bukan syarat harfiah. ‘Sesungguhnya’ menyampaikan daya penegasannya secara alami.
- source_word: εὐλογῶν εὐλογήσω σε
  choice: Aku akan memberkati engkau
  rationale: Konstruksi partisipel dan verba finit yang berulang bersifat intensif serta menggemakan Kejadian 22:17. Bahasa utama dibuat alami, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: καὶ
  choice: dan
  rationale: Konjungsi koordinatif sederhana yang menghubungkan kedua janji.
- source_word: πληθύνων πληθυνῶ σε
  choice: sungguh akan membuat keturunanmu sangat banyak
  rationale: Verba πληθύνω dalam janji kepada Abraham menyatakan pelipatgandaan atau penambahan jumlah. Objek pronominal tunggal secara harfiah ‘engkau’, tetapi dalam konteks janji ini secara alami menunjuk pada banyaknya keturunan Abraham; ‘sungguh’ dan ‘sangat banyak’ mempertahankan tekanan konstruksi Yunani.
theological_decisions:
- issue: Bentuk penegasan sumpah dalam kutipan janji kepada Abraham
  choice: Menerjemahkan Εἰ μὴν sebagai ‘Sesungguhnya’ dan mempertahankan penekanan paralel pada kedua tindakan melalui ungkapan idiomatis.
  alternative: ‘Sungguh, dengan memberkati Aku akan memberkati engkau, dan dengan memperbanyak Aku akan memperbanyak engkau.’
  rationale: Bentuk Yunani mencerminkan pengulangan Semitis yang intensif. Terjemahan utama perlu terbaca alami tanpa menghilangkan kekuatan sumpah; bentuk formal dipertahankan dalam catatan kaki.
- issue: Objek janji pelipatgandaan
  choice: ‘membuat keturunanmu sangat banyak’
  alternative: ‘memperbanyak engkau’
  rationale: Secara gramatikal σε berarti ‘engkau’, sehingga alternatif formal tetap sah. Namun, dalam kutipan Kejadian 22:17, pelipatgandaan Abraham terwujud dalam banyaknya keturunannya. Ungkapan eksplisit ini alami dalam bahasa Indonesia dan menjaga maksud kontekstual tanpa memasukkan kekhasan denominasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. ‘Engkau’ dipakai dalam kutipan firman Allah kepada Abraham. ‘Berfirman’ menandai bahwa pembicaranya Allah, sementara struktur kalimat tetap bergantung pada konteks ayat sebelumnya.
