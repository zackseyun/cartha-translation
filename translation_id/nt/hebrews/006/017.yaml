revisions:
- from: Karena itu, ketika Allah hendak menunjukkan dengan lebih jelas kepada para ahli waris janji itu bahwa maksud-Nya tidak dapat berubah, Ia menjaminnya dengan sumpah.[a]
  to: Karena itu, ketika Allah hendak menunjukkan dengan lebih meyakinkan kepada para ahli waris janji itu bahwa maksud-Nya tidak dapat berubah, Ia menjaminnya dengan sumpah.[a]
  rationale: Revisi kecil ini mempertajam daya intensif περισσότερον dalam konteks tindakan ἐπιδεῖξαι, dan memperbaiki catatan kaki agar lebih dekat dengan gambaran dasar ἐμεσίτευσεν tanpa memaksakan pengertian teologis atau jabatan penengah. Makna utama—Allah memberikan jaminan melalui sumpah—tetap dipertahankan.
