  text: ἐν ᾧ περισσότερον βουλόμενος ὁ θεὸς ἐπιδεῖξαι τοῖς κληρονόμοις τῆς ἐπαγγελίας τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ ἐμεσίτευσεν ὅρκῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/017.yaml
  text: So when God desired to show more clearly to the heirs of the promise the unchangeable character of his purpose[a], he guaranteed it with an oath[b],
translation:
  language: id
  text: Karena itu, ketika Allah hendak menunjukkan dengan lebih meyakinkan kepada para ahli waris janji itu bahwa maksud-Nya tidak dapat berubah, Ia menjaminnya dengan sumpah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Ia mengantarainya dengan sumpah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Karena itu, ketika
  rationale: Ungkapan ini menghubungkan ayat dengan pembahasan sebelumnya tentang sumpah Allah dan sekaligus memperkenalkan keadaan yang melatarbelakangi tindakan-Nya; terjemahan harfiah 'di dalam hal itu' tidak alami dalam bahasa Indonesia.
- source_word: περισσότερον
  choice: dengan lebih jelas
  rationale: Bersama ἐπιδεῖξαι, kata komparatif ini menekankan bahwa Allah memberikan penegasan yang lebih nyata atau meyakinkan kepada para penerima janji.
- source_word: βουλόμενος
  choice: hendak
  rationale: Menyatakan kehendak dan maksud Allah yang disengaja, bukan sekadar keinginan yang belum tentu terlaksana.
- source_word: ἐπιδεῖξαι
  choice: menunjukkan
  rationale: Padanan yang wajar dan langsung untuk tindakan memperlihatkan atau membuktikan sesuatu; nuansa penguatnya disampaikan oleh 'dengan lebih jelas'.
- source_word: τοῖς κληρονόμοις τῆς ἐπαγγελίας
  choice: kepada para ahli waris janji itu
  rationale: '''Ahli waris'' mempertahankan gambaran penerimaan warisan, sedangkan ''janji itu'' merujuk pada janji ilahi yang sedang dibahas tanpa menambahkan unsur yang tidak dinyatakan.'
- source_word: τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ
  choice: bahwa maksud-Nya tidak dapat berubah
  rationale: Mengungkapkan secara alami kualitas tetap dan tidak dapat diubah dari keputusan atau maksud Allah, tanpa memakai istilah teknis yang kurang mudah dipahami.
- source_word: ἐμεσίτευσεν ὅρκῳ
  choice: Ia menjaminnya dengan sumpah
  rationale: Dalam konteks ini verba tersebut menyatakan bahwa Allah memberikan jaminan melalui sumpah; 'menjaminnya' menyampaikan fungsi kontekstualnya dengan jelas, sementara bentuk yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Ketidakberubahan maksud Allah
  choice: maksud-Nya tidak dapat berubah
  alternative: sifat maksud-Nya yang tidak berubah; ketetapan keputusan-Nya
  rationale: Rumusan ini mempertahankan penegasan ayat bahwa maksud Allah tetap dan tidak dapat dialihkan atau diubah, tanpa memasukkan kategori metafisis yang lebih luas daripada pernyataan teks.
- issue: Fungsi sumpah dalam ἐμεσίτευσεν ὅρκῳ
  choice: Ia menjaminnya dengan sumpah
  alternative: Ia meneguhkannya dengan sumpah; secara harfiah, Ia menjadi penengah dengan sumpah
  rationale: Pilihan utama menyatakan fungsi sumpah sebagai jaminan tambahan bagi para ahli waris janji. Catatan kaki menjaga gambaran leksikal verba yang tidak mudah diterjemahkan secara harfiah dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat alami bagi pembaca umum sambil mempertahankan hubungan logis dengan konteks sebelumnya, gambaran ahli waris, ketidakberubahan maksud Allah, dan peranan sumpah sebagai jaminan.
