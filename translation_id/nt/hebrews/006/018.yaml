  text: ἵνα διὰ δύο πραγμάτων ἀμεταθέτων, ἐν οἷς ἀδύνατον ψεύσασθαι ⸀θεόν, ἰσχυρὰν παράκλησιν ἔχωμεν οἱ καταφυγόντες κρατῆσαι τῆς προκειμένης ἐλπίδος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/018.yaml
  text: so that through two unchangeable things[a], in which it is impossible for God to lie[b], we who have fled for refuge might have strong encouragement to take hold of the hope set before us.
translation:
  language: id
  text: supaya melalui dua hal yang tidak dapat diubah, dan berkenaan dengan kedua hal itu Allah mustahil berdusta, kita yang telah melarikan diri untuk mencari perlindungan memperoleh dorongan yang kuat untuk berpegang teguh pada[a] pengharapan yang tersedia di hadapan kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk meraih pengharapan yang tersedia di hadapan kita.” Kata Yunani yang digunakan dapat berarti meraih, memegang, atau berpegang teguh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan atau hasil yang mengalir dari ayat sebelumnya secara alami dalam bahasa Indonesia.
- source_word: διὰ δύο πραγμάτων ἀμεταθέτων
  choice: melalui dua hal yang tidak dapat diubah
  rationale: πράγματα bersifat umum, sedangkan ἀμεταθέτων menegaskan bahwa kedua hal tersebut tidak dapat diubah; dalam konteks, keduanya merujuk pada janji dan sumpah Allah.
- source_word: ἐν οἷς
  choice: yang dalam keduanya
  rationale: Mempertahankan hubungan relatif dengan 'dua hal' dan secara jelas menyatakan bahwa ketidakmungkinan Allah berdusta berlaku dalam kedua hal itu.
- source_word: ἀδύνατον ψεύσασθαι θεόν
  choice: mustahil bagi Allah untuk berdusta
  rationale: Mempertahankan konstruksi impersonal dan penegasan khidmat teks Yunani tanpa menambahkan rumusan teologis di luar teks.
- source_word: ἰσχυρὰν παράκλησιν
  choice: dorongan yang kuat
  rationale: παράκλησις di sini paling wajar menunjuk pada dorongan atau penguatan yang timbul dari kepastian janji dan sumpah Allah.
- source_word: ἔχωμεν
  choice: mendapat
  rationale: Dalam konstruksi tujuan sesudah ἵνα, 'mendapat' menyampaikan hasil yang dimaksud secara alami; modalitasnya sudah dibawa oleh 'supaya'.
- source_word: οἱ καταφυγόντες
  choice: kita yang telah melarikan diri untuk mencari perlindungan
  rationale: Mempertahankan gerak konkret dan tujuan mencari keselamatan dalam kata kerja καταφεύγω, bukan meratakannya menjadi gagasan perlindungan yang abstrak.
- source_word: κρατῆσαι
  choice: berpegang erat pada
  rationale: κρατέω dapat berarti meraih, memegang, atau mempertahankan dengan kuat. Dalam kolokasi Indonesia dengan 'pengharapan', 'berpegang erat pada' alami dan tetap mempertahankan daya aktif kata tersebut.
- source_word: τῆς προκειμένης ἐλπίδος
  choice: pengharapan yang tersedia di hadapan kita
  rationale: πρόκειμαι menggambarkan sesuatu yang diletakkan atau terbentang di depan. Pilihan ini mempertahankan gambaran objektif tentang pengharapan yang tersedia untuk diraih.
theological_decisions:
- issue: Gambaran perlindungan dan tindakan terhadap pengharapan
  choice: Mempertahankan gambaran konkret dengan 'melarikan diri untuk mencari perlindungan' dan 'berpegang erat pada pengharapan'.
  alternative: kita yang mencari perlindungan mendapat penguatan besar untuk meraih pengharapan
  rationale: Teks menggabungkan gambaran pelarian menuju tempat aman dengan tindakan aktif memegang pengharapan. Terjemahan tidak mengubahnya menjadi pernyataan abstrak tentang kepastian.
- issue: Ketidakmungkinan Allah berdusta
  choice: mustahil bagi Allah untuk berdusta
  alternative: Allah tidak mungkin berdusta
  rationale: Pilihan ini mengikuti konstruksi impersonal Yunani dan mempertahankan penegasan teologis teks tanpa memperluasnya menjadi uraian filosofis tentang hakikat Allah.
- issue: Acuan dua hal yang tidak dapat diubah
  choice: Dibiarkan sebagai 'dua hal', dengan konteks menunjuk pada janji dan sumpah Allah.
  alternative: janji dan sumpah yang tidak dapat diubah
  rationale: Teks Yunani sendiri mengatakan 'dua hal'; menyebut keduanya secara eksplisit dalam teks utama akan menjelaskan sesuatu yang dibiarkan anaforis oleh penulis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Tanda pisah dipakai untuk memperjelas klausa relatif tanpa memutus alur utama. Istilah 'pengharapan' dipertahankan sebagai kosakata Alkitab yang masih lazim, sedangkan 'dorongan yang kuat' menghindari nuansa arkais dari 'penghiburan yang teguh'.
