id: HEB.6.3
reference: Hebrews 6:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τοῦτο ⸀ποιήσομεν ἐάνπερ ἐπιτρέπῃ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/003.yaml
  text: And this we will do[a], if indeed God permits.
translation:
  language: id
  text: Dan hal ini akan kita lakukan, jika memang Allah mengizinkannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jika Allah memperkenankannya.” Kata Yunani yang diterjemahkan “memang” memberi penegasan pada syarat tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Kata penghubung yang secara alami mengaitkan pernyataan ini dengan dorongan pada ayat sebelumnya.
- source_word: τοῦτο
  choice: hal ini
  rationale: Kata tunjuk netral tunggal ini menunjuk pada tindakan atau langkah pengajaran yang baru disebutkan; 'hal ini' terdengar alami dan tetap mempertahankan bentuk tunggal.
- source_word: ποιήσομεν
  choice: akan kita lakukan
  rationale: Bentuk futur aktif secara harfiah berarti 'kita akan melakukan'; susunan ini jelas dalam bahasa Indonesia dan tidak mempersempit maksudnya menjadi tafsiran khusus tentang melanjutkan pengajaran.
- source_word: ἐάνπερ
  choice: jika memang
  rationale: Mengungkapkan syarat sekaligus mempertahankan penegasan tambahan dari unsur -περ tanpa melebih-lebihkan kadar ketidakpastian.
- source_word: ἐπιτρέπῃ
  choice: mengizinkannya
  rationale: Bentuk subjunktif sesudah ἐάνπερ menyatakan syarat 'jika ... mengizinkan'; akhiran '-nya' secara alami merujuk pada hal yang akan dilakukan.
- source_word: ὁ θεός
  choice: Allah
  rationale: Padanan baku dan wajar dalam bahasa Indonesia untuk θεός ketika menunjuk kepada Allah; artikelnya tidak perlu diterjemahkan tersendiri.
theological_decisions:
- issue: Klausa bersyarat mengenai izin Allah
  choice: Niat penulis untuk bertindak dinyatakan secara nyata, tetapi ditempatkan di bawah syarat bahwa Allah mengizinkannya.
  alternative: Melemahkan syarat menjadi ungkapan idiomatis 'insyaallah' atau memperluasnya menjadi pernyataan deterministis tentang penyebab ilahi.
  rationale: Bahasa Yunani menyatakan syarat yang sungguh-sungguh dan bertekanan, tanpa menjelaskan lebih jauh hubungan antara kehendak manusia dan kedaulatan Allah. Terjemahan mempertahankan ketegangan ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Susunan 'akan kita lakukan' dipilih karena alami sekaligus memberi penekanan ringan pada tindakan bersama. Penanda catatan kaki ditempatkan langsung setelah kalimat.
