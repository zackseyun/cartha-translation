id: HEB.6.9
reference: Hebrews 6:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πεπείσμεθα δὲ περὶ ὑμῶν, ἀγαπητοί, τὰ κρείσσονα καὶ ἐχόμενα σωτηρίας, εἰ καὶ οὕτως λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/009.yaml
  text: But we are convinced of better things concerning you[a], beloved—things that belong to salvation—even though we speak in this way.
translation:
  language: id
  text: Namun, Saudara-saudara yang terkasih, mengenai kalian kami yakin akan hal-hal yang lebih baik, yaitu hal-hal yang berkaitan dengan keselamatan[a], sekalipun kami berbicara demikian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hal-hal yang menyertai keselamatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπείσμεθα
  choice: kami yakin
  rationale: Bentuk perfektum menyatakan keyakinan yang telah terbentuk dan tetap teguh; frasa ini alami dalam bahasa Indonesia modern.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang kontras dari peringatan keras pada ayat-ayat sebelumnya.
- source_word: περὶ ὑμῶν
  choice: mengenai kalian
  rationale: Menerjemahkan περί dengan genitif secara langsung dan mempertahankan rujukan jamak kepada para pembaca.
- source_word: ἀγαπητοί
  choice: Saudara-saudara yang terkasih
  rationale: Menyampaikan sapaan penuh kasih kepada komunitas tanpa terdengar kaku; unsur 'Saudara-saudara' membuat fungsi vokatifnya jelas dalam bahasa Indonesia.
- source_word: τὰ κρείσσονα
  choice: hal-hal yang lebih baik
  rationale: Mempertahankan bentuk substantival jamak dan daya komparatif κρείσσονα.
- source_word: ἐχόμενα σωτηρίας
  choice: hal-hal yang berkaitan dengan keselamatan
  rationale: Menjaga hubungan yang cukup luas antara hal-hal tersebut dan keselamatan tanpa menentukan apakah itu bukti, pengiring, atau akibat keselamatan.
- source_word: εἰ καὶ
  choice: sekalipun
  rationale: Menyampaikan hubungan konsesif secara alami dan ringkas.
- source_word: οὕτως
  choice: demikian
  rationale: Merujuk secara wajar kepada isi dan cara peringatan keras yang baru disampaikan.
- source_word: λαλοῦμεν
  choice: kami berbicara
  rationale: Padanan langsung dan alami bagi bentuk kini λαλοῦμεν.
theological_decisions:
- issue: Hubungan ἐχόμενα dengan σωτηρίας dalam konteks nas peringatan
  choice: hal-hal yang berkaitan dengan keselamatan
  alternative: hal-hal yang menyertai keselamatan
  rationale: Bahasa Yunani menegaskan adanya realitas yang terkait erat dengan keselamatan, tetapi tidak mengharuskan penerjemah menentukannya sebagai bukti, pengiring, akibat, atau penyebab keselamatan. Pilihan ini mempertahankan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern, hangat, dan bermartabat. Pronomina 'kalian' dipakai untuk menandai orang kedua jamak secara jelas; sapaan 'Saudara-saudara yang terkasih' mempertahankan kehangatan ἀγαπητοί. Susunan kalimat sedikit ditata ulang demi kelancaran tanpa mengubah hubungan logis teks.
