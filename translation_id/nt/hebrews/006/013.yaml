  text: Τῷ γὰρ Ἀβραὰμ ἐπαγγειλάμενος ὁ θεός, ἐπεὶ κατ’ οὐδενὸς εἶχεν μείζονος ὀμόσαι, ὤμοσεν καθ’ ἑαυτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/013.yaml
  text: For when God made the promise to Abraham[a], since he could swear by no one greater, he swore by himself[b],
translation:
  language: id
  text: Sebab, ketika Allah berjanji kepada Abraham, karena Ia tidak dapat bersumpah demi siapa pun yang lebih besar, Ia bersumpah demi diri-Nya sendiri,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῷ ... Ἀβραὰμ ἐπαγγειλάμενος
  choice: ketika Allah berjanji kepada Abraham
  rationale: Partisip aoris ἐπαγγειλάμενος menyatakan tindakan berjanji, sedangkan datif Ἀβραὰμ menandai penerima janji. Susunan ini alami dalam bahasa Indonesia dan mempertahankan hubungan temporal dengan klausa utama.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ menghubungkan ayat ini dengan argumen sebelumnya sebagai penjelasan atau dasar.
- source_word: ἐπεὶ
  choice: karena
  rationale: Dalam konteks ini ἐπεί menyatakan alasan Allah bersumpah demi diri-Nya sendiri.
- source_word: κατ’ οὐδενὸς ... μείζονος
  choice: tidak ada yang lebih besar yang demi dia
  rationale: οὐδενός secara bentuk dapat bersifat personal atau netral; konteks sumpah mendukung acuan personal. Ungkapan 'demi dia' mempertahankan konstruksi κατά dalam rumusan sumpah tanpa menyisipkan gagasan otoritas yang tidak dinyatakan langsung.
- source_word: εἶχεν ... ὀμόσαι
  choice: Allah dapat bersumpah
  rationale: Konstruksi εἶχεν dengan infinitif menyatakan tidak tersedianya pihak yang lebih besar sebagai dasar sumpah; 'dapat bersumpah' menyampaikan daya potensial itu secara wajar.
- source_word: ὤμοσεν καθ’ ἑαυτοῦ
  choice: Allah bersumpah demi diri-Nya sendiri
  rationale: κατά dengan refleksif dalam rumusan sumpah berarti bersumpah demi diri sendiri. Pengulangan nama 'Allah' menghindari rangkaian pronomina yang kurang jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Hakikat sumpah Allah
  choice: Allah bersumpah demi diri-Nya sendiri karena tidak ada pihak yang lebih besar yang dapat dijadikan dasar sumpah.
  alternative: Allah mengambil sumpah atas nama diri-Nya sendiri.
  rationale: Terjemahan mempertahankan klaim tentang keunggulan Allah dan tindakan-Nya bersumpah demi diri sendiri, tanpa mengembangkannya menjadi rumusan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bersumpah demi' merupakan ungkapan idiomatis yang jelas bagi pembaca umum. Bentuk 'diri-Nya' memakai kapitalisasi pronomina ilahi sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia.
