  text: ⸀ἄνθρωποι γὰρ κατὰ τοῦ μείζονος ὀμνύουσιν, καὶ πάσης αὐτοῖς ἀντιλογίας πέρας εἰς βεβαίωσιν ὁ ὅρκος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/016.yaml
  text: For people swear by one greater than themselves[b][a], and for them an oath is the end of every dispute for confirmation.
translation:
  language: id
  text: Sebab manusia bersumpah demi pihak yang lebih tinggi daripada mereka, dan bagi mereka sumpah merupakan pengakhiran setiap perselisihan sebagai peneguhan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωποι
  choice: manusia
  rationale: Bentuk jamak ini merujuk secara umum kepada umat manusia, bukan khusus kepada laki-laki; 'manusia' alami dalam pernyataan umum dan mempertahankan kontras dengan Allah dalam konteks.
- source_word: κατὰ τοῦ μείζονος
  choice: demi pihak yang lebih besar daripada mereka
  rationale: κατά dengan genitif dalam rumusan sumpah menyatakan pihak berotoritas lebih tinggi yang dijadikan dasar sumpah. 'Pihak' tidak menentukan apakah yang dimaksud seorang pribadi atau otoritas lain.
- source_word: ὀμνύουσιν
  choice: bersumpah
  rationale: Padanan langsung dan wajar untuk tindakan mengucapkan sumpah.
- source_word: πάσης ... ἀντιλογίας
  choice: setiap perselisihan
  rationale: ἀντιλογία di sini menunjuk kepada pertentangan atau perkara yang diperselisihkan, bukan hanya kontradiksi secara logis.
- source_word: πέρας
  choice: mengakhiri
  rationale: Bentuk verbal Indonesia menyampaikan fungsi sumpah sebagai hal yang membawa perselisihan kepada akhirnya dengan lebih alami daripada ungkapan nominal yang kaku.
- source_word: εἰς βεβαίωσιν
  choice: dengan memberikan kepastian
  rationale: βεβαίωσις menyatakan peneguhan atau pengesahan; dalam konteks sumpah, frasa ini menjelaskan bahwa kepastian yang diberikan itulah yang mengakhiri perselisihan.
- source_word: ὁ ὅρκος
  choice: sumpah itu
  rationale: Artikel Yunani menunjuk secara generik kepada sumpah sebagai lembaga atau tindakan yang baru disebut; 'sumpah itu' mempertahankan keterkaitan tersebut secara alami.
theological_decisions:
- issue: Rujukan umum kepada umat manusia
  choice: manusia
  alternative: orang-orang; kaum laki-laki
  rationale: Ayat ini menyatakan kebiasaan manusia secara umum dan tidak membatasi pelakunya pada laki-laki.
- issue: Fungsi sumpah dalam perselisihan
  choice: mengakhiri setiap perselisihan dengan memberikan kepastian
  alternative: menjadi akhir setiap perselisihan untuk peneguhan
  rationale: Pilihan utama mempertahankan hubungan antara πέρας dan βεβαίωσις tanpa menyiratkan bahwa setiap sumpah selalu benar; yang dinyatakan ialah fungsi sosial sumpah sebagai pengesahan yang menutup perselisihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bersumpah demi' merupakan rumusan idiomatis; 'pihak yang lebih besar' menjaga sifat umum referen; susunan klausa kedua dibuat verbal agar mudah dipahami tanpa menghilangkan fungsi peneguhan sumpah.
