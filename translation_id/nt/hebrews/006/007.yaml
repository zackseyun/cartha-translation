  text: γῆ γὰρ ἡ πιοῦσα τὸν ἐπ’ αὐτῆς ⸂ἐρχόμενον πολλάκις⸃ ὑετόν, καὶ τίκτουσα βοτάνην εὔθετον ἐκείνοις δι’ οὓς καὶ γεωργεῖται, μεταλαμβάνει εὐλογίας ἀπὸ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/007.yaml
  text: For land that drinks the rain that often comes upon it and produces vegetation useful to those for whose sake it is also cultivated receives blessing from God[a][b].
translation:
  language: id
  text: Sebab tanah yang menyerap hujan[a] yang sering turun di atasnya serta menghasilkan tumbuh-tumbuhan yang berguna bagi orang-orang yang untuk kepentingan mereka tanah itu juga diolah[b], menerima berkat dari Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “meminum hujan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “bagi orang-orang yang mengolahnya,” meskipun “untuk kepentingan mereka tanah itu diolah” lebih mencerminkan διά dengan akusatif di sini.
    reason: alternative_reading
lexical_decisions:
- source_word: γῆ
  choice: tanah
  rationale: Dalam kiasan pertanian ini, 'tanah' secara alami menunjuk pada lahan yang diolah, tanpa keluasan makna kosmis dari 'bumi'.
- source_word: πιοῦσα
  choice: menyerap air
  rationale: Secara harfiah berarti 'meminum'. Ungkapan 'menyerap air hujan' mempertahankan gambaran tanah menerima hujan dalam bahasa Indonesia yang alami; alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: τὸν ἐπ’ αὐτῆς ἐρχόμενον πολλάκις ὑετόν
  choice: air hujan yang sering turun ke atasnya
  rationale: Pilihan ini mempertahankan πολλάκις ('sering') dan arah ἐπ’ αὐτῆς, sekaligus memakai susunan Indonesia yang wajar.
- source_word: τίκτουσα
  choice: menghasilkan
  rationale: Kata ini menyampaikan daya tanah menumbuhkan atau menghasilkan tanaman dengan jelas dan alami.
- source_word: βοτάνην
  choice: tumbuh-tumbuhan
  rationale: Istilah ini cukup luas untuk pertumbuhan tanaman atau herba dan tidak mempersempitnya menjadi jenis panen tertentu.
- source_word: εὔθετον
  choice: yang berguna
  rationale: Dalam konteks pertanian, kata ini menyatakan bahwa hasil tersebut sesuai atau bermanfaat bagi pihak yang dimaksud.
- source_word: ἐκείνοις δι’ οὓς καὶ γεωργεῖται
  choice: bagi orang-orang yang untuk mereka tanah itu juga diolah
  rationale: 'διά dengan akusatif paling wajar menyatakan tujuan atau kepentingan: tanah diolah demi mereka. Susunan ini sengaja mempertahankan hubungan makna itu tanpa mengubahnya menjadi pelaku pengolahan.'
- source_word: γεωργεῖται
  choice: tanah itu juga diolah
  rationale: Bentuk pasif dan unsur καί ('juga') dipertahankan. 'Diolah' merupakan istilah pertanian yang luas dan mudah dipahami.
- source_word: μεταλαμβάνει
  choice: menerima
  rationale: Dalam konteks ini, 'menerima' menyampaikan bahwa tanah memperoleh berkat, dengan lebih alami daripada padanan harfiah seperti 'mengambil bagian dalam'.
- source_word: εὐλογίας ἀπὸ τοῦ θεοῦ
  choice: berkat dari Allah
  rationale: Pilihan ini mempertahankan sumber berkat tanpa memaksakan ketakrifan yang tidak dinyatakan dalam bahasa Yunani.
theological_decisions:
- issue: Kiasan pertanian dalam konteks peringatan
  choice: Mempertahankan kiasan secara langsung tanpa menambahkan kesimpulan doktrinal mengenai ketekunan atau kemurtadan.
  alternative: Menerjemahkan secara interpretatif untuk mengidentifikasi tanah dengan kelompok teologis tertentu atau untuk secara eksplisit menyatakan persetujuan ilahi kepada orang percaya yang berbuah.
  rationale: Ayat ini menyatakan sisi positif dari perbandingan pertanian. Terjemahan perlu mempertahankan gambaran dan ketegangan konteksnya tanpa menyelesaikan perdebatan teologis yang tidak dinyatakan secara eksplisit dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat tetap mengikuti alur argumentasi Yunani, sedangkan pilihan kata dibuat cukup alami bagi pembaca umum. Penanda catatan kaki ditempatkan setelah klausa atau kalimat yang relevan.
