id: HEB.6.4
reference: Hebrews 6:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀδύνατον γὰρ τοὺς ἅπαξ φωτισθέντας γευσαμένους τε τῆς δωρεᾶς τῆς ἐπουρανίου καὶ μετόχους γενηθέντας πνεύματος ἁγίου
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/004.yaml
  text: For it is impossible[a], in the case of those who were once enlightened, and who tasted the heavenly gift, and became partakers of the Holy Spirit[c][b],
translation:
  language: id
  text: Sebab mustahil bagi mereka yang pernah diterangi[a], yang telah mengecap karunia surgawi[b], dan yang telah mengambil bagian dalam Roh Kudus[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''Diterangi'' dapat menunjuk secara luas pada penerimaan terang atau pengajaran rohani; sebagian orang menafsirkannya secara lebih khusus sebagai pertobatan atau penerangan melalui baptisan.'
    reason: alternative_reading
  - marker: b
    text: Atau "mengalami karunia surgawi"; kata Yunaninya secara harfiah berarti "mengecap" dan dapat menunjuk pada pengalaman nyata, bukan sekadar mencicipi sedikit.
    reason: lexical_alternative
  - marker: c
    text: Atau "menjadi orang yang turut mendapat bagian dalam Roh Kudus" atau "menjadi peserta dalam Roh Kudus".
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδύνατον γὰρ
  choice: Sebab mustahil
  rationale: Menjaga penekanan Ἀδύνατον pada awal klausa dan fungsi γὰρ sebagai penghubung penjelas dengan peringatan sebelumnya. Kopula tidak perlu ditambahkan dalam bahasa Indonesia.
- source_word: τοὺς ἅπαξ φωτισθέντας
  choice: bagi mereka yang pernah diterangi
  rationale: Konstruksi ini menyatakan pihak yang dikenai kemustahilan. 'Pernah' menyampaikan ἅπαξ secara alami tanpa melebihkannya menjadi 'sekali untuk selamanya', sedangkan 'diterangi' mempertahankan metafora pasif tanpa menyamakannya secara khusus dengan pertobatan atau baptisan.
- source_word: γευσαμένους
  choice: telah mengecap
  rationale: '''Mengecap'' mempertahankan metafora konkret verba γεύομαι sekaligus dapat dipahami sebagai mengalami sesuatu secara nyata; tingkat atau kedalaman pengalaman itu tidak diputuskan oleh terjemahan.'
- source_word: τῆς δωρεᾶς τῆς ἐπουρανίου
  choice: karunia surgawi
  rationale: Ungkapan ini ringkas dan alami serta tidak menentukan identitas karunia yang tidak disebutkan secara eksplisit oleh teks.
- source_word: τε ... καὶ
  choice: yang ... dan yang
  rationale: Menghubungkan rangkaian deskripsi secara kumulatif dan jelas dalam bahasa Indonesia tanpa membebani kalimat dengan bentuk 'baik ... maupun'.
- source_word: μετόχους γενηθέντας πνεύματος ἁγίου
  choice: telah mengambil bagian dalam Roh Kudus
  rationale: Menyampaikan tindakan memasuki keadaan sebagai μέτοχοι dengan ungkapan Indonesia yang wajar dan cukup kuat, tanpa menentukan lebih jauh hakikat soteriologis partisipasi tersebut.
theological_decisions:
- issue: Apakah φωτισθέντας secara khusus menunjuk pada pertobatan atau penerangan melalui baptisan
  choice: Mempertahankan metafora luas 'diterangi'
  alternative: '''bertobat'' atau ''menerima penerangan melalui baptisan'''
  rationale: Teks Yunani tidak secara eksplisit menetapkan rujukan metafora itu. Terjemahan ini mempertahankan keterbukaan maknanya dan tidak memasukkan tafsiran denominasi tertentu.
- issue: Apakah γευσαμένους berarti sekadar mencicipi atau sungguh-sungguh mengalami
  choice: Menggunakan 'mengecap' dalam teks utama
  alternative: '''mengalami'' atau ''hanya mencicipi'''
  rationale: Verba ini dapat menunjuk pada pengalaman nyata, tetapi tidak dengan sendirinya menentukan keluasan pengalaman tersebut. Metafora sumber dipertahankan agar perdebatan tentang kemurtadan dan ketekunan tidak diselesaikan secara leksikal.
- issue: Apakah menjadi μέτοχοι Roh Kudus harus dipahami sebagai kepenuhan keselamatan atau bentuk partisipasi yang lebih longgar
  choice: Menggunakan 'telah mengambil bagian dalam Roh Kudus'
  alternative: '''telah menjadi orang yang turut memiliki Roh Kudus'' atau ''telah menjadi peserta dalam Roh Kudus'''
  rationale: Pilihan ini menerjemahkan pernyataan dengan kuat dan langsung, tetapi tidak memaksakan kesimpulan sistematis tentang berdiamnya Roh, keselamatan, atau kemungkinan kemurtadan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Rangkaian partisipel Yunani dijadikan klausa-klausa relatif agar mudah dipahami. Koma penutup dipertahankan karena ayat ini secara sintaksis berlanjut ke ayat berikutnya.
