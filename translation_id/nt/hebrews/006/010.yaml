    rationale: Teks Yunani menyatakan bahwa Allah tidak tidak adil (οὐ ... ἄδικος), sedangkan pengulangan “tidak” dalam bahasa Indonesia merupakan cacat tekstual yang membuat kalimat tidak gramatikal dan dapat mengaburkan makna.
  - severity: medium
    issue: Aspek pelayanan lampau kurang tampak dalam “dengan melayani”
    rationale: διακονήσαντες adalah partisip aoris dan dibedakan dari διακονοῦντες yang beraspek kini. “Telah melayani ... dan terus melayani” menyampaikan perbedaan ini secara eksplisit dan alami.
