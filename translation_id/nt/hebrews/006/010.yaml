id: HEB.6.10
reference: Hebrews 6:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄδικος ὁ θεὸς ἐπιλαθέσθαι τοῦ ἔργου ὑμῶν ⸀καὶ τῆς ἀγάπης ἧς ἐνεδείξασθε εἰς τὸ ὄνομα αὐτοῦ, διακονήσαντες τοῖς ἁγίοις καὶ διακονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/010.yaml
  text: For God is not unjust so as to forget your work and the love that you showed for his name in having served the saints and in continuing to serve them[a][b][c].
translation:
  language: id
  text: Sebab Allah tidak akan bertindak tidak adil dengan melupakan pekerjaanmu dan kasih yang telah kamu tunjukkan demi nama-Nya[a] karena kamu telah melayani orang-orang kudus[b] dan terus melayani mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bagi nama-Nya.”'
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, sesama orang percaya; “orang-orang kudus” di sini adalah umat Allah yang dikuduskan, bukan hanya orang-orang dari golongan yang kemudian dikanonisasi.
    reason: cultural_note
  - marker: c
    text: 'Atau: “dengan telah melayani orang-orang kudus dan terus melayani mereka.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ἄδικος
  choice: tidak adil
  rationale: Ungkapan ini secara alami menyatakan bahwa Allah tidak akan bertindak bertentangan dengan keadilan dengan melupakan perbuatan mereka.
- source_word: ἐπιλαθέσθαι
  choice: melupakan
  rationale: Mempertahankan arti langsung verba Yunani, dengan implikasi kontekstual bahwa Allah tidak mengabaikan atau gagal memperhitungkan pelayanan mereka.
- source_word: τοῦ ἔργου ὑμῶν
  choice: pekerjaanmu
  rationale: ἔργον berbentuk tunggal kolektif dan dapat diterjemahkan secara wajar sebagai pekerjaan; bentuk orang kedua jamak tidak dibedakan secara morfologis dalam bahasa Indonesia.
- source_word: τῆς ἀγάπης
  choice: kasih
  rationale: Istilah ini menunjuk pada kasih yang diwujudkan secara konkret melalui pelayanan.
- source_word: ἐνεδείξασθε
  choice: telah kamu tunjukkan
  rationale: Menyampaikan tindakan memperlihatkan atau membuktikan kasih dalam ungkapan Indonesia yang alami.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: bagi nama-Nya
  rationale: Mempertahankan unsur 'nama' serta arah pengabdian dan penghormatan kepada Allah tanpa mempersempit ungkapan itu.
- source_word: διακονήσαντες
  choice: dengan melayani
  rationale: Menunjuk pada pelayanan yang telah dilakukan; konteks dan pasangan dengan bentuk kini menyampaikan dimensi lampau.
- source_word: τοῖς ἁγίοις
  choice: orang-orang kudus
  rationale: Mempertahankan istilah Perjanjian Baru bagi umat Allah, tanpa mengartikannya sebagai golongan yang baru kemudian dikanonisasi.
- source_word: διακονοῦντες
  choice: dengan terus melayani mereka
  rationale: Kata 'terus' menampilkan aspek kini yang membedakannya dari pelayanan yang telah dilakukan sebelumnya; 'mereka' mengacu kembali kepada orang-orang kudus.
theological_decisions:
- issue: Apakah ayat ini mengajarkan jasa manusia di hadapan Allah atau pengakuan Allah yang setia terhadap perbuatan orang percaya
  choice: Teks menyatakan bahwa sesuai keadilan-Nya Allah tidak melupakan pekerjaan dan kasih mereka, tanpa menyatakan bahwa perbuatan itu menghasilkan keselamatan sebagai upah jasa.
  alternative: Pembacaan berorientasi jasa yang menganggap Allah berutang keselamatan atau pahala karena pekerjaan manusia.
  rationale: Terjemahan mempertahankan hubungan antara keadilan Allah dan tindakan-Nya mengingat pelayanan mereka, tetapi tidak menambahkan gagasan bahwa keselamatan diperoleh melalui jasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur sebab-akibat serta metafora 'melupakan' dan 'nama' dipertahankan. Perbedaan aspek antara dua partisip pelayanan dibuat jelas dengan 'telah' dalam klausa utama dan 'terus' pada pelayanan yang masih berlangsung.
