  to: Sebab Allah tidak akan bertindak tidak adil dengan melupakan pekerjaanmu dan kasih yang telah kamu tunjukkan demi nama-Nya[a] karena kamu telah melayani orang-orang kudus[b] dan terus melayani mereka.[c]
  rationale: Revisi terutama memperbaiki negasi ganda yang tidak dapat dipertahankan. Frasa akhir juga diperjelas untuk mencerminkan pelayanan yang sudah dilakukan dan pelayanan yang masih berlangsung. “Demi nama-Nya” digunakan sebagai terjemahan utama yang lebih idiomatis untuk εἰς τὸ ὄνομα αὐτοῦ, sementara “bagi nama-Nya” dipertahankan sebagai alternatif.
