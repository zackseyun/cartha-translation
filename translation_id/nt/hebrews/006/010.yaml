  source_fidelity: Draf memuat salah ketik yang menghasilkan negasi ganda, “tidak tidak adil,” sehingga secara langsung membalikkan atau mengaburkan pernyataan Yunani οὐ ... ἄδικος. Revisi mengungkapkan bahwa melupakan pekerjaan dan kasih mereka akan merupakan tindakan yang tidak adil. Kontras antara partisip aoris διακονήσαντες dan partisip kini διακονοῦντες dipertahankan dengan “telah melayani” dan “terus melayani.”
  naturalness: Selain negasi ganda, “dengan melayani” tidak menyatakan dengan cukup jelas bahwa pelayanan pertama telah dilakukan. “Tidak akan bertindak tidak adil dengan melupakan” adalah bahasa Indonesia baku yang jelas dan alami dalam konteks ini.
  terminology: “Kasih,” “nama-Nya,” dan “orang-orang kudus” dipertahankan. Catatan untuk “orang-orang kudus” dengan tepat menjelaskan pemakaian istilah PB tanpa memasukkan pengertian kanonisasi kemudian.
  issues:
