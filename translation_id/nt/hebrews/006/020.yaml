  text: ὅπου πρόδρομος ὑπὲρ ἡμῶν εἰσῆλθεν Ἰησοῦς, κατὰ τὴν τάξιν Μελχισέδεκ ἀρχιερεὺς γενόμενος εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/020.yaml
  text: where Jesus has entered as a forerunner on our behalf[b][a], having become a high priest forever according to the order of Melchizedek.
translation:
  language: id
  text: Ke tempat itu Yesus telah masuk sebagai perintis bagi kita[a], setelah menjadi Imam Besar untuk selama-lamanya menurut tatanan Melkisedek.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “demi kita.” Frasa Yunani ini menyatakan tindakan untuk kepentingan orang lain; dalam konteks ini, frasa tersebut juga menekankan bahwa Yesus masuk sebagai wakil kita.
    reason: lexical_alternative
  - marker: b
    text: Frasa “menurut tatanan Melkisedek” menggemakan Mazmur 110:4.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: ke tempat
  rationale: Merujuk pada tempat di balik tirai dalam ayat sebelumnya. Bentuk ini mempertahankan makna lokatif sekaligus cocok secara alami dengan verba gerak 'masuk'.
- source_word: πρόδρομος
  choice: perintis
  rationale: Menggambarkan orang yang masuk lebih dahulu dan membuka jalan bagi orang lain; istilah ini mempertahankan daya metafora tanpa menjadi terlalu teknis.
- source_word: ὑπὲρ ἡμῶν
  choice: demi kita
  rationale: Menyatakan tindakan untuk kepentingan dan sebagai wakil kita, tanpa mempersempitnya menjadi arti penggantian yang tidak dinyatakan secara eksplisit di sini.
- source_word: εἰσῆλθεν
  choice: telah masuk
  rationale: Menyampaikan tindakan lampau yang hasil dan maknanya tetap berlaku dalam konteks pengharapan para pembaca.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Bentuk baku nama tersebut dalam bahasa Indonesia.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: menurut tatanan Melkisedek
  rationale: Mempertahankan gagasan pola atau golongan keimaman serta gema Mazmur 110:4; 'tatanan' lebih wajar daripada 'aturan' untuk konteks ini.
- source_word: ἀρχιερεὺς
  choice: Imam Besar
  rationale: Padanan baku dan tepat bagi jabatan kultis yang menjadi pusat argumentasi Surat Ibrani.
- source_word: γενόμενος
  choice: Ia telah menjadi
  rationale: Mempertahankan unsur verbal partisipel Yunani dan menunjukkan perolehan status atau jabatan sebagai Imam Besar, bukan perubahan hakikat.
- source_word: εἰς τὸν αἰῶνα
  choice: untuk selama-lamanya
  rationale: Ungkapan Indonesia yang jelas dan bermartabat untuk keberlangsungan tanpa akhir.
theological_decisions:
- issue: Hubungan γενόμενος dengan kristologi
  choice: Diterjemahkan 'Ia telah menjadi Imam Besar' sebagai pernyataan tentang status atau jabatan keimaman Yesus.
  alternative: '''telah diangkat menjadi Imam Besar'' atau ''dijadikan Imam Besar'''
  rationale: Terjemahan mempertahankan verba Yunani tanpa menambahkan secara eksplisit pelaku pengangkatan dan tanpa menyiratkan bahwa Yesus mulai ada atau berubah dalam hakikat-Nya.
- issue: Daya makna ὑπὲρ ἡμῶν
  choice: Diterjemahkan 'demi kita'.
  alternative: '''bagi kita'', ''untuk kita'', atau ''sebagai wakil kita'''
  rationale: Pilihan ini mempertahankan makna manfaat dan perwakilan dalam konteks Yesus masuk mendahului umat percaya, tanpa mengunci frasa itu pada rumusan penebusan yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dipecah menjadi dua kalimat agar alami dan mudah dipahami, sambil mempertahankan hubungan makna partisipel Yunani. Huruf kapital pada 'Imam Besar' dipakai sebagai sebutan jabatan khusus bagi Yesus dalam konteks ini.
