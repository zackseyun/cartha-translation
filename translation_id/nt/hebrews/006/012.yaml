  text: ἵνα μὴ νωθροὶ γένησθε, μιμηταὶ δὲ τῶν διὰ πίστεως καὶ μακροθυμίας κληρονομούντων τὰς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/012.yaml
  text: so that you may not become sluggish[a], but imitators of those who through faith and patience inherit the promises.
translation:
  language: id
  text: supaya kamu tidak menjadi lamban, melainkan meneladani orang-orang yang melalui iman[a] dan kesabaran mewarisi janji-janji itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melalui kepercayaan dan kesabaran”; dalam konteks tertentu, kata Yunani untuk “iman” juga dapat bernuansa “kepercayaan” atau “kesetiaan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: supaya ... tidak
  rationale: Menjaga hubungan tujuan dengan nasihat pada ayat sebelumnya dalam bahasa Indonesia yang wajar.
- source_word: νωθροὶ
  choice: lamban
  rationale: Menggambarkan kelambanan atau ketumpulan dalam tanggapan dan usaha tanpa nada moralistik berlebihan dari 'malas'.
- source_word: γένησθε
  choice: menjadi
  rationale: Mempertahankan nuansa ingresif, yakni peringatan agar tidak masuk ke dalam keadaan tersebut.
- source_word: μιμηταὶ
  choice: peneladan
  rationale: Menyatakan orang yang mencontoh teladan orang lain dan mempertahankan gagasan eksplisit μιμητής.
- source_word: διὰ πίστεως
  choice: melalui iman
  rationale: Mempertahankan arti utama πίστις dan menyatakan sarana atau cara mereka menerima warisan.
- source_word: μακροθυμίας
  choice: kesabaran
  rationale: Ungkapan Indonesia yang alami untuk ketabahan menanti dalam waktu panjang.
- source_word: κληρονομούντων
  choice: mewarisi
  rationale: Bentuk kini menggambarkan ciri orang-orang tersebut; bentuk verba sederhana paling alami dalam bahasa Indonesia.
- source_word: τὰς ἐπαγγελίας
  choice: janji-janji itu
  rationale: Mempertahankan bentuk jamak dan artikel tertentu, sekaligus mengaitkannya dengan janji-janji Allah dalam konteks.
theological_decisions:
- issue: Nuansa πίστις dalam konteks nasihat
  choice: iman
  alternative: kepercayaan atau kesetiaan
  rationale: Iman mempertahankan keluasan istilah dan konsistensi teologis tanpa memutuskan secara sempit antara tindakan percaya dan sifat setia; kemungkinan nuansa lain dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Lamban' dipilih daripada 'malas' agar sesuai dengan konteks ketekunan rohani. 'Peneladan' mempertahankan ajakan eksplisit untuk meniru, meski sedikit lebih formal daripada 'pengikut'.
