lexical_decisions:
- source_word: ἡ χάρις
  choice: Anugerah
  rationale: Kata χάρις dalam penutup surat ini berfungsi sebagai berkat yang lazim. Bahasa Indonesia tidak memerlukan padanan eksplisit untuk artikelnya, sehingga “Anugerah” menyampaikan maknanya secara alami dan bermartabat.
- source_word: μετὰ
  choice: menyertai
  rationale: μετά dengan genitif berarti “bersama/dengan”. Dalam rumusan berkat yang eliptis ini, “menyertai” secara alami mengungkapkan harapan tersirat tanpa menambahkan klaim teologis.
- source_word: πάντων ὑμῶν
  choice: kamu semua
  rationale: πάντων ὑμῶν secara tegas mencakup seluruh penerima surat. “Kamu semua” mempertahankan cakupan itu dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan khidmat; bentuk “kamu” dipakai sebagai sapaan jamak yang diperjelas oleh “semua”.
