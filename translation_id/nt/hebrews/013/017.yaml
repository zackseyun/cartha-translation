source:
  edition: SBLGNT
  text: Πείθεσθε τοῖς ἡγουμένοις ὑμῶν καὶ ὑπείκετε, αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν ὡς λόγον ἀποδώσοντες, ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες, ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/017.yaml
  text: Be persuaded by your leaders and yield to them[a], for they are keeping watch over your souls as those who will give an account, so that they may do this with joy and not with groaning, for this would be unprofitable for you.
translation:
  language: id
  text: Biarkanlah diri kalian diyakinkan oleh para pemimpin kalian dan tunduklah kepada mereka,[a] sebab mereka terus berjaga-jaga demi jiwa kalian sebagai orang-orang yang akan memberi pertanggungjawaban. Supaya mereka dapat menjalankan tugas ini dengan sukacita dan bukan sambil mengeluh, sebab hal itu tidak bermanfaat bagi kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Taatilah para pemimpin kalian dan tunduklah kepada mereka.” Kata Yunani Πείθεσθε dapat bermakna menaati, tetapi secara lebih harfiah menyiratkan membiarkan diri diyakinkan atau dimenangkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πείθεσθε
  choice: Biarkanlah dirimu diyakinkan oleh
  rationale: Bentuk imperatif medio-pasif ini dapat berarti membiarkan diri diyakinkan dan, sebagai perluasan makna, menaati. Terjemahan utama mempertahankan nuansa tanggapan berdasarkan keyakinan, sedangkan alternatif yang lazim dicatat dalam catatan kaki.
- source_word: ἡγουμένοις
  choice: para pemimpinmu
  rationale: Dalam konteks ini, partisip tersebut menunjuk kepada para pemimpin yang diakui dalam komunitas, tanpa menambahkan kesan kekuasaan yang lebih kuat daripada istilah Yunaninya.
- source_word: ὑπείκετε
  choice: mengalahlah kepada mereka
  rationale: Kata ini berarti memberi jalan, mengalah, atau tunduk. Pilihan ini membedakannya dari Πείθεσθε dan mempertahankan gambaran memberi jalan kepada kepemimpinan mereka.
- source_word: ἀγρυπνοῦσιν
  choice: terus berjaga-jaga
  rationale: Mempertahankan gambaran kewaspadaan yang sampai tidak tidur, sekaligus alami untuk tanggung jawab pastoral yang berkelanjutan.
- source_word: ψυχῶν
  choice: jiwamu
  rationale: ψυχή dapat berarti jiwa, hidup, atau diri. 'Jiwa' mempertahankan bobot rohani ungkapan ini tanpa harus menyiratkan bahwa perhatian para pemimpin hanya tertuju pada bagian nonjasmani manusia.
- source_word: ὡς λόγον ἀποδώσοντες
  choice: sebagai orang-orang yang akan memberi pertanggungjawaban
  rationale: Mempertahankan perbandingan ὡς dan daya prospektif partisip futurum, serta menyatakan tanggung jawab para pemimpin di hadapan Allah tanpa menambahkannya secara eksplisit ke dalam teks.
- source_word: μετὰ χαρᾶς
  choice: dengan sukacita
  rationale: Padanan langsung dan wajar yang mempertahankan bentuk frasa preposisional.
- source_word: στενάζοντες
  choice: sambil mengeluh
  rationale: Dalam konteks pelaksanaan tugas, 'mengeluh' menyampaikan desahan atau keluhan berat secara alami dalam bahasa Indonesia modern.
- source_word: ἀλυσιτελὲς
  choice: tidak akan bermanfaat
  rationale: Menyampaikan arti 'tidak menguntungkan/tidak berguna' tanpa melebihkannya menjadi 'berbahaya'.
theological_decisions:
- issue: Sifat seruan terhadap para pemimpin jemaat
  choice: Seruan untuk bersikap terbuka agar diyakinkan dan untuk mengalah kepada para pemimpin yang menjaga umat serta harus memberi pertanggungjawaban.
  alternative: Perintah langsung untuk menaati para pemimpin.
  rationale: Πείθεσθε memang dapat bermakna 'taatilah', tetapi bentuk dan rentang maknanya juga memungkinkan 'biarkanlah dirimu diyakinkan'. Bersama ὑπείκετε, ayat ini menyatakan tanggapan percaya dan sikap memberi jalan, sementara alasan sesudahnya menekankan tanggung jawab para pemimpin, bukan ketaatan mutlak tanpa batas.
- issue: Kepada siapa pertanggungjawaban diberikan
  choice: Objek pertanggungjawaban tidak ditambahkan dalam teks utama.
  alternative: Menambahkan 'kepada Allah'.
  rationale: Konteks teologis sangat mungkin menyiratkan pertanggungjawaban kepada Allah, tetapi teks Yunani hanya mengatakan bahwa mereka akan memberi pertanggungjawaban. Ketidaktersuratan itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal kolektif '-mu' dan 'jiwamu' mengikuti sapaan orang kedua jamak Yunani secara alami dalam konteks komunitas. Catatan kaki mempertahankan alternatif terjemahan yang lebih tradisional dan sahih.
