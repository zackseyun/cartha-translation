revisions:
- from: Biarkanlah dirimu diyakinkan oleh para pemimpinmu dan mengalahlah kepada mereka,[a] sebab mereka terus berjaga-jaga demi jiwamu sebagai orang-orang yang akan memberi pertanggungjawaban. Dengan demikian, mereka dapat melakukannya dengan sukacita dan bukan sambil mengeluh, sebab hal itu tidak akan bermanfaat bagimu.
  to: Biarkanlah diri kalian diyakinkan oleh para pemimpin kalian dan tunduklah kepada mereka,[a] sebab mereka terus berjaga-jaga demi jiwa kalian sebagai orang-orang yang akan memberi pertanggungjawaban. Supaya mereka dapat menjalankan tugas ini dengan sukacita dan bukan sambil mengeluh, sebab hal itu tidak bermanfaat bagi kalian.
  rationale: Revisi mengganti ungkapan yang kurang alami bagi ὑπείκετε, memulihkan fungsi tujuan dari ἵνα dengan «Supaya», dan mempertahankan waktu kini dari ἀλυσιτελές. Makna dasar Πείθεσθε sebagai keterbukaan untuk diyakinkan tetap dipertahankan, sementara alternatif «taatilah» tersedia dalam catatan kaki.
