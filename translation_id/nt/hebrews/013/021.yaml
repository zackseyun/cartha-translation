  to: Kiranya Ia memperlengkapi kamu dengan segala yang baik untuk melakukan kehendak-Nya, seraya mengerjakan dalam diri kita apa yang berkenan di hadapan-Nya melalui Yesus Sang Mesias. Bagi-Nyalah[a] kemuliaan sampai selama-lamanya. Amin.
