id: HEB.13.21
reference: Hebrews 13:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καταρτίσαι ὑμᾶς ἐν ⸀παντὶ ἀγαθῷ εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ, ποιῶν ἐν ⸀ἡμῖν τὸ εὐάρεστον ἐνώπιον αὐτοῦ διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς ⸀αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/021.yaml
  text: may he equip you in every good thing to do his will[a], working in us what is pleasing before him through Jesus the Messiah, to whom be the glory forever and ever. Amen.
translation:
  language: id
  text: Kiranya Ia memperlengkapi kamu dengan segala yang baik untuk melakukan kehendak-Nya, seraya mengerjakan dalam diri kita apa yang berkenan di hadapan-Nya melalui Yesus Sang Mesias. Bagi-Nyalah[a] kemuliaan sampai selama-lamanya. Amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata ganti “-Nya” dapat secara khusus merujuk kepada Yesus Sang Mesias; sebagian orang memahaminya merujuk kepada Allah, subjek doa ini.
    reason: alternative_reading
lexical_decisions:
- source_word: καταρτίσαι
  choice: memperlengkapi
  rationale: Dalam doa berkat ini, kata tersebut menyatakan permohonan agar Allah mempersiapkan dan menyediakan yang diperlukan umat untuk menaati-Nya; “memperlengkapi” alami dan tepat dalam bahasa Indonesia.
- source_word: ἐν παντὶ ἀγαθῷ
  choice: dalam segala hal yang baik
  rationale: Mempertahankan bentuk ἐν dan keluasan frasa Yunani tanpa membatasinya hanya pada benda atau sarana yang diberikan.
- source_word: εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ
  choice: untuk melakukan kehendak-Nya
  rationale: Infinitif berartikel menyatakan tujuan; bentuk ini ringkas dan wajar dalam bahasa Indonesia.
- source_word: ποιῶν ἐν ἡμῖν
  choice: dengan mengerjakan di dalam kita
  rationale: Partisipel ini menerangkan tindakan Allah yang menyertai perlengkapan tersebut. “Di dalam kita” mempertahankan arti ruang batin yang paling mungkin, sementara “dengan” memperjelas hubungan kalimat secara alami.
- source_word: τὸ εὐάρεστον ἐνώπιον αὐτοῦ
  choice: apa yang berkenan di hadapan-Nya
  rationale: Menerjemahkan adjektiva yang disubstantifkan secara idiomatis dan mempertahankan sudut pandang penilaian Allah.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: melalui Yesus Sang Mesias
  rationale: διά menyatakan perantaraan; Χριστός dipertahankan sebagai gelar “Sang Mesias” dalam ungkapan teologis ini.
- source_word: ᾧ ἡ δόξα
  choice: yang bagi-Nya kemuliaan
  rationale: Konstruksi relatif dipertahankan sehingga rujukan ᾧ tidak ditentukan secara eksplisit melampaui teks Yunani.
- source_word: εἰς τοὺς αἰῶνας
  choice: sampai selama-lamanya
  rationale: Ungkapan idiomatis ini menyatakan durasi tanpa akhir dalam bahasa Indonesia yang wajar dan bermartabat.
theological_decisions:
- issue: Rujukan kata ganti relatif ᾧ dalam doksologi
  choice: Dibiarkan sebagai klausa relatif “yang bagi-Nya kemuliaan”
  alternative: Menentukan bahwa kemuliaan ditujukan secara khusus kepada Yesus Sang Mesias atau kepada Allah, subjek doa berkat
  rationale: Secara tata bahasa, ᾧ dapat merujuk kepada Yesus Sang Mesias yang disebut paling dekat, tetapi dapat pula dipahami kembali kepada Allah sebagai pelaku utama doa. Terjemahan mempertahankan ketegangan ini dan menjelaskannya dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Huruf kapital pada pronomina ilahi mengikuti kebiasaan formal Indonesia; “Sang Mesias” mempertahankan Χριστός sebagai gelar. Penanda catatan kaki ditempatkan setelah ayat, tetapi catatannya menjelaskan klausa “yang bagi-Nya kemuliaan”.
