  text: οὐ γὰρ ἔχομεν ὧδε μένουσαν πόλιν, ἀλλὰ τὴν μέλλουσαν ἐπιζητοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/014.yaml
  text: For we do not have a lasting city here[a], but we seek the one that is to come.
translation:
  language: id
  text: Sebab di sini kita tidak mempunyai kota yang tetap, tetapi kita mencari kota yang akan datang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Sebab ... tidak
  rationale: γάρ menghubungkan ayat ini sebagai alasan atau penjelasan bagi nasihat sebelumnya, sedangkan οὐ menegasikan klausa secara langsung.
- source_word: ἔχομεν
  choice: kita mempunyai
  rationale: Bentuk kini indikatif ini paling wajar diterjemahkan dengan kata umum 'mempunyai'.
- source_word: ὧδε
  choice: di sini
  rationale: Adverbia deiktis ini berarti 'di sini'; menerjemahkannya sebagai 'di bumi' akan mempersempit makna berdasarkan penafsiran konteks.
- source_word: μένουσαν
  choice: yang tetap
  rationale: Partisipel kini yang menerangkan πόλιν menyatakan kota yang bertahan atau terus ada; 'yang tetap' alami dalam bahasa Indonesia dan mempertahankan kontras dengan kota yang akan datang.
- source_word: πόλιν
  choice: kota
  rationale: Nomina konkret ini dipertahankan secara langsung tanpa menggantinya dengan tafsiran seperti 'tanah air' atau 'surga'.
- source_word: ἀλλὰ
  choice: tetapi
  rationale: Konjungsi ini menandai kontras kuat antara tidak adanya kota yang tetap di sini dan pencarian akan kota mendatang.
- source_word: τὴν μέλλουσαν
  choice: kota yang akan datang
  rationale: Partisipel feminin ini merujuk kembali kepada πόλιν. Pengulangan 'kota' terdengar jelas dan alami dalam bahasa Indonesia serta mempertahankan orientasi masa depan dari μέλλω.
- source_word: ἐπιζητοῦμεν
  choice: kita mencari
  rationale: ἐπιζητέω berarti mencari atau mengupayakan dengan sungguh-sungguh. 'Mencari' jelas dan alami, tanpa menambahkan tingkat intensitas yang tidak harus dinyatakan secara eksplisit.
theological_decisions:
- issue: Hakikat gambaran 'kota'
  choice: Mempertahankan kata 'kota' sebagai gambaran tekstual tentang tempat atau tatanan masa depan yang dicari orang percaya.
  alternative: surga; kota surgawi; Yerusalem surgawi
  rationale: Ayat ini sendiri hanya menyebut kota yang tidak tetap di sini dan kota yang akan datang. Walaupun bagian lain dalam Ibrani mengembangkan gambaran kota surgawi, terjemahan tidak memasukkan penamaan yang tidak eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan klausa mengikuti hubungan alasan dan kontras dalam teks Yunani. Tidak diperlukan catatan kaki karena frasa 'kota yang akan datang' sudah menerjemahkan τὴν μέλλουσαν secara langsung dan alami.
