  text: And I urge you all the more to do this[a], so that I may be restored to you sooner.
translation:
  language: id
  text: Dan aku lebih sungguh-sungguh lagi memohon kepada kalian untuk melakukan hal ini, supaya aku dapat lebih cepat dikembalikan kepada kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dipulihkan kepada kalian.” Kata Yunani ini secara umum dapat menunjuk pada kembalinya penulis kepada para pembaca tanpa menjelaskan keadaan yang melatarbelakanginya.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσοτέρως
  choice: semakin
  rationale: Adverbia komparatif ini memperkuat permohonan dengan tetap mempertahankan daya bandingnya dalam bahasa Indonesia yang wajar.
- source_word: δὲ
  choice: Dan
  rationale: Partikel ini bersifat penghubung ringan dalam konteks tersebut, bukan pertentangan yang kuat.
- source_word: παρακαλῶ
  choice: aku mendesak
  rationale: Kata kerja ini menyatakan permohonan yang sungguh-sungguh; 'mendesak' mempertahankan kekuatan seruannya.
- source_word: τοῦτο ποιῆσαι
  choice: untuk melakukan hal ini
  rationale: Frasa ini menunjuk kembali kepada permintaan agar para pembaca berdoa dalam ayat sebelumnya.
- source_word: ἵνα
  choice: supaya
  rationale: Konjungsi ini memperkenalkan tujuan yang diharapkan dari permohonan tersebut.
- source_word: τάχιον
  choice: lebih cepat
  rationale: Adverbia komparatif ini berarti 'lebih cepat' atau 'lebih segera'; pilihan ini alami bersama verba pasif berikutnya.
- source_word: ἀποκατασταθῶ
  choice: aku dapat ... dipulihkan
  rationale: Bentuk pasif ini dapat berarti dipulihkan atau dikembalikan. 'Dipulihkan' mempertahankan bentuk pasif dan keluasan makna tanpa menentukan keadaan yang dimaksud.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: Pronomina datif jamak menunjukkan arah atau relasi kepada seluruh kelompok pembaca; 'kalian' menyatakan kemajemukannya dengan jelas.
theological_decisions:
- issue: Makna pemulihan yang diharapkan penulis
  choice: Penulis berharap dipulihkan kepada para pembaca tanpa menyebutkan keadaan tertentu.
  alternative: Dibebaskan dari penjara, kembali dari perjalanan atau perpisahan, atau dipulihkan untuk melayani di tengah mereka.
  rationale: Ungkapan Yunani ἀποκατασταθῶ ὑμῖν tidak menjelaskan penyebab keterpisahan atau bentuk pemulihannya, sehingga terjemahan tidak menetapkan skenario historis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'aku–kalian' dipakai untuk mencerminkan orang pertama tunggal dan orang kedua jamak secara jelas. Susunan kalimat mempertahankan hubungan dengan permintaan doa pada ayat sebelumnya dan tidak mempersempit keadaan historis penulis.
