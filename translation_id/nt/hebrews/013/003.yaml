  text: μιμνῄσκεσθε τῶν δεσμίων ὡς συνδεδεμένοι, τῶν κακουχουμένων ὡς καὶ αὐτοὶ ὄντες ἐν σώματι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/003.yaml
  text: Remember those in prison[a], as though imprisoned with them; those who are mistreated[b], since you yourselves also are in the body.
translation:
  language: id
  text: Ingatlah para tahanan[a], seolah-olah kalian turut terbelenggu bersama mereka, dan orang-orang yang diperlakukan dengan buruk, karena kalian sendiri juga berada dalam tubuh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka yang terbelenggu.” Dalam frasa berikutnya, bahasa Yunani secara harfiah menggambarkan diri sebagai orang yang terbelenggu bersama mereka.
    reason: lexical_alternative
  - marker: b
    text: “Dalam tubuh” mungkin juga dipahami sebagai rujukan kepada keanggotaan dalam tubuh Kristus. Namun, dalam konteks ini ungkapan tersebut lebih mungkin menunjuk kepada keadaan jasmani manusia yang sama-sama rentan terhadap penderitaan.
    reason: alternative_reading
lexical_decisions:
- source_word: μιμνῄσκεσθε
  choice: Ingatlah
  rationale: Imperatif kini ini menyerukan ingatan yang terus diwujudkan dalam kepedulian. “Ingatlah” alami dalam bahasa Indonesia dan dapat memuat daya berkelanjutan dari konteks.
- source_word: τῶν δεσμίων
  choice: mereka yang dipenjarakan
  rationale: δέσμιος menunjuk kepada orang yang terbelenggu atau menjadi tahanan. Pilihan ini jelas dan alami, sementara catatan kaki mempertahankan gambaran harfiah tentang ikatan.
- source_word: ὡς συνδεδεμένοι
  choice: seolah-olah kamu dipenjarakan bersama mereka
  rationale: συνδέομαι secara harfiah membangkitkan gambaran terikat bersama. Ungkapan ini menyampaikan solidaritas dan penghayatan akan keadaan para tahanan tanpa menyatakan bahwa pembaca benar-benar sedang ditahan.
- source_word: τῶν κακουχουμένων
  choice: mereka yang diperlakukan dengan buruk
  rationale: κακουχέομαι berarti mengalami perlakuan buruk, penindasan, atau penderitaan yang ditimpakan pihak lain. Terjemahan ini mempertahankan nuansa pasif dan mudah dipahami.
- source_word: ὡς καὶ αὐτοὶ ὄντες ἐν σώματι
  choice: karena kamu sendiri juga hidup dalam tubuh
  rationale: Frasa ἐν σώματι secara harfiah berarti “dalam tubuh”. Penambahan “hidup” menghasilkan bahasa Indonesia yang wajar tanpa mengubah rujukan dasarnya kepada keberadaan jasmani; catatan kaki menjaga kemungkinan nuansa tubuh Kristus.
theological_decisions:
- issue: Makna ἐν σώματι (“dalam tubuh”)
  choice: keadaan manusia yang sama-sama hidup secara jasmani dan rentan terhadap penderitaan
  alternative: keanggotaan dalam tubuh Kristus
  rationale: Dalam konteks, nasihat untuk bersimpati kepada orang yang diperlakukan buruk paling wajar didasarkan pada kerentanan jasmani yang juga dialami pembaca. Namun, ungkapan “dalam tubuh” dipertahankan dan kemungkinan nuansa gerejawi dicatat agar ketegangan penafsirannya tidak ditutup.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang lugas dan bermartabat. Pengulangan “Ingatlah” memperjelas struktur eliptis Yunani dan membuat kedua sasaran kepedulian terbaca alami. Penanda catatan kaki [a] dan [b] ditempatkan tepat pada frasa yang dijelaskan.
