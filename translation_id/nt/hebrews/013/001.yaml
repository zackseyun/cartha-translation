  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἡ φιλαδελφία μενέτω.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/001.yaml
  text: Let brotherly love continue[a].
translation:
  language: id
  text: Hendaklah kasih persaudaraan tetap ada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kasih kepada sesama orang percaya”; istilah Yunani ini menunjuk pada kasih kekeluargaan di dalam komunitas Kristen, bukan hanya kasih kepada laki-laki.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλαδελφία
  choice: kasih persaudaraan
  rationale: Istilah ini secara harfiah mengungkapkan kasih dalam hubungan saudara dan, dalam pemakaian Kristen mula-mula, menunjuk pada kasih kekeluargaan di antara sesama orang percaya. Frasa ini mempertahankan metafora keluarga sekaligus tidak membatasinya hanya kepada laki-laki.
- source_word: μενέτω
  choice: hendaklah ... tetap ada
  rationale: Bentuk imperatif kini aktif menuntut agar keadaan yang sudah ada terus berlangsung. Ungkapan ini menyampaikan baik daya perintah maupun nuansa keberlanjutannya secara alami dalam bahasa Indonesia.
- source_word: Ἡ
  choice: diserap dalam frasa nominal
  rationale: Artikel Yunani menandai kasih persaudaraan sebagai kebajikan tertentu yang sudah dikenal para pembaca. Bahasa Indonesia tidak memerlukan padanan artikel tersendiri dalam nasihat ini.
theological_decisions:
- issue: Cakupan φιλαδελφία dan bahasa kekeluargaan
  choice: kasih persaudaraan
  alternative: kasih kepada sesama orang percaya; kasih satu sama lain
  rationale: Pilihan ini mempertahankan gambaran keluarga dalam bahasa Yunani tanpa menyiratkan bahwa kasih tersebut hanya berlaku bagi laki-laki. Catatan kaki menjelaskan cakupan komunitas orang percaya.
translation_notes:
  register: Bahasa Indonesia baku yang modern, ringkas, dan bermartabat. Bentuk “hendaklah” mempertahankan nada nasihat imperatif, sedangkan “tetap ada” menonjolkan keberlanjutan kasih yang sudah dikenal dalam komunitas.
