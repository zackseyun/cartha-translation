  text: Μνημονεύετε τῶν ἡγουμένων ὑμῶν, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς μιμεῖσθε τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/007.yaml
  text: Remember your leaders[a], who spoke the word of God to you. As you consider the outcome of their way of life[b], imitate their faith.
translation:
  language: id
  text: Ingatlah para pemimpin kalian, yang telah menyampaikan firman Allah kepada kalian. Dengan memperhatikan hasil akhir dari cara hidup mereka[a], teladanilah iman mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hasil akhir” juga dapat diterjemahkan “kesudahan”; menurut sebagian penafsiran, kata ini secara khusus menunjuk kepada cara mereka meninggal.
    reason: lexical_alternative
  - marker: b
    text: Atau “kesetiaan mereka”. Kata Yunani yang dipakai dapat berarti iman atau kesetiaan.
    reason: alternative_reading
lexical_decisions:
- source_word: Μνημονεύετε
  choice: Ingatlah
  rationale: Bentuk imperatif kini menyerukan ingatan yang terus dipelihara. “Ingatlah” merupakan ungkapan Indonesia yang alami dan dapat memuat daya berkelanjutan itu dalam konteks.
- source_word: τῶν ἡγουμένων ὑμῶν
  choice: para pemimpin kalian
  rationale: Istilah ini menunjuk kepada para pemimpin yang diakui dalam komunitas. “Pemimpin” mempertahankan unsur kewenangan tanpa kesan politis yang tidak diperlukan; “kalian” memperjelas bahwa penerimanya jamak.
- source_word: οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ
  choice: yang telah menyampaikan firman Allah kepada kalian
  rationale: “Menyampaikan” secara alami menggambarkan tindakan mengomunikasikan firman Allah kepada jemaat, sedangkan “firman Allah” mempertahankan ungkapan genitif dan idiom alkitabiah.
- source_word: ἀναθεωροῦντες
  choice: Sambil memperhatikan
  rationale: Partisip ini menyatakan pengamatan dan perenungan yang sungguh-sungguh serta berhubungan dengan perintah untuk meneladani.
- source_word: τὴν ἔκβασιν
  choice: hasil akhir
  rationale: ἔκβασις dapat berarti hasil, kesudahan, atau akhir. “Hasil akhir” cukup luas untuk menunjuk kepada ujung atau hasil kehidupan mereka tanpa memastikan bahwa yang dimaksud khususnya ialah kematian.
- source_word: τῆς ἀναστροφῆς
  choice: cara hidup mereka
  rationale: ἀναστροφή menunjuk kepada perilaku atau cara menjalani kehidupan. Ungkapan ini alami dalam bahasa Indonesia dan mencakup kelakuan serta pola hidup.
- source_word: μιμεῖσθε
  choice: teladanilah
  rationale: Imperatif ini memerintahkan pembaca untuk meniru. “Teladanilah” lebih alami dan bermartabat daripada terjemahan harfiah “tirulah” ketika objeknya adalah iman para pemimpin.
- source_word: τὴν πίστιν
  choice: iman mereka
  rationale: πίστις dapat berarti iman atau kesetiaan. Sesuai padanan utama proyek dan tanpa tuntutan konteks yang menentukan salah satunya, teks utama memakai “iman” dan mencatat alternatifnya.
theological_decisions:
- issue: Makna πίστις sebagai sesuatu pada manusia yang patut diteladani
  choice: iman
  alternative: kesetiaan
  rationale: Baik iman maupun kesetiaan masuk akal dalam konteks para pemimpin yang patut diteladani. Teks utama mempertahankan padanan umum “iman”, sedangkan catatan kaki menjaga kemungkinan “kesetiaan” agar ketegangan makna tidak dihapus.
- issue: Apakah ἔκβασις secara khusus menunjuk kepada kematian atau kemartiran para pemimpin
  choice: hasil akhir
  alternative: kesudahan; cara kematian mereka
  rationale: Kata Yunani ini dapat menunjuk kepada hasil atau akhir, dan konteks mungkin mencakup akhir kehidupan mereka. Namun, ayat ini tidak secara eksplisit menyatakan kematian atau kemartiran, sehingga terjemahan utama tidak mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Bentuk “kalian” dipakai untuk menyatakan jamak yang eksplisit dalam bahasa Yunani. Susunan partisip dipertahankan secara alami dengan “sambil”, dan kedua ketidakpastian leksikal utama dijaga melalui catatan kaki.
