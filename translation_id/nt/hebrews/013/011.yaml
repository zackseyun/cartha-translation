source:
  edition: SBLGNT
  text: ὧν γὰρ εἰσφέρεται ζῴων τὸ αἷμα περὶ ἁμαρτίας εἰς τὰ ἅγια διὰ τοῦ ἀρχιερέως, τούτων τὰ σώματα κατακαίεται ἔξω τῆς παρεμβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/011.yaml
  text: For the bodies of those animals whose blood is brought into the holy places for sin by the high priest are burned outside the camp[a][b].
translation:
  language: id
  text: Sebab tubuh hewan-hewan yang darahnya dibawa oleh imam besar ke dalam tempat-tempat kudus sehubungan dengan dosa, dibakar di luar perkemahan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke tempat kudus.” Secara harfiah, bahasa Yunani berbunyi “ke tempat-tempat kudus,” suatu ungkapan ritual untuk kawasan suci tempat ibadah.
    reason: lexical_alternative
  - marker: b
    text: Atau “dibakar habis.” Kata kerjanya dapat menekankan pembakaran sampai tuntas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ... ζῴων / τούτων τὰ σώματα
  choice: tubuh hewan-hewan yang ...
  rationale: Konstruksi relatif dan resumptif Yunani menunjuk secara umum kepada hewan-hewan kurban. Susunan ini alami dalam bahasa Indonesia dan tetap memperlihatkan hubungan antara darah dan tubuh hewan yang sama.
- source_word: γὰρ
  choice: Sebab
  rationale: Partikel ini memberikan alasan atau penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan kaitan logis tersebut.
- source_word: εἰσφέρεται
  choice: dibawa masuk
  rationale: Bentuk pasif kini menggambarkan darah yang dibawa ke dalam kawasan tempat kudus; “dibawa masuk” jelas dan idiomatis.
- source_word: τὸ αἷμα
  choice: darah
  rationale: Istilah ini secara langsung menunjuk kepada darah kurban dan tidak perlu diparafrasakan.
- source_word: περὶ ἁμαρτίας
  choice: untuk penghapusan dosa
  rationale: Dalam konteks kurban, frasa ini menyatakan tujuan penanganan dosa. Pilihan ini lebih alami daripada “mengenai dosa” tanpa mempersempitnya secara eksplisit menjadi nama jenis kurban tertentu.
- source_word: εἰς τὰ ἅγια
  choice: ke tempat-tempat kudus
  rationale: Bentuk jamak Yunani dipertahankan dan menunjuk kepada kawasan suci tempat ibadah tanpa membatasinya secara tidak perlu hanya pada Ruang Mahakudus.
- source_word: διὰ τοῦ ἀρχιερέως
  choice: oleh imam besar
  rationale: διά dengan genitif di sini menyatakan pelaku perantaraan dalam tindakan ritual; bentuk pasif Indonesia secara alami memakai “oleh”.
- source_word: κατακαίεται
  choice: dibakar
  rationale: Kata kerja ini menyatakan pembakaran dan dapat mengandung nuansa dibakar habis. Terjemahan utama memakai ungkapan yang alami, sementara nuansa intensif dicatat dalam catatan kaki.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: di luar perkemahan
  rationale: Ungkapan ini tepat untuk perkemahan Israel dalam latar kemah suci dan mempertahankan gambaran ritual yang dipakai surat Ibrani.
theological_decisions:
- issue: Cakupan εἰς τὰ ἅγια
  choice: ke tempat-tempat kudus
  alternative: ke tempat kudus; ke Ruang Mahakudus
  rationale: Pemakaian bentuk jamak dalam surat Ibrani dapat menunjuk kepada kawasan kudus secara umum. Terjemahan tidak mempersempit acuannya menjadi Ruang Mahakudus meskipun latarnya berkaitan dengan ritual pendamaian.
- issue: Makna kultis περὶ ἁμαρτίας
  choice: untuk penghapusan dosa
  alternative: karena dosa; sebagai kurban penghapus dosa
  rationale: Frasa itu menghubungkan tindakan ritual dengan dosa, tetapi tidak secara eksplisit memakai kata benda “kurban.” Pilihan utama menyampaikan fungsi ritual tanpa menambahkan klasifikasi yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ritual dibuat jelas bagi pembaca umum sambil mempertahankan bentuk jamak “tempat-tempat kudus” dan gambaran “di luar perkemahan.”
