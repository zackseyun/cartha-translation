  text: γινώσκετε τὸν ἀδελφὸν ⸀ἡμῶν Τιμόθεον ἀπολελυμένον, μεθ’ οὗ ἐὰν τάχιον ἔρχηται ὄψομαι ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/023.yaml
  text: Know that our brother Timothy has been released[a], with whom I will see you if he comes soon.
translation:
  language: id
  text: Ketahuilah bahwa saudara kita, Timotius, telah dibebaskan.[a] Jika ia segera datang, saya akan menemui kalian bersamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah dilepaskan”; mungkin dari tahanan. Kata kerja ini juga dapat berarti “telah diizinkan pergi” atau “telah diberhentikan,” tetapi “telah dibebaskan” paling sesuai dengan konteks yang mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: Ketahuilah
  rationale: Imperatif kini jamak ini berfungsi memberitahukan sesuatu kepada para penerima surat. “Ketahuilah” mempertahankan bentuk imperatif dan tetap wajar dalam ragam surat yang bermartabat.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: saudara kita
  rationale: Ungkapan kekeluargaan yang lazim di kalangan orang percaya; bentuk maskulin tunggal secara khusus merujuk kepada Timotius.
- source_word: Τιμόθεον
  choice: Timotius
  rationale: Nama pribadi disesuaikan dengan bentuk yang sudah mapan dalam bahasa Indonesia.
- source_word: ἀπολελυμένον
  choice: telah dibebaskan
  rationale: Partisip perfek pasif dari ἀπολύω menyatakan tindakan yang sudah selesai dan hasilnya masih berlaku. Dalam konteks ini, pembebasan dari tahanan atau kurungan paling mungkin, tetapi kemungkinan arti lain dicatat dalam catatan kaki.
- source_word: μεθ’ οὗ
  choice: bersama dia
  rationale: Merujuk kepada Timotius sebagai orang yang akan menyertai penulis ketika menemui para penerima surat; susunan klausa diubah secara wajar dalam bahasa Indonesia tanpa menghilangkan hubungan tersebut.
- source_word: ἐὰν τάχιον ἔρχηται
  choice: Jika ia segera datang
  rationale: Klausa ini menyatakan syarat mengenai kedatangan Timotius. τάχιον berbentuk komparatif, tetapi dalam konteks ini secara idiomatis berarti “segera” atau “dalam waktu dekat.”
- source_word: ὄψομαι ὑμᾶς
  choice: saya akan menemui kalian
  rationale: Kata kerja ini secara harfiah berarti “saya akan melihat kalian,” tetapi dalam konteks perjalanan untuk berjumpa, “menemui” menyampaikan maksudnya secara alami tanpa mempertegasnya menjadi “mengunjungi.” “Kalian” mempertahankan bentuk orang kedua jamak.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat yang lugas dan bermartabat. Pronomina “saya” dan “kalian” dipakai untuk membedakan orang pertama tunggal dari orang kedua jamak secara alami. Susunan kalimat kedua dibuat idiomatis sambil mempertahankan syarat kedatangan Timotius dan rencana penulis untuk menemui para penerima bersama dia.
