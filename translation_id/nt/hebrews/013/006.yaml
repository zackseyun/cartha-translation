  text: so that we confidently say[a], “The Lord is my helper; I will not be afraid[b]. What can man do to me?”
translation:
  language: id
  text: Dengan demikian, dengan berani kita berkata, “Tuhan adalah penolongku; aku tidak akan takut. Apa yang dapat dilakukan manusia kepadaku?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Dengan demikian
  rationale: Menandai hasil atau kesimpulan dari pernyataan sebelumnya secara alami dalam bahasa Indonesia.
- source_word: θαρροῦντας ἡμᾶς λέγειν
  choice: kita dengan berani berkata
  rationale: Partisip θαρροῦντας menyatakan keberanian atau keyakinan; susunan ini mempertahankan konstruksi tanpa menambahkan modalitas seperti 'dapat'.
- source_word: Κύριος
  choice: Tuhan
  rationale: Padanan baku dan wajar bagi κύριος sebagai sebutan ilahi dalam konteks kutipan Kitab Suci.
- source_word: ἐμοὶ βοηθός
  choice: penolongku
  rationale: Datif ἐμοὶ dengan nomina predikatif βοηθός secara idiomatis berarti penolong bagiku; bentuk posesif Indonesia ringkas dan alami.
- source_word: οὐ φοβηθήσομαι
  choice: aku tidak akan takut
  rationale: Mempertahankan bentuk futur dan menghasilkan ungkapan Indonesia yang lugas.
- source_word: τί ποιήσει μοι ἄνθρωπος
  choice: Apa yang dapat dilakukan manusia terhadapku?
  rationale: Pertanyaan retoris dengan bentuk futur menyiratkan terbatasnya ancaman manusia; 'dapat dilakukan' menyampaikan daya retoris itu secara alami, sedangkan 'manusia' mempertahankan acuan generik tunggal.
theological_decisions:
- issue: Acuan generik ἄνθρωπος
  choice: manusia
  alternative: seorang manusia; orang
  rationale: '''Manusia'' bersifat generik dan inklusif secara alami dalam bahasa Indonesia tanpa membatasi acuan kepada laki-laki.'
- issue: Daya retoris bentuk futur ποιήσει
  choice: Apa yang dapat dilakukan manusia terhadapku?
  alternative: Apa yang akan dilakukan manusia terhadapku?
  rationale: '''Dapat'' mengungkapkan maksud retoris bahwa ancaman manusia terbatas, sementara alternatif ''akan'' lebih formal mengikuti bentuk futur Yunani tetapi kurang alami dalam ungkapan ini.'
- issue: Sikap pembicara dalam θαρροῦντας
  choice: dengan berani
  alternative: dengan penuh keyakinan
  rationale: '''Dengan berani'' mempertahankan unsur keberanian menghadapi ancaman tanpa mengubahnya menjadi kepastian doktrinal yang lebih abstrak.'
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Pronomina 'aku' dipertahankan dalam kutipan pribadi dari Mazmur, sedangkan 'kita' mewakili komunitas pembaca. Tanda baca mengikuti kebiasaan Indonesia modern.
