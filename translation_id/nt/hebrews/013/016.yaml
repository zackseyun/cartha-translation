  text: τῆς δὲ εὐποιΐας καὶ κοινωνίας μὴ ἐπιλανθάνεσθε, τοιαύταις γὰρ θυσίαις εὐαρεστεῖται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/016.yaml
  text: And do not neglect doing good and sharing[b][a], for with such sacrifices God is pleased.
translation:
  language: id
  text: Dan janganlah lupa[a] berbuat baik dan berbagi[b], karena Allah berkenan kepada kurban-kurban semacam itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “janganlah mengabaikan.” Kata kerja Yunani secara harfiah berarti “janganlah lupa,” tetapi dalam konteks nasihat ini juga menyiratkan kelalaian untuk melakukan hal-hal tersebut.
    reason: lexical_alternative
  - marker: b
    text: “Berbagi” juga dapat diterjemahkan “persekutuan” atau “kemurahan hati.” Dalam konteks ini, kemungkinan besar yang dimaksud ialah berbagi secara nyata dengan orang lain, termasuk berbagi sumber daya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐποιΐας
  choice: berbuat baik
  rationale: Nomina ini menunjuk pada tindakan aktif melakukan kebaikan. Ungkapan verbal “berbuat baik” alami dalam bahasa Indonesia modern dan mempertahankan daya tindakan dalam istilah Yunani.
- source_word: κοινωνίας
  choice: berbagi
  rationale: Dalam pasangan dengan εὐποιΐας dan dalam konteks “kurban-kurban,” kata ini paling wajar menunjuk pada tindakan berbagi secara nyata, termasuk berbagi sumber daya, tanpa membatasinya hanya pada sumbangan uang.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: janganlah lupa
  rationale: Pilihan ini mempertahankan arti dasar verba Yunani sekaligus merupakan nasihat yang alami dalam bahasa Indonesia; dalam konteksnya, “lupa” mencakup kelalaian untuk melakukannya.
- source_word: τοιαύταις ... θυσίαις
  choice: kurban-kurban seperti itu
  rationale: Terjemahan ini mempertahankan secara jelas metafora persembahan kultis yang diterapkan pada perbuatan baik dan berbagi.
- source_word: εὐαρεστεῖται
  choice: berkenan
  rationale: “Berkenan” menyampaikan bahwa Allah merasa senang atau menerima dengan baik, serta sesuai dengan laras Alkitab yang tetap mudah dipahami.
- source_word: ὁ θεός
  choice: Allah
  rationale: Padanan baku dan alami dalam bahasa Indonesia untuk subjek ilahi dalam ayat ini.
- source_word: δὲ
  choice: Dan
  rationale: Partikel ini menghubungkan nasihat tersebut dengan konteks sebelumnya tanpa menunjukkan pertentangan yang kuat.
theological_decisions:
- issue: Hakikat “kurban-kurban” dalam ayat ini
  choice: Perbuatan baik dan berbagi disebut secara metaforis sebagai kurban yang diperkenan Allah.
  alternative: Memahaminya hanya sebagai sedekah pengganti ibadah kurban, atau menghilangkan seluruh nuansa kurban dan menjadikannya sekadar perilaku etis.
  rationale: Kata Yunani θυσίαις secara eksplisit memakai bahasa kurban. Terjemahan mempertahankan metafora itu tanpa mempersempitnya hanya pada sedekah dan tanpa menghapus nuansa ibadahnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Janganlah lupa” mempertahankan gambaran sumber Yunani dan tetap idiomatis; “kurban” mempertahankan nuansa teologis-kultis tanpa penjelasan denominatif.
