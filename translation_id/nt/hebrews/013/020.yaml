source:
  edition: SBLGNT
  text: Ὁ δὲ θεὸς τῆς εἰρήνης, ὁ ἀναγαγὼν ἐκ νεκρῶν τὸν ποιμένα τῶν προβάτων τὸν μέγαν ἐν αἵματι διαθήκης αἰωνίου, τὸν κύριον ἡμῶν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/020.yaml
  text: May the God of peace[a], who brought up from the dead our Lord Jesus, the great shepherd of the sheep, by the blood of an eternal covenant,
translation:
  language: id
  text: Semoga Allah sumber damai sejahtera—yang oleh darah suatu perjanjian kekal telah membawa kembali Tuhan kita Yesus dari antara orang mati, Gembala Agung segala domba[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang telah membawa kembali Tuhan kita Yesus dari antara orang mati, Gembala Agung segala domba, melalui darah perjanjian kekal.” Susunan bahasa Yunani memungkinkan frasa “oleh/melalui darah perjanjian kekal” dipahami dalam beberapa hubungan yang sedikit berbeda.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ δὲ
  choice: Semoga
  rationale: δέ menandai peralihan menuju doa berkat dan tidak perlu diterjemahkan dengan kata waktu. Bentuk optatif Indonesia diperlukan karena ayat 20 berlanjut ke permohonan pada ayat 21.
- source_word: θεὸς τῆς εἰρήνης
  choice: Allah sumber damai sejahtera
  rationale: Genitif ini menggambarkan Allah sebagai Allah yang dicirikan oleh dan mengaruniakan damai. Ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa Allah sekadar bersifat tenang.
- source_word: ὁ ἀναγαγὼν ἐκ νεκρῶν
  choice: yang ... telah membawa kembali dari antara orang mati
  rationale: ἀνάγω mempertahankan gambaran membawa atau menuntun kembali, sedangkan ἐκ νεκρῶν merupakan rumusan kebangkitan yang secara idiomatis berarti dari antara orang mati.
- source_word: τὸν ποιμένα τῶν προβάτων τὸν μέγαν
  choice: Gembala Agung segala domba
  rationale: Mempertahankan metafora gembala dan penekanan pada kebesaran-Nya. 'Segala domba' lebih alami daripada pengulangan konstruksi posesif yang kaku.
- source_word: ἐν αἵματι
  choice: oleh darah
  rationale: ἐν dapat menyatakan sarana atau dasar. 'Oleh darah' ringkas dan tetap membiarkan hubungan tepat frasa ini terbuka sebagaimana dalam bahasa Yunani.
- source_word: διαθήκης αἰωνίου
  choice: suatu perjanjian kekal
  rationale: διαθήκη dalam Ibrani merujuk pada perjanjian ilahi; bentuk tanpa artikel dipertahankan dengan 'suatu', tanpa menutup kemungkinan bahwa yang dimaksud ialah perjanjian yang telah dikenal pembaca.
- source_word: τὸν κύριον ἡμῶν Ἰησοῦν
  choice: Tuhan kita Yesus
  rationale: Mengikuti susunan identifikasi Yunani dan mempertahankan gelar κύριος sebagai 'Tuhan'.
theological_decisions:
- issue: Hubungan frasa ἐν αἵματι διαθήκης αἰωνίου dengan unsur lain dalam kalimat
  choice: 'Ditempatkan bersama tindakan Allah membawa Yesus kembali dari antara orang mati: ''yang oleh darah suatu perjanjian kekal telah membawa kembali ...'''
  alternative: 'Dihubungkan terutama dengan ''Gembala Agung segala domba'': ''Gembala Agung segala domba oleh/dalam darah suatu perjanjian kekal'''
  rationale: Letak frasa Yunani memungkinkan lebih dari satu hubungan sintaksis. Teks utama memakai pembacaan instrumental yang paling wajar, sementara catatan kaki mempertahankan ambiguitas asli tanpa menjabarkan mekanisme teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda pisah membantu pembaca mengikuti klausa panjang yang merupakan awal doa berkat dan berlanjut pada ayat 21. Kapitalisasi 'Gembala Agung' menandai gelar deskriptif bagi Yesus tanpa menambahkan doktrin.
