revisions:
- from: Karena itu, melalui Dia, marilah kita senantiasa mempersembahkan kepada Allah kurban pujian, yaitu buah bibir yang mengakui nama-Nya.[a]
  to: Karena itu, melalui Dia marilah kita senantiasa mempersembahkan kepada Allah kurban pujian, yaitu ucapan bibir yang mengakui nama-Nya.[a]
  rationale: The revision replaces “buah bibir,” whose common modern Indonesian idiomatic meaning is misleading here, with “ucapan bibir,” an idiomatic rendering that retains the sense of verbal expression from the lips. The translation continues to preserve the verse’s sacrificial metaphor in “kurban pujian” and its open-confession nuance in “mengakui nama-Nya.”
