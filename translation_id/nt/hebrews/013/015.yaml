  text: δι’ αὐτοῦ ⸀οὖν ἀναφέρωμεν θυσίαν αἰνέσεως διὰ παντὸς τῷ θεῷ, τοῦτ’ ἔστιν καρπὸν χειλέων ὁμολογούντων τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/015.yaml
  text: Therefore[a], through him let us continually offer up to God a sacrifice of praise—that is[c][b], the fruit of lips confessing his name.
translation:
  language: id
  text: Karena itu, melalui Dia marilah kita senantiasa mempersembahkan kepada Allah kurban pujian, yaitu ucapan bibir yang mengakui nama-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang mengakui nama-Nya secara terbuka.” Kata Yunani ini dapat berarti mengakui atau menyatakan pengakuan secara terbuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: melalui Dia
  rationale: διά dengan bentuk genitif menyatakan perantaraan atau sarana. “Melalui Dia” mempertahankan peran Kristus sebagai pengantara dalam konteks tanpa mengganti pronomina dengan nama yang tidak tertulis dalam ayat ini.
- source_word: οὖν
  choice: Karena itu
  rationale: Partikel ini menandai kesimpulan atau ajakan yang ditarik dari uraian sebelumnya.
- source_word: ἀναφέρωμεν
  choice: marilah kita ... mempersembahkan
  rationale: Subjungtif hortatoris orang pertama jamak menyampaikan ajakan bersama. “Mempersembahkan” mempertahankan nuansa ibadah dan kurban.
- source_word: θυσίαν αἰνέσεως
  choice: kurban pujian
  rationale: Ungkapan ini mempertahankan gambaran kurban sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: διὰ παντός
  choice: senantiasa
  rationale: Frasa ini berarti terus-menerus atau setiap waktu; “senantiasa” ringkas, alami, dan sesuai dengan ragam bahasa yang khidmat.
- source_word: τῷ θεῷ
  choice: kepada Allah
  rationale: Bentuk datif menunjukkan penerima persembahan.
- source_word: τοῦτ’ ἔστιν
  choice: yaitu
  rationale: Ungkapan ini memperkenalkan penjelasan tentang apa yang dimaksud dengan kurban pujian.
- source_word: καρπὸν χειλέων
  choice: buah bibir
  rationale: Terjemahan ini mempertahankan metafora dan gema ungkapan Kitab Suci. Kata “kita” tidak ditambahkan karena tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: ὁμολογούντων τῷ ὀνόματι αὐτοῦ
  choice: yang mengakui nama-Nya
  rationale: Partisip ini menerangkan “bibir” dan menyatakan pengakuan terbuka. Susunan Indonesia dibuat idiomatis sambil mempertahankan personifikasi dalam teks sumber.
theological_decisions:
- issue: Rujukan pronomina dalam δι’ αὐτοῦ
  choice: Pronomina dipertahankan sebagai “Dia”; dalam konteksnya, rujukannya adalah Yesus Kristus sebagai pengantara.
  alternative: Mengeksplisitkan “melalui Yesus” atau “melalui Kristus”.
  rationale: Konteks langsung menunjuk kepada Yesus, tetapi teks ayat ini sendiri memakai pronomina. Mempertahankan pronomina menjaga kepaduan konteks dan menghindari penambahan yang tidak diperlukan.
- issue: Daya gambaran kurban
  choice: Mempertahankan “mempersembahkan” dan “kurban pujian”.
  alternative: Meratakannya menjadi “teruslah memuji Allah”.
  rationale: Bahasa kurban disengaja dan menghubungkan pujian dengan pembahasan persembahan serta pelayanan imamat dalam Surat Ibrani; gambaran ini tidak boleh dihilangkan.
- issue: Makna ὁμολογούντων
  choice: “mengakui” dipakai dengan arti pengakuan terbuka terhadap nama Allah.
  alternative: “memuji”, “mengucap syukur”, atau “menyatakan nama-Nya”.
  rationale: Kata Yunani dapat mencakup pengakuan atau pengakuan terbuka. “Mengakui” menjaga keluasan makna itu tanpa menyempitkannya hanya menjadi pujian atau ucapan syukur.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “marilah kita” mempertahankan ajakan bersama; “kurban” mengikuti ejaan baku modern. Huruf kapital pada “Dia” dan “-Nya” dipakai sesuai kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan ilahi.
