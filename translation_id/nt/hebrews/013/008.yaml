  yaml_path: translation/nt/hebrews/013/008.yaml
  text: Jesus the Messiah is the same yesterday and today and forever[a].
translation:
  language: id
  text: Yesus Sang Mesias tetap sama, baik kemarin maupun hari ini dan sampai selama-lamanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yesus Kristus tetap sama, baik kemarin maupun hari ini dan sampai selama-lamanya.” Gelar Yunani Χριστός dapat diterjemahkan sebagai “Mesias” atau dialihaksarakan sebagai “Kristus.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Bentuk nama yang baku dan lazim dalam bahasa Indonesia.
- source_word: Χριστὸς
  choice: Sang Mesias
  rationale: Menerjemahkan gelar Yunani sebagai 'Mesias'; 'Sang' menandai fungsi gelar secara alami dan khidmat dalam bahasa Indonesia.
- source_word: ἐχθὲς
  choice: kemarin
  rationale: Padanan temporal langsung yang mempertahankan rangkaian waktu dalam teks Yunani.
- source_word: σήμερον
  choice: hari ini
  rationale: Padanan alami dalam bahasa Indonesia untuk adverbia temporal Yunani.
- source_word: ὁ αὐτός
  choice: tetap sama
  rationale: Predikat Yunani berarti 'yang sama'; 'tetap sama' menyatakan kesinambungan secara alami tanpa menambahkan uraian doktrinal.
- source_word: εἰς τοὺς αἰῶνας
  choice: sampai selama-lamanya
  rationale: Ungkapan idiomatis yang menyampaikan keberlangsungan tanpa akhir dan tetap mencerminkan bentuk preposisional Yunani.
- source_word: καὶ ... καὶ ... καὶ
  choice: baik ... maupun ... dan ...
  rationale: Susunan Indonesia yang alami mempertahankan hubungan dan penekanan pada ketiga cakupan waktu.
theological_decisions:
- issue: Daya kristologis pernyataan tentang ketetapan Yesus
  choice: Menyatakan secara langsung bahwa Yesus Sang Mesias tetap sama sepanjang waktu.
  alternative: Memperluasnya menjadi pernyataan eksplisit mengenai ketidakberubahan atau keilahian Kristus.
  rationale: Teks menegaskan kesamaan atau ketetapan Yesus melintasi waktu, tetapi terjemahan tidak boleh menambahkan kesimpulan doktrinal yang tidak dinyatakan secara eksplisit.
- issue: Penerjemahan Χριστός sebagai gelar
  choice: Sang Mesias
  alternative: Kristus
  rationale: Χριστός merupakan gelar yang sepadan dengan 'Mesias'; alternatif tradisional dicatat agar pembaca mengetahui bentuk lain yang lazim.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Struktur temporal dipertahankan secara berirama, sedangkan kata 'tetap' membantu mengungkapkan daya predikatif ὁ αὐτός secara wajar.
