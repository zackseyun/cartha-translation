  text: διὸ καὶ Ἰησοῦς, ἵνα ἁγιάσῃ διὰ τοῦ ἰδίου αἵματος τὸν λαόν, ἔξω τῆς πύλης ἔπαθεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/012.yaml
  text: Therefore Jesus also suffered outside the gate[b][a], so that he might sanctify the people through his own blood.
translation:
  language: id
  text: Karena itu, Yesus juga menderita untuk menguduskan umat itu melalui darah-Nya sendiri, di luar gerbang[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadikan kudus” atau “menyucikan”.
    reason: lexical_alternative
  - marker: b
    text: “Di luar gerbang” kemungkinan menunjuk pada tempat di luar Yerusalem tempat Yesus menderita. Ungkapan ini menggemakan pembakaran tubuh kurban di luar perkemahan dalam konteks sebelumnya.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari pola kurban dalam konteks sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: καὶ
  choice: juga
  rationale: Menghubungkan penderitaan Yesus dengan pola kurban yang baru disebutkan.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: ἵνα ἁγιάσῃ
  choice: untuk menguduskan
  rationale: Mengungkapkan tujuan dan mempertahankan nuansa ibadah serta perjanjian dari ἁγιάζω.
- source_word: διὰ τοῦ ἰδίου αἵματος
  choice: melalui darah-Nya sendiri
  rationale: Menyatakan sarana dan mempertahankan penekanan ἰδίου bahwa darah itu adalah darah Yesus sendiri.
- source_word: τὸν λαόν
  choice: umat itu
  rationale: λαός dalam konteks ini menunjuk kepada umat perjanjian; 'umat itu' mempertahankan bentuk definit tanpa menambahkan 'Allah' yang tidak tertulis.
- source_word: ἔξω τῆς πύλης
  choice: di luar gerbang
  rationale: Mempertahankan bentuk tunggal dan tidak menambahkan 'kota', meskipun gerbang Yerusalem tersirat oleh konteks.
- source_word: ἔπαθεν
  choice: menderita
  rationale: Padanan langsung dan wajar bagi bentuk aoris πάσχω.
theological_decisions:
- issue: Makna ἁγιάζω dalam konteks kurban
  choice: menguduskan
  alternative: menjadikan kudus; menyucikan
  rationale: '''Menguduskan'' mempertahankan cakupan teologis dan kultis istilah tersebut tanpa membatasinya pada perubahan moral atau penafsiran denominasi tertentu.'
- issue: Cakupan τὸν λαόν
  choice: umat itu
  alternative: umat Allah; orang-orang itu
  rationale: Konteks menunjuk kepada umat perjanjian, tetapi teks Yunani tidak secara eksplisit menambahkan 'Allah'; terjemahan ini menjaga ketegasan frasa tanpa perluasan interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat mendahulukan akibat logis dan peristiwa utama, lalu menyatakan tujuannya secara alami. Kapital pada pronomina -Nya mengikuti kebiasaan umum dalam teks keagamaan Indonesia.
