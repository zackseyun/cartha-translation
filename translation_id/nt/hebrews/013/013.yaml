  text: τοίνυν ἐξερχώμεθα πρὸς αὐτὸν ἔξω τῆς παρεμβολῆς, τὸν ὀνειδισμὸν αὐτοῦ φέροντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/013.yaml
  text: Therefore[a], let us go out to him outside the camp, bearing his reproach.
translation:
  language: id
  text: Karena itu, marilah kita pergi kepada-Nya ke luar perkemahan[a] sambil menanggung celaan yang ditujukan kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke luar tempat perkemahan.” Ungkapan ini menggemakan gambaran korban dalam Imamat 16 dan penolakan yang ditanggung Yesus di luar kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοίνυν
  choice: Karena itu
  rationale: Partikel inferensial ini menarik kesimpulan dari uraian sebelumnya, khususnya ayat 11–12; “Karena itu” menyatakan hubungan logis tersebut secara alami.
- source_word: ἐξερχώμεθα
  choice: marilah kita pergi ... ke luar
  rationale: Subjungtif kini orang pertama jamak berfungsi sebagai ajakan. Susunan ini mempertahankan unsur gerak ke luar sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: πρὸς αὐτὸν
  choice: kepada-Nya
  rationale: πρός dengan akusatif menunjukkan gerak menuju seseorang. Pronomina tetap dipertahankan sebagaimana teks Yunani; dalam konteks, acuannya ialah Yesus.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: ke luar perkemahan
  rationale: παρεμβολή berarti tempat orang berkemah atau perkemahan. Pilihan ini mempertahankan gambaran kultis dan kaitannya dengan ayat sebelumnya.
- source_word: τὸν ὀνειδισμὸν αὐτοῦ
  choice: kehinaan yang ditanggung-Nya
  rationale: ὀνειδισμός mencakup celaan, penghinaan, dan aib sosial. Bentuk ini mengungkapkan bahwa para pembaca diajak ikut menanggung kehinaan yang dikenakan kepada Yesus, tanpa mengganti pronomina dengan nama-Nya.
- source_word: φέροντες
  choice: sambil menanggung
  rationale: Partisip kini aktif menunjukkan tindakan yang menyertai ajakan utama dan dapat bernuansa berkelanjutan. “Menanggung” lebih tepat daripada “membawa” untuk kehinaan atau celaan.
theological_decisions:
- issue: Acuan αὐτόν dan αὐτοῦ
  choice: Mempertahankan pronomina “-Nya”; acuannya dipahami sebagai Yesus dari konteks langsung.
  alternative: Mengganti pronomina dengan “Yesus”.
  rationale: Teks Yunani memakai pronomina, sedangkan Ibrani 13:12 membuat acuannya cukup jelas. Mempertahankan pronomina menghindari penjelasan berlebihan di dalam teks.
- issue: Makna “ke luar perkemahan”
  choice: Mempertahankan gambaran perkemahan secara harfiah.
  alternative: Memparafrasakannya sebagai “ke luar lingkungan keagamaan” atau “ke luar komunitas”.
  rationale: Ungkapan itu menggemakan praktik korban Lewi sekaligus keterasingan sosial-keagamaan. Parafrasa akan mempersempit dan menyelesaikan secara sepihak keluasan citranya.
- issue: Hubungan kehinaan orang percaya dengan kehinaan Yesus
  choice: “kehinaan yang ditanggung-Nya” menyatakan bahwa kehinaan itu terlebih dahulu dikenakan kepada Yesus dan kemudian turut ditanggung para pembaca.
  alternative: “kehinaan karena Dia” atau “celaan-Nya”.
  rationale: Genitif αὐτοῦ dapat diungkapkan secara padat sebagai “celaan-Nya”, tetapi dalam bahasa Indonesia bentuk itu berpotensi disalahpahami sebagai celaan yang Dia ucapkan. Rumusan terpilih menjaga arah makna kontekstual tanpa mengubahnya menjadi sekadar sebab.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada ajakan yang khidmat. Kapitalisasi pronomina ilahi dipakai sesuai kelaziman penerbitan Alkitab Indonesia. “Perkemahan” dipilih untuk mempertahankan citra kultis; “kehinaan yang ditanggung-Nya” menghindari ambiguitas tidak wajar dari bentuk “kehinaan-Nya” dalam bahasa sasaran.
