source:
  edition: SBLGNT
  text: ἀφιλάργυρος ὁ τρόπος· ἀρκούμενοι τοῖς παροῦσιν· αὐτὸς γὰρ εἴρηκεν· Οὐ μή σε ἀνῶ οὐδ’ οὐ μή σε ⸀ἐγκαταλίπω·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/005.yaml
  text: Let your way of life be free from the love of money[a], being content with what you have, for he himself has said, “I will never leave you[b], nor will I ever forsake you.”
translation:
  language: id
  text: Hendaklah cara hidup kalian bebas dari cinta akan uang. Puaslah dengan apa yang kalian miliki, sebab Dia sendiri telah berfirman, “Aku sama sekali tidak akan membiarkanmu[a] dan sekali-kali tidak akan meninggalkanmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Janji ini menggemakan jaminan perjanjian dalam Perjanjian Lama, khususnya Ulangan 31:6, 8 dan Yosua 1:5.
    reason: cross_reference
lexical_decisions:
- source_word: ἀφιλάργυρος
  choice: bebas dari cinta akan uang
  rationale: Menjaga fokus khusus kata sifat ini pada sikap tidak mencintai uang, tanpa memperluasnya menjadi segala bentuk keserakahan.
- source_word: ὁ τρόπος
  choice: cara hidup kalian
  rationale: Dalam konteks ini τρόπος menunjuk pada perilaku atau cara hidup. Kata ganti jamak disertakan agar sapaan kepada jemaat terdengar alami dalam bahasa Indonesia.
- source_word: ἀρκούμενοι τοῖς παροῦσιν
  choice: Puaslah dengan apa yang kalian miliki
  rationale: Partisipel ini berfungsi sebagai nasihat yang berkaitan dengan klausa sebelumnya. Ungkapan Indonesia ini alami dan menyampaikan kepuasan terhadap apa yang tersedia atau dimiliki sekarang.
- source_word: αὐτὸς γὰρ εἴρηκεν
  choice: sebab Dia sendiri telah berfirman
  rationale: “Dia sendiri” mempertahankan penekanan αὐτός tanpa menambahkan nomina “Allah” yang tidak eksplisit; bentuk “telah berfirman” mencerminkan daya tetap dari bentuk perfek dan cocok untuk ucapan ilahi.
- source_word: Οὐ μή σε ἀνῶ
  choice: Aku sama sekali tidak akan meninggalkanmu
  rationale: “Sama sekali tidak” menyampaikan penyangkalan kuat οὐ μή secara wajar dalam bahasa Indonesia.
- source_word: οὐδ’ οὐ μή σε ἐγκαταλίπω
  choice: dan sekali-kali tidak akan menelantarkanmu
  rationale: “Menelantarkan” membedakan ἐγκαταλείπω dari verba sebelumnya serta menyampaikan arti meninggalkan tanpa pertolongan; “sekali-kali tidak” mempertahankan penegasan negatif.
theological_decisions:
- issue: Identitas pembicara dalam kutipan
  choice: Memakai “Dia sendiri” dan bukan menambahkan “Allah”
  alternative: sebab Allah sendiri telah berfirman
  rationale: Konteks mengacu kepada Allah, tetapi teks Yunani memakai kata ganti αὐτός, bukan θεός. Terjemahan mempertahankan bentuk sumber tanpa mengaburkan rujukannya.
- issue: Penegasan rangkap dalam janji
  choice: Aku sama sekali tidak akan meninggalkanmu dan sekali-kali tidak akan menelantarkanmu
  alternative: Aku tidak akan pernah meninggalkanmu ataupun menelantarkanmu
  rationale: Dua ungkapan negatif yang kuat mempertahankan tekanan dari kedua konstruksi οὐ μή tanpa menghasilkan pengulangan yang janggal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kalian” menandai bahwa nasihat ditujukan kepada komunitas, sedangkan “-mu” dalam kutipan mempertahankan bentuk tunggal Yunani. Huruf kapital pada “Dia” dipakai sebagai konvensi Indonesia untuk rujukan ilahi, tanpa menyisipkan nama yang tidak terdapat dalam teks sumber.
