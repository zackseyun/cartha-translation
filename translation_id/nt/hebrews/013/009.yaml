id: HEB.13.9
reference: Hebrews 13:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διδαχαῖς ποικίλαις καὶ ξέναις μὴ παραφέρεσθε· καλὸν γὰρ χάριτι βεβαιοῦσθαι τὴν καρδίαν, οὐ βρώμασιν, ἐν οἷς οὐκ ὠφελήθησαν οἱ ⸀περιπατοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/009.yaml
  text: Do not be carried away by various and strange teachings[a], for it is good for the heart to be strengthened by grace, not by foods[c][b], by which those who occupied themselves with them were not benefited.
translation:
  language: id
  text: Janganlah kalian dihanyutkan oleh berbagai ajaran yang asing. Sebab, adalah baik bila hati diteguhkan[a] oleh anugerah, bukan oleh makanan[b]; orang-orang yang menyibukkan diri dengan hal-hal itu[c] tidak memperoleh manfaat darinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dikukuhkan” atau “dibuat teguh”. Kata Yunani ini dapat berarti meneguhkan, mengukuhkan, atau membuat teguh.
    reason: lexical_alternative
  - marker: b
    text: “Makanan” mungkin menunjuk pada praktik atau ketentuan yang berkaitan dengan makanan; teks Yunani hanya mengatakan “makanan”.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “orang-orang yang berjalan di dalamnya”; maksudnya dapat berupa mereka yang hidup menurut atau menyibukkan diri dengan hal-hal itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: διδαχαῖς ποικίλαις καὶ ξέναις
  choice: berbagai ajaran yang asing
  rationale: “Ajaran” merupakan padanan alami bagi διδαχαῖς. ποικίλαις menyatakan keragaman, sedangkan ξέναις menyatakan bahwa ajaran itu asing atau tidak termasuk dalam berita yang telah diterima, tanpa menyiratkan asal etnis tertentu.
- source_word: μὴ παραφέρεσθε
  choice: Janganlah kalian dihanyutkan
  rationale: Bentuk pasif ini menggambarkan orang yang terbawa keluar dari arah yang benar. “Dihanyutkan” mempertahankan gambaran tersebut sekaligus menyampaikan larangan yang sedang berlaku.
- source_word: χάριτι
  choice: oleh anugerah
  rationale: 'Datif ini paling wajar dipahami sebagai sarana: hatilah yang diteguhkan oleh anugerah. Istilah teologisnya dipertahankan tanpa parafrasa.'
- source_word: βεβαιοῦσθαι τὴν καρδίαν
  choice: hati diteguhkan
  rationale: βεβαιοῦσθαι dapat berarti diteguhkan, dikukuhkan, atau dibuat teguh. “Hati diteguhkan” alami dalam bahasa Indonesia dan mempertahankan “hati” sebagai pusat kehidupan batin.
- source_word: οὐ βρώμασιν
  choice: bukan oleh makanan
  rationale: βρώμασιν secara langsung berarti “makanan”. Terjemahan utama tidak mempersempitnya menjadi kurban atau memperluasnya menjadi seluruh hukum makanan.
- source_word: οἱ περιπατοῦντες
  choice: orang-orang yang menyibukkan diri dengan hal-hal itu
  rationale: Secara harfiah ungkapan ini berarti “orang-orang yang berjalan di dalamnya”, tetapi περιπατέω dapat menggambarkan perilaku atau cara hidup. Karena ungkapan “berjalan di dalam makanan” tidak wajar dalam bahasa Indonesia, pilihan ini menyampaikan keterlibatan berkelanjutan tanpa menentukan praktik tertentu.
- source_word: οὐκ ὠφελήθησαν
  choice: tidak memperoleh manfaat darinya
  rationale: Ungkapan ini menyatakan bahwa praktik tersebut tidak memberi manfaat kepada para pelakunya. Susunan Indonesia ini alami dan tetap mempertahankan penilaian negatif teks.
theological_decisions:
- issue: Acuan “makanan” dan pertentangannya dengan anugerah
  choice: Mempertahankan kata “makanan” dalam teks utama dan menjelaskan kemungkinan praktik terkait makanan dalam catatan kaki.
  alternative: Menerjemahkannya secara lebih khusus sebagai “peraturan makanan”, “makanan kurban”, atau “hukum makanan”.
  rationale: Konteks memungkinkan kaitan dengan praktik makanan atau ibadah, tetapi βρώμασιν sendiri hanya mengatakan “makanan”. Terjemahan tidak boleh memutuskan cakupannya melebihi bukti teks.
- issue: Makna metaforis “hati”
  choice: Mempertahankan “hati”.
  alternative: “Pikiran”, “batin”, atau “manusia batiniah”.
  rationale: καρδία memiliki bobot antropologis dan teologis sebagai pusat diri batiniah. Mempertahankan istilah ini menghindari penyempitan makna.
- issue: Hubungan sintaksis ἐν οἷς dengan “makanan”
  choice: Mengungkapkan keterlibatan dalam hal-hal yang berkaitan dengan makanan tanpa menentukan bentuk praktiknya.
  alternative: “Mereka yang hidup menurut peraturan makanan” atau “mereka yang mengambil bagian dalam makanan kurban”.
  rationale: Bahasa Yunani secara harfiah menyebut orang yang “berjalan di dalam” hal-hal itu. Ungkapan tersebut menunjuk pada pola perilaku, tetapi sifat tepat perilakunya tetap tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. “Kalian” dipakai untuk menyatakan orang kedua jamak yang tersirat dalam bentuk Yunani. Metafora “dihanyutkan” dipertahankan, sedangkan idiom “berjalan di dalamnya” dialihkan secara alami dan dijelaskan dalam catatan kaki.
