  text: Προσεύχεσθε περὶ ἡμῶν, ⸀πειθόμεθα γὰρ ὅτι καλὴν συνείδησιν ἔχομεν, ἐν πᾶσιν καλῶς θέλοντες ἀναστρέφεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/018.yaml
  text: Pray for us[a], for we are convinced that we have a good conscience[c][b], since we want to conduct ourselves well in everything.
translation:
  language: id
  text: Berdoalah untuk kami, sebab kami yakin[a] bahwa kami memiliki hati nurani yang baik[b], karena kami ingin berperilaku baik dalam segala hal.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kami telah diyakinkan” atau “kami percaya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “hati nurani yang bersih.”
    reason: lexical_alternative
  - marker: c
    text: Atau “dengan keinginan untuk berperilaku baik dalam segala hal.”
    reason: structural_alternative
lexical_decisions:
- source_word: Προσεύχεσθε περὶ ἡμῶν
  choice: Berdoalah untuk kami
  rationale: Bentuk imperatif kini jamak diterjemahkan secara wajar sebagai perintah “Berdoalah”; bersama bahasa doa, περί dengan genitif secara idiomatis berarti “untuk”.
- source_word: πειθόμεθα
  choice: kami yakin
  rationale: Mengungkapkan keyakinan atau kepastian yang menetap dan mempertahankan daya kognitif πείθω dalam bahasa Indonesia yang alami.
- source_word: καλὴν συνείδησιν ἔχομεν
  choice: kami memiliki hati nurani yang baik
  rationale: Terjemahan langsung yang mempertahankan kata sifat καλὴν tanpa mempersempitnya menjadi hanya “bersih”.
- source_word: ἐν πᾶσιν
  choice: dalam segala hal
  rationale: Frasa ini bersifat menyeluruh dan berfungsi secara adverbial; “dalam segala hal” jelas serta sesuai dengan ragam bahasa yang bermartabat.
- source_word: καλῶς θέλοντες ἀναστρέφεσθαι
  choice: karena kami ingin berperilaku baik
  rationale: ἀναστρέφεσθαι menunjuk pada perilaku atau cara hidup, καλῶς menerangkan perilaku itu, dan θέλοντες menyatakan keinginan yang sedang berlangsung.
theological_decisions:
- issue: Hubungan klausa partisipial terakhir dengan pernyataan tentang hati nurani yang baik
  choice: 'Diterjemahkan secara eksplanatoris/kausal: “karena kami ingin berperilaku baik dalam segala hal”'
  alternative: “dengan keinginan untuk berperilaku baik dalam segala hal”
  rationale: Partisipel θέλοντες dapat dibiarkan terikat secara lebih formal, tetapi hubungan penjelas atau kausal menghasilkan bahasa Indonesia yang lebih mudah dipahami. Pilihan ini menerangkan dasar atau sifat pengakuan tentang hati nurani tanpa menyiratkan klaim yang lebih kuat mengenai keadaan tanpa dosa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat dan mudah dipahami. “Berperilaku baik” dipilih untuk menyampaikan dimensi etis ἀναστρέφεσθαι tanpa memakai ungkapan yang terlalu teknis; susunan kausal mempertahankan hubungan yang mungkin dimaksudkan sambil mencatat bentuk partisipial sebagai alternatif.
