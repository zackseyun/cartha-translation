  terminology: “Hati nurani yang baik” mempertahankan keluasan καλὴ συνείδησις tanpa menyempitkannya menjadi sekadar hati nurani yang “bersih”. “Berperilaku baik dalam segala hal” menyampaikan dimensi etis ἀναστρέφεσθαι dan cakupan ἐν πᾶσιν dengan baik. Nama dan istilah teologis tidak menimbulkan masalah dalam ayat ini.
