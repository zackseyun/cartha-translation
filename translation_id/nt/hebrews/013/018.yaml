  source_fidelity: 'Teks Indonesia secara akurat mencerminkan unsur utama Yunani: imperatif jamak “Berdoalah”, περί + genitif sebagai “untuk kami”, πειθόμεθα sebagai “kami yakin”, serta klaim memiliki “hati nurani yang baik”. Frasa terakhir menyampaikan keinginan berkelanjutan untuk menjalani perilaku yang baik secara menyeluruh. Hubungan eksplanatoris/kausal yang dinyatakan dengan “karena” merupakan pilihan yang sah bagi partisipel θέλοντες dan tidak menambahkan klaim teologis yang tidak ada.'
