source:
  edition: SBLGNT
  text: τίμιος ὁ γάμος ἐν πᾶσιν καὶ ἡ κοίτη ἀμίαντος, πόρνους ⸀γὰρ καὶ μοιχοὺς κρινεῖ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/004.yaml
  text: Let marriage be held in honor among all[a], and the marriage bed be undefiled[b], for God will judge the sexually immoral and adulterers.
translation:
  language: id
  text: Hendaklah perkawinan dihormati oleh semua orang[a], dan hubungan seksual dalam perkawinan hendaklah tetap tidak ternoda, sebab Allah akan menghakimi orang-orang cabul dan pezina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Perkawinan itu terhormat di antara semua orang.” Bahasa Yunani tidak memiliki kata kerja eksplisit dalam klausa pertama, sehingga dapat dibaca sebagai anjuran atau sebagai pernyataan. Frasa “oleh semua orang” juga dapat dipahami sebagai “di antara semua orang.”
    reason: alternative_reading
lexical_decisions:
- source_word: τίμιος
  choice: hendaklah ... dihormati
  rationale: Kata ini menyatakan sesuatu yang bernilai dan patut dihormati. Bentuk anjuran sesuai dengan rangkaian nasihat dalam Ibrani 13, sambil tetap mencatat kemungkinan pembacaan sebagai pernyataan.
- source_word: γάμος
  choice: perkawinan
  rationale: Dalam konteks ini kata tersebut menunjuk pada ikatan atau keadaan perkawinan, bukan upacara pernikahan.
- source_word: ἐν πᾶσιν
  choice: oleh semua orang
  rationale: Frasa ini paling mungkin merujuk kepada orang-orang dan, bersama bentuk pasif 'dihormati', secara alami menyatakan pelaku penghormatan. Kemungkinan arti 'di antara semua orang' tetap dicatat.
- source_word: κοίτη
  choice: tempat tidur perkawinan
  rationale: Secara harfiah berarti tempat tidur dan dalam konteks ini menjadi metonimia bagi hubungan seksual dalam perkawinan. Ungkapan ini mempertahankan gambaran sumber.
- source_word: ἀμίαντος
  choice: tidak dicemari
  rationale: Pilihan ini mempertahankan nuansa moral 'tidak ternoda/tidak tercemar' serta sejajar dengan bentuk anjuran pada klausa pertama.
- source_word: πόρνους
  choice: orang-orang yang melakukan percabulan
  rationale: Kata ini menunjuk secara luas kepada pelaku hubungan seksual yang tidak bermoral. Rumusan dengan pelaku diperlukan karena objek penghakiman adalah orang, bukan tindakan abstrak.
- source_word: μοιχούς
  choice: orang-orang yang melakukan ... perzinaan
  rationale: Kata ini secara khusus menunjuk kepada pezina; 'perzinaan' mempertahankan perbedaannya dari kategori seksual yang lebih luas sebelumnya.
- source_word: κρινεῖ
  choice: akan menghakimi
  rationale: Bentuk futurum menunjuk kepada penghakiman Allah yang akan datang. 'Menghakimi' tidak mempersempit hasilnya menjadi penghukuman.
- source_word: γάρ
  choice: sebab
  rationale: Kata ini memperkenalkan alasan yang mendasari nasihat sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Apakah klausa pembuka bersifat deklaratif atau berupa anjuran
  choice: 'Anjuran: ''Hendaklah perkawinan dihormati'''
  alternative: 'Pernyataan: ''Perkawinan itu terhormat'''
  rationale: Bahasa Yunani tidak memuat verba eksplisit, sehingga kedua pembacaan mungkin. Alur nasihat etis dalam Ibrani 13 mendukung bentuk anjuran, tetapi ambiguitas asli dipertahankan dalam catatan kaki.
- issue: Cakupan ἐν πᾶσιν
  choice: '''oleh semua orang'' sebagai pelaku penghormatan'
  alternative: '''di antara semua orang'' sebagai lingkungan tempat perkawinan dihormati'
  rationale: Bentuk datif jamak dapat dipahami dengan kedua cara tersebut. Dengan konstruksi pasif bahasa Indonesia, 'oleh semua orang' paling lugas, sedangkan alternatif yang sah dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Perkawinan' dipilih untuk menunjuk lembaga atau ikatan, sedangkan 'tempat tidur perkawinan' mempertahankan gambaran konkret Yunani. Struktur paralel berbentuk anjuran mengikuti konteks parenesis, dengan ambiguitas gramatikal utama dijelaskan dalam catatan kaki.
