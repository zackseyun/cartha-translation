base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/002.yaml
  text: Do not neglect hospitality[a], for through it some have entertained angels without knowing it.
translation:
  language: id
  text: Jangan lalai menunjukkan keramahan kepada orang asing, sebab melalui keramahan itu beberapa orang, tanpa menyadarinya, telah menerima malaikat[a] sebagai tamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “beberapa orang telah menerima utusan sebagai tamu tanpa menyadarinya.” Kata Yunani yang sama dapat berarti “malaikat” atau “utusan,” meskipun “malaikat” paling sesuai dengan kemungkinan acuan pada kisah para tamu surgawi dalam Kejadian 18–19.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοξενίας
  choice: keramahan kepada orang asing
  rationale: Kata ini secara khusus menunjuk pada kasih atau sambutan terhadap orang asing. Ungkapan ini alami dalam bahasa Indonesia sekaligus mempertahankan unsur ‘orang asing’ yang terkandung dalam kata Yunani.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: Jangan lalai menunjukkan
  rationale: Dalam nasihat ini, verba tersebut bukan hanya menyatakan lupa secara mental, melainkan kegagalan mempraktikkan keramahan. ‘Jangan lalai menunjukkan’ menyampaikan daya nasihat itu dengan jelas.
- source_word: διὰ ταύτης
  choice: dengan berbuat demikian
  rationale: Pronomina feminin ini merujuk kembali pada tindakan menunjukkan keramahan. Ungkapan ini menyampaikan fungsi instrumental διά secara alami.
- source_word: ἔλαθόν
  choice: tanpa menyadarinya
  rationale: Konstruksi λανθάνω dengan partisip menyatakan bahwa tindakan itu dilakukan tanpa diketahui atau disadari oleh pelakunya.
- source_word: τινες
  choice: beberapa orang
  rationale: Padanan langsung dan wajar bagi bentuk jamak tak tentu.
- source_word: ξενίσαντες
  choice: telah menerima ... sebagai tamu
  rationale: Partisip ini berarti menerima atau menampung seseorang sebagai tamu. Ungkapan tersebut lebih tepat daripada ‘menghibur’ dan tidak mempersempit tindakan itu hanya pada penyajian makanan.
- source_word: ἀγγέλους
  choice: malaikat
  rationale: Kata Yunani dapat berarti ‘utusan’ atau ‘malaikat’, tetapi kemungkinan acuan pada kisah para tamu surgawi dalam Kejadian 18–19 mendukung ‘malaikat’. Alternatif leksikal dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna ἀγγέλους
  choice: malaikat dalam arti makhluk surgawi
  alternative: utusan, mungkin manusia
  rationale: Konteks dan kemungkinan acuan pada Abraham dan Lot yang menerima tamu surgawi lebih mendukung arti ‘malaikat’. Namun, karena kata Yunani juga dapat berarti ‘utusan’, kemungkinan itu dicatat tanpa menghapus ambiguitas leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang lugas dan bermartabat. ‘Keramahan kepada orang asing’ mempertahankan cakupan khusus φιλοξενία, sedangkan ‘menerima ... sebagai tamu’ menghindari kemungkinan salah paham pada kata ‘menjamu’ sebagai sekadar menyediakan makanan.
