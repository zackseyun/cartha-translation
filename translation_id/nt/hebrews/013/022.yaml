  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, ἀνέχεσθε τοῦ λόγου τῆς παρακλήσεως, καὶ γὰρ διὰ βραχέων ἐπέστειλα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/022.yaml
  text: I urge you[a], brothers, bear with this word of exhortation[b], for I have written to you briefly.
translation:
  language: id
  text: Saya mohon kepada kalian, Saudara-saudara[a], agar kalian menerima dengan sabar pesan nasihat ini[b], sebab saya telah menulis kepada kalian secara singkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Saudara-saudari”; bahasa Yunani memakai bentuk “saudara-saudara,” yang dapat menyapa seluruh jemaat secara inklusif.
    reason: lexical_alternative
  - marker: b
    text: “Pesan nasihat” dapat juga diterjemahkan “pesan dorongan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: saya memohon
  rationale: Kata ini menyatakan permohonan atau desakan pribadi yang sungguh-sungguh. “Saya memohon” alami dalam bahasa Indonesia dan tidak sekeras “saya mendesak”.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan ringan menuju permohonan penutup. “Namun” mempertahankan hubungan wacana tanpa memberi kesan pertentangan yang terlalu kuat.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan jamak ini secara harfiah berarti saudara laki-laki, tetapi dapat dipakai bagi sesama anggota jemaat. “Saudara-saudara” merupakan sapaan Indonesia yang wajar dan tetap mempertahankan bentuk sapaan sumber; cakupan inklusif dijelaskan dalam catatan kaki.
- source_word: ἀνέχεσθε
  choice: bersabarlah menerima
  rationale: Verba ini berarti menanggung, bersabar terhadap, atau menerima dengan sabar. Dalam konteks permintaan agar pembaca menerima isi surat, frasa ini menyampaikan ketekunan tanpa nada kasar seperti “tahanlah”.
- source_word: τοῦ λόγου τῆς παρακλήσεως
  choice: perkataan yang menasihati ini
  rationale: λόγος menunjuk pada pesan yang disampaikan, sedangkan παράκλησις dapat mencakup nasihat, dorongan, dan penghiburan. Pilihan ini alami dan mempertahankan fungsi pesan, sementara alternatif “pesan dorongan” dicatat.
- source_word: καὶ γὰρ
  choice: sebab
  rationale: Gabungan partikel ini memberikan alasan yang mendukung permohonan sebelumnya. “Sebab” menyampaikan fungsi penjelasannya secara ringkas.
- source_word: διὰ βραχέων
  choice: dengan singkat
  rationale: Ungkapan idiomatis ini berarti secara singkat atau dengan sedikit kata. “Dengan singkat” jelas dan alami.
- source_word: ἐπέστειλα
  choice: saya telah menulis
  rationale: Bentuk aoris merujuk pada tindakan menulis atau mengirim pesan. Bentuk perfektif Indonesia ini wajar karena tulisan tersebut kini berada di hadapan para penerima.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: Pronomina datif jamak menunjuk kepada para penerima. “Kalian” memperjelas bahwa sapaan ditujukan kepada kelompok tanpa menambahkan unsur yang tidak ada dalam sumber.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί
  choice: Saudara-saudara
  alternative: Saudara-saudari
  rationale: Bentuk Yunani secara gramatikal maskulin, tetapi dalam konteks jemaat dapat mencakup seluruh komunitas. Teks utama mempertahankan sapaan yang dekat dengan bentuk sumber, sedangkan kemungkinan cakupan inklusif dijelaskan dalam catatan kaki.
- issue: Nuansa παράκλησις
  choice: yang menasihati
  alternative: yang memberi dorongan
  rationale: Istilah ini dapat berarti nasihat, desakan, dorongan, atau penghiburan. Konteks permohonan agar pembaca menerima isi tulisan mendukung “menasihati,” tetapi ambiguitas semantiknya dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan santun. “Saya” serta “kalian” menjaga hubungan langsung penulis dengan kelompok penerima; “bersabarlah menerima” menghindari kekakuan harfiah sambil mempertahankan desakan untuk menanggung atau menerima pesan dengan sabar.
