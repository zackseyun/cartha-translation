base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/010.yaml
  text: We have an altar from which those who serve at the tabernacle have no right to eat[a][b].
translation:
  language: id
  text: Kita mempunyai mezbah yang darinya mereka yang melayani di Kemah Suci[a] tidak berhak makan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih khusus, “mereka yang melakukan pelayanan ibadah di kemah.” Frasa ini menunjuk kepada orang-orang yang melayani di tempat kudus dalam tata ibadah Perjanjian Lama.
    reason: lexical_alternative
  - marker: b
    text: “Mezbah” ditafsirkan secara beragam sebagai Kristus sendiri, salib, mezbah surgawi, atau manfaat dari persembahan kurban Kristus. Bahasa Yunani di sini membiarkan gambaran itu tanpa penjelasan lebih lanjut.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχομεν
  choice: Kita mempunyai
  rationale: Bentuk kini orang pertama jamak dipertahankan, dengan penulis menyertakan dirinya dan para pembacanya.
- source_word: θυσιαστήριον
  choice: sebuah mezbah
  rationale: Padanan baku bagi mezbah kurban; istilah konkretnya dipertahankan tanpa menafsirkan mezbah itu sebagai Kristus, salib, atau hal lain dalam teks utama.
- source_word: ἐξ οὗ φαγεῖν
  choice: makan dari mezbah itu
  rationale: Mengungkapkan sumber dengan wajar dalam bahasa Indonesia dan mempertahankan gambaran makan dari mezbah.
- source_word: οὐκ ἔχουσιν ἐξουσίαν
  choice: tidak berhak
  rationale: Dalam konteks ibadah ini, frasa tersebut menunjuk pada ketiadaan hak atau wewenang yang sah untuk mengambil bagian.
- source_word: οἱ τῇ σκηνῇ λατρεύοντες
  choice: mereka yang melayani di Kemah Suci
  rationale: λατρεύω di sini mengacu pada pelayanan ibadah, sedangkan σκηνή dalam konteks Ibrani menunjuk pada Kemah Suci. 'Melayani' lebih tepat daripada sekadar 'beribadah' untuk nuansa pelayanan kultis.
theological_decisions:
- issue: Rujukan 'mezbah' dalam Ibrani 13:10
  choice: Mempertahankan istilah konkret 'mezbah' tanpa menentukan rujukannya dalam teks utama.
  alternative: Kristus sendiri; salib; mezbah surgawi; atau manfaat kurban dari persembahan Kristus.
  rationale: Bahasa Yunani membiarkan gambaran itu tanpa penjelasan lebih lanjut. Menentukan satu rujukan akan mempersempit ketegangan teologis yang asli.
- issue: Identitas mereka yang melayani di Kemah Suci
  choice: Mempertahankan deskripsi fungsional yang mengarah pada pelayanan tempat kudus perjanjian lama.
  alternative: Menentukan mereka secara eksplisit sebagai imam-imam Yahudi.
  rationale: Partisipel Yunani menggambarkan orang-orang berdasarkan pelayanan mereka, bukan dengan menyebut jabatan tertentu secara langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Yunani dipecah menjadi dua kalimat agar hubungan antarbagiannya jelas dan alami, tanpa mengubah makna. 'Kemah Suci' memakai istilah Alkitabiah yang lazim dan mudah dipahami.
