  text: ἀσπάσασθε πάντας τοὺς ἡγουμένους ὑμῶν καὶ πάντας τοὺς ἁγίους. ἀσπάζονται ὑμᾶς οἱ ἀπὸ τῆς Ἰταλίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/024.yaml
  text: Greet all your leaders and all the saints[a]. Those from Italy greet you.
translation:
  language: id
  text: Sampaikan salam kepada semua pemimpin kalian dan semua orang kudus. Orang-orang dari Italia[a] memberi salam kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang-orang di Italia memberi salam kepada kalian.” Frasa Yunani ini dapat menunjuk kepada orang-orang yang berasal dari Italia atau kepada orang-orang yang berada di sana.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Sampaikan salam kepada
  rationale: Imperatif aoris ini meminta para penerima surat menyampaikan salam; ungkapan ini alami dalam konteks surat-menyurat bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: πάντας
  choice: semua
  rationale: Menyatakan keseluruhan anggota kedua kelompok secara langsung dan wajar.
- source_word: τοὺς ἡγουμένους ὑμῶν
  choice: pemimpin kalian
  rationale: Partisipel ini menunjuk kepada orang-orang yang memimpin komunitas; 'pemimpin' jelas tanpa nuansa politik dari 'penguasa'.
- source_word: τοὺς ἁγίους
  choice: orang kudus
  rationale: Mempertahankan istilah Perjanjian Baru bagi umat yang dikuduskan, tanpa menggantinya dengan parafrasa yang lebih interpretatif.
- source_word: ἀσπάζονται
  choice: menyampaikan salam kepada
  rationale: Dalam konteks penutup surat, bentuk ini secara idiomatis menyatakan pengiriman salam.
- source_word: οἱ ἀπὸ τῆς Ἰταλίας
  choice: Saudara-saudara yang berasal dari Italia
  rationale: ἀπό dengan genitif paling langsung menyatakan asal. 'Saudara-saudara' membuat rujukan kepada sesama orang percaya alami dalam bahasa Indonesia tanpa menentukan jenis kelamin setiap anggota kelompok.
theological_decisions:
- issue: Rujukan οἱ ἀπὸ τῆς Ἰταλίας
  choice: Saudara-saudara yang berasal dari Italia
  alternative: Saudara-saudara yang berada di Italia
  rationale: Makna asal paling sesuai dengan arti lazim ἀπό, tetapi frasa itu dapat dipahami sebagai orang percaya yang berada di Italia. Ambiguitas mengenai lokasi penulis dan penerima dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina 'kalian' dipakai karena bentuk Yunani jamak dan untuk menghindari ketaksaan 'Anda'; pengulangan 'kepada' menjaga kelancaran serta memperjelas dua kelompok penerima salam.
