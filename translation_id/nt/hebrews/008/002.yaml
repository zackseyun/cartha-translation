id: HEB.8.2
reference: Hebrews 8:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τῶν ἁγίων λειτουργὸς καὶ τῆς σκηνῆς τῆς ἀληθινῆς, ἣν ἔπηξεν ὁ κύριος, ⸀οὐκ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/002.yaml
  text: a minister of the holy places and of the true tabernacle[a], which the Lord set up[b], not man.
translation:
  language: id
  text: pelayan di tempat-tempat kudus[a] dan di Kemah Suci yang sejati, yang didirikan[b] oleh Tuhan, bukan oleh manusia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat kudus”; frasa Yunani ini dapat menunjuk pada tempat-tempat kudus di dalam tempat ibadah.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang dipasang oleh Tuhan,” dengan gambaran mendirikan sebuah kemah.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ἁγίων
  choice: tempat-tempat kudus
  rationale: Bentuk jamak substantival ini, dalam konteks ibadah dan keimaman Surat Ibrani, paling wajar menunjuk pada bagian-bagian kudus atau tempat kudus surgawi, bukan pada orang-orang kudus. Bentuk jamak dipertahankan dalam teks utama.
- source_word: λειτουργὸς
  choice: pelayan
  rationale: Kata ini menunjuk pada orang yang menjalankan pelayanan resmi, khususnya pelayanan keagamaan. 'Pelayan' alami dalam bahasa Indonesia dan konteks ayat memberi nuansa keimaman.
- source_word: σκηνῆς
  choice: Kemah Suci
  rationale: Dalam Surat Ibrani, kata ini membangkitkan gambaran kemah ibadah Musa dan padanannya yang surgawi. 'Kemah Suci' mempertahankan kaitan kultis itu dengan jelas.
- source_word: ἀληθινῆς
  choice: yang sejati
  rationale: '''Sejati'' menyampaikan arti sesuatu yang sesungguhnya atau yang sesuai dengan realitas utama, sambil mempertahankan kontras tersirat dengan salinan duniawi.'
- source_word: ἔπηξεν
  choice: didirikan
  rationale: Kata kerja ini berarti memasang atau menegakkan, terutama sebuah kemah. 'Didirikan' terdengar alami dan bermartabat; gambaran harfiahnya dicatat dalam catatan kaki.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Padanan baku dan alami untuk κύριος dalam konteks ini.
- source_word: οὐκ ἄνθρωπος
  choice: bukan oleh manusia
  rationale: Frasa ini menyatakan kontras antara tindakan Tuhan dan tindakan manusia secara umum. Penambahan 'oleh' diperlukan karena susunan pasif bahasa Indonesia, tanpa mengubah maknanya.
theological_decisions:
- issue: Rujukan τῶν ἁγίων dan hubungannya dengan tempat kudus surgawi
  choice: bahasa tempat ibadah/tempat kudus surgawi
  alternative: orang-orang kudus
  rationale: Konteks Ibrani 8:1-5 membahas pelayanan Imam Besar di tempat kudus surgawi. Terjemahan 'tempat-tempat kudus' mempertahankan bentuk jamak dan kerangka Kemah Suci tanpa mengalihkannya menjadi pelayanan kepada orang-orang kudus.
- issue: Daya generik ἄνθρωπος
  choice: manusia secara umum
  alternative: seorang manusia
  rationale: Kontrasnya ialah antara Tuhan yang mendirikan Kemah Suci sejati dan manusia sebagai pelaku pendirian. 'Manusia' mempertahankan arti generik tersebut tanpa menyiratkan satu individu tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kemah Suci' memakai kapital sebagai sebutan bagi tempat ibadah khusus, sedangkan 'tempat-tempat kudus' mempertahankan bentuk jamak Yunani. Susunan kalimat sengaja dibiarkan sebagai kelanjutan predikat dari ayat 1.
source_grounding:
  english_pob_role: consult_only
