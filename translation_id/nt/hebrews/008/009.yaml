id: HEB.8.9
reference: Hebrews 8:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ κατὰ τὴν διαθήκην ἣν ἐποίησα τοῖς πατράσιν αὐτῶν ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου, ὅτι αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου, κἀγὼ ἠμέλησα αὐτῶν, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/009.yaml
  text: not like the covenant that I made with their fathers on the day when I took hold of their hand to bring them out of the land of Egypt[a], because they did not continue in my covenant, and I disregarded them[b], says the Lord.
translation:
  language: id
  text: tidak seperti perjanjian yang Kubuat dengan nenek moyang mereka pada hari ketika Aku memegang tangan mereka[a] untuk membawa mereka keluar dari tanah Mesir, sebab mereka tidak tetap setia pada perjanjian-Ku, dan Aku tidak memedulikan mereka[b], demikianlah firman Tuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “ketika Aku menggandeng tangan mereka.”
    reason: lexical_alternative
  - marker: b
    text: 'Kutipan ini mengikuti bunyi teks Yunani dalam Surat Ibrani: “Aku tidak memedulikan mereka.” Yeremia 31:32 dalam teks Ibrani memiliki arti berbeda, yang sering diterjemahkan, “meskipun Aku adalah suami mereka” atau “meskipun Aku adalah tuan mereka.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκην
  choice: perjanjian
  rationale: Dalam konteks Ibrani dan kutipan Yeremia 31, istilah ini menunjuk pada ikatan perjanjian Allah dengan umat-Nya; “perjanjian” merupakan padanan Indonesia yang tepat dan lazim.
- source_word: ἐποίησα
  choice: Kubuat
  rationale: ποιέω bersama διαθήκη berarti “membuat perjanjian”; bentuk “Kubuat” alami dan mempertahankan orang pertama ilahi.
- source_word: πατράσιν
  choice: nenek moyang
  rationale: Istilah ini merujuk kepada para leluhur Israel. “Nenek moyang” merupakan ungkapan Indonesia yang alami dan tidak mengubah rujukan historisnya.
- source_word: ἐν ἡμέρᾳ
  choice: pada waktu
  rationale: Ungkapan ini berfungsi secara temporal. “Pada waktu” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “pada hari” tanpa meniadakan kaitannya dengan peristiwa keluaran.
- source_word: ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν
  choice: Aku memegang tangan mereka
  rationale: Mempertahankan gambaran konkret Allah memegang tangan mereka, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: ἐξαγαγεῖν
  choice: untuk membawa mereka keluar
  rationale: ἐξάγω berarti membawa atau menuntun keluar; pilihan ini alami dan cocok dengan gambaran keluaran dari Mesir.
- source_word: γῆς Αἰγύπτου
  choice: tanah Mesir
  rationale: Mempertahankan unsur γῆς dan memakai ungkapan Indonesia yang mapan.
- source_word: οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου
  choice: mereka tidak tetap setia pada perjanjian-Ku
  rationale: ἐμμένω secara harfiah berarti tetap atau bertahan di dalam. Dalam konteks perjanjian, “tetap setia pada” menyampaikan ketekunan dalam komitmen perjanjian secara alami tanpa menambahkan gagasan baru.
- source_word: κἀγὼ
  choice: dan Aku
  rationale: Mempertahankan nilai koordinatif καί tanpa memperkuatnya menjadi hubungan sebab-akibat yang eksplisit.
- source_word: ἠμέλησα αὐτῶν
  choice: Aku tidak memedulikan mereka
  rationale: ἀμελέω berarti tidak memedulikan, mengabaikan, atau melalaikan. Pilihan ini menyampaikan makna Yunani secara jelas tanpa memperkerasnya menjadi penolakan aktif.
- source_word: λέγει κύριος
  choice: firman Tuhan
  rationale: Formula kutipan profetis ini secara idiomatis dan bermartabat dinyatakan “firman Tuhan” dalam bahasa Indonesia; maknanya tetap “Tuhan berfirman/mengatakan”.
theological_decisions:
- issue: Perbedaan antara ἠμέλησα αὐτῶν dalam teks Yunani Ibrani dan bunyi Yeremia 31:32 dalam teks Ibrani
  choice: Aku tidak memedulikan mereka
  alternative: meskipun Aku adalah suami/tuan mereka
  rationale: Terjemahan mengikuti teks sumber Yunani Ibrani, yang jelas memakai ἠμέλησα αὐτῶν. Perbedaan penting dengan teks Ibrani Yeremia dipertahankan dalam catatan kaki, bukan diselaraskan secara diam-diam.
- issue: Nuansa kesetiaan dalam οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου
  choice: mereka tidak tetap setia pada perjanjian-Ku
  alternative: mereka tidak tetap berada dalam perjanjian-Ku
  rationale: Pilihan utama menyatakan keberlanjutan komitmen dalam hubungan perjanjian secara wajar dalam bahasa Indonesia, tanpa menentukan bentuk khusus ketidaksetiaan mereka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kapitalisasi pronomina ilahi dipakai sesuai kebiasaan luas penerbitan Alkitab Indonesia. Gambaran tangan dipertahankan, sedangkan formula λέγει κύριος diterjemahkan secara idiomatis sebagai “firman Tuhan.”
