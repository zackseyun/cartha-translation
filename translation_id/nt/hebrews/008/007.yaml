base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/007.yaml
  text: For if that first covenant had been faultless[b][a], no place would have been sought for a second.
translation:
  language: id
  text: Sebab, seandainya perjanjian pertama itu tidak bercela[a], tentu tidak akan dicari tempat bagi perjanjian kedua.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, Yunani berbunyi “yang pertama itu”; kata “perjanjian” dipahami dari konteks.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “dicari tempat” juga dapat berarti “dicari kesempatan” atau “dicari ruang” bagi perjanjian kedua.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ γὰρ
  choice: Sebab, seandainya
  rationale: γάρ menghubungkan ayat ini sebagai penjelasan atas argumen sebelumnya, sedangkan εἰ dalam konstruksi ini menyatakan pengandaian yang berlawanan dengan kenyataan. 'Sebab, seandainya' menyampaikan kedua fungsi itu secara alami.
- source_word: ἡ πρώτη ἐκείνη
  choice: perjanjian yang pertama itu
  rationale: Frasa feminin ini secara eliptis menunjuk kepada διαθήκη ('perjanjian') dalam konteks dekat. Menyebut 'perjanjian' membuat rujukannya jelas dalam bahasa Indonesia tanpa menambahkan gagasan baru.
- source_word: ἦν ἄμεμπτος
  choice: tidak bercela
  rationale: ἄμεμπτος berarti tidak memiliki dasar untuk dipersalahkan atau dicela. 'Tidak bercela' dekat dengan makna sumber dan tidak menjelaskan sendiri letak kekurangannya.
- source_word: οὐκ ἂν ... ἐζητεῖτο
  choice: tentu tidak akan dicari
  rationale: οὐκ dengan ἄν dan bentuk lampau menyatakan akibat hipotetis yang berlawanan dengan kenyataan. 'Tentu tidak akan dicari' mempertahankan daya pengandaian tersebut secara wajar.
- source_word: τόπος
  choice: tempat
  rationale: Arti dasarnya adalah 'tempat', tetapi dalam ungkapan ini juga dapat bermakna kesempatan atau alasan bagi sesuatu. Teks utama mempertahankan citra sumber, sedangkan catatan kaki mencatat nuansa idiomatisnya.
- source_word: δευτέρας
  choice: bagi perjanjian yang kedua
  rationale: Adjektiva feminin ini kembali mengandaikan διαθήκη. Pengulangan 'perjanjian' diperlukan agar elipsis Yunani tidak terasa janggal atau kabur dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah kata 'perjanjian' yang tersirat perlu dinyatakan
  choice: Kata 'perjanjian' dinyatakan pada 'yang pertama' dan 'yang kedua'.
  alternative: Memakai 'yang pertama itu' dan 'yang kedua' tanpa menyebut 'perjanjian'.
  rationale: Konteks Ibrani 8:6 dan kutipan berikutnya jelas membandingkan dua perjanjian. Penyebutan kata yang tersirat memperjelas rujukan gramatikal tanpa memasukkan klaim teologis tambahan.
- issue: Sifat cela atau kekurangan pada perjanjian pertama
  choice: Menerjemahkan ἄμεμπτος sebagai 'tidak bercela' tanpa menerangkan sumber atau hakikat cela tersebut.
  alternative: Menjelaskan bahwa masalahnya terletak pada umat, pelaksanaan, atau perjanjian itu sendiri.
  rationale: Ayat ini menyampaikan logika bersyarat tetapi belum menguraikan letak masalahnya; ayat berikutnya melanjutkan argumen itu. Terjemahan mempertahankan ketegangan tersebut dan tidak mendahului penjelasan konteks.
- issue: Makna idiomatis 'dicari tempat'
  choice: Mempertahankan 'dicari tempat' dalam teks utama dan menjelaskan kemungkinan makna idiomatis dalam catatan kaki.
  alternative: Langsung menerjemahkan 'dicari kesempatan' atau 'dicari alasan'.
  rationale: Pilihan ini menjaga metafora Yunani sekaligus memberi pembaca akses kepada nuansa idiomatis tanpa menutup ambiguitas leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur 'Sebab, seandainya ... tentu ...' dipakai untuk menyampaikan hubungan penjelas dan pengandaian yang berlawanan dengan kenyataan. Istilah 'perjanjian' mengikuti konteks surat Ibrani dan mudah dipahami pembaca umum.
