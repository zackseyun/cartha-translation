review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan terutama untuk memperbaiki hubungan sintaksis ὑποδείγματι καὶ σκιᾷ dengan λατρεύουσιν. Frasa "melayani dalam apa yang merupakan" tidak secara tepat dan alami menyatakan bahwa pelayanan para imam berlangsung pada/berkaitan dengan suatu salinan dan bayangan. "Sebagaimana" lebih langsung mencerminkan καθὼς daripada "Demikian juga." Terjemahan "mendirikan Kemah Suci" dapat dipertahankan secara kontekstual untuk ἐπιτελεῖν, yang di sini menunjuk pelaksanaan/pembangunan hingga terwujud.
  naturalness: 'Teks revisi memakai susunan yang lebih lancar dalam bahasa Indonesia baku: "melayani di tempat yang merupakan..." dan "sebagaimana Musa...". Kutipan diperhalus menjadi "Pastikanlah untuk membuat...", yang menyampaikan daya perintah Ὅρα tanpa makna visual yang tidak dimaksudkan.'
  terminology: '"Kemah Suci," "hal-hal surgawi," "gambaran dan bayangan," serta "pola" konsisten dengan register Alkitab Indonesia modern. "Petunjuk ilahi" mempertahankan keluasan κεχρημάτισται; alternatif "diperingatkan oleh Allah" tetap dicatat.'
  issues:
  - severity: medium
    issue: Konstruksi "melayani dalam apa yang merupakan gambaran dan bayangan" kurang tepat dan kurang alami.
    rationale: Datif ὑποδείγματι καὶ σκιᾷ menyatakan objek/ranah pelayanan kultis, yakni salinan dan bayangan dari hal-hal surgawi. Dalam bahasa Indonesia, "melayani di tempat yang merupakan gambaran dan bayangan" menyampaikan relasi itu dengan lebih jelas tanpa mengubah makna.
  - severity: low
    issue: '"Demikian juga" kurang langsung untuk καθὼς.'
    rationale: καθὼς berarti "sebagaimana/just as" dan mengaitkan pelayanan itu dengan petunjuk ilahi kepada Musa. "Sebagaimana" mempertahankan hubungan tersebut secara lebih dekat.
  - severity: low
    issue: Bunyi kutipan "Pastikanlah engkau membuat" agak kaku.
    rationale: '"Pastikanlah untuk membuat" merupakan perintah Indonesia yang lebih idiomatis dan tetap mencerminkan fungsi imperatif dari Ὅρα dalam kutipan.'
  revised_text: Mereka melayani di tempat yang merupakan gambaran dan bayangan dari hal-hal surgawi, sebagaimana Musa menerima petunjuk ilahi[a] ketika ia hendak mendirikan Kemah Suci; sebab Allah berfirman, “Pastikanlah untuk membuat segala sesuatu menurut pola yang telah diperlihatkan kepadamu di gunung.”
