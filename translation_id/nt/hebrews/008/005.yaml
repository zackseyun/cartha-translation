revisions:
- from: Mereka melayani dalam apa yang merupakan gambaran dan bayangan dari hal-hal surgawi. Demikian juga, ketika Musa hendak mendirikan Kemah Suci, ia menerima petunjuk ilahi[a], sebab Allah berfirman, “Pastikanlah engkau membuat segala sesuatu menurut pola yang telah diperlihatkan kepadamu di gunung.”
  to: Mereka melayani di tempat yang merupakan gambaran dan bayangan dari hal-hal surgawi, sebagaimana Musa menerima petunjuk ilahi[a] ketika ia hendak mendirikan Kemah Suci; sebab Allah berfirman, “Pastikanlah untuk membuat segala sesuatu menurut pola yang telah diperlihatkan kepadamu di gunung.”
  rationale: Revisi menyelaraskan sintaksis Indonesia dengan fungsi frasa datif Yunani, mengganti penghubung yang terlalu longgar dengan padanan langsung bagi καθὼς, dan memperlancar perintah dalam kutipan. Tidak ada perubahan doktrinal atau penambahan penafsiran denominatif. Penyebutan Allah sebagai pembicara mengikuti konteks kutipan ilahi, sementara catatan kaki mempertahankan kemungkinan nuansa peringatan pada κεχρημάτισται.
  reviewer_model: gpt-5.6-terra
