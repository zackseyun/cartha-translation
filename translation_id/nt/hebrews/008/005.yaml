reference: Hebrews 8:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: (οἵτινες ὑποδείγματι καὶ σκιᾷ λατρεύουσιν τῶν ἐπουρανίων, καθὼς κεχρημάτισται Μωϋσῆς μέλλων ἐπιτελεῖν τὴν σκηνήν, Ὅρα γάρ, φησίν, ποιήσεις πάντα κατὰ τὸν τύπον τὸν δειχθέντα σοι ἐν τῷ ὄρει)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/005.yaml
  text: who serve a copy and shadow of the heavenly things[a], just as Moses was divinely instructed when he was about to erect the tabernacle; for he says[b], “See that you make everything according to the pattern shown to you on the mountain.”
translation:
  language: id
  text: Mereka melayani di tempat yang merupakan gambaran dan bayangan dari hal-hal surgawi, sebagaimana Musa menerima petunjuk ilahi[a] ketika ia hendak mendirikan Kemah Suci; sebab Allah berfirman, “Pastikanlah untuk membuat segala sesuatu menurut pola yang telah diperlihatkan kepadamu di gunung.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ia diperingatkan oleh Allah.” Kata Yunaninya dapat menekankan peringatan atau teguran ilahi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Mereka
  rationale: Mengacu kembali kepada para imam dalam konteks sebelumnya; bentuk ini alami dalam bahasa Indonesia tanpa melebihkan nuansa kualitatif pronomina Yunani.
- source_word: ὑποδείγματι καὶ σκιᾷ
  choice: dalam apa yang merupakan gambaran dan bayangan
  rationale: Datif menandai ranah atau sarana pelayanan mereka. 'Gambaran' cukup luas untuk padanan atau representasi, sedangkan 'bayangan' mempertahankan metafora khas Ibrani tentang sesuatu yang nyata tetapi tidak sebanding dengan yang surgawi.
- source_word: λατρεύουσιν
  choice: melayani
  rationale: Menunjukkan pelayanan keagamaan atau kultis; konteks Kemah Suci memperjelas sifat sakralnya.
- source_word: τῶν ἐπουρανίων
  choice: dari hal-hal surgawi
  rationale: Genitif berkaitan dengan 'gambaran' dan 'bayangan'. Ungkapan ini mempertahankan keluasan rujukan tanpa membatasinya hanya pada lokasi atau menafsirkannya secara abstrak sebagai 'realitas'.
- source_word: καθὼς
  choice: Demikian juga
  rationale: Mengungkapkan kesesuaian dengan petunjuk yang diterima Musa sambil menghasilkan alur Indonesia yang alami.
- source_word: κεχρημάτισται
  choice: menerima petunjuk ilahi
  rationale: Verba ini menyiratkan komunikasi dari Allah dan dapat pula mengandung nada peringatan; pilihan utama mempertahankan unsur pewahyuan dan pengarahan.
- source_word: μέλλων ἐπιτελεῖν τὴν σκηνήν
  choice: ketika Musa hendak mendirikan Kemah Suci
  rationale: '''Hendak'' mempertahankan aspek prospektif μέλλων. Dalam konteks pembangunan tempat ibadah, ''mendirikan'' menyampaikan tindakan melaksanakan hingga terwujud tanpa ungkapan Indonesia yang janggal.'
- source_word: Ὅρα
  choice: Pastikanlah
  rationale: Imperatif ini dalam konteks perintah berarti memperhatikan dengan sungguh-sungguh atau memastikan, bukan sekadar melihat secara visual.
- source_word: ποιήσεις πάντα
  choice: engkau membuat segala sesuatu
  rationale: Futurum Yunani berfungsi sebagai perintah dalam kutipan; bentuk imperatif Indonesia lebih alami dan tetap mempertahankan daya perintahnya.
- source_word: κατὰ τὸν τύπον
  choice: menurut pola
  rationale: '''Pola'' menyampaikan model atau rancangan normatif yang diperlihatkan kepada Musa.'
theological_decisions:
- issue: Hubungan tempat ibadah duniawi dengan hal-hal surgawi
  choice: gambaran dan bayangan dari hal-hal surgawi
  alternative: salinan dan bayangan dari realitas surgawi
  rationale: Pilihan ini mempertahankan hubungan kesesuaian sekaligus ketidaksetaraan antara pelayanan duniawi dan yang surgawi, tanpa mereduksinya menjadi simbol belaka atau menetapkan ontologi yang lebih sempit daripada teks.
- issue: Daya makna κεχρημάτισται
  choice: menerima petunjuk ilahi
  alternative: diperingatkan oleh Allah
  rationale: Kata kerja ini menandakan komunikasi ilahi dan dalam konteks dapat bernuansa peringatan. Teks utama mempertahankan dimensi pewahyuan dan pengarahan; alternatif dicatat agar nuansa peringatannya tidak hilang.
- issue: Subjek tersirat dari φησίν
  choice: Allah berfirman
  alternative: firman-Nya berbunyi
  rationale: Konteks kutipan ilahi dan bentuk pasif sebelumnya mendukung Allah sebagai pembicara tersirat. Penyebutan eksplisit memperjelas bahasa Indonesia tanpa mengubah sumber perintah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. 'Kemah Suci' dipakai sebagai istilah mapan bagi σκηνή dalam konteks tempat ibadah Musa; 'engkau' mempertahankan sapaan tunggal dalam kutipan ilahi.
