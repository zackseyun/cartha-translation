  text: ἐν τῷ λέγειν Καινὴν πεπαλαίωκεν τὴν πρώτην, τὸ δὲ παλαιούμενον καὶ γηράσκον ἐγγὺς ἀφανισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/013.yaml
  text: By saying[a], “new,” he has made the first obsolete[c][b]. And what is becoming obsolete and growing old is near to disappearing.
translation:
  language: id
  text: Dengan berkata, “baru,”[a] Ia telah membuat yang pertama menjadi usang.[b] Yang menjadi usang dan menua itu hampir lenyap.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ketika Ia berkata, ‘baru.’” Kata “baru” menggemakan ungkapan “perjanjian baru” dalam kutipan sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: “Yang pertama” merujuk pada perjanjian pertama.
    reason: cross_reference
  - marker: c
    text: Atau, “dekat kepada lenyap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγειν
  choice: Dengan menyebutnya
  rationale: Konstruksi ἐν dengan infinitif artikular dapat menyatakan keadaan atau sarana. Dalam konteks ini, “Dengan menyebutnya” alami dalam bahasa Indonesia dan mempertahankan hubungan langsung antara sebutan “baru” dan akibatnya bagi yang pertama.
- source_word: Καινὴν
  choice: “baru”
  rationale: Adjektiva ini berdiri secara eliptis dan menggemakan ungkapan “perjanjian baru” dalam kutipan sebelumnya. Terjemahan hanya dengan “baru” mempertahankan keringkasan teks Yunani; pronomina -nya membantu kealamian tanpa menambahkan nomina “perjanjian” ke dalam kutipan.
- source_word: πεπαλαίωκεν
  choice: telah membuat ... menjadi usang
  rationale: Bentuk perfek menyatakan tindakan yang telah terjadi dengan hasil yang tetap berlaku. “Telah membuat ... menjadi usang” menyampaikan daya kausatif dan relevansi masa kini.
- source_word: τὴν πρώτην
  choice: yang pertama
  rationale: Adjektiva ini dipakai secara substantival dan dari konteks merujuk pada perjanjian pertama. “Yang pertama” mempertahankan bentuk eliptis bahasa Yunani tanpa menambahkan nomina dalam teks utama.
- source_word: τὸ ... παλαιούμενον
  choice: apa yang menjadi usang
  rationale: Partisipel kini menunjukkan proses yang sedang berlangsung. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan perbedaan aspek dengan verba perfek sebelumnya.
- source_word: γηράσκον
  choice: semakin tua
  rationale: Pilihan ini mempertahankan gambaran penuaan dan menyatakan proses berkelanjutan secara alami.
- source_word: ἐγγὺς
  choice: sudah dekat pada
  rationale: ἐγγύς dengan genitif menyatakan kedekatan. Kata “sudah” membantu menyampaikan keadaan kini tanpa mengubah kedekatan menjadi kepastian waktu yang lebih spesifik.
- source_word: ἀφανισμοῦ
  choice: lenyapnya
  rationale: Nomina ini menunjuk pada keadaan menjadi tidak tampak, hilang, atau lenyap. “Lenyapnya” ringkas, wajar, dan tidak mempersempit maknanya menjadi penghancuran.
theological_decisions:
- issue: Subjek tersirat dalam ἐν τῷ λέγειν Καινὴν
  choice: Dia
  alternative: Allah; Kitab Suci
  rationale: Bahasa Yunani tidak menyebut subjek secara eksplisit, tetapi konteks kutipan menampilkan Allah sebagai pembicara. “Dia” mempertahankan subjek yang tidak diperinci dalam ayat ini tanpa menggantikannya dengan sebutan teologis yang lebih eksplisit.
- issue: Status perjanjian pertama
  choice: telah membuat yang pertama menjadi usang
  alternative: telah menjadikan yang pertama tua
  rationale: Dalam konteks kontras antara perjanjian pertama dan perjanjian baru, παλαιόω menyatakan bahwa yang pertama telah menjadi kedaluwarsa atau usang. Pilihan ini menyampaikan argumen penulis tanpa memperluasnya menjadi klaim mengenai setiap unsur hukum.
- issue: Tahap proses menuju ἀφανισμός
  choice: sudah dekat pada lenyapnya
  alternative: sudah dekat untuk ditiadakan
  rationale: “Lenyapnya” mempertahankan citra dan ketidakspesifikan nomina Yunani, tanpa menentukan mekanisme atau bentuk peniadaannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Struktur eliptis teks Yunani dipertahankan melalui “baru” dan “yang pertama”, sementara pronomina -nya pada “menyebutnya” membuat kalimat alami. Semua penanda catatan kaki ditempatkan pada bagian teks yang dijelaskan.
