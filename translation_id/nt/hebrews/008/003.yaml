  text: πᾶς γὰρ ἀρχιερεὺς εἰς τὸ προσφέρειν δῶρά τε καὶ θυσίας καθίσταται· ὅθεν ἀναγκαῖον ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/003.yaml
  text: For every high priest is appointed to offer both gifts and sacrifices[a]; therefore it is necessary for this one also to have something that he may offer.
translation:
  language: id
  text: Sebab setiap imam besar ditetapkan untuk mempersembahkan persembahan dan kurban. Karena itu, imam besar ini juga harus mempunyai sesuatu yang dapat ia persembahkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Karena itu, imam besar ini juga perlu mempunyai sesuatu untuk dipersembahkan.” Dalam bahasa Yunani, identitas “imam besar ini” tidak disebutkan dengan nama; dalam konteks, ungkapan ini merujuk kepada Yesus sebagai Imam Besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ἀρχιερεὺς
  choice: Sebab setiap imam besar
  rationale: πᾶς dengan nomina tunggal bersifat distributif, yaitu 'setiap'. γάρ menyatakan alasan atau penjelasan bagi ayat sebelumnya, sehingga diterjemahkan 'Sebab'. ἀρχιερεύς secara tepat diterjemahkan 'imam besar'.
- source_word: εἰς τὸ προσφέρειν
  choice: untuk mempersembahkan
  rationale: Infinitif berartikel dengan εἰς menyatakan tujuan; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan daya purposifnya.
- source_word: δῶρά τε καὶ θυσίας
  choice: baik pemberian maupun kurban
  rationale: Pasangan τε καὶ tercermin melalui 'baik ... maupun ...'. 'Pemberian' dan 'kurban' dipertahankan sebagai dua kategori peribadatan yang berbeda dalam Ibrani.
- source_word: καθίσταται
  choice: ditetapkan
  rationale: Dalam konteks jabatan keimaman, bentuk pasif ini menunjuk pada penetapan atau pengangkatan seseorang untuk menjalankan tugas.
- source_word: ὅθεν
  choice: Karena itu
  rationale: ὅθεν memperkenalkan kesimpulan logis dari pernyataan sebelumnya.
- source_word: ἀναγκαῖον ἔχειν
  choice: harus mempunyai
  rationale: Ungkapan ini menyatakan keharusan. Bentuk 'harus mempunyai' lebih alami dalam bahasa Indonesia daripada konstruksi impersonal yang kaku.
- source_word: τι
  choice: sesuatu
  rationale: Pronomina tak tentu ini menunjuk pada suatu hal yang tidak disebutkan secara khusus untuk dipersembahkan.
- source_word: καὶ τοῦτον
  choice: orang ini juga
  rationale: τοῦτον mempertahankan daya demonstratif 'ini', sedangkan καί diterjemahkan 'juga'. Dalam konteks, yang dimaksud adalah Yesus sebagai Imam Besar, tetapi nama itu tidak ditambahkan ke teks utama.
- source_word: ὃ προσενέγκῃ
  choice: untuk dipersembahkannya
  rationale: Klausa relatif dengan aoristus subjungtif menyatakan sesuatu yang tersedia atau dimaksudkan untuk ia persembahkan. Ungkapan Indonesia ini menyampaikan maksud tersebut secara wajar.
theological_decisions:
- issue: Rujukan τοῦτον ('orang ini')
  choice: Teks utama mempertahankan ungkapan demonstratif 'orang ini'; konteks mengarah kepada Yesus sebagai Imam Besar.
  alternative: Menyebut 'Yesus', 'Kristus', atau 'Dia' secara eksplisit dalam teks utama.
  rationale: Bahasa Yunani memakai demonstratif dan tidak menyebut nama. Mempertahankannya menghindari penambahan yang menutup bentuk implisit teks, sementara catatan kaki menjelaskan rujukan kontekstualnya.
- issue: Istilah peribadatan δῶρα dan θυσίαι
  choice: Mempertahankan dua kategori sebagai 'pemberian' dan 'kurban'.
  alternative: Menggabungkannya menjadi 'persembahan' atau menjelaskannya sebagai persembahan Kristus sendiri.
  rationale: Ayat ini menyatakan prinsip umum tentang tugas imam besar. Pembedaan kedua istilah perlu dijaga tanpa memasukkan penjelasan doktrinal yang belum dinyatakan secara eksplisit di sini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur sebab-akibat dibuat jelas. Istilah 'imam besar' dan 'kurban' mempertahankan konteks keimaman, sedangkan 'orang ini' sengaja menjaga bentuk demonstratif dan ketidaklangsungan rujukan dalam sumber Yunani.
