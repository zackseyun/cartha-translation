reference: Hebrews 8:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ καὶ ἕκαστος τὸν ἀδελφὸν αὐτοῦ, λέγων· Γνῶθι τὸν κύριον, ὅτι πάντες εἰδήσουσίν με ἀπὸ ⸀μικροῦ ἕως μεγάλου αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/011.yaml
  text: And they will certainly not teach[a], each one his fellow citizen and each one his brother, saying, ‘Know the Lord,’ because they will all know me, from the least of them to the greatest.
translation:
  language: id
  text: Setiap orang sama sekali tidak akan mengajar[a] sesama warga negaranya atau saudaranya dengan berkata, “Kenallah Tuhan,” sebab mereka semua akan mengenal Aku, dari yang terkecil sampai yang terbesar di antara mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tetangganya.” Teks Yunani dalam Surat Ibrani memakai kata yang berarti “sesama warga negara,” sedangkan bagian Yeremia yang mendasari kutipan ini lazim diterjemahkan “tetangga.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ μὴ διδάξωσιν
  choice: sama sekali tidak akan mengajar
  rationale: Gabungan οὐ μή dengan subjungtif aoris menyatakan penyangkalan yang tegas. Ungkapan ini mempertahankan penekanan tersebut dalam bahasa Indonesia modern.
- source_word: ἕκαστος
  choice: masing-masing
  rationale: Kata ini bersifat distributif dan menyoroti setiap anggota komunitas secara individual.
- source_word: πολίτην
  choice: sesama warga negara
  rationale: πολίτης secara leksikal berarti warga atau sesama warga. Pilihan ini mengikuti teks Yunani Ibrani, meskipun kutipan Yeremia yang mendasarinya lazim diterjemahkan dengan istilah 'sesama' atau 'tetangga'.
- source_word: ἀδελφόν
  choice: saudaranya
  rationale: Mempertahankan istilah kekerabatan dalam bentuk tunggal. Dalam bahasa Indonesia, 'saudara' dapat merujuk kepada saudara laki-laki ataupun secara lebih luas kepada anggota komunitas.
- source_word: Γνῶθι
  choice: Kenallah
  rationale: Imperatif aoris ini merupakan perintah langsung. 'Kenallah' alami dalam konteks pengenalan akan Tuhan dan mempertahankan bentuk perintah.
- source_word: κύριον
  choice: Tuhan
  rationale: Padanan baku dan sesuai konteks perjanjian bagi κύριος.
- source_word: εἰδήσουσίν με
  choice: mereka semua akan mengenal Aku
  rationale: Mempertahankan πάντες, kala mendatang, dan objek eksplisit 'Aku'. Kapitalisasi 'Aku' mengikuti acuan ilahi dalam tuturan kutipan.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: dari yang terkecil sampai yang terbesar di antara mereka
  rationale: Mengungkapkan keseluruhan rentang orang dalam kelompok tanpa membatasi maknanya hanya pada umur, ukuran, atau kedudukan.
theological_decisions:
- issue: Istilah komunitas perjanjian πολίτην dalam kutipan atau alusi Yeremia 31:34
  choice: sesama warga negara
  alternative: sesama; tetangga
  rationale: Teks Yunani Ibrani memakai πολίτην, sehingga teks utama mempertahankan kekhususan leksikalnya. Padanan yang lebih lazim dari konteks Yeremia dicatat dalam catatan kaki.
- issue: Bahasa kekerabatan pada ἀδελφόν
  choice: saudaranya
  alternative: saudara laki-lakinya; saudara atau saudarinya
  rationale: Pilihan ini mempertahankan metafora kekeluargaan dan bentuk tunggal tanpa menambahkan pasangan gender yang tidak tersurat dalam teks.
- issue: Cakupan ungkapan μικροῦ ... μεγάλου
  choice: yang terkecil ... yang terbesar
  alternative: yang paling muda ... yang paling tua; yang rendah ... yang tinggi
  rationale: Teks tidak menetapkan satu dimensi saja, sehingga terjemahan mempertahankan keluasan idiom dan tidak membatasinya pada umur atau status.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pengulangan 'masing-masing' dipertahankan untuk mencerminkan struktur distributif teks Yunani; 'sama sekali tidak' menyampaikan penyangkalan yang tegas.
