reference: Hebrews 8:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι αὕτη ἡ διαθήκη ἣν διαθήσομαι τῷ οἴκῳ Ἰσραὴλ μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν, καὶ ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς, καὶ ἔσομαι αὐτοῖς εἰς θεόν καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/010.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], says the Lord: putting my laws into their minds, and I will write them on their hearts; and I will be their God, and they will be my people.'
translation:
  language: id
  text: 'Sebab inilah perjanjian yang akan Kuadakan dengan kaum Israel sesudah hari-hari itu, firman Tuhan: dengan menaruh hukum-hukum-Ku dalam pikiran mereka, Aku akan menuliskannya pada hati mereka; Aku akan menjadi Allah mereka, dan mereka akan menjadi umat-Ku.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dengan susunan yang lebih lancar: “Aku akan menaruh hukum-hukum-Ku dalam pikiran mereka dan menuliskannya pada hati mereka.” Teks Yunani memakai bentuk partisipel (“dengan menaruh/memberikan”), lalu verba bentuk mendatang (“Aku akan menulis”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: perjanjian
  rationale: Dalam konteks kutipan Yeremia, kata ini menunjuk pada ikatan perjanjian Allah, bukan surat wasiat.
- source_word: διαθήσομαι
  choice: akan Kuadakan
  rationale: Ungkapan ini alami dalam bahasa Indonesia untuk tindakan membuat atau menetapkan perjanjian dan mempertahankan bentuk orang pertama ilahi.
- source_word: οἴκῳ Ἰσραὴλ
  choice: kaum Israel
  rationale: ‘Kaum Israel’ menyampaikan pengertian kolektif ‘house of Israel’ secara wajar sekaligus mempertahankan corak kenabian.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: sesudah hari-hari itu
  rationale: Terjemahan langsung ini mempertahankan idiom waktu serta kaitan verbal dengan nubuat Yeremia.
- source_word: κύριος
  choice: Tuhan
  rationale: Menerjemahkan κύριος secara langsung dalam konteks perkataan ilahi.
- source_word: διδοὺς
  choice: dengan menaruh
  rationale: Mempertahankan nilai partisipel Yunani dan menyatakan cara perjanjian itu dilaksanakan tanpa mengubahnya menjadi verba masa depan kedua.
- source_word: νόμους
  choice: hukum-hukum
  rationale: Bentuk jamak Yunani dipertahankan dan tidak diratakan menjadi ‘hukum’ tunggal.
- source_word: διάνοιαν αὐτῶν
  choice: pikiran mereka
  rationale: ‘Pikiran’ secara alami menyatakan kemampuan memahami dan berpikir; bahasa Indonesia tidak memerlukan bentuk jamak untuk menyatakan pikiran sejumlah orang.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: pada hati mereka
  rationale: Preposisi ‘pada’ mempertahankan gambaran menulis pada suatu permukaan dan bahasa Indonesia lazim memakai nomina kolektif tunggal di sini.
- source_word: ἐπιγράψω
  choice: Aku juga akan menuliskannya
  rationale: ‘Menuliskan’ mempertahankan metafora inskripsi; ‘-nya’ merujuk kepada hukum-hukum, sedangkan ‘juga’ membuat koordinasi dengan partisipel dapat dipahami.
- source_word: ἔσομαι αὐτοῖς εἰς θεόν
  choice: Aku akan menjadi Allah mereka
  rationale: Ini merupakan rumusan perjanjian yang alami dan tepat dalam bahasa Indonesia.
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: mereka akan menjadi umat-Ku
  rationale: ‘Umat-Ku’ mempertahankan hubungan kepunyaan dan persekutuan dalam rumusan perjanjian.
theological_decisions:
- issue: Kesinambungan antarteks dengan perjanjian baru dalam Yeremia
  choice: Mempertahankan ungkapan perjanjian seperti ‘kaum Israel’, ‘hukum-hukum-Ku’, ‘hati mereka’, ‘Allah mereka’, dan ‘umat-Ku’.
  alternative: Menggunakan parafrasa kontemporer yang mengurangi gema bahasa nubuat Yeremia.
  rationale: Kekuatan teologis ayat ini bergantung pada pengenalannya sebagai kutipan janji perjanjian dalam Yeremia; bahasa perjanjian tidak boleh disamarkan.
- issue: Konstruksi campuran partisipel διδοὺς dan verba futur ἐπιγράψω
  choice: Mempertahankan perbedaan bentuk melalui ‘dengan menaruh ... Aku juga akan menuliskannya’.
  alternative: ‘Aku akan menaruh hukum-hukum-Ku dalam pikiran mereka dan menuliskannya pada hati mereka.’
  rationale: Teks Yunani memiliki partisipel ‘menaruh/memberikan’ lalu verba futur ‘Aku akan menulis’. Teks utama mempertahankan ketegangan gramatikal itu, sementara bentuk yang lebih lancar dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Struktur sumber yang agak tidak rata dipertahankan sejauh masih dapat dipahami, dengan bentuk yang lebih lancar diberikan dalam catatan kaki.
