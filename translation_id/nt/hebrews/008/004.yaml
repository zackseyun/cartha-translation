base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/004.yaml
  text: If he were on earth[a], he would not even be a priest, since there are those who offer the gifts according to the law.
translation:
  language: id
  text: Seandainya dia berada di bumi, dia bahkan tidak akan menjadi imam, sebab ada orang-orang yang mempersembahkan persembahan[a] sesuai dengan hukum Taurat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pemberian-pemberian”; dalam konteks ini, istilah tersebut menunjuk pada persembahan ibadah.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: Seandainya
  rationale: Dalam konstruksi ini, εἰ dengan bentuk lampau dan ἄν menyatakan keadaan yang berlawanan dengan kenyataan. “Seandainya” menyampaikan fungsi pengandaian itu secara wajar; daya penghubung partikel lainnya dipahami dari konteks.
- source_word: ἦν ἐπὶ γῆς
  choice: dia berada di bumi
  rationale: “Berada di bumi” secara alami menyatakan lokasi dan mempertahankan kontras dengan ranah surgawi dalam konteks. Subjek “dia” merujuk kepada Yesus/Mesias dari ayat-ayat sebelumnya.
- source_word: οὐδ’ ἂν ἦν ἱερεύς
  choice: dia bahkan tidak akan menjadi imam
  rationale: “Bahkan tidak akan” mempertahankan penegasan negatif οὐδέ bersama ἄν, sedangkan “menjadi imam” merupakan ungkapan Indonesia yang alami dalam konstruksi pengandaian ini.
- source_word: ὄντων τῶν προσφερόντων
  choice: sebab sudah ada orang-orang yang mempersembahkan
  rationale: Genitif absolut ini paling wajar dipahami sebagai alasan. “Sudah ada” menegaskan keberadaan para imam yang menjalankan pelayanan tersebut tanpa mengubah hubungan logis kalimat.
- source_word: κατὰ νόμον
  choice: sesuai dengan hukum Taurat
  rationale: Dalam konteks keimaman dan persembahan, νόμος menunjuk pada tatanan hukum Musa. “Hukum Taurat” jelas bagi pembaca Indonesia dan “sesuai dengan” menerjemahkan κατὰ secara alami.
- source_word: τὰ δῶρα
  choice: persembahan
  rationale: Dalam konteks ibadah kurban, δῶρα adalah pemberian yang dipersembahkan kepada Allah. “Persembahan” menyampaikan makna kontekstual dengan jelas, sementara arti harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Subjek tersirat dalam klausa pengandaian
  choice: Menuliskan “dia”, yang merujuk kepada Yesus/Mesias dalam konteks langsung.
  alternative: Menyebut “Yesus” atau “Mesias” secara eksplisit.
  rationale: Bahasa Indonesia memerlukan subjek yang jelas, tetapi penyebutan nama atau gelar akan lebih eksplisit daripada teks Yunani. Pronomina mempertahankan kesinambungan wacana tanpa menambahkan penegasan teologis.
- issue: Daya pengandaian
  choice: Menggunakan “Seandainya ... tidak akan ...” sebagai pengandaian yang berlawanan dengan kenyataan.
  alternative: Menggunakan “Jika ... tidak akan ...”, yang dapat terdengar sebagai kemungkinan terbuka.
  rationale: Konstruksi εἰ + imperfek dengan ἄν + imperfek secara alami menyatakan keadaan yang tidak nyata. “Seandainya” mempertahankan daya tersebut tanpa memperluas kesimpulan teologisnya.
- issue: Identitas hukum
  choice: Menerjemahkan νόμος sebagai “hukum Taurat”.
  alternative: Menerjemahkan secara lebih umum sebagai “hukum”.
  rationale: Konteks para imam dan persembahan menunjukkan hukum Musa. Ungkapan Indonesia “hukum Taurat” memperjelas rujukan kontekstual tanpa mengimpor aturan di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “dia” dipakai secara alami tanpa kapitalisasi khusus bagi pronomina ilahi. Pengulangan “mempersembahkan persembahan” dipertahankan karena jelas dalam konteks ibadah dan memungkinkan verba προσφέρω serta nomina δῶρα tetap dibedakan secara semantis.
