- from: Namun sekarang, Ia telah memperoleh pelayanan yang jauh lebih unggul, sebab Ia juga adalah pengantara dari perjanjian yang lebih baik[a], yang telah ditetapkan berdasarkan janji-janji yang lebih baik[b].
  to: Namun, sekarang Ia telah memperoleh pelayanan yang lebih unggul, sejauh Ia juga menjadi Pengantara perjanjian yang lebih baik[a], yang telah diberlakukan berdasarkan janji-janji yang lebih baik[b].
  rationale: Revisi menghilangkan intensifier yang tidak eksplisit dalam sumber, memulihkan hubungan komparatif-proporsional ὅσῳ καί, dan memilih “telah diberlakukan” untuk nuansa legal-kovenantal νενομοθέτηται. Catatan kaki dipertahankan dan diselaraskan dengan pilihan teks utama.
