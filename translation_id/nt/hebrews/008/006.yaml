  text: ⸀νυνὶ δὲ διαφορωτέρας τέτυχεν λειτουργίας, ὅσῳ καὶ κρείττονός ἐστιν διαθήκης μεσίτης, ἥτις ἐπὶ κρείττοσιν ἐπαγγελίαις νενομοθέτηται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/006.yaml
  text: But as it is[a], he has obtained a more excellent ministry, by as much as he is also the mediator of a better covenant[c][b], which has been enacted on better promises.
translation:
  language: id
  text: Namun, sekarang Ia telah memperoleh pelayanan yang lebih unggul, sejauh Ia juga menjadi Pengantara perjanjian yang lebih baik[a], yang telah diberlakukan berdasarkan janji-janji yang lebih baik[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “perjanjian” juga dapat berarti “wasiat” dalam konteks tertentu; di sini “perjanjian” sesuai dengan janji tentang perjanjian baru dalam Kitab Yeremia yang dikutip pada ayat-ayat berikutnya.
    reason: alternative_reading
  - marker: b
    text: Atau “yang telah ditetapkan atas dasar janji-janji yang lebih baik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Namun sekarang
  rationale: Menyatakan kontras sekaligus keadaan kini terhadap pelayanan para imam di bumi yang baru saja dibahas.
- source_word: διαφορωτέρας
  choice: jauh lebih unggul
  rationale: Bentuk komparatif ini menyatakan keunggulan mutu; 'jauh' membantu mengungkapkan daya komparatif yang berkaitan dengan ὅσῳ tanpa mengubah arah argumen.
- source_word: τέτυχεν
  choice: telah memperoleh
  rationale: 'Bentuk perfektum menunjukkan tindakan yang sudah terjadi dengan hasil yang tetap berlaku: Kristus kini memiliki pelayanan tersebut.'
- source_word: λειτουργίας
  choice: pelayanan
  rationale: Dalam konteks ini menunjuk pada pelayanan suci Kristus sebagai imam; 'pelayanan' alami dan tidak menjelaskan secara berlebihan apa yang sudah diberikan konteks.
- source_word: ὅσῳ καὶ
  choice: sebab ... juga
  rationale: Dalam bahasa Indonesia, hubungan keunggulan pelayanan dengan keunggulan perjanjian dinyatakan secara alami sebagai dasar atau ukuran keunggulan; daya komparatifnya tetap tampak melalui dua ungkapan 'lebih ...'.
- source_word: κρείττονός ... διαθήκης
  choice: dari perjanjian yang lebih baik
  rationale: κρείττων merupakan istilah utama dalam Ibrani untuk keunggulan. 'Lebih baik' mempertahankan pengulangan komparatif itu, sedangkan 'perjanjian' paling sesuai dengan kutipan Yeremia pada ayat-ayat berikutnya.
- source_word: μεσίτης
  choice: pengantara
  rationale: Istilah ini menyatakan pihak yang berada di antara pihak-pihak lain untuk mewujudkan hubungan perjanjian; 'pengantara' baku, jelas, dan bermartabat.
- source_word: ἥτις
  choice: yang
  rationale: Mengacu kembali kepada perjanjian dan memperkenalkan klausa penjelas tanpa menambahkan penafsiran yang tidak diperlukan.
- source_word: ἐπὶ κρείττοσιν ἐπαγγελίαις
  choice: berdasarkan janji-janji yang lebih baik
  rationale: ἐπί dengan datif di sini menunjukkan dasar atau landasan; 'berdasarkan' menyampaikan relasi tersebut dengan jelas dalam bahasa Indonesia.
- source_word: νενομοθέτηται
  choice: telah ditetapkan
  rationale: Perfektum pasif menyatakan bahwa perjanjian itu telah diberlakukan atau ditetapkan dan tetap berlaku. Catatan kaki mempertahankan nuansa legal alternatif.
theological_decisions:
- issue: Makna διαθήκη dalam Ibrani 8:6
  choice: perjanjian
  alternative: wasiat
  rationale: Konteks langsung mengacu pada janji perjanjian baru dalam Yeremia dan pada perantaraan keimaman. Karena itu, 'perjanjian' mencerminkan latar Perjanjian Lama dengan paling tepat; catatan kaki tetap mengakui cakupan makna katanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan rangkaian komparatif penulis sambil menghindari bentuk harfiah yang kaku. Huruf kapital pada 'Ia' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Kristus.
