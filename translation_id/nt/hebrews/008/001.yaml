id: HEB.8.1
reference: Hebrews 8:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις, τοιοῦτον ἔχομεν ἀρχιερέα, ὃς ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης ἐν τοῖς οὐρανοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/001.yaml
  text: 'The main point in what is being said is this: we have such a high priest[a], who sat down at the right hand of the throne of the Majesty in the heavens[b],'
translation:
  language: id
  text: 'Pokok utama[a] dari apa yang sedang dibicarakan ialah ini: kita mempunyai Imam Besar yang demikian, yang telah duduk di sebelah kanan takhta Yang Mahamulia di surga[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ringkasan” atau “pokok terpenting” dari apa yang sedang dibicarakan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di surga-surga”; bahasa Yunani memakai bentuk jamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κεφάλαιον
  choice: Pokok utama
  rationale: Dalam konteks peralihan wacana ini, kata tersebut menunjuk pada pokok utama atau ringkasan pembahasan, bukan pada “bab” secara harfiah.
- source_word: δὲ
  choice: tidak dinyatakan tersendiri
  rationale: Partikel ini menandai peralihan ringan; dalam bahasa Indonesia, fungsi itu sudah tersampaikan secara alami melalui pembukaan “Pokok utama ... ialah ini” tanpa perlu menambahkan “sekarang” atau kontras yang kuat.
- source_word: ἐπὶ τοῖς λεγομένοις
  choice: dari apa yang sedang dibicarakan
  rationale: Ungkapan ini mempertahankan acuan pada pembahasan yang sedang berlangsung dan bentuk pasif kini, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: τοιοῦτον
  choice: yang demikian
  rationale: Ungkapan ini merujuk kembali kepada jenis Imam Besar yang telah diuraikan sebelumnya.
- source_word: ἔχομεν
  choice: kita mempunyai
  rationale: Padanan langsung dan wajar untuk kepemilikan dalam kala kini.
- source_word: ἀρχιερέα
  choice: Imam Besar
  rationale: Istilah baku dan tepat bagi jabatan keimaman utama dalam konteks Ibrani.
- source_word: ἐκάθισεν
  choice: telah duduk
  rationale: Menyatakan tindakan lampau yang selesai tanpa menambahkan tafsiran tentang makna teologis tindakan tersebut.
- source_word: ἐν δεξιᾷ
  choice: di sebelah kanan
  rationale: Mempertahankan idiom tempat kehormatan dan kewenangan tertinggi dalam bentuk yang alami bagi pembaca Indonesia.
- source_word: τοῦ θρόνου
  choice: takhta
  rationale: Mempertahankan gambaran kerajaan; hubungan genetif tersampaikan secara alami dalam frasa “di sebelah kanan takhta”.
- source_word: τῆς μεγαλωσύνης
  choice: Yang Mahamulia
  rationale: Mempertahankan sebutan tidak langsung dan penuh hormat bagi Allah tanpa menggantinya dengan nama “Allah” yang tidak dinyatakan secara eksplisit dalam teks Yunani.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: di surga
  rationale: Bahasa Indonesia lazim memakai bentuk tunggal kolektif “surga”; catatan kaki mempertahankan informasi bahwa bentuk Yunani harfiah adalah jamak.
theological_decisions:
- issue: Apakah sebutan τῆς μεγαλωσύνης harus diperjelas sebagai Allah
  choice: Mempertahankan sebutan penghormatan “Yang Mahamulia”
  alternative: “Allah” atau “Yang Mahabesar”
  rationale: Teks Yunani memakai sebutan tidak langsung, bukan kata θεός. Terjemahan ini menjaga gaya retoris dan tidak membuat rujukannya lebih eksplisit daripada sumber.
- issue: Apakah ἐκάθισεν harus diperluas untuk menonjolkan selesainya karya keimaman
  choice: Menerjemahkannya secara ringkas sebagai “telah duduk”
  alternative: “telah menduduki tempat-Nya dalam kemenangan setelah menyelesaikan karya-Nya”
  rationale: Konteks Ibrani memang memberi makna teologis pada tindakan duduk, tetapi penjelasan itu tidak boleh disisipkan ke dalam kata kerja ini.
- issue: Bilangan jamak dalam ἐν τοῖς οὐρανοῖς
  choice: Memakai ungkapan Indonesia “di surga” dengan catatan bentuk Yunani jamak
  alternative: “di surga-surga”
  rationale: Bentuk ulang “surga-surga” terasa tidak alami dan dapat menyiratkan pembagian kosmologis yang tidak perlu; catatan kaki menjaga bentuk sumber tanpa memaksakan kejanggalan dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, formal namun mudah dipahami. Kapitalisasi “Imam Besar” dan “Yang Mahamulia” menandai gelar serta sebutan penghormatan dalam konteks ini. Ayat diakhiri koma karena kalimat berlanjut ke ayat berikutnya.
