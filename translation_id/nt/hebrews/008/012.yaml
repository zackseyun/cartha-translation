  text: ὅτι ἵλεως ἔσομαι ταῖς ἀδικίαις αὐτῶν, καὶ τῶν ἁμαρτιῶν ⸀αὐτῶν οὐ μὴ μνησθῶ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/012.yaml
  text: For I will be merciful toward their unrighteousness[b][a], and I will remember their sins no more.
translation:
  language: id
  text: Sebab Aku akan berbelas kasihan terhadap perbuatan mereka yang tidak benar[a], dan Aku sama sekali tidak akan mengingat dosa-dosa mereka lagi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terhadap ketidakbenaran mereka” atau “terhadap ketidakadilan mereka.” Kata Yunani ini dapat menunjuk pada kesalahan moral maupun tindakan tidak adil.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “Aku sekali-kali tidak akan mengingat dosa-dosa mereka lagi.” Dalam konteks perjanjian, ungkapan ini menyatakan pengampunan sepenuhnya, bukan bahwa Allah kehilangan pengetahuan tentang dosa-dosa itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam kutipan ini, ὅτι memperkenalkan alasan atau dasar bagi janji perjanjian sebelumnya; “Sebab” mempertahankan fungsi penjelas tersebut secara alami.
- source_word: ἵλεως ἔσομαι
  choice: Aku akan berbelas kasihan
  rationale: ἵλεως menyatakan sikap penuh belas kasihan atau kemurahan yang mengaruniakan pengampunan. Ungkapan ini jelas dalam bahasa Indonesia dan tidak memakai istilah teknis yang dapat mempersempit maknanya.
- source_word: ταῖς ἀδικίαις αὐτῶν
  choice: terhadap segala perbuatan mereka yang tidak benar
  rationale: Bentuk jamak ἀδικίαις dapat menunjuk pada berbagai tindakan salah atau tidak adil. Susunan ini mempertahankan segi moral dan makna konkret bentuk jamaknya tanpa membatasinya hanya pada ketidakadilan sosial.
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung sederhana dipertahankan secara langsung.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: dosa-dosa mereka
  rationale: Bentuk jamak ἁμαρτιῶν secara alami diterjemahkan sebagai “dosa-dosa,” dengan pronomina kepunyaan tetap dipertahankan.
- source_word: οὐ μὴ μνησθῶ ἔτι
  choice: Aku sama sekali tidak akan mengingat ... lagi
  rationale: Gabungan οὐ μή dengan bentuk subjunktif menyatakan penyangkalan yang tegas, sedangkan ἔτι berarti “lagi” atau “lebih lama.” “Sama sekali tidak ... lagi” menyampaikan tekanan tersebut dengan bahasa Indonesia yang alami.
theological_decisions:
- issue: Makna Allah tidak lagi mengingat dosa
  choice: Mempertahankan ungkapan perjanjian bahwa Allah tidak akan mengingat dosa-dosa mereka lagi
  alternative: Menjelaskannya langsung sebagai Allah tidak lagi memperhitungkan atau menuntut pertanggungjawaban atas dosa mereka
  rationale: Teks utama mempertahankan citra dan ketegangan ungkapan sumber. Catatan menjelaskan konteks pengampunan tanpa mengubah ungkapan itu menjadi pernyataan mengenai keterbatasan pengetahuan Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Aku” mengikuti tuturan langsung Allah. Pengulangan “dosa-dosa” dan penegasan “sama sekali tidak ... lagi” dipertahankan agar bentuk jamak serta kuatnya penyangkalan Yunani tetap terdengar.
