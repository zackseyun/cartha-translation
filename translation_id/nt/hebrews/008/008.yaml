  source_fidelity: Draf secara umum mempertahankan rujukan kepada orang-orang dalam μεμφόμενος αὐτούς, kedua nama Israel dan Yehuda, serta janji perjanjian baru. Namun, “ketika menegur mereka” melemahkan nuansa μεμφόμενος sebagai ‘menemukan kesalahan/mencela’ dan mengubah hubungan kausal partisip tersebut menjadi terutama temporal.
