  text: μεμφόμενος γὰρ ⸀αὐτοὺς λέγει· Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ συντελέσω ἐπὶ τὸν οἶκον Ἰσραὴλ καὶ ἐπὶ τὸν οἶκον Ἰούδα διαθήκην καινήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/008.yaml
  text: For in finding fault with them he says, “Look, days are coming, says the Lord, when I will establish a new covenant with the house of Israel and with the house of Judah,”
translation:
  language: id
  text: Sebab, karena Ia menemukan kesalahan pada mereka, Ia berfirman, “Lihatlah, akan datang waktunya, firman Tuhan, ketika Aku akan mengadakan perjanjian baru dengan umat Israel dan dengan umat Yehuda,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμφόμενος ... αὐτοὺς
  choice: ketika menegur mereka
  rationale: Ungkapan ini menyatakan bahwa Allah menemukan kesalahan pada pihak yang disebut ‘mereka’; ‘menegur’ menyampaikannya secara alami tanpa mengubah objek teguran menjadi perjanjian.
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan penanda perhatian yang kuat dan bernada profetis.
- source_word: ἡμέραι ἔρχονται
  choice: waktunya akan tiba
  rationale: Idiom profetis ini lebih alami dalam bahasa Indonesia daripada ‘hari-hari akan datang’, sambil tetap menunjuk pada masa yang akan datang.
- source_word: λέγει κύριος
  choice: firman Tuhan
  rationale: Rumus kutipan nubuat yang baku, ringkas, dan bermartabat dalam bahasa Indonesia.
- source_word: συντελέσω ... διαθήκην καινήν
  choice: Aku akan mengadakan perjanjian baru
  rationale: Dalam konteks perjanjian, verba ini berarti membawa perjanjian itu kepada pelaksanaan atau penetapan; ‘mengadakan’ alami dan tidak menambahkan gagasan yang tidak dinyatakan.
- source_word: οἶκον Ἰσραὴλ ... οἶκον Ἰούδα
  choice: kaum Israel ... kaum Yehuda
  rationale: ‘Kaum’ menyampaikan makna komunitas atau keturunan kolektif dari οἶκος, bukan bangunan atau rumah tangga sempit.
theological_decisions:
- issue: Rujukan objek teguran dalam μεμφόμενος ... αὐτοὺς
  choice: mereka
  alternative: perjanjian pertama
  rationale: Teks SBLGNT yang diberikan secara eksplisit memakai αὐτούς, bentuk maskulin jamak, sehingga objeknya adalah orang-orang; terjemahan tidak memindahkan kesalahan kepada perjanjian.
- issue: Cakupan perjanjian baru
  choice: dengan kaum Israel dan dengan kaum Yehuda
  alternative: dengan umat Allah secara umum
  rationale: Nama kedua kelompok dipertahankan sebagaimana kutipan Yeremia, tanpa meniadakan atau terlebih dahulu menentukan implikasi teologisnya bagi kelompok lain.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur kutipan profetis dipertahankan, dengan kapitalisasi pronomina ilahi sesuai kebiasaan penerbitan Alkitab Indonesia.
