  text: εἴρηκεν γάρ που περὶ τῆς ἑβδόμης οὕτως· Καὶ κατέπαυσεν ὁ θεὸς ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ ἀπὸ πάντων τῶν ἔργων αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/004.yaml
  text: 'For he has spoken somewhere about the seventh day in this way: “And God rested on the seventh day from all his works,”[a][b]'
translation:
  language: id
  text: 'Sebab, tentang hari ketujuh, di suatu tempat Ia telah berfirman demikian: “Dan pada hari ketujuh Allah beristirahat dari segala pekerjaan-Nya.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di satu tempat tertentu.” Ungkapan Yunaninya secara harfiah berarti “di suatu tempat”; ini merupakan cara memperkenalkan kutipan Kitab Suci tanpa menyebut lokasi tepatnya, bukan tanda keraguan terhadap kewibawaannya.
    reason: lexical_alternative
  - marker: b
    text: Atau “berhenti.” Kata kerjanya dapat menekankan berhenti dari pekerjaan; “beristirahat” dipakai untuk mempertahankan kaitan dengan Kejadian 2:2 dan pembahasan tentang perhentian Allah dalam Ibrani 3–4.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκεν
  choice: Ia telah berfirman
  rationale: Bentuk perfektum menyatakan perkataan pada masa lampau yang tetap berlaku. Dalam konteks kutipan Kitab Suci, “berfirman” wajar dan bermartabat; subjek tersirat dipahami sebagai Allah.
- source_word: γάρ
  choice: Sebab
  rationale: Kata ini memberikan dasar atau penjelasan bagi argumen sebelumnya.
- source_word: που
  choice: di suatu tempat
  rationale: Ungkapan ini mempertahankan pengantar kutipan yang tidak menyebut lokasi tertentu tanpa menyiratkan keraguan terhadap kewibawaan Kitab Suci.
- source_word: περὶ τῆς ἑβδόμης
  choice: tentang hari ketujuh
  rationale: Kata “hari” tersirat dalam bentuk Yunani dan perlu dinyatakan dalam bahasa Indonesia agar jelas.
- source_word: οὕτως
  choice: demikian
  rationale: Secara alami memperkenalkan bunyi kutipan yang menyusul.
- source_word: Καὶ
  choice: Dan
  rationale: Dipertahankan sebagai bagian dari kutipan Kejadian.
- source_word: κατέπαυσεν
  choice: beristirahat
  rationale: Pilihan ini mempertahankan hubungan leksikal dan tematis dengan perhentian Allah dalam Kejadian 2 serta argumen Ibrani 3–4; makna berhenti bekerja dicatat sebagai alternatif.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Padanan baku dan langsung bagi sebutan ilahi dalam bahasa Indonesia.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ
  choice: pada hari ketujuh
  rationale: “Pada” merupakan preposisi bahasa Indonesia yang alami untuk penunjukan hari.
- source_word: ἀπὸ πάντων τῶν ἔργων αὐτοῦ
  choice: dari segala pekerjaan-Nya
  rationale: Menyatakan bahwa Allah berhenti dari keseluruhan pekerjaan-Nya; akhiran hormat “-Nya” merujuk kepada Allah.
theological_decisions:
- issue: Makna penghentian pekerjaan Allah dalam kaitannya dengan teologi perhentian di Ibrani
  choice: beristirahat
  alternative: berhenti
  rationale: “Beristirahat” menjaga kaitan dengan kutipan Kejadian 2:2 dan tema perhentian dalam Ibrani 3–4 tanpa harus menyiratkan bahwa Allah kelelahan. “Berhenti” tetap merupakan nuansa leksikal yang sah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan pengantar kutipan yang tidak spesifik, aspek perfektum, konjungsi penjelas, serta istilah kunci tentang perhentian.
