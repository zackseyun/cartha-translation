id: HEB.4.12
reference: Hebrews 4:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ζῶν γὰρ ὁ λόγος τοῦ θεοῦ καὶ ἐνεργὴς καὶ τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον καὶ διϊκνούμενος ἄχρι μερισμοῦ ψυχῆς ⸀καὶ πνεύματος, ἁρμῶν τε καὶ μυελῶν, καὶ κριτικὸς ἐνθυμήσεων καὶ ἐννοιῶν καρδίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/012.yaml
  text: For the word of God is living and active[a], and sharper than any double-edged sword, piercing to the division of soul and spirit, of joints and marrow[c][b], and able to judge the thoughts and intentions of the heart.
translation:
  language: id
  text: Sebab firman Allah hidup dan bekerja, lebih tajam daripada pedang bermata dua mana pun. Firman itu menembus sampai pada pemisahan jiwa dan roh, sendi-sendi dan sumsum[a], serta sanggup menilai pikiran dan niat hati.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “jiwa dan roh, sendi-sendi dan sumsum” menekankan betapa dalam firman Allah menembus; ungkapan ini tidak dengan sendirinya menetapkan suatu ajaran tertentu tentang susunan manusia.
    reason: alternative_reading
  - marker: b
    text: 'Atau: “mampu membedakan pikiran dan niat hati.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζῶν
  choice: hidup
  rationale: Mempertahankan gambaran tentang firman Allah sebagai sesuatu yang memiliki daya hidup dan terus berlaku, dengan ungkapan yang alami dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: Menunjukkan bahwa ayat ini memberikan dasar bagi nasihat pada bagian sebelumnya.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: firman Allah
  rationale: Ungkapan baku dan luas yang tidak mempersempit acuannya hanya kepada Kitab Suci, pemberitaan, ucapan ilahi tertentu, atau Sang Firman sebagai pribadi.
- source_word: ἐνεργὴς
  choice: bekerja
  rationale: Menyatakan bahwa firman itu aktif dan beroperasi. Pilihan verbal ini lebih alami dalam bahasa Indonesia daripada 'aktif' dan tidak menambahkan gagasan 'mahakuasa' atau hasil tertentu.
- source_word: τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον
  choice: lebih tajam daripada pedang bermata dua mana pun
  rationale: Mempertahankan bentuk perbandingan dan citra pedang yang tajam pada kedua sisinya dalam bahasa Indonesia modern.
- source_word: διϊκνούμενος
  choice: menembus
  rationale: Meneruskan citra pedang dan menyampaikan gerak yang mencapai jauh ke dalam.
- source_word: ἄχρι μερισμοῦ
  choice: sampai pada pemisahan
  rationale: Mempertahankan gagasan jangkauan atau batas yang dicapai tanpa menjelaskan secara berlebihan bagaimana unsur-unsur berikut harus dibagi.
- source_word: ψυχῆς καὶ πνεύματος
  choice: jiwa dan roh
  rationale: Padanan leksikal langsung yang mempertahankan pasangan istilah tersebut tanpa menetapkan teori tertentu mengenai susunan manusia.
- source_word: ἁρμῶν τε καὶ μυελῶν
  choice: sendi-sendi dan sumsum
  rationale: Mempertahankan pasangan gambaran jasmani yang menekankan daya tembus sampai ke bagian terdalam; bentuk ulang 'sendi-sendi' wajar untuk jamak Yunani.
- source_word: κριτικὸς
  choice: sanggup menilai
  rationale: Mengungkapkan kemampuan untuk menguji dan memberikan penilaian, bukan sekadar mengetahui isi batin.
- source_word: ἐνθυμήσεων
  choice: pikiran
  rationale: Padanan luas dan alami bagi pemikiran atau pertimbangan batin.
- source_word: ἐννοιῶν
  choice: niat
  rationale: Membedakannya dari 'pikiran' dengan menyoroti maksud atau arah batin, tanpa membuat pembedaan teknis yang terlalu tajam.
- source_word: καρδίας
  choice: hati
  rationale: Mempertahankan metafora sumber-bahasa bagi pusat kehidupan batin, yang juga lazim dan dapat dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Acuan 'firman Allah'
  choice: Dibiarkan sebagai 'firman Allah' dengan cakupan yang luas.
  alternative: Memperjelasnya sebagai Kitab Suci, berita yang diberitakan, ucapan janji atau penghakiman Allah, atau Sang Firman sebagai pribadi.
  rationale: Konteks Ibrani menekankan Allah yang berbicara dan kemanjuran ucapan-Nya, tetapi frasa Yunani tidak mengharuskan terjemahan menetapkan satu acuan sempit.
- issue: Implikasi antropologis 'jiwa dan roh'
  choice: Pasangan 'jiwa dan roh' dipertahankan tanpa penjelasan doktrinal dalam teks utama.
  alternative: Menafsirkannya sebagai dua komponen manusia yang secara teknis terpisah, atau sebagai daftar lengkap unsur-unsur manusia.
  rationale: Ayat ini menekankan jangkauan firman Allah yang menembus dan menilai batin. Susunan katanya tidak dengan sendirinya menetapkan antropologi dikotomis atau trikotomis.
- issue: Hubungan unsur-unsur dalam frasa pemisahan
  choice: Diterjemahkan 'pemisahan jiwa dan roh, sendi-sendi dan sumsum' untuk mempertahankan susunan genitif yang padat.
  alternative: Mengeksplisitkan 'memisahkan jiwa dari roh dan sendi dari sumsum'.
  rationale: Bahasa Yunani dapat dipahami sebagai penetrasi sampai ke titik pemisahan unsur-unsur tersebut, tetapi tidak menyatakan kata 'dari' secara eksplisit. Terjemahan tidak perlu menyelesaikan gambaran retoris itu secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dipecah menjadi dua agar citra dan rangkaian klausa tetap mudah dipahami. 'Bekerja' dipilih daripada 'aktif' karena lebih alami, sedangkan susunan 'sampai pada pemisahan' mempertahankan kepadatan serta ambiguitas wajar teks Yunani.
