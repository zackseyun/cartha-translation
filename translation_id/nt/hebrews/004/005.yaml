  text: 'And in this place again: ‘They shall certainly not enter my rest.’[a]'
translation:
  language: id
  text: 'Dan di tempat ini, sekali lagi: “Mereka sama sekali tidak akan masuk ke dalam perhentian-Ku.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Jika mereka akan masuk ke dalam perhentian-Ku,” suatu rumusan sumpah yang berarti, “Mereka sama sekali tidak akan masuk ke dalam perhentian-Ku.”
    reason: Menjelaskan bahwa bentuk bersyarat dalam bahasa Yunani merupakan rumusan sumpah Semitik yang berfungsi sebagai penyangkalan tegas.
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: di bagian ini
  rationale: Frasa ini menunjuk pada bagian Kitab Suci yang sedang dikutip; “di bagian ini” alami dalam bahasa Indonesia dan tidak menambahkan kata “Kitab Suci” yang tidak tersurat.
- source_word: πάλιν
  choice: kembali
  rationale: Menandai kutipan atau pernyataan Kitab Suci yang dikemukakan lagi dalam rangkaian argumen.
- source_word: Εἰ εἰσελεύσονται
  choice: Mereka sama sekali tidak akan masuk
  rationale: Bentuk bersyarat Yunani ini mencerminkan rumusan sumpah Semitik dan berfungsi sebagai penyangkalan yang tegas, bukan syarat biasa.
- source_word: κατάπαυσίν
  choice: peristirahatan
  rationale: Mempertahankan istilah kunci dalam Ibrani 3–4 mengenai perhentian atau keadaan beristirahat milik Allah; bentuk nomina ini juga membantu konsistensi konteks.
- source_word: μου
  choice: -Ku
  rationale: 'Mempertahankan kepemilikan dalam ucapan ilahi: peristirahatan itu adalah milik Allah.'
theological_decisions:
- issue: Makna rumusan bersyarat seperti sumpah pada Εἰ εἰσελεύσονται
  choice: Mereka sama sekali tidak akan masuk ke dalam peristirahatan-Ku
  alternative: Jika mereka akan masuk ke dalam peristirahatan-Ku
  rationale: Walaupun bentuk harfiahnya bersyarat, dalam kutipan ini konstruksi tersebut mewarisi gaya sumpah Ibrani dan menyampaikan penyangkalan yang sangat tegas. Terjemahan utama menyampaikan fungsinya, sedangkan bentuk harfiahnya dicatat dalam catatan kaki agar ketegangan bentuk tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Di bagian ini” sesuai dengan gaya pengutipan Kitab Suci, sedangkan “sama sekali tidak” menyampaikan daya penyangkalan sumpah tanpa menambah tafsiran doktrinal.
