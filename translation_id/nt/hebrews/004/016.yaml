id: HEB.4.16
reference: Hebrews 4:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: προσερχώμεθα οὖν μετὰ παρρησίας τῷ θρόνῳ τῆς χάριτος, ἵνα λάβωμεν ἔλεος καὶ χάριν εὕρωμεν εἰς εὔκαιρον βοήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/016.yaml
  text: Therefore[a], let us approach the throne of grace with boldness[b], so that we may receive mercy and find grace for timely help.
translation:
  language: id
  text: Karena itu, marilah kita menghampiri takhta anugerah dengan penuh keberanian[a], supaya kita menerima belas kasihan dan menemukan anugerah untuk pertolongan pada waktu yang tepat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan penuh keyakinan.” Istilah Yunani ini dapat menyatakan baik keyakinan maupun keberanian dalam berbicara atau menghadap.
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk pertolongan pada saat dibutuhkan.” Ungkapan Yunani ini secara lebih harfiah menunjuk pada pertolongan yang datang pada waktu yang tepat.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσερχώμεθα
  choice: marilah kita menghampiri
  rationale: Bentuk subjungtif kini ini bersifat ajakan. “Marilah kita menghampiri” menyampaikan seruan untuk datang mendekat secara alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari pembahasan sebelumnya tentang Yesus sebagai Imam Besar.
- source_word: μετὰ παρρησίας
  choice: dengan penuh keberanian
  rationale: παρρησία dapat mencakup keterusterangan, keyakinan, dan keberanian dalam berbicara atau menghadap. Pilihan ini mempertahankan daya ungkap yang kuat tanpa menyiratkan sikap lancang.
- source_word: τῷ θρόνῳ τῆς χάριτος
  choice: takhta anugerah
  rationale: Mempertahankan konstruksi genitif dan metafora sumber tanpa menjelaskannya secara berlebihan sebagai sekadar “takhta yang penuh kemurahan”.
- source_word: ἵνα
  choice: supaya
  rationale: Secara alami menyatakan tujuan dalam bahasa Indonesia modern.
- source_word: λάβωμεν ἔλεος
  choice: kita menerima belas kasihan
  rationale: Mempertahankan verba “menerima” dan menerjemahkan ἔλεος dengan ungkapan Indonesia yang jelas dan lazim.
- source_word: χάριν εὕρωμεν
  choice: menemukan anugerah
  rationale: Mempertahankan perbedaan verba dari klausa sebelumnya—belas kasihan diterima, sedangkan anugerah ditemukan—serta menjaga bobot istilah χάρις.
- source_word: εἰς εὔκαιρον βοήθειαν
  choice: untuk pertolongan pada waktu yang tepat
  rationale: εὔκαιρος menunjuk pada sesuatu yang tepat atau sesuai waktunya. Terjemahan ini mempertahankan penekanan pada ketepatan waktu pertolongan tanpa menggesernya sepenuhnya menjadi keadaan orang yang membutuhkan.
theological_decisions:
- issue: Nuansa παρρησία ketika menghadap Allah
  choice: dengan penuh keberanian
  alternative: dengan penuh keyakinan
  rationale: Konteks menekankan kebebasan untuk datang kepada Allah melalui pelayanan Yesus sebagai Imam Besar. “Keberanian” mempertahankan kekuatan istilah itu, sedangkan catatan kaki menjaga nuansa “keyakinan” yang juga sah.
- issue: Terjemahan χάρις dalam klausa kedua
  choice: anugerah
  alternative: kemurahan
  rationale: “Anugerah” tepat untuk kebaikan ilahi yang diberikan dan mempertahankan hubungan leksikal dengan “takhta anugerah”, tanpa menambahkan sistem teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ajakan yang khidmat tetapi mudah dipahami. Metafora “takhta anugerah” dan pembedaan antara “menerima” serta “menemukan” dipertahankan. Penanda catatan kaki ditempatkan langsung pada frasa yang diterangkannya.
