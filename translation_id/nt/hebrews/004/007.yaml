id: HEB.4.7
reference: Hebrews 4:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πάλιν τινὰ ὁρίζει ἡμέραν, Σήμερον, ἐν Δαυὶδ λέγων μετὰ τοσοῦτον χρόνον, καθὼς ⸀προείρηται, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/007.yaml
  text: 'Again he appoints a certain day[a], “Today,” saying through David after so long a time, just as has been said before: “Today, if you hear his voice, do not harden your hearts.”'
translation:
  language: id
  text: 'Sekali lagi, Dia menetapkan suatu hari tertentu, yaitu “Hari ini,” dengan berfirman melalui Daud[a] setelah sekian lama, seperti yang telah dikatakan sebelumnya: “Hari ini, jika kalian mendengar suara-Nya, janganlah keraskan hati kalian.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di dalam Daud”; mungkin berarti dalam mazmur yang dikaitkan dengan Daud.
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν
  choice: Sekali lagi
  rationale: Menandai pengulangan atau dimulainya kembali argumen bahwa Allah menetapkan suatu hari.
- source_word: τινὰ ἡμέραν
  choice: suatu hari tertentu
  rationale: Mempertahankan nuansa hari yang spesifik tetapi belum disebutkan namanya sampai kata “Hari ini” muncul.
- source_word: ὁρίζει
  choice: menetapkan
  rationale: Menyampaikan tindakan berotoritas dalam menentukan atau menunjuk hari tersebut.
- source_word: Σήμερον
  choice: Hari ini
  rationale: Dipertahankan sebagai sebutan bagi hari yang ditetapkan dan sebagai kata utama dalam kutipan Mazmur 95.
- source_word: ἐν Δαυὶδ λέγων
  choice: dengan berfirman melalui Daud
  rationale: Ungkapan ini secara wajar menyampaikan bahwa Allah berbicara dengan perantaraan Daud, sambil mengakui dalam catatan kaki kemungkinan nuansa “dalam [mazmur] Daud.”
- source_word: μετὰ τοσοῦτον χρόνον
  choice: setelah sekian lama
  rationale: Mengungkapkan selang waktu yang panjang secara alami dalam bahasa Indonesia.
- source_word: καθὼς προείρηται
  choice: seperti yang telah dikatakan sebelumnya
  rationale: Mempertahankan rujukan kepada pernyataan terdahulu yang tetap relevan dalam argumen.
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: jika kalian mendengar suara-Nya
  rationale: Mempertahankan ungkapan mendengar suara tanpa mempersempitnya menjadi sekadar mendengar bunyi atau langsung memparafrasakannya sebagai menaati.
- source_word: μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: janganlah keraskan hati kalian
  rationale: Ungkapan Indonesia yang alami dan setia untuk larangan menjadi keras atau membangkang dalam batin; “kalian” memperjelas bentuk jamak sumber.
theological_decisions:
- issue: Daya retoris “Hari ini” dalam pembahasan tentang perhentian Allah
  choice: Mempertahankan “Hari ini” sebagai kesempatan kini yang Allah tetapkan untuk merespons suara-Nya.
  alternative: Membatasinya hanya pada tanggal historis ketika mazmur diucapkan, atau hanya pada suatu hari eskatologis.
  rationale: Ayat ini menyatakan bahwa sesudah selang waktu yang panjang Allah masih menetapkan “Hari ini”; terjemahan tidak menyelesaikan ketegangan temporal itu ke dalam satu sistem teologis.
- issue: Makna ἐν Δαυὶδ
  choice: melalui Daud
  alternative: di dalam Daud, yakni dalam mazmur Daud
  rationale: “Melalui Daud” alami dalam bahasa Indonesia dan mengungkapkan perantaraan manusia, sedangkan bentuk harfiah serta kemungkinan rujukan kepada mazmur dicatat agar ambiguitas sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti “kalian” dipakai untuk memperjelas bahwa sapaan Yunani berbentuk jamak; kapitalisasi “Dia” dan “-Nya” merujuk kepada Allah.
