  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Φοβηθῶμεν οὖν μήποτε καταλειπομένης ἐπαγγελίας εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ δοκῇ τις ἐξ ὑμῶν ὑστερηκέναι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/001.yaml
  text: Therefore[a], let us fear lest, while the promise of entering his rest still remains[c][b], any one of you should seem to have fallen short.
translation:
  language: id
  text: Karena itu, marilah kita takut[a], jangan sampai seorang pun di antara kalian tampaknya telah gagal mencapainya[c], sementara janji untuk masuk ke dalam perhentian-Nya masih ada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “marilah kita merasa takut.” Kata Yunani yang dipakai lebih kuat daripada sekadar “marilah kita berhati-hati” dan mempertahankan keseriusan peringatan ini.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “sementara suatu janji untuk masuk ke dalam perhentian-Nya masih tersisa.”'
    reason: alternative_reading
  - marker: c
    text: Atau “didapati telah gagal mencapainya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Φοβηθῶμεν
  choice: marilah kita takut
  rationale: Bentuk subjungtif hortatoris ini menyampaikan ajakan langsung dengan daya peringatan yang kuat; terjemahan ini tidak melunakkannya menjadi sekadar ‘berhati-hati’.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari pembahasan sebelumnya mengenai kegagalan Israel memasuki perhentian.
- source_word: μήποτε
  choice: jangan-jangan
  rationale: Ungkapan Indonesia yang wajar untuk memperkenalkan kemungkinan negatif yang dikhawatirkan sesudah ajakan ‘marilah kita takut’.
- source_word: καταλειπομένης ἐπαγγελίας
  choice: sementara janji ... masih berlaku
  rationale: 'Menyampaikan keadaan yang berlangsung bersamaan dalam konstruksi genitif absolut: janji tersebut tetap tersedia dan belum berakhir.'
- source_word: ἐπαγγελίας
  choice: janji
  rationale: Padanan baku dan sesuai dengan pokok argumentasi penulis mengenai janji Allah.
- source_word: εἰσελθεῖν
  choice: untuk masuk
  rationale: Infinitif ini secara alami menerangkan isi janji dalam bahasa Indonesia.
- source_word: κατάπαυσιν
  choice: perhentian
  rationale: Mempertahankan istilah utama dalam Ibrani 3–4 dan menunjuk pada perhentian milik Allah, bukan sekadar tindakan berhenti biasa.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Mempertahankan pronomina teks Yunani tanpa menggantinya secara eksplisit dengan ‘Allah’; acuannya jelas dari konteks.
- source_word: δοκῇ
  choice: ternyata
  rationale: Dalam konteks penilaian apakah seseorang gagal mencapai tujuan, ‘ternyata’ menyampaikan unsur tampak atau terbukti tanpa menghilangkan ketegangan semantis δοκέω.
- source_word: τις ἐξ ὑμῶν
  choice: ada seorang pun di antara kalian
  rationale: Mempertahankan daya individual dari pronomina tak tentu tunggal dan frasa partitif ‘di antara kalian’.
- source_word: ὑστερηκέναι
  choice: gagal mencapainya
  rationale: Dalam konteks ini verba tersebut berarti tidak berhasil mencapai tujuan yang dijanjikan; objek tersirat dibuat jelas secara alami dengan ‘-nya’.
theological_decisions:
- issue: Apakah peringatan perlu dilunakkan menjadi sekadar kewaspadaan
  choice: Mempertahankan ajakan kuat ‘marilah kita takut’
  alternative: ‘marilah kita berhati-hati’ atau ‘hendaklah kita waspada’
  rationale: φοβηθῶμεν secara langsung menyatakan rasa takut. Terjemahan tidak boleh meredakan keseriusan peringatan atau menyelesaikan perdebatan mengenai ketekunan dan kemurtadan.
- issue: Apakah ‘perhentian-Nya’ perlu dijelaskan sebagai perhentian eskatologis Allah
  choice: Menerjemahkan tetap sebagai ‘perhentian-Nya’
  alternative: ‘perhentian Allah’ atau ‘perhentian Sabat-Nya’
  rationale: Teks memakai pronomina dan konteks menjelaskan acuannya. Bentuk ini menghindari penambahan penafsiran yang lebih khusus daripada ayat tersebut.
- issue: Nuansa δοκῇ dalam peringatan
  choice: Memakai ‘ternyata’ dalam teks dan mencatat alternatif ‘didapati’
  alternative: ‘tampaknya’ atau ‘didapati’
  rationale: Terjemahan ini menjaga kemungkinan nuansa tampak atau terbukti tanpa menyiratkan bahwa kegagalan itu hanya semu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Kalian’ dipakai untuk menandai bentuk jamak ὑμῶν secara jelas, sedangkan ‘perhentian’ mempertahankan istilah tematis dalam Ibrani 3–4. Semua penanda catatan kaki ditempatkan langsung dalam teks.
