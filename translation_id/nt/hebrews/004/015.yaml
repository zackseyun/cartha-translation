  text: οὐ γὰρ ἔχομεν ἀρχιερέα μὴ δυνάμενον συμπαθῆσαι ταῖς ἀσθενείαις ἡμῶν, ⸀πεπειρασμένον δὲ κατὰ πάντα καθ’ ὁμοιότητα χωρὶς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/015.yaml
  text: For we do not have a high priest unable to sympathize with our weaknesses, but one who has been tested in every way according to likeness, yet without sin.
translation:
  language: id
  text: Sebab kita tidak mempunyai Imam Besar yang tidak dapat turut merasakan kelemahan-kelemahan kita, melainkan seorang yang telah diuji[a] dalam segala hal sama seperti kita[b], namun tanpa dosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah dicobai.”
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “menurut keserupaan”; maksud perbandingannya dapat diterjemahkan “sama seperti kita” atau “dengan cara yang sama seperti kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερέα
  choice: Imam Besar
  rationale: Istilah baku dan tepat bagi jabatan imam tertinggi; dalam Surat Ibrani gelar ini penting bagi penggambaran perantaraan Yesus.
- source_word: οὐ ... μὴ δυνάμενον συμπαθῆσαι
  choice: bukanlah imam yang tidak dapat turut merasakan
  rationale: Mempertahankan ungkapan litotes Yunani ('bukan ... yang tidak dapat') dan menyampaikan συμπαθέω sebagai ikut merasakan keadaan orang lain, bukan sekadar mengasihani.
- source_word: ταῖς ἀσθενείαις ἡμῶν
  choice: kelemahan-kelemahan kita
  rationale: Mencakup kerapuhan dan keterbatasan manusia secara luas, bukan hanya penyakit jasmani.
- source_word: πεπειρασμένον
  choice: telah diuji
  rationale: πειράζω dapat berarti diuji atau dicobai. 'Diuji' menyatakan pengalaman nyata menghadapi ujian tanpa menyiratkan kegagalan moral; alternatifnya dicatat dalam catatan kaki.
- source_word: κατὰ πάντα
  choice: dalam segala hal
  rationale: Ungkapan Indonesia yang alami untuk cakupan menyeluruh dari pengalaman pengujian.
- source_word: καθ’ ὁμοιότητα
  choice: sama seperti kita
  rationale: Mengungkapkan perbandingan yang tersirat dalam konteks secara alami dalam bahasa Indonesia, sambil mencatat bentuk harfiahnya agar unsur 'keserupaan' tetap terlihat.
- source_word: χωρὶς ἁμαρτίας
  choice: tetapi tanpa dosa
  rationale: 'Menandai pengecualian tegas terhadap kesamaan pengalaman tersebut: ia mengalami pengujian, namun tanpa dosa.'
theological_decisions:
- issue: Makna πεπειρασμένον dalam kaitannya dengan ketidakberdosaan Kristus
  choice: telah diuji
  alternative: telah dicobai
  rationale: Kedua makna didukung secara leksikal. Teks utama memakai 'diuji' untuk menyampaikan pengalaman nyata di bawah ujian, sedangkan 'dicobai' dipertahankan dalam catatan kaki agar ambiguitas sumber tidak dihapus.
- issue: Seberapa eksplisit perbandingan dalam καθ’ ὁμοιότητα
  choice: sama seperti kita
  alternative: menurut keserupaan
  rationale: Konteks memberi dasar kuat untuk menjadikan pihak pembanding tersirat sebagai 'kita', sehingga kalimat alami dan mudah dipahami. Bentuk harfiah dipertahankan dalam catatan kaki karena bahasa Yunani hanya menyatakan 'menurut keserupaan' tanpa mengulang 'kita'.
- issue: Retorika litotes pada οὐ ... μὴ δυνάμενον
  choice: bukanlah imam yang tidak dapat turut merasakan
  alternative: dapat turut merasakan
  rationale: Bentuk negatif ganda dipertahankan karena menyiapkan pertentangan retoris dengan 'melainkan' dan mengikuti struktur sumber tanpa mengubah maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur litotes sumber dipertahankan, sedangkan frasa perbandingan dibuat idiomatis. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
