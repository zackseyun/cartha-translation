  text: εἰ γὰρ αὐτοὺς Ἰησοῦς κατέπαυσεν, οὐκ ἂν περὶ ἄλλης ἐλάλει μετὰ ταῦτα ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/008.yaml
  text: For if Joshua had given them rest[a], he would not have spoken later about another day.
translation:
  language: id
  text: Sebab, seandainya Yosua[a] telah memberi mereka perhentian, Ia tentu tidak akan berbicara sesudah itu tentang hari lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Yunani, nama ini berbentuk “Yesus”. Bentuk Ἰησοῦς dapat merujuk kepada Yesus ataupun Yosua; dalam konteks ini yang dimaksud adalah Yosua anak Nun.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Yosua
  rationale: Bentuk Yunani Ἰησοῦς dapat merujuk kepada Yesus atau Yosua. Konteksnya adalah masuknya Israel ke tanah Kanaan di bawah pimpinan Yosua, sehingga referen yang dimaksud di sini adalah Yosua anak Nun.
- source_word: κατέπαυσεν
  choice: telah memberi mereka perhentian
  rationale: 'Kata kerja καταπαύω di sini bersifat kausatif: membuat seseorang berhenti atau memberinya perhentian. Ungkapan ini juga mempertahankan kaitan leksikal dengan tema ''perhentian'' dalam perikop.'
- source_word: εἰ γὰρ ... οὐκ ἂν ... ἐλάλει
  choice: Sebab, seandainya ... tentu ... tidak akan dibicarakan
  rationale: Bentuk pengandaian ini menyatakan keadaan yang berlawanan dengan kenyataan beserta akibatnya. 'Seandainya ... tentu ... tidak akan' menyampaikan daya kontrafaktualnya secara alami dalam bahasa Indonesia.
- source_word: περὶ ἄλλης ... ἡμέρας
  choice: hari yang lain
  rationale: Frasa ini menunjuk kepada suatu hari lain yang disebut setelah zaman Yosua, sesuai dengan argumen bahwa janji perhentian belum digenapi sepenuhnya melalui masuknya Israel ke Kanaan.
- source_word: μετὰ ταῦτα
  choice: sesudah itu
  rationale: 'Frasa ini menandai urutan waktu: pembicaraan tentang hari lain terjadi setelah peristiwa pada zaman Yosua.'
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memperkenalkan alasan yang mendukung pernyataan sebelumnya; 'Sebab' mempertahankan hubungan logis tersebut.
theological_decisions:
- issue: Referen Ἰησοῦς dalam Ibrani 4:8
  choice: Yosua, anak Nun
  alternative: Yesus
  rationale: Alur pembahasan merujuk kepada masuknya Israel ke Kanaan di bawah pimpinan Yosua dan membandingkannya dengan janji perhentian yang masih disebut kemudian dalam Mazmur 95. Catatan kaki mempertahankan transparansi bahwa bentuk nama Yunaninya sama dengan bentuk untuk 'Yesus'.
- issue: Subjek tersirat dari ἐλάλει
  choice: Tidak dinyatakan secara eksplisit; diterjemahkan dengan konstruksi pasif impersonal
  alternative: Dia/Allah tidak akan berbicara
  rationale: Teks Yunani tidak menyebutkan subjek eksplisit pada verba ini. Konstruksi 'tidak akan dibicarakan' menghindari penambahan identitas pembicara ke dalam teks utama sambil mempertahankan maksud bahwa hari lain kemudian menjadi pokok pembicaraan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang bermartabat dan mudah dipahami. Istilah 'perhentian' dipertahankan untuk menjaga kesinambungan tema utama Ibrani 3–4. Konstruksi pasif pada klausa kedua dipilih untuk mempertahankan ketidaktersuratan subjek dalam bahasa Yunani.
