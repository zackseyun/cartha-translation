id: HEB.4.9
reference: Hebrews 4:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἄρα ἀπολείπεται σαββατισμὸς τῷ λαῷ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/009.yaml
  text: So then[a], a Sabbath rest remains for the people of God.
translation:
  language: id
  text: Jadi, masih tersedia perhentian Sabat[a] bagi umat Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelaksanaan Sabat.” Istilah Yunani σαββατισμός jarang digunakan dan secara jelas menggemakan bahasa tentang Sabat; di sini kemungkinan besar istilah itu menunjuk pada perhentian bercorak Sabat yang masih tersedia bagi umat Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Jadi
  rationale: Partikel inferensial ini menyimpulkan uraian sebelumnya. “Jadi” menyampaikan hubungan logis itu secara wajar dalam bahasa Indonesia modern.
- source_word: ἀπολείπεται
  choice: masih tersedia
  rationale: Bentuk ini menyatakan bahwa sesuatu tetap ada atau tersedia. “Masih tersedia” menegaskan keberlanjutan sekaligus bahwa perhentian itu diperuntukkan bagi umat Allah.
- source_word: σαββατισμός
  choice: perhentian Sabat
  rationale: Nomina yang langka ini secara eksplisit menggemakan Sabat dan dalam konteks menunjuk pada perhentian bercorak Sabat. Pilihan ini mempertahankan kaitan leksikal dengan Sabat tanpa membatasinya hanya pada pelaksanaan ritual mingguan.
- source_word: τῷ λαῷ
  choice: bagi umat
  rationale: Dativus ini paling wajar dipahami sebagai manfaat atau peruntukan. “Bagi umat” alami dalam bahasa Indonesia dan menunjukkan bahwa perhentian tersebut tersedia bagi mereka.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Genitivus ini menyatakan kepunyaan atau hubungan. Gabungan “umat Allah” adalah padanan ringkas dan baku.
theological_decisions:
- issue: Makna σαββατισμός dalam Ibrani 4:9
  choice: Perhentian bercorak Sabat yang tetap tersedia bagi umat Allah, diterjemahkan “perhentian Sabat”.
  alternative: Pelaksanaan Sabat secara harfiah; atau perhentian rohani yang sama sekali tidak mengandung gema Sabat.
  rationale: Istilahnya sendiri mengacu pada Sabat, sedangkan konteks menghubungkan perhentian Allah, hari ketujuh, dan perhentian yang dijanjikan. Terjemahan ini mempertahankan ketegangan tersebut tanpa mempersempitnya menjadi ritual mingguan ataupun menghapus kaitannya dengan Sabat.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Perhentian Sabat” mempertahankan gema istilah sumber serta ambiguitas antara perhentian dan pelaksanaan Sabat; penanda catatan kaki [a] ditempatkan langsung sesudah frasa terkait.
