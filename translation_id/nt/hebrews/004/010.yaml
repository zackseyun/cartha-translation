  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰσελθὼν εἰς τὴν κατάπαυσιν αὐτοῦ καὶ αὐτὸς κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/010.yaml
  text: For the one who has entered his rest has himself also rested from his works[b][a], just as God did from his own.
translation:
  language: id
  text: Sebab orang yang telah masuk ke dalam perhentiannya[a] juga telah berhenti dari pekerjaan-pekerjaannya sendiri[b], sama seperti Allah berhenti dari pekerjaan-pekerjaan-Nya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perhentian Allah.” Kata ganti Yunani dapat merujuk kepada orang yang telah masuk, tetapi dalam konteks Ibrani 3–4 paling mungkin merujuk kepada Allah.
    reason: Mempertahankan ambiguitas gramatikal pronomina sambil menyatakan petunjuk konteks.
  - marker: b
    text: Atau, “telah beristirahat dari pekerjaan-pekerjaannya sendiri.” Kata Yunani yang diterjemahkan “berhenti” serumpun dengan kata “perhentian” dalam ayat ini.
    reason: Mencatat alternatif leksikal dan hubungan kata dalam bahasa Yunani.
lexical_decisions:
- source_word: ὁ ... εἰσελθὼν
  choice: orang yang telah masuk
  rationale: Artikel dengan partisip aoristus berfungsi secara substantival dan menunjuk secara umum kepada orang yang sudah masuk; bentuk ini mempertahankan sifat generik dan aspek selesai.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memberikan alasan atau penjelasan bagi pernyataan sebelumnya; 'Sebab' merupakan penghubung baku dan alami dalam bahasa Indonesia.
- source_word: κατάπαυσιν
  choice: perhentian
  rationale: Dalam Ibrani 3–4, κατάπαυσις adalah istilah tematis bagi perhentian Allah. 'Perhentian' menjaga kaitan leksikal dengan verba 'berhenti' serta terdengar lebih wajar daripada 'istirahat' ketika diikuti konstruksi 'berhenti dari pekerjaan'.
- source_word: αὐτοῦ (setelah κατάπαυσιν)
  choice: -Nya
  rationale: Pronomina Yunani dibiarkan sebagai pronomina dalam teks utama. Kapitalisasi mengikuti referen yang paling mungkin, yaitu Allah, tetapi catatan kaki mempertahankan kemungkinan gramatikal bahwa pronomina itu merujuk kepada orang yang masuk.
- source_word: καὶ αὐτὸς
  choice: juga
  rationale: καί menyatakan tambahan, sedangkan αὐτός memberi penekanan pada subjek yang sama. Dalam bahasa Indonesia, penempatan 'juga' setelah subjek menyampaikan perbandingan itu secara alami tanpa pronomina berlebihan.
- source_word: κατέπαυσεν
  choice: telah berhenti
  rationale: Verba ini serumpun dengan κατάπαυσις. 'Telah berhenti' mempertahankan gagasan berhenti atau beristirahat serta cocok dengan pelengkap ἀπό; alternatif 'telah beristirahat' kurang alami dengan 'dari pekerjaan-pekerjaannya'.
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: dari pekerjaan-pekerjaannya sendiri
  rationale: ἔργα diterjemahkan secara luas sebagai 'pekerjaan-pekerjaan', tanpa mempersempitnya menjadi amal jasa. 'Sendiri' membantu menampilkan kepemilikan subjek manusia dengan jelas.
- source_word: ὥσπερ
  choice: sama seperti
  rationale: Ungkapan ini secara alami menyatakan perbandingan yang tegas antara berhentinya orang tersebut dan berhentinya Allah.
- source_word: ἀπὸ τῶν ἰδίων
  choice: dari pekerjaan-pekerjaan-Nya sendiri
  rationale: τῶν ἰδίων bersifat eliptis dan mengacu kembali kepada ἔργων. Bahasa Indonesia lebih jelas jika nomina 'pekerjaan-pekerjaan' diulang; 'sendiri' mempertahankan daya tekan ἰδίων.
- source_word: ὁ θεός
  choice: Allah
  rationale: Padanan baku θεός dalam terjemahan Alkitab berbahasa Indonesia.
theological_decisions:
- issue: Referen αὐτοῦ dalam frasa 'perhentian-Nya'
  choice: Teks utama memahami pronomina itu sebagai merujuk kepada Allah.
  alternative: Pronomina itu dapat dipahami sebagai merujuk kepada orang yang masuk, yakni 'perhentiannya sendiri'.
  rationale: Dalam konteks Ibrani 3–4, perhentian yang dimasuki berulang kali disajikan sebagai perhentian Allah dan dihubungkan dengan perhentian Allah setelah karya-Nya. Namun, karena bentuk Yunani sendiri berupa pronomina dan secara gramatikal memungkinkan referen lain, alternatif tersebut dicatat.
- issue: Makna berhenti dari pekerjaan-pekerjaannya
  choice: Diterjemahkan secara umum tanpa mengidentifikasikan pekerjaan itu secara khusus sebagai usaha memperoleh keselamatan atau sebagai seluruh kegiatan manusia.
  alternative: Sebagian penafsiran mempersempitnya menjadi berhenti dari usaha pembenaran diri atau, sebaliknya, selesainya tugas pelayanan seseorang.
  rationale: ἔργα dalam ayat ini tidak memberi pembatasan eksplisit. Terjemahan mempertahankan keluasan dan ketegangan konteks tanpa memasukkan ajaran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Perhentian' dipilih untuk menjaga istilah kunci dalam Ibrani 3–4, sementara 'telah berhenti' menghasilkan konstruksi Indonesia yang alami dengan 'dari pekerjaan-pekerjaan'. Penulisan -Nya menandai referen ilahi yang paling mungkin. Semua penanda catatan kaki muncul dalam teks utama.
