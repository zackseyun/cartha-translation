id: HEB.4.3
reference: Hebrews 4:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰσερχόμεθα γὰρ ⸀εἰς κατάπαυσιν οἱ πιστεύσαντες, καθὼς εἴρηκεν· Ὡς ὤμοσα ἐν τῇ ὀργῇ μου, Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου, καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/003.yaml
  text: For we who have believed enter the rest[a], just as he has said, “As I swore in my wrath[b], ‘If they shall enter my rest,’” although his works were finished from the foundation of the world.
translation:
  language: id
  text: 'Sebab kita yang telah percaya masuk ke dalam perhentian itu, seperti yang telah difirmankan-Nya, “Aku bersumpah dalam murka-Ku: ‘Mereka tidak akan pernah masuk ke dalam perhentian-Ku.’”[a] Meskipun segala pekerjaan-Nya telah selesai sejak dunia dijadikan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Jika mereka akan masuk ke dalam perhentian-Ku,” suatu formula sumpah yang berarti, “Mereka sama sekali tidak akan masuk ke dalam perhentian-Ku.”
    reason: alternative_reading
  - marker: b
    text: Atau, “meskipun segala pekerjaan-Nya sudah diselesaikan sejak dunia dijadikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμεθα
  choice: masuk
  rationale: Bentuk kini orang pertama jamak menyatakan kenyataan yang berlaku bagi orang percaya; bentuk sederhana ini mempertahankan ketegangan antara pengalaman kini dan penggenapan mendatang.
- source_word: κατάπαυσιν
  choice: perhentian itu
  rationale: Istilah ini menunjuk pada perhentian Allah yang sudah menjadi pokok pembahasan; kata 'itu' menandai rujukan khusus tersebut.
- source_word: οἱ πιστεύσαντες
  choice: kita yang telah percaya
  rationale: Partisip aoris menggambarkan kelompok yang telah percaya, sedangkan 'kita' mempertahankan penyertaan diri penulis dalam bentuk verba orang pertama jamak.
- source_word: καθὼς εἴρηκεν
  choice: seperti yang telah difirmankan-Nya
  rationale: Bentuk perfektum menunjukkan firman yang telah diucapkan dan tetap berlaku; 'difirmankan-Nya' wajar untuk ucapan ilahi tanpa mengaburkan subjek.
- source_word: Ὡς ὤμοσα ἐν τῇ ὀργῇ μου
  choice: Seperti Aku telah bersumpah dalam murka-Ku
  rationale: '''Murka'' mempertahankan bobot penghakiman yang khidmat dari ὀργή, dan bentuk perfektif Indonesia sesuai dengan tindakan sumpah yang telah dilakukan.'
- source_word: Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου
  choice: Mereka tidak akan pernah masuk ke dalam perhentian-Ku
  rationale: Konstruksi εἰ dengan bentuk mendatang merupakan formula sumpah Semitis yang secara idiomatis menyatakan penyangkalan tegas; arti tersebut disampaikan dalam teks utama, sementara bentuk harfiahnya dicatat.
- source_word: καίτοι
  choice: meskipun
  rationale: Kata ini menandai hubungan konsesif antara sumpah tentang perhentian dan selesainya pekerjaan Allah sejak penciptaan.
- source_word: τῶν ἔργων ... γενηθέντων
  choice: pekerjaan-pekerjaan-Nya telah selesai
  rationale: Genitif absolut menyatakan bahwa pekerjaan Allah sudah terlaksana atau selesai; pronomina '-Nya' dijelaskan oleh konteks.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: sejak dunia dijadikan
  rationale: Ungkapan ini menyampaikan masa pendirian atau penciptaan dunia dalam bahasa Indonesia alami dan jelas.
theological_decisions:
- issue: Daya formula sumpah dalam kutipan Mazmur 95
  choice: 'Menerjemahkannya sebagai penyangkalan tegas: “Mereka tidak akan pernah masuk ke dalam perhentian-Ku.”'
  alternative: 'Mempertahankan bentuk permukaan: “Jika mereka akan masuk ke dalam perhentian-Ku.”'
  rationale: Bahasa Yunani mengikuti formula sumpah Semitis yang maknanya dalam konteks ialah larangan masuk secara pasti. Catatan kaki mempertahankan bentuk harfiahnya agar ciri sumber tetap terlihat.
- issue: Nuansa waktu orang percaya memasuki perhentian
  choice: Menggunakan bentuk kini “masuk”.
  alternative: “sedang masuk” atau “akan masuk”
  rationale: Bentuk kini Yunani memungkinkan kenyataan masuk sekarang tanpa meniadakan penggenapan mendatang; terjemahan tidak membatasi ayat hanya pada salah satu sisi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Perhentian' dipilih untuk menjaga istilah utama dalam argumen Ibrani 3–4, sedangkan struktur kalimat dibuat alami tanpa meniadakan ketegangan aspek maupun bentuk sumpah sumber.
