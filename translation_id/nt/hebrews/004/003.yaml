  naturalness: “Aku bersumpah dalam murka-Ku” merupakan bentuk yang lebih alami, jelas, dan khidmat dalam kutipan langsung. “Segala pekerjaan-Nya telah selesai” menghindari pengulangan plural “pekerjaan-pekerjaan” yang tidak alami dalam bahasa Indonesia, sambil tetap menyatakan keseluruhan karya Allah.
  terminology: “Perhentian” dipertahankan secara konsisten untuk κατάπαυσις. “Murka,” “percaya,” dan “masuk ke dalam” juga sesuai dengan register Alkitab bahasa Indonesia modern. Catatan kaki a tetap secara tepat menjelaskan formula sumpah; jangkar a dan b ditempatkan pada unsur yang masing-masing dijelaskan.
