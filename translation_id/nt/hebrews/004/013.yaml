  text: καὶ οὐκ ἔστιν κτίσις ἀφανὴς ἐνώπιον αὐτοῦ, πάντα δὲ γυμνὰ καὶ τετραχηλισμένα τοῖς ὀφθαλμοῖς αὐτοῦ, πρὸς ὃν ἡμῖν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/013.yaml
  text: And no creature is hidden from his sight[a], but all things are naked and laid bare to his eyes[b], to whom we must give account.
translation:
  language: id
  text: Dan tidak ada satu ciptaan pun yang tersembunyi dari pandangan-Nya, tetapi segala sesuatu telanjang dan tersingkap[a] di hadapan mata-Nya; kepada-Nyalah kita harus memberi pertanggungjawaban.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “tersingkap” berasal dari verba langka yang mungkin menggambarkan leher yang disingkapkan atau didongakkan, dengan penekanan pada keterpaparan sepenuhnya di hadapan Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau, lebih harfiah, “dengan Dia kita berurusan”; ungkapan Yunaninya juga dapat dipahami sebagai “kepada-Nya perkataan atau perkara kita tertuju.”
    reason: alternative_reading
lexical_decisions:
- source_word: κτίσις
  choice: satu ciptaan pun
  rationale: Nomina tunggal ini dipakai secara generik bagi setiap makhluk atau sesuatu yang diciptakan. Ungkapan ini menyatakan cakupan distributif secara alami dalam bahasa Indonesia.
- source_word: ἀφανὴς
  choice: tersembunyi
  rationale: Dalam konteks ini kata tersebut menunjuk pada sesuatu yang tidak dapat disembunyikan dari pemeriksaan Allah, bukan pada ketidaknampakan secara metafisik.
- source_word: ἐνώπιον αὐτοῦ
  choice: dari pandangan-Nya
  rationale: Secara harfiah berarti 'di hadapan-Nya', tetapi pilihan ini secara alami menghubungkan klausa pertama dengan gambaran mata Allah dalam klausa berikutnya.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Bentuk netral jamak ini mempunyai cakupan menyeluruh; 'segala sesuatu' mempertahankan keluasan dan ragam bahasa yang bermartabat.
- source_word: γυμνὰ
  choice: telanjang
  rationale: Pilihan langsung ini mempertahankan metafora kuat tentang keterpaparan sepenuhnya.
- source_word: τετραχηλισμένα
  choice: terbuka
  rationale: Partisipel perfektum dari verba langka ini menggambarkan keadaan tersingkap sepenuhnya, mungkin dengan citra leher yang didongakkan atau dibuka. 'Terbuka' jelas dan wajar tanpa memaksakan citra yang diperdebatkan.
- source_word: τοῖς ὀφθαλμοῖς αὐτοῦ
  choice: di depan mata Dia
  rationale: Ungkapan ini mempertahankan rujukan eksplisit kepada mata Allah dan menyatu secara alami dengan klausa relatif sesudahnya.
- source_word: πρὸς ὃν ἡμῖν ὁ λόγος
  choice: yang kepada-Nya kita harus memberi pertanggungjawaban
  rationale: Ungkapan Yunani yang padat ini paling wajar dipahami dalam konteks pemeriksaan dan penghakiman sebagai kewajiban manusia untuk mempertanggungjawabkan diri kepada Allah; kemungkinan yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna πρὸς ὃν ἡμῖν ὁ λόγος
  choice: Klausa ini menyatakan pertanggungjawaban manusia kepada Allah.
  alternative: “dengan Dia kita berurusan” atau, lebih harfiah, “kepada-Nya perkataan/perkara kita tertuju”
  rationale: Konteks langsung menekankan pengetahuan Allah yang menembus dan pemeriksaan-Nya. Terjemahan utama menyampaikan daya peringatan itu secara jelas, sedangkan catatan kaki mempertahankan kepadatan dan ambiguitas ungkapan Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dua kalimat menghindari kalimat yang terlalu sarat, sementara 'Sebaliknya' mempertahankan kontras δέ. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
