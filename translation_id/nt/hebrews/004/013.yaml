  to: Dan tidak ada satu ciptaan pun yang tersembunyi dari pandangan-Nya, tetapi segala sesuatu telanjang dan tersingkap[a] di hadapan mata-Nya; kepada-Nyalah kita harus memberi pertanggungjawaban.[b]
  rationale: 'Revisi memperjelas struktur ayat sesuai bahasa Yunani: segala sesuatu telanjang dan tersingkap di hadapan mata Allah, lalu klausa terpisah menyatakan pertanggungjawaban kepada-Nya. “Tersingkap” mempertahankan daya ungkap τετραχηλισμένα tanpa menyelesaikan perdebatan tentang citranya; perdebatan itu dicatat dalam catatan kaki. Alternatif untuk klausa akhir juga dipertahankan secara eksplisit.'
