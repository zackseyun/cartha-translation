  text: Ἔχοντες οὖν ἀρχιερέα μέγαν διεληλυθότα τοὺς οὐρανούς, Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ, κρατῶμεν τῆς ὁμολογίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/014.yaml
  text: Therefore[a], since we have a great high priest who has passed through the heavens—Jesus the Son of God—let us hold fast to our confession.
translation:
  language: id
  text: Karena itu, sebab kita mempunyai Imam Besar yang agung, yang telah melintasi surga-surga[a], yaitu Yesus, Anak Allah, marilah kita berpegang teguh pada pengakuan kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “surga-surga”; teks Yunani memakai bentuk jamak. Dapat juga diterjemahkan, “yang telah melewati surga-surga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: Karena itu, karena kita mempunyai
  rationale: οὖν menyatakan kesimpulan dari uraian sebelumnya, sedangkan partisip ἔχοντες memberi dasar bagi ajakan berikutnya. Pengulangan 'karena' masih alami dalam bahasa Indonesia dan mempertahankan kedua hubungan logis tersebut.
- source_word: ἀρχιερέα μέγαν
  choice: Imam Besar yang agung
  rationale: Ungkapan ini mempertahankan jabatan keimaman serta penekanan kualitatif μέγαν. Huruf kapital dipakai karena dalam konteks ini gelar tersebut secara khusus menunjuk kepada Yesus.
- source_word: διεληλυθότα τοὺς οὐρανούς
  choice: yang telah melintasi surga-surga
  rationale: Bentuk perfektum menunjukkan tindakan yang telah terlaksana dengan arti yang tetap berlaku. 'Melintasi' mencerminkan gerak melalui, dan bentuk ulang 'surga-surga' mempertahankan jamak Yunani tanpa merincikan kosmologi yang tidak dinyatakan teks.
- source_word: Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ
  choice: yaitu Yesus, Anak Allah
  rationale: Aposisi dijelaskan secara alami dengan 'yaitu', sedangkan gelar kristologis diterjemahkan langsung dan tidak diparafrasakan.
- source_word: κρατῶμεν
  choice: marilah kita berpegang teguh
  rationale: Subjungtif hortatoris menyampaikan ajakan bersama untuk terus bertahan; 'berpegang teguh' alami, jelas, dan cukup berbobot.
- source_word: τῆς ὁμολογίας
  choice: pada pengakuan kita
  rationale: Dengan verba 'berpegang', preposisi 'pada' diperlukan dalam bahasa Indonesia. 'Pengakuan' menyampaikan pengakuan iman komunitas, dan 'kita' menjadikan rujukan komunal yang tersirat jelas tanpa mengubah maksud.
theological_decisions:
- issue: Penerjemahan gelar υἱὸς τοῦ θεοῦ
  choice: Anak Allah
  alternative: Putra Allah
  rationale: '''Anak Allah'' merupakan bentuk baku, mudah dipahami, dan mempertahankan gelar kristologis secara langsung tanpa penjelasan doktrinal tambahan.'
- issue: Apakah bentuk jamak τοὺς οὐρανούς perlu dipertahankan
  choice: surga-surga
  alternative: surga
  rationale: Bentuk jamak dipertahankan agar citra teks Yunani tidak diratakan menjadi tunggal. Terjemahan ini tidak menentukan jumlah atau susunan tingkat surgawi tertentu.
- issue: Hubungan antara Yesus dan sebutan Imam Besar
  choice: yaitu Yesus, Anak Allah
  alternative: Imam Besar yang agung ... Yesus, Anak Allah
  rationale: Penambahan penghubung aposisional 'yaitu' memperjelas bahwa Imam Besar tersebut adalah Yesus tanpa menambah klaim di luar struktur Yunani.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada luhur namun tetap mudah dipahami. Struktur inferensial dan kausal dipertahankan, demikian pula bentuk jamak dalam citra surgawi. Tanda koma mengapit keterangan tentang Imam Besar dan aposisi identitas Yesus.
