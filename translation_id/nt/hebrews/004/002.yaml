  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ γάρ ἐσμεν εὐηγγελισμένοι καθάπερ κἀκεῖνοι, ἀλλ’ οὐκ ὠφέλησεν ὁ λόγος τῆς ἀκοῆς ἐκείνους, μὴ ⸀συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/002.yaml
  text: For indeed[a], we also have had good news proclaimed to us, just as they did; but the message they heard did not benefit them[b], because it was not united by faith with those who heard.
translation:
  language: id
  text: Sebab memang, kepada kita juga telah diberitakan kabar baik, sama seperti kepada mereka. Namun, pesan yang mereka dengar tidak berguna bagi mereka, karena mereka tidak dipersatukan oleh iman[b] dengan orang-orang yang mendengar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Menurut varian tekstual dan terjemahan tradisional: “karena pesan itu tidak bercampur dengan iman dalam diri orang-orang yang mendengarnya.”'
    reason: textual_variant
  - marker: b
    text: 'Atau: “kepercayaan” atau “sikap percaya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐηγγελισμένοι
  choice: telah diberitakan kabar baik
  rationale: Bentuk perfektum pasif perifrastik menyatakan pemberitaan yang telah terjadi dan tetap relevan. Ungkapan ini mempertahankan gagasan verbal tanpa menjadikan “Injil” sebagai istilah teknis yang terlalu sempit dalam perbandingan dengan generasi padang gurun.
- source_word: καθάπερ κἀκεῖνοι
  choice: sama seperti kepada mereka
  rationale: Mengungkapkan kesejajaran bahwa baik pembaca maupun generasi padang gurun menerima pemberitaan dari Allah.
- source_word: ὁ λόγος τῆς ἀκοῆς
  choice: pesan yang mereka dengar
  rationale: Menyampaikan λόγος sebagai isi pemberitaan dan ἀκοή sebagai apa yang didengar dalam bahasa Indonesia yang alami.
- source_word: ὠφέλησεν
  choice: tidak berguna bagi mereka
  rationale: Padanan Indonesia yang wajar untuk kegagalan pesan itu menghasilkan manfaat atau keuntungan rohani.
- source_word: συγκεκερασμένους
  choice: dipersatukan
  rationale: Partisip ini secara harfiah menggambarkan pencampuran atau penggabungan; “dipersatukan” menyampaikan hasil relasional yang paling masuk akal dalam konstruksi ini.
- source_word: πίστει
  choice: iman
  rationale: Dalam konteks ini πίστις menunjuk pada tanggapan percaya terhadap pesan yang didengar. “Iman” mempertahankan istilah teologis umum tanpa menentukan suatu kerangka denominasi.
- source_word: τοῖς ἀκούσασιν
  choice: dengan orang-orang yang mendengar
  rationale: Padanan ini tetap dekat dengan ἀκούω dan mempertahankan ketegangan konteks antara mendengar pesan dan menerimanya dengan iman.
- source_word: μὴ συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν
  choice: karena mereka tidak dipersatukan oleh iman dengan orang-orang yang mendengar
  rationale: Mengikuti teks SBLGNT yang memakai partisip akusatif maskulin jamak, yang paling wajar menerangkan ἐκείνους, sehingga orang-orang itulah yang tidak dipersatukan dengan para pendengar lain melalui iman.
theological_decisions:
- issue: Makna πίστις
  choice: iman
  alternative: kepercayaan; sikap percaya
  rationale: Konteks mempertentangkan pendengaran dengan tanggapan percaya. “Iman” mempertahankan keluasan istilah Yunani, sedangkan alternatif leksikal dicatat agar unsur kepercayaan tetap terlihat.
- issue: Penafsiran klausa terakhir
  choice: mereka tidak dipersatukan oleh iman dengan orang-orang yang mendengar
  alternative: pesan itu tidak bercampur dengan iman dalam diri orang-orang yang mendengarnya
  rationale: Teks utama mengikuti bentuk συγκεκερασμένους dalam SBLGNT, yang selaras dengan ἐκείνους. Varian tekstual yang terkenal mendukung pemahaman tradisional bahwa pesan itu tidak bercampur dengan iman; alternatif tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur yang mudah dipahami. “Sebab memang” mewakili καὶ γάρ; pengulangan “kepada” memperjelas perbandingan. Penanda catatan ditempatkan pada klausa atau istilah yang diterangkannya.
