revisions:
- from: Karena itu, masih tersedia kesempatan bagi sebagian orang untuk masuk ke dalamnya, sedangkan mereka yang dahulu menerima pemberitaan kabar baik tidak masuk karena ketidaktaatan mereka.[a]
  to: Jadi, karena masih terbuka bagi beberapa orang untuk masuk ke dalamnya, dan mereka yang dahulu menerima pemberitaan kabar baik tidak masuk karena ketidaktaatan,[a]
  rationale: Revisi memulihkan kedua unsur ἐπεὶ οὖν melalui “Jadi, karena,” mengganti kontras tambahan “sedangkan” dengan “dan,” dan mempertahankan rujukan yang belum disebut ulang dalam bahasa Yunani melalui “ke dalamnya.” “Masih terbuka bagi beberapa orang” menyampaikan nilai kini dan peluang yang masih tersisa dari ἀπολείπεται tanpa menambahkan objek teologis yang tidak diulang dalam ayat ini. Catatan kaki tetap menandai alternatif leksikal yang sah untuk ἀπείθεια.
