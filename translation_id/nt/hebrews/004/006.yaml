source:
  edition: SBLGNT
  text: ἐπεὶ οὖν ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν, καὶ οἱ πρότερον εὐαγγελισθέντες οὐκ εἰσῆλθον δι’ ἀπείθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/006.yaml
  text: Therefore[a], since it remains for some to enter it, and those who formerly had the good news proclaimed to them did not enter because of disobedience,
translation:
  language: id
  text: Jadi, karena masih terbuka bagi beberapa orang untuk masuk ke dalamnya, dan mereka yang dahulu menerima pemberitaan kabar baik tidak masuk karena ketidaktaatan,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena ketidakpercayaan.” Kata Yunani ini dapat menunjuk pada penolakan untuk percaya yang terungkap dalam ketidaktaatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ οὖν
  choice: Karena itu
  rationale: Gabungan ini menghubungkan ayat dengan argumen sebelumnya secara inferensial sekaligus memberi dasar bagi kesimpulan berikutnya. Dalam bahasa Indonesia, “Karena itu” menyampaikan hubungan tersebut secara alami tanpa susunan yang kaku.
- source_word: ἀπολείπεται τινὰς εἰσελθεῖν
  choice: masih tersedia kesempatan bagi sebagian orang untuk masuk
  rationale: Bentuk kini pasif ἀπολείπεται menunjukkan bahwa kemungkinan untuk masuk tetap terbuka, sedangkan τινὰς mempertahankan rujukan yang tidak tentu. Penambahan tersirat “kesempatan” menghasilkan bahasa Indonesia yang wajar tanpa mengubah maksud.
- source_word: εἰς αὐτήν
  choice: ke dalamnya
  rationale: Pronomina feminin αὐτήν menunjuk kembali kepada tempat perhentian Allah dalam konteks sebelumnya. Pronomina dipertahankan agar tidak menambahkan nomina yang tidak diulang dalam teks Yunani.
- source_word: οἱ πρότερον εὐαγγελισθέντες
  choice: mereka yang dahulu menerima pemberitaan kabar baik
  rationale: 'Ungkapan ini mempertahankan unsur waktu πρότερον dan daya pasif εὐαγγελισθέντες: kabar baik diberitakan kepada mereka. Rumusan ini alami dan menghindari istilah gerejawi yang terlalu teknis.'
- source_word: οὐκ εἰσῆλθον
  choice: tidak masuk
  rationale: Terjemahan langsung ini mempertahankan negasi dan aspek peristiwa tanpa menambahkan gagasan “gagal” yang tidak dinyatakan secara eksplisit.
- source_word: δι’ ἀπείθειαν
  choice: karena ketidaktaatan mereka
  rationale: ἀπείθεια terutama menyatakan ketidaktaatan atau penolakan untuk patuh, tetapi dalam konteks ini berhubungan erat dengan ketidakpercayaan. Kata ganti “mereka” memperjelas hubungan secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna ἀπείθεια dalam peringatan tentang masuk ke tempat perhentian
  choice: karena ketidaktaatan mereka
  alternative: karena ketidakpercayaan mereka
  rationale: “Ketidaktaatan” mempertahankan makna leksikal utama serta tekanan pada penolakan untuk menanggapi firman Allah. Karena istilah Yunani juga dapat mencakup penolakan untuk percaya, alternatif itu dicatat dalam catatan kaki agar ketegangan antara tidak percaya dan tidak taat tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat mengalir bagi pembaca umum, sementara hubungan logis, rujukan pronominal, bentuk pasif pemberitaan kabar baik, dan ambiguitas teologis ἀπείθεια tetap dipertahankan.
