  - severity: low
    issue: “Sedangkan” menambahkan kontras yang lebih kuat daripada καί.
    rationale: Konjungsi καί di sini cukup diterjemahkan “dan”; hubungan argumentatifnya sudah ditopang oleh konteks dan struktur kalimat.
