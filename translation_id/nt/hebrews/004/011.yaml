  text: σπουδάσωμεν οὖν εἰσελθεῖν εἰς ἐκείνην τὴν κατάπαυσιν, ἵνα μὴ ἐν τῷ αὐτῷ τις ὑποδείγματι πέσῃ τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/011.yaml
  text: Therefore[a], let us make every effort to enter that rest, so that no one may fall by the same pattern of disobedience.
translation:
  language: id
  text: Karena itu, marilah kita berusaha sungguh-sungguh untuk masuk ke dalam perhentian itu, supaya jangan ada seorang pun jatuh dengan mengikuti pola ketidaktaatan yang sama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “contoh ketidakpercayaan yang sama.” Kata ini dapat dipahami dalam terang penolakan generasi padang gurun untuk percaya kepada Allah, meskipun kata Yunani di sini secara lebih langsung berarti “ketidaktaatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσωμεν
  choice: marilah kita berusaha sungguh-sungguh
  rationale: Subjungtif aoris yang bersifat ajakan menyerukan usaha yang tekun dan serius. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan daya dorong σπουδάζω.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari uraian sebelumnya tentang perhentian Allah dan kegagalan generasi padang gurun.
- source_word: εἰσελθεῖν
  choice: untuk masuk
  rationale: Infinitif ini melengkapi seruan untuk berusaha dan menyatakan sasaran usaha tersebut.
- source_word: ἐκείνην τὴν κατάπαυσιν
  choice: ke dalam perhentian itu
  rationale: Mempertahankan penunjukan kembali kepada perhentian yang telah dibahas tanpa mempersempit maknanya menjadi tempat tertentu.
- source_word: ἵνα μὴ ... τις
  choice: supaya jangan ada seorang pun
  rationale: Menyampaikan tujuan atau akibat negatif sekaligus mempertahankan nada peringatan.
- source_word: ἐν τῷ αὐτῷ ... ὑποδείγματι
  choice: dengan mengikuti pola ... yang sama
  rationale: ὑπόδειγμα dapat berarti contoh atau pola. Rumusan ini mengungkapkan secara alami bahwa kegagalan Israel menjadi pola buruk yang jangan diulangi, sambil mewakili nuansa ἐν secara idiomatis.
- source_word: πέσῃ
  choice: yang jatuh
  rationale: Mempertahankan metafora kejatuhan dan nada peringatan dari subjungtif aoris.
- source_word: τῆς ἀπειθείας
  choice: ketidaktaatan
  rationale: Makna leksikal yang paling langsung ialah ketidaktaatan, meskipun dalam konteks Ibrani istilah ini berkaitan erat dengan ketidakpercayaan.
theological_decisions:
- issue: Hubungan ἀπείθεια dengan kegagalan generasi padang gurun
  choice: ketidaktaatan dalam teks utama
  alternative: ketidakpercayaan
  rationale: Ibrani menghubungkan ketidakpercayaan dengan ketidaktaatan, tetapi ἀπείθεια secara lebih langsung berarti ketidaktaatan. Catatan kaki mempertahankan kemungkinan pemahaman kontekstual tanpa melebur kedua gagasan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ajakan yang khidmat dan tegas. “Perhentian” dipertahankan sebagai istilah kunci dalam alur argumentasi Ibrani 3–4; “berusaha sungguh-sungguh” dipilih agar jelas bagi pembaca umum tanpa kehilangan kekuatan nasihat.
