  text: Dan marilah kita memperhatikan satu sama lain, supaya kita saling mendorong untuk mengasihi dan melakukan perbuatan baik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “supaya kita saling menggugah” atau “memacu” untuk mengasihi dan melakukan perbuatan baik. Kata Yunani παροξυσμός dapat berarti dorongan atau rangsangan yang kuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοῶμεν
  choice: marilah kita memperhatikan
  rationale: Bentuk subjungtif kini orang pertama jamak berfungsi sebagai ajakan. 'Memperhatikan' menyampaikan pertimbangan yang sungguh-sungguh dan terarah kepada orang lain, serta terdengar alami dalam bahasa Indonesia.
- source_word: ἀλλήλους
  choice: satu sama lain
  rationale: Padanan timbal balik yang baku dan alami untuk nasihat dalam kehidupan bersama.
- source_word: εἰς
  choice: untuk
  rationale: Dalam konstruksi ini εἰς menyatakan tujuan atau hasil yang dimaksudkan.
- source_word: παροξυσμόν
  choice: mendorong
  rationale: Kata benda ini menunjuk pada dorongan atau rangsangan yang kuat. 'Mendorong' mempertahankan daya penggeraknya tanpa memberi kesan permusuhan yang tidak dituntut konteks; nuansa yang lebih tajam dicatat dalam catatan kaki.
- source_word: ἀγάπης
  choice: kasih
  rationale: Padanan Perjanjian Baru yang alami dan bermartabat bagi ἀγάπη.
- source_word: καλῶν ἔργων
  choice: perbuatan-perbuatan baik
  rationale: Menerjemahkan frasa adjektiva dan nomina secara langsung serta mempertahankan bentuk jamak ἔργων tanpa memasukkan gagasan teologis tentang jasa.
- source_word: καί
  choice: dan
  rationale: Menghubungkan nasihat ini dengan konteks sebelumnya; konjungsi kedua tercermin dalam 'kasih dan perbuatan-perbuatan baik'.
theological_decisions:
- issue: Kemungkinan konotasi negatif παροξυσμός
  choice: mendorong kasih dan perbuatan-perbuatan baik
  alternative: menggugah atau memacu kasih dan perbuatan-perbuatan baik
  rationale: Istilah Yunani dapat menyiratkan rangsangan atau provokasi yang kuat, tetapi sasaran yang disebutkan jelas positif. Teks utama memakai ungkapan positif yang tetap aktif, sedangkan ketajaman leksikalnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur ajakan komunal dipertahankan; ungkapan dibuat alami tanpa menghilangkan kekuatan kata παροξυσμός.
