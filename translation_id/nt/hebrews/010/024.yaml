    issue: Relasi timbal balik dan objek dorongan tidak eksplisit
    rationale: Frasa “untuk mendorong kasih dan perbuatan-perbuatan baik” dapat terbaca seolah-olah kasih dan perbuatan itu sendiri yang didorong. Menambahkan “kita saling” dan “untuk mengasihi dan melakukan” secara idiomatis mengungkapkan fungsi εἰς παροξυσμὸν tanpa menambah gagasan teologis.
  - severity: low
    issue: Pengulangan nomina “perbuatan-perbuatan” kurang alami
    rationale: Dalam bahasa Indonesia modern, “perbuatan baik” lazim berfungsi sebagai kategori generik dan dapat mencakup jamak. Bentuk reduplikasi tidak diperlukan demi kesetiaan pada ἔργων.
