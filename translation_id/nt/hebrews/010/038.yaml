base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/038.yaml
  text: But my righteous one will live by faith[a], and if he shrinks back[c][b], my soul takes no pleasure in him.
translation:
  language: id
  text: Namun, orang-Ku yang benar akan hidup oleh iman[a], dan jika ia mundur[c], jiwa-Ku tidak berkenan kepadanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “oleh kesetiaan” atau “oleh kepercayaan.” Kata Yunani pistis dapat mengandung arti-arti ini, meskipun teks utama memakai “iman.”
    reason: lexical_alternative
  - marker: b
    text: Beberapa naskah berbunyi “orang yang benar”, tanpa “-Ku”.
    reason: textual_variant
  - marker: c
    text: Bahasa Yunani memakai bentuk maskulin tunggal, yang di sini berfungsi secara representatif dan tidak harus hanya menunjuk kepada laki-laki. Bahasa Indonesia “ia” dan “kepadanya” mempertahankan bentuk tunggal, tetapi tidak menandai gender.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δὲ δίκαιός μου
  choice: Namun, orang-Ku yang benar
  rationale: Adjektiva substantival δίκαιος diterjemahkan secara alami sebagai 'orang yang benar'. Pronomina μου dipertahankan sebagai '-Ku' sesuai teks SBLGNT, sedangkan δέ menyatakan peralihan/kontras dan diterjemahkan 'Namun'.
- source_word: ἐκ πίστεως
  choice: oleh iman
  rationale: ἐκ menyatakan dasar atau sumber secara idiomatis; 'oleh iman' merupakan padanan Indonesia yang alami. Kemungkinan makna 'kesetiaan' atau 'kepercayaan' dicatat dalam catatan kaki.
- source_word: ζήσεται
  choice: akan hidup
  rationale: Bentuk future ζάω diterjemahkan langsung dan wajar dalam bahasa Indonesia.
- source_word: ὑποστείληται
  choice: mengundurkan diri
  rationale: Dalam konteks peringatan ini, verba tersebut berarti mundur atau menarik diri di bawah tekanan. 'Mengundurkan diri' mempertahankan gagasan kemunduran tanpa menambahkan alasan yang tidak dinyatakan.
- source_word: οὐκ εὐδοκεῖ
  choice: tidak berkenan
  rationale: Ungkapan ini menyampaikan arti tidak merasa senang atau tidak menaruh perkenanan dan terdengar wajar serta bermartabat dalam bahasa Indonesia.
- source_word: ἡ ψυχή μου
  choice: jiwa-Ku
  rationale: Ungkapan eksplisit Yunani dipertahankan, alih-alih diratakan menjadi sekadar 'Aku', sehingga gema kutipan Kitab Suci dan daya ungkap personalnya tetap ada.
- source_word: ἐν αὐτῷ
  choice: kepadanya
  rationale: Setelah εὐδοκέω, makna relasional ἐν αὐτῷ paling alami dinyatakan dengan 'kepadanya' dalam bahasa Indonesia.
theological_decisions:
- issue: Makna πίστις dalam ἐκ πίστεως
  choice: iman
  alternative: kesetiaan; kepercayaan
  rationale: Makna utama dipertahankan sebagai 'iman', tetapi keluasan semantis πίστις tidak ditutup; alternatif yang sungguh mungkin dicatat dalam catatan kaki.
- issue: Subjek pada klausa 'jika ia mengundurkan diri'
  choice: mempertahankan alur rujukan tunggal yang sama
  alternative: seseorang yang tidak tentu dan berbeda dari 'orang-Ku yang benar'
  rationale: Bahasa Yunani tidak menandai pergantian subjek secara eksplisit. Terjemahan mempertahankan ketegangan peringatan itu dan tidak memecah rujukannya demi penyelesaian teologis.
- issue: Gender gramatikal dan daya wakil bentuk tunggal maskulin
  choice: ia/kepadanya
  alternative: dia laki-laki/kepadanya dengan penandaan maskulin eksplisit
  rationale: Bahasa Indonesia 'ia' dan '-nya' tidak menandai gender, tetapi tetap mempertahankan jumlah tunggal dan tidak mengubahnya menjadi bentuk jamak. Catatan menjelaskan bahwa bentuk Yunani maskulin tunggal berfungsi secara representatif.
- issue: Varian tekstual pada μου
  choice: orang-Ku yang benar
  alternative: orang yang benar
  rationale: Teks utama mengikuti SBLGNT yang memuat μου, sementara pembacaan tanpa pronomina dilaporkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat mempertahankan kontras, bentuk tunggal, ungkapan 'jiwa-Ku', serta ketegangan teologis teks. Semua penanda catatan kaki ditempatkan dalam teks utama; catatan tekstual [b] ditempatkan setelah klausa akhir agar tidak memutus frasa 'orang-Ku yang benar'.
