  text: Καὶ πᾶς μὲν ἱερεὺς ἕστηκεν καθ’ ἡμέραν λειτουργῶν καὶ τὰς αὐτὰς πολλάκις προσφέρων θυσίας, αἵτινες οὐδέποτε δύνανται περιελεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/011.yaml
  text: And every priest stands day after day ministering and offering the same sacrifices again and again[a], which can never take away sins.
translation:
  language: id
  text: Setiap imam berdiri hari demi hari sambil melaksanakan pelayanan dan berulang kali mempersembahkan kurban-kurban yang sama, yang tidak pernah dapat menghapus dosa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyingkirkan dosa.”
    reason: Alternatif leksikal bagi περιελεῖν ἁμαρτίας.
lexical_decisions:
- source_word: πᾶς ... ἱερεὺς
  choice: setiap imam
  rationale: πᾶς dengan nomina tunggal bersifat distributif. “Setiap imam” alami dalam bahasa Indonesia dan tidak keliru membatasinya pada imam besar.
- source_word: ἕστηκεν
  choice: berdiri
  rationale: Bentuk perfektum ini menyatakan keadaan berdiri. Pilihan ini mempertahankan gambaran yang kontras dengan Mesias yang duduk pada ayat berikutnya tanpa menjelaskan kontras itu secara berlebihan.
- source_word: καθ’ ἡμέραν
  choice: hari demi hari
  rationale: Ungkapan ini menonjolkan tindakan harian yang terus berulang, sesuai dengan tekanan retoris bagian ini.
- source_word: λειτουργῶν
  choice: untuk menjalankan pelayanannya
  rationale: Partisip ini mengacu pada pelayanan keimaman dalam ibadah. Frasa ini lebih alami daripada “melayani” saja sekaligus mempertahankan nuansa tugas sakral.
- source_word: τὰς αὐτὰς ... θυσίας
  choice: kurban-kurban yang sama
  rationale: αὐτάς menegaskan bahwa persembahan kurban yang sama terus diulangi. Bentuk ulang “kurban-kurban” menyatakan jamak secara jelas.
- source_word: πολλάκις
  choice: berulang kali
  rationale: Adverbia ini menekankan pengulangan berkali-kali; “berulang kali” ringkas, alami, dan kuat dalam bahasa Indonesia.
- source_word: προσφέρων
  choice: mempersembahkan
  rationale: Dalam konteks kurban, προσφέρω berarti membawa atau memberikan sebagai persembahan. “Mempersembahkan” merupakan padanan Indonesia yang lazim dan tepat.
- source_word: αἵτινες
  choice: yang
  rationale: Kata ganti relatif ini merujuk kembali kepada kurban-kurban tersebut dan memperkenalkan penjelasan tentang ketidakmampuannya.
- source_word: οὐδέποτε δύνανται
  choice: tidak pernah dapat
  rationale: Gabungan ini menyatakan ketidakmampuan mutlak. Padanan ini mempertahankan kekuatan pernyataan Yunani secara lugas.
- source_word: περιελεῖν ἁμαρτίας
  choice: menghapus dosa
  rationale: περιαιρέω berarti menyingkirkan atau melenyapkan. “Menghapus dosa” alami dalam bahasa Indonesia dan menyampaikan gagasan peniadaan dosa tanpa menambahkan istilah teknis.
theological_decisions:
- issue: Hubungan sikap berdiri imam dengan argumen Ibrani 10
  choice: ἕστηκεν diterjemahkan “berdiri” agar gambaran pelayanan para imam yang terus berlangsung tetap berlawanan dengan Mesias yang duduk pada ayat berikutnya.
  alternative: “sedang berdiri” atau “telah berdiri,” yang lebih menonjolkan aspek verbal tertentu tetapi kurang alami dalam konteks ini.
  rationale: Kontras tersebut terdapat dalam konteks langsung. Terjemahan mempertahankannya melalui gambaran yang ada dalam teks tanpa menambahkan tafsiran eksplisit.
- issue: Cakupan ketidakmampuan kurban
  choice: Kurban-kurban itu “tidak pernah dapat menghapus dosa.”
  alternative: “Tidak dapat sepenuhnya menangani dosa,” yang akan melunakkan pernyataan.
  rationale: οὐδέποτε δύνανται menyatakan ketidakmampuan secara mutlak dalam argumen penulis mengenai ketidakcukupan kurban yang berulang. Klaim ini tidak dilunakkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Kurban” dipakai untuk persembahan korban dalam konteks ibadah, sedangkan susunan “hari demi hari” dan “berulang kali” mempertahankan tekanan pada pengulangan.
