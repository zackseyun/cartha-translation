base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/039.yaml
  text: But we are not of shrinking back to destruction[d][c][b][a], but of faith to the preservation of the soul.
translation:
  language: id
  text: Namun, kita bukanlah orang-orang yang mundur[a] menuju kebinasaan, melainkan orang-orang yang beriman[b] sehingga hidup kita terpelihara.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menarik diri.” Kata Yunani ini dapat berarti mundur atau menarik diri; dalam konteks ini sebagian penafsir memahaminya secara lebih kuat sebagai murtad.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang yang setia.” Kata Yunani pistis dapat berarti iman dan juga mengandung nuansa kesetiaan atau ketekunan dalam iman.
    reason: alternative_reading
  - marker: c
    text: Secara harfiah, “menuju pemeliharaan jiwa.” Ungkapan Yunani ini juga dapat dipahami sebagai memperoleh atau memiliki jiwa, hidup, atau diri; “jiwa” di sini tidak harus berarti bagian rohani manusia saja.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ οὐκ ἐσμὲν
  choice: Namun, kita bukanlah orang-orang yang
  rationale: Kata ganti eksplisit ἡμεῖς dipertahankan sebagai “kita” untuk menonjolkan kontras. Bentuk “bukanlah orang-orang yang” mengungkapkan genitif penggolongan secara wajar dalam bahasa Indonesia tanpa menghilangkan tekanan identitas kelompok.
- source_word: ὑποστολῆς
  choice: mundur
  rationale: Nomina ini menunjuk pada tindakan menarik diri atau mundur. “Mundur” alami dan cukup luas, tanpa langsung menafsirkannya secara lebih khusus sebagai kemurtadan.
- source_word: εἰς ἀπώλειαν
  choice: menuju kebinasaan
  rationale: εἰς menyatakan arah, hasil, atau tujuan akhir. “Menuju kebinasaan” mempertahankan gerak konseptual itu dan bobot serius ἀπώλεια.
- source_word: πίστεως
  choice: orang-orang yang beriman
  rationale: Genitif penggolongan dialihkan menjadi ungkapan identitas yang alami. “Beriman” mempertahankan arti utama πίστις dalam konteks ini, sementara kemungkinan nuansa kesetiaan dicatat dalam catatan kaki.
- source_word: εἰς περιποίησιν
  choice: sehingga ... terpelihara
  rationale: Dalam pertentangannya dengan kebinasaan, frasa ini paling wajar menyatakan hasil berupa pemeliharaan atau penyelamatan. “Sehingga” mengungkapkan daya hasil εἰς, tetapi kemungkinan makna memperoleh atau memiliki tetap dicatat.
- source_word: ψυχῆς
  choice: hidup kita
  rationale: ψυχή di sini dapat menunjuk pada hidup, diri, atau pribadi secara utuh, bukan hanya “jiwa” dalam pengertian modern yang sempit. “Hidup kita” jelas bagi pembaca Indonesia dan sesuai dengan konteks kebinasaan versus pemeliharaan.
theological_decisions:
- issue: Makna πίστις dalam kontras dengan ὑποστολή
  choice: beriman
  alternative: setia atau tetap teguh dalam iman
  rationale: Teks dapat menekankan iman yang bertekun, tetapi tidak mengharuskan πίστις dipersempit menjadi kesetiaan. Teks utama memakai “beriman” dan catatan mempertahankan nuansa alternatif.
- issue: Makna περιποίησις ψυχῆς
  choice: sehingga hidup kita terpelihara
  alternative: untuk memperoleh atau memiliki hidup/jiwa
  rationale: Kontras langsung dengan kebinasaan mendukung pengertian pemeliharaan. Namun, karena περιποίησις juga dapat berarti perolehan atau kepemilikan, kemungkinan itu tidak dihapus dan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Susunan “bukanlah orang-orang yang ... melainkan orang-orang yang ...” mempertahankan kontras identitas dalam bahasa Yunani, sedangkan klausa hasil dibuat lebih alami dalam bahasa Indonesia.
