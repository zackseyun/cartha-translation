  naturalness: “Seperti yang menjadi kebiasaan beberapa orang” lebih ringkas dan alami daripada “seperti yang biasa dilakukan oleh beberapa orang.” “Janganlah kita ... melainkan saling menguatkan” memberi bentuk nasihat yang koheren dalam bahasa Indonesia baku.
  terminology: “Hari itu” tepat untuk τὴν ἡμέραν dan mempertahankan rujukan eskatologis tanpa memperluas teks. Catatan kaki diperbaiki dari “hari kedatangan Tuhan” menjadi “hari Tuhan,” karena teks menyebut Hari itu, bukan secara eksplisit kedatangan Tuhan.
