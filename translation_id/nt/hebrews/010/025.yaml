  text: μὴ ἐγκαταλείποντες τὴν ἐπισυναγωγὴν ἑαυτῶν, καθὼς ἔθος τισίν, ἀλλὰ παρακαλοῦντες, καὶ τοσούτῳ μᾶλλον ὅσῳ βλέπετε ἐγγίζουσαν τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/025.yaml
  text: not neglecting our own gathering together[a], as is the habit of some[b], but encouraging one another—and all the more as you see the Day drawing near.
translation:
  language: id
  text: Janganlah kita meninggalkan pertemuan kita[a], seperti yang menjadi kebiasaan beberapa orang, melainkan saling menguatkan, dan terlebih lagi karena kamu melihat Hari itu semakin dekat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengabaikan” atau “menelantarkan pertemuan kita.”
    reason: lexical_alternative
  - marker: b
    text: “Hari itu” kemungkinan menunjuk pada hari Tuhan atau penghakiman terakhir.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγκαταλείποντες
  choice: meninggalkan
  rationale: Kata ini dapat berarti membiarkan, meninggalkan, atau menelantarkan. Dalam konteks kebiasaan tidak berkumpul, “meninggalkan” mempertahankan teguran yang tegas tanpa harus menyatakan bahwa yang dimaksud selalu kemurtadan total.
- source_word: ἐπισυναγωγὴν ἑαυτῶν
  choice: pertemuan kita bersama
  rationale: Ungkapan ini menunjuk pada tindakan komunitas orang percaya berkumpul. “Pertemuan kita bersama” alami dalam bahasa Indonesia dan tidak memasukkan gagasan institusional yang tidak dinyatakan dalam teks.
- source_word: καθὼς ἔθος τισίν
  choice: seperti yang biasa dilakukan oleh beberapa orang
  rationale: Terjemahan ini menyampaikan ἔθος sebagai kebiasaan dan mempertahankan teguran penulis terhadap sebagian anggota komunitas.
- source_word: παρακαλοῦντες
  choice: saling menguatkan
  rationale: Dalam konteks ketekunan komunitas, kata ini mencakup dorongan dan nasihat yang menguatkan. Unsur “saling” tersirat dari konteks komunal meskipun objeknya tidak dinyatakan secara eksplisit.
- source_word: τοσούτῳ μᾶλλον ὅσῳ
  choice: terlebih lagi ketika
  rationale: Frasa ini menyatakan peningkatan urgensi seiring mendekatnya Hari itu; pilihan ini ringkas dan wajar dalam bahasa Indonesia.
- source_word: βλέπετε
  choice: kamu melihat
  rationale: Bentuk orang kedua jamak dipertahankan dengan “kamu” yang ditujukan kepada komunitas; “melihat” membiarkan dasar pengamatan itu tetap terbuka sebagaimana teks sumber.
- source_word: ἐγγίζουσαν τὴν ἡμέραν
  choice: Hari itu makin dekat
  rationale: “Makin dekat” menyampaikan gerak temporal dari ἐγγίζουσαν, sedangkan “Hari itu” menunjuk pada hari eskatologis yang dikenal tanpa memperluasnya menjadi sebutan yang tidak eksplisit dalam bahasa Yunani.
theological_decisions:
- issue: Rujukan eskatologis τὴν ἡμέραν
  choice: Hari itu
  alternative: hari Tuhan; hari penghakiman; hari itu
  rationale: Konteks menunjukkan suatu hari eskatologis yang telah dikenal pembaca. Kapitalisasi menandai bobot khususnya, sementara catatan kaki menjelaskan kemungkinan rujukannya tanpa menetapkan lebih dari yang dikatakan teks.
- issue: Objek timbal balik παρακαλοῦντες
  choice: saling menguatkan
  alternative: menguatkan; saling menasihati
  rationale: Walaupun objek timbal balik tidak tertulis, konteks pertemuan komunitas sangat kuat menyiratkannya. “Menguatkan” mempertahankan cakupan dorongan dan nasihat tanpa mempersempit kata hanya pada teguran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang tegas namun pastoral. “Kamu” dipakai sebagai bentuk orang kedua jamak yang ditujukan kepada seluruh komunitas. Struktur partisipial Yunani dialihkan menjadi rangkaian imperatif agar alami dalam bahasa Indonesia, tanpa mengubah hubungan dengan ajakan pada ayat sebelumnya.
