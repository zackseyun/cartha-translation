translation:
  language: id
  text: Dan Aku tidak akan lagi mengingat dosa-dosa mereka dan perbuatan mereka yang melanggar hukum.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Aku sama sekali tidak akan mengingat lagi dosa-dosa mereka dan perbuatan mereka yang melanggar hukum.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “perbuatan yang melanggar hukum” menerjemahkan ἀνομίαι, yang juga dapat diterjemahkan “tindakan-tindakan durhaka” atau, secara tradisional, “kedurhakaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung ini dipertahankan pada awal ayat karena klausa tersebut melanjutkan kutipan dan berkaitan dengan pernyataan sebelumnya.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: dosa-dosa mereka
  rationale: Bentuk jamak ἁμαρτίαι paling langsung dan wajar diterjemahkan sebagai 'dosa-dosa', sedangkan αὐτῶν berarti 'mereka'.
- source_word: καὶ τῶν ἀνομιῶν αὐτῶν
  choice: dan perbuatan-perbuatan mereka yang melanggar hukum
  rationale: ἀνομία menunjuk pada pelanggaran atau pengabaian hukum. Ungkapan ini menyampaikan makna konkret bentuk jamaknya dalam bahasa Indonesia modern tanpa memakai istilah tradisional yang kurang transparan.
- source_word: οὐ μὴ μνησθήσομαι
  choice: Aku tidak akan ... mengingat
  rationale: οὐ μή bersama bentuk verba futur menyatakan penyangkalan yang tegas. Kata 'mengingat' dipertahankan agar kiasan alkitabiah tentang Allah yang tidak mengingat dosa tidak diparafrasakan secara berlebihan.
- source_word: ἔτι
  choice: lagi
  rationale: Dalam konstruksi negatif ini, ἔτι berarti 'lagi' atau 'lebih lama lagi'; penempatannya menghasilkan ungkapan Indonesia yang alami, 'tidak akan lagi mengingat'.
theological_decisions:
- issue: Allah tidak lagi mengingat dosa
  choice: Aku tidak akan lagi mengingat
  alternative: Aku sama sekali tidak akan mengingat lagi
  rationale: Terjemahan utama mempertahankan bahasa perjanjian tentang Allah yang tidak mengingat dosa, tanpa menafsirkannya sebagai hilangnya pengetahuan ilahi. Alternatif yang lebih harfiah memperlihatkan secara lebih eksplisit penyangkalan tegas οὐ μή.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Huruf kapital pada 'Aku' menandai bahwa pembicara dalam kutipan adalah Allah. Struktur ayat mempertahankan kesinambungan dengan kutipan sebelumnya serta ambiguitas teologis ungkapan 'tidak mengingat'.
