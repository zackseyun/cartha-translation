  text: τότε εἶπον· Ἰδοὺ ἥκω, ἐν κεφαλίδι βιβλίου γέγραπται περὶ ἐμοῦ, τοῦ ποιῆσαι, ὁ θεός, τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/007.yaml
  text: Then I said[a], ‘Behold, I have come—in the scroll of the book it is written about me—to do your will, O God.’
translation:
  language: id
  text: Lalu Aku berkata, “Lihatlah, Aku telah datang—dalam gulungan kitab tertulis tentang Aku—untuk melakukan kehendak-Mu, ya Allah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Lalu
  rationale: Menandai urutan dalam kutipan secara ringkas dan alami.
- source_word: εἶπον
  choice: Aku berkata
  rationale: Bentuk lampau λέγω paling wajar diterjemahkan sebagai formula ujaran langsung ini.
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan daya penunjuk dan nada khidmat tanpa memakai ungkapan Indonesia yang usang.
- source_word: ἥκω
  choice: Aku telah datang
  rationale: Walaupun berbentuk kini, verba ini lazim menyatakan kedatangan yang sudah terjadi dengan hasil yang tetap berlaku.
- source_word: ἐν κεφαλίδι βιβλίου
  choice: dalam gulungan kitab
  rationale: Dalam ungkapan ini κεφαλίς menunjuk pada gulungan, bukan judul atau kepala bagian; frasa tersebut juga mempertahankan gambaran naskah kuno.
- source_word: γέγραπται
  choice: ada tertulis
  rationale: 'Menyampaikan keadaan tetap dari bentuk perfektum pasif: tulisan itu tetap tercantum dan berlaku.'
- source_word: περὶ ἐμοῦ
  choice: tentang Aku
  rationale: Padanan Indonesia yang langsung dan alami untuk περί dengan genitif.
- source_word: τοῦ ποιῆσαι
  choice: untuk melakukan
  rationale: Infinitif berartikel menyatakan tujuan kedatangan sang pembicara.
- source_word: ὁ θεός
  choice: ya Allah
  rationale: Bentuk nominatif memiliki fungsi vokatif; 'ya Allah' menandai sapaan langsung secara alami dalam bahasa Indonesia.
- source_word: τὸ θέλημά σου
  choice: kehendak-Mu
  rationale: Mempertahankan istilah teologis utama θέλημα dan hubungan orang kedua tunggal.
theological_decisions:
- issue: Rujukan diri mesianik dalam kutipan Mazmur yang diterapkan oleh Surat Ibrani
  choice: Mempertahankan ujaran orang pertama tanpa menambahkan identitas pembicara dalam ayat.
  alternative: Menambahkan bahwa pembicaranya adalah Mesias atau Kristus.
  rationale: Konteks Surat Ibrani menerapkan kutipan ini kepada Sang Anak, tetapi teks ayat sendiri berupa pernyataan orang pertama; kontekslah yang menjelaskan penerapannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Huruf kapital pada kata ganti orang pertama dan kedua mengikuti rujukan ilahi dalam konteks kutipan. Tanda pisah mempertahankan sisipan 'tentang Aku ada tertulis dalam gulungan kitab' tanpa menghilangkan hubungan utama antara datang dan melakukan kehendak Allah.
