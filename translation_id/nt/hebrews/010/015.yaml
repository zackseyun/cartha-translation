  yaml_path: translation/nt/hebrews/010/015.yaml
  text: And the Holy Spirit also testifies to us[a]; for after saying,
translation:
  language: id
  text: Dan Roh Kudus juga bersaksi kepada kita[a], sebab setelah berkata,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberikan kesaksian kepada kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: bersaksi
  rationale: Bentuk kini aktif ini menyatakan tindakan memberi kesaksian. “Bersaksi” alami dalam bahasa Indonesia modern dan mempertahankan nuansa kesaksian.
- source_word: δὲ
  choice: ''
  rationale: Partikel ini hanya menjadi penghubung ringan dalam alur argumen. Agar kalimat Indonesia tetap alami pada konteks ayat sebelumnya, maknanya tidak dinyatakan dengan kata tersendiri.
- source_word: ἡμῖν
  choice: kepada kita
  rationale: Datif bersama μαρτυρεῖ menunjuk kepada pihak yang menerima kesaksian, yaitu penulis dan para pendengarnya.
- source_word: καὶ
  choice: juga
  rationale: Menandai Roh Kudus sebagai saksi tambahan dalam argumen penulis.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roh Kudus
  rationale: Sebutan baku dan jelas dalam bahasa Indonesia bagi Roh yang disebut secara tertentu oleh konstruksi Yunani ini.
- source_word: μετὰ γὰρ τὸ εἰρηκέναι
  choice: sebab setelah berkata
  rationale: Konstruksi infinitif berartikel dengan μετά menyatakan urutan waktu. Subjek “berkata” dibiarkan tersirat sebagaimana dalam teks Yunani dan secara alami merujuk kembali kepada Roh Kudus.
theological_decisions:
- issue: Pelaku pribadi dalam kesaksian Roh Kudus
  choice: Roh Kudus juga bersaksi kepada kita
  alternative: Roh Kudus juga memberikan kesaksian kepada kita
  rationale: Tata bahasa Yunani menampilkan Roh Kudus sebagai pelaku aktif. Terjemahan ini mempertahankan agensi tersebut tanpa menambahkan penjelasan teologis yang tidak dinyatakan dalam ayat.
- issue: Subjek tersirat dari εἰρηκέναι
  choice: setelah berkata
  alternative: setelah Ia berkata
  rationale: Bahasa Yunani tidak mengungkapkan subjek infinitif secara eksplisit, meskipun konteks menunjuk kepada Roh Kudus. Bentuk tanpa pronomina mempertahankan kekompakan dan sedikit ketakterungkapan teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat sengaja berakhir dengan koma karena mengantar kutipan pada ayat berikutnya.
