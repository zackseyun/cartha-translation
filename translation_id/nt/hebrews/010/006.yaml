base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/006.yaml
  text: In whole burnt offerings and sin offerings you took no pleasure[a].
translation:
  language: id
  text: Kurban bakaran dan kurban penghapus dosa tidak Engkau sukai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kurban bakaran dan persembahan karena dosa.” Frasa Yunani περὶ ἁμαρτίας adalah ungkapan khusus dalam konteks persembahan yang berarti persembahan yang dipersembahkan karena dosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁλοκαυτώματα
  choice: kurban-kurban bakaran yang dibakar seluruhnya
  rationale: Istilah ini menunjuk pada kurban yang seluruh bagiannya dibakar. Ungkapan ini mempertahankan kekhususan jenis kurban sekaligus menjelaskan maknanya bagi pembaca modern.
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung sederhana yang menghubungkan dua jenis kurban.
- source_word: περὶ ἁμαρτίας
  choice: kurban-kurban penghapus dosa
  rationale: Dalam konteks persembahan, frasa ini merupakan ungkapan idiomatis untuk kurban yang dipersembahkan karena dosa. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kategori kurban khusus tersebut.
- source_word: οὐκ
  choice: tidak
  rationale: Negasi diterjemahkan secara langsung dan sepenuhnya.
- source_word: εὐδόκησας
  choice: Engkau sukai
  rationale: Bentuk verba orang kedua tunggal ditujukan kepada Allah. Bersama negasi, ungkapan ini menyampaikan bahwa kurban-kurban itu tidak berkenan kepada-Nya tanpa menambahkan penafsiran teologis.
theological_decisions:
- issue: Istilah kurban dalam kutipan Mazmur 40:6 LXX dan argumen Ibrani 10
  choice: Memakai istilah khusus “kurban-kurban bakaran yang dibakar seluruhnya” dan “kurban-kurban penghapus dosa.”
  alternative: “kurban-kurban bakaran dan persembahan-persembahan karena dosa”
  rationale: Kekhususan dua kategori kurban dipertahankan agar kontras dalam argumen Ibrani tetap terlihat, tanpa melunakkannya menjadi istilah umum atau menyelesaikan ketegangan teologis dalam kutipan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi “Engkau” menandai sapaan kepada Allah. Pengulangan “kurban-kurban” mempertahankan bentuk jamak Yunani dan kejelasan dua kategori persembahan.
