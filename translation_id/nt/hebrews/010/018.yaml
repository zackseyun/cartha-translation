base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/018.yaml
  text: Where there is forgiveness of these[a], there is no longer any offering for sin.
translation:
  language: id
  text: Di mana terdapat pengampunan atas hal-hal itu[a], tidak ada lagi persembahan untuk dosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penghapusan atas hal-hal itu”; “hal-hal itu” merujuk pada dosa-dosa dan perbuatan-perbuatan durhaka yang disebut dalam ayat sebelumnya.
    reason: Menjelaskan alternatif leksikal bagi ἄφεσις dan rujukan kata tunjuk τούτων tanpa menambahkan unsur kuantitatif.
lexical_decisions:
- source_word: ὅπου
  choice: di mana
  rationale: Memperkenalkan keadaan atau lingkup berlakunya kesimpulan ini; bentuk ini alami dan tetap dekat dengan susunan Yunani.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai kelanjutan atau kesimpulan ringan. Dalam bahasa Indonesia, hubungan itu sudah jelas dari konteks sehingga penambahan seperti 'sekarang' atau 'tetapi' dapat memberi nuansa yang terlalu kuat.
- source_word: ἄφεσις
  choice: pengampunan
  rationale: Dalam konteks dosa dan persembahan, kata ini menyatakan pembebasan atau penghapusan kesalahan; 'pengampunan' merupakan padanan modern yang jelas dan berbobot.
- source_word: τούτων
  choice: atas semua itu
  rationale: Kata tunjuk ini merujuk kembali pada dosa-dosa dan perbuatan-perbuatan durhaka pada ayat sebelumnya tanpa menggantinya secara eksplisit dengan nomina yang tidak diulang dalam bahasa Yunani.
- source_word: οὐκέτι
  choice: tidak ada lagi
  rationale: Menyatakan bahwa persembahan tersebut tidak lagi ada atau diperlukan setelah adanya pengampunan.
- source_word: προσφορὰ
  choice: persembahan
  rationale: Mempertahankan istilah umum dalam ranah kurban tanpa mempersempitnya menjadi jenis kurban tertentu.
- source_word: περὶ ἁμαρτίας
  choice: karena dosa
  rationale: Ungkapan ini dalam konteks persembahan berarti persembahan yang berkenaan dengan atau dilakukan karena dosa. Pilihan ini alami dalam bahasa Indonesia dan tidak secara berlebihan mengkhususkannya sebagai nama teknis 'kurban penghapus dosa'.
theological_decisions:
- issue: Implikasi finalitas persembahan Kristus
  choice: Ayat menyatakan bahwa apabila dosa-dosa itu telah diampuni, tidak ada lagi persembahan karena dosa.
  alternative: Ayat meniadakan setiap jenis persembahan tanpa pengecualian, atau hanya membahas persembahan Lewi secara seremonial tanpa implikasi lebih luas.
  rationale: Konteks Ibrani 10 mempertentangkan persembahan yang berulang dengan persembahan Kristus yang efektif sekali untuk selamanya. Terjemahan mempertahankan klaim ayat mengenai berakhirnya persembahan karena dosa tanpa memperluas atau mempersempitnya secara doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Frasa 'atas semua itu' mempertahankan rujukan anaforis teks Yunani, sedangkan catatan kaki menjernihkan acuannya.
