  text: and a great priest over the house of God[b][a],
translation:
  language: id
  text: dan kita mempunyai seorang imam yang agung yang mengepalai rumah Allah[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang Imam Besar.” Surat Ibrani sering menyajikan Yesus sebagai Imam Besar, tetapi ayat ini secara harfiah memakai ungkapan “seorang imam yang agung.”
    reason: alternative_reading
  - marker: b
    text: “Rumah Allah” juga dapat bermakna keluarga Allah, yaitu umat-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung ini meneruskan rangkaian dari ayat sebelumnya; susunan Indonesia menambahkan kembali unsur 'kita mempunyai' yang tersirat dari konstruksi ayat 19–21 agar penggalan ini terbaca alami.
- source_word: ἱερέα
  choice: imam
  rationale: ἱερεύς berarti 'imam', bukan istilah teknis ἀρχιερεύς ('imam besar').
- source_word: μέγαν
  choice: agung
  rationale: μέγας menyatakan kebesaran atau keunggulan. 'Agung' mempertahankan pembedaan dari gelar teknis 'imam besar' dan lebih alami daripada 'imam yang besar' dalam konteks ini.
- source_word: ἐπὶ
  choice: yang mengepalai
  rationale: Dengan objek akusatif, ἐπί di sini menyatakan kewenangan atau pengawasan. 'Mengepalai' mengungkapkan relasi tersebut secara alami dalam bahasa Indonesia.
- source_word: τὸν οἶκον
  choice: rumah
  rationale: οἶκος dapat berarti rumah maupun rumah tangga/umat. 'Rumah' mempertahankan metafora alkitabiah dan ambiguitas dasarnya.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Genitif ini menunjukkan bahwa rumah tersebut adalah milik Allah; frasa Indonesia yang lazim ialah 'rumah Allah'.
theological_decisions:
- issue: Apakah ἱερέα μέγαν diterjemahkan sebagai gelar teknis 'Imam Besar'
  choice: imam agung
  alternative: Imam Besar
  rationale: Konteks Surat Ibrani jelas menggambarkan Yesus sebagai Imam Besar, tetapi ayat ini memakai ἱερεύς + μέγας, bukan ἀρχιερεύς. 'Imam agung' mempertahankan arti kebesaran tanpa menyamakan ungkapan ini secara diam-diam dengan gelar teknis.
- issue: Cakupan makna 'rumah Allah'
  choice: mempertahankan metafora 'rumah Allah'
  alternative: keluarga Allah atau umat Allah
  rationale: οἶκος dapat menunjuk pada rumah maupun rumah tangga, dan dalam Surat Ibrani memiliki gema komunal. Terjemahan utama mempertahankan metafora, sedangkan catatan kaki menjelaskan kemungkinan maksud umat Allah.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. 'Imam agung' sengaja dipakai untuk membedakan ἱερεύς μέγας dari gelar teknis ἀρχιερεύς, sedangkan 'mengepalai' menyampaikan gagasan kewenangan ἐπί dengan jelas. Penambahan 'kita mempunyai' berasal dari struktur sintaksis yang berlanjut dari ayat 19 dan diperlukan agar penggalan ayat ini berdiri alami dalam bahasa Indonesia.
