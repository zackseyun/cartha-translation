  text: οἴδαμεν γὰρ τὸν εἰπόντα· Ἐμοὶ ἐκδίκησις, ἐγὼ ⸀ἀνταποδώσω· καὶ πάλιν· ⸂Κρινεῖ κύριος⸃ τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/030.yaml
  text: For we know the one who said[a], “Vengeance is mine; I will repay,” and again[b], “The Lord will judge his people.”
translation:
  language: id
  text: Sebab kita mengenal Dia yang berkata, “Pembalasan adalah milik-Ku; Aku akan membalas,” dan lagi[a], “Tuhan akan menghakimi umat-Nya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kutipan ini menggemakan Ulangan 32:35–36. Dalam konteks aslinya, “menghakimi” dapat mencakup penghukuman maupun pembelaan; dalam konteks peringatan di sini, penghakiman ilahi lebih ditonjolkan.
    reason: cross_reference
lexical_decisions:
- source_word: οἴδαμεν
  choice: kita mengenal
  rationale: Bentuk οἶδα bermakna kini. Karena objeknya adalah pribadi, 'mengenal' lebih alami daripada 'mengetahui' dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelas dengan peringatan pada ayat sebelumnya.
- source_word: τὸν εἰπόντα
  choice: Dia yang berkata
  rationale: Partisipel substantival ini menunjuk kepada Allah sebagai pembicara dalam kutipan; huruf kapital menandai rujukan ilahi tanpa menambahkan nama yang tidak terdapat dalam teks.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: Pembalasan adalah hak-Ku
  rationale: Ungkapan Yunani bersifat eliptis, harfiah 'bagi-Ku pembalasan'. 'Adalah hak-Ku' menyampaikan kepemilikan dan kewenangan eksklusif secara jelas serta wajar dalam bahasa Indonesia.
- source_word: ἀνταποδώσω
  choice: Aku akan membalas
  rationale: Menyampaikan tindakan memberikan balasan yang setimpal; dalam konteks penghakiman, 'membalas' lebih alami dan tetap kuat.
- source_word: καὶ πάλιν
  choice: dan selanjutnya
  rationale: Memperkenalkan kutipan lain tanpa menyiratkan bahwa isinya pernah diucapkan dua kali; 'selanjutnya' alami dalam rangkaian kutipan.
- source_word: Κρινεῖ
  choice: akan menghakimi
  rationale: Mempertahankan cakupan yudisial κρίνω. Konteks peringatan menonjolkan penghakiman, tetapi terjemahan tidak mempersempit kata itu menjadi penghukuman saja.
- source_word: κύριος
  choice: Tuhan
  rationale: Padanan baku dan alami untuk κύριος ketika menunjuk kepada Allah.
- source_word: τὸν λαὸν αὐτοῦ
  choice: umat-Nya
  rationale: '''Umat'' mempertahankan nuansa komunitas perjanjian, sedangkan enklitik hormat ''-Nya'' jelas menunjuk kepada Tuhan.'
theological_decisions:
- issue: Cakupan bahasa yudisial dalam kutipan Ulangan
  choice: Tuhan akan menghakimi umat-Nya
  alternative: Tuhan akan membela umat-Nya
  rationale: κρίνω dapat mencakup penghukuman maupun pembelaan. Konteks peringatan Ibrani 10 mendukung 'menghakimi', yang tetap cukup luas untuk mempertahankan ketegangan semantis tanpa melunakkannya menjadi pembelaan semata.
- issue: Kewenangan ilahi atas pembalasan
  choice: Pembalasan adalah hak-Ku
  alternative: Pembalasan adalah milik-Ku
  rationale: Konstruksi datif eliptis menyatakan bahwa pembalasan berada pada Allah. 'Hak-Ku' menyampaikan kewenangan itu dengan idiom Indonesia yang jelas tanpa menambahkan cara atau waktu pelaksanaannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kutipan dipertahankan ringkas; kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Penanda catatan kaki [a] ditempatkan pada pengantar kutipan kedua, yang berkaitan langsung dengan penjelasan catatan.
