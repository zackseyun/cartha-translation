base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/019.yaml
  text: Therefore, brothers, since we have boldness to enter the holy places by the blood of Jesus,
translation:
  language: id
  text: Maka, saudara-saudara[a], karena kita memiliki keberanian untuk masuk ke tempat kudus[b] melalui darah Yesus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudari”; kata Yunani berbentuk maskulin (“saudara-saudara”) dan dapat menyapa seluruh jemaat secara representatif.
    reason: lexical_alternative
  - marker: b
    text: Atau “tempat-tempat kudus”; frasa Yunani berbentuk jamak dan, dalam konteks gambaran kemah suci di Surat Ibrani, menunjuk pada tempat kudus hadirat Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες
  choice: karena kita memiliki
  rationale: Bentuk partisip ini menyatakan dasar bagi ajakan yang menyusul. Terjemahan kausal ini alami dalam bahasa Indonesia dan tetap mempertahankan hubungan logisnya.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari uraian sebelumnya dan menghubungkan ayat ini dengan argumen yang telah dipaparkan.
- source_word: ἀδελφοί
  choice: saudara-saudara
  rationale: Mempertahankan bentuk sapaan jamak maskulin dalam bahasa Yunani. Dalam konteksnya, sapaan ini dapat mewakili seluruh jemaat; hal itu dijelaskan dalam catatan kaki tanpa mengubah bentuk teks utama.
- source_word: παρρησίαν
  choice: keberanian
  rationale: Mengungkapkan kebebasan dan keyakinan yang teguh untuk mendekat kepada Allah. Pilihan ini mempertahankan kekuatan istilah Yunani tanpa menghilangkan nuansa hormat dalam konteksnya.
- source_word: εἰς τὴν εἴσοδον
  choice: untuk masuk
  rationale: Mengalihkan frasa nominal tentang jalan masuk menjadi bentuk verbal yang wajar dalam bahasa Indonesia, dengan tetap menyatakan akses atau tindakan memasuki.
- source_word: τῶν ἁγίων
  choice: tempat-tempat kudus
  rationale: Dalam gambaran kemah suci yang mendominasi konteks Ibrani, frasa ini menunjuk pada kawasan kudus hadirat Allah. Bentuk jamak dipertahankan dan cakupannya tidak dipersempit menjadi hanya Ruang Mahakudus.
- source_word: ἐν τῷ αἵματι Ἰησοῦ
  choice: melalui darah Yesus
  rationale: Menyatakan sarana atau dasar untuk masuk. 'Melalui' terdengar alami dalam bahasa Indonesia dan mempertahankan makna pengorbanan darah Yesus tanpa menjadikannya pelaku tindakan.
theological_decisions:
- issue: Cakupan τῶν ἁγίων
  choice: rujukan kultis-spasial kepada tempat-tempat kudus dalam hadirat Allah
  alternative: tempat kudus; Ruang Mahakudus; orang-orang kudus
  rationale: Konteks dekatnya meneruskan gambaran kemah suci dan akses kepada Allah. 'Orang-orang kudus' tidak sesuai dengan alur ini, sedangkan 'Ruang Mahakudus' mempersempit cakupan melebihi yang dinyatakan frasa Yunani.
- issue: Daya representatif ἀδελφοί
  choice: mempertahankan 'saudara-saudara' dalam teks utama dan menjelaskan kemungkinan cakupan seluruh jemaat dalam catatan kaki
  alternative: saudara-saudara laki-laki dan perempuan; saudara sekalian
  rationale: Bentuk Yunani adalah jamak maskulin, tetapi dalam pemakaian sapaan dapat mencakup seluruh jemaat. Terjemahan ini mempertahankan bentuk sumber sekaligus menjelaskan cakupannya.
- issue: Hubungan darah Yesus dengan jalan masuk
  choice: darah Yesus sebagai sarana atau dasar akses
  alternative: berada secara harfiah di dalam darah Yesus
  rationale: Dalam konteks pengorbanan dan akses ke hadirat Allah, ἐν paling wajar menyatakan sarana atau dasar. 'Melalui' menjaga hubungan tersebut tanpa menjelaskan mekanismenya lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan klausa mempertahankan hubungan inferensial dan kausal dari teks Yunani. Koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
