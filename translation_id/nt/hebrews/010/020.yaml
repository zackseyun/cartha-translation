  text: ἣν ἐνεκαίνισεν ἡμῖν ὁδὸν πρόσφατον καὶ ζῶσαν διὰ τοῦ καταπετάσματος, τοῦτ’ ἔστιν τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/020.yaml
  text: which he inaugurated for us as a new and living way through the curtain—that is[a], his flesh[b],
translation:
  language: id
  text: yang telah Ia resmikan bagi kita sebagai jalan yang baru dan hidup melalui tirai, yaitu[a] daging-Nya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan kata lain”.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “yaitu daging-Nya” menjelaskan gambaran tirai dengan mengidentifikasikan tirai itu dengan daging Yesus.
    reason: cultural_note
lexical_decisions:
- source_word: ἣν
  choice: yang
  rationale: Pronomina relatif ini mempertahankan kaitan gramatikal dengan jalan masuk atau akses pada ayat sebelumnya tanpa menentukan antesedennya secara berlebihan.
- source_word: ἐνεκαίνισεν
  choice: telah Ia resmikan
  rationale: Kata kerja ini menyatakan peresmian atau pembaktian sesuatu yang baru untuk digunakan; 'resmikan' alami dalam bahasa Indonesia dan tetap mempertahankan nuansa inauguratif.
- source_word: ἡμῖν
  choice: bagi kita
  rationale: Datif keuntungan paling jelas disampaikan dengan 'bagi kita', yang menonjolkan manfaat bagi para pembaca.
- source_word: ὁδὸν
  choice: jalan
  rationale: '''Jalan'' merupakan padanan alami yang dapat digunakan baik secara harfiah maupun metaforis untuk akses kepada Allah.'
- source_word: πρόσφατον
  choice: baru
  rationale: Dalam konteks jalan yang baru ditetapkan, 'baru' menyampaikan makna πρόσφατος dengan jelas tanpa ungkapan yang janggal.
- source_word: ζῶσαν
  choice: hidup
  rationale: '''Hidup'' mempertahankan bentuk adjektival dan ketegangan metaforis teks tanpa menafsirkannya secara lebih khusus sebagai ''memberi hidup''.'
- source_word: διὰ τοῦ καταπετάσματος
  choice: melalui tirai
  rationale: καταπέτασμα menunjuk pada tirai Kemah Suci atau Bait Allah; 'tirai' merupakan istilah modern yang mudah dipahami.
- source_word: τοῦτ’ ἔστιν
  choice: yaitu
  rationale: '''Yaitu'' adalah formula penjelas yang ringkas dan alami dalam bahasa Indonesia.'
- source_word: τῆς σαρκὸς αὐτοῦ
  choice: daging-Nya
  rationale: '''Daging'' mempertahankan transparansi leksikal σάρξ dan bentuk aposisional Yunani, tanpa meratakannya menjadi sekadar ''tubuh'' atau mengulang ''melalui'' yang tidak dinyatakan kembali.'
theological_decisions:
- issue: Identifikasi metaforis tirai dengan daging Yesus
  choice: yaitu daging-Nya
  alternative: yaitu, melalui daging-Nya
  rationale: Bentuk aposisional Yunani menjelaskan tirai dengan menghubungkannya pada daging-Nya. Terjemahan ini mempertahankan identifikasi metaforis dan ambiguitas sintaksisnya, tanpa menambahkan pengulangan preposisi yang tidak eksplisit.
- issue: Penerjemahan σάρξ
  choice: daging
  alternative: tubuh
  rationale: Dalam konteks ini σάρξ menunjuk pada kemanusiaan jasmani Yesus. 'Daging' lebih transparan terhadap istilah sumber dan tidak memasukkan penafsiran tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan ini merupakan kelanjutan kalimat dari ayat sebelumnya; kapitalisasi 'Ia' dan akhiran hormat '-Nya' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
