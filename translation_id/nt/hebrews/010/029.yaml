id: HEB.10.29
reference: Hebrews 10:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας, καὶ τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος ἐν ᾧ ἡγιάσθη, καὶ τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/029.yaml
  text: How much worse punishment do you think will be deserved by the one who has trampled underfoot the Son of God[a], and has regarded the blood of the covenant by which he was sanctified as common[c][b], and has insulted the Spirit of grace?
translation:
  language: id
  text: Menurut kalian, betapa jauh lebih berat hukuman yang pantas diterima oleh orang yang telah menginjak-injak Anak Allah, menganggap darah perjanjian—yang olehnya ia dikuduskan[b]—sebagai sesuatu yang biasa[a], dan menghina[c] Roh anugerah?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai sesuatu yang najis” atau “tidak kudus.”
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Yunani, klausa “yang olehnya ia dikuduskan” secara sintaksis terkait dengan orang yang melakukan pelanggaran itu; sebagian penafsir memahami rujukannya secara berbeda. Terjemahan ini mempertahankan ketegangan tersebut tanpa memutuskan perdebatan teologisnya.
    reason: alternative_reading
  - marker: c
    text: Atau “memperlakukan dengan penghinaan yang keji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ ... χείρονος
  choice: betapa jauh lebih berat
  rationale: Mengungkapkan perbandingan retoris dengan hukuman pada konteks sebelumnya secara wajar dan tegas dalam bahasa Indonesia.
- source_word: ἀξιωθήσεται τιμωρίας
  choice: hukuman yang pantas diterima
  rationale: Menyampaikan gagasan yudisial ‘dianggap layak menerima hukuman’ tanpa menghasilkan susunan pasif yang kaku.
- source_word: καταπατήσας
  choice: telah menginjak-injak
  rationale: Mempertahankan metafora kuat tentang tindakan merendahkan dan menghina.
- source_word: υἱὸν τοῦ θεοῦ
  choice: Anak Allah
  rationale: Padanan baku dan tepat bagi gelar kristologis ini.
- source_word: αἷμα τῆς διαθήκης
  choice: darah perjanjian
  rationale: Mempertahankan ungkapan perjanjian dan gema pengorbanannya.
- source_word: κοινὸν ἡγησάμενος
  choice: menganggap ... sebagai sesuatu yang biasa
  rationale: Koinon pada dasarnya berarti ‘biasa’ sebagai lawan dari kudus atau dikhususkan; pilihan ini mempertahankan kontras tersebut tanpa langsung mempersempitnya menjadi ‘najis’.
- source_word: ἐν ᾧ ἡγιάσθη
  choice: yang olehnya ia dikuduskan
  rationale: Membaca ἐν ᾧ secara instrumental dan mempertahankan bentuk pasif serta hubungan sintaksis klausa Yunani.
- source_word: ἐνυβρίσας
  choice: menghina
  rationale: Menyampaikan perlakuan menghina dan penuh kesombongan dengan kata yang jelas bagi pembaca modern.
- source_word: πνεῦμα τῆς χάριτος
  choice: Roh anugerah
  rationale: Mempertahankan konstruksi genitif dan istilah ‘anugerah’ yang lazim serta bermartabat.
theological_decisions:
- issue: Rujukan ‘ia’ dalam ‘yang olehnya ia dikuduskan’ (ἐν ᾧ ἡγιάσθη)
  choice: Klausa diterjemahkan secara langsung dengan ‘ia’, yang secara sintaksis merujuk kepada orang yang sedang digambarkan.
  alternative: Menafsirkan yang dikuduskan sebagai Kristus, darah itu sendiri, atau komunitas perjanjian.
  rationale: Subjek tunggal yang digambarkan oleh rangkaian partisip merupakan rujukan gramatikal terdekat. Terjemahan tidak menyelesaikan perdebatan teologis tentang kemurtadan dan ketekunan di luar apa yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan retoris. Susunan paralel tiga tindakan dipertahankan, sementara tanda pisah membantu pembaca mengenali klausa relatif tanpa kehilangan rujukannya.
