source:
  edition: SBLGNT
  text: ἀνώτερον λέγων ὅτι ⸂Θυσίας καὶ προσφορὰς⸃ καὶ ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ ἠθέλησας οὐδὲ εὐδόκησας, αἵτινες κατὰ ⸀νόμον προσφέρονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/008.yaml
  text: After saying above[a], “Sacrifices and offerings and whole burnt offerings and sin offerings you did not desire[c][b], nor did you delight in”—which are offered according to the law—
translation:
  language: id
  text: Setelah sebelumnya berkata, “Kurban dan persembahan, kurban bakaran seluruhnya[a], dan kurban penghapus dosa[b] tidak Engkau kehendaki dan tidak Engkau sukai”—yang semuanya dipersembahkan menurut hukum Taurat[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kurban bakaran.” Istilah Yunani menunjuk pada kurban yang seluruhnya dibakar di atas mazbah.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “persembahan karena dosa.”'
    reason: lexical_alternative
  - marker: c
    text: Yang dimaksud ialah hukum Musa.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνώτερον λέγων
  choice: Setelah sebelumnya berkata
  rationale: Mengacu kembali pada bagian kutipan yang baru saja disebutkan sebelumnya dan secara alami menghubungkannya dengan kelanjutan argumen.
- source_word: Θυσίας καὶ προσφορὰς
  choice: Kurban dan persembahan
  rationale: Mempertahankan dua istilah kultis yang berbeda tanpa membuat pembedaan yang lebih khusus daripada yang dinyatakan teks.
- source_word: ὁλοκαυτώματα
  choice: kurban bakaran seluruhnya
  rationale: Menunjukkan bahwa persembahan ini dibakar habis, sesuai dengan makna istilah Yunani.
- source_word: περὶ ἁμαρτίας
  choice: kurban penghapus dosa
  rationale: Dalam konteks persembahan, frasa ini berfungsi sebagai sebutan bagi kategori kurban yang berkaitan dengan dosa; catatan kaki mempertahankan alternatif yang lebih harfiah.
- source_word: οὐκ ἠθέλησας οὐδὲ εὐδόκησας
  choice: tidak Engkau kehendaki dan tidak Engkau sukai
  rationale: Membedakan nuansa kedua verba sambil mempertahankan paralelisme dan sapaan langsung kepada Allah.
- source_word: αἵτινες κατὰ νόμον προσφέρονται
  choice: semuanya itu dipersembahkan menurut hukum Taurat
  rationale: Rujukan jamak kepada seluruh daftar dibuat eksplisit demi kejelasan; 'hukum Taurat' menyampaikan νόμος dalam konteks hukum Musa tanpa menambahkan tafsir pada klausa kutipan.
theological_decisions:
- issue: Sikap Allah terhadap kurban yang diperintahkan hukum Taurat
  choice: Menerjemahkan secara langsung 'tidak Engkau kehendaki dan tidak Engkau sukai', lalu mempertahankan penjelasan bahwa kurban itu dipersembahkan menurut hukum Taurat.
  alternative: Melunakkan menjadi 'bukan terutama yang Engkau kehendaki' atau menjelaskan bahwa Allah hanya menolak kurban tertentu.
  rationale: Teks memuat ketegangan antara pernyataan negatif dalam kutipan dan fakta bahwa kurban-kurban itu dipersembahkan menurut hukum. Terjemahan tidak boleh menyelesaikan ketegangan tersebut dengan tambahan penafsiran.
- issue: Status περὶ ἁμαρτίας sebagai kategori kurban
  choice: kurban penghapus dosa
  alternative: persembahan karena dosa
  rationale: Pilihan utama menyampaikan fungsi teknis kultisnya, sedangkan alternatif yang lebih harfiah dicatat agar rentang makna frasa tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. 'Kurban' dipakai untuk konteks kultis, 'Engkau' mempertahankan sapaan langsung dalam kutipan, dan tanda pisah akhir dibiarkan terbuka karena sintaksis ayat berlanjut ke ayat berikutnya.
