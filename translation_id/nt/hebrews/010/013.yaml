translation:
  language: id
  text: Sejak saat itu, Ia menantikan[a] sampai musuh-musuh-Nya dijadikan tumpuan kaki-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menunggu dengan penuh harap.” Kata Yunani ini dapat mengandung nuansa penantian yang disertai pengharapan.
    reason: lexical_alternative
  - marker: b
    text: 'Ungkapan ini menggemakan Mazmur 110:1: “Duduklah di sebelah kanan-Ku sampai Aku menjadikan musuh-musuhmu tumpuan kakimu.”'
    reason: cross_reference
lexical_decisions:
- source_word: τὸ λοιπὸν
  choice: Sejak saat itu
  rationale: Frasa netral berartikel ini berfungsi secara adverbial dan menunjuk pada masa sesudah Kristus duduk di sebelah kanan Allah dalam konteks sebelumnya.
- source_word: ἐκδεχόμενος
  choice: menantikan
  rationale: Partisip ini menyatakan sikap yang terus berlangsung dengan unsur penantian penuh harap; 'menantikan' alami dalam bahasa Indonesia dan tidak menyiratkan ketidakpastian.
- source_word: ἕως
  choice: sampai
  rationale: Konjungsi temporal ini menandai batas atau titik akhir penantian.
- source_word: τεθῶσιν
  choice: dijadikan
  rationale: Bentuk pasif aoris subjunktif dari τίθημι dipertahankan secara alami dalam konstruksi sesudah 'sampai' dan cocok dengan pelengkap 'tumpuan kaki'.
- source_word: οἱ ἐχθροὶ αὐτοῦ
  choice: musuh-musuh-Nya
  rationale: Menyampaikan bentuk jamak dan kepunyaan secara ringkas serta alami; huruf kapital pada pronomina mengikuti register Alkitab Indonesia untuk rujukan kepada Kristus.
- source_word: ὑποπόδιον τῶν ποδῶν αὐτοῦ
  choice: tumpuan kaki-Nya
  rationale: Ungkapan ini mempertahankan citra konkret Mazmur 110:1 dalam bentuk yang wajar dan dikenal dalam bahasa Indonesia.
theological_decisions:
- issue: Citra penobatan Mesianik dari Mazmur 110:1
  choice: Mempertahankan gambaran bahwa musuh-musuh dijadikan 'tumpuan kaki-Nya'.
  alternative: Menerjemahkannya secara tafsiran sebagai 'dikalahkan' atau 'ditaklukkan di bawah kaki-Nya'.
  rationale: Citra konkret tersebut sengaja menggemakan Mazmur 110:1 dan membawa bobot kristologis dalam Surat Ibrani; parafrasa abstrak akan menghilangkan hubungan antarteks.
- issue: Pelaku yang menjadikan para musuh tumpuan kaki
  choice: Mempertahankan bentuk pasif 'dijadikan' tanpa menyebut pelaku.
  alternative: Menambahkan 'Allah menjadikan' berdasarkan konteks Mazmur 110:1.
  rationale: Teks Yunani ayat ini berbentuk pasif dan tidak menyebut pelaku secara eksplisit; terjemahan tidak perlu menyelesaikan apa yang dibiarkan tersirat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Susunan kalimat mengikuti konteks ayat sebelumnya; citra 'tumpuan kaki' dan bentuk pasif sumber dipertahankan. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
