  text: μιᾷ γὰρ προσφορᾷ τετελείωκεν εἰς τὸ διηνεκὲς τοὺς ἁγιαζομένους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/014.yaml
  text: For by one offering he has perfected for all time those who are being sanctified[a].
translation:
  language: id
  text: Sebab, melalui satu persembahan saja, Ia telah menyempurnakan untuk selama-lamanya mereka yang sedang dikuduskan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka yang sedang dijadikan kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μιᾷ
  choice: satu ... saja
  rationale: Bentuk ini menerangkan προσφορᾷ dan menekankan bahwa persembahan tersebut hanya satu; partikel 'saja' membuat penekanan itu alami dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai alasan atau penjelasan yang menghubungkan ayat ini dengan argumen sebelumnya.
- source_word: προσφορᾷ
  choice: persembahan
  rationale: Istilah ini menunjuk pada sesuatu yang dipersembahkan kepada Allah dan tetap cukup luas untuk mencerminkan προσφορά, sementara konteks Ibrani memperjelas sifat pengorbanannya.
- source_word: τετελείωκεν
  choice: telah menyempurnakan
  rationale: Bentuk perfek menyatakan tindakan yang telah selesai dengan hasil yang tetap berlaku; 'telah menyempurnakan' mempertahankan daya verbal dan kaitannya dengan tema kesempurnaan dalam Ibrani.
- source_word: εἰς τὸ διηνεκές
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlakuan hasil yang terus bertahan, bukan tindakan yang terus diulang.
- source_word: τοὺς ἁγιαζομένους
  choice: mereka yang sedang dikuduskan
  rationale: Partisipel kini pasif dipertahankan sebagai proses yang sedang berlangsung; 'dikuduskan' juga menjaga hubungan leksikal dengan bahasa kekudusan dalam konteks.
theological_decisions:
- issue: Hubungan antara penyempurnaan yang telah selesai dan pengudusan yang sedang berlangsung
  choice: 'Mempertahankan kedua dimensi: ''telah menyempurnakan'' dan ''sedang dikuduskan''.'
  alternative: Menafsirkannya hanya sebagai kedudukan yang sudah tuntas, atau hanya sebagai proses yang mengaburkan hasil tuntas dari persembahan itu.
  rationale: Bahasa Yunani secara sengaja menyandingkan verba perfek τετελείωκεν dengan partisipel kini pasif ἁγιαζομένους. Terjemahan tidak menyelaraskan ketegangan ini ke dalam satu sistem teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' memakai huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Kristus. Susunan 'melalui satu persembahan saja' alami sekaligus mempertahankan sarana dalam datif Yunani dan penekanan pada satu persembahan.
