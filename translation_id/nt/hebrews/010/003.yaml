  text: ἀλλ’ ἐν αὐταῖς ἀνάμνησις ἁμαρτιῶν κατ’ ἐνιαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/003.yaml
  text: But in these sacrifices there is a reminder of sins year after year,[a]
translation:
  language: id
  text: Namun, di dalam kurban-kurban itu ada pengingatan akan dosa-dosa tahun demi tahun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap tahun.”
    reason: Alternatif leksikal untuk κατ’ ἐνιαυτόν yang menyatakan pengulangan tahunan.
lexical_decisions:
- source_word: ἀλλ’
  choice: Namun
  rationale: Kata penghubung adversatif ini mengontraskan ayat ini dengan pernyataan sebelumnya bahwa kurban-kurban tersebut tidak dapat menyempurnakan orang yang beribadah.
- source_word: ἐν αὐταῖς
  choice: melalui kurban-kurban itu
  rationale: Kata ganti feminin jamak ini merujuk pada kurban-kurban dalam konteks sebelumnya. 'Melalui' menyampaikan bahwa kurban-kurban itu menjadi sarana terjadinya pengingatan, sedangkan penyebutan 'kurban-kurban' memperjelas acuannya.
- source_word: ἀνάμνησις
  choice: diingatkan kembali
  rationale: Nomina ini menunjuk pada tindakan membawa sesuatu kembali ke dalam ingatan. Bentuk verbal pasif menghasilkan bahasa Indonesia yang alami sambil mempertahankan gagasan pengingatan.
- source_word: ἁμαρτιῶν
  choice: dosa-dosa
  rationale: Bentuk jamak genitif menyatakan hal yang diingat kembali; terjemahan ini mempertahankan bentuk jamak dan hubungan maknanya secara alami.
- source_word: κατ’ ἐνιαυτόν
  choice: tahun demi tahun
  rationale: Ungkapan waktu ini menyatakan pengulangan setiap tahun. 'Tahun demi tahun' menonjolkan keberulangan yang penting bagi argumen surat Ibrani.
theological_decisions:
- issue: Acuan αὐταῖς
  choice: Kata ganti diperjelas sebagai 'kurban-kurban itu'.
  alternative: Menerjemahkannya secara pronominal sebagai 'di dalamnya' atau 'melaluinya'.
  rationale: Konteks langsung membahas kurban-kurban yang dipersembahkan terus-menerus. Memperjelas acuannya membantu pembaca tanpa menambahkan unsur teologis baru.
- issue: Hubungan ἐν αὐταῖς dengan ἀνάμνησις
  choice: Diterjemahkan 'melalui kurban-kurban itu' sebagai sarana atau konteks pengingatan dosa.
  alternative: Terjemahan lebih harfiah 'di dalam kurban-kurban itu'.
  rationale: Preposisi ἐν dapat memiliki nuansa instrumental atau lokatif. 'Melalui' alami dalam bahasa Indonesia dan sesuai konteks, tetapi tidak menetapkan siapa yang mengingat atau membatasi pengingatan itu pada satu pelaku tertentu.
- issue: Daya ungkap κατ’ ἐνιαυτόν
  choice: Diterjemahkan 'tahun demi tahun'.
  alternative: '''Setiap tahun''.'
  rationale: Keduanya menyatakan kejadian tahunan, tetapi 'tahun demi tahun' lebih jelas menampilkan pengulangan berkelanjutan yang menjadi bagian penting dari argumen penulis.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. 'Kurban' dipilih untuk persembahan ritual; struktur pasif menghindari penetapan pelaku pengingatan yang tidak dinyatakan secara eksplisit dalam teks Yunani.
