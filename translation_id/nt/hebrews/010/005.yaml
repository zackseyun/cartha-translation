  source_fidelity: 'Teks utama dengan tepat menerjemahkan unsur-unsur penting Yunani: διὸ sebagai “Karena itu,” εἰσερχόμενος εἰς τὸν κόσμον sebagai “ketika Ia masuk ke dalam dunia,” λέγει dalam kala kini, serta kontras antara kurban/persembahan dan tubuh yang disediakan. “Telah menyediakan” dapat menyampaikan aoris κατηρτίσω secara wajar dalam bingkai kutipan.'
  naturalness: Bahasa Indonesia baku, jelas, dan bernada sesuai untuk kutipan Kitab Suci. Penggunaan “Kurban dan persembahan,” “tidak Engkau kehendaki,” dan “bagi-Ku” alami dalam register ini.
  terminology: “Kurban,” “persembahan,” dan “tubuh” mempertahankan pembedaan serta kekonkretan istilah sumber. Kapitalisasi kata ganti ilahi konsisten dengan konvensi edisi. Namun, catatan kaki keliru menyebut “Ibrani” sebagai pihak yang mengikuti bunyi Yunani; yang dimaksud ialah Surat Ibrani.
  issues:
