  text: διὸ εἰσερχόμενος εἰς τὸν κόσμον λέγει· Θυσίαν καὶ προσφορὰν οὐκ ἠθέλησας, σῶμα δὲ κατηρτίσω μοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/005.yaml
  text: 'Therefore[a], when he comes into the world, he says: “Sacrifice and offering you did not desire, but a body you prepared for me.”'
translation:
  language: id
  text: Karena itu, ketika Ia masuk ke dalam dunia, Ia berkata, “Kurban dan persembahan tidak Engkau kehendaki, tetapi Engkau telah menyediakan tubuh bagi-Ku.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Surat Ibrani di sini mengikuti bunyi Yunani Mazmur 40:6: “Engkau telah menyediakan tubuh bagi-Ku.” Teks Ibrani Mazmur 40:6 berbunyi, “Engkau telah membuka telinga bagiku.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: εἰσερχόμενος εἰς τὸν κόσμον
  choice: ketika Ia masuk ke dalam dunia
  rationale: Menyampaikan nilai temporal partisipel kini tanpa menentukan waktu lebih jauh daripada bingkai kutipan; 'masuk ke dalam dunia' mempertahankan ungkapan sumber.
- source_word: λέγει
  choice: Ia berkata
  rationale: Mempertahankan kala kini yang lazim dipakai untuk memperkenalkan perkataan Kitab Suci.
- source_word: Θυσίαν καὶ προσφορὰν
  choice: Kurban dan persembahan
  rationale: Mempertahankan dua istilah kultis yang berbeda; 'kurban' dan 'persembahan' jelas serta wajar bagi pembaca Indonesia.
- source_word: οὐκ ἠθέλησας
  choice: tidak Engkau kehendaki
  rationale: Mengungkapkan kehendak atau keinginan dalam ragam yang bermartabat dan sesuai dengan konteks ibadah.
- source_word: σῶμα
  choice: tubuh
  rationale: Menerjemahkan nomina konkret ini secara langsung tanpa menambahkan penafsiran.
- source_word: δὲ
  choice: tetapi
  rationale: Menjaga pertentangan antara kurban dan persembahan yang tidak dikehendaki dengan tubuh yang disediakan.
- source_word: κατηρτίσω
  choice: Engkau telah menyediakan
  rationale: Kata kerja ini berarti menyiapkan atau menjadikan siap; bentuk 'telah menyediakan' alami dalam bahasa Indonesia dan menyampaikan tindakan yang sudah dilakukan.
- source_word: μοι
  choice: bagi-Ku
  rationale: 'Menyampaikan datif kepentingan: tubuh itu disediakan bagi sang pembicara.'
theological_decisions:
- issue: Bunyi kutipan Mazmur 40:6 dalam Ibrani berbeda dari teks Ibrani Mazmur.
  choice: 'Menerjemahkan teks Yunani Ibrani secara langsung: ''Engkau telah menyediakan tubuh bagi-Ku.'''
  alternative: '''Engkau telah membuka telinga bagiku,'' mengikuti teks Ibrani Mazmur 40:6.'
  rationale: Ayat yang diterjemahkan secara eksplisit memakai σῶμα, 'tubuh'. Perbedaan dengan teks Ibrani Mazmur tidak diselaraskan, melainkan dijelaskan dalam catatan agar ketegangan tekstual tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti untuk pribadi ilahi ditulis dengan huruf kapital. 'Kurban' dipilih sesuai ejaan baku dan dibedakan dari 'persembahan'.
