  to: Karena itu, ketika Ia masuk ke dalam dunia, Ia berkata, “Kurban dan persembahan tidak Engkau kehendaki, tetapi Engkau telah menyediakan tubuh bagi-Ku.”[a]
  rationale: Teks ayat tidak perlu diubah karena sudah setia pada teks Yunani dan alami dalam bahasa Indonesia modern. Catatan kaki direvisi untuk membetulkan subjek yang mengikuti bentuk Yunani—yakni Surat Ibrani, bukan bahasa Ibrani—dan untuk menyajikan perbedaan teks Mazmur secara lebih akurat tanpa menyelaraskannya.
