  text: ὑπομονῆς γὰρ ἔχετε χρείαν ἵνα τὸ θέλημα τοῦ θεοῦ ποιήσαντες κομίσησθε τὴν ἐπαγγελίαν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/036.yaml
  text: For you have need of endurance[a], so that after doing the will of God you may receive the promise.
translation:
  language: id
  text: Sebab kamu memerlukan ketekunan agar setelah melakukan kehendak Allah, kamu menerima janji itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menerima apa yang dijanjikan.”
    reason: Frasa Yunani τὴν ἐπαγγελίαν secara harfiah berarti “janji itu,” tetapi dalam konteks dengan “menerima” dapat menunjuk pada apa yang dijanjikan atau pemenuhannya.
lexical_decisions:
- source_word: ὑπομονῆς
  choice: ketekunan
  rationale: Kata ὑπομονή menunjuk pada keteguhan untuk tetap bertahan di bawah tekanan. “Ketekunan” alami dalam bahasa Indonesia modern dan mencakup daya tahan yang setia tanpa menambahkan tafsiran khusus.
- source_word: χρείαν ἔχετε
  choice: kamu memerlukan
  rationale: Ungkapan χρείαν ἔχειν berarti “memerlukan.” Bentuk ini jelas, alami, dan tetap mempertahankan penekanan bahwa ketekunan benar-benar dibutuhkan.
- source_word: ἵνα
  choice: agar
  rationale: Kata ἵνα memperkenalkan tujuan atau hasil yang dimaksud. “Agar” menyatakannya secara ringkas dan wajar.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: kehendak Allah
  rationale: Terjemahan langsung dan lazim bagi konstruksi genitif ini, dengan bobot religius yang tetap terjaga.
- source_word: ποιήσαντες
  choice: setelah melakukan
  rationale: Partisip aoris ini paling wajar dipahami sebagai tindakan yang mendahului penerimaan. “Setelah melakukan” membuat hubungan waktunya jelas tanpa mengembangkan maknanya.
- source_word: κομίσησθε
  choice: kamu menerima
  rationale: Dalam konteks ini κομίζω berarti menerima atau memperoleh sesuatu yang dijanjikan. “Menerima” merupakan padanan yang paling jelas dan alami.
- source_word: τὴν ἐπαγγελίαν
  choice: apa yang dijanjikan
  rationale: Bersama κομίσησθε, frasa ini secara idiomatis dapat menunjuk pada hal atau berkat yang dijanjikan, bukan tindakan menerima sebuah pernyataan janji. Terjemahan utama dibuat alami, sementara bentuk yang lebih harfiah dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Apakah ἐπαγγελίαν menunjuk pada janji itu sendiri atau pada hal yang dijanjikan
  choice: apa yang dijanjikan
  alternative: janji itu
  rationale: Secara leksikal ἐπαγγελία dapat berarti “janji,” tetapi sebagai objek κομίσησθε dalam konteks ini dapat secara metonimis berarti pemenuhan atau hal yang dijanjikan. Teks utama memakai ungkapan Indonesia yang lebih alami, sedangkan ambiguitas sumber dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan hubungan sebab, tujuan, dan urutan tindakan dalam bahasa Yunani tanpa terdengar kaku.
