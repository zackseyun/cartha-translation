  text: ἀθετήσας τις νόμον Μωϋσέως χωρὶς οἰκτιρμῶν ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/028.yaml
  text: Anyone who has set aside the law of Moses dies without mercy on the testimony of two or three witnesses[a].
translation:
  language: id
  text: Siapa pun yang menolak hukum Musa mati tanpa belas kasihan berdasarkan kesaksian dua atau tiga orang saksi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dihukum mati.” Secara harfiah, bahasa Yunaninya mengatakan “mati”, tetapi konteksnya adalah pelaksanaan hukuman mati berdasarkan hukum Musa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετήσας
  choice: menolak
  rationale: Partisip aoris ἀθετέω menyatakan penolakan atau pengesampingan terhadap sesuatu yang berwenang. “Menolak” alami dalam bahasa Indonesia dan mempertahankan gagasan penyangkalan terhadap kewibawaan hukum tanpa mempersempitnya menjadi pelanggaran tertentu.
- source_word: τις
  choice: Siapa pun
  rationale: Pronomina tak tentu ini dipakai secara umum. “Siapa pun” menyampaikan daya generiknya dengan jelas dan wajar.
- source_word: νόμον Μωϋσέως
  choice: hukum Musa
  rationale: Konstruksi genitif ini secara langsung dan idiomatis diterjemahkan sebagai “hukum Musa”.
- source_word: χωρὶς οἰκτιρμῶν
  choice: tanpa belas kasihan
  rationale: Bentuk jamak Yunani berfungsi secara idiomatis; “tanpa belas kasihan” merupakan ungkapan Indonesia yang alami dan sesuai dengan konteks penghakiman.
- source_word: ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν
  choice: berdasarkan kesaksian dua atau tiga orang saksi
  rationale: ἐπί dengan datif menunjukkan dasar keputusan hukum. Penambahan “kesaksian” membuat hubungan yudisial yang tersirat menjadi jelas tanpa menambah isi asing.
- source_word: ἀποθνῄσκει
  choice: mati
  rationale: Indikatif kini menyatakan akibat hukum secara umum. “Mati” mengikuti verba Yunani secara dekat dan membiarkan konteks hukum menyiratkan pelaksanaan hukuman mati.
theological_decisions:
- issue: Apakah nuansa eksekusi yudisial dalam ἀποθνῄσκει perlu dinyatakan secara eksplisit
  choice: Memakai “mati” dalam teks utama
  alternative: “dihukum mati”
  rationale: Latar hukum Musa menunjukkan hukuman mati, tetapi verba Yunani sendiri secara harfiah berarti “mati,” bukan bentuk kausatif eksplisit. Teks utama mempertahankan batas ungkapan sumber, sedangkan catatan menjelaskan alternatif kontekstual.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan bentuk pernyataan hukum yang umum serta nuansa yudisialnya tanpa memakai istilah teknis yang tidak perlu.
