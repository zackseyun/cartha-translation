  text: φοβερὸν τὸ ἐμπεσεῖν εἰς χεῖρας θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/031.yaml
  text: It is a fearful thing to fall into the hands of the living God[a].
translation:
  language: id
  text: Betapa mengerikannya jatuh ke dalam tangan Allah yang hidup.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sungguh menakutkan jatuh ke dalam tangan Allah yang hidup.”'
    reason: Alternatif leksikal untuk φοβερὸν; bentuk ini lebih langsung menyatakan rasa takut, sedangkan teks utama memakai ungkapan seruan yang lebih kuat dan alami.
lexical_decisions:
- source_word: φοβερὸν
  choice: betapa mengerikannya
  rationale: Kata ini menyatakan sesuatu yang menimbulkan rasa takut atau gentar. Bentuk seruan ini alami dalam bahasa Indonesia dan mempertahankan bobot peringatan Yunani tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: τὸ ἐμπεσεῖν
  choice: jatuh
  rationale: Infinitif berartikel berfungsi sebagai pokok pernyataan; bersama εἰς, ungkapan ini secara alami diterjemahkan 'jatuh ke dalam' dan mempertahankan kesan masuk ke bawah kuasa pihak lain.
- source_word: εἰς χεῖρας
  choice: ke dalam tangan
  rationale: Ungkapan ini menggambarkan masuk ke bawah kuasa atau penghakiman seseorang. Citra 'tangan' dipertahankan demi kesetiaan pada bahasa dan gema biblisnya.
- source_word: θεοῦ
  choice: Allah
  rationale: Genitif ini bergantung pada 'tangan' dan secara langsung berarti 'tangan Allah'.
- source_word: ζῶντος
  choice: yang hidup
  rationale: Partisipel ini menerangkan Allah dan membentuk ungkapan biblis 'Allah yang hidup', yang menekankan kehadiran-Nya yang nyata dan aktif.
theological_decisions:
- issue: Daya pernyataan peringatan
  choice: Pernyataan umum dan khidmat tentang kedahsyatan berada di bawah kuasa penghakiman Allah yang hidup
  alternative: Pernyataan yang hanya merujuk pada disiplin sementara, atau pernyataan eksistensial tanpa konotasi penghakiman
  rationale: Konteksnya menutup bagian peringatan, dan ungkapan 'jatuh ke dalam tangan' memiliki daya yudisial. Terjemahan mempertahankan ketegangan itu tanpa memasukkan kata 'penghakiman', yang tidak hadir secara eksplisit dalam bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Susunan 'Betapa mengerikannya' dipilih untuk menyampaikan predikat φοβερὸν secara idiomatis, sementara citra 'jatuh ke dalam tangan' dipertahankan.
