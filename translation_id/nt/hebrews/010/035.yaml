  text: μὴ ἀποβάλητε οὖν τὴν παρρησίαν ὑμῶν, ἥτις ἔχει ⸂μεγάλην μισθαποδοσίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/035.yaml
  text: Therefore[a], do not throw away your boldness, which has a great reward,
translation:
  language: id
  text: Karena itu, janganlah membuang keberanianmu[a], yang memiliki upah besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keberanian yang penuh keyakinan.” Kata Yunani ini dapat menunjuk pada kebebasan atau keterbukaan yang penuh keyakinan, khususnya ketika menghadap Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀποβάλητε
  choice: janganlah membuang
  rationale: Larangan dengan μή dan subjungtif aoris menyatakan tindakan yang harus dihindari. “Membuang” mempertahankan gambaran tindakan sengaja melepaskan sesuatu, bukan sekadar kehilangan.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan atau dorongan yang bertolak dari uraian sebelumnya; “Karena itu” alami dan jelas dalam bahasa Indonesia baku.
- source_word: τὴν παρρησίαν ὑμῶν
  choice: keberanianmu
  rationale: παρρησία dapat menunjuk pada kebebasan yang penuh keyakinan, keterusterangan, atau keberanian, khususnya dalam menghadap Allah. “Keberanian” mempertahankan daya dorong nasihat dalam konteks ketekunan iman; sufiks -mu mewakili bentuk jamak ὑμῶν secara wajar dalam bahasa Indonesia.
- source_word: ἥτις ἔχει
  choice: yang mendatangkan
  rationale: Secara harfiah berarti “yang mempunyai,” tetapi dalam hubungan dengan μισθαποδοσίαν, “yang mendatangkan” menyampaikan relasi idiomatis dalam bahasa Indonesia tanpa menetapkan secara berlebihan cara upah itu diberikan.
- source_word: μεγάλην μισθαποδοσίαν
  choice: upah besar
  rationale: μισθαποδοσία berarti balasan atau upah. Dalam konteks positif dan eskatologis ini, “upah besar” jelas, ringkas, dan tidak menambahkan rincian yang tidak dinyatakan teks.
theological_decisions:
- issue: Makna παρρησία dalam Ibrani 10:35
  choice: keberanian
  alternative: keyakinan; kebebasan penuh keyakinan
  rationale: Istilah ini dalam Ibrani mencakup kebebasan dan keyakinan untuk menghadap Allah serta keberanian untuk tetap terbuka dalam iman. “Keberanian” menjaga kekuatan nasihat tanpa membatasinya hanya pada perasaan yakin di dalam batin.
- issue: Hubungan παρρησία dengan μισθαποδοσία
  choice: yang mendatangkan upah besar
  alternative: yang mempunyai upah besar
  rationale: Terjemahan ini mempertahankan kaitan positif antara keberanian yang tekun dan upah, tetapi tidak menjelaskan mekanisme atau dasar teologis pemberian upah melampaui yang dinyatakan ayat.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bernada nasihat yang khidmat. Bentuk “janganlah” mempertahankan ketegasan larangan, sedangkan “membuang” menjaga metafora tindakan sengaja. Penanda catatan kaki [a] ditempatkan langsung setelah istilah yang dijelaskan.
