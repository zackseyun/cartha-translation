  text: For it is impossible for the blood of bulls and goats to take away sins[a].
translation:
  language: id
  text: Sebab darah lembu jantan dan kambing jantan tidak mungkin menghapus dosa-dosa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyingkirkan dosa-dosa.” Kata kerja Yunani dapat berarti menghapus atau menyingkirkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδύνατον
  choice: tidak mungkin
  rationale: Adjektiva predikatif ini berkaitan dengan infinitif ἀφαιρεῖν. Susunan “tidak mungkin menghapus” alami dalam bahasa Indonesia dan mempertahankan daya mutlak pernyataan tersebut.
- source_word: γὰρ
  choice: sebab
  rationale: Partikel ini memberikan dasar penjelasan bagi argumen sebelumnya; “sebab” mempertahankan hubungan logis itu secara ringkas dan wajar.
- source_word: αἷμα
  choice: darah
  rationale: Istilah harfiah untuk darah korban merupakan unsur utama argumen Surat Ibrani dan tidak diparafrasakan sebagai “korban” atau “kematian”.
- source_word: ταύρων
  choice: lembu jantan
  rationale: Bentuk genitif jamak ini bergantung pada αἷμα. “Darah lembu jantan” tepat dan jelas dalam konteks korban.
- source_word: τράγων
  choice: kambing jantan
  rationale: τράγος secara khusus menunjuk pada kambing jantan. Bahasa Indonesia dapat mempertahankan ketepatan ini dengan alami dalam konteks persembahan korban.
- source_word: ἀφαιρεῖν
  choice: menghapus
  rationale: Infinitif ini menyatakan tindakan yang tidak dapat dilakukan oleh darah hewan. “Menghapus” menyampaikan peniadaan dosa secara alami, sedangkan alternatif “menyingkirkan” mempertahankan gambaran tindakan mengambil atau membuang.
- source_word: ἁμαρτίας
  choice: dosa-dosa
  rationale: Bentuk akusatif jamak dipertahankan untuk merujuk pada dosa-dosa, bukan diratakan menjadi konsep abstrak tunggal.
theological_decisions:
- issue: Daya guna korban hewan dalam Surat Ibrani
  choice: Ayat menyatakan bahwa darah hewan tidak mungkin menghapus dosa-dosa, tanpa menambahkan penjelasan doktrinal tentang jenis atau tingkat daya guna korban tersebut.
  alternative: Menjelaskan bahwa korban hanya menutupi dosa untuk sementara atau memberikan pentahiran ritual tanpa penghapusan akhir.
  rationale: Teks utama tetap dekat dengan bahasa Yunani dan membiarkan konteks Surat Ibrani menerangkan kontras antara korban hewan yang berulang dan persembahan Mesias, sehingga ketegangan teologis tidak diselesaikan secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Lembu jantan” dan “kambing jantan” mempertahankan ketepatan istilah hewan korban; susunan kalimat tetap mudah dipahami pembaca umum.
