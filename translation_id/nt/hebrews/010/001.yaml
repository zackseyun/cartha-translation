review_pass:
  verdict: revise
  source_fidelity: 'Draf pada umumnya mencerminkan teks Yunani dengan baik: kontras σκιά/εἰκών, pengulangan kurban tahunan yang berkelanjutan, ketidakmampuan mutlak, dan τελειῶσαι dipertahankan. Namun, “Karena itu” menambahkan hubungan inferensial yang tidak dinyatakan oleh γάρ, dan “kepada Allah” menjadikan eksplisit objek yang hanya tersirat secara kontekstual dalam τοὺς προσερχομένους.'
  naturalness: Bahasa draf baku dan mudah dipahami. Revisi menghapus penghubung tambahan dan memakai susunan yang lebih langsung, sambil mempertahankan gaya khidmat yang wajar.
  terminology: “Hukum Taurat,” “bayangan,” “kurban-kurban,” dan “menyempurnakan” sesuai konteks dan konsisten dengan istilah penting Ibrani. “Gambaran itu sendiri” lebih dekat dengan εἰκών αὐτήν daripada “wujud sejati,” tanpa menghilangkan kontras dengan “bayangan.”
  issues:
  - severity: medium
    issue: “Karena itu” ditambahkan pada awal kalimat kedua.
    rationale: Teks Yunani memiliki satu kalimat dengan γάρ (“sebab/karena”), bukan simpulan inferensial “karena itu.” Pemenggalan kalimat boleh dilakukan demi kelancaran, tetapi penghubung tambahan ini mengubah hubungan wacana.
  - severity: low
    issue: “kepada Allah” ditambahkan dalam teks utama.
    rationale: προσερχομένους dalam konteks Ibrani memang bernuansa menghampiri Allah dalam ibadah, tetapi objek itu tidak tertulis dalam ayat ini. Nuansa tersebut sebaiknya dijelaskan dalam catatan kaki, bukan dijadikan tambahan pada teks utama.
  - severity: low
    issue: “wujud sejati” agak lebih interpretatif daripada εἰκών.
    rationale: εἰκών secara dasar berarti “gambar/gambaran”; αὐτήν memberi penegasan “itu sendiri.” “Gambaran itu sendiri” mempertahankan metafora dan ambiguitas leksikal sumber dengan lebih dekat.
