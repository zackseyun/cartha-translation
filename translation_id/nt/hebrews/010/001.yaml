revisions:
- from: Sebab hukum Taurat hanya memiliki bayangan dari hal-hal baik yang akan datang, bukan wujud sejati dari kenyataan-kenyataan itu.[a] Karena itu, melalui kurban-kurban yang sama yang terus-menerus mereka persembahkan tahun demi tahun, hukum Taurat tidak pernah dapat menyempurnakan orang-orang yang datang mendekat kepada Allah.[b]
  to: Sebab hukum Taurat hanya memiliki bayangan tentang hal-hal baik yang akan datang, bukan gambaran itu sendiri dari kenyataan-kenyataan itu.[a] Dengan kurban-kurban yang sama, yang mereka persembahkan terus-menerus tahun demi tahun, hukum Taurat tidak pernah dapat menyempurnakan orang-orang yang datang mendekat.[b]
  rationale: Revisi menghilangkan inferensi “Karena itu” yang tidak ada dalam sumber, tidak lagi memasukkan “kepada Allah” ke dalam teks utama, dan memilih “gambaran itu sendiri” untuk lebih dekat dengan εἰκών αὐτήν. Catatan kaki mempertahankan penjelasan mengenai nuansa ibadah tanpa meniadakan objek yang tidak dinyatakan secara eksplisit dalam bahasa Yunani.
