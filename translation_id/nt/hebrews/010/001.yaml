id: HEB.10.1
reference: Hebrews 10:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Σκιὰν γὰρ ἔχων ὁ νόμος τῶν μελλόντων ἀγαθῶν, οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων, κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκὲς οὐδέποτε ⸀δύναται τοὺς προσερχομένους τελειῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/001.yaml
  text: For since the law has only a shadow of the good things to come[a], not the very form of the realities, it can never, by the same sacrifices that they continually offer year after year[c][b], perfect those who draw near.
translation:
  language: id
  text: Sebab hukum Taurat hanya memiliki bayangan tentang hal-hal baik yang akan datang, bukan gambaran itu sendiri dari kenyataan-kenyataan itu.[a] Dengan kurban-kurban yang sama, yang mereka persembahkan terus-menerus tahun demi tahun, hukum Taurat tidak pernah dapat menyempurnakan orang-orang yang datang mendekat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bukan gambar itu sendiri dari kenyataan-kenyataan itu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “orang-orang yang datang mendekat”; dalam Surat Ibrani, ungkapan ini dapat bernuansa menghampiri Allah dalam ibadah.'
    reason: cultural_note
lexical_decisions:
- source_word: Σκιὰν
  choice: bayangan
  rationale: Mempertahankan metafora harfiah σκιά dan kontrasnya dengan εἰκών, tanpa menafsirkannya secara berlebihan sebagai sekadar perlambang.
- source_word: τῶν μελλόντων ἀγαθῶν
  choice: dari hal-hal baik yang akan datang
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan orientasi ke masa depan tanpa menentukan waktu eskatologis secara lebih sempit.
- source_word: οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων
  choice: bukan wujud sejati dari kenyataan-kenyataan itu
  rationale: “Wujud sejati” menyampaikan tekanan αὐτήν dan kontras antara bayangan dengan bentuk substantif yang bersesuaian; “kenyataan-kenyataan” menangkap πραγμάτων dalam konteks ini. Alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: κατ’ ἐνιαυτὸν
  choice: tahun demi tahun
  rationale: Menonjolkan pengulangan tahunan yang menjadi bagian penting dari argumen ayat.
- source_word: ταῖς αὐταῖς θυσίαις
  choice: melalui kurban-kurban yang sama
  rationale: “Melalui” menyampaikan fungsi instrumental datif, sedangkan bentuk jamak dan penekanan pada kurban yang sama dipertahankan.
- source_word: ἃς προσφέρουσιν εἰς τὸ διηνεκές
  choice: yang terus-menerus mereka persembahkan
  rationale: Mempertahankan subjek tak disebut “mereka,” aspek kebiasaan dari verba kala kini, dan gagasan keberlangsungan εἰς τὸ διηνεκές.
- source_word: οὐδέποτε δύναται
  choice: tidak pernah dapat
  rationale: Menyampaikan negasi mutlak οὐδέποτε sekaligus daya modal δύναται secara alami.
- source_word: τοὺς προσερχομένους
  choice: orang-orang yang datang mendekat kepada Allah
  rationale: Konteks Ibrani menunjukkan tindakan menghampiri Allah dalam ibadah; “kepada Allah” dibuat eksplisit agar nuansa kultis yang tersirat dalam bahasa Yunani dipahami pembaca Indonesia, lalu dijelaskan dalam catatan kaki.
- source_word: τελειῶσαι
  choice: menyempurnakan
  rationale: Mempertahankan istilah teologis kunci dalam Surat Ibrani dan gagasan membawa kepada tujuan yang dimaksud, tanpa membatasinya pada kesempurnaan moral.
theological_decisions:
- issue: Kontras antara bayangan dan kenyataan dalam teologi ibadah
  choice: Hukum Taurat hanya memiliki bayangan dari hal-hal baik yang akan datang, bukan wujud sejati dari kenyataan-kenyataan itu.
  alternative: Hukum Taurat adalah gambaran simbolis dari berkat-berkat masa depan.
  rationale: Bahasa Yunani secara eksplisit mengontraskan σκιά dengan εἰκών dan πραγμάτων. Terjemahan mempertahankan ketegangan itu tanpa merendahkan peran hukum Taurat ataupun menyamakannya dengan kenyataan final.
- issue: Makna τελειῶσαι dalam konteks kurban
  choice: menyempurnakan
  alternative: menjadikan sempurna; membawa kepada penyelesaian
  rationale: Dalam Surat Ibrani, τελειόω berkaitan dengan pencapaian tujuan dan akses yang tuntas kepada Allah. “Menyempurnakan” menjaga gema istilah tersebut tanpa menyatakan bahwa yang terutama dimaksud ialah ketidakberdosaan moral.
- issue: Referen tersirat dalam τοὺς προσερχομένους
  choice: datang mendekat kepada Allah
  alternative: datang mendekat; orang-orang yang beribadah
  rationale: Objek Allah tidak tertulis secara eksplisit dalam klausa ini, tetapi merupakan nuansa kultis yang kuat dari προσέρχομαι dalam Surat Ibrani. Penambahan dibuat transparan melalui catatan kaki agar bukti sumber tidak dikaburkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kurban” dipilih untuk persembahan ritual, sedangkan “hukum Taurat” memperjelas referen ὁ νόμος. Struktur kalimat dipecah menjadi dua agar mudah dipahami, tetapi hubungan sebab-akibat dan subjek gramatikal “hukum Taurat” tetap dipertahankan. Semua penanda catatan kaki muncul dalam teks utama.
