  yaml_path: translation/nt/hebrews/010/037.yaml
  text: For yet a very little while[b][a], the one who is coming will come and will not delay.
translation:
  language: id
  text: Sebab, hanya tinggal sedikit waktu lagi—sedikit sekali—Dia yang akan datang itu akan datang dan tidak akan berlambat-lambat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτι γὰρ
  choice: Sebab, ... lagi
  rationale: γάρ memberi alasan bagi nasihat sebelumnya dan diterjemahkan dengan “Sebab”; ἔτι menyatakan bahwa masih ada waktu yang tersisa dan secara alami tercermin dalam “lagi”.
- source_word: μικρὸν ὅσον ὅσον
  choice: hanya sedikit waktu lagi—sedikit sekali
  rationale: Ungkapan berulang ὅσον ὅσον menegaskan bahwa waktunya amat singkat. Bentuk ini menyampaikan penekanan tersebut dalam bahasa Indonesia yang alami tanpa meniru susunan Yunani secara kaku.
- source_word: ὁ ἐρχόμενος
  choice: Dia yang akan datang itu
  rationale: Partisip berartikel ini berfungsi sebagai nomina dan menunjuk kepada pribadi tertentu. Terjemahan ini mempertahankan makna partisipial sekaligus memungkinkan pembaca menangkap daya mesianiknya dari konteks tanpa menjadikannya gelar secara eksplisit.
- source_word: ἥξει
  choice: akan tiba
  rationale: Bentuk future ini menyatakan kedatangan yang akan terjadi. “Akan tiba” mempertahankan maknanya dan menghindari pengulangan “akan datang ... akan datang” yang kurang alami dalam bahasa Indonesia.
- source_word: οὐ χρονίσει
  choice: tidak akan berlambat
  rationale: χρονίζω di sini berarti menunda atau memakan waktu terlalu lama. “Tidak akan berlambat” jelas, wajar, dan sesuai dengan nada pernyataan nubuat.
theological_decisions:
- issue: Apakah ὁ ἐρχόμενος harus ditampilkan sebagai gelar mesianik atau sebagai frasa partisipial
  choice: Dia yang akan datang itu
  alternative: Sang Akan Datang
  rationale: Konteks sangat mungkin menunjuk kepada Mesias, tetapi bentuk Yunani sendiri tetap berupa partisip substantival. Teks utama mempertahankan bentuk deskriptif dan kekhususan referennya, sedangkan kemungkinan daya gelarnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Tanda pisah mempertahankan penekanan kuat dalam ungkapan waktu; “akan tiba” dipilih agar kalimat alami sambil tetap membedakannya dari sebutan partisipial sebelumnya.
