source:
  edition: SBLGNT
  text: Αὕτη ἡ διαθήκη ἣν διαθήσομαι πρὸς αὐτοὺς μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν, καὶ ἐπὶ ⸂τὴν διάνοιαν⸃ αὐτῶν ἐπιγράψω αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/016.yaml
  text: 'This is the covenant that I will make with them after those days[a], says the Lord: putting my laws upon their hearts, and I will write them on their minds,'
translation:
  language: id
  text: “Inilah perjanjian yang akan Kuadakan dengan mereka sesudah hari-hari itu,” firman Tuhan, “dengan menaruh hukum-hukum-Ku pada hati mereka, dan Aku akan menuliskannya pada pikiran mereka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκη
  choice: perjanjian
  rationale: Dalam konteks Ibrani dan kutipan Yeremia, kata ini menunjuk pada ikatan perjanjian Allah, bukan 'wasiat' dalam pengertian modern.
- source_word: διαθήσομαι
  choice: akan Kuadakan
  rationale: Ungkapan 'mengadakan perjanjian' alami dan baku dalam bahasa Indonesia serta tepat bagi bentuk futurum dalam rumusan perjanjian.
- source_word: πρὸς αὐτούς
  choice: dengan mereka
  rationale: Dalam konteks mengadakan perjanjian, πρὸς dengan orang secara idiomatis berarti 'dengan'.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: sesudah masa itu
  rationale: Secara harfiah berarti 'sesudah hari-hari itu'; 'sesudah masa itu' menyampaikan acuan waktunya secara wajar dalam bahasa Indonesia tanpa menambah tafsiran.
- source_word: κύριος
  choice: Tuhan
  rationale: Padanan lazim bagi κύριος dalam rumusan 'firman Tuhan' dan tetap mengikuti bentuk teks Yunani.
- source_word: διδοὺς
  choice: Aku akan menaruh
  rationale: Partisipel Yunani menyatakan tindakan yang menjadi isi atau cara pelaksanaan perjanjian. Bahasa Indonesia memerlukan klausa verbal agar kalimat alami; daya futurumnya dipahami dari verba utama dan konteks janji.
- source_word: νόμους
  choice: hukum-hukum
  rationale: Bentuk jamak Yunani dipertahankan; 'hukum-hukum' menjaga kaitan leksikal dengan νόμος.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: pada hati mereka
  rationale: Mempertahankan citra penempatan pada hati dengan ungkapan Indonesia yang alami.
- source_word: διάνοιαν
  choice: pikiran
  rationale: Menunjuk pada kemampuan berpikir atau memahami; 'pikiran' merupakan padanan modern yang luas dan alami.
- source_word: ἐπιγράψω
  choice: menuliskannya
  rationale: Verba ini berarti menulis pada atau mengukirkan; sufiks '-nya' secara alami merujuk kembali kepada hukum-hukum.
- source_word: αὐτούς
  choice: -nya
  rationale: Pronomina maskulin jamak merujuk kepada νόμους. Dalam bahasa Indonesia, enklitik '-nya' menghindari pengulangan dan tetap jelas.
theological_decisions:
- issue: Sintaks internal kutipan Yeremia
  choice: Mengungkapkan partisipel διδοὺς sebagai klausa verbal sejajar, 'Aku akan menaruh ... dan menuliskannya ...'
  alternative: Mempertahankan bentuk partisipial secara lebih harfiah, misalnya 'dengan menaruh hukum-hukum-Ku ... dan Aku akan menuliskannya ...'
  rationale: Bahasa Indonesia tidak memiliki padanan partisipel aktif yang dapat mempertahankan struktur Yunani secara alami. Klausa sejajar menyampaikan isi janji tanpa mengharmoniskan muatannya atau mengubah kedua tindakan yang dijanjikan.
- issue: Hubungan 'hati' dan 'pikiran' dalam janji perjanjian
  choice: 'Mempertahankan keduanya sebagai istilah berbeda: ''hati'' dan ''pikiran'''
  alternative: Menyatukan atau menafsirkan keduanya sebagai batin manusia secara umum
  rationale: Pembedaan leksikal καρδία dan διάνοια dalam teks Yunani dipertahankan agar cakupan dan ketegangan antropologisnya tidak dipersempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Tuhan dipakai sesuai kebiasaan penerbitan Alkitab berbahasa Indonesia. Tanda kutip menata formula kutipan dan ucapan ilahi dengan jelas.
