- from: “Inilah perjanjian yang akan Kuadakan dengan mereka sesudah masa itu,” firman Tuhan, “Aku akan menaruh hukum-hukum-Ku pada hati mereka dan menuliskannya dalam pikiran mereka.”
  to: “Inilah perjanjian yang akan Kuadakan dengan mereka sesudah hari-hari itu,” firman Tuhan, “dengan menaruh hukum-hukum-Ku pada hati mereka, dan Aku akan menuliskannya pada pikiran mereka.”
  rationale: Revisi memperketat kesetiaan kepada urutan temporal, paralelisme preposisional, dan perbedaan antara partisipel διδοὺς dengan futurum ἐπιγράψω, tanpa mengubah makna atau menambahkan penafsiran teologis.
