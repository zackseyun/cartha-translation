  text: sometimes being publicly exposed to insults and afflictions[b][a], and at other times becoming partners with those who were treated that way.
translation:
  language: id
  text: Di satu pihak, kalian dijadikan tontonan umum melalui hinaan dan penderitaan[a]; di pihak lain, kalian menjadi kawan seperjuangan dengan orang-orang yang diperlakukan demikian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dipermalukan di muka umum.”
    reason: lexical_alternative
  - marker: b
    text: Atau mungkin, “menjadi kawan seperjuangan dengan orang-orang yang hidup atau berperilaku demikian.” Kata Yunani yang dipakai dapat menunjuk pada cara hidup, meskipun konteks penganiayaan di sini lebih mendukung arti “diperlakukan demikian.”
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο μὲν ... τοῦτο δὲ
  choice: kadang-kadang ... pada waktu lain
  rationale: Struktur korelatif ini menyatakan dua bentuk pengalaman yang pernah dialami para pembaca. Ungkapan ini wajar dalam bahasa Indonesia dan tidak memaksakan apakah keduanya terjadi secara bergantian atau sebagai dua sisi pengalaman yang sama.
- source_word: ὀνειδισμοῖς
  choice: hinaan
  rationale: Kata ini menunjuk pada celaan atau perlakuan verbal yang mempermalukan. 'Hinaan' jelas dan alami dalam bahasa Indonesia modern.
- source_word: θλίψεσιν
  choice: penderitaan
  rationale: Bentuk jamak ini menunjuk pada berbagai tekanan dan kesusahan dalam konteks penganiayaan. 'Penderitaan' mempertahankan bobot maknanya tanpa mempersempit jenis kesusahan tersebut.
- source_word: θεατριζόμενοι
  choice: dijadikan tontonan umum
  rationale: Kata kerja ini membangkitkan gambaran seseorang yang dipertontonkan di hadapan umum sebagai sasaran penghinaan. Terjemahan ini mempertahankan gambaran teater yang hidup dan unsur dipermalukan di muka umum.
- source_word: κοινωνοὶ
  choice: kawan seperjuangan
  rationale: Kata ini menyatakan orang yang mengambil bagian bersama pihak lain. Dalam konteks penganiayaan, 'kawan seperjuangan' menyampaikan solidaritas aktif, bukan sekadar pertemanan, tanpa menyatakan bahwa penderitaan mereka harus persis sama.
- source_word: τῶν οὕτως ἀναστρεφομένων
  choice: bagi orang-orang yang diperlakukan demikian
  rationale: Dalam konteks hinaan dan penderitaan, bentuk partisip ini paling mungkin menunjuk pada orang-orang yang mengalami perlakuan serupa. Namun, karena kata kerjanya juga lazim berarti hidup atau berperilaku, kemungkinan itu dicatat dalam catatan kaki.
- source_word: γενηθέντες
  choice: menjadi
  rationale: Partisip aoris ini menyatakan bahwa para pembaca masuk ke dalam solidaritas dengan orang-orang tersebut. 'Menjadi' merupakan padanan alami dalam struktur kalimat Indonesia.
theological_decisions:
- issue: Makna ἀναστρεφομένων dalam konteks
  choice: dipahami sebagai orang-orang yang diperlakukan dengan cara demikian
  alternative: orang-orang yang hidup atau berperilaku demikian
  rationale: Konteks langsung berfokus pada hinaan, penderitaan, dan solidaritas dengan mereka yang dianiaya, sehingga makna pasif 'diperlakukan demikian' paling sesuai. Karena makna yang berkaitan dengan cara hidup tetap mungkin secara leksikal, alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Sapaan jamak 'kalian' membuat penerima jamak tersurat. Gambaran publik dalam θεατριζόμενοι dipertahankan dengan ungkapan idiomatis 'dijadikan tontonan umum'. Catatan kaki ditempatkan sesudah unsur yang dijelaskannya.
