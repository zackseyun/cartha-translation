    rationale: τοῦτο μὲν ... τοῦτο δὲ menyandingkan dua sisi atau bentuk pengalaman. “Kadang-kadang ... pada waktu lain” mungkin, tetapi “di satu pihak ... di pihak lain” mempertahankan struktur tanpa menambahkan nuansa temporal yang lebih tegas.
  - severity: medium
    issue: Frasa “kawan seperjuangan bagi orang-orang” tidak secara jelas menyatakan kebersamaan dengan mereka.
    rationale: κοινωνοὶ τῶν ... γενηθέντες menyatakan menjadi peserta/rekan bersama dengan orang-orang tersebut. Preposisi “dengan” menyampaikan relasi solidaritas itu secara lebih tepat.
  - severity: high
    issue: Catatan kaki a tidak memberikan alternatif yang sahih bagi kata atau frasa yang ditandainya.
    rationale: Catatan itu menyebut “melalui hinaan dan berbagai tekanan,” padahal teks utama sudah memuat hinaan dan penderitaan, sementara unsur yang perlu dijelaskan ialah θεατριζόμενοι, yakni dipertontonkan atau dipermalukan di muka umum.
  - severity: low
