    rationale: “Menjadi orang-orang yang turut berbagi dengan mereka” tidak jelas sebagai padanan κοινωνοί. Alternatif sebaiknya tetap mencerminkan arti “menjadi kawan seperjuangan dengan” sambil menandai kemungkinan makna ἀναστρεφομένων terkait cara hidup.
