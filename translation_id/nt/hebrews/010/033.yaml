  rationale: Revisi mempertahankan makna sumber dan ambiguitas yang nyata. Struktur korelatif dibuat lebih netral; relasi συμμετοχής/solidaritas dalam κοινωνοὶ diperjelas dengan “dengan”; dan kedua catatan kaki diperbaiki agar benar-benar berfungsi sebagai alternatif tekstual atau leksikal bagi bagian yang ditandai.
