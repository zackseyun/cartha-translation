  text: ἐπεὶ οὐκ ἂν ἐπαύσαντο προσφερόμεναι, διὰ τὸ μηδεμίαν ἔχειν ἔτι συνείδησιν ἁμαρτιῶν τοὺς λατρεύοντας ἅπαξ ⸀κεκαθαρισμένους;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/002.yaml
  text: Otherwise[a], would they not have stopped being offered, because those who worship, having once been cleansed[b], would no longer have any consciousness of sins?
translation:
  language: id
  text: Kalau tidak demikian, bukankah kurban-kurban itu sudah berhenti dipersembahkan? Sebab, orang-orang yang beribadah itu, yang sudah satu kali disucikan[b], tidak lagi memiliki kesadaran akan dosa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hati nurani mengenai dosa.” Ungkapan Yunani dapat berarti hati nurani, kesadaran, atau keinsafan akan dosa; di sini maksudnya adalah rasa bersalah yang terus dirasakan di hadapan Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau “disucikan sekali untuk selama-lamanya.” Dalam konteks ini, kata “satu kali” dapat menyiratkan tindakan yang definitif dan tidak perlu diulang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Kalau tidak demikian
  rationale: Dalam konteks argumen yang berlawanan dengan kenyataan, ungkapan ini menyampaikan inferensi ‘jika hukum Taurat benar-benar menyempurnakan’ secara alami dalam bahasa Indonesia.
- source_word: οὐκ ἂν ἐπαύσαντο προσφερόμεναι
  choice: bukankah kurban-kurban itu sudah berhenti dipersembahkan?
  rationale: Bentuk dengan ἄν menyatakan pertanyaan retoris yang berlawanan dengan kenyataan; bentuk pasif mempertahankan kurban sebagai sesuatu yang dipersembahkan.
- source_word: διὰ τὸ μηδεμίαν ἔχειν ἔτι
  choice: Sebab ... tidak lagi memiliki
  rationale: διά dengan infinitif artikular menyatakan alasan, sedangkan ἔτι bersama negasi menunjukkan bahwa keadaan tersebut tidak berlanjut.
- source_word: συνείδησιν ἁμαρτιῶν
  choice: kesadaran akan dosa
  rationale: συνείδησις dapat menunjuk pada hati nurani atau kesadaran. Di sini ‘kesadaran akan dosa’ mempertahankan cakupan ungkapan Yunani tanpa menyiratkan hilangnya kemampuan moral untuk mengenali dosa.
- source_word: τοὺς λατρεύοντας
  choice: orang-orang yang beribadah
  rationale: Partisip substantival ini menunjuk kepada mereka yang melakukan ibadah; terjemahan verbal terdengar alami dan mempertahankan nuansa tindakannya.
- source_word: ἅπαξ κεκαθαρισμένους
  choice: setelah disucikan satu kali
  rationale: Partisip perfektum pasif menunjukkan tindakan penyucian yang telah selesai dengan hasil yang tetap; ἅπαξ diterjemahkan secara tidak berlebihan sebagai ‘satu kali’, sementara kemungkinan makna definitif dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna συνείδησιν ἁμαρτιῶν setelah penyucian
  choice: kesadaran akan dosa
  alternative: hati nurani mengenai dosa; kesadaran akan kesalahan karena dosa
  rationale: Ungkapan ini dalam alur argumentasi menunjuk pada kesadaran yang terus-menerus akan dosa dan kesalahan di hadapan Allah, bukan hilangnya kepekaan etis terhadap dosa.
- issue: Kekuatan ἅπαξ
  choice: satu kali
  alternative: sekali untuk selama-lamanya
  rationale: Konteks memungkinkan nuansa tindakan yang definitif dan tidak perlu diulang, tetapi kata ἅπαξ sendiri tidak mengharuskan nuansa penuh itu dinyatakan dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya bermartabat dan mudah dipahami. ‘Kurban-kurban’ memperjelas subjek jamak yang tersirat dari ayat sebelumnya. Penanda catatan kaki ditempatkan tepat pada frasa yang dijelaskan.
