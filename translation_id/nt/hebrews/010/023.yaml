id: HEB.10.23
reference: Hebrews 10:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κατέχωμεν τὴν ὁμολογίαν τῆς ἐλπίδος ἀκλινῆ, πιστὸς γὰρ ὁ ἐπαγγειλάμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/023.yaml
  text: Let us hold fast the confession of our hope without wavering[a], for the one who promised is faithful.
translation:
  language: id
  text: Marilah kita berpegang teguh pada pengakuan tentang pengharapan kita tanpa goyah,[a] sebab Dia yang telah berjanji itu setia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pengakuan tentang pengharapan.” Bahasa Yunani tidak secara eksplisit mencantumkan kata “kita”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέχωμεν
  choice: Marilah kita berpegang teguh
  rationale: Subjungtif kini orang pertama jamak berfungsi sebagai ajakan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna terus mempertahankan dengan kukuh.
- source_word: ὁμολογίαν
  choice: pengakuan
  rationale: Dalam konteks ini menunjuk pada pernyataan iman atau komitmen yang diikrarkan secara terbuka; 'pengakuan' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: τῆς ἐλπίδος
  choice: tentang pengharapan kita
  rationale: Genitif dapat dipahami sebagai isi pengakuan. Kata 'kita' disediakan demi kealamian bahasa Indonesia dan sesuai dengan ajakan komunal, tetapi tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: ἀκλινῆ
  choice: tanpa goyah
  rationale: Adjektiva ini menerangkan pengakuan sebagai tidak menyimpang atau tidak bergeser. Bentuk adverbial 'tanpa goyah' alami setelah frasa verbal dan menyampaikan keteguhan.
- source_word: πιστὸς
  choice: setia
  rationale: Padanan ini mempertahankan arti dapat dipercaya sekaligus gema relasional dan teologis yang lazim dalam konteks janji Allah.
- source_word: ὁ ἐπαγγειλάμενος
  choice: Dia yang telah berjanji
  rationale: Partisip aoris substantival menunjuk kepada pribadi yang sebelumnya memberikan janji. Huruf kapital membantu menunjukkan rujukan kontekstual kepada Allah tanpa menambahkan nama-Nya ke dalam teks.
theological_decisions:
- issue: Subjek tersirat dari 'Dia yang telah berjanji'
  choice: Dipahami sebagai Allah, tetapi nama 'Allah' tidak ditambahkan.
  alternative: Menerjemahkan secara eksplisit, 'Allah yang telah berjanji.'
  rationale: Konteks menunjuk jelas kepada Allah, sedangkan bahasa Yunani hanya mengatakan 'yang telah berjanji'. Terjemahan mempertahankan sifat tersirat itu.
- issue: Penyediaan kata milik pada 'pengharapan'
  choice: Menggunakan 'pengharapan kita' dalam teks utama dengan catatan kaki.
  alternative: Menggunakan 'pengakuan tentang pengharapan' tanpa 'kita'.
  rationale: Kata 'kita' membuat ungkapan lebih alami dan memperjelas sifat komunal ajakan, tetapi catatan kaki menjaga transparansi bahwa kata tersebut tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- issue: Hubungan genitif τῆς ἐλπίδος
  choice: Diterjemahkan 'pengakuan tentang pengharapan kita'.
  alternative: Diterjemahkan lebih harfiah 'pengakuan pengharapan kita'.
  rationale: Kata 'tentang' secara alami menyatakan bahwa pengharapan merupakan isi pengakuan tanpa menutup kemungkinan nuansa hubungan genitif yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern, bernada ajakan yang khidmat namun mudah dipahami. 'Marilah' mempertahankan daya hortatoris; 'berpegang teguh' dan 'tanpa goyah' memberi penekanan pada ketekunan tanpa terasa kaku.
