  text: τότε εἴρηκεν· Ἰδοὺ ἥκω τοῦ ⸀ποιῆσαι τὸ θέλημά σου· ἀναιρεῖ τὸ πρῶτον ἵνα τὸ δεύτερον στήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/009.yaml
  text: Then he said[a], ‘Behold, I have come to do your will.’ He takes away the first so that he may establish the second.
translation:
  language: id
  text: Kemudian Ia berkata, “Lihatlah, Aku telah datang untuk melakukan kehendak-Mu.” Ia meniadakan yang pertama untuk menegakkan yang kedua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''Yang pertama'' dan ''yang kedua'' kemungkinan merujuk pada tata korban yang pertama dan kenyataan kedua, yaitu kehendak Allah yang terlaksana melalui persembahan Mesias. Ungkapan ini juga dapat dipahami secara lebih sempit sebagai pernyataan pertama dan kedua dalam kutipan sebelumnya, atau secara lebih luas sebagai tata lama dan tata baru.'
    reason: Menjelaskan beberapa kemungkinan referen tanpa memasukkan satu penafsiran tertentu ke dalam teks utama.
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Menandai urutan dalam kutipan dan alur argumen; bentuk ini alami dalam bahasa Indonesia.
- source_word: εἴρηκεν
  choice: Ia berkata
  rationale: Perfek Yunani merujuk pada perkataan yang telah diucapkan dan tetap relevan; dalam narasi Indonesia, bentuk lampau sederhana paling alami tanpa menghilangkan daya berlakunya dalam konteks.
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan seruan penunjuk dan nada khidmat dengan ungkapan Indonesia yang masih mudah dipahami.
- source_word: ἥκω
  choice: Aku telah datang
  rationale: Menyatakan kedatangan yang sudah terjadi dengan keadaan hadir yang berlanjut.
- source_word: τοῦ ποιῆσαι
  choice: untuk melakukan
  rationale: Infinitif berartikel menyatakan tujuan; 'untuk melakukan' mengungkapkannya secara jelas dan alami.
- source_word: τὸ θέλημά σου
  choice: kehendak-Mu
  rationale: Mempertahankan istilah kunci bagi kehendak atau maksud Allah; huruf kapital menandai sapaan kepada Allah.
- source_word: ἀναιρεῖ
  choice: meniadakan
  rationale: Dalam konteks ini berarti menyingkirkan atau menghapus keberlakuan yang pertama; 'meniadakan' ringkas dan cocok dengan kontras terhadap 'menegakkan' tanpa menentukan referennya secara berlebihan.
- source_word: τὸ πρῶτον
  choice: yang pertama
  rationale: Mempertahankan bentuk substantival Yunani yang ringkas dan membiarkan konteks menentukan referennya.
- source_word: ἵνα
  choice: untuk
  rationale: Menyatakan tujuan secara padat dan alami dalam konstruksi Indonesia ini.
- source_word: τὸ δεύτερον
  choice: yang kedua
  rationale: Mempertahankan kesejajaran dan ketidaktersuratan referen dalam teks Yunani.
- source_word: στήσῃ
  choice: menegakkan
  rationale: Mengungkapkan tindakan menetapkan atau memberlakukan, sekaligus mempertahankan kontras retoris dengan 'meniadakan'.
theological_decisions:
- issue: Referen 'yang pertama' dan 'yang kedua'
  choice: Teks utama mempertahankan ungkapan ringkas 'yang pertama' dan 'yang kedua'.
  alternative: Menjelaskannya sebagai tata korban pertama dan pelaksanaan kehendak Allah dalam persembahan Mesias, atau secara lebih luas sebagai perjanjian lama dan perjanjian baru.
  rationale: Konteks langsung membandingkan korban dan persembahan dengan pelaksanaan kehendak Allah, tetapi teks Yunani sendiri tidak menyebut nomina yang dijelaskan. Mempertahankan bentuk ringkas menjaga ambiguitas dan ketegangan teologis yang asli.
- issue: Subjek ἀναιρεῖ dan στήσῃ
  choice: Diterjemahkan dengan 'Ia', selaras dengan tokoh yang berkata dan datang dalam kutipan.
  alternative: Memahami tindakan tersebut sebagai kesimpulan penulis mengenai Allah atau mengenai dampak ucapan itu tanpa menyatakan subjek secara eksplisit.
  rationale: Bahasa Yunani memakai subjek tersirat orang ketiga tunggal. 'Ia' diperlukan dalam bahasa Indonesia, namun kapitalisasi tidak menambahkan identifikasi denominatif melampaui konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kutipan memakai 'Lihatlah' alih-alih bentuk arkais; istilah 'meniadakan' dan 'menegakkan' mempertahankan kontras argumentatif. Penanda catatan kaki [a] muncul dalam teks utama.
