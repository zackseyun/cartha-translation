  text: ⸀οὗτος δὲ μίαν ὑπὲρ ἁμαρτιῶν προσενέγκας θυσίαν εἰς τὸ διηνεκὲς ἐκάθισεν ἐν δεξιᾷ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/012.yaml
  text: But this one[a], after offering one sacrifice for sins for all time, sat down at the right hand of God[b],
translation:
  language: id
  text: Namun, Ia, setelah mempersembahkan satu kurban karena dosa untuk selama-lamanya,[a] duduk di sebelah kanan Allah,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Yunani yang diterjemahkan “untuk selama-lamanya” juga dapat dipahami lebih langsung berkaitan dengan tindakan mempersembahkan—“setelah mempersembahkan satu kurban karena dosa untuk selama-lamanya”—atau dengan tindakan duduk—“duduk untuk selama-lamanya di sebelah kanan Allah.”
    reason: alternative_reading
  - marker: b
    text: Ungkapan “di sebelah kanan Allah” menggemakan Mazmur 110:1, bagian penting dalam Surat Ibrani mengenai peninggian Mesias.
    reason: cross_reference
lexical_decisions:
- source_word: οὗτος
  choice: Dia ini
  rationale: Mempertahankan daya demonstratif yang menonjolkan kontras dengan para imam pada ayat sebelumnya, tetapi tetap alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan dengan para imam yang berdiri setiap hari dan berulang kali mempersembahkan kurban.
- source_word: μίαν ... θυσίαν
  choice: satu kurban
  rationale: Menjaga penekanan pada satu-satunya kurban, berlawanan dengan banyak kurban yang dipersembahkan berulang kali.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: karena dosa
  rationale: Ungkapan Indonesia yang wajar untuk fungsi kurban yang berkenaan dengan dosa; bentuk kolektif 'dosa' menyampaikan jamak Yunani secara idiomatis.
- source_word: προσενέγκας
  choice: setelah mempersembahkan
  rationale: Partisip aoris mendahului verba utama; bentuk ini menyatakan urutan tindakan dengan jelas.
- source_word: εἰς τὸ διηνεκές
  choice: untuk selama-lamanya
  rationale: Menyampaikan keberlakuan yang tetap dan permanen, selaras dengan kontras terhadap persembahan yang terus diulang, sambil mempertahankan kemungkinan keterkaitan sintaksis lain dalam catatan kaki.
- source_word: ἐκάθισεν
  choice: duduk
  rationale: Mempertahankan tindakan selesai dan kontras kontekstual dengan para imam yang terus berdiri.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: di sebelah kanan Allah
  rationale: Ungkapan Indonesia yang baku dan jelas untuk kedudukan kehormatan serta gema Mazmur 110:1.
theological_decisions:
- issue: Cakupan εἰς τὸ διηνεκές
  choice: Ditempatkan dekat dengan 'satu kurban karena dosa' sehingga terutama menekankan keampuhan kurban yang berlaku permanen.
  alternative: Frasa itu dapat dikaitkan dengan tindakan mempersembahkan ('mempersembahkan ... untuk selama-lamanya') atau dengan duduk ('duduk untuk selama-lamanya di sebelah kanan Allah').
  rationale: Urutan Yunani memungkinkan lebih dari satu hubungan, tetapi alur Ibrani 10 terutama mengontraskan satu kurban yang tetap berlaku dengan kurban-kurban yang diulang. Catatan kaki mempertahankan ambiguitas yang sungguh ada.
- issue: Identitas οὗτος
  choice: '''Dia ini'' dipakai secara demonstratif tanpa menambahkan nama atau gelar.'
  alternative: Ia; Orang ini; Kristus
  rationale: Bentuk Yunani bersifat demonstratif dan membangun kontras. Menambahkan 'Kristus' akan memperjelas referen, tetapi melampaui kata yang hadir dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Kurban' dipilih sebagai istilah kultis yang mudah dipahami; 'Dia ini' mempertahankan penekanan demonstratif Yunani. Tanda koma sebelum catatan kaki membantu memperlihatkan bahwa εἰς τὸ διηνεκές dapat dipahami bersama frasa kurban, sementara catatan kaki menjelaskan pilihan sintaksis lain.
