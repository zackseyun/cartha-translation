  text: προσερχώμεθα μετὰ ἀληθινῆς καρδίας ἐν πληροφορίᾳ πίστεως, ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς καὶ λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/022.yaml
  text: let us draw near with a true heart in full assurance of faith[d][c][b][a], with our hearts sprinkled clean from an evil conscience and our bodies washed with pure water.
translation:
  language: id
  text: Marilah kita mendekat dengan hati yang tulus[a] dan dengan penuh keyakinan dalam iman, dengan hati kita yang telah diperciki sehingga bersih dari hati nurani yang jahat[b] dan tubuh kita yang telah dibasuh dengan air yang bersih[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan hati yang sejati” atau “dengan hati yang sungguh-sungguh.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dari hati nurani yang bersalah.” Namun, kata Yunani yang dipakai secara harfiah berarti “jahat.”
    reason: lexical_alternative
  - marker: c
    text: Gambaran pemercikan dan pembasuhan dapat mengingatkan pembaca pada pemurnian ritual dan mungkin juga pada baptisan, tetapi ayat ini tidak secara eksplisit menyebut pembasuhan itu sebagai baptisan.
    reason: cultural_note
lexical_decisions:
- source_word: προσερχώμεθα
  choice: marilah kita mendekat
  rationale: Subjungtif hortatoris orang pertama jamak ini menyampaikan ajakan bersama. “Mendekat” mempertahankan konteks menghampiri Allah dalam surat Ibrani.
- source_word: μετὰ ἀληθινῆς καρδίας
  choice: dengan hati yang tulus
  rationale: ἀληθινός dapat berarti benar, sejati, atau tulus. Dalam bahasa Indonesia, “hati yang tulus” paling alami untuk menyatakan batin yang sungguh-sungguh tanpa membatasinya pada perasaan belaka.
- source_word: ἐν πληροφορίᾳ πίστεως
  choice: dalam keyakinan iman yang penuh
  rationale: πληροφορία menunjuk pada kepastian atau keyakinan penuh. Susunan ini mempertahankan ἐν dan hubungan genitif πίστεως tanpa mengubah iman menjadi kesetiaan.
- source_word: ῥεραντισμένοι τὰς καρδίας
  choice: karena hati kita telah diperciki sehingga bersih
  rationale: Partisip perfek pasif menyatakan keadaan yang dihasilkan oleh tindakan yang telah selesai. “Diperciki” mempertahankan citra pemurnian, sedangkan “sehingga bersih” menjelaskan hasil yang tersirat dalam konteks dan hubungan dengan ἀπό.
- source_word: ἀπὸ συνειδήσεως πονηρᾶς
  choice: dari hati nurani yang jahat
  rationale: “Jahat” mempertahankan keluasan πονηρός dan tidak mempersempitnya menjadi sekadar perasaan bersalah.
- source_word: λελουσμένοι τὸ σῶμα
  choice: tubuh kita telah dibasuh
  rationale: Partisip perfek menyatakan keadaan sesudah pembasuhan. Bentuk tunggal “tubuh kita” mengikuti bentuk distributif tunggal dalam bahasa Yunani dan tetap wajar dalam bahasa Indonesia.
- source_word: ὕδατι καθαρῷ
  choice: dengan air yang bersih
  rationale: καθαρός dapat berarti bersih atau murni. “Air yang bersih” alami dalam bahasa Indonesia dan tetap memuat nuansa pemurnian.
theological_decisions:
- issue: Apakah pembasuhan harus secara eksplisit diidentifikasi sebagai baptisan
  choice: Mempertahankan gambaran pemurnian tanpa menyebut baptisan dalam teks utama
  alternative: Menafsirkan pembasuhan secara eksplisit sebagai baptisan, atau sebaliknya sebagai pemurnian batin semata
  rationale: Ayat ini menggunakan bahasa pemercikan dan pembasuhan yang dapat membangkitkan gambaran pemurnian ritual dan mungkin juga baptisan, tetapi tidak secara eksplisit mengidentifikasi pembasuhan tersebut.
- issue: Apakah συνειδήσεως πονηρᾶς harus diterjemahkan sebagai hati nurani yang merasa bersalah
  choice: hati nurani yang jahat
  alternative: hati nurani yang bersalah
  rationale: Teks sumber memakai πονηρός, “jahat,” sehingga terjemahan formal menjaga keluasan moral dan ritual ungkapan itu serta tidak membatasinya pada keadaan psikologis rasa bersalah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ajakan dipertahankan, sedangkan dua partisip perfek dinyatakan dengan “telah” agar keadaan hasilnya jelas. Penambahan “karena” membuat hubungan partisipial alami dalam bahasa Indonesia tanpa menetapkan urutan sebab-akibat teologis yang lebih sempit.
