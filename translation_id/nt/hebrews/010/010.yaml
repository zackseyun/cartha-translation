id: HEB.10.10
reference: Hebrews 10:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν ᾧ θελήματι ἡγιασμένοι ⸀ἐσμὲν διὰ τῆς προσφορᾶς τοῦ σώματος Ἰησοῦ Χριστοῦ ἐφάπαξ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/010.yaml
  text: By that will we have been sanctified through the offering of the body of Jesus the Messiah once for all[a][b].
translation:
  language: id
  text: Oleh kehendak itu, kita telah dikuduskan melalui persembahan tubuh Yesus Sang Mesias sekali untuk selama-lamanya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “di dalam kehendak itu.” Dalam konteksnya, yang dimaksud ialah kehendak Allah yang baru saja disebutkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “Yesus Kristus.” Kata Yunani Christos berarti “Mesias” dan di sini diterjemahkan sebagai gelar.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ θελήματι
  choice: Oleh kehendak itu
  rationale: Frasa ini mengacu kembali pada kehendak Allah dalam konteks sebelumnya. 'Oleh' menyampaikan nuansa sarana secara alami, sedangkan 'itu' mempertahankan rujukan anaforisnya.
- source_word: ἡγιασμένοι ἐσμὲν
  choice: kita telah dikuduskan
  rationale: Konstruksi perfektum perifrastik menyatakan tindakan yang telah terlaksana dengan hasil yang tetap berlangsung. Bentuk ini mempertahankan aspek tersebut tanpa menafsirkannya sebagai proses yang sedang berlangsung.
- source_word: διὰ τῆς προσφορᾶς
  choice: melalui persembahan
  rationale: διά dengan genitif menandai sarana, dan προσφορά berarti persembahan dalam konteks korban. Pilihan ini dekat dengan bentuk Yunani sekaligus wajar dalam bahasa Indonesia.
- source_word: τοῦ σώματος
  choice: tubuh
  rationale: Struktur 'persembahan tubuh Yesus' secara alami menyatakan bahwa tubuh Yesuslah yang dipersembahkan dan tetap mempertahankan kekonkretan ungkapan sumber.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός dipertahankan maknanya sebagai gelar, 'Mesias'. 'Sang' menandai gelar itu secara idiomatis dan bermartabat dalam bahasa Indonesia.
- source_word: ἐφάπαξ
  choice: sekali untuk selama-lamanya
  rationale: Ungkapan ini menyampaikan sifat tindakan yang satu kali, tuntas, dan tidak perlu diulangi.
theological_decisions:
- issue: Aspek pengudusan
  choice: kita telah dikuduskan
  alternative: kita dikuduskan; kita sedang dikuduskan
  rationale: Perfektum perifrastik menunjuk pada tindakan yang telah terjadi dengan keadaan hasil yang berlanjut. Terjemahan ini tidak mereduksinya menjadi keadaan kini saja ataupun proses progresif.
- issue: Gelar Kristologis Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam frasa ini Χριστός dapat didengar sebagai gelar. Menerjemahkan maknanya sebagai 'Mesias' menjaga daya semantis gelar tersebut tanpa memasukkan penafsiran denominasi tertentu.
- issue: Pelaku kehendak
  choice: kehendak itu
  alternative: kehendak Allah itu
  rationale: Konteks menunjukkan bahwa yang dimaksud adalah kehendak Allah, tetapi nama Allah tidak disebut secara eksplisit dalam ayat ini. Teks utama mempertahankan bentuk implisit sumber, sementara catatan menjelaskannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. 'Dikuduskan' mempertahankan istilah teologis yang lazim; 'sekali untuk selama-lamanya' mengungkapkan finalitas ἐφάπαξ secara idiomatis. Semua penanda catatan kaki ditempatkan dalam teks utama.
