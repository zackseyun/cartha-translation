id: HEB.10.34
reference: Hebrews 10:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ γὰρ τοῖς ⸀δεσμίοις συνεπαθήσατε, καὶ τὴν ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν μετὰ χαρᾶς προσεδέξασθε, γινώσκοντες ἔχειν ⸀ἑαυτοὺς κρείττονα ⸀ὕπαρξιν καὶ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/034.yaml
  text: For you also suffered together with the prisoners[a], and you accepted with joy the plundering of your possessions[b], knowing that you yourselves have a better and lasting possession.
translation:
  language: id
  text: Sebab kamu ikut menanggung penderitaan orang-orang yang dipenjarakan[a], dan kamu menerima dengan sukacita perampasan harta milikmu, karena tahu bahwa kamu sendiri memiliki milik yang lebih baik dan yang tetap ada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menaruh belas kasihan kepada orang-orang yang dipenjarakan.” Kata kerja Yunaninya dapat menyatakan simpati, tetapi di sini tampaknya juga mencakup keikutsertaan dalam penderitaan mereka.
    reason: lexical_alternative
  - marker: b
    text: Beberapa naskah berbunyi, “karena tahu bahwa di surga kamu memiliki bagi dirimu sendiri milik yang lebih baik dan tetap ada.”
    reason: textual_variant
lexical_decisions:
- source_word: δεσμίοις
  choice: orang-orang yang dipenjarakan
  rationale: Ungkapan ini menyatakan orang yang berada dalam belenggu atau penjara dan terdengar alami dalam bahasa Indonesia modern.
- source_word: συνεπαθήσατε
  choice: ikut menanggung penderitaan
  rationale: Kata kerja ini dapat berarti bersimpati atau berbelas kasihan, tetapi dalam konteks penganiayaan awalan συν- menonjolkan solidaritas nyata dalam penderitaan, bukan sekadar perasaan iba.
- source_word: ἁρπαγήν
  choice: perampasan
  rationale: Pilihan ini mempertahankan unsur pengambilan secara paksa dan tidak adil, lebih kuat daripada istilah administratif seperti 'penyitaan'.
- source_word: τῶν ὑπαρχόντων ὑμῶν
  choice: harta milikmu
  rationale: Partisip ini dipakai secara substantival untuk barang atau kekayaan yang dimiliki seseorang; 'harta milikmu' jelas dan wajar dalam bahasa Indonesia.
- source_word: μετὰ χαρᾶς
  choice: dengan sukacita
  rationale: Terjemahan langsung ini mempertahankan bentuk dan penekanan frasa Yunani.
- source_word: προσεδέξασθε
  choice: kamu menerima
  rationale: Dalam konteks kehilangan yang ditanggung, 'menerima' menyampaikan kesediaan menghadapi kejadian tersebut tanpa menyiratkan persetujuan terhadap ketidakadilannya.
- source_word: γινώσκοντες
  choice: karena tahu
  rationale: Bentuk partisip ini memiliki nuansa sebab yang alami dinyatakan dalam bahasa Indonesia dengan 'karena tahu'.
- source_word: ἑαυτοὺς ἔχειν
  choice: kamu sendiri memiliki
  rationale: Kata ganti refleksif memberi penekanan; 'kamu sendiri' mempertahankan penekanan itu.
- source_word: κρείττονα
  choice: lebih baik
  rationale: Pilihan ini mempertahankan tema perbandingan 'lebih baik' yang berulang dalam Surat Ibrani.
- source_word: ὕπαρξιν
  choice: sesuatu ... yang dimiliki
  rationale: Nomina ini berarti milik atau harta. Susunan 'memiliki sesuatu' terasa lebih alami daripada 'memiliki suatu milik' dan tetap mempertahankan kontras dengan harta yang dirampas.
- source_word: μένουσαν
  choice: tetap ada
  rationale: Frasa ini menyatakan keberlangsungan atau ketetapan tanpa mempersempitnya menjadi istilah teologis yang lebih khusus.
theological_decisions:
- issue: Makna solidaritas dengan orang percaya yang dipenjarakan
  choice: Ayat ini menyatakan bahwa para pembaca ikut menanggung penderitaan mereka yang dipenjarakan.
  alternative: Ayat ini dapat diterjemahkan lebih ringan sebagai 'menaruh belas kasihan kepada orang-orang yang dipenjarakan.'
  rationale: Arti συμπαθέω dan konteks penganiayaan dalam Ibrani 10:32–34 mendukung solidaritas yang nyata dan berbiaya, walaupun arti bersimpati atau berbelas kasihan tetap mungkin secara leksikal.
- issue: Sifat dari sesuatu yang lebih baik dan tetap ada
  choice: Terjemahan membiarkannya sebagai milik yang lebih baik dan bertahan, tanpa menentukan lokasi atau bentuknya.
  alternative: Milik yang lebih baik di surga; warisan yang lebih baik; keselamatan atau upah kekal.
  rationale: Teks SBLGNT yang diterjemahkan tidak menyebut 'di surga' dan tidak mengidentifikasi milik itu secara lebih khusus, sehingga ambiguitas sumber dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Kamu' dipakai sebagai sapaan jamak sesuai konteks surat. Susunan kalimat menjaga hubungan sebab melalui 'karena tahu' dan tidak menambahkan penafsiran khusus tentang lokasi atau hakikat milik yang lebih baik itu.
