id: HEB.10.26
reference: Hebrews 10:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἑκουσίως γὰρ ἁμαρτανόντων ἡμῶν μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας, οὐκέτι περὶ ἁμαρτιῶν ἀπολείπεται θυσία,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/026.yaml
  text: For if we go on sinning deliberately after receiving the knowledge of the truth[a], there no longer remains a sacrifice for sins,
translation:
  language: id
  text: Sebab jika kita terus berbuat dosa dengan sengaja setelah menerima pengetahuan tentang kebenaran[a], tidak ada lagi kurban untuk dosa-dosa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengetahuan penuh tentang kebenaran.” Kata Yunani ini dapat mengandung nuansa pengetahuan yang lebih penuh atau lebih mendalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑκουσίως
  choice: dengan sengaja
  rationale: Ungkapan ini menyampaikan tindakan yang disengaja atau dilakukan dengan kemauan sendiri dalam bahasa Indonesia modern, tanpa nuansa arkais atau legalistis yang berlebihan.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelasan dengan argumen sebelumnya dan terdengar wajar pada awal kalimat.
- source_word: ἁμαρτανόντων ἡμῶν
  choice: jika kita terus berbuat dosa
  rationale: Partisipel kini dalam konstruksi genitif absolut secara alami menunjuk pada tindakan yang berlangsung atau berlanjut; bentuk bersyarat diperlukan agar hubungan klausa itu alami dalam bahasa Indonesia.
- source_word: μετὰ τὸ λαβεῖν
  choice: setelah menerima
  rationale: Menandai urutan waktu dan tindakan penerimaan yang mendahului perbuatan dosa yang terus berlangsung.
- source_word: ἐπίγνωσιν
  choice: pengetahuan
  rationale: Padanan utama yang alami dan tidak memaksakan apakah pengetahuan itu harus dipahami sebagai pengetahuan penuh atau pengetahuan yang menyelamatkan; kemungkinan nuansa lebih kuat dicatat dalam catatan kaki.
- source_word: τῆς ἀληθείας
  choice: tentang kebenaran
  rationale: Dalam bahasa Indonesia, 'pengetahuan tentang kebenaran' lebih alami daripada konstruksi harfiah 'pengetahuan akan kebenaran' dan tetap mempertahankan objek pengetahuan tersebut.
- source_word: οὐκέτι
  choice: tidak ada lagi
  rationale: Secara jelas menunjukkan bahwa dari titik itu dan seterusnya sesuatu tidak lagi tersedia atau tersisa.
- source_word: περὶ ἁμαρτιῶν
  choice: untuk dosa-dosa
  rationale: Dalam konteks persembahan, preposisi ini menyatakan hubungan kurban dengan dosa; bentuk jamak mempertahankan bentuk Yunani.
- source_word: ἀπολείπεται
  choice: yang tersisa
  rationale: Mengungkapkan arti 'masih tinggal/tersedia' secara idiomatis dalam konstruksi eksistensial bahasa Indonesia.
- source_word: θυσία
  choice: kurban
  rationale: '''Kurban'' merupakan istilah baku dan mudah dipahami untuk persembahan korban dalam konteks ibadah, serta sesuai dengan pembahasan Ibrani mengenai karya pengurbanan Kristus.'
theological_decisions:
- issue: Aspek dan daya pastoral-teologis ἁμαρτανόντων
  choice: 'Diterjemahkan sebagai tindakan yang berlanjut: ''jika kita terus berbuat dosa dengan sengaja''.'
  alternative: '''jika kita berbuat dosa dengan sengaja'''
  rationale: Partisipel kini secara wajar mendukung gagasan tindakan yang terus berlangsung. Pilihan ini mempertahankan beratnya peringatan tanpa menjadikannya secara pasti sebagai satu tindakan dosa terisolasi setelah menerima kebenaran.
- issue: Makna ἐπίγνωσις dalam konteks peringatan
  choice: Teks utama memakai 'pengetahuan tentang kebenaran' tanpa menentukan status rohani orang yang menerimanya.
  alternative: '''pengetahuan penuh tentang kebenaran'' atau ''pengetahuan yang menyelamatkan tentang kebenaran'''
  rationale: Ayat ini menyebut penerimaan pengetahuan tentang kebenaran, tetapi tidak secara eksplisit menetapkan kedalaman pengalaman atau status keselamatan yang tersirat. Terjemahan tidak menyelesaikan perdebatan teologis yang dibiarkan terbuka oleh teks.
- issue: Cakupan 'tidak ada lagi kurban yang tersisa'
  choice: Pernyataan dipertahankan tanpa tambahan penjelasan tentang ada atau tidaknya kemungkinan pertobatan.
  alternative: Parafrasa yang secara eksplisit menyatakan bahwa tidak tersedia kurban lain selain Kristus
  rationale: Konteks surat mendukung keunikan kurban Kristus, tetapi ayat ini sendiri berbentuk peringatan ringkas. Menambahkan kesimpulan doktrinal akan mempersempit ketegangan yang ada dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Frasa 'terus berbuat dosa dengan sengaja' menjaga aspek berkelanjutan dan unsur kesengajaan. Ejaan 'kurban' mengikuti bentuk baku bahasa Indonesia untuk persembahan keagamaan. Tanda koma akhir dipertahankan karena ayat ini secara sintaksis berlanjut ke ayat 27.
