  text: φοβερὰ δέ τις ἐκδοχὴ κρίσεως καὶ πυρὸς ζῆλος ἐσθίειν μέλλοντος τοὺς ὑπεναντίους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/027.yaml
  text: but a fearful expectation of judgment[a], and a fury of fire about to consume the adversaries.
translation:
  language: id
  text: tetapi penantian yang mengerikan akan penghakiman[a], serta amukan api yang akan melalap para penentang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih idiomatis: “penantian yang menggentarkan akan penghakiman dan api yang menyala-nyala yang akan melalap para penentang.”'
    reason: Alternatif ini menampilkan nuansa φοβερὰ dan πυρὸς ζῆλος dengan susunan yang lebih idiomatis, sambil mempertahankan kedahsyatan gambaran aslinya.
lexical_decisions:
- source_word: φοβερὰ
  choice: yang mengerikan
  rationale: Menyampaikan sifat penantian itu sebagai sesuatu yang menimbulkan kengerian, dengan nada kuat namun tetap alami dalam bahasa Indonesia.
- source_word: δέ
  choice: tetapi
  rationale: Menandai pertentangan dengan pernyataan negatif pada ayat sebelumnya.
- source_word: τις
  choice: tidak diterjemahkan secara tersendiri
  rationale: Pronomina tak tentu ini memberi nuansa ketaktertentuan pada ἐκδοχή, tetapi padanan seperti 'suatu' atau 'semacam' membuat ungkapan Indonesia kurang alami dan dapat melemahkan kepastian ancaman.
- source_word: ἐκδοχὴ κρίσεως
  choice: penantian ... akan penghakiman
  rationale: '''Penantian'' mempertahankan gagasan menunggu sesuatu yang akan datang, sedangkan ''penghakiman'' tidak mempersempitnya menjadi penghukuman secara eksplisit.'
- source_word: πυρὸς ζῆλος
  choice: keganasan api
  rationale: Ungkapan ini mempertahankan daya personifikasi dan kedahsyatan frasa Yunani secara lebih alami daripada bentuk harfiah 'semangat api'.
- source_word: ἐσθίειν
  choice: melalap
  rationale: '''Melalap'' lazim digunakan untuk api yang menghabiskan sesuatu dan mempertahankan gambaran hidup dari kata yang secara harfiah berarti ''memakan''.'
- source_word: μέλλοντος
  choice: yang akan
  rationale: Menunjukkan tindakan yang segera atau sudah di ambang terjadi tanpa memaksakan tingkat kronologi yang lebih khusus daripada konteks.
- source_word: τοὺς ὑπεναντίους
  choice: para penentang
  rationale: Menunjuk orang-orang yang mengambil posisi berlawanan, dengan nada formal yang sesuai dan tanpa memperluasnya menjadi semua 'musuh' secara umum.
theological_decisions:
- issue: Hakikat gambaran penghakiman
  choice: Mempertahankan gambaran api yang melalap tanpa menjelaskannya sebagai kategori hukuman tertentu.
  alternative: Menafsirkannya secara eksplisit sebagai siksaan kekal atau melemahkannya menjadi gambaran metaforis semata.
  rationale: Ayat ini menyatakan ancaman penghakiman ilahi dengan sangat kuat, tetapi tidak dengan sendirinya merinci seluruh hakikat atau lamanya penghakiman tersebut.
- issue: Makna ζῆλος dalam frasa πυρὸς ζῆλος
  choice: keganasan api
  alternative: semangat api; api yang berkobar-kobar; murka yang menyala-nyala
  rationale: Pilihan ini menjaga ketegangan antara arti dasar berupa gairah atau semangat yang kuat dan penggunaan kontekstualnya sebagai daya api yang ganas, tanpa secara langsung menggantinya dengan 'murka Allah'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mempertahankan bentuk ringkas serta daya peringatan teks Yunani; koma membantu memperjelas dua unsur yang dinantikan tanpa mengubah keduanya menjadi dua peristiwa yang tidak berkaitan.
