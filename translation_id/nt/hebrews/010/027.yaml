  source_fidelity: 'Teks Yunani menyatakan kontras dengan ayat sebelumnya: suatu penantian yang menakutkan akan penghakiman dan ζῆλος api yang akan melalap pihak-pihak yang berlawanan. Draf dengan tepat mempertahankan penghakiman, daya penghancur api, dan sasaran tindakan itu, tanpa menambahkan rincian teologis tentang sifat atau durasi hukuman.'
