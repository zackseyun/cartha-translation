  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀναμιμνῄσκεσθε δὲ τὰς πρότερον ἡμέρας, ἐν αἷς φωτισθέντες πολλὴν ἄθλησιν ὑπεμείνατε παθημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/032.yaml
  text: But remember the former days[a], when, after you were enlightened, you endured a great struggle of sufferings[c][b],
translation:
  language: id
  text: Namun, ingatlah kembali hari-hari yang dahulu, ketika kalian, sesudah diterangi[a], bertahan dalam perjuangan besar yang penuh penderitaan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika diterangi.” Bentuk partisip Yunani dapat dipahami sebagai tindakan yang mendahului ketekunan itu atau sebagai keadaan yang berlangsung pada masa yang sama. “Diterangi” dapat menunjuk secara luas pada penerimaan terang rohani; ayat ini tidak menentukan apakah yang dimaksud secara khusus ialah pertobatan, baptisan, atau pengajaran iman.
    reason: lexical_and_theological_alternative
  - marker: b
    text: Atau “pertandingan berat dalam penderitaan.” Kata Yunani yang diterjemahkan “perjuangan” mengandung gambaran perjuangan atau pertandingan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναμιμνῄσκεσθε
  choice: ingatlah
  rationale: Bentuk imperatif kini jamak diterjemahkan sebagai perintah yang alami dalam bahasa Indonesia; aspek berkelanjutan tidak perlu dinyatakan secara eksplisit.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan sekaligus kontras ringan dari peringatan sebelumnya kepada ajakan untuk mengingat ketekunan masa lalu.
- source_word: τὰς πρότερον ἡμέρας
  choice: hari-hari yang dahulu
  rationale: Mengungkapkan acuan kepada masa sebelumnya dengan bahasa Indonesia yang wajar dan tetap mempertahankan gambaran 'hari-hari'.
- source_word: ἐν αἷς
  choice: ketika
  rationale: Frasa relatif ini berfungsi temporal; 'ketika' lebih alami daripada terjemahan harfiah 'di dalamnya'.
- source_word: φωτισθέντες
  choice: setelah diterangi
  rationale: Mempertahankan metafora pasif Yunani dan menyajikan tindakan partisip sebagai mendahului ketekunan, tanpa menentukan secara sempit jenis pengalaman rohaninya.
- source_word: πολλὴν ἄθλησιν
  choice: pergumulan besar
  rationale: ἄθλησις mengandung nuansa pertandingan atau perjuangan berat; 'pergumulan besar' alami dan menjaga intensitas πολλήν.
- source_word: ὑπεμείνατε
  choice: kamu bertahan
  rationale: Menyampaikan ketabahan dalam menghadapi penderitaan; pronomina 'kamu' dapat mencakup pembaca jamak sesuai konteks.
- source_word: παθημάτων
  choice: yang penuh penderitaan
  rationale: Genitif ini menjelaskan isi atau sifat pergumulan. Susunan ini lebih alami dalam bahasa Indonesia daripada 'pergumulan penderitaan'.
theological_decisions:
- issue: Makna φωτισθέντες dalam konteks peringatan dan nasihat
  choice: Mempertahankan metafora 'diterangi' tanpa mengidentifikasikannya dengan peristiwa doktrinal tertentu.
  alternative: sesudah bertobat; sesudah dibaptis; sesudah menerima terang Injil
  rationale: Ayat ini menyatakan bahwa para pembaca telah menerima penerangan, tetapi tidak menjelaskan apakah itu secara khusus menunjuk kepada pertobatan, baptisan, atau pengajaran iman.
- issue: Hubungan waktu partisip φωτισθέντες dengan ὑπεμείνατε
  choice: setelah diterangi
  alternative: ketika diterangi
  rationale: Partisip aoris dapat dipahami sebagai tindakan yang mendahului verba utama, tetapi hubungan waktunya tidak wajib dipersempit secara mutlak; alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan seruan untuk mengingat, metafora penerangan, serta gambaran perjuangan, tetapi menghindari kekakuan harfiah dan penafsiran denominatif.
