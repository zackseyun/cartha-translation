  yaml_path: translation/nt/hebrews/012/008.yaml
  text: But if you are without discipline, of which all have become sharers, then you are illegitimate children and not sons.
translation:
  language: id
  text: Namun, jika kamu tidak mendapat didikan, yang semua orang telah turut menerimanya, maka kamu adalah anak-anak tidak sah dan bukan anak-anak laki-laki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak tidak sah dan bukan anak-anak laki-laki.” Dalam konteksnya, ungkapan ini memakai gambaran status dalam keluarga.
    reason: Menjelaskan kontras νόθοι dan υἱοί serta bentuk maskulin υἱοί tanpa menggantinya dengan penafsiran “anak-anak sejati” dalam teks utama.
lexical_decisions:
- source_word: παιδείας
  choice: didikan
  rationale: Dalam konteks ini menunjuk pada pembinaan dan koreksi seorang ayah terhadap anaknya; 'didikan' mempertahankan cakupan itu secara alami dalam bahasa Indonesia.
- source_word: μέτοχοι γεγόνασι πάντες
  choice: yang dialami semua anak
  rationale: Secara harfiah berarti 'yang di dalamnya semua telah menjadi peserta'. Ungkapan ini dibuat alami dengan tetap menyatakan bahwa didikan tersebut merupakan pengalaman bersama semua anak; 'anak' disuplai dari konteks langsung.
- source_word: νόθοι
  choice: anak-anak yang tidak sah
  rationale: Menunjuk pada anak yang tidak diakui sebagai anak sah; pilihan ini menyampaikan kontras status keluarga tanpa memakai istilah penghinaan yang kasar.
- source_word: υἱοί
  choice: anak-anak sejati
  rationale: Secara leksikal berarti 'anak-anak laki-laki/putra-putra', tetapi dalam argumen ini menandakan anak yang sungguh diakui dalam keluarga. 'Sejati' memperjelas kontras dengan νόθοι tanpa membatasi penerapan kepada laki-laki.
theological_decisions:
- issue: Cakupan πάντες ('semua')
  choice: semua anak
  alternative: semua orang percaya
  rationale: Konteks analogi orang tua dan anak mendukung rujukan kepada semua yang berstatus anak, sementara terjemahan tidak secara eksplisit menyamakan mereka dengan kategori teologis yang lebih sempit.
- issue: Kontras νόθοι dan υἱοί
  choice: status sebagai anak tidak sah versus anak sejati
  alternative: anak haram versus anak laki-laki
  rationale: Pilihan ini mempertahankan inti kontras tentang pengakuan dan keanggotaan keluarga, sambil menghindari bahasa yang kini sangat menghina dan menghindari kesan bahwa ayat hanya berlaku bagi laki-laki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'kamu' dipahami sebagai jamak. Susunan kalimat dibuat alami tanpa menghilangkan logika bersyarat dan kontras tajam dalam teks Yunani.
