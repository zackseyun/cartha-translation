source:
  edition: SBLGNT
  text: ἀλλὰ προσεληλύθατε Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, Ἰερουσαλὴμ ἐπουρανίῳ, καὶ μυριάσιν ἀγγέλων, πανηγύρει
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/022.yaml
  text: But you have come to Mount Zion and to the city of the living God[a], the heavenly Jerusalem, and to myriads of angels in festal gathering[b],
translation:
  language: id
  text: Sebaliknya, kamu telah datang ke Gunung Sion, ke kota Allah yang hidup, yaitu Yerusalem surgawi, dan kepada berlaksa-laksa malaikat dalam perhimpunan meriah[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan kepada berlaksa-laksa malaikat, kepada suatu perhimpunan meriah.” Susunan bahasa Yunani memungkinkan “perhimpunan meriah” dihubungkan dengan para malaikat atau dipahami sebagai unsur tersendiri dalam deretan ini.
    reason: alternative_reading
  - marker: b
    text: Kata Yunaninya secara harfiah dapat menunjuk pada kelompok-kelompok sepuluh ribu, dan juga dapat digunakan lebih umum untuk jumlah yang tak terhitung banyaknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sebaliknya
  rationale: Menandai pertentangan kuat dengan pengalaman di Gunung Sinai dalam konteks sebelumnya; bentuk ini alami dalam bahasa Indonesia dan menonjolkan kontras.
- source_word: προσεληλύθατε
  choice: kamu telah datang
  rationale: Bentuk perfek menunjukkan tindakan mendekat yang telah terjadi dengan keadaan yang tetap berlaku sekarang; 'telah datang' mempertahankan daya ini.
- source_word: Σιὼν ὄρει
  choice: ke Gunung Sion
  rationale: Datif sesudah προσέρχομαι menyatakan tujuan pendekatan; 'Gunung Sion' adalah susunan nama yang baku dan alami.
- source_word: πόλει θεοῦ ζῶντος
  choice: ke kota Allah yang hidup
  rationale: Genitif menyatakan kepunyaan, sedangkan 'yang hidup' mempertahankan sebutan penting bagi Allah tanpa parafrasa tambahan.
- source_word: Ἰερουσαλὴμ ἐπουρανίῳ
  choice: yaitu Yerusalem surgawi
  rationale: Frasa ini merupakan aposisi bagi 'kota Allah yang hidup'; 'yaitu' memperjelas hubungan tersebut dalam bahasa Indonesia tanpa mengubah makna.
- source_word: μυριάσιν ἀγγέλων
  choice: kepada puluhan ribu malaikat
  rationale: μυριάς secara harfiah menunjuk pada satuan sepuluh ribu dan dalam bentuk jamak dapat menyatakan jumlah yang amat besar; pilihan ini mempertahankan citra numeriknya sambil tetap alami.
- source_word: πανηγύρει
  choice: dalam perhimpunan meriah
  rationale: πανήγυρις menunjuk pada pertemuan umum yang bersifat perayaan. Frasa ini dapat menerangkan kumpulan malaikat, tetapi hubungan sintaksisnya tetap diberi catatan.
theological_decisions:
- issue: Hubungan sintaksis πανηγύρει
  choice: 'Dipahami menerangkan bala malaikat: ''puluhan ribu malaikat dalam perhimpunan meriah.'''
  alternative: 'Dapat memulai unsur baru dalam deretan: ''kepada puluhan ribu malaikat, kepada suatu perhimpunan meriah''; mungkin juga dihubungkan dengan ἐκκλησίᾳ pada ayat 23.'
  rationale: Menghubungkannya dengan frasa yang langsung mendahului menghasilkan makna yang koheren dan sesuai dengan salah satu pemahaman utama atas susunan Yunani. Karena datif berderet memungkinkan analisis lain, ambiguitas itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kamu' dipakai sebagai bentuk jamak kontekstual yang mudah dipahami; struktur deretan dipertahankan. Kedua penanda catatan kaki ditempatkan sesudah frasa yang menjadi pokok kedua catatan.
