id: HEB.12.14
reference: Hebrews 12:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἰρήνην διώκετε μετὰ πάντων, καὶ τὸν ἁγιασμόν, οὗ χωρὶς οὐδεὶς ὄψεται τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/014.yaml
  text: Pursue peace with everyone[a], and the holiness without which no one will see the Lord.
translation:
  language: id
  text: Kejarlah perdamaian dengan semua orang dan kekudusan[a]; tanpa kekudusan, tidak seorang pun akan melihat Tuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengudusan.” Kata Yunani ini dapat menunjuk pada kekudusan sebagai keadaan atau corak hidup, ataupun pada proses dijadikan kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνην
  choice: perdamaian
  rationale: Dalam frasa μετὰ πάντων, kata ini menunjuk pada hubungan damai dengan semua orang, bukan sekadar ketenangan batin.
- source_word: διώκετε
  choice: Kejarlah
  rationale: Bentuk perintah ini menyiratkan usaha aktif dan tekun. “Kejarlah” mempertahankan daya ungkap tersebut sekaligus berlaku bagi perdamaian dan kekudusan.
- source_word: μετὰ πάντων
  choice: dengan semua orang
  rationale: Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan cakupan universal frasa Yunani.
- source_word: τὸν ἁγιασμόν
  choice: kekudusan
  rationale: ἁγιασμός dapat menunjuk pada kekudusan sebagai keadaan atau corak hidup, maupun pengudusan sebagai proses. “Kekudusan” jelas dan tidak terlalu teknis, sedangkan kemungkinan makna lainnya dicatat dalam catatan kaki.
- source_word: οὗ χωρὶς
  choice: tanpa kekudusan
  rationale: Pronomina relatif maskulin tunggal paling wajar merujuk kepada ἁγιασμός. Pengulangan “kekudusan” lebih alami dan jelas dalam bahasa Indonesia daripada “yang tanpanya”.
- source_word: οὐδεὶς
  choice: tidak seorang pun
  rationale: Ungkapan ini menyampaikan penyangkalan mutlak dari οὐδείς dengan ragam bahasa yang jelas dan bermartabat.
- source_word: ὄψεται
  choice: akan melihat
  rationale: Terjemahan langsung bentuk futurum ὁράω ini mempertahankan pernyataan sumber tanpa menambahkan penafsiran tentang hakikat penglihatan tersebut.
- source_word: τὸν κύριον
  choice: Tuhan
  rationale: Gelar κύριος diterjemahkan secara baku sebagai “Tuhan” tanpa mempersempit rujukannya melampaui teks Yunani.
theological_decisions:
- issue: Makna ἁγιασμός dalam nasihat ini
  choice: kekudusan
  alternative: pengudusan
  rationale: “Kekudusan” secara alami menyampaikan keadaan dan corak hidup kudus yang harus dikejar, sedangkan “pengudusan” dapat terdengar sebagai istilah teologis teknis. Catatan kaki mempertahankan kemungkinan nuansa keadaan atau proses.
- issue: Rujukan τὸν κύριον
  choice: Tuhan, tanpa penjelasan tambahan
  alternative: Allah atau Tuhan Yesus
  rationale: Teks Yunani hanya memakai gelar “Tuhan”; terjemahan tidak menetapkan rujukan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur paralel sumber dipertahankan dengan satu kata kerja perintah yang menguasai dua objek. Tanda titik koma menandai hubungan erat antara nasihat dan penegasan berikutnya.
