id: HEB.12.29
reference: Hebrews 12:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ θεὸς ἡμῶν πῦρ καταναλίσκον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/029.yaml
  text: For our God is a consuming fire[a][b].
translation:
  language: id
  text: Sebab Allah kita adalah api yang menghanguskan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini menggemakan Ulangan 4:24, yang menggambarkan TUHAN, Allahmu, sebagai “api yang menghanguskan.”
    reason: cross_reference
  - marker: b
    text: Atau “api yang melalap habis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sebab
  rationale: γὰρ menghubungkan ayat ini sebagai alasan bagi peringatan sebelumnya. καὶ memperkuat hubungan itu, tetapi tidak perlu diterjemahkan tersendiri karena akan terasa kaku dalam bahasa Indonesia.
- source_word: ὁ θεὸς ἡμῶν
  choice: Allah kita
  rationale: Ungkapan milik ini alami dalam bahasa Indonesia dan mempertahankan nuansa komunal serta relasional dari teks Yunani.
- source_word: πῦρ
  choice: api
  rationale: Terjemahan harfiah ini mempertahankan metafora dan gema Kitab Ulangan 4:24.
- source_word: καταναλίσκον
  choice: yang menghanguskan
  rationale: Partisipel kini aktif ini menerangkan api sebagai sesuatu yang menghabiskan atau memusnahkan. 'Menghanguskan' merupakan ungkapan Indonesia yang alami, kuat, dan sesuai dengan citra api, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Penggambaran metaforis Allah sebagai api
  choice: 'Mempertahankan metafora langsung: ''Allah kita adalah api yang menghanguskan'''
  alternative: Allah kita seperti api yang menghanguskan
  rationale: Bahasa Yunani memakai klausa ekuatif tanpa penanda perbandingan. Metafora langsung mempertahankan daya peringatan dan hubungan antarteks dengan Ulangan 4:24 tanpa melunakkannya menjadi perumpamaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Susunan predikatif langsung dipertahankan agar kekuatan metafora Yunani tidak berkurang.
