  text: You have not yet resisted to the point of shedding blood in your struggle against sin,[a]
translation:
  language: id
  text: Dalam pergumulanmu melawan dosa, kamu belum melawan sampai darahmu tertumpah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Kamu belum melawan sampai darah.” Ungkapan Yunani ini berarti melawan hingga taraf pertumpahan darah.'
