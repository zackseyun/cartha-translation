lexical_decisions:
- source_word: οὔπω
  choice: belum
  rationale: Adverbia temporal ini menunjukkan bahwa batas yang disebutkan belum dicapai; “belum” adalah padanan Indonesia yang paling alami.
- source_word: μέχρις αἵματος
  choice: sampai darahmu tertumpah
  rationale: Ungkapan ini menyatakan perlawanan hingga taraf pertumpahan darah, baik berupa luka berat maupun kematian. Rumusan ini alami dalam bahasa Indonesia dan tetap mempertahankan citra darah.
- source_word: ἀντικατέστητε
  choice: kamu ... melawan
  rationale: Verba aoristus orang kedua jamak ini berarti berdiri menentang atau memberikan perlawanan. “Melawan” cocok dengan gambaran pertarungan dalam ayat ini.
- source_word: πρὸς τὴν ἁμαρτίαν
  choice: melawan dosa
  rationale: πρός dengan akusatif menyatakan arah pertentangan. “Dosa” dibiarkan umum sebagaimana teks Yunani, tanpa mempersempit rujukannya.
- source_word: ἀνταγωνιζόμενοι
  choice: dalam pergumulanmu
  rationale: Partisipel kini ini memakai istilah pertandingan atau pertarungan dan menerangkan konteks perlawanan yang terus berlangsung. “Dalam pergumulanmu” menyampaikan nuansa tersebut secara wajar.
theological_decisions:
- issue: Rujukan “dosa” dalam konteks
  choice: Diterjemahkan secara umum sebagai “dosa”
  alternative: Perlawanan berdosa dari para penganiaya; dosa secara umum; godaan untuk meninggalkan iman
  rationale: Konteks berbicara tentang ketekunan menghadapi permusuhan sekaligus penolakan terhadap dosa, tetapi ayat ini tidak membatasi rujukannya. Terjemahan mempertahankan ketegangan tersebut.
- issue: Arti batas “sampai darah”
  choice: Perlawanan hingga darah tertumpah
  alternative: Secara khusus berarti kemartiran; atau secara umum luka berdarah
  rationale: Bahasa Yunani menyatakan batas berupa darah tanpa memastikan apakah yang dimaksud hanya kematian atau juga cedera akibat penganiayaan. Rumusan ini tidak mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Bentuk “kamu” dipakai untuk orang kedua jamak sesuai konteks pembaca sebagai komunitas; frasa “darahmu tertumpah” memperjelas idiom Yunani tanpa menentukan apakah akibatnya luka atau kematian.
