  terminology: '"Sangkakala" cocok untuk register Alkitab. "Perkataan" untuk λόγον mempertahankan arti dasar tanpa menambahkan penandaan teologis yang tidak ada pada kata Yunani itu sendiri; konteks ilahi tetap jelas dari konteks Sinai dan catatan silang.'
