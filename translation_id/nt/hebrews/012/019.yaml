  text: καὶ σάλπιγγος ἤχῳ καὶ φωνῇ ῥημάτων, ἧς οἱ ἀκούσαντες παρῃτήσαντο ⸀μὴ προστεθῆναι αὐτοῖς λόγον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/019.yaml
  text: and to the sound of a trumpet and to a voice of words[b][a], whose hearers begged that no further word be spoken to them.
translation:
  language: id
  text: dan kepada bunyi sangkakala serta suara yang mengucapkan kata-kata,[b][a] yang didengar oleh mereka yang memohon agar tidak ada lagi perkataan disampaikan kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, klausa "yang didengar oleh mereka yang memohon" dapat dipahami merujuk lebih luas kepada seluruh peristiwa di Sinai, bukan hanya kepada suara tersebut.
    reason: alternative_reading
  - marker: b
    text: Lihat Keluaran 20:18–19 dan Ulangan 5:23–27 tentang permohonan bangsa Israel agar mereka tidak lagi mendengar suara Allah secara langsung.
    reason: cross_reference
lexical_decisions:
- source_word: σάλπιγγος ἤχῳ
  choice: bunyi sangkakala
  rationale: Menyatakan fenomena bunyi di Sinai secara konkret dan dekat dengan ἦχος, dengan diksi Alkitabiah Indonesia yang tetap mudah dipahami.
- source_word: φωνῇ ῥημάτων
  choice: suara yang mengucapkan kata-kata
  rationale: Ungkapan ini mempertahankan perbedaan antara bunyi sangkakala dan ujaran yang dapat dipahami, sambil menyampaikan konstruksi Yunani yang tidak lazim dalam bahasa Indonesia alami.
- source_word: ἧς
  choice: yang membuat
  rationale: Klausa relatif dihubungkan terutama dengan 'suara' sebagai anteseden feminin tunggal terdekat. Bentuk ini alami dalam bahasa Indonesia tanpa memaksakan kepemilikan yang tidak idiomatis.
- source_word: οἱ ἀκούσαντες
  choice: orang-orang yang mendengarnya
  rationale: Mewakili partisip substantival secara jelas dan alami serta mempertahankan tindakan mendengar.
- source_word: παρῃτήσαντο
  choice: memohon
  rationale: Dalam konteks Sinai, verba ini menyatakan permintaan sungguh-sungguh agar dibebaskan dari mendengar sapaan langsung lebih lanjut; 'memohon' menangkap urgensinya tanpa menjadi berlebihan.
- source_word: μὴ προστεθῆναι αὐτοῖς λόγον
  choice: agar tidak ada lagi firman yang disampaikan kepada mereka
  rationale: Menyampaikan idiom 'tidak ditambahkan lagi' sebagai penghentian perkataan lebih lanjut, mempertahankan nuansa pasif dan memakai 'firman' karena konteksnya adalah perkataan ilahi.
theological_decisions:
- issue: Rujukan klausa relatif ἧς
  choice: Dalam teks utama, klausa terutama dikaitkan dengan 'suara yang mengucapkan kata-kata'.
  alternative: Klausa dapat dipahami merujuk lebih luas kepada seluruh pengalaman di Sinai, termasuk bunyi sangkakala dan suara itu.
  rationale: Secara gramatikal, bentuk feminin tunggal paling wajar merujuk kepada φωνῇ, anteseden terdekat. Namun, konteks memungkinkan cakupan yang lebih luas, sehingga kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Sangkakala' dipertahankan sebagai istilah yang lazim dalam konteks Alkitab, sedangkan susunan 'suara yang mengucapkan kata-kata' dipilih agar ungkapan Yunani yang khas tetap terasa tanpa menjadi janggal.
