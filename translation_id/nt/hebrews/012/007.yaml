  text: εἰς παιδείαν ὑπομένετε· ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός· τίς ⸀γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/007.yaml
  text: Endure for discipline[a]; God is dealing with you as with sons[b]. For what son is there whom a father does not discipline?
translation:
  language: id
  text: Bertekunlah demi didikan[a]; Allah memperlakukan kamu sebagai anak-anak lelaki[b]. Sebab, adakah anak lelaki yang tidak dididik oleh seorang ayah?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tanggunglah ini sebagai didikan.” Bentuk Yunani ὑπομένετε juga dapat dibaca sebagai pernyataan, “Kamu bertekun demi didikan.”
    reason: alternative_reading
  - marker: b
    text: Bahasa Yunani memakai “anak-anak lelaki” dalam analogi ayah dan anak lelaki; penerapan analogi ini tidak terbatas pada laki-laki.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς παιδείαν
  choice: demi didikan
  rationale: 'Frasa ini paling wajar dipahami secara tujuan atau hasil: ketekunan mereka berkaitan dengan didikan yang membentuk. ''Demi didikan'' mempertahankan susunan ringkas dan tidak menambahkan objek yang tidak dinyatakan.'
- source_word: ὑπομένετε
  choice: Bertekunlah
  rationale: Bentuk ini dapat dibaca sebagai indikatif atau imperatif, tetapi dalam konteksnya paling alami sebagai nasihat. 'Bertekunlah' menyampaikan daya tahan yang terus-menerus tanpa menambahkan objek.
- source_word: ὡς υἱοῖς
  choice: sebagai anak-anak-Nya
  rationale: Ungkapan ini menyatakan cara Allah memperlakukan para pembaca dalam hubungan keluarga. 'Anak-anak-Nya' alami dalam bahasa Indonesia dan akhiran '-Nya' memperjelas relasi dengan Allah yang tersirat oleh analogi.
- source_word: προσφέρεται
  choice: memperlakukan
  rationale: Dalam konteks ini verba tersebut bersifat idiomatis dan berarti bertindak atau bersikap terhadap seseorang dengan cara tertentu. 'Memperlakukan' menyampaikan relasi itu secara jelas.
- source_word: τίς γὰρ υἱὸς
  choice: Sebab, adakah anak
  rationale: Rumusan ini mempertahankan pertanyaan retoris yang mengacu pada praktik umum seorang ayah terhadap anaknya.
- source_word: ὃν οὐ παιδεύει πατήρ
  choice: yang tidak dididik oleh ayahnya
  rationale: '''Dididik'' menjaga hubungan leksikal dengan ''didikan'' dan mencakup pembentukan serta koreksi. ''Ayahnya'' merupakan ungkapan Indonesia yang alami untuk relasi yang dimaksud, meskipun pronomina posesif tidak dinyatakan secara eksplisit dalam bahasa Yunani.'
theological_decisions:
- issue: Bahasa keluarga yang bergender dalam analogi ayah-anak
  choice: Menggunakan 'anak-anak' dan 'anak' dalam teks utama, dengan catatan bahwa bahasa Yunani secara harfiah berbunyi 'anak-anak lelaki' dan 'anak lelaki'.
  alternative: Memakai 'anak-anak lelaki' dan 'anak lelaki' dalam teks utama.
  rationale: υἱός memang maskulin dan analoginya mempertahankan sosok ayah, tetapi dalam bahasa Indonesia 'anak' lazim mencakup putra dalam analogi tersebut serta menghindari kesan keliru bahwa penerapannya hanya bagi laki-laki. Catatan kaki mempertahankan bentuk gender sumber dan ketegangan interpretatifnya.
- issue: Daya imperatif atau indikatif ὑπομένετε
  choice: 'Menerjemahkannya sebagai nasihat: ''Bertekunlah''.'
  alternative: 'Menerjemahkannya sebagai pernyataan: ''Kamu sedang bertekun''.'
  rationale: Bentuk Yunani dapat berfungsi sebagai indikatif atau imperatif, tetapi alur nasihat dalam konteks mendukung pembacaan imperatif. Ambiguitas yang nyata dicatat dalam catatan kaki.
- issue: Hubungan εἰς παιδείαν dengan ὑπομένετε
  choice: Menerjemahkan 'demi didikan'.
  alternative: 'Memahami apa yang dialami sebagai didikan: ''Tanggunglah ini sebagai didikan''.'
  rationale: εἰς dapat menunjukkan tujuan atau hasil, tetapi konstruksinya juga dapat dipahami sebagai ajakan untuk menilai penderitaan yang ditanggung sebagai didikan. Teks utama mempertahankan rumusan singkat dan catatan kaki menyajikan alternatif tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang bermartabat. 'Didikan/dididik' dipakai secara konsisten untuk mempertahankan hubungan παιδεία–παιδεύει. Rumusan dibuat alami bagi pembaca umum tanpa menghilangkan alternatif sintaksis Yunani, yang disajikan dalam catatan kaki.
