base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/020.yaml
  text: 'For they could not endure what was being commanded: “If even an animal touches the mountain[a], it will be stoned.”'
translation:
  language: id
  text: 'Sebab mereka tidak sanggup menanggung apa yang diperintahkan: “Jika seekor binatang pun menyentuh gunung itu[a], binatang itu akan dirajam.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian naskah menambahkan, “atau dipanah,” menggemakan Keluaran 19:12–13.
    reason: textual_variant
lexical_decisions:
- source_word: οὐκ ἔφερον
  choice: mereka tidak sanggup menanggung
  rationale: Dalam konteks ini, φέρω dengan penyangkalan berarti menanggung atau tahan menghadapi sesuatu. Ungkapan ini menyampaikan ketidakmampuan mereka menghadapi perintah tersebut.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ menghubungkan ayat ini dengan konteks sebelumnya sebagai penjelasan atau alasan.
- source_word: τὸ διαστελλόμενον
  choice: perintah yang diberikan
  rationale: Bentuk partisip ini menunjuk pada sesuatu yang diperintahkan secara berwibawa. Terjemahan ini alami dalam bahasa Indonesia dan tetap mempertahankan nuansa tindakan memberi perintah.
- source_word: Κἂν
  choice: Bahkan jika
  rationale: κἄν memperkenalkan syarat dengan penekanan bahwa ketentuan tersebut berlaku bahkan terhadap seekor binatang.
- source_word: θηρίον
  choice: seekor binatang
  rationale: θηρίον dapat berarti binatang atau binatang buas. Dalam konteks ini, istilah umum 'binatang' paling tepat dan tidak membatasi maknanya pada hewan liar.
- source_word: θίγῃ
  choice: menyentuh
  rationale: Aoris subjungtif dalam klausa bersyarat ini secara alami diterjemahkan dengan bentuk kini sederhana dalam bahasa Indonesia.
- source_word: τοῦ ὄρους
  choice: gunung itu
  rationale: Konteks menunjukkan gunung yang telah disebut, yaitu Sinai, tetapi teks Yunani hanya menyebut 'gunung'; 'gunung itu' merupakan padanan Indonesia yang wajar tanpa menambahkan nama.
- source_word: λιθοβοληθήσεται
  choice: binatang itu harus dirajam
  rationale: Pasif futuristis dalam kutipan perintah menyatakan akibat yang diwajibkan. 'Harus dirajam' terdengar alami dalam bahasa Indonesia dan mempertahankan daya hukum perintah tersebut; subjek diulang agar rujukan pronominal jelas.
theological_decisions:
- issue: Hubungan kutipan ini dengan perintah di Sinai
  choice: Menerjemahkan hanya bunyi yang terdapat dalam teks SBLGNT, yakni bahwa binatang yang menyentuh gunung itu harus dirajam.
  alternative: Menambahkan frasa 'atau dipanah' berdasarkan sebagian tradisi naskah dan gema Keluaran 19:12–13.
  rationale: Teks Yunani yang diberikan berakhir dengan λιθοβοληθήσεται. Terjemahan utama tidak menyelaraskannya dengan bentuk kutipan yang lebih panjang, sedangkan variannya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan khidmat. 'Dirajam' dipertahankan sebagai istilah yang ringkas dan lazim untuk hukuman mati dengan lemparan batu. Penanda catatan kaki ditempatkan sesudah 'gunung itu' sesuai letak varian yang berkaitan dengan kelanjutan kutipan.
