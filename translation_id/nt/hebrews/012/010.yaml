id: HEB.12.10
reference: Hebrews 12:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ μὲν γὰρ πρὸς ὀλίγας ἡμέρας κατὰ τὸ δοκοῦν αὐτοῖς ἐπαίδευον, ὁ δὲ ἐπὶ τὸ συμφέρον εἰς τὸ μεταλαβεῖν τῆς ἁγιότητος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/010.yaml
  text: For they disciplined us for a few days as seemed best to them[a], but he does so for our benefit[b], so that we may share in his holiness.
translation:
  language: id
  text: Sebab mereka mendisiplinkan kita selama beberapa hari[a] menurut apa yang mereka anggap baik[b], tetapi Dia mendisiplinkan kita demi kebaikan kita, supaya kita mengambil bagian dalam kekudusan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk waktu yang singkat.” Ungkapan Yunani ini menekankan terbatasnya masa disiplin oleh ayah duniawi.
    reason: lexical_alternative
  - marker: b
    text: Atau “menurut apa yang mereka pandang benar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὀλίγας ἡμέρας
  choice: selama beberapa hari
  rationale: Ungkapan ini secara harfiah menunjuk pada beberapa hari dan secara idiomatis menekankan singkat serta terbatasnya masa disiplin oleh ayah duniawi. Terjemahan utama mempertahankan gambaran waktunya, sedangkan nuansa idiomatis dicatat dalam catatan kaki.
- source_word: κατὰ τὸ δοκοῦν αὐτοῖς
  choice: menurut apa yang mereka anggap baik
  rationale: Frasa ini menyatakan penilaian subjektif para ayah tentang apa yang mereka pandang tepat atau baik, tanpa memastikan bahwa penilaian mereka selalu benar.
- source_word: ἐπαίδευον
  choice: mendisiplinkan
  rationale: Dalam konteks Ibrani 12, kata ini mencakup didikan, pelatihan, dan koreksi sebagai orang tua, bukan sekadar hukuman.
- source_word: ὁ δὲ
  choice: tetapi Dia mendisiplinkan kita
  rationale: Subjek tunggal yang tersirat adalah Allah, yang dikontraskan dengan para ayah duniawi. Pengulangan kata kerja membuat elipsis Yunani terdengar alami dalam bahasa Indonesia tanpa mengganti pronomina dengan nama eksplisit.
- source_word: ἐπὶ τὸ συμφέρον
  choice: demi kebaikan kita
  rationale: Frasa ini menyatakan tujuan yang diarahkan pada manfaat kita. 'Demi kebaikan kita' alami dan mempertahankan unsur tujuan.
- source_word: εἰς τὸ μεταλαβεῖν
  choice: supaya kita mengambil bagian dalam
  rationale: Konstruksi ini menyatakan tujuan atau hasil, sedangkan μεταλαμβάνω berarti turut memperoleh atau mengambil bagian dalam sesuatu.
- source_word: ἁγιότητος αὐτοῦ
  choice: kekudusan-Nya
  rationale: Terjemahan ini mempertahankan kekudusan sebagai sifat milik Allah yang di dalamnya umat-Nya dimaksudkan untuk mengambil bagian, tanpa menentukan mekanisme teologisnya.
theological_decisions:
- issue: Rujukan subjek tunggal ὁ δὲ
  choice: Allah dirujuk dengan pronomina 'Dia', sesuai bentuk implisit teks Yunani.
  alternative: Menyebut 'Allah' secara eksplisit demi kejelasan.
  rationale: Konteks Ibrani 12:5–11 sudah memperlihatkan kontras antara ayah duniawi dan Allah sebagai Bapa. Pronomina mempertahankan keimplisitan teks sumber dan tetap jelas dalam konteks.
- issue: Makna mengambil bagian dalam kekudusan-Nya
  choice: Penerima disiplin Allah mengambil bagian dalam kekudusan milik-Nya.
  alternative: Menentukan frasa ini hanya sebagai kekudusan status atau hanya sebagai proses pengudusan bertahap.
  rationale: Ayat ini menyatakan tujuan disiplin ilahi, tetapi tidak merinci cara atau tahapan partisipasi tersebut. Terjemahan mempertahankan bobot dan keterbukaan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Mendisiplinkan' dipakai secara konsisten untuk cakupan didikan orang tua dalam konteks ini. Kapitalisasi 'Dia' dan '-Nya' menandai rujukan kepada Allah menurut kebiasaan penerbitan Alkitab bahasa Indonesia.
