  source_fidelity: Teks Indonesia secara setia menerjemahkan kontras temporal πρὸς μὲν τὸ παρόν ... ὕστερον, nuansa perseptif οὐ δοκεῖ melalui “tampaknya,” serta hasil παιδεία bagi orang-orang yang telah dilatih olehnya. “Pada saat dijalani” secara wajar mengungkapkan perspektif sementara ketika didikan berlangsung.
