id: HEB.12.11
reference: Hebrews 12:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πᾶσα ⸀δὲ παιδεία πρὸς μὲν τὸ παρὸν οὐ δοκεῖ χαρᾶς εἶναι ἀλλὰ λύπης, ὕστερον δὲ καρπὸν εἰρηνικὸν τοῖς δι’ αὐτῆς γεγυμνασμένοις ἀποδίδωσιν δικαιοσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/011.yaml
  text: All discipline seems for the present to be not joy but sorrow[a]; yet later it yields the peaceful fruit of righteousness to those who have been trained by it.
translation:
  language: id
  text: Setiap didikan, pada saat dijalani, tampaknya tidak mendatangkan sukacita, melainkan dukacita. Namun kemudian, didikan itu menghasilkan buah kebenaran yang penuh damai[a] bagi mereka yang telah dilatih olehnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan.” Kata Yunani yang dipakai dapat berarti kebenaran atau keadilan; di sini kemungkinan besar yang dimaksud ialah kelurusan hidup yang dihasilkan oleh didikan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεία
  choice: didikan
  rationale: Dalam konteks Ibrani 12, kata ini mencakup pembentukan, pelatihan, dan koreksi oleh Allah sebagai Bapa. “Didikan” mempertahankan keluasan makna itu tanpa menyempitkannya menjadi hukuman semata.
- source_word: πρὸς μὲν τὸ παρόν
  choice: pada saat dijalani
  rationale: Ungkapan ini menunjuk pada pengalaman saat didikan sedang berlangsung dan membentuk kontras alami dengan ὕστερον, “kemudian”.
- source_word: οὐ δοκεῖ
  choice: tampaknya
  rationale: Pilihan ini mempertahankan sudut pandang pengalaman manusia dan tidak mengubah pernyataan tentang kesan menjadi penilaian mutlak.
- source_word: χαρᾶς ... ἀλλὰ λύπης
  choice: tidak mendatangkan sukacita, melainkan dukacita
  rationale: Kedua nomina Yunani tetap diungkapkan sebagai “sukacita” dan “dukacita”; verba “mendatangkan” membuat susunannya wajar dalam bahasa Indonesia tanpa mempersempit λύπη menjadi rasa sakit jasmani.
- source_word: ὕστερον
  choice: kemudian
  rationale: Menyatakan hasil yang muncul sesudah masa didikan dan mempertahankan kontras waktunya.
- source_word: καρπὸν εἰρηνικόν
  choice: buah ... yang penuh damai
  rationale: Mempertahankan metafora buah serta sifatnya yang bercirikan damai, tanpa membatasi makna menjadi buah yang hanya menyebabkan kedamaian.
- source_word: γεγυμνασμένοις
  choice: mereka yang telah dilatih
  rationale: Bentuk perfektif pasif menunjukkan orang-orang yang telah dibentuk melalui latihan. “Dilatih” juga mempertahankan nuansa metafora latihan dari γυμνάζω.
- source_word: ἀποδίδωσιν
  choice: menghasilkan
  rationale: Dalam konteks ini, didikan memberikan hasil; pilihan ini alami dengan metafora “buah”.
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: Di sini kata tersebut terutama menunjuk pada kelurusan hidup yang dihasilkan oleh didikan Allah. Alternatif “keadilan” tetap dicatat karena termasuk dalam jangkauan makna katanya.
theological_decisions:
- issue: Makna παιδεία sebagai tindakan Allah terhadap orang percaya
  choice: didikan yang membentuk, termasuk pelatihan dan koreksi
  alternative: hukuman; pengajaran saja
  rationale: Konteks Ibrani 12:5–10 menggambarkannya sebagai tindakan seorang bapa yang bertujuan menghasilkan kekudusan dan kedewasaan. “Didikan” mempertahankan unsur kasih sekaligus koreksi tanpa menjadikannya pembalasan semata.
- issue: Makna δικαιοσύνης
  choice: kebenaran
  alternative: keadilan
  rationale: Dalam konteks hasil didikan, “kebenaran” paling wajar menunjuk pada keadaan dan perilaku yang lurus di hadapan Allah. Kemungkinan leksikal “keadilan” dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur kalimat dibuat alami sambil mempertahankan kontras antara pengalaman didikan saat ini dan hasilnya kemudian. Penanda catatan kaki ditempatkan langsung sesudah frasa yang menerjemahkan δικαιοσύνης.
