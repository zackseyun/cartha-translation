  terminology: “Didikan” mempertahankan cakupan παιδεία sebagai pembentukan dan koreksi, bukan hukuman semata. “Buah kebenaran yang penuh damai” mempertahankan metafora καρπός, sifat εἰρηνικός, dan δικαιοσύνη sebagai “kebenaran.” Catatan kaki “keadilan” adalah alternatif leksikal yang sah dan penandanya ditempatkan tepat pada terjemahan δικαιοσύνης.
