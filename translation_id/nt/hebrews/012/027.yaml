  to: Ungkapan “Sekali lagi” ini menunjukkan penyingkiran hal-hal yang sedang diguncangkan—sebagai hal-hal yang telah dijadikan[a]—supaya hal-hal yang tidak diguncangkan[b] tetap ada.
