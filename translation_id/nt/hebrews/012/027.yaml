  text: τὸ δὲ Ἔτι ἅπαξ δηλοῖ ⸂τῶν σαλευομένων⸃ μετάθεσιν ὡς πεποιημένων, ἵνα μείνῃ τὰ μὴ σαλευόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/027.yaml
  text: This phrase, “Yet once more,” indicates the removal of the things being shaken—as things that have been made—so that the things not being shaken may remain.
translation:
  language: id
  text: Ungkapan “Sekali lagi” ini menunjukkan penyingkiran hal-hal yang sedang diguncangkan—sebagai hal-hal yang telah dijadikan[a]—supaya hal-hal yang tidak diguncangkan[b] tetap ada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai ciptaan.” Secara harfiah, bahasa Yunani berbunyi “sebagai hal-hal yang telah dijadikan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “hal-hal yang tidak dapat diguncangkan” atau “apa yang tak terguncangkan.”
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ δὲ Ἔτι ἅπαξ
  choice: Ungkapan “Sekali lagi” ini
  rationale: Artikel netral menominalkan kutipan Ἔτι ἅπαξ, sehingga penulis sedang merujuk pada ungkapan itu sendiri. δέ bersifat penghubung ringan dan tidak perlu diterjemahkan dengan kata pembuka tersendiri.
- source_word: δηλοῖ
  choice: menunjukkan
  rationale: Kata ini memperkenalkan kesimpulan yang ditarik dari ungkapan yang dikutip; “menunjukkan” alami dan jelas dalam bahasa Indonesia.
- source_word: τῶν σαλευομένων
  choice: hal-hal yang sedang diguncangkan
  rationale: Partisipel pasif kini dipertahankan untuk menggambarkan hal-hal dalam proses diguncangkan dan untuk menjaga kesejajarannya dengan frasa penutup.
- source_word: μετάθεσιν
  choice: akan disingkirkan
  rationale: Dalam konteks ini μετάθεσις menunjuk pada penyingkiran hal-hal yang dapat diguncangkan, bukan sekadar perubahan. Bentuk verbal pasif menghasilkan kalimat Indonesia yang lebih alami tanpa mengubah hubungan makna.
- source_word: ὡς πεποιημένων
  choice: sebagai hal-hal yang telah dijadikan
  rationale: “Sebagai” mempertahankan ὡς, sedangkan “telah dijadikan” mencerminkan partisipel perfek pasif dan tidak mempersempit maknanya secara diam-diam menjadi istilah teologis yang lebih khusus.
- source_word: ἵνα μείνῃ
  choice: supaya ... tetap ada
  rationale: “Supaya” menyampaikan tujuan atau hasil dari ἵνα, dan “tetap ada” secara wajar menyatakan makna bertahan dari μένω.
- source_word: τὰ μὴ σαλευόμενα
  choice: hal-hal yang tidak diguncangkan
  rationale: Terjemahan ini mempertahankan kontras formal antara partisipel “yang sedang diguncangkan” dan “yang tidak diguncangkan,” tanpa memasukkan gagasan ketidakmampuan secara eksplisit.
theological_decisions:
- issue: Apakah τὰ μὴ σαλευόμενα diterjemahkan secara interpretatif sebagai hal-hal yang tidak dapat diguncangkan atau secara lebih formal sebagai hal-hal yang tidak diguncangkan
  choice: hal-hal yang tidak diguncangkan
  alternative: hal-hal yang tidak dapat diguncangkan; apa yang tak terguncangkan
  rationale: Bahasa Yunani ayat ini memakai μή dengan partisipel, bukan istilah eksplisit yang menyatakan ketidakmampuan. Pilihan ini menjaga ketegangan teks dan tidak mendahului bahasa tentang kerajaan yang tidak terguncangkan dalam ayat berikutnya.
- issue: Nuansa ὡς πεποιημένων
  choice: sebagai hal-hal yang telah dijadikan
  alternative: yaitu, hal-hal yang telah dijadikan; sebagai ciptaan
  rationale: “Sebagai” mempertahankan kemungkinan bahwa frasa tersebut menandai status atau kategori hal-hal yang diguncangkan, alih-alih mengubahnya tanpa penanda menjadi penjelasan identik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat menjaga pengulangan serta kontras retoris antara yang sedang diguncangkan dan yang tidak diguncangkan. Penanda catatan kaki [a] dan [b] dicantumkan dalam teks utama.
