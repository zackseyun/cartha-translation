revisions:
- from: Selain itu, kita dahulu mempunyai ayah-ayah jasmani[a] yang mendisiplinkan kita, dan kita menghormati mereka. Bukankah kita harus jauh lebih tunduk kepada Bapa segala roh[b], supaya kita hidup?
  to: Selain itu, kita dahulu mempunyai para ayah jasmani kita yang mendisiplinkan kita, dan kita menghormati mereka. Bukankah kita seharusnya lebih lagi tunduk kepada Bapa roh-roh[b] dan kita akan hidup?
  rationale: Teks direvisi untuk mempertahankan koordinasi dan nuansa masa depan pada “dan kita akan hidup,” tanpa mengubahnya menjadi tujuan. “Bapa roh-roh” mempertahankan bentuk jamak serta keluasan τῶν πνευμάτων tanpa penambahan “segala.” “Para ayah jasmani kita” memperbaiki keluwesan bahasa Indonesia. Penanda catatan a dipertahankan pada frasa yang relevan.
