  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶτα τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας εἴχομεν παιδευτὰς καὶ ἐνετρεπόμεθα· οὐ ⸀πολὺ μᾶλλον ὑποταγησόμεθα τῷ πατρὶ τῶν πνευμάτων καὶ ζήσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/009.yaml
  text: Furthermore[a], we had our earthly fathers as disciplinarians, and we respected them[c][b]. Shall we not much more submit to the Father of spirits and live?
translation:
  language: id
  text: Selain itu, kita dahulu mempunyai para ayah jasmani kita yang mendisiplinkan kita, dan kita menghormati mereka. Bukankah kita seharusnya lebih lagi tunduk kepada Bapa roh-roh[b] dan kita akan hidup?
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ungkapan ini dapat secara khusus berarti “Bapa roh kita”, tetapi bahasa Yunani menyatakannya secara lebih luas.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: Selain itu
  rationale: Di sini kata ini menambahkan alasan dalam argumen dari yang lebih kecil kepada yang lebih besar, bukan terutama menunjukkan urutan waktu.
- source_word: τοὺς τῆς σαρκὸς ἡμῶν πατέρας
  choice: ayah-ayah jasmani kita
  rationale: Ungkapan harfiahnya adalah ‘ayah-ayah dari daging kita’ dan menunjuk kepada ayah manusiawi dalam kontras dengan Bapa segala roh. ‘Jasmani’ mempertahankan kontras itu tanpa memberi σάρξ arti ‘natur berdosa’.
- source_word: παιδευτὰς
  choice: yang mendisiplinkan kita
  rationale: Bentuk verbal ini lebih alami dalam bahasa Indonesia daripada sebutan seperti ‘pendisiplin’, sekaligus mempertahankan kaitan dengan tema didikan/disiplin dalam konteks Ibrani 12.
- source_word: ἐνετρεπόμεθα
  choice: kita menghormati mereka
  rationale: Dalam konteks ini verba tersebut menyatakan sikap segan dan hormat terhadap para ayah yang mendisiplinkan.
- source_word: οὐ πολὺ μᾶλλον
  choice: Bukankah kita harus jauh lebih
  rationale: Merangkum daya pertanyaan retoris dan perbandingan a fortiori dalam bahasa Indonesia yang alami.
- source_word: ὑποταγησόμεθα
  choice: tunduk
  rationale: Future pasif Yunani secara idiomatis menyatakan penundukan diri sebagai tanggapan yang semestinya; ‘tunduk’ jelas dan wajar dalam bahasa Indonesia.
- source_word: τῷ πατρὶ τῶν πνευμάτων
  choice: kepada Bapa segala roh
  rationale: Mempertahankan bentuk genitif dan keluasan ungkapan Yunani tanpa membatasinya menjadi hanya ‘Bapa roh kita’ atau hanya Bapa makhluk-makhluk rohani.
- source_word: καὶ ζήσομεν
  choice: supaya kita hidup
  rationale: Dalam pertanyaan retoris ini καί menghubungkan ketundukan dengan hasil berupa hidup. ‘Supaya’ menyampaikan hubungan tujuan/hasil secara alami, meskipun ‘dan kita akan hidup’ tetap mungkin secara lebih harfiah.
theological_decisions:
- issue: Makna ‘Bapa segala roh’
  choice: Ungkapan luas yang menyebut Allah sebagai Bapa dalam kaitan dengan roh-roh, dengan kontras utama terhadap ayah jasmani.
  alternative: ‘Bapa roh kita’ secara khusus, atau ‘Bapa makhluk-makhluk rohani’ secara umum.
  rationale: Bahasa Yunani tidak memuat kata ‘kita’ dan tidak menentukan secara eksplisit cakupan ‘roh-roh’. Terjemahan utama mempertahankan keluasan dan ketegangan teologis tersebut.
- issue: Hubungan ‘tunduk’ dengan ‘hidup’
  choice: ‘supaya kita hidup’
  alternative: ‘dan kita akan hidup’
  rationale: Konteks mendukung hidup sebagai hasil dari ketundukan kepada Allah. Pilihan ini tidak menetapkan secara lebih sempit apakah ‘hidup’ terutama menunjuk kepada kehidupan sekarang, kehidupan rohani, atau kehidupan kekal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Ayah-ayah jasmani’ dipilih untuk menjaga kontras sumber tanpa terdengar terlalu teknis; susunan pertanyaan retoris dipertahankan agar daya argumennya tetap terasa.
