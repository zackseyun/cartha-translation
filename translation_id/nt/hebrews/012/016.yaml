id: HEB.12.16
reference: Hebrews 12:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μή τις πόρνος ἢ βέβηλος ὡς Ἠσαῦ, ὃς ἀντὶ βρώσεως μιᾶς ἀπέδετο τὰ πρωτοτόκια ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/016.yaml
  text: that no one be sexually immoral or godless like Esau, who sold his own birthright for a single meal.
translation:
  language: id
  text: Jangan sampai ada seorang pun yang hidup dalam percabulan atau tidak menghormati hal-hal suci seperti Esau, yang menjual hak kesulungannya sendiri demi seporsi makanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόρνος
  choice: yang hidup dalam percabulan
  rationale: Menunjukkan orang yang melakukan percabulan atau hidup dalam ketidakberesan seksual, dengan ungkapan Indonesia yang alami dan tidak membatasi maknanya pada satu tindakan tertentu.
- source_word: βέβηλος
  choice: tidak menghormati hal-hal suci
  rationale: Kata ini secara harfiah menunjuk pada sikap profan, yaitu memperlakukan yang suci sebagai hal biasa atau tidak bernilai. Pilihan ini lebih langsung mencerminkan sumber Yunani daripada istilah yang dapat dipahami sekadar sebagai ateisme.
- source_word: τὰ πρωτοτόκια
  choice: hak kesulungannya
  rationale: Merujuk pada hak dan kedudukan istimewa anak sulung dalam kisah Esau.
- source_word: ἀντὶ βρώσεως μιᾶς
  choice: demi seporsi makanan
  rationale: Menyampaikan pertukaran hak kesulungan dengan satu kali sajian makanan secara ringkas dan alami.
theological_decisions:
- issue: Cakupan frasa “seperti Esau” terhadap dua sifat sebelumnya
  choice: Mempertahankan urutan Yunani sehingga frasa itu paling dekat dengan “tidak menghormati hal-hal suci”, tanpa secara tegas menutup kemungkinan bahwa perbandingan tersebut berkaitan dengan seluruh peringatan.
  alternative: Menempatkan “seperti Esau” sebelum kedua sifat sehingga secara tegas mencakup keduanya.
  rationale: Susunan sumber dapat menimbulkan pertanyaan apakah Esau menjadi contoh khusus bagi sifat profan atau bagi kedua sifat. Terjemahan tidak memaksakan penyelesaian yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan “Jangan sampai” mempertahankan daya larangan μή τις dalam rangkaian nasihat konteks sebelumnya; “seporsi makanan” dipilih agar mudah dipahami pembaca umum.
