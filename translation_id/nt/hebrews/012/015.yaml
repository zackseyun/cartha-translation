  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπισκοποῦντες μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ, μή τις ῥίζα πικρίας ἄνω φύουσα ἐνοχλῇ καὶ ⸂δι’ αὐτῆς⸃ μιανθῶσιν ⸀πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/015.yaml
  text: watching carefully lest anyone fall short of the grace of God[a], lest any root of bitterness springing up cause trouble, and through it many be defiled[b],
translation:
  language: id
  text: Berjaga-jagalah agar tidak seorang pun gagal memperoleh anugerah Allah[a], dan agar tidak ada akar kepahitan yang tumbuh lalu menimbulkan kesusahan dan, melalui akar itu, banyak orang menjadi najis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak memperoleh anugerah Allah.” Ungkapan Yunani ini dapat berarti tidak memperoleh apa yang ditawarkan maupun gagal mencapai apa yang dimaksud.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “akar kepahitan” kemungkinan menggemakan Ulangan 29:18, yang memakai akar beracun sebagai gambaran ketidaksetiaan terhadap perjanjian yang menyebar dalam komunitas.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκοποῦντες
  choice: Perhatikanlah dengan sungguh-sungguh
  rationale: Partisipel ini menyatakan pengawasan atau perhatian aktif. Bentuk imperatif dalam bahasa Indonesia mengikuti fungsi nasihat dalam konteks dan terdengar alami bagi pembaca modern.
- source_word: μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ
  choice: supaya jangan ada seorang pun yang gagal memperoleh anugerah Allah
  rationale: ὑστερέω dengan ἀπό dapat menunjuk pada kegagalan mencapai atau memperoleh sesuatu. Pilihan ini mempertahankan peringatan tanpa menentukan apakah yang dimaksud adalah kehilangan keselamatan, tidak menerima anugerah, atau tersisih dari kehidupan komunitas.
- source_word: χάριτος
  choice: anugerah
  rationale: Istilah ini alami dalam ragam Alkitab bahasa Indonesia dan mempertahankan bobot teologis χάρις tanpa menjadi terlalu teknis.
- source_word: ῥίζα πικρίας
  choice: akar kepahitan
  rationale: Terjemahan dekat dari konstruksi Yunani dan mempertahankan gema yang mungkin berasal dari Ulangan 29:18.
- source_word: ἄνω φύουσα
  choice: yang tumbuh
  rationale: Menggambarkan akar yang muncul atau bertunas ke atas; 'yang tumbuh' jelas dan alami dalam bahasa Indonesia.
- source_word: ἐνοχλῇ
  choice: menimbulkan kesusahan
  rationale: Kata kerja ini berarti mengganggu atau menyusahkan. Pilihan ini menyampaikan dampaknya terhadap komunitas.
- source_word: δι’ αὐτῆς
  choice: olehnya
  rationale: Pronomina feminin paling wajar merujuk kembali kepada 'akar'; ungkapan ini mempertahankan makna instrumental διά.
- source_word: μιανθῶσιν πολλοί
  choice: banyak orang menjadi najis
  rationale: μιαίνω memiliki daya moral atau kultis yang lebih kuat daripada sekadar 'terganggu'. 'Menjadi najis' mempertahankan ragam dan keseriusan alkitabiahnya.
theological_decisions:
- issue: Apakah peringatan tentang anugerah Allah harus dipahami sebagai kehilangan keselamatan, kegagalan menerima anugerah, atau keterasingan dari komunitas
  choice: gagal memperoleh anugerah Allah
  alternative: kekurangan anugerah Allah; menyimpang dari anugerah Allah
  rationale: Bahasa Yunani memungkinkan gagasan tidak mencapai atau gagal memperoleh apa yang tersedia, tetapi ayat ini tidak menyelesaikan perdebatan doktrinal tentang kemurtadan dan ketekunan. Terjemahan dibiarkan terbuka, dengan alternatif leksikal dicatat.
- issue: Apakah μιαίνω perlu dilunakkan menjadi akibat sosial semata
  choice: menjadi najis
  alternative: tercemar; dirusak
  rationale: Kata Yunani itu mengandung nuansa pencemaran moral atau kultis. Pilihan ini mempertahankan keseriusan akibatnya bagi banyak orang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur nasihat dibuat langsung dan mudah dibaca. Istilah 'anugerah', 'akar kepahitan', dan 'menjadi najis' mempertahankan ragam alkitabiah serta ketegangan teologis teks sumber.
