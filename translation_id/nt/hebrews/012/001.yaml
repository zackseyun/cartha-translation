id: HEB.12.1
reference: Hebrews 12:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τοιγαροῦν καὶ ἡμεῖς, τοσοῦτον ἔχοντες περικείμενον ἡμῖν νέφος μαρτύρων, ὄγκον ἀποθέμενοι πάντα καὶ τὴν εὐπερίστατον ἁμαρτίαν, δι’ ὑπομονῆς τρέχωμεν τὸν προκείμενον ἡμῖν ἀγῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/001.yaml
  text: Therefore[a], since we also have so great a cloud of witnesses surrounding us, laying aside every weight and the sin that so easily entangles, let us run with endurance the race set before us,
translation:
  language: id
  text: Karena itu, kita pun, yang dikelilingi oleh awan saksi yang begitu besar, setelah menanggalkan setiap beban dan dosa yang begitu mudah menjerat[a], marilah kita berlari dengan ketekunan dalam perlombaan yang terbentang di hadapan kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dosa yang melekat begitu erat” atau “dosa yang mudah memerangkap.” Kata sifat Yunani ini langka dan dapat menekankan tindakan menjerat, memerangkap, atau melekat erat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιγαροῦν
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya, terutama teladan iman dalam pasal 11, dengan ungkapan Indonesia yang wajar dan jelas.
- source_word: τοσοῦτον ... νέφος μαρτύρων
  choice: awan saksi yang begitu besar
  rationale: Mempertahankan metafora awan bagi kumpulan saksi yang sangat banyak serta daya penegas τοσοῦτον.
- source_word: περικείμενον ἡμῖν
  choice: dikelilingi oleh
  rationale: Mengungkapkan gambaran spasial bahwa para saksi berada di sekeliling kita tanpa menentukan bahwa mereka terutama bertindak sebagai penonton.
- source_word: ὄγκον ... πάντα
  choice: setiap beban
  rationale: Mempertahankan citra atletik tentang segala sesuatu yang membebani atau menghambat seorang pelari.
- source_word: ἀποθέμενοι
  choice: setelah menanggalkan
  rationale: Menyatakan tindakan melepaskan beban dan dosa sebagai tindakan yang mendahului atau menyertai ajakan utama untuk berlari.
- source_word: εὐπερίστατον
  choice: yang begitu mudah menjerat
  rationale: Cocok dengan citra perlombaan dan menyampaikan bahaya dosa sebagai penghambat, sementara ketidakpastian makna kata Yunani yang langka ini dicatat dalam catatan kaki.
- source_word: δι’ ὑπομονῆς
  choice: dengan ketekunan
  rationale: Menyampaikan ketabahan yang terus bertahan di bawah kesukaran dan terdengar alami dalam nasihat untuk menjalani perlombaan.
- source_word: τρέχωμεν
  choice: marilah kita berlari
  rationale: Mewakili subjungtif hortatoris orang pertama jamak sebagai ajakan bersama.
- source_word: τὸν προκείμενον ἡμῖν ἀγῶνα
  choice: perlombaan yang terbentang di hadapan kita
  rationale: Dalam konteks kata 'berlari', ἀγών paling alami dipahami sebagai perlombaan; frasa ini tetap mempertahankan gagasan tentang lintasan atau perjuangan yang tersedia di depan.
theological_decisions:
- issue: Makna 'saksi' dalam hubungannya dengan Ibrani 11
  choice: Orang-orang yang hidupnya memberi kesaksian tentang iman, sementara gambaran mengelilingi tetap dipertahankan
  alternative: Terutama para penonton surgawi yang sedang menyaksikan orang percaya berlomba
  rationale: Konteks langsung menunjuk kembali kepada tokoh-tokoh pasal 11. Terjemahan 'saksi' tidak memastikan bahwa mereka sedang menjadi penonton, sehingga ruang bagi ketegangan penafsiran tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang luhur tetapi mudah dipahami. Metafora awan, beban, lari, dan perlombaan dipertahankan; struktur kalimat disesuaikan agar ajakan utama terdengar jelas.
