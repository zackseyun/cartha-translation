base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/026.yaml
  text: whose voice shook the earth then[a], but now he has promised, saying[b], “Yet once more I will shake not only the earth but also the heaven.”
translation:
  language: id
  text: 'Dia yang suara-Nya dahulu mengguncangkan bumi, tetapi kini telah berjanji: “Sekali lagi Aku akan mengguncangkan bukan hanya bumi, melainkan juga langit[a].”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “langit itu.” Bahasa Yunani memakai bentuk tunggal dengan kata sandang.
    reason: lexical_alternative
  - marker: b
    text: Kutipan dari Hagai 2:6.
    reason: cross_reference
lexical_decisions:
- source_word: οὗ ἡ φωνὴ
  choice: Dia yang suara-Nya
  rationale: Mempertahankan hubungan relatif dengan Allah yang disebut dalam konteks sebelumnya serta menampilkan φωνή sebagai suara pribadi, bukan sekadar bunyi.
- source_word: τὴν γῆν ἐσάλευσεν τότε
  choice: mengguncangkan bumi pada waktu itu
  rationale: σαλεύω menyatakan guncangan kuat, sedangkan τότε dikemukakan secara alami sebagai penanda waktu lampau yang berlawanan dengan νῦν.
- source_word: νῦν δὲ ἐπήγγελται
  choice: kini telah berjanji
  rationale: Bentuk perfek ἐπήγγελται menyatakan janji yang telah diberikan dan tetap berlaku. Kontras δέ dengan τότε dapat disampaikan secara wajar melalui pasangan 'pada waktu itu ... kini' tanpa harus menambahkan 'tetapi'.
- source_word: λέγων
  choice: dengan berfirman
  rationale: Partisip ini memperkenalkan perkataan Allah. 'Berfirman' merupakan ungkapan Indonesia yang alami dan bermartabat ketika Allah menjadi pembicara.
- source_word: Ἔτι ἅπαξ
  choice: Sekali lagi
  rationale: Ungkapan ini secara idiomatis menyatakan satu kali lagi. Unsur ἔτι tercakup dalam 'lagi' tanpa menghasilkan frasa Indonesia yang kaku.
- source_word: σείσω
  choice: Aku akan mengguncangkan
  rationale: Bentuk futur ini mempertahankan gambaran pergolakan dahsyat dalam kutipan nubuat.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: bukan hanya ... melainkan juga
  rationale: Pasangan korelatif Indonesia ini secara tepat mempertahankan perluasan dari bumi kepada langit.
- source_word: τὸν οὐρανόν
  choice: langit
  rationale: Dalam pertentangan dengan bumi, bentuk tunggal ini menunjuk ranah kosmis di atas bumi. 'Langit' alami dalam bahasa Indonesia sekaligus tidak mempersempitnya menjadi atmosfer saja.
theological_decisions:
- issue: Rujukan kata ganti relatif dan pelaku yang berjanji
  choice: Allah tetap menjadi rujukan melalui frasa 'Dia yang suara-Nya' dan sebagai pembicara ilahi dalam kutipan.
  alternative: Mengubahnya menjadi kalimat baru, 'Suara-Nya ...,' yang membuat hubungan relatif dengan konteks sebelumnya kurang kentara.
  rationale: Konteks langsung dan kutipan Hagai menunjukkan bahwa Allah adalah Dia yang dahulu mengguncangkan bumi dan kini memberikan janji.
- issue: Cakupan bahasa kosmis
  choice: γῆ dan οὐρανός diterjemahkan 'bumi' dan 'langit'.
  alternative: '''Tanah'' dan ''angkasa''.'
  rationale: Pasangan bumi–langit mempertahankan cakupan kosmis kutipan tanpa menentukan secara berlebihan bagaimana pengguncangan itu akan berlangsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan relatif pada awal ayat dipertahankan agar kaitannya dengan ayat sebelumnya tetap jelas; pilihan kata tetap mudah dipahami pembaca umum.
