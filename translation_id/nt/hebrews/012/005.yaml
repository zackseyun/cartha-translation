source:
  edition: SBLGNT
  text: καὶ ἐκλέλησθε τῆς παρακλήσεως, ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται, Υἱέ μου, μὴ ὀλιγώρει παιδείας κυρίου, μηδὲ ἐκλύου ὑπ’ αὐτοῦ ἐλεγχόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/005.yaml
  text: 'And you have forgotten the exhortation that addresses you as sons: “My son[a], do not regard lightly the Lord’s discipline[c][b], nor lose heart when you are reproved by him.”'
translation:
  language: id
  text: 'Dan kamu telah melupakan nasihat yang menyapa kamu sebagai anak-anak[a]: “Anakku, jangan anggap remeh didikan[b] Tuhan, dan jangan tawar hati ketika engkau ditegur oleh-Nya.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Yunani secara harfiah memakai “sebagai putra-putra.” Bahasa maskulin ini menggemakan Amsal dan bahasa tentang anak dalam bagian ini; nasihat tersebut ditujukan kepada seluruh pembaca.
    reason: lexical_alternative
  - marker: b
    text: “Didikan” dapat mencakup pelatihan, pengajaran, dan koreksi, bukan hanya hukuman.
    reason: lexical_alternative
  - marker: c
    text: Kutipan dari Amsal 3:11.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκλέλησθε
  choice: kamu telah melupakan
  rationale: Bentuk perfekt menyatakan keadaan sekarang sebagai akibat dari tindakan melupakan; ungkapan ini mempertahankan daya teguran teks.
- source_word: παρακλήσεως
  choice: nasihat
  rationale: Dalam konteks pengantar kutipan peringatan dari Amsal, 'nasihat' mencakup unsur dorongan sekaligus teguran secara alami dalam bahasa Indonesia.
- source_word: ἥτις ... διαλέγεται
  choice: yang berbicara kepadamu
  rationale: Mempertahankan personifikasi Kitab Suci yang secara langsung menyapa para pendengar tanpa mempersempit verba menjadi sekadar 'berkata'.
- source_word: ὡς υἱοῖς
  choice: sebagai anak-anak lelaki
  rationale: Menjaga bentuk maskulin eksplisit dan kaitannya dengan bahasa keanakan dalam kutipan serta konteks, sambil memakai ungkapan Indonesia yang dapat dipahami.
- source_word: Υἱέ μου
  choice: Anakku
  rationale: Sapaan Indonesia yang alami bagi 'anakku laki-laki'; konteks kutipan dan catatan pada υἱοῖς mempertahankan citra anak lelaki tanpa menghasilkan bentuk kaku 'anak lelakiku'.
- source_word: ὀλιγώρει
  choice: jangan anggap remeh
  rationale: Secara tepat menyampaikan larangan untuk memandang kecil atau memperlakukan sebagai tidak penting, tanpa memperkerasnya menjadi 'membenci'.
- source_word: παιδείας
  choice: didikan
  rationale: '''Didikan'' cukup luas untuk mencakup pembentukan, pelatihan, dan koreksi, sehingga tidak membatasi makna pada hukuman.'
- source_word: κυρίου
  choice: Tuhan
  rationale: Genitif dipahami secara alami dalam frasa Indonesia 'didikan Tuhan' dan mempertahankan gelar κύριος.
- source_word: ἐκλύου
  choice: jangan tawar hati
  rationale: Ungkapan Indonesia ini menggambarkan hilangnya semangat atau keteguhan batin di bawah koreksi.
- source_word: ἐλεγχόμενος
  choice: ketika engkau ditegur
  rationale: '''Ditegur'' sesuai dengan konteks didikan dan mempertahankan unsur korektif tanpa menambahkan gagasan penghukuman.'
theological_decisions:
- issue: Bahasa keanakan yang bergender dalam nasihat
  choice: Menerjemahkan ὡς υἱοῖς sebagai 'sebagai anak-anak lelaki' dan Υἱέ μου secara idiomatis sebagai 'Anakku'
  alternative: sebagai anak-anak / anakku
  rationale: Bentuk jamak mempertahankan bahasa maskulin eksplisit yang menopang gambaran anak lelaki dalam Amsal dan argumen Ibrani. Dalam sapaan tunggal, 'Anakku' merupakan bentuk Indonesia yang wajar; catatan menjelaskan cakupan representatifnya.
- issue: Cakupan makna παιδεία dalam hubungan Tuhan dan umat-Nya
  choice: didikan
  alternative: disiplin; pelatihan; hajaran
  rationale: '''Didikan'' mempertahankan ketegangan antara pembentukan dan koreksi, tanpa mereduksinya menjadi hukuman saja ataupun pengajaran tanpa unsur teguran.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur tetapi mudah dipahami. 'Kamu' dipakai untuk kelompok pembaca, sedangkan 'engkau' dalam kutipan mempertahankan sapaan tunggal langsung. Penanda catatan ditempatkan tepat pada unsur yang dijelaskan.
