  to: 'Dan kamu telah melupakan nasihat yang menyapa kamu sebagai anak-anak[a]: “Anakku, jangan anggap remeh didikan[b] Tuhan, dan jangan tawar hati ketika engkau ditegur oleh-Nya.”[c]'
