    issue: Padanan "anak-anak lelaki" untuk ὡς υἱοῖς tidak alami dan berpotensi terlalu sempit.
    rationale: Dalam bahasa Indonesia, frasa ini lazim dipahami sebagai anak laki-laki berdasarkan usia/jenis kelamin. Yunani memakai υἱοῖς dalam bahasa kekerabatan dan argumentasi status anak. "Anak-anak" adalah padanan idiomatis, sedangkan bentuk maskulin eksplisit perlu dicatat dalam catatan kaki.
  - severity: low
    issue: '"Yang berbicara kepadamu" kurang idiomatis dibandingkan "yang menyapa kamu."'
    rationale: διαλέγεται dalam konteks ini memperkenalkan nasihat Kitab Suci yang dialamatkan langsung kepada pembaca. "Menyapa" menyampaikan fungsi itu secara alami tanpa menambahkan makna.
  - severity: low
    issue: Penanda rujukan Amsal ditempatkan hanya pada "Tuhan."
    rationale: Yang dikutip adalah seluruh kalimat, sehingga penanda rujukan silang sebaiknya mengikuti keseluruhan kutipan.
