  text: καὶ τροχιὰς ὀρθὰς ⸀ποιεῖτε τοῖς ποσὶν ὑμῶν, ἵνα μὴ τὸ χωλὸν ἐκτραπῇ, ἰαθῇ δὲ μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/013.yaml
  text: and make straight paths for your feet[a], so that the lame may not be turned aside[b], but rather be healed.
translation:
  language: id
  text: dan buatlah jalan-jalan yang lurus[b] untuk kakimu, supaya yang pincang tidak menyimpang[a], melainkan disembuhkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak terkilir” atau “tidak terlepas dari sendi”; kata Yunani ini dapat memiliki nuansa medis dalam rangkaian gambaran tubuh di sini.'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan ini menggemakan Amsal 4:26 dan melanjutkan gambaran tentang berjalan dengan tertib.
    reason: cross_reference
lexical_decisions:
- source_word: τροχιὰς ὀρθὰς
  choice: jalan yang lurus
  rationale: τροχιά dapat menunjuk pada jejak atau jalur, sedangkan ὀρθός berarti lurus atau tertata dengan benar. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran perjalanan hidup.
- source_word: ποιεῖτε
  choice: buatlah
  rationale: Imperatif kini ini menyerukan tindakan yang terus dijalankan; 'buatlah' merupakan padanan langsung tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: τοῖς ποσὶν ὑμῶν
  choice: bagi kakimu
  rationale: Datif ini paling wajar dipahami sebagai jalur yang dibuat bagi kaki mereka, sekaligus mempertahankan metafora berjalan.
- source_word: τὸ χωλὸν
  choice: yang timpang
  rationale: Adjektiva netral substantival ini sengaja dibiarkan tidak menentukan apakah yang dimaksud adalah anggota tubuh, keadaan, atau orang yang lemah; 'yang timpang' mempertahankan keluwesan tersebut.
- source_word: ἐκτραπῇ
  choice: menyimpang
  rationale: Kata kerja ini dapat berarti berbelok atau menyimpang, tetapi dalam konteks gambaran tubuh juga mungkin bernuansa terkilir atau terlepas dari sendi. Terjemahan utama mempertahankan makna umum, sedangkan nuansa medis dicatat dalam catatan kaki.
- source_word: ἰαθῇ
  choice: disembuhkan
  rationale: ἰάομαι lazim berarti menyembuhkan; bentuk pasif dipertahankan dan gambaran pemulihan jasmani tidak diencerkan.
- source_word: μᾶλλον
  choice: tetapi sebaliknya
  rationale: 'μᾶλλον menandai hasil yang dikontraskan dengan klausa negatif sebelumnya: bukan menyimpang, melainkan disembuhkan.'
theological_decisions:
- issue: Apakah gambaran ketimpangan bersifat jasmani atau rohani
  choice: Mempertahankan bahasa tubuh tanpa menentukan rujukannya secara sempit
  alternative: Menafsirkan 'yang timpang' secara khusus sebagai orang percaya yang lemah secara rohani, atau semata-mata sebagai kelemahan jasmani
  rationale: Konteksnya bersifat nasihat dan memakai gambaran tubuh, tetapi teks Yunani tidak secara tegas membatasi rujukannya. Terjemahan ini mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada nasihat yang bermartabat. Kata 'timpang' dipilih untuk menjaga gambaran tubuh sekaligus kemungkinan makna kiasan. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
