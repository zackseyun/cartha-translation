revisions:
- from: dan buatlah jalan yang lurus bagi kakimu, supaya yang timpang tidak menyimpang[a], tetapi sebaliknya disembuhkan.[b]
  to: dan buatlah jalan-jalan yang lurus[b] untuk kakimu, supaya yang pincang tidak menyimpang[a], melainkan disembuhkan.
  rationale: Revisi mempertahankan perintah, metafora tubuh, dan ketidakjelasan yang disengaja mengenai apakah “yang pincang” dipahami secara jasmani atau kiasan. Bentuk jamak pada “jalan-jalan” mencerminkan τροχιὰς, “pincang” lebih alami untuk χωλόν, dan posisi catatan kaki dibuat sesuai dengan frasa yang dijelaskannya.
