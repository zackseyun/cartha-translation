  yaml_path: translation/nt/hebrews/012/012.yaml
  text: Therefore[a], strengthen your drooping hands and your weakened knees,
translation:
  language: id
  text: Karena itu[a], kuatkanlah tangan yang terkulai dan lutut yang lemah,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “angkatlah tangan yang terkulai dan lutut yang lemah.” Ungkapan ini menggemakan Yesaya 35:3 dalam tradisi Yunani dan memakai gambaran tubuh untuk menyatakan pulihnya keberanian dan ketekunan.
    reason: cross_reference
lexical_decisions:
- source_word: Διὸ
  choice: Karena itu
  rationale: Kata penghubung ini menyatakan kesimpulan atau dorongan yang ditarik dari pembahasan sebelumnya; “Karena itu” alami dan mempertahankan hubungan logis tersebut.
- source_word: τὰς παρειμένας χεῖρας
  choice: tangan yang terkulai
  rationale: Ungkapan ini menggambarkan tangan yang dibiarkan menggantung lemas. “Terkulai” mempertahankan citra jasmani dan secara wajar menyiratkan hilangnya semangat atau daya tahan.
- source_word: τὰ παραλελυμένα γόνατα
  choice: lutut yang lemah
  rationale: Bentuk perfektifnya menggambarkan lutut yang telah menjadi lemah atau tak berdaya. “Lemah” mempertahankan metafora keletihan tanpa menimbulkan kesan kelumpuhan klinis.
- source_word: ἀνορθώσατε
  choice: kuatkanlah
  rationale: Imperatif ini menuntut tindakan tegas untuk menegakkan atau memulihkan. Dalam konteks ketekunan, “kuatkanlah” menyampaikan maksud pemulihan daya sambil tetap berpadu dengan citra tangan dan lutut.
theological_decisions:
- issue: Nasihat metaforis melalui gambaran kelemahan tubuh
  choice: Perintah diterjemahkan sebagai ajakan untuk memulihkan kekuatan dan ketekunan, dengan tetap mempertahankan gambaran tangan dan lutut.
  alternative: “Angkatlah tangan yang terkulai dan tegakkanlah lutut yang lemah.”
  rationale: Konteks Ibrani 12 membahas ketekunan dan didikan. Gema Yesaya 35:3 menunjukkan bahwa gambaran jasmani ini berfungsi sebagai dorongan kepada keberanian dan daya tahan, bukan semata-mata petunjuk tentang sikap tubuh.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Bentuk “kuatkanlah” cocok untuk nasihat langsung kepada komunitas; nomina anggota tubuh dibiarkan tanpa kata ganti kepunyaan karena hal itu alami dalam bahasa Indonesia dan cakupan perintah sudah jelas.
