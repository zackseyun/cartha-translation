id: HEB.12.23
reference: Hebrews 12:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐκκλησίᾳ πρωτοτόκων ⸂ἀπογεγραμμένων ἐν οὐρανοῖς⸃, καὶ κριτῇ θεῷ πάντων, καὶ πνεύμασι δικαίων τετελειωμένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/023.yaml
  text: and to the assembly of the firstborn who are enrolled in the heavens[a], and to God, the judge of all, and to the spirits of righteous people made perfect,
translation:
  language: id
  text: dan kepada jemaat anak-anak sulung yang terdaftar di surga[a], dan kepada Allah, Hakim semua, dan kepada roh orang-orang benar yang telah dijadikan sempurna,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di surga-surga”; bahasa Yunani memakai bentuk jamak.
    reason: Mempertahankan informasi bentuk jamak ἐν οὐρανοῖς sambil memakai ungkapan Indonesia yang alami dalam teks utama.
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: jemaat
  rationale: Dalam konteks Sion surgawi, kata ini menunjuk pada perhimpunan umat. 'Jemaat' alami dan bermartabat dalam bahasa Indonesia serta tidak harus menunjuk pada lembaga.
- source_word: πρωτοτόκων
  choice: anak-anak sulung
  rationale: Bentuk jamak substantival menunjuk secara kolektif kepada orang-orang yang memiliki kedudukan atau hak waris anak sulung. Penambahan 'anak-anak' membuat bentuk jamaknya jelas tanpa membatasi pada laki-laki.
- source_word: ἀπογεγραμμένων
  choice: yang namanya terdaftar
  rationale: Partisip perfek pasif menyatakan pendaftaran yang telah dilakukan dan tetap berlaku. Ungkapan ini mempertahankan citra daftar sambil terdengar alami dalam bahasa Indonesia.
- source_word: ἐν οὐρανοῖς
  choice: di surga
  rationale: Walaupun bentuk Yunaninya jamak, bahasa Indonesia baku lazim memakai 'surga' sebagai sebutan ranah surgawi; catatan kaki mempertahankan informasi tentang bentuk jamak sumber.
- source_word: κριτῇ θεῷ πάντων
  choice: Allah, Hakim semua
  rationale: Aposisi ini mengidentifikasi Allah sebagai Hakim atas semua, sambil mempertahankan rangkaian datif dari konteks sebelumnya.
- source_word: πνεύμασι
  choice: roh
  rationale: Padanan langsung ini mempertahankan ungkapan sumber tanpa memperluasnya menjadi doktrin rinci mengenai keadaan sesudah kematian.
- source_word: δικαίων
  choice: orang-orang benar
  rationale: Menunjukkan referen manusia secara jelas, alami, dan inklusif tanpa membatasi pada laki-laki.
- source_word: τετελειωμένων
  choice: yang telah dijadikan sempurna
  rationale: Mempertahankan aspek perfek dan bentuk pasif, sekaligus tema kesempurnaan atau penyempurnaan yang penting dalam Surat Ibrani.
theological_decisions:
- issue: Identitas 'anak-anak sulung'
  choice: Sebutan kolektif bagi umat yang memiliki kedudukan atau warisan anak sulung.
  alternative: Kristus sebagai Sang Sulung, dengan jemaat sebagai milik-Nya.
  rationale: Bentuk jamak πρωτοτόκων paling langsung mendukung referen kolektif; terjemahan tidak menambahkan hubungan kepemilikan yang tidak dinyatakan.
- issue: Referen 'roh orang-orang benar yang telah dijadikan sempurna'
  choice: Roh manusia-manusia benar yang telah dijadikan sempurna.
  alternative: Semua orang benar secara lebih luas, baik dalam keadaan berjasmani maupun tidak.
  rationale: Kata 'roh' paling wajar menunjuk pada manusia dalam keadaan rohani, tetapi terjemahan tidak menambahkan rincian tentang keadaan antara yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur namun mudah dipahami. Ayat dipertahankan sebagai lanjutan rangkaian dari ayat sebelumnya, sehingga dimulai dengan 'dan kepada' serta diakhiri koma.
