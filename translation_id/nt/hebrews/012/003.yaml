  naturalness: Susunan revisi tetap baku dan modern. “Penentangan seperti itu” lebih idiomatis dan lebih dekat dengan sumber daripada “perlawanan sehebat itu.” “Jangan menjadi letih dan tawar hati dalam jiwamu” menyampaikan peringatan dengan jelas, sementara catatan kaki menyediakan alternatif yang lebih harfiah bagi ἐκλυόμενοι.
  terminology: “Orang-orang berdosa,” “menanggung,” “penentangan,” dan “jiwa” sesuai dengan register Ibrani dan mempertahankan istilah penting sumber. “Tawar hati” adalah padanan modern yang wajar untuk ἐκλυόμενοι; alternatif “menjadi lemah” dicatat tanpa menyamakan ψυχή dengan sekadar emosi.
