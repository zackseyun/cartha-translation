id: HEB.12.3
reference: Hebrews 12:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀναλογίσασθε γὰρ τὸν τοιαύτην ὑπομεμενηκότα ὑπὸ τῶν ἁμαρτωλῶν εἰς ⸀ἑαυτοὺς ἀντιλογίαν, ἵνα μὴ κάμητε ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/003.yaml
  text: For consider the one who endured such opposition from sinners against himself[a], so that you may not grow weary[b], becoming discouraged in your souls.
translation:
  language: id
  text: Sebab, renungkanlah Dia yang telah menanggung penentangan seperti itu dari orang-orang berdosa terhadap diri mereka sendiri[a], supaya kamu jangan menjadi letih dan tawar hati dalam jiwamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “terhadap diri-Nya sendiri.” Teks SBLGNT berbunyi “terhadap diri mereka sendiri.” Dalam konteks, bacaan tunggal dipahami sebagai penentangan yang ditujukan kepada Yesus.
    reason: textual_variant
  - marker: b
    text: Atau, “menjadi lemah dalam jiwamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναλογίσασθε
  choice: renungkanlah
  rationale: Imperatif ini menyerukan pertimbangan yang sungguh-sungguh dan mendalam. “Renungkanlah” alami dalam bahasa Indonesia serta mempertahankan daya nasihatnya.
- source_word: τοιαύτην
  choice: sehebat itu
  rationale: Kata ini menunjuk pada sifat atau taraf perlawanan yang baru disebut dalam konteks. “Sehebat itu” menyampaikan penekanannya secara wajar tanpa mempersempit bentuk perlawanan tersebut.
- source_word: ὑπομεμενηκότα
  choice: yang telah menanggung
  rationale: Partisipel perfek menyoroti ketabahan yang sudah nyata dan tetap bermakna. “Telah menanggung” tepat untuk penderitaan yang dialami Yesus.
- source_word: ὑπὸ τῶν ἁμαρτωλῶν
  choice: dari orang-orang berdosa
  rationale: Frasa ini menyatakan pelaku perlawanan. “Orang-orang berdosa” langsung dan mempertahankan penilaian moral teks.
- source_word: εἰς ἑαυτοὺς ἀντιλογίαν
  choice: perlawanan ... terhadap diri mereka sendiri
  rationale: ἀντιλογία dalam konteks berarti perlawanan atau penentangan. Teks SBLGNT memakai bentuk jamak ἑαυτούς, “diri mereka sendiri”; keganjilan bacaan ini dipertahankan dalam teks utama, sementara varian “diri-Nya sendiri” dijelaskan dalam catatan kaki.
- source_word: κάμητε
  choice: menjadi letih
  rationale: Verba ini berarti menjadi lelah atau letih. Pilihan ini mempertahankan gambaran kehabisan daya dalam nasihat untuk bertekun.
- source_word: ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι
  choice: tawar hati dalam jiwamu
  rationale: ἐκλύομαι menggambarkan melemahnya semangat hingga hampir menyerah, sedangkan ψυχή menunjuk pada kehidupan batin atau diri. Ungkapan ini alami, tetap bermartabat, dan mempertahankan kata “jiwa” dari teks Yunani.
theological_decisions:
- issue: Rujukan τὸν (“Dia yang”)
  choice: Memakai “Dia” tanpa menambahkan nama Yesus
  alternative: “Yesus” atau “orang yang”
  rationale: Konteks langsung dalam Ibrani 12:2 menunjukkan bahwa yang dimaksud ialah Yesus. “Dia” mempertahankan bentuk tidak langsung dari bahasa Yunani sambil membuat rujukannya jelas melalui konteks.
- issue: Arah perlawanan dalam varian teks
  choice: 'Mengikuti teks SBLGNT: “terhadap diri mereka sendiri”'
  alternative: “terhadap diri-Nya sendiri”
  rationale: SBLGNT yang ditetapkan sebagai sumber memuat ἑαυτούς, bentuk jamak “diri mereka sendiri”. Karena bacaan ini sulit tetapi asli pada edisi sumber, terjemahan utama mempertahankannya; varian tunggal yang secara kontekstual menunjuk kepada Yesus dicatat tanpa diam-diam menggantikan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada nasihat yang khidmat. Struktur dibuat cukup dekat dengan bahasa Yunani, tetapi tetap alami. Bacaan sulit SBLGNT tidak diperhalus secara diam-diam; varian yang menjelaskan arah perlawanan dicantumkan dalam catatan.
