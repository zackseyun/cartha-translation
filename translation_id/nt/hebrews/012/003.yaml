revisions:
- from: Sebab, renungkanlah Dia yang telah menanggung perlawanan sehebat itu dari orang-orang berdosa terhadap diri mereka sendiri[a], supaya kamu tidak menjadi letih dan tawar hati dalam jiwamu.[b]
  to: Sebab, renungkanlah Dia yang telah menanggung penentangan seperti itu dari orang-orang berdosa terhadap diri mereka sendiri[a], supaya kamu jangan menjadi letih dan tawar hati dalam jiwamu.[b]
  rationale: Revisi membatasi terjemahan pada apa yang dinyatakan oleh teks Yunani, khususnya dengan mengganti “sehebat itu” menjadi “seperti itu.” Bacaan jamak SBLGNT yang secara konteks sukar tetap diterjemahkan apa adanya, sedangkan bacaan tunggal yang lebih lancar dicatat sebagai varian. Catatan leksikal juga diperjelas agar benar-benar berfungsi sebagai alternatif bagi ἐκλυόμενοι.
