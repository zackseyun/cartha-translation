base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/006.yaml
  text: For the Lord disciplines the one he loves[b][a], and he scourges every son whom he receives.
translation:
  language: id
  text: Sebab Tuhan mendisiplinkan orang yang dikasihi-Nya, dan Ia mencambuk[a] setiap anak laki-laki[b] yang diterima-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyesah.” Kata kerja Yunani ini bernada keras dan menggambarkan tindakan mencambuk sebagai disiplin yang berat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “setiap putra.” Dalam konteks ini, ungkapan maskulin tersebut bersifat representatif, merujuk kepada semua orang yang Allah akui sebagai anak-anak-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: orang yang ... yang
  rationale: Kata ganti relatif ini membentuk pernyataan umum dengan acuan pribadi tunggal. Ungkapan “orang yang” alami dalam bahasa Indonesia, sedangkan kemunculan kedua cukup diterjemahkan “yang”.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ menyatakan alasan yang mendasari nasihat sebelumnya. “Sebab” mempertahankan hubungan logis itu secara ringkas dan wajar.
- source_word: ἀγαπᾷ
  choice: dikasihi-Nya
  rationale: Bentuk pasif dalam bahasa Indonesia menghasilkan susunan yang alami setelah “orang yang” dan tetap menyatakan kasih Tuhan secara jelas.
- source_word: κύριος
  choice: Tuhan
  rationale: “Tuhan” merupakan padanan baku dan bermartabat bagi gelar κύριος dalam konteks ini.
- source_word: παιδεύει
  choice: mendisiplinkan
  rationale: Dalam konteks ini παιδεύω menunjuk pada pembinaan melalui koreksi, bukan sekadar penghukuman. “Mendisiplinkan” mempertahankan unsur korektif sekaligus formatifnya.
- source_word: μαστιγοῖ
  choice: mendera
  rationale: Kata ini menggambarkan tindakan mencambuk atau menyesah dan sengaja bernada keras. “Mendera” mempertahankan kerasnya metafora tanpa melunakkannya menjadi kesukaran biasa.
- source_word: δὲ
  choice: dan
  rationale: δέ meneruskan klausa sebelumnya, bukan menyatakan pertentangan yang kuat; karena itu “dan” paling alami.
- source_word: πάντα υἱὸν
  choice: setiap anak
  rationale: Dalam bahasa Indonesia, “anak” lazim dipakai bagi relasi anak dengan orang tua tanpa menghapus daya representatif υἱός dalam konteks ini. Catatan kaki menjelaskan bahwa bentuk Yunani secara harfiah berarti “setiap anak laki-laki/putra” dan mencakup mereka yang diakui Allah sebagai anak-anak-Nya.
- source_word: παραδέχεται
  choice: diterima-Nya
  rationale: παραδέχομαι menyatakan menerima atau menyambut seseorang dengan pengakuan dan perkenanan. “Diterima-Nya” mempertahankan nuansa relasional itu tanpa menambahkan penafsiran ke dalam teks utama.
theological_decisions:
- issue: Penggambaran hubungan sebagai anak melalui υἱός dalam konteks disiplin ilahi
  choice: setiap anak
  alternative: setiap putra; setiap anak laki-laki
  rationale: Bahasa Indonesia memakai “anak” secara alami bagi hubungan filial dan tidak memerlukan bentuk bergender untuk mempertahankan gambaran keluarga. Catatan kaki tetap menunjukkan bentuk maskulin tunggal dalam bahasa Yunani serta daya representatifnya bagi semua yang Allah akui sebagai anak-anak-Nya.
- issue: Kerasnya μαστιγοῖ dalam hubungannya dengan disiplin Tuhan
  choice: mendera
  alternative: mencambuk; menyesah; menghajar dengan keras
  rationale: Teks sumber memakai kata kerja yang keras. “Mendera” mempertahankan ketegangan antara kasih Tuhan dan disiplin yang menyakitkan, sementara catatan kaki menjelaskan gambaran konkret kata tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur yang mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Kerasnya metafora dipertahankan, sedangkan catatan kaki menjelaskan pilihan leksikal dan bentuk filial Yunani.
