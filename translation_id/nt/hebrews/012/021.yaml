base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/021.yaml
  text: And so terrifying was the sight that Moses said[b][a], “I am fearful and trembling.”
translation:
  language: id
  text: Dan yang tampak itu[a] begitu mengerikan sehingga Musa berkata[b], “Aku sangat takut dan gemetar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “pemandangan itu” atau “penampakan itu.” Ungkapan Yunani ini menunjuk pada apa yang terlihat dalam peristiwa Sinai.
    reason: lexical_alternative
  - marker: b
    text: Kalimat ini bukan kutipan kata demi kata dari Perjanjian Lama, tetapi mencerminkan tanggapan Musa yang penuh ketakutan dalam peristiwa Sinai; bandingkan Ulangan 9:19.
    reason: cross_reference
lexical_decisions:
- source_word: καί
  choice: Bahkan
  rationale: Dalam konteks ini καί melanjutkan uraian sebelumnya sekaligus menonjolkan betapa dahsyatnya penampakan itu; “Bahkan” mengalir alami dalam bahasa Indonesia.
- source_word: οὕτω φοβερὸν ἦν
  choice: begitu mengerikan
  rationale: οὕτω menyatakan derajat, sedangkan φοβερόν menggambarkan sesuatu yang menimbulkan kengerian; susunan ini alami dan tetap kuat.
- source_word: τὸ φανταζόμενον
  choice: pemandangan itu
  rationale: Bentuk partisip ini menunjuk pada sesuatu yang tampak, yakni manifestasi yang terlihat di Sinai. “Pemandangan itu” idiomatis tanpa menentukan secara berlebihan hakikat penampakannya.
- source_word: Μωϋσῆς εἶπεν
  choice: Musa berkata
  rationale: Padanan naratif langsung dan lazim bagi nama Μωϋσῆς serta verba εἶπεν.
- source_word: Ἔκφοβός εἰμι
  choice: Aku sangat takut
  rationale: ἔκφοβος menyatakan ketakutan yang sangat kuat. “Sangat takut” mempertahankan intensitasnya dalam bahasa Indonesia yang wajar.
- source_word: καὶ ἔντρομος
  choice: dan gemetar
  rationale: ἔντρομος menambahkan unsur gemetar pada rasa takut. Diterjemahkan tersendiri agar kedua ungkapan Yunani tetap terdengar.
theological_decisions:
- issue: Hubungan ucapan Musa dengan kisah Sinai dalam Perjanjian Lama
  choice: Menyajikannya secara langsung sebagai ucapan Musa ketika menghadapi penampakan Sinai yang mengerikan.
  alternative: Menjelaskannya dalam teks utama sebagai rangkuman bebas dari tradisi tentang ketakutan Musa, bukan kutipan harfiah.
  rationale: Teks Yunani secara langsung menyatakan bahwa Musa berkata demikian. Pertanyaan tentang sumber atau bentuk kutipannya dipertahankan sebagai ketegangan intertekstual dan dijelaskan dalam catatan kaki, bukan diselesaikan di dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Susunan klausa dipertahankan dekat dengan tekanan retoris teks Yunani, sementara “sangat takut dan gemetar” menjaga dua unsur yang berbeda dalam ucapan Musa.
