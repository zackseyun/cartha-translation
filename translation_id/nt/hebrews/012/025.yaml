  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Βλέπετε μὴ παραιτήσησθε τὸν λαλοῦντα· εἰ γὰρ ἐκεῖνοι οὐκ ⸀ἐξέφυγον ⸂ἐπὶ γῆς παραιτησάμενοι τὸν⸃ χρηματίζοντα, ⸀πολὺ μᾶλλον ἡμεῖς οἱ τὸν ἀπ’ οὐρανῶν ἀποστρεφόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/025.yaml
  text: See to it that you do not refuse the one who is speaking[a]. For if those did not escape when they refused the one who warned them on earth[b], much less will we if we turn away from the one who warns from heaven.
translation:
  language: id
  text: Waspadalah supaya kamu tidak menolak dia yang berbicara. Sebab, jika mereka tidak luput ketika mereka menolak dia yang memberi peringatan di bumi, terlebih lagi kita tidak akan luput jika kita berpaling dari dia yang berbicara dari surga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “terlebih lagi kita, orang-orang yang berpaling dari Dia yang dari surga.” Kata “tidak luput” dipahami dari klausa sebelumnya, dan “yang berbicara” disediakan dari konteks. Kata Yunani untuk “memberi peringatan” juga dapat menunjuk pada penyampaian pesan atau petunjuk yang berwenang secara ilahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: Jagalah
  rationale: Imperatif jamak ini berfungsi sebagai peringatan atau desakan. 'Jagalah agar' alami dalam bahasa Indonesia modern dan menyampaikan tuntutan untuk sungguh-sungguh memperhatikan.
- source_word: μὴ παραιτήσησθε / παραιτησάμενοι
  choice: tidak menolak / yang menolak
  rationale: Mempertahankan pengulangan verba Yunani yang sama dan cocok dengan konteks penolakan terhadap pembicara ilahi.
- source_word: τὸν λαλοῦντα
  choice: Dia yang sedang berbicara
  rationale: Partisipel kini menunjukkan tindakan berbicara yang berlangsung. Huruf kapital menandai referen ilahi yang jelas dari konteks tanpa memasukkan nama atau gelar tertentu.
- source_word: ἐξέφυγον
  choice: tidak luput
  rationale: Dalam konteks ini verba tersebut berarti tidak lolos dari akibat atau penghakiman; 'tidak luput' merupakan ungkapan Indonesia yang ringkas dan wajar.
- source_word: ἐπὶ γῆς
  choice: di bumi
  rationale: Mempertahankan kontras spasial dengan ἀπ’ οὐρανῶν tanpa mempersempitnya secara eksplisit menjadi Sinai.
- source_word: χρηματίζοντα
  choice: Dia yang memberikan peringatan ilahi
  rationale: Verba ini dapat menunjuk pada penyampaian pesan, petunjuk, atau peringatan yang berwenang secara ilahi. Pilihan ini mempertahankan unsur komunikasi ilahi sekaligus daya peringatannya.
- source_word: πολὺ μᾶλλον
  choice: terlebih lagi
  rationale: Menyampaikan argumen dari yang lebih ringan kepada yang lebih berat secara idiomatis dalam bahasa Indonesia.
- source_word: ἀποστρεφόμενοι
  choice: jika kita berpaling
  rationale: Partisipel yang menerangkan 'kita' dibentuk sebagai kondisi agar elipsis Yunani terbaca jelas dalam bahasa Indonesia, tanpa memperkerasnya menjadi istilah doktrinal tertentu.
- source_word: τὸν ἀπ’ οὐρανῶν
  choice: Dia yang berbicara dari surga
  rationale: Bahasa Yunani secara harfiah hanya menyebut 'Dia yang dari surga', dengan tindakan yang dipahami dari konteks. 'Berbicara' memasok gagasan implisit dan menghubungkannya dengan τὸν λαλοῦντα pada awal ayat.
theological_decisions:
- issue: Identitas pembicara atau pemberi peringatan
  choice: Menggunakan 'Dia' tanpa menyebut secara eksplisit 'Allah' atau 'Kristus'.
  alternative: Menyebut Allah sebagai pembicara, atau mengidentifikasi pembicara surgawi sebagai Kristus.
  rationale: Konteks menunjukkan referen ilahi, tetapi ayat ini memakai ungkapan partisipial dan tidak memberikan nama atau gelar. Terjemahan tidak menentukan identitas lebih khusus daripada teks.
- issue: Elipsis pada klausa kedua
  choice: Memasok 'kita tidak akan luput'.
  alternative: 'Mempertahankan bentuk sangat harfiah: ''terlebih lagi kita yang berpaling dari Dia yang dari surga''.'
  rationale: Verba 'luput' dipahami dari klausa sebelumnya. Memasoknya diperlukan agar kalimat lengkap dan jelas dalam bahasa Indonesia modern tanpa mengubah isi argumen.
- issue: Hubungan pembicara di bumi dan pembicara dari surga
  choice: Mempertahankan deskripsi paralel tanpa menyatakan apakah keduanya merupakan pribadi yang sama atau berbeda.
  alternative: Menafsirkan keduanya secara eksplisit sebagai Allah, atau membedakan Musa di bumi dan Kristus dari surga.
  rationale: Susunan Yunani memungkinkan pembacaan kontekstual, tetapi ayat ini sendiri tidak menjelaskan identitas dan hubungan mereka secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Pengulangan 'menolak' dipertahankan, sementara elipsis Yunani dilengkapi secukupnya demi kejelasan. Istilah 'peringatan ilahi' menjaga nuansa χρηματίζω tanpa menentukan identitas pembicara secara denominatif.
