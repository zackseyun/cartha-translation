  to: Waspadalah supaya kamu tidak menolak dia yang berbicara. Sebab, jika mereka tidak luput ketika mereka menolak dia yang memberi peringatan di bumi, terlebih lagi kita tidak akan luput jika kita berpaling dari dia yang berbicara dari surga.[a]
