id: HEB.12.24
reference: Hebrews 12:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ διαθήκης νέας μεσίτῃ Ἰησοῦ, καὶ αἵματι ῥαντισμοῦ κρεῖττον λαλοῦντι παρὰ τὸν Ἅβελ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/024.yaml
  text: and to Jesus[a], the mediator of a new covenant[b], and to the sprinkled blood that speaks better than Abel.
translation:
  language: id
  text: dan kepada Yesus, Pengantara perjanjian baru, serta kepada darah yang dipercikkan[a], yang berbicara lebih baik daripada Habel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Darah yang dipercikkan” menunjuk pada darah korban yang digunakan dengan cara dipercikkan, mengingatkan pada pengesahan perjanjian dan pentahiran.
    reason: cultural_note
  - marker: b
    text: Atau “daripada darah Habel.” Teks Yunani secara harfiah hanya berbunyi “daripada Habel,” kemungkinan merujuk pada darah Habel yang berseru dari tanah (Kejadian 4:10).
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκης νέας
  choice: suatu perjanjian baru
  rationale: Dalam konteks Surat Ibrani, διαθήκη bermakna perjanjian, bukan surat wasiat. Ungkapan tanpa kata sandang diterjemahkan dengan “suatu” untuk mempertahankan bentuk tak takrif, tanpa menyangkal kaitannya dengan perjanjian baru yang telah dijanjikan dalam Kitab Suci.
- source_word: μεσίτῃ
  choice: Pengantara
  rationale: “Pengantara” merupakan istilah Indonesia yang wajar dan tepat untuk pihak yang berdiri di antara dua pihak guna mewujudkan hubungan perjanjian.
- source_word: Ἰησοῦ
  choice: Yesus
  rationale: Nama pribadi digunakan menurut bentuk baku dalam bahasa Indonesia.
- source_word: αἵματι ῥαντισμοῦ
  choice: darah yang dipercikkan
  rationale: Ungkapan ini menunjuk pada darah yang digunakan dalam tindakan pemercikan ritual. Bentuk ini jelas bagi pembaca modern dan tetap mempertahankan gambaran pengorbanan serta pentahiran.
- source_word: κρεῖττον
  choice: lebih baik
  rationale: Pilihan ini mempertahankan istilah tematis tentang sesuatu yang “lebih baik” yang berulang kali digunakan dalam Surat Ibrani.
- source_word: λαλοῦντι
  choice: yang berbicara
  rationale: Partisipel kini menerangkan “darah.” Klausa relatif ini alami dalam bahasa Indonesia dan mempertahankan personifikasi darah yang berbicara.
- source_word: παρὰ τὸν Ἅβελ
  choice: daripada Habel
  rationale: Teks Yunani menyebut Habel secara langsung, bukan secara eksplisit “darah Habel.” Terjemahan ringkas ini mempertahankan elipsis dan ketegangan penafsirannya.
theological_decisions:
- issue: Acuan perbandingan dengan Habel
  choice: Teks utama mempertahankan ungkapan ringkas “lebih baik daripada Habel.”
  alternative: “lebih baik daripada darah Habel” atau “menyampaikan hal-hal yang lebih baik daripada seruan darah Habel”
  rationale: Konteks sangat mungkin mengacu pada darah Habel yang berseru dari tanah (Kejadian 4:10), tetapi teks Yunani hanya menyebut Habel. Mempertahankan bentuk ringkas menghindari penambahan tafsiran ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur koordinatif dipertahankan karena ayat ini melanjutkan daftar dari konteks sebelumnya. Kapitalisasi “Pengantara” dipakai sebagai gelar yang langsung menerangkan Yesus.
