  text: Οὐ γὰρ προσεληλύθατε ⸀ψηλαφωμένῳ καὶ κεκαυμένῳ πυρὶ καὶ γνόφῳ καὶ ⸀ζόφῳ καὶ θυέλλῃ
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/018.yaml
  text: For you have not come to what can be touched[a], and to a blazing fire, and to darkness and gloom and storm[b],
translation:
  language: id
  text: Sebab kamu tidak datang kepada sesuatu yang dapat disentuh[a], dan kepada api yang menyala-nyala, dan kepada kegelapan, kekelaman, dan badai[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kepada gunung yang dapat disentuh.” Dari konteksnya, yang dimaksud adalah Gunung Sinai, tetapi kata “gunung” tidak disebutkan secara eksplisit dalam teks Yunani ayat ini.
    reason: alternative_reading
  - marker: b
    text: Atau, “kepada sesuatu yang dapat disentuh, kepada api yang menyala-nyala, dan kepada kegelapan, kekelaman, dan badai.”
    reason: previous_rendering
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Sebab ... tidak
  rationale: γάρ berfungsi menjelaskan dan menghubungkan ayat ini dengan uraian sebelumnya; οὐ menyangkal verba utama.
- source_word: προσεληλύθατε
  choice: kamu tidak datang kepada
  rationale: Bentuk perfektum menyatakan keadaan kini sebagai hasil dari tindakan mendekat; ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan gambaran tentang akses atau pendekatan.
- source_word: ψηλαφωμένῳ
  choice: sesuatu yang dapat disentuh
  rationale: Partisip ini berarti 'yang dapat disentuh' atau 'berwujud nyata'. Karena tidak ada nomina eksplisit seperti 'gunung' dalam teks Yunani ayat ini, terjemahan utama tidak menambahkannya.
- source_word: κεκαυμένῳ πυρί
  choice: api yang menyala-nyala
  rationale: Partisip perfektum menggambarkan api dalam keadaan berkobar; pilihan ini jelas, hidup, dan alami dalam bahasa Indonesia.
- source_word: γνόφῳ
  choice: kegelapan
  rationale: γνόφος menunjuk pada kegelapan yang pekat. Istilah ini dibedakan dari ζόφος sambil mempertahankan penumpukan retoris.
- source_word: ζόφῳ
  choice: kekelaman
  rationale: ζόφος mengandung nuansa kegelapan pekat dan muram; 'kekelaman' membedakannya dari γνόφος tanpa menghilangkan tumpang tindih maknanya.
- source_word: θυέλλῃ
  choice: badai
  rationale: θύελλα berarti badai atau angin ribut yang dahsyat; 'badai' merupakan padanan modern yang jelas.
theological_decisions:
- issue: Apakah 'gunung' perlu ditambahkan sebagai objek yang didatangi
  choice: Tidak menambahkan 'gunung' dalam teks utama; memakai 'sesuatu yang dapat disentuh'.
  alternative: kamu tidak datang kepada gunung yang dapat disentuh
  rationale: Konteks menunjuk kepada Sinai, tetapi nomina ὄρος ('gunung') tidak terdapat dalam teks Yunani ayat ini. Terjemahan utama mempertahankan ketidaktersuratan tersebut, sedangkan rujukan kontekstual dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'dan kepada' mempertahankan rangkaian καί dalam bahasa sumber, sedangkan tiga unsur terakhir disajikan sebagai deret nomina yang alami. Koma penutup dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
