  naturalness: Bahasa draf pada umumnya baku dan jelas. Penggantian “sesudah itu” dengan “kemudian” memperlancar alur kalimat, dan “berkat itu” lebih idiomatis dalam prosa Indonesia modern bernada khidmat.
  terminology: “Mewarisi,” “berkat,” “ditolak,” dan “bertobat” merupakan padanan yang tepat. Catatan a sebaiknya menyebut terjemahan alternatif yang lebih langsung, “tempat untuk bertobat,” sebelum menjelaskan kemungkinan maknanya. Catatan b dengan tepat mempertahankan ketidakpastian acuan pronomina.
