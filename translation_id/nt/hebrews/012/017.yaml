revisions:
- from: Sebab kamu tahu bahwa sesudah itu, ketika ia ingin mewarisi berkat tersebut, ia ditolak, karena ia tidak menemukan kesempatan untuk bertobat,[a] sekalipun ia mencarinya dengan air mata.[b]
  to: Sebab kamu tahu bahwa kemudian, ketika ia ingin mewarisi berkat itu, ia ditolak, karena ia tidak menemukan kesempatan untuk bertobat,[a] sekalipun ia mencarinya dengan air mata.[b]
  rationale: Revisi ini memperbaiki kealamian idiom temporal dan frasa nominal tanpa mengubah makna. Teks tetap tidak menentukan apakah yang dicari Esau dengan air mata adalah berkat atau pertobatan/kesempatan, dan catatan kaki tetap menyajikan kemungkinan bahwa pertobatan tersebut berkaitan dengan perubahan keputusan Ishak.
