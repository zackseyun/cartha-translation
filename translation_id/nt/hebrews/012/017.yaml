id: HEB.12.17
reference: Hebrews 12:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἴστε γὰρ ὅτι καὶ μετέπειτα θέλων κληρονομῆσαι τὴν εὐλογίαν ἀπεδοκιμάσθη, μετανοίας γὰρ τόπον οὐχ εὗρεν, καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/017.yaml
  text: For you know that afterward[a], when he wanted to inherit the blessing, he was rejected, for he found no opportunity for repentance[b], though he sought it with tears.
translation:
  language: id
  text: Sebab kamu tahu bahwa kemudian, ketika ia ingin mewarisi berkat itu, ia ditolak, karena ia tidak menemukan kesempatan untuk bertobat,[a] sekalipun ia mencarinya dengan air mata.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia tidak menemukan tempat untuk bertobat.” Ini dapat berarti bahwa ia tidak mendapat kesempatan untuk membalikkan hasilnya, atau bahwa ia tidak berhasil membuat Ishak mengubah keputusannya.
    reason: alternative_reading
  - marker: b
    text: Kata “-nya” dapat mengacu pada “berkat” atau, meski kurang mungkin, pada “pertobatan/kesempatan” tersebut; bahasa Yunani membiarkan acuannya tetap ambigu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε
  choice: kamu tahu
  rationale: Bentuk οἶδα bermakna kini dan mengacu kepada pengetahuan para pembaca; 'kamu tahu' alami dalam bahasa Indonesia modern.
- source_word: μετέπειτα
  choice: sesudah itu
  rationale: Adverbia temporal ini menunjuk pada waktu berikutnya dan diterjemahkan secara ringkas serta idiomatis.
- source_word: θέλων
  choice: ketika ia ingin
  rationale: Partisipium diterjemahkan sebagai klausa temporal yang alami, sambil mempertahankan unsur kehendak.
- source_word: κληρονομῆσαι
  choice: mewarisi
  rationale: Mempertahankan makna menerima sebagai warisan dan kaitannya dengan kisah berkat Esau.
- source_word: τὴν εὐλογίαν
  choice: berkat tersebut
  rationale: Menunjuk pada berkat tertentu dalam kisah Esau; 'tersebut' memperjelas definiteness tanpa memperluas isi.
- source_word: ἀπεδοκιμάσθη
  choice: ia ditolak
  rationale: Menyampaikan bentuk pasif dan arti penolakan tanpa memasukkan pengertian teknis teologis.
- source_word: μετανοίας ... τόπον
  choice: kesempatan untuk bertobat
  rationale: Mengungkapkan idiom 'menemukan tempat/ruang bagi pertobatan' dalam bahasa Indonesia yang wajar; kemungkinan arti harfiahnya dicatat dalam catatan kaki.
- source_word: καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν
  choice: sekalipun ia mencarinya dengan air mata
  rationale: Mempertahankan hubungan konsesif, cara pencarian, dan pronomina yang acuannya ambigu.
theological_decisions:
- issue: Makna μετανοίας τόπον dan acuan αὐτήν
  choice: Teks utama memakai 'kesempatan untuk bertobat' dan pronomina 'mencarinya' untuk mempertahankan ketegangan makna.
  alternative: '''Tempat bagi perubahan pikiran'' dapat berarti kesempatan membalikkan hasilnya atau perubahan keputusan Ishak; ''nya'' dapat mengacu pada berkat atau pada pertobatan/kesempatan itu.'
  rationale: Bahasa Yunani memungkinkan beberapa pemahaman dan tidak memastikan acuan pronomina. Terjemahan tidak boleh menetapkan bahwa yang dimaksud pasti pertobatan Esau, perubahan pikiran Ishak, atau berkat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. 'Sebab' mempertahankan hubungan penjelasan γάρ; 'sekalipun' menyampaikan konsesi καίπερ. Semua penanda catatan kaki ditempatkan pada bagian teks yang dijelaskan.
