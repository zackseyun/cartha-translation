id: HEB.12.28
reference: Hebrews 12:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὸ βασιλείαν ἀσάλευτον παραλαμβάνοντες ἔχωμεν χάριν, δι’ ἧς ⸀λατρεύωμεν εὐαρέστως τῷ θεῷ μετὰ ⸂εὐλαβείας καὶ δέους⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/028.yaml
  text: Therefore[a], since we are receiving an unshakable kingdom, let us have grace, through which we may serve God acceptably with reverence and awe,
translation:
  language: id
  text: Karena itu, karena kita sedang menerima kerajaan yang tidak terguncangkan, marilah kita memiliki anugerah[a]. Melalui anugerah itu, marilah kita beribadah kepada Allah dengan cara yang berkenan kepada-Nya, dengan hormat dan gentar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “marilah kita bersyukur.” Ungkapan Yunani ἔχωμεν χάριν dapat berarti “marilah kita memiliki anugerah” atau, secara idiomatis, “marilah kita bersyukur.”
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan dari uraian sebelumnya tentang pengguncangan dan penyingkiran hal-hal yang diciptakan.
- source_word: βασιλείαν ἀσάλευτον
  choice: kerajaan yang tidak terguncangkan
  rationale: Mempertahankan kontras kontekstual dengan segala sesuatu yang dapat diguncangkan dan terdengar alami dalam bahasa Indonesia.
- source_word: παραλαμβάνοντες
  choice: sebab kita sedang menerima
  rationale: Partisipel kini dipahami sebagai keadaan yang menjadi dasar ajakan berikutnya; 'sedang menerima' mempertahankan aspek yang berlangsung tanpa mengubahnya menjadi peristiwa lampau.
- source_word: ἔχωμεν χάριν
  choice: marilah kita memiliki anugerah
  rationale: Terjemahan ini mempertahankan arti leksikal χάρις serta hubungan gramatikalnya dengan δι’ ἧς. Arti idiomatis 'marilah kita bersyukur' tetap dicatat sebagai kemungkinan nyata.
- source_word: δι’ ἧς
  choice: Melalui anugerah itu
  rationale: Menyatakan fungsi instrumental διά dengan genitif dan memperjelas bahwa kata ganti relatif feminin merujuk kepada χάριν.
- source_word: λατρεύωμεν
  choice: marilah kita beribadah
  rationale: Dalam konteks Alkitab, verba ini menunjuk pada pelayanan religius kepada Allah. 'Beribadah' menyampaikan makna tersebut secara wajar dalam bahasa Indonesia tanpa membatasinya pada perasaan batin.
- source_word: εὐαρέστως τῷ θεῷ
  choice: kepada Allah dengan cara yang berkenan kepada-Nya
  rationale: Mengungkapkan secara alami bahwa ibadah itu dinilai berkenan oleh Allah.
- source_word: μετὰ εὐλαβείας καὶ δέους
  choice: dengan hormat dan gentar
  rationale: '''Hormat'' menyampaikan sikap penuh takzim dan kehati-hatian, sedangkan ''gentar'' mempertahankan unsur takut atau kedahsyatan dalam δέος tanpa melemahkannya menjadi sekadar rasa kagum.'
theological_decisions:
- issue: Makna χάριν dalam ἔχωμεν χάριν
  choice: anugerah
  alternative: rasa syukur / bersyukur
  rationale: Hubungan langsung dengan δι’ ἧς mendukung pemahaman bahwa anugerah menjadi sarana untuk beribadah dengan berkenan. Namun, ungkapan Yunani tersebut juga dapat dipahami secara idiomatis sebagai ajakan untuk bersyukur; kemungkinan ini tidak dihapus, melainkan disajikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ayat dibuat menjadi dua kalimat agar hubungan sarana dalam δι’ ἧς tetap jelas dan tidak terasa kaku. Istilah 'gentar' mempertahankan bobot δέος serta ketegangan dengan ayat berikutnya.
