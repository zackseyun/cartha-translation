reference: Hebrews 12:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/002.yaml
  text: fixing our eyes on Jesus[a], the pioneer and perfecter of faith, who for the joy set before him endured the cross, despising the shame[b], and has sat down at the right hand of the throne of God.
translation:
  language: id
  text: dengan mengarahkan pandangan kita kepada Yesus[a], pelopor dan penyempurna iman. Demi sukacita yang terbentang di hadapan-Nya, Ia menanggung salib dengan mengabaikan kehinaan[b], dan telah duduk di sebelah kanan takhta Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pelopor dan penyempurna kesetiaan,” atau “pelopor dan penyempurna iman kita.” Frasa Yunani ini ringkas; kata yang diterjemahkan “iman” juga dapat berarti “kesetiaan” atau secara khusus merujuk pada iman orang percaya.
    reason: alternative_reading
  - marker: b
    text: Atau, “dengan memandang rendah kehinaan.” Maksudnya, Ia memperlakukan kehinaan akibat penyaliban sebagai sesuatu yang tidak menentukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορῶντες
  choice: dengan mengarahkan pandangan kita kepada
  rationale: Partisip ini meneruskan ajakan ayat sebelumnya dan menyatakan perhatian yang dialihkan dari gangguan lalu dipusatkan kepada satu sasaran. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya fokusnya.
- source_word: ἀρχηγὸν
  choice: pelopor
  rationale: Kata ini dapat menunjuk kepada orang yang memulai sekaligus membuka jalan dan memimpin di depan. 'Pelopor' mempertahankan nuansa tersebut dalam konteks perlombaan.
- source_word: τελειωτὴν
  choice: penyempurna
  rationale: Kata ini menunjuk kepada pihak yang membawa sesuatu kepada kepenuhan atau tujuan akhirnya. 'Penyempurna' berpasangan secara wajar dengan 'pelopor' tanpa membatasi maknanya pada sekadar mengakhiri.
- source_word: τῆς πίστεως
  choice: iman
  rationale: Genitif Yunani yang ringkas dipertahankan tanpa menambahkan 'kita', yang tidak tersurat. Kemungkinan makna 'kesetiaan' dan 'iman kita' dicatat dalam catatan kaki.
- source_word: ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: demi sukacita yang terbentang di hadapan-Nya
  rationale: '''Demi'' menyampaikan tindakan yang dijalani dengan memandang sukacita di depan sebagai tujuan atau dorongan, sedangkan ''terbentang di hadapan'' mempertahankan gambaran sesuatu yang tersedia di depan dalam konteks perlombaan.'
- source_word: ὑπέμεινεν
  choice: menanggung
  rationale: Verba ini menyatakan ketabahan di bawah penderitaan. 'Menanggung' jelas dan alami untuk salib serta sejalan dengan tema ketekunan dalam pasal ini.
- source_word: αἰσχύνης καταφρονήσας
  choice: dengan mengabaikan kehinaannya
  rationale: Partisip ini berarti memperlakukan kehinaan sebagai sesuatu yang tidak menentukan atau tidak layak diperhitungkan. 'Mengabaikan' menghindari kesan bahwa Yesus menyukai kehinaan itu.
- source_word: ἐν δεξιᾷ ... τοῦ θρόνου τοῦ θεοῦ
  choice: di sebelah kanan takhta Allah
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran kedudukan kehormatan serta kewibawaan.
- source_word: κεκάθικεν
  choice: lalu duduk
  rationale: Bentuk perfek Yunani menyatakan tindakan yang telah terlaksana dengan hasil yang tetap. Dalam bahasa Indonesia, urutan 'lalu duduk' terdengar lebih alami; konteks takhta menyiratkan keadaan-Nya yang tetap bertakhta.
theological_decisions:
- issue: Makna τῆς πίστεως sesudah ἀρχηγὸν καὶ τελειωτὴν
  choice: Yesus disebut 'pelopor dan penyempurna iman', tanpa menambahkan pemilik iman.
  alternative: ‘pelopor dan penyempurna kesetiaan’ atau ‘pelopor dan penyempurna iman kita’
  rationale: Frasa Yunani bersifat padat dan dapat menunjuk kepada iman orang percaya ataupun kesetiaan yang diwujudkan secara sempurna oleh Yesus. Teks utama mempertahankan bentuk netral 'iman', sementara kemungkinan lain disajikan dalam catatan kaki.
- issue: Daya ἀντὶ dalam frasa tentang sukacita
  choice: Yesus menanggung salib demi sukacita yang terbentang di hadapan-Nya.
  alternative: Yesus menanggung salib sebagai ganti sukacita yang tersedia bagi-Nya.
  rationale: Walaupun ἀντί dapat berarti 'sebagai ganti', konteks ketekunan menuju sasaran lebih mendukung sukacita mendatang sebagai tujuan atau dorongan. Kemungkinan alternatif tidak dijadikan dasar bagi penafsiran spekulatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Pronomina bagi Yesus memakai kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia. Struktur partisip awal dihubungkan secara alami dengan ajakan pada ayat sebelumnya, dan semua penambahan penjelas yang tidak tersurat dihindari.
