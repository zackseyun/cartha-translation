lexical_decisions:
- source_word: καὶ
  choice: dan
  rationale: Mempertahankan hubungan sederhana dengan pernyataan sebelumnya tanpa mempersempitnya menjadi hubungan waktu atau akibat.
- source_word: τελειωθεὶς
  choice: setelah disempurnakan
  rationale: Bentuk pasif ini menyatakan bahwa Ia dibawa kepada tujuan atau penyelesaian yang dimaksud. Pilihan ini ringkas dan wajar dalam bahasa Indonesia; catatan kaki mencegah kesan bahwa yang dimaksud adalah perbaikan moral.
- source_word: ἐγένετο
  choice: Ia menjadi
  rationale: Menunjukkan keadaan atau peran yang dihasilkan sesudah proses yang disebut sebelumnya.
- source_word: πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: bagi semua orang yang taat kepada-Nya
  rationale: Menyatakan para penerima manfaat dan mempertahankan secara eksplisit makna ketaatan yang berkelanjutan atau mencirikan mereka.
- source_word: αἴτιος
  choice: sumber
  rationale: Menyampaikan bahwa Ia adalah pihak yang menyebabkan atau menghasilkan keselamatan, dengan ungkapan yang alami bagi pembaca modern.
- source_word: σωτηρίας αἰωνίου
  choice: keselamatan kekal
  rationale: Mempertahankan istilah teologis yang mapan serta sifat kekalnya secara langsung dan alami.
theological_decisions:
- issue: Makna Kristologis τελειωθεὶς
  choice: setelah disempurnakan
  alternative: setelah dibawa sampai pada penyelesaian; setelah dibuat sempurna
  rationale: Terjemahan mempertahankan bentuk pasif dan ketegangan ungkapan Yunani, sedangkan catatan menjelaskan bahwa dalam konteks Ibrani ungkapan itu menunjuk pada tercapainya tujuan penuh peran keimaman dan karya penyelamatan-Nya, bukan perpindahan dari cacat moral kepada kesalehan.
- issue: Cakupan dan syarat dalam πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: bagi semua orang yang taat kepada-Nya
  alternative: bagi semua orang yang mendengarkan-Nya; kepada semua yang menaati-Nya
  rationale: Bahasa ketaatan dipertahankan tanpa menggantinya dengan 'percaya' atau mengembangkannya menjadi rumusan doktrinal tertentu.
