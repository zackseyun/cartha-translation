id: HEB.5.7
reference: Hebrews 5:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ δεήσεις τε καὶ ἱκετηρίας πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων προσενέγκας καὶ εἰσακουσθεὶς ἀπὸ τῆς εὐλαβείας,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/007.yaml
  text: who[a], in the days of his flesh, having offered up both prayers and petitions with loud cries and tears to the one able to save him from death, and having been heard because of his reverence[b],
translation:
  language: id
  text: Ia, selama hidup-Nya dalam daging, mempersembahkan doa dan permohonan dengan seruan nyaring dan air mata kepada Dia yang sanggup menyelamatkan-Nya dari kematian[a], dan Ia didengarkan karena ketakwaan-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Menyelamatkan-Nya dari kematian” juga dapat dipahami sebagai “menyelamatkan-Nya keluar dari kematian”, yaitu membebaskan-Nya melalui kebangkitan.
    reason: alternative_reading
  - marker: b
    text: Atau, “karena rasa takut-Nya kepada Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ
  choice: selama hidup-Nya dalam daging
  rationale: Mempertahankan istilah konkret σάρξ sebagai “daging”, sekaligus mengungkapkan idiom waktunya dengan bahasa Indonesia yang alami. Frasa ini menunjuk pada kehidupan Yesus sebagai manusia tanpa menghilangkan penekanan jasmaninya.
- source_word: δεήσεις τε καὶ ἱκετηρίας
  choice: doa dan permohonan
  rationale: Membedakan dua istilah yang berdekatan maknanya tanpa memakai ungkapan kuno. “Permohonan” menyampaikan nuansa permintaan yang sungguh-sungguh.
- source_word: πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου
  choice: kepada Dia yang sanggup menyelamatkan-Nya dari kematian
  rationale: 'Mencerminkan partisipel substantival “Dia yang sanggup” dan mempertahankan ambiguitas ἐκ θανάτου: terhindar dari kematian atau dibebaskan keluar dari kematian melalui kebangkitan.'
- source_word: μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων
  choice: dengan seruan nyaring dan air mata
  rationale: Ungkapan Indonesia yang alami dan kuat; bentuk tunggal “seruan” mengikuti κραυγῆς, sedangkan “nyaring” menyampaikan intensitas ἰσχυρᾶς.
- source_word: προσενέγκας
  choice: mempersembahkan
  rationale: Mempertahankan gema persembahan yang sesuai dengan konteks keimaman dalam Ibrani, tanpa menjadikan doa itu secara eksplisit sebagai kurban ritual.
- source_word: εἰσακουσθεὶς
  choice: Ia didengarkan
  rationale: Menunjukkan bahwa permohonan-Nya didengar dengan berkenan, tetapi tidak menentukan secara berlebihan bentuk jawaban yang diberikan.
- source_word: ἀπὸ τῆς εὐλαβείας
  choice: karena sikap-Nya yang penuh hormat
  rationale: Menyampaikan makna hormat, kesalehan, atau takut akan Allah dalam bahasa Indonesia modern tanpa menambahkan gagasan “ketundukan” yang tidak dinyatakan secara eksplisit oleh kata tersebut.
theological_decisions:
- issue: Makna ἀπὸ τῆς εὐλαβείας dalam hubungannya dengan Yesus
  choice: karena sikap-Nya yang penuh hormat
  alternative: karena takut-Nya akan Allah; karena ketakwaan-Nya
  rationale: Pilihan utama menjaga makna hormat yang saleh tanpa mengesankan ketakutan yang tidak patut. Catatan kaki mempertahankan alternatif leksikal penting “takut akan Allah”.
- issue: Cakupan makna “menyelamatkan-Nya dari kematian”
  choice: mempertahankan frasa yang dapat berarti terhindar dari kematian atau dibebaskan dari dalam kematian
  alternative: menyelamatkan-Nya keluar dari kematian; menghindarkan-Nya dari kematian
  rationale: ἐκ θανάτου memungkinkan kedua pengertian itu. Teks utama tidak membatasi rujukannya hanya pada penghindaran dari kematian atau hanya pada kebangkitan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Dia/-Nya” dipakai untuk rujukan kepada Allah dan Yesus. Struktur ayat tetap berupa klausa yang berkaitan dengan konteks ayat sebelumnya dan berikutnya.
