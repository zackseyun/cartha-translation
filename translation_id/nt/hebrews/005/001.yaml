  terminology: «Imam besar», «Allah», dan «kurban» tepat untuk konteks kultis Ibrani. «Manusia» adalah padanan yang alami dan setia untuk ἀνθρώπων pada kedua kemunculan. «Pemberian» dapat dipertahankan sebagai pembedaan leksikal dari «kurban».
