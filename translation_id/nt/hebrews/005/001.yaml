revisions:
- from: Sebab, setiap imam besar dipilih dari antara manusia dan diangkat untuk mewakili manusia dalam perkara-perkara yang berhubungan dengan Allah, supaya ia mempersembahkan pemberian dan juga kurban karena dosa-dosa.
  to: Sebab, setiap imam besar diambil dari antara manusia dan diangkat untuk mewakili manusia dalam perkara-perkara yang berhubungan dengan Allah, supaya ia mempersembahkan pemberian dan kurban untuk dosa-dosa.
  rationale: '«Diambil dari antara manusia» mempertahankan bentuk pasif λαμβανόμενος tanpa mempersempitnya menjadi tindakan pemilihan eksplisit. «Untuk dosa-dosa» secara lebih langsung mencerminkan fungsi kultis ὑπὲρ ἁμαρτιῶν daripada «karena dosa-dosa», dan urutan akhir kalimat menjadikannya keterangan bagi kedua jenis persembahan. Tidak diperlukan catatan kaki: «manusia» secara wajar mencakup cakupan representatif ἀνθρώπων dalam bahasa Indonesia, tanpa menghapus konteks historis jabatan imam besar.'
