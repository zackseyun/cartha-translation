review_pass:
  verdict: revise
  source_fidelity: 'Sebagian besar makna sumber dipertahankan dengan baik: struktur generik, asal imam besar dari antara manusia, pengangkatan bagi manusia dalam urusan Allah, tujuan, serta dua jenis persembahan semuanya hadir. Namun, «karena dosa-dosa» lebih mudah dibaca sebagai sebab kausal dan, dalam letak sekarang, dapat tampak hanya menerangkan «kurban». Frasa Yunani ὑπὲρ ἁμαρτιῶν menerangkan kedua kategori persembahan dan lebih tepat diterjemahkan secara nonkausal sebagai «untuk dosa-dosa».'
