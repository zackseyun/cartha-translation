  text: Πᾶς γὰρ ἀρχιερεὺς ἐξ ἀνθρώπων λαμβανόμενος ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν, ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/001.yaml
  text: For every high priest[a], being taken from among men, is appointed on behalf of men in the things pertaining to God, so that he may offer both gifts and sacrifices for sins,
translation:
  language: id
  text: Sebab, setiap imam besar diambil dari antara manusia dan diangkat untuk mewakili manusia dalam perkara-perkara yang berhubungan dengan Allah, supaya ia mempersembahkan pemberian dan kurban untuk dosa-dosa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς γὰρ ἀρχιερεὺς
  choice: Sebab, setiap imam besar
  rationale: Πᾶς dengan nomina tunggal bersifat distributif, sedangkan γάρ menghubungkan ayat ini sebagai penjelasan bagi uraian sebelumnya. 'Imam besar' adalah istilah baku bagi jabatan kultis Yahudi tersebut.
- source_word: ἐξ ἀνθρώπων λαμβανόμενος
  choice: dipilih dari antara manusia
  rationale: Partisip pasif ini menyatakan bahwa imam besar diambil dari kalangan sesama manusia. Dalam bahasa Indonesia, 'dipilih dari antara' menyampaikan maksudnya secara alami tanpa menentukan pelaku yang tidak disebutkan.
- source_word: ὑπὲρ ἀνθρώπων καθίσταται
  choice: diangkat untuk mewakili manusia
  rationale: καθίσταται menunjuk pada pengangkatan ke dalam jabatan, sementara ὑπέρ menyatakan fungsi demi atau atas nama pihak lain. 'Untuk mewakili' memperjelas fungsi perantara tanpa menambahkan doktrin tertentu.
- source_word: τὰ πρὸς τὸν θεόν
  choice: dalam perkara-perkara yang berhubungan dengan Allah
  rationale: Ungkapan Yunani ini mengacu pada urusan pelayanan atau ibadah yang tertuju kepada Allah. Pilihan ini dekat dengan bentuk sumber dan tetap wajar dalam bahasa Indonesia.
- source_word: ἵνα προσφέρῃ
  choice: supaya ia mempersembahkan
  rationale: ἵνα dengan bentuk subjungtif menyatakan tujuan; 'supaya' mempertahankan hubungan tujuan tersebut.
- source_word: δῶρά τε καὶ θυσίας
  choice: pemberian dan juga kurban
  rationale: τε καὶ mengaitkan dua kategori persembahan. 'Pemberian' membedakan δῶρα dari 'kurban' untuk θυσίας, sedangkan 'dan juga' mempertahankan penekanan bahwa keduanya dipersembahkan.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: karena dosa-dosa
  rationale: Dalam konteks persembahan kultis, frasa ini menyatakan bahwa kurban dipersembahkan berkenaan dengan dosa. 'Karena dosa-dosa' alami dan tidak mengartikan seolah-olah dosa adalah pihak yang diwakili.
theological_decisions:
- issue: Cakupan ἀνθρώπων dan bahasa representatif bergender
  choice: manusia pada kedua kemunculan
  alternative: laki-laki / orang-orang
  rationale: Walaupun ἄνθρωπος dapat memakai bentuk gramatikal maskulin dan para imam besar historis adalah laki-laki, kata ini pada kedua tempat menekankan asal imam dari umat manusia dan pelayanannya bagi manusia. Bahasa Indonesia 'manusia' mempertahankan cakupan itu tanpa meniadakan konteks jabatan imam yang historis.
- issue: Nuansa ὑπὲρ ἁμαρτιῶν
  choice: karena dosa-dosa
  alternative: untuk dosa-dosa / berkenaan dengan dosa-dosa
  rationale: Frasa ini sengaja tidak diperluas menjadi rumusan khusus tentang mekanisme pendamaian. Terjemahan terpilih mempertahankan kaitan kurban dengan dosa sambil membiarkan uraian teologis surat Ibrani menjelaskannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur argumentatif dipertahankan dengan 'Sebab'; kalimat dibuat alami bagi pembaca umum tanpa menghilangkan istilah kultis utama seperti 'imam besar', 'mempersembahkan', dan 'kurban'.
