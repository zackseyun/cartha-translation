  to: Demikian juga, Sang Mesias tidak memuliakan diri-Nya sendiri untuk menjadi Imam Besar, melainkan oleh Dia yang berfirman kepada-Nya, “Engkaulah Anak-Ku; hari ini Aku telah memperanakkan Engkau.”[a]
