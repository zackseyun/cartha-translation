id: HEB.5.5
reference: Hebrews 5:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ Χριστὸς οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα, ἀλλ’ ὁ λαλήσας πρὸς αὐτόν· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/005.yaml
  text: 'So also the Messiah did not glorify himself to become high priest[a], but the one who spoke to him: “You are my Son[c][b]; today I have begotten you.”'
translation:
  language: id
  text: Demikian juga, Sang Mesias tidak memuliakan diri-Nya sendiri untuk menjadi Imam Besar, melainkan oleh Dia yang berfirman kepada-Nya, “Engkaulah Anak-Ku; hari ini Aku telah memperanakkan Engkau.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kutipan dari Mazmur 2:7.
    reason: cross_reference
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Demikian juga
  rationale: Menandai perbandingan dengan pembahasan sebelumnya tentang pengangkatan imam dan terdengar alami dalam bahasa Indonesia.
- source_word: ὁ Χριστὸς
  choice: Sang Mesias
  rationale: Χριστός berfungsi sebagai gelar dalam konteks pengangkatan kepada jabatan, sehingga 'Sang Mesias' menyampaikan fungsi titulernya dengan jelas.
- source_word: οὐχ ἑαυτὸν ἐδόξασεν
  choice: tidak memuliakan diri-Nya sendiri
  rationale: Mempertahankan makna dasar δοξάζω dan konstruksi refleksif tanpa menafsirkan tindakan itu secara lebih khusus sebagai pengangkatan diri.
- source_word: γενηθῆναι ἀρχιερέα
  choice: untuk menjadi Imam Besar
  rationale: Menyatakan masuk ke dalam peran atau kedudukan imam besar; kapitalisasi menandai jabatan khusus dalam konteks ini.
- source_word: ἀλλ’ ὁ λαλήσας πρὸς αὐτόν
  choice: melainkan Dia yang berfirman kepada-Nya
  rationale: Partisip substantival dipertahankan tanpa menyisipkan nama 'Allah'; 'berfirman' sesuai untuk ujaran ilahi dalam ragam Alkitab Indonesia yang modern dan bermartabat.
- source_word: Υἱός μου εἶ σύ
  choice: Engkaulah Anak-Ku
  rationale: Bentuk '-lah' menyampaikan penegasan pada σύ secara alami, sedangkan kapitalisasi mengikuti sapaan mesianik dalam kutipan.
- source_word: ἐγὼ σήμερον γεγέννηκά σε
  choice: hari ini Aku telah memperanakkan Engkau
  rationale: Mempertahankan citra kelahiran dari γεννάω dan bentuk perfektum, serta tidak menentukan apakah kutipan itu merujuk pada penobatan, kebangkitan, atau pengertian teologis lain.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam argumen mengenai pengangkatan kepada jabatan, istilah ini aktif sebagai gelar; 'Sang Mesias' mempertahankan makna tersebut.
- issue: Makna “hari ini Aku telah memperanakkan Engkau”
  choice: Mempertahankan kutipan secara langsung tanpa penjelasan interpretatif
  alternative: Parafrasa yang menentukan penobatan, kebangkitan, atau kelahiran kekal
  rationale: Teks mengutip Mazmur 2:7 dan tidak secara eksplisit menyelesaikan hubungan antara bahasa 'hari ini' dan identitas Sang Anak; terjemahan harus menjaga ketegangan itu.
- issue: Pelaku yang memuliakan atau mengangkat Sang Mesias
  choice: Dibiarkan tersirat sebagai “Dia yang berfirman”
  alternative: Menambahkan “Allah” dalam teks utama
  rationale: Bahasa Yunani memakai partisip substantival tanpa menyebut nama pelaku; konteks kutipan menjadikannya jelas, sehingga bentuk tersirat dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti yang merujuk kepada Sang Mesias dan kepada Allah dikapitalisasi menurut konvensi penerjemahan Alkitab Indonesia. Susunan kutipan dibuat alami sambil mempertahankan penegasan dan ketegangan teologis teks sumber.
