  text: τελείων δέ ἐστιν ἡ στερεὰ τροφή, τῶν διὰ τὴν ἕξιν τὰ αἰσθητήρια γεγυμνασμένα ἐχόντων πρὸς διάκρισιν καλοῦ τε καὶ κακοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/014.yaml
  text: But solid food is for the mature[b][a], who because of practice have their powers of discernment trained to distinguish both good and evil.
translation:
  language: id
  text: Tetapi makanan padat adalah untuk orang-orang dewasa, yaitu mereka yang karena latihan[a] memiliki daya pengertian[b] yang telah terlatih untuk membedakan yang baik dan yang jahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena kebiasaan” atau “melalui penggunaan yang terus-menerus.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “indra-indra”; di sini menunjuk secara kiasan pada kemampuan seseorang untuk memahami dan menilai.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελείων
  choice: orang-orang dewasa
  rationale: Dalam konteks ini, bentuk tersebut menunjuk kepada orang yang telah mencapai kedewasaan, berlawanan dengan bayi pada ayat sebelumnya. Pilihan ini menyampaikan kematangan rohani tanpa menyiratkan kesempurnaan tanpa dosa.
- source_word: στερεὰ τροφή
  choice: makanan padat
  rationale: Ungkapan alami dalam bahasa Indonesia yang mempertahankan metafora pertentangan dengan susu.
- source_word: διὰ τὴν ἕξιν
  choice: karena latihan
  rationale: ἕξις dapat berarti kebiasaan, praktik, atau kemampuan yang terbentuk melalui penggunaan berulang. 'Karena latihan' menyampaikan sebab dan proses pembiasaan secara ringkas; alternatifnya dicatat dalam catatan kaki.
- source_word: τὰ αἰσθητήρια
  choice: daya pengertian
  rationale: Secara harfiah menunjuk pada alat atau indra persepsi, tetapi di sini digunakan secara metaforis untuk kemampuan batin dalam menilai. Pilihan ini alami dan tetap diberi catatan tentang citra harfiahnya.
- source_word: γεγυμνασμένα ἐχόντων
  choice: memiliki ... yang telah terlatih
  rationale: Bentuk perfektif menyatakan keadaan yang dihasilkan oleh latihan sebelumnya dan kini dimiliki oleh mereka.
- source_word: πρὸς διάκρισιν
  choice: untuk membedakan
  rationale: Menyampaikan tujuan atau hasil yang dinyatakan oleh πρός dan menghubungkannya langsung dengan pasangan objek berikutnya.
- source_word: καλοῦ τε καὶ κακοῦ
  choice: yang baik dan yang jahat
  rationale: Menyampaikan pasangan moral καλοῦ ... κακοῦ secara wajar dalam bahasa Indonesia tanpa menambahkan tafsiran.
- source_word: δέ
  choice: Tetapi
  rationale: Menandai kontras dengan pembahasan tentang susu dan ketidakdewasaan pada konteks sebelumnya.
theological_decisions:
- issue: Makna τελείων dalam konteks pertumbuhan rohani
  choice: orang-orang dewasa
  alternative: orang-orang sempurna; orang-orang yang matang
  rationale: Konteks mempertentangkan bayi dengan mereka yang kemampuan membedakannya telah terlatih. Terjemahan ini mempertahankan gambaran kedewasaan tanpa memasukkan gagasan kesempurnaan moral yang tidak dituntut oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan kontras serta metafora makanan, sambil menjelaskan istilah persepsi melalui pilihan alami dan catatan kaki.
