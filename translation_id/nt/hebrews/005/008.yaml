  text: Sekalipun Ia adalah Anak, Ia belajar ketaatan dari apa yang Ia derita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “Ia belajar ketaatan” berbicara tentang belajar melalui penderitaan yang sungguh Ia alami, bukan tentang diperbaiki dari ketidaktaatan sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: Sekalipun
  rationale: Partikel konsesif ini menandai pertentangan antara kedudukan-Nya sebagai Anak dan kenyataan bahwa Ia belajar ketaatan melalui penderitaan.
- source_word: ὢν υἱός
  choice: Ia adalah Anak
  rationale: Partisip ὢν dinyatakan sebagai klausa finit yang alami dalam bahasa Indonesia. υἱός tanpa artikel tetap dapat menunjuk pada identitas khas Yesus sebagai Anak; bahasa Indonesia tidak memakai artikel tak tentu seperti bahasa Inggris.
- source_word: ἔμαθεν
  choice: Ia belajar
  rationale: Bentuk aoris μανθάνω secara langsung menyatakan bahwa Ia belajar; ungkapan ini dipertahankan tanpa diperlemah atau dijelaskan di dalam teks.
- source_word: ἀφ’ ὧν
  choice: dari apa yang
  rationale: ἀπό dengan pronomina relatif menunjukkan sumber atau sarana pengalaman yang darinya ketaatan itu dipelajari.
- source_word: ἔπαθεν
  choice: diderita-Nya
  rationale: Bentuk aoris πάσχω menunjuk pada penderitaan nyata yang dialami-Nya. Bentuk pasif idiomatis ini mempertahankan makna sambil menghasilkan bahasa Indonesia yang wajar.
- source_word: τὴν ὑπακοήν
  choice: ketaatan
  rationale: Kata benda abstrak ini secara alami tidak memerlukan penanda definit dalam bahasa Indonesia dan menyatakan ketundukan yang taat.
theological_decisions:
- issue: Status Yesus sebagai Anak dalam kaitannya dengan proses belajar
  choice: Sekalipun Ia adalah Anak
  alternative: Sekalipun Ia seorang anak
  rationale: Terjemahan mempertahankan daya konsesif dan identitas khas Yesus sebagai Anak tanpa menyisipkan artikel yang tidak dimiliki bahasa Indonesia. Huruf kapital menandai pemakaian kristologis dalam konteks.
- issue: Apakah 'belajar ketaatan' menyiratkan ketidaktaatan sebelumnya
  choice: Mempertahankan ungkapan langsung 'Ia belajar ketaatan'
  alternative: Ia mengalami makna ketaatan; Ia belajar harga sebuah ketaatan
  rationale: Teks Yunani menyatakan bahwa Ia belajar ketaatan. Ketegangan teologis ini tidak dihilangkan dengan parafrasa; catatan menjelaskan bahwa yang dimaksud adalah pembelajaran melalui pengalaman penderitaan, bukan koreksi atas ketidaktaatan sebelumnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mengikuti alur Yunani secara dekat, tetapi tetap alami. Kapitalisasi “Anak” dan pronomina yang merujuk kepada Yesus mengikuti konvensi hormat yang lazim dalam penerbitan Alkitab bahasa Indonesia.
