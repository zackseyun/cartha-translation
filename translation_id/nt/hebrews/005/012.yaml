id: HEB.5.12
reference: Hebrews 5:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ γὰρ ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον, πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς ⸀τινὰ τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ, καὶ γεγόνατε χρείαν ἔχοντες γάλακτος, ⸀οὐ στερεᾶς τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/012.yaml
  text: For although by this time you ought to be teachers[a], you again need someone to teach you the basic elements of the beginning of the oracles of God, and you have come to need milk[b], not solid food.
translation:
  language: id
  text: Sebab, oleh karena waktu yang telah berlalu, kalian seharusnya sudah menjadi pengajar, tetapi kalian kembali membutuhkan seseorang untuk mengajarkan kepada kalian pokok-pokok dasar yang mula-mula dari firman Allah.[a] Kalian malah telah menjadi orang yang membutuhkan susu, bukan makanan keras.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “asas-asas permulaan dari ucapan-ucapan Allah.”
    reason: lexical_alternative
  - marker: b
    text: “Susu” dan “makanan keras” adalah metafora bagi pengajaran yang sesuai dengan tahap ketidakdewasaan dan kedewasaan.
    reason: metaphor_note
lexical_decisions:
- source_word: ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον
  choice: mengingat waktu yang telah berlalu kamu seharusnya sudah menjadi pengajar
  rationale: Mengungkapkan kewajiban atau harapan berdasarkan lamanya waktu yang telah berlalu dengan bahasa Indonesia yang wajar.
- source_word: πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς
  choice: kamu kembali membutuhkan seseorang untuk mengajarkan kepadamu
  rationale: Mempertahankan gagasan bahwa mereka sekali lagi memerlukan pengajaran; pelaku tersirat diungkapkan sebagai 'seseorang' agar alami.
- source_word: τινὰ τὰ στοιχεῖα τῆς ἀρχῆς
  choice: unsur-unsur dasar ... yang mula-mula
  rationale: στοιχεῖα menunjuk unsur atau asas paling mendasar, sedangkan τῆς ἀρχῆς menekankan tahap permulaan; susunan ini menjaga kedua nuansa tanpa menjadi terlalu harfiah.
- source_word: τῶν λογίων τοῦ θεοῦ
  choice: firman Allah
  rationale: λόγια adalah ucapan atau penyataan ilahi. 'Firman Allah' merupakan ungkapan Indonesia yang alami dan bermartabat, sementara catatan kaki menjelaskan cakupan maknanya.
- source_word: γεγόνατε χρείαν ἔχοντες
  choice: kamu malah sudah menjadi orang yang membutuhkan
  rationale: Perfect γεγόνατε menyatakan keadaan kini yang telah terbentuk; 'malah' menonjolkan kemunduran retoris dalam konteks.
- source_word: γάλακτος, οὐ στερεᾶς τροφῆς
  choice: susu, bukan makanan keras
  rationale: Mempertahankan metafora asli dan pertentangannya tanpa menjabarkannya menjadi sistem tingkat pengajaran tertentu.
theological_decisions:
- issue: Metafora susu dan makanan keras
  choice: Metafora dipertahankan tanpa penjelasan doktrinal di dalam teks.
  alternative: Memparafrasakannya sebagai pengajaran dasar dan pengajaran tingkat lanjut.
  rationale: Penulis memakai metafora untuk menegur ketidakdewasaan, tetapi ayat ini tidak menetapkan kurikulum atau skema kedewasaan denominasi tertentu.
- issue: Makna λόγια τοῦ θεοῦ
  choice: firman Allah
  alternative: ucapan-ucapan Allah; penyataan-penyataan Allah
  rationale: Pilihan ini alami dalam bahasa Indonesia dan tetap dapat mencakup ucapan atau penyataan ilahi; nuansa khusus λόγια dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kamu' yang dipahami dari konteks. Nada teguran dipertahankan melalui 'kembali' dan 'malah', sedangkan struktur kalimat dilancarkan agar mudah dipahami pembaca umum.
