  yaml_path: translation/nt/hebrews/005/013.yaml
  text: For everyone who partakes of milk is unskilled in the word of righteousness[b][a], for he is an infant.
translation:
  language: id
  text: Sebab setiap orang yang minum susu tidak berpengalaman dalam ajaran tentang kebenaran[a], karena ia adalah bayi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ajaran kebenaran” atau “pesan tentang kebenaran”; “kebenaran” juga dapat diterjemahkan “keadilan.”
    reason: Memelihara kemungkinan hubungan genitif dalam λόγου δικαιοσύνης serta nuansa alternatif δικαιοσύνη.
lexical_decisions:
- source_word: πᾶς ... ὁ μετέχων
  choice: setiap orang yang masih minum
  rationale: Konstruksi ini bersifat distributif, menunjuk kepada setiap orang dalam golongan tersebut. 'Minum' mempertahankan metafora susu secara alami dalam bahasa Indonesia; 'masih' menyatakan keadaan ketidakdewasaan yang tersirat oleh konteks tanpa menjadikannya ketergantungan eksklusif.
- source_word: γάλακτος
  choice: susu
  rationale: Arti harfiahnya dipertahankan karena metafora pendidikan dan pertumbuhan telah dibangun dalam konteks.
- source_word: ἄπειρος
  choice: tidak berpengalaman
  rationale: Menunjukkan ketiadaan pengalaman atau kecakapan, bukan ketidaktahuan mutlak.
- source_word: λόγου δικαιοσύνης
  choice: firman tentang kebenaran
  rationale: '''Firman'' mempertahankan λόγος sebagai perkataan, pesan, atau pengajaran. ''Tentang'' menyajikan pembacaan genitif yang wajar dalam bahasa Indonesia, sementara catatan kaki mempertahankan kemungkinan hubungan genitif lain.'
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: Dalam bahasa Indonesia Alkitabiah modern, 'kebenaran' dapat mencakup keadaan benar dan perilaku yang benar; kemungkinan nuansa 'keadilan' tetap dicatat.
- source_word: νήπιος
  choice: bayi
  rationale: Mempertahankan ketajaman metafora ketidakdewasaan dan berkaitan langsung dengan susu.
- source_word: γάρ ... γάρ
  choice: sebab ... karena
  rationale: Kedua unsur bersifat menjelaskan. Variasi 'sebab' dan 'karena' menghasilkan alur Indonesia yang alami tanpa menghilangkan hubungan argumentatif.
theological_decisions:
- issue: Hubungan genitif dalam λόγου δικαιοσύνης
  choice: firman tentang kebenaran
  alternative: firman kebenaran; firman yang menghasilkan atau mencirikan kebenaran
  rationale: Genitif Yunani ringkas dan dapat dipahami sebagai pesan mengenai kebenaran atau sebagai firman yang berkaitan dengan atau bercirikan kebenaran. Teks utama memakai pembacaan relasional yang alami, sedangkan catatan kaki menjaga ambiguitasnya.
- issue: Cakupan makna δικαιοσύνη
  choice: kebenaran
  alternative: keadilan
  rationale: '''Kebenaran'' paling sesuai dengan konteks pembentukan dan kedewasaan rohani, tetapi δικαιοσύνη juga dapat mengandung nuansa keadilan; kemungkinan itu tidak disingkirkan.'
- issue: Rujukan generik νήπιος ... ἐστιν
  choice: ia masih bayi
  alternative: orang itu masih bayi
  rationale: '''Ia'' dalam bahasa Indonesia dapat berfungsi secara generik tanpa menandai jenis kelamin, sementara bentuk tunggal dan metafora pribadi dalam sumber tetap dipertahankan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan metafora susu dan bayi dipertahankan. Penanda 'masih' memperjelas hubungan metaforis dengan ketidakdewasaan dalam konteks.
