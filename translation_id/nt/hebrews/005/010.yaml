  text: προσαγορευθεὶς ὑπὸ τοῦ θεοῦ ἀρχιερεὺς κατὰ τὴν τάξιν Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/010.yaml
  text: having been designated by God as a high priest according to the order of Melchizedek[a][b].
translation:
  language: id
  text: dan telah dinyatakan oleh Allah sebagai Imam Besar menurut tatanan Melkisedek.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah disebut oleh Allah sebagai Imam Besar” atau “telah diangkat oleh Allah menjadi Imam Besar.”
    reason: lexical_alternative
  - marker: b
    text: Ini menggemakan Mazmur 110:4, yang menyebut keimaman “menurut tatanan Melkisedek.”
    reason: cross_reference
lexical_decisions:
- source_word: προσαγορευθεὶς
  choice: telah dinyatakan
  rationale: Partisip aoris pasif dari προσαγορεύω menyatakan tindakan Allah yang menamai atau menetapkan secara resmi. 'Dinyatakan' mempertahankan bentuk pasif dan nuansa deklaratif tanpa memperkuatnya menjadi bahasa pelantikan.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: oleh Allah
  rationale: Ὑπό dengan genetif menunjukkan pelaku dalam konstruksi pasif. Teks hanya menyebut Allah, sehingga 'Bapa' tidak ditambahkan.
- source_word: ἀρχιερεὺς
  choice: Imam Besar
  rationale: Padanan baku dan alami dalam bahasa Indonesia untuk ἀρχιερεύς. Kapitalisasi dipakai sebagai sebutan jabatan Kristus dalam konteks ini.
- source_word: κατὰ τὴν τάξιν
  choice: menurut aturan
  rationale: Κατά menyatakan kesesuaian, sedangkan τάξις di sini menunjuk pada tatanan atau pola keimaman. 'Menurut aturan' mempertahankan kaitan konseptual dengan Mazmur 110:4 tanpa menyiratkan sekadar urutan waktu.
- source_word: Μελχισέδεκ
  choice: Melkisedek
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Apakah προσαγορευθεὶς harus diterjemahkan dengan bahasa pengangkatan atau deklarasi
  choice: telah dinyatakan oleh Allah sebagai Imam Besar
  alternative: telah diangkat oleh Allah menjadi Imam Besar; telah disebut oleh Allah sebagai Imam Besar
  rationale: '''Dinyatakan'' menyampaikan tindakan ilahi yang resmi tanpa memastikan bahwa ayat ini berbicara tentang perubahan hakikat atau pelantikan institusional. Dengan demikian, ketegangan teologis teks tetap terpelihara.'
- issue: Makna τάξις dalam hubungan dengan Melkisedek
  choice: aturan Melkisedek
  alternative: tatanan Melkisedek; pola Melkisedek
  rationale: '''Aturan'' cukup luas untuk menyatakan kesesuaian dengan jenis atau tatanan keimaman Melkisedek dan mempertahankan gema Mazmur 110:4.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata penghubung 'dan' mempertahankan kesinambungan partisip ini dengan kalimat sebelumnya. Istilah tradisional 'Imam Besar' dan bentuk nama Indonesia 'Melkisedek' dipertahankan agar mudah dikenali.
