id: HEB.5.2
reference: Hebrews 5:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μετριοπαθεῖν δυνάμενος τοῖς ἀγνοοῦσι καὶ πλανωμένοις ἐπεὶ καὶ αὐτὸς περίκειται ἀσθένειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/002.yaml
  text: being able to deal gently with those who are ignorant and going astray[a], since he himself also is beset with weakness[b],
translation:
  language: id
  text: Ia mampu bersikap lembut terhadap orang-orang yang tidak tahu dan yang tersesat[a], karena ia sendiri juga diliputi kelemahan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang disesatkan.” Partisipel Yunani ini dapat dipahami dengan nuansa pasif.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dikelilingi oleh” atau “diselubungi dengan” kelemahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετριοπαθεῖν
  choice: bersikap lembut terhadap
  rationale: Kata kerja ini menyatakan tanggapan yang terkendali dan tidak keras. Frasa ini alami dalam bahasa Indonesia serta mencakup sikap dan perlakuan.
- source_word: δυνάμενος
  choice: Ia mampu
  rationale: Partisipel ini menyatakan kemampuan yang dimiliki imam besar; bentuk klausa lebih alami dalam bahasa Indonesia tanpa menghilangkan maknanya.
- source_word: τοῖς ἀγνοοῦσι
  choice: terhadap orang-orang yang tidak tahu
  rationale: Pilihan ini mempertahankan sifat partisipial dan tidak menjadikan mereka suatu golongan tetap; ketidaktahuan dibiarkan umum sebagaimana teks Yunani.
- source_word: πλανωμένοις
  choice: yang tersesat
  rationale: Bentuk ini alami dan mempertahankan kemungkinan nuansa keadaan maupun pasif tanpa menentukan secara tegas siapa yang menyebabkan kesesatan.
- source_word: ἐπεὶ
  choice: karena
  rationale: Konjungsi ini memperkenalkan alasan bagi kemampuan imam besar untuk bersikap lembut.
- source_word: καὶ αὐτὸς
  choice: ia sendiri juga
  rationale: Susunan ini mempertahankan penekanan pada imam besar secara pribadi sekaligus daya aditif καί.
- source_word: περίκειται ἀσθένειαν
  choice: diliputi kelemahan
  rationale: Ungkapan ini menyampaikan gambaran harfiah tentang kelemahan yang mengelilingi atau menyelubungi seseorang, dengan bahasa Indonesia yang wajar, serta menjaga keluasan makna ἀσθένεια.
theological_decisions:
- issue: Sifat kegagalan orang-orang yang digambarkan oleh ἀγνοοῦσι καὶ πλανωμένοις
  choice: orang-orang yang tidak tahu dan yang tersesat
  alternative: orang-orang yang melakukan dosa tanpa sengaja dalam kategori teknis sistem korban Lewi
  rationale: Bahasanya selaras dengan latar keimaman Perjanjian Lama, tetapi ungkapan Yunani itu sendiri lebih luas. Terjemahan tidak mempersempitnya menjadi kategori korban tertentu.
- issue: Makna ἀσθένεια pada imam besar
  choice: kelemahan dalam arti luas sebagai kerapuhan manusia
  alternative: kelemahan jasmani saja atau kelemahan moral saja
  rationale: Kata tersebut dapat mencakup berbagai keterbatasan manusia. 'Kelemahan' mempertahankan keluasan dan ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Struktur kalimat dibuat alami, sementara gambaran Yunani serta ambiguitas pada πλανωμένοις dan keluasan ἀσθένεια dipertahankan.
