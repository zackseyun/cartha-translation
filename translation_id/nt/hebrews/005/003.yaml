id: HEB.5.3
reference: Hebrews 5:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸂δι’ αὐτὴν⸃ ὀφείλει, καθὼς περὶ τοῦ λαοῦ, οὕτως καὶ περὶ ⸀αὑτοῦ προσφέρειν ⸀περὶ ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/003.yaml
  text: And because of this he is obligated[a], just as for the people, so also for himself, to offer for sins.
translation:
  language: id
  text: Dan karena hal itu, ia wajib[a] mempersembahkan kurban untuk dosa-dosa, baik bagi umat maupun bagi dirinya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “karena hal itu” atau “karena itu”; frasa ini kemungkinan besar menunjuk kembali pada kelemahan imam besar yang disebutkan dalam ayat sebelumnya.
    reason: Menjelaskan pronomina feminin Yunani dan kemungkinan anteseden kontekstualnya tanpa menyatakannya secara berlebihan dalam teks utama.
lexical_decisions:
- source_word: δι’ αὐτὴν
  choice: karena hal itu
  rationale: Mempertahankan daya kausal διά dengan akusatif dan acuan pronomina yang tidak dinyatakan secara eksplisit; dalam konteks, hal itu menunjuk kembali pada kelemahan imam besar di ayat sebelumnya.
- source_word: ὀφείλει
  choice: ia wajib
  rationale: Menyatakan kewajiban yang mengikat dalam tugas keimaman, bukan sekadar anjuran.
- source_word: καθὼς ... οὕτως καὶ
  choice: baik ... maupun ... sendiri
  rationale: Mengungkapkan kesejajaran antara umat dan imam secara alami dalam bahasa Indonesia, meskipun bentuk harfiah 'sebagaimana ... demikian juga' tidak dipertahankan.
- source_word: τοῦ λαοῦ
  choice: umat
  rationale: Dalam konteks keimaman dan perjanjian, 'umat' secara wajar menunjuk kepada umat yang dilayani imam tanpa menambahkan 'Israel' ke dalam teks.
- source_word: περὶ αὑτοῦ
  choice: bagi dirinya sendiri
  rationale: Mempertahankan makna refleksif dan menegaskan bahwa imam juga mempersembahkan bagi kepentingannya sendiri.
- source_word: προσφέρειν
  choice: mempersembahkan kurban
  rationale: Walaupun objek tidak dinyatakan dalam klausa Yunani, konteks kultis membuat persembahan kurban jelas; penambahan 'kurban' menghasilkan bahasa Indonesia yang alami.
- source_word: περὶ ἁμαρτιῶν
  choice: karena dosa
  rationale: Mengungkapkan hubungan persembahan dengan dosa tanpa mempersempitnya menjadi istilah teknis 'kurban penghapus dosa'.
theological_decisions:
- issue: Acuan frasa 'karena hal itu'
  choice: Dibiarkan sebagai 'hal itu', dengan catatan bahwa acuan terdekatnya ialah kelemahan imam besar pada ayat sebelumnya.
  alternative: Menuliskan secara eksplisit 'karena kelemahannya'.
  rationale: Teks Yunani memakai pronomina dan tidak mengulangi kata 'kelemahan'; terjemahan utama mempertahankan bentuk rujukan itu agar tidak menghapus ambiguitas yang masih mungkin.
- issue: Objek yang tersirat pada 'mempersembahkan'
  choice: Menambahkan 'kurban' demi kejelasan idiomatis.
  alternative: Menerjemahkan hanya 'mempersembahkan karena dosa'.
  rationale: Konteks imam besar dan persembahan menjadikan tindakan kurban jelas, sedangkan bahasa Indonesia lazimnya memerlukan objek agar kalimat tidak terasa janggal.
- issue: Kesejajaran umat dan imam
  choice: Menggunakan 'baik bagi umat maupun bagi dirinya sendiri'.
  alternative: 'Mengikuti urutan lebih harfiah: ''sebagaimana bagi umat, demikian juga bagi dirinya sendiri''.'
  rationale: Bentuk 'baik ... maupun ...' mempertahankan hubungan paralel dan penekanan bahwa kewajiban yang sama mencakup imam, dengan susunan Indonesia yang lebih alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah 'umat', 'wajib', dan 'mempersembahkan kurban' cocok dengan konteks keimaman serta mudah dipahami pembaca umum.
