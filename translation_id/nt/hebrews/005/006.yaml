id: HEB.5.6
reference: Hebrews 5:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καθὼς καὶ ἐν ἑτέρῳ λέγει· Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/006.yaml
  text: just as he also says in another place[b][a], “You are a priest forever according to the order of Melchizedek,”
translation:
  language: id
  text: sebagaimana Dia juga berfirman di bagian lain[a], “Engkau adalah imam untuk selama-lamanya menurut tatanan Melkisedek[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam yang lain”; maksudnya, di bagian lain dari Kitab Suci.
    reason: lexical_alternative
  - marker: b
    text: Atau “menurut golongan Melkisedek” atau “menurut pola Melkisedek.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς καὶ
  choice: sebagaimana ... juga
  rationale: Mempertahankan unsur perbandingan καθώς dan penambahan καί dalam susunan Indonesia yang wajar.
- source_word: ἐν ἑτέρῳ
  choice: di bagian lain
  rationale: Ungkapan Yunani ini eliptis, secara harfiah 'dalam yang lain'; 'bagian' dipahami sebagai bagian lain dari Kitab Suci.
- source_word: λέγει
  choice: Dia ... berfirman
  rationale: Bentuk kini tunggal ini mempertahankan Allah sebagai pembicara tersirat dalam Kitab Suci; 'berfirman' sesuai untuk ujaran ilahi tanpa menambahkan nama subjek.
- source_word: Σὺ
  choice: Engkau
  rationale: Mempertahankan sapaan langsung orang kedua tunggal dengan ragam luhur yang lazim bagi sapaan kepada Kristus.
- source_word: ἱερεὺς
  choice: imam
  rationale: Padanan baku untuk ἱερεύς; bahasa Indonesia tidak memerlukan kata sandang tak tentu.
- source_word: εἰς τὸν αἰῶνα
  choice: untuk selama-lamanya
  rationale: Menyampaikan keberlangsungan tanpa akhir secara alami dan khidmat dalam bahasa Indonesia.
- source_word: κατὰ τὴν τάξιν
  choice: menurut tatanan
  rationale: '''Tatanan'' mempertahankan gagasan susunan atau kategori keimaman dan menghindari kesan bahwa yang dimaksud semata-mata urutan kronologis.'
- source_word: Μελχισέδεκ
  choice: Melkisedek
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Rujukan pembicara dalam rumus kutipan
  choice: Dia juga berfirman
  alternative: tertulis juga; Kitab Suci juga berkata
  rationale: Ibrani lazim menghadirkan Kitab Suci sebagai firman Allah yang tetap berbicara pada masa kini. 'Dia' mempertahankan subjek personal yang tersirat tanpa menyebut 'Allah' secara eksplisit.
- issue: Makna τάξις dalam kutipan mengenai Melkisedek
  choice: tatanan
  alternative: aturan; golongan; pola
  rationale: '''Tatanan'' cukup luas untuk mempertahankan kemungkinan arti susunan, kedudukan, atau jenis keimaman, tanpa mereduksinya menjadi sekadar cara atau pola.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi 'Dia' dan 'Engkau' dipakai karena rujukannya ilahi, sementara struktur kutipan tetap ringkas dan dekat dengan bentuk Yunani.
