  text: Περὶ οὗ πολὺς ἡμῖν ὁ λόγος καὶ δυσερμήνευτος λέγειν, ἐπεὶ νωθροὶ γεγόνατε ταῖς ἀκοαῖς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/011.yaml
  text: About this we have much to say[a], and it is hard to explain[c][b], since you have become dull in hearing.
translation:
  language: id
  text: Tentang hal ini, banyak yang hendak kami katakan[a], dan sulit untuk menjelaskannya[b], karena kalian telah menjadi lamban dalam mendengar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tentang dia”; kata ganti Yunani dapat menunjuk kepada Melkisedek, meskipun mungkin juga menunjuk lebih luas kepada pokok yang sedang dibicarakan.
    reason: alternative_reading
  - marker: b
    text: Atau “sulit untuk ditafsirkan” atau “sulit untuk diuraikan.”
    reason: lexical_alternative
  - marker: c
    text: Maksudnya, lamban atau tidak tanggap dalam menerima pengajaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ οὗ
  choice: Tentang hal ini
  rationale: Kata ganti relatif Yunani dapat menunjuk kepada Melkisedek sebagai pribadi atau kepada pokok pembicaraan yang lebih luas. Dalam konteks ini, ungkapan netral ini paling alami dan tetap membuka kaitannya dengan Melkisedek.
- source_word: πολὺς ἡμῖν ὁ λόγος
  choice: banyak yang hendak kami katakan
  rationale: Susunan idiomatis ini menyatakan bahwa penulis memiliki banyak bahan untuk disampaikan. Kata 'hendak' mengalir alami dalam bahasa Indonesia dan sesuai dengan maksud pemaparan selanjutnya.
- source_word: δυσερμήνευτος λέγειν
  choice: sulit untuk menjelaskannya
  rationale: Adjektiva tersebut berarti sulit ditafsirkan atau dijelaskan; bersama infinitif 'mengatakan/berbicara', konteks menekankan kesulitan memaparkan pokok itu kepada para pembaca.
- source_word: ἐπεὶ
  choice: karena
  rationale: Konjungsi ini menyatakan alasan mengapa pokok tersebut sulit dijelaskan.
- source_word: νωθροὶ γεγόνατε
  choice: kalian telah menjadi lamban
  rationale: Bentuk perfektum menunjukkan keadaan sekarang yang terjadi melalui suatu perkembangan. 'Telah menjadi' mempertahankan nuansa itu, sedangkan 'lamban' menggambarkan kurangnya ketanggapan tanpa langsung menafsirkannya sebagai kemalasan moral.
- source_word: ταῖς ἀκοαῖς
  choice: dalam mendengar
  rationale: Ungkapan ini mempertahankan metafora pendengaran sambil menunjuk pada ketanggapan dalam menerima pengajaran.
theological_decisions:
- issue: Rujukan Περὶ οὗ
  choice: 'Diterjemahkan terutama sebagai rujukan kepada pokok pembicaraan: ''Tentang hal ini''.'
  alternative: '''Tentang dia'', dengan Melkisedek sebagai rujukan pribadi.'
  rationale: Melkisedek adalah anteseden terdekat dan rujukan pribadi tetap mungkin secara tata bahasa. Namun, alur wacana memperkenalkan pokok ajaran yang lebih luas. Teks utama menggunakan rujukan netral, sementara catatan kaki mempertahankan kemungkinan personal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pronomina 'kalian' dipakai untuk menampilkan bentuk orang kedua jamak dalam Yunani secara jelas. Metafora pendengaran dipertahankan, sedangkan maknanya diterangkan dalam catatan kaki.
