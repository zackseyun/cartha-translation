  terminology: “Kehormatan ini” merupakan padanan yang baik untuk τὴν τιμήν dalam konteks keimaman tanpa mempersempitnya menjadi “jabatan”. “Allah” dan “Harun” sudah tepat. Catatan kaki mempertahankan alternatif leksikal yang relevan.
