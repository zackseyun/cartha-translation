language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν, ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ, ⸀καθώσπερ καὶ Ἀαρών.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/004.yaml
  text: And no one takes this honor for himself[a], but is called by God, just as Aaron also was.
translation:
  language: id
  text: Dan tidak seorang pun mengambil kehormatan ini bagi dirinya sendiri[a], melainkan dipanggil oleh Allah, sebagaimana Harun juga dipanggil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kehormatan itu.” Dalam bahasa Yunani tertulis “kehormatan itu,” yang dalam konteks merujuk kepada martabat atau kedudukan imam besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ … τις
  choice: tidak seorang pun
  rationale: Gabungan negasi dengan kata ganti tak tentu paling wajar dinyatakan sebagai penyangkalan universal dalam bahasa Indonesia.
- source_word: ἑαυτῷ
  choice: bagi dirinya sendiri
  rationale: Datif refleksif ini menyatakan pengambilan atau pengakuan sesuatu untuk diri sendiri.
- source_word: λαμβάνει
  choice: mengambil
  rationale: Pilihan ini mempertahankan kontras antara mengambil kehormatan atas prakarsa sendiri dan dipanggil oleh Allah; 'menerima' dapat melemahkan kontras tersebut.
- source_word: τὴν τιμήν
  choice: kehormatan ini
  rationale: τιμή secara langsung berarti kehormatan, sedangkan 'ini' secara wajar menunjuk kembali kepada martabat atau kedudukan imam besar dalam konteks dekat tanpa mengganti nomina itu dengan tafsiran 'jabatan'.
- source_word: καλούμενος ὑπὸ τοῦ θεοῦ
  choice: ia dipanggil oleh Allah
  rationale: Partisip pasif menyatakan panggilan Allah sebagai dasar bagi kehormatan tersebut. Klausa lengkap ini alami dalam bahasa Indonesia dan tetap mempertahankan Allah sebagai pelaku panggilan.
- source_word: καθώσπερ καὶ Ἀαρών
  choice: sama seperti Harun
  rationale: Ungkapan perbandingan itu menunjuk kepada Harun sebagai contoh orang yang juga dipanggil Allah; unsur 'juga' sudah tersirat secara alami dalam konstruksi 'sama seperti'.
theological_decisions:
- issue: Sifat pengangkatan sebagai imam
  choice: Ayat ini menyatakan bahwa kehormatan keimaman tidak diambil atas prakarsa sendiri, melainkan berkaitan dengan panggilan Allah, dengan Harun sebagai teladan.
  alternative: Ayat ini dapat dibaca sebagai pernyataan umum tentang kehormatan tanpa rujukan khusus kepada kedudukan imam.
  rationale: Konteks Ibrani 5:1–5 membahas imam besar. Namun, 'kehormatan' dipertahankan agar terjemahan tidak mempersempit τιμή menjadi istilah teknis 'jabatan' dan tidak menghapus keluasan katanya.
- issue: Hubungan sintaksis antara mengambil kehormatan dan dipanggil
  choice: 'Mempertahankan kontras langsung: tidak mengambil bagi diri sendiri, tetapi dipanggil oleh Allah.'
  alternative: Mengeksplisitkan hubungan itu sebagai 'melainkan hanya menerimanya ketika dipanggil oleh Allah'.
  rationale: Teks Yunani memakai partisip pasif tanpa kata eksplisit yang berarti 'hanya ketika'. Terjemahan utama menghindari penambahan syarat yang terlalu tegas sambil membiarkan konteks menjelaskan hubungan panggilan dan kehormatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat lugas bagi pembaca umum, sementara istilah 'kehormatan' mempertahankan cakupan leksikal sumber dan tidak mengubahnya menjadi istilah jabatan yang lebih sempit.
