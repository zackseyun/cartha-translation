  text: καὶ καθ’ ὅσον ἀπόκειται τοῖς ἀνθρώποις ἅπαξ ἀποθανεῖν, μετὰ δὲ τοῦτο κρίσις,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/027.yaml
  text: And just as it is appointed for men to die once[a], and after this, judgment,
translation:
  language: id
  text: Dan sama seperti manusia ditetapkan untuk mati satu kali, dan sesudah itu menghadapi penghakiman,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὅσον
  choice: sama seperti
  rationale: Dalam konteks ini frasa tersebut membuka perbandingan yang dilanjutkan pada ayat 28. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan hubungan sintaksis antarayat.
- source_word: ἀπόκειται
  choice: ditetapkan
  rationale: Dalam konstruksi dengan datif dan infinitif, verba ini menyatakan sesuatu yang telah ditentukan atau menjadi bagian yang pasti, bukan sekadar disimpan.
- source_word: τοῖς ἀνθρώποις
  choice: manusia
  rationale: Bentuk jamak Yunani ini merujuk secara umum kepada umat manusia. 'Manusia' menyampaikan cakupan generiknya secara tepat dan wajar tanpa membatasi rujukan pada laki-laki.
- source_word: ἅπαξ
  choice: satu kali
  rationale: Adverbia ini menandai satu kejadian. 'Satu kali' jelas dan tidak menambahkan nuansa 'sekali untuk selama-lamanya' yang tidak harus terkandung di sini.
- source_word: ἀποθανεῖν
  choice: untuk mati
  rationale: Ini merupakan pelengkap infinitif bagi ἀπόκειται dan secara lugas berarti 'mati'.
- source_word: μετὰ δὲ τοῦτο
  choice: dan sesudah itu
  rationale: Frasa ini menyatakan urutan. 'Dan' mewakili δέ secara alami, sedangkan 'sesudah itu' mempertahankan peralihan dari kematian kepada penghakiman.
- source_word: κρίσις
  choice: menghadapi penghakiman
  rationale: Nomina κρίσις berarti penghakiman atau penilaian yudisial tanpa dengan sendirinya menentukan hasilnya. Penambahan idiomatis 'menghadapi' melengkapi klausa eliptis dalam bahasa Indonesia tanpa mengubah cakupan makna.
theological_decisions:
- issue: Rujukan umum τοῖς ἀνθρώποις
  choice: Diterjemahkan 'manusia' sebagai rujukan generik kepada umat manusia.
  alternative: '''orang-orang'' atau ''umat manusia'''
  rationale: Bahasa Yunani merujuk kepada manusia secara umum, bukan khusus kepada laki-laki. 'Manusia' mempertahankan arti dan terdengar alami dalam bahasa Indonesia.
- issue: Cakupan κρίσις sesudah kematian
  choice: Diterjemahkan 'penghakiman' tanpa menentukan hasil atau skema eskatologisnya.
  alternative: '''penghukuman'' atau ''penghakiman terakhir'''
  rationale: Ayat ini menegaskan adanya penghakiman sesudah kematian, tetapi tidak menyebut bahwa hasilnya selalu penghukuman ataupun menjabarkan keseluruhan urutan eskatologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur perbandingan dipertahankan agar ayat ini tetap mengantar secara langsung kepada ayat 28. Tidak diperlukan catatan kaki karena 'manusia' sudah menyampaikan daya generik τοῖς ἀνθρώποις dengan jelas.
