id: HEB.9.10
reference: Hebrews 9:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μόνον ἐπὶ βρώμασιν καὶ πόμασιν καὶ διαφόροις βαπτισμοῖς, ⸀δικαιώματα σαρκὸς μέχρι καιροῦ διορθώσεως ἐπικείμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/010.yaml
  text: concerned only with foods and drinks and various washings, fleshly regulations imposed until the time of reformation.
translation:
  language: id
  text: Itu hanya berkaitan dengan makanan, minuman, dan berbagai pembasuhan—peraturan lahiriah yang diberlakukan sampai tiba waktu pembaruan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαπτισμοῖς
  choice: pembasuhan
  rationale: Dalam konteks aturan ritual, bentuk jamak ini menunjuk pada berbagai pencucian seremonial, bukan secara khusus baptisan Kristen.
- source_word: δικαιώματα σαρκὸς
  choice: peraturan lahiriah
  rationale: Ungkapan ini secara harfiah berarti ketetapan/peraturan yang berkaitan dengan daging. 'Lahiriah' menyampaikan fokus pada ranah jasmani tanpa memberi kesan bahwa peraturannya berdosa.
- source_word: διορθώσεως
  choice: pembaruan
  rationale: Kata ini menunjuk pada tindakan meluruskan atau menata kembali keadaan; 'pembaruan' alami dalam bahasa Indonesia dan mempertahankan gagasan perubahan menuju tatanan yang benar.
- source_word: ἐπικείμενα
  choice: diberlakukan
  rationale: Dalam kaitannya dengan peraturan, kata ini menyatakan bahwa aturan tersebut dikenakan atau diwajibkan.
theological_decisions:
- issue: Makna 'daging' dalam δικαιώματα σαρκὸς
  choice: peraturan lahiriah
  alternative: peraturan bagi tubuh / peraturan daging
  rationale: Konteks membedakan tata ibadah jasmani dari pembaruan yang lebih mendalam, bukan menyebut peraturan itu berdosa. 'Lahiriah' mempertahankan kontras tersebut tanpa memasukkan penilaian moral yang tidak dinyatakan.
- issue: Identitas 'waktu pembaruan'
  choice: tidak dijelaskan dalam terjemahan
  alternative: waktu tatanan baru
  rationale: Teks menyebut suatu masa penataan kembali tetapi tidak menjabarkan identitas atau kronologinya dalam ayat ini; ambiguitas itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah memperjelas bahwa 'peraturan lahiriah' merangkum makanan, minuman, dan pembasuhan, sambil menjaga alur sintaksis ayat.
