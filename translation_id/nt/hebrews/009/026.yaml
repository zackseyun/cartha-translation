  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπεὶ ἔδει αὐτὸν πολλάκις παθεῖν ἀπὸ καταβολῆς κόσμου· ⸀νυνὶ δὲ ἅπαξ ἐπὶ συντελείᾳ τῶν αἰώνων εἰς ἀθέτησιν ⸀ἁμαρτίας διὰ τῆς θυσίας αὐτοῦ πεφανέρωται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/026.yaml
  text: Otherwise[a], he would have had to suffer many times since the foundation of the world. But as it is[c][b], he has appeared once for all at the consummation of the ages to put away sin through the sacrifice of himself.
translation:
  language: id
  text: Jika tidak demikian, Ia tentu harus menderita berkali-kali sejak dunia dijadikan. Namun, sekarang Ia telah menyatakan diri satu kali untuk selama-lamanya, pada kesudahan segala zaman[a], untuk meniadakan dosa[b] melalui pengurbanan diri-Nya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada akhir segala zaman.”
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk menyingkirkan dosa” atau “untuk membatalkan dosa.”
    reason: lexical_alternative
  - marker: c
    text: Atau “melalui kurban-Nya.” Bahasa Yunani secara eksplisit berbunyi “melalui pengurbanan diri-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Kalau tidak
  rationale: Dalam konteks ini, kata tersebut memperkenalkan akibat hipotetis seandainya Kristus harus mempersembahkan diri berulang kali. “Kalau tidak” menyampaikan alur argumennya dengan wajar dalam bahasa Indonesia.
- source_word: ἔδει
  choice: harus
  rationale: Bersama konteks hipotetis yang dibuka oleh “Kalau tidak”, bentuk imperfek ini menyatakan keharusan yang akan berlaku dalam keadaan yang tidak nyata; bahasa Indonesia cukup menyampaikannya dengan “harus” tanpa konstruksi kala tambahan.
- source_word: πολλάκις
  choice: berkali-kali
  rationale: Pilihan ini mempertahankan kontras yang jelas dengan ἅπαξ, yaitu antara penderitaan yang berulang dan tindakan yang hanya satu kali.
- source_word: παθεῖν
  choice: menderita
  rationale: Kata ini secara langsung dan wajar menunjuk pada penderitaan Kristus yang berkaitan dengan kematian-Nya sebagai kurban.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: sejak dunia dijadikan
  rationale: Ungkapan ini menyatakan rentang waktu sejak peletakan dasar atau penciptaan dunia. “Sejak dunia dijadikan” alami bagi pembaca Indonesia dan tetap mempertahankan makna temporalnya.
- source_word: νυνὶ δὲ
  choice: Namun, sekarang
  rationale: Frasa ini menandai kontras kuat antara akibat hipotetis sebelumnya dan kenyataan yang berlaku sekarang.
- source_word: ἅπαξ
  choice: satu kali untuk selama-lamanya
  rationale: Dalam konteks pengurbanan di Surat Ibrani, kata ini menegaskan satu tindakan yang menentukan dan tidak perlu diulangi, berlawanan dengan πολλάκις.
- source_word: ἐπὶ συντελείᾳ τῶν αἰώνων
  choice: pada kesudahan segala zaman
  rationale: “Kesudahan” mempertahankan gagasan pencapaian akhir atau penyempurnaan, sedangkan “segala zaman” mewakili bentuk jamak αἰώνων dalam bahasa Indonesia yang wajar.
- source_word: εἰς ἀθέτησιν ἁμαρτίας
  choice: untuk meniadakan dosa
  rationale: ἀθέτησις mengandung arti menyingkirkan, membatalkan, atau membuat tidak berlaku. “Meniadakan” menyampaikan daya tindak yang tegas tanpa menjadi terlalu teknis.
- source_word: ἁμαρτίας
  choice: dosa
  rationale: Bentuk tunggal dipertahankan untuk menyajikan dosa sebagai kenyataan atau kuasa yang ditangani oleh pengurbanan Kristus, tanpa menyangkal dosa-dosa sebagai perbuatan individual.
- source_word: διὰ τῆς θυσίας αὐτοῦ
  choice: melalui pengurbanan diri-Nya
  rationale: Ungkapan ini mempertahankan sarana tindakan dan menjelaskan bahwa Kristus sendiri adalah yang dikurbankan. Bentuk ini lebih alami daripada terjemahan harfiah kaku “melalui kurban diri-Nya”.
- source_word: πεφανέρωται
  choice: Ia telah menyatakan diri
  rationale: Bentuk perfek menunjuk pada penyataan yang telah terjadi dan tetap bermakna. “Telah menyatakan diri” alami dalam bahasa Indonesia serta mempertahankan gagasan bahwa Ia tampil atau menjadi nyata.
theological_decisions:
- issue: Daya ἅπαξ dalam karya pengurbanan Kristus
  choice: Diterjemahkan “satu kali untuk selama-lamanya” untuk menyatakan sifat tindakan Kristus yang menentukan dan tidak berulang.
  alternative: satu kali
  rationale: Kontras langsung dengan πολλάκις (“berkali-kali”) dan alur Ibrani 9 mendukung ungkapan yang menampilkan finalitas tindakan itu tanpa menambahkan ajaran di luar teks.
- issue: Cakupan bentuk tunggal ἁμαρτίας
  choice: Diterjemahkan dengan bentuk tunggal “dosa”.
  alternative: dosa-dosa
  rationale: Bentuk tunggal Yunani dapat menyajikan dosa sebagai kenyataan menyeluruh yang ditiadakan, bukan hanya sebagai daftar pelanggaran individual. Ambiguitas cakupannya tetap dipertahankan.
- issue: Makna ἀθέτησις
  choice: Diterjemahkan “meniadakan dosa”.
  alternative: menyingkirkan dosa; membatalkan dosa
  rationale: “Meniadakan” mencakup daya kata Yunani untuk mengesampingkan atau membuat tidak berlaku, namun tidak memerinci mekanisme teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Huruf kapital pada “Ia” dan “-Nya” mengikuti kebiasaan penerbitan Alkitab Indonesia ketika merujuk kepada Kristus. Struktur argumentatif, kontras berkali-kali/satu kali, bentuk tunggal “dosa”, dan nuansa kesudahan zaman dipertahankan.
