  yaml_path: translation/nt/hebrews/009/001.yaml
  text: Even the first covenant had regulations for worship and an earthly sanctuary[a][b].
translation:
  language: id
  text: Bahkan perjanjian yang pertama mempunyai ketentuan-ketentuan untuk ibadah dan tempat kudus di bumi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang pertama”—yakni perjanjian yang pertama; sebagian orang memahami ungkapan ini secara lebih umum sebagai “tatanan yang pertama”.
    reason: alternative_reading
  - marker: b
    text: Atau “tempat kudus duniawi”; di sini maksudnya kemungkinan besar tempat kudus di bumi, berbeda dengan kenyataan surgawi yang dibahas kemudian dalam pasal ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶχε
  choice: mempunyai
  rationale: Bentuk imperfek ἔχω memperkenalkan apa yang dimiliki tatanan terdahulu; 'mempunyai' mempertahankan makna posesif yang sederhana dan alami dalam bahasa Indonesia.
- source_word: μὲν οὖν
  choice: Bahkan
  rationale: Gabungan ini melanjutkan pembahasan dengan penekanan ringan. Dalam konteks Indonesia, 'Bahkan' menyampaikan daya penegasan tanpa menambahkan penanda waktu yang tidak ada dalam sumber.
- source_word: ἡ πρώτη
  choice: perjanjian yang pertama
  rationale: Nomina feminin yang tersirat paling wajar merujuk kembali kepada perjanjian pertama dalam Ibrani 8:13. Kata 'perjanjian' dilengkapi agar elipsis Yunani dapat dipahami dengan jelas.
- source_word: δικαιώματα
  choice: peraturan-peraturan
  rationale: Dalam konteks ibadah, δικαιώματα menunjuk pada ketentuan atau aturan yang ditetapkan; 'peraturan-peraturan' jelas dan sesuai dengan ragam Indonesia modern.
- source_word: λατρείας
  choice: untuk ibadah
  rationale: Genitif ini menyatakan bidang atau tujuan peraturan tersebut. 'Untuk ibadah' menyampaikan makna kultis secara alami.
- source_word: τό τε ἅγιον
  choice: tempat kudus
  rationale: Frasa ini menunjuk pada lokasi sakral yang berkaitan dengan ibadah perjanjian pertama. 'Tempat kudus' tetap cukup luas karena bagian-bagiannya baru dijelaskan dalam ayat berikutnya.
- source_word: κοσμικόν
  choice: yang ada di dunia ini
  rationale: κοσμικόν di sini menunjukkan ranah duniawi, sebagai lawan dari kenyataan surgawi yang dibahas kemudian. Ungkapan ini menghindari konotasi moral negatif yang dapat melekat pada 'duniawi'.
theological_decisions:
- issue: Rujukan tersirat ἡ πρώτη
  choice: perjanjian yang pertama
  alternative: yang pertama; tatanan yang pertama; kemah yang pertama
  rationale: Konteks langsung pada akhir pasal 8 membandingkan perjanjian pertama dengan perjanjian baru, sehingga 'perjanjian' merupakan rujukan yang paling mungkin. Catatan kaki mempertahankan elipsis dan kemungkinan pemahaman yang lebih umum.
- issue: Makna κοσμικόν
  choice: yang ada di dunia ini
  alternative: duniawi
  rationale: Kontrasnya adalah antara tempat kudus dalam ranah dunia ini dan kenyataan surgawi, bukan antara sesuatu yang bermoral rohani dan sesuatu yang tercemar. Pilihan ini mempertahankan kontras ruang atau ranah tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat alami bagi pembaca umum tanpa menghilangkan elipsis dan alternatif makna dalam teks Yunani; semua penanda catatan kaki dicantumkan dalam teks utama.
