id: HEB.9.15
reference: Hebrews 9:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ διὰ τοῦτο διαθήκης καινῆς μεσίτης ἐστίν, ὅπως θανάτου γενομένου εἰς ἀπολύτρωσιν τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων τὴν ἐπαγγελίαν λάβωσιν οἱ κεκλημένοι τῆς αἰωνίου κληρονομίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/015.yaml
  text: And for this reason he is the mediator of a new covenant[a], so that, since a death has occurred for the redemption of the transgressions committed under the first covenant, those who have been called may receive the promise of the eternal inheritance.
translation:
  language: id
  text: Oleh karena itu, Ia adalah pengantara perjanjian baru[a], supaya, karena telah terjadi suatu kematian untuk penebusan pelanggaran-pelanggaran yang dilakukan di bawah perjanjian pertama, mereka yang telah dipanggil dapat menerima janji tentang warisan kekal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wasiat”. Kata Yunani διαθήκη dapat berarti “perjanjian” maupun “wasiat”; Ibrani 9:16–17 memanfaatkan tumpang tindih makna itu, tetapi “perjanjian” paling sesuai dengan pertentangan dengan perjanjian pertama dalam ayat ini.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Ungkapan kausal ini menghubungkan ayat dengan uraian sebelumnya secara alami dan tetap mempertahankan daya penjelasnya.
- source_word: διαθήκης καινῆς
  choice: suatu perjanjian baru
  rationale: Makna perjanjian paling sesuai dengan pertentangan terhadap perjanjian pertama dalam ayat ini, sementara kemungkinan makna 'wasiat' dipertahankan dalam catatan kaki.
- source_word: μεσίτης
  choice: pengantara
  rationale: Istilah ini tepat dan lazim untuk pribadi yang menjadi perantara dalam hubungan perjanjian.
- source_word: θανάτου γενομένου
  choice: karena suatu kematian telah terjadi
  rationale: Menyampaikan konstruksi genitif absolut sebagai keadaan yang mendasari tujuan berikutnya, sekaligus mempertahankan penyebutan 'suatu kematian' tanpa menambahkan subjek eksplisit yang tidak dinyatakan dalam frasa Yunani.
- source_word: ἀπολύτρωσιν
  choice: menebus
  rationale: Bentuk verbal membuat kalimat Indonesia lebih wajar, sambil mempertahankan gagasan pembebasan yang diperoleh dengan harga dalam konteks pengurbanan.
- source_word: τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων
  choice: pelanggaran-pelanggaran di bawah perjanjian yang pertama
  rationale: Frasa ini mempertahankan hubungan pelanggaran dengan lingkup atau masa perjanjian pertama tanpa mempersempitnya secara berlebihan.
- source_word: τὴν ἐπαγγελίαν ... τῆς αἰωνίου κληρονομίας
  choice: warisan kekal yang dijanjikan
  rationale: Penataan ulang ini alami dalam bahasa Indonesia dan menyampaikan bahwa isi janji tersebut ialah warisan kekal.
- source_word: οἱ κεκλημένοι
  choice: mereka yang telah dipanggil
  rationale: 'Bentuk ini mencerminkan aspek perfektum pasif: orang-orang tersebut berada dalam keadaan sebagai mereka yang sudah dipanggil.'
theological_decisions:
- issue: Subjek tersirat pada ἐστίν
  choice: Ia
  alternative: Membiarkan subjek tidak dinyatakan
  rationale: Bahasa Indonesia memerlukan subjek yang jelas; konteks langsung menunjuk kepada Kristus, tetapi kapitalisasi 'Ia' tidak menambahkan nama atau rumusan doktrinal ke dalam teks.
- issue: Makna διαθήκη dalam ayat ini
  choice: perjanjian
  alternative: wasiat
  rationale: Pertentangan antara perjanjian baru dan perjanjian pertama menjadikan 'perjanjian' pilihan utama, sedangkan tumpang tindih makna yang dikembangkan dalam ayat 16–17 tetap diakui lewat catatan kaki.
- issue: Hubungan ἐπαγγελίαν dengan κληρονομίας
  choice: warisan kekal yang dijanjikan
  alternative: janji tentang warisan kekal
  rationale: Keduanya mungkin secara semantis; susunan terpilih lebih alami dan menunjukkan bahwa warisan kekal merupakan isi janji tanpa menghapus unsur janji.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Struktur kalimat mengikuti alur argumentasi Yunani, dengan penataan ulang terbatas agar hubungan antara janji dan warisan terdengar alami.
