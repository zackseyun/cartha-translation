  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur Yunani dengan tepat: hubungan komparatif (ὁμοίως, “Demikian juga”), pelaku tersirat dari konteks (“ia”), tindakan pemercikan, darah, Kemah Suci, dan seluruh perlengkapan yang berkaitan dengan ibadah. Konstruksi “memercikkan darah pada” adalah padanan Indonesia yang wajar bagi pemercikan dengan darah pada objek-objek tersebut. Pasangan objek dalam teks Yunani tetap jelas melalui “Kemah Suci dan pada semua perlengkapan ibadah.”'
