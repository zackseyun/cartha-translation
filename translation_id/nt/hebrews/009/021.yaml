id: HEB.9.21
reference: Hebrews 9:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὴν σκηνὴν δὲ καὶ πάντα τὰ σκεύη τῆς λειτουργίας τῷ αἵματι ὁμοίως ἐράντισεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/021.yaml
  text: And likewise he sprinkled with the blood both the tabernacle and all the vessels of the ministry[a][b].
translation:
  language: id
  text: Demikian juga, ia memercikkan darah pada Kemah Suci[a] dan pada semua perlengkapan ibadah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kemah”; di sini yang dimaksud adalah Kemah Suci.
    reason: lexical_alternative
  - marker: b
    text: Atau, “semua peralatan pelayanan ibadah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνή
  choice: Kemah Suci
  rationale: Dalam konteks Ibrani 9, istilah ini menunjuk pada kemah peribadatan Israel, bukan sekadar kemah biasa. 'Kemah Suci' jelas, alami, dan mempertahankan makna tempat kudus portabel.
- source_word: σκεύη
  choice: perlengkapan
  rationale: Istilah ini mencakup berbagai benda atau peralatan yang digunakan dalam kegiatan ibadah. 'Perlengkapan' lebih alami dan cukup luas dalam bahasa Indonesia daripada 'bejana'.
- source_word: λειτουργία
  choice: ibadah
  rationale: Di sini istilah tersebut mengacu pada pelayanan ritual keimaman. Dalam frasa 'perlengkapan ibadah', pilihan ini menyampaikan fungsi kultis secara ringkas dan wajar tanpa memasukkan konsep denominasi tertentu.
- source_word: αἷμα
  choice: darah
  rationale: Rujukannya adalah darah korban dalam konteks ritual, sehingga terjemahan langsung paling tepat.
- source_word: ὁμοίως
  choice: Demikian juga
  rationale: Menghubungkan tindakan ini dengan pemercikan yang disebut sebelumnya dan mempertahankan daya komparatifnya.
- source_word: ῥαντίζω
  choice: memercikkan
  rationale: Ini adalah padanan Indonesia yang lazim dan jelas untuk penerapan darah melalui pemercikan dalam ritus.
- source_word: δὲ
  choice: tidak diterjemahkan tersendiri
  rationale: Partikel ini bersifat penghubung ringan dan sudah terwakili secara alami oleh 'Demikian juga'; menerjemahkannya lagi dengan 'dan' akan terasa berlebihan.
- source_word: πάντα τὰ σκεύη
  choice: semua perlengkapan
  rationale: Mempertahankan cakupan menyeluruh yang dinyatakan oleh πάντα serta bentuk jamak dari benda-benda yang dipakai dalam ibadah.
theological_decisions:
- issue: Hubungan ayat ini dengan latar ritual Musa dalam Kitab Keluaran
  choice: Menerjemahkan pernyataan ayat secara langsung sebagai tindakan pemercikan darah pada Kemah Suci dan seluruh perlengkapan ibadah.
  alternative: Menambahkan penjelasan sejarah atau menyelaraskan rincian ayat ini dengan catatan dalam Kitab Keluaran.
  rationale: Teks Yunani menyajikan ringkasan penulis tanpa uraian tambahan. Terjemahan tidak seharusnya menyisipkan harmonisasi atau menyelesaikan persoalan intertekstual yang tidak dijelaskan oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Susunan 'memercikkan darah pada' dipilih sebagai ungkapan Indonesia yang alami. Pengulangan 'pada' memperjelas bahwa darah dipercikkan pada kedua objek yang dipasangkan dalam teks Yunani.
