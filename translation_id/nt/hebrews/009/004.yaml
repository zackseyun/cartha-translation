  text: χρυσοῦν ἔχουσα θυμιατήριον καὶ τὴν κιβωτὸν τῆς διαθήκης περικεκαλυμμένην πάντοθεν χρυσίῳ, ἐν ᾗ στάμνος χρυσῆ ἔχουσα τὸ μάννα καὶ ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα καὶ αἱ πλάκες τῆς διαθήκης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/004.yaml
  text: having the golden censer[a], and the ark of the covenant covered on all sides with gold, in which were a golden jar holding the manna, Aaron’s staff that budded, and the tablets of the covenant,
translation:
  language: id
  text: yang mempunyai mezbah dupa emas[a] dan tabut perjanjian yang seluruh sisinya dilapisi emas, dan di dalamnya terdapat buli-buli emas berisi manna, tongkat Harun yang bertunas, dan loh-loh perjanjian,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: pedupaan emas. Istilah Yunani θυμιατήριον dapat menunjuk pada mezbah dupa atau alat untuk membakar dupa; maknanya di sini diperdebatkan.'
    reason: alternative_reading
lexical_decisions:
- source_word: χρυσοῦν ἔχουσα θυμιατήριον
  choice: yang mempunyai mezbah dupa emas
  rationale: θυμιατήριον dapat menunjuk pada mezbah dupa atau pedupaan. Dalam uraian perlengkapan Kemah Suci, “mezbah dupa” merupakan padanan alami dan masuk akal, sementara ambiguitas leksikal dipertahankan melalui catatan kaki. χρυσοῦν diterjemahkan “emas” secara ringkas dan idiomatis.
- source_word: τὴν κιβωτὸν τῆς διαθήκης
  choice: tabut perjanjian
  rationale: Ini adalah istilah Indonesia yang mapan dan tepat bagi peti suci perjanjian.
- source_word: περικεκαλυμμένην πάντοθεν χρυσίῳ
  choice: yang seluruh sisinya dilapisi emas
  rationale: Padanan ini menyampaikan bahwa lapisan emas menutupi tabut dari segala sisi, sesuai penekanan πάντοθεν.
- source_word: ἐν ᾗ
  choice: Di dalam tabut itu terdapat
  rationale: Acuan kata ganti relatif diperjelas secara alami sebagai tabut tanpa mengubah makna.
- source_word: στάμνος χρυσῆ ἔχουσα τὸ μάννα
  choice: buli-buli emas berisi manna
  rationale: στάμνος adalah wadah atau tempayan; “buli-buli” sesuai dengan register Alkitab Indonesia yang bermartabat dan tetap dapat dipahami. ἔχουσα diterjemahkan alami sebagai “berisi”.
- source_word: ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα
  choice: tongkat Harun yang pernah bertunas
  rationale: “Tongkat” merupakan padanan modern yang wajar bagi ῥάβδος. Kata “pernah” menandai peristiwa bertunas yang sudah terjadi, sesuai partisip aoris βλαστήσασα.
- source_word: αἱ πλάκες τῆς διαθήκης
  choice: loh-loh perjanjian
  rationale: “Loh” adalah istilah Indonesia yang mapan untuk πλάκες dalam konteks ini. Bahan batu tidak ditambahkan karena tidak dinyatakan secara eksplisit dalam ayat.
- source_word: διαθήκης
  choice: perjanjian
  rationale: Dalam konteks ibadah dan teologi biblika ini, “perjanjian” adalah padanan baku dan lebih tepat daripada “wasiat”.
theological_decisions:
- issue: Makna θυμιατήριον dalam uraian tentang tempat ibadah
  choice: mezbah dupa
  alternative: pedupaan
  rationale: Istilah Yunani ini dapat berarti mezbah dupa atau alat pembakar dupa. Konteks perlengkapan Kemah Suci mendukung “mezbah dupa” sebagai teks utama, tetapi perdebatan leksikal yang nyata tidak disembunyikan; “pedupaan” dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia standar modern dengan gaya bermartabat dan struktur kalimat yang mengalir. Istilah mapan seperti “tabut perjanjian”, “manna”, dan “loh-loh perjanjian” dipertahankan. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dipersoalkan.
