lexical_decisions:
- source_word: μετὰ ... τὸ δεύτερον καταπέτασμα
  choice: di balik tirai kedua
  rationale: μετά dengan akusatif di sini menyatakan hubungan ruang, bukan waktu. 'Di balik' alami dalam bahasa Indonesia dan tepat menggambarkan letak bagian terdalam tempat suci; καταπέτασμα diterjemahkan 'tirai' sebagai istilah modern yang jelas.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ merupakan penghubung ringan yang melanjutkan uraian. Dalam bahasa Indonesia, alurnya sudah wajar tanpa kata penghubung eksplisit.
- source_word: σκηνὴ
  choice: bagian Kemah Suci
  rationale: σκηνή secara leksikal berarti kemah dan dalam konteks ini menunjuk bagian kedua dari Kemah Suci. Ungkapan ini mempertahankan latar ibadah sekaligus menghindari kesan bahwa ada kemah lain yang berdiri sendiri.
- source_word: ἡ λεγομένη
  choice: yang disebut
  rationale: Partisipel atributif ini secara alami diterjemahkan 'yang disebut'.
- source_word: Ἅγια Ἁγίων
  choice: Ruang Mahakudus
  rationale: Ungkapan genitif superlatif ini secara harfiah berarti 'Yang Kudus dari segala yang kudus' dan menunjuk ruang terdalam Kemah Suci. 'Ruang Mahakudus' menyampaikan fungsi lokatif dan tingkat kekudusannya dengan jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan istilah tempat suci Ἅγια Ἁγίων
  choice: Ruang Mahakudus
  alternative: Yang Mahakudus; Yang Kudus dari segala yang kudus
  rationale: Pilihan ini mempertahankan rujukan kepada bagian terdalam tempat suci dan mudah dipahami pembaca modern. Bentuk yang lebih harfiah dicantumkan dalam catatan kaki untuk menjaga transparansi terhadap idiom Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kemah Suci' dipakai sebagai istilah kultis yang sudah dikenal, sedangkan 'bagian' memperjelas bahwa σκηνή di sini merujuk pada kompartemen di balik tirai kedua.
