id: HEB.9.14
reference: Hebrews 9:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πόσῳ μᾶλλον τὸ αἷμα τοῦ Χριστοῦ, ὃς διὰ πνεύματος αἰωνίου ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ, καθαριεῖ τὴν συνείδησιν ⸀ἡμῶν ἀπὸ νεκρῶν ἔργων εἰς τὸ λατρεύειν θεῷ ζῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/014.yaml
  text: how much more will the blood of Messiah—who through the eternal Spirit offered himself without blemish to God—cleanse our conscience from dead works to serve the living God[a].
translation:
  language: id
  text: Betapa lebihnya darah Mesias—yang melalui Roh yang kekal[a] mempersembahkan diri-Nya sendiri tanpa cela kepada Allah—akan menyucikan hati nurani kita dari perbuatan-perbuatan yang mati supaya kita melayani Allah yang hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melalui suatu roh yang kekal.” Frasa Yunani ini dapat dipahami secara lebih umum, meskipun dalam teks utama “Roh yang kekal” dipahami sebagai Roh Kudus.
    reason: alternative_reading
lexical_decisions:
- source_word: πόσῳ μᾶλλον
  choice: betapa lebih lagi
  rationale: Mempertahankan bentuk perbandingan retoris a fortiori dari ayat sebelumnya dengan ungkapan Indonesia yang wajar dan kuat.
- source_word: τὸ αἷμα τοῦ Χριστοῦ
  choice: darah Mesias
  rationale: “Darah” dipertahankan secara harfiah karena makna pengorbanannya penting; Χριστός di sini dipahami sebagai gelar dan diterjemahkan “Mesias”.
- source_word: διὰ πνεύματος αἰωνίου
  choice: melalui Roh yang kekal
  rationale: Mempertahankan preposisi διά sebagai “melalui” dan mengambil frasa itu sebagai rujukan kepada Roh Kudus, sambil mencatat kemungkinan pembacaan yang lebih umum.
- source_word: ἑαυτὸν προσήνεγκεν
  choice: mempersembahkan diri-Nya sendiri
  rationale: Konteks ibadah dan pengorbanan mendukung “mempersembahkan”; “sendiri” menegaskan daya refleksif ἑαυτόν.
- source_word: ἄμωμον
  choice: tanpa cela
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap menyampaikan kelayakan korban yang tidak bercacat.
- source_word: καθαριεῖ
  choice: akan menyucikan
  rationale: Bentuk mendatang Yunani dipertahankan; “menyucikan” cocok dengan ranah kemurnian ritual dan batin dalam konteks ini.
- source_word: τὴν συνείδησιν ἡμῶν
  choice: hati nurani kita
  rationale: Padanan Indonesia baku dan alami untuk kesadaran moral batin yang dimaksud συνείδησις.
- source_word: ἀπὸ νεκρῶν ἔργων
  choice: dari perbuatan-perbuatan yang mati
  rationale: Terjemahan cukup harfiah mempertahankan kepadatan dan ambiguitas ungkapan, tanpa menafsirkannya sebagai perbuatan yang menghasilkan kematian.
- source_word: εἰς τὸ λατρεύειν
  choice: supaya kita melayani
  rationale: Menyatakan tujuan dan mempertahankan keluasan λατρεύω, yang dapat mencakup pelayanan maupun ibadah kepada Allah.
- source_word: θεῷ ζῶντι
  choice: Allah yang hidup
  rationale: Padanan definit yang alami dalam idiom Alkitab Indonesia.
theological_decisions:
- issue: Rujukan πνεύματος αἰωνίου
  choice: Roh Kudus, diterjemahkan “Roh yang kekal”
  alternative: “suatu roh yang kekal,” yang dapat dipahami lebih umum atau sebagai roh Kristus sendiri
  rationale: Frasa Yunani tanpa artikel memungkinkan lebih dari satu pemahaman. Teks utama memakai pembacaan personal-ilahi yang paling mungkin dalam konteks, sedangkan ambiguitas aslinya dipertahankan dalam catatan kaki.
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam ayat ini Χριστός berfungsi sebagai gelar bagi yang diurapi; “Mesias” menyampaikan arti gelar tersebut secara langsung.
- issue: Makna νεκρῶν ἔργων
  choice: perbuatan-perbuatan yang mati
  alternative: perbuatan yang membawa kepada kematian
  rationale: Frasa sumber tidak secara eksplisit menyatakan hubungan sebab-akibat; terjemahan literal menjaga kemungkinan makna teologisnya tanpa mempersempitnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur sisipan dengan tanda pisah mempertahankan alur retoris kalimat Yunani. Kapitalisasi pada “Roh” menandai pembacaan utama tanpa menghapus alternatif, dan semua pronomina ilahi ditulis sesuai konvensi yang lazim.
