  naturalness: Kalimat revisi memakai bahasa Indonesia baku yang jelas dan mempertahankan kontras antarklausa. 'Perlu ditahirkan' menyampaikan predikat impersonal Ἀνάγκη secara alami tanpa menambahkan penandaan waktu.
