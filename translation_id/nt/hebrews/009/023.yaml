id: HEB.9.23
reference: Hebrews 9:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀνάγκη οὖν τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς τούτοις καθαρίζεσθαι, αὐτὰ δὲ τὰ ἐπουράνια κρείττοσι θυσίαις παρὰ ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/023.yaml
  text: Therefore it was necessary for the copies of the things in the heavens to be cleansed with these[c][b][a], but the heavenly things themselves with better sacrifices than these.
translation:
  language: id
  text: Karena itu, salinan[a] dari hal-hal yang ada di surga perlu ditahirkan[b] dengan semua ini, tetapi hal-hal surgawi itu sendiri dengan kurban-kurban yang lebih baik daripada kurban-kurban ini.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pola-pola” atau “gambaran-gambaran.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dimurnikan.” Kata ini merupakan istilah ritual untuk pembersihan atau pemurnian.
    reason: lexical_alternative
  - marker: c
    text: Teks Yunani memakai bentuk jamak, “kurban-kurban yang lebih baik,” meskipun konteks Surat Ibrani berpusat pada persembahan Mesias yang dilakukan satu kali untuk selamanya.
    reason: theological_tension
lexical_decisions:
- source_word: Ἀνάγκη
  choice: harus
  rationale: Predikat impersonal ini menyatakan keharusan. Dalam bahasa Indonesia, “harus” menyampaikan gagasan itu secara alami tanpa memaksakan penandaan waktu yang tidak dinyatakan oleh bentuk Yunaninya.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ὑποδείγματα
  choice: salinan
  rationale: Dalam konteks ini, benda-benda ibadah duniawi merupakan padanan representatif dari hal-hal yang ada di surga. “Salinan” mempertahankan kontras langsung dengan hal-hal surgawi itu sendiri.
- source_word: τῶν ἐν τοῖς οὐρανοῖς
  choice: dari hal-hal yang ada di surga
  rationale: Terjemahan ini mempertahankan susunan genitif dan gagasan lokasi dalam bentuk jamak Yunani, tanpa menyamakannya dengan kata sifat ἐπουράνια pada klausa berikutnya.
- source_word: τούτοις
  choice: dengan kurban-kurban ini
  rationale: Kata tunjuk datif ini menunjuk kepada sarana pentahiran duniawi yang baru dibicarakan. Penyebutan “kurban-kurban” memperjelas rujukannya dalam bahasa Indonesia.
- source_word: καθαρίζεσθαι
  choice: harus ditahirkan
  rationale: Kata kerja ini merupakan bahasa ritual untuk membersihkan atau memurnikan. “Ditahirkan” mempertahankan nuansa kultis dan sakralnya.
- source_word: αὐτὰ δὲ τὰ ἐπουράνια
  choice: tetapi hal-hal surgawi itu sendiri
  rationale: “Itu sendiri” mempertahankan penekanan αὐτά, sedangkan “hal-hal surgawi” tetap dekat dengan bentuk Yunani dan tidak menggantinya dengan tafsiran seperti “tempat kudus surgawi” atau “realitas surgawi”.
- source_word: κρείττοσι θυσίαις
  choice: dengan kurban-kurban yang lebih baik
  rationale: “Lebih baik” menerjemahkan istilah perbandingan penting dalam Surat Ibrani, dan bentuk jamak “kurban-kurban” mempertahankan jamak θυσίαις.
- source_word: παρὰ ταύτας
  choice: daripada kurban-kurban ini
  rationale: Dengan bentuk komparatif κρείττοσι, παρά menyatakan perbandingan. Pengulangan “kurban-kurban” membuat acuannya jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan “hal-hal surgawi” dan pentahirannya
  choice: Mempertahankan pernyataan bahwa hal-hal surgawi itu sendiri harus ditahirkan.
  alternative: Menafsirkannya secara khusus sebagai tempat kudus surgawi, umat yang menjadi milik surga, atau memakai parafrasa yang menghindari gagasan bahwa sesuatu di surga ditahirkan.
  rationale: Teks Yunani secara terang membandingkan salinan duniawi dengan hal-hal surgawi dan memakai gagasan pentahiran bagi keduanya. Terjemahan tidak menyelesaikan ketegangan teologis ini melalui parafrasa.
- issue: Bentuk jamak “kurban-kurban” dalam kaitannya dengan persembahan Kristus yang satu kali untuk selamanya
  choice: Mempertahankan bentuk jamak “kurban-kurban” dalam teks utama.
  alternative: Mengubahnya menjadi bentuk tunggal “kurban” berdasarkan penekanan Surat Ibrani di bagian lain.
  rationale: θυσίαις berbentuk jamak. Mempertahankan bentuk itu menghormati bukti bahasa sumber dan tidak menyelaraskannya secara diam-diam dengan rumusan teologis dari ayat lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak yang bermartabat dan tetap mudah dipahami. Istilah “ditahirkan” dipilih karena konteksnya ritual, sedangkan struktur kalimat mempertahankan kontras antara salinan duniawi dan hal-hal surgawi. Predikat “harus ditahirkan” diulangi pada klausa kedua agar kalimat Indonesia jelas, walaupun dalam bahasa Yunani predikat itu dipahami secara elipsis.
