  rationale: Revisi menghapus penambahan 'kurban-kurban' pada terjemahan τούτοις di klausa pertama dan menggantinya dengan 'semua ini,' sehingga rujukan yang tidak diperinci oleh teks tetap tidak diperinci. Klausa kedua tetap menerjemahkan θυσίαις secara jamak dan mempertahankan ketegangan teologis mengenai pentahiran hal-hal surgawi tanpa parafrasa penafsirannya.
