  text: σκηνὴ γὰρ κατεσκευάσθη ἡ πρώτη ἐν ᾗ ἥ τε λυχνία καὶ ἡ τράπεζα καὶ ἡ πρόθεσις τῶν ἄρτων, ἥτις λέγεται Ἅγια·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/002.yaml
  text: For a first tabernacle was prepared[a], in which were the lampstand and the table and the bread of the Presence[b], which is called the Holy Place.
translation:
  language: id
  text: Sebab, kemah pertama telah dipersiapkan; di dalamnya terdapat kaki pelita, meja, dan roti sajian[a]. Kemah itu disebut Tempat Kudus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “penyajian roti” atau “penataan roti”; secara tradisional disebut “roti sajian” atau “roti persembahan,” yaitu roti yang ditempatkan di hadapan Allah.
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Yunani, “Tempat-Tempat Kudus”; di sini menunjuk pada ruang pertama kemah suci, yaitu Tempat Kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνὴ ... ἡ πρώτη
  choice: kemah yang pertama
  rationale: Dalam konteks ini σκηνή menunjuk pada kemah suci, dan ἡ πρώτη pada ruang pertamanya. Ungkapan ini mempertahankan gambaran kemah sekaligus kaitannya dengan ruang kedua pada ayat berikutnya.
- source_word: κατεσκευάσθη
  choice: telah dipersiapkan
  rationale: Kata pasif ini dapat mencakup penyiapan atau penataan ruang suci, bukan hanya pembangunannya secara arsitektural.
- source_word: λυχνία
  choice: kaki pelita
  rationale: Menunjuk pada penyangga lampu minyak dalam kemah suci; lebih tepat daripada istilah yang menyiratkan lilin.
- source_word: τράπεζα
  choice: meja
  rationale: Padanan langsung dan wajar untuk perabot kudus tersebut.
- source_word: ἡ πρόθεσις τῶν ἄρτων
  choice: roti yang dipersembahkan
  rationale: πρόθεσις menyatakan penempatan atau penyajian roti di hadapan Allah. Bentuk ini alami dalam bahasa Indonesia dan tidak bergantung pada istilah tradisional yang mungkin kurang dipahami.
- source_word: ἥτις λέγεται Ἅγια
  choice: Ruang itu disebut Tempat Kudus
  rationale: Klausa relatif Yunani merujuk pada kemah atau ruang pertama, bukan pada benda terakhir dalam daftar. Kalimat baru menghindari ambiguitas rujukan dalam bahasa Indonesia.
theological_decisions:
- issue: Makna bentuk jamak Ἅγια bagi ruang pertama kemah suci
  choice: Tempat Kudus
  alternative: tempat-tempat kudus; tempat suci
  rationale: Walaupun Ἅγια berbentuk jamak dalam bahasa Yunani, konteks membedakan ruang pertama dari ruang di balik tirai pada ayat berikutnya. Istilah konvensional 'Tempat Kudus' menyampaikan kontras ruang itu tanpa menambahkan klaim doktrinal.
- issue: Makna ἡ πρόθεσις τῶν ἄρτων
  choice: roti yang dipersembahkan
  alternative: roti sajian; penyajian roti; roti di hadapan Allah
  rationale: Frasa Yunani secara harfiah berkaitan dengan penempatan atau penyajian roti. Teks utama mempertahankan tindakan ritual secara alami, sedangkan catatan memberi padanan tradisional dan kemungkinan ungkapan konseptualnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. 'Kaki pelita' dan 'Tempat Kudus' mempertahankan kosakata Alkitabiah yang sudah luas dikenal. Klausa terakhir dijadikan kalimat tersendiri agar rujukannya jelas.
