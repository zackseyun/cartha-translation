source:
  edition: SBLGNT
  text: οὐ γὰρ εἰς χειροποίητα ⸂εἰσῆλθεν ἅγια⸃ Χριστός, ἀντίτυπα τῶν ἀληθινῶν, ἀλλ’ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/024.yaml
  text: For Messiah did not enter into holy places made by hands[a], copies of the true things, but into heaven itself[c][b], now to appear in the presence of God on our behalf.
translation:
  language: id
  text: Sebab Mesias[a] tidak masuk ke tempat-tempat kudus buatan tangan manusia, yang merupakan gambaran[b] dari kenyataan yang sejati, melainkan ke surga itu sendiri, untuk tampil sekarang di hadapan Allah[c] demi kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Kata Yunani Χριστός berarti “Mesias” atau “Yang Diurapi.”
    reason: alternative_reading
  - marker: b
    text: Atau “padanan” atau “salinan.” Kata Yunani ini menunjuk pada sesuatu yang berhubungan dan bersesuaian dengan kenyataan yang sejati.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “di hadapan wajah Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: Mesias
  rationale: Mempertahankan makna gelar yang aktif dalam pembahasan mengenai tugas keimaman dan penggenapan, dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: χειροποίητα
  choice: buatan tangan manusia
  rationale: Mengungkapkan dengan jelas bahwa tempat-tempat itu dibuat oleh manusia sekaligus mempertahankan kontras dengan kenyataan surgawi.
- source_word: ἅγια
  choice: tempat-tempat kudus
  rationale: Mempertahankan bentuk jamak dan istilah peribadatan dalam Ibrani tanpa mempersempitnya menjadi satu ruang tertentu.
- source_word: ἀντίτυπα
  choice: gambaran
  rationale: Menunjukkan bahwa tempat-tempat kudus duniawi berpadanan dengan dan merepresentasikan kenyataan surgawi; alternatif nuansanya dicatat dalam catatan kaki.
- source_word: τῶν ἀληθινῶν
  choice: dari kenyataan yang sejati
  rationale: Menyampaikan kontras antara gambaran duniawi dan realitas surgawi yang hakiki secara alami dalam bahasa Indonesia.
- source_word: αὐτὸν τὸν οὐρανόν
  choice: surga itu sendiri
  rationale: Kata 'sendiri' mempertahankan penegasan konstruksi Yunani tentang surga sebagai kenyataan yang sesungguhnya.
- source_word: νῦν
  choice: sekarang
  rationale: Mempertahankan penanda waktu yang menekankan makna tindakan Mesias pada masa kini.
- source_word: ἐμφανισθῆναι
  choice: untuk ... tampil
  rationale: Menyatakan tujuan masuknya Mesias ke surga tanpa menambahkan gagasan refleksif yang tidak dinyatakan secara eksplisit.
- source_word: τῷ προσώπῳ τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: Ungkapan Indonesia yang alami bagi idiom Yunani dan tetap menyampaikan kedekatan pribadi di hadapan Allah.
- source_word: ὑπὲρ ἡμῶν
  choice: demi kita
  rationale: Menjaga daya perwakilan dan pengantaraan dalam konteks keimaman tanpa memasukkan teori penebusan yang lebih sempit.
theological_decisions:
- issue: Istilah peribadatan ἅγια
  choice: tempat-tempat kudus
  alternative: tempat kudus; tempat suci
  rationale: Bentuk jamak Yunani dipertahankan agar gambaran kemah suci dan cakupan ruang kudus tidak dipersempit secara prematur.
- issue: Gelar kristologis Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Pilihan ini menerjemahkan makna gelar Yunani dalam konteks tugas keimaman Mesias; alternatif tradisional dicatat tanpa mengubah isi kristologis.
- issue: Daya perwakilan ὑπὲρ ἡμῶν
  choice: demi kita
  alternative: untuk kita; bagi kita
  rationale: Ungkapan ini menyampaikan tindakan Mesias demi kepentingan kita dalam konteks pengantaraan, tanpa menentukan mekanismenya lebih jauh.
- issue: Hubungan ἀντίτυπα dengan τῶν ἀληθινῶν
  choice: gambaran dari kenyataan yang sejati
  alternative: padanan dari hal-hal yang sejati; salinan dari kenyataan yang sejati
  rationale: Terjemahan mempertahankan kontras duniawi-surgawi sambil tidak menyiratkan bahwa yang duniawi identik dengan kenyataan surgawi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Susunan kalimat mempertahankan kontras utama ‘bukan ... melainkan ...’, sedangkan istilah teknis dijelaskan melalui catatan kaki agar teks utama tetap mudah dipahami.
