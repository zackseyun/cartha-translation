base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/009.yaml
  text: which is a parable for the present time[a], according to which both gifts and sacrifices are offered that are not able to perfect the worshiper with respect to conscience,
translation:
  language: id
  text: Hal itu merupakan perumpamaan bagi masa sekarang[a]; sesuai dengan itu, persembahan dan kurban dipersembahkan, yang tidak sanggup menyempurnakan orang yang beribadah dalam hal hati nurani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lambang” atau “gambaran” bagi masa sekarang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥτις
  choice: Hal itu
  rationale: Kata ganti relatif ini merujuk pada tatanan kemah yang disebut sebelumnya. Dalam bahasa Indonesia, “Hal itu” mempertahankan kaitan penjelas secara alami tanpa menentukan rujukannya lebih sempit daripada teks Yunani.
- source_word: παραβολὴ
  choice: perumpamaan
  rationale: Mempertahankan arti dasar sebagai gambaran atau perbandingan figuratif. Karena dalam konteks ini kata tersebut juga dapat dipahami sebagai lambang atau gambaran, alternatif itu dicatat dalam catatan kaki.
- source_word: εἰς τὸν καιρὸν τὸν ἐνεστηκότα
  choice: bagi masa sekarang
  rationale: Menyampaikan bahwa tatanan tersebut menunjuk atau berlaku secara figuratif bagi waktu yang sedang berlangsung dalam alur argumentasi.
- source_word: καθ’ ἣν
  choice: Sesuai dengan perumpamaan itu
  rationale: Mengungkapkan hubungan antara tatanan figuratif tersebut dan kegiatan mempersembahkan persembahan serta kurban, sekaligus menghindari kata ganti relatif yang terasa kaku dalam bahasa Indonesia.
- source_word: δῶρά τε καὶ θυσίαι
  choice: berbagai persembahan dan kurban
  rationale: Membedakan kedua istilah kultis. “Berbagai” membantu menyampaikan bentuk jamak tanpa menambahkan kategori baru.
- source_word: προσφέρονται
  choice: dipersembahkan
  rationale: Bentuk pasif kini menyatakan tindakan kultis yang berlangsung; bentuk pasif Indonesia mempertahankan struktur dan maknanya.
- source_word: μὴ δυνάμεναι
  choice: tidak sanggup
  rationale: Menyatakan ketidakmampuan persembahan dan kurban secara alami dan tegas dalam bahasa Indonesia.
- source_word: κατὰ συνείδησιν
  choice: hati nurani
  rationale: Menandai ranah yang tidak dapat disempurnakan. Penempatan langsung sebagai objek “menyempurnakan” menghasilkan bahasa Indonesia yang alami tanpa mengurangi batasan maknanya.
- source_word: τελειῶσαι
  choice: menyempurnakan
  rationale: Mempertahankan bobot istilah τελειόω dalam Surat Ibrani, yaitu membawa kepada keadaan lengkap atau layak yang dimaksudkan.
- source_word: τὸν λατρεύοντα
  choice: orang yang beribadah
  rationale: Menerjemahkan partisip substantival tunggal secara alami dan mempertahankan latar ibadah kultis.
theological_decisions:
- issue: Makna παραβολή dalam konteks ibadah dan tipologi
  choice: perumpamaan
  alternative: lambang atau gambaran
  rationale: “Perumpamaan” mempertahankan daya figuratif dan hubungan korespondensi dalam teks tanpa mereduksinya menjadi lambang abstrak. Karena “lambang” atau “gambaran” juga merupakan pemahaman kontekstual yang masuk akal, alternatif tersebut dipertahankan dalam catatan kaki.
- issue: Ruang lingkup kesempurnaan yang tidak dapat dicapai
  choice: tidak sanggup menyempurnakan hati nurani orang yang beribadah
  alternative: tidak sanggup menyempurnakan orang yang beribadah dalam hal hati nurani
  rationale: Susunan yang dipilih alami dalam bahasa Indonesia dan tetap menyatakan bahwa keterbatasan persembahan serta kurban menyangkut hati nurani, bukan bahwa orang itu sama sekali tidak dapat disempurnakan dalam setiap arti.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Istilah “kurban” dipakai untuk θυσίαι guna membedakannya dari “persembahan”; ejaan ini mengikuti bentuk baku bahasa Indonesia.
