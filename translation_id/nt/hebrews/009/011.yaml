  rationale: Revisi mempertahankan struktur kalimat yang berlanjut ke ayat 12 tanpa menjadikan frasa “melalui Kemah Suci” tampak sebagai sarana kedatangan Mesias. “Atas” lebih alami untuk hubungan jabatan Imam Besar dengan “hal-hal baik”, sedangkan “bukan dari ciptaan ini” lebih dekat kepada ungkapan Yunani dan tidak mempersempit maknanya.
