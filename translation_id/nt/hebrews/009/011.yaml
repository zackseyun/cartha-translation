- from: Namun, ketika Mesias datang sebagai Imam Besar dari hal-hal baik yang telah datang[a], melalui Kemah Suci yang lebih agung dan lebih sempurna, yang tidak dibuat oleh tangan manusia—artinya, yang bukan bagian dari ciptaan ini—[b]
