id: HEB.9.11
reference: Hebrews 9:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Χριστὸς δὲ παραγενόμενος ἀρχιερεὺς τῶν ⸀γενομένων ἀγαθῶν διὰ τῆς μείζονος καὶ τελειοτέρας σκηνῆς οὐ χειροποιήτου, τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/011.yaml
  text: But the Messiah came as high priest of the good things that have come[a], through the greater and more perfect tabernacle not made by hands—that is[b], not of this creation—
translation:
  language: id
  text: Namun, Mesias, setelah datang sebagai Imam Besar atas hal-hal baik yang telah datang[a], melalui Kemah Suci yang lebih agung dan lebih sempurna, yang tidak dibuat oleh tangan manusia—artinya, bukan dari ciptaan ini—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi “hal-hal baik yang akan datang.”
    reason: textual_variant
  - marker: b
    text: Kalimat ini berlanjut ke ayat 12; frasa “melalui Kemah Suci” paling mungkin menerangkan “masuk” dalam ayat itu, bukan “datang” dalam ayat ini.
    reason: syntax
lexical_decisions:
- source_word: Χριστὸς
  choice: Mesias
  rationale: Dalam konteks ini Χριστός berfungsi sebagai gelar; “Mesias” alami dalam bahasa Indonesia dan mempertahankan nuansa jabatan yang diurapi.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang berkontras dengan pembahasan sebelumnya tentang kemah dan pelayanan imam duniawi.
- source_word: παραγενόμενος
  choice: ketika ... datang
  rationale: Partisip aoris ini menyatakan kedatangan atau tampilnya Mesias dalam peran sebagai Imam Besar. Bentuk temporal menghasilkan susunan Indonesia yang alami tanpa menghilangkan hubungannya dengan verba utama pada ayat berikutnya.
- source_word: ἀρχιερεὺς
  choice: Imam Besar
  rationale: Padanan baku dan tepat bagi jabatan kultis yang menjadi pokok penting dalam Surat Ibrani.
- source_word: τῶν γενομένων ἀγαθῶν
  choice: dari hal-hal baik yang telah datang
  rationale: Mengikuti teks SBLGNT γενομένων dan mempertahankan aspek bahwa hal-hal baik itu telah tiba, tanpa mempersempit rujukannya menjadi berkat tertentu.
- source_word: διὰ τῆς ... σκηνῆς
  choice: melalui Kemah Suci ...
  rationale: διά dengan genitif menyatakan lintasan “melalui”; σκηνή di sini membawa gema Kemah Suci Israel, bukan sekadar kemah biasa. Frasa dibiarkan menggantung menuju verba utama dalam ayat 12.
- source_word: μείζονος
  choice: lebih agung
  rationale: Menyampaikan keunggulan kualitatif, bukan hanya ukuran fisik.
- source_word: τελειοτέρας
  choice: lebih sempurna
  rationale: Mempertahankan kosakata tematis kesempurnaan atau penyempurnaan dalam Surat Ibrani.
- source_word: οὐ χειροποιήτου
  choice: yang tidak dibuat oleh tangan manusia
  rationale: Mengungkapkan idiom Yunani secara jelas bagi pembaca modern sekaligus mempertahankan kontras dengan bangunan buatan manusia.
- source_word: τοῦτ’ ἔστιν
  choice: artinya
  rationale: Memperkenalkan penjelasan terhadap sifat Kemah Suci tersebut dengan bahasa Indonesia yang alami.
- source_word: οὐ ταύτης τῆς κτίσεως
  choice: yang bukan bagian dari ciptaan ini
  rationale: Menunjukkan bahwa Kemah Suci itu tidak termasuk dalam tatanan ciptaan yang sedang dibicarakan, tanpa menjelaskan lebih jauh hakikatnya.
theological_decisions:
- issue: Varian teks τῶν γενομένων ἀγαθῶν
  choice: dari hal-hal baik yang telah datang
  alternative: dari hal-hal baik yang akan datang
  rationale: Teks utama mengikuti SBLGNT, yang membaca γενομένων (“yang telah datang”). Varian μελλόντων (“yang akan datang”) dicatat karena dukungan manuskrip dan dampak waktunya penting.
- issue: Hubungan sintaksis διὰ τῆς ... σκηνῆς
  choice: Frasa “melalui Kemah Suci” dibiarkan berlanjut ke ayat 12
  alternative: Menghubungkannya langsung dengan kedatangan Mesias dalam ayat 11
  rationale: Dalam konstruksi Yunani, frasa ini paling wajar menerangkan εἰσῆλθεν (“masuk”) pada ayat 12. Tanda pisah akhir mempertahankan alur lintas ayat dan menghindari kesan bahwa Mesias datang atau tampil melalui Kemah Suci.
- issue: Makna οὐ ταύτης τῆς κτίσεως
  choice: bukan bagian dari ciptaan ini
  alternative: bukan dari bangunan ini
  rationale: κτίσις paling alami menunjuk pada ciptaan atau tatanan tercipta. Terjemahan tidak menentukan lebih jauh apakah ungkapan itu harus dipahami secara kosmologis, tipologis, atau keduanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Imam Besar” dan “Kemah Suci” menandai jabatan serta tempat ibadah khusus dalam konteks ini. Susunan ayat sengaja berakhir dengan tanda pisah karena kalimat Yunani berlanjut ke ayat 12; semua penanda catatan kaki muncul dalam teks utama.
