  text: For where there is a covenant[a], it is necessary for the death of the one who made it to be brought forward.
translation:
  language: id
  text: Sebab, jika ada perjanjian[a], kematian orang yang membuatnya harus dikemukakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab, jika ada wasiat, kematian orang yang membuatnya harus dikemukakan.” Kata Yunani diathēkē dapat berarti “perjanjian” atau “wasiat”; banyak penafsir memahami ayat 16–17 dalam pengertian hukum tentang wasiat.
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκη
  choice: perjanjian
  rationale: Dalam konteks Ibrani 8–10, pembahasan didominasi perjanjian baru dan pengesahannya melalui korban. Namun, makna hukum 'wasiat' tetap mungkin dalam ayat 16–17 dan dipertahankan dalam catatan kaki.
- source_word: θάνατον
  choice: kematian
  rationale: Padanan langsung dan wajar untuk θάνατος, yang di sini menunjuk pada kematian nyata.
- source_word: ἀνάγκη
  choice: harus
  rationale: Mengungkapkan keharusan secara alami dan tegas dalam bahasa Indonesia modern.
- source_word: φέρεσθαι
  choice: dikemukakan
  rationale: Bentuk pasif φέρω secara harfiah menyatakan sesuatu yang dibawa atau diajukan. 'Dikemukakan' mempertahankan gagasan bahwa kematian itu harus diajukan sebagai fakta yang relevan, tanpa mempersempit maknanya menjadi 'dibuktikan' atau 'ditetapkan'.
- source_word: τοῦ διαθεμένου
  choice: orang yang membuatnya
  rationale: Menunjuk kepada pihak yang mengadakan διαθήκη tanpa memaksakan istilah hukum 'pembuat wasiat' ketika teks utama memakai 'perjanjian'.
- source_word: ὅπου γὰρ
  choice: Sebab di mana
  rationale: Mempertahankan fungsi penjelas γάρ dan bentuk relasional-lokatif ὅπου dengan susunan Indonesia yang jelas.
theological_decisions:
- issue: Apakah διαθήκη berarti 'perjanjian' atau 'wasiat' dalam Ibrani 9:16
  choice: '''perjanjian'' dalam teks utama'
  alternative: '''wasiat'' dalam pembacaan hukum ayat 16–17'
  rationale: Konteks luas Ibrani berpusat pada perjanjian, sedangkan ayat 16–17 memungkinkan permainan atau peralihan makna ke ranah wasiat. Catatan kaki menjaga ambiguitas dan ketegangan penafsiran itu tanpa memutuskannya secara diam-diam.
- issue: Nuansa φέρεσθαι
  choice: '''dikemukakan'''
  alternative: '''ditetapkan'', ''dibuktikan'', atau ''diajukan'''
  rationale: '''Dikemukakan'' dekat dengan citra dasar ''dibawa ke depan'' dan tidak menambahkan gagasan pembuktian atau pengesahan yang tidak dinyatakan secara eksplisit oleh kata Yunani tersebut.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur dipertahankan cukup dekat dengan bahasa sumber, sementara 'harus' dipakai agar ungkapan keharusan terdengar alami. Penanda catatan kaki [a] dicantumkan pada kata yang ambigu.
