id: HEB.9.22
reference: Hebrews 9:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ σχεδὸν ἐν αἵματι πάντα καθαρίζεται κατὰ τὸν νόμον, καὶ χωρὶς αἱματεκχυσίας οὐ γίνεται ἄφεσις.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/022.yaml
  text: And according to the law[a], almost everything is cleansed with blood, and without the shedding of blood there is no forgiveness.
translation:
  language: id
  text: Dan menurut hukum Taurat, hampir segala sesuatu disucikan dengan darah, dan tanpa penumpahan darah tidak ada pengampunan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembebasan”; istilah Yunani ini dapat berarti pelepasan atau pengampunan. Di sini yang dimaksud adalah pengampunan dosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: σχεδόν
  choice: hampir
  rationale: Kata keterangan ini membatasi cakupan pernyataan; “hampir” mempertahankan penegasan bahwa tidak mutlak semua penyucian menurut hukum Taurat melibatkan darah.
- source_word: ἐν αἵματι
  choice: dengan darah
  rationale: ἐν di sini paling wajar dipahami secara instrumental, yaitu darah sebagai sarana penyucian ritual.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Bentuk jamak netral ini merujuk secara luas pada benda dan perkara ritual yang sedang dibahas; ungkapan ini tetap dibatasi oleh “hampir”.
- source_word: καθαρίζεται
  choice: disucikan
  rationale: Bentuk pasif kala kini menggambarkan praktik yang lazim menurut hukum Taurat. “Disucikan” mempertahankan nuansa ritual dan teologis dalam bahasa Indonesia yang alami.
- source_word: κατὰ τὸν νόμον
  choice: menurut hukum Taurat
  rationale: κατά menyatakan kesesuaian dengan ketentuan hukum Musa. “Hukum Taurat” memperjelas rujukan kontekstual νόμος tanpa menambahkan tafsiran doktrinal.
- source_word: χωρὶς
  choice: tanpa
  rationale: Padanan langsung dan alami untuk makna privatif kata tersebut.
- source_word: αἱματεκχυσίας
  choice: penumpahan darah
  rationale: Nomina ini menunjuk pada pencurahan atau penumpahan darah dan mempertahankan gema pengurbanan dalam konteks.
- source_word: οὐ γίνεται
  choice: tidak ada
  rationale: Bersama nomina abstrak ἄφεσις, frasa ini menyatakan bahwa pengampunan tidak terjadi; “tidak ada” menghasilkan rumusan Indonesia yang ringkas dan alami.
- source_word: ἄφεσις
  choice: pengampunan
  rationale: Dalam konteks pengurbanan ini, kata tersebut menunjuk pada pembebasan dari dosa dalam arti pengampunan; pilihan ini jelas bagi pembaca modern, sementara keluasan leksikalnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Pemaknaan ἄφεσις dalam konteks pengurbanan
  choice: pengampunan
  alternative: pembebasan
  rationale: Konteks argumentasi Ibrani menunjuk pada pengampunan dosa, tetapi kata Yunaninya secara leksikal juga dapat berarti pelepasan atau pembebasan. Teks utama memakai ungkapan paling jelas tanpa memasukkan sistem doktrinal yang lebih sempit, sedangkan alternatifnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan dua klausa sejajar dari teks Yunani. Istilah “hukum Taurat” digunakan agar rujukan kepada hukum Musa jelas bagi pembaca umum.
