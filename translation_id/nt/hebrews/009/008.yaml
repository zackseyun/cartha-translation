source:
  edition: SBLGNT
  text: τοῦτο δηλοῦντος τοῦ πνεύματος τοῦ ἁγίου, μήπω πεφανερῶσθαι τὴν τῶν ἁγίων ὁδὸν ἔτι τῆς πρώτης σκηνῆς ἐχούσης στάσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/008.yaml
  text: By this the Holy Spirit is indicating that the way into the holy places has not yet been revealed while the first tabernacle still has standing,
translation:
  language: id
  text: Melalui hal ini, Roh Kudus menyatakan bahwa jalan masuk ke tempat-tempat kudus[a] belum dinyatakan selama kemah pertama masih ada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jalan masuk ke tempat kudus.” Ungkapan Yunani dapat menunjuk pada kawasan kudus secara umum; sebagian memahaminya secara lebih khusus sebagai “jalan masuk ke Tempat Mahakudus.”
    reason: alternative_reading
  - marker: b
    text: Atau “selama kemah pertama masih berdiri” atau “masih tetap berlaku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δηλοῦντος
  choice: Dengan demikian, ... menyatakan
  rationale: Konstruksi genitif absolut menerangkan makna dari tata ibadah yang baru saja dipaparkan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya penjelas verba kini δηλοῦντος.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: Roh Kudus
  rationale: Padanan baku dan wajar bagi sebutan pribadi ilahi ini dalam Perjanjian Baru.
- source_word: μήπω πεφανερῶσθαι
  choice: belum dinyatakan
  rationale: Bentuk infinitif perfek pasif menyatakan bahwa jalan itu belum dibuat nyata atau terbuka; bentuk pasif bahasa Indonesia mempertahankan fokus tersebut tanpa menjadi kaku.
- source_word: τὴν τῶν ἁγίων ὁδὸν
  choice: jalan masuk ke tempat-tempat kudus
  rationale: Dalam konteks tata kemah suci, ὁδός menunjuk pada akses, sedangkan bentuk jamak substantival τῶν ἁγίων menunjuk pada ruang kudus. Kata 'masuk' ditambahkan secara idiomatis untuk menyampaikan arah akses tanpa mempersempit rujukannya hanya kepada ruang mahakudus.
- source_word: τῆς πρώτης σκηνῆς
  choice: kemah pertama
  rationale: Mengikuti pembedaan ruang yang dibuat penulis dalam konteks langsung. 'Kemah' mempertahankan gambaran σκηνή dan lazim dipahami dalam konteks Kemah Suci.
- source_word: ἔτι ... ἐχούσης στάσιν
  choice: masih tetap berlaku
  rationale: Ungkapan ini menyampaikan keberlanjutan kedudukan atau keberlakuan kemah pertama. Padanan ini lebih alami daripada terjemahan harfiah 'mempunyai kedudukan', sementara kemungkinan makna fisik 'masih berdiri' dicatat dalam catatan kaki.
theological_decisions:
- issue: Rujukan τῶν ἁγίων
  choice: akses ke tempat-tempat kudus dalam tata ibadah
  alternative: jalan orang-orang kudus
  rationale: Konteks langsung membahas susunan Kemah Suci dan akses para imam, sehingga rujukannya bersifat ruang dan peribadatan, bukan kepada umat kudus.
- issue: Cakupan tempat kudus
  choice: tempat-tempat kudus secara umum
  alternative: Tempat Mahakudus secara khusus
  rationale: Konteks dapat mengarahkan pembaca terutama kepada ruang terdalam, tetapi bentuk jamak Yunani tidak mengharuskan penyempitan itu. Teks utama mempertahankan keluasan ungkapan sumber.
- issue: Makna keberadaan kemah pertama
  choice: masih tetap berlaku
  alternative: masih berdiri secara fisik
  rationale: στάσις dapat menunjuk pada keberadaan, kedudukan, atau keberlangsungan suatu tata. Terjemahan utama menyampaikan keberlakuannya dalam argumen penulis, sedangkan alternatif fisik tetap disediakan agar ketaksaan asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat mengalir bagi pembaca umum, sambil mempertahankan citra Kemah Suci, bentuk pasif, serta ketaksaan mengenai cakupan tempat kudus dan makna keberlangsungan kemah pertama.
