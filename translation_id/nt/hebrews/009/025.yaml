id: HEB.9.25
reference: Hebrews 9:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐδ’ ἵνα πολλάκις προσφέρῃ ἑαυτόν, ὥσπερ ὁ ἀρχιερεὺς εἰσέρχεται εἰς τὰ ἅγια κατ’ ἐνιαυτὸν ἐν αἵματι ἀλλοτρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/025.yaml
  text: Nor was it so that he might offer himself many times[a], just as the high priest enters the holy places year by year with blood not his own,
translation:
  language: id
  text: Bukan pula supaya Ia mempersembahkan diri-Nya berkali-kali, seperti imam besar yang setiap tahun masuk ke tempat kudus[a] dengan membawa darah yang bukan darahnya sendiri,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tempat-tempat kudus”; dalam konteks peribadatan ini dapat dipahami sebagai tempat kudus atau, secara lebih khusus, Ruang Mahakudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ἵνα
  choice: Bukan pula supaya
  rationale: Melanjutkan alur tujuan yang dinegasikan dari ayat sebelumnya dengan ungkapan Indonesia yang alami.
- source_word: πολλάκις
  choice: berkali-kali
  rationale: Menyatakan pengulangan dan mempertahankan kontras dengan tindakan tahunan imam besar.
- source_word: προσφέρῃ ἑαυτόν
  choice: Ia mempersembahkan diri-Nya
  rationale: Mempertahankan makna pengurbanan dari προσφέρω dan unsur refleksif ἑαυτόν.
- source_word: ὥσπερ
  choice: seperti
  rationale: Menandai perbandingan secara jelas dan alami dalam bahasa Indonesia.
- source_word: ὁ ἀρχιερεὺς
  choice: imam besar
  rationale: Padanan baku untuk jabatan kultis Yahudi tersebut.
- source_word: εἰσέρχεται
  choice: masuk
  rationale: Bentuk sekarang Yunani menyatakan tindakan yang lazim atau berulang; dalam bahasa Indonesia aspek itu diperjelas oleh 'setiap tahun'.
- source_word: εἰς τὰ ἅγια
  choice: ke tempat kudus
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tidak mempersempit rujukan secara pasti menjadi Ruang Mahakudus; bentuk jamak Yunani dijelaskan dalam catatan kaki.
- source_word: κατ’ ἐνιαυτὸν
  choice: setiap tahun
  rationale: Padanan idiomatis yang jelas untuk pola tahunan yang berulang.
- source_word: ἐν αἵματι ἀλλοτρίῳ
  choice: dengan membawa darah yang bukan darahnya sendiri
  rationale: Mengungkapkan sarana sekaligus keadaan masuknya imam besar dengan alami, serta menonjolkan bahwa darah itu bukan miliknya sendiri.
theological_decisions:
- issue: Rujukan perbandingan antara Kristus dan imam besar Lewi
  choice: Ayat ini menyatakan bahwa Kristus tidak mempersembahkan diri-Nya berulang kali, berbeda dengan imam besar yang setiap tahun masuk dengan darah yang bukan darahnya sendiri.
  alternative: Frasa τὰ ἅγια dapat dipahami secara lebih khusus sebagai Ruang Mahakudus.
  rationale: Terjemahan mempertahankan kontras tekstual antara persembahan diri Kristus dan pelayanan tahunan imam besar tanpa menambahkan rumusan doktrinal di luar ayat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Pronomina bagi Kristus ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Koma akhir dipertahankan karena ayat ini berlanjut ke ayat berikutnya.
