  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας, ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/028.yaml
  text: so also the Messiah[a], having been offered once to bear the sins of many, will appear a second time, apart from sin, to those who eagerly await him, for salvation.
translation:
  language: id
  text: Demikian pula Mesias, setelah dipersembahkan satu kali untuk menanggung dosa banyak orang, akan menampakkan diri untuk kedua kalinya, tanpa kaitan dengan dosa,[a] kepada mereka yang menanti-nantikan Dia, untuk keselamatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “terpisah dari dosa.” Dalam konteks ini, maksudnya bukan untuk menanggung dosa seperti dalam persembahan-Nya yang pertama.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Demikian pula
  rationale: Menandai perbandingan dengan gambaran pada ayat sebelumnya secara alami dan tetap mempertahankan daya komparatifnya.
- source_word: ὁ Χριστός
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar dalam argumen sejarah keselamatan; 'Mesias' menyampaikan makna gelar tersebut dengan jelas dalam bahasa Indonesia.
- source_word: ἅπαξ
  choice: satu kali
  rationale: Menyatakan satu kejadian tanpa menambahkan gagasan 'untuk selama-lamanya' yang tidak dinyatakan langsung oleh kata ini.
- source_word: προσενεχθεὶς
  choice: setelah dipersembahkan
  rationale: Mempertahankan bentuk pasif partisipel aoris serta hubungan waktunya dengan verba utama yang berbentuk akan datang.
- source_word: εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας
  choice: untuk menanggung dosa banyak orang
  rationale: Menyampaikan tujuan persembahan dan mempertahankan gema bahasa pengurbanan serta gambaran menanggung dosa.
- source_word: ἐκ δευτέρου
  choice: untuk kedua kalinya
  rationale: Ungkapan idiomatis yang jelas membedakan penampakan mendatang dari kedatangan dan persembahan-Nya yang pertama.
- source_word: χωρὶς ἁμαρτίας
  choice: terlepas dari dosa
  rationale: Ungkapan ringkas ini tetap dekat dengan arti harfiahnya dan tidak langsung menyelesaikan apakah maksudnya 'tanpa kaitan dengan dosa' atau secara khusus 'bukan untuk menanggung dosa'.
- source_word: ὀφθήσεται
  choice: akan menampakkan diri
  rationale: Mengungkapkan pemakaian pasif ὁράω sebagai bahasa penampakan secara wajar dalam konteks eskatologis.
- source_word: τοῖς αὐτὸν ἀπεκδεχομένοις
  choice: kepada mereka yang menanti-nantikan Dia
  rationale: Bentuk 'menanti-nantikan' menyampaikan penantian yang tekun dan penuh pengharapan dalam ἀπεκδέχομαι.
- source_word: εἰς σωτηρίαν
  choice: untuk keselamatan
  rationale: Mempertahankan ungkapan tujuan secara ringkas tanpa menambahkan verba penjelas yang tidak terdapat dalam teks Yunani.
theological_decisions:
- issue: Makna χωρὶς ἁμαρτίας pada penampakan Mesias yang kedua
  choice: terlepas dari dosa
  alternative: tanpa kaitan dengan dosa; bukan untuk menanggung dosa seperti dalam persembahan-Nya yang pertama
  rationale: Teks utama mempertahankan keringkasan dan ketegangan ungkapan Yunani, sedangkan catatan kaki menjelaskan pembacaan kontekstual yang paling mungkin tanpa memasukkannya secara paksa ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan alur argumentasi Yunani, sementara pilihan seperti 'menanti-nantikan' dan 'menampakkan diri' tetap alami bagi pembaca umum.
