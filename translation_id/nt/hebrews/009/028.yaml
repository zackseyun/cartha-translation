  terminology: “Mesias,” “dipersembahkan,” “menanggung dosa,” dan “keselamatan” merupakan padanan yang tepat dan konsisten dengan register kitab Ibrani. Kapitalisasi “Dia/Nya” dapat dipertahankan sesuai gaya naskah. Catatan kaki perlu diselaraskan karena alternatif yang sebelumnya dicantumkan menjadi teks utama.
