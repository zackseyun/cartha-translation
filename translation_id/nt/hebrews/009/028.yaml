  source_fidelity: 'Struktur utama dan semua unsur Yunani tercakup dengan baik: perbandingan οὕτως καί, pasif aoris προσενεχθείς, tujuan menanggung dosa banyak orang, penampakan kedua, penerima penampakan, dan εἰς σωτηρίαν. Namun, “terlepas dari dosa” dalam bahasa Indonesia dapat terutama dipahami sebagai pernyataan bahwa Mesias bebas dari dosa secara moral, bukan bahwa penampakan kedua-Nya tidak lagi berkaitan dengan penanggungan dosa. “Tanpa kaitan dengan dosa” lebih setia kepada fungsi kontekstual χωρὶς ἁμαρτίας tanpa memasukkan penjelasan penuh ke dalam teks utama.'
