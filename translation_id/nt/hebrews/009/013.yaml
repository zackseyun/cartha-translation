  text: εἰ γὰρ τὸ αἷμα ⸂τράγων καὶ ταύρων⸃ καὶ σποδὸς δαμάλεως ῥαντίζουσα τοὺς κεκοινωμένους ἁγιάζει πρὸς τὴν τῆς σαρκὸς καθαρότητα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/013.yaml
  text: For if the blood of goats and bulls[a], and the ashes of a heifer that sprinkle those who have been defiled, sanctify for the purification of the flesh[d][c][b],
translation:
  language: id
  text: Sebab, jika darah kambing jantan dan lembu jantan, serta abu lembu betina muda untuk memerciki mereka yang telah menjadi najis[a], menguduskan untuk kemurnian jasmani[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, menjadi najis secara ritual.
    reason: lexical_alternative
  - marker: b
    text: Artinya, kemurnian lahiriah atau jasmani dalam tata ibadah perjanjian lama.
    reason: cultural_note
  - marker: c
    text: Ini mengacu pada upacara penahiran dengan abu lembu betina muda dalam Bilangan 19.
    reason: cross_reference
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Sebab, jika
  rationale: Mempertahankan hubungan argumentatif dan bentuk bersyarat yang berlanjut ke ayat 14.
- source_word: τὸ αἷμα τράγων καὶ ταύρων
  choice: darah kambing jantan dan lembu jantan
  rationale: Menyatakan rujukan kurban secara tepat; jenis kelamin kedua hewan eksplisit dalam bahasa Yunani dan wajar dinyatakan dalam bahasa Indonesia.
- source_word: σποδὸς δαμάλεως
  choice: abu lembu betina muda
  rationale: δαμάλεως menunjuk pada lembu betina muda dan menggemakan upacara Bilangan 19; bentuk ini lebih mudah dipahami daripada istilah teknis yang langka.
- source_word: ῥαντίζουσα τοὺς κεκοινωμένους
  choice: yang dipercikkan kepada mereka yang telah menjadi najis
  rationale: Bahasa Yunani secara gramatikal memakai partisip aktif yang menerangkan 'abu', tetapi dalam praktik ritual abulah yang dipercikkan oleh pelaksana upacara. Bentuk pasif Indonesia menghindari gambaran tidak wajar bahwa abu bertindak sendiri tanpa mengubah sasaran tindakan.
- source_word: τοὺς κεκοινωμένους
  choice: mereka yang telah menjadi najis
  rationale: Dalam konteks ini κοινόω menunjuk pada kenajisan ritual. Bentuk 'telah menjadi' mencerminkan keadaan yang dihasilkan oleh partisip perfek.
- source_word: ἁγιάζει
  choice: menguduskan
  rationale: Mempertahankan istilah kultis-teologis sambil membiarkan frasa berikutnya membatasi pengudusan itu pada ranah jasmani.
- source_word: πρὸς τὴν τῆς σαρκὸς καθαρότητα
  choice: sehingga menghasilkan kebersihan jasmani
  rationale: πρός menyatakan hasil atau tujuan. 'Jasmani' menyampaikan ranah lahiriah dari σάρξ dalam konteks ritual dan menjaga kontras dengan hati nurani pada ayat 14.
theological_decisions:
- issue: Arti pengudusan melalui upacara perjanjian lama
  choice: Pengudusan ritual yang menghasilkan kebersihan jasmani
  alternative: Perubahan batin atau pengudusan moral secara menyeluruh
  rationale: Klausa πρὸς τὴν τῆς σαρκὸς καθαρότητα membatasi hasilnya pada ranah lahiriah-ritual, yang kemudian dikontraskan dengan pembersihan hati nurani dalam ayat 14.
- issue: Makna σάρξ
  choice: Ranah jasmani atau lahiriah
  alternative: Tabiat berdosa
  rationale: Konteksnya adalah penahiran ritual, bukan penggunaan metaforis σάρξ untuk kecenderungan berdosa.
- issue: Agen dalam ῥαντίζουσα
  choice: Abu dipahami sebagai bahan yang dipercikkan kepada orang najis
  alternative: Abu digambarkan secara gramatikal sebagai pelaku yang memerciki
  rationale: Partisip aktif Yunani menerangkan 'abu', tetapi konstruksi tersebut dapat menyatakan sarana ritual. Bentuk Indonesia yang dipilih menjaga tindakan dan sasarannya tanpa menimbulkan kesan abu bertindak sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah 'najis' dan 'menguduskan' dipertahankan karena sesuai dengan konteks ritual. Ayat dibiarkan berakhir dengan koma karena kalimat bersyaratnya diselesaikan dalam ayat 14.
