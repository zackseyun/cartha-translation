    text: Ini mengacu pada upacara penahiran dengan abu lembu betina muda dalam Bilangan 19.
    reason: cross_reference
  revision_rationale: Revisi mempertahankan struktur bersyarat yang berlanjut ke ayat 14, tindakan pemercikan dan sasarannya sebagaimana dinyatakan partisip Yunani, serta arah ritual dari frasa penutup. Koma akhir dipertahankan karena apodosis lengkap terdapat pada ayat berikutnya.
