review_pass:
  verdict: revise
  source_fidelity: Draf mengubah partisip aktif ῥαντίζουσα (“yang memerciki/untuk memerciki”) menjadi pasif “yang dipercikkan kepada.” Walaupun hal itu cocok dengan pelaksanaan ritus secara praktis, perubahan tersebut membalik relasi gramatikal abu dan orang yang najis. Frasa πρὸς ... καθαρότητα lebih tepat dinyatakan sebagai tujuan “untuk kemurnian jasmani,” bukan hasil yang diperluas “sehingga menghasilkan.”
  naturalness: “Untuk memerciki” merupakan pengungkapan Indonesia baku dan alami bagi partisip ritual ini, tanpa personifikasi yang janggal. “Kemurnian jasmani” mempertahankan register kultis dan kontras lahiriah tanpa mengesankan makna σάρξ sebagai tabiat berdosa.
  terminology: “Kambing jantan,” “lembu jantan,” “lembu betina muda,” “najis,” dan “menguduskan” sesuai konteks kurban dan kenajisan ritual. Catatan tentang hati nurani dihapus dari catatan ayat ini karena itu merupakan kontras eksplisit ayat berikutnya, bukan penjelasan yang diperlukan untuk makna frasa ini.
  issues:
  - severity: medium
    issue: Suara dan relasi tindakan pada ῥαντίζουσα diubah menjadi pasif.
    rationale: “Yang dipercikkan kepada mereka” menyatakan abu sebagai benda yang menerima tindakan, sedangkan partisip aktif Yunani menyatakan abu sebagai sarana yang memerciki orang-orang najis. “Untuk memerciki” menyampaikan tindakan dan sasarannya dalam bahasa Indonesia yang alami.
  - severity: low
    issue: “Sehingga menghasilkan kebersihan jasmani” memperluas fungsi πρὸς.
    rationale: πρὸς di sini menyatakan arah/tujuan menuju kemurnian jasmani. “Untuk kemurnian jasmani” lebih dekat pada bentuk dan cakupan sumber.
  - severity: low
    issue: Catatan b memasukkan kontras khusus dengan ayat 14.
    rationale: Keterangan itu benar secara konteks, tetapi melampaui penjelasan budaya yang diperlukan bagi ayat ini dan sebaiknya tidak diperlakukan sebagai bagian dari arti eksplisit klausa.
  revised_text: Sebab, jika darah kambing jantan dan lembu jantan, serta abu lembu betina muda untuk memerciki mereka yang telah menjadi najis[a], menguduskan untuk kemurnian jasmani[b][c],
  revised_footnotes:
