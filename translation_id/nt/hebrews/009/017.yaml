base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/017.yaml
  text: For a covenant is valid over dead ones[b][a], since it is never in force while the one who made it is living.
translation:
  language: id
  text: Sebab suatu perjanjian sah atas dasar kematian[a][b], karena perjanjian itu tidak pernah berlaku selama orang yang membuatnya masih hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab surat wasiat baru sah sesudah kematian, karena surat itu tidak pernah berlaku selama pembuatnya masih hidup.” Kata Yunani yang dipakai dapat berarti “perjanjian” ataupun “surat wasiat.”
    reason: alternative_reading
  - marker: b
    text: Ungkapan “atas dasar kematian” menerjemahkan frasa Yunani yang sangat padat dan dapat merujuk kepada orang yang telah mati dalam pengertian surat wasiat atau kepada kematian yang terlibat dalam pengesahan suatu perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: perjanjian
  rationale: Konteks Ibrani 8–10 terutama membahas perjanjian, khususnya perjanjian pertama dan perjanjian baru. Namun, karena kata Yunani ini juga dapat berarti surat wasiat, kemungkinan itu dipertahankan dalam catatan kaki.
- source_word: ἐπὶ νεκροῖς
  choice: atas mereka yang mati
  rationale: Ungkapan Yunani ini singkat dan eliptis. Terjemahan yang sengaja padat ini mempertahankan kemungkinan rujukan kepada orang yang telah mati dalam konteks surat wasiat ataupun kepada kematian yang terkait dengan pengesahan perjanjian.
- source_word: βεβαία
  choice: sah
  rationale: Dalam konteks ini kata tersebut menunjukkan keabsahan atau kekuatan hukum suatu perjanjian, bukan sekadar kepastian abstrak.
- source_word: ἐπεὶ
  choice: karena
  rationale: Kata ini memperkenalkan alasan yang menjelaskan pernyataan sebelumnya.
- source_word: μήποτε
  choice: tidak pernah
  rationale: Dalam konstruksi ini kata tersebut menyatakan bahwa sesuatu tidak berlaku pada waktu mana pun selama keadaan yang disebutkan masih berlangsung.
- source_word: ἰσχύει
  choice: berlaku
  rationale: Pilihan ini secara wajar menyampaikan daya berlaku atau kekuatan efektif secara hukum.
- source_word: ὅτε ζῇ
  choice: selama ... masih hidup
  rationale: Ungkapan ini dengan jelas menyatakan keadaan hidup yang berlangsung dan berlawanan dengan kematian.
- source_word: ὁ διαθέμενος
  choice: orang yang membuatnya
  rationale: Ungkapan netral ini dapat menunjuk kepada pembuat perjanjian maupun pembuat surat wasiat sehingga ambiguitas teks Yunani tetap terjaga.
theological_decisions:
- issue: Apakah διαθήκη harus dipahami sebagai “perjanjian” atau “surat wasiat”.
  choice: Teks utama memakai “perjanjian”, sedangkan kemungkinan “surat wasiat” dicantumkan dalam catatan kaki.
  alternative: Surat wasiat.
  rationale: Konteks luas Ibrani 8–10 didominasi tema perjanjian dan darah pengesahannya, tetapi bahasa Ibrani 9:16–17 juga memungkinkan pemahaman hukum tentang surat wasiat. Terjemahan tidak meniadakan ketegangan ini.
- issue: Seberapa jauh ambiguitas ἐπὶ νεκροῖς perlu dijelaskan dalam teks utama.
  choice: Memakai ungkapan terbuka “atas mereka yang mati”.
  alternative: Sesudah kematian; apabila ada orang yang mati; atas korban-korban yang mati.
  rationale: Frasa Yunani ini padat dan diperdebatkan. Terjemahan utama tidak menetapkan apakah yang dimaksud ialah kematian pembuat surat wasiat atau kematian yang menyertai pengesahan perjanjian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum, sementara ungkapan “atas mereka yang mati” sengaja mempertahankan kepadatan dan ambiguitas teks sumber.
