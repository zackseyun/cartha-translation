translation:
  language: id
  text: sambil berkata, “Inilah darah perjanjian yang telah Allah perintahkan kepada kalian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: katanya
  rationale: Partisipel kini ini memperkenalkan kutipan dan menghubungkannya dengan tindakan pada ayat sebelumnya. Dalam bahasa Indonesia, “katanya” mempertahankan hubungan itu secara alami tanpa membuat kalimat terasa kaku.
- source_word: Τοῦτο
  choice: Inilah
  rationale: Bahasa Yunani tidak memakai kopula secara eksplisit. “Inilah” menyampaikan penunjukan dan predikasi yang tersirat dengan ringkas dan wajar dalam bahasa Indonesia.
- source_word: αἷμα
  choice: darah
  rationale: Padanan langsung yang mempertahankan gambaran konkret darah kurban dalam pengesahan perjanjian.
- source_word: διαθήκης
  choice: perjanjian
  rationale: Dalam konteks yang menggemakan Keluaran 24:8, istilah ini menunjuk pada perjanjian, bukan surat wasiat.
- source_word: ἧς
  choice: yang
  rationale: Pronomina relatif genitif ini merujuk kembali kepada “perjanjian”. Bahasa Indonesia secara alami mengungkapkan hubungan tersebut dengan “yang” tanpa harus menandai kasus genitif secara terpisah.
- source_word: ἐνετείλατο
  choice: telah ... perintahkan
  rationale: Bentuk ἐντέλλομαι berarti memerintahkan atau memberi ketetapan. “Telah ... perintahkan” menyatakan tindakan lampau dalam konteks pengesahan perjanjian.
- source_word: πρὸς ὑμᾶς
  choice: kepadamu
  rationale: πρός dengan akusatif secara langsung dapat berarti “kepada”. “Kepadamu” mempertahankan arah perintah kepada umat dan menghindari penafsiran tambahan yang terkandung dalam “bagimu”.
- source_word: ὁ θεός
  choice: Allah
  rationale: “Allah” adalah padanan baku dan alami untuk θεός dalam bahasa Indonesia.
theological_decisions:
- issue: Makna διαθήκη dalam konteks pengesahan dengan darah
  choice: perjanjian
  alternative: wasiat
  rationale: Ayat ini menggemakan Keluaran 24:8 dan berbicara tentang pengesahan perjanjian Musa. “Wasiat” akan membawa pengertian hukum lain yang tidak sesuai dengan latar langsungnya.
- issue: Kopula yang tersirat sesudah Τοῦτο
  choice: Inilah darah perjanjian
  alternative: Ini, darah perjanjian
  rationale: Predikasi tersirat dalam bahasa Yunani perlu dinyatakan secara alami dalam bahasa Indonesia. “Inilah” membuat kutipan jelas tanpa menambahkan muatan teologis.
- issue: Hubungan πρὸς ὑμᾶς dengan perintah Allah
  choice: yang telah Allah perintahkan kepadamu
  alternative: yang telah Allah perintahkan bagimu
  rationale: “Kepadamu” mempertahankan makna arah yang lazim dari πρός dan ketegangan bentuk Yunani yang agak tidak biasa, tanpa diam-diam mengubahnya menjadi gagasan manfaat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan “yang telah Allah perintahkan kepadamu” sengaja mempertahankan hubungan gramatikal teks Yunani, meskipun ungkapan tersebut sedikit lebih formal daripada percakapan sehari-hari.
