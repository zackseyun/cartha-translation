  text: εἰς δὲ τὴν δευτέραν ἅπαξ τοῦ ἐνιαυτοῦ μόνος ὁ ἀρχιερεύς, οὐ χωρὶς αἵματος, ὃ προσφέρει ὑπὲρ ἑαυτοῦ καὶ τῶν τοῦ λαοῦ ἀγνοημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/007.yaml
  text: But into the second room only the high priest enters once a year[a], and not without blood[b], which he offers for himself and for the people's sins committed in ignorance.
translation:
  language: id
  text: Namun, ke ruang kedua hanya Imam Besar yang masuk sekali setahun[a], dan tidak tanpa darah, yang dipersembahkannya untuk dirinya sendiri dan untuk dosa-dosa umat yang dilakukan karena ketidaktahuan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke bagian kedua” atau “ke kemah kedua”; yang dimaksud ialah bagian dalam Kemah Suci.
    reason: lexical_alternative
  - marker: b
    text: Atau “dosa-dosa umat yang tidak disengaja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν δευτέραν
  choice: Namun, ke ruang kedua
  rationale: Ungkapan Yunani ini eliptis dan mengacu pada bagian kedua Kemah Suci dalam konteks Ibrani 9:2–3. Penambahan 'ruang' menghasilkan bahasa Indonesia yang alami sambil mempertahankan kontras ruang.
- source_word: ἅπαξ τοῦ ἐνιαυτοῦ
  choice: sekali setahun
  rationale: Padanan Indonesia yang idiomatis dan tepat bagi frekuensi tahunan.
- source_word: μόνος ὁ ἀρχιερεύς
  choice: hanya Imam Besar yang masuk
  rationale: Menunjukkan bahwa hak masuk itu terbatas pada Imam Besar saja; kata kerja 'masuk' disediakan dari konteks agar kalimat eliptis Yunani menjadi wajar dalam bahasa Indonesia.
- source_word: οὐ χωρὶς αἵματος
  choice: dan itu pun tidak tanpa darah
  rationale: Mempertahankan litotes teks Yunani serta gambaran pengurbanan yang dinyatakan secara eksplisit oleh kata 'darah'.
- source_word: ὃ προσφέρει
  choice: yang dipersembahkannya
  rationale: Menyampaikan arti kultis προσφέρει secara ringkas dan alami; pronomina relatif mengacu pada darah.
- source_word: ὑπὲρ ἑαυτοῦ
  choice: untuk dirinya sendiri
  rationale: Padanan alami untuk ὑπέρ dalam konteks kurban, tanpa menentukan lebih jauh sifat hubungan perwakilannya.
- source_word: τῶν τοῦ λαοῦ ἀγνοημάτων
  choice: dosa-dosa umat yang dilakukan karena ketidaktahuan
  rationale: Mempertahankan baik unsur pelanggaran maupun ciri ketidaktahuan dalam ἀγνοήματα, tanpa menyempitkannya secara mutlak menjadi sekadar kekeliruan yang tidak disengaja.
theological_decisions:
- issue: Sifat ἀγνοήματα dalam konteks pengurbanan
  choice: dosa-dosa umat yang dilakukan karena ketidaktahuan
  alternative: dosa-dosa umat yang tidak disengaja
  rationale: Pilihan ini mempertahankan kategori moral dan kultis dari istilah tersebut sekaligus membiarkan hubungan antara ketidaktahuan dan ketidaksengajaan tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya yang bermartabat dan mudah dipahami. Sebutan 'Imam Besar' dipertahankan sebagai istilah kultis yang lazim. Struktur kalimat mengikuti kontras Yunani, tetapi unsur 'masuk' disediakan agar alami dalam bahasa Indonesia.
