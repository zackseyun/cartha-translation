  text: ὑπεράνω δὲ αὐτῆς Χερουβὶν δόξης κατασκιάζοντα τὸ ἱλαστήριον· περὶ ὧν οὐκ ἔστιν νῦν λέγειν κατὰ μέρος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/005.yaml
  text: And above it were the cherubim of glory overshadowing the atoning sacrifice[a]; about these things it is not now possible to speak in detail.
translation:
  language: id
  text: Di atasnya terdapat kerub-kerub kemuliaan yang menaungi tutup pendamaian[a]. Tentang semuanya itu, sekarang tidak dapat dibicarakan secara terperinci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional disebut “takhta belas kasihan”, yaitu tutup tabut; istilah Yunaninya juga dapat menyatakan sarana pendamaian atau korban pendamaian.
    reason: Menjelaskan rujukan fisik ἱλαστήριον dalam konteks ini sambil mempertahankan rentang makna teologisnya.
lexical_decisions:
- source_word: ὑπεράνω δὲ αὐτῆς
  choice: Di atasnya
  rationale: Mengungkapkan letak di atas benda yang disebut sebelumnya, yaitu tabut, tanpa mengulang rujukannya secara tidak perlu. δέ dialihkan melalui peralihan kalimat yang alami, bukan dengan kata penghubung tersendiri.
- source_word: Χερουβὶν δόξης
  choice: kerub-kerub kemuliaan
  rationale: Mempertahankan bentuk genitif Yunani yang ringkas dan keterkaitan para kerub dengan kemuliaan ilahi, tanpa mempersempitnya menjadi sekadar 'mulia'.
- source_word: κατασκιάζοντα
  choice: yang menaungi
  rationale: Menggambarkan sayap para kerub yang membentang di atas tutup tabut; 'menaungi' alami dalam bahasa Indonesia dan mempertahankan citra posisi di atasnya.
- source_word: τὸ ἱλαστήριον
  choice: tutup pendamaian
  rationale: Dalam konteks perlengkapan Kemah Suci, kata ini menunjuk secara konkret pada tutup tabut, sekaligus membawa kaitan dengan pendamaian. Pilihan ini mempertahankan kedua unsur tersebut lebih baik daripada ungkapan abstrak 'korban pendamaian'.
- source_word: περὶ ὧν
  choice: hal-hal itu
  rationale: Merujuk secara alami kepada perlengkapan dan rincian Kemah Suci yang baru saja disebutkan.
- source_word: οὐκ ἔστιν νῦν λέγειν κατὰ μέρος
  choice: sekarang tidak dapat dibicarakan secara terperinci
  rationale: Menyampaikan bahwa penulis tidak akan menguraikannya satu per satu pada bagian ini, tanpa memaksakan apakah hal itu benar-benar mustahil atau hanya tidak sesuai dengan tujuan pembahasan sekarang.
theological_decisions:
- issue: Makna ἱλαστήριον dalam konteks tutup tabut
  choice: tutup pendamaian
  alternative: takhta belas kasihan; sarana pendamaian; korban pendamaian
  rationale: Konteks menuntut rujukan kepada benda fisik yang dinaungi kerub-kerub, yakni tutup tabut. Unsur 'pendamaian' mempertahankan fungsi kultis dan bobot teologis istilah itu. Catatan kaki menyimpan sebutan tradisional dan kemungkinan makna teologis lainnya tanpa mengubah benda tersebut menjadi korban dalam teks utama.
- issue: Hubungan genitif pada Χερουβὶν δόξης
  choice: kerub-kerub kemuliaan
  alternative: kerub-kerub yang mulia
  rationale: Bentuk ini membiarkan hubungan dengan kemuliaan tetap terbuka—dapat mencirikan para kerub atau mengaitkan mereka dengan kemuliaan ilahi—daripada menafsirkannya hanya sebagai sifat kemuliaan mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah 'kerub' dipertahankan sebagai istilah alkitabiah yang sudah dikenal. Susunan kalimat dibuat alami, sedangkan ungkapan 'kerub-kerub kemuliaan' sengaja mempertahankan kepadatan dan ambiguitas genitif Yunani.
