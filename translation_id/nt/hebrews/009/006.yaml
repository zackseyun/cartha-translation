id: HEB.9.6
reference: Hebrews 9:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τούτων δὲ οὕτως κατεσκευασμένων, εἰς μὲν τὴν πρώτην σκηνὴν διὰ παντὸς εἰσίασιν οἱ ἱερεῖς τὰς λατρείας ἐπιτελοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/006.yaml
  text: With these things prepared in this way[a], the priests continually enter the first tabernacle, performing the services[b],
translation:
  language: id
  text: Setelah semuanya itu dipersiapkan demikian, para imam senantiasa masuk ke bagian pertama Kemah Suci[a] untuk melaksanakan pelayanan ibadah[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kemah pertama” atau “ruang pertama.” Kata Yunani σκηνή dapat menunjuk pada Kemah Suci itu sendiri atau, dalam konteks ini, bagian pertamanya.
    reason: lexical_alternative
  - marker: b
    text: Atau “melaksanakan tindakan-tindakan ibadah” atau “menjalankan tugas-tugas ritual.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων δὲ οὕτως κατεσκευασμένων
  choice: Setelah semuanya itu dipersiapkan demikian
  rationale: Konstruksi genitivus absolutus menyatakan keadaan yang melatarbelakangi tindakan berikutnya. “Dipersiapkan” mempertahankan cakupan makna κατεσκευασμένων tanpa membatasi artinya pada pembangunan; konteks mencakup penataan Kemah Suci dan perlengkapannya. δὲ berfungsi sebagai peralihan ringan dan tidak perlu diterjemahkan dengan kata penghubung tersendiri.
- source_word: εἰς μὲν τὴν πρώτην σκηνὴν
  choice: masuk ke bagian pertama Kemah Suci
  rationale: Dalam konteks ini, σκηνή menunjuk pada Kemah Suci sekaligus bagian pertamanya. Ungkapan ini mempertahankan latar peribadatan Israel dan menjelaskan bahwa yang dimaksud ialah bagian pertama, tanpa menghapus kemungkinan bentuk harfiah “kemah pertama” atau makna kontekstual “ruang pertama” yang dicatat dalam catatan kaki.
- source_word: διὰ παντὸς
  choice: senantiasa
  rationale: Ungkapan ini menggambarkan kebiasaan pelayanan yang berlangsung terus atau berulang secara tetap, bukan keberadaan tanpa henti setiap saat. “Senantiasa” mempertahankan kontras dengan akses terbatas imam besar pada ayat berikutnya.
- source_word: εἰσίασιν
  choice: masuk
  rationale: Bentuk kini indikatif menyatakan tindakan yang biasa dan berulang. Bentuk “masuk” terdengar alami dalam bahasa Indonesia.
- source_word: οἱ ἱερεῖς
  choice: para imam
  rationale: Bentuk jamak dengan artikel menunjuk kepada imam-imam biasa, yang kemudian dikontraskan dengan imam besar pada ayat 7.
- source_word: τὰς λατρείας
  choice: pelayanan ibadah
  rationale: Bentuk jamak λατρείας merujuk pada berbagai tugas atau tindakan ibadah ritual di tempat kudus. “Pelayanan ibadah” menyampaikan dimensi pelayanan dan penyembahan tanpa menyamakannya dengan acara kebaktian modern.
- source_word: ἐπιτελοῦντες
  choice: untuk melaksanakan
  rationale: Partisipel ini menerangkan kegiatan para imam ketika mereka masuk. Dalam bahasa Indonesia, konstruksi tujuan “untuk melaksanakan” mengalir alami dan sesuai dengan pelaksanaan tugas yang ditetapkan.
theological_decisions:
- issue: Makna σκηνή dalam konteks tempat kudus
  choice: bagian pertama Kemah Suci
  alternative: kemah pertama; ruang pertama
  rationale: Ibrani 9 membahas tempat kudus Musa beserta dua bagiannya. Pilihan utama mempertahankan identitasnya sebagai Kemah Suci sekaligus membuat rujukan kepada bagian pertama dapat dipahami, sedangkan alternatif leksikal tetap dicatat.
- issue: Daya ungkap διὰ παντὸς dalam pelayanan para imam
  choice: senantiasa
  alternative: terus-menerus; secara teratur
  rationale: Yang dimaksud ialah akses dan pelayanan yang berlangsung secara lazim dan berulang, berlawanan dengan masuknya imam besar hanya sekali setahun ke bagian kedua. Pilihan ini tidak dimaksudkan sebagai kehadiran fisik tanpa jeda.
- issue: Makna λατρείας sebagai kegiatan kultis
  choice: pelayanan ibadah
  alternative: tindakan-tindakan ibadah; tugas-tugas ritual
  rationale: Pilihan ini mempertahankan hubungan antara pelayanan imamat dan ibadah kepada Allah tanpa memasukkan istilah teknis denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. “Kemah Suci” dipakai sebagai istilah kontekstual yang dikenal luas, dan “pelayanan ibadah” dipilih untuk menghindari kesan bahwa yang dimaksud ialah kebaktian gerejawi modern. Tanda koma di akhir dipertahankan karena struktur kalimat berlanjut ke ayat berikutnya.
