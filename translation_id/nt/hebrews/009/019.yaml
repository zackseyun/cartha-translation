id: HEB.9.19
reference: Hebrews 9:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λαληθείσης γὰρ πάσης ἐντολῆς κατὰ ⸀τὸν νόμον ὑπὸ Μωϋσέως παντὶ τῷ λαῷ, λαβὼν τὸ αἷμα τῶν ⸀μόσχων μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν ἐράντισεν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/019.yaml
  text: For when every commandment according to the law had been spoken by Moses to all the people[a], he took the blood of the calves with water and scarlet wool and hyssop, and sprinkled both the scroll itself and all the people,
translation:
  language: id
  text: Sebab, setelah Musa menyampaikan setiap perintah menurut hukum Taurat kepada seluruh umat, ia mengambil darah anak lembu[a] bersama air, wol merah kirmizi, dan hisop, lalu memerciki baik gulungan kitab itu sendiri maupun seluruh umat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lembu-lembu jantan muda.” Kata Yunani ini dapat merujuk pada anak lembu atau lembu jantan muda dalam konteks kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαληθείσης γὰρ πάσης ἐντολῆς
  choice: Sebab setelah setiap perintah ... disampaikan
  rationale: Genitif absolut diterjemahkan sebagai anak kalimat waktu. Bentuk pasif dan daya distributif πάσης tetap dipertahankan, sedangkan γάρ diterjemahkan “sebab” untuk menunjukkan hubungan penjelasan dengan konteks.
- source_word: κατὰ τὸν νόμον
  choice: menurut hukum Taurat
  rationale: Kata κατά dengan akusatif menyatakan kesesuaian atau tolok ukur. “Hukum Taurat” merupakan padanan Indonesia yang wajar untuk νόμος dalam konteks hukum perjanjian Musa.
- source_word: ὑπὸ Μωϋσέως παντὶ τῷ λαῷ
  choice: oleh Musa kepada seluruh umat
  rationale: Hubungan pelaku dan penerima dipertahankan dengan jelas. “Seluruh umat” menyampaikan totalitas παντί dan cocok bagi umat Israel sebagai satu komunitas.
- source_word: λαβὼν τὸ αἷμα τῶν μόσχων
  choice: ia mengambil darah anak-anak lembu
  rationale: Partisip aoris dialihkan menjadi verba berurutan yang alami dalam narasi Indonesia. μόσχων dapat berarti anak lembu atau lembu jantan muda; pilihan utama mempertahankan padanan langsung dan alternatif dicatat dalam catatan kaki.
- source_word: μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου
  choice: bersama dengan air, bulu domba merah kirmizi, dan hisop
  rationale: μετά menyatakan penyertaan tanpa harus menegaskan bahwa semua unsur dicampurkan. ἔριον diterjemahkan eksplisit sebagai bulu domba, κοκκίνου sebagai warna merah kirmizi, dan ὕσσωπος dengan istilah baku “hisop”.
- source_word: αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν
  choice: baik gulungan kitab itu sendiri maupun seluruh umat
  rationale: Pasangan τε ... καί diterjemahkan “baik ... maupun ...”, sementara αὐτό mempertahankan penekanan melalui “itu sendiri”. “Gulungan kitab” mencerminkan bentuk dokumen tertulis kuno dalam konteks ini.
- source_word: ἐράντισεν
  choice: memerciki
  rationale: Kata ini menunjuk tindakan ritual memercikkan cairan. “Memerciki” akurat, mudah dipahami, dan tidak terlalu teknis.
theological_decisions:
- issue: Hubungan uraian ini dengan kisah Keluaran 24
  choice: Menerjemahkan rincian yang terdapat dalam teks Yunani tanpa menyelaraskannya dengan atau menambahkan penjelasan dari kisah Keluaran.
  alternative: Memperluas atau menyesuaikan ungkapan agar rincian ritualnya sama secara eksplisit dengan Keluaran 24.
  rationale: Ibrani menyajikan ringkasan ritual dengan susunan dan rincian tersendiri. Terjemahan membiarkan rumusan penulis berdiri sebagaimana adanya dan tidak menghapus ketegangan antarteks.
- issue: Makna μόσχων dalam konteks kurban
  choice: anak-anak lembu
  alternative: lembu-lembu jantan muda
  rationale: Kedua arti dimungkinkan secara leksikal. Teks utama memakai padanan yang lebih langsung dan umum, sedangkan alternatif yang relevan bagi konteks kurban dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa menjadi teknis. Struktur kalimat mengikuti urutan wacana Yunani, tetapi partisip utama dijadikan rangkaian verba yang alami. Istilah “umat”, “hukum Taurat”, “gulungan kitab”, dan “hisop” dipilih untuk kejelasan konteks Alkitabiah bagi pembaca umum.
