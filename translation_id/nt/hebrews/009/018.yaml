  text: Therefore not even the first covenant was inaugurated without blood[a].
translation:
  language: id
  text: Karena itu, perjanjian yang pertama pun tidak diresmikan tanpa darah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang pertama”—yaitu, perjanjian yang pertama. Kata benda itu tersirat dalam teks Yunani; sebagian terjemahan menerjemahkannya sebagai “wasiat yang pertama.”
    reason: Menjelaskan nomina yang tersirat dan mempertahankan kemungkinan terjemahan formal yang muncul dari konteks sebelumnya.
lexical_decisions:
- source_word: ὅθεν
  choice: Karena itu
  rationale: Menandai kesimpulan dari uraian sebelumnya mengenai perjanjian dan perlunya kematian; frasa ini alami dalam bahasa Indonesia modern.
- source_word: οὐδὲ
  choice: pun tidak
  rationale: Menyampaikan penegasan bahwa prinsip tersebut berlaku bahkan pada perjanjian yang pertama.
- source_word: ἡ πρώτη
  choice: perjanjian yang pertama
  rationale: Nomina tidak dinyatakan dalam bahasa Yunani, tetapi adjektiva feminin ini merujuk secara anaforis kepada perjanjian dalam konteks. Menambahkan 'perjanjian' memberi kejelasan tanpa memasukkan gagasan baru.
- source_word: χωρὶς αἵματος
  choice: tanpa darah
  rationale: Ungkapan Indonesia yang langsung dan wajar, serta mempertahankan hubungan dengan ritus pengorbanan dan perjanjian.
- source_word: ἐγκεκαίνισται
  choice: diresmikan
  rationale: Mengungkapkan tindakan memulai atau memberlakukan perjanjian secara resmi. Bentuk pasif dipertahankan; kala lampau dipahami dari konteks bahasa Indonesia.
theological_decisions:
- issue: Acuan ungkapan 'yang pertama'
  choice: perjanjian yang pertama
  alternative: yang pertama; wasiat yang pertama; tata ibadah pertama
  rationale: Konteks langsung dan keseluruhan Ibrani 9 membahas perjanjian pertama, khususnya pemberlakuannya dengan darah dalam Keluaran 24. 'Wasiat' mungkin terkait permainan makna pada ayat-ayat sebelumnya, tetapi kurang tepat bagi peristiwa yang disinggung dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Diresmikan' dipilih sebagai padanan yang mudah dipahami untuk tindakan mengawali atau memberlakukan perjanjian secara seremonial, tanpa membatasinya hanya pada pengesahan hukum.
