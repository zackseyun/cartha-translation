  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐδὲ δι’ αἵματος τράγων καὶ μόσχων διὰ δὲ τοῦ ἰδίου αἵματος, εἰσῆλθεν ἐφάπαξ εἰς τὰ ἅγια, αἰωνίαν λύτρωσιν εὑράμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/012.yaml
  text: and not through the blood of goats and calves[a], but through his own blood, he entered once for all into the holy places, having obtained eternal redemption.
translation:
  language: id
  text: dan bukan melalui darah kambing jantan dan anak lembu, melainkan melalui darah-Nya sendiri, Ia masuk satu kali untuk selamanya ke tempat-tempat kudus[a], dengan memperoleh penebusan yang kekal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke tempat kudus.” Teks Yunani secara harfiah berbentuk jamak, “ke tempat-tempat kudus.” Sebagian terjemahan memakai “ke Tempat Mahakudus,” tetapi ungkapan Yunani di sini tidak secara eksplisit mengharuskan pengertian yang lebih khusus itu.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: dan bukan
  rationale: Melanjutkan uraian dan sekaligus meniadakan sarana yang disebut berikutnya; bentuk ini mempertahankan daya penghubung οὐδέ.
- source_word: δι’ αἵματος τράγων καὶ μόσχων
  choice: melalui darah kambing jantan dan anak-anak sapi
  rationale: διά dengan genitif menyatakan sarana; 'melalui' juga memungkinkan pengulangan yang sejajar dengan frasa kontras berikutnya. τράγων menunjuk kambing jantan, sedangkan μόσχων menunjuk anak sapi.
- source_word: διὰ δὲ τοῦ ἰδίου αἵματος
  choice: melainkan melalui darah-Nya sendiri
  rationale: '''Melainkan'' menyatakan kontras kuat δέ setelah penyangkalan, sementara pengulangan ''melalui'' mempertahankan kesejajaran διά. ''Sendiri'' membawa penekanan kepunyaan dari ἰδίου.'
- source_word: εἰσῆλθεν
  choice: Ia masuk
  rationale: Aoristus indikatif menyatakan tindakan masuk yang telah terjadi; ungkapan ini alami dalam citra ruang kudus.
- source_word: ἐφάπαξ
  choice: satu kali untuk selama-lamanya
  rationale: Menyampaikan satu tindakan tunggal, tuntas, dan tidak perlu diulangi, sebagaimana kekuatan istilah ini dalam Surat Ibrani.
- source_word: εἰς τὰ ἅγια
  choice: ke tempat-tempat kudus
  rationale: Mempertahankan bentuk jamak Yunani dan corak peribadatan, tanpa mempersempitnya secara interpretatif menjadi 'Tempat Mahakudus'.
- source_word: αἰωνίαν λύτρωσιν
  choice: penebusan yang kekal
  rationale: Menyatakan penebusan yang berlaku tetap dan tidak berakhir; bentuk dengan 'yang' terdengar alami dan jelas dalam bahasa Indonesia.
- source_word: εὑράμενος
  choice: dengan memperoleh
  rationale: Dalam konteks ini εὑρίσκω bermakna idiomatis 'memperoleh', bukan sekadar 'menemukan'. Bentuk ini mempertahankan hubungan partisipial tanpa secara tegas menentukan apakah nuansanya terutama temporal atau akibat.
theological_decisions:
- issue: Makna masuk melalui darah-Nya sendiri
  choice: Diterjemahkan bahwa Kristus masuk melalui darah-Nya sendiri, berlawanan dengan darah hewan, tanpa menjelaskan mekanisme korban lebih jauh daripada teks Yunani.
  alternative: Ia masuk sambil secara harfiah membawa atau mempersembahkan darah-Nya; atau Ia masuk hanya sesudah darah-Nya dicurahkan.
  rationale: Pengulangan διά dengan genitif paling baik dicerminkan secara konsisten sebagai sarana dengan kata 'melalui'. Ini mempertahankan kontras tipologis tanpa memaksakan gambaran spasial atau urutan mekanis tertentu.
- issue: Cakupan τὰ ἅγια
  choice: tempat-tempat kudus
  alternative: tempat kudus; tempat ibadah; Tempat Mahakudus
  rationale: Ungkapan Yunani berbentuk jamak dan dapat menjadi sebutan kultis bagi tempat kudus. Terjemahan jamak menjaga bentuk sumber serta tidak menyelesaikan secara prematur apakah yang dimaksud khususnya Tempat Mahakudus.
- issue: Hubungan εὑράμενος dengan tindakan masuk
  choice: dengan memperoleh penebusan yang kekal
  alternative: setelah memperoleh; dan dengan demikian memperoleh
  rationale: Partisipel aoristus dapat mengandung hubungan temporal atau sirkumstansial yang tidak perlu dipersempit. Terjemahan ini mempertahankan keterkaitannya dengan tindakan utama tanpa menetapkan urutan atau akibat secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada 'Ia' dan akhiran '-Nya' mengikuti kebiasaan hormat yang lazim untuk rujukan kepada Kristus. Penanda catatan kaki ditempatkan sesudah frasa yang diterangkannya.
