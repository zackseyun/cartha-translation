id: HEB.11.4
reference: Hebrews 11:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν τῷ θεῷ, δι’ ἧς ἐμαρτυρήθη εἶναι δίκαιος, μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ ⸂τοῦ θεοῦ⸃, καὶ δι’ αὐτῆς ἀποθανὼν ἔτι ⸀λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/004.yaml
  text: By faith Abel offered to God a better sacrifice than Cain[a], through which he was attested as righteous, God testifying concerning his gifts; and through it, though he died[d][c][b], he still speaks.
translation:
  language: id
  text: Dengan iman, Habel mempersembahkan kepada Allah kurban yang lebih baik daripada kurban Kain[a]. Melalui kurban itu ia mendapat kesaksian bahwa ia orang benar, ketika Allah memberi kesaksian tentang persembahan-persembahannya. Dan melalui hal itu[b], meskipun telah mati, ia masih berbicara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban yang lebih besar daripada kurban Kain”. Bentuk perbandingan Yunani dapat menekankan mutu atau besarnya jumlah.
    reason: lexical_alternative
  - marker: b
    text: Frasa “melalui hal itu” dapat merujuk kepada iman Habel atau kepada kurbannya; bahasa Yunani tidak sepenuhnya tegas.
    reason: alternative_reading
lexical_decisions:
- source_word: Πίστει
  choice: Karena iman
  rationale: Datif menyatakan sarana atau dasar tindakan. 'Karena iman' alami dalam bahasa Indonesia dan mempertahankan iman sebagai tema utama Ibrani 11.
- source_word: πλείονα θυσίαν
  choice: kurban yang lebih baik
  rationale: πλείων dapat menunjuk pada mutu atau besarnya jumlah. Dalam konteks perbandingan persembahan, 'lebih baik' paling alami, sementara kemungkinan 'lebih besar' dicatat dalam catatan kaki.
- source_word: παρὰ Κάϊν
  choice: daripada kurban Kain
  rationale: παρά sesudah bentuk komparatif menandai tolok ukur perbandingan. Pengulangan 'kurban' menghindari kesan bahwa Habel mempersembahkan kurban yang lebih baik daripada pribadi Kain.
- source_word: προσήνεγκεν τῷ θεῷ
  choice: mempersembahkan kepada Allah
  rationale: προσφέρω merupakan verba kultis yang secara wajar diterjemahkan 'mempersembahkan' dalam konteks kurban.
- source_word: δι’ ἧς
  choice: Melalui kurban itu
  rationale: Pronomina relatif feminin secara gramatikal paling langsung merujuk kepada θυσίαν, 'kurban'. Penyebutan nomina kembali membuat hubungan ini jelas dan alami dalam bahasa Indonesia.
- source_word: ἐμαρτυρήθη εἶναι δίκαιος
  choice: ia dinyatakan sebagai orang benar
  rationale: Bentuk pasif μαρτυρέω menyatakan bahwa Habel menerima kesaksian mengenai dirinya. 'Dinyatakan sebagai orang benar' lebih alami daripada kalk harfiah, sedangkan unsur kesaksian tetap hadir secara eksplisit pada klausa berikutnya.
- source_word: μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ τοῦ θεοῦ
  choice: ketika Allah memberi kesaksian tentang persembahan-persembahannya
  rationale: Genitif absolut dialihkan menjadi klausa keadaan. 'Memberi kesaksian tentang' mempertahankan motif μαρτυρέω, dan 'persembahan-persembahan' sesuai dengan konteks kultis bentuk jamak δῶρα.
- source_word: δι’ αὐτῆς
  choice: melalui hal itu
  rationale: Pronomina feminin dapat merujuk kepada iman atau kurban. 'Hal itu' mempertahankan ketidakjelasan rujukannya sejauh mungkin dalam bahasa Indonesia.
- source_word: ἀποθανὼν
  choice: meskipun sudah mati
  rationale: Partisip aoris mendahului tindakan 'masih berbicara' dan secara kontekstual memiliki nuansa konsesif.
- source_word: ἔτι λαλεῖ
  choice: ia masih berbicara
  rationale: Bentuk kini dengan ἔτι menyatakan dampak atau suara yang terus berlangsung.
theological_decisions:
- issue: Rujukan δι’ αὐτῆς pada klausa terakhir
  choice: Dibiarkan tidak spesifik sebagai 'melalui hal itu'
  alternative: melalui imannya; melalui kurban itu
  rationale: Bentuk feminin dapat menunjuk kepada πίστις, 'iman', yang membingkai ayat, atau θυσία, 'kurban', sebagai anteseden feminin yang dekat. Teks utama tidak memutuskan ambiguitas yang sungguh ada.
- issue: Daya makna ἐμαρτυρήθη
  choice: ia dinyatakan sebagai orang benar
  alternative: ia menerima kesaksian bahwa ia benar; ia diakui sebagai orang benar
  rationale: Pilihan utama menghasilkan bahasa Indonesia yang alami tanpa mengubah isi kesaksian ilahi. Motif kesaksian dipertahankan secara eksplisit dalam klausa 'Allah memberi kesaksian'.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Kurban' dipakai untuk θυσία, sedangkan 'persembahan-persembahan' untuk δῶρα agar perbedaan leksikal tetap terlihat. Struktur dipecah menjadi tiga kalimat agar mudah dipahami tanpa menghilangkan hubungan logis teks Yunani.
