review_pass:
  verdict: revise
  source_fidelity: ‘Karena iman’ makes faith primarily the cause or reason, whereas Πίστει is a dative of means; ‘Dengan iman’ more directly retains the instrumental force. ‘Ia dinyatakan sebagai orang benar’ can be understood as a declaration, but it weakens the explicit passive witness/testimony sense of ἐμαρτυρήθη. The final ‘melalui hal itu’ appropriately retains the unresolved feminine-pronoun reference.
  naturalness: The draft is generally clear and uses a suitable modern-standard, dignified register. ‘Dengan iman’ is both more source-precise and idiomatic in this programmatic Hebrews 11 construction. ‘Ia mendapat kesaksian bahwa ia orang benar’ is natural enough and preserves the repeated testimony motif alongside the following clause.
  terminology: ‘Kurban’ for θυσία and ‘persembahan-persembahannya’ for δῶρα appropriately retain the lexical distinction. ‘Orang benar’ is an established and natural rendering of δίκαιος. The revised wording retains ‘kesaksian’ for both occurrences of μαρτυρέω.
  issues:
  - severity: medium
    issue: Instrumental Πίστει is rendered causally as ‘Karena iman’.
    rationale: The Greek dative presents faith as the means by which Abel offered; ‘Dengan iman’ preserves this without materially changing the natural Indonesian style.
  - severity: medium
    issue: The witness sense of ἐμαρτυρήθη is reduced in ‘ia dinyatakan sebagai orang benar’.
    rationale: The verse deliberately repeats μαρτυρέω language. Rendering the first clause with ‘mendapat kesaksian’ preserves the thematic and lexical connection without using an unnatural calque.
  revised_text: Dengan iman, Habel mempersembahkan kepada Allah kurban yang lebih baik daripada kurban Kain[a]. Melalui kurban itu ia mendapat kesaksian bahwa ia orang benar, ketika Allah memberi kesaksian tentang persembahan-persembahannya. Dan melalui hal itu[b], meskipun telah mati, ia masih berbicara.
  revised_footnotes:
