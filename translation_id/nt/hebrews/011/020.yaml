  text: Πίστει ⸀καὶ περὶ μελλόντων εὐλόγησεν Ἰσαὰκ τὸν Ἰακὼβ καὶ τὸν Ἠσαῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/020.yaml
  text: By faith Isaac blessed Jacob and Esau, even concerning things to come.
translation:
  language: id
  text: Dengan iman, Ishak memberkati Yakub dan Esau, bahkan berkenaan dengan hal-hal yang akan datang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: Karena iman
  rationale: Dativus instrumental ini menyatakan dasar atau sarana tindakan Ishak; frasa ini juga mempertahankan pola berulang dalam Ibrani 11.
- source_word: καὶ περὶ μελλόντων
  choice: mengenai hal-hal yang akan datang
  rationale: περὶ berarti 'mengenai/tentang', sedangkan bentuk partisipial μελλόντων menunjuk kepada hal-hal yang masih akan terjadi. καὶ di sini bersifat penegas dalam susunan Yunani dan tidak perlu diterjemahkan dengan kata tersendiri karena penekanan itu sudah alami dalam keseluruhan kalimat Indonesia.
- source_word: εὐλόγησεν
  choice: memberkati
  rationale: Menerjemahkan verba aoristus secara langsung sebagai tindakan berkat yang dilakukan Ishak.
- source_word: τὸν Ἰακὼβ καὶ τὸν Ἠσαῦ
  choice: Yakub dan Esau
  rationale: Kedua objek dipertahankan dengan urutan teks Yunani; artikel akusatif tidak memerlukan padanan eksplisit dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat berkat tentang masa depan
  choice: mengenai hal-hal yang akan datang
  alternative: bahkan mengenai hal-hal yang akan datang
  rationale: Terjemahan ini mempertahankan cakupan umum bentuk netral jamak μελλόντων dan tidak mempersempitnya menjadi janji, nubuat, atau peristiwa tertentu. Partikel καὶ dapat berfungsi sebagai penegas, tetapi dalam bahasa Indonesia penambahan 'bahkan' terasa lebih menandai kontras daripada yang diwajibkan konteks.
translation_notes:
  register: Bahasa Indonesia baku, alami, ringkas, dan bermartabat. Struktur pembuka 'Karena iman' dipilih agar mudah dipahami sekaligus konsisten dengan rangkaian contoh iman dalam pasal ini.
