lexical_decisions:
- source_word: πρὸς ὃν
  choice: kepadanya
  rationale: Gabungan πρὸς dengan pronomina relatif menunjuk kepada Abraham sebagai orang yang menerima perkataan itu; bentuk ini alami dan tetap dekat dengan susunan Yunani.
- source_word: ἐλαλήθη
  choice: telah dikatakan
  rationale: Aoristus pasif λαλέω dipertahankan sebagai bentuk pasif tanpa menambahkan pelaku yang tidak disebutkan dalam teks.
- source_word: ὅτι
  choice: tanda kutip langsung
  rationale: ὅτι memperkenalkan isi perkataan; dalam bahasa Indonesia, fungsi itu dinyatakan secara alami dengan kutipan langsung tanpa perlu menerjemahkannya sebagai 'bahwa'.
- source_word: Ἐν Ἰσαὰκ
  choice: Melalui Ishaklah
  rationale: Dalam konteks kutipan Kejadian 21:12, ἐν menunjukkan garis keturunan yang berlangsung melalui Ishak. Partikel -lah menandai fokus pada Ishak tanpa menambah gagasan baru.
- source_word: κληθήσεταί
  choice: akan disebut
  rationale: Bentuk futur pasif καλέω diterjemahkan secara langsung dan mempertahankan kemungkinan makna penamaan atau penetapan.
- source_word: σοι
  choice: -mu
  rationale: Dativum ini secara idiomatis menyatakan hubungan dengan Abraham dan paling alami digabungkan dengan 'keturunan' sebagai 'keturunanmu'.
- source_word: σπέρμα
  choice: keturunan
  rationale: '''Keturunan'' alami dalam bahasa Indonesia dan dapat mempertahankan nilai kolektif σπέρμα tanpa membatasi rujukannya pada satu atau banyak orang.'
theological_decisions:
- issue: Makna garis keturunan dalam kutipan janji kepada Abraham
  choice: “Melalui Ishaklah keturunanmu akan disebut.”
  alternative: “Di dalam Ishak benihmu akan disebut.”
  rationale: Pilihan utama menyampaikan bahwa garis keturunan yang dijanjikan ditetapkan melalui Ishak, tetapi tetap memakai bentuk pasif 'akan disebut' agar ketegangan leksikal dan teologis kata καλέω tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Keturunan' dipilih daripada 'benih' dalam teks utama demi kejelasan bagi pembaca umum; bentuk yang lebih harfiah dicatat dalam catatan kaki.
