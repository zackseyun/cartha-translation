  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Κατὰ πίστιν ἀπέθανον οὗτοι πάντες, μὴ ⸀λαβόντες τὰς ἐπαγγελίας, ἀλλὰ πόρρωθεν αὐτὰς ἰδόντες καὶ ἀσπασάμενοι, καὶ ὁμολογήσαντες ὅτι ξένοι καὶ παρεπίδημοί εἰσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/013.yaml
  text: All these died in faith[a], not having received the promises, but having seen them from afar and greeted them[c][b], and having confessed that they are strangers and exiles on the earth.
translation:
  language: id
  text: Semua orang ini mati dalam iman tanpa menerima janji-janji itu. Namun, mereka telah melihatnya dari jauh dan menyambutnya[a], serta mengakui bahwa mereka adalah orang asing dan perantau[b] di bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyapanya” atau “memeluknya.” Kata Yunani ini dapat berarti menyapa atau menyambut dan di sini dipakai secara kiasan tentang janji-janji yang terlihat dari jauh.
    reason: lexical_alternative
  - marker: b
    text: Atau “penghuni sementara” atau “orang asing yang menetap sementara.” Istilah Yunani ini menggambarkan orang yang tinggal di suatu tempat tanpa menjadi warga yang menetap atau memiliki tempat itu sepenuhnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ πίστιν
  choice: Dalam iman
  rationale: Mempertahankan nuansa hidup dan mati dalam lingkup atau sikap iman; lebih sesuai di sini daripada menjadikan iman semata-mata alat suatu tindakan.
- source_word: μὴ λαβόντες τὰς ἐπαγγελίας
  choice: tanpa menerima apa yang dijanjikan
  rationale: Ungkapan ini alami dalam bahasa Indonesia. Walaupun bentuk Yunani memakai kata benda jamak 'janji-janji', konteks menunjuk pada isi janji yang belum mereka peroleh.
- source_word: πόρρωθεν αὐτὰς ἰδόντες
  choice: mereka telah melihatnya dari jauh
  rationale: Menjaga gambaran spasial-metaforis tentang memandang penggenapan yang masih jauh.
- source_word: ἀσπασάμενοι
  choice: menyambutnya
  rationale: Kata Yunani dapat berarti menyapa atau menyambut. Dengan janji sebagai objek, 'menyambut' menyampaikan penerimaan positif tanpa memperluasnya menjadi 'memeluk'.
- source_word: ὁμολογήσαντες
  choice: mengakui
  rationale: Menyampaikan pengakuan terbuka dengan bahasa Indonesia yang wajar; 'mengaku' berpotensi terdengar seperti pengakuan kesalahan.
- source_word: ξένοι καὶ παρεπίδημοί
  choice: orang asing dan pendatang
  rationale: 'Mempertahankan dua istilah yang berdekatan tetapi berbeda: mereka bukan warga yang sungguh memiliki tempat itu dan hanya tinggal di sana tanpa keterikatan menetap penuh.'
- source_word: ἐπὶ τῆς γῆς
  choice: di bumi
  rationale: Konteksnya melampaui suatu wilayah tertentu dan menggambarkan keadaan mereka dalam kehidupan di dunia.
theological_decisions:
- issue: Nuansa πίστις dalam Κατὰ πίστιν
  choice: Dalam iman
  alternative: Karena iman; sesuai dengan iman
  rationale: Terjemahan ini mempertahankan iman sebagai sikap atau ranah ketekunan mereka sampai mati, tanpa menutup kemungkinan nuansa kesesuaian dengan iman.
- issue: Objek jamak τὰς ἐπαγγελίας
  choice: apa yang dijanjikan
  alternative: janji-janji itu
  rationale: Bahasa Indonesia idiomatis sering membedakan antara menerima sebuah janji dan menerima penggenapannya. Pilihan ini menyatakan bahwa yang belum diperoleh ialah hal-hal yang dijanjikan, tetapi bentuk jamak Yunani dicatat dalam dokumentasi.
- issue: Status ξένοι καὶ παρεπίδημοί
  choice: orang asing dan pendatang
  alternative: orang asing dan perantau; orang asing dan penghuni sementara
  rationale: Tidak memakai 'orang buangan', sebab παρεπίδημος tidak dengan sendirinya menyatakan pengusiran. 'Pendatang' menjaga gagasan tinggal tanpa kepemilikan atau keterikatan penuh.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. Struktur partisipial Yunani diubah menjadi beberapa klausa agar mudah dipahami, sementara urutan melihat, menyambut, dan mengakui tetap dipertahankan. Semua penanda catatan kaki muncul dalam teks utama.
