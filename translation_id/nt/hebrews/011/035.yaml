  source_fidelity: 'Makna pokok tersampaikan, tetapi "orang-orang mereka yang telah mati" tidak idiomatis dan dapat menyiratkan kepemilikan yang janggal. τοὺς νεκροὺς αὐτῶν lebih alami diterjemahkan "orang-orang mati mereka" dalam bentuk yang diperhalus menjadi "orang-orang yang mati dari antara mereka" atau, dalam konteks ini, "orang-orang mereka yang telah meninggal." Selain itu, "melalui kebangkitan" dapat dipahami sebagai proses, sedangkan ἐξ ἀναστάσεως lebih baik dinyatakan sebagai hasil/sumber: "karena dibangkitkan".'
