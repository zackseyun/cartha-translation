  text: ἔλαβον γυναῖκες ἐξ ἀναστάσεως τοὺς νεκροὺς αὐτῶν· ἄλλοι δὲ ἐτυμπανίσθησαν, οὐ προσδεξάμενοι τὴν ἀπολύτρωσιν, ἵνα κρείττονος ἀναστάσεως τύχωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/035.yaml
  text: Women received back their dead by resurrection[a]; but others were tortured, not accepting release[c][b], so that they might obtain a better resurrection.
translation:
  language: id
  text: Para perempuan menerima kembali orang-orang mereka yang telah meninggal karena dibangkitkan; tetapi orang lain disiksa[a] karena tidak mau menerima pembebasan[b], supaya mereka memperoleh kebangkitan yang lebih baik[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '"Disiksa" menerjemahkan kata kerja yang menggambarkan siksaan jasmani berat, mungkin pemukulan pada alat semacam bingkai atau tambur; cara persisnya tidak diketahui.'
    reason: cultural_note
  - marker: b
    text: Atau "pelepasan". Kata Yunani di sini mengacu pada pembebasan dari siksaan atau kematian, bukan selalu pada penebusan dalam arti keselamatan.
    reason: lexical_alternative
  - marker: c
    text: '"Kebangkitan yang lebih baik" dikontraskan dengan pemulihan orang mati kepada kehidupan fana dalam klausa sebelumnya; di sini ungkapan itu menunjuk pada harapan kebangkitan yang lebih unggul sesudah kematian.'
    reason: cross_reference
lexical_decisions:
- source_word: ἔλαβον
  choice: menerima kembali
  rationale: Dalam konteks orang-orang mereka yang telah mati dan kebangkitan, verba ini menyatakan bahwa mereka menerima kembali orang yang sebelumnya telah meninggal.
- source_word: γυναῖκες
  choice: perempuan-perempuan
  rationale: Bentuk jamak ini menunjuk kepada perempuan secara umum, bukan secara khusus kepada istri.
- source_word: ἐξ ἀναστάσεως
  choice: melalui kebangkitan
  rationale: Frasa ini menyatakan sarana atau sumber pemulihan orang mati; 'melalui kebangkitan' alami dalam bahasa Indonesia dan tetap dekat dengan konstruksi Yunani.
- source_word: τοὺς νεκροὺς αὐτῶν
  choice: orang-orang mereka yang telah mati
  rationale: Ungkapan ini menunjuk kepada orang-orang dekat mereka yang telah meninggal. Bentuk ini lebih jelas dan alami daripada terjemahan harfiah 'orang-orang mati mereka'.
- source_word: ἄλλοι δὲ
  choice: tetapi orang-orang lain
  rationale: δέ menandai peralihan yang kontras dari orang yang mengalami pemulihan kepada orang yang tetap menderita.
- source_word: ἐτυμπανίσθησαν
  choice: disiksa
  rationale: Verba ini menyatakan siksaan jasmani berat, mungkin berkaitan dengan pemukulan pada suatu alat, tetapi cara persisnya tidak pasti sehingga tidak diperinci dalam teks utama.
- source_word: οὐ προσδεξάμενοι
  choice: tidak mau menerima
  rationale: Partisip ini menyatakan penolakan sadar terhadap pembebasan yang ditawarkan; 'tidak mau menerima' mengungkapkan unsur kehendak itu secara alami.
- source_word: τὴν ἀπολύτρωσιν
  choice: pembebasan
  rationale: Dalam konteks ini kata tersebut merujuk pada pelepasan dari siksaan atau kematian, bukan secara khusus pada penebusan dalam arti keselamatan.
- source_word: ἵνα
  choice: supaya
  rationale: Konjungsi ini memperkenalkan tujuan penolakan mereka.
- source_word: κρείττονος ἀναστάσεως
  choice: kebangkitan yang lebih baik
  rationale: κρείττων secara konsisten membawa gagasan 'lebih baik' dalam Ibrani, dan di sini membentuk kontras dengan pemulihan kepada hidup fana pada klausa sebelumnya.
- source_word: τύχωσιν
  choice: mereka memperoleh
  rationale: τυγχάνω di sini berarti memperoleh atau mencapai; 'memperoleh' berpasangan secara alami dengan 'kebangkitan'.
theological_decisions:
- issue: Makna ἀπολύτρωσιν dalam konteks
  choice: pembebasan sementara dari siksaan atau kematian
  alternative: penebusan dalam arti teologis yang lebih luas
  rationale: Konteks langsung menggambarkan orang beriman yang menolak jalan keluar yang ditawarkan agar tetap setia. 'Pembebasan' mempertahankan makna naratif tanpa memasukkan gagasan soteriologis yang tidak dinyatakan secara eksplisit.
- issue: Arti 'kebangkitan yang lebih baik'
  choice: harapan kebangkitan yang melampaui pemulihan sementara kepada kehidupan fana
  alternative: kebangkitan yang lebih menguntungkan tanpa kontras khusus dengan klausa sebelumnya
  rationale: Susunan ayat mengontraskan orang mati yang dikembalikan kepada kehidupan sekarang dengan para penderita yang mengharapkan kebangkitan yang lebih baik, tetapi teks utama tidak merinci mekanismenya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'perempuan-perempuan' dan 'orang-orang lain' menjaga kejelasan bentuk jamak; 'tidak mau menerima' menyampaikan penolakan yang disengaja. Semua penjelasan mengenai metode siksaan dan nuansa pembebasan ditempatkan dalam catatan kaki agar teks utama tetap lancar.
