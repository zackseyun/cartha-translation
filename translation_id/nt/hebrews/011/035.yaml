revisions:
- from: Perempuan-perempuan menerima kembali orang-orang mereka yang telah mati melalui kebangkitan; tetapi orang-orang lain disiksa[a] dan tidak mau menerima pembebasan[b], supaya mereka memperoleh kebangkitan yang lebih baik[c].
  to: Para perempuan menerima kembali orang-orang mereka yang telah meninggal karena dibangkitkan; tetapi orang lain disiksa[a] karena tidak mau menerima pembebasan[b], supaya mereka memperoleh kebangkitan yang lebih baik[c].
  rationale: Revisi memperbaiki kelancaran bahasa Indonesia dan memperjelas hubungan kebangkitan dengan penerimaan kembali orang mati, sambil mempertahankan kontras sumber antara pemulihan sementara dan kebangkitan yang lebih baik. "Karena tidak mau menerima" mengungkapkan partisip οὐ προσδεξάμενοι sebagai alasan/keadaan yang menyertai penderitaan tanpa menambah makna teologis.
