base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/039.yaml
  text: And all these[a], though commended through faith, did not receive the promise[b],
translation:
  language: id
  text: Dan mereka semua, meskipun telah mendapat kesaksian yang baik melalui iman[a], tidak memperoleh janji itu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “meskipun telah mendapat pengakuan” atau “meskipun telah diberi kesaksian yang baik karena iman.” Bentuk Yunani menekankan bahwa mereka mendapat kesaksian yang baik melalui iman.
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak menerima janji itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Kata penghubung sederhana ini mempertahankan kaitan dengan daftar tokoh beriman sebelumnya tanpa menambahkan pertentangan yang tidak dinyatakan secara eksplisit.
- source_word: πάντες
  choice: mereka semua
  rationale: Mengacu kembali secara alami kepada semua tokoh yang baru disebutkan dalam pasal ini.
- source_word: μαρτυρηθέντες
  choice: meskipun telah menerima kesaksian yang baik
  rationale: Bentuk pasif ini menyatakan bahwa mereka mendapat kesaksian atau pengakuan yang baik. 'Meskipun' menyampaikan nuansa konsesif yang muncul dari konteks sebelum pernyataan bahwa mereka tidak memperoleh janji itu.
- source_word: διὰ τῆς πίστεως
  choice: melalui iman
  rationale: διά dengan genitif menyatakan sarana; pilihan ini dekat dengan bentuk Yunani dan tetap alami dalam bahasa Indonesia.
- source_word: πίστεως
  choice: iman
  rationale: Dalam Ibrani 11, istilah ini menunjuk pada iman atau kepercayaan para tokoh tersebut; 'iman' merupakan padanan baku dan tepat.
- source_word: οὐκ ἐκομίσαντο
  choice: tidak memperoleh
  rationale: κομίζω dalam bentuk medial dapat berarti menerima atau memperoleh sesuatu yang dijanjikan. 'Memperoleh' alami dan tidak menyiratkan penjelasan tambahan mengenai bentuk penggenapannya.
- source_word: τὴν ἐπαγγελίαν
  choice: janji itu
  rationale: Artikel Yunani dipertahankan dengan 'itu', sementara ungkapan ringkas 'janji' dibiarkan tanpa diperluas menjadi penggenapan, warisan, atau berkat tertentu.
theological_decisions:
- issue: Makna 'janji itu' dalam konteks
  choice: janji itu
  alternative: apa yang dijanjikan; penggenapan janji itu; warisan atau berkat yang dijanjikan
  rationale: Bahasa Yunani memakai ungkapan tunggal yang ringkas. Terjemahan tidak mempersempitnya menjadi bentuk penggenapan tertentu, sehingga ketegangan teologis tetap dipertahankan dan konteks ayat 40 dapat menjelaskannya.
- issue: Sumber kesaksian yang baik
  choice: Subjek pemberi kesaksian tidak disebutkan secara eksplisit
  alternative: dipuji oleh Allah
  rationale: Bentuk pasif μαρτυρηθέντες dan konteks dapat mengarah kepada kesaksian Allah, tetapi nama Allah tidak muncul dalam ayat ini. Terjemahan utama tidak menambahkannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan bentuk rangkuman serta kontras kontekstual ayat. Penanda catatan kaki [a] dan [b] ditempatkan tepat sesudah frasa terkait.
