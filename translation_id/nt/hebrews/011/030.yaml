  text: By faith the walls of Jericho fell after they had been encircled for seven days[a].
translation:
  language: id
  text: Oleh iman, tembok-tembok Yerikho runtuh setelah dikelilingi selama tujuh hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dengan iman” atau “melalui iman.” Bentuk datif Yunani πίστει dapat menyatakan sarana atau cara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Karena iman
  rationale: Bentuk datif πίστει dapat menyatakan sarana atau cara. “Karena iman” mempertahankan rumusan berulang yang alami dalam Ibrani 11 tanpa mempersempit maknanya secara berlebihan.
- source_word: τὰ τείχη Ἰεριχὼ
  choice: tembok-tembok Yerikho
  rationale: τεῖχος menunjuk pada tembok, khususnya tembok kota; bentuk jamaknya dipertahankan. Nama Ἰεριχώ ditransliterasikan menurut bentuk Indonesia yang lazim, “Yerikho”.
- source_word: ἔπεσαν
  choice: runtuh
  rationale: πίπτω berarti jatuh. Untuk tembok kota, “runtuh” merupakan padanan Indonesia yang alami dan tepat tanpa menambahkan penyebab keruntuhannya.
- source_word: κυκλωθέντα
  choice: setelah dikelilingi
  rationale: Partisip aoris pasif dari κυκλόω menampilkan tembok-tembok itu sebagai sesuatu yang dikelilingi dan paling wajar dipahami sebagai tindakan yang mendahului keruntuhannya. Terjemahan ini tidak secara eksplisit menambahkan pelaku atau tindakan berbaris yang hanya tersirat dari konteks Yosua 6.
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: selama tujuh hari
  rationale: ἐπί dengan akusatif waktu menyatakan rentang atau durasi; “selama tujuh hari” adalah ungkapan Indonesia yang alami.
theological_decisions:
- issue: Makna πίστις dalam Ibrani 11:30
  choice: iman
  alternative: kesetiaan; kepercayaan
  rationale: Rumus berulang dalam Ibrani 11 dan konteks para teladan mendukung “iman”. Terjemahan ini tidak mengubahnya menjadi “kesetiaan” atau sekadar keadaan psikologis berupa “kepercayaan”.
- issue: Nuansa datif πίστει
  choice: Karena iman
  alternative: Dengan iman; melalui iman
  rationale: Bahasa Yunani memungkinkan nuansa sarana maupun cara. Teks utama memakai rumusan Indonesia yang ringkas dan akrab, sedangkan catatan kaki mempertahankan kemungkinan nuansa lainnya.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan irama rumusan iman yang berulang dalam Ibrani 11; catatan kaki menjelaskan keluwesan gramatikal tanpa memasukkan tafsiran denominasi.
