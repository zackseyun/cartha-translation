  text: πίστει νοοῦμεν κατηρτίσθαι τοὺς αἰῶνας ῥήματι θεοῦ, εἰς τὸ μὴ ἐκ φαινομένων ⸂τὸ βλεπόμενον⸃ γεγονέναι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/003.yaml
  text: By faith we understand that the ages were framed by the word of God[a], so that what is seen did not come into being from things that are visible.
translation:
  language: id
  text: Dengan iman, kita memahami bahwa alam semesta[a] telah dibentuk oleh firman Allah, sehingga apa yang terlihat tidak menjadi ada dari hal-hal yang tampak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dunia-dunia”; secara harfiah, “zaman-zaman,” yang dapat menunjuk pada tatanan dunia sepanjang waktu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Karena iman
  rationale: Dativus sarana; frasa ini alami dalam bahasa Indonesia dan mempertahankan rumusan berulang dalam pasal ini.
- source_word: νοοῦμεν
  choice: kita memahami
  rationale: Menunjukkan pengertian atau penangkapan secara mental, bukan sekadar persepsi indrawi.
- source_word: κατηρτίσθαι
  choice: telah ditata
  rationale: Infinitif perfektif pasif ini menyatakan bahwa segala zaman telah disusun atau dijadikan teratur; pilihan ini tidak membatasi maknanya pada penciptaan materi saja.
- source_word: τοὺς αἰῶνας
  choice: segala zaman
  rationale: Secara harfiah merujuk pada zaman-zaman dan dalam konteks dapat mencakup seluruh tatanan ciptaan sepanjang waktu; alternatif kosmis dicatat dalam catatan kaki.
- source_word: ῥήματι θεοῦ
  choice: oleh firman Allah
  rationale: Menyampaikan ucapan atau firman Allah sebagai sarana penataan, dalam bentuk Indonesia yang wajar dan bermartabat.
- source_word: εἰς τὸ μὴ ... γεγονέναι
  choice: sehingga ... tidak terjadi
  rationale: Mempertahankan hubungan hasil serta gagasan menjadi atau muncul ke dalam keberadaan tanpa menambahkan rumusan metafisis.
- source_word: ἐκ φαινομένων
  choice: dari hal-hal yang tampak
  rationale: Menyatakan sumber yang kelihatan atau menampakkan diri dan mempertahankan kontras dengan apa yang terlihat.
- source_word: τὸ βλεπόμενον
  choice: apa yang terlihat
  rationale: Partisip substantival tunggal dengan pengertian kolektif, menunjuk pada tatanan kasatmata secara luas.
theological_decisions:
- issue: Cakupan αἰῶνες dalam kaitannya dengan penciptaan
  choice: segala zaman
  alternative: dunia-dunia; alam semesta
  rationale: Pilihan utama mempertahankan keluasan temporal-kosmis istilah Yunani dan tidak mempersempitnya hanya menjadi kosmos material; alternatif yang wajar disediakan dalam catatan kaki.
- issue: Implikasi penciptaan dari yang tidak kelihatan
  choice: apa yang terlihat tidak terjadi dari hal-hal yang tampak
  alternative: perumusan eksplisit bahwa segala sesuatu diciptakan dari ketiadaan
  rationale: Teks Yunani menegaskan bahwa yang terlihat tidak berasal dari hal-hal yang tampak. Terjemahan tidak memperluasnya menjadi pernyataan eksplisit creatio ex nihilo, sekalipun pernyataan itu selaras dengan implikasi teologis ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti alur argumentasi Yunani, sementara istilah yang berpotensi asing dijelaskan lewat catatan kaki.
