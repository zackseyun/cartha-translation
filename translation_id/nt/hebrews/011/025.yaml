  text: choosing rather to be mistreated with the people of God than to have the temporary enjoyment of sin,[a]
translation:
  language: id
  text: karena ia lebih memilih mengalami perlakuan buruk bersama umat Allah daripada menikmati kesenangan dosa yang sementara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kenikmatan dosa yang segera berlalu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μᾶλλον ἑλόμενος
  choice: karena ia lebih memilih
  rationale: Partisip aoris tengah menyatakan pilihan pribadi Musa dan meneruskan alasan dari ayat sebelumnya; 'lebih memilih' secara alami mempertahankan perbandingan μᾶλλον ... ἢ.
- source_word: συγκακουχεῖσθαι
  choice: untuk diperlakukan dengan buruk bersama
  rationale: Ungkapan ini mempertahankan baik makna mengalami perlakuan buruk maupun unsur kebersamaan yang dinyatakan oleh awalan συν-.
- source_word: τῷ λαῷ τοῦ θεοῦ
  choice: umat Allah
  rationale: Padanan Indonesia yang baku, alami, dan bernuansa perjanjian bagi ungkapan Yunani tersebut.
- source_word: ἢ
  choice: daripada
  rationale: Menandai pilihan kedua dalam perbandingan secara alami dalam bahasa Indonesia.
- source_word: πρόσκαιρον
  choice: sementara
  rationale: Menunjukkan sesuatu yang hanya berlangsung untuk waktu singkat tanpa melebihkan nuansa dengan penafsiran tambahan.
- source_word: ἔχειν
  choice: menikmati
  rationale: Dalam bahasa Indonesia, terjemahan harfiah 'memiliki kenikmatan' terasa kaku; 'menikmati kesenangan' menyampaikan gabungan ἔχειν dan ἀπόλαυσιν secara wajar.
- source_word: ἁμαρτίας ἀπόλαυσιν
  choice: kesenangan ... dari dosa
  rationale: Mempertahankan hubungan luas antara dosa dan kesenangan tanpa menentukan tindakan dosa tertentu.
theological_decisions:
- issue: Cakupan dosa yang kesenangannya ditolak Musa
  choice: Dibiarkan umum sebagai 'kesenangan sementara dari dosa'.
  alternative: Menafsirkannya secara khusus sebagai hak istimewa dan kompromi di istana Firaun, atau sebagai segala kesenangan berdosa di Mesir.
  rationale: Teks Yunani tidak merinci dosa yang dimaksud, sehingga terjemahan tidak mempersempit acuannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Klausa diawali 'karena ia' agar fragmen partisipial ini tetap jelas sebagai kelanjutan alasan dari ayat sebelumnya. Penanda catatan kaki dicantumkan dalam teks.
