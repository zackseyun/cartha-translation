  source_fidelity: 'Teks Indonesia secara akurat mencerminkan struktur dan makna Yunani: πίστις = “iman”; ὑπόστασις = “kepastian” sebagai pilihan kontekstual yang wajar; dan ἔλεγχος = “bukti.” Kedua genitif substantival, “apa yang diharapkan” dan “apa yang tidak dilihat,” dipertahankan tanpa menambahkan pelaku atau batas waktu yang tidak ada dalam teks. δέ dapat dibiarkan tersirat secara alami dalam bahasa Indonesia.'
  naturalness: 'Kalimatnya baku, modern, ringkas, dan memiliki paralelisme yang jelas: “Iman adalah ... dan ...”. Frasa “kepastian akan apa yang diharapkan” serta “bukti tentang apa yang tidak dilihat” dapat dipahami dengan lancar dalam register Alkitab Indonesia modern.'
