id: HEB.11.1
reference: Hebrews 11:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἔστιν δὲ πίστις ἐλπιζομένων ὑπόστασις, πραγμάτων ἔλεγχος οὐ βλεπομένων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/001.yaml
  text: Faith is the assurance of things hoped for[b][a], the proof of things not seen.
translation:
  language: id
  text: Iman adalah kepastian akan apa yang diharapkan[a] dan bukti tentang apa yang tidak dilihat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dasar,” “substansi,” atau “kenyataan dari apa yang diharapkan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “keyakinan mengenai apa yang tidak dilihat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστις
  choice: iman
  rationale: Dalam konteks ini πίστις menunjuk pada sikap percaya dan yakin kepada Allah serta janji-Nya; istilah baku dan alami dalam bahasa Indonesia adalah “iman”.
- source_word: ἐλπιζομένων
  choice: apa yang diharapkan
  rationale: Partisip pasif kini berbentuk genitif ini dipakai secara substantival dan menyatakan isi atau objek pengharapan.
- source_word: ὑπόστασις
  choice: kepastian
  rationale: Di sini ὑπόστασις dapat menyatakan kepastian, dasar keyakinan, substansi, atau kenyataan. “Kepastian” menyampaikan daya eksistensial dan meyakinkan dalam konteks tanpa memaksakan pengertian metafisis.
- source_word: πραγμάτων
  choice: tentang apa
  rationale: πρᾶγμα mencakup hal, perkara, atau kenyataan. Dalam klausa ini, “tentang apa” menghasilkan bahasa Indonesia yang alami sambil mempertahankan hubungan genitif dengan ἔλεγχος.
- source_word: ἔλεγχος
  choice: bukti
  rationale: ἔλεγχος dapat berarti bukti, pembuktian, atau keyakinan yang timbul karena bukti. “Bukti” mempertahankan daya evidensial istilah tersebut dan seimbang dengan “kepastian” pada klausa pertama.
- source_word: οὐ βλεπομένων
  choice: apa yang tidak dilihat
  rationale: Terjemahan ini mempertahankan bentuk negatif serta aspek kenyataan yang tidak berada dalam jangkauan penglihatan sekarang.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ menandai peralihan ringan, bukan keterangan waktu atau pertentangan kuat. Dalam bahasa Indonesia, hubungan wacananya cukup jelas tanpa kata penghubung eksplisit.
theological_decisions:
- issue: Makna ὑπόστασις dalam Ibrani 11:1
  choice: kepastian
  alternative: dasar; substansi; kenyataan; keyakinan
  rationale: “Kepastian” cocok dengan konteks nasihat dan rangkaian teladan iman, tetapi catatan kaki mempertahankan keluasan makna Yunani dan tidak menutup kemungkinan nuansa objektif seperti dasar atau kenyataan.
- issue: Makna πίστις
  choice: iman
  alternative: kepercayaan; sikap percaya; kesetiaan
  rationale: Tidak ada konstruksi genitif yang menimbulkan persoalan seperti pada frasa tertentu lainnya. Dalam konteks ini yang terutama dimaksud ialah percaya dengan yakin, bukan kesetiaan sebagai sifat.
- issue: Daya ἔλεγχος
  choice: bukti
  alternative: keyakinan; pembuktian
  rationale: “Bukti” mempertahankan sisi objektif atau evidensial istilah itu, sementara alternatif “keyakinan” dicatat karena kata Yunani juga dapat menunjuk pada keyakinan yang dihasilkan oleh pembuktian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dua klausa dipertahankan untuk mencerminkan paralelisme Yunani. Penanda δέ tidak diberi padanan tersendiri karena peralihannya ringan dan kata seperti “sekarang” dapat disalahpahami sebagai penanda waktu.
