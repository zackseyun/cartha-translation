lexical_decisions:
- source_word: πίστει
  choice: Karena iman
  rationale: Datif ini menyatakan sarana atau dasar tindakan. Dalam rangkaian berulang Ibrani 11, “Karena iman” merupakan ungkapan Indonesia yang alami dan mempertahankan pola retoris pasal tersebut.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Bentuk baku nama ini dalam bahasa Indonesia dan tradisi Alkitab Indonesia.
- source_word: μέγας γενόμενος
  choice: setelah dewasa
  rationale: Ungkapan ini secara idiomatis menunjuk pada tercapainya kedewasaan, bukan kebesaran status. Bentuk temporal “setelah dewasa” sesuai dengan hubungan partisip tersebut terhadap tindakan utama.
- source_word: ἠρνήσατο
  choice: menolak
  rationale: Dalam konteks ini verba tersebut menyatakan penolakan sengaja terhadap sebutan atau identitas tertentu.
- source_word: λέγεσθαι
  choice: disebut
  rationale: Infinitif pasif ini secara langsung dan alami diterjemahkan “disebut” dalam bahasa Indonesia.
- source_word: υἱὸς θυγατρὸς Φαραώ
  choice: anak dari putri Firaun
  rationale: Frasa ini menunjuk pada identitas khusus Musa dalam keluarga kerajaan. “Anak dari putri Firaun” jelas dan menghindari kemungkinan sesaat bahwa “anak putri” berarti anak perempuan.
- source_word: Φαραώ
  choice: Firaun
  rationale: Bentuk baku gelar ini dalam bahasa Indonesia.
theological_decisions:
- issue: Pemaknaan πίστις dalam formula berulang Ibrani 11
  choice: iman
  alternative: kesetiaan; kepercayaan
  rationale: Konteks pasal menonjolkan tindakan yang dilakukan berdasarkan iman, dan formula berulang πίστει paling tepat dipertahankan sebagai “Karena iman.” Kemungkinan leksikal lain tetap dicatat tanpa menjadikannya pembacaan utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan formula pembuka pasal serta hubungan temporal dan tindakan penolakan yang tegas.
