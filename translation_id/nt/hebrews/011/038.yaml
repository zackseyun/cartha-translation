  text: ὧν οὐκ ἦν ἄξιος ὁ κόσμος ⸀ἐπὶ ἐρημίαις πλανώμενοι καὶ ὄρεσι καὶ σπηλαίοις καὶ ταῖς ὀπαῖς τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/038.yaml
  text: —of whom the world was not worthy—wandering in deserts and mountains[b][a], and caves and holes in the ground.
translation:
  language: id
  text: —dunia tidak layak bagi mereka—mereka mengembara di padang-padang gurun[a] dan pegunungan, serta di gua-gua dan lubang-lubang di tanah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tempat-tempat sunyi.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “lubang-lubang bumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: bagi mereka
  rationale: Pronomina relatif genitif merujuk kepada orang-orang beriman yang menderita dalam ayat sebelumnya. Dalam konstruksi οὐκ ἦν ἄξιος, bahasa Indonesia yang alami mengungkapkannya sebagai 'tidak layak bagi mereka'.
- source_word: ἄξιος
  choice: layak
  rationale: '''Layak'' mempertahankan penilaian moral yang kuat dalam klausa ini tanpa mempersempitnya menjadi sekadar soal jasa.'
- source_word: κόσμος
  choice: dunia
  rationale: Merujuk secara luas kepada dunia manusia atau masyarakat yang menolak mereka; 'dunia' mempertahankan keluasan dan ketegangan ungkapan Yunani.
- source_word: ἐπὶ ἐρημίαις
  choice: di padang-padang gurun
  rationale: ἐπί dengan datif di sini paling wajar dipahami secara lokatif. Bentuk jamak dipertahankan, sedangkan 'padang gurun' merupakan ungkapan Indonesia yang konkret dan alami.
- source_word: πλανώμενοι
  choice: mengembara
  rationale: Partisipel ini menggambarkan perpindahan tanpa tempat menetap, selaras dengan keadaan mereka sebagai pelarian yang mengalami kesukaran.
- source_word: ὄρεσι
  choice: pegunungan
  rationale: Pilihan ini menyampaikan kawasan gunung-gunung secara alami dalam rangkaian tempat mereka mengembara.
- source_word: σπηλαίοις
  choice: gua-gua
  rationale: Padanan Indonesia yang umum, jelas, dan konkret untuk tempat berlindung atau bersembunyi.
- source_word: ὀπαῖς τῆς γῆς
  choice: lubang-lubang di tanah
  rationale: ὀπή dapat berarti lubang, bukaan, atau celah; genitif τῆς γῆς menunjukkan bahwa lubang itu berada pada tanah/bumi. Terjemahan ini alami sambil mempertahankan gambaran konkretnya.
theological_decisions:
- issue: Rujukan dan daya ungkap 'dunia tidak layak bagi mereka'
  choice: Dipertahankan sebagai penilaian moral terhadap dunia dalam kontras dengan orang-orang beriman yang menderita.
  alternative: Pernyataan yang lebih netral tentang ketidakcocokan antara mereka dan dunia.
  rationale: Bahasa Yunani menyatakan evaluasi yang tegas, bukan sekadar pengamatan sosial. Terjemahan mempertahankan ketegangan tersebut tanpa menambahkan kesimpulan doktrinal di luar ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Tanda pisah mempertahankan klausa sisipan yang menonjolkan penilaian terhadap dunia. Pengulangan bentuk jamak menjaga citra daftar tempat-tempat pengungsian, sementara susunan kalimat dibuat alami bagi pembaca umum.
