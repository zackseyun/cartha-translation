source:
  edition: SBLGNT
  text: Πίστει Ἑνὼχ μετετέθη τοῦ μὴ ἰδεῖν θάνατον, καὶ οὐχ ηὑρίσκετο διότι μετέθηκεν αὐτὸν ὁ θεός· πρὸ γὰρ τῆς ⸀μεταθέσεως μεμαρτύρηται εὐαρεστηκέναι τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/005.yaml
  text: By faith Enoch was taken away so that he should not see death[a], and he was not found because God had taken him away. For before his being taken away, he had been commended as having pleased God[c][b],
translation:
  language: id
  text: Karena iman, Henokh dipindahkan supaya ia tidak melihat kematian[a], dan ia tidak ditemukan karena Allah telah memindahkannya. Sebab sebelum dipindahkan, ia telah mendapat kesaksian bahwa ia berkenan kepada Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengalami kematian”. “Melihat kematian” adalah ungkapan Yunani yang dipertahankan dalam teks utama.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Karena iman
  rationale: Dativus ini menyatakan dasar atau sarana yang menandai pengalaman Henokh. “Karena iman” merupakan ungkapan Indonesia yang wajar dan sesuai dengan pola berulang dalam Ibrani 11.
- source_word: μετετέθη / μετέθηκεν / μεταθέσεως
  choice: dipindahkan / memindahkannya / dipindahkan
  rationale: Rangkaian kata dari akar μετατίθημι dipertahankan secara konsisten dengan akar “pindah”. Pilihan ini menyatakan tindakan Allah mengambil Henokh dari keberadaannya saat itu tanpa menambahkan tujuan tempat atau mekanisme yang tidak disebutkan ayat.
- source_word: τοῦ μὴ ἰδεῖν θάνατον
  choice: supaya ia tidak melihat kematian
  rationale: Konstruksi infinitif artikular dengan μή menyatakan tujuan atau hasil. Idiom Yunani “melihat kematian” dipertahankan, sementara maknanya dijelaskan dalam catatan kaki.
- source_word: οὐχ ηὑρίσκετο
  choice: ia tidak ditemukan
  rationale: Terjemahan pasif ini mengikuti bentuk Yunani dan tidak menentukan siapa yang mencarinya.
- source_word: μεμαρτύρηται
  choice: ia telah mendapat kesaksian
  rationale: Bentuk perfect pasif menyatakan bahwa kesaksian mengenai Henokh telah diberikan dan tetap berlaku. Ungkapan ini juga menjaga kaitan leksikal dengan tema kesaksian dalam Ibrani 11.
- source_word: εὐαρεστηκέναι τῷ θεῷ
  choice: bahwa ia berkenan kepada Allah
  rationale: Terjemahan ini menyampaikan isi kesaksian secara alami dalam bahasa Indonesia tanpa mengubahnya menjadi penilaian moral yang lebih terperinci daripada teks.
theological_decisions:
- issue: Makna pemindahan Henokh
  choice: Menerjemahkan secara netral sebagai “dipindahkan” tanpa menyebut tempat tujuan atau mekanismenya.
  alternative: “Diangkat ke surga” atau “diambil”
  rationale: Ayat menegaskan bahwa Allah memindahkan Henokh sehingga ia tidak melihat kematian, tetapi tidak secara eksplisit menyebut “ke surga” atau menjelaskan bagaimana hal itu terjadi.
- issue: Makna ungkapan “melihat kematian”
  choice: Mempertahankan idiom dalam teks utama dan menjelaskannya melalui catatan kaki.
  alternative: Menggantikannya dalam teks utama dengan “mengalami kematian”
  rationale: Ungkapan sumber cukup dapat dipahami dan memiliki bobot sastra Alkitab, sedangkan catatan kaki memberi padanan idiomatis tanpa menghilangkan bentuk aslinya.
- issue: Sifat kesaksian tentang Henokh
  choice: “Mendapat kesaksian bahwa ia berkenan kepada Allah”
  alternative: “Dipuji karena telah menyenangkan Allah”
  rationale: Pilihan utama menjaga bahasa kesaksian dalam μαρτυρέω serta tidak mempersempit sumber kesaksian atau mengubah “berkenan” menjadi pujian manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat jelas bagi pembaca umum. Pengulangan akar “pindah” disengaja untuk mencerminkan hubungan μετετέθη, μετέθηκεν, dan μεταθέσεως dalam teks Yunani.
