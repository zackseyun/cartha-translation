  text: μείζονα πλοῦτον ἡγησάμενος τῶν Αἰγύπτου θησαυρῶν τὸν ὀνειδισμὸν τοῦ Χριστοῦ, ἀπέβλεπεν γὰρ εἰς τὴν μισθαποδοσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/026.yaml
  text: He considered the reproach of Messiah greater wealth than the treasures of Egypt[b][a], for he was looking to the reward.
translation:
  language: id
  text: Ia menganggap celaan Mesias sebagai kekayaan yang lebih besar daripada harta Mesir[a], sebab ia mengarahkan pandangannya kepada upah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa “celaan Mesias” dapat berarti celaan yang ditanggung demi Mesias, celaan yang dialami bersama Yang Diurapi Allah, atau celaan yang oleh Surat Ibrani dipandang mencapai penggenapannya dalam Mesias. Susunan bahasa Yunaninya tidak mempersempit makna itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα πλοῦτον
  choice: kekayaan yang lebih besar
  rationale: Ungkapan komparatif ini menyatakan penilaian bahwa celaan Mesias lebih bernilai daripada harta Mesir; bentuk ini alami dalam bahasa Indonesia dan mempertahankan gambaran kekayaan.
- source_word: ἡγησάμενος
  choice: Ia menganggap
  rationale: Partisip aoris ἡγέομαι menyatakan penilaian atau anggapan. Klausa finit menghasilkan bahasa Indonesia yang jelas tanpa menghilangkan daya evaluatifnya.
- source_word: τῶν Αἰγύπτου θησαυρῶν
  choice: harta Mesir
  rationale: Konstruksi genetif menunjuk kepada harta yang dimiliki atau berasal dari Mesir. 'Harta Mesir' ringkas, wajar, dan mencakup kekayaan berupa barang-barang berharga.
- source_word: τὸν ὀνειδισμὸν
  choice: celaan
  rationale: ὀνειδισμός mencakup celaan, penghinaan, dan aib yang ditanggung. 'Celaan' mempertahankan unsur penghinaan publik tanpa secara berlebihan menentukan akibat emosional atau sosialnya.
- source_word: τοῦ Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar bagi Yang Diurapi. 'Mesias' mempertahankan fungsi titularnya, sementara hubungan genetif dengan 'celaan' dibiarkan terbuka.
- source_word: ἀπέβλεπεν
  choice: ia mengarahkan pandangannya kepada
  rationale: Bentuk imperfek menunjukkan orientasi yang terus berlangsung. Ungkapan ini menyampaikan perhatian yang terarah dan berkelanjutan, bukan sekadar tindakan melihat sesaat.
- source_word: τὴν μισθαποδοσίαν
  choice: upah itu
  rationale: μισθαποδοσία berarti balasan atau upah. Artikel Yunani diterjemahkan dengan 'itu', dan 'upah' merupakan istilah Indonesia yang jelas dalam konteks balasan ilahi.
theological_decisions:
- issue: Makna 'celaan Mesias' dalam kaitannya dengan Musa
  choice: Mempertahankan frasa genetif 'celaan Mesias' tanpa penjelasan interpretatif di dalam teks utama.
  alternative: celaan demi Mesias; celaan yang ditanggung bersama Yang Diurapi Allah; celaan yang dipandang tergenapi dalam Mesias
  rationale: Bahasa Yunani tidak menentukan secara eksplisit hubungan tepat antara celaan dan Mesias. Terjemahan literal-natural ini mempertahankan ambiguitas serta ketegangan kristologis teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. 'Celaan' dipilih daripada 'aib' atau 'penghinaan' agar unsur tindakan merendahkan tetap menonjol; 'Mesias' dipakai sebagai gelar. Susunan kalimat dibuat alami sambil mempertahankan perbandingan dan ambiguitas genetif sumber.
