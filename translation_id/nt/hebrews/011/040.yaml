id: HEB.11.40
reference: Hebrews 11:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦ θεοῦ περὶ ἡμῶν κρεῖττόν τι προβλεψαμένου, ἵνα μὴ χωρὶς ἡμῶν τελειωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/040.yaml
  text: since God had provided something better for us[b][a], so that they would not be made perfect apart from us.
translation:
  language: id
  text: karena Allah telah menyediakan[a] sesuatu yang lebih baik bagi kita, supaya mereka tidak disempurnakan[b] tanpa kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah melihat sebelumnya” atau “telah merencanakan sebelumnya.” Kata Yunani ini dapat menunjuk pada pandangan ke depan ataupun penyediaan yang telah dirancang; konteks mendukung gagasan penyediaan atau rancangan Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau “dibawa kepada penyelesaian” atau “mencapai kepenuhan.”
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: 'Genitif absolut ini paling wajar dialihkan sebagai anak kalimat sebab yang melanjutkan ayat sebelumnya: “karena Allah …”.'
- source_word: προβλεψαμένου
  choice: telah menyediakan
  rationale: Dalam konteks ini, partisip aoris menyatakan tindakan Allah yang sudah mendahului dan mengatur penggenapan bagi umat-Nya. “Menyediakan” menangkap rancangan aktif itu, sementara kemungkinan arti “melihat sebelumnya” dipertahankan dalam catatan kaki.
- source_word: κρεῖττόν τι
  choice: sesuatu yang lebih baik
  rationale: Ungkapan ini mempertahankan unsur tak tentu τι dan tema khas Surat Ibrani yang berulang kali membandingkan sesuatu sebagai “lebih baik”.
- source_word: περὶ ἡμῶν
  choice: bagi kita
  rationale: Bersama προβλεψαμένου, frasa ini secara alami menunjukkan bahwa tindakan Allah dilakukan dengan kita dalam pandangan dan untuk kepentingan kita.
- source_word: ἵνα μὴ
  choice: supaya ... tidak
  rationale: Bentuk ini mempertahankan daya tujuan atau hasil dari klausa Yunani dengan ungkapan Indonesia yang alami.
- source_word: χωρὶς ἡμῶν
  choice: tanpa kita
  rationale: Pilihan ini secara ringkas menyatakan bahwa penyempurnaan mereka tidak berlangsung terpisah dari kita dan mempertahankan dimensi kebersamaan umat Allah.
- source_word: τελειωθῶσιν
  choice: disempurnakan
  rationale: Bentuk pasif dan cakupan makna yang meliputi kesempurnaan sekaligus pencapaian tujuan dipertahankan tanpa membatasinya hanya pada perbaikan moral atau urutan waktu.
theological_decisions:
- issue: Makna τελειωθῶσιν dalam konteks sejarah keselamatan Surat Ibrani
  choice: disempurnakan
  alternative: dibawa kepada penyelesaian; mencapai kepenuhan
  rationale: “Disempurnakan” mempertahankan ketegangan makna antara menjadi sempurna dan dibawa sampai pada tujuan atau penggenapan, serta tidak mempersempit istilah ini menjadi kesempurnaan moral saja.
- issue: Hubungan antara orang-orang beriman terdahulu dan “kita”
  choice: tanpa kita
  alternative: terpisah dari kita
  rationale: Teks menyatakan bahwa penyempurnaan mereka tidak terjadi tanpa kebersamaan dengan umat yang datang kemudian. Terjemahan ini mempertahankan pernyataan korporat tersebut tanpa merinci mekanisme teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan klausa dipertahankan dekat dengan teks Yunani, sedangkan “karena” memperjelas fungsi genitif absolut sebagai alasan bagi pernyataan dalam ayat sebelumnya. Istilah “disempurnakan” sengaja dipertahankan karena bobot teologisnya dalam Surat Ibrani.
