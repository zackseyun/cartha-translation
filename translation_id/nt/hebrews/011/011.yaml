  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πίστει καὶ ⸂αὐτῇ Σάρρᾳ⸃ δύναμιν εἰς καταβολὴν σπέρματος ἔλαβεν καὶ παρὰ καιρὸν ⸀ἡλικίας, ἐπεὶ πιστὸν ἡγήσατο τὸν ἐπαγγειλάμενον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/011.yaml
  text: By faith even Sarah herself received power to conceive offspring[a], even beyond the proper time of life, because she considered the one who had promised to be faithful.
translation:
  language: id
  text: Oleh iman, bahkan Sara sendiri menerima kemampuan untuk memperoleh keturunan[a], meskipun ia telah melampaui usia yang semestinya, karena ia menganggap Dia yang telah berjanji itu setia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “untuk peletakan benih.” Ungkapan Yunani ini tidak biasa dan bersifat idiomatis; dalam konteks, ungkapan itu merujuk pada kemampuan untuk memperoleh keturunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Karena iman
  rationale: Datif sarana dalam rumus berulang Ibrani 11; “karena iman” alami dalam bahasa Indonesia dan menyatakan bahwa iman menjadi sarana atau dasar tindakan.
- source_word: καὶ αὐτῇ Σάρρᾳ
  choice: bahkan Sara sendiri
  rationale: καί bersama pronomina intensif αὐτῇ menonjolkan Sara sebagai contoh tambahan yang mengejutkan; “bahkan ... sendiri” mempertahankan penekanan itu.
- source_word: δύναμιν ... ἔλαβεν
  choice: menerima kekuatan
  rationale: Mempertahankan makna leksikal δύναμις dan bentuk aktif ἔλαβεν, sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: εἰς καταβολὴν σπέρματος
  choice: untuk mengandung keturunan
  rationale: Ungkapan Yunani ini tidak biasa dan secara harfiah berkaitan dengan 'peletakan benih'. Dengan Sara sebagai subjek gramatikal, terjemahan ini menyampaikan maksud kontekstual, yaitu kemampuan memperoleh keturunan, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: καὶ παρὰ καιρὸν ἡλικίας
  choice: sekalipun usianya sudah melampaui masa yang semestinya
  rationale: παρά dengan akusatif menunjukkan telah melewati batas normal, sedangkan καιρός dan ἡλικία menunjuk pada masa yang sesuai dalam tahap kehidupan; rumusan ini jelas tanpa menambahkan rincian yang tidak dinyatakan eksplisit.
- source_word: ἐπεὶ
  choice: sebab
  rationale: Memperkenalkan alasan Sara menerima kekuatan; “sebab” jelas, bermartabat, dan sesuai dengan alur kalimat.
- source_word: πιστὸν
  choice: setia
  rationale: Menunjukkan sifat Dia yang berjanji sebagai dapat diandalkan serta mempertahankan bobot teologis dan resonansi relasional dari πιστός.
- source_word: ἡγήσατο
  choice: menganggap
  rationale: Menyampaikan penilaian atau kesimpulan batin yang dinyatakan oleh bentuk medium ἡγέομαι.
- source_word: τὸν ἐπαγγειλάμενον
  choice: Dia yang telah berjanji
  rationale: Partisip substantival ini merujuk kepada Allah. Kapitalisasi “Dia” memperjelas rujukan tanpa memasukkan nama yang tidak terdapat dalam teks.
theological_decisions:
- issue: Subjek dan makna tindakan Sara dalam klausa yang secara sintaksis sulit
  choice: 'Sara adalah subjek: ia menerima kekuatan untuk mengandung keturunan.'
  alternative: Abraham terlibat secara tersirat atau menjadi pelaku utama; atau Sara menerima kekuatan bagi terbentuknya garis keturunan.
  rationale: Dalam bentuk teks ini, αὐτῇ Σάρρᾳ paling wajar dipahami sebagai penandaan Sara yang menjadi subjek semantis dari ἔλαβεν. Walaupun καταβολὴ σπέρματος secara harfiah dapat terdengar berorientasi laki-laki, konteks menyoroti iman Sara dan diperolehnya keturunan ketika usianya telah lewat; kejanggalan ungkapan tetap diinformasikan dalam catatan kaki.
- issue: Makna πιστός ketika dikenakan kepada Allah
  choice: setia
  alternative: dapat dipercaya; dapat diandalkan
  rationale: Ayat ini mendasarkan iman Sara pada karakter Allah yang menepati janji. “Setia” mempertahankan bobot teologis tanpa menambahkan ajaran di luar teks.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Struktur kalimat mempertahankan pengulangan tema iman, penekanan pada Sara, serta alasan yang berpuncak pada kesetiaan Dia yang berjanji.
