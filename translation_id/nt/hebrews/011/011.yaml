  terminology: “Sara,” “iman,” “setia,” dan “Dia yang telah berjanji” tepat untuk register modern baku dan setia pada istilah serta penekanan teks. Catatan kaki tetap perlu mempertahankan bentuk harfiah yang ganjil dan alternatif leksikalnya.
