id: HEB.11.17
reference: Hebrews 11:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πίστει προσενήνοχεν Ἀβραὰμ τὸν Ἰσαὰκ πειραζόμενος, καὶ τὸν μονογενῆ προσέφερεν ὁ τὰς ἐπαγγελίας ἀναδεξάμενος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/017.yaml
  text: By faith Abraham[a], when he was being tested, offered up Isaac, and the one who had received the promises was offering up his one and only son,
translation:
  language: id
  text: Oleh iman, Abraham, ketika ia sedang diuji, telah mempersembahkan Ishak; dan ia yang telah menerima janji-janji itu sedang mempersembahkan putranya yang unik[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “putranya yang satu-satunya” atau “putra tunggalnya.” Kata Yunani ini dapat menekankan keunikan atau kedudukan Ishak yang tiada duanya.
    reason: Menjelaskan alternatif makna μονογενής tanpa menyatakan secara berlebihan bahwa istilah itu hanya berarti unik atau tanpa memasukkan penafsiran mengenai status biologis Abraham ke dalam teks utama.
lexical_decisions:
- source_word: Πίστει
  choice: Karena iman
  rationale: Dativus sarana menyatakan bahwa tindakan Abraham berlangsung oleh atau berdasarkan iman; rumusan ini alami dalam bahasa Indonesia dan sesuai dengan pola berulang dalam pasal ini.
- source_word: προσενήνοχεν
  choice: telah mempersembahkan
  rationale: Bentuk perfektum προσφέρω dirender dengan 'telah' untuk mempertahankan pandangan retrospektif terhadap tindakan itu, sedangkan 'mempersembahkan' menjaga nuansa persembahan korban.
- source_word: πειραζόμενος
  choice: ketika diuji
  rationale: Partisipel pasif ini dipahami secara temporal dan sirkumstansial. 'Diuji' tepat dalam konteks pengujian iman dan tidak menyiratkan godaan untuk berbuat dosa.
- source_word: μονογενῆ
  choice: anaknya yang satu-satunya
  rationale: Istilah ini menekankan kedudukan yang unik atau tiada duanya. Ungkapan Indonesia ini mempertahankan daya tekan teks, sedangkan catatan kaki menjelaskan bahwa Ishak bukan satu-satunya anak biologis Abraham.
- source_word: προσέφερεν
  choice: sedang mempersembahkan
  rationale: Bentuk imperfektum dipertahankan dengan penanda progresif 'sedang', yang menggambarkan tindakan yang tengah berlangsung dan membedakannya dari perfektum sebelumnya.
- source_word: ἀναδεξάμενος
  choice: telah menerima
  rationale: Partisipel aoris tengah merujuk kepada penerimaan janji-janji yang mendahului tindakan mempersembahkan Ishak; 'menerima' alami dalam kolokasi bahasa Indonesia.
- source_word: ἐπαγγελίας
  choice: janji-janji
  rationale: Bentuk jamak Yunani dipertahankan dan menunjuk pada rangkaian janji ilahi kepada Abraham.
- source_word: καὶ
  choice: bahkan
  rationale: Dalam klausa kedua, penghubung ini dapat bernilai penegasan, menyoroti ketegangan bahwa penerima janji justru mempersembahkan anak yang menjadi pusat janji itu.
theological_decisions:
- issue: Makna μονογενῆ bagi Ishak meskipun Abraham mempunyai anak biologis lain
  choice: anaknya yang satu-satunya
  alternative: anaknya yang unik; anak tunggalnya; anaknya satu-satunya yang dijanjikan
  rationale: Terjemahan mempertahankan tekanan kuat pada keunikan Ishak, sementara catatan kaki mencegah pembacaan bahwa Abraham tidak mempunyai anak biologis lain. Penjelasan tidak dimasukkan langsung ke teks agar status 'yang dijanjikan' tidak menggantikan ambiguitas leksikal sumber.
- issue: Hubungan aspek antara προσενήνοχεν dan προσέφερεν
  choice: telah mempersembahkan ... sedang mempersembahkan
  alternative: mempersembahkan ... mempersembahkan
  rationale: Pembedaan ini mempertahankan kontras formal antara perfektum dan imperfektum serta ketegangan naratif tindakan yang dipandang sebagai sudah dilakukan dalam iman sekaligus sedang berlangsung ketika diintervensi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur dipecah menjadi dua kalimat agar mudah dipahami tanpa menghilangkan hubungan retoris antara penerimaan janji dan tindakan mempersembahkan Ishak. Penanda 'telah' dan 'sedang' sengaja dipakai untuk mencerminkan perbedaan aspek verba Yunani.
