- from: Karena iman, Abraham, ketika diuji, telah mempersembahkan Ishak. Ia yang telah menerima janji-janji itu bahkan sedang mempersembahkan anaknya yang satu-satunya[a].
  to: Oleh iman, Abraham, ketika ia sedang diuji, telah mempersembahkan Ishak; dan ia yang telah menerima janji-janji itu sedang mempersembahkan putranya yang unik[a].
  rationale: Revisi menggunakan padanan sarana yang lebih tepat untuk Πίστει, menghapus penegasan tambahan pada καὶ, dan memilih terjemahan yang lebih aman untuk μονογενῆ sambil mempertahankan ambiguitas leksikalnya dalam catatan kaki. Penanda “telah” dan “sedang” dipertahankan untuk merepresentasikan kontras perfektum dan imperfektum secara wajar dalam bahasa Indonesia.
