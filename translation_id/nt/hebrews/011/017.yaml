review_pass:
  verdict: revise
  source_fidelity: Revisi mempertahankan sarana Πίστει, sifat pasif-temporal πειραζόμενος, perbedaan aspek antara προσενήνοχεν dan προσέφερεν, bentuk jamak ἐπαγγελίας, serta makna unik/khusus dari μονογενῆ. Penggantian “bahkan” dengan “dan” tidak menambahkan penegasan yang tidak dinyatakan oleh καὶ.
  naturalness: “Oleh iman” lebih idiomatis sebagai rumusan pembuka yang berulang dalam Ibrani 11. Klausa kedua dipertahankan dalam satu kalimat agar hubungan koordinatif dan ketegangan retoris teks Yunani lebih jelas. “Putranya yang unik” menghindari kesan biologis yang terlalu kuat dari “anaknya yang satu-satunya.”
  terminology: “Mempersembahkan,” “diuji,” dan “janji-janji” tepat untuk konteks dan register baku. “Putranya yang unik” menerjemahkan μονογενῆ tanpa memasukkan penjelasan “yang dijanjikan” ke dalam teks utama.
  issues:
  - severity: medium
    issue: “Karena iman” kurang tepat untuk Πίστει.
    rationale: Dativus ini menyatakan sarana/instrumen, bukan alasan kausal. Dalam pola retoris Ibrani 11, “Oleh iman” merupakan padanan Indonesia yang lebih langsung dan alami.
  - severity: medium
    issue: “bahkan” menambahkan penegasan yang tidak eksplisit dalam καὶ.
    rationale: Penghubung Yunani di sini secara paling aman diterjemahkan “dan”; ketegangan konteks sudah muncul dari penjajaran kedua klausa tanpa penambahan adverbia.
  - severity: medium
    issue: “anaknya yang satu-satunya” mudah dipahami sebagai klaim bahwa Ishak adalah satu-satunya anak Abraham secara biologis.
    rationale: μονογενῆ dapat berarti satu-satunya atau unik. Karena teks dan pemakaian istilah ini diperdebatkan dalam nuansa tepatnya, “putranya yang unik” lebih aman dalam teks utama, dengan alternatif dijelaskan dalam catatan kaki.
  revised_text: Oleh iman, Abraham, ketika ia sedang diuji, telah mempersembahkan Ishak; dan ia yang telah menerima janji-janji itu sedang mempersembahkan putranya yang unik[a].
