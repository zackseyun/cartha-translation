  text: ἐλιθάσθησαν, ⸀ἐπρίσθησαν, ἐν φόνῳ ⸀μαχαίρης ἀπέθανον, περιῆλθον ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν, ὑστερούμενοι, θλιβόμενοι, κακουχούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/037.yaml
  text: They were stoned[a], they were sawn in two, they died by the sword; they went about in sheepskins, in goatskins, destitute, afflicted, mistreated—
translation:
  language: id
  text: Mereka dilempari batu, digergaji menjadi dua, dan dibunuh dengan pedang[a]. Mereka mengembara dengan mengenakan kulit domba dan kulit kambing; mereka berkekurangan, ditindas, dan diperlakukan dengan kejam—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mati oleh pedang.” Secara lebih harfiah, bahasa Yunani memuat kata yang berarti “pembunuhan” atau “pembantaian” (φόνος), sehingga menegaskan kekerasan kematian itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθάσθησαν
  choice: dilempari batu
  rationale: Bentuk aoristus pasif ini secara langsung berarti dilempari batu. Terjemahan ini mempertahankan bentuk pasif tanpa menambahkan bahwa mereka pasti tewas akibat perajaman itu.
- source_word: ἐπρίσθησαν
  choice: digergaji menjadi dua
  rationale: Bentuk pasif πρίζω berarti digergaji; dalam daftar kemartiran ini, ungkapan tersebut paling wajar dipahami sebagai digergaji menjadi dua.
- source_word: ἐν φόνῳ μαχαίρης ἀπέθανον
  choice: mati dibantai dengan pedang
  rationale: ἀπέθανον berarti 'mati', sedangkan φόνος menonjolkan tindakan pembunuhan atau pembantaian dan μάχαιρα menunjuk pada pedang. Rumusan ini mempertahankan kekerasan ungkapan Yunani sambil tetap dapat dipahami dalam bahasa Indonesia.
- source_word: περιῆλθον
  choice: mengembara
  rationale: Dalam konteks orang-orang yang terlunta dan kekurangan, kata ini menggambarkan perpindahan dari satu tempat ke tempat lain; 'mengembara' menyampaikan nuansa itu secara alami.
- source_word: ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν
  choice: dengan mengenakan kulit domba dan kulit kambing
  rationale: Kedua frasa menunjuk pada kulit binatang yang dikenakan sebagai pakaian. Penambahan 'mengenakan' membuat fungsi kulit-kulit itu jelas tanpa mengubah makna.
- source_word: ὑστερούμενοι
  choice: berkekurangan
  rationale: Partisipel ini menyatakan keadaan kekurangan kebutuhan hidup. 'Berkekurangan' jelas dan tidak melebihkan makna menjadi kemelaratan mutlak.
- source_word: θλιβόμενοι
  choice: ditindas
  rationale: Bentuk pasif θλίβω dapat berarti ditekan, ditindas, atau disengsarakan; 'ditindas' cocok dengan penderitaan yang ditimpakan oleh pihak lain.
- source_word: κακουχούμενοι
  choice: diperlakukan dengan kejam
  rationale: Kata ini berarti menerima perlakuan buruk. Rumusan tersebut alami dalam bahasa Indonesia dan mempertahankan unsur penderitaan akibat tindakan orang lain.
theological_decisions:
- issue: Kekuatan ungkapan kekerasan dalam ἐν φόνῳ μαχαίρης
  choice: mati dibantai dengan pedang
  alternative: mati oleh pedang
  rationale: φόνος menambahkan gagasan pembunuhan atau pembantaian, bukan sekadar menyebut pedang sebagai sarana kematian. Teks utama mempertahankan bobot ini, sedangkan bentuk yang lebih ringkas dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Deretan bentuk pasif dipertahankan sejauh alami; tanda pisah akhir dipertahankan karena kalimat berlanjut ke ayat berikutnya.
