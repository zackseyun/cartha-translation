  yaml_path: translation/nt/hebrews/011/036.yaml
  text: And others experienced mocking and flogging[a], and even chains and imprisonment.
translation:
  language: id
  text: Yang lain mengalami ejekan dan cambukan,[a] bahkan juga belenggu dan pemenjaraan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjalani ujian berupa ejekan dan cambukan, bahkan juga belenggu dan penjara.” Secara lebih harfiah, ungkapan Yunani berbunyi “menerima ujian berupa …”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: Yang lain
  rationale: Menunjuk pada kelompok lain dalam rangkaian orang beriman yang menderita dan mempertahankan kontras dengan contoh-contoh sebelumnya.
- source_word: ἐμπαιγμῶν
  choice: ejekan
  rationale: Menyampaikan penghinaan atau olok-olok secara alami dalam bahasa Indonesia modern.
- source_word: μαστίγων
  choice: cambukan
  rationale: Menunjuk pada hukuman berupa pukulan dengan cambuk; pilihan ini jelas dan lebih spesifik daripada sekadar 'pukulan'.
- source_word: πεῖραν ἔλαβον
  choice: mengalami
  rationale: Ungkapan Yunani secara harfiah berarti 'menerima ujian/pencobaan berupa'; 'mengalami' menyampaikan bahwa mereka menjalani penderitaan tersebut tanpa memaksakan penafsiran bahwa Allah sedang menguji mereka.
- source_word: ἔτι δὲ
  choice: bahkan juga
  rationale: Mempertahankan daya peningkatan menuju penderitaan berikutnya secara wajar dalam bahasa Indonesia.
- source_word: δεσμῶν
  choice: belenggu
  rationale: Mengacu pada alat pengikat atau keadaan dibelenggu; kata ini konkret, bermartabat, dan sesuai dengan konteks penahanan.
- source_word: φυλακῆς
  choice: pemenjaraan
  rationale: Dalam rangkaian objek dari 'mengalami', bentuk abstrak ini secara alami menyatakan keadaan ditahan di penjara.
