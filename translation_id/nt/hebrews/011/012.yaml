  to: Karena itu, dari satu orang[a]—dan orang itu seolah-olah sudah mati—lahirlah keturunan sebanyak bintang di langit dan sebanyak pasir di tepi laut yang tak terhitung jumlahnya.
  rationale: Revisi menghapus penekanan tambahan “saja”, mempertahankan sisipan metaforis tentang keadaan Abraham, dan membuat kedua perbandingan jumlah lebih paralel. Catatan kaki tetap tepat, berjangkar pada “satu orang”, dan menjelaskan alternatif yang lebih harfiah tanpa mengubah makna teks.
