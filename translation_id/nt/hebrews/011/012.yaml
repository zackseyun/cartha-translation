source:
  edition: SBLGNT
  text: διὸ καὶ ἀφ’ ἑνὸς ἐγεννήθησαν, καὶ ταῦτα νενεκρωμένου, καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει καὶ ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/012.yaml
  text: Therefore from one man[a], and this one as good as dead, descendants were born as numerous as the stars of heaven and as the innumerable sand by the seashore.
translation:
  language: id
  text: Karena itu, dari satu orang[a]—dan orang itu seolah-olah sudah mati—lahirlah keturunan sebanyak bintang di langit dan sebanyak pasir di tepi laut yang tak terhitung jumlahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dari satu.” Yang dimaksud dalam konteks ini ialah Abraham.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari pernyataan sebelumnya dan mempertahankan hubungan logis antarayat.
- source_word: ἀφ’ ἑνὸς
  choice: dari satu orang saja
  rationale: Bentuk maskulin dan konteks menunjuk kepada Abraham. Kata 'saja' menonjolkan bahwa keturunan yang tak terhitung itu berasal dari satu orang tanpa mengubah makna dasarnya.
- source_word: ἐγεννήθησαν
  choice: lahirlah keturunan
  rationale: Bentuk pasif jamak menyatakan munculnya keturunan Abraham. Ungkapan ini alami dalam bahasa Indonesia dan menghindari bentuk kaku seperti 'diperanakkan'.
- source_word: καὶ ταῦτα νενεκρωμένου
  choice: dan orang itu sudah seperti mati
  rationale: Ungkapan ini menggambarkan keadaan Abraham yang karena usia lanjut tidak lagi berdaya untuk memperoleh keturunan, bukan kematian harfiah. 'Seperti mati' mempertahankan kekuatan metaforanya.
- source_word: καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: yang banyaknya seperti bintang-bintang di langit
  rationale: Menyampaikan perbandingan jumlah secara jelas dan alami sambil mempertahankan citra bahasa sumber.
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος
  choice: seperti pasir yang tak terhitung di tepi laut
  rationale: Menerjemahkan idiom 'di bibir laut' secara wajar sebagai 'di tepi laut' dan mempertahankan penekanan bahwa jumlahnya tidak dapat dihitung.
theological_decisions:
- issue: Rujukan frasa ἀφ’ ἑνὸς
  choice: Rujukannya diperjelas sebagai satu orang, yakni Abraham dalam konteks.
  alternative: Menerjemahkan secara lebih harfiah hanya sebagai 'dari satu'.
  rationale: Bentuk maskulin dan konteks langsung menunjuk kepada Abraham; penjelasan ini menghindari kekaburan dalam bahasa Indonesia tanpa menambahkan ajaran di luar teks.
- issue: Makna νενεκρωμένου
  choice: Dipahami secara metaforis sebagai keadaan Abraham yang karena usia lanjut sudah seperti mati dalam hal kemampuan memperoleh keturunan.
  alternative: Dipahami sebagai mati secara harfiah atau 'telah dimatikan'.
  rationale: Konteks membahas lahirnya keturunan secara ajaib pada usia lanjut. Terjemahan mempertahankan metafora kematian tanpa menyiratkan bahwa Abraham benar-benar sudah meninggal.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. Susunan dengan tanda pisah mempertahankan sisipan retoris Yunani, sedangkan citra bintang di langit dan pasir di tepi laut dipertahankan sebagai gema bahasa janji dalam Kitab Suci.
