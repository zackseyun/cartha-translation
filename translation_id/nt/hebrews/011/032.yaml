id: HEB.11.32
reference: Hebrews 11:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ τί ἔτι λέγω; ἐπιλείψει ⸂με γὰρ⸃ διηγούμενον ὁ χρόνος περὶ Γεδεών, Βαράκ, ⸀Σαμψών, Ἰεφθάε, Δαυίδ τε καὶ Σαμουὴλ καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/032.yaml
  text: And what more shall I say? For time would fail me if I were telling about Gideon[a], Barak, Samson, Jephthah, David, and also Samuel and the prophets,
translation:
  language: id
  text: Dan apa lagi yang harus kukatakan? Sebab waktuku tidak akan cukup jika aku terus menceritakan tentang Gideon, Barak, Simson, Yefta, Daud, juga Samuel dan para nabi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ τί ἔτι λέγω;
  choice: Dan apa lagi yang harus kukatakan?
  rationale: Pertanyaan retoris ini secara alami mengantar contoh-contoh tambahan dan mempertahankan dorongan wacana teks Yunani.
- source_word: ἐπιλείψει με ... ὁ χρόνος
  choice: waktuku tidak akan cukup
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan bahwa waktu akan habis atau tidak memadai bagi penulis, tanpa menyiratkan bahwa ia sama sekali tidak mempunyai waktu.
- source_word: διηγούμενον
  choice: jika aku terus menceritakan
  rationale: Partisipel kini menggambarkan kegiatan bercerita yang sedang atau terus berlangsung; bentuk bersyarat membuat hubungan retorisnya alami dalam bahasa Indonesia.
- source_word: περὶ
  choice: menceritakan [nama-nama berikut]
  rationale: Topik yang ditandai περί tersampaikan secara alami melalui verba transitif 'menceritakan' tanpa memerlukan 'tentang'.
- source_word: Γεδεών, Βαράκ, Σαμψών, Ἰεφθάε, Δαυίδ, Σαμουὴλ
  choice: Gideon, Barak, Simson, Yefta, Daud, Samuel
  rationale: Nama-nama memakai bentuk Indonesia yang sudah lazim dalam tradisi penerjemahan Alkitab.
- source_word: τε καὶ
  choice: juga
  rationale: Kata 'juga' mempertahankan nuansa tambahan yang menghubungkan Daud dengan Samuel tanpa membebani kalimat.
- source_word: τῶν προφητῶν
  choice: para nabi
  rationale: Bentuk 'para nabi' merupakan padanan jamak yang alami dan bermartabat untuk kelompok nabi tersebut.
theological_decisions:
- issue: Daya retoris pernyataan tentang waktu
  choice: Dipahami sebagai cara retoris untuk mengatakan bahwa waktu tidak cukup bila semua contoh diceritakan.
  alternative: 'Terjemahan lebih harfiah: ''waktu akan habis bagiku sementara aku menceritakan.'''
  rationale: Konstruksi Yunani menandai peringkasan pembahasan, bukan pernyataan mutlak bahwa penulis tidak mempunyai waktu.
- issue: Pengelompokan nama-nama terakhir
  choice: '''Daud, juga Samuel dan para nabi'' mempertahankan Samuel sebagai tokoh yang disebut tersendiri sambil menghubungkannya dengan kelompok para nabi.'
  alternative: '''Daud dan Samuel dan para nabi.'''
  rationale: τε καὶ memiliki daya penghubung yang sedikit aditif; 'juga' menjaganya tanpa menentukan secara berlebihan hubungan Samuel dengan para nabi.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Bentuk orang pertama 'kukatakan' dan 'aku' mengikuti suara pribadi penulis; susunan daftar dibuat jelas tanpa menambahkan penafsiran denominatif.
