lexical_decisions:
- source_word: διὰ πίστεως
  choice: melalui iman
  rationale: Frasa ini menyatakan sarana yang memungkinkan mereka bertindak. “Melalui iman” mempertahankan makna instrumental διά dengan genitif dan tema utama Ibrani 11.
- source_word: κατηγωνίσαντο βασιλείας
  choice: menaklukkan kerajaan-kerajaan
  rationale: Kata kerja καταγωνίζομαι menggambarkan kemenangan atau penundukan dalam konflik, sedangkan βασιλείας di sini menunjuk pada kerajaan sebagai wilayah atau kekuasaan politik.
- source_word: εἰργάσαντο δικαιοσύνην
  choice: melakukan apa yang benar
  rationale: Ungkapan ini menyampaikan tindakan nyata yang sesuai dengan kebenaran dengan bahasa Indonesia yang alami. Kemungkinan nuansa keadilan tetap dipertahankan dalam catatan kaki.
- source_word: ἐπέτυχον ἐπαγγελιῶν
  choice: memperoleh janji-janji
  rationale: “Memperoleh” mempertahankan arti mencapai atau mendapatkan tanpa menentukan lebih jauh apakah yang dimaksud ialah menerima janji atau mengalami pemenuhannya; bentuk jamak sumber juga dipertahankan.
- source_word: ἔφραξαν στόματα λεόντων
  choice: membungkam mulut singa-singa
  rationale: “Membungkam” secara wajar menyampaikan tindakan menutup atau menghentikan mulut, sekaligus mempertahankan gambaran konkret dalam bahasa sumber.
theological_decisions:
- issue: Makna πίστις dalam daftar Ibrani 11
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Konteks menekankan tindakan yang dilakukan dengan mengandalkan Allah. “Iman” mempertahankan istilah tematis pasal ini tanpa mempersempitnya menjadi sekadar keyakinan intelektual atau mengalihkannya menjadi kesetiaan pelaku.
- issue: Cakupan makna δικαιοσύνη dalam konteks non-Paulus
  choice: melakukan apa yang benar
  alternative: menegakkan keadilan
  rationale: Pilihan utama mempertahankan cakupan moral yang luas dari δικαιοσύνη, sedangkan catatan kaki menjaga kemungkinan nuansa keadilan tanpa membatasi istilah itu hanya pada ranah hukum atau sosial.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan daftar yang ringkas dan berirama. “Melakukan apa yang benar” dipilih daripada ungkapan harfiah “mengerjakan kebenaran,” yang kurang alami dalam pemakaian Indonesia masa kini. Kata “dan” sebelum unsur terakhir membantu kelancaran daftar tanpa mengubah hubungan antarklausa.
