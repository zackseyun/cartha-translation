  text: For those who say such things make it clear that they are seeking a homeland[a].
translation:
  language: id
  text: Sebab orang-orang yang mengatakan hal-hal demikian menunjukkan dengan jelas bahwa mereka sedang mencari tanah air[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “negeri mereka sendiri” atau “negeri asal.” Ayat-ayat berikutnya menjelaskan bahwa tanah air yang mereka harapkan pada akhirnya adalah tanah air surgawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelas dengan ayat sebelumnya dan terdengar wajar dalam bahasa Indonesia baku.
- source_word: τοιαῦτα
  choice: hal-hal demikian
  rationale: Merujuk kembali kepada jenis pernyataan yang baru saja dikutip, dengan bentuk yang ringkas dan jelas.
- source_word: λέγοντες
  choice: orang-orang yang mengatakan
  rationale: Partisipel kini yang disertai artikel diterjemahkan sebagai klausa relatif agar alami, tanpa menghilangkan sifat umum atau berkelanjutannya.
- source_word: ἐμφανίζουσιν
  choice: menunjukkan dengan jelas
  rationale: Menyampaikan makna membuat sesuatu tampak nyata atau terang berdasarkan perkataan mereka.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi yang dinyatakan menjadi jelas.
- source_word: πατρίδα
  choice: tanah air
  rationale: Istilah Indonesia yang alami untuk negeri asal atau negeri yang dianggap sebagai tempat sendiri; ketakrifan tidak ditambahkan karena nomina Yunani ini tanpa artikel.
- source_word: ἐπιζητοῦσιν
  choice: sedang mencari
  rationale: Mempertahankan nuansa tindakan yang terus berlangsung dan aktif, bukan sekadar kerinduan pasif.
theological_decisions:
- issue: Makna πατρίδα yang dicari para leluhur dalam konteks
  choice: tanah air
  alternative: tanah air surgawi; negeri asal mereka
  rationale: Ayat ini sendiri hanya menyatakan bahwa mereka mencari suatu tanah air. Ayat berikutnya menjelaskan bahwa tujuan akhirnya bersifat surgawi, sehingga penafsiran itu tidak dimasukkan lebih awal ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Susunan kalimat mempertahankan hubungan argumentatif dengan ayat sebelumnya serta ambiguitas πατρίδα dalam ayat ini.
