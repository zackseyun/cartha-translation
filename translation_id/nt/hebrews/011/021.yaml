base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/021.yaml
  text: By faith Jacob[a], as he was dying, blessed each of the sons of Joseph[b], and worshiped while leaning on the top of his staff.
translation:
  language: id
  text: Dengan iman, ketika ia hampir meninggal, Yakub memberkati masing-masing anak Yusuf dan menyembah sambil bersandar pada ujung tongkatnya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia menyembah ke arah ujung tongkatnya.” Frasa ini kemungkinan menggambarkan postur Yakub, bukan tongkat sebagai sasaran penyembahannya.
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani ayat ini berbunyi “tongkat,” sedangkan teks Ibrani Kejadian 47:31 dapat diterjemahkan, “lalu Israel sujud menyembah di bagian kepala tempat tidurnya.”
    reason: textual_variant
lexical_decisions:
- source_word: πίστει
  choice: Karena iman
  rationale: Dativus ini menyatakan sarana atau cara tindakan Yakub. Dalam rangkaian Ibrani 11, “karena iman” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan iman sebagai dasar tindakannya.
- source_word: ἀποθνῄσκων
  choice: ketika menjelang ajal
  rationale: Partisipel kini ini berlangsung bersamaan dengan tindakan utama. Ungkapan tersebut menyampaikan bahwa Yakub berada dalam proses mendekati kematian, bukan sekadar menyebut waktu sesudah ia mati.
- source_word: ἕκαστον τῶν υἱῶν Ἰωσὴφ
  choice: setiap anak Yusuf
  rationale: ἕκαστον dengan genitivus partitif menekankan bahwa masing-masing dari kedua anak Yusuf menerima berkat. “Setiap anak Yusuf” menyampaikan daya distributif itu dengan wajar.
- source_word: εὐλόγησεν
  choice: memberkati
  rationale: Ini adalah padanan baku dan alami bagi εὐλογέω dalam konteks tindakan berkat Yakub yang berlatar kisah Kejadian.
- source_word: προσεκύνησεν
  choice: menyembah
  rationale: Dalam konteks ini προσκυνέω menunjuk pada tindakan penghormatan religius. “Menyembah” mempertahankan makna tersebut, sedangkan unsur postur dijelaskan oleh frasa berikutnya.
- source_word: ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ
  choice: sambil bersandar pada ujung tongkatnya
  rationale: Terjemahan ini menyajikan pemahaman yang paling mungkin tentang postur Yakub dan menghindari kesan bahwa tongkat adalah sasaran penyembahannya. Karena ἐπί dengan akusatif dapat dipahami secara lain dan kata “bersandar” tersirat, kemungkinan yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Hubungan tindakan menyembah dengan ujung tongkat
  choice: Yakub menyembah Allah sambil bersandar pada ujung tongkatnya.
  alternative: Yakub menyembah ke arah atau pada ujung tongkatnya.
  rationale: Susunan Yunani dapat diterjemahkan secara lebih harfiah dengan “pada/ke arah ujung tongkatnya,” tetapi hal itu dapat disalahpahami seolah-olah tongkat menjadi objek sembah. Terjemahan utama memahami frasa itu sebagai keterangan postur tanpa menutup ambiguitas leksikal, yang dipertahankan dalam catatan kaki.
- issue: Perbedaan antara teks Yunani Ibrani 11:21 dan teks Ibrani Kejadian 47:31
  choice: 'Mengikuti teks Yunani Ibrani 11:21: “tongkat.”'
  alternative: 'Mengikuti teks Ibrani Kejadian 47:31: “tempat tidur.”'
  rationale: Teks sumber ayat ini secara eksplisit memakai ῥάβδος, “tongkat,” sehingga itulah yang harus tampil dalam teks utama. Bentuk “tempat tidur” dalam teks Ibrani Kejadian dipertahankan sebagai catatan intertekstual penting, tanpa menggantikan bacaan Yunani surat Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Yunani dibagi menjadi dua kalimat Indonesia agar alurnya jelas bagi pembaca umum. “Ketika menjelang ajal” dipilih sebagai ungkapan alami bagi keadaan Yakub yang sedang mendekati kematian; “bersandar” merupakan penjelasan kontekstual yang transparan dan karena itu disertai catatan kaki.
