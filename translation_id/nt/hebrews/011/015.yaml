  text: καὶ εἰ μὲν ἐκείνης ⸀μνημονεύουσιν ἀφ’ ἧς ⸀ἐξέβησαν, εἶχον ἂν καιρὸν ἀνακάμψαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/015.yaml
  text: And if they had been remembering that land from which they had gone out[a], they would have had opportunity to return.
translation:
  language: id
  text: Dan seandainya mereka terus mengingat negeri yang telah mereka tinggalkan itu[a], tentu mereka sudah mempunyai kesempatan untuk kembali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “negeri asal yang telah mereka tinggalkan.” Bahasa Yunani menunjuk pada tempat di bumi yang dahulu mereka tinggalkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύουσιν
  choice: terus mengingat
  rationale: Bentuk kini dalam syarat yang berlawanan dengan kenyataan menyatakan perhatian yang tetap tertuju pada negeri terdahulu; frasa ini mempertahankan makna kognitif tanpa membatasinya pada nostalgia.
- source_word: ἐκείνης
  choice: negeri
  rationale: Kata tunjuk feminin ini merujuk pada negeri asal yang disebut dalam konteks sebelumnya. 'Negeri' alami dalam bahasa Indonesia serta tidak harus menunjuk pada negara sebagai entitas politik.
- source_word: ἀφ’ ἧς ἐξέβησαν
  choice: yang telah mereka tinggalkan
  rationale: Ungkapan ini menyatakan tempat asal yang darinya mereka pergi. 'Telah mereka tinggalkan' lebih alami dalam bahasa Indonesia, sementara gagasan keluarnya tetap terwakili oleh konteks keberangkatan.
- source_word: εἶχον ἂν
  choice: mereka tentu mempunyai
  rationale: Imperfek dengan ἄν menyatakan hasil hipotetis yang tidak terwujud; 'tentu mempunyai' menyampaikan akibat kontrafaktual secara alami bersama 'seandainya'.
- source_word: καιρὸν
  choice: kesempatan
  rationale: Di sini καιρός berarti peluang atau kesempatan yang sesuai, bukan sekadar rentang waktu.
- source_word: ἀνακάμψαι
  choice: untuk kembali
  rationale: Infinitif ini menunjuk pada tindakan kembali atau berbalik ke tempat semula; 'kembali' ringkas dan wajar.
- source_word: καὶ εἰ μὲν
  choice: Dan seandainya
  rationale: Καί menghubungkan ayat ini dengan uraian sebelumnya, sedangkan bentuk syarat kontrafaktual paling jelas disampaikan dengan 'seandainya'; μέν berfungsi struktural dan tidak perlu diterjemahkan tersendiri.
theological_decisions:
- issue: Hakikat negeri yang diingat
  choice: Negeri asal duniawi yang telah mereka tinggalkan, yang secara tersirat dikontraskan dengan negeri yang lebih baik dan surgawi dalam konteks sekitar.
  alternative: Cara hidup lama secara umum, bukan tanah air yang nyata.
  rationale: Ibrani 11:13–16 menggunakan gambaran konkret tentang tanah air dan mengontraskannya dengan negeri yang lebih baik. Terjemahan mempertahankan acuan tempat itu tanpa mengalegorikannya.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. 'Negeri' mempertahankan motif pengembaraan tanpa nuansa politik yang terlalu kuat; susunan kontrafaktual dibuat alami dengan 'seandainya ... tentu'.
