  text: πίστει Ῥαὰβ ἡ πόρνη οὐ συναπώλετο τοῖς ἀπειθήσασιν, δεξαμένη τοὺς κατασκόπους μετ’ εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/031.yaml
  text: By faith Rahab the prostitute did not perish with those who were disobedient[b][a], because she had welcomed the spies in peace.
translation:
  language: id
  text: Oleh iman Rahab, pelacur itu, tidak turut binasa bersama orang-orang yang tidak taat[a], setelah menyambut para mata-mata itu dengan damai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bersama orang-orang yang tidak percaya” atau “bersama orang-orang yang tidak menaati.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “karena ia telah menyambut para mata-mata itu dengan damai.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: πίστει
  choice: Karena iman
  rationale: Datif sarana/sebab yang membuka pola teladan dalam Ibrani 11. 'Karena iman' merupakan ungkapan Indonesia yang alami dan mempertahankan iman sebagai dasar tindakan Rahab.
- source_word: Ῥαὰβ
  choice: Rahab
  rationale: Bentuk nama yang baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: ἡ πόρνη
  choice: perempuan pelacur itu
  rationale: πόρνη secara langsung menunjuk kepada perempuan yang bekerja sebagai pelacur. Pilihan ini jelas, modern, dan tidak memperhalus daya sosial-moral istilah sumber.
- source_word: οὐ συναπώλετο
  choice: tidak turut binasa bersama
  rationale: Kata kerja majemuk συναπόλλυμι menyatakan binasa bersama pihak lain; 'turut binasa bersama' mempertahankan unsur kebersamaan itu secara eksplisit.
- source_word: τοῖς ἀπειθήσασιν
  choice: orang-orang yang tidak taat
  rationale: Partisip ἀπειθέω dapat menyatakan ketidaktaatan atau penolakan untuk percaya. 'Tidak taat' mempertahankan tekanan moral-volisional tanpa menyempitkannya menjadi ketidakpercayaan intelektual saja.
- source_word: δεξαμένη
  choice: sebab ia telah menyambut
  rationale: Partisip aoris ini dapat menyatakan keadaan atau alasan. Dalam konteks, 'sebab' secara alami menghubungkan sambutan Rahab dengan luputnya ia dari kebinasaan, sambil mencatat kemungkinan bentuk yang lebih harfiah dalam catatan kaki.
- source_word: τοὺς κατασκόπους
  choice: mata-mata itu
  rationale: κατάσκοπος berarti mata-mata atau pengintai. 'Mata-mata' jelas dan sesuai dengan fungsi orang-orang yang diutus dalam kisah Yosua.
- source_word: μετ’ εἰρήνης
  choice: dengan damai
  rationale: Ungkapan ini mempertahankan nomina εἰρήνη dan menyatakan cara Rahab menerima mereka—secara bersahabat, bukan dengan permusuhan.
theological_decisions:
- issue: Makna πίστις dalam formula teladan Ibrani 11
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Dalam formula πίστει yang berulang di Ibrani 11, 'iman' adalah padanan baku dan paling tepat. 'Kepercayaan' dan 'kesetiaan' berhubungan secara konseptual, tetapi kurang sesuai sebagai rumusan utama di sini.
- issue: Nuansa ἀπειθήσασιν
  choice: yang tidak taat
  alternative: yang tidak percaya; yang menolak taat
  rationale: Istilah Yunani dapat mencakup ketidakpercayaan yang tampak sebagai ketidaktaatan. Teks utama mempertahankan segi ketidaktaatan tanpa menutup kaitannya dengan ketidakpercayaan.
- issue: Hubungan partisip δεξαμένη dengan klausa utama
  choice: sebab ia telah menyambut
  alternative: setelah menyambut; dengan menyambut
  rationale: Partisip tersebut tidak menandai hubungan logis secara eksplisit. 'Sebab' cocok dengan alur argumentasi, sedangkan catatan kaki mempertahankan konstruksi partisipial yang lebih terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan formula pembuka khas Ibrani 11, menyebut status Rahab secara langsung, serta menjaga nuansa kebinasaan bersama dan ambiguitas terbatas pada ἀπειθέω dan partisip δεξαμένη.
