  to: Oleh iman Rahab, pelacur itu, tidak turut binasa bersama orang-orang yang tidak taat[a], setelah menyambut para mata-mata itu dengan damai[b].
  rationale: Revisi memakai “Oleh iman” untuk mempertahankan fungsi datif sarana dalam formula Ibrani 11. Klausa partisipial diterjemahkan secara temporal agar tidak memaksakan hubungan sebab-akibat yang tidak dieksplisitkan dalam bahasa Yunani; kemungkinan kausal tetap tersedia dalam catatan kaki. Catatan kaki juga diperbaiki agar alternatifnya idiomatis dan pelabelannya akurat.
