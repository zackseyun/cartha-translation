review_pass:
  verdict: revise
  source_fidelity: 'Teks utama pada dasarnya setia: istilah untuk Rahab sebagai pelacur, kebinasaan bersama, ketidaktaatan, para mata-mata, dan penerimaan dengan damai dipertahankan. Namun, πίστει lebih tepat diterjemahkan sebagai sarana, bukan sebab, dalam formula Ibrani 11; karena itu “Oleh iman” lebih setia daripada “Karena iman.” Hubungan partisip δεξαμένη tidak ditandai secara eksplisit oleh bahasa Yunani, sehingga “sebab” terlalu menetapkan hubungan kausal dalam teks utama.'
  naturalness: “Oleh iman Rahab, pelacur itu, ...” merupakan bahasa Indonesia baku, alami, dan sesuai register surat ini. Bentuk ini juga lebih ringkas daripada “Rahab, perempuan pelacur itu.” “Para mata-mata” lebih alami untuk kelompok orang daripada pengulangan “mata-mata itu.”
  terminology: “Iman,” “pelacur,” “turut binasa bersama,” “orang-orang yang tidak taat,” dan “mata-mata” adalah padanan modern yang tepat. Catatan kaki untuk δεξαμένη perlu diperbaiki karena “setelah” bukanlah terjemahan yang “lebih harfiah”; itu merupakan salah satu penafsiran hubungan partisipnya.
  issues:
  - severity: medium
    issue: “Karena iman” menggeser πίστει dari sarana menjadi sebab.
    rationale: 'Datif πίστει dalam rangkaian teladan Ibrani 11 lazim dan paling langsung menyatakan sarana: “Oleh iman.” Terjemahan “karena iman” masih mungkin secara longgar, tetapi kurang mencerminkan konstruksi sumber.'
  - severity: medium
    issue: “Sebab ia telah menyambut” menetapkan hubungan kausal yang tidak dinyatakan secara eksplisit oleh partisip δεξαμένη.
    rationale: Partisip aoris dapat menyatakan keadaan yang menyertai, cara, waktu, atau alasan bergantung konteks. Terjemahan partisipial “setelah menyambut” dalam teks utama mempertahankan hubungan anteceden tanpa mengunci alasan kausal; pembacaan kausal dapat dicatat sebagai alternatif.
  - severity: low
    issue: Catatan kaki b menyebut “setelah” sebagai bentuk yang lebih harfiah.
    rationale: “Setelah” adalah pilihan untuk hubungan temporal, sedangkan bentuk harfiah partisipnya kira-kira “sesudah/telah menyambut” atau “dengan telah menyambut.” Catatan harus melabelinya sebagai alternatif, bukan sebagai terjemahan lebih harfiah.
  - severity: low
