source:
  edition: SBLGNT
  text: ⸀Πίστει καλούμενος Ἀβραὰμ ὑπήκουσεν ἐξελθεῖν εἰς ⸀τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν, καὶ ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/008.yaml
  text: By faith Abraham[a], when called, obeyed to go out to a place that he was going to receive as an inheritance, and he went out not knowing where he was going.
translation:
  language: id
  text: Oleh iman Abraham, ketika dipanggil, menaati panggilan itu dengan berangkat ke suatu tempat yang akan ia terima sebagai warisan, dan ia berangkat tanpa mengetahui ke mana ia pergi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: Karena iman
  rationale: Datif menyatakan sarana atau dasar tindakan. “Karena iman” alami dalam bahasa Indonesia dan menonjolkan bahwa iman mendorong ketaatan Abraham.
- source_word: καλούμενος
  choice: ketika dipanggil
  rationale: Partisipel kini pasif yang menerangkan Abraham dengan nuansa temporal; terjemahan ini tidak menentukan urutan secara berlebihan.
- source_word: ὑπήκουσεν ἐξελθεῖν
  choice: taat untuk berangkat
  rationale: Menjaga hubungan langsung antara verba “taat” dan infinitif “keluar/pergi”, sedangkan “berangkat” lebih wajar untuk meninggalkan tempat menuju tujuan lain.
- source_word: εἰς τόπον
  choice: ke suatu tempat
  rationale: Tujuannya belum ditentukan bagi Abraham; “suatu tempat” mempertahankan ketidakpastian itu.
- source_word: ἤμελλεν λαμβάνειν
  choice: kelak akan diterimanya
  rationale: Menyatakan futuritas tanpa menambahkan gagasan bahwa hal tersebut telah ditakdirkan secara eksplisit.
- source_word: εἰς κληρονομίαν
  choice: sebagai warisan
  rationale: Menunjukkan status tempat itu ketika diterima, tanpa menambahkan pronomina kepunyaan yang tidak dinyatakan dalam teks Yunani.
- source_word: καὶ ἐξῆλθεν
  choice: Ia pun berangkat
  rationale: Menggemakan tindakan ἐξελθεῖν sebelumnya. Partikel “pun” menghubungkan panggilan dan pelaksanaan tindakan secara alami.
- source_word: μὴ ἐπιστάμενος ποῦ ἔρχεται
  choice: tanpa mengetahui ke mana ia pergi
  rationale: Mempertahankan keadaan yang menyertai tindakan Abraham dan memakai ungkapan tujuan yang idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Makna πίστις dalam tanggapan Abraham
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Konteks menekankan sikap percaya yang membuat Abraham menanggapi panggilan dengan taat. “Iman” mempertahankan istilah teologis yang lazim tanpa mengubahnya menjadi kesetiaan sebagai kualitas perilaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Berangkat” dipilih daripada terjemahan harfiah “keluar” karena lebih alami dalam konteks perjalanan, sementara pengulangan tindakan dalam bahasa Yunani tetap dipertahankan melalui dua pemakaian “berangkat”.
