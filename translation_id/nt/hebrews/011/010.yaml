  text: ἐξεδέχετο γὰρ τὴν τοὺς θεμελίους ἔχουσαν πόλιν, ἧς τεχνίτης καὶ δημιουργὸς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/010.yaml
  text: For he was waiting for the city that has foundations[b][a], whose architect and builder is God.
translation:
  language: id
  text: Sebab ia menantikan kota yang memiliki fondasi[a], yang perancang dan pembangunnya adalah Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kota yang mempunyai fondasi.” Kata Yunani untuk “fondasi” berbentuk jamak dan dapat menekankan kekokohan serta sifat permanen.
    reason: lexical_alternative
  - marker: b
    text: Atau, “yang perencana dan pembuatnya adalah Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδέχετο
  choice: menantikan
  rationale: Bentuk imperfek menyatakan penantian atau pengharapan yang berlangsung pada masa lampau; dalam konteks kalimat bahasa Indonesia, bentuk ini tetap terasa duratif.
- source_word: γὰρ
  choice: Sebab
  rationale: Menjaga fungsi penjelas yang menghubungkan ayat ini dengan kehidupan Abraham sebagai pendatang pada ayat sebelumnya.
- source_word: τὴν τοὺς θεμελίους ἔχουσαν πόλιν
  choice: kota yang memiliki dasar-dasar
  rationale: Mempertahankan konstruksi partisipial dan bentuk jamak 'dasar-dasar' secara cukup dekat sekaligus wajar dalam bahasa Indonesia.
- source_word: θεμελίους
  choice: dasar-dasar
  rationale: Mempertahankan bentuk jamak Yunani, yang dalam konteks dapat menyiratkan kekokohan dan sifat permanen.
- source_word: πόλιν
  choice: kota
  rationale: Padanan lazim dan sesuai dengan motif kota dalam Surat Ibrani.
- source_word: ἧς
  choice: yang ... -nya
  rationale: Relasi kepunyaan dengan kota dinyatakan secara alami melalui konstruksi 'yang perancang dan pembangunnya'.
- source_word: τεχνίτης
  choice: perancang
  rationale: Dalam pasangan dengan δημιουργός, istilah ini menonjolkan segi kecakapan merancang tanpa membatasi kata Yunani hanya pada profesi arsitek.
- source_word: δημιουργὸς
  choice: pembangun
  rationale: Sesuai dengan gambaran sebuah kota dan membedakannya dari peran perancang, meski kata Yunani juga dapat berarti pembuat.
- source_word: ὁ θεός
  choice: Allah
  rationale: Padanan baku untuk sebutan ilahi dalam terjemahan Alkitab bahasa Indonesia.
theological_decisions:
- issue: Hakikat kota yang dijanjikan
  choice: kota yang memiliki dasar-dasar
  alternative: kota surgawi; kota dengan dasar-dasar yang tetap
  rationale: Ayat ini tidak secara eksplisit menyebut kota itu 'surgawi' atau menamainya. Terjemahan mempertahankan gambaran kota yang kokoh dan Allah sebagai perancang serta pembangunnya tanpa memasukkan identifikasi teologis dari bagian lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Menantikan' terdengar alami serta menyampaikan penantian yang berkelanjutan. Susunan 'yang perancang dan pembangunnya adalah Allah' mempertahankan penekanan Yunani pada Allah sebagai subjek penutup.
