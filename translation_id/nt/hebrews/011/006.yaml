  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/006.yaml
  text: And without faith it is impossible to please him[c][b][a], for the one who comes to God must believe that he exists and that he is a rewarder of those who diligently seek him.
translation:
  language: id
  text: Dan tanpa iman[a], mustahil orang berkenan kepada-Nya, sebab orang yang datang kepada Allah harus percaya bahwa Dia ada[b] dan bahwa Dia adalah Pemberi upah[c] bagi mereka yang sungguh-sungguh mencari-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepercayaan”. Dalam beberapa konteks, kata Yunani ini juga dapat berarti “kesetiaan”, tetapi di sini penjelasan selanjutnya berpusat pada percaya kepada Allah.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “bahwa Dia ada”. Ungkapan Yunani ini ringkas dan menegaskan realitas keberadaan Allah.
    reason: lexical_clarification
  - marker: c
    text: Atau “Dia terbukti sebagai Pemberi upah”. Kata kerja Yunaninya secara harfiah berarti “menjadi”, tetapi dalam konteks ini dapat menyatakan bahwa Allah didapati atau terbukti sebagai Pemberi upah bagi mereka yang mencari-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ
  choice: Dan tanpa
  rationale: χωρίς menyatakan keadaan tanpa sesuatu, sedangkan δέ adalah penghubung ringan. 'Dan tanpa' melanjutkan alur ayat sebelumnya tanpa menambahkan pertentangan yang terlalu kuat.
- source_word: πίστεως
  choice: iman
  rationale: Dalam konteks ini πίστις diterangkan oleh πιστεῦσαι, sehingga menunjuk pada iman atau kepercayaan kepada Allah. 'Iman' merupakan padanan baku dan alami dalam konteks ini.
- source_word: ἀδύνατον εὐαρεστῆσαι
  choice: mustahil orang berkenan kepada-Nya
  rationale: Ungkapan impersonal dengan infinitif berarti bahwa berkenan kepada Allah tidak mungkin tanpa iman. 'Orang' ditambahkan secara wajar dalam bahasa Indonesia sebagai subjek umum, sedangkan '-Nya' merujuk kepada Allah dari konteks.
- source_word: πιστεῦσαι γὰρ δεῖ
  choice: sebab ... harus percaya
  rationale: γάρ memberikan alasan dan δεῖ menyatakan keharusan. Susunan ini mempertahankan hubungan logis dan daya keharusannya.
- source_word: τὸν προσερχόμενον τῷ θεῷ
  choice: orang yang datang kepada Allah
  rationale: Partisip προσερχόμενον menggambarkan orang yang mendekat atau datang kepada Allah. 'Datang kepada Allah' alami, jelas, dan tetap mempertahankan gerak relasional dalam teks.
- source_word: ὅτι ἔστιν
  choice: bahwa Dia ada
  rationale: Ungkapan Yunani yang ringkas ini menegaskan realitas keberadaan Allah. 'Dia ada' mempertahankan bentuk ringkas sumber tanpa harus memperluasnya menjadi rumusan filosofis.
- source_word: τοῖς ἐκζητοῦσιν αὐτὸν
  choice: mereka yang sungguh-sungguh mencari-Nya
  rationale: ἐκζητέω memiliki nuansa pencarian yang tekun atau sungguh-sungguh. Tambahan adverbia mencerminkan daya intensif kata kerja tersebut.
- source_word: μισθαποδότης γίνεται
  choice: Dia memberi upah
  rationale: μισθαποδότης menyebut pihak yang memberikan balasan atau upah, dan γίνεται dalam konstruksi predikatif menyatakan bagaimana Allah terbukti atau hadir bagi orang yang mencari-Nya. Bentuk verbal 'memberi upah' alami dalam bahasa Indonesia, tanpa menyiratkan perubahan pada hakikat Allah.
theological_decisions:
- issue: Makna πίστις dalam konteks yang bermuatan teologis
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Konteks langsung berpusat pada percaya kepada Allah, sehingga 'iman' paling tepat. Alternatif 'kepercayaan' tetap mungkin secara leksikal, sedangkan 'kesetiaan' kurang utama dalam ayat ini.
- issue: Daya γίνεται dalam μισθαποδότης γίνεται
  choice: Dia memberi upah
  alternative: Dia adalah Pemberi upah; Dia terbukti sebagai Pemberi upah
  rationale: Terjemahan utama mengungkapkan fungsi predikatif frasa itu secara alami. Alternatif yang lebih harfiah dipertahankan dalam catatan agar bentuk dan ketegangan ungkapan Yunani tidak hilang.
- issue: Sifat upah atau balasan dari Allah
  choice: upah
  alternative: ganjaran; balasan
  rationale: Teks menyatakan Allah memberi upah kepada pencari-Nya, tetapi tidak merinci bentuk atau dasar upah tersebut. Terjemahan tidak menambahkan kerangka doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Kapitalisasi pronomina ilahi dipakai sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Susunan kalimat dijaga tetap mudah dipahami sambil mempertahankan hubungan sebab-akibat dan ambiguitas penting teks Yunani.
