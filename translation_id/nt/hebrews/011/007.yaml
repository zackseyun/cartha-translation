reference: Hebrews 11:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πίστει χρηματισθεὶς Νῶε περὶ τῶν μηδέπω βλεπομένων εὐλαβηθεὶς κατεσκεύασεν κιβωτὸν εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ, δι’ ἧς κατέκρινεν τὸν κόσμον, καὶ τῆς κατὰ πίστιν δικαιοσύνης ἐγένετο κληρονόμος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/007.yaml
  text: By faith Noah[a], having been warned about things not yet seen, in reverent fear constructed an ark for the salvation of his household[d][c][b], through which he condemned the world and became heir of the righteousness according to faith.
translation:
  language: id
  text: Dengan iman, Nuh, setelah menerima peringatan ilahi[a] tentang hal-hal yang belum kelihatan, dengan rasa takut dan hormat[b] membangun sebuah bahtera untuk keselamatan seisi rumahnya. Melalui bahtera itu[c] ia menyatakan dunia bersalah dan menjadi ahli waris kebenaran yang sesuai dengan iman[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “setelah menerima petunjuk ilahi” atau “setelah menerima peringatan dari Allah.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “karena digerakkan oleh rasa takut kepada Allah.”
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “melalui bahtera itu” paling alami merujuk kepada bahtera; sebagian orang memahaminya secara lebih luas sebagai iman Nuh atau tanggapannya yang taat.
    reason: alternative_reading
  - marker: d
    text: Kata Yunani ini juga dapat berarti “keadilan”, tetapi dalam konteks ini “kebenaran” lebih sesuai dengan bahasa tentang warisan dan iman.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Karena iman
  rationale: Datif ini menyatakan sarana atau dasar tindakan dan mempertahankan pola berulang dalam Ibrani 11. 'Karena iman' lebih alami dalam bahasa Indonesia daripada 'oleh iman' tanpa menghilangkan peran iman.
- source_word: χρηματισθεὶς
  choice: setelah menerima peringatan ilahi
  rationale: Bentuk pasif ini menunjuk pada penerimaan komunikasi atau peringatan yang berasal dari Allah. 'Ilahi' menyampaikan sumber tersirat itu tanpa memasukkan 'Allah' langsung ke dalam teks utama.
- source_word: περὶ τῶν μηδέπω βλεπομένων
  choice: tentang hal-hal yang belum kelihatan
  rationale: Ungkapan ini mempertahankan unsur waktu μηδέπω dan sifat belum terlihat dari peristiwa yang diperingatkan.
- source_word: εὐλαβηθεὶς
  choice: dengan rasa takut dan hormat
  rationale: Pilihan ini menjaga gabungan rasa gentar dan sikap hormat religius, bukan sekadar ketakutan biasa.
- source_word: κατεσκεύασεν
  choice: membangun
  rationale: Dalam konteks bahtera, 'membangun' merupakan padanan Indonesia yang langsung, alami, dan tepat bagi tindakan membuat atau mempersiapkan.
- source_word: κιβωτὸν
  choice: sebuah bahtera
  rationale: '''Bahtera'' adalah istilah Indonesia yang mapan dalam kisah Nuh dan secara kontekstual lebih tepat daripada ''peti''.'
- source_word: εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ
  choice: untuk menyelamatkan seisi rumahnya
  rationale: Ungkapan verbal ini alami bagi pembaca modern dan mempertahankan cakupan οἶκος sebagai seluruh rumah tangga, tidak terbatas pada keluarga inti.
- source_word: δι’ ἧς
  choice: Melalui bahtera itu
  rationale: Pronomina relatif feminin paling wajar merujuk kepada κιβωτός. Menyebut ulang 'bahtera' menghindari ketidakjelasan pronomina Indonesia, sementara catatan kaki mempertahankan kemungkinan cakupan yang lebih luas.
- source_word: κατέκρινεν τὸν κόσμον
  choice: ia menghukum dunia
  rationale: Padanan langsung ini mempertahankan kekuatan verba penghakiman; dalam konteksnya, tindakan taat Nuh menjadi kesaksian yang menghukum dunia.
- source_word: τῆς κατὰ πίστιν δικαιοσύνης
  choice: kebenaran yang sesuai dengan iman
  rationale: '''Kebenaran'' adalah padanan teologis Indonesia yang mapan bagi δικαιοσύνη, sedangkan ''yang sesuai dengan iman'' mempertahankan struktur κατά tanpa menyamakannya secara terlalu cepat dengan rumusan ''oleh iman''.'
- source_word: ἐγένετο κληρονόμος
  choice: menjadi ahli waris
  rationale: Ungkapan ini menyatakan dengan alami status yang diperoleh Nuh sebagai κληρονόμος.
theological_decisions:
- issue: Makna χρηματισθεὶς dan sumber peringatannya
  choice: menerima peringatan ilahi
  alternative: menerima petunjuk ilahi; menerima peringatan dari Allah
  rationale: Verba pasif ini lazim menyiratkan komunikasi ilahi, tetapi bahasa Yunani tidak menyebut θεός secara eksplisit. 'Ilahi' menjaga implikasi sumber tanpa menjadikannya unsur eksplisit yang lebih kuat daripada sumber.
- issue: Nuansa εὐλαβηθεὶς
  choice: dengan rasa takut dan hormat
  alternative: karena digerakkan oleh rasa takut kepada Allah; dengan penuh hormat
  rationale: Istilah ini mengandung respons gentar yang saleh. Terjemahan utama mempertahankan ketegangan antara takut dan hormat, alih-alih mereduksinya menjadi teror atau kesopanan saja.
- issue: Acuan δι’ ἧς
  choice: melalui bahtera itu
  alternative: melalui iman atau tanggapan taat Nuh
  rationale: Anteseden gramatikal terdekat yang cocok dalam gender ialah κιβωτός, sehingga bahtera merupakan acuan paling alami. Namun, alur pasal memungkinkan sebagian pembaca memahami sarana itu secara lebih luas sebagai iman yang diwujudkan dalam ketaatan.
- issue: Makna δικαιοσύνη
  choice: kebenaran
  alternative: keadilan
  rationale: Dalam ungkapan warisan dan kaitannya dengan iman, 'kebenaran' paling baik mencakup status atau hubungan yang benar. 'Keadilan' tetap mungkin secara leksikal, tetapi kurang cocok dengan konteks langsung ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur kalimat dibagi menjadi dua agar tidak terlalu berat. Istilah mapan 'bahtera', 'iman', 'kebenaran', dan 'ahli waris' dipertahankan, sementara ambiguitas penting dijelaskan dalam catatan kaki.
