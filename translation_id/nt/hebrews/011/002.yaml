  text: For by this the elders received approval[a][b][c].
translation:
  language: id
  text: Sebab oleh iman itulah orang-orang zaman dahulu mendapat kesaksian yang baik[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mendapat pujian” atau “diakui.” Kata kerja Yunani ini berarti menerima kesaksian yang menguntungkan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “oleh hal ini”; maksudnya, oleh iman yang dibicarakan dalam ayat sebelumnya.'
    reason: cross_reference
  - marker: c
    text: 'Atau: “para pendahulu” atau “orang-orang terdahulu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύτῃ
  choice: oleh iman itulah
  rationale: Frasa ini secara alami merujuk kembali kepada πίστις (‘iman’) dalam ayat 1. ‘Oleh ... itulah’ menyampaikan fungsi instrumental ἐν sekaligus mempertahankan penekanan demonstratif ταύτῃ.
- source_word: γὰρ
  choice: sebab
  rationale: Partikel ini memperkenalkan penjelasan yang mendasari pernyataan sebelumnya; ‘sebab’ mempertahankan hubungan argumentatif itu secara ringkas dan wajar.
- source_word: ἐμαρτυρήθησαν
  choice: mendapat kesaksian yang baik
  rationale: Bentuk pasif μαρτυρέω di sini menyatakan bahwa mereka menerima kesaksian yang menguntungkan atau pujian. Ungkapan ini mempertahankan citra ‘kesaksian’ tanpa menyebut secara eksplisit pemberi kesaksian yang tidak disebut dalam ayat ini.
- source_word: οἱ πρεσβύτεροι
  choice: orang-orang zaman dahulu
  rationale: Dalam konteks Ibrani 11, ungkapan ini menunjuk kepada tokoh-tokoh beriman dari generasi terdahulu, bukan khusus kepada pemegang jabatan penatua. Pilihan ini alami dan menghindari salah pengertian kelembagaan.
theological_decisions:
- issue: Acuan ταύτῃ
  choice: Merujuk kepada iman yang dibicarakan dalam ayat 1.
  alternative: Merujuk secara lebih luas kepada kenyataan yang baru saja diuraikan dalam ayat 1.
  rationale: Bentuk feminin tunggal ταύτῃ secara alami bersesuaian dengan πίστις, dan alur pasal ini menampilkan iman sebagai sarana yang melaluinya orang-orang dahulu menerima kesaksian yang baik.
- issue: Pemberi kesaksian dalam ἐμαρτυρήθησαν
  choice: Tidak dinyatakan secara eksplisit dalam teks utama.
  alternative: Mengeksplisitkan bahwa Allah yang memberikan pengakuan atau pujian.
  rationale: Konteks pasal mendukung Allah sebagai sumber kesaksian yang baik, tetapi ayat ini sendiri tidak menyebut subjek pelakunya. Terjemahan mempertahankan bentuk pasif dan tidak menambahkan subjek.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Orang-orang zaman dahulu’ dipilih daripada ‘para penatua’ agar pembaca tidak mengira bahwa ayat ini membicarakan jabatan gerejawi. Ungkapan ‘kesaksian yang baik’ mempertahankan metafora hukum dan sosial dari μαρτυρέω serta tetap membiarkan pemberi kesaksian tersirat.
