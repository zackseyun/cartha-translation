id: HEB.11.23
reference: Hebrews 11:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πίστει Μωϋσῆς γεννηθεὶς ἐκρύβη τρίμηνον ὑπὸ τῶν πατέρων αὐτοῦ, διότι εἶδον ἀστεῖον τὸ παιδίον καὶ οὐκ ἐφοβήθησαν τὸ διάταγμα τοῦ βασιλέως.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/023.yaml
  text: By faith Moses[a], when he was born, was hidden for three months by his parents, because they saw that the child was beautiful, and they were not afraid of the king’s edict.
translation:
  language: id
  text: Dengan iman, Musa, ketika ia lahir, disembunyikan selama tiga bulan oleh orang tuanya, karena mereka melihat bahwa anak itu indah[a] dan tidak takut pada perintah raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “rupawan” atau “istimewa.” Kata Yunani ἀστεῖον menggemakan Keluaran 2:2 dan Kisah Para Rasul 7:20.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Karena iman
  rationale: Datif sarana yang membuka pola berulang dalam Ibrani 11. Ungkapan ini menyatakan bahwa iman menjadi dasar atau sarana tindakan tersebut dalam bahasa Indonesia yang alami.
- source_word: Μωϋσῆς γεννηθεὶς
  choice: setelah Musa lahir
  rationale: Partisip aoris pasif dipahami secara temporal. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan urutan bahwa penyembunyian terjadi sesudah kelahirannya.
- source_word: ἐκρύβη τρίμηνον
  choice: ia disembunyikan ... selama tiga bulan
  rationale: Bentuk pasif dipertahankan, sedangkan durasi dinyatakan secara idiomatis dengan 'selama tiga bulan'.
- source_word: ὑπὸ τῶν πατέρων αὐτοῦ
  choice: oleh orang tuanya
  rationale: Walaupun πατέρων secara harfiah berarti 'bapak-bapak', dalam konteks ini bentuk jamak tersebut merujuk secara kolektif kepada ayah dan ibu Musa.
- source_word: διότι εἶδον ἀστεῖον τὸ παιδίον
  choice: Mereka melihat bahwa anak itu elok
  rationale: Terjemahan ini mempertahankan tindakan konkret 'melihat' dan memakai 'elok' untuk sifat anak yang menarik atau istimewa, tanpa menyatakan bahwa penampilannya merupakan tanda adikodrati.
- source_word: οὐκ ἐφοβήθησαν
  choice: mereka tidak takut
  rationale: Padanan langsung dan alami yang mempertahankan pertentangan antara iman dan ketakutan.
- source_word: τὸ διάταγμα τοῦ βασιλέως
  choice: ketetapan raja
  rationale: διάταγμα menunjuk pada perintah atau keputusan resmi. 'Ketetapan raja' mempertahankan sifat resminya dengan ragam bahasa yang bermartabat.
theological_decisions:
- issue: Dasar tindakan orang tua Musa
  choice: Tindakan menyembunyikan Musa disajikan di bawah tema iman, disertai pengamatan bahwa anak itu elok dan keberanian untuk tidak takut terhadap ketetapan raja.
  alternative: Keelokan anak itu saja menjadi alasan tindakan mereka, atau penampilannya merupakan tanda ilahi khusus.
  rationale: Susunan ayat menempatkan seluruh tindakan di bawah 'karena iman', lalu menyebut mereka melihat anak itu elok dan tidak takut terhadap ketetapan raja. Terjemahan mempertahankan unsur-unsur tersebut tanpa menambahkan klaim mengenai tanda adikodrati.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar jelas bagi pembaca umum tanpa mengubah hubungan maknanya.
