revisions:
- from: Karena iman, setelah Musa lahir, ia disembunyikan oleh orang tuanya selama tiga bulan. Mereka melihat bahwa anak itu elok[a], dan mereka tidak takut terhadap ketetapan raja.
  to: Dengan iman, Musa, ketika ia lahir, disembunyikan selama tiga bulan oleh orang tuanya, karena mereka melihat bahwa anak itu indah[a] dan tidak takut pada perintah raja.
  rationale: Revisi membetulkan nuansa instrumental Πίστει dan hubungan temporal γεννηθείς, sambil mempertahankan pasif 'disembunyikan,' durasi tiga bulan, kedua unsur alasan ('melihat' dan 'tidak takut'), serta ambiguitas wajar ἀστεῖον. Catatan kaki tetap terikat pada 'indah[a]' dan memberikan alternatif leksikal tanpa menafsirkan penampilan Musa sebagai tanda adikodrati.
