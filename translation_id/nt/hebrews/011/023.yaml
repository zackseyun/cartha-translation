review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan untuk memperbaiki Πίστει. Frasa 'Karena iman' cenderung menyatakan sebab atau dasar alasan, sedangkan datif instrumental Yunani dalam pola Ibrani 11 lebih tepat diterjemahkan 'Dengan iman.' 'Ketika ia lahir' juga lebih dekat dengan fungsi temporal γεννηθείς daripada 'setelah Musa lahir,' yang dapat memberi kesan urutan waktu yang lebih tegas. Selebihnya, pasif, durasi, pelaku kolektif 'orang tuanya,' kedua alasan yang diperkenalkan διότι, dan sifat resmi διάταγμα telah terwakili dengan baik.
  naturalness: Teks revisi memakai bahasa Indonesia baku modern dan tetap mengalir. 'Indah' lebih lazim untuk ἀστεῖον daripada 'elok,' tanpa menghilangkan kemungkinan makna 'rupawan' atau 'istimewa' dalam catatan kaki. Susunan satu kalimat mempertahankan keterkaitan sebab dalam kalimat Yunani.
  terminology: Gunakan 'Dengan iman' untuk motif berulang dalam Ibrani 11. Nama 'Musa,' 'orang tuanya,' dan 'perintah raja' adalah padanan yang jelas dan sesuai register. 'Perintah raja' menyampaikan daya mengikat διάταγμα tanpa menambahkan rincian historis atau teologis.
  issues:
  - severity: medium
    issue: '''Karena iman'' untuk Πίστει'
    rationale: Dalam konteks ini Πίστει adalah datif sarana/instrumen yang memperkenalkan pola berulang dalam Ibrani 11. 'Dengan iman' mempertahankan fungsi tersebut lebih langsung; 'karena iman' lebih mudah dipahami sebagai klausa sebab.
  - severity: low
    issue: '''setelah Musa lahir'' untuk γεννηθείς'
    rationale: Partisip aoris ini berfungsi temporal dan paling aman diterjemahkan 'ketika ia lahir.' 'Setelah' bukan mustahil, tetapi dapat menguatkan urutan pascakelahiran yang tidak perlu.
  - severity: low
    issue: '''elok'' kurang lazim dalam ragam Indonesia modern umum'
    rationale: '''Indah'' adalah padanan modern yang alami untuk ἀστεῖον di teks utama; alternatif leksikal tetap dapat dijaga dalam catatan kaki.'
