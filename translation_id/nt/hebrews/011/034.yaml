  text: ἔσβεσαν δύναμιν πυρός, ἔφυγον στόματα ⸀μαχαίρης, ⸀ἐδυναμώθησαν ἀπὸ ἀσθενείας, ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ, παρεμβολὰς ἔκλιναν ἀλλοτρίων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/034.yaml
  text: quenched the power of fire[a], escaped the edge of the sword, were made strong out of weakness, became mighty in battle[b], put foreign armies to flight.
translation:
  language: id
  text: memadamkan kekuatan api, luput dari mata pedang[a], dari keadaan lemah dijadikan kuat, menjadi perkasa dalam pertempuran, dan membuat bala tentara asing mundur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mulut pedang,” suatu ungkapan yang berarti mata atau sisi tajam pedang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “perkemahan-perkemahan orang asing”; dalam konteks militer, istilah ini menunjuk kepada bala tentara asing.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσβεσαν δύναμιν πυρός
  choice: memadamkan kekuatan api
  rationale: Mempertahankan verba konkret ‘memadamkan’ serta unsur δύναμις, sehingga ungkapan Yunani tidak diratakan menjadi sekadar ‘memadamkan api’.
- source_word: ἔφυγον στόματα μαχαίρης
  choice: luput dari mata pedang
  rationale: ἔφυγον dalam konteks ini menyatakan berhasil lolos, sedangkan ‘mata pedang’ merupakan padanan idiomatis Indonesia bagi ungkapan harfiah ‘mulut pedang’.
- source_word: ἐδυναμώθησαν ἀπὸ ἀσθενείας
  choice: dari keadaan lemah dijadikan kuat
  rationale: Susunan ini mempertahankan ἀπό sebagai titik asal dan bentuk pasif ἐδυναμώθησαν, yang menunjukkan bahwa kekuatan itu diterima, bukan dihasilkan sendiri.
- source_word: ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ
  choice: menjadi perkasa dalam pertempuran
  rationale: ‘Menjadi perkasa’ menyatakan perubahan keadaan, dan ‘dalam pertempuran’ menyampaikan konteks militer secara alami.
- source_word: παρεμβολὰς ἔκλιναν ἀλλοτρίων
  choice: membuat bala tentara asing mundur
  rationale: Dalam konteks militer, παρεμβολή dapat menunjuk kepada pasukan yang berkemah; ἔκλιναν menyatakan bahwa mereka menyebabkan pasukan itu berbalik atau mundur.
theological_decisions:
- issue: Tingkat kelugasan dalam rangkaian tindakan penyelamatan dan kemenangan oleh iman
  choice: Mempertahankan gambaran historis dan militer yang konkret tanpa merohanikannya
  alternative: Mengungkapkannya secara umum sebagai kemenangan atas bahaya dan musuh
  rationale: Ayat ini menyebut api, pedang, kelemahan, pertempuran, dan bala tentara sebagai tindakan serta bahaya konkret. Terjemahan tidak mengubahnya menjadi kemenangan rohani yang abstrak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk-bentuk verba disusun sebagai rangkaian yang ringkas agar selaras dengan gaya katalog dalam konteks Ibrani 11, sementara bentuk pasif dan gambaran militernya tetap dipertahankan.
