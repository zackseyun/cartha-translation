  text: λογισάμενος ὅτι καὶ ἐκ νεκρῶν ἐγείρειν δυνατὸς ὁ θεός· ὅθεν αὐτὸν καὶ ἐν παραβολῇ ἐκομίσατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/019.yaml
  text: having considered that God is able even to raise from the dead[a], from where, in a figure[b], he also received him back.
translation:
  language: id
  text: Ia berkeyakinan bahwa Allah sanggup bahkan membangkitkan orang dari antara orang mati. Dari situ[a], secara kiasan[b], ia juga menerima Ishak kembali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari sana” atau “karena itu”.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam suatu perumpamaan”. Abraham menerima Ishak kembali seolah-olah dari kematian; ungkapan ini menyatakan hubungan figuratif atau ilustratif, bukan melaporkan kebangkitan Ishak secara harfiah.
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισάμενος
  choice: Ia memperhitungkan
  rationale: Mengungkapkan proses pertimbangan batin Abraham, tanpa menjadikannya sekadar dugaan atau kesimpulan yang terlalu tegas.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Mempertahankan nuansa bentuk jamak Yunani dan merupakan ungkapan kebangkitan yang jelas dalam bahasa Indonesia.
- source_word: ἐγείρειν
  choice: membangkitkan
  rationale: Dalam konteks ini verba tersebut mengacu pada kebangkitan dari kematian, bukan sekadar membangunkan.
- source_word: δυνατὸς ὁ θεός
  choice: Allah sanggup
  rationale: Mencerminkan konstruksi predikatif Yunani secara ringkas dan alami.
- source_word: ὅθεν
  choice: Karena itu
  rationale: Dalam konteks ini paling wajar dipahami sebagai penghubung yang menyatakan akibat atau kesimpulan; kemungkinan makna asal/tempat tetap dicatat dalam catatan kaki.
- source_word: ἐν παραβολῇ
  choice: secara kiasan
  rationale: Menunjukkan bahwa Abraham menerima Ishak kembali seolah-olah dari kematian, tanpa menyatakan bahwa kebangkitan harfiah telah terjadi.
- source_word: ἐκομίσατο
  choice: ia juga menerima Ishak kembali
  rationale: Bentuk tengah dan konteks kisah mendukung arti memperoleh atau menerima kembali; nama Ishak dipakai agar rujukan pronomina jelas dalam bahasa Indonesia.
- source_word: καὶ ἐκ νεκρῶν
  choice: bahkan ... dari antara orang mati
  rationale: καί bersifat intensif dan menekankan bahwa kuasa Allah mencakup bahkan kebangkitan orang mati.
- source_word: καὶ ἐν παραβολῇ ἐκομίσατο
  choice: secara kiasan, ia juga menerima ... kembali
  rationale: καί kedua bersifat aditif dan diterjemahkan dengan 'juga'.
theological_decisions:
- issue: Sifat kembalinya Ishak kepada Abraham
  choice: Abraham menerima Ishak kembali secara kiasan, seolah-olah dari kematian, bukan melalui kebangkitan harfiah.
  alternative: Ungkapan itu dapat dibaca sebagai 'dalam suatu perumpamaan', dengan penekanan pada fungsi tipologis kisah tersebut.
  rationale: ἐν παραβολῇ menandai hubungan analogis atau figuratif. Terjemahan tidak merinci tipologi tertentu yang tidak dinyatakan langsung oleh ayat.
- issue: Hubungan ὅθεν dengan klausa sebelumnya
  choice: Diterjemahkan secara inferensial sebagai 'Karena itu'.
  alternative: Dapat dipahami secara lebih harfiah sebagai 'dari sana' atau 'dari mana'.
  rationale: Makna inferensial menghasilkan bahasa Indonesia yang alami dan sesuai alur pemikiran, sedangkan ambiguitas leksikalnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, sementara istilah kebangkitan dan sifat kiasan peristiwa tetap dipertahankan.
