revisions:
- from: Ia memperhitungkan bahwa Allah sanggup bahkan membangkitkan orang dari antara orang mati. Karena itu[a], secara kiasan[b], ia juga menerima Ishak kembali.
  to: Ia berkeyakinan bahwa Allah sanggup bahkan membangkitkan orang dari antara orang mati. Dari situ[a], secara kiasan[b], ia juga menerima Ishak kembali.
  rationale: Revisi mengganti ungkapan yang kurang alami bagi proses penalaran Abraham, memelihara keluasan semantis ὅθεν, dan melunakkan catatan interpretatif agar tidak melampaui apa yang dinyatakan teks. Susunan, istilah kebangkitan, nama Ishak, dan penanda catatan kaki tetap jelas serta sesuai register baku modern.
