revisions:
- from: Karena iman, mereka menyeberangi Laut Merah[a] seperti melintasi tanah kering. Namun, ketika orang-orang Mesir mencoba melakukan hal yang sama, mereka ditelan oleh laut itu.
  to: Dengan iman, mereka menyeberangi Laut Merah[a] seolah-olah melalui tanah kering; orang-orang Mesir, ketika mencoba melakukannya, ditelan.
  rationale: Revisi memakai «Dengan iman» untuk mempertahankan fungsi instrumental Πίστει, mempertahankan perbandingan ὡς dengan «seolah-olah», dan menerjemahkan πεῖραν λαβόντες secara alami sebagai «ketika mencoba melakukannya». Agen yang tidak disebutkan dibuang dari «ditelan», sehingga daya gambaran pasif κατεπόθησαν tetap terjaga tanpa penambahan. Catatan kaki tetap menjelaskan perbedaan antara istilah Yunani ayat ini dan alternatif nama tempat dalam diskusi Keluaran.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:03:08Z'
review_pass:
  verdict: revise
  source_fidelity: Draf secara umum menyampaikan tindakan menyeberang, perbandingan dengan tanah kering, percobaan orang Mesir, dan akibat pasif καταπίνω. Namun, «Karena iman» lebih kausal daripada datif instrumental Πίστει; «Dengan iman» lebih langsung. Penambahan eksplisit «oleh laut itu» tidak dinyatakan dalam teks Yunani, yang hanya memakai pasif «ditelan».
  naturalness: Bahasa draf cukup alami, tetapi pemisahan dengan «Namun» dan penambahan agen «oleh laut itu» membuat hubungan sumber sedikit lebih interpretatif. Kalimat revisi tetap baku dan lugas serta menyatakan hubungan antarklausa tanpa menambahkan agen atau konjungsi adversatif eksplisit.
  terminology: «Iman», «Laut Merah», dan «orang-orang Mesir» tepat. Catatan kaki perlu dibatasi pada alternatif «Laut Teberau» sebagai padanan bagi “Reed Sea”; menyandingkannya dengan «Laut Gelagah» tidak diperlukan dan kurang mantap sebagai nama tempat baku dalam catatan ini.
  issues:
  - severity: medium
    issue: «Karena iman» untuk Πίστει
    rationale: 'Datif Πίστει terutama menyatakan sarana: “Dengan iman.” «Karena iman» dapat dibaca sebagai sebab atau alasan dan kurang langsung mencerminkan konstruksi Yunani.'
  - severity: medium
    issue: Penambahan «oleh laut itu»
    rationale: κατεπόθησαν adalah pasif, “mereka ditelan,” tanpa agen yang dinyatakan. Laut memang tersirat oleh peristiwa Keluaran, tetapi penambahan agen dalam teks utama melampaui ungkapan Yunani.
  - severity: low
    issue: «Namun» sebagai penghubung eksplisit
    rationale: Klausa Yunani hanya berlanjut dari penyeberangan beriman kepada upaya orang Mesir. Kontrasnya jelas dari hasilnya, tetapi tidak perlu ditandai dengan adversatif eksplisit.
  - severity: low
    issue: Catatan kaki mencantumkan dua alternatif yang tidak sama kedudukannya
    rationale: Jejak audit Inggris hanya mempertahankan alternatif “Reed Sea.” «Laut Teberau» cukup untuk menyatakan alternatif tersebut secara lazim dalam bahasa Indonesia.
  revised_text: Dengan iman, mereka menyeberangi Laut Merah[a] seolah-olah melalui tanah kering; orang-orang Mesir, ketika mencoba melakukannya, ditelan.
