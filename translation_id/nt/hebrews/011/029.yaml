  text: Πίστει διέβησαν τὴν Ἐρυθρὰν Θάλασσαν ὡς διὰ ξηρᾶς ⸀γῆς, ἧς πεῖραν λαβόντες οἱ Αἰγύπτιοι κατεπόθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/029.yaml
  text: By faith they crossed the Red Sea as through dry land[a], of which the Egyptians, when they attempted it, were swallowed up.
translation:
  language: id
  text: Dengan iman, mereka menyeberangi Laut Merah[a] seolah-olah melalui tanah kering; orang-orang Mesir, ketika mencoba melakukannya, ditelan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Laut Teberau.” Teks Yunani di sini berbunyi “Laut Merah” (Ἐρυθρὰν Θάλασσαν), sedangkan nama tempat yang mendasari kisah Keluaran kadang dipahami sebagai “Laut Teberau.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Karena iman
  rationale: Datif ini menyatakan sarana atau dasar tindakan. Rumusan ini mempertahankan pola utama dalam Ibrani 11 dan terdengar alami dalam bahasa Indonesia.
- source_word: διέβησαν
  choice: mereka menyeberangi
  rationale: Kata kerja ini menunjuk pada perjalanan dari satu sisi ke sisi lain; “menyeberangi” tepat dan wajar dalam konteks laut.
- source_word: τὴν Ἐρυθρὰν Θάλασσαν
  choice: Laut Merah
  rationale: Teks Yunani secara eksplisit memakai sebutan yang secara harfiah dan konvensional berarti “Laut Merah”. Alternatif berdasarkan nama tempat dalam teks Ibrani Keluaran dicatat dalam catatan kaki.
- source_word: ὡς διὰ ξηρᾶς γῆς
  choice: seperti melintasi tanah kering
  rationale: Mempertahankan unsur perbandingan ὡς dan gagasan bergerak melalui hamparan tanah yang kering, sekaligus memakai susunan Indonesia yang alami.
- source_word: ἧς πεῖραν λαβόντες
  choice: ketika ... mencoba melakukan hal yang sama
  rationale: Ungkapan πεῖραν λαμβάνειν berarti mencoba atau melakukan suatu upaya. “Hal yang sama” menyampaikan rujukan ἧς kepada penyeberangan tersebut tanpa konstruksi relatif yang kaku dalam bahasa Indonesia.
- source_word: οἱ Αἰγύπτιοι
  choice: orang-orang Mesir
  rationale: Sebutan kebangsaan yang langsung; dalam konteks kisah Keluaran, kelompok ini adalah pasukan Mesir yang mengejar Israel.
- source_word: κατεπόθησαν
  choice: mereka ditelan oleh laut itu
  rationale: Mempertahankan gambaran kuat verba pasif καταπίνω, “ditelan”, alih-alih mempersempitnya menjadi “tenggelam”. Penambahan “oleh laut itu” membuat pelaku metaforisnya jelas secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna πίστις dalam rumusan berulang Ibrani 11
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Dalam konteks rangkaian teladan Ibrani 11, “iman” merupakan padanan baku dan paling sesuai bagi motif utama pasal ini. Ayat ini tidak memberi alasan kuat untuk memilih makna “kesetiaan”.
- issue: Identitas orang yang menyeberang karena iman
  choice: mempertahankan subjek jamak tersirat sebagai “mereka”
  alternative: menyebut “bangsa Israel” secara eksplisit
  rationale: Bahasa Yunani hanya memberi subjek jamak melalui bentuk verba. “Mereka” menjaga bentuk sumber dan kaitannya dengan konteks, tanpa menambahkan identifikasi ke dalam teks ayat.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Kalimat dibagi menjadi dua agar hubungan kontras dan urutan tindakan mudah dipahami. “Namun” mengungkapkan kontras yang tersirat antara keberhasilan Israel dan kegagalan orang Mesir tanpa menambahkan klaim teologis baru.
