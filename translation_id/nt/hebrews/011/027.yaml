  text: πίστει κατέλιπεν Αἴγυπτον, μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως, τὸν γὰρ ἀόρατον ὡς ὁρῶν ἐκαρτέρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/027.yaml
  text: By faith he left Egypt[a], not fearing the king’s anger[b], for he endured as seeing the One who is invisible.
translation:
  language: id
  text: Dengan iman, ia meninggalkan Mesir[a] dan tidak takut akan kemarahan raja, sebab ia bertekun seolah-olah melihat Yang Tidak Kelihatan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini mungkin menunjuk pada pelarian Musa dari Firaun (Kel. 2) atau pada keluarnya Israel dari Mesir di bawah pimpinan Musa (Kel. 12–14). Bahasa Yunani tidak menentukan peristiwa mana yang dimaksud.
    reason: cross_reference
  - marker: b
    text: Dapat juga diterjemahkan “Dia yang tidak tampak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Karena iman
  rationale: Ungkapan ini mempertahankan pola utama Ibrani 11 dan menyatakan bahwa tindakan Musa bersumber dari iman. Dalam bahasa Indonesia, “karena iman” lebih alami daripada bentuk harfiah yang kaku.
- source_word: κατέλιπεν Αἴγυπτον
  choice: ia meninggalkan Mesir
  rationale: καταλείπω di sini menyatakan tindakan pergi atau meninggalkan. Pilihan ini langsung dan tidak menambahkan gagasan “menelantarkan” atau “meninggalkan untuk selamanya”.
- source_word: μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως
  choice: tanpa takut pada murka raja
  rationale: Bentuk partisipial diterjemahkan sebagai keterangan keadaan yang alami dalam bahasa Indonesia. θυμός menunjuk pada kemarahan yang kuat; “murka” sesuai dengan bobot ungkapan tersebut tanpa perlu diperkeras menjadi “amukan”.
- source_word: τὸν ἀόρατον
  choice: Dia yang tidak kelihatan
  rationale: Kata sifat berartikel ini dipakai secara substantival dan menunjuk pada Pribadi. Pilihan tersebut alami dalam bahasa Indonesia serta mempertahankan paradoks antara melihat dan ketidaklihatan.
- source_word: ὡς ὁρῶν
  choice: seperti orang yang melihat
  rationale: Terjemahan ini mempertahankan daya pembanding ὡς tanpa menyiratkan bahwa penglihatan itu palsu atau tidak nyata, sebagaimana dapat tersirat dalam “seolah-olah”.
- source_word: ἐκαρτέρησεν
  choice: ia tetap teguh
  rationale: καρτερέω menyatakan ketabahan atau ketekunan yang kukuh. “Tetap teguh” lebih jelas dalam konteks ini daripada “bertahan,” yang dapat dipahami hanya sebagai bertahan hidup.
theological_decisions:
- issue: Peristiwa yang dimaksud dengan meninggalkan Mesir
  choice: Teks utama tidak menentukan apakah yang dimaksud ialah pelarian Musa dalam Keluaran 2 atau keberangkatan Israel yang dipimpinnya dalam Keluaran 12–14.
  alternative: Menetapkan salah satu peristiwa secara eksplisit dalam terjemahan.
  rationale: Bahasa Yunani hanya menyatakan bahwa ia meninggalkan Mesir. Karena kedua kemungkinan dibahas dalam penafsiran dan teks tidak memperincinya, ambiguitas itu dipertahankan serta dijelaskan dalam catatan kaki.
- issue: Cara Musa “melihat” Dia yang tidak kelihatan
  choice: Mempertahankan perbandingan paradoksal “seperti orang yang melihat” tanpa menjelaskan mekanismenya.
  alternative: Menambahkan bahwa Musa melihat dengan mata iman atau menganggap penglihatan itu hanya kiasan.
  rationale: Teks menghubungkan keteguhan Musa dengan tindakan seakan berada dalam posisi orang yang melihat Dia yang tidak kelihatan, tetapi tidak menjelaskan sifat penglihatan tersebut. Terjemahan tidak memasukkan rumusan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dijaga ringkas serta mudah dipahami. “Ia” dipakai untuk kesinambungan narasi, sedangkan “Dia” menandai rujukan personal kepada Allah tanpa menambahkan nama yang tidak muncul dalam teks Yunani.
