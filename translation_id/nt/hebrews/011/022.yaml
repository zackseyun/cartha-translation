  text: πίστει Ἰωσὴφ τελευτῶν περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐμνημόνευσεν, καὶ περὶ τῶν ὀστέων αὐτοῦ ἐνετείλατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/022.yaml
  text: By faith Joseph, as he was nearing the end of his life, mentioned the exodus of the sons of Israel and gave instructions concerning his bones.
translation:
  language: id
  text: Dengan iman, Yusuf, menjelang ajalnya,[a] menyebut tentang keluarnya anak-anak Israel[b] dan memberi perintah mengenai tulang-tulangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ketika sedang menghadapi kematian.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “anak-anak lelaki Israel”; maksudnya umat keturunan Israel (Yakub).'
    reason: source_form
lexical_decisions:
- source_word: πίστει
  choice: Karena iman
  rationale: Mempertahankan pola berulang dalam Ibrani 11 dan menyatakan iman sebagai dasar yang mendorong tindakan Yusuf.
- source_word: τελευτῶν
  choice: ketika mendekati akhir hidupnya
  rationale: Mengungkapkan tindakan yang berlangsung menjelang kematian Yusuf secara alami dan bermartabat; arti yang lebih langsung, 'ketika sedang menghadapi kematian', dicatat sebagai alternatif.
- source_word: περὶ τῆς ἐξόδου
  choice: keluarnya
  rationale: Dalam konteks ini menunjuk pada keluarnya umat Israel dari Mesir, tetapi kata Indonesia yang umum ini juga mempertahankan arti dasar 'keberangkatan/keluar' tanpa bergantung pada istilah teknis.
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: keturunan Israel
  rationale: Mengungkapkan hubungan kekeluargaan dalam frasa Yunani secara wajar dalam bahasa Indonesia dan mencakup umat yang berasal dari Israel (Yakub), tanpa menimbulkan kesan bahwa hanya laki-laki yang dimaksud.
- source_word: ἐμνημόνευσεν
  choice: menyebut
  rationale: Dengan konstruksi περὶ, verba ini berarti menyebut atau berbicara mengenai sesuatu, bukan sekadar mengingat dalam batin.
- source_word: ἐνετείλατο
  choice: memberi perintah
  rationale: Mencerminkan kekuatan verba yang berarti memerintahkan atau memberikan instruksi, dalam ungkapan Indonesia yang jelas.
- source_word: περὶ τῶν ὀστέων αὐτοῦ
  choice: mengenai tulang-tulangnya
  rationale: Mempertahankan gambaran konkret 'tulang-tulang', sesuai permintaan Yusuf agar tulang-tulangnya dibawa keluar dari Mesir.
theological_decisions:
- issue: Makna πίστις dalam Ibrani 11
  choice: iman
  alternative: kesetiaan; kepercayaan
  rationale: Rumus berulang dalam pasal ini menonjolkan iman yang mendasari tindakan para leluhur. 'Iman' merupakan padanan baku dan paling sesuai di sini.
- issue: Identitas υἱῶν Ἰσραήλ
  choice: keturunan Israel
  alternative: anak-anak Israel; orang Israel
  rationale: Pilihan ini mempertahankan dimensi kekerabatan dari ungkapan Yunani sambil menyampaikan bahwa seluruh umat Israel, bukan hanya laki-laki, dimaksud.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Susunan kalimat mengikuti alur Yunani tanpa menjadi kaku. 'Karena iman' dipilih sebagai ungkapan Indonesia yang alami untuk datif instrumental πίστει.
