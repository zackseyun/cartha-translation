id: HEB.11.9
reference: Hebrews 11:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πίστει παρῴκησεν εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν, ἐν σκηναῖς κατοικήσας μετὰ Ἰσαὰκ καὶ Ἰακὼβ τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/009.yaml
  text: By faith he lived as a foreigner in the land of promise[a], as in a foreign land, dwelling in tents with Isaac and Jacob, fellow heirs of the same promise.
translation:
  language: id
  text: Karena iman, ia tinggal sebagai pendatang di negeri yang dijanjikan[a], seolah-olah di negeri asing. Ia tinggal dalam kemah-kemah bersama Ishak dan Yakub, sesama ahli waris atas janji yang sama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Karena iman, ia tinggal sebagai pendatang di negeri perjanjian, seperti di negeri asing.”'
    reason: Alternatif ini memakai ungkapan yang lebih harfiah “negeri perjanjian” dan menerjemahkan ὡς ἀλλοτρίαν dengan perbandingan “seperti,” sambil mempertahankan nuansa παρῴκησεν sebagai tinggal sebagai pendatang.
lexical_decisions:
- source_word: πίστει
  choice: Karena iman
  rationale: Datif ini menyatakan sarana atau dasar tindakan. Dalam konteks Ibrani 11, “karena iman” merupakan ungkapan Indonesia yang alami dan mempertahankan penekanan berulang pada iman.
- source_word: παρῴκησεν
  choice: ia tinggal sebagai pendatang
  rationale: Kata kerja ini menunjuk pada hidup di suatu tempat sebagai orang luar yang tidak memiliki kedudukan tetap; “tinggal sebagai pendatang” jelas dan alami dalam bahasa Indonesia modern.
- source_word: εἰς γῆν τῆς ἐπαγγελίας
  choice: di negeri yang dijanjikan
  rationale: Dengan kata kerja yang menyatakan tempat tinggal, εἰς dapat berfungsi secara idiomatis untuk lokasi. Frasa ini menyampaikan bahwa negeri tersebut adalah negeri yang menjadi isi janji, tanpa mengubahnya menjadi istilah teknis.
- source_word: ὡς ἀλλοτρίαν
  choice: seolah-olah di negeri asing
  rationale: ἀλλοτρίαν berarti milik orang lain atau asing. Terjemahan ini mempertahankan unsur perbandingan ὡς dan gagasan bahwa Abraham hidup di negeri itu seperti di tempat yang bukan miliknya.
- source_word: ἐν σκηναῖς κατοικήσας
  choice: Ia tinggal dalam kemah-kemah
  rationale: Partisip ini menerangkan keadaan atau cara ia hidup di negeri itu. Kalimat tersendiri menghasilkan bahasa Indonesia yang lebih wajar sambil mempertahankan gambaran konkret tentang tempat tinggal yang tidak permanen.
- source_word: μετὰ Ἰσαὰκ καὶ Ἰακὼβ
  choice: bersama Ishak dan Yakub
  rationale: μετά dengan genitif berarti “bersama”; bentuk nama mengikuti ejaan Alkitab Indonesia yang lazim.
- source_word: τῶν συγκληρονόμων
  choice: yang turut menjadi ahli waris
  rationale: Istilah ini menyatakan orang-orang yang bersama-sama menerima warisan. Ungkapan tersebut alami dan mempertahankan unsur kebersamaan.
- source_word: τῆς ἐπαγγελίας τῆς αὐτῆς
  choice: dari janji yang sama
  rationale: Susunan ini menegaskan bahwa Ishak dan Yakub berbagi janji yang identik dengan janji kepada Abraham. “Janji yang sama” menyampaikan identitas itu tanpa penambahan tafsir.
theological_decisions:
- issue: Subjek tersirat
  choice: Kata ganti “ia” merujuk kepada Abraham dari ayat sebelumnya.
  alternative: Mengulang nama “Abraham” dalam teks.
  rationale: Bahasa Yunani tidak menyebut nama itu kembali, tetapi kesinambungan dengan Ibrani 11:8 membuat rujukannya jelas. Kata ganti mempertahankan bentuk wacana sumber.
- issue: Hubungan Abraham dengan negeri yang dijanjikan
  choice: Mempertahankan ketegangan bahwa ia berada di negeri yang dijanjikan tetapi hidup di sana seolah-olah di negeri asing.
  alternative: Menjelaskan bahwa negeri itu belum menjadi miliknya.
  rationale: Teks menampilkan ketegangan antara janji dan pengalaman Abraham tanpa menerangkan lebih lanjut status kepemilikannya; terjemahan tidak boleh menyelesaikan ketegangan itu secara tafsiriah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Pendatang” dipilih daripada “orang asing” untuk menonjolkan status tinggal sebagai orang luar, sedangkan “kemah-kemah” mempertahankan bentuk jamak sumber. Teks utama memakai dua kalimat agar susunannya alami dan mudah dipahami.
