id: HEB.11.28
reference: Hebrews 11:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πίστει πεποίηκεν τὸ πάσχα καὶ τὴν πρόσχυσιν τοῦ αἵματος, ἵνα μὴ ὁ ὀλοθρεύων τὰ πρωτότοκα θίγῃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/028.yaml
  text: By faith he has kept the Passover and the sprinkling of the blood[a], so that the destroyer of the firstborn might not touch them.
translation:
  language: id
  text: Dengan iman, ia melaksanakan Paskah dan memercikkan darah itu[a], supaya pembinasa itu tidak menyentuh anak-anak sulung mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membubuhkan darah itu.” Istilah Yunani menunjuk pada tindakan menempatkan darah dalam suatu ritual. “Memercikkan” adalah terjemahan ritual yang lazim, sedangkan “membubuhkan” mungkin lebih khusus mencerminkan darah yang ditempatkan pada ambang atas dan kedua tiang pintu dalam peristiwa Paskah.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Karena iman
  rationale: Datif sarana; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan rumusan berulang dalam Ibrani 11.
- source_word: πεποίηκεν τὸ πάσχα
  choice: ia merayakan Paskah
  rationale: Dalam konteks ini ποιέω bersama πάσχα menunjuk pada pelaksanaan perayaan Paskah. 'Merayakan' lebih alami daripada terjemahan harfiah 'melakukan' dan tidak mempersempitnya hanya pada jamuan.
- source_word: τὴν πρόσχυσιν τοῦ αἵματος
  choice: memercikkan darah itu
  rationale: Nomina tindakan Yunani dialihkan menjadi verba agar koordinasinya alami dalam bahasa Indonesia. 'Memercikkan' mempertahankan istilah ritual tradisional, sedangkan kemungkinan makna yang lebih umum, yakni membubuhkan darah, dicatat dalam catatan kaki.
- source_word: ὁ ὀλοθρεύων τὰ πρωτότοκα
  choice: pembinasa anak-anak sulung
  rationale: Partisip substantival diterjemahkan 'pembinasa' tanpa menambahkan identitas sebagai malaikat, yang tidak dinyatakan dalam teks Yunani. τὰ πρωτότοκα diterjemahkan secara luas sebagai 'anak-anak sulung' sesuai konteks tulah Paskah.
- source_word: θίγῃ αὐτῶν
  choice: tidak menyentuh mereka
  rationale: '''Menyentuh'' mempertahankan arti langsung θιγγάνω dan daya alusinya, tanpa menjelaskan secara berlebihan bahwa sentuhan itu mematikan.'
theological_decisions:
- issue: Subjek tersirat dari πεποίηκεν
  choice: Kata ganti 'ia', yang dalam konteks merujuk kepada Musa
  alternative: Menyebut 'Musa' secara eksplisit
  rationale: Ayat-ayat sekitar membicarakan Musa, tetapi teks Yunani hanya meneruskan subjek tersirat. Kata ganti mempertahankan bentuk ringkas sumber.
- issue: Makna πίστις
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Tema berulang Ibrani 11 dengan jelas mendukung 'iman'; 'kesetiaan' tidak dipaksakan ke dalam konteks ini.
- issue: Identitas ὁ ὀλοθρεύων
  choice: pembinasa
  alternative: malaikat pembinasa
  rationale: Teks menyebut pelaku berdasarkan tindakannya, bukan secara eksplisit sebagai malaikat; terjemahan tidak menambahkan identifikasi teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur dibuat ringkas agar sesuai dengan pola retoris Ibrani 11. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang diterangkan.
