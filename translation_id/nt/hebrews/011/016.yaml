id: HEB.11.16
reference: Hebrews 11:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: νῦν δὲ κρείττονος ὀρέγονται, τοῦτ’ ἔστιν ἐπουρανίου. διὸ οὐκ ἐπαισχύνεται αὐτοὺς ὁ θεὸς θεὸς ἐπικαλεῖσθαι αὐτῶν, ἡτοίμασεν γὰρ αὐτοῖς πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/016.yaml
  text: But as it is[a], they long for a better country—that is, a heavenly one. Therefore God is not ashamed to be called their God, for he has prepared a city for them.
translation:
  language: id
  text: Namun kenyataannya, mereka merindukan tanah air yang lebih baik, yaitu tanah air surgawi[a]. Karena itu, Allah tidak malu disebut Allah mereka, sebab Ia telah mempersiapkan sebuah kota bagi mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kedua kata sifat Yunani yang diterjemahkan “yang lebih baik” dan “surgawi” tidak disertai kata benda. Kata “tanah air” dipahami dari konteks ayat 14; dapat juga diterjemahkan “negeri.”
    reason: Menjelaskan elipsis dalam teks Yunani dan alternatif leksikal yang sah.
lexical_decisions:
- source_word: νῦν δὲ
  choice: Namun sebenarnya
  rationale: Dalam konteks ini, frasa tersebut menandai kenyataan yang berlawanan dengan kemungkinan yang dibicarakan pada ayat sebelumnya, bukan sekadar waktu sekarang.
- source_word: κρείττονος
  choice: yang lebih baik
  rationale: Mempertahankan makna komparatif dan selaras dengan kosakata perbandingan yang berulang dalam Surat Ibrani.
- source_word: ὀρέγονται
  choice: mereka merindukan
  rationale: Mengungkapkan hasrat yang sungguh-sungguh dan berarah, lebih kuat daripada sekadar 'menginginkan'.
- source_word: κρείττονος ... ἐπουρανίου
  choice: tanah air yang lebih baik, yaitu tanah air surgawi
  rationale: Kedua adjektiva feminin ini mengandaikan πατρίς dari konteks ayat 14. Pengulangan 'tanah air' membuat elipsis Yunani jelas dan alami dalam bahasa Indonesia.
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan atau akibat dari kerinduan mereka akan tanah air surgawi.
- source_word: οὐκ ἐπαισχύνεται
  choice: tidak malu
  rationale: Padanan Indonesia yang langsung dan alami, dengan tetap mempertahankan dimensi kehormatan dalam hubungan tersebut.
- source_word: θεὸς ἐπικαλεῖσθαι αὐτῶν
  choice: disebut Allah mereka
  rationale: Mempertahankan rumusan relasional dan gema formula Perjanjian Lama tanpa memperluasnya menjadi parafrasa teologis.
- source_word: ἡτοίμασεν
  choice: telah mempersiapkan
  rationale: Menyatakan tindakan yang sudah dilakukan dengan hasil yang tetap relevan bagi mereka.
- source_word: πόλιν
  choice: sebuah kota
  rationale: Mempertahankan gambaran eskatologis yang konkret; nomina Yunani tidak memakai artikel sehingga bentuk tak tentu wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Nomina tersirat pada κρείττονος dan ἐπουρανίου
  choice: Memasok 'tanah air' dari πατρίς dalam konteks ayat 14
  alternative: Menerjemahkan 'negeri' atau membiarkannya lebih umum sebagai 'sesuatu yang lebih baik'
  rationale: Bentuk feminin kedua adjektiva menunjuk kembali kepada gagasan πατρίς. 'Tanah air' mempertahankan nuansa tempat asal atau tempat seseorang menjadi bagian darinya, tanpa menambahkan rincian yang tidak ada dalam teks.
- issue: Rumusan perjanjian 'Allah mereka'
  choice: Mempertahankan rumusan relasional secara langsung
  alternative: Memparafrasakan sebagai 'mengakui mereka sebagai umat-Nya'
  rationale: Teks menyatakan bagaimana Allah disebut, bukan secara eksplisit memberikan perluasan lengkap tentang status mereka sebagai umat.
- issue: Hubungan antara kerinduan mereka dan tindakan Allah
  choice: Mempertahankan διὸ sebagai 'Karena itu' dan γὰρ sebagai 'sebab'
  alternative: Melemahkan hubungan menjadi urutan naratif tanpa kaitan inferensial
  rationale: 'Susunan ini mempertahankan ketegangan teks: kerinduan iman mereka diikuti penerimaan Allah, yang didukung oleh kenyataan bahwa Ia telah menyediakan kota bagi mereka.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Namun sebenarnya' menyampaikan kontras logis dengan ayat sebelumnya. 'Tanah air' dipilih untuk πατρίς yang tersirat, sedangkan 'sebuah kota' mempertahankan peralihan gambaran konkret dalam klausa terakhir.
