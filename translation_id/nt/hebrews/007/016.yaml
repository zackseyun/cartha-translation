id: HEB.7.16
reference: Hebrews 7:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς οὐ κατὰ νόμον ἐντολῆς ⸀σαρκίνης γέγονεν ἀλλὰ κατὰ δύναμιν ζωῆς ἀκαταλύτου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/016.yaml
  text: who has become such not according to a law of a fleshly commandment[a], but according to the power of an indestructible life[c][b],
translation:
  language: id
  text: yang telah menjadi imam bukan berdasarkan hukum yang berupa perintah jasmani[a], melainkan berdasarkan kuasa kehidupan yang tidak dapat dibinasakan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hukum yang berupa persyaratan badani” atau “hukum perintah yang menyangkut tubuh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara tradisional: “kehidupan yang tiada berakhir.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: yang
  rationale: Kata ganti relatif ini merujuk kepada tokoh dalam ayat sebelumnya dan mempertahankan hubungan sintaksis dengan konteks.
- source_word: γέγονεν
  choice: telah menjadi imam
  rationale: Bentuk perfek menyatakan keadaan kini sebagai hasil dari peristiwa sebelumnya. Kata 'imam' tersirat dari konteks dan perlu dinyatakan agar elipsis Yunani terbaca alami dalam bahasa Indonesia.
- source_word: κατὰ νόμον
  choice: berdasarkan hukum
  rationale: κατά dengan akusatif menyatakan dasar atau patokan. Nomina νόμον tidak memakai artikel, sehingga tidak diterjemahkan secara khusus sebagai 'Hukum Taurat'.
- source_word: νόμον ἐντολῆς σαρκίνης
  choice: hukum yang berupa perintah jasmani
  rationale: Ungkapan ini mempertahankan hubungan hukum-perintah sambil membuat konstruksi genitif Yunani dapat dipahami secara alami. 'Jasmani' menunjuk pada ranah tubuh, kefanaan, dan persyaratan lahiriah, bukan pada kebejatan moral.
- source_word: ἀλλὰ κατὰ δύναμιν
  choice: melainkan berdasarkan kuasa
  rationale: Pilihan ini mempertahankan pertentangan sejajar antara kedua frasa κατὰ dan memakai 'melainkan' karena unsur pertama dinegasikan.
- source_word: ζωῆς ἀκαταλύτου
  choice: kehidupan yang tidak dapat dibinasakan
  rationale: ἀκατάλυτος menyatakan sesuatu yang tidak dapat dihancurkan, ditiadakan, atau diakhiri. Terjemahan ini lebih luas daripada sekadar durasi tanpa akhir.
theological_decisions:
- issue: Makna σαρκίνης dalam pertentangannya dengan ἀκαταλύτου
  choice: '''Jasmani'' dipakai untuk menyatakan persyaratan yang berkaitan dengan tubuh, garis keturunan, dan kefanaan.'
  alternative: '''Fisik'', ''badani'', atau ''yang menyangkut tubuh''.'
  rationale: Konteks membandingkan dasar keimaman yang bertumpu pada ketentuan lahiriah dengan kuasa kehidupan yang tidak dapat dibinasakan. Makna moral seperti 'berdosa' tidak dimasukkan karena tidak dinyatakan oleh teks.
- issue: Cakupan makna ἀκαταλύτου
  choice: '''Tidak dapat dibinasakan'' dipakai dalam teks utama.'
  alternative: '''Tidak berkesudahan'' atau ''tiada berakhir''.'
  rationale: Pilihan utama mempertahankan gagasan bahwa kehidupan itu tidak mungkin dihancurkan atau diakhiri, sedangkan alternatif tradisional terutama menekankan durasinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'telah menjadi imam' mengungkapkan predikat yang tersirat dari konteks tanpa menambahkan penafsiran denominatif. Istilah 'jasmani' dipertahankan tetapi dijelaskan agar tidak dipahami sebagai 'berdosa'.
