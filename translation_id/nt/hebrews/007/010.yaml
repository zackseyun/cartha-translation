base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/010.yaml
  text: For he was still in the loins of his father when Melchizedek met him[a].
translation:
  language: id
  text: Sebab, ia masih berada di dalam pinggang bapaknya[a] ketika Melkisedek bertemu dengannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di dalam pinggang bapaknya.” Ini adalah ungkapan tentang asal-usul keturunan; dalam konteks, “bapaknya” merujuk kepada Abraham, leluhur Lewi.
    reason: Menjelaskan idiom keturunan dan rujukan kontekstual tanpa meratakan metafora Yunani dalam teks utama.
lexical_decisions:
- source_word: ἔτι
  choice: masih
  rationale: Menunjukkan bahwa keadaan itu masih berlaku pada saat pertemuan tersebut.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelasan dengan ayat sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ἐν τῇ ὀσφύϊ
  choice: berada dalam tubuh
  rationale: Secara harfiah berarti 'di pinggang', tetapi dalam konteks ini merupakan ungkapan tentang asal-usul keturunan; 'dalam tubuh' menyampaikan maksudnya secara wajar tanpa mengganti gambaran itu dengan istilah teologis teknis.
- source_word: τοῦ πατρὸς
  choice: leluhurnya
  rationale: πατήρ dapat merujuk kepada bapak leluhur. Di sini yang dimaksud ialah Abraham, leluhur Lewi, bukan ayah biologis langsungnya.
- source_word: ἦν
  choice: berada
  rationale: Dalam gabungan dengan frasa tempat, 'berada' merupakan padanan Indonesia yang alami bagi bentuk imperfek 'ada'.
- source_word: ὅτε
  choice: ketika
  rationale: Padanan langsung bagi kata penghubung waktu.
- source_word: συνήντησεν
  choice: bertemu dengan
  rationale: Menyampaikan arti perjumpaan secara ringkas dan alami.
- source_word: αὐτῷ
  choice: leluhurnya itu
  rationale: Kata ganti ini merujuk kepada Abraham. Pengulangan 'leluhurnya itu' menghindari ketaksaan kata ganti orang ketiga dalam bahasa Indonesia.
- source_word: Μελχισέδεκ
  choice: Melkisedek
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Gambaran tentang keberadaan Lewi dalam Abraham sebagai leluhurnya
  choice: Memakai 'masih berada dalam tubuh leluhurnya' dalam teks utama
  alternative: masih berada di pinggang bapaknya
  rationale: Ungkapan Yunani menggambarkan Lewi sebagai keturunan yang secara leluhur masih berada dalam Abraham. Terjemahan utama menyampaikan logika representatif itu secara mudah dipahami, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- issue: Identitas τοῦ πατρὸς
  choice: Menerjemahkannya sebagai 'leluhurnya'
  alternative: bapaknya; leluhurnya Abraham
  rationale: Dalam konteks silsilah, πατήρ dapat berarti leluhur. 'Leluhurnya' mencegah kesan keliru bahwa Abraham adalah ayah biologis langsung Lewi, tetapi tidak menambahkan nama Abraham ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat jelas bagi pembaca umum, dengan metafora harfiah Yunani dipertahankan melalui catatan kaki.
