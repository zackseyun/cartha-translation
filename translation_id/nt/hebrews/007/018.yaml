base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/018.yaml
  text: For there is indeed a setting aside of the former commandment because of its weakness and uselessness[b][a],
translation:
  language: id
  text: Sebab, perintah yang terdahulu[a] memang dibatalkan karena lemah dan tidak berguna[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perintah yang mendahului” atau “perintah yang sebelumnya berlaku.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, tidak berdaya untuk membawa kesempurnaan yang dibahas dalam konteks ini (lihat Ibr. 7:19), bukan bahwa penyataan Allah sebelumnya pada hakikatnya jahat.
    reason: cross_reference
lexical_decisions:
- source_word: ἀθέτησις
  choice: dibatalkan
  rationale: Kata ini menyatakan peniadaan atau pembatalan yang berlaku. Bentuk pasif alami dalam bahasa Indonesia menyampaikan bahwa perintah terdahulu tidak lagi berlaku dalam susunan yang sedang dibahas.
- source_word: μὲν γὰρ
  choice: Sebab ... memang
  rationale: “Sebab” mempertahankan fungsi penjelasan γάρ, sedangkan “memang” mewakili μέν dan mengisyaratkan kontras yang dilanjutkan pada ayat berikutnya tanpa membuat kalimat kaku.
- source_word: γίνεται
  choice: dibatalkan
  rationale: Dalam konstruksi ini, γίνεται menyatakan berlangsung atau terjadinya pembatalan; maknanya dipadukan secara alami dengan nomina ἀθέτησις menjadi verba pasif bahasa Indonesia.
- source_word: προαγούσης ἐντολῆς
  choice: perintah yang terdahulu
  rationale: Partisip προαγούσης berarti yang mendahului atau telah ada sebelumnya. Pilihan ini mempertahankan acuan temporal tanpa mempersempitnya lebih jauh daripada teks.
- source_word: διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές
  choice: karena lemah dan tidak berguna
  rationale: Konstruksi ini memberikan alasan pembatalan. Dua adjektiva dipertahankan secara lugas dan tajam, sesuai dengan bahasa sumber.
- source_word: ἀσθενές
  choice: lemah
  rationale: Menyatakan ketiadaan kekuatan atau daya untuk mencapai tujuan yang dibicarakan dalam konteks.
- source_word: ἀνωφελές
  choice: tidak berguna
  rationale: Padanan langsung dan mudah dipahami untuk sesuatu yang tidak memberi manfaat atau hasil; catatan kaki membatasi cakupannya sesuai konteks tanpa melemahkan teks utama.
theological_decisions:
- issue: Cakupan penilaian terhadap “perintah yang terdahulu”
  choice: Mempertahankan ungkapan tajam “lemah dan tidak berguna,” dengan catatan bahwa konteksnya adalah ketidakmampuannya membawa kesempurnaan yang dibahas.
  alternative: Menjadikannya pernyataan bahwa seluruh hukum Musa sama sekali tidak bernilai, atau sebaliknya memperhalus penilaian negatif teks.
  rationale: Ibrani 7:11 dan 7:19 membahas ketidakmampuan tatanan keimaman sebelumnya untuk membawa kesempurnaan. Terjemahan tidak menghapus ketegangan bahasa sumber dan juga tidak memperluas klaim melampaui konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan bernada khidmat. “Dibatalkan” mempertahankan daya hukum ἀθέτησις, sementara “lemah dan tidak berguna” menjaga ketajaman teks. Penanda catatan kaki [b][a] ditempatkan setelah frasa yang diterangkannya, sesuai urutan pada teks konsultasi.
