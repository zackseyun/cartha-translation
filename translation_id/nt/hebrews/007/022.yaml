  text: κατὰ ⸀τοσοῦτο ⸀κρείττονος διαθήκης γέγονεν ἔγγυος Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/022.yaml
  text: By so much[a], Jesus has become the guarantor of a better covenant.
translation:
  language: id
  text: Dengan demikian, Yesus telah menjadi penjamin perjanjian[a] yang lebih baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “perjanjian” juga dapat berarti “surat wasiat” dalam konteks tertentu; di sini “perjanjian” paling sesuai dengan pembahasan tentang keimaman dan sumpah.
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ τοσοῦτο
  choice: Sejauh itulah
  rationale: Ungkapan κατά dengan akusatif menyatakan ukuran atau tingkat. Pilihan ini mempertahankan daya komparatif yang menghubungkan ayat ini dengan uraian sebelumnya.
- source_word: κρείττονος
  choice: yang lebih baik
  rationale: Bentuk komparatif ini merupakan istilah kunci dalam Surat Ibrani. 'Lebih baik' jelas, alami, dan mempertahankan pola perbandingan penulis.
- source_word: διαθήκης
  choice: perjanjian
  rationale: Kata ini dapat berarti 'perjanjian' atau, dalam konteks tertentu, 'surat wasiat'. Dalam pembahasan tentang keimaman dan sumpah di sini, 'perjanjian' paling sesuai.
- source_word: γέγονεν
  choice: telah menjadi
  rationale: Bentuk perfek menyatakan tindakan yang sudah terjadi dengan hasil yang tetap berlaku; 'telah menjadi' mempertahankan nuansa tersebut.
- source_word: ἔγγυος
  choice: penjamin
  rationale: Kata ini menunjuk kepada orang yang menjamin atau menjadi tanggungan bagi suatu kewajiban. 'Penjamin' tepat dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Bentuk baku nama ini dalam bahasa Indonesia.
theological_decisions:
- issue: Makna διαθήκη dalam Ibrani 7:22
  choice: perjanjian
  alternative: surat wasiat
  rationale: Walaupun διαθήκη dapat memiliki nuansa 'surat wasiat' dalam konteks tertentu, ayat ini berada dalam pembahasan tentang keimaman Yesus dan sumpah Allah yang menetapkan tatanan yang lebih baik. Karena itu, 'perjanjian' paling tepat tanpa mendahului permainan makna yang muncul kemudian dalam surat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Sejauh itulah' dipilih untuk mempertahankan gagasan tingkat atau ukuran dalam teks Yunani, sedangkan 'penjamin' menyampaikan fungsi personal Yesus secara jelas.
