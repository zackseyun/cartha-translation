  text: Θεωρεῖτε δὲ πηλίκος οὗτος ⸀ᾧ δεκάτην Ἀβραὰμ ἔδωκεν ἐκ τῶν ἀκροθινίων ὁ πατριάρχης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/004.yaml
  text: Consider how great this man was[b][a], to whom Abraham the patriarch gave a tenth of the spoils.
translation:
  language: id
  text: Perhatikanlah betapa besarnya orang ini, yang kepadanya Abraham, sang leluhur, memberikan sepersepuluh[a] dari jarahan perang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “persepuluhan.” Bahasa Yunani secara harfiah berbunyi “sepersepuluh.”
    reason: lexical_alternative
  - marker: b
    text: Istilah Yunani ini menunjuk pada jarahan perang dan mungkin secara khusus pada bagian terbaik dari jarahan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωρεῖτε
  choice: Perhatikanlah
  rationale: Bentuk imperatif kini jamak mengajak para pembaca mencermati dan merenungkan. “Perhatikanlah” alami dalam bahasa Indonesia modern serta mempertahankan daya seruannya.
- source_word: δὲ
  choice: tidak dinyatakan secara tersendiri
  rationale: Partikel ini menandai peralihan ringan dalam wacana. Dalam kalimat Indonesia ini, hubungan dengan konteks cukup jelas tanpa kata penghubung tambahan; menerjemahkannya sebagai “sekarang” akan memberi kesan waktu yang tidak terdapat dalam sumber.
- source_word: πηλίκος
  choice: betapa besar
  rationale: Ungkapan ini menyatakan kebesaran atau tingginya kedudukan. “Betapa besar” mempertahankan keluasan makna tanpa menentukan lebih jauh jenis kebesaran yang dimaksud.
- source_word: οὗτος
  choice: orang ini
  rationale: Kata tunjuk maskulin tunggal ini merujuk kepada Melkisedek dalam konteks sebelumnya. “Orang ini” wajar dan tidak menambahkan penafsiran.
- source_word: ᾧ
  choice: yang kepadanya
  rationale: Pronomina relatif datif memperkenalkan orang yang menerima pemberian Abraham. Susunan ini mempertahankan penekanan sumber pada penerimanya.
- source_word: δεκάτην
  choice: sepersepuluh
  rationale: Secara harfiah berarti bagian kesepuluh. Pilihan ini jelas bagi pembaca modern dan menghindari asosiasi kelembagaan yang mungkin melekat pada istilah “persepuluhan”.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: ἔδωκεν
  choice: memberikan
  rationale: Padanan langsung bagi tindakan memberi dalam bentuk aoris; konteks sudah menunjukkan bahwa peristiwa itu terjadi pada masa lampau.
- source_word: ἐκ τῶν ἀκροθινίων
  choice: dari jarahan perang
  rationale: Istilah ἀκροθίνια menunjuk pada barang jarahan perang dan mungkin secara khusus bagian teratas atau terbaiknya. Teks utama memakai makna yang pasti, sedangkan nuansa yang mungkin dicatat dalam catatan kaki.
- source_word: ὁ πατριάρχης
  choice: sang bapa leluhur
  rationale: Gelar ini menonjolkan kedudukan Abraham sebagai leluhur utama. “Sang bapa leluhur” alami, bermartabat, dan tidak menambahkan kelompok tertentu yang tidak disebut dalam teks.
theological_decisions:
- issue: Acuan dan daya penilaian ayat
  choice: Ayat menekankan kebesaran Melkisedek dengan menyatakan bahwa Abraham, sang bapa leluhur, memberikan sepersepuluh kepadanya.
  alternative: Menyatakan secara eksplisit bahwa Melkisedek lebih tinggi daripada Abraham karena menerima sepersepuluh darinya.
  rationale: Kesimpulan tentang kedudukan yang lebih tinggi didukung oleh alur konteks, tetapi ayat ini sendiri menyampaikan argumen melalui tindakan Abraham. Terjemahan mempertahankan pernyataan ayat tanpa memperluas kesimpulan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ajakan yang tegas dan bermartabat. Struktur relatif dipertahankan untuk menonjolkan Melkisedek sebagai penerima, sementara istilah teknis yang tidak perlu dihindari demi kejelasan bagi pembaca umum.
