  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ μετὰ ὁρκωμοσίας διὰ τοῦ λέγοντος πρὸς αὐτόν· Ὤμοσεν κύριος, καὶ οὐ μεταμεληθήσεται, Σὺ ἱερεὺς εἰς τὸν ⸀αἰῶνα),
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/021.yaml
  text: but this one became a priest with an oath through the one who said to him[a], “The Lord has sworn and will not change his mind, ‘You are a priest forever.’”
translation:
  language: id
  text: tetapi Dia menjadi imam dengan sumpah melalui Dia yang berkata kepada-Nya, “Tuhan telah bersumpah dan tidak akan berubah pikiran, ‘Engkau adalah imam untuk selama-lamanya.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “Tuhan bersumpah dan tidak akan berubah pikiran.” Aoristus Yunani ὤμοσεν dapat diterjemahkan “bersumpah” atau “telah bersumpah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: tetapi Dia
  rationale: Bentuk ini mempertahankan kontras dengan para imam sebelumnya dalam ayat 20, sementara rujukan kepada Kristus tetap jelas dari konteks.
- source_word: μετὰ ὁρκωμοσίας
  choice: dengan sumpah
  rationale: Ungkapan ini secara alami menyatakan keadaan penyerta sekaligus sarana, dan mempertahankan kontras dengan pengangkatan tanpa sumpah pada ayat sebelumnya.
- source_word: διὰ τοῦ λέγοντος πρὸς αὐτόν
  choice: melalui Dia yang berkata kepada-Nya
  rationale: διά dengan genitif menyatakan perantaraan atau pelaku; bentuk ini mempertahankan rumusan Yunani bahwa Allah adalah Dia yang mengucapkan perkataan tersebut kepada sang imam.
- source_word: Ὤμοσεν κύριος
  choice: Tuhan telah bersumpah
  rationale: Perfek bahasa Indonesia menyampaikan tindakan sumpah yang sudah dilakukan dan tetap berlaku; aoristus Yunani juga dapat diterjemahkan sebagai bentuk lampau sederhana.
- source_word: κύριος
  choice: Tuhan
  rationale: Ini adalah padanan baku dan wajar bagi κύριος dalam kutipan Yunani, tanpa mengganti bentuk teks Yunani dengan representasi langsung nama ilahi Ibrani.
- source_word: οὐ μεταμεληθήσεται
  choice: tidak akan berubah pikiran
  rationale: Dalam konteks sumpah, kata ini menunjuk pada tidak dibatalkannya suatu ketetapan, bukan pertobatan moral.
- source_word: Σὺ ἱερεὺς
  choice: Engkau adalah imam
  rationale: Kopula yang tersirat dalam bahasa Yunani perlu dinyatakan dalam bahasa Indonesia; 'Engkau' mempertahankan sapaan langsung yang khidmat.
- source_word: εἰς τὸν αἰῶνα
  choice: untuk selama-lamanya
  rationale: Ungkapan idiomatis ini menyatakan keberlangsungan tanpa akhir dan sesuai dengan ragam Alkitab Indonesia yang tetap mudah dipahami.
theological_decisions:
- issue: Sumpah ilahi dan kelanggengan keimaman dalam kutipan Mazmur 110:4
  choice: Terjemahan menegaskan bahwa keimaman ini ditetapkan dengan sumpah Tuhan dan berlaku untuk selama-lamanya.
  alternative: Ὤμοσεν dapat diterjemahkan lebih sederhana sebagai 'Tuhan bersumpah', dan οὐ μεταμεληθήσεται dapat diterjemahkan 'tidak akan menyesal' atau 'tidak akan menarik kembali keputusan-Nya'.
  rationale: Pilihan utama mempertahankan kontras argumentatif Ibrani 7 antara imam-imam yang diangkat tanpa sumpah dan imam yang ditetapkan melalui sumpah, tanpa menambahkan rumusan doktrinal di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada 'Dia/-Nya' dipakai untuk memperjelas rujukan ilahi dalam struktur kalimat yang padat. Penanda catatan kaki [a] ditempatkan sesudah kutipan yang diterangkannya.
