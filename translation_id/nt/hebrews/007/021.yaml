  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur Yunani: kontras dengan para imam sebelumnya, pengangkatan dengan sumpah, Dia yang berfirman kepada penerima sumpah, dan kutipan tentang keimaman yang kekal. “Telah bersumpah” merupakan pilihan yang sah untuk aoristus Ὤμοσεν dan catatan kaki dengan tepat mencatat alternatif lampau sederhana.'
