  text: ⸀μαρτυρεῖται γὰρ ὅτι Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/017.yaml
  text: 'For it is testified: “You are a priest forever according to the order of Melchizedek.”[a][b]'
translation:
  language: id
  text: Sebab dinyatakan, “Engkau adalah imam untuk selama-lamanya menurut tatanan Melkisedek.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menurut peraturan Melkisedek.”
    reason: lexical_alternative
  - marker: b
    text: Kutipan dari Mazmur 110:4.
    reason: cross_reference
lexical_decisions:
- source_word: μαρτυρεῖται
  choice: telah disaksikan
  rationale: Bentuk pasif impersonal ini memperkenalkan kesaksian Kitab Suci tanpa menetapkan subjek yang tidak dinyatakan dalam teks Yunani. Dalam bahasa Indonesia, bentuk perfektif ini wajar untuk kesaksian tertulis yang telah diberikan dan tetap berlaku.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata penghubung ini memberikan dasar bagi pernyataan sebelumnya; “Sebab” ringkas, alami, dan mempertahankan hubungan argumentatifnya.
- source_word: ὅτι
  choice: tanda koma sebelum kutipan langsung
  rationale: ὅτι memperkenalkan isi kesaksian. Kutipan langsung lebih alami dalam bahasa Indonesia dengan verba pengantar dan tanda koma daripada diterjemahkan secara eksplisit sebagai “bahwa”.
- source_word: Σὺ
  choice: Engkau
  rationale: Pronomina orang kedua tunggal ini merupakan sapaan langsung dan bersifat emfatis. “Engkau” sesuai dengan ragam Alkitab Indonesia yang luhur tanpa mengubah rujukannya.
- source_word: ἱερεὺς
  choice: imam
  rationale: Kata ini menyatakan jabatan imam, bukan secara khusus imam besar; karena itu tidak diperluas menjadi “Imam Besar”.
- source_word: εἰς τὸν αἰῶνα
  choice: untuk selama-lamanya
  rationale: Ungkapan idiomatis ini menyatakan keberlangsungan tanpa akhir; pilihan ini jelas dan bermartabat dalam bahasa Indonesia modern.
- source_word: κατὰ τὴν τάξιν
  choice: menurut aturan
  rationale: τάξις dapat menunjuk pada tatanan, aturan, atau golongan yang menjadi pola korespondensi. “Menurut aturan” mempertahankan rumusan formal dan ambiguitasnya tanpa mempersempitnya menjadi sekadar cara atau kemiripan.
- source_word: Μελχισέδεκ
  choice: Melkisedek
  rationale: Nama pribadi ini ditransliterasikan menurut bentuk yang sudah lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Sebutan keimaman dalam kutipan Mazmur
  choice: imam
  alternative: Imam Besar
  rationale: Teks Yunani memakai ἱερεύς, “imam,” bukan ἀρχιερεύς, “imam besar.” Walaupun Surat Ibrani menyebut Yesus sebagai Imam Besar di bagian lain, penjelasan teologis itu tidak boleh disisipkan ke dalam kutipan ini.
- issue: Makna κατὰ τὴν τάξιν Μελχισέδεκ
  choice: menurut aturan Melkisedek
  alternative: seperti Melkisedek / menurut cara Melkisedek
  rationale: Rumusan tersebut mempertahankan kemungkinan makna tatanan, pola, atau golongan keimaman tanpa memilih satu penjelasan teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pasif dipertahankan untuk tidak menambahkan subjek bagi kesaksian tersebut. Istilah “imam,” bukan “Imam Besar,” mengikuti teks sumber. Semua penanda catatan kaki dicantumkan dalam teks utama.
