revisions:
- from: Sebab telah disaksikan, “Engkau adalah imam untuk selama-lamanya menurut aturan Melkisedek.”[a][b]
  to: Sebab dinyatakan, “Engkau adalah imam untuk selama-lamanya menurut tatanan Melkisedek.”[a][b]
  rationale: Revisi mengganti bentuk perfektif “telah disaksikan” dengan pasif kini yang netral, “dinyatakan,” dan mengganti “aturan” dengan “tatanan” untuk menyampaikan τάξις secara lebih tepat dalam konteks keimaman. Kutipan tetap langsung, ragamnya baku-modern, dan tidak memasukkan gelar “Imam Besar” atau penjelasan teologis tambahan. Penanda serta catatan kaki dipertahankan dan diselaraskan dengan teks utama.
