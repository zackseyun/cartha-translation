  text: Τοιοῦτος γὰρ ἡμῖν ⸀καὶ ἔπρεπεν ἀρχιερεύς, ὅσιος, ἄκακος, ἀμίαντος, κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν, καὶ ὑψηλότερος τῶν οὐρανῶν γενόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/026.yaml
  text: 'For such a high priest was indeed fitting for us: holy[a], innocent, undefiled, separated from sinners[b], and having become higher than the heavens.'
translation:
  language: id
  text: 'Sebab Imam Besar seperti inilah yang memang sesuai bagi kita: kudus[a], tanpa kejahatan, tidak tercemar, terpisah dari orang-orang berdosa, dan telah menjadi lebih tinggi daripada langit.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saleh.”
    reason: lexical_alternative
  - marker: b
    text: Atau “telah ditinggikan melampaui langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιοῦτος
  choice: seperti inilah
  rationale: Menunjuk kembali kepada sosok Imam Besar yang baru saja diuraikan, dengan daya anaforis yang wajar dalam bahasa Indonesia.
- source_word: γὰρ
  choice: sebab
  rationale: Mempertahankan hubungan penjelasan ayat ini dengan argumen sebelumnya.
- source_word: ἡμῖν καὶ ἔπρεπεν
  choice: yang memang sesuai bagi kita
  rationale: Menyampaikan kesesuaian Imam Besar itu bagi umat; “memang” menangkap fungsi penegasan καί tanpa menjadikannya sekadar kata penghubung.
- source_word: ἀρχιερεύς
  choice: Imam Besar
  rationale: Istilah baku dan tepat untuk jabatan kultis yang menjadi pokok pembahasan dalam Surat Ibrani.
- source_word: ὅσιος
  choice: kudus
  rationale: Mengungkapkan kesalehan dan kemurnian moral yang sesuai dengan konteks keimaman.
- source_word: ἄκακος
  choice: tanpa kejahatan
  rationale: Menjaga makna ketiadaan kejahatan atau niat jahat; lebih tepat daripada “tidak berbahaya”, yang dapat terdengar terlalu lemah.
- source_word: ἀμίαντος
  choice: tidak tercemar
  rationale: Mempertahankan citra kemurnian moral sekaligus gema kemurnian kultis.
- source_word: κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν
  choice: terpisah dari orang-orang berdosa
  rationale: Mencerminkan bentuk partisip perfek yang menyatakan keadaan terpisah, tanpa menjelaskan secara berlebihan apakah pemisahan itu moral, ruang, atau terkait pemuliaan.
- source_word: ὑψηλότερος τῶν οὐρανῶν γενόμενος
  choice: telah menjadi lebih tinggi daripada langit
  rationale: Mempertahankan unsur perbandingan dan gerak resultatif γενόμενος tanpa menambahkan pelaku atau nuansa pasif yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Hubungan Yesus dengan orang berdosa dalam frasa “terpisah dari orang-orang berdosa”
  choice: Mempertahankan frasa langsung “terpisah dari orang-orang berdosa”.
  alternative: Menafsirkannya secara eksplisit sebagai hanya pemisahan moral atau hanya pemisahan sesudah kenaikan.
  rationale: Rangkaian sifat menekankan kemurnian dan kedudukan-Nya yang dimuliakan, tetapi terjemahan tidak boleh meniadakan pergaulan Yesus dengan orang berdosa selama pelayanan-Nya ataupun membatasi frasa ini pada satu jenis pemisahan.
- issue: Makna γενόμενος dalam kaitannya dengan kedudukan yang lebih tinggi daripada langit
  choice: “telah menjadi lebih tinggi daripada langit”
  alternative: “berada lebih tinggi daripada langit” atau “telah ditinggikan melampaui langit”
  rationale: Pilihan ini mencerminkan gerak historis-resultatif menuju kedudukan mulia tanpa menyiratkan perubahan dalam hakikat ilahi Kristus dan tanpa memasukkan bentuk pasif secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan predikat dipertahankan ringkas untuk menjaga irama retoris teks Yunani. Kapitalisasi “Imam Besar” dipakai sebagai sebutan khusus bagi Kristus dalam konteks ini.
