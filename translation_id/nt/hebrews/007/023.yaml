  naturalness: “Jumlah imam itu memang banyak” adalah bahasa Indonesia baku dan alami. “Tetap menjabat” lebih ringkas dan idiomatis daripada “tetap menjalankan jabatan”, sambil tetap menyatakan kelanjutan dalam tugas keimaman.
