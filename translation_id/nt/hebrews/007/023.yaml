  text: And they indeed have become many priests[a], because they are prevented by death from remaining in office[b],
translation:
  language: id
  text: Dan jumlah imam itu memang banyak[a], karena kematian menghalangi mereka untuk tetap menjabat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah ada banyak imam.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “untuk tetap tinggal”; dalam konteks ini maksudnya tetap menjabat sebagai imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Dahulu
  rationale: Dalam konteks perbandingan dengan Yesus pada ayat berikutnya, ungkapan ini menghubungkan argumen sekaligus menandai para imam dalam tatanan sebelumnya. Bahasa Indonesia tidak perlu meniru kata penghubung Yunani secara mekanis.
- source_word: οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς
  choice: ada banyak imam
  rationale: Konstruksi ini menyatakan bahwa jumlah imam itu banyak dan menyiapkan kontras μέν–δέ dengan satu imam pada ayat 24. Bentuk 'ada banyak imam' alami dalam bahasa Indonesia dan tetap mempertahankan penekanan pada kemajemukan mereka.
- source_word: διὰ τὸ θανάτῳ κωλύεσθαι
  choice: karena kematian menghalangi mereka
  rationale: διά dengan infinitif berartikel menyatakan sebab, sedangkan θανάτῳ berfungsi sebagai sarana atau penyebab yang menghalangi. Bentuk aktif ini lebih alami dalam bahasa Indonesia tanpa mengubah hubungan maknanya.
- source_word: παραμένειν
  choice: untuk tetap menjalankan jabatan
  rationale: Dalam konteks ini, kata tersebut menunjuk pada keberlanjutan pelayanan sebagai imam. 'Menjalankan jabatan' mengungkapkan implikasi kontekstualnya, sedangkan catatan kaki mempertahankan bentuk harfiahnya.
theological_decisions:
- issue: Kontras antara banyak imam terdahulu dan keimaman Yesus
  choice: Menekankan banyaknya imam karena mereka tidak dapat terus menjabat setelah kematian, sebagai persiapan bagi kontras pada ayat berikutnya.
  alternative: Menyebut mereka secara eksplisit sebagai 'imam-imam Lewi'.
  rationale: Konteks menunjukkan keimaman Lewi, tetapi ayat Yunani ini hanya mengatakan 'imam'. Terjemahan tidak menambahkan penamaan teologis yang tidak dinyatakan langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat alami bagi pembaca umum, dengan ambiguitas leksikal yang relevan dicatat tanpa membebani teks utama.
