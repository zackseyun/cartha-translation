source:
  edition: SBLGNT
  text: ὁ νόμος γὰρ ἀνθρώπους καθίστησιν ἀρχιερεῖς ἔχοντας ἀσθένειαν, ὁ λόγος δὲ τῆς ὁρκωμοσίας τῆς μετὰ τὸν νόμον υἱόν, εἰς τὸν αἰῶνα τετελειωμένον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/028.yaml
  text: For the law appoints men as high priests who have weakness[a], but the word of the oath, which came after the law[b], appoints a Son who has been perfected forever.
translation:
  language: id
  text: Sebab hukum Taurat mengangkat manusia menjadi imam-imam besar yang memiliki kelemahan, tetapi firman sumpah yang diberikan sesudah hukum Taurat mengangkat seorang Anak[a] yang telah disempurnakan untuk selama-lamanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Sang Anak.” Dalam bahasa Yunani, “Anak” tidak memakai kata sandang; bentuk ini menegaskan kontras dengan “manusia,” tetapi dalam konteks tetap merujuk kepada Yesus.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan “telah dijadikan sempurna,” “telah dibawa kepada penyelesaian,” atau, dalam konteks keimaman, “telah ditahbiskan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νόμος
  choice: hukum Taurat
  rationale: Konteksnya menunjuk pada hukum Musa, khususnya ketentuan tentang keimaman. Sebutan ini jelas dan alami bagi pembaca Indonesia.
- source_word: καθίστησιν
  choice: mengangkat
  rationale: Dalam konteks jabatan imam, kata ini menyatakan penetapan seseorang ke dalam jabatan resmi.
- source_word: ἀνθρώπους
  choice: manusia
  rationale: Menjaga kontras sumber antara imam-imam besar yang fana dan Anak, tanpa mengaburkan bahwa para pemegang jabatan historis itu adalah manusia.
- source_word: ἀρχιερεῖς
  choice: imam-imam besar
  rationale: Bentuk jamak merujuk pada para pemegang jabatan imam besar secara berturut-turut.
- source_word: ἔχοντας ἀσθένειαν
  choice: yang memiliki kelemahan
  rationale: Mempertahankan bentuk nominal ἀσθένεια dan mencakup kerapuhan serta keterbatasan manusia, bukan hanya penyakit jasmani.
- source_word: ὁ λόγος τῆς ὁρκωμοσίας
  choice: firman yang mengandung sumpah
  rationale: Menyampaikan bahwa firman atau pernyataan ilahi tersebut hadir dalam bentuk sumpah, dengan ungkapan yang lebih alami daripada 'firman sumpah'.
- source_word: τῆς μετὰ τὸν νόμον
  choice: yang datang sesudah hukum Taurat itu
  rationale: 'Menjelaskan urutan waktu yang penting bagi argumen: sumpah dalam Mazmur diberikan sesudah hukum Taurat.'
- source_word: υἱόν
  choice: seorang Anak
  rationale: Mempertahankan bentuk tanpa artikel dan kontras kualitatif antara 'manusia' dan 'Anak'; huruf kapital menandai rujukannya kepada Yesus dalam konteks.
- source_word: εἰς τὸν αἰῶνα
  choice: untuk selama-lamanya
  rationale: Ungkapan Indonesia yang wajar untuk keberlangsungan tanpa akhir dalam konteks keimaman.
- source_word: τετελειωμένον
  choice: yang telah disempurnakan
  rationale: 'Mempertahankan aspek perfektif dan bentuk pasif partisipel: keadaan yang dihasilkan oleh tindakan penyempurnaan tetap berlaku.'
theological_decisions:
- issue: Ketakrifan υἱόν tanpa artikel
  choice: seorang Anak
  alternative: Sang Anak
  rationale: Pilihan utama menjaga bentuk Yunani tanpa artikel dan kontras dengan manusia, sedangkan konteks tetap memastikan bahwa yang dimaksud ialah Anak yang unik. Catatan kaki mencatat terjemahan definit yang juga mungkin dalam bahasa Indonesia.
- issue: Makna τετελειωμένον dalam teologi keimaman Ibrani
  choice: yang telah disempurnakan untuk selama-lamanya
  alternative: yang telah ditahbiskan untuk selama-lamanya
  rationale: Terjemahan utama mempertahankan keluasan makna penyempurnaan atau pencapaian tujuan, tanpa membatasinya hanya pada makna kultis penahbisan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur antitesis antara hukum Taurat dan firman sumpah dipertahankan, dengan pengulangan 'mengangkat' agar predikat yang tersirat pada klausa kedua jelas dalam bahasa Indonesia.
