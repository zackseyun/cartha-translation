  text: μετατιθεμένης γὰρ τῆς ἱερωσύνης ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/012.yaml
  text: For when the priesthood is changed[a], of necessity there is also a change of law.
translation:
  language: id
  text: Sebab, ketika keimaman diubah, perubahan pada hukum juga pasti terjadi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perubahan pada Hukum itu juga pasti terjadi.” Dalam konteks ini, “Hukum” dapat dipahami sebagai Hukum Musa yang mengatur keimaman Lewi.
    reason: alternative_reading
lexical_decisions:
- source_word: μετατιθεμένης (μετατίθημι)
  choice: ketika ... diubah
  rationale: Partisip genitif absolut menyatakan keadaan yang menjadi dasar konsekuensi berikutnya. Pilihan ini mempertahankan gagasan peralihan dari satu tatanan ke tatanan lain tanpa membatasinya pada pemindahan administratif.
- source_word: ἱερωσύνης
  choice: keimaman
  rationale: Menunjuk pada lembaga atau jabatan imam, bukan sekadar tindakan seorang imam. 'Keimaman' merupakan istilah Indonesia yang ringkas dan lazim dalam konteks ini.
- source_word: ἐξ ἀνάγκης
  choice: dengan sendirinya harus
  rationale: 'Mengungkapkan keniscayaan logis: perubahan keimaman menuntut perubahan hukum. Rumusan ini alami dalam bahasa Indonesia sekaligus mempertahankan kekuatan keharusan.'
- source_word: νόμου
  choice: hukum
  rationale: Nomina Yunani tanpa artikel dapat menunjuk pada tatanan hukum yang mengatur keimaman, dan dalam konteks mencakup Hukum Musa. Tanpa 'itu' atau kapitalisasi, cakupannya tidak dipersempit secara berlebihan.
- source_word: μετάθεσις
  choice: berubah
  rationale: Mengungkapkan perubahan yang sepadan dengan μετατιθεμένης. Bentuk verbal menghasilkan kalimat Indonesia yang lebih alami daripada 'terjadi perubahan hukum' tanpa menghilangkan hubungan konseptualnya.
- source_word: γίνεται
  choice: harus berubah
  rationale: Dalam gabungan dengan ἐξ ἀνάγκης, γίνομαι menyatakan bahwa perubahan itu terjadi sebagai konsekuensi yang niscaya. 'Harus berubah' menyampaikan hasil tersebut secara idiomatis.
- source_word: καὶ
  choice: pun
  rationale: Menandai bahwa perubahan hukum menyertai perubahan keimaman sebagai konsekuensi tambahannya.
- source_word: γὰρ
  choice: Sebab
  rationale: Menghubungkan ayat ini sebagai penjelasan atas argumen sebelumnya.
theological_decisions:
- issue: Cakupan νόμος dalam kaitannya dengan keimaman
  choice: hukum
  alternative: Hukum itu, yakni Hukum Musa
  rationale: Konteks menunjuk pada kerangka hukum Musa yang menetapkan keimaman Lewi, tetapi bentuk Yunani tanpa artikel memungkinkan pernyataan yang agak lebih luas tentang tatanan hukum yang mengatur keimaman. Teks utama mempertahankan keluasan itu, sedangkan catatan kaki menyatakan rujukan kontekstual yang mungkin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada argumentatif dan bermartabat. Struktur dibuat alami bagi pembaca umum, sambil mempertahankan hubungan sebab-akibat dan ambiguitas terbatas pada cakupan νόμος.
