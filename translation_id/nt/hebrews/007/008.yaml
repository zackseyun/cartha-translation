  text: καὶ ὧδε μὲν δεκάτας ἀποθνῄσκοντες ἄνθρωποι λαμβάνουσιν, ἐκεῖ δὲ μαρτυρούμενος ὅτι ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/008.yaml
  text: And here mortal men receive tithes[a], but there he is testified to be living.
translation:
  language: id
  text: Di sini orang-orang fana menerima persepuluhan, tetapi di sana persepuluhan diterima oleh orang yang tentangnya diberi kesaksian bahwa ia hidup.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tetapi di sana [persepuluhan diterima] oleh orang yang tentangnya diberi kesaksian bahwa ia hidup.” Bahasa Yunani menyatakannya sebagai kesaksian Kitab Suci, bukan penegasan langsung bahwa Melkisedek secara harfiah hidup abadi.
    reason: alternative_reading
lexical_decisions:
- source_word: ὧδε
  choice: di sini
  rationale: Mempertahankan kontras deiktis dengan ἐκεῖ dan menunjuk pada keadaan para imam Lewi.
- source_word: δεκάτας
  choice: persepuluhan
  rationale: Istilah baku dan wajar dalam bahasa Indonesia untuk pemberian sepersepuluh dalam konteks keagamaan.
- source_word: ἀποθνῄσκοντες ἄνθρωποι
  choice: manusia-manusia yang akan mati
  rationale: Menyatakan secara eksplisit bahwa para penerimanya adalah manusia fana, sambil tetap dekat dengan bentuk partisipel Yunani dan konteks para imam.
- source_word: λαμβάνουσιν
  choice: menerima
  rationale: Padanan langsung yang tidak menambahkan gagasan pemungutan atau pengambilan paksa.
- source_word: ἐκεῖ
  choice: di sana
  rationale: Mempertahankan pasangan retoris 'di sini ... di sana' dan menunjuk pada gambaran Melkisedek dalam kesaksian Kitab Suci.
- source_word: μαρτυρούμενος
  choice: ia diberi kesaksian
  rationale: Mempertahankan bentuk pasif dan menonjolkan bahwa pernyataan tersebut hadir sebagai kesaksian, bukan sebagai penjelasan ontologis langsung.
- source_word: ὅτι ζῇ
  choice: bahwa ia hidup
  rationale: Menerjemahkan klausa ὅτι secara alami dan mempertahankan aspek kini dari ζῇ tanpa memperkuatnya menjadi klaim eksplisit tentang keabadian.
theological_decisions:
- issue: Sifat kontras antara para imam Lewi dan Melkisedek
  choice: Ayat ini mempertentangkan manusia fana yang menerima persepuluhan dengan Melkisedek, yang dalam kesaksian Kitab Suci dinyatakan hidup.
  alternative: Ayat ini secara langsung mengajarkan bahwa Melkisedek secara pribadi hidup abadi.
  rationale: Bentuk pasif μαρτυρούμενος dipertahankan agar dasar argumen tetap berupa kesaksian Kitab Suci dan ketegangan teologisnya tidak diselesaikan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'manusia-manusia yang akan mati' dipilih untuk menyampaikan kefanaan secara jelas; bentuk pasif 'diberi kesaksian' dipertahankan demi ketepatan argumen.
