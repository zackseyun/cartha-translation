  naturalness: '''Manusia-manusia yang akan mati'' tidak alami dalam bahasa Indonesia modern dan dapat terdengar seolah-olah hanya menunjuk kematian di masa depan. ''Orang-orang fana'' menyampaikan ἀποθνῄσκοντες ἄνθρωποι dengan lebih idiomatis. Susunan pasif pada klausa kedua dibuat utuh dan tetap jelas.'
