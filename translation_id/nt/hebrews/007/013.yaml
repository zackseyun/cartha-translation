  text: ἐφ’ ὃν γὰρ λέγεται ταῦτα φυλῆς ἑτέρας μετέσχηκεν, ἀφ’ ἧς οὐδεὶς προσέσχηκεν τῷ θυσιαστηρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/013.yaml
  text: For the one about whom these things are said belongs to another tribe[b][a], from which no one has served at the altar.
translation:
  language: id
  text: Sebab, Dia yang dibicarakan dalam hal-hal ini termasuk dalam suku lain[a], dan dari suku itu tidak seorang pun pernah melayani di mezbah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mempunyai bagian dalam suku lain” atau “berasal dari suku lain.” Kata Yunani ini dapat menyatakan partisipasi atau keterkaitan; di sini maksudnya ialah afiliasi kesukuan.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “memberi perhatian kepada mezbah” atau “bertugas di mezbah.” Ungkapan ini menunjuk pada pelayanan keimaman yang berkaitan dengan mezbah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ’ ὃν
  choice: Dia yang tentang-Nya
  rationale: ἐπί dengan akusatif bersama λέγεται menyatakan orang yang menjadi pokok pembicaraan; bentuk ini mempertahankan rujukan kepada pribadi tersebut secara alami dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai alasan atau penjelasan bagi pernyataan sebelumnya dan mempertahankan alur argumentasi.
- source_word: λέγεται ταῦτα
  choice: hal-hal ini dikatakan
  rationale: Mempertahankan bentuk pasif kini dan bentuk jamak ταῦτα tanpa mempersempit isinya.
- source_word: φυλῆς ἑτέρας
  choice: suku lain
  rationale: φυλή merujuk pada salah satu suku Israel, sedangkan ἑτέρας menunjukkan suku yang berbeda dari suku imamat yang sedang dibahas.
- source_word: μετέσχηκεν
  choice: berasal dari
  rationale: Dalam konteks ini verba perfektum tersebut menunjukkan keterkaitan tetap dengan suatu suku. 'Berasal dari' merupakan ungkapan Indonesia yang wajar untuk afiliasi kesukuan, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ἀφ’ ἧς
  choice: dari suku itu
  rationale: Rujukan kepada φυλή dibuat eksplisit agar hubungan antarklausa jelas dan alami dalam bahasa Indonesia.
- source_word: οὐδεὶς
  choice: tidak seorang pun
  rationale: Padanan langsung yang bermartabat dan lazim bagi negasi universal.
- source_word: προσέσχηκεν τῷ θυσιαστηρίῳ
  choice: pernah melayani di mezbah
  rationale: Dalam konteks kultis, προσέχω menunjuk pada kehadiran atau pelayanan yang berkaitan dengan mezbah. 'Melayani di mezbah' menyampaikan fungsi tersebut tanpa menentukan tindakan imam secara lebih khusus daripada teks.
- source_word: θυσιαστηρίῳ
  choice: mezbah
  rationale: Istilah baku dan dipahami luas dalam konteks persembahan korban.
theological_decisions:
- issue: Hubungan Yesus dengan suku non-Lewi dalam argumentasi tentang imamat
  choice: Menyatakan bahwa Dia berasal dari suku lain tanpa menyebut nama suku atau menjelaskan doktrin imamat lebih lanjut.
  alternative: Menerjemahkan secara lebih interpretatif sebagai 'merupakan keturunan dari suku lain'.
  rationale: Ayat ini mendukung argumen tentang imamat di luar garis Lewi, tetapi μετέσχηκεν sendiri menyatakan keterlibatan atau afiliasi kesukuan dan tidak secara eksplisit memakai istilah keturunan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada 'Dia' dan '-Nya' membantu memperjelas rujukan personal dalam konteks tanpa menambahkan nama yang tidak terdapat dalam ayat. Penempatan kedua penanda catatan kaki mengikuti kata atau frasa yang diterangkannya.
