reference: Hebrews 7:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅθεν καὶ σῴζειν εἰς τὸ παντελὲς δύναται τοὺς προσερχομένους δι’ αὐτοῦ τῷ θεῷ, πάντοτε ζῶν εἰς τὸ ἐντυγχάνειν ὑπὲρ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/025.yaml
  text: Therefore he is also able to save completely those who draw near to God through him[a], since he always lives to intercede for them.
translation:
  language: id
  text: Karena itu, Ia juga sanggup menyelamatkan sepenuhnya[a] orang-orang yang mendekat kepada Allah melalui Dia, sebab Ia senantiasa hidup untuk berdoa syafaat bagi mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk selama-lamanya”; secara tradisional, “sampai tuntas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Karena itu
  rationale: Menandai kesimpulan dari uraian sebelumnya tentang keimaman Yesus yang tetap; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: καὶ
  choice: juga
  rationale: Mempertahankan daya aditif yang menghubungkan kemampuan-Nya menyelamatkan dengan keimaman-Nya yang tetap.
- source_word: σῴζειν
  choice: menyelamatkan
  rationale: Padanan baku dalam konteks keselamatan dan tetap mempertahankan bobot teologis kata sumber.
- source_word: εἰς τὸ παντελές
  choice: sepenuhnya
  rationale: Menyatakan keselamatan yang lengkap tanpa mempersempit frasa pada dimensi waktu saja; kemungkinan makna temporal dicatat dalam catatan kaki.
- source_word: δύναται
  choice: sanggup
  rationale: Mengungkapkan kemampuan yang berlandaskan keimaman-Nya yang kekal dengan ragam bahasa yang wajar dan berbobot.
- source_word: τοὺς προσερχομένους
  choice: orang-orang yang datang mendekat
  rationale: Mempertahankan nuansa gerak mendekat kepada Allah yang khas dalam Surat Ibrani, termasuk nuansa ibadah dan akses kepada-Nya.
- source_word: δι’ αὐτοῦ
  choice: melalui Dia
  rationale: Menyatakan perantaraan Yesus sebagai imam dalam akses kepada Allah.
- source_word: τῷ θεῷ
  choice: kepada Allah
  rationale: Merupakan padanan alami bagi objek προσέρχομαι dan secara jelas menyatakan arah pendekatan.
- source_word: πάντοτε ζῶν
  choice: sebab Ia senantiasa hidup
  rationale: Partisip ini memberi dasar bagi kemampuan-Nya menyelamatkan; 'sebab' memperjelas hubungan kausal, sedangkan 'senantiasa' mempertahankan kesinambungannya.
- source_word: εἰς τὸ ἐντυγχάνειν
  choice: untuk menjadi pengantara
  rationale: Menyatakan tujuan pelayanan-Nya yang terus berlangsung bagi mereka; ungkapan ini alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: ὑπὲρ αὐτῶν
  choice: bagi mereka
  rationale: Menyampaikan makna perwakilan dan manfaat tindakan-Nya atas nama mereka.
theological_decisions:
- issue: Cakupan makna εἰς τὸ παντελές
  choice: sepenuhnya
  alternative: untuk selama-lamanya; sampai tuntas
  rationale: Frasa ini dapat menyatakan kelengkapan maupun keberlangsungan sepanjang waktu. Teks utama memakai 'sepenuhnya', sementara nuansa temporal dan ungkapan alternatif dipertahankan dalam catatan kaki agar ketegangan maknanya tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan umum penerjemahan Alkitab bahasa Indonesia. Susunan kalimat mempertahankan hubungan kesimpulan, dasar kausal, dan tema perantaraan imam tanpa menjadi kaku.
