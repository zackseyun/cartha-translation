  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς οὐκ ἔχει καθ’ ἡμέραν ἀνάγκην, ὥσπερ οἱ ἀρχιερεῖς, πρότερον ὑπὲρ τῶν ἰδίων ἁμαρτιῶν θυσίας ἀναφέρειν, ἔπειτα τῶν τοῦ λαοῦ (τοῦτο γὰρ ἐποίησεν ἐφάπαξ ἑαυτὸν ἀνενέγκας)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/027.yaml
  text: who has no need[a], day after day, like the high priests, to offer up sacrifices first for his own sins and then for those of the people[d][c][b], for this he did once for all when he offered up himself.
translation:
  language: id
  text: yang tidak perlu, hari demi hari,[a] seperti para imam besar, mempersembahkan kurban, mula-mula untuk dosa-dosanya sendiri, kemudian untuk dosa-dosa umat. Sebab, hal ini telah Ia lakukan satu kali untuk selama-lamanya[b] ketika Ia mempersembahkan diri-Nya sendiri.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: "setiap hari."'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: "sekali untuk selamanya."'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: "dengan mempersembahkan diri-Nya sendiri" atau "setelah mempersembahkan diri-Nya sendiri."'
    reason: grammatical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: hari demi hari
  rationale: Ungkapan ini menyatakan kebutuhan yang berulang setiap hari; 'hari demi hari' mempertahankan daya iteratifnya secara alami.
- source_word: ἀνάγκην
  choice: perlu
  rationale: Dalam konstruksi ἔχει ἀνάγκην, 'tidak perlu' merupakan padanan Indonesia yang lugas dan idiomatis.
- source_word: ὥσπερ οἱ ἀρχιερεῖς
  choice: seperti para imam besar
  rationale: Mempertahankan perbandingan dan bentuk jamak Yunani.
- source_word: πρότερον ... ἔπειτα
  choice: mula-mula ... kemudian
  rationale: Menandai urutan tindakan kurban secara jelas dan wajar dalam bahasa Indonesia.
- source_word: θυσίας ἀναφέρειν
  choice: mempersembahkan kurban
  rationale: Dalam konteks peribadatan, ἀναφέρω bersama θυσία berarti mempersembahkan kurban; pilihan ini mempertahankan nuansa keimaman.
- source_word: τῶν τοῦ λαοῦ
  choice: dosa-dosa umat
  rationale: Bahasa Yunani bersifat eliptis, dengan 'dosa-dosa' dipahami dari frasa sebelumnya. Mengulang kata tersebut diperlukan agar jelas dan alami dalam bahasa Indonesia.
- source_word: ἐφάπαξ
  choice: satu kali untuk selama-lamanya
  rationale: Mengungkapkan baik ketunggalan maupun sifat definitif dari persembahan diri Kristus.
- source_word: ἑαυτὸν ἀνενέγκας
  choice: ketika Ia mempersembahkan diri-Nya sendiri
  rationale: Menyampaikan hubungan temporal yang wajar bagi partisip aoris sekaligus mempertahankan makna kurban dari ἀναφέρω.
theological_decisions:
- issue: Cakupan τοῦτο ('hal ini') dalam klausa penjelas
  choice: '''Hal ini'' menunjuk pada tindakan kurban yang menentukan, yang dilakukan Kristus dengan mempersembahkan diri-Nya sendiri, tanpa menyatakan bahwa Ia mempersembahkan kurban untuk dosa-Nya sendiri.'
  alternative: '''Hal ini'' hanya menunjuk pada persembahan bagi dosa-dosa umat, atau secara luas pada seluruh karya keimaman-Nya.'
  rationale: Konteks langsung membedakan Kristus dari para imam besar lain. Susunan terjemahan mempertahankan rujukan anaforis τοῦτο dan ketegangan teks tanpa memasukkan keberdosaan kepada Kristus.
- issue: Sifat persembahan diri Kristus
  choice: mempersembahkan diri-Nya sendiri
  alternative: memberikan diri-Nya sendiri
  rationale: Pilihan ini mempertahankan bahasa kurban dan fungsi keimaman yang menonjol dalam surat Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. 'Kurban' dipakai untuk konteks persembahan ritual; kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab Indonesia. Tanda kurung Yunani diungkapkan sebagai kalimat penjelas tersendiri agar struktur panjang ayat tetap jelas.
