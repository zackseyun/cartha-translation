translation:
  language: id
  text: Dan, boleh dikatakan, melalui Abraham bahkan Lewi, yang menerima persepuluhan, telah membayar persepuluhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bentuk Yunaninya pasif: “telah dikenai persepuluhan.” Dalam konteks ini, ungkapan tersebut berarti bahwa Lewi dipandang telah membayar persepuluhan melalui Abraham.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἔπος εἰπεῖν
  choice: dapat dikatakan
  rationale: Ungkapan idiomatis ini melunakkan atau membatasi pernyataan yang menyusul. Bentuk ini alami dalam bahasa Indonesia modern dan mempertahankan sifat retorisnya.
- source_word: δι’ Ἀβραὰμ
  choice: melalui Abraham
  rationale: διά dengan genitif menyatakan perantaraan; Lewi dipandang turut terlibat dalam tindakan leluhurnya tanpa menjelaskan mekanismenya lebih jauh.
- source_word: καὶ Λευὶ
  choice: Lewi sendiri
  rationale: καί bersifat emfatis dalam argumen ini. 'Lewi sendiri' menyampaikan unsur mengejutkan bahwa bahkan Lewi termasuk dalam pernyataan tersebut.
- source_word: ὁ δεκάτας λαμβάνων
  choice: yang menerima persepuluhan
  rationale: Partisipel kini substantival menggambarkan peranan khas Lewi dalam tata keimaman sebagai penerima persepuluhan.
- source_word: δεκάτας
  choice: persepuluhan
  rationale: Istilah Indonesia yang lazim dan tepat untuk pemberian sepersepuluh dalam konteks keagamaan ini.
- source_word: δεδεκάτωται
  choice: telah membayar persepuluhan
  rationale: Walaupun bentuk Yunani secara gramatikal pasif, dalam konteks ini verba tersebut menyatakan bahwa Lewi dikenai tindakan memberi sepersepuluh melalui Abraham. Ungkapan aktif ini paling jelas dan alami dalam bahasa Indonesia, sedangkan bentuk pasif harfiahnya tidak lazim dan dapat disalahpahami.
theological_decisions:
- issue: Partisipasi representatif Lewi dalam tindakan Abraham
  choice: Melalui Abraham, Lewi sendiri dikatakan telah membayar persepuluhan.
  alternative: Lewi secara korporatif berada di dalam Abraham; atau pernyataan ini dipahami hanya sebagai bahasa kiasan.
  rationale: Terjemahan mempertahankan perantaraan 'melalui Abraham' dan pembatas retoris 'dapat dikatakan', sehingga argumen tentang hubungan Lewi dengan tindakan leluhurnya tetap utuh tanpa menetapkan mekanisme teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan penekanan pada 'Lewi sendiri' serta catatan kaki untuk mempertahankan bentuk pasif Yunani yang tidak mudah dialihkan secara harfiah.
