  to: Jadi, seandainya kesempurnaan dapat dicapai melalui imamat Lewi—sebab berdasarkan imamat itulah umat telah menerima hukum Taurat[a]—mengapa masih diperlukan seorang imam lain untuk tampil menurut tata Melkisedek dan bukan disebut menurut tata Harun?[b]
