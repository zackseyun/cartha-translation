id: HEB.7.11
reference: Hebrews 7:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν, ὁ λαὸς γὰρ ἐπ’ ⸀αὐτῆς ⸀νενομοθέτηται, τίς ἔτι χρεία κατὰ τὴν τάξιν Μελχισέδεκ ἕτερον ἀνίστασθαι ἱερέα καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/011.yaml
  text: If perfection had been through the Levitical priesthood—for on its basis the people had received the law—what further need was there for another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron?[a][b]
translation:
  language: id
  text: Jadi, seandainya kesempurnaan dapat dicapai melalui imamat Lewi—sebab berdasarkan imamat itulah umat telah menerima hukum Taurat[a]—mengapa masih diperlukan seorang imam lain untuk tampil menurut tata Melkisedek dan bukan disebut menurut tata Harun?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab di bawah imamat itulah umat diberi hukum Taurat.” Ungkapan Yunani dapat diterjemahkan lebih harfiah, tetapi maksudnya ialah bahwa umat menerima hukum berdasarkan imamat Lewi.
    reason: lexical_alternative
  - marker: b
    text: Atau, “seorang imam lain bangkit menurut tata Melkisedek dan tidak dinamakan menurut tata Harun.”
    reason: alternative_reading
lexical_decisions:
- source_word: τελείωσις
  choice: kesempurnaan
  rationale: Mempertahankan bobot kultis dan teologis istilah dalam Ibrani tanpa membatasinya pada perbaikan moral atau sekadar penyelesaian.
- source_word: διὰ τῆς Λευιτικῆς ἱερωσύνης
  choice: melalui keimaman Lewi
  rationale: διά dengan genitif menyatakan sarana; bentuk ini alami dan tetap menunjukkan keimaman sebagai sarana yang sedang diandaikan.
- source_word: ἐπ’ αὐτῆς
  choice: berdasarkan keimaman itulah
  rationale: Pronomina feminin paling wajar merujuk kepada keimaman Lewi; pengulangan nomina menghindari ketidakjelasan dalam bahasa Indonesia.
- source_word: νενομοθέτηται
  choice: umat menerima hukum Taurat
  rationale: Mengungkapkan keadaan yang dihasilkan oleh tindakan pemberian hukum dengan idiom Indonesia yang alami.
- source_word: τίς ἔτι χρεία
  choice: mengapa masih perlu
  rationale: Menyampaikan daya pertanyaan retoris tentang kebutuhan yang masih tersisa secara lugas.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: menurut tata Melkisedek
  rationale: τάξις di sini menunjuk pada tata, pola, atau golongan keimaman; 'menurut tata' ringkas dan mapan dalam register Alkitab Indonesia.
- source_word: ἕτερον ... ἱερέα
  choice: seorang imam lain
  rationale: Mempertahankan kontras dengan tata Harun tanpa menambahkan penafsiran bahwa imam itu berbeda secara hakiki.
- source_word: ἀνίστασθαι
  choice: tampil
  rationale: Dalam konteks ini menunjuk pada muncul atau hadirnya seorang imam; 'tampil' alami dan tidak memaksakan makna kebangkitan.
- source_word: καὶ οὐ ... λέγεσθαι
  choice: dan bukan disebut menurut tata Harun
  rationale: λέγεσθαι menyangkut penyebutan atau penggolongan imam tersebut; 'disebut' langsung dan alami.
- source_word: Μελχισέδεκ / Ἀαρών
  choice: Melkisedek / Harun
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: μὲν οὖν
  choice: Jadi
  rationale: Menandai hubungan inferensial dengan uraian sebelumnya; μὲν tidak perlu diterjemahkan tersendiri karena pasangannya tidak dinyatakan secara langsung.
theological_decisions:
- issue: Makna τελείωσις dalam argumen keimaman Ibrani
  choice: kesempurnaan
  alternative: penyempurnaan; tercapainya akses penuh kepada Allah
  rationale: Pilihan ini mempertahankan ketegangan teologis dan membiarkan konteks surat menjelaskan cakupannya.
- issue: Acuan αὐτῆς dalam ἐπ’ αὐτῆς νενομοθέτηται
  choice: keimaman Lewi
  alternative: hukum Taurat; tatanan perjanjian secara umum
  rationale: Anteseden feminin terdekat yang sesuai adalah keimaman, dan klausa sisipan menjelaskan hubungan tatanan hukum umat dengan keimaman tersebut.
- issue: Arti τάξις bagi Melkisedek dan Harun
  choice: tata keimaman atau pola penggolongan, tanpa penjelasan tambahan dalam teks
  alternative: urutan; jabatan; golongan
  rationale: Terjemahan tidak menetapkan secara berlebihan hakikat hubungan Kristus dengan Melkisedek, tetapi mempertahankan perbandingan yang dibuat teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'keimaman', 'hukum Taurat', serta nama baku 'Melkisedek' dan 'Harun' dipakai demi kejelasan bagi pembaca umum. Susunan pertanyaan retoris dipertahankan, dan tanda pisah menandai klausa penjelas.
