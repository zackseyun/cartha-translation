base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/006.yaml
  text: But the one who is not traced by genealogy from them has taken a tenth from Abraham and has blessed the one who had the promises[a][b].
translation:
  language: id
  text: Tetapi orang yang tidak tercatat dalam silsilah mereka telah menerima sepersepuluh dari Abraham dan telah memberkati orang yang memiliki janji-janji itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah memungut sepersepuluh dari Abraham.” Kata Yunani dapat berarti mengambil, memungut, atau menerima sepersepuluh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν
  choice: Namun, dia yang silsilahnya tidak ditelusuri dari antara mereka
  rationale: Partisipel pasif substantival ini menunjuk kepada Melkisedek dan menekankan bahwa silsilahnya tidak ditelusuri dari garis keturunan Lewi. Ungkapan ini mempertahankan nuansa pasif serta tidak menyiratkan bahwa ia sama sekali tidak mempunyai asal-usul biologis.
- source_word: δεδεκάτωκεν Ἀβραάμ
  choice: telah menerima sepersepuluh dari Abraham
  rationale: Verba perfek menyatakan tindakan yang telah terjadi dan tetap relevan bagi argumen penulis. 'Menerima sepersepuluh' alami dalam bahasa Indonesia dan memperjelas bahwa Abraham adalah pihak yang memberikannya.
- source_word: τὸν ἔχοντα τὰς ἐπαγγελίας
  choice: dia yang memegang janji-janji itu
  rationale: Partisipel kini ἔχοντα dipertahankan tanpa mengubahnya menjadi bentuk lampau. 'Memegang' menyampaikan bahwa Abraham memiliki atau menerima janji-janji tersebut, sementara bentuk jamak dan keacuannya dipertahankan.
- source_word: εὐλόγηκεν
  choice: telah memberkati
  rationale: Bentuk perfek diterjemahkan dengan 'telah' untuk mempertahankan tindakan lampau yang tetap penting dalam penalaran surat ini.
theological_decisions:
- issue: Hubungan silsilah Melkisedek dengan keimaman Lewi
  choice: Melkisedek digambarkan sebagai orang yang silsilahnya tidak ditelusuri dari antara keturunan Lewi.
  alternative: Ungkapan itu dapat diterjemahkan lebih longgar sebagai 'bukan keturunan mereka'.
  rationale: Konteks membahas dasar genealogis keimaman Lewi. Terjemahan ini mempertahankan fokus genealogis tersebut tanpa membuat klaim metafisik mengenai asal-usul atau hakikat Melkisedek.
- issue: Status Abraham sebagai pemegang janji-janji
  choice: Menggunakan bentuk kini 'memegang' sesuai partisipel Yunani.
  alternative: Menggunakan bentuk lampau 'telah menerima' atau 'memegang pada waktu itu'.
  rationale: Bentuk kini mempertahankan cara teks menggambarkan Abraham dan daya berlaku janji-janji itu dalam argumen, tanpa secara tidak perlu menyelesaikan ketegangan waktunya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Silsilahnya tidak ditelusuri' mempertahankan konstruksi pasif Yunani; 'sepersepuluh' lebih transparan bagi pembaca umum daripada istilah gerejawi 'persepuluhan'.
