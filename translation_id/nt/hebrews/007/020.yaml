  text: And inasmuch as this was not without an oath (for they indeed have become priests without an oath,[a]
translation:
  language: id
  text: Dan oleh karena hal ini tidak terjadi tanpa sumpah (sebab mereka memang menjadi imam tanpa sumpah,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terpisah dari sumpah.”
