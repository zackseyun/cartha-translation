lexical_decisions:
- source_word: Καὶ
  choice: Dan
  rationale: Mempertahankan kata penghubung yang mengaitkan ayat ini dengan argumen sebelumnya.
- source_word: καθ’ ὅσον
  choice: hal ini
  rationale: Dalam konstruksi komparatif yang berlanjut ke ayat 22, ungkapan ini menunjuk pada kadar atau dasar keunggulan yang sedang dibahas. Rumusan ini alami dalam bahasa Indonesia sambil membiarkan kalimat mencapai kesimpulannya pada ayat berikutnya.
- source_word: οὐ χωρὶς ὁρκωμοσίας
  choice: tidak terjadi tanpa sumpah
  rationale: Negasi ganda dipertahankan karena memberi tekanan retoris pada kenyataan bahwa penetapan yang dimaksud disertai sumpah; kata 'terjadi' dipasok agar klausa eliptis Yunani dapat dipahami secara alami.
- source_word: οἱ μὲν γὰρ
  choice: sebab mereka memang
  rationale: '''Sebab'' menyampaikan fungsi penjelas γάρ, sedangkan ''memang'' menandai bagian pertama kontras μέν yang dilanjutkan pada ayat berikutnya.'
- source_word: χωρὶς ὁρκωμοσίας
  choice: tanpa sumpah
  rationale: Terjemahan ringkas dan alami yang mempertahankan pengulangan frasa dari klausa sebelumnya.
- source_word: εἰσὶν ἱερεῖς γεγονότες
  choice: menjadi imam
  rationale: Menyampaikan masuknya mereka ke dalam jabatan imam tanpa membuat konstruksi Indonesia menjadi kaku; bentuk Yunani menyoroti keadaan yang dihasilkan oleh peristiwa tersebut.
theological_decisions:
- issue: Rujukan 'mereka' dan kontras mengenai sumpah
  choice: '''Mereka'' dibiarkan merujuk pada para imam sebelumnya dalam konteks, yang menjadi imam tanpa sumpah.'
  alternative: Menjelaskan secara langsung sebagai 'para imam Lewi' atau memperluasnya menjadi seluruh keimaman perjanjian lama.
  rationale: Konteks mendukung rujukan kepada para imam Lewi, tetapi ayat ini sendiri memakai kata ganti. Mempertahankan kata ganti menghindari penambahan penafsiran ke dalam teks dan membiarkan kontras dengan keimaman Yesus diselesaikan pada ayat berikutnya.
- issue: Bentuk kalimat yang belum selesai
  choice: Mempertahankan tanda kurung terbuka dan koma pada akhir ayat.
  alternative: Menutup atau melengkapi kalimat di dalam ayat 20.
  rationale: Teks Yunani berlanjut ke ayat 21 dan kesimpulan perbandingannya muncul kemudian; melengkapinya di sini akan memasukkan materi yang tidak terdapat dalam unit ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada argumentatif. Struktur yang menggantung dipertahankan karena ayat ini merupakan bagian awal kalimat yang berlanjut ke ayat berikutnya.
