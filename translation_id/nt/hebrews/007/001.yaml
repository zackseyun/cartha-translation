source:
  edition: SBLGNT
  text: Οὗτος γὰρ ὁ Μελχισέδεκ, βασιλεὺς Σαλήμ, ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου, ⸀ὁ συναντήσας Ἀβραὰμ ὑποστρέφοντι ἀπὸ τῆς κοπῆς τῶν βασιλέων καὶ εὐλογήσας αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/001.yaml
  text: For this Melchizedek[a], king of Salem, priest of God Most High, met Abraham as he was returning from the slaughter of the kings and blessed him[b],
translation:
  language: id
  text: Sebab Melkisedek ini, raja Salem, imam Allah Yang Mahatinggi, yang menemui Abraham ketika ia kembali dari pembantaian terhadap raja-raja dan memberkatinya[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “setelah mengalahkan raja-raja.” Secara lebih harfiah, bahasa Yunaninya mengatakan “dari pembantaian raja-raja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος γὰρ ὁ Μελχισέδεκ
  choice: Sebab Melkisedek ini
  rationale: γάρ menghubungkan ayat ini secara penjelasan dengan uraian sebelumnya, sedangkan Οὗτος mempertahankan penekanan demonstratif pada Melkisedek.
- source_word: βασιλεὺς Σαλήμ
  choice: raja Salem
  rationale: Terjemahan langsung yang mempertahankan nama tempat serta kaitannya dengan Kejadian 14.
- source_word: ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου
  choice: imam Allah Yang Mahatinggi
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan ὕψιστος sebagai gelar ilahi yang menerangkan Allah.
- source_word: ὁ συναντήσας Ἀβραὰμ
  choice: menemui Abraham
  rationale: Partisip aoris menyatakan tindakan Melkisedek terhadap Abraham; 'menemui' tepat dan alami dalam konteks perjumpaan yang disengaja.
- source_word: ὑποστρέφοντι
  choice: ketika ia kembali
  rationale: Partisip kini menerangkan Abraham dan menunjukkan tindakan yang sedang berlangsung pada saat pertemuan.
- source_word: ἀπὸ τῆς κοπῆς τῶν βασιλέων
  choice: dari pembantaian terhadap raja-raja
  rationale: κοπή secara harfiah menunjuk pada penebasan atau pembantaian. Penambahan 'terhadap' memperjelas bahwa raja-raja adalah sasaran tanpa mengurangi kekuatan istilah sumber.
- source_word: καὶ εὐλογήσας αὐτόν
  choice: lalu memberkatinya
  rationale: Partisip aoris kedua dikoordinasikan dengan tindakan menemui; 'lalu' menyampaikan urutan naratif secara wajar, dan akhiran '-nya' merujuk kepada Abraham.
theological_decisions:
- issue: Bentuk gelar ilahi τοῦ θεοῦ τοῦ ὑψίστου
  choice: imam Allah Yang Mahatinggi
  alternative: imam dari Allah Yang Mahatinggi; imam Allah, Yang Mahatinggi
  rationale: Pilihan utama mempertahankan gelar ilahi tanpa menambahkan gagasan teologis lain dan merupakan ungkapan Indonesia yang ringkas serta wajar.
- issue: Makna κοπή dalam laporan kemenangan Abraham
  choice: pembantaian terhadap raja-raja
  alternative: kekalahan raja-raja
  rationale: Pilihan utama mempertahankan gambaran keras dari kata Yunani. Alternatif yang lebih kontekstual dicatat tanpa secara diam-diam melunakkan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat. Struktur kalimat dan tanda koma terakhir dipertahankan karena ayat ini secara sintaksis berlanjut ke ayat berikutnya.
