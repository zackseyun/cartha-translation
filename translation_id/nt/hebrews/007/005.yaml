  to: Dan orang-orang dari antara anak-anak Lewi yang menerima jabatan imam mempunyai perintah menurut hukum Taurat untuk memungut sepersepuluh dari umat, yaitu dari saudara-saudara mereka[a], meskipun mereka pun adalah keturunan Abraham[b].
