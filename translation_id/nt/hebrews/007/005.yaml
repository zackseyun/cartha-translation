  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οἱ μὲν ἐκ τῶν υἱῶν Λευὶ τὴν ἱερατείαν λαμβάνοντες ἐντολὴν ἔχουσιν ἀποδεκατοῦν τὸν λαὸν κατὰ τὸν νόμον, τοῦτ’ ἔστιν τοὺς ἀδελφοὺς αὐτῶν, καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/005.yaml
  text: And those from the sons of Levi who receive the priesthood have a commandment according to the law to collect a tenth from the people—that is[b][a], from their brothers—though they also have come from Abraham’s loins.
translation:
  language: id
  text: Dan orang-orang dari antara anak-anak Lewi yang menerima jabatan imam mempunyai perintah menurut hukum Taurat untuk memungut sepersepuluh dari umat, yaitu dari saudara-saudara mereka[a], meskipun mereka pun adalah keturunan Abraham[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesama orang Israel.” Teks Yunani memakai kata maskulin “saudara-saudara” sebagai bahasa kekerabatan bagi sesama anggota umat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “telah keluar dari pinggang Abraham.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ἐκ τῶν υἱῶν Λευὶ
  choice: orang-orang dari antara anak-anak Lewi
  rationale: Mempertahankan nuansa partitif ἐκ serta bahasa kekerabatan υἱῶν; yang dimaksud bukan semua orang Lewi tanpa pembedaan, melainkan mereka dari garis Lewi yang menerima jabatan imam.
- source_word: τὴν ἱερατείαν λαμβάνοντες
  choice: yang menerima jabatan imam
  rationale: Kata 'menerima' mencerminkan λαμβάνοντες sebagai penerimaan kedudukan, sedangkan 'jabatan imam' lebih wajar dalam bahasa Indonesia modern daripada 'menerima keimaman'.
- source_word: ἐντολὴν ἔχουσιν
  choice: mempunyai perintah
  rationale: Mempertahankan konstruksi nominal Yunani dan daya hukum-perjanjian dari ἐντολή.
- source_word: ἀποδεκατοῦν
  choice: memungut sepersepuluh
  rationale: Menunjukkan tindakan mengambil atau mengumpulkan bagian sepersepuluh dari orang lain, bukan memberikannya.
- source_word: τὸν λαὸν
  choice: umat
  rationale: Menyampaikan λαός secara ringkas dalam konteks umat Israel, yang langsung diperjelas oleh frasa berikutnya.
- source_word: κατὰ τὸν νόμον
  choice: menurut hukum Taurat
  rationale: Mencerminkan daya normatif κατά dan memperjelas bahwa νόμος dalam konteks ini merujuk pada Taurat.
- source_word: τοῦτ’ ἔστιν
  choice: yaitu
  rationale: Ungkapan Indonesia yang alami untuk memperkenalkan penjelasan atau aposisi.
- source_word: τοὺς ἀδελφοὺς αὐτῶν
  choice: saudara-saudara mereka
  rationale: Mempertahankan bahasa kekerabatan maskulin dalam teks Yunani, sementara cakupan yang lebih luas sebagai sesama orang Israel dijelaskan dalam catatan kaki.
- source_word: καίπερ
  choice: meskipun
  rationale: Menyampaikan hubungan konsesif secara jelas dan wajar.
- source_word: ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ
  choice: mereka pun berasal dari tubuh Abraham
  rationale: Mempertahankan gambaran jasmani tentang asal-usul bersama dari Abraham tanpa memakai ungkapan 'keluar dari pinggang' yang sangat kaku dalam bahasa Indonesia modern; arti keturunan dan bentuk harfiahnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Bahasa kekerabatan dalam konteks umat Israel
  choice: saudara-saudara mereka
  alternative: sesama orang Israel
  rationale: Teks Yunani memakai ἀδελφούς, bahasa kekerabatan maskulin yang juga dapat mencakup sesama anggota umat. Teks utama mempertahankan bentuk kekerabatan dan catatan kaki menerangkan cakupannya.
- issue: Gambaran jasmani tentang keturunan Abraham
  choice: berasal dari tubuh Abraham
  alternative: merupakan keturunan Abraham
  rationale: Argumen ayat ini menekankan asal-usul jasmani yang sama. Pilihan utama mempertahankan gambaran tubuh tanpa menjadikannya terlalu janggal, sementara catatan kaki mencatat ungkapan harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur argumen dan bahasa kekerabatan dipertahankan, sementara ungkapan yang terlalu kaku dijelaskan melalui catatan kaki.
