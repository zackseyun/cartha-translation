base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/024.yaml
  text: But he[a], because he remains forever, holds the priesthood permanently.
translation:
  language: id
  text: Namun, karena Ia tetap hidup selama-lamanya, Ia memegang jabatan imam itu secara permanen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia memiliki jabatan imam yang tidak berubah” atau “jabatan imam yang tidak dapat dialihkan kepada orang lain.” Kata sifat Yunani ini dapat memuat kedua nuansa tersebut. Dalam konteks ini, karena Ia hidup selama-lamanya, jabatan imam-Nya tidak beralih kepada orang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Namun, ... Ia
  rationale: Artikel yang dipakai secara substantival menunjuk kembali kepada Yesus dan membedakan-Nya dari banyak imam sebelumnya. “Namun” menyampaikan daya kontras δέ secara alami.
- source_word: διὰ τὸ μένειν αὐτὸν
  choice: karena Ia tetap hidup
  rationale: διά dengan infinitif berartikel menyatakan sebab. Dalam konteks kontras dengan imam-imam yang meninggal, μένειν berarti terus ada atau tetap hidup; penambahan “hidup” memperjelas maksud tanpa mengubah argumen.
- source_word: εἰς τὸν αἰῶνα
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir. Pilihan ini alami, jelas, dan bermartabat dalam bahasa Indonesia modern.
- source_word: ἀπαράβατον
  choice: secara tetap
  rationale: Kata sifat ini dapat bernuansa tidak berubah atau tidak berpindah kepada orang lain. “Secara tetap” menyampaikan akibat kontekstualnya tanpa menutup ambiguitas leksikal, yang dicatat dalam catatan kaki.
- source_word: ἔχει τὴν ἱερωσύνην
  choice: memegang jabatan imam
  rationale: ἔχει menyatakan kepemilikan atau pemegangan suatu jabatan. “Memegang jabatan imam” alami dalam bahasa Indonesia dan menonjolkan bahwa jabatan itu tetap pada-Nya.
- source_word: ἱερωσύνην
  choice: jabatan imam
  rationale: Nomina ini menunjuk pada kedudukan atau jabatan keimaman. “Jabatan imam” lebih mudah dipahami pembaca umum daripada “keimaman” dan cocok dengan pemakaian ἔχει.
theological_decisions:
- issue: Makna ἀπαράβατον sehubungan dengan jabatan imam Kristus
  choice: Diterjemahkan “secara tetap” untuk menegaskan bahwa karena Ia hidup selamanya, jabatan imam itu terus dipegang-Nya.
  alternative: “tidak berubah” atau “tidak dapat dialihkan”
  rationale: Konteks membandingkan Yesus dengan imam-imam fana yang digantikan setelah meninggal. Terjemahan utama menyampaikan ketetapan jabatan-Nya tanpa menjadikan salah satu kemungkinan nuansa kata Yunani sebagai satu-satunya makna; alternatifnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia standar modern, jelas, dan bermartabat. Kapitalisasi “Ia” dipakai untuk rujukan kepada Yesus sesuai kebiasaan umum penerbitan Alkitab Indonesia. Susunan kalimat mempertahankan hubungan sebab-akibat dan kontras dengan ayat sebelumnya.
