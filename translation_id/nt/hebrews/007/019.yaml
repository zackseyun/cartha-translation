  text: οὐδὲν γὰρ ἐτελείωσεν ὁ νόμος, ἐπεισαγωγὴ δὲ κρείττονος ἐλπίδος, δι’ ἧς ἐγγίζομεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/019.yaml
  text: For the law perfected nothing[a], but there is the introduction of a better hope[b], through which we draw near to God.
translation:
  language: id
  text: Sebab hukum Taurat tidak menyempurnakan apa pun[a], tetapi diperkenalkanlah pengharapan yang lebih baik[b], dan melalui pengharapan itu kita mendekat kepada Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak membuat apa pun sempurna.” Kata kerja Yunani ini juga dapat berarti “membawa kepada penyelesaian” atau “membawa kepada tujuan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pemasukan pengharapan yang lebih baik” atau “dibawanya masuk pengharapan yang lebih baik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν
  choice: apa pun
  rationale: Dalam konstruksi negatif bahasa Indonesia, “tidak ... apa pun” merupakan padanan alami yang mempertahankan penyangkalan mutlak dan fungsi kata ini sebagai objek ἐτελείωσεν.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai penjelasan atau dasar bagi pernyataan sebelumnya dan mempertahankan hubungan argumentatif ayat ini.
- source_word: ἐτελείωσεν
  choice: menyempurnakan
  rationale: Mempertahankan istilah penting dalam Surat Ibrani mengenai pencapaian tujuan, kelengkapan, dan kelayakan untuk mendekat kepada Allah, tanpa mereduksinya menjadi sekadar “tidak menghasilkan apa-apa.”
- source_word: ὁ νόμος
  choice: hukum Taurat
  rationale: Dalam konteks ini menunjuk pada hukum Musa beserta tatanan keimamannya. “Hukum Taurat” jelas dan lazim bagi pembaca Indonesia modern.
- source_word: δὲ
  choice: Sebaliknya
  rationale: Menyatakan pertentangan kuat antara ketidakmampuan hukum Taurat untuk menyempurnakan dan diperkenalkannya pengharapan yang lebih baik.
- source_word: ἐπεισαγωγὴ
  choice: diperkenalkanlah
  rationale: Mengungkapkan gagasan masuk atau diperkenalkannya sesuatu dengan bahasa Indonesia yang alami. Bentuk pasif dipakai untuk menyampaikan klausa nominal eliptis Yunani tanpa menentukan pelaku yang tidak disebutkan.
- source_word: κρείττονος ἐλπίδος
  choice: suatu pengharapan yang lebih baik
  rationale: “Lebih baik” mempertahankan kosakata perbandingan yang berulang dalam Surat Ibrani, sedangkan “suatu” mencerminkan konstruksi tanpa artikel.
- source_word: δι’ ἧς
  choice: yang melaluinya
  rationale: Pronomina relatif feminin paling wajar merujuk kepada pengharapan dan menyatakan sarana untuk mendekat kepada Allah.
- source_word: ἐγγίζομεν
  choice: kita mendekat
  rationale: Mempertahankan nuansa akses kepada Allah yang bersifat ibadah dan imamat dalam Surat Ibrani, sekaligus tetap alami dalam bahasa Indonesia.
- source_word: τῷ θεῷ
  choice: kepada Allah
  rationale: Padanan Indonesia yang wajar untuk pelengkap datif setelah kata kerja “mendekat.”
theological_decisions:
- issue: Makna τελειόω dalam kaitannya dengan hukum Taurat
  choice: Hukum Taurat tidak menyempurnakan apa pun.
  alternative: Hukum Taurat sama sekali tidak melakukan apa-apa; atau hukum Taurat tidak membuat apa pun sempurna.
  rationale: Terjemahan ini mempertahankan bobot teologis τελειόω dalam Surat Ibrani—membawa kepada tujuan atau keadaan sempurna dan memberi akses kepada Allah—tanpa menyatakan bahwa hukum Taurat tidak mempunyai fungsi apa pun.
- issue: Pertentangan eliptis sesudah pernyataan tentang hukum Taurat
  choice: Sebaliknya, diperkenalkanlah suatu pengharapan yang lebih baik.
  alternative: Tetapi ada masuknya suatu pengharapan yang lebih baik; atau tetapi suatu pengharapan yang lebih baik dibawa masuk.
  rationale: Bahasa Yunani memakai frasa nominal tanpa verba finit. Bentuk pasif Indonesia menyampaikan hubungan eliptis tersebut secara alami tanpa menambahkan pelaku atau waktu tindakan yang tidak dinyatakan.
- issue: Rujukan δι’ ἧς
  choice: Merujuk kepada pengharapan yang lebih baik.
  alternative: Merujuk secara lebih luas kepada seluruh tatanan baru yang diperkenalkan.
  rationale: Kesesuaian bentuk feminin pronomina relatif dengan ἐλπίδος menunjukkan bahwa anteseden gramatikal paling langsung adalah “pengharapan,” tetapi terjemahan tidak menjabarkan lebih jauh isi pengharapan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang bermartabat dan mudah dipahami. “Hukum Taurat” dipilih demi kejelasan kontekstual. Susunan ayat dipecah menjadi dua kalimat untuk keterbacaan, sementara hubungan sebab dan pertentangannya tetap dipertahankan.
