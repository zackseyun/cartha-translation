  naturalness: Bentuk pasif “diperkenalkanlah” adalah cara Indonesia yang wajar untuk menyampaikan frasa nominal eliptis ἐπεισαγωγή tanpa menambahkan pelaku. Mengulang anteseden sebagai “melalui pengharapan itu” lebih lancar dan lebih jelas daripada “yang melaluinya,” sambil tetap mempertahankan rujukan feminin δι’ ἧς kepada ἐλπίδος.
