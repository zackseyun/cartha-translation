  text: Καὶ περισσότερον ἔτι κατάδηλόν ἐστιν, εἰ κατὰ τὴν ὁμοιότητα Μελχισέδεκ ἀνίσταται ἱερεὺς ἕτερος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/015.yaml
  text: And it is even more evident[a], if another priest arises according to the likeness of Melchizedek[b],
translation:
  language: id
  text: Dan hal itu lebih jelas lagi jika muncul seorang imam lain[a] menurut keserupaan dengan Melkisedek[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang imam yang berbeda”; ἕτερος dapat menekankan perbedaan, bukan hanya penambahan secara jumlah.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “menurut keserupaan dengan Melkisedek” menggemakan rumusan dan argumentasi yang diambil dari Mazmur 110:4 dalam pasal ini.
    reason: cross_reference
lexical_decisions:
- source_word: περισσότερον ἔτι
  choice: semakin ... lagi
  rationale: Ungkapan komparatif ini memperkuat pernyataan sebelumnya. Susunan ini wajar dalam bahasa Indonesia dan mempertahankan daya peningkatannya.
- source_word: κατάδηλόν
  choice: jelas
  rationale: Kata ini berarti nyata atau jelas. Pilihan “jelas” alami bagi pembaca modern tanpa menggandakan intensifikasi yang sudah dinyatakan oleh περισσότερον ἔτι.
- source_word: εἰ
  choice: jika
  rationale: Partikel Yunani ini berbentuk kondisional. “Jika” mempertahankan bentuk tersebut tanpa mengubahnya menjadi hubungan sebab yang lebih tegas seperti “karena”.
- source_word: κατὰ τὴν ὁμοιότητα
  choice: menurut keserupaan dengan
  rationale: Terjemahan ini mempertahankan gagasan ukuran atau pola yang dinyatakan oleh κατά serta makna keserupaan dalam ὁμοιότητα.
- source_word: Μελχισέδεκ
  choice: Melkisedek
  rationale: Mengikuti bentuk nama yang telah mapan dalam tradisi Alkitab bahasa Indonesia.
- source_word: ἀνίσταται
  choice: muncul
  rationale: Dalam konteks tampilnya seorang imam, “muncul” menyampaikan kemunculan atau tampilnya tokoh itu tanpa secara tidak perlu memberi kesan khusus tentang kebangkitan.
- source_word: ἱερεὺς ἕτερος
  choice: seorang imam lain
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap dapat menyatakan seorang imam yang berbeda dari keimaman yang sedang dibahas.
theological_decisions:
- issue: Nuansa ἕτερος dalam hubungannya dengan keimaman
  choice: seorang imam lain
  alternative: seorang imam yang berbeda
  rationale: Ayat ini membicarakan imam yang berbeda dari tatanan Lewi dan serupa dengan Melkisedek. “Imam lain” mempertahankan keluwesan makna ἕτερος, sedangkan kemungkinan penekanan pada perbedaannya dicatat dalam catatan kaki tanpa mempertegasnya secara berlebihan di dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kondisional dan peningkatan argumen dipertahankan, sementara susunan kalimat dibuat alami bagi pembaca umum.
