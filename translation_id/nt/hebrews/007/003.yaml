  text: ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος, μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων, ἀφωμοιωμένος δὲ τῷ υἱῷ τοῦ θεοῦ, μένει ἱερεὺς εἰς τὸ διηνεκές.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/003.yaml
  text: without father[a], without mother, without genealogy, having neither beginning of days nor end of life, but being made like the Son of God[b], he remains a priest perpetually.
translation:
  language: id
  text: tanpa ayah[a], tanpa ibu, tanpa silsilah, tidak memiliki permulaan hari maupun akhir kehidupan; dijadikan serupa dengan Anak Allah, ia tetap menjadi imam untuk selama-lamanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tanpa silsilah yang tercatat.” Kitab Kejadian tidak mencatat asal-usul atau silsilah Melkisedek, dan juga tidak mencatat awal maupun akhir hidupnya; surat ini menggunakan penyajian tersebut secara tipologis.
    reason: lexical_alternative
  - marker: b
    text: Atau, “terus-menerus” atau “untuk seterusnya.” Ungkapan ini menekankan sifat keimamannya yang tetap berlangsung dalam penyajian Kitab Suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος
  choice: tanpa ayah, tanpa ibu, tanpa silsilah
  rationale: Mempertahankan tiga ungkapan sejajar dalam bahasa Yunani secara ringkas dan bermartabat. Kata-kata ini dibiarkan tetap tegas dalam teks utama, sedangkan kemungkinan bahwa yang dimaksud ialah ketiadaan catatan silsilah dijelaskan dalam catatan kaki.
- source_word: μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων
  choice: tidak memiliki permulaan hari maupun akhir kehidupan
  rationale: Mempertahankan pasangan negasi dan kontras antara permulaan dan akhir. ‘Permulaan hari’ mengikuti ungkapan Yunani yang tinggi tanpa menjadi terlalu kaku dalam bahasa Indonesia.
- source_word: ἀφωμοιωμένος
  choice: telah dijadikan serupa
  rationale: Bentuk pasif perfek diterjemahkan dengan ‘telah dijadikan’ untuk mempertahankan daya pasif dan keadaan yang dihasilkan. ‘Serupa’ menyatakan kemiripan, bukan identitas.
- source_word: τῷ υἱῷ τοῦ θεοῦ
  choice: Anak Allah
  rationale: Padanan baku dan alami bagi gelar kristologis ini dalam bahasa Indonesia.
- source_word: μένει ἱερεὺς
  choice: ia tetap menjadi imam
  rationale: ‘Tetap’ menyampaikan keadaan berkelanjutan dari μένει, sedangkan ‘menjadi imam’ menghasilkan susunan Indonesia yang alami.
- source_word: εἰς τὸ διηνεκές
  choice: untuk seterusnya
  rationale: Mengungkapkan keberlangsungan yang terus berlanjut tanpa secara tidak perlu menentukan apakah tekanannya metafisis atau pada gambaran yang bertahan dalam Kitab Suci.
theological_decisions:
- issue: Apakah Melkisedek secara harfiah tidak berorang tua dan kekal, atau digambarkan demikian berdasarkan catatan Kitab Suci untuk tujuan tipologis
  choice: Teks utama mempertahankan semua sebutan yang tegas, sementara frasa ‘telah dijadikan serupa dengan Anak Allah’ mempertahankan arah perbandingan tipologisnya.
  alternative: Menafsirkan Melkisedek sebagai penampakan Anak sebelum inkarnasi, atau sebagai pribadi yang secara ontologis tidak berorang tua dan kekal.
  rationale: Kata pasif ἀφωμοιωμένος menyatakan bahwa Melkisedek dijadikan serupa dengan Anak Allah, bukan diidentikkan dengan-Nya. Keheningan kisah Kejadian tentang silsilah dan kematiannya mendukung pembacaan tipologis, tetapi terjemahan utama tidak meniadakan ketegangan dalam ungkapan ayat.
- issue: Cakupan εἰς τὸ διηνεκές bagi keimaman Melkisedek
  choice: untuk seterusnya
  alternative: selama-lamanya; terus-menerus
  rationale: Pilihan ini mempertahankan sifat keimaman yang berlangsung terus dalam penyajian Kitab Suci tanpa memaksakan kesimpulan ontologis yang melampaui bentuk argumentasi penulis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tinggi yang sesuai bagi argumentasi Surat Ibrani. Kesejajaran retoris dan ketegangan teologis teks dipertahankan, sementara catatan kaki menjelaskan alternatif leksikal tanpa memasukkannya secara dogmatis ke dalam teks utama.
