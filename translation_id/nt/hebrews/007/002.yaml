source:
  edition: SBLGNT
  text: ᾧ καὶ δεκάτην ἀπὸ πάντων ἐμέρισεν Ἀβραάμ, πρῶτον μὲν ἑρμηνευόμενος βασιλεὺς δικαιοσύνης ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ, ὅ ἐστιν βασιλεὺς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/002.yaml
  text: to whom Abraham also apportioned a tenth of everything[a]. First, his name is translated King of Righteousness, and then also King of Salem, that is[b], King of Peace.
translation:
  language: id
  text: Kepadanya juga Abraham memberikan sepersepuluh dari segala sesuatu.[a] Pertama, namanya ditafsirkan sebagai “Raja Kebenaran”,[b] kemudian juga “Raja Salem”, yaitu “Raja Damai”.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sepersepuluh”; dapat juga diterjemahkan “persepuluhan”.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Raja Keadilan”. Kata Yunani ini dapat berarti “kebenaran” atau “keadilan”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: kepadanya
  rationale: Pronomina relatif datif ini merujuk kepada Melkisedek sebagai penerima bagian yang diberikan Abraham.
- source_word: δεκάτην ἀπὸ πάντων
  choice: sepersepuluh dari segala sesuatu
  rationale: Mempertahankan ungkapan harfiah ‘sepersepuluh’ dan cakupan menyeluruh dari πάντων dalam bahasa Indonesia yang alami.
- source_word: ἐμέρισεν
  choice: memberikan
  rationale: Secara leksikal verba ini menyiratkan membagi atau mengalokasikan; dalam konteks pemberian persepuluhan, ‘memberikan’ paling alami, sedangkan gagasan bagiannya tetap tampak dalam ‘sepersepuluh’.
- source_word: ἑρμηνευόμενος
  choice: namanya ditafsirkan sebagai
  rationale: Partisip ini menjelaskan arti nama Melkisedek; penambahan ‘namanya’ membuat acuannya jelas tanpa menambah tafsiran teologis.
- source_word: βασιλεὺς δικαιοσύνης
  choice: Raja Kebenaran
  rationale: ‘Kebenaran’ merupakan padanan Indonesia yang wajar bagi δικαιοσύνη dalam gelar ini dan mempertahankan resonansi moral-teologisnya; kemungkinan arti ‘keadilan’ dicatat dalam catatan kaki.
- source_word: βασιλεὺς Σαλήμ
  choice: Raja Salem
  rationale: Σαλήμ dipertahankan sebagai nama tempat, dan frasa tersebut disajikan sebagai gelar.
- source_word: ὅ ἐστιν βασιλεὺς εἰρήνης
  choice: yaitu “Raja Damai”
  rationale: ὅ ἐστιν memperkenalkan penjelasan arti Salem, sedangkan ‘damai’ adalah padanan alami dan ringkas bagi εἰρήνη.
theological_decisions:
- issue: Makna δικαιοσύνη dalam penjelasan gelar Melkisedek
  choice: kebenaran
  alternative: keadilan
  rationale: δικαιοσύνη dapat menunjuk pada kebenaran atau keadilan. Teks utama memakai ‘kebenaran’ karena sesuai dengan pemakaian teologis yang mapan dan tetap alami dalam gelar tersebut, sementara alternatif leksikalnya dipertahankan dalam catatan kaki.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Struktur urutan ‘Pertama ... lalu ...’ dipertahankan. Huruf kapital dan tanda petik menandai frasa-frasa sebagai gelar. Catatan: data konsultasi Inggris menandai alternatif ‘King of Justice’ dengan [b] tetapi penanda [b] ditempatkan sesudah ‘that is’; draf Indonesia menghindari ketidakselarasan itu dengan hanya memakai catatan yang benar-benar diperlukan pada lokasi yang tepat.'
