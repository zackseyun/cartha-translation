  text: πρόδηλον γὰρ ὅτι ἐξ Ἰούδα ἀνατέταλκεν ὁ κύριος ἡμῶν, εἰς ἣν φυλὴν ⸂περὶ ἱερέων οὐδὲν⸃ Μωϋσῆς ἐλάλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/014.yaml
  text: For it is evident that our Lord has arisen from Judah[a], a tribe about which Moses said nothing concerning priests.
translation:
  language: id
  text: Sebab, jelas bahwa Tuhan kita berasal dari Yehuda[a], suku yang tentangnya Musa tidak mengatakan apa pun mengenai para imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah muncul dari Yehuda” atau “telah terbit dari Yehuda.” Kata kerja Yunani membangkitkan citra muncul atau terbit; di sini kata itu menunjuk pada asal-usul dari suku Yehuda, bukan terutama pada kebangkitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόδηλον
  choice: sudah jelas
  rationale: Ungkapan ini menyatakan fakta yang nyata dalam alur argumen; bentuk 'sudah jelas' alami dalam bahasa Indonesia modern tanpa melebihkan tekanannya.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelasan dengan argumen pada ayat sebelumnya.
- source_word: ἐξ Ἰούδα
  choice: dari Yehuda
  rationale: Menandai asal atau garis keturunan. Kata 'suku' tidak ditambahkan di sini karena disebutkan dalam klausa berikutnya.
- source_word: ἀνατέταλκεν
  choice: berasal
  rationale: Dalam konteks ini verba perfect tersebut menunjuk pada kemunculan atau asal Tuhan dari Yehuda. 'Berasal' menyampaikan maksud kontekstual secara alami, sementara citra harfiah 'terbit/tumbuh' dipertahankan dalam catatan kaki.
- source_word: ὁ κύριος ἡμῶν
  choice: Tuhan kita
  rationale: Padanan alami untuk gelar dan pronomina posesif tersebut; referennya tidak diperjelas dengan menambahkan nama yang tidak ada dalam teks.
- source_word: εἰς ἣν φυλήν
  choice: suku yang tentangnya
  rationale: Menautkan klausa relatif dengan Yehuda sebagai suku yang baru disebutkan dan mempertahankan fokus pada apa yang dikatakan Musa tentang suku itu.
- source_word: περὶ ἱερέων οὐδὲν
  choice: tidak mengatakan apa pun mengenai para imam
  rationale: Mempertahankan acuan konkret kepada imam-imam, bukan menggantinya dengan istilah abstrak 'keimaman'.
- source_word: Μωϋσῆς ἐλάλησεν
  choice: Musa ... mengatakan
  rationale: Padanan idiomatis bagi λαλέω dalam konstruksi negatif ini.
theological_decisions:
- issue: Rujukan 'Tuhan kita'
  choice: Mempertahankan gelar 'Tuhan kita' tanpa menambahkan 'Yesus'.
  alternative: Tuhan kita Yesus
  rationale: Konteks mengidentifikasikannya sebagai Yesus, tetapi nama itu tidak terdapat dalam ayat ini; terjemahan mempertahankan bentuk teks sumber.
- issue: Makna ἀνατέταλκεν
  choice: Memakai 'berasal' dalam teks utama sebagai rujukan kepada asal atau garis keturunan dari Yehuda.
  alternative: telah terbit; telah tumbuh; telah bangkit
  rationale: Konteks membahas afiliasi suku dan syarat keimaman, bukan terutama kebangkitan. Catatan kaki menjaga metafora verba Yunani agar nuansa sumber tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan hubungan penjelasan dan isi spesifik teks Yunani, sambil memakai 'berasal' agar makna garis keturunan jelas bagi pembaca umum. Penanda catatan kaki [a] ditempatkan tepat setelah 'Yehuda'.
