  text: χωρὶς δὲ πάσης ἀντιλογίας τὸ ἔλαττον ὑπὸ τοῦ κρείττονος εὐλογεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/007.yaml
  text: Beyond all dispute[a], the lesser is blessed by the greater.
translation:
  language: id
  text: Tanpa bantahan[a], yang lebih rendah diberkati oleh yang lebih tinggi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tanpa perbantahan" atau "tanpa pertentangan apa pun."
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πάσης ἀντιλογίας
  choice: Namun, tidak dapat disangkal
  rationale: Ungkapan ini menyatakan bahwa prinsip berikut tidak terbantahkan. 'Tidak dapat disangkal' alami dalam bahasa Indonesia modern; 'namun' menyampaikan daya penghubung ringan dari δέ dalam konteks argumen.
- source_word: τὸ ἔλαττον
  choice: yang lebih rendah
  rationale: Bentuk komparatif substantival ini menunjuk secara umum kepada pihak yang lebih rendah kedudukan atau statusnya, bukan lebih rendah secara moral.
- source_word: ὑπὸ τοῦ κρείττονος
  choice: oleh yang lebih tinggi
  rationale: ὑπό dengan genitif menandai pelaku dalam konstruksi pasif, sedangkan κρείττων menyatakan kedudukan yang lebih tinggi dalam perbandingan ini.
- source_word: εὐλογεῖται
  choice: diberkati
  rationale: Bentuk kini pasif menyatakan bahwa pihak tersebut menerima berkat; ini paling langsung sesuai dengan tindakan Melkisedek terhadap Abraham dalam konteks.
theological_decisions:
- issue: Sifat perbandingan antara pihak yang lebih rendah dan yang lebih tinggi
  choice: Ayat menyatakan prinsip umum bahwa pihak yang lebih rendah kedudukannya diberkati oleh pihak yang lebih tinggi.
  alternative: Ayat hanya menggambarkan kebiasaan sosial tanpa bobot teologis.
  rationale: Dalam Ibrani 7, prinsip ini menopang argumen tentang keunggulan Melkisedek atas Abraham. Terjemahan mempertahankan bahasa perbandingan status tanpa menambahkan penafsiran yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Istilah 'lebih rendah' dan 'lebih tinggi' dipilih untuk menunjukkan perbandingan kedudukan tanpa menyiratkan nilai moral.
