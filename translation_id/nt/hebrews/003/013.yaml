  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ παρακαλεῖτε ἑαυτοὺς καθ’ ἑκάστην ἡμέραν, ἄχρις οὗ τὸ Σήμερον καλεῖται, ἵνα μὴ σκληρυνθῇ ⸂τις ἐξ ὑμῶν⸃ ἀπάτῃ τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/013.yaml
  text: But encourage one another every day[b][a], as long as it is called “Today,” so that none of you may be hardened by the deceitfulness of sin.
translation:
  language: id
  text: Tetapi, hendaklah kalian saling menguatkan[b] setiap hari, selama masih disebut “Hari Ini”[a], supaya tidak seorang pun di antara kalian dikeraskan oleh tipu daya dosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hari Ini” menggemakan Mazmur 95 dan menunjuk pada masa sekarang ketika panggilan Allah harus dijawab.
    reason: cross_reference
  - marker: b
    text: Atau “saling menasihati.” Kata Yunani ini dapat berarti menguatkan, menasihati, mendorong, atau menghibur, bergantung pada konteksnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sebaliknya
  rationale: Menandai pertentangan kuat dengan peringatan pada ayat sebelumnya dan terdengar alami dalam bahasa Indonesia.
- source_word: παρακαλεῖτε
  choice: hendaklah kalian saling menguatkan
  rationale: Bentuk imperatif kini menyatakan tindakan yang harus terus dilakukan. “Menguatkan” mencakup dorongan untuk bertahan, sementara unsur timbal balik dari ἑαυτούς dinyatakan dengan “saling.”
- source_word: ἑαυτοὺς
  choice: saling
  rationale: 'Walaupun secara bentuk berarti “diri kalian,” dalam perintah kepada kelompok kata ini berfungsi timbal balik: setiap anggota bertindak terhadap yang lain.'
- source_word: καθ’ ἑκάστην ἡμέραν
  choice: setiap hari
  rationale: Ungkapan yang alami dan jelas untuk tindakan yang diulang dari hari ke hari.
- source_word: ἄχρις οὗ τὸ Σήμερον καλεῖται
  choice: selama masih dapat dikatakan “Hari Ini”
  rationale: Mempertahankan cakupan waktu yang terus berlangsung serta gema khas “Hari Ini” dari Mazmur 95. Bentuk ini lebih alami dalam bahasa Indonesia daripada terjemahan pasif yang kaku.
- source_word: ἵνα μὴ σκληρυνθῇ τις ἐξ ὑμῶν
  choice: supaya tidak seorang pun di antara kalian dikeraskan
  rationale: Mempertahankan tujuan negatif, cakupan peringatan kepada setiap anggota, dan bentuk pasif σκληρυνθῇ tanpa menentukan pelaku yang tidak disebutkan.
- source_word: ἀπάτῃ τῆς ἁμαρτίας
  choice: oleh tipu daya dosa
  rationale: 'Dativus dipahami secara instrumental: daya tipu dosa menjadi sarana terjadinya pengerasan.'
theological_decisions:
- issue: Makna timbal balik dalam ἑαυτούς
  choice: saling menguatkan
  alternative: menguatkan diri kalian sendiri
  rationale: Dalam perintah jamak ini, pronomina refleksif mempunyai daya timbal balik. Terjemahan “saling” mempertahankan tanggung jawab bersama jemaat dan tidak mengubahnya menjadi tindakan individual.
- issue: Makna τὸ Σήμερον
  choice: “Hari Ini” sebagai gema panggilan Allah dalam Mazmur 95 yang berlaku pada masa kini
  alternative: hari ini sebagai keterangan waktu biasa semata-mata
  rationale: Konteks langsung Ibrani 3 mengutip dan menerapkan Mazmur 95. Tanda petik dan huruf kapital menunjukkan gema antarteks tanpa menjabarkan tafsir di dalam teks utama.
- issue: Sifat pasif pengerasan
  choice: dikeraskan
  alternative: menjadi keras hati
  rationale: Bentuk pasif dipertahankan agar teks tidak secara diam-diam menentukan apakah pengerasan hanya merupakan perubahan diri, tindakan dosa, atau tindakan ilahi. Ungkapan berikutnya tetap menyebut tipu daya dosa sebagai sarana.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian” agar daya perintah kepada komunitas tetap jelas. Diksi dibuat wajar dan bermartabat; bentuk pasif “dikeraskan” sengaja dipertahankan meskipun sedikit lebih bercorak bahasa Alkitab untuk menjaga ambiguitas sumber.
