  text: πλείονος γὰρ ⸂οὗτος δόξης⸃ παρὰ Μωϋσῆν ἠξίωται καθ’ ὅσον πλείονα τιμὴν ἔχει τοῦ οἴκου ὁ κατασκευάσας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/003.yaml
  text: For this one has been counted worthy of more glory than Moses, just as the one who built the house has greater honor than the house.
translation:
  language: id
  text: Sebab, Dia telah dianggap layak menerima kemuliaan yang lebih besar daripada Musa, karena orang yang membangun rumah itu mempunyai kehormatan yang lebih besar daripada rumah itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Dia
  rationale: Kata tunjuk ini merujuk kembali kepada Yesus dalam konteks ayat sebelumnya; huruf kapital membantu memperjelas rujukan tanpa menambahkan nama yang tidak ada dalam ayat.
- source_word: δόξης
  choice: kemuliaan
  rationale: Padanan baku yang mempertahankan bobot teologis dan kontras dengan τιμή.
- source_word: ἠξίωται
  choice: dianggap layak menerima
  rationale: Mencerminkan bentuk perfektum pasif dan gagasan penilaian kelayakan, bukan sekadar penerimaan faktual.
- source_word: καθ’ ὅσον
  choice: sebagaimana
  rationale: Dalam kalimat ini memperkenalkan perbandingan yang menjelaskan kadar kemuliaan yang lebih besar.
- source_word: κατασκευάσας
  choice: membangun
  rationale: Dalam konteks οἶκος, kata ini secara alami berarti mendirikan atau membangun rumah; nuansa lebih luas seperti mempersiapkan tidak diperlukan di sini.
- source_word: τιμὴν
  choice: kehormatan
  rationale: Membedakannya dari δόξα, sambil mempertahankan perbandingan antara pembangun dan rumah.
- source_word: οἴκου
  choice: rumah
  rationale: Mempertahankan metafora sumber dan kesinambungannya dengan konteks Ibrani 3.
theological_decisions:
- issue: Identitas οὗτος
  choice: Dia, merujuk kepada Yesus dari konteks ayat 1–2
  alternative: orang ini / yang satu ini
  rationale: Rujukannya jelas secara kontekstual, tetapi nama Yesus tidak disisipkan ke dalam teks ayat ini.
- issue: Hubungan antara pembangun dan rumah
  choice: Metafora dibiarkan tanpa menjelaskan siapa pembangun atau rumah pada tahap ini
  alternative: Menafsirkan pembangun secara eksplisit sebagai Kristus dan rumah sebagai umat Allah
  rationale: Ayat berikutnya mengembangkan argumen tersebut; terjemahan ini tidak mendahului atau menyederhanakan ketegangan argumentatif teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur perbandingan dipertahankan, dengan pengulangan 'rumah' agar rujukan tidak kabur.
