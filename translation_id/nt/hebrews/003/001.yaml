  text: Ὅθεν, ἀδελφοὶ ἅγιοι, κλήσεως ἐπουρανίου μέτοχοι, κατανοήσατε τὸν ἀπόστολον καὶ ἀρχιερέα τῆς ὁμολογίας ἡμῶν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/001.yaml
  text: Therefore[a], holy brothers, sharers in a heavenly calling, consider Jesus, the apostle and high priest of our confession[c][b],
translation:
  language: id
  text: Oleh karena itu, saudara-saudara yang kudus[a], yang mendapat bagian dalam panggilan surgawi[b], perhatikanlah dengan saksama Yesus, Rasul dan Imam Besar dalam pengakuan kita[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sapaan “saudara-saudara” di sini ditujukan kepada seluruh komunitas orang percaya, termasuk perempuan.
    reason: cultural_note
  - marker: b
    text: Atau, “yang turut mengambil bagian dalam panggilan surgawi.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “Yesus, Rasul dan Imam Besar yang kita akui.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: Oleh karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya, khususnya Ibrani 2:17–18, dan mempertahankan daya inferensial kata penghubung Yunani.
- source_word: ἀδελφοὶ ἅγιοι
  choice: saudara-saudara yang kudus
  rationale: Mempertahankan bentuk sapaan kekeluargaan dan sifat 'kudus' sebagai penanda umat yang dikhususkan bagi Allah. Cakupan seluruh jemaat dijelaskan dalam catatan kaki.
- source_word: κλήσεως ἐπουρανίου μέτοχοι
  choice: yang mendapat bagian dalam panggilan surgawi
  rationale: Ungkapan ini menyatakan partisipasi nyata dalam panggilan ilahi. 'Surgawi' mempertahankan kemungkinan makna asal maupun sifat panggilan tersebut.
- source_word: κατανοήσατε
  choice: perhatikanlah dengan saksama
  rationale: Imperatif ini menuntut perhatian dan perenungan yang terarah, bukan sekadar melihat atau mengetahui.
- source_word: ἀπόστολον
  choice: Rasul
  rationale: Mempertahankan gelar yang secara eksplisit diterapkan kepada Yesus dan makna-Nya sebagai Dia yang diutus, tanpa menggantinya dengan parafrasa.
- source_word: ἀρχιερέα
  choice: Imam Besar
  rationale: Istilah baku dan mudah dipahami untuk jabatan kultis Yahudi yang menjadi tema utama dalam Surat Ibrani.
- source_word: τῆς ὁμολογίας ἡμῶν
  choice: yang kita akui
  rationale: Menghasilkan bahasa Indonesia yang alami dan mempertahankan kaitan Yesus dengan pengakuan bersama umat. Kemungkinan konstruksi yang mengaitkan kedua gelar dengan 'pengakuan kita' dicatat sebagai alternatif.
- source_word: Ἰησοῦν
  choice: Yesus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοὶ
  choice: saudara-saudara, dengan cakupan inklusif dijelaskan dalam catatan kaki
  alternative: saudara-saudari; sesama saudara
  rationale: Bentuk Yunani adalah jamak maskulin, tetapi dalam konteks ini menyapa seluruh komunitas orang percaya. Terjemahan mempertahankan bentuk sumber tanpa menyiratkan bahwa perempuan dikecualikan.
- issue: Gelar ἀπόστολος bagi Yesus
  choice: Rasul
  alternative: Utusan; Dia yang diutus
  rationale: Teks secara khas menyebut Yesus ἀπόστολος. Mempertahankan gelar itu menjaga daya teologis dan sastrawinya tanpa menjelaskannya secara berlebihan.
- issue: Hubungan τῆς ὁμολογίας ἡμῶν dengan gelar-gelar Yesus
  choice: Yesus, Rasul dan Imam Besar yang kita akui
  alternative: Yesus, Rasul dan Imam Besar dalam pengakuan iman kita
  rationale: Genitif Yunani ringkas dan dapat dipahami sebagai pengakuan yang berpusat pada Yesus atau sebagai ranah tempat kedua gelar itu diakui. Teks utama memilih susunan Indonesia yang paling alami, sementara alternatif mempertahankan ambiguitas relasionalnya dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, sementara istilah teologis utama—Rasul, Imam Besar, panggilan surgawi, dan kudus—dipertahankan.
