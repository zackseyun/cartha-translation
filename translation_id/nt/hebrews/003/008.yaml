id: HEB.3.8
reference: Hebrews 3:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ, κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/008.yaml
  text: do not harden your hearts as in the rebellion[a], as on the day of testing in the wilderness,
translation:
  language: id
  text: janganlah keraskan hati kalian seperti dalam pemberontakan itu, seperti pada hari pengujian di padang gurun,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan mengikuti nama-nama tempat dalam teks Ibrani yang melatarbelakangi Mazmur 95:8, “seperti di Meriba, pada hari di Masa di padang gurun.”
    reason: Bacaan alternatif yang menjelaskan latar nama tempat Ibrani di balik ungkapan Yunani.
lexical_decisions:
- source_word: μὴ σκληρύνητε
  choice: janganlah keraskan
  rationale: Subjungtif aoristus aktif dengan μή menyatakan larangan langsung. Bentuk aktif mempertahankan tanggung jawab para pendengar atas tanggapan mereka.
- source_word: τὰς καρδίας ὑμῶν
  choice: hati kalian
  rationale: καρδία menunjuk pada batin sebagai pusat kehendak, pikiran, dan sikap, bukan hanya emosi. 'Kalian' memperjelas bahwa ὑμῶν berbentuk jamak dan ditujukan kepada komunitas.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: seperti dalam pemberontakan itu
  rationale: παραπικρασμός dapat berarti tindakan memprovokasi atau pemberontakan. Dalam kutipan Mazmur 95, 'pemberontakan' menyampaikan peristiwa dan bobot moralnya secara wajar; 'itu' menandai peristiwa historis yang dikenal.
- source_word: κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ
  choice: seperti pada hari pengujian
  rationale: κατά dengan akusatif dipahami secara komparatif sesuai paralel dengan ὡς, sedangkan πειρασμός di sini menunjuk pada peristiwa pengujian di padang gurun, bukan semata-mata godaan batin.
- source_word: ἐν τῇ ἐρήμῳ
  choice: di padang gurun
  rationale: '''Padang gurun'' merupakan ungkapan Indonesia yang alami dan mempertahankan gema kisah pengembaraan Israel.'
theological_decisions:
- issue: Penyajian latar historis Mazmur 95
  choice: Menerjemahkan nomina Yunani secara deskriptif sebagai 'pemberontakan' dan 'pengujian' dalam teks utama.
  alternative: 'Menggunakan nama tempat Ibrani: ''di Meriba, pada hari di Masa di padang gurun.'''
  rationale: Ibrani 3:8 mengutip bentuk Yunani yang menerjemahkan nama-nama Ibrani dengan nomina interpretatif. Keutamaan sumber bahasa asli menuntut agar teks utama mengikuti bentuk Yunani, sementara latar nama tempat dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menyatakan sapaan orang kedua jamak secara jelas. Struktur ganda 'seperti ... seperti ...' dipertahankan untuk mencerminkan paralelisme teks Yunani.
