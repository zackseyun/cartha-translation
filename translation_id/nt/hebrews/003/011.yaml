  text: ὡς ὤμοσα ἐν τῇ ὀργῇ μου· Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/011.yaml
  text: as I swore in my wrath[a], ‘They shall never enter my rest.’
translation:
  language: id
  text: seperti yang Aku sumpahkan dalam murka-Ku, “Mereka tidak akan pernah masuk ke dalam perhentian-Ku.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Yunani, “Jika mereka akan masuk ke dalam perhentian-Ku,” yaitu rumusan sumpah yang berarti, “Mereka tidak akan pernah masuk ke dalam perhentian-Ku.”
    reason: Menjelaskan bentuk harfiah dan makna idiomatis rumusan sumpah Semitis.
lexical_decisions:
- source_word: ὡς
  choice: seperti yang
  rationale: Menghubungkan klausa ini dengan konteks kutipan sebelumnya secara alami sambil mempertahankan nuansa perbandingan/deklaratif.
- source_word: ὤμοσα
  choice: telah Aku sumpahkan
  rationale: Menyatakan tindakan bersumpah yang sudah terjadi; susunan ini alami dan khidmat dalam bahasa Indonesia.
- source_word: ἐν τῇ ὀργῇ μου
  choice: dalam murka-Ku
  rationale: “Murka” mempertahankan bobot penghakiman ilahi yang lebih kuat daripada sekadar “kemarahan”.
- source_word: Εἰ εἰσελεύσονται
  choice: Mereka pasti tidak akan masuk
  rationale: Bentuk εἰ dengan verba masa depan merupakan rumusan sumpah Semitis yang secara idiomatis menyatakan penyangkalan tegas, bukan syarat biasa.
- source_word: εἰς τὴν κατάπαυσίν μου
  choice: masuk ke tempat peristirahatan-Ku
  rationale: Mempertahankan gerak εἰς (“ke dalam”) dan motif κατάπαυσις sebagai peristirahatan yang Allah miliki atau sediakan, tanpa membatasinya menjadi negeri, surga, atau ketenangan batin.
theological_decisions:
- issue: Rumusan sumpah Εἰ εἰσελεύσονται
  choice: 'Penyangkalan tegas: “Mereka pasti tidak akan masuk”'
  alternative: 'Secara harfiah: “Jika mereka akan masuk”'
  rationale: Terjemahan harfiah akan terdengar sebagai klausa bersyarat yang tidak selesai dalam bahasa Indonesia. Penyangkalan eksplisit menyampaikan daya sumpah dalam idiom sumber tanpa menambahkan ajaran tertentu.
- issue: Makna κατάπαυσις
  choice: tempat peristirahatan
  alternative: perhentian; istirahat
  rationale: Pilihan ini tetap cukup luas untuk perkembangan argumen dalam Ibrani dan kaitannya dengan Mazmur 95, serta tidak menyamakannya secara prematur dengan tanah, surga, atau pengalaman batin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab Indonesia. “Pasti tidak akan” dipilih untuk menyampaikan penyangkalan sumpah secara tegas; “tempat peristirahatan” menjaga motif teologis sekaligus arah gerak verba “masuk”.
