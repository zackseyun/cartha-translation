translation:
  language: id
  text: di tempat nenek moyangmu menguji Aku dengan ujian dan melihat perbuatan-perbuatan-Ku.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Yunani ini sulit dan dapat juga diterjemahkan “menguji Aku dengan pengujian” atau “mencobai Aku”; frasa tersebut dapat menyatakan cara atau sarana.
    reason: lexical_alternative
  - marker: b
    text: 'Sebagian terjemahan mengungkapkan hubungan konsesif: “namun telah melihat perbuatan-perbuatan-Ku” atau “meskipun telah melihat perbuatan-perbuatan-Ku.” Teks Yunani hanya berbunyi “dan melihat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: di tempat
  rationale: Mempertahankan makna lokatif yang merujuk pada padang gurun dalam ayat sebelumnya; 'ketika' mungkin menurut konteks, tetapi kurang langsung.
- source_word: ἐπείρασαν
  choice: menguji
  rationale: Menyatakan tindakan mencoba atau menguji Allah dalam arti negatif dan menantang, sesuai gema Mazmur 95.
- source_word: οἱ πατέρες ὑμῶν
  choice: nenek moyangmu
  rationale: Ungkapan Indonesia yang alami dan bermartabat untuk para leluhur historis; bentuk tunggal posesif sesuai sapaan kolektif ὑμῶν.
- source_word: ἐν δοκιμασίᾳ
  choice: dengan pencobaan
  rationale: Mempertahankan unsur pengujian dalam frasa yang sulit ini serta kemungkinan nuansa cara atau sarana, tanpa menjadikannya lebih spesifik daripada teks sumber.
- source_word: καὶ εἶδον
  choice: dan melihat
  rationale: Menerjemahkan koordinasi sederhana καί tanpa menambahkan hubungan konsesif yang tidak dinyatakan secara eksplisit.
- source_word: τὰ ἔργα μου
  choice: perbuatan-perbuatan-Ku
  rationale: Merujuk pada tindakan-tindakan Allah di padang gurun dan mempertahankan bentuk jamak serta ragam alkitabiah yang wajar.
theological_decisions:
- issue: Objek tindakan menguji
  choice: menguji Aku
  alternative: menguji
  rationale: Walaupun objek tidak tertulis secara eksplisit dalam klausa Yunani SBLGNT, Allah jelas menjadi objek tersirat dari konteks kutipan Mazmur 95. Menyatakan 'Aku' menghasilkan bahasa Indonesia yang alami tanpa menambah ajaran.
- issue: Hubungan antara pengujian dan melihat perbuatan Allah
  choice: dan melihat
  alternative: meskipun telah melihat
  rationale: Teks Yunani hanya memakai καί. Nuansa konsesif dapat dipahami dari konteks, tetapi tidak dimasukkan ke teks utama agar ketegangan sumber tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi 'Aku' menandai pembicara ilahi menurut kebiasaan ejaan Alkitab Indonesia. Penanda catatan ditempatkan setelah klausa yang diterangkannya.
