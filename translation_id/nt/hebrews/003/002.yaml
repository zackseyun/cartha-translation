base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/002.yaml
  text: who was faithful to the one who appointed him[b][a], just as Moses also was in all his house.
translation:
  language: id
  text: yang setia kepada Dia yang menetapkan-Nya[a], sebagaimana Musa juga setia di dalam rumah-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuat-Nya.” Kata kerja Yunani ini dapat berarti “membuat”, tetapi dalam konteks ini kemungkinan berarti “menetapkan” atau “menugaskan”.
    reason: lexical_alternative
  - marker: b
    text: Sejumlah naskah memuat “di dalam seluruh rumah-Nya”, yang menggemakan Bilangan 12:7 dengan lebih dekat; naskah-naskah lain hanya memuat “di dalam rumah-Nya”. Frasa ini kemungkinan menunjuk pada rumah Allah.
    reason: textual_variant
lexical_decisions:
- source_word: πιστὸν ὄντα
  choice: yang setia
  rationale: Frasa partisipial ini menerangkan Yesus dalam ayat 1. Klausa relatif terdengar alami dalam bahasa Indonesia, dan πιστός di sini menyatakan kesetiaan atau keterandalan, bukan tindakan percaya.
- source_word: τῷ ποιήσαντι αὐτὸν
  choice: kepada Dia yang menetapkan-Nya
  rationale: Dalam konteks tugas dan pelayanan yang dibandingkan dengan Musa, ποιέω paling wajar menyatakan penetapan atau pengangkatan. Bentuk datif mengikuti πιστός dan diterjemahkan dengan 'kepada'.
- source_word: ὡς καὶ
  choice: sebagaimana ... juga
  rationale: Ungkapan ini menyampaikan perbandingan antara kesetiaan Yesus dan kesetiaan Musa secara jelas dan wajar.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: di dalam rumah-Nya
  rationale: Kata 'rumah' dipertahankan karena ayat-ayat berikut mengembangkan citra rumah secara teologis. Pronomina tetap dipertahankan, tanpa menggantinya secara eksplisit dengan 'Allah', meskipun konteks dan gema Bilangan 12:7 menunjuk pada rumah Allah.
theological_decisions:
- issue: Makna ποιήσαντι ketika mengacu kepada Sang Anak
  choice: menetapkan
  alternative: membuat
  rationale: '''Membuat'' dimungkinkan secara leksikal, tetapi dalam konteks ini dapat disalahpahami sebagai pernyataan bahwa Sang Anak diciptakan. ''Menetapkan'' menyampaikan makna kontekstual berupa pemberian tugas tanpa meniadakan alternatif leksikal, yang dicatat dalam catatan kaki.'
- issue: Acuan αὐτοῦ dalam 'rumah-Nya'
  choice: Pronomina dipertahankan sebagai 'rumah-Nya'
  alternative: rumah Allah; rumah Musa
  rationale: Konteks dan gema Bilangan 12:7 paling mungkin menunjuk pada rumah Allah. Namun, teks utama mempertahankan bentuk pronominal bahasa Yunani dan tidak mengganti acuan itu dengan nomina eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan klausa dibuat alami tanpa menghilangkan hubungan ayat ini dengan Yesus dalam ayat 1. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia; kata 'rumah' dipertahankan agar metafora yang berlanjut dalam konteks tidak hilang.
