revisions:
- from: Sebab kita telah menjadi orang-orang yang mendapat bagian dalam Mesias,[a] asalkan kita berpegang teguh sampai akhir pada keyakinan yang kita miliki sejak semula.[b]
  to: Sebab kita telah menjadi pengambil bagian dalam Mesias,[a] jika kita tetap berpegang teguh pada permulaan keyakinan kita sampai akhir.[b]
  rationale: Revisi mempertahankan kondisi nyata dalam ἐάνπερ tanpa menafsirkan implikasi teologisnya, menempatkan "sampai akhir" bersama tindakan mempertahankan, dan memulihkan "permulaan" sebagai unsur eksplisit dari objek τὴν ἀρχὴν τῆς ὑποστάσεως. Padanan untuk μέτοχοι dipadatkan tanpa mengubah arti partisipatifnya.
