id: HEB.3.14
reference: Hebrews 3:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μέτοχοι γὰρ ⸂τοῦ Χριστοῦ γεγόναμεν⸃, ἐάνπερ τὴν ἀρχὴν τῆς ὑποστάσεως μέχρι τέλους βεβαίαν κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/014.yaml
  text: For we have become sharers in the Messiah, if indeed we hold the beginning of our assurance firm to the end.
translation:
  language: id
  text: Sebab kita telah menjadi pengambil bagian dalam Mesias,[a] jika kita tetap berpegang teguh pada permulaan keyakinan kita sampai akhir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang mendapat bagian dalam Mesias” atau “orang-orang yang turut mengambil bagian dalam Mesias.”
    reason: lexical_alternative
  - marker: b
    text: Atau “permulaan jaminan kita.” Kata Yunani yang diterjemahkan “keyakinan” juga dapat berarti “jaminan” dan, dalam konteks tertentu, “hakikat” atau “kenyataan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μέτοχοι
  choice: orang-orang yang mendapat bagian
  rationale: Ungkapan ini menyampaikan makna turut memiliki atau mengambil bagian dalam sesuatu secara wajar dalam bahasa Indonesia, tanpa memakai istilah yang terlalu teknis.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata penghubung ini memberikan alasan atau penjelasan bagi peringatan sebelumnya.
- source_word: τοῦ Χριστοῦ
  choice: dalam Mesias
  rationale: Χριστός di sini berfungsi sebagai gelar, dan konstruksi dengan μέτοχοι menyatakan bahwa orang-orang tersebut mendapat bagian dalam Mesias.
- source_word: γεγόναμεν
  choice: kita telah menjadi
  rationale: Bentuk perfektum menunjukkan keadaan kini yang dihasilkan oleh peristiwa sebelumnya; 'telah menjadi' mempertahankan kedua nuansa itu.
- source_word: ἐάνπερ
  choice: asalkan
  rationale: Kata ini mempertahankan kondisi yang ditekankan, lebih kuat daripada sekadar 'jika', tanpa menjelaskan implikasi teologisnya.
- source_word: τὴν ἀρχὴν τῆς ὑποστάσεως
  choice: keyakinan yang kita miliki sejak semula
  rationale: Secara idiomatis menyampaikan gagasan tentang keyakinan atau pendirian yakin pada awalnya; hubungan genitif Yunani tidak dipaksakan menjadi frasa Indonesia yang kaku.
- source_word: μέχρι τέλους
  choice: sampai akhir
  rationale: Ungkapan ini menyatakan ketekunan sepanjang seluruh rentang hingga akhir.
- source_word: βεβαίαν κατάσχωμεν
  choice: kita berpegang teguh
  rationale: Gabungan verba dan adjektiva menyatakan mempertahankan sesuatu dengan kokoh; susunan Indonesia ini alami dan tetap mempertahankan unsur keteguhan.
theological_decisions:
- issue: Klausa bersyarat dan ketekunan
  choice: 'Diterjemahkan sebagai syarat nyata: ''asalkan kita berpegang teguh sampai akhir''.'
  alternative: Membacanya secara khusus sebagai bukti mutlak atas partisipasi sebelumnya, atau sebagai pernyataan eksplisit bahwa partisipasi hanya terus berlaku selama ketekunan berlangsung.
  rationale: Teks Yunani menyatakan kondisi, tetapi tidak dengan sendirinya menyelesaikan perdebatan teologis kemudian tentang ketekunan, kemurtadan, atau jaminan keselamatan.
- issue: Relasi genitif pada μέτοχοι τοῦ Χριστοῦ
  choice: mendapat bagian dalam Mesias
  alternative: menjadi rekan Mesias; mengambil bagian dari Mesias
  rationale: Pilihan ini menjaga gagasan partisipasi tanpa menetapkan bahwa genitif tersebut harus dipahami sebagai kemitraan sejajar atau pembagian suatu zat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. 'Asalkan' mempertahankan tekanan kondisi; 'keyakinan yang kita miliki sejak semula' dipilih agar frasa Yunani yang padat terdengar alami tanpa menghapus ambiguitas leksikal ὑπόστασις, yang dicatat dalam catatan kaki.
