reference: Hebrews 3:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ· ⸀ὃς οἶκός ἐσμεν ἡμεῖς, ⸀ἐὰν τὴν παρρησίαν καὶ τὸ καύχημα τῆς ⸀ἐλπίδος κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/006.yaml
  text: But the Messiah was faithful as a Son over his house[a], whose house we are[c][b], if we hold fast our boldness and the boast of our hope.
translation:
  language: id
  text: Namun, Mesias[a] setia sebagai Anak atas rumah-Nya. Kita adalah rumah-Nya, jika kita berpegang teguh pada keberanian[b] dan kebanggaan atas pengharapan kita.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus”. Gelar Yunani Χριστός dapat berfungsi sebagai gelar (“Mesias”) atau sebagai sebutan yang menyerupai nama (“Kristus”).
    reason: alternative_reading
  - marker: b
    text: Atau “keyakinan”. Kata Yunani παρρησία dapat berarti keterusterangan, keterbukaan, atau keyakinan yang berani.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan ini juga dapat diterjemahkan “keyakinan dalam pengharapan” atau “sukacita dalam pengharapan”. Kata Yunani καύχημα dapat berarti kebanggaan, dasar untuk bermegah, atau keyakinan yang penuh sukacita.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Mesias
  rationale: Dalam perbandingan dengan Musa, Χριστός berfungsi terutama sebagai gelar. “Mesias” mempertahankan daya gelarnya; alternatif “Kristus” dicatat.
- source_word: δὲ
  choice: Namun
  rationale: Menandai perbandingan yang berlawanan dengan kedudukan Musa pada ayat sebelumnya tanpa terdengar terlalu tajam.
- source_word: ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ
  choice: sebagai Anak yang berkuasa atas rumah-Nya
  rationale: “Sebagai Anak” mempertahankan nilai perbandingan ὡς, sedangkan “berkuasa atas” menyampaikan hubungan kewenangan yang dinyatakan ἐπί. “Rumah” mempertahankan metafora umat sebagai rumah Allah.
- source_word: ὃς οἶκός ἐσμεν ἡμεῖς
  choice: Rumah-Nya itu adalah kita
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan metafora bahwa umat merupakan rumah tersebut.
- source_word: ἐὰν
  choice: jika
  rationale: Menyatakan syarat yang nyata tanpa memperkuatnya menjadi tafsiran teologis tertentu.
- source_word: παρρησίαν
  choice: keberanian
  rationale: Mencakup keterusterangan dan keyakinan yang berani; “keyakinan” tetap merupakan alternatif leksikal yang sah.
- source_word: καύχημα
  choice: kebanggaan
  rationale: Mempertahankan unsur bermegah atau bersukacita atas sesuatu, tanpa meratakannya menjadi sekadar keyakinan.
- source_word: τῆς ἐλπίδος
  choice: dalam pengharapan kita
  rationale: “Dalam” menghasilkan hubungan idiomatis dengan “kebanggaan” sambil tetap membiarkan hubungan genitifnya cukup terbuka. “Kita” tersirat oleh rangkaian orang pertama jamak.
- source_word: κατάσχωμεν
  choice: kita berpegang teguh
  rationale: Menyampaikan tindakan mempertahankan dengan kukuh dan daya nasihat dari bentuk bersyarat tersebut.
theological_decisions:
- issue: Χριστός sebagai gelar atau sebutan menyerupai nama
  choice: Mesias
  alternative: Kristus
  rationale: Konteks perbandingan Musa dengan Anak mendukung daya gelar, tetapi alternatif nama tradisional tetap mungkin.
- issue: Daya syarat ἐὰν ... κατάσχωμεν
  choice: jika kita berpegang teguh
  alternative: asalkan kita berpegang teguh
  rationale: “Jika” mempertahankan ketegangan nyata mengenai ketekunan tanpa memasukkan kerangka doktrinal tentang kemurtadan atau kepastian keselamatan.
- issue: Rujukan αὐτοῦ dalam “rumah-Nya”
  choice: mempertahankan pronomina “-Nya” tanpa menjelaskan rujukannya
  alternative: rumah Allah / rumah Anak
  rationale: Konteks mengarah kuat kepada rumah Allah, tetapi bentuk Yunani tidak perlu dijabarkan dalam teks utama; pronomina mempertahankan hubungan dan kemungkinan nuansanya.
- issue: Predikat “setia” yang tersirat
  choice: menyertakan “setia”
  alternative: Namun, Mesias sebagai Anak berkuasa atas rumah-Nya
  rationale: πιστός muncul dalam konstruksi perbandingan sebelumnya dan secara gramatikal tetap menjadi predikat yang dipahami bagi Χριστός; penyertaannya diperlukan agar kesinambungan kalimat dapat dipahami secara alami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Rumah” dipertahankan sebagai metafora utama, sedangkan “berkuasa atas” dipilih agar relasi Anak dengan rumah itu jelas bagi pembaca umum. Kapitalisasi “Anak” menandai rujukan kepada Mesias dalam konteks kristologis, bukan untuk menambahkan rincian doktrinal di luar teks.
