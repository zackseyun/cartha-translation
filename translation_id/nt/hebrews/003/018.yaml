  text: τίσιν δὲ ὤμοσεν μὴ εἰσελεύσεσθαι εἰς τὴν κατάπαυσιν αὐτοῦ εἰ μὴ τοῖς ἀπειθήσασιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/018.yaml
  text: And to whom did he swear that they would not enter his rest[a], if not to those who disobeyed?
translation:
  language: id
  text: Dan kepada siapakah Dia bersumpah bahwa mereka tidak akan masuk ke dalam perhentian-Nya, kalau bukan kepada mereka yang tidak taat?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada mereka yang membangkang.” Partisip Yunani ini dapat menekankan tindakan menolak untuk taat; dalam konteks ini, ketidaktaatan tersebut berkaitan erat dengan ketidakpercayaan (lihat Ibr. 3:19).
    reason: lexical_alternative
lexical_decisions:
- source_word: τίσιν
  choice: kepada siapa
  rationale: Bentuk datif jamak interogatif ini menunjuk kepada orang dan secara alami diterjemahkan sebagai pertanyaan retoris “kepada siapa”.
- source_word: δὲ
  choice: Dan
  rationale: δέ melanjutkan rangkaian pertanyaan retoris dari ayat sebelumnya tanpa menekankan pertentangan yang kuat.
- source_word: ὤμοσεν
  choice: Dia bersumpah
  rationale: Aoristus ὀμνύω menyatakan tindakan bersumpah atau mengucapkan sumpah; pilihan ini mempertahankan bobot khidmatnya.
- source_word: μὴ εἰσελεύσεσθαι
  choice: bahwa mereka tidak akan masuk
  rationale: Infinitif sesudah ὀμνύω menyatakan isi sumpah dan paling wajar dialihkan ke dalam bahasa Indonesia sebagai klausa tak langsung.
- source_word: εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: ke tempat peristirahatan-Nya
  rationale: κατάπαυσις merupakan istilah tematis dalam Ibrani bagi perhentian atau tempat peristirahatan milik Allah. Ungkapan ini alami bersama kata “masuk” dan tetap membuka perkembangan maknanya dalam konteks surat.
- source_word: εἰ μὴ
  choice: kalau bukan
  rationale: Dalam pertanyaan retoris ini, εἰ μή memperkenalkan jawaban yang diharapkan; “kalau bukan” mempertahankan bentuk dan daya retoris tersebut.
- source_word: τοῖς ἀπειθήσασιν
  choice: kepada mereka yang tidak taat
  rationale: Partisip aoristus ἀπειθέω menunjuk kepada orang yang menolak untuk taat. “Tidak taat” menjaga perbedaannya dari kata khusus untuk tidak percaya, sementara kaitan keduanya tetap tampak melalui konteks ayat 19.
theological_decisions:
- issue: Makna ἀπειθήσασιν dalam peringatan tentang ketidakpercayaan dan ketidaktaatan
  choice: mereka yang tidak taat
  alternative: mereka yang tidak percaya; mereka yang membangkang
  rationale: Ayat ini memakai ἀπειθέω, bukan ἀπιστέω. Karena itu, teks utama mempertahankan unsur ketidaktaatan dan tidak menyamakan keduanya secara langsung, sedangkan catatan menjelaskan hubungannya dengan ketidakpercayaan dalam ayat berikutnya.
- issue: Makna κατάπαυσις sebagai tema teologis dalam Ibrani
  choice: tempat peristirahatan-Nya
  alternative: perhentian-Nya; istirahat-Nya
  rationale: Pilihan ini mempertahankan gagasan masuk ke dalam perhentian yang disediakan atau dimiliki Allah tanpa menentukan terlebih dahulu seluruh cakupan teologis yang dikembangkan dalam pasal 3–4.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan struktur pertanyaan retoris yang alami. Huruf kapital pada “Dia” dan akhiran “-Nya” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Allah.
