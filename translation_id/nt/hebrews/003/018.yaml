  to: Dan kepada siapakah Dia bersumpah bahwa mereka tidak akan masuk ke dalam perhentian-Nya, kalau bukan kepada mereka yang tidak taat?[a]
  rationale: Revisi mengganti “tempat peristirahatan-Nya” dengan “perhentian-Nya” untuk mencerminkan κατάπαυσις secara lebih setia dan mempertahankan terminologi tematis Ibrani. Bentuk interogatif dibakukan menjadi “kepada siapakah,” dan jangkar catatan ditempatkan sesudah “tidak taat,” istilah yang dijelaskan catatan. Makna dan ambiguitas teologis naskah tetap dipertahankan.
