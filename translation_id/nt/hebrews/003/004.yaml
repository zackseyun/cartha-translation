  yaml_path: translation/nt/hebrews/003/004.yaml
  text: For every house is built by someone[a], but God is the one who built all things.
translation:
  language: id
  text: Sebab setiap rumah dibangun oleh seseorang, tetapi yang membangun segala sesuatu ialah Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς
  choice: setiap
  rationale: Dengan nomina tunggal οἶκος, kata ini bersifat distributif; “setiap rumah” alami dalam bahasa Indonesia.
- source_word: γὰρ
  choice: sebab
  rationale: Menandai alasan yang menjelaskan pernyataan sebelumnya dan mempertahankan hubungan logis antarayat.
- source_word: οἶκος
  choice: rumah
  rationale: Mempertahankan gambaran bangunan sekaligus memungkinkan permainan metaforis dalam konteks Ibrani 3.
- source_word: κατασκευάζεται
  choice: dibangun
  rationale: Bentuk pasif ini menyatakan bahwa rumah dihasilkan melalui pelaku; “dibangun” jelas dan cocok dengan gambaran arsitektural.
- source_word: ὑπό τινος
  choice: oleh seseorang
  rationale: ὑπό dengan genitif menandai pelaku, sedangkan τις menyatakan pelaku yang tidak ditentukan.
- source_word: ὁ δὲ
  choice: tetapi Dia yang
  rationale: δέ menandai peralihan dengan kontras ringan, dan artikel bersama partisip diterjemahkan secara substantival sebagai “Dia yang”.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Menyampaikan cakupan yang menyeluruh tanpa mempersempitnya menjadi hanya alam semesta fisik.
- source_word: κατασκευάσας
  choice: membangun
  rationale: Menjaga kesinambungan leksikal dengan κατασκευάζεται dan analogi tentang pembangun.
- source_word: θεός
  choice: Allah
  rationale: Mengidentifikasi pembangun segala sesuatu secara langsung; “Allah” adalah padanan baku dan wajar dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Identitas pembangun segala sesuatu
  choice: Dia yang membangun segala sesuatu adalah Allah
  alternative: Allah adalah Dia yang membangun segala sesuatu
  rationale: Urutan ini mengikuti struktur predikatif Yunani dan secara eksplisit mengidentifikasi pembangun universal itu sebagai Allah, tanpa menambahkan penjelasan metafisis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan akar “dibangun/membangun” sengaja dipertahankan untuk menjaga analogi teks sumber. Tidak diperlukan catatan kaki karena πάντα diterjemahkan langsung sebagai “segala sesuatu”; catatan alternatif bahasa Inggris tidak berkaitan dengan ὑπό τινος.
