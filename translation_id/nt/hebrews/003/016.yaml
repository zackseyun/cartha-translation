  text: τίνες γὰρ ἀκούσαντες παρεπίκραναν; ἀλλ’ οὐ πάντες οἱ ἐξελθόντες ἐξ Αἰγύπτου διὰ Μωϋσέως;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/016.yaml
  text: For who[a], when they heard, rebelled? Was it not all those who came out of Egypt through Moses?
translation:
  language: id
  text: Sebab, siapa sajakah yang setelah mendengar lalu memberontak? Bukankah semua orang yang keluar dari Mesir dengan perantaraan Musa?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνες
  choice: siapakah
  rationale: Kata tanya jamak ini memperkenalkan pertanyaan retoris tentang identitas orang-orang yang memberontak; dalam bahasa Indonesia, jumlah jamak menjadi jelas dari jawaban pada klausa berikutnya.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai hubungan penjelasan dengan argumen sebelumnya.
- source_word: ἀκούσαντες
  choice: yang mendengar lalu
  rationale: Partisip aoristus ini menunjukkan bahwa mereka terlebih dahulu mendengar, kemudian melakukan tindakan pada verba utama; 'lalu' menyampaikan urutan itu secara alami.
- source_word: παρεπίκραναν
  choice: memberontak
  rationale: Dalam konteks generasi padang gurun, verba ini menunjuk pada tindakan menentang dan membangkitkan murka Allah. 'Memberontak' menyampaikan daya kontekstualnya, sedangkan arti yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ἀλλ’ οὐ πάντες
  choice: Bukankah ... semua
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan jawaban ya; ἀλλά berfungsi idiomatis untuk mengantar jawaban yang dimaksud.
- source_word: οἱ ἐξελθόντες ἐξ Αἰγύπτου
  choice: mereka ... yang keluar dari Mesir
  rationale: Menerjemahkan partisip substantival dan arah geraknya secara jelas dan alami.
- source_word: διὰ Μωϋσέως
  choice: melalui Musa
  rationale: Mempertahankan makna perantaraan atau keagenan dari διά dengan genitif tanpa memperluasnya menjadi tafsiran tentang kepemimpinan.
theological_decisions:
- issue: Makna παραπικραίνω dalam konteks generasi padang gurun
  choice: memberontak
  alternative: membangkitkan murka; menyakiti hati
  rationale: Konteks Ibrani 3 dan latar pemberontakan Israel mendukung tindakan pembangkangan terhadap Allah. Namun, karena verba Yunani secara lebih harfiah dapat berarti membangkitkan kepahitan atau murka, alternatif itu dipertahankan dalam catatan kaki.
- issue: Cakupan kata 'semua' dalam pertanyaan retoris
  choice: Mempertahankan pernyataan menyeluruh tanpa menambahkan pengecualian dalam teks
  alternative: Menjelaskan pengecualian seperti Yosua dan Kaleb
  rationale: Ayat ini memakai πάντες secara retoris untuk menunjuk generasi keluaran yang memberontak. Penambahan pengecualian akan menyelesaikan ketegangan naratif yang dibiarkan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua pertanyaan retoris dipertahankan; 'melalui Musa' menjaga ungkapan sumber tanpa parafrasa berlebihan.
