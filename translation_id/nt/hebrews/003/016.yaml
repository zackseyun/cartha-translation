- from: Sebab, siapakah yang mendengar lalu memberontak[a]? Bukankah mereka semua yang keluar dari Mesir melalui Musa?
  to: Sebab, siapa sajakah yang setelah mendengar lalu memberontak? Bukankah semua orang yang keluar dari Mesir dengan perantaraan Musa?
  rationale: Revisi memperjelas subjek jamak dalam pertanyaan pertama dan mengganti “melalui Musa” dengan “dengan perantaraan Musa” untuk menyampaikan fungsi διά dengan genitif secara lebih tepat dan wajar dalam bahasa Indonesia. Padanan utama “memberontak” dipertahankan. Catatan kaki diperjelas agar alternatif literalnya tidak kabur.
