  text: βλέπετε, ἀδελφοί, μήποτε ἔσται ἔν τινι ὑμῶν καρδία πονηρὰ ἀπιστίας ἐν τῷ ἀποστῆναι ἀπὸ θεοῦ ζῶντος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/012.yaml
  text: Watch out[a], brothers[c][b], lest there be in any of you an evil heart of unbelief in turning away from the living God.
translation:
  language: id
  text: Waspadalah, Saudara-saudara[a], jangan sampai ada di antara kalian hati yang jahat dan tidak percaya[b], yang menjauh dari Allah yang hidup[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “Saudara-saudara” berbentuk maskulin jamak, tetapi dapat digunakan untuk menyapa kelompok sesama orang percaya yang mencakup laki-laki dan perempuan.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “hati yang jahat dan tidak setia.”'
    reason: alternative_reading
  - marker: c
    text: 'Atau: “dalam berpaling dari Allah yang hidup,” “dengan menjauh dari Allah yang hidup,” atau “ketika meninggalkan Allah yang hidup.”'
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε
  choice: Waspadalah
  rationale: Imperatif kini orang kedua jamak ini menyampaikan peringatan yang mendesak; “Waspadalah” alami dan mempertahankan unsur kesiagaan.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan jamak ini secara gramatikal berbentuk maskulin, tetapi dalam konteks jemaat dapat mencakup sesama orang percaya laki-laki dan perempuan; bentuk Indonesia ini wajar dan inklusif menurut pemakaian.
- source_word: μήποτε ἔσται ἔν τινι ὑμῶν
  choice: supaya jangan ada seorang pun di antara kalian
  rationale: Mengungkapkan peringatan tentang kemungkinan keadaan buruk pada siapa pun dalam kelompok, dengan susunan Indonesia yang jelas.
- source_word: καρδία πονηρὰ ἀπιστίας
  choice: yang berhati jahat dan tidak percaya
  rationale: Mengalihkan idiom Yunani ke bentuk Indonesia yang alami sambil mempertahankan “hati” sebagai pusat batin serta hubungan antara kejahatan dan ketidakpercayaan.
- source_word: ἐν τῷ ἀποστῆναι
  choice: sehingga berpaling
  rationale: “Berpaling” menyampaikan tindakan menjauh tanpa memasukkan istilah teknis teologis; “sehingga” menyatakan hubungan erat yang dapat dipahami sebagai hasil, sambil mencatat alternatif dalam catatan kaki.
- source_word: ἀπὸ θεοῦ ζῶντος
  choice: dari Allah yang hidup
  rationale: Ungkapan alkitabiah yang wajar dan tepat untuk Allah yang benar dan hidup.
theological_decisions:
- issue: 'Makna ἀπιστίας: ketidakpercayaan atau ketidaksetiaan'
  choice: tidak percaya
  alternative: tidak setia
  rationale: Konteks Ibrani 3 menekankan kegagalan memercayai firman Allah, tetapi kemungkinan nuansa ketidaksetiaan tetap dicatat.
- issue: Kekuatan teologis ἀποστῆναι
  choice: berpaling
  alternative: murtad; meninggalkan
  rationale: “Berpaling” mempertahankan keseriusan peringatan tanpa menjadikannya istilah teknis yang melampaui kata sumber.
- issue: Hubungan ἐν τῷ ἀποστῆναι dengan hati yang jahat dan tidak percaya
  choice: sehingga berpaling
  alternative: dengan berpaling; ketika berpaling
  rationale: Konstruksi ini dapat menyatakan keadaan, cara, atau hasil. Teks utama memakai hubungan hasil yang alami dalam bahasa Indonesia, sedangkan ambiguitas sumber dipertahankan melalui catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada peringatan yang tegas dan bermartabat. “Kalian” dipakai untuk membuat sasaran jamak eksplisit dan mudah dipahami; “Saudara-saudara” mempertahankan sapaan pastoral.
