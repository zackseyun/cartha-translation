base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/007.yaml
  text: 'Therefore, just as the Holy Spirit says: “Today, if you hear his voice,”'
translation:
  language: id
  text: 'Karena itu, sebagaimana Roh Kudus berkata: “Hari ini, jika kamu mendengar suara-Nya,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: Karena itu
  rationale: Konjungsi inferensial ini menarik kesimpulan dari uraian sebelumnya; “Karena itu” alami dalam bahasa Indonesia dan mempertahankan hubungan logis tersebut.
- source_word: καθὼς
  choice: seperti yang
  rationale: Memperkenalkan rumusan kutipan dengan perbandingan; bentuk ini alami dalam konstruksi bahasa Indonesia “seperti yang dikatakan” tanpa mengurangi daya retorisnya.
- source_word: λέγει
  choice: dikatakan
  rationale: Bentuk kini dalam formula kutipan dipertahankan secara idiomatis melalui ungkapan “seperti yang dikatakan,” yang menyajikan perkataan Kitab Suci sebagai tetap berlaku, bukan semata-mata ujaran masa lampau.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roh Kudus
  rationale: Padanan baku dan tepat bagi frasa Yunani tersebut tanpa menambahkan penekanan yang tidak dinyatakan.
- source_word: Σήμερον
  choice: Hari ini
  rationale: Padanan langsung bagi keterangan waktu yang mengawali kutipan Mazmur.
- source_word: ἐὰν
  choice: jika
  rationale: Partikel bersyarat yang secara langsung dan wajar diterjemahkan “jika,” dengan tetap mempertahankan sifat kondisi dalam kutipan.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: suara-Nya
  rationale: Genitif sebagai objek ἀκούω secara idiomatis menjadi “mendengar suara-Nya”; “suara” menjaga sifat personal ungkapan tersebut.
- source_word: ἀκούσητε
  choice: kamu mendengar
  rationale: Aoristus subjungtif setelah ἐὰν paling alami diterjemahkan sebagai syarat “jika kamu mendengar.” Pilihan “mendengarkan” dapat menambahkan nuansa menaati yang tidak perlu dipaksakan pada verba ini.
theological_decisions:
- issue: Atribusi pembicara dalam kutipan Mazmur
  choice: Kutipan diperkenalkan sebagai perkataan Roh Kudus.
  alternative: Roh Kudus berbicara melalui Kitab Suci atau pemazmur.
  rationale: Teks Yunani secara eksplisit menyatakan bahwa Roh Kudus berkata. Terjemahan mempertahankan atribusi langsung ini tanpa menguranginya menjadi perkataan manusia semata atau memperluasnya menjadi uraian doktrin inspirasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “kamu” dipilih karena verba Yunani berbentuk orang kedua jamak dan kutipan menyapa seluruh komunitas; bahasa Indonesia standar tidak membedakan tunggal dan jamak pada bentuk ini. Kapitalisasi “-Nya” mengikuti konvensi Indonesia untuk rujukan kepada Allah. Ayat sengaja berakhir dengan koma karena kalimat kutipan berlanjut ke ayat berikutnya.
