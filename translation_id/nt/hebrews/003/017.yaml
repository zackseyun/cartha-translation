  yaml_path: translation/nt/hebrews/003/017.yaml
  text: And with whom was he angry for forty years? Was it not with those who sinned[a], whose bodies fell in the wilderness?
translation:
  language: id
  text: Dan kepada siapakah Dia murka selama empat puluh tahun? Bukankah kepada mereka yang berbuat dosa, yang tubuh mereka jatuh di padang belantara?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang mayat-mayat mereka jatuh di padang belantara.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσώχθισεν
  choice: Dia murka
  rationale: Kata kerja ini menyatakan kemarahan atau kejengkelan yang kuat terhadap seseorang. “Murka” wajar dalam ragam Alkitab Indonesia dan sesuai karena subjek tersiratnya adalah Allah.
- source_word: τεσσεράκοντα ἔτη
  choice: selama empat puluh tahun
  rationale: Bentuk akusatif ini menyatakan jangka waktu; “selama” merupakan ungkapan Indonesia yang alami.
- source_word: τοῖς ἁμαρτήσασιν
  choice: kepada mereka yang berbuat dosa
  rationale: Partisip aoris menunjuk kepada orang-orang yang berdosa dalam generasi padang belantara; ungkapan ini jelas dan alami tanpa menentukan apakah yang dimaksud satu atau beberapa tindakan.
- source_word: τὰ κῶλα
  choice: mayatnya
  rationale: Secara harfiah kata ini dapat berarti anggota-anggota tubuh, tetapi dalam konteks penghukuman di padang belantara menunjuk kepada tubuh-tubuh orang yang mati. “Mayat” mempertahankan kerasnya gambaran sumber dengan bahasa Indonesia yang wajar.
- source_word: ἔπεσεν
  choice: bergelimpangan
  rationale: Kata dasarnya berarti “jatuh”; bersama “mayat”, ungkapan “mayatnya bergelimpangan” secara alami menyampaikan tubuh-tubuh yang jatuh dan tergeletak, tanpa menambahkan sebab kematian.
- source_word: ἐν τῇ ἐρήμῳ
  choice: di padang belantara
  rationale: Ungkapan ini merujuk kepada tempat pengembaraan Israel. “Padang belantara” mempertahankan latar alkitabiah dan tidak mempersempitnya menjadi gurun pasir.
theological_decisions:
- issue: Subjek tersirat dari προσώχθισεν
  choice: Dia, yaitu Allah dalam konteks
  alternative: Allah disebut secara eksplisit
  rationale: Bahasa Yunani membiarkan subjek tersirat karena sudah jelas dari konteks. “Dia” menghasilkan kalimat Indonesia yang alami sekaligus tidak menambahkan nama yang tidak muncul dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tanya retoris dipertahankan. “Murka” sesuai untuk kemarahan ilahi, sedangkan “mayatnya bergelimpangan” mempertahankan daya gambaran κῶλα ἔπεσεν. Penanda catatan kaki [a] ditempatkan dalam teks utama.
