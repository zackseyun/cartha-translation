  text: τεσσεράκοντα ἔτη· διὸ προσώχθισα τῇ γενεᾷ ⸀ταύτῃ καὶ εἶπον· Ἀεὶ πλανῶνται τῇ καρδίᾳ· αὐτοὶ δὲ οὐκ ἔγνωσαν τὰς ὁδούς μου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/010.yaml
  text: For forty years[a], therefore, I was provoked with this generation, and said, ‘They always go astray in their hearts[b], but they have not known my ways.’
translation:
  language: id
  text: Karena itu, selama empat puluh tahun Aku murka[a] terhadap generasi ini dan berkata, “Mereka selalu tersesat dalam hati mereka, tetapi mereka tidak mengenal jalan-jalan-Ku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan «murka» menyatakan ketidaksenangan yang kuat dan juga dapat berarti «merasa muak» atau «sangat jengkel».
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσεράκοντα ἔτη
  choice: Selama empat puluh tahun
  rationale: Frasa waktu ini menyatakan rentang atau durasi; 'selama' membuat fungsi akusatif durasi jelas dan alami dalam bahasa Indonesia.
- source_word: διὸ
  choice: karena itu
  rationale: Mempertahankan hubungan inferensial dengan penyebab yang disebut dalam konteks sebelumnya.
- source_word: προσώχθισα
  choice: Aku murka
  rationale: Mengungkapkan ketidaksenangan ilahi yang kuat secara wajar dan bermartabat; nuansanya dapat mencakup kejengkelan atau rasa muak, sebagaimana dijelaskan dalam catatan.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: terhadap angkatan ini
  rationale: '''Terhadap'' merupakan padanan idiomatis bagi datif yang menyertai verba tersebut, sedangkan ''angkatan'' mempertahankan pengertian kelompok sezaman.'
- source_word: Ἀεὶ πλανῶνται
  choice: Mereka selalu tersesat
  rationale: '''Selalu'' menyatakan pola yang terus-menerus, dan ''tersesat'' menangkap penyimpangan moral-rohani tanpa menentukan secara berlebihan apakah bentuk verbalnya refleksif atau pasif.'
- source_word: τῇ καρδίᾳ
  choice: dalam hati mereka
  rationale: Bahasa Indonesia memerlukan penanda kepunyaan yang alami. 'Hati' tetap tunggal seperti bahasa Yunani dan dapat dipahami secara kolektif bagi seluruh angkatan.
- source_word: αὐτοὶ δὲ οὐκ ἔγνωσαν
  choice: tetapi mereka tidak mengenal
  rationale: '''Tetapi'' menyatakan kontras; ''mengenal'' mempertahankan kemungkinan nuansa relasional dan bukan sekadar pemahaman intelektual.'
- source_word: τὰς ὁδούς μου
  choice: jalan-jalan-Ku
  rationale: Bentuk jamak mempertahankan bahasa sumber dan metafora alkitabiah mengenai tindakan serta kehendak Allah.
theological_decisions:
- issue: Kekuatan ketidaksenangan ilahi dalam προσώχθισα
  choice: Aku murka
  alternative: Aku merasa muak / Aku sangat jengkel
  rationale: '''Murka'' menyampaikan ketidaksenangan yang kuat tanpa secara khusus membatasi makna pada kejengkelan atau rasa muak; catatan mempertahankan rentang leksikalnya.'
- issue: Bentuk tunggal kolektif τῇ καρδίᾳ
  choice: dalam hati mereka
  alternative: dalam hati masing-masing
  rationale: '''Hati'' dipertahankan dalam bentuk tunggal sesuai bahasa Yunani, sementara ''mereka'' membuat rujukan kepada angkatan itu alami dalam bahasa Indonesia tanpa mengindividualisasikannya.'
- issue: Makna οὐκ ἔγνωσαν
  choice: tidak mengenal
  alternative: tidak memahami / tidak mau mengenal
  rationale: '''Mengenal'' membiarkan nuansa kognitif dan relasional tetap terbuka serta tidak menambahkan unsur kemauan yang tidak dinyatakan secara eksplisit.'
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti gaya penerbitan Indonesia. Susunan kalimat mempertahankan alur kutipan dan ketegangan makna bahasa Yunani tanpa menjadi kaku.
