lexical_decisions:
- source_word: ἐν τῷ λέγεσθαι
  choice: ketika dikatakan
  rationale: Konstruksi ἐν dengan infinitif artikular menyatakan keadaan atau waktu berlangsungnya perkataan. “Ketika dikatakan” alami dalam bahasa Indonesia dan mempertahankan bentuk pasif serta kaitannya dengan kutipan yang sedang disampaikan.
- source_word: Σήμερον
  choice: Hari ini
  rationale: Padanan langsung dan wajar yang mempertahankan desakan waktu dalam kutipan Mazmur.
- source_word: ἐὰν ... ἀκούσητε
  choice: jika kamu mendengar
  rationale: Bentuk bersyarat dengan subjungtif paling alami diterjemahkan sebagai syarat terbuka. “Mendengar” mempertahankan kemungkinan makna mendengar sekaligus menyimak tanpa mempersempitnya.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: suara-Nya
  rationale: Padanan idiomatis bagi konstruksi genitif yang mempertahankan rujukan pribadi kepada Allah; huruf kapital mengikuti konvensi bahasa Indonesia untuk pronomina yang merujuk kepada Allah.
- source_word: Μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: janganlah mengeraskan hatimu
  rationale: Mempertahankan larangan dan metafora antropologis Alkitab tentang hati sebagai pusat batin, kehendak, dan tanggapan manusia.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: seperti dalam pemberontakan itu
  rationale: παραπικρασμός menunjuk pada pembangkangan Israel di padang gurun. “Pemberontakan” menyampaikan bobot moral peristiwa itu dengan jelas, sedangkan “itu” menandai peristiwa tertentu yang disinggung oleh kutipan.
theological_decisions:
- issue: Makna παραπικρασμός dalam kutipan Mazmur 95
  choice: pemberontakan
  alternative: tindakan yang membangkitkan murka
  rationale: Kata itu dapat menyoroti baik pembangkangan umat maupun tindakan mereka yang memancing murka Allah. Teks utama memakai “pemberontakan” karena paling jelas bagi pembaca modern, sementara catatan kaki mempertahankan nuansa alternatif tanpa menentukan tafsir secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Bentuk tunggal “kamu” dipertahankan karena verba Yunani menyapa orang kedua jamak secara kolektif tetapi bahasa Indonesia tidak wajib menandai jumlah; “hatimu” tetap dapat berfungsi sebagai sapaan kepada komunitas. Tanda kutip mempertahankan kutipan langsung dari Mazmur 95.
