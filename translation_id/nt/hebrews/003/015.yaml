  text: while it is being said[a], “Today, if you hear his voice, do not harden your hearts as in the rebellion.”
translation:
  language: id
  text: ketika dikatakan, “Hari ini, jika kalian mendengar suara-Nya, janganlah mengeraskan hati kalian seperti dalam pemberontakan itu[a].”
  philosophy: optimal-equivalence
