  text: And we see that they were not able to enter because of unbelief[a].
translation:
  language: id
  text: Dan kita melihat bahwa mereka tidak dapat masuk karena ketidakpercayaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketidaksetiaan.” Istilah Yunani ini dapat menunjuk bukan hanya pada tidak percaya, tetapi juga pada penolakan yang tidak setia untuk memercayai.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Jadi
  rationale: Dalam konteks penutup argumen, καί menghubungkan ayat ini dengan kesimpulan dari ayat sebelumnya. 'Jadi' menyampaikan alur simpulan secara alami dalam bahasa Indonesia tanpa mengubah isi pokok.
- source_word: βλέπομεν
  choice: kita melihat
  rationale: Bentuk kini aktif orang pertama jamak dipertahankan secara langsung dan wajar, sekaligus menjaga daya retoris pernyataan penulis.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi yang dilihat dan mempertahankan struktur klausa Yunani secara jelas dalam bahasa Indonesia.
- source_word: οὐκ ἠδυνήθησαν
  choice: mereka tidak dapat
  rationale: Menyatakan ketidakmampuan sesuai arti δύναμαι dan merupakan ungkapan Indonesia yang ringkas serta alami.
- source_word: εἰσελθεῖν
  choice: masuk
  rationale: Menerjemahkan infinitif εἰσέρχομαι tanpa menambahkan objek yang tidak dinyatakan dalam ayat ini; konteks menentukan tempat atau perhentian yang dimaksud.
- source_word: δι’
  choice: karena
  rationale: Dengan akusatif, διά menyatakan sebab. 'Karena' adalah padanan kausal yang jelas dan alami.
- source_word: ἀπιστίαν
  choice: ketidakpercayaan mereka
  rationale: Istilah ini dalam konteks menunjuk pada tidak percaya atau tidak menaruh kepercayaan kepada firman dan janji Allah. Pronomina 'mereka' memperjelas hubungan kepemilikan yang sudah tersirat dalam struktur kalimat Indonesia; nuansa ketidaksetiaan tetap dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna ἀπιστία dalam kaitannya dengan percaya, mempercayakan diri, dan kesetiaan
  choice: ketidakpercayaan
  alternative: ketidaksetiaan
  rationale: Konteks langsung Ibrani 3 menekankan kegagalan Israel untuk percaya dan memercayai janji Allah, sehingga 'ketidakpercayaan' paling jelas dalam teks utama. Namun, kata Yunani itu juga dapat mencakup sikap tidak setia atau penolakan untuk menaruh kepercayaan; kemungkinan ini dipertahankan dalam catatan kaki agar ketegangan maknanya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Susunan kalimat mempertahankan bentuk simpulan retoris ayat tersebut, sedangkan catatan kaki menjaga keluasan makna ἀπιστία tanpa membebani teks utama.
