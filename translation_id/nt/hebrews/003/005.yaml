  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ Μωϋσῆς μὲν πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ὡς θεράπων εἰς μαρτύριον τῶν λαληθησομένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/005.yaml
  text: And Moses indeed was faithful in all his house as a servant[a], for a testimony of the things that would be spoken later[b],
translation:
  language: id
  text: Musa memang setia dalam seluruh rumah-Nya[a] sebagai pelayan, untuk menjadi kesaksian tentang hal-hal yang kelak akan dikatakan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam seluruh rumah tangga-Nya.” Bahasa Yunani mempertahankan gambaran “rumah” yang diteruskan dalam ayat-ayat berikutnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “tentang hal-hal yang akan dikatakan.” Frasa ini menunjuk ke depan kepada hal-hal yang kelak akan dikatakan, tanpa menyebutkan pelakunya.
    reason: alternative_rendering
lexical_decisions:
- source_word: καὶ
  choice: (tidak dinyatakan secara tersendiri)
  rationale: Hubungan dengan ayat sebelumnya tetap terasa dari susunan wacana bahasa Indonesia; menerjemahkannya dengan “dan” di sini akan terasa kaku.
- source_word: Μωϋσῆς μὲν
  choice: Musa memang
  rationale: “Memang” menandai sisi pertama dari perbandingan yang dilanjutkan dengan δέ pada ayat berikutnya, tanpa menghasilkan ungkapan Indonesia yang janggal.
- source_word: πιστὸς
  choice: setia
  rationale: Padanan alami yang menyatakan kesetiaan dan keterandalan Musa dalam tugasnya.
- source_word: ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: dalam seluruh rumah-Nya
  rationale: Mempertahankan gambaran “rumah” dari Bilangan 12:7 dan rangkaian metafora dalam Ibrani 3. Huruf kapital pada “-Nya” menunjukkan bahwa rumah itu milik Allah sebagaimana dituntun oleh konteks.
- source_word: ὡς θεράπων
  choice: sebagai pelayan
  rationale: θεράπων menunjuk pada seorang pelayan dengan nuansa tugas yang terhormat dan tidak sekuat makna perhambaan yang dapat terkandung dalam δοῦλος.
- source_word: εἰς μαρτύριον
  choice: untuk menjadi kesaksian
  rationale: Mengungkapkan fungsi atau tujuan pelayanan setia Musa secara jelas dan alami.
- source_word: τῶν λαληθησομένων
  choice: tentang hal-hal yang kelak akan dikatakan
  rationale: Mempertahankan bentuk pasif dan arah ke masa depan tanpa memasukkan secara eksplisit siapa pembicaranya, yang tidak disebutkan dalam frasa Yunani.
theological_decisions:
- issue: Arti “rumah-Nya”
  choice: Mempertahankan metafora rumah sebagai lingkungan umat atau rumah tangga Allah tempat Musa melayani.
  alternative: “seluruh rumah tangga-Nya”
  rationale: Kata οἶκος dapat menunjuk pada rumah atau rumah tangga, tetapi “rumah” menjaga kaitan sastra dan teologis dengan ayat-ayat berikutnya tanpa membatasi artinya.
- issue: Kedudukan Musa sebagai θεράπων
  choice: pelayan
  alternative: hamba; abdi
  rationale: “Pelayan” mempertahankan martabat pelayanan Musa sekaligus perbedaannya dari kedudukan Anak dalam ayat berikutnya.
- issue: Pelaku dari hal-hal yang kelak dikatakan
  choice: Tidak disebutkan secara eksplisit.
  alternative: “yang kelak akan difirmankan”
  rationale: Bentuk Yunani adalah pasif dan tidak menyebut pelaku. Terjemahan tidak menutup kemungkinan bahwa yang dimaksud adalah penyataan ilahi, tetapi juga tidak menambahkannya ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan “Musa memang” mempertahankan kontras antarayat. Tanda koma pada akhir ayat menunjukkan bahwa kalimat dan perbandingannya berlanjut ke ayat 6.
