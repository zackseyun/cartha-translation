id: HEB.1.5
reference: Hebrews 1:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τίνι γὰρ εἶπέν ποτε τῶν ἀγγέλων· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε, καὶ πάλιν· Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα, καὶ αὐτὸς ἔσται μοι εἰς υἱόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/005.yaml
  text: For to which of the angels did he ever say[a], “You are my Son; today I have begotten you”? And again, “I will be to him a father[c][b], and he will be to me a son”?
translation:
  language: id
  text: Sebab, kepada malaikat manakah Dia pernah berkata[a], “Engkaulah Anak-Ku; hari ini Aku telah memperanakkan Engkau”[b]? Dan sekali lagi, “Aku akan menjadi Bapa baginya, dan dia akan menjadi anak bagi-Ku”[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “pernah berkata pada waktu apa pun.”
    reason: lexical_alternative
  - marker: b
    text: “Aku telah memperanakkan Engkau” menggemakan Mazmur 2:7. Ungkapan ini dipahami dalam kaitannya dengan penobatan raja, kebangkitan, atau relasi kekal Sang Anak dengan Bapa; terjemahan ini mempertahankan ungkapannya tanpa menentukan salah satu penafsiran tersebut.
    reason: cross_reference
  - marker: c
    text: Kutipan dari 2 Samuel 7:14. Secara lebih idiomatis, “Aku akan menjadi bapanya, dan dia akan menjadi anak-Ku.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τίνι ... τῶν ἀγγέλων
  choice: kepada malaikat manakah
  rationale: Mempertahankan bentuk pertanyaan retoris dengan datif dan gagasan partitif ‘di antara para malaikat’ dalam susunan Indonesia yang alami.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai hubungan penjelasan dengan argumen sebelumnya secara jelas dan wajar.
- source_word: εἶπέν ποτε
  choice: pernah berkata
  rationale: Menyampaikan daya ποτέ, yakni pada kesempatan mana pun, dalam ungkapan Indonesia yang idiomatis.
- source_word: ἀγγέλων
  choice: malaikat
  rationale: Konteks Ibrani 1 menunjuk pada makhluk surgawi, bukan utusan manusia.
- source_word: Υἱός μου εἶ σύ
  choice: Engkaulah Anak-Ku
  rationale: Partikel -lah mempertahankan penekanan predikatif sambil memakai bentuk sapaan yang bermartabat; huruf kapital mengikuti fungsi gelar kristologis dalam konteks.
- source_word: σήμερον
  choice: hari ini
  rationale: Padanan temporal langsung tanpa penafsiran tambahan.
- source_word: γεγέννηκά σε
  choice: Aku telah memperanakkan Engkau
  rationale: Mempertahankan metafora γεννάω dan aspek perfektum tanpa menentukannya sebagai penobatan, kebangkitan, inkarnasi, atau relasi kekal.
- source_word: καὶ πάλιν
  choice: Dan sekali lagi
  rationale: Secara alami memperkenalkan kutipan Kitab Suci berikutnya.
- source_word: Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα
  choice: Aku akan menjadi Bapa baginya
  rationale: Mempertahankan struktur relasional εἰς πατέρα dan nada perjanjian, bukan meratakannya sepenuhnya menjadi bentuk posesif.
- source_word: καὶ αὐτὸς ἔσται μοι εἰς υἱόν
  choice: dan dia akan menjadi anak bagi-Ku
  rationale: Menjaga kesejajaran struktur kutipan dan memakai ‘anak’ dengan huruf kecil sesuai rumusan perjanjian yang dikutip.
theological_decisions:
- issue: Bahasa keanakan dalam kedua kutipan Perjanjian Lama
  choice: Memakai ‘Anak-Ku’ pada kutipan pertama dan ‘anak bagi-Ku’ pada kutipan kedua.
  alternative: Mengapitalisasi keduanya sebagai ‘Anak’ atau menulis keduanya dengan huruf kecil.
  rationale: Keduanya diterapkan kepada Sang Anak dalam argumen Ibrani, tetapi kutipan pertama berfungsi sebagai sapaan dan gelar langsung, sedangkan kutipan kedua mempertahankan rumusan keanakan perjanjian dari 2 Samuel 7:14.
- issue: Makna ‘Aku telah memperanakkan Engkau’
  choice: Mempertahankan ungkapan tersebut tanpa menjelaskan acuannya dalam teks utama.
  alternative: Menafsirkannya secara eksplisit sebagai penobatan kerajaan, kebangkitan, inkarnasi, atau kelahiran kekal.
  rationale: Kutipan Mazmur 2:7 memiliki kedalaman dan ketegangan teologis yang tidak semestinya diputuskan diam-diam oleh terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Engkau’ dipakai dalam kutipan ilahi untuk mempertahankan sapaan tunggal yang jelas; ‘Dia’ mengacu kepada Allah dari konteks sebelumnya. Struktur retoris dan kesejajaran kedua kutipan dipertahankan tanpa terasa terlalu kaku.
