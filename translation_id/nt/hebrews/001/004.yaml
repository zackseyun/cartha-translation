translation:
  language: id
  text: Ia menjadi lebih unggul daripada para malaikat, sejauh nama yang telah Ia warisi lebih unggul daripada nama mereka.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia menjadi lebih baik daripada para malaikat ... nama yang telah Ia warisi lebih istimewa daripada nama mereka.”'
    reason: lexical_alternative
  - marker: b
    text: Konteks berikutnya mengaitkan “nama” ini dengan sebutan Anak.
    reason: cross_reference
lexical_decisions:
- source_word: τοσούτῳ ... ὅσῳ
  choice: jauh lebih ... sebanding dengan betapa jauh lebih
  rationale: Konstruksi korelatif ini menyatakan perbandingan yang sebanding. Ungkapan tersebut mempertahankan hubungan proporsional sambil terdengar wajar dalam bahasa Indonesia.
- source_word: κρείττων
  choice: lebih tinggi
  rationale: Dalam konteks perbandingan kedudukan Anak dengan para malaikat, 'lebih tinggi' menyampaikan keunggulan peringkat tanpa menyiratkan mutu moral.
- source_word: γενόμενος
  choice: menjadi
  rationale: Menerjemahkan partisip aoris secara langsung dan mempertahankan motif tercapainya suatu keadaan, tanpa memakai 'dijadikan' yang dapat disalahpahami sebagai penciptaan.
- source_word: τῶν ἀγγέλων
  choice: daripada para malaikat
  rationale: Genitif perbandingan paling alami diungkapkan dengan 'daripada'; 'para malaikat' menunjuk kelompok yang dimaksud.
- source_word: διαφορώτερον
  choice: lebih mulia
  rationale: Dalam konteks ini kata komparatif tersebut menyatakan keistimewaan atau keunggulan, bukan sekadar perbedaan.
- source_word: παρ’ αὐτοὺς
  choice: daripada nama mereka
  rationale: Bahasa Indonesia memerlukan pengulangan 'nama' agar titik perbandingannya jelas; ini menyatakan nama yang diwarisi Anak dibandingkan dengan nama para malaikat.
- source_word: κεκληρονόμηκεν
  choice: telah diwarisi-Nya
  rationale: Bentuk perfek menyatakan tindakan yang hasilnya tetap berlaku. Bentuk pasif Indonesia ini secara alami mempertahankan makna bahwa Ia telah menerima nama itu sebagai warisan.
- source_word: ὄνομα
  choice: nama
  rationale: Terjemahan harfiah mempertahankan alur argumentasi karena konteks berikutnya menjelaskan nama atau kedudukan yang dimaksud.
theological_decisions:
- issue: Implikasi Kristologis γενόμενος ('menjadi') terhadap status Anak
  choice: Menerjemahkannya secara langsung sebagai 'menjadi' dalam kaitan dengan kedudukan-Nya yang ditinggikan.
  alternative: Memakai 'dijadikan' atau menafsirkan bahwa Anak baru mulai ada atau baru menjadi ilahi.
  rationale: Ayat ini membandingkan kedudukan Anak dengan para malaikat dan berbicara tentang nama yang diwarisi-Nya. Terjemahan harus mempertahankan bentuk verbal dan motif peninggian tanpa memasukkan kesimpulan ontologis yang tidak dinyatakan ayat ini.
- issue: Makna 'nama' dalam konteks
  choice: Mempertahankan kata 'nama' dan membiarkan konteks berikutnya menjelaskan gelar atau kedudukan Anak.
  alternative: Menggantikannya langsung dengan 'gelar Anak' atau memperluasnya menjadi 'kehormatan dan kedudukan'.
  rationale: Ayat ini sendiri hanya menyebut 'nama'; kutipan-kutipan sesudahnya memperjelas maknanya. Terjemahan literal mempertahankan perkembangan sastra dan ambiguitas yang disengaja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur Yunani yang padat diurai secukupnya agar hubungan perbandingan proporsional tetap jelas. Huruf kapital pada enklitik '-Nya' menandai rujukan kepada Anak sesuai kebiasaan penerbitan Alkitab Indonesia.
