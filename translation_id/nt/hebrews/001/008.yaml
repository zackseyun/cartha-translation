  text: πρὸς δὲ τὸν υἱόν· Ὁ θρόνος σου ὁ θεὸς εἰς τὸν αἰῶνα τοῦ αἰῶνος, ⸂καὶ ἡ ῥάβδος τῆς εὐθύτητος⸃ ῥάβδος τῆς βασιλείας ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/008.yaml
  text: But of the Son he says[a], “Your throne, O God, is forever and ever[b], and the scepter of uprightness is the scepter of your kingdom.”
translation:
  language: id
  text: Namun tentang Anak Ia berkata, “Takhta-Mu, ya Allah[a], tetap untuk selama-lamanya, dan tongkat kelurusan adalah tongkat kerajaan-Mu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, meskipun kurang mungkin: “Allah adalah takhta-Mu untuk selama-lamanya.” Sintaks Yunani ini diperdebatkan, tetapi sapaan langsung “Takhta-Mu, ya Allah” paling sesuai dengan konteks dan daya kutipan ini.'
    reason: alternative_reading
  - marker: b
    text: Atau “tongkat kebenaran.” Kata Yunani ini dapat berarti kelurusan atau integritas moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν υἱόν
  choice: Namun tentang Anak Ia berkata
  rationale: πρός dengan akusatif dalam rangkaian kutipan ini dapat menyatakan sasaran atau acuan perkataan. Ungkapan ini secara alami menyuplai verba berkata yang tersirat dan mempertahankan kontras dengan perkataan tentang para malaikat.
- source_word: υἱόν
  choice: Anak
  rationale: Artikelnya menandai pemakaian tertentu dan titular. Dalam bahasa Indonesia, kapitalisasi mempertahankan gelar kristologis tersebut.
- source_word: Ὁ θρόνος σου ὁ θεὸς
  choice: Takhta-Mu, ya Allah
  rationale: ὁ θεός paling wajar dipahami sebagai sapaan langsung dalam konteks kutipan dan argumen Ibrani 1. Kemungkinan konstruksi predikatif tetap dicatat dalam catatan kaki agar ambiguitas sintaksis tidak disembunyikan.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: tetap untuk selama-lamanya
  rationale: Idiom Yunani ini menyatakan kelangsungan tanpa akhir. Penambahan 'tetap' menghasilkan kalimat Indonesia yang lengkap dan alami karena klausa Yunani tidak memakai kopula eksplisit.
- source_word: ῥάβδος
  choice: tongkat kerajaan
  rationale: Dalam konteks kerajaan, kata ini menunjuk pada tongkat penguasa sebagai lambang wewenang; 'tongkat kerajaan' lebih mudah dipahami pembaca umum daripada serapan 'scepter'.
- source_word: τῆς εὐθύτητος
  choice: yang lurus
  rationale: εὐθύτης secara dasar menyatakan kelurusan atau ketulusan moral. 'Yang lurus' mempertahankan metafora tongkat sekaligus menyiratkan pemerintahan yang benar; alternatif 'kebenaran' dicatat karena juga mungkin dalam konteks etis.
- source_word: ῥάβδος τῆς βασιλείας σου
  choice: tongkat kerajaan-Mu
  rationale: βασιλεία dapat berarti kerajaan, pemerintahan, atau kekuasaan raja. 'Kerajaan-Mu' mempertahankan citra kerajaan dan bentuk konstruksi sumber.
theological_decisions:
- issue: Apakah ὁ θεός merupakan sapaan langsung kepada Anak atau predikat dalam arti 'Allah adalah takhta-Mu'.
  choice: 'Sapaan langsung: “Takhta-Mu, ya Allah.”'
  alternative: “Allah adalah takhta-Mu untuk selama-lamanya.”
  rationale: Sapaan langsung paling sesuai dengan alur argumentasi Ibrani 1 dan daya retoris kutipan tersebut. Namun, karena konstruksi predikatif secara gramatikal pernah diperdebatkan, alternatif itu dipertahankan dalam catatan kaki tanpa menghapus ketegangan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Pronomina yang merujuk kepada Allah dan Anak dikapitalisasi sesuai konvensi umum penerjemahan Alkitab Indonesia. Struktur puitis dan citra kerajaan dipertahankan.
