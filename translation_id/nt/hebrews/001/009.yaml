id: HEB.1.9
reference: Hebrews 1:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο ἔχρισέν σε ὁ θεός, ὁ θεός σου, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/009.yaml
  text: You have loved righteousness and hated lawlessness; therefore God[a], your God, has anointed you with the oil of gladness beyond your companions.
translation:
  language: id
  text: Engkau telah mencintai keadilan[a] dan membenci kedurhakaan; karena itu Allah, Allah-Mu, telah mengurapi Engkau dengan minyak sukacita melebihi rekan-rekan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebenaran.” Kata Yunani ini dapat menunjuk pada keadilan atau kebenaran; teks utama memakai “keadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάπησας
  choice: telah mencintai
  rationale: Bentuk aoris menyatakan tindakan yang dipandang utuh; konstruksi “telah mencintai” mempertahankan relevansinya dalam kutipan yang bernada luhur dan berpasangan secara alami dengan “membenci”.
- source_word: δικαιοσύνην
  choice: kebenaran
  rationale: “Kebenaran” merupakan padanan teologis yang lazim dan di sini menunjuk pada sifat serta perilaku yang benar. Nuansa “keadilan” tetap mungkin dan dicantumkan dalam catatan kaki.
- source_word: ἐμίσησας
  choice: membenci
  rationale: Kata yang kuat dan langsung ini mempertahankan pertentangan moral dengan “mencintai” tanpa memperhalus teks sumber.
- source_word: ἀνομίαν
  choice: kedurhakaan
  rationale: “Kedurhakaan” menyampaikan penolakan terhadap ketetapan atau hukum dalam bentuk Indonesia yang ringkas dan bermartabat; “pelanggaran hukum” dapat terdengar terlalu yuridis dan sempit dalam konteks ini.
- source_word: διὰ τοῦτο
  choice: karena itu
  rationale: Ungkapan ini menyatakan hubungan sebab-akibat atau kesimpulan secara alami dan jelas.
- source_word: ἔχρισέν
  choice: telah mengurapi
  rationale: Mempertahankan gambaran pengurapan rajawi dan mesianik serta tindakan yang telah terlaksana dengan makna yang tetap berlaku.
- source_word: ὁ θεός, ὁ θεός σου
  choice: Allah, Allah-Mu
  rationale: Pengulangan dan hubungan personal dalam bahasa Yunani dipertahankan secara langsung tanpa penjelasan doktrinal tambahan.
- source_word: ἔλαιον ἀγαλλιάσεως
  choice: minyak sukacita
  rationale: Padanan ini mempertahankan ungkapan kitab suci tentang perayaan dan pengudusan dalam bahasa Indonesia yang mudah dipahami.
- source_word: παρὰ
  choice: melebihi
  rationale: Dalam konstruksi perbandingan ini, kata tersebut menyatakan keunggulan dalam kadar atau kedudukan.
- source_word: μετόχους
  choice: rekan-rekan
  rationale: “Rekan-rekan” cukup luas untuk menyampaikan orang-orang yang turut mengambil bagian atau bersekutu dengannya, tanpa nuansa komersial yang kuat.
theological_decisions:
- issue: Makna δικαιοσύνη dalam kutipan rajawi/mesianik
  choice: kebenaran
  alternative: keadilan
  rationale: Teks utama memakai padanan teologis yang lazim dan sesuai dengan kontras moral terhadap kedurhakaan, sementara kemungkinan nuansa keadilan dipertahankan dalam catatan kaki.
- issue: Daya kristologis ungkapan “Allah, Allah-Mu” yang ditujukan mengenai Sang Anak
  choice: Mempertahankan pengulangan secara langsung tanpa perluasan doktrinal
  alternative: Menambahkan parafrasa yang menjelaskan hubungan antara Sang Anak dan Allah
  rationale: Susunan sumber mengandung ketegangan teologis yang disengaja. Terjemahan mempertahankannya tanpa melunakkan atau menjelaskannya melalui doktrin tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “Engkau” serta akhiran “-Mu” mempertahankan gaya kutipan langsung yang luhur. Struktur “Allah, Allah-Mu” sengaja dipertahankan untuk mencerminkan pengulangan teks sumber dan menjaga ketegangan teologisnya.
