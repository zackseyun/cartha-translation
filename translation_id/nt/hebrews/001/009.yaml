  to: Engkau telah mencintai keadilan[a] dan membenci kedurhakaan; karena itu Allah, Allah-Mu, telah mengurapi Engkau dengan minyak sukacita melebihi rekan-rekan-Mu.
  rationale: Only the rendering of δικαιοσύνη and its corresponding footnote are revised. This better reflects the ethical and judicial sense of the Greek in modern standard Indonesian while preserving the recognized alternative. No doctrinal explanation is added, and the direct repetition “Allah, Allah-Mu” remains unchanged.
