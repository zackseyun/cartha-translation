  text: καὶ ὡσεὶ περιβόλαιον ἑλίξεις αὐτούς, ⸂ὡς ἱμάτιον⸃ καὶ ἀλλαγήσονται· σὺ δὲ ὁ αὐτὸς εἶ, καὶ τὰ ἔτη σου οὐκ ἐκλείψουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/012.yaml
  text: and like a cloak you will roll them up[a]; like a garment they will be changed. But you are the same[b], and your years will not fail.
translation:
  language: id
  text: dan seperti jubah Engkau akan menggulung semuanya; seperti pakaian[a], semuanya akan diubah. Namun Engkau tetap sama, dan tahun-tahun-Mu tidak akan berakhir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa «seperti pakaian» tidak terdapat dalam beberapa naskah kuno.
    reason: textual_variant
  - marker: b
    text: 'Atau: «tidak akan habis» atau «tidak akan berhenti.»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ περιβόλαιον
  choice: seperti jubah
  rationale: Mempertahankan perbandingan dengan pakaian luar yang menyelubungi tubuh, dengan ungkapan Indonesia yang alami dan tetap puitis.
- source_word: ἑλίξεις
  choice: akan menggulung
  rationale: Menyampaikan tindakan menggulung atau melipat sesuatu seperti pakaian; 'menggulung' mempertahankan gambaran yang konkret.
- source_word: αὐτούς
  choice: semuanya
  rationale: Merujuk kepada ciptaan yang dibicarakan dalam konteks sebelumnya. 'Semuanya' lebih alami daripada pronomina insan 'mereka' untuk benda-benda ciptaan dalam bahasa Indonesia.
- source_word: ὡς ἱμάτιον
  choice: seperti pakaian
  rationale: Mempertahankan perbandingan kedua dengan pakaian dan membedakannya secara alami dari 'jubah'.
- source_word: ἀλλαγήσονται
  choice: akan diubah
  rationale: Mempertahankan bentuk pasif dan menyatakan bahwa ciptaan mengalami perubahan.
- source_word: σὺ δὲ ὁ αὐτὸς εἶ
  choice: Namun Engkau tetap sama
  rationale: '''Namun'' menandai kontras dengan ciptaan yang berubah, sedangkan ''tetap sama'' mengungkapkan kesinambungan identitas tanpa memasukkan istilah teologis teknis.'
- source_word: τὰ ἔτη σου οὐκ ἐκλείψουσιν
  choice: tahun-tahun-Mu tidak akan berakhir
  rationale: Mempertahankan metafora temporal dan menyampaikan secara alami bahwa keberadaan-Nya tidak akan mencapai akhir.
theological_decisions:
- issue: Bahasa tentang ketetapan ilahi dalam kutipan yang diterapkan kepada Sang Anak
  choice: Namun Engkau tetap sama
  alternative: Namun Engkau tidak berubah
  rationale: Pilihan ini dekat dengan ungkapan Yunani ὁ αὐτός dan mempertahankan kontras antara ciptaan yang berubah dengan pribadi yang tetap sama, tanpa menggantinya dengan rumusan doktrinal teknis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Huruf kapital pada Engkau dan -Mu mengikuti kebiasaan penulisan rujukan kepada Allah dalam Alkitab bahasa Indonesia.
