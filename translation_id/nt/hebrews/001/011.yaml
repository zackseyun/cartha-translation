  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: αὐτοὶ ἀπολοῦνται, σὺ δὲ διαμένεις· καὶ πάντες ὡς ἱμάτιον παλαιωθήσονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/011.yaml
  text: They will perish[a], but you remain; and they all will wear out like a garment[b],
translation:
  language: id
  text: Semuanya itu akan binasa, tetapi Engkau tetap ada; dan semuanya akan menjadi usang seperti pakaian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gambaran ini menggemakan Mazmur 102:26–28 dalam penomoran Alkitab Indonesia (Mazmur 102:25–27 dalam sebagian penomoran lain), dan mempertentangkan kefanaan ciptaan dengan keberadaan tetap dari Dia yang disapa.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: Semuanya itu
  rationale: Mengacu kembali pada langit dan bumi dalam ayat sebelumnya. Bentuk ini wajar dalam bahasa Indonesia dan menegaskan kontras dengan kata ganti orang kedua.
- source_word: ἀπολοῦνται
  choice: akan binasa
  rationale: Mempertahankan arti kuat bahwa semuanya itu akan berakhir atau lenyap, tanpa menyatakan penyebab kehancuran yang tidak disebutkan dalam teks.
- source_word: σὺ δὲ
  choice: tetapi Engkau
  rationale: Menyampaikan kontras tegas antara ciptaan dan pribadi yang disapa. Huruf kapital menandai sapaan kepada Sang Anak berdasarkan konteks, tanpa menambahkan gelar ke dalam ayat.
- source_word: διαμένεις
  choice: tetap ada
  rationale: Mengungkapkan keberlangsungan dan ketetapan eksistensi secara alami dalam bahasa Indonesia, berlawanan dengan kebinasaan ciptaan.
- source_word: πάντες
  choice: semuanya
  rationale: Mengacu secara kolektif pada segala yang diciptakan dan mempertahankan cakupan menyeluruh kata Yunani.
- source_word: ὡς ἱμάτιον
  choice: seperti pakaian
  rationale: Pakaian merupakan padanan luas dan alami bagi ἱμάτιον serta mempertahankan perumpamaan tanpa mempersempitnya menjadi jenis pakaian tertentu.
- source_word: παλαιωθήσονται
  choice: akan menjadi usang
  rationale: Menyampaikan proses menjadi tua atau lapuk dengan tepat dalam gambaran pakaian; bentuk ini juga mempertahankan nuansa pasif/intransitif tanpa mengisyaratkan pelaku tertentu.
theological_decisions:
- issue: Subjek yang disapa dan daya kristologis
  choice: 'Mempertahankan sapaan langsung kepada Sang Anak: “Engkau tetap ada.”'
  alternative: Menambahkan sebutan “Anak” atau uraian doktrinal dalam teks ayat.
  rationale: Dalam konteks Ibrani 1, kutipan Mazmur ini diterapkan kepada Sang Anak. Sapaan orang kedua dipertahankan tanpa menambahkan penjelasan teologis yang tidak terdapat dalam kalimat Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Tetap ada” dipilih agar alami bagi pembaca umum, sedangkan “menjadi usang” mempertahankan gambaran pakaian yang menua atau lapuk. Penanda catatan kaki [a] dicantumkan dalam teks utama.
