  text: ὅταν δὲ πάλιν εἰσαγάγῃ τὸν πρωτότοκον εἰς τὴν οἰκουμένην, λέγει· Καὶ προσκυνησάτωσαν αὐτῷ πάντες ἄγγελοι θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/006.yaml
  text: And when he again brings the Firstborn into the world[a], he says[b], “And let all God’s angels worship him.”
translation:
  language: id
  text: Dan ketika Ia sekali lagi membawa Sang Sulung ke dalam dunia[a], Ia berkata, “Hendaklah semua malaikat Allah menyembah Dia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan sekali lagi, ketika Ia membawa Sang Sulung ke dalam dunia, Ia berkata, ‘Hendaklah semua malaikat Allah menyembah Dia.’” Kata Yunani yang diterjemahkan “sekali lagi” dapat menerangkan “membawa” atau “berkata”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: ketika
  rationale: Memperkenalkan klausa waktu yang menunjuk pada suatu peristiwa tertentu; “ketika” lebih sesuai daripada bentuk berulang seperti “setiap kali”.
- source_word: δὲ
  choice: Dan
  rationale: Penghubung ringan yang melanjutkan argumen tanpa memberi kesan pertentangan yang kuat.
- source_word: πάλιν
  choice: kembali
  rationale: Dalam teks utama dipahami menerangkan tindakan “membawa”. Bahasa Yunani juga memungkinkan kata ini menerangkan “Ia berkata”; ambiguitas itu dipertahankan dalam catatan kaki.
- source_word: εἰσαγάγῃ
  choice: membawa ... ke dalam
  rationale: Menyampaikan tindakan membawa masuk secara alami dan cukup dekat dengan makna verba Yunani.
- source_word: τὸν πρωτότοκον
  choice: Sang Sulung
  rationale: Dipakai sebagai gelar bagi Anak dalam konteks ini. “Sang Sulung” terdengar alami dan bermartabat serta mempertahankan resonansi kedudukan dan hubungan sebagai anak.
- source_word: εἰς τὴν οἰκουμένην
  choice: ke dalam dunia
  rationale: οἰκουμένη dapat berarti dunia yang dihuni; “dunia” merupakan padanan Indonesia yang alami dan sesuai dengan cakupan konteks.
- source_word: λέγει
  choice: Ia berkata
  rationale: Subjek tersiratnya adalah Allah dalam rangkaian kutipan ini. Terjemahan tidak menambahkan keterangan seperti “dalam Kitab Suci” yang tidak dinyatakan secara eksplisit.
- source_word: προσκυνησάτωσαν
  choice: Hendaklah ... menyembah
  rationale: “Hendaklah” menyampaikan daya imperatif orang ketiga, sedangkan “menyembah” paling tepat bagi penghormatan para malaikat kepada Sang Anak dalam konteks Ibrani 1.
- source_word: αὐτῷ
  choice: Dia
  rationale: Objek datif sesudah προσκυνέω secara alami diterjemahkan sebagai objek langsung dalam bahasa Indonesia.
- source_word: πάντες ἄγγελοι θεοῦ
  choice: semua malaikat Allah
  rationale: Padanan yang jelas dan dekat dengan konstruksi genitif Yunani, tanpa perlu mengubahnya menjadi bentuk posesif lain.
theological_decisions:
- issue: Cakupan sintaksis πάλιν
  choice: 'πάλιν menerangkan “membawa”: “ketika Ia kembali membawa Sang Sulung ke dalam dunia”'
  alternative: 'πάλιν menerangkan “berkata”: “Dan lagi, ketika Ia membawa Sang Sulung ke dalam dunia, Ia berkata”'
  rationale: Bahasa Yunani memungkinkan kedua hubungan sintaksis. Teks utama mengikuti hubungan dengan verba yang langsung menyusul, sedangkan kemungkinan lainnya dicatat agar ambiguitas asli tidak dihilangkan.
- issue: Daya makna προσκυνέω terhadap Sang Anak
  choice: menyembah
  alternative: sujud di hadapan; memberi hormat kepada
  rationale: Dalam argumen Ibrani 1 tentang keunggulan Sang Anak atas para malaikat, perintah kepada semua malaikat Allah paling tepat dinyatakan dengan “menyembah”. Pilihan ini mempertahankan bobot teks tanpa menambahkan rumusan doktrinal di luar ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya yang bermartabat dan mudah dipahami. Kapitalisasi “Ia” dan “Dia” dipakai karena rujukannya ilahi; “Sang Sulung” diperlakukan sebagai gelar kristologis. Susunan kalimat mempertahankan ambiguitas penting melalui catatan kaki tanpa membebani teks utama.
