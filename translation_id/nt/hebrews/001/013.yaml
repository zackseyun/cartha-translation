  text: πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/013.yaml
  text: But to which of the angels has he ever said[a], ‘Sit at my right hand until I make your enemies a footstool for your feet’?”
translation:
  language: id
  text: Namun, kepada siapakah di antara para malaikat Allah pernah berkata, “Duduklah di sebelah kanan-Ku sampai Aku menjadikan musuh-musuhmu tumpuan bagi kakimu”[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sampai Aku menaruh musuh-musuhmu di bawah kakimu.”'
    reason: Alternatif leksikal untuk τίθημι dan pengungkapan idiomatis citra ὑποπόδιον tanpa meniadakan metafora pada teks utama.
lexical_decisions:
- source_word: πρὸς τίνα δὲ τῶν ἀγγέλων
  choice: Namun, kepada siapakah di antara para malaikat
  rationale: πρός dengan τίνα setelah verba berkata berarti ‘kepada siapa’. δέ menandai kontras dengan uraian sebelumnya dan secara alami diterjemahkan ‘Namun’.
- source_word: εἴρηκέν ποτε
  choice: Allah pernah berkata
  rationale: Bentuk perfektum menyatakan perkataan yang tetap berlaku, sedangkan ποτέ berarti ‘pernah’. Subjek tersirat dijelaskan sebagai Allah berdasarkan konteks agar pertanyaan retoris tetap jelas dalam bahasa Indonesia.
- source_word: Κάθου
  choice: Duduklah
  rationale: Imperatif ini paling wajar dan bermartabat diterjemahkan ‘Duduklah’.
- source_word: ἐκ δεξιῶν μου
  choice: di sebelah kanan-Ku
  rationale: Ungkapan tetap ini bersifat lokatif dan menunjuk tempat kehormatan di sisi kanan, bukan gerakan ‘dari’ sisi kanan.
- source_word: ἕως ἂν θῶ
  choice: sampai Aku menjadikan
  rationale: Konstruksi ἕως ἂν dengan subjungtif mengarah pada tindakan mendatang; ‘menjadikan’ cocok dengan pelengkap predikatif ‘tumpuan kakimu’.
- source_word: τοὺς ἐχθρούς σου
  choice: musuh-musuhmu
  rationale: Padanan langsung yang mempertahankan bentuk jamak dan sapaan orang kedua tunggal.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: tumpuan kakimu
  rationale: Ungkapan ini mempertahankan citra kerajaan tentang penaklukan, sekaligus terdengar alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Mempertahankan daya kristologis kutipan Mazmur 110:1 tanpa menambahkan tafsiran
  choice: Kutipan dipertahankan sebagai sabda langsung tentang kedudukan di sebelah kanan Allah dan musuh sebagai tumpuan kaki.
  alternative: Memparafrasakannya sebagai ‘sampai Aku mengalahkan semua musuhmu’.
  rationale: Argumen Ibrani bergantung pada kata-kata Kitab Suci dan kontras antara Sang Anak dengan para malaikat. Citra penobatan dan penaklukan karena itu perlu dipertahankan.
- issue: Subjek tersirat dari εἴρηκέν
  choice: Menyatakan subjek sebagai ‘Allah’.
  alternative: Membiarkannya sebagai ‘Dia’ atau tanpa subjek eksplisit.
  rationale: Konteks rangkaian kutipan menunjukkan bahwa Allah adalah pembicara; penyebutan eksplisit menghindari ketidakjelasan referen dalam bahasa Indonesia tanpa mengubah isi teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pertanyaan retoris serta citra penobatan kerajaan dipertahankan. Kapitalisasi pronomina dalam kutipan membedakan pembicara ilahi (‘Aku’, ‘-Ku’) dari pihak yang disapa (‘-mu’).
