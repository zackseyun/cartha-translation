  text: καὶ πρὸς μὲν τοὺς ἀγγέλους λέγει· Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα, καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/007.yaml
  text: And about the angels he says[a], “He makes his angels winds, and his ministers a flame of fire.”
translation:
  language: id
  text: Tentang para malaikat, Ia berkata, “Ia menjadikan malaikat-malaikat-Nya angin[a], dan pelayan-pelayan-Nya nyala api.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh-roh”; kata Yunani yang dipakai dapat berarti “angin” atau “roh-roh”.
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς μὲν τοὺς ἀγγέλους
  choice: Tentang para malaikat
  rationale: 'Dalam konteks perbandingan antara malaikat dan Sang Anak, frasa ini bersifat topikal: perkataan itu mengenai malaikat, bukan ditujukan langsung kepada mereka.'
- source_word: λέγει
  choice: Ia berkata
  rationale: Bentuk kini Yunani dipertahankan sebagai formula kutipan Kitab Suci yang hidup dan wajar dalam bahasa Indonesia.
- source_word: Ὁ ποιῶν
  choice: Ia menjadikan
  rationale: Partisip berartikel ini berfungsi secara verbal. 'Menjadikan' mempertahankan makna aktif dan hubungan predikatif dengan 'angin' serta 'nyala api'.
- source_word: ἀγγέλους
  choice: malaikat-malaikat
  rationale: Konteks Ibrani 1 jelas berbicara tentang makhluk surgawi dan membandingkan mereka dengan Sang Anak, sehingga 'malaikat' lebih tepat daripada 'utusan'.
- source_word: πνεύματα
  choice: angin
  rationale: Kata ini dapat berarti 'angin' atau 'roh'. 'Angin' paling sesuai dengan latar Mazmur 104:4 dan kesejajaran puitis dengan 'nyala api'; alternatifnya dicantumkan dalam catatan kaki.
- source_word: λειτουργοὺς
  choice: pelayan-pelayan
  rationale: Kata ini menunjuk kepada mereka yang melaksanakan pelayanan, kadang dengan nuansa resmi atau ibadah. 'Pelayan' alami dalam bahasa Indonesia dan tidak menyiratkan jabatan gerejawi tertentu.
- source_word: πυρὸς φλόγα
  choice: nyala api
  rationale: Ungkapan tunggal ini mempertahankan citra puitis bahasa Yunani secara alami tanpa pluralisasi.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Akhiran posesif ini secara alami menyatakan kepunyaan Allah dalam konteks kutipan.
theological_decisions:
- issue: Makna πνεύματα dalam kutipan Mazmur 104:4
  choice: angin
  alternative: roh-roh
  rationale: Makna 'angin' paling cocok dengan latar Ibrani Mazmur dan pasangan puitis 'nyala api', tetapi bahasa Yunani tetap memungkinkan arti 'roh-roh'. Ambiguitas yang bermakna secara teologis itu dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi 'Ia' dan akhiran '-Nya' menandai rujukan kepada Allah sesuai kebiasaan umum penerbitan Alkitab Indonesia. Susunan kalimat mempertahankan kesejajaran puitis kutipan.
