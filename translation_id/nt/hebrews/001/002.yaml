  text: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων ἐλάλησεν ἡμῖν ἐν υἱῷ, ὃν ἔθηκεν κληρονόμον πάντων, δι’ οὗ καὶ ⸂ἐποίησεν τοὺς αἰῶνας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/002.yaml
  text: in these last days he has spoken to us in a Son[a], whom he appointed heir of all things[b], through whom he also made the ages.
translation:
  language: id
  text: pada hari-hari terakhir ini Ia telah berbicara kepada kita dalam diri Anak[a], yang telah Ia tetapkan sebagai ahli waris segala sesuatu, dan melalui Dia Ia juga menjadikan segala zaman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "melalui Anak." Secara harfiah, bahasa Yunani berbunyi "dalam Anak"; kata "Anak" tidak didahului artikel tertentu. Ungkapan ini menonjolkan cara dan sifat puncak firman Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau "alam semesta" atau "segala dunia." Ungkapan Yunani "segala zaman" dapat menunjuk pada zaman-zaman itu sendiri dan, dengan perluasan makna, pada seluruh tatanan ciptaan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων
  choice: pada akhir zaman ini
  rationale: Ungkapan waktu ini diterjemahkan secara alami dalam bahasa Indonesia sambil mempertahankan daya eskatologisnya; bentuk tunggal kolektif 'zaman ini' menghindari frasa yang kaku.
- source_word: ἐλάλησεν
  choice: telah berbicara
  rationale: Bentuk ini menyatakan tindakan yang telah terjadi tetapi tetap relevan, serta mengalir alami sebagai kontras dengan ayat sebelumnya.
- source_word: ἐν υἱῷ
  choice: dalam seorang Anak
  rationale: Mempertahankan preposisi ἐν dan ketiadaan artikel pada υἱῷ. Ungkapan ini sengaja tidak dinormalkan menjadi 'melalui Anak-Nya', agar cara dan sifat puncak firman Allah tetap terasa.
- source_word: ὃν ἔθηκεν
  choice: yang telah Ia tetapkan
  rationale: Dalam konteks peran sebagai ahli waris, τίθημι berarti menetapkan atau mengangkat; 'tetapkan' tepat dan bermartabat.
- source_word: κληρονόμον πάντων
  choice: sebagai ahli waris segala sesuatu
  rationale: Menyampaikan cakupan luas πάντων dengan ungkapan Indonesia yang baku dan jelas.
- source_word: δι’ οὗ
  choice: melalui Dia
  rationale: διά dengan genitif menunjukkan perantaraan atau sarana; kapitalisasi memperjelas bahwa rujukannya adalah Anak.
- source_word: ἐποίησεν
  choice: menjadikan
  rationale: Pilihan ini mempertahankan keluasan ποιέω dan tidak mempersempitnya menjadi verba penciptaan yang lebih khusus.
- source_word: τοὺς αἰῶνας
  choice: segala zaman
  rationale: Mempertahankan dimensi temporal αἰῶνες sekaligus memungkinkan cakupan kosmisnya; alternatif 'alam semesta' dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Daya kristologis ἐν υἱῷ
  choice: dalam seorang Anak
  alternative: melalui Anak-Nya; dalam Sang Anak
  rationale: Terjemahan mempertahankan ungkapan Yunani tanpa artikel dan nuansa ἐν, tanpa menyangkal bahwa konteks menunjuk kepada Anak yang unik. Catatan kaki membantu pembaca memahami alternatif idiomatisnya.
- issue: Cakupan τοὺς αἰῶνας dalam peran Anak pada penciptaan
  choice: segala zaman
  alternative: alam semesta; segala dunia
  rationale: αἰῶνες dapat menunjuk pada zaman-zaman dan, secara lebih luas, seluruh tatanan ciptaan. Teks utama mempertahankan keluasan temporal-kosmis itu, sedangkan catatan kaki menyatakan padanan kosmis yang lazim.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur kalimat mengikuti hubungan klausa Yunani tanpa menjadi terlalu kaku. Kata ganti ilahi dikapitalisasi untuk kejelasan rujukan; istilah yang memiliki ketegangan temporal-kosmis dipertahankan dan dijelaskan melalui catatan kaki.
