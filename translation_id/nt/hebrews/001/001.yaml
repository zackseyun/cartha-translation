  text: Long ago[c][b][a], God spoke to the fathers in many parts and in many ways by the prophets.
translation:
  language: id
  text: 'Pada zaman dahulu, Allah berbicara kepada para leluhur[a] dalam banyak bagian[b] dan dengan berbagai cara melalui para nabi.[c]


    [a] Secara harfiah, “kepada para bapa”; dapat juga diterjemahkan “kepada nenek moyang.”


    [b] Dapat juga diterjemahkan “dalam banyak porsi.” Ungkapan Yunani ini menekankan bahwa penyataan terdahulu diberikan dalam sejumlah bagian, sedangkan “dengan berbagai cara” menekankan keragaman caranya.


    [c] Dapat juga diterjemahkan “dengan perantaraan para nabi”; secara harfiah, “di dalam para nabi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepada para bapa”; dapat juga diterjemahkan “kepada nenek moyang.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “dalam banyak porsi.” Ungkapan Yunani ini menekankan bahwa penyataan terdahulu diberikan dalam sejumlah bagian, sedangkan “dengan berbagai cara” menekankan keragaman caranya.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “dengan perantaraan para nabi”; secara harfiah, “di dalam para nabi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολυμερῶς
  choice: dalam banyak bagian
  rationale: Mempertahankan gagasan bahwa penyataan terdahulu diberikan dalam sejumlah bagian atau tahap, sekaligus membedakannya dari πολυτρόπως yang menunjuk pada keragaman cara.
- source_word: πολυτρόπως
  choice: dengan berbagai cara
  rationale: Ungkapan Indonesia yang alami untuk keragaman cara atau bentuk, tanpa melebur maknanya dengan Πολυμερῶς.
- source_word: πάλαι
  choice: Pada zaman dahulu
  rationale: Menyampaikan jarak waktu secara jelas, alami, dan bermartabat dalam bahasa Indonesia modern.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Padanan baku bahasa Indonesia untuk θεός dalam konteks ini; berfungsi sebagai subjek kalimat.
- source_word: λαλήσας
  choice: berbicara
  rationale: Partisip aoris ini terkait secara sintaksis dengan verba utama pada ayat 2. Bentuk finit membuat ayat 1 dapat dibaca dengan wajar secara mandiri sambil tetap memungkinkan kontras waktunya berlanjut pada ayat berikut.
- source_word: τοῖς πατράσιν
  choice: kepada para leluhur
  rationale: Dalam konteks sejarah umat, πατέρες menunjuk pada generasi pendahulu. 'Para leluhur' alami dalam bahasa Indonesia modern; arti harfiahnya, 'para bapa,' dicatat dalam catatan kaki.
- source_word: ἐν τοῖς προφήταις
  choice: melalui para nabi
  rationale: 'ἐν di sini paling wajar dipahami secara instrumental atau sebagai perantaraan: Allah adalah pembicara, sedangkan para nabi menjadi penyampai firman-Nya. Arti harfiah tetap dicatat.'
theological_decisions:
- issue: Hubungan konstruksi partisip pada ayat 1 dengan verba utama dalam Ibrani 1:2
  choice: Menggunakan verba finit 'Allah berbicara' pada ayat 1 sambil mempertahankan kerangka waktu 'Pada zaman dahulu.'
  alternative: Menerjemahkan secara lebih formal, 'Setelah pada zaman dahulu Allah berbicara ...,' sehingga kalimat jelas belum selesai sampai ayat 2.
  rationale: λαλήσας secara gramatikal bergantung pada verba utama di ayat 2, tetapi terjemahan ayat tunggal dengan partisip yang menggantung terasa tidak wajar. Bentuk finit menjaga keterbacaan tanpa menambahkan klaim teologis atau meniadakan kontras dengan penyataan dalam Anak pada ayat berikut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Pada zaman dahulu' serta 'para leluhur' mudah dipahami pembaca umum. Frasa yang agak tidak lazim, 'dalam banyak bagian,' sengaja dipertahankan untuk menjaga perbedaan leksikal antara dua adverbia Yunani yang berdekatan; catatan kaki menjelaskannya.
