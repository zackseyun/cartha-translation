id: HEB.1.14
reference: Hebrews 1:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐχὶ πάντες εἰσὶν λειτουργικὰ πνεύματα εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/014.yaml
  text: Are they not all ministering spirits, being sent out for service for the sake of those who are about to inherit salvation?[a]
translation:
  language: id
  text: Bukankah mereka semua adalah roh-roh yang melayani, yang diutus untuk pelayanan demi mereka yang akan mewarisi keselamatan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka yang kelak akan mewarisi keselamatan.” Ungkapan Yunani ini berorientasi pada masa depan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ
  choice: Bukankah
  rationale: Mengungkapkan pertanyaan retoris yang mengharapkan jawaban positif secara alami dalam bahasa Indonesia.
- source_word: πάντες
  choice: semua
  rationale: Mempertahankan cakupan menyeluruh dari bentuk jamak Yunani.
- source_word: λειτουργικὰ πνεύματα
  choice: roh-roh yang melayani
  rationale: λειτουργικός menunjuk pada pelayanan, sering dengan nuansa resmi atau suci; ungkapan ini alami dan tidak menyiratkan jabatan gerejawi tertentu.
- source_word: εἰς διακονίαν
  choice: untuk pelayanan
  rationale: Mempertahankan bentuk nomina dan menyatakan tujuan pengutusan tanpa mempersempitnya menjadi pelayanan gerejawi.
- source_word: ἀποστελλόμενα
  choice: yang diutus
  rationale: Mencerminkan bentuk partisip pasif yang menerangkan roh-roh tersebut; 'diutus' menyampaikan tindakan pengiriman tanpa perlu menambahkan pelaku yang tidak disebutkan.
- source_word: διὰ
  choice: demi
  rationale: Dengan akusatif, διά di sini paling wajar menyatakan manfaat atau kepentingan pihak yang menerima pelayanan.
- source_word: τοὺς μέλλοντας
  choice: mereka yang akan
  rationale: Menyampaikan orientasi masa depan dari μέλλω secara alami; nuansa prospektifnya dijelaskan dalam catatan kaki tanpa memaksakan arti 'ditakdirkan'.
- source_word: κληρονομεῖν
  choice: menerima ... sebagai warisan
  rationale: Mengungkapkan citra pewarisan secara jelas dalam bahasa Indonesia dan menghindari kesan bahwa keselamatan itu sendiri melakukan tindakan mewarisi.
- source_word: σωτηρίαν
  choice: keselamatan
  rationale: Padanan baku dan tepat dalam konteks Surat Ibrani, dengan cakupan keselamatan yang tidak dipersempit.
theological_decisions:
- issue: Daya ungkap μέλλοντας κληρονομεῖν σωτηρίαν
  choice: mereka yang akan menerima keselamatan sebagai warisan
  alternative: mereka yang segera akan menerima keselamatan sebagai warisan; mereka yang ditentukan untuk mewarisi keselamatan
  rationale: Terjemahan mempertahankan arah masa depan dan gambaran warisan, tetapi tidak menyatakan kepastian predestinatif yang tidak harus terkandung dalam μέλλω. Kemungkinan nuansa prospektif yang lebih kuat dicatat tanpa menyelesaikan ketegangan teologisnya.
- issue: Identitas λειτουργικὰ πνεύματα
  choice: roh-roh yang melayani
  alternative: malaikat-malaikat yang melayani
  rationale: Konteks merujuk kepada malaikat, tetapi teks Yunani pada ayat ini memakai 'roh-roh'. Mempertahankan istilah tersebut menghindari penggantian eksplisit yang bersifat tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pertanyaan retoris dipertahankan; pengulangan akar makna 'melayani/pelayanan' mencerminkan dua istilah Yunani yang berbeda namun berdekatan maknanya. Tanda koma membantu memperjelas bahwa 'yang diutus' menerangkan roh-roh tersebut.
