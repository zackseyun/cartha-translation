id: HEB.1.3
reference: Hebrews 1:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως, ⸂δι’ αὑτοῦ⸃ καθαρισμὸν ⸂τῶν ἁμαρτιῶν ποιησάμενος⸃ ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/003.yaml
  text: He[a], being the radiance of his glory and the exact imprint of his being, and sustaining all things by the word of his power, after making purification for sins through himself[b], sat down at the right hand of the Majesty on high[c],
translation:
  language: id
  text: Ia adalah pancaran kemuliaan-Nya dan gambaran tepat dari keberadaan-Nya,[a] serta menopang segala sesuatu dengan firman kuasa-Nya. Setelah Ia mengadakan penyucian dari dosa-dosa melalui diri-Nya sendiri,[b] Ia duduk di sebelah kanan Yang Mahabesar di tempat yang tinggi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bekas cap yang tepat dari hakikat-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Sejumlah naskah tidak memuat “melalui diri-Nya sendiri.” Bacaan SBLGNT memuat frasa ini; tradisi teks lain kadang diterjemahkan “oleh diri-Nya sendiri.”
    reason: textual_variant
  - marker: c
    text: Atau “di tempat-tempat tinggi”; ungkapan ini dapat dipahami sebagai “di tempat yang mahatinggi” atau “di surga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: pancaran
  rationale: “Pancaran” mempertahankan gambaran sinar yang terpancar dari kemuliaan ilahi dan lebih kuat daripada “pantulan,” yang dapat menyiratkan sekadar pencerminan.
- source_word: δόξα
  choice: kemuliaan
  rationale: Padanan baku dan berbobot bagi kemegahan serta kehormatan ilahi.
- source_word: χαρακτήρ
  choice: gambaran tepat
  rationale: Menyampaikan kecocokan yang persis dengan realitas yang digambarkan; catatan kaki mempertahankan citra konkret bekas cap.
- source_word: ὑπόστασις
  choice: keberadaan
  rationale: Menunjuk pada realitas mendasar tanpa langsung memasukkan istilah metafisis teknis dari perumusan teologi yang lebih kemudian.
- source_word: φέρων
  choice: menopang
  rationale: Mengungkapkan tindakan aktif dan berkelanjutan yang memelihara segala sesuatu.
- source_word: τὰ πάντα
  choice: segala sesuatu
  rationale: Mempertahankan cakupan menyeluruh tanpa mempersempitnya hanya pada alam semesta fisik.
- source_word: τῷ ῥήματι τῆς δυνάμεως
  choice: dengan firman kuasa-Nya
  rationale: Mempertahankan bentuk genitif Yunani dan kaitan antara perkataan ilahi dengan kuasa-Nya.
- source_word: δι’ αὑτοῦ
  choice: melalui diri-Nya sendiri
  rationale: Mengikuti bacaan SBLGNT dan mempertahankan daya normal preposisi διά; variasi naskah dijelaskan dalam catatan kaki.
- source_word: καθαρισμὸν τῶν ἁμαρτιῶν
  choice: penyucian dari dosa-dosa
  rationale: “Penyucian” mempertahankan nuansa ritual dan korban, sedangkan “dari dosa-dosa” alami dalam bahasa Indonesia dan menunjukkan perkara yang ditangani oleh penyucian itu.
- source_word: ἐκάθισεν ἐν δεξιᾷ
  choice: duduk di sebelah kanan
  rationale: Ungkapan Indonesia yang alami dan mempertahankan gambaran kedudukan kehormatan serta kekuasaan.
- source_word: τῆς μεγαλωσύνης ἐν ὑψηλοῖς
  choice: Yang Mahabesar di tempat yang tinggi
  rationale: “Yang Mahabesar” mempertahankan pengacuan tidak langsung kepada Allah, sedangkan “di tempat yang tinggi” mempertahankan ketaktertentuan bentuk jamak Yunani tanpa memaksakan tafsir “surga” ke dalam teks.
theological_decisions:
- issue: Makna ὑπόστασις dalam ayat yang penting bagi kristologi kemudian
  choice: keberadaan
  alternative: hakikat; zat; esensi
  rationale: “Keberadaan” mempertahankan bobot ontologis teks tanpa menjadikannya formulasi kredal teknis yang muncul kemudian.
- issue: Daya kristologis ἀπαύγασμα dan χαρακτήρ
  choice: pancaran kemuliaan-Nya dan gambaran tepat dari keberadaan-Nya
  alternative: pantulan kemuliaan-Nya dan representasi keberadaan-Nya
  rationale: Pilihan ini mempertahankan bahasa kristologis yang kuat dan kecocokan persis, tanpa melemahkannya menjadi sekadar pencerminan atau perwakilan.
- issue: Varian teks δι’ αὑτοῦ
  choice: mencantumkan “melalui diri-Nya sendiri” dalam teks utama
  alternative: menghilangkan frasa tersebut; “oleh diri-Nya sendiri”
  rationale: SBLGNT mencantumkan frasa itu, sehingga diterjemahkan dalam teks utama; perbedaan tradisi naskah diterangkan dalam catatan kaki.
- issue: Identitas rujukan pronomina posesif αὐτοῦ
  choice: mempertahankan bentuk pronominal “-Nya”
  alternative: mengganti dengan “Allah”
  rationale: Teks Yunani memakai pronomina, dan konteks sebelumnya menentukan rujukannya; terjemahan tidak perlu memperjelas lebih jauh daripada sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dipecah menjadi dua agar mudah dipahami tanpa menghilangkan hubungan partisipial dan urutan tindakan dalam bahasa Yunani. Kapitalisasi pronomina ilahi dan sebutan “Yang Mahabesar” mengikuti kebiasaan terjemahan Alkitab Indonesia.
