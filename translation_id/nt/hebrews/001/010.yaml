id: HEB.1.10
reference: Hebrews 1:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καί· Σὺ κατ’ ἀρχάς, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/010.yaml
  text: And[a], “You, Lord, in the beginning laid the foundation of the earth, and the heavens are the works of your hands.”
translation:
  language: id
  text: Dan, “Engkau, ya Tuhan, pada mulanya meletakkan dasar bumi, dan langit adalah karya tangan-Mu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καί
  choice: Dan
  rationale: Menghubungkan kutipan ini dengan rangkaian kutipan sebelumnya tanpa menambahkan penafsiran.
- source_word: Σὺ
  choice: Engkau
  rationale: Mempertahankan pronomina eksplisit dan bernada tegas dalam sapaan langsung; bentuk ini sesuai dengan ragam kitab suci yang modern dan bermartabat.
- source_word: κατ’ ἀρχάς
  choice: pada mulanya
  rationale: Mengungkapkan waktu pada permulaan atau asal mula dan terdengar alami dalam konteks penciptaan.
- source_word: κύριε
  choice: ya Tuhan
  rationale: Bentuk vokatif diterjemahkan sebagai sapaan langsung; partikel 'ya' membuat fungsi sapaan jelas dalam bahasa Indonesia.
- source_word: τὴν γῆν
  choice: bumi
  rationale: Dalam pasangan penciptaan dengan langit, γῆ menunjuk pada bumi, bukan suatu wilayah tertentu.
- source_word: ἐθεμελίωσας
  choice: meletakkan dasar
  rationale: Mempertahankan metafora arsitektural dari θεμελιόω secara jelas dan wajar.
- source_word: ἔργα τῶν χειρῶν σού
  choice: karya tangan-Mu
  rationale: Ungkapan ringkas dan alami yang mempertahankan gambaran antropomorfis tentang hasil pekerjaan tangan.
- source_word: οἱ οὐρανοί
  choice: langit
  rationale: Bahasa Indonesia lazim memakai bentuk tunggal kolektif 'langit' untuk οὐρανοί dalam konteks penciptaan; makna cakupannya tetap terpelihara.
theological_decisions:
- issue: Penerapan bahasa Mazmur 102 yang ditujukan kepada Tuhan kepada Sang Anak dalam Ibrani 1
  choice: Mempertahankan sapaan langsung 'Engkau, ya Tuhan' tanpa melemahkannya.
  alternative: Mengaburkan atau menetralkan sapaan untuk mengurangi daya kristologis kutipan.
  rationale: Teks Yunani secara eksplisit memuat κύριε sebagai sapaan langsung, dan konteks Ibrani menerapkan kutipan itu kepada Sang Anak. Terjemahan mempertahankan bentuk teks tanpa menambahkan uraian doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapital pada pronomina enklitik '-Mu' mengikuti kebiasaan penulisan rujukan kepada Tuhan. Tidak ditambahkan catatan kaki karena alternatif 'di awal' tidak memberi perbedaan makna yang cukup penting dalam bahasa Indonesia.
