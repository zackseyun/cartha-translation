  rationale: Revisi memperjelas fungsi genitif sesudah ἀκούω sebagai "mendengar tentang Dia" dan memperbaiki kelancaran konstruksi pertama. Bentuk pertanyaan, daya simpulan οὖν, urutan argumentasi, serta penekanan pada tindakan memberitakan tetap dipertahankan.
