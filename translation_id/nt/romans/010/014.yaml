id: ROM.10.14
reference: Romans 10:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πῶς οὖν ⸀ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ ⸀πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ⸀ἀκούσωσιν χωρὶς κηρύσσοντος;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/014.yaml
  text: How then will they call on him in whom they have not believed? And how will they believe in him of whom they have not heard? And how will they hear without someone preaching?[a]
translation:
  language: id
  text: Jadi, bagaimana mereka akan berseru kepada-Nya jika mereka belum percaya kepada-Nya? Bagaimana mereka akan percaya kepada Dia jika mereka belum pernah mendengar tentang Dia? Bagaimana mereka akan mendengar jika tidak ada yang memberitakan?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πῶς οὖν
  choice: Jadi, bagaimana
  rationale: Mempertahankan daya simpulan οὖν dan alur pertanyaan retoris Paulus dalam bahasa Indonesia yang alami.
- source_word: ἐπικαλέσωνται
  choice: mereka akan berseru kepada
  rationale: Mengungkapkan tindakan memanggil atau memohon kepada Tuhan, sekaligus mempertahankan kaitannya dengan kutipan pada ayat sebelumnya.
- source_word: εἰς ὃν οὐκ ἐπίστευσαν
  choice: Dia yang belum mereka percayai
  rationale: Bahasa Indonesia tidak perlu meniru susunan preposisional Yunani secara kaku; bentuk ini secara alami menyatakan bahwa Dia adalah objek kepercayaan.
- source_word: πιστεύσωσιν
  choice: mereka akan percaya
  rationale: Padanan lazim bagi πιστεύω dan sesuai dengan rangkaian pertanyaan retoris yang berorientasi pada kemungkinan mendatang.
- source_word: οὗ οὐκ ἤκουσαν
  choice: Dia yang belum pernah mereka dengar
  rationale: Menjaga kemungkinan bahwa bentuk genitif dengan ἀκούω berarti mendengar Dia, tanpa menutup kemungkinan arti mendengar tentang Dia; alternatifnya dicatat dalam catatan kaki.
- source_word: ἀκούσωσιν
  choice: mereka akan mendengar
  rationale: Padanan langsung yang mempertahankan pengulangan akar kata mendengar dan alur argumentasi.
- source_word: χωρὶς κηρύσσοντος
  choice: jika tidak ada yang memberitakan
  rationale: Menekankan kegiatan pemberitaan oleh seseorang, bukan jabatan resmi seorang pemberita, serta terdengar wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa πιστεύω
  choice: percaya / mempercayai
  alternative: beriman; menaruh kepercayaan
  rationale: Pilihan ini mempertahankan istilah dasar Paulus secara ringkas tanpa menambahkan nuansa teologis yang tidak dinyatakan secara eksplisit.
- issue: Objek pendengaran dalam οὗ οὐκ ἤκουσαν
  choice: Dia yang belum pernah mereka dengar
  alternative: Dia yang belum pernah mereka dengar beritanya
  rationale: Genitif οὗ sesudah ἀκούω dapat menunjuk kepada pribadi yang didengar atau kepada pribadi yang tentang-Nya orang mendengar. Teks utama mempertahankan bentuk yang lebih dekat dengan Yunani, sedangkan catatan kaki menjaga kemungkinan makna pemberitaan tentang Dia.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Rangkaian tiga pertanyaan dipertahankan. Kata “Dia” memakai huruf kapital karena merujuk kepada Kristus/Tuhan, sesuai konvensi umum penerbitan Alkitab bahasa Indonesia.
