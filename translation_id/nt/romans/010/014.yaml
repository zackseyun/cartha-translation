    issue: Objek ἀκούω diterjemahkan sebagai "Dia yang belum pernah mereka dengar".
    rationale: Ungkapan ini dalam bahasa Indonesia terutama dapat dipahami sebagai belum pernah mendengar Dia berbicara. Konstruksi Yunani οὗ ... ἤκουσαν dalam alur argumentasi Paulus menunjuk pada mendengar tentang Dia melalui pemberitaan.
  - severity: low
    issue: '"Dia yang belum mereka percayai" kurang idiomatis dalam rangkaian pertama.'
    rationale: Bahasa Indonesia lebih alami memakai "jika mereka belum percaya kepada-Nya," sekaligus menyatakan hubungan logis yang dimaksud pertanyaan retoris.
