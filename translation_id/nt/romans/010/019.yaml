  text: ἀλλὰ λέγω, μὴ ⸂Ἰσραὴλ οὐκ ἔγνω⸃; πρῶτος Μωϋσῆς λέγει· Ἐγὼ παραζηλώσω ὑμᾶς ἐπ’ οὐκ ἔθνει, ἐπ’ ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/019.yaml
  text: But I ask[a], did Israel not know? First Moses says, “I will make you jealous by what is not a nation[b]; by a nation without understanding I will provoke you to anger.”
translation:
  language: id
  text: 'Namun, aku bertanya: Apakah Israel tidak mengetahui[a]? Musa lebih dahulu berkata, “Aku akan membuat kamu cemburu melalui apa yang bukan bangsa[b]; melalui bangsa yang tidak berpengertian Aku akan membuat kamu marah.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memahami”. Kata Yunani ini dapat berarti mengetahui atau memahami; dalam konteks ini, yang dimaksud mungkin menangkap makna dari apa yang telah didengar.
    reason: lexical_alternative
  - marker: b
    text: Kutipan dari Ulangan 32:21. “Apa yang bukan bangsa” dapat merujuk kepada suatu kelompok yang dianggap bukan bangsa sejati, yakni bangsa-bangsa bukan Yahudi.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ Ἰσραὴλ οὐκ ἔγνω
  choice: Apakah Israel tidak mengetahui?
  rationale: Mempertahankan arti dasar ἔγνω sebagai ‘mengetahui’ dan bentuk pertanyaan retoris Yunani, tanpa menutup kemungkinan nuansa ‘memahami’; nuansa itu dicatat dalam catatan kaki.
- source_word: πρῶτος Μωϋσῆς λέγει
  choice: Musa pertama-tama berkata
  rationale: Mengungkapkan fungsi adverbial πρῶτος secara alami dalam bahasa Indonesia sebagai saksi Kitab Suci pertama dalam rangkaian kutipan Paulus.
- source_word: παραζηλώσω ὑμᾶς
  choice: Aku akan membuat kamu cemburu
  rationale: Menyampaikan makna kausatif verba, yaitu membangkitkan kecemburuan pada pihak yang disapa; ‘kamu’ juga dapat merujuk kepada jamak dalam bahasa Indonesia.
- source_word: ἐπ’ οὐκ ἔθνει
  choice: melalui apa yang bukan bangsa
  rationale: Mempertahankan bentuk paradoksal dan ketidakjelasan rujukan dalam kutipan Ulangan 32:21, alih-alih langsung menafsirkannya sebagai bangsa-bangsa bukan Yahudi.
- source_word: ἐπ’ ἔθνει ἀσυνέτῳ
  choice: melalui bangsa yang tidak berpengertian
  rationale: Mencerminkan ἀσυνέτῳ secara lebih langsung daripada ‘bodoh’ serta mempertahankan kesejajaran dengan frasa sebelumnya.
- source_word: παροργιῶ ὑμᾶς
  choice: Aku akan membangkitkan amarahmu
  rationale: Menjaga nuansa kausatif verba Yunani dan menghasilkan ungkapan Indonesia yang wajar serta sejajar dengan ‘membuat kamu cemburu’.
theological_decisions:
- issue: Rujukan ‘apa yang bukan bangsa’ dan ‘bangsa yang tidak berpengertian’
  choice: Mempertahankan ungkapan kutipan tanpa menyebutkan rujukannya secara eksplisit dalam teks utama.
  alternative: Menafsirkannya langsung sebagai bangsa-bangsa bukan Yahudi atau sebagai kelompok yang dianggap Israel bukan bangsa sejati.
  rationale: Paulus mengutip Ulangan 32:21, tetapi teks kutipan sendiri tidak menamai rujukannya. Mempertahankan bahasanya menjaga ketegangan teologis dan tidak memasukkan tafsiran ke dalam teks.
- issue: Arti ἔγνω dalam pertanyaan mengenai Israel
  choice: Mengetahui, dengan kemungkinan ‘memahami’ dicatat dalam catatan kaki.
  alternative: Memahami.
  rationale: ‘Mengetahui’ mempertahankan arti leksikal yang luas dan ambiguitas asli, sedangkan konteks dapat memberi nuansa memahami atau menangkap makna berita yang telah didengar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Bentuk ‘aku’ dalam bingkai narasi Paulus dan ‘Aku’ dalam kutipan ilahi dibedakan melalui kapitalisasi. Ungkapan yang agak tajam ‘apa yang bukan bangsa’ sengaja dipertahankan karena merupakan ciri retoris sumber dan dijelaskan melalui catatan kaki.
