id: ROM.10.18
reference: Romans 10:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀλλὰ λέγω, μὴ οὐκ ἤκουσαν; μενοῦνγε· Εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν, καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/018.yaml
  text: 'But I ask[a], did they not hear? Indeed they did: “Their voice has gone out into all the earth[c][b], and their words to the ends of the inhabited world.”'
translation:
  language: id
  text: 'Namun aku bertanya, “Apakah mereka tidak mendengar?” Tentu saja mereka mendengar:


    “Suara[a] mereka telah tersebar ke seluruh bumi,[b]

    dan perkataan mereka sampai ke ujung-ujung dunia yang berpenghuni.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bunyi.”
    reason: lexical_alternative
  - marker: b
    text: Paulus mengutip Mazmur 19:4 dan menerapkan bahasanya pada tersebarnya berita yang diberitakan.
    reason: cross_reference
  - marker: c
    text: Atau cukup “dunia”; secara harfiah, “dunia yang berpenghuni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὐκ ἤκουσαν
  choice: Apakah mereka tidak mendengar?
  rationale: Pertanyaan retoris dengan μή οὐκ mengharapkan jawaban positif. Bentuk ini mempertahankan sifat retorisnya secara alami dalam bahasa Indonesia.
- source_word: μενοῦνγε
  choice: Tentu saja mereka mendengar
  rationale: Partikel ini memberi jawaban positif yang tegas. Kata kerja yang tersirat dibuat eksplisit agar jelas dan alami dalam bahasa Indonesia.
- source_word: φθόγγος
  choice: Suara
  rationale: Kata ini menunjuk pada bunyi atau suara yang terdengar. “Suara” selaras dengan “perkataan” pada baris berikutnya, sementara “bunyi” tetap dicatat sebagai alternatif.
- source_word: ἐξῆλθεν
  choice: telah tersebar
  rationale: Secara harfiah berarti “telah keluar/pergi ke luar”; dalam konteks suara yang menjangkau seluruh bumi, “telah tersebar” menyampaikan hasil penyebarannya secara wajar tanpa mengubah cakupannya.
- source_word: γῆ
  choice: bumi
  rationale: Dalam kutipan puitis yang bercakupan universal ini, “bumi” lebih tepat daripada “negeri” atau “tanah”.
- source_word: πέρατα
  choice: ujung-ujung
  rationale: Pilihan ini mempertahankan ungkapan puitis tentang bagian-bagian yang paling jauh.
- source_word: οἰκουμένης
  choice: dunia yang berpenghuni
  rationale: Terjemahan ini mempertahankan nuansa leksikal οἰκουμένη sebagai dunia yang dihuni, bukan sekadar bumi sebagai benda fisik.
- source_word: ῥήματα
  choice: perkataan
  rationale: Padanan langsung ini mempertahankan kesejajaran puitis dengan “suara” dan tidak mempersempit maknanya menjadi “pesan”.
theological_decisions:
- issue: Acuan kata ganti “mereka” dalam kutipan Mazmur yang diterapkan Paulus
  choice: Mempertahankan kata ganti “mereka” tanpa penjelasan interpretatif dalam teks utama
  alternative: Menjelaskannya sebagai langit dalam Mazmur 19 atau sebagai para pemberita Injil dalam penerapan Paulus
  rationale: Paulus mengutip bahasa Mazmur 19 dan menggunakannya dalam argumennya tentang tersebarnya berita. Mempertahankan kata ganti itu menjaga ambiguitas antarteks dan tidak memaksakan satu tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada argumentatif yang lugas dan kutipan puitis yang tetap bermartabat. Pengulangan “mereka mendengar” membuat jawaban tegas μενοῦνγε jelas bagi pembaca umum. Paralelisme antara “suara” dan “perkataan,” serta antara “seluruh bumi” dan “ujung-ujung dunia,” dipertahankan.
