  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/012.yaml
  text: For there is no distinction between Jew and Greek[a], for the same Lord is Lord of all[b], being rich toward all who call on him.
translation:
  language: id
  text: Sebab tidak ada perbedaan antara orang Yahudi dan orang Yunani[a], sebab Tuhan yang sama adalah Tuhan atas semua orang[b] dan kaya bagi semua orang yang berseru kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: “orang Yunani”; di sini pasangan Yahudi/Yunani berfungsi sebagai kontras antara orang Yahudi dan orang bukan Yahudi. Sebagian terjemahan memakai “orang bukan Yahudi.”'
    reason: lexical_alternative
  - marker: b
    text: Atau, “Tuhan yang sama adalah Tuhan semua orang.”
    reason: alternative_reading
lexical_decisions:
- source_word: διαστολή
  choice: perbedaan
  rationale: Kata ini menunjuk pada pembedaan antara dua kelompok. 'Perbedaan' alami dalam bahasa Indonesia dan mempertahankan pokok bahwa dalam hal yang sedang dibicarakan tidak dibuat pembedaan antara keduanya.
- source_word: Ἰουδαίου ... Ἕλληνος
  choice: orang Yahudi ... orang Yunani
  rationale: Teks Yunani secara harfiah menyebut 'Yunani'. Pasangan ini berfungsi sebagai kontras Yahudi/non-Yahudi, tetapi bentuk sumber dipertahankan dalam teks utama dan fungsinya dijelaskan dalam catatan kaki.
- source_word: ὁ ... αὐτὸς κύριος πάντων
  choice: Tuhan yang sama adalah Tuhan atas semua orang
  rationale: Pengulangan 'Tuhan' membuat klausa nominal Yunani jelas dan wajar dalam bahasa Indonesia. 'Atas semua orang' menyampaikan πάντων sekaligus mempertahankan kemungkinan nuansa kekuasaan Tuhan atas semuanya.
- source_word: κύριος
  choice: Tuhan
  rationale: Dalam konteks Roma 10, κύριος merupakan gelar kristologis yang kuat. 'Tuhan' mempertahankan resonansi teologis dan kaitannya dengan konteks serta kutipan Kitab Suci berikutnya.
- source_word: πλουτῶν
  choice: melimpahkan kekayaan-Nya
  rationale: Partisip ini menggambarkan Tuhan sebagai kaya atau berlimpah dalam kemurahan kepada mereka yang berseru kepada-Nya. Ungkapan ini mempertahankan metafora kekayaan sambil terdengar alami dalam bahasa Indonesia.
- source_word: εἰς πάντας
  choice: kepada semua orang
  rationale: Dengan πλουτῶν, εἰς menyatakan arah atau sasaran kelimpahan kemurahan itu. 'Kepada' menyampaikan arah tersebut secara alami.
- source_word: τοὺς ἐπικαλουμένους αὐτόν
  choice: semua orang yang berseru kepada-Nya
  rationale: Dalam konteks ini ἐπικαλέω berarti memanggil atau berseru kepada Tuhan dalam iman. 'Berseru kepada-Nya' jelas, lazim dalam bahasa Alkitab Indonesia, dan selaras dengan Roma 10:13.
theological_decisions:
- issue: Rujukan gelar 'Tuhan' dalam konteks
  choice: Terjemahan mempertahankan gelar 'Tuhan'; konteks Roma 10:9–13 mengarah kepada Yesus sebagai Tuhan sekaligus membawa gema Kitab Suci tentang berseru kepada Tuhan.
  alternative: Memahami sebutan ini sebagai rujukan umum kepada Allah tanpa penentuan kristologis.
  rationale: Tidak ditambahkan nama 'Yesus' ke dalam ayat karena tidak eksplisit dalam klausa ini. Dengan demikian, terjemahan membiarkan konteks menyatakan hubungan kristologis yang kuat tanpa menutup gema kutipan tentang Tuhan.
- issue: Cakupan 'semua orang'
  choice: '''Semua orang'' dibatasi oleh frasa ''yang berseru kepada-Nya''.'
  alternative: Membacanya sebagai pernyataan keselamatan tanpa syarat bagi setiap manusia.
  rationale: Sintaksis Yunani secara eksplisit menentukan penerima kelimpahan itu sebagai semua orang yang berseru kepada-Nya. Terjemahan mempertahankan baik keterbukaan lintas kelompok maupun pembatas partisipial tersebut.
- issue: Nuansa πάντων dalam hubungan dengan κύριος
  choice: '''Tuhan atas semua orang'' dipakai dalam teks utama.'
  alternative: '''Tuhan semua orang'' atau ''Tuhan dari semua orang''.'
  rationale: Bentuk 'atas semua orang' alami dalam bahasa Indonesia dan dapat menyampaikan pemerintahan universal, sedangkan catatan kaki mempertahankan alternatif yang lebih dekat pada konstruksi genitif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur sebab-akibat dipertahankan. Metafora πλουτῶν disampaikan secara dinamis sebagai 'melimpahkan kekayaan-Nya' agar alami, tanpa mengubah sasaran yang dibatasi oleh 'semua orang yang berseru kepada-Nya'.
