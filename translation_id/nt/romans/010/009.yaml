id: ROM.10.9
reference: Romans 10:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ἐὰν ⸀ὁμολογήσῃς ἐν τῷ στόματί ⸀σου κύριον Ἰησοῦν, καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/009.yaml
  text: because if you confess with your mouth that Jesus is Lord[a], and believe in your heart that God raised him from the dead, you will be saved.
translation:
  language: id
  text: karena jika kamu mengaku dengan mulutmu bahwa Yesus adalah Tuhan[a] dan percaya dalam hatimu bahwa Allah telah membangkitkan Dia dari antara orang mati, kamu akan diselamatkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengaku Yesus sebagai Tuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: karena
  rationale: Dalam konteks ini kata tersebut memperkenalkan alasan yang menjelaskan pernyataan sebelumnya.
- source_word: ὁμολογήσῃς ἐν τῷ στόματί σου
  choice: kamu mengaku dengan mulutmu
  rationale: Ungkapan ini mempertahankan unsur pengakuan lisan yang terbuka dan terdengar alami dalam bahasa Indonesia.
- source_word: κύριον Ἰησοῦν
  choice: bahwa Yesus adalah Tuhan
  rationale: Bentuk ini memperjelas isi pengakuan dan mempertahankan κύριος sebagai gelar 'Tuhan', bukan sekadar bagian dari nama.
- source_word: πιστεύσῃς ἐν τῇ καρδίᾳ σου
  choice: percaya dalam hatimu
  rationale: Terjemahan ini mempertahankan gambaran antropologis Alkitab tentang keyakinan batin tanpa parafrasa berlebihan.
- source_word: ὁ θεὸς αὐτὸν ἤγειρεν
  choice: Allah telah membangkitkan Dia
  rationale: Bentuk perfektif bahasa Indonesia menyampaikan tindakan kebangkitan yang telah terjadi dan tetap relevan dalam pengakuan iman ini.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Secara lebih jelas mencerminkan makna kebangkitan keluar dari kelompok orang-orang mati.
- source_word: σωθήσῃ
  choice: kamu akan diselamatkan
  rationale: Pasif masa depan ini berada dalam konteks keselamatan; 'diselamatkan' mempertahankan daya soteriologisnya.
theological_decisions:
- issue: Gelar κύριος dalam rumusan pengakuan
  choice: Tuhan
  alternative: Tuan/Penguasa
  rationale: '''Tuhan'' mempertahankan makna kewibawaan serta gema kuat Kitab Suci dalam konteks Roma 10.'
- issue: Bentuk pengakuan κύριον Ἰησοῦν
  choice: bahwa Yesus adalah Tuhan
  alternative: mengaku Yesus sebagai Tuhan
  rationale: Pilihan utama menyatakan isi pengakuan secara eksplisit tanpa mengubah frasa itu menjadi nama atau gelar majemuk 'Tuhan Yesus'.
- issue: Daya soteriologis σωθήσῃ
  choice: akan diselamatkan
  alternative: akan dilepaskan
  rationale: Konteksnya berbicara tentang keselamatan; terjemahan ini tidak mempersempit maupun melemahkan makna tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti orang kedua tunggal 'kamu' mengikuti sapaan tunggal dalam teks Yunani; 'Dia' dikapitalisasi menurut kebiasaan penerbitan Alkitab Indonesia.
