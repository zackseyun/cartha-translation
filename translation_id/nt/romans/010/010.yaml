  rationale: Revisi mengganti “sehingga memperoleh” dengan “yang membawa kepada” untuk menyatakan daya arah/hasil dari εἰς secara alami dalam bahasa Indonesia tanpa menambahkan gagasan bahwa iman atau pengakuan merupakan sarana untuk memperoleh sesuatu. Struktur pasangan antara hati/percaya/kebenaran dan mulut/mengaku/keselamatan dipertahankan.
