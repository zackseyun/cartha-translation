  text: καρδίᾳ γὰρ πιστεύεται εἰς δικαιοσύνην, στόματι δὲ ὁμολογεῖται εἰς σωτηρίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/010.yaml
  text: For with the heart one believes unto righteousness[a], and with the mouth one confesses unto salvation.
translation:
  language: id
  text: Sebab orang percaya dengan hati, yang membawa kepada kebenaran, dan orang mengaku dengan mulut, yang membawa kepada keselamatan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδίᾳ
  choice: dengan hati
  rationale: Mempertahankan datif instrumental serta penekanan pada batin manusia, sekaligus membentuk kesejajaran alami dengan 'dengan mulut'.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai bahwa ayat ini menjelaskan pernyataan sebelumnya.
- source_word: πιστεύεται
  choice: orang percaya
  rationale: Bentuk pasif/middle dipakai secara umum; ungkapan ini menyampaikan subjek generik secara wajar dalam bahasa Indonesia.
- source_word: εἰς δικαιοσύνην
  choice: sehingga memperoleh kebenaran
  rationale: Menyatakan arah atau hasil tanpa menentukan secara mekanistis hubungan teologisnya. 'Kebenaran' merupakan padanan baku dalam konteks Paulus, sementara kemungkinan arti 'keadilan' dicatat dalam catatan kaki.
- source_word: στόματι
  choice: dengan mulut
  rationale: Mempertahankan datif instrumental dan kesejajaran batin-lahir dengan 'dengan hati'.
- source_word: δὲ
  choice: dan
  rationale: Menghubungkan dua klausa yang saling melengkapi tanpa menyiratkan pertentangan kuat.
- source_word: ὁμολογεῖται
  choice: orang mengaku
  rationale: Menyampaikan bentuk umum yang sejajar dengan 'orang percaya' dan sesuai dengan konteks pengakuan bahwa Yesus adalah Tuhan pada ayat 9.
- source_word: εἰς σωτηρίαν
  choice: sehingga memperoleh keselamatan
  rationale: Mempertahankan kesejajaran dengan εἰς δικαιοσύνην dan menyatakan hasil atau tujuan tanpa memperluas urutan keselamatan yang tidak dijelaskan teks.
theological_decisions:
- issue: Hubungan percaya dan mengaku dengan kebenaran dan keselamatan
  choice: 'Menerjemahkan kedua klausa secara sejajar: percaya dengan hati sehingga memperoleh kebenaran, dan mengaku dengan mulut sehingga memperoleh keselamatan.'
  alternative: Menjadikan pengakuan hanya sebagai bukti keselamatan, atau sebagai perbuatan tambahan yang menghasilkan jasa untuk memperoleh keselamatan.
  rationale: Teks Yunani menyajikan dua klausa berpasangan dengan frasa εἰς yang sejajar. Terjemahan mempertahankan hubungan yang dinyatakan teks tanpa menetapkan urutan keselamatan secara mekanistis.
- issue: Cakupan δικαιοσύνη
  choice: kebenaran
  alternative: keadilan
  rationale: Dalam pemakaian Paulus, 'kebenaran' mempertahankan rentang makna forensik, relasional, dan etis secara lebih luas; alternatif leksikalnya tetap dicatat.
translation_notes:
  register: Bahasa Indonesia standar modern, wajar, dan bermartabat. Pengulangan 'orang' serta susunan 'dengan hati ... dengan mulut' dipertahankan untuk menampilkan struktur paralel ayat. Ungkapan 'sehingga memperoleh' dipilih sebagai padanan alami bagi εἰς yang menyatakan arah atau hasil.
