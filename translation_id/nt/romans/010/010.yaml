  naturalness: “Sebab orang percaya dengan hati, yang membawa kepada kebenaran, dan orang mengaku dengan mulut, yang membawa kepada keselamatan” adalah bahasa Indonesia modern yang wajar, tetap paralel, dan menyampaikan hubungan hasil/arah tanpa ungkapan “memperoleh” yang terlalu memperjelas.
