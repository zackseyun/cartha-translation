base_translation:
  language: en
  yaml_path: translation/nt/romans/010/020.yaml
  text: But Isaiah is very bold and says[a], “I was found by those who were not seeking me[b]; I became manifest to those who were not asking for me.”
translation:
  language: id
  text: Namun, Yesaya bahkan berani berkata, “Aku ditemukan oleh mereka yang tidak mencari Aku[a]; Aku menjadi nyata bagi mereka yang tidak menanyakan tentang Aku[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku ditemukan di antara mereka yang tidak mencari Aku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Aku menyatakan diri kepada mereka yang tidak menanyakan tentang Aku.”
    reason: idiomatic_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras dengan argumen dan kutipan sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ἀποτολμᾷ
  choice: bahkan berani
  rationale: Mengungkapkan keberanian yang mencolok dalam perkataan Yesaya, sekaligus mempertahankan bentuk kini yang menghidupkan pengantar kutipan.
- source_word: Εὑρέθην
  choice: Aku ditemukan
  rationale: Mempertahankan bentuk pasif aoristus dan rujukan ilahi orang pertama dalam kutipan.
- source_word: ἐν τοῖς ἐμὲ μὴ ζητοῦσιν
  choice: oleh mereka yang tidak mencari Aku
  rationale: Walaupun ἐν secara formal dapat berarti 'di antara', dalam konstruksi pasif ini frasa tersebut secara idiomatis menunjuk kepada orang-orang yang menemukan Allah.
- source_word: ζητοῦσιν
  choice: mencari
  rationale: Padanan langsung dan wajar yang mempertahankan gema religius ζητέω.
- source_word: ἐμφανὴς ἐγενόμην
  choice: Aku menyatakan diri
  rationale: Ungkapan Indonesia yang alami untuk tindakan menjadi nyata atau tampak bagi orang lain; catatan kaki mempertahankan alternatif yang lebih formal dan dekat dengan struktur Yunani.
- source_word: ἐπερωτῶσιν
  choice: menanyakan tentang Aku
  rationale: Menyampaikan arti bertanya atau mencari keterangan tanpa memasukkan arti teologis yang lebih khusus seperti 'berseru kepada'.
- source_word: Ἠσαΐας
  choice: Yesaya
  rationale: Mengikuti bentuk nama yang baku dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Cara menerjemahkan penyingkapan diri ilahi dalam kutipan Yesaya
  choice: Aku menyatakan diri kepada mereka yang tidak menanyakan tentang Aku
  alternative: Aku menjadi nyata bagi mereka yang tidak menanyakan tentang Aku
  rationale: Pilihan utama menghasilkan bahasa Indonesia yang alami tanpa menentukan lebih jauh cara penyingkapan itu terjadi. Alternatif yang lebih dekat dengan bentuk predikatif Yunani dicantumkan dalam catatan kaki agar nuansa tekstual tetap tersedia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada kata ganti 'Aku' membantu memperjelas bahwa pembicara dalam kutipan adalah Allah, sebagaimana konteks kutipan Yesaya. Semua alternatif yang mewakili ambiguitas leksikal penting dipertahankan dalam catatan kaki.
