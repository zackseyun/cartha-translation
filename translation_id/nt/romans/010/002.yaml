  yaml_path: translation/nt/romans/010/002.yaml
  text: For I testify about them that they have zeal for God[a], but not according to knowledge[b],
translation:
  language: id
  text: Sebab aku bersaksi tentang mereka bahwa mereka memiliki semangat untuk Allah[a], tetapi semangat itu tidak berdasarkan pengetahuan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "semangat Allah"; bentuk genitif Yunani dapat diterjemahkan lebih harfiah, tetapi dalam bahasa Indonesia frasa itu dapat berarti semangat yang dimiliki Allah. Dalam konteks ini, kemungkinan besar yang dimaksud ialah semangat yang diarahkan kepada Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau "tidak disertai pengetahuan penuh" atau "tidak sesuai dengan pengetahuan."
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: aku bersaksi
  rationale: Bentuk kini orang pertama tunggal ini menyatakan kesaksian Paulus secara langsung; pilihan ini alami sekaligus mempertahankan daya evidensial verba Yunani.
- source_word: γὰρ
  choice: Sebab
  rationale: Menjaga hubungan penjelasan dengan ayat sebelumnya dalam alur argumentasi Paulus.
- source_word: αὐτοῖς
  choice: tentang mereka
  rationale: Dalam konteks ini, datif menunjuk kepada orang-orang yang menjadi pokok kesaksian, bukan penerima kesaksian.
- source_word: ζῆλον θεοῦ
  choice: semangat bagi Allah
  rationale: Semangat merupakan padanan Indonesia yang jelas bagi ζῆλος dalam konteks pengabdian religius, sedangkan bagi Allah menyampaikan kemungkinan kuat bahwa genitif θεοῦ bersifat objektif, yaitu semangat yang diarahkan kepada Allah.
- source_word: ἔχουσιν
  choice: mereka memiliki
  rationale: Mencerminkan indikatif kini secara lugas dan wajar dalam bahasa Indonesia.
- source_word: ἀλλ’ οὐ κατ’ ἐπίγνωσιν
  choice: tetapi semangat itu tidak berdasarkan pengetahuan
  rationale: Pengulangan semangat itu memperjelas rujukan klausa eliptis dalam bahasa Indonesia, sementara tidak berdasarkan pengetahuan mempertahankan gagasan tolok ukur atau dasar tanpa menentukan secara berlebihan apakah pengetahuan itu terutama penuh, benar, atau mendalam.
theological_decisions:
- issue: Hakikat semangat Israel
  choice: Semangat mereka diarahkan kepada Allah, tetapi tidak berdasarkan pengetahuan.
  alternative: Mereka memiliki semangat yang berasal dari Allah, atau sekadar semangat religius tanpa objek yang dinyatakan.
  rationale: Konteks ayat-ayat berikutnya mendukung pembacaan θεοῦ sebagai genitif objektif. Terjemahan ini tetap mengakui kesungguhan mereka sekaligus mempertahankan kritik Paulus terhadap dasar pengetahuan mereka.
- issue: Nuansa ἐπίγνωσις
  choice: pengetahuan
  alternative: pengetahuan penuh; pengenalan yang benar
  rationale: Pengetahuan tidak mengunci teks pada salah satu perluasan makna yang mungkin, sehingga ketegangan mengenai kecukupan atau ketepatan pengetahuan tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata "semangat" lebih mudah dipahami pembaca umum daripada "kegairahan" atau "zelotisme". Pengulangan "semangat itu" diperlukan agar kontras eliptis Yunani terdengar alami dan tidak ambigu dalam bahasa Indonesia.
