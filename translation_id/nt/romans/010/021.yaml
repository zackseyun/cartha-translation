revisions:
- from: Namun, tentang Israel Ia berkata[a], “Sepanjang hari Aku telah mengulurkan tangan-Ku kepada bangsa yang tidak taat[b] dan membantah[c].”
  to: Namun, tentang Israel Ia berkata[a], “Sepanjang hari Aku mengulurkan tangan-Ku kepada umat yang tidak taat[b] dan menentang[c].”
  rationale: Revisi mengganti “bangsa ... membantah” dengan “umat ... menentang” agar padanan λαός dan ἀντιλέγοντα lebih idiomatis serta lebih dekat pada fungsi kedua partisip Yunani sebagai ciri orang yang terus melawan. Bentuk “Aku mengulurkan” tidak menambahkan aspek perfektif yang tidak ditandai oleh aoris Yunani, sambil tetap memungkinkan pembacaan duratif melalui “Sepanjang hari.” Ambiguitas πρός dan alternatif leksikal ἀπειθοῦντα dipertahankan dalam catatan kaki.
