  terminology: “Umat” untuk λαός sesuai dengan pemakaian korporat-keagamaan dalam kutipan kenabian ini dan menghindari nuansa kenegaraan yang lebih kuat pada “bangsa.” Kapitalisasi kata ganti ilahi dipertahankan sesuai register Alkitab Indonesia. Catatan untuk ἀντιλέγοντα perlu menghindari “menyangkal,” yang bukan padanan leksikal langsung dalam konteks ini.
