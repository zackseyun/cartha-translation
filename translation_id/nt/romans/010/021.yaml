id: ROM.10.21
reference: Romans 10:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν Ἰσραὴλ λέγει· Ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/021.yaml
  text: But concerning Israel he says[c][b][a], “All day long I have stretched out my hands to a disobedient and opposing people.”
translation:
  language: id
  text: Namun, tentang Israel Ia berkata[a], “Sepanjang hari Aku mengulurkan tangan-Ku kepada umat yang tidak taat[b] dan menentang[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Namun, kepada Israel Ia berkata.” Konstruksi Yunani dapat dipahami sebagai perkataan kepada Israel atau perkataan tentang Israel.
    reason: alternative_reading
  - marker: b
    text: “Tidak taat” juga dapat mengandung arti “tidak percaya” atau “enggan diyakinkan.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “membantah” atau “berkata melawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν Ἰσραὴλ
  choice: Namun, tentang Israel
  rationale: Konstruksi πρός dengan λέγει dapat memperkenalkan pihak yang dibicarakan, meskipun arti 'kepada Israel' juga mungkin; alternatif itu dipertahankan dalam catatan kaki.
- source_word: λέγει
  choice: Ia berkata
  rationale: Bentuk kini dipertahankan sebagai formula kutipan yang hidup. Subjek tersiratnya adalah Allah dalam konteks kutipan Yesaya, sehingga kata ganti hormat 'Ia' digunakan tanpa menambahkan nama yang tidak dinyatakan dalam ayat ini.
- source_word: Ὅλην τὴν ἡμέραν
  choice: Sepanjang hari
  rationale: Ungkapan Indonesia yang alami untuk akusatif durasi waktu dan mempertahankan kesan tindakan yang terus berlangsung.
- source_word: ἐξεπέτασα τὰς χεῖράς μου
  choice: Aku telah mengulurkan tangan-Ku
  rationale: Mempertahankan gambaran antropomorfis dalam teks serta relevansi tindakan ilahi yang berkelanjutan dalam kutipan.
- source_word: πρὸς λαὸν
  choice: kepada bangsa
  rationale: πρός menunjukkan arah uluran tangan. 'Bangsa' sesuai bagi kelompok kolektif Israel dalam konteks ini, tanpa menjadikannya istilah politik semata.
- source_word: ἀπειθοῦντα
  choice: yang tidak taat
  rationale: Mencakup penolakan yang bersifat kehendak dan moral; nuansa tidak percaya atau tidak mau diyakinkan dicatat sebagai alternatif.
- source_word: ἀντιλέγοντα
  choice: dan membantah
  rationale: Secara langsung mempertahankan unsur verbal dalam ἀντιλέγω, yakni berkata menentang atau membantah, sekaligus menunjukkan perlawanan aktif.
theological_decisions:
- issue: Penggambaran tanggapan Israel terhadap Allah
  choice: yang tidak taat dan membantah
  alternative: yang tidak percaya dan menentang
  rationale: 'Terjemahan mempertahankan dua unsur dalam kutipan: penolakan terhadap kehendak atau pesan Allah dan perlawanan aktif, tanpa memperluas pernyataan ini menjadi klaim doktrinal tentang status Israel di luar cakupan ayat.'
- issue: Apakah Allah berkata tentang atau kepada Israel
  choice: tentang Israel Ia berkata
  alternative: kepada Israel Ia berkata
  rationale: Tata bahasa Yunani memungkinkan hubungan topikal maupun arah ujaran. Teks utama memakai pembacaan topikal yang alami, sedangkan kemungkinan sapaan langsung dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi kata ganti ilahi mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Susunan kalimat dibuat alami sambil mempertahankan ambiguitas πρὸς δὲ τὸν Ἰσραὴλ melalui catatan kaki.
