id: ROM.10.4
reference: Romans 10:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/004.yaml
  text: For Messiah is the end of the law for righteousness to everyone who believes[a][b].
translation:
  language: id
  text: Sebab Mesias adalah akhir hukum Taurat[a], untuk mendatangkan kebenaran bagi setiap orang yang percaya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tujuan”, “puncak”, atau “penggenapan”. Kata Yunani yang diterjemahkan “akhir” dapat menunjuk pada berakhirnya sesuatu maupun pada tujuan atau puncaknya.
    reason: alternative_reading
  - marker: b
    text: Atau “keadilan” untuk “kebenaran” dalam pemakaian Paulus.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: akhir
  rationale: Kata Yunani ini dapat berarti titik akhir, tujuan, hasil, atau puncak. “Akhir” mempertahankan secara ringkas kemungkinan makna berakhir sekaligus membuka nuansa tujuan atau puncak melalui catatan kaki.
- source_word: νόμου
  choice: hukum Taurat
  rationale: Dalam konteks argumentasi Paulus tentang Israel, νόμος menunjuk pada Taurat sebagai kategori perjanjian yang sudah dikenal, bukan sekadar hukum secara umum.
- source_word: Χριστὸς
  choice: Mesias
  rationale: Di sini gelar tersebut berhubungan langsung dengan Taurat dan pengharapan perjanjian Israel, sehingga makna gelarnya lebih tepat ditampilkan daripada bentuk transliterasi “Kristus”.
- source_word: εἰς δικαιοσύνην
  choice: untuk mendatangkan kebenaran
  rationale: εἰς menyatakan arah, tujuan, atau hasil. Ungkapan ini menyampaikan daya tuju klausa dalam bahasa Indonesia yang wajar tanpa menentukan secara berlebihan apakah nuansanya terutama tujuan atau hasil.
- source_word: δικαιοσύνην
  choice: kebenaran
  rationale: “Kebenaran” merupakan padanan teologis yang lazim dalam pemakaian Paulus, sedangkan “keadilan” tetap dicatat sebagai kemungkinan leksikal.
- source_word: παντὶ τῷ πιστεύοντι
  choice: bagi setiap orang yang percaya
  rationale: Frasa datif ini menunjuk kepada semua orang yang menerima atau mengalami kebenaran tersebut; bentuk partisipelnya dipertahankan secara alami sebagai “yang percaya”.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memperkenalkan penjelasan bagi argumen sebelumnya; “Sebab” merupakan penghubung yang jelas dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna τέλος νόμου dalam hubungan Mesias dengan hukum Taurat
  choice: “akhir” dalam teks utama
  alternative: “tujuan”, “puncak”, atau “penggenapan” hukum Taurat
  rationale: Ungkapan Yunani dapat dipahami secara terminatif maupun teleologis. Teks utama tidak menetapkan salah satu tafsiran secara mutlak, dan catatan kaki mempertahankan ketegangan tersebut.
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Konteksnya menonjolkan hubungan Yesus dengan Taurat dan kisah perjanjian Israel, sehingga fungsi gelarnya tampak aktif.
- issue: Penerjemahan δικαιοσύνη
  choice: kebenaran
  alternative: keadilan
  rationale: “Kebenaran” mempertahankan istilah teologis yang lazim dalam surat-surat Paulus, sementara “keadilan” tetap merupakan kemungkinan semantis yang patut dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Susunan klausa dibuat alami bagi pembaca umum, sedangkan ambiguitas penting pada τέλος dipertahankan melalui “akhir” dan catatan kaki.
