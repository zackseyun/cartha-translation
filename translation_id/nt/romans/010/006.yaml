  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ δὲ ἐκ πίστεως δικαιοσύνη οὕτως λέγει· Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου· Τίς ἀναβήσεται εἰς τὸν οὐρανόν; τοῦτ’ ἔστιν Χριστὸν καταγαγεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/006.yaml
  text: 'But the righteousness from faith speaks in this way: “Do not say in your heart[a], ‘Who will ascend into heaven?’” (that is[c][b], to bring Messiah down).'
translation:
  language: id
  text: 'Namun, kebenaran yang berasal dari iman[a] berkata demikian: “Janganlah berkata dalam hatimu, ‘Siapakah yang akan naik ke surga?’”[c] (maksudnya, membawa Mesias[b] turun).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan yang berasal dari iman.” Kata Yunani δικαιοσύνη dapat mengandung makna “kebenaran” maupun “keadilan” dalam konteks ini.
    reason: lexical_alternative
  - marker: b
    text: Yunani “Kristus”; diterjemahkan “Mesias” di sini karena Χριστός berfungsi sebagai gelar.
    reason: lexical_alternative
  - marker: c
    text: Paulus menggemakan Ulangan 30:12 dan menerapkannya kepada Mesias.
    reason: cross_reference
lexical_decisions:
- source_word: δικαιοσύνη
  choice: kebenaran
  rationale: Dalam konteks Paulus, istilah ini mencakup keadaan atau kedudukan benar di hadapan Allah, sekaligus dapat bernuansa keadilan. “Kebenaran” paling wajar dalam bahasa Indonesia dan menjaga kesinambungan dengan konteks Roma.
- source_word: ἐκ πίστεως
  choice: yang berasal dari iman
  rationale: Mencerminkan secara cukup langsung sumber yang dinyatakan oleh ἐκ dan mempertahankan kontras dengan kebenaran yang didasarkan pada hukum Taurat dalam konteks sebelumnya.
- source_word: οὕτως λέγει
  choice: berkata demikian
  rationale: Ungkapan Indonesia yang alami dan tetap mempertahankan personifikasi kebenaran sebagai subjek yang berbicara.
- source_word: Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου
  choice: Janganlah berkata dalam hatimu
  rationale: Terjemahan dekat dengan ungkapan kutipan dari Ulangan dan mempertahankan makna perkataan batin atau pemikiran dalam diri.
- source_word: Τίς ἀναβήσεται εἰς τὸν οὐρανόν;
  choice: Siapakah yang akan naik ke surga?
  rationale: “Naik ke surga” merupakan padanan Indonesia yang jelas dan wajar bagi gerak yang dinyatakan oleh ἀναβήσεται dan εἰς.
- source_word: Χριστόν
  choice: Mesias
  rationale: Χριστός di sini berfungsi sebagai gelar dalam penjelasan mesianik Paulus atas kutipan Kitab Suci; “Mesias” menyampaikan arti gelarnya, sedangkan “Kristus” dicatat sebagai alternatif.
- source_word: καταγαγεῖν
  choice: untuk membawa ... turun
  rationale: Infinitif ini menjelaskan implikasi pertanyaan retoris sebelumnya. “Membawa turun” adalah padanan Indonesia yang alami dan mempertahankan arah geraknya.
theological_decisions:
- issue: Personifikasi kebenaran yang berasal dari iman
  choice: 'Dipertahankan: “kebenaran yang berasal dari iman berkata demikian”'
  alternative: “Inilah yang dikatakan tentang kebenaran berdasarkan iman”
  rationale: δικαιοσύνη merupakan subjek gramatikal λέγει. Mempertahankan personifikasi menjaga bentuk retoris Paulus dan tidak mengubahnya menjadi pernyataan abstrak.
- issue: Pemaknaan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam argumen yang menerapkan kutipan Kitab Suci kepada tokoh yang dijanjikan, istilah ini berfungsi secara jelas sebagai gelar. Catatan kaki mempertahankan bentuk tradisional “Kristus” sebagai alternatif leksikal.
- issue: Hubungan frasa penjelas τοῦτ’ ἔστιν Χριστὸν καταγαγεῖν dengan pertanyaan sebelumnya
  choice: 'Diterjemahkan sebagai penjelasan dalam tanda kurung: “maksudnya, untuk membawa Mesias turun”'
  alternative: “yaitu membawa Mesias turun”
  rationale: Bentuk kurung mempertahankan komentar penjelas Paulus tanpa menentukan lebih jauh siapa pelaku hipotetisnya atau mekanisme tindakan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa menjadi arkais. “Janganlah” mempertahankan nada larangan dalam kutipan Kitab Suci, sedangkan “berkata demikian” dan “maksudnya” menjaga alur yang mudah dipahami. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskannya.
