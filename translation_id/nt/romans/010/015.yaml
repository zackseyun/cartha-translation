  naturalness: «Bagaimanakah mereka akan memberitakan jika mereka tidak diutus?» dan «Seperti yang tertulis» lebih alami dalam bahasa Indonesia baku modern. Citra puitis dan pengulangan yang disengaja dalam «kabar baik tentang hal-hal yang baik» tetap dapat dipertahankan.
