id: ROM.10.15
reference: Romans 10:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πῶς δὲ ⸀κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; ⸀καθὼς γέγραπται· Ὡς ὡραῖοι οἱ πόδες τῶν ⸀εὐαγγελιζομένων ⸀τὰ ἀγαθά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/015.yaml
  text: And how are they to proclaim unless they are sent? As it is written[b][a], “How beautiful are the feet of those who bring good news of good things!”
translation:
  language: id
  text: Dan bagaimanakah mereka akan memberitakan jika mereka tidak diutus? Seperti yang tertulis, “Betapa indahnya[a] kaki orang-orang yang membawa kabar baik tentang hal-hal yang baik![b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Betapa menyenangkannya” atau “Betapa tepat waktunya”. Kata Yunani ini dapat menunjuk bukan hanya pada keindahan, tetapi juga pada kedatangan utusan yang menyenangkan, tepat, dan disambut baik.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, frasa ini berbunyi “orang-orang yang membawa kabar baik tentang hal-hal yang baik”; “hal-hal yang baik” menerjemahkan unsur tersendiri dalam bahasa Yunani.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξωσιν
  choice: memberitakan
  rationale: Kata ini menunjuk pada penyampaian berita secara terbuka. ‘Memberitakan’ cukup luas dan alami serta tidak membatasinya pada khotbah formal.
- source_word: ἀποσταλῶσιν
  choice: diutus
  rationale: Bentuk pasif ini mempertahankan gagasan bahwa para pemberita dikirim oleh pihak lain.
- source_word: καθὼς γέγραπται
  choice: Seperti ada tertulis
  rationale: Ungkapan baku dan bermartabat untuk memperkenalkan kutipan Kitab Suci.
- source_word: ὡραῖοι
  choice: indahnya
  rationale: Pilihan ini mempertahankan gambaran puitis tentang kaki para pembawa berita, sementara nuansa kedatangan yang menyenangkan, tepat, atau disambut dijelaskan dalam catatan kaki.
- source_word: πόδες
  choice: kaki
  rationale: Gambaran konkret dalam kutipan dipertahankan dan tidak diubah menjadi penjelasan abstrak tentang kedatangan para utusan.
- source_word: εὐαγγελιζομένων
  choice: orang-orang yang membawa kabar baik
  rationale: Frasa ini sesuai dengan gambaran para utusan yang datang sambil menyampaikan berita baik dan menghindari pembatasan pada jabatan gerejawi tertentu.
- source_word: τὰ ἀγαθά
  choice: tentang hal-hal yang baik
  rationale: Terjemahan ini mempertahankan unsur tersendiri ‘hal-hal yang baik’ dalam teks Yunani, meskipun menghasilkan pengulangan yang disengaja dengan ‘kabar baik’.
theological_decisions:
- issue: Hubungan kutipan tentang para utusan dengan pemberitaan Injil
  choice: Mempertahankan gambaran dari Yesaya tentang kedatangan para pembawa kabar yang disambut dengan sukacita tanpa membatasinya pada pelayanan khotbah yang ditahbiskan.
  alternative: Menerjemahkan kedua kata kerja dengan istilah ‘berkhotbah’ atau ‘memberitakan Injil’, yang dapat memberi kesan bahwa ayat ini hanya berbicara tentang pelayanan gerejawi formal.
  rationale: Alur pemikiran Paulus memang menyangkut pengutusan dan pemberitaan, tetapi kutipannya merayakan para pembawa kabar baik secara lebih luas. Terjemahan ini tidak memasukkan jabatan gerejawi tertentu ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang wajar dan bermartabat. Struktur pertanyaan retoris dan gambaran puitis tentang kaki dipertahankan. Pengulangan ‘kabar baik tentang hal-hal yang baik’ mengikuti susunan makna teks Yunani dan menjaga perbedaan antara tindakan membawa kabar baik dan isi kabar itu.
