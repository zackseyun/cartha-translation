  text: λέγει γὰρ ἡ γραφή· Πᾶς ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/011.yaml
  text: For the Scripture says[a], “Everyone who believes in him will not be put to shame.”
translation:
  language: id
  text: Sebab Kitab Suci berkata, “Setiap orang yang percaya kepadanya tidak akan dipermalukan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Siapa pun yang percaya kepadanya tidak akan merasa malu.”
    reason: Alternatif ini mencatat padanan generik lain bagi Πᾶς ὁ πιστεύων dan kemungkinan terjemahan idiomatis bagi καταισχυνθήσεται, sementara teks utama mempertahankan bentuk pasifnya.
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: 'Bentuk kini dalam rumusan kutipan secara wajar diterjemahkan dengan kala kini bahasa Indonesia: “Kitab Suci berkata.”'
- source_word: γὰρ
  choice: Sebab
  rationale: Kata penghubung ini memberikan dasar bagi pernyataan sebelumnya dan mempertahankan alur argumentasi Paulus.
- source_word: ἡ γραφή
  choice: Kitab Suci
  rationale: Dalam rumusan kutipan Paulus, istilah ini menunjuk pada tulisan suci yang berwibawa, bukan sekadar suatu tulisan.
- source_word: Πᾶς ὁ πιστεύων
  choice: Setiap orang yang percaya
  rationale: Ungkapan partisipial substantival ini bersifat umum dan mencakup siapa saja, bukan khusus laki-laki.
- source_word: ἐπ’ αὐτῷ
  choice: kepadanya
  rationale: Dengan πιστεύω, ἐπί + datif menyatakan kepercayaan yang diarahkan atau disandarkan kepada seseorang. “Percaya kepadanya” alami dalam bahasa Indonesia dan tetap mempertahankan bentuk pronominal sumber.
- source_word: οὐ καταισχυνθήσεται
  choice: tidak akan dipermalukan
  rationale: Pilihan ini mempertahankan bentuk pasif masa depan dan nuansa bahwa orang yang percaya tidak akan berakhir dalam kehinaan atau dipermalukan.
theological_decisions:
- issue: Cakupan Πᾶς ὁ πιστεύων
  choice: Setiap orang yang percaya
  alternative: Siapa pun yang percaya
  rationale: Maskulin tunggal Yunani berfungsi generik, sehingga tidak boleh dipersempit menjadi rujukan khusus kepada laki-laki.
- issue: Rujukan αὐτῷ
  choice: kepadanya
  alternative: kepada-Nya
  rationale: Konteks mengarahkan pronomina ini kepada tokoh yang menjadi sasaran iman dalam argumen Paulus. Bentuk pronominal dipertahankan tanpa menggantinya dengan nama atau menambahkan kapitalisasi kehormatan yang tidak ditandai dalam naskah Yunani.
- issue: Nuansa καταισχυνθήσεται
  choice: tidak akan dipermalukan
  alternative: tidak akan mendapat malu
  rationale: Bentuk pasif dipertahankan dalam teks utama tanpa menghapus ketegangan antara pengalaman malu dan tindakan dipermalukan; alternatif idiomatis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan hubungan sebab, rumusan kutipan Kitab Suci, cakupan universal, pronomina yang ambigu secara formal, dan bentuk pasif verba penutup.
