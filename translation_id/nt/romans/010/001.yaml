id: ROM.10.1
reference: Romans 10:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ ⸀δέησις πρὸς τὸν θεὸν ὑπὲρ ⸀αὐτῶν εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/001.yaml
  text: Brothers[a], the desire of my heart and my prayer to God for them is for their salvation.
translation:
  language: id
  text: Saudara-saudara[a], kerinduan hati saya dan doa saya kepada Allah bagi mereka adalah agar mereka diselamatkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Saudara-saudari”; bentuk Yunani yang dipakai adalah jamak maskulin, tetapi dapat menyapa kelompok yang terdiri dari laki-laki dan perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan vokatif jamak ini secara bentuk maskulin, tetapi dalam pemakaian jemaat dapat mencakup laki-laki dan perempuan. 'Saudara-saudara' merupakan sapaan Kristen yang alami dan bermartabat dalam bahasa Indonesia; cakupan inklusifnya dijelaskan dalam catatan kaki.
- source_word: εὐδοκία τῆς ἐμῆς καρδίας
  choice: kerinduan hati saya
  rationale: Dalam konteks ini εὐδοκία menunjuk pada keinginan atau dambaan Paulus. 'Kerinduan hati saya' menyampaikan kekuatan ungkapan tersebut secara alami tanpa mengubahnya menjadi sekadar 'kesenangan' atau 'perkenanan'.
- source_word: δέησις
  choice: doa
  rationale: Kata ini mengacu pada permohonan yang sungguh-sungguh. 'Doa' paling alami dalam konstruksi 'kepada Allah', dan unsur permohonannya jelas dari isi doa itu.
- source_word: πρὸς τὸν θεόν
  choice: kepada Allah
  rationale: πρός dengan akusatif menyatakan arah doa; 'kepada Allah' adalah padanan Indonesia yang langsung dan idiomatis.
- source_word: ὑπὲρ αὐτῶν
  choice: bagi mereka
  rationale: ὑπέρ menyatakan kepentingan atau manfaat pihak yang didoakan. 'Bagi mereka' mempertahankan hubungan itu secara ringkas, dan kata ganti 'mereka' tetap mengikuti bentuk teks Yunani tanpa menggantinya dengan referen eksplisit.
- source_word: εἰς σωτηρίαν
  choice: agar mereka diselamatkan
  rationale: εἰς menyatakan tujuan atau hasil yang diharapkan. Bentuk klausa ini alami dalam bahasa Indonesia dan menjelaskan bahwa keselamatan itulah tujuan kerinduan dan doa Paulus.
- source_word: μέν
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini memberi nuansa pengantar atau kontras ringan, tetapi tidak memiliki pasangan δέ yang eksplisit dalam ayat ini. Menambah 'memang' akan terasa kaku dan dapat memberi penekanan berlebih.
theological_decisions:
- issue: Cakupan sapaan Ἀδελφοί
  choice: Saudara-saudara
  alternative: Saudara-saudari
  rationale: Bentuk Yunani adalah maskulin jamak, tetapi sapaan ini kemungkinan ditujukan kepada seluruh jemaat yang mencakup laki-laki dan perempuan. Teks utama memakai bentuk sapaan Indonesia yang konvensional, sedangkan cakupan inklusifnya dicatat agar bentuk dan fungsi sama-sama terpelihara.
- issue: Hubungan εἰς σωτηρίαν dengan doa bagi mereka
  choice: agar mereka diselamatkan
  alternative: untuk keselamatan
  rationale: Konstruksi Yunani dapat dinyatakan secara lebih nominal, tetapi konteks menunjukkan bahwa keselamatan mereka adalah tujuan kerinduan dan doa Paulus. Terjemahan klausal membuat hubungan tersebut alami dalam bahasa Indonesia tanpa menetapkan rincian soteriologis yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pastoral dan bermartabat. 'Saya' dipilih agar alami bagi pembaca masa kini; pengulangan 'saya' menjaga kejelasan dua unsur yang sejajar, yaitu kerinduan dan doa. Catatan kaki mempertahankan keterangan tentang bentuk sapaan Yunani tanpa membebani teks utama.
