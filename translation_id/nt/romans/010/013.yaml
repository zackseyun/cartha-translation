  text: Πᾶς γὰρ ὃς ἂν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/013.yaml
  text: For everyone who calls on the name of the Lord will be saved[a][b].
translation:
  language: id
  text: Sebab setiap orang yang berseru kepada nama Tuhan akan diselamatkan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulus mengutip Yoel 2:32. Dalam Kitab Yoel, yang dimaksud ialah YHWH (“TUHAN”); dalam konteks ini Paulus menerapkan ayat tersebut kepada Yesus.
    reason: cross_reference
  - marker: b
    text: Ungkapan Yunani ini juga dapat diterjemahkan “memanggil nama Tuhan” atau “memohon kepada Tuhan dengan menyebut nama-Nya.” Maksudnya ialah menyeru atau memohon kepada Tuhan dalam doa dan pengakuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ... ὃς ἂν
  choice: setiap orang yang
  rationale: Gabungan ini menyatakan cakupan umum dan tanpa pengecualian. “Setiap orang yang” alami dalam bahasa Indonesia modern dan tidak membatasi rujukan pada laki-laki.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini menghubungkan ayat tersebut dengan pernyataan sebelumnya sebagai dasar atau dukungan dari Kitab Suci.
- source_word: ἐπικαλέσηται
  choice: berseru kepada
  rationale: Dalam ungkapan alkitabiah ini, verba tersebut berarti memanggil atau memohon kepada Tuhan dalam doa, pengakuan, atau permohonan. “Berseru kepada” mempertahankan daya ungkap dan latar kutipan dari Yoel.
- source_word: τὸ ὄνομα
  choice: nama
  rationale: Terjemahan harfiah mempertahankan ungkapan alkitabiah yang menunjuk pada pribadi, identitas, dan wewenang yang diseru.
- source_word: κυρίου
  choice: Tuhan
  rationale: Menerjemahkan κύριος secara langsung tanpa menambahkan “Yesus” ke dalam teks utama, sehingga wording Yunani dan hubungan dengan kutipan Yoel tetap terpelihara.
- source_word: σωθήσεται
  choice: akan diselamatkan
  rationale: Bentuk pasif futur ini dalam konteks Roma menyatakan keselamatan, bukan sekadar pertolongan sementara.
theological_decisions:
- issue: Rujukan “Tuhan” dalam kutipan Yoel yang digunakan Paulus
  choice: Mempertahankan “Tuhan” dalam teks utama, sambil menjelaskan dalam catatan bahwa konteks Roma menerapkannya kepada Yesus.
  alternative: TUHAN; Tuhan Yesus
  rationale: Teks Yunani berbunyi κυρίου. Dalam Yoel, rujukannya adalah YHWH, sedangkan konteks langsung Roma 10 mengaitkan pengakuan dan seruan itu dengan Yesus. Terjemahan utama tidak memperluas teks, dan catatan mempertahankan ketegangan intertekstual serta makna kristologisnya.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Berseru kepada nama Tuhan” dipilih untuk mempertahankan idiom alkitabiah sekaligus tetap mudah dipahami. Penanda catatan [a] dan [b] dicantumkan dalam teks utama.
