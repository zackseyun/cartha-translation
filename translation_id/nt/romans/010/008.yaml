id: ROM.10.8
reference: Romans 10:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει; Ἐγγύς σου τὸ ῥῆμά ἐστιν, ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ’ ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/008.yaml
  text: But what does it say? “The word is near you[a], in your mouth and in your heart” — that is[b], the word of faith that we proclaim.
translation:
  language: id
  text: Tetapi, apa katanya? “Firman itu dekat kepadamu, di mulutmu dan di hatimu.”[a] Yang dimaksud ialah firman iman[b] yang kami beritakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulus menggemakan Ulangan 30:14 dan menerapkan bahasanya pada berita yang kami beritakan.
    reason: cross_reference
  - marker: b
    text: Ungkapan ini juga dapat diterjemahkan “berita iman” atau “berita tentang iman”. Kata Yunani yang diterjemahkan “iman” dalam konteks lain dapat berarti “kepercayaan” atau “kesetiaan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan dengan uraian sebelumnya secara alami dalam bahasa Indonesia tanpa memperkeras kontras.
- source_word: τί λέγει
  choice: apa katanya?
  rationale: Mempertahankan subjek tersirat dalam bahasa Yunani dan tidak menambahkan kata “Kitab Suci” ke dalam teks utama.
- source_word: Ἐγγύς σου
  choice: dekat kepadamu
  rationale: Mempertahankan gambaran kedekatan dalam kutipan dengan susunan yang wajar dan ringkas.
- source_word: τὸ ῥῆμα
  choice: firman
  rationale: “Firman” sesuai dengan konteks kutipan Kitab Suci dan dapat pula menunjuk kepada berita yang diberitakan Paulus; pengulangan istilahnya dipertahankan.
- source_word: ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου
  choice: di mulutmu dan di hatimu
  rationale: Mempertahankan gambaran tubuh dan batin dari sumber dengan ungkapan Indonesia yang lugas.
- source_word: τοῦτ’ ἔστιν
  choice: Yang dimaksud ialah
  rationale: Menunjukkan bahwa Paulus sedang menjelaskan penerapan kutipan tersebut, tanpa menyatakan bahwa ia sekadar memberikan padanan kata.
- source_word: τὸ ῥῆμα τῆς πίστεως
  choice: firman iman
  rationale: Mempertahankan hubungan leksikal dengan ῥῆμα sebelumnya serta kekompakan dan kemungkinan nuansa genitif Yunani, tanpa menentukan secara sempit apakah iman merupakan isi, ciri, atau tanggapan terhadap firman itu.
- source_word: ὃ κηρύσσομεν
  choice: yang kami beritakan
  rationale: Menyampaikan tindakan pengumuman publik κηρύσσω dalam bahasa Indonesia yang alami dan mudah dipahami.
theological_decisions:
- issue: Makna πίστεως dalam τὸ ῥῆμα τῆς πίστεως
  choice: iman
  alternative: kepercayaan; kesetiaan; atau secara lebih interpretatif, berita tentang iman
  rationale: “Iman” merupakan padanan utama yang sesuai dengan pemakaian Paulus di konteks ini. Bentuk “firman iman” mempertahankan ketegangan mengenai hubungan tepat antara firman dan iman, sedangkan kemungkinan leksikal lain dicatat tanpa dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Diksi “firman” mempertahankan gema kutipan Kitab Suci dan kaitannya dengan pemberitaan Paulus; bentuk yang padat sengaja dipertahankan, sementara alternatif yang lebih menjelaskan ditempatkan dalam catatan kaki.
