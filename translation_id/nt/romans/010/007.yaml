base_translation:
  language: en
  yaml_path: translation/nt/romans/010/007.yaml
  text: or[a], “Who will descend into the abyss?” (that is[b], to bring Messiah up from the dead).
translation:
  language: id
  text: atau, “Siapakah yang akan turun ke jurang tak berdasar[a]?” (maksudnya, untuk membawa Mesias[b] naik dari antara orang mati).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kedalaman.” Paulus menggemakan Ulangan 30:13, tetapi di sini ia memakai kata “jurang tak berdasar” dan menerapkannya pada tindakan membawa Mesias naik dari antara orang mati.
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “Kristus.” Di sini Χριστός diterjemahkan “Mesias” karena berfungsi sebagai gelar.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤ
  choice: atau
  rationale: Kata penghubung ini memperkenalkan pertanyaan retoris kedua dalam rangkaian kutipan dan paling wajar diterjemahkan secara ringkas sebagai “atau”.
- source_word: Τίς καταβήσεται
  choice: Siapakah yang akan turun
  rationale: Mempertahankan bentuk pertanyaan retoris dan makna futurum dari verba Yunani dalam bahasa Indonesia yang alami serta bermartabat.
- source_word: εἰς τὴν ἄβυσσον
  choice: ke jurang tak berdasar
  rationale: Mengungkapkan gambaran kedalaman tak terukur dari ἄβυσσος tanpa mempersempitnya menjadi kubur, alam orang mati, atau Hades.
- source_word: τοῦτ’ ἔστιν
  choice: maksudnya
  rationale: Formula penjelas ini lebih alami dalam bahasa Indonesia sebagai “maksudnya” daripada terjemahan harfiah “yaitu” dalam susunan kalimat ini.
- source_word: Χριστόν
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar bagi Yang Diurapi; “Mesias” menyampaikan makna gelar itu dan bukan sekadar mentransliterasikannya.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Terjemahan ini mempertahankan nuansa bahwa Mesias dibawa naik dari tengah-tengah mereka yang mati.
- source_word: ἀναγαγεῖν
  choice: untuk membawa ... naik
  rationale: Mempertahankan citra ruang yang berpasangan dengan tindakan turun; “membangkitkan” akan menyatakan konsep kebangkitan secara lebih langsung daripada verba Yunani itu sendiri.
theological_decisions:
- issue: Pemaknaan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks penjelasan teologis ini, Χριστός memiliki daya gelar yang jelas. “Mesias” menyampaikan arti gelar tersebut tanpa menjadikannya seolah-olah nama diri.
- issue: Identitas dan cakupan ἄβυσσος
  choice: jurang tak berdasar
  alternative: kedalaman; alam orang mati; Hades
  rationale: Teks mempertahankan citra metaforis yang menggemakan Ulangan 30 dan menghubungkannya dengan membawa Mesias naik dari antara orang mati. Terjemahan tidak menyamakan jurang itu secara sempit dengan kubur, Hades, atau alam orang mati.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam bermartabat dan mudah dipahami. Bentuk “atau” diawali huruf kecil karena ayat ini melanjutkan kalimat dari ayat sebelumnya. Citra turun/naik dan ketegangan metaforis teks sumber dipertahankan.
