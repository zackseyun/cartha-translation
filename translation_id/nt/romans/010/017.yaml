revisions:
- from: Jadi, iman timbul dari mendengar, dan mendengar melalui firman Mesias.[a]
  to: Jadi, iman timbul dari pendengaran, dan pendengaran terjadi melalui firman Mesias.[a]
  rationale: The revision replaces the verbal noun “mendengar” with “pendengaran” in both occurrences to reflect the repeated Greek noun ἀκοή and to improve natural Indonesian syntax. It adds “terjadi” in the second clause only to make the implied relation explicit and readable; it does not alter the meaning or resolve the genitive ambiguity.
  reviewer_model: gpt-5.6-terra
