  text: ἄρα ἡ πίστις ἐξ ἀκοῆς, ἡ δὲ ἀκοὴ διὰ ῥήματος ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/017.yaml
  text: So faith comes from hearing[a], and hearing through the word of Messiah.
translation:
  language: id
  text: Jadi, iman timbul dari pendengaran, dan pendengaran terjadi melalui firman Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “firman tentang Mesias” atau “pesan mengenai Mesias.” Bentuk genitif dalam bahasa Yunani dapat dipahami dengan lebih dari satu cara.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα
  choice: Jadi
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya dengan penghubung yang alami dalam bahasa Indonesia modern.
- source_word: πίστις
  choice: iman
  rationale: Dalam konteks Roma 10:14–16, kata ini menunjuk pada tanggapan percaya terhadap berita yang diberitakan, bukan terutama pada kesetiaan.
- source_word: ἐξ ἀκοῆς
  choice: timbul dari mendengar
  rationale: ἐκ menyatakan sumber atau asal; kata kerja 'timbul' ditambahkan secara wajar untuk mengungkapkan klausa Yunani yang tidak memiliki verba tersurat.
- source_word: ἀκοή
  choice: mendengar
  rationale: ἀκοή dapat menunjuk pada tindakan mendengar ataupun apa yang didengar. 'Mendengar' mempertahankan kaitan langsung dengan konteks sebelumnya, yang berbicara tentang orang mendengar pemberitaan.
- source_word: δὲ
  choice: dan
  rationale: Di sini δέ melanjutkan pemikiran dengan lembut, bukan menyatakan pertentangan kuat.
- source_word: διὰ
  choice: melalui
  rationale: διά dengan bentuk genitif menyatakan sarana atau perantaraan.
- source_word: ῥήματος
  choice: firman
  rationale: ῥῆμα menunjuk pada perkataan atau ujaran yang disampaikan. 'Firman' mempertahankan bobot istilah tersebut dan tetap lazim dalam bahasa Indonesia Alkitabiah.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar dan diterjemahkan 'Mesias'. Hubungan genitif dengan ῥήματος dibiarkan ringkas sebagai 'firman Mesias' agar tidak menutup kemungkinan maknanya.
theological_decisions:
- issue: Makna πίστις dalam konteks ini
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Konteks langsung membahas tanggapan manusia terhadap kabar baik yang diberitakan dan didengar, sehingga 'iman' paling tepat tanpa memasukkan pengertian yang lebih khusus.
- issue: Hubungan Χριστοῦ dengan ῥήματος
  choice: firman Mesias
  alternative: firman tentang Mesias; pesan mengenai Mesias
  rationale: Bentuk genitif Yunani dapat dipahami sebagai firman yang berasal dari atau dimiliki Mesias, maupun sebagai firman yang isinya mengenai Mesias. Teks utama mempertahankan susunan yang relatif terbuka, sedangkan kemungkinan objektif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pengulangan 'mendengar' dipertahankan untuk mencerminkan pengulangan ἀκοή dalam teks Yunani, sementara 'firman Mesias' mempertahankan ambiguitas hubungan genitif.
