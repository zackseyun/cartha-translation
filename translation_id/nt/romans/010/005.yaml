  text: Μωϋσῆς γὰρ γράφει ⸂ὅτι τὴν δικαιοσύνην τὴν ἐκ ⸀τοῦ νόμου⸃ ὁ ⸀ποιήσας ἄνθρωπος ζήσεται ἐν ⸀αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/005.yaml
  text: 'For Moses writes about the righteousness that is from the law: the man who does these things will live by them[a][b][c].'
translation:
  language: id
  text: 'Sebab Musa menulis tentang kebenaran[a] yang berasal dari hukum Taurat: “Orang yang melakukannya akan hidup di dalamnya.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan” untuk kata Yunani δικαιοσύνη.
    reason: lexical_alternative
  - marker: b
    text: Atau “akan hidup olehnya.” Paulus menggemakan Imamat 18:5. Kata ganti Yunani berbentuk tunggal feminin dan secara gramatikal merujuk kepada “kebenaran.”
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai hubungan penjelasan dengan uraian sebelumnya dan tetap alami dalam bahasa Indonesia.
- source_word: γράφει
  choice: menulis
  rationale: Mempertahankan bentuk kini dalam rumusan pengutipan Kitab Suci secara wajar dalam bahasa Indonesia.
- source_word: δικαιοσύνην
  choice: kebenaran
  rationale: Dalam konteks Paulus, istilah ini menunjuk pada keadaan atau kedudukan benar dan mempertahankan kaitannya dengan kontras antara kebenaran dari hukum Taurat dan kebenaran dari iman.
- source_word: τὴν ἐκ τοῦ νόμου
  choice: yang berasal dari hukum Taurat
  rationale: ἐκ menyatakan sumber atau asal; frasa ini mempertahankan kontras yang dibangun Paulus.
- source_word: νόμου
  choice: hukum Taurat
  rationale: Dalam konteks ini νόμος merujuk pada hukum Musa; 'hukum Taurat' merupakan ungkapan Indonesia yang jelas dan lazim.
- source_word: ὁ ποιήσας ἄνθρωπος
  choice: Orang yang melakukannya
  rationale: Mengungkapkan satu manusia secara representatif tanpa menambahkan pembedaan gender yang tidak dimiliki kata 'orang' dalam bahasa Indonesia; enklitik '-nya' merujuk pada kebenaran yang berasal dari hukum Taurat.
- source_word: ζήσεται
  choice: akan hidup
  rationale: Menerjemahkan bentuk futur secara langsung dan mempertahankan gema janji dalam Imamat 18:5.
- source_word: ἐν αὐτῇ
  choice: olehnya
  rationale: Menyampaikan arti instrumental yang wajar dalam konteks, sambil mempertahankan rujukan tunggal feminin kepada 'kebenaran'; arti lebih harfiah 'di dalamnya' dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna δικαιοσύνη dalam kontras Paulus
  choice: kebenaran
  alternative: keadilan
  rationale: '''Kebenaran'' mempertahankan bobot relasional dan forensik istilah ini serta kaitannya dengan pembahasan Paulus tentang kebenaran dari iman; ''keadilan'' tetap dicatat sebagai kemungkinan leksikal.'
- issue: Rujukan dan fungsi ἐν αὐτῇ
  choice: olehnya
  alternative: di dalamnya
  rationale: Bentuk Yunani adalah tunggal dan secara gramatikal merujuk kepada 'kebenaran'. 'Olehnya' dapat menyatakan sarana hidup tanpa mengubahnya menjadi bentuk jamak, sedangkan 'di dalamnya' mempertahankan bentuk preposisional secara lebih harfiah. Gema Imamat 18:5 menjelaskan latar ungkapan itu tanpa memaksa teks Paulus menjadi jamak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Hukum Taurat' dipakai agar rujukan kepada hukum Musa jelas. Susunan kutipan dibuat alami tanpa menghilangkan hubungan gramatikal antara tindakan, kebenaran dari hukum Taurat, dan hidup.
