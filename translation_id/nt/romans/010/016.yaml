id: ROM.10.16
reference: Romans 10:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πάντες ὑπήκουσαν τῷ εὐαγγελίῳ· Ἠσαΐας γὰρ λέγει· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/016.yaml
  text: But not all obeyed the good news[a]. For Isaiah says, “Lord[b], who has believed our message?”
translation:
  language: id
  text: Namun, tidak semua orang menaati kabar baik[a] itu. Sebab Yesaya berkata, “Tuhan, siapakah yang telah percaya kepada berita kami[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Injil.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pemberitaan kami”; secara harfiah, “pendengaran kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Namun
  rationale: Menandai pertentangan dengan uraian sebelumnya dalam ragam tulis Indonesia yang alami dan bermartabat.
- source_word: οὐ πάντες
  choice: tidak semua orang
  rationale: Mempertahankan negasi parsial bahasa Yunani dan tidak menyiratkan bahwa tidak seorang pun menanggapi.
- source_word: ὑπήκουσαν
  choice: menaati
  rationale: ὑπακούω menyatakan ketaatan, bukan sekadar mendengar; pilihan ini mempertahankan kuatnya tanggapan yang dituntut oleh kabar baik.
- source_word: τῷ εὐαγγελίῳ
  choice: kabar baik itu
  rationale: εὐαγγέλιον secara leksikal berarti kabar baik; kata penunjuk 'itu' membuat artikelnya alami dalam bahasa Indonesia. Istilah tradisional 'Injil' dicantumkan sebagai alternatif.
- source_word: Ἠσαΐας
  choice: Yesaya
  rationale: Bentuk baku nama nabi tersebut dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: Memperlihatkan bahwa kutipan Yesaya memberi dasar bagi pernyataan sebelumnya.
- source_word: λέγει
  choice: berkata
  rationale: Mempertahankan bentuk kini dalam bahasa sumber dengan ungkapan Indonesia yang lazim ketika Kitab Suci dikutip sebagai suara yang tetap berbicara.
- source_word: Κύριε
  choice: Tuhan
  rationale: Padanan baku dan wajar untuk sapaan κύριε dalam konteks doa atau seruan kepada Allah.
- source_word: τίς
  choice: siapakah
  rationale: Bentuk interogatif yang sesuai dengan ragam kutipan yang bermartabat.
- source_word: ἐπίστευσεν
  choice: telah percaya
  rationale: Menyampaikan tindakan percaya yang dipandang telah terjadi dan relevan bagi argumen Paulus saat ini.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: berita kami
  rationale: ἀκοή dapat menunjuk pada apa yang didengar, yakni berita atau pemberitaan. 'Berita kami' alami dalam konteks kutipan Yesaya, sementara arti harfiahnya dijelaskan dalam catatan.
theological_decisions:
- issue: Sifat tanggapan terhadap kabar baik dalam ὑπήκουσαν τῷ εὐαγγελίῳ
  choice: menaati kabar baik itu
  alternative: mendengarkan atau mengindahkan kabar baik itu
  rationale: Kata kerja Yunani secara eksplisit mengandung gagasan ketaatan. Terjemahan ini menjaga hubungan yang dibuat Paulus antara iman dan tanggapan taat tanpa menetapkan suatu sistem denominasi mengenai keselamatan.
- issue: Makna ἀκοή dalam kutipan Yesaya
  choice: berita kami
  alternative: pemberitaan kami; apa yang kami dengar; pendengaran kami
  rationale: Kata itu dapat berarti tindakan mendengar maupun isi yang didengar. Dalam kutipan ini, arti isi berita paling alami, tetapi catatan mempertahankan keluasan leksikal dan arti harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur kontras dan penjelasan dipertahankan melalui 'Namun' dan 'Sebab'. Semua penanda catatan kaki muncul dalam teks utama.
