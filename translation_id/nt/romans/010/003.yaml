  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀγνοοῦντες γὰρ τὴν τοῦ θεοῦ δικαιοσύνην, καὶ τὴν ⸀ἰδίαν ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ θεοῦ οὐχ ὑπετάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/003.yaml
  text: For[a], being ignorant of the righteousness of God and seeking to establish their own[b], they did not submit to the righteousness of God.
translation:
  language: id
  text: Sebab mereka, karena tidak mengetahui kebenaran Allah[a][b] dan berusaha menegakkan kebenaran mereka sendiri, tidak tunduk kepada kebenaran Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan”, pada kedua kemunculan eksplisit kata Yunani δικαιοσύνη. Dalam tulisan Paulus, kata ini dapat menunjuk pada kebenaran, keadilan, keadaan benar, atau cara Allah menjadikan manusia benar.
    reason: lexical_alternative
  - marker: b
    text: Frasa “kebenaran Allah” juga dapat dipahami sebagai “kebenaran dari Allah” atau “kebenaran yang menjadi milik atau sifat Allah”. Susunan bahasa Yunani memungkinkan lebih dari satu nuansa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοοῦντες
  choice: tidak mengetahui
  rationale: Partisipel kini ini menyatakan keadaan yang menjadi alasan kegagalan mereka. Frasa ini mempertahankan arti kurangnya pengetahuan atau pengenalan tanpa menambahkan bahwa penolakan itu sejak awal disengaja.
- source_word: γὰρ
  choice: Sebab
  rationale: Konjungsi ini menjelaskan pernyataan pada ayat sebelumnya. “Sebab” menyampaikan hubungan penjelas tersebut secara wajar dalam bahasa Indonesia.
- source_word: δικαιοσύνην / δικαιοσύνῃ
  choice: kebenaran
  rationale: Dalam konteks Paulus, “kebenaran” merupakan padanan yang luas dan lazim untuk δικαιοσύνη, yang di sini dapat mencakup keadaan benar serta cara Allah membenarkan manusia. Kemungkinan arti “keadilan” dipertahankan dalam catatan kaki.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: 'Susunan “kebenaran Allah” mempertahankan kepadatan dan ambiguitas genitif Yunani: kebenaran itu dapat dipahami sebagai milik atau sifat Allah, berasal dari Allah, atau menunjuk pada tindakan penyelamatan-Nya yang benar.'
- source_word: ἰδίαν
  choice: kebenaran mereka sendiri
  rationale: Kata sifat ini berdiri secara eliptis dengan δικαιοσύνη yang dipahami dari frasa sebelumnya. Pengulangan “kebenaran” diperlukan agar kalimat bahasa Indonesia jelas dan alami.
- source_word: ζητοῦντες
  choice: berusaha
  rationale: Partisipel kini ini menggambarkan upaya yang sedang mereka lakukan. “Berusaha” lebih alami daripada terjemahan harfiah “mencari” ketika diikuti tindakan “menegakkan”.
- source_word: στῆσαι
  choice: menegakkan
  rationale: Dalam konteks ini infinitif dari ἵστημι berarti mendirikan, menetapkan, atau membuat sesuatu berlaku. “Menegakkan” cocok untuk upaya memberlakukan kebenaran mereka sendiri.
- source_word: ὑπετάγησαν
  choice: tidak tunduk
  rationale: Bentuk pasif aoristus ini memiliki nuansa medial dalam konteks. “Tidak tunduk” menyampaikan bahwa mereka tidak menempatkan diri di bawah kebenaran Allah tanpa membuat struktur bahasa Indonesia menjadi kaku.
theological_decisions:
- issue: Makna frasa “kebenaran Allah” dalam pemakaian Paulus
  choice: Dipertahankan sebagai “kebenaran Allah” tanpa menentukan satu arti genitif saja.
  alternative: “kebenaran dari Allah”; “kebenaran yang menjadi sifat Allah”; atau “tindakan benar Allah yang menyelamatkan”
  rationale: Frasa Yunani dapat memuat beberapa nuansa sekaligus—kepunyaan atau sifat, sumber, dan karya penyelamatan Allah. Terjemahan utama mempertahankan ketegangan teologis itu, sedangkan catatan kaki menyebutkan kemungkinan-kemungkinannya.
- issue: Hubungan antara “kebenaran mereka sendiri” dan kebenaran Allah
  choice: Upaya mereka digambarkan sebagai menegakkan kebenaran mereka sendiri, lalu tidak tunduk kepada kebenaran Allah.
  alternative: Menafsirkan secara eksplisit kebenaran mereka sebagai kebenaran berdasarkan hukum atau usaha manusia.
  rationale: Ayat ini sendiri tidak menyebut hukum, jasa, atau perbuatan secara langsung. Terjemahan tidak memasukkan penjelasan doktrinal yang baru dinyatakan lebih luas dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat langsung dan mudah dipahami, sementara pengulangan “kebenaran Allah” dipertahankan untuk mencerminkan penekanan teks Yunani. Istilah “kebenaran” dipilih karena paling alami dalam wacana Paulus, dengan alternatif leksikal dan ambiguitas teologis dijelaskan melalui catatan kaki.
