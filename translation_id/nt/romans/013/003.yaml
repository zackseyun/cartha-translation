  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ γὰρ ἄρχοντες οὐκ εἰσὶν φόβος ⸂τῷ ἀγαθῷ ἔργῳ⸃ ἀλλὰ ⸂τῷ κακῷ⸃. θέλεις δὲ μὴ φοβεῖσθαι τὴν ἐξουσίαν; τὸ ἀγαθὸν ποίει, καὶ ἕξεις ἔπαινον ἐξ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/003.yaml
  text: For rulers are not a terror to good conduct[a], but to bad. But if you do not want to fear the authority, do what is good[c][b], and you will have praise from it.
translation:
  language: id
  text: Sebab para penguasa tidak perlu ditakuti karena perbuatan baik, melainkan karena perbuatan jahat.[a] Namun, apakah kamu ingin tidak takut kepada otoritas itu? Lakukanlah apa yang baik, dan kamu akan menerima pujian darinya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “bagi perbuatan yang baik, melainkan bagi yang jahat.” Bentuk Yunani mengontraskan perbuatan baik dengan yang jahat dalam arti etis.'
    reason: lexical_alternative
  - marker: b
    text: “Darinya” merujuk kepada “otoritas itu,” yaitu otoritas pemerintahan.
    reason: referent_clarification
lexical_decisions:
- source_word: οἱ ἄρχοντες
  choice: para penguasa
  rationale: Menunjuk kepada orang-orang yang memerintah atau memegang jabatan pemerintahan; bentuk jamaknya dipertahankan tanpa mempersempit jenis jabatan.
- source_word: φόβος
  choice: sesuatu yang menakutkan
  rationale: Sebagai predikat, kata ini menggambarkan para penguasa sebagai penyebab atau objek ketakutan. Ungkapan ini alami dalam bahasa Indonesia dan tidak mengubahnya menjadi tindakan meneror.
- source_word: τῷ ἀγαθῷ ἔργῳ ... τῷ κακῷ
  choice: bagi perbuatan baik ... bagi perbuatan jahat
  rationale: Mempertahankan kontras etis antara yang baik dan yang jahat serta unsur ἔργῳ, sementara bentuk kedua dipahami secara eliptis dari pasangan pertama.
- source_word: θέλεις δὲ μὴ φοβεῖσθαι
  choice: Namun, maukah kamu tidak takut
  rationale: Mempertahankan bentuk pertanyaan retoris θέλεις dengan infinitif yang dinegasikan, alih-alih mengubahnya menjadi klausa bersyarat.
- source_word: τὴν ἐξουσίαν
  choice: penguasa
  rationale: Dalam konteks ini ἐξουσία menunjuk kepada otoritas pemerintahan yang konkret. 'Penguasa' terdengar lebih alami sebagai pihak yang dapat ditakuti dan memberi pujian, meskipun alternatif formalnya ialah 'wewenang' atau 'otoritas'.
- source_word: τὸ ἀγαθὸν ποίει
  choice: Lakukanlah apa yang baik
  rationale: Adjektiva berartikel berfungsi substantival; terjemahan ini mempertahankan kategori moral umum, bukan hanya satu tindakan tertentu.
- source_word: ἕξεις ἔπαινον ἐξ αὐτῆς
  choice: kamu akan mendapat pujian darinya
  rationale: Menyampaikan arti bahwa pujian berasal dari pihak berwenang; 'mendapat pujian' lebih idiomatis dalam bahasa Indonesia daripada 'mempunyai pujian'.
theological_decisions:
- issue: Cakupan pernyataan Paulus tentang penguasa
  choice: Menerjemahkan secara langsung sebagai gambaran mengenai fungsi lazim atau semestinya dari pemerintahan, tanpa menambahkan pembatas ke dalam teks utama.
  alternative: Memutlakkannya sebagai jaminan bahwa setiap penguasa selalu menghargai kebaikan, atau membacanya sebagai ironi.
  rationale: Teks menyatakan hubungan tersebut tanpa penanda ironi ataupun kualifikasi eksplisit. Terjemahan mempertahankan ketegangan itu dan tidak memasukkan penafsiran tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pertanyaan retoris Yunani dipertahankan. Sapaan tunggal orang kedua diterjemahkan dengan 'kamu', sesuai bentuk verba Yunani, sedangkan istilah pemerintahan dibuat alami tanpa menambahkan dukungan teologis mutlak terhadap semua tindakan penguasa.
