revisions:
- from: Sebab para penguasa bukanlah sesuatu yang menakutkan bagi perbuatan baik, melainkan bagi perbuatan jahat.[a] Namun, maukah kamu tidak takut kepada penguasa? Lakukanlah apa yang baik, maka kamu akan mendapat pujian darinya.[b]
  to: Sebab para penguasa tidak perlu ditakuti karena perbuatan baik, melainkan karena perbuatan jahat.[a] Namun, apakah kamu ingin tidak takut kepada otoritas itu? Lakukanlah apa yang baik, dan kamu akan menerima pujian darinya.[b]
  rationale: Revisi membedakan “para penguasa” (ἄρχοντες) dari “otoritas itu” (ἐξουσία), memperjelas acuan “darinya,” dan membuat kalimat pertama lebih alami dalam bahasa Indonesia tanpa menambahkan pembatasan atau penafsiran teologis pada pernyataan Paulus. Bentuk pertanyaan retoris tetap dipertahankan.
