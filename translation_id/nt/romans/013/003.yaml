review_pass:
  verdict: revise
  source_fidelity: Draf pada umumnya setia pada struktur dan kontras etis teks Yunani. Namun, ἐξουσία pada pertanyaan dan αὐτῆς pada penutup secara lebih tepat merujuk pada otoritas pemerintahan, bukan pada para penguasa sebagai orang-orang. Terjemahan saat ini memakai “penguasa” untuk keduanya dan catatan kaki membiarkan rujukan itu ambigu.
  naturalness: “Sesuatu yang menakutkan bagi perbuatan baik” dapat dipahami, tetapi kurang wajar karena perbuatan bukan pihak yang mengalami rasa takut. Perumusan “tidak perlu ditakuti karena perbuatan baik” menyampaikan fungsi predikatif φόβος dan kontras kausal/etis secara alami dalam bahasa Indonesia baku.
  terminology: “Para penguasa” tepat untuk οἱ ἄρχοντες. “Otoritas itu” tepat untuk ἐξουσία yang tunggal dan berartikula, tanpa menyempitkannya kepada seorang pejabat atau mengubahnya menjadi klaim tentang suatu lembaga tertentu. “Menerima pujian” adalah padanan idiomatis yang setia untuk ἕξεις ἔπαινον.
  issues:
  - severity: medium
    issue: Rujukan ἐξουσία dan αὐτῆς diterjemahkan sebagai “penguasa”/“darinya”.
    rationale: ἐξουσία berarti otoritas atau kewenangan, sedangkan οἱ ἄρχοντες berarti para penguasa. Walaupun keduanya terkait dalam konteks, teks membedakan bentuk plural personal pada awal ayat dari nomina feminin tunggal yang menjadi acuan αὐτῆς.
  - severity: low
    issue: Ungkapan “sesuatu yang menakutkan bagi perbuatan baik” kurang idiomatis.
    rationale: Ungkapan tersebut terlalu mengikuti konstruksi Yunani secara harfiah dan menjadikan “perbuatan” seolah-olah pihak yang takut. Revisi mempertahankan maksud bahwa perbuatan baik bukan alasan untuk takut kepada penguasa.
  revised_text: Sebab para penguasa tidak perlu ditakuti karena perbuatan baik, melainkan karena perbuatan jahat.[a] Namun, apakah kamu ingin tidak takut kepada otoritas itu? Lakukanlah apa yang baik, dan kamu akan menerima pujian darinya.[b]
  revised_footnotes:
