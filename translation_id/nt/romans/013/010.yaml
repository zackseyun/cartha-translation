  text: ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· πλήρωμα οὖν νόμου ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/010.yaml
  text: Love does no harm to a neighbor[b][a]; therefore love is the fulfillment of the law.
translation:
  language: id
  text: Kasih tidak berbuat jahat kepada sesama; karena itu, kasih adalah penggenapan hukum Taurat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kasih adalah kepenuhan hukum Taurat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἀγάπη
  choice: kasih
  rationale: “Kasih” merupakan padanan baku, alami, dan bermartabat untuk ἀγάπη dalam konteks etika Paulus serta mempertahankan pengulangan kata yang sama pada kedua klausa.
- source_word: τῷ πλησίον
  choice: terhadap sesama
  rationale: Datif ini menunjukkan pihak yang terkena tindakan. “Sesama” menyampaikan makna generik πλησίον secara alami dalam bahasa Indonesia.
- source_word: κακὸν οὐκ ἐργάζεται
  choice: tidak berbuat jahat
  rationale: Ungkapan ini mempertahankan unsur leksikal κακόν (“jahat/kejahatan”) dan ἐργάζεται (“berbuat/mengerjakan”) tanpa membatasi maknanya hanya pada akibat berupa kerugian fisik.
- source_word: πλήρωμα
  choice: penggenapan
  rationale: Dalam alur argumentasi Paulus, πλήρωμα menunjuk pada apa yang memenuhi atau membawa hukum kepada maksudnya. “Penggenapan” jelas dan lazim dalam bahasa Indonesia teologis tanpa mengubah klausa nominal menjadi verba.
- source_word: οὖν
  choice: karena itu
  rationale: Menandai kesimpulan logis dari pernyataan sebelumnya secara alami dalam bahasa Indonesia modern.
- source_word: νόμου
  choice: hukum Taurat
  rationale: Dalam konteks Roma 13, νόμος merujuk pada hukum yang dikenal dari konteks sebelumnya, yakni Taurat. “Hukum Taurat” menghindari kesan bahwa yang dimaksud ialah hukum secara umum.
theological_decisions:
- issue: Hubungan kasih dengan hukum Taurat
  choice: kasih adalah penggenapan hukum Taurat
  alternative: kasih adalah kepenuhan hukum Taurat
  rationale: Terjemahan ini mempertahankan bentuk klausa nominal Yunani dan pernyataan teologis Paulus tanpa mengubahnya menjadi perintah atau secara eksplisit menyatakan mekanisme penggenapan yang tidak dijelaskan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Struktur dua klausa dan pengulangan “kasih” dipertahankan. Alternatif harfiah untuk πλήρωμα dicatat tanpa membebani teks utama.
