  naturalness: Teks revisi memakai susunan baku dan jelas. Penambahan "kewajiban" membuat elipsis Yunani dapat dipahami secara alami dalam bahasa Indonesia tanpa memperluas ajaran ayat.
  terminology: '"Mengasihi" mempertahankan padanan yang tepat untuk ἀγαπάω. "Orang lain" menerjemahkan τὸν ἕτερον secara langsung; catatan kaki mempertahankan alternatif literal. "Hukum" mempertahankan keluasan νόμον dan tidak lebih dulu menafsirkan referennya sebagai Taurat.'
