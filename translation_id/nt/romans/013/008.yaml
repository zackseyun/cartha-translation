  text: Μηδενὶ μηδὲν ὀφείλετε, εἰ μὴ τὸ ⸂ἀλλήλους ἀγαπᾶν⸃· ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/008.yaml
  text: Owe no one anything[a], except to love one another; for the one who loves another has fulfilled the law.
translation:
  language: id
  text: Janganlah berutang apa pun kepada siapa pun, kecuali kewajiban untuk saling mengasihi. Sebab orang yang mengasihi orang lain[a] telah memenuhi hukum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “yang lain”; dapat juga diterjemahkan “sesamanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδενὶ μηδὲν ὀφείλετε
  choice: Janganlah berutang apa pun kepada siapa pun
  rationale: Ungkapan ini mempertahankan larangan menyeluruh dalam bahasa Indonesia yang alami, tanpa menentukan apakah ayat ini melarang setiap bentuk pinjaman.
- source_word: εἰ μὴ
  choice: kecuali
  rationale: Menandai satu-satunya kewajiban yang tetap berlaku secara ringkas dan wajar.
- source_word: τὸ ἀλλήλους ἀγαπᾶν
  choice: untuk saling mengasihi
  rationale: Menyampaikan infinitif substantival sebagai kewajiban timbal balik yang berkelanjutan dengan ungkapan Indonesia yang alami.
- source_word: ὁ γὰρ ἀγαπῶν
  choice: Sebab, orang yang mengasihi
  rationale: Mempertahankan bentuk tunggal representatif dari partisip substantival tanpa bahasa yang kaku.
- source_word: τὸν ἕτερον
  choice: sesamanya
  rationale: Dalam konteks ini menunjuk kepada orang lain dalam relasi dengan pelaku. Catatan kaki mempertahankan bentuk Yunani yang lebih harfiah, 'yang lain,' serta alternatif 'orang lain.'
- source_word: νόμον
  choice: hukum Taurat
  rationale: Dalam konteks Roma 13, νόμος menunjuk pada hukum yang perintah-perintahnya dibahas pada ayat berikutnya; 'hukum Taurat' memperjelas referen bagi pembaca Indonesia tanpa mengubah klaim ayat.
- source_word: πεπλήρωκεν
  choice: telah memenuhi
  rationale: Mencerminkan bentuk perfektum Yunani dan gagasan bahwa tuntutan hukum telah dipenuhi dengan hasil yang tetap berlaku.
theological_decisions:
- issue: Cakupan larangan Paulus mengenai utang
  choice: Menerjemahkan larangan berutang secara langsung, tanpa menambahkan bahwa semua pinjaman mutlak dilarang.
  alternative: Menafsirkannya sebagai larangan mutlak atas segala pinjaman, atau semata-mata sebagai metafora kewajiban moral.
  rationale: Teks memakai bahasa utang atau kewajiban lalu mengecualikan kewajiban untuk saling mengasihi. Terjemahan tidak seharusnya menyelesaikan perdebatan etis yang melampaui bunyi teks.
- issue: Makna νόμον
  choice: hukum Taurat
  alternative: hukum
  rationale: Konteks langsung menyebut perintah-perintah Taurat, tetapi terjemahan tetap tidak menjelaskan lebih jauh bagaimana kasih memenuhi hukum itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan larangan dibuat alami; 'apa pun' dan 'siapa pun' mempertahankan cakupan ganda negatif Yunani. Penanda catatan kaki ditempatkan tepat setelah 'sesamanya'.
