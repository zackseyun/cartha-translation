id: ROM.13.11
reference: Romans 13:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ⸂ἤδη ὑμᾶς⸃ ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/011.yaml
  text: And do this[a], knowing the time, that it is already the hour for you to awaken from sleep[b], for now our salvation is nearer than when we believed.
translation:
  language: id
  text: 'Lakukanlah ini dengan menyadari waktu ini: sekarang sudah waktunya bagi kalian[a] untuk bangun dari tidur, sebab keselamatan kita sekarang lebih dekat daripada ketika kita percaya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah membaca “bagi kita” alih-alih “bagi kalian”.
    reason: textual_variant
  - marker: b
    text: Atau, “daripada ketika kita mula-mula percaya”. Teks Yunani hanya berbunyi “ketika kita percaya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τοῦτο
  choice: Lakukanlah juga hal ini
  rationale: Frasa eliptis ini menunjuk kembali kepada nasihat etis sebelumnya. Bentuk imperatif tersirat dibuat eksplisit agar alami dalam bahasa Indonesia, sedangkan “juga” mempertahankan kaitan dengan konteks.
- source_word: εἰδότες τὸν καιρόν
  choice: sadarilah masa ini
  rationale: Partisip εἰδότες menyatakan pengetahuan yang menjadi dasar desakan. “Sadarilah” lebih alami dalam rangkaian nasihat bahasa Indonesia, dan “masa ini” menangkap καιρός sebagai masa yang menentukan, bukan sekadar waktu kronologis.
- source_word: ὅτι ὥρα ἤδη ὑμᾶς
  choice: bahwa sekarang sudah tiba saatnya bagi kalian
  rationale: Ungkapan ini mempertahankan urgensi ἤδη dan daya ungkap ὥρα. “Kalian” menyatakan dengan jelas bahwa ὑμᾶς berbentuk jamak.
- source_word: ἐξ ὕπνου ἐγερθῆναι
  choice: untuk bangun dari tidur
  rationale: Terjemahan ini alami dan mempertahankan metafora kebangkitan dari keadaan tidur tanpa menentukan apakah bentuk pasif Yunani harus dipahami secara teologis.
- source_word: νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία
  choice: sebab keselamatan kita kini lebih dekat
  rationale: “Sebab” menyatakan fungsi penjelas γάρ, “kini” menerjemahkan νῦν, dan “keselamatan kita” mempertahankan keselamatan sebagai milik umat percaya namun masih mendekat.
- source_word: ἢ ὅτε ἐπιστεύσαμεν
  choice: daripada ketika kita percaya
  rationale: Terjemahan ini mengikuti bunyi sederhana teks Yunani tanpa menambahkan “mula-mula,” meskipun makna itu mungkin tersirat oleh konteks.
theological_decisions:
- issue: Keselamatan dikatakan semakin dekat meskipun para pembaca sudah percaya
  choice: keselamatan kita
  alternative: keselamatan kita yang terakhir; pembebasan kita pada kedatangan Tuhan
  rationale: Ungkapan dibiarkan luas agar ketegangan eskatologis antara keselamatan yang telah menjadi milik orang percaya dan penggenapannya yang masih mendekat tetap terpelihara.
- issue: Metafora bangun dari tidur
  choice: bangun dari tidur
  alternative: dibangunkan dari tidur; bangkit dari tidur
  rationale: Pilihan ini mempertahankan metafora etis-eskatologis tanpa memasukkan penafsiran khusus tentang kelahiran baru, kebangkitan tubuh, atau doktrin tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang mendesak dan bermartabat. “Kalian” dipakai untuk memperjelas bentuk jamak orang kedua; struktur kalimat dibuat alami tanpa menghilangkan hubungan logis atau ketegangan teologis teks.
