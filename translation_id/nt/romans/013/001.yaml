review_pass:
  verdict: revise
  source_fidelity: Draf menangkap imperatif ὑποτασσέσθω, asal ilahi ἐξουσία, dan perfekt pasif τεταγμέναι dengan baik. Namun, “pemerintah yang berwenang” terlalu menyempitkan ἐξουσίαις kepada lembaga pemerintah, sedangkan istilah Yunani menunjuk kepada otoritas/penguasa yang memerintah; bentuk tunggalnya juga kurang mencerminkan bentuk jamak. “Pemerintah-pemerintah” pada klausa akhir tidak alami dan tidak secara baik mempertahankan rujukan kepada otoritas yang ada.
  naturalness: “Pemerintah yang berwenang” dapat dipahami, tetapi “pemerintah-pemerintah” terdengar tidak lazim dalam bahasa Indonesia baku. “Para penguasa” adalah padanan yang alami dalam konteks sipil dan memungkinkan klausa kedua tetap memakai “wewenang” untuk makna ἐξουσία.
  terminology: Allah, wewenang, tunduk, dan ditetapkan sesuai register baku. “Para penguasa” dipakai untuk ἐξουσίαις ὑπερεχούσαις dalam konteks pemerintahan, sementara “wewenang” dipertahankan dalam klausa sebab-akibat. Catatan alternatif perlu disesuaikan agar tidak menawarkan “pihak-pihak yang berkedudukan di atas,” yang kaku dan kurang idiomatis.
  issues:
  - severity: medium
    issue: Padanan “pemerintah yang berwenang” dan “pemerintah-pemerintah yang ada”
    rationale: ἐξουσίαις adalah bentuk jamak “otoritas/penguasa,” bukan terutama istilah bagi institusi pemerintah. Padanan sekarang menyempitkan makna, dan pengulangan “pemerintah-pemerintah” tidak alami.
  - severity: low
    issue: Letak penanda catatan kaki b
    rationale: Penanda b ditempatkan setelah tanda titik, bukan langsung sesudah “ditetapkan oleh Allah,” padahal catatan menjelaskan τεταγμέναι.
  - severity: low
    issue: Alternatif dalam catatan kaki a
    rationale: “Pihak-pihak yang berkedudukan di atas” tidak idiomatis untuk bahasa Indonesia modern. Alternatif yang lebih langsung dapat menyatakan arti “otoritas/penguasa yang lebih tinggi.”
  revised_text: Hendaklah setiap orang tunduk kepada para penguasa[a], sebab tidak ada wewenang yang tidak berasal dari Allah, dan para penguasa yang ada telah ditetapkan oleh Allah[b].
