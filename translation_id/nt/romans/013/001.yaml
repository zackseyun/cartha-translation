revisions:
- from: Hendaklah setiap orang tunduk kepada pemerintah yang berwenang[a], sebab tidak ada wewenang yang tidak berasal dari Allah, dan pemerintah-pemerintah yang ada telah ditetapkan oleh Allah.[b]
  to: Hendaklah setiap orang tunduk kepada para penguasa[a], sebab tidak ada wewenang yang tidak berasal dari Allah, dan para penguasa yang ada telah ditetapkan oleh Allah[b].
  rationale: Revisi memakai “para penguasa” untuk mengungkapkan jamak dan fungsi sipil ἐξουσίαις ὑπερεχούσαις secara alami, tanpa membatasi makna pada lembaga pemerintah. “Wewenang” tetap dipakai pada klausa berikut untuk menerjemahkan ἐξουσία sebagai realitas otoritas yang berasal dari Allah. “Telah ditetapkan” dengan tepat menyampaikan perfekt pasif τεταγμέναι tanpa menyiratkan persetujuan moral Allah atas setiap tindakan penguasa. Penanda b dipindahkan ke kata yang dijelaskannya.
  reviewer_model: gpt-5.6-terra
