  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω, οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ ⸀οὖσαι ⸀ὑπὸ θεοῦ τεταγμέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/001.yaml
  text: Let every person be subject to the governing authorities[a], for there is no authority except from God[b], and those that exist have been appointed by God.
translation:
  language: id
  text: Hendaklah setiap orang tunduk kepada para penguasa[a], sebab tidak ada wewenang yang tidak berasal dari Allah, dan para penguasa yang ada telah ditetapkan oleh Allah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “otoritas-otoritas yang lebih tinggi” atau “para penguasa yang lebih tinggi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “telah diatur oleh Allah” atau “telah ditetapkan dalam tatanan oleh Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα ψυχὴ
  choice: setiap orang
  rationale: Secara harfiah berarti ‘setiap jiwa’, tetapi dalam ungkapan Yunani Koine frasa ini menunjuk kepada tiap-tiap orang. ‘Setiap orang’ alami dalam bahasa Indonesia dan mempertahankan daya distributif πᾶσα.
- source_word: ἐξουσίαις ὑπερεχούσαις
  choice: pemerintah yang berwenang
  rationale: ἐξουσίαις menunjuk kepada pihak-pihak yang memiliki wewenang, sedangkan ὑπερεχούσαις menggambarkan kedudukan mereka di atas atau sebagai penguasa. Dalam konteks sipil, ‘pemerintah yang berwenang’ menyampaikan fungsi tersebut secara jelas tanpa memakai ungkapan ‘penguasa yang lebih tinggi’ yang dapat terasa kurang alami.
- source_word: ὑποτασσέσθω
  choice: hendaklah ... tunduk
  rationale: Bentuk imperatif kini ini memerintahkan sikap menempatkan diri di bawah suatu tatanan. ‘Hendaklah ... tunduk’ mempertahankan kekuatan perintah sekaligus tidak memperluasnya menjadi persetujuan terhadap setiap tindakan pemerintah.
- source_word: οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ
  choice: sebab tidak ada wewenang yang tidak berasal dari Allah
  rationale: Susunan ini menyatakan Allah sebagai sumber utama wewenang. Pengulangan ‘wewenang’ menjaga hubungan leksikal dengan ἐξουσίαις, sedangkan ‘berasal dari Allah’ menyampaikan ὑπὸ θεοῦ secara alami tanpa menguraikan mekanismenya.
- source_word: αἱ δὲ οὖσαι
  choice: pemerintah-pemerintah yang ada
  rationale: Partisip feminin jamak ini merujuk kembali kepada ἐξουσίαις. Penyebutan eksplisit ‘pemerintah-pemerintah’ menghindari rujukan kabur dalam bahasa Indonesia.
- source_word: τεταγμέναι
  choice: telah ditetapkan
  rationale: Bentuk perfek pasif τάσσω menyatakan keadaan sekarang sebagai hasil tindakan penataan atau penetapan sebelumnya. ‘Telah ditetapkan’ mempertahankan aspek tersebut dan tidak dengan sendirinya menyiratkan persetujuan moral atas semua tindakan penguasa.
theological_decisions:
- issue: Cakupan pernyataan Paulus mengenai pemerintah dan Allah
  choice: Ayat ini menyatakan bahwa wewenang pemerintah berasal dari Allah dan bahwa pemerintah yang ada berada dalam tatanan yang ditetapkan Allah, tanpa menambahkan bahwa Allah menyetujui setiap tindakan setiap penguasa.
  alternative: Menafsirkan ayat ini sebagai dukungan ilahi tanpa syarat terhadap setiap rezim dan tindakannya, atau sebaliknya membatasinya hanya pada konsep abstrak tentang wewenang.
  rationale: Bahasa Yunani berbicara secara konkret tentang otoritas yang memerintah dan menyebut yang ada sebagai τεταγμέναι oleh Allah. Terjemahan mempertahankan ketegangan ini tanpa menarik kesimpulan teologis yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Pemerintah yang berwenang’ dipilih agar konteks sipil segera dipahami pembaca umum; ‘wewenang’ dipertahankan dalam klausa berikutnya untuk mencerminkan pengulangan ἐξουσία. Semua penanda catatan kaki ditempatkan dalam teks utama.
