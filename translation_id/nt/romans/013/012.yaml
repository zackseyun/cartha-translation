  source_fidelity: 'Teks Indonesia dengan setia mempertahankan metafora temporal dan etis dari Yunani: νύξ/ἡμέρα sebagai “malam/hari,” προέκοψεν sebagai malam yang sudah jauh berlalu, dan ἤγγικεν sebagai hari yang sudah dekat. Kedua subjungtif ajakan diterjemahkan tepat dengan “marilah kita,” serta pasangan citra menanggalkan/mengenakan tetap terpelihara. “Perlengkapan perang terang” secara cukup luas mencakup ὅπλα dan masih dapat dikenakan; ungkapan ini tidak secara keliru membatasi maknanya pada senjata ofensif.'
