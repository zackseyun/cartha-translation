id: ROM.13.12
reference: Romans 13:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ νὺξ προέκοψεν, ἡ δὲ ἡμέρα ἤγγικεν. ⸀ἀποβαλώμεθα οὖν τὰ ἔργα τοῦ σκότους, ⸂ἐνδυσώμεθα δὲ⸃ τὰ ὅπλα τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/012.yaml
  text: The night is far gone[a]; the day has drawn near[b]. Therefore let us cast off the works of darkness and put on the armor of light.
translation:
  language: id
  text: Malam sudah jauh berlalu[a], dan hari sudah dekat. Karena itu, marilah kita menanggalkan perbuatan-perbuatan kegelapan dan mengenakan perlengkapan perang terang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Malam sudah larut.” Kata kerja Yunani menggambarkan malam sebagai sesuatu yang telah bergerak maju, yaitu sebagian besarnya telah lewat.
    reason: lexical_alternative
  - marker: b
    text: Atau “senjata-senjata terang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ νὺξ
  choice: malam
  rationale: Mempertahankan metafora waktu yang berlawanan dengan 'hari'; dimensi moralnya tampak kemudian melalui 'kegelapan' tanpa meleburkan kedua gambaran itu.
- source_word: προέκοψεν
  choice: sudah jauh berlalu
  rationale: Kata kerja ini secara harfiah menggambarkan gerak maju. Dalam konteks malam, ungkapan ini menyampaikan bahwa malam telah berlangsung jauh dan sebagian besarnya telah lewat.
- source_word: ἡ ἡμέρα
  choice: hari
  rationale: Terjemahan harfiah mempertahankan pertentangan temporal dan moral dengan 'malam'.
- source_word: ἤγγικεν
  choice: sudah dekat
  rationale: Bentuk perfektum menunjukkan keadaan kini sebagai hasil dari sesuatu yang telah mendekat; 'sudah dekat' menyatakannya secara alami dalam bahasa Indonesia.
- source_word: ἀποβαλώμεθα
  choice: marilah kita menanggalkan
  rationale: Subjungtif ajakan diterjemahkan dengan 'marilah kita'; 'menanggalkan' mempertahankan gambaran melepas pakaian dan berpasangan dengan 'mengenakan'.
- source_word: τὰ ἔργα
  choice: perbuatan-perbuatan
  rationale: Dalam bahasa Indonesia modern, 'perbuatan' menyampaikan tindakan moral secara lebih alami daripada 'pekerjaan' dalam konteks ini.
- source_word: τοῦ σκότους
  choice: kegelapan
  rationale: Mempertahankan metafora etis tanpa mempersempitnya secara tafsir menjadi 'kejahatan'.
- source_word: ἐνδυσώμεθα
  choice: mengenakan
  rationale: Mempertahankan subjungtif ajakan serta gambaran berpakaian yang berpasangan dengan 'menanggalkan'.
- source_word: τὰ ὅπλα
  choice: perlengkapan perang
  rationale: Ὅπλα dapat menunjuk senjata atau perlengkapan tempur. 'Perlengkapan perang' cukup luas untuk mencakup perlengkapan yang dikenakan dan selaras dengan kata kerja 'mengenakan', tanpa membatasinya hanya pada senjata penyerang.
- source_word: τοῦ φωτός
  choice: terang
  rationale: Mempertahankan pertentangan metaforis dengan kegelapan dan ungkapan genitif secara ringkas dan wajar.
theological_decisions:
- issue: Metafora eskatologis malam dan hari
  choice: Citra 'malam' dan 'hari' dipertahankan secara harfiah.
  alternative: Parafrasa seperti 'zaman gelap ini hampir berakhir' dan 'zaman baru segera tiba'.
  rationale: Teks mengandung daya temporal, moral, dan eskatologis sekaligus. Terjemahan yang lebih eksplisit akan menutup ketegangan yang sengaja dibiarkan oleh metafora.
- issue: Makna ὅπλα τοῦ φωτός
  choice: perlengkapan perang terang
  alternative: senjata-senjata terang
  rationale: Kata kerja 'mengenakan' mendukung perlengkapan tempur yang dapat dikenakan, sedangkan ὅπλα tetap dapat berarti senjata. Karena itu, arti alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ajakan yang khidmat. Pasangan 'menanggalkan/mengenakan' menjaga gambaran pakaian, sementara 'perlengkapan perang' mempertahankan nuansa militer ὅπλα dan ambiguitas cakupannya.
