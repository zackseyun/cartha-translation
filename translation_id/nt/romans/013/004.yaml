  to: Sebab ia adalah pelayan Allah demi kebaikanmu. Namun, jika kamu berbuat jahat, takutlah, karena ia tidak menyandang pedang dengan sia-sia[a]. Sebab ia adalah pelayan Allah, pembalas yang mendatangkan murka atas orang yang melakukan kejahatan[b].
