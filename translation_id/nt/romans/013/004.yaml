  terminology: “Pelayan Allah,” “pedang,” dan “kejahatan” tepat dalam register modern. “Pembalas yang mendatangkan murka” lebih dekat kepada ἔκδικος εἰς ὀργὴν daripada “pelaksana pembalasan yang menyatakan murka,” serta tidak menambahkan kata “Allah” pada murka yang tidak diulang secara eksplisit dalam klausa Yunani.
