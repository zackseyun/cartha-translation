id: ROM.13.4
reference: Romans 13:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν, ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/004.yaml
  text: For it is God’s servant for your good[a]. But if you do what is evil, be afraid, for it does not bear the sword for nothing. For it is God’s servant[b], an avenger for wrath against the one who practices evil.
translation:
  language: id
  text: Sebab ia adalah pelayan Allah demi kebaikanmu. Namun, jika kamu berbuat jahat, takutlah, karena ia tidak menyandang pedang dengan sia-sia[a]. Sebab ia adalah pelayan Allah, pembalas yang mendatangkan murka atas orang yang melakukan kejahatan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bukan tanpa tujuan.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “seorang pembalas untuk murka terhadap orang yang melakukan kejahatan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διάκονός
  choice: pelayan
  rationale: Kata ini menyatakan orang atau pihak yang melayani dan menjalankan suatu amanat. “Pelayan” mempertahankan gagasan bahwa penguasa menjalankan fungsi di bawah Allah tanpa mempersempitnya menjadi jabatan gerejawi.
- source_word: σοὶ εἰς τὸ ἀγαθόν
  choice: demi kebaikanmu
  rationale: Ungkapan ini menyatakan manfaat atau tujuan yang baik bagi orang yang disapa. “Demi kebaikanmu” alami dalam bahasa Indonesia dan menghubungkan σοὶ dengan εἰς τὸ ἀγαθόν.
- source_word: τὸ κακὸν ποιῇς
  choice: kamu berbuat jahat
  rationale: κακόν di sini menunjuk pada kejahatan moral. “Berbuat jahat” ringkas, alami, dan mempertahankan daya etis ungkapan tersebut.
- source_word: φοβοῦ
  choice: takutlah
  rationale: Bentuk imperatif ini secara langsung memerintahkan orang yang berbuat jahat untuk takut terhadap wewenang penghukuman penguasa.
- source_word: εἰκῇ
  choice: bukan tanpa tujuan
  rationale: Adverbia ini dapat berarti tanpa tujuan, tanpa alasan, atau sia-sia. Dalam konteks pedang sebagai lambang kuasa menghukum, “bukan tanpa tujuan” menyatakan bahwa pedang itu memiliki fungsi nyata tanpa menentukan lebih jauh dasar penggunaannya.
- source_word: μάχαιραν
  choice: pedang
  rationale: Kata Yunani ini secara konkret berarti pedang atau belati. “Pedang” mempertahankan citra dan daya simbolis kuasa penghukuman.
- source_word: φορεῖ
  choice: menyandang
  rationale: φορέω menggambarkan tindakan membawa atau mengenakan secara tetap. “Menyandang pedang” merupakan ungkapan Indonesia yang wajar untuk membawa senjata sebagai tanda jabatan atau wewenang.
- source_word: ἔκδικος
  choice: pelaksana pembalasan
  rationale: Istilah ini menunjuk pada pihak yang melaksanakan keadilan atau pembalasan. Pilihan ini mempertahankan unsur retributif tanpa memberi kesan pembalasan dendam pribadi.
- source_word: εἰς ὀργὴν
  choice: yang menyatakan murka
  rationale: Frasa ini menghubungkan peran pembalasan dengan murka sebagai tujuan atau hasil. Ungkapan ini cukup alami dalam bahasa Indonesia dan tidak secara eksplisit menentukan apakah murka itu disebut sebagai murka Allah.
- source_word: τῷ τὸ κακὸν πράσσοντι
  choice: terhadap orang yang melakukan kejahatan
  rationale: Partisip substantival ini menunjuk kepada orang yang dicirikan oleh perbuatan jahat. Terjemahan ini mempertahankan sasaran tindakan penguasa dan makna moral κακόν.
- source_word: γὰρ
  choice: sebab / karena
  rationale: γάρ memberi alasan atau penjelasan. Variasi “sebab” dan “karena” menjaga alur argumentasi sekaligus menghasilkan bahasa Indonesia yang alami.
theological_decisions:
- issue: Hubungan peran penghukuman penguasa dengan murka
  choice: “pelaksana pembalasan yang menyatakan murka” tanpa menambahkan “Allah”
  alternative: “pelaksana pembalasan yang menimpakan murka Allah” atau “pelaksana penghukuman”
  rationale: Konteks menyebut penguasa sebagai pelayan Allah, tetapi εἰς ὀργὴν sendiri tidak secara eksplisit mengulang θεοῦ. Terjemahan utama mempertahankan hubungan teologis itu tanpa menjelaskan lebih daripada yang dinyatakan teks.
- issue: Rujukan subjek tersirat
  choice: “ia”
  alternative: “penguasa itu” atau “pemerintah”
  rationale: Bahasa Yunani hanya memakai bentuk verba orang ketiga dengan anteseden dari konteks sebelumnya. “Ia” mempertahankan kesinambungan itu dan tidak memperluas istilah menjadi institusi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kata ganti “kamu” dipakai untuk sapaan tunggal generik σοὶ, sedangkan “ia” merujuk kepada penguasa yang disebut dalam konteks sebelumnya. Susunan akhir dibuat alami, sementara catatan kaki mempertahankan bentuk Yunani yang lebih padat dan ambigu.
