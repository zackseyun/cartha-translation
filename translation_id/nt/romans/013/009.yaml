id: ROM.13.9
reference: Romans 13:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὸ γάρ· Οὐ μοιχεύσεις, Οὐ φονεύσεις, Οὐ κλέψεις, Οὐκ ἐπιθυμήσεις, καὶ εἴ τις ἑτέρα ἐντολή, ἐν ⸂τῷ λόγῳ τούτῳ⸃ ἀνακεφαλαιοῦται, ⸂ἐν τῷ⸃· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/009.yaml
  text: 'For this: “You shall not commit adultery[a], you shall not murder, you shall not steal, you shall not covet,” and if there is any other commandment[b], it is summed up in this word: “You shall love your neighbor as yourself.”'
translation:
  language: id
  text: 'Sebab, “Jangan berzina, jangan membunuh[a], jangan mencuri, jangan mengingini,” dan jika ada perintah lain, semua itu terangkum dalam perkataan ini[b]: “Kasihilah sesamamu seperti dirimu sendiri.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang dipakai di sini menunjuk pada pembunuhan manusia secara melawan hukum, bukan setiap tindakan menghilangkan nyawa. Dapat juga diterjemahkan, “jangan melakukan pembunuhan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “dalam pernyataan ini.” Kata Yunani dapat berarti “perkataan,” “pernyataan,” atau “ucapan” dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γάρ
  choice: Sebab
  rationale: Partikel γάρ memperkenalkan alasan bagi pernyataan sebelumnya, sedangkan artikel netral τὸ mengarahkan perhatian kepada isi perintah-perintah yang segera dikutip. Dalam bahasa Indonesia, “Sebab” menyampaikan hubungan penjelas itu secara alami tanpa ungkapan kaku.
- source_word: μοιχεύσεις
  choice: jangan berzina
  rationale: Bentuk futurum dalam kutipan Sepuluh Perintah berfungsi sebagai larangan. “Jangan berzina” mempertahankan bentuk perintah dan kaitan antarteksnya.
- source_word: φονεύσεις
  choice: jangan membunuh
  rationale: Dalam konteks ini φονεύω menunjuk pembunuhan manusia secara melawan hukum, bukan segala tindakan menghilangkan nyawa. Ungkapan baku “jangan membunuh” dipertahankan, dengan catatan kaki untuk menjelaskan cakupan leksikalnya.
- source_word: κλέψεις
  choice: jangan mencuri
  rationale: Bentuk larangan yang langsung dan baku dalam bahasa Indonesia, sesuai dengan fungsi imperatif futurum Yunani dalam kutipan hukum.
- source_word: ἐπιθυμήσεις
  choice: jangan mengingini
  rationale: Dalam konteks Sepuluh Perintah, kata ini menunjuk keinginan untuk memiliki sesuatu yang bukan haknya. “Mengingini” mempertahankan gema bahasa hukum Kitab Suci tanpa mempersempit objek yang tidak disebutkan dalam ayat ini.
- source_word: εἴ τις ἑτέρα ἐντολή
  choice: jika ada perintah lain
  rationale: Terjemahan ini mempertahankan bentuk bersyarat serta sifat tak tentu dari τις, dan memperluas cakupan kepada perintah lain di luar daftar yang dikutip.
- source_word: ἀνακεφαλαιοῦται
  choice: semua itu terangkum
  rationale: Kata kerja ini berarti menghimpun atau merangkum di bawah satu pokok. “Terangkum” jelas dan alami, sedangkan “semua itu” secara wajar menunjuk kepada perintah-perintah yang baru disebutkan.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: dalam perkataan ini
  rationale: λόγος di sini adalah rumusan atau pernyataan yang menyusul. “Perkataan” tetap dekat dengan bentuk Yunani dan cukup alami; catatan kaki mencatat alternatif “pernyataan”.
- source_word: Ἀγαπήσεις
  choice: Kasihilah
  rationale: Bentuk futurum dalam kutipan Imamat berfungsi sebagai perintah. Bentuk “Kasihilah” alami, bermartabat, dan mempertahankan bobot kutipan hukum.
- source_word: τὸν πλησίον σου
  choice: sesamamu
  rationale: “Sesama” adalah padanan Indonesia yang mapan dan alami bagi πλησίον dalam perintah ini, dengan cakupan relasional yang tidak dibatasi lebih jauh oleh terjemahan.
- source_word: ὡς σεαυτόν
  choice: seperti dirimu sendiri
  rationale: Padanan langsung ini mempertahankan ringkasnya perbandingan Yunani tanpa menambahkan kata kerja atau penjelasan tafsiran.
theological_decisions:
- issue: Bentuk larangan dalam kutipan Sepuluh Perintah
  choice: Bentuk perintah langsung “Jangan ...”
  alternative: Bentuk prediktif-harfiah seperti “Engkau tidak akan ...”
  rationale: Futurum Yunani di sini berfungsi secara imperatif dalam kutipan hukum. Bahasa Indonesia paling alami menyatakannya dengan “Jangan ...”, sambil tetap mempertahankan hubungan dengan Sepuluh Perintah.
- issue: Cakupan φονεύσεις
  choice: “jangan membunuh” dengan penjelasan bahwa yang dimaksud adalah pembunuhan manusia secara melawan hukum
  alternative: “jangan melakukan pembunuhan”
  rationale: Pilihan utama mempertahankan rumusan yang alami dan dikenal luas, tetapi catatan kaki mencegah pembaca memahami larangan itu sebagai istilah tanpa batas bagi setiap penghilangan nyawa.
- issue: Makna λόγος dalam frasa rangkuman
  choice: “perkataan” dalam arti rumusan yang merangkum
  alternative: “pernyataan”
  rationale: Paulus menunjuk bukan sekadar satu kata, melainkan rumusan Kitab Suci yang menyusul. “Perkataan” mempertahankan keluasan λόγος, sedangkan catatan kaki memberi alternatif yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Bentuk “Jangan ...” dan “Kasihilah ...” mempertahankan corak kutipan perintah Kitab Suci tanpa menghasilkan susunan yang kaku. Tanda baca membedakan daftar perintah dari rumusan yang merangkumnya.
