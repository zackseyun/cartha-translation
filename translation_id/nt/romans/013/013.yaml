review_pass:
  verdict: revise
  source_fidelity: Terjemahan secara umum setia pada struktur hortatif περιπατήσωμεν dan tiga pasangan larangan dengan μὴ. “Hidup dengan pantas” menyampaikan idiom “berjalan” dan εὐσχημόνως dengan baik; “pesta pora dan kemabukan,” “percabulan dan perbuatan tak senonoh,” serta “pertengkaran dan iri hati” mempertahankan daftar keburukan tanpa penambahan tafsiran. Tidak ada isu tekstual yang mengharuskan catatan varian.
  naturalness: Bahasa Indonesia baku, jelas, dan ritmis. Susunan paralel “bukan dalam ...” efektif dan “seperti pada siang hari” alami dalam konteks metafora siang/malam.
  terminology: Istilah-istilah utama dapat diterima. “Perbuatan tak senonoh” untuk ἀσελγείαις sedikit lebih luas dan lebih ringan daripada gagasan perilaku yang tak tahu malu/tak terkendali, tetapi masih berada dalam cakupan makna dan tidak perlu diganti secara pasti. “Iri hati” tepat untuk ζήλῳ dalam daftar keburukan; “kecemburuan” layak dicatat sebagai alternatif.
  issues:
  - severity: low
    issue: Letak penanda catatan kaki [a]
    rationale: Catatan kaki menjelaskan “iri hati,” tetapi penandanya ditempatkan setelah seluruh kalimat. Menempatkannya langsung setelah “iri hati” membuat jangkar leksikalnya jelas tanpa mengubah makna.
  revised_text: Marilah kita hidup dengan pantas seperti pada siang hari, bukan dalam pesta pora dan kemabukan, bukan dalam percabulan dan perbuatan tak senonoh, bukan dalam pertengkaran dan iri hati.[a]
  revised_footnotes:
