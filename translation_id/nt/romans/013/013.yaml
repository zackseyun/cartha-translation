id: ROM.13.13
reference: Romans 13:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/013.yaml
  text: Let us walk properly as in the daytime[a], not in revelries and drunkenness, not in sexual immorality and sensuality[b], not in strife and jealousy.
translation:
  language: id
  text: Marilah kita hidup dengan pantas seperti pada siang hari, bukan dalam pesta pora dan kemabukan, bukan dalam percabulan dan perbuatan tak senonoh, bukan dalam pertengkaran dan iri hati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kecemburuan” untuk “iri hati”; kata Yunani yang dipakai dapat berarti keduanya, tetapi di sini bermakna negatif dalam daftar keburukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐν ἡμέρᾳ
  choice: seperti pada siang hari
  rationale: Mempertahankan gambaran siang yang berlawanan dengan malam dalam konteks sekitar, dengan ungkapan Indonesia yang alami.
- source_word: εὐσχημόνως
  choice: dengan pantas
  rationale: Menyatakan perilaku yang patut, terhormat, dan layak dilihat orang tanpa memakai ungkapan yang terlalu formal.
- source_word: περιπατήσωμεν
  choice: Marilah kita hidup
  rationale: Secara harfiah berarti 'marilah kita berjalan', tetapi di sini merupakan idiom Paulus bagi cara hidup; terjemahan maknawi lebih jelas dalam bahasa Indonesia modern sambil mempertahankan daya ajak hortatif.
- source_word: κώμοις
  choice: pesta pora
  rationale: Mengacu pada pesta liar atau hura-hura yang tidak terkendali, sering disertai minum-minum; 'pesta pora' luas, alami, dan tidak mempersempit makna menjadi perilaku seksual.
- source_word: μέθαις
  choice: kemabukan
  rationale: Padanan langsung dan alami untuk keadaan atau kebiasaan mabuk.
- source_word: κοίταις
  choice: percabulan
  rationale: Secara harfiah 'tempat-tempat tidur', tetapi dalam konteks ini merupakan metonimia untuk hubungan seksual yang tidak patut; 'percabulan' menyampaikan daya moral idiom tersebut secara ringkas.
- source_word: ἀσελγείαις
  choice: perbuatan tak senonoh
  rationale: Mencakup perilaku tanpa malu dan tak terkendali, sering bernuansa seksual, tanpa mempersempitnya hanya pada hawa nafsu batin.
- source_word: ἔριδι
  choice: pertengkaran
  rationale: Padanan Indonesia yang jelas untuk perselisihan, percekcokan, atau persaingan yang menimbulkan konflik.
- source_word: ζήλῳ
  choice: iri hati
  rationale: Dalam daftar keburukan ini ζῆλος bermakna negatif dan dapat menunjuk pada iri atau kecemburuan; 'iri hati' alami dalam pasangan dengan 'pertengkaran', sementara alternatifnya dicatat.
theological_decisions:
- issue: Kontras metaforis antara siang dan malam dalam nasihat etis
  choice: Gambaran diterjemahkan langsung sebagai 'seperti pada siang hari'.
  alternative: seperti di dalam terang siang; seolah-olah pada siang hari
  rationale: Terjemahan mempertahankan metafora etis Paulus tanpa mengembangkannya menjadi penjelasan doktrinal yang tidak dinyatakan dalam ayat ini.
- issue: Bahasa seksual idiomatis pada κοίταις
  choice: Diterjemahkan menurut maknanya sebagai 'percabulan'.
  alternative: tempat-tempat tidur; hubungan seksual yang tidak patut
  rationale: Terjemahan harfiah 'tempat-tempat tidur' akan kabur bagi pembaca modern, sedangkan konteks dengan jelas menunjukkan pemakaian seksual yang negatif.
- issue: Cakupan ἀσελγείαις
  choice: Diterjemahkan sebagai 'perbuatan tak senonoh'.
  alternative: hawa nafsu; kebejatan; perilaku tanpa kendali
  rationale: Pilihan ini menjaga cakupan perilaku tak tahu malu dan tak terkendali, yang sering tetapi tidak selalu bersifat seksual, sehingga tidak menutup ambiguitas leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku modern, bermartabat, dan mudah dipahami. Struktur tiga pasangan larangan dipertahankan. Idiom 'berjalan' dialihkan menjadi 'hidup' agar alami, sedangkan metafora siang tetap dipertahankan.
