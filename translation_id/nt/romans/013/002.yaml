id: ROM.13.2
reference: Romans 13:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥστε ὁ ἀντιτασσόμενος τῇ ἐξουσίᾳ τῇ τοῦ θεοῦ διαταγῇ ἀνθέστηκεν, οἱ δὲ ἀνθεστηκότες ἑαυτοῖς κρίμα λήμψονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/002.yaml
  text: Therefore[a], the one who resists the authority has opposed the ordinance of God[b], and those who have opposed it will receive judgment on themselves.
translation:
  language: id
  text: Karena itu, orang yang menentang kekuasaan itu telah melawan ketetapan Allah[a], dan mereka yang telah melawannya akan menerima penghakiman atas diri mereka sendiri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tatanan yang ditetapkan Allah.”
    reason: διαταγή dapat menunjuk kepada ketetapan, pengaturan, atau tatanan.
  - marker: b
    text: “Penghakiman” juga dapat diterjemahkan “hukuman” atau “putusan hukuman”; kata Yunani di sini tidak dengan sendirinya mengharuskan arti penghukuman kekal.
    reason: Menjaga keluasan makna κρίμα dan menghindari penafsiran eskatologis yang terlalu pasti.
lexical_decisions:
- source_word: ὥστε
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari ayat sebelumnya dengan ungkapan Indonesia yang alami.
- source_word: ὁ ἀντιτασσόμενος
  choice: orang yang menentang
  rationale: Partisipel berartikel ini menunjuk secara umum kepada siapa pun yang mengambil sikap menentang.
- source_word: τῇ ἐξουσίᾳ
  choice: kekuasaan itu
  rationale: Mempertahankan bentuk tunggal dan merujuk kembali kepada kekuasaan pemerintahan dalam konteks Roma 13:1 tanpa mengubahnya menjadi sebutan bagi pribadi penguasa.
- source_word: τῇ τοῦ θεοῦ διαταγῇ
  choice: ketetapan Allah
  rationale: διαταγή menunjuk kepada tatanan atau ketetapan yang telah Allah atur; 'ketetapan' menjaga nuansa resmi tanpa menyiratkan undang-undang tertulis tertentu.
- source_word: ἀνθέστηκεν
  choice: telah melawan
  rationale: Bentuk perfektum menyatakan tindakan atau sikap yang sudah diambil dan tetap relevan; 'telah' menyampaikan aspek tersebut secara wajar.
- source_word: οἱ δὲ ἀνθεστηκότες
  choice: dan mereka yang telah melawannya
  rationale: Mengikuti kesejajaran dengan verba sebelumnya; akhiran '-nya' menyatakan objek yang tersirat dari konteks, yaitu ketetapan Allah dalam kaitannya dengan kekuasaan itu.
- source_word: ἑαυτοῖς
  choice: atas diri mereka sendiri
  rationale: Dativa refleksif menunjukkan bahwa akibat tersebut kembali menimpa para penentang itu sendiri.
- source_word: κρίμα
  choice: penghakiman
  rationale: Pilihan ini mempertahankan cakupan luas κρίμα dan tidak dengan sendirinya menentukan bahwa yang dimaksud adalah penghukuman kekal.
- source_word: λήμψονται
  choice: akan menerima
  rationale: Menyampaikan bentuk futurum secara langsung tanpa memperkuat maknanya menjadi 'pasti dibinasakan' atau tafsiran lain.
theological_decisions:
- issue: Cakupan κρίμα
  choice: penghakiman
  alternative: hukuman; putusan hukuman
  rationale: Ayat ini menyatakan konsekuensi penghakiman bagi orang yang melawan, tetapi tidak secara eksplisit menetapkannya sebagai penghukuman kekal.
- issue: Rujukan ἐξουσία
  choice: kekuasaan pemerintahan dalam konteks, diterjemahkan 'kekuasaan itu'
  alternative: penguasa; pihak yang berwenang
  rationale: Konteks Roma 13:1 menunjukkan kekuasaan pemerintahan, sedangkan bentuk abstrak dalam teks dipertahankan agar tidak dipersempit menjadi satu pejabat tertentu.
- issue: Hubungan antara menentang kekuasaan dan ketetapan Allah
  choice: dipertahankan sebagai pernyataan langsung teks
  alternative: diberi batasan atau pengecualian secara eksplisit dalam ayat
  rationale: Ayat ini sendiri menyatakan hubungan tersebut tanpa menguraikan batas atau pengecualiannya; terjemahan tidak menambahkan penyelesaian teologis yang berasal dari luar ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan alur sebab-akibat, kesejajaran kedua bentuk dari ἀνθίστημι, serta peringatan teologis teks tanpa memperkeras arti κρίμα.
