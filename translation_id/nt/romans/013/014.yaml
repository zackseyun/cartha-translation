id: ROM.13.14
reference: Romans 13:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστόν, καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/014.yaml
  text: But put on the Lord Jesus the Messiah[a], and make no provision for the flesh, for its desires.
translation:
  language: id
  text: Namun, kenakanlah Tuhan Yesus, Sang Mesias, dan janganlah membuat persiapan bagi daging untuk memenuhi keinginan-keinginannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan janganlah mengatur segala sesuatu untuk menuruti keinginan natur berdosa.” Secara harfiah, teks Yunani memakai kata “daging”, yang sering dipakai Paulus untuk merujuk kepada dorongan manusia berdosa, berlawanan dengan kehidupan yang diarahkan oleh Allah.
    reason: Menjelaskan alternatif interpretatif bagi σάρξ serta nuansa πρόνοια dan εἰς ἐπιθυμίας tanpa menggantikan metafora dalam teks utama.
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: kenakanlah
  rationale: 'Imperatif ini mempertahankan metafora pakaian: orang percaya diperintahkan untuk mengenakan Tuhan Yesus sebagai identitas dan pola hidup.'
- source_word: κύριον
  choice: Tuhan
  rationale: Dalam konteks kristologis ini, κύριος merupakan gelar Yesus dan dipertahankan bobot teologisnya dengan padanan baku 'Tuhan'.
- source_word: Χριστόν
  choice: Sang Mesias
  rationale: Χριστός berfungsi sebagai gelar, bukan sekadar unsur nama. 'Sang Mesias' menyampaikan maknanya secara alami dalam bahasa Indonesia.
- source_word: πρόνοιαν μὴ ποιεῖσθε
  choice: janganlah membuat persiapan
  rationale: Ungkapan ini menunjuk pada perencanaan atau pengadaan sebelumnya. 'Membuat persiapan' alami dan mempertahankan gagasan tindakan yang disengaja.
- source_word: σαρκὸς
  choice: daging
  rationale: Padanan harfiah dipertahankan agar istilah khas Paulus dan ketegangan antropologisnya tidak dipersempit menjadi tafsiran 'natur berdosa'.
- source_word: εἰς ἐπιθυμίας
  choice: untuk memenuhi keinginan-keinginannya
  rationale: εἰς dapat menyatakan arah atau tujuan. Rumusan ini menjelaskan bahwa persiapan bagi daging mengarah pada pemenuhan keinginannya, tanpa memakai kata 'hawa nafsu' yang dapat terlalu mempersempit cakupan ἐπιθυμία.
theological_decisions:
- issue: Makna σάρξ dalam konteks etis Paulus
  choice: daging
  alternative: natur berdosa
  rationale: Walaupun konteks menunjuk pada dorongan manusia yang berlawanan dengan hidup yang diarahkan Allah, 'natur berdosa' akan menyelesaikan metafora secara interpretatif. Teks utama mempertahankan 'daging', sedangkan catatan menjelaskan penggunaannya.
- issue: Fungsi Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Di sini Χριστός tetap membawa fungsi gelar. 'Sang Mesias' menyatakan arti gelar itu dengan jelas dan tidak memperlakukannya sebagai nama keluarga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hormat. Bentuk 'kenakanlah' mempertahankan citra pakaian; 'Sang Mesias' menandai Χριστός sebagai gelar; pengulangan 'janganlah' menjaga kekuatan imperatif. Catatan kaki [a] ditempatkan sesudah klausa yang dijelaskannya.
