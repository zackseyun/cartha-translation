id: ROM.13.5
reference: Romans 13:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὸ ἀνάγκη ὑποτάσσεσθαι, οὐ μόνον διὰ τὴν ὀργὴν ἀλλὰ καὶ διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/005.yaml
  text: Therefore it is necessary to submit[a], not only because of wrath but also because of conscience[b],
translation:
  language: id
  text: Karena itu, kita harus tunduk, bukan hanya karena murka[a], tetapi juga karena hati nurani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena hukuman.” Kata Yunani yang dipakai berarti “murka” dan dapat menunjuk pada tindakan penghukuman oleh penguasa atau, secara lebih luas, pada murka Allah yang bekerja melalui pemerintah.
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya tentang pemerintah; ungkapan ini alami dan mempertahankan daya inferensialnya.
- source_word: ἀνάγκη
  choice: kita harus
  rationale: Menyampaikan keharusan yang dinyatakan oleh predikat impersonal Yunani secara wajar dalam bahasa Indonesia; subjek inklusif tersirat dari nasihat dalam konteks.
- source_word: ὑποτάσσεσθαι
  choice: tunduk
  rationale: Mengungkapkan sikap menempatkan diri di bawah wewenang tanpa memperluas maknanya menjadi ketaatan mutlak.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: bukan hanya ... tetapi juga
  rationale: Padanan korelatif Indonesia yang alami dan setia pada struktur kontras-tambahan Yunani.
- source_word: διὰ τὴν ὀργὴν
  choice: karena murka
  rationale: Mempertahankan arti leksikal ὀργή serta ambiguitas mengenai apakah yang dimaksud ialah tindakan penghukuman penguasa atau murka ilahi yang bekerja melalui pemerintah.
- source_word: διὰ τὴν συνείδησιν
  choice: karena hati nurani
  rationale: Menyatakan alasan atau dorongan batin secara langsung dan alami, sesuai fungsi διά dengan akusatif.
theological_decisions:
- issue: Rujukan ὀργή ('murka')
  choice: murka
  alternative: hukuman; murka Allah; tindakan penghukuman penguasa
  rationale: Teks Yunani tidak menyebut pemilik atau pelaku murka secara eksplisit. Konteks memungkinkan kaitan dengan penghukuman oleh penguasa maupun murka ilahi melalui pemerintah, sehingga terjemahan tidak menentukan salah satunya.
- issue: Cakupan ὑποτάσσεσθαι terhadap pemerintah
  choice: tunduk
  alternative: takluk; menundukkan diri
  rationale: Pilihan ini menyatakan sikap yang dituntut terhadap pemerintah, tetapi tidak memasukkan gagasan ketaatan mutlak yang tidak dinyatakan oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Frasa “kita harus tunduk” dipilih agar konstruksi keharusan terdengar alami bagi pembaca umum. Penanda catatan kaki [a] dicantumkan langsung sesudah “murka”.
