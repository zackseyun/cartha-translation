  source_fidelity: 'Teks Indonesia dengan tepat menyampaikan imperatif ἀπόδοτε dan cakupan πᾶσι, serta membedakan empat kewajiban yang disebutkan: φόρος (pajak), τέλος (bea), φόβος (rasa takut), dan τιμή (hormat). Frasa “apa yang menjadi hak mereka” merupakan pengungkapan yang wajar untuk τὰς ὀφειλάς dalam konteks kewajiban yang harus diberikan kepada pihak lain. “Yang patut ditakuti” mempertahankan arti dasar φόβος dan tidak meleburkannya dengan τιμή pada klausa berikutnya.'
