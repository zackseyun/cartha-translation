id: ROM.13.7
reference: Romans 13:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἀπόδοτε πᾶσι τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/007.yaml
  text: 'Pay to all what is owed: to the one due tax, tax; to the one due revenue, revenue; to the one due fear, fear; to the one due honor, honor.'
translation:
  language: id
  text: 'Berikanlah kepada semua orang apa yang menjadi hak mereka: pajak kepada yang berhak menerima pajak; bea kepada yang berhak menerima bea; rasa takut kepada yang patut ditakuti; dan hormat kepada yang patut dihormati.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Berikanlah
  rationale: Kata kerja ini berarti memberikan atau membayarkan apa yang menjadi kewajiban; frasa berikutnya menjelaskan bahwa yang diberikan adalah hak masing-masing.
- source_word: ὀφειλάς
  choice: apa yang menjadi hak mereka
  rationale: Secara harfiah menunjuk pada hal-hal yang terutang atau wajib diberikan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan kewajiban.
- source_word: φόρον
  choice: pajak
  rationale: Istilah ini menunjuk pada pajak langsung atau upeti yang diwajibkan pemerintah.
- source_word: τέλος
  choice: bea
  rationale: Dibedakan dari φόρος dan dapat menunjuk pada pungutan tidak langsung, cukai, atau bea.
- source_word: φόβον
  choice: rasa takut
  rationale: Mempertahankan arti dasar φόβος dan ketegangan ungkapan sumber, tanpa menguranginya secara diam-diam menjadi sekadar rasa hormat.
- source_word: τιμήν
  choice: hormat
  rationale: Dalam konteks ini berarti penghargaan atau penghormatan yang patut diberikan.
theological_decisions:
- issue: Makna φόβος dalam hubungan dengan penguasa
  choice: rasa takut
  alternative: rasa segan / hormat
  rationale: Teks Yunani memakai φόβος, sedangkan τιμή sudah menyatakan hormat dalam klausa berikutnya. Karena itu pembedaan keduanya dipertahankan tanpa menentukan sejauh mana rasa takut tersebut harus dipahami.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan retoris teks Yunani dipertahankan secara alami melalui pola paralel “kepada yang ...”, sementara objek tersirat dibuat eksplisit agar mudah dipahami.
