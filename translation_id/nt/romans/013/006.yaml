id: ROM.13.6
reference: Romans 13:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὰ τοῦτο γὰρ καὶ φόρους τελεῖτε, λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/006.yaml
  text: For because of this you also pay taxes, for they are God’s ministers, devoting themselves to this very thing.
translation:
  language: id
  text: Sebab itulah kamu juga membayar pajak, karena para penguasa adalah pelayan Allah yang terus mengabdikan diri pada tugas ini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Itulah sebabnya
  rationale: Mengungkapkan hubungan sebab-akibat secara alami dalam bahasa Indonesia dan menunjuk kembali pada alasan dalam konteks sebelumnya.
- source_word: φόρους τελεῖτε
  choice: kamu membayar pajak
  rationale: φόρος adalah pajak atau upeti yang diwajibkan pemerintah, sedangkan τελεῖτε dalam konteks ini berarti membayar.
- source_word: λειτουργοὶ θεοῦ
  choice: pelayan-pelayan Allah
  rationale: Mempertahankan gagasan bahwa para penguasa menjalankan pelayanan atau tugas bagi Allah tanpa memberi istilah ini makna jabatan gerejawi.
- source_word: εἰς αὐτὸ τοῦτο προσκαρτεροῦντες
  choice: yang terus mengabdikan diri pada tugas ini
  rationale: προσκαρτερέω menyatakan ketekunan atau pengabdian yang berkelanjutan; 'tugas ini' mempertahankan rujukan umum τοῦτο tanpa mempersempitnya secara berlebihan.
theological_decisions:
- issue: Status para penguasa sebagai λειτουργοὶ θεοῦ
  choice: para penguasa adalah pelayan-pelayan Allah
  alternative: mereka adalah abdi-abdi Allah
  rationale: Terjemahan ini mempertahankan pernyataan Paulus tentang fungsi mereka dalam tatanan Allah, tanpa menyiratkan kesalehan pribadi, legitimasi mutlak, atau jabatan keagamaan.
- issue: Rujukan subjek tersirat εἰσιν
  choice: para penguasa
  alternative: mereka
  rationale: Subjek dijelaskan dari konteks ayat-ayat sebelumnya agar bahasa Indonesia alami, tetapi tidak mengubah identitas rujukannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk jamak 'pelayan-pelayan' dipakai untuk memperjelas kesesuaian dengan 'para penguasa'; 'kamu' mengikuti sapaan jamak yang secara idiomatis dapat ditujukan kepada seluruh pembaca.
