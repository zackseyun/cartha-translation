id: ROM.14.12
reference: Romans 14:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἄρα ἕκαστος ἡμῶν περὶ ἑαυτοῦ λόγον ⸀δώσει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/012.yaml
  text: So then[a], each of us will give an account of himself.
translation:
  language: id
  text: Jadi, setiap orang di antara kita akan memberi pertanggungjawaban mengenai dirinya sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “tentang dirinya sendiri” atau, secara idiomatis, “atas dirinya sendiri.” Bahasa Yunani secara harfiah berbunyi “mengenai dirinya sendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Jadi
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya dengan ungkapan Indonesia yang alami dan tetap mempertahankan daya inferensialnya.
- source_word: ἕκαστος ἡμῶν
  choice: setiap orang di antara kita
  rationale: Menyampaikan sifat distributif ἕκαστος dan genitif partitif ἡμῶν secara jelas dalam bahasa Indonesia modern.
- source_word: περὶ ἑαυτοῦ
  choice: mengenai dirinya sendiri
  rationale: Mempertahankan arti dasar περί dengan genitif, yakni ‘mengenai/tentang’, serta penekanan refleksif bahwa masing-masing orang memberi pertanggungjawaban mengenai dirinya sendiri.
- source_word: λόγον δώσει
  choice: akan memberi pertanggungjawaban
  rationale: Menerjemahkan idiom Yunani dalam konteks evaluatif atau penghakiman, bukan secara harfiah sebagai ‘akan memberi perkataan’.
theological_decisions:
- issue: Objek pertanggungjawaban tidak disebutkan dalam teks SBLGNT
  choice: Tidak menambahkan ‘kepada Allah’ dalam teks utama
  alternative: akan memberi pertanggungjawaban kepada Allah mengenai dirinya sendiri
  rationale: Walaupun konteks sebelumnya mengarah kepada Allah sebagai hakim, teks sumber ayat ini tidak menyatakan objek tidak langsung itu; terjemahan tidak memasukkannya secara tersirat.
- issue: Bentuk refleksif tunggal dalam pernyataan yang berlaku umum
  choice: dirinya sendiri
  alternative: diri mereka masing-masing
  rationale: Bahasa Indonesia dapat mempertahankan bentuk tunggal distributif tanpa menandai gender, selaras dengan ἕκαστος dan ἑαυτοῦ serta tanpa mengubahnya menjadi bentuk jamak.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. ‘Memberi pertanggungjawaban’ mempertahankan nuansa evaluatif idiom Yunani, sedangkan ‘mengenai dirinya sendiri’ sengaja menjaga cakupan preposisi περί tanpa menambahkan pihak penerima yang tidak tertulis dalam ayat ini.
