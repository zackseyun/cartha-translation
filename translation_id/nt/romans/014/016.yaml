  text: Therefore[a], do not let your good be spoken of as evil.
translation:
  language: id
  text: Karena itu, jangan biarkan kebaikan kalian dicela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dihina,” “difitnah,” atau “dihujat.” Kata Yunani ini menunjuk pada perkataan yang menghina atau menjelekkan; “dihujat” lebih harfiah, tetapi dalam bahasa Indonesia dapat terdengar terlalu khusus berkaitan dengan agama.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ … βλασφημείσθω
  choice: jangan biarkan … dicela
  rationale: μή dengan imperatif pasif kini menyatakan larangan. Susunan ini menyampaikan daya larangan dan mempertahankan makna pasif secara alami dalam bahasa Indonesia.
- source_word: βλασφημείσθω (βλασφημέω)
  choice: dicela
  rationale: Dalam konteks ini verba tersebut menunjuk pada perkataan yang menghina, menjelekkan, atau merusak nama sesuatu; objeknya adalah 'yang baik', bukan Allah. 'Dicela' menghindari kesan khusus keagamaan dari 'dihujat' sambil mempertahankan gagasan ujaran negatif.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan atau konsekuensi dari nasihat sebelumnya dan menghubungkan ayat ini dengan alur argumentasi Paulus.
- source_word: ὑμῶν
  choice: bagimu
  rationale: Genitif jamak ini menyatakan hubungan dengan para pembaca. 'Bagimu' cocok secara alami dengan konstruksi 'apa yang baik' dan tidak mempersempit hubungan itu menjadi kepemilikan semata.
- source_word: τὸ ἀγαθόν
  choice: apa yang baik
  rationale: Adjektiva netral berartikel ini dipakai secara substantival. 'Apa yang baik' mempertahankan keluasan acuan Yunani tanpa menentukannya secara berlebihan sebagai kebebasan, hak, atau berkat tertentu.
theological_decisions:
- issue: Acuan τὸ ἀγαθόν yang berhubungan dengan ὑμῶν
  choice: apa yang baik bagimu
  alternative: kebebasanmu; hakmu; hal baik yang kamu miliki
  rationale: Ungkapan Yunani ringkas dan tidak menetapkan satu acuan khusus. Terjemahan luas mempertahankan kemungkinan bahwa ungkapan ini mencakup kebaikan, manfaat, keyakinan, atau kebebasan yang dibahas dalam konteks, tanpa memasukkan tafsiran tertentu ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. 'Apa yang baik bagimu' lebih alami daripada 'kebaikanmu' dan tetap menjaga keluasan serta ambiguitas acuan teks Yunani.
