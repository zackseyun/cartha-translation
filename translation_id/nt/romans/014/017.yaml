id: ROM.14.17
reference: Romans 14:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις, ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/017.yaml
  text: For the kingdom of God is not eating and drinking[a], but righteousness and peace and joy in the Holy Spirit.
translation:
  language: id
  text: Sebab Kerajaan Allah bukanlah soal makan dan minum, melainkan kebenaran[a], damai sejahtera, dan sukacita dalam Roh Kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan.” Kata Yunani δικαιοσύνη dapat berarti kebenaran atau keadilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεία
  choice: Kerajaan
  rationale: “Kerajaan Allah” merupakan ungkapan baku dan alami dalam bahasa Indonesia serta mempertahankan keluasan makna pemerintahan dan ranah kekuasaan Allah.
- source_word: βρῶσις καὶ πόσις
  choice: soal makan dan minum
  rationale: Kedua nomina tindakan diterjemahkan secara sejajar sebagai “makan dan minum.” Kata “soal” membuat kontras predikatif ini alami dalam bahasa Indonesia tanpa mengubah pokok argumennya.
- source_word: δικαιοσύνη
  choice: kebenaran
  rationale: “Kebenaran” adalah padanan Indonesia yang mapan untuk δικαιοσύνη dalam tulisan Paulus dan dapat mencakup keadaan serta perilaku yang benar; kemungkinan makna “keadilan” dipertahankan dalam catatan kaki.
- source_word: εἰρήνη
  choice: damai sejahtera
  rationale: “Damai sejahtera” secara alami menyampaikan kedamaian dan keharmonisan relasional yang dimaksud dalam konteks jemaat.
- source_word: χαρά
  choice: sukacita
  rationale: “Sukacita” merupakan padanan yang alami, bermartabat, dan lazim bagi χαρά dalam konteks Perjanjian Baru.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: dalam Roh Kudus
  rationale: Preposisi “dalam” mempertahankan kemungkinan nuansa ranah maupun sarana dari ἐν, sedangkan “Roh Kudus” sesuai dengan pemakaian Paulus yang merujuk kepada Roh Allah.
- source_word: γάρ
  choice: Sebab
  rationale: “Sebab” mempertahankan hubungan penjelasan ayat ini dengan argumen sebelumnya.
theological_decisions:
- issue: Makna δικαιοσύνη dalam konteks Paulus
  choice: kebenaran
  alternative: keadilan
  rationale: Teks utama memakai padanan Paulus yang lazim tanpa meniadakan dimensi etis dan sosial istilah tersebut; “keadilan” dicantumkan sebagai alternatif leksikal yang sah.
- issue: Nuansa ἐν pada frasa ἐν πνεύματι ἁγίῳ
  choice: dalam Roh Kudus
  alternative: oleh Roh Kudus
  rationale: “Dalam” tidak membatasi frasa itu hanya kepada sarana atau pelaku, sehingga ambiguitas antara ranah dan sarana tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Susunan tiga unsur dipertahankan, dan frasa “dalam Roh Kudus” sengaja tidak diparafrasakan agar nuansa teks sumber tetap terbuka.
