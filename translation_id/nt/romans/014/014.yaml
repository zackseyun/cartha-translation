id: ROM.14.14
reference: Romans 14:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἶδα καὶ πέπεισμαι ἐν κυρίῳ Ἰησοῦ ὅτι οὐδὲν κοινὸν δι’ ⸀ἑαυτοῦ· εἰ μὴ τῷ λογιζομένῳ τι κοινὸν εἶναι, ἐκείνῳ κοινόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/014.yaml
  text: I know and am persuaded in the Lord Jesus that nothing is unclean in itself; except that to the one who considers anything to be unclean[a], to that person it is unclean.
translation:
  language: id
  text: Aku tahu dan yakin dalam Tuhan Yesus bahwa tidak ada sesuatu pun yang najis pada dirinya sendiri. Kecuali bagi orang yang menganggap sesuatu itu najis, baginya sesuatu itu najis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “biasa” atau “cemar”. Kata Yunani ini di sini merujuk pada sesuatu yang dianggap najis, tidak tahir, atau profan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Aku tahu
  rationale: Padanan langsung dan alami untuk verba yang menyatakan pengetahuan; bentuk orang pertama tunggal dipertahankan.
- source_word: πέπεισμαι
  choice: yakin
  rationale: Bentuk perfekt menyatakan keyakinan yang telah terbentuk dan tetap teguh; 'yakin' alami dalam bahasa Indonesia modern.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: dalam Tuhan Yesus
  rationale: Mempertahankan preposisi ἐν dan ambiguitas relasionalnya tanpa mempersempit makna menjadi 'oleh' atau menjelaskannya secara berlebihan.
- source_word: κοινόν
  choice: najis
  rationale: Dalam konteks makanan dan kemurnian, κοινός menunjuk pada sesuatu yang dianggap cemar atau tidak tahir, bukan sekadar biasa atau milik bersama.
- source_word: δι’ ἑαυτοῦ
  choice: pada dirinya sendiri
  rationale: Ungkapan idiomatis yang menyatakan bahwa sesuatu tidak memiliki kenajisan secara intrinsik.
- source_word: τῷ λογιζομένῳ
  choice: bagi orang yang menganggap
  rationale: λογίζομαι di sini berarti memandang atau menilai sesuatu memiliki sifat tertentu; frasa ini alami dan jelas.
- source_word: τι
  choice: sesuatu
  rationale: Menyampaikan objek tak tentu dalam pernyataan umum secara alami dalam bahasa Indonesia.
- source_word: ἐκείνῳ κοινόν
  choice: baginya hal itu najis
  rationale: Mempertahankan penerapan personal dari datif ἐκείνῳ tanpa menambahkan pembatasan gender.
theological_decisions:
- issue: Makna κοινός dalam kaitannya dengan makanan dan kemurnian
  choice: najis
  alternative: biasa; cemar; tidak tahir
  rationale: Konteks Roma 14 mendukung pengertian kenajisan menurut kategori kemurnian dan hati nurani. Pilihan ini tidak menyatakan bahwa benda tersebut najis secara intrinsik, sebab klausa sebelumnya justru menyangkal hal itu.
- issue: Hubungan yang dinyatakan oleh ἐν κυρίῳ Ἰησοῦ
  choice: dalam Tuhan Yesus
  alternative: oleh Tuhan Yesus; dalam persekutuan dengan Tuhan Yesus
  rationale: Terjemahan formal 'dalam' menjaga keluasan dan ketegangan teologis ungkapan Yunani tanpa menentukan apakah keyakinan itu terutama berasal dari otoritas Tuhan atau dari persatuan dengan-Nya.
- issue: Daya klausa εἰ μὴ
  choice: Namun, bagi orang yang menganggap
  alternative: kecuali bahwa bagi orang yang menganggap
  rationale: Dalam konteks ini εἰ μὴ memperkenalkan pengecualian atau kualifikasi praktis terhadap prinsip sebelumnya. 'Namun' menyampaikan kontras dengan wajar tanpa menyiratkan bahwa penilaian hati nurani mengubah sifat intrinsik benda itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'Aku' mengikuti ujaran pribadi Paulus dan lazim dalam teks Alkitab Indonesia. Pengulangan 'najis' mempertahankan struktur serta penekanan sumber Yunani.
