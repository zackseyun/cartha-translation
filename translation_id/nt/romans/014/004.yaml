id: ROM.14.4
reference: Romans 14:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, ⸂δυνατεῖ γὰρ⸃ ὁ ⸀κύριος στῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/004.yaml
  text: Who are you to judge another's household servant? He stands or falls before his own lord[a], and he will be made to stand[c][b], for the Lord is able to make him stand.
translation:
  language: id
  text: Siapakah kamu sehingga menghakimi hamba rumah tangga milik orang lain? Di hadapan tuannya sendiri ia berdiri atau jatuh. Namun, ia akan dibuat berdiri,[a] sebab Tuhan sanggup membuatnya berdiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang sama dapat berarti “Tuhan” atau “tuan”. Karena itu, klausa terakhir juga dapat dipahami sebagai kelanjutan gambaran tentang seorang hamba dan tuannya; tetapi kemungkinan besar Paulus menunjuk kepada Tuhan dalam arti teologis.
    reason: alternative_reading
lexical_decisions:
- source_word: σὺ τίς εἶ ὁ κρίνων
  choice: Siapakah kamu sehingga menghakimi
  rationale: Mempertahankan teguran retoris yang ditegaskan oleh σὺ, sambil memakai susunan bahasa Indonesia yang alami.
- source_word: ἀλλότριον οἰκέτην
  choice: hamba rumah tangga milik orang lain
  rationale: οἰκέτης menunjuk kepada hamba dalam lingkungan rumah tangga dan dalam konteks kuno dapat mencakup orang yang berstatus budak; frasa ini menjaga hubungan kepemilikan tanpa memakai ungkapan Indonesia yang janggal.
- source_word: τῷ ἰδίῳ κυρίῳ
  choice: di hadapan tuannya sendiri
  rationale: Datif menyatakan pihak yang berwenang menilai hamba itu. 'Di hadapan' memperjelas pertanggungjawaban, sedangkan 'tuan' sesuai dengan gambaran hamba rumah tangga.
- source_word: στήκει ἢ πίπτει
  choice: ia berdiri atau jatuh
  rationale: Menjaga metafora dan pertentangan verbal Yunani tanpa menjabarkannya secara interpretatif.
- source_word: σταθήσεται
  choice: ia akan dibuat berdiri
  rationale: Bentuk pasif futur dipertahankan dan mengisyaratkan pelaku ilahi, yang dijelaskan oleh klausa berikutnya.
- source_word: δυνατεῖ γὰρ ὁ κύριος στῆσαι αὐτόν
  choice: sebab Tuhan sanggup membuatnya berdiri
  rationale: Menjaga hubungan alasan melalui γάρ, daya melalui δυνατεῖ, dan pengulangan akar 'berdiri' antara σταθήσεται dan στῆσαι.
theological_decisions:
- issue: Rujukan ὁ κύριος dalam klausa terakhir
  choice: '''Tuhan'' dalam arti teologis'
  alternative: '''tuannya'' dalam kelanjutan perumpamaan tentang hamba'
  rationale: Pemakaian dengan artikel serta konteks Paulus paling wajar menunjuk kepada Tuhan yang berkuasa meneguhkan orang percaya. Namun, kesinambungan dengan gambaran tuan-hamba tetap merupakan kemungkinan nyata dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'berdiri' dipertahankan karena merupakan kaitan penting dalam teks Yunani. 'Hamba rumah tangga' dipilih untuk ketepatan leksikal; catatan mengenai kemungkinan status budak tidak dimasukkan karena tidak diperlukan untuk memahami ayat ini.
