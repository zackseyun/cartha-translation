base_translation:
  language: en
  yaml_path: translation/nt/romans/014/019.yaml
  text: So then[a], let us pursue what makes for peace and what builds up one another.
translation:
  language: id
  text: Karena itu, marilah kita mengejar hal-hal yang mendatangkan damai dan yang berguna untuk saling membangun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “hal-hal yang berkaitan dengan damai dan hal-hal yang berkaitan dengan pembangunan bagi satu sama lain.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Karena itu
  rationale: Gabungan partikel ini menarik kesimpulan dari uraian sebelumnya. “Karena itu” alami dalam bahasa Indonesia dan mempertahankan daya inferensialnya.
- source_word: τὰ τῆς εἰρήνης
  choice: hal-hal yang mendatangkan damai
  rationale: Bentuk jamak netral berartikel dengan genitif menunjuk pada perkara-perkara yang berkenaan dengan atau menghasilkan damai. Ungkapan ini jelas dan tetap dekat dengan maksud sumber.
- source_word: διώκωμεν
  choice: marilah kita mengejar
  rationale: Subjungtif kini yang bersifat ajakan menyerukan tindakan bersama yang berkelanjutan. “Mengejar” mempertahankan daya aktif dan kesungguhan kata Yunani.
- source_word: τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους
  choice: hal-hal ... yang saling membangun
  rationale: οἰκοδομή dipakai secara metaforis untuk penguatan atau pembangunan komunitas, sedangkan εἰς ἀλλήλους menandai arah timbal balik. “Saling membangun” mempertahankan metafora dan menonjolkan mutualitas secara alami.
theological_decisions:
- issue: Cakupan pembangunan komunitas
  choice: Ayat ini mengajak orang percaya secara bersama-sama mengejar damai dan pembangunan timbal balik dalam komunitas.
  alternative: Membacanya semata-mata sebagai peningkatan moral pribadi.
  rationale: Bentuk ajakan orang pertama jamak dan kata timbal balik ἀλλήλους menunjukkan kehidupan bersama, khususnya dalam konteks perselisihan hati nurani di Roma 14.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Pengulangan “hal-hal” mencerminkan struktur paralel Yunani, sementara “mendatangkan damai” dan “saling membangun” menghindari ungkapan yang kaku atau jargon gerejawi.
