id: ROM.14.3
reference: Romans 14:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ἐσθίων τὸν μὴ ἐσθίοντα μὴ ἐξουθενείτω, ⸂ὁ δὲ⸃ μὴ ἐσθίων τὸν ἐσθίοντα μὴ κρινέτω, ὁ θεὸς γὰρ αὐτὸν προσελάβετο.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/003.yaml
  text: The one who eats must not despise the one who does not eat[a], and the one who does not eat must not judge the one who eats[c][b], for God has welcomed him.
translation:
  language: id
  text: Orang yang makan janganlah memandang hina orang yang tidak makan[a], dan orang yang tidak makan janganlah menghakimi orang yang makan[b], sebab Allah telah menerima dia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “meremehkan” atau “memperlakukan dengan hina.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menjatuhkan penilaian terhadap.”
    reason: lexical_alternative
  - marker: c
    text: Atau “telah menyambut dia.” Kata kerja Yunaninya dapat mengandung makna menerima seseorang ke dalam persekutuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐσθίων
  choice: orang yang makan
  rationale: Partisipel kini berartikel ini berfungsi sebagai nomina dan menunjuk pada orang yang dicirikan oleh tindakannya makan. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan bentuk umum teks Yunani.
- source_word: τὸν μὴ ἐσθίοντα
  choice: orang yang tidak makan
  rationale: Pilihan ini mempertahankan kesejajaran langsung dengan 'orang yang makan' tanpa menambahkan bahwa orang tersebut berpantang dari makanan tertentu.
- source_word: ἐξουθενείτω
  choice: janganlah memandang hina
  rationale: Kata kerja ini berarti menganggap seseorang tidak berarti atau memperlakukannya dengan sikap merendahkan. 'Memandang hina' menyampaikan unsur penghinaan secara jelas dan wajar.
- source_word: ὁ δὲ μὴ ἐσθίων
  choice: dan orang yang tidak makan
  rationale: δέ menandai peralihan yang kontras. 'Dan' menjaga kelancaran pasangan larangan timbal balik, sementara kontrasnya tetap nyata dari susunan kalimat.
- source_word: κρινέτω
  choice: janganlah menghakimi
  rationale: κρίνω di sini menunjuk pada tindakan menjatuhkan penilaian terhadap sesama. 'Menghakimi' mempertahankan cakupan yang lebih luas daripada 'menghukum' atau 'menyatakan bersalah'.
- source_word: γὰρ
  choice: sebab
  rationale: Kata ini memperkenalkan dasar bagi kedua larangan sebelumnya. 'Sebab' alami dalam register Alkitab Indonesia modern dan jelas menunjukkan hubungan penjelasan.
- source_word: αὐτόν
  choice: dia
  rationale: Pronomina tunggal ini dipertahankan tanpa menggantinya dengan sebutan yang mempersempit rujukannya. Dalam susunan terdekat, rujukannya adalah orang yang makan, tetapi argumen timbal balik ayat ini memberi prinsip yang lebih luas.
- source_word: προσελάβετο
  choice: telah menerima
  rationale: Dalam konteks ini kata kerja tersebut menyatakan penerimaan seseorang, termasuk nuansa menyambutnya ke dalam persekutuan. 'Telah menerima' alami dan tidak membatasi makna pada sambutan awal semata.
theological_decisions:
- issue: Cakupan pertentangan antara makan dan tidak makan
  choice: Menerjemahkan secara umum sebagai 'makan' dan 'tidak makan'.
  alternative: Menjelaskannya sebagai makan segala jenis makanan berlawanan dengan berpantang dari makanan tertentu atau sebagai vegetarianisme.
  rationale: Ayat ini sendiri memakai ungkapan umum. Rincian dari konteks tidak dimasukkan ke dalam teks utama agar terjemahan tidak mempersempit maksud Paulus.
- issue: Rujukan αὐτόν dalam pernyataan bahwa Allah telah menerimanya
  choice: Mempertahankan pronomina tunggal 'dia'.
  alternative: Mengganti dengan 'orang itu', menerangkan secara eksplisit bahwa yang dimaksud ialah orang yang makan, atau memperluasnya menjadi kedua pihak.
  rationale: Anteseden gramatikal terdekat ialah orang yang makan, tetapi bentuk argumen timbal balik membuat alasan ini relevan bagi cara kedua pihak memperlakukan sesama yang telah diterima Allah. Pronomina tunggal menjaga bentuk dan ketegangan retoris teks.
- issue: Sifat penerimaan oleh Allah
  choice: Menggunakan 'telah menerima' tanpa menjelaskan status denominasi atau doktrin tertentu.
  alternative: Menggunakan ungkapan yang secara eksplisit menyatakan keselamatan, pembenaran, atau keanggotaan gereja.
  rationale: προσλαμβάνομαι mengandung nuansa menerima atau menyambut ke dalam persekutuan, tetapi ayat ini tidak menguraikan seluruh implikasi teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel dipertahankan agar larangan timbal balik tampak jelas. 'Janganlah' sesuai untuk larangan orang ketiga dalam register Alkitab tanpa terdengar terlalu arkais; 'dia' mempertahankan pronomina tunggal dan tidak memaksakan penyelesaian atas cakupan retorisnya.
