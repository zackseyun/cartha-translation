  text: Τὸν δὲ ἀσθενοῦντα τῇ πίστει προσλαμβάνεσθε, μὴ εἰς διακρίσεις διαλογισμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/001.yaml
  text: Receive the one who is weak in faith[b][a], not for disputes over opinions.
translation:
  language: id
  text: Terimalah[a] orang yang lemah dalam iman, bukan untuk memperdebatkan berbagai pendapat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sambutlah.” Kata Yunani ini dapat berarti menerima seseorang ke dalam pergaulan atau persekutuan.'
    reason: lexical_alternative
  - marker: b
    text: Frasa ini juga dapat diterjemahkan “bukan untuk menghakimi berbagai pendapat” atau “bukan untuk bertengkar tentang berbagai pertimbangan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσθενοῦντα
  choice: orang yang lemah
  rationale: Partisipel kini dengan artikel berfungsi sebagai nomina. Ungkapan ini mempertahankan sifat kelemahan tanpa menambahkan 'hati nurani', yang tidak disebutkan dalam teks.
- source_word: τῇ πίστει
  choice: dalam iman
  rationale: Datif menunjukkan ranah atau segi kelemahan orang tersebut. 'Dalam iman' mempertahankan πίστις sebagai 'iman' tanpa mengubahnya menjadi rumusan tentang kumpulan ajaran.
- source_word: προσλαμβάνεσθε
  choice: Terimalah
  rationale: Imperatif medium ini berarti menerima seseorang ke dalam pergaulan atau persekutuan. 'Terimalah' cukup luas dan wajar; kemungkinan 'sambutlah' dicatat dalam catatan kaki.
- source_word: μὴ εἰς
  choice: tetapi bukan untuk
  rationale: Konstruksi ini menyatakan tujuan yang harus dihindari. Penambahan 'tetapi' membuat pertentangan tersirat terbaca alami dalam bahasa Indonesia tanpa mengubah maksudnya.
- source_word: διακρίσεις
  choice: memperdebatkan
  rationale: Dalam konteks ini kata tersebut menunjuk pada penilaian atau pembedaan yang menimbulkan perselisihan, bukan sekadar pembedaan netral.
- source_word: διαλογισμῶν
  choice: berbagai pendapat
  rationale: Bentuk genitif ini dapat menunjuk pada pemikiran, pertimbangan, atau pendapat yang diperdebatkan. 'Berbagai pendapat' jelas bagi pembaca modern, sementara kemungkinan lain dipertahankan dalam catatan kaki.
- source_word: δὲ
  choice: tetapi
  rationale: Daya penghubung δέ tercermin secara alami dalam pertentangan antara perintah menerima dan larangan menerima dengan tujuan yang keliru, tanpa menambahkan penanda waktu seperti 'sekarang'.
theological_decisions:
- issue: Makna πίστις
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Konteks membahas kelemahan seorang percaya dalam keyakinannya mengenai praktik yang diperselisihkan. 'Iman' mempertahankan istilah teologis yang lazim tanpa mempersempitnya menjadi hati nurani atau kumpulan doktrin.
- issue: Hubungan frasa διακρίσεις διαλογισμῶν
  choice: memperdebatkan berbagai pendapat
  alternative: menghakimi pertimbangan-pertimbangannya; bertengkar tentang berbagai pemikiran
  rationale: Susunan Yunani memungkinkan nuansa perselisihan, penilaian, atau pembedaan atas pemikiran. Teks utama memakai ungkapan Indonesia yang jelas, sedangkan ambiguitas yang nyata dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan langsung. Imperatif jamak Yunani diterjemahkan dengan bentuk umum 'Terimalah', yang wajar untuk seruan kepada jemaat. Struktur kalimat dijaga ringkas, sedangkan ambiguitas frasa penutup tidak diselesaikan secara sepihak.
