id: ROM.14.2
reference: Romans 14:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς μὲν πιστεύει φαγεῖν πάντα, ὁ δὲ ἀσθενῶν λάχανα ἐσθίει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/002.yaml
  text: One person believes he may eat anything[b][a], but the one who is weak eats vegetables.
translation:
  language: id
  text: Yang seorang percaya bahwa ia boleh makan segala sesuatu, tetapi orang yang lemah makan sayur-sayuran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς μὲν
  choice: Yang seorang
  rationale: Menyampaikan anggota pertama dari kontras μὲν ... δὲ secara alami dalam bahasa Indonesia dan mempertahankan bentuk tunggal yang representatif.
- source_word: πιστεύει
  choice: percaya
  rationale: Dengan infinitif φαγεῖν, kata ini menyatakan keyakinan pribadi mengenai apa yang boleh dimakan, bukan secara khusus iman yang menyelamatkan.
- source_word: φαγεῖν πάντα
  choice: bahwa ia boleh makan segala sesuatu
  rationale: Bentuk 'boleh' mengungkapkan izin yang tersirat dalam konteks perbedaan praktik makanan, sedangkan 'segala sesuatu' mempertahankan cakupan πάντα.
- source_word: ὁ δὲ
  choice: tetapi orang
  rationale: Menandai anggota kedua yang berlawanan tanpa menambahkan gagasan bahwa tokoh ini harus orang tertentu atau laki-laki.
- source_word: ἀσθενῶν
  choice: yang lemah
  rationale: Partisip substantival ini dipertahankan tanpa menambahkan 'dalam iman' ke teks ayat, karena penjelasan tersebut berasal dari konteks Roma 14:1.
- source_word: λάχανα
  choice: sayur-sayuran
  rationale: Padanan modern dan luas untuk hasil kebun atau sayuran; lebih tepat daripada 'rempah-rempah' atau 'dedaunan'.
- source_word: ἐσθίει
  choice: hanya makan
  rationale: Kata 'hanya' tidak terdapat sebagai unsur leksikal tersendiri dalam bahasa Yunani, tetapi pembatasan makanan tersirat kuat dalam kontras antara πάντα dan λάχανα; catatan kaki menjaga transparansi terhadap bentuk sumber.
theological_decisions:
- issue: Sifat kelemahan dalam ἀσθενῶν
  choice: yang lemah
  alternative: yang lemah imannya
  rationale: Ayat 2 sendiri hanya menyebut orang itu 'lemah'; konteks ayat 1 mengaitkannya dengan iman dalam persoalan makanan. Teks utama mempertahankan ketegangan dan tidak memperluas bunyi ayat.
- issue: Eksklusivitas pola makan sayuran
  choice: hanya makan sayur-sayuran
  alternative: makan sayur-sayuran
  rationale: Kontras dengan orang yang makan segala sesuatu menunjukkan bahwa sayuran merupakan batas pola makan orang yang lemah. Karena 'hanya' bersifat implisit, hal itu dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'Yang seorang ... tetapi orang yang ...' menjaga kontras antarkedua pribadi. 'Ia' dipakai secara netral dalam bentuk tunggal.
