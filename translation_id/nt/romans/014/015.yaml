  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ ⸀γὰρ διὰ βρῶμα ὁ ἀδελφός σου λυπεῖται, οὐκέτι κατὰ ἀγάπην περιπατεῖς. μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/015.yaml
  text: For if your brother is grieved because of food[a], you are no longer walking according to love[c][b]. Do not destroy that one with your food—the one for whom Messiah died.
translation:
  language: id
  text: Sebab, jika saudaramu[a] menjadi sedih karena makanan, engkau tidak lagi berjalan menurut kasih. Jangan membinasakan[b] orang itu dengan makananmu—orang yang untuknya Mesias[c] telah mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saudara atau saudarimu”; kata Yunani untuk “saudara” berbentuk maskulin, tetapi dapat mewakili sesama orang percaya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “rusakkan” atau “sebabkan binasa.” Kata kerja Yunani ini sangat kuat dan dapat menunjuk pada kerusakan rohani yang berat; ayat ini sendiri tidak menentukan implikasi doktrinalnya secara tepat.
    reason: alternative_reading
  - marker: c
    text: 'Yunani: “Kristus”; istilah itu berarti “Yang Diurapi” dan di sini berfungsi sebagai gelar, sehingga diterjemahkan “Mesias.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα / βρώματι
  choice: makanan / dengan makananmu
  rationale: Kata ini menunjuk pada makanan secara umum, bukan khusus daging. Bentuk datif pada τῷ βρώματί σου menyatakan sarana atau penyebab, sehingga diterjemahkan “dengan makananmu”.
- source_word: ἀδελφός
  choice: saudaramu
  rationale: Bentuk Yunani adalah maskulin tunggal. “Saudaramu” mempertahankan bentuk tunggal dan hubungan kekeluargaan dalam komunitas iman tanpa menambahkan unsur yang tidak dinyatakan.
- source_word: λυπεῖται
  choice: menjadi sedih
  rationale: Bentuk ini menyatakan bahwa orang tersebut mengalami kesedihan atau dukacita. “Menjadi sedih” alami dalam bahasa Indonesia dan tidak menentukan lebih jauh sifat luka yang dialaminya.
- source_word: κατὰ ἀγάπην
  choice: menurut kasih
  rationale: Terjemahan ini mempertahankan arti κατὰ sebagai ukuran atau norma yang mengarahkan perilaku.
- source_word: περιπατεῖς
  choice: berjalan
  rationale: Metafora etis Paulus dipertahankan, bukan diratakan menjadi sekadar “hidup” atau “berperilaku”.
- source_word: ἀπόλλυε
  choice: binasakan
  rationale: Kata kerja ini merupakan larangan yang kuat dan dapat berarti merusakkan atau menyebabkan kebinasaan. “Binasakan” mempertahankan bobot peringatannya tanpa menentukan akibat doktrinal secara lebih sempit.
- source_word: ἐκεῖνον
  choice: orang itu
  rationale: Demonstrativa ini memberi penekanan pada pribadi tertentu yang sedang dibicarakan; “orang itu” mempertahankan tekanan tersebut secara alami.
- source_word: ὑπὲρ οὗ
  choice: yang baginya
  rationale: ὑπέρ dengan genitif menyatakan tindakan demi atau untuk kepentingan seseorang. “Yang baginya” ringkas dan mempertahankan nuansa perwakilan atau pengorbanan.
- source_word: Χριστός
  choice: Mesias
  rationale: Di sini Χριστός berfungsi sebagai gelar. “Mesias” menyampaikan makna gelar tersebut dalam bahasa Indonesia.
- source_word: ἀπέθανεν
  choice: telah mati
  rationale: Aoristus menunjuk pada peristiwa kematian yang telah terjadi; “telah mati” menyatakannya secara wajar dalam bahasa Indonesia.
- source_word: εἰ γὰρ
  choice: Sebab, jika
  rationale: “Sebab” mempertahankan hubungan argumentatif dengan kalimat sebelumnya, sedangkan “jika” mempertahankan bentuk kondisional.
theological_decisions:
- issue: Kekuatan makna ἀπόλλυε terhadap saudara yang lemah
  choice: Jangan binasakan
  alternative: Jangan rusakkan; jangan menyebabkan dia binasa
  rationale: Kata kerja Yunani sengaja kuat, tetapi ayat ini tidak menjelaskan apakah yang dimaksud ialah kerusakan rohani berat dalam kehidupan kini atau kebinasaan akhir. Terjemahan mempertahankan ketegangan itu tanpa memutuskan perdebatan tentang kemurtadan atau keselamatan.
- issue: Cakupan rujukan ἀδελφός
  choice: saudaramu
  alternative: saudara atau saudarimu; sesama orang percaya
  rationale: Bentuk sumber adalah maskulin tunggal, tetapi dalam konteks komunitas dapat dipakai secara representatif bagi sesama orang percaya. Bentuk sumber dipertahankan dalam teks utama dan cakupan yang mungkin lebih luas dijelaskan dalam catatan kaki.
- issue: Penerjemahan gelar Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Istilah ini berfungsi sebagai gelar bagi Yang Diurapi. “Mesias” mengungkapkan fungsi gelarnya, sementara bentuk tradisional “Kristus” dicatat sebagai padanan alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora Paulus “berjalan menurut kasih” dipertahankan karena dapat dipahami dan membawa bobot etis teks. Susunan kalimat kedua dibuat alami sambil mempertahankan penekanan demonstratif “orang itu” dan hubungan pengorbanan Mesias dengannya.
