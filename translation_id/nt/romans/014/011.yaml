  text: γέγραπται γάρ· Ζῶ ἐγώ, λέγει κύριος, ὅτι ἐμοὶ κάμψει πᾶν γόνυ, καὶ ⸂πᾶσα γλῶσσα ἐξομολογήσεται⸃ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/011.yaml
  text: 'For it is written: “As I live[a], says the Lord, every knee will bow to me, and every tongue will confess to God.”'
translation:
  language: id
  text: Sebab ada tertulis, “Demi Aku yang hidup, firman Tuhan, setiap lutut akan bertelut kepada-Ku, dan setiap lidah akan mengaku kepada Allah[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan mengakui Allah” atau “akan memuji Allah.” Kata Yunani ini dapat mengandung nuansa mengaku, mengakui, atau memuji, tergantung konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: ada tertulis
  rationale: Ungkapan baku bahasa Indonesia untuk formula perfektum pasif yang memperkenalkan kutipan Kitab Suci dan menegaskan keberlakuan tulisan itu.
- source_word: Ζῶ ἐγώ
  choice: Demi Aku yang hidup
  rationale: Dalam konteks ini ungkapan tersebut merupakan rumusan sumpah ilahi. Terjemahan ini menyampaikan daya khidmatnya secara alami tanpa mereduksinya menjadi pernyataan biasa, “Aku hidup.”
- source_word: λέγει κύριος
  choice: firman Tuhan
  rationale: Ungkapan Indonesia yang alami dan bermartabat untuk perkataan ilahi; “Tuhan” mempertahankan padanan langsung κύριος tanpa mengubahnya menjadi nama ilahi yang tidak tertulis dalam teks Yunani.
- source_word: ἐμοὶ κάμψει πᾶν γόνυ
  choice: setiap lutut akan bertekuk di hadapan-Ku
  rationale: Mempertahankan gambaran jasmani dan makna tunduk atau menyembah. “Di hadapan-Ku” adalah ungkapan Indonesia yang alami untuk datif ἐμοί bersama tindakan bertekuk lutut.
- source_word: πᾶσα γλῶσσα
  choice: setiap lidah
  rationale: Mempertahankan metafora tubuh dan gema Kitab Suci, alih-alih meratakannya menjadi “setiap orang.”
- source_word: ἐξομολογήσεται
  choice: akan mengaku
  rationale: Kata kerja ini dapat menyatakan pengakuan terbuka, pengakuan akan sesuatu, atau pujian. “Mengaku” mempertahankan keluasan dasarnya, sementara nuansa lain dicatat dalam catatan kaki.
- source_word: τῷ θεῷ
  choice: kepada Allah
  rationale: Menerjemahkan datif secara eksplisit dan mempertahankan peralihan asli dari “di hadapan-Ku” kepada “kepada Allah.”
theological_decisions:
- issue: Hubungan antara “Tuhan,” “Aku,” dan “Allah” dalam kutipan
  choice: Mempertahankan bentuk “firman Tuhan ... di hadapan-Ku ... kepada Allah” tanpa menyelaraskan rujukannya.
  alternative: Mengubah frasa terakhir menjadi “kepada-Ku” atau secara eksplisit menafsirkan “Tuhan” sebagai Yesus dalam teks terjemahan.
  rationale: Teks Yunani sendiri beralih dari perkataan ilahi orang pertama kepada frasa “kepada Allah.” Terjemahan mempertahankan bentuk dan ketegangan teologis itu tanpa memasukkan kesimpulan doktrinal ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Kapitalisasi “Aku” dan “-Ku” menandai pembicara ilahi dalam kutipan. Rumusan “Demi Aku yang hidup” mempertahankan corak sumpah, sedangkan “setiap lutut” dan “setiap lidah” menjaga citra puitis teks sumber.
