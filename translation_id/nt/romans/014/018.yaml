  text: ὁ γὰρ ἐν ⸀τούτῳ δουλεύων τῷ Χριστῷ εὐάρεστος τῷ θεῷ καὶ δόκιμος τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/018.yaml
  text: For the one who serves the Messiah in this way is pleasing to God and approved by men.
translation:
  language: id
  text: Sebab orang yang melayani Kristus dengan cara demikian berkenan kepada Allah dan diakui oleh orang lain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: dengan cara demikian
  rationale: Ungkapan ini menunjuk kembali pada cara hidup yang dibahas dalam konteks sebelumnya; terjemahan ini alami dalam bahasa Indonesia dan tidak mempersempit rujukannya secara berlebihan.
- source_word: δουλεύων τῷ Χριστῷ
  choice: melayani Kristus
  rationale: Mengungkapkan pengabdian sebagai hamba kepada Kristus dengan idiom Indonesia yang wajar dan bermartabat.
- source_word: εὐάρεστος τῷ θεῷ
  choice: berkenan kepada Allah
  rationale: Padanan Alkitabiah Indonesia yang alami untuk sesuatu atau seseorang yang menyenangkan dan diterima Allah.
- source_word: δόκιμος τοῖς ἀνθρώποις
  choice: diakui oleh orang lain
  rationale: δόκιμος menyatakan telah terbukti atau dipandang layak/diterima; 'diakui' mempertahankan gagasan penilaian positif, sedangkan τοῖς ἀνθρώποις dalam konteks umum paling alami diterjemahkan 'orang lain'.
theological_decisions:
- issue: Rujukan ἐν τούτῳ
  choice: dengan cara demikian
  alternative: dalam hal ini
  rationale: Bentuk tunggal τούτῳ memiliki kemungkinan rujukan kontekstual, tetapi frasa ini dibiarkan cukup terbuka dan tidak ditafsirkan secara sempit hanya sebagai satu unsur tertentu dari ayat sebelumnya.
- issue: Makna penerimaan oleh manusia
  choice: diakui oleh orang lain
  alternative: terbukti layak di hadapan manusia
  rationale: Terjemahan tidak menyatakan bahwa penilaian manusia menjadi dasar penerimaan Allah; kedua penilaian tetap sejajar sebagaimana dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, jelas, dan bermartabat. Konjungsi 'Sebab' mempertahankan fungsi γάρ sebagai alasan bagi pernyataan sebelumnya.
