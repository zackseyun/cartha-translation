id: ROM.14.8
reference: Romans 14:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐάν τε γὰρ ζῶμεν, τῷ κυρίῳ ζῶμεν, ἐάν τε ἀποθνῄσκωμεν, τῷ κυρίῳ ἀποθνῄσκομεν. ἐάν τε οὖν ζῶμεν ἐάν τε ἀποθνῄσκωμεν, τοῦ κυρίου ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/008.yaml
  text: For if we live[a], we live to the Lord, and if we die, we die to the Lord. So then, whether we live or whether we die[b], we are the Lord’s.
translation:
  language: id
  text: Sebab jika kita hidup, kita hidup bagi Tuhan[a], dan jika kita mati, kita mati bagi Tuhan. Jadi, baik kita hidup maupun kita mati, kita adalah milik Tuhan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk Tuhan” dalam kedua frasa “kita hidup bagi Tuhan” dan “kita mati bagi Tuhan”. Bentuk datif Yunani dapat menyatakan hubungan, arah, atau kepentingan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “kita kepunyaan Tuhan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: Sebab jika
  rationale: γάρ dipertahankan sebagai penghubung penjelas, sedangkan ἐάν τε membuka pasangan kondisi. “Sebab jika” alami dalam bahasa Indonesia dan mempertahankan hubungan dengan ayat sebelumnya.
- source_word: ζῶμεν / ζῶμεν
  choice: kita hidup / kita hidup
  rationale: ζάω diterjemahkan secara konsisten dengan “hidup”; perbedaan modus verba Yunani tidak perlu dibedakan secara artifisial dalam bahasa Indonesia.
- source_word: τῷ κυρίῳ
  choice: bagi Tuhan
  rationale: Dativus Yunani menyatakan hubungan, arah, atau kepentingan. “Bagi Tuhan” alami dalam bahasa Indonesia, mempertahankan pola pengulangan, dan tidak membatasi maknanya hanya pada pelayanan.
- source_word: κύριος
  choice: Tuhan
  rationale: “Tuhan” adalah padanan baku dan bermartabat bagi κύριος sebagai gelar; konteks berikutnya menunjuk kepada Kristus tanpa perlu menambahkan nama-Nya dalam ayat ini.
- source_word: ἀποθνῄσκωμεν / ἀποθνῄσκομεν
  choice: kita mati / kita mati
  rationale: Bentuk kini Yunani di sini menyatakan keadaan atau peristiwa secara umum, sehingga padanan sederhana “mati” paling tepat.
- source_word: οὖν
  choice: Jadi
  rationale: οὖν menyatakan kesimpulan dari dua klausa sebelumnya; “Jadi” merupakan penghubung inferensial yang jelas dan alami.
- source_word: τοῦ κυρίου ἐσμέν
  choice: kita adalah milik Tuhan
  rationale: Genitivus ini paling wajar dipahami sebagai kepemilikan atau keberadaan dalam hubungan dengan Tuhan. “Adalah milik Tuhan” jelas, alami, dan mempertahankan tekanan pada kebermilikan.
theological_decisions:
- issue: Rujukan dan bobot κύριος
  choice: Gelar “Tuhan” dipertahankan tanpa memperjelas rujukannya di dalam teks ayat.
  alternative: “Tuhan Yesus” atau “Penguasa”
  rationale: Roma 14:9 mengarahkan pembaca kepada Kristus, tetapi ayat ini sendiri hanya memakai κύριος. Terjemahan tidak boleh menambahkan penjelasan yang tidak dinyatakan secara eksplisit.
- issue: Nuansa hidup dan mati τῷ κυρίῳ
  choice: “bagi Tuhan” mempertahankan orientasi dan hubungan kepada Tuhan.
  alternative: “untuk Tuhan” atau “dalam hubungan dengan Tuhan”
  rationale: Dativus dapat mengandung nuansa relasi, orientasi, atau kepentingan. Kesimpulan bahwa kita milik Tuhan menegaskan kebermilikan, tetapi frasa sebelumnya tidak dipersempit hanya menjadi pelayanan atau manfaat.
translation_notes:
  register: Bahasa Indonesia modern yang baku, sederhana, dan bermartabat. Struktur berimbang dari teks Yunani dipertahankan melalui pengulangan “kita hidup” dan “kita mati”; “baik ... maupun ...” digunakan untuk menyampaikan pasangan alternatif secara alami.
