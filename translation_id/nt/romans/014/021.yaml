  text: καλὸν τὸ μὴ φαγεῖν κρέα μηδὲ πιεῖν οἶνον μηδὲ ἐν ᾧ ὁ ἀδελφός σου προσκόπτει ⸂ἢ σκανδαλίζεται ἢ ἀσθενεῖ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/021.yaml
  text: It is good not to eat meat or drink wine or do anything by which your brother stumbles or is offended or is weakened[a].
translation:
  language: id
  text: Yang baik ialah tidak makan daging, tidak minum anggur, atau melakukan apa pun yang membuat saudaramu tersandung, terjerat, atau menjadi lemah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks ini, “saudaramu” dapat mencakup saudara atau saudari seiman, yaitu sesama orang percaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: Lebih baik
  rationale: Dalam konteks nasihat etis ini, καλόν menilai tindakan menahan diri sebagai pilihan yang baik dan patut; “lebih baik” secara alami menyatakan bahwa tindakan itu lebih utama demi sesama, tanpa menjadikannya larangan mutlak.
- source_word: τὸ μὴ φαγεῖν κρέα
  choice: tidak makan daging
  rationale: Menerjemahkan infinitif berartikel secara lugas dan memahami κρέα sebagai daging untuk makanan.
- source_word: μηδὲ πιεῖν οἶνον
  choice: atau minum anggur
  rationale: μηδέ mengoordinasikan bentuk penahanan diri berikutnya; ungkapan ini alami dalam bahasa Indonesia.
- source_word: μηδὲ ἐν ᾧ
  choice: atau melakukan apa pun yang membuat
  rationale: Bahasa Yunani bersifat eliptis, secara harfiah “ataupun dalam/dengan apa”; kata kerja “melakukan” dan cakupan “apa pun” disuplai agar maknanya jelas dan alami.
- source_word: ὁ ἀδελφός σου
  choice: saudaramu
  rationale: Mempertahankan bentuk maskulin tunggal dan istilah kekerabatan rohani; dalam konteks, kata ini dapat mewakili sesama orang percaya, sebagaimana dijelaskan dalam catatan kaki.
- source_word: προσκόπτει
  choice: tersandung
  rationale: Mempertahankan metafora tentang mengalami hambatan moral atau rohani.
- source_word: σκανδαλίζεται
  choice: terjerat
  rationale: Membedakannya dari προσκόπτει sambil mempertahankan nuansa pasif tentang dijebak atau dibawa ke dalam kejatuhan; “tersinggung” dalam bahasa Indonesia modern mudah dipahami sekadar sebagai perasaan sakit hati.
- source_word: ἀσθενεῖ
  choice: menjadi lemah
  rationale: Menjaga keluasan makna tentang pelemahan dalam konteks iman dan hati nurani tanpa menambahkan kata “rohani” yang tidak tersurat.
theological_decisions:
- issue: Cakupan ἀδελφός sebagai sebutan representatif
  choice: saudaramu
  alternative: saudara atau saudarimu; sesama orang percaya
  rationale: Teks Yunani memakai bentuk maskulin tunggal. Teks utama mempertahankannya, sedangkan cakupan kontekstual yang mungkin meliputi laki-laki dan perempuan dijelaskan dalam catatan kaki.
- issue: Hubungan tiga verba προσκόπτει, σκανδαλίζεται, dan ἀσθενεῖ
  choice: tersandung, terjerat, atau menjadi lemah
  alternative: tersandung, tersinggung, atau menjadi lemah
  rationale: Ketiga unsur dipertahankan agar varian teks yang dicetak SBLGNT tidak diringkas. “Terjerat” menjaga perbedaan dari “tersandung” dan menghindari penyempitan σκανδαλίζεται menjadi rasa tersinggung belaka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat langsung dan mudah dipahami, sementara elipsis Yunani dijelaskan secara minimal melalui “melakukan apa pun”. Marker [a] muncul dalam teks utama.
