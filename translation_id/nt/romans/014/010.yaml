id: ROM.14.10
reference: Romans 14:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ ⸀θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/010.yaml
  text: But you[a], why do you judge your brother? Or you also, why do you despise your brother? For we will all stand before the judgment seat of God[b],
translation:
  language: id
  text: Namun engkau, mengapa engkau menghakimi saudaramu? Atau engkau juga, mengapa engkau memandang rendah saudaramu? Sebab kita semua akan berdiri di hadapan takhta pengadilan Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian naskah berbunyi, “takhta pengadilan Kristus.”
    reason: textual_variant
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Namun engkau
  rationale: Mempertahankan daya pertentangan δέ dan penekanan pada σύ yang ditempatkan di depan, dengan susunan Indonesia yang wajar dan tegas.
- source_word: τί κρίνεις
  choice: mengapa engkau menghakimi
  rationale: Dalam pertanyaan retoris ini, τί paling wajar berarti 'mengapa'. 'Menghakimi' mempertahankan cakupan κρίνω tanpa mempersempitnya menjadi 'menghukum'.
- source_word: τὸν ἀδελφόν σου
  choice: saudaramu
  rationale: Menerjemahkan bentuk maskulin tunggal ἀδελφόν secara langsung; dalam konteks ini yang dimaksud ialah saudara seiman, tetapi penjelasan itu tidak disisipkan ke dalam teks.
- source_word: ἢ καὶ σὺ
  choice: Atau engkau juga
  rationale: Mempertahankan penekanan pada orang kedua dan daya aditif καί.
- source_word: τί ἐξουθενεῖς
  choice: mengapa engkau memandang rendah
  rationale: ἐξουθενέω berarti menganggap seseorang tidak berarti atau memperlakukannya dengan hina. 'Memandang rendah' alami dalam bahasa Indonesia dan sesuai dengan teguran dalam konteks.
- source_word: πάντες γὰρ
  choice: Sebab kita semua
  rationale: γάρ memberi alasan, sedangkan πάντες dalam bentuk verbal orang pertama jamak mencakup Paulus dan para pembacanya.
- source_word: παραστησόμεθα
  choice: akan berdiri di hadapan
  rationale: Dalam konteks pengadilan, bentuk ini menggambarkan tampil atau berdiri di hadapan pihak yang mengadili.
- source_word: τῷ βήματι
  choice: takhta pengadilan
  rationale: βῆμα menunjuk pada tempat duduk resmi seorang hakim atau tribunal. 'Takhta pengadilan' mempertahankan gambaran konkret sekaligus nuansa yudisialnya.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Mengikuti langsung bacaan SBLGNT τοῦ θεοῦ dan menghasilkan frasa Indonesia yang alami, 'takhta pengadilan Allah'.
theological_decisions:
- issue: Identitas pemilik takhta pengadilan tempat semua orang akan berdiri
  choice: Allah
  alternative: Kristus
  rationale: Teks SBLGNT yang diberikan berbunyi τοῦ θεοῦ, sehingga 'Allah' dipakai dalam teks utama. Bacaan 'Kristus' dalam sebagian naskah dicatat tanpa menyelaraskannya dengan 2 Korintus 5:10.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran yang langsung namun bermartabat. Pengulangan 'engkau' dan 'saudaramu' dipertahankan untuk mencerminkan penekanan serta kesejajaran retoris teks Yunani. Penanda catatan ditempatkan sesudah klausa yang memuat varian tekstual.
source_grounding:
  english_pob_role: consult_only
