  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/013.yaml
  text: 'Therefore, let us no longer judge one another, but rather decide this: not to put a stumbling block or an offense before a brother.'
translation:
  language: id
  text: 'Karena itu, janganlah kita lagi saling menghakimi. Sebaliknya, putuskanlah ini: untuk tidak menaruh batu sandungan atau jerat di depan saudara.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “saudara” berbentuk tunggal dan secara harfiah berarti “saudara laki-laki”; di sini maksudnya adalah sesama orang percaya, baik laki-laki maupun perempuan.
    reason: alternative_reading
  - marker: b
    text: Atau “penyebab jatuh”. “Jerat” di sini berarti sesuatu yang menjebak atau membuat orang lain jatuh ke dalam dosa, bukan sekadar sesuatu yang menyinggung perasaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηκέτι οὖν
  choice: Karena itu, janganlah ... lagi
  rationale: Menjaga hubungan kesimpulan οὖν dengan uraian sebelumnya dan menyampaikan Μηκέτι sebagai seruan untuk menghentikan kebiasaan yang sedang berlangsung.
- source_word: ἀλλήλους κρίνωμεν
  choice: kita ... saling menghakimi
  rationale: Bentuk subjungtif hortatoris diterjemahkan sebagai ajakan bersama. 'Menghakimi' mempertahankan gagasan menilai sesama secara negatif dalam konteks ini.
- source_word: ἀλλὰ τοῦτο κρίνατε μᾶλλον
  choice: Sebaliknya, putuskanlah ini
  rationale: Peralihan retoris dari menilai orang lain kepada menetapkan tindakan sendiri dibuat jelas. 'Putuskanlah' menyampaikan penggunaan kedua κρίνατε tanpa menghasilkan ungkapan Indonesia yang janggal.
- source_word: τὸ μὴ τιθέναι
  choice: jangan menaruh
  rationale: Infinitif berartikel menyatakan isi keputusan; bentuk larangan langsung alami dalam bahasa Indonesia.
- source_word: πρόσκομμα
  choice: batu sandungan
  rationale: Mempertahankan metafora sesuatu yang menyebabkan orang lain tersandung secara rohani atau moral.
- source_word: τῷ ἀδελφῷ
  choice: di depan saudara kita
  rationale: Dativus menyatakan orang yang jalannya dihalangi. 'Saudara kita' alami dalam bahasa Indonesia dan dalam konteks menunjuk kepada sesama orang percaya.
- source_word: σκάνδαλον
  choice: jerat
  rationale: Mengungkapkan sesuatu yang menjebak atau menyebabkan orang jatuh ke dalam dosa, bukan sekadar sesuatu yang menyinggung perasaan; sekaligus membedakannya dari πρόσκομμα.
theological_decisions:
- issue: Cakupan ἀδελφῷ yang berbentuk maskulin tunggal
  choice: saudara kita
  alternative: saudara laki-laki kita; sesama orang percaya
  rationale: Kata Yunani berbentuk maskulin tunggal, tetapi dalam konteks nasihat jemaat menunjuk secara representatif kepada sesama orang percaya. Bahasa Indonesia 'saudara' dapat mempertahankan metafora kekeluargaan tanpa harus membatasi rujukannya pada laki-laki.
- issue: Makna etis σκάνδαλον
  choice: jerat
  alternative: penyebab jatuh; batu sandungan
  rationale: '''Jerat'' mempertahankan daya metaforis dan menunjukkan sesuatu yang membawa orang lain jatuh ke dalam dosa, bukan hanya melukai perasaan. Catatan kaki menjelaskan nuansa ini.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada nasihat yang bermartabat. Pengulangan akar κρίνω disampaikan secara idiomatis melalui 'menghakimi' dan 'putuskanlah', sedangkan dua metafora penyesatan dipertahankan sebagai 'batu sandungan' dan 'jerat'.
