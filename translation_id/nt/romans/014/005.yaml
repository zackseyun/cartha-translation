  text: Ὃς ⸀μὲν κρίνει ἡμέραν παρ’ ἡμέραν, ὃς δὲ κρίνει πᾶσαν ἡμέραν· ἕκαστος ἐν τῷ ἰδίῳ νοῒ πληροφορείσθω·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/005.yaml
  text: One person judges one day above another day[a], while another judges every day alike[c][b]. Let each one be fully convinced in his own mind.
translation:
  language: id
  text: Yang seorang menganggap satu hari lebih penting daripada hari yang lain[a], sedangkan yang lain menganggap semua hari sama[b]. Hendaklah masing-masing yakin sepenuhnya dalam pikirannya sendiri[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menilai satu hari berbeda dari hari yang lain.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “setiap hari”; dalam konteks ini maksudnya semua hari dipandang sama.
    reason: lexical_alternative
  - marker: c
    text: Atau “benar-benar teguh dalam keyakinannya sendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνει
  choice: menganggap
  rationale: Dalam konteks ini κρίνω menyatakan penilaian atau pembedaan evaluatif, bukan penghukuman. “Menganggap” terdengar alami dalam bahasa Indonesia dan cocok untuk kedua klausa.
- source_word: ἡμέραν παρ’ ἡμέραν
  choice: satu hari lebih penting daripada hari yang lain
  rationale: Konstruksi παρά menyatakan perbandingan antahari. Kata “lebih penting” memperjelas penilaian yang tersirat tanpa menentukan hari raya, Sabat, atau hari puasa tertentu.
- source_word: πᾶσαν ἡμέραν
  choice: semua hari sama
  rationale: Secara harfiah berarti “setiap hari,” tetapi kontras dengan klausa pertama menyiratkan bahwa orang kedua tidak membedakan nilai antahari. Catatan kaki mempertahankan bentuk harfiahnya.
- source_word: ἕκαστος
  choice: masing-masing
  rationale: Menjaga sifat distributif bentuk tunggal Yunani dan mencakup setiap orang secara alami dalam bahasa Indonesia.
- source_word: ἐν τῷ ἰδίῳ νοῒ
  choice: dalam pikirannya sendiri
  rationale: νοῦς menunjuk pada pikiran atau pengertian. Bentuk ini langsung, alami, dan mempertahankan penekanan pada keyakinan pribadi.
- source_word: πληροφορείσθω
  choice: yakin sepenuhnya
  rationale: Imperatif ini menyerukan kepastian atau keyakinan yang mantap. “Yakin sepenuhnya” jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Jenis hari yang dimaksud
  choice: Tetap menyebut “hari” secara umum tanpa menentukan hari Sabat, hari raya, atau hari puasa.
  alternative: Menafsirkannya secara khusus sebagai hari Sabat/hari raya Yahudi atau hari puasa tertentu.
  rationale: Paulus tidak menyebutkan jenis harinya. Terjemahan perlu mempertahankan keluasan dan ketegangan penafsiran dalam teks.
- issue: Makna πᾶσαν ἡμέραν dalam kontras antarklausa
  choice: Menerjemahkan makna kontekstualnya sebagai “semua hari sama.”
  alternative: Menerjemahkan secara harfiah sebagai “setiap hari.”
  rationale: Klausa pertama berbicara tentang pembedaan satu hari dari hari lain; karena itu klausa kedua secara kontekstual menyatakan tidak adanya pembedaan tersebut. Bentuk harfiah tetap dicatat.
- issue: Pelaku tunggal yang berlaku umum
  choice: Menggunakan “masing-masing” dan akhiran -nya dengan cakupan umum.
  alternative: Memakai bentuk yang secara eksplisit menyebut laki-laki atau bentuk jamak.
  rationale: Bahasa Indonesia dapat mempertahankan penekanan distributif tunggal tanpa menetapkan gender, sesuai cakupan umum konteks Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur kontras dipertahankan dengan “yang seorang ... sedangkan yang lain,” tanpa memasukkan identitas hari tertentu atau ajaran denominasi.
