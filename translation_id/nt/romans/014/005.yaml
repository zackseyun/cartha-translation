  naturalness: Bahasa Indonesia baku, lancar, dan bernada wajar. Susunan “Yang seorang ... sedangkan yang lain ...” dengan jelas mempertahankan pertentangan antarklausa. “Dalam pikirannya sendiri” alami dan sesuai untuk ἐν τῷ ἰδίῳ νοῒ.
  terminology: Pilihan “menganggap” tepat untuk κρίνει dalam konteks penilaian, bukan penghukuman. Istilah “hari” dibiarkan umum sebagaimana sumber, tanpa memasukkan Sabat, hari raya, atau hari puasa. Catatan kaki bersifat relevan dan penanda a, b, c seluruhnya terpasang pada unsur yang dijelaskan.
