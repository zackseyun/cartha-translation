id: ROM.14.7
reference: Romans 14:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐδεὶς γὰρ ἡμῶν ἑαυτῷ ζῇ, καὶ οὐδεὶς ἑαυτῷ ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/007.yaml
  text: For none of us lives for himself[a], and none dies for himself.
translation:
  language: id
  text: Sebab tidak seorang pun di antara kita hidup untuk dirinya sendiri[a], dan tidak seorang pun mati untuk dirinya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagi dirinya sendiri.” Bentuk datif refleksif dalam bahasa Yunani secara harfiah dapat dipahami dengan nuansa “bagi” atau “terhadap” dirinya sendiri; dalam konteks ini, maksudnya kemungkinan besar ialah menjadikan diri sendiri sebagai orientasi atau tujuan hidup dan mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: tidak seorang pun
  rationale: Ungkapan ini menyatakan penyangkalan universal secara alami dan bermartabat dalam bahasa Indonesia, serta dipertahankan pada kedua klausa untuk menonjolkan kesejajaran.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai bahwa ayat ini memberikan dasar atau penjelasan bagi pernyataan sebelumnya.
- source_word: ἡμῶν
  choice: di antara kita
  rationale: Genitif partitif bersama οὐδείς paling alami dinyatakan sebagai 'tidak seorang pun di antara kita'.
- source_word: ἑαυτῷ
  choice: untuk dirinya sendiri
  rationale: Datif refleksif ini menunjuk pada diri sendiri sebagai orientasi atau tujuan hidup dan mati; pilihan ini tetap membuka nuansa relasional yang dijelaskan oleh konteks ayat berikutnya.
- source_word: ζῇ
  choice: hidup
  rationale: Bentuk kini Yunani menyatakan kebenaran umum; bentuk dasar 'hidup' alami sesudah subjek dalam bahasa Indonesia.
- source_word: καὶ
  choice: dan
  rationale: Menghubungkan dua klausa sejajar secara langsung.
- source_word: ἀποθνῄσκει
  choice: mati
  rationale: Menyampaikan pernyataan umum dan mempertahankan kesejajaran ringkas dengan 'hidup'.
theological_decisions:
- issue: Makna datif refleksif ἑαυτῷ dalam kedua klausa
  choice: untuk dirinya sendiri
  alternative: bagi dirinya sendiri; terhadap dirinya sendiri
  rationale: Dalam konteks, Paulus mempertentangkan orientasi kepada diri sendiri dengan orientasi kepada Tuhan dalam ayat 8. 'Untuk dirinya sendiri' menyampaikan arah atau tujuan tersebut tanpa menambahkan rumusan doktrinal yang tidak dinyatakan dalam ayat ini.
- issue: Bentuk maskulin tunggal Yunani yang berfungsi generik
  choice: dirinya sendiri
  alternative: diri kita sendiri
  rationale: Bahasa Indonesia tidak perlu menandai gender pada pronomina refleksif. Bentuk tunggal dipertahankan agar sesuai dengan οὐδεὶς dan ἑαυτῷ, tanpa membatasi rujukannya hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan paralel yang jelas. 'Sebab' mempertahankan hubungan penjelasan dengan konteks sebelumnya, sedangkan 'tidak seorang pun di antara kita' terdengar alami, inklusif, dan tetap dekat dengan struktur sumber.
