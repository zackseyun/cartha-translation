id: ROM.14.6
reference: Romans 14:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ φρονῶν τὴν ἡμέραν κυρίῳ ⸀φρονεῖ. καὶ ὁ ἐσθίων κυρίῳ ἐσθίει, εὐχαριστεῖ γὰρ τῷ θεῷ· καὶ ὁ μὴ ἐσθίων κυρίῳ οὐκ ἐσθίει, καὶ εὐχαριστεῖ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/006.yaml
  text: The one who observes the day[a], observes it for the Lord. And the one who eats, eats for the Lord, for he gives thanks to God; and the one who does not eat, does not eat for the Lord, and he gives thanks to God.
translation:
  language: id
  text: Orang yang mengindahkan hari itu, mengindahkannya untuk Tuhan. Orang yang makan, makan untuk Tuhan, sebab ia mengucap syukur kepada Allah. Orang yang tidak makan, tidak makan untuk Tuhan, dan ia mengucap syukur kepada Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φρονῶν / φρονεῖ (φρονέω)
  choice: mengindahkan / melakukannya
  rationale: Dalam konteks τὴν ἡμέραν, verba ini menyatakan memberi perhatian atau penghargaan praktis kepada suatu hari. “Mengindahkan” mempertahankan cakupan makna itu tanpa menentukan bentuk perayaannya; pengulangan kedua dibuat “melakukannya” agar kalimat Indonesia tetap alami.
- source_word: τὴν ἡμέραν
  choice: hari tertentu
  rationale: Frasa menunjuk pada hari yang sedang dipersoalkan dalam konteks, tetapi tidak mengidentifikasinya sebagai Sabat, hari raya, atau hari puasa. “Hari tertentu” menyampaikan kekhususan kontekstual secara alami tanpa menambah identifikasi.
- source_word: κυρίῳ
  choice: untuk Tuhan
  rationale: Dativus ini menyatakan orientasi atau tujuan tindakan. “Untuk Tuhan” alami dalam bahasa Indonesia dan mempertahankan κύριος sebagai “Tuhan”.
- source_word: ὁ ἐσθίων / ἐσθίει
  choice: orang yang makan / makan
  rationale: Bentuk kini menggambarkan kebiasaan dalam perkara makanan yang diperdebatkan. Bentuk sederhana Indonesia mempertahankan paralelisme ayat.
- source_word: εὐχαριστεῖ τῷ θεῷ
  choice: mengucap syukur kepada Allah
  rationale: Ungkapan ini mempertahankan tindakan bersyukur dan arah tindakan tersebut kepada Allah.
- source_word: ὁ μὴ ἐσθίων / οὐκ ἐσθίει
  choice: orang yang tidak makan / tidak makan
  rationale: Terjemahan langsung mempertahankan konstruksi negatif dan kesejajarannya dengan pihak yang makan, tanpa mempersempitnya menjadi jenis pantangan tertentu.
theological_decisions:
- issue: Makna mengindahkan “hari”
  choice: Rujukan umum kepada perhatian atau pengamalan suatu hari tertentu dalam perselisihan Roma 14
  alternative: Rujukan khusus kepada hari Sabat, hari raya Yahudi, atau hari puasa
  rationale: Bahasa Yunani ayat ini tidak menentukan hari yang dimaksud. Terjemahan mempertahankan keluasan dan ketegangan tersebut.
- issue: Referen κύριος
  choice: Tuhan
  alternative: Allah
  rationale: Terjemahan mempertahankan sebutan κύριος sebagai “Tuhan” dan tidak menyamakannya secara leksikal dengan θεός, yang disebut eksplisit sebagai “Allah” dalam klausa ucapan syukur.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Paralelisme antara orang yang makan dan yang tidak makan dipertahankan. Kata “pun” menegaskan bahwa kedua pihak sama-sama mengucap syukur tanpa menambah penilaian teologis.
