    rationale: πίστις dalam ayat ini dapat bernuansa keyakinan, tetapi kata «hati» tidak dinyatakan dalam teks Yunani. Alternatif dapat dibuat lebih dekat pada sumber sambil tetap menjelaskan nuansa kontekstual.
