  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ διακρινόμενος ἐὰν φάγῃ κατακέκριται, ὅτι οὐκ ἐκ πίστεως· πᾶν δὲ ὃ οὐκ ἐκ πίστεως ἁμαρτία ⸀ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/023.yaml
  text: But the one who doubts is condemned if he eats[a], because it is not from faith; and everything that is not from faith is sin.
translation:
  language: id
  text: Namun, orang yang ragu-ragu, jika ia makan, berada di bawah hukuman, sebab tindakannya itu tidak berasal dari iman[a]; dan segala sesuatu yang tidak berasal dari iman adalah dosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab tindakannya itu tidak timbul dari keyakinan.” Secara harfiah, teks Yunani berbunyi “tidak berasal dari iman”; dalam konteks ini, iman dapat mencakup tindakan dengan keyakinan yang mantap di hadapan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρινόμενος
  choice: orang yang ragu-ragu
  rationale: Dalam konteks keberatan batin mengenai makanan, bentuk partisip ini menunjuk pada orang yang bimbang atau terpecah dalam pertimbangannya, bukan terutama orang yang berselisih dengan pihak lain.
- source_word: ἐὰν φάγῃ
  choice: jika ia makan
  rationale: Konstruksi ἐάν dengan aoristus subjungtif menyatakan syarat; ungkapan ini mempertahankan daya kondisional secara alami dalam bahasa Indonesia.
- source_word: κατακέκριται
  choice: dihukum
  rationale: Perfek pasif menyatakan keadaan berada di bawah penghukuman sebagai akibat tindakannya. Bentuk pasif dipertahankan tanpa menentukan siapa pelakunya.
- source_word: ὅτι οὐκ ἐκ πίστεως
  choice: sebab tindakannya itu tidak berasal dari iman
  rationale: ὅτι memperkenalkan alasan. Subjek tersirat dijelaskan sebagai 'tindakannya itu' agar hubungan logisnya jelas dalam bahasa Indonesia, sedangkan metafora ἐκ dan istilah πίστις tetap dipertahankan.
- source_word: πᾶν ... ὃ
  choice: segala sesuatu yang
  rationale: Konstruksi netral tunggal ini bersifat menyeluruh dan secara wajar diterjemahkan demikian.
- source_word: ἁμαρτία ἐστίν
  choice: adalah dosa
  rationale: Predikat nomina diterjemahkan langsung untuk mempertahankan ketegasan pernyataan Paulus.
theological_decisions:
- issue: Makna πίστις dalam konteks tindakan moral
  choice: iman
  alternative: keyakinan hati
  rationale: '''Iman'' mempertahankan kosakata teologis Paulus dan keluasan makna teks Yunani. Dalam konteks ini istilah tersebut juga dapat mencakup tindakan berdasarkan keyakinan yang mantap di hadapan Allah; nuansa itu dicatat dalam catatan kaki tanpa mempersempit teks utama.'
- issue: Cakupan penghukuman dalam κατακέκριται
  choice: dihukum
  alternative: menghukum dirinya sendiri / dihukum di hadapan Allah
  rationale: Teks Yunani tidak menyebut pelaku penghukuman. Bentuk pasif dipertahankan agar terjemahan tidak memutuskan apakah tekanannya terletak pada penghakiman Allah, suara hati, atau keduanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Namun' menandai kontras dengan ayat sebelumnya; 'ragu-ragu' mudah dipahami pembaca umum. Frasa 'tindakannya itu' ditambahkan secara terbatas demi kejelasan rujukan tanpa mengubah isi.
