  terminology: «Mesias» tepat untuk Χριστός sebagai gelar, «hidup kembali» wajar untuk ἔζησεν dalam konteks ini, dan «berkuasa atas» menyampaikan κυριεύσῃ sebagai verba tanpa menjadikannya gelar nominal.
