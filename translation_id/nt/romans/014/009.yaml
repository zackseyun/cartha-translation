  text: εἰς τοῦτο γὰρ ⸀Χριστὸς ⸀ἀπέθανεν καὶ ἔζησεν ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/009.yaml
  text: For to this end Messiah died and lived again[a], so that he might rule over both the dead and the living.
translation:
  language: id
  text: Sebab untuk tujuan inilah Mesias mati dan hidup kembali[a], supaya Ia berkuasa atas orang mati dan orang hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hidup.” Dalam konteks ini, pasangan dengan “mati” menunjuk pada kehidupan sesudah kematian; karena itu dapat diterjemahkan “hidup kembali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: untuk tujuan inilah
  rationale: Ungkapan ini menunjuk pada maksud atau tujuan; bentuk ini mempertahankan daya teleologisnya secara alami dalam bahasa Indonesia.
- source_word: γὰρ
  choice: sebab
  rationale: Partikel ini memberi dasar penjelasan bagi pernyataan sebelumnya dan mempertahankan alur argumentasi Paulus.
- source_word: Χριστὸς
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar bagi Yesus dalam pernyataan mengenai kematian, kehidupan kembali, dan kekuasaan-Nya.
- source_word: ἀπέθανεν
  choice: telah mati
  rationale: Bentuk aoris menyatakan peristiwa kematian secara langsung; 'telah' membantu menghubungkannya dengan akibat yang berlaku dalam konteks.
- source_word: ἔζησεν
  choice: hidup kembali
  rationale: Secara harfiah verba ini berarti 'hidup', tetapi pasangannya dengan 'mati' dalam konteks ini mengacu pada kehidupan sesudah kematian. Catatan kaki mempertahankan bentuk yang lebih harfiah.
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan tujuan secara wajar dan jelas dalam bahasa Indonesia modern.
- source_word: κυριεύσῃ
  choice: berkuasa atas
  rationale: Verba ini berarti menjalankan kekuasaan atau ketuanan atas. Pilihan ini mempertahankan bentuk verbalnya tanpa mengubahnya menjadi gelar nominal.
- source_word: νεκρῶν καὶ ζώντων
  choice: orang mati maupun orang hidup
  rationale: Kedua bentuk substantival ini diterjemahkan sebagai pasangan kontras yang alami dalam bahasa Indonesia; 'maupun' menyampaikan cakupan keduanya.
theological_decisions:
- issue: Makna kebangkitan dalam ἔζησεν
  choice: hidup kembali
  alternative: hidup; bangkit dan hidup
  rationale: Gabungan 'mati dan hidup' serta tujuan berkuasa atas orang mati dan orang hidup menunjukkan kehidupan pascakematian. Namun, karena verba Yunaninya hanya mengatakan 'hidup', alternatif harfiahnya dicatat agar ketegangan leksikal tidak hilang.
- issue: Bobot kristologis κυριεύσῃ
  choice: berkuasa atas
  alternative: menjadi Tuhan atas; memerintah atas
  rationale: Pilihan ini menyampaikan klaim teks tentang kekuasaan Mesias atas orang mati dan orang hidup sekaligus mempertahankan κυριεύσῃ sebagai verba, bukan secara diam-diam mengubahnya menjadi gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kapitalisasi 'Ia' dipakai sebagai konvensi hormat dalam teks keagamaan Indonesia, tanpa menambah isi semantis pada bahasa sumber.
