id: ROM.14.22
reference: Romans 14:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: σὺ πίστιν ⸀ἣν ἔχεις κατὰ σεαυτὸν ἔχε ἐνώπιον τοῦ θεοῦ. μακάριος ὁ μὴ κρίνων ἑαυτὸν ἐν ᾧ δοκιμάζει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/022.yaml
  text: The faith that you have[a], keep to yourself before God[b]. Blessed is the one who does not judge himself by what he approves.
translation:
  language: id
  text: Iman yang kamu miliki[a], peganglah itu bagi dirimu sendiri di hadapan Allah. Berbahagialah orang yang tidak menghakimi dirinya sendiri[b] dalam hal yang disetujuinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Keyakinan yang kamu miliki.” Dalam konteks ini, kata Yunani πίστις dapat menunjuk pada keyakinan pribadi mengenai perkara yang diperselisihkan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “menghukum dirinya sendiri” atau “menyatakan dirinya sendiri bersalah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: iman
  rationale: Mempertahankan padanan utama πίστις, sambil mengakui bahwa dalam konteks perkara yang diperselisihkan kata ini menunjuk pada keyakinan pribadi di hadapan Allah.
- source_word: κατὰ σεαυτὸν
  choice: bagi dirimu sendiri
  rationale: Mengungkapkan bahwa keyakinan itu hendaknya dipegang sebagai keyakinan pribadi, bukan dipaksakan kepada orang lain, tanpa meleburkannya dengan frasa berikutnya tentang berada di hadapan Allah.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: Padanan baku dan wajar yang mempertahankan unsur pertanggungjawaban serta kesadaran akan kehadiran Allah.
- source_word: μακάριος
  choice: berbahagialah
  rationale: Bentuk ini wajar dalam ragam Alkitab Indonesia dan mempertahankan bobot penilaian ilahi, bukan sekadar perasaan senang.
- source_word: κρίνων ἑαυτὸν
  choice: menghakimi dirinya sendiri
  rationale: Tetap dekat dengan κρίνω dan mempertahankan kemungkinan nuansa mengutuk atau menyatakan diri bersalah tanpa mempersempit maknanya dalam teks utama.
- source_word: ἐν ᾧ δοκιμάζει
  choice: dalam hal yang disetujuinya
  rationale: δοκιμάζω menunjuk pada menerima atau menyetujui sesuatu setelah menilainya; frasa ini mempertahankan konstruksi ἐν dan hubungan paradoksal antara persetujuan dan penghakiman diri.
theological_decisions:
- issue: Makna πίστις dalam konteks etika dan perkara yang diperselisihkan
  choice: iman yang dalam konteks ini mencakup keyakinan pribadi di hadapan Allah mengenai perkara tersebut
  alternative: keyakinan; kepercayaan umum kepada Allah; kesetiaan
  rationale: Konteks langsung membahas praktik yang diperselisihkan dan hati nurani. Teks utama mempertahankan istilah kunci “iman”, sedangkan nuansa “keyakinan” dijelaskan dalam catatan kaki.
- issue: Daya hukum κρίνων ἑαυτὸν
  choice: menghakimi dirinya sendiri
  alternative: menghukum atau menyatakan dirinya sendiri bersalah
  rationale: Kata κρίνω dapat berarti menghakimi atau menghukum. Padanan utama tidak menutup ambiguitas itu, dan alternatif yang lebih tegas dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kedua frasa “bagi dirimu sendiri” dan “di hadapan Allah” dipertahankan agar privasi keyakinan tidak disalahartikan sebagai sesuatu yang tersembunyi dari Allah.
