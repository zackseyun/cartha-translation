revisions:
- from: Janganlah meruntuhkan pekerjaan Allah hanya karena makanan. Memang, segala sesuatu itu tahir,[a] tetapi makan dengan cara yang membuat orang lain tersandung adalah hal yang jahat bagi orang yang melakukannya.[b]
  to: Janganlah meruntuhkan pekerjaan Allah demi makanan. Segala sesuatu memang tahir,[a] tetapi jahatlah bagi orang yang makan dengan menimbulkan batu sandungan.[b]
  rationale: Revisi menghapus alternatif yang tidak didukung sumber dan mempertahankan ambiguitas terbatas dari διὰ προσκόμματος. “Dengan menimbulkan batu sandungan” tetap menyampaikan bahwa cara makan itu menjadi penyebab tersandung, tanpa secara eksplisit memasukkan “orang lain” ke dalam teks utama. Susunan “Segala sesuatu memang tahir” lebih dekat dengan urutan dan penegasan μέν dalam bahasa Indonesia yang tetap alami.
