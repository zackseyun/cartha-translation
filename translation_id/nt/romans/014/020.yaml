  text: μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ. πάντα μὲν καθαρά, ἀλλὰ κακὸν τῷ ἀνθρώπῳ τῷ διὰ προσκόμματος ἐσθίοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/020.yaml
  text: Do not[a], for the sake of food, tear down the work of God. All things are indeed clean[b], but it is evil for the person who eats in a way that causes stumbling.
translation:
  language: id
  text: Janganlah meruntuhkan pekerjaan Allah demi makanan. Segala sesuatu memang tahir,[a] tetapi jahatlah bagi orang yang makan dengan menimbulkan batu sandungan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks ini, “segala sesuatu” terutama mengacu pada makanan; karena itu dapat juga diterjemahkan, “semua makanan itu tahir.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “tetapi jahat bagi orang yang makan sehingga menyebabkan orang lain tersandung.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνεκεν βρώματος
  choice: hanya karena makanan
  rationale: ἕνεκεν dengan genitif menyatakan alasan atau motif. Kata “hanya” secara wajar menonjolkan kontras antara perkara makanan dan kerusakan terhadap pekerjaan Allah tanpa mengubah acuannya.
- source_word: κατάλυε
  choice: meruntuhkan
  rationale: Kata ini mempertahankan metafora membongkar atau merobohkan sesuatu yang sedang dibangun, dan cocok dengan larangan μή ditambah imperatif kini.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: pekerjaan Allah
  rationale: Terjemahan langsung ini mempertahankan keluasan frasa Yunani, yang dalam konteks dapat menunjuk pada karya Allah dalam diri sesama orang percaya maupun dalam jemaat.
- source_word: πάντα μὲν καθαρά
  choice: Memang, segala sesuatu itu tahir
  rationale: πάντα tetap diterjemahkan secara luas, sedangkan konteks membatasinya terutama pada makanan. “Tahir” mempertahankan ranah bahasa kemurnian ritual dan μέν diwakili oleh “memang”.
- source_word: κακὸν
  choice: hal yang jahat
  rationale: Pilihan ini mempertahankan bobot moral κακόν, bukan sekadar menyatakan bahwa tindakan tersebut kurang baik atau tidak bijaksana.
- source_word: τῷ ἀνθρώπῳ
  choice: bagi orang yang melakukannya
  rationale: ἄνθρωπος bersifat generik; “orang” merupakan padanan Indonesia yang alami dan tidak menambahkan jenis kelamin yang tidak relevan. “Yang melakukannya” memperjelas hubungan dengan tindakan makan tanpa mengubah subjek.
- source_word: διὰ προσκόμματος ἐσθίοντι
  choice: makan dengan cara yang membuat orang lain tersandung
  rationale: Frasa ini secara alami menyatakan cara makan yang menimbulkan πρόσκομμα. Penambahan “orang lain” menjelaskan objek tersirat dari gambaran tersandung sesuai konteks, sementara catatan kaki mempertahankan kemungkinan nuansa bahwa si pemakan sendiri makan dengan hati nurani yang tersandung.
theological_decisions:
- issue: Cakupan pernyataan bahwa semuanya tahir
  choice: Mempertahankan “segala sesuatu” dan istilah kemurnian “tahir,” dengan konteks makanan dibiarkan menentukan cakupannya.
  alternative: “Semua makanan itu tahir” atau “semuanya boleh dimakan.”
  rationale: Teks Yunani memakai πάντα, bukan kata eksplisit untuk “makanan,” dan καθαρά membawa bahasa kemurnian. Terjemahan utama tidak mempersempit atau menafsirkan pernyataan lebih jauh daripada teks.
- issue: Arah makna διὰ προσκόμματος
  choice: Menyatakan makan dengan cara yang membuat orang lain tersandung.
  alternative: Makan walaupun hati nuraninya sendiri tersandung atau makan melalui suatu batu sandungan.
  rationale: Dalam konteks Roma 14, bahaya menyebabkan saudara seiman tersandung sangat menonjol. Namun konstruksi Yunani dapat dipahami lebih dari satu cara, sehingga alternatif yang berfokus pada si pemakan dicatat dan tidak disembunyikan.
- issue: Makna representatif τῷ ἀνθρώπῳ
  choice: Menggunakan “orang,” yang secara alami bersifat generik dalam bahasa Indonesia.
  alternative: “Laki-laki” atau “manusia.”
  rationale: Nomina Yunani di sini mengacu kepada seseorang secara umum, bukan menekankan jenis kelamin. “Orang” paling tepat menyampaikan fungsi representatif tersebut dalam bahasa Indonesia modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Meruntuhkan” mempertahankan metafora sumber; “tahir” dipakai untuk menjaga bahasa kemurnian, sedangkan susunan kalimat kedua dibuat alami dan jelas bagi pembaca umum.
