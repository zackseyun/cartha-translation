id: ROM.12.10
reference: Romans 12:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τῇ φιλαδελφίᾳ εἰς ἀλλήλους φιλόστοργοι, τῇ τιμῇ ἀλλήλους προηγούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/010.yaml
  text: In brotherly love, be affectionate toward one another; in honor, outdo one another.
translation:
  language: id
  text: Dalam kasih persaudaraan, hendaklah kamu saling menyayangi; dalam memberi hormat, hendaklah kamu saling mendahului.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλαδελφίᾳ
  choice: kasih persaudaraan
  rationale: Menunjukkan kasih antaranggota keluarga yang dalam konteks ini diterapkan kepada sesama orang percaya, tanpa membatasinya pada saudara laki-laki.
- source_word: φιλόστοργοι
  choice: saling menyayangi
  rationale: Kata ini menyatakan kasih sayang dan keakraban seperti dalam keluarga; 'menyayangi' menyampaikan kehangatan tersebut secara alami dalam bahasa Indonesia.
- source_word: προηγούμενοι
  choice: saling mendahului
  rationale: Secara harfiah mengandung gagasan berjalan di depan atau mengambil prakarsa. Ungkapan ini mempertahankan dorongan untuk berlomba mengambil prakarsa dalam menghormati orang lain, tanpa mengubahnya menjadi sekadar memberi prioritas.
- source_word: τιμῇ
  choice: dalam memberi hormat
  rationale: Bentuk datif menunjuk pada ranah atau tindakan penghormatan. Bentuk verbal ini terdengar alami dan memperjelas bahwa penghormatan diberikan kepada satu sama lain.
theological_decisions:
- issue: Makna προηγούμενοι dalam hubungan dengan penghormatan
  choice: hendaklah kamu saling mendahului
  alternative: hendaklah kamu saling mengutamakan
  rationale: Pilihan utama mempertahankan citra mengambil langkah lebih dahulu dan nuansa saling berlomba dalam menghormati, sedangkan alternatif dapat menyiratkan penilaian status atau prioritas yang tidak dinyatakan secara tegas oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'saling' mempertahankan penekanan timbal balik dari εἰς ἀλλήλους dan ἀλλήλους; susunan dua klausa paralel mengikuti bentuk nasihat ringkas dalam bahasa Yunani.
