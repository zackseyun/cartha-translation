  yaml_path: translation/nt/romans/012/009.yaml
  text: Let love be without hypocrisy[a]. Abhor what is evil; cling to what is good.
translation:
  language: id
  text: Kasih hendaklah tulus, tanpa kemunafikan.[a] Bencilah apa yang jahat; berpautlah pada apa yang baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kasih hendaklah tanpa kemunafikan.” Secara harfiah, bahasa Yunani berbunyi “Kasih tanpa kemunafikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: kasih
  rationale: “Kasih” merupakan padanan Indonesia yang alami dan lazim untuk ἀγάπη dalam konteks etika Kristen serta mempertahankan bobot moral istilah tersebut.
- source_word: ἀνυπόκριτος
  choice: tanpa kemunafikan
  rationale: Ungkapan ini mempertahankan gambaran konkret tentang kasih yang tidak berpura-pura atau dimainkan, alih-alih langsung menafsirkannya sebagai sekadar “tulus”.
- source_word: ἀποστυγοῦντες
  choice: bencilah
  rationale: Bentuk ini menyatakan penolakan atau kebencian yang kuat. “Bencilah” alami dalam bahasa Indonesia dan menyampaikan daya desak nasihat tersebut tanpa parafrasa berlebihan.
- source_word: τὸ πονηρόν
  choice: apa yang jahat
  rationale: Adjektiva netral berartikel ini berfungsi substantival. “Apa yang jahat” mempertahankan kategori moral yang luas dan sejajar dengan “apa yang baik”.
- source_word: κολλώμενοι
  choice: berpautlah pada
  rationale: Kata kerja ini menggambarkan keterikatan yang erat. “Berpautlah pada” menyampaikan keteguhan melekat dengan bahasa yang wajar dan bermartabat.
- source_word: τῷ ἀγαθῷ
  choice: apa yang baik
  rationale: Adjektiva netral berartikel ini berfungsi substantival. Terjemahan tersebut jelas, luas, dan menjaga kesejajaran dengan “apa yang jahat”.
theological_decisions:
- issue: Daya klausa tanpa verba dan kedua partisip dalam konteks nasihat
  choice: 'Menerjemahkannya sebagai rangkaian seruan: “Hendaklah kasih ... Bencilah ... berpautlah ...”'
  alternative: 'Terjemahan yang lebih fragmentaris: “Kasih tanpa kemunafikan, membenci yang jahat, berpaut pada yang baik.”'
  rationale: Meskipun bahasa Yunani dimulai dengan klausa nominal lalu memakai partisip, konteks Roma 12 merupakan rangkaian nasihat. Bentuk seruan menyampaikan fungsi pragmatisnya tanpa menghapus ketegangan sintaksis sumber.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Tanpa kemunafikan” dipertahankan untuk mencerminkan ungkapan Yunani secara transparan; “berpautlah” dipilih karena kuat namun tetap mudah dipahami.
