source:
  edition: SBLGNT
  text: καὶ μὴ ⸀συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ ⸀μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ ⸀νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/002.yaml
  text: And do not be conformed to this age[a], but be transformed by the renewing of your mind[c][b], so that you may discern what the will of God is—the good and pleasing and perfect.
translation:
  language: id
  text: Janganlah kamu menyesuaikan diri dengan zaman ini[a], tetapi hendaklah kamu diubahkan melalui pembaruan pikiranmu, supaya kamu dapat mengenali kehendak Allah—apa yang baik, yang berkenan, dan yang sempurna.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dunia ini.” Kata Yunani αἰών lebih tepat berarti “zaman”, yakni era atau tatanan masa kini.'
    reason: lexical_alternative
  - marker: b
    text: “Mengenali” juga dapat diterjemahkan “menguji dan menyetujui”. “Yang berkenan” mungkin berarti yang berkenan kepada Allah; dapat juga diterjemahkan “yang dapat diterima”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συσχηματίζεσθε
  choice: mengikuti pola
  rationale: Ungkapan ini menyampaikan larangan untuk mengambil bentuk atau pola lahiriah dari sesuatu, sekaligus membentuk kontras yang wajar dalam bahasa Indonesia dengan perubahan mendalam pada μεταμορφοῦσθε.
- source_word: αἰῶνι τούτῳ
  choice: zaman ini
  rationale: αἰών menunjuk pada era atau tatanan masa kini, bukan terutama dunia ciptaan; karena itu 'zaman ini' mempertahankan kerangka temporal-etis Paulus.
- source_word: μεταμορφοῦσθε
  choice: berubahlah
  rationale: Kata ini menunjuk pada perubahan mendalam dalam bentuk atau keadaan. Bentuk 'berubahlah' alami dalam bahasa Indonesia dan tidak menentukan secara berlebihan apakah nuansa bentuk Yunani dipahami sebagai pasif atau medial.
- source_word: τῇ ἀνακαινώσει τοῦ νοός
  choice: melalui pembaruan pikiranmu
  rationale: Dativus dipahami secara instrumental. 'Pembaruan' mempertahankan gagasan proses menjadi baru, sedangkan 'pikiranmu' secara alami menyatakan pikiran para pembaca meskipun pronomina posesif tidak tertulis dalam frasa Yunani.
- source_word: εἰς τὸ δοκιμάζειν
  choice: supaya kamu dapat mengenali
  rationale: Konstruksi ini menyatakan tujuan atau hasil. δοκιμάζω mencakup menguji, menilai, lalu mengenali atau menyetujui yang terbukti baik; 'mengenali' komunikatif tanpa menggambarkan manusia sebagai hakim atas kehendak Allah.
- source_word: τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον
  choice: apa yang baik, yang berkenan, dan yang sempurna
  rationale: Ketiga kata sifat dipertahankan sebagai uraian dalam aposisi terhadap kehendak Allah. Pengulangan 'yang' menghasilkan rangkaian yang jelas dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Makna αἰών dalam kontras etis
  choice: zaman ini
  alternative: dunia ini
  rationale: '''Zaman ini'' menghindari kesan bahwa dunia ciptaan itu sendiri menjadi lawan pembaruan Allah dan mempertahankan kontras Paulus dengan tatanan era sekarang.'
- issue: Daya makna δοκιμάζειν terhadap kehendak Allah
  choice: mengenali
  alternative: menguji dan menyetujui
  rationale: '''Mengenali'' menyampaikan hasil penilaian oleh pikiran yang diperbarui, sedangkan alternatif mempertahankan unsur proses menguji dan menerima sebagai terbukti baik.'
- issue: Rujukan εὐάρεστον
  choice: yang berkenan
  alternative: yang menyenangkan Allah; yang dapat diterima
  rationale: Teks Yunani tidak menyebutkan secara eksplisit kepada siapa hal itu berkenan. Terjemahan utama mempertahankan keterbukaan tersebut, sementara catatan menjelaskan kemungkinan rujukannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang tegas dan bermartabat. Bentuk tunggal 'pikiranmu' dan 'kamu' digunakan secara kolektif bagi para pembaca, sebagaimana verba Yunani ditujukan kepada kelompok. Susunan akhir dibuat eksplisit secukupnya agar aposisi Yunani tetap jelas dalam bahasa Indonesia.
