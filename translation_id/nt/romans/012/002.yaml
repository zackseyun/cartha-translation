    rationale: μορφοῦσθε berbentuk imperatif kini pasif; walaupun bentuk medial dapat diperdebatkan secara semantis, terjemahan pasif Indonesia dapat menyampaikan kontras dengan συσχηματίζεσθε tanpa menetapkan pelaku transformasi secara teologis.
  - severity: low
    issue: “Mengikuti pola zaman ini” kurang langsung mencerminkan hubungan penyesuaian diri kepada sesuatu.
    rationale: “Menyesuaikan diri dengan zaman ini” lebih alami dalam bahasa Indonesia dan lebih dekat dengan gagasan mengambil pola menurut tatanan zaman ini.
