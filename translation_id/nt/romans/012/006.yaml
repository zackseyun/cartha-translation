id: ROM.12.6
reference: Romans 12:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔχοντες δὲ χαρίσματα κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν διάφορα, εἴτε προφητείαν κατὰ τὴν ἀναλογίαν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/006.yaml
  text: 'But having gifts that differ according to the grace given to us: if prophecy[a], in proportion to faith;'
translation:
  language: id
  text: Namun, kita memiliki karunia-karunia yang berbeda-beda sesuai dengan anugerah yang diberikan kepada kita. Jika karunia itu adalah nubuat, hendaklah digunakan sebanding dengan iman[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebanding dengan imannya”; kemungkinan lain, “selaras dengan iman Kristen.” Frasa Yunani ini dapat menunjuk pada ukuran iman orang yang bernubuat atau pada kesesuaian nubuat dengan isi iman Kristen.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχοντες δὲ
  choice: Namun, kita memiliki
  rationale: Partisipel ini melanjutkan alur dari ayat sebelumnya. Dalam bahasa Indonesia, bentuk finit dengan subjek tersurat lebih alami; δέ ditampilkan sebagai peralihan ringan melalui “Namun”.
- source_word: χαρίσματα ... διάφορα
  choice: karunia-karunia yang berbeda-beda
  rationale: “Karunia” merupakan padanan lazim bagi χάρισμα, sedangkan bentuk ulang menyampaikan jamak dan keberagaman yang dinyatakan oleh διάφορα.
- source_word: κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν
  choice: sesuai dengan anugerah yang diberikan kepada kita
  rationale: κατά menyatakan kesesuaian, dan χάρις di sini menunjuk pada anugerah ilahi yang menjadi dasar pemberian berbagai karunia.
- source_word: εἴτε προφητείαν
  choice: Jika karunia itu adalah nubuat
  rationale: Konstruksi Yunani bersifat eliptis dan membuka daftar fungsi atau karunia. Unsur “karunia itu adalah” ditambahkan demi kejelasan alami tanpa mengubah maksud.
- source_word: κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: sebanding dengan iman
  rationale: Padanan ini mempertahankan gagasan proporsi atau kesesuaian dalam ἀναλογία sekaligus membiarkan πίστις tetap terbuka antara iman orang yang bernubuat dan “iman” sebagai isi kepercayaan Kristen.
theological_decisions:
- issue: Makna κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: sebanding dengan iman
  alternative: sebanding dengan iman orang itu; atau selaras dengan iman Kristen
  rationale: Frasa Yunani dapat menunjuk pada ukuran iman yang diberikan kepada orang yang bernubuat atau pada keselarasan nubuat dengan isi iman Kristen. Teks utama mempertahankan ungkapan luas, sedangkan catatan kaki menyajikan dua kemungkinan utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kalimat Yunani yang eliptis dibuat sedikit lebih eksplisit agar alami, sementara ambiguitas teologis pada frasa terakhir tetap dipertahankan.
