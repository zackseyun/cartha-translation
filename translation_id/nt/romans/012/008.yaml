  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει, ὁ μεταδιδοὺς ἐν ἁπλότητι, ὁ προϊστάμενος ἐν σπουδῇ, ὁ ἐλεῶν ἐν ἱλαρότητι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/008.yaml
  text: if exhorting[a], in exhortation; the one who shares, with generosity; the one who leads, with diligence; the one who shows mercy[e][d][c][b], with cheerfulness.
translation:
  language: id
  text: jika menasihati[a], dalam nasihat; orang yang berbagi[b], dengan murah hati[c]; orang yang memimpin[d], dengan tekun[e]; orang yang menunjukkan belas kasihan, dengan sukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menguatkan, dalam penguatan.” Kata kerja dan kata benda Yunani yang berpasangan ini dapat mencakup arti menasihati, mendorong, menguatkan, atau menghibur.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang yang memberi” atau “orang yang menyumbang.”
    reason: lexical_alternative
  - marker: c
    text: Atau “dengan tulus” atau “dengan sederhana.” Kata Yunani ἁπλότης dapat menyatakan ketulusan, kesederhanaan, atau kemurahan hati, bergantung pada konteks.
    reason: lexical_alternative
  - marker: d
    text: Atau “orang yang mengatur” atau “orang yang mengepalai.”
    reason: lexical_alternative
  - marker: e
    text: Atau “dengan sungguh-sungguh” atau “dengan penuh semangat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: jika
  rationale: Melanjutkan rangkaian eliptis dari ayat sebelumnya; “jika” menyatakan keadaan yang sesuai dengan karunia yang diterima secara alami dalam bahasa Indonesia.
- source_word: ὁ παρακαλῶν / ἐν τῇ παρακλήσει
  choice: menasihati / hendaklah ia menasihati
  rationale: Pasangan verba-nomina Yunani dapat berarti menasihati atau menguatkan. Pengulangan verba dalam bahasa Indonesia mempertahankan hubungan serumpun itu tanpa ungkapan kaku seperti “di dalam nasihat”.
- source_word: ὁ μεταδιδοὺς
  choice: orang yang berbagi
  rationale: μεταδίδωμι menunjuk pada tindakan membagikan atau memberikan apa yang dimiliki; “berbagi” mempertahankan nuansa partisipatif dan tidak membatasi objeknya secara berlebihan.
- source_word: ἐν ἁπλότητι
  choice: dengan murah hati
  rationale: Dalam konteks berbagi sumber daya, ἁπλότης paling wajar menyatakan kemurahan hati, meskipun makna ketulusan atau kesederhanaan tetap mungkin secara leksikal.
- source_word: ὁ προϊστάμενος
  choice: orang yang memimpin
  rationale: Pilihan umum ini mencakup tindakan memimpin atau mengurus tanpa menjadikannya sebutan teknis bagi jabatan gerejawi tertentu.
- source_word: ἐν σπουδῇ
  choice: dengan tekun
  rationale: σπουδή mencakup ketekunan, kesungguhan, dan semangat; “dengan tekun” alami untuk pelaksanaan tanggung jawab kepemimpinan.
- source_word: ὁ ἐλεῶν
  choice: orang yang menunjukkan belas kasihan
  rationale: Bentuk partisip aktif diterjemahkan sebagai tindakan nyata, bukan sekadar sifat atau perasaan.
- source_word: ἐν ἱλαρότητι
  choice: dengan sukacita
  rationale: ἱλαρότης menyatakan kegembiraan atau kerelaan hati; “dengan sukacita” merupakan ungkapan Indonesia yang alami dalam konteks melakukan belas kasihan.
theological_decisions:
- issue: Cakupan ὁ προϊστάμενος
  choice: orang yang memimpin
  alternative: orang yang mengatur; orang yang mengepalai; pemimpin jemaat
  rationale: Bentuk partisip dalam daftar karunia ini tidak secara eksplisit menyebut jabatan gerejawi. Terjemahan umum mempertahankan keluasan teks dan tidak memasukkan tata gereja denominasi tertentu.
- issue: Makna ἁπλότης dalam tindakan berbagi
  choice: dengan murah hati
  alternative: dengan tulus; dengan sederhana; dengan hati yang bulat
  rationale: Hubungannya dengan tindakan berbagi mendukung makna kemurahan hati, tetapi catatan kaki mempertahankan kemungkinan nuansa ketulusan dan kebulatan hati.
- issue: Pelengkapan elipsis dari konteks
  choice: jika karunia seseorang adalah … hendaklah ia …
  alternative: jika menasihati, dalam nasihat; atau struktur fragmen yang sepenuhnya harfiah
  rationale: Teks Yunani meneruskan daftar karunia dari ayat 6–7 dan menghilangkan unsur verbal yang dipahami. Pelengkapan terbatas ini membuat kalimat Indonesia dapat dipahami tanpa mengubah isi daftar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Elipsis Yunani dilengkapi secukupnya berdasarkan konteks daftar karunia, sedangkan pola ringkas dan sejajar tetap dipertahankan. Istilah kepemimpinan dibuat umum agar tidak menunjuk secara khusus pada jabatan atau tata gereja tertentu.
