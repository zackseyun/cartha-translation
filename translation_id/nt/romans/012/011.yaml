translation:
  language: id
  text: Janganlah biarkan kerajinan kalian mengendur; hendaklah roh kalian menyala-nyala[a]; layanilah Tuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hendaklah kalian menyala-nyala dalam Roh,” jika πνεύματι dipahami sebagai Roh Kudus, bukan roh orang percaya.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδῇ
  choice: dalam berusaha dengan sungguh-sungguh
  rationale: Ungkapan ini menyampaikan kesungguhan, semangat, dan ketekunan yang terkandung dalam σπουδή, sekaligus membentuk pertentangan yang wajar dengan ὀκνηροί dalam bahasa Indonesia.
- source_word: ὀκνηροί
  choice: malas
  rationale: Kata 'malas' dengan jelas menyatakan kelambanan atau keengganan dalam bertindak dan merupakan padanan Indonesia modern yang langsung.
- source_word: πνεύματι
  choice: roh kalian
  rationale: Dalam rangkaian nasihat etis ini, frasa tersebut paling wajar dipahami sebagai roh atau batin orang percaya. Kata ganti jamak dibuat eksplisit agar alami dalam bahasa Indonesia; kemungkinan bahwa yang dimaksud ialah Roh Kudus dicatat dalam catatan kaki.
- source_word: ζέοντες
  choice: menyala-nyala
  rationale: Secara harfiah kata ini menggambarkan sesuatu yang mendidih; 'menyala-nyala' mempertahankan gambaran tentang gairah batin yang kuat dalam ungkapan Indonesia yang hidup dan mudah dimengerti.
- source_word: κυρίῳ
  choice: Tuhan
  rationale: Dalam konteks Paulus, gelar ini paling mungkin merujuk kepada Tuhan Yesus, tetapi terjemahan mempertahankan gelar 'Tuhan' tanpa mempersempit rujukannya lebih lanjut.
- source_word: δουλεύοντες
  choice: layanilah
  rationale: Bentuk perintah 'layanilah' menyampaikan pengabdian dan ketaatan yang dimaksud oleh δουλεύω dalam konteks nasihat ini tanpa menghasilkan ungkapan perbudakan yang kaku.
theological_decisions:
- issue: Rujukan πνεύματι dalam τῷ πνεύματι ζέοντες
  choice: roh manusia atau batin orang percaya
  alternative: Roh Kudus
  rationale: Konteks langsung berupa rangkaian nasihat etis mendukung pengertian roh atau batin orang percaya. Namun, bentuk Yunani tidak menyebutkan secara tegas rujukannya, sehingga kemungkinan rujukan kepada Roh Kudus tetap dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang lugas dan bermartabat. Struktur tiga seruan dipertahankan, sedangkan ungkapan pertama dibuat idiomatis agar pertentangan antara kesungguhan dan kemalasan terdengar alami.
