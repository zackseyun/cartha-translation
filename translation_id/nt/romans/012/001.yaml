id: ROM.12.1
reference: Romans 12:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν ⸂εὐάρεστον τῷ θεῷ⸃, τὴν λογικὴν λατρείαν ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/001.yaml
  text: Therefore I urge you[a], brothers, by the mercies of God, to present your bodies as a living sacrifice[b], holy and pleasing to God—your reasonable worship.
translation:
  language: id
  text: Karena itu, Saudara-saudara[a], demi belas kasihan Allah, aku mendesak kalian untuk mempersembahkan tubuh kalian sebagai korban yang hidup, kudus, dan berkenan kepada Allah, yaitu ibadah kalian yang masuk akal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudara-saudara laki-laki”; bentuk maskulin Yunani ini sering dipakai untuk menyapa kelompok yang mencakup laki-laki dan perempuan.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan “ibadah rohani kalian” atau “pelayanan rasional kalian.” Ungkapan Yunani dapat mengandung arti rasional, patut, atau rohani, dan kata untuk “ibadah” juga dapat berarti pelayanan kepada Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: aku mendesak
  rationale: Menyampaikan desakan rasuli yang sungguh-sungguh dengan bahasa Indonesia modern, tanpa kesan sekadar meminta.
- source_word: οὖν
  choice: Karena itu
  rationale: Menjaga hubungan kesimpulan dengan uraian Paulus dalam Roma 1–11.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan Indonesia ini wajar, bermartabat, dan dapat mencakup seluruh jemaat, sementara bentuk Yunani maskulin dijelaskan dalam catatan kaki.
- source_word: διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ
  choice: demi kemurahan-kemurahan Allah
  rationale: Menampilkan dasar permohonan atau desakan serta mempertahankan bentuk jamak οἰκτιρμῶν; 'demi' merupakan ungkapan seruan yang alami dalam bahasa Indonesia.
- source_word: παραστῆσαι
  choice: untuk mempersembahkan
  rationale: Menjaga nuansa penyerahan kepada Allah dan hubungan langsung dengan gambaran korban.
- source_word: τὰ σώματα ὑμῶν
  choice: tubuh kalian
  rationale: Mempertahankan istilah konkret 'tubuh', bukan memperluasnya secara diam-diam menjadi 'diri'.
- source_word: θυσίαν ζῶσαν
  choice: sebagai persembahan yang hidup
  rationale: Mempertahankan paradoks gambaran korban yang hidup; 'persembahan' menghindari kemungkinan salah paham bahwa orang percaya adalah korban penderitaan semata.
- source_word: ἁγίαν
  choice: kudus
  rationale: Padanan baku yang menyampaikan keadaan dikhususkan bagi Allah.
- source_word: εὐάρεστον τῷ θεῷ
  choice: berkenan kepada Allah
  rationale: Ungkapan Indonesia yang alami untuk sesuatu yang menyenangkan atau diterima dengan perkenanan Allah.
- source_word: λογικὴν
  choice: yang masuk akal
  rationale: Menjaga arti yang berkaitan dengan nalar, kewajaran, atau kesesuaian tanpa langsung menetapkannya sebagai 'rohani'; ambiguitas dicatat.
- source_word: λατρείαν
  choice: ibadah
  rationale: Menyampaikan pelayanan kultis yang diarahkan kepada Allah dan sesuai dengan konteks persembahan.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί kepada jemaat campuran
  choice: Saudara-saudara
  alternative: Saudara-saudari
  rationale: Bentuk sumber adalah maskulin jamak, tetapi dalam pemakaian surat dapat menyapa seluruh komunitas. Teks utama memakai sapaan Indonesia yang lazim, dan catatan menjelaskan bentuk serta cakupannya.
- issue: Makna λογικὴν λατρείαν
  choice: ibadah kalian yang masuk akal
  alternative: ibadah rohani kalian; pelayanan ibadah kalian yang berdasarkan akal budi
  rationale: λογικός dapat menunjuk pada hal yang rasional, patut, atau rohani, sedangkan λατρεία dapat berarti ibadah atau pelayanan kepada Allah. Terjemahan utama tetap dekat dan tidak meniadakan ketegangan leksikal; alternatif dicantumkan dalam catatan.
- issue: Gambaran θυσίαν ζῶσαν
  choice: persembahan yang hidup
  alternative: korban yang hidup
  rationale: Keduanya memungkinkan secara leksikal. 'Persembahan' tetap membawa konteks kultis dalam bahasa Indonesia dan berpadu alami dengan verba 'mempersembahkan', sedangkan bentuk alternatif yang lebih harfiah dicakup oleh penjelasan leksikal tanpa mengubah paradoks Paulus.
translation_notes:
  register: Bahasa Indonesia modern, formal namun mudah dipahami. Pronomina 'aku/kalian' mempertahankan perbedaan orang pertama tunggal dan orang kedua jamak secara jelas. Pengulangan 'kalian' mengikuti struktur sumber dan menghindari ambiguitas kepemilikan.
