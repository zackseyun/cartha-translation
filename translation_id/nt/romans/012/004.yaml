  text: καθάπερ γὰρ ἐν ἑνὶ σώματι ⸂πολλὰ μέλη⸃ ἔχομεν, τὰ δὲ μέλη πάντα οὐ τὴν αὐτὴν ἔχει πρᾶξιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/004.yaml
  text: For just as in one body we have many members[a], but the members do not all have the same function[b],
translation:
  language: id
  text: Sebab sama seperti dalam satu tubuh kita mempunyai banyak anggota[a], tetapi tidak semua anggota itu mempunyai fungsi[b] yang sama,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “banyak bagian”.
    reason: lexical_alternative
  - marker: b
    text: Atau “kegiatan”. Kata Yunani ini dapat menunjuk pada kegiatan atau fungsi; dalam metafora tubuh dan konteks peran yang berbeda-beda, “fungsi” paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Sebab, sama seperti
  rationale: “Sebab” mempertahankan hubungan penjelas dengan nasihat sebelumnya, sedangkan “sama seperti” membuka perbandingan yang dilanjutkan pada ayat berikutnya.
- source_word: ἐν ἑνὶ σώματι
  choice: dalam satu tubuh
  rationale: Padanan lokatif yang langsung dan alami, sekaligus mempertahankan kesatuan tubuh dalam metafora Paulus tanpa menyebut gereja secara eksplisit.
- source_word: πολλὰ μέλη
  choice: banyak anggota
  rationale: “Anggota” mempertahankan gambaran anatomis sekaligus memungkinkan penerapan korporat; “bagian” juga mungkin, tetapi kurang kuat mempertahankan metafora tersebut.
- source_word: ἔχομεν
  choice: kita mempunyai
  rationale: Menerjemahkan bentuk kini indikatif secara langsung dan wajar dalam ragam Indonesia baku.
- source_word: τὰ δὲ μέλη πάντα οὐ
  choice: tetapi tidak semua anggota itu
  rationale: 'Susunan ini menyampaikan kontras δέ dan cakupan negasi dengan jelas: yang disangkal bukan keberadaan fungsi, melainkan bahwa semua anggota memiliki fungsi yang sama.'
- source_word: τὴν αὐτὴν ἔχει πρᾶξιν
  choice: mempunyai fungsi yang sama
  rationale: Dalam metafora tubuh dan konteks karunia yang berbeda-beda, “fungsi” menyampaikan πρᾶξις secara alami; “kegiatan” tetap merupakan kemungkinan leksikal.
theological_decisions:
- issue: Daya gerejawi metafora tubuh
  choice: Mempertahankan ungkapan “satu tubuh” dan “banyak anggota” tanpa menambahkan “gereja”.
  alternative: Menjelaskan di dalam teks sebagai “satu tubuh, yaitu gereja”.
  rationale: Ayat ini menyatakan sisi pertama analogi, sedangkan penerapannya kepada komunitas orang percaya dikemukakan pada ayat berikutnya. Terjemahan mempertahankan perkembangan argumen Paulus.
- issue: Keragaman fungsi anggota
  choice: Menerjemahkan πρᾶξις sebagai “fungsi” tanpa mempersempitnya menjadi jabatan atau pelayanan tertentu.
  alternative: “Peran”, “kegiatan”, atau istilah jabatan gerejawi tertentu.
  rationale: “Fungsi” sesuai dengan metafora tubuh dan tetap cukup luas untuk menjaga ketegangan serta cakupan konteks karunia yang beragam.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Koma penutup dipertahankan karena ayat ini merupakan anak kalimat perbandingan yang diselesaikan dalam ayat berikutnya. Semua penanda catatan kaki ditempatkan langsung sesudah istilah terkait.
