  yaml_path: translation/nt/romans/012/017.yaml
  text: Repaying no one evil for evil[a], but taking thought for what is good in the sight of all people.
translation:
  language: id
  text: Janganlah membalas kejahatan dengan kejahatan kepada siapa pun. Usahakanlah hal-hal yang baik[a] di hadapan semua orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hal-hal yang terhormat” atau “hal-hal yang mulia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδενὶ
  choice: kepada siapa pun
  rationale: Datif tunggal ini menjadi objek tak langsung dari ἀποδιδόντες. Dalam konstruksi negatif bahasa Indonesia, “kepada siapa pun” menyampaikan cakupan universal secara alami.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: kejahatan dengan kejahatan
  rationale: Ungkapan ini menyatakan balasan setimpal atau pembalasan. “Membalas kejahatan dengan kejahatan” alami dalam bahasa Indonesia dan mempertahankan bobot moral κακόν.
- source_word: ἀποδιδόντες
  choice: Janganlah membalas
  rationale: Partisipel ini memiliki daya nasihat atau perintah dalam konteks. Bentuk larangan eksplisit menghasilkan bahasa Indonesia yang alami tanpa mengubah maksudnya.
- source_word: προνοούμενοι
  choice: Pikirkanlah baik-baik untuk melakukan
  rationale: Kata ini mencakup pemikiran yang saksama dan berorientasi ke depan. Rumusan ini mempertahankan unsur pertimbangan serta menghubungkannya secara alami dengan καλά.
- source_word: καλὰ
  choice: apa yang baik
  rationale: Pilihan ini mempertahankan makna etis yang luas, sambil tidak membatasi istilah itu hanya pada reputasi sosial. Nuansa “terhormat” dan “luhur” dicatat dalam catatan kaki.
- source_word: ἐνώπιον πάντων ἀνθρώπων
  choice: di hadapan semua orang
  rationale: Rumusan ini dekat dengan arti harfiah ἐνώπιον dan menyampaikan dimensi publik serta pertanggungjawaban sosial. “Semua orang” tepat untuk ἀνθρώπων yang bersifat generik.
theological_decisions:
- issue: Nuansa etis καλά dalam konteks publik
  choice: apa yang baik
  alternative: apa yang terhormat; apa yang luhur
  rationale: καλά dapat menunjuk pada sesuatu yang baik secara moral sekaligus terhormat di mata masyarakat. Teks utama mempertahankan cakupan yang luas, sedangkan nuansa kehormatan disimpan dalam catatan kaki agar ketegangan maknanya tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang tegas dan bermartabat. Dua partisipel Yunani diterjemahkan sebagai bentuk imperatif agar alur nasihat alami dalam bahasa Indonesia; pengulangan “kejahatan” dipertahankan demi daya retoris.
