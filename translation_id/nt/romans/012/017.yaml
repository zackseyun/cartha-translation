    rationale: προνοούμενοι berarti mempertimbangkan atau mengusahakan lebih dahulu, sedangkan καλὰ adalah ‘hal-hal yang baik/terhormat’. Walaupun tindakan dapat tersirat, frasa draft membuat hubungan ‘berpikir untuk melakukan’ lebih eksplisit daripada bahasa sumber dan kurang alami.
  - severity: low
    issue: Catatan kaki menggunakan bentuk tunggal “apa yang ...”, sedangkan revisi yang lebih dekat dengan bentuk jamak καλὰ memakai “hal-hal yang baik”.
    rationale: Penyesuaian bentuk meningkatkan koherensi antara teks utama dan alternatif leksikal tanpa mengubah makna.
