  source_fidelity: Baris pertama menyampaikan larangan μηδενὶ κακὸν ἀντὶ κακοῦ ἀποδιδόντες dengan setia. Namun, “Pikirkanlah baik-baik untuk melakukan” agak mempersempit dan memperjelas προνοούμενοι sebagai tindakan melakukan. Kata itu terutama menuntut pertimbangan/perencanaan yang cermat demi hal-hal yang baik; bentuk “usahakanlah” menyampaikan daya nasihatnya tanpa tambahan yang tidak perlu.
  naturalness: “Janganlah membalas kejahatan dengan kejahatan kepada siapa pun” jelas dan baku. Pada kalimat kedua, “Pikirkanlah baik-baik untuk melakukan” terasa bertele-tele dan kurang idiomatis. “Usahakanlah hal-hal yang baik di hadapan semua orang” lebih ringkas, lancar, dan tetap bernada nasihat.
  terminology: “Kejahatan,” “hal-hal yang baik,” dan “semua orang” tepat dan inklusif. Catatan kaki perlu disesuaikan dengan bentuk jamak substantival pada teks revisi; “terhormat” merupakan alternatif yang sangat relevan bagi καλά dalam konteks penilaian publik.
  issues:
