id: ROM.12.14
reference: Romans 12:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εὐλογεῖτε τοὺς ⸀διώκοντας, εὐλογεῖτε καὶ μὴ καταρᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/014.yaml
  text: Bless those who persecute you[a]; bless and do not curse.
translation:
  language: id
  text: Berkatilah orang-orang yang menganiaya kalian[a]; berkatilah dan jangan mengutuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang mengejar kalian.” Kata kerja Yunani yang digunakan dapat berarti “mengejar”, tetapi di sini kemungkinan besar merujuk pada penganiayaan oleh pihak yang bermusuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Berkatilah
  rationale: Bentuk perintah jamak ini secara alami diterjemahkan sebagai “Berkatilah” dan mempertahankan makna etis-religius untuk memohonkan atau menyatakan kebaikan bagi orang lain. Pengulangannya dipertahankan untuk mencerminkan penekanan Paulus.
- source_word: τοὺς διώκοντας
  choice: orang-orang yang menganiaya kalian
  rationale: Partisip dengan artikel ini berfungsi sebagai nomina, yaitu “orang-orang yang menganiaya.” Dalam konteks nasihat menghadapi lawan yang bermusuhan, “menganiaya” lebih tepat daripada arti luas “mengejar.” Kata “kalian” dibuat eksplisit agar hubungan objeknya jelas dan wajar dalam bahasa Indonesia.
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung sederhana ini mengaitkan pengulangan perintah positif dengan larangan yang berlawanan; “dan” mempertahankan susunan lugas teks Yunani.
- source_word: μὴ καταρᾶσθε
  choice: jangan mengutuk
  rationale: Bentuk perintah dengan μή menyatakan larangan. “Jangan mengutuk” jelas, ringkas, dan mempertahankan pertentangan langsung dengan “berkatilah,” tanpa mempersempitnya menjadi sekadar mengucapkan formula kutuk.
theological_decisions:
- issue: Cakupan makna διώκω dalam konteks
  choice: Dipahami sebagai penganiayaan yang bermusuhan
  alternative: orang-orang yang mengejar kalian
  rationale: Walaupun διώκω juga dapat berarti “mengejar,” dalam konteks etika Paulus dan penggunaan Perjanjian Baru kata ini sering menunjuk pada penganiayaan. Pertentangan antara memberkati dan mengutuk turut mendukung makna tersebut, sementara kemungkinan leksikal yang lebih luas dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Pronomina jamak “kalian” dipakai untuk menyatakan bahwa perintah Yunani ditujukan kepada komunitas, sekaligus menghindari ketaksaan jumlah pada “Anda.” Repetisi “berkatilah” dipertahankan sebagai penekanan retoris teks sumber.
