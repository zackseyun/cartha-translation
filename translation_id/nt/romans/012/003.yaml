    rationale: ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως secara eksplisit menyebut tindakan Allah membagikan ukuran iman kepada setiap orang. “Sebagaimana Allah telah membagikan ...” menyampaikan struktur itu langsung dan membiarkan hubungan tepatnya dengan nasihat sebelumnya tetap terbuka.
  - severity: low
