  verdict: revise
  source_fidelity: Klausa terakhir draft, “sesuai dengan ukuran iman yang telah Allah bagikan,” menggeser ὡς menjadi dasar normatif bagi penilaian diri. Walaupun pembacaan itu mungkin secara penafsiran, teks Yunani secara langsung menyatakan bahwa Allah telah membagikan kepada masing-masing μέτρον πίστεως. Terjemahan revisi mempertahankan hubungan ini tanpa menentukannya lebih jauh.
  naturalness: Bahasa draft umumnya baku dan jelas. Namun, “menilai diri” dua kali terdengar agak administratif dan membatasi φρονέω pada evaluasi diri. Revisi menggunakan “memandang dirinya” untuk peringatan terhadap penilaian diri yang terlalu tinggi, lalu “berpikir dengan bijaksana” untuk mempertahankan gerak kata φρονέω/σωφρονέω secara lebih alami.
  terminology: “Anugerah,” “Allah,” dan “iman” tepat. “Suatu ukuran iman” mempertahankan ketidakpastian relasi genitif dalam μέτρον πίστεως dan tidak mengunci maknanya sebagai kapasitas, standar, atau tingkat iman.
