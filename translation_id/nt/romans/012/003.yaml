  text: Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν, ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/003.yaml
  text: For by the grace given to me I say to everyone among you not to think of himself more highly than he ought to think, but to think with sound judgment, as God has apportioned to each a measure of faith.
translation:
  language: id
  text: Sebab, oleh anugerah yang diberikan kepadaku, aku berkata kepada setiap orang di antara kalian agar tidak memandang dirinya lebih tinggi daripada yang sepatutnya, melainkan agar berpikir dengan bijaksana,[a] sebagaimana Allah telah membagikan kepada masing-masing suatu ukuran iman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “melainkan agar berpikir dengan pikiran yang waras.” Ungkapan Yunani memakai permainan kata yang menghubungkan “berpikir” dengan “berpikiran waras/bijaksana.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “ukuran iman.” Frasa Yunani ini juga mungkin dipahami sebagai ukuran yang berkaitan dengan kepercayaan atau kesetiaan, tetapi tidak menjelaskan nuansa tepatnya secara pasti.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τῆς χάριτος τῆς δοθείσης μοι
  choice: berdasarkan anugerah yang diberikan kepadaku
  rationale: διά dengan genitif dapat menyatakan sarana atau dasar. 'Berdasarkan' secara alami menunjukkan bahwa perkataan Paulus bertumpu pada anugerah dan penugasan yang Allah berikan kepadanya.
- source_word: παντὶ τῷ ὄντι ἐν ὑμῖν
  choice: kepada setiap orang di antara kalian
  rationale: Ungkapan partisipial ini menunjuk secara distributif kepada setiap anggota komunitas; bentuk ini alami dalam bahasa Indonesia dan mempertahankan cakupannya.
- source_word: μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν
  choice: Janganlah menilai diri lebih tinggi daripada yang sepatutnya
  rationale: Terjemahan ini mempertahankan gagasan penilaian diri yang melampaui batas semestinya dan, bersama klausa berikut, mencerminkan pengulangan akar φρονέω.
- source_word: ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν
  choice: tetapi nilailah diri dengan pertimbangan yang sehat
  rationale: σωφρονεῖν mencakup pemikiran yang waras, bijaksana, dan terkendali. Pilihan ini jelas bagi pembaca modern sambil mempertahankan dimensi mental-etisnya.
- source_word: ἐμέρισεν
  choice: telah ... bagikan
  rationale: μερίζω berarti membagi atau membagikan. Bentuk ini alami dalam bahasa Indonesia dan menyatakan tindakan Allah dalam memberikan bagian kepada tiap orang.
- source_word: μέτρον πίστεως
  choice: ukuran iman
  rationale: Terjemahan ini mempertahankan hubungan genitif yang terbuka dan tidak menentukan apakah iman adalah kapasitas, tolok ukur, atau pemberian untuk pelayanan.
- source_word: ἑκάστῳ
  choice: kepada masing-masing
  rationale: 'Mempertahankan daya distributif datif: pemberian Allah berlaku kepada tiap orang secara individual.'
theological_decisions:
- issue: Makna μέτρον πίστεως
  choice: ukuran iman
  alternative: suatu ukuran kepercayaan; tolok ukur iman; kapasitas terkait karunia yang Allah berikan
  rationale: Konteks selanjutnya membahas keragaman karunia, tetapi frasa Yunani tidak menetapkan secara tegas apakah yang dimaksud ialah kadar iman, standar iman, atau kapasitas pelayanan. Terjemahan utama mempertahankan ketegangan ini.
- issue: Hubungan ὡς dengan nasihat sebelumnya
  choice: sesuai dengan ukuran iman yang telah Allah bagikan
  alternative: sebagaimana Allah telah membagikan suatu ukuran iman
  rationale: ὡς dapat memperkenalkan ukuran atau dasar yang sesuai bagi penilaian diri. 'Sesuai dengan' menyatakan hubungan tersebut tanpa mempersempit hakikat 'ukuran iman'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai bentuk jamak ὑμῖν secara jelas. Pengulangan 'menilai diri' mempertahankan hubungan retoris antarklausa, sedangkan catatan kaki menjaga alternatif yang lebih harfiah dan ambiguitas μέτρον πίστεως.
