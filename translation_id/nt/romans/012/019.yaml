id: ROM.12.19
reference: Romans 12:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ, γέγραπται γάρ· Ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/019.yaml
  text: 'Do not avenge yourselves[a], beloved, but give place to wrath, for it is written: “Vengeance is mine; I will repay[b], says the Lord.”'
translation:
  language: id
  text: Janganlah membalas dendam sendiri, Saudara-saudara yang terkasih, tetapi berilah tempat bagi murka[a], sebab ada tertulis, “Pembalasan adalah hak-Ku; Aku akan membalas[b],” firman Tuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berilah ruang bagi murka”; berdasarkan kutipan sesudahnya, kemungkinan besar yang dimaksud ialah murka Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Aku akan memberikan balasan yang setimpal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἑαυτοὺς ἐκδικοῦντες
  choice: Janganlah membalas dendam sendiri
  rationale: Menyampaikan larangan yang berfungsi imperatif serta mempertahankan unsur refleksif ἑαυτούς dalam bahasa Indonesia yang alami.
- source_word: ἀγαπητοί
  choice: Saudara-saudara yang terkasih
  rationale: Sapaan ini mempertahankan kehangatan kasih dan nuansa komunal tanpa membatasi rujukan pada satu gender.
- source_word: ἀλλὰ δότε τόπον τῇ ὀργῇ
  choice: tetapi berilah tempat kepada murka
  rationale: Mempertahankan metafora harfiah 'memberi tempat' dan tidak menambahkan 'Allah', sebab teks Yunani hanya menyebut 'murka' meskipun konteks menunjuk kuat kepada murka Allah.
- source_word: γέγραπται γάρ
  choice: sebab ada tertulis
  rationale: Ungkapan baku dan bermartabat untuk formula pengantar kutipan Kitab Suci.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: Pembalasan adalah hak-Ku
  rationale: Dativus kepunyaan menyatakan bahwa pembalasan merupakan prerogatif Tuhan; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya pernyataannya.
- source_word: ἐγὼ ἀνταποδώσω
  choice: Aku akan membalas
  rationale: Menyampaikan tindakan pembalasan setimpal dalam konteks penghakiman dengan ungkapan Indonesia yang jelas.
- source_word: λέγει κύριος
  choice: firman Tuhan
  rationale: Formula kutipan kenabian ini lebih alami dan tetap khidmat dalam bahasa Indonesia daripada terjemahan mekanis 'kata Tuhan'.
theological_decisions:
- issue: Rujukan τῇ ὀργῇ ('murka')
  choice: Mempertahankan ungkapan ringkas 'murka' dalam teks utama, dengan catatan bahwa konteks kemungkinan besar menunjuk kepada murka Allah.
  alternative: Menuliskan secara eksplisit 'murka Allah' atau memahami ungkapan itu sebagai murka manusia secara umum.
  rationale: Kutipan berikutnya dari Ulangan 32:35 mendasarkan larangan pembalasan pribadi pada hak Allah untuk menghakimi. Namun, karena kata 'Allah' tidak dinyatakan dalam frasa Yunani tersebut, ambiguitasnya tidak diselesaikan secara diam-diam.
- issue: Makna Ἐμοὶ ἐκδίκησις
  choice: Pembalasan adalah hak-Ku
  alternative: Pembalasan adalah milik-Ku
  rationale: Keduanya mencerminkan konstruksi kepunyaan, tetapi 'hak-Ku' lebih alami dalam bahasa Indonesia dan menonjolkan prerogatif ilahi tanpa menambahkan gagasan denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'Saudara-saudara yang terkasih' dipilih agar hangat serta inklusif. Kapitalisasi pada kata ganti dalam kutipan mengikuti kebiasaan umum penerjemahan Alkitab bahasa Indonesia.
