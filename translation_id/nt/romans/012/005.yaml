  text: so we[a], though many, are one body in Messiah, and individually members of one another.
translation:
  language: id
  text: Demikianlah kita, walaupun banyak, adalah satu tubuh dalam Mesias,[a] dan kita masing-masing adalah anggota satu sama lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dalam Kristus.” Gelar Yunani Χριστός dapat diterjemahkan dengan kedua cara; di sini digunakan “Mesias” untuk mempertahankan maknanya sebagai gelar.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: demikian juga
  rationale: Menghubungkan ayat ini dengan perumpamaan tubuh pada ayat sebelumnya serta mempertahankan daya komparatifnya.
- source_word: οἱ πολλοὶ
  choice: kita, meskipun banyak
  rationale: Konteks menunjukkan bahwa Paulus berbicara secara inklusif; bentuk ini wajar dalam bahasa Indonesia dan mempertahankan kontras antara banyak orang dan satu tubuh.
- source_word: ἓν σῶμά
  choice: satu tubuh
  rationale: Mempertahankan metafora tubuh dan penekanan pada kesatuan.
- source_word: ἐν Χριστῷ
  choice: dalam Mesias
  rationale: Menerjemahkan Χριστός sebagai gelar dan mempertahankan ungkapan khas Paulus tentang keberadaan bersama dalam Mesias.
- source_word: τὸ δὲ καθ’ εἷς
  choice: dan masing-masing
  rationale: Menyampaikan daya distributif ungkapan Yunani secara ringkas dan alami.
- source_word: ἀλλήλων
  choice: seorang terhadap yang lain
  rationale: Menjaga sifat timbal balik relasi yang dinyatakan oleh pronomina Yunani.
- source_word: μέλη
  choice: anggota
  rationale: Padanan baku yang mempertahankan citra bagian-bagian tubuh sekaligus hubungan dalam suatu kesatuan.
theological_decisions:
- issue: Penerjemahan Χριστῷ dalam frasa ἐν Χριστῷ
  choice: dalam Mesias
  alternative: dalam Kristus
  rationale: Χριστός tetap mengandung nilai gelar. Pilihan “Mesias” menampakkan makna gelar tersebut tanpa menghilangkan gagasan Paulus tentang persatuan di dalam Dia.
- issue: Hubungan antaranggota dalam ἀλλήλων μέλη
  choice: anggota seorang terhadap yang lain
  alternative: saling menjadi anggota
  rationale: 'Pilihan ini mempertahankan konstruksi yang tegang tetapi bermakna: tiap orang bukan hanya anggota tubuh yang sama, melainkan anggota dalam hubungan timbal balik dengan yang lain.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat cukup dekat dengan teks Yunani, sambil memperjelas subjek orang pertama yang tersirat oleh konteks. Tanda catatan ditempatkan langsung sesudah “Mesias” karena catatan hanya berkaitan dengan istilah itu.
