id: ROM.12.18
reference: Romans 12:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δυνατόν, τὸ ἐξ ὑμῶν μετὰ πάντων ἀνθρώπων εἰρηνεύοντες·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/018.yaml
  text: If possible[a], as far as it depends on you, live at peace with all people.
translation:
  language: id
  text: Jika mungkin[a], sejauh hal itu bergantung pada kalian, hiduplah dalam damai dengan semua orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jika hal itu mungkin, dari pihak kalian, hiduplah dalam damai dengan semua orang.”
    reason: Alternatif ini mempertahankan kemungkinan pembacaan εἰ δυνατόν dan τὸ ἐξ ὑμῶν sebagai dua ungkapan yang lebih erat berkaitan.
lexical_decisions:
- source_word: εἰ δυνατόν
  choice: Jika mungkin
  rationale: Ungkapan bersyarat ini memberi batasan yang realistis, bukan menjadikan nasihat tersebut perintah mutlak tanpa pengecualian.
- source_word: τὸ ἐξ ὑμῶν
  choice: sejauh hal itu bergantung pada kalian
  rationale: Ungkapan ini menunjuk pada bagian yang berada dalam kuasa dan tanggung jawab para pembaca. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan batas tanggung jawab yang dinyatakan Paulus.
- source_word: μετὰ πάντων ἀνθρώπων
  choice: dengan semua orang
  rationale: ἄνθρωποι bersifat generik dan mencakup seluruh manusia, bukan hanya laki-laki.
- source_word: εἰρηνεύοντες
  choice: hiduplah dalam damai
  rationale: Partisipel kini berfungsi sebagai nasihat dalam konteks dan menyatakan sikap hidup yang berkelanjutan, bukan keadaan sesaat.
theological_decisions:
- issue: Cakupan dan batas nasihat untuk hidup dalam damai
  choice: Nasihat ini ditujukan kepada semua orang, tetapi tanggung jawab pembaca dibatasi pada apa yang sungguh bergantung pada mereka.
  alternative: Perdamaian wajib selalu tercapai apabila orang percaya bertindak benar.
  rationale: Dua batasan, εἰ δυνατόν dan τὸ ἐξ ὑμῶν, mempertahankan ketegangan antara cakupan universal nasihat dan kenyataan bahwa tercapainya perdamaian tidak sepenuhnya berada dalam kendali satu pihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “kalian” dipakai untuk menandai bentuk jamak ὑμῶν secara jelas; susunan kalimat tetap alami dan mudah dipahami.
