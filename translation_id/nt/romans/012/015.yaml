  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: χαίρειν μετὰ ⸀χαιρόντων, κλαίειν μετὰ κλαιόντων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/015.yaml
  text: Rejoice with those who rejoice[a]; weep with those who weep.
translation:
  language: id
  text: Bersukacitalah bersama orang yang bersukacita[a]; menangislah bersama orang yang menangis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan mempertahankan bentuk yang lebih harfiah, “Bergembiralah bersama orang yang bergembira; menangislah bersama orang yang sedang menangis.”
    reason: Alternatif leksikal dan aspek verbal.
lexical_decisions:
- source_word: χαίρειν
  choice: Bersukacitalah
  rationale: Infinitif aktif kini ini berfungsi sebagai perintah dalam rangkaian nasihat. Bentuk ini menyampaikan kegembiraan yang aktif dan mempertahankan kesejajaran dengan χαιρόντων.
- source_word: μετὰ
  choice: bersama
  rationale: Dengan bentuk genitif, μετά menyatakan kebersamaan atau penyertaan. 'Bersama' paling alami dan tepat dalam bahasa Indonesia.
- source_word: χαιρόντων
  choice: orang yang bersukacita
  rationale: Partisip aktif kini jamak ini dipakai secara substantival. Ungkapan tersebut alami, bersifat umum, dan mempertahankan pengulangan akar kata Yunani bersama χαίρειν.
- source_word: κλαίειν
  choice: menangislah
  rationale: Seperti χαίρειν, infinitif ini memiliki daya perintah. 'Menangis' mencakup ungkapan dukacita melalui air mata atau ratapan dan lebih dekat daripada 'berdukacita', yang cakupannya lebih luas.
- source_word: κλαιόντων
  choice: orang yang menangis
  rationale: Partisip aktif kini jamak ini dipakai secara substantival. Terjemahan ini jelas dan menjaga kesejajaran dengan 'orang yang bersukacita'.
theological_decisions:
- issue: Daya imperatif dari kedua infinitif dalam rangkaian nasihat
  choice: 'Menerjemahkan kedua infinitif sebagai perintah: ''Bersukacitalah ...; menangislah ...'''
  alternative: 'Menerjemahkannya sebagai infinitif: ''bersukacita ...; menangis ...'''
  rationale: Dalam konteks Roma 12:9–21, kedua infinitif berfungsi sebagai nasihat atau perintah. Bentuk imperatif menyampaikan fungsi wacananya secara alami tanpa menambahkan isi teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pengulangan 'bersukacita' dan 'menangis' dipertahankan untuk mencerminkan paralelisme serta pengulangan leksikal teks Yunani.
