translation:
  language: id
  text: Bersukacitalah dalam pengharapan, bertahanlah dalam kesesakan[a], dan bertekunlah dalam doa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penderitaan” atau “tekanan berat”; kata Yunaninya menunjuk pada keadaan terimpit, kesusahan, atau penderitaan.
    reason: lexical_alternative
  - marker: b
    text: Atau “abdikanlah dirimu kepada doa”; kata Yunaninya menekankan ketekunan dan pengabdian yang terus-menerus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδι
  choice: dalam pengharapan
  rationale: Bentuk datif dengan artikel menyatakan ranah atau dasar sukacita. 'Dalam pengharapan' alami dalam bahasa Indonesia dan mempertahankan kepadatan ungkapan Yunani.
- source_word: χαίροντες
  choice: bersukacitalah
  rationale: Partisipel kini ini berfungsi sebagai nasihat dalam rangkaian parenesis. Imperatif Indonesia menyampaikan fungsi tersebut secara alami, sedangkan bentuk partisipial yang harfiah akan terasa kaku.
- source_word: θλίψει
  choice: dalam kesesakan
  rationale: θλῖψις menggambarkan tekanan berat, penderitaan, atau keadaan terimpit. 'Kesesakan' mempertahankan citra tekanan dan bobot penderitaan tanpa membatasinya pada satu jenis kesulitan.
- source_word: ὑπομένοντες
  choice: bertahanlah
  rationale: ὑπομένω menyatakan keteguhan untuk tetap bertahan di bawah tekanan. 'Bertahanlah' ringkas, jelas, dan tidak menambahkan nuansa emosional yang tidak eksplisit.
- source_word: προσευχῇ
  choice: dalam doa
  rationale: Kata ini menunjuk pada doa secara umum. Artikel Yunani tidak perlu dinyatakan tersendiri dalam bahasa Indonesia.
- source_word: προσκαρτεροῦντες
  choice: bertekunlah
  rationale: προσκαρτερέω berarti terus berpegang dengan teguh, bertahan, atau membaktikan diri pada sesuatu. 'Bertekunlah' secara alami mencakup kesinambungan dan kesungguhan dalam doa.
