id: ROM.12.20
reference: Romans 12:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἐὰν⸃ πεινᾷ ὁ ἐχθρός σου, ψώμιζε αὐτόν· ἐὰν διψᾷ, πότιζε αὐτόν· τοῦτο γὰρ ποιῶν ἄνθρακας πυρὸς σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/020.yaml
  text: But if your enemy is hungry[a], feed him; if he is thirsty, give him something to drink; for by doing this you will heap burning coals on his head.
translation:
  language: id
  text: Namun, jika musuhmu lapar, berilah dia makan; jika ia haus, berilah dia minum. Sebab dengan berbuat demikian, kamu akan menimbun bara api di atas kepalanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bara-bara api”. Gambaran ini dapat menunjuk pada rasa malu yang membawa kepada pertobatan, kesadaran moral yang menyakitkan, atau penghakiman yang akan datang; metafora Yunaninya dipertahankan dalam teks utama.
    reason: Menjelaskan alternatif leksikal dan mempertahankan ambiguitas metafora yang diperdebatkan.
lexical_decisions:
- source_word: ἀλλὰ ἐὰν
  choice: Namun, jika
  rationale: ἀλλά menyatakan pertentangan dengan larangan membalas dendam pada ayat sebelumnya, sedangkan ἐάν memperkenalkan syarat. “Namun, jika” alami dalam bahasa Indonesia dan mempertahankan hubungan pertentangan tersebut.
- source_word: πεινᾷ
  choice: lapar
  rationale: Bentuk kini subjungtif dalam klausa bersyarat ini paling wajar diterjemahkan dengan keadaan “lapar” dalam bahasa Indonesia.
- source_word: ὁ ἐχθρός σου
  choice: musuhmu
  rationale: Bentuk tunggal tertentu dengan kata ganti kepunyaan diterjemahkan secara alami sebagai “musuhmu”, dengan ketunggalannya tetap dipertahankan.
- source_word: ψώμιζε αὐτόν
  choice: berilah dia makan
  rationale: Kata kerja imperatif ψωμίζω berarti menyediakan makanan. Ungkapan ini jelas, konkret, dan lebih alami daripada terjemahan harfiah yang kaku.
- source_word: ἐὰν διψᾷ
  choice: jika ia haus
  rationale: Terjemahan ini mempertahankan klausa bersyarat dan menyatakan keadaan haus secara idiomatis.
- source_word: πότιζε αὐτόν
  choice: berilah dia minum
  rationale: Imperatif ποτίζω berarti memberi minum. Pilihan ini tidak mempersempit minuman itu menjadi air karena bahasa Yunani tidak menyebut jenis minumannya.
- source_word: τοῦτο γὰρ ποιῶν
  choice: Sebab dengan berbuat demikian
  rationale: γάρ memberi alasan atau penjelasan, sementara konstruksi partisipial menyampaikan cara atau sarana. Terjemahan ini mempertahankan kedua nuansa tersebut secara alami.
- source_word: ἄνθρακας πυρὸς
  choice: bara api
  rationale: Secara harfiah ungkapan ini berarti “bara-bara api”. “Bara api” merupakan ungkapan Indonesia yang ringkas dan alami serta mempertahankan gambaran benda yang menyala.
- source_word: σωρεύσεις
  choice: kamu akan menimbun
  rationale: Bentuk indikatif mendatang ini menyatakan hasil yang akan terjadi. “Menimbun” mempertahankan gambaran menumpuk bara dalam jumlah besar.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: di atas kepalanya
  rationale: Terjemahan langsung dan alami ini mempertahankan gambaran konkret dalam metafora Yunani.
theological_decisions:
- issue: Makna metafora “menimbun bara api di atas kepalanya”
  choice: Metafora dipertahankan tanpa ditafsirkan dalam teks utama.
  alternative: Menjelaskannya sebagai rasa malu yang membawa kepada pertobatan, kesadaran moral yang menyakitkan, atau penghakiman yang akan datang.
  rationale: Makna tepat gambaran ini diperdebatkan. Menetapkan satu tafsiran dalam teks utama akan menghilangkan ambiguitas asli dan ketegangan teologisnya; karena itu, kemungkinan-kemungkinan utama hanya disebutkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Bentuk “berilah” mempertahankan daya imperatif, sedangkan pronomina “dia/ia” menjaga rujukan tunggal tanpa membuat gaya terasa kuno. Penanda catatan kaki ditempatkan setelah metafora yang dijelaskannya.
