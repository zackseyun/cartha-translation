revisions:
- from: Hendaklah kalian sehati satu sama lain. Janganlah mengarahkan pikiran kepada hal-hal yang tinggi[a], tetapi bergaullah dengan mereka yang rendah[b]. Janganlah menganggap diri kalian bijaksana.
  to: Hendaklah kalian sehati satu sama lain. Janganlah mengarahkan pikiran kepada hal-hal yang tinggi[a], tetapi bergaullah dengan orang-orang yang dipandang rendah[b]. Janganlah merasa diri kalian bijaksana menurut penilaian kalian sendiri.
  rationale: Revisi terbatas pada dua titik. “Orang-orang yang dipandang rendah” menghindari konotasi bahwa orang yang dimaksud memiliki watak rendah, sambil tetap memakai pembacaan sosial yang paling alami dalam teks utama. Catatan b tetap mencatat kemungkinan rujukan kepada hal-hal atau tugas-tugas rendah. Kalimat terakhir dibuat lebih eksplisit mengenai hikmat menurut penilaian sendiri, tanpa menghilangkan daya larangan progresif dari γίνεσθε.
