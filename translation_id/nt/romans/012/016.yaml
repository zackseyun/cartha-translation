review_pass:
  verdict: revise
  source_fidelity: Sebagian besar setia pada nasihat Yunani. Namun, “mereka yang rendah” dalam bahasa Indonesia modern mudah dipahami sebagai orang yang rendah akhlaknya, bukan orang yang berstatus rendah atau dipandang rendah; ini berisiko menggeser makna ταπεινοῖς. Revisi juga memperjelas unsur penilaian diri sendiri dalam φρόνιμοι παρ’ ἑαυτοῖς.
  naturalness: Struktur dan register baku sudah baik. “Orang-orang yang dipandang rendah” lebih alami dan tidak merendahkan sasaran rujukan. “Merasa diri ... bijaksana” merupakan idiom Indonesia yang wajar untuk larangan terhadap hikmat menurut penilaian sendiri.
  terminology: “Sehati,” “hal-hal yang tinggi,” dan “bijaksana” sesuai register modern dan menjaga keluasan makna. Catatan kaki mempertahankan ambiguitas substantival τοῖς ταπεινοῖς tanpa memaksakan satu penafsiran.
  issues:
  - severity: medium
    issue: Ungkapan “mereka yang rendah” berkonotasi negatif dalam bahasa Indonesia.
    rationale: Dalam pemakaian modern, “orang rendah” dapat berarti orang yang hina atau rendah budi. Bahasa Yunani ταπεινοῖς dalam konteks ini dapat menunjuk pada orang yang berkedudukan rendah/dipandang rendah, atau pada hal-hal rendah; karena itu istilah utama perlu menghindari penghakiman moral.
  - severity: low
    issue: “Menganggap diri kalian bijaksana” kurang eksplisit menyatakan “menurut pandangan/penilaian sendiri.”
    rationale: Frasa παρ’ ἑαυτοῖς adalah idiom tentang penilaian diri. Penambahan “menurut penilaian kalian sendiri” mempertahankan nuansa ini secara alami.
  revised_text: Hendaklah kalian sehati satu sama lain. Janganlah mengarahkan pikiran kepada hal-hal yang tinggi[a], tetapi bergaullah dengan orang-orang yang dipandang rendah[b]. Janganlah merasa diri kalian bijaksana menurut penilaian kalian sendiri.
