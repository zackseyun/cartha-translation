  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/016.yaml
  text: Be of the same mind toward one another[a]; do not set your mind on high things, but associate with the lowly[b]. Do not become wise in your own sight.
translation:
  language: id
  text: Hendaklah kalian sehati satu sama lain. Janganlah mengarahkan pikiran kepada hal-hal yang tinggi[a], tetapi bergaullah dengan orang-orang yang dipandang rendah[b]. Janganlah merasa diri kalian bijaksana menurut penilaian kalian sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “janganlah mengejar kedudukan yang tinggi” atau “janganlah tinggi hati.”
    reason: Frasa Yunani secara harfiah berarti memikirkan hal-hal yang tinggi dan dapat menunjuk pada ambisi, status, atau kesombongan.
  - marker: b
    text: Atau “libatkanlah diri dalam hal-hal yang rendah.” Kata Yunani yang diterjemahkan “orang-orang yang dipandang rendah” dapat dipahami sebagai orang-orang yang dipandang rendah atau hal-hal yang rendah.
    reason: Bentuk Yunani memungkinkan bacaan yang merujuk kepada orang maupun perkara atau tugas yang dipandang rendah.
lexical_decisions:
- source_word: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες
  choice: Hendaklah kalian sehati satu sama lain
  rationale: Ungkapan ini menunjuk pada keselarasan sikap dan kerukunan timbal balik, bukan keharusan memiliki setiap pemikiran yang identik. “Sehati satu sama lain” menyampaikan daya relasional dan nasihatnya secara alami dalam bahasa Indonesia.
- source_word: μὴ τὰ ὑψηλὰ φρονοῦντες
  choice: Janganlah mengarahkan pikiran kepada hal-hal yang tinggi
  rationale: Secara harfiah frasa ini berbicara tentang memikirkan “hal-hal yang tinggi”. Pilihan ini mempertahankan gambaran Yunani dan tetap membuka kemungkinan makna berupa kesombongan, ambisi akan kedudukan tinggi, atau ketertarikan pada perkara yang dipandang mulia.
- source_word: τοῖς ταπεινοῖς συναπαγόμενοι
  choice: tetapi bergaullah dengan mereka yang rendah
  rationale: Dalam konteks hubungan antarsesama, συναπαγόμενοι wajar diterjemahkan “bergaullah”, sedangkan τοῖς ταπεινοῖς secara gramatikal dapat menunjuk kepada orang-orang rendah atau, menurut pengertian lain, hal-hal yang rendah. Teks utama mengutamakan bacaan sosial yang alami, sementara ambiguitasnya dipertahankan dalam catatan kaki.
- source_word: μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς
  choice: Janganlah menganggap diri kalian bijaksana
  rationale: Ungkapan παρ’ ἑαυτοῖς menyatakan penilaian menurut pandangan sendiri. Terjemahan ini menyampaikan larangan terhadap keangkuhan intelektual secara jelas dan idiomatis; unsur γίνεσθε dipahami sebagai sikap yang jangan sampai diambil atau dikembangkan.
theological_decisions:
- issue: Makna τὰ ὑψηλά dan τοῖς ταπεινοῖς dalam nasihat tentang kerendahan hati
  choice: Teks utama menghubungkan “hal-hal yang tinggi” dengan pergaulan bersama orang-orang yang rendah, sambil mencatat keluasan makna kedua frasa.
  alternative: Janganlah menjadi tinggi hati, tetapi lakukanlah pekerjaan-pekerjaan yang rendah.
  rationale: Bahasa Yunani dapat mencakup sikap sombong, hasrat akan status tinggi, hubungan dengan orang berstatus rendah, atau kesediaan menerima hal dan tugas yang sederhana. Catatan kaki menjaga ketegangan ini tanpa membatasi nasihat Paulus hanya pada batin atau hanya pada tatanan sosial.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian” agar sifat komunal nasihat terlihat jelas. Gaya dibuat ringkas, bermartabat, dan mudah dipahami; “sehati” dipakai sebagai ungkapan alami bagi keselarasan sikap, sedangkan dua catatan kaki mempertahankan ambiguitas leksikal dalam bagian tengah ayat.
