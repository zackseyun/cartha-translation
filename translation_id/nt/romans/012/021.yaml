  text: μὴ νικῶ ὑπὸ τοῦ κακοῦ, ἀλλὰ νίκα ἐν τῷ ἀγαθῷ τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/021.yaml
  text: Do not be overcome by evil[a], but overcome evil with good.
translation:
  language: id
  text: Jangan dikalahkan oleh kejahatan,[a] tetapi kalahkanlah kejahatan dengan kebaikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jangan biarkan dirimu dikalahkan oleh apa yang jahat, tetapi kalahkanlah apa yang jahat dengan apa yang baik.” Dalam bahasa Yunani, kata sifat netral yang memakai kata sandang dapat diterjemahkan secara abstrak (“kejahatan”, “kebaikan”) atau sebagai “apa yang jahat” dan “apa yang baik”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νικῶ
  choice: Jangan dikalahkan
  rationale: Bentuk imperatif kini pasif orang kedua tunggal dengan μή menyatakan larangan. Pilihan ini mempertahankan gambaran kekalahan sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: ὑπὸ τοῦ κακοῦ
  choice: oleh kejahatan
  rationale: Ὑπό dengan genitif menandai pelaku atau kuasa yang menyebabkan kekalahan. Nomina-adjektival netral artikular dapat dipahami sebagai kategori abstrak, sehingga 'kejahatan' merupakan padanan alami.
- source_word: ἀλλὰ νίκα
  choice: tetapi kalahkanlah
  rationale: Ἀλλά menandai pertentangan tegas, sedangkan νίκα adalah imperatif kini aktif. 'Kalahkanlah' menjaga hubungan leksikal dan retoris dengan 'dikalahkan' pada klausa pertama.
- source_word: ἐν τῷ ἀγαθῷ
  choice: dengan kebaikan
  rationale: Ἐν dengan datif di sini paling wajar dipahami secara instrumental, yakni kebaikan sebagai sarana untuk mengalahkan kejahatan.
- source_word: τὸ κακόν
  choice: kejahatan
  rationale: Bentuk netral artikular ini dapat menunjuk secara umum kepada 'kejahatan' atau 'apa yang jahat'. Padanan abstrak menjaga antitesis ringkas dengan 'kebaikan'.
theological_decisions:
- issue: Apakah κακός/ἀγαθός dipersonalisasi atau diterjemahkan sebagai kategori moral
  choice: 'Kategori moral abstrak: ''kejahatan'' dan ''kebaikan'''
  alternative: 'Ungkapan kualitatif: ''apa yang jahat'' dan ''apa yang baik''; atau personalisasi seperti ''si jahat'''
  rationale: Bentuk netral dan konteks etis Roma 12 mendukung pengertian abstrak atau kualitatif. Teks tidak mengharuskan rujukan pribadi seperti Iblis, sehingga terjemahan tidak menambahkan referen teologis yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bernada nasihat yang tegas. Pengulangan akar 'kalah' mempertahankan permainan retoris bentuk pasif-aktif dalam bahasa Yunani, sedangkan 'kejahatan/kebaikan' terdengar alami dan bermartabat bagi pembaca umum.
