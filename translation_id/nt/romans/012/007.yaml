lexical_decisions:
- source_word: εἴτε
  choice: jika
  rationale: Dalam daftar eliptis ini, εἴτε memperkenalkan tiap fungsi secara bersyarat. 'Jika' mempertahankan susunan paralel yang ringkas dan alami dalam bahasa Indonesia.
- source_word: διακονίαν
  choice: pelayanan
  rationale: διακονία dapat menunjuk pada pelayanan, tindakan melayani, atau bantuan praktis. 'Pelayanan' cukup luas dan tidak dengan sendirinya membatasi maknanya pada jabatan gerejawi resmi.
- source_word: ἐν τῇ διακονίᾳ
  choice: hendaklah melayani
  rationale: Secara harfiah frasa ini berbunyi 'dalam pelayanan', tetapi dalam susunan eliptisnya berfungsi sebagai dorongan agar orang menjalankan karunia itu. Bentuk verbal menghasilkan bahasa Indonesia yang alami tanpa mengubah maksudnya.
- source_word: ὁ διδάσκων
  choice: orang mengajar
  rationale: Partisipel substantival ini menyoroti orang yang melakukan kegiatan mengajar, bukan secara tegas suatu jabatan resmi. Pilihan ini mempertahankan penekanan fungsional tersebut.
- source_word: διδασκαλίᾳ
  choice: mengajar
  rationale: διδασκαλία di sini menunjuk pada kegiatan pengajaran. 'Mengajar' sesuai dengan struktur eliptis dan lebih alami daripada pengulangan nominal yang kaku.
theological_decisions:
- issue: Apakah διακονία harus diterjemahkan dengan istilah jabatan gerejawi
  choice: pelayanan
  alternative: tugas pelayanan; tindakan melayani
  rationale: Konteksnya adalah daftar karunia atau fungsi. 'Pelayanan' menjaga keluasan istilah Yunani tanpa menganggapnya sebagai jabatan gerejawi formal.
- issue: Apakah ὁ διδάσκων harus dijadikan gelar jabatan
  choice: orang mengajar
  alternative: pengajar
  rationale: Bentuk partisipel Yunani menekankan pelaku kegiatan mengajar. Terjemahan ini menghindari penetapan struktur jabatan yang tidak dinyatakan secara eksplisit.
- issue: Cara menyampaikan konstruksi eliptis ἐν τῇ διακονίᾳ dan ἐν τῇ διδασκαλίᾳ
  choice: hendaklah melayani ... hendaklah mengajar
  alternative: dalam pelayanan ... dalam pengajaran
  rationale: Bahasa Yunani menghilangkan unsur verbal yang dipahami dari konteks. Menambahkan 'hendaklah' menyampaikan daya nasihat ayat dengan alami, sementara catatan kaki mempertahankan bentuk literal dan ambiguitas sintaksisnya.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur paralel dipertahankan, sedangkan elipsis Yunani diungkapkan secara idiomatis dengan 'hendaklah'. Semua penanda catatan kaki terdapat dalam teks utama.
