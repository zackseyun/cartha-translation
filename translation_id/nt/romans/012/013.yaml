  text: sharing in the needs of the saints[b][a], pursuing hospitality.
translation:
  language: id
  text: Ambillah bagian dalam memenuhi kebutuhan orang-orang kudus[a] dan berusahalah menunjukkan keramahtamahan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berkontribusilah untuk memenuhi kebutuhan orang-orang kudus.” Dalam pemakaian Paulus, “orang-orang kudus” merujuk kepada umat Allah, yaitu orang-orang percaya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “keramahtamahan”; istilah Yunani ini dapat mencakup sikap menyambut orang asing atau pendatang dengan ramah.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαις
  choice: kebutuhan
  rationale: Kata ini menunjuk pada kebutuhan praktis atau keperluan hidup; “kebutuhan” alami dan jelas dalam bahasa Indonesia modern.
- source_word: ἁγίων
  choice: orang-orang kudus
  rationale: Dalam pemakaian Paulus, istilah ini merujuk kepada umat Allah yang percaya secara umum, bukan hanya tokoh tertentu yang kemudian dikanonisasi.
- source_word: κοινωνοῦντες
  choice: turutlah menanggung
  rationale: Bentuk ini menyampaikan partisipasi aktif dalam memenuhi kebutuhan, tanpa mempersempitnya hanya menjadi sumbangan uang.
- source_word: φιλοξενίαν
  choice: menerima orang asing dengan ramah
  rationale: Ungkapan ini menampilkan unsur φιλοξενία sebagai keramahtamahan yang secara khusus terbuka kepada orang asing atau pendatang.
- source_word: διώκοντες
  choice: kejarlah kesempatan
  rationale: διώκω mengandung daya aktif dan kesungguhan; ungkapan ini menyatakan bahwa keramahtamahan harus dicari dan diupayakan, bukan sekadar dilakukan ketika diminta.
theological_decisions:
- issue: Rujukan “orang-orang kudus”
  choice: seluruh orang percaya sebagai umat kudus Allah
  alternative: orang-orang tertentu yang dikanonisasi sebagai santo atau santa
  rationale: Dalam surat-surat Paulus, οἱ ἅγιοι lazimnya merupakan sebutan kolektif bagi orang percaya. Terjemahan mempertahankan istilah teologisnya sambil menjelaskan maknanya dalam catatan.
- issue: Cakupan κοινωνοῦντες
  choice: ikut mengambil bagian dalam menanggung kebutuhan
  alternative: memberikan sumbangan bagi kebutuhan
  rationale: Makna kontribusi memang hadir dalam konteks, tetapi verba ini lebih luas daripada pemberian materi saja dan dapat mencakup berbagai bentuk partisipasi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk imperatif dipakai agar rangkaian nasihat terdengar alami dalam bahasa sasaran, sementara kekuatan partisipial Yunani dipertahankan melalui tindakan aktif “turutlah” dan “kejarlah.”
