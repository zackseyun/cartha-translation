id: ROM.5.18
reference: Romans 5:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἄρα οὖν ὡς δι’ ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι’ ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/018.yaml
  text: So then[a], as through one trespass condemnation came to all people, so also through one righteous act justification that brings life came to all people.
translation:
  language: id
  text: Jadi, sebagaimana melalui satu pelanggaran datang penghukuman bagi semua orang, demikian juga melalui satu perbuatan benar datang pembenaran yang membawa hidup[a] bagi semua orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “pembenaran hidup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Jadi
  rationale: Menyampaikan daya simpulan dari rangkaian partikel inferensial ini secara alami dalam bahasa Indonesia modern.
- source_word: παραπτώματος
  choice: pelanggaran
  rationale: Menunjuk pada satu tindakan salah tertentu dan mempertahankan kesejajarannya dengan satu perbuatan benar.
- source_word: κατάκριμα
  choice: penghukuman
  rationale: Mempertahankan nuansa yudisial istilah Yunani dan kontras Paulus antara akibat tindakan Adam dan tindakan Kristus.
- source_word: δικαιώματος
  choice: perbuatan benar
  rationale: Dalam konteks ini bentuk tunggal menunjuk pada satu tindakan yang benar; pilihan ini alami dan tidak mempersempitnya dengan penafsiran tambahan.
- source_word: δικαίωσιν ζωῆς
  choice: pembenaran yang membawa hidup
  rationale: Mengungkapkan hubungan genitif secara jelas sambil mempertahankan unsur yudisial 'pembenaran' dan hasilnya, yaitu hidup.
- source_word: πάντας ἀνθρώπους
  choice: semua orang
  rationale: Mencerminkan cakupan manusiawi yang inklusif dan mempertahankan frasa identik pada kedua sisi perbandingan.
theological_decisions:
- issue: Apakah frasa kedua πάντας ἀνθρώπους perlu dipersempit untuk menghindari kesan cakupan universal
  choice: Mempertahankan 'semua orang' tanpa pembatas interpretatif
  alternative: '''semua orang yang percaya'' atau ''semua orang yang dibenarkan'''
  rationale: Bahasa Yunani mengulangi frasa yang sama pada kedua sisi perbandingan. Mempersempit frasa kedua akan menyelesaikan ketegangan teologis yang dibiarkan teks untuk diterangkan oleh konteks yang lebih luas.
- issue: Elipsis verba dalam kedua klausa
  choice: Menambahkan 'datang' pada kedua klausa untuk menghasilkan kalimat Indonesia yang utuh
  alternative: Membiarkan kedua klausa tanpa verba sebagaimana bentuk eliptis Yunani
  rationale: Bahasa Yunani mengandalkan struktur eliptis yang dipahami dari konteks. Pengulangan verba netral 'datang' membuat hubungan perbandingan jelas tanpa menentukan pelaku atau mekanisme yang tidak disebutkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur 'sebagaimana ... demikian juga ...' mempertahankan kesejajaran retoris teks Yunani, sedangkan istilah yudisial 'penghukuman' dan 'pembenaran' dipertahankan secara konsisten.
