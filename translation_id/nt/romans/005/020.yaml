    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: Hukum Taurat
  rationale: Dengan artikelnya dan dalam konteks Paulus, istilah ini paling wajar menunjuk kepada hukum Musa; “Hukum Taurat” menyatakan rujukan khusus itu dengan jelas bagi pembaca Indonesia.
- source_word: παρεισῆλθεν
  choice: turut masuk
  rationale: Pilihan ini mempertahankan unsur masuk bersama atau sebagai tambahan yang terkandung dalam verba berawalan παρα-, sekaligus tetap alami dalam bahasa Indonesia.
- source_word: ἵνα πλεονάσῃ
  choice: supaya ... bertambah
  rationale: “Supaya” mempertahankan daya tujuan dari ἵνα dengan bentuk subjungtif tanpa meredakannya menjadi sekadar akibat.
- source_word: τὸ παράπτωμα
  choice: pelanggaran
  rationale: “Pelanggaran” menyampaikan tindakan melanggar yang konkret dan sesuai dengan pembahasan Paulus tentang pelanggaran Adam dalam konteks ini.
- source_word: οὗ
  choice: di mana
  rationale: Padanan adverbial yang alami dan tepat untuk konstruksi perbandingan ini.
- source_word: ἁμαρτία
  choice: dosa
  rationale: Padanan baku dan jelas bagi istilah Paulus ini.
- source_word: ὑπερεπερίσσευσεν
  choice: jauh lebih melimpah lagi
  rationale: Ungkapan ini menangkap penguatan yang melampaui sekadar “bertambah” dan mempertahankan gambaran kelimpahan dalam bahasa Indonesia yang alami.
- source_word: ἡ χάρις
  choice: anugerah
  rationale: “Anugerah” merupakan istilah teologis Indonesia yang lazim, jelas, dan tepat dalam konteks tindakan Allah yang berlimpah.
theological_decisions:
- issue: Apakah ἵνα dalam pernyataan tentang masuknya hukum Taurat harus diterjemahkan sebagai tujuan langsung atau dilunakkan menjadi akibat demi menghindari kesan bahwa Allah menyetujui dosa.
  choice: supaya pelanggaran bertambah
  alternative: sehingga pelanggaran bertambah
  rationale: Susunan Yunani memakai ἵνα dengan subjungtif dan secara wajar menyatakan tujuan. Terjemahan mempertahankan ketegangan teologis dalam argumen Paulus tanpa menyiratkan bahwa Allah secara moral menyetujui dosa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur tujuan dipertahankan secara terbuka, sedangkan kontras antara dosa yang bertambah dan anugerah yang jauh lebih melimpah dibuat jelas tanpa menambahkan penafsiran denominatif.
