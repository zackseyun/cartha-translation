  yaml_path: translation/nt/romans/005/020.yaml
  text: The law came in alongside so that the trespass might increase; but where sin increased, grace overflowed all the more,
translation:
  language: id
  text: Hukum Taurat turut masuk[a] supaya pelanggaran[b] bertambah; tetapi di mana dosa bertambah, anugerah jauh lebih melimpah lagi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “masuk” atau “masuk sebagai tambahan”; kata Yunani ini menyiratkan masuk bersama atau masuk di samping sesuatu yang sudah ada.
    reason: lexical_alternative
  - marker: b
