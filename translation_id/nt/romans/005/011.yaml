id: ROM.5.11
reference: Romans 5:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/011.yaml
  text: And not only that[a], but we also boast in God through our Lord Jesus the Messiah[d][c][b], through whom we have now received the reconciliation.
translation:
  language: id
  text: Dan bukan hanya itu, tetapi kita juga bermegah[a] dalam Allah melalui Tuhan[b] kita, Yesus Sang Mesias[c]. Melalui Dialah sekarang kita telah menerima pendamaian[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersukacita” atau “berbangga.”
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “Tuhan” juga dapat berarti “tuan” atau “penguasa”; dalam konteks ini gelar tersebut dikenakan kepada Yesus.
    reason: lexical_alternative
  - marker: c
    text: Yunani Christos, yang secara tradisional diterjemahkan “Kristus.”
    reason: alternative_reading
  - marker: d
    text: Dapat juga diterjemahkan “pemulihan hubungan.” Kata sandang Yunani menunjuk pada pendamaian yang baru saja dibicarakan dalam konteks sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμενοι
  choice: bermegah
  rationale: Kata ini menyatakan kebanggaan atau keyakinan yang diungkapkan dengan sukacita. “Bermegah” mempertahankan daya ungkap Paulus tanpa mengesankan kesombongan diri, sebab objeknya adalah Allah.
- source_word: ἐν τῷ θεῷ
  choice: dalam Allah
  rationale: Terjemahan ini mempertahankan ungkapan ἐν dan membiarkan relasinya mencakup objek sekaligus dasar atau lingkup kemegahan.
- source_word: κυρίου
  choice: Tuhan
  rationale: “Tuhan” merupakan padanan baku dan wajar untuk κύριος dalam pemakaian kristologis Perjanjian Baru.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός masih membawa makna gelar, yaitu Mesias. Penambahan “Sang” membuat gelar itu alami dalam bahasa Indonesia dan tidak mengubah acuannya.
- source_word: καταλλαγὴν
  choice: pendamaian
  rationale: Istilah ini menunjuk pada pulihnya hubungan yang sebelumnya bermusuhan. “Pendamaian” sesuai dengan konteks langsung dan mempertahankan fokus pada tindakan atau kenyataan pendamaian.
- source_word: ἐλάβομεν
  choice: kita telah menerima
  rationale: Bentuk lampau Yunani bersama νῦν menyatakan tindakan yang sudah terjadi dan hasilnya kini dimiliki; “telah menerima” mengungkapkan hal itu secara alami.
- source_word: νῦν
  choice: sekarang
  rationale: Keterangan waktu ini dipertahankan secara eksplisit karena menekankan keadaan baru yang kini dialami.
theological_decisions:
- issue: Makna καυχώμενοι ketika Allah menjadi objeknya
  choice: bermegah dalam Allah
  alternative: bersukacita karena Allah
  rationale: “Bermegah” lebih langsung mempertahankan verba Yunani, sedangkan frasa “dalam Allah” mencegahnya dibaca sebagai pemegahan diri dan tetap menjaga keluasan hubungan yang dinyatakan oleh ἐν.
- issue: Χριστός sebagai gelar kristologis
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: “Mesias” menampilkan makna gelar Χριστός dengan jelas bagi pembaca modern, sementara “Kristus” dicatat sebagai bentuk tradisional.
- issue: Cakupan καταλλαγή
  choice: pendamaian
  alternative: pemulihan hubungan
  rationale: “Pendamaian” mempertahankan istilah teologis yang mapan tanpa menentukan lebih jauh mekanisme pendamaian daripada yang dikatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat Yunani yang panjang dibagi menjadi dua kalimat agar mudah dipahami, sementara hubungan sarana dalam δι’ οὗ tetap dipertahankan melalui “Melalui Dialah.” Kapitalisasi “Dia” mengikuti kebiasaan bahasa Indonesia untuk rujukan ilahi tanpa menambah unsur semantis baru.
