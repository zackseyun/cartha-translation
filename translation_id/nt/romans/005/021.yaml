  text: ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/021.yaml
  text: so that[a], just as sin reigned in death[c][b], so also grace might reign through righteousness to eternal life through Jesus the Messiah our Lord.
translation:
  language: id
  text: supaya sama seperti dosa telah berkuasa dalam kematian, demikian juga anugerah berkuasa melalui kebenaran[a] menuju hidup kekal melalui Yesus Sang Mesias, Tuhan kita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melalui keadilan.”
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “Yesus Kristus”; di sini Χριστός diterjemahkan sebagai gelar, “Sang Mesias.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan atau hasil dari uraian sebelumnya dan secara alami menaungi bentuk subjunktif yang menyusul.
- source_word: ἐβασίλευσεν / βασιλεύσῃ
  choice: berkuasa
  rationale: Mempertahankan metafora pemerintahan atau kekuasaan yang dipersonifikasikan, sambil terdengar wajar dalam bahasa Indonesia modern.
- source_word: ἐν τῷ θανάτῳ
  choice: dalam kematian
  rationale: Mempertahankan ἐν sebagai penanda ranah tanpa mempersempitnya menjadi sarana atau sebab.
- source_word: ἡ χάρις
  choice: anugerah
  rationale: Padanan Indonesia yang lazim bagi χάρις dan mempertahankan personifikasinya sebagai lawan dari dosa.
- source_word: διὰ δικαιοσύνης
  choice: melalui kebenaran
  rationale: διά dengan genitif menyatakan perantaraan atau sarana; 'kebenaran' mempertahankan cakupan teologis δικαιοσύνη, sementara dimensi keadilan dicatat dalam catatan kaki.
- source_word: εἰς ζωὴν αἰώνιον
  choice: menuju hidup kekal
  rationale: ‘Menuju’ mempertahankan daya arah εἰς, sedangkan ‘hidup kekal’ adalah ungkapan Indonesia yang jelas dan mapan.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός dipahami sebagai gelar dan diterjemahkan secara transparan; 'Sang' membuat bentuk gelar itu idiomatis serta bermartabat dalam bahasa Indonesia.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Tuhan kita
  rationale: Padanan langsung dan alami yang mempertahankan hubungan posesif dengan Yesus Sang Mesias.
theological_decisions:
- issue: Makna δικαιοσύνη dalam konteks Paulus
  choice: melalui kebenaran
  alternative: melalui keadilan
  rationale: ‘Kebenaran’ dipakai dalam teks utama karena mempertahankan cakupan relasional dan forensik istilah itu dalam pemikiran Paulus, tanpa menghapus kemungkinan nuansa keadilan yang dicatat dalam catatan kaki.
- issue: Status Χριστός sebagai gelar atau unsur nama
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: Bentuk Yunani masih dapat dipahami secara titular; menerjemahkannya sebagai ‘Sang Mesias’ membuat makna gelarnya terlihat, sedangkan bentuk tradisional dicatat sebagai alternatif.
- issue: Hubungan ἐν dengan θάνατος
  choice: dalam kematian
  alternative: melalui kematian
  rationale: Teks utama mempertahankan kemungkinan bahwa kematian adalah ranah kekuasaan dosa, alih-alih menetapkan secara eksplisit bahwa kematian adalah sarananya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur perbandingan ‘sama seperti ... demikian juga ...’ dipertahankan, demikian pula personifikasi dosa dan anugerah. Tanda catatan kaki ditempatkan setelah keseluruhan ayat agar alur kalimat tetap mudah dibaca.
