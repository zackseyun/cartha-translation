id: ROM.5.10
reference: Romans 5:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/010.yaml
  text: For if[a], while we were enemies, we were reconciled to God through the death of his Son, much more, having been reconciled, will we be saved by his life.
translation:
  language: id
  text: Sebab, jika ketika kita masih menjadi musuh, kita diperdamaikan dengan Allah melalui kematian Anak-Nya, terlebih lagi, setelah diperdamaikan, kita akan diselamatkan oleh kehidupan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di dalam kehidupan-Nya.”
    reason: Mempertahankan kemungkinan lokatif/asosiatif dari ἐν τῇ ζωῇ αὐτοῦ di samping pembacaan instrumental dalam teks utama.
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Sebab, jika
  rationale: Mempertahankan γάρ sebagai penghubung argumentatif dengan ayat sebelumnya dan εἰ sebagai bentuk bersyarat, tanpa mengubahnya menjadi pernyataan sebab-akibat yang pasti.
- source_word: ἐχθροὶ ὄντες
  choice: ketika masih menjadi musuh
  rationale: Mengungkapkan keadaan yang sedang berlaku sebelum pendamaian; 'musuh' mempertahankan nuansa relasional yang langsung.
- source_word: κατηλλάγημεν
  choice: kita diperdamaikan
  rationale: Bentuk pasif mempertahankan Allah sebagai pihak yang kepada-Nya pendamaian terjadi, tanpa menjadikan manusia pelaku utamanya.
- source_word: τῷ θεῷ
  choice: dengan Allah
  rationale: Dalam bahasa Indonesia, 'diperdamaikan dengan Allah' merupakan ungkapan alami untuk relasi yang dipulihkan dan sesuai dengan fungsi datif sesudah καταλλάσσω.
- source_word: διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ
  choice: melalui kematian Anak-Nya
  rationale: '''Melalui'' menyampaikan διά dengan genitif sebagai sarana; ''Anak-Nya'' mempertahankan sebutan kristologis teks.'
- source_word: πολλῷ μᾶλλον
  choice: terlebih lagi
  rationale: Ungkapan Indonesia yang alami dan kuat untuk argumen a fortiori Paulus.
- source_word: καταλλαγέντες
  choice: setelah diperdamaikan
  rationale: Menunjukkan bahwa pendamaian mendahului keselamatan yang dinyatakan dalam bentuk mendatang.
- source_word: σωθησόμεθα
  choice: kita akan diselamatkan
  rationale: Mempertahankan bentuk pasif dan orientasi masa depan dari verba Yunani.
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: oleh kehidupan-Nya
  rationale: Menyampaikan kemungkinan instrumental dari ἐν dan mempertahankan kontras kematian/kehidupan. 'Kehidupan' lebih jelas daripada 'hidup-Nya' dalam konstruksi instrumental ini.
theological_decisions:
- issue: Makna ἐν τῇ ζωῇ αὐτοῦ
  choice: 'instrumental: ''oleh kehidupan-Nya'''
  alternative: 'lokatif/asosiatif: ''di dalam kehidupan-Nya'''
  rationale: Kontras langsung dengan 'melalui kematian Anak-Nya' mendukung pengertian bahwa keselamatan mendatang berlangsung oleh kehidupan Sang Anak. Namun, karena ἐν juga dapat bernuansa lokatif atau asosiatif, alternatif tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan alur argumentasi Paulus serta kesejajaran antara kematian Anak dan kehidupan-Nya. Penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskan.
