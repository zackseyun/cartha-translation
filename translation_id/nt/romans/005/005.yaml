  terminology: “Kasih Allah,” “Roh Kudus,” dan “pengharapan” merupakan istilah yang mapan dan tepat. Mengganti “dikaruniakan” dengan “diberikan” menghindari penambahan nuansa teologis yang tidak diperlukan oleh teks sumber.
