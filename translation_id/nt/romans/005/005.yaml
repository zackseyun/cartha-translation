  source_fidelity: 'Terjemahan pada dasarnya setia pada teks Yunani: καταισχύνει mempertahankan ranah malu/kehormatan melalui “mempermalukan,” perfektum ἐκκέχυται tercermin dalam “telah dicurahkan,” dan διά menyatakan perantaraan dalam “melalui Roh Kudus.” Namun, “dikaruniakan” memberi nuansa anugerah yang tidak tersurat secara leksikal dalam δοθέντος; “diberikan” lebih langsung dan netral. Genitif τοῦ θεοῦ secara bentuk tetap ambigu, sementara konteks mendukung kasih Allah kepada manusia; alternatifnya perlu benar-benar ditandai dan dicatat.'
