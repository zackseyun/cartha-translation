base_translation:
  language: en
  yaml_path: translation/nt/romans/005/005.yaml
  text: And hope does not put to shame[a], because the love of God has been poured out in our hearts through the Holy Spirit[b], who was given to us.
translation:
  language: id
  text: Dan pengharapan tidak mempermalukan kita[a], sebab kasih Allah[b] telah dicurahkan ke dalam hati kita melalui Roh Kudus yang telah diberikan kepada kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak mengecewakan kita.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “kasih kita kepada Allah.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλπίς
  choice: pengharapan
  rationale: Padanan baku dan wajar dalam bahasa Indonesia untuk pengharapan yang menjadi pokok pembicaraan dalam konteks ini.
- source_word: δέ
  choice: Dan
  rationale: Mewakili penghubung ringan dalam bahasa Yunani tanpa memberi kesan pertentangan yang terlalu kuat.
- source_word: καταισχύνει
  choice: tidak mempermalukan kita
  rationale: Mempertahankan nuansa inti malu dan kehinaan; objek 'kita' dibuat tersurat agar konstruksinya alami dan maknanya jelas dalam bahasa Indonesia.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: kasih Allah
  rationale: Ungkapan ini alami sekaligus mempertahankan bentuk genitif Yunani; konteks paling kuat menunjuk kepada kasih yang berasal dari Allah, sedangkan kemungkinan objektif dicatat dalam catatan kaki.
- source_word: ἐκκέχυται
  choice: telah dicurahkan
  rationale: Bentuk 'telah' mencerminkan tindakan lampau dengan hasil yang tetap berlangsung, sesuai aspek perfektum Yunani.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: ke dalam hati kita
  rationale: Dengan verba 'dicurahkan', 'ke dalam' secara alami menyampaikan gerak metaforis menuju batin, walaupun ἐν secara harfiah dapat berarti 'di dalam'.
- source_word: διὰ πνεύματος ἁγίου
  choice: melalui Roh Kudus
  rationale: διά dengan genitif menyatakan perantaraan atau sarana; kapitalisasi menunjukkan referen ilahi personal dalam konteks.
- source_word: τοῦ δοθέντος ἡμῖν
  choice: yang telah dikaruniakan kepada kita
  rationale: '''Dikaruniakan'' menyampaikan tindakan memberikan sebagai anugerah dan cocok bagi pemberian Roh Kudus; klausa relatif secara alami menerangkan Roh Kudus.'
theological_decisions:
- issue: Makna genitif dalam ἡ ἀγάπη τοῦ θεοῦ
  choice: kasih Allah kepada kita
  alternative: kasih kita kepada Allah
  rationale: Alur sebab-akibat dalam konteks—pengharapan tidak mempermalukan karena kasih ini dicurahkan melalui Roh Kudus—lebih mendukung kasih yang berasal dari Allah. Namun, bentuk genitifnya sendiri memungkinkan pembacaan objektif, sehingga alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Pengharapan' mempertahankan register biblis yang masih mudah dipahami. Susunan kalimat dibuat alami tanpa menghilangkan citra pencurahan dan nuansa malu-kehormatan pada καταισχύνει.
