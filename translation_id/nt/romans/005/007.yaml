  text: μόλις γὰρ ὑπὲρ δικαίου τις ἀποθανεῖται· ὑπὲρ γὰρ τοῦ ἀγαθοῦ τάχα τις καὶ τολμᾷ ἀποθανεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/007.yaml
  text: For hardly will anyone die for a righteous person[b][a]; though perhaps for a good person someone might even dare to die.
translation:
  language: id
  text: Sebab hampir tidak ada orang yang akan mati untuk orang benar[b][a]; mungkin ada orang yang bahkan berani mati untuk orang baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara gramatikal, kata Yunani berbentuk maskulin, tetapi kemungkinan besar digunakan secara umum untuk siapa saja.
    reason: lexical_alternative
  - marker: b
    text: Perbedaan antara “orang benar” dan “orang baik” mungkin disengaja, bukan sekadar variasi gaya bahasa.
    reason: alternative_reading
lexical_decisions:
- source_word: μόλις
  choice: hampir tidak ada
  rationale: Dalam pernyataan umum ini, ungkapan tersebut secara alami menyampaikan bahwa tindakan itu amat jarang terjadi, selaras dengan arti ‘nyaris tidak’ atau ‘dengan susah payah’.
- source_word: ὑπὲρ
  choice: untuk
  rationale: Di sini kata ini menyatakan tindakan demi kepentingan atau sebagai pengganti seseorang; ‘untuk’ paling alami dalam bahasa Indonesia dan tetap terbuka terhadap nuansa tersebut.
- source_word: δικαίου
  choice: orang benar
  rationale: Adjektiva substantival ini menunjuk kepada seseorang yang bercirikan kebenaran atau keadilan. ‘Orang benar’ mempertahankan kategori moral Paulus dan tidak membatasi rujukannya pada laki-laki.
- source_word: ἀποθανεῖται
  choice: mau mati
  rationale: Walaupun bentuk Yunani adalah futur, dalam pernyataan umum ini bahasa Indonesia secara alami memakai ‘mau mati’ untuk menyatakan kesediaan yang sangat jarang; makna kematian tetap diterjemahkan langsung.
- source_word: τοῦ ἀγαθοῦ
  choice: orang baik
  rationale: Pilihan ini mempertahankan perbedaan leksikal dari ‘orang benar’ tanpa menentukan secara sempit apakah yang dimaksud khususnya seorang dermawan atau penolong.
- source_word: τάχα
  choice: mungkin
  rationale: Menyatakan kemungkinan secara terukur tanpa menjadikannya kepastian.
- source_word: καὶ
  choice: bahkan
  rationale: Kata ini bersifat meningkatkan, menekankan keberanian luar biasa untuk mati.
- source_word: τολμᾷ
  choice: ada orang yang bahkan berani
  rationale: Bersama τάχα, bentuk kini ini menyampaikan kemungkinan umum bahwa seseorang dapat memberanikan diri melakukan hal tersebut.
- source_word: ἀποθανεῖν
  choice: mati
  rationale: Terjemahan langsung yang mempertahankan pengulangan motif kematian dalam kedua klausa.
theological_decisions:
- issue: Apakah perbedaan antara δικαίου dan ἀγαθοῦ perlu dipertahankan
  choice: Diterjemahkan secara berbeda sebagai ‘orang benar’ dan ‘orang baik’.
  alternative: Memperlakukan keduanya sebagai sinonim dan menerjemahkannya dengan istilah yang sama.
  rationale: Teks mungkin sengaja membedakan seseorang yang benar atau adil dari seseorang yang baik; mempertahankan dua istilah itu menjaga ambiguitas dan ketegangan argumen Paulus tanpa memaksakan penjelasan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat alami bagi pembaca umum sambil mempertahankan pengulangan ‘mati’ serta kemungkinan perbedaan makna antara ‘benar’ dan ‘baik’.
