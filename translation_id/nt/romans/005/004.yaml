  text: ἡ δὲ ὑπομονὴ δοκιμήν, ἡ δὲ δοκιμὴ ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/004.yaml
  text: and endurance produces proven character[a], and proven character produces hope.
translation:
  language: id
  text: Dan ketekunan menghasilkan karakter yang teruji[a], dan karakter yang teruji menghasilkan pengharapan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karakter yang tahan uji” atau “keadaan yang telah terbukti layak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονή
  choice: ketekunan
  rationale: Kata ini secara alami menyatakan keteguhan untuk terus bertahan dalam kesusahan, sesuai dengan rangkaian pemikiran dalam konteks.
- source_word: δοκιμή
  choice: karakter yang teruji
  rationale: Istilah ini menunjuk pada mutu diri yang telah mengalami pengujian dan terbukti asli, bukan sekadar karakter dalam arti umum. Pilihan ini juga mempertahankan nuansa hasil dari ketekunan.
- source_word: ἐλπίς
  choice: pengharapan
  rationale: Padanan baku dan bermartabat dalam bahasa Indonesia untuk harapan yang berorientasi pada masa depan; konteks Paulus memberi dasar ilahinya tanpa perlu menambahkannya ke dalam teks.
- source_word: δὲ
  choice: dan
  rationale: Di sini partikel tersebut menghubungkan tahapan-tahapan dalam suatu rangkaian, bukan menyatakan pertentangan yang kuat.
- source_word: ellipsis of κατεργάζεται
  choice: menghasilkan
  rationale: Bahasa Yunani menghilangkan verba yang dipahami dari ayat sebelumnya. Mengulang 'menghasilkan' membuat hubungan antartahap jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna δοκιμή dalam rangkaian pembentukan melalui penderitaan
  choice: karakter yang telah diuji dan terbukti asli
  alternative: proses pengujian; keadaan berkenan atau tahan uji
  rationale: Dalam rangkaian ini, δοκιμή paling wajar dipahami sebagai hasil dari ketekunan, bukan tindakan menguji itu sendiri. Terjemahan ini mempertahankan dimensi moral dan pengalaman tanpa menambahkan klaim doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Struktur berulang dipertahankan untuk mencerminkan rangkaian retoris Yunani. 'Pengharapan' dipilih daripada 'harapan' demi laras Alkitabiah yang tetap umum dan bermartabat.
