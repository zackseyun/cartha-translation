  text: Δικαιωθέντες οὖν ἐκ πίστεως εἰρήνην ⸀ἔχομεν πρὸς τὸν θεὸν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/001.yaml
  text: Therefore[a], since we have been justified by faith, we have peace with God through our Lord Jesus the Messiah[c][b],
translation:
  language: id
  text: Jadi, karena kita telah dibenarkan berdasarkan iman[b], kita memiliki damai[a] dengan Allah melalui Tuhan kita, Yesus Sang Mesias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam beberapa naskah: “marilah kita memiliki damai dengan Allah.”'
    reason: textual_variant
  - marker: b
    text: Dapat juga diterjemahkan “melalui iman” atau “karena iman.”
    reason: lexical_alternative
  - marker: c
    text: Yunani Christos, artinya “Mesias”; secara tradisional diterjemahkan “Kristus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαιωθέντες
  choice: kita telah dibenarkan
  rationale: Bentuk partisip aoris pasif ini menyatakan tindakan pembenaran yang telah dialami. Pilihan ini mempertahankan istilah teologis Paulus tanpa mempersempitnya menjadi hanya ‘dinyatakan benar’ atau ‘dijadikan benar’.
- source_word: οὖν
  choice: Jadi
  rationale: Menandai kesimpulan dari uraian sebelumnya dengan penghubung yang jelas dan alami dalam bahasa Indonesia modern.
- source_word: ἐκ πίστεως
  choice: berdasarkan iman
  rationale: Kata depan ἐκ secara harfiah menyatakan asal atau dasar. ‘Berdasarkan iman’ mempertahankan nuansa tersebut tanpa menjadikan iman sebagai pelaku yang membenarkan.
- source_word: εἰρήνην ἔχομεν
  choice: kita hidup dalam damai
  rationale: Secara harfiah berarti ‘kita mempunyai damai’, tetapi ungkapan itu kurang alami dalam bahasa Indonesia. ‘Hidup dalam damai’ menyampaikan keadaan relasional yang dimiliki tanpa menggantinya dengan istilah yang lebih interpretatif seperti ‘diperdamaikan’.
- source_word: πρὸς τὸν θεὸν
  choice: dengan Allah
  rationale: Dalam hubungan dengan εἰρήνην, frasa ini secara alami menyatakan damai dalam relasi dengan Allah.
- source_word: κυρίου
  choice: Tuhan
  rationale: Padanan baku dan penuh hormat bagi κύριος dalam penyebutan Yesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός adalah gelar yang berarti ‘Mesias’. Bentuk dengan ‘Sang’ membuat fungsi gelarnya jelas dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna pembenaran dalam Δικαιωθέντες
  choice: kita telah dibenarkan
  alternative: kita telah dinyatakan benar; kita telah dijadikan benar
  rationale: Ayat ini menegaskan tindakan pembenaran Allah, tetapi tidak merinci seluruh mekanismenya. Istilah ‘dibenarkan’ menjaga keluasan dan ketegangan teologis teks.
- issue: Makna damai dengan Allah
  choice: hidup dalam damai dengan Allah
  alternative: merasakan ketenangan dari Allah; telah diperdamaikan dengan Allah
  rationale: Frasa Yunani terutama menunjuk pada keadaan damai dalam relasi dengan Allah. Terjemahan tidak membatasinya pada perasaan batin dan tidak mengganti εἰρήνη dengan istilah ‘rekonsiliasi’ yang lebih interpretatif.
- issue: Varian tekstual ἔχομεν atau ἔχωμεν
  choice: kita hidup dalam damai
  alternative: marilah kita hidup dalam damai
  rationale: Teks SBLGNT yang diberikan memakai bentuk indikatif ἔχομεν, sehingga teks utama menyatakan keadaan yang dimiliki. Bentuk subjungtif hortatoris yang didukung sebagian naskah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan ‘Jadi, karena ...’ mempertahankan hubungan kesimpulan dan alasan dalam teks Yunani. ‘Hidup dalam damai’ dipilih agar alami tanpa mengubah damai relasional menjadi sekadar ketenangan subjektif.
