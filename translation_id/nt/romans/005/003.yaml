  text: οὐ μόνον δέ, ἀλλὰ καὶ ⸀καυχώμεθα ἐν ταῖς θλίψεσιν, εἰδότες ὅτι ἡ θλῖψις ὑπομονὴν κατεργάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/003.yaml
  text: And not only that[a], but we also rejoice in afflictions, knowing that affliction produces endurance[c][b],
translation:
  language: id
  text: Bukan hanya itu, tetapi kita juga bersukacita[a] dalam kesusahan[b], karena kita tahu bahwa kesusahan menghasilkan ketekunan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bermegah” atau “berbangga.”
    reason: lexical_alternative
  - marker: b
    text: Atau “penderitaan” atau “kesengsaraan.”
    reason: lexical_alternative
  - marker: c
    text: Atau “ketabahan” atau “daya tahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμεθα
  choice: bersukacita
  rationale: Dalam konteks ini kata tersebut menyatakan kegembiraan atau rasa bangga yang penuh keyakinan, bukan kesombongan yang berpusat pada diri sendiri. “Bersukacita” alami dalam bahasa Indonesia modern, sementara alternatif “bermegah” dipertahankan dalam catatan kaki.
- source_word: θλίψεσιν
  choice: berbagai kesusahan
  rationale: Bentuk jamak Yunani menunjuk pada pengalaman-pengalaman tekanan atau penderitaan. “Berbagai kesusahan” menyampaikan bentuk jamak secara alami tanpa mempersempitnya pada satu jenis penderitaan.
- source_word: θλῖψις
  choice: kesusahan
  rationale: Bentuk tunggal dipertahankan dalam pernyataan umum untuk mencerminkan peralihan teks Yunani dari pengalaman jamak kepada prinsip umum.
- source_word: ὑπομονήν
  choice: ketekunan
  rationale: “Ketekunan” menyampaikan daya tahan yang terus bertahan di bawah tekanan dan merupakan istilah yang jelas serta wajar bagi pembaca Indonesia modern.
- source_word: κατεργάζεται
  choice: menghasilkan
  rationale: Kata ini menyatakan bahwa kesusahan mendatangkan atau mengerjakan suatu hasil; “menghasilkan” menyampaikan hubungan tersebut secara ringkas dan alami.
- source_word: εἰδότες
  choice: karena kita tahu
  rationale: Partisip Yunani menyertai tindakan bersukacita dan secara wajar dapat menyatakan dasar tindakan itu. Ungkapan ini alami dalam bahasa Indonesia, tanpa menambahkan isi di luar teks.
theological_decisions:
- issue: Makna καυχώμεθα dalam konteks rohani yang positif
  choice: bersukacita sebagai tanggapan penuh keyakinan terhadap karya Allah
  alternative: bermegah atau berbangga
  rationale: Konteksnya bukan pujian terhadap kemampuan diri, melainkan keyakinan akan apa yang dihasilkan melalui kesusahan. “Bersukacita” menghindari kesan menyombongkan diri, sedangkan keluasan makna kata Yunani tetap ditunjukkan dalam catatan kaki.
- issue: Hubungan kesusahan dengan ketekunan
  choice: kesusahan menghasilkan ketekunan
  alternative: kesusahan mengerjakan atau menimbulkan ketekunan
  rationale: Terjemahan mempertahankan pernyataan tegas Paulus tentang hasil kesusahan tanpa menjelaskan mekanisme atau menetapkan bahwa setiap penderitaan secara otomatis membawa hasil tersebut terlepas dari konteks argumennya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Berbagai kesusahan” menerjemahkan bentuk jamak secara idiomatis, sedangkan “kesusahan” pada klausa terakhir mempertahankan bentuk tunggal sebagai prinsip umum. Semua penanda catatan kaki ditempatkan langsung setelah istilah terkait.
