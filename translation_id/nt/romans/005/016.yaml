  text: καὶ οὐχ ὡς δι’ ἑνὸς ἁμαρτήσαντος τὸ δώρημα· τὸ μὲν γὰρ κρίμα ἐξ ἑνὸς εἰς κατάκριμα, τὸ δὲ χάρισμα ἐκ πολλῶν παραπτωμάτων εἰς δικαίωμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/016.yaml
  text: And the gift is not like what came through the one who sinned[a]. For the judgment from one trespass led to condemnation[c][b], but the gracious gift from many trespasses led to justification.
translation:
  language: id
  text: Dan karunia itu tidak sama dengan apa yang datang melalui satu orang yang berdosa.[a] Sebab, penghakiman yang berasal dari satu pelanggaran berujung pada penghukuman, sedangkan anugerah yang berasal dari banyak pelanggaran berujung pada pembenaran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karunia itu tidak seperti akibat yang datang melalui satu orang yang berdosa.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “berujung pada putusan yang menyatakan benar” atau “berujung pada pembebasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δώρημα
  choice: karunia
  rationale: Kata ini menunjuk pada sesuatu yang diberikan sebagai pemberian; “karunia” alami dalam bahasa Indonesia dan sesuai dengan konteks.
- source_word: δι’ ἑνὸς ἁμαρτήσαντος
  choice: akibat dari satu orang yang telah berbuat dosa
  rationale: Ungkapan Yunani bersifat eliptis. Pilihan ini mempertahankan rujukan personal kepada satu orang yang berdosa sekaligus membuat perbandingan dapat dipahami dalam bahasa Indonesia.
- source_word: κρίμα
  choice: penghakiman
  rationale: Dalam konteks yudisial ini, kata tersebut menunjuk pada keputusan atau tindakan menghakimi dan berlawanan dengan hasil berupa penghukuman.
- source_word: ἐξ ἑνὸς
  choice: yang berawal dari satu pelanggaran
  rationale: Bentuk netral ἑνός kemungkinan menunjuk pada satu pelanggaran, terutama karena dikontraskan dengan “banyak pelanggaran”; nomina itu disuplai demi kejelasan.
- source_word: κατάκριμα
  choice: penghukuman
  rationale: Istilah ini menyatakan putusan menghukum atau keadaan terhukum; “penghukuman” menjaga nuansa yudisialnya.
- source_word: χάρισμα
  choice: karunia anugerah
  rationale: Kata ini menekankan pemberian yang bersumber pada anugerah. Ungkapan ini juga membedakannya dari δώρημα pada klausa pertama.
- source_word: παραπτωμάτων
  choice: pelanggaran
  rationale: Kata ini menunjuk pada langkah salah atau pelanggaran moral; “pelanggaran” jelas, wajar, dan mempertahankan nuansa moral-yudisial.
- source_word: δικαίωμα
  choice: pembenaran
  rationale: Dalam antitesis dengan κατάκριμα, istilah ini menunjuk pada hasil yudisial yang berlawanan dengan penghukuman. “Pembenaran” mempertahankan hubungan istilah tersebut dengan kosakata Paulus tentang dinyatakan benar.
theological_decisions:
- issue: Daya forensik δικαίωμα dalam kontras dengan κατάκριμα
  choice: pembenaran sebagai hasil yudisial yang berlawanan dengan penghukuman
  alternative: putusan yang menyatakan benar; pembebasan
  rationale: Struktur ayat membentuk antitesis yudisial antara penghakiman/penghukuman dan karunia/pembenaran. “Pembenaran” menyampaikan kontras itu tanpa meniadakan kemungkinan nuansa konkret berupa putusan yang menyatakan benar.
- issue: Rujukan ἐξ ἑνὸς
  choice: satu pelanggaran
  alternative: satu orang
  rationale: Bentuk netral dan kontras langsung dengan “banyak pelanggaran” mendukung rujukan kepada satu pelanggaran, tetapi kemungkinan pembacaan personal tetap layak dicatat.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur antitesis Yunani dipertahankan dengan “sebab ... sedangkan ...”. Istilah yudisial dibuat konsisten dan ambiguitas penting dicatat dalam catatan kaki.
