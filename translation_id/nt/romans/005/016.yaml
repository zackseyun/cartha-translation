revisions:
- from: Dan karunia itu tidak seperti akibat dari satu orang yang telah berbuat dosa.[a] Sebab, penghakiman yang berawal dari satu pelanggaran menghasilkan penghukuman, sedangkan karunia anugerah yang berawal dari banyak pelanggaran menghasilkan pembenaran.[b]
  to: Dan karunia itu tidak sama dengan apa yang datang melalui satu orang yang berdosa.[a] Sebab, penghakiman yang berasal dari satu pelanggaran berujung pada penghukuman, sedangkan anugerah yang berasal dari banyak pelanggaran berujung pada pembenaran.[b]
  rationale: Revisi mengganti ungkapan kausal yang kurang tepat dengan bentuk yang mempertahankan elipsis dan rujukan personal dalam Yunani. Istilah χάρισμα diubah menjadi “anugerah” agar alami dalam bahasa Indonesia modern dan agar pembedaan dengan δώρημα tetap terjaga. Kontras penghakiman/penghukuman dan anugerah/pembenaran dipertahankan, sementara catatan kaki tetap menandai alternatif bagi δικαίωμα.
