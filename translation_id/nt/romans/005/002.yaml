id: ROM.5.2
reference: Romans 5:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: δι’ οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν τῇ πίστει εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν, καὶ καυχώμεθα ἐπ’ ἐλπίδι τῆς δόξης τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/002.yaml
  text: through whom we also have obtained access by faith into this grace in which we stand[a], and we boast in the hope of the glory of God.
translation:
  language: id
  text: Melalui Dia, kita juga telah memperoleh jalan masuk oleh iman ke dalam anugerah ini, yang di dalamnya kita berdiri; dan kita bermegah[a] dalam pengharapan akan kemuliaan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersukacita” atau “bergembira dengan penuh keyakinan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγωγή
  choice: jalan masuk
  rationale: Ungkapan ini secara alami menyatakan akses atau kesempatan untuk masuk ke dalam kedudukan anugerah, tanpa menambahkan gagasan yang tidak tersurat.
- source_word: πίστει
  choice: oleh iman
  rationale: Bentuk datif paling wajar dipahami secara instrumental; terjemahan ini ringkas dan mempertahankan peran iman sebagai sarana.
- source_word: χάριν
  choice: anugerah
  rationale: Istilah ini jelas, alami dalam bahasa Indonesia modern, dan sesuai dengan konteks Paulus tentang pemberian serta kemurahan Allah yang tidak diperoleh sebagai upah.
- source_word: ἑστήκαμεν
  choice: kita berdiri
  rationale: Bentuk perfekt menyatakan keadaan kini sebagai hasil tindakan sebelumnya. 'Kita berdiri' mempertahankan gambaran Yunani dan menyampaikan keadaan yang terus berlangsung.
- source_word: καυχώμεθα
  choice: kita bermegah
  rationale: '''Bermegah'' mempertahankan daya retoris kata Yunani serta kaitan leksikalnya dengan pemakaian Paulus di sekitar bagian ini, meskipun dalam konteks ini kata tersebut juga dapat bernuansa bersukacita.'
- source_word: ἐπ’ ἐλπίδι
  choice: dalam pengharapan
  rationale: Terjemahan ini alami dan cukup luas untuk mencakup pengharapan sebagai lingkup atau dasar dari tindakan bermegah.
- source_word: δόξης τοῦ θεοῦ
  choice: kemuliaan Allah
  rationale: Terjemahan langsung ini mempertahankan konstruksi genitif dan tidak mempersempit hubungan antara pengharapan dan kemuliaan Allah.
theological_decisions:
- issue: Daya teologis dan retoris καυχώμεθα
  choice: kita bermegah
  alternative: kita bersukacita
  rationale: '''Bermegah'' mempertahankan ketegangan yang disengaja dalam bahasa Paulus dan kesinambungan dengan pemakaian kata yang sama, sedangkan ''bersukacita'' lebih halus tetapi mempersempit nuansanya.'
- issue: Keadaan yang dinyatakan oleh ἑστήκαμεν
  choice: kita berdiri
  alternative: kita telah berdiri teguh
  rationale: Pilihan ini menyampaikan keadaan kini yang dihasilkan oleh tindakan sebelumnya tanpa menambahkan unsur 'teguh' yang tidak dinyatakan secara eksplisit dalam kata Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Jalan masuk' dipilih sebagai ungkapan yang mudah dipahami; 'bermegah' dipertahankan untuk menjaga kekuatan dan ketegangan retoris Paulus.
