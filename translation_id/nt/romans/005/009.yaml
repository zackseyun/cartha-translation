  text: πολλῷ οὖν μᾶλλον δικαιωθέντες νῦν ἐν τῷ αἵματι αὐτοῦ σωθησόμεθα δι’ αὐτοῦ ἀπὸ τῆς ὀργῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/009.yaml
  text: Much more then[a], having now been justified by his blood[c][b], we shall be saved through him from the wrath.
translation:
  language: id
  text: Jadi, terlebih lagi, karena sekarang kita telah dibenarkan oleh darah-Nya,[a] kita akan diselamatkan melalui Dia dari murka itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dinyatakan benar”; atau, untuk “oleh darah-Nya”: “melalui darah-Nya.”'
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud adalah murka ilahi yang tersirat dari konteks.
    reason: cross_reference
lexical_decisions:
- source_word: πολλῷ οὖν μᾶλλον
  choice: Karena itu, terlebih lagi
  rationale: Mempertahankan hubungan kesimpulan yang ditandai οὖν dan peningkatan argumen dalam πολλῷ ... μᾶλλον, dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: δικαιωθέντες νῦν
  choice: setelah sekarang dibenarkan
  rationale: Partisip aoris pasif menunjukkan tindakan yang telah terjadi sebelum keselamatan pada verba utama yang berbentuk futur; νῦν dipertahankan sebagai penanda waktu kini.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: oleh darah-Nya
  rationale: ἐν di sini dapat menyatakan sarana atau dasar. 'Oleh darah-Nya' alami dalam bahasa Indonesia dan tetap mempertahankan citra darah tanpa menguraikannya secara doktrinal.
- source_word: σωθησόμεθα
  choice: kita akan diselamatkan
  rationale: Bentuk futur pasif dipertahankan, sehingga aspek keselamatan yang masih akan diwujudkan tetap jelas.
- source_word: δι’ αὐτοῦ
  choice: melalui Dia
  rationale: διά dengan genitif menyatakan perantaraan atau sarana; 'melalui Dia' membedakannya dari frasa sebelumnya sekaligus mempertahankan agensi Kristus.
- source_word: ἀπὸ τῆς ὀργῆς
  choice: dari murka itu
  rationale: Artikel Yunani dipertahankan secara idiomatis dengan 'itu', tanpa menambahkan 'Allah' yang tidak dinyatakan secara eksplisit dalam teks.
theological_decisions:
- issue: Makna δικαιωθέντες
  choice: dibenarkan
  alternative: dinyatakan benar
  rationale: '''Dibenarkan'' mempertahankan istilah kunci Paulus dan ambiguitas cakupan maknanya; alternatif dicatat tanpa menjadikan satu penjelasan teologis sebagai satu-satunya arti.'
- issue: Referen τῆς ὀργῆς
  choice: murka itu
  alternative: murka Allah
  rationale: Konteks mengisyaratkan murka ilahi, tetapi teks Yunani hanya menyebut 'murka itu'; terjemahan utama tidak menambahkan pemilik yang tersirat.
- issue: Hubungan ἐν τῷ αἵματι αὐτοῦ dengan pembenaran
  choice: oleh darah-Nya
  alternative: melalui darah-Nya
  rationale: Pilihan utama menyatakan sarana atau dasar secara alami, tetapi tidak mempersempit hubungan semantis ἐν melebihi yang didukung konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur argumen Paulus, bentuk pasif, serta perbedaan waktu antara pembenaran kini dan keselamatan mendatang dipertahankan. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia.
