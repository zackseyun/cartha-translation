id: ROM.5.14
reference: Romans 5:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/014.yaml
  text: Yet death reigned from Adam until Moses[a], even over those who did not sin in the likeness of Adam’s transgression[b], who is a type of the coming one.
translation:
  language: id
  text: Namun, maut memerintah sejak Adam sampai Musa, bahkan atas orang-orang yang tidak berbuat dosa dengan cara yang serupa dengan pelanggaran Adam. Adam adalah gambaran[a] dari dia yang akan datang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pola” atau “bayangan awal.”
    reason: lexical_alternative
  - marker: b
    text: Atau “orang yang akan datang.” Dalam konteks ini, yang dimaksud adalah Kristus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan yang kuat dengan pernyataan sebelumnya secara alami dalam bahasa Indonesia modern.
- source_word: ἐβασίλευσεν ὁ θάνατος
  choice: maut memerintah
  rationale: Mempertahankan personifikasi maut sebagai penguasa, sekaligus memakai ungkapan Indonesia yang wajar dan bermartabat.
- source_word: ἀπὸ Ἀδὰμ μέχρι Μωϋσέως
  choice: sejak Adam sampai Musa
  rationale: Menyatakan rentang waktu dengan jelas dan alami.
- source_word: καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας
  choice: bahkan atas orang-orang yang tidak berbuat dosa
  rationale: Kata 'bahkan' menonjolkan jangkauan kekuasaan maut yang mengejutkan, sedangkan 'atas' mempertahankan hubungan dengan kata 'memerintah'.
- source_word: ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ
  choice: dengan cara yang serupa dengan pelanggaran Adam
  rationale: Mengungkapkan perbandingan secara jelas tanpa menentukan secara berlebihan tepatnya dalam hal apa dosa mereka berbeda dari pelanggaran Adam.
- source_word: παράβασις
  choice: pelanggaran
  rationale: Menunjukkan tindakan melampaui atau melanggar batas perintah, sesuai penekanan istilah Yunani.
- source_word: τύπος
  choice: gambaran
  rationale: Dalam konteks hubungan Adam dengan sosok yang akan datang, 'gambaran' menyampaikan fungsi representatif atau pendahulu tanpa memakai istilah teknis 'tipe' yang kurang mudah dipahami pembaca umum.
- source_word: τοῦ μέλλοντος
  choice: dia yang akan datang
  rationale: Mempertahankan bentuk ungkapan Yunani yang tidak menyebut nama Kristus secara langsung; 'dia' ditulis dengan huruf kecil agar identifikasi teologis tidak dimasukkan ke dalam teks utama.
theological_decisions:
- issue: Rujukan 'dia yang akan datang'
  choice: Teks utama mempertahankan ungkapan tidak langsung 'dia yang akan datang'.
  alternative: Menerjemahkannya secara eksplisit sebagai 'Kristus yang akan datang'.
  rationale: Konteks Roma 5:12–21 menunjukkan bahwa rujukannya adalah Kristus, tetapi ayat Yunani sendiri tidak menyebut nama atau gelar itu. Catatan kaki menjelaskan rujukannya tanpa menggantikan ketegangan dan bentuk ungkapan teks.
- issue: Hubungan Adam dengan sosok yang akan datang
  choice: Adam disebut 'gambaran' dari sosok yang akan datang.
  alternative: Adam disebut 'tipe', 'pola', atau 'bayangan awal'.
  rationale: Pilihan ini mempertahankan hubungan tipologis dan representatif sambil menghindari penjelasan doktrinal yang lebih jauh daripada yang dinyatakan ayat.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. Personifikasi 'maut memerintah' dipertahankan. Struktur kalimat diperjelas dengan mengulang 'Adam' pada kalimat kedua agar rujukan kata ganti Yunani tidak kabur dalam bahasa Indonesia.
