  text: συνίστησιν δὲ τὴν ἑαυτοῦ ἀγάπην εἰς ἡμᾶς ὁ θεὸς ὅτι ἔτι ἁμαρτωλῶν ὄντων ἡμῶν Χριστὸς ὑπὲρ ἡμῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/008.yaml
  text: But God demonstrates his own love for us in that while we were still sinners[c][b][a], Messiah died for us.
translation:
  language: id
  text: 'Namun, Allah menunjukkan kasih-Nya sendiri kepada kita[a]: ketika kita masih orang berdosa, Mesias[b] mati bagi kita.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “terhadap kita.”'
    reason: lexical_alternative
  - marker: b
    text: Yunani Christos; secara tradisional diterjemahkan “Kristus”. Di sini diterjemahkan “Mesias” sebagai gelar.
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “demi kita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίστησιν
  choice: menunjukkan
  rationale: Bentuk kini ini menyatakan bahwa Allah memperlihatkan atau membuktikan kasih-Nya secara nyata. “Menunjukkan” alami dalam bahasa Indonesia dan tetap mempertahankan daya pembuktian yang dijelaskan oleh klausa berikutnya.
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras dengan gagasan sebelumnya; “Namun” menyampaikan peralihan argumentatif itu dengan wajar dan bermartabat.
- source_word: τὴν ἑαυτοῦ ἀγάπην
  choice: kasih-Nya sendiri
  rationale: Kata ganti refleksif ἑαυτοῦ memberi penekanan pada kasih milik Allah sendiri; penekanan tersebut dipertahankan secara alami.
- source_word: εἰς ἡμᾶς
  choice: kepada kita
  rationale: Frasa ini menunjuk pada arah kasih Allah menuju kita. “Kepada kita” lebih langsung mempertahankan nuansa arah daripada sekadar “bagi kita” dan menghindari pengulangan dengan ὑπὲρ ἡμῶν.
- source_word: ὅτι
  choice: 'dengan kenyataan ini:'
  rationale: ὅτι memperkenalkan isi atau dasar nyata yang memperlihatkan kasih Allah. Ungkapan ini menghasilkan hubungan yang jelas dan alami dengan klausa berikutnya.
- source_word: ἔτι ἁμαρτωλῶν ὄντων ἡμῶν
  choice: ketika kita masih orang berdosa
  rationale: Konstruksi genitif absolut diterjemahkan sebagai klausa temporal yang juga menyiratkan kontras. Bentuk nominal “orang berdosa” mempertahankan ἁμαρτωλῶν, sedangkan “masih” mempertahankan ἔτι.
- source_word: Χριστὸς
  choice: Mesias
  rationale: Χριστός di sini berfungsi sebagai gelar kristologis. “Mesias” menerjemahkan makna gelar itu, bukan sekadar mentransliterasikannya.
- source_word: ὑπὲρ ἡμῶν
  choice: bagi kita
  rationale: ὑπέρ menyatakan bahwa kematian Mesias terjadi demi kepentingan kita atau untuk kita, tetapi ayat ini sendiri tidak mengharuskan satu rumusan khusus mengenai cara kerja pendamaian. “Bagi kita” luas, alami, dan tidak mempersempit maknanya.
- source_word: ἀπέθανεν
  choice: mati
  rationale: Aoristus ini menyatakan peristiwa kematian secara langsung. “Mati” adalah padanan yang sederhana dan tepat tanpa perlu menambahkan unsur yang tidak terdapat dalam bahasa Yunani.
theological_decisions:
- issue: Penerjemahan Χριστός dalam wacana Paulus
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks ini Χριστός berfungsi sebagai gelar bagi Yesus. “Mesias” mempertahankan arti gelar tersebut, sementara catatan kaki mencantumkan bentuk tradisional “Kristus” agar pembaca mengetahui padanan yang lazim.
- issue: Cakupan makna ὑπὲρ ἡμῶν
  choice: bagi kita
  alternative: demi kita; menggantikan kita
  rationale: Teks dengan jelas menyatakan bahwa kematian Mesias berkaitan dengan kepentingan kita, tetapi preposisi ὑπέρ dalam ayat ini tidak perlu dipersempit menjadi rumusan “menggantikan kita”. Pilihan utama mempertahankan keluasan dan ketegangan teologis bahasa sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat jelas bagi pembaca umum tanpa menghilangkan penekanan “kasih-Nya sendiri”, keadaan manusia sebagai “orang berdosa”, atau keluasan makna ὑπέρ. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
