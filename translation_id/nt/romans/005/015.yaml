id: ROM.5.15
reference: Romans 5:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐχ ὡς τὸ παράπτωμα, οὕτως καὶ τὸ χάρισμα· εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι οἱ πολλοὶ ἀπέθανον, πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/015.yaml
  text: But the gift is not like the trespass[a]. For if by the trespass of the one man the many died, much more the grace of God and the gift by the grace of the one man, Jesus the Messiah[b], overflowed to the many.
translation:
  language: id
  text: Namun, karunia itu tidak sama dengan pelanggaran itu.[a] Sebab, jika oleh pelanggaran satu orang itu orang banyak telah mati, terlebih lagi anugerah Allah dan pemberian yang datang melalui anugerah satu orang itu, yaitu Yesus Sang Mesias,[b] telah melimpah kepada orang banyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesalahan itu” atau “tindakan salah itu”.
    reason: lexical_alternative
  - marker: b
    text: Atau “Yesus Kristus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράπτωμα
  choice: pelanggaran
  rationale: Kata ini menunjuk pada tindakan salah atau penyimpangan. “Pelanggaran” mempertahankan bobot moralnya dan sesuai dengan pertentangan antara tindakan Adam dan karunia Allah.
- source_word: χάρισμα
  choice: karunia
  rationale: “Karunia” secara alami menyatakan pemberian yang bersumber pada kemurahan, sekaligus membedakannya dari δωρεά yang kemudian diterjemahkan “pemberian”.
- source_word: οἱ πολλοί / τοὺς πολλούς
  choice: orang banyak
  rationale: Ungkapan ini mempertahankan kontras retoris Paulus antara satu orang dan orang banyak tanpa menafsirkannya secara lebih tegas sebagai “semua orang”.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: anugerah Allah
  rationale: Ungkapan ini lugas, bermartabat, dan mempertahankan χάρις sebagai kemurahan Allah yang tidak diperoleh karena jasa.
- source_word: ἡ δωρεὰ ἐν χάριτι
  choice: pemberian yang datang melalui anugerah
  rationale: Terjemahan ini mengungkapkan hubungan instrumental atau asosiatif ἐν secara wajar dalam bahasa Indonesia, tanpa menghilangkan kaitan erat antara pemberian dan anugerah.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: satu orang itu
  rationale: Bentuk ini mempertahankan penekanan pada “satu” dan menandai tokoh tertentu dalam kesejajaran satu orang/orang banyak.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός dipahami sebagai gelar yang masih bermakna dalam perbandingan Adam–Mesias. “Sang” membuat bentuk gelar tersebut wajar dan bermartabat dalam bahasa Indonesia.
- source_word: ἐπερίσσευσεν
  choice: telah melimpah
  rationale: “Melimpah” mempertahankan gagasan kelimpahan yang melampaui ukuran biasa dan mendukung argumen “terlebih lagi”.
theological_decisions:
- issue: Cakupan “orang banyak” dalam kesejajaran Adam dan Mesias
  choice: Mempertahankan “orang banyak” tanpa mengubahnya menjadi “semua orang”.
  alternative: Menerjemahkannya sebagai “semua orang” untuk memperjelas cakupan perwakilan.
  rationale: Teks ayat ini memakai kontras satu/orang banyak. Mempertahankan ungkapan tersebut menjaga ketegangan teologis dan tidak memasukkan kesimpulan dari konteks yang lebih luas ke dalam ayat ini.
- issue: Fungsi Χριστός dalam nama Ἰησοῦ Χριστοῦ
  choice: 'Menerjemahkannya sebagai gelar: “Yesus Sang Mesias”.'
  alternative: Mentransliterasikannya sebagai “Yesus Kristus”.
  rationale: Dalam konteks perbandingan dua tokoh perwakilan, nilai titular “Mesias” tetap dapat terdengar; catatan kaki mempertahankan bentuk tradisional sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur satu orang/orang banyak dan pengulangan kosakata anugerah–pemberian dipertahankan, sementara frasa ἐν χάριτι dibuat alami sebagai “yang datang melalui anugerah”.
