id: ROM.5.19
reference: Romans 5:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/019.yaml
  text: For just as through the disobedience of the one man the many were made sinners[c][b][a], so also through the obedience of the one man the many will be made righteous.
translation:
  language: id
  text: Sebab, sama seperti melalui ketidaktaatan satu orang, orang banyak dijadikan orang berdosa[a], demikian juga melalui ketaatan satu orang[b], orang banyak akan dijadikan orang benar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ditetapkan sebagai orang berdosa.”
    reason: lexical_alternative
  - marker: b
    text: Yunani hanya berbunyi “melalui ketaatan satu”; kata “orang” dipahami dari klausa sebelumnya.
    reason: lexical_alternative
  - marker: c
    text: Atau “akan ditetapkan sebagai orang benar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακοῆς
  choice: ketidaktaatan
  rationale: Padanan langsung dan alami yang mempertahankan kontras dengan ὑπακοή, “ketaatan”.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: satu orang
  rationale: Menyampaikan satu tokoh representatif yang dimaksud dalam konteks, yaitu Adam, tanpa menambahkan penafsiran ke dalam teks.
- source_word: ἁμαρτωλοὶ
  choice: orang berdosa
  rationale: Adjektiva ini berfungsi secara substantival/predikatif; “orang berdosa” jelas dan lazim dalam bahasa Indonesia.
- source_word: κατεστάθησαν
  choice: dijadikan
  rationale: Mencerminkan tindakan menempatkan atau menetapkan dalam suatu keadaan, sambil mempertahankan bentuk pasif dan kesejajaran dengan verba pada klausa kedua.
- source_word: οἱ πολλοί
  choice: orang banyak
  rationale: Mewakili artikel dan bentuk jamak Yunani tanpa menafsirkan cakupannya sebagai “semua”; ungkapan ini juga alami dalam ragam Alkitab Indonesia.
- source_word: ὑπακοῆς
  choice: ketaatan
  rationale: Padanan alami yang mempertahankan kontras leksikal dengan παρακοή.
- source_word: τοῦ ἑνὸς
  choice: satu orang
  rationale: Kata “orang” dipahami dari klausa pertama dan ditambahkan dalam bahasa Indonesia agar kesejajaran kedua klausa jelas dan alami.
- source_word: δίκαιοι
  choice: benar
  rationale: Padanan yang jelas bagi δίκαιος dalam konteks Paulus dan selaras dengan rumpun istilah δικ- tanpa mempersempitnya menjadi rumusan doktrinal tertentu.
- source_word: κατασταθήσονται
  choice: akan dijadikan
  rationale: Mempertahankan bentuk pasif futur dan kesejajaran formal dengan κατεστάθησαν, tanpa menggantinya dengan verba δικαιόω yang tidak dipakai di sini.
theological_decisions:
- issue: Cakupan οἱ πολλοί
  choice: orang banyak
  alternative: semua orang
  rationale: Teks Yunani berbunyi οἱ πολλοί, bukan πάντες. Terjemahan mempertahankan ungkapan Paulus dan tidak menyelesaikan secara interpretatif ketegangan tentang cakupannya.
- issue: Makna κατασταθήσονται δίκαιοι
  choice: akan dijadikan benar
  alternative: akan dinyatakan benar
  rationale: Bahasa sumber memakai καθίστημι dengan δίκαιοι, bukan δικαιόω. Pilihan ini mempertahankan bahasa status/keadaan yang lebih luas dan tidak memasukkan penafsiran forensik secara eksklusif.
- issue: Identitas “satu orang” dalam klausa kedua
  choice: satu orang
  alternative: Kristus
  rationale: Konteks menunjuk kepada Kristus, tetapi ayat ini sendiri memakai τοῦ ἑνός. Terjemahan mempertahankan ungkapan sumber dan membiarkan konteks menyatakan identitasnya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur “sama seperti ... demikian juga ...” mempertahankan kesejajaran retoris Yunani. “Orang banyak” dipilih untuk menjaga artikel dan ketegangan teologis οἱ πολλοί, sedangkan “dijadikan” menjaga kesejajaran kedua bentuk καθίστημι.
