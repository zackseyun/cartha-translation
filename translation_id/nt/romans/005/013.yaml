  source_fidelity: Klausa pertama secara tepat menyatakan bahwa dosa telah ada di dunia sebelum hukum, dan klausa kedua dengan baik mempertahankan metafora penghitungan dari ἐλλογεῖται. Namun, “diberikan” merupakan penambahan yang tidak dinyatakan secara eksplisit oleh ἄχρι νόμου. Rujukan kepada hukum Musa sangat mungkin dalam konteks, tetapi waktu “pemberian” hukum sebaiknya tidak dimasukkan ke dalam teks utama.
  naturalness: Bahasa draft pada umumnya baku dan lancar. “Sebelum adanya hukum Taurat” tetap alami dalam bahasa Indonesia modern serta lebih dekat dengan konstruksi temporal Yunani daripada “sebelum hukum Taurat diberikan.”
  terminology: “Dosa,” “dunia,” dan “diperhitungkan” merupakan padanan yang baik. “Hukum Taurat” dapat dipertahankan pada klausa pertama sebagai rujukan kontekstual yang paling mungkin, sedangkan “hukum” pada klausa kedua mempertahankan perumusan umum teks. Catatan kaki sebaiknya memakai padanan Indonesia yang lebih jelas untuk metafora pembebanan sebelum menyebut alternatif teknis “diimputasikan.”
