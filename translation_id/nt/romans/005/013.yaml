  text: ἄχρι γὰρ νόμου ἁμαρτία ἦν ἐν κόσμῳ, ἁμαρτία δὲ οὐκ ἐλλογεῖται μὴ ὄντος νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/013.yaml
  text: For until the law[a], sin was in the world; but sin is not counted where there is no law.
translation:
  language: id
  text: Sebab, sebelum adanya hukum Taurat, dosa sudah ada di dunia. Tetapi dosa tidak diperhitungkan[a] jika tidak ada hukum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dibebankan sebagai tanggungan seseorang” atau “diimputasikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι γὰρ νόμου
  choice: Sebab, sebelum hukum Taurat diberikan
  rationale: ἄχρι menandai masa hingga hadirnya hukum. Dalam konteks Roma 5:14, hukum yang dimaksud paling mungkin hukum Musa; ungkapan ini menyampaikan batas waktu tersebut secara wajar dalam bahasa Indonesia.
- source_word: ἁμαρτία
  choice: dosa
  rationale: Mempertahankan nomina tunggal abstrak Paulus serta kemungkinan nuansa dosa sebagai kuasa tanpa menafsirkannya secara berlebihan.
- source_word: ἐν κόσμῳ
  choice: di dunia
  rationale: Padanan langsung dan alami untuk ranah dunia manusia tempat dosa telah ada.
- source_word: ἐλλογεῖται
  choice: diperhitungkan
  rationale: Mengungkapkan metafora pencatatan atau pembebanan dalam perhitungan tanpa memakai istilah teologis teknis yang dapat mempersempit makna.
- source_word: μὴ ὄντος νόμου
  choice: jika tidak ada hukum
  rationale: Genitivus absolutus ini menyatakan keadaan atau syarat berupa tidak adanya hukum; 'jika' alami dalam bahasa Indonesia dan mempertahankan sifat umum pernyataan itu.
theological_decisions:
- issue: Rujukan νόμου pada klausa pertama
  choice: hukum Taurat
  alternative: hukum
  rationale: Konteks langsung membahas masa dari Adam sampai Musa, sehingga hukum Musa paling mungkin dimaksud. Sebutan 'hukum Taurat' memberi rujukan yang jelas bagi pembaca Indonesia tanpa menjelaskan doktrin tambahan.
- issue: Daya makna ἐλλογεῖται
  choice: diperhitungkan
  alternative: dibebankan kepada seseorang; diimputasikan
  rationale: Kata Yunani memiliki nuansa pencatatan akuntansi atau pembebanan. Pilihan utama tetap mudah dipahami dan tidak memutuskan perdebatan teologis mengenai imputasi.
- issue: Hubungan keberadaan dosa dan tidak diperhitungkannya dosa
  choice: Mempertahankan kedua pernyataan secara berdampingan tanpa menjelaskan bagaimana keduanya diselaraskan
  alternative: Menambahkan bahwa dosa sama sekali tidak mendatangkan kesalahan atau hukuman
  rationale: Teks menegaskan bahwa dosa sudah ada, tetapi tidak diperhitungkan ketika hukum tidak ada. Terjemahan tidak boleh menghapus ketegangan itu dengan penjelasan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Namun' memperjelas pertentangan tanpa mengubah hubungan antarklausa. Penanda catatan kaki ditempatkan sesudah 'diperhitungkan' karena catatan menjelaskan ἐλλογεῖται.
