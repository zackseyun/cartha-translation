id: ROM.5.17
reference: Romans 5:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι ὁ θάνατος ἐβασίλευσεν διὰ τοῦ ἑνός, πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/017.yaml
  text: For if[a], by the trespass of the one, death reigned through the one, much more will those who receive the abundance of grace and the gift of righteousness reign in life through the one[b], Jesus the Messiah.
translation:
  language: id
  text: Sebab, jika oleh pelanggaran satu orang maut telah memerintah melalui satu orang itu, terlebih lagi mereka yang menerima kelimpahan anugerah dan karunia kebenaran[a] akan memerintah dalam kehidupan melalui satu orang itu, yaitu Yesus Kristus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “karunia keadilan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Yesus sang Mesias.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπτώματι
  choice: pelanggaran
  rationale: Kata ini menyatakan tindakan menyimpang atau melanggar dan sesuai dengan perbandingan Adam–Kristus dalam konteks ini.
- source_word: ἐβασίλευσεν / βασιλεύσουσιν
  choice: berkuasa
  rationale: Pilihan yang alami dalam bahasa Indonesia dan tetap mempertahankan gambaran pemerintahan dalam kedua verba yang sengaja disejajarkan.
- source_word: περισσείαν
  choice: kelimpahan
  rationale: Mengungkapkan ukuran yang berlebih atau penuh secara alami dan ringkas.
- source_word: χάριτος
  choice: anugerah
  rationale: Istilah Indonesia yang mapan untuk kemurahan Allah yang diberikan, khususnya dalam pemakaian Paulus.
- source_word: δωρεᾶς
  choice: karunia
  rationale: Menandai sesuatu yang diberikan dengan cuma-cuma tanpa menambahkan unsur yang tidak perlu.
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: Padanan teologis yang mapan dalam konteks pembenaran Paulus, sambil mempertahankan kemungkinan nuansa keadilan dalam catatan kaki.
- source_word: λαμβάνοντες
  choice: mereka yang menerima
  rationale: Partisipel ini mencirikan kelompok tersebut sebagai para penerima; bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: ἐν ζωῇ
  choice: dalam kehidupan
  rationale: Mempertahankan ungkapan ringkas Yunani dan kontrasnya dengan maut.
- source_word: τοῦ ἑνὸς
  choice: satu orang itu
  rationale: Dalam konteks perbandingan Adam dan Kristus, bentuk maskulin ini menunjuk kepada satu pribadi; penambahan 'orang' membuat acuannya jelas tanpa mengidentifikasi nama yang tidak disebut dalam ayat.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Kristus
  rationale: Dalam bahasa Indonesia, bentuk ini merupakan padanan alami bagi gabungan nama dan gelar yang telah menjadi ungkapan mapan.
theological_decisions:
- issue: Makna δικαιοσύνης dalam frasa Paulus
  choice: karunia kebenaran
  alternative: karunia keadilan
  rationale: Dalam konteks Adam–Kristus dan pembenaran, 'kebenaran' paling sesuai dengan penggunaan Paulus, sedangkan nuansa 'keadilan' tetap dicatat sebagai kemungkinan leksikal.
- issue: Cara menerjemahkan Χριστοῦ sesudah Ἰησοῦ
  choice: Yesus Kristus
  alternative: Yesus sang Mesias
  rationale: Dalam susunan Ἰησοῦ Χριστοῦ, Χριστός dapat berfungsi secara mirip nama-gelar; 'Yesus Kristus' paling alami dalam bahasa Indonesia, sementara arti gelarnya dipertahankan dalam catatan kaki.
- issue: Subjek yang berkuasa dalam kehidupan
  choice: mereka yang menerima ... akan berkuasa
  alternative: kehidupan akan berkuasa
  rationale: Bentuk Yunani οἱ ... λαμβάνοντες adalah subjek jamak eksplisit dari βασιλεύσουσιν; terjemahan tidak mengalihkan tindakan berkuasa kepada 'kehidupan'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur perbandingan serta pengulangan 'satu orang' dipertahankan untuk menampilkan kesejajaran Adam–Kristus. 'Maut' dipilih untuk register Alkitabiah yang tetap mudah dipahami; 'berkuasa' menjaga metafora pemerintahan secara alami.
