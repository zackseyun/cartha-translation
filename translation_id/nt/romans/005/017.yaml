  to: Sebab, jika oleh pelanggaran satu orang maut telah memerintah melalui satu orang itu, terlebih lagi mereka yang menerima kelimpahan anugerah dan karunia kebenaran[a] akan memerintah dalam kehidupan melalui satu orang itu, yaitu Yesus Kristus[b].
  rationale: Revisi terbatas pada «telah memerintah» dan «akan memerintah» untuk mempertahankan daya metaforis kerajaan serta kontras aspek dan waktu dalam dua verba βασιλεύω. Unsur-unsur lain dan kedua jangkar catatan kaki dipertahankan.
