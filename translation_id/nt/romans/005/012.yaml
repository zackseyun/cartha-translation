id: ROM.5.12
reference: Romans 5:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὥσπερ δι’ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν ἐφ’ ᾧ πάντες ἥμαρτον—
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/012.yaml
  text: Therefore[a], just as sin entered into the world through one man, and death through sin, so also death spread to all people, because all sinned—
translation:
  language: id
  text: Karena itu, sama seperti dosa masuk ke dalam dunia melalui satu orang, dan maut melalui dosa, demikian juga maut menjalar ke semua orang, karena semua orang telah berbuat dosa[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut pemahaman tradisional, “di dalam dia semua orang telah berbuat dosa.”
    reason: Mempertahankan pembacaan alternatif yang penting secara historis dan teologis bagi ἐφ’ ᾧ.
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Karena itu
  rationale: Menandai peralihan inferensial dari uraian sebelumnya dengan ungkapan Indonesia yang alami dan ringkas.
- source_word: δι’ ἑνὸς ἀνθρώπου
  choice: melalui satu orang
  rationale: διά dengan genitif menyatakan perantaraan; 'orang' tetap alami dalam bahasa Indonesia, sementara konteks menunjuk kepada Adam.
- source_word: ἡ ἁμαρτία
  choice: dosa
  rationale: Mempertahankan istilah Paulus tanpa penjelasan tambahan yang tidak terdapat dalam teks.
- source_word: εἰς τὸν κόσμον εἰσῆλθεν
  choice: masuk ke dalam dunia
  rationale: Mempertahankan arah yang dinyatakan oleh εἰς dalam bentuk Indonesia yang wajar.
- source_word: διὰ τῆς ἁμαρτίας ὁ θάνατος
  choice: dan maut melalui dosa
  rationale: 'Mempertahankan kesejajaran: dosa masuk melalui satu orang dan maut melalui dosa.'
- source_word: οὕτως
  choice: demikian juga
  rationale: Menandai korespondensi dalam perbandingan Paulus secara jelas.
- source_word: εἰς πάντας ἀνθρώπους
  choice: kepada semua orang
  rationale: Mengungkapkan cakupan seluruh umat manusia tanpa membatasi rujukan pada laki-laki.
- source_word: ὁ θάνατος διῆλθεν
  choice: maut menjalar
  rationale: Menyampaikan gerak yang meluas ke seluruh umat manusia; 'menjalar' alami untuk penyebaran daya maut.
- source_word: ἐφ’ ᾧ
  choice: karena
  rationale: Dalam konteks ini frasa tersebut paling wajar dipahami secara kausal, tetapi ambiguitas pentingnya dipertahankan dalam catatan kaki.
- source_word: πάντες ἥμαρτον
  choice: semua orang telah berbuat dosa
  rationale: Bentuk perfektif Indonesia menyampaikan tindakan yang terjadi tanpa mengubahnya menjadi pernyataan kebiasaan; pengulangan 'orang' memperjelas subjek universal.
theological_decisions:
- issue: Makna ἐφ’ ᾧ πάντες ἥμαρτον
  choice: 'kausal: ''karena semua orang telah berbuat dosa'''
  alternative: 'representatif/inkorporatif: ''di dalam dia semua orang telah berbuat dosa''; juga mungkin dipahami secara resultatif'
  rationale: Makna kausal paling wajar secara sintaksis dan kontekstual, tetapi frasa Yunani ini telah lama diperdebatkan dan memiliki bobot teologis besar. Karena itu, pembacaan tradisional representatif dicatat tanpa menjadikannya isi eksplisit teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Maut' dipilih untuk daya kematian yang dipersonifikasikan dalam argumen Paulus, sedangkan struktur kalimat dan tanda pisah mempertahankan perbandingan yang belum selesai pada ayat ini.
