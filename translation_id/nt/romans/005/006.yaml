  text: ⸂Ἔτι γὰρ⸃ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ⸀ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/006.yaml
  text: For while we were still weak[a], at the right time Messiah died for the ungodly.
translation:
  language: id
  text: Sebab, ketika kita masih lemah, pada waktu yang tepat Mesias mati bagi orang-orang fasik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “demi orang-orang fasik.”
    reason: Padanan alternatif bagi ὑπέρ menonjolkan tindakan demi kepentingan mereka, sedangkan teks utama mempertahankan ungkapan yang lebih luas.
lexical_decisions:
- source_word: Χριστὸς
  choice: Mesias
  rationale: Menerjemahkan gelar Χριστός dengan padanan maknanya, “Mesias,” sesuai fungsinya sebagai gelar dalam konteks ini.
- source_word: ὄντων ἡμῶν ἀσθενῶν
  choice: ketika kita masih lemah
  rationale: Konstruksi genitif absolut dinyatakan sebagai anak kalimat waktu yang alami dalam bahasa Indonesia. “Lemah” mempertahankan keluasan makna ketidakmampuan manusia tanpa mempersempitnya menjadi kelemahan jasmani saja.
- source_word: ἔτι
  choice: masih
  rationale: Kata ini menunjukkan keadaan yang masih berlangsung. Satu kemunculan “masih” dalam terjemahan Indonesia menyampaikan maksud tersebut tanpa pengulangan yang janggal.
- source_word: κατὰ καιρὸν
  choice: pada waktu yang tepat
  rationale: Ungkapan ini menunjuk pada waktu yang sesuai atau ditetapkan; pilihan ini jelas dan alami tanpa menjelaskan secara berlebihan siapa yang menetapkannya.
- source_word: ὑπὲρ
  choice: bagi
  rationale: “Bagi” secara alami menyatakan bahwa kematian Mesias adalah untuk kepentingan orang-orang tersebut, sambil membiarkan nuansa perwakilan atau penggantian tetap terbuka.
- source_word: ἀσεβῶν
  choice: orang-orang yang tidak menghormati Allah
  rationale: Padanan deskriptif ini menyampaikan sikap tidak berbakti atau tidak hormat kepada Allah dengan bahasa modern yang mudah dipahami, tanpa membatasinya pada ketidakpercayaan intelektual.
- source_word: ἀπέθανεν
  choice: mati
  rationale: Bentuk aoristus ini secara langsung menyatakan peristiwa kematian; tidak diperlukan perluasan makna.
theological_decisions:
- issue: Daya makna kematian Mesias yang dinyatakan dengan ὑπὲρ ἀσεβῶν
  choice: mati bagi orang-orang yang tidak menghormati Allah
  alternative: mati demi orang-orang yang tidak menghormati Allah
  rationale: “Bagi” menyatakan dengan jelas bahwa kematian Mesias mendatangkan manfaat bagi mereka, tetapi tidak memaksakan rumusan doktrinal yang lebih sempit daripada cakupan preposisi Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat yang alami dan bernada khidmat. Istilah “Mesias” mempertahankan fungsi gelar, sedangkan frasa deskriptif untuk ἀσεβῶν dipilih agar segera dipahami pembaca umum.
