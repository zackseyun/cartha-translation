  source_fidelity: Teks Indonesia secara akurat mempertahankan struktur kondisional-retoris εἰ δὲ yang berlanjut ke ayat 23, maksud partisip θέλων, serta verba utama ἤνεγκεν. “Murka-Nya,” “menyatakan kuasa-Nya,” “menanggung,” dan “bejana-bejana kemurkaan” mencerminkan makna Yunani tanpa menambahkan penafsiran. Pasif sempurna κατηρτισμένα diterjemahkan tanpa menyatakan pelaku, sehingga ambiguitas sumber terpelihara.
  naturalness: Bahasa baku modern, jelas, dan bernada sesuai untuk surat Paulus. Susunan “dengan kesabaran yang besar menanggung” dapat diterima dan mengalir dalam register formal. Koma terakhir tepat karena kalimat Yunani masih berlanjut ke ayat berikutnya.
  terminology: “Allah,” “murka,” “kuasa,” “bejana-bejana,” dan “kebinasaan” konsisten dengan register Alkitabiah Indonesia serta metafora tembikar dalam konteks dekat. Catatan b secara tepat menjelaskan τὸ δυνατὸν αὐτοῦ tanpa mengubah terjemahan utama; catatan c tidak menetapkan agen bagi bentuk pasif.
