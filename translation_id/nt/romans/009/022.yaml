id: ROM.9.22
reference: Romans 9:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ θέλων ὁ θεὸς ἐνδείξασθαι τὴν ὀργὴν καὶ γνωρίσαι τὸ δυνατὸν αὐτοῦ ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ σκεύη ὀργῆς κατηρτισμένα εἰς ἀπώλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/022.yaml
  text: But what if God[a], wanting to display his wrath and make known his power, endured with great patience vessels of wrath prepared for destruction[c][b],
translation:
  language: id
  text: Tetapi bagaimana jika Allah[a], yang hendak menunjukkan murka-Nya dan menyatakan kuasa-Nya[b], dengan kesabaran yang besar menanggung bejana-bejana kemurkaan yang telah dipersiapkan untuk kebinasaan[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tetapi jika.” Bahasa Yunani membuka sebuah kalimat bersyarat retoris yang berlanjut ke ayat berikutnya.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “apa yang berkuasa atau sanggup dilakukan-Nya”; dalam konteks ini ungkapan tersebut menunjuk pada kuasa Allah.
    reason: lexical_alternative
  - marker: c
    text: Bentuk pasif “telah dipersiapkan untuk kebinasaan” tidak menyebut siapa yang mempersiapkan bejana-bejana itu. Ada yang memahaminya sebagai tindakan Allah, akibat pengerasan diri, atau sekadar keadaan siap untuk menerima penghakiman.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Tetapi bagaimana jika
  rationale: Mempertahankan daya retoris kalimat bersyarat yang berlanjut ke ayat berikutnya tanpa menjadikannya pernyataan langsung.
- source_word: θέλων
  choice: yang hendak
  rationale: Mengungkapkan maksud atau kehendak Allah yang berkaitan dengan verba utama secara alami dalam bahasa Indonesia.
- source_word: ἐνδείξασθαι τὴν ὀργὴν
  choice: menunjukkan murka-Nya
  rationale: Menyampaikan tindakan memperlihatkan murka ilahi dengan sengaja; 'murka' mempertahankan nuansa penghakiman.
- source_word: γνωρίσαι τὸ δυνατὸν αὐτοῦ
  choice: menyatakan kuasa-Nya
  rationale: '''Menyatakan'' membawa arti membuat sesuatu diketahui, sedangkan ''kuasa-Nya'' merupakan padanan kontekstual yang alami bagi ungkapan tentang apa yang berkuasa atau sanggup dilakukan-Nya.'
- source_word: ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ
  choice: dengan kesabaran yang besar menanggung
  rationale: Mencerminkan tindakan menahan atau menanggung dengan panjang sabar, dalam susunan Indonesia yang jelas dan bermartabat.
- source_word: σκεύη ὀργῆς
  choice: bejana-bejana kemurkaan
  rationale: Mempertahankan gambaran bejana dari konteks pembuat tembikar dan konstruksi genitif yang padat tanpa menjelaskan relasinya secara berlebihan.
- source_word: κατηρτισμένα
  choice: yang telah dipersiapkan
  rationale: Bentuk pasif sempurna menunjukkan keadaan telah siap atau dipersiapkan, sementara pelakunya tetap tidak disebutkan sebagaimana dalam bahasa Yunani.
- source_word: εἰς ἀπώλειαν
  choice: untuk kebinasaan
  rationale: Mengungkapkan arah, hasil, atau tujuan menuju kehancuran dengan istilah Alkitabiah yang tetap dipahami pembaca modern.
theological_decisions:
- issue: Pelaku yang tersirat dalam bentuk pasif κατηρτισμένα
  choice: Memakai 'yang telah dipersiapkan' tanpa menyebut siapa yang mempersiapkannya.
  alternative: Dipersiapkan Allah; menjadikan diri layak; atau berada dalam keadaan siap untuk kebinasaan.
  rationale: Teks Yunani menyatakan keadaan telah dipersiapkan tetapi tidak menyebut pelaku. Terjemahan mempertahankan ketegangan teologis tersebut.
- issue: Daya kalimat bersyarat yang belum selesai mulai dari εἰ
  choice: Memakai 'Tetapi bagaimana jika' dan membiarkan struktur berlanjut ke ayat 23.
  alternative: Memakai 'Tetapi jika' atau mengubahnya menjadi pernyataan lengkap dan langsung.
  rationale: Struktur sintaksis Paulus menggantung hingga ayat berikutnya; mempertahankannya mencegah terjemahan membuat penegasan yang lebih kuat daripada ayat ini sendiri.
- issue: Hubungan θέλων dengan verba utama
  choice: Merendernya secara netral sebagai 'yang hendak'.
  alternative: Menafsirkannya secara konsesif ('meskipun hendak') atau kausal ('karena hendak').
  rationale: Partisip Yunani tidak dengan sendirinya memastikan hubungan konsesif atau kausal; terjemahan utama tidak menutup ambiguitas itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. 'Bejana-bejana' dipertahankan untuk menjaga metafora tembikar dalam konteks langsung. Koma penutup menandai bahwa kalimat bersyarat berlanjut ke ayat berikutnya.
