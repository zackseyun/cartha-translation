id: ROM.9.24
reference: Romans 9:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὓς καὶ ἐκάλεσεν ἡμᾶς οὐ μόνον ἐξ Ἰουδαίων ἀλλὰ καὶ ἐξ ἐθνῶν;—
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/024.yaml
  text: even us[a], whom he also called[b], not only from the Jews but also from the Gentiles—
translation:
  language: id
  text: yaitu kita, yang juga telah dipanggil-Nya, bukan hanya dari antara orang Yahudi, tetapi juga dari antara bangsa-bangsa lain—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὓς ... ἡμᾶς
  choice: yaitu kita, yang
  rationale: Pronomina relatif οὓς mengacu kepada orang-orang yang disebut sebelumnya, lalu diperjelas secara aposisional oleh ἡμᾶς, ‘kita’. Susunan ‘yaitu kita, yang’ menyampaikan identifikasi tersebut secara alami dalam bahasa Indonesia sambil mempertahankan kaitan sintaksis dengan ayat sebelumnya.
- source_word: καὶ ἐκάλεσεν
  choice: juga telah dipanggil-Nya
  rationale: καί bersifat aditif, sedangkan bentuk aoris ἐκάλεσεν menyatakan tindakan Allah memanggil. Bentuk pasif Indonesia dengan enklitik ‘-Nya’ menjaga Allah sebagai pelaku yang tersirat dari konteks dan menghasilkan ungkapan yang wajar.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: bukan hanya ... tetapi juga
  rationale: Padanan korelatif ini mempertahankan keseimbangan retoris dan perluasan dari kelompok Yahudi kepada bangsa-bangsa lain.
- source_word: ἐξ Ἰουδαίων
  choice: dari antara orang Yahudi
  rationale: ἐξ menandai asal atau pemilihan dari dalam suatu kelompok. ‘Dari antara’ lebih tepat daripada sekadar ‘dari’ untuk menyatakan bahwa orang-orang yang dipanggil berasal dari kelompok tersebut.
- source_word: ἐξ ἐθνῶν
  choice: dari antara bangsa-bangsa lain
  rationale: Dalam pertentangan langsung dengan Ἰουδαίων, ἐθνῶν menunjuk kepada bangsa-bangsa bukan Yahudi. ‘Bangsa-bangsa lain’ merupakan ungkapan Indonesia yang jelas dan tidak bergantung pada istilah gerejawi ‘bangsa-bangsa bukan Yahudi’.
theological_decisions:
- issue: Kaitan dengan orang-orang yang menerima belas kasihan pada ayat sebelumnya
  choice: yaitu kita, yang juga telah dipanggil-Nya
  alternative: orang-orang yang juga dipanggil-Nya, yaitu kita
  rationale: Pilihan ini mempertahankan identifikasi Paulus atas kelompok yang disebut sebelumnya sebagai ‘kita’ tanpa menambahkan penjelasan mengenai urutan atau mekanisme pemilihan dan panggilan.
- issue: Makna ἐθνῶν dalam pertentangan Yahudi dan non-Yahudi
  choice: bangsa-bangsa lain
  alternative: bangsa-bangsa bukan Yahudi
  rationale: Konteks membuat pertentangan etnis-historisnya jelas. Pilihan ini mempertahankan cakupan kelompok non-Yahudi tanpa memasukkan kesimpulan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah pada akhir dipertahankan karena kalimat berlanjut ke kutipan dalam ayat berikutnya. Kapitalisasi ‘-Nya’ mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Allah.
