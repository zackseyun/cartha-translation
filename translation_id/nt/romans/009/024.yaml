  source_fidelity: Teks Indonesia dengan tepat mempertahankan struktur aposisional οὓς ... ἡμᾶς melalui “yaitu kita, yang ...”, tindakan panggilan ilahi, serta pasangan kontrasif “bukan hanya ... tetapi juga”. “Dari antara” memadai untuk ἐξ, dan “bangsa-bangsa lain” secara kontekstual menyampaikan ἐθνῶν sebagai kelompok non-Yahudi tanpa mempersempitnya secara tidak perlu.
