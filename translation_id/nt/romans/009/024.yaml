  terminology: “Orang Yahudi” dan “bangsa-bangsa lain” merupakan pasangan istilah yang jelas dan wajar dalam konteks Paulus. “Dipanggil-Nya” mempertahankan istilah penting καλέω tanpa menambahkan penafsiran doktrinal.
