  text: τῷ ⸂Μωϋσεῖ γὰρ⸃ λέγει· Ἐλεήσω ὃν ἂν ἐλεῶ, καὶ οἰκτιρήσω ὃν ἂν οἰκτίρω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/015.yaml
  text: For he says to Moses[a], “I will have mercy on whomever I have mercy[b], and I will have compassion on whomever I have compassion.”
translation:
  language: id
  text: Sebab kepada Musa Ia berfirman, “Aku akan menaruh belas kasihan kepada siapa yang Kuberikan belas kasihan, dan Aku akan menaruh iba kepada siapa yang Kuberikan iba.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kutipan dari Keluaran 33:19.
    reason: cross_reference
lexical_decisions:
- source_word: τῷ Μωϋσεῖ
  choice: kepada Musa
  rationale: Bentuk datif merupakan objek tak langsung dari λέγει; nama Μωϋσῆς diterjemahkan menurut bentuk baku bahasa Indonesia, yaitu Musa.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini menghubungkan kutipan tersebut sebagai dasar penjelasan bagi pernyataan sebelumnya.
- source_word: λέγει
  choice: Ia berfirman
  rationale: Kala kini dalam formula kutipan dipertahankan secara wajar, sedangkan 'berfirman' cocok karena penuturnya adalah Allah dalam konteks Keluaran 33:19. Huruf kapital pada 'Ia' menandai rujukan kepada Allah tanpa menambahkan nama yang tidak tersurat dalam bahasa Yunani.
- source_word: Ἐλεήσω … ἐλεῶ
  choice: Aku akan mengasihani … Kukasihani
  rationale: Pengulangan akar kata yang sama dipertahankan untuk menjaga kesejajaran dan ketegasan ungkapan. 'Mengasihani' menyampaikan tindakan memberikan belas kasihan tanpa menambahkan gagasan 'memilih' yang tidak tersurat.
- source_word: ὃν ἂν
  choice: siapa yang
  rationale: Gabungan pronomina relatif dan ἄν menyatakan objek yang tidak ditentukan; 'siapa yang' merupakan padanan alami dalam bahasa Indonesia dan tetap mempertahankan keterbukaan ungkapannya.
- source_word: οἰκτιρήσω … οἰκτίρω
  choice: Aku akan berbelaskasihan … Kubelaskasihani
  rationale: Padanan ini membedakan οἰκτίρω dari ἐλεέω sekaligus mempertahankan pengulangan internal dalam klausa kedua.
theological_decisions:
- issue: Identitas subjek dalam formula kutipan
  choice: Menerjemahkan secara personal sebagai 'Ia berfirman', dengan Allah sebagai penutur dalam konteks kutipan.
  alternative: Menerjemahkan secara impersonal sebagai 'Kitab Suci berkata kepada Musa'.
  rationale: Bahasa Yunani tidak menyebutkan subjek secara eksplisit, tetapi ucapan langsung dari Keluaran 33:19 adalah firman Allah kepada Musa. Terjemahan personal mengikuti konteks sumber tanpa menyisipkan 'Kitab Suci' ke dalam teks.
- issue: Kebebasan ilahi dalam belas kasihan
  choice: Mempertahankan rumusan yang berulang tanpa parafrasa penjelas.
  alternative: Menerjemahkan 'Aku akan mengasihani siapa pun yang Kupilih untuk Kukasihani'.
  rationale: Kata 'memilih' tidak terdapat dalam bahasa Yunani. Bentuk asli mempertahankan ketegangan teologis mengenai belas kasihan ilahi dan tidak menyelesaikan perdebatan penafsiran melalui tambahan dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Berfirman' dipakai secara alami untuk perkataan Allah; struktur paralel dan repetitif sengaja dipertahankan. Penanda catatan kaki [a] ditempatkan sesudah kutipan yang dirujuk.
