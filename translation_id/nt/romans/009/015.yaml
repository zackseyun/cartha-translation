  - severity: medium
    issue: “Mengasihani” sebagai padanan utama ἐλεέω dapat membawa nuansa merendahkan.
    rationale: Kata ini sering berarti merasa kasihan terhadap pihak yang dipandang malang. “Menaruh belas kasihan” lebih dekat dengan makna mercy dan lebih sesuai dengan register kutipan.
