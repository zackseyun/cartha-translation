- from: Sebab kepada Musa Ia berfirman, “Aku akan mengasihani siapa yang Kukasihani, dan Aku akan berbelaskasihan kepada siapa yang Kubelaskasihani.”[a]
  to: Sebab kepada Musa Ia berfirman, “Aku akan menaruh belas kasihan kepada siapa yang Kuberikan belas kasihan, dan Aku akan menaruh iba kepada siapa yang Kuberikan iba.”[a]
  rationale: Revisi mengganti ungkapan yang janggal atau berpotensi bernuansa merendahkan dengan kolokasi Indonesia baku. Paralelisme, pengulangan, bentuk masa depan, objek tak tentu (“siapa yang”), dan perbedaan relatif antara ἐλεέω dan οἰκτίρω tetap dipelihara. Tidak ada penambahan penafsiran mengenai pemilihan ilahi.
