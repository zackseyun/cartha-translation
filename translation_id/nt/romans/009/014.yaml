  text: What then shall we say? Is there injustice with God? Certainly not![a][b]
translation:
  language: id
  text: Jadi, apa yang akan kita katakan? Apakah ada ketidakadilan pada pihak Allah?[a] Sama sekali tidak![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketidakbenaran.”
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “Janganlah itu terjadi!” Ungkapan ini merupakan penolakan yang sangat tegas; dapat juga diterjemahkan “Mustahil!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Jadi, apa yang akan kita katakan?
  rationale: Ungkapan peralihan khas Paulus ini memperkenalkan kesimpulan atau keberatan. Bentuk ini alami dalam bahasa Indonesia dan tetap mencerminkan daya deliberatif bentuk mendatang ἐροῦμεν.
- source_word: μὴ
  choice: Apakah ada
  rationale: Dalam pertanyaan langsung, μή menandai pertanyaan retoris yang mengharapkan jawaban negatif. Susunan ini menyampaikan sifat retorisnya secara wajar tanpa menerjemahkan partikel itu secara kaku.
- source_word: ἀδικία
  choice: ketidakadilan
  rationale: Dalam konteks ini kata tersebut menunjuk pada kemungkinan bahwa tindakan Allah tidak adil. 'Ketidakadilan' mempertahankan nuansa moral-yudisial dan mudah dipahami pembaca modern.
- source_word: παρὰ τῷ θεῷ
  choice: pada Allah
  rationale: Frasa ini berarti bahwa ketidakadilan mungkin terdapat pada pihak Allah. 'Pada Allah' cukup dekat dengan bentuk Yunani dan tidak mengubah pertanyaan menjadi pernyataan yang lebih interpretatif seperti 'Apakah Allah tidak adil?'.
- source_word: μὴ γένοιτο
  choice: Sama sekali tidak!
  rationale: Ungkapan ini merupakan penolakan yang sangat tegas. Pilihan ini kuat dan alami dalam bahasa Indonesia modern, sedangkan bentuk harfiah 'Semoga itu tidak pernah terjadi' kurang idiomatis dalam konteks ini.
theological_decisions:
- issue: Apakah keberatan retoris Paulus perlu dijelaskan menurut suatu sistem teologis tertentu dalam Roma 9.
  choice: Ayat ini menyatakan kemungkinan adanya ketidakadilan pada Allah sebagai pertanyaan retoris, lalu menolaknya dengan tegas, tanpa tambahan penjelasan mengenai pemilihan, penolakan, atau keadilan ilahi.
  alternative: Terjemahan yang lebih interpretatif dapat berbunyi, 'Apakah Allah tidak adil?'
  rationale: Teks Yunani mengemukakan keberatan dan penolakannya secara ringkas. Terjemahan ini mempertahankan ketegangan dan kekuatannya tanpa memasukkan kesimpulan doktrinal yang tidak dinyatakan dalam ayat tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pertanyaan dibuat ringkas serta retoris; penutup memakai penolakan tegas yang lazim dipahami. Semua penanda catatan kaki ditempatkan dalam teks utama.
