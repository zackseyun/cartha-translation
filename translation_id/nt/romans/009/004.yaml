id: ROM.9.4
reference: Romans 9:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἵτινές εἰσιν Ἰσραηλῖται, ὧν ἡ υἱοθεσία καὶ ἡ δόξα καὶ αἱ διαθῆκαι καὶ ἡ νομοθεσία καὶ ἡ λατρεία καὶ αἱ ἐπαγγελίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/004.yaml
  text: who are Israelites[a], to whom belong the adoption, the glory, the covenants, the giving of the law, the worship, and the promises[d][c][b],
translation:
  language: id
  text: Mereka adalah orang-orang Israel[a]; milik merekalah pengangkatan sebagai anak[b], kemuliaan[c], perjanjian-perjanjian, pemberian hukum Taurat, ibadah[d], dan janji-janji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “yang adalah orang-orang Israel”; frasa ini melanjutkan uraian tentang kaum sebangsa Paulus dalam ayat sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “status sebagai anak” atau “pengangkatan menjadi anak.” Dalam konteks ini istilah tersebut menunjuk pada kedudukan Israel sebagai umat Allah.
    reason: lexical_alternative
  - marker: c
    text: “Kemuliaan” kemungkinan besar menunjuk pada hadirat Allah yang dinyatakan di tengah Israel.
    reason: cross_reference
  - marker: d
    text: Yaitu ibadah atau pelayanan kepada Allah yang ditetapkan bagi Israel dalam hubungan perjanjian.
    reason: cultural_note
lexical_decisions:
- source_word: οἵτινές εἰσιν Ἰσραηλῖται
  choice: Mereka adalah orang-orang Israel
  rationale: Frasa relatif ini menjelaskan kaum sebangsa Paulus yang disebut dalam ayat sebelumnya. Bentuk ini alami dalam bahasa Indonesia sambil mempertahankan identitas historis dan perjanjian yang dinyatakan oleh Ἰσραηλῖται.
- source_word: ὧν
  choice: milik merekalah
  rationale: Genitif relatif menyatakan kepemilikan. Bentuk ini ringkas, idiomatis, dan mempertahankan penekanan bahwa semua hak istimewa yang disebutkan berkaitan dengan Israel.
- source_word: υἱοθεσία
  choice: pengangkatan sebagai anak
  rationale: Mempertahankan metafora penerimaan atau penetapan ke dalam kedudukan anak tanpa mempersempitnya menjadi pengalaman keselamatan individual; dalam konteks ini yang dimaksud ialah kedudukan Israel sebagai umat.
- source_word: δόξα
  choice: kemuliaan
  rationale: Padanan langsung yang membiarkan istilah ini tetap padat secara teologis dan tidak menambahkan referen yang tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: διαθῆκαι
  choice: perjanjian-perjanjian
  rationale: Bentuk ulang mempertahankan jamak Yunani dan menunjukkan berbagai perjanjian yang dikaitkan dengan sejarah Israel.
- source_word: νομοθεσία
  choice: pemberian hukum Taurat
  rationale: Nomina ini menunjuk pada tindakan pemberian atau penetapan hukum, bukan sekadar hukum itu sendiri. 'Hukum Taurat' merupakan sebutan Indonesia yang jelas bagi hukum yang diberikan kepada Israel.
- source_word: λατρεία
  choice: ibadah
  rationale: Dalam konteks ini kata tersebut menunjuk pada ibadah atau pelayanan kepada Allah yang ditetapkan bagi Israel. 'Ibadah' alami dalam bahasa Indonesia, sedangkan catatan kaki menjelaskan nuansa pelayanannya.
- source_word: ἐπαγγελίαι
  choice: janji-janji
  rationale: Mempertahankan bentuk jamak dan dengan jelas menunjuk pada janji-janji Allah yang diberikan kepada Israel.
theological_decisions:
- issue: Makna υἱοθεσία bagi Israel
  choice: pengangkatan sebagai anak
  alternative: status sebagai anak; pengangkatan menjadi anak
  rationale: Daftar ini membicarakan hak istimewa Israel sebagai umat dalam sejarah perjanjian. Terjemahan mempertahankan metafora kekeluargaan tanpa memasukkan pengertian keselamatan individual yang tidak dinyatakan dalam ayat ini.
- issue: Referen ἡ δόξα
  choice: kemuliaan
  alternative: kemuliaan ilahi; hadirat yang mulia
  rationale: Kemungkinan besar istilah ini menunjuk pada penyataan hadirat Allah di tengah Israel, tetapi teks Yunani hanya menyebut 'kemuliaan'. Teks utama mempertahankan keluasan itu, sedangkan catatan kaki memberikan penjelasan yang wajar.
- issue: Cakupan λατρεία
  choice: ibadah
  alternative: pelayanan ibadah; pelayanan di tempat suci
  rationale: Istilah ini memiliki nuansa ibadah ritual atau pelayanan kepada Allah, tetapi tidak dengan sendirinya membatasi makna hanya pada Bait Allah atau pelayanan imam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan dua klausa dengan titik koma mengungkap hubungan penjelas dan kepemilikan secara alami. Istilah teknis dipertahankan bila penting secara teologis, sementara catatan kaki menjelaskan alternatif dan nuansa tanpa memasukkannya secara berlebihan ke dalam teks utama.
