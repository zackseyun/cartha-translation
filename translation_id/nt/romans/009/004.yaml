  terminology: Istilah “orang-orang Israel,” “pengangkatan sebagai anak,” “kemuliaan,” “perjanjian-perjanjian,” “hukum Taurat,” “ibadah,” dan “janji-janji” konsisten dengan makna sumber. Catatan kaki menjelaskan tanpa memaksakan penafsiran denominasi. Catatan tentang “kemuliaan” tetap berhati-hati dengan kata “kemungkinan besar.”
