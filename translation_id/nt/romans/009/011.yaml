id: ROM.9.11
reference: Romans 9:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μήπω γὰρ γεννηθέντων μηδὲ πραξάντων τι ἀγαθὸν ἢ ⸀φαῦλον, ἵνα ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ μένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/011.yaml
  text: For before they had yet been born or had done anything good or bad[a], so that God’s purpose according to election might remain[c][b],
translation:
  language: id
  text: Sebab, sebelum kedua anak itu dilahirkan dan sebelum mereka melakukan sesuatu yang baik atau buruk[a]—supaya maksud Allah menurut pemilihan-Nya tetap berlaku[b][c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sesuatu yang baik atau jahat.” Kata Yunani φαῦλον dapat berarti buruk, rendah, atau jahat.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “maksud Allah dalam memilih” atau “maksud Allah berdasarkan pemilihan.”'
    reason: lexical_alternative
  - marker: c
    text: 'Secara lebih harfiah: “tetap ada” atau “bertahan.” Dalam konteks ini, kata kerjanya juga dapat menyiratkan tetap teguh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μήπω ... γεννηθέντων
  choice: sebelum kedua anak itu dilahirkan
  rationale: Genitivus absolutus ini menyatakan keadaan sebelum kelahiran kedua anak yang disebut dalam konteks. Penambahan 'kedua anak itu' membuat rujukan jamak tersirat jelas secara alami tanpa menambah identitas baru.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelasan dengan ayat sebelumnya.
- source_word: μηδὲ πραξάντων
  choice: dan sebelum mereka melakukan
  rationale: Mengungkapkan negasi terkoordinasi secara wajar dalam bahasa Indonesia dan mempertahankan hubungan waktu dengan 'sebelum ... dilahirkan'.
- source_word: τι ἀγαθὸν ἢ φαῦλον
  choice: sesuatu yang baik atau buruk
  rationale: Pasangan 'baik atau buruk' alami dalam bahasa Indonesia; φαῦλον dapat berarti buruk, rendah, atau jahat, sehingga 'buruk' tidak mempersempit intensitas moralnya.
- source_word: ἵνα
  choice: supaya
  rationale: Mempertahankan daya klausa tujuan tanpa mengubahnya menjadi pernyataan hasil semata atau memperkuatnya secara dogmatis.
- source_word: ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ
  choice: maksud Allah menurut pemilihan-Nya
  rationale: Mempertahankan susunan 'menurut pemilihan' dan memakai 'maksud' sebagai padanan alami bagi πρόθεσις dalam konteks rencana atau tujuan Allah.
- source_word: μένῃ
  choice: tetap berlaku
  rationale: Menyampaikan gagasan bahwa maksud itu tetap ada dan berlanjut; catatan kaki mempertahankan alternatif yang lebih harfiah.
theological_decisions:
- issue: Daya ἵνα dalam konteks pemilihan
  choice: supaya maksud Allah menurut pemilihan-Nya tetap berlaku
  alternative: dengan hasil bahwa maksud Allah menurut pemilihan-Nya tetap berlaku
  rationale: Bentuk tujuan merupakan pembacaan sintaksis yang paling langsung, tetapi terjemahan tidak menjelaskan lebih jauh hubungan antara tujuan ilahi dan tanggung jawab manusia.
- issue: Makna ἐκλογή
  choice: pemilihan
  alternative: pilihan
  rationale: '''Pemilihan'' mempertahankan bobot istilah Paulus tanpa memasukkan sistem teologis tertentu.'
- issue: Hubungan konstruksi κατ’ ἐκλογὴν dengan πρόθεσις
  choice: maksud Allah menurut pemilihan-Nya
  alternative: maksud Allah dalam memilih
  rationale: Bentuk utama menjaga struktur Yunani dan ambiguitas hubungan konseptualnya; alternatif lebih idiomatis tetapi sedikit lebih menafsirkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda pisah menunjukkan bahwa ayat ini merupakan bagian dari kalimat panjang yang berlanjut ke ayat berikutnya. Semua penanda catatan kaki terdapat dalam teks utama.
