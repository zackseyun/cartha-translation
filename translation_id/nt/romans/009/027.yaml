  text: Ἠσαΐας δὲ κράζει ὑπὲρ τοῦ Ἰσραήλ· Ἐὰν ᾖ ὁ ἀριθμὸς τῶν υἱῶν Ἰσραὴλ ὡς ἡ ἄμμος τῆς θαλάσσης, τὸ ⸀ὑπόλειμμα σωθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/027.yaml
  text: But Isaiah cries out concerning Israel[a], “Though the number of the sons of Israel is like the sand of the sea[c][b], only the remnant will be saved.”
translation:
  language: id
  text: 'Namun Yesaya berseru mengenai Israel: “Sekalipun jumlah anak-anak Israel seperti pasir di laut,[a] kaum sisa akan diselamatkan.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Jika jumlah anak-anak Israel seperti pasir di laut.” Ungkapan Yunani “anak-anak Israel” adalah sebutan tradisional bagi keturunan Israel, dan bentuk bersyaratnya dapat diterjemahkan “jika”, meskipun dalam konteks ini bernuansa konsesif.'
    reason: lexical_alternative
  - marker: b
    text: Atau “akan dibebaskan” atau “akan diluputkan”. Ungkapan ini menggemakan nubuat Yesaya tentang kaum sisa yang bertahan.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang bernuansa kontras dengan argumen sebelumnya secara wajar dalam bahasa Indonesia.
- source_word: κράζει
  choice: berseru
  rationale: Mempertahankan daya ungkap verba kini yang menggambarkan pernyataan lantang dan tegas.
- source_word: ὑπὲρ τοῦ Ἰσραήλ
  choice: mengenai Israel
  rationale: Dalam konteks kutipan nubuat, frasa ini paling alami berarti tentang atau mengenai Israel, bukan demi Israel.
- source_word: Ἐὰν ᾖ
  choice: Sekalipun ... seperti
  rationale: Konstruksi bersyarat ini berfungsi secara konsesif dalam konteks, dengan kontras antara jumlah yang sangat besar dan kaum sisa yang diselamatkan.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: keturunan Israel
  rationale: Ungkapan ini alami bagi pembaca Indonesia dan mempertahankan makna sebutan korporat-perjanjian tanpa menyiratkan bahwa hanya laki-laki yang dimaksud.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: seperti pasir di laut
  rationale: Mempertahankan perumpamaan Kitab Suci dalam ungkapan Indonesia yang alami dan mudah dikenali.
- source_word: τὸ ὑπόλειμμα
  choice: kaum sisa
  rationale: Menyampaikan kelompok yang masih tersisa sebagai suatu kelompok, sekaligus mempertahankan istilah penting dalam nubuat.
- source_word: σωθήσεται
  choice: akan diselamatkan
  rationale: Mempertahankan bobot soteriologis kata tersebut dalam konteks Roma, tanpa meniadakan nuansa pembebasan dalam latar nubuat.
theological_decisions:
- issue: Makna konstruksi bersyarat Ἐὰν ᾖ dalam kutipan nubuat
  choice: 'Makna konsesif: “Sekalipun jumlah ... seperti ...”'
  alternative: 'Makna bersyarat yang lebih harfiah: “Jika jumlah ... seperti ...”'
  rationale: Pokok kutipan ialah kontras antara banyaknya keturunan Israel dan kaum sisa yang diselamatkan. “Sekalipun” menyampaikan fungsi itu secara alami tanpa menambahkan kesimpulan doktrinal.
- issue: Makna σωθήσεται
  choice: “akan diselamatkan”
  alternative: “akan dibebaskan” atau “akan diluputkan”
  rationale: Dalam konteks Roma 9–11, “diselamatkan” mempertahankan bobot teologis yang wajar, sedangkan kemungkinan nuansa pembebasan dari latar Yesaya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Susunan “mengenai Israel, Yesaya berseru” mempertahankan fokus frasa Yunani tanpa terasa kaku. “Keturunan Israel” dipilih daripada “anak-anak lelaki Israel” agar sebutan korporat itu terbaca alami dan tidak disalahpahami sebagai terbatas pada laki-laki.
