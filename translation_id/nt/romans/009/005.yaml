  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὧν οἱ πατέρες, καὶ ἐξ ὧν ὁ χριστὸς τὸ κατὰ σάρκα, ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/005.yaml
  text: theirs are the fathers[a], and from them, according to the flesh, is the Messiah, who is over all, God blessed forever[b]. Amen.
translation:
  language: id
  text: Milik merekalah para leluhur, dan dari merekalah, menurut daging,[a] Mesias berasal, yang berkuasa atas segala sesuatu, Allah yang terpuji selama-lamanya.[b] Amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam hal garis keturunan manusia.” Ungkapan Yunani ini secara harfiah berbunyi “menurut daging.”
    reason: lexical_alternative
  - marker: b
    text: Atau, jika klausa terakhir dipahami sebagai doksologi terpisah, “Allah, yang ada di atas segala sesuatu, terpujilah selama-lamanya. Amin,” bukan sebagai keterangan tentang Mesias.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πατέρες
  choice: para leluhur
  rationale: Ungkapan ini menunjuk kepada para pendahulu Israel yang dihormati dalam sejarah perjanjian. “Para leluhur” alami dalam bahasa Indonesia modern dan tidak mempersempit rujukannya hanya kepada para bapa leluhur tertentu.
- source_word: ἐξ ὧν
  choice: dari merekalah
  rationale: Kata ganti relatif ini kembali kepada orang-orang Israel yang baru disebutkan. Bentuk dengan -lah mempertahankan penekanan pada asal-usul Mesias dari antara mereka.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Di sini Χριστός berfungsi sebagai gelar dan berkaitan dengan hak-hak istimewa Israel, sehingga “Mesias” lebih tepat daripada bentuk yang menyerupai nama diri.
- source_word: τὸ κατὰ σάρκα
  choice: menurut daging
  rationale: Terjemahan ini mempertahankan ungkapan Paulus dan menunjukkan garis keturunan jasmani tanpa menafsirkannya sebagai natur berdosa. Makna yang lebih eksplisit diberikan dalam catatan kaki.
- source_word: ὁ ὢν ἐπὶ πάντων
  choice: yang ada di atas segala sesuatu
  rationale: Partisip berartikel paling wajar melanjutkan keterangan tentang Mesias. Frasa ini dekat dengan susunan Yunani sekaligus jelas dalam bahasa Indonesia.
- source_word: θεὸς εὐλογητὸς
  choice: Allah yang terpuji
  rationale: Pilihan ini membaca frasa tersebut sebagai aposisi yang menerangkan Mesias dan menyampaikan makna εὐλογητός secara alami tanpa menghilangkan persoalan tanda baca yang dicatat dalam catatan kaki.
- source_word: εἰς τοὺς αἰῶνας
  choice: selama-lamanya
  rationale: Padanan idiomatis Indonesia untuk ungkapan doksologis yang secara harfiah berarti “sampai sepanjang zaman”.
- source_word: ἀμήν
  choice: Amin
  rationale: Transliterasi baku dalam bahasa Indonesia untuk penegasan liturgis ini.
theological_decisions:
- issue: Apakah klausa ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας menerangkan Mesias atau merupakan doksologi terpisah kepada Allah
  choice: 'Teks utama membacanya sebagai kelanjutan keterangan tentang Mesias: “yang ada di atas segala sesuatu, Allah yang terpuji selama-lamanya.”'
  alternative: 'Klausa terakhir dapat dibaca sebagai doksologi terpisah: “Allah yang ada di atas segala sesuatu, terpujilah selama-lamanya.”'
  rationale: Alur sintaksis Yunani paling alami menghubungkan partisip berartikel ὁ ὢν dengan ὁ χριστός sebagai aposisi. Namun, naskah-naskah paling awal tidak memakai tanda baca modern dan penafsiran ini telah lama diperdebatkan, sehingga pembacaan doksologis dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat cukup alami bagi pembaca umum, sementara ungkapan khas Paulus “menurut daging” dipertahankan dan dijelaskan melalui catatan kaki. “Para leluhur” dipilih daripada “bapa-bapa” agar tidak terasa usang atau ambigu.
