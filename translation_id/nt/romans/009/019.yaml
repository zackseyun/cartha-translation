  text: Ἐρεῖς ⸂μοι οὖν⸃· Τί ⸀οὖν ἔτι μέμφεται; τῷ γὰρ βουλήματι αὐτοῦ τίς ἀνθέστηκεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/019.yaml
  text: You will say to me then[a], “Why then does he still find fault? For who has resisted his purpose?”
translation:
  language: id
  text: Jadi, kamu akan berkata kepadaku, “Kalau begitu, mengapa Dia masih menyalahkan? Sebab siapa yang telah menentang kehendak-Nya[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “maksud-Nya” atau “tujuan-Nya.” Kata Yunani βούλημα dapat berarti kehendak, maksud, atau tujuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρεῖς
  choice: kamu akan berkata
  rationale: Bentuk futur indikatif berfungsi sebagai futur retoris yang memperkenalkan keberatan yang Paulus antisipasi; 'berkata' lebih dekat dengan verba sumber daripada 'bertanya'.
- source_word: μοι
  choice: kepadaku
  rationale: Datif objek tak langsung dinyatakan secara eksplisit dan alami dalam bahasa Indonesia.
- source_word: οὖν ... οὖν
  choice: Jadi ... Kalau begitu
  rationale: Kedua partikel inferensial dipertahankan dengan ungkapan Indonesia yang wajar agar perkembangan dan penekanan argumen tetap terasa.
- source_word: Τί οὖν ἔτι μέμφεται
  choice: Kalau begitu, mengapa Dia masih menyalahkan?
  rationale: Dalam konstruksi ini τί paling alami berarti 'mengapa'; ἔτι diterjemahkan 'masih', sedangkan μέμφεται berarti menyalahkan atau mencari kesalahan.
- source_word: τῷ ... βουλήματι αὐτοῦ
  choice: kehendak-Nya
  rationale: βούλημα menunjuk pada kehendak, maksud, atau tujuan yang telah ditetapkan. 'Kehendak' alami dalam bahasa Indonesia dan ambiguitas leksikalnya dijelaskan dalam catatan kaki.
- source_word: τίς ἀνθέστηκεν
  choice: siapa yang pernah menentang
  rationale: Pertanyaan retoris dipertahankan; bentuk perfektum diterjemahkan secara idiomatis dengan 'pernah menentang', yang menyampaikan tindakan perlawanan hingga kini tanpa membuat bahasa kaku.
theological_decisions:
- issue: Makna βούλημα dalam konteks kedaulatan ilahi dan tanggung jawab manusia
  choice: kehendak-Nya
  alternative: maksud-Nya; tujuan-Nya
  rationale: Pilihan ini mempertahankan kuatnya keberatan retoris tanpa menjelaskan atau menyelesaikan ketegangan teologis dalam konteks. Catatan kaki menjaga rentang makna kata Yunani agar pembaca tidak menganggap hanya satu perumusan teologis yang dimungkinkan.
- issue: Subjek tersirat μέμφεται
  choice: Dia
  alternative: Allah
  rationale: Huruf kapital menandai bahwa subjek tersirat mengacu kepada Allah dari konteks, sambil tidak menambahkan nama yang tidak muncul secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'kamu', sesuai bentuk orang kedua tunggal Yunani dan gaya diatribe Paulus. Susunan retoris dibuat alami dan bermartabat; kedua οὖν tercermin sebagai 'Jadi' dan 'Kalau begitu'.
