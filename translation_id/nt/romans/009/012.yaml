base_translation:
  language: en
  yaml_path: translation/nt/romans/009/012.yaml
  text: not from works but from the One who calls[a], it was said to her[c][b], “The older will serve the younger.”
translation:
  language: id
  text: bukan berdasarkan perbuatan, melainkan berdasarkan Dia yang memanggil[a]—kepadanya dikatakan, “Yang lebih tua akan melayani yang lebih muda.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bukan berasal dari perbuatan, melainkan dari Dia yang memanggil.”
    reason: lexical_alternative
  - marker: b
    text: 'Kutipan dari Kejadian 25:23. Secara lebih harfiah: “Yang lebih besar akan melayani yang lebih kecil”; “lebih tua/lebih muda” mencerminkan konteks Yakub dan Esau.'
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: bukan berdasarkan perbuatan
  rationale: ἐκ dengan genitif dapat menyatakan sumber atau dasar. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kontras ringkas Paulus tanpa memperluasnya menjadi rumusan doktrinal.
- source_word: ἀλλ’ ἐκ τοῦ καλοῦντος
  choice: melainkan berdasarkan Dia yang memanggil
  rationale: Partisipel kini berartikel τοῦ καλοῦντος berfungsi sebagai nomina dan merujuk kepada Allah. Bentuk “yang memanggil” mempertahankan aspek kini, sedangkan “Dia” menandai rujukan ilahi tanpa menambahkan nama yang tidak ada dalam teks Yunani.
- source_word: ἐρρέθη αὐτῇ
  choice: dikatakanlah kepada perempuan itu
  rationale: Bentuk pasif aoristus dipertahankan sebagai rumus pengantar kutipan tanpa menambahkan pelaku eksplisit. “Perempuan itu” menjernihkan rujukan pronomina feminin kepada Ribka dalam konteks.
- source_word: ὅτι
  choice: tanda petik pembuka
  rationale: ὅτι memperkenalkan ujaran langsung; dalam bahasa Indonesia modern hal ini paling alami dinyatakan dengan tanda petik.
- source_word: Ὁ μείζων
  choice: Yang lebih tua
  rationale: Dalam konteks Esau dan Yakub, perbandingan usia dimaksudkan. Pilihan ini lebih jelas daripada terjemahan harfiah “yang lebih besar”, tetapi nuansa alternatif dicatat dalam catatan kaki.
- source_word: δουλεύσει
  choice: akan melayani
  rationale: δουλεύω dapat berarti melayani sebagai budak, tetapi dalam kutipan Kejadian ini “melayani” secara wajar menyatakan ketundukan tanpa mempersempit maknanya secara berlebihan.
- source_word: τῷ ἐλάσσονι
  choice: yang lebih muda
  rationale: Dalam pasangan kontekstual dengan μείζων, istilah ini menunjuk saudara yang lebih muda; terjemahan ini idiomatis dan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah kontras antara perbuatan dan Dia yang memanggil perlu diperluas menjadi pernyataan eksplisit tentang pemilihan tanpa syarat
  choice: Mempertahankan kontras ringkas “bukan berdasarkan perbuatan, melainkan berdasarkan Dia yang memanggil”.
  alternative: “bukan karena perbuatan, melainkan karena Allah yang memanggil”
  rationale: Ayat ini mengontraskan perbuatan dengan panggilan Allah, tetapi kesimpulan doktrinal yang lebih luas bergantung pada konteks. Terjemahan tidak memasukkan rumusan denominasi tertentu.
- issue: Apakah μείζων dan ἐλάσσων harus diterjemahkan menurut usia atau status
  choice: “lebih tua” dan “lebih muda” dalam teks utama.
  alternative: “lebih besar” dan “lebih kecil”
  rationale: Konteks Yakub dan Esau mendukung perbandingan usia, sedangkan kemungkinan nuansa status tetap diakui melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan lugas. Struktur pasif pengantar kutipan dipertahankan, sementara tanda pisah membantu menunjukkan bahwa frasa ini melanjutkan kalimat dan argumen dari ayat sebelumnya.
