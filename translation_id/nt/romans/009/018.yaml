  text: ἄρα οὖν ὃν θέλει ἐλεεῖ, ὃν δὲ θέλει σκληρύνει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/018.yaml
  text: So then[a], he shows mercy to whom he wills[b], and he hardens whom he wills.
translation:
  language: id
  text: Jadi, Dia berbelas kasihan[a] kepada siapa yang dikehendaki-Nya, dan Dia mengeraskan[b] siapa yang dikehendaki-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Dia menaruh belas kasihan kepada siapa yang dikehendaki-Nya.”
    reason: lexical_alternative
  - marker: b
    text: “Mengeraskan” juga dapat diterjemahkan “membuat keras kepala” atau “menjadikan tegar tengkuk.” Bahasa Yunani memakai verba aktif, sehingga tidak sepatutnya dilunakkan menjadi tindakan membiarkan semata-mata.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Jadi
  rationale: Gabungan partikel ini menandai kesimpulan dari uraian sebelumnya. “Jadi” menyampaikan daya simpulan itu secara alami dalam bahasa Indonesia modern.
- source_word: ὃν θέλει
  choice: kepada siapa yang dikehendaki-Nya
  rationale: Ungkapan ini mempertahankan acuan langsung kepada kehendak Allah dan cocok dengan verba “berbelas kasihan”; “dikehendaki-Nya” juga menjaga ragam yang khidmat tanpa menjadi usang.
- source_word: ἐλεεῖ
  choice: Dia berbelas kasihan
  rationale: Verba ini menyatakan tindakan menunjukkan belas kasihan. “Berbelas kasihan” jelas, alami, dan mempertahankan unsur belas kasihan dalam sumber.
- source_word: ὃν δὲ θέλει
  choice: dan ... siapa yang dikehendaki-Nya
  rationale: δέ mengontraskan klausa kedua dengan klausa pertama. “Dan” mempertahankan susunan berpasangan secara lancar, sedangkan pengulangan “siapa yang dikehendaki-Nya” menjaga kesejajaran retoris teks Yunani.
- source_word: σκληρύνει
  choice: Dia mengeraskan
  rationale: Bentuk aktif Yunani menyatakan tindakan mengeraskan atau membuat keras kepala. “Mengeraskan” mempertahankan keaktifan verba, gema kisah Firaun, serta ketegangan teologisnya tanpa menambahkan objek “hati” yang tidak tersurat dalam ayat ini.
theological_decisions:
- issue: Kehendak ilahi dalam θέλει
  choice: Mempertahankan pernyataan langsung tentang apa yang Allah kehendaki dalam kedua klausa.
  alternative: Mengubahnya menjadi bahasa tentang apa yang hanya Allah izinkan atau membiarkan terjadi.
  rationale: Teks Yunani secara langsung memakai θέλει dalam kedua klausa. Terjemahan tidak melunakkan atau menyelesaikan perdebatan mengenai kedaulatan Allah dan tanggung jawab manusia.
- issue: Keagenan dalam σκληρύνει
  choice: 'Menerjemahkannya secara aktif: “Dia mengeraskan.”'
  alternative: “Dia membiarkan menjadi keras” atau “Dia mengizinkan menjadi keras.”
  rationale: Verba Yunani berbentuk aktif dan secara langsung mengaitkan tindakan itu dengan subjek. Bahasa yang menyatakan izin semata akan menambahkan penafsiran yang tidak terdapat dalam bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam khidmat tetapi mudah dipahami. Pengulangan kedua klausa dipertahankan untuk mencerminkan kesejajaran dan tekanan retoris bahasa Yunani. Bentuk “mengeraskan” sengaja tidak ditambah dengan “hati” karena objek itu tidak dinyatakan dalam teks sumber.
