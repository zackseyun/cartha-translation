id: ROM.9.21
reference: Romans 9:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἢ οὐκ ἔχει ἐξουσίαν ὁ κεραμεὺς τοῦ πηλοῦ ἐκ τοῦ αὐτοῦ φυράματος ποιῆσαι ὃ μὲν εἰς τιμὴν σκεῦος ὃ δὲ εἰς ἀτιμίαν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/021.yaml
  text: Or does the potter not have authority over the clay[d][c][b][a], to make from the same lump one vessel for honor and another for dishonor?
translation:
  language: id
  text: Atau, tidakkah tukang periuk berwenang atas tanah liat[a] untuk membuat dari gumpalan yang sama[b] satu bejana untuk kehormatan dan bejana lain untuk kehinaan[c]?[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mempunyai hak atas tanah liat.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dari adonan yang sama” atau “dari massa yang sama.”
    reason: lexical_alternative
  - marker: c
    text: Atau “satu bejana untuk penggunaan terhormat dan bejana lain untuk penggunaan biasa.”
    reason: alternative_reading
  - marker: d
    text: Gambaran ini menggemakan bagian-bagian Perjanjian Lama tentang tukang periuk dan tanah liat, seperti Yesaya 29:16; 45:9; Yeremia 18:1–6.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Atau
  rationale: Memperkenalkan pertanyaan retoris berikutnya dalam alur argumentasi Paulus tanpa menambahkan penekanan yang tidak tersurat.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: tidakkah ... berwenang
  rationale: Menyatakan kewenangan atau hak yang sah, bukan sekadar kemampuan; bentuk ini alami dalam bahasa Indonesia.
- source_word: ὁ κεραμεὺς
  choice: tukang periuk
  rationale: Padanan yang jelas bagi perajin yang membentuk tanah liat dan tetap mempertahankan citra kenabian tentang pembuat periuk dan tanah liat.
- source_word: τοῦ πηλοῦ
  choice: atas tanah liat
  rationale: Genitif sesudah ἐξουσίαν menyatakan lingkup kewenangan; 'atas tanah liat' merupakan ungkapan Indonesia yang wajar.
- source_word: ἐκ τοῦ αὐτοῦ φυράματος
  choice: dari gumpalan yang sama
  rationale: φύραμα menunjuk pada bahan yang telah dicampur menjadi satu massa atau gumpalan; pilihan ini mempertahankan gambaran konkret tanah liat.
- source_word: ποιῆσαι
  choice: untuk membuat
  rationale: Padanan langsung dan alami bagi infinitif yang berarti membuat atau menghasilkan.
- source_word: ὃ μὲν ... ὃ δὲ
  choice: satu ... dan ... lain
  rationale: Menyampaikan korelasi sekaligus pertentangan antara kedua hasil buatan tanpa membuat susunan Indonesia terasa kaku.
- source_word: εἰς τιμὴν
  choice: untuk kehormatan
  rationale: Mempertahankan secara langsung bahasa kehormatan yang dipakai dalam bahasa Yunani tanpa mempersempitnya menjadi fungsi tertentu.
- source_word: σκεῦος
  choice: bejana
  rationale: Padanan yang tepat dalam gambaran tukang periuk dan cukup lazim dalam ragam Alkitab Indonesia.
- source_word: εἰς ἀτιμίαν
  choice: untuk kehinaan
  rationale: Mempertahankan pertentangan leksikal langsung dengan 'kehormatan' dan tidak menafsirkan frasa itu sebagai sekadar penggunaan biasa.
theological_decisions:
- issue: Apakah ἐξουσία harus diterjemahkan sebagai kewenangan, hak, atau kuasa dalam konteks perdebatan tentang kedaulatan ilahi dan tanggung jawab manusia
  choice: berwenang
  alternative: mempunyai hak; berkuasa
  rationale: '''Berwenang'' menyampaikan prerogatif yang sah dan tidak mereduksinya menjadi kemampuan belaka, sambil menghindari penambahan rumusan doktrinal yang tidak dinyatakan dalam ayat.'
- issue: Apakah εἰς τιμὴν / εἰς ἀτιμίαν perlu ditafsirkan sebagai fungsi terhormat dan fungsi biasa
  choice: untuk kehormatan ... untuk kehinaan
  alternative: untuk penggunaan terhormat ... untuk penggunaan biasa
  rationale: Bahasa Yunani secara langsung memakai pasangan kehormatan-kehinaan. Mempertahankannya menjaga keluasan metafora dan ketegangan teologis teks tanpa membatasi maksudnya pada kegunaan rumah tangga.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang bermartabat dan mudah dipahami. 'Tukang periuk' dipilih karena lebih langsung dan umum daripada istilah teknis seperti 'penjunan'; 'bejana' dipertahankan agar citra wadah buatan tukang periuk tetap jelas. Penanda catatan kaki ditempatkan pada unsur yang diterangkannya, dan pasangan 'kehormatan/kehinaan' mempertahankan simetri teks Yunani.
