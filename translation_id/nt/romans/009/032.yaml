  text: διὰ τί; ὅτι οὐκ ἐκ πίστεως ἀλλ’ ὡς ἐξ ⸀ἔργων· ⸀προσέκοψαν τῷ λίθῳ τοῦ προσκόμματος,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/032.yaml
  text: Why? Because it was not from faith[a], but as if from works. They stumbled over the stone of stumbling[d][c][b],
translation:
  language: id
  text: Mengapa? Karena bukan berdasarkan iman[a], melainkan seolah-olah berdasarkan perbuatan[b]. Mereka tersandung pada batu sandungan[c][d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bukan dari iman”; dapat juga diterjemahkan “bukan melalui iman.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “melainkan seakan-akan berasal dari perbuatan.” Ungkapan Yunaninya mempertahankan nuansa “seolah-olah.”
    reason: lexical_alternative
  - marker: c
    text: Ini mengacu pada Yesaya 8:14; bandingkan juga Yesaya 28:16 dalam ayat berikutnya.
    reason: cross_reference
  - marker: d
    text: Atau “batu yang menyebabkan orang tersandung.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί;
  choice: Mengapa?
  rationale: Bentuk tanya yang ringkas dan wajar ini mempertahankan daya retoris pertanyaan Paulus.
- source_word: οὐκ ἐκ πίστεως
  choice: bukan berdasarkan iman
  rationale: Kata 'berdasarkan' menyampaikan fungsi ἐκ sebagai dasar atau sumber dalam kontras ini, sedangkan 'iman' mempertahankan istilah teologis πίστις tanpa mempersempitnya menjadi kesetiaan.
- source_word: ἀλλ’ ὡς ἐξ ἔργων
  choice: melainkan seolah-olah berdasarkan perbuatan
  rationale: Ungkapan 'seolah-olah' mempertahankan nuansa ὡς dan tidak meratakan frasa itu menjadi sekadar 'berdasarkan perbuatan'; 'perbuatan' adalah padanan Indonesia yang alami bagi ἔργα dalam kontras Paulus.
- source_word: προσέκοψαν
  choice: Mereka tersandung pada
  rationale: Padanan ini mempertahankan gambaran konkret tentang tersandung pada suatu penghalang.
- source_word: τῷ λίθῳ τοῦ προσκόμματος
  choice: batu sandungan
  rationale: Ungkapan yang ringkas dan lazim ini mempertahankan citra batu serta hubungan leksikal dengan kata kerja 'tersandung'.
theological_decisions:
- issue: Makna πίστις dalam kontras iman dan perbuatan
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Dalam konteks ini πίστις dikontraskan dengan perbuatan sebagai dasar mengejar kebenaran. 'Iman' mempertahankan kategori Paulus tanpa menentukan nuansa yang lebih sempit daripada yang dinyatakan teks.
- issue: Nuansa ὡς sebelum 'berdasarkan perbuatan'
  choice: seolah-olah berdasarkan perbuatan
  alternative: berdasarkan perbuatan
  rationale: Terjemahan ini mempertahankan pembatasan atau nuansa perbandingan dalam ὡς dan tidak membuat pernyataan Paulus lebih mutlak daripada bentuk Yunaninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur eliptis sesudah 'Karena' dipertahankan agar tidak menambahkan kata kerja yang tidak dinyatakan dalam ayat Yunani; konteks ayat sebelumnya melengkapinya. Koma penutup dipertahankan karena kalimat berlanjut ke kutipan pada ayat berikutnya.
