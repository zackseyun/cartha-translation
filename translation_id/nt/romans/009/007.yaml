  text: οὐδ’ ὅτι εἰσὶν σπέρμα Ἀβραάμ, πάντες τέκνα, ἀλλ’· Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/007.yaml
  text: Nor is it the case that because they are Abraham’s offspring[a], they are all children. Rather[c][b], “In Isaac your offspring will be called.”
translation:
  language: id
  text: Dan bukan berarti bahwa karena mereka keturunan Abraham[a], mereka semua adalah anak-anak. Sebaliknya, “Melalui Ishaklah keturunanmu akan disebut.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “benih Abraham.” Kata Yunani yang dipakai berbentuk tunggal, tetapi dapat bermakna kolektif: keturunan.'
    reason: lexical_alternative
  - marker: b
    text: Kutipan dari Kejadian 21:12. “Akan disebut” juga dapat dipahami sebagai “akan dinamai” atau, dalam konteks ini, “akan diperhitungkan” atau “akan ditetapkan.” Atau, “Di dalam Ishak keturunanmu akan disebut.”
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ὅτι
  choice: Juga, bukan karena ... maka
  rationale: οὐδέ melanjutkan penyangkalan dari ayat sebelumnya, sedangkan ὅτι memperkenalkan dasar yang ditolak. Susunan ini menyampaikan hubungan logisnya secara alami dalam bahasa Indonesia.
- source_word: σπέρμα Ἀβραάμ
  choice: keturunan Abraham
  rationale: σπέρμα bersifat tunggal kolektif dan di sini menunjuk kepada keturunan Abraham. 'Keturunan' alami dalam bahasa Indonesia serta tidak membatasi jumlah atau jenis kelamin.
- source_word: πάντες τέκνα
  choice: mereka semua adalah anak-anak
  rationale: τέκνα berarti anak-anak secara inklusif. Kopula dan subjek dinyatakan agar konstruksi predikatif Yunani terbaca jelas dalam bahasa Indonesia, tanpa menambahkan penjelasan teologis.
- source_word: ἀλλ’
  choice: Sebaliknya
  rationale: Menandai koreksi atau kontras tegas terhadap anggapan sebelumnya.
- source_word: Ἐν Ἰσαὰκ
  choice: Melalui Ishaklah
  rationale: ἐν dalam kutipan ini dapat menyatakan garis keturunan yang berlangsung melalui Ishak. Partikel '-lah' menandai fokus pada Ishak secara wajar.
- source_word: κληθήσεταί
  choice: akan disebut
  rationale: Bentuk pasif futur dari καλέω dipertahankan secara dekat. Ungkapan ini tetap membuka nuansa 'dinamai', 'disebut', atau dalam konteks 'diperhitungkan/ditetapkan'.
- source_word: σοι σπέρμα
  choice: keturunanmu
  rationale: Dativus σοι dialihkan secara idiomatis menjadi bentuk posesif, sedangkan σπέρμα tetap diterjemahkan konsisten sebagai 'keturunan'.
theological_decisions:
- issue: Hubungan keturunan jasmani dengan status sebagai anak-anak
  choice: Ayat membedakan keturunan jasmani Abraham dari mereka yang merupakan anak-anak dalam garis janji, tanpa menjelaskan di sini seluruh mekanismenya.
  alternative: Menafsirkan ayat secara eksplisit sebagai rumusan lengkap tentang predestinasi, atau membatasinya pada pembedaan etnis semata.
  rationale: Teks mengontraskan keturunan Abraham dengan garis yang ditentukan dalam kutipan tentang Ishak. Terjemahan mempertahankan kontras itu tanpa memasukkan sistem teologis dari luar ayat.
- issue: Daya ungkap kutipan Kejadian 21:12
  choice: Mempertahankan bentuk pasif 'keturunanmu akan disebut'.
  alternative: Keturunanmu akan diperhitungkan; keturunanmu akan berasal dari Ishak.
  rationale: Bentuk 'akan disebut' lebih dekat dengan κληθήσεται dan membiarkan konteks menerangkan apakah nuansanya penamaan, pengakuan, atau penetapan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Keturunan' dipilih karena mudah dipahami sekaligus mempertahankan sifat kolektif σπέρμα. Susunan 'bukan karena ... maka' menjaga logika argumen Paulus, sedangkan catatan kaki mempertahankan alternatif harfiah dan ambiguitas κληθήσεται.
