id: ROM.9.3
reference: Romans 9:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ηὐχόμην γὰρ ⸂ἀνάθεμα εἶναι αὐτὸς ἐγὼ⸃ ἀπὸ τοῦ Χριστοῦ ὑπὲρ τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/003.yaml
  text: For I could wish that I myself were accursed and cut off from the Messiah for the sake of my brothers[a], my kinsmen according to the flesh[c][b],
translation:
  language: id
  text: Sebab aku sendiri dapat berharap[a] menjadi terkutuk dan terpisah dari Mesias[b] demi saudara-saudaraku, kaum kerabatku menurut daging.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani dapat juga diterjemahkan “aku berharap” atau “aku dapat berdoa”; dalam konteks ini, maksudnya tampaknya berupa harapan yang bersifat hipotetis.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Yunani mengaitkan keadaan menjadi terkutuk dengan keterpisahan dari Mesias. Dapat juga diterjemahkan “terkutuk, terpisah dari Mesias” atau “berada di bawah kutuk dan terpisah dari Mesias.”
    reason: lexical_alternative
  - marker: c
    text: “Menurut daging” di sini berarti berdasarkan keturunan jasmani atau garis etnis, bukan “tabiat berdosa.” Saudara-saudara dan kaum kerabat yang dimaksud ialah sesama orang Israel.
    reason: cultural_note
lexical_decisions:
- source_word: ηὐχόμην
  choice: bahkan bisa berharap
  rationale: Bentuk imperfek εὔχομαι dalam konteks ini menyatakan harapan yang bersifat hipotetis atau sulit dibayangkan, bukan sekadar tindakan berharap pada masa lampau. Kata “bahkan” membantu menyampaikan kuatnya perasaan Paulus.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelasan dengan pernyataan pada ayat sebelumnya.
- source_word: ἀνάθεμα
  choice: orang terkutuk
  rationale: Menyampaikan keadaan berada di bawah kutuk atau diserahkan kepada kebinasaan dengan bahasa Indonesia yang jelas dan berbobot.
- source_word: αὐτὸς ἐγώ
  choice: aku sendiri
  rationale: Mempertahankan penekanan ganda pada diri Paulus.
- source_word: ἀπὸ τοῦ Χριστοῦ
  choice: terpisah dari Mesias
  rationale: ἀπό menyatakan pemisahan, sedangkan Χριστός di sini tetap jelas sebagai gelar mesianik.
- source_word: ὑπὲρ
  choice: demi
  rationale: Secara ringkas dan alami menyampaikan makna untuk kepentingan atau demi kebaikan pihak lain.
- source_word: τῶν ἀδελφῶν μου
  choice: saudara-saudaraku
  rationale: Ungkapan Indonesia ini alami dan dapat mencakup saudara sebangsa tanpa membatasi rujukan hanya kepada laki-laki.
- source_word: τῶν συγγενῶν μου
  choice: kaum kerabatku
  rationale: Menunjukkan hubungan kekerabatan kolektif berdasarkan asal-usul, bukan hanya keluarga dekat.
- source_word: κατὰ σάρκα
  choice: menurut daging
  rationale: Mempertahankan ungkapan khas Paulus dan kaitan antarteks; catatan menjelaskan bahwa di sini ungkapan tersebut menunjuk pada keturunan jasmani atau etnis.
theological_decisions:
- issue: Apakah perkataan Paulus merupakan doa nyata atau harapan hipotetis
  choice: 'Dinyatakan sebagai harapan yang mungkin dibayangkan secara hipotetis: “bahkan bisa berharap.”'
  alternative: “pernah berharap” atau “berdoa”
  rationale: Pilihan ini tidak menegaskan bahwa Paulus benar-benar berdoa agar dipisahkan dari Mesias, tetapi tetap mempertahankan intensitas kerelaan yang ia ungkapkan.
- issue: Hubungan antara ἀνάθεμα dan ἀπὸ τοῦ Χριστοῦ
  choice: “terkutuk dan terpisah dari Mesias,” dengan catatan tentang kemungkinan hubungan frasa
  alternative: “terkutuk dari Mesias” atau “berada di bawah kutuk, jauh dari Mesias”
  rationale: Bahasa utama dibuat alami, sedangkan catatan mempertahankan kepadatan dan ambiguitas konstruksi Yunani yang menghubungkan kutuk dengan pemisahan dari Mesias.
- issue: Makna σάρξ dalam κατὰ σάρκα
  choice: Keturunan jasmani atau garis etnis
  alternative: Tabiat berdosa
  rationale: Konteks membicarakan hubungan Paulus dengan sesama orang Israel, bukan antropologi moral atau tabiat berdosa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mempertahankan tekanan emosional Paulus tanpa menjadi kaku. Istilah “Mesias” dipakai untuk Χριστός sebagai gelar, sedangkan “menurut daging” dipertahankan sebagai ungkapan khas Paulus dan dijelaskan melalui catatan kaki.
