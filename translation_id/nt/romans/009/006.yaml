revisions:
- from: Namun, ini bukan berarti bahwa firman Allah telah gagal. Sebab, tidak semua orang yang berasal dari Israel adalah Israel.[a][b]
  to: Tetapi bukan seolah-olah firman Allah telah gagal. Sebab tidak semua orang yang berasal dari Israel[a] adalah Israel[b].
  rationale: Revisi memakai “bukan seolah-olah” untuk mencerminkan secara lebih dekat ungkapan negasi Yunani tanpa menambahkan rujukan demonstratif. Catatan a diperbaiki agar tidak memasukkan “semua” ke dalam alternatif bagi frasa asal-usul. Kedua penanda catatan dipindahkan ke kata atau frasa yang benar-benar dijelaskannya. Teks tetap tidak menentukan secara denominatif siapa yang termasuk dalam penggunaan kedua “Israel.”
  reviewer_model: gpt-5.6-terra
