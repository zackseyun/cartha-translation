review_pass:
  verdict: revise
  source_fidelity: Pembukaan draf, “Namun, ini bukan berarti bahwa,” menyampaikan fungsi argumentatifnya, tetapi menggeser bentuk negasi Yunani οὐχ οἷον ... ὅτι (“bukan seolah-olah/bukan seperti bahwa”) menjadi rujukan yang lebih eksplisit kepada inferensi dari konteks. “Bukan seolah-olah” mempertahankan bentuk dan penekanan sumber dengan lebih dekat. Kontras “berasal dari Israel ... adalah Israel” setia pada οἱ ἐξ Ἰσραήλ ... οὗτοι Ἰσραήλ.
  naturalness: “Tetapi bukan seolah-olah firman Allah telah gagal” adalah bahasa Indonesia baku yang jelas dan bernada wajar untuk register kitab suci. Penempatan penanda catatan langsung pada istilah yang dijelaskan membuat pembacaan dan rujukan lebih jelas.
  terminology: “Firman Allah” tepat untuk ὁ λόγος τοῦ θεοῦ. Nama “Israel” dan ambiguitas teologis dalam pengulangan nama tersebut dipertahankan. Catatan alternatif harus merujuk kepada “orang-orang keturunan Israel,” bukan “semua keturunan Israel,” karena unsur “semua” berasal dari negasi πάντες dalam kalimat utama, bukan dari frasa οἱ ἐξ Ἰσραήλ itu sendiri.
  issues:
  - severity: medium
    issue: Pembukaan “ini bukan berarti bahwa” kurang langsung mencerminkan konstruksi Yunani.
    rationale: Konstruksi tersebut dapat dipahami secara kontekstual, tetapi menambahkan demonstratif “ini” dan membentuknya sebagai penolakan atas suatu makna/inferensi. “Bukan seolah-olah” lebih dekat dengan οὐχ οἷον ... ὅτι tanpa mengubah alur Paulus.
  - severity: medium
    issue: Catatan a keliru menambahkan “semua” pada alternatif leksikal.
    rationale: Catatan Inggris menjelaskan οἱ ἐξ Ἰσραήλ sebagai “those descended from Israel.” Alternatif Indonesia perlu menyatakan “orang-orang keturunan Israel”; “semua” sudah dinyatakan oleh πάντες dalam teks utama.
  - severity: low
    issue: Penanda catatan ditempatkan bersama-sama di akhir kalimat, bukan pada unsur yang dijelaskan.
    rationale: Catatan a menjelaskan frasa “berasal dari Israel,” sedangkan b menjelaskan kemunculan kedua “Israel.” Penanda perlu dipasang pada masing-masing unsur agar jangkar catatan jelas.
  revised_text: Tetapi bukan seolah-olah firman Allah telah gagal. Sebab tidak semua orang yang berasal dari Israel[a] adalah Israel[b].
