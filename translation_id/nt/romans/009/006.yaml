  text: Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραήλ, οὗτοι Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/006.yaml
  text: But it is not as though the word of God has failed[b][a]. For not all those from Israel are Israel.
translation:
  language: id
  text: Tetapi bukan seolah-olah firman Allah telah gagal. Sebab tidak semua orang yang berasal dari Israel[a] adalah Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang keturunan Israel.” Frasa Yunani ini menunjukkan asal-usul atau keturunan.
    reason: lexical_alternative
  - marker: b
    text: Nama “Israel” yang kedua dipakai dalam arti yang lebih sempit daripada yang pertama. Paulus membedakan keturunan jasmani dari penggunaan “Israel” dalam pengertian yang lebih khusus, terkait dengan perjanjian Allah.
    reason: cross_reference
lexical_decisions:
- source_word: Οὐχ οἷον δὲ ὅτι
  choice: Namun, ini bukan berarti bahwa
  rationale: Ungkapan idiomatis ini menyangkal kesimpulan yang mungkin ditarik dari ratapan sebelumnya. Bentuk Indonesia ini alami dan tetap mempertahankan fungsi korektifnya.
- source_word: ἐκπέπτωκεν
  choice: telah gagal
  rationale: Bentuk perfekt menyatakan keadaan kini sebagai hasil tindakan sebelumnya. Dalam hubungan dengan firman Allah, 'telah gagal' menyampaikan makna bahwa firman itu tidak terbukti tidak efektif atau tidak terlaksana.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: firman Allah
  rationale: Terjemahan formal ini mempertahankan keluasan λόγος, yang dalam konteks dapat mencakup firman Allah yang mengandung janji tanpa mempersempitnya langsung menjadi 'janji'.
- source_word: οὐ γὰρ πάντες
  choice: Sebab, tidak semua
  rationale: γάρ memberikan alasan bagi penyangkalan sebelumnya; 'Sebab' menyatakan hubungan penjelas itu secara jelas dan wajar.
- source_word: οἱ ἐξ Ἰσραήλ
  choice: orang yang berasal dari Israel
  rationale: ἐξ menandai asal-usul atau keturunan. Ungkapan ini mempertahankan makna asal tanpa memaksakan penafsiran lebih sempit dalam teks utama.
- source_word: οὗτοι Ἰσραήλ
  choice: adalah Israel
  rationale: Klausa ekuatif yang ringkas dipertahankan agar kontras tajam antara berasal dari Israel dan menjadi Israel tetap tampak.
theological_decisions:
- issue: Makna kemunculan kedua nama 'Israel'
  choice: Teks utama mempertahankan nama 'Israel' tanpa menjelaskan cakupannya, sedangkan catatan menyatakan bahwa pemakaiannya lebih sempit daripada kemunculan pertama.
  alternative: Menafsirkannya secara eksplisit sebagai orang-orang pilihan di dalam Israel etnis atau sebagai umat Allah secara lebih luas.
  rationale: Konteks membedakan keturunan jasmani dari pengertian Israel yang terkait dengan maksud perjanjian Allah, tetapi ayat ini sendiri tidak menetapkan secara lengkap cakupan teologisnya. Karena itu, ketegangan tersebut tidak diselesaikan secara denominatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Susunan kalimat dibuat alami, sementara pengulangan 'Israel' dan ambiguitas teologisnya dipertahankan.
