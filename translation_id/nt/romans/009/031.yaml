id: ROM.9.31
reference: Romans 9:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰσραὴλ δὲ διώκων νόμον δικαιοσύνης εἰς ⸀νόμον οὐκ ἔφθασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/031.yaml
  text: But Israel[a], pursuing a law of righteousness[b], did not attain to that law.
translation:
  language: id
  text: Namun, Israel, yang mengejar hukum kebenaran[a], tidak mencapai hukum itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “keadilan”: “hukum keadilan.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak sampai kepadanya” atau “tidak mencapai hukum.” Frasa Yunani ini padat dan sulit ditafsirkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Bentuk baku nama diri ini dalam bahasa Indonesia; dalam alur argumentasi Paulus, nama ini mengacu pada Israel sebagai umat/bangsa.
- source_word: δέ
  choice: Namun
  rationale: Menandai pertentangan dengan pernyataan sebelumnya mengenai bangsa-bangsa lain.
- source_word: διώκων
  choice: yang mengejar
  rationale: Mempertahankan gambaran tentang usaha aktif untuk mengejar atau mengupayakan sesuatu tanpa menambahkan nuansa konsesif yang tidak dinyatakan secara eksplisit.
- source_word: νόμον δικαιοσύνης
  choice: hukum kebenaran
  rationale: Mempertahankan susunan padat frasa Yunani dan membiarkan hubungan antara 'hukum' dan 'kebenaran' tetap terbuka, tanpa memperluasnya menjadi 'hukum yang menghasilkan kebenaran'.
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: Dalam konteks Paulus, 'kebenaran' merupakan padanan Indonesia yang lazim dan mencakup gagasan keadaan yang benar di hadapan Allah; kemungkinan makna 'keadilan' dicatat dalam catatan kaki.
- source_word: εἰς νόμον
  choice: hukum itu
  rationale: Pengulangan νόμον paling wajar dipahami secara resumtif sebagai hukum yang baru saja disebut, sambil menghindari tafsiran tambahan seperti 'tujuan hukum'.
- source_word: οὐκ ἔφθασεν
  choice: tidak mencapai
  rationale: Menyatakan kegagalan untuk sampai pada atau memperoleh sasaran yang dikejar dan sesuai dengan pemakaian ἔφθασεν bersama εἰς.
theological_decisions:
- issue: Makna δικαιοσύνη dalam konteks Paulus
  choice: kebenaran
  alternative: keadilan
  rationale: '''Kebenaran'' paling sesuai dengan pembahasan Paulus tentang status atau keadaan yang benar di hadapan Allah, tetapi ''keadilan'' tetap merupakan kemungkinan leksikal dan karena itu dipertahankan dalam catatan kaki.'
- issue: Hubungan antara hukum dan kebenaran dalam νόμον δικαιοσύνης
  choice: hukum kebenaran
  alternative: hukum yang menghasilkan atau menuju kepada kebenaran
  rationale: Terjemahan utama mempertahankan kepadatan dan ambiguitas bentuk genitif Yunani, alih-alih menentukan bahwa hukum tersebut menghasilkan atau menuntun kepada kebenaran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan kata “hukum” dipertahankan karena penting bagi struktur retoris ayat dan mencerminkan pengulangan νόμον dalam bahasa Yunani.
