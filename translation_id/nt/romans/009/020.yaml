  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂ὦ ἄνθρωπε, μενοῦνγε⸃ σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ; μὴ ἐρεῖ τὸ πλάσμα τῷ πλάσαντι Τί με ἐποίησας οὕτως;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/020.yaml
  text: But who are you[a], O man, to answer back to God? Will what is formed say to the one who formed it[d][c][b], “Why did you make me like this?”
translation:
  language: id
  text: Sebaliknya[a], hai manusia[b], siapakah kamu yang membantah Allah? Masakan sesuatu yang dibentuk berkata kepada pembentuknya, “Mengapa Engkau membuat aku seperti ini?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tetapi”; μενοῦνγε mengandung penegasan sekaligus koreksi terhadap keberatan sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Bentuk Yunaninya tunggal dan menyapa seorang manusia sebagai wakil umat manusia.
    reason: cultural_note
  - marker: c
    text: Secara lebih harfiah, “Mengapa Engkau membuat aku demikian?”
    reason: lexical_alternative
lexical_decisions:
- source_word: μενοῦνγε
  choice: Sebaliknya
  rationale: Partikel ini menegaskan sekaligus mengoreksi arah keberatan sebelumnya. “Sebaliknya” mempertahankan daya korektifnya; “tetapi” merupakan alternatif yang lebih ringan.
- source_word: ὦ ἄνθρωπε
  choice: hai manusia
  rationale: Bentuk vokatif tunggal ini menyapa seseorang sebagai wakil umat manusia. “Hai manusia” terdengar wajar dan bermartabat dalam bahasa Indonesia serta tidak membatasi sapaan itu hanya kepada laki-laki.
- source_word: σὺ τίς εἶ
  choice: siapakah kamu
  rationale: Ungkapan ini merupakan tantangan retoris terhadap kedudukan lawan bicara, bukan pertanyaan biasa mengenai identitasnya.
- source_word: ὁ ἀνταποκρινόμενος τῷ θεῷ
  choice: sehingga membantah Allah
  rationale: Kata kerja ini menyiratkan jawaban yang menentang atau menyanggah, bukan sekadar memberi tanggapan. Konstruksi “siapakah kamu sehingga…” alami dalam bahasa Indonesia dan mempertahankan teguran tajamnya.
- source_word: μὴ ἐρεῖ
  choice: Masakan ... berkata
  rationale: μή dengan bentuk mendatang memperkenalkan pertanyaan retoris yang mengharapkan jawaban negatif. “Masakan” menyampaikan harapan negatif itu secara alami.
- source_word: τὸ πλάσμα
  choice: sesuatu yang dibentuk
  rationale: πλάσμα menunjuk pada hasil bentukan. Pilihan ini mempertahankan perbedaan antara yang dibentuk dan pembentuk tanpa memaksakan bahan atau jenis benda tertentu.
- source_word: τῷ πλάσαντι
  choice: kepada pembentuknya
  rationale: Partisip ini menunjuk kepada pihak yang membentuk. “Pembentuknya” ringkas dan mempertahankan hubungan kata dengan “yang dibentuk”.
- source_word: Τί με ἐποίησας οὕτως;
  choice: Mengapa Engkau membuat aku seperti ini?
  rationale: Terjemahan ini alami dalam bahasa Indonesia modern dan mempertahankan pertanyaan langsung serta οὕτως, “seperti ini/demikian”.
theological_decisions:
- issue: Daya perwakilan ἄνθρωπε
  choice: Diterjemahkan “hai manusia” sebagai sapaan kepada seorang manusia yang mewakili umat manusia
  alternative: hai laki-laki
  rationale: Konteks menyoroti kedudukan manusia di hadapan Allah, bukan jenis kelamin orang yang disapa. Bahasa Indonesia “manusia” mempertahankan cakupan perwakilan itu.
- issue: Ketajaman teguran Paulus
  choice: ἀνταποκρινόμενος diterjemahkan “membantah”
  alternative: menjawab
  rationale: “Membantah” mempertahankan nuansa perlawanan dan ketidakpatutan dalam jawaban manusia kepada Allah, tanpa menambahkan klaim teologis di luar teks.
- issue: Jawaban negatif yang diharapkan dalam pertanyaan retoris
  choice: Dinyatakan dengan “Masakan”
  alternative: Apakah ... akan berkata
  rationale: Bentuk Yunani mengharapkan jawaban tidak. “Masakan” menyampaikan tekanan retoris tersebut secara jelas tanpa mengubah pertanyaan menjadi pernyataan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran yang tegas dan bermartabat. “Hai manusia” mempertahankan sapaan langsung; “Masakan” mengungkapkan pertanyaan retoris yang mengharapkan jawaban negatif. Huruf kapital pada “Engkau” mengikuti rujukan langsung kepada Allah.
