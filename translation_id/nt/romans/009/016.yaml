  yaml_path: translation/nt/romans/009/016.yaml
  text: So then[a], it does not depend on the one who wills or the one who runs[b], but on God who shows mercy.
translation:
  language: id
  text: Jadi, hal itu tidak bergantung pada orang yang berkehendak ataupun pada orang yang berlari[a], melainkan pada Allah yang menunjukkan belas kasihan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Berlari” kemungkinan merupakan kiasan untuk usaha atau ikhtiar manusia, tetapi kata Yunaninya secara harfiah berarti “berlari”.
    reason: cultural_note
  - marker: b
    text: 'Secara lebih harfiah: “Jadi, bukan dari orang yang berkehendak ataupun dari orang yang berlari, melainkan dari Allah yang menunjukkan belas kasihan.” Bahasa Yunani bersifat eliptis; “hal itu” dan “bergantung pada” dilengkapi berdasarkan konteks mengenai maksud dan belas kasih Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Jadi
  rationale: Gabungan partikel ini menarik kesimpulan dari uraian sebelumnya. “Jadi” menyampaikan daya inferensialnya secara alami dalam bahasa Indonesia modern.
- source_word: οὐ τοῦ θέλοντος οὐδὲ τοῦ τρέχοντος
  choice: tidak bergantung pada orang yang berkehendak ataupun pada orang yang berlari
  rationale: Bahasa Yunani berbentuk eliptis. “Tidak bergantung pada” melengkapi predikat secara idiomatis tanpa menentukan secara sempit apa yang dimaksud; kedua partisip substantival tetap dipertahankan, termasuk citra harfiah “berlari”.
- source_word: τοῦ θέλοντος
  choice: orang yang berkehendak
  rationale: Pilihan ini mempertahankan unsur kemauan atau kehendak dalam θέλω dan lebih dekat pada bentuk verbal sumber daripada sekadar “orang yang mempunyai keinginan”.
- source_word: οὐδὲ
  choice: ataupun
  rationale: Dalam konstruksi negatif bahasa Indonesia, “ataupun” secara alami menghubungkan unsur kedua sambil mempertahankan cakupan penyangkalan.
- source_word: τοῦ τρέχοντος
  choice: orang yang berlari
  rationale: τρέχω secara harfiah berarti “berlari”. Citra konkret dipertahankan, sementara kemungkinan makna kiasannya sebagai usaha atau ikhtiar dijelaskan dalam catatan kaki.
- source_word: ἀλλὰ τοῦ ἐλεῶντος θεοῦ
  choice: melainkan pada Allah yang berbelas kasihan
  rationale: “Melainkan” menyatakan kontras kuat setelah penyangkalan. Frasa partisipial menggambarkan Allah melalui tindakan belas kasih-Nya, bukan hanya sebagai sifat abstrak.
theological_decisions:
- issue: Subjek tersirat dan cakupan ketergantungan
  choice: Gunakan “hal itu tidak bergantung pada” tanpa menyebut secara eksplisit keselamatan, pemilihan, atau keputusan Allah.
  alternative: “Jadi, keselamatan tidak bergantung pada keinginan atau usaha manusia” atau “Jadi, pilihan Allah tidak bergantung pada orang yang berkehendak ataupun berlari.”
  rationale: Teks Yunani tidak menyatakan secara eksplisit subjek atau predikat yang menguasai frasa genitif ini. Konteks berbicara tentang maksud dan belas kasih Allah, tetapi menambahkan istilah khusus dalam teks utama akan mempersempit ambiguitas dan ketegangan teologis sumber.
- issue: Hubungan kehendak dan usaha manusia dengan belas kasih Allah
  choice: Pertahankan pertentangan langsung antara manusia yang berkehendak/berlari dan Allah yang berbelas kasihan.
  alternative: Memparafrasakan ayat sebagai penolakan mutlak terhadap semua peran tanggapan manusia atau sebagai pernyataan yang hanya menyangkut usaha memperoleh keselamatan.
  rationale: Ayat menekankan belas kasih Allah sebagai dasar penentu, tetapi tidak menjabarkan dalam kalimat ini seluruh hubungan antara tindakan ilahi dan tanggapan manusia. Terjemahan tidak boleh menyelesaikan persoalan itu melampaui bunyi teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “orang yang berkehendak” sengaja agak formal untuk menjaga nuansa volisional sumber; “orang yang berlari” mempertahankan metafora Paulus. Kedua penanda catatan kaki muncul dalam teks utama.
