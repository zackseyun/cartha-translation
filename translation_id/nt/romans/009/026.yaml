  text: καὶ ἔσται ἐν τῷ τόπῳ οὗ ἐρρέθη ⸀αὐτοῖς· Οὐ λαός μου ὑμεῖς, ἐκεῖ κληθήσονται υἱοὶ θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/026.yaml
  text: And in the very place where it was said to them[b][a], ‘You are not my people,’ there they will be called sons of the living God.
translation:
  language: id
  text: Dan di tempat di mana dikatakan kepada mereka, “Kamu bukan umat-Ku,”[a] di sana mereka akan disebut anak-anak Allah yang hidup.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kutipan atau alusi dari Hosea 1:10 (2:1 dalam Septuaginta), dengan bahasa pemulihan perjanjian.
    reason: cross_reference
  - marker: b
    text: 'Secara harfiah: “putra-putra Allah yang hidup.” Kata Yunani yang dipakai berarti “putra-putra” dan dapat membawa gema status serta warisan sebagai putra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Kata penghubung sederhana yang mempertahankan hubungan kutipan ini dengan pernyataan sebelumnya tanpa menambahkan makna kesimpulan.
- source_word: ἔσται ἐν τῷ τόπῳ οὗ
  choice: di tempat yang sama, di mana
  rationale: Ungkapan ini menyatakan bahwa pembalikan status terjadi di tempat yang sama; susunan Indonesia ini alami dan mempertahankan penekanan kontekstual.
- source_word: ἐρρέθη αὐτοῖς
  choice: pernah dikatakan kepada mereka
  rationale: Mempertahankan bentuk pasif dan tidak menyebut pelaku yang hanya tersirat; 'pernah' secara wajar menunjukkan tindakan lampau dari aoristus.
- source_word: Οὐ λαός μου ὑμεῖς
  choice: Kamu bukan umat-Ku
  rationale: '''Umat-Ku'' mempertahankan rumusan identitas perjanjian dari Hosea; ''kamu'' dapat menyapa kelompok tanpa membatasi gender.'
- source_word: ἐκεῖ
  choice: di sana
  rationale: Menandai secara tegas bahwa pemulihan terjadi tepat di tempat penolakan sebelumnya dinyatakan.
- source_word: κληθήσονται
  choice: akan disebut
  rationale: Mempertahankan bentuk pasif masa depan dan membiarkan pelaku ilahi tetap tersirat seperti dalam bahasa Yunani.
- source_word: υἱοὶ
  choice: anak-anak
  rationale: Dalam kutipan Hosea ini, bentuk jamak maskulin menunjuk anggota umat Allah secara representatif. 'Anak-anak' menyampaikan cakupan referennya secara alami dalam bahasa Indonesia, sementara arti harfiah 'putra-putra' dicatat dalam catatan kaki.
- source_word: θεοῦ ζῶντος
  choice: Allah yang hidup
  rationale: Padanan baku dan alami yang mempertahankan kontras teologis antara Allah yang hidup dan berhala.
theological_decisions:
- issue: Penerjemahan υἱοὶ sebagai jamak representatif
  choice: anak-anak
  alternative: putra-putra
  rationale: Walaupun bentuk leksikal Yunani berarti 'putra-putra', dalam konteks pemulihan umat Allah referennya mencakup umat secara keseluruhan. Bahasa Indonesia memakai 'anak-anak' secara alami untuk cakupan ini; catatan kaki mempertahankan bentuk sumber dan kemungkinan gema status serta warisan sebagai putra.
- issue: Identitas perjanjian dalam λαός μου
  choice: umat-Ku
  alternative: bangsa-Ku
  rationale: '''Umat-Ku'' merupakan rumusan perjanjian yang wajar dan mempertahankan gema Hosea tanpa mempersempitnya menjadi identitas etnis atau politis.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur pengulangan 'di tempat ... di sana' dipertahankan untuk menonjolkan pembalikan status. Kapitalisasi pada 'umat-Ku' mengikuti sapaan ilahi dalam kutipan.
