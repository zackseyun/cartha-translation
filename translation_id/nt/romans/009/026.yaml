  source_fidelity: 'Draf ini pada umumnya setia pada teks Yunani: bentuk pasif masa depan dalam “akan disebut,” formula perjanjian “umat-Ku,” serta “Allah yang hidup” dipertahankan dengan baik. Namun, “tempat yang sama” menambahkan unsur eksplisit “yang sama” yang tidak terdapat dalam ἐν τῷ τόπῳ οὗ. Penegasan hubungan tempat itu sudah cukup dinyatakan oleh pasangan “di tempat ... di sana.” Kata “pernah” juga menambahkan nuansa pengalaman masa lampau yang tidak perlu untuk aoristus pasif.'
  naturalness: Bahasa draf baku, jelas, dan bernada khidmat. Susunan “di tempat ... di sana” alami dan secara efektif mempertahankan pembalikan yang ditekankan dalam kutipan. Penghapusan “yang sama” dan “pernah” membuat kalimat lebih dekat dengan sumber tanpa mengurangi kelancaran.
  terminology: “Umat-Ku” tepat untuk λαός μου dalam konteks perjanjian. “Anak-anak Allah yang hidup” adalah padanan Indonesia yang alami bagi υἱοὶ θεοῦ ζῶντος; catatan kaki dengan tepat memberitahukan bahwa kata Yunani secara leksikal adalah bentuk maskulin “putra-putra,” tanpa memaksakan implikasi doktrinal tertentu. Rujukan Hosea 1:10 (2:1 LXX) tepat.
