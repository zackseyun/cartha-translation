source:
  edition: SBLGNT
  text: ἐπαγγελίας γὰρ ὁ λόγος οὗτος· Κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/009.yaml
  text: 'For this is the word of promise: “At this time I will come[a], and Sarah will have a son.”'
translation:
  language: id
  text: 'Sebab, inilah firman janji itu: “Pada waktu yang telah ditentukan Aku akan datang[a], dan Sara akan memiliki seorang anak laki-laki.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku akan kembali.” Teks Yunani di sini berbunyi “Aku akan datang,” meskipun sejumlah terjemahan memakai “kembali” sesuai dengan latar belakang kutipan ini dalam Kitab Kejadian.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: janji
  rationale: Genitif ini menerangkan λόγος; frasa “perkataan janji” mempertahankan kaitan langsung dengan janji ilahi tanpa menambahkan artikel yang tidak dinyatakan dalam teks Yunani.
- source_word: λόγος
  choice: perkataan
  rationale: Di sini λόγος menunjuk pada ucapan yang langsung dikutip; “perkataan” alami dalam bahasa Indonesia dan tidak memperluasnya menjadi “pesan”.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai bahwa ayat ini menjelaskan pernyataan sebelumnya dan mempertahankan hubungan argumentatif Paulus.
- source_word: Κατὰ τὸν καιρὸν τοῦτον
  choice: Pada waktu ini
  rationale: Mengungkapkan waktu penggenapan yang ditentukan sambil tetap dekat dengan susunan Yunani dan gema janji dalam Kejadian.
- source_word: ἐλεύσομαι
  choice: Aku akan datang
  rationale: Bentuk ἔρχομαι dalam teks Roma secara langsung berarti “datang”; pilihan ini mengutamakan teks Yunani yang sedang diterjemahkan.
- source_word: ἔσται τῇ Σάρρᾳ υἱός
  choice: Sara akan mempunyai seorang anak laki-laki
  rationale: Konstruksi datif kepemilikan secara alami dinyatakan dengan “mempunyai” dalam bahasa Indonesia; υἱός secara khusus berarti anak laki-laki.
- source_word: Σάρρᾳ
  choice: Sara
  rationale: Mengikuti bentuk baku nama tokoh Alkitab dalam bahasa Indonesia.
- source_word: υἱός
  choice: anak laki-laki
  rationale: Mempertahankan makna spesifik “son” dan relevansinya dalam janji kepada Abraham dan Sara.
theological_decisions:
- issue: Kutipan janji kepada Abraham dan tindakan ilahi
  choice: 'Menampilkan janji itu sebagai ucapan langsung Allah: “Aku akan datang.”'
  alternative: “Aku akan kembali,” mengikuti sebagian terjemahan latar Kejadian.
  rationale: Argumen Paulus bertumpu pada janji Allah sebagai dasar kelahiran Ishak. Terjemahan mempertahankan daya teologis itu sambil mengutamakan kata kerja Yunani yang benar-benar terdapat dalam Roma, tanpa menyelaraskannya secara diam-diam dengan tradisi terjemahan lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Perkataan janji” dipilih untuk menjaga hubungan formal antara λόγος dan ἐπαγγελίας, sedangkan konstruksi kepemilikan Yunani dibuat alami sebagai “Sara akan mempunyai seorang anak laki-laki.”
