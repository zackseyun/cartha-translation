  yaml_path: translation/nt/romans/009/013.yaml
  text: 'as it is written: “Jacob I loved[b][a], but Esau I hated.”'
translation:
  language: id
  text: 'seperti yang telah tertulis: “Aku mengasihi Yakub,[a] tetapi membenci Esau.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kutipan dari Maleakhi 1:2–3. Ungkapan “membenci” juga dipahami sebagian orang sebagai “menolak” dalam hubungan perjanjian atau “kurang mengasihi,” bukan sebagai kebencian emosional.
    reason: cross_reference dan lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: seperti
  rationale: Memperkenalkan kutipan Kitab Suci dengan perbandingan yang alami dan ringkas dalam bahasa Indonesia.
- source_word: γέγραπται
  choice: telah tertulis
  rationale: Bentuk perfektum pasif ini merupakan rumusan kutipan yang menunjukkan bahwa tulisan itu tetap berlaku; ‘telah tertulis’ alami dan mempertahankan nuansa tersebut.
- source_word: Ἰακώβ
  choice: Yakub
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: ἠγάπησα
  choice: Aku mengasihi
  rationale: Menerjemahkan langsung verba ἀγαπάω dalam bentuk lampau kutipan; konteks dan rumusan ‘telah tertulis’ sudah menempatkan pernyataan itu sebagai tindakan yang dinyatakan sebelumnya.
- source_word: δὲ
  choice: tetapi
  rationale: Menampilkan pertentangan yang jelas antara perlakuan terhadap Yakub dan terhadap Esau.
- source_word: Ἠσαῦ
  choice: Esau
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: ἐμίσησα
  choice: membenci
  rationale: Mempertahankan arti leksikal langsung μισέω dan ketegangan teologis teks, tanpa melunakkannya secara interpretatif.
theological_decisions:
- issue: Apakah ‘membenci’ perlu dilunakkan karena perdebatan tentang pemilihan ilahi dan idiom perbandingan
  choice: Mempertahankan ‘membenci’ dalam teks utama
  alternative: ‘menolak’ atau ‘kurang mengasihi’
  rationale: Bahasa Yunani mengutip verba kuat μισέω. Terjemahan utama sebaiknya mempertahankan kekuatan dan ketegangan teologisnya, sedangkan kemungkinan nuansa penolakan perjanjian atau perbandingan dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Susunan klausa mempertahankan kontras retoris kutipan. Penanda catatan kaki ditempatkan setelah nama Yakub agar satu catatan dapat mengidentifikasi sumber kutipan sekaligus menerangkan ungkapan ‘membenci’.
