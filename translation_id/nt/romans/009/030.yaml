id: ROM.9.30
reference: Romans 9:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὅτι ἔθνη τὰ μὴ διώκοντα δικαιοσύνην κατέλαβεν δικαιοσύνην, δικαιοσύνην δὲ τὴν ἐκ πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/030.yaml
  text: What then shall we say? That the Gentiles, who were not pursuing righteousness, attained righteousness—but the righteousness that is from faith.
translation:
  language: id
  text: Jadi, apakah yang akan kita katakan? Bangsa-bangsa bukan Yahudi[a], yang tidak mengejar kebenaran[b], telah memperoleh kebenaran, yaitu kebenaran yang berasal dari iman[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “bangsa-bangsa.” Dalam konteks ini yang dimaksud ialah bangsa-bangsa bukan Yahudi.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “kebenaran” juga dapat mencakup arti “keadilan” atau keadaan benar; demikian pula pada kemunculan berikutnya dalam ayat ini.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “kebenaran yang datang melalui iman”; kemungkinan lain, meskipun kurang kuat dalam konteks ini, ialah “kebenaran yang berasal dari kesetiaan.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Jadi, apakah yang akan kita katakan?
  rationale: Mempertahankan fungsi formula peralihan Paulus dan nuansa deliberatif bentuk futurum, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: ἔθνη
  choice: bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks kontras dengan Israel, istilah ini menunjuk kepada bangsa-bangsa non-Yahudi. Ungkapan ini lebih mudah dipahami pembaca umum daripada istilah serapan 'orang-orang non-Yahudi' dan lebih jelas daripada sekadar 'bangsa-bangsa'.
- source_word: τὰ μὴ διώκοντα
  choice: yang tidak mengejar
  rationale: Partisipel kini menggambarkan tindakan atau sikap yang berlangsung/menjadi ciri. Bentuk Indonesia ini tetap dapat menyampaikan sikap yang sedang atau terus dilakukan tanpa menjadi kaku.
- source_word: δικαιοσύνην
  choice: kebenaran
  rationale: Dalam penggunaan teologis Paulus, 'kebenaran' merupakan padanan Indonesia yang mapan dan cukup luas untuk mencakup keadaan benar, kelurusan, serta dimensi hukum dan relasional, tanpa mempersempitnya menjadi satu rumusan doktrinal.
- source_word: κατέλαβεν
  choice: telah memperoleh
  rationale: Dalam konteks ini verba tersebut berarti berhasil mencapai atau mendapatkan sesuatu yang sebelumnya tidak dikejar. 'Memperoleh' alami dalam bahasa Indonesia dan tidak menimbulkan gambaran fisik seperti 'menangkap'.
- source_word: δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: kebenaran, yaitu kebenaran yang berasal dari iman
  rationale: Pengulangan nomina bersama artikel dan frasa preposisional menjelaskan jenis kebenaran yang dimaksud. 'Yaitu' menyampaikan fungsi penjelas δέ dalam konteks ini, sedangkan 'berasal dari' mempertahankan arah dasar ἐκ tanpa menambahkan rumusan doktrinal yang tidak terdapat dalam teks.
- source_word: πίστεως
  choice: iman
  rationale: Dalam konstruksi ini πίστις paling wajar menunjuk pada iman atau kepercayaan. Padanan 'iman' mempertahankan istilah teologis yang umum, sementara kemungkinan 'kesetiaan' dicatat tanpa dimasukkan ke teks utama.
theological_decisions:
- issue: Makna δικαιοσύνη dalam argumen Paulus
  choice: kebenaran
  alternative: keadilan; status benar di hadapan Allah; kedudukan sebagai umat perjanjian
  rationale: Ayat ini tidak menguraikan seluruh mekanisme doktrinal kebenaran tersebut. 'Kebenaran' mempertahankan keluasan istilah Paulus dan tidak membatasinya hanya pada salah satu penafsiran teologis.
- issue: Hubungan klausa δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: yaitu kebenaran yang berasal dari iman
  alternative: tetapi kebenaran yang berasal dari iman
  rationale: Di sini frasa berartikel terutama mengkhususkan atau menjelaskan kebenaran yang diperoleh, bukan mempertentangkan dua macam hasil. 'Yaitu' membuat hubungan penjelas itu jelas, sambil tetap mempertahankan pengulangan retoris kata 'kebenaran'.
- issue: Arti ἐκ πίστεως
  choice: berasal dari iman
  alternative: melalui iman; berdasarkan iman; berasal dari kesetiaan
  rationale: Terjemahan ini menjaga citra sumber yang dibawa ἐκ dan menghindari tambahan seperti 'hanya oleh iman' yang tidak tertulis dalam ayat. Kemungkinan semantis 'kesetiaan' tetap diakui dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Istilah 'bangsa-bangsa bukan Yahudi' dipilih agar jelas bagi pembaca umum. Pengulangan 'kebenaran' dipertahankan untuk mencerminkan penekanan teks Yunani, dan 'yaitu' dipakai agar hubungan penjelas antarklausa terdengar alami.
