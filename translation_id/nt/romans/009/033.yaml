  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ἰδοὺ τίθημι ἐν Σιὼν λίθον προσκόμματος καὶ πέτραν σκανδάλου, ⸀καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/033.yaml
  text: As it is written[a], “Look, I am laying in Zion a stone of stumbling and a rock of offense[d][c][b], and the one who believes in him will not be put to shame.”
translation:
  language: id
  text: Seperti yang tertulis, “Lihatlah, Aku meletakkan di Sion sebuah batu yang membuat orang tersandung dan sebuah batu karang yang menyebabkan orang jatuh[a]. Orang yang percaya kepadanya[b] tidak akan dipermalukan[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Di sini Paulus menggabungkan Yesaya 8:14 dan Yesaya 28:16.
    reason: cross_reference
  - marker: b
    text: 'Yunani: “atasnya.” Kata ganti ini dapat merujuk kepada batu dalam gambaran tersebut; dalam konteks Paulus, gambaran itu diterapkan kepada Mesias.'
    reason: lexical_alternative
  - marker: c
    text: Atau “tidak akan dikecewakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: Seperti ada tertulis
  rationale: Ungkapan baku untuk memperkenalkan kutipan Kitab Suci; mempertahankan sifat formula Yunani dengan bahasa Indonesia yang wajar dan khidmat.
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan daya penunjuk dan penarik perhatian tanpa memakai ungkapan arkais.
- source_word: τίθημι
  choice: Aku meletakkan
  rationale: Mempertahankan kala kini dalam kutipan dan sesuai dengan gambaran menempatkan batu.
- source_word: ἐν Σιὼν
  choice: di Sion
  rationale: Menyampaikan makna lokatif alami dari ἐν dalam bahasa Indonesia.
- source_word: λίθον προσκόμματος
  choice: sebuah batu yang membuat orang tersandung
  rationale: Mengungkapkan hubungan genitif secara jelas dan alami serta mempertahankan gambaran batu sebagai penyebab tersandung.
- source_word: πέτραν σκανδάλου
  choice: sebuah batu karang yang menyebabkan orang jatuh
  rationale: Membedakan πέτρα dari λίθος dan menyampaikan σκανδάλου sebagai penyebab kejatuhan, tanpa membatasi maknanya hanya pada rasa tersinggung.
- source_word: ὁ πιστεύων
  choice: orang yang percaya
  rationale: Mewakili partisip substantival tunggal secara alami dan tanpa penandaan gender yang tidak perlu.
- source_word: ἐπ’ αὐτῷ
  choice: kepada-Nya
  rationale: Dalam bahasa Indonesia, 'percaya kepada' merupakan padanan idiomatis untuk kepercayaan yang diarahkan kepada seseorang; huruf kapital menunjukkan referen personal dalam konteks penerapan mesianik Paulus.
- source_word: καταισχυνθήσεται
  choice: tidak akan dipermalukan
  rationale: Mempertahankan bentuk pasif masa depan dan nuansa malu atau aib di hadapan umum.
theological_decisions:
- issue: Referen αὐτῷ dalam kutipan gabungan dari Yesaya
  choice: kepada-Nya
  alternative: kepadanya atau kepada batu itu
  rationale: Secara gramatikal, kata ganti itu merujuk kembali kepada gambaran batu; dalam konteks Roma 9:32–33 dan 10:11, Paulus menerapkan gambaran tersebut secara personal kepada Mesias. Terjemahan personal mempertahankan penerapan kontekstual itu, sedangkan catatan kaki mengakui bentuk harfiah dan gambaran bendanya.
- issue: Hubungan kedua gambaran batu dengan kutipan Yesaya
  choice: Mempertahankan kedua gambaran secara sejajar tanpa menjelaskan identitasnya di dalam teks
  alternative: Menambahkan 'Mesias' atau 'Kristus' ke dalam teks utama
  rationale: Konteks Paulus mendukung penerapan mesianik, tetapi kata 'Mesias' tidak terdapat dalam ayat ini. Identifikasi itu tidak disisipkan ke dalam teks terjemahan.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan khidmat. Struktur kutipan dipertahankan, sementara ungkapan metaforis dibuat mudah dipahami tanpa menghapus gambaran batu, sandungan, kejatuhan, dan rasa malu.
