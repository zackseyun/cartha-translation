id: ROM.9.29
reference: Romans 9:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ καθὼς προείρηκεν Ἠσαΐας· Εἰ μὴ κύριος Σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν καὶ ὡς Γόμορρα ἂν ὡμοιώθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/029.yaml
  text: And just as Isaiah said before[a], “If the Lord of Hosts had not left us offspring[c][b], we would have become like Sodom and been made like Gomorrah.”
translation:
  language: id
  text: Dan sebagaimana Yesaya telah mengatakan sebelumnya, “Seandainya Tuhan Semesta Alam[a] tidak meninggalkan keturunan bagi kita[b], kita tentu sudah menjadi seperti Sodom dan dibuat menyerupai Gomora.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuhan Sabaot” atau “Tuhan Bala Tentara.” Kata Yunani Σαβαώθ merupakan transliterasi gelar ilahi dalam bahasa Ibrani.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “benih”; di sini berarti keturunan yang masih tersisa.
    reason: lexical_alternative
  - marker: c
    text: Kutipan dari Yesaya 1:9.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ καθὼς
  choice: Dan seperti
  rationale: Menghubungkan kutipan ini dengan uraian sebelumnya sekaligus mempertahankan daya pembanding καθὼς dalam bahasa Indonesia yang alami.
- source_word: προείρηκεν
  choice: telah dikatakan ... sebelumnya
  rationale: Bentuk perfek menyatakan perkataan terdahulu yang tetap relevan; ungkapan ini mempertahankan unsur waktu tanpa menafsirkannya sebagai ramalan.
- source_word: κύριος Σαβαὼθ
  choice: Tuhan Semesta Alam
  rationale: Σαβαώθ adalah transliterasi gelar Ibrani yang menunjuk pada bala tentara atau segala pasukan; padanan Indonesia yang mapan dan bermartabat ini menyampaikan gelar ilahi tersebut.
- source_word: ἐγκατέλιπεν ἡμῖν
  choice: meninggalkan ... bagi kita
  rationale: Mempertahankan arti dasar ‘meninggalkan/menyisakan bagi kita’ dan tidak mempersempitnya menjadi tindakan ‘memelihara’.
- source_word: σπέρμα
  choice: keturunan
  rationale: Secara harfiah berarti ‘benih’, tetapi di sini menunjuk pada keturunan yang tetap hidup; ‘keturunan’ jelas tanpa menggantinya dengan istilah teologis ‘sisa’.
- source_word: Εἰ μὴ ... ἂν
  choice: Seandainya ... tidak ... tentu sudah
  rationale: Menyatakan kondisi berlawanan dengan kenyataan pada masa lampau secara alami dalam bahasa Indonesia.
- source_word: ὡς Σόδομα ἂν ἐγενήθημεν
  choice: kita tentu sudah menjadi seperti Sodom
  rationale: ‘Menjadi’ mempertahankan nilai γίνομαι, sementara ‘seperti’ menyampaikan perbandingan ὡς.
- source_word: ὡς Γόμορρα ἂν ὡμοιώθημεν
  choice: dan dibuat menyerupai Gomora
  rationale: Bentuk pasif mempertahankan perbedaan verba ὁμοιόω dari γίνομαι dalam klausa sebelumnya.
theological_decisions:
- issue: Penerjemahan gelar ilahi κύριος Σαβαὼθ dalam kutipan Perjanjian Lama
  choice: Tuhan Semesta Alam
  alternative: Tuhan Sabaot; Tuhan Bala Tentara
  rationale: Teks Yunani memakai κύριος dan transliterasi gelar Ibrani. Menerjemahkan gelarnya menyampaikan makna, sedangkan catatan kaki mempertahankan bentuk serta alternatif leksikalnya.
- issue: Apakah σπέρμα harus diterjemahkan dengan istilah teologis ‘sisa’
  choice: keturunan
  alternative: benih; sisa
  rationale: Konteks memang berbicara tentang umat yang tersisa, tetapi kata yang dipakai adalah σπέρμα. ‘Keturunan’ mempertahankan rujukan leksikal tanpa memasukkan istilah teologis yang tidak dinyatakan langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kondisi dibuat alami tanpa menghilangkan sifat berlawanan dengan kenyataan; dua verba hasil diterjemahkan secara berbeda untuk mempertahankan variasi Yunani.
