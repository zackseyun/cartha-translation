id: ROM.9.8
reference: Romans 9:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦτ’ ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ, ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/008.yaml
  text: That is[a], it is not the children of the flesh who are the children of God[b], but the children of the promise are counted as offspring.
translation:
  language: id
  text: Artinya, bukan anak-anak menurut daging[a] yang merupakan anak-anak Allah, melainkan anak-anak berdasarkan janji yang diperhitungkan sebagai keturunan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “anak-anak menurut keturunan jasmani.” Secara harfiah: “anak-anak daging.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “diperhitungkan sebagai benih.” Di sini kata Yunani sperma berarti keturunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτ’ ἔστιν
  choice: Artinya
  rationale: Ungkapan ini memperkenalkan penjelasan Paulus atas pernyataan sebelumnya. “Artinya” alami dalam bahasa Indonesia dan mempertahankan fungsi penjelasannya.
- source_word: τέκνα
  choice: anak-anak
  rationale: Bentuk jamak ini mencakup laki-laki dan perempuan serta menunjuk kepada anak atau keturunan. Pilihan yang sama dipertahankan pada ketiga kemunculannya untuk menjaga kesejajaran retoris.
- source_word: τὰ τέκνα τῆς σαρκὸς
  choice: anak-anak menurut daging
  rationale: Terjemahan ini mempertahankan istilah khas Paulus dan kontras harfiahnya dengan “anak-anak berdasarkan janji”; dalam konteks ini, “daging” menunjuk pada garis keturunan jasmani, bukan terutama pada kebobrokan moral.
- source_word: τέκνα τοῦ θεοῦ
  choice: anak-anak Allah
  rationale: Bentuk ini alami dan jelas dalam bahasa Indonesia serta mempertahankan hubungan genitif dengan Allah.
- source_word: τὰ τέκνα τῆς ἐπαγγελίας
  choice: anak-anak berdasarkan janji
  rationale: Ungkapan ini menyampaikan bahwa status mereka ditentukan oleh janji Allah tanpa menambahkan gagasan yang tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: λογίζεται
  choice: diperhitungkan
  rationale: Bentuk pasif ini mempertahankan gagasan penetapan atau pengakuan sebagai anggota keturunan, tanpa menyebut pelaku yang hanya tersirat.
- source_word: εἰς σπέρμα
  choice: sebagai keturunan
  rationale: Dalam konteks Abraham, σπέρμα berarti keturunan. “Sebagai” menyampaikan fungsi εἰς sebagai hasil atau penggolongan dengan jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Kontras antara keturunan jasmani dan anak-anak yang ditentukan oleh janji Allah
  choice: Ayat diterjemahkan sebagai pembedaan antara “anak-anak menurut daging” dan “anak-anak berdasarkan janji” yang diperhitungkan sebagai keturunan.
  alternative: Memperjelas ayat secara khusus sebagai pernyataan tentang Israel secara korporat saja, atau sebagai pernyataan eksplisit tentang predestinasi individu.
  rationale: Teks Yunani menyatakan kontras tersebut tetapi tidak menyelesaikan seluruh perdebatan teologis yang lebih luas dalam Roma 9. Terjemahan mempertahankan ketegangan itu tanpa memasukkan kerangka denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang bermartabat dan mudah dipahami. Istilah “daging” dipertahankan untuk mencerminkan kontras Paulus, lalu dijelaskan dalam catatan kaki; susunan kalimat dibuat alami tanpa menghapus kesejajaran teologis teks.
source_grounding:
  english_pob_role: consult_only
