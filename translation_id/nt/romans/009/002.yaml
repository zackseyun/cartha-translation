lexical_decisions:
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi pernyataan sungguh-sungguh Paulus pada ayat sebelumnya; dalam konteks ini, fungsi deklaratif lebih kuat daripada fungsi kausal “karena”.
- source_word: λύπη
  choice: dukacita
  rationale: Menyatakan kesedihan yang mendalam. “Dukacita” alami, berbobot, dan sesuai dengan ragam bahasa Alkitab modern tanpa terasa usang.
- source_word: μοί ἐστιν
  choice: aku diliputi
  rationale: Konstruksi datif dengan εἰμί menyatakan keadaan yang dialami Paulus. “Aku diliputi” mengungkapkan pengalaman batin secara alami dalam bahasa Indonesia dan selaras dengan intensitas kedua nomina.
- source_word: μεγάλη
  choice: yang besar
  rationale: Mempertahankan intensifikasi langsung terhadap λύπη tanpa menambahkan tafsiran.
- source_word: καὶ
  choice: dan
  rationale: Mempertahankan koordinasi sederhana antara kedua ungkapan penderitaan batin.
- source_word: ἀδιάλειπτος
  choice: yang tiada henti
  rationale: Menyampaikan keberlangsungan tanpa jeda dengan ungkapan Indonesia yang alami dan kuat.
- source_word: ὀδύνη
  choice: kepedihan
  rationale: Mengacu pada penderitaan batin yang berat. “Kepedihan” mempertahankan unsur rasa sakit emosional; “penderitaan batin” merupakan alternatif yang lebih eksplisit.
- source_word: τῇ καρδίᾳ μου
  choice: dalam hatiku
  rationale: Mempertahankan idiom konkret “hati” sebagai pusat kehidupan batin, sambil menerjemahkan datif Yunani secara idiomatis ke dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada khidmat dan alami. Susunan kalimat mempertahankan hubungan dengan pernyataan pada ayat sebelumnya. Idiom “dalam hatiku” dipertahankan karena sudah alami dalam bahasa Indonesia; bentuk Yunani harfiahnya memakai datif, “bagi hatiku,” yang tidak alami bila diterjemahkan secara mekanis.
