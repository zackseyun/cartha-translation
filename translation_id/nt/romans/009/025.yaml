id: ROM.9.25
reference: Romans 9:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν τῷ Ὡσηὲ λέγει· Καλέσω τὸν οὐ λαόν μου λαόν μου καὶ τὴν οὐκ ἠγαπημένην ἠγαπημένην·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/025.yaml
  text: as he also says in Hosea[a], “I will call those who were not my people, ‘my people,’ and her who was not loved[c][b], ‘loved.’”
translation:
  language: id
  text: Seperti yang juga dikatakan-Nya dalam kitab Hosea[a], “Yang bukan umat-Ku akan Kusebut ‘umat-Ku’, dan perempuan yang tidak dikasihi akan Kusebut ‘yang dikasihi’.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Seperti yang juga dikatakan-Nya dalam Hosea.” Ungkapan ini menunjuk pada kitab Hosea.
    reason: lexical_alternative
  - marker: b
    text: Kutipan ini berasal dari Hosea 2:23. Penomoran ayat dalam Septuaginta dan dalam beberapa tradisi dapat berbeda. Paulus memakai bahasa pemulihan dalam Hosea untuk berbicara tentang Allah yang memanggil suatu umat menjadi milik-Nya.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς καὶ
  choice: Seperti yang juga
  rationale: Mengantar kutipan Kitab Suci sebagai peneguhan bagi uraian sebelumnya dan mempertahankan daya komparatif serta aditif ungkapan Yunani.
- source_word: ἐν τῷ Ὡσηὲ
  choice: dalam kitab Hosea
  rationale: Rumus kutipan ini menunjuk pada tulisan Hosea; penambahan 'kitab' membuat maksudnya jelas dan wajar dalam bahasa Indonesia.
- source_word: λέγει
  choice: dikatakan-Nya
  rationale: Bentuk ini mempertahankan Allah sebagai pembicara tersirat tanpa menambahkan nama-Nya ke dalam teks; kapital pada enklitik -Nya menandai rujukan kepada Allah.
- source_word: Καλέσω
  choice: akan Kusebut
  rationale: Menyampaikan tindakan menamai atau menetapkan identitas, sekaligus mempertahankan bentuk orang pertama dan kala mendatang.
- source_word: τὸν οὐ λαόν μου
  choice: Yang bukan umat-Ku
  rationale: Bahasa Indonesia dapat mempertahankan bentuk tunggal-kolektif Yunani secara alami melalui 'yang', sementara 'umat' tetap memiliki arti kolektif.
- source_word: λαόν μου
  choice: umat-Ku
  rationale: Ungkapan perjanjian yang baku dan alami untuk menyatakan suatu umat sebagai milik Allah.
- source_word: τὴν οὐκ ἠγαπημένην
  choice: perempuan yang tidak dikasihi
  rationale: Mempertahankan bentuk feminin tunggal dari teks Yunani dan latar personifikasi dalam Hosea, tanpa mengubahnya menjadi bentuk jamak atau netral.
- source_word: ἠγαπημένην
  choice: yang dikasihi
  rationale: Mencerminkan bentuk pasif dari keluarga kata ἀγαπάω dan menjaga kesejajaran dengan 'tidak dikasihi'.
theological_decisions:
- issue: Daya kolektif atau individual dalam kutipan Hosea
  choice: Mempertahankan ungkapan pertama sebagai tunggal-kolektif, 'Yang bukan umat-Ku', dan menampilkan bentuk feminin pada ungkapan kedua, 'perempuan yang tidak dikasihi'.
  alternative: Membuat ungkapan pertama eksplisit jamak, 'mereka yang bukan umat-Ku', atau meratakan kedua ungkapan menjadi bentuk netral, 'yang tidak dikasihi'.
  rationale: '''Umat'' sudah bersifat kolektif dalam bahasa Indonesia sehingga tidak perlu dijamakkan. Penyebutan ''perempuan'' menampakkan bentuk feminin Yunani dan hubungan dengan gambaran Hosea tanpa menentukan lebih jauh identitas teologisnya.'
- issue: Identitas pembicara dalam rumus kutipan
  choice: Menggunakan 'dikatakan-Nya' untuk menyatakan Allah sebagai pembicara tersirat.
  alternative: Menggunakan bentuk lebih impersonal, 'dikatakan dalam kitab Hosea', atau menjadikan Hosea subjek, 'Hosea berkata'.
  rationale: Kata kerja Yunani berbentuk orang ketiga tunggal dan kutipannya sendiri memakai orang pertama ilahi. Terjemahan ini menjaga gaya personal Kitab Suci tanpa secara keliru menjadikan Hosea pembicara utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kutipan dibuat alami tanpa menghilangkan bentuk kolektif 'umat' atau bentuk feminin pada klausa kedua. Pengulangan 'akan Kusebut' pada klausa kedua ditambahkan secara eliptis agar paralelisme dan maksud kalimat jelas dalam bahasa Indonesia.
