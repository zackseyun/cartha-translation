  text: For the Lord will carry out his word on the earth[c][b][a], finishing it and cutting it short.
translation:
  language: id
  text: Sebab Tuhan akan melaksanakan firman-Nya di atas bumi[a], menuntaskannya dan mempersingkatnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di negeri itu”. Ungkapan ini dapat dipahami demikian menurut konteks asli Yesaya, tetapi teks Yunani Surat Roma secara lebih langsung berbunyi “di atas bumi”.
    reason: cross_reference
  - marker: b
    text: “Mempersingkatnya” juga dapat dipahami sebagai “memendekkannya” atau, sebagai implikasi, “melaksanakannya dengan segera”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  choice: firman-Nya
  rationale: Dalam kutipan Yesaya ini, λόγον menunjuk pada apa yang telah Tuhan nyatakan dan kemudian dilaksanakan-Nya. “Firman-Nya” mempertahankan unsur perkataan atau pernyataan, sedangkan akhiran “-Nya” wajar dipahami dari subjek “Tuhan”.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memberi dasar penjelasan bagi pernyataan sebelumnya; “sebab” sesuai dengan alur argumentasi Paulus.
- source_word: συντελῶν
  choice: menuntaskannya
  rationale: Partisipel ini menyatakan tindakan membawa sesuatu sampai selesai. “Menuntaskannya” alami dalam bahasa Indonesia dan mempertahankan gagasan penyelesaian penuh.
- source_word: καὶ συντέμνων
  choice: dan mempersingkatnya
  rationale: συντέμνω secara harfiah dapat berarti memendekkan atau mempersingkat. Pilihan ini mempertahankan metafora dan ambiguitas teks tanpa langsung menafsirkannya sebagai pelaksanaan yang cepat.
- source_word: ποιήσει
  choice: akan melaksanakan
  rationale: Dengan λόγον sebagai objek, ποιήσει berarti Tuhan akan mewujudkan atau menjalankan apa yang telah difirmankan-Nya. “Melaksanakan” lebih jelas daripada terjemahan harfiah “melakukan”.
- source_word: κύριος
  choice: Tuhan
  rationale: κύριος dalam kutipan Kitab Suci ini merujuk kepada Allah dan secara baku diterjemahkan “Tuhan”.
- source_word: ἐπὶ τῆς γῆς
  choice: di atas bumi
  rationale: Ungkapan Yunani dalam Roma paling langsung berarti “di atas bumi”. Pilihan ini mempertahankan cakupan luas teks Roma, sementara kemungkinan “di negeri itu” dicatat dalam catatan kaki.
theological_decisions:
- issue: Sifat tindakan ilahi dalam kutipan Yesaya
  choice: Tuhan secara tegas menuntaskan pelaksanaan firman-Nya dalam sejarah atau penghakiman, tanpa menentukan sistem doktrinal yang lebih khusus.
  alternative: Tuhan akan segera melaksanakan putusan pengadilan-Nya, atau akan mempersingkat karya penyelamatan dan penghakiman-Nya.
  rationale: Kedua partisipel mengandung kemungkinan nuansa penghakiman dan kecepatan, tetapi teks tidak mengharuskan satu rumusan doktrinal tertentu. Terjemahan mempertahankan ketegangan antara penuntasan dan pemendekan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kutipan dipertahankan secara ringkas. “Menuntaskannya dan mempersingkatnya” sengaja mempertahankan kesejajaran serta ketegangan leksikal kedua partisipel Yunani.
