id: ROM.9.17
reference: Romans 9:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι Εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου, καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/017.yaml
  text: 'For the Scripture says to Pharaoh[a], “For this very purpose I raised you up: that I might display my power in you[b], and that my name might be proclaimed in all the earth.”'
translation:
  language: id
  text: Sebab Kitab Suci berkata kepada Firaun, “Justru untuk tujuan inilah Aku membangkitkan engkau[a], supaya Aku memperlihatkan kuasa-Ku pada dirimu, dan supaya nama-Ku[b] diberitakan di seluruh bumi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Aku mempertahankan hidupmu” atau “Aku membuat engkau tetap berdiri”; verba Yunaninya memiliki cakupan makna yang lebih luas dalam konteks kutipan dari Kitab Keluaran.
    reason: lexical_alternative
  - marker: b
    text: “Nama-Ku” menunjuk pada kemasyhuran dan reputasi Allah sebagaimana Ia menyatakan diri, bukan sekadar sebutan yang diucapkan.
    reason: cultural_note
lexical_decisions:
- source_word: ἡ γραφή
  choice: Kitab Suci
  rationale: Mempertahankan bentuk tunggal tertentu dan personifikasi Paulus, yaitu Kitab Suci digambarkan sedang berbicara.
- source_word: λέγει ... τῷ Φαραώ
  choice: berkata kepada Firaun
  rationale: Bentuk kini λέγει dipertahankan secara wajar sebagai bentuk kini sastra dalam kutipan Kitab Suci.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai hubungan penjelasan dengan argumen pada ayat sebelumnya.
- source_word: Εἰς αὐτὸ τοῦτο
  choice: Justru untuk tujuan inilah
  rationale: Menyampaikan penekanan αὐτό dan nuansa tujuan secara alami dalam bahasa Indonesia.
- source_word: ἐξήγειρά σε
  choice: Aku membangkitkan engkau
  rationale: Mempertahankan cakupan luas verba Yunani, yang dapat menunjuk pada tindakan membuat seseorang tampil, menegakkannya, atau mempertahankannya untuk suatu peran, tanpa mempersempit mekanismenya.
- source_word: ὅπως
  choice: supaya
  rationale: Menyatakan tujuan dengan jelas dalam kedua anak kalimat.
- source_word: ἐνδείξωμαι
  choice: Aku memperlihatkan
  rationale: Mengungkapkan tindakan menunjukkan atau mendemonstrasikan secara nyata tanpa memakai istilah yang terlalu teknis.
- source_word: ἐν σοὶ
  choice: pada dirimu
  rationale: Menjaga acuan kepada diri atau perkara Firaun tanpa secara tegas mengubahnya menjadi sarana ('melalui dirimu') atau sasaran penghukuman ('atas dirimu').
- source_word: τὴν δύναμίν μου
  choice: kuasa-Ku
  rationale: Padanan baku dan kontekstual bagi δύναμις.
- source_word: καὶ ὅπως διαγγελῇ
  choice: dan supaya ... diberitakan
  rationale: Bentuk pasif mempertahankan fokus pada pemberitaan luas tentang nama Allah tanpa menyebut pelaku tertentu.
- source_word: τὸ ὄνομά μου
  choice: nama-Ku
  rationale: Mempertahankan ungkapan asli yang mencakup kemasyhuran dan reputasi Allah sebagaimana Ia menyatakan diri.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: di seluruh bumi
  rationale: Menyampaikan cakupan menyeluruh dan universal yang sesuai dengan konteks pemakaian kutipan ini oleh Paulus.
theological_decisions:
- issue: Arti ἐξήγειρά σε dalam kaitannya dengan Firaun dan kedaulatan Allah
  choice: Aku membangkitkan engkau
  alternative: Aku mempertahankan hidupmu; Aku membuat engkau tetap berdiri; Aku membuat engkau tampil
  rationale: Terjemahan ini mempertahankan pernyataan bahwa Allah menempatkan atau mempertahankan Firaun bagi tujuan-Nya, tetapi tidak menentukan apakah verba itu khusus menunjuk pada penciptaan, pengangkatan, kemunculan dalam sejarah, atau pemeliharaan hidup. Dengan demikian, ketegangan antara kedaulatan Allah dan tanggung jawab manusia tidak diselesaikan secara doktrinal oleh terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan personifikasi Kitab Suci dan dua anak kalimat tujuan, sedangkan pilihan “pada dirimu” sengaja menjaga keluasan relasi ἐν σοὶ.
