  text: Ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι, συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/001.yaml
  text: I am telling the truth in Messiah[a]; I am not lying, as my conscience bears witness with me in the Holy Spirit[c][b],
translation:
  language: id
  text: Aku mengatakan kebenaran dalam Mesias[a]; aku tidak berdusta, sementara hati nuraniku turut bersaksi bersamaku dalam Roh Kudus[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam Kristus.” Kata Yunani Χριστός dapat berfungsi sebagai gelar (“Mesias”) atau seperti nama (“Kristus”); di sini diterjemahkan sebagai gelar.
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan hati nuraniku yang turut bersaksi” atau “sementara hati nuraniku bersaksi bersamaku.”
    reason: lexical_alternative
  - marker: c
    text: Atau, mungkin, “dalam roh yang kudus,” meskipun dalam tulisan Paulus ungkapan ini paling alami dipahami sebagai rujukan kepada Roh Kudus.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλήθειαν λέγω
  choice: Aku mengatakan kebenaran
  rationale: Ungkapan idiomatis ini menyatakan penegasan yang sungguh-sungguh bahwa perkataan Paulus benar; bentuk ini alami dan tetap dekat dengan susunan Yunani.
- source_word: ἐν Χριστῷ
  choice: dalam Mesias
  rationale: Χριστός pada dasarnya adalah gelar bagi Yang Diurapi. 'Mesias' mempertahankan daya gelarnya, sedangkan alternatif tradisional 'Kristus' dicatat dalam catatan kaki.
- source_word: οὐ ψεύδομαι
  choice: aku tidak berdusta
  rationale: Padanan langsung dan wajar bagi verba deponen ψεύδομαι, serta mempertahankan penyangkalan tegas Paulus.
- source_word: συμμαρτυρούσης
  choice: turut bersaksi bersamaku
  rationale: Mempertahankan unsur συμ- yang menunjukkan kesaksian bersama; konstruksi genitif absolut disampaikan sebagai klausa koordinatif yang alami dalam bahasa Indonesia.
- source_word: τῆς συνειδήσεώς μου
  choice: hati nuraniku
  rationale: Padanan baku dan mudah dipahami bagi συνείδησις dengan pronomina posesif μου.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: dalam Roh Kudus
  rationale: Dalam pemakaian Paulus, frasa ini paling alami merujuk kepada Roh Kudus; 'dalam' mempertahankan ἐν tanpa mempersempitnya menjadi makna instrumental 'oleh'.
theological_decisions:
- issue: Daya gelar Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Terjemahan utama mempertahankan makna gelar 'Yang Diurapi' tanpa menganggap Χριστός semata-mata sebagai nama diri; bentuk gerejawi yang mapan tetap diberikan sebagai alternatif.
- issue: Referen πνεύματι ἁγίῳ
  choice: Roh Kudus
  alternative: roh yang kudus
  rationale: Konteks dan kebiasaan bahasa Paulus paling mendukung rujukan kepada Roh Kudus, tetapi ketiadaan artikel dalam bahasa Yunani memungkinkan alternatif gramatikal yang dicatat tanpa menjadikannya bacaan utama.
- issue: Hubungan sintaksis συμμαρτυρούσης μοι τῆς συνειδήσεώς μου
  choice: hati nuraniku turut bersaksi bersamaku
  alternative: dengan hati nuraniku yang turut bersaksi
  rationale: Pilihan utama mempertahankan gagasan kesaksian bersama secara jelas dan alami, sementara catatan kaki memperlihatkan kemungkinan penyajian konstruksi partisipialnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina orang pertama tunggal 'aku' sesuai dengan suara surat pribadi Paulus. Tanda baca membagi penegasan utama dan kesaksian hati nurani tanpa menghilangkan alur satu kalimat Yunani.
