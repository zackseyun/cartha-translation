  verdict: revise
  source_fidelity: 'Terjemahan pokok menangkap konstruksi tambahan Paulus, nama Ribka dan Ishak, serta maksud idiom κοίτην ἔχουσα: Ribka mengandung melalui satu laki-laki. Namun, “bapak leluhur kita” tidak alami dalam bahasa Indonesia modern dan mengaburkan bentuk sederhana τοῦ πατρὸς ἡμῶν (“bapak kita”) yang secara kontekstual menunjuk kepada seorang leluhur.'
  naturalness: “Mengandung dari satu orang” dapat dipahami, tetapi “mengandung dari seorang laki-laki” lebih wajar dan sekaligus menyatakan rujukan maskulin yang ditentukan oleh aposisi Ishak. “Leluhur kita” lebih idiomatis daripada “bapak leluhur kita.”
  terminology: Ribka dan Ishak adalah bentuk nama Alkitab Indonesia yang lazim. “Leluhur kita” mempertahankan fungsi kekerabatan-komunal πατήρ dalam konteks ini tanpa menyiratkan bahwa Ishak adalah ayah langsung para pembaca. Catatan kaki direvisi agar tidak menjadikan “pembaringan” sebagai padanan harfiah yang menyesatkan; κοίτη dapat berarti ranjang atau hubungan seksual dan idiomnya di sini merujuk kepada pembuahan/kehamilan.
