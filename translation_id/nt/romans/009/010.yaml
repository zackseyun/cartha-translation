  text: οὐ μόνον δέ, ἀλλὰ καὶ Ῥεβέκκα ἐξ ἑνὸς κοίτην ἔχουσα, Ἰσαὰκ τοῦ πατρὸς ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/010.yaml
  text: And not only that[a], but Rebekah also had conceived by one man, our father Isaac.
translation:
  language: id
  text: Bukan hanya itu,[a] tetapi Ribka pun telah mengandung dari seorang laki-laki, yaitu Ishak, leluhur kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian selanjutnya berbunyi kira-kira, “Ribka, yang mempunyai koite dari satu orang, Ishak, bapak kita.” Kata Yunani koite dapat berkaitan dengan ranjang atau hubungan seksual; dalam ungkapan ini maksudnya ialah pembuahan atau kehamilan dari satu laki-laki.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ καί
  choice: Bukan hanya itu, tetapi ... pun
  rationale: Menyampaikan konstruksi korelatif Yunani secara alami dan mempertahankan langkah tambahan dalam argumen Paulus.
- source_word: Ῥεβέκκα
  choice: Ribka
  rationale: Bentuk nama yang baku dan lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: ἐξ ἑνός
  choice: dari satu orang
  rationale: Mempertahankan unsur 'satu' serta menjelaskan bahwa yang dimaksud adalah satu pribadi laki-laki tanpa mempersempitnya secara berlebihan menjadi sekadar hubungan biologis.
- source_word: κοίτην ἔχουσα
  choice: mengandung
  rationale: Ungkapan harfiahnya berkaitan dengan persetubuhan atau pembaringan, tetapi dalam konteks ini menunjuk pada terjadinya pembuahan/kehamilan; 'mengandung' menyampaikan maksudnya dengan wajar dan bermartabat.
- source_word: Ἰσαὰκ τοῦ πατρὸς ἡμῶν
  choice: yaitu Ishak, bapak leluhur kita
  rationale: '''Yaitu'' memperjelas aposisi bahwa satu orang tersebut adalah Ishak. ''Bapak leluhur'' mengungkapkan hubungan nenek moyang yang dimaksud πατήρ tanpa memberi kesan bahwa Ishak adalah ayah langsung para pembaca.'
theological_decisions:
- issue: Seberapa eksplisit idiom mengenai hubungan seksual dan pembuahan harus diterjemahkan dalam argumen tentang pemilihan
  choice: Ribka mengandung dari satu orang, yaitu Ishak
  alternative: Ribka bersetubuh dengan satu orang, Ishak, bapak kita; atau Ribka mempunyai satu pembaringan dari Ishak
  rationale: Konteks menekankan bahwa keturunan Ribka berasal dari ayah yang sama. Terjemahan ini mengomunikasikan pembuahan tanpa bahasa yang kasar dan tidak menambahkan 'anak-anak' yang tidak dinyatakan secara eksplisit dalam ayat ini.
- issue: Makna πατήρ bagi Ishak dalam hubungan dengan Paulus dan para pembacanya
  choice: bapak leluhur kita
  alternative: bapak kita
  rationale: Makna leluhur dipertahankan secara jelas dalam bahasa Indonesia modern tanpa menghilangkan bahasa kekerabatan komunal yang mendukung argumen Paulus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur argumentatif Paulus dipertahankan, sedangkan idiom seksual Yunani disampaikan secara alami. Penanda catatan kaki [a] ditempatkan dalam teks utama.
