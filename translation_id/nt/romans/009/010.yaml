    rationale: Yunani berbunyi Ἰσαὰκ τοῦ πατρὸς ἡμῶν, secara langsung “Ishak, bapak kita.” Dalam bahasa Indonesia modern, “Ishak, leluhur kita” menyampaikan maksud leluhur itu secara wajar tanpa gabungan nominal “bapak leluhur” yang janggal.
  - severity: low
    issue: “Dari satu orang” kurang idiomatis untuk konteks pembuahan.
    rationale: Konteks dan aposisi Ishak memastikan bahwa ἐξ ἑνός merujuk kepada satu laki-laki. “Dari seorang laki-laki” lebih lancar dalam bahasa Indonesia sambil mempertahankan penekanan pada satu ayah.
  - severity: low
    issue: Catatan kaki memakai “mempunyai pembaringan,” yang bukan penjelasan harfiah yang baik dalam bahasa Indonesia.
    rationale: Istilah Yunani κοίτη secara leksikal dapat berkaitan dengan ranjang atau hubungan seksual; dalam konstruksi ini maksudnya adalah pembuahan dari satu laki-laki. Catatan sebaiknya menjelaskan rentang itu tanpa menciptakan idiom Indonesia yang tidak lazim.
