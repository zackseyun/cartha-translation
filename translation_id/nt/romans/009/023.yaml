  text: ⸀καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους, ἃ προητοίμασεν εἰς δόξαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/023.yaml
  text: and in order to make known the riches of his glory upon vessels of mercy, which he prepared beforehand for glory,
translation:
  language: id
  text: dan untuk menyatakan kekayaan kemuliaan-Nya kepada bejana-bejana belas kasihan, yang telah dipersiapkan-Nya sebelumnya untuk kemuliaan,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωρίσῃ
  choice: menyatakan
  rationale: Menyampaikan makna ‘membuat dikenal’ secara alami dalam bahasa Indonesia tanpa menghilangkan tindakan Allah sebagai pelaku.
- source_word: τὸν πλοῦτον τῆς δόξης αὐτοῦ
  choice: betapa kayanya kemuliaan-Nya
  rationale: Ungkapan idiomatis Indonesia yang tetap mempertahankan gagasan kelimpahan atau kekayaan kemuliaan Allah.
- source_word: ἐπὶ σκεύη ἐλέους
  choice: atas bejana-bejana belas kasihan
  rationale: Mempertahankan metafora bejana dan nuansa preposisi ἐπί, selaras dengan susunan sumber serta tidak mengubahnya menjadi sekadar penerima manfaat.
- source_word: προητοίμασεν
  choice: telah dipersiapkan-Nya sebelumnya
  rationale: Menjaga unsur persiapan lebih dahulu yang dinyatakan oleh awalan προ- dan menjadikan rujukan kepada Allah sebagai subjek tetap jelas.
- source_word: εἰς δόξαν
  choice: untuk kemuliaan
  rationale: Mempertahankan arah atau tujuan yang terbuka dalam εἰς tanpa menambahkan penjelasan teologis.
theological_decisions:
- issue: Hubungan sintaksis ἵνα dengan ayat sebelumnya
  choice: Memulai dengan ‘dan untuk menyatakan’ sebagai kelanjutan kalimat
  alternative: ‘Ia melakukan itu untuk menyatakan’
  rationale: Teks Yunani merupakan kelanjutan sintaksis dan tidak secara eksplisit mengulang subjek atau verba utama; terjemahan tidak menutup ketegangan struktur ayat 22–23.
- issue: Identitas bejana-bejana belas kasihan dan cakupan persiapan sebelumnya
  choice: Membiarkan klausa relatif sebagaimana sumber tanpa menguraikan mekanisme atau dasar pemilihan
  alternative: Menjelaskan bahwa Allah menentukan orang tertentu sejak kekekalan
  rationale: Sumber menyatakan persiapan sebelumnya untuk kemuliaan, tetapi ayat ini sendiri tidak menjelaskan mekanisme, waktu persis, ataupun dasar tindakan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan cukup formal. Metafora ‘bejana-bejana belas kasihan’ dipertahankan karena penting bagi alur argumentasi. Ayat dibiarkan berakhir dengan koma karena merupakan bagian dari kalimat yang berlanjut ke ayat berikutnya.
