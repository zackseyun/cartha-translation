  source_fidelity: Makna dasar terjaga, termasuk tujuan ἵνα, metafora σκεύη, persiapan sebelumnya (προητοίμασεν), dan arah εἰς δόξαν. Namun, «betapa kayanya kemuliaan-Nya» mengubah nomina «kekayaan kemuliaan-Nya» menjadi seruan mengenai derajat kemuliaan. Preposisi ἐπί dalam konstruksi ini lebih wajar diterjemahkan «kepada» daripada «atas» dalam bahasa Indonesia.
  naturalness: «Atas bejana-bejana belas kasihan» tidak lazim dalam bahasa Indonesia modern dan terdengar terlalu harfiah. «Kepada bejana-bejana belas kasihan» mempertahankan metafora serta hubungan tindakan Allah dengan bejana-bejana itu secara lebih idiomatis.
  terminology: «Bejana-bejana belas kasihan» layak dipertahankan sebagai metafora yang terkait dengan ayat sebelumnya. «Kemuliaan-Nya» dan «dipersiapkan-Nya sebelumnya» juga tepat dan tidak memaksakan penafsiran teologis tertentu.
