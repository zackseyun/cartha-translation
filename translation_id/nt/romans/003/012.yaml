  text: πάντες ἐξέκλιναν, ἅμα ἠχρεώθησαν· οὐκ ⸀ἔστιν ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/012.yaml
  text: All have turned aside[a]; together they have become worthless. There is no one who does what is good[b]; there is not even one.
translation:
  language: id
  text: Semua orang telah menyimpang; bersama-sama mereka telah menjadi tidak berguna[a]. Tidak ada seorang pun yang berbuat baik[b]; tidak ada seorang pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi tidak bernilai” atau “menjadi rusak.”
    reason: lexical_alternative
  - marker: b
    text: Atau “melakukan kebaikan”; χρηστότητα juga dapat berarti “kebaikan hati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: Semua orang
  rationale: Menyampaikan cakupan universal bentuk jamak secara alami dalam bahasa Indonesia; penambahan 'orang' hanya memperjelas subjek yang tersirat.
- source_word: ἐξέκλιναν
  choice: telah menyimpang
  rationale: Mempertahankan gambaran penyimpangan moral dan aspek tindakan yang telah terjadi.
- source_word: ἅμα
  choice: bersama-sama
  rationale: Menyatakan keadaan kolektif yang dialami semua orang, bukan terutama keserentakan waktu.
- source_word: ἠχρεώθησαν
  choice: telah menjadi tidak berguna
  rationale: Mencerminkan bentuk pasif-resultatif dan arti dasar kehilangan kegunaan atau kelayakan tanpa mempersempitnya menjadi kerusakan moral semata.
- source_word: ποιῶν
  choice: yang berbuat
  rationale: Ungkapan Indonesia yang wajar untuk partisipel dengan daya kebiasaan atau ciri perilaku.
- source_word: χρηστότητα
  choice: baik
  rationale: Dalam ungkapan 'berbuat baik', pilihan ini menyampaikan makna etis dengan alami, sementara kemungkinan arti 'kebaikan hati' dicatat dalam catatan kaki.
- source_word: οὐκ ἔστιν
  choice: Tidak ada seorang pun
  rationale: Mempertahankan penyangkalan tegas dalam bahasa Indonesia modern.
- source_word: ἕως ἑνός
  choice: bahkan seorang pun tidak
  rationale: Mengungkapkan simpulan idiomatis yang menegaskan bahwa tidak ada satu pengecualian pun.
theological_decisions:
- issue: Cakupan universal pernyataan
  choice: Semua orang ... bahkan seorang pun tidak
  alternative: Semua ... tidak sampai satu pun
  rationale: Mempertahankan tekanan universal teks Yunani tanpa menambahkan pembatasan atau penjelasan teologis.
- issue: Nilai makna ἠχρεώθησαν
  choice: menjadi tidak berguna
  alternative: menjadi rusak / menjadi tidak bernilai
  rationale: Memilih arti leksikal yang kuat namun tidak secara diam-diam menentukan apakah ungkapan ini terutama menunjuk pada ketidakbergunaan, kebobrokan, atau ketidaklayakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dua kalimat mengikuti gerak retoris Yunani; pengulangan 'seorang pun' mempertahankan penekanan penutup.
