  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀδικία ἡμῶν θεοῦ δικαιοσύνην συνίστησιν, τί ἐροῦμεν; μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/005.yaml
  text: But if our unrighteousness demonstrates God’s righteousness[a], what shall we say? Is God unjust to inflict wrath? (I am speaking in a human way.)
translation:
  language: id
  text: Tetapi jika ketidakbenaran kita menunjukkan kebenaran Allah[a], apakah yang akan kita katakan? Apakah Allah tidak adil karena menimpakan murka? (Aku berbicara secara manusiawi.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketidakadilan kita menunjukkan keadilan Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικία
  choice: ketidakbenaran
  rationale: Mempertahankan pertentangan moral dan relasional dengan δικαιοσύνη Allah; kemungkinan makna yuridis “ketidakadilan” dicantumkan dalam catatan kaki.
- source_word: δικαιοσύνη
  choice: kebenaran
  rationale: Istilah utama yang wajar dalam bahasa teologis Indonesia untuk δικαιοσύνη, sambil mempertahankan “keadilan” sebagai alternatif kontekstual dalam catatan kaki.
- source_word: συνίστησιν
  choice: menunjukkan
  rationale: Menyampaikan bahwa ketidakbenaran manusia membuat kebenaran Allah tampak nyata, tanpa memperkuat maknanya menjadi pembuktian formal.
- source_word: μὴ ἄδικος
  choice: Apakah Allah tidak adil
  rationale: Mempertahankan bentuk pertanyaan retoris Yunani dan kecenderungannya mengharapkan jawaban negatif tanpa menambahkan jawaban itu ke dalam teks.
- source_word: ἐπιφέρων τὴν ὀργήν
  choice: karena menimpakan murka
  rationale: “Menimpakan murka” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan nuansa tindakan penghukuman.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: Aku berbicara dari sudut pandang manusia
  rationale: Mengungkapkan secara alami bahwa Paulus sedang memakai cara pandang atau argumentasi manusia sebagai sebuah penyangkalan tanggung jawab atas isi keberatan tersebut.
theological_decisions:
- issue: Cara menyampaikan pertanyaan retoris mengenai keadilan Allah dalam penghakiman
  choice: Apakah Allah tidak adil karena menimpakan murka?
  alternative: Allah tentu tidak tidak adil ketika menimpakan murka, bukan?
  rationale: Bentuk pertanyaan dipertahankan tanpa menjawabnya atau melunakkan ketegangan. Partikel μή mengarahkan pada jawaban negatif, tetapi jawaban itu tidak dibuat eksplisit dalam terjemahan utama.
- issue: Rentang makna pasangan ἀδικία dan δικαιοσύνη
  choice: ketidakbenaran … kebenaran
  alternative: ketidakadilan … keadilan
  rationale: Pilihan utama mempertahankan cakupan moral-relasional yang luas dalam argumen Paulus, sedangkan alternatif yuridis yang sungguh mungkin dijaga dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur retoris ayat dipertahankan, sedangkan ungkapan idiomatis terakhir dibuat alami bagi pembaca masa kini.
