lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: Tidak ada
  rationale: Ungkapan eksistensial negatif yang alami dalam bahasa Indonesia dan mempertahankan daya pernyataan Yunani.
- source_word: φόβος θεοῦ
  choice: rasa takut kepada Allah
  rationale: Mempertahankan makna utama φόβος dan menjadikan Allah sebagai sasaran rasa takut secara alami dalam bahasa Indonesia; nuansa 'hormat' dicatat sebagai alternatif.
- source_word: ἀπέναντι
  choice: di depan
  rationale: Mempertahankan gambaran spasial-metaforis sesuatu yang berada di hadapan pandangan seseorang.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: mata mereka
  rationale: Mempertahankan gambaran konkret 'mata' serta idiom tentang pandangan dan orientasi moral.
theological_decisions:
- issue: Makna φόβος dalam hubungan dengan Allah
  choice: rasa takut kepada Allah
  alternative: rasa hormat kepada Allah
  rationale: Teks utama mempertahankan arti leksikal langsung tanpa meniadakan nuansa hormat yang mungkin terkandung dalam ungkapan alkitabiah tersebut.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan 'di depan mata mereka' sengaja mempertahankan citraan sumber meskipun lebih idiomatis daripada ungkapan percakapan sehari-hari.
