id: ROM.3.25
reference: Romans 3:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃν προέθετο ὁ θεὸς ἱλαστήριον ⸀διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/025.yaml
  text: whom God put forward as an atoning sacrifice[a] through faith in his blood[b], to demonstrate his righteousness[c], because of the passing over of previously committed sins.
translation:
  language: id
  text: Dialah yang telah Allah tampilkan di hadapan umum sebagai kurban pendamaian[a] melalui iman dalam darah-Nya[b], untuk menunjukkan kebenaran-Nya[c], karena Ia telah membiarkan dosa-dosa yang dilakukan sebelumnya berlalu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pendamaian yang meredakan murka”; atau “tutup pendamaian”, yaitu tutup emas Tabut Perjanjian, tempat darah pendamaian dipercikkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “melalui iman, dengan darah-Nya”; hubungan antara “melalui iman” dan “dalam darah-Nya” dapat dipahami dengan lebih dari satu cara.
    reason: alternative_reading
  - marker: c
    text: Atau “keadilan-Nya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέθετο
  choice: telah ditetapkan
  rationale: Menyampaikan tindakan Allah menempatkan Kristus ke hadapan sebagai sarana yang ditentukan-Nya; bentuk pasif alami dalam bahasa Indonesia juga mempertahankan Allah sebagai pelaku yang disebutkan.
- source_word: ἱλαστήριον
  choice: kurban pendamaian
  rationale: Ungkapan yang mudah dipahami dan cukup luas untuk mencakup fungsi penebusan tanpa membatasi istilah Yunani pada satu teori; kemungkinan 'pendamaian yang meredakan murka' dan 'tutup pendamaian' dicatat dalam catatan kaki.
- source_word: διὰ πίστεως
  choice: melalui iman
  rationale: Menerjemahkan sarana penerimaan secara wajar dan mempertahankan padanan umum πίστις sebagai 'iman'.
- source_word: ἐν τῷ αὐτοῦ αἵματι
  choice: dalam darah-Nya
  rationale: Padanan formal ini mempertahankan hubungan sintaksis yang mungkin ambigu antara iman, darah Kristus, dan kurban pendamaian.
- source_word: εἰς ἔνδειξιν
  choice: untuk menunjukkan
  rationale: Ungkapan Indonesia yang alami serta mempertahankan daya tujuan atau hasil dari frasa Yunani.
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: Padanan baku yang cocok dengan pemakaian Paulus dan mencakup sifat serta tindakan benar Allah; nuansa 'keadilan' dicatat.
- source_word: πάρεσιν
  choice: membiarkan ... berlalu tanpa hukuman
  rationale: Menunjukkan tindakan tidak menghukum atau melewatkan dosa pada masa sebelumnya, tanpa menyamakannya begitu saja dengan pengampunan penuh.
- source_word: προγεγονότων ἁμαρτημάτων
  choice: dosa-dosa yang dilakukan sebelumnya
  rationale: Menyatakan prioritas waktunya dengan jelas dan mempertahankan daya partisipial frasa Yunani.
theological_decisions:
- issue: Cakupan makna ἱλαστήριον
  choice: kurban pendamaian
  alternative: pendamaian yang meredakan murka; tutup pendamaian
  rationale: Teks utama memakai istilah yang alami dan luas tanpa memutuskan secara sepihak apakah tekanannya pada penghapusan dosa, peredaan murka, atau gambaran tutup pendamaian dalam Kemah Suci.
- issue: Hubungan διὰ πίστεως dengan ἐν τῷ αὐτοῦ αἵματι
  choice: melalui iman dalam darah-Nya
  alternative: melalui iman, dengan darah-Nya
  rationale: Bacaan utama membiarkan 'darah-Nya' menjadi lingkup atau sasaran iman, sedangkan catatan kaki mempertahankan kemungkinan bahwa darah adalah sarana kurban pendamaian.
- issue: Nuansa δικαιοσύνη Allah
  choice: kebenaran-Nya
  alternative: keadilan-Nya
  rationale: '''Kebenaran'' mempertahankan padanan utama istilah Paulus, sementara ''keadilan'' dapat menonjolkan aspek tindakan Allah yang adil dalam konteks ini.'
- issue: Makna πάρεσις terhadap dosa terdahulu
  choice: membiarkan dosa-dosa ... berlalu tanpa hukuman
  alternative: melewatkan dosa-dosa yang dilakukan sebelumnya
  rationale: Pilihan ini membedakan penangguhan atau tidak dijatuhkannya hukuman dari istilah yang secara langsung berarti pengampunan, tanpa menyatakan bahwa Allah mengabaikan dosa begitu saja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. 'Dia' dipakai untuk rujukan kepada Kristus, sedangkan sufiks hormat '-Nya' dipakai pada rujukan kepada Kristus dan Allah. Struktur dijaga cukup dekat dengan bahasa Yunani, tetapi klausa terakhir diperjelas secara idiomatis agar perbedaan πάρεσις dari pengampunan penuh tetap tampak.
