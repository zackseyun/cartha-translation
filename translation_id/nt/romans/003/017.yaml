  text: καὶ ὁδὸν εἰρήνης οὐκ ἔγνωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/017.yaml
  text: and they have not known the way of peace[a].
translation:
  language: id
  text: dan mereka tidak mengenal jalan damai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jalan kedamaian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: dan
  rationale: Memakai kata penghubung langsung untuk mempertahankan rangkaian dakwaan dalam kutipan-kutipan yang disusun Paulus.
- source_word: ὁδὸν
  choice: jalan
  rationale: “Jalan” wajar dalam bahasa Indonesia serta mempertahankan gambaran harfiah dan makna kiasan tentang cara atau arah hidup.
- source_word: εἰρήνης
  choice: damai
  rationale: Dalam frasa “jalan damai”, bentuk ini alami dan menggambarkan jalan yang bercirikan atau menghasilkan kedamaian.
- source_word: οὐκ ἔγνωσαν
  choice: tidak mengenal
  rationale: Menyatakan kegagalan mereka untuk mengetahui, mengakui, atau mengalami jalan tersebut; bentuk kini dalam bahasa Indonesia cocok untuk pernyataan umum dalam konteks dakwaan ini.
theological_decisions:
- issue: Cakupan makna “jalan damai”
  choice: Mempertahankan ungkapan ringkas “jalan damai” tanpa menjelaskan apakah terutama berarti cara hidup yang damai atau jalan menuju kedamaian.
  alternative: jalan menuju kedamaian
  rationale: Konstruksi Yunani memungkinkan nuansa yang tidak perlu dipersempit; terjemahan ringkas mempertahankan ketegangan semantis tersebut.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan diawali “dan” untuk mempertahankan hubungan ayat ini dengan rangkaian dakwaan sebelumnya.
source_grounding:
  english_pob_role: consult_only
