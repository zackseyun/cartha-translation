translation:
  language: id
  text: 'Seperti yang tertulis: “Tidak ada seorang pun yang benar, bahkan satu orang pun tidak.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Seperti
  rationale: Secara alami memperkenalkan kutipan Kitab Suci bersama γέγραπται dan mempertahankan makna ‘sebagaimana’.
- source_word: γέγραπται
  choice: ada tertulis
  rationale: Ungkapan baku bahasa Indonesia untuk formula kutipan bentuk perfek pasif, sekaligus menyiratkan bahwa tulisan itu tetap berlaku.
- source_word: ὅτι
  choice: tanda koma diikuti kutipan langsung
  rationale: Dalam bahasa Indonesia modern, kutipan setelah formula ‘Seperti ada tertulis’ lebih alami diperkenalkan dengan tanda baca daripada kata ‘bahwa’.
- source_word: Οὐκ ἔστιν
  choice: Tidak ada
  rationale: Menyampaikan konstruksi eksistensial negatif Yunani secara alami dan tepat.
- source_word: δίκαιος
  choice: yang benar
  rationale: Mempertahankan cakupan moral dan relasional-forensik δίκαιος dalam konteks Paulus; bentuk dengan ‘yang’ diperlukan agar ungkapannya alami dalam bahasa Indonesia.
- source_word: οὐδὲ εἷς
  choice: bahkan seorang pun tidak
  rationale: Mempertahankan penegasan bahwa tidak ada satu pun pengecualian, dengan susunan yang wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah pernyataan dibuat sebagai sifat setiap orang (‘tidak seorang pun benar’) atau sebagai ketiadaan orang benar (‘tidak ada seorang pun yang benar’).
  choice: Tidak ada seorang pun yang benar
  alternative: Tidak seorang pun benar
  rationale: Pilihan ini mengikuti bentuk eksistensial Yunani οὐκ ἔστιν δίκαιος dan mempertahankan pernyataan yang menyeluruh tanpa menambahkan pembatas atau penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan ‘seorang pun’ dipertahankan untuk membawa daya tekan οὐδὲ εἷς, meskipun sedikit lebih retoris daripada percakapan sehari-hari.
