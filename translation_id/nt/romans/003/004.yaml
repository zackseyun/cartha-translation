id: ROM.3.4
reference: Romans 3:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, ⸀καθὼς γέγραπται· Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ ⸀νικήσεις ἐν τῷ κρίνεσθαί σε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/004.yaml
  text: 'May it never be! Rather[a], let God be true, and every person a liar[b], as it is written: “So that you may be justified in your words and prevail when you are judged.”'
translation:
  language: id
  text: 'Sama sekali tidak! Sebaliknya, biarlah Allah benar dan setiap manusia pendusta, seperti ada tertulis: “Supaya Engkau dinyatakan benar dalam perkataan-Mu dan menang ketika Engkau dihakimi.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika Engkau menghakimi.” Terjemahan ini lebih langsung mencerminkan bunyi Ibrani Mazmur 51:4, sedangkan bunyi Yunani dalam Roma secara alami dipahami sebagai “ketika Engkau dihakimi.”
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Sama sekali tidak!
  rationale: Ungkapan penolakan yang tegas dan alami dalam bahasa Indonesia modern, sesuai dengan daya idiomatis bentuk optatif Yunani.
- source_word: γινέσθω δὲ ὁ θεὸς ἀληθής
  choice: Sebaliknya, biarlah Allah terbukti benar
  rationale: Mempertahankan daya imperatif γινέσθω sekaligus memperjelas bahwa kebenaran Allah dinyatakan atau terbukti, bukan baru menjadi kenyataan.
- source_word: πᾶς δὲ ἄνθρωπος ψεύστης
  choice: dan setiap manusia terbukti sebagai pendusta
  rationale: ἄνθρωπος bersifat generik, sedangkan ψεύστης adalah nomina yang secara langsung berarti pendusta; tambahan 'terbukti sebagai' membuat paralel dengan kebenaran Allah tanpa mengurangi antitesis.
- source_word: καθὼς γέγραπται
  choice: seperti ada tertulis
  rationale: Formula kutipan Kitab Suci yang baku, ringkas, dan bermartabat dalam bahasa Indonesia.
- source_word: δικαιωθῇς
  choice: dinyatakan benar
  rationale: Menyampaikan makna forensik bahwa Allah terbukti berada di pihak yang benar, tanpa menyiratkan bahwa Ia mengalami perubahan moral.
- source_word: ἐν τοῖς λόγοις σου
  choice: dalam firman-firman-Mu
  rationale: λόγοις secara harfiah berarti perkataan atau kata-kata; 'firman-firman-Mu' sesuai bagi perkataan Allah dalam kutipan mazmur dan mempertahankan bentuk jamak.
- source_word: νικήσεις
  choice: menang
  rationale: Secara alami mengungkapkan keberhasilan dalam konteks perkara atau penghakiman, tanpa perlu menggunakan bahasa militer.
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: ketika Engkau dihakimi
  rationale: Infinitif kini pasif κρίνεσθαι paling alami dibaca sebagai 'dihakimi'; kemungkinan yang mengikuti bunyi Ibrani Mazmur 51:4 dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna forensik δικαιωθῇς ketika diterapkan kepada Allah
  choice: dinyatakan benar
  alternative: dibenarkan; terbukti berada di pihak yang benar
  rationale: Konteks membicarakan kebenaran Allah berhadapan dengan kepalsuan manusia. Maksudnya bukan Allah dijadikan benar, melainkan kebenaran-Nya dinyatakan dalam firman-Nya.
- issue: Suara gramatikal κρίνεσθαι dalam kutipan Mazmur 51:4
  choice: ketika Engkau dihakimi
  alternative: ketika Engkau menghakimi
  rationale: Teks Yunani Roma secara paling wajar dibaca pasif, sedangkan alternatif aktif mencerminkan teks Ibrani Mazmur secara lebih langsung; ketegangan tekstual ini dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang tegas dan bermartabat. Sapaan kepada Allah memakai huruf kapital. Pilihan 'pendusta' mempertahankan ketajaman antitesis, sedangkan 'dinyatakan benar' menjaga nuansa hukum tanpa membawa doktrin denominasi tertentu.
