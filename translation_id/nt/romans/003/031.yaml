base_translation:
  language: en
  yaml_path: translation/nt/romans/003/031.yaml
  text: Do we then nullify the law through faith? May it never be! On the contrary[a], we uphold the law.
translation:
  language: id
  text: Jadi, apakah kita membatalkan hukum Taurat melalui iman? Sama sekali tidak! Sebaliknya, kita meneguhkan hukum Taurat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kita menegakkan hukum Taurat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμον
  choice: hukum Taurat
  rationale: Dalam alur argumentasi Roma, istilah ini merujuk pada Taurat. Padanan ini lebih jelas dan lazim dalam bahasa Indonesia daripada sekadar “hukum”, tanpa menambahkan kata sandang yang tidak dimiliki bahasa Indonesia.
- source_word: οὖν
  choice: Jadi
  rationale: Menandai kesimpulan retoris dari uraian sebelumnya dengan ungkapan yang alami dalam bahasa Indonesia modern.
- source_word: καταργοῦμεν
  choice: membatalkan
  rationale: Menyampaikan gagasan menjadikan tidak berlaku atau tidak berdaya, sekaligus membentuk pertentangan yang jelas dengan “menegakkan”; “menghapuskan” dapat terdengar terlalu sempit sebagai tindakan legislatif.
- source_word: διὰ τῆς πίστεως
  choice: melalui iman
  rationale: Mempertahankan nuansa perantaraan atau sarana dari διά dengan genitif dan menerjemahkan πίστις secara konsisten sebagai “iman”.
- source_word: μὴ γένοιτο
  choice: Sama sekali tidak!
  rationale: Ungkapan penolakan tegas yang alami, jelas, dan kuat dalam bahasa Indonesia masa kini.
- source_word: ἀλλὰ
  choice: Sebaliknya
  rationale: Menandai koreksi dan pertentangan tajam terhadap pertanyaan sebelumnya.
- source_word: ἱστάνομεν
  choice: menegakkan
  rationale: Mempertahankan metafora dasar ἵστημι dan kontrasnya dengan “membatalkan”. Dalam kolokasi Indonesia, “menegakkan hukum Taurat” dapat berarti mengukuhkan atau menjunjung keberlakuannya, bukan menciptakannya.
theological_decisions:
- issue: Hubungan antara iman dan hukum Taurat
  choice: kita menegakkan hukum Taurat
  alternative: kita mengukuhkan hukum Taurat
  rationale: Bahasa Yunani memungkinkan nuansa menegakkan, mengukuhkan, atau membuat tetap berdiri. “Menegakkan” menjaga citra leksikal dan menegaskan bahwa iman tidak membatalkan Taurat, tanpa menerangkan secara sepihak bagaimana Taurat berfungsi dalam suatu sistem teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Struktur tanya-jawab retoris serta penolakan tegas Paulus dipertahankan; istilah “hukum Taurat” dipakai agar rujukannya jelas bagi pembaca umum.
