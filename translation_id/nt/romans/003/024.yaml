base_translation:
  language: en
  yaml_path: translation/nt/romans/003/024.yaml
  text: being justified freely by his grace through the redemption that is in Messiah Jesus[b][a],
translation:
  language: id
  text: dan mereka dibenarkan[a] dengan cuma-cuma oleh anugerah-Nya melalui penebusan dalam Mesias Yesus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dinyatakan benar.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara tradisional: “Kristus Yesus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιούμενοι
  choice: mereka dibenarkan
  rationale: Partisipel pasif kini ini melanjutkan kalimat dari ayat sebelumnya. Bentuk “dibenarkan” mempertahankan istilah Paulus yang ringkas serta nuansa hukum-relasionalnya tanpa mempersempit makna.
- source_word: δωρεὰν
  choice: dengan cuma-cuma
  rationale: Adverbia ini menegaskan bahwa pembenaran diberikan sebagai karunia, bukan diperoleh karena jasa; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: τῇ αὐτοῦ χάριτι
  choice: oleh anugerah-Nya
  rationale: “Anugerah” merupakan padanan baku dan bermartabat untuk tindakan serta kemurahan Allah yang tidak didasarkan pada jasa manusia; “oleh” menyatakan sarana atau dasar pemberian itu.
- source_word: ἀπολυτρώσεως
  choice: penebusan
  rationale: “Penebusan” mempertahankan gagasan pembebasan yang terkait dengan harga tebusan dan merupakan istilah yang mapan dalam konteks Paulus.
- source_word: Χριστῷ
  choice: Mesias
  rationale: Χριστός dipertahankan sebagai gelar yang bermakna, yakni “Mesias”, bukan sekadar dialihaksarakan.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: yang ada dalam Mesias Yesus
  rationale: Frasa preposisional ini menerangkan “penebusan”; susunan tersebut mempertahankan struktur Yunani dan relasi penebusan dengan Mesias Yesus tanpa menjelaskan lebih jauh daripada teks.
theological_decisions:
- issue: Bahasa pembenaran Paulus
  choice: dibenarkan
  alternative: dinyatakan benar
  rationale: “Dibenarkan” mempertahankan istilah teologis-hukum Paulus dalam bentuk pasif dan tidak memutuskan seluruh cakupan maknanya. Alternatif penjelas dicantumkan dalam catatan kaki.
- issue: Χριστός sebagai gelar
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: “Mesias” menyampaikan arti gelar Χριστός secara langsung, sedangkan bentuk tradisional tetap disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “mereka” ditambahkan secara wajar untuk mengungkapkan subjek tersirat partisipel Yunani yang merujuk kepada orang-orang dalam konteks ayat sebelumnya; awal dengan “dan” mempertahankan kesinambungan sintaksis. Penanda catatan ditempatkan langsung sesudah istilah yang dijelaskan.
