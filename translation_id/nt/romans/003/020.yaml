  text: διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/020.yaml
  text: because by works of the law no one will be justified before him, for through the law comes the knowledge of sin.
translation:
  language: id
  text: Sebab, tidak seorang pun akan dibenarkan di hadapan-Nya berdasarkan perbuatan-perbuatan hukum Taurat, karena melalui hukum Taurat datang pengenalan akan dosa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἔργων νόμου
  choice: berdasarkan perbuatan-perbuatan yang dituntut hukum Taurat
  rationale: Frasa ini mempertahankan gagasan dasar atau sarana pembenaran (ἐξ), sekaligus menyampaikan secara wajar bahwa ἔργα νόμου ialah perbuatan yang berkaitan dengan tuntutan hukum Taurat.
- source_word: οὐ δικαιωθήσεται
  choice: tidak ... akan dibenarkan
  rationale: Bentuk pasif dan nuansa forensik δικαιόω dipertahankan tanpa menjelaskan secara berlebihan siapa pelakunya.
- source_word: πᾶσα σὰρξ
  choice: seorang pun
  rationale: Ungkapan Semitis ini secara idiomatis berarti tidak ada manusia; 'tidak seorang pun' alami dalam bahasa Indonesia dan menghindari salah paham harfiah tentang daging.
- source_word: ἐνώπιον αὐτοῦ
  choice: di hadapan-Nya
  rationale: Mempertahankan metafora relasional dan penghakiman dalam teks sumber; huruf kapital menunjukkan bahwa pronomina mengacu kepada Allah.
- source_word: διὰ ... νόμου
  choice: melalui hukum Taurat
  rationale: Menyampaikan fungsi hukum sebagai sarana yang menghasilkan pengenalan akan dosa.
- source_word: ἐπίγνωσις ἁμαρτίας
  choice: orang mengenal dosa
  rationale: Nomina abstrak dialihkan menjadi ungkapan verbal yang alami, dengan makna pengenalan atau kesadaran akan dosa tetap terjaga.
theological_decisions:
- issue: Arti 'perbuatan-perbuatan hukum' dalam kaitannya dengan pembenaran
  choice: perbuatan-perbuatan yang dituntut hukum Taurat
  alternative: perbuatan hukum Taurat
  rationale: Pilihan ini cukup jelas bagi pembaca umum tanpa membatasi frasa hanya pada penanda identitas Yahudi atau mengimpor rumusan teologis denominasi tertentu.
- issue: Cakupan πᾶσα σὰρξ
  choice: tidak seorang pun
  alternative: tidak ada satu makhluk pun
  rationale: Dalam konteks ini cakupannya adalah manusia di hadapan Allah; terjemahan idiomatis mempertahankan universalitas pernyataan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur sebab-akibat ayat dipertahankan dengan dua klausa yang dihubungkan oleh 'karena'. Istilah 'hukum Taurat' dipilih karena paling lazim dan jelas untuk νόμος dalam konteks surat Roma.
