  to: Sebab, tidak seorang pun akan dibenarkan di hadapan-Nya berdasarkan perbuatan-perbuatan hukum Taurat, karena melalui hukum Taurat datang pengenalan akan dosa.
  rationale: Revisi menghapus penjelasan interpretatif yang tidak eksplisit dalam “perbuatan-perbuatan yang dituntut hukum Taurat” dan memulihkan bentuk nominal “pengenalan akan dosa,” sambil mempertahankan makna, universalitas, bentuk pasif, serta register baku teks sumber.
