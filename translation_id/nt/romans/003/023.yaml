  text: πάντες γὰρ ἥμαρτον καὶ ὑστεροῦνται τῆς δόξης τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/023.yaml
  text: For all have sinned and fall short of the glory of God[b][a],
translation:
  language: id
  text: Sebab semua orang telah berbuat dosa dan tidak mencapai kemuliaan Allah.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kekurangan kemuliaan Allah” atau “tidak memiliki kemuliaan Allah.”
    reason: lexical_alternative
  - marker: b
    text: Frasa “kemuliaan Allah” dapat merujuk pada kemuliaan Allah sendiri, kemuliaan yang seharusnya dipantulkan manusia, atau kemuliaan yang dianugerahkan Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: semua orang
  rationale: Dalam konteks, bentuk jamak ini mencakup seluruh umat manusia. “Semua orang” alami dan jelas dalam bahasa Indonesia.
- source_word: γὰρ
  choice: sebab
  rationale: Kata ini menyatakan alasan atau penjelasan dan menghubungkan ayat ini dengan argumen sebelumnya.
- source_word: ἥμαρτον
  choice: telah berbuat dosa
  rationale: Aoristus merangkum kenyataan bahwa semua manusia sudah berdosa; bentuk “telah berbuat dosa” menyampaikan fakta lampau yang tetap relevan.
- source_word: ὑστεροῦνται
  choice: tidak mencapai
  rationale: Bentuk kini menunjukkan keadaan kekurangan yang berlangsung. “Tidak mencapai” menyampaikan kegagalan memperoleh atau sampai pada sesuatu tanpa mempersempit maknanya menjadi sekadar standar moral.
- source_word: δόξης
  choice: kemuliaan
  rationale: “Kemuliaan” merupakan padanan baku dan tepat bagi δόξα dalam konteks teologis ini, sambil mempertahankan keluasan maknanya.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Frasa genitif diterjemahkan secara langsung sebagai “kemuliaan Allah,” tanpa menentukan apakah kemuliaan itu milik Allah, berasal dari Allah, dipantulkan manusia, atau dianugerahkan Allah.
theological_decisions:
- issue: Makna frasa “kemuliaan Allah”
  choice: Dipertahankan secara netral sebagai “kemuliaan Allah.”
  alternative: kemuliaan yang berasal dari Allah; kemuliaan Allah yang seharusnya dipantulkan manusia; kemuliaan yang dianugerahkan Allah
  rationale: Frasa Yunani itu ringkas dan terbuka terhadap beberapa nuansa yang berkaitan. Teks utama tidak memaksakan satu tafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan hubungan penjelas dengan ayat sebelumnya serta membedakan tindakan dosa yang telah terjadi dari keadaan kekurangan yang masih berlangsung.
