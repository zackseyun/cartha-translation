  naturalness: Kalimat pembuka direvisi menjadi lebih lengkap dan alami dengan menyatakan 'keuntungannya' yang tersirat dari konteks langsung. Bentuk 'firman Allah' lebih wajar daripada pengulangan 'firman-firman', sambil tetap mempertahankan sifat jamak λόγια melalui catatan kaki.
  terminology: '''Firman Allah'' merupakan padanan baku, bermartabat, dan tidak menambahkan penafsiran doktrinal bagi τὰ λόγια τοῦ θεοῦ. Catatan kaki menyediakan alternatif yang lebih eksplisit secara leksikal. ''Kepada mereka dipercayakan'' mempertahankan nuansa amanat/stewardship dari ἐπιστεύθησαν.'
