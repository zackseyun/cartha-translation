base_translation:
  language: en
  yaml_path: translation/nt/romans/003/002.yaml
  text: Much in every way. For first of all[a], they were entrusted with the oracles of God.
translation:
  language: id
  text: Keuntungannya besar dalam segala hal. Sebab, pertama-tama, kepada mereka dipercayakan firman Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ucapan-ucapan Allah.”
    reason: Alternatif leksikal bagi λόγια, yang menunjuk pada ucapan atau pernyataan ilahi.
lexical_decisions:
- source_word: πολὺ
  choice: Sangat besar
  rationale: Menjawab pertanyaan tersirat tentang besarnya kelebihan dalam ayat sebelumnya. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya tekan jawaban Paulus.
- source_word: κατὰ πάντα τρόπον
  choice: dalam segala hal
  rationale: Idiom ini menyatakan keluasan yang menyeluruh tanpa membatasi jenis kelebihan yang dimaksud.
- source_word: πρῶτον μὲν γὰρ
  choice: Sebab, pertama-tama
  rationale: “Sebab” mencerminkan γὰρ, sedangkan “pertama-tama” memperkenalkan hal utama atau hal pertama yang Paulus kemukakan tanpa mengharuskan adanya daftar lanjutan langsung dalam ayat ini.
- source_word: ἐπιστεύθησαν
  choice: kepada mereka dipercayakan
  rationale: Bentuk pasif ini berarti sesuatu dipercayakan kepada seseorang, bukan bahwa mereka percaya. Susunan Indonesia ini mempertahankan gagasan amanat atau tanggung jawab penerima.
- source_word: τὰ λόγια
  choice: firman-firman
  rationale: Dalam konteks ini λόγια menunjuk pada pernyataan atau penyataan ilahi. “Firman-firman” jelas, bermartabat, dan mempertahankan bentuk jamaknya.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: 'Genitif diterjemahkan secara langsung sebagai kepunyaan atau asal: firman-firman yang berasal dari dan menjadi milik Allah.'
theological_decisions:
- issue: Peran orang Yahudi terhadap penyataan Allah
  choice: kepada mereka dipercayakan firman-firman Allah
  alternative: mereka menerima firman-firman Allah
  rationale: Terjemahan yang dipilih mempertahankan unsur amanat dalam ἐπιστεύθησαν tanpa menambahkan kesimpulan mengenai kesetiaan atau ketidaksetiaan mereka dalam menjalankan amanat itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Bentuk pasif “kepada mereka dipercayakan” dipertahankan karena alami dan dekat dengan struktur serta makna sumber Yunani.
