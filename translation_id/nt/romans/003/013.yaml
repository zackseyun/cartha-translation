  yaml_path: translation/nt/romans/003/013.yaml
  text: Their throat is an open grave[a]; they deceive with their tongues[c][b]; the venom of asps is under their lips.
translation:
  language: id
  text: Tenggorokan mereka adalah kubur yang terbuka; dengan lidah mereka, mereka menipu[a]; di bawah bibir mereka ada bisa ular asp[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka terus menipu dengan lidah mereka.” Bentuk imperfek kata kerja Yunani dapat menekankan tindakan yang berlangsung atau berulang.
    reason: lexical_alternative
  - marker: b
    text: “Ular asp” adalah sebutan tradisional untuk istilah Yunani ini; dapat juga diterjemahkan lebih umum sebagai “ular beludak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τάφος ἀνεῳγμένος
  choice: kubur yang terbuka
  rationale: Ungkapan ini mempertahankan gambaran kematian serta keadaan hasil dari bentuk partisip perfek pasif, sambil tetap wajar dalam bahasa Indonesia.
- source_word: λάρυγξ
  choice: tenggorokan
  rationale: Padanan modern yang jelas dan langsung bagi bagian tubuh yang dipakai dalam metafora ini.
- source_word: ἐδολιοῦσαν
  choice: mereka terus menipu
  rationale: Bentuk imperfek menunjukkan tindakan menipu melalui perkataan yang berlangsung atau berulang; kata 'terus' menyatakan aspek itu secara alami.
- source_word: ἰὸς
  choice: bisa
  rationale: Dalam kaitannya dengan ular, 'bisa' lebih tepat daripada 'racun' dalam bahasa Indonesia kontemporer.
- source_word: ἀσπίδων
  choice: ular tedung
  rationale: Istilah ini mempertahankan rujukan kepada ular berbisa jenis asp/kobra tanpa memakai kata serapan 'asp' yang kurang dikenal pembaca umum.
- source_word: ὑπὸ τὰ χείλη αὐτῶν
  choice: di balik bibir mereka
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan citra bahwa bisa yang mematikan tersembunyi serta siap keluar bersama perkataan.
