  yaml_path: translation/nt/romans/003/015.yaml
  text: Their feet are swift to shed blood,[a]
translation:
  language: id
  text: Kaki mereka cepat menumpahkan darah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Tajam kaki mereka untuk mencurahkan darah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀξεῖς
  choice: cepat
  rationale: Secara harfiah dapat berarti “tajam”, tetapi dalam ungkapan tentang kaki yang siap melakukan kekerasan, “cepat” menyampaikan maksud idiomatisnya secara alami dalam bahasa Indonesia.
- source_word: οἱ πόδες
  choice: kaki
  rationale: Padanan langsung yang mempertahankan gambaran anggota tubuh dalam teks sumber.
- source_word: αὐτῶν
  choice: mereka
  rationale: Genitif ini secara alami dinyatakan sebagai kepunyaan dalam frasa “kaki mereka”.
- source_word: ἐκχέαι
  choice: menumpahkan
  rationale: Kata ini secara dasar berarti “mencurahkan” atau “menuangkan”; bersama objek “darah”, “menumpahkan darah” merupakan ungkapan Indonesia yang wajar dan mempertahankan makna kekerasannya.
- source_word: αἷμα
  choice: darah
  rationale: Padanan baku dan langsung, tanpa alasan kontekstual untuk mengubahnya.
