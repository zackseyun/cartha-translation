  text: ⸀εἴπερ εἷς ὁ θεός, ὃς δικαιώσει περιτομὴν ἐκ πίστεως καὶ ἀκροβυστίαν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/030.yaml
  text: since God is one[c][b][a], who will justify the circumcised by faith and the uncircumcised through faith.
translation:
  language: id
  text: karena Allah itu esa, yang akan membenarkan orang-orang yang bersunat atas dasar iman dan orang-orang yang tidak bersunat melalui iman.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jika memang Allah itu esa.”
    reason: alternative_reading
  - marker: b
    text: Paulus memakai dua ungkapan berbeda, “atas dasar iman” dan “melalui iman”; perbedaannya mungkin hanya bersifat gaya bahasa, bukan kontras yang tajam.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπερ
  choice: karena
  rationale: Dalam alur argumen ini, Paulus bertolak dari keyakinan monoteistis yang diakui bersama, bukan menyatakan keraguan. Namun, kemungkinan bentuk bersyarat dicatat dalam catatan kaki.
- source_word: εἷς ὁ θεός
  choice: Allah itu esa
  rationale: Ungkapan ini mempertahankan penegasan monoteistis dalam bahasa Indonesia yang alami dan bermartabat.
- source_word: δικαιώσει
  choice: akan membenarkan
  rationale: Mempertahankan kala mendatang dan istilah Paulus yang lazim untuk tindakan Allah menyatakan atau menjadikan seseorang benar dalam kedudukan di hadapan-Nya, tanpa mempersempit nuansanya.
- source_word: περιτομήν
  choice: orang-orang bersunat
  rationale: Kata benda abstrak dipakai secara metonimis untuk menyebut orang-orang yang bersunat; terjemahan ini jelas tanpa langsung menyamakannya dengan label etnis tertentu.
- source_word: ἐκ πίστεως
  choice: berdasarkan iman
  rationale: Mempertahankan nuansa ἐκ sebagai dasar atau pangkal pembenaran dan membedakannya dari διά pada frasa berikutnya.
- source_word: ἀκροβυστίαν
  choice: orang-orang tidak bersunat
  rationale: Kata ini secara metonimis menunjuk kepada orang-orang yang tidak bersunat; pilihan ini menghindari penafsiran berlebihan sebagai semata-mata label etnis.
- source_word: διὰ τῆς πίστεως
  choice: melalui iman
  rationale: Mempertahankan perbedaan preposisi Yunani dari ἐκ πίστεως tanpa mengharuskan adanya perbedaan doktrinal yang tajam.
- source_word: πίστεως
  choice: iman
  rationale: Dalam konteks ini, 'iman' merupakan padanan Indonesia yang tepat dan lazim; tidak ada konstruksi genitif yang menuntut pilihan seperti 'kesetiaan'.
theological_decisions:
- issue: Apakah εἴπερ harus dipahami secara kausal atau bersyarat
  choice: Diterjemahkan secara kausal sebagai 'karena'.
  alternative: “jika memang Allah itu esa”
  rationale: Konteks menunjukkan bahwa Paulus menarik kesimpulan dari keesaan Allah sebagai keyakinan bersama. Bentuk bersyarat tetap merupakan kemungkinan gramatikal dan dicatat.
- issue: Apakah ἐκ πίστεως dan διὰ τῆς πίστεως menyatakan perbedaan teologis
  choice: Perbedaan preposisi dipertahankan sebagai 'berdasarkan iman' dan 'melalui iman', tanpa menetapkan kontras doktrinal.
  alternative: Menerjemahkan keduanya dengan ungkapan yang sama, misalnya 'melalui iman'.
  rationale: Teks Yunani sengaja atau secara stilistis memakai dua preposisi berbeda. Terjemahan mempertahankan bentuk tersebut sambil membiarkan terbuka apakah perbedaannya bermakna teologis atau hanya variasi gaya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Bentuk jamak 'orang-orang' memperjelas bahwa 'sunat' dan 'tidak bersunat' dalam bahasa Yunani merupakan metonimi bagi kelompok manusia. Tanda pisah membantu menunjukkan bahwa klausa berikut menerangkan tindakan Allah yang esa.
