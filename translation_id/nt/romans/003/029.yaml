  text: ἢ Ἰουδαίων ὁ θεὸς μόνον; ⸀οὐχὶ καὶ ἐθνῶν; ναὶ καὶ ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/029.yaml
  text: Or is God the God of the Jews only? Is he not also the God of the Gentiles? Yes[a], of the Gentiles also.
translation:
  language: id
  text: Atau, apakah Allah hanya Allah orang Yahudi? Bukankah Dia juga Allah bangsa-bangsa lain[a]? Ya, Dia juga Allah bangsa-bangsa lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bangsa-bangsa,” sebagai terjemahan yang lebih harfiah dari ἐθνῶν.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Atau
  rationale: Memperkenalkan pilihan retoris berikutnya dalam alur argumentasi Paulus secara alami dan langsung.
- source_word: Ἰουδαίων
  choice: orang Yahudi
  rationale: Bentuk genitif bergantung pada θεός dan secara idiomatis berarti 'Allah orang Yahudi'.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Padanan baku untuk θεός dengan artikel; nomina ini diulang dalam bahasa Indonesia pada pertanyaan kedua agar hubungan yang tersirat dalam bahasa Yunani tetap jelas.
- source_word: μόνον
  choice: hanya
  rationale: Menyampaikan pembatasan eksklusif dan mempertahankan daya retoris pertanyaan.
- source_word: οὐχὶ καὶ
  choice: Bukankah Dia juga
  rationale: οὐχί menandai pertanyaan yang mengharapkan jawaban ya; bentuk 'Bukankah' mempertahankan bentuk pertanyaan dan arah jawabannya.
- source_word: ἐθνῶν
  choice: bangsa-bangsa lain
  rationale: Dalam kontras dengan orang Yahudi, istilah ini menunjuk kepada bangsa-bangsa non-Yahudi. 'Bangsa-bangsa lain' jelas dalam bahasa Indonesia modern dan mempertahankan unsur harfiah 'bangsa-bangsa' tanpa memberi kesan geopolitik semata.
- source_word: ναὶ
  choice: Ya
  rationale: Jawaban afirmatif yang ringkas dan alami, sesuai dengan pertukaran retoris ayat ini.
- source_word: καὶ
  choice: juga
  rationale: Menambahkan bangsa-bangsa lain di samping orang Yahudi dan mempertahankan penekanan inklusif.
theological_decisions:
- issue: Makna ἐθνῶν dalam kontras dengan Ἰουδαίων
  choice: bangsa-bangsa lain
  alternative: orang bukan Yahudi; bangsa-bangsa
  rationale: Konteks membedakan orang Yahudi dari seluruh bangsa non-Yahudi. Pilihan ini menjaga dimensi kolektif ἔθνη sekaligus menyatakan kontrasnya dengan jelas, tanpa mempersempitnya menjadi negara-negara politik.
- issue: Kata θεός yang tersirat dalam klausa kedua dan jawaban penutup
  choice: Mengulangi 'Allah' demi kejelasan
  alternative: Bukankah juga bangsa-bangsa lain? Ya, bangsa-bangsa lain juga.
  rationale: 'Bahasa Yunani dapat menghilangkan θεός setelah klausa pertama, tetapi pengulangan dalam bahasa Indonesia mencegah ambiguitas dan tidak mengubah isi teologis: Allah yang satu adalah Allah orang Yahudi maupun bangsa-bangsa lain.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pertanyaan retoris dipertahankan. Kapitalisasi pronomina 'Dia' mengikuti register terjemahan Alkitab Indonesia yang lazim dan memperjelas rujukan kepada Allah.
