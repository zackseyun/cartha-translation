id: ROM.3.1
reference: Romans 3:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τί οὖν τὸ περισσὸν τοῦ Ἰουδαίου, ἢ τίς ἡ ὠφέλεια τῆς περιτομῆς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/001.yaml
  text: What then is the advantage of the Jew? Or what is the benefit of circumcision?[a][b]
translation:
  language: id
  text: Jadi, apakah kelebihan orang Yahudi? Atau apakah manfaat sunat?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “apakah nilai sunat?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Jadi, apakah
  rationale: Menjaga hubungan inferensial dengan uraian sebelumnya sekaligus menghasilkan pertanyaan retoris yang alami dalam bahasa Indonesia.
- source_word: τὸ περισσὸν
  choice: kelebihan
  rationale: Dalam konteks ini menunjuk pada hal yang istimewa atau menguntungkan; “kelebihan” mempertahankan pertanyaan tentang keistimewaan orang Yahudi tanpa menyatakan superioritas mutlak.
- source_word: τοῦ Ἰουδαίου
  choice: orang Yahudi
  rationale: Bentuk tunggal berartikel dipahami secara generik. Bahasa Indonesia tidak memerlukan artikel tertentu, dan “orang Yahudi” dapat berfungsi sebagai tunggal representatif.
- source_word: ἢ τίς
  choice: Atau apakah
  rationale: Mempertahankan kesejajaran kedua pertanyaan retoris dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: ἡ ὠφέλεια
  choice: manfaat
  rationale: Padanan modern dan jelas yang menyatakan faedah atau nilai praktis, serta tetap sedikit berbeda dari περισσόν yang diterjemahkan “kelebihan”.
- source_word: τῆς περιτομῆς
  choice: sunat
  rationale: “Sunat” adalah istilah Indonesia yang lazim bagi ritus yang disebut dalam teks; konteks menentukan bahwa yang dimaksud ialah tanda identitas perjanjian Yahudi.
theological_decisions:
- issue: Apakah Ἰουδαίου diterjemahkan sebagai tunggal generik atau bentuk jamak
  choice: orang Yahudi
  alternative: orang-orang Yahudi
  rationale: Teks Yunani memakai bentuk tunggal representatif. Bentuk “orang Yahudi” mempertahankan gaya retoris Paulus dan tetap alami dalam bahasa Indonesia tanpa membatasi rujukan pada satu individu tertentu.
- issue: Nuansa τὸ περισσὸν sebagai keunggulan atau keuntungan
  choice: kelebihan
  alternative: keuntungan
  rationale: “Kelebihan” mempertahankan gagasan tentang hal yang membedakan atau istimewa, sedangkan “keuntungan” dapat terlalu menyempitkan makna pada manfaat pragmatis dan bertumpang tindih dengan ὠφέλεια.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Pertanyaan retoris serta perbedaan ringan antara περισσόν (“kelebihan”) dan ὠφέλεια (“manfaat”) dipertahankan. Tidak diperlukan catatan khusus untuk bentuk tunggal representatif karena “orang Yahudi” secara alami dapat dibaca secara generik dalam bahasa Indonesia.
