  text: τί γάρ; εἰ ἠπίστησάν τινες, μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ θεοῦ καταργήσει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/003.yaml
  text: What then? If some were unfaithful[a], will their unfaithfulness nullify God's faithfulness?
translation:
  language: id
  text: Lalu bagaimana? Jika sebagian orang tidak setia, apakah ketidaksetiaan mereka akan membatalkan kesetiaan Allah?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “iman Allah.” Frasa Yunani ini secara harfiah berarti “iman Allah”, tetapi dalam konteks ini kemungkinan besar menunjuk pada kesetiaan Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: Jadi, bagaimana?
  rationale: Ungkapan ini menandai peralihan argumentatif dan memperkenalkan pertanyaan retoris. Bentuk ini alami dalam bahasa Indonesia modern tanpa memperluas maknanya.
- source_word: ἠπίστησάν
  choice: tidak setia
  rationale: ἀπιστέω dapat berarti tidak percaya, tetapi kesejajarannya dengan ἀπιστία dan pertentangannya dengan πίστις Allah mendukung nuansa ketidaksetiaan dalam konteks ini.
- source_word: τινες
  choice: sebagian orang
  rationale: Kata ini menunjuk sejumlah orang yang tidak ditentukan; 'sebagian orang' jelas dan alami dalam bahasa Indonesia.
- source_word: ἡ ἀπιστία αὐτῶν
  choice: ketidaksetiaan mereka
  rationale: Pilihan ini mempertahankan hubungan leksikal dengan verba ἠπίστησάν serta kontras retoris dengan kesetiaan Allah.
- source_word: τὴν πίστιν τοῦ θεοῦ
  choice: kesetiaan Allah
  rationale: Secara harfiah konstruksi ini adalah 'iman Allah', tetapi dalam konteks kontras dengan ketidaksetiaan manusia, πίστις paling wajar menyatakan kesetiaan atau keterandalan Allah. Alternatif harfiah dipertahankan dalam catatan kaki.
- source_word: καταργήσει
  choice: akan membatalkan
  rationale: καταργέω di sini berarti menjadikan tidak berlaku atau tidak efektif. 'Membatalkan' menyampaikan daya pertanyaan retoris dengan jelas.
theological_decisions:
- issue: Makna πίστιν τοῦ θεοῦ dalam ungkapan Paulus yang dapat diperdebatkan
  choice: kesetiaan Allah
  alternative: iman Allah
  rationale: Kontras antara ἀπιστία manusia dan πίστις Allah paling kuat mendukung sifat Allah yang setia. Namun, karena bentuk Yunani secara harfiah dapat diterjemahkan 'iman Allah', alternatif itu dicatat agar ambiguitas leksikal tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Struktur pertanyaan retoris dipertahankan, begitu pula pengulangan 'tidak setia/ketidaksetiaan' dan kontrasnya dengan 'kesetiaan Allah'.
