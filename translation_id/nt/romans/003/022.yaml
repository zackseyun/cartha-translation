- from: Namun, kebenaran Allah melalui iman kepada Yesus Sang Mesias[b] tersedia bagi semua orang yang percaya, sebab tidak ada perbedaan.
  to: Tetapi kebenaran Allah[a] melalui iman kepada Yesus Sang Mesias[b] bagi semua orang yang percaya, sebab tidak ada perbedaan.
  rationale: Revisi menambahkan catatan kaki [a] yang telah dipersyaratkan oleh keputusan leksikal dan catatan penerjemahan, menghapus “tersedia” yang bukan unsur eksplisit sumber, serta memakai “Tetapi” sebagai padanan δέ yang lebih netral. Ambiguitas konstruksi πίστεως Ἰησοῦ Χριστοῦ tetap dipelihara melalui catatan [b].
