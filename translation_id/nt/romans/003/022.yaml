  text: δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ, εἰς ⸀πάντας τοὺς πιστεύοντας, οὐ γάρ ἐστιν διαστολή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/022.yaml
  text: And the righteousness of God through faith in Jesus the Messiah[a], for all who believe[b]; for there is no distinction.
translation:
  language: id
  text: Tetapi kebenaran Allah[a] melalui iman kepada Yesus Sang Mesias[b] bagi semua orang yang percaya, sebab tidak ada perbedaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan Allah.”
    reason: lexical_alternative
  - marker: b
    text: Atau “melalui kesetiaan Yesus Sang Mesias.”
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοσύνη
  choice: kebenaran
  rationale: Dalam pemakaian Paulus, kata ini dapat mencakup sifat dan tindakan Allah yang benar serta kedudukan benar yang berkaitan dengan-Nya. 'Kebenaran' adalah padanan Indonesia yang paling mapan dan cukup luas; kemungkinan nuansa 'keadilan' dicatat dalam catatan kaki.
- source_word: θεοῦ
  choice: Allah
  rationale: Genitif diterjemahkan secara transparan sebagai 'kebenaran Allah', tanpa mempersempitnya menjadi 'kebenaran dari Allah'.
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: melalui iman kepada Yesus Sang Mesias
  rationale: Bacaan genitif objektif dipakai dalam teks utama karena alami dan umum dalam bahasa Indonesia, sedangkan bacaan genitif subjektif yang sungguh diperdebatkan dipertahankan dalam catatan kaki.
- source_word: Χριστοῦ
  choice: Sang Mesias
  rationale: Χριστός diperlakukan sebagai gelar dan diterjemahkan 'Sang Mesias', bentuk Indonesia yang wajar dan bermartabat.
- source_word: εἰς πάντας τοὺς πιστεύοντας
  choice: tersedia bagi semua orang yang percaya
  rationale: Kata 'tersedia' melengkapi klausa nominal yang terputus secara alami dalam bahasa Indonesia dan mengungkapkan arah εἰς tanpa mengubah cakupan universal yang dibatasi oleh 'yang percaya'.
- source_word: διαστολή
  choice: perbedaan
  rationale: Dalam konteks ini 'perbedaan' lebih alami bagi pembaca umum daripada 'pembedaan' atau 'distingsi' dan menyampaikan bahwa tidak ada perbedaan dalam hal yang sedang dibahas.
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ
  choice: iman kepada Yesus Sang Mesias
  alternative: kesetiaan Yesus Sang Mesias
  rationale: Susunan genitif Yunani memungkinkan iman yang diarahkan kepada Yesus maupun kesetiaan milik Yesus. Teks utama memakai bacaan objektif yang lebih lazim, tetapi catatan kaki menjaga alternatif subjektif agar ketegangan teologis tidak dihapus.
- issue: δικαιοσύνη θεοῦ
  choice: kebenaran Allah
  alternative: keadilan Allah
  rationale: Ungkapan ini dapat menunjuk pada kebenaran Allah dalam sifat dan tindakan-Nya serta pada kebenaran yang berkaitan dengan pemberian-Nya. Bentuk genitif dipertahankan, sementara alternatif leksikal dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Penanda catatan [b] ditempatkan setelah seluruh frasa yang diperdebatkan; penanda [a] perlu ditempatkan sesudah 'kebenaran Allah' dalam teks utama.
