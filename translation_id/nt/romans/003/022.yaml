    rationale: Alternatif “keadilan Allah” perlu dicantumkan dan dijangkarkan setelah “kebenaran Allah” agar audit trail dan teks yang diterbitkan selaras.
  - severity: low
    issue: Kata “tersedia” menambahkan predikasi yang tidak eksplisit dalam teks Yunani.
    rationale: εἰς πάντας τοὺς πιστεύοντας menyatakan arah/cakupan kepada semua yang percaya, bukan secara khusus bahwa kebenaran itu “tersedia.” Bahasa Indonesia tidak mengharuskan penambahan verba ini.
  - severity: low
    issue: “Namun” dapat memberi kontras yang lebih kuat daripada δέ.
    rationale: “Tetapi” merupakan penghubung yang lebih netral untuk δέ dalam konteks kelanjutan argumentasi Paulus.
  revised_text: Tetapi kebenaran Allah[a] melalui iman kepada Yesus Sang Mesias[b] bagi semua orang yang percaya, sebab tidak ada perbedaan.
