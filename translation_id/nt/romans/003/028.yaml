  text: λογιζόμεθα ⸀γὰρ ⸂δικαιοῦσθαι πίστει⸃ ἄνθρωπον χωρὶς ἔργων νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/028.yaml
  text: For we conclude that a person is justified by faith apart from works of the law[a][b].
translation:
  language: id
  text: Sebab kami menyimpulkan bahwa seseorang dibenarkan oleh iman, terlepas dari perbuatan hukum Taurat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dinyatakan benar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζόμεθα
  choice: kami menyimpulkan
  rationale: Verba ini menyatakan penilaian yang dihasilkan dari rangkaian argumen Paulus. 'Kami menyimpulkan' alami dalam bahasa Indonesia dan mempertahankan daya argumentatifnya.
- source_word: γάρ
  choice: sebab
  rationale: Konjungsi ini memberi dasar atau penjelasan bagi uraian sebelumnya. 'Sebab' mempertahankan hubungan logis tersebut secara ringkas.
- source_word: δικαιοῦσθαι
  choice: dibenarkan
  rationale: '''Dibenarkan'' merupakan padanan teologis yang mapan dan tetap memungkinkan nuansa deklaratif-forensik tanpa mempersempit maknanya dalam teks utama.'
- source_word: πίστει
  choice: melalui iman
  rationale: Datif πίστει menyatakan sarana. 'Melalui iman' merupakan ungkapan Indonesia yang jelas dan tidak mengesankan bahwa iman adalah dasar jasa.
- source_word: ἄνθρωπον
  choice: manusia
  rationale: Ἄνθρωπον berbentuk maskulin secara gramatikal, tetapi bersifat generik dalam konteks ini. 'Manusia' mencakup setiap orang tanpa memberi kesan bahwa yang dimaksud hanya laki-laki.
- source_word: χωρὶς
  choice: terlepas dari
  rationale: Padanan ini mempertahankan gagasan pemisahan atau pengecualian dalam kontras Paulus.
- source_word: ἔργων νόμου
  choice: perbuatan-perbuatan hukum Taurat
  rationale: Padanan ini menjaga hubungan formal antara ἔργων dan νόμου serta ungkapan khas Paulus. 'Hukum Taurat' secara wajar menunjuk pada hukum yang dibicarakan dalam konteks Roma dan tidak mereduksinya menjadi usaha moral secara umum.
theological_decisions:
- issue: Nuansa δικαιοῦσθαι dalam pemakaian Paulus
  choice: dibenarkan
  alternative: dinyatakan benar
  rationale: Teks utama memakai istilah Indonesia yang mapan dan cukup luas untuk mempertahankan bobot teologisnya; catatan kaki menyajikan nuansa deklaratif sebagai alternatif tanpa memaksakannya sebagai satu-satunya penjelasan.
- issue: Cakupan ἄνθρωπον yang generik
  choice: manusia
  alternative: seseorang; seorang laki-laki
  rationale: Dalam ayat ini nomina maskulin tersebut mewakili manusia secara umum, bukan khusus laki-laki. 'Manusia' paling dekat dengan bentuk tunggal kolektif dan universal dari sumber.
- issue: Hubungan iman dan perbuatan hukum Taurat
  choice: melalui iman, terlepas dari perbuatan-perbuatan hukum Taurat
  alternative: oleh iman, tanpa perbuatan hukum Taurat
  rationale: Rumusan ini mempertahankan kontras eksplisit dalam bahasa Yunani tanpa menjelaskan lebih jauh jenis iman atau cakupan perbuatan tersebut, sehingga ketegangan teologis teks tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur argumentasi Paulus, sedangkan istilah 'dibenarkan', 'iman', dan 'hukum Taurat' menjaga kesinambungan kosakata teologis yang lazim dipahami pembaca Alkitab Indonesia.
