id: ROM.3.8
reference: Romans 3:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ μὴ καθὼς βλασφημούμεθα καὶ καθώς φασίν τινες ἡμᾶς λέγειν ὅτι Ποιήσωμεν τὰ κακὰ ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/008.yaml
  text: And why not say—as we are slandered and as some claim that we say—“Let us do evil so that good may come”? Their condemnation is just[a][b].
translation:
  language: id
  text: Dan mengapa tidak berkata—sebagaimana kami difitnah dan sebagaimana beberapa orang menyatakan bahwa kami berkata—“Marilah kita berbuat jahat supaya kebaikan datang”? Penghukuman mereka adil.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Dan bukan—sebagaimana kami difitnah dan sebagaimana beberapa orang mengatakan bahwa kami berkata—‘Marilah kita berbuat jahat supaya kebaikan datang’?” Ungkapan Yunani pada awal ayat bersifat eliptis dan meneruskan pertanyaan dari ayat sebelumnya.'
    reason: lexical_alternative
  - marker: b
    text: “Mereka” merujuk kepada orang-orang yang melontarkan atau membenarkan tuduhan dan penalaran tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: βλασφημούμεθα
  choice: kami difitnah
  rationale: Dalam konteks ini, kata kerja tersebut menunjuk pada penyajian ajaran Paulus secara palsu dan bermusuhan, bukan terutama penghujatan langsung terhadap Allah.
- source_word: φασίν τινες
  choice: beberapa orang menyatakan
  rationale: Pilihan ini menyampaikan adanya klaim atau tuduhan dari pihak tertentu, tanpa menambahkan gagasan bahwa Paulus benar-benar mengajarkannya.
- source_word: λέγειν
  choice: bahwa kami berkata
  rationale: Menerjemahkan infinitif secara langsung; 'mengajarkan' akan menafsirkan melampaui kata sumber.
- source_word: Ποιήσωμεν
  choice: Marilah kita berbuat
  rationale: Bentuk subjungtif orang pertama jamak bersifat ajakan, yang wajar dinyatakan dengan 'Marilah kita'.
- source_word: τὰ κακὰ
  choice: jahat
  rationale: Ungkapan Yunani berartikel ini menunjuk pada hal-hal atau tindakan yang jahat; dalam kalimat Indonesia, 'berbuat jahat' alami dan tepat.
- source_word: ἵνα ἔλθῃ τὰ ἀγαθά
  choice: supaya kebaikan datang
  rationale: Mempertahankan nuansa tujuan atau hasil dari ἵνα dan pola kontras antara kejahatan dan kebaikan.
- source_word: κρίμα
  choice: penghukuman
  rationale: Di sini kata tersebut menunjuk pada putusan yang merugikan atau kecaman yudisial, bukan sekadar penilaian netral.
- source_word: ἔνδικόν
  choice: adil
  rationale: 'Mempertahankan bobot forensik dan moral: penghukuman itu sesuai dengan keadilan.'
- source_word: καὶ μὴ
  choice: Dan mengapa tidak berkata
  rationale: Ungkapan Yunani ini eliptis dan meneruskan pertanyaan dari konteks sebelumnya. Tambahan 'mengapa' membuat maksud tersiratnya jelas dalam bahasa Indonesia tanpa mengubah arah argumen.
theological_decisions:
- issue: Rujukan ὧν dalam frasa ὧν τὸ κρίμα
  choice: Mempertahankan bentuk pronominal sebagai 'mereka' dalam teks utama
  alternative: Menjelaskannya langsung sebagai 'orang-orang yang menuduh kami' atau 'orang-orang yang mengatakan demikian'
  rationale: Bahasa Yunani memakai kata ganti relatif jamak dan tidak menguraikan kelompok itu di dalam klausa terakhir. Teks utama mempertahankan kepadatan dan sedikit keterbukaan rujukannya, sedangkan catatan menjelaskan rujukan yang paling wajar dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada argumentatif yang tetap bermartabat. Tanda pisah mempertahankan sisipan panjang dalam bahasa Yunani, sedangkan kutipan langsung menonjolkan slogan yang secara palsu dinisbatkan kepada Paulus.
