  text: ἐν τῇ ἀνοχῇ τοῦ θεοῦ, πρὸς ⸀τὴν ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ ἐν τῷ νῦν καιρῷ, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/026.yaml
  text: in God's forbearance[a], for the demonstration of his righteousness at the present time[c][b], so that he might be just and the justifier of the one who has faith in Jesus.
translation:
  language: id
  text: dalam sikap Allah menahan diri, untuk memperlihatkan keadilan-Nya pada waktu sekarang ini, supaya terbukti bahwa Ia adil dan membenarkan orang yang beriman kepada Yesus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kebenaran-Nya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “orang yang berlandaskan kesetiaan Yesus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνοχῇ
  choice: kesabaran
  rationale: Dalam konteks ini, kata tersebut menunjuk pada kesabaran Allah yang menahan pelaksanaan hukuman dengan sengaja; 'kesabaran' alami dalam bahasa Indonesia, sedangkan nuansa menahan diri dijelaskan oleh konteks.
- source_word: ἔνδειξιν
  choice: menunjukkan
  rationale: Bentuk verbal ini menyampaikan daya demonstratif atau penampakan bukti dari nomina Yunani secara alami dalam bahasa Indonesia.
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: '''Kebenaran'' merupakan padanan Indonesia yang lazim bagi δικαιοσύνη dan tetap dapat mencakup integritas moral serta keadilan Allah; alternatif ''keadilan'' dicatat dalam catatan kaki.'
- source_word: νῦν καιρῷ
  choice: pada masa sekarang
  rationale: Ungkapan ini alami dan mempertahankan penekanan temporal νῦν καιρός.
- source_word: δίκαιον
  choice: adil
  rationale: '''Adil'' cocok dengan konteks yudisial dan berhubungan secara alami dengan tindakan Allah yang membenarkan.'
- source_word: δικαιοῦντα
  choice: membenarkan
  rationale: Partisipel aktif ini menyatakan Allah sebagai pihak yang menyatakan atau menjadikan seseorang benar dalam kedudukan yudisial; verba Indonesia mempertahankan kaitannya dengan δικαιοσύνη.
- source_word: ἐκ πίστεως Ἰησοῦ
  choice: orang yang beriman kepada Yesus
  rationale: Teks utama memakai pemahaman genitif objektif yang lazim dan mudah dipahami, sambil mempertahankan kemungkinan genitif subjektif mengenai kesetiaan Yesus dalam catatan kaki.
theological_decisions:
- issue: Makna ἐκ πίστεως Ἰησοῦ
  choice: orang yang beriman kepada Yesus
  alternative: orang yang berasal dari kesetiaan Yesus
  rationale: Konstruksi genitif ini sungguh diperdebatkan. Teks utama memakai pembacaan objektif yang lazim, sementara pembacaan subjektif dipertahankan dalam catatan kaki agar ketegangan teologis tidak dihapus.
- issue: Hubungan δίκαιον dan δικαιοῦντα
  choice: Ia adil dan membenarkan
  alternative: Ia benar dan menyatakan benar
  rationale: Pilihan ini mempertahankan tekanan forensik Paulus sekaligus hubungan semantis antara sifat Allah dan tindakan-Nya, tanpa menentukan mekanisme pembenaran lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang bermartabat dan mudah dipahami. Susunan klausa mengikuti alur argumentasi Yunani, tetapi dibuat alami dalam bahasa Indonesia. Frasa 'supaya nyata bahwa' mengungkapkan tujuan εἰς τὸ εἶναι tanpa menghasilkan konstruksi Indonesia yang kaku.
