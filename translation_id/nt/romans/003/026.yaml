  naturalness: Teks revisi tetap baku dan alami. “Pada waktu sekarang ini” lebih idiomatis daripada “pada masa sekarang,” dan “supaya terbukti bahwa” secara wajar menyampaikan tujuan demonstratif dari εἰς τὸ εἶναι.
  terminology: “Adil” dan “membenarkan” mempertahankan hubungan yudisial antara δίκαιον dan δικαιοῦντα. Catatan alternatif untuk ἐκ πίστεως Ἰησοῦ diperbaiki karena “berasal dari kesetiaan Yesus” tidak alami dan kurang tepat sebagai ungkapan Indonesia.
