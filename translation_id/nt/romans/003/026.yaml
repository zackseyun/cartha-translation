revisions:
- from: dalam kesabaran Allah, untuk menunjukkan kebenaran-Nya pada masa sekarang, supaya nyata bahwa Ia adil dan membenarkan orang yang beriman kepada Yesus.[a][b]
  to: dalam sikap Allah menahan diri, untuk memperlihatkan keadilan-Nya pada waktu sekarang ini, supaya terbukti bahwa Ia adil dan membenarkan orang yang beriman kepada Yesus.[a][b]
  rationale: Revisi mengganti “kebenaran-Nya” dengan “keadilan-Nya” agar δικαιοσύνη tidak disalahpahami sebagai kebenaran proposisional dan agar alur istilah yudisial ayat ini jelas. “Sikap Allah menahan diri” menerjemahkan ἀνοχή dengan nuansa penundaan penghukuman yang disengaja. Pembacaan utama atas ἐκ πίστεως Ἰησοῦ dipertahankan, sementara pembacaan alternatif yang diperdebatkan tetap tersedia dalam catatan kaki dengan rumusan yang lebih alami.
