id: ROM.3.9
reference: Romans 3:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τί οὖν; προεχόμεθα; οὐ πάντως, προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ’ ἁμαρτίαν εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/009.yaml
  text: What then? Are we better? Not at all[a], for we have already charged that both Jews and Greeks are all under sin[b],
translation:
  language: id
  text: Jadi, bagaimana? Apakah kita lebih baik? Sama sekali tidak[a], sebab sebelumnya kita sudah menuduh bahwa baik orang Yahudi maupun orang Yunani semuanya berada di bawah dosa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah kita memiliki keunggulan?”
    reason: alternative_reading
  - marker: b
    text: Atau, “semuanya berada di bawah kuasa dosa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Jadi, bagaimana?
  rationale: Ungkapan ini mempertahankan penanda kesimpulan οὖν dan pertanyaan singkat yang meneruskan alur argumentasi Paulus tanpa menambahkan isi.
- source_word: προεχόμεθα
  choice: Apakah kita lebih baik?
  rationale: Bentuk tengah verba ini diperdebatkan. Dalam konteksnya, pertanyaan tersebut menyangkut kedudukan komparatif orang Yahudi; pilihan ini alami dalam bahasa Indonesia dan tetap menyisakan kemungkinan makna 'memiliki keunggulan' dalam catatan kaki.
- source_word: οὐ πάντως
  choice: Sama sekali tidak
  rationale: Pilihan ini menyampaikan penyangkalan yang tegas dan idiomatis.
- source_word: προῃτιασάμεθα
  choice: sebelumnya kami sudah menuduh
  rationale: Verba ini menunjuk pada tuduhan yang telah dikemukakan lebih dahulu dan mempertahankan nuansa forensik argumen Paulus.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: baik orang Yahudi maupun orang Yunani
  rationale: Konstruksi berpasangan τε καὶ dipertahankan secara wajar, sementara istilah 'orang Yunani' mengikuti sebutan yang benar-benar terdapat dalam teks sumber.
- source_word: πάντας
  choice: semuanya
  rationale: Kata ini menegaskan keseluruhan anggota kedua kelompok tanpa memperluas makna.
- source_word: ὑφ’ ἁμαρτίαν εἶναι
  choice: berada di bawah dosa
  rationale: Terjemahan yang dekat secara formal ini mempertahankan metafora ketundukan kepada dosa dan tidak langsung menjelaskannya sebagai 'kuasa' atau 'kekuasaan' dosa.
theological_decisions:
- issue: Makna kata ganti orang pertama jamak dalam προεχόμεθα
  choice: 'Pertanyaan itu diterjemahkan sebagai perbandingan kedudukan: ''Apakah kita lebih baik?'''
  alternative: Pertanyaan itu dapat dipahami sebagai 'Apakah kita memiliki keunggulan?'
  rationale: Konteks Roma 3:1–9 membahas hak istimewa sekaligus pertanggungjawaban orang Yahudi. Teks utama mempertahankan penyangkalan terhadap superioritas komparatif, sedangkan kemungkinan makna tentang keunggulan tetap disajikan dalam catatan kaki.
- issue: Makna berada 'di bawah dosa'
  choice: Metafora ringkas 'berada di bawah dosa' dipertahankan.
  alternative: Frasa itu dapat dijelaskan sebagai 'berada di bawah kuasa dosa'.
  rationale: Bahasa sumber menyatakan ketundukan dengan frasa yang padat. Mempertahankan metafora mencegah terjemahan menetapkan secara berlebihan sifat hubungan tersebut, sementara penjelasan yang masuk akal dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pertanyaan dibuat ringkas sesuai gaya argumentatif Paulus. Kata 'kami' dalam klausa alasan membedakan bentuk verba orang pertama jamak dari 'kita' pada pertanyaan, tetapi rujukan kelompok dalam wacana tetap ditentukan oleh konteks.
