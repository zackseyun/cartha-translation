  text: Νυνὶ δὲ χωρὶς νόμου δικαιοσύνη θεοῦ πεφανέρωται, μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/021.yaml
  text: But now[a], apart from the law, the righteousness of God has been revealed, attested by the Law and the Prophets[c][b],
translation:
  language: id
  text: Namun sekarang, di luar hukum Taurat, kebenaran Allah[a] telah dinyatakan, yang disaksikan oleh Taurat dan kitab para nabi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa ini juga dapat dipahami sebagai “keadilan Allah” atau “kebenaran yang berasal dari Allah.”
    reason: lexical_and_genitive_ambiguity
  - marker: b
    text: “Taurat dan kitab para nabi” merupakan sebutan bagi Kitab Suci Israel.
    reason: canonical_designation
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Namun sekarang
  rationale: Mempertahankan daya temporal sekaligus kontras yang menandai peralihan kuat dalam uraian Paulus.
- source_word: χωρὶς νόμου
  choice: di luar hukum Taurat
  rationale: χωρίς menyatakan keterpisahan; dalam konteks ini νόμος menunjuk pada hukum Musa. Ungkapan ini tidak berarti bahwa Kitab Taurat tidak memberi kesaksian, sebagaimana ditegaskan pada akhir ayat.
- source_word: δικαιοσύνη θεοῦ
  choice: kebenaran Allah
  rationale: Ungkapan genitif Yunani dibiarkan cukup terbuka untuk mencakup kebenaran yang berkaitan dengan Allah—karakter dan tindakan-Nya—tanpa langsung membatasinya menjadi hanya 'yang berasal dari Allah'.
- source_word: πεφανέρωται
  choice: telah dinyatakan
  rationale: Bentuk perfektum menyatakan penyingkapan yang sudah terjadi dengan hasil yang tetap berlaku sekarang.
- source_word: μαρτυρουμένη
  choice: sebagaimana disaksikan
  rationale: Mengungkapkan fungsi partisipel pasif secara alami dalam bahasa Indonesia dan mempertahankan gagasan kesaksian yang menyertai pernyataan tersebut.
- source_word: ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν
  choice: oleh Kitab Taurat dan Kitab Para Nabi
  rationale: Menunjukkan dua bagian utama Kitab Suci Israel, bukan sekadar ketentuan hukum dan orang-orang yang bernubuat.
theological_decisions:
- issue: Makna genitif dalam δικαιοσύνη θεοῦ
  choice: kebenaran Allah
  alternative: kebenaran yang berasal dari Allah; keadilan Allah
  rationale: Pilihan utama mempertahankan ketegangan antara kebenaran sebagai sifat dan tindakan Allah serta kebenaran yang dikaruniakan-Nya, tanpa menetapkan satu tafsiran teologis secara eksklusif.
- issue: Hubungan 'di luar hukum Taurat' dengan kesaksian Kitab Taurat
  choice: Membedakan dasar atau cara penyataan kebenaran dari kesaksian Kitab Suci tentangnya
  alternative: Menafsirkan frasa itu sebagai penolakan terhadap seluruh Kitab Taurat
  rationale: Kalimat Yunani sendiri segera menyatakan bahwa Taurat dan Para Nabi memberi kesaksian, sehingga terjemahan harus menjaga paradoks yang disengaja itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Hukum Taurat' dipakai untuk νόμος dalam konteks ini, sedangkan 'Kitab Taurat dan Kitab Para Nabi' memperjelas sebutan kanonis pada akhir ayat. Semua penanda catatan kaki ditempatkan langsung dalam teks.
