revisions:
- from: Namun sekarang, di luar hukum Taurat, kebenaran Allah[a] telah dinyatakan, sebagaimana disaksikan oleh Kitab Taurat dan Kitab Para Nabi[b].
  to: Namun sekarang, di luar hukum Taurat, kebenaran Allah[a] telah dinyatakan, yang disaksikan oleh Taurat dan kitab para nabi[b].
  rationale: Revisi terbatas pada kelancaran dan ketepatan hubungan sintaksis. “Yang disaksikan oleh” lebih langsung merepresentasikan partisipel pasif μαρτυρουμένη, dan “Taurat dan kitab para nabi” memakai idiom Indonesia yang lebih wajar untuk sebutan kanonis tanpa mengubah makna.
