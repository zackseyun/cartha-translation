  text: There is no one who understands[a]; there is no one who seeks God.
translation:
  language: id
  text: Tidak ada seorang pun yang mengerti; tidak ada seorang pun yang mencari Allah[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencari Allah dengan tekun” atau “mencari Allah dengan sungguh-sungguh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίων
  choice: mengerti
  rationale: Partisipel ini menyatakan kemampuan memahami atau menangkap dengan wawasan. “Mengerti” alami dalam bahasa Indonesia modern dan tetap mempertahankan makna dasarnya.
- source_word: ἐκζητῶν
  choice: mencari
  rationale: Kata kerja majemuk ini dapat menyiratkan pencarian yang sungguh-sungguh atau tekun, tetapi “mencari Allah” paling alami dan jelas dalam bahasa Indonesia. Nuansa yang lebih kuat dicantumkan dalam catatan kaki.
- source_word: οὐκ ἔστιν
  choice: tidak seorang pun
  rationale: Ungkapan ini menyampaikan penyangkalan universal secara tegas dan idiomatis dalam bahasa Indonesia, serta mempertahankan pengulangannya dalam teks Yunani.
- source_word: ὁ συνίων / ὁ ἐκζητῶν
  choice: yang mengerti / yang mencari
  rationale: Partisipel substantival Yunani dialihkan menjadi klausa relatif, bentuk yang alami dalam bahasa Indonesia tanpa mengurangi maknanya.
- source_word: τὸν θεόν
  choice: Allah
  rationale: “Allah” adalah padanan baku dan alami bagi θεός ketika menunjuk kepada Allah dalam konteks ini.
theological_decisions:
- issue: Cakupan penyangkalan dalam kutipan berantai Paulus
  choice: 'Mempertahankan dua penyangkalan mutlak: “Tidak seorang pun ...; tidak seorang pun ....”'
  alternative: “Tidak seorang pun yang benar-benar mengerti; tidak seorang pun yang sungguh-sungguh mencari Allah.”
  rationale: Teks Yunani menyatakan penyangkalan kategoris. Terjemahan tidak melunakkannya dengan penjelasan interpretatif atau pembatas tambahan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “tidak seorang pun” dipertahankan untuk mencerminkan struktur dan tekanan retoris teks sumber.
