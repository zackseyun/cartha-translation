- source_word: ἐν ταῖς ὁδοῖς αὐτῶν
  choice: ada di jalan-jalan mereka
  rationale: Mempertahankan citra konkret jalan sekaligus memungkinkan makna kiasan tentang perilaku atau arah hidup mereka.
- source_word: καὶ
