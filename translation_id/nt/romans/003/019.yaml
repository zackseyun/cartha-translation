    issue: “Ditujukannya” tidak secara alami menerjemahkan λαλεῖ.
    rationale: λαλεῖ menyatakan bahwa hukum berbicara kepada orang-orang yang berada dalam lingkupnya. Dalam bahasa Indonesia, “ditujukan kepada” lebih mudah dipahami sebagai arah atau sasaran suatu benda/pesan daripada tindakan hukum yang berbicara.
  - severity: low
    issue: Susunan “segala sesuatu yang dikatakan hukum Taurat” kurang idiomatis.
    rationale: Penambahan “oleh” dan pilihan “apa pun” membuat klausa relatif ini lebih alami dalam bahasa Indonesia baku tanpa mengubah cakupan ὅσα.
