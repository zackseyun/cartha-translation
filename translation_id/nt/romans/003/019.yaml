  text: Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/019.yaml
  text: We know that whatever the law says[a], it speaks to those under the law[c][b], so that every mouth may be stopped and the whole world may become accountable to God.
translation:
  language: id
  text: Kita tahu bahwa apa pun yang dikatakan oleh hukum Taurat, disampaikannya kepada mereka yang berada di bawah hukum Taurat, supaya setiap mulut dibungkam dan seluruh dunia menjadi bertanggung jawab kepada Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “harus memberikan pertanggungjawaban kepada Allah”; dapat juga dipahami, “berada di bawah penghakiman Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν δὲ
  choice: Kita tahu bahwa
  rationale: Bentuk kini menyatakan pengetahuan bersama. Partikel δέ tidak perlu diterjemahkan secara tersendiri karena hubungan wacananya sudah alami dalam konteks bahasa Indonesia.
- source_word: ὅσα ὁ νόμος λέγει
  choice: segala sesuatu yang dikatakan hukum Taurat
  rationale: Mempertahankan cakupan jamak-netral ὅσα dan memaknai νόμος sebagai hukum Taurat yang berbicara sebagai otoritas yang dikenal.
- source_word: τοῖς ἐν τῷ νόμῳ λαλεῖ
  choice: ditujukannya kepada mereka yang berada di bawah hukum Taurat
  rationale: Ungkapan harfiah 'mereka yang berada di dalam hukum' dinyatakan dengan idiom Indonesia yang menunjukkan lingkup atau kewenangan hukum. 'Ditujukannya' menyampaikan bahwa perkataan hukum itu berbicara kepada kelompok tersebut.
- source_word: ἵνα πᾶν στόμα φραγῇ
  choice: supaya setiap mulut dibungkam
  rationale: 'Mempertahankan metafora konkret dan daya forensik verba pasif φραγῇ: tidak ada pembelaan yang dapat diajukan.'
- source_word: καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ
  choice: dan seluruh dunia menjadi bertanggung jawab kepada Allah
  rationale: '''Menjadi'' mempertahankan γένηται, sedangkan ''bertanggung jawab kepada Allah'' membawa nuansa hukum ὑπόδικος tanpa langsung memperkuatnya menjadi vonis ''dinyatakan bersalah''.'
theological_decisions:
- issue: Daya hukum ὑπόδικος di hadapan Allah
  choice: bertanggung jawab kepada Allah
  alternative: bersalah di hadapan Allah; berada di bawah penghakiman Allah
  rationale: Pilihan ini mempertahankan gambaran universal tentang manusia yang harus memberikan pertanggungjawaban di hadapan pengadilan Allah, tanpa memastikan bahwa adjektiva itu sendiri sudah menyatakan putusan bersalah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'hukum Taurat' dipertahankan demi kejelasan rujukan. Metafora 'setiap mulut dibungkam' dipertahankan karena kuat, mudah dipahami, dan sesuai dengan suasana pengadilan dalam ayat ini.
