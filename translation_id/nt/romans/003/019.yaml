  to: Kita tahu bahwa apa pun yang dikatakan oleh hukum Taurat, disampaikannya kepada mereka yang berada di bawah hukum Taurat, supaya setiap mulut dibungkam dan seluruh dunia menjadi bertanggung jawab kepada Allah.[a]
