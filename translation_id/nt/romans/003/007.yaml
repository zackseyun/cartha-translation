  text: εἰ ⸀δὲ ἡ ἀλήθεια τοῦ θεοῦ ἐν τῷ ἐμῷ ψεύσματι ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ, τί ἔτι κἀγὼ ὡς ἁμαρτωλὸς κρίνομαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/007.yaml
  text: But if God’s truthfulness has abounded through my lie for his glory, why am I still being judged as a sinner?
translation:
  language: id
  text: Namun, jika kebenaran Allah[a] makin berlimpah melalui kebohonganku[b] untuk kemuliaan-Nya[c], mengapa aku pun masih dihakimi sebagai orang berdosa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sifat Allah yang benar” atau “kejujuran Allah.”
    reason: alternatif leksikal untuk ἀλήθεια τοῦ θεοῦ; teks utama mempertahankan keluasan ungkapan sumber.
  - marker: b
    text: Atau “melalui kepalsuanku.”
    reason: alternatif leksikal untuk ψεῦσματι.
  - marker: c
    text: Secara harfiah, “kepada kemuliaan-Nya”; ungkapan ini dapat menyatakan arah/hasil dan, dalam konteks, juga dapat dipahami bernuansa tujuan.
    reason: alternatif leksikal untuk εἰς τὴν δόξαν αὐτοῦ.
lexical_decisions:
- source_word: ἀλήθεια τοῦ θεοῦ
  choice: kesetiaan Allah pada kebenaran
  rationale: Dalam konteks Roma 3:4–7, ungkapan ini berlawanan dengan kebohongan manusia dan menunjuk pada sifat Allah yang benar serta dapat dipercaya. Rumusan ini mengungkapkan nuansa moral-relasional tanpa sekadar menjadikannya gagasan abstrak.
- source_word: ἐν τῷ ἐμῷ ψεύσματι
  choice: melalui kebohonganku
  rationale: ἐν di sini paling wajar dipahami secara instrumental, yakni kebohongan manusia menjadi sarana atau latar yang membuat kebenaran Allah semakin nyata.
- source_word: ἐπερίσσευσεν
  choice: semakin nyata
  rationale: Secara harfiah verba ini menyatakan bertambah atau berlimpah. Dalam hubungan dengan kemuliaan Allah, 'semakin nyata' menyampaikan hasil retorisnya secara alami dalam bahasa Indonesia tanpa mengubah klaim dasarnya.
- source_word: εἰς τὴν δόξαν αὐτοῦ
  choice: sehingga Dia dimuliakan
  rationale: εἰς dapat menunjukkan hasil atau tujuan. Rumusan ini alami dalam bahasa Indonesia dan mempertahankan kemungkinan bahwa kebenaran Allah menghasilkan kemuliaan bagi-Nya.
- source_word: τί ἔτι κἀγὼ
  choice: mengapa aku masih juga
  rationale: '''Masih'' mempertahankan ἔτι, sedangkan ''juga'' menyatakan unsur aditif dalam κἀγώ yang mudah hilang jika hanya diterjemahkan ''aku''.'
- source_word: κρίνομαι
  choice: dihakimi
  rationale: Bentuk pasif kini dipertahankan tanpa mempersempit maknanya menjadi penghukuman akhir.
- source_word: ὡς ἁμαρτωλὸς
  choice: sebagai orang berdosa
  rationale: Terjemahan langsung dan idiomatis untuk ungkapan predikatif ini.
theological_decisions:
- issue: Apakah ἀλήθεια τοῦ θεοῦ menunjuk pada 'kebenaran Allah' secara abstrak atau pada sifat-Nya yang benar dan dapat dipercaya.
  choice: kesetiaan Allah pada kebenaran
  alternative: kebenaran Allah; sifat Allah yang benar
  rationale: Konteks langsung membandingkan Allah yang benar dengan manusia yang berdusta. Pilihan ini menjaga nuansa sifat moral dan keterandalan Allah tanpa memasukkan tafsiran denominasi tertentu.
- issue: Hubungan εἰς τὴν δόξαν αὐτοῦ dengan melimpahnya kebenaran Allah.
  choice: hasil yang dinyatakan dengan 'sehingga Dia dimuliakan'
  alternative: 'tujuan: ''untuk kemuliaan-Nya'''
  rationale: Preposisi εἰς memungkinkan nuansa hasil maupun tujuan. Teks utama memakai hasil yang alami dalam bahasa Indonesia, sementara ambiguitas dasarnya tidak dijadikan dasar bagi kesimpulan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk orang pertama dipertahankan sebagai bagian dari keberatan retoris Paulus; terjemahan tidak menyatakan bahwa Paulus membenarkan logika keberatan tersebut.
