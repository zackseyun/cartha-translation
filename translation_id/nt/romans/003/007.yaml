revisions:
- from: Namun, jika kesetiaan Allah pada kebenaran semakin nyata melalui kebohonganku sehingga Dia dimuliakan, mengapa aku masih juga dihakimi sebagai orang berdosa?
  to: Namun, jika kebenaran Allah[a] makin berlimpah melalui kebohonganku[b] untuk kemuliaan-Nya[c], mengapa aku pun masih dihakimi sebagai orang berdosa?
  rationale: Revisi mengutamakan padanan yang lebih dekat dengan bahasa Yunani sambil tetap idiomatis dalam bahasa Indonesia modern. “Kebenaran Allah” tidak memutuskan lebih dahulu antara arti abstrak dan sifat moral Allah. “Makin berlimpah” memelihara makna ἐπερίσσευσεν, dan “untuk kemuliaan-Nya” mempertahankan arah εἰς tanpa mengubah pertanyaan retoris Paulus menjadi pernyataan teologis yang disetujui.
