id: ROM.3.27
reference: Romans 3:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/027.yaml
  text: Where, then, is boasting? It has been excluded. Through what kind of law? A law of works? No, but through a law of faith.
translation:
  language: id
  text: Jadi, di manakah dasar untuk bermegah? Itu sudah disingkirkan. Melalui hukum apa? Hukum perbuatan? Bukan, melainkan melalui hukum iman.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχησις
  choice: dasar untuk bermegah
  rationale: Dalam konteks ini kata tersebut menunjuk pada tindakan atau alasan untuk membanggakan diri; ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan pertanyaan 'di manakah'.
- source_word: ἐξεκλείσθη
  choice: sudah disingkirkan
  rationale: Bentuk pasif aoristus menyatakan bahwa ruang atau dasar untuk bermegah telah ditutup atau ditiadakan; 'disingkirkan' mempertahankan daya metaforisnya tanpa menentukan pelaku yang tidak disebutkan.
- source_word: νόμος
  choice: hukum
  rationale: Mempertahankan pengulangan istilah Yunani dan ambiguitas retorisnya, yang di sini dapat berarti hukum, kaidah, atau prinsip.
- source_word: ἔργων
  choice: perbuatan
  rationale: Padanan ringkas bagi bentuk genetif jamak, dengan 'hukum' dipasok dari pertanyaan sebelumnya sebagaimana dituntut oleh struktur eliptisnya.
- source_word: πίστεως
  choice: iman
  rationale: Padanan baku yang mempertahankan bentuk genetif dan tidak mempersempitnya menjadi kesetiaan atau tindakan percaya.
- source_word: διά + genitive
  choice: melalui
  rationale: Menyatakan sarana sebagaimana konstruksi Yunani, serta mempertahankan kesejajaran pada kedua kemunculannya.
theological_decisions:
- issue: Makna 'hukum iman'
  choice: hukum iman
  alternative: prinsip iman
  rationale: Terjemahan harfiah mempertahankan permainan retoris Paulus dengan νόμος dan tidak secara diam-diam memutuskan bahwa kata itu hanya berarti 'prinsip'.
- issue: Pelaku yang menyingkirkan kemegahan
  choice: bentuk pasif tanpa pelaku
  alternative: Allah telah menyingkirkannya
  rationale: Teks Yunani tidak menyebutkan pelaku; bentuk pasif dipertahankan agar tidak menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur tanya-jawab yang tajam dipertahankan, termasuk elipsis pada 'Hukum perbuatan?' dan pengulangan 'melalui'.
