  text: whose mouth is full of cursing and bitterness.
translation:
  language: id
  text: Mulut mereka penuh dengan kutukan dan kepahitan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: mereka
  rationale: Pronomina relatif genitif ini menghubungkan ayat dengan orang-orang dalam konteks sebelumnya. Dalam bahasa Indonesia, bentuk posesif harfiah seperti “yang mulutnya” kurang alami di sini; “mulut mereka” menyampaikan hubungan itu dengan jelas.
- source_word: τὸ στόμα
  choice: mulut
  rationale: Nomina tunggal ini dipakai secara kolektif untuk menggambarkan perkataan orang-orang yang disebut dalam konteks. Bahasa Indonesia dapat mempertahankan bentuk tunggal kolektif tersebut.
- source_word: ἀρᾶς
  choice: kutukan
  rationale: Kata ini menunjuk pada kutukan atau ucapan yang mendatangkan celaka. “Kutukan” mempertahankan makna leksikal dan cocok sesudah ungkapan “penuh dengan”.
- source_word: πικρίας
  choice: kepahitan
  rationale: “Kepahitan” merupakan padanan langsung yang mempertahankan daya kiasan dan penilaian moral dalam teks tanpa mempersempitnya hanya menjadi ucapan kasar.
- source_word: γέμει
  choice: penuh dengan
  rationale: Verba kini ini menyatakan keadaan dipenuhi oleh sesuatu. Ungkapan “penuh dengan” alami dalam bahasa Indonesia dan mempertahankan aspek keadaan pada teks sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan klausa dibuat alami sambil mempertahankan gambaran kolektif tentang mulut yang penuh dengan kutukan dan kepahitan.
