  text: μὴ γένοιτο· ἐπεὶ πῶς κρινεῖ ὁ θεὸς τὸν κόσμον;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/006.yaml
  text: Absolutely not! Otherwise[a], how will God judge the world?
translation:
  language: id
  text: Sama sekali tidak! Kalau demikian, bagaimana Allah akan menghakimi dunia?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Sama sekali tidak!
  rationale: Ungkapan penolakan yang sangat tegas ini diterjemahkan secara idiomatis agar kekuatannya terpelihara dalam bahasa Indonesia modern, tanpa mempertahankan bentuk harfiah optatif yang terasa tidak alami.
- source_word: ἐπεὶ
  choice: Kalau demikian
  rationale: Dalam pertanyaan retoris ini, kata tersebut mengantar konsekuensi logis dari anggapan yang baru saja ditolak. 'Kalau demikian' menyampaikan alur argumen Paulus secara alami.
- source_word: κρινεῖ
  choice: akan menghakimi
  rationale: Bentuk verba adalah indikatif futur, sehingga 'akan menghakimi' mempertahankan acuan waktunya dengan langsung dan wajar.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Sebutan definit bagi Allah diterjemahkan dengan padanan baku dan bermartabat dalam bahasa Indonesia.
- source_word: τὸν κόσμον
  choice: dunia
  rationale: Dalam konteks ini κόσμος menunjuk kepada dunia sebagai objek penghakiman Allah; 'dunia' merupakan padanan yang paling luas, baku, dan tidak mempersempit rujukannya.
theological_decisions:
- issue: Daya penolakan dalam formula μὴ γένοιτο
  choice: 'Penolakan tegas dan idiomatis: ''Sama sekali tidak!'''
  alternative: 'Terjemahan lebih formal: ''Jangan sampai terjadi!'''
  rationale: Formula Paulus menolak keras kesimpulan sebelumnya. Padanan idiomatis mempertahankan daya retorisnya tanpa memasukkan tafsiran doktrinal tambahan.
- issue: Hubungan logis yang diperkenalkan oleh ἐπεὶ
  choice: '''Kalau demikian'' sebagai pengantar konsekuensi dari anggapan yang ditolak'
  alternative: '''Sebab kalau tidak'' atau ''karena'''
  rationale: Konteks argumentatif menuntut hubungan konsekuensial. Pilihan ini menjaga pertanyaan tetap terbuka secara retoris dan tidak menjelaskan lebih dari yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, tegas, dan bermartabat. Susunan pertanyaan dibuat alami bagi pembaca umum sambil mempertahankan bentuk futur dan alur logis teks Yunani.
