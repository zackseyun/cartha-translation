  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ⸀ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/023.yaml
  text: But I see another law in my members[b][a], waging war against the law of my mind and taking me captive to the law of sin that is in my members.
translation:
  language: id
  text: Namun, aku melihat hukum[a] lain dalam anggota-anggota tubuhku, yang berperang melawan hukum akal budiku dan menawan aku di bawah hukum dosa[b] yang ada dalam anggota-anggota tubuhku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah “hukum” dalam ayat ini juga dapat dipahami sebagai “prinsip” atau “kuasa”.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “menawan aku di dalam hukum dosa”. Ungkapan “di bawah hukum dosa” menyatakan bahwa aku dibawa ke dalam ketundukan terhadap kuasanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπω
  choice: aku melihat
  rationale: Mempertahankan gambaran pengamatan langsung dalam kala kini dan sesuai dengan gaya orang pertama dalam konteks.
- source_word: ἕτερον νόμον
  choice: hukum lain
  rationale: Menjaga kontras dengan hukum yang telah disebut sebelumnya tanpa menafsirkan νόμος secara sempit sebagai sekadar prinsip atau kuasa.
- source_word: νόμον / νόμῳ (berulang)
  choice: hukum
  rationale: Pengulangan istilah yang sama mempertahankan permainan retoris dan ketegangan teologis dalam bahasa Yunani.
- source_word: ἐν τοῖς μέλεσίν μου
  choice: dalam anggota-anggota tubuhku
  rationale: Ungkapan ini mempertahankan metafora konkret tentang bagian-bagian tubuh, tetapi lebih jelas dalam bahasa Indonesia modern daripada hanya 'anggota-anggotaku'.
- source_word: ἀντιστρατευόμενον
  choice: berperang melawan
  rationale: Mempertahankan citra peperangan yang kuat dan berlanjut.
- source_word: τοῦ νοός μου
  choice: akal budiku
  rationale: Dalam konteks ini νοῦς menunjuk pada kemampuan batin untuk memahami dan menghendaki; 'akal budi' merupakan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: αἰχμαλωτίζοντά με
  choice: menawan aku
  rationale: Mempertahankan metafora militer dan gagasan dijadikan tawanan.
- source_word: ἐν τῷ νόμῳ τῆς ἁμαρτίας
  choice: di bawah hukum dosa
  rationale: Walaupun ἐν secara harfiah berarti 'di dalam', ungkapan ini secara alami menyatakan keadaan takluk di bawah kuasa hukum dosa dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah νόμος harus diterjemahkan secara interpretatif sebagai 'prinsip' atau 'kuasa'.
  choice: Semua pemunculan diterjemahkan 'hukum'.
  alternative: Satu atau beberapa pemunculan dapat diterjemahkan 'prinsip' atau 'kuasa'.
  rationale: Pilihan ini mempertahankan pengulangan Paulus dan tidak menyelesaikan secara diam-diam ketegangan antara hukum akal budi dan hukum dosa.
- issue: Hubungan αἰχμαλωτίζοντά με dengan ἐν τῷ νόμῳ τῆς ἁμαρτίας.
  choice: menawan aku di bawah hukum dosa
  alternative: menawan aku di dalam hukum dosa
  rationale: '''Di bawah'' menyampaikan ketundukan sebagai tawanan secara alami, sedangkan catatan kaki mempertahankan bentuk harfiahnya.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Anggota-anggota tubuhku' menjaga metafora jasmani dengan kejelasan alami; 'akal budi' menghindari kesan bahwa νοῦς hanya menunjuk pada otak atau kecerdasan. Penambahan 'bekerja' membuat hubungan 'hukum lain dalam anggota tubuh' lebih alami dalam bahasa Indonesia tanpa mengubah gagasan bahwa hukum itu sedang berperang dan menawan.
