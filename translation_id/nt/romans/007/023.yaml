    rationale: Teks sumber hanya menyatakan bahwa Paulus melihat “hukum lain dalam anggota-anggota tubuhnya,” lalu menerangkan hukum itu sebagai yang berperang dan menawan. “Bekerja” dapat disimpulkan, tetapi merupakan tambahan yang tidak perlu.
  - severity: low
    issue: Jangkar catatan kaki [a] ditempatkan setelah “anggota-anggota tubuhku.”
    rationale: Catatan itu menjelaskan pemakaian berulang istilah νόμος/hukum, bukan frasa tentang anggota tubuh. Menempatkannya setelah kemunculan pertama “hukum” memberikan jangkar yang tepat.
