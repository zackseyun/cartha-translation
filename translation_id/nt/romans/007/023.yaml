  source_fidelity: Makna pokok dan pengulangan νόμος telah dipertahankan. Namun, kata tambahan “bekerja” tidak dinyatakan secara eksplisit dalam teks Yunani dan tidak diperlukan untuk menghasilkan bahasa Indonesia yang jelas. Relasi hasil dari αἰχμαλωτίζοντά με ἐν ... diterjemahkan secara idiomatis sebagai ketundukan “di bawah hukum dosa”; catatan kaki dengan tepat mencatat bentuk harfiahnya.
  naturalness: “Akal budi,” “berperang melawan,” dan “menawan aku” wajar dalam ragam Indonesia modern yang bermartabat. Susunan revisi menghindari pemecahan kalimat dan tambahan “Hukum itu,” sambil membuat “hukum lain” jelas sebagai pelaku kedua partisip Yunani.
  terminology: “Hukum” dipertahankan untuk semua kemunculan νόμος, sehingga pengulangan retorisnya tetap tampak. “Anggota-anggota tubuhku” menyampaikan μέλη secara konkret dan jelas. Jangkar catatan tentang νόμος dipindahkan ke kemunculan pertama “hukum,” tempat pembaca pertama kali memerlukan keterangan leksikal tersebut.
  issues:
