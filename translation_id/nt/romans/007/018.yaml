review_pass:
  verdict: revise
  source_fidelity: Draf tepat pada bagian pertama dan mempertahankan apposisi σημαντικό antara “di dalam aku” dan “di dalam dagingku.” Namun, “kemampuan untuk melakukannya” tidak menerjemahkan infinitif substantival κατεργάζεσθαι secara langsung; ia mengubah “melakukan/mengerjakan yang baik” menjadi kemampuan atau kapasitas untuk melakukannya. Teks Yunani mempertentangkan kemauan yang hadir dengan pelaksanaan yang baik yang tidak hadir/tersedia.
  naturalness: “Tidak ada sesuatu yang baik” dapat dipadatkan secara alami menjadi “tidak ada yang baik.” Untuk bagian akhir, “melakukan yang baik itu tidak ada padaku” menjaga elipsis dan paralelisme sumber, walaupun bernada agak retoris, yang sesuai dengan gaya Paulus.
  terminology: “Daging” adalah padanan yang tepat untuk σάρξ dan tidak semestinya diganti dalam teks dengan “tabiat berdosa.” Catatan kaki sebaiknya menawarkan alternatif sebagai kemungkinan penerjemahan, bukan mendefinisikan istilah itu secara sempit sebagai keberadaan yang dikuasai dosa.
  issues:
  - severity: medium
    issue: “Kemampuan untuk melakukannya” menggantikan tindakan dengan kapasitas.
    rationale: κατεργάζεσθαι berarti melakukan, mengerjakan, atau melaksanakan; tidak ada kata Yunani eksplisit untuk “kemampuan.” Perubahan ini menambah penafsiran dan mengurangi paralel antara τὸ θέλειν dan τὸ κατεργάζεσθαι.
  - severity: low
    issue: Catatan kaki berbunyi “Secara harfiah, ‘daging’” padahal teks utama sudah memakai “daging.”
    rationale: Catatan tersebut tidak berfungsi sebagai alternatif leksikal yang informatif. Lebih tepat mencatat kemungkinan terjemahan kontekstual tanpa menjadikannya penafsiran yang pasti.
  revised_text: Sebab aku tahu bahwa tidak ada yang baik tinggal di dalam aku, yaitu di dalam dagingku.[a] Sebab kemauan untuk melakukan yang baik ada padaku, tetapi melakukan yang baik itu tidak ada padaku.
  revised_footnotes:
