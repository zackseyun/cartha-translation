  text: οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ’ ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν ⸀οὔ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/018.yaml
  text: For I know that nothing good dwells in me—that is[a], in my flesh. For the willing is present with me, but the doing of the good is not.
translation:
  language: id
  text: Sebab aku tahu bahwa tidak ada yang baik tinggal di dalam aku, yaitu di dalam dagingku.[a] Sebab kemauan untuk melakukan yang baik ada padaku, tetapi melakukan yang baik itu tidak ada padaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tabiat berdosa” dalam beberapa penafsiran kontekstual.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: aku tahu
  rationale: Bentuk perfek berfungsi dengan makna kini; 'aku tahu' merupakan padanan Indonesia yang alami dan langsung.
- source_word: οἰκεῖ
  choice: tinggal
  rationale: Mempertahankan metafora tentang sesuatu yang berdiam dalam diri, tanpa memakai ungkapan yang terlalu teknis.
- source_word: ἀγαθόν
  choice: sesuatu yang baik
  rationale: Adjektiva netral substantival dalam klausa negatif paling alami diungkapkan sebagai 'tidak ada sesuatu yang baik'.
- source_word: σάρξ
  choice: daging
  rationale: Mempertahankan istilah Paulus dan ketegangan teologisnya, alih-alih langsung menafsirkannya sebagai 'tabiat berdosa'.
- source_word: τὸ θέλειν
  choice: kehendak untuk berbuat baik
  rationale: Infinitif berartikel bersifat substantival. Konteks dari τὸ καλόν melengkapi isi kehendak, sehingga terjemahan ini jelas dan alami dalam bahasa Indonesia.
- source_word: παράκειταί μοι
  choice: ada padaku
  rationale: Menyampaikan gagasan bahwa kehendak itu tersedia atau hadir pada diri pembicara dalam ungkapan Indonesia yang ringkas.
- source_word: τὸ δὲ κατεργάζεσθαι τὸ καλόν
  choice: tetapi kemampuan untuk melakukannya
  rationale: 'Konstruksi eliptis dipahami berlawanan dengan kehendak yang tersedia: pelaksanaan yang baik tidak tersedia. ''Kemampuan'' membuat implikasi idiomatis itu jelas, meski lebih interpretatif daripada ''melakukan yang baik''.'
- source_word: οὔ
  choice: tidak ada
  rationale: Melengkapi elipsis Yunani dengan predikat yang diambil dari klausa sebelumnya.
theological_decisions:
- issue: Makna σάρξ dalam konteks moral Paulus
  choice: daging
  alternative: tabiat berdosa
  rationale: Pilihan literal mempertahankan rumusan Paulus dan tidak menyamakan σάρξ secara prematur dengan suatu konstruksi doktrinal tertentu.
- issue: Hubungan antara kehendak dan pelaksanaan yang baik
  choice: kehendak ada, tetapi kemampuan melaksanakannya tidak ada
  alternative: kehendak ada, tetapi perbuatan baik tidak ada
  rationale: παράκειταί dipahami secara eliptis juga terhadap unsur kedua. Terjemahan ini menampilkan ketidaktersediaan untuk melaksanakan yang baik tanpa menentukan teori antropologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata 'daging' dipertahankan sebagai istilah utama Paulus; catatan kaki memberi penjelasan kontekstual tanpa menggantikannya dengan tafsiran denominatif.
