revisions:
- from: Sebab aku tahu bahwa tidak ada sesuatu yang baik yang tinggal di dalam aku, yaitu di dalam dagingku.[a] Sebab kehendak untuk berbuat baik ada padaku, tetapi kemampuan untuk melakukannya tidak ada.
  to: Sebab aku tahu bahwa tidak ada yang baik tinggal di dalam aku, yaitu di dalam dagingku.[a] Sebab kemauan untuk melakukan yang baik ada padaku, tetapi melakukan yang baik itu tidak ada padaku.
  rationale: Revisi mempertahankan “daging” sebagai terjemahan utama σάρξ, menyederhanakan ungkapan Indonesia pada klausa pertama, dan mengganti “kemampuan” dengan “melakukan yang baik” agar substantivisasi infinitif κατεργάζεσθαι serta elipsis kontrasnya dengan “kemauan” tetap tampak. Catatan kaki kini benar-benar menyajikan alternatif, tanpa memaksakan tafsiran teologis.
