  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὁ νόμος ἁμαρτία; μὴ γένοιτο· ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου, τήν τε γὰρ ἐπιθυμίαν οὐκ ᾔδειν εἰ μὴ ὁ νόμος ἔλεγεν· Οὐκ ἐπιθυμήσεις·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/007.yaml
  text: What then shall we say? Is the law sin? May it never be! On the contrary[a], I would not have known sin except through the law. For I would not have known coveting if the law had not said, "You shall not covet."
translation:
  language: id
  text: Jadi, apa yang akan kita katakan? Apakah hukum adalah dosa? Sama sekali tidak! Sebaliknya, aku tidak akan mengenal dosa kalau bukan melalui hukum. Sebab, aku tidak akan mengenal keinginan[a] jika hukum tidak mengatakan, “Jangan mengingini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keinginan untuk mengingini”; tetapi kutipan langsung dari perintah “Jangan mengingini” mendukung arti yang lebih khusus di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Jadi, apa yang akan kita katakan?
  rationale: Mempertahankan rumusan peralihan retoris Paulus dalam bahasa Indonesia yang alami dan cukup formal.
- source_word: ὁ νόμος
  choice: hukum
  rationale: Dalam konteks ini menunjuk kepada hukum Musa; bentuk ini alami dalam bahasa Indonesia tanpa harus menambahkan penjelasan tafsir ke dalam teks.
- source_word: ἁμαρτία
  choice: dosa
  rationale: Padanan langsung bagi nomina predikatif yang mempertahankan pertanyaan tajam apakah hukum itu sendiri adalah dosa.
- source_word: μὴ γένοιτο
  choice: Sama sekali tidak!
  rationale: Ungkapan penolakan kuat dan idiomatis dalam bahasa Indonesia, lebih tegas daripada sekadar 'tidak'.
- source_word: ἀλλὰ
  choice: Sebaliknya
  rationale: Menandai koreksi dan kontras kuat sesudah penolakan Paulus.
- source_word: τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου
  choice: aku tidak akan mengenal dosa jika bukan melalui hukum
  rationale: Bentuk kontrafaktual menyampaikan bahwa pengenalan akan dosa terjadi melalui hukum; 'mengenal' menjaga kedekatan leksikal tanpa mempersempitnya menjadi sekadar pemahaman intelektual.
- source_word: ἐπιθυμίαν
  choice: keinginan untuk memiliki milik orang lain
  rationale: Kutipan langsung dari perintah kesepuluh mendukung arti khusus berupa keinginan akan milik sesama, bukan keinginan dalam arti umum.
- source_word: οὐκ ᾔδειν
  choice: aku tidak akan mengenal
  rationale: Menjaga kesejajaran gagasan dengan klausa sebelumnya, meskipun verba Yunani yang dipakai berbeda.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: Jangan mengingini milik orang lain
  rationale: Menyampaikan daya larangan dari perintah tersebut dalam bahasa Indonesia modern dan memperjelas objek implisit sesuai konteks perintah kesepuluh.
theological_decisions:
- issue: Hubungan antara hukum dan dosa
  choice: Apakah hukum adalah dosa? Sama sekali tidak!
  alternative: Apakah hukum itu berdosa?
  rationale: Nomina predikatif Yunani mempertanyakan identitas hukum dengan dosa, bukan hanya apakah hukum memiliki sifat berdosa. Terjemahan ini mempertahankan ketegangan teologis dan ketajaman rumusan Paulus.
- issue: Rujukan νόμος dalam konteks
  choice: hukum
  alternative: Hukum Taurat
  rationale: Konteks kutipan perintah menunjukkan hukum Musa, tetapi teks Yunani hanya memakai νόμος. 'Hukum' mempertahankan bentuk sumber dan tidak menambahkan label yang tidak dinyatakan langsung.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Kata ganti 'aku' dipakai untuk suara orang pertama tunggal Paulus, sedangkan 'kita' mempertahankan bentuk jamak inklusif dalam pertanyaan pembuka. Susunan kalimat menjaga gaya argumentatif dan penolakan tegas dari teks Yunani.
