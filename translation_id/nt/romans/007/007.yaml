  terminology: “Hukum,” “dosa,” dan “Sama sekali tidak!” sesuai dengan istilah dan daya retoris sumber. “Keinginan” mempertahankan keluasan leksikal ἐπιθυμία; kutipan “Jangan mengingini” memberi nuansa khusus yang relevan tanpa menambahkan objek.
