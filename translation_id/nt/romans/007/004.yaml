id: ROM.7.4
reference: Romans 7:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι ἵνα καρποφορήσωμεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/004.yaml
  text: So then[a], my brothers, you also were put to death to the law through the body of the Messiah[c][b], so that you might belong to another—to him who was raised from the dead—in order that we might bear fruit for God.
translation:
  language: id
  text: Jadi, saudara-saudaraku[a], kamu juga telah dimatikan bagi hukum Taurat melalui tubuh Mesias[b], supaya kamu menjadi milik orang lain[c], yaitu Dia yang telah dibangkitkan dari antara orang mati, agar kita berbuah bagi Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang secara harfiah berarti “saudara-saudara laki-laki” dapat digunakan untuk menyapa kelompok yang mencakup laki-laki dan perempuan.
    reason: lexical_alternative
  - marker: b
    text: Atau “Kristus”. Kata Yunani Christos berarti “Yang Diurapi” dan sepadan dengan “Mesias”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “supaya kamu menjadi milik orang lain”; ungkapan ini melanjutkan analogi perkawinan dari ayat-ayat sebelumnya.
    reason: cultural_note
lexical_decisions:
- source_word: Ὥστε
  choice: Jadi
  rationale: Menandai kesimpulan yang ditarik dari analogi sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ἀδελφοί μου
  choice: saudara-saudaraku
  rationale: Mempertahankan sapaan langsung dan bentuk jamak Yunani; dalam pemakaian ini kelompok yang disapa dapat mencakup laki-laki dan perempuan.
- source_word: ἐθανατώθητε
  choice: telah dibuat mati
  rationale: Mempertahankan bentuk pasif aoristus dan gambaran bahwa para pembaca dikenai tindakan dalam hubungan mereka dengan hukum Taurat.
- source_word: τῷ νόμῳ
  choice: terhadap hukum Taurat
  rationale: Kata 'terhadap' menyatakan ranah hubungan yang diakhiri oleh kematian; 'hukum Taurat' memperjelas νόμος dalam konteks pembahasan Paulus tanpa mengartikannya sebagai hukum secara umum.
- source_word: διὰ τοῦ σώματος τοῦ Χριστοῦ
  choice: melalui tubuh Mesias
  rationale: Mempertahankan fungsi perantaraan διά dengan genitif serta tubuh sebagai sarana kematian tersebut.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός mengandung makna gelar 'Yang Diurapi'; 'Mesias' mempertahankan makna gelar itu dalam bahasa Indonesia.
- source_word: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: supaya kamu menjadi milik yang lain
  rationale: Mencerminkan klausa tujuan dan meneruskan analogi perkawinan dari konteks sebelumnya tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: τῷ ἐκ νεκρῶν ἐγερθέντι
  choice: yaitu Dia yang telah dibangkitkan dari antara orang mati
  rationale: Menjaga bentuk pasif dan menerjemahkan ἐκ νεκρῶν secara dekat sebagai 'dari antara orang mati'.
- source_word: ἵνα καρποφορήσωμεν
  choice: agar kita menghasilkan buah
  rationale: Mempertahankan metafora buah, fungsi tujuan ἵνα, dan peralihan orang dari 'kamu' ke 'kita'.
- source_word: τῷ θεῷ
  choice: bagi Allah
  rationale: Secara alami mengungkapkan bahwa buah tersebut dihasilkan bagi Allah.
theological_decisions:
- issue: Makna Χριστοῦ dalam wacana Paulus
  choice: Mesias
  alternative: Kristus
  rationale: Di sini istilah tersebut tetap bermakna gelar, dan 'Mesias' menyampaikan arti 'Yang Diurapi' tanpa menjadikannya sekadar nama diri.
- issue: Hubungan orang percaya dengan hukum dalam τῷ νόμῳ
  choice: dibuat mati terhadap hukum Taurat
  alternative: mati bagi hukum Taurat; dibebaskan dari hukum Taurat
  rationale: Terjemahan ini mempertahankan bentuk pasif dan konstruksi datif yang tidak secara eksplisit memakai kata 'dibebaskan', sehingga ketegangan metaforis Paulus tidak diselesaikan secara berlebihan.
- issue: Metafora perkawinan dalam γενέσθαι ὑμᾶς ἑτέρῳ
  choice: menjadi milik yang lain
  alternative: dipersatukan dengan yang lain
  rationale: Pilihan ini mempertahankan bahasa kepemilikan relasional yang meneruskan analogi perkawinan, sedangkan 'dipersatukan' lebih interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'telah dibuat mati' sengaja dipertahankan meski agak tidak lazim untuk menjaga pasif Yunani; 'hukum Taurat' dipilih sebagai ungkapan Indonesia yang jelas bagi νόμος dalam konteks ini. Semua penanda catatan kaki dicantumkan dalam teks.
