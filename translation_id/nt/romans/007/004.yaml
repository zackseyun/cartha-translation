revisions:
- from: Jadi, saudara-saudaraku[a], kamu juga telah dibuat mati terhadap hukum Taurat melalui tubuh Mesias[b], supaya kamu menjadi milik yang lain[c], yaitu Dia yang telah dibangkitkan dari antara orang mati, agar kita menghasilkan buah bagi Allah.
  to: Jadi, saudara-saudaraku[a], kamu juga telah dimatikan bagi hukum Taurat melalui tubuh Mesias[b], supaya kamu menjadi milik orang lain[c], yaitu Dia yang telah dibangkitkan dari antara orang mati, agar kita berbuah bagi Allah.
