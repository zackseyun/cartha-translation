    issue: Ungkapan «telah dibuat mati terhadap hukum Taurat» tidak idiomatis.
    rationale: Bentuk pasif Yunani perlu dipertahankan, tetapi «dimatikan bagi hukum Taurat» adalah bentuk Indonesia yang lebih alami dan mencerminkan relasi datif dalam metafora mati.
  - severity: medium
    issue: «Menjadi milik yang lain» kurang jelas karena «yang lain» tidak secara wajar menunjuk kepada seorang pribadi dalam bahasa Indonesia.
    rationale: Ἑτέρῳ adalah bentuk maskulin dan segera dijelaskan oleh «Dia yang telah dibangkitkan». «Menjadi milik orang lain» mempertahankan relasi yang dimaksud tanpa menambahkan penafsiran.
