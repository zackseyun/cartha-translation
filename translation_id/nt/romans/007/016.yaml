id: ROM.7.16
reference: Romans 7:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ θέλω τοῦτο ποιῶ, σύμφημι τῷ νόμῳ ὅτι καλός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/016.yaml
  text: But if I do what I do not want, I agree with the law that it is good.
translation:
  language: id
  text: Namun, jika aku melakukan apa yang tidak kuinginkan, aku mengakui bahwa hukum itu baik.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Namun, jika
  rationale: Mempertahankan daya syarat εἰ dan nuansa kontras ringan δέ dalam bahasa Indonesia yang wajar.
- source_word: ὃ … τοῦτο
  choice: apa yang
  rationale: Konstruksi korelatif Yunani dialihkan secara idiomatis tanpa menghilangkan acuannya.
- source_word: θέλω
  choice: kuinginkan
  rationale: Menyatakan keinginan batin yang dipertentangkan dengan tindakan; bentuk terikat dengan subjek aku terasa alami dalam konteks ini.
- source_word: ποιῶ
  choice: aku melakukan
  rationale: Padanan langsung bagi verba kini yang sederhana dan mempertahankan bentuk orang pertama.
- source_word: σύμφημι
  choice: aku mengakui
  rationale: Mengungkapkan persetujuan atau pembenaran terhadap penilaian hukum. Dalam susunan bahasa Indonesia ini, 'mengakui bahwa' lebih alami daripada 'setuju dengan hukum bahwa'.
- source_word: τῷ νόμῳ
  choice: hukum
  rationale: Merujuk pada hukum yang sudah dikenal dalam konteks Roma; huruf kecil menghindari pemberian status sebagai judul formal yang tidak dinyatakan oleh teks.
- source_word: καλός
  choice: baik
  rationale: Padanan paling langsung bagi penilaian positif atas hukum tanpa mempersempitnya menjadi sekadar 'benar' atau memperkuatnya menjadi 'luhur'.
theological_decisions:
- issue: Apakah pernyataan Paulus menilai hukum itu sendiri secara positif
  choice: aku mengakui bahwa hukum itu baik
  alternative: aku setuju dengan hukum bahwa hukum itu baik
  rationale: Terjemahan mempertahankan penegasan eksplisit atas kebaikan hukum sekaligus memakai susunan Indonesia yang alami, tanpa menjelaskan lebih jauh hubungan teologis antara keinginan, tindakan, dan hukum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kuinginkan' menjaga kelancaran dan hubungan erat dengan 'aku', sedangkan 'hukum' tidak dikapitalisasi agar tidak menambahkan interpretasi tipografis.
