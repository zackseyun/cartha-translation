id: ROM.7.12
reference: Romans 7:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥστε ὁ μὲν νόμος ἅγιος, καὶ ἡ ἐντολὴ ἁγία καὶ δικαία καὶ ἀγαθή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/012.yaml
  text: So then, the law is holy, and the commandment is holy and righteous and good.
translation:
  language: id
  text: Jadi, hukum Taurat itu kudus, dan perintah itu kudus, adil, dan baik.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Jadi
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: νόμος
  choice: hukum Taurat
  rationale: Dalam konteks Roma 7, istilah ini merujuk pada hukum yang diberikan melalui Musa; 'hukum Taurat' menyampaikan rujukan tersebut secara jelas tanpa menambahkan penafsiran lebih jauh.
- source_word: ἅγιος
  choice: kudus
  rationale: Padanan baku yang mempertahankan gagasan kesucian dan status yang dikhususkan bagi Allah.
- source_word: ἐντολή
  choice: perintah
  rationale: Merujuk pada perintah tertentu di dalam hukum Taurat; bentuk ini alami dan tepat dalam bahasa Indonesia modern.
- source_word: δικαία
  choice: benar
  rationale: Menyatakan bahwa perintah itu selaras dengan ukuran moral yang benar; 'adil' juga mungkin, tetapi kurang alami sebagai sifat sebuah perintah dalam rangkaian ini.
- source_word: ἀγαθή
  choice: baik
  rationale: Mempertahankan cakupan makna moral dan manfaatnya tanpa perluasan tafsiran.
- source_word: μὲν
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini memberi penegasan ringan, tetapi tidak memiliki pasangan δέ dalam kalimat ini; nuansanya cukup tersampaikan melalui susunan pernyataan Indonesia.
theological_decisions:
- issue: Rujukan νόμος
  choice: hukum Taurat
  alternative: hukum
  rationale: Konteks dekat membahas hukum Musa dan perintah tentang keinginan; pilihan ini memperjelas rujukan historis istilah tanpa menjadikan 'Taurat' nama diri dalam ejaan.
- issue: Makna δικαία
  choice: benar
  alternative: adil
  rationale: Keduanya mungkin secara leksikal. 'Benar' lebih wajar untuk penilaian moral terhadap suatu perintah dan tidak mempersempit maknanya hanya pada keadilan yuridis.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pengulangan 'kudus' dipertahankan karena terdapat dua bentuk ἅγιος dalam teks Yunani dan karena pengulangan itu menegaskan baik hukum Taurat maupun perintah tertentu di dalamnya.
