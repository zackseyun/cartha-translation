  text: Οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν· ἐγὼ δὲ ⸀σάρκινός εἰμι, πεπραμένος ὑπὸ τὴν ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/014.yaml
  text: For we know that the law is spiritual[a], but I am fleshly[b], sold under sin.
translation:
  language: id
  text: Sebab kita tahu bahwa hukum itu bersifat rohani, tetapi aku bersifat kedagingan[a], telah terjual di bawah dosa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersifat jasmani.”
    reason: lexical_alternative
  - marker: b
    text: Atau “telah dijual sebagai budak di bawah dosa”; ungkapan ini menggambarkan keadaan tunduk pada dosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: kita tahu
  rationale: Menyatakan pengetahuan yang dianggap dimiliki bersama oleh Paulus dan para pembacanya; bentuk ini langsung dan alami dalam bahasa Indonesia.
- source_word: ὁ νόμος
  choice: hukum itu
  rationale: Mempertahankan acuan tertentu dari artikel Yunani tanpa menambahkan penafsiran eksplisit seperti 'Hukum Musa' ke dalam teks.
- source_word: πνευματικός
  choice: bersifat rohani
  rationale: Mengungkapkan sifat atau karakter hukum dan mempertahankan pertentangannya dengan σάρκινος secara wajar dalam bahasa Indonesia.
- source_word: σάρκινός
  choice: bersifat kedagingan
  rationale: Mempertahankan citra 'daging' dan kontras dengan 'bersifat rohani', tanpa menggantinya dengan rumusan interpretatif seperti 'memiliki tabiat berdosa'.
- source_word: πεπραμένος
  choice: terjual sebagai budak
  rationale: Perfect participle pasif menunjukkan keadaan sebagai akibat telah dijual; penambahan 'sebagai budak' membuat metafora perbudakan yang tersirat jelas bagi pembaca Indonesia.
- source_word: ὑπὸ τὴν ἁμαρτίαν
  choice: di bawah kuasa dosa
  rationale: ὑπό dengan akusatif menyatakan penaklukan atau penguasaan. 'Di bawah kuasa dosa' menyampaikan idiom Yunani secara alami tanpa menghilangkan gagasan tunduk kepada dosa.
theological_decisions:
- issue: Seberapa jauh bahasa 'daging' Paulus harus ditafsirkan
  choice: Memakai 'bersifat kedagingan' dalam teks utama.
  alternative: '''bersifat jasmani'', ''berdosa'', atau ''memiliki tabiat berdosa'''
  rationale: Pilihan ini mempertahankan hubungan leksikal dengan 'daging' dan ketegangan antara hukum yang rohani dan 'aku' yang kedagingan, tanpa menetapkan suatu rumusan antropologis atau denominasi tertentu.
- issue: Identitas dan keadaan 'aku' dalam Roma 7:14
  choice: Membiarkan bentuk orang pertama dan pernyataan waktunya sebagaimana adanya.
  alternative: Menjelaskan 'aku' sebagai Paulus sebelum bertobat, sesudah bertobat, atau sebagai figur representatif
  rationale: Ayat Yunani tidak secara eksplisit menyelesaikan perdebatan tentang identitas atau keadaan 'aku'; terjemahan tidak boleh memasukkan salah satu tafsiran tersebut.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Ungkapan 'bersifat rohani' dan 'bersifat kedagingan' mempertahankan kesejajaran retoris Yunani. Metafora perbudakan dibuat cukup jelas dalam teks utama, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
