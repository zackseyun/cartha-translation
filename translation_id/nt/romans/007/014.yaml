  naturalness: “Hukum itu bersifat rohani” dan “aku bersifat kedagingan” adalah bahasa Indonesia baku yang cukup alami dalam register Alkitab serta menjaga kontras retorisnya. “Telah terjual di bawah dosa” dapat dipahami dalam metafora perbudakan Paulus; catatan kaki menyediakan penjelasan yang lebih eksplisit.
  terminology: “Rohani” untuk πνευματικός dan “kedagingan” untuk σάρκινός mempertahankan kontras istilah sumber tanpa mengubahnya menjadi “tabiat berdosa.” “Dosa” tetap diperlakukan sebagai kuasa yang menundukkan tanpa menetapkan tafsiran antropologis tertentu.
