id: ROM.7.11
reference: Romans 7:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι’ αὐτῆς ἀπέκτεινεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/011.yaml
  text: For sin[a], having taken an opportunity through the commandment[b], deceived me and through it killed me.
translation:
  language: id
  text: Sebab dosa, setelah mendapat kesempatan melalui perintah itu, menipu aku dan melalui perintah itu membunuh aku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Menunjukkan hubungan penjelasan dengan pernyataan sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ἡ ἁμαρτία
  choice: dosa
  rationale: Mempertahankan makna lazim Paulus sekaligus personifikasi dosa sebagai pelaku tindakan dalam ayat ini.
- source_word: ἀφορμὴν λαβοῦσα
  choice: setelah mendapat kesempatan
  rationale: Mengungkapkan tindakan memperoleh atau memanfaatkan suatu peluang dengan bahasa Indonesia yang wajar, tanpa melebihkan unsur agresif yang tidak dinyatakan secara tersendiri.
- source_word: διὰ τῆς ἐντολῆς
  choice: melalui perintah itu
  rationale: Mempertahankan fungsi instrumental διά dan bentuk tunggal tertentu dari ἐντολή.
- source_word: ἐξηπάτησέν με
  choice: menipu aku
  rationale: Menyampaikan tindakan memperdaya secara jelas, dengan objek orang pertama tetap eksplisit.
- source_word: δι’ αὐτῆς
  choice: melalui perintah itu
  rationale: Mengungkapkan acuan pronomina feminin tunggal secara eksplisit dalam bahasa Indonesia agar tidak ambigu; acuannya ialah perintah tersebut.
- source_word: ἀπέκτεινεν
  choice: membunuh aku
  rationale: Padanan modern yang lugas bagi tindakan mematikan, tanpa menambahkan nuansa yudisial.
theological_decisions:
- issue: Derajat personifikasi dosa dalam gambaran Paulus
  choice: Dosa dipertahankan sebagai pelaku aktif yang mendapat kesempatan, menipu, dan membunuh.
  alternative: Melunakkan dosa menjadi kekuatan abstrak melalui parafrasa yang kurang personal.
  rationale: Dalam bahasa Yunani, dosa adalah subjek gramatikal bagi rangkaian tindakan tersebut. Terjemahan mempertahankan daya retoris dan ketegangan teologis ini tanpa menambah penafsiran.
- issue: Peran perintah dalam tindakan dosa
  choice: Frasa instrumental diterjemahkan secara langsung sebagai “melalui perintah itu,” tanpa menyatakan bahwa perintah itu sendiri adalah pelaku.
  alternative: Memparafrasakan perintah sebagai penyebab moral langsung dari kematian.
  rationale: Teks membedakan dosa sebagai pelaku dari perintah sebagai sarana yang dimanfaatkan; perbedaan ini perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Pengulangan “perintah itu” dipilih untuk memperjelas acuan αὐτῆς, karena pronomina Indonesia “itu/nya” berpotensi kabur. Tidak diperlukan catatan kaki karena alternatif leksikal dan acuan pronomina dapat ditangani dengan jelas dalam teks utama.
source_grounding:
  english_pob_role: consult_only
