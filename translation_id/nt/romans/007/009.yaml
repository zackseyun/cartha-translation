reference: Romans 7:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔζων χωρὶς νόμου ποτέ· ἐλθούσης δὲ τῆς ἐντολῆς ἡ ἁμαρτία ἀνέζησεν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/009.yaml
  text: I was once alive apart from the law[a], but when the commandment came, sin came to life,
translation:
  language: id
  text: Dahulu aku hidup tanpa hukum Taurat; tetapi ketika perintah itu datang, dosa menjadi hidup,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: dosa hidup kembali.'
    reason: ἀνέζησεν dapat diterjemahkan “menjadi hidup” atau “hidup kembali”; alternatif ini mempertahankan nuansa verba tanpa memahami personifikasi dosa secara harfiah.
lexical_decisions:
- source_word: ἔζων
  choice: aku hidup
  rationale: Bentuk imperfek diterjemahkan secara langsung dan tetap mempertahankan pertentangan hidup-mati yang dikembangkan dalam konteks dekat.
- source_word: χωρὶς νόμου
  choice: tanpa hukum Taurat
  rationale: Ungkapan ini mempertahankan makna keterpisahan dari νόμος; “hukum Taurat” merupakan padanan Indonesia yang alami bagi kemungkinan rujukan kepada hukum Musa dalam konteks Paulus.
- source_word: ποτέ
  choice: dahulu
  rationale: Menandai suatu keadaan pada masa lampau dengan bahasa Indonesia yang alami tanpa menentukan tahap biografis atau sejarah keselamatan tertentu.
- source_word: ἐλθούσης ... τῆς ἐντολῆς
  choice: ketika perintah itu datang
  rationale: Konstruksi genitif absolut dialihkan menjadi anak kalimat waktu yang alami sambil mempertahankan gambaran kedatangan perintah.
- source_word: ἐντολῆς
  choice: perintah itu
  rationale: Kata “perintah” jelas dan wajar dalam bahasa Indonesia; penunjuk “itu” sesuai dengan nomina Yunani yang definit dan konteks perintah tertentu.
- source_word: ἁμαρτία
  choice: dosa
  rationale: Bentuk tunggal dipertahankan sehingga personifikasi dosa dalam Roma 7 tetap terlihat.
- source_word: ἀνέζησεν
  choice: menjadi hidup kembali
  rationale: Padanan ini mempertahankan unsur hidup dan nuansa kembali pada verba ἀναζάω, sekaligus menjaga personifikasi dosa. Kemungkinan nuansa yang kurang menekankan keadaan sebelumnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Apakah pernyataan orang pertama ini harus dijelaskan sebagai autobiografi Paulus, pengalaman Israel, atau pengalaman manusia secara representatif
  choice: Mempertahankan orang pertama tunggal tanpa tambahan penafsiran
  alternative: Menjelaskannya secara eksplisit sebagai pengalaman pribadi Paulus, Israel, atau umat manusia
  rationale: Ayat Yunani ini sendiri tidak memutuskan identitas representatif “aku”; terjemahan tidak boleh menyelesaikan ketegangan teologis tersebut secara diam-diam.
- issue: Apakah νόμος harus dibuat sepenuhnya umum atau dikenali sebagai hukum Musa
  choice: hukum Taurat
  alternative: hukum
  rationale: Konteks Roma 7 dan pemakaian Paulus mendukung rujukan kepada hukum Musa, sedangkan rumusan ini tetap menyampaikan konsep hukum kepada pembaca Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Dahulu” ditempatkan di awal agar alur retrospektif alami. Tanda koma akhir dipertahankan karena ayat berlanjut secara sintaksis ke ayat berikutnya. Penanda catatan kaki ditempatkan pada frasa yang diterangkannya, yaitu ἀνέζησεν.
