id: ROM.7.1
reference: Romans 7:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ’ ὅσον χρόνον ζῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/001.yaml
  text: Or do you not know[b][a], brothers—for I am speaking to those who know the law—that the law has authority over a person for as long as he lives?
translation:
  language: id
  text: Atau tidak tahukah kamu, Saudara-saudara[a]—sebab aku berbicara kepada orang-orang yang mengenal hukum—bahwa hukum berkuasa atas seseorang selama orang itu hidup?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “Saudara-saudara” berbentuk jamak maskulin, tetapi dalam konteks ini kemungkinan mencakup juga para perempuan di antara para pendengar Paulus.
    reason: cultural_note
  - marker: b
    text: Atau “hukum menguasai seseorang selama orang itu hidup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Atau
  rationale: Mempertahankan peralihan argumentatif Paulus dari pembahasan sebelumnya.
- source_word: ἀγνοεῖτε
  choice: tidak tahukah kamu
  rationale: Mengungkapkan pertanyaan retoris yang mengacu pada pengetahuan bersama secara alami dalam bahasa Indonesia.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan ini wajar dan bermartabat dalam bahasa Indonesia serta dapat mencakup laki-laki dan perempuan dalam jemaat; cakupan tersebut dijelaskan dalam catatan kaki.
- source_word: γινώσκουσιν γὰρ νόμον λαλῶ
  choice: sebab aku berbicara kepada orang-orang yang mengenal hukum
  rationale: Mempertahankan fungsi penjelas γάρ dan menyampaikan frasa partisipial dengan jelas.
- source_word: νόμον / ὁ νόμος
  choice: hukum
  rationale: Tidak mempersempit νόμος secara eksplisit menjadi Hukum Musa ataupun asas hukum umum, sehingga keluasan teks Yunani tetap terpelihara.
- source_word: κυριεύει
  choice: berkuasa atas
  rationale: Menyampaikan gagasan kekuasaan atau penguasaan secara langsung tanpa membuat metafora kekuasaan itu terlalu harfiah.
- source_word: τοῦ ἀνθρώπου
  choice: seseorang
  rationale: ἄνθρωπος bersifat generik di sini, bukan khusus laki-laki.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: selama orang itu hidup
  rationale: Menyampaikan batas waktu berlakunya kekuasaan hukum dengan jelas dan menghindari pronomina bergender yang tidak diperlukan dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan νόμος dalam pernyataan Paulus
  choice: Diterjemahkan sebagai “hukum” tanpa mempersempit acuannya dalam teks utama.
  alternative: “Hukum Musa” secara khusus; atau “hukum” sebagai asas hukum umum.
  rationale: Konteks berikutnya berkaitan erat dengan Hukum Musa, tetapi rumusan ayat ini cukup umum. Terjemahan mempertahankan keluasan dan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah mempertahankan sifat sisipan penjelasan Paulus. “Kamu” dipakai sebagai bentuk orang kedua yang tidak menandai jumlah; sapaan “Saudara-saudara” memperjelas bahwa jemaatlah yang dituju.
