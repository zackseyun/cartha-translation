id: ROM.7.3
reference: Romans 7:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἄρα οὖν ζῶντος τοῦ ἀνδρὸς μοιχαλὶς χρηματίσει ἐὰν γένηται ἀνδρὶ ἑτέρῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου, τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα γενομένην ἀνδρὶ ἑτέρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/003.yaml
  text: So then[a], while her husband is living, she will be called an adulteress if she belongs to another man. But if the husband dies, she is free from the law[b], so that she is not an adulteress if she belongs to another man.
translation:
  language: id
  text: Jadi, selama suaminya masih hidup, ia akan disebut pezina jika ia menjadi istri laki-laki lain.[a] Namun, jika suaminya meninggal, ia bebas dari hukum itu,[b] sehingga ia bukan pezina jika ia menjadi istri laki-laki lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersatu dengan laki-laki lain.”
    reason: lexical_alternative
  - marker: b
    text: “Hukum itu” di sini secara langsung menunjuk kepada ikatan hukum yang mengatur hubungan perkawinan.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Jadi
  rationale: Gabungan partikel ini menarik kesimpulan dari uraian sebelumnya; “Jadi” menyampaikan daya simpulnya secara alami dalam bahasa Indonesia.
- source_word: ζῶντος τοῦ ἀνδρός
  choice: selama suaminya masih hidup
  rationale: Genitivus absolutus ini menyatakan keadaan yang berlangsung bersamaan. Kata “suaminya” diperjelas dari konteks perkawinan.
- source_word: μοιχαλὶς
  choice: pezina
  rationale: Nomina ini secara khusus menunjuk kepada perempuan yang melakukan zina. “Pezina” tepat, ringkas, dan tidak memerlukan bentuk bergender yang kurang alami.
- source_word: χρηματίσει
  choice: akan disebut
  rationale: Dalam konteks ini verba tersebut berarti disebut atau dikenal dengan suatu sebutan; bentuk ini mempertahankan nuansa futur.
- source_word: ἐὰν γένηται ἀνδρὶ ἑτέρῳ
  choice: jika menjadi milik laki-laki lain
  rationale: Ungkapan γίνομαι dengan datif menyatakan masuk ke dalam suatu relasi dengan laki-laki lain. Terjemahan ini mempertahankan keluasan ungkapan Yunani dan tidak menambahkan kata “istri” yang tidak dinyatakan secara eksplisit.
- source_word: ἐλευθέρα
  choice: bebas
  rationale: Adjektiva ini menyatakan kebebasan dari kewajiban atau ikatan yang sebelumnya berlaku.
- source_word: ἀπὸ τοῦ νόμου
  choice: bebas dari hukum itu
  rationale: Artikel Yunani menunjuk kepada hukum yang baru dibicarakan, yaitu ketentuan yang mengikat dalam hubungan perkawinan; “itu” membuat rujukannya alami tanpa mengganti νόμος dengan tafsiran yang lebih khusus.
- source_word: τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα
  choice: sehingga ia bukan pezina
  rationale: Infinitif berartikel ini menyatakan akibat; “sehingga” mempertahankan hubungan logis tersebut secara wajar.
- source_word: γενομένην ἀνδρὶ ἑτέρῳ
  choice: jika menjadi milik laki-laki lain
  rationale: Partisip ini mengulangi peralihan relasional yang disebut sebelumnya. Pengulangan ungkapan yang sama menjaga konsistensi analogi.
theological_decisions:
- issue: Cakupan νόμος dalam analogi
  choice: hukum itu
  alternative: hukum perkawinan; hukum dalam arti luas dalam teologi Paulus
  rationale: Konteks langsung membahas ikatan hukum seorang perempuan dengan suaminya selama suaminya hidup. Terjemahan tetap memakai “hukum” dan tidak memperluasnya menjadi pernyataan umum tentang seluruh Hukum Musa.
- issue: Sifat relasi dengan ἀνδρὶ ἑτέρῳ
  choice: menjadi milik laki-laki lain
  alternative: menjadi istri laki-laki lain; bersatu dengan laki-laki lain
  rationale: Ungkapan sumber menunjuk kepada peralihan relasional dalam konteks perkawinan, tetapi tidak memakai kata khusus untuk “istri”; pilihan utama mempertahankan ambiguitas itu, sedangkan catatan kaki menjelaskan alternatif idiomatisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan kalimat yang mudah dipahami. “Pezina” dipilih karena tepat dan alami; “menjadi milik laki-laki lain” mempertahankan keluasan idiom Yunani, dengan alternatif yang lebih eksplisit diberikan dalam catatan kaki.
