review_pass:
  verdict: revise
  source_fidelity: Terjemahan secara umum mengikuti struktur dan logika Yunani dengan baik. Namun, “menjadi milik laki-laki lain” bukan padanan yang tepat maupun idiomatis untuk γένηται/γενομένην ἀνδρὶ ἑτέρῳ dalam konteks perkawinan. Ungkapan itu menyatakan masuk ke dalam relasi perkawinan dengan laki-laki lain, bukan kepemilikan seseorang atas perempuan tersebut.
  naturalness: Kalimatnya jelas dan beragam baku, tetapi “menjadi milik laki-laki lain” terdengar tidak alami dalam bahasa Indonesia modern dan dapat menyampaikan gagasan kepemilikan yang tidak ada dalam teks. “Menjadi istri laki-laki lain” adalah ungkapan alami dalam konteks hukum perkawinan yang sedang dipakai Paulus.
  terminology: “Pezina,” “bebas,” dan “hukum itu” dapat dipertahankan. “Pezina” dalam bahasa Indonesia tidak bergender, tetapi konteksnya jelas merujuk kepada perempuan, seperti μοιχαλίς. Catatan tentang “hukum itu” secara tepat membatasi rujukan langsungnya pada ikatan hukum perkawinan tanpa membuat klaim teologis yang lebih luas.
  issues:
  - severity: medium
    issue: “Menjadi milik laki-laki lain” digunakan untuk γένηται/γενομένην ἀνδρὶ ἑτέρῳ.
    rationale: Konstruksi γίνομαι dengan datif dalam konteks ini adalah idiom bagi menjadi/berada sebagai istri seorang laki-laki lain atau memasuki relasi perkawinan dengannya. Padanan “menjadi milik” mengubah relasi tersebut menjadi bahasa kepemilikan dan kurang alami dalam bahasa Indonesia.
  - severity: low
    issue: Catatan kaki a mencantumkan “menjadi istri laki-laki lain” sebagai alternatif, padahal itulah padanan utama yang lebih akurat.
    rationale: Setelah teks utama diperbaiki, catatan alternatif sebaiknya hanya memuat alternatif yang benar-benar menjelaskan keluasan idiom, misalnya “bersatu dengan laki-laki lain.”
  revised_text: Jadi, selama suaminya masih hidup, ia akan disebut pezina jika ia menjadi istri laki-laki lain.[a] Namun, jika suaminya meninggal, ia bebas dari hukum itu,[b] sehingga ia bukan pezina jika ia menjadi istri laki-laki lain.
