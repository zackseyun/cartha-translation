revisions:
- from: Jadi, selama suaminya masih hidup, ia akan disebut pezina jika menjadi milik laki-laki lain.[a] Namun, jika suaminya meninggal, ia bebas dari hukum itu,[b] sehingga ia bukan pezina jika menjadi milik laki-laki lain.
  to: Jadi, selama suaminya masih hidup, ia akan disebut pezina jika ia menjadi istri laki-laki lain.[a] Namun, jika suaminya meninggal, ia bebas dari hukum itu,[b] sehingga ia bukan pezina jika ia menjadi istri laki-laki lain.
  rationale: Mengganti “menjadi milik laki-laki lain” dengan “menjadi istri laki-laki lain” memulihkan makna idiomatis konstruksi Yunani dalam analogi perkawinan serta menghasilkan bahasa Indonesia baku yang jelas. Catatan kaki a disederhanakan agar menyediakan alternatif idiomatis tanpa mempertahankan padanan kepemilikan yang menyesatkan.
