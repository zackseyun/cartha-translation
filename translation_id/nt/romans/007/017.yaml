  text: νυνὶ δὲ οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ ⸀οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/017.yaml
  text: But now I am no longer the one doing it[a], but sin dwelling in me.
translation:
  language: id
  text: Namun sekarang, bukan lagi aku yang melakukannya[a], melainkan dosa yang tinggal di dalam diriku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bukan lagi aku yang mengerjakannya, melainkan dosa yang tinggal di dalam diriku.”
    reason: Alternatif leksikal untuk κατεργάζομαι yang mempertahankan nuansa menjalankan atau menghasilkan tindakan tersebut.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Namun sekarang
  rationale: Menandai peralihan yang bersifat logis sekaligus temporal serta mempertahankan pertentangan dengan pernyataan sebelumnya dalam bahasa Indonesia yang wajar.
- source_word: οὐκέτι
  choice: bukan lagi
  rationale: Secara langsung menyampaikan gagasan bahwa pelaku yang disebut tidak lagi diidentifikasikan sebagai 'aku' dalam susunan kontras ayat ini.
- source_word: ἐγὼ
  choice: aku yang
  rationale: Pronomina Yunani dinyatakan secara eksplisit dan bersifat menegaskan; konstruksi 'aku yang' mempertahankan fokus itu secara idiomatis.
- source_word: κατεργάζομαι
  choice: melakukannya
  rationale: Dalam konteks ini kata kerja tersebut menunjuk pada pelaksanaan tindakan yang baru dibicarakan; 'melakukan' jelas dan alami.
- source_word: αὐτό
  choice: -nya
  rationale: Pronomina ini merujuk kembali kepada tindakan yang telah disebutkan; akhiran '-nya' menyampaikan rujukan tersebut secara alami dalam bahasa Indonesia.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: dosa yang tinggal di dalam diriku
  rationale: Mempertahankan daya partisipial dan personifikasi dosa sebagai sesuatu yang berdiam dalam diri pembicara.
- source_word: οἰκοῦσα
  choice: yang tinggal
  rationale: '''Tinggal'' mempertahankan metafora berdiam atau menetap dengan bahasa modern yang mudah dipahami.'
theological_decisions:
- issue: Pembedaan Paulus antara 'aku' dan 'dosa yang tinggal di dalam diriku' dapat disalahpahami sebagai pengelakan tanggung jawab.
  choice: Mempertahankan pembedaan tajam sebagaimana dinyatakan teks tanpa penjelasan tambahan.
  alternative: Memparafrasakannya sebagai konflik batin atau memperluas kalimat untuk menekankan tanggung jawab pribadi.
  rationale: Teks Yunani sendiri menampilkan ketegangan ini secara tegas; terjemahan tidak seharusnya menyelesaikan ketegangan teologis tersebut secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Pilihan 'aku' mengikuti suara orang pertama yang langsung dan mempertahankan penekanan teks; 'diriku' membuat frasa preposisional tetap alami.
