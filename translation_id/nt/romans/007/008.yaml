id: ROM.7.8
reference: Romans 7:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν, χωρὶς γὰρ νόμου ἁμαρτία νεκρά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/008.yaml
  text: But sin[a], seizing an opportunity through the commandment, produced in me every kind of coveting. For apart from the law[b], sin is dead.
translation:
  language: id
  text: Namun dosa, dengan memanfaatkan kesempatan[a] melalui perintah itu, menimbulkan dalam diriku segala macam keinginan.[b] Sebab, tanpa hukum, dosa mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan mengambil kesempatan.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “setiap keinginan”; dalam konteks larangan untuk mengingini, kata ini khususnya bernuansa keinginan untuk memiliki apa yang dilarang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορμήν ... λαβοῦσα
  choice: dengan memanfaatkan kesempatan
  rationale: Ungkapan ini menggambarkan dosa secara aktif mengambil dan memakai suatu peluang. Terjemahan ini alami dalam bahasa Indonesia sekaligus mempertahankan personifikasi dosa.
- source_word: ἡ ἁμαρτία
  choice: dosa
  rationale: Dosa tetap menjadi subjek yang bertindak, sesuai personifikasi yang jelas dalam teks Yunani.
- source_word: διὰ τῆς ἐντολῆς
  choice: melalui perintah itu
  rationale: Bentuk tunggal dan berartikel menunjuk pada perintah khusus yang baru dikutip dalam konteks, sedangkan 'melalui' mempertahankan fungsi perintah sebagai sarana yang dimanfaatkan dosa.
- source_word: κατειργάσατο
  choice: menghasilkan
  rationale: Kata kerja ini menyatakan tindakan yang menimbulkan atau mewujudkan suatu hasil; 'menghasilkan' jelas dan kuat tanpa menambah tafsiran.
- source_word: πᾶσαν ἐπιθυμίαν
  choice: segala macam keinginan untuk memiliki
  rationale: Dalam konteks larangan mengingini milik orang lain, frasa ini menyatakan berbagai bentuk keinginan untuk memiliki. 'Segala macam' menyampaikan nilai distributif πᾶσαν secara alami.
- source_word: χωρὶς γὰρ νόμου
  choice: Sebab, tanpa hukum Taurat
  rationale: γάρ memperkenalkan alasan, sedangkan νόμος dalam konteks Roma 7 merujuk terutama pada hukum Musa. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih umum.
- source_word: νεκρά
  choice: mati
  rationale: Metafora tajam Paulus dipertahankan dan tidak diperlemah menjadi 'tidak aktif'.
theological_decisions:
- issue: Personifikasi dosa dan makna metaforis 'mati'
  choice: Mempertahankan dosa sebagai pelaku yang memanfaatkan kesempatan dan menghasilkan keinginan, serta menerjemahkan νεκρά secara langsung sebagai 'mati'.
  alternative: Menafsirkan dosa secara abstrak atau menerjemahkan νεκρά sebagai 'tidak aktif'.
  rationale: Teks Yunani menyajikan dosa sebagai kuasa yang bertindak dan memakai metafora 'mati'; terjemahan tidak seharusnya meredakan ketegangan teologis tersebut.
- issue: Cakupan νόμος
  choice: hukum Taurat
  alternative: hukum
  rationale: Konteks dekat menunjuk pada perintah dalam hukum Musa, tetapi bentuk Yunani tanpa artikel masih memungkinkan ungkapan yang lebih umum; alternatif itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mempertahankan hubungan sebab-akibat serta personifikasi dalam teks Yunani tanpa terdengar kaku.
