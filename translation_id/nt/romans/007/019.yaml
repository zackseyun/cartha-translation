id: ROM.7.19
reference: Romans 7:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ γὰρ ὃ θέλω ποιῶ ἀγαθόν, ἀλλὰ ὃ οὐ θέλω κακὸν τοῦτο πράσσω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/019.yaml
  text: For I do not do the good that I want[b][a], but the evil that I do not want—this I practice.
translation:
  language: id
  text: Sebab, aku tidak melakukan kebaikan yang kukehendaki[a], tetapi kejahatan yang tidak kukehendaki—itulah yang kukerjakan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang kuinginkan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kulakukan.” Bahasa Yunani memakai kata kerja yang berbeda dari kata “melakukan” sebelumnya, meskipun makna keduanya banyak bertumpang tindih.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: kehendaki
  rationale: Dalam konteks pergumulan batin Paulus, “kehendaki” secara alami menyatakan kemauan atau kehendak, tanpa mempersempitnya menjadi sekadar keinginan emosional.
- source_word: ποιῶ
  choice: melakukan
  rationale: “Melakukan” adalah padanan umum dan wajar untuk ποιῶ serta memungkinkan adanya pembedaan ringan dari πράσσω pada akhir ayat.
- source_word: ἀγαθόν
  choice: kebaikan
  rationale: Nomina “kebaikan” mempertahankan bobot moral ungkapan Yunani dan membentuk kesejajaran yang jelas dengan “kejahatan”.
- source_word: κακὸν
  choice: kejahatan
  rationale: “Kejahatan” mempertahankan pertentangan moral yang tegas dengan ἀγαθόν, bukan sekadar hal yang buruk atau tidak efektif.
- source_word: πράσσω
  choice: mengerjakan
  rationale: “Mengerjakan” membedakannya secara wajar dari ποιῶ (“melakukan”) tanpa menyiratkan bahwa perbedaan makna kedua verba itu mutlak.
- source_word: τοῦτο
  choice: itulah
  rationale: Bentuk “itulah” mempertahankan penekanan demonstratif pada kejahatan yang baru disebut.
- source_word: οὐ γὰρ
  choice: Sebab, ... tidak
  rationale: “Sebab” mempertahankan fungsi γάρ sebagai penjelasan yang menghubungkan ayat ini dengan argumen sebelumnya.
theological_decisions:
- issue: Apakah pertentangan moral Paulus perlu dilunakkan
  choice: Mempertahankan “kebaikan” dan “kejahatan” sebagai kategori moral langsung.
  alternative: “hal yang baik” dan “hal yang buruk” atau “yang benar” dan “yang salah”
  rationale: ἀγαθόν dan κακόν membawa bobot etis yang kuat. Terjemahan tidak boleh mereduksi ketegangan moral dalam perkataan Paulus.
- issue: Identitas dan keadaan pembicara dalam pergumulan ini
  choice: Tidak menambahkan penjelasan apakah “aku” menggambarkan Paulus sebelum atau sesudah percaya, Israel, atau manusia secara representatif.
  alternative: Menafsirkan identitas “aku” secara eksplisit dalam teks
  rationale: Ayat Yunani sendiri tidak menyelesaikan perdebatan kontekstual tersebut; terjemahan harus mempertahankan ambiguitas dan ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk terikat “kukehendaki” mempertahankan kelancaran serta penekanan orang pertama. Tanda pisah menonjolkan τοῦτο (“itulah”) tanpa menambahkan tafsiran.
