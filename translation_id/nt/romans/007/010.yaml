id: ROM.7.10
reference: Romans 7:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἀπέθανον, καὶ εὑρέθη μοι ἡ ἐντολὴ ἡ εἰς ζωὴν αὕτη εἰς θάνατον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/010.yaml
  text: and I died[b][a], and the commandment that was for life proved to be for death to me.
translation:
  language: id
  text: Namun, aku mati, dan ternyata bagiku perintah yang menuju kepada hidup itu justru menuju kepada kematian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Namun, aku mati, dan ternyata perintah yang dimaksudkan untuk membawa hidup itu justru menghasilkan kematian bagiku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανον
  choice: aku mati
  rationale: Bentuk aoris aktif orang pertama tunggal menyatakan peristiwa lampau secara langsung; terjemahan ini tidak mengubahnya menjadi keadaan atau proses.
- source_word: εὑρέθη μοι
  choice: ternyata bagiku
  rationale: Ungkapan pasif dengan datif μοι menyampaikan hasil yang dialami atau disadari oleh Paulus. 'Ternyata bagiku' alami dalam bahasa Indonesia dan mempertahankan unsur penemuan tanpa terjemahan harfiah yang kaku.
- source_word: ἡ ἐντολή
  choice: perintah
  rationale: Kata ini merujuk pada satu perintah tertentu dalam konteks Taurat. 'Perintah' merupakan padanan baku, jelas, dan tidak menambahkan kata 'Taurat' yang tidak muncul secara eksplisit dalam ayat ini.
- source_word: ἡ εἰς ζωὴν
  choice: yang menuju kepada hidup
  rationale: εἰς menyatakan arah atau hasil. 'Menuju kepada hidup' mempertahankan keterbukaan mengenai tujuan atau hasil tanpa memastikan bahwa perintah itu 'dimaksudkan' untuk hidup.
- source_word: αὕτη
  choice: itu
  rationale: Kata tunjuk ini dipertahankan secara eksplisit agar penekanan pada perintah yang sama tetap terdengar alami dalam bahasa Indonesia.
- source_word: εἰς θάνατον
  choice: menuju kepada kematian
  rationale: Pilihan ini sengaja sejajar dengan 'menuju kepada hidup', sehingga kontras retoris antara ζωή dan θάνατος serta pengulangan εἰς tetap terpelihara.
theological_decisions:
- issue: Apakah perintah harus digambarkan secara eksplisit sebagai penyebab kematian
  choice: ternyata bagiku ... menuju kepada kematian
  alternative: membawa kematian bagiku
  rationale: Teks menyatakan hasil yang ditemukan dalam pengalaman Paulus, tetapi tidak memakai kata kerja yang secara langsung berarti 'membawa' atau 'menyebabkan'. Terjemahan mempertahankan ketegangan teologis itu.
- issue: Apakah εἰς ζωὴν harus dipahami sebagai maksud atau hasil
  choice: menuju kepada hidup
  alternative: dimaksudkan untuk membawa hidup
  rationale: Frasa Yunani dapat menunjuk arah, tujuan, atau hasil. Rumusan utama tidak mengunci pembaca pada satu penafsiran saja.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Kata ganti 'aku' mengikuti suara orang pertama tunggal Paulus. 'Justru' menandai kontras kuat antara hidup dan kematian yang tersirat oleh susunan Yunani, sedangkan kesejajaran 'menuju kepada hidup ... menuju kepada kematian' mempertahankan bentuk retoris sumber.
