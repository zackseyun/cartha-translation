  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀χάρις τῷ θεῷ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν. Ἄρα οὖν αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω νόμῳ θεοῦ, τῇ δὲ σαρκὶ νόμῳ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/025.yaml
  text: Thanks be to God through Jesus the Messiah our Lord! So then[a], I myself serve the law of God with my mind[c][b], but with my flesh the law of sin.
translation:
  language: id
  text: Syukur kepada Allah melalui Yesus Sang Mesias, Tuhan kita! Jadi, aku sendiri melayani hukum Allah dengan akal budiku, tetapi dengan dagingku[a] aku melayani hukum dosa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tabiat berdosaku” untuk “dagingku.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “prinsip dosa” untuk “hukum dosa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις τῷ θεῷ
  choice: Syukur kepada Allah
  rationale: Dalam konstruksi seruan ini, χάρις dengan datif menyatakan ucapan syukur; ungkapan Indonesia ini alami dan tetap dekat dengan bentuk sumber.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: melalui Yesus Sang Mesias, Tuhan kita
  rationale: διά dengan genitif berarti 'melalui'; Χριστός dipertahankan sebagai gelar 'Sang Mesias', sedangkan κύριος diterjemahkan 'Tuhan' dalam susunan Indonesia yang wajar.
- source_word: Ἄρα οὖν
  choice: Jadi
  rationale: Gabungan partikel ini menandai simpulan atau rangkuman; 'Jadi' menyampaikan daya inferensialnya secara ringkas dan alami.
- source_word: αὐτὸς ἐγώ
  choice: aku sendiri
  rationale: Gabungan ini bersifat emfatis, dan 'aku sendiri' mempertahankan penekanannya.
- source_word: τῷ μὲν νοῒ ... τῇ δὲ σαρκὶ
  choice: dengan akal budiku ... tetapi dengan dagingku
  rationale: Datif menunjukkan sarana atau ranah dalam kontras yang seimbang. 'Akal budi' menyatakan νοῦς secara jelas, sedangkan 'daging' mempertahankan istilah konkret dan ketegangan teologis σάρξ.
- source_word: δουλεύω
  choice: melayani
  rationale: Kata ini mengandung gagasan pengabdian atau perhambaan. 'Melayani' sesuai dengan konstruksi Indonesia, sementara nuansa tunduk tetap tersirat.
- source_word: νόμῳ θεοῦ
  choice: hukum Allah
  rationale: '''Hukum'' mempertahankan istilah νόμος dan kesinambungannya dalam argumen Roma 7.'
- source_word: νόμῳ ἁμαρτίας
  choice: hukum dosa
  rationale: Terjemahan yang sama untuk νόμος mempertahankan paralel yang disengaja dengan 'hukum Allah' tanpa menafsirkan kata itu sebagai sekadar prinsip.
theological_decisions:
- issue: Makna σάρξ dalam konteks moral Paulus
  choice: daging
  alternative: tabiat berdosa
  rationale: σάρξ secara harfiah adalah 'daging' dan di sini memang bermuatan moral, tetapi sumber tidak secara eksplisit mengatakan 'tabiat berdosa'. Pilihan utama mempertahankan ketegangan antropologis Paulus.
- issue: Makna νόμος dalam frasa νόμῳ ἁμαρτίας
  choice: hukum dosa
  alternative: prinsip dosa
  rationale: '''Hukum'' menjaga pengulangan leksikal dan kontras dengan hukum Allah; ''prinsip'' adalah penafsiran yang mungkin tetapi lebih menjelaskan daripada teks Yunani.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti orang pertama tunggal 'aku' mempertahankan suara personal dan emfatis Paulus. Pengulangan 'aku melayani' pada klausa kedua dibuat eksplisit demi kelancaran dan kejelasan dalam bahasa Indonesia, meskipun verba Yunani hanya dinyatakan sekali dan berlaku bagi kedua klausa.
