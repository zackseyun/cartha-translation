id: ROM.7.2
reference: Romans 7:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/002.yaml
  text: For a married woman is bound by law to her husband while he lives; but if the husband dies[a], she is released from the law of her husband.
translation:
  language: id
  text: Sebab seorang perempuan yang bersuami terikat oleh hukum kepada suaminya selama suaminya hidup. Namun, jika suaminya mati, ia dibebaskan dari hukum yang mengikatnya kepada suaminya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia telah dibebaskan dari hukum suaminya.” Ungkapan Yunani kemungkinan menunjuk pada ikatan hukum yang menghubungkannya dengan suaminya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕπανδρος γυνή
  choice: seorang perempuan yang bersuami
  rationale: Ungkapan ini secara alami menyatakan perempuan yang berada dalam ikatan perkawinan, sambil mempertahankan nuansa relasional dan hukum dari bentuk Yunani.
- source_word: τῷ ζῶντι ἀνδρί
  choice: kepada suaminya selama suaminya hidup
  rationale: Dativa menunjukkan pihak yang kepadanya perempuan itu terikat; klausa temporal mengungkapkan dengan jelas bahwa ikatan tersebut berlaku selama sang suami hidup.
- source_word: δέδεται
  choice: terikat
  rationale: Bentuk perfek pasif menyatakan keadaan terikat yang terus berlaku sebagai hasil tindakan sebelumnya; 'terikat' ringkas dan wajar dalam konteks hukum.
- source_word: νόμῳ
  choice: oleh hukum
  rationale: Tanpa artikel, kata ini paling wajar menunjuk pada hukum atau prinsip hukum secara umum dalam kerangka perkawinan, bukan secara tegas hanya kepada Hukum Musa.
- source_word: κατήργηται
  choice: dibebaskan
  rationale: Dalam konteks ini verba tersebut berarti dibuat tidak lagi berada di bawah daya ikat atau kewajiban hukum, bukan 'dihapuskan' secara harfiah.
- source_word: ἀπὸ τοῦ νόμου τοῦ ἀνδρός
  choice: dari hukum yang mengikatnya kepada suaminya
  rationale: Genitiva Yunani bersifat padat dan dapat terdengar seolah-olah suami adalah pembuat hukum jika diterjemahkan 'hukum suaminya'; rumusan ini menyampaikan hubungan hukum perkawinan tanpa menutup nuansa legalnya.
theological_decisions:
- issue: Apakah νόμῳ / τοῦ νόμου secara khusus menunjuk kepada Hukum Musa atau kepada ikatan hukum perkawinan secara umum
  choice: hukum atau ikatan hukum perkawinan secara umum
  alternative: Hukum Musa sebagaimana berlaku bagi perkawinan
  rationale: Konteks langsung memakai perkawinan sebagai analogi pembebasan dari hukum melalui kematian. Tidak adanya artikel pada νόμῳ dalam klausa pertama dan bingkai perkawinan mendukung pengertian prinsip hukum perkawinan, meskipun hubungan lebih luas dengan pembahasan tentang hukum tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Perempuan yang bersuami' mempertahankan fokus pada status perkawinan; pengulangan 'suaminya' dipilih demi kejelasan. Penanda catatan kaki ditempatkan setelah frasa yang dijelaskannya.
