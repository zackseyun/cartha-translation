  source_fidelity: 'Terjemahan menyampaikan unsur-unsur utama teks Yunani dengan tepat: perempuan bersuami, keterikatan oleh hukum kepada suaminya selama suami itu hidup, dan pembebasan dari ikatan hukum tersebut ketika suaminya mati. “Hukum yang mengikatnya kepada suaminya” secara wajar menguraikan genitiva yang padat dalam τοῦ νόμου τοῦ ἀνδρός tanpa menyatakan bahwa suami adalah pembuat hukum.'
