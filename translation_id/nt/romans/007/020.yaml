  text: εἰ δὲ ὃ οὐ ⸀θέλω τοῦτο ποιῶ, οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/020.yaml
  text: But if I do what I do not want[a], I am no longer the one doing it, but sin dwelling in me.
translation:
  language: id
  text: Tetapi jika aku melakukan apa yang tidak kukehendaki, bukan lagi aku yang mengerjakannya, melainkan dosa yang tinggal di dalam diriku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Namun, jika
  rationale: Meneruskan argumen bersyarat Paulus sekaligus mempertahankan kontras ringan yang dinyatakan oleh δέ.
- source_word: ὃ οὐ θέλω τοῦτο ποιῶ
  choice: aku melakukan apa yang tidak aku kehendaki
  rationale: Mempertahankan hubungan relatif-korelatif dalam bentuk Indonesia yang wajar; “kehendaki” menyampaikan θέλω tanpa mempersempitnya menjadi sekadar kesukaan.
- source_word: οὐκέτι ἐγὼ κατεργάζομαι αὐτό
  choice: bukan lagi aku yang mengerjakannya
  rationale: “Bukan lagi” mempertahankan οὐκέτι, sedangkan konstruksi “aku yang” menyampaikan penekanan pada ἐγώ. “Mengerjakan” membedakan κατεργάζομαι dari ποιῶ sebelumnya tanpa membuat perbedaan makna yang berlebihan.
- source_word: ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: melainkan dosa yang tinggal di dalam diriku
  rationale: Mempertahankan kontras ἀλλά, menyebut ἁμαρτία langsung sebagai “dosa,” dan menjaga gambaran dosa yang berdiam dalam diri Paulus.
theological_decisions:
- issue: Pembedaan retoris antara “aku” dan dosa yang tinggal di dalam diri Paulus dapat dibaca seolah-olah menghapus tanggung jawab pribadi.
  choice: 'Mempertahankan pernyataan secara langsung: “bukan lagi aku ... melainkan dosa yang tinggal di dalam diriku.”'
  alternative: Memparafrasakan ayat untuk menjelaskan hubungan antara pelaku, tanggung jawab, dan kuasa dosa.
  rationale: Teks Yunani sengaja mempertahankan ketegangan antara “aku” dan “dosa”; terjemahan tidak seharusnya menyelesaikan perdebatan teologis yang tidak diselesaikan oleh ayat ini.
- issue: Identitas ἁμαρτία dalam klausa penutup.
  choice: dosa
  alternative: kodrat berdosa
  rationale: Teks menyebut ἁμαρτία, bukan σάρξ atau ungkapan yang berarti “kodrat berdosa”; “dosa” juga mempertahankan personifikasi dalam argumen Paulus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “aku” mengikuti tuturan orang pertama Paulus dan terdengar alami dalam wacana pribadi. Tidak disertakan catatan kaki karena teks Yunani yang diberikan tidak menampilkan varian yang perlu dijelaskan; catatan kaki Inggris yang disediakan juga tidak sesuai dengan letak penandanya.
