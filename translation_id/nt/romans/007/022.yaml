  yaml_path: translation/nt/romans/007/022.yaml
  text: For I delight in the law of God in my inner man,[a]
translation:
  language: id
  text: Sebab dalam batinku aku menyukai hukum Allah,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut manusia batiniah”; dapat juga diterjemahkan “dalam diriku yang batiniah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήδομαι
  choice: aku menyukai
  rationale: Kata kerja ini menyatakan persetujuan batin yang disertai rasa senang, bukan sekadar persetujuan intelektual. 'Menyukai' alami dalam bahasa Indonesia dan mempertahankan unsur afektifnya.
- source_word: νόμῳ τοῦ θεοῦ
  choice: hukum Allah
  rationale: '''Hukum'' mempertahankan istilah Paulus yang berbobot dalam konteks Roma, sedangkan konstruksi ''hukum Allah'' merupakan bentuk genitif yang alami dalam bahasa Indonesia.'
- source_word: κατὰ
  choice: dalam
  rationale: Dalam ungkapan ini, κατά menunjukkan segi atau ranah batin tempat kesukaan itu berlaku. 'Dalam' menghasilkan bahasa Indonesia yang wajar tanpa memaksakan arti teknis.
- source_word: τὸν ἔσω ἄνθρωπον
  choice: batinku
  rationale: Ungkapan ini merujuk pada diri manusia yang batiniah. 'Batinku' menyampaikan rujukan orang pertama secara idiomatis; unsur kepunyaan tersirat oleh konteks, meskipun tidak dinyatakan sebagai kata ganti dalam bahasa Yunani.
theological_decisions:
- issue: Nuansa antropologis ungkapan τὸν ἔσω ἄνθρωπον
  choice: batinku
  alternative: manusia batiniahku; manusia batiniah
  rationale: Pilihan ini mempertahankan pembedaan antara sisi batiniah dan lahiriah manusia tanpa menetapkan suatu model teknis mengenai susunan hakikat manusia. Catatan kaki mempertahankan metafora harfiah Paulus.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan 'Sebab ... aku ...' mempertahankan γάρ serta orang pertama. Koma akhir sumber diganti tanda baca ayat yang lengkap.
