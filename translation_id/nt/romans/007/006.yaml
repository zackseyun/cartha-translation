  to: Namun, sekarang kita telah dibebaskan dari hukum Taurat[a], karena kita telah mati terhadap apa yang dahulu menahan kita, sehingga kita melayani dengan cara baru oleh Roh[c], bukan dengan cara lama berdasarkan huruf[b].
  rationale: 'Revisi mempertahankan urutan dan relasi pokok teks Yunani: pembebasan dari hukum Taurat, kematian kita terhadap yang dahulu menahan kita, dan tujuan agar kita melayani dalam modus baru yang dikaitkan dengan Roh, bukan modus lama yang dikaitkan dengan huruf. Kalimat tetap satu kesatuan agar partisip ''karena kita telah mati'' jelas menjelaskan subjek ''kita'' dan berhubungan dengan pembebasan. Catatan kaki diselaraskan dengan jangkar yang ada dan dibatasi pada alternatif yang relevan.'
