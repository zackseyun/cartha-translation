id: ROM.7.6
reference: Romans 7:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου, ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/006.yaml
  text: But now we have been released from the law[a], having died to what held us[c][b], so that we serve in newness of the Spirit and not in oldness of the letter.
translation:
  language: id
  text: Namun, sekarang kita telah dibebaskan dari hukum Taurat[a], karena kita telah mati terhadap apa yang dahulu menahan kita, sehingga kita melayani dengan cara baru oleh Roh[c], bukan dengan cara lama berdasarkan huruf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dengan menghubungkan frasa berikutnya: “telah dibebaskan dari hukum Taurat, setelah mati terhadap apa yang dahulu menahan kita.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “berdasarkan hukum tertulis.”
    reason: lexical_alternative
  - marker: c
    text: Atau “oleh roh.” Dalam bahasa Yunani, bentuk tulisannya tidak membedakan huruf besar dan kecil.
    reason: alternative_reading
lexical_decisions:
- source_word: κατηργήθημεν ἀπὸ τοῦ νόμου
  choice: telah dibebaskan dari hukum Taurat
  rationale: Bentuk pasif bersama ἀπό menyatakan bahwa orang percaya dilepaskan dari kuasa mengikat hukum Taurat, bukan bahwa hukum itu ditiadakan atau berhenti ada.
- source_word: ἀποθανόντες
  choice: kita telah mati
  rationale: Partisip aoris ini merujuk kepada subjek jamak, yaitu 'kita'. Pemecahan menjadi kalimat tersendiri membuat hubungan gramatikalnya jelas tanpa mengubah isinya.
- source_word: ἐν ᾧ κατειχόμεθα
  choice: terhadap apa yang dahulu membelenggu kita
  rationale: Ungkapan ini menyampaikan keadaan sebelumnya ketika kita ditahan atau diikat. 'Membelenggu' mempertahankan nuansa keterikatan dan cocok dengan gambaran pembebasan.
- source_word: δουλεύειν
  choice: melayani
  rationale: Kata ini dapat memuat gambaran perhambaan, tetapi dalam klausa ini tekanannya terletak pada cara pelayanan. 'Melayani' alami dalam bahasa Indonesia dan tetap mempertahankan hubungan dengan pengabdian kepada Allah.
- source_word: καινότητι πνεύματος
  choice: dalam keadaan baru menurut Roh
  rationale: Terjemahan ini mempertahankan nomina abstrak 'kebaruan' secara wajar dalam bahasa Indonesia dan memahami πνεῦμα sebagai Roh Kudus, sambil menaruh kemungkinan 'roh' dalam catatan kaki.
- source_word: παλαιότητι γράμματος
  choice: dalam keadaan lama menurut huruf yang tertulis
  rationale: Pilihan ini menjaga kesejajaran dengan 'keadaan baru' dan mempertahankan idiom Paulus tentang 'huruf', tanpa langsung menafsirkannya sepenuhnya sebagai suatu tata hukum tertulis.
- source_word: νόμου
  choice: hukum Taurat
  rationale: Dalam konteks Roma 7, rujukannya ialah hukum Musa. 'Hukum Taurat' merupakan ungkapan Indonesia yang jelas dan tidak menyiratkan bahwa semua hukum secara umum dimaksudkan.
theological_decisions:
- issue: Apakah hukum Taurat yang mati atau orang percaya yang mati dalam hubungannya dengan hukum Taurat
  choice: 'Orang percaya adalah pihak yang mati: ''Kita telah mati terhadap apa yang dahulu membelenggu kita.'''
  alternative: Hukum Taurat mati dalam hubungannya dengan kita.
  rationale: ἀποθανόντες berbentuk nominatif jamak dan menerangkan subjek tersirat 'kita'. Terjemahan mengikuti tata bahasa Yunani dan tidak menyatakan bahwa hukum Taurat sendiri mati.
- issue: Apakah πνεύματος merujuk kepada Roh Kudus atau roh manusia
  choice: Roh
  alternative: roh
  rationale: Kontras Paulus antara Roh dan huruf serta konteks kehidupan perjanjian baru lebih mendukung rujukan kepada Roh Kudus. Namun, bentuk Yunani tidak memakai penanda kapitalisasi dan secara leksikal masih memungkinkan pengertian 'roh', sehingga alternatif itu dicatat.
- issue: Makna γράμματος dalam kontras dengan πνεύματος
  choice: huruf yang tertulis
  alternative: tata hukum tertulis
  rationale: Terjemahan utama mempertahankan idiom dan ketegangan teologis Paulus. Alternatif yang lebih interpretatif diberikan dalam catatan kaki tanpa dimasukkan diam-diam ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur Yunani yang padat dipecah menjadi dua kalimat agar subjek 'kita' dari ἀποθανόντες tidak kabur. Istilah 'hukum Taurat', 'Roh', dan 'huruf yang tertulis' mempertahankan kosakata serta kontras utama Paulus, sedangkan kemungkinan tafsir lain disimpan dalam catatan kaki.
