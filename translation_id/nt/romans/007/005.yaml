    rationale: Dative τῷ θανάτῳ menyatakan arah/hasil. Frasa 'yang berujung pada kematian' lebih idiomatis dalam bahasa Indonesia, tetap mempertahankan hasil metafora buah tanpa menyempitkan makna kematian.
