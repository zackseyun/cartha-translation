    rationale: Imperfek menunjukkan kegiatan yang sedang berlangsung pada masa lampau; 'sedang bekerja' menyampaikan aspek ini tanpa secara potensial menguatkannya menjadi kegiatan yang tak terputus.
  - severity: low
