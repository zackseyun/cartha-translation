revisions:
- from: Sebab ketika kita berada dalam daging[a], berbagai hawa nafsu dosa[b] yang timbul melalui hukum Taurat terus bekerja dalam anggota-anggota tubuh kita[c] sehingga menghasilkan buah bagi kematian.
  to: Sebab ketika kita berada dalam daging[a], hawa nafsu berdosa yang timbul melalui hukum Taurat sedang bekerja dalam anggota-anggota tubuh kita[c], sehingga menghasilkan buah yang berujung pada kematian.
  rationale: Revisi ini menghilangkan tambahan makna 'berbagai,' memakai bentuk yang lebih idiomatis untuk aspek imperfek, dan melancarkan ungkapan hasil menuju kematian. Istilah kunci dan ambiguitas Paulus tetap dipertahankan. Catatan b tetap disediakan sebagai padanan harfiah untuk genitif τῶν ἁμαρτιῶν, walaupun penanda catatan tidak muncul dalam teks utama karena catatan itu mendokumentasikan alternatif leksikal bagi 'hawa nafsu berdosa.'
  reviewer_model: gpt-5.6-terra
