id: ROM.7.5
reference: Romans 7:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/005.yaml
  text: For when we were in the flesh[a], the sinful passions that came through the law[c][b], were at work in our members to bear fruit for death.
translation:
  language: id
  text: Sebab ketika kita berada dalam daging[a], hawa nafsu berdosa yang timbul melalui hukum Taurat sedang bekerja dalam anggota-anggota tubuh kita[c], sehingga menghasilkan buah yang berujung pada kematian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam kodrat berdosa” atau “dalam keadaan manusia kita yang telah jatuh.”
    reason: alternative_reading
  - marker: c
    text: “Anggota-anggota tubuh” di sini mengacu pada bagian-bagian atau kemampuan tubuh sebagai sarana untuk bertindak.
    reason: cultural_note
lexical_decisions:
- source_word: σάρξ
  choice: daging
  rationale: Mempertahankan metafora khas Paulus dan ketegangan maknanya, tanpa langsung menafsirkannya sebagai suatu rumusan antropologis tertentu.
- source_word: παθήματα τῶν ἁμαρτιῶν
  choice: berbagai hawa nafsu dosa
  rationale: Ungkapan ini menyampaikan dorongan kuat yang bercirikan dosa secara alami dalam bahasa Indonesia; kata 'berbagai' mencerminkan bentuk jamak tanpa memakai pengulangan yang kaku.
- source_word: διὰ τοῦ νόμου
  choice: yang timbul melalui hukum Taurat
  rationale: Kata 'melalui' mempertahankan kemungkinan nuansa perantaraan atau sebab, sedangkan 'timbul' membuat hubungan frasa itu jelas dalam bahasa Indonesia tanpa memakai tafsiran yang lebih kuat seperti 'dibangkitkan'.
- source_word: νόμος
  choice: hukum Taurat
  rationale: Dalam konteks Roma 7, νόμος menunjuk terutama kepada hukum Musa; 'hukum Taurat' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: ἐνηργεῖτο
  choice: terus bekerja
  rationale: Menangkap aspek kegiatan yang sedang berlangsung pada masa lampau dari bentuk imperfek.
- source_word: μέλεσιν
  choice: anggota-anggota tubuh
  rationale: Menjaga gambaran bagian-bagian tubuh sebagai sarana tindakan, sekaligus lebih jelas bagi pembaca modern daripada hanya 'anggota-anggota'.
- source_word: καρποφορῆσαι
  choice: menghasilkan buah
  rationale: Mempertahankan metafora organik Paulus dengan ungkapan Indonesia yang wajar.
- source_word: τῷ θανάτῳ
  choice: bagi kematian
  rationale: Mempertahankan arah atau hasil dari metafora menghasilkan buah tanpa mempersempitnya menjadi satu hubungan logis saja.
theological_decisions:
- issue: Makna ἐν τῇ σαρκί
  choice: berada dalam daging
  alternative: hidup dalam kodrat berdosa / berada dalam keadaan manusia yang telah jatuh
  rationale: Teks utama mempertahankan istilah konkret Paulus agar cakupan antropologis dan teologisnya tidak dipersempit; catatan kaki menjelaskan kemungkinan makna metaforis.
- issue: Hubungan hukum Taurat dengan hawa nafsu dosa
  choice: yang timbul melalui hukum Taurat
  alternative: yang dibangkitkan oleh hukum Taurat
  rationale: Pilihan utama mempertahankan daya perantara atau sebab dari διά tanpa menyatakan secara berlebihan bahwa hukum Taurat sendiri adalah sumber dosa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Istilah 'daging' dipertahankan sebagai metafora Paulus dan dijelaskan dalam catatan; 'hukum Taurat' dipilih agar rujukan kontekstual νόμος jelas bagi pembaca umum.
