  text: ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ’ ὃ μισῶ τοῦτο ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/015.yaml
  text: For I do not understand what I am doing, because I do not practice what I want; instead, I do the very thing I hate.
translation:
  language: id
  text: Sebab, aku tidak mengerti apa yang kulakukan, karena aku tidak melakukan apa yang kuinginkan, melainkan melakukan apa yang kubenci.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεργάζομαι
  choice: kulakukan
  rationale: Dalam konteks ini berarti mengerjakan atau menghasilkan suatu tindakan; bentuk sederhana ini alami dalam bahasa Indonesia dan mempertahankan hubungan dengan tindakan yang sedang dibahas.
- source_word: οὐ γινώσκω
  choice: aku tidak mengerti
  rationale: γινώσκω dapat berarti mengetahui atau memahami; di sini ungkapan tersebut menyatakan ketidakmengertian terhadap perilaku sendiri, bukan sekadar tidak mengetahui faktanya.
- source_word: πράσσω
  choice: melakukan
  rationale: Menunjuk pada mempraktikkan atau menjalankan sesuatu; 'melakukan' paling wajar dalam kontras dengan kehendak pembicara.
- source_word: ποιῶ
  choice: melakukan
  rationale: Walaupun berbeda verba dari πράσσω, keduanya bertumpang tindih dalam konteks ini; pengulangan 'melakukan' menghasilkan bahasa Indonesia yang alami tanpa memaksakan perbedaan semantis yang belum tentu dimaksudkan.
- source_word: ἀλλ’
  choice: tetapi justru
  rationale: Menandai kontras kuat antara apa yang diinginkan dan apa yang benar-benar dilakukan; 'justru' menonjolkan pembalikan tersebut tanpa menambah isi teologis.
theological_decisions:
- issue: Identitas dan keadaan rohani orang pertama tunggal
  choice: Mempertahankan pernyataan orang pertama tanpa menjelaskan apakah Paulus berbicara tentang dirinya pada masa lalu, masa kini, secara retoris, atau sebagai wakil manusia tertentu.
  alternative: Menambahkan penjelasan yang mengidentifikasi pembicara sebagai orang percaya, orang yang belum percaya, atau Israel.
  rationale: Ayat Yunani sendiri tidak menyelesaikan perdebatan itu; terjemahan tidak boleh mengimpor kesimpulan teologis tertentu.
- issue: Hubungan γάρ kedua dengan klausa sebelumnya
  choice: Diterjemahkan secara implisit melalui susunan kalimat yang menjelaskan ketidakmengertian pembicara.
  alternative: Mengulang 'sebab' atau memakai 'karena' secara eksplisit sebelum klausa kedua.
  rationale: γάρ bersifat menjelaskan, tetapi pengulangan konjungsi dalam bahasa Indonesia terasa berat. Hubungan penjelas tetap jelas dari urutan kalimat, tanpa mengubahnya menjadi hubungan sebab-akibat yang terlalu tegas.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk terikat 'kulakukan', 'kuinginkan', dan 'kubenci' menjaga irama orang pertama serta mudah dipahami. Tidak diperlukan catatan kaki karena tidak ada varian tekstual atau ambiguitas leksikal yang perlu dijelaskan kepada pembaca umum.
