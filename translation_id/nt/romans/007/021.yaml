  text: Εὑρίσκω ἄρα τὸν νόμον τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν ὅτι ἐμοὶ τὸ κακὸν παράκειται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/021.yaml
  text: 'So I find this law: when I want to do what is good[a], evil lies close at hand.'
translation:
  language: id
  text: 'Jadi, aku mendapati hukum[a] ini: ketika aku ingin melakukan apa yang baik, kejahatan ada di dekatku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “prinsip” atau “kaidah.”
    reason: Menjaga kemungkinan kontekstual bahwa νόμος berarti prinsip atau pola yang berlaku, bukan secara khusus Hukum Musa.
lexical_decisions:
- source_word: Εὑρίσκω
  choice: aku mendapati
  rationale: Bentuk kini menyatakan pengenalan atau kesimpulan yang sedang berlaku; “mendapati” alami dalam konteks penalaran ini.
- source_word: ἄρα
  choice: Jadi
  rationale: Menandai kesimpulan dari uraian sebelumnya dengan penghubung yang wajar dalam bahasa Indonesia modern.
- source_word: νόμον
  choice: hukum
  rationale: Mempertahankan padanan langsung νόμος dan gaung istilah “hukum” dalam argumentasi Paulus, tanpa memastikan bahwa yang dimaksud adalah Hukum Musa.
- source_word: τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλόν
  choice: ketika aku ingin melakukan apa yang baik
  rationale: Mengungkapkan konstruksi datif Yunani secara alami sambil mempertahankan unsur kehendak dan tindakan.
- source_word: τὸ καλόν
  choice: apa yang baik
  rationale: Padanan idiomatis bagi adjektiva substantival Yunani dan tetap menekankan hal yang baik.
- source_word: τὸ κακόν
  choice: kejahatan
  rationale: Menyampaikan adjektiva substantival sebagai realitas jahat yang hadir, dengan ungkapan Indonesia yang ringkas dan alami.
- source_word: παράκειται
  choice: ada di dekatku
  rationale: Mempertahankan gambaran sesuatu yang berada dekat atau siap hadir, tanpa mempersempitnya menjadi sekadar keberadaan batin.
theological_decisions:
- issue: Apakah νόμον menunjuk kepada Hukum Musa atau kepada suatu prinsip/pola yang bekerja
  choice: “hukum” dalam teks utama
  alternative: “prinsip” atau “kaidah”
  rationale: Pemakaian “hukum” mempertahankan pilihan kata dan ketegangan dalam bahasa Yunani. Catatan kaki menunjukkan kemungkinan bahwa konteksnya berbicara tentang prinsip atau pola, bukan secara khusus Hukum Musa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “aku” mengikuti tuturan orang pertama Paulus; susunan kalimat dibuat alami tanpa menghilangkan ambiguitas νόμος.
