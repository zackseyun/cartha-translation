revisions:
- from: Jadi, apakah yang baik itu menjadi kematian bagiku? Sama sekali tidak! Sebaliknya, dosalah yang melakukannya, supaya dosa itu nyata sebagai dosa[a] dengan mendatangkan kematian bagiku melalui apa yang baik itu, dan supaya melalui perintah tersebut dosa menjadi luar biasa berdosa[b].
  to: Jadi, apakah yang baik itu menjadi kematian bagiku? Sama sekali tidak! Sebaliknya, dosa mendatangkan kematian bagiku melalui apa yang baik itu, supaya dosa tampak sebagai dosa[a], dan supaya, melalui perintah itu, dosa menjadi sangat berdosa[b].
  rationale: Revisi menyatakan secara langsung bahwa dosalah yang mendatangkan kematian melalui yang baik, tanpa menambah objek tersirat pada “melakukannya.” Kedua klausa ἵνα tetap diterjemahkan sebagai tujuan dengan “supaya”; pengulangan “dosa” dan paradoks bahwa dosa “menjadi sangat berdosa” tetap dipertahankan.
  reviewer_model: gpt-5.6-terra
