id: ROM.7.13
reference: Romans 7:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τὸ οὖν ἀγαθὸν ἐμοὶ ⸀ἐγένετο θάνατος; μὴ γένοιτο· ἀλλὰ ἡ ἁμαρτία, ἵνα φανῇ ἁμαρτία διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον· ἵνα γένηται καθ’ ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/013.yaml
  text: So then[a], did what is good become death to me? May it never be! Rather, it was sin, so that it might be shown to be sin by producing death in me through what is good[b], in order that through the commandment sin might become exceedingly sinful.
translation:
  language: id
  text: Jadi, apakah yang baik itu menjadi kematian bagiku? Sama sekali tidak! Sebaliknya, dosa mendatangkan kematian bagiku melalui apa yang baik itu, supaya dosa tampak sebagai dosa[a], dan supaya, melalui perintah itu, dosa menjadi sangat berdosa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “supaya diperlihatkan sebagai dosa.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “menjadi berdosa secara berlebih-lebihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ ... ἀγαθὸν
  choice: yang baik itu
  rationale: Adjektiva netral yang berfungsi sebagai nomina; ungkapan ini alami dalam bahasa Indonesia dan tetap menunjuk kepada sesuatu yang baik, yakni perintah yang disebut dalam konteks.
- source_word: ἐμοὶ
  choice: bagiku
  rationale: Datif acuan pribadi; bentuk ini wajar dalam pertanyaan retoris Indonesia dan tidak memaksakan makna lokatif.
- source_word: ἐγένετο θάνατος
  choice: menjadi kematian
  rationale: Mempertahankan konstruksi predikatif γίνομαι dengan θάνατος, tanpa mengubahnya menjadi parafrasa kausal.
- source_word: μὴ γένοιτο
  choice: Sama sekali tidak!
  rationale: Penolakan yang tegas dan idiomatis dalam bahasa Indonesia modern, sesuai dengan kekuatan ungkapan Paulus.
- source_word: ἡ ἁμαρτία
  choice: dosa
  rationale: Mempertahankan personifikasi dosa sebagai pelaku tanpa menambahkan penafsiran teologis.
- source_word: ἵνα φανῇ ἁμαρτία
  choice: supaya dosa itu nyata sebagai dosa
  rationale: Mempertahankan klausa tujuan dan pengulangan retoris kata 'dosa', sekaligus menyampaikan bahwa sifat sejati dosa menjadi tampak.
- source_word: διὰ τοῦ ἀγαθοῦ
  choice: melalui apa yang baik itu
  rationale: Mempertahankan hubungan instrumental διά dan keterkaitannya dengan 'yang baik' pada awal ayat.
- source_word: μοι κατεργαζομένη θάνατον
  choice: dengan mendatangkan kematian bagiku
  rationale: Mengungkapkan tindakan dosa yang menghasilkan kematian serta mempertahankan datif μοι sebagai 'bagiku'.
- source_word: ἵνα γένηται
  choice: supaya ... menjadi
  rationale: Menjaga fungsi klausa tujuan kedua dan arti dasar γίνομαι.
- source_word: καθ’ ὑπερβολὴν ἁμαρτωλὸς
  choice: luar biasa berdosa
  rationale: Ungkapan Indonesia yang jelas dan kuat untuk derajat yang melampaui batas, tanpa mengurangi paradoks 'dosa menjadi berdosa'.
- source_word: διὰ τῆς ἐντολῆς
  choice: melalui perintah tersebut
  rationale: Menerjemahkan ἐντολή secara konsisten dengan konteks dan mempertahankan fungsi instrumental frasa tersebut.
theological_decisions:
- issue: Pembelaan Paulus atas kebaikan hukum atau perintah
  choice: Yang baik tidak dijadikan pelaku penyebab kematian; dosa ditegaskan sebagai pelaku yang mendatangkan kematian melalui yang baik.
  alternative: Menerjemahkan secara longgar sehingga perintah itu sendiri terkesan sebagai penyebab kematian yang bersalah secara moral.
  rationale: Kontras sesudah μὴ γένοιτο mengalihkan tanggung jawab kepada dosa. Terjemahan mempertahankan struktur pelaku tersebut tanpa menghapus ketegangan bahwa dosa bekerja melalui perintah yang baik.
- issue: Hubungan dua klausa ἵνα
  choice: Keduanya dipertahankan sebagai klausa tujuan dengan 'supaya'.
  alternative: Memahami salah satu atau kedua klausa hanya sebagai hasil, misalnya dengan 'sehingga'.
  rationale: Bentuk Yunani memungkinkan nuansa tujuan atau hasil, tetapi pengulangan ἵνα dan alur argumen mendukung dipertahankannya tujuan; terjemahan tidak menjelaskan lebih jauh siapa yang menetapkan tujuan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Personifikasi 'dosa' serta pengulangan paradoksal 'dosa ... berdosa' dipertahankan. 'Sama sekali tidak!' dipilih sebagai penolakan tegas yang mudah dipahami tanpa nuansa arkais.
