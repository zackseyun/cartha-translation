  source_fidelity: Teks Indonesia dengan setia menerjemahkan seruan nominal ταλαίπωρος ἐγὼ ἄνθρωπος sebagai “Aku ini manusia celaka!” dan mempertahankan pertanyaan personal τίς dengan “Siapa”. “Akan menyelamatkan” merupakan padanan yang sah untuk ῥύσεται, sedangkan “dari tubuh maut ini” mempertahankan σώματος serta hubungan eratnya dengan kematian tanpa menafsirkan citra tersebut secara doktrinal. Catatan kaki b dengan tepat mencatat bentuk yang lebih harfiah, di mana kata tunjuk berkaitan dengan “kematian ini.”
  naturalness: Bahasa Indonesia modernnya lugas, jelas, dan bernada seru secara wajar. “Aku ini manusia celaka!” menyampaikan ratapan pribadi yang kuat tanpa terdengar kuno atau terlalu bebas. Frasa “tubuh maut ini” padat dan bercorak luhur, sesuai dengan register surat Paulus; catatan kaki menyediakan bentuk yang lebih eksplisit bagi pembaca.
  terminology: “Manusia,” “menyelamatkan,” “tubuh,” dan “maut” konsisten dengan istilah Alkitab Indonesia yang dapat dipahami secara modern. Pilihan “maut” mempertahankan bobot retoris θάνατος tanpa menentukan makna teologis citra “tubuh maut.” Catatan alternatif “melepaskan” dengan benar mencerminkan rentang makna ῥύσεται.
