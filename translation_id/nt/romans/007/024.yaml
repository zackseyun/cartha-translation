base_translation:
  language: en
  yaml_path: translation/nt/romans/007/024.yaml
  text: What a wretched man I am! Who will rescue me from this body of death?[a][b]
translation:
  language: id
  text: Aku ini manusia celaka! Siapa yang akan menyelamatkan[a] aku dari tubuh maut ini?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “melepaskan”.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “tubuh dari kematian ini”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαίπωρος
  choice: celaka
  rationale: Mengungkapkan keadaan yang sangat menyedihkan dan sengsara, sesuai dengan kuatnya seruan Paulus, tanpa mengurangi nada kepedihannya.
- source_word: ἐγὼ ἄνθρωπος
  choice: aku ini manusia
  rationale: Mempertahankan kata ganti orang pertama, nomina ‘manusia’, dan penekanan pada diri pembicara dalam susunan bahasa Indonesia yang wajar.
- source_word: τίς
  choice: siapa
  rationale: Kata tanya ini menunjuk kepada pribadi yang dapat melakukan penyelamatan.
- source_word: ῥύσεται
  choice: akan menyelamatkan
  rationale: Kata kerja ini menyatakan tindakan menyelamatkan atau melepaskan seseorang dari bahaya maupun kuasa yang membelenggu; ‘menyelamatkan’ jelas dan kuat dalam bahasa Indonesia modern.
- source_word: ἐκ
  choice: dari
  rationale: Secara alami menyatakan pemisahan atau pembebasan dari sesuatu.
- source_word: σώματος
  choice: tubuh
  rationale: Mempertahankan gambaran konkret dalam teks Yunani dan tidak mengubahnya menjadi konsep abstrak.
- source_word: τοῦ θανάτου τούτου
  choice: maut ini
  rationale: Dalam gabungan ‘tubuh maut ini’, pilihan ini mempertahankan hubungan tubuh dengan kematian secara ringkas dan wajar, sementara bentuk Yunani yang lebih harfiah dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Hubungan gramatikal kata penunjuk dalam frasa τοῦ σώματος τοῦ θανάτου τούτου
  choice: tubuh maut ini
  alternative: tubuh dari kematian ini
  rationale: Secara gramatikal, τούτου berkaitan dengan ‘kematian’, tetapi terjemahan yang sangat harfiah terasa janggal dalam bahasa Indonesia. ‘Tubuh maut ini’ mempertahankan citra dan ketegangan ungkapan tanpa menjelaskan secara doktrinal apa yang dimaksud dengan tubuh atau maut; bentuk yang lebih harfiah dicatat sebagai alternatif.
- issue: Nuansa ῥύσεται sebagai penyelamatan atau pelepasan
  choice: akan menyelamatkan
  alternative: akan melepaskan
  rationale: Keduanya dimungkinkan oleh verba Yunani. ‘Menyelamatkan’ menyampaikan tindakan pertolongan dari keadaan genting dengan alami, sedangkan ‘melepaskan’ dipertahankan dalam catatan kaki agar nuansa pembebasan tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Seruan pembuka mempertahankan kata ‘manusia’ serta tekanan emosional teks Yunani; pertanyaan berikutnya tetap tajam dan tidak menambahkan penjelasan teologis yang tidak dinyatakan oleh ayat.
