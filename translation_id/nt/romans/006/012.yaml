  text: Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ⸀ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/012.yaml
  text: Therefore[a], do not let sin reign in your mortal body, so that you obey its desires.
translation:
  language: id
  text: Karena itu, jangan biarkan dosa berkuasa dalam tubuhmu yang fana, supaya kamu tidak menuruti keinginan-keinginannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “supaya kamu tidak menuruti keinginan-keinginan dosa.” Kata ganti Yunani paling langsung merujuk kepada tubuh yang fana, tetapi dalam konteksnya juga dapat dipahami sebagai berkaitan dengan dosa.
    reason: Menjaga kemungkinan pembacaan kontekstual yang mengaitkan keinginan dengan dosa, tanpa menghilangkan rujukan gramatikal yang paling langsung kepada tubuh.
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya dan mempertahankan hubungan logis secara jelas dalam bahasa Indonesia modern.
- source_word: βασιλευέτω
  choice: janganlah membiarkan ... berkuasa
  rationale: Menyampaikan larangan imperatif yang berkelanjutan dan mempertahankan gambaran dosa sebagai kuasa yang memerintah, dengan ungkapan Indonesia yang alami.
- source_word: ἁμαρτία
  choice: dosa
  rationale: Padanan langsung yang, bersama kata 'berkuasa', mempertahankan personifikasi Paulus tentang dosa sebagai kuasa yang memerintah.
- source_word: θνητῷ
  choice: yang fana
  rationale: Menyatakan bahwa tubuh sekarang tunduk pada kematian, dengan padanan ringkas dan lazim.
- source_word: σώματι
  choice: tubuh
  rationale: Padanan langsung tanpa mempersempitnya menjadi sekadar tubuh fisik atau mengubahnya menjadi metafora.
- source_word: εἰς τὸ ὑπακούειν
  choice: sehingga kamu menuruti
  rationale: Mencakup nuansa tujuan atau akibat dari konstruksi Yunani dan terdengar wajar dalam peringatan ini.
- source_word: ἐπιθυμίαις
  choice: keinginan-keinginan
  rationale: Mempertahankan cakupan luas istilah Yunani tanpa membatasinya pada hawa nafsu seksual.
- source_word: αὐτοῦ
  choice: -nya
  rationale: Secara gramatikal paling alami merujuk kepada 'tubuh' yang berjenis netral tunggal dalam bahasa Yunani, walaupun dalam konteks dapat dipahami berkaitan dengan dosa; ambiguitas itu dicatat dalam catatan kaki.
theological_decisions:
- issue: Apakah dosa disajikan hanya sebagai perbuatan atau sebagai kuasa yang memerintah
  choice: Mempertahankan personifikasi melalui ungkapan 'dosa berkuasa'.
  alternative: Menjelaskannya sebagai perilaku berdosa yang menguasai seseorang.
  rationale: Pilihan verba Yunani memakai gambaran pemerintahan seorang raja. Terjemahan mempertahankan ketegangan teologis itu tanpa menambahkan penjelasan doktrinal.
- issue: Anteseden αὐτοῦ ('-nya')
  choice: Memahami '-nya' dalam teks utama sebagai merujuk kepada tubuh yang fana.
  alternative: Memahaminya secara kontekstual sebagai keinginan-keinginan dosa.
  rationale: Bentuk pronomina maskulin/netral tunggal secara gramatikal cocok dengan σώματι, 'tubuh', yang netral tunggal, bukan dengan ἁμαρτία, 'dosa', yang feminin. Namun, kaitan konseptual dengan dosa tetap mungkin dan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Bentuk 'janganlah' mempertahankan kekuatan larangan, sedangkan 'berkuasa' menyampaikan metafora kerajaan secara alami. Penanda catatan kaki ditempatkan sesudah klausa yang memiliki ambiguitas.
