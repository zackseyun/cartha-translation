  text: ὃ γὰρ ἀπέθανεν, τῇ ἁμαρτίᾳ ἀπέθανεν ἐφάπαξ· ὃ δὲ ζῇ, ζῇ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/010.yaml
  text: For the death he died[a], he died to sin once for all; but the life he lives, he lives to God.
translation:
  language: id
  text: Sebab kematian-Nya adalah kematian terhadap dosa[a], satu kali untuk selama-lamanya; tetapi kehidupan-Nya adalah kehidupan bagi Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena dosa” atau “berkenaan dengan dosa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ γὰρ ἀπέθανεν
  choice: Sebab kematian yang telah Ia jalani
  rationale: Ungkapan relatif netral Yunani bersifat idiomatis dan menunjuk pada peristiwa kematian-Nya. Bentuk ini mempertahankan penekanan serta kesejajaran dengan klausa tentang kehidupan dalam bahasa Indonesia yang wajar.
- source_word: τῇ ἁμαρτίᾳ ἀπέθανεν
  choice: adalah kematian terhadap dosa
  rationale: Datif paling wajar menyatakan hubungan dengan dosa. 'Terhadap dosa' menjaga ambiguitas dan menghindari kesan bahwa Kristus memiliki dosa pribadi.
- source_word: ἐφάπαξ
  choice: satu kali untuk selama-lamanya
  rationale: Ungkapan ini menyatakan tindakan tunggal yang tidak diulangi dan memiliki keberlakuan tetap.
- source_word: ὃ δὲ ζῇ
  choice: tetapi kehidupan yang Ia jalani
  rationale: Rumusan ini mencerminkan konstruksi klausa pertama dan mempertahankan kesejajaran retoris antara kematian dan kehidupan.
- source_word: ζῇ τῷ θεῷ
  choice: adalah kehidupan bagi Allah
  rationale: '''Bagi Allah'' menyatakan arah dan hubungan hidup-Nya kepada Allah serta tetap seimbang secara semantis dengan ''terhadap dosa''.'
theological_decisions:
- issue: Apakah τῇ ἁμαρτίᾳ berarti 'terhadap dosa' atau 'karena/untuk dosa'.
  choice: terhadap dosa
  alternative: karena dosa; berkenaan dengan dosa
  rationale: Pilihan ini mempertahankan kontras Paulus antara hubungan dengan dosa dan hubungan dengan Allah tanpa menyiratkan bahwa Kristus mempunyai dosa pribadi atau membatasi frasa itu pada satu penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada 'Ia' dipakai untuk memperjelas bahwa subjeknya adalah Kristus. Kesejajaran kematian/kehidupan dipertahankan tanpa membuat susunan menjadi terlalu harfiah.
