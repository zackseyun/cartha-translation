review_pass:
  verdict: revise
  source_fidelity: Makna pokok dan kesejajaran Yunani antara kematian terhadap dosa dan kehidupan bagi Allah telah tertangkap. Namun, “kematian yang telah Ia jalani” bukan kolokasi Indonesia yang wajar untuk kematian dan melemahkan kejelasan. Perumusan nominal yang direvisi menyampaikan fungsi idiomatis ὃ ... ἀπέθανεν serta paralelismenya tanpa menambahkan penafsiran.
  naturalness: “Kematian yang telah Ia jalani” terdengar tidak idiomatis; orang Indonesia dapat menjalani hidup, masa, atau proses, tetapi tidak lazim menjalani kematian dalam register ini. “Kematian-Nya adalah ...; tetapi kehidupan-Nya adalah ...” baku, jelas, dan bermartabat.
  terminology: “Terhadap dosa” dan “bagi Allah” mempertahankan orientasi/relasi datif yang kontras. “Satu kali untuk selama-lamanya” menyampaikan ἐφάπαξ dengan baik. Catatan kaki dipindahkan ke frasa yang dipersoalkan dan diringkas agar alternatifnya langsung berkaitan dengan τῇ ἁμαρτίᾳ.
  issues:
  - severity: medium
    issue: Ungkapan “kematian yang telah Ia jalani” tidak alami dalam bahasa Indonesia modern.
    rationale: Verba “menjalani” tidak lazim dipadankan dengan “kematian” dalam konstruksi ini. Revisi ke bentuk “kematian-Nya” mempertahankan makna tanpa idiom yang janggal.
  - severity: low
    issue: Jangkar catatan kaki ditempatkan pada “Ia jalani”, bukan pada “terhadap dosa” yang memiliki alternatif terjemahan.
    rationale: Alternatif “karena dosa” dan “berkenaan dengan dosa” menjelaskan τῇ ἁμαρτίᾳ; jangkar perlu melekat pada frasa tersebut.
  revised_text: Sebab kematian-Nya adalah kematian terhadap dosa[a], satu kali untuk selama-lamanya; tetapi kehidupan-Nya adalah kehidupan bagi Allah.
  revised_footnotes:
