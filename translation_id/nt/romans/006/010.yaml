revisions:
- from: Sebab kematian yang telah Ia jalani[a] adalah kematian terhadap dosa, satu kali untuk selama-lamanya; tetapi kehidupan yang Ia jalani adalah kehidupan bagi Allah.
  to: Sebab kematian-Nya adalah kematian terhadap dosa[a], satu kali untuk selama-lamanya; tetapi kehidupan-Nya adalah kehidupan bagi Allah.
  rationale: Revisi mengganti idiom yang tidak wajar dengan konstruksi nominal Indonesia yang jelas dan paralel, sambil mempertahankan kontras sumber antara dosa dan Allah, ketunggalan tindakan kematian, dan ambiguitas relasional pada τῇ ἁμαρτίᾳ. Catatan kaki kini ditambatkan pada unsur Yunani yang benar-benar diperdebatkan.
