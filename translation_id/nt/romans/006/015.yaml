  text: Τί οὖν; ⸀ἁμαρτήσωμεν ὅτι οὐκ ἐσμὲν ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/015.yaml
  text: What then? Should we sin because we are not under law but under grace? May it never be![a][b]
translation:
  language: id
  text: Jadi, apakah kita akan berbuat dosa karena kita tidak berada di bawah hukum, melainkan di bawah anugerah? Sekali-kali tidak![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Patutkah kita berbuat dosa?”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Sama sekali tidak!”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Lalu bagaimana?
  rationale: Ungkapan ini menyampaikan peralihan inferensial dalam argumentasi Paulus secara ringkas dan alami tanpa menambahkan unsur yang tidak terdapat dalam bahasa Yunani.
- source_word: ἁμαρτήσωμεν
  choice: Apakah kita boleh berbuat dosa
  rationale: Bentuk subjungtif aoris orang pertama jamak bersifat deliberatif. Pilihan ini menyampaikan usulan retoris dengan jelas dalam bahasa Indonesia modern; alternatif yang lebih formal dicatat dalam catatan kaki.
- source_word: ὅτι
  choice: karena
  rationale: 'Kata ini memperkenalkan alasan yang diajukan bagi pertanyaan tersebut: berbuat dosa atas dasar bahwa orang percaya tidak berada di bawah hukum, melainkan di bawah anugerah.'
- source_word: ὑπὸ νόμον
  choice: di bawah hukum
  rationale: Terjemahan ini mempertahankan ungkapan hukum-perjanjian Paulus secara umum tanpa mempersempitnya secara eksplisit menjadi Hukum Musa.
- source_word: ὑπὸ χάριν
  choice: di bawah anugerah
  rationale: Anugerah merupakan padanan teologis yang mapan dan tepat bagi χάρις dalam konteks ini serta mempertahankan kontras Paulus dengan hukum.
- source_word: μὴ γένοιτο
  choice: Sekali-kali tidak!
  rationale: Ungkapan Indonesia ini menyampaikan penolakan yang sangat tegas dan tetap bermartabat serta wajar dalam bahasa Alkitab modern.
theological_decisions:
- issue: Cakupan νόμος dalam kontras Paulus
  choice: hukum
  alternative: Hukum Taurat; Hukum Musa
  rationale: Bahasa Yunani tidak memakai artikel. Terjemahan umum 'hukum' mempertahankan keluasan dan ketegangan teologis ungkapan Paulus tanpa menetapkan rujukan yang lebih sempit daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Struktur pertanyaan retoris serta kontras antara hukum dan anugerah dipertahankan; penolakan penutup dibuat tegas tanpa menjadi percakapan santai.
