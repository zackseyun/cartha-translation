  text: And having been freed from sin[b][a], you were enslaved to righteousness.
translation:
  language: id
  text: Dan setelah dibebaskan dari dosa, kamu dijadikan hamba kebenaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλευθερωθέντες
  choice: setelah dibebaskan
  rationale: Partisip aoris pasif menunjukkan tindakan pembebasan yang diterima para pembaca dan mendahului verba utama; bentuk ini mempertahankan aspek pasif serta hubungan waktunya secara alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan atau kontras ringan dalam rangkaian argumen Paulus; “Namun” mencerminkan hubungan tersebut tanpa menjadikannya terlalu tajam.
- source_word: ἁμαρτίας
  choice: dosa
  rationale: Bentuk tunggal dengan artikel dapat menunjuk pada dosa sebagai kuasa yang berkuasa; “dosa” mempertahankan baik makna abstrak maupun nuansa personifikasinya.
- source_word: ἐδουλώθητε
  choice: kamu diperhamba
  rationale: Aoris pasif dari δουλόω menyatakan bahwa para pembaca dijadikan berada di bawah perhambaan. “Diperhamba” mempertahankan metafora perbudakan yang tajam dan bentuk pasifnya, tanpa melunakkannya menjadi sekadar pelayanan.
- source_word: δικαιοσύνῃ
  choice: kepada kebenaran
  rationale: Datif menyatakan pihak atau kuasa yang kepadanya mereka diperhamba. “Kebenaran” adalah padanan Indonesia yang lazim bagi δικαιοσύνη dalam konteks Paulus dan dapat memuat dimensi moral maupun status benar.
theological_decisions:
- issue: Metafora perbudakan pada δουλόω
  choice: kamu diperhamba kepada kebenaran
  alternative: kamu dijadikan hamba kebenaran
  rationale: Pilihan utama mempertahankan daya metafora perpindahan kekuasaan dari dosa kepada kebenaran serta bentuk pasif teks Yunani. Alternatifnya lebih idiomatis, tetapi sedikit mengurangi penekanan pada tindakan memperhamba.
- issue: Cakupan makna δικαιοσύνη
  choice: kebenaran
  alternative: keadilan
  rationale: Dalam argumen Paulus, istilah ini dapat mencakup kehidupan yang benar dan nuansa status atau hubungan yang benar. “Kebenaran” mempertahankan keluasan itu; “keadilan” dicatat sebagai kemungkinan leksikal tanpa memaksakannya ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Pronomina “kamu” dipakai sebagai bentuk jamak kontekstual bagi para penerima surat. Ungkapan “diperhamba” sengaja mempertahankan metafora perbudakan yang menjadi pusat argumen Roma 6.
