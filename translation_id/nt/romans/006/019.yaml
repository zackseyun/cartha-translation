revisions:
- from: Aku berbicara dengan cara manusia karena kelemahan dagingmu.[a] Sebab, sama seperti dahulu kamu menyerahkan anggota-anggota tubuhmu sebagai budak kepada kenajisan dan kepada kedurhakaan yang membawa kepada kedurhakaan, demikian pula sekarang serahkanlah anggota-anggota tubuhmu sebagai budak kepada kebenaran[b] yang membawa kepada pengudusan.
  to: Aku berbicara secara manusiawi karena kelemahan dagingmu.[a] Sebab, sama seperti kamu dahulu menyerahkan anggota-anggota tubuhmu sebagai budak kepada kenajisan dan kedurhakaan, sehingga kamu semakin durhaka, demikian juga sekarang serahkanlah anggota-anggota tubuhmu sebagai budak kepada kebenaran[b] yang mengarah kepada pengudusan.
  rationale: Revisi terbatas pada kejelasan sintaksis dan kealamian ungkapan. "Sehingga kamu semakin durhaka" menyampaikan pengulangan ἀνομία serta gerak hasil yang ditandai εἰς, sedangkan "yang mengarah kepada pengudusan" mempertahankan hubungan hasil menuju ἁγιασμός. Tidak ada perubahan pada makna teologis atau pada ambiguitas σάρξ dan δικαιοσύνη.
