id: ROM.6.19
reference: Romans 6:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν· ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/019.yaml
  text: I am speaking in human terms because of the weakness of your flesh[a]. For just as you presented your members as servants to impurity and to lawlessness, leading to lawlessness, so now present your members as servants to righteousness[b], leading to sanctification.
translation:
  language: id
  text: Aku berbicara secara manusiawi karena kelemahan dagingmu.[a] Sebab, sama seperti kamu dahulu menyerahkan anggota-anggota tubuhmu sebagai budak kepada kenajisan dan kedurhakaan, sehingga kamu semakin durhaka, demikian juga sekarang serahkanlah anggota-anggota tubuhmu sebagai budak kepada kebenaran[b] yang mengarah kepada pengudusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tabiat berdosamu.” Namun, kata Yunani yang diterjemahkan “daging” memiliki arti yang lebih luas.
    reason: lexical_alternative
  - marker: b
    text: Atau, “keadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπινον λέγω
  choice: Aku berbicara dengan cara manusia
  rationale: Ungkapan ini menunjukkan bahwa Paulus memakai cara penyampaian yang disesuaikan dengan pemahaman manusia biasa, tanpa mempersempitnya menjadi sekadar 'analogi'.
- source_word: ἀσθένειαν τῆς σαρκὸς ὑμῶν
  choice: kelemahan dagingmu
  rationale: '''Kelemahan'' mempertahankan keluasan ἀσθένεια, sedangkan ''daging'' menjaga cakupan σάρξ dan tidak langsung menafsirkannya sebagai ''tabiat berdosa''.'
- source_word: παρεστήσατε / παραστήσατε
  choice: dahulu kamu menyerahkan / serahkanlah
  rationale: '''Menyerahkan'' alami dalam bahasa Indonesia untuk tindakan menempatkan diri atau anggota tubuh di bawah kuasa tertentu; pengulangan akar kata dipertahankan pada kedua klausa.'
- source_word: τὰ μέλη ὑμῶν
  choice: anggota-anggota tubuhmu
  rationale: Dalam bahasa Indonesia, penambahan 'tubuh' memperjelas bahwa μέλη menunjuk pada anggota atau bagian tubuh beserta kemampuannya.
- source_word: δοῦλα
  choice: budak
  rationale: Metafora perbudakan merupakan unsur utama argumen Roma 6; 'budak' mempertahankan daya ikat dan penguasaan yang lebih kuat daripada 'pelayan'.
- source_word: ἀκαθαρσίᾳ
  choice: kenajisan
  rationale: '''Kenajisan'' menyampaikan ketidakmurnian moral dengan jelas dan sesuai dengan ragam bahasa Alkitab Indonesia yang tetap dipahami pembaca modern.'
- source_word: ἀνομίᾳ / ἀνομίαν
  choice: kedurhakaan / kedurhakaan
  rationale: '''Kedurhakaan'' mengungkap sikap dan tindakan yang menentang hukum atau kehendak Allah; pengulangan kata Yunani dipertahankan demi kekuatan retoris.'
- source_word: εἰς τὴν ἀνομίαν
  choice: yang membawa kepada kedurhakaan
  rationale: εἰς menyatakan arah atau hasil; frasa ini memperlihatkan perkembangan menuju kedurhakaan lebih lanjut secara alami dalam bahasa Indonesia.
- source_word: δικαιοσύνῃ
  choice: kebenaran
  rationale: '''Kebenaran'' adalah padanan Indonesia yang mapan bagi δικαιοσύνη dalam konteks Paulus dan di sini cocok dengan kontras etis terhadap kenajisan dan kedurhakaan.'
- source_word: εἰς ἁγιασμόν
  choice: yang membawa kepada pengudusan
  rationale: '''Pengudusan'' mempertahankan nuansa proses atau hasil dari ἁγιασμός, sedangkan bentuk ''membawa kepada'' menyampaikan arah/hasil εἰς.'
theological_decisions:
- issue: Makna σάρξ dalam frasa 'kelemahan dagingmu'
  choice: daging
  alternative: tabiat berdosa
  rationale: Bahasa Yunani dapat mencakup kelemahan manusia dalam keberadaannya yang jasmani dan telah jatuh, tetapi tidak mengharuskan penafsiran yang lebih sempit sebagai 'tabiat berdosa'. Catatan kaki menjaga kemungkinan interpretatif itu.
- issue: Makna δικαιοσύνη dalam konteks Paulus
  choice: kebenaran
  alternative: keadilan
  rationale: Konteks etis dan paralel dengan pengudusan mendukung 'kebenaran', sementara kemungkinan nuansa 'keadilan' tetap dicatat tanpa menghapus ketegangan leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal 'kamu/-mu' mengikuti orang kedua jamak Yunani sebagai sapaan kolektif yang lazim dalam terjemahan Alkitab Indonesia. Penanda catatan kaki ditempatkan tepat setelah istilah yang dijelaskan; urutannya diselaraskan dengan isi catatan, bukan mengikuti ketidaksesuaian penanda pada lapisan konsultasi Inggris.
