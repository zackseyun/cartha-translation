id: ROM.6.14
reference: Romans 6:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἁμαρτία γὰρ ὑμῶν οὐ κυριεύσει, οὐ γάρ ἐστε ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/014.yaml
  text: For sin will not rule over you[b][a], because you are not under the law but under grace.
translation:
  language: id
  text: Sebab dosa tidak akan berkuasa atas kamu,[a] karena kamu tidak berada di bawah hukum, melainkan di bawah anugerah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi tuan atas kamu.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “di bawah hukum” berarti berada di bawah kuasa atau tatanan hukum; demikian pula, “di bawah anugerah” berarti berada di bawah kuasa atau tatanan anugerah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτία
  choice: dosa
  rationale: Padanan baku dalam bahasa Indonesia dan konteks Paulus. Huruf kecil dipertahankan karena bahasa Yunani tidak menuntut personifikasi itu ditandai secara tipografis.
- source_word: κυριεύσει
  choice: akan berkuasa atas
  rationale: Mengungkapkan tindakan menjalankan kuasa atau kekuasaan atas pihak lain dan tetap mempertahankan gambaran dosa sebagai penguasa.
- source_word: ὑπὸ νόμον
  choice: di bawah hukum
  rationale: Mempertahankan ungkapan Paulus tentang berada di bawah kuasa atau tatanan hukum tanpa mempersempit rujukannya secara eksplisit di dalam teks.
- source_word: χάριν
  choice: anugerah
  rationale: Istilah Indonesia yang lazim dan bermartabat untuk χάρις dalam pertentangan Paulus antara hukum dan anugerah.
- source_word: γὰρ ... γάρ
  choice: sebab ... karena
  rationale: “Sebab” menghubungkan ayat ini dengan penjelasan sebelumnya, sedangkan “karena” menyatakan dasar bagi klausa pertama secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Personifikasi dosa sebagai kuasa yang memerintah
  choice: “dosa tidak akan berkuasa atas kamu” dengan huruf kecil
  alternative: “Dosa tidak akan menjadi tuan atas kamu”
  rationale: Pilihan ini mempertahankan citra pemerintahan yang terdapat dalam verba Yunani tanpa menambahkan kapitalisasi atau metafora yang lebih kuat daripada teks sumber.
- issue: Makna ungkapan ὑπὸ νόμον
  choice: Mempertahankan “di bawah hukum” dalam teks dan menjelaskan nuansa kuasa atau tatanan dalam catatan
  alternative: “di bawah kekuasaan hukum”
  rationale: Bentuk yang lebih harfiah menjaga kepadatan dan ketegangan teologis ungkapan Paulus, sementara catatan membantu pembaca memahami idiomnya tanpa memasukkan tafsiran yang terlalu khusus.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan sebab-akibat Yunani dipertahankan dengan “Sebab ... karena,” sedangkan idiom “di bawah” dibiarkan dalam teks agar kontras hukum dan anugerah tetap kuat.
