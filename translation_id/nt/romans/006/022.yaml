id: ROM.6.22
reference: Romans 6:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: νυνὶ δέ, ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας δουλωθέντες δὲ τῷ θεῷ, ἔχετε τὸν καρπὸν ὑμῶν εἰς ἁγιασμόν, τὸ δὲ τέλος ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/022.yaml
  text: But now[a], having been freed from sin and enslaved to God, you have your fruit unto sanctification, and the end[c][b], eternal life.
translation:
  language: id
  text: Namun sekarang, setelah dibebaskan dari dosa dan dijadikan hamba Allah[a], kamu memperoleh buah yang membawa kepada pengudusan[b], dan kesudahannya ialah hidup kekal[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “diperbudak kepada Allah.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “yang menghasilkan kekudusan.”
    reason: lexical_alternative
  - marker: c
    text: Atau “dan hasil akhirnya ialah hidup kekal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δέ
  choice: Namun sekarang
  rationale: Mempertahankan kontras kuat dengan keadaan sebelumnya dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας
  choice: setelah dibebaskan dari dosa
  rationale: Mencerminkan tindakan pasif yang telah terjadi; bentuk tunggal 'dosa' tetap menunjukkan dosa sebagai kuasa atau ranah.
- source_word: δουλωθέντες δὲ τῷ θεῷ
  choice: dan dijadikan hamba Allah
  rationale: Mempertahankan metafora perhambaan yang sengaja dipakai Paulus, sekaligus menyatakan bahwa para pembaca menerima tindakan tersebut.
- source_word: ἔχετε τὸν καρπὸν ὑμῶν
  choice: kamu memperoleh buah
  rationale: Mempertahankan metafora καρπός, sementara 'memperoleh' mengungkapkan secara alami bahwa buah itu kini menjadi milik atau hasil mereka.
- source_word: εἰς ἁγιασμόν
  choice: yang membawa kepada pengudusan
  rationale: Mengungkapkan arah atau hasil yang dinyatakan oleh εἰς tanpa menentukan secara berlebihan apakah ἁγιασμός terutama proses atau keadaan.
- source_word: τὸ δὲ τέλος
  choice: dan kesudahannya ialah
  rationale: '''Kesudahan'' mempertahankan gagasan τέλος sebagai akhir atau hasil akhir, sedangkan ''ialah'' memperjelas hubungan dengan ''hidup kekal'' secara alami.'
- source_word: ζωὴν αἰώνιον
  choice: hidup kekal
  rationale: Padanan baku, jelas, dan tepat yang mempertahankan bobot teologis frasa Yunani.
theological_decisions:
- issue: Metafora perhambaan dalam hubungan dengan Allah
  choice: dijadikan hamba Allah
  alternative: diperbudak kepada Allah
  rationale: Pilihan utama mempertahankan ikatan kepemilikan dalam metafora δουλόω dan bentuk pasifnya, tetapi menghindari ungkapan Indonesia yang terasa janggal; alternatif yang lebih keras dicatat.
- issue: Makna ἁγιασμός
  choice: pengudusan
  alternative: kekudusan
  rationale: '''Pengudusan'' mempertahankan kemungkinan nuansa proses atau hasil, sedangkan ''kekudusan'' tetap merupakan alternatif leksikal yang sah.'
- issue: Makna τέλος
  choice: kesudahan
  alternative: hasil akhirnya
  rationale: '''Kesudahan'' dekat dengan bentuk sumber dan dapat menunjuk pada akhir atau tujuan akhir; alternatif menjelaskan nuansa hasil tanpa menghapus ambiguitas dari teks utama.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Metafora buah dan perhambaan dipertahankan; struktur partisipial Yunani dibuat alami tanpa menghilangkan hubungan logis antarklausa.
