  text: εἰδότες ὅτι Χριστὸς ἐγερθεὶς ἐκ νεκρῶν οὐκέτι ἀποθνῄσκει, θάνατος αὐτοῦ οὐκέτι κυριεύει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/009.yaml
  text: knowing that the Messiah[a], having been raised from the dead, no longer dies; death no longer rules over him.
translation:
  language: id
  text: Sebab kita tahu bahwa Mesias[a], yang telah dibangkitkan dari antara orang mati, tidak mati lagi; maut tidak lagi berkuasa atas-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: karena kita tahu
  rationale: Partisip ini menyatakan pengetahuan bersama yang menjadi dasar pernyataan; dalam bahasa Indonesia, bentuk klausal ini lebih alami sekaligus mempertahankan hubungan logisnya dengan konteks.
- source_word: Χριστὸς
  choice: Mesias
  rationale: Di sini Χριστός tetap bermakna sebagai gelar; “Mesias” menyampaikan arti gelar tersebut, sedangkan “Kristus” dicatat sebagai alternatif tradisional.
- source_word: ἐγερθεὶς
  choice: yang telah dibangkitkan
  rationale: Bentuk pasif aoristus menunjukkan tindakan Allah yang telah terjadi sebelum kenyataan bahwa Ia tidak mati lagi; terjemahan ini mempertahankan aspek lampau dan suara pasif.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Ungkapan ini menyatakan kebangkitan dari lingkungan atau golongan orang-orang mati dan merupakan padanan Indonesia yang jelas.
- source_word: οὐκέτι ἀποθνῄσκει
  choice: tidak akan mati lagi
  rationale: Walaupun verba Yunani berbentuk kini, konteksnya menyatakan kenyataan tetap dan kepastian masa depan bahwa kematian tidak akan terulang; bentuk ini alami dalam bahasa Indonesia.
- source_word: θάνατος
  choice: Maut
  rationale: “Maut” mempertahankan personifikasi dan bobot retoris θάνατος sebagai kuasa yang memerintah, bukan sekadar peristiwa biologis.
- source_word: οὐκέτι κυριεύει
  choice: tidak lagi berkuasa atas
  rationale: κυριεύει menyatakan kekuasaan atau penguasaan; frasa ini modern, jelas, dan mempertahankan gambaran kuasa maut.
theological_decisions:
- issue: Penerjemahan Χριστός dalam wacana Paulus
  choice: Mesias
  alternative: Kristus
  rationale: Istilah ini diperlakukan sebagai gelar bermakna, bukan semata-mata unsur nama diri. Catatan kaki mempertahankan padanan tradisional tanpa menentukan lebih jauh hubungan antara gelar dan nama.
- issue: Pelaku tersirat dalam kebangkitan
  choice: mempertahankan bentuk pasif “telah dibangkitkan”
  alternative: “telah bangkit”
  rationale: Bentuk Yunani adalah pasif dan tidak menyebut pelaku secara eksplisit; terjemahan tidak menambahkan “oleh Allah,” meskipun hal itu selaras dengan konteks Paulus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Karena kita tahu” mengalir alami dalam argumen Paulus; “Maut” mempertahankan personifikasi, dan pronomina hormat “-Nya” merujuk kepada Mesias.
