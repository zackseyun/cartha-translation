  source_fidelity: Revisi diperlukan untuk lebih jelas mempertahankan frasa ἐν καινότητι ζωῆς (“dalam kebaruan hidup”), yang dalam draf diratakan menjadi “kehidupan yang baru.” Selain itu, διά τῆς δόξης τοῦ πατρός lebih dekat diterjemahkan “melalui kemuliaan Bapa” daripada “oleh kemuliaan Bapa,” sehingga fungsi instrumentalnya tetap jelas.
  naturalness: Kalimat revisi tetap baku, modern, dan mudah dibaca. “Hidup dalam kebaruan hidup” adalah ungkapan yang agak khidmat, tetapi wajar dalam register Alkitab dan mempertahankan abstraksi retoris Yunani.
  terminology: “Mesias” tepat untuk Χριστός sesuai jejak keputusan proyek. Catatan alternatif “Kristus” perlu dipertahankan dan ditambatkan pada “Mesias.” “Baptisan,” “kematian,” “kemuliaan Bapa,” dan “orang mati” sudah tepat.
  issues:
