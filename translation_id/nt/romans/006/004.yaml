id: ROM.6.4
reference: Romans 6:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/004.yaml
  text: Therefore we were buried with him through baptism into death[a], so that just as Messiah was raised from the dead through the glory of the Father, so also we might walk in newness of life.
translation:
  language: id
  text: Karena itu, melalui baptisan kita dikuburkan bersama Dia ke dalam kematian, supaya sama seperti Mesias[a] dibangkitkan dari antara orang mati melalui kemuliaan Bapa, demikian juga kita dapat hidup dalam kebaruan hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Kristus.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνετάφημεν
  choice: kita dikuburkan bersama Dia
  rationale: Bentuk pasif aoristus menyatakan tindakan yang telah terjadi, sedangkan unsur συν- disampaikan secara alami melalui frasa “bersama Dia”.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya dan mempertahankan alur argumentasi Paulus.
- source_word: διὰ τοῦ βαπτίσματος
  choice: melalui baptisan
  rationale: διά dengan genitif menyatakan sarana; “melalui” mempertahankan nuansa itu tanpa menetapkan doktrin sakramental tertentu.
- source_word: εἰς τὸν θάνατον
  choice: ke dalam kematian
  rationale: Mempertahankan arah yang dinyatakan εἰς dan kaitannya dengan masuk ke dalam kematian, bukan sekadar berada di dekatnya.
- source_word: ἵνα
  choice: supaya
  rationale: Menyampaikan maksud atau tujuan klausa secara wajar dalam bahasa Indonesia modern.
- source_word: Χριστὸς
  choice: Mesias
  rationale: Menerjemahkan gelar Χριστός menurut makna dasarnya dan mempertahankan daya titularnya dalam konteks ini.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Mengungkapkan bahwa Mesias bangkit keluar dari kalangan orang-orang mati dan mencerminkan bentuk jamak substantival Yunani.
- source_word: διὰ τῆς δόξης τοῦ πατρός
  choice: oleh kemuliaan Bapa
  rationale: “Oleh” menyampaikan fungsi instrumental διά secara alami, sedangkan “kemuliaan” mempertahankan cakupan δόξα tanpa mempersempitnya menjadi “kuasa” saja.
- source_word: περιπατήσωμεν
  choice: kita dapat menjalani
  rationale: Dalam konteks etis, metafora “berjalan” berarti menjalani kehidupan; “dapat menjalani” menyampaikan bentuk subjungtif dalam klausa tujuan tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: ἐν καινότητι ζωῆς
  choice: kehidupan yang baru
  rationale: Menyampaikan gagasan kebaruan hidup dalam bahasa Indonesia yang alami; bentuk abstrak harfiah “dalam kebaruan kehidupan” akan terdengar tidak lazim.
theological_decisions:
- issue: Apakah διὰ τοῦ βαπτίσματος harus diterjemahkan dengan cara yang menyiratkan doktrin sakramental tertentu
  choice: melalui baptisan
  alternative: oleh baptisan
  rationale: Pilihan ini mempertahankan fungsi baptisan sebagai sarana dalam tata bahasa ayat tanpa menentukan secara sepihak bagaimana baptisan berkaitan dengan persatuan dengan Mesias.
- issue: Apakah περιπατήσωμεν harus mempertahankan metafora berjalan secara harfiah
  choice: kita dapat menjalani kehidupan yang baru
  alternative: kita dapat berjalan dalam kebaruan hidup
  rationale: Ungkapan pilihan menyampaikan maksud etis metafora tersebut secara alami, tanpa mengubah hidup baru menjadi sekadar status dan tanpa menambahkan isi teologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan hubungan logis dan kesejajaran antara kebangkitan Mesias dan kehidupan baru umat, sambil menghindari ungkapan harfiah yang terasa janggal.
