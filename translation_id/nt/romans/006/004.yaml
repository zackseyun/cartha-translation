    issue: ἐν καινότητι ζωῆς direnderkan sebagai “kehidupan yang baru.”
    rationale: Ungkapan itu menggeser frasa abstrak “dalam kebaruan hidup” menjadi objek “suatu kehidupan baru,” sehingga nuansa dan struktur preposisional teks sumber kurang terjaga.
  - severity: low
    issue: διὰ τῆς δόξης τοῦ πατρός diterjemahkan “oleh kemuliaan Bapa.”
    rationale: “Oleh” dapat dipahami sebagai penanda pelaku, sedangkan διά + genitif menyatakan sarana. “Melalui kemuliaan Bapa” lebih langsung mempertahankan relasi tersebut.
  - severity: low
