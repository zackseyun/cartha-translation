  to: Karena itu, melalui baptisan kita dikuburkan bersama Dia ke dalam kematian, supaya sama seperti Mesias[a] dibangkitkan dari antara orang mati melalui kemuliaan Bapa, demikian juga kita dapat hidup dalam kebaruan hidup.
  rationale: Revisi mempertahankan hubungan sarana dalam kedua penggunaan διά, menampilkan kembali “kebaruan hidup” sebagai padanan yang lebih setia bagi καινότης ζωῆς, dan menambahkan catatan alternatif istilah bagi Χριστός. Tidak ada penafsiran sakramental atau denominasi yang ditambahkan.
