id: ROM.6.16
reference: Romans 6:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/016.yaml
  text: Do you not know that if you present yourselves as servants for obedience[a], you are servants of the one whom you obey—either of sin leading to death, or of obedience leading to righteousness?
translation:
  language: id
  text: Tidakkah kamu tahu bahwa kepada siapa kamu menyerahkan diri sebagai budak untuk taat, kamu adalah budak dari yang kamu taati—entah budak dosa yang membawa kepada kematian, atau budak ketaatan yang membawa kepada kebenaran[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, keadilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε ἑαυτούς
  choice: menyerahkan dirimu
  rationale: Ungkapan ini menyampaikan tindakan menempatkan diri di bawah kuasa atau untuk dipakai oleh pihak lain, dengan bahasa Indonesia yang alami.
- source_word: δούλους / δοῦλοί
  choice: budak
  rationale: Kata ini mempertahankan gambaran tentang keterikatan dan penguasaan yang kuat, yang menjadi inti perbandingan Paulus.
- source_word: εἰς ὑπακοήν
  choice: untuk taat
  rationale: Bentuk ini menyampaikan tujuan atau hasil yang dinyatakan oleh εἰς dan lebih alami dalam bahasa Indonesia daripada mempertahankan nomina secara kaku.
- source_word: ᾧ ... ᾧ ὑπακούετε
  choice: kepada suatu pihak ... pihak yang kamu taati
  rationale: ‘Pihak’ dapat mencakup dosa atau ketaatan yang dipersonifikasikan sebagai penguasa, tanpa menambahkan kata ‘tuan’ yang tidak terdapat dalam teks Yunani.
- source_word: ἁμαρτίας εἰς θάνατον
  choice: dosa yang membawa kepada kematian
  rationale: Terjemahan ini mempertahankan ‘dosa’ secara langsung dan menyatakan daya arah atau hasil dari εἰς dengan jelas.
- source_word: ὑπακοῆς εἰς δικαιοσύνην
  choice: ketaatan yang membawa kepada kebenaran
  rationale: Nomina ‘ketaatan’ dipertahankan sebagai pasangan kontras dengan ‘dosa’, sedangkan ‘membawa kepada’ menyampaikan arah atau hasil.
- source_word: δικαιοσύνην
  choice: kebenaran
  rationale: Dalam konteks Paulus, istilah ini menunjuk pada keadaan atau perilaku yang benar di hadapan Allah, lebih luas daripada keadilan sosial saja; alternatif ‘keadilan’ dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna δικαιοσύνη dalam kontras Paulus antara dosa dan ketaatan
  choice: kebenaran
  alternative: keadilan
  rationale: ‘Kebenaran’ mempertahankan cakupan moral-teologis istilah tersebut dalam konteks ini, sedangkan ‘keadilan’ tetap merupakan kemungkinan leksikal yang sah dan karena itu dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pertanyaan retoris serta personifikasi dosa dan ketaatan dipertahankan. Penanda catatan kaki ditempatkan langsung sesudah kata yang dijelaskannya.
