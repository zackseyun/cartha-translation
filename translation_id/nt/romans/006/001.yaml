  text: Τί οὖν ἐροῦμεν; ⸀ἐπιμένωμεν τῇ ἁμαρτίᾳ, ἵνα ἡ χάρις πλεονάσῃ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/001.yaml
  text: What then shall we say? Should we continue in sin so that grace may increase?[a][b]
translation:
  language: id
  text: Jadi, apa yang akan kita katakan? Haruskah kita terus hidup dalam dosa supaya anugerah semakin berlimpah?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Haruskah kita terus bertahan dalam dosa supaya anugerah semakin bertambah?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Jadi, apa yang akan kita katakan?
  rationale: Mempertahankan peralihan inferensial dan bentuk pertanyaan retoris Paulus dalam bahasa Indonesia yang alami.
- source_word: ἐπιμένωμεν τῇ ἁμαρτίᾳ
  choice: Haruskah kita terus hidup dalam dosa
  rationale: Kata kerja present-subjungtif menyatakan pertanyaan deliberatif tentang tindakan yang berkelanjutan. Frasa 'terus hidup dalam dosa' mengungkapkan bertahan dalam ranah atau praktik dosa secara jelas dan wajar.
- source_word: ἵνα
  choice: supaya
  rationale: Menjaga hubungan tujuan atau hasil yang diajukan dalam pertanyaan retoris.
- source_word: ἡ χάρις
  choice: anugerah
  rationale: '''Anugerah'' merupakan padanan teologis yang lazim dan dapat dipahami untuk χάρις, yakni kemurahan Allah dalam alur argumentasi Paulus.'
- source_word: πλεονάσῃ
  choice: semakin berlimpah
  rationale: Menyampaikan gagasan bertambah dalam kadar atau keluasan, sekaligus mempertahankan nuansa kelimpahan verba Yunani.
theological_decisions:
- issue: Apakah pertanyaan Paulus menyatakan izin, kewajiban, atau ramalan
  choice: 'Pertanyaan deliberatif moral: ''Haruskah kita terus hidup dalam dosa'''
  alternative: '''Akankah kita tetap berada dalam dosa'''
  rationale: Subjungtif Yunani mengajukan suatu tindakan sebagai bahan pertimbangan retoris. 'Haruskah' menyampaikan daya moralnya tanpa menambahkan kesimpulan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. 'Jadi' menandai kesimpulan dari uraian sebelumnya; 'terus hidup dalam dosa' dipilih agar idiomatis bagi pembaca umum.
