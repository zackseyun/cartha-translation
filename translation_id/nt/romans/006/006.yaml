id: ROM.6.6
reference: Romans 6:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦτο γινώσκοντες ὅτι ὁ παλαιὸς ἡμῶν ἄνθρωπος συνεσταυρώθη, ἵνα καταργηθῇ τὸ σῶμα τῆς ἁμαρτίας, τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/006.yaml
  text: knowing this[a], that our old self was crucified with him, so that the body of sin might be rendered powerless, so that we should no longer be enslaved to sin[c][b],
translation:
  language: id
  text: Kita tahu bahwa manusia lama kita telah disalibkan bersama Dia, supaya tubuh dosa dibuat tidak berdaya,[a] sehingga kita tidak lagi diperbudak oleh dosa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ditiadakan” atau “dilumpuhkan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tidak lagi mengabdi kepada dosa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γινώσκοντες
  choice: Kita tahu bahwa
  rationale: Partisip ini menghubungkan ayat dengan konteks sebelumnya. Bentuk klausa ini alami dalam bahasa Indonesia dan tidak memaksakan nuansa kausal yang tidak dinyatakan secara eksplisit.
- source_word: ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: manusia lama kita
  rationale: Ungkapan ini mempertahankan citra antropologis Paulus, berlaku bagi semua orang, dan lebih alami daripada terjemahan harfiah yang dapat disalahpahami sebagai hanya merujuk kepada laki-laki.
- source_word: συνεσταυρώθη
  choice: telah disalibkan bersama Dia
  rationale: Kata 'bersama' menyampaikan awalan συν- dan gagasan turut disalibkan dengan Kristus; 'Dia' merujuk kepada Kristus dari konteks.
- source_word: καταργηθῇ
  choice: dibuat tidak berdaya
  rationale: Pilihan ini menyampaikan penonaktifan daya atau kuasa tanpa menyatakan bahwa tubuh itu dimusnahkan; alternatif yang lebih kuat dicatat dalam catatan kaki.
- source_word: τὸ σῶμα τῆς ἁμαρτίας
  choice: tubuh dosa
  rationale: Konstruksi genitif dipertahankan agar hubungan antara tubuh dan dosa tidak ditafsirkan secara terlalu sempit sebagai 'tubuh yang berdosa' atau 'tubuh yang dikuasai dosa'.
- source_word: τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ
  choice: sehingga kita tidak lagi diperbudak oleh dosa
  rationale: δουλεύω memakai citra perbudakan atau pengabdian kepada seorang tuan. Bentuk pasif ini secara alami menyatakan bahwa dosa tidak lagi memperbudak kita.
theological_decisions:
- issue: Makna antropologis ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: manusia lama kita
  alternative: diri kita yang lama
  rationale: Pilihan utama mempertahankan metafora 'manusia' dalam ungkapan Paulus tanpa membatasi acuannya pada laki-laki; alternatif 'diri lama' lebih idiomatis tetapi lebih interpretatif.
- issue: Daya καταργηθῇ terhadap tubuh dosa
  choice: dibuat tidak berdaya
  alternative: ditiadakan atau dilumpuhkan
  rationale: Terjemahan utama menekankan hilangnya daya kerja atau kuasa tanpa menetapkan bahwa tubuh dosa dimusnahkan secara ontologis.
- issue: Hubungan τὸ σῶμα dengan τῆς ἁμαρτίας
  choice: tubuh dosa
  alternative: tubuh yang dikuasai dosa
  rationale: Bentuk padat sumber dipertahankan untuk tidak menutup kemungkinan hubungan genitif yang berbeda.
- issue: Citra δουλεύειν
  choice: diperbudak oleh dosa
  alternative: mengabdi kepada dosa
  rationale: Konteks kekuasaan dosa mendukung nuansa perbudakan, sementara alternatif menggarisbawahi segi pelayanan kepada seorang tuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Manusia lama kita' mempertahankan citra sumber secara wajar; pengulangan tujuan Yunani dibedakan dengan 'supaya' dan 'sehingga' agar alurnya alami. Semua penanda catatan kaki ditempatkan langsung sesudah frasa terkait.
