  text: Εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/005.yaml
  text: For if we have become united with him in the likeness of his death[b][a], we will certainly also be united with him in the likeness of his resurrection.
translation:
  language: id
  text: Sebab, jika kita telah dipersatukan dengan Dia dalam keserupaan kematian-Nya[a], tentu kita juga akan dipersatukan dengan Dia dalam keserupaan kebangkitan-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah bertumbuh bersama dengan Dia.”
    reason: lexical_alternative
  - marker: b
    text: 'Yunani secara harfiah: “tetapi juga dari kebangkitan kita akan ada/menjadi”; predikat “dipersatukan dengan Dia dalam keserupaan” dipahami dari klausa pertama.'
    reason: alternative_reading
lexical_decisions:
- source_word: σύμφυτοι
  choice: menjadi satu dengan Dia
  rationale: Kata ini menyatakan persatuan atau pertumbuhan bersama secara organik. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan hubungan dengan Kristus tanpa menentukan secara sempit bagaimana persatuan itu berlangsung.
- source_word: γεγόναμεν
  choice: telah menjadi
  rationale: Bentuk perfektum menunjuk pada sesuatu yang telah terjadi dengan hasil yang tetap berlaku; 'telah menjadi' mempertahankan nuansa tersebut.
- source_word: τῷ ὁμοιώματι
  choice: dalam keserupaan dengan
  rationale: Datif di sini dapat menyatakan hubungan atau ranah. Pilihan ini mempertahankan istilah 'keserupaan' dan tidak menyamakan partisipasi itu secara langsung dengan kematian Kristus sendiri.
- source_word: τοῦ θανάτου αὐτοῦ
  choice: kematian-Nya
  rationale: Konstruksi genitif ini secara langsung merujuk kepada kematian Kristus.
- source_word: ἀλλὰ καὶ
  choice: pasti juga
  rationale: Dalam susunan ini, frasa tersebut menegaskan kelanjutan dari bagian pertama menuju bagian kedua. 'Pasti juga' menyampaikan daya penegasnya secara wajar.
- source_word: τῆς ἀναστάσεως
  choice: dalam keserupaan dengan kebangkitan-Nya
  rationale: Teks Yunani secara harfiah hanya mengatakan 'dari kebangkitan', tetapi kesejajaran dengan klausa pertama memungkinkan unsur 'dalam keserupaan dengan' dan rujukan kepada Kristus dipahami serta diulang demi kejelasan.
- source_word: ἐσόμεθα
  choice: kita akan menjadi satu dengan Dia
  rationale: Kata kerja ini secara harfiah berarti 'kita akan ada/menjadi'; predikat dari klausa pertama perlu dipahami kembali. Pengulangan ini membuat elipsis Yunani jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah bahasa persatuan Paulus harus dijelaskan sebagai persatuan sakramental, mistis, atau metaforis
  choice: Mempertahankan ungkapan 'menjadi satu dengan Dia dalam keserupaan dengan' tanpa penjelasan doktrinal tambahan
  alternative: Menerjemahkan sebagai 'bertumbuh bersama dengan Dia', 'dipersatukan dengan pola kematian-Nya', atau menjelaskan mekanisme partisipasi tersebut
  rationale: Ayat ini menyatakan partisipasi nyata dengan Kristus sekaligus memakai istilah 'keserupaan'. Terjemahan mempertahankan ketegangan itu dan tidak menentukan mekanismenya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Struktur paralel dipertahankan, sementara elipsis Yunani dilengkapi secara transparan dan dijelaskan dalam catatan kaki.
