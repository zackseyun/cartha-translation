id: ROM.6.2
reference: Romans 6:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μὴ γένοιτο· οἵτινες ἀπεθάνομεν τῇ ἁμαρτίᾳ, πῶς ἔτι ζήσομεν ἐν αὐτῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/002.yaml
  text: Absolutely not! We who died to sin—how can we still live in it?[a]
translation:
  language: id
  text: Sama sekali tidak! Kita yang telah mati terhadap dosa, bagaimana mungkin kita masih hidup di dalamnya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jangan sampai terjadi!”; ungkapan penolakan yang sangat tegas.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Sama sekali tidak!
  rationale: Ungkapan ini merupakan penolakan yang sangat tegas. Pilihan ini kuat, alami, dan tidak bercorak arkais dalam bahasa Indonesia modern.
- source_word: οἵτινες
  choice: Kita yang
  rationale: Kata ganti relatif ini mengidentifikasi orang-orang percaya yang sedang dibicarakan sambil mempertahankan sudut pandang orang pertama jamak yang inklusif.
- source_word: ἀπεθάνομεν
  choice: telah mati
  rationale: Bentuk aoristus menunjuk pada kematian sebagai peristiwa yang tegas; 'telah mati' terdengar alami dalam konteks pertanyaan retoris dan menandai keadaan yang dihasilkan tanpa menjelaskannya secara berlebihan.
- source_word: τῇ ἁμαρτίᾳ
  choice: terhadap dosa
  rationale: Datif bersama kata kerja 'mati' menyatakan hubungan atau acuan. 'Mati terhadap dosa' mempertahankan metafora Yunani dan lebih wajar daripada terjemahan harfiah yang kabur.
- source_word: πῶς ἔτι
  choice: bagaimana mungkin ... masih
  rationale: Susunan ini menyampaikan ketidakmasukakalan retoris sekaligus gagasan tentang berlanjutnya keadaan atau perilaku tersebut.
- source_word: ζήσομεν
  choice: kita ... hidup
  rationale: Bentuk futurum dipakai dalam pertanyaan retoris. Dalam bahasa Indonesia, 'bagaimana mungkin kita ... hidup' menyampaikan daya retorisnya secara alami tanpa harus memakai penanda masa depan.
- source_word: ἐν αὐτῇ
  choice: di dalamnya
  rationale: Kata ganti ini kembali kepada dosa dan mempertahankan gambaran dosa sebagai ranah tempat seseorang hidup, tanpa mengulang kata 'dosa'.
theological_decisions:
- issue: Apakah pernyataan Paulus menggambarkan perbaikan moral atau putusnya hubungan secara tegas dengan kuasa dosa
  choice: Metafora 'mati terhadap dosa' dipertahankan tanpa diuraikan lebih lanjut.
  alternative: menjadi tidak peka terhadap dosa; meninggalkan dosa
  rationale: Teks Yunani menyatakan metafora itu secara langsung. Mempertahankannya menjaga ketegangan teologis mengenai hubungan orang percaya dengan dosa dan tidak memasukkan penjelasan doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. 'Kita' mempertahankan penyertaan Paulus bersama para pembacanya; 'di dalamnya' menjaga metafora dosa sebagai suatu ranah.
