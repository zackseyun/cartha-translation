  naturalness: “Sebab orang yang telah mati telah dibebaskan dari dosa” adalah bahasa Indonesia baku yang ringkas dan alami. Catatan kaki dapat menampilkan alternatif yudisial tanpa membuat teks utama menjadi kaku.
