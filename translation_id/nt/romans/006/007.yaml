  text: ὁ γὰρ ἀποθανὼν δεδικαίωται ἀπὸ τῆς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/007.yaml
  text: For the one who has died has been acquitted from sin.
translation:
  language: id
  text: Sebab orang yang telah mati telah dibebaskan dari dosa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah dibenarkan dari dosa”; secara yudisial, “telah dinyatakan bebas dari dosa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... ἀποθανὼν
  choice: orang yang telah mati
  rationale: Artikel dengan partisip aoris berfungsi substantival. Ungkapan ini alami dalam bahasa Indonesia, tidak membatasi gender, dan mempertahankan sifat umum atau representatifnya.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya; “Sebab” merupakan penghubung yang ringkas dan wajar.
- source_word: δεδικαίωται
  choice: telah dibebaskan dari tuntutan
  rationale: Bentuk perfektum pasif δικαιόω mempertahankan nuansa putusan hukum dengan hasil yang terus berlaku. “Dibebaskan dari tuntutan” lebih idiomatis daripada “dibenarkan dari” dan, dibanding “dibebaskan” saja, tidak menghilangkan dimensi forensiknya.
- source_word: ἀπὸ τῆς ἁμαρτίας
  choice: dari tuntutan dosa
  rationale: ἀπό menandai pemisahan atau pelepasan. Penambahan “tuntutan” menjelaskan hubungan idiomatis dengan δικαιόω tanpa membatasi dosa hanya pada rasa bersalah; dosa tetap dapat dipahami sebagai kuasa yang dipersonifikasikan dalam konteks Roma 6.
theological_decisions:
- issue: Apakah δικαιόω harus dinyatakan secara forensik sebagai “dibenarkan/dinyatakan bebas dari kesalahan” atau secara emansipatoris sebagai “dibebaskan.”
  choice: telah dibebaskan dari tuntutan dosa
  alternative: telah dibenarkan dari dosa; telah dibebaskan dari dosa
  rationale: Pilihan utama menjaga citra hukum pada δικαιόω sekaligus sesuai dengan konteks pelepasan dari kekuasaan dosa. Catatan kaki mempertahankan dua kemungkinan utama agar ketegangan antara pembenaran dan pembebasan tidak diselesaikan secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. “Orang yang” inklusif dan alami; bentuk perfektum Yunani tercermin dalam “telah ...” sebagai tindakan yang hasilnya tetap berlaku.
