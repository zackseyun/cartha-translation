id: ROM.6.13
reference: Romans 6:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ⸀ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/013.yaml
  text: And do not present your members to sin as weapons of unrighteousness[a], but present yourselves to God as alive from the dead[b], and your members to God as weapons of righteousness.
translation:
  language: id
  text: Janganlah menyerahkan anggota-anggota tubuhmu kepada dosa sebagai senjata kelaliman[a]. Sebaliknya, serahkanlah dirimu kepada Allah sebagai orang-orang yang hidup dari antara orang mati, dan serahkanlah anggota-anggota tubuhmu kepada Allah sebagai senjata kebenaran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “alat kelaliman”; demikian juga “alat kebenaran” pada akhir ayat.
    reason: lexical_alternative
  - marker: b
    text: Atau “keadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε / παραστήσατε
  choice: menyerahkan / serahkanlah
  rationale: Kata ini menyatakan tindakan menempatkan diri atau tubuh kepada pihak lain agar berada dalam kuasanya atau siap dipakainya. Pengulangan akar kata “serah” mempertahankan kontras yang erat antara dosa dan Allah.
- source_word: μέλη
  choice: anggota-anggota tubuh
  rationale: Ungkapan ini jelas bagi pembaca modern dan mempertahankan acuan kepada bagian-bagian tubuh yang dipakai dalam tindakan moral.
- source_word: ὅπλα
  choice: senjata
  rationale: Pilihan ini mempertahankan gambaran konflik atau peperangan yang kuat dalam ὅπλα, sementara arti yang lebih umum, “alat,” dicatat dalam catatan kaki.
- source_word: ἀδικίας
  choice: kelaliman
  rationale: “Kelaliman” mengungkapkan keburukan moral dan ketidakadilan yang terkandung dalam ἀδικία tanpa mereduksinya menjadi satu tindakan salah tertentu.
- source_word: ἁμαρτίᾳ
  choice: dosa
  rationale: Terjemahan langsung ini tetap memungkinkan pembaca menangkap personifikasi dosa sebagai kuasa yang menuntut penggunaan tubuh.
- source_word: ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: sebagai orang-orang yang hidup dari antara orang mati
  rationale: Ungkapan ini mempertahankan daya pembanding ὡσεὶ serta kontras antara kematian dan kehidupan, tanpa secara eksplisit menambahkan pelaku yang menghidupkan mereka.
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: Dalam konteks Paulus, “kebenaran” mempertahankan cakupan moral-teologis δικαιοσύνη dan membentuk kontras dengan kelaliman; alternatif “keadilan” dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Kontras antara dosa dan Allah sebagai pihak yang menerima penyerahan manusia dan anggota tubuhnya
  choice: Mempertahankan hubungan langsung “kepada dosa” dan “kepada Allah”
  alternative: Mengembangkan menjadi “untuk melayani dosa” dan “untuk melayani Allah”
  rationale: Bentuk datif Yunani sudah menyiratkan arah, ketersediaan, dan kesetiaan. Terjemahan langsung menjaga daya teologis itu tanpa menambahkan tafsiran tentang pelayanan.
- issue: Keadaan hidup dari antara orang mati
  choice: “sebagai orang-orang yang hidup dari antara orang mati”
  alternative: “sebagai orang-orang yang telah dihidupkan dari kematian”
  rationale: Pilihan utama mempertahankan bentuk partisip aktif ζῶντας dan ungkapan ἐκ νεκρῶν, serta tidak mengubahnya menjadi bentuk pasif eksplisit yang tidak dinyatakan dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Anggota-anggota tubuh” dipilih daripada “anggota-anggota” saja demi kejelasan. Pengulangan “serahkanlah” pada klausa terakhir dibuat eksplisit agar struktur kalimat alami dalam bahasa Indonesia sekaligus tetap mencerminkan verba yang dipahami dari klausa sebelumnya.
source_grounding:
  english_pob_role: consult_only
