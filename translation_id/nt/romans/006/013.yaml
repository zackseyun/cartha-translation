  source_fidelity: 'Terjemahan mengikuti struktur dan makna Yunani dengan baik: larangan present συνεχ-menerus kepada dosa dikontraskan dengan perintah untuk menyerahkan diri kepada Allah. Pengulangan "serahkanlah" dalam klausa terakhir, walaupun verba Yunani di sana dipahami dari klausa sebelumnya, sah dan membantu kejelasan bahasa Indonesia. "Sebagai orang-orang yang hidup dari antara orang mati" mempertahankan daya pembanding ὡσεὶ serta tidak menambahkan pelaku yang membangkitkan.'
