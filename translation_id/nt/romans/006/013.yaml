  terminology: '"Dosa," "Allah," "senjata," "kelaliman," dan "kebenaran" membentuk register moral-teologis yang sesuai dan mempertahankan kontras ἀδικία/δικαιοσύνη. "Kelaliman" tidak mencakup seluruh kemungkinan nuansa leksikal ἀδικία secara abstrak, tetapi merupakan padanan Alkitabiah Indonesia yang mapan dan memadai dalam pasangan ini. Catatan kaki "alat" dan "keadilan" memberi alternatif yang relevan; jangkar catatan kaki sudah tepat.'
