id: ROM.6.17
reference: Romans 6:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/017.yaml
  text: But thanks be to God that[a], though you were servants of sin[b], you obeyed from the heart the pattern of teaching to which you were handed over.
translation:
  language: id
  text: Namun, syukur kepada Allah! Meskipun dahulu kamu adalah budak dosa, kamu telah menaati dengan segenap hati pola pengajaran[a] yang kepadanya kamu diserahkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bentuk pengajaran” atau “patokan pengajaran.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “yang ke dalamnya kamu diserahkan.”
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις δὲ τῷ θεῷ
  choice: Namun, syukur kepada Allah!
  rationale: Dalam ungkapan ini, χάρις menyatakan ucapan syukur yang ditujukan kepada Allah. Bentuk seruan mempertahankan nada doksologis Paulus, sedangkan δέ diterjemahkan “Namun” untuk menandai peralihan dan kontras.
- source_word: δοῦλοι τῆς ἁμαρτίας
  choice: budak dosa
  rationale: “Budak” mempertahankan gambaran keterikatan, kepemilikan, dan penguasaan yang menjadi pokok perbandingan dalam Roma 6; “hamba” dapat terdengar terlalu lunak dalam konteks ini.
- source_word: ὑπηκούσατε
  choice: kamu telah menaati
  rationale: Kata kerja ini menunjuk pada ketaatan, bukan sekadar mendengar. Bentuk “telah menaati” menyampaikan tindakan yang dipandang sebagai peristiwa nyata pada masa lampau.
- source_word: ἐκ καρδίας
  choice: dengan segenap hati
  rationale: Ungkapan Indonesia ini menyampaikan ketaatan batiniah dan sungguh-sungguh yang terkandung dalam ungkapan harfiah “dari hati,” tanpa terdengar kaku.
- source_word: τύπον διδαχῆς
  choice: pola pengajaran
  rationale: τύπος dapat berarti pola, bentuk, atau patokan, sedangkan διδαχή berarti pengajaran. “Pola pengajaran” jelas bagi pembaca modern sekaligus mempertahankan metafora sumber.
- source_word: παρεδόθητε
  choice: kamu diserahkan
  rationale: Bentuk pasif dipertahankan karena teks menggambarkan orang percaya sebagai pihak yang diserahkan kepada suatu pola pengajaran, bukan pengajaran yang disampaikan kepada mereka.
- source_word: εἰς ὃν
  choice: yang kepadanya
  rationale: Pilihan ini mengungkapkan arah atau hubungan yang ditandai εἰς dan tetap wajar bersama kata kerja “diserahkan”; kemungkinan gambaran gerak “ke dalam” dicatat dalam catatan kaki.
theological_decisions:
- issue: Apakah δοῦλοι perlu diperhalus menjadi “hamba” atau diterjemahkan “budak”
  choice: budak dosa
  alternative: hamba dosa
  rationale: Konteks Roma 6 menekankan perbudakan sebagai penguasaan dan keterikatan. “Budak” mempertahankan ketajaman metafora Paulus tanpa menambahkan gagasan denominasi tertentu.
- issue: Apakah frasa pasif perlu diubah sehingga pengajaranlah yang disampaikan kepada orang percaya
  choice: pola pengajaran yang kepadanya kamu diserahkan
  alternative: pengajaran yang disampaikan kepadamu
  rationale: Susunan Yunani menempatkan para pembaca sebagai pihak yang diserahkan kepada pola pengajaran. Mempertahankan bentuk ini menjaga metafora dan ketegangan teks yang mencolok.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Budak” sengaja dipakai karena metafora perbudakan sangat menonjol dalam konteks. Bentuk pasif yang tidak lazim sepenuhnya tetap dipertahankan agar gambaran asli tidak diratakan.
