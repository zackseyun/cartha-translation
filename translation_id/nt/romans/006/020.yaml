  text: Ὅτε γὰρ δοῦλοι ἦτε τῆς ἁμαρτίας, ἐλεύθεροι ἦτε τῇ δικαιοσύνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/020.yaml
  text: For when you were servants of sin[b][a], you were free in regard to righteousness.
translation:
  language: id
  text: Sebab, ketika kamu menjadi budak dosa, kamu bebas dalam hal kebenaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kamu bebas dari kebenaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: budak
  rationale: Kata ini mempertahankan gambaran perbudakan yang kuat dalam Roma 6, yakni pertentangan antara dua kuasa yang memperbudak.
- source_word: ἁμαρτίας
  choice: dosa
  rationale: Genitif ini menyatakan bahwa dosa adalah penguasa mereka; ungkapan alami dalam bahasa Indonesia ialah “budak dosa”.
- source_word: ἐλεύθεροι
  choice: bebas
  rationale: 'Pilihan ini mempertahankan ironi tajam Paulus: ketika diperbudak dosa, mereka tidak terikat pada kebenaran.'
- source_word: τῇ δικαιοσύνῃ
  choice: dalam kaitannya dengan kebenaran
  rationale: Datif dipahami sebagai datif acuan atau segi; terjemahan ini menjaga ketegangan ungkapan Yunani tanpa menyiratkan secara berlebihan bahwa kebenaran adalah penindas.
- source_word: γὰρ
  choice: sebab
  rationale: “Sebab” mempertahankan hubungan penjelasan dengan argumen sebelumnya dan sesuai dengan ragam bahasa Indonesia yang bermartabat.
theological_decisions:
- issue: Cara mengungkapkan hubungan dengan kebenaran dalam kontras Paulus
  choice: kamu bebas dalam kaitannya dengan kebenaran
  alternative: kamu bebas dari kebenaran
  rationale: Terjemahan utama mempertahankan datif acuan dan ketegangan retoris teks tanpa membuat kebenaran terdengar sebagai kuasa buruk yang membelenggu; alternatif yang lebih harfiah dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “kamu” mengikuti bentuk jamak ἦτε dalam konteks jemaat secara kolektif; bahasa Indonesia tidak menandai jumlah pada pronomina ini. “Budak” dipilih daripada “hamba” agar metafora perbudakan Paulus tetap tegas.
