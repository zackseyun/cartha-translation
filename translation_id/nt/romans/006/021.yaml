id: ROM.6.21
reference: Romans 6:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τίνα οὖν καρπὸν εἴχετε τότε ἐφ’ οἷς νῦν ἐπαισχύνεσθε; τὸ γὰρ τέλος ἐκείνων θάνατος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/021.yaml
  text: So what fruit did you have then from the things of which you are now ashamed? For the end of those things is death[a].
translation:
  language: id
  text: Jadi, buah apa yang kamu peroleh pada waktu itu dari hal-hal yang sekarang membuat kamu malu? Sebab, akhir dari hal-hal itu adalah kematian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "hasil" untuk "akhir".
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα
  choice: apa
  rationale: Memperkenalkan pertanyaan retoris tentang hasil kehidupan mereka dahulu; bentuk sederhana ini alami dalam bahasa Indonesia dan mempertahankan daya pertanyaannya.
- source_word: καρπὸν
  choice: buah
  rationale: Mempertahankan metafora Paulus tentang hasil yang dihasilkan, alih-alih meratakannya menjadi istilah abstrak seperti 'manfaat' atau 'hasil'.
- source_word: εἴχετε
  choice: kamu peroleh
  rationale: Dalam konteks metafora buah dan frasa ἐφ’ οἷς, pilihan ini menyampaikan apa yang mereka dapatkan dari kehidupan dahulu; unsur waktu lampau dinyatakan oleh 'pada waktu itu'.
- source_word: τότε
  choice: pada waktu itu
  rationale: Menandai keadaan mereka dahulu dan membentuk kontras yang jelas dengan 'sekarang'.
- source_word: ἐφ’ οἷς
  choice: dari hal-hal yang
  rationale: Menyatakan sumber buah atau hasil dari perbuatan-perbuatan dahulu dan memasok anteseden tersirat secara wajar dalam bahasa Indonesia.
- source_word: νῦν
  choice: sekarang
  rationale: Mempertahankan kontras temporal yang tajam dengan 'pada waktu itu'.
- source_word: ἐπαισχύνεσθε
  choice: membuat kamu malu
  rationale: Mengungkapkan keadaan malu secara alami dalam bahasa Indonesia sambil mempertahankan bobot moralnya; bukan sekadar rasa canggung.
- source_word: τέλος
  choice: akhir
  rationale: Mempertahankan cakupan makna sebagai titik akhir sekaligus konsekuensi, tanpa membatasinya hanya pada 'hasil'.
- source_word: ἐκείνων
  choice: hal-hal itu
  rationale: Menunjuk kembali dengan jelas kepada hal-hal atau perbuatan yang baru disebut.
- source_word: θάνατος
  choice: kematian
  rationale: Padanan langsung dan baku yang mempertahankan bobot teologis peringatan Paulus.
theological_decisions:
- issue: Apakah τέλος diterjemahkan sebagai 'akhir' atau secara lebih interpretatif sebagai 'hasil/akibat'
  choice: akhir
  alternative: hasil atau akibat
  rationale: '''Akhir'' mempertahankan ketegangan antara tujuan akhir, kesudahan, dan konsekuensi dari cara hidup mereka dahulu; alternatif dicatat tanpa menutup kemungkinan makna tersebut.'
translation_notes:
  register: Bahasa Indonesia standar modern, alami, dan bermartabat. Sapaan 'kamu' dipakai sebagai bentuk jamak kontekstual kepada jemaat. Metafora 'buah' dipertahankan, demikian pula kontras antara dahulu dan sekarang.
