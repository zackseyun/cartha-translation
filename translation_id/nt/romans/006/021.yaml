  source_fidelity: Teks Indonesia secara akurat mempertahankan pertanyaan retoris Yunani, kontras temporal τότε/νῦν, metafora καρπός sebagai “buah,” relasi “dari hal-hal yang,” serta penegasan bahwa τέλος dari hal-hal itu adalah θάνατος. “Membuat kamu malu” menyampaikan daya ἐπαισχύνεσθε secara wajar tanpa menambahkan penafsiran teologis.
  naturalness: Kalimatnya alami dalam bahasa Indonesia standar modern, jelas, dan tetap bermartabat. “Pada waktu itu” berpasangan baik dengan “sekarang,” sedangkan “buah apa yang kamu peroleh” mempertahankan metafora sambil tetap mudah dipahami.
