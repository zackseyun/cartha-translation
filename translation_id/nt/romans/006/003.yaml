id: ROM.6.3
reference: Romans 6:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἢ ἀγνοεῖτε ὅτι ὅσοι ἐβαπτίσθημεν εἰς Χριστὸν Ἰησοῦν εἰς τὸν θάνατον αὐτοῦ ἐβαπτίσθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/003.yaml
  text: Or do you not know that all of us who were baptized into Messiah Jesus were baptized into his death?[a]
translation:
  language: id
  text: Atau, tidak tahukah kalian bahwa kita semua yang dibaptis ke dalam Mesias Yesus[a] dibaptis ke dalam kematian-Nya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Kristus Yesus”. Yunani: Christos Iēsous.'
    reason: Menunjukkan padanan tradisional berupa transliterasi bagi gelar Yunani Χριστός, sementara teks utama menerjemahkan maknanya sebagai “Mesias”.
lexical_decisions:
- source_word: ἢ
  choice: Atau
  rationale: Mempertahankan peralihan argumentatif Paulus yang menghubungkan pertanyaan retoris ini dengan ayat sebelumnya.
- source_word: ἀγνοεῖτε
  choice: tidak tahukah kalian
  rationale: Menyampaikan pertanyaan retoris dalam bentuk kini dan mempertahankan bahwa sapaan Yunani berbentuk jamak.
- source_word: ὅσοι
  choice: kita semua yang
  rationale: Mengungkapkan cakupan inklusif frasa relatif bersama verba orang pertama jamak secara alami dalam bahasa Indonesia.
- source_word: ἐβαπτίσθημεν
  choice: dibaptis
  rationale: Menerjemahkan aoristus pasif secara langsung tanpa menambahkan penjelasan denominasi mengenai baptisan.
- source_word: εἰς
  choice: ke dalam
  rationale: Mempertahankan gambaran kuat tentang gerak atau penyatuan tanpa menentukan mekanisme teologisnya.
- source_word: Χριστὸν Ἰησοῦν
  choice: Mesias Yesus
  rationale: Menerjemahkan Χριστός menurut makna gelarnya, yaitu Mesias, sambil mempertahankan urutan unsur dalam bahasa sumber.
- source_word: τὸν θάνατον αὐτοῦ
  choice: kematian-Nya
  rationale: Padanan langsung dan wajar bagi frasa Yunani, dengan pronomina yang jelas merujuk kepada Mesias Yesus.
theological_decisions:
- issue: Makna εἰς dalam kaitannya dengan baptisan, Mesias Yesus, dan kematian-Nya.
  choice: Kedua kemunculan εἰς diterjemahkan “ke dalam”.
  alternative: “dalam hubungan dengan” atau “ke dalam persatuan dengan”
  rationale: “Ke dalam” menjaga daya ungkap teks tentang gerak atau penggabungan, tetapi tidak memutuskan apakah hubungan itu harus dijelaskan terutama sebagai efektivitas sakramental, perlambangan, atau persatuan perjanjian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menyatakan dengan jelas bentuk orang kedua jamak pada ἀγνοεῖτε; susunan berulang “dibaptis ke dalam” dipertahankan karena penting bagi penalaran Paulus.
