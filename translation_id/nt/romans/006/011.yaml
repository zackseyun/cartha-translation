  source_fidelity: 'Draf pada umumnya setia pada struktur dan kontras Yunani: οὕτως καί, imperatif λογίζεσθε, refleksif ἑαυτούς, kontras mati/hidup, serta ἐν Χριστῷ Ἰησοῦ semuanya terwakili. Namun, “sudah mati” menambahkan aspek eksplisit yang tidak ada dalam εἶναι νεκρούς. Walaupun konteks sebelumnya berbicara tentang kematian bersama Mesias, ayat ini sendiri memerintahkan pembaca untuk menganggap diri mereka “mati,” bukan secara eksplisit “sudah mati.”'
