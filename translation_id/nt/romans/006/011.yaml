id: ROM.6.11
reference: Romans 6:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς λογίζεσθε ἑαυτοὺς ⸂εἶναι νεκροὺς μὲν⸃ τῇ ἁμαρτίᾳ ζῶντας δὲ τῷ θεῷ ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/011.yaml
  text: So also you[c][b][a], consider yourselves to be dead to sin but alive to God in Messiah Jesus.
translation:
  language: id
  text: Demikian juga, anggaplah[a] diri kalian mati terhadap dosa, tetapi hidup bagi Allah dalam Mesias[b] Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perhitungkan” atau “anggaplah diri kalian sebagai orang yang mati terhadap dosa, tetapi hidup bagi Allah.”
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “dalam Kristus Yesus”; “Mesias” menerjemahkan gelar Χριστός.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Demikian juga
  rationale: Mempertahankan hubungan inferensial dengan uraian sebelumnya dalam ungkapan Indonesia yang wajar.
- source_word: λογίζεσθε
  choice: hendaklah kalian menganggap
  rationale: Bentuk imperatif diterjemahkan secara eksplisit; 'menganggap' menyampaikan tindakan menilai atau memperhitungkan sesuatu sebagai kenyataan.
- source_word: ἑαυτοὺς εἶναι
  choice: diri kalian sudah
  rationale: Pronomina refleksif dipertahankan. 'Sudah' membuat keadaan mati yang dimaksud terdengar alami dalam bahasa Indonesia tanpa mengubahnya menjadi peristiwa baru.
- source_word: νεκροὺς μὲν τῇ ἁμαρτίᾳ
  choice: mati terhadap dosa
  rationale: '''Terhadap'' menyatakan hubungan datif dengan cukup formal dan jelas; kontras μέν–δέ disampaikan melalui ''tetapi''.'
- source_word: ζῶντας δὲ τῷ θεῷ
  choice: tetapi hidup bagi Allah
  rationale: '''Hidup'' mempertahankan bentuk partisipel secara alami, sedangkan ''bagi Allah'' menyampaikan orientasi atau hubungan datif tanpa mempersempit maknanya.'
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: '''Dalam'' mempertahankan bahasa khas Paulus mengenai lingkup atau persatuan dan tidak menafsirkannya sebagai sarana atau sebab; Χριστός diterjemahkan sebagai gelar ''Mesias''.'
theological_decisions:
- issue: Apakah Χριστῷ diterjemahkan sebagai gelar atau bentuk nama
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa ini, makna gelar tetap nyata; 'Mesias' menerjemahkan Χριστός tanpa menganggapnya semata-mata sebagai nama diri.
- issue: Daya makna ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  alternative: melalui Mesias Yesus; karena Mesias Yesus
  rationale: Terjemahan 'dalam' mempertahankan ambiguitas mengenai lingkup, hubungan, atau persatuan dengan Mesias dan tidak menyelesaikannya menjadi sarana atau sebab.
- issue: Hubungan orang percaya dengan dosa dan Allah
  choice: mati terhadap dosa, tetapi hidup bagi Allah
  alternative: tidak lagi berdosa, tetapi hidup untuk Allah
  rationale: Rumusan ini mempertahankan metafora dan ketegangan teologis Paulus tanpa mengubah 'mati terhadap dosa' menjadi klaim bahwa dosa sama sekali tidak mungkin lagi dilakukan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai bentuk jamak ὑμεῖς secara jelas. Struktur kontras dipertahankan, sementara imperatif λογίζεσθε dibuat eksplisit dengan 'hendaklah'.
