  terminology: '“Mesias Yesus” secara tepat mempertahankan daya gelar Χριστός, dan “dalam” dengan tepat tidak menafsirkan ἐν sebagai sarana atau sebab. Catatan kaki sebaiknya dipisahkan menurut jangkar: alternatif λογίζεσθε pada “anggaplah” dan penjelasan Mesias/Kristus pada “Mesias”.'
