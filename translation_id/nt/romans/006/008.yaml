id: ROM.6.8
reference: Romans 6:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ ἀπεθάνομεν σὺν Χριστῷ, πιστεύομεν ὅτι καὶ συζήσομεν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/008.yaml
  text: If we died with Messiah[a], we believe that we will also live with him.
translation:
  language: id
  text: Jika kita telah mati bersama Mesias[a], kita percaya bahwa kita juga akan hidup bersama Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Kristus”: Yunani Χριστῷ (Christō).'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Jika
  rationale: εἰ memperkenalkan syarat, sedangkan δέ menandai kelanjutan atau peralihan argumen. Dalam bahasa Indonesia, “Jika” sudah alami; hubungan wacananya dapat dipahami dari konteks tanpa menambahkan penanda waktu.
- source_word: ἀπεθάνομεν
  choice: kita telah mati
  rationale: Aoris menunjuk pada kematian bersama Mesias yang dipandang sudah terjadi dalam alur argumentasi. Bentuk “telah mati” menyampaikan aspek lampau yang relevan secara alami dalam bahasa Indonesia.
- source_word: σὺν Χριστῷ
  choice: bersama Mesias
  rationale: σύν menyatakan kebersamaan atau persekutuan, sehingga “bersama” tepat. Χριστός digunakan sebagai gelar dan diterjemahkan “Mesias,” dengan alternatif lazim “Kristus” dicatat dalam catatan kaki.
- source_word: πιστεύομεν
  choice: kita percaya
  rationale: πιστεύομεν secara langsung berarti “kita percaya” dan mempertahankan pernyataan iman dalam bentuk aktif.
- source_word: ὅτι
  choice: bahwa
  rationale: ὅτι memperkenalkan isi yang dipercayai; “bahwa” mempertahankan struktur kalimat Yunani dengan jelas.
- source_word: καὶ
  choice: juga
  rationale: καί menghubungkan kenyataan hidup bersama Dia dengan kematian bersama Mesias yang disebut sebelumnya.
- source_word: συζήσομεν αὐτῷ
  choice: kita juga akan hidup bersama Dia
  rationale: συζάω berarti hidup bersama, dan datif αὐτῷ menyatakan pribadi yang menyertai kehidupan itu. Terjemahan ini menjaga rujukan kepada kehidupan bersama pada masa depan tanpa mempersempit maknanya.
theological_decisions:
- issue: Penerjemahan Χριστῷ
  choice: Mesias
  alternative: Kristus
  rationale: Kata Yunani Χριστός pada dasarnya merupakan gelar, yaitu Yang Diurapi. “Mesias” mempertahankan fungsi gelar tersebut, sedangkan bentuk tradisional “Kristus” disediakan sebagai alternatif dalam catatan kaki.
- issue: Hakikat kehidupan mendatang dalam συζήσομεν αὐτῷ
  choice: akan hidup bersama Dia
  alternative: akan hidup kembali bersama Dia; akan berbagi kehidupan kebangkitan bersama Dia
  rationale: Teks menyatakan kehidupan bersama Mesias pada masa depan, tetapi tidak secara eksplisit membatasi pernyataan ini pada mekanisme atau tahap teologis tertentu. Terjemahan dibiarkan seluas ungkapan Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan bernada khidmat. “Bersama” dipilih untuk menerjemahkan gagasan kebersamaan dalam kedua bagian ayat. Kata ganti “Dia” dikapitalisasi sesuai kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Mesias.
