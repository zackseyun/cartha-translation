id: ROM.6.23
reference: Romans 6:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/023.yaml
  text: For the wages of sin is death[b][a], but the gift of God is eternal life in Messiah Jesus our Lord.
translation:
  language: id
  text: Sebab upah dosa adalah kematian, tetapi karunia Allah adalah hidup kekal dalam Mesias Yesus, Tuhan kita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψώνια
  choice: upah
  rationale: Kata ini menunjuk pada bayaran yang diterima sebagai hasil atau imbalan; “upah” mempertahankan gambaran tentang sesuatu yang diperoleh dan menegaskan kontras dengan karunia.
- source_word: τῆς ἁμαρτίας
  choice: dosa
  rationale: Konstruksi genitif dipadatkan secara alami menjadi “upah dosa,” yang dapat menyatakan upah milik atau yang dibayarkan oleh dosa tanpa mempersempit maknanya.
- source_word: θάνατος
  choice: kematian
  rationale: Padanan langsung yang mempertahankan bobot harfiah dan teologis istilah Yunani tanpa menentukan jenis kematian dalam teks terjemahan.
- source_word: χάρισμα
  choice: karunia
  rationale: “Karunia” menyampaikan pemberian yang berasal dari anugerah dan membentuk kontras yang jelas dengan “upah,” tanpa menambahkan penjelasan ke dalam teks utama.
- source_word: ζωὴ αἰώνιος
  choice: hidup kekal
  rationale: Padanan Indonesia yang alami dan mapan, mencakup dimensi keberlangsungan serta bobot teologis frasa tersebut.
- source_word: ἐν
  choice: dalam
  rationale: “Dalam” mempertahankan ungkapan Paulus mengenai lingkup atau persatuan dengan Mesias dan tidak mempersempitnya menjadi sarana semata.
- source_word: Χριστῷ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός tetap diperlakukan sebagai gelar, bukan sekadar dialihaksarakan, sementara urutan Yunani dipertahankan.
- source_word: κυρίῳ
  choice: Tuhan
  rationale: “Tuhan” merupakan padanan baku yang mempertahankan penggunaan pengakuan iman dan bobot teologis κύριος.
theological_decisions:
- issue: Daya makna ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  alternative: melalui Mesias Yesus
  rationale: Preposisi ἐν paling wajar mempertahankan gagasan lingkup atau persatuan dengan Mesias. Padanan “dalam” membiarkan ketegangan teologis itu tetap terbuka dan tidak membatasinya pada perantaraan atau sebab instrumental.
- issue: Kontras antara hasil dosa dan pemberian Allah
  choice: upah dosa ... karunia Allah
  alternative: bayaran dari dosa ... pemberian cuma-cuma dari Allah
  rationale: Pilihan ini mempertahankan kontras antara sesuatu yang diperoleh sebagai upah dan sesuatu yang diberikan sebagai karunia, tanpa menambahkan penafsiran yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Struktur antitesis Yunani dipertahankan secara alami. “Mesias” dipakai sebagai gelar bagi Χριστός, dan “dalam” dipertahankan agar ungkapan khas Paulus tidak dijelaskan secara berlebihan.
