id: ROM.1.27
reference: Romans 1:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁμοίως τε καὶ οἱ ἄρσενες ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους, ἄρσενες ἐν ἄρσεσιν τὴν ἀσχημοσύνην κατεργαζόμενοι καὶ τὴν ἀντιμισθίαν ἣν ἔδει τῆς πλάνης αὐτῶν ἐν ⸀ἑαυτοῖς ἀπολαμβάνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/027.yaml
  text: And likewise the males[a], having abandoned the natural use of the female, were inflamed in their desire for one another[d][c][b], males with males committing indecency and receiving in themselves the due penalty for their error.
translation:
  language: id
  text: Demikian juga, setelah meninggalkan hubungan alami dengan perempuan, laki-laki berkobar-kobar dalam hasrat mereka terhadap satu sama lain; laki-laki dengan laki-laki melakukan perbuatan yang memalukan dan menerima dalam diri mereka sendiri balasan yang semestinya atas kesalahan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ganjaran yang patut atas kekeliruan mereka.”
    reason: Menunjukkan rentang makna ἀντιμισθία, ἣν ἔδει, dan πλάνη tanpa mengubah bacaan utama.
lexical_decisions:
- source_word: ἄρσενες / θηλείας
  choice: laki-laki / perempuan
  rationale: Kedua istilah Yunani menandai jenis kelamin secara biologis. Dalam bahasa Indonesia modern, “laki-laki” dan “perempuan” mempertahankan kontras itu secara alami tanpa menambahkan nuansa relasional.
- source_word: ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας
  choice: meninggalkan hubungan alami dengan perempuan
  rationale: “Meninggalkan” menyampaikan tindakan yang mendahului verba utama. Dalam konteks ini χρῆσις bersifat seksual; “hubungan alami dengan perempuan” lebih wajar dan cukup jelas dalam bahasa Indonesia daripada terjemahan harfiah “penggunaan alami perempuan,” yang dapat memberi kesan memperlakukan perempuan sebagai objek.
- source_word: ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν
  choice: berkobar-kobar dalam hasrat mereka
  rationale: Pilihan ini mempertahankan citra api pada verba dan menerjemahkan ὄρεξις sebagai “hasrat” tanpa memperkuatnya secara tidak perlu menjadi “nafsu berahi.”
- source_word: εἰς ἀλλήλους
  choice: terhadap satu sama lain
  rationale: Ungkapan ini mempertahankan arah hasrat dan sifat timbal balik dari frasa Yunani.
- source_word: ἄρσενες ἐν ἄρσεσιν
  choice: laki-laki dengan laki-laki
  rationale: Pengulangan istilah berpenanda jenis kelamin dipertahankan untuk menjaga penekanan retoris teks Yunani.
- source_word: τὴν ἀσχημοσύνην κατεργαζόμενοι
  choice: melakukan perbuatan yang memalukan
  rationale: Terjemahan ini mempertahankan penilaian moral pada nomina ἀσχημοσύνη, tetapi tidak merinci tindakan melampaui teks sumber.
- source_word: τὴν ἀντιμισθίαν ἣν ἔδει
  choice: balasan yang semestinya
  rationale: ἀντιμισθία menyatakan balasan atau ganjaran yang sepadan, sedangkan ἣν ἔδει menunjukkan bahwa balasan itu patut atau semestinya. “Balasan yang semestinya” mempertahankan keduanya tanpa menetapkan bentuknya sebagai hukuman tertentu.
- source_word: τῆς πλάνης αὐτῶν
  choice: atas kesesatan mereka
  rationale: πλάνη dapat menunjuk pada kekeliruan atau penyimpangan dari jalan yang benar. “Kesesatan” menjaga dimensi moral-religius dalam konteks tanpa menentukan kesesatan itu secara lebih sempit.
- source_word: ἐν ἑαυτοῖς ἀπολαμβάνοντες
  choice: menerima dalam diri mereka sendiri
  rationale: Terjemahan ini menjaga daya refleksif ἑαυτοῖς dan tidak menafsirkan secara spesifik cara atau wujud balasan tersebut.
theological_decisions:
- issue: Apakah istilah biologis Yunani perlu diperhalus menjadi bahasa relasional
  choice: laki-laki ... perempuan ... laki-laki dengan laki-laki
  alternative: para pria ... wanita ... pria dengan pria
  rationale: Teks Yunani memakai istilah yang secara eksplisit berpenanda jenis kelamin. Padanan yang dipilih mempertahankan hal itu tanpa menambahkan kategori identitas atau label modern.
- issue: Apakah tindakan perlu diberi label yang lebih khusus
  choice: melakukan perbuatan yang memalukan
  alternative: melakukan perbuatan homoseksual
  rationale: ἀσχημοσύνη menyampaikan penilaian moral, tetapi tidak memakai label identitas atau istilah teknis modern. Terjemahan tidak boleh mempersempit atau memperluas pernyataan sumber.
- issue: Makna balasan yang diterima dalam diri mereka
  choice: dibiarkan tidak dirinci
  alternative: ditafsirkan sebagai akibat jasmani, psikologis, sosial, atau hukuman eskatologis tertentu
  rationale: Ayat tersebut tidak menjelaskan bentuk ἀντιμισθία. Frasa Indonesia mempertahankan ketegangan dan ketidakjelasan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti alur argumentasi Yunani, tetapi partisipium dialihkan secara wajar ke rangkaian verba Indonesia. Istilah vulgar, label identitas modern, dan penjelasan denominatif dihindari.
