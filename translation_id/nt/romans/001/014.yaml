id: ROM.1.14
reference: Romans 1:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἕλλησίν τε καὶ βαρβάροις, σοφοῖς τε καὶ ἀνοήτοις ὀφειλέτης εἰμί·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/014.yaml
  text: I am under obligation both to Greeks and to barbarians[a], both to the wise and to the foolish.
translation:
  language: id
  text: Aku berutang, baik kepada orang Yunani maupun kepada orang bukan Yunani[a], baik kepada orang bijak maupun kepada orang bodoh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang barbar”; dalam pemakaian Yunani saat itu, istilah ini lazim menunjuk pada orang asing atau orang bukan Yunani, bukan dengan sendirinya orang yang biadab.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕλλησίν
  choice: orang Yunani
  rationale: Bentuk datif jamak ini menunjuk pada orang Yunani sebagai kelompok etnis-budaya; padanan ini langsung dan alami dalam bahasa Indonesia.
- source_word: βαρβάροις
  choice: orang bukan Yunani
  rationale: Dalam pasangan budaya Yunani kuno ini, istilah tersebut terutama menunjuk pada mereka yang bukan orang Yunani atau tidak berbahasa Yunani. Padanan ini menghindari kesan modern bahwa mereka pasti biadab, sementara catatan kaki mempertahankan bentuk harfiahnya.
- source_word: σοφοῖς
  choice: orang bijak
  rationale: Padanan ini mempertahankan makna langsung serta kontras ringkas dengan ἀνοήτοις.
- source_word: ἀνοήτοις
  choice: orang bodoh
  rationale: Padanan ini mempertahankan kontras langsung dengan 'orang bijak' tanpa mempersempit maknanya menjadi sekadar tidak terpelajar.
- source_word: ὀφειλέτης
  choice: berutang
  rationale: Kata benda Yunani secara harfiah berarti 'orang yang berutang'; dalam konteks ini ungkapan 'aku berutang' secara alami menyatakan kewajiban yang mengikat, bukan semata-mata utang uang.
- source_word: τε ... καὶ / τε ... καὶ
  choice: baik ... maupun ... / baik ... maupun ...
  rationale: Susunan korelatif ini mempertahankan keseimbangan retoris kedua pasangan dalam teks Yunani.
theological_decisions:
- issue: Sifat utang Paulus
  choice: Mempertahankan metafora 'berutang' tanpa menjelaskan sumber atau sifat kewajiban di dalam ayat.
  alternative: Aku berkewajiban
  rationale: Metafora utang terdapat dalam ὀφειλέτης dan dapat menyatakan kewajiban kerasulan atau moral dalam konteks, tetapi ayat ini sendiri tidak merincinya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'kepada' diwakili oleh susunan 'baik kepada ... maupun kepada ...' agar hubungan dengan 'berutang' jelas dan keseimbangan kedua pasangan tetap terdengar.
