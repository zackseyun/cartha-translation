id: ROM.1.19
reference: Romans 1:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διότι τὸ γνωστὸν τοῦ θεοῦ φανερόν ἐστιν ἐν αὐτοῖς, ὁ ⸂θεὸς γὰρ⸃ αὐτοῖς ἐφανέρωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/019.yaml
  text: because what can be known about God is plain among them, for God has made it plain to them.
translation:
  language: id
  text: sebab apa yang dapat diketahui tentang Allah nyata di antara mereka,[a] karena Allah telah menyatakannya kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "di dalam mereka" atau "dalam diri mereka."
    reason: Mempertahankan ambiguitas ἐν αὐτοῖς, yang dapat menunjuk kepada sesuatu yang nyata di kalangan mereka atau di dalam diri mereka.
lexical_decisions:
- source_word: διότι
  choice: sebab
  rationale: Menghubungkan ayat ini secara kausal dengan pernyataan sebelumnya dalam bahasa Indonesia yang alami dan bermartabat.
- source_word: τὸ γνωστὸν τοῦ θεοῦ
  choice: apa yang dapat diketahui tentang Allah
  rationale: Adjektiva netral berartikel dipakai secara substantival. Ungkapan ini mempertahankan nuansa hal tentang Allah yang dapat diketahui atau dijangkau oleh pengetahuan manusia.
- source_word: φανερόν
  choice: nyata
  rationale: Menyampaikan gagasan bahwa hal itu terbuka dan jelas, sekaligus membentuk hubungan semantis yang wajar dengan verba ἐφανέρωσεν.
- source_word: ἐν αὐτοῖς
  choice: di antara mereka
  rationale: Mengambil kemungkinan makna korporat atau publik yang sesuai dengan konteks, tanpa meniadakan kemungkinan makna batiniah yang dicatat dalam catatan kaki.
- source_word: ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν
  choice: karena Allah telah menyatakannya kepada mereka
  rationale: Menyampaikan tindakan Allah yang membuat hal tersebut nyata kepada mereka. Pronomina -nya memperjelas objek tersirat verba Yunani tanpa menambahkan isi baru.
theological_decisions:
- issue: Makna ἐν αὐτοῖς
  choice: di antara mereka
  alternative: di dalam mereka / dalam diri mereka
  rationale: Frasa Yunani ini sungguh ambigu antara lingkup korporat-publik dan lokasi batiniah. Teks utama memakai makna korporat, sedangkan kemungkinan batiniah dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia standar modern, alami, dan bermartabat. Pilihan "sebab ... karena" mencerminkan dua penghubung kausal Yunani; pengulangannya dapat diterima karena masing-masing memberi dasar bagi pernyataan yang mendahuluinya.
source_grounding:
  english_pob_role: consult_only
