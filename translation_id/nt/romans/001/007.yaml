id: ROM.1.7
reference: Romans 1:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ ἀγαπητοῖς θεοῦ, κλητοῖς ἁγίοις· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/007.yaml
  text: 'To all those in Rome who are beloved by God and called to be saints: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].'
translation:
  language: id
  text: 'Kepada semua orang di Roma yang dikasihi Allah dan dipanggil sebagai orang-orang kudus[a]: Anugerah dan damai sejahtera bagi kalian dari Allah, Bapa kita, dan dari Tuhan Yesus, Sang Mesias[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “orang-orang kudus yang dipanggil” atau, secara tradisional, “dipanggil untuk menjadi orang-orang kudus.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Kristus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ
  choice: Kepada semua orang di Roma
  rationale: Menyampaikan cakupan universal dan lokasi secara ringkas serta alami dalam bahasa Indonesia.
- source_word: ἀγαπητοῖς θεοῦ
  choice: yang dikasihi Allah
  rationale: Mempertahankan sifat relasional bentuk adjektival dan menyatakan Allah sebagai pelaku kasih secara wajar.
- source_word: κλητοῖς ἁγίοις
  choice: dipanggil sebagai orang-orang kudus
  rationale: Mencerminkan kedua adjektiva Yunani tanpa menjadikan kekudusan sekadar tujuan masa depan; kata “sebagai” memperjelas hubungan keduanya secara alami dalam bahasa Indonesia.
- source_word: χάρις
  choice: Anugerah
  rationale: Istilah yang lazim dan bermartabat untuk χάρις serta mempertahankan bobot teologis salam Paulus.
- source_word: εἰρήνη
  choice: damai sejahtera
  rationale: Ungkapan Indonesia yang alami dan mencakup nuansa damai serta kesejahteraan dalam salam ini.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Allah, Bapa kita
  rationale: Susunan ini alami dalam bahasa Indonesia dan memperlihatkan bahwa “Bapa kita” menerangkan Allah.
- source_word: κυρίου
  choice: Tuhan
  rationale: Padanan baku yang mempertahankan daya kristologis κύριος.
- source_word: Χριστοῦ
  choice: Sang Mesias
  rationale: Menerjemahkan makna gelar Χριστός, bukan sekadar mentransliterasikannya; “Sang” menandai gelar secara idiomatis.
theological_decisions:
- issue: Hubungan antara κλητοῖς dan ἁγίοις
  choice: dipanggil sebagai orang-orang kudus
  alternative: dipanggil untuk menjadi orang-orang kudus; orang-orang kudus yang dipanggil
  rationale: Bahasa Yunani tidak memuat infinitif “menjadi”. Pilihan ini mempertahankan panggilan dan identitas kekudusan tanpa secara tidak perlu mengubahnya menjadi sasaran masa depan.
- issue: Penerjemahan gelar Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar yang berarti Mesias atau Yang Diurapi; menerjemahkan gelarnya membuat maknanya transparan bagi pembaca modern.
- issue: Sumber anugerah dan damai sejahtera
  choice: dari Allah, Bapa kita, dan dari Tuhan Yesus, Sang Mesias
  alternative: dari Allah Bapa kita dan Tuhan Yesus, Sang Mesias
  rationale: Pengulangan “dari” dalam bahasa sasaran memperjelas bahwa salam itu berasal dari Allah Bapa dan Tuhan Yesus tanpa mengubah koordinasi dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada epistoler yang hangat dan bermartabat. “Kalian” dipilih untuk menandai bentuk jamak ὑμῖν secara jelas; tanda baca membantu keterbacaan tanpa mengubah hubungan sintaksis pokok.
