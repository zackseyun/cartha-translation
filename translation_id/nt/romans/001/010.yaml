  text: πάντοτε ἐπὶ τῶν προσευχῶν μου, δεόμενος εἴ πως ἤδη ποτὲ εὐοδωθήσομαι ἐν τῷ θελήματι τοῦ θεοῦ ἐλθεῖν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/010.yaml
  text: always in my prayers[a], asking whether somehow, at last, by the will of God I may succeed in coming to you.
translation:
  language: id
  text: Aku selalu memohon dalam doa-doaku agar, entah bagaimana, akhirnya aku dapat berhasil[a] datang kepada kalian oleh kehendak Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, aku dibuat berhasil; atau, perjalananku dilancarkan untuk datang kepada kalian.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: selalu
  rationale: Menyatakan kebiasaan yang terus dilakukan dan mempertahankan penekanan Paulus dengan ungkapan Indonesia yang alami.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: dalam doa-doaku
  rationale: Padanan idiomatis yang jelas untuk konteks ketika Paulus berdoa, tanpa mempertahankan preposisi Yunani secara kaku.
- source_word: δεόμενος
  choice: memohon
  rationale: Mengungkapkan permintaan sungguh-sungguh dalam doa dengan register yang wajar dan bermartabat.
- source_word: εἴ πως
  choice: kalau-kalau
  rationale: Mempertahankan unsur harapan sekaligus ketidakpastian mengenai apakah jalan untuk berkunjung akan terbuka.
- source_word: ἤδη ποτὲ
  choice: akhirnya
  rationale: Menyampaikan harapan yang sudah lama dinantikan; nuansa waktu kini tersirat secara alami dalam bahasa Indonesia.
- source_word: εὐοδωθήσομαι
  choice: aku berhasil
  rationale: Dalam konteks datang kepada jemaat Roma, verba ini menunjuk pada tercapainya perjalanan atau terbukanya jalan, bukan kemakmuran materi. Catatan kaki mempertahankan bentuk pasif dan citra kelancaran jalan sebagai kemungkinan terjemahan.
- source_word: ἐν τῷ θελήματι τοῦ θεοῦ
  choice: oleh kehendak Allah
  rationale: Menunjukkan bahwa keberhasilan kunjungan bergantung pada kehendak Allah, dengan susunan Indonesia yang alami.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: datang kepada kalian
  rationale: Menerjemahkan verba gerak secara langsung tanpa menambahkan makna khusus yang tidak dinyatakan dalam teks.
theological_decisions:
- issue: Hubungan rencana Paulus dengan kehendak Allah
  choice: oleh kehendak Allah
  alternative: dalam kehendak Allah
  rationale: Pilihan ini menyatakan kehendak Allah sebagai dasar atau sarana penentu bagi kunjungan tersebut, tanpa meniadakan ketidakpastian yang tetap tampak dalam ‘kalau-kalau’.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi dan khidmat. ‘Kalian’ dipakai sebagai bentuk jamak yang jelas bagi ὑμᾶς; tanda koma menjaga alur unsur permohonan, ketidakpastian, dan ketergantungan pada kehendak Allah.
