  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπιποθῶ γὰρ ἰδεῖν ὑμᾶς, ἵνα τι μεταδῶ χάρισμα ὑμῖν πνευματικὸν εἰς τὸ στηριχθῆναι ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/011.yaml
  text: For I long to see you[a], so that I may impart some spiritual gift to you to strengthen you[b],
translation:
  language: id
  text: Sebab aku rindu melihat kalian, supaya aku dapat membagikan kepada kalian suatu karunia rohani untuk meneguhkan kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “supaya kalian diteguhkan.”'
    reason: Bentuk Yunani memakai infinitif pasif dan tidak menyebutkan pelaku peneguhan secara eksplisit.
lexical_decisions:
- source_word: ἐπιποθῶ
  choice: aku rindu
  rationale: Mengungkapkan hasrat pribadi yang kuat dengan bahasa Indonesia modern dan wajar.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelasan dengan konteks sebelumnya.
- source_word: ἰδεῖν ὑμᾶς
  choice: bertemu dengan kalian
  rationale: Secara harfiah berarti 'melihat kalian', tetapi dalam konteks kerinduan Paulus mengunjungi jemaat, 'bertemu dengan kalian' lebih alami tanpa menambahkan gagasan yang asing.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan secara jelas dan idiomatis.
- source_word: τι
  choice: suatu
  rationale: Mempertahankan ketidakpastian ungkapan Yunani tanpa menyiratkan karunia tertentu.
- source_word: μεταδῶ
  choice: membagikan
  rationale: Menunjukkan pemberian yang juga bernuansa berbagi, dan tidak memberi kesan bahwa Paulus adalah sumber utama karunia tersebut.
- source_word: χάρισμα ... πνευματικὸν
  choice: karunia rohani
  rationale: Ungkapan yang alami dan cukup luas untuk mempertahankan ambiguitas antara karunia khusus dan manfaat rohani yang lebih umum.
- source_word: εἰς τὸ στηριχθῆναι ὑμᾶς
  choice: untuk meneguhkan kalian
  rationale: Menyampaikan tujuan atau hasil yang dimaksud secara alami; bentuk pasif Yunani tetap dicatat dalam catatan kaki.
theological_decisions:
- issue: Apakah 'karunia rohani' menunjuk pada karisma ajaib tertentu atau manfaat rohani yang lebih luas
  choice: suatu karunia rohani
  alternative: suatu karunia dari Roh; suatu manfaat rohani berdasarkan anugerah
  rationale: Frasa Yunani tidak mengharuskan arti teknis yang sempit, sehingga terjemahan mempertahankan keluasan dan ketegangan teologisnya.
- issue: Pelaku dalam tindakan meneguhkan
  choice: untuk meneguhkan kalian
  alternative: supaya kalian diteguhkan
  rationale: Rumusan utama lebih alami dalam bahasa Indonesia, tetapi bentuk pasif sumber tidak menentukan pelaku secara eksplisit dan karena itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina 'aku' dan 'kalian' menjaga kedekatan surat Paulus serta menjelaskan bahwa penerimanya jamak. Penanda catatan kaki ditempatkan setelah klausa yang diterangkannya.
