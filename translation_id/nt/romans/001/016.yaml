  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐ γὰρ ἐπαισχύνομαι τὸ ⸀εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/016.yaml
  text: For I am not ashamed of the good news[a], for it is the power of God for salvation to everyone who believes[b], to the Jew first and also to the Greek.
translation:
  language: id
  text: 'Sebab aku tidak malu akan kabar baik[a] itu, karena kabar baik itu adalah kuasa Allah yang membawa keselamatan bagi setiap orang yang percaya: pertama-tama orang Yahudi, dan juga orang Yunani.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "Injil".
    reason: lexical_alternative
  - marker: b
    text: Di sini, "orang Yunani" dapat merujuk secara lebih luas kepada orang bukan Yahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχύνομαι
  choice: tidak malu
  rationale: Ungkapan ini secara alami menyatakan bahwa Paulus tidak merasa malu ataupun mundur karena aib; bentuk ringkasnya mempertahankan ketegasan sikap publiknya.
- source_word: εὐαγγέλιον
  choice: kabar baik
  rationale: Padanan ini menyampaikan arti leksikal secara langsung dalam bahasa Indonesia modern; alternatif tradisional 'Injil' dicatat dalam catatan kaki.
- source_word: δύναμις
  choice: kuasa
  rationale: '''Kuasa'' merupakan padanan yang wajar dan bermartabat serta menyatakan daya penyelamatan Allah yang efektif.'
- source_word: εἰς σωτηρίαν
  choice: yang menyelamatkan
  rationale: Susunan verbal ini terdengar alami dalam bahasa Indonesia dan menyampaikan bahwa kuasa Allah mengarah kepada serta menghasilkan keselamatan, tanpa memakai ungkapan kaku 'untuk keselamatan'.
- source_word: παντὶ τῷ πιστεύοντι
  choice: setiap orang yang percaya
  rationale: Padanan ini mempertahankan cakupan distributif παντί dan daya verbal partisipel πιστεύοντι dengan jelas.
- source_word: Ἰουδαίῳ
  choice: orang Yahudi
  rationale: Dalam kontras sejarah keselamatan dengan Ἕλληνι, sebutan etnis-religius 'orang Yahudi' lebih tepat daripada sebutan geografis.
- source_word: πρῶτον
  choice: pertama-tama
  rationale: Padanan ini mempertahankan urutan atau prioritas yang dinyatakan teks tanpa menjelaskan sifat prioritas tersebut secara berlebihan.
- source_word: Ἕλληνι
  choice: orang Yunani
  rationale: Teks sumber secara leksikal menyebut orang Yunani; cakupannya yang dapat meluas kepada orang bukan Yahudi dijelaskan dalam catatan kaki.
- source_word: τε ... καί
  choice: dan juga
  rationale: Padanan ini menyampaikan penambahan sesudah unsur yang didahulukan dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna Ἕλληνι dalam frasa Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι
  choice: '''orang Yunani'' dalam teks utama, dengan kemungkinan arti yang lebih luas dijelaskan dalam catatan kaki'
  alternative: '''orang bukan Yahudi'' dalam teks utama'
  rationale: Pilihan ini mempertahankan bentuk leksikal teks Yunani sekaligus mengakui bahwa dalam pemakaian Paulus istilah tersebut dapat mewakili bangsa-bangsa bukan Yahudi secara lebih luas.
- issue: Hubungan δύναμις θεοῦ dengan εἰς σωτηρίαν
  choice: '''kuasa Allah yang menyelamatkan'''
  alternative: '''kuasa Allah untuk keselamatan'''
  rationale: Rumusan verbal menyampaikan daya efektif kuasa Allah secara alami dalam bahasa Indonesia, tanpa menentukan lebih jauh mekanisme keselamatan atau mengurangi syarat eksplisit 'setiap orang yang percaya'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam bermartabat dan mudah dipahami. Pengulangan 'kabar baik itu' menghindari rujukan pronominal yang kabur dan memperjelas bahwa kabar baik adalah kuasa Allah yang menyelamatkan. Penanda catatan kaki [a] dan [b] keduanya dicantumkan dalam teks utama.
