  text: Παῦλος δοῦλος ⸂Χριστοῦ Ἰησοῦ⸃, κλητὸς ἀπόστολος, ἀφωρισμένος εἰς εὐαγγέλιον θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/001.yaml
  text: Paul[a], a servant of Messiah Jesus, called as an apostle, set apart for the gospel of God[d][c][b],
translation:
  language: id
  text: Paulus, seorang hamba[a] Mesias Yesus[b], dipanggil sebagai rasul[c], dan dikhususkan bagi Injil Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: budak. Kata Yunani ini menyatakan orang yang berada di bawah kuasa dan menjadi milik seorang tuan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: Kristus Yesus.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara lebih harfiah: seorang rasul yang dipanggil; dapat juga dipahami: dipanggil menjadi rasul.'
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Paulus
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: δοῦλος
  choice: hamba
  rationale: Dalam bahasa Indonesia, “hamba” secara wajar menyatakan kedudukan tunduk dan terikat kepada seorang tuan, sambil mempertahankan ragam yang bermartabat; nuansa yang lebih keras, “budak”, dicatat dalam catatan kaki.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός berfungsi sebagai gelar dan diterjemahkan “Mesias”; urutan unsur Yunani dipertahankan.
- source_word: κλητὸς ἀπόστολος
  choice: dipanggil sebagai rasul
  rationale: Ungkapan ini menyampaikan bahwa kerasulan Paulus berasal dari panggilan, tanpa secara kaku meniru susunan adjektiva-nomina Yunani.
- source_word: ἀφωρισμένος
  choice: dikhususkan
  rationale: Menyampaikan bentuk pasif dan gagasan dipisahkan atau ditetapkan khusus bagi suatu tujuan.
- source_word: εἰς
  choice: bagi
  rationale: Secara ringkas menyatakan arah dan tujuan pengkhususan Paulus.
- source_word: εὐαγγέλιον θεοῦ
  choice: Injil Allah
  rationale: “Injil” merupakan istilah Indonesia yang mapan bagi εὐαγγέλιον, sedangkan konstruksi “Injil Allah” mempertahankan keluasan hubungan genitif Yunani tanpa mempersempitnya menjadi hanya kepemilikan atau asal.
theological_decisions:
- issue: Makna relasi δοῦλος dengan Mesias Yesus
  choice: hamba
  alternative: budak
  rationale: “Hamba” mempertahankan bahasa ketundukan dan kepunyaan dalam ragam Indonesia yang alami. Catatan kaki mempertahankan kemungkinan terjemahan “budak”, yang lebih tegas menonjolkan keterikatan kepada tuan.
- issue: Penerjemahan gelar Χριστός
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Karena Χριστός di sini dapat didengar sebagai gelar, “Mesias” mengungkapkan maknanya. Bentuk gerejawi yang mapan, “Kristus”, tetap diberikan sebagai alternatif.
- issue: Hubungan κλητός dengan ἀπόστολος
  choice: dipanggil sebagai rasul
  alternative: seorang rasul yang dipanggil; dipanggil menjadi rasul
  rationale: Pilihan utama terbaca alami dan tidak menentukan secara berlebihan apakah frasa itu terutama merupakan gelar deskriptif atau menekankan panggilan menuju jabatan rasul.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur tiga keterangan tentang Paulus dipertahankan dengan alur yang alami; kata “dan” sebelum keterangan terakhir memperjelas rangkaian tanpa mengubah hubungan sintaksis. Istilah “Injil Allah” dibiarkan ringkas agar ambiguitas genitif sumber tetap terjaga.
