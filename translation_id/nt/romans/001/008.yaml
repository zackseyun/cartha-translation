id: ROM.1.8
reference: Romans 1:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πρῶτον μὲν εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ ⸀περὶ πάντων ὑμῶν, ὅτι ἡ πίστις ὑμῶν καταγγέλλεται ἐν ὅλῳ τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/008.yaml
  text: First[a], I thank my God through Jesus the Messiah for all of you[b], because your faith is being proclaimed throughout the whole world.
translation:
  language: id
  text: Pertama-tama, aku bersyukur kepada Allahku melalui Yesus Sang Mesias[a] atas kamu semua, sebab imanmu[b] diberitakan di seluruh dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Kristus.'
    reason: alternative_reading
  - marker: b
    text: Kata Yunani yang diterjemahkan “iman” juga dapat berarti “kesetiaan” atau “kepercayaan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρῶτον μὲν
  choice: Pertama-tama
  rationale: Menandai pokok pembuka dalam uraian Paulus. Partikel μὲν tidak perlu diterjemahkan tersendiri karena fungsinya sudah tercakup secara wajar dalam ungkapan Indonesia ini.
- source_word: εὐχαριστῶ
  choice: aku mengucap syukur
  rationale: Mengungkapkan tindakan bersyukur secara langsung, alami, dan tetap mempertahankan nada pribadi Paulus.
- source_word: τῷ θεῷ μου
  choice: kepada Allahku
  rationale: Mempertahankan konstruksi posesif serta nada ibadah Paulus yang pribadi.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: dengan perantaraan Yesus Sang Mesias
  rationale: διά dengan genetif menyatakan sarana atau pengantaraan. Ungkapan ini mempertahankan peran mediasi Yesus, sedangkan Χριστός diterjemahkan sebagai gelar 'Mesias'.
- source_word: περὶ πάντων ὑμῶν
  choice: untuk kamu semua
  rationale: Dalam konteks ucapan syukur, περί paling alami diungkapkan dengan 'untuk', dan πάντων dipertahankan sebagai 'semua'.
- source_word: ἡ πίστις ὑμῶν
  choice: imanmu
  rationale: Iman merupakan padanan utama πίστις dalam konteks tanggapan percaya jemaat Roma; kemungkinan nuansa 'kesetiaan' atau 'kepercayaan' dipertahankan dalam catatan kaki.
- source_word: καταγγέλλεται
  choice: diberitakan
  rationale: Mempertahankan bentuk pasif dan makna penyampaian kabar secara terbuka tanpa menambahkan pelaku yang tidak disebutkan.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: di seluruh dunia
  rationale: Padanan Indonesia yang alami bagi cakupan retoris yang luas dari frasa Yunani tersebut.
theological_decisions:
- issue: Penerjemahan Χριστοῦ dalam διὰ Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: Χριστός merupakan gelar yang berarti 'Yang Diurapi' atau 'Mesias'. Terjemahan utama menyatakan arti gelar itu, sementara bentuk tradisional 'Kristus' dicatat sebagai alternatif.
- issue: Rentang makna πίστις dalam ἡ πίστις ὑμῶν
  choice: imanmu
  alternative: kesetiaanmu; kepercayaanmu
  rationale: Dalam konteks ini 'iman' paling mungkin menunjuk pada tanggapan percaya jemaat Roma, tetapi kata Yunani tersebut juga dapat membawa nuansa kesetiaan atau kepercayaan; ketegangan leksikal itu tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'aku' mempertahankan suara pribadi Paulus; 'kamu semua' menyatakan bentuk jamak dengan jelas. Ungkapan 'dengan perantaraan' dipilih untuk menyampaikan fungsi mediasi διά secara alami dalam ragam Alkitab yang tetap mudah dipahami.
