  source_fidelity: 'Struktur dan relasi utama teks Yunani terwakili dengan baik: γάρ sebagai “Sebab,” bentuk kini pasif ἀποκαλύπτεται sebagai “sedang dinyatakan,” dan ὀργὴ θεοῦ sebagai “murka Allah.” Namun, “kelaliman” lazimnya menunjuk pada kekejaman atau tindakan tiran dan terlalu mempersempit ἀδικία, yang di sini mencakup ketidakbenaran/keburukan moral secara lebih luas. Tambahan “mereka” tidak diperlukan oleh teks Yunani dan dapat dihilangkan tanpa mengurangi kejelasan.'
