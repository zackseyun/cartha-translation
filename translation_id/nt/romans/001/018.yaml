- from: Sebab murka Allah sedang dinyatakan dari surga terhadap segala kefasikan dan kelaliman manusia yang menindas kebenaran dengan kelaliman mereka.[a][b]
  to: Sebab murka Allah sedang dinyatakan dari surga terhadap segala kefasikan dan ketidakbenaran manusia yang menindas kebenaran dengan ketidakbenaran.[a][b]
  rationale: Revisi mengganti “kelaliman” dengan “ketidakbenaran” pada kedua kemunculan untuk mempertahankan cakupan ἀδικία dan pengulangan yang disengaja dalam bahasa Yunani. Kata posesif “mereka” dihapus agar tidak menambahkan unsur yang tidak eksplisit dalam sumber. Catatan alternatif diperbarui agar sesuai dengan teks utama.
