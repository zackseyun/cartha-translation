  - severity: low
    issue: Kata “mereka” dalam “dengan kelaliman mereka” menambahkan unsur posesif yang tidak dinyatakan secara eksplisit.
    rationale: Partisip subjek memang merujuk kepada manusia itu, tetapi teks Yunani hanya berbunyi ἐν ἀδικίᾳ. Bentuk tanpa posesif lebih dekat pada sumber dan tetap alami.
