  terminology: “Kefasikan” tepat untuk ἀσέβεια dan membedakannya dari ἀδικία. “Ketidakbenaran” merupakan padanan yang lebih luas dan setia daripada “kelaliman” untuk kedua kemunculan ἀδικία.
