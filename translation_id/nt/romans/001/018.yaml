id: ROM.1.18
reference: Romans 1:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀποκαλύπτεται γὰρ ὀργὴ θεοῦ ἀπ’ οὐρανοῦ ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν ἀνθρώπων τῶν τὴν ἀλήθειαν ἐν ἀδικίᾳ κατεχόντων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/018.yaml
  text: For the wrath of God is being revealed from heaven against all ungodliness and unrighteousness of people who suppress the truth in unrighteousness[a][b][c][d][e].
translation:
  language: id
  text: Sebab murka Allah sedang dinyatakan dari surga terhadap segala kefasikan dan ketidakbenaran manusia yang menindas kebenaran dengan ketidakbenaran.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dinyatakan”.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang menindas kebenaran dalam ketidakbenaran”; frasa Yunani ini dapat menyatakan sarana, cara, atau lingkup tindakan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκαλύπτεται
  choice: sedang dinyatakan
  rationale: Bentuk kini pasif dipertahankan dengan nuansa proses yang sedang berlangsung; bentuk sederhana tetap mungkin.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai alasan atau dasar bagi pernyataan sebelumnya dan mempertahankan alur argumentasi Paulus.
- source_word: ὀργὴ θεοῦ
  choice: murka Allah
  rationale: Padanan genitif langsung yang mempertahankan daya personal dan yudisial ὀργή.
- source_word: ἀπ’ οὐρανοῦ
  choice: dari surga
  rationale: Menyatakan sumber atau asal surgawi secara lugas.
- source_word: πᾶσαν ἀσέβειαν
  choice: segala kefasikan
  rationale: Kefasikan merupakan padanan Indonesia yang wajar dan bermartabat bagi sikap tidak hormat serta pemberontakan terhadap Allah.
- source_word: ἀδικίαν
  choice: kelaliman
  rationale: Kelaliman mencakup keburukan moral dan ketidakbenaran; pengulangan kata yang sama dipertahankan pada kedua kemunculan ἀδικία.
- source_word: ἀνθρώπων
  choice: manusia
  rationale: Mengacu kepada manusia secara umum, bukan khusus laki-laki.
- source_word: τῶν ... κατεχόντων
  choice: yang menindas
  rationale: Dalam konteks ini κατέχω berarti menahan, mengekang, atau menghambat kebenaran; 'menindas' menyampaikan tindakan aktif tersebut secara alami.
- source_word: τὴν ἀλήθειαν
  choice: kebenaran
  rationale: Padanan langsung tanpa mempersempit cakupan istilah.
- source_word: ἐν ἀδικίᾳ
  choice: dengan kelaliman mereka
  rationale: ἐν dapat menyatakan sarana atau cara; kata 'mereka' membuat hubungan dengan para pelaku jelas dalam bahasa Indonesia, sementara kemungkinan makna lingkup dipertahankan dalam catatan.
theological_decisions:
- issue: Apakah ὀργὴ θεοῦ perlu dilunakkan menjadi akibat moral yang impersonal
  choice: murka Allah sebagai tanggapan Allah sendiri yang bersifat menghakimi
  alternative: proses akibat moral yang impersonal
  rationale: Konstruksi Yunani dan argumen Paulus menunjuk kepada tanggapan ilahi yang personal; terjemahan mempertahankan bobot ini tanpa menambahkan penjelasan doktrinal.
- issue: Hubungan ἐν ἀδικίᾳ dengan tindakan menindas kebenaran
  choice: 'sarana atau cara: ''dengan kelaliman mereka'''
  alternative: 'lingkup atau keadaan: ''dalam kelaliman'''
  rationale: Keduanya dimungkinkan secara gramatikal. Teks utama memakai hubungan sarana yang alami dalam bahasa Indonesia, sedangkan alternatif yang sungguh mungkin dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Sebab' menjaga hubungan logis dengan ayat sebelumnya. Pengulangan 'kelaliman' sengaja dipertahankan karena mencerminkan pengulangan ἀδικία dalam teks Yunani. Istilah 'manusia' bersifat generik dan inklusif.
