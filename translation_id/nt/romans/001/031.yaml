  text: ἀσυνέτους, ἀσυνθέτους, ⸀ἀστόργους, ἀνελεήμονας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/031.yaml
  text: senseless[a], faithless, heartless[b], merciless.
translation:
  language: id
  text: tidak berpengertian, tidak menepati janji[a], tidak memiliki kasih sayang terhadap keluarga[b], tidak berbelas kasihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak dapat dipercaya” atau “melanggar perjanjian.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya kemungkinan besar tidak memiliki kasih sayang alami yang semestinya ada di antara anggota keluarga.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσυνέτους
  choice: tidak berpengertian
  rationale: Kata ini menunjukkan ketiadaan pengertian atau daya membedakan secara moral, bukan sekadar rendahnya kecerdasan. Ungkapan ini alami dan mempertahankan unsur intelektual-moralnya.
- source_word: ἀσυνθέτους
  choice: tidak menepati janji
  rationale: Kata ini menggambarkan orang yang tidak berpegang pada kesepakatan atau ikatan yang telah dibuat. Pilihan ini lebih konkret dalam bahasa Indonesia modern daripada 'tidak setia' dan tidak mempersempit maknanya hanya pada perjanjian formal.
- source_word: ἀστόργους
  choice: tidak memiliki kasih sayang terhadap keluarga
  rationale: Kata ini meniadakan kasih sayang alami, khususnya kasih dalam hubungan keluarga. Terjemahan eksplisit diperlukan karena padanan ringkas seperti 'tidak berperasaan' dapat kehilangan nuansa kekeluargaan.
- source_word: ἀνελεήμονας
  choice: tidak berbelaskasihan
  rationale: Kata ini berarti tidak memiliki belas kasihan atau kemurahan hati terhadap orang lain. Bentuk ini jelas, wajar, dan sesuai dengan gaya daftar sifat buruk.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Struktur paralel 'tidak...' dipakai untuk mempertahankan irama daftar sifat buruk dalam bahasa Yunani. Penanda catatan kaki [a] dan [b] ditempatkan langsung setelah frasa terkait.
