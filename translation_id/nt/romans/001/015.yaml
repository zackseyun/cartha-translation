  yaml_path: translation/nt/romans/001/015.yaml
  text: So[a], for my part, I am eager to proclaim the good news also to you who are in Rome.
translation:
  language: id
  text: Karena itu, saya sendiri sangat ingin memberitakan kabar baik juga kepada kalian yang di Roma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memberitakan Injil juga kepada kalian yang di Roma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Karena itu
  rationale: Dalam konteks ini kata tersebut menyimpulkan penjelasan Paulus sebelumnya dan mengantar kepada pernyataan niatnya; “Karena itu” menyatakan hubungan inferensial itu secara alami.
- source_word: τὸ κατ’ ἐμὲ πρόθυμον
  choice: dari pihak saya, saya bersemangat
  rationale: Ungkapan Yunani ini eliptis dan harfiahnya kurang wajar dalam bahasa Indonesia. Pilihan ini mempertahankan gagasan kesiapsediaan yang disertai kemauan kuat, bukan sekadar keadaan siap.
- source_word: καὶ ὑμῖν
  choice: juga kepada kalian
  rationale: Penempatan καί menyertakan para penerima di Roma bersama tempat atau orang lain yang hendak dijangkau Paulus. “Juga kepada kalian” mempertahankan penekanan tersebut.
- source_word: τοῖς ἐν Ῥώμῃ
  choice: yang berada di Roma
  rationale: Frasa ini mengidentifikasi para penerima yang sedang berada di Roma dan mengikuti “kalian” dengan lancar.
- source_word: εὐαγγελίσασθαι
  choice: untuk memberitakan kabar baik
  rationale: Kata kerja ini berarti mengumumkan kabar baik atau Injil. “Memberitakan kabar baik” jelas bagi pembaca modern dan tidak membatasi tindakan itu pada khotbah formal.
