id: ROM.1.25
reference: Romans 1:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει, καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/025.yaml
  text: who exchanged the truth of God for the lie, and revered and served the creation rather than the Creator, who is blessed forever. Amen.
translation:
  language: id
  text: Mereka menukar kebenaran Allah dengan dusta, serta memuja dan mengabdi kepada ciptaan, alih-alih kepada Sang Pencipta, yang terpuji selama-lamanya. Amin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: Mereka
  rationale: Merujuk kembali kepada orang-orang yang dibicarakan sebelumnya; pronomina ini alami dalam bahasa Indonesia.
- source_word: μετήλλαξαν
  choice: menukar
  rationale: Menyampaikan tindakan mengganti sesuatu dengan sesuatu yang lain, sesuai konstruksi Yunani.
- source_word: τὴν ἀλήθειαν τοῦ θεοῦ
  choice: kebenaran Allah
  rationale: Mempertahankan bentuk genitif yang dapat menunjuk pada kebenaran tentang Allah atau kebenaran yang berasal dari/milik Allah tanpa mempersempitnya.
- source_word: ἐν τῷ ψεύδει
  choice: dengan dusta
  rationale: Dalam konstruksi bersama verba 'menukar', preposisi ἐν menyatakan penggantian; artikel Yunani tidak harus dipaksakan menjadi 'dusta itu' dalam bahasa Indonesia.
- source_word: ἐσεβάσθησαν
  choice: memuja
  rationale: Menyatakan penghormatan religius kepada ciptaan dan tetap dibedakan dari tindakan mengabdi dalam verba berikutnya.
- source_word: ἐλάτρευσαν
  choice: mengabdi kepada
  rationale: Mengungkapkan pelayanan atau ibadah religius yang ditujukan kepada ciptaan.
- source_word: τῇ κτίσει
  choice: ciptaan
  rationale: Nomina kolektif tunggal mencakup segala yang diciptakan.
- source_word: παρὰ τὸν κτίσαντα
  choice: bukan kepada Sang Pencipta
  rationale: Dalam konteks kontras, παρά paling alami menyatakan bahwa ciptaan dijadikan sasaran penghormatan dan pengabdian sebagai ganti Pencipta.
- source_word: εὐλογητὸς εἰς τοὺς αἰῶνας
  choice: terpuji selama-lamanya
  rationale: Formula doksologis yang menyatakan bahwa Pencipta patut dipuji untuk selama-lamanya.
- source_word: ἀμήν
  choice: Amin
  rationale: Transliterasi liturgis yang sudah lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Arti genitif dalam 'kebenaran Allah'
  choice: Mempertahankan frasa 'kebenaran Allah'
  alternative: kebenaran tentang Allah
  rationale: Bahasa sumber tidak secara eksplisit membatasi genitif pada arti objektif; terjemahan ini menjaga keluasannya.
- issue: Kekuatan kontras παρά
  choice: bukan kepada Sang Pencipta
  alternative: lebih daripada Sang Pencipta
  rationale: Konteks pertukaran dan penyembahan berhala menunjukkan pengalihan kepada ciptaan, bukan sekadar perbandingan tingkat, tetapi tanpa menambah penjelasan teologis di luar teks.
- issue: Pembedaan dua verba religius
  choice: memuja dan mengabdi kepada
  alternative: menghormati dan beribadah kepada
  rationale: 'Pilihan ini menjaga dua tindakan yang berdekatan namun berbeda: penghormatan religius dan pelayanan kultis.'
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Kapitalisasi 'Sang Pencipta' menandai gelar yang merujuk kepada Allah. Tidak diperlukan catatan kaki karena ambiguitas utama dapat dipertahankan dalam teks utama.
