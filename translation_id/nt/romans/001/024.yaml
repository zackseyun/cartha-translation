  source_fidelity: Terjemahan mempertahankan hubungan inferensial Διὸ, tindakan ilahi παρέδωκεν, ranah “keinginan hati mereka,” serta arah εἰς ἀκαθαρσίαν. Namun, “direndahkan” terlalu mudah dipahami sebagai dibuat lebih rendah statusnya dan kurang langsung menyampaikan ἀτιμάζεσθαι, yaitu diperlakukan secara tidak terhormat/dipermalukan. “Dipermalukan” lebih tepat dalam bahasa Indonesia modern tanpa menambahkan pelaku atau penafsiran doktrinal.
  naturalness: Susunan kalimat dan register sudah baku serta mudah dipahami. “Tubuh mereka dipermalukan” terdengar lebih idiomatis dan lebih spesifik daripada “tubuh mereka direndahkan.”
  terminology: “Allah menyerahkan mereka,” “keinginan hati mereka,” dan “kecemaran” dapat dipertahankan. “Dipermalukan” membedakan ἀτιμάζεσθαι dari ἀκαθαρσίαν, sehingga dua istilah Yunani tersebut tidak dilebur menjadi satu gagasan “kecemaran.”
