id: ROM.1.24
reference: Romans 1:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν ⸀αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/024.yaml
  text: Therefore God gave them over in the desires of their hearts to impurity[a], for the dishonoring of their bodies among themselves.
translation:
  language: id
  text: Karena itu, Allah menyerahkan mereka, dalam keinginan hati mereka, kepada kecemaran, sehingga tubuh mereka dipermalukan di antara mereka sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antara mereka”; mungkin “dalam diri mereka sendiri.”
    reason: Frasa ἐν αὐτοῖς dapat dipahami secara sosial/timbal balik atau secara internal; bentuk Yunani tidak sepenuhnya menentukan pilihannya.
lexical_decisions:
- source_word: Διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan dari uraian sebelumnya dan mempertahankan hubungan logis secara alami dalam bahasa Indonesia.
- source_word: παρέδωκεν
  choice: menyerahkan
  rationale: Menyampaikan tindakan Allah membiarkan atau menyerahkan mereka kepada kuasa atau keadaan tertentu, tanpa menambahkan tafsiran seperti 'meninggalkan' atau 'menghukum'.
- source_word: ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν
  choice: dalam keinginan hati mereka
  rationale: Mempertahankan gambaran hati dan kemungkinan bahwa frasa ini menunjukkan ranah atau keadaan tempat penyerahan itu berlangsung.
- source_word: ἐπιθυμίαις
  choice: keinginan
  rationale: Cukup luas untuk mencerminkan istilah Yunani tanpa sejak awal membatasinya pada nafsu seksual.
- source_word: καρδιῶν
  choice: hati
  rationale: Mempertahankan antropologi biblis sumber dan tetap wajar bagi pembaca Indonesia masa kini.
- source_word: εἰς ἀκαθαρσίαν
  choice: kepada kecemaran
  rationale: Mencerminkan arah atau hasil penyerahan dan menyampaikan kenajisan moral dengan bahasa yang dignified serta mudah dipahami.
- source_word: τοῦ ἀτιμάζεσθαι
  choice: sehingga ... direndahkan
  rationale: Mengungkapkan akibat dari penyerahan secara alami; bentuk pasif dipertahankan, sedangkan hubungan tepat antara tujuan dan hasil tidak diperkeras secara doktrinal.
- source_word: τὰ σώματα αὐτῶν
  choice: tubuh mereka
  rationale: Menerjemahkan secara konkret dan mempertahankan penekanan Paulus pada tubuh.
- source_word: ἐν αὐτοῖς
  choice: di antara mereka sendiri
  rationale: Mencerminkan kemungkinan makna timbal balik atau sosial dalam konteks, sambil mengakui bahwa frasa Yunani ini ringkas dan dapat dipahami dengan cara lain.
theological_decisions:
- issue: Apakah παρέδωκεν perlu diperjelas sebagai tindakan penghakiman atau penelantaran ilahi
  choice: Allah menyerahkan mereka
  alternative: Allah meninggalkan mereka; Allah menghukum mereka dengan menyerahkan mereka
  rationale: Kata sumber menyatakan tindakan penyerahan ilahi dengan bobot yang kuat, tetapi tidak sendiri menguraikan seluruh mekanisme penghakiman. Terjemahan tidak menambahkan rumusan doktrinal yang lebih eksplisit.
- issue: Hubungan τοῦ ἀτιμάζεσθαι sebagai tujuan atau hasil
  choice: sehingga tubuh mereka direndahkan
  alternative: untuk merendahkan tubuh mereka; yang mengakibatkan tubuh mereka direndahkan
  rationale: Konstruksi ini dapat bernuansa tujuan atau hasil. 'Sehingga' menghasilkan bahasa Indonesia yang alami sambil tidak memaksakan maksud kausal yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan koma mempertahankan keterkaitan frasa Yunani tanpa membuat kalimat terlalu kaku. Penanda catatan kaki ditempatkan setelah klausa yang memuat frasa ambigu.
