  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μάρτυς γάρ μού ἐστιν ὁ θεός, ᾧ λατρεύω ἐν τῷ πνεύματί μου ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ, ὡς ἀδιαλείπτως μνείαν ὑμῶν ποιοῦμαι
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/009.yaml
  text: For God[a], whom I serve in my spirit in the good news of his Son[d][c][b], is my witness that I continually mention you.
translation:
  language: id
  text: Sebab Allah, yang kulayani dalam rohku, dalam Kabar Baik Anak-Nya, adalah saksiku bahwa aku terus-menerus menyebut kalian[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “aku membuat penyebutan tentang kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυς
  choice: saksi
  rationale: Dalam seruan bernuansa sumpah ini, Allah disebut sebagai pihak yang menyaksikan kebenaran pernyataan Paulus; “saksi” merupakan padanan Indonesia yang langsung dan alami.
- source_word: λατρεύω
  choice: melayani
  rationale: Kata ini menunjuk pada pelayanan yang bersifat ibadah kepada Allah. “Melayani” mempertahankan gagasan pengabdian religius tanpa mempersempitnya menjadi satu tindakan ibadah tertentu.
- source_word: ἐν τῷ πνεύματί μου
  choice: dalam rohku
  rationale: Terjemahan ini mempertahankan bentuk ἐν dan ambiguitas apakah frasa tersebut menekankan ranah batin atau cara Paulus melayani.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ
  choice: melalui Kabar Baik tentang Anak-Nya
  rationale: “Melalui” menyampaikan fungsi frasa sebagai lingkup atau sarana pelayanan Paulus, sedangkan “tentang Anak-Nya” mengungkapkan secara alami bahwa Anak adalah isi Kabar Baik, sambil mengakui bahwa genitif Yunani dapat dipahami lebih luas.
- source_word: ἀδιαλείπτως
  choice: terus-menerus
  rationale: Padanan ini menyatakan kesinambungan atau keteraturan yang tidak putus dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: μνείαν ὑμῶν ποιοῦμαι
  choice: aku menyebut kalian
  rationale: Idiom ini secara harfiah berarti “membuat penyebutan tentang kalian.” “Menyebut kalian” menyampaikan maknanya dengan wajar tanpa menambahkan objek tersirat seperti doa.
theological_decisions:
- issue: Makna ἐν τῷ πνεύματί μου dalam pelayanan Paulus
  choice: dalam rohku
  alternative: dengan segenap batinku
  rationale: “Dalam rohku” mempertahankan istilah πνεῦμα dan ketegangan antara roh manusia sebagai ranah batin dan roh sebagai sarana pelayanan, tanpa memasukkan penafsiran eksplisit tentang Roh Kudus.
- issue: Hubungan genitif τοῦ υἱοῦ αὐτοῦ dengan εὐαγγελίῳ
  choice: Kabar Baik tentang Anak-Nya
  alternative: Kabar Baik milik Anak-Nya
  rationale: Genitif dapat menyatakan isi, sumber, atau kepemilikan. Dalam konteks Roma 1:1–4, Anak merupakan isi utama Kabar Baik; “tentang” alami dalam bahasa Indonesia, tetapi alternatif tetap dicatat karena bentuk Yunani tidak menyatakannya secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina “aku/kalian” dipakai agar hubungan tunggal-jamak Yunani tetap jelas. “Kabar Baik” dipakai sebagai padanan transparan bagi εὐαγγέλιον; kapitalisasi menandai kabar khusus mengenai Anak Allah.
