  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/032.yaml
  text: who[a], although they know God's righteous decree—that those who practice such things are worthy of death—not only do them but also approve of those who practice them.
translation:
  language: id
  text: Mereka, walaupun mengetahui ketetapan Allah yang adil[a]—bahwa orang-orang yang melakukan hal-hal demikian patut mati—bukan saja melakukannya, melainkan juga menyetujui perbuatan mereka yang melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “peraturan,” “tuntutan,” atau “putusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Mereka
  rationale: Kata ganti relatif ini melanjutkan gambaran tentang orang-orang yang dibicarakan dalam konteks sebelumnya. Dalam bahasa Indonesia, kalimat mandiri paling alami diawali dengan “Mereka” sambil tetap mempertahankan kesinambungan tersebut.
- source_word: δικαίωμα τοῦ θεοῦ
  choice: ketetapan Allah yang adil
  rationale: δικαίωμα di sini menunjuk pada ketetapan atau putusan moral-yuridis Allah, sebagaimana dijelaskan oleh klausa berikutnya. Ungkapan ini mempertahankan unsur keadilan dan kewibawaan ilahi.
- source_word: ἐπιγνόντες
  choice: walaupun mengetahui
  rationale: 'Partisip ini dipahami secara konsesif dalam konteks: mereka tetap bertindak demikian meskipun mengetahui ketetapan Allah.'
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: orang-orang yang melakukan hal-hal demikian
  rationale: Terjemahan ini alami dalam bahasa Indonesia dan menyampaikan perilaku yang menjadi ciri mereka tanpa membatasinya pada satu tindakan saja.
- source_word: ἄξιοι θανάτου
  choice: patut mati
  rationale: Ungkapan ini mempertahankan daya yuridis pernyataan Yunani, tetapi tidak mempersempit “kematian” menjadi hukuman sipil atau menentukan cakupan teologisnya.
- source_word: ποιοῦσιν
  choice: melakukannya
  rationale: Bentuk ini merujuk kembali secara alami pada “hal-hal demikian” dan mempertahankan pembedaan verbal dari πράσσω sejauh dimungkinkan dalam bahasa Indonesia.
- source_word: συνευδοκοῦσιν
  choice: menyetujui
  rationale: Kata ini menyatakan persetujuan atau pembenaran terhadap tindakan orang lain, bukan sekadar kebersamaan atau keterlibatan pasif.
- source_word: τοῖς πράσσουσιν
  choice: orang-orang yang melakukannya
  rationale: Terjemahan ini mempertahankan bahwa objek persetujuan secara gramatikal adalah para pelaku, sekaligus menggemakan frasa sebelumnya.
theological_decisions:
- issue: Makna “patut mati”
  choice: Diterjemahkan sebagai putusan ilahi bahwa para pelaku patut mati, tanpa menjelaskan jenis atau cakupan kematian itu lebih lanjut.
  alternative: Menafsirkannya secara khusus sebagai hukuman mati oleh pemerintah sipil atau secara khusus sebagai kematian eskatologis.
  rationale: Ayat ini menyatakan kelayakan menerima kematian, tetapi tidak dengan sendirinya menentukan apakah yang dimaksud terutama hukuman sipil, kematian jasmani, atau kematian dalam cakupan eskatologis. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur konsesif “walaupun mengetahui” membuat pertentangan logis ayat jelas, sedangkan tanda pisah mengapit penjelasan isi ketetapan Allah. Pengulangan “melakukannya” dipertahankan untuk mencerminkan paralelisme sumber.
