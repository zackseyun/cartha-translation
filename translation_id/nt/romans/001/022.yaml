  yaml_path: translation/nt/romans/001/022.yaml
  text: Claiming to be wise[a], they became fools[b],
translation:
  language: id
  text: Sambil mengaku diri bijaksana[a], mereka menjadi bodoh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sambil menyatakan bahwa mereka bijaksana.”
    reason: lexical_alternative
  - marker: b
    text: Atau “mereka dibuat bodoh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φάσκοντες
  choice: Dengan mengaku diri
  rationale: Partisipel kini ini menyatakan klaim tentang diri sendiri. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nada ironis tanpa menambah isi.
- source_word: εἶναι
  choice: diri
  rationale: Gagasan infinitif yang melengkapi φάσκοντες tercakup secara alami dalam konstruksi Indonesia 'mengaku diri bijaksana'.
- source_word: σοφοὶ
  choice: bijaksana
  rationale: Adjektiva predikatif diterjemahkan secara langsung dan ringkas, dengan tetap mempertahankan penilaian serta kontras retorisnya.
- source_word: ἐμωράνθησαν
  choice: mereka menjadi bodoh
  rationale: 'Bentuk ini paling wajar dipahami sebagai hasil ingresif: mereka menjadi bodoh. Terjemahan tersebut mempertahankan ironi tajam dan tidak memaksakan gagasan bahwa ada pelaku luar yang membuat mereka bodoh.'
theological_decisions:
- issue: Apakah ἐμωράνθησαν menyatakan perubahan menjadi bodoh atau tindakan pasif 'dibuat bodoh'
  choice: mereka menjadi bodoh
  alternative: mereka dibuat bodoh
  rationale: Bentuk Yunani memungkinkan nuansa pasif atau intransitif, tetapi dalam konteks antitesis Paulus, hasil ingresif paling alami. Pilihan ini mempertahankan ketegangan tanpa menentukan adanya pelaku yang tidak disebutkan.
- issue: Apakah kontras retoris harus diterjemahkan sebagai sebutan personal 'orang bodoh' atau sifat 'bodoh'
  choice: menjadi bodoh
  alternative: menjadi orang bodoh
  rationale: Bahasa Indonesia memakai 'menjadi bodoh' secara alami dan tajam. Bentuk ini mempertahankan kontras dengan 'bijaksana' serta menghindari penambahan nomina yang tidak eksplisit dalam bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan bernada tegas. 'Mengaku diri' menyampaikan klaim tentang diri sendiri, sedangkan 'menjadi bodoh' mempertahankan antitesis dan ironi teks Yunani.
