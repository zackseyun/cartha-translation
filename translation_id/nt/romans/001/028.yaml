  text: Καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/028.yaml
  text: And just as they did not see fit to have God in their knowledge[a], God gave them over to a debased mind, to do what is not fitting[b],
translation:
  language: id
  text: Dan karena mereka tidak menganggap layak untuk mengakui Allah[a], Allah menyerahkan mereka kepada pikiran yang tidak layak[b], sehingga mereka melakukan hal-hal yang tidak pantas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk mempertahankan Allah dalam pengenalan mereka.”
    reason: lexical_alternative
  - marker: b
    text: “Tidak layak” menerjemahkan kata yang berhubungan dengan “menganggap layak” sebelumnya dan mempertahankan permainan kata Paulus. Atau, “pikiran yang bobrok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: sebagaimana
  rationale: Kata ini mempertahankan hubungan kesepadanan antara penolakan manusia dan tindakan penghakiman Allah; konteks juga memungkinkan adanya nuansa sebab-akibat tanpa harus menuliskannya secara eksplisit sebagai “karena”.
- source_word: ἐδοκίμασαν
  choice: tidak menganggap layak
  rationale: Ungkapan ini menyampaikan tindakan menilai lalu tidak menyetujui atau tidak menganggap sesuatu patut, sekaligus memungkinkan gema leksikal dengan ἀδόκιμον.
- source_word: ἔχειν ἐν ἐπιγνώσει
  choice: untuk mengakui Allah
  rationale: Dalam konteks ini, frasa tersebut menunjuk pada pengenalan yang disertai pengakuan terhadap Allah. Bentuk idiomatis ini lebih alami dalam bahasa Indonesia, sementara kemungkinan arti mempertahankan Allah dalam pengenalan dicatat dalam catatan kaki.
- source_word: παρέδωκεν
  choice: menyerahkan mereka
  rationale: Pilihan ini mempertahankan tindakan aktif Allah dalam penghakiman dan selaras dengan pengulangan verba yang sama dalam konteks Roma 1.
- source_word: ἀδόκιμον νοῦν
  choice: pikiran yang tidak layak
  rationale: “Tidak layak” mempertahankan hubungan kata dengan “menganggap layak” sebelumnya dan tidak memasukkan istilah teologis yang lebih berat seperti “bejat” atau “terkutuk”.
- source_word: ποιεῖν
  choice: sehingga mereka melakukan
  rationale: Infinitif ini dapat menyatakan hasil atau tujuan dari tindakan menyerahkan; “sehingga” menghasilkan kalimat Indonesia yang alami tanpa menutup sepenuhnya hubungan tujuan-hasil tersebut.
- source_word: τὰ μὴ καθήκοντα
  choice: hal-hal yang tidak pantas
  rationale: Ungkapan ini menyampaikan tindakan yang tidak semestinya atau tidak sesuai secara moral dalam bahasa Indonesia modern dan wajar.
theological_decisions:
- issue: Apakah ἀδόκιμον νοῦν perlu diperkuat menjadi istilah doktrinal seperti “pikiran bejat” atau “pikiran terkutuk”.
  choice: pikiran yang tidak layak
  alternative: pikiran yang bobrok
  rationale: Teks menggambarkan tindakan penghakiman Allah, tetapi ἀδόκιμος pada dirinya sendiri berarti tidak tahan uji atau tidak mendapat persetujuan. “Tidak layak” menjaga permainan kata dengan ἐδοκίμασαν tanpa menambahkan kategori doktrinal yang lebih khusus.
- issue: Apakah καθὼς harus diterjemahkan secara kausal sebagai “karena”.
  choice: sebagaimana
  alternative: karena
  rationale: “Sebagaimana” mempertahankan bentuk perbandingan atau korespondensi dalam bahasa Yunani, sementara hubungan sebab-akibat tetap dapat dipahami dari konteks.
- issue: Apakah ἔχειν ἐν ἐπιγνώσει hanya berarti mengetahui secara kognitif atau juga mengakui Allah.
  choice: mengakui Allah
  alternative: mempertahankan Allah dalam pengenalan mereka
  rationale: Konteks menekankan penolakan yang disengaja, sehingga “mengakui” menyampaikan dimensi relasional dan volisional. Namun, bentuk Yunani yang lebih harfiah tetap dicatat agar ambiguitas tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan kalimat mempertahankan korespondensi retoris dan permainan kata dalam teks Yunani, sedangkan catatan kaki menampung terjemahan yang lebih harfiah dan alternatif leksikal.
