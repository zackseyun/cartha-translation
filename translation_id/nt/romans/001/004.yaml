id: ROM.1.4
reference: Romans 1:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦ ὁρισθέντος υἱοῦ θεοῦ ἐν δυνάμει κατὰ πνεῦμα ἁγιωσύνης ἐξ ἀναστάσεως νεκρῶν, Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/004.yaml
  text: and who was declared to be the Son of God in power according to the Spirit of holiness by the resurrection from the dead—Jesus the Messiah our Lord[b][a],
translation:
  language: id
  text: dan yang dinyatakan sebagai Anak Allah dalam kuasa menurut Roh kekudusan melalui kebangkitan dari antara orang mati—Yesus sang Mesias, Tuhan kita.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ditetapkan” atau “ditentukan” sebagai Anak Allah dalam kuasa.
    reason: lexical_alternative
  - marker: b
    text: Atau “menurut Roh Kudus.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁρισθέντος
  choice: dinyatakan sebagai
  rationale: Bentuk partisip ὁρίζω dapat berarti menentukan, menetapkan, atau menyatakan. Dalam konteks ini, “dinyatakan sebagai” menyampaikan bahwa kebangkitan menandai atau memperlihatkan status Yesus sebagai Anak Allah dalam kuasa, tanpa mengharuskan pengertian bahwa Ia baru menjadi Anak Allah saat itu; alternatif penting dipertahankan dalam catatan kaki.
- source_word: υἱοῦ θεοῦ
  choice: Anak Allah
  rationale: Padanan langsung dan lazim bagi gelar kristologis ini.
- source_word: ἐν δυνάμει
  choice: dalam kuasa
  rationale: Terjemahan dekat yang mempertahankan kemungkinan bahwa frasa ini menerangkan keadaan atau corak keberadaan-Nya sebagai Anak Allah, bukan sekadar cara deklarasi itu dilakukan.
- source_word: κατὰ πνεῦμα ἁγιωσύνης
  choice: menurut Roh kekudusan
  rationale: Terjemahan transparan ini mempertahankan ungkapan Yunani yang tidak lazim dan tidak memastikan secara berlebihan apakah yang dimaksud adalah Roh Kudus atau ranah/corak rohani yang kudus.
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: melalui kebangkitan dari antara orang mati
  rationale: “Melalui” menyatakan sarana atau dasar penandaan tersebut, sedangkan “dari antara orang mati” mempertahankan nuansa ἐξ dan bentuk jamak νεκρῶν dengan bahasa Indonesia yang dapat dipahami.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus sang Mesias
  rationale: Χριστός diperlakukan sebagai gelar dan diterjemahkan “Mesias”; “sang” membuat bentuk gelar itu alami dalam bahasa Indonesia.
- source_word: κυρίου ἡμῶν
  choice: Tuhan kita
  rationale: Padanan baku yang mempertahankan bobot kristologis κύριος dalam pemakaian Paulus.
theological_decisions:
- issue: Apakah ὁρισθέντος menyiratkan bahwa Yesus baru menjadi Anak Allah pada kebangkitan
  choice: Teks utama memakai “dinyatakan sebagai Anak Allah dalam kuasa,” yang tidak menyatakan bahwa status ke-Anak-an itu baru dimulai pada kebangkitan.
  alternative: “ditetapkan sebagai Anak Allah dalam kuasa” atau “ditentukan sebagai Anak Allah dalam kuasa”
  rationale: Bahasa Yunani dapat menunjuk pada penetapan atau penandaan. Terjemahan mempertahankan kaitan dengan kebangkitan dan frasa “dalam kuasa” sambil menghindari penyelesaian dogmatis yang melampaui teks.
- issue: Apakah πνεῦμα ἁγιωσύνης secara khusus menunjuk kepada Roh Kudus
  choice: Teks utama memakai ungkapan harfiah “Roh kekudusan” dan membiarkan rujukan persisnya tetap terbuka.
  alternative: “Roh Kudus” atau “roh-Nya yang kudus”
  rationale: Ungkapan Yunani ini tidak lazim dan mungkin sengaja berpadanan dengan “menurut daging” dalam ayat 3. Catatan kaki menyajikan pembacaan utama lainnya tanpa memaksakannya ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan tetap dekat dengan struktur Yunani karena ayat ini melanjutkan kalimat dari ayat sebelumnya. Huruf kapital pada “Roh” dipakai karena rujukan kepada Roh Kudus cukup mungkin, tetapi ungkapan tidak dinormalkan menjadi “Roh Kudus” agar ambiguitas sumber tetap terjaga.
