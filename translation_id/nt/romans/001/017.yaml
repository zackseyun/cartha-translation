  text: δικαιοσύνη γὰρ θεοῦ ἐν αὐτῷ ἀποκαλύπτεται ἐκ πίστεως εἰς πίστιν, καθὼς γέγραπται· Ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/017.yaml
  text: 'For in it the righteousness of God is revealed from faith to faith[d][c][b][a], just as it is written: “The righteous one shall live by faith.”'
translation:
  language: id
  text: 'Sebab di dalam Injil itu kebenaran Allah[a] dinyatakan dari iman kepada iman,[b] seperti ada tertulis: “Orang benar akan hidup oleh iman.”[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan Allah.” Ungkapan Yunani juga dapat dipahami sebagai “kebenaran yang berasal dari Allah.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Yunani yang diterjemahkan “dari iman kepada iman” sulit dipastikan maksudnya. Kemungkinan lain mencakup “dari iman untuk iman,” “oleh iman dari awal sampai akhir,” atau “melalui iman, untuk iman.”
    reason: alternative_reading
  - marker: c
    text: Atau “orang yang benar oleh iman akan hidup.”
    reason: alternative_reading
  - marker: d
    text: 'Alternatif yang menerjemahkan partikel Yunani δέ secara eksplisit: “Tetapi orang benar akan hidup oleh iman.”'
    reason: previous_rendering
lexical_decisions:
- source_word: δικαιοσύνη
  choice: kebenaran
  rationale: Dalam bahasa Indonesia Alkitabiah, “kebenaran” merupakan padanan yang paling wajar dan mencakup dimensi keadaan benar serta tindakan Allah yang benar; alternatif “keadilan” dicatat agar nuansa yudisial tidak hilang.
- source_word: θεοῦ
  choice: Allah
  rationale: Konstruksi “kebenaran Allah” mempertahankan hubungan genitif Yunani tanpa menentukan apakah yang dimaksud terutama sifat Allah, tindakan-Nya, atau kebenaran yang berasal dari-Nya.
- source_word: ἐν αὐτῷ
  choice: di dalam Injil itu
  rationale: Pronomina Yunani berjenis netral dan paling alami merujuk kepada Injil pada Roma 1:16. Mengulangi acuannya lebih jelas dan alami daripada “di dalamnya” dalam bahasa Indonesia.
- source_word: ἀποκαλύπτεται
  choice: nyata
  rationale: “Nyata” mengungkapkan bentuk pasif ‘dinyatakan/disingkapkan’ secara alami dan ringkas dalam bahasa Indonesia, tanpa menambahkan pelaku atau membatasi aspek verba kini.
- source_word: ἐκ πίστεως εἰς πίστιν
  choice: dari iman kepada iman
  rationale: Padanan ini mempertahankan kedua preposisi dan pengulangan πίστις, sehingga ketaksaan ungkapan Yunani tidak diselesaikan secara sepihak.
- source_word: δίκαιος
  choice: orang benar
  rationale: Adjektiva substantival tunggal diterjemahkan dengan ungkapan Indonesia yang alami dan representatif tanpa menambahkan penanda gender yang tidak diperlukan.
- source_word: ἐκ πίστεως
  choice: oleh iman
  rationale: Dalam kutipan Habakuk, “oleh iman” merupakan ungkapan Indonesia yang alami dan tetap memungkinkan nuansa dasar, sarana, atau cara.
- source_word: ζήσεται
  choice: akan hidup
  rationale: Padanan ini mempertahankan bentuk futurum secara jelas dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna δικαιοσύνη θεοῦ
  choice: kebenaran Allah
  alternative: keadilan Allah; kebenaran yang berasal dari Allah
  rationale: Genitif Yunani mengandung ketaksaan teologis yang nyata. Teks utama mempertahankan konstruksi terbuka dan tradisional, sementara alternatif dijelaskan dalam catatan.
- issue: Makna ἐκ πίστεως εἰς πίστιν
  choice: dari iman kepada iman
  alternative: dari iman untuk iman; oleh iman dari awal sampai akhir; melalui iman, menuju iman
  rationale: Ungkapan ini merupakan persoalan tafsir terkenal. Terjemahan utama mempertahankan preposisi dan repetisi Yunani tanpa menetapkan satu penjelasan mengenai gerak atau relasi iman tersebut.
- issue: Keterikatan ἐκ πίστεως dalam kutipan Habakuk
  choice: orang benar akan hidup oleh iman
  alternative: orang yang benar oleh iman akan hidup
  rationale: Frasa itu secara sintaksis dapat dikaitkan dengan ‘orang benar’ atau ‘akan hidup’. Teks utama memakai susunan Indonesia yang lazim, sedangkan kemungkinan lain dicatat.
- issue: Fungsi partikel δὲ dalam kutipan
  choice: tidak diterjemahkan secara eksplisit
  alternative: Tetapi orang benar akan hidup oleh iman
  rationale: Di sini δὲ tidak harus menyatakan pertentangan kuat. Penghilangan konjungsi menghasilkan kutipan pendukung yang alami tanpa meniadakan alternatif formalnya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Injil” diulang untuk memperjelas acuan pronomina. Teks mempertahankan ungkapan teologis yang padat serta ketaksaan utama dalam bahasa Yunani, dengan catatan kaki berurutan dan semua penanda hadir dalam teks utama.
