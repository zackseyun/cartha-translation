id: ROM.1.13
reference: Romans 1:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς, καὶ ἐκωλύθην ἄχρι τοῦ δεῦρο, ἵνα τινὰ καρπὸν σχῶ καὶ ἐν ὑμῖν καθὼς καὶ ἐν τοῖς λοιποῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/013.yaml
  text: I do not want you to be unaware[a], brothers, that I have often planned to come to you—but have been prevented until now—so that I might have some fruit among you also[c][b], just as among the rest of the Gentiles.
translation:
  language: id
  text: Saudara-saudara[a], aku ingin kalian tahu bahwa aku sudah sering berniat datang kepada kalian, tetapi hingga sekarang aku terhalang, supaya aku juga memperoleh buah di antara kalian[b], seperti juga di antara bangsa-bangsa bukan Yahudi lainnya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “Saudara-saudara” secara harfiah berbentuk maskulin jamak, tetapi dalam sapaan kepada jemaat dapat mencakup saudara laki-laki dan perempuan.
    reason: lexical_alternative
  - marker: b
    text: “Buah” di sini adalah kiasan untuk hasil yang diperoleh melalui pelayanan Paulus di antara mereka.
    reason: cultural_note
  - marker: c
    text: Atau “bangsa-bangsa lain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω ... ἀγνοεῖν
  choice: aku tidak ingin kalian tidak tahu
  rationale: Mempertahankan bentuk negatif ungkapan Paulus, tetapi memakai susunan yang jelas dan wajar dalam bahasa Indonesia modern.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan jamak yang wajar dan bermartabat; dalam konteks jemaat, kata Yunani ini dapat mencakup laki-laki dan perempuan, sebagaimana dijelaskan dalam catatan kaki.
- source_word: πολλάκις προεθέμην
  choice: aku sudah sering berniat
  rationale: Menyampaikan niat yang berulang kali muncul sebelum saat penulisan tanpa memberi kesan bahwa rencana itu sudah terlaksana.
- source_word: ἐκωλύθην ἄχρι τοῦ δεῦρο
  choice: sampai sekarang aku terhalang
  rationale: Mempertahankan bentuk pasif dan batas waktu yang berlanjut hingga saat Paulus menulis, tanpa menentukan sumber penghalangnya.
- source_word: ἵνα τινὰ καρπὸν σχῶ
  choice: supaya aku juga memperoleh buah
  rationale: Mempertahankan metafora pertanian Paulus serta ketidakspesifikan τινά; arti kiasannya diterangkan dalam catatan kaki.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Dalam konteks ini menunjuk pada hasil pelayanan dalam lingkungan jemaat Roma sebagai suatu kelompok.
- source_word: τοῖς λοιποῖς ἔθνεσιν
  choice: bangsa-bangsa bukan Yahudi lainnya
  rationale: Dalam konteks misi Paulus, ἔθνη paling mungkin menunjuk pada orang atau bangsa bukan Yahudi; 'lainnya' juga menyiratkan bahwa para pembaca di Roma termasuk dalam lingkup tersebut.
theological_decisions:
- issue: Makna 'buah' dalam tujuan kunjungan Paulus
  choice: Metafora 'buah' dipertahankan tanpa mempersempit jenis hasilnya dalam teks utama.
  alternative: Mengganti metafora dengan 'hasil pelayanan' atau menafsirkannya secara khusus sebagai pertobatan.
  rationale: Teks Yunani tidak menentukan apakah buah itu terutama pertobatan, penguatan jemaat, dukungan misi, atau hasil pelayanan lain; mempertahankan metafora menjaga keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jemaat yang hangat dan bermartabat. Pronomina “aku” dan “kalian” dipakai untuk menjaga hubungan personal Paulus dengan para pembaca serta membedakan orang pertama tunggal dari orang kedua jamak. Metafora asli dipertahankan dan dijelaskan melalui catatan kaki.
