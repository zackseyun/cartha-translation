id: ROM.1.21
reference: Romans 1:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλὰ ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/021.yaml
  text: For although they knew God[a], they did not glorify him as God or give thanks, but they became futile in their thinking[b], and their senseless heart was darkened.
translation:
  language: id
  text: Sebab, sekalipun mereka mengenal Allah, mereka tidak memuliakan Dia sebagai Allah atau mengucap syukur kepada-Nya. Sebaliknya, pemikiran mereka[a] menjadi sia-sia, dan hati mereka yang tidak berpengertian[b] menjadi gelap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pertimbangan mereka,” “pemikiran mereka,” atau “spekulasi mereka.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, bahasa Yunani memakai bentuk tunggal: “hati mereka yang tidak berpengertian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Sebab
  rationale: Memperkenalkan alasan yang menjelaskan pernyataan sebelumnya dan mempertahankan hubungan logis antarayat.
- source_word: γνόντες τὸν θεὸν
  choice: sekalipun mereka mengenal Allah
  rationale: 'Partisip aoris dipahami secara konsesif dalam konteks: meskipun memiliki pengenalan akan Allah, mereka tidak menanggapi-Nya sebagaimana seharusnya.'
- source_word: οὐχ ὡς θεὸν ἐδόξασαν
  choice: mereka tidak memuliakan Dia sebagai Allah
  rationale: Mempertahankan bobot δοξάζω dan gagasan bahwa Allah tidak diperlakukan sesuai dengan kedudukan-Nya sebagai Allah.
- source_word: ἢ ηὐχαρίστησαν
  choice: atau mengucap syukur kepada-Nya
  rationale: Ungkapan Indonesia yang alami untuk tindakan menyatakan rasa syukur; objek tersirat diperjelas demi kelancaran.
- source_word: ἀλλὰ
  choice: Sebaliknya
  rationale: Menandai pertentangan kuat dan hasil yang berlawanan dengan respons yang semestinya kepada Allah.
- source_word: ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν
  choice: pikiran mereka menjadi sia-sia
  rationale: Menyampaikan keadaan kosong, tidak berguna, atau tanpa hasil dalam proses berpikir mereka tanpa menetapkan penyebab pasif yang tidak dinyatakan secara eksplisit.
- source_word: ἐσκοτίσθη
  choice: menjadi gelap
  rationale: Mempertahankan metafora penggelapan batin dan mengungkapkan perubahan keadaan secara alami dalam bahasa Indonesia.
- source_word: ἡ ἀσύνετος αὐτῶν καρδία
  choice: hati mereka yang tidak berpengertian
  rationale: ἀσύνετος menunjuk pada ketiadaan pengertian atau daya memahami, bukan sekadar kecerdasan rendah; 'hati' mempertahankan metafora pusat kehidupan batin.
theological_decisions:
- issue: Daya konsesif γνόντες
  choice: sekalipun mereka mengenal Allah
  alternative: setelah mengenal Allah; ketika mereka mengenal Allah
  rationale: Konteks menekankan kegagalan mereka untuk merespons dengan benar meskipun mengenal Allah. Pilihan ini mempertahankan ketegangan antara pengenalan tersebut dan penolakan mereka tanpa menjelaskan lebih jauh sifat atau tingkat pengenalan itu.
- issue: Bentuk pasif pada ἐματαιώθησαν dan ἐσκοτίσθη
  choice: menjadi sia-sia; menjadi gelap
  alternative: dibuat sia-sia; digelapkan
  rationale: Bentuk 'menjadi' mempertahankan perubahan keadaan tanpa secara tidak perlu menentukan pelaku yang menyebabkan keadaan itu, yang tidak disebutkan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Mengucap syukur' dipilih sebagai ungkapan umum; 'tidak berpengertian' menjaga nuansa moral-intelektual ἀσύνετος. Tanda catatan kaki ditempatkan sesudah klausa yang dijelaskannya.
