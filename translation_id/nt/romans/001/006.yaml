translation:
  language: id
  text: Di antara mereka, kalian juga termasuk orang-orang yang dipanggil menjadi milik Yesus Sang Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dipanggil oleh Yesus Sang Mesias”; secara lebih harfiah, “orang-orang yang terpanggil milik Yesus Sang Mesias.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν οἷς
  choice: di antara mereka
  rationale: Pronomina relatif datif jamak ini merujuk kepada bangsa-bangsa lain pada ayat sebelumnya dan menyatakan bahwa para pembaca termasuk dalam kelompok tersebut.
- source_word: ἐστε καὶ ὑμεῖς
  choice: kamu juga termasuk
  rationale: Ungkapan ini menyampaikan keberadaan sekaligus penekanan inklusif καὶ ὑμεῖς secara alami dalam bahasa Indonesia.
- source_word: κλητοὶ
  choice: orang-orang yang dipanggil
  rationale: Bentuk adjektiva substantival jamak diterjemahkan secara eksplisit tanpa mengurangi gagasan panggilan yang terkandung dalam κλητός.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Ἰησοῦ dipertahankan sebagai nama pribadi, sedangkan Χριστοῦ diterjemahkan sebagai gelar 'Sang Mesias'.
- source_word: κλητοὶ Ἰησοῦ Χριστοῦ
  choice: orang-orang yang dipanggil untuk menjadi milik Yesus Sang Mesias
  rationale: Genitif yang padat ini paling wajar dipahami sebagai hubungan kepemilikan atau keterikatan kepada Yesus Sang Mesias. Kata 'untuk menjadi milik' menghasilkan bahasa Indonesia yang alami, sementara kemungkinan hubungan pelaku tetap dicatat dalam catatan kaki.
theological_decisions:
- issue: Hubungan genitif dalam κλητοὶ Ἰησοῦ Χριστοῦ
  choice: dipanggil untuk menjadi milik Yesus Sang Mesias
  alternative: dipanggil oleh Yesus Sang Mesias; secara lebih harfiah, orang-orang yang dipanggil, milik Yesus Sang Mesias
  rationale: Pilihan utama menyatakan hubungan para penerima panggilan dengan Yesus tanpa memastikan bahwa Yesus adalah pelaku panggilan. Karena konstruksi Yunani ringkas dan dapat dipahami dengan lebih dari satu cara, alternatifnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'kamu' dipakai sebagai bentuk jamak kontekstual bagi para pembaca di Roma; 'Sang Mesias' mempertahankan Χριστός sebagai gelar.
