  text: καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/030.yaml
  text: slanderers[a], hateful to God, insolent, arrogant, boastful, inventors of evil, disobedient to parents,
translation:
  language: id
  text: pemfitnah, pembenci Allah[a], orang yang lancang, angkuh, pembual, perancang kejahatan, tidak taat kepada orang tua,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang yang dibenci Allah.”
    reason: Makna pasif θεοστυγεῖς merupakan kemungkinan penafsiran yang telah lama dikenal, meskipun makna aktif lebih sesuai dengan konteks daftar ini.
lexical_decisions:
- source_word: καταλάλους
  choice: pemfitnah
  rationale: Kata ini menunjuk kepada orang yang membicarakan orang lain secara jahat dan merusak nama baiknya. “Pemfitnah” ringkas, wajar, dan mempertahankan daya etis istilah tersebut.
- source_word: θεοστυγεῖς
  choice: pembenci Allah
  rationale: Makna aktif, yaitu orang yang membenci Allah, paling sesuai dengan rangkaian sifat dan perilaku manusia dalam daftar ini. Kemungkinan makna pasif dipertahankan dalam catatan kaki.
- source_word: ὑβριστάς
  choice: orang yang bertindak sewenang-wenang
  rationale: Istilah ini mencakup sikap lancang yang terwujud dalam perlakuan menghina atau kasar terhadap orang lain. Pilihan ini menghindari pembatasan makna pada kekerasan fisik saja dan membedakannya dari kata berikutnya yang berarti angkuh.
- source_word: ὑπερηφάνους
  choice: angkuh
  rationale: “Angkuh” secara alami menyatakan sikap meninggikan diri dan tetap dapat dibedakan dari tindakan sewenang-wenang serta kebiasaan membual dalam dua istilah yang berdekatan.
- source_word: ἀλαζόνας
  choice: pembual
  rationale: Kata benda ini menggambarkan orang yang suka membanggakan diri, termasuk dengan pretensi kosong. “Pembual” ringkas dan cocok dengan bentuk daftar.
- source_word: ἐφευρετὰς κακῶν
  choice: perancang kejahatan
  rationale: Ungkapan ini menggambarkan orang yang menciptakan atau mereka-reka cara-cara baru untuk berbuat jahat. “Perancang kejahatan” dekat dengan gambaran Yunani sekaligus wajar dalam bahasa Indonesia.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: tidak taat kepada orang tua
  rationale: Pilihan ini menyampaikan secara langsung sifat ἀπειθεῖς dengan objek datif γονεῦσιν serta mempertahankan fokus relasional ungkapan tersebut.
theological_decisions:
- issue: Makna θεοστυγεῖς
  choice: 'makna aktif: “pembenci Allah”'
  alternative: 'makna pasif: “orang yang dibenci Allah”'
  rationale: Makna aktif lebih sesuai dengan alur daftar keburukan manusia, karena setiap unsur menyebut sikap atau perilaku manusia. Namun, bentuk Yunani ini secara historis juga dipahami secara pasif, sehingga kemungkinan tersebut tidak dihapus dan dicantumkan dalam catatan kaki.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Susunan berupa daftar ringkas dipertahankan sesuai teks Yunani. Istilah yang berdekatan dibedakan: tindakan abusif dalam “bertindak sewenang-wenang”, sikap meninggikan diri dalam “angkuh”, dan ucapan membanggakan diri dalam “pembual”.'
