revisions:
- from: Karena itu, Allah menyerahkan mereka kepada hasrat yang memalukan. Bahkan, kaum perempuan mereka[a] menukar hubungan alami[b] dengan hubungan yang bertentangan dengan kodrat[c].
  to: Karena itu, Allah menyerahkan mereka kepada hawa nafsu yang memalukan, sebab bahkan perempuan mereka[a] menukar hubungan alami[b] dengan hubungan yang bertentangan dengan kodrat[c].
  rationale: Revisi memulihkan hubungan kausal-eksplanatoris yang ditandai γάρ melalui “sebab bahkan” dan mempertahankan ayat sebagai satu kesatuan sintaktis. “Perempuan mereka” dipilih sebagai padanan yang lebih langsung untuk θήλειαι αὐτῶν. Pilihan “hawa nafsu yang memalukan,” “hubungan alami,” dan “hubungan yang bertentangan dengan kodrat” tetap setia pada daya evaluatif serta konteks seksual yang tersirat dalam Yunani, tanpa memasukkan kategori modern atau penafsiran doktrinal tambahan. Penanda catatan kaki ditempatkan pada unsur yang dijelaskan.
