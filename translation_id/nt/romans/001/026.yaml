review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan untuk mencerminkan γὰρ secara jelas. Dalam draf, pemenggalan menjadi kalimat baru dan penggunaan “Bahkan” saja menghilangkan hubungan penjelas/sebab (“sebab karena bahkan”) dengan klausa sebelumnya. Selebihnya, “menyerahkan,” “menukar,” “hubungan alami,” dan “bertentangan dengan kodrat” secara memadai menyampaikan unsur-unsur Yunani dan mempertahankan evaluasi serta ambiguitas teks.
  naturalness: Teks revisi tetap baku dan alami dalam bahasa Indonesia modern. “Sebab bahkan” menjaga hubungan argumentatif Yunani tanpa membuat kalimat kaku. “Perempuan mereka” lebih langsung dan lebih alami daripada “kaum perempuan mereka,” yang dapat menyiratkan suatu kelompok sosial.
  terminology: “Hawa nafsu yang memalukan” adalah padanan Indonesia yang lazim dan bernada setara untuk πάθη ἀτιμίας. “Kodrat” layak untuk φύσις karena tidak memutuskan secara tafsiriah cakupan istilah itu. Catatan untuk χρῆσις dipertahankan, tetapi keterangan tambahan tentang konteks seksual dihilangkan karena mengubah catatan alternatif leksikal menjadi penjelasan interpretatif yang tidak perlu.
  issues:
  - severity: medium
    issue: Penghubung γὰρ tidak diterjemahkan secara eksplisit.
    rationale: “Bahkan” menerjemahkan τε ... γάρ hanya sebagian dan tidak menyatakan fungsi γάρ sebagai penjelasan/dukungan bagi klausa sebelumnya. Tanda titik juga memperlemah kaitan sintaktis tersebut.
  - severity: low
    issue: “Kaum perempuan mereka” kurang langsung.
    rationale: θήλειαι αὐτῶν secara kontekstual merujuk kepada perempuan mereka; “kaum” tidak diperlukan dan dapat memberi nuansa kelompok yang tidak ada dalam teks.
  - severity: low
    issue: Catatan b melampaui fungsi alternatif leksikal.
    rationale: Frasa penjelas “Dalam konteks ini yang dimaksud ialah hubungan seksual” merupakan penafsiran yang masuk akal dari konteks, tetapi bukan bagian dari alternatif harfiah dan tidak diperlukan untuk menerjemahkan ayat secara setia.
