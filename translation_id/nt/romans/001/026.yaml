  text: Διὰ τοῦτο παρέδωκεν αὐτοὺς ὁ θεὸς εἰς πάθη ἀτιμίας· αἵ τε γὰρ θήλειαι αὐτῶν μετήλλαξαν τὴν φυσικὴν χρῆσιν εἰς τὴν παρὰ φύσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/026.yaml
  text: For this reason God gave them over to dishonorable passions[a], for even their women exchanged natural relations for what is contrary to nature[c][b],
translation:
  language: id
  text: Karena itu, Allah menyerahkan mereka kepada hawa nafsu yang memalukan, sebab bahkan perempuan mereka[a] menukar hubungan alami[b] dengan hubungan yang bertentangan dengan kodrat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “yang perempuan di antara mereka.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “penggunaan alami.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “yang melawan kodrat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Karena itu
  rationale: Penghubung sebab-akibat yang wajar dalam bahasa Indonesia dan mengaitkan ayat ini dengan uraian sebelumnya.
- source_word: παρέδωκεν αὐτοὺς
  choice: menyerahkan mereka
  rationale: Mempertahankan makna bahwa Allah membiarkan atau menyerahkan mereka kepada akibat pemberontakan mereka tanpa menambahkan penjelasan tafsir ke dalam teks.
- source_word: πάθη ἀτιμίας
  choice: hasrat yang memalukan
  rationale: Mengungkapkan daya dorong kuat dari πάθη serta penilaian moral dalam ἀτιμίας dengan bahasa Indonesia yang alami, tanpa memperkerasnya menjadi kategori yang tidak disebutkan teks.
- source_word: θήλειαι αὐτῶν
  choice: kaum perempuan mereka
  rationale: Ungkapan ini alami untuk manusia dalam bahasa Indonesia, tetapi tetap mencerminkan bentuk Yunani yang secara leksikal menandai jenis kelamin perempuan dan berpasangan dengan penyebutan laki-laki pada ayat berikutnya.
- source_word: μετήλλαξαν
  choice: menukar
  rationale: Menunjukkan penggantian yang disengaja, sesuai dengan verba Yunani, dan juga mempertahankan kaitan leksikal dengan tema 'menukar' dalam konteks dekat.
- source_word: τὴν φυσικὴν χρῆσιν
  choice: hubungan alami
  rationale: Dalam konteks ini χρῆσις menunjuk pada hubungan atau fungsi seksual. 'Hubungan alami' menyampaikan maksud tersebut secara wajar tanpa kekakuan dan kemungkinan salah paham dari terjemahan harfiah 'penggunaan alami'.
- source_word: τὴν παρὰ φύσιν
  choice: hubungan yang bertentangan dengan kodrat
  rationale: Objek eliptis dijelaskan dengan mengulang 'hubungan' agar kalimat Indonesia utuh, sedangkan 'bertentangan dengan kodrat' mempertahankan ungkapan evaluatif παρὰ φύσιν tanpa memasukkan kategori modern yang tidak disebutkan.
theological_decisions:
- issue: Apakah daya penilaian moral Paulus perlu diperkeras atau diperhalus
  choice: Mempertahankan ungkapan 'hasrat yang memalukan' dan 'bertentangan dengan kodrat'.
  alternative: Memakai ungkapan yang lebih lunak seperti 'hasrat yang tidak pantas', atau memperkerasnya dengan menyebut kategori perilaku dan identitas modern secara eksplisit.
  rationale: Teks Yunani sendiri mengandung penilaian moral, sehingga penilaian itu harus tetap terdengar. Namun, terjemahan tidak boleh menambahkan klasifikasi teologis, budaya, atau identitas yang tidak dinyatakan dalam ayat.
- issue: Makna φύσις dalam frasa παρὰ φύσιν
  choice: kodrat
  alternative: alam atau kebiasaan yang wajar
  rationale: '''Kodrat'' mempertahankan ketegangan semantis tentang tatanan atau sifat alami tanpa menjelaskan secara sepihak apakah Paulus terutama mengacu pada biologi, tatanan penciptaan, atau kelaziman.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sementara istilah evaluatif dan ambiguitas teologis teks dipertahankan. Semua penanda catatan kaki ditempatkan langsung pada unsur yang diterangkannya.
