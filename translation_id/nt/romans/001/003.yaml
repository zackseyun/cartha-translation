translation:
  language: id
  text: tentang Anak-Nya, yang berasal dari garis keturunan Daud[a] menurut daging[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari benih Daud”; maksudnya, dari keturunan Daud.
    reason: lexical_alternative
  - marker: b
    text: “Menurut daging” di sini menunjuk pada garis keturunan atau asal-usul manusiawi-Nya, bukan pada tabiat berdosa.
    reason: cultural_note
lexical_decisions:
- source_word: περὶ
  choice: tentang
  rationale: Dalam rangkaian kalimat ini, περί memperkenalkan isi Injil yang disebut pada ayat sebelumnya; “tentang” alami dan tepat dalam bahasa Indonesia.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: Anak-Nya
  rationale: Bentuk ini menyatakan hubungan dengan Allah yang disebut sebelumnya. Huruf kapital memperjelas bahwa yang dimaksud ialah Anak Allah tanpa menambahkan klaim leksikal baru.
- source_word: τοῦ γενομένου
  choice: yang berasal
  rationale: Partisipel γίνομαι di sini menyatakan asal-usul atau munculnya seseorang dalam suatu garis keturunan. “Yang berasal” mempertahankan daya verbalnya tanpa mempersempit makna menjadi sekadar catatan silsilah atau secara eksplisit menjadi “dilahirkan”.
- source_word: ἐκ σπέρματος Δαυὶδ
  choice: dari garis keturunan Daud
  rationale: Secara harfiah σπέρμα berarti “benih”, tetapi dalam konteks ini menunjuk pada keturunan atau garis asal Daud. “Garis keturunan Daud” jelas dan wajar dalam bahasa Indonesia modern; arti harfiahnya dicatat dalam catatan kaki.
- source_word: κατὰ σάρκα
  choice: menurut daging
  rationale: Terjemahan dekat ini mempertahankan istilah teologis Paulus dan ketegangan ungkapannya. Dalam konteks ini frasa tersebut menunjuk pada asal-usul manusiawi dan jasmani Sang Anak, bukan pada tabiat berdosa.
theological_decisions:
- issue: Hubungan antara status sebagai Anak Allah dan asal-usul dari Daud
  choice: 'Mempertahankan kedua unsur secara berdampingan: “Anak-Nya” dan “berasal dari garis keturunan Daud menurut daging”.'
  alternative: Menafsirkan frasa itu sebagai “dalam hal kodrat manusia-Nya” atau meratakannya menjadi “keturunan Daud”.
  rationale: Teks menyandingkan status-Nya sebagai Anak dengan asal-usul Daud yang sungguh manusiawi tanpa menjelaskan hubungan metafisis keduanya. Terjemahan tidak menyelesaikan ketegangan itu dengan istilah doktrinal yang muncul kemudian.
- issue: Makna “daging” dalam frasa κατὰ σάρκα
  choice: Mempertahankan “menurut daging” dalam teks utama dan menjelaskan konteksnya dalam catatan kaki.
  alternative: Mengganti langsung dengan “secara jasmani” atau “menurut garis keturunan manusiawi”.
  rationale: “Daging” adalah istilah Paulus yang berbobot dan dapat memiliki berbagai nuansa. Di sini konteks membatasi maknanya pada keberadaan dan garis keturunan manusiawi, tetapi teks utama tetap mempertahankan ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan ini tetap berupa bagian kalimat yang berlanjut dari ayat sebelumnya. Ungkapan “menurut daging” sengaja dipertahankan karena pentingnya istilah sumber, sedangkan catatan kaki membantu pembaca memahami maknanya dalam konteks.
