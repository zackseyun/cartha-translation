  text: τοῦτο δέ ἐστιν συμπαρακληθῆναι ἐν ὑμῖν διὰ τῆς ἐν ἀλλήλοις πίστεως ὑμῶν τε καὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/012.yaml
  text: that is[a], that I may be mutually encouraged among you through each other’s faith[c][b], both yours and mine.
translation:
  language: id
  text: yaitu agar saya di tengah-tengah kalian turut dikuatkan melalui iman kita bersama—iman kalian dan iman saya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yaitu agar kita saling dikuatkan di tengah-tengah kalian melalui iman kita bersama—iman kalian dan iman saya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δέ ἐστιν
  choice: yaitu
  rationale: Memperkenalkan penjelasan atas maksud ayat sebelumnya secara alami dan ringkas.
- source_word: συμπαρακληθῆναι
  choice: supaya saya dikuatkan bersama-sama
  rationale: Bentuk pasif infinitif ini menyatakan penguatan atau penghiburan yang dialami bersama. Subjek tersirat orang pertama tunggal berasal dari konteks, sedangkan unsur συν- mempertahankan sifat timbal balik.
- source_word: ἐν ὑμῖν
  choice: di tengah-tengah kalian
  rationale: Menunjukkan lingkungan sosial tempat penguatan bersama itu berlangsung, yakni di antara jemaat Roma.
- source_word: διὰ τῆς ἐν ἀλλήλοις πίστεως
  choice: melalui iman yang ada dalam diri satu sama lain
  rationale: Mempertahankan διὰ sebagai sarana dan ἐν ἀλλήλοις sebagai ungkapan timbal balik tanpa mereduksinya sekadar menjadi 'iman bersama'.
- source_word: πίστεως
  choice: iman
  rationale: Dalam konteks ini πίστις menunjuk pada iman atau kepercayaan Paulus dan jemaat, bukan terutama kesetiaan.
- source_word: ὑμῶν τε καὶ ἐμοῦ
  choice: iman kalian dan iman saya
  rationale: Mengungkapkan secara jelas keseimbangan antara iman jemaat dan iman Paulus serta menghindari ambiguitas pronominal dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah penguatan itu satu arah atau timbal balik
  choice: Penguatan timbal balik antara Paulus dan jemaat Roma, dengan Paulus sebagai subjek tersirat dalam konstruksi yang bergantung pada konteks sebelumnya
  alternative: Kita dikuatkan bersama-sama; atau Paulus hanya menguatkan mereka
  rationale: Unsur συν- pada verba dan frasa 'iman kalian dan iman saya' menuntut dimensi kebersamaan. Namun, karena infinitif Yunani tidak menyatakan subjek secara eksplisit dan konteks sebelumnya berpusat pada keinginan Paulus, teks utama mempertahankan sudut pandang 'saya' sambil menyatakan kebersamaan; catatan kaki mencatat terjemahan plural yang wajar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' agar pembedaan antara ὑμῶν dan ἐμοῦ tetap jelas. Ungkapan 'dikuatkan bersama-sama' dipilih untuk mempertahankan unsur kebersamaan dalam verba Yunani tanpa terdengar terlalu teknis; alternatif plural dicatat karena subjek infinitif tidak dinyatakan secara eksplisit.
