id: ROM.1.20
reference: Romans 1:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/020.yaml
  text: For his invisible attributes[a], that is, his eternal power and divinity, have been clearly seen since the creation of the world, being understood through what has been made[b], so that they are without excuse.
translation:
  language: id
  text: Sebab, sejak dunia diciptakan, sifat-sifat-Nya yang tidak kelihatan[a]—yaitu kuasa-Nya yang kekal dan keilahian-Nya[b]—telah tampak jelas dan dipahami melalui segala sesuatu yang telah dijadikan, sehingga mereka tidak dapat berdalih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hal-hal tentang Dia yang tidak kelihatan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “sifat ilahi-Nya”. Kata Yunani di sini adalah θειότης, bukan istilah yang lebih kuat, θεότης.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἀόρατα αὐτοῦ
  choice: sifat-sifat-Nya yang tidak kelihatan
  rationale: Bentuk jamak netral ini menunjuk secara luas pada hal-hal yang tidak terlihat tentang Allah. 'Sifat-sifat-Nya' menyampaikan maksud itu dengan wajar dalam bahasa Indonesia tanpa menggambarkannya sebagai benda-benda tak kasatmata.
- source_word: ἀπὸ κτίσεως κόσμου
  choice: sejak dunia diciptakan
  rationale: '''Sejak'' mempertahankan makna temporal ἀπό, sedangkan bentuk pasif ''dunia diciptakan'' merupakan ungkapan Indonesia yang alami dan setia pada gagasan penciptaan dunia.'
- source_word: τοῖς ποιήμασιν
  choice: melalui segala sesuatu yang telah dijadikan
  rationale: 'Dativus ini berfungsi instrumental: segala yang dijadikan merupakan sarana yang melaluinya realitas Allah dipahami. Bentuk pasif mempertahankan nuansa hasil karya penciptaan.'
- source_word: νοούμενα
  choice: karena dipahami
  rationale: Partisip ini menjelaskan bahwa yang tak kelihatan dapat dilihat dengan jelas melalui pemahaman akal terhadap ciptaan. 'Karena' mengungkapkan hubungan cara atau sarana secara alami dalam bahasa Indonesia.
- source_word: καθορᾶται
  choice: terlihat dengan jelas
  rationale: Pilihan ini mempertahankan daya intensif verba serta aspek keadaan yang terus berlaku, tanpa memaksakan penanda kala yang tidak alami dalam bahasa Indonesia.
- source_word: ἥ τε ἀΐδιος αὐτοῦ δύναμις
  choice: yaitu kuasa-Nya yang kekal
  rationale: Frasa ini menjelaskan sifat-sifat yang tidak kelihatan. 'Kekal' secara alami menyampaikan makna ἀΐδιος.
- source_word: θειότης
  choice: keilahian-Nya
  rationale: '''Keilahian'' menunjuk pada kualitas atau sifat ilahi dan menjaga perbedaan leksikal antara θειότης di sini dan istilah yang lebih kuat, θεότης.'
- source_word: εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους
  choice: Karena itu, mereka tidak dapat berdalih
  rationale: Ungkapan ini menyampaikan hasil dari penyataan melalui ciptaan. 'Tidak dapat berdalih' adalah padanan Indonesia yang jelas bagi keadaan tanpa pembelaan atau alasan yang sah.
theological_decisions:
- issue: Menerjemahkan θειότης tanpa memperkuat makna Paulus secara berlebihan
  choice: keilahian-Nya
  alternative: hakikat ilahi-Nya; ke-Allahan-Nya
  rationale: '''Keilahian'' menegaskan kualitas yang sungguh ilahi, tetapi tidak mengaburkan perbedaan antara θειότης dan θεότης dengan istilah ontologis yang lebih kuat.'
- issue: Hubungan εἰς τὸ dengan keadaan manusia tanpa dalih
  choice: Karena itu, mereka tidak dapat berdalih
  alternative: sehingga mereka tidak dapat berdalih
  rationale: Konstruksi ini dibaca sebagai hasil. Pemisahan menjadi kalimat kedua membuat hubungan akibat jelas dan alami tanpa menentukan lebih jauh apakah hasil itu juga dimaksudkan sebagai tujuan.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Tanda pisah menandai keterangan aposisional tentang sifat-sifat Allah. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
