lexical_decisions:
- source_word: πεπληρωμένους
  choice: dipenuhi
  rationale: Mempertahankan bentuk pasif dan keadaan yang telah dihasilkan oleh aspek perfektum, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: πάσῃ
  choice: segala macam
  rationale: Dengan nomina abstrak tunggal, ungkapan ini secara idiomatis menyatakan cakupan menyeluruh tanpa memaksakan arti bahwa setiap unsur harus dipahami secara terpisah.
- source_word: ἀδικίᾳ
  choice: ketidakbenaran
  rationale: Mencakup keburukan moral yang lebih luas daripada sekadar ketidakadilan sosial dan sesuai dengan pemakaian Paulus.
- source_word: πονηρίᾳ
  choice: kejahatan
  rationale: Padanan modern dan luas untuk keburukan moral secara umum.
- source_word: πλεονεξίᾳ
  choice: keserakahan
  rationale: Menyampaikan hasrat untuk terus memperoleh lebih banyak secara jelas dalam bahasa Indonesia modern.
- source_word: κακίᾳ
  choice: niat jahat
  rationale: Menonjolkan segi kebencian atau maksud buruk terhadap orang lain dan membedakannya dari πονηρία yang lebih umum.
- source_word: μεστοὺς
  choice: penuh dengan
  rationale: Mencerminkan variasi ungkapan Yunani dari πεπληρωμένους sambil tetap alami.
- source_word: φθόνου
  choice: iri hati
  rationale: Padanan baku dan tepat untuk rasa tidak senang terhadap kebaikan yang dimiliki orang lain.
- source_word: φόνου
  choice: pembunuhan
  rationale: Konteks daftar keburukan mendukung istilah bermuatan moral ini, bukan istilah netral seperti membunuh.
- source_word: ἔριδος
  choice: perselisihan
  rationale: Mencakup pertengkaran dan pertentangan yang ditimbulkan oleh sikap suka berseteru.
- source_word: δόλου
  choice: tipu daya
  rationale: Menyatakan penipuan yang disengaja dengan bahasa yang jelas dan wajar.
- source_word: κακοηθείας
  choice: kedengkian
  rationale: Menyampaikan watak atau kecenderungan buruk terhadap orang lain, sambil tetap dibedakan dari κακία.
- source_word: ψιθυριστάς
  choice: mereka suka berbisik-bisik tentang orang lain
  rationale: Mengungkapkan bukan sekadar tindakan berbicara pelan, melainkan pembicaraan merugikan yang dilakukan secara tersembunyi; bentuk klausa lebih alami setelah rangkaian nomina Indonesia.
