lexical_decisions:
- source_word: ὃ
  choice: yang
  rationale: Kata ganti relatif netral tunggal ini merujuk kembali kepada Injil dalam Roma 1:1; “yang” mempertahankan hubungan sintaksis tersebut secara alami dalam bahasa Indonesia.
- source_word: προεπηγγείλατο
  choice: telah dijanjikan-Nya sebelumnya
  rationale: Pilihan ini mempertahankan daya makna janji dari verba tersebut sekaligus unsur waktu sebelumnya yang terkandung dalam prefiks προ-.
- source_word: διὰ
  choice: melalui
  rationale: Dengan kasus genitif, preposisi ini menyatakan perantaraan atau sarana; “melalui” merupakan padanan Indonesia yang alami.
- source_word: τῶν προφητῶν αὐτοῦ
  choice: nabi-nabi-Nya
  rationale: Bentuk ulang menyatakan jamak, sedangkan “-Nya” menunjukkan bahwa para nabi itu adalah milik atau utusan Allah.
- source_word: ἐν γραφαῖς ἁγίαις
  choice: dalam Kitab-Kitab Suci
  rationale: Dalam konteks Paulus, γραφαί menunjuk pada tulisan-tulisan yang diakui sebagai Kitab Suci; bentuk tanpa artikel dalam bahasa Yunani tidak mengharuskan terjemahan tak tentu dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah γραφαῖς ἁγίαις diterjemahkan sebagai “Kitab-Kitab Suci” atau “tulisan-tulisan suci”
  choice: Kitab-Kitab Suci
  alternative: tulisan-tulisan suci
  rationale: Pemakaian γραφαί dalam konteks Paulus biasanya merujuk pada tulisan Kitab Suci, tetapi alternatif yang lebih harfiah tetap dicatat karena frasa Yunani tidak memakai artikel dan secara leksikal dapat berarti tulisan-tulisan suci.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “telah dijanjikan-Nya sebelumnya” menjaga hubungan dengan ayat sebelumnya dan mempertahankan unsur janji serta waktu lampau; kapitalisasi “Kitab-Kitab Suci” menandai pengertian skriptural yang paling mungkin.
