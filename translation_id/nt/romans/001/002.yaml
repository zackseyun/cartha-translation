  text: which he promised beforehand through his prophets in the holy Scriptures,[a]
translation:
  language: id
  text: yang telah dijanjikan-Nya sebelumnya melalui nabi-nabi-Nya dalam kitab-kitab suci,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam tulisan-tulisan suci.”
