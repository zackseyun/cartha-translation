source:
  edition: SBLGNT
  text: καὶ ἤλλαξαν τὴν δόξαν τοῦ ἀφθάρτου θεοῦ ἐν ὁμοιώματι εἰκόνος φθαρτοῦ ἀνθρώπου καὶ πετεινῶν καὶ τετραπόδων καὶ ἑρπετῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/023.yaml
  text: and exchanged the glory of the imperishable God for the likeness of an image of perishable man and birds and four-footed animals and reptiles[a][b][c][d].
translation:
  language: id
  text: dan mereka menukar kemuliaan Allah yang tidak dapat binasa dengan gambar yang menyerupai manusia yang dapat binasa, burung-burung, binatang-binatang berkaki empat, dan binatang-binatang melata.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah yang tidak dapat rusak.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “dengan kemiripan gambar manusia yang dapat binasa ...”
    reason: lexical_alternative
  - marker: c
    text: Atau, “reptil-reptil”; kata Yunaninya dapat mencakup makhluk-makhluk yang merayap.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤλλαξαν
  choice: menukar
  rationale: Menyatakan tindakan mengganti sesuatu dengan yang lain secara sengaja dan cocok dengan konstruksi pertukaran dalam konteks ini.
- source_word: δόξαν
  choice: kemuliaan
  rationale: Padanan baku dan alami yang mencakup keagungan serta kehormatan Allah.
- source_word: ἀφθάρτου
  choice: yang tidak dapat binasa
  rationale: Mempertahankan pertentangan langsung dengan φθαρτοῦ dan menekankan bahwa Allah tidak mengalami kebinasaan atau kerusakan.
- source_word: ἐν ὁμοιώματι εἰκόνος
  choice: dengan gambaran berupa
  rationale: Mewakili bahasa Yunani yang bertumpuk tentang kemiripan dan gambar tanpa menghasilkan ungkapan Indonesia yang kaku; frasa ini tetap menunjukkan bahwa kemuliaan Allah diganti dengan representasi berbentuk makhluk.
- source_word: φθαρτοῦ ἀνθρώπου
  choice: manusia yang dapat binasa
  rationale: Menjaga kontras leksikal dengan 'Allah yang tidak dapat binasa' dan mempertahankan bentuk tunggal kolektif ἀνθρώπου.
- source_word: πετεινῶν
  choice: burung-burung
  rationale: Padanan modern yang jelas dan alami.
- source_word: τετραπόδων
  choice: binatang-binatang berkaki empat
  rationale: Mempertahankan arti harfiah sekaligus mudah dipahami pembaca umum.
- source_word: ἑρπετῶν
  choice: binatang-binatang melata
  rationale: Lebih luas dan lebih dekat dengan istilah Yunani daripada kategori zoologis modern 'reptil', karena dapat mencakup berbagai makhluk yang merayap.
theological_decisions:
- issue: Pertentangan antara ἀφθάρτου dan φθαρτοῦ
  choice: Allah yang tidak dapat binasa / manusia yang dapat binasa
  alternative: Allah yang baka / manusia fana
  rationale: Pilihan utama mempertahankan akar ungkapan yang sejajar sehingga kontras retoris Paulus terlihat jelas, tanpa membatasi makna pada kematian saja.
- issue: Rujukan ἐν ὁμοιώματι εἰκόνος
  choice: gambaran berupa manusia dan berbagai binatang
  alternative: kemiripan dengan patung manusia dan berbagai binatang
  rationale: Kata εἰκών dapat berarti gambar atau representasi dan tidak harus dibatasi menjadi patung; terjemahan ini tidak menetapkan jenis benda berhala yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti gerak argumen Yunani, sedangkan ungkapan bertumpuk ἐν ὁμοιώματι εἰκόνος dibuat lebih alami. Pengulangan 'binasa' dipertahankan untuk menonjolkan kontras retoris.
