  terminology: “Kemuliaan,” “Allah,” “manusia yang dapat binasa,” “burung-burung,” “binatang berkaki empat,” dan “binatang melata” sesuai konteks dan register. “Binatang melata” dengan catatan tentang cakupan istilah Yunani adalah pilihan yang baik.
