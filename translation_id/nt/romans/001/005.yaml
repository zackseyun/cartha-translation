  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: δι’ οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/005.yaml
  text: Through whom we received grace and apostleship for the obedience of faith among all the nations for the sake of his name[b][a],
translation:
  language: id
  text: Melalui Dia kami telah menerima anugerah dan kerasulan untuk ketaatan iman[a] di antara segala bangsa[b] demi nama-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketaatan yang timbul dari iman,” atau “ketaatan yang berupa iman.”
    reason: alternative_reading
  - marker: b
    text: Atau “di antara semua orang bukan Yahudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: Melalui Dia
  rationale: διά dengan bentuk genitif menyatakan perantaraan; pilihan ini alami dalam bahasa Indonesia dan tetap menghubungkan frasa ini dengan Yesus Kristus pada ayat sebelumnya.
- source_word: ἐλάβομεν
  choice: kami telah menerima
  rationale: Bentuk orang pertama jamak dipertahankan tanpa menentukan apakah Paulus memakai bentuk jamak secara retoris atau menyertakan orang lain.
- source_word: χάριν καὶ ἀποστολὴν
  choice: anugerah dan kerasulan
  rationale: Dua nomina yang dikoordinasikan dalam bahasa Yunani dipertahankan sebagai dua unsur, tanpa dilebur menjadi satu gagasan seperti 'anugerah kerasulan'.
- source_word: εἰς ὑπακοὴν πίστεως
  choice: untuk menghasilkan ketaatan iman
  rationale: εἰς menyatakan tujuan atau hasil yang dituju. 'Ketaatan iman' mempertahankan kepadatan dan ambiguitas hubungan genitif πίστεως, sedangkan 'menghasilkan' membuat arah tujuan pelayanan itu wajar dalam bahasa Indonesia.
- source_word: ἐν πᾶσιν τοῖς ἔθνεσιν
  choice: di antara segala bangsa
  rationale: ἔθνη dapat berarti bangsa-bangsa atau orang bukan Yahudi. 'Segala bangsa' mempertahankan cakupan etnis-geografis yang luas; alternatifnya dicatat dalam catatan kaki.
- source_word: ὑπὲρ τοῦ ὀνόματος αὐτοῦ
  choice: demi nama-Nya
  rationale: ὑπέρ di sini menyatakan tujuan, kepentingan, atau kehormatan. 'Demi nama-Nya' ringkas, alami, dan mempertahankan bobot ungkapan alkitabiah tersebut.
theological_decisions:
- issue: Makna ὑπακοὴν πίστεως
  choice: ketaatan iman
  alternative: ketaatan yang timbul dari iman; ketaatan yang berupa iman
  rationale: Hubungan genitif ini secara sintaksis padat dan dapat dipahami sebagai ketaatan yang bersumber dari iman atau sebagai ketaatan yang terdiri dalam iman. Teks utama tidak memilih salah satu penjelasan secara diam-diam.
- issue: Cakupan ἔθνη
  choice: segala bangsa
  alternative: semua orang bukan Yahudi
  rationale: Kata Yunani memungkinkan kedua nuansa. Teks utama menyampaikan cakupan universal misi, sementara kemungkinan rujukan khusus kepada bangsa-bangsa bukan Yahudi dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Anugerah' dan 'kerasulan' dipakai sebagai istilah teologis yang umum; susunan kalimat dibuat alami tanpa menghapus ambiguitas penting dalam frasa Yunani.
