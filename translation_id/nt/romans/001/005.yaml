  verdict: revise
  source_fidelity: 'Makna dasar dan semua unsur utama sumber Yunani terwakili dengan baik: perantaraan melalui Kristus, penerimaan anugerah dan kerasulan, tujuan pelayanan, cakupan semua bangsa, dan motivasi demi nama-Nya. Namun, penambahan verba "menghasilkan" dalam "untuk menghasilkan ketaatan iman" sedikit mempersempit εἰς dengan menyatakan bahwa ketaatan adalah hasil yang dihasilkan oleh para rasul. Yunani menyatakan tujuan/arah menuju "ketaatan iman" tanpa secara eksplisit menentukan mekanisme tersebut.'
  naturalness: '"Melalui Dia" dan "kami telah menerima" baku dan jelas, tetapi "melalui Dia" di tengah kalimat lebih alami dalam bahasa Indonesia modern daripada pembukaan yang diberi koma. "Untuk ketaatan iman" mempertahankan kepadatan Yunani dan tetap dapat dipahami dalam register Alkitabiah-baku; penghilangan "menghasilkan" juga membuat susunan lebih langsung.'
  terminology: '"Anugerah," "kerasulan," "ketaatan iman," "segala bangsa," dan "demi nama-Nya" adalah pilihan istilah yang layak. Kapitalisasi "Dia" dan "-Nya" konsisten dengan register Kristen Indonesia. Catatan untuk ἔθνη tepat mempertahankan alternatif "orang bukan Yahudi," dan catatan bagi ὑπακοὴ πίστεως menjaga ambiguitas genitif.'
