id: ROM.11.33
reference: Romans 11:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/033.yaml
  text: Oh[b][a], the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and untraceable his ways!
translation:
  language: id
  text: Oh, betapa dalamnya kekayaan, hikmat, dan pengetahuan Allah![a] Betapa tak terselidiki keputusan-keputusan-Nya dan tak terlacak jalan-jalan-Nya![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Oh, betapa dalamnya kekayaan hikmat dan pengetahuan Allah!” Susunan bahasa Yunani memungkinkan “kekayaan” dihubungkan lebih erat dengan “hikmat” dan “pengetahuan”.
    reason: alternative_reading
  - marker: b
    text: “Tak terlacak” menerjemahkan kata yang berarti “tidak dapat diikuti jejaknya” atau “melampaui kemampuan untuk menelusurinya”, sehingga nuansanya dibedakan dari “tak terselidiki”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: Oh
  rationale: Partikel seruan ini mengungkapkan kekaguman dalam doksologi. “Oh” alami dalam bahasa Indonesia modern dan tetap mempertahankan daya emosional teks.
- source_word: βάθος
  choice: betapa dalamnya
  rationale: Ungkapan ini menyampaikan makna kiasan “kedalaman” dengan bentuk seruan yang alami dalam bahasa Indonesia.
- source_word: πλούτου
  choice: kekayaan
  rationale: “Kekayaan” mempertahankan metafora tentang kelimpahan dan bobot teologis istilah ini dalam pemakaian Paulus.
- source_word: σοφίας
  choice: hikmat
  rationale: “Hikmat” merupakan padanan baku yang menunjuk pada kebijaksanaan Allah dalam maksud dan tindakan-Nya.
- source_word: γνώσεως
  choice: pengetahuan
  rationale: Istilah ini dipertahankan sebagai unsur tersendiri dan tidak dilebur dengan “hikmat”.
- source_word: θεοῦ
  choice: Allah
  rationale: 'Dalam susunan utama, bentuk genitif ini dipahami menerangkan ketiga nomina sebelumnya: kekayaan, hikmat, dan pengetahuan milik Allah.'
- source_word: ὡς
  choice: Betapa
  rationale: Dalam pemakaian eksklamatif, kata ini memperkenalkan seruan kedua secara wajar dan kuat dalam bahasa Indonesia.
- source_word: ἀνεξεραύνητα
  choice: tak terselidiki
  rationale: Padanan ini menyatakan bahwa keputusan Allah tidak dapat diselidiki atau diteliti sampai tuntas.
- source_word: κρίματα
  choice: keputusan-keputusan
  rationale: Istilah Yunani ini dapat mencakup penilaian, putusan, atau keputusan. “Keputusan-keputusan” menjaga keluasan makna tanpa membatasinya pada penghukuman saja.
- source_word: ἀνεξιχνίαστοι
  choice: tak terlacak
  rationale: Kata ini menggambarkan sesuatu yang jejaknya tidak dapat diikuti. Padanan tersebut membedakannya dari “tak terselidiki” dalam klausa sebelumnya.
- source_word: ὁδοὶ
  choice: jalan-jalan
  rationale: Bentuk ini mempertahankan metafora alkitabiah bagi cara Allah bertindak atau rangkaian tindakan-Nya.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Pronomina milik berulang ini merujuk kepada Allah dan diterjemahkan secara langsung.
theological_decisions:
- issue: Hubungan frasa “Allah” dengan “kekayaan, hikmat, dan pengetahuan”
  choice: '“Allah” menerangkan ketiga nomina: kekayaan, hikmat, dan pengetahuan.'
  alternative: Kekayaan dipahami lebih erat sebagai kekayaan yang terdapat dalam hikmat dan pengetahuan Allah.
  rationale: Urutan Yunani memungkinkan lebih dari satu pengelompokan sintaksis. Teks utama memilih rangkaian tiga sifat atau milik Allah yang paling wajar dalam konteks, sedangkan kemungkinan lainnya dicatat tanpa menghapus ambiguitas asli.
- issue: Pembedaan ἀνεξεραύνητα dan ἀνεξιχνίαστοι
  choice: 'Menggunakan dua padanan berbeda: “tak terselidiki” dan “tak terlacak”.'
  alternative: Menggunakan padanan yang hampir sama bagi keduanya, misalnya “tak terselami” dan “tak terselami”.
  rationale: Bahasa Yunani memakai dua istilah yang berkaitan tetapi berbeda. Pembedaan ini mempertahankan kekayaan retoris teks tanpa menjadikannya perbedaan teologis teknis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat dengan nada doksologis yang kuat. Pengulangan “betapa” mempertahankan bentuk seruan Yunani, sedangkan “jalan-jalan-Nya” menjaga metafora sumber.
