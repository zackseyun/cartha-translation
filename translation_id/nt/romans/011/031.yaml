  text: οὕτως καὶ οὗτοι νῦν ἠπείθησαν τῷ ὑμετέρῳ ἐλέει ἵνα καὶ αὐτοὶ ⸀νῦν ἐλεηθῶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/031.yaml
  text: So also these now have been disobedient[a], so that by the mercy shown to you they also may now receive mercy.
translation:
  language: id
  text: Demikian juga, mereka sekarang tidak taat, supaya melalui belas kasihan yang telah ditunjukkan kepada kalian[a], mereka juga sekarang menerima belas kasihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “melalui belas kasihan kalian.” Frasa Yunani dapat dipahami secara lebih harfiah demikian, tetapi dalam konteks kemungkinan besar menunjuk kepada belas kasihan yang telah Allah tunjukkan kepada kalian.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Demikian juga
  rationale: Mengungkapkan hubungan analogis dengan ayat sebelumnya secara alami serta mempertahankan daya banding dan simpulan ungkapan Yunani.
- source_word: οὗτοι
  choice: mereka
  rationale: Mengacu kepada Israel dalam konteks. Dalam bahasa Indonesia, pronomina ini lebih alami daripada bentuk demonstratif harfiah “orang-orang ini”, sementara rujukannya tetap jelas dari konteks.
- source_word: νῦν
  choice: sekarang
  rationale: Kedua kemunculannya dipertahankan karena menandai tahap masa kini dalam uraian Paulus dan memberi penekanan temporal.
- source_word: ἠπείθησαν
  choice: tidak taat
  rationale: ἀπειθέω dapat mencakup ketidaktaatan dan ketidakpercayaan. “Tidak taat” mempertahankan cakupan relasional-perjanjian yang lebih luas tanpa membatasinya pada ketidakpercayaan intelektual.
- source_word: τῷ ὑμετέρῳ ἐλέει
  choice: melalui belas kasihan yang telah ditunjukkan kepada kalian
  rationale: Frasa datif Yunani padat dan dapat diterjemahkan lebih harfiah sebagai “melalui belas kasihan kalian”. Dalam alur Roma 11:30–32, pilihan utama ini paling wajar menunjuk kepada belas kasihan Allah yang telah diterima para pembaca non-Yahudi.
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan tujuan atau hasil secara wajar dalam bahasa Indonesia tanpa memutus hubungan antarklausa.
- source_word: καὶ αὐτοὶ
  choice: mereka juga
  rationale: Mempertahankan penekanan pada turut disertakannya Israel dalam penerimaan belas kasihan, tanpa membuat susunan Indonesia terasa berat.
- source_word: ἐλεηθῶσιν
  choice: menerima belas kasihan
  rationale: Menyampaikan bentuk pasif ilahi secara jelas dan alami; belas kasihan dianugerahkan kepada mereka, dengan Allah sebagai pelaku yang tersirat.
theological_decisions:
- issue: Apakah “belas kasihan kalian” berarti belas kasihan yang dilakukan oleh orang percaya non-Yahudi atau belas kasihan Allah yang dianugerahkan kepada mereka
  choice: belas kasihan yang telah ditunjukkan kepada kalian
  alternative: melalui belas kasihan kalian
  rationale: Konteks Roma 11:30–32 membandingkan dua kelompok yang tidak taat lalu menerima belas kasihan ilahi. Alur ini lebih mendukung belas kasihan Allah yang telah diterima bangsa-bangsa lain, tetapi ambiguitas frasa Yunani tetap dicatat.
- issue: Nuansa ἠπείθησαν antara ketidaktaatan dan ketidakpercayaan
  choice: tidak taat
  alternative: tidak percaya
  rationale: Istilah Yunani dapat memuat kedua nuansa. “Tidak taat” mempertahankan cakupan yang lebih luas dan selaras dengan pasangan kata yang sama dalam ayat sebelumnya, tanpa meniadakan unsur ketidakpercayaan.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. “Kalian” dipakai untuk menandai bahwa pronomina Yunani berbentuk jamak. Susunan kalimat mempertahankan kedua kata “sekarang” dan hubungan tujuan/hasil, sekaligus menghindari kekakuan harfiah.
