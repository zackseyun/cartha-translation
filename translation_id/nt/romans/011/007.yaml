  text: τί οὖν; ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/007.yaml
  text: What then? Israel did not obtain what it seeks[a], but the elect obtained it, and the rest were hardened[b],
translation:
  language: id
  text: Jadi, bagaimana? Israel tidak memperoleh apa yang dicarinya, tetapi orang-orang pilihan[a] memperolehnya, sedangkan yang lain telah dikeraskan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “pemilihan” atau “pilihan”; di sini tampaknya menunjuk kepada orang-orang yang dipilih.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “telah dibuat tidak peka.” Kata Yunaninya dapat menggambarkan pengerasan atau hilangnya kepekaan rohani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν
  choice: Jadi, bagaimana?
  rationale: Ungkapan retoris-inferensial Paulus yang menarik kesimpulan dari uraian sebelumnya; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya retoris pertanyaan.
- source_word: ὃ ἐπιζητεῖ
  choice: apa yang dicarinya
  rationale: Menyatakan sasaran yang terus diupayakan Israel. 'Dicari' alami dalam konteks ini dan tidak menambahkan objek yang tidak disebutkan dalam ayat.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Nama diri dipertahankan; dalam konteks ini menunjuk secara kolektif kepada Israel.
- source_word: τοῦτο οὐκ ἐπέτυχεν
  choice: tidak memperoleh
  rationale: ἐπιτυγχάνω di sini berarti mencapai atau mendapatkan apa yang dicari. 'Memperoleh' dapat diulang pada klausa berikutnya untuk mempertahankan kontras retoris.
- source_word: ἡ δὲ ἐκλογὴ
  choice: tetapi orang-orang pilihan
  rationale: Walaupun ἐκλογή secara harfiah berarti 'pemilihan' atau 'pilihan', di sini kata itu kemungkinan dipakai secara metonimis bagi orang-orang yang dipilih, sebagaimana tampak dari kontras dengan 'yang lain'.
- source_word: ἐπέτυχεν
  choice: memperolehnya
  rationale: Mengulang padanan verba sebelumnya sehingga kontras dalam bahasa Yunani tetap terasa; akhiran '-nya' merujuk kepada apa yang dicari Israel.
- source_word: οἱ δὲ λοιποὶ
  choice: sedangkan yang lain
  rationale: Menunjuk kepada kelompok selebihnya dalam kontras dengan orang-orang pilihan; 'sedangkan' menampilkan kontras secara alami.
- source_word: ἐπωρώθησαν
  choice: telah dikeraskan
  rationale: Bentuk pasif dipertahankan tanpa menyebut pelaku. 'Dikeraskan' mempertahankan metafora kekerasan atau ketidakpekaan rohani serta gaung bahasa Kitab Suci.
theological_decisions:
- issue: Makna ἡ ἐκλογὴ dalam konteks
  choice: orang-orang pilihan
  alternative: pemilihan; pilihan
  rationale: Klausa ini mengontraskan suatu kelompok dengan 'yang lain', sehingga rujukan kepada orang-orang lebih mungkin daripada gagasan abstrak. Catatan kaki tetap menyajikan bentuk harfiahnya.
- issue: Suara dan pelaku dalam ἐπωρώθησαν
  choice: bentuk pasif 'telah dikeraskan' tanpa pelaku yang disebutkan
  alternative: Allah mengeraskan mereka; mereka mengeraskan diri
  rationale: Bahasa Yunani tidak menyatakan pelakunya dalam ayat ini. Terjemahan tidak memutuskan ketegangan antara tindakan penghakiman ilahi dan tanggung jawab manusia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pengulangan 'memperoleh' mempertahankan struktur kontras sumber. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
