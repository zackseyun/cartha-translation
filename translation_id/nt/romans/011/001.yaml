id: ROM.11.1
reference: Romans 11:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/001.yaml
  text: So I ask[a], has God rejected his people? May it never be! For I myself am an Israelite, from the offspring of Abraham[c][b], of the tribe of Benjamin.
translation:
  language: id
  text: 'Jadi, aku bertanya: Apakah Allah telah menolak umat-Nya?[a] Sekali-kali tidak![b] Sebab aku sendiri pun orang Israel, keturunan Abraham[c], dari suku Benyamin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: «telah menyingkirkan umat-Nya».'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Yunani ini secara harfiah berarti «Kiranya itu tidak terjadi!» dan menyatakan penolakan yang sangat tegas; dapat juga diterjemahkan «Sama sekali tidak!»
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: «dari benih Abraham».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Jadi, aku bertanya
  rationale: λέγω memperkenalkan pertanyaan retoris, sedangkan οὖν menghubungkannya secara inferensial dengan uraian sebelumnya. Ungkapan ini alami dalam bahasa Indonesia tanpa menghilangkan daya hubungnya.
- source_word: μὴ ἀπώσατο
  choice: Apakah ... telah menolak
  rationale: Pertanyaan dengan μή mengharapkan jawaban negatif. ἀπωθέομαι menyatakan tindakan menolak atau menyingkirkan; «menolak» jelas dan tidak menambahkan gagasan «selamanya» atau «sepenuhnya» yang tidak dinyatakan dalam bahasa Yunani.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Padanan baku dan wajar bagi θεός dalam konteks Alkitab berbahasa Indonesia.
- source_word: τὸν λαὸν αὐτοῦ
  choice: umat-Nya
  rationale: λαός di sini menunjuk kepada umat kepunyaan Allah dalam konteks perjanjian. «Umat-Nya» mempertahankan makna kepunyaan itu secara ringkas dan alami.
- source_word: μὴ γένοιτο
  choice: Sekali-kali tidak!
  rationale: Ungkapan Paulus ini merupakan penolakan yang sangat tegas, bukan sekadar jawaban «tidak». Padanan ini alami dan kuat dalam bahasa Indonesia; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: καὶ γὰρ ἐγὼ
  choice: Sebab aku sendiri pun
  rationale: γάρ memperkenalkan alasan, καί menyertakan Paulus sebagai contoh, dan ἐγώ bersifat tegas. «Aku sendiri pun» mempertahankan penekanan bahwa Paulus mengajukan dirinya sendiri sebagai bukti.
- source_word: Ἰσραηλίτης
  choice: orang Israel
  rationale: Padanan alami bagi sebutan etnis dan perjanjian Ἰσραηλίτης dalam bahasa Indonesia modern.
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: keturunan Abraham
  rationale: σπέρμα secara harfiah berarti «benih», tetapi dalam konteks silsilah berarti keturunan. «Keturunan Abraham» jelas dan idiomatis, sedangkan gambaran harfiahnya dipertahankan dalam catatan kaki.
- source_word: φυλῆς Βενιαμίν
  choice: dari suku Benyamin
  rationale: φυλή berarti «suku». Bentuk «dari suku Benyamin» merupakan ungkapan silsilah yang jelas dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah pertanyaan Paulus menyatakan penolakan total atau kekal terhadap Israel secara etnis
  choice: Menerjemahkan secara langsung «Apakah Allah telah menolak umat-Nya?» tanpa penjelas tambahan.
  alternative: «Apakah Allah telah menolak umat-Nya sepenuhnya?» atau «... untuk selama-lamanya?»
  rationale: Teks Yunani tidak memuat kata keterangan yang berarti «sepenuhnya» atau «untuk selama-lamanya». Terjemahan mempertahankan cakupan pertanyaan sebagaimana adanya dan membiarkan konteks selanjutnya menjelaskan maksud Paulus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti «aku» mempertahankan bentuk tunggal langsung Paulus; «umat-Nya» memakai kapital penghormatan sesuai kebiasaan penerbitan Alkitab Indonesia. Struktur pertanyaan retoris dan jawaban tegas dipertahankan tanpa menambahkan batasan teologis yang tidak terdapat dalam teks.
