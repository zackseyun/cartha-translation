  text: συνέκλεισεν γὰρ ὁ θεὸς τοὺς πάντας εἰς ἀπείθειαν ἵνα τοὺς πάντας ἐλεήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/032.yaml
  text: For God has shut up all into disobedience[c][b][a], so that he may show mercy to all.
translation:
  language: id
  text: Sebab Allah telah menyerahkan semua orang kepada ketidaktaatan[a][b], supaya Ia berbelaskasihan kepada semua orang.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengurung semua orang” atau “mengurung semua orang bersama-sama.”'
    reason: lexical_alternative
  - marker: b
    text: “Ketidaktaatan” dalam konteks tertentu juga dapat diterjemahkan “ketidakpercayaan”, tetapi di sini makna yang lebih luas, yaitu penolakan untuk taat, tampaknya dimaksudkan.
    reason: lexical_alternative
  - marker: c
    text: Pengulangan “semua orang” mengikuti kata-kata Paulus dan tidak membatasi cakupannya terlalu dini; dalam konteks ini ia sedang membicarakan orang Yahudi dan bukan Yahudi bersama-sama.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: telah mengurung
  rationale: Bentuk aoristus συγκλείω menyatakan tindakan mengurung atau membatasi bersama-sama. Pilihan ini mempertahankan metafora konkret Yunani tanpa mempersempitnya menjadi hukuman penjara.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memberi penjelasan bagi uraian sebelumnya; 'sebab' mempertahankan alur argumentasi Paulus secara ringkas dan wajar.
- source_word: τοὺς πάντας
  choice: semua orang
  rationale: Ungkapan yang sama diulang dalam kedua klausa. 'Semua orang' terdengar alami dalam bahasa Indonesia dan mempertahankan keluasan serta kesejajaran retorisnya tanpa menggantinya dengan penafsiran 'orang Yahudi dan bukan Yahudi'.
- source_word: εἰς ἀπείθειαν
  choice: dalam ketidaktaatan
  rationale: Kata ἀπείθεια mencakup sikap tidak taat atau penolakan untuk taat. Dalam bahasa Indonesia, 'mengurung ... dalam ketidaktaatan' mempertahankan gambaran keadaan atau ranah yang ditunjukkan oleh εἰς tanpa memberi kesan bahwa Allah menyebabkan orang menjadi tidak taat.
- source_word: ἵνα
  choice: supaya
  rationale: ἵνα memperkenalkan maksud atau hasil. 'Supaya' alami dan tetap mempertahankan daya purposifnya.
- source_word: ἐλεήσῃ
  choice: Ia berbelask kasihan
  rationale: ἐλεάω berarti menunjukkan atau memberikan belas kasihan. Ungkapan ini jelas, alami, dan tidak membuat bentuk subjungtif sesudah ἵνα terdengar seolah-olah tindakan Allah tidak pasti.
theological_decisions:
- issue: Cakupan 'semua orang' dalam kedua klausa
  choice: Mengulang 'semua orang' dalam kedua klausa, sebagaimana teks Yunani mengulang τοὺς πάντας.
  alternative: Menjelaskannya sebagai 'baik orang Yahudi maupun bukan Yahudi' atau menafsirkannya sebagai pernyataan keselamatan universal setiap individu.
  rationale: Konteks membicarakan orang Yahudi dan bukan Yahudi, tetapi rumusan Yunani sendiri tetap luas. Terjemahan mempertahankan simetri dan ketegangan teologis itu tanpa mempersempit atau memperluas cakupannya secara interpretatif.
- issue: Hubungan tindakan Allah dengan ketidaktaatan
  choice: Menerjemahkan gambaran sebagai Allah 'mengurung semua orang dalam ketidaktaatan'.
  alternative: Menerjemahkan seolah-olah Allah membuat atau menentukan semua orang menjadi tidak taat.
  rationale: συγκλείω menggambarkan pengurungan atau penyerahan ke dalam suatu keadaan, bukan secara eksplisit penyebab moral ketidaktaatan. Terjemahan tidak menambahkan klaim kausal yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan hubungan penjelasan ('Sebab'), metafora pengurungan, pengulangan 'semua orang', serta klausa tujuan, sambil tetap alami bagi pembaca umum.
