id: ROM.11.34
reference: Romans 11:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τίς γὰρ ἔγνω νοῦν κυρίου; ἢ τίς σύμβουλος αὐτοῦ ἐγένετο;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/034.yaml
  text: For who has known the mind of the Lord? Or who has become his counselor?[a]
translation:
  language: id
  text: Sebab, siapakah yang pernah mengetahui pikiran Tuhan? Atau siapakah yang pernah menjadi penasihat-Nya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulus menggemakan Yesaya 40:13. Teks Yunaninya juga menanyakan siapa yang mengetahui pikiran Tuhan atau menjadi penasihat-Nya.
    reason: cross_reference
lexical_decisions:
- source_word: Τίς
  choice: siapakah
  rationale: Kata ganti tanya ini membuka pertanyaan retoris; bentuk «siapakah» alami dan mempertahankan nada luhur kutipan.
- source_word: γὰρ
  choice: Sebab
  rationale: Konjungsi ini memberi dasar bagi pernyataan sebelumnya dan mempertahankan hubungan penjelas dalam alur argumentasi Paulus.
- source_word: ἔγνω
  choice: pernah mengetahui
  rationale: Aoristus dalam pertanyaan retoris ini menyatakan bahwa tidak seorang pun sepanjang pengalaman manusia mengetahui pikiran Tuhan; «pernah» menyampaikan cakupan itu secara wajar dalam bahasa Indonesia.
- source_word: νοῦν
  choice: pikiran
  rationale: Di sini νοῦς menunjuk pada pikiran, maksud, atau pengertian; «pikiran» merupakan padanan langsung yang tetap membuka nuansa tersebut.
- source_word: κυρίου
  choice: Tuhan
  rationale: Padanan baku bagi κύριος dalam konteks ini; gema Yesaya menunjuk kepada Allah tanpa perlu memasukkan bentuk nama ilahi ke dalam teks utama.
- source_word: ἢ
  choice: Atau
  rationale: Mempertahankan hubungan disjungtif dan kesejajaran antara kedua pertanyaan retoris.
- source_word: σύμβουλος
  choice: penasihat
  rationale: Kata ini menunjuk kepada orang yang memberi nasihat; «penasihat» adalah padanan modern, jelas, dan bermartabat.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Bentuk posesif bahasa Indonesia yang secara alami menyatakan bahwa penasihat tersebut adalah penasihat Tuhan.
- source_word: ἐγένετο
  choice: pernah menjadi
  rationale: γίνομαι berarti menjadi atau tampil dalam suatu kedudukan; «pernah menjadi» menyampaikan daya retoris bahwa tidak seorang pun pernah menduduki peran itu.
theological_decisions:
- issue: Rujukan «Tuhan» dalam kutipan yang menggemakan Yesaya
  choice: Memakai «Tuhan» tanpa mempersempit rujukannya melampaui teks Yunani.
  alternative: Memakai bentuk yang secara eksplisit mewakili nama ilahi berdasarkan latar Yesaya 40:13.
  rationale: Teks SBLGNT memakai κυρίου. Terjemahan mempertahankan bentuk Perjanjian Baru, sementara konteks dan catatan silang menunjukkan bahwa yang dimaksud adalah Allah dalam penegasan tentang hikmat-Nya yang tak terselami.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada retoris dan bermartabat. «Siapakah» serta pengulangan «pernah» menjaga kesejajaran kedua klausa dan menegaskan daya pertanyaan tanpa menambahkan jawaban eksplisit.
