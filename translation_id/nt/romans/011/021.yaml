  text: εἰ γὰρ ὁ θεὸς τῶν κατὰ φύσιν κλάδων οὐκ ἐφείσατο, ⸀οὐδὲ σοῦ φείσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/021.yaml
  text: For if God did not spare the natural branches[a], neither will he spare you.
translation:
  language: id
  text: Sebab, jika Allah tidak menyayangkan cabang-cabang alamiah[a], Ia juga tidak akan menyayangkan kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “cabang-cabang menurut sifat alamiahnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Sebab, jika
  rationale: Mempertahankan fungsi γάρ sebagai penghubung argumentatif dan εἰ sebagai penanda syarat dalam susunan bahasa Indonesia yang wajar.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Padanan baku dan sesuai konteks bagi θεός sebagai subjek.
- source_word: τῶν κατὰ φύσιν κλάδων
  choice: cabang-cabang yang asli
  rationale: κατὰ φύσιν secara harfiah berarti 'menurut kodrat/keadaan alamiah'; dalam metafora pohon zaitun, 'yang asli' secara alami menunjukkan cabang yang sejak semula termasuk pada pohon itu tanpa menjelaskan referennya di dalam teks utama.
- source_word: οὐκ ἐφείσατο
  choice: tidak menyayangkan
  rationale: φείδομαι berarti menahan diri dari mencelakakan atau membinasakan, yakni 'menyayangkan/membiarkan tetap luput'; pilihan ini mempertahankan kesejajaran dengan klausa berikutnya.
- source_word: οὐδὲ σοῦ φείσεται
  choice: Ia juga tidak akan menyayangkan kamu
  rationale: οὐδέ meneruskan penyangkalan dengan arti 'juga tidak', sedangkan bentuk mendatang φείσεται diterjemahkan 'akan menyayangkan'. 'Kamu' mempertahankan sapaan tunggal σοῦ.
theological_decisions:
- issue: Rujukan 'cabang-cabang yang asli' dalam metafora pohon zaitun
  choice: Metafora dipertahankan tanpa menyebut Israel secara eksplisit dalam teks utama.
  alternative: Menerjemahkannya secara interpretatif sebagai Israel.
  rationale: Konteks menunjuk kepada Israel, tetapi ayat ini sendiri menyatakannya melalui metafora cabang; terjemahan tidak seharusnya menggantikan metafora itu dengan penafsirannya.
- issue: Daya peringatan kepada 'kamu'
  choice: Peringatan langsung dan bentuk tunggal dipertahankan tanpa kualifikasi doktrinal tambahan.
  alternative: Menjelaskannya menurut kerangka tertentu tentang ketekunan, kemurtadan, atau pemilihan korporat maupun individual.
  rationale: Bahasa Yunani memberikan peringatan yang nyata kepada lawan bicara tunggal representatif, tetapi tidak dengan sendirinya menuntaskan perdebatan teologis yang lebih luas.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. 'Ia' dipakai untuk rujukan kepada Allah sesuai register Alkitabiah yang tetap mudah dipahami; 'kamu' mempertahankan bentuk tunggal Yunani.
