  text: σκοτισθήτωσαν οἱ ὀφθαλμοὶ αὐτῶν τοῦ μὴ βλέπειν, καὶ τὸν νῶτον αὐτῶν διὰ παντὸς σύγκαμψον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/010.yaml
  text: Let their eyes be darkened so that they may not see[b][a], and bend their back continually.
translation:
  language: id
  text: Biarlah mata mereka menjadi gelap sehingga mereka tidak melihat,[a] dan bungkukkanlah punggung mereka terus-menerus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi buta.”
    reason: lexical_alternative
  - marker: b
    text: Atau “senantiasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοτισθήτωσαν
  choice: Biarlah ... menjadi gelap
  rationale: Bentuk imperatif pasif orang ketiga dipertahankan sebagai ungkapan harapan atau kutukan. Pilihan ini menjaga citra kegelapan dalam teks Yunani, tanpa langsung menafsirkannya sebagai kebutaan.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: mata mereka
  rationale: Padanan langsung yang mempertahankan citra anggota tubuh sebagai unsur penting dalam metafora.
- source_word: τοῦ μὴ βλέπειν
  choice: sehingga mereka tidak dapat melihat
  rationale: Infinitif berartikel dengan μή dapat menyatakan tujuan atau hasil. 'Sehingga' mempertahankan kelonggaran itu, sedangkan 'tidak dapat melihat' mengungkapkan akibat mata yang digelapkan secara alami dalam bahasa Indonesia.
- source_word: τὸν νῶτον αὐτῶν
  choice: punggung mereka
  rationale: νῶτος berarti punggung. Bentuk tunggal kolektif alami dalam bahasa Indonesia dan tetap dekat dengan teks sumber.
- source_word: διὰ παντός
  choice: terus-menerus
  rationale: Frasa ini menyatakan keadaan yang senantiasa atau terus berlangsung, tanpa harus menyiratkan makna eskatologis 'selama-lamanya'.
- source_word: σύγκαμψον
  choice: bungkukkanlah
  rationale: Imperatif aktif ini ditujukan kepada Allah dalam kutipan tersebut. 'Bungkukkanlah' alami dengan objek 'punggung' dan mempertahankan daya perintah serta gambaran fisiknya.
theological_decisions:
- issue: Kutipan kutukan dan tindakan ilahi
  choice: 'Mempertahankan bentuk harapan/perintah: ''Biarlah ... dan bungkukkanlah ...'''
  alternative: Mengubahnya menjadi ramalan ('mata mereka akan menjadi gelap') atau akibat tanpa pelaku ilahi
  rationale: Bentuk Yunani mempertahankan daya kutukan atau permohonan penghakiman. Terjemahan tidak melunakkannya menjadi sekadar ramalan dan juga tidak menambahkan penjelasan teologis.
- issue: Tujuan atau hasil dalam τοῦ μὴ βλέπειν
  choice: sehingga mereka tidak dapat melihat
  alternative: supaya mereka tidak melihat
  rationale: '''Sehingga'' tidak memutuskan secara berlebihan apakah konstruksi itu terutama menyatakan tujuan atau hasil, sehingga ketegangan sintaksis sumber tetap terjaga.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'Biarlah' dan '-lah' mempertahankan nada kutipan yang bersifat imprekatoris; 'terus-menerus' mudah dipahami pembaca umum.
