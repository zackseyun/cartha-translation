  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; Κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/004.yaml
  text: But what does the divine response say to him? “I have kept for myself seven thousand men[b][a], who have not bent the knee to Baal.”
translation:
  language: id
  text: Namun, apa yang dikatakan jawaban ilahi[a] itu kepadanya? “Aku telah menyisakan bagi diri-Ku sendiri tujuh ribu laki-laki yang tidak bertekuk lutut kepada Baal.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “firman ilahi” atau “jawaban dari Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισμός
  choice: jawaban ilahi
  rationale: Dalam konteks ini menunjuk pada jawaban berotoritas dari Allah kepada Elia. Ungkapan ini alami dalam bahasa Indonesia dan tetap menyatakan sumber ilahinya.
- source_word: Κατέλιπον
  choice: Aku telah menyisakan
  rationale: Bentuk aoris menyatakan tindakan Allah meninggalkan atau mempertahankan suatu sisa bagi diri-Nya; 'telah menyisakan' mempertahankan tindakan lampau beserta hasilnya yang masih ada.
- source_word: ἐμαυτῷ
  choice: bagi diri-Ku sendiri
  rationale: Dativus refleksif menegaskan bahwa Allah menyisakan kelompok itu bagi diri-Nya sendiri.
- source_word: ἑπτακισχιλίους ἄνδρας
  choice: tujuh ribu laki-laki
  rationale: ἄνδρας secara khusus berbentuk maskulin, sehingga diterjemahkan secara akurat sebagai 'laki-laki', bukan dinetralkan menjadi 'orang'.
- source_word: οἵτινες
  choice: yang
  rationale: Kata ganti relatif ini memperkenalkan ciri yang mendefinisikan ketujuh ribu laki-laki tersebut; 'yang' menyampaikannya secara wajar.
- source_word: οὐκ ἔκαμψαν γόνυ
  choice: tidak pernah bertekuk lutut
  rationale: Ungkapan ini mempertahankan citra tindakan berlutut sebagai tanda penyembahan atau ketundukan. 'Tidak pernah' secara alami menyampaikan negasi atas tindakan mereka sampai saat yang dibicarakan.
- source_word: τῇ Βάαλ
  choice: kepada Baal
  rationale: Baal diperlakukan sebagai nama diri; artikel Yunani tidak perlu dinyatakan dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah sumber jawaban perlu dinyatakan sebagai ilahi
  choice: jawaban ilahi
  alternative: jawaban; firman ilahi
  rationale: Konteks dan sumber Perjanjian Lama menunjukkan bahwa Allah yang menjawab Elia. 'Jawaban ilahi' menyampaikan arti χρηματισμός tanpa menambahkan isi doktrinal.
- issue: Jenis kelamin dalam ἄνδρας
  choice: laki-laki
  alternative: orang
  rationale: Teks sumber memakai istilah yang secara khusus maskulin, sehingga bentuk itu dipertahankan.
- issue: Nuansa tindakan dalam Κατέλιπον
  choice: telah menyisakan
  alternative: telah memelihara; meninggalkan
  rationale: '''Telah menyisakan'' menjaga gagasan bahwa Allah sendiri memastikan adanya kelompok yang tetap setia, tanpa memperluasnya menjadi pernyataan teologis yang tidak tersurat.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bertekuk lutut' mempertahankan citra idiom Yunani sekaligus tetap mudah dipahami. Huruf kapital pada pronomina ilahi mengikuti kelaziman penerbitan Alkitab berbahasa Indonesia.
