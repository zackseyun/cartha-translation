  naturalness: '"Apa jawaban ilahi kepadanya?" terasa eliptis dalam bahasa Indonesia modern karena jawaban itu diperlakukan sebagai pihak yang berbicara. Bentuk "apa yang dikatakan jawaban ilahi itu kepadanya?" mempertahankan metafora teks sumber dan lebih lancar. "Tidak bertekuk lutut" sudah jelas dan idiomatis tanpa "pernah."'
  terminology: '"Jawaban ilahi," "bagi diri-Ku sendiri," "laki-laki," dan "Baal" sesuai dengan sumber dan register baku. Penanda catatan perlu ditempatkan tepat setelah "jawaban ilahi," yakni kata yang diberi alternatif leksikal.'
