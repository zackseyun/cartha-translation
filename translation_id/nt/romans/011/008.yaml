  source_fidelity: 'Makna pokok dipertahankan: Allah adalah subjek langsung dari ἔδωκεν, dan pasangan ‘mata’ serta ‘telinga’ menyatakan ketidakpekaan yang berlanjut hingga masa kini penulis. Namun, ‘Allah memberi’ mudah terbaca sebagai kala kini dalam bahasa Indonesia, padahal aoris di sini merujuk pada pemberian yang telah terjadi. ‘Roh ketumpulan’ juga kurang lazim dalam bahasa Indonesia modern dan secara idiomatis terasa seperti ketumpulan benda tajam.'
  naturalness: Gunakan ‘telah memberi’ untuk tindakan lampau dan ‘roh yang membuat mereka tumpul’ untuk ungkapan yang alami, tanpa mengurangi citra ketumpulan/ketidakpekaan dalam κατάνυξις. ‘Mata yang tidak melihat dan telinga yang tidak mendengar’ tetap ringkas, paralel, dan dapat dipertahankan; bentuk ini tidak memaksakan pembacaan tujuan semata atas τοῦ μή + infinitif.
  terminology: ‘Allah’ sesuai register Alkitab bahasa Indonesia. ‘Roh yang membuat mereka tumpul’ menyampaikan πνεῦμα κατανύξεως dengan lebih jelas daripada nominal abstrak ‘roh ketumpulan’, sambil menghindari pengidentifikasian berlebihan dengan ‘tidur nyenyak’ dari gema Yesaya. Catatan kaki mempertahankan alternatif tersebut dan menjelaskan bahwa istilah Yunani sendiri bernuansa ketumpulan atau mati rasa.
  issues:
