id: ROM.11.8
reference: Romans 11:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
translation:
  language: id
  text: 'sebagaimana ada tertulis: “Allah telah memberi mereka roh yang membuat mereka tumpul[a], mata yang tidak melihat dan telinga yang tidak mendengar, sampai hari ini.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “roh tidur nyenyak.” Ungkapan ini menggemakan Yesaya 29:10, tetapi istilah Yunani di sini terutama menunjuk pada keadaan tumpul, mati rasa, atau tidak peka.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: sebagaimana ada tertulis
  rationale: Formula kutipan Kitab Suci yang wajar dan khidmat; ‘sebagaimana’ mencerminkan καθώς, sedangkan ‘ada tertulis’ mempertahankan nuansa hasil yang tetap berlaku dari bentuk perfektum γέγραπται.
- source_word: Ἔδωκεν
  choice: memberi
  rationale: Bentuk aoris aktif diterjemahkan dengan verba lampau kontekstual; bahasa Indonesia tidak wajib menandai kala secara morfologis.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Padanan baku dan langsung bagi θεός dalam konteks Alkitab bahasa Indonesia.
- source_word: πνεῦμα κατανύξεως
  choice: roh ketumpulan
  rationale: κατάνυξις di sini menunjuk pada keadaan tumpul, kebas, atau terpana secara batin. ‘Ketumpulan’ mempertahankan ketidakpekaan yang dimaksud tanpa menyamakannya begitu saja dengan kebodohan; gema ‘tidur nyenyak’ dari Yesaya dicatat sebagai alternatif.
- source_word: ὀφθαλμοὺς τοῦ μὴ βλέπειν
  choice: mata yang tidak melihat
  rationale: Ungkapan ini menyampaikan akibat atau tujuan dari konstruksi τοῦ μή dengan infinitif dalam bahasa Indonesia yang alami, tanpa menambahkan ketidakmampuan mutlak yang tidak dinyatakan secara eksplisit.
- source_word: ὦτα τοῦ μὴ ἀκούειν
  choice: telinga yang tidak mendengar
  rationale: Padanan paralel dan alami bagi frasa sebelumnya; ‘mendengar’ mempertahankan arti dasar ἀκούω.
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: sampai hari ini
  rationale: Idiom Indonesia yang alami dan tepat untuk menyatakan keberlanjutan keadaan itu hingga masa kini penulis.
theological_decisions:
- issue: Peran langsung Allah dalam pengerasan atau ketidakpekaan sebagai penghukuman
  choice: Allah memberi mereka roh ketumpulan
  alternative: Allah membiarkan mereka mengalami ketumpulan
  rationale: Teks Yunani secara langsung menjadikan Allah subjek Ἔδωκεν. Terjemahan tidak melunakkannya menjadi sekadar izin, tetapi juga tidak menambahkan sistem teologis yang melampaui pernyataan Paulus.
- issue: Nuansa tujuan atau akibat dalam τοῦ μὴ dengan infinitif
  choice: mata yang tidak melihat dan telinga yang tidak mendengar
  alternative: mata supaya tidak melihat dan telinga supaya tidak mendengar
  rationale: Konstruksi Yunani dapat menyentuh nuansa tujuan atau akibat. Bentuk relatif Indonesia mempertahankan hasil nyata tanpa memutuskan secara berlebihan bahwa frasa itu hanya menyatakan tujuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kutipan dipertahankan ringkas; diksi ‘roh ketumpulan’ sengaja menjaga citra Yunani dan ketegangan teologisnya, dengan alternatif yang berasal dari gema Yesaya diberikan dalam catatan kaki.
