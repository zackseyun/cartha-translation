    rationale: Ἔδωκεν adalah aoris indikatif. Walaupun bahasa Indonesia tidak selalu menandai kala, ‘telah memberi’ secara aman mencerminkan tindakan yang telah berlangsung dalam kutipan ini.
  - severity: medium
    issue: ‘Roh ketumpulan’ kurang alami dalam bahasa Indonesia modern.
    rationale: ‘Ketumpulan’ lazim dipakai untuk benda yang tidak tajam dan terdengar janggal sebagai keadaan rohani. Klausa ‘roh yang membuat mereka tumpul’ menyampaikan genitif abstrak Yunani secara idiomatis tanpa menambah sistem teologis.
  - severity: low
