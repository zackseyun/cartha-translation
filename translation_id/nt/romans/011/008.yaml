  to: 'sebagaimana ada tertulis: “Allah telah memberi mereka roh yang membuat mereka tumpul[a], mata yang tidak melihat dan telinga yang tidak mendengar, sampai hari ini.”'
  rationale: Revisi ini memperjelas tindakan lampau Allah yang dinyatakan oleh aoris ἔδωκεν dan mengganti nominal yang tidak idiomatis dengan klausa Indonesia yang alami. Hubungan Allah sebagai pelaku langsung tetap utuh. Bentuk ‘mata yang tidak melihat dan telinga yang tidak mendengar’ dipertahankan karena setia pada paralelisme kutipan dan tidak menyelesaikan secara berlebihan ambiguitas tujuan/akibat dalam konstruksi Yunani.
