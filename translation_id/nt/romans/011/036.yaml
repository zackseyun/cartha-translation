  text: ὅτι ἐξ αὐτοῦ καὶ δι’ αὐτοῦ καὶ εἰς αὐτὸν τὰ πάντα· αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/036.yaml
  text: For from him and through him and to him are all things[a]. To him be the glory forever[b]. Amen.
translation:
  language: id
  text: Sebab segala sesuatu berasal dari Dia, melalui Dia, dan kepada Dia.[a] Kemuliaan bagi-Nya selama-lamanya.[b] Amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “Karena dari Dia, melalui Dia, dan kepada Dia ada segala sesuatu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “ke dalam zaman-zaman.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Menghubungkan ayat ini sebagai dasar atau penjelasan bagi pujian dalam konteks sebelumnya, dengan daya kausal yang tetap jelas dalam bahasa Indonesia.
- source_word: ἐξ αὐτοῦ
  choice: berasal dari Dia
  rationale: Menyatakan sumber atau asal. Bentuk ini lebih alami daripada terjemahan harfiah 'dari Dia' sambil mempertahankan bahwa segala sesuatu bersumber pada-Nya.
- source_word: δι’ αὐτοῦ
  choice: melalui Dia
  rationale: Mempertahankan nuansa perantaraan, sarana, atau pelaku yang terkandung dalam διά dengan genitif tanpa mempersempit maknanya.
- source_word: εἰς αὐτὸν
  choice: menuju kepada Dia
  rationale: Menjaga arah dan tujuan akhir yang dinyatakan oleh εἰς, tanpa membatasinya hanya pada arti 'untuk Dia'.
- source_word: τὰ πάντα
  choice: segala sesuatu
  rationale: Ungkapan ini menyampaikan cakupan menyeluruh dan kosmis dalam bahasa Indonesia modern yang wajar.
- source_word: αὐτῷ ἡ δόξα
  choice: Bagi Dialah kemuliaan
  rationale: Menyampaikan askripsi pujian dari klausa Yunani tanpa verba. Partikel -lah memberi tekanan yang wajar dan bernada khidmat.
- source_word: εἰς τοὺς αἰῶνας
  choice: selama-lamanya
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan durasi tanpa akhir yang dimaksud oleh frasa Yunani, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ἀμήν
  choice: Amin
  rationale: Mempertahankan bentuk liturgis yang telah baku dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan kata ganti αὐτοῦ/αὐτὸν/αὐτῷ
  choice: Mempertahankan kata ganti 'Dia' di seluruh ayat
  alternative: Mengganti kata ganti dengan 'Allah'
  rationale: Konteks Roma 11:33–35 menunjukkan bahwa Allah adalah rujukannya, tetapi mempertahankan kata ganti menjaga bentuk retoris teks dan tidak membuat rujukannya lebih eksplisit daripada bahasa Yunani.
- issue: Daya makna εἰς αὐτόν
  choice: menuju kepada Dia
  alternative: untuk Dia
  rationale: Pilihan ini mempertahankan dimensi arah dan tujuan akhir serta tidak diam-diam membatasi frasa itu menjadi tujuan atau kepemilikan saja.
- issue: Klausa doksologis αὐτῷ ἡ δόξα
  choice: Bagi Dialah kemuliaan
  alternative: Milik Dialah kemuliaan
  rationale: Bahasa Yunani tidak memiliki verba. Rumusan yang dipilih mempertahankan sifatnya sebagai askripsi pujian, sedangkan 'milik' dapat terdengar sebagai penegasan kepemilikan yang lebih sempit.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan gerak tiga frasa Yunani: sumber, perantaraan, dan tujuan. Huruf kapital pada ''Dia'' mengikuti kebiasaan umum bahasa Indonesia untuk kata ganti yang merujuk kepada Allah.'
