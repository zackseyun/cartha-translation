  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω. ἢ οὐκ οἴδατε ἐν Ἠλίᾳ τί λέγει ἡ γραφή, ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ ⸀Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/002.yaml
  text: God has not rejected his people[a], whom he foreknew. Or do you not know what the Scripture says in the passage about Elijah[c][b], how he appeals to God against Israel?
translation:
  language: id
  text: Allah tidak menolak umat-Nya yang telah dikenal-Nya sebelumnya.[a] Atau, tidakkah kamu tahu apa yang dikatakan Kitab Suci dalam bagian tentang Elia,[b] bagaimana Elia mengadukan Israel kepada Allah?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “dikenal-Nya sebelumnya” dapat juga diterjemahkan “diketahui-Nya sebelumnya”. Sebagian orang memahaminya secara lebih kuat sebagai “dipilih-Nya sebelumnya”, tetapi kata Yunani itu tidak diterjemahkan demikian dalam teks utama agar ketegangan teologisnya tetap dipertahankan.
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “dalam Elia”, sebuah ungkapan yang berarti “dalam bagian tentang Elia”.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “bagaimana Elia mengajukan permohonan kepada Allah terhadap Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσατο
  choice: menolak
  rationale: Dalam konteks ini, verba tersebut berarti menolak atau membuang. “Menolak” jelas dan alami, serta menyampaikan penyangkalan Paulus bahwa Allah telah mencampakkan umat-Nya.
- source_word: τὸν λαὸν αὐτοῦ
  choice: umat-Nya
  rationale: λαός di sini menunjuk kepada umat milik Allah dalam pengertian perjanjian. “Umat-Nya” mempertahankan nuansa itu tanpa menambahkan “Israel” sebelum nama tersebut muncul dalam klausa terakhir.
- source_word: ὃν προέγνω
  choice: yang telah dikenal-Nya sebelumnya
  rationale: Pilihan ini mempertahankan makna dasar “mengenal sebelumnya” dan objek personalnya, tanpa mengubahnya menjadi tafsiran yang lebih kuat seperti “dipilih-Nya sebelumnya”.
- source_word: ἢ οὐκ οἴδατε
  choice: Atau, tidakkah kamu tahu
  rationale: Ungkapan ini memperkenalkan pertanyaan retoris. Bentuk tersebut alami dalam bahasa Indonesia modern dan tetap mempertahankan daya retoris teks Yunani.
- source_word: ἐν Ἠλίᾳ
  choice: dalam bagian tentang Elia
  rationale: Ungkapan harfiah “dalam Elia” merupakan idiom yang menunjuk kepada bagian Kitab Suci mengenai Elia. Terjemahan ini menyampaikan maksud idiom dengan jelas.
- source_word: ἡ γραφή
  choice: Kitab Suci
  rationale: Dalam pemakaian Paulus, bentuk tunggal γραφή merujuk kepada tulisan suci yang berwibawa. “Kitab Suci” merupakan padanan Indonesia yang baku.
- source_word: ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ Ἰσραήλ
  choice: bagaimana Elia mengadukan Israel kepada Allah
  rationale: ἐντυγχάνω dapat berarti mengajukan permohonan atau seruan, sedangkan κατά dengan genitif memberi arah yang menentang Israel. “Mengadukan Israel kepada Allah” mengungkapkan kedua unsur itu secara alami dan tidak menyiratkan doa syafaat yang mendukung Israel.
theological_decisions:
- issue: Makna προέγνω dalam kaitannya dengan pemilihan ilahi
  choice: telah dikenal-Nya sebelumnya
  alternative: telah dipilih-Nya sebelumnya; telah dikasihi-Nya sebelumnya
  rationale: Ayat ini berkaitan dengan pembahasan Paulus tentang pemilihan, tetapi verba Yunani itu sendiri tidak mengharuskan terjemahan yang menyelesaikan perdebatan teologis tersebut. Terjemahan utama mempertahankan unsur “mengenal sebelumnya” dan membiarkan ketegangan teologisnya tetap terbuka.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pronomina “kamu” mempertahankan sapaan orang kedua jamak yang tidak dibedakan bentuknya dalam bahasa Indonesia; pengulangan nama “Elia” menghindari ketidakjelasan rujukan pronomina. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskan.
