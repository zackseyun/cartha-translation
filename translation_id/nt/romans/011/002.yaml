  to: Allah tidak menolak umat-Nya yang telah dikenal-Nya sebelumnya.[a] Atau, tidakkah kamu tahu apa yang dikatakan Kitab Suci dalam bagian tentang Elia,[b] bagaimana Elia mengadukan Israel kepada Allah?[c]
