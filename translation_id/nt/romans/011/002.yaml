    issue: Catatan kaki c memakai “memohon kepada Allah untuk menentang Israel”.
    rationale: 'Kata “untuk” dapat menyatakan tujuan dan dengan demikian menyiratkan bahwa Allah adalah pelaku yang dimohon untuk menentang Israel. Dalam Yunani, κατὰ τοῦ Ἰσραήλ menerangkan tindakan Elia dalam mengajukan permohonan/seruan kepada Allah: ia melakukannya terhadap Israel. Catatan perlu memakai susunan yang mempertahankan hubungan ini.'
