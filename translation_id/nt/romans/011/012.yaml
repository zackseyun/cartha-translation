  source_fidelity: 'Makna pokok dipertahankan dengan baik: παράπτωμα diterjemahkan sebagai “pelanggaran”, ἥττημα sebagai “kekurangan” dengan alternatif yang sesuai, dan πλήρωμα tetap dibiarkan terbuka sebagai “kepenuhan”. Namun, penanda catatan a dalam teks draf melekat pada “bangsa-bangsa lain”, padahal catatannya menjelaskan “kekurangan mereka”.'
  naturalness: Kalimatnya pada dasarnya baku dan jelas. “Betapa lebih lagi kepenuhan mereka!” lebih wajar daripada “terlebih lagi kepenuhan mereka!” karena πόσῳ μᾶλλον adalah seruan komparatif. Elipsis predikat akhir dapat dipertahankan seperti dalam bahasa Yunani.
  terminology: “Bangsa-bangsa lain” dengan tepat menyatakan kontras ἐθνῶν dengan Israel dalam konteks ini. “Kepenuhan” adalah padanan yang baik dan tidak memutuskan perdebatan mengenai πλήρωμα. Catatan untuk πλήρωμα sebaiknya tidak menambahkan “pemulihan” sebagai makna utama yang seolah-olah langsung terkandung dalam kata tersebut.
  issues:
