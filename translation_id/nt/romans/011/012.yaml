  to: Jika pelanggaran mereka menjadi kekayaan bagi dunia, dan kekurangan mereka[a] menjadi kekayaan bagi bangsa-bangsa lain, betapa lebih lagi kepenuhan mereka![b]
  rationale: Revisi memindahkan penanda catatan a ke “kekurangan mereka”, memperbaiki idiom komparatif menjadi “betapa lebih lagi”, dan membatasi catatan b pada alternatif yang tidak menafsirkan πλήρωμα secara berlebihan. Elipsis akhir dipertahankan untuk mencerminkan teks Yunani.
