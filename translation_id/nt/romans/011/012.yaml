  - severity: low
    issue: “Terlebih lagi” kurang tepat untuk πόσῳ μᾶλλον dalam bentuk eliptis ini.
    rationale: “Betapa lebih lagi” menyampaikan daya seru dan perbandingan a fortiori secara lebih langsung dalam bahasa Indonesia.
  - severity: low
    issue: Catatan b terlalu mempersempit atau menafsirkan πλήρωμα dengan “pemulihan mereka sepenuhnya”.
    rationale: Ayat ini tidak secara eksplisit menentukan pemulihan; “kepenuhan” perlu tetap terbuka. Alternatif yang aman ialah jumlah penuh atau keikutsertaan penuh.
