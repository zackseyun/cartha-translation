source:
  edition: SBLGNT
  text: εἰ δὲ τὸ παράπτωμα αὐτῶν πλοῦτος κόσμου καὶ τὸ ἥττημα αὐτῶν πλοῦτος ἐθνῶν, πόσῳ μᾶλλον τὸ πλήρωμα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/012.yaml
  text: If their trespass means riches for the world[a], and their loss means riches for the Gentiles[b], how much more will their fullness mean?
translation:
  language: id
  text: Jika pelanggaran mereka menjadi kekayaan bagi dunia, dan kekurangan mereka[a] menjadi kekayaan bagi bangsa-bangsa lain, betapa lebih lagi kepenuhan mereka![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kekalahan mereka” atau “berkurangnya jumlah mereka” untuk “kekurangan mereka”.
    reason: lexical_alternative
  - marker: b
    text: Atau “jumlah penuh mereka” atau “keikutsertaan penuh mereka” untuk “kepenuhan mereka”.
    reason: alternative_reading
lexical_decisions:
- source_word: παράπτωμα
  choice: pelanggaran
  rationale: Kata ini menyatakan langkah yang salah atau pelanggaran dan mempertahankan bobot moral tindakan Israel dalam konteks.
- source_word: πλοῦτος
  choice: kekayaan
  rationale: Mempertahankan metafora tentang berlimpahnya berkat yang diterima dunia dan bangsa-bangsa lain.
- source_word: κόσμου
  choice: dunia
  rationale: Padanan alami dan luas bagi κόσμος dalam konteks pihak-pihak di luar Israel yang memperoleh manfaat.
- source_word: ἥττημα
  choice: kekurangan
  rationale: Istilah Yunani yang langka ini dapat berarti kekurangan, kemunduran, atau kekalahan. 'Kekurangan' menjaga kemungkinan nuansa kuantitatif maupun keadaan gagal tanpa menetapkannya secara berlebihan.
- source_word: ἐθνῶν
  choice: bangsa-bangsa lain
  rationale: Dalam konteks Roma, istilah ini berlawanan dengan Israel; 'bangsa-bangsa lain' menyampaikan kontras itu dengan jelas dalam bahasa Indonesia modern.
- source_word: πόσῳ μᾶλλον
  choice: terlebih lagi
  rationale: Ungkapan perbandingan ini menyampaikan argumen dari yang lebih kecil kepada yang lebih besar secara alami.
- source_word: πλήρωμα
  choice: kepenuhan
  rationale: '''Kepenuhan'' mempertahankan keluasan makna Yunani, yang dapat menunjuk pada jumlah penuh, keikutsertaan penuh, atau keadaan yang dipulihkan sepenuhnya.'
theological_decisions:
- issue: Makna dan rujukan τὸ πλήρωμα αὐτῶν
  choice: kepenuhan mereka
  alternative: jumlah mereka yang penuh; keikutsertaan mereka sepenuhnya; pemulihan mereka sepenuhnya
  rationale: Ungkapan Paulus ringkas dan terbuka. Terjemahan utama tidak menetapkan apakah yang dimaksud ialah jumlah, keikutsertaan, atau pemulihan Israel.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Bentuk eliptis pada akhir ayat dipertahankan, sebagaimana teks Yunani yang tidak mengulang kata 'menjadi kekayaan'. Penanda catatan ditempatkan langsung sesudah frasa yang dijelaskan.
