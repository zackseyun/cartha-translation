id: ROM.11.6
reference: Romans 11:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ χάριτι, οὐκέτι ἐξ ἔργων, ἐπεὶ ἡ χάρις οὐκέτι γίνεται ⸀χάρις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/006.yaml
  text: But if by grace, it is no longer from works; otherwise grace no longer becomes grace.
translation:
  language: id
  text: Namun, jika berdasarkan anugerah, maka bukan lagi berdasarkan perbuatan; kalau tidak, anugerah tidak lagi menjadi anugerah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριτι / χάρις
  choice: berdasarkan anugerah / anugerah
  rationale: Bentuk datif χάριτι menyatakan dasar atau sarana, sedangkan χάρις tetap diterjemahkan secara konsisten sebagai “anugerah,” istilah Indonesia modern yang alami untuk pemberian cuma-cuma.
- source_word: ἐξ ἔργων
  choice: berdasarkan perbuatan
  rationale: Ungkapan ἐξ menyatakan dasar atau sumber; “berdasarkan perbuatan” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “dari perbuatan” dan mempertahankan pertentangannya dengan anugerah.
- source_word: γίνεται
  choice: menjadi
  rationale: Mempertahankan verba eksplisit γίνομαι dan penekanan retoris bahwa, bila didasarkan pada perbuatan, anugerah tidak lagi menjadi anugerah.
- source_word: ἐπεί
  choice: kalau tidak
  rationale: 'Dalam konteks argumentatif ini, ἐπεί memperkenalkan akibat logis yang berlawanan: jika pernyataan sebelumnya tidak berlaku, hakikat anugerah menjadi batal.'
theological_decisions:
- issue: Pertentangan antara anugerah dan perbuatan
  choice: Mempertahankan keduanya sebagai dasar yang saling meniadakan dalam kalimat ini
  alternative: Menjelaskan “perbuatan” secara khusus sebagai perbuatan hukum Taurat atau jasa manusia
  rationale: Teks Yunani hanya mengatakan ἔργων tanpa pembatas tambahan. Terjemahan tidak mempersempit cakupannya atau memasukkan penafsiran teologis yang tidak dinyatakan.
- issue: Daya ungkap γίνομαι dalam frasa penutup
  choice: “anugerah tidak lagi menjadi anugerah”
  alternative: “anugerah bukan lagi anugerah”
  rationale: Pilihan ini mempertahankan verba γίνεται yang terdapat dalam SBLGNT serta ketegangan retoris teks, tanpa menjelaskan lebih jauh bagaimana perubahan konseptual itu dipahami.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. “Namun” menandai peralihan argumentatif; “kalau tidak” tetap mudah dipahami pembaca umum tanpa mengurangi ketegasan logis ayat.
