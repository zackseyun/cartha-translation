  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κατὰ μὲν τὸ εὐαγγέλιον ἐχθροὶ δι’ ὑμᾶς, κατὰ δὲ τὴν ἐκλογὴν ἀγαπητοὶ διὰ τοὺς πατέρας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/028.yaml
  text: With respect to the gospel[a], they are enemies for your sake; but with respect to election[b], they are beloved because of the fathers.
translation:
  language: id
  text: Dalam hal Injil, mereka adalah musuh demi kalian; tetapi dalam hal pemilihan, mereka dikasihi karena para leluhur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Para leluhur” terutama merujuk kepada Abraham, Ishak, dan Yakub.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ μὲν τὸ εὐαγγέλιον
  choice: Dalam hal Injil
  rationale: κατά dengan akusatif menandai segi atau ranah pertimbangan; frasa ini juga mempertahankan kontras μέν...δέ secara wajar dalam bahasa Indonesia.
- source_word: ἐχθροὶ
  choice: musuh
  rationale: Adjektiva jamak ini berfungsi predikatif dan menyatakan status relasional. 'Musuh' mempertahankan daya ungkap teks tanpa mengubahnya menjadi sekadar 'bersikap memusuhi' atau 'dibenci'.
- source_word: δι’ ὑμᾶς
  choice: demi kepentingan kalian
  rationale: διά dengan akusatif dapat menyatakan alasan atau manfaat. Pilihan ini sesuai dengan konteks masuknya bangsa-bangsa lain dan tidak menjadikan para pembaca sebagai penyebab yang bersalah.
- source_word: κατὰ δὲ τὴν ἐκλογὴν
  choice: tetapi dalam hal pemilihan
  rationale: Struktur ini sejajar dengan klausa pertama; 'pemilihan' mempertahankan istilah Paulus bagi tindakan atau maksud memilih.
- source_word: ἀγαπητοὶ
  choice: dikasihi
  rationale: Bentuk predikatif ini paling alami diterjemahkan dengan verba pasif dalam bahasa Indonesia, sambil mempertahankan makna bahwa mereka menjadi objek kasih.
- source_word: διὰ τοὺς πατέρας
  choice: karena para leluhur
  rationale: διά dengan akusatif menyatakan dasar atau alasan. Dalam konteks Roma 9–11, οἱ πατέρες menunjuk terutama kepada leluhur Israel, yakni para bapa leluhur.
theological_decisions:
- issue: Rujukan subjek tersirat pada 'mereka'
  choice: '''Mereka'' dibiarkan menunjuk secara korporat kepada Israel dalam alur Roma 9–11.'
  alternative: Membatasinya secara eksplisit hanya kepada orang Yahudi tidak percaya pada zaman Paulus.
  rationale: Konteks mencakup Israel sebagai umat, meskipun keadaan historis yang dibicarakan berkaitan dengan ketidakpercayaan banyak orang Israel. Terjemahan tidak mempersempit rujukan melampaui teks.
- issue: Ketegangan antara 'musuh' dan 'dikasihi'
  choice: Kedua predikat dipertahankan berdampingan tanpa penjelasan yang melunakkan salah satunya.
  alternative: Menafsirkan 'musuh' sebagai sekadar penentang sosial atau sebagai orang yang secara mutlak dibenci Allah.
  rationale: Ayat itu sendiri menempatkan status sehubungan dengan Injil dan status sehubungan dengan pemilihan dalam ketegangan yang disengaja.
- issue: Makna 'pemilihan'
  choice: Mempertahankan istilah 'pemilihan' tanpa menambahkan subjek eksplisit.
  alternative: Memperluasnya menjadi 'pemilihan Allah' atau 'maksud Allah dalam memilih'.
  rationale: Allah jelas tersirat dalam konteks, tetapi penambahan itu tidak dinyatakan secara eksplisit dalam frasa Yunani.
- issue: Makna 'para leluhur'
  choice: Dipahami terutama sebagai para bapa leluhur Israel, khususnya Abraham, Ishak, dan Yakub.
  alternative: Semua nenek moyang Israel secara umum.
  rationale: Dalam Roma 9–11, ungkapan ini paling wajar membangkitkan ingatan akan para bapa leluhur dan janji-janji Allah kepada mereka, tetapi teks utama tetap ringkas.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kalian' dipakai untuk menandai bentuk jamak ὑμᾶς. 'Demi kepentingan kalian' dipilih daripada 'karena kalian' agar nuansa manfaat dalam konteks lebih jelas tanpa menghapus kemungkinan hubungan sebab.
