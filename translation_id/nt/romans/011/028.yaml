    rationale: Frasa Yunani dengan διά + akusatif menyatakan dasar/alasan atau orientasi “demi/karena kalian,” tetapi tidak secara leksikal menyebut “kepentingan.” Tambahan itu memberi arah manfaat yang lebih eksplisit daripada sumber dan kurang luwes dalam bahasa Indonesia.
