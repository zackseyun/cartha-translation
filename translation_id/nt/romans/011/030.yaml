  text: ὥσπερ ⸀γὰρ ὑμεῖς ποτε ἠπειθήσατε τῷ θεῷ, νῦν δὲ ἠλεήθητε τῇ τούτων ἀπειθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/030.yaml
  text: For just as you once were disobedient to God[a], but now have received mercy because of their disobedience,
translation:
  language: id
  text: Sebab sama seperti dahulu kalian tidak taat kepada Allah[a], tetapi sekarang telah menerima belas kasihan karena ketidaktaatan mereka,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Yunani yang diterjemahkan “tidak taat” dan “ketidaktaatan” juga dapat berarti “tidak percaya” dan “ketidakpercayaan” dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Sebab, sama seperti
  rationale: Mempertahankan fungsi γάρ sebagai penghubung penjelas dan ὥσπερ sebagai pembuka perbandingan, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: ὑμεῖς
  choice: kalian
  rationale: Menunjukkan dengan jelas bahwa pronomina Yunani ini berbentuk jamak tanpa menambahkan identitas penerima yang hanya diperoleh dari konteks.
- source_word: ποτε
  choice: dahulu
  rationale: Secara alami menyatakan keadaan pada masa lampau dan membentuk kontras dengan νῦν, “sekarang”.
- source_word: ἠπειθήσατε
  choice: tidak taat
  rationale: Mencakup pembangkangan terhadap Allah dan menjaga hubungan leksikal dengan ἀπείθεια; istilah Yunani ini juga dapat mencakup ketidakpercayaan.
- source_word: τῷ θεῷ
  choice: kepada Allah
  rationale: Padanan Indonesia yang alami bagi pelengkap datif dari ἀπειθέω.
- source_word: νῦν δὲ
  choice: tetapi sekarang
  rationale: Menjaga kontras tegas antara keadaan dahulu dan penerimaan belas kasihan sekarang.
- source_word: ἠλεήθητε
  choice: telah menerima belas kasihan
  rationale: Mengungkapkan bentuk pasif secara alami dengan tetap menempatkan penerima sebagai pihak yang memperoleh belas kasihan.
- source_word: τῇ τούτων ἀπειθείᾳ
  choice: karena ketidaktaatan mereka
  rationale: Menyampaikan kemungkinan fungsi kausal atau instrumental datif dengan jelas tanpa mempertegas mekanisme melebihi teks; τούτων dirujuk secara alami sebagai “mereka”.
theological_decisions:
- issue: Makna ἀπειθέω / ἀπείθεια dalam konteks keselamatan Paulus
  choice: tidak taat / ketidaktaatan
  alternative: tidak percaya / ketidakpercayaan
  rationale: Pilihan ini mempertahankan kaitan antara verba dan nomina serta tidak mempersempit maknanya menjadi persoalan kognitif semata. Catatan kaki menjaga kemungkinan bahwa ketidakpercayaan juga terkandung dalam kedua istilah Yunani tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menandai orang kedua jamak secara jelas. Tanda koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
