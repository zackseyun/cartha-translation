id: ROM.11.27
reference: Romans 11:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ αὕτη αὐτοῖς ἡ παρ’ ἐμοῦ διαθήκη, ὅταν ἀφέλωμαι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/027.yaml
  text: And this will be my covenant with them[a], when I take away their sins.
translation:
  language: id
  text: Dan inilah perjanjian-Ku dengan mereka[a], ketika Aku menghapus dosa-dosa mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “perjanjian yang berasal dari-Ku bagi mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: perjanjian
  rationale: Dalam konteks kutipan Kitab Suci oleh Paulus, kata ini menunjuk pada ikatan janji Allah, bukan surat wasiat.
- source_word: ἡ παρ’ ἐμοῦ διαθήκη
  choice: perjanjian-Ku
  rationale: Ungkapan ini secara harfiah berarti 'perjanjian yang berasal dari-Ku'; 'perjanjian-Ku' alami dalam bahasa Indonesia dan tetap menyatakan bahwa perjanjian itu berasal dari Allah.
- source_word: αὐτοῖς
  choice: dengan mereka
  rationale: Bentuk datif dapat berarti 'kepada/bagi mereka', tetapi ungkapan Indonesia yang lazim adalah mengadakan atau mempunyai perjanjian 'dengan' seseorang.
- source_word: ὅταν
  choice: ketika
  rationale: Dalam janji profetis ini, kata tersebut menunjuk pada saat penggenapan, bukan pada kejadian yang berulang-ulang.
- source_word: ἀφέλωμαι
  choice: Aku menghapus
  rationale: Dalam hubungan dengan dosa, 'menghapus' menyampaikan tindakan meniadakan atau menyingkirkan dosa secara alami dan bermartabat.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: dosa-dosa mereka
  rationale: Bentuk jamak dipertahankan secara langsung dan jelas.
- source_word: καὶ αὕτη
  choice: Dan inilah
  rationale: Klausa Yunani tidak memuat verba eksplisit. Bahasa Indonesia memungkinkan bentuk nominal 'inilah' tanpa perlu menambahkan penanda waktu depan yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Makna διαθήκη dalam kutipan janji profetis
  choice: perjanjian
  alternative: surat wasiat
  rationale: '''Perjanjian'' mempertahankan latar janji Allah dalam Kitab Suci dan tidak memasukkan pengertian dokumen warisan.'
- issue: Daya waktu ὅταν ἀφέλωμαι
  choice: ketika Aku menghapus dosa-dosa mereka
  alternative: setiap kali Aku menghapus dosa-dosa mereka
  rationale: Konteksnya adalah janji penggenapan dalam sejarah keselamatan, bukan syarat atau tindakan yang berulang.
- issue: Ketiadaan verba eksplisit dalam καὶ αὕτη ... ἡ διαθήκη
  choice: Dan inilah perjanjian-Ku
  alternative: Dan inilah yang akan menjadi perjanjian-Ku
  rationale: Bentuk nominal mempertahankan kehematan dan ambiguitas waktu teks Yunani; nuansa masa depan tetap dapat dipahami dari klausa 'ketika' dan konteks profetis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. Kapitalisasi pada pronomina ilahi mengikuti kebiasaan umum penerjemahan Alkitab Indonesia. Susunan kalimat mempertahankan bentuk ringkas kutipan profetis.
