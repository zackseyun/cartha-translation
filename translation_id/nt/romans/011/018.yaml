id: ROM.11.18
reference: Romans 11:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι, οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/018.yaml
  text: do not boast over the branches[a]. But if you do boast, it is not you who support the root[b], but the root supports you.
translation:
  language: id
  text: Janganlah menyombongkan dirimu terhadap cabang-cabang itu.[a] Namun, jika kamu memang menyombongkan diri, bukan kamu yang menopang akar, melainkan akar yang menopang kamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “janganlah bermegah atas cabang-cabang itu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “bukan kamu yang menanggung akar, melainkan akar yang menanggung kamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαυχῶ / κατακαυχᾶσαι
  choice: menyombongkan dirimu / menyombongkan diri
  rationale: Kata kerja ini menyatakan sikap membanggakan diri atas atau terhadap pihak lain. Ungkapan “menyombongkan diri terhadap” alami dalam bahasa Indonesia dan mempertahankan nuansa merasa lebih tinggi tanpa menjadikan cabang-cabang sebagai sesuatu yang dibanggakan.
- source_word: κλάδων
  choice: cabang-cabang itu
  rationale: Bentuk jamak tertentu menunjuk kepada cabang-cabang khusus dalam gambaran pohon zaitun yang sedang dibahas. Kata “itu” membuat rujukan tersebut jelas dan wajar dalam bahasa Indonesia.
- source_word: ῥίζαν / ῥίζα
  choice: akar
  rationale: Diterjemahkan secara konsisten untuk mempertahankan metafora pohon dan hubungan ketergantungan yang dinyatakan Paulus.
- source_word: βαστάζεις
  choice: menopang
  rationale: Dalam metafora ini, kata tersebut menggambarkan akar yang menanggung dan menyokong cabang. “Menopang” menyampaikan dukungan yang mempertahankan kehidupan sekaligus tetap dekat dengan gambaran fisik pohon.
- source_word: οὐ σὺ ... ἀλλὰ ἡ ῥίζα σέ
  choice: bukan kamu yang menopang akar, melainkan akar yang menopang kamu
  rationale: Susunan ini mempertahankan penekanan kontras antara “kamu” dan “akar” serta pembalikan hubungan ketergantungan dalam teks Yunani.
- source_word: μὴ
  choice: janganlah
  rationale: Bersama bentuk imperatif kini, kata ini menyatakan larangan langsung. “Janganlah” sesuai dengan register Kitab Suci yang modern dan bermartabat tanpa menentukan apakah tindakan itu sudah berlangsung.
theological_decisions:
- issue: Makna akar dan cabang-cabang dalam metafora pohon zaitun Paulus
  choice: Mempertahankan metafora tanpa menjelaskan identitas akar atau cabang-cabang dalam teks utama.
  alternative: Menafsirkan akar secara eksplisit sebagai para leluhur, Abraham, atau janji-janji perjanjian.
  rationale: Teks Yunani menyatakan metafora itu tanpa mengidentifikasi akar secara eksplisit dalam ayat ini. Penjelasan lebih khusus akan memasukkan tafsiran ke dalam terjemahan dan mengurangi keterbukaan teologis yang dipertahankan oleh konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “menopang” mempertahankan kesejajaran retoris teks sumber, sedangkan “memang” membuat klausa bersyarat terdengar alami tanpa mengubah sifat kondisionalnya.
