id: ROM.11.24
reference: Romans 11:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/024.yaml
  text: For if you were cut from what is by nature a wild olive tree and[a], contrary to nature, were grafted into a cultivated olive tree, how much more will these, the natural branches[b], be grafted into their own olive tree.
translation:
  language: id
  text: Sebab, jika kamu dipotong dari pohon zaitun liar yang memang liar menurut sifat alaminya, lalu dicangkokkan, bertentangan dengan sifat alammu, pada pohon zaitun budidaya, terlebih lagi mereka ini, yaitu cabang-cabang alami,[a] akan dicangkokkan pada pohon zaitun mereka sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka ini, yang menurut sifat alaminya”; kata “cabang-cabang” disuplai dari metafora pohon zaitun dalam konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau, “akan dicangkokkan kembali pada pohon zaitun mereka sendiri.” Gagasan kembali tersirat dalam konteks, tetapi kata “kembali” tidak dinyatakan secara eksplisit oleh verba Yunani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεκόπης
  choice: dipotong dari
  rationale: Bentuk pasif ἐκκόπτω berarti dipotong keluar atau dipotong lepas. 'Dipotong dari' alami dalam bahasa Indonesia dan mempertahankan gambaran hortikultura tanpa menggantinya dengan gagasan 'dipatahkan'.
- source_word: τῆς κατὰ φύσιν ... ἀγριελαίου
  choice: pohon zaitun liar yang secara alami merupakan asalmu
  rationale: Susunan Yunani mengaitkan κατὰ φύσιν dengan asal alami orang yang disapa dari pohon zaitun liar. Rumusan ini menyampaikan hubungan itu dengan jelas dalam bahasa Indonesia tanpa menjadikan 'liar secara alami' sekadar keterangan tentang pohonnya.
- source_word: παρὰ φύσιν
  choice: berlawanan dengan keadaan alami
  rationale: Ungkapan ini mempertahankan kontras retoris dengan κατὰ φύσιν. 'Keadaan alami' di sini menunjuk pada proses pencangkokan yang tidak mengikuti pola asal alami cabang tersebut.
- source_word: ἐνεκεντρίσθης
  choice: dicangkokkan pada
  rationale: ἐγκεντρίζω adalah istilah hortikultura untuk mencangkok. Preposisi 'pada' merupakan padanan Indonesia yang wajar untuk memasukkan entres ke pohon induk.
- source_word: καλλιέλαιον
  choice: pohon zaitun budidaya
  rationale: Kata ini menunjuk pohon zaitun yang dibudidayakan, sebagai lawan pohon zaitun liar. 'Budidaya' lebih tepat dan kurang evaluatif daripada 'baik'.
- source_word: πόσῳ μᾶλλον
  choice: terlebih lagi
  rationale: Ungkapan ini menyampaikan argumen a fortiori Paulus secara alami dan ringkas dalam bahasa Indonesia.
- source_word: οὗτοι οἱ κατὰ φύσιν
  choice: mereka ini, yaitu cabang-cabang alami
  rationale: Bahasa Yunani secara harfiah mengatakan 'mereka ini, yang menurut kodrat/keadaan alami'. 'Cabang-cabang' disuplai dari metafora pohon zaitun dalam konteks agar kalimat jelas, sementara catatan kaki menandai unsur yang tersirat itu.
- source_word: ἐγκεντρισθήσονται
  choice: akan dicangkokkan
  rationale: Bentuk futur pasif ini menyatakan tindakan pencangkokan. Kata 'kembali' tidak dimasukkan ke teks utama karena tidak eksplisit dalam verba Yunani, meskipun tersirat oleh konteks.
- source_word: τῇ ἰδίᾳ ἐλαίᾳ
  choice: pada pohon zaitun mereka sendiri
  rationale: 'ἰδίᾳ menekankan hubungan kepunyaan atau kesesuaian alami: pohon itu adalah pohon mereka sendiri. ''Pada'' mengikuti idiom pencangkokan bahasa Indonesia.'
theological_decisions:
- issue: Apakah 'mereka ini' harus dijelaskan secara eksplisit sebagai orang Yahudi atau Israel
  choice: Mempertahankan rujukan tidak langsung melalui 'mereka ini, yaitu cabang-cabang alami'.
  alternative: Menerjemahkan 'orang-orang Yahudi ini' atau 'orang-orang Israel ini'.
  rationale: Konteks Roma 11 menunjukkan bahwa yang dimaksud ialah Israel, tetapi ayat ini sendiri mempertahankan metafora pohon dan tidak memakai sebutan etnis secara eksplisit. Terjemahan tidak menambahkan identifikasi yang lebih tegas daripada teks.
- issue: Apakah kata 'cabang-cabang' boleh disuplai
  choice: Menyuplai 'cabang-cabang' dalam teks utama dan menandainya dengan catatan kaki.
  alternative: Menerjemahkan lebih harfiah sebagai 'mereka ini, yang secara alami demikian'.
  rationale: Metafora cabang yang dipotong dan dicangkokkan sudah jelas dari konteks dekat. Penyuplaian ini membuat bahasa Indonesia dapat dipahami tanpa menutup fakta bahwa nomina tersebut tidak tertulis di dalam frasa Yunani.
- issue: Apakah unsur pemulihan harus dinyatakan dengan kata 'kembali'
  choice: Tidak memakai 'kembali' dalam teks utama, tetapi mencatat implikasinya.
  alternative: Menerjemahkan 'akan dicangkokkan kembali'.
  rationale: Kembalinya cabang-cabang itu memang tersirat oleh alur metafora dan konteks, tetapi ἐγκεντρισθήσονται sendiri hanya berarti 'akan dicangkokkan'. Ini mempertahankan batas antara makna leksikal dan implikasi kontekstual.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Istilah hortikultura 'dicangkokkan' dan 'pohon zaitun budidaya' dipakai untuk menjaga metafora Paulus. Sapaan tunggal 'kamu' dipertahankan karena σύ berbentuk tunggal dan mewakili lawan bicara non-Yahudi secara retoris.
