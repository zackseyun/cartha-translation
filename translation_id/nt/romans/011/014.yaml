  text: if somehow I may provoke my own people to jealousy and save some of them[a].
translation:
  language: id
  text: Kalau-kalau aku dapat membangkitkan kecemburuan dalam diri kaum sebangsaku[a] dan menyelamatkan beberapa orang di antara mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dagingku”; maksudnya kaum sebangsa Paulus, yaitu sesama orang Yahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: kalau-kalau dengan cara itu
  rationale: Ungkapan ini menyatakan harapan atau tujuan yang belum pasti; bentuk Indonesia ini mempertahankan nuansa tentatif dan kaitannya dengan cara pelayanan Paulus dalam konteks.
- source_word: παραζηλώσω
  choice: aku dapat membangkitkan kecemburuan
  rationale: Kata kerja ini berarti membangkitkan rasa cemburu dan menggemakan tema kecemburuan Israel akibat masuknya bangsa-bangsa lain dalam konteks sekitar.
- source_word: μου τὴν σάρκα
  choice: kaum sebangsaku
  rationale: Secara harfiah berarti 'dagingku', tetapi dalam konteks ini merupakan ungkapan kekerabatan etnis yang menunjuk kepada sesama orang Yahudi. Terjemahan utama dibuat alami, sementara metafora sumber dipertahankan dalam catatan kaki.
- source_word: σώσω
  choice: menyelamatkan
  rationale: Dalam konteks Paulus, kata ini memiliki bobot keselamatan rohani, yang dipertahankan dengan padanan baku 'menyelamatkan'.
- source_word: τινὰς ἐξ αὐτῶν
  choice: beberapa orang dari antara mereka
  rationale: Frasa ini menunjukkan sebagian orang yang berasal dari kelompok yang baru disebutkan; bentuk ini jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna σάρξ dalam sebutan Paulus bagi kelompok etnisnya
  choice: kaum sebangsaku
  alternative: dagingku; sanak saudaraku secara jasmani; sesama orang Yahudi
  rationale: Di sini σάρξ bukan 'tabiat berdosa', melainkan menunjuk pada pertalian jasmani dan etnis Paulus dengan Israel. Ungkapan idiomatis diterjemahkan menurut maknanya agar jelas, dengan bentuk harfiahnya dicatat untuk menjaga citra teks Yunani.
- issue: Peran Paulus dalam 'menyelamatkan' sebagian orang
  choice: menyelamatkan
  alternative: membawa kepada keselamatan
  rationale: Bentuk aktif Yunani dipertahankan tanpa menghapus ketegangan teologisnya atau menambahkan penjelasan kausal yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kaum sebangsaku' menyampaikan hubungan etnis secara alami; catatan kaki mempertahankan metafora harfiah Yunani. Urutan tujuan dan nuansa harapan yang belum pasti dijaga.
