    issue: “dengan cara itu” menambahkan unsur yang tidak eksplisit dalam εἴ πως.
    rationale: εἴ πως menyatakan kemungkinan atau harapan tentatif (“kalau-kalau,” “jika mungkin”), tanpa menyebut “cara itu.” Konteks dapat menerangkan sarana yang dimaksud, tetapi unsur tersebut sebaiknya tidak dimasukkan ke dalam teks utama ayat ini.
  - severity: low
    issue: Objek semantis παραζηλώσω kurang eksplisit dalam “membangkitkan kecemburuan kaum sebangsaku.”
    rationale: Bahasa Indonesia dapat memahami frasa itu, tetapi “membangkitkan kecemburuan dalam diri kaum sebangsaku” lebih jelas menyatakan bahwa Paulus bermaksud membuat mereka cemburu.
