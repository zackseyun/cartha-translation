  text: Ὑμῖν ⸀δὲ λέγω τοῖς ἔθνεσιν. ἐφ’ ὅσον μὲν ⸀οὖν εἰμι ἐγὼ ἐθνῶν ἀπόστολος, τὴν διακονίαν μου δοξάζω,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/013.yaml
  text: I am speaking to you Gentiles[a]. Inasmuch, then, as I am an apostle to the Gentiles, I magnify my ministry[b],
translation:
  language: id
  text: 'Kepada kalian yang bukan Yahudi saya berkata: Oleh karena saya adalah rasul bagi orang-orang bukan Yahudi[a], saya menjunjung tinggi pelayanan saya[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bangsa-bangsa” untuk kedua penggunaan istilah ini.
    reason: lexical_alternative
  - marker: b
    text: Atau “saya memuliakan pelayanan saya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν
  choice: Namun, kepada kalian yang bukan Yahudi saya berkata
  rationale: Susunan ini mempertahankan sapaan langsung dan peralihan ringan yang ditandai δέ. 'Yang bukan Yahudi' menyampaikan arti kontekstual ἔθνη secara jelas dalam bahasa Indonesia modern.
- source_word: ἐφ’ ὅσον μὲν οὖν
  choice: Selama ... memang
  rationale: Ungkapan ini mempertahankan hubungan batas atau dasar dalam ἐφ’ ὅσον serta penegasan ringan μὲν οὖν, tanpa memaksakan padanan terpisah bagi setiap partikel.
- source_word: εἰμι ἐγὼ ἐθνῶν ἀπόστολος
  choice: saya memang rasul bagi orang-orang bukan Yahudi
  rationale: Genitif ἐθνῶν dipahami sebagai kelompok yang menjadi tujuan kerasulan Paulus. 'Rasul' mempertahankan makna jabatan atau perutusan khusus ἀπόστολος.
- source_word: τὴν διακονίαν μου
  choice: pelayanan saya
  rationale: '''Pelayanan'' merupakan padanan alami bagi διακονία dalam konteks tugas kerasulan dan tetap membawa gagasan melayani.'
- source_word: δοξάζω
  choice: saya memuliakan
  rationale: Padanan ini mempertahankan makna dasar memberi kemuliaan atau kehormatan. Catatan kaki menyediakan alternatif idiomatis yang menonjolkan penghargaan tinggi terhadap pelayanan.
theological_decisions:
- issue: Makna tindakan Paulus terhadap pelayanannya
  choice: Paulus memuliakan pelayanannya, bukan dirinya sendiri.
  alternative: Paulus menjunjung tinggi atau menghormati pelayanannya.
  rationale: Objek langsung δοξάζω adalah 'pelayanan saya'. Terjemahan tidak mengubahnya menjadi kebanggaan diri, tetapi juga tidak menghapus daya retoris kata sumber.
- issue: Rujukan ἔθνη / ἐθνῶν
  choice: orang-orang bukan Yahudi
  alternative: bangsa-bangsa
  rationale: Dalam konteks Roma 9–11, istilah ini terutama menunjuk kelompok non-Yahudi dalam perbandingannya dengan Israel. Alternatif leksikal tetap dicatat karena kata Yunani juga dapat berarti 'bangsa-bangsa'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai bahwa ὑμῖν berbentuk jamak; 'orang-orang bukan Yahudi' dipilih karena lebih mudah dipahami pembaca umum daripada istilah serapan 'bangsa-bangsa lain'. Struktur kalimat mempertahankan koma akhir karena ayat berlanjut ke ayat berikutnya.
