  rationale: Revisi menghilangkan kontras berlebihan pada δέ, mengganti “Selama” dengan hubungan dasar yang lebih sesuai bagi ἐφ’ ὅσον dalam bahasa Indonesia, dan memakai “menjunjung tinggi” sebagai padanan utama yang alami untuk δοξάζω. Koma akhir dipertahankan karena kalimat berlanjut ke ayat berikutnya.
