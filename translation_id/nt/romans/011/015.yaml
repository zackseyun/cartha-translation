  text: εἰ γὰρ ἡ ἀποβολὴ αὐτῶν καταλλαγὴ κόσμου, τίς ἡ πρόσλημψις εἰ μὴ ζωὴ ἐκ νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/015.yaml
  text: For if their rejection means reconciliation for the world[b][a], what will their acceptance mean if not life from the dead?
translation:
  language: id
  text: Sebab, jika penolakan mereka berarti pendamaian bagi dunia, apakah penerimaan mereka itu kalau bukan hidup dari antara orang mati?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “hidup dari antara orang mati” dapat menunjuk secara kiasan pada pembaruan rohani yang luar biasa atau, secara lebih khusus, pada kebangkitan. Paulus membiarkan ungkapan ini padat dan terbuka.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποβολὴ
  choice: penolakan
  rationale: Menyampaikan makna relasional tentang ditolak atau disisihkan dan membentuk kontras alami dengan πρόσλημψις.
- source_word: καταλλαγὴ
  choice: pendamaian
  rationale: Istilah yang lazim dan tepat dalam bahasa Indonesia untuk pemulihan hubungan dalam pemakaian Paulus.
- source_word: κόσμου
  choice: dunia
  rationale: Mempertahankan keluasan rumusan Yunani tanpa membatasinya secara eksplisit menjadi bangsa-bangsa bukan Yahudi.
- source_word: πρόσλημψις
  choice: penerimaan
  rationale: Mengungkapkan tindakan menerima kembali atau menerima dengan baik serta mempertahankan kontras dengan 'penolakan'.
- source_word: ζωὴ ἐκ νεκρῶν
  choice: kehidupan dari antara orang mati
  rationale: Terjemahan dekat dan alami yang mempertahankan ungkapan Paulus tetap padat serta tidak menentukan apakah maksudnya pembaruan rohani atau kebangkitan.
- source_word: εἰ μὴ
  choice: kalau bukan
  rationale: Sesuai dengan pertanyaan retoris dan mengantar jawaban yang diharapkan secara tegas namun alami.
- source_word: γὰρ
  choice: Sebab
  rationale: Menunjukkan hubungan penjelasan dengan argumen sebelumnya dalam ragam bahasa Indonesia yang wajar dan bermartabat.
theological_decisions:
- issue: Makna 'kehidupan dari antara orang mati'
  choice: Mempertahankan ungkapan terbuka tanpa menentukan satu rujukan khusus.
  alternative: Menafsirkannya sebagai kebangunan rohani yang luar biasa, kebangkitan akhir, atau ungkapan yang merangkum keduanya.
  rationale: Ungkapan Yunani singkat dan sugestif; terjemahan sebaiknya mempertahankan ketegangan antara makna figuratif dan eskatologis.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Susunan pertanyaan retoris dipertahankan, sedangkan ambiguitas teologis ungkapan penutup tidak diselesaikan secara berlebihan.
