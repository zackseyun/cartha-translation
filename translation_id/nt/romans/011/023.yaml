id: ROM.11.23
reference: Romans 11:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κἀκεῖνοι δέ, ἐὰν μὴ ⸀ἐπιμένωσι τῇ ἀπιστίᾳ, ἐγκεντρισθήσονται· δυνατὸς γάρ ⸂ἐστιν ὁ θεὸς⸃ πάλιν ἐγκεντρίσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/023.yaml
  text: And even they[a], if they do not continue in unbelief, will be grafted in[b]; for God is able to graft them in again.
translation:
  language: id
  text: Mereka pun, jika mereka tidak tetap dalam ketidakpercayaan, akan dicangkokkan; sebab Allah sanggup mencangkokkan mereka kembali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: Mereka pun
  rationale: Mengungkapkan daya aditif καί dan rujukan pronominal ἐκεῖνοι kepada cabang-cabang yang tidak percaya, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: ἐὰν μὴ ἐπιμένωσι
  choice: jika tidak terus
  rationale: Mempertahankan bentuk syarat dan nuansa keberlanjutan dari verba kini subjungtif ἐπιμένωσι.
- source_word: τῇ ἀπιστίᾳ
  choice: dalam ketidakpercayaan
  rationale: Konstruksi dengan ἐπιμένω secara alami diterjemahkan memakai 'dalam'; dalam konteks Roma 11, ἀπιστία terutama menunjuk pada tidak percaya, berlawanan dengan iman.
- source_word: ἐγκεντρισθήσονται
  choice: akan dicangkokkan
  rationale: Mempertahankan bentuk pasif futur dan metafora pencangkokan pohon zaitun tanpa menambahkan unsur 'kembali' yang belum dinyatakan pada verba pertama.
- source_word: δυνατὸς γάρ ἐστιν ὁ θεός
  choice: sebab Allah sanggup
  rationale: Terjemahan alami yang mempertahankan alasan yang diperkenalkan γάρ dan penegasan kemampuan Allah.
- source_word: πάλιν ἐγκεντρίσαι αὐτούς
  choice: mencangkokkan mereka kembali
  rationale: Kata 'kembali' secara eksplisit mewakili πάλιν dan menyampaikan pemulihan ke dalam pohon yang sama.
theological_decisions:
- issue: Makna ἀπιστία dalam konteks ini
  choice: ketidakpercayaan
  alternative: ketidaksetiaan
  rationale: Roma 11 secara langsung mempertentangkan iman dan ketidakpercayaan dalam pembahasan tentang cabang yang tetap atau dicangkokkan. Pilihan ini mempertahankan argumen langsung Paulus tanpa memperluasnya menjadi kategori kesetiaan perjanjian.
- issue: Letak gagasan pemulihan dalam metafora pencangkokan
  choice: Unsur 'kembali' hanya dinyatakan pada klausa kedua.
  alternative: Menerjemahkan verba pertama sebagai 'akan dicangkokkan kembali'.
  rationale: Dalam bahasa Yunani, πάλιν hanya muncul bersama infinitif pada klausa kedua. Terjemahan ini mempertahankan letak penandaan eksplisit tersebut sekaligus tetap menyampaikan pemulihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Dicangkokkan' mempertahankan metafora hortikultural; 'Mereka pun' terdengar alami dan menyampaikan daya aditif tanpa penjelasan berlebih.
