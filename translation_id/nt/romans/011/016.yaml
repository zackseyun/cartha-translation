id: ROM.11.16
reference: Romans 11:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀπαρχὴ ἁγία, καὶ τὸ φύραμα· καὶ εἰ ἡ ῥίζα ἁγία, καὶ οἱ κλάδοι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/016.yaml
  text: If the firstfruits are holy[a], so is the whole batch of dough; and if the root is holy, so are the branches.
translation:
  language: id
  text: Jika bagian pertama yang dipersembahkan itu kudus, seluruh adonan[a] juga kudus; dan jika akar itu kudus, cabang-cabangnya juga kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang dipakai menunjuk pada segumpal atau seluruh massa adonan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαρχὴ
  choice: bagian pertama yang dipersembahkan
  rationale: Menjaga gagasan tentang bagian pertama yang dikhususkan bagi Allah serta hubungan langsungnya dengan seluruh adonan. Ungkapan ini lebih jelas dalam bahasa Indonesia modern daripada terjemahan harfiah yang dapat disalahpahami sebagai hasil panen.
- source_word: ἁγία
  choice: kudus
  rationale: Mempertahankan kategori teologis dalam teks dan kesejajaran antara kedua gambaran tanpa menentukan lebih jauh sifat kekudusan tersebut.
- source_word: φύραμα
  choice: seluruh adonan
  rationale: Mengungkapkan massa atau campuran adonan secara alami dan memperjelas perbandingannya dengan bagian pertama.
- source_word: ῥίζα
  choice: akar
  rationale: Padanan botani yang langsung dan sesuai dengan metafora pohon zaitun dalam konteks Roma 11.
- source_word: κλάδοι
  choice: cabang-cabang
  rationale: Padanan alami untuk bentuk jamak dan konsisten dengan metafora pohon pada ayat-ayat berikutnya.
- source_word: εἰ δὲ ... καὶ ...; καὶ εἰ ... καὶ ...
  choice: Jika ... juga ...; dan jika ... juga ...
  rationale: Mencerminkan susunan ringkas bahasa Yunani. Kata 'juga' menyatakan akibat sejajar yang tersirat tanpa menambahkan penafsiran.
theological_decisions:
- issue: Sifat kekudusan yang menghubungkan bagian pertama dengan seluruh adonan serta akar dengan cabang-cabang
  choice: Memakai 'kudus' tanpa menjelaskan apakah kekudusan itu bersifat perjanjian, perwakilan, atau keselamatan.
  alternative: Menafsirkan secara khusus sebagai 'dikhususkan dalam perjanjian' atau 'diselamatkan'.
  rationale: Ayat ini menyatakan hubungan turunan melalui dua perumpamaan, tetapi tidak menjelaskan secara eksplisit jenis atau cakupan kekudusan itu. Terjemahan mempertahankan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Bentuk 'bagian pertama yang dipersembahkan' mempertahankan nuansa ibadah sekaligus membuat gambaran adonan mudah dipahami.
