  text: ἐρεῖς οὖν· Ἐξεκλάσθησαν κλάδοι ἵνα ἐγὼ ἐγκεντρισθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/019.yaml
  text: You will say then, “Branches were broken off so that I might be grafted in.”
translation:
  language: id
  text: Kalau begitu, kamu akan berkata, “Cabang-cabang dipatahkan supaya aku dicangkokkan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖς
  choice: kamu akan berkata
  rationale: Bentuk futur aktif indikatif orang kedua tunggal dipertahankan secara langsung; sapaan tunggal cocok dengan lawan bicara rekaan dalam gaya argumentasi Paulus.
- source_word: οὖν
  choice: kalau begitu
  rationale: Penghubung inferensial ini secara alami menyatakan kesimpulan atau tanggapan dalam dialog argumentatif bahasa Indonesia.
- source_word: Ἐξεκλάσθησαν
  choice: dipatahkan
  rationale: Bentuk pasif aoris diterjemahkan secara pasif dan mempertahankan gambaran cabang yang dipatahkan dalam metafora pohon zaitun.
- source_word: κλάδοι
  choice: cabang-cabang
  rationale: Padanan harfiah yang jelas dan lazim bagi bentuk jamak dalam konteks pohon zaitun.
- source_word: ἵνα
  choice: supaya
  rationale: Menyampaikan hubungan tujuan atau hasil secara wajar tanpa menentukan lebih jauh nuansa yang memang dapat bertumpang tindih.
- source_word: ἐγὼ
  choice: aku
  rationale: Pronomina yang dinyatakan secara eksplisit dalam bahasa Yunani dipertahankan, sehingga penonjolan diri dalam ucapan lawan bicara tetap terasa.
- source_word: ἐγκεντρισθῶ
  choice: dicangkokkan
  rationale: Bentuk pasif subjungtif diterjemahkan dengan istilah hortikultura Indonesia yang alami. Tidak ditambahkan objek atau lokasi yang tidak terdapat dalam ayat ini.
theological_decisions:
- issue: Apakah pembicara perlu dijelaskan sebagai lawan bicara rekaan dalam argumentasi Paulus
  choice: Mempertahankan sapaan langsung orang kedua tanpa keterangan tambahan dalam teks utama
  alternative: Kalau begitu, seseorang mungkin berkata
  rationale: Teks Yunani hanya menyatakan bahwa 'kamu akan berkata'; konteks memperlihatkan gaya dialog, tetapi identitas pembicara tidak perlu dijelaskan di dalam terjemahan.
- issue: Apakah klausa ἵνα harus ditegaskan sebagai pernyataan tentang maksud ilahi
  choice: Menerjemahkan klaim pembicara secara langsung sebagai 'supaya aku dicangkokkan'
  alternative: agar Allah dapat mencangkokkan aku
  rationale: Ayat ini menyajikan kesimpulan lawan bicara, bukan penjelasan eksplisit dari Paulus tentang maksud Allah. Menambahkan pelaku ilahi akan melampaui bunyi teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kalau begitu' lebih alami dalam dialog argumentatif daripada 'oleh karena itu', sedangkan 'dicangkokkan' mempertahankan metafora hortikultura dan bentuk pasif.
