  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Κύριε, τοὺς προφήτας σου ἀπέκτειναν, ⸀τὰ θυσιαστήριά σου κατέσκαψαν, κἀγὼ ὑπελείφθην μόνος, καὶ ζητοῦσιν τὴν ψυχήν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/003.yaml
  text: Lord[a], they killed your prophets, they tore down your altars, and I alone was left, and they are seeking my life.
translation:
  language: id
  text: “Tuhan, mereka telah membunuh nabi-nabi-Mu, merobohkan mezbah-mezbah-Mu, dan hanya aku seorang yang tersisa. Mereka sedang mengincar nyawaku.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “mereka mencari nyawaku”; maksud ungkapan Yunani ini ialah bahwa mereka hendak membunuh aku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan langsung kepada Allah; “Tuhan” adalah padanan baku, alami, dan sesuai dalam konteks Perjanjian Baru.
- source_word: ἀπέκτειναν
  choice: telah membunuh
  rationale: Menyatakan tindakan membunuh tanpa menambahkan nuansa hukum atau moral yang tidak dinyatakan secara leksikal oleh verba tersebut.
- source_word: τὰ θυσιαστήριά σου
  choice: mezbah-mezbah-Mu
  rationale: θυσιαστήριον menunjuk pada mezbah korban; “mezbah” sudah jelas dalam konteks dan tidak perlu diperberat menjadi “mezbah-mezbah korban”.
- source_word: κατέσκαψαν
  choice: merobohkan
  rationale: Mengungkapkan tindakan meruntuhkan atau menghancurkan bangunan secara konkret dan alami bagi mezbah.
- source_word: κἀγὼ ὑπελείφθην μόνος
  choice: dan hanya aku seorang yang tersisa
  rationale: Mempertahankan penekanan numerik μόνος serta makna pasif ὑπελείφθην, tanpa memberi kesan terutama tentang kesepian emosional.
- source_word: ζητοῦσιν τὴν ψυχήν μου
  choice: mereka sedang mengincar nyawaku
  rationale: Ungkapan ini berarti bahwa mereka berusaha merenggut hidup Elia. “Mengincar nyawaku” mempertahankan citra pencarian yang mengancam dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna ψυχή dalam ungkapan ancaman terhadap Elia
  choice: nyawaku
  alternative: jiwaku
  rationale: Dalam konteks ini ψυχή menunjuk pada hidup atau nyawa Elia, bukan dimaksudkan sebagai pernyataan tentang unsur nonjasmani manusia. “Nyawaku” mencegah masuknya persoalan antropologi teologis yang tidak sedang dibahas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk jamak ulang dipakai untuk nabi dan mezbah agar jumlah jamak sumber tampak jelas; pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab bahasa Indonesia.
