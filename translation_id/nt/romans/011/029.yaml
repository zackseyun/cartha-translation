  text: For the gifts and the calling of God are irrevocable[a].
translation:
  language: id
  text: Sebab karunia-karunia dan panggilan Allah tidak ditarik kembali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak disesali” atau “tidak dicabut.” Secara harfiah, “tanpa penyesalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμεταμέλητα
  choice: tidak akan ditarik kembali
  rationale: Kata sifat ini berarti tidak disesali atau tidak dibatalkan/ditarik kembali. Dalam konteks karunia dan panggilan Allah, ungkapan ini secara alami menyatakan bahwa Allah tidak mencabutnya, tanpa memperluas makna menjadi sekadar 'tidak berubah'.
- source_word: γὰρ
  choice: Sebab
  rationale: Partikel ini memberikan dasar atau penjelasan bagi pernyataan sebelumnya; 'Sebab' mempertahankan hubungan argumentatif tersebut.
- source_word: τὰ χαρίσματα
  choice: karunia-karunia
  rationale: Bentuk jamak χάρισμα menunjuk pada pemberian yang berasal dari anugerah. 'Karunia-karunia' mempertahankan bentuk jamak dan nuansa pemberian ilahi secara wajar dalam bahasa Indonesia.
- source_word: ἡ κλῆσις
  choice: panggilan
  rationale: Dalam pemakaian Paulus, κλῆσις memiliki bobot teologis sebagai panggilan Allah. 'Panggilan' mempertahankan bobot itu tanpa menentukan lebih jauh cara kerja atau cakupannya.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Genitif Yunani dapat menyatakan sumber atau kepunyaan. Susunan alami 'karunia-karunia dan panggilan Allah' mempertahankan keluasan hubungan tersebut.
theological_decisions:
- issue: Cakupan 'karunia-karunia dan panggilan Allah'
  choice: Frasa dipertahankan tanpa secara eksplisit membatasi atau memperluas acuannya.
  alternative: Menjelaskannya secara khusus sebagai hak istimewa dan panggilan Israel, atau menjadikannya asas umum mengenai semua karunia dan panggilan Allah.
  rationale: Konteks langsung Roma 9–11 sangat berkenaan dengan Israel, tetapi frasa Yunani pada ayat ini tidak menyebutkan objeknya kembali. Terjemahan tidak boleh menyelesaikan ketegangan tersebut di dalam teks utama.
- issue: Nuansa ἀμεταμέλητα
  choice: tidak akan ditarik kembali
  alternative: tidak disesali; tidak dapat dibatalkan; tanpa penyesalan
  rationale: Pilihan utama menyampaikan implikasi kontekstual bahwa Allah tidak mencabut karunia dan panggilan-Nya, sementara catatan kaki mempertahankan kemungkinan nuansa leksikal 'tidak disesali'.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Bentuk ulang 'karunia-karunia' dipakai untuk mempertahankan jamak Yunani; struktur kalimat tetap alami bagi pembaca umum.
