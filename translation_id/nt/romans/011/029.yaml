    rationale: “Secara lebih harfiah ... ‘tanpa penyesalan’” kurang langsung untuk adjektiva ἀμεταμέλητα. Catatan dapat menyajikan “tidak disesali” sebagai alternatif utama dan menyebut “tanpa penyesalan” sebagai ungkapan yang lebih harfiah/tradisional.
