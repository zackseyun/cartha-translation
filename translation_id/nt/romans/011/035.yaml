  text: ἢ τίς προέδωκεν αὐτῷ, καὶ ἀνταποδοθήσεται αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/035.yaml
  text: Or who has first given to him[b][a], and it will be repaid to him?
translation:
  language: id
  text: Atau siapakah yang lebih dahulu memberi kepada-Nya,[a] dan akan dibayar kembali kepadanya?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah memberi kepada-Nya lebih dahulu.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, tidak seorang pun pernah memberi kepada Allah sedemikian rupa sehingga Allah berkewajiban membalasnya.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Atau
  rationale: Memperkenalkan pertanyaan retoris berikutnya dalam rangkaian dan mempertahankan hubungan dengan ayat sebelumnya.
- source_word: τίς
  choice: siapakah
  rationale: Padanan interogatif yang alami dan bermartabat untuk orang dalam pertanyaan retoris.
- source_word: προέδωκεν
  choice: lebih dahulu memberi
  rationale: 'Mempertahankan nuansa prioritas pada verba majemuk: seseorang seolah-olah memberi terlebih dahulu sehingga menimbulkan kewajiban membalas.'
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Pronomina dipertahankan; kapitalisasi memperjelas bahwa acuannya adalah Allah dalam konteks tanpa mengganti pronomina Yunani dengan nomina.
- source_word: καὶ
  choice: sehingga
  rationale: Dalam pertanyaan retoris ini, penghubung menunjukkan konsekuensi logis dari pemberian yang dibayangkan. 'Sehingga' lebih alami dalam bahasa Indonesia daripada koordinasi harfiah dengan 'dan'.
- source_word: ἀνταποδοθήσεται αὐτῷ
  choice: ia harus dibayar kembali
  rationale: Pasif futur menyatakan pembalasan atau pembayaran kembali kepada orang yang memberi. 'Ia' mengacu pada orang tersebut, sedangkan 'harus' menyampaikan implikasi kewajiban dalam struktur retoris tanpa menyatakan bahwa kewajiban itu sungguh ada.
theological_decisions:
- issue: Acuan αὐτῷ yang pertama
  choice: kepada-Nya, yakni kepada Allah dalam konteks
  alternative: kepada Allah
  rationale: Mempertahankan bentuk pronominal teks Yunani sambil menjadikan acuannya jelas melalui kapitalisasi.
- issue: Nuansa προέδωκεν dan kemungkinan Allah berutang
  choice: lebih dahulu memberi ... sehingga ia harus dibayar kembali
  alternative: memberi kepada-Nya, dan akan dibayar kembali kepadanya
  rationale: 'Terjemahan mempertahankan prioritas tindakan dan daya retoris ayat: tidak seorang pun dapat mendahului Allah dalam memberi lalu menempatkan-Nya di bawah kewajiban membalas. Bentuk pertanyaan tetap menjaga bahwa keadaan ini bersifat hipotetis dan disangkal.'
- issue: Subjek tersirat dalam ἀνταποδοθήσεται αὐτῷ
  choice: ia harus dibayar kembali
  alternative: itu akan dibayarkan kembali kepadanya
  rationale: Bahasa Indonesia secara alami memakai orang yang menerima pembayaran sebagai subjek pasif. Pilihan ini tidak menentukan benda tertentu sebagai sesuatu yang dibayarkan kembali.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Bentuk retoris dipertahankan, dengan susunan 'sehingga' agar hubungan antara pemberian lebih dahulu dan tuntutan pembayaran kembali terdengar alami. Semua penanda catatan kaki muncul dalam teks utama.
