  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ· ἐπὶ μὲν τοὺς πεσόντας ⸀ἀποτομία, ἐπὶ δὲ σὲ ⸂χρηστότης θεοῦ⸃, ἐὰν ⸀ἐπιμένῃς τῇ χρηστότητι, ἐπεὶ καὶ σὺ ἐκκοπήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/022.yaml
  text: 'Consider[a], then, the kindness and severity of God: severity toward those who have fallen, but God''s kindness toward you, if you continue in his kindness[b]; otherwise you too will be cut off.'
translation:
  language: id
  text: 'Jadi, perhatikanlah kemurahan dan kekerasan Allah: kekerasan terhadap mereka yang telah jatuh, tetapi kemurahan Allah terhadap kamu, jika kamu tetap berada dalam kemurahan-Nya; jika tidak, kamu pun akan dipotong.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dipatahkan.” Kata Yunani ini secara harfiah berarti “dipotong”; “dipatahkan” merupakan alternatif yang mengikuti gambaran cabang-cabang pohon zaitun dalam konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: perhatikanlah
  rationale: Bentuk imperatif ini menyerukan perhatian dan perenungan; “perhatikanlah” alami dalam bahasa Indonesia modern serta mempertahankan daya nasihatnya.
- source_word: χρηστότητα / χρηστότης
  choice: kemurahan
  rationale: Istilah ini menunjuk pada kebaikan hati atau kebajikan Allah. “Kemurahan” jelas, relasional, dan membentuk kontras yang wajar dengan “ketegasan”.
- source_word: ἀποτομίαν / ἀποτομία
  choice: ketegasan
  rationale: Nomina ini mengandung gagasan tindakan yang tajam dan tanpa kelonggaran dalam penghukuman. “Ketegasan” mempertahankan kontras tanpa melebih-lebihkan menjadi kekejaman.
- source_word: ἐπὶ μὲν τοὺς πεσόντας
  choice: terhadap mereka yang telah jatuh
  rationale: “Terhadap” menyampaikan arah atau sasaran dalam konstruksi kontras ini, sedangkan “telah jatuh” menyatakan keadaan akibat kejatuhan mereka.
- source_word: ἐπὶ δὲ σὲ
  choice: terhadap kamu
  rationale: Mempertahankan kesejajaran dengan frasa sebelumnya dan arah kemurahan Allah kepada pihak yang disapa.
- source_word: ἐὰν ἐπιμένῃς τῇ χρηστότητι
  choice: jika kamu tetap berada dalam kemurahan-Nya
  rationale: “Tetap berada” menyampaikan kelanjutan dalam lingkup kemurahan Allah; “-Nya” memperjelas rujukan yang sudah nyata dari konteks.
- source_word: ἐπεὶ
  choice: jika tidak
  rationale: Dalam konteks syarat ini, kata tersebut memperkenalkan akibat negatif bila syarat sebelumnya tidak terpenuhi; “jika tidak” alami dan tepat dalam bahasa Indonesia.
- source_word: ἐκκοπήσῃ
  choice: akan dipotong
  rationale: Bentuk pasif mendatang ἐκκόπτω secara langsung berarti “akan dipotong”. Ungkapan ini juga tetap sesuai dengan gambaran pohon zaitun dalam konteks.
theological_decisions:
- issue: Peringatan bersyarat mengenai kemurahan dan penghakiman Allah
  choice: 'Mempertahankan syarat dan peringatan secara langsung: kemurahan Allah terhadap pihak yang disapa terkait dengan tetap berada dalam kemurahan-Nya; jika tidak, ia pun akan dipotong.'
  alternative: Melunakkan peringatan menjadi sekadar hipotesis retoris, atau menafsirkannya secara eksplisit menurut doktrin denominasi tertentu tentang ketekunan, kemurtadan, maupun penerapan korporat atau individual.
  rationale: Teks Yunani menyampaikan nasihat dan peringatan bersyarat yang nyata, tetapi tidak menyelesaikan perdebatan teologis yang lebih luas. Terjemahan karena itu mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang lugas dan bermartabat. “Jadi” menandai hubungan kesimpulan οὖν; pengulangan “ketegasan” dan “kemurahan” dipertahankan untuk mencerminkan struktur retoris teks Yunani.
