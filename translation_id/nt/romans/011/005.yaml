  verdict: revise
  source_fidelity: Draf mengomunikasikan adanya kelompok sisa pada masa kini, tetapi mengubah struktur κατ’ ἐκλογὴν χάριτος menjadi sifat bagi “sisa” (“yang terpilih”) dan menafsirkan hubungan anugerah sebagai dasar pemilihan (“berdasarkan”). Teks revisi mempertahankan frasa preposisional serta keterbukaan hubungan genitifnya. “Telah ada” menyampaikan secara wajar hasil kini dari perfek γέγονεν.
  naturalness: “Jadi, pada masa sekarang ini pun telah ada suatu sisa” adalah bahasa Indonesia baku dan jelas. “Menurut pemilihan anugerah” agak padat, tetapi dapat diterima dalam register Alkitab yang bermartabat dan lebih setia pada kepadatan serta ambiguitas frasa Yunani daripada parafrasa yang mempersempitnya.
  terminology: “Sisa,” “pemilihan,” dan “anugerah” dipertahankan sebagai istilah yang lazim dan sesuai. “Pemilihan anugerah” mempertahankan ἐκλογή sebagai nomina dan tidak menetapkan secara sepihak apakah χάριτος terutama menyatakan dasar, sumber, atau sifat pemilihan.
  issues:
  - severity: medium
    issue: κατ’ ἐκλογὴν χάριτος dialihkan menjadi “yang terpilih berdasarkan anugerah.”
    rationale: Alih bentuk ini menjadikan “terpilih” sebagai sifat langsung dari “sisa,” padahal Yunani menyatakan bahwa adanya sisa itu adalah “menurut pemilihan anugerah.” Selain itu, “berdasarkan” memilih secara lebih tegas pembacaan anugerah sebagai dasar pemilihan, sedangkan genitif χάριτος tetap ringkas dan tidak sepenuhnya dispesifikkan.
  - severity: low
    issue: Nuansa perfek γέγονεν tidak dinyatakan dalam “ada.”
    rationale: “Ada” dapat menyatakan keadaan kini, tetapi “telah ada” dengan lebih baik mengungkap keadaan kini yang telah terwujud.
  - severity: low
    issue: Unsur inferensial οὖν kurang tampak dalam “Demikian juga.”
    rationale: “Jadi” secara eksplisit menghubungkan ayat ini sebagai kesimpulan dari contoh Elia sebelumnya, sementara “pun” mempertahankan unsur καὶ.
