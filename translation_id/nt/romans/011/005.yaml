  yaml_path: translation/nt/romans/011/005.yaml
  text: So then, in the present time also, a remnant has come to be according to the election of grace.
translation:
  language: id
  text: Jadi, pada masa sekarang ini pun telah ada suatu sisa menurut pemilihan anugerah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menurut pemilihan yang berdasarkan anugerah,” “menurut pemilihan oleh anugerah,” atau “menurut pemilihan yang bercirikan anugerah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν καὶ
  choice: Demikian juga
  rationale: Ungkapan ini menarik kesimpulan dari teladan Elia pada konteks sebelumnya sekaligus menandai kesejajaran dengan keadaan pada masa sekarang.
- source_word: ἐν τῷ νῦν καιρῷ
  choice: pada masa sekarang
  rationale: Frasa ini menunjuk pada masa atau zaman kini dan secara alami mempertahankan kontras waktu dengan zaman Elia.
- source_word: λεῖμμα
  choice: suatu sisa
  rationale: Kata 'sisa' menyatakan kelompok kecil yang masih ada dan mempertahankan gema konsep umat yang tersisa dalam Kitab Suci.
- source_word: κατ’ ἐκλογὴν χάριτος
  choice: yang terpilih berdasarkan anugerah
  rationale: Rumusan ini mempertahankan gagasan pemilihan dan anugerah dalam bahasa Indonesia yang jelas, tanpa menentukan secara berlebihan apakah genitif χάριτος terutama menyatakan sumber, dasar, atau sifat pemilihan.
- source_word: γέγονεν
  choice: ada
  rationale: Dalam konteks ini bentuk perfek menyatakan keadaan yang telah terwujud dan masih berlaku. 'Ada' menghasilkan bahasa Indonesia yang alami; nuansa terwujudnya keadaan tersebut tersirat dalam kesimpulan Paulus.
theological_decisions:
- issue: Penerjemahan ἐκλογή dalam konteks teologis Paulus yang diperdebatkan
  choice: terpilih
  alternative: pemilihan
  rationale: Bentuk verbal-adjektival ini menyampaikan konsep pemilihan secara jelas dan alami tanpa memasukkan sistem teologis tertentu.
- issue: Hubungan anugerah dengan pemilihan dalam κατ’ ἐκλογὴν χάριτος
  choice: berdasarkan anugerah
  alternative: oleh pemilihan anugerah; menurut pemilihan karena anugerah
  rationale: '''Berdasarkan anugerah'' menjaga anugerah sebagai landasan atau prinsip pemilihan, tetapi catatan kaki mempertahankan kemungkinan hubungan gramatikal lain tanpa memaksakan penafsiran yang lebih sempit.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan istilah 'sisa', gagasan pemilihan, serta hubungan ringkas dan ambigu antara pemilihan dan anugerah.
