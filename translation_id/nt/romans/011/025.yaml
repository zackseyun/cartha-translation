  terminology: '''Rahasia'' adalah padanan Indonesia yang wajar untuk μυστήριον, dan catatan kaki dengan tepat menjelaskan pemakaian Paulus. ''Pengerasan'' mempertahankan istilah teologis πώρωσις. ''Kepenuhan bangsa-bangsa lain'' dengan tepat membiarkan πλήρωμα terbuka; catatan alternatif perlu dirumuskan sebagai jumlah lengkap orang dari bangsa-bangsa lain, bukan jumlah bangsa-bangsa itu sendiri.'
