id: ROM.11.25
reference: Romans 11:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλω ὑμᾶς ἀγνοεῖν, ἀδελφοί, τὸ μυστήριον τοῦτο, ἵνα μὴ ⸀ἦτε ἑαυτοῖς φρόνιμοι, ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/025.yaml
  text: 'For I do not want you to be unaware[a], brothers, of this mystery, so that you may not be wise in your own sight: a partial hardening has come upon Israel until the fullness of the Gentiles has come in[b],'
translation:
  language: id
  text: 'Sebab, Saudara-saudara, aku tidak ingin kalian tidak mengetahui rahasia ini[a], supaya kalian tidak menganggap diri sendiri bijaksana: sebagian Israel telah mengalami pengerasan sampai kepenuhan bangsa-bangsa lain masuk[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam tulisan Paulus, “rahasia” adalah maksud Allah yang dahulu tersembunyi tetapi kemudian disingkapkan.
    reason: clarification
  - marker: b
    text: Atau “sampai jumlah lengkap orang-orang dari bangsa-bangsa lain masuk.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγνοεῖν
  choice: tidak mengetahui
  rationale: Dalam rumus Paulus οὐ θέλω ὑμᾶς ἀγνοεῖν, ungkapan ini berarti tidak mengetahui atau tidak memahami suatu hal; bentuk ini alami dan tidak bernada merendahkan.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan Indonesia ini wajar bagi jemaat campuran dan tidak perlu diberi penanda gender seperti dalam bahasa Inggris.
- source_word: μυστήριον
  choice: rahasia
  rationale: Dalam pemakaian Paulus, kata ini menunjuk pada maksud ilahi yang dahulu tersembunyi lalu disingkapkan; 'rahasia' lebih alami dalam bahasa Indonesia daripada 'misteri' tanpa menghilangkan nuansa tersebut.
- source_word: ἵνα μὴ ἦτε ἑαυτοῖς φρόνιμοι
  choice: supaya kalian tidak menganggap diri bijaksana
  rationale: Ungkapan ini menyampaikan peringatan agar pembaca tidak menilai dirinya sendiri bijaksana atau menjadi tinggi hati, sambil mempertahankan bentuk klausa tujuan.
- source_word: πώρωσις
  choice: pengerasan
  rationale: Istilah ini mempertahankan gambaran keadaan tidak peka secara rohani dan sesuai dengan register teologis konteks.
- source_word: ἀπὸ μέρους
  choice: sebagian dari Israel
  rationale: Frasa ini ditempatkan pada cakupan Israel yang mengalami pengerasan, dengan tetap mempertahankan gagasan bahwa pengerasan itu tidak mencakup Israel secara keseluruhan.
- source_word: τῷ Ἰσραὴλ γέγονεν
  choice: Israel telah mengalami
  rationale: Bentuk ini alami dalam bahasa Indonesia dan menyampaikan keadaan kini sebagai hasil peristiwa yang telah terjadi, sesuai nuansa perfektum γέγονεν.
- source_word: πλήρωμα
  choice: kepenuhan
  rationale: Pilihan ini mempertahankan keluasan makna πλήρωμα dan tidak menentukan apakah yang dimaksud adalah jumlah lengkap, keikutsertaan penuh, atau penyelesaian eskatologis.
- source_word: τῶν ἐθνῶν
  choice: bangsa-bangsa lain
  rationale: Dalam pertentangannya dengan Israel, frasa ini menunjuk pada bangsa-bangsa non-Yahudi; ungkapan Indonesia ini jelas dan lazim.
- source_word: εἰσέλθῃ
  choice: masuk
  rationale: Sesudah 'sampai', bentuk ini secara alami menandai batas waktu atau kondisi tercapainya peristiwa tersebut tanpa menambahkan objek yang tidak disebutkan.
theological_decisions:
- issue: Makna 'kepenuhan bangsa-bangsa lain'
  choice: Dipertahankan sebagai 'kepenuhan bangsa-bangsa lain' tanpa menjelaskan secara khusus apa yang penuh.
  alternative: seluruh jumlah bangsa-bangsa lain
  rationale: Ungkapan Yunani dapat menunjuk pada jumlah lengkap, keikutsertaan penuh, atau penyelesaian. Terjemahan utama mempertahankan ketegangan ini, sedangkan catatan kaki memberi alternatif umum.
- issue: Cakupan pengerasan Israel
  choice: Diterjemahkan 'sebagian dari Israel telah mengalami pengerasan'.
  alternative: pengerasan telah terjadi atas Israel untuk sebagian
  rationale: ἀπὸ μέρους paling wajar dipahami membatasi cakupan pengerasan, bukan secara tegas menentukan lamanya. Susunan Indonesia memperjelas hal itu tanpa menyatakan kelompok mana yang termasuk.
- issue: Referen implisit dari 'masuk'
  choice: Objek atau tujuan masuk tidak ditambahkan.
  alternative: masuk ke dalam keselamatan
  rationale: Teks Yunani hanya memakai εἰσέλθῃ tanpa pelengkap eksplisit. Menambahkan 'ke dalam keselamatan' akan menyelesaikan sesuatu yang dibiarkan tersirat oleh sumber.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. 'Kalian' dipakai untuk menandai orang kedua jamak secara jelas; 'Saudara-saudara' mempertahankan sapaan pastoral. Tanda koma menampilkan alur argumentasi Paulus tanpa membuat kalimat menjadi kaku.
