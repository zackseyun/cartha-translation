  source_fidelity: 'Makna pokok draft setia pada teks Yunani: Paulus menyatakan bahwa ia tidak ingin para pembaca tidak mengetahui suatu rahasia, dengan tujuan agar mereka tidak menganggap diri sendiri bijaksana; pengerasan itu bersifat sebagian dalam kaitannya dengan Israel dan berlangsung sampai kepenuhan bangsa-bangsa lain masuk. Namun, susunan klausa tentang pengerasan dapat dibuat lebih jelas sehingga pembatas ἀπὸ μέρους secara langsung membatasi Israel yang mengalami pengerasan.'
