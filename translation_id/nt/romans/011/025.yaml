  to: 'Sebab, Saudara-saudara, aku tidak ingin kalian tidak mengetahui rahasia ini[a], supaya kalian tidak menganggap diri sendiri bijaksana: sebagian Israel telah mengalami pengerasan sampai kepenuhan bangsa-bangsa lain masuk[b].'
