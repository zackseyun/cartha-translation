  text: καὶ οὕτως πᾶς Ἰσραὴλ σωθήσεται· καθὼς γέγραπται· Ἥξει ἐκ Σιὼν ὁ ⸀ῥυόμενος, ἀποστρέψει ἀσεβείας ἀπὸ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/026.yaml
  text: 'And in this way all Israel will be saved[a], just as it is written: “The Deliverer will come from Zion[c][b]; he will turn away ungodliness from Jacob.”'
translation:
  language: id
  text: 'Dengan cara demikian, seluruh Israel[b] akan diselamatkan[a], seperti yang tertulis: “Pembebas akan datang dari Sion; ia akan menyingkirkan kefasikan dari Yakub.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Demikianlah seluruh Israel akan diselamatkan.” Kata Yunani οὕτως dapat berarti “demikian,” tetapi dalam konteks ini kemungkinan menunjuk pada cara atau proses yang baru saja diuraikan.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “seluruh Israel” diperdebatkan penafsirannya. Terjemahan ini mempertahankan ungkapan Yunani tanpa menentukan apakah yang dimaksud adalah Israel etnis secara keseluruhan, kaum sisa yang percaya, atau umat Allah secara penuh.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: dengan cara demikian
  rationale: Menjaga makna cara atau proses yang menunjuk pada uraian sebelumnya, tanpa mengubahnya menjadi sekadar penanda hasil.
- source_word: πᾶς Ἰσραήλ
  choice: seluruh Israel
  rationale: Padanan Indonesia yang alami dan tetap mempertahankan keterbukaan rujukan ungkapan Yunani tersebut.
- source_word: σωθήσεται
  choice: akan diselamatkan
  rationale: Bentuk pasif futur ini dalam konteks Paulus mengandung bobot keselamatan, yang dipertahankan oleh padanan tersebut.
- source_word: καθὼς γέγραπται
  choice: seperti yang tertulis
  rationale: Rumus kutipan Kitab Suci yang alami dalam bahasa Indonesia dan menyatakan kesesuaian dengan pernyataan sebelumnya.
- source_word: Ἥξει
  choice: akan datang
  rationale: Padanan langsung dan wajar untuk gaya nubuat.
- source_word: ἐκ Σιὼν
  choice: dari Sion
  rationale: Padanan alami bagi ἐκ yang tetap mempertahankan Sion sebagai titik asal.
- source_word: ὁ ῥυόμενος
  choice: Pembebas
  rationale: Partisip substantival diterjemahkan sebagai sebutan bergaya gelar yang ringkas, berbobot, dan sesuai dengan konteks penyelamatan.
- source_word: ἀποστρέψει
  choice: akan menyingkirkan
  rationale: Dalam konstruksi dengan ἀπὸ, kata ini menyatakan tindakan menjauhkan kefasikan dari Yakub; 'menyingkirkan' alami dalam bahasa Indonesia tanpa menentukan mekanismenya.
- source_word: ἀσεβείας
  choice: kefasikan
  rationale: Menyampaikan daya moral-religius istilah Yunani dalam register Kitab Suci yang tetap dikenal pembaca modern.
- source_word: ἀπὸ Ἰακώβ
  choice: dari Yakub
  rationale: Mempertahankan nama Yakub dan susunan puitis kutipan tanpa menyamakannya secara eksplisit dengan Israel.
theological_decisions:
- issue: Rujukan 'seluruh Israel'
  choice: Ungkapan 'seluruh Israel' dipertahankan tanpa penjelasan interpretatif di dalam teks.
  alternative: Seluruh Israel etnis; kaum sisa yang percaya; atau umat Allah secara penuh termasuk bangsa-bangsa lain.
  rationale: Bahasa Yunani tidak memutuskan perdebatan tersebut secara eksplisit, sehingga terjemahan tidak mempersempitnya.
- issue: Identitas ὁ ῥυόμενος
  choice: '''Pembebas'' ditulis sebagai sebutan bergaya gelar.'
  alternative: '''orang yang membebaskan'' atau ''sang pembebas''.'
  rationale: Bentuk partisip Yunani berfungsi secara substantival dan memiliki bobot gelar dalam kutipan ini; pilihan tersebut tidak menambahkan nama atau identifikasi yang tidak dinyatakan.
- issue: Daya ἀποστρέψει
  choice: Diterjemahkan 'menyingkirkan kefasikan'.
  alternative: '''akan memalingkan kefasikan'' atau ''akan membuat [mereka] berbalik dari kefasikan''.'
  rationale: Objek gramatikalnya adalah 'kefasikan', bukan orang-orang yang secara eksplisit dibuat bertobat; terjemahan menghindari penambahan objek manusia yang tidak tertulis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kutipan dibuat ringkas dan puitis. Semua penanda catatan kaki muncul di dalam teks; catatan tentang 'dari Sion' tidak dipertahankan karena alternatif Inggris 'out of Zion' tidak menimbulkan alternatif terjemahan Indonesia yang bermakna.
