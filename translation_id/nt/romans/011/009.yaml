id: ROM.11.9
reference: Romans 11:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ Δαυὶδ λέγει· Γενηθήτω ἡ τράπεζα αὐτῶν εἰς παγίδα καὶ εἰς θήραν καὶ εἰς σκάνδαλον καὶ εἰς ἀνταπόδομα αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/009.yaml
  text: And David says[b][a], “Let their table become a snare and a trap and a stumbling block and a retribution to them,”
translation:
  language: id
  text: Dan Daud berkata, “Biarlah meja mereka menjadi jerat dan perangkap[a] dan batu sandungan dan balasan bagi mereka.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jerat dan perangkap berburu”; kedua istilah ini berdekatan makna dan sama-sama menggambarkan penjebakan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “pembalasan” atau “ganjaran setimpal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: Daud
  rationale: Menggunakan bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini Yunani memperkenalkan kutipan sebagai present historis/literer; dalam bahasa Indonesia, “berkata” merupakan pengantar kutipan yang alami tanpa mengharuskan penandaan waktu eksplisit.
- source_word: Γενηθήτω
  choice: Biarlah ... menjadi
  rationale: Mempertahankan daya imperatif-jusif dari kutipan, bukan mengubahnya menjadi ramalan belaka.
- source_word: τράπεζα
  choice: meja
  rationale: Mempertahankan gambaran konkret dalam teks sumber tanpa menafsirkannya secara sempit sebagai perjamuan atau persediaan makanan.
- source_word: παγίδα
  choice: jerat
  rationale: Menyampaikan gambaran alat penjebak serta membedakannya dari istilah berikutnya.
- source_word: θήραν
  choice: perangkap
  rationale: Dalam rangkaian ini kata tersebut berfungsi sebagai istilah yang berdekatan makna dengan “jerat”; “perangkap” alami dan tetap mempertahankan citra penangkapan.
- source_word: σκάνδαλον
  choice: batu sandungan
  rationale: Mempertahankan metafora sesuatu yang menyebabkan orang tersandung atau jatuh, bukan sekadar sesuatu yang menyinggung perasaan.
- source_word: ἀνταπόδομα
  choice: balasan
  rationale: Menyampaikan gagasan imbal balik atau ganjaran setimpal tanpa menjadikan sifat hukumannya lebih eksplisit daripada kata Yunani itu sendiri.
- source_word: αὐτοῖς
  choice: bagi mereka
  rationale: Ungkapan ini alami dalam bahasa Indonesia sebagai pelengkap “balasan” dan mempertahankan arah balasan tersebut kepada mereka.
theological_decisions:
- issue: Kutipan kutukan dari Mazmur 69:22
  choice: 'Mempertahankan bentuk permohonan/imperatif langsung: “Biarlah meja mereka menjadi ...”'
  alternative: “Meja mereka akan menjadi ...” atau “Semoga meja mereka menjadi ...”
  rationale: Imperatif Yunani menyatakan seruan jusif yang keras. Terjemahan tidak melunakkannya menjadi prediksi ataupun menghilangkan ketegangan teologis dalam kutipan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “dan” dipertahankan untuk mencerminkan rangkaian καὶ dalam teks Yunani dan memberi bobot retoris pada setiap unsur.
