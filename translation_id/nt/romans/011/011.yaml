id: ROM.11.11
reference: Romans 11:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν, εἰς τὸ παραζηλῶσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/011.yaml
  text: So I say[a], they did not stumble so as to fall, did they? May it never be! Rather, by their trespass salvation has come to the Gentiles[d][c][b], to make them jealous.
translation:
  language: id
  text: 'Jadi, saya bertanya: Apakah mereka tersandung supaya jatuh[a]? Sekali-kali tidak! Sebaliknya, melalui pelanggaran mereka, keselamatan telah datang kepada orang-orang bukan Yahudi[b], untuk membuat mereka cemburu[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sehingga mereka jatuh.” Bahasa Yunani membedakan antara “tersandung” dan “jatuh,” dan pertanyaan ini mengharapkan jawaban “tidak.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “bangsa-bangsa”; dalam konteks ini yang dimaksud ialah orang-orang bukan Yahudi.'
    reason: lexical_alternative
  - marker: c
    text: Atau “untuk membangkitkan kecemburuan mereka”; kecemburuan ini mungkin mencakup dorongan agar mereka menginginkan keselamatan yang sama.
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Jadi, saya bertanya
  rationale: Dalam alur wacana, λέγω memperkenalkan pertanyaan retoris Paulus, sedangkan οὖν menghubungkannya dengan uraian sebelumnya. Ungkapan ini alami dalam bahasa Indonesia.
- source_word: μὴ ἔπταισαν ἵνα πέσωσιν
  choice: Mereka tersandung supaya jatuh, bukan?
  rationale: Bentuk pertanyaan dengan μή mengharapkan jawaban negatif. Terjemahan ini mempertahankan perbedaan antara 'tersandung' dan 'jatuh' serta tidak menambahkan gagasan seperti kehancuran yang mutlak atau tidak dapat dipulihkan.
- source_word: μὴ γένοιτο
  choice: Tidak mungkin!
  rationale: Ungkapan ini menyampaikan penolakan Paulus yang sangat tegas dengan bahasa Indonesia modern dan wajar.
- source_word: τῷ αὐτῶν παραπτώματι
  choice: karena pelanggaran mereka
  rationale: παράπτωμα menunjuk pada langkah salah atau pelanggaran. Dativus di sini dapat menyatakan sarana atau sebab; 'karena' menghasilkan hubungan yang jelas tanpa mengubah bobot moral istilah tersebut.
- source_word: ἡ σωτηρία
  choice: keselamatan
  rationale: Dalam Surat Roma, σωτηρία memuat arti soteriologis yang kuat, dan 'keselamatan' merupakan padanan Indonesia yang baku.
- source_word: τοῖς ἔθνεσιν
  choice: kepada bangsa-bangsa bukan Yahudi
  rationale: Secara harfiah ἔθνη berarti 'bangsa-bangsa', tetapi dalam pertentangan Yahudi–non-Yahudi di Roma 9–11, istilah ini menunjuk kepada orang atau bangsa bukan Yahudi. Bentuk ini jelas bagi pembaca umum.
- source_word: εἰς τὸ παραζηλῶσαι αὐτούς
  choice: untuk membangkitkan kecemburuan mereka
  rationale: εἰς τό dengan infinitif menyatakan tujuan atau hasil. παραζηλόω berarti membangkitkan kecemburuan dan mungkin mencakup dorongan untuk menginginkan berkat yang sama; teks utama mempertahankan ungkapan kecemburuan tanpa menjelaskan motif itu secara berlebihan.
theological_decisions:
- issue: Apakah tersandungnya Israel digambarkan sebagai kejatuhan akhir yang tidak dapat dipulihkan
  choice: Pertanyaan retoris menyangkal bahwa mereka tersandung supaya jatuh.
  alternative: Ayat ini dapat dipahami sebagai penyangkalan atas keruntuhan akhir atau sebagai penyangkalan atas tujuan/hasil kejatuhan itu tanpa menetapkan seluruh rincian akhirnya.
  rationale: Pembedaan antara πταίω ('tersandung') dan πίπτω ('jatuh') dipertahankan. Terjemahan tidak menambahkan kata seperti 'sama sekali', 'untuk selamanya', atau 'tanpa dapat dipulihkan'.
- issue: Makna kecemburuan dalam rangkaian sejarah keselamatan
  choice: Keselamatan bangsa-bangsa bukan Yahudi dimaksudkan untuk membangkitkan kecemburuan Israel.
  alternative: Kecemburuan itu dapat dipahami secara negatif sebagai iri hati atau secara positif sebagai dorongan untuk menginginkan keselamatan yang sama.
  rationale: παραζηλόω memungkinkan nuansa kecemburuan yang dapat mengarah kepada peneladanan. Teks utama tidak memutuskan secara eksplisit di antara nuansa-nuansa itu, sedangkan catatan kaki menjelaskannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pertanyaan retoris dibuat alami dengan partikel 'bukan?', sementara perbedaan gambaran 'tersandung' dan 'jatuh' serta ambiguitas tujuan/hasil tetap dipertahankan.
