id: ROM.11.17
reference: Romans 11:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ⸀ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/017.yaml
  text: But if some of the branches were broken off[a], and you, although being a wild olive tree, were grafted in among them and became a fellow sharer in the root, in the richness of the olive tree[b],
translation:
  language: id
  text: Namun, jika beberapa cabang telah dipatahkan, dan engkau, meskipun engkau adalah pohon zaitun liar, dicangkokkan di antara cabang-cabang itu[a] serta turut mendapat bagian dalam akar serta kekayaan pohon zaitun itu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dicangkokkan di antara mereka,” yaitu di antara cabang-cabang itu.
    reason: Frasa ἐν αὐτοῖς secara harfiah berarti “di antara mereka”; rujukannya paling wajar adalah cabang-cabang yang tersisa.
  - marker: b
    text: Atau, “turut mendapat bagian dalam akar yang kaya dari pohon zaitun itu”; secara tradisional, “akar dan kesuburan pohon zaitun itu.”
    reason: Rangkaian genitif Yunani dapat dipahami dengan hubungan yang berbeda antara “akar,” “kekayaan/kesuburan,” dan “pohon zaitun.” Catatan menyajikan alternatif tanpa menambahkan hubungan kausal.
lexical_decisions:
- source_word: Εἰ δέ
  choice: Namun, jika
  rationale: Menyampaikan syarat εἰ dan nuansa kontras atau kelanjutan δέ secara wajar dalam bahasa Indonesia.
- source_word: τινες τῶν κλάδων
  choice: beberapa cabang
  rationale: Mewakili τινες dan genitif partitif secara alami; dalam bahasa Indonesia, 'beberapa dari cabang-cabang itu' terasa lebih berat.
- source_word: ἐξεκλάσθησαν
  choice: telah dipatahkan
  rationale: Bentuk pasif dipertahankan, dan 'dipatahkan' sesuai dengan gambaran cabang yang dilepaskan dari pohon.
- source_word: σὺ δὲ
  choice: dan engkau
  rationale: Meneruskan kalimat sambil mempertahankan peralihan kepada pihak yang disapa secara tunggal.
- source_word: ἀγριέλαιος ὢν
  choice: meskipun berasal dari pohon zaitun liar
  rationale: Menangkap nuansa konsesif partisipel dan menjaga metafora hortikultural tanpa menyamakan orang yang disapa dengan seluruh pohon secara janggal dalam bahasa Indonesia.
- source_word: ἐνεκεντρίσθης
  choice: dicangkokkan
  rationale: Istilah hortikultural yang tepat dan lazim untuk tindakan memasukkan cabang atau tunas ke pohon lain.
- source_word: ἐν αὐτοῖς
  choice: di antara cabang-cabang itu
  rationale: Rujukan eksplisit kepada cabang-cabang lain menghindari ketaksaan pronomina bahasa Indonesia; alternatif tekstual dicatat dalam catatan kaki [a].
- source_word: συγκοινωνὸς
  choice: turut mendapat bagian
  rationale: Mengungkapkan partisipasi bersama dengan pihak lain secara alami dan jelas.
- source_word: τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας
  choice: dalam akar dan kekayaan pohon zaitun itu
  rationale: Mempertahankan unsur 'akar' dan 'kekayaan' dalam susunan genitif Yunani yang padat tanpa mengubahnya secara pasti menjadi 'akar yang kaya'; kemungkinan hubungan lain dicatat dalam catatan kaki.
- source_word: ἐγένου
  choice: serta turut mendapat bagian
  rationale: Peralihan ke keadaan baru yang dinyatakan ἐγένου terwakili secara idiomatis oleh konstruksi verbal ini.
theological_decisions:
- issue: Identitas metaforis ἀγριέλαιος
  choice: Mempertahankan gambaran pohon zaitun liar tanpa menafsirkannya langsung sebagai bangsa bukan Yahudi.
  alternative: Menulis secara interpretatif 'engkau yang bukan Yahudi'.
  rationale: Metafora hortikultural merupakan bagian dari argumen Paulus dan tidak boleh digantikan dengan kesimpulan teologisnya.
- issue: Hubungan antara akar dan kekayaan
  choice: 'Menerjemahkan keduanya sebagai hal yang di dalamnya orang itu turut mendapat bagian: ''dalam akar dan kekayaan pohon zaitun itu''.'
  alternative: Menerjemahkan 'dalam akar pohon zaitun yang kaya itu' atau 'dalam akar yang memberi kekayaan kepada pohon zaitun itu'.
  rationale: Rangkaian genitif Yunani dapat dipahami lebih dari satu cara. Teks utama mempertahankan ketegangan antara 'akar' dan 'kekayaan', sedangkan catatan kaki menyajikan kemungkinan sintaksis lain tanpa menetapkan tafsir tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal 'engkau' dipakai untuk mempertahankan σὺ. Istilah 'dicangkokkan' menjaga metafora pertanian, sedangkan susunan kalimat dibiarkan berakhir dengan koma karena ayat ini merupakan anak kalimat yang berlanjut ke ayat 18.
