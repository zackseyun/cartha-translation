  text: καλῶς· τῇ ἀπιστίᾳ ἐξεκλάσθησαν, σὺ δὲ τῇ πίστει ἕστηκας. μὴ ⸂ὑψηλὰ φρόνει⸃, ἀλλὰ φοβοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/020.yaml
  text: 'Quite right: they were broken off because of unbelief[a], but you stand by faith. Do not be arrogant[d][c][b], but fear.'
translation:
  language: id
  text: Benar. Mereka dipatahkan karena ketidakpercayaan, sedangkan kamu tetap berdiri oleh iman.[a] Jangan menyombongkan diri, tetapi takutlah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melalui iman” atau “oleh kepercayaan.”
    reason: alternative_reading
  - marker: b
    text: Maksudnya, takutlah di hadapan Allah dengan kerendahan hati dan kewaspadaan, bukan dengan keangkuhan atau rasa aman yang lancang.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς
  choice: Benar
  rationale: Dalam konteks ini kata tersebut membenarkan pernyataan lawan bicara pada ayat sebelumnya. “Benar” alami dalam bahasa Indonesia dan mempertahankan daya afirmatifnya.
- source_word: ἀπιστίᾳ
  choice: karena ketidakpercayaan
  rationale: Datif ini menyatakan sebab atau dasar pematahan cabang. “Ketidakpercayaan” mempertahankan kontras leksikal dan teologis dengan πίστις.
- source_word: ἐξεκλάσθησαν
  choice: dipatahkan
  rationale: Pilihan ini mempertahankan gambaran cabang pohon zaitun dalam konteks, tanpa menggantinya dengan ungkapan abstrak seperti “disingkirkan”.
- source_word: πίστει
  choice: karena iman
  rationale: Datif menyatakan dasar keberadaan pembaca dalam keadaan berdiri. “Karena iman” membentuk kontras yang jelas dengan “karena ketidakpercayaan”; alternatif instrumental dicatat dalam catatan kaki.
- source_word: ἕστηκας
  choice: tetap berdiri
  rationale: Bentuk perfek menyatakan keadaan sekarang sebagai hasil yang berlanjut. “Tetap berdiri” menyampaikan keadaan tersebut secara wajar.
- source_word: ὑψηλὰ φρόνει
  choice: menyombongkan diri
  rationale: Idiom ini melarang cara berpikir tinggi atau angkuh mengenai diri sendiri. Ungkapan Indonesia ini jelas, alami, dan sesuai dengan konteks peringatan terhadap kesombongan.
- source_word: φοβοῦ
  choice: takutlah
  rationale: Imperatif ini sengaja diterjemahkan secara langsung agar ketajaman peringatan dan ketegangan teologisnya tidak dilunakkan menjadi sekadar rasa hormat.
theological_decisions:
- issue: Makna πίστις dalam kontras dengan ἀπιστία
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Kontras langsung dengan ketidakpercayaan paling kuat menunjuk pada respons iman atau percaya. “Iman” dipertahankan sebagai istilah utama, sementara nuansa percaya dicatat sebagai alternatif.
- issue: Daya perintah φοβοῦ
  choice: takutlah
  alternative: hendaklah kamu takut; milikilah rasa takut yang penuh hormat
  rationale: Terjemahan langsung mempertahankan peringatan Paulus terhadap keangkuhan dan praduga. Catatan menjelaskan nuansanya tanpa menghapus daya kata “takut” dari teks utama.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kontras ayat dipertahankan; metafora cabang tetap konkret. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
