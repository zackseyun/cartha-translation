id: ROM.2.3
reference: Romans 2:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/003.yaml
  text: But do you suppose this[a], O man—you who judge those who practice such things and yet do them yourself—that you will escape the judgment of God?
translation:
  language: id
  text: Namun, apakah engkau mengira, hai manusia[a]—engkau yang menghakimi orang-orang yang melakukan hal-hal semacam itu, tetapi engkau sendiri juga melakukannya—bahwa engkau akan luput dari penghakiman Allah?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hai orang.” Sapaan Yunani berbentuk tunggal dan ditujukan kepada seorang manusia sebagai wakil lawan bicara.
    reason: cultural_note
lexical_decisions:
- source_word: λογίζῃ
  choice: apakah engkau mengira
  rationale: Kata kerja ini menunjuk pada anggapan atau pertimbangan dalam pikiran; bentuk pertanyaan mempertahankan daya retoris teks.
- source_word: ἄνθρωπε
  choice: hai manusia
  rationale: Vokatif tunggal ini menyapa seorang manusia sebagai wakil lawan bicara dalam gaya diatribe Paulus; 'manusia' wajar dan tidak membatasi rujukannya pada laki-laki.
- source_word: κρίνων
  choice: menghakimi
  rationale: Padanan langsung yang sesuai dengan konteks penilaian moral, tanpa memperkuatnya menjadi 'menghukum'.
- source_word: πράσσοντας
  choice: melakukan
  rationale: Mengungkapkan perilaku orang-orang yang dihakimi secara alami dalam bahasa Indonesia; perbedaan dengan ποιῶν tidak dipaksakan karena keduanya bertumpang tindih secara semantis.
- source_word: ποιῶν αὐτά
  choice: engkau sendiri juga melakukannya
  rationale: Kata 'sendiri' dan 'juga' memperjelas kontras serta tuduhan bahwa si penghakim melakukan hal yang sama, sesuai fungsi konteks dan penegasan σύ.
- source_word: ἐκφεύξῃ
  choice: akan luput
  rationale: Menyampaikan gagasan lolos atau terhindar dari penghakiman yang akan datang dengan ungkapan Indonesia yang ringkas dan alami.
- source_word: κρίμα τοῦ θεοῦ
  choice: penghakiman Allah
  rationale: Menunjuk secara luas pada tindakan atau putusan yudisial Allah; 'penghakiman' mempertahankan kaitan leksikal dengan tindakan menghakimi sebelumnya.
theological_decisions:
- issue: Cakupan sapaan ἄνθρωπε
  choice: hai manusia
  alternative: hai laki-laki / hai orang
  rationale: Bentuk Yunani ἄνθρωπος merujuk pada manusia atau orang, bukan khusus laki-laki; sapaan tunggal tetap dipertahankan tanpa mempersempit cakupannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Pronomina 'engkau' dipakai untuk mempertahankan sapaan tunggal serta gaya retoris yang tajam. Struktur kalimat panjang sumber dipertahankan sejauh tetap jelas, dengan tanda pisah untuk membingkai identitas orang yang disapa.
