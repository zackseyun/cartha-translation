  yaml_path: translation/nt/romans/002/028.yaml
  text: For a Jew is not one outwardly[a], nor is circumcision outward in the flesh[c][b];
translation:
  language: id
  text: Sebab, orang yang Yahudi hanya secara lahiriah bukanlah orang Yahudi, dan sunat yang hanya secara lahiriah pada tubuh bukanlah sunat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: orang Yahudi
  rationale: Dalam konteks Roma 2, istilah ini menunjuk pada identitas umat perjanjian, bukan terutama asal wilayah Yudea.
- source_word: ἐν τῷ φανερῷ
  choice: secara lahiriah / tampak secara lahiriah
  rationale: Ungkapan ini menunjuk pada apa yang terlihat dari luar dan mempersiapkan kontras dengan yang batiniah dalam ayat berikutnya.
- source_word: περιτομή
  choice: sunat
  rationale: Ini istilah Indonesia yang baku dan tepat untuk tanda perjanjian yang sedang dibahas.
- source_word: ἐν σαρκί
  choice: pada tubuh
  rationale: Dalam konteks ini σάρξ bersifat harfiah dan menunjuk pada tindakan sunat secara jasmani; 'pada tubuh' lebih alami dalam bahasa Indonesia modern.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelasan ayat ini dengan argumen sebelumnya.
- source_word: οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή
  choice: dan sunat bukanlah yang hanya tampak secara lahiriah pada tubuh
  rationale: Mempertahankan bentuk eliptis dan penyangkalan terhadap sunat yang semata-mata terlihat secara jasmani tanpa menambahkan kesimpulan teologis yang tidak dinyatakan.
theological_decisions:
- issue: Makna identitas perjanjian dalam 'orang Yahudi' dan 'sunat'
  choice: Ayat ini menyangkal bahwa ciri yang semata-mata lahiriah dengan sendirinya menentukan identitas yang dimaksud Paulus.
  alternative: Paulus meniadakan identitas Yahudi itu sendiri atau menggantinya dengan kategori yang sepenuhnya nonetnis.
  rationale: Teks membangun kontras antara yang lahiriah dan yang batiniah, bukan secara eksplisit menghapus identitas Yahudi. Ketegangan itu perlu dipertahankan menjelang ayat 29.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'secara lahiriah' dipertahankan untuk mencerminkan paralelisme Yunani dan kontras dengan ayat berikutnya.
