- from: Sebab yang disebut orang Yahudi bukanlah orang yang hanya secara lahiriah demikian[a], dan sunat bukanlah yang hanya tampak secara lahiriah pada tubuh[b].
  to: Sebab, orang yang Yahudi hanya secara lahiriah bukanlah orang Yahudi, dan sunat yang hanya secara lahiriah pada tubuh bukanlah sunat.
