  text: τοῖς μὲν καθ’ ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν ζητοῦσιν ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/007.yaml
  text: eternal life to those who by perseverance in doing good seek glory and honor and immortality.
translation:
  language: id
  text: Ia akan memberikan hidup kekal kepada mereka yang dengan tekun berbuat baik mencari kemuliaan, kehormatan, dan ketidakbinasaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὑπομονὴν ἔργου ἀγαθοῦ
  choice: dengan tekun berbuat baik
  rationale: Ungkapan ini secara alami menyampaikan ketekunan yang diwujudkan dalam perbuatan baik, tanpa mempersempitnya menjadi satu perbuatan tertentu.
- source_word: δόξαν καὶ τιμὴν
  choice: kemuliaan, kehormatan
  rationale: Padanan langsung dan wajar bagi dua nomina yang dibedakan dalam teks Yunani.
- source_word: ἀφθαρσίαν
  choice: ketidakbinasaan
  rationale: Menunjukkan keadaan yang tidak mengalami kebinasaan atau kerusakan; dipertahankan berbeda dari 'hidup kekal'.
- source_word: ζωὴν αἰώνιον
  choice: hidup kekal
  rationale: Padanan baku, jelas, dan tepat bagi frasa Yunani tersebut.
theological_decisions:
- issue: Hubungan hidup kekal dengan ketekunan dalam berbuat baik
  choice: Mempertahankan susunan bahwa Allah memberikan hidup kekal kepada kelompok yang digambarkan tekun berbuat baik dan mencari kemuliaan, kehormatan, serta ketidakbinasaan.
  alternative: Menambahkan penjelasan bahwa perbuatan hanya bukti iman atau dasar jasa.
  rationale: Ayat ini sendiri tidak menjelaskan mekanisme hubungan itu; terjemahan tidak boleh menyisipkan penyelesaian teologis dari luar konteks.
- issue: Subjek tersirat dari kata kerja pemberian dalam konteks ayat 6–7
  choice: Ia akan memberikan
  alternative: Allah akan membalas
  rationale: Klausa Yunani ayat 7 bersifat eliptis dan bergantung pada ayat sebelumnya. 'Ia akan memberikan' melengkapi kalimat Indonesia secara alami sambil mempertahankan hubungan kontekstual tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Urutan unsur dipertahankan sedekat mungkin dengan Yunani, tetapi klausa eliptis dilengkapi agar menjadi kalimat Indonesia yang utuh.
