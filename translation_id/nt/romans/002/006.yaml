  yaml_path: translation/nt/romans/002/006.yaml
  text: who will repay each one according to his works[a][b].
translation:
  language: id
  text: yang akan membalas setiap orang sesuai dengan perbuatannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς
  choice: yang
  rationale: Kata penghubung relatif ini secara alami merujuk kembali kepada Allah dalam konteks sebelumnya tanpa mengulang subjek.
- source_word: ἀποδώσει
  choice: akan membalas
  rationale: Kata kerja ini menyatakan pemberian kembali atau pembalasan dalam konteks penghakiman; 'membalas' mempertahankan daya yudisialnya dalam bahasa Indonesia yang wajar.
- source_word: ἑκάστῳ
  choice: setiap orang
  rationale: Ungkapan ini mempertahankan tekanan distributif pada masing-masing pribadi dan lebih alami daripada terjemahan yang terlalu harfiah.
- source_word: κατὰ
  choice: sesuai dengan
  rationale: Frasa ini menyatakan tolok ukur atau dasar pembalasan secara tepat dan alami.
- source_word: τὰ ἔργα
  choice: perbuatan
  rationale: '''Perbuatan'' merupakan padanan Indonesia yang langsung dan lazim untuk ἔργα dalam konteks penilaian moral; alternatif ''pekerjaan'' dapat menimbulkan kesan mata pencaharian.'
- source_word: αὐτοῦ
  choice: -nya
  rationale: Akhiran pronominal tunggal merujuk secara distributif kepada 'setiap orang'; dalam bahasa Indonesia bentuk ini alami dan tidak bergender.
theological_decisions:
- issue: Penghakiman menurut perbuatan
  choice: Mempertahankan ungkapan pembalasan 'sesuai dengan perbuatannya' tanpa pelunakan.
  alternative: Mengalihkannya menjadi 'memperlakukan' atau membatasinya pada 'memberi upah'.
  rationale: Teks Yunani secara eksplisit berbicara tentang pembalasan berdasarkan perbuatan. Terjemahan mempertahankan ketegangan teologis itu tanpa menyelaraskannya secara interpretatif dengan pembahasan Paulus tentang pembenaran di bagian lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. 'Membalas' dipilih dalam arti memberi kepada seseorang sesuai dengan perbuatannya, bukan semata-mata membalas dendam. Penanda gender dalam catatan bahasa Inggris tidak diperlukan karena pronomina Indonesia tidak bergender.
