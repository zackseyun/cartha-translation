  to: Mereka menunjukkan bahwa pekerjaan hukum Taurat[a] tertulis dalam hati mereka, sementara hati nurani mereka turut bersaksi dan pikiran-pikiran mereka saling menuduh atau bahkan membela[b].
  rationale: Revisi memperbaiki kejelasan dan kelancaran bahasa Indonesia pada bagian sintaktis yang paling sulit tanpa menghapus ambiguitas sumber. Teks utama sekarang menampilkan unsur timbal balik yang eksplisit dalam μεταξὺ ἀλλήλων, sedangkan catatan kaki secara transparan mempertahankan kemungkinan pemahaman bahwa pikiran-pikiran itu menuduh atau membela orang-orang yang bersangkutan. Istilah dan metafora lain dipertahankan.
