  text: οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/015.yaml
  text: They show that the work of the law is written on their hearts[b][a], while their conscience also bears witness and their thoughts accuse or even defend them.
translation:
  language: id
  text: Mereka menunjukkan bahwa pekerjaan hukum Taurat[a] tertulis dalam hati mereka, sementara hati nurani mereka turut bersaksi dan pikiran-pikiran mereka saling menuduh atau bahkan membela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tuntutan hukum Taurat” atau “apa yang dituntut hukum Taurat.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pikiran-pikiran mereka menuduh atau bahkan membela mereka.” Secara lebih harfiah, frasa Yunani mengandung arti timbal balik, “satu sama lain.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδείκνυνται
  choice: menunjukkan
  rationale: Kata ini menyampaikan sifat pembuktian atau penampakan yang terkandung dalam verba Yunani tanpa memperkuatnya menjadi pembuktian mutlak.
- source_word: τὸ ἔργον τοῦ νόμου
  choice: pekerjaan hukum Taurat
  rationale: Terjemahan ini mempertahankan bentuk tunggal dan ungkapan padat teks Yunani. Penafsiran yang lebih eksplisit, yaitu 'tuntutan hukum Taurat', dicantumkan dalam catatan kaki.
- source_word: γραπτὸν ἐν ταῖς καρδίαις αὐτῶν
  choice: tertulis dalam hati mereka
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan metafora tulisan batiniah.
- source_word: συμμαρτυρούσης ... τῆς συνειδήσεως
  choice: Hati nurani mereka turut bersaksi
  rationale: '''Turut bersaksi'' mempertahankan nuansa kesaksian yang menyertai atau menguatkan dalam verba majemuk Yunani.'
- source_word: μεταξὺ ἀλλήλων τῶν λογισμῶν
  choice: pikiran-pikiran mereka, di antara satu sama lain
  rationale: Rumusan ini mempertahankan unsur timbal balik ἀλλήλων dan kepadatan sintaksis sumber, meskipun hubungan tepat antara berbagai pikiran itu dan tindakan menuduh atau membela tetap ambigu.
- source_word: κατηγορούντων ἢ καὶ ἀπολογουμένων
  choice: menuduh atau bahkan membela
  rationale: '''Membela'' lebih langsung mencerminkan ἀπολογέομαι daripada ''memaafkan'', sedangkan ''bahkan'' menyampaikan penekanan καὶ sesudah ἢ.'
theological_decisions:
- issue: Apakah Paulus menunjuk pada pekerjaan hukum Taurat dalam arti padat, atau secara khusus pada tuntutan hukum Taurat.
  choice: Mempertahankan ungkapan 'pekerjaan hukum Taurat' dalam teks utama.
  alternative: '''tuntutan hukum Taurat'' atau ''apa yang dituntut hukum Taurat'''
  rationale: Teks Yunani memakai 'pekerjaan' dalam bentuk tunggal dan tidak menjelaskan hubungannya lebih lanjut. Terjemahan utama mempertahankan ketegangan ini, sementara penafsiran lazim diberikan dalam catatan kaki.
- issue: Apakah pikiran-pikiran itu saling menuduh dan membela, atau menuduh dan membela orang-orang yang memilikinya.
  choice: Menyatakan unsur timbal balik dalam frasa tentang pikiran, lalu memakai 'mereka' sebagai objek menuduh dan membela.
  alternative: pikiran-pikiran mereka saling menuduh atau bahkan saling membela
  rationale: Susunan Yunani padat dan dapat dipahami secara timbal balik, tetapi tindakan menuduh atau membela secara wajar diarahkan kepada orang-orang yang sedang dibicarakan. Catatan kaki mempertahankan kemungkinan pembacaan yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Istilah 'hukum Taurat' dipakai untuk νόμος dalam konteks Roma. Struktur kalimat dipecah menjadi dua agar klausa genitif absolut dan rangkaian partisip tetap mudah dipahami, tanpa menghapus ambiguitas frasa mengenai pikiran-pikiran yang saling berhubungan.
