id: ROM.2.8
reference: Romans 2:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῖς δὲ ἐξ ἐριθείας καὶ ⸀ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ ⸂ὀργὴ καὶ θυμός⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/008.yaml
  text: 'But for those who are self-seeking and disobey the truth[b][a], but obey unrighteousness: wrath and fury.'
translation:
  language: id
  text: 'Namun, bagi mereka yang didorong oleh ambisi egois[a], yang tidak menaati kebenaran, tetapi menaati ketidakbenaran[b]: murka dan kegeraman.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bertindak demi kepentingan diri sendiri.”
    reason: lexical_alternative
  - marker: b
    text: Atau “ketidakadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐριθείας
  choice: didorong oleh ambisi egois
  rationale: Frasa ἐξ menunjukkan sumber atau dorongan tindakan, sedangkan ἐριθεία menyatakan ambisi yang berpusat pada kepentingan diri sendiri dan dapat bernuansa persaingan atau kepentingan kelompok. Ungkapan ini mempertahankan unsur motivasi dalam bahasa Indonesia yang alami.
- source_word: ἀπειθοῦσι τῇ ἀληθείᾳ
  choice: tidak menaati kebenaran
  rationale: ἀπειθέω di sini menyatakan penolakan untuk tunduk atau taat, bukan sekadar ketidakpercayaan intelektual. Pilihan ini mempertahankan daya moral dan kehendakiannya.
- source_word: πειθομένοις δὲ τῇ ἀδικίᾳ
  choice: tetapi menaati ketidakbenaran
  rationale: Partisipel ini sejajar secara kontras dengan tindakan tidak menaati kebenaran. 'Menaati' mempertahankan permainan makna dengan akar πειθ- dan menggambarkan keberpihakan kepada lawan kebenaran.
- source_word: ἀδικίᾳ
  choice: ketidakbenaran
  rationale: Dalam konteks penghakiman Paulus, kata ini mencakup keburukan moral dan keadaan yang bertentangan dengan kebenaran di hadapan Allah. 'Ketidakadilan' tetap mungkin, tetapi lebih sempit.
- source_word: ὀργὴ
  choice: murka
  rationale: '''Murka'' mempertahankan nada khidmat dan yudisial dalam konteks penghakiman ilahi.'
- source_word: θυμός
  choice: kegeraman
  rationale: Bersama ὀργή, kata ini memperkuat gambaran kemarahan yang hebat. 'Kegeraman' membedakannya dari 'murka' tanpa mengurangi intensitasnya.
- source_word: implicit verbal ellipsis
  choice: titik dua sebelum 'murka dan kegeraman'
  rationale: Teks Yunani tidak menyatakan verba pada hasil bagi kelompok ini. Titik dua mempertahankan susunan singkat tersebut tanpa menambahkan 'akan ada' atau 'akan ditimpakan'.
theological_decisions:
- issue: Makna ἀδικία dalam konteks penghakiman Paulus
  choice: ketidakbenaran
  alternative: ketidakadilan
  rationale: '''Ketidakbenaran'' mempertahankan cakupan moral dan relasional di hadapan Allah serta kontras langsung dengan ''kebenaran''. ''Ketidakadilan'' merupakan kemungkinan sah yang menonjolkan aspek ketidakadilan sosial atau yudisial, sehingga dicantumkan dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur paralel 'tidak menaati ... tetapi menaati ...' dipertahankan, demikian pula ungkapan tanpa verba pada bagian akhir ayat.
