  text: ἐν ⸂ἡμέρᾳ ὅτε⸃ ⸀κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/016.yaml
  text: on the day when God judges the secrets of people through Messiah Jesus[a], according to my gospel.
translation:
  language: id
  text: Pada hari ketika Allah menghakimi rahasia manusia melalui Mesias Yesus[a], menurut Injilku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kristus Yesus.”'
    reason: Terjemahan alternatif bagi Χριστοῦ Ἰησοῦ yang mempertahankan bentuk tradisional “Kristus”.
lexical_decisions:
- source_word: ἐν ἡμέρᾳ ὅτε
  choice: pada hari ketika
  rationale: Mempertahankan acuan eksplisit kepada hari penghakiman dan mengungkapkan konstruksi temporal Yunani secara alami dalam bahasa Indonesia.
- source_word: κρίνει
  choice: menghakimi
  rationale: 'Bentuk kini Yunani wajar dipertahankan dalam klausa waktu yang mengacu kepada peristiwa mendatang: ''ketika Allah menghakimi''.'
- source_word: τὰ κρυπτὰ τῶν ἀνθρώπων
  choice: segala sesuatu yang tersembunyi dalam diri manusia
  rationale: τὰ κρυπτὰ menunjuk pada hal-hal yang dirahasiakan atau tersembunyi; ungkapan ini alami dalam bahasa Indonesia dan tidak membatasi ἀνθρώπων kepada laki-laki.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: sesuai dengan Injil yang kuberitakan
  rationale: Kepunyaan Paulus dijelaskan secara idiomatis sebagai Injil yang ia beritakan, bukan Injil yang berasal darinya; 'sesuai dengan' mempertahankan daya κατὰ.
- source_word: διὰ Χριστοῦ Ἰησοῦ
  choice: melalui Mesias Yesus
  rationale: διά dengan genitif menyatakan perantaraan atau pelaku. Χριστός masih dapat dipahami sebagai gelar, sehingga diterjemahkan 'Mesias', sementara bentuk tradisional dicatat sebagai alternatif.
theological_decisions:
- issue: Apakah Χριστοῦ diterjemahkan sebagai gelar atau bentuk yang menyerupai nama
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Dalam konteks ini Χριστός tetap dapat membawa makna gelar 'Yang Diurapi'. Terjemahan utama mempertahankan makna tersebut tanpa meniadakan bentuk tradisional 'Kristus Yesus'.
- issue: Hubungan frasa 'sesuai dengan Injilku' dengan penghakiman
  choice: sesuai dengan Injil yang kuberitakan
  alternative: menurut Injilku
  rationale: Urutan dan tanda baca mempertahankan kaitan frasa itu dengan pernyataan tentang penghakiman Allah, tanpa menjelaskan lebih jauh apakah Injil menjadi standar penghakiman atau sekadar menyatakan bahwa penghakiman itu akan terjadi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Injil' ditulis dengan huruf kapital sebagai sebutan bagi kabar baik yang diberitakan Paulus. Penanda catatan kaki [a] dicantumkan langsung setelah 'Mesias Yesus'.
