review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat mempertahankan hari penghakiman yang definitif, Allah sebagai subjek, penghakiman melalui Mesias Yesus, dan nuansa futuris dalam klausa waktu. Namun, «segala sesuatu yang tersembunyi dalam diri manusia» memperluas τὰ κρυπτὰ dengan «segala sesuatu» dan menambahkan lokalisasi «dalam diri» yang tidak dinyatakan dalam teks Yunani. «Injil yang kuberitakan» dapat dipahami benar secara konteks, tetapi tidak mempertahankan possessive μου secara langsung sebagaimana «Injilku».
  naturalness: «Pada hari ketika Allah menghakimi rahasia manusia» adalah bahasa Indonesia modern yang jelas, wajar, dan cukup padat. Frasa ini menyampaikan hal-hal yang tersembunyi milik manusia tanpa tambahan penjelasan.
  terminology: «Allah», «menghakimi», «Mesias Yesus», dan «Injilku» sesuai dengan register serta istilah kunci. Catatan kaki secara tepat menyediakan bentuk tradisional «Kristus Yesus» sebagai alternatif.
  issues:
  - severity: medium
    issue: τὰ κρυπτὰ τῶν ἀνθρώπων diterjemahkan «segala sesuatu yang tersembunyi dalam diri manusia».
    rationale: «Segala sesuatu» lebih luas daripada nomina plural netral «hal-hal/rahasia», sedangkan «dalam diri» menambahkan keterangan lokatif/psikologis yang tidak eksplisit dalam sumber. «Rahasia manusia» lebih langsung dan alami.
  - severity: low
    issue: κατὰ τὸ εὐαγγέλιόν μου diterjemahkan «sesuai dengan Injil yang kuberitakan».
    rationale: Parafrasa ini dapat diterima secara makna umum, tetapi «Injilku» mempertahankan possessive μου dan ambiguitas terkontrol frasa sumber dengan lebih baik.
  revised_text: Pada hari ketika Allah menghakimi rahasia manusia melalui Mesias Yesus[a], menurut Injilku.
  revised_footnotes:
