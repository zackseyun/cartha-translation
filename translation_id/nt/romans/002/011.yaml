  text: οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/011.yaml
  text: For there is no partiality with God[a].
translation:
  language: id
  text: Sebab Allah tidak memihak[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak pilih kasih.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Sebab
  rationale: Menandai bahwa ayat ini memberikan dasar bagi pernyataan sebelumnya; “Sebab” menyampaikan fungsi penjelas tersebut secara wajar dalam bahasa Indonesia.
- source_word: προσωπολημψία
  choice: memihak
  rationale: Kata ini menunjuk pada keberpihakan atau perlakuan istimewa berdasarkan kedudukan maupun faktor lahiriah. Ungkapan “tidak memihak” alami, jelas, dan mempertahankan nuansa moral-yudisialnya.
- source_word: παρὰ τῷ θεῷ
  choice: Allah tidak memihak
  rationale: Secara harfiah frasa itu menyatakan bahwa keberpihakan tidak ada pada Allah. Dalam bahasa Indonesia, bentuk verbal ini lebih alami daripada “tidak ada keberpihakan pada Allah” tanpa mengubah makna pokok.
theological_decisions:
- issue: Pernyataan tentang ketidakberpihakan Allah
  choice: Allah tidak memihak
  alternative: Tidak ada keberpihakan pada Allah
  rationale: Pilihan ini menyampaikan pernyataan umum tentang karakter dan tindakan Allah secara alami. Walaupun bentuk eksistensial Yunani dialihkan menjadi klausa verbal, isi teologisnya tetap sama dan tidak ditambahi penjelasan denominatif.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. “Tidak memihak” sesuai dengan konteks penghakiman dalam bagian ini, sedangkan catatan kaki mempertahankan padanan sehari-hari “tidak pilih kasih”.
