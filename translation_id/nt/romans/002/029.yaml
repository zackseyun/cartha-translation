id: ROM.2.29
reference: Romans 2:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ’ ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/029.yaml
  text: But the Jew is one inwardly[a], and circumcision is of the heart—by the Spirit, not by the letter—whose praise is not from people but from God.
translation:
  language: id
  text: Sebaliknya, yang disebut orang Yahudi ialah orang Yahudi di dalam batin, dan sunat ialah sunat hati—dalam roh, bukan menurut huruf[a]. Pujiannya bukan berasal dari manusia, melainkan dari Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dalam roh, bukan dalam huruf.” “Roh” dapat dipahami sebagai Roh Kudus; atau “roh” dapat menunjuk pada kenyataan batiniah atau rohani, bukan sekadar ketentuan tertulis.'
    reason: Menjaga ambiguitas ἐν πνεύματι serta mencatat arti harfiah γράμμα tanpa membatasi maknanya menjadi hukum tertulis saja.
lexical_decisions:
- source_word: ἐν τῷ κρυπτῷ
  choice: di dalam batin
  rationale: Ungkapan ini menyampaikan hal yang tersembunyi atau batiniah, sebagai lawan dari tanda lahiriah dalam ayat sebelumnya, tanpa memberi kesan sekadar dilakukan secara rahasia.
- source_word: Ἰουδαῖος
  choice: orang Yahudi sejati
  rationale: Kata dasarnya berarti orang Yahudi; penambahan 'sejati' secara alami melengkapi konstruksi eliptis bahasa Yunani dan menunjukkan kontras antara kenyataan batiniah dan penampilan lahiriah.
- source_word: περιτομὴ καρδίας
  choice: sunat sejati adalah sunat hati
  rationale: Terjemahan ini mempertahankan metafora sunat pada hati dan melengkapi struktur eliptis ayat agar jelas dalam bahasa Indonesia.
- source_word: ἐν πνεύματι
  choice: oleh Roh
  rationale: Dalam kontras Paulus antara πνεῦμα dan γράμμα, Roh Kudus kemungkinan besar dimaksudkan; 'oleh' menyatakan sarana atau karya dengan wajar dalam bahasa Indonesia.
- source_word: οὐ γράμματι
  choice: bukan oleh hukum yang tertulis
  rationale: γράμμα secara harfiah berarti huruf atau tulisan, tetapi dalam konteks ini menunjuk pada ketentuan hukum tertulis; frasa ini lebih mudah dipahami pembaca modern daripada 'bukan oleh huruf'.
- source_word: οὗ ὁ ἔπαινος
  choice: Pujian bagi orang itu
  rationale: Anteseden οὗ adalah orang Yahudi secara batiniah; penyebutan eksplisit menghindari rujukan yang janggal atau ambigu dalam bahasa Indonesia.
- source_word: ἐξ ἀνθρώπων
  choice: berasal dari manusia
  rationale: Bentuk jamak Yunani bersifat generik dan menunjuk pada sumber manusiawi, bukan hanya laki-laki.
- source_word: ἐκ τοῦ θεοῦ
  choice: dari Allah
  rationale: Padanan langsung dan alami untuk sumber ilahi yang dikontraskan dengan manusia.
theological_decisions:
- issue: Apakah πνεύματι menunjuk kepada Roh Kudus atau roh manusia/kenyataan rohani batiniah
  choice: Roh Kudus
  alternative: roh manusia atau kenyataan rohani batiniah
  rationale: Kontras Paulus antara Roh dan hukum yang tertulis lebih mungkin menunjuk pada karya Roh Kudus. Karena bentuk Yunani tidak sepenuhnya meniadakan makna batiniah yang lebih umum, alternatif itu dicatat dalam catatan kaki.
- issue: Makna γράμμα dalam kontras dengan πνεῦμα
  choice: hukum yang tertulis
  alternative: huruf atau tulisan
  rationale: Dalam konteks pembahasan Taurat dan sunat, γράμμα menunjuk pada ketentuan tertulis, bukan sekadar karakter alfabet; namun arti harfiahnya dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur eliptis Yunani dilengkapi dengan 'sejati' agar kontras dengan ayat sebelumnya jelas dan alami. Em dash mempertahankan penekanan pada kontras Roh dan hukum tertulis.
