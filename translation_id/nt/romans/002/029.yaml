  - severity: medium
    issue: “Oleh Roh” menutup ambiguitas ἐν πνεύματι
    rationale: Frasa Yunani memakai ἐν πνεύματι dan dapat dipahami sebagai “dalam roh” atau, menurut sebagian penafsiran, karya Roh Kudus. Teks utama sebaiknya tidak memutuskan kapitalisasi atau makna instrumental; alternatif dapat dijelaskan dalam catatan kaki.
  - severity: medium
    issue: Catatan kaki menyebut “oleh Roh” sebagai terjemahan harfiah
    rationale: “Oleh Roh” bukan bentuk harfiah dari ἐν πνεύματι. Bentuk yang lebih dekat ialah “dalam roh.”
  - severity: low
