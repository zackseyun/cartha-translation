  source_fidelity: Draf menangkap kontras batiniah/lahiriah dan sumber pujian dengan baik, tetapi menambahkan “sejati” dua kali tanpa padanan eksplisit dalam bahasa Yunani. Selain itu, “oleh Roh” memilih salah satu penafsiran untuk ἐν πνεύματι, sementara catatan kaki secara tidak tepat menyebutnya harfiah, dan “hukum yang tertulis” lebih khusus daripada γράμμα.
  naturalness: Revisi memakai bahasa Indonesia baku yang jelas. “Dalam roh, bukan menurut huruf” tetap cukup dekat dengan bentuk ringkas Paulus dan terdengar lebih wajar daripada “dalam huruf,” sementara catatan kaki menjelaskan bentuk harfiahnya.
  terminology: “Sunat hati,” “roh,” “huruf,” “manusia,” dan “Allah” mempertahankan istilah serta ambiguitas penting. Huruf kecil pada “roh” dan catatan kaki menghindari penetapan referen πνεύματι sebagai Roh Kudus tanpa penanda eksplisit dalam teks Yunani.
