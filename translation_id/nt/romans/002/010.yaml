id: ROM.2.10
reference: Romans 2:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: δόξα δὲ καὶ τιμὴ καὶ εἰρήνη παντὶ τῷ ἐργαζομένῳ τὸ ἀγαθόν, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/010.yaml
  text: but glory and honor and peace to everyone who does good[b][a], to the Jew first and also to the Greek.
translation:
  language: id
  text: Tetapi kemuliaan, kehormatan, dan damai sejahtera bagi setiap orang yang berbuat baik[a], pertama-tama bagi orang Yahudi dan juga bagi orang Yunani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melakukan apa yang baik.”
    reason: lexical_alternative
  - marker: b
    text: “Orang Yunani” di sini kemungkinan berarti orang bukan Yahudi secara lebih luas.
    reason: cultural_note
lexical_decisions:
- source_word: δόξα
  choice: kemuliaan
  rationale: Padanan baku dan wajar yang mempertahankan bobot kehormatan serta nuansa ganjaran eskatologis.
- source_word: τιμή
  choice: kehormatan
  rationale: Sesuai dengan rangkaian bahasa ganjaran bersama δόξα dan merupakan padanan alami dalam bahasa Indonesia.
- source_word: εἰρήνη
  choice: damai sejahtera
  rationale: Ungkapan Indonesia yang lazim dalam konteks Alkitab dan cukup luas untuk mencakup kedamaian serta kesejahteraan tanpa mempersempit maknanya.
- source_word: παντὶ τῷ ἐργαζομένῳ
  choice: bagi setiap orang yang melakukan
  rationale: Mengungkapkan konstruksi partisipial yang menunjuk pada setiap orang yang dicirikan oleh perbuatannya, dengan bahasa Indonesia yang alami.
- source_word: τὸ ἀγαθόν
  choice: apa yang baik
  rationale: Mencerminkan artikel dan adjektiva substantival secara jelas dan alami; alternatif yang lebih ringkas ialah 'kebaikan'.
- source_word: Ἰουδαίῳ
  choice: orang Yahudi
  rationale: Padanan langsung dan netral; bentuk tunggal Yunani dipakai secara representatif.
- source_word: πρῶτον
  choice: pertama-tama
  rationale: Mempertahankan urutan yang dinyatakan Paulus tanpa menjelaskan sifat urutan itu lebih jauh.
- source_word: Ἕλληνι
  choice: orang Yunani
  rationale: Mempertahankan ungkapan sumber dalam pasangan 'Yahudi dan Yunani'; cakupannya yang kemungkinan lebih luas dijelaskan dalam catatan kaki.
- source_word: δὲ
  choice: tetapi
  rationale: Menandai kontras dengan murka dan kesusahan pada ayat sebelumnya.
theological_decisions:
- issue: Makna Ἕλληνι dalam kontras Yahudi/Yunani
  choice: orang Yunani dalam teks utama, dengan arti yang lebih luas dijelaskan dalam catatan kaki
  alternative: orang bukan Yahudi
  rationale: Secara harfiah istilah itu berarti 'orang Yunani', tetapi dalam pasangan retoris Paulus kemungkinan menunjuk lebih luas kepada orang bukan Yahudi. Teks utama mempertahankan bentuk sumber tanpa menutup cakupan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pengulangan 'bagi ... bagi ...' dipertahankan agar urutan dan penekanan ayat jelas; semua penanda catatan kaki ditempatkan langsung sesudah unsur yang diterangkan.
