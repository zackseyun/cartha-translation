id: ROM.2.13
reference: Romans 2:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ γὰρ οἱ ἀκροαταὶ ⸀νόμου δίκαιοι παρὰ ⸀τῷ θεῷ, ἀλλ’ οἱ ποιηταὶ ⸁νόμου δικαιωθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/013.yaml
  text: For it is not the hearers of the law who are righteous before God[a], but the doers of the law who will be justified.
translation:
  language: id
  text: Sebab, bukan orang yang mendengarkan hukum Taurat yang benar di hadapan Allah, melainkan orang yang melakukan hukum Taurat yang akan dibenarkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan dinyatakan benar”; kemungkinan lain, “akan terbukti benar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροαταὶ
  choice: orang yang mendengarkan
  rationale: Ungkapan ini alami dalam bahasa Indonesia modern dan mempertahankan kontras langsung dengan orang yang melakukan, yakni antara sekadar mendengar dan bertindak.
- source_word: νόμου
  choice: hukum Taurat
  rationale: Dalam konteks Roma 2, νόμος menunjuk pada hukum yang dibicarakan dalam kaitannya dengan orang Yahudi; 'hukum Taurat' jelas dan lazim dalam bahasa Indonesia, meskipun nomina Yunani ini tidak memakai artikel.
- source_word: δίκαιοι
  choice: benar
  rationale: '''Benar di hadapan Allah'' secara alami menyatakan status atau penilaian yang sesuai dengan δίκαιοι tanpa mempersempitnya menjadi penjelasan doktrinal tertentu.'
- source_word: παρὰ τῷ θεῷ
  choice: di hadapan Allah
  rationale: Pilihan ini menyampaikan kedudukan dalam penilaian atau penghakiman Allah secara ringkas dan wajar.
- source_word: ποιηταὶ
  choice: orang yang melakukan
  rationale: Ungkapan substantival ini alami dan mempertahankan antitesis dengan 'orang yang mendengarkan'; objeknya adalah hukum Taurat.
- source_word: δικαιωθήσονται
  choice: akan dibenarkan
  rationale: Bentuk pasif masa depan dipertahankan, beserta kesinambungan istilah δικαιόω dalam Roma dan ketegangan teologis ayat ini, tanpa menjelaskan mekanisme pembenaran.
theological_decisions:
- issue: Makna forensik dan teologis δικαιωθήσονται serta hubungannya dengan melakukan hukum Taurat
  choice: akan dibenarkan
  alternative: akan dinyatakan benar; akan terbukti benar
  rationale: '''Akan dibenarkan'' mempertahankan bentuk pasif, orientasi eskatologis dari bentuk masa depan, dan istilah penting Paulus. Terjemahan ini tidak menyelesaikan secara diam-diam bagaimana pernyataan ayat ini berhubungan dengan uraian Paulus tentang pembenaran di bagian lain surat Roma.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur antitesis 'bukan ... melainkan ...' dipakai untuk mencerminkan οὐ ... ἀλλά, sedangkan pengulangan 'hukum Taurat' mempertahankan kesejajaran retoris teks Yunani.
