id: ROM.2.5
reference: Romans 2:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ⸀ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/005.yaml
  text: But because of your hardness and unrepentant heart, you are storing up wrath for yourself on the day of wrath and the revelation of God’s righteous judgment,
translation:
  language: id
  text: Namun, karena kedegilanmu dan hatimu yang tidak mau bertobat, kamu menimbun murka bagi dirimu sendiri pada hari kemurkaan dan penyataan penghakiman Allah yang adil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “penghakiman Allah yang benar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ
  choice: Namun, karena
  rationale: 'δέ memberi peralihan yang berlawanan secara ringan, sedangkan κατά dengan akusatif di sini paling wajar dipahami secara kausal: keadaan orang itu menjadi alasan akibat yang disebutkan.'
- source_word: σκληρότητά σου καὶ ἀμετανόητον καρδίαν
  choice: kekerasan hatimu yang tidak mau bertobat
  rationale: Terjemahan ini mempertahankan metafora kekerasan hati dan mengungkapkan ἀμετανόητον dengan bahasa Indonesia modern yang menunjukkan sikap menolak bertobat.
- source_word: θησαυρίζεις
  choice: sedang menimbun
  rationale: Kata ini menggambarkan tindakan mengumpulkan atau menyimpan sesuatu sedikit demi sedikit; 'menimbun' mempertahankan gambaran tersebut dan cocok dengan objek negatif berupa murka.
- source_word: σεαυτῷ
  choice: bagi dirimu sendiri
  rationale: Bentuk refleksif menekankan bahwa akibat itu sedang dikumpulkan oleh orang tersebut untuk menimpa dirinya sendiri.
- source_word: ὀργὴν
  choice: murka
  rationale: '''Murka'' mempertahankan bobot serius kemarahan ilahi dalam konteks penghakiman.'
- source_word: ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως
  choice: pada hari kemurkaan dan penyataan
  rationale: ἐν dengan 'hari' diterjemahkan secara temporal sebagai 'pada hari'. Susunan dua nomina yang dikoordinasikan tetap dipertahankan tanpa mengubahnya menjadi anak kalimat eksplisit.
- source_word: δικαιοκρισίας τοῦ θεοῦ
  choice: penghakiman Allah yang adil
  rationale: δικαιοκρισία menyatakan penghakiman yang benar atau adil; susunan ini alami dalam bahasa Indonesia dan tetap menyebut Allah sebagai pelaku/pemilik penghakiman itu.
theological_decisions:
- issue: Apakah frasa nominal tentang penyataan penghakiman perlu diubah menjadi klausa, misalnya 'ketika Allah menyatakan penghakiman-Nya yang adil'.
  choice: 'Mempertahankan struktur nominal: ''pada hari kemurkaan dan penyataan penghakiman Allah yang adil''.'
  alternative: pada hari kemurkaan, ketika Allah menyatakan penghakiman-Nya yang adil
  rationale: Bahasa Yunani memakai nomina-nomina yang dikoordinasikan dan tidak memuat verba finit 'menyatakan'. Bentuk nominal mempertahankan struktur serta ambiguitas sumber.
- issue: Hubungan adjektiva 'yang adil' dalam frasa akhir.
  choice: Mengaitkannya dengan 'penghakiman Allah'.
  alternative: penghakiman yang benar dari Allah
  rationale: Keduanya memungkinkan secara leksikal; 'penghakiman Allah yang adil' alami dan menyampaikan bahwa penghakiman Allah bercirikan keadilan tanpa menambahkan rincian doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'kamu' mengikuti sapaan orang kedua tunggal dalam konteks, sedangkan 'tidak mau bertobat' dipilih daripada bentuk teknis atau arkais agar mudah dipahami.
