review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena σκληρότητί σου dan ἀμετανόητον καρδίαν adalah dua unsur yang dikoordinasikan. Draf menggabungkannya menjadi satu frasa (“kekerasan hatimu yang tidak mau bertobat”), sehingga hubungan koordinatifnya tidak tampak. Teks revisi menyatakan keduanya secara terpisah. Unsur lain—menimbun murka bagi diri sendiri serta hari kemurkaan dan penyataan penghakiman Allah yang adil—setia pada struktur dan makna Yunani.
  naturalness: “Kedegilanmu dan hatimu yang tidak mau bertobat” adalah bahasa Indonesia baku dan modern, serta lebih jelas daripada konstruksi yang menggabungkan kedua nomina dalam draf. “Kamu menimbun” sudah memadai untuk bentuk kini Yunani tanpa nuansa progresif tambahan yang tidak perlu.
  terminology: “Murka,” “bertobat,” “penyataan,” dan “penghakiman Allah yang adil” sesuai dengan register Alkitab modern dan dengan δικαιοκρισία. Catatan alternatif “yang benar” tetap merupakan pilihan leksikal yang sah.
  issues:
  - severity: medium
    issue: Dua unsur Yunani yang dikoordinasikan telah dilebur menjadi satu frasa Indonesia.
    rationale: κατὰ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν berarti “karena kedegilanmu dan hatimu yang tidak mau bertobat.” Dalam draf, “kekerasan hatimu yang tidak mau bertobat” menjadikan “yang tidak mau bertobat” seolah hanya menerangkan “hati” dalam satu konsep “kekerasan hati,” dan tidak secara jelas menerjemahkan σκληρότης sebagai unsur terpisah.
  revised_text: Namun, karena kedegilanmu dan hatimu yang tidak mau bertobat, kamu menimbun murka bagi dirimu sendiri pada hari kemurkaan dan penyataan penghakiman Allah yang adil.[a]
