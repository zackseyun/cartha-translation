  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: θλῖψις καὶ στενοχωρία, ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου τοῦ κατεργαζομένου τὸ κακόν, Ἰουδαίου τε πρῶτον καὶ Ἕλληνος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/009.yaml
  text: There will be affliction and distress upon every human soul that does evil[b][a], to the Jew first and also to the Greek.
translation:
  language: id
  text: Kesengsaraan dan kesesakan akan menimpa setiap jiwa manusia[a] yang melakukan kejahatan, pertama-tama orang Yahudi dan juga orang Yunani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap orang” atau “setiap manusia.”
    reason: lexical_alternative
  - marker: b
    text: Dalam kontras orang Yahudi/orang Yunani ini, “orang Yunani” merujuk pada orang bukan Yahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψις
  choice: kesusahan
  rationale: Menyampaikan tekanan atau kesengsaraan berat dengan bahasa Indonesia modern dan tetap membedakannya dari στενοχωρία.
- source_word: στενοχωρία
  choice: penderitaan
  rationale: Membentuk pasangan intensif yang alami dengan 'kesusahan' serta menyampaikan keadaan terimpit dan pedih.
- source_word: ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου
  choice: akan menimpa setiap jiwa manusia
  rationale: Mempertahankan gambaran konkret ψυχή dan sifat generik ἀνθρώπου, sambil melengkapi klausa eliptis Yunani secara wajar dalam bahasa Indonesia.
- source_word: τοῦ κατεργαζομένου τὸ κακόν
  choice: yang melakukan kejahatan
  rationale: '''Melakukan'' secara idiomatis menerjemahkan partisip substantival κατεργαζομένου, sedangkan ''kejahatan'' menyampaikan τὸ κακόν sebagai hal yang jahat secara umum.'
- source_word: Ἰουδαίου
  choice: orang Yahudi
  rationale: Menunjuk kelompok etnis-keagamaan dalam kontras Paulus, bukan hanya penduduk Yudea.
- source_word: πρῶτον
  choice: pertama-tama
  rationale: Mempertahankan urutan prioritas yang dinyatakan sumber tanpa menjelaskan sifat prioritas itu lebih jauh.
- source_word: Ἕλληνος
  choice: orang Yunani
  rationale: Mempertahankan istilah aktual Paulus dan pasangan 'Yahudi/Yunani'; catatan kaki menjelaskan cakupannya dalam kontras ini.
theological_decisions:
- issue: Klausa Yunani tidak memiliki verba utama eksplisit dalam ayat ini
  choice: Kesusahan dan penderitaan akan menimpa...
  alternative: Kesusahan dan penderitaan atas...
  rationale: Penambahan 'akan menimpa' menghasilkan kalimat Indonesia yang utuh dan mencerminkan konteks penghakiman pada masa mendatang tanpa menambahkan ajaran baru.
- issue: Cakupan Ἕλλην dalam pasangan Yahudi/Yunani
  choice: orang Yunani
  alternative: orang bukan Yahudi
  rationale: Teks utama mempertahankan bentuk leksikal sumber, sedangkan catatan menjelaskan fungsi luasnya dalam kontras tersebut tanpa menutup kemungkinan nuansa harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Susunan kalimat dibuat alami, sementara ungkapan 'jiwa manusia' dan pasangan 'orang Yahudi/orang Yunani' dipertahankan untuk menjaga citra serta ketegangan leksikal teks sumber.
