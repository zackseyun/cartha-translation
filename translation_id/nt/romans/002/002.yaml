base_translation:
  language: en
  yaml_path: translation/nt/romans/002/002.yaml
  text: And we know that the judgment of God is according to truth against those who practice such things[a].
translation:
  language: id
  text: Dan kita tahu bahwa penghakiman Allah sesuai dengan kebenaran terhadap mereka yang melakukan hal-hal semacam itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut kebenaran”; maksudnya, penghakiman Allah selaras dengan apa yang benar.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: kita tahu
  rationale: Bentuk perfektum οἶδα memiliki makna kini; 'kita tahu' merupakan padanan langsung dan alami dalam bahasa Indonesia.
- source_word: δέ
  choice: Namun
  rationale: δέ melanjutkan wacana dengan nuansa peralihan dan pertentangan ringan terhadap sikap menghakimi pada ayat sebelumnya; 'Namun' menyatakan hubungan itu secara alami tanpa membuat pertentangannya terlalu kuat.
- source_word: κρίμα
  choice: penghakiman
  rationale: κρίμα menunjuk pada tindakan atau putusan yudisial Allah. 'Penghakiman' mempertahankan cakupan maknanya tanpa mempersempitnya menjadi 'penghukuman'.
- source_word: κατὰ ἀλήθειαν
  choice: sesuai dengan kebenaran
  rationale: Frasa ini menyatakan keselarasan dengan kebenaran atau kenyataan. Pilihan ini mempertahankan unsur leksikal dan tekanan moral-yudisial Paulus.
- source_word: ἐπὶ
  choice: terhadap
  rationale: Dalam konteks penghakiman yang diarahkan kepada orang-orang, 'terhadap' merupakan padanan Indonesia yang alami dan tetap mempertahankan arah yudisial tanpa terdengar janggal.
- source_word: τὰ τοιαῦτα
  choice: hal-hal semacam itu
  rationale: Padanan alami bagi frasa netral jamak yang merujuk kembali pada berbagai perbuatan dalam konteks sebelumnya.
- source_word: πράσσοντας
  choice: yang terus melakukan
  rationale: Partisipel kini dapat menggambarkan tindakan yang berkelanjutan atau menjadi kebiasaan. 'Terus melakukan' menyampaikan corak tersebut dengan lebih wajar daripada 'mempraktikkan' untuk objek berupa perbuatan buruk.
theological_decisions:
- issue: Apakah κατὰ ἀλήθειαν diterjemahkan secara interpretatif sebagai 'dengan adil/tepat' atau secara lebih transparan sebagai 'sesuai dengan kebenaran'.
  choice: sesuai dengan kebenaran
  alternative: dengan adil; berdasarkan kenyataan
  rationale: Pilihan ini mempertahankan kaitan eksplisit antara penghakiman Allah dan kebenaran, tanpa mereduksinya menjadi penilaian penerjemah bahwa penghakiman itu sekadar 'adil' atau 'tepat'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Kita' dipakai sebagai bentuk inklusif yang paling wajar untuk οἴδαμεν dalam alur argumentasi, sedangkan 'terus melakukan' memperjelas corak tindakan berulang tanpa menjadikannya klaim teknis tentang aspek verba.
