source:
  edition: SBLGNT
  text: ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, ⸀οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/026.yaml
  text: So then[a], if the uncircumcised man keeps the requirements of the law, will not his uncircumcision be counted as circumcision?
translation:
  language: id
  text: Jadi, jika orang yang tidak bersunat menaati ketetapan-ketetapan hukum Taurat, bukankah ketidakbersunatannya akan diperhitungkan sebagai sunat?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jika ketidakbersunatan menaati ... bukankah ketidakbersunatannya akan diperhitungkan sebagai sunat?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: orang yang tidak bersunat / keadaannya yang tidak bersunat
  rationale: Nomina ini secara harfiah berarti keadaan tidak bersunat, tetapi kemunculan pertama menunjuk secara metonimis kepada orang yang tidak bersunat; αὐτοῦ mendukung rujukan personal. Kemunculan kedua tetap mengacu pada keadaan orang itu, sehingga variasi ini mempertahankan permainan ungkapan Yunani secara alami.
- source_word: δικαιώματα
  choice: tuntutan-tuntutan
  rationale: Bentuk jamak ini menunjuk pada hal-hal yang dituntut hukum Taurat. Pilihan ini jelas dalam bahasa Indonesia modern dan tidak menambahkan penekanan teologis yang tidak dinyatakan.
- source_word: νόμου
  choice: hukum Taurat
  rationale: Dalam konteks argumentasi Paulus, νόμος merujuk kepada hukum yang diberikan kepada Israel; 'hukum Taurat' merupakan ungkapan Indonesia yang alami dan membedakannya dari hukum secara umum.
- source_word: φυλάσσῃ
  choice: menaati
  rationale: Dalam konteks tuntutan hukum, verba ini berarti memelihara atau menjalankannya. 'Menaati' menyampaikan tindakan kepatuhan dengan jelas dan alami.
- source_word: λογισθήσεται
  choice: akan diperhitungkan
  rationale: Pilihan ini mempertahankan nuansa penilaian atau penghitungan dari λογίζομαι sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: εἰς περιτομήν
  choice: sebagai sunat
  rationale: 'εἰς di sini menyatakan status atau hasil penggolongan: keadaan tidak bersunat itu diperhitungkan dalam kategori sunat.'
- source_word: οὐχ
  choice: bukankah ... akan
  rationale: Partikel negatif memperkenalkan pertanyaan retoris yang mengharapkan jawaban positif; 'bukankah' mempertahankan daya retoris tersebut.
theological_decisions:
- issue: Apakah ketaatan orang tak bersunat secara mutlak menggantikan sunat atau diperhitungkan demikian dalam argumen Paulus
  choice: Mempertahankan bentuk pertanyaan retoris dan ungkapan 'diperhitungkan sebagai sunat'
  alternative: Menjelaskan bahwa orang itu dianggap sebagai anggota umat perjanjian
  rationale: Ayat ini menyatakan suatu penghitungan atau penggolongan, tetapi tidak menguraikan seluruh implikasi teologisnya. Terjemahan tidak boleh menyelesaikan ketegangan itu dengan memasukkan penafsiran tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Hukum Taurat' dipakai agar rujukan kontekstual jelas; 'orang yang tidak bersunat' lebih alami daripada menjadikan nomina abstrak sebagai pelaku, sedangkan catatan kaki mempertahankan bentuk harfiahnya.
