  text: παιδευτὴν ἀφρόνων, διδάσκαλον νηπίων, ἔχοντα τὴν μόρφωσιν τῆς γνώσεως καὶ τῆς ἀληθείας ἐν τῷ νόμῳ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/020.yaml
  text: an instructor of the foolish[a], a teacher of infants, having in the law the embodiment of knowledge and truth—
translation:
  language: id
  text: seorang pembimbing bagi orang-orang bodoh, seorang pengajar bagi anak-anak kecil, yang memiliki dalam hukum Taurat bentuk pengetahuan dan kebenaran—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδευτὴν
  choice: pembimbing
  rationale: Kata ini menunjuk kepada orang yang mendidik, melatih, atau mendisiplinkan. “Pembimbing” alami dalam bahasa Indonesia dan tidak terlalu menonjolkan unsur hukuman.
- source_word: ἀφρόνων
  choice: orang-orang bodoh
  rationale: Padanan ini mempertahankan arti umum serta nada merendahkan dalam rangkaian pengakuan diri yang sedang dikutip Paulus.
- source_word: διδάσκαλον
  choice: pengajar
  rationale: Padanan langsung dan wajar bagi orang yang mengajar.
- source_word: νηπίων
  choice: anak-anak kecil
  rationale: νήπιος secara harfiah menunjuk kepada bayi atau anak yang masih sangat kecil dan dapat dipakai secara kiasan untuk orang yang belum dewasa. “Anak-anak kecil” mempertahankan gambaran itu tanpa terdengar janggal.
- source_word: ἔχοντα
  choice: engkau memiliki
  rationale: Partisip ini tetap terhubung dengan orang kedua tunggal yang disapa dalam konteks ayat 17–20; penyebutan “engkau” membuat hubungan sintaksisnya jelas dalam bahasa Indonesia.
- source_word: μόρφωσιν
  choice: wujud
  rationale: μόρφωσις dapat berarti bentuk, perwujudan, atau rumusan. “Wujud” cukup luas untuk mempertahankan kemungkinan bahwa hukum Taurat dipandang sebagai bentuk nyata pengetahuan dan kebenaran tanpa memaksakan arti kepenuhan mutlak.
- source_word: γνώσεως
  choice: pengetahuan
  rationale: Padanan lazim yang mempertahankan pasangannya dengan “kebenaran”.
- source_word: ἀληθείας
  choice: kebenaran
  rationale: Padanan alami dalam konteks Paulus dan sesuai dengan pasangannya, “pengetahuan”.
- source_word: ἐν τῷ νόμῳ
  choice: dalam hukum Taurat
  rationale: Dalam konteks ini νόμος merujuk kepada Taurat Yahudi. “Hukum Taurat” jelas bagi pembaca Indonesia, sedangkan “dalam” mempertahankan daya preposisi Yunani.
theological_decisions:
- issue: Nilai μόρφωσις sebagai bentuk lahiriah atau perwujudan nyata
  choice: wujud
  alternative: bentuk
  rationale: Teks dapat menekankan bahwa Taurat memuat bentuk atau perwujudan pengetahuan dan kebenaran, sementara konteks berikutnya mengkritik ketidaktaatan orang yang membanggakannya. “Wujud” tidak dengan sendirinya menyatakan bahwa pemilik Taurat sudah menghayati kebenaran itu.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Struktur berupa kelanjutan daftar dari ayat sebelumnya dipertahankan, demikian pula tanda pisah pada akhir ayat. “Karena” mengungkapkan hubungan partisipial secara alami: orang yang disapa mengklaim peran-peran tersebut berdasarkan apa yang dimilikinya dalam Taurat.'
