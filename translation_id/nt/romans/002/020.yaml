    issue: “Karena” untuk ἔχοντα
    rationale: Kata Yunani ἔχοντα adalah partisip present yang bersifat deskriptif, bukan penanda sebab. Terjemahan “karena” secara tidak perlu mengubah relasi sintaksis dan makna.
  revised_text: seorang pembimbing bagi orang-orang bodoh, seorang pengajar bagi anak-anak kecil, yang memiliki dalam hukum Taurat bentuk pengetahuan dan kebenaran—
