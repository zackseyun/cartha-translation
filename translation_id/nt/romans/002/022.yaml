id: ROM.2.22
reference: Romans 2:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ λέγων μὴ μοιχεύειν μοιχεύεις; ὁ βδελυσσόμενος τὰ εἴδωλα ἱεροσυλεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/022.yaml
  text: You who say[a], “Do not commit adultery,” do you commit adultery? You who detest idols, do you rob temples?
translation:
  language: id
  text: Engkau yang berkata, “Jangan berzina,” apakah engkau berzina? Engkau yang membenci berhala, apakah engkau merampok kuil[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih luas, “melakukan penistaan terhadap hal-hal suci?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Engkau yang berkata
  rationale: Artikel dengan partisipel kini dipakai secara substantival untuk menyapa sosok perwakilan. Bentuk ini mempertahankan sapaan retoris langsung Paulus secara wajar dalam bahasa Indonesia.
- source_word: μὴ μοιχεύειν
  choice: Jangan berzina
  rationale: Infinitif dengan μή menyatakan isi larangan. “Jangan berzina” merupakan padanan Indonesia yang ringkas dan tepat.
- source_word: μοιχεύεις
  choice: apakah engkau berzina
  rationale: Indikatif kini dalam pertanyaan retoris memiliki daya tuduhan umum; bentuk ini mempertahankan kesejajaran dengan larangan sebelumnya.
- source_word: ὁ βδελυσσόμενος
  choice: Engkau yang membenci
  rationale: βδελύσσομαι menyatakan rasa muak atau penolakan yang kuat. “Membenci” alami dan bermartabat, serta cukup kuat dalam konteks sikap terhadap berhala.
- source_word: τὰ εἴδωλα
  choice: berhala
  rationale: Dalam konteks ini εἴδωλα menunjuk kepada patung atau objek pemujaan; “berhala” adalah padanan Indonesia yang jelas dan lazim.
- source_word: ἱεροσυλεῖς
  choice: apakah engkau merampok kuil
  rationale: ἱεροσυλέω secara konkret dapat berarti merampok kuil atau mengambil harta milik kuil. Terjemahan ini menjaga ironi yang timbul setelah penyebutan berhala, sedangkan arti yang lebih luas dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan makna ἱεροσυλεῖς
  choice: merampok kuil
  alternative: melakukan penistaan terhadap hal-hal suci
  rationale: Makna konkret paling sesuai dengan hubungan langsung pada berhala dan mempertahankan latar historis, tetapi verba Yunani juga dapat dipahami lebih luas sebagai tindakan sakrilegi; ambiguitas itu dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai untuk mempertahankan sapaan tunggal langsung dalam gaya diatribe Paulus; pengulangan struktur retoris sumber dipertahankan.
