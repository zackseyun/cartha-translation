id: ROM.2.25
reference: Romans 2:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/025.yaml
  text: Circumcision indeed is beneficial if you practice the law[a]; but if you are a transgressor of the law[d][c][b], your circumcision has become uncircumcision.
translation:
  language: id
  text: Sebab sunat memang berguna[a] jika kamu melakukan hukum Taurat[b]. Namun, jika kamu seorang pelanggar hukum Taurat[c], sunatmu telah menjadi ketidaksunatan[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bermanfaat” atau “bernilai”.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menaati hukum Taurat”. Secara lebih harfiah: “melakukan hukum Taurat”.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “orang yang melanggar hukum Taurat”.'
    reason: lexical_alternative
  - marker: d
    text: 'Secara harfiah: “sunatmu telah menjadi ketidaksunatan”; maksudnya, sunat sebagai tanda perjanjian kehilangan nilainya apabila hukum Taurat dilanggar.'
    reason: cultural_note
lexical_decisions:
- source_word: Περιτομὴ
  choice: sunat
  rationale: Memakai istilah baku dan langsung, sambil mempertahankan kategori perjanjian yang dipertentangkan dengan ἀκροβυστία.
- source_word: μὲν γὰρ
  choice: Sebab ... memang
  rationale: Gabungan ini menghubungkan ayat dengan alasan yang sedang dikemukakan sekaligus menegaskan pernyataan pertama sebelum kontras berikutnya.
- source_word: ὠφελεῖ
  choice: berguna
  rationale: Menyatakan manfaat atau nilai nyata secara bersyarat dalam bahasa Indonesia yang alami.
- source_word: ἐὰν νόμον πράσσῃς
  choice: jika kamu melakukan hukum Taurat
  rationale: Kata 'melakukan' mempertahankan nuansa πράσσω secara lebih dekat daripada parafrasa 'menaati', sedangkan 'hukum Taurat' memperjelas rujukan νόμος dalam konteks ini.
- source_word: παραβάτης νόμου
  choice: seorang pelanggar hukum Taurat
  rationale: Mempertahankan bentuk nomina pelaku dan nuansa hukum/perjanjian dari παράβατης, serta hubungan eksplisitnya dengan νόμος.
- source_word: ἡ περιτομή σου
  choice: sunatmu
  rationale: Bentuk posesif ringkas ini mempertahankan sapaan langsung dan daya retoris Paulus.
- source_word: ἀκροβυστία
  choice: ketidaksunatan
  rationale: Dalam konteks ini istilah tersebut merupakan lawan status perjanjian dari sunat, bukan sekadar rujukan anatomis. Bentuk abstrak ini juga mempertahankan kesejajaran tajam dengan 'sunat'.
- source_word: γέγονεν
  choice: telah menjadi
  rationale: Mencerminkan bentuk perfektum yang menyatakan perubahan dengan keadaan hasil yang tetap berlaku.
theological_decisions:
- issue: Apakah klausa terakhir harus dijelaskan sebagai penilaian status atau dipertahankan sebagai perubahan retoris yang kuat
  choice: sunatmu telah menjadi ketidaksunatan
  alternative: sunatmu dianggap sama dengan tidak bersunat
  rationale: Terjemahan utama mempertahankan ungkapan konkret dan mengejutkan dalam bahasa Yunani. Alternatif yang memakai 'dianggap' menjelaskan maksudnya, tetapi memperlemah daya γέγονεν, 'telah menjadi'.
- issue: Identifikasi νόμος dalam konteks Roma 2
  choice: hukum Taurat
  alternative: hukum
  rationale: Dalam pembahasan tentang orang Yahudi dan sunat, νόμος menunjuk pada hukum yang diterima Israel. 'Hukum Taurat' menyampaikan rujukan tersebut secara wajar dalam bahasa Indonesia tanpa mengubahnya menjadi hukum sipil umum.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur kontras dipertahankan dengan 'Sebab ... memang' dan 'Namun'. Istilah 'ketidaksunatan' sengaja dipertahankan dalam teks utama meski tidak lazim dalam percakapan, karena menjaga kesejajaran retoris dan teologis antara περιτομή dan ἀκροβυστία; catatan kaki menjelaskan maksudnya.
