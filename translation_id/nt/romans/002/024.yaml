base_translation:
  language: en
  yaml_path: translation/nt/romans/002/024.yaml
  text: For the name of God is blasphemed among the Gentiles because of you[b][a], just as it is written.
translation:
  language: id
  text: Sebab, nama Allah dihujat di antara orang-orang bukan Yahudi[a] karena kamu, seperti yang tertulis.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di antara bangsa-bangsa.”'
    reason: lexical_alternative
  - marker: b
    text: Paulus menggemakan Kitab Suci, terutama Yesaya 52:5, serta tema yang juga tercermin dalam Yehezkiel 36:20–23.
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Memperlihatkan bahwa ayat ini memberikan dasar penjelasan bagi teguran sebelumnya.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: Nama Allah
  rationale: Mempertahankan ungkapan sumber secara langsung; dalam konteks Kitab Suci, nama juga menyangkut kehormatan dan reputasi Allah.
- source_word: δι’ ὑμᾶς
  choice: karena kamu
  rationale: διά dengan kasus akusatif di sini menyatakan sebab dan menegaskan bahwa perilaku pihak yang disapa menjadi penyebab penghujatan.
- source_word: βλασφημεῖται
  choice: dihujat
  rationale: Padanan pasif kini yang alami dan kuat dalam bahasa Indonesia, khususnya untuk perkataan yang mencemarkan Allah.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: di antara bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks argumentasi Paulus kepada orang Yahudi, ἔθνη terutama menunjuk pada orang atau bangsa non-Yahudi, sambil tetap mempertahankan nuansa kolektif 'bangsa-bangsa'.
- source_word: καθὼς γέγραπται
  choice: seperti ada tertulis
  rationale: Formula Indonesia yang lazim dan bermartabat untuk memperkenalkan kutipan Kitab Suci; καθώς tidak perlu diperkuat menjadi 'tepat seperti'.
theological_decisions:
- issue: Rujukan Kitab Suci yang digaungkan Paulus
  choice: Tidak memasukkan nama kitab ke dalam teks utama; menjelaskannya dalam catatan kaki.
  alternative: Mengidentifikasi Yesaya 52:5 secara eksplisit dalam teks utama.
  rationale: Bahasa Yunani hanya mengatakan 'seperti ada tertulis'. Catatan menjaga hubungan antarteks tanpa menambahkan identifikasi ke dalam perkataan Paulus.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan formula kutipan ditempatkan di depan agar kalimat terdengar alami, tanpa mengubah hubungan logis γὰρ; istilah 'dihujat' mempertahankan daya teologis βλασφημεῖται.
