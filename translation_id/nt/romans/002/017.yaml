  text: ⸂Εἰ δὲ⸃ σὺ Ἰουδαῖος ἐπονομάζῃ καὶ ἐπαναπαύῃ ⸀νόμῳ καὶ καυχᾶσαι ἐν θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/017.yaml
  text: But if you call yourself a Jew and rely on the law and boast in God[b][a],
translation:
  language: id
  text: Tetapi jika kamu menyebut dirimu seorang Yahudi[a], bersandar pada hukum Taurat[b], dan bermegah dalam Allah,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "menyandang nama seorang Yahudi" atau "disebut seorang Yahudi".
    reason: lexical_alternative
  - marker: b
    text: Atau "bersandar pada hukum".
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ
  choice: Namun, jika
  rationale: Mempertahankan daya kondisional εἰ dan nuansa peralihan atau kontras ringan dari δέ dalam rangkaian argumen Paulus.
- source_word: Ἰουδαῖος
  choice: orang Yahudi
  rationale: Dalam konteks Roma, istilah ini terutama menunjuk pada identitas etnoreligius, bukan sekadar asal geografis.
- source_word: ἐπονομάζῃ
  choice: menyebut dirimu
  rationale: 'Bentuk mediumnya mendukung makna refleksif: orang itu mengaku atau memakai sebutan tersebut bagi dirinya sendiri.'
- source_word: ἐπαναπαύῃ
  choice: bersandar pada
  rationale: Mengungkapkan kepercayaan atau tumpuan, bukan tindakan beristirahat secara harfiah, sekaligus mempertahankan citra dasar katanya.
- source_word: νόμῳ
  choice: hukum Taurat
  rationale: Dalam konteks identitas Yahudi dan argumen Paulus, νόμος kemungkinan besar menunjuk pada Taurat; pilihan ini jelas dan lazim dalam bahasa Indonesia.
- source_word: καυχᾶσαι
  choice: bermegah
  rationale: Padanan yang lazim bagi istilah Paulus ini dan tetap membiarkan konteks menentukan apakah kemegahan tersebut patut atau sedang dikritik.
- source_word: ἐν θεῷ
  choice: dalam Allah
  rationale: Mempertahankan preposisi ἐν secara dekat dan menjaga ungkapan teologis Paulus tanpa mengubahnya menjadi sekadar berbicara tentang Allah.
theological_decisions:
- issue: Rujukan νόμος
  choice: hukum Taurat
  alternative: hukum
  rationale: Konteks orang Yahudi dan bagian selanjutnya menunjuk pada hukum Musa sebagai kategori perjanjian, tetapi catatan kaki mempertahankan padanan yang lebih formal.
- issue: Makna bermegah dalam Allah
  choice: bermegah dalam Allah
  alternative: membanggakan Allah
  rationale: 'Terjemahan ini mempertahankan ketegangan ungkapan Paulus: objek atau dasar kemegahan adalah Allah, tanpa menetapkan terlebih dahulu apakah klaim itu tulus atau ironis.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal "kamu" dipakai karena sumber Yunani menggunakan bentuk orang kedua tunggal σὺ dan verba tunggal. Ayat dipertahankan sebagai anak kalimat yang berlanjut ke ayat-ayat berikutnya.
