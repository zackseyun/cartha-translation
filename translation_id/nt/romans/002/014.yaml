id: ROM.2.14
reference: Romans 2:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ⸀ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/014.yaml
  text: For whenever Gentiles[a], who do not have the law, do by nature the things of the law, these, though not having the law[c][b], are a law to themselves.
translation:
  language: id
  text: Sebab, setiap kali bangsa-bangsa lain[a], yang tidak memiliki hukum Taurat, secara alami[b] melakukan hal-hal yang dituntut oleh hukum Taurat[c], mereka ini, walaupun tidak memiliki hukum Taurat, merupakan hukum bagi diri mereka sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bangsa-bangsa.”
    reason: lexical_alternative
  - marker: b
    text: Atau “secara naluriah.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “melakukan hal-hal dari hukum Taurat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: bangsa-bangsa lain
  rationale: Dalam konteks Paulus, istilah ini menunjuk kepada kelompok-kelompok bukan Yahudi sebagai kontras dengan orang Yahudi; pilihan ini lebih alami dalam bahasa Indonesia daripada transliterasi atau sekadar “bangsa-bangsa,” sambil tetap diberi alternatif harfiah dalam catatan.
- source_word: νόμον / νόμου / νόμος
  choice: hukum Taurat / hukum
  rationale: Pada dua kemunculan pertama, konteks menunjuk kepada hukum Musa sehingga “hukum Taurat” memperjelas rujukannya. Pada klausa predikatif terakhir, “menjadi hukum bagi diri mereka sendiri” mempertahankan permainan kata dan fungsi metaforis νόμος tanpa menyiratkan bahwa mereka menjadi Taurat.
- source_word: φύσει
  choice: secara alami
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan keluasan makna Yunani tanpa menentukan apakah yang dimaksud adalah naluri, pengetahuan moral bawaan, kebiasaan, atau keadaan alamiah.
- source_word: τὰ τοῦ νόμου ποιῶσιν
  choice: melakukan hal-hal yang dituntut hukum Taurat
  rationale: Pilihan ini dapat dipahami pembaca modern dan menyampaikan bahwa yang dilakukan berkaitan dengan tuntutan hukum. Catatan menyediakan bentuk yang lebih dekat dengan susunan Yunani.
- source_word: ἑαυτοῖς εἰσιν νόμος
  choice: menjadi hukum bagi diri mereka sendiri
  rationale: Mempertahankan metafora dan kesinambungan istilah νόμος, tanpa memperkuat gagasan bahwa mereka secara otonom menciptakan hukum sendiri.
theological_decisions:
- issue: Makna φύσει dalam kaitannya dengan pengetahuan moral dan hati nurani
  choice: Mempertahankan ungkapan luas “secara alami” tanpa menjelaskan mekanismenya.
  alternative: “secara naluriah” atau “berdasarkan pengertian alami mereka”
  rationale: φύσει sendiri tidak memastikan satu penjelasan teologis tertentu; terjemahan utama mempertahankan ambiguitas dan ketegangan dalam argumen Paulus.
- issue: Rujukan νόμος dan permainan kata pada akhir ayat
  choice: Menerjemahkan rujukan historis sebagai “hukum Taurat,” tetapi νόμος predikatif sebagai “hukum.”
  alternative: Memakai “hukum” pada semua kemunculan atau “Taurat” pada semua kemunculan.
  rationale: Pilihan ini memperjelas rujukan kepada hukum Musa sekaligus mencegah klausa terakhir terdengar seolah-olah bangsa-bangsa lain menjadi Taurat; pengulangan kata “hukum” tetap menjaga permainan kata Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern, bermartabat, dan mudah dipahami. “Bangsa-bangsa lain” dipilih sebagai padanan kontekstual bagi kelompok bukan Yahudi; “hukum Taurat” digunakan ketika rujukan kepada hukum Musa jelas, sedangkan “hukum” dipertahankan dalam metafora penutup.
