  text: dan engkau yakin bahwa engkau sendiri adalah penuntun orang buta dan terang bagi mereka yang berada dalam kegelapan,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθάς
  choice: engkau yakin
  rationale: Bentuk perfek menyatakan keadaan keyakinan yang telah menetap. “Engkau yakin” alami dalam bahasa Indonesia dan mempertahankan nada percaya diri yang sedang disoroti Paulus.
- source_word: τε
  choice: dan
  rationale: Partikel ini menghubungkan klausa dengan rangkaian sebelumnya; “dan” mempertahankan fungsi penghubung tanpa memberi penekanan tambahan.
- source_word: σεαυτόν
  choice: engkau sendiri
  rationale: Ungkapan ini mempertahankan daya tekan kata ganti refleksif dan menonjolkan penilaian orang itu terhadap dirinya sendiri.
- source_word: ὁδηγόν
  choice: penuntun
  rationale: “Penuntun” merupakan padanan metaforis yang tepat dan wajar bagi seseorang yang menunjukkan jalan.
- source_word: τυφλῶν
  choice: orang buta
  rationale: Bentuk jamak substantival diterjemahkan secara personal dan alami, tanpa mengubah gambaran tentang kebutaan.
- source_word: φῶς
  choice: terang
  rationale: “Terang” mempertahankan metafora sumber dan merupakan ungkapan Alkitabiah yang tetap mudah dipahami dalam bahasa Indonesia modern.
- source_word: τῶν ἐν σκότει
  choice: mereka yang berada dalam kegelapan
  rationale: Padanan ini mempertahankan rujukan personal sekaligus metafora keadaan berada dalam kegelapan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti “engkau” dipakai untuk mempertahankan sapaan orang kedua tunggal dan nada langsung dalam konteks retoris Paulus. Tanda koma dipertahankan karena ayat ini berlanjut ke rangkaian berikutnya.
