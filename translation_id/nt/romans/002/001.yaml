  source_fidelity: Teks Indonesia secara setia menyampaikan inferensi Διὸ, status ἀναπολόγητος sebagai tiadanya pembelaan yang sah, sapaan retoris representatif ὦ ἄνθρωπε, cakupan universal πᾶς ὁ κρίνων, serta perbedaan antara κρίνεις dan κατακρίνεις. “Ketika” secara wajar menyampaikan sisi temporal dari ἐν ᾧ tanpa meniadakan kaitan erat tindakan menghakimi dengan penghukuman diri. “Melakukan hal-hal yang sama” cukup mencerminkan πράσσεις dalam bentuk kini tanpa penambahan makna yang tidak perlu.
  naturalness: Bahasa Indonesia baku, jelas, dan bernada teguran yang sesuai. Pemakaian “engkau” dan “hai manusia” mempertahankan gaya sapaan langsung yang bermartabat. Struktur dengan tanda pisah sebelum “siapa pun yang menghakimi” terbaca alami sebagai penjelasan atas pihak yang disapa.
  terminology: “Menghakimi” untuk κρίνω dan “menghukum” untuk κατακρίνω mempertahankan pembedaan penting antara tindakan mengadili/menghakimi dan penghukuman. “Hai manusia” tepat untuk ἄνθρωπε yang secara bentuk tunggal tetapi secara rujukan bersifat umum; tidak perlu dipersempit menjadi laki-laki.
