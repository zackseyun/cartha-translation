id: ROM.2.1
reference: Romans 2:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/001.yaml
  text: Therefore you are without excuse[a], O man, every one who judges. For in passing judgment on another, you condemn yourself, because you who judge practice the same things.
translation:
  language: id
  text: Karena itu, engkau tidak mempunyai alasan untuk membela diri, hai manusia—siapa pun yang menghakimi.[a] Sebab, ketika engkau menghakimi orang lain, engkau menghukum dirimu sendiri, karena engkau yang menghakimi melakukan hal-hal yang sama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hai manusia, setiap orang yang menghakimi.”'
    reason: Susunan Yunani menempatkan “setiap orang yang menghakimi” sebagai keterangan yang menjelaskan siapa yang disapa; terjemahan utama menyatakannya dengan ungkapan Indonesia yang lebih alami.
lexical_decisions:
- source_word: Διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan dari uraian sebelumnya dengan hubungan logis yang jelas dan alami dalam bahasa Indonesia.
- source_word: ἀναπολόγητος
  choice: tidak mempunyai alasan untuk membela diri
  rationale: Mengungkapkan bahwa orang tersebut tidak memiliki pembelaan yang sah, sambil mempertahankan nuansa yudisial istilah Yunani.
- source_word: ὦ ἄνθρωπε
  choice: hai manusia
  rationale: Mempertahankan sapaan langsung tunggal dan retoris; ἄνθρωπος di sini mengacu secara umum kepada manusia, bukan khusus kepada laki-laki.
- source_word: πᾶς ὁ κρίνων
  choice: siapa pun yang menghakimi
  rationale: Menyampaikan cakupan universal πᾶς dan mengidentifikasi orang yang disapa secara wajar dalam bahasa Indonesia.
- source_word: ἐν ᾧ κρίνεις τὸν ἕτερον
  choice: ketika engkau menghakimi orang lain
  rationale: Konstruksi ἐν ᾧ dapat memuat nuansa temporal sekaligus instrumental; pilihan ini mempertahankan kaitan bahwa dalam tindakan menghakimi orang lain, orang itu menghukum dirinya sendiri, tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: κατακρίνεις
  choice: engkau menghukum
  rationale: Membedakannya dari κρίνεις dan mempertahankan daya yudisial yang lebih kuat, yakni menjatuhkan penghukuman.
- source_word: τὰ γὰρ αὐτὰ πράσσεις
  choice: melakukan hal-hal yang sama
  rationale: Menyatakan perilaku nyata yang sama; bentuk kini dapat mencakup tindakan yang menjadi kebiasaan tanpa harus mempersempitnya secara berlebihan menjadi kebiasaan terus-menerus.
- source_word: ὁ κρίνων
  choice: engkau yang menghakimi
  rationale: Mempertahankan identifikasi partisipial terhadap pihak yang disapa serta penekanannya dalam kalimat.
theological_decisions:
- issue: Cakupan sapaan tunggal ὦ ἄνθρωπε
  choice: hai manusia
  alternative: hai orang / hai manusia laki-laki
  rationale: Kata Yunani berbentuk tunggal dan sapaan ini bersifat representatif serta umum. 'Hai manusia' mempertahankan bentuk retoris tanpa membatasi teguran kepada laki-laki.
- issue: Hubungan antara menghakimi orang lain dan menghukum diri sendiri
  choice: ketika engkau menghakimi orang lain, engkau menghukum dirimu sendiri
  alternative: dengan dasar yang kaupakai untuk menghakimi orang lain, engkau menghukum dirimu sendiri
  rationale: ἐν ᾧ bersifat ringkas dan dapat dipahami secara temporal maupun instrumental. Teks utama mempertahankan kaitan tindakan tersebut tanpa menentukan bahwa frasa itu semata-mata menunjuk pada standar atau dasar penghakiman.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Kata ganti 'engkau' mempertahankan sapaan orang kedua tunggal dan nada teguran langsung. 'Menghakimi' dan 'menghukum' dipakai untuk menjaga perbedaan antara κρίνω dan κατακρίνω.
source_grounding:
  english_pob_role: consult_only
