id: ROM.2.27
reference: Romans 2:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ κρινεῖ ἡ ἐκ φύσεως ἀκροβυστία τὸν νόμον τελοῦσα σὲ τὸν διὰ γράμματος καὶ περιτομῆς παραβάτην νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/027.yaml
  text: And the uncircumcised person by nature[a], if he fulfills the law, will judge you who, with the letter and circumcision[b], are a transgressor of the law.
translation:
  language: id
  text: Dan orang yang secara alami tidak bersunat[a], yang menjalankan hukum Taurat, akan menghakimi engkau yang, dengan hukum tertulis dan sunat[b], adalah pelanggar hukum Taurat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “keadaan tidak bersunat”; maksudnya, orang yang tidak bersunat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “melalui huruf dan sunat.” “Huruf” di sini dapat merujuk pada hukum dalam bentuk tertulis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: orang yang tidak bersunat
  rationale: Kata ini secara harfiah berarti 'keadaan tidak bersunat', tetapi di sini digunakan secara metonimis untuk orang yang tidak bersunat. Pilihan ini mempertahankan rujukan personal tanpa menambahkan label etnis 'bukan Yahudi'.
- source_word: ἐκ φύσεως
  choice: secara alami
  rationale: Ungkapan ini menggambarkan keadaan tidak bersunat yang alamiah, sebagai kontras dengan kepemilikan sunat; pilihan ini juga tidak mempersempit maknanya secara pasti menjadi 'sejak lahir'.
- source_word: τελοῦσα
  choice: jika ia melakukan
  rationale: Partisipel ini menyatakan pelaksanaan nyata terhadap hukum Taurat dan dalam konteks memiliki nuansa kondisional. 'Melakukan' lebih alami daripada 'menggenapi' untuk ketaatan seseorang kepada hukum.
- source_word: νόμον
  choice: hukum Taurat
  rationale: Dalam konteks ini νόμος merujuk secara khusus kepada hukum Musa. 'Hukum Taurat' merupakan ungkapan Indonesia yang jelas dan lazim untuk rujukan tersebut.
- source_word: διὰ γράμματος καὶ περιτομῆς
  choice: sekalipun memiliki hukum tertulis dan sunat
  rationale: διά di sini menggambarkan sarana atau keadaan yang menyertai pelanggaran. Dalam bahasa Indonesia, ungkapan ini menyampaikan ironi bahwa kepemilikan hukum tertulis dan sunat tidak mencegah pelanggaran, tanpa memakai frasa kaku 'melalui huruf'.
- source_word: παραβάτην νόμου
  choice: melanggar hukum Taurat
  rationale: Bentuk predikatif personal Yunani dialihkan menjadi verba Indonesia yang alami, dengan tetap mempertahankan hubungan eksplisit dengan hukum Taurat.
theological_decisions:
- issue: Apakah ἀκροβυστία perlu diterjemahkan secara eksplisit sebagai 'orang bukan Yahudi'
  choice: orang yang tidak bersunat
  alternative: orang bukan Yahudi
  rationale: Konteksnya memang membandingkan orang Yahudi dan bukan Yahudi, tetapi kata Yunani menonjolkan kontras antara sunat dan tidak bersunat. Terjemahan tidak mempersempitnya menjadi label etnis yang tidak dinyatakan langsung.
- issue: Hubungan διὰ γράμματος καὶ περιτομῆς dengan pelanggaran hukum
  choice: sekalipun memiliki hukum tertulis dan sunat
  alternative: melalui hukum tertulis dan sunat
  rationale: Pilihan utama mengungkapkan daya konsesif yang tersirat dan menghasilkan bahasa Indonesia yang jelas, sementara catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah dan instrumental.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'engkau' dipertahankan karena sapaan Yunani berbentuk tunggal dan langsung. Istilah 'hukum Taurat' dipakai demi kejelasan kontekstual, sedangkan susunan kalimat mempertahankan kontras retoris antara ketaatan orang yang tidak bersunat dan pelanggaran orang yang memiliki hukum tertulis serta sunat.
