revisions:
- from: Dan orang yang tidak bersunat secara alami[a], jika ia melakukan hukum Taurat, akan menghakimi engkau yang, sekalipun memiliki hukum tertulis dan sunat[b], melanggar hukum Taurat.
  to: Dan orang yang secara alami tidak bersunat[a], yang menjalankan hukum Taurat, akan menghakimi engkau yang, dengan hukum tertulis dan sunat[b], adalah pelanggar hukum Taurat.
  rationale: Revisi menghapus tambahan makna “sekalipun memiliki” dan memakai “dengan” untuk menyampaikan διά secara wajar tanpa memastikan hubungan retoris yang diperdebatkan. Partisipel τελοῦσα diterjemahkan sebagai “yang menjalankan” agar fungsi pemerian dalam bahasa sumber tetap terlihat. Catatan kaki b diperbaiki agar padanan harfiah tetap benar dan tidak menyatakan “hukum tertulis” sebagai satu-satunya makna leksikal dari γράμμα.
