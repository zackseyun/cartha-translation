- from: Atau apakah kamu meremehkan kekayaan kemurahan-Nya, kelapangan hati-Nya, dan kesabaran-Nya[a], tanpa menyadari bahwa kemurahan Allah sedang menuntunmu kepada pertobatan?
  to: Atau apakah kamu meremehkan kekayaan kemurahan-Nya, kesediaan-Nya untuk menahan diri, dan kesabaran-Nya[a], tanpa menyadari bahwa kemurahan Allah sedang menuntunmu kepada pertobatan?
  rationale: Revisi terbatas pada padanan ἀνοχή. “Kesediaan-Nya untuk menahan diri” menyatakan dengan jelas kemurahan Allah yang belum menjalankan penghakiman, sambil mempertahankan pembedaan dari μακροθυμία (“kesabaran”). Tidak ada perubahan pada makna, ambiguitas teologis, atau penanda catatan kaki.
