id: ROM.2.4
reference: Romans 2:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/004.yaml
  text: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to repentance?
translation:
  language: id
  text: Atau apakah kamu meremehkan kekayaan kemurahan-Nya, kesediaan-Nya untuk menahan diri, dan kesabaran-Nya[a], tanpa menyadari bahwa kemurahan Allah sedang menuntunmu kepada pertobatan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kemurahan” pada kedua kemunculannya juga dapat diterjemahkan “kebaikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλούτου
  choice: kekayaan
  rationale: Mempertahankan metafora Paulus tentang kelimpahan sifat-sifat Allah dan susunan genitif sumber secara wajar dalam bahasa Indonesia.
- source_word: χρηστότητος / τὸ χρηστόν
  choice: kemurahan
  rationale: Kata “kemurahan” menyampaikan kebaikan Allah yang nyata dalam perlakuan-Nya kepada manusia dan dapat digunakan secara konsisten pada kedua kemunculan.
- source_word: ἀνοχῆς
  choice: kelapangan hati
  rationale: Dalam konteks penangguhan hukuman, ungkapan ini menyatakan sikap Allah yang menahan diri dan memberi ruang, tanpa konotasi relativistik yang dapat melekat pada “toleransi.”
- source_word: μακροθυμίας
  choice: kesabaran
  rationale: Padanan Indonesia yang jelas dan alami untuk ketabahan menanggung dalam jangka panjang.
- source_word: καταφρονεῖς
  choice: meremehkan
  rationale: Menyampaikan tindakan memandang rendah atau menganggap tidak berarti, dengan ketajaman teguran yang sesuai konteks.
- source_word: ἀγνοῶν
  choice: tanpa menyadari
  rationale: Mencerminkan partisip yang menyatakan ketidaktahuan tanpa memastikan bahwa pengabaian itu disengaja.
- source_word: εἰς μετάνοιάν
  choice: kepada pertobatan
  rationale: Mempertahankan arah yang dinyatakan εἰς dan memakai istilah Indonesia yang mencakup perubahan hati, pikiran, serta arah hidup.
- source_word: ἄγει
  choice: sedang menuntun
  rationale: Mewakili kala kini Yunani secara alami dan menonjolkan tindakan Allah yang berlangsung terhadap orang yang disapa.
theological_decisions:
- issue: Apakah χρηστότης / χρηστόν diterjemahkan sebagai “kemurahan” atau “kebaikan.”
  choice: Kedua kemunculan diterjemahkan “kemurahan.”
  alternative: Kedua kemunculan dapat diterjemahkan “kebaikan.”
  rationale: Konteks menekankan perlakuan Allah yang baik dan penuh belas kasih terhadap orang berdosa sementara Ia menangguhkan penghakiman; “kemurahan” mempertahankan nuansa relasional itu tanpa meniadakan arti moral yang lebih luas.
- issue: Apakah μετάνοια dinyatakan sebagai sekadar perubahan pikiran atau sebagai pertobatan.
  choice: pertobatan
  alternative: perubahan pikiran
  rationale: Dalam konteks teguran moral Paulus, μετάνοια menunjuk perubahan batin dan arah hidup, sehingga “pertobatan” lebih utuh dan alami serta tidak mempersempit maknanya menjadi proses intelektual semata.
- issue: Daya tindakan kemurahan Allah dalam frasa εἰς μετάνοιάν σε ἄγει.
  choice: “sedang menuntunmu kepada pertobatan,” tanpa menjelaskan apakah tuntunan itu pasti menghasilkan pertobatan.
  alternative: “dimaksudkan untuk membawamu kepada pertobatan” atau “membuatmu bertobat.”
  rationale: Terjemahan mempertahankan citra Allah yang menuntun dan arah menuju pertobatan, tanpa menyelesaikan ketegangan teologis antara tindakan Allah dan tanggapan manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal dipertahankan dengan “kamu/-mu” karena verba dan pronomina Yunani berbentuk tunggal. Struktur pertanyaan retoris serta tiga serangkai sifat Allah dipertahankan.
