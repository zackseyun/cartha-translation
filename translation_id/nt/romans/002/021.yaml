  text: ὁ οὖν διδάσκων ἕτερον σεαυτὸν οὐ διδάσκεις; ὁ κηρύσσων μὴ κλέπτειν κλέπτεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/021.yaml
  text: You, therefore, who teach another, do you not teach yourself? You who proclaim, “Do not steal,” do you steal?
translation:
  language: id
  text: Jadi, engkau yang mengajar orang lain, tidakkah engkau mengajar dirimu sendiri? Engkau yang memberitakan, “Jangan mencuri,” apakah engkau mencuri?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Jadi
  rationale: Menandai kesimpulan atau peralihan inferensial dari uraian sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ὁ ... διδάσκων
  choice: engkau yang mengajar
  rationale: Partisip substantival diterjemahkan sebagai klausa relatif agar alami sekaligus mempertahankan sapaan orang kedua tunggal.
- source_word: ἕτερον
  choice: orang lain
  rationale: Mempertahankan objek tunggal dan kontras dengan diri sendiri; lebih alami daripada 'yang lain' tanpa nomina dalam konteks ini.
- source_word: σεαυτὸν
  choice: dirimu sendiri
  rationale: Menjaga penekanan refleksif dan kontras retoris antara mengajar orang lain dan diri sendiri.
- source_word: οὐ διδάσκεις;
  choice: tidakkah engkau mengajar
  rationale: Mempertahankan bentuk pertanyaan negatif dan daya teguran yang mengharapkan jawaban tersirat.
- source_word: ὁ κηρύσσων
  choice: engkau yang memberitakan
  rationale: Menyampaikan gagasan pengumuman terbuka tanpa membatasi maknanya pada khotbah dalam konteks ibadah.
- source_word: μὴ κλέπτειν
  choice: “Jangan mencuri,”
  rationale: Isi pemberitaan dinyatakan sebagai larangan langsung yang alami dalam bahasa Indonesia.
- source_word: κλέπτεις;
  choice: apakah engkau mencuri?
  rationale: Mempertahankan pertanyaan retoris langsung dalam bentuk kini tanpa menambahkan penafsiran.
