id: ROM.2.12
reference: Romans 2:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/012.yaml
  text: For all who sinned apart from the law will also perish apart from the law[c][b][a], and all who sinned under the law will be judged through the law.
translation:
  language: id
  text: Sebab semua orang yang berbuat dosa tanpa hukum Taurat akan binasa juga tanpa hukum Taurat,[a] dan semua orang yang berbuat dosa di bawah hukum Taurat[b] akan dihakimi melalui hukum Taurat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di luar hukum Taurat”; ἀνόμως juga dapat diterjemahkan “tanpa hukum” atau “secara melanggar hukum” pada kedua kemunculannya.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “dalam hukum Taurat”; “di bawah hukum Taurat” menonjolkan makna berada dalam lingkup kewenangannya.
    reason: lexical_alternative
  - marker: c
    text: Atau “oleh hukum Taurat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόμως
  choice: tanpa hukum Taurat
  rationale: Ungkapan ini diterjemahkan secara relasional untuk mempertahankan kontras Paulus dengan mereka yang berada di bawah hukum Taurat. Pilihan ini menunjuk pada ketiadaan hukum Musa sebagai kerangka yang dimiliki seseorang, bukan sekadar perilaku yang melanggar hukum.
- source_word: ἥμαρτον
  choice: berbuat dosa
  rationale: Padanan verbal yang alami dan lugas dalam bahasa Indonesia; tidak menambahkan penafsiran mengenai aspek tindakan melampaui bentuk aoris sumber.
- source_word: ἀπολοῦνται
  choice: akan binasa
  rationale: Mempertahankan bentuk masa depan dan akibat yang tegas tanpa menentukan secara lebih rinci hakikat kebinasaan itu.
- source_word: ἐν νόμῳ
  choice: di bawah hukum Taurat
  rationale: Menyampaikan keberadaan dalam lingkup atau yurisdiksi hukum Taurat secara idiomatis, sambil mempertahankan kontras dengan 'tanpa hukum Taurat'.
- source_word: διὰ νόμου
  choice: melalui hukum Taurat
  rationale: Mempertahankan perbedaan dari ἐν νόμῳ dan menyatakan hukum Taurat sebagai sarana atau tolok ukur dalam penghakiman.
- source_word: κριθήσονται
  choice: akan dihakimi
  rationale: Padanan yudisial yang netral; tidak menggantinya dengan 'akan dihukum' atau 'akan dinyatakan bersalah', sehingga hasil penghakiman tidak diperinci melebihi teks.
- source_word: Ὅσοι ... καὶ ὅσοι
  choice: semua orang yang ... dan semua orang yang
  rationale: Menangkap cakupan distributif dan mempertahankan kesejajaran kedua kelompok dengan jelas.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan fungsi penghubung yang menunjukkan bahwa ayat ini memberikan dasar bagi pernyataan sebelumnya.
theological_decisions:
- issue: Rujukan νόμος
  choice: hukum Taurat, terutama hukum Musa
  alternative: hukum dalam arti moral yang lebih umum
  rationale: Konteks Roma 2 membandingkan orang bukan Yahudi yang tidak memiliki hukum Musa dengan orang Yahudi yang berada dalam lingkupnya. 'Hukum Taurat' menyampaikan rujukan tersebut secara wajar dalam bahasa Indonesia.
- issue: Makna 'akan binasa' dan penghukuman akhir
  choice: akan binasa, tanpa merinci bentuk atau mekanisme kebinasaan
  alternative: akan dihukum; akan dimusnahkan
  rationale: Ayat ini menyatakan akibat penghakiman, tetapi tidak menjelaskan di sini apakah kebinasaan berarti pemusnahan atau bentuk hukuman tertentu. Terjemahan mempertahankan ketegangan itu.
- issue: Lingkup κριθήσονται
  choice: akan dihakimi
  alternative: akan dihukum; akan dinyatakan bersalah
  rationale: Kata Yunani menyatakan tindakan penilaian yudisial. Terjemahan tidak mendahului konteks dengan menetapkan hasil penilaian dalam kata kerja itu sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kesejajaran kedua klausa dipertahankan, sementara pengulangan 'hukum Taurat' dibiarkan demi kejelasan dan kesetiaan pada struktur argumentasi.
