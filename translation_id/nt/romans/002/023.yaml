id: ROM.2.23
reference: Romans 2:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς ἐν νόμῳ καυχᾶσαι, διὰ τῆς παραβάσεως τοῦ νόμου τὸν θεὸν ἀτιμάζεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/023.yaml
  text: You who boast in the law[a], do you dishonor God through your transgression of the law?
translation:
  language: id
  text: Engkau yang bermegah dalam hukum Taurat, apakah engkau menghina Allah dengan melanggar hukum Taurat itu?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν νόμῳ
  choice: dalam hukum Taurat
  rationale: Mempertahankan ungkapan preposisional Yunani dan menunjukkan bahwa νόμος dalam konteks ini mengacu pada hukum Taurat, tanpa menjadikannya sekadar hal yang dibicarakan.
- source_word: καυχᾶσαι
  choice: bermegah
  rationale: Menjaga nada tajam dan kritis dari καυχάομαι serta cocok dengan pemakaian Paulus mengenai kebanggaan atas status atau hak istimewa.
- source_word: διὰ τῆς παραβάσεως τοῦ νόμου
  choice: dengan melanggar hukum Taurat itu
  rationale: Ungkapan verbal ini lebih alami dalam bahasa Indonesia daripada nomina abstrak 'melalui pelanggaran', sambil tetap menyampaikan hubungan sarana yang dinyatakan oleh διά dan gagasan παράβασις.
- source_word: τὸν θεὸν
  choice: Allah
  rationale: Sebutan baku dan pasti dalam bahasa Indonesia untuk referen ilahi ini.
- source_word: ἀτιμάζεις
  choice: menghina
  rationale: Dalam konteks ini berarti memperlakukan tanpa hormat atau mendatangkan kehinaan; 'menghina' menyampaikan daya tuduh retorisnya secara alami dan langsung.
theological_decisions:
- issue: Makna νόμος dalam retorika Paulus
  choice: hukum Taurat
  alternative: hukum
  rationale: Konteks sapaan kepada orang yang mengandalkan hukum menunjukkan Taurat sebagai referen, sedangkan bentuk huruf besar-kecil saja tidak cukup menjernihkan hal itu dalam bahasa Indonesia.
- issue: Bentuk pertanyaan retoris
  choice: apakah engkau menghina Allah ...?
  alternative: engkau menghina Allah ...!
  rationale: Tanda tanya dalam teks sumber dipertahankan agar bentuk tuduhan retoris Paulus tidak diubah menjadi pernyataan biasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina tunggal 'engkau' mempertahankan orang kedua tunggal dalam teks Yunani. Pengulangan 'hukum Taurat' mencerminkan pengulangan νόμος dan menjaga kontras antara bermegah dalam Taurat dan melanggarnya.
