  text: dan engkau mengetahui kehendak-Nya serta menilai apa yang lebih utama[a], karena engkau diajar dari hukum Taurat[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hal-hal yang berbeda.” Ungkapan Yunani ini dalam konteks dapat berarti “apa yang lebih utama” atau “apa yang unggul.”'
