lexical_decisions:
- source_word: γινώσκεις
  choice: mengetahui
  rationale: Bentuk kini indikatif ini menyatakan pengetahuan yang dimiliki oleh lawan bicara; 'mengetahui' merupakan padanan langsung dan wajar.
- source_word: τὸ θέλημα
  choice: kehendak-Nya
  rationale: Teks Yunani secara harfiah memakai 'kehendak itu' tanpa kata ganti milik, tetapi dalam konteks Allah adalah rujukannya; bentuk ini wajar dalam bahasa Indonesia.
- source_word: δοκιμάζεις
  choice: dapat menilai
  rationale: Kata kerja ini menunjuk pada pengujian atau penilaian yang menghasilkan pengenalan terhadap apa yang patut dipilih. 'Dapat menilai' mempertahankan unsur evaluatif tanpa memaksakan hasil berupa persetujuan.
- source_word: τὰ διαφέροντα
  choice: apa yang lebih baik
  rationale: Ungkapan ini dapat berarti secara harfiah 'hal-hal yang berbeda' atau secara idiomatis 'apa yang lebih utama/baik'. Dalam konteks pengajaran moral dari hukum Taurat, arti komparatif ini paling alami, sementara ambiguitasnya dicatat.
- source_word: κατηχούμενος
  choice: karena engkau diajar
  rationale: Partisipel pasif ini menjelaskan dasar atau sarana bagi pengetahuan dan penilaian tersebut. Klausa kausal menghasilkan bahasa Indonesia yang lancar.
- source_word: ἐκ τοῦ νόμου
  choice: dari hukum Taurat
  rationale: ἐκ mempertahankan gagasan sumber, sedangkan νόμος dalam konteks ini menunjuk pada hukum Taurat; pilihan ini lebih jelas bagi pembaca Indonesia daripada sekadar 'hukum'.
theological_decisions:
- issue: Pemilik 'kehendak' tidak dinyatakan secara eksplisit dalam bahasa Yunani
  choice: kehendak-Nya
  alternative: kehendak itu
  rationale: Konteks ayat sebelumnya menunjukkan bahwa Allah adalah rujukannya. Kapitalisasi kata ganti menandai rujukan tersebut tanpa memasukkan doktrin tambahan.
- issue: Makna τὰ διαφέροντα
  choice: apa yang lebih baik
  alternative: hal-hal yang berbeda
  rationale: Ungkapan Yunani dapat menunjuk pada hal-hal yang berbeda atau hal-hal yang lebih utama. Terjemahan utama memakai makna idiomatis yang sesuai konteks, dan arti yang lebih harfiah dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Bentuk tunggal 'engkau' dipertahankan karena Paulus sedang menyapa seorang lawan bicara representatif. 'Hukum Taurat' dipakai untuk memperjelas rujukan νόμος dalam konteks Yahudi.
