  naturalness: Pembukaan “dan mengetahui” tidak sepenuhnya serasi dengan penggunaan “engkau” kemudian dalam satuan kalimat ini. “Dan engkau mengetahui ... serta menilai ...” lebih lengkap dan alami dalam bahasa Indonesia modern. Penghilangan “dapat” juga membuat kalimat lebih langsung.
  terminology: “Kehendak-Nya” wajar berdasarkan rujukan kontekstual kepada Allah, meskipun posesif itu tersirat dalam Yunani. “Hukum Taurat” sesuai untuk νόμος dalam konteks sapaan kepada orang Yahudi. “Apa yang lebih utama” menyampaikan kemungkinan idiomatis τὰ διαφέροντα tanpa menyatakan kepastian berlebihan; kemungkinan harfiahnya perlu tetap dicatat.
  issues:
