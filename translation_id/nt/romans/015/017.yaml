  text: ἔχω οὖν ⸀τὴν καύχησιν ἐν Χριστῷ Ἰησοῦ τὰ πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/017.yaml
  text: Therefore I have reason for boasting in Messiah Jesus in the things pertaining to God[a][b][c].
translation:
  language: id
  text: Karena itu, dalam Mesias Yesus[b] aku mempunyai alasan untuk bermegah[a] dalam hal-hal yang berkaitan dengan Allah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aku dapat bermegah” atau “aku mempunyai dasar untuk bermegah.”
    reason: lexical_alternative
  - marker: b
    text: Yunani “dalam Kristus Yesus.” Di sini Χριστός diterjemahkan “Mesias” karena berfungsi sebagai gelar.
    reason: alternative_reading
  - marker: c
    text: Atau “mengenai perkara-perkara yang berkenaan dengan Allah” atau “dalam hal-hal yang menyangkut Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω
  choice: aku mempunyai
  rationale: Bentuk kini orang pertama tunggal diterjemahkan secara langsung; bersama καύχησιν, ungkapan ini secara idiomatis menjadi “aku mempunyai alasan untuk bermegah”.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan atau akibat dari uraian sebelumnya dan mempertahankan hubungan logis antarayat.
- source_word: καύχησιν
  choice: alasan untuk bermegah
  rationale: Nomina ini dapat menunjuk pada tindakan bermegah maupun dasar untuk bermegah. Dalam konstruksi ἔχω τὴν καύχησιν, ungkapan “mempunyai alasan untuk bermegah” alami dalam bahasa Indonesia dan sesuai dengan maksud idiomatisnya.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: “Dalam” mempertahankan gagasan lingkup atau persatuan, bukan menjadikannya sekadar sarana. Χριστός di sini tetap berfungsi sebagai gelar, sehingga diterjemahkan “Mesias”.
- source_word: τὰ πρὸς τὸν θεόν
  choice: mengenai hal-hal yang berkaitan dengan Allah
  rationale: Ungkapan ini mencakup perkara-perkara yang berhubungan dengan Allah, khususnya pelayanan Paulus, tanpa mempersempitnya menjadi pelayanan keimaman saja.
- source_word: θεόν
  choice: Allah
  rationale: Padanan baku θεός dalam konteks ini.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός masih bermakna sebagai gelar yang disematkan kepada Yesus. “Mesias” menerjemahkan gelar tersebut, sedangkan “Kristus” merupakan bentuk transliterasi tradisional.
- issue: Makna καύχησις Paulus
  choice: Alasan Paulus untuk bermegah dibatasi oleh keberadaannya dalam Mesias Yesus dan oleh perkara-perkara yang berkaitan dengan Allah
  alternative: Pernyataan kebanggaan atau keyakinan pribadi secara umum
  rationale: Teks menempatkan kemegahan itu “dalam Mesias Yesus” dan mengarahkannya kepada hal-hal yang berkaitan dengan Allah. Terjemahan mempertahankan batasan ini tanpa menambahkan penjelasan teologis ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “aku” sesuai dengan tuturan pribadi Paulus. Susunan kalimat dibuat alami sambil mempertahankan hubungan “dalam Mesias Yesus” dan keluasan idiom τὰ πρὸς τὸν θεόν.
