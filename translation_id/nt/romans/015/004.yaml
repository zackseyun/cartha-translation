id: ROM.15.4
reference: Romans 15:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅσα γὰρ προεγράφη, ⸀εἰς τὴν ἡμετέραν διδασκαλίαν ⸀ἐγράφη, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/004.yaml
  text: For whatever was written beforehand was written for our instruction[b][a], so that through the endurance and through the encouragement of the Scriptures we might have hope.
translation:
  language: id
  text: Sebab segala sesuatu yang ditulis dahulu, ditulis untuk mengajar kita, supaya melalui ketekunan dan melalui penguatan dari Kitab Suci[a], kita memiliki pengharapan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dorongan dari Kitab Suci” atau “penghiburan dari Kitab Suci”; kata Yunaninya dapat berarti penguatan, dorongan, penghiburan, atau nasihat.
    reason: lexical_alternative
  - marker: b
    text: Atau “kita dapat memiliki pengharapan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα
  choice: segala sesuatu yang
  rationale: Mengungkapkan cakupan menyeluruh dari pronomina relatif netral jamak secara alami dalam bahasa Indonesia.
- source_word: προεγράφη
  choice: ditulis dahulu
  rationale: Mempertahankan makna temporal awalan προ-, yakni tulisan yang sudah ada sebelumnya, tanpa menyiratkan makna lain seperti dipajang di muka umum.
- source_word: εἰς τὴν ἡμετέραν διδασκαλίαν
  choice: untuk mengajar kita
  rationale: Menyampaikan tujuan penulisan dengan ungkapan Indonesia yang alami; διδασκαλία di sini menunjuk pada pengajaran atau pembentukan pembaca.
- source_word: ἐγράφη
  choice: ditulis
  rationale: Mempertahankan pengulangan verba γράφω yang memberi penekanan retoris dalam bahasa Yunani.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan atau hasil yang dimaksud secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: διὰ τῆς ὑπομονῆς
  choice: melalui ketekunan
  rationale: ὑπομονή menunjuk pada daya bertahan yang sabar di tengah kesulitan; 'ketekunan' merupakan padanan yang ringkas dan lazim.
- source_word: διὰ τῆς παρακλήσεως τῶν γραφῶν
  choice: melalui penguatan dari Kitab Suci
  rationale: παράκλησις dapat berarti dorongan, penghiburan, atau nasihat. 'Penguatan' menangkap fungsi yang menopang pengharapan, sedangkan 'dari' menyatakan Kitab Suci sebagai sumber tanpa memaksakan satu analisis genitif yang terlalu sempit.
- source_word: τῶν γραφῶν
  choice: Kitab Suci
  rationale: Dalam pemakaian Paulus, γραφαί merujuk pada tulisan-tulisan suci yang diakui; bentuk tunggal kolektif 'Kitab Suci' paling alami dalam bahasa Indonesia.
- source_word: τὴν ἐλπίδα
  choice: pengharapan
  rationale: Nomina abstrak ini secara alami tidak memerlukan penanda tertentu dalam bahasa Indonesia.
- source_word: ἔχωμεν
  choice: kita memiliki
  rationale: Subjungtif sesudah ἵνα menyatakan tujuan; bersama 'supaya', bentuk indikatif Indonesia sudah menyampaikan fungsi itu tanpa menambahkan kadar ketidakpastian.
theological_decisions:
- issue: Hubungan Kitab Suci dengan ketekunan, penguatan, dan pengharapan
  choice: Terjemahan melekatkan 'dari Kitab Suci' langsung pada 'penguatan', sesuai urutan Yunani, sambil membiarkan keseluruhan kalimat menyatakan bahwa tulisan terdahulu mengajar dan menopang pengharapan umat.
  alternative: Frasa tersebut dapat dipahami lebih luas sebagai ketekunan dan penguatan yang sama-sama diberikan melalui Kitab Suci, atau sebagai sifat-sifat yang dicontohkan di dalam Kitab Suci.
  rationale: Susunan Yunani secara eksplisit menempatkan genitif τῶν γραφῶν setelah παρακλήσεως, tetapi tidak sepenuhnya menutup jangkauan konseptualnya terhadap pasangan 'ketekunan dan penguatan'. Terjemahan tidak menyelesaikan ketegangan ini secara dogmatis.
- issue: Kadar kepastian dalam ἔχωμεν
  choice: '''Supaya ... kita memiliki pengharapan'' menyatakan tujuan tanpa memberi kesan bahwa pengharapan itu sekadar kemungkinan lemah.'
  alternative: '''Supaya ... kita dapat memiliki pengharapan'' dapat menonjolkan kemungkinan atau kemampuan.'
  rationale: Subjungtif Yunani dituntut oleh konstruksi tujuan ἵνα dan tidak dengan sendirinya menyatakan keraguan. Bahasa Indonesia cukup memakai 'supaya' untuk menandai tujuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'ditulis' dipertahankan untuk mengikuti penekanan sumber. 'Penguatan' dipilih sebagai istilah utama yang cukup luas bagi rentang makna παράκλησις, dengan alternatif penting dicatat dalam catatan kaki.
