id: ROM.15.25
reference: Romans 15:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: νυνὶ δὲ πορεύομαι εἰς Ἰερουσαλὴμ διακονῶν τοῖς ἁγίοις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/025.yaml
  text: But now I am going to Jerusalem[a], ministering to the saints.
translation:
  language: id
  text: Namun sekarang aku sedang pergi ke Yerusalem untuk melayani orang-orang kudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk membantu orang-orang kudus” atau “untuk membawa bantuan kepada orang-orang kudus.” Kata Yunani yang diterjemahkan “melayani” dapat menunjuk pada pelayanan praktis; di sini kemungkinan besar mengacu pada Paulus yang membawa sumbangan bagi umat percaya di Yerusalem (lihat Rm. 15:26).
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Namun sekarang
  rationale: νυνί menandai waktu kini dengan penekanan, sedangkan δέ memberi peralihan atau kontras ringan. “Namun sekarang” menyampaikan keduanya secara alami.
- source_word: πορεύομαι
  choice: aku sedang pergi
  rationale: Bentuk kini ini menyatakan perjalanan atau maksud Paulus yang sedang berlaku. Ungkapan tersebut langsung dan tidak menambahkan nuansa yang tidak ada dalam teks.
- source_word: εἰς Ἰερουσαλὴμ
  choice: ke Yerusalem
  rationale: εἰς dengan nama kota menunjukkan arah atau tujuan perjalanan.
- source_word: διακονῶν
  choice: untuk melayani
  rationale: Partisip ini menerangkan tujuan atau keadaan yang menyertai perjalanan Paulus. Dalam bahasa Indonesia, konstruksi tujuan paling alami di sini, sambil mempertahankan makna dasar pelayanan praktis.
- source_word: τοῖς ἁγίοις
  choice: orang-orang kudus
  rationale: Dalam pemakaian Paulus, frasa ini lazim menunjuk kepada umat percaya yang dikuduskan bagi Allah. “Orang-orang kudus” mempertahankan bentuk leksikal dan istilah eklesial tanpa menggantinya dengan parafrasa kontekstual.
theological_decisions:
- issue: Rujukan “orang-orang kudus”
  choice: Tetap diterjemahkan “orang-orang kudus”; dalam konteks merujuk kepada umat percaya di Yerusalem, khususnya mereka yang miskin.
  alternative: “umat Allah” atau penyebutan langsung “orang-orang percaya di Yerusalem”
  rationale: Teks Yunani sendiri memakai istilah umum οἱ ἅγιοι. Konteks ayat berikutnya memperjelas penerimanya, sehingga terjemahan utama tidak perlu mempersempit frasa secara eksplisit.
- issue: Hubungan partisip διακονῶν dengan perjalanan
  choice: 'Dinyatakan sebagai tujuan: “untuk melayani”.'
  alternative: “sambil melayani” atau “dengan membawa bantuan kepada”
  rationale: Konteks pengumpulan bantuan mendukung nuansa tujuan, tetapi verba itu sendiri tetap lebih luas daripada sekadar membawa dana. Catatan kaki mempertahankan kemungkinan nuansa praktis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar. Pronomina “aku” mengikuti suara pribadi Paulus; “orang-orang kudus” dipertahankan sebagai istilah sumber yang bermartabat dan dikenal luas. Penanda catatan kaki ditempatkan langsung dalam teks utama.
