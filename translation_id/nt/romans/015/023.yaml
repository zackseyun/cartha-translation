  register: Bahasa Indonesia baku-modern dengan nada bermartabat. Bentuk orang pertama dibuat eksplisit demi kejelasan. Koma akhir dipertahankan karena ayat ini merupakan bagian kalimat yang berlanjut ke ayat berikutnya; 'sedangkan' mencerminkan δέ kedua tanpa menghasilkan susunan yang kaku.
