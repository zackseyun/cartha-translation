  text: νυνὶ δὲ μηκέτι τόπον ἔχων ἐν τοῖς κλίμασι τούτοις, ἐπιποθίαν δὲ ἔχων τοῦ ἐλθεῖν πρὸς ὑμᾶς ἀπὸ ⸀ἱκανῶν ἐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/023.yaml
  text: But now[a], no longer having any place in these regions, but having had a longing for many years to come to you,
translation:
  language: id
  text: Namun sekarang, saya tidak lagi mempunyai tempat[a] di wilayah-wilayah ini, dan saya sudah bertahun-tahun rindu untuk datang kepada kalian,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ruang/kesempatan di wilayah-wilayah ini”; ungkapan Yunani ini dapat berarti bahwa tidak ada lagi lingkup pelayanan yang tersisa di sana, bukan sekadar tidak ada lokasi secara fisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Namun sekarang
  rationale: Menyampaikan peralihan temporal sekaligus daya kontras δέ secara alami dalam bahasa Indonesia.
- source_word: μηκέτι
  choice: tidak lagi
  rationale: Menunjukkan bahwa keadaan sebelumnya kini telah berakhir.
- source_word: τόπον ἔχων
  choice: mempunyai tempat
  rationale: Mempertahankan ungkapan Yunani dan ambiguitasnya, sementara catatan kaki menjelaskan bahwa yang dimaksud dapat berupa ruang atau kesempatan pelayanan.
- source_word: ἐν τοῖς κλίμασι τούτοις
  choice: di wilayah-wilayah ini
  rationale: κλίμασι menunjuk pada kawasan-kawasan geografis; bentuk jamak dipertahankan.
- source_word: ἐπιποθίαν ... ἔχων
  choice: saya rindu
  rationale: Mengungkapkan hasrat yang kuat dalam bahasa Indonesia yang wajar tanpa melemahkan maknanya.
- source_word: τοῦ ἐλθεῖν πρὸς ὑμᾶς
  choice: datang kepada kalian
  rationale: Mengikuti bentuk eksplisit teks Yunani tanpa menambahkan gagasan 'mengunjungi'.
- source_word: ἀπὸ ἱκανῶν ἐτῶν
  choice: sudah bertahun-tahun
  rationale: Ungkapan durasi yang alami dalam bahasa Indonesia, menunjukkan kerinduan yang berlangsung dari masa lampau hingga kini.
