id: ROM.15.26
reference: Romans 15:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εὐδόκησαν γὰρ Μακεδονία καὶ Ἀχαΐα κοινωνίαν τινὰ ποιήσασθαι εἰς τοὺς πτωχοὺς τῶν ἁγίων τῶν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/026.yaml
  text: For Macedonia and Achaia were pleased to make a certain contribution for the poor among the saints in Jerusalem[a].
translation:
  language: id
  text: Sebab Makedonia dan Akhaya dengan senang hati memberikan sumbangan bagi orang-orang miskin di antara orang-orang kudus di Yerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyatakan suatu bentuk persekutuan”; ungkapan Yunani menekankan persekutuan yang diwujudkan melalui bantuan materi.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: dengan senang hati
  rationale: Mengungkapkan baik kerelaan maupun sikap positif yang terkandung dalam εὐδοκέω, bukan sekadar keputusan.
- source_word: γὰρ
  choice: Sebab
  rationale: Memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya.
- source_word: Μακεδονία καὶ Ἀχαΐα
  choice: Makedonia dan Akhaya
  rationale: Mempertahankan nama kedua wilayah sebagai subjek metonimis, sebagaimana dalam bahasa Yunani, tanpa menambahkan 'jemaat' atau 'orang percaya'.
- source_word: κοινωνίαν τινὰ ποιήσασθαι
  choice: memberikan sumbangan
  rationale: Dalam konteks pengumpulan bantuan, ungkapan ini menunjuk pada tindakan berbagi yang diwujudkan melalui dukungan materi. Bahasa Indonesia tidak memerlukan padanan eksplisit untuk τινά agar ketidaktentuan jumlah tetap tersirat secara alami.
- source_word: εἰς τοὺς πτωχοὺς
  choice: bagi orang-orang miskin
  rationale: εἰς menyatakan sasaran atau penerima manfaat; pilihan ini alami dan tetap dekat dengan makna sumber.
- source_word: τῶν ἁγίων
  choice: di antara orang-orang kudus
  rationale: Genitif tersebut mengidentifikasi orang miskin sebagai bagian dari kelompok orang kudus.
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: di Yerusalem
  rationale: Frasa preposisional ini menerangkan orang-orang kudus dan diterjemahkan secara langsung serta alami.
theological_decisions:
- issue: Padanan ἅγιοι dalam konteks Paulus
  choice: orang-orang kudus
  alternative: umat Allah; orang-orang yang dikuduskan
  rationale: Ini mempertahankan istilah khas Paulus bagi komunitas orang percaya tanpa membatasinya pada tokoh yang kemudian dikanonisasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama wilayah dipertahankan sebagai subjek metonimis. Frasa 'dengan senang hati' ditempatkan secara idiomatis untuk menyampaikan kerelaan positif.
