id: ROM.15.15
reference: Romans 15:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀τολμηρότερον δὲ ἔγραψα ⸀ὑμῖν ἀπὸ μέρους, ὡς ἐπαναμιμνῄσκων ὑμᾶς, διὰ τὴν χάριν τὴν δοθεῖσάν μοι ⸀ὑπὸ τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/015.yaml
  text: But I have written to you rather boldly in part, as reminding you again, because of the grace given to me by God,
translation:
  language: id
  text: Namun, saya telah menulis kepada kalian dengan lebih berani dalam beberapa hal[a], untuk kembali mengingatkan kalian, karena anugerah yang telah Allah berikan kepada saya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Saya telah menulis kepada kalian dengan lebih berani dalam beberapa bagian.” Susunan Yunaninya dapat mengaitkan gagasan “dalam beberapa hal” dengan isi tulisan atau dengan kadar keberanian Paulus.
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ini, “anugerah yang telah Allah berikan kepada saya” berkaitan dengan pelayanan atau amanat yang Allah karuniakan kepada Paulus, khususnya pelayanannya kepada bangsa-bangsa lain (ayat 16).
    reason: cross_reference
lexical_decisions:
- source_word: τολμηρότερον
  choice: dengan agak berani
  rationale: Bentuk komparatif ini menyatakan kadar keberanian yang lebih besar. Ungkapan 'agak berani' alami dalam bahasa Indonesia dan sesuai dengan nada sopan Paulus.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan kontras ringan dari pujian sebelumnya.
- source_word: ἔγραψα
  choice: saya telah menulis
  rationale: Aoristus dalam konteks surat merujuk pada tindakan menulis surat ini; bentuk perfektif Indonesia terdengar alami.
- source_word: ἀπὸ μέρους
  choice: dalam beberapa hal
  rationale: Frasa ini dapat berarti 'sebagian' atau 'mengenai beberapa pokok'. Pilihan ini alami dalam konteks isi surat, sementara ambiguitasnya dicatat dalam catatan kaki.
- source_word: ὡς ἐπαναμιμνῄσκων ὑμᾶς
  choice: seolah-olah mengingatkan kalian kembali
  rationale: ὡς mempertahankan nuansa cara Paulus menggambarkan tindakannya, sedangkan verba majemuknya membawa gagasan mengingatkan kembali.
- source_word: διὰ τὴν χάριν
  choice: karena anugerah
  rationale: διά dengan akusatif menyatakan alasan atau dasar. 'Anugerah' mempertahankan istilah teologis Paulus tanpa mempersempitnya menjadi jabatan atau amanat.
- source_word: τὴν δοθεῖσάν μοι ὑπὸ τοῦ θεοῦ
  choice: yang diberikan Allah kepada saya
  rationale: Konstruksi pasif dengan ὑπό menyatakan Allah sebagai pelaku; bentuk aktif ini lebih alami dalam bahasa Indonesia tanpa mengubah makna.
theological_decisions:
- issue: Makna χάρις dalam konteks
  choice: Mempertahankan 'anugerah' dalam teks utama, dengan penjelasan bahwa di sini anugerah berkaitan dengan pelayanan atau amanat kerasulan Paulus.
  alternative: Menerjemahkannya langsung sebagai 'tugas pelayanan' atau memahaminya hanya sebagai kemurahan ilahi secara umum.
  rationale: Ayat 16 mengaitkan anugerah tersebut dengan pelayanan Paulus kepada bangsa-bangsa lain. Namun, istilah Yunani tetap χάρις, sehingga terjemahan utama tidak boleh meniadakan keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Kalian' dipakai untuk menyatakan bentuk jamak ὑμῖν/ὑμᾶς secara jelas; 'saya' menjaga nada pribadi dan sopan. Tanda catatan kaki [a] dan [b] ditempatkan pada bagian teks yang dijelaskan.
