id: ROM.15.14
reference: Romans 15:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πέπεισμαι δέ, ἀδελφοί μου, καὶ αὐτὸς ἐγὼ περὶ ὑμῶν, ὅτι καὶ αὐτοὶ μεστοί ἐστε ἀγαθωσύνης, πεπληρωμένοι ⸀πάσης γνώσεως, δυνάμενοι καὶ ⸀ἀλλήλους νουθετεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/014.yaml
  text: And I myself am convinced about you[a], my brothers, that you yourselves also are full of goodness, filled with all knowledge[b], and able also to instruct one another.
translation:
  language: id
  text: Dan aku sendiri yakin bahwa kalian, Saudara-saudaraku[a], juga penuh dengan kebaikan, dipenuhi dengan segala pengetahuan, dan juga sanggup saling menasihati[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “Saudara-saudaraku” dapat digunakan untuk menyapa sesama orang percaya secara kolektif, termasuk perempuan maupun laki-laki.
    reason: lexical_alternative
  - marker: b
    text: Atau “saling memperingatkan” atau “saling menegur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πέπεισμαι
  choice: aku ... yakin
  rationale: Bentuk perfektum menyatakan keyakinan yang telah terbentuk dan kini tetap ada; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: δέ
  choice: Namun
  rationale: Menandai peralihan ringan dalam alur pembahasan; 'Namun' tidak harus menyiratkan pertentangan yang tajam.
- source_word: ἀδελφοί μου
  choice: Saudara-saudaraku
  rationale: Mempertahankan sapaan kekeluargaan dan bentuk posesif Yunani secara wajar; cakupan jemaat yang meliputi laki-laki dan perempuan dijelaskan dalam catatan kaki.
- source_word: καὶ αὐτὸς ἐγὼ
  choice: aku sendiri
  rationale: Menangkap penegasan pribadi Paulus tanpa membuat susunan Indonesia terasa berlebihan.
- source_word: περὶ ὑμῶν
  choice: tentang kamu
  rationale: Padanan langsung dan alami bagi περί dengan genetif; 'kamu' merujuk kepada jemaat secara kolektif.
- source_word: καὶ αὐτοὶ
  choice: kamu sendiri juga
  rationale: Mempertahankan sekaligus unsur penegasan pada αὐτοί dan unsur tambahan pada καί.
- source_word: μεστοί ἐστε ἀγαθωσύνης
  choice: penuh dengan kebaikan
  rationale: Menyampaikan makna kepenuhan serta mutu moral ἀγαθωσύνη secara jelas tanpa mempersempit artinya.
- source_word: πεπληρωμένοι πάσης γνώσεως
  choice: dipenuhi dengan segala pengetahuan
  rationale: Mempertahankan gambaran kepenuhan, keadaan yang berlanjut dari bentuk perfektum, dan cakupan luas πάσης.
- source_word: δυνάμενοι
  choice: sanggup
  rationale: Mengungkapkan kemampuan yang timbul dari kebaikan dan pengetahuan yang baru disebutkan.
- source_word: ἀλλήλους
  choice: saling
  rationale: Padanan timbal balik yang ringkas dan alami dalam bahasa Indonesia.
- source_word: νουθετεῖν
  choice: menasihati
  rationale: Mencakup pemberian arahan yang dapat bersifat korektif; nuansa yang lebih tegas dijaga dalam catatan kaki.
theological_decisions:
- issue: Sapaan bergender ἀδελφοί kepada jemaat campuran
  choice: Saudara-saudaraku
  alternative: saudara-saudaraku, laki-laki dan perempuan
  rationale: Bentuk sapaan sumber dipertahankan secara alami, sedangkan cakupan kolektifnya terhadap seluruh orang percaya dijelaskan tanpa memasukkan perluasan ke dalam teks utama.
- issue: Nuansa νουθετεῖν
  choice: saling menasihati
  alternative: saling memperingatkan; saling memberi pengajaran yang mengoreksi
  rationale: Kata kerja ini dapat mencakup pengajaran, teguran, dan peringatan. 'Menasihati' cocok dengan konteks pujian, sementara nuansa korektifnya tetap dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'Saudara-saudaraku' mempertahankan kehangatan relasional Paulus; susunan kalimat mengikuti penekanan sumber tanpa terdengar kaku.
