id: ROM.15.6
reference: Romans 15:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/006.yaml
  text: so that with one accord and with one mouth you may glorify the God and Father of our Lord Jesus the Messiah[a][b].
translation:
  language: id
  text: supaya dengan sehati dan dengan satu mulut[a] kamu memuliakan Allah dan Bapa Tuhan kita, Yesus Sang Mesias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih idiomatis, “dengan satu suara.” Teks Yunani secara harfiah berbunyi “dengan satu mulut,” yang menekankan kesatuan dalam pujian.
    reason: lexical_alternative
  - marker: b
    text: 'Bentuk tradisional: “Yesus Kristus.” Gelar Yunani Χριστός berarti “Mesias.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Memperkenalkan tujuan atau hasil yang mengalir dari nasihat sebelumnya, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: ὁμοθυμαδόν
  choice: dengan sehati
  rationale: Menyatakan kesatuan hati, pikiran, dan tujuan bersama tanpa meleburkannya dengan gambaran kesatuan ucapan pada frasa berikutnya.
- source_word: ἐν ἑνὶ στόματι
  choice: dengan satu mulut
  rationale: Mempertahankan metafora jasmani yang jelas dalam teks Yunani; alternatif idiomatisnya, 'dengan satu suara,' dicatat dalam catatan kaki.
- source_word: δοξάζητε
  choice: kamu memuliakan
  rationale: Menyampaikan verba kini subjungtif dalam klausa tujuan secara wajar; 'memuliakan' merupakan padanan baku dan berbobot dalam konteks pujian.
- source_word: τὸν θεὸν καὶ πατέρα
  choice: Allah dan Bapa
  rationale: Mempertahankan rumusan Paulus yang menghubungkan kedua sebutan kepada satu pribadi tanpa menambahkan penjelasan teologis yang tidak dinyatakan.
- source_word: τοῦ κυρίου ἡμῶν
  choice: dari Tuhan kita
  rationale: Menerjemahkan relasi genitif secara jelas dan mempertahankan sebutan κύριος sebagai 'Tuhan'.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Nama Ἰησοῦ ditransliterasikan sebagai 'Yesus,' sedangkan gelar Χριστός diterjemahkan menurut maknanya sebagai 'Mesias'; 'Sang' membuat urutan nama-gelar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan sebutan τὸν θεὸν καὶ πατέρα
  choice: Allah dan Bapa dari Tuhan kita
  alternative: Allah, yaitu Bapa dari Tuhan kita
  rationale: Satu artikel Yunani menaungi kedua nomina dan mendukung pemahaman bahwa 'Allah' dan 'Bapa' menunjuk kepada pribadi yang sama. Bentuk koordinatif dipertahankan agar rumusan sumber tidak diubah menjadi parafrasa penjelas.
- issue: Penerjemahan Χριστοῦ dalam rangkaian nama dan gelar Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: Χριστός secara leksikal merupakan gelar 'Mesias.' Menerjemahkan gelar tersebut menjaga kandungan maknanya, sedangkan bentuk tradisional 'Kristus' dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'dengan' sengaja dipertahankan untuk membedakan kesatuan hati (ὁμοθυμαδόν) dari metafora kesatuan ucapan (ἐν ἑνὶ στόματι).
