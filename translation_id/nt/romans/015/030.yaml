id: ROM.15.30
reference: Romans 15:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ διὰ τῆς ἀγάπης τοῦ πνεύματος συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/030.yaml
  text: I urge you[a], brothers, through our Lord Jesus the Messiah and through the love of the Spirit, to strive together with me in prayers to God for me[c][b],
translation:
  language: id
  text: Aku memohon kepada kalian, saudara-saudara[a], demi Tuhan kita Yesus Sang Mesias[b] dan demi kasih Roh[c], agar kalian berjuang bersama denganku dalam doa kepada Allah untukku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “saudara-saudara” berbentuk maskulin secara gramatikal, tetapi dapat menyapa seluruh komunitas orang percaya, termasuk saudara-saudari.
    reason: lexical_alternative
  - marker: b
    text: Atau “Kristus”. Kata Yunani Christos adalah gelar yang berarti “Yang Diurapi” atau “Mesias”.
    reason: alternative_reading
  - marker: c
    text: Ungkapan “kasih Roh” dapat dipahami sebagai kasih Roh sendiri atau kasih yang dihasilkan oleh Roh; bentuk genitif Yunani dapat dimengerti dengan lebih dari satu cara.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Aku mendesak
  rationale: Kata kerja ini menyampaikan permohonan yang sungguh-sungguh dan kuat; “mendesak” wajar dalam bahasa Indonesia modern tanpa mengubahnya menjadi perintah.
- source_word: δὲ
  choice: tidak dinyatakan secara tersendiri
  rationale: Partikel ini menandai peralihan ringan, bukan pertentangan tegas. Dalam bahasa Indonesia, alur peralihan sudah cukup jelas tanpa menambahkan “sekarang” atau “tetapi” yang dapat memberi nuansa berlebihan.
- source_word: ἀδελφοί
  choice: saudara-saudara
  rationale: Sapaan ini alami dan bermartabat dalam bahasa Indonesia serta dapat mencakup seluruh jemaat; bentuk maskulin gramatikal bahasa Yunani dijelaskan dalam catatan kaki.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: demi Tuhan kita Yesus Sang Mesias
  rationale: Dalam seruan ini, διά dengan genitif menunjukkan dasar kuat bagi permohonan. “Demi” lebih alami daripada “melalui” dalam konstruksi bahasa Indonesia, sedangkan Χριστός dipertahankan sebagai gelar “Sang Mesias”.
- source_word: ἀγάπης τοῦ πνεύματος
  choice: kasih dari Roh
  rationale: Ungkapan ini mempertahankan hubungan genitif tanpa menentukan secara mutlak apakah kasih itu milik Roh atau dihasilkan oleh Roh; ambiguitas tersebut dijelaskan dalam catatan kaki.
- source_word: συναγωνίσασθαί μοι
  choice: agar kalian berjuang bersama denganku
  rationale: Pilihan ini mempertahankan unsur usaha yang berat dalam akar ἀγωνίζομαι dan unsur kebersamaan pada awalan συν-.
- source_word: ἐν ταῖς προσευχαῖς
  choice: dalam doa
  rationale: “Dalam doa” merupakan ungkapan Indonesia yang alami dan tidak menambahkan kata ganti milik yang tidak ada dalam teks Yunani.
- source_word: ὑπὲρ ἐμοῦ πρὸς τὸν θεόν
  choice: kepada Allah untukku
  rationale: Terjemahan ini mempertahankan arah doa kepada Allah dan maksud syafaat bagi Paulus dengan susunan yang ringkas dan jelas.
theological_decisions:
- issue: Rujukan τοῦ πνεύματος
  choice: Roh, yakni Roh Kudus
  alternative: roh manusia atau roh dalam arti nonpersonal
  rationale: Pemakaian Paulus dan konteks seruan melalui Tuhan Yesus paling wajar menunjuk kepada Roh Kudus. Huruf kapital menandai rujukan ini tanpa menambahkan kata “Kudus” ke dalam teks utama.
- issue: Hubungan genitif dalam ἀγάπης τοῦ πνεύματος
  choice: kasih dari Roh
  alternative: kasih Roh sendiri; kasih yang dihasilkan Roh; kasih kepada Roh
  rationale: Bentuk Yunani dapat dipahami lebih dari satu cara. Teks utama dan catatan kaki mempertahankan ketegangan itu daripada memilih satu penafsiran secara diam-diam.
- issue: Penerjemahan Χριστοῦ
  choice: Sang Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar bagi Yesus. “Sang Mesias” menyatakan makna gelar itu secara langsung, sementara bentuk tradisional “Kristus” dicatat sebagai alternatif.
- issue: Cakupan ἀδελφοί
  choice: saudara-saudara
  alternative: saudara-saudari
  rationale: Bentuk Yunani bersifat maskulin secara gramatikal, tetapi dalam konteks ini kemungkinan besar menyapa seluruh komunitas orang percaya. Terjemahan utama menggunakan sapaan Indonesia yang lazim dan catatan kaki menjelaskan cakupannya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti “aku/kalian” dipilih karena Paulus berbicara langsung kepada jemaat. Susunan kalimat mempertahankan kesungguhan seruan, pengulangan dasar seruan dengan “demi”, serta gambaran pergumulan bersama dalam doa.
