revisions:
- from: Aku mendesak kalian, saudara-saudara[a], demi Tuhan kita Yesus Sang Mesias[b] dan demi kasih dari Roh[c], agar kalian berjuang bersama denganku dalam doa kepada Allah untukku.
  to: Aku memohon kepada kalian, saudara-saudara[a], demi Tuhan kita Yesus Sang Mesias[b] dan demi kasih Roh[c], agar kalian berjuang bersama denganku dalam doa kepada Allah untukku.
  rationale: The revision preserves the source’s earnest appeal and, most importantly, removes the unnecessary narrowing of the genitive in “kasih dari Roh.” Footnote c is adjusted to explain the ambiguity without presenting the main-text wording as though it already selected one reading. No doctrinal interpretation is added.
