  text: Διὸ καὶ ἐνεκοπτόμην τὰ πολλὰ τοῦ ἐλθεῖν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/022.yaml
  text: Therefore I also was often hindered from coming to you[a].
translation:
  language: id
  text: Karena itu, aku juga berkali-kali terhalang untuk datang kepada kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sering” atau “berulang kali”; ungkapan Yunani τὰ πολλὰ menyatakan pengulangan yang kerap.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan atau akibat dari uraian sebelumnya dan mempertahankan hubungan logis antarayat.
- source_word: καὶ
  choice: juga
  rationale: Mempertahankan daya aditif yang menghubungkan keadaan pribadi Paulus dengan penjelasan sebelumnya.
- source_word: ἐνεκοπτόμην
  choice: aku ... terhalang
  rationale: Bentuk imperfek menyatakan keadaan atau kejadian yang berulang pada masa lampau; bentuk ini tidak menentukan siapa atau apa yang menghalangi.
- source_word: τὰ πολλὰ
  choice: berkali-kali
  rationale: Ungkapan adverbial ini dalam konteks menyatakan pengulangan yang sering; 'berkali-kali' alami dan lebih konkret daripada 'sering'.
- source_word: τοῦ ἐλθεῖν
  choice: untuk datang
  rationale: Infinitif berartikel setelah verba penghalangan menyatakan tindakan yang terhalang; susunan 'terhalang untuk datang' alami dalam bahasa Indonesia.
- source_word: πρὸς ὑμᾶς
  choice: kepada kalian
  rationale: πρός dengan akusatif menunjukkan gerak menuju para penerima surat yang bersifat jamak; 'kalian' membuat kemajemukan itu jelas dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'aku' dan 'kalian' mempertahankan orang pertama tunggal dan orang kedua jamak secara jelas. Penanda catatan kaki dicantumkan dalam teks utama.
