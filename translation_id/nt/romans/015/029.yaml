  text: οἶδα δὲ ὅτι ἐρχόμενος πρὸς ὑμᾶς ἐν πληρώματι ⸀εὐλογίας Χριστοῦ ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/029.yaml
  text: And I know that when I come to you[a], I will come in the fullness of the blessing of Messiah.
translation:
  language: id
  text: Dan aku tahu bahwa ketika aku datang kepada kalian, aku akan datang dalam kepenuhan berkat Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berkat Kristus.”
    reason: Alternatif penerjemahan gelar Χριστός.
lexical_decisions:
- source_word: οἶδα
  choice: aku tahu
  rationale: Menyampaikan pengetahuan dan keyakinan Paulus secara langsung, tanpa melemahkannya menjadi sekadar pendapat.
- source_word: δὲ
  choice: Dan
  rationale: Berfungsi sebagai penghubung ringan yang melanjutkan uraian, bukan sebagai pertentangan tegas.
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: ketika aku datang kepada kalian
  rationale: Partisipel ini paling wajar dipahami secara temporal terhadap verba utama yang berbentuk futur; 'kalian' memperjelas bahwa ὑμᾶς berbentuk jamak.
- source_word: ἐν πληρώματι
  choice: dalam kepenuhan
  rationale: Mempertahankan gambaran kelimpahan atau kelengkapan yang terkandung dalam πλήρωμα dan konstruksi ἐν dengan datif.
- source_word: εὐλογίας
  choice: berkat
  rationale: Genitif ini menerangkan isi atau sifat kepenuhan tersebut; bentuk tanpa artikel terdengar alami dalam bahasa Indonesia.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar kristologis; 'Mesias' menyampaikan makna gelar itu dalam bahasa Indonesia.
- source_word: ἐλεύσομαι
  choice: aku akan datang
  rationale: Menerjemahkan bentuk futur ἔρχομαι secara langsung dan mempertahankan pengulangan verba 'datang' dalam teks Yunani.
theological_decisions:
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Bentuk ini diperlakukan sebagai gelar dan diterjemahkan menurut maknanya. Alternatif tradisional 'Kristus' tetap dicatat tanpa mengubah isi teologis frasa tersebut.
- issue: Hubungan genitif dalam εὐλογίας Χριστοῦ
  choice: berkat Mesias
  alternative: berkat yang berasal dari Mesias
  rationale: Bentuk ringkas 'berkat Mesias' mempertahankan keluwesan genitif Yunani, yang dapat menyatakan sumber, kepunyaan, atau karakter, tanpa memaksakan satu tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti 'kalian' dipakai untuk menandai bentuk jamak ὑμᾶς dengan jelas; struktur kalimat mempertahankan penegasan dan pengulangan teks sumber.
