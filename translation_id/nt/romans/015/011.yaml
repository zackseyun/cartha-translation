source:
  edition: SBLGNT
  text: καὶ πάλιν· Αἰνεῖτε, ⸂πάντα τὰ ἔθνη, τὸν κύριον⸃, καὶ ⸀ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/011.yaml
  text: 'And again: “Praise the Lord[a], all the nations[b], and let all the peoples praise him.”'
translation:
  language: id
  text: 'Dan lagi: “Pujilah Tuhan[a], hai semua bangsa[b], dan hendaklah semua suku bangsa memuji Dia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam sumber Ibrani kutipan ini, “Tuhan” adalah nama ilahi sehingga dapat diterjemahkan “TUHAN”; teks Yunani memakai κύριος, “Tuhan.”
    reason: alternative_reading
  - marker: b
    text: Atau “hai semua orang bukan Yahudi.” Kata Yunani ἔθνη dapat berarti “bangsa-bangsa” atau “orang-orang bukan Yahudi.” Dalam kutipan ini maknanya bersifat universal, sekaligus sesuai dengan pembahasan Paulus tentang orang-orang bukan Yahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Dan selanjutnya
  rationale: Menandai kutipan Kitab Suci berikutnya dalam rangkaian kutipan Paulus; ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa tindakan memuji harus diulangi.
- source_word: Αἰνεῖτε
  choice: Pujilah
  rationale: Bentuk imperatif orang kedua jamak diterjemahkan langsung dengan perintah yang wajar dan bermartabat.
- source_word: πάντα τὰ ἔθνη
  choice: hai semua bangsa
  rationale: ἔθνη dapat berarti bangsa-bangsa atau orang-orang bukan Yahudi. Dalam mazmur yang dikutip, cakupannya universal; sapaan 'hai' memperjelas bahwa semua bangsa menjadi pihak yang diperintah.
- source_word: τὸν κύριον
  choice: Tuhan
  rationale: Menerjemahkan κύριος secara langsung dalam konteks Perjanjian Baru, sementara kaitannya dengan nama ilahi dalam sumber Ibrani dijelaskan dalam catatan kaki.
- source_word: ἐπαινεσάτωσαν
  choice: hendaklah ... memuji
  rationale: Mempertahankan daya imperatif orang ketiga jamak secara alami dalam bahasa Indonesia.
- source_word: αὐτὸν
  choice: Dia
  rationale: Kata ganti ini merujuk kembali kepada Tuhan; huruf kapital mengikuti kebiasaan bahasa Indonesia untuk kata ganti yang mengacu kepada Allah.
- source_word: πάντες οἱ λαοί
  choice: semua suku bangsa
  rationale: Membedakan λαοί dari ἔθνη dan menyampaikan kelompok-kelompok masyarakat secara kolektif tanpa menambahkan 'di bumi' yang tidak terdapat dalam teks Yunani.
theological_decisions:
- issue: Arti ἔθνη dalam konteks bangsa-bangsa bukan Yahudi
  choice: semua bangsa
  alternative: semua orang bukan Yahudi
  rationale: Kutipan ini menyerukan pujian secara universal, sedangkan alternatifnya juga sesuai dengan pembahasan Paulus tentang penerimaan orang bukan Yahudi; ambiguitas itu dipertahankan melalui catatan kaki.
- issue: κύριος dalam kutipan Perjanjian Lama yang merujuk kepada nama ilahi
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani Roma memakai κύριος, sehingga terjemahan utama mengikuti bentuk Yunani. Catatan kaki mempertahankan kemungkinan 'TUHAN' berdasarkan sumber Ibrani kutipan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bercorak liturgis ringan. 'Dan selanjutnya' berfungsi sebagai pengantar kutipan; 'hai' mempertahankan sapaan langsung. Penempatan penanda [a] setelah 'bangsa' dan [b] setelah seluruh kutipan menghubungkan catatan dengan unsur yang tepat.
