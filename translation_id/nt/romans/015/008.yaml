  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγω ⸀γὰρ ⸀Χριστὸν διάκονον ⸀γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/008.yaml
  text: For I say that the Messiah has become a servant to the circumcised for the sake of God's truth[a], in order to confirm the promises to the fathers,
translation:
  language: id
  text: Sebab aku berkata bahwa Mesias telah menjadi pelayan bagi orang-orang bersunat demi kebenaran Allah[a], untuk meneguhkan janji-janji yang diberikan kepada nenek moyang,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “demi kesetiaan Allah,” yang menekankan bahwa Allah setia memenuhi janji-janji perjanjian-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ
  choice: Sebab aku berkata
  rationale: γάρ menjelaskan pernyataan sebelumnya, sehingga “Sebab” mempertahankan hubungan logisnya; λέγω diterjemahkan secara langsung dan wajar sebagai “aku berkata”.
- source_word: Χριστόν
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar dalam pembahasan mengenai Israel, sunat, dan janji kepada nenek moyang; “Mesias” menyampaikan fungsi gelar itu dengan jelas.
- source_word: διάκονον
  choice: pelayan
  rationale: διάκονος di sini menunjuk pada pribadi yang melayani, bukan secara khusus pada jabatan gerejawi diaken.
- source_word: γεγενῆσθαι
  choice: telah menjadi
  rationale: Infinitif perfek γίνομαι menyatakan keadaan kini yang dihasilkan oleh tindakan menjadi; “telah menjadi” mempertahankan aspek tersebut.
- source_word: περιτομῆς
  choice: bagi orang-orang bersunat
  rationale: Genitif ini merujuk pada kelompok orang bersunat, yakni orang Yahudi. “Bagi” secara alami menyatakan pihak yang dilayani tanpa mengubahnya menjadi kepemilikan.
- source_word: ὑπὲρ ἀληθείας θεοῦ
  choice: demi kebenaran Allah
  rationale: ὑπέρ menyatakan kepentingan atau tujuan. ἀλήθεια θεοῦ dapat berarti kebenaran Allah atau sifat Allah yang benar dan setia; pilihan utama mempertahankan keluasan makna, sedangkan catatan kaki menyajikan nuansa alternatif.
- source_word: εἰς τὸ βεβαιῶσαι
  choice: untuk meneguhkan
  rationale: Konstruksi ini menyatakan tujuan, dan βεβαιόω berarti menjadikan teguh atau mengukuhkan janji.
- source_word: τὰς ἐπαγγελίας
  choice: janji-janji
  rationale: Bentuk jamak sumber dipertahankan dan sesuai dengan konteks janji-janji perjanjian Allah.
- source_word: τῶν πατέρων
  choice: yang diberikan kepada nenek moyang
  rationale: Genitif ini paling wajar dipahami sebagai janji-janji yang ditujukan kepada leluhur Israel. Penambahan implisit “yang diberikan” menghasilkan bahasa Indonesia yang jelas tanpa mempersempit rujukannya menjadi hanya para bapa leluhur tertentu.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks sejarah keselamatan yang menyebut orang bersunat dan janji kepada nenek moyang, istilah ini berfungsi jelas sebagai gelar.
- issue: Nuansa ἀλήθεια θεοῦ
  choice: kebenaran Allah
  alternative: kesetiaan Allah / sifat Allah yang benar
  rationale: Frasa Yunani dapat menunjuk pada kebenaran Allah secara luas atau pada kebenaran dan kesetiaan-Nya dalam memenuhi janji. Teks utama mempertahankan keluasan itu, sementara catatan kaki menampilkan nuansa perjanjian yang kuat dalam konteks.
- issue: Relasi διάκονον περιτομῆς
  choice: pelayan bagi orang-orang bersunat
  alternative: pelayan orang-orang bersunat
  rationale: “Bagi” menjelaskan bahwa kelompok bersunat adalah penerima pelayanan Mesias dan menghindari kesan kepemilikan yang dapat timbul dari bentuk “pelayan orang-orang bersunat”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Orang-orang bersunat” dipakai agar rujukan kelompoknya transparan; “nenek moyang” lebih alami bagi pembaca umum daripada “para bapa,” sambil tetap menunjuk pada leluhur Israel.
