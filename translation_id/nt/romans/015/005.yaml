  text: ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ ⸂Χριστὸν Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/005.yaml
  text: May the God of endurance and encouragement grant you to think the same way toward one another[a], in accordance with Messiah Jesus[b],
translation:
  language: id
  text: Semoga Allah, sumber ketekunan dan penghiburan, mengaruniakan kepada kalian sikap yang sama dalam hubungan satu sama lain[a], sesuai dengan Mesias Yesus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau «agar kalian sepikiran» atau «agar kalian berpikir dengan cara yang sama».
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: «menurut Mesias Yesus».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεὸς
  choice: Semoga Allah
  rationale: δέ berfungsi sebagai penghubung ringan dalam konteks, sedangkan optatif δῴη membentuk doa atau harapan. Dalam bahasa Indonesia, «Semoga Allah ... mengaruniakan» menyampaikan daya ini secara alami tanpa menambahkan penanda waktu.
- source_word: τῆς ὑπομονῆς
  choice: sumber ketekunan
  rationale: ὑπομονή menunjuk pada ketabahan atau ketekunan dalam menghadapi tekanan. Genitif ini dapat menggambarkan Allah sebagai sumber kualitas tersebut; ungkapan eksplisit «sumber ketekunan» lebih wajar daripada bentuk harfiah «Allah ketekunan».
- source_word: τῆς παρακλήσεως
  choice: dan penghiburan
  rationale: παράκλησις dapat berarti penghiburan, dorongan, atau nasihat. «Penghiburan» mempertahankan hubungan leksikal dengan ayat 4 dan mencakup penguatan yang diberikan Allah, tanpa menutup kemungkinan nuansa dorongan.
- source_word: δῴη
  choice: mengaruniakan
  rationale: Optatif aoris δίδωμι dipakai dalam rumusan doa-harapan. «Mengaruniakan» sesuai dengan register doa yang bermartabat dan tetap menyatakan tindakan memberi.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: memiliki sikap hati yang sama
  rationale: φρονέω mencakup cara berpikir, orientasi batin, atau sikap, bukan hanya kegiatan intelektual. «Sikap hati» merupakan ungkapan Indonesia yang alami dan tidak mengharuskan keseragaman pendapat dalam segala hal.
- source_word: ἐν ἀλλήλοις
  choice: terhadap satu sama lain
  rationale: Frasa ini menyatakan lingkup relasional atau orientasi timbal balik. «Terhadap satu sama lain» alami dalam bahasa Indonesia dan cocok dengan seruan untuk keselarasan komunitas.
- source_word: κατὰ Χριστὸν Ἰησοῦν
  choice: sesuai dengan Mesias Yesus
  rationale: κατά menyatakan kesesuaian dengan suatu patokan. Χριστός dipertahankan sebagai gelar bermakna melalui «Mesias», bukan diperlakukan sekadar sebagai bagian nama.
theological_decisions:
- issue: Makna τὸ αὐτὸ φρονεῖν
  choice: memiliki sikap hati yang sama
  alternative: sepikiran; berpikir dengan cara yang sama
  rationale: Terjemahan ini menyampaikan keselarasan orientasi di antara orang percaya tanpa menafsirkan frasa itu sebagai tuntutan keseragaman pendapat mutlak.
- issue: Penerjemahan Χριστός
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Χριστός adalah gelar yang berarti «Yang Diurapi» atau «Mesias». «Mesias Yesus» mempertahankan kandungan gelarnya dalam frasa ini.
- issue: Hubungan genitif pada θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως
  choice: Allah, sumber ketekunan dan penghiburan
  alternative: Allah ketekunan dan penghiburan
  rationale: Genitif dapat menyatakan Allah sebagai asal atau pemberi ketekunan dan penghiburan. Penambahan «sumber» membuat relasi itu jelas dan idiomatis tanpa mengubah pokok teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk «kalian» dipakai untuk memperjelas bahwa ὑμῖν berbentuk jamak. Koma akhir dipertahankan karena ayat ini berlanjut secara sintaktis ke ayat 6.
