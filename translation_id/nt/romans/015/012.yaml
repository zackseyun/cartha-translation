  text: καὶ πάλιν Ἠσαΐας λέγει· Ἔσται ἡ ῥίζα τοῦ Ἰεσσαί, καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν· ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/012.yaml
  text: And again Isaiah says, “The root of Jesse will be, and the one who rises to rule the Gentiles; in him the Gentiles will hope.”
translation:
  language: id
  text: Dan selanjutnya Yesaya berkata, “Akar Isai akan ada, dan orang yang bangkit untuk memerintah bangsa-bangsa; kepada dia bangsa-bangsa akan menaruh harapan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ῥίζα τοῦ Ἰεσσαί
  choice: tunas dari Isai
  rationale: Secara harfiah berarti ‘akar Isai’, tetapi dalam pemakaian nubuat ini menunjuk kepada keturunan yang muncul dari garis Isai. ‘Tunas dari Isai’ lebih alami dan mudah dipahami dalam bahasa Indonesia sambil mempertahankan citra tumbuhan dan hubungan keturunan.
- source_word: ὁ ἀνιστάμενος
  choice: Dia yang bangkit
  rationale: Mempertahankan gambaran seseorang yang bangkit atau tampil untuk menjalankan pemerintahan, tanpa mempersempitnya secara khusus menjadi kebangkitan dari kematian.
- source_word: ἔθνη
  choice: bangsa-bangsa
  rationale: Dalam kedua kemunculannya, istilah ini merujuk kepada bangsa-bangsa non-Yahudi dalam cakupan kolektif; ‘bangsa-bangsa’ menjaga cakupan itu tanpa istilah gerejawi yang kurang umum.
- source_word: ἐπ’ αὐτῷ ... ἐλπιοῦσιν
  choice: kepada-Nya ... akan menaruh harapan
  rationale: Ungkapan ini menyatakan bahwa pribadi tersebut menjadi sasaran atau dasar pengharapan. Susunan Indonesia ini alami dan tetap dekat dengan makna Yunani.
theological_decisions:
- issue: Hubungan antara ‘tunas dari Isai’ dan ‘Dia yang bangkit’
  choice: Menggunakan ‘yaitu’ untuk menunjukkan bahwa keduanya merujuk kepada pribadi yang sama.
  alternative: 'Mempertahankan ‘dan’ secara harfiah: ‘Akan ada tunas dari Isai, dan Dia yang bangkit ...’'
  rationale: Bentuk Yunani memakai καί, tetapi frasa kedua menerangkan tokoh yang sama. ‘Yaitu’ mencegah pembaca Indonesia salah memahami adanya dua tokoh, tanpa menambahkan identitas teologis yang tidak dinyatakan eksplisit dalam ayat.
- issue: Makna ἀνιστάμενος
  choice: Tidak menerjemahkannya secara eksplisit sebagai ‘bangkit dari kematian’.
  alternative: ‘Dia yang dibangkitkan untuk memerintah’
  rationale: Konteks dan bentuk katanya dapat berarti muncul atau bangkit untuk memerintah. Terjemahan tidak boleh diam-diam membatasi ungkapan ini pada kebangkitan jasmani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi ‘Dia’ dan ‘-Nya’ dipakai karena kutipan ini dalam konteks Roma merujuk kepada Kristus. Tidak ada penanda catatan kaki karena tidak ada catatan kaki dalam draf.
