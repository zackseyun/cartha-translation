  verdict: revise
  source_fidelity: Draf mengubah ῥίζα ('akar') menjadi 'tunas'. Kedua citra tumbuhan dapat berhubungan dalam konteks Yesaya, tetapi teks Yunani secara eksplisit menyebut 'akar Isai'; penggantian itu mengurangi kesetiaan pada citra sumber. Selain itu, kapitalisasi 'Dia/-Nya' menambahkan penandaan interpretatif yang tidak ditandai dalam kutipan Yunani.
  naturalness: Susunan revisi tetap baku dan alami dalam bahasa Indonesia modern. 'Akar Isai akan ada' mempertahankan urutan dan citra sumber tanpa menjadi tidak lazim.
  terminology: Isai, 'bangsa-bangsa', dan 'menaruh harapan' tepat. 'Orang yang bangkit untuk memerintah' mempertahankan ambiguitas ὁ ἀνιστάμενος tanpa memaksakannya menjadi kebangkitan dari kematian.
  issues:
  - severity: medium
    issue: ῥίζα diterjemahkan 'tunas'.
    rationale: ῥίζα berarti 'akar', bukan 'tunas'. Walaupun 'tunas' dapat terasa lebih mudah dalam metafora keturunan, revisi ini tidak diperlukan dan mengganti gambaran yang dipakai sumber.
  - severity: low
    issue: Kapitalisasi 'Dia' dan '-Nya' bersifat interpretatif.
    rationale: Teks kutipan tidak memakai penandaan kapital untuk mengidentifikasi tokoh tersebut. Huruf kecil mempertahankan bentuk kutipan dan menghindari penambahan penafsiran pada tingkat ejaan.
  - severity: low
    issue: '''yaitu'' menggantikan penghubung καί.'
    rationale: Kedua frasa memang paling mungkin merujuk kepada tokoh yang sama, tetapi 'dan' lebih dekat dengan struktur sumber dan tidak kurang jelas dalam bahasa Indonesia.
  revised_text: Dan selanjutnya Yesaya berkata, “Akar Isai akan ada, dan orang yang bangkit untuk memerintah bangsa-bangsa; kepada dia bangsa-bangsa akan menaruh harapan.”
