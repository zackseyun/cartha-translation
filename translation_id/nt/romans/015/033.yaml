id: ROM.15.33
reference: Romans 15:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης μετὰ πάντων ὑμῶν· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/033.yaml
  text: May the God of peace be with all of you. Amen.
translation:
  language: id
  text: Semoga Allah, sumber damai sejahtera, menyertai kamu semua. Amin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: tidak dinyatakan secara tersendiri
  rationale: δέ di sini berfungsi sebagai penghubung atau peralihan ringan menuju berkat penutup, bukan pertentangan yang kuat. Dalam bahasa Indonesia, alur tersebut sudah wajar tanpa menambahkan kata seperti “sekarang” atau “tetapi”.
- source_word: θεὸς τῆς εἰρήνης
  choice: Allah, sumber damai sejahtera
  rationale: Ungkapan genitif ini menyatakan hubungan khas Allah dengan damai sejahtera. Bentuk idiomatis ini alami dalam bahasa Indonesia dan tidak membatasi maknanya hanya pada ketiadaan konflik.
- source_word: εἰρήνης
  choice: damai sejahtera
  rationale: Padanan ini lazim dan mencakup kedamaian, keutuhan, serta kesejahteraan yang terkandung dalam εἰρήνη.
- source_word: μετὰ πάντων ὑμῶν
  choice: menyertai kamu semua
  rationale: Kata kerja tidak dinyatakan dalam bahasa Yunani, tetapi perlu dilengkapi dalam bahasa Indonesia. “Kamu semua” mempertahankan cakupan πάντων ὑμῶν.
- source_word: ἀμήν
  choice: Amin
  rationale: Bentuk liturgis yang sudah baku dalam bahasa Indonesia dan mempertahankan daya penutup yang khidmat.
theological_decisions:
- issue: Apakah klausa tanpa kata kerja diterjemahkan sebagai pernyataan atau harapan berkat
  choice: Diterjemahkan sebagai harapan berkat dengan “Semoga ... menyertai”.
  alternative: “Allah, sumber damai sejahtera, menyertai kamu semua.”
  rationale: Dalam rumusan penutup surat, konstruksi tanpa kata kerja ini secara alami berfungsi sebagai doa atau berkat. “Semoga” menyampaikan fungsi itu tanpa mengubahnya menjadi pernyataan indikatif.
- issue: Hubungan Allah dengan εἰρήνη dalam gelar θεὸς τῆς εἰρήνης
  choice: “Allah, sumber damai sejahtera”
  alternative: “Allah damai sejahtera” atau “Allah yang memberi damai sejahtera”
  rationale: “Sumber” menyampaikan secara idiomatis bahwa damai sejahtera berasal dari dan menjadi ciri karya Allah, tanpa mempersempit ungkapan menjadi hanya tindakan memberi.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Bentuk “kamu semua” menjaga sapaan jamak secara jelas. Tidak diperlukan catatan kaki.
