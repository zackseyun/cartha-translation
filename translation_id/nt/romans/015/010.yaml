  text: καὶ πάλιν λέγει· Εὐφράνθητε, ἔθνη, μετὰ τοῦ λαοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/010.yaml
  text: And again he says[a], “Rejoice, Gentiles, with his people.”
translation:
  language: id
  text: Dan sekali lagi ia berkata, “Bersukacitalah, hai bangsa-bangsa bukan Yahudi, bersama umat-Nya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bersukacitalah, hai bangsa-bangsa, bersama umat-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: selanjutnya
  rationale: Dalam formula kutipan ini, πάλιν memperkenalkan kutipan Kitab Suci berikutnya. “Selanjutnya” terdengar alami dalam bahasa Indonesia dan tidak menyiratkan bahwa pembaca harus mengulangi tindakan bersukacita.
- source_word: λέγει
  choice: ia berkata
  rationale: Bentuk kini Yunani berfungsi sebagai formula kutipan yang menampilkan Kitab Suci sebagai tetap berbicara. Bahasa Indonesia lazim memakai “berkata” dalam pengantar kutipan semacam ini; “ia” mempertahankan subjek tersirat tanpa menentukan lebih jauh siapa yang berbicara.
- source_word: Εὐφράνθητε
  choice: Bersukacitalah
  rationale: Imperatif ini secara idiomatis berarti bersukacita atau bergembira. “Bersukacitalah” mempertahankan daya perintah dan ragam bahasa yang luhur tetapi tetap umum dipahami.
- source_word: ἔθνη
  choice: bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks Roma 15, istilah ini menunjuk kepada bangsa-bangsa di luar umat Yahudi dan menonjolkan kesatuan mereka dengan umat Allah. Ungkapan ini lebih jelas bagi pembaca Indonesia daripada serapan “bangsa-bangsa lain”; arti yang lebih umum, “bangsa-bangsa,” dicatat dalam catatan kaki.
- source_word: μετὰ τοῦ λαοῦ αὐτοῦ
  choice: bersama umat-Nya
  rationale: μετά dengan genitif menyatakan kebersamaan. “Umat-Nya” menyampaikan nuansa λαός sebagai umat milik Allah tanpa menambahkan secara eksplisit “Israel,” yang tidak tertulis dalam teks Yunani.
theological_decisions:
- issue: Makna ἔθνη dalam kutipan mengenai kesatuan Yahudi dan bukan Yahudi
  choice: bangsa-bangsa bukan Yahudi
  alternative: bangsa-bangsa
  rationale: Konteks langsung Roma 15 menekankan bahwa orang-orang bukan Yahudi turut memuji Allah bersama umat-Nya. Pilihan utama membuat maksud argumentasi Paulus jelas, sementara kemungkinan arti yang lebih luas tetap dipertahankan dalam catatan kaki.
- issue: Identitas τοῦ λαοῦ αὐτοῦ
  choice: umat-Nya
  alternative: umat-Nya, yaitu Israel
  rationale: Teks Yunani hanya mengatakan “umat-Nya.” Walaupun dalam sumber Perjanjian Lama ungkapan itu merujuk kepada Israel, menambahkan nama Israel dalam teks utama akan menutup implikasi secara lebih eksplisit daripada bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “hai” menandai vokatif Yunani secara alami dalam kutipan puitis. Huruf kapital pada “-Nya” mengikuti kebiasaan ejaan religius Indonesia untuk rujukan kepada Allah.
