source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν· ἀλλὰ καθὼς γέγραπται· Οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/003.yaml
  text: For even the Messiah did not please himself[a], but as it is written, “The reproaches of those who reproached you fell on me.”
translation:
  language: id
  text: Sebab Sang Mesias pun tidak menyenangkan diri-Nya sendiri[a], tetapi sebagaimana tertulis, “Celaan orang-orang yang mencela Engkau menimpa aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus”.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sebab, bahkan
  rationale: Gabungan ini menghubungkan ayat dengan nasihat sebelumnya secara inferensial sekaligus menekankan Sang Mesias sebagai teladan.
- source_word: ὁ Χριστός
  choice: Sang Mesias
  rationale: Kata sandang dan fungsi gelar dalam konteks ini mendukung terjemahan sebagai gelar, bukan sebutan yang sudah menyerupai nama diri.
- source_word: οὐχ ἑαυτῷ ἤρεσεν
  choice: tidak menyenangkan diri-Nya sendiri
  rationale: Terjemahan dekat ini mempertahankan gagasan verba 'menyenangkan' dan kata ganti refleksif tanpa menambahkan penafsiran tentang tindakan tertentu.
- source_word: ἀλλὰ καθὼς γέγραπται
  choice: tetapi seperti ada tertulis
  rationale: Ungkapan ini merupakan rumus pengutipan Kitab Suci; bentuk Indonesia ini alami, bermartabat, dan mempertahankan hasil yang tetap berlaku dari bentuk perfek Yunani.
- source_word: ὀνειδισμοί
  choice: celaan
  rationale: '''Celaan'' menyampaikan penghinaan verbal dan aib dengan register yang wajar dalam kutipan Kitab Suci.'
- source_word: τῶν ὀνειδιζόντων σε
  choice: orang-orang yang mencela Engkau
  rationale: Konstruksi partisipial dibuat alami dalam bahasa Indonesia sambil mempertahankan pengulangan akar makna antara nomina dan verba.
- source_word: ἐπέπεσαν ἐπ’ ἐμέ
  choice: telah menimpa aku
  rationale: '''Menimpa'' merupakan padanan idiomatis yang dekat untuk gambaran sesuatu yang jatuh atau datang atas seseorang; ''telah'' sesuai dengan perspektif kutipan tanpa mengubah identitas penutur.'
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam ayat ini Χριστός berfungsi sebagai gelar bagi tokoh yang menjadi teladan bagi orang percaya. Kata sandang Yunani turut mendukung nuansa gelar.
- issue: Identitas suara dalam kutipan Kitab Suci
  choice: Kutipan diterjemahkan apa adanya tanpa menjelaskan identitas 'aku'.
  alternative: Menambahkan bahwa 'aku' adalah Sang Mesias/Kristus.
  rationale: Paulus menerapkan Mazmur 69:9 kepada Sang Mesias, tetapi teks kutipan sendiri tidak menyebut identitas penuturnya secara eksplisit; ambiguitas itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada bermartabat. Kapitalisasi pada pronomina yang merujuk kepada Sang Mesias mengikuti kelaziman religius Indonesia, sedangkan 'aku' dan 'Engkau' dalam kutipan dipertahankan sesuai sudut pandang teks tanpa menambahkan identifikasi penutur.
