  text: οὕτως δὲ ⸀φιλοτιμούμενον εὐαγγελίζεσθαι οὐχ ὅπου ὠνομάσθη Χριστός, ἵνα μὴ ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/020.yaml
  text: And in this way I make it my ambition to proclaim the good news[a], not where Messiah has already been named[b], so that I might not build on another's foundation.
translation:
  language: id
  text: Dengan demikian, aku berambisi untuk memberitakan kabar baik bukan di tempat yang nama Mesias[a] sudah disebut, supaya aku tidak membangun di atas fondasi orang lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Kristus.'
    reason: Χριστός dapat dialihaksarakan sebagai "Kristus"; di sini "Mesias" dipakai untuk menampilkan fungsinya sebagai gelar.
lexical_decisions:
- source_word: οὕτως δὲ
  choice: Dengan demikian
  rationale: Menghubungkan pernyataan ini dengan uraian Paulus sebelumnya mengenai pelayanannya; δέ berfungsi sebagai penghubung ringan dan tidak perlu diterjemahkan sebagai pertentangan yang kuat.
- source_word: φιλοτιμούμενον
  choice: aku bertekad
  rationale: Partisip ini menyatakan cita-cita atau ambisi yang diupayakan dengan sungguh-sungguh. 'Aku bertekad' alami dalam bahasa Indonesia dan mempertahankan unsur kehendak pribadi Paulus.
- source_word: εὐαγγελίζεσθαι
  choice: memberitakan kabar baik
  rationale: Menyampaikan tindakan mengumumkan kabar baik secara jelas tanpa bergantung pada istilah gerejawi yang mungkin kurang transparan bagi pembaca umum.
- source_word: οὐχ ὅπου ὠνομάσθη Χριστός
  choice: bukan di tempat nama Mesias sudah disebut
  rationale: Mempertahankan gambaran harfiah tentang Mesias yang 'dinamai/disebut' dan keadaan yang telah ada sebelumnya, tanpa mempersempit maknanya menjadi sekadar 'dikenal' atau memperluasnya menjadi 'sudah diberitakan'.
- source_word: ἵνα μὴ
  choice: supaya aku tidak
  rationale: Mengungkapkan maksud negatif secara wajar dan jelas dalam bahasa Indonesia.
- source_word: ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ
  choice: aku tidak membangun di atas dasar orang lain
  rationale: Mempertahankan metafora pembangunan dan arti ἀλλότριος sebagai sesuatu yang menjadi milik atau berkaitan dengan orang lain, tanpa menambahkan kata 'yang diletakkan' yang tidak tersurat.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks ini Χριστός berfungsi sebagai gelar bagi pribadi yang diberitakan, sehingga 'Mesias' menampilkan nilai gelarnya. Alternatif tradisional dicatat agar pembaca mengetahui padanannya.
- issue: Cakupan prinsip pelayanan Paulus
  choice: Pernyataan ini disajikan sebagai tekad pelayanan pribadi Paulus
  alternative: Larangan universal untuk melayani di tempat yang sudah mengenal Mesias
  rationale: Bentuk orang pertama dan kata yang menyatakan ambisi dipertahankan, sehingga terjemahan tidak mengubah strategi panggilan Paulus menjadi perintah mutlak bagi semua pelayan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'aku' mengikuti suara pribadi Paulus. Susunan 'nama Mesias sudah disebut' sengaja mempertahankan ungkapan sumber yang lebih konkret dan tidak menggantinya dengan tafsiran seperti 'sudah dikenal'.
