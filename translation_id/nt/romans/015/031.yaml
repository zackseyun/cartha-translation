id: ROM.15.31
reference: Romans 15:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα ῥυσθῶ ἀπὸ τῶν ἀπειθούντων ἐν τῇ Ἰουδαίᾳ ⸀καὶ ἡ διακονία μου ἡ εἰς Ἰερουσαλὴμ εὐπρόσδεκτος ⸂τοῖς ἁγίοις γένηται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/031.yaml
  text: so that I may be rescued from those who are disobedient in Judea[a], and that my service for Jerusalem may become acceptable to the saints,
translation:
  language: id
  text: supaya aku dilepaskan dari orang-orang yang tidak taat di Yudea[a], dan supaya pelayananku bagi Yerusalem diterima dengan baik oleh orang-orang kudus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari orang-orang yang tidak percaya di Yudea.” Kata Yunani yang dipakai dapat berarti menolak untuk percaya dan karena itu tidak taat.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: supaya ... dan supaya
  rationale: Memperkenalkan dua tujuan permohonan doa yang dikoordinasikan di bawah satu ἵνα; pengulangan 'supaya' membuat hubungan tersebut jelas dan alami dalam bahasa Indonesia.
- source_word: ῥυσθῶ
  choice: aku dilepaskan
  rationale: Bentuk pasif subjungtif dari ῥύομαι menyatakan harapan agar Paulus dibebaskan atau diselamatkan dari bahaya; 'dilepaskan' mempertahankan arti pembebasan tanpa mempersempit bentuk bahayanya.
- source_word: ἀπὸ τῶν ἀπειθούντων
  choice: dari orang-orang yang tidak taat
  rationale: ἀπειθέω dapat menunjuk pada ketidaktaatan sekaligus penolakan untuk percaya. Pilihan ini mempertahankan keluasan makna leksikal; kemungkinan arti 'tidak percaya' dicatat dalam catatan kaki.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: di Yudea
  rationale: Bentuk geografis baku dalam bahasa Indonesia.
- source_word: διακονία
  choice: pelayananku
  rationale: Dalam konteks ini kata tersebut mencakup tindakan pelayanan Paulus, khususnya membawa bantuan bagi jemaat Yerusalem. 'Pelayanan' tetap luas dan tidak menggantinya dengan tafsiran yang lebih sempit seperti 'bantuan' atau 'persembahan'.
- source_word: ἡ εἰς Ἰερουσαλήμ
  choice: bagi Yerusalem
  rationale: Menunjukkan arah atau sasaran pelayanan. 'Bagi Yerusalem' alami dalam bahasa Indonesia dan tetap mempertahankan sasaran pelayanan tersebut tanpa menjadikannya sekadar keterangan perjalanan.
- source_word: εὐπρόσδεκτος
  choice: diterima dengan baik
  rationale: Mengungkapkan arti diterima secara positif atau berkenan dan lebih alami daripada konstruksi 'menjadi dapat diterima'.
- source_word: τοῖς ἁγίοις
  choice: oleh orang-orang kudus
  rationale: Mempertahankan sebutan khas Paulus bagi umat percaya serta bentuk penerima dalam konstruksi pasif bahasa Indonesia.
- source_word: γένηται
  choice: diterima
  rationale: Dalam gabungan dengan εὐπρόσδεκτος, bahasa Indonesia secara alami mengungkapkan hasil yang diharapkan dengan 'diterima dengan baik'; nuansa 'menjadi' tersirat dalam terjadinya penerimaan itu.
theological_decisions:
- issue: Makna ἀπειθούντων bagi para penentang Paulus di Yudea
  choice: orang-orang yang tidak taat
  alternative: orang-orang yang tidak percaya
  rationale: Partisip Yunani itu dapat menyatakan penolakan untuk percaya yang tampak sebagai ketidaktaatan. Teks utama mempertahankan arti yang lebih luas, sedangkan arti kontekstual 'tidak percaya' disediakan dalam catatan kaki agar ketegangan semantisnya tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa terdengar kelembagaan secara berlebihan. Struktur ganda 'supaya ... dan supaya' mempertahankan kedua tujuan doa Paulus. Istilah 'orang-orang kudus' mempertahankan ungkapan khas Paulus, sedangkan 'diterima dengan baik' menghasilkan bahasa yang alami.
