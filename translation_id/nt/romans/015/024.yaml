source:
  edition: SBLGNT
  text: ὡς ⸀ἂν πορεύωμαι εἰς τὴν ⸀Σπανίαν, ἐλπίζω γὰρ διαπορευόμενος θεάσασθαι ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/024.yaml
  text: whenever I go to Spain—for I hope[a], as I pass through, to see you and to be sent on my way there by you[c][b], if first I may be satisfied in part with your company—
translation:
  language: id
  text: apabila saya pergi ke Spanyol—sebab saya berharap, dalam perjalanan, dapat bertemu dengan kalian dan oleh kalian dibantu untuk melanjutkan perjalanan ke sana, jika saya terlebih dahulu dapat merasa puas sebagian dalam kebersamaan dengan kalian[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jika saya terlebih dahulu dipenuhi sebagian oleh kalian.” Ungkapan Yunaninya dapat menunjuk pada kepuasan dalam kebersamaan dengan mereka, sementara “sebagian” dapat menyatakan pembatasan yang tidak diperinci lebih lanjut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἂν πορεύωμαι
  choice: ketika saya pergi
  rationale: Konstruksi ὡς ἄν dengan subjungtif menunjuk pada waktu mendatang yang belum pasti. Dalam bahasa Indonesia, “ketika saya pergi” terdengar alami dan tetap sesuai dengan konteks rencana perjalanan yang belum terlaksana.
- source_word: Σπανίαν
  choice: Spanyol
  rationale: Bentuk baku nama geografis tersebut dalam bahasa Indonesia.
- source_word: ἐλπίζω γὰρ
  choice: sebab ... saya berharap
  rationale: “Sebab” mempertahankan fungsi penjelas γάρ, sedangkan “berharap” menyampaikan harapan sekaligus pengharapan yang terkandung dalam ἐλπίζω.
- source_word: διαπορευόμενος
  choice: dalam perjalanan itu
  rationale: Partisip ini menggambarkan kunjungan ke Roma sebagai bagian dari perjalanan menuju tujuan lain. Ungkapan ini alami dalam bahasa Indonesia tanpa menyiratkan bahwa Paulus hanya melintas tanpa singgah.
- source_word: θεάσασθαι ὑμᾶς
  choice: bertemu dengan kalian
  rationale: Dalam konteks rencana kunjungan, θεάομαι menunjuk pada perjumpaan langsung. “Bertemu dengan” lebih alami daripada terjemahan harfiah “melihat” dan tidak melebihkan maknanya.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ
  choice: dibantu oleh kalian untuk meneruskan perjalanan ke sana
  rationale: προπέμπω dalam konteks perjalanan dapat mencakup mengantar atau memberi bantuan praktis untuk perjalanan berikutnya. Pilihan ini mempertahankan keluasan makna tanpa menentukan bentuk bantuannya.
- source_word: ἐὰν ... ἐμπλησθῶ
  choice: setelah ... saya menikmati kebersamaan
  rationale: Walaupun ἐάν secara formal bersifat kondisional, di sini ungkapan itu menyatakan prasyarat dalam rencana Paulus. ἐμπλησθῶ memakai gambaran menjadi penuh atau puas; “menikmati kebersamaan” menyampaikan maksud relasionalnya secara alami.
- source_word: ὑμῶν πρῶτον
  choice: terlebih dahulu ... dengan kalian
  rationale: 'πρῶτον menyatakan urutan waktu: Paulus ingin lebih dahulu bersama jemaat Roma sebelum mereka membantunya melanjutkan perjalanan.'
- source_word: ἀπὸ μέρους
  choice: meskipun hanya sebagian
  rationale: Ungkapan ini secara harfiah berarti “sebagian” dan membatasi kepuasan atau kebersamaan yang diharapkan. Terjemahan ini mempertahankan ketidakjelasan apakah batas tersebut terutama menyangkut waktu atau tingkat kepuasan.
theological_decisions:
- issue: Bentuk dukungan jemaat Roma bagi perjalanan Paulus
  choice: dibantu oleh kalian untuk meneruskan perjalanan ke sana
  alternative: diantar oleh kalian ke sana
  rationale: Kata προπέμπω dapat meliputi pengantaran, pembekalan, atau bantuan praktis lainnya. Terjemahan tidak menentukan bahwa dukungan itu khusus berupa uang, pengutusan resmi, atau pendampingan fisik.
- issue: Makna kepuasan Paulus dalam kebersamaan dengan jemaat Roma
  choice: menikmati kebersamaan dengan kalian, meskipun hanya sebagian
  alternative: dipuaskan sebagian oleh kalian
  rationale: Konteks mendukung makna relasional, tetapi ἀπὸ μέρους tetap membatasi gagasan “dipenuhi” tanpa menjelaskan secara tepat apakah yang dimaksud adalah durasi singkat atau kepuasan yang tidak lengkap. Pilihan utama alami dalam bahasa Indonesia, sementara catatan kaki menjaga metafora sumber dan ambiguitasnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “saya” dan “kalian” dipakai agar hubungan penutur dan penerima jelas serta mudah dipahami. Tanda pisah mempertahankan struktur kalimat yang berlanjut ke ayat berikutnya.
