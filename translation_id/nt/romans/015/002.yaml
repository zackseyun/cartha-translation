  yaml_path: translation/nt/romans/015/002.yaml
  text: Let each of us please his neighbor for his good[b][a], for building him up.
translation:
  language: id
  text: Hendaklah masing-masing dari kita menyenangkan sesama demi kebaikannya[a], untuk membangunnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “demi apa yang baik” atau “menuju kebaikan”. Ungkapan Yunani menekankan apa yang bermanfaat, bukan sekadar memenuhi keinginan orang lain.
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk penguatan”. Kata Yunani secara harfiah berarti “pembangunan” dan di sini dipakai sebagai metafora untuk menguatkan seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος ἡμῶν
  choice: setiap orang di antara kita
  rationale: Menyampaikan bentuk tunggal distributif dengan genitif partitif secara alami serta mempertahankan seruan kepada tiap anggota komunitas.
- source_word: τῷ πλησίον
  choice: sesamanya
  rationale: Dalam konteks etis, πλησίον menunjuk kepada orang lain yang dekat dalam relasi komunitas; 'sesamanya' alami, inklusif, dan tidak membatasi rujukan pada tetangga tempat tinggal.
- source_word: ἀρεσκέτω
  choice: hendaklah ... menyenangkan
  rationale: Mempertahankan daya imperatif orang ketiga tanpa menjadikannya sekadar saran; tujuan yang mengikutinya membatasi makna 'menyenangkan' agar tidak berarti mencari muka.
- source_word: εἰς τὸ ἀγαθὸν
  choice: demi kebaikannya
  rationale: Mengungkapkan arah atau manfaat bagi sesama. Pronomina tersirat dibuat eksplisit secara wajar dari τῷ πλησίον, sementara catatan kaki mempertahankan kemungkinan ungkapan yang lebih umum.
- source_word: πρὸς οἰκοδομήν
  choice: untuk membangun dia
  rationale: Mempertahankan metafora οἰκοδομή dalam bahasa Indonesia yang mudah dipahami; objek 'dia' dipasok dari 'sesamanya' sesuai konteks.
theological_decisions:
- issue: Batas etis perintah untuk menyenangkan sesama
  choice: Perintah ini dibatasi oleh kebaikan dan pembangunan sesama, bukan tuntutan untuk menyenangkan orang lain tanpa syarat.
  alternative: Membacanya sebagai anjuran umum untuk selalu menyesuaikan diri dengan keinginan orang lain.
  rationale: Dua frasa tujuan dalam bahasa Yunani menegaskan bahwa tindakan menyenangkan itu diarahkan kepada apa yang baik dan membangun; terjemahan mempertahankan keduanya tanpa menambahkan batasan doktrinal lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang bermartabat. 'Sesamanya' menghindari kesan bahwa perintah hanya berlaku bagi tetangga secara geografis. Metafora 'membangun' dipertahankan dan dijelaskan melalui catatan kaki.
