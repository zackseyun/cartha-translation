  text: ἀλλὰ καθὼς γέγραπται· ⸂Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ ὄψονται⸃, καὶ οἳ οὐκ ἀκηκόασιν συνήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/021.yaml
  text: 'but as it is written: Those who were not told about him will see[b][a], and those who have not heard will understand.'
translation:
  language: id
  text: Namun, seperti yang tertulis, “Mereka yang tidak diberi tahu tentang dia akan melihat,[a][b] dan mereka yang belum pernah mendengar akan mengerti.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulus mengutip Yesaya 52:15. Dalam konteks Yesaya, kata “dia” merujuk kepada sosok hamba, dan di sini Paulus menerapkan kutipan itu pada pemberitaan Injil Paulus.
    reason: cross_reference
  - marker: b
    text: 'Atau: “Orang-orang yang kepadanya tidak diberitakan apa pun tentang dia akan melihat ... dan orang-orang yang belum mendengar akan mengerti.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan dengan uraian sebelumnya tentang sasaran pelayanan Paulus dan terdengar alami dalam bahasa Indonesia baku.
- source_word: καθὼς γέγραπται
  choice: seperti yang tertulis
  rationale: 'Rumus pengutipan Kitab Suci yang alami; bentuk perfek pasif Yunani secara idiomatis menyatakan keadaan tetap: apa yang telah ditulis tetap tertulis.'
- source_word: Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ
  choice: Mereka yang belum pernah diberi tahu tentang dia
  rationale: Mengalihkan pronomina relatif datif ke susunan Indonesia yang wajar. Pasif ἀνηγγέλη dipertahankan, sedangkan 'belum pernah' menyampaikan bahwa kelompok ini belum menerima pemberitaan tersebut.
- source_word: ὄψονται
  choice: akan melihat
  rationale: Mempertahankan arti langsung verba ὁράω tanpa menafsirkannya sebagai 'menyadari' atau 'mengenal'; kesejajarannya dengan 'mengerti' tetap terlihat.
- source_word: οἳ οὐκ ἀκηκόασιν
  choice: mereka yang belum pernah mendengar
  rationale: Bentuk perfek menyoroti keadaan mereka sebagai orang-orang yang sampai saat itu belum mendengar; 'belum pernah' menyampaikannya secara alami.
- source_word: συνήσουσιν
  choice: akan mengerti
  rationale: Padanan modern dan jelas bagi συνίημι, serta mempertahankan bentuk janji profetis pada kala mendatang.
theological_decisions:
- issue: Rujukan pronomina αὐτοῦ dalam kutipan Yesaya
  choice: Mempertahankan 'dia' tanpa menggantinya dengan 'Mesias' atau 'Kristus'.
  alternative: Menerjemahkan 'tentang Mesias' atau 'tentang Kristus'.
  rationale: Teks Yunani memakai pronomina dan tidak menyebut gelar tersebut. Mempertahankan 'dia' menjaga tekstur kutipan Yesaya serta tidak memasukkan penafsiran ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Susunan relatif dibuat alami bagi pembaca umum, sementara metafora 'melihat' dan pronomina 'dia' dipertahankan agar ambiguitas dan hubungan antarteks tidak diselesaikan secara berlebihan.
