id: ROM.15.28
reference: Romans 15:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦτο οὖν ἐπιτελέσας, καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον, ἀπελεύσομαι δι’ ὑμῶν ⸀εἰς Σπανίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/028.yaml
  text: Therefore[a], when I have completed this and have sealed this fruit to them[c][b], I will go on by way of you to Spain.
translation:
  language: id
  text: Karena itu, sesudah saya menyelesaikan hal ini dan memeteraikan buah ini bagi mereka[a], saya akan berangkat melalui kalian[b] ke Spanyol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memeteraikan buah ini bagi mereka.” Kata “memeteraikan” mungkin menunjuk pada pengesahan, pengamanan, atau penyerahan sumbangan itu secara tuntas kepada para penerimanya. “Buah ini” mengacu pada sumbangan uang dari orang-orang percaya bukan Yahudi bagi orang-orang kudus di Yerusalem.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Atau, “melalui kalian.” Paulus tampaknya bermaksud singgah di Roma dalam perjalanannya ke Spanyol.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο οὖν ἐπιτελέσας
  choice: Karena itu, setelah saya menyelesaikan tugas ini
  rationale: οὖν menandai kesimpulan atau peralihan dari uraian sebelumnya, sedangkan τοῦτο menunjuk pada tugas pengantaran bantuan yang sedang dibicarakan. Klausa dengan 'setelah' menyatakan bahwa tindakan ini selesai sebelum keberangkatan Paulus.
- source_word: σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον
  choice: menyerahkan hasil ini kepada mereka dengan jaminan
  rationale: σφραγίζω secara harfiah berarti 'memeteraikan', tetapi dalam konteks pengantaran sumbangan kemungkinan menyatakan penyerahan yang diamankan atau disahkan. Ungkapan Indonesia ini menyampaikan fungsi metaforanya tanpa menimbulkan kesan bahwa uang atau 'hasil' itu secara harfiah diberi meterai. 'Hasil' mempertahankan gagasan καρπός sebagai buah atau hasil kemurahan hati, sementara catatan kaki menjelaskan metafora sumber.
- source_word: ἀπελεύσομαι
  choice: saya akan berangkat
  rationale: Bentuk futur ini menyatakan keberangkatan Paulus menuju tujuan berikutnya.
- source_word: δι’ ὑμῶν
  choice: melalui tempat kalian
  rationale: διά dengan genitif menyatakan perjalanan melalui atau lewat pihak yang disapa; dalam konteks ini Paulus bermaksud singgah di Roma dalam perjalanan ke Spanyol. 'Melalui tempat kalian' lebih alami daripada 'melalui kalian' dan tidak memastikan bentuk bantuan yang mungkin ia harapkan.
- source_word: εἰς Σπανίαν
  choice: ke Spanyol
  rationale: Padanan arah dan tujuan yang wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna metafora σφραγισάμενος dalam pengantaran sumbangan kepada orang-orang kudus di Yerusalem
  choice: menyerahkan hasil ini kepada mereka dengan jaminan
  alternative: memeteraikan hasil ini bagi mereka
  rationale: Metafora tersebut dapat menunjuk pada pengamanan, pengesahan, atau penyelesaian resmi penyerahan sumbangan. Terjemahan utama menyampaikan maknanya secara alami, sedangkan catatan kaki mempertahankan transparansi terhadap gambaran harfiahnya tanpa memilih secara berlebihan di antara nuansa pengamanan dan pengesahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kata ganti 'saya' dan 'kalian' dipakai agar hubungan penutur dan jemaat jelas. Metafora 'buah' dialihkan menjadi 'hasil' dalam teks utama demi kealamian, dengan konteks sumbangan dijelaskan dalam catatan kaki.
