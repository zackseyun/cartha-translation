id: ROM.15.27
reference: Romans 15:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εὐδόκησαν γάρ, καὶ ὀφειλέται ⸂εἰσὶν αὐτῶν⸃· εἰ γὰρ τοῖς πνευματικοῖς αὐτῶν ἐκοινώνησαν τὰ ἔθνη, ὀφείλουσιν καὶ ἐν τοῖς σαρκικοῖς λειτουργῆσαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/027.yaml
  text: For they were pleased to do it[a], and they are indebted to them. For if the Gentiles have shared in their spiritual things[c][b], they also owe it to minister to them in material things.
translation:
  language: id
  text: Sebab mereka melakukannya dengan senang hati, dan memang mereka berutang kepada orang-orang kudus itu. Sebab, jika bangsa-bangsa bukan Yahudi telah mendapat bagian dalam hal-hal rohani mereka, bangsa-bangsa itu juga wajib melayani mereka dengan hal-hal jasmani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam hal-hal yang bersifat daging”; maksudnya di sini ialah dukungan jasmani atau material, sebagai kebalikan dari hal-hal rohani.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: melakukannya dengan senang hati
  rationale: Bentuk ini menyatakan persetujuan dan kerelaan; objek tindakan tersirat dari konteks sebelumnya, yaitu pemberian bantuan.
- source_word: ὀφειλέται εἰσὶν αὐτῶν
  choice: mereka berutang kepada orang-orang kudus itu
  rationale: Ungkapan ini mempertahankan gagasan kewajiban moral, sedangkan penyebutan 'orang-orang kudus itu' memperjelas rujukan pronomina berdasarkan konteks Roma 15:25–26.
- source_word: τὰ ἔθνη
  choice: bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks Paulus, istilah ini menunjuk kepada kelompok non-Yahudi sebagai pembanding orang percaya Yahudi; pilihan ini lebih jelas dalam bahasa Indonesia daripada sekadar 'bangsa-bangsa'.
- source_word: τοῖς πνευματικοῖς αὐτῶν
  choice: hal-hal rohani mereka
  rationale: Adjektiva yang dibendakan diterjemahkan secara dekat tanpa menambahkan nomina 'berkat' yang tidak tersurat.
- source_word: ἐκοινώνησαν
  choice: telah mendapat bagian dalam
  rationale: Ungkapan Indonesia ini menyampaikan partisipasi atau berbagi dalam sesuatu secara alami.
- source_word: ἐν τοῖς σαρκικοῖς
  choice: dengan hal-hal jasmani
  rationale: Dalam konteks pengumpulan bantuan, istilah ini menunjuk pada sarana material atau kebutuhan tubuh, bukan pada sifat berdosa; 'dengan' mengungkapkan fungsi instrumental secara alami.
- source_word: λειτουργῆσαι
  choice: melayani
  rationale: Kata ini menyatakan pelayanan yang diberikan bagi kepentingan orang lain dan dapat memiliki nuansa pelayanan yang luhur, tanpa membatasinya pada jabatan keagamaan.
theological_decisions:
- issue: Makna σαρκικοῖς sebagai lawan πνευματικοῖς
  choice: hal-hal jasmani
  alternative: hal-hal yang bersifat daging; hal-hal material
  rationale: Konteks langsung adalah bantuan keuangan bagi orang-orang kudus di Yerusalem. Karena itu, kata tersebut menunjuk pada dukungan jasmani atau material, bukan kedagingan dalam arti etis.
- issue: Rujukan αὐτῶν dan αὐτοῖς
  choice: orang-orang kudus di Yerusalem, terutama orang percaya Yahudi
  alternative: Israel secara lebih luas
  rationale: Rujukan terdekat dalam Roma 15:25–26 ialah orang-orang kudus di Yerusalem, meskipun alasan Paulus juga bertumpu pada hubungan sejarah keselamatan antara bangsa-bangsa bukan Yahudi dan umat Yahudi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bangsa-bangsa bukan Yahudi' dipakai agar identitas kelompok jelas; pengulangan 'bangsa-bangsa itu' menghindari pronomina jamak yang berpotensi kabur. Kontras 'hal-hal rohani' dan 'hal-hal jasmani' dipertahankan sedekat mungkin dengan struktur sumber.
