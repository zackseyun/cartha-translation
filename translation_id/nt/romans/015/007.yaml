  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διὸ προσλαμβάνεσθε ἀλλήλους, καθὼς καὶ ὁ Χριστὸς προσελάβετο ⸀ὑμᾶς, εἰς δόξαν ⸀τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/007.yaml
  text: Therefore welcome one another[a], just as the Messiah also welcomed you[c][b], for the glory of God.
translation:
  language: id
  text: Karena itu, sambutlah satu sama lain, sama seperti Sang Mesias[a] juga telah menyambut kalian, demi kemuliaan Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Kristus.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “untuk kemuliaan Allah” atau “agar Allah dimuliakan.” Frasa ini menyatakan tujuan atau hasil tindakan Sang Mesias menyambut kalian.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan dari uraian sebelumnya dan mempertahankan hubungan logisnya secara alami dalam bahasa Indonesia.
- source_word: προσλαμβάνεσθε
  choice: sambutlah
  rationale: Imperatif ini menyatakan penerimaan yang aktif dan relasional; bentuk ini sesuai dengan konteks kehidupan bersama dalam jemaat.
- source_word: ἀλλήλους
  choice: satu sama lain
  rationale: Mempertahankan makna timbal balik dari pronomina Yunani.
- source_word: καθὼς καὶ
  choice: sama seperti ... juga
  rationale: Mempertahankan unsur perbandingan καθὼς dan unsur penambahan καί.
- source_word: ὁ Χριστὸς
  choice: Sang Mesias
  rationale: Artikel dan konteks mendukung fungsi Χριστός sebagai gelar; 'Sang Mesias' alami dan bermartabat dalam bahasa Indonesia.
- source_word: προσελάβετο
  choice: telah menyambut
  rationale: Mengulang padanan bagi verba yang sama untuk mempertahankan kesejajaran antara tindakan jemaat dan tindakan Mesias.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Menyatakan orang kedua jamak secara eksplisit, sesuai bentuk sumber.
- source_word: εἰς δόξαν τοῦ θεοῦ
  choice: demi kemuliaan Allah
  rationale: Menyampaikan kemungkinan arah atau tujuan dari εἰς secara alami tanpa menentukan secara berlebihan apakah frasa itu terutama menyatakan tujuan atau hasil.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Di sini istilah tersebut dapat dibaca sebagai gelar. Pilihan ini mempertahankan kandungan mesianiknya tanpa mengubah identitas tokoh yang dimaksud.
- issue: Nuansa προσλαμβάνομαι dalam kehidupan jemaat
  choice: sambutlah satu sama lain
  alternative: terimalah satu sama lain
  rationale: '''Sambutlah'' menonjolkan penerimaan aktif dan relasional yang sesuai dengan konteks Roma 14–15, sementara alternatif leksikal tetap dicatat.'
- issue: Keterkaitan εἰς δόξαν τοῦ θεοῦ
  choice: ditempatkan pada akhir kalimat sehingga secara gramatikal tetap dapat dipahami berkaitan dengan tindakan Sang Mesias atau dengan seruan secara keseluruhan
  alternative: menautkannya secara eksplisit hanya pada 'telah menyambut kalian' atau hanya pada 'sambutlah satu sama lain'
  rationale: Susunan Yunani mengizinkan ketegangan mengenai cakupan frasa tujuan/hasil itu; terjemahan tidak menutup ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan bermartabat. 'Kalian' dipakai untuk menampilkan bentuk jamak ὑμᾶς dengan jelas; 'satu sama lain' mempertahankan sifat timbal balik. Penanda catatan kaki muncul dalam teks utama.
