  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ γὰρ τολμήσω ⸂τι λαλεῖν⸃ ὧν οὐ κατειργάσατο Χριστὸς δι’ ἐμοῦ εἰς ὑπακοὴν ἐθνῶν, λόγῳ καὶ ἔργῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/018.yaml
  text: For I will not dare to speak of anything except what Messiah has accomplished through me for the obedience of the Gentiles[a], by word and deed[b],
translation:
  language: id
  text: Sebab aku tidak akan berani membicarakan apa pun selain apa yang telah dikerjakan Mesias melalui aku demi ketaatan bangsa-bangsa lain[a], melalui perkataan dan perbuatan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bangsa-bangsa.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Aku tidak berani membicarakan apa pun selain apa yang telah dikerjakan Mesias melalui aku.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ τολμήσω
  choice: Sebab aku tidak akan berani
  rationale: Bentuk futur dengan οὐ menyatakan keteguhan Paulus untuk tidak memberanikan diri melampaui karya Mesias; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa keberanian atau kenekatan.
- source_word: τι λαλεῖν ὧν οὐ
  choice: membicarakan apa pun selain apa yang
  rationale: 'Rangkaian ini bersifat membatasi: Paulus hanya akan membicarakan apa yang dikerjakan Mesias. Kata ''selain'' diperlukan agar hubungan idiomatisnya jelas dalam bahasa Indonesia.'
- source_word: κατειργάσατο
  choice: telah dikerjakan
  rationale: Kata ini menunjuk pada sesuatu yang diwujudkan atau dihasilkan secara efektif. Bentuk 'telah dikerjakan' menampilkan tindakan Mesias sebagai karya yang sudah terlaksana dan tetap relevan.
- source_word: Χριστὸς
  choice: Mesias
  rationale: Di sini Χριστός dipertahankan sebagai gelar yang menunjuk pada peran mesianik Yesus, bukan sekadar sebagai nama diri.
- source_word: δι’ ἐμοῦ
  choice: melalui aku
  rationale: 'διά dengan genitif menandai perantaraan: Mesias adalah pelaku utama, sedangkan Paulus menjadi sarana-Nya.'
- source_word: εἰς ὑπακοὴν ἐθνῶν
  choice: untuk membawa bangsa-bangsa lain kepada ketaatan
  rationale: Ungkapan ini menyampaikan arah atau hasil karya Mesias, yaitu ketaatan di antara orang-orang bukan Yahudi, dengan bahasa Indonesia yang jelas.
- source_word: λόγῳ καὶ ἔργῳ
  choice: melalui perkataan dan perbuatan
  rationale: Kedua bentuk datif kemungkinan menyatakan sarana. 'Perkataan dan perbuatan' mempertahankan pasangan antara pewartaan dan tindakan.
theological_decisions:
- issue: Makna Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Konteks menampilkan Χριστός sebagai pelaku ilahi yang berkarya melalui Paulus, dan gelar 'Mesias' mempertahankan fungsi titulernya.
- issue: Makna ἐθνῶν
  choice: bangsa-bangsa lain
  alternative: bangsa-bangsa
  rationale: Dalam argumentasi Roma, istilah ini lazim menunjuk pada orang-orang bukan Yahudi. Alternatif harfiah 'bangsa-bangsa' tetap dicatat karena secara leksikal mungkin.
- issue: Hubungan εἰς ὑπακοὴν dengan karya Mesias
  choice: untuk membawa ... kepada ketaatan
  alternative: demi ketaatan bangsa-bangsa lain
  rationale: Pilihan utama menyampaikan arah atau hasil tanpa menentukan secara berlebihan apakah frasa itu semata-mata tujuan atau hasil; alternatif lebih formal tetapi kurang alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat cukup dekat dengan bahasa sumber, tetapi memakai 'membicarakan apa pun selain' dan 'membawa ... kepada ketaatan' agar hubungan sintaksisnya jelas bagi pembaca umum. Semua penanda catatan kaki dicantumkan dalam teks utama.
