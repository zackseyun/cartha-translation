  text: τὰ δὲ ἔθνη ὑπὲρ ἐλέους δοξάσαι τὸν θεόν· καθὼς γέγραπται· Διὰ τοῦτο ἐξομολογήσομαί σοι ἐν ἔθνεσι, καὶ τῷ ὀνόματί σου ψαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/009.yaml
  text: and the Gentiles might glorify God for his mercy[a], as it is written, “Therefore I will praise you among the Gentiles, and sing praise to your name.”
translation:
  language: id
  text: dan supaya bangsa-bangsa lain memuliakan Allah karena belas kasihan-Nya,[a] seperti ada tertulis, “Karena itu, aku akan memuji Engkau di antara bangsa-bangsa dan menyanyikan pujian bagi nama-Mu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bangsa-bangsa” (untuk kedua kemunculan istilah Yunani ini). Dalam argumen Paulus, istilah itu secara khusus menunjuk kepada bangsa-bangsa bukan Yahudi, tetapi dalam kutipan ini istilah tersebut juga dapat berarti lebih luas, yaitu “bangsa-bangsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: bangsa-bangsa lain
  rationale: Dalam konteks Roma, istilah ini menunjuk kepada bangsa-bangsa bukan Yahudi. Pilihan ini menyampaikan kontras etnis dalam argumen Paulus dengan bahasa Indonesia yang alami.
- source_word: ὑπὲρ ἐλέους
  choice: karena belas kasihan-Nya
  rationale: ὑπέρ dengan genitif menyatakan alasan atau dasar. Akhiran -Nya memperjelas bahwa belas kasihan itu berasal dari Allah, sesuai konteks.
- source_word: δοξάσαι
  choice: memuliakan
  rationale: Infinitif aoris ini bergantung secara sintaksis pada ayat sebelumnya. Bentuk Indonesia tanpa penambahan modal tetap wajar sebagai kelanjutan kalimat dan mempertahankan hubungan tujuan/hasil dari konteks.
- source_word: καθὼς γέγραπται
  choice: seperti ada tertulis
  rationale: Ini merupakan rumusan pengutipan Kitab Suci yang baku, jelas, dan bermartabat dalam bahasa Indonesia.
- source_word: ἐξομολογήσομαί
  choice: aku akan memuji
  rationale: Dalam kutipan ini kata tersebut menyatakan pujian atau pengakuan syukur kepada Allah, bukan pengakuan dosa; 'memuji' juga selaras dengan ψαλῶ.
- source_word: ἐν ἔθνεσι
  choice: di antara bangsa-bangsa
  rationale: ἐν dengan datif bersifat lokatif, 'di antara'. Dalam kutipan Kitab Suci, 'bangsa-bangsa' mempertahankan cakupan yang lebih luas, sementara konteks Paulus menerapkannya secara khusus kepada bangsa-bangsa bukan Yahudi.
- source_word: ψαλῶ
  choice: menyanyikan pujian
  rationale: Kata ini dalam konteks ibadah berarti menyanyikan pujian; pilihan ini alami dan tidak membatasinya hanya pada mazmur kanonik.
- source_word: τῷ ὀνόματί σου
  choice: bagi nama-Mu
  rationale: Datif sesudah ψαλῶ menyatakan arah atau penerima pujian. 'Bagi nama-Mu' mempertahankan ungkapan alkitabiah dengan bahasa Indonesia yang alami.
theological_decisions:
- issue: Hubungan klausa pembuka dengan ayat sebelumnya
  choice: 'Diterjemahkan sebagai kelanjutan sintaksis dari ayat 8: bangsa-bangsa lain memuliakan Allah karena belas kasihan-Nya.'
  alternative: 'Menerjemahkannya sebagai fragmen mandiri: ''dan bangsa-bangsa lain untuk memuliakan Allah karena belas kasihan''.'
  rationale: Teks Yunani bergantung pada struktur kalimat ayat sebelumnya. Terjemahan mempertahankan kesinambungan itu tanpa menambahkan modalitas yang tidak dinyatakan secara eksplisit dalam bentuk Indonesia.
- issue: Cakupan ἔθνη dalam pernyataan Paulus dan kutipan
  choice: Pada klausa Paulus dipakai 'bangsa-bangsa lain', sedangkan dalam kutipan dipakai 'bangsa-bangsa'.
  alternative: Memakai 'bangsa-bangsa lain' pada kedua kemunculan atau 'bangsa-bangsa' pada keduanya.
  rationale: Pilihan ini mempertahankan sekaligus penerapan khusus Paulus kepada orang bukan Yahudi dan cakupan lebih luas dari kutipan dasarnya, tanpa menghilangkan ketegangan leksikal yang asli.
translation_notes:
  register: Bahasa Indonesia standar modern, alami, dan bermartabat. 'Bangsa-bangsa lain' dipakai untuk menyampaikan makna non-Yahudi tanpa istilah teknis yang kurang umum, sedangkan bentuk kutipan mempertahankan 'bangsa-bangsa' guna mencerminkan keluasan teks sumber.
