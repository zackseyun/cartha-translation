  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/013.yaml
  text: May the God of hope fill you with all joy and peace in believing, so that you may abound in hope by the power of the Holy Spirit.
translation:
  language: id
  text: Semoga Allah, sumber pengharapan, memenuhi kamu dengan segala sukacita dan damai sejahtera dalam iman, supaya kamu berlimpah dalam pengharapan oleh kuasa Roh Kudus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς ἐλπίδος
  choice: Semoga Allah, sumber pengharapan,
  rationale: δὲ bersifat penghubung ringan dan tidak perlu diterjemahkan secara tersendiri dalam bahasa Indonesia. Genitif τῆς ἐλπίδος menggambarkan Allah sebagai Allah yang menjadi sumber atau dasar pengharapan; ungkapan aposisional ini alami dan jelas.
- source_word: πληρώσαι
  choice: memenuhi
  rationale: Optatif aoristus dalam bentuk berkat atau doa diterjemahkan dengan 'Semoga ... memenuhi', sambil mempertahankan gambaran kepenuhan.
- source_word: πάσης χαρᾶς καὶ εἰρήνης
  choice: dengan segala sukacita dan damai sejahtera
  rationale: Genitif menyatakan isi dari tindakan memenuhi. 'Segala' mempertahankan cakupan πάσης, sedangkan 'sukacita' dan 'damai sejahtera' merupakan padanan baku dan mudah dipahami.
- source_word: ἐν τῷ πιστεύειν
  choice: dalam percaya
  rationale: ἐν dengan infinitif berartikel menyatakan lingkup atau keadaan berlangsungnya tindakan. 'Dalam percaya' mempertahankan bentuk verbal πιστεύειν dan relasinya dengan kepenuhan sukacita serta damai sejahtera.
- source_word: εἰς τὸ περισσεύειν ὑμᾶς
  choice: supaya kamu berlimpah
  rationale: εἰς τό dengan infinitif dapat menyatakan tujuan atau hasil. 'Supaya' tetap membiarkan nuansa tujuan-hasil itu sesuai konteks doa.
- source_word: ἐν τῇ ἐλπίδι
  choice: dalam pengharapan
  rationale: Padanan ini mempertahankan konstruksi ἐν dan hubungan leksikal dengan τῆς ἐλπίδος pada awal ayat.
- source_word: ἐν δυνάμει
  choice: oleh kuasa
  rationale: 'Di sini ἐν terutama bernuansa sarana: keberlimpahan dalam pengharapan terjadi melalui kuasa ilahi.'
- source_word: πνεύματος ἁγίου
  choice: Roh Kudus
  rationale: Dalam konteks Paulus, frasa ini merujuk kepada Roh ilahi. Kapitalisasi merupakan konvensi bahasa Indonesia untuk sebutan tersebut tanpa menambahkan artikel yang tidak diperlukan.
theological_decisions:
- issue: Makna genitif dalam θεὸς τῆς ἐλπίδος
  choice: Allah, sumber pengharapan
  alternative: Allah pengharapan
  rationale: Genitif dapat mencakup gagasan bahwa Allah dicirikan oleh, memberi, dan menjadi dasar pengharapan. 'Sumber pengharapan' menyampaikan relasi itu secara alami, tetapi tidak merinci lebih jauh objek pengharapan.
- issue: Rujukan πνεύματος ἁγίου
  choice: Roh Kudus
  alternative: roh yang kudus
  rationale: Pemakaian Paulus dan konteks kuasa ilahi mendukung rujukan kepada Roh Kudus, bukan sekadar sikap batin atau daya impersonal.
- issue: Nuansa εἰς τὸ περισσεύειν
  choice: supaya kamu berlimpah
  alternative: sehingga kamu berlimpah
  rationale: Konstruksi ini dapat menyatakan tujuan atau hasil. 'Supaya' sesuai dengan bentuk doa berkat, tanpa meniadakan hasil yang diharapkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'kamu' dipakai karena ὑμᾶς jamak secara konteks, tetapi bahasa Indonesia tidak menandai jumlah pada pronomina ini. Susunan kalimat mempertahankan alur doa, kepenuhan, tujuan/hasil, dan sarana ilahi dari teks Yunani.
