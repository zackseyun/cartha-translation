    rationale: Kata ἀρέσκειν berarti ‘menyenangkan/berkenan kepada’; terjemahan draft menambahkan nuansa ‘mencari’ yang tidak eksplisit dalam teks sumber.
  - severity: low
    issue: “Orang-orang yang tidak kuat” kurang idiomatis dan melemahkan pasangan istilah yang telah dibangun dalam konteks.
    rationale: ἀδυνάτων berfungsi sebagai lawan dari δυνατοί. “Mereka yang lemah” lebih alami dalam bahasa Indonesia modern serta mempertahankan kontras langsung ‘yang kuat/yang lemah’.
