  text: Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν, καὶ μὴ ἑαυτοῖς ἀρέσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/001.yaml
  text: We who are strong ought to bear the weaknesses of the weak[a], and not please ourselves.
translation:
  language: id
  text: Kita yang kuat wajib menanggung kelemahan mereka yang lemah[a], dan tidak menyenangkan diri sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kekurangan mereka yang lemah.” Istilah Yunani ini dapat berarti kelemahan, keterbatasan, atau kekurangan; dalam konteks ini kemungkinan besar menunjuk pada keberatan atau keterbatasan hati nurani yang dibahas dalam pasal sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀφείλομεν
  choice: wajib
  rationale: Menyampaikan kewajiban moral yang dinyatakan Paulus dengan tegas, tanpa mengubahnya menjadi bentuk perintah langsung.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai peralihan ringan dari pembahasan sebelumnya; dalam bahasa Indonesia, hubungan itu sudah mengalir secara alami tanpa kata penghubung tambahan.
- source_word: ἡμεῖς οἱ δυνατοὶ
  choice: kita yang kuat
  rationale: Mempertahankan kata ganti orang pertama jamak yang ditekankan serta pertentangan kontekstual antara yang kuat dan yang tidak kuat.
- source_word: τὰ ἀσθενήματα
  choice: kelemahan
  rationale: Istilah yang cukup luas untuk mencakup keterbatasan atau keberatan hati nurani, tanpa memberi kesan bahwa yang dimaksud pasti dosa atau penyakit fisik.
- source_word: τῶν ἀδυνάτων
  choice: orang-orang yang tidak kuat
  rationale: Mencerminkan perbedaan leksikal sumber antara δυνατοί dan ἀδύνατοι serta tetap menyampaikan kontras dalam konteks Roma 14–15.
- source_word: βαστάζειν
  choice: menanggung
  rationale: Mempertahankan gambaran memikul beban dan menyiratkan dukungan aktif, bukan sekadar toleransi.
- source_word: καὶ μὴ ἑαυτοῖς ἀρέσκειν
  choice: dan tidak mencari kesenangan diri sendiri
  rationale: 'Mengungkapkan makna etis ungkapan refleksif secara alami: tidak menjadikan kepuasan atau kepentingan diri sebagai tujuan.'
theological_decisions:
- issue: Makna 'yang kuat' dan 'orang-orang yang tidak kuat'
  choice: Terutama merujuk kepada orang percaya dengan tingkat kebebasan atau kekuatan hati nurani yang berbeda dalam konteks Roma 14.
  alternative: Kelompok yang kuat dan lemah secara sosial atau jasmani.
  rationale: Konteks terdekat membahas perselisihan mengenai makanan dan hari-hari tertentu; namun terjemahan utama tetap cukup terbuka dan penjelasan kontekstual ditempatkan dalam catatan kaki.
- issue: Sifat 'kelemahan'
  choice: Kelemahan, keterbatasan, atau keberatan hati nurani yang perlu ditanggung oleh pihak yang kuat.
  alternative: Kegagalan moral orang yang lemah.
  rationale: ἀσθένημα dapat memiliki rentang makna yang mencakup kelemahan atau kekurangan; 'kelemahan' menghindari penilaian moral yang lebih keras daripada yang dituntut konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kita' dipilih karena Paulus menyertakan dirinya bersama kelompok yang kuat. Susunan dibuat lugas dan mudah dibaca, sambil mempertahankan metafora menanggung serta ketegangan antara yang kuat dan yang tidak kuat.
