  source_fidelity: Terjemahan pokok menangkap kewajiban moral (ὀφείλομεν), kontras antara yang kuat dan yang lemah, metafora βαστάζειν, serta larangan berkenan kepada diri sendiri. Namun, “mencari kesenangan diri sendiri” sedikit menggeser ἑαυτοῖς ἀρέσκειν dari tindakan ‘menyenangkan diri sendiri’ kepada pencarian kesenangan. “Yang tidak kuat” juga kurang idiomatis untuk pasangan kontekstual δυνατοί/ἀδύνατοι.
  naturalness: “Kita yang kuat” dan “menanggung” baik dan baku. “Mereka yang lemah” merupakan pasangan yang lebih alami dan langsung daripada “orang-orang yang tidak kuat.” “Tidak menyenangkan diri sendiri” lebih dekat dengan sumber dan tetap alami dalam register Alkitab bahasa Indonesia modern.
  terminology: Pertahankan “kuat” dan “lemah” untuk menjaga kontras Paulus dalam Roma 14–15. “Kelemahan” tepat untuk ἀσθενήματα dan tidak memaksakan pengertian dosa. Catatan kaki dapat menyebut “kekurangan” sebagai alternatif, tetapi perlu menjelaskan bahwa konteksnya terutama menyangkut keterbatasan atau keberatan hati nurani.
