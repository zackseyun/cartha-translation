  to: melalui kuasa tanda-tanda dan mukjizat, melalui kuasa Roh, sehingga dari Yerusalem dan sekitarnya hingga Ilirikum aku telah memberitakan Injil Mesias secara penuh,
  rationale: Revisi meningkatkan kealamian bahasa Indonesia dan mempertahankan ambiguitas yang sah pada genitif τοῦ Χριστοῦ. Tidak diperlukan catatan kaki, karena “Injil Mesias” menyampaikan relasi genitif tanpa memaksakan arti “tentang”, “dari”, atau “milik”.
