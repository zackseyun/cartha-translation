    issue: Relasi genitif τοῦ Χριστοῦ dipersempit dalam “Injil tentang Mesias”.
    rationale: Genitif ini dapat dipahami sebagai Injil yang berkenaan dengan Mesias, berasal dari Mesias, atau terkait dengan Mesias. Terjemahan “tentang” memilih satu relasi secara lebih tegas daripada teks sumber.
  - severity: low
    issue: “Keajaiban-keajaiban” kurang alami.
    rationale: Reduplikasi ini secara formal menandai jamak, tetapi dalam kolokasi Alkitab Indonesia, “tanda-tanda dan mukjizat” lebih idiomatis dan tidak kehilangan makna jamak.
