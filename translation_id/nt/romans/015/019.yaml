id: ROM.15.19
reference: Romans 15:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν δυνάμει σημείων καὶ τεράτων, ἐν δυνάμει ⸀πνεύματος· ὥστε με ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ μέχρι τοῦ Ἰλλυρικοῦ πεπληρωκέναι τὸ εὐαγγέλιον τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/019.yaml
  text: by the power of signs and wonders[a], by the power of the Spirit, so that from Jerusalem and all around as far as Illyricum I have fully proclaimed the gospel of the Messiah[b],
translation:
  language: id
  text: melalui kuasa tanda-tanda dan mukjizat, melalui kuasa Roh, sehingga dari Yerusalem dan sekitarnya hingga Ilirikum aku telah memberitakan Injil Mesias secara penuh,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν δυνάμει
  choice: melalui kuasa
  rationale: Frasa ini menyatakan sarana atau daya yang membuat pelayanan Paulus efektif. 'Melalui kuasa' alami dalam bahasa Indonesia dan mempertahankan pengulangan dalam teks Yunani.
- source_word: σημείων καὶ τεράτων
  choice: tanda-tanda dan keajaiban-keajaiban
  rationale: Pasangan istilah ini menunjuk pada perbuatan luar biasa yang menjadi bukti karya ilahi; bentuk gandanya dipertahankan secara wajar.
- source_word: πνεύματος
  choice: Roh
  rationale: Dalam konteks pelayanan Paulus, rujukannya paling mungkin kepada Roh Kudus. 'Roh' tidak menambahkan kata 'Kudus' yang tidak tertulis dalam frasa Yunani ini.
- source_word: ὥστε
  choice: sehingga
  rationale: Kata penghubung ini memperkenalkan hasil dari pelayanan yang berlangsung dalam kuasa tersebut.
- source_word: ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ
  choice: dari Yerusalem dan daerah-daerah di sekitarnya
  rationale: κύκλῳ bersifat adverbial dan menggambarkan kawasan luas di sekitar Yerusalem, bukan semata-mata rute melingkar.
- source_word: μέχρι τοῦ Ἰλλυρικοῦ
  choice: sampai ke Ilirikum
  rationale: μέχρι menandai batas jangkauan geografis pelayanan Paulus.
- source_word: πεπληρωκέναι
  choice: telah memberitakan sepenuhnya
  rationale: Dalam hubungan dengan 'Injil', verba ini paling alami dipahami sebagai membawa pemberitaan Injil sampai pada kepenuhannya atau menuntaskan pemberitaannya di wilayah tersebut. Bentuk perfektum tercermin dalam 'telah'.
- source_word: τὸ εὐαγγέλιον
  choice: Injil
  rationale: '''Injil'' merupakan istilah baku, ringkas, dan dipahami luas dalam konteks tulisan Paulus.'
- source_word: τοῦ Χριστοῦ
  choice: tentang Mesias
  rationale: Genitif dapat menyatakan isi atau pokok kabar baik. Χριστός berfungsi sebagai gelar, sehingga diterjemahkan 'Mesias'; 'tentang' menghasilkan ungkapan Indonesia yang jelas tanpa memaksakan satu relasi kepemilikan.
theological_decisions:
- issue: Rujukan πνεύματος
  choice: Roh, dengan rujukan paling mungkin kepada Roh Kudus
  alternative: roh dalam arti lebih umum; Roh Kudus
  rationale: Konteks tanda, keajaiban, dan pelayanan rasuli mendukung rujukan kepada Roh Kudus, tetapi terjemahan tidak menambahkan adjektiva 'Kudus' yang tidak muncul di sini.
- issue: Makna πεπληρωκέναι τὸ εὐαγγέλιον
  choice: telah memberitakan sepenuhnya Injil
  alternative: telah memenuhi Injil; telah menuntaskan pemberitaan Injil
  rationale: Secara kontekstual, ungkapan ini menunjuk pada pelaksanaan pemberitaan Injil secara penuh dalam rentang wilayah yang disebutkan. Terjemahan harfiah 'memenuhi Injil' tidak alami dan berpotensi kabur dalam bahasa Indonesia.
- issue: Relasi genitif τοῦ Χριστοῦ
  choice: Injil tentang Mesias
  alternative: Injil milik Mesias; Injil dari Mesias
  rationale: Genitif Yunani dapat memuat lebih dari satu nuansa. Dalam konteks ini, 'tentang Mesias' jelas dan alami, tetapi alternatif yang lebih formal dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'melalui kuasa' dipertahankan demi penekanan retoris. Nama geografis memakai bentuk Indonesia 'Ilirikum'. Pronomina 'aku' mengikuti suara pribadi Paulus dan gaya surat yang langsung.
