id: ROM.15.16
reference: Romans 15:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰς τὸ εἶναί με λειτουργὸν ⸂Χριστοῦ Ἰησοῦ⸃ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/016.yaml
  text: to be a minister of Messiah Jesus to the Gentiles[a], serving as a priest in the gospel of God, so that the offering of the Gentiles may become acceptable[d][c][b], sanctified by the Holy Spirit.
translation:
  language: id
  text: untuk menjadi pelayan Kristus Yesus bagi bangsa-bangsa bukan Yahudi[a], dengan melayani Injil Allah sebagai imam[b], supaya persembahan bangsa-bangsa bukan Yahudi[c] menjadi dapat diterima, dikuduskan oleh Roh Kudus[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagi bangsa-bangsa.”
    reason: lexical_alternative
  - marker: b
    text: Atau “melaksanakan pelayanan keimaman bagi Injil Allah.”
    reason: lexical_alternative
  - marker: c
    text: Kemungkinan besar bangsa-bangsa bukan Yahudi itu sendiri dipersembahkan kepada Allah; dapat juga berarti “persembahan yang diberikan oleh bangsa-bangsa bukan Yahudi.”
    reason: alternative_reading
  - marker: d
    text: Atau “dikuduskan di dalam Roh Kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργὸν
  choice: pelayan
  rationale: Kata ini menunjuk kepada seseorang yang menjalankan pelayanan, termasuk pelayanan keagamaan. “Pelayan” alami dalam bahasa Indonesia dan tidak menyiratkan jabatan imamat formal, sementara gambaran keimaman dijelaskan oleh kata berikutnya.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Kristus Yesus
  rationale: “Kristus” merupakan padanan baku dan bermartabat bagi gelar Yunani Χριστός dalam bahasa Indonesia, dengan urutan nama sesuai teks sumber.
- source_word: εἰς τὰ ἔθνη
  choice: bagi bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks pelayanan Paulus, τὰ ἔθνη terutama menunjuk kepada orang-orang atau bangsa-bangsa non-Yahudi. Bentuk ini mempertahankan unsur jamak dan cakupan antarbangsanya.
- source_word: ἱερουργοῦντα
  choice: menjalankan tugas keimaman
  rationale: Kata kerja ini secara khusus memakai citra pelayanan imam. Terjemahan ini mempertahankan metafora kultis tanpa menyatakan bahwa Paulus memegang jabatan imam dalam struktur gerejawi tertentu.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: Injil Allah
  rationale: Ungkapan ini ringkas, baku, dan mempertahankan konstruksi Yunani yang dapat menyatakan Injil yang berasal dari atau dimiliki Allah.
- source_word: προσφορὰ τῶν ἐθνῶν
  choice: persembahan bangsa-bangsa bukan Yahudi
  rationale: 'Bentuk ini mempertahankan ambiguitas genetif Yunani: kemungkinan utama ialah bangsa-bangsa bukan Yahudi itu sendiri sebagai persembahan, tetapi secara gramatikal dapat pula berarti persembahan yang mereka berikan.'
- source_word: εὐπρόσδεκτος
  choice: berkenan kepada Allah
  rationale: Dalam konteks persembahan, “berkenan kepada Allah” menyampaikan gagasan diterima dengan baik oleh-Nya; penyebutan Allah membuat ungkapan Indonesia lengkap dan referennya jelas dari konteks.
- source_word: ἡγιασμένη
  choice: dikuduskan
  rationale: Bentuk ini mempertahankan aspek pasif dan keadaan yang dihasilkan oleh tindakan pengudusan, sekaligus menjaga hubungan dengan kosakata kekudusan dalam surat Paulus.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: oleh Roh Kudus
  rationale: ἐν di sini paling wajar dipahami secara instrumental, yakni Roh Kudus sebagai pelaku atau sarana pengudusan; kemungkinan arti “di dalam” tetap dicatat.
theological_decisions:
- issue: Gambaran keimaman bagi pelayanan Paulus
  choice: Paulus menggambarkan pelayanan Injilnya kepada bangsa-bangsa bukan Yahudi dengan bahasa keimaman.
  alternative: Membacanya sebagai pernyataan tentang jabatan imam formal, atau menghilangkan seluruh nuansa keimaman dan menjadikannya pelayanan umum saja.
  rationale: Gabungan λειτουργός, ἱερουργέω, dan προσφορά membentuk metafora keimaman yang nyata. Namun, yang dibicarakan ialah pelayanan Injil dan persembahan bangsa-bangsa kepada Allah, bukan kurban pendamaian yang dilakukan Paulus.
- issue: Rujukan frasa “persembahan bangsa-bangsa bukan Yahudi”
  choice: Kemungkinan besar bangsa-bangsa bukan Yahudi itu sendiri merupakan persembahan kepada Allah sebagai buah pelayanan Paulus.
  alternative: Persembahan yang diberikan oleh bangsa-bangsa bukan Yahudi.
  rationale: Konteks misi Paulus dan rangkaian metafora keimaman mendukung pembacaan bahwa orang-orang bukan Yahudi dipersembahkan kepada Allah. Namun, konstruksi genetif Yunani memungkinkan pembacaan alternatif, sehingga teks utama tidak dibuat lebih eksplisit daripada sumbernya.
- issue: Peranan Roh Kudus dalam pengudusan
  choice: Roh Kudus dipahami sebagai pelaku atau sarana yang menguduskan persembahan itu.
  alternative: Pengudusan berlangsung “di dalam Roh Kudus,” dengan penekanan pada lingkup atau persekutuan dengan Roh.
  rationale: Preposisi ἐν dapat bersifat instrumental maupun menunjukkan lingkup. Konteks mendukung arti instrumental, tetapi alternatif yang sungguh mungkin dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “Injil,” “Kristus,” “dikuduskan,” dan “Roh Kudus” dipertahankan sebagai kosakata Alkitab yang dikenal luas. Susunan kalimat menjaga metafora pelayanan imam dan ambiguitas “persembahan bangsa-bangsa bukan Yahudi,” sementara tambahan “kepada Allah” hanya memperjelas sasaran keberkenanan yang sudah tersirat dalam konteks persembahan.
