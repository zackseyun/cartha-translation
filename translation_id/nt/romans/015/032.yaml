  yaml_path: translation/nt/romans/015/032.yaml
  text: so that by God's will I may come to you with joy and be refreshed together with you[a].
translation:
  language: id
  text: supaya aku, oleh kehendak Allah, dapat datang kepada kamu dengan sukacita dan menikmati kelegaan bersama dengan kamu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “beroleh kesegaran bersama dengan kamu” atau “beristirahat bersama dengan kamu.” Kata kerja Yunani ini menyampaikan gagasan kelegaan, kesegaran, atau perhentian yang dinikmati bersama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Memperkenalkan klausa tujuan yang meneruskan permohonan Paulus pada ayat sebelumnya; bentuk ini alami dan mempertahankan daya telik.
- source_word: ἐν χαρᾷ
  choice: dengan sukacita
  rationale: Mengungkapkan keadaan atau cara yang menyertai kedatangan Paulus dan mempertahankan bentuk nomina χαρά.
- source_word: ἐλθὼν πρὸς ὑμᾶς
  choice: aku datang kepadamu
  rationale: Partisip aoris ini bergantung pada verba utama dan secara alami dimasukkan ke dalam konstruksi tujuan dalam bahasa Indonesia.
- source_word: διὰ θελήματος θεοῦ
  choice: oleh kehendak Allah
  rationale: διά dengan genitif menyatakan perantaraan atau penentuan oleh kehendak Allah; ungkapan ini ringkas, wajar, dan tetap dekat dengan struktur sumber.
- source_word: συναναπαύσωμαι
  choice: mendapat kesegaran bersama-sama denganmu
  rationale: Mempertahankan gagasan beristirahat atau disegarkan serta unsur kebersamaan dalam awalan συν-, tanpa memaksakan bahwa bentuknya harus dipahami secara timbal balik penuh.
theological_decisions:
- issue: Kebersamaan dalam persekutuan yang Paulus harapkan dengan orang-orang percaya di Roma
  choice: mendapat kesegaran bersama-sama denganmu
  alternative: saling disegarkan bersamamu; beristirahat bersama denganmu
  rationale: Pilihan utama mempertahankan nuansa pengalaman bersama dalam συναναπαύσωμαι tanpa melebih-lebihkan unsur timbal balik yang mungkin tersirat. Paulus digambarkan bukan hanya melayani mereka, tetapi juga ikut menikmati kesegaran atau perhentian bersama mereka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Bentuk tunggal “-mu” dipakai karena bahasa Indonesia tidak membedakan penerima tunggal dan jamak pada pronomina ini; dalam konteks, yang dimaksud ialah jemaat di Roma.
