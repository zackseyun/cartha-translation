  text: ὃς παρεδόθη διὰ τὰ παραπτώματα ἡμῶν καὶ ἠγέρθη διὰ τὴν δικαίωσιν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/025.yaml
  text: who was handed over because of our trespasses and was raised for our justification[a][b].
translation:
  language: id
  text: yang diserahkan karena pelanggaran-pelanggaran kita dan dibangkitkan untuk pembenaran kita[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena pembenaran kita.”
    reason: alternative_reading
  - marker: b
    text: “Pembenaran” juga dapat diungkapkan sebagai “pembebasan dari kesalahan” atau “dinyatakan benar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεδόθη
  choice: diserahkan
  rationale: Bentuk pasif Yunani dipertahankan dan secara wajar dapat menyiratkan tindakan Allah tanpa menambahkan pelaku yang tidak disebutkan dalam teks.
- source_word: διὰ τὰ παραπτώματα ἡμῶν
  choice: karena pelanggaran-pelanggaran kita
  rationale: διά dengan akusatif pada klausa pertama paling alami menyatakan sebab; frasa ini mempertahankan hubungan langsung antara pelanggaran kita dan penyerahan Kristus.
- source_word: παραπτώματα
  choice: pelanggaran-pelanggaran
  rationale: Pilihan ini menyampaikan tindakan menyimpang atau melanggar secara moral dan mempertahankan bentuk jamak sumber, tanpa meratakannya menjadi istilah yang lebih umum, yaitu 'dosa'.
- source_word: ἠγέρθη
  choice: dibangkitkan
  rationale: Bentuk pasif sederhana mencerminkan teks Yunani dan merupakan ungkapan Indonesia yang lazim serta jelas bagi kebangkitan Kristus.
- source_word: διὰ τὴν δικαίωσιν ἡμῶν
  choice: untuk pembenaran kita
  rationale: Terjemahan utama memakai pengertian tujuan atau hasil yang sesuai dengan konteks, sementara kemungkinan pengertian sebab tetap dipertahankan dalam catatan kaki.
- source_word: δικαίωσιν
  choice: pembenaran
  rationale: Istilah ini mempertahankan daya hukum dan soteriologis δικαίωσις dalam pemikiran Paulus; catatan kaki memberi padanan yang lebih mudah dipahami.
theological_decisions:
- issue: Apakah διὰ τὴν δικαίωσιν ἡμῶν menyatakan tujuan/hasil atau sebab.
  choice: untuk pembenaran kita
  alternative: karena pembenaran kita
  rationale: Bacaan tujuan/hasil menyatakan bahwa kebangkitan Kristus berkaitan dengan terwujudnya pembenaran orang percaya. Namun, karena διά dengan akusatif juga memungkinkan arti sebab, bacaan itu dicatat sebagai alternatif dan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Klausa relatif diawali dengan 'yang' agar ayat ini tetap tersambung secara sintaksis dengan rujukan kepada Yesus dalam ayat sebelumnya. Bentuk pasif dan ambiguitas penting pada frasa kedua dipertahankan.
