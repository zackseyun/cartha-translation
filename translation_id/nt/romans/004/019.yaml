id: ROM.4.19
reference: Romans 4:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ μὴ ἀσθενήσας τῇ ⸀πίστει κατενόησεν τὸ ἑαυτοῦ ⸀σῶμα νενεκρωμένον, ἑκατονταετής που ὑπάρχων, καὶ τὴν νέκρωσιν τῆς μήτρας Σάρρας,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/019.yaml
  text: And without weakening in faith[b][a], he considered his own body as good as dead—since he was about a hundred years old—and the deadness of Sarah’s womb.
translation:
  language: id
  text: Tanpa menjadi lemah dalam imannya, ia mempertimbangkan tubuhnya sendiri, yang seolah-olah sudah mati karena ia kira-kira berusia seratus tahun,[a] dan rahim Sara yang sudah mati.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Menurut tradisi teks lain: “ia tidak mempertimbangkan tubuhnya sendiri yang sudah seperti mati.”'
    reason: textual_variant
  - marker: b
    text: 'Atau: “kemandulan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενήσας
  choice: menjadi lemah
  rationale: Bentuk partisip aoris ini menyatakan melemahnya iman; konstruksi negatif diterjemahkan secara alami sebagai “tanpa menjadi lemah”.
- source_word: πίστει
  choice: dalam iman
  rationale: Dalam konteks ini menunjuk pada kepercayaan Abraham kepada janji Allah.
- source_word: κατενόησεν
  choice: ia mempertimbangkan
  rationale: Menggambarkan perhatian mental yang sungguh-sungguh terhadap keadaan nyata, tanpa menyiratkan bahwa Abraham kehilangan iman.
- source_word: νενεκρωμένον
  choice: yang sudah seperti mati
  rationale: Partisip perfek menyatakan keadaan tubuh yang secara reproduktif tidak berdaya, bukan kematian jasmani secara harfiah.
- source_word: ἑκατονταετής που ὑπάρχων
  choice: karena usianya kira-kira seratus tahun
  rationale: πού memberi nuansa perkiraan, sedangkan frasa partisipial menjelaskan keadaan tubuh Abraham.
- source_word: νέκρωσιν
  choice: kematian
  rationale: Mempertahankan citra kematian dan kaitan leksikalnya dengan keadaan tubuh Abraham; alternatif yang lebih interpretatif ialah “kemandulan”.
- source_word: μήτρας Σάρρας
  choice: rahim Sara
  rationale: Ungkapan genitif ini diterjemahkan dengan susunan Indonesia yang alami sambil mempertahankan gambaran tubuh yang konkret.
theological_decisions:
- issue: Apakah citra kematian reproduktif perlu diperhalus menjadi istilah seperti “mandul” atau “kemandulan”
  choice: 'Mempertahankan bahasa kematian: “tubuhnya sendiri yang sudah seperti mati” dan “kematian rahim Sara”'
  alternative: “tubuhnya tidak lagi mampu menghasilkan keturunan” dan “kemandulan rahim Sara”
  rationale: Paulus sengaja memakai dua kata serumpun yang berkaitan dengan kematian untuk menekankan kemustahilan manusiawi yang dihadapi janji Allah.
- issue: Varian tekstual yang menentukan apakah Abraham mempertimbangkan atau tidak mempertimbangkan tubuhnya
  choice: 'Mengikuti teks utama SBLGNT: “ia mempertimbangkan tubuhnya sendiri”'
  alternative: 'Menurut tradisi teks lain: “ia tidak mempertimbangkan tubuhnya sendiri”'
  rationale: Teks yang diberikan memuat κατενόησεν tanpa negasi sebelum verba, tetapi varian penting perlu dicatat karena mengubah struktur pernyataan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. “Mempertimbangkan” mempertahankan gagasan bahwa Abraham menyadari keadaan jasmaninya secara realistis. Penanda catatan kaki ditempatkan pada akhir ayat agar tidak mengganggu alur kalimat; [a] mencatat varian tekstual dan [b] alternatif leksikal.
