id: ROM.4.6
reference: Romans 4:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καθάπερ καὶ Δαυὶδ λέγει τὸν μακαρισμὸν τοῦ ἀνθρώπου ᾧ ὁ θεὸς λογίζεται δικαιοσύνην χωρὶς ἔργων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/006.yaml
  text: Just as David also speaks of the blessedness of the man to whom God credits righteousness apart from works:[a][b][c]
translation:
  language: id
  text: Sama seperti Daud juga berbicara tentang kebahagiaan orang yang kepadanya Allah memperhitungkan kebenaran tanpa perbuatan-perbuatan:[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkat”; kata Yunani ini menunjuk pada keadaan atau pengakuan bahwa seseorang berbahagia.
    reason: lexical_alternative
  - marker: b
    text: Atau “menghitung” atau “mencatat” kebenaran kepada seseorang.
    reason: lexical_alternative
  - marker: c
    text: Atau “terlepas dari perbuatan-perbuatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ καὶ
  choice: Demikian juga
  rationale: Menghubungkan ayat ini dengan argumen sebelumnya dan menampilkan Daud sebagai saksi tambahan secara alami dalam bahasa Indonesia.
- source_word: λέγει τὸν μακαρισμόν
  choice: menyatakan betapa berbahagianya
  rationale: Ungkapan ini menyampaikan tindakan Daud mengucapkan kebahagiaan seseorang dengan lebih wajar daripada bentuk abstrak yang kaku.
- source_word: τοῦ ἀνθρώπου
  choice: orang
  rationale: Dalam konteks ini, bentuk tunggal Yunani bersifat representatif dan tidak membatasi rujukan hanya kepada laki-laki; 'orang' adalah padanan Indonesia yang alami.
- source_word: λογίζεται
  choice: diperhitungkan
  rationale: Mempertahankan metafora perhitungan dalam bentuk pasif yang sesuai dengan konstruksi relatif Yunani dan lazim dalam pembahasan Paulus.
- source_word: δικαιοσύνην
  choice: sebagai benar
  rationale: Dalam konstruksi λογίζεται δικαιοσύνην, ungkapan ini menyatakan status benar yang diperhitungkan Allah dengan bahasa Indonesia yang jelas; bentuk nomina 'kebenaran' tetap dicatat sebagai alternatif.
- source_word: χωρὶς ἔργων
  choice: terlepas dari perbuatan-perbuatan
  rationale: Menjaga kontras bahwa perhitungan Allah berlangsung tanpa menjadikan perbuatan sebagai dasar; bentuk jamak mencerminkan ἔργων.
theological_decisions:
- issue: Bahasa maskulin representatif pada ἀνθρώπου
  choice: orang
  alternative: laki-laki itu
  rationale: ἀνθρώπου dapat merujuk kepada manusia secara umum. Bahasa Indonesia tidak perlu memakai bentuk maskulin untuk mempertahankan jumlah tunggal dan makna representatifnya.
- issue: Makna δικαιοσύνην dalam konstruksi λογίζεται
  choice: diperhitungkan ... sebagai benar
  alternative: memperhitungkan kebenaran kepada ...
  rationale: Pilihan utama mempertahankan gagasan penetapan atau pengakuan status benar tanpa menentukan lebih jauh mekanisme teologisnya. Alternatif nominal dipertahankan dalam catatan.
- issue: Hubungan χωρὶς ἔργων dengan pembenaran
  choice: terlepas dari perbuatan-perbuatan
  alternative: tanpa perbuatan-perbuatan
  rationale: Terjemahan ini mempertahankan kontras Paulus dan tidak menambahkan jenis perbuatan tertentu yang tidak disebutkan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Susunan dibuat alami bagi pembaca umum, sambil mempertahankan metafora perhitungan, bentuk tunggal representatif, dan ketegangan teologis antara status benar dan perbuatan.
