revisions:
- from: Demikian juga, Daud menyatakan betapa berbahagianya orang yang diperhitungkan Allah sebagai benar terlepas dari perbuatan-perbuatan:[a][b][c]
  to: Sama seperti Daud juga berbicara tentang kebahagiaan orang yang kepadanya Allah memperhitungkan kebenaran tanpa perbuatan-perbuatan:[a][b][c]
  rationale: Revisi memulihkan daya banding καθάπερ καί melalui “Sama seperti ... juga,” mempertahankan “orang” sebagai rujukan tunggal representatif, dan menerjemahkan λογίζεται δικαιοσύνην dengan konstruksi yang tetap menampilkan Allah sebagai subjek, “kebenaran” sebagai objek, serta orang itu sebagai penerima. Catatan kaki diselaraskan dengan teks revisi dan hanya menawarkan alternatif leksikal yang tidak mengubah makna.
