  text: ἀλλὰ καὶ δι’ ἡμᾶς οἷς μέλλει λογίζεσθαι, τοῖς πιστεύουσιν ἐπὶ τὸν ἐγείραντα Ἰησοῦν τὸν κύριον ἡμῶν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/024.yaml
  text: but also for us[a], to whom it will be credited—to us who believe in the one who raised Jesus our Lord from the dead[b],
translation:
  language: id
  text: melainkan juga untuk kita[a], sebab hal itu akan diperhitungkan kepada kita yang percaya kepada Dia[b] yang telah membangkitkan Yesus, Tuhan kita, dari antara orang mati,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagi kita”.
    reason: lexical_alternative
  - marker: b
    text: Atau “menaruh kepercayaan kepada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: melainkan juga
  rationale: Mempertahankan daya pertentangan sekaligus penambahan, dengan menghubungkan ayat ini kepada pernyataan sebelumnya dan memperluas penerapannya kepada kita.
- source_word: δι’ ἡμᾶς
  choice: untuk kita
  rationale: Dalam konteks ini, διά dengan akusatif menyatakan bahwa perkataan tersebut ditulis dengan kita dalam pandangan.
- source_word: οἷς μέλλει λογίζεσθαι
  choice: yang kepadanya hal itu akan diperhitungkan
  rationale: Bentuk datif diterjemahkan dengan 'kepadanya', sedangkan μέλλει mempertahankan orientasi masa depan. 'Hal itu' mewakili objek yang tersirat dari konteks sebelumnya tanpa menambahkan 'kebenaran' secara eksplisit ke dalam ayat.
- source_word: λογίζεσθαι
  choice: diperhitungkan
  rationale: '''Diperhitungkan'' alami dalam bahasa Indonesia dan mempertahankan metafora penghitungan atau pencatatan yang penting dalam argumentasi Roma 4.'
- source_word: τοῖς πιστεύουσιν ἐπὶ
  choice: kita yang percaya kepada
  rationale: Konstruksi artikel-partisip menjelaskan siapa yang dimaksud dengan 'kita'; 'percaya kepada' menyatakan iman yang diarahkan kepada satu pribadi.
- source_word: τὸν ἐγείραντα
  choice: Dia yang telah membangkitkan
  rationale: Partisip berartikel diperlakukan secara substantival dan menunjuk kepada Allah melalui tindakan-Nya; kapitalisasi 'Dia' mengikuti kebiasaan bahasa Indonesia untuk rujukan ilahi.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: Yesus, Tuhan kita
  rationale: Nama ditransliterasikan menurut bentuk Indonesia yang lazim, dan κύριος diterjemahkan 'Tuhan' dalam konstruksi aposisional yang wajar.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Ungkapan ini mempertahankan gambaran kebangkitan keluar dari lingkungan mereka yang mati dan tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Objek tersirat dari λογίζεσθαι
  choice: Memakai 'hal itu' dalam frasa 'hal itu akan diperhitungkan'
  alternative: Memakai 'kebenaran akan diperhitungkan' atau membiarkan objek tanpa dinyatakan
  rationale: Bahasa Yunani membiarkan objeknya tersirat dari konteks sebelumnya, tempat kebenaran sedang dibahas. Bahasa Indonesia memerlukan subjek gramatikal yang lebih jelas bagi konstruksi pasif ini; 'hal itu' mempertahankan elipsis tanpa memasukkan kata 'kebenaran' secara eksplisit.
- issue: Nuansa πιστεύω ἐπί
  choice: percaya kepada
  alternative: menaruh kepercayaan kepada
  rationale: '''Percaya kepada'' merupakan ungkapan Indonesia yang alami dan tetap memuat arah iman kepada pribadi yang membangkitkan Yesus; alternatif menonjolkan unsur kepercayaan tetapi lebih interpretatif.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan kesinambungan dengan ayat sebelumnya karena teks sumber merupakan bagian dari satu kalimat yang lebih panjang. Istilah 'diperhitungkan' dipilih untuk menjaga metafora akuntansi Paulus tanpa terdengar kuno.
