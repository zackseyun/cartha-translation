  text: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ οὐ διεκρίθη τῇ ἀπιστίᾳ ἀλλὰ ἐνεδυναμώθη τῇ πίστει, δοὺς δόξαν τῷ θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/020.yaml
  text: Yet regarding the promise of God[a], he did not waver in unbelief, but was strengthened in faith[b], giving glory to God.
translation:
  language: id
  text: Namun, terhadap janji Allah ia tidak bimbang oleh ketidakpercayaan, melainkan dikuatkan dalam iman,[a] sambil memuliakan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dikuatkan oleh iman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ
  choice: Namun, mengenai janji Allah
  rationale: εἰς dengan akusatif berfungsi secara referensial, yaitu 'mengenai', sedangkan δέ menandai kontras ringan dengan konteks sebelumnya.
- source_word: οὐ διεκρίθη τῇ ἀπιστίᾳ
  choice: ia tidak bimbang karena ketidakpercayaan
  rationale: διεκρίθη dalam konteks ini menunjuk pada kebimbangan atau kegoyahan batin. Dativus τῇ ἀπιστίᾳ dapat menyatakan sebab atau sarana; 'karena ketidakpercayaan' alami dalam bahasa Indonesia tanpa mempersempit maknanya menjadi keraguan intelektual semata.
- source_word: ἀλλὰ ἐνεδυναμώθη τῇ πίστει
  choice: melainkan dikuatkan dalam iman
  rationale: Bentuk pasif ἐνεδυναμώθη dipertahankan dengan 'dikuatkan'. 'Dalam iman' mempertahankan kemungkinan dativus sebagai ranah keadaan dan tidak memaksakan iman sebagai sarana.
- source_word: δοὺς δόξαν τῷ θεῷ
  choice: sambil memuliakan Allah
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan tindakan memberi kemuliaan kepada Allah dan mempertahankan hubungan partisipial sebagai tindakan yang menyertai.
theological_decisions:
- issue: Apakah respons Abraham dinyatakan sebagai keraguan kognitif atau kebimbangan yang lebih luas
  choice: tidak bimbang karena ketidakpercayaan
  alternative: tidak ragu oleh ketidakpercayaan
  rationale: '''Bimbang'' mencerminkan kegoyahan yang lebih luas dalam διακρίνω dan menjaga kontras dengan dikuatkan dalam iman tanpa membatasi makna pada proses intelektual.'
- issue: Fungsi dativus τῇ πίστει
  choice: dikuatkan dalam iman
  alternative: dikuatkan oleh iman
  rationale: Dativus dapat dipahami sebagai ranah atau sarana. Teks utama memakai 'dalam iman' untuk mempertahankan kesejajaran konseptual, sedangkan kemungkinan instrumental dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. 'Namun' menyatakan kontras ringan; 'melainkan' memperjelas pertentangan οὐ ... ἀλλά. Penanda catatan kaki ditempatkan langsung setelah frasa yang diterangkan.
