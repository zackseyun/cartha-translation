  text: ὁ γὰρ νόμος ὀργὴν κατεργάζεται, οὗ ⸀δὲ οὐκ ἔστιν νόμος, οὐδὲ παράβασις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/015.yaml
  text: For the law produces wrath[a], but where there is no law[b], neither is there transgression.
translation:
  language: id
  text: Sebab hukum menghasilkan murka,[a] tetapi di mana tidak ada hukum, tidak ada pula pelanggaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "Taurat menghasilkan murka."
    reason: Kemungkinan νόμος di sini secara khusus menunjuk kepada Hukum Musa, meskipun istilah Yunani itu juga dapat menyatakan hukum secara lebih umum.
lexical_decisions:
- source_word: νόμος
  choice: hukum
  rationale: Dipilih tanpa pembatasan eksplisit pada Hukum Musa agar cakupan istilah Paulus tetap terbuka, sementara konteks Taurat tetap dapat terdengar.
- source_word: ὀργή
  choice: murka
  rationale: Kata 'murka' mempertahankan bobot yudisial dan teologis istilah ini dalam pemakaian Paulus, lebih kuat daripada sekadar 'kemarahan'.
- source_word: κατεργάζεται
  choice: menghasilkan
  rationale: Ungkapan ini alami dalam bahasa Indonesia modern dan menyampaikan daya kausatif verba Yunani tersebut.
- source_word: οὗ δὲ
  choice: tetapi di mana
  rationale: Terjemahan ini mempertahankan konstruksi lokatif sekaligus nuansa kontras ringan dari δέ.
- source_word: παράβασις
  choice: pelanggaran
  rationale: Kata ini menyatakan tindakan melanggar batas atau ketetapan yang telah ditentukan, sesuai dengan hubungan antara hukum dan pelanggaran dalam ayat ini.
theological_decisions:
- issue: Cakupan νόμος dalam argumen Paulus
  choice: hukum
  alternative: Taurat
  rationale: Terjemahan utama mempertahankan prinsip umum yang dinyatakan Paulus dan tidak mempersempitnya secara prematur hanya kepada Hukum Musa; kemungkinan rujukan khusus kepada Taurat dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur sebab-kontras teks Yunani dipertahankan. Pengulangan 'hukum' dipilih demi kejelasan dan kesetiaan, sedangkan 'tidak ada pula' secara alami menyampaikan οὐδὲ.
