  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ γὰρ οἱ ἐκ νόμου κληρονόμοι, κεκένωται ἡ πίστις καὶ κατήργηται ἡ ἐπαγγελία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/014.yaml
  text: For if those who are of the law are heirs[c][b][a], faith has been emptied and the promise has been nullified.
translation:
  language: id
  text: Sebab, jika mereka yang terkait dengan hukum Taurat adalah ahli waris, iman telah dikosongkan dan janji itu telah dibuat tidak berlaku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “janji itu telah dibuat tidak berdaya” atau “dibatalkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ νόμου
  choice: mereka yang berasal dari hukum Taurat
  rationale: Mempertahankan ungkapan Paulus tentang orang-orang yang ditentukan oleh hubungan mereka dengan hukum Taurat, tanpa mempersempit maknanya menjadi sekadar orang yang menaatinya.
- source_word: κληρονόμοι
  choice: ahli waris
  rationale: Padanan baku dan alami dalam konteks warisan serta janji perjanjian.
- source_word: κεκένωται
  choice: telah dikosongkan
  rationale: 'Mempertahankan metafora verba Yunani dan nuansa aspek perfektif: iman menjadi kosong atau kehilangan daya gunanya.'
- source_word: πίστις
  choice: iman
  rationale: Dalam alur Roma 4, istilah ini berlawanan dengan hukum Taurat sebagai dasar penerimaan warisan; 'iman' adalah padanan Indonesia yang paling jelas dan mapan.
- source_word: κατήργηται
  choice: telah dibuat tidak berlaku
  rationale: Menyampaikan bahwa janji itu dijadikan tidak efektif atau tidak sah, tanpa menyiratkan pemusnahan.
- source_word: ἡ ἐπαγγελία
  choice: janji itu
  rationale: Artikel tertentu dipertahankan karena Paulus merujuk kepada janji khusus yang sedang dibahas.
theological_decisions:
- issue: Makna πίστις dalam pertentangan Paulus antara iman dan hukum Taurat
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Konteks membahas warisan yang diterima melalui iman, bukan berdasarkan hukum Taurat. 'Iman' mempertahankan alur argumen tanpa menetapkan secara berlebihan apakah tekanannya terletak pada tindakan percaya atau kesetiaan.
- issue: Identitas οἱ ἐκ νόμου
  choice: mereka yang berasal dari hukum Taurat
  alternative: mereka yang hidup berdasarkan hukum Taurat; mereka yang termasuk golongan hukum Taurat
  rationale: Pilihan utama mempertahankan kekompakan dan keluasan ungkapan sumber, tanpa membatasinya hanya pada ketaatan hukum atau identitas etnis tertentu.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Istilah 'hukum Taurat' dipakai untuk νόμος agar rujukan kepada Taurat jelas bagi pembaca umum; bentuk perfektif kedua verba dipertahankan dengan 'telah'.
