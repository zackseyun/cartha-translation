id: ROM.4.9
reference: Romans 4:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁ μακαρισμὸς οὖν οὗτος ἐπὶ τὴν περιτομὴν ἢ καὶ ἐπὶ τὴν ἀκροβυστίαν; λέγομεν ⸀γάρ· Ἐλογίσθη τῷ Ἀβραὰμ ἡ πίστις εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/009.yaml
  text: Is this blessing[a], then, for the circumcised, or also for the uncircumcised? For we say, “Faith was counted to Abraham as righteousness.”
translation:
  language: id
  text: Jadi, apakah berkat ini bagi orang-orang bersunat, atau juga bagi orang-orang tidak bersunat? Sebab kita berkata, “Iman Abraham diperhitungkan sebagai kebenaran[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρισμός
  choice: berkat
  rationale: Dalam konteks ini kata tersebut merujuk kembali pada keadaan berbahagia yang dinyatakan dalam Roma 4:6–8; “berkat” alami dan jelas dalam bahasa Indonesia modern.
- source_word: περιτομή
  choice: orang-orang bersunat
  rationale: Walaupun secara harfiah berarti “sunat,” nomina ini dipakai secara metonimis untuk kelompok yang bersunat.
- source_word: ἀκροβυστία
  choice: orang-orang tidak bersunat
  rationale: Nomina ini secara metonimis menunjuk kelompok yang tidak bersunat dan membentuk kontras yang jelas dengan orang-orang bersunat.
- source_word: πίστις
  choice: iman
  rationale: “Iman” merupakan padanan baku dan tepat dalam konteks kutipan tentang Abraham ini.
- source_word: ἐλογίσθη
  choice: diperhitungkan
  rationale: Pilihan ini mempertahankan gambaran penilaian atau pembukuan dalam λογίζομαι sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: δικαιοσύνη
  choice: kebenaran
  rationale: “Kebenaran” adalah padanan teologis yang lazim untuk δικαιοσύνη dalam pembahasan Paulus tentang kedudukan benar di hadapan Allah; alternatif “keadilan” dicatat dalam catatan kaki.
- source_word: εἰς δικαιοσύνην
  choice: sebagai kebenaran
  rationale: Ungkapan ini menyampaikan bahwa iman Abraham diperhitungkan dalam hubungan dengan kebenaran tanpa menambahkan penjelasan doktrinal yang tidak dinyatakan dalam ayat.
theological_decisions:
- issue: Hubungan antara iman Abraham dan kebenaran
  choice: Iman Abraham diperhitungkan sebagai kebenaran.
  alternative: Iman diperhitungkan kepada Abraham untuk memperoleh kebenaran.
  rationale: Susunan terpilih mempertahankan ketegangan dalam ungkapan Paulus dan tidak memperluasnya menjadi rumusan teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk kelompok dibuat eksplisit agar metonimi Yunani mudah dipahami, sedangkan kutipan tetap ringkas dan mempertahankan ambiguitas teologis sumber.
