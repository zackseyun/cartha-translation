  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ πατέρα περιτομῆς τοῖς οὐκ ἐκ περιτομῆς μόνον ἀλλὰ καὶ τοῖς στοιχοῦσιν τοῖς ἴχνεσιν τῆς ⸂ἐν ἀκροβυστίᾳ πίστεως⸃ τοῦ πατρὸς ἡμῶν Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/012.yaml
  text: and the father of circumcision to those who are not merely circumcised[d][c][b][a], but who also walk in the footsteps of the faith that our father Abraham had while uncircumcised.
translation:
  language: id
  text: dan juga menjadi bapa bagi orang-orang bersunat, yaitu mereka yang bukan sekadar bersunat, melainkan juga mengikuti jejak iman bapa kita Abraham ketika ia belum bersunat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατέρα περιτομῆς
  choice: bapa bagi orang-orang bersunat
  rationale: Genitif ini secara harfiah dapat diterjemahkan 'bapa sunat', tetapi konteks menunjukkan bahwa yang dimaksud ialah Abraham sebagai bapa bagi kelompok orang bersunat. Bentuk ini lebih alami dalam bahasa Indonesia dan tidak membuat Abraham terdengar sebagai bapa dari suatu upacara.
- source_word: οὐκ ἐκ περιτομῆς μόνον
  choice: yang bukan hanya bersunat
  rationale: 'Ungkapan harfiahnya, ''bukan dari sunat saja'', kurang alami dalam bahasa Indonesia. Terjemahan ini mempertahankan pembatasan Paulus: sunat lahiriah saja tidak cukup.'
- source_word: στοιχοῦσιν τοῖς ἴχνεσιν
  choice: mengikuti jejak
  rationale: στοιχέω menyatakan berjalan atau hidup selaras dengan suatu pola, sedangkan ἴχνη berarti jejak kaki. 'Mengikuti jejak' mempertahankan gambaran tersebut secara alami.
- source_word: πίστεως
  choice: iman
  rationale: Dalam konteks argumen tentang Abraham yang percaya kepada Allah, 'iman' merupakan padanan baku dan tepat bagi πίστις.
- source_word: ἐν ἀκροβυστίᾳ
  choice: ketika ia belum bersunat
  rationale: Frasa ini menunjuk pada keadaan Abraham saat beriman sebelum disunat. Ungkapan temporal ini jelas dan idiomatis dalam bahasa Indonesia.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: yang dimiliki Abraham, bapa kita
  rationale: Genitif Yunani diuraikan agar hubungan iman tersebut jelas, sementara sebutan komunal 'bapa kita' tetap dipertahankan.
theological_decisions:
- issue: Apakah Abraham disebut bapa bagi semua orang bersunat tanpa syarat atau hanya bagi mereka yang juga mengikuti imannya
  choice: Abraham adalah bapa bagi orang-orang bersunat yang juga mengikuti jejak imannya.
  alternative: Abraham adalah bapa bagi semua orang bersunat tanpa pembatasan.
  rationale: 'Konstruksi ''bukan hanya ... tetapi juga'' membatasi kelompok itu: mereka bukan sekadar bersunat, melainkan juga mengikuti jejak iman Abraham. Terjemahan mempertahankan pembatasan ini tanpa menambahkan tafsiran denominasi.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat ini melanjutkan struktur ayat sebelumnya, sebagaimana ditandai oleh καί pada awal teks. 'Mengikuti jejak iman' mempertahankan metafora Yunani dengan ungkapan yang mudah dipahami.
