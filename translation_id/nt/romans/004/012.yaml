  naturalness: “Bukan sekadar bersunat, melainkan juga mengikuti jejak ...” adalah konstruksi baku dan alami dalam bahasa Indonesia modern. Letak “bapa kita Abraham” sebelum keterangan temporal juga membuat rujukan “ia” jelas.
