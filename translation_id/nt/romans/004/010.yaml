  text: πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ’ ἐν ἀκροβυστίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/010.yaml
  text: How then was it counted? While he was circumcised[a], or uncircumcised? Not while circumcised, but while uncircumcised.
translation:
  language: id
  text: Jadi, bagaimana hal itu diperhitungkan[a] kepadanya? Ketika ia sudah disunat atau ketika ia belum disunat? Bukan ketika ia sudah disunat, melainkan ketika ia belum disunat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dianggap” atau “dikreditkan” sebagai terjemahan alternatif bagi “diperhitungkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν
  choice: Jadi, bagaimana
  rationale: Ungkapan ini mempertahankan daya inferensial οὖν dan bentuk pertanyaan πῶς secara alami dalam alur argumentasi Paulus.
- source_word: ἐλογίσθη
  choice: diperhitungkan kepadanya
  rationale: Bentuk pasif λογίζομαι dalam konteks Roma 4 menyatakan bahwa sesuatu diperhitungkan kepada Abraham. Penambahan 'kepadanya' memperjelas rujukan implisit dalam bahasa Indonesia tanpa menentukan secara berlebihan apa yang diperhitungkan.
- source_word: ἐν περιτομῇ ὄντι
  choice: ketika ia sudah disunat
  rationale: Frasa harfiah 'berada dalam keadaan bersunat' secara idiomatis menyatakan keadaan atau waktu ketika Abraham telah disunat.
- source_word: ἐν ἀκροβυστίᾳ
  choice: ketika ia belum disunat
  rationale: Dalam konteks ini ἀκροβυστία menunjuk pada keadaan belum disunat; bentuk ini alami dalam bahasa Indonesia dan menjaga kontras waktunya.
- source_word: οὐκ ... ἀλλ’
  choice: Bukan ... melainkan ...
  rationale: Konstruksi ini menyampaikan penyangkalan dan koreksi yang tegas sebagaimana dalam bahasa Yunani.
theological_decisions: []
