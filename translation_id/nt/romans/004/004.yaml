  text: τῷ δὲ ἐργαζομένῳ ὁ μισθὸς οὐ λογίζεται κατὰ χάριν ἀλλὰ κατὰ ὀφείλημα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/004.yaml
  text: To the one who works[a], the wages are not credited as a gift[b], but as an obligation.
translation:
  language: id
  text: Bagi orang yang bekerja, upahnya tidak dikreditkan kepadanya sebagai pemberian[a], melainkan sebagai yang terutang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “berdasarkan anugerah.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “sebagai utang” atau “sebagai sesuatu yang wajib dibayarkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργαζομένῳ
  choice: orang yang bekerja
  rationale: Partisipel kini berartikel ini berfungsi sebagai nomina dan secara umum menunjuk kepada orang yang bekerja; ungkapan ini alami dalam bahasa Indonesia serta mempertahankan sifat umumnya.
- source_word: μισθὸς
  choice: upah
  rationale: Dalam konteks kerja dan pembayaran, 'upah' dengan tepat menyatakan imbalan yang diperoleh karena bekerja.
- source_word: λογίζεται
  choice: diperhitungkan
  rationale: Kata ini mempertahankan metafora pembukuan atau perhitungan Paulus dan sesuai dengan bentuk pasif tunggal dalam konteks.
- source_word: κατὰ χάριν
  choice: sebagai pemberian
  rationale: Dalam pertentangan dengan upah yang menjadi hak pekerja, frasa ini menyatakan bahwa pembayaran itu tidak diperhitungkan atas dasar kemurahan yang tidak wajib diberikan. 'Sebagai pemberian' menyampaikan maksud kontekstualnya dengan jelas, sementara alternatif yang lebih harfiah dicatat.
- source_word: ὀφείλημα
  choice: sesuatu yang wajib dibayarkan
  rationale: Nomina ini menunjuk kepada sesuatu yang terutang atau wajib diberikan. Pilihan ini alami dalam konteks upah dan mempertahankan kontras dengan pemberian.
- source_word: δὲ
  choice: tidak dinyatakan secara tersendiri
  rationale: δέ menghubungkan dan membedakan pernyataan ini dari ayat sebelumnya. Dalam bahasa Indonesia, hubungan itu sudah jelas dari kesinambungan argumen dan konstruksi 'melainkan', sehingga penambahan 'sekarang' atau penanda temporal lain akan menyesatkan.
theological_decisions:
- issue: Makna χάρις dalam pertentangan antara pemberian dan upah
  choice: sebagai pemberian
  alternative: berdasarkan anugerah
  rationale: Konteks menekankan perbedaan antara pemberian yang tidak wajib dan upah yang terutang. Pilihan utama menjelaskan pertentangan ekonomis itu tanpa menyangkal cakupan teologis χάρις sebagai anugerah.
- issue: Makna ὀφείλημα sebagai dasar pembayaran
  choice: sesuatu yang wajib dibayarkan
  alternative: utang; apa yang terutang
  rationale: Terjemahan ini tidak mempersempit istilah menjadi utang finansial semata, tetapi tetap menyatakan bahwa upah merupakan kewajiban kepada pekerja.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan metafora upah dan perhitungan, dengan penjelasan alami untuk ὀφείλημα. Semua penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskan.
