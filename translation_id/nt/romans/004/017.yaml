  naturalness: Teks revisi memakai bahasa Indonesia baku dan alami. "Bapak bagi banyak bangsa" lebih lancar daripada "bapak banyak bangsa", dan "Allah yang kepada-Nya ia percaya" menghindari kemungkinan ambiguitas pada "Allah yang dipercayainya".
