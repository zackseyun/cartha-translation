  rationale: Revisi ini memperjelas bahwa iman Abraham tertuju kepada Allah, memperbaiki kelancaran idiom Indonesia, dan menyelaraskan jangkar catatan kaki dengan unsur teks yang dijelaskannya. Terjemahan utama tetap dekat dengan Yunani dan tidak menyelesaikan secara berlebihan makna teologis klausa terakhir.
