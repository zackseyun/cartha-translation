id: ROM.4.17
reference: Romans 4:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Πατέρα πολλῶν ἐθνῶν τέθεικά σε), κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/017.yaml
  text: as it is written[a], "I have made you the father of many nations"—in the presence of the God in whom he believed[b], who gives life to the dead and calls the things that are not as though they were.
translation:
  language: id
  text: Sebagaimana tertulis, “Aku telah menjadikan engkau bapak bagi banyak bangsa[a]”—di hadapan Allah yang kepada-Nya ia percaya, yang menghidupkan orang mati dan memanggil apa yang tidak ada seolah-olah ada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “bangsa” di sini juga dapat dipahami sebagai “bangsa-bangsa bukan Yahudi”, tetapi dalam kutipan dari Kejadian ini makna yang lebih luas lebih mungkin.
    reason: lexical_alternative
  - marker: b
    text: Atau, dengan terjemahan yang lebih interpretatif, “memanggil menjadi ada apa yang tidak ada.”
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: Sebagaimana tertulis
  rationale: Ungkapan baku untuk memperkenalkan kutipan Kitab Suci; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya perfektif bahwa hal itu telah tertulis dan tetap berlaku.
- source_word: Πατέρα πολλῶν ἐθνῶν
  choice: bapak banyak bangsa
  rationale: Dalam kutipan Kejadian ini, ἐθνῶν terutama menunjuk kepada banyak bangsa atau kelompok bangsa secara luas, bukan khusus orang bukan Yahudi sebagai lawan orang Yahudi.
- source_word: τέθεικά σε
  choice: Aku telah menjadikan engkau
  rationale: Bentuk perfektum diterjemahkan dengan 'telah menjadikan' untuk menyampaikan tindakan Allah beserta hasilnya yang tetap berlaku; pilihan ini juga sesuai dengan bahasa janji yang dikutip.
- source_word: κατέναντι
  choice: di hadapan
  rationale: Mempertahankan makna relasional-spasial kata Yunani dan hubungan ungkapan ini dengan Allah sebagai pihak yang di hadapan-Nya janji tersebut berlaku.
- source_word: οὗ ἐπίστευσεν
  choice: Allah yang dipercayainya
  rationale: Menyampaikan bahwa iman Abraham tertuju kepada Allah tanpa menambahkan nama Abraham yang tidak muncul secara eksplisit dalam ayat ini.
- source_word: ζῳοποιοῦντος τοὺς νεκρούς
  choice: yang menghidupkan orang mati
  rationale: Ungkapan ini alami, ringkas, dan mempertahankan gambaran Allah sebagai Dia yang memberi kehidupan kepada orang mati.
- source_word: καλοῦντος
  choice: memanggil
  rationale: Makna dasar 'memanggil' dipertahankan agar ungkapan Yunani yang padat tidak langsung ditafsirkan secara eksplisit sebagai penciptaan dari ketiadaan.
- source_word: τὰ μὴ ὄντα ὡς ὄντα
  choice: apa yang tidak ada seolah-olah ada
  rationale: Terjemahan dekat dengan susunan Yunani ini mempertahankan keterbukaan makna dan ketegangan teologisnya; penafsiran yang lebih eksplisit dicantumkan dalam catatan kaki.
theological_decisions:
- issue: Apakah klausa terakhir harus diterjemahkan secara tegas sebagai penciptaan dari ketiadaan atau dibiarkan lebih luas dan dekat dengan teks Yunani.
  choice: memanggil apa yang tidak ada seolah-olah ada
  alternative: memanggil menjadi ada apa yang tidak ada
  rationale: Bahasa Yunani dapat menyiratkan kuasa kreatif Allah, tetapi ungkapannya sendiri padat dan tidak secara eksplisit memakai kata 'menciptakan'. Teks utama mempertahankan ketegangan ini, sedangkan penafsiran yang lebih eksplisit diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang wajar dan bermartabat. Susunan kalimat mempertahankan hubungan sintaksis ayat dengan konteks sebelumnya, termasuk frasa “di hadapan Allah”, tanpa menambahkan penjelasan yang tidak tersurat dalam teks sumber.
