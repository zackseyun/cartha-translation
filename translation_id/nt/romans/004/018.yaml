  text: ὃς παρ’ ἐλπίδα ἐπ’ ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· Οὕτως ἔσται τὸ σπέρμα σου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/018.yaml
  text: 'who[a], against hope, believed in hope, so that he might become the father of many nations[c][b], according to what had been spoken: “So shall your offspring be.”'
translation:
  language: id
  text: 'Abraham, sekalipun bertentangan dengan harapan,[a] percaya dengan harapan, supaya ia menjadi bapak banyak bangsa,[b] sesuai dengan apa yang telah dikatakan: “Demikianlah keturunanmu kelak.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “melampaui harapan” atau “berlawanan dengan harapan.”'
    reason: lexical_alternative
  - marker: b
    text: Bandingkan Kejadian 17:5.
    reason: cross_reference
  - marker: c
    text: 'Dikutip dari Kejadian 15:5. Secara harfiah: “Demikianlah keturunanmu akan menjadi”; dalam konteksnya, perbandingan ini menunjuk kepada bintang-bintang yang diperlihatkan kepada Abraham.'
    reason: cross_reference_and_translation_clarity
lexical_decisions:
- source_word: παρ’ ἐλπίδα
  choice: sekalipun tidak ada dasar untuk berharap
  rationale: Frasa παρά dengan akusatif menyatakan keadaan yang berlawanan dengan harapan yang secara manusiawi masuk akal. Rumusan ini mempertahankan daya paradoksnya dalam bahasa Indonesia yang alami.
- source_word: ἐπ’ ἐλπίδι
  choice: tetap percaya dengan penuh harapan
  rationale: Frasa ini dikaitkan dengan ἐπίστευσεν dan dibuat berkontras dengan παρ’ ἐλπίδα. Kata 'tetap' menandai kontras secara wajar, sedangkan 'dengan penuh harapan' mempertahankan unsur ἐλπίς tanpa menyamakan iman dan harapan.
- source_word: ἐπίστευσεν
  choice: percaya
  rationale: Padanan langsung dan alami bagi πιστεύω ini mempertahankan kosakata iman Paulus tanpa tambahan penafsiran.
- source_word: εἰς τὸ γενέσθαι αὐτὸν
  choice: supaya ia menjadi
  rationale: Konstruksi εἰς τό dengan infinitif dapat menyatakan tujuan atau hasil. 'Supaya' mempertahankan arah prospektifnya tanpa menentukan secara kaku apakah nuansa tujuan atau hasil yang dominan.
- source_word: πατέρα πολλῶν ἐθνῶν
  choice: bapak banyak bangsa
  rationale: '''Bangsa'' mempertahankan latar janji kepada Abraham dan tidak mempersempit ἔθνη menjadi bangsa-bangsa bukan Yahudi. ''Bapak'' dipakai dalam pengertian asal-usul dan peran perjanjian.'
- source_word: κατὰ τὸ εἰρημένον
  choice: sesuai dengan firman yang telah diucapkan
  rationale: Bentuk partisipel perfek pasif menunjuk pada ucapan terdahulu yang tetap berlaku. 'Firman' memberi nada kutipan ilahi yang sesuai konteks, sementara 'telah diucapkan' mempertahankan aspek terdahulunya.
- source_word: Οὕτως ἔσται τὸ σπέρμα σου
  choice: Demikianlah banyaknya keturunanmu kelak
  rationale: Dalam konteks Kejadian 15:5, οὕτως merujuk pada jumlah bintang yang baru diperlihatkan kepada Abraham. Rumusan Indonesia ini menyampaikan maksud perbandingan tersebut secara alami; 'keturunan' mempertahankan arti kolektif σπέρμα.
theological_decisions:
- issue: Cakupan 'banyak bangsa' dalam janji Abraham
  choice: Menerjemahkan ἐθνῶν sebagai 'bangsa', bukan 'bangsa-bangsa bukan Yahudi'.
  alternative: '''bangsa-bangsa bukan Yahudi'' atau ''suku-suku bangsa'''
  rationale: Ayat ini menggemakan janji dalam Kejadian mengenai Abraham sebagai bapak banyak bangsa. Padanan 'bangsa' menjaga cakupan tersebut dan tidak memasukkan kontras Yahudi-bukan Yahudi secara prematur.
- issue: Hubungan iman Abraham dengan penggenapan janji
  choice: Mempertahankan 'supaya ia menjadi' sebagai ungkapan prospektif.
  alternative: '''dan sebagai hasilnya ia menjadi'''
  rationale: Konstruksi Yunani dapat memuat nuansa tujuan maupun hasil. Terjemahan tidak boleh menutup ambiguitas itu dengan menyatakannya semata-mata sebagai akibat kausal dari tindakan Abraham.
- issue: Makna kolektif σπέρμα
  choice: Menggunakan 'keturunan' dalam bentuk kolektif.
  alternative: '''benihmu'''
  rationale: '''Keturunan'' alami dalam bahasa Indonesia dan tetap dapat berfungsi sebagai nomina kolektif, tanpa menentukan satu individu atau banyak individu secara eksplisit.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kontras retoris antara tiadanya dasar manusiawi untuk berharap dan tindakan Abraham yang tetap percaya dipertahankan. Kutipan Perjanjian Lama dibuat alami tanpa gaya arkais. Semua penanda catatan kaki ditempatkan dalam teks utama.
