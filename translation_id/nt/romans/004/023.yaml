id: ROM.4.23
reference: Romans 4:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐκ ἐγράφη δὲ δι’ αὐτὸν μόνον ὅτι ἐλογίσθη αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/023.yaml
  text: It was not written for his sake alone that it was credited to him,[a]
translation:
  language: id
  text: Namun, perkataan bahwa hal itu diperhitungkan kepadanya tidak ditulis hanya untuk kepentingannya,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dianggap” atau “dicatat” kepadanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγράφη
  choice: ditulis
  rationale: Bentuk pasif ini secara langsung mempertahankan rujukan kepada teks Kitab Suci yang tertulis dan terdengar wajar dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai peralihan dengan nuansa kontras terhadap penerapan yang hanya terbatas pada Abraham; 'Namun' menyampaikan hubungan itu secara alami.
- source_word: δι’ αὐτὸν μόνον
  choice: hanya untuk kepentingannya
  rationale: Ungkapan ini mempertahankan arti bahwa perkataan tersebut tidak ditulis hanya dengan Abraham sebagai pihak yang dituju atau memperoleh manfaat, tanpa menyiratkan sebab.
- source_word: ὅτι
  choice: bahwa
  rationale: Konjungsi ini memperkenalkan isi perkataan yang ditulis.
- source_word: ἐλογίσθη
  choice: diperhitungkan
  rationale: '''Diperhitungkan'' mempertahankan metafora pencatatan atau penghitungan dalam λογίζομαι serta cocok dengan konteks argumentasi Paulus tanpa menetapkan penafsiran teologis yang lebih sempit.'
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Bentuk datif paling alami disampaikan dengan 'kepadanya' bersama verba pasif 'diperhitungkan'.
theological_decisions:
- issue: Makna λογίζομαι dalam konteks pembenaran Paulus
  choice: diperhitungkan
  alternative: dianggap; dicatat
  rationale: '''Diperhitungkan'' menjaga citra penghitungan/pencatatan dan ketegangan teologis teks tanpa menambahkan istilah dogmatis yang tidak dinyatakan langsung.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat didahului 'perkataan bahwa hal itu diperhitungkan kepadanya' agar anak kalimat isi ὅτι tetap jelas dan kalimat Indonesia tidak terasa janggal. 'Hal itu' mempertahankan rujukan tersirat dari bentuk verbal tanpa memasukkan kata 'kebenaran' yang tidak muncul dalam ayat ini.
