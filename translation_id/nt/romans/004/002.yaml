  text: For if Abraham was justified by works[b][a], he has a boast—but not before God.
translation:
  language: id
  text: Sebab jika Abraham dibenarkan[a] berdasarkan perbuatan, ia mempunyai alasan untuk bermegah[b]—tetapi tidak di hadapan Allah.
  philosophy: optimal-equivalence
  footnotes:
