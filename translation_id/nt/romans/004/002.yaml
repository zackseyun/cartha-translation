    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Sebab, jika
  rationale: 'Mempertahankan alur argumentasi Paulus: γάρ menghubungkan ayat ini dengan pernyataan sebelumnya, sedangkan εἰ memperkenalkan suatu syarat tanpa menentukan terlebih dahulu apakah syarat itu benar.'
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Mengikuti bentuk nama yang baku dalam bahasa Indonesia.
- source_word: ἐξ ἔργων
  choice: berdasarkan perbuatan-perbuatannya
  rationale: ἐκ menyatakan dasar atau landasan, dan bentuk jamak ἔργων dipertahankan. Pronomina posesif membuat hubungan dengan Abraham jelas dan alami dalam bahasa Indonesia tanpa mengubah makna.
- source_word: ἐδικαιώθη
  choice: dibenarkan
  rationale: Padanan pasif yang ringkas dan lazim untuk δικαιόω dalam surat Paulus; alternatif deklaratif dijelaskan dalam catatan kaki.
- source_word: ἔχει καύχημα
  choice: ia mempunyai alasan untuk bermegah
  rationale: Dalam konteks ini καύχημα dapat menunjuk pada dasar atau alasan untuk bermegah. Ungkapan ini lebih alami daripada terjemahan nominal harfiah 'mempunyai kemegahan'.
- source_word: ἀλλ’ οὐ πρὸς θεόν
  choice: tetapi tidak di hadapan Allah
  rationale: Ungkapan 'di hadapan Allah' secara alami menyampaikan orientasi πρὸς θεόν sebagai penilaian atau kedudukan terhadap Allah.
theological_decisions:
- issue: Apakah syarat itu harus dinyatakan sebagai kenyataan atau sebagai pengandaian yang tidak nyata
  choice: Diterjemahkan langsung, 'jika Abraham dibenarkan berdasarkan perbuatan-perbuatannya,' tanpa penjelas tambahan.
  alternative: Jika Abraham memang dibenarkan berdasarkan perbuatan-perbuatannya; seandainya Abraham dibenarkan berdasarkan perbuatan-perbuatannya.
  rationale: Bentuk Yunani memperkenalkan premis bersyarat. Kesimpulan teologis dari konteks yang lebih luas tidak dimasukkan ke dalam bentuk syarat itu sendiri.
- issue: Nuansa forensik ἐδικαιώθη
  choice: dibenarkan
  alternative: dinyatakan benar
  rationale: Kata 'dibenarkan' mempertahankan istilah teologis Paulus secara ringkas, sementara kemungkinan nuansa deklaratif tetap tersedia dalam catatan kaki agar teks utama tidak mempersempit rentang maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan bentuk argumentatif yang padat, sementara 'alasan untuk bermegah' dipilih agar alami bagi pembaca umum. Semua penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskan.
