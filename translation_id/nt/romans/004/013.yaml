  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν ⸀εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/013.yaml
  text: For the promise to Abraham or to his offspring that he would be heir of the world was not through the law[d][c][b][a], but through the righteousness of faith.
translation:
  language: id
  text: Sebab janji kepada Abraham atau kepada keturunannya[a]—bahwa ia akan menjadi ahli waris dunia—bukanlah melalui hukum Taurat, melainkan melalui kebenaran[c] berdasarkan iman[d][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benihnya.” Kata Yunani berbentuk tunggal, tetapi dapat dipakai secara kolektif dengan arti “keturunan” atau “anak cucu.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan ini juga dapat diterjemahkan “melalui kebenaran karena iman,” “melalui kebenaran yang berasal dari iman,” atau secara lebih harfiah, “melalui kebenaran iman.”
    reason: alternative_reading
  - marker: c
    text: Kata yang diterjemahkan “kebenaran” juga dapat berarti “keadilan,” tergantung pada konteks.
    reason: lexical_alternative
  - marker: d
    text: Kata yang diterjemahkan “iman” juga dapat berarti “kepercayaan” atau “kesetiaan,” tergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγγελία
  choice: janji
  rationale: Dalam konteks Paulus, kata ini menunjuk pada janji ilahi; “janji” alami dalam bahasa Indonesia dan mempertahankan daya perjanjiannya.
- source_word: σπέρματι
  choice: keturunannya
  rationale: Bentuk Yunani tunggal dapat dipakai secara kolektif. “Keturunannya” wajar dalam bahasa Indonesia dan tidak membatasi rujukannya pada satu orang saja.
- source_word: κληρονόμον ... κόσμου
  choice: ahli waris dunia
  rationale: Pilihan ini mempertahankan gambaran pewarisan dan cakupan luas κόσμος tanpa mempersempit artinya.
- source_word: διὰ νόμου
  choice: melalui hukum Taurat
  rationale: Walaupun νόμου tidak memakai artikel, konteks argumen Paulus secara alami menunjuk pada hukum Taurat; penyebutan ini jelas bagi pembaca Indonesia.
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: “Kebenaran” merupakan padanan baku yang dapat memuat dimensi status benar dan perilaku benar dalam pemakaian Paulus, sedangkan “keadilan” dicatat sebagai alternatif.
- source_word: πίστεως
  choice: iman
  rationale: “Iman” adalah padanan utama dalam konteks pertentangan dengan hukum Taurat, sambil tetap mencatat kemungkinan nuansa “kepercayaan” atau “kesetiaan”.
- source_word: διὰ δικαιοσύνης πίστεως
  choice: melalui kebenaran berdasarkan iman
  rationale: Ungkapan ini cukup alami dalam bahasa Indonesia dan mempertahankan kaitan erat antara kebenaran dan iman tanpa secara tegas menyatakan urutan kausal atau sumbernya.
theological_decisions:
- issue: Hubungan gramatikal dalam δικαιοσύνης πίστεως
  choice: kebenaran berdasarkan iman
  alternative: kebenaran karena iman; kebenaran yang berasal dari iman; kebenaran iman
  rationale: Konstruksi genitif Yunani bersifat padat dan dapat dijabarkan dengan beberapa cara. “Berdasarkan iman” menyampaikan kontras Paulus dengan hukum Taurat tanpa menetapkan secara berlebihan apakah iman dipandang sebagai sebab, sarana, atau ciri kebenaran tersebut.
- issue: Rujukan αὐτόν dalam “menjadi ahli waris dunia”
  choice: ia
  alternative: Abraham
  rationale: Kata ganti Yunani berbentuk maskulin dan paling langsung menunjuk kepada Abraham, tetapi penggunaan “ia” mempertahankan bentuk pronominal sumber serta tidak menutup hubungan janji itu dengan keturunannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah membantu pembaca mengikuti sisipan yang menjelaskan isi janji. Istilah “hukum Taurat,” “kebenaran,” “iman,” dan “ahli waris” dipertahankan karena umum dipahami dalam wacana Alkitab Indonesia tanpa menjadi khas denominasi tertentu.
