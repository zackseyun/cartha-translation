id: ROM.4.3
reference: Romans 4:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τί γὰρ ἡ γραφὴ λέγει; Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/003.yaml
  text: For what does the Scripture say? Abraham believed God[b][a], and it was counted to him as righteousness.
translation:
  language: id
  text: Sebab, apa yang dikatakan Kitab Suci? “Abraham memercayai Allah, dan hal itu diperhitungkan[a] kepadanya sebagai kebenaran[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dianggap” atau “dikreditkan”.
    reason: lexical_alternative
  - marker: b
    text: Atau “keadilan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφή
  choice: Kitab Suci
  rationale: Dengan kata sandang dan dalam pemakaian Paulus, istilah ini menunjuk pada tulisan suci yang berwibawa; “Kitab Suci” merupakan padanan Indonesia yang alami dan tepat.
- source_word: Ἐπίστευσεν
  choice: memercayai
  rationale: Bentuk ini menyampaikan tindakan percaya secara langsung dan, bersama objek Allah, tidak menambahkan uraian tafsir yang tidak terdapat dalam teks.
- source_word: τῷ θεῷ
  choice: Allah
  rationale: Datif setelah πιστεύω di sini paling wajar dipahami sebagai objek kepercayaan Abraham. “Memercayai Allah” dalam bahasa Indonesia dapat mencakup mempercayai perkataan-Nya dan menaruh kepercayaan kepada-Nya tanpa mempersempit maknanya.
- source_word: ἐλογίσθη
  choice: diperhitungkan
  rationale: “Diperhitungkan” mempertahankan bentuk pasif dan cocok dengan makna λογίζομαι dalam konteks penilaian atau pengakuan, tanpa menjadikannya semata-mata istilah keuangan.
- source_word: εἰς δικαιοσύνην
  choice: sebagai kebenaran
  rationale: Dalam konteks Paulus ini, “sebagai kebenaran” merupakan ungkapan Indonesia yang alami dan mempertahankan dimensi status benar; kemungkinan leksikal “keadilan” dicatat dalam catatan kaki.
theological_decisions:
- issue: Pemadanan δικαιοσύνη dalam konteks pembenaran Paulus
  choice: kebenaran
  alternative: keadilan
  rationale: “Kebenaran” lebih sesuai dengan konteks diperhitungkannya Abraham sebagai benar dan mempertahankan ketegangan deklaratif serta relasional dalam pemakaian Paulus. “Keadilan” tetap mungkin secara leksikal, tetapi kurang alami dalam konstruksi ayat ini dan karena itu ditempatkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pertanyaan pembuka dibuat alami, sedangkan kutipan mempertahankan urutan gagasan Yunani. “Hal itu” menjaga subjek tersirat pada verba pasif tanpa secara eksplisit menetapkan penafsiran yang lebih sempit.
