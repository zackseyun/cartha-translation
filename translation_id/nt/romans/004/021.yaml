  text: and being fully convinced that what he had promised[c][b][a], he was also able to do.
translation:
  language: id
  text: dan ia sepenuhnya yakin[a] bahwa apa yang telah Ia janjikan[c], juga sanggup Ia lakukan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "benar-benar yakin" atau "memiliki keyakinan penuh."
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "Ia juga sanggup melakukan [apa yang telah Ia janjikan]."
    reason: lexical_alternative
  - marker: c
    text: Kata "Ia" merujuk kepada Allah berdasarkan konteks sekitarnya.
    reason: cross_reference
lexical_decisions:
- source_word: πληροφορηθεὶς
  choice: yakin sepenuhnya
  rationale: Partisip ini menyatakan keyakinan yang penuh atau kepastian yang teguh. Ungkapan ini alami dalam bahasa Indonesia modern dan mempertahankan kekuatan makna Yunani.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi keyakinan Abraham secara langsung.
- source_word: ὃ
  choice: apa yang
  rationale: Padanan idiomatis bagi pronomina relatif netral dalam susunan ini.
- source_word: ἐπήγγελται
  choice: telah dijanjikan-Nya
  rationale: Bentuk perfek Yunani menunjukkan janji yang sudah diberikan dan tetap berlaku. Bentuk pasif berakhiran -Nya menghasilkan bahasa Indonesia yang alami tanpa menambahkan nama Allah ke dalam teks utama.
- source_word: δυνατός ἐστιν
  choice: sanggup
  rationale: Menyampaikan kemampuan nyata dengan wajar. Tidak diberi penanda waktu lampau karena bentuk Yunani adalah present dan kesanggupan Allah tidak dibatasi pada masa lampau.
- source_word: καὶ
  choice: juga
  rationale: Menegaskan bahwa Ia bukan hanya berjanji, tetapi juga sanggup melakukannya.
- source_word: ποιῆσαι
  choice: lakukan
  rationale: Padanan sederhana dan luas bagi ποιέω, tanpa mempersempit artinya menjadi 'menggenapi' atau 'melaksanakan'.
theological_decisions:
- issue: Subjek tersirat dari tindakan berjanji dan kesanggupan
  choice: Memakai pronomina hormat tersirat melalui -Nya dan Ia, bukan menyisipkan 'Allah' dalam teks utama.
  alternative: bahwa Allah sanggup melakukan juga apa yang telah dijanjikan-Nya
  rationale: Konteks langsung menunjuk kepada Allah, tetapi ayat Yunani sendiri tidak menyebut nama-Nya. Pilihan ini menjaga ketergantungan pada konteks sekaligus tetap jelas dalam bahasa Indonesia.
- issue: Waktu kesanggupan Allah dalam δυνατός ἐστιν
  choice: Mempertahankan nuansa kini melalui 'sanggup' tanpa penanda lampau.
  alternative: pada waktu itu sanggup
  rationale: Bahasa Yunani memakai bentuk present 'Ia sanggup'. Bahasa Indonesia tidak mengharuskan perubahan ke bentuk lampau dalam narasi, sehingga pernyataan tentang kesanggupan tetap terbuka dan tidak dibatasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa mengikuti penekanan sumber Yunani pada apa yang telah dijanjikan, sementara kapitalisasi pronomina ilahi membantu keterbacaan tanpa menyebut 'Allah' secara eksplisit.
