  text: Μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/007.yaml
  text: Blessed are those whose lawless deeds have been forgiven[a], and whose sins have been covered.
translation:
  language: id
  text: “Berbahagialah orang-orang yang pelanggaran hukum mereka telah diampuni[a] dan yang dosa-dosanya telah ditutupi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kedurhakaan mereka telah diampuni.”
    reason: Alternatif leksikal tradisional untuk ἀνομίαι; mempertahankan nuansa pelanggaran terhadap hukum tanpa menyamakannya begitu saja dengan ἁμαρτίαι, “dosa-dosa.”
lexical_decisions:
- source_word: Μακάριοι
  choice: Berbahagialah
  rationale: Ungkapan ini mempertahankan pernyataan tentang keadaan diberkati di hadapan Allah, bukan sekadar perasaan senang atau nasib baik.
- source_word: ἀφέθησαν
  choice: telah diampuni
  rationale: Bentuk pasif ini menyatakan pengampunan yang sudah diberikan dengan hasil yang tetap berlaku; bentuk Indonesia ini alami dan jelas.
- source_word: ἀνομίαι
  choice: pelanggaran-pelanggaran hukum
  rationale: Pilihan ini mempertahankan unsur pelanggaran terhadap hukum dalam ἀνομία sekaligus tetap mudah dipahami pembaca modern.
- source_word: ἐπεκαλύφθησαν
  choice: telah ditutupi
  rationale: Terjemahan ini mempertahankan metafora 'menutupi' dari kutipan Mazmur dan tidak menggantikannya dengan penafsiran.
- source_word: ἁμαρτίαι
  choice: dosa-dosa
  rationale: Padanan baku dan transparan yang tetap dibedakan dari ἀνομίαι dalam baris sejajar ini.
theological_decisions:
- issue: Hubungan antara ἀνομίαι dan ἁμαρτίαι
  choice: Menerjemahkan keduanya secara berbeda sebagai 'pelanggaran-pelanggaran hukum' dan 'dosa-dosa'.
  alternative: Menerjemahkan keduanya dengan istilah umum yang sama, seperti 'dosa-dosa'.
  rationale: Teks mempertahankan paralelisme puitis dengan dua istilah yang berhubungan tetapi tidak identik. Pembedaan ini mengikuti sumber tanpa memaksakan perbedaan teologis yang lebih tajam daripada yang dinyatakan ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'Berbahagialah' mempertahankan corak ucapan bahagia; pengulangan bentuk jamak menjaga keluasan dan paralelisme teks sumber.
