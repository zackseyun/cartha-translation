    rationale: Akhiran posesif -nya paling mudah dipahami sebagai merujuk kepada “hukum” (hukum mereka), bukan sebagai penanda bahwa pelanggaran itu dilakukan oleh orang-orang yang disebut. Teks Yunani menyatakan “mereka yang tindakan-tindakan melawan hukumnya telah diampuni.” “Pelanggaran hukum mereka” secara idiomatis menyatakan makna tersebut tanpa mengubahnya.
  - severity: low
    issue: Catatan kaki “kesalahan-kesalahannya” tidak secara memadai menyatakan alternatif leksikal tradisional untuk ἀνομίαι.
    rationale: “Kesalahan” terlalu umum dan melemahkan unsur pelanggaran hukum. “Kedurhakaan mereka” merupakan alternatif yang lebih dekat dengan “iniquities” dan tetap berbeda dari “dosa-dosa.”
  revised_text: “Berbahagialah orang-orang yang pelanggaran hukum mereka telah diampuni[a] dan yang dosa-dosanya telah ditutupi.”
