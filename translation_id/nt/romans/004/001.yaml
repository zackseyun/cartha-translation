base_translation:
  language: en
  yaml_path: translation/nt/romans/004/001.yaml
  text: What then shall we say that Abraham[a], our forefather according to the flesh[c][b], has found?
translation:
  language: id
  text: Jadi, apakah yang akan kita katakan telah ditemukan oleh Abraham, leluhur kita menurut daging?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan ungkapan yang lebih lazim, “leluhur kita secara jasmani.”
    reason: lexical_alternative
  - marker: b
    text: Sebagian orang menghubungkan “menurut daging” dengan “telah ditemukan oleh Abraham”; maksudnya, apa yang Abraham temukan dengan cara manusiawi atau dari sudut pandang yang semata-mata manusiawi.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Jadi, apa yang akan kita katakan
  rationale: Mempertahankan peralihan retoris Paulus dan nuansa deliberatif bentuk mendatang, dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: εὑρηκέναι
  choice: telah ditemukan
  rationale: Mencerminkan infinitif perfek yang menunjuk pada hasil yang telah dicapai; pilihan ini juga tidak menambahkan penafsiran seperti ‘diperoleh’ atau ‘dicapai’.
- source_word: Ἀβραὰμ τὸν προπάτορα ἡμῶν
  choice: Abraham, leluhur kita
  rationale: ‘Leluhur’ menyampaikan hubungan nenek moyang secara alami dalam bahasa Indonesia, sedangkan ‘kita’ mempertahankan identifikasi bersama yang dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: κατὰ σάρκα
  choice: menurut daging
  rationale: Mempertahankan ungkapan khas Paulus dan membuka ruang bagi ambiguitas sintaksis aslinya; dalam pembacaan utama, ungkapan ini menunjuk pada hubungan keturunan jasmani.
theological_decisions:
- issue: Cakupan κατὰ σάρκα
  choice: Dalam teks utama, ‘menurut daging’ dipahami menerangkan Abraham sebagai leluhur jasmani Paulus dan pihak yang disapanya.
  alternative: Ungkapan itu dapat dikaitkan dengan ‘telah ditemukan’, yakni apa yang Abraham temukan secara manusiawi atau dengan mengandalkan kemampuan manusia.
  rationale: Alur aposisional ‘Abraham, leluhur kita’ secara alami mendukung pembacaan tentang garis keturunan, tetapi susunan bahasa Yunani memungkinkan pembacaan alternatif; karena itu ambiguitas yang sungguh ada dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan ‘menurut daging’ dipertahankan karena merupakan istilah Paulus yang penting, sementara makna idiomatisnya dijelaskan dalam catatan kaki.
