  text: Blessed is the man against whom the Lord will never count sin[a][b].
translation:
  language: id
  text: Berbahagialah orang yang dosanya sama sekali tidak akan diperhitungkan oleh Tuhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Berbahagialah orang yang dosanya pasti tidak akan diperhitungkan oleh Tuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Berbahagialah
  rationale: Ungkapan ini mempertahankan bobot berkat ilahi dalam kutipan Kitab Suci dan lebih wajar dalam bahasa Indonesia alkitabiah daripada sekadar menyatakan perasaan senang.
- source_word: ἀνήρ
  choice: orang
  rationale: Walaupun bentuk Yunaninya maskulin tunggal, di sini kata itu dipakai secara representatif dan tidak membatasi makna pada laki-laki; 'orang' menyampaikan cakupan tersebut secara alami dalam bahasa Indonesia.
- source_word: οὗ
  choice: yang ... terhadapnya
  rationale: Genitif relatif dibawa ke dalam susunan Indonesia yang alami bersama verba 'memperhitungkan ... terhadapnya'.
- source_word: οὐ μὴ
  choice: sama sekali tidak akan
  rationale: Gabungan negatif dengan bentuk subjungtif menyatakan penyangkalan yang tegas; pilihan ini mempertahankan penekanannya tanpa menjadikannya sekadar keterangan waktu.
- source_word: λογίσηται
  choice: diperhitungkan
  rationale: Kata ini mempertahankan metafora pembukuan yang penting dalam konteks Roma 4, sekaligus terdengar jelas dan tidak terlalu teknis.
- source_word: κύριος
  choice: Tuhan
  rationale: Padanan baku dan tepat dalam konteks kutipan Kitab Suci yang merujuk kepada Allah.
- source_word: ἁμαρτίαν
  choice: dosa
  rationale: Nomina tunggal tanpa artikel dipahami sebagai kategori umum; 'dosa' merupakan bentuk alami dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa maskulin representatif
  choice: Menerjemahkan ἀνήρ sebagai 'orang'.
  alternative: '''laki-laki'' atau ''seorang laki-laki'''
  rationale: Dalam konteks ini, bentuk maskulin tunggal bersifat representatif, bukan eksklusif bagi laki-laki. Bahasa Indonesia dapat menyampaikan maksud sumber secara tepat dengan kata 'orang' tanpa kehilangan jumlah tunggal.
- issue: Kekuatan penyangkalan οὐ μὴ
  choice: sama sekali tidak akan
  alternative: tidak akan pernah
  rationale: Keduanya mungkin, tetapi 'sama sekali tidak akan' secara langsung mempertahankan penegasan kuat pada tindakan memperhitungkan tanpa berpotensi menonjolkan dimensi waktu melebihi teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan pasif mempertahankan fokus pada dosa yang tidak diperhitungkan, sedangkan 'terhadapnya' menjelaskan pihak yang tidak dibebani perhitungan itu. Penanda catatan kaki dicantumkan dalam teks utama.
