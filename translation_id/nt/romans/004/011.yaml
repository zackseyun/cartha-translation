id: ROM.4.11
reference: Romans 4:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ σημεῖον ἔλαβεν περιτομῆς, σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ, εἰς τὸ εἶναι αὐτὸν πατέρα πάντων τῶν πιστευόντων δι’ ἀκροβυστίας, εἰς τὸ ⸀λογισθῆναι αὐτοῖς τὴν δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/011.yaml
  text: And he received the sign of circumcision as a seal of the righteousness of the faith that he had while uncircumcised[a], so that he might be the father of all who believe while uncircumcised, so that righteousness might be counted to them also[c][b],
translation:
  language: id
  text: Ia menerima tanda sunat sebagai meterai kebenaran[a] berdasarkan iman yang dimilikinya ketika belum disunat, supaya ia menjadi bapa bagi semua orang yang percaya dalam keadaan belum disunat,[b] sehingga kebenaran juga diperhitungkan kepada mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “kebenaran” juga dapat berarti “keadilan”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “melalui keadaan tidak bersunat”; maksudnya, percaya dalam keadaan belum disunat.
    reason: lexical_alternative
  - marker: c
    text: Atau “dikreditkan” atau “dianggap sebagai milik mereka”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: tanda
  rationale: Padanan alami dan tepat yang mempertahankan fungsi sunat sebagai penanda lahiriah.
- source_word: περιτομή
  choice: sunat
  rationale: Istilah baku dalam bahasa Indonesia untuk ritus yang dibahas Paulus.
- source_word: σφραγίς
  choice: meterai
  rationale: Mempertahankan metafora pengesahan atau peneguhan tanpa mengubahnya menjadi uraian tafsir.
- source_word: δικαιοσύνη
  choice: kebenaran
  rationale: Padanan Indonesia yang lazim bagi δικαιοσύνη dalam pembahasan Paulus mengenai status benar di hadapan Allah; nuansa keadilan tetap diakui dalam catatan kaki.
- source_word: πίστις
  choice: iman
  rationale: Padanan baku yang sesuai dengan rantai genitif dan konteks argumentasi tentang percaya.
- source_word: ἐν τῇ ἀκροβυστίᾳ
  choice: ketika belum disunat
  rationale: Mengungkapkan keadaan Abraham secara alami dan jelas, sekaligus mempertahankan urutan waktunya.
- source_word: πατέρα πάντων τῶν πιστευόντων
  choice: bapa bagi semua orang yang percaya
  rationale: Bahasa Indonesia yang wajar serta mempertahankan peran representatif Abraham.
- source_word: δι’ ἀκροβυστίας
  choice: sekalipun belum disunat
  rationale: Menyampaikan bahwa mereka percaya dalam keadaan tidak bersunat, bukan bahwa keadaan itu menjadi sarana iman; catatan kaki mempertahankan bentuk harfiahnya.
- source_word: λογίζομαι
  choice: diperhitungkan
  rationale: Mempertahankan citra perhitungan atau pengkreditan dalam argumentasi Paulus dan tetap alami dalam bahasa Indonesia.
- source_word: καί
  choice: juga
  rationale: Menandai bahwa kebenaran diperhitungkan pula kepada orang percaya yang belum disunat.
theological_decisions:
- issue: Hubungan sunat dengan kebenaran
  choice: Sunat disebut tanda dan meterai kebenaran berdasarkan iman yang sudah dimiliki Abraham ketika belum disunat.
  alternative: Susunan lain dapat memberi kesan bahwa sunat merupakan sarana untuk memperoleh kebenaran.
  rationale: Teks Yunani menempatkan sunat sebagai pengesahan sesudah kebenaran yang berkaitan dengan iman dalam keadaan tidak bersunat; terjemahan mempertahankan urutan ini tanpa memasukkan rumusan sakramental kemudian.
- issue: Hubungan genitif dalam τῆς δικαιοσύνης τῆς πίστεως
  choice: kebenaran berdasarkan iman
  alternative: kebenaran iman
  rationale: Pilihan utama menjelaskan hubungan konseptual secara alami dalam bahasa Indonesia tanpa menyatakan lebih dari konteks bahwa kebenaran itu terkait dengan iman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mempertahankan alur panjang argumentasi Paulus, tetapi memakai penghubung dan ungkapan keadaan yang mudah dipahami pembaca umum.
