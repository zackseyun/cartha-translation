  to: Ia menerima tanda sunat sebagai meterai kebenaran[a] berdasarkan iman yang dimilikinya ketika belum disunat, supaya ia menjadi bapa bagi semua orang yang percaya dalam keadaan belum disunat,[b] sehingga kebenaran juga diperhitungkan kepada mereka.[c]
  rationale: Revisi memindahkan catatan kaki leksikal tentang “kebenaran” ke kata yang dijelaskannya dan mengganti ungkapan konsesif “sekalipun belum disunat” dengan ungkapan keadaan yang lebih setia kepada δι’ ἀκροβυστίας. Selebihnya dipertahankan karena sudah akurat, jelas, dan berdaftar modern-baku.
