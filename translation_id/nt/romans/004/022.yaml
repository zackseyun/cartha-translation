  yaml_path: translation/nt/romans/004/022.yaml
  text: Therefore it was counted to him as righteousness[a][b].
translation:
  language: id
  text: Karena itu, hal itu diperhitungkan kepadanya sebagai kebenaran.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dikreditkan” atau “dianggap.”
    reason: lexical_alternative
  - marker: b
    text: Atau “keadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Karena itu
  rationale: Menandai kesimpulan dari uraian sebelumnya dan mempertahankan hubungan logis secara alami dalam bahasa Indonesia.
- source_word: ἐλογίσθη
  choice: diperhitungkan
  rationale: Bentuk pasif mempertahankan struktur Yunani serta metafora perhitungan yang penting dalam Roma 4, tanpa menambahkan rumusan doktrinal yang tidak tersurat.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Menyatakan datif personal secara wajar dan tetap merujuk kepada Abraham dalam konteks.
- source_word: εἰς
  choice: sebagai
  rationale: Dalam ungkapan ini, 'sebagai' secara alami menyatakan status atau hasil yang diperhitungkan.
- source_word: δικαιοσύνην
  choice: kebenaran
  rationale: Dalam konteks Paulus, 'kebenaran' merupakan padanan Indonesia yang mapan dan mencakup status benar; kemungkinan nuansa 'keadilan' tetap dicatat dalam catatan kaki.
theological_decisions:
- issue: Bahasa perhitungan Paulus tanpa memasukkan rumusan doktrinal tambahan
  choice: diperhitungkan kepadanya sebagai kebenaran
  alternative: dikreditkan kepadanya sebagai kebenaran; dianggap baginya sebagai kebenaran
  rationale: Terjemahan ini mempertahankan metafora deklaratif/perhitungan dan bentuk pasif teks Yunani, sambil tidak menjelaskan lebih jauh siapa pelaku yang tersirat atau mekanisme teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Frasa 'hal tersebut' mewakili subjek tersirat dari kata kerja pasif Yunani dan mengacu pada iman Abraham dalam konteks sebelumnya; pilihan ini menghindari pengulangan interpretatif yang tidak terdapat secara eksplisit dalam ayat.
