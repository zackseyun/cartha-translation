    rationale: Struktur Yunani membedakan hal yang “berdasarkan iman” dari ἐπαγγελία (“janji”) yang kemudian dinyatakan βεβαίαν (“terjamin/teguh”). Dalam konteks dekat, yang tersirat adalah warisan.
  - severity: low
    issue: “Abraham adalah bapa kita semua” dipisahkan dari frasa yang menerangkan Abraham.
    rationale: ὅς ἐστιν adalah klausa relatif yang merujuk langsung kepada Abraham. Menghubungkannya dalam satu rangkaian lebih mencerminkan sumber, sambil mempertahankan koma akhir karena kalimat berlanjut ke ayat berikutnya.
