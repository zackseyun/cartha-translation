id: ROM.4.16
reference: Romans 4:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ἐκ πίστεως, ἵνα κατὰ χάριν, εἰς τὸ εἶναι βεβαίαν τὴν ἐπαγγελίαν παντὶ τῷ σπέρματι, οὐ τῷ ἐκ τοῦ νόμου μόνον ἀλλὰ καὶ τῷ ἐκ πίστεως Ἀβραάμ (ὅς ἐστιν πατὴρ πάντων ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/016.yaml
  text: For this reason it is by faith[a], so that it may be according to grace, in order that the promise may be certain to all the offspring—not only to those from the law, but also to those of the faith of Abraham, who is the father of us all[c][b],
translation:
  language: id
  text: Karena itu, warisan itu diperoleh berdasarkan iman[a], supaya sesuai dengan anugerah, agar janji itu terjamin bagi seluruh keturunan Abraham[b]—bukan hanya bagi mereka yang berdasarkan hukum Taurat, melainkan juga bagi mereka yang beriman seperti Abraham[c], yang adalah bapa kita semua,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari iman”; dalam konteks ini frasa tersebut menunjukkan dasar.
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “benih,” yang di sini dipakai secara kolektif untuk keturunan Abraham.'
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “bagi orang yang berasal dari iman Abraham.” Ungkapan Yunani ini berbentuk tunggal dan padat; ungkapan ini dapat dipahami sebagai orang-orang yang beriman seperti Abraham.
    reason: alternative_reading
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Karena itu
  rationale: Mempertahankan hubungan kesimpulan dengan argumen sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἐκ πίστεως
  choice: berdasarkan iman
  rationale: Frasa eliptis Yunani menunjukkan dasar; penambahan tersirat 'janji tersebut' membuat kalimat Indonesia lengkap tanpa mengubah acuannya dalam konteks.
- source_word: ἵνα κατὰ χάριν
  choice: supaya sesuai dengan anugerah
  rationale: Menjaga klausa tujuan dan hubungan antara iman dan anugerah tanpa menambahkan gagasan bahwa janji 'bergantung' pada anugerah.
- source_word: βεβαίαν
  choice: terjamin
  rationale: Menyatakan bahwa janji itu teguh dan dapat diandalkan; lebih alami bagi sebuah janji daripada 'pasti' dalam susunan ini.
- source_word: ἐπαγγελίαν
  choice: janji
  rationale: Padanan baku dan alami bagi bahasa perjanjian Paulus.
- source_word: σπέρματι
  choice: keturunan Abraham
  rationale: σπέρμα dipakai secara kolektif. 'Keturunan' alami dalam bahasa Indonesia; 'Abraham' dibuat eksplisit dari konteks langsung agar rujukannya jelas.
- source_word: οὐ τῷ ἐκ τοῦ νόμου μόνον
  choice: bukan hanya bagi mereka yang berasal dari hukum Taurat
  rationale: Bentuk tunggal Yunani berfungsi kolektif. Bentuk jamak Indonesia menyampaikan kelompok yang dimaksud, sedangkan 'hukum Taurat' merupakan padanan kontekstual νόμος.
- source_word: ἀλλὰ καὶ τῷ ἐκ πίστεως Ἀβραάμ
  choice: melainkan juga bagi mereka yang berasal dari iman Abraham
  rationale: Mempertahankan susunan Yunani yang padat dan ambiguitas frasa genitif, tanpa menambahkan secara diam-diam gagasan 'memiliki iman yang sama dengan'.
- source_word: πατὴρ πάντων ἡμῶν
  choice: Abraham adalah bapa kita semua
  rationale: Mempertahankan metafora kekeluargaan-perjanjian; nama Abraham diulangi agar subjek kalimat Indonesia jelas.
theological_decisions:
- issue: Cara memahami τῷ ἐκ πίστεως Ἀβραάμ
  choice: bagi mereka yang berasal dari iman Abraham
  alternative: bagi mereka yang memiliki iman seperti Abraham
  rationale: Pilihan utama lebih dekat dengan kepadatan dan ambiguitas teks Yunani. Alternatif menjelaskan kemungkinan maknanya, tetapi menambahkan unsur perbandingan yang tidak dinyatakan secara eksplisit.
- issue: Cakupan παντὶ τῷ σπέρματι
  choice: seluruh keturunan Abraham
  alternative: setiap keturunan Abraham
  rationale: σπέρμα berbentuk tunggal kolektif dan menunjuk keseluruhan keturunan; 'seluruh' menjaga pengertian korporat tanpa memutuskan identitas mereka di luar kontras yang diberikan ayat.
- issue: Hubungan iman, anugerah, dan janji dalam klausa eliptis
  choice: janji tersebut berdasarkan iman, supaya sesuai dengan anugerah
  alternative: hal itu berasal dari iman, supaya berdasarkan anugerah
  rationale: 'Konteks mendukung ''janji'' sebagai unsur yang tersirat, tetapi susunan tetap menjaga tujuan teologis Paulus: iman selaras dengan anugerah dan menjamin janji bagi seluruh keturunan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Anugerah' dipilih untuk χάρις dan 'hukum Taurat' untuk νόμος dalam konteks Roma. Tanda koma akhir dipertahankan karena ayat berlanjut langsung ke Roma 4:17.
