  to: Karena itu, warisan itu diperoleh berdasarkan iman[a], supaya sesuai dengan anugerah, agar janji itu terjamin bagi seluruh keturunan Abraham[b]—bukan hanya bagi mereka yang berdasarkan hukum Taurat, melainkan juga bagi mereka yang beriman seperti Abraham[c], yang adalah bapa kita semua,
