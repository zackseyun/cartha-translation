id: ROM.4.5
reference: Romans 4:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τῷ δὲ μὴ ἐργαζομένῳ, πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ, λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/005.yaml
  text: But to the one not working[a], but believing in the one who justifies the ungodly[d][c][b], his faith is counted as righteousness.
translation:
  language: id
  text: Namun, bagi orang yang tidak bekerja, tetapi percaya[a] kepada Dia yang membenarkan[b] orang durhaka, imannya diperhitungkan[c] sebagai kebenaran[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menaruh kepercayaan”.
    reason: lexical_alternative
  - marker: b
    text: Atau “menyatakan benar”.
    reason: lexical_alternative
  - marker: c
    text: Atau “dianggap” atau “dikreditkan”.
    reason: lexical_alternative
  - marker: d
    text: Atau “keadilan”; dalam konteks tulisan Paulus, δικαιοσύνη juga dapat mengandung nuansa keadilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ... μὴ ἐργαζομένῳ
  choice: bagi orang yang tidak bekerja
  rationale: Partisip substantival dengan μή diterjemahkan secara alami sambil mempertahankan kontras dengan tindakan percaya; ungkapan ini tidak diperluas menjadi kecaman umum terhadap segala bentuk pekerjaan.
- source_word: πιστεύοντι δὲ ἐπὶ
  choice: tetapi percaya kepada
  rationale: “Percaya kepada” merupakan ungkapan Indonesia yang wajar untuk πιστεύω ἐπί dan tetap menyiratkan ketergantungan kepada pribadi yang dipercayai; alternatif “menaruh kepercayaan kepada” dicatat dalam catatan kaki.
- source_word: τὸν δικαιοῦντα
  choice: Dia yang membenarkan
  rationale: “Membenarkan” mempertahankan istilah kunci dalam argumentasi Paulus dan kaitan leksikalnya dengan δικαιοσύνη, tanpa menentukan secara sempit bagaimana tindakan itu harus dipahami.
- source_word: τὸν ἀσεβῆ
  choice: orang durhaka
  rationale: “Orang durhaka” menyampaikan sikap tidak hormat dan perlawanan terhadap Allah yang terkandung dalam ἀσεβής, serta lebih alami dalam bahasa Indonesia modern daripada bentuk yang terlalu harfiah.
- source_word: λογίζεται
  choice: diperhitungkan
  rationale: Bentuk pasif ini mempertahankan nuansa penilaian atau penghitungan dalam λογίζομαι dan cocok dengan pola argumentasi akuntansi dalam konteks.
- source_word: ἡ πίστις αὐτοῦ
  choice: imannya
  rationale: “Iman” adalah padanan utama πίστις di sini karena konteks langsung mengontraskan tidak bekerja dengan percaya; “kesetiaan” kurang sesuai dalam ayat ini.
- source_word: εἰς δικαιοσύνην
  choice: sebagai kebenaran
  rationale: Dalam konstruksi λογίζεται ... εἰς, “sebagai” dengan jelas menyampaikan bahwa iman diperhitungkan sebagai sesuatu, sambil mempertahankan hubungan dengan δικαιοσύνη.
- source_word: δικαιοσύνην
  choice: kebenaran
  rationale: “Kebenaran” mempertahankan istilah teologis utama dalam surat Paulus; kemungkinan nuansa “keadilan” dicatat agar rentang maknanya tidak dihapus.
theological_decisions:
- issue: Makna δικαιοῦντα dalam konteks argumentasi Paulus
  choice: Dia yang membenarkan
  alternative: Dia yang menyatakan benar
  rationale: Pilihan utama mempertahankan istilah teologis yang mapan dan ketegangan maknanya tanpa memasukkan suatu sistem denominasi tertentu; alternatif forensik yang lebih eksplisit disediakan dalam catatan kaki.
- issue: Padanan kelompok kata πίστις/πιστεύω
  choice: percaya / iman
  alternative: menaruh kepercayaan / kepercayaan; kesetiaan
  rationale: Konteks menghubungkan πίστις dengan tindakan percaya dan mengontraskannya dengan bekerja, sehingga “iman” lebih tepat daripada “kesetiaan”; nuansa kepercayaan tetap disediakan sebagai alternatif.
- issue: Hubungan iman dan kebenaran dalam λογίζεται ... εἰς δικαιοσύνην
  choice: imannya diperhitungkan sebagai kebenaran
  alternative: imannya dianggap sebagai kebenaran; imannya dikreditkan sebagai kebenaran
  rationale: Rumusan ini mengikuti struktur pernyataan Yunani dan tidak menjelaskan lebih jauh mekanisme teologisnya, sehingga ambiguitas dan ketegangan dalam argumentasi Paulus tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur yang mudah dipahami. “Namun” menandai kontras δέ, sedangkan dua kali δέ dalam klausa diterjemahkan secara alami melalui “tetapi” tanpa membuat kalimat kaku. Huruf kapital pada “Dia” membantu menunjukkan bahwa acuannya adalah Allah dalam konteks, tanpa menambahkan nama yang tidak terdapat dalam teks Yunani.
