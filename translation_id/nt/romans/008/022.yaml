id: ROM.8.22
reference: Romans 8:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἴδαμεν γὰρ ὅτι πᾶσα ἡ κτίσις συστενάζει καὶ συνωδίνει ἄχρι τοῦ νῦν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/022.yaml
  text: For we know that the whole creation groans together and suffers labor pains together until now[a][b].
translation:
  language: id
  text: Sebab kita tahu bahwa seluruh ciptaan bersama-sama mengerang dan bersama-sama mengalami sakit bersalin sampai sekarang[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segenap ciptaan”; mungkin juga “setiap makhluk ciptaan,” meskipun dalam konteks ini makna kosmis yang lebih luas lebih mungkin.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “mengalami sakit bersalin” menggambarkan nyeri kelahiran, sehingga mengisyaratkan bukan hanya penderitaan, tetapi penderitaan yang menuju kehidupan baru.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: kita tahu
  rationale: Bentuk οἶδα lazim berfungsi dengan makna kini dan di sini menyatakan pengetahuan bersama yang sudah pasti.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata penghubung ini mempertahankan hubungan penjelasan dengan argumen pada ayat sebelumnya.
- source_word: πᾶσα ἡ κτίσις
  choice: seluruh ciptaan
  rationale: Gabungan artikel dengan πᾶσα secara alami menunjuk kepada ciptaan sebagai keseluruhan kolektif; konteks Roma 8 mendukung cakupan kosmis.
- source_word: συστενάζει
  choice: bersama-sama mengerang
  rationale: “Mengerang” menyampaikan penderitaan yang terdengar, sedangkan “bersama-sama” mempertahankan unsur kebersamaan dalam awalan συν-.
- source_word: συνωδίνει
  choice: bersama-sama mengalami sakit bersalin
  rationale: Pilihan ini mempertahankan gambaran khusus tentang sakit melahirkan dan unsur kebersamaan dalam awalan συν-, bukan mengubahnya menjadi penderitaan umum.
- source_word: ἄχρι τοῦ νῦν
  choice: sampai sekarang
  rationale: Ungkapan alami ini mempertahankan makna keadaan yang terus berlangsung hingga saat kini.
theological_decisions:
- issue: Apakah κτίσις diterjemahkan sebagai “ciptaan” atau sebagai “makhluk/sesuatu yang diciptakan.”
  choice: seluruh ciptaan
  alternative: setiap makhluk; segala sesuatu yang diciptakan
  rationale: Dalam Roma 8:19–23, Paulus mempersonifikasikan tatanan ciptaan nonmanusia yang ditaklukkan kepada kesia-siaan dan menantikan pembebasan. “Seluruh ciptaan” mempertahankan cakupan luas ini tanpa mempersempitnya menjadi makhluk-makhluk individual.
- issue: Apakah συνωδίνει menyatakan penderitaan umum atau secara khusus sakit bersalin.
  choice: bersama-sama mengalami sakit bersalin
  alternative: bersama-sama menderita
  rationale: Kata Yunani ini secara khusus membangkitkan gambaran sakit bersalin. Terjemahan mempertahankan ketegangan antara penderitaan sekarang dan gambaran kelahiran, tanpa menjelaskan hasil akhirnya di dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang wajar dan bermartabat. Pengulangan “bersama-sama” sengaja dipertahankan untuk mencerminkan kedua verba Yunani berawalan συν-, walaupun menghasilkan gaya yang agak repetitif.
