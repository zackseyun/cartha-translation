lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Menjaga fungsi penjelas yang menghubungkan ayat ini dengan argumen sebelumnya secara alami dalam bahasa Indonesia.
- source_word: φρόνημα
  choice: pola pikir
  rationale: Mengungkapkan bukan hanya kegiatan intelektual, melainkan orientasi atau kecenderungan batin yang menetap.
- source_word: σάρξ
  choice: daging
  rationale: Mempertahankan istilah kunci Paulus dan ketegangan metaforisnya; padanan interpretatif dicantumkan dalam catatan kaki.
- source_word: θάνατος
  choice: kematian
  rationale: Padanan langsung yang mempertahankan bobot harfiah sekaligus teologis dari antitesis Paulus.
- source_word: πνεῦμα
  choice: Roh
  rationale: Konteks Roma 8 terutama menunjuk kepada Roh Kudus, sementara kemungkinan arti yang lebih umum tetap dicatat.
- source_word: ζωή
  choice: kehidupan
  rationale: Padanan alami yang mempertahankan kontras ringkas dengan kematian.
- source_word: εἰρήνη
  choice: damai sejahtera
  rationale: Ungkapan Indonesia yang lazim dan bermartabat untuk cakupan εἰρήνη, bukan sekadar ketiadaan konflik.
theological_decisions:
- issue: Apakah πνεῦμα menunjuk kepada Roh Kudus atau roh manusia
  choice: Roh Kudus, ditampilkan sebagai “Roh”
  alternative: roh manusia atau roh dalam arti umum
  rationale: Konteks langsung Roma 8 berulang kali mempertentangkan daging dengan Roh sebagai pelaku ilahi yang memberi hidup. Namun, karena bentuk Yunani sendiri tidak memakai kapitalisasi semantis, alternatifnya dipertahankan dalam catatan kaki.
- issue: Makna metaforis σάρξ
  choice: Mempertahankan “daging”
  alternative: tabiat berdosa
  rationale: “Daging” menjaga kosakata khas Paulus dan tidak menyederhanakan konsepnya menjadi satu definisi doktrinal; alternatif interpretatif diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan antitesis Yunani dipertahankan, dengan “pola pikir” untuk menyampaikan orientasi batin yang menetap. Penanda catatan kaki ditempatkan langsung setelah unsur yang diterangkan.
