  text: For the mindset of the flesh is death[b][a], but the mindset of the Spirit is life and peace.
translation:
  language: id
  text: Sebab, pola pikir yang dikuasai oleh daging[a] adalah kematian, tetapi pola pikir yang dikuasai oleh Roh[b] adalah kehidupan dan damai sejahtera.
  philosophy: optimal-equivalence
