  naturalness: ‘Pola pikir yang dikuasai oleh daging/Roh’ adalah bahasa Indonesia baku yang lebih jelas dan alami, sambil tetap menyatakan orientasi menetap yang terkandung dalam φρόνημα. Penempatan penanda catatan kaki langsung sesudah kata yang dijelaskan juga diperbaiki.
  terminology: ‘Daging’ dipertahankan sebagai istilah utama Paulus, dengan ‘tabiat berdosa’ sebagai alternatif interpretatif. ‘Roh’ dipertahankan untuk πνεῦμα dalam konteks ini; ‘kehidupan’ dan ‘damai sejahtera’ wajar serta berregister baik.
