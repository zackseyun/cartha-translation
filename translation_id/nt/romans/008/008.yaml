  text: Those who are in the flesh cannot please God[a].
translation:
  language: id
  text: Mereka yang berada dalam daging tidak dapat menyenangkan Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mereka yang dikuasai oleh tabiat berdosa.” Secara harfiah, teks Yunani berbunyi “mereka yang berada dalam daging”; “daging” merupakan istilah kunci Paulus dalam konteks ini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὄντες
  choice: Mereka yang hidup
  rationale: Konstruksi artikel dengan partisipel menunjuk pada suatu kelompok dalam keadaan yang sedang berlangsung. Dalam konteks ini, "hidup" lebih alami daripada "berada" dan tetap menyatakan orientasi keberadaan mereka.
- source_word: δὲ
  choice: —
  rationale: Partikel ini menandai kelanjutan atau kontras dengan ayat sebelumnya. Dalam bahasa Indonesia, hubungan tersebut sudah jelas dari konteks sehingga tidak perlu dinyatakan secara eksplisit.
- source_word: ἐν σαρκὶ
  choice: menurut daging
  rationale: Ungkapan ini mempertahankan istilah Paulus "daging" serta kaitannya dengan Roma 8:4–7. Kata "menurut" mengungkapkan ranah atau orientasi hidup secara wajar dalam bahasa Indonesia tanpa langsung menyamakannya dengan tubuh jasmani.
- source_word: θεῷ ἀρέσαι
  choice: menyenangkan Allah
  rationale: Ini merupakan padanan Indonesia yang langsung dan alami bagi infinitif ἀρέσαι dengan θεῷ sebagai pihak yang dikenai tindakan.
- source_word: οὐ δύνανται
  choice: tidak mungkin
  rationale: Ungkapan ini menyampaikan ketidakmampuan yang tegas secara ringkas dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Pemaknaan σάρξ dalam konteks Paulus yang diperdebatkan
  choice: menurut daging
  alternative: dikuasai oleh tabiat berdosa
  rationale: Teks utama mempertahankan istilah kunci Paulus, "daging", agar ketegangan dan jalinan konseptual dalam Roma 8 tidak dihilangkan. Alternatif yang lebih menafsirkan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat lugas bagi pembaca umum, sementara istilah teologis "daging" dipertahankan dan dijelaskan melalui catatan kaki.
