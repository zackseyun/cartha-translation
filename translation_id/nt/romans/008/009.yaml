id: ROM.8.9
reference: Romans 8:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλὰ ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/009.yaml
  text: But you are not in the flesh but in the Spirit[a], if indeed the Spirit of God dwells in you. But if anyone does not have the Spirit of Messiah[c][b], he does not belong to him.
translation:
  language: id
  text: Namun, kamu tidak berada di dalam daging[a], melainkan di dalam Roh, jika memang Roh Allah tinggal di dalam kamu. Namun, jika seseorang tidak memiliki Roh Mesias[b], ia bukan milik-Nya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di dalam tabiat berdosa.” Secara harfiah, “di dalam daging.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Roh Kristus.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “orang itu bukan kepunyaan-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σάρξ
  choice: daging
  rationale: Mempertahankan istilah khas Paulus dan gambaran tentang ranah atau keadaan hidup, tanpa mempersempitnya menjadi tubuh jasmani atau langsung menafsirkannya sebagai tabiat berdosa.
- source_word: πνεῦμα
  choice: Roh
  rationale: Konteks langsung menyebut “Roh Allah” dan “Roh Mesias”, sehingga yang dimaksud ialah Roh Kudus, bukan roh manusia atau sekadar kecenderungan batin.
- source_word: οἰκεῖ
  choice: tinggal
  rationale: Menyampaikan makna menetap atau berdiam secara wajar dalam bahasa Indonesia modern.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός di sini diperlakukan sebagai gelar, sehingga “Mesias” mempertahankan makna gelarnya.
- source_word: οὐκ ἔστιν αὐτοῦ
  choice: ia bukan milik-Nya
  rationale: Ungkapan kepemilikan Yunani disampaikan secara alami dalam bahasa Indonesia sambil mempertahankan pronomina dan tidak menentukan antesedennya secara berlebihan.
- source_word: εἴπερ
  choice: jika memang
  rationale: Mempertahankan bentuk bersyarat sekaligus nuansa bahwa kondisi tersebut diasumsikan benar secara retoris.
- source_word: Ὑμεῖς
  choice: kamu
  rationale: Pronomina Yunani dinyatakan secara eksplisit dan bersifat jamak; “kamu” sesuai dengan ragam Alkitab Indonesia dan kontrasnya ditegaskan oleh “Namun”.
- source_word: οὗτος
  choice: ia
  rationale: Mengungkapkan rujukan tunggal generik secara alami tanpa menambah penafsiran.
theological_decisions:
- issue: Kontras Paulus antara “di dalam daging” dan “di dalam Roh”
  choice: Mempertahankan bahasa ranah atau keadaan hidup serta istilah “daging” dan “Roh”
  alternative: Menafsirkan sebagai “dikuasai tabiat berdosa” berlawanan dengan “hidup yang dikendalikan Roh”
  rationale: Teks mengaitkan keadaan orang percaya dengan berdiamnya Roh Allah. Istilah Paulus dipertahankan agar ketegangan teologisnya tidak dipersempit oleh parafrasa.
- issue: Anteseden pronomina pada “bukan milik-Nya”
  choice: Mempertahankan pronomina tanpa menggantinya dengan nama tertentu
  alternative: Menuliskan secara eksplisit “bukan milik Mesias” atau “bukan milik Allah”
  rationale: Anteseden terdekat ialah Mesias, tetapi konteks juga menghubungkan Roh Allah dengan Roh Mesias. Pronomina mempertahankan bentuk dan ruang rujukan teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur “di dalam daging ... di dalam Roh” sengaja dipertahankan meskipun agak tidak lazim agar metafora ranah dalam bahasa Yunani tetap terlihat. “Kamu” mengikuti pemakaian Alkitab Indonesia untuk sapaan jamak dalam konteks ini; huruf kapital pada “Roh” dan “-Nya” mengikuti konvensi rujukan ilahi.
source_grounding:
  english_pob_role: consult_only
