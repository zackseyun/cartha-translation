id: ROM.8.26
reference: Romans 8:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὡσαύτως δὲ καὶ τὸ πνεῦμα συναντιλαμβάνεται ⸂τῇ ἀσθενείᾳ⸃ ἡμῶν· τὸ γὰρ τί ⸀προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν, ἀλλὰ αὐτὸ τὸ πνεῦμα ⸀ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/026.yaml
  text: Likewise[a], the Spirit also helps in our weakness. For we do not know what we should pray for as we ought, but the Spirit himself intercedes with inexpressible groanings[b],
translation:
  language: id
  text: Demikian juga, Roh menolong kita dalam kelemahan kita. Sebab, kita tidak tahu apa yang sepatutnya kita doakan, tetapi Roh sendiri berdoa untuk kita dengan keluhan-keluhan yang tak terucapkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan keluhan-keluhan yang tidak dapat diungkapkan” atau “dengan keluhan-keluhan tanpa kata-kata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡσαύτως δὲ καὶ
  choice: Demikian juga
  rationale: Menghubungkan tindakan Roh dengan konteks sebelumnya secara alami tanpa menerjemahkan partikel-partikel Yunani secara kaku.
- source_word: συναντιλαμβάνεται
  choice: menolong kita dalam
  rationale: Kata kerja ini menggambarkan tindakan ikut memikul atau datang membantu; ungkapan ini alami dalam bahasa Indonesia dan tetap menunjukkan pertolongan aktif.
- source_word: τῇ ἀσθενείᾳ ἡμῶν
  choice: kelemahan kita
  rationale: Bentuk tunggal dipertahankan secara kolektif dan tidak dipersempit hanya kepada kelemahan jasmani atau rohani.
- source_word: τὸ γὰρ τί προσευξώμεθα καθὸ δεῖ
  choice: apa yang sepatutnya kita doakan
  rationale: Menyampaikan ketidaktahuan mengenai isi doa yang sesuai sebagaimana mestinya, dengan susunan Indonesia yang jelas.
- source_word: αὐτὸ τὸ πνεῦμα
  choice: Roh sendiri
  rationale: Mempertahankan penekanan konstruksi Yunani sekaligus menghindari pemaksaan gender gramatikal yang tidak terdapat dalam bahasa Indonesia.
- source_word: ὑπερεντυγχάνει
  choice: menjadi pengantara bagi kita
  rationale: Menyatakan tindakan memohon demi pihak lain; 'bagi kita' memperjelas arah tindakan yang terkandung dalam kata kerja majemuk ini.
- source_word: στεναγμοῖς ἀλαλήτοις
  choice: dengan keluhan-keluhan yang tak terucapkan
  rationale: Menjaga ambiguitas apakah keluhan itu tidak dapat diungkapkan atau tidak diwujudkan dalam kata-kata, tanpa membatasinya menjadi sekadar tidak terdengar.
theological_decisions:
- issue: Apakah tindakan Roh harus dinyatakan dengan pronomina bergender atau secara impersonal
  choice: Roh sendiri
  alternative: Roh itu sendiri
  rationale: Bahasa Indonesia tidak menuntut gender gramatikal. 'Roh sendiri' mempertahankan penekanan dan tindakan personal dalam konteks tanpa mengimpor bentuk gender dari bahasa lain.
- issue: Siapa yang mengalami atau menghasilkan keluhan-keluhan tersebut
  choice: Tidak dinyatakan secara eksplisit melampaui susunan teks
  alternative: Keluhan Roh atau keluhan orang percaya yang dibawa Roh
  rationale: Konstruksi Yunani mengaitkan keluhan dengan tindakan pengantaraan Roh, tetapi tidak perlu diperluas menjadi uraian mengenai asal pengalaman keluhan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Sepatutnya' merangkum καθὸ δεῖ secara alami; 'menjadi pengantara' dipilih agar tindakan ὑπερεντυγχάνει jelas bagi pembaca umum. Penanda catatan kaki ditempatkan langsung sesudah frasa yang diterangkannya.
