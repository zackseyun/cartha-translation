  text: ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν ⸀σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/002.yaml
  text: For the law of the Spirit of life in Messiah Jesus has set you free from the law of sin and death[a][b][c].
translation:
  language: id
  text: Sebab hukum Roh yang memberi hidup dalam Mesias Yesus telah membebaskan kamu dari hukum dosa dan kematian.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “prinsip”: “prinsip Roh yang memberi hidup.”'
    reason: lexical_alternative
  - marker: b
    text: Beberapa naskah berbunyi “aku” dan bukan “kamu.”
    reason: textual_variant
  - marker: c
    text: 'Terjemahan tradisional: “dalam Kristus Yesus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: hukum
  rationale: Dipertahankan sebagai “hukum” pada kedua kemunculannya untuk menjaga pengulangan Paulus dan ketegangan metaforisnya; “prinsip” mungkin secara leksikal, tetapi lebih cepat mempersempit makna.
- source_word: πνεύματος τῆς ζωῆς
  choice: Roh yang memberi hidup
  rationale: Mengacu kepada Roh Kudus dalam konteks Roma 8. Ungkapan relasional Yunani diungkapkan secara alami dalam bahasa Indonesia tanpa menghilangkan peran Roh sebagai pemberi hidup.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: Kata ἐν dipertahankan sebagai “dalam” untuk menjaga bahasa persatuan dengan Mesias, sedangkan Χριστός diterjemahkan sebagai gelar “Mesias”.
- source_word: ἠλευθέρωσέν
  choice: telah membebaskan
  rationale: Bentuk aoris menyatakan tindakan pembebasan yang terjadi; “telah membebaskan” alami dan mempertahankan hasil tindakan itu bagi orang yang disapa.
- source_word: σε
  choice: kamu
  rationale: Mengikuti teks utama SBLGNT, yaitu kata ganti orang kedua tunggal; varian “aku” dicatat dalam catatan kaki.
- source_word: ἁμαρτίας καὶ τοῦ θανάτου
  choice: dosa dan kematian
  rationale: Terjemahan langsung yang mempertahankan kedua unsur terkoordinasi serta memungkinkan “dosa” dipahami sebagai realitas maupun kuasa yang memperbudak.
theological_decisions:
- issue: Apakah πνεύματος merujuk kepada Roh Kudus atau roh/prinsip rohani
  choice: Roh Kudus, ditandai dengan huruf kapital “Roh”
  alternative: roh manusia atau prinsip rohani
  rationale: Konteks Roma 8 yang mempertentangkan daging, dosa, dan kematian dengan Roh pemberi hidup paling kuat menunjuk kepada Roh Kudus.
- issue: Makna νόμος dalam dua kemunculannya
  choice: Mempertahankan “hukum” pada keduanya
  alternative: “prinsip” atau “kuasa”
  rationale: Pilihan ini menjaga permainan kata dan ketegangan teologis Paulus tanpa menetapkan terlalu dini apakah setiap kemunculan berarti hukum dalam arti ketat, prinsip yang bekerja, atau kuasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dibuat alami bagi pembaca umum sambil mempertahankan pengulangan “hukum”, istilah teologis “dalam”, dan ambiguitas metaforis teks sumber.
