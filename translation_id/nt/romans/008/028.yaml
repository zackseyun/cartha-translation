  text: Οἴδαμεν δὲ ὅτι τοῖς ἀγαπῶσι τὸν θεὸν πάντα ⸀συνεργεῖ εἰς ἀγαθόν, τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/028.yaml
  text: And we know that for those who love God, all things work together for good—for those who are called according to purpose.
translation:
  language: id
  text: Kita tahu bahwa segala sesuatu turut bekerja untuk kebaikan bagi mereka yang mengasihi Allah[a], bagi mereka yang dipanggil sesuai dengan tujuan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi, “Allah mengerjakan segala sesuatu untuk kebaikan.”
    reason: textual_variant
  - marker: b
    text: Atau “sesuai dengan tujuan-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Kita tahu
  rationale: Bentuk perfektum dengan makna keadaan kini menyatakan pengetahuan yang sudah teguh; “kita tahu” alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini merupakan penghubung ringan dalam alur argumentasi; dalam bahasa Indonesia, kesinambungannya cukup jelas tanpa kata penghubung eksplisit.
- source_word: τοῖς ἀγαπῶσι τὸν θεόν
  choice: bagi mereka yang mengasihi Allah
  rationale: “Bagi” menyampaikan fungsi datif secara alami dan mempertahankan penunjukan kelompok tersebut.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Mempertahankan keluasan bentuk jamak netral tanpa mempersempit cakupannya.
- source_word: συνεργεῖ
  choice: bekerja bersama-sama
  rationale: Mengikuti teks SBLGNT yang tidak menyebut Allah sebagai subjek eksplisit dan mempertahankan gagasan unsur-unsur yang bekerja bersama.
- source_word: εἰς ἀγαθόν
  choice: untuk mendatangkan kebaikan
  rationale: Mengungkapkan arah atau hasil secara alami dalam bahasa Indonesia tanpa menentukan secara berlebihan apakah nuansanya tujuan atau akibat.
- source_word: τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν
  choice: yaitu bagi mereka yang dipanggil sesuai dengan tujuan
  rationale: “Yaitu” memperjelas bahwa frasa ini menjelaskan kembali kelompok sebelumnya, sedangkan “sesuai dengan tujuan” tidak menambahkan pemilik yang tidak dinyatakan dalam teks Yunani.
- source_word: πρόθεσιν
  choice: tujuan
  rationale: Dalam konteks ini menunjuk pada maksud atau rencana yang disengaja; “tujuan” ringkas dan transparan.
- source_word: κλητοῖς
  choice: dipanggil
  rationale: Istilah ini mempertahankan kosakata Paulus dan tidak memaksakan penjelasan tentang cara atau mekanisme panggilan tersebut.
theological_decisions:
- issue: Subjek tersirat dari συνεργεῖ
  choice: Teks utama berbunyi “segala sesuatu bekerja bersama-sama” tanpa menjadikan Allah subjek eksplisit.
  alternative: “Allah turut bekerja dalam segala sesuatu” atau “Allah mengerjakan segala sesuatu bersama-sama.”
  rationale: Teks SBLGNT yang diberikan tidak memuat θεός sebagai subjek pada klausa ini. Varian yang menyebut Allah secara eksplisit dicatat dalam catatan kaki agar ketegangan tekstual tidak diselesaikan diam-diam.
- issue: Pemilik tujuan dalam κατὰ πρόθεσιν
  choice: Teks utama memakai “sesuai dengan tujuan” tanpa kata “-Nya.”
  alternative: “sesuai dengan tujuan-Nya.”
  rationale: Konteks mengarah pada tujuan Allah, tetapi frasa Yunani tidak memuat kata ganti posesif; alternatif idiomatis tersebut dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ayat dibuat alami bagi pembaca umum sambil mempertahankan ambiguitas teks mengenai subjek “bekerja bersama-sama” dan pemilik “tujuan”.
