id: ROM.8.34
reference: Romans 8:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τίς ὁ ⸀κατακρινῶν; ⸀Χριστὸς ὁ ἀποθανών, μᾶλλον ⸀δὲ ⸀ἐγερθείς, ὅς ⸀καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/034.yaml
  text: Who is the one condemning? Messiah Jesus is the one who died—more than that[a], who was raised—who is also at the right hand of God[d][c][b], who also intercedes for us.
translation:
  language: id
  text: Siapakah yang menghukum? Mesias[a]lah yang telah mati—bahkan lebih dari itu, yang telah dibangkitkan[b]—yang juga berada di sebelah kanan Allah[c] dan juga mengajukan permohonan bagi kita.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.”
    reason: lexical_alternative
  - marker: b
    text: 'Atau “yang telah bangkit.” Bentuk kata kerja Yunaninya pasif: “yang telah dibangkitkan.”'
    reason: alternative_reading
  - marker: c
    text: “Di sebelah kanan Allah” adalah ungkapan alkitabiah untuk kedudukan dengan kehormatan dan wewenang tertinggi.
    reason: cultural_note
  - marker: d
    text: Atau “berdoa syafaat bagi kita” atau “mengajukan permohonan atas nama kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρινῶν
  choice: yang menghukum
  rationale: Partisipel kini berartikel dipahami secara substantival dalam pertanyaan retoris. Ungkapan ini mempertahankan latar pengadilan tanpa menambahkan objek yang tidak dinyatakan.
- source_word: Χριστός
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar, bukan sekadar unsur nama diri. “Mesias” menyampaikan makna gelar itu dalam bahasa Indonesia; alternatif tradisional “Kristus” dicatat.
- source_word: ἀποθανών
  choice: yang telah mati
  rationale: Partisipel aoris diterjemahkan sebagai klausa relatif yang menyatakan peristiwa lampau yang sudah terjadi.
- source_word: μᾶλλον δὲ
  choice: bahkan lebih dari itu
  rationale: Ungkapan ini menandai peningkatan penekanan dari kematian Mesias kepada kebangkitan-Nya, bukan pertentangan sederhana.
- source_word: ἐγερθείς
  choice: yang telah dibangkitkan
  rationale: Bentuk pasif Yunani dipertahankan agar teks tetap menyajikan kebangkitan sebagai tindakan yang dikenakan kepada Mesias.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: di sebelah kanan Allah
  rationale: Ungkapan alkitabiah yang lazim ini dipertahankan; dalam konteksnya, ungkapan tersebut menunjuk pada kedudukan kehormatan dan wewenang tertinggi.
- source_word: ἐντυγχάνει
  choice: menjadi pengantara
  rationale: Pilihan ini menyampaikan tindakan mewakili dan memohon demi pihak lain, serta cukup alami dalam ragam bahasa Indonesia yang bermartabat.
- source_word: ὑπὲρ ἡμῶν
  choice: bagi kita
  rationale: Terjemahan ringkas dan alami ini mempertahankan makna tindakan yang dilakukan demi kepentingan kita.
theological_decisions:
- issue: Fungsi Χριστός sebagai gelar mesianik
  choice: Mesias
  alternative: Kristus
  rationale: Dalam susunan ini Χριστός berdiri sebagai sebutan bagi tokoh yang mati, dibangkitkan, ditinggikan, dan menjadi pengantara. Terjemahan “Mesias” mempertahankan isi gelarnya tanpa memasukkan nama “Yesus”, yang tidak terdapat dalam teks Yunani ayat ini.
- issue: Bentuk pasif ἐγερθείς
  choice: yang telah dibangkitkan
  alternative: yang telah bangkit
  rationale: Bentuk pasif dipertahankan untuk tidak menghapus cara teks menggambarkan kebangkitan sebagai tindakan yang dilakukan kepada Mesias.
- issue: Makna kedudukan di sebelah kanan Allah
  choice: ungkapan tradisional dipertahankan dalam teks dan dijelaskan dalam catatan
  alternative: berada pada kedudukan kehormatan dan wewenang tertinggi di sisi Allah
  rationale: Terjemahan utama tidak menguraikan metafora secara berlebihan, sedangkan catatan membantu pembaca memahami makna budaya dan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Partikel penegas “-lah” membuat jawaban atas pertanyaan retoris terdengar alami. Tanda pisah mempertahankan peningkatan retoris dari kematian kepada kebangkitan. Nama “Yesus” tidak ditambahkan karena tidak terdapat dalam teks SBLGNT yang diberikan.
