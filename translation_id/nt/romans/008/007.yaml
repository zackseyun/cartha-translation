  text: διότι τὸ φρόνημα τῆς σαρκὸς ἔχθρα εἰς θεόν, τῷ γὰρ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται, οὐδὲ γὰρ δύναται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/007.yaml
  text: because the mindset of the flesh is hostility toward God[a], for it does not submit to the law of God[b], for it is not even able.
translation:
  language: id
  text: Sebab pola pikir daging[a] adalah permusuhan terhadap Allah, karena pola pikir itu tidak tunduk kepada hukum Allah; sebab bahkan pola pikir itu tidak mampu tunduk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pola pikir kodrat berdosa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: sebab
  rationale: Menyatakan alasan bagi pernyataan sebelumnya dan mempertahankan daya kausal teks Yunani.
- source_word: τὸ φρόνημα
  choice: pola pikir
  rationale: Menunjuk pada orientasi atau kecenderungan pikiran, bukan hanya kegiatan intelektual; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: τῆς σαρκὸς
  choice: daging
  rationale: Mempertahankan metafora khas Paulus dan tidak langsung membatasi maknanya pada suatu tafsiran tertentu.
- source_word: ἔχθρα εἰς θεόν
  choice: permusuhan terhadap Allah
  rationale: Mempertahankan bentuk nomina ἔχθρα dan arah permusuhan yang dinyatakan oleh εἰς.
- source_word: τῷ ... νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται
  choice: tidak tunduk kepada hukum Allah
  rationale: Mengungkapkan ketidaktundukan secara wajar dan jelas, dengan tetap mempertahankan acuan kepada hukum Allah.
- source_word: οὐδὲ γὰρ δύναται
  choice: bahkan ... tidak mampu tunduk
  rationale: οὐδέ memberi penegasan, sedangkan δύναται menyatakan ketidakmampuan. Kata 'tunduk' dilengkapi dari klausa sebelumnya agar maksudnya jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Makna metaforis σάρξ
  choice: Memakai 'daging' dalam teks utama dan mencantumkan 'kodrat berdosa' sebagai alternatif penafsiran dalam catatan kaki.
  alternative: kodrat berdosa
  rationale: Konteks menunjukkan orientasi manusia yang menentang Allah, tetapi istilah sumber sengaja dipertahankan agar keluasan dan ketegangan teologis metafora Paulus tidak dihilangkan.
- issue: Pernyataan ketidakmampuan dalam klausa terakhir
  choice: Menerjemahkannya sebagai ketidakmampuan nyata untuk tunduk.
  alternative: tidak mau tunduk
  rationale: δύναται secara langsung berbicara tentang kemampuan, bukan sekadar kemauan; terjemahan tidak melunakkan atau menjelaskan ketegangan teologis tersebut lebih jauh daripada teks.
- issue: Bentuk predikatif ἔχθρα
  choice: 'Mempertahankan nomina: ''adalah permusuhan terhadap Allah''.'
  alternative: memusuhi Allah
  rationale: Bentuk nomina Yunani menyatakan identifikasi yang kuat, bukan sekadar tindakan atau sikap sesaat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Pola pikir' dipakai untuk menyampaikan orientasi batin; pengulangan frasa itu menghindari ambiguitas pronomina. Tanda titik koma memperjelas bahwa klausa terakhir menguatkan pernyataan tentang ketidaktundukan.
