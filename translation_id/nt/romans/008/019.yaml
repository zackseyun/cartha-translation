base_translation:
  language: en
  yaml_path: translation/nt/romans/008/019.yaml
  text: For the creation waits with eager expectation for the revealing of the sons of God[a].
translation:
  language: id
  text: Sebab ciptaan dengan penuh kerinduan menantikan saat anak-anak Allah dinyatakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Allah”; ungkapan ini dapat menekankan status sebagai anak dan ahli waris.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Menjaga hubungan penjelas dengan pernyataan sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ἀποκαραδοκία
  choice: dengan penuh kerinduan
  rationale: Mengungkapkan penantian yang sangat kuat dan terarah ke depan; konstruksi nomina Yunani dialihkan menjadi keterangan agar alami dalam bahasa Indonesia.
- source_word: κτίσεως
  choice: seluruh ciptaan
  rationale: Dipahami secara kolektif sebagai tatanan ciptaan dalam cakupan kosmis konteks ini; 'seluruh' memperjelas makna kolektif tanpa mengarah pada satu makhluk.
- source_word: ἀποκάλυψιν
  choice: saat ... dinyatakan
  rationale: Menyampaikan penyingkapan atau pemunculan terbuka pada masa mendatang dengan ungkapan Indonesia yang alami.
- source_word: υἱῶν
  choice: anak-anak
  rationale: Dalam bentuk jamak, 'anak-anak Allah' merupakan ungkapan Indonesia yang alami dan mencakup umat Allah, sementara catatan kaki mempertahankan informasi bahwa Yunani secara harfiah berbunyi 'putra-putra' serta kemungkinan nuansa status ahli waris.
- source_word: θεοῦ
  choice: Allah
  rationale: Digabungkan dalam frasa relasional yang lazim, 'anak-anak Allah'.
- source_word: ἀπεκδέχεται
  choice: menanti-nantikan
  rationale: Bentuk ulang menegaskan penantian yang berkelanjutan dan penuh harap, selaras dengan intensitas ἀποκαραδοκία.
theological_decisions:
- issue: Apakah υἱῶν θεοῦ diterjemahkan secara harfiah sebagai 'putra-putra Allah' atau secara idiomatis sebagai 'anak-anak Allah'.
  choice: anak-anak Allah
  alternative: putra-putra Allah
  rationale: Bahasa Indonesia lazim memakai 'anak-anak Allah' untuk identitas filial semua orang percaya tanpa pembatasan gender. Catatan kaki menjaga bentuk maskulin Yunani dan kemungkinan penekanannya pada status sebagai anak serta ahli waris.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Menanti-nantikan dengan penuh kerinduan' mempertahankan intensitas gabungan ἀποκαραδοκία dan ἀπεκδέχεται tanpa menghasilkan susunan abstrak yang kaku.
