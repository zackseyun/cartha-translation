reference: Romans 8:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ πνεῦμα τοῦ ἐγείραντος ⸀τὸν Ἰησοῦν ἐκ νεκρῶν οἰκεῖ ἐν ὑμῖν, ὁ ἐγείρας ⸂ἐκ νεκρῶν Χριστὸν Ἰησοῦν⸃ ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ ⸂τὸ ἐνοικοῦν αὐτοῦ πνεῦμα⸃ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/011.yaml
  text: And if the Spirit of the one who raised Jesus from the dead dwells in you[b][a], the one who raised Messiah Jesus from the dead will also give life to your mortal bodies through his Spirit dwelling in you.
translation:
  language: id
  text: Jika Roh dari Dia yang membangkitkan Yesus dari antara orang-orang mati tinggal di dalam kamu, Dia yang membangkitkan Mesias Yesus[a] dari antara orang-orang mati juga akan menghidupkan tubuhmu yang fana karena Roh-Nya yang tinggal di dalam kamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: “Kristus Yesus”; Kristus berarti Mesias, yaitu “Yang Diurapi”.'
    reason: lexical_alternative
  - marker: b
    text: Atau, “melalui Roh-Nya yang tinggal di dalam kamu.”
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: Roh
  rationale: Kedua pemunculan merujuk kepada Roh Allah dalam alur argumentasi Paulus; huruf kapital memperjelas rujukan personal tanpa mengubah makna.
- source_word: ἐγείραντος / ἐγείρας
  choice: membangkitkan
  rationale: Istilah baku dan alami untuk tindakan Allah membangkitkan Yesus dari kematian, dengan tetap mempertahankan makna kebangkitan jasmani.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Ungkapan ini mencerminkan konstruksi Yunani dan menyampaikan bahwa Yesus dibangkitkan dari kumpulan atau ranah orang mati.
- source_word: οἰκεῖ / ἐνοικοῦν
  choice: tinggal / yang tinggal
  rationale: Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kesinambungan leksikal mengenai Roh yang berdiam dalam umat.
- source_word: Χριστὸν Ἰησοῦν
  choice: Mesias Yesus
  rationale: Χριστός masih memiliki daya sebagai gelar, bukan nama keluarga; 'Mesias' mengungkapkan makna gelar itu dalam bahasa Indonesia modern.
- source_word: ζῳοποιήσει
  choice: akan menghidupkan
  rationale: Menjaga bentuk masa depan dan tindakan pemberian hidup secara langsung serta alami.
- source_word: θνητὰ σώματα ὑμῶν
  choice: tubuhmu yang fana
  rationale: Mempertahankan kekonkretan tubuh jasmani dan sifatnya yang tunduk kepada kematian; bentuk '-mu' sesuai dengan kata ganti jamak dalam sapaan kepada komunitas.
- source_word: διὰ τὸ ἐνοικοῦν αὐτοῦ πνεῦμα
  choice: karena Roh-Nya yang tinggal di dalam kamu
  rationale: Teks utama SBLGNT memakai διά dengan akusatif, yang secara paling langsung menyatakan alasan atau dasar. Varian instrumental dicatat dalam catatan kaki.
theological_decisions:
- issue: Daya kausal atau instrumental dari frasa penutup
  choice: karena Roh-Nya yang tinggal di dalam kamu
  alternative: melalui Roh-Nya yang tinggal di dalam kamu
  rationale: Terjemahan utama mengikuti bentuk akusatif dalam teks SBLGNT dan mempertahankan daya kausalnya. Bacaan genitif yang mendukung makna instrumental tidak disamarkan, tetapi dicatat sebagai varian.
- issue: Daya gelar Χριστός
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Pemakaian 'Mesias' mempertahankan arti gelar 'Yang Diurapi' dan mencegahnya terbaca sekadar sebagai bagian dari nama diri; bentuk tradisional dicatat untuk transparansi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan hubungan bersyarat dan pengulangan retoris teks Yunani. Sapaan jamak ὑμῖν/ὑμῶν diterjemahkan dengan 'kamu', yang dapat berfungsi jamak dalam bahasa Indonesia; 'tubuhmu' menunjuk kepada tubuh setiap anggota komunitas.
