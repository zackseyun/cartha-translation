  text: εἰ δὲ ὃ οὐ βλέπομεν ἐλπίζομεν, δι’ ὑπομονῆς ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/025.yaml
  text: But if we hope for what we do not see[b][a], we wait for it with patient endurance.
translation:
  language: id
  text: Namun, jika kita mengharapkan apa yang tidak kita lihat, kita menantikannya[b] dengan ketabahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan ketekunan.”
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Yunaninya juga dapat berarti “menantikan dengan penuh harap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Namun, jika
  rationale: Mempertahankan daya syarat εἰ serta hubungan lanjutan yang agak kontras dari δέ; ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan alur ayat sebelumnya.
- source_word: ὃ οὐ βλέπομεν
  choice: apa yang tidak kita lihat
  rationale: Menerjemahkan pronomina relatif netral ὃ secara idiomatis tanpa mengubah bentuk kini βλέπομεν atau menambahkan bahwa hal itu tidak dapat dilihat.
- source_word: ἐλπίζομεν
  choice: kita mengharapkan
  rationale: Mengungkapkan harapan yang tertuju pada objek dalam klausa relatif dan mempertahankan aspek tindakan yang sedang berlangsung.
- source_word: δι’ ὑπομονῆς
  choice: dengan tekun
  rationale: Mengungkapkan ketabahan yang sabar dan terus bertahan selama penantian, bukan sekadar sikap pasif.
- source_word: ἀπεκδεχόμεθα
  choice: kita menantikannya
  rationale: Kata 'menantikan' secara alami menyatakan penantian yang berorientasi kepada penggenapan; nuansa penantian yang sungguh-sungguh dicatat sebagai alternatif.
theological_decisions:
- issue: Objek harapan Kristen yang belum terlihat
  choice: Tetap dinyatakan sebagai 'apa yang tidak kita lihat'.
  alternative: Memperjelasnya sebagai keselamatan, penebusan tubuh, atau kebangkitan.
  rationale: Walaupun konteks membantu menentukan rujukannya, ayat ini sendiri memakai klausa relatif yang tidak merinci objek tersebut. Terjemahan mempertahankan keluasan dan ketegangan teks.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. Susunan kalimat dibuat ringkas untuk pembaca umum, sementara catatan kaki mempertahankan keluasan makna ὑπομονή dan daya ekspektatif ἀπεκδέχομαι.
