id: ROM.8.3
reference: Romans 8:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὸ γὰρ ἀδύνατον τοῦ νόμου, ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινε τὴν ἁμαρτίαν ἐν τῇ σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/003.yaml
  text: For what the law could not do[a], in that it was weak through the flesh, God did by sending his own Son in the likeness of sinful flesh and for sin; he condemned sin in the flesh[d][c][b],
translation:
  language: id
  text: Sebab, apa yang tidak sanggup dilakukan hukum Taurat[a], karena hukum itu lemah oleh daging, telah dilakukan Allah dengan mengutus Anak-Nya sendiri dalam keserupaan daging yang berdosa[d] dan untuk dosa[c]. Ia menjatuhkan hukuman atas dosa di dalam daging[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “ketidakmampuan hukum Taurat.”'
    reason: lexical_alternative
  - marker: b
    text: “Daging” di sini kemungkinan menunjuk pada keberadaan manusia dalam kelemahannya yang telah jatuh; dalam konteks lain istilah ini kadang diterjemahkan secara lebih interpretatif sebagai “tabiat berdosa.”
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “sebagai kurban penghapus dosa.” Ungkapan Yunani “untuk dosa” dapat memiliki makna kurban seperti ini.'
    reason: alternative_reading
  - marker: d
    text: Ungkapan “dalam keserupaan daging yang berdosa” menegaskan bahwa Anak sungguh menjadi manusia, tetapi tidak menyatakan bahwa Ia sendiri berdosa.
    reason: cultural_note
lexical_decisions:
- source_word: τὸ ἀδύνατον τοῦ νόμου
  choice: apa yang tidak sanggup dilakukan hukum Taurat
  rationale: Ungkapan netral ini menunjuk pada ketidakmampuan hukum untuk mencapai sesuatu. Bentuk klausal ini alami dalam bahasa Indonesia dan dilengkapi dengan 'telah dilakukan Allah' sebagai padanan predikat yang tersirat dalam bahasa Yunani.
- source_word: νόμος
  choice: hukum Taurat
  rationale: Dalam konteks Roma, νόμος merujuk pada hukum yang diberikan kepada Israel. 'Hukum Taurat' jelas bagi pembaca Indonesia tanpa menjadikan hukum itu penyebab kelemahan.
- source_word: ἐν ᾧ ἠσθένει
  choice: karena hukum itu lemah
  rationale: Klausa ini menjelaskan mengapa hukum tidak sanggup melaksanakan hal tersebut. Pengulangan 'hukum itu' menghindari rujukan pronominal yang kabur.
- source_word: διὰ τῆς σαρκός
  choice: oleh daging
  rationale: Mempertahankan metafora Paulus dan ambiguitas cakupan σάρξ. 'Oleh' menyatakan bahwa kelemahan hukum terjadi melalui atau karena kondisi daging, bukan karena cacat pada hukum itu sendiri.
- source_word: πέμψας
  choice: dengan mengutus
  rationale: 'Partisip aoristus dipahami secara instrumental: Allah melakukan hal itu dengan mengutus Anak-Nya.'
- source_word: τὸν ἑαυτοῦ υἱόν
  choice: Anak-Nya sendiri
  rationale: '''Sendiri'' mempertahankan penekanan ἑαυτοῦ pada relasi Anak dengan Allah.'
- source_word: ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: dalam keserupaan dengan daging yang berdosa
  rationale: Terjemahan ini mempertahankan 'keserupaan' serta konstruksi padat Paulus, tanpa menyatakan bahwa Anak itu sendiri berdosa ataupun mengurangi kenyataan kemanusiaan-Nya.
- source_word: περὶ ἁμαρτίας
  choice: untuk dosa
  rationale: Terjemahan utama mempertahankan keluasan ungkapan Yunani. Nuansa kurban penghapus dosa yang mungkin dimaksud dicatat dalam catatan kaki.
- source_word: κατέκρινε τὴν ἁμαρτίαν
  choice: menjatuhkan hukuman atas dosa
  rationale: Mengungkapkan daya forensik κατέκρινε secara alami; dosa diperlakukan sebagai pihak yang dijatuhi hukuman.
- source_word: ἐν τῇ σαρκί
  choice: di dalam daging
  rationale: Tidak menambahkan kata ganti 'tubuh-Nya' karena teks Yunani tidak memilikinya, sehingga kepadatan dan kemungkinan rujukannya tetap terpelihara.
theological_decisions:
- issue: Makna σάρξ dalam ayat ini
  choice: Kedua kemunculannya diterjemahkan 'daging'.
  alternative: '''tabiat berdosa'' atau ''manusia dalam kelemahannya'''
  rationale: '''Daging'' menjaga hubungan verbal antara kelemahan manusia, inkarnasi Anak, dan tempat dosa dihukum, tanpa memasukkan satu tafsiran tertentu ke dalam teks utama.'
- issue: Makna περὶ ἁμαρτίας
  choice: Diterjemahkan 'untuk dosa' dalam teks utama.
  alternative: '''sebagai kurban penghapus dosa'' atau ''mengenai dosa'''
  rationale: Ungkapan ini dapat memiliki makna kurban berdasarkan pemakaian Septuaginta, tetapi secara leksikal juga lebih luas. Teks utama mempertahankan ambiguitas, sedangkan makna kurban dicantumkan sebagai alternatif.
- issue: Daya kristologis ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: Mempertahankan 'dalam keserupaan dengan daging yang berdosa'.
  alternative: Parafrasa yang secara eksplisit mengatakan bahwa Anak memiliki tubuh manusia tetapi tidak berdosa
  rationale: Bentuk Yunani menegaskan hubungan nyata Anak dengan keadaan manusia sekaligus mengungkapkannya secara hati-hati. Terjemahan tidak boleh menyebut Anak berdosa atau mengubah 'keserupaan' menjadi kemanusiaan semu.
- issue: Pelaku dan tindakan utama dalam konstruksi eliptis
  choice: Menambahkan 'telah dilakukan Allah' lalu menyatakan 'Ia menjatuhkan hukuman'.
  alternative: Menata ulang seluruh kalimat menjadi 'Allah melakukan apa yang tidak dapat dilakukan hukum Taurat'
  rationale: Bahasa Yunani mengedepankan ketidakmampuan hukum, lalu menyebut Allah dan tindakan-Nya. Pelengkapan ini menghasilkan kalimat Indonesia yang utuh sambil mempertahankan susunan retoris tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'hukum Taurat' dipakai agar rujukan νόμος jelas bagi pembaca umum. 'Daging' sengaja dipertahankan sebagai istilah teologis berlapis dan diterangkan dalam catatan kaki. Struktur ayat mengikuti gerak retoris Yunani, tetapi dibagi menjadi dua kalimat agar mudah dipahami.
