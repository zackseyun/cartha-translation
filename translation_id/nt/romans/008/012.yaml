  yaml_path: translation/nt/romans/008/012.yaml
  text: So then[a], brothers, we are debtors—not to the flesh[b], to live according to the flesh.
translation:
  language: id
  text: Jadi, Saudara-saudara[a], kita berutang—bukan kepada daging[b], yang mengharuskan kita hidup menurut daging.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudari”; kata Yunani yang secara harfiah berarti “saudara-saudara laki-laki” dipakai sebagai sapaan kepada seluruh komunitas orang percaya.
    reason: lexical_alternative
  - marker: b
