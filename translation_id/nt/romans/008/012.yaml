    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Jadi
  rationale: Gabungan partikel ini menarik kesimpulan dari uraian sebelumnya; “Jadi” menyampaikan daya simpulan dan peralihannya secara alami dalam bahasa Indonesia modern.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan ini secara gramatikal berbentuk maskulin jamak, tetapi dalam konteks jemaat mencakup seluruh komunitas orang percaya. “Saudara-saudara” merupakan sapaan jemaat yang wajar dan tetap dekat dengan bentuk Yunani.
- source_word: ὀφειλέται ἐσμέν
  choice: kita adalah orang yang berutang
  rationale: Ungkapan ini mempertahankan metafora utang dalam ὀφειλέται, sementara konteks menunjukkan kewajiban moral, bukan semata-mata utang keuangan.
- source_word: τῇ σαρκί
  choice: kepada daging
  rationale: Bentuk datif menyatakan pihak yang kepadanya utang atau kewajiban itu tertuju. “Daging” mempertahankan istilah teologis Paulus tanpa menafsirkannya secara terlalu sempit.
- source_word: τοῦ κατὰ σάρκα ζῆν
  choice: untuk hidup menurut daging
  rationale: Terjemahan ini mempertahankan kaitan infinitif dengan kewajiban yang disangkal dan mencerminkan idiom Paulus κατὰ σάρκα secara dekat.
theological_decisions:
- issue: Makna σάρξ dalam pertentangan Paulus antara daging dan Roh
  choice: daging
  alternative: tabiat berdosa
  rationale: “Daging” mempertahankan kosakata dan ketegangan teologis Paulus. Dalam konteks ini istilah tersebut melampaui tubuh jasmani, tetapi menerjemahkannya langsung sebagai “tabiat berdosa” akan menetapkan satu penafsiran di dalam teks utama.
- issue: Cakupan sapaan ἀδελφοί
  choice: Saudara-saudara
  alternative: saudara-saudari
  rationale: Bentuk sumber adalah maskulin jamak, sedangkan konteks menunjukkan bahwa seluruh komunitas orang percaya disapa. Teks utama mempertahankan bentuk sapaan yang dekat dengan sumber dan catatan menjelaskan cakupan inklusifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat sengaja mempertahankan metafora utang serta pengulangan “daging” yang penting bagi alur argumentasi Paulus.
