id: ROM.8.30
reference: Romans 8:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/030.yaml
  text: And those whom he predestined[a], he also called; and those whom he called, he also justified; and those whom he justified[b], he also glorified.
translation:
  language: id
  text: Dan mereka yang telah Ia tentukan sebelumnya[a], juga Ia panggil; dan mereka yang telah Ia panggil, juga Ia benarkan; dan mereka yang telah Ia benarkan, juga Ia muliakan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menetapkan sebelumnya” atau “menakdirkan.”
    reason: lexical_alternative
  - marker: b
    text: Verba Yunani yang diterjemahkan “Ia muliakan” berbentuk aoris (lampau). Sebagian orang memahaminya sebagai kemuliaan pada masa depan yang begitu pasti sehingga digambarkan seolah-olah sudah terlaksana.
    reason: alternative_reading
lexical_decisions:
- source_word: προώρισεν
  choice: telah Ia tentukan sebelumnya
  rationale: Ungkapan ini menyampaikan tindakan menentukan lebih dahulu secara jelas dan alami dalam bahasa Indonesia, tanpa memasukkan pengertian denominasi tertentu.
- source_word: ἐκάλεσεν
  choice: telah Ia panggil
  rationale: Mempertahankan padanan baku καλέω dan kaitan berurutan dalam argumen Paulus tanpa memperinci sifat panggilan itu.
- source_word: ἐδικαίωσεν
  choice: telah Ia benarkan
  rationale: Dalam pemakaian Paulus, δικαιόω lazim memiliki nuansa forensik. 'Benarkan' ringkas dan mempertahankan istilah teologis, sedangkan arti 'nyatakan benar' dicatat sebagai penjelasan alternatif.
- source_word: ἐδόξασεν
  choice: telah Ia muliakan
  rationale: Bentuk aoris indikatif diterjemahkan sebagai tindakan lampau agar rangkaian retoris Paulus tetap utuh; kemungkinan acuan kepada kemuliaan masa depan dijelaskan dalam catatan kaki.
- source_word: οὓς ... τούτους
  choice: mereka yang ... Ia
  rationale: Susunan ini alami dalam bahasa Indonesia dan mempertahankan bahwa kelompok yang sama berlanjut pada setiap tahap.
- source_word: καὶ
  choice: juga
  rationale: Mencerminkan daya aditif καί dalam setiap klausa dan memperjelas perkembangan rangkaian tindakan.
- source_word: δὲ
  choice: dan
  rationale: δέ berfungsi sebagai penghubung ringan, bukan pertentangan kuat, sehingga 'dan' sesuai dengan alur ayat.
theological_decisions:
- issue: Apakah προώρισεν perlu diperhalus untuk menghindari implikasi denominasi
  choice: telah Ia tentukan sebelumnya
  alternative: telah Ia tetapkan sebelumnya; telah Ia takdirkan
  rationale: Teks Yunani menyatakan penentuan sebelumnya. Terjemahan mempertahankan makna itu tanpa menjelaskan objek, cara, atau dasar penentuan sehingga ketegangan teologis tidak diselesaikan secara sepihak.
- issue: Apakah ἐδόξασεν diterjemahkan sebagai lampau atau masa depan
  choice: telah Ia muliakan
  alternative: akan Ia muliakan
  rationale: Bahasa Yunani memakai aoris indikatif, sehingga bentuk lampau dipertahankan dalam teks utama. Pemahaman proleptis yang mengacu pada kemuliaan masa depan dicatat sebagai kemungkinan dalam catatan kaki.
- issue: Nuansa forensik ἐδικαίωσεν
  choice: telah Ia benarkan
  alternative: telah Ia nyatakan benar
  rationale: Pilihan utama mempertahankan istilah ringkas dan hubungan verbal dalam rangkaian Paulus; alternatif menjelaskan nuansa deklaratif tanpa memasukkannya secara berlebihan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan pola 'mereka yang ... juga Ia ...' sengaja dipertahankan untuk mencerminkan rangkaian retoris teks Yunani. Kapitalisasi 'Ia' digunakan bagi Allah sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia.
