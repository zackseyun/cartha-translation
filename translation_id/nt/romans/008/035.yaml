id: ROM.8.35
reference: Romans 8:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης τοῦ Χριστοῦ; θλῖψις ἢ στενοχωρία ἢ διωγμὸς ἢ λιμὸς ἢ γυμνότης ἢ κίνδυνος ἢ μάχαιρα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/035.yaml
  text: Who will separate us from the Messiah’s love? Will trouble or distress or persecution or famine or nakedness or danger or sword?[a]
translation:
  language: id
  text: Siapakah yang akan memisahkan kita dari kasih Mesias?[a] Apakah kesengsaraan, kesesakan, penganiayaan, kelaparan, ketelanjangan, bahaya, atau pedang?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kasih kita kepada Mesias.” Bentuk genitif dalam bahasa Yunani dapat dipahami demikian, meskipun konteks lebih mendukung arti “kasih Mesias kepada kita.”
    reason: alternative_reading
lexical_decisions:
- source_word: τίς
  choice: Siapakah
  rationale: Kata tanya ini membuka pertanyaan retoris Paulus. Bentuk “Siapakah” alami dan tetap mempertahankan peralihan retoris menuju daftar keadaan yang diperlakukan seolah-olah dapat bertindak sebagai pemisah.
- source_word: χωρίσει
  choice: akan memisahkan
  rationale: Bentuk futur aktif menyatakan tindakan pemisahan yang mungkin atau akan terjadi; “akan memisahkan” merupakan padanan langsung dan wajar.
- source_word: ἀγάπης
  choice: kasih
  rationale: “Kasih” adalah padanan baku dan bermartabat bagi ἀγάπη dalam konteks ini.
- source_word: τοῦ Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar. Susunan “kasih Mesias” wajar dalam bahasa Indonesia dan tidak memaksakan penjelasan tambahan ke dalam teks utama.
- source_word: θλῖψις
  choice: penindasan
  rationale: Kata ini menunjuk tekanan atau penderitaan berat. “Penindasan” mempertahankan gambaran tekanan dan sesuai dengan rangkaian ancaman yang dialami orang percaya.
- source_word: στενοχωρία
  choice: kesesakan
  rationale: “Kesesakan” menangkap nuansa keadaan terjepit atau tertekan dan membedakannya dari θλῖψις.
- source_word: διωγμός
  choice: penganiayaan
  rationale: Ini adalah padanan Indonesia yang tepat dan lazim untuk tindakan mengejar serta menyakiti karena permusuhan.
- source_word: λιμός
  choice: kelaparan
  rationale: “Kelaparan” dapat menunjuk kekurangan makanan yang parah dan lebih alami dalam bahasa Indonesia daripada istilah yang hanya menyatakan rasa lapar pribadi.
- source_word: γυμνότης
  choice: ketelanjangan
  rationale: Padanan langsung ini mempertahankan gambaran tidak adanya pakaian, termasuk keadaan melarat dan tidak terlindungi.
- source_word: κίνδυνος
  choice: bahaya
  rationale: “Bahaya” adalah padanan modern, jelas, dan mencakup ancaman serius secara umum.
- source_word: μάχαιρα
  choice: pedang
  rationale: Terjemahan harfiah ini mempertahankan citra senjata sekaligus ancaman kekerasan mematikan.
theological_decisions:
- issue: Daya genitif dalam τοῦ Χριστοῦ
  choice: kasih Mesias, dipahami dalam konteks sebagai kasih Mesias kepada kita
  alternative: kasih kita kepada Mesias
  rationale: Secara gramatikal, genitif Yunani dapat dipahami secara subjektif atau objektif. Konteks Roma 8:31–39 lebih kuat menunjuk kepada kasih Mesias bagi umat-Nya, tetapi kemungkinan alternatif tetap dicatat agar ketegangan asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pertanyaan kedua memakai “Apakah” agar daftar keadaan terdengar alami, sementara pengulangan unsur daftar dengan koma mempertahankan daya retoris tanpa membuat kalimat kaku.
