  naturalness: Kalimatnya baku, jelas, dan bernada wibawa. Susunan “Apakah ... atau ...?” efektif untuk meneruskan pertanyaan retoris setelah “Siapakah,” dengan daftar keadaan yang dipersonifikasikan.
