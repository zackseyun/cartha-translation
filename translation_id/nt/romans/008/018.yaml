  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/018.yaml
  text: For I consider that the sufferings of the present time are not worthy to be compared with the coming glory that is to be revealed to us[a].
translation:
  language: id
  text: Sebab aku menilai bahwa penderitaan pada masa sekarang tidak sebanding dengan kemuliaan yang akan datang, yang akan dinyatakan kepada kita[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalam kita.”
    reason: εἰς ἡμᾶς dapat dipahami sebagai penyataan yang diarahkan kepada kita atau yang terjadi di dalam kita.
lexical_decisions:
- source_word: Λογίζομαι
  choice: aku menilai
  rationale: Mengungkapkan pertimbangan atau penilaian yang beralasan, bukan sekadar perasaan; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan fungsi penghubung yang memberi dasar atau penjelasan bagi pernyataan sebelumnya.
- source_word: οὐκ ἄξια ... πρὸς
  choice: tidak sebanding dengan
  rationale: Menyampaikan ketidaksetaraan dalam perbandingan secara ringkas dan idiomatis tanpa menambahkan gagasan bahwa penderitaan itu sendiri tidak bernilai.
- source_word: τὰ παθήματα
  choice: penderitaan-penderitaan
  rationale: Mempertahankan bentuk jamak Yunani dan menunjuk pada berbagai penderitaan yang dialami.
- source_word: τοῦ νῦν καιροῦ
  choice: pada masa sekarang
  rationale: καιρός menunjuk pada masa atau waktu kini; 'masa sekarang' jelas tanpa menambahkan makna 'zaman' yang tidak harus tersurat.
- source_word: τὴν μέλλουσαν δόξαν
  choice: kemuliaan yang akan datang
  rationale: Mempertahankan unsur kemuliaan dan orientasi ke depan yang dinyatakan oleh μέλλουσαν.
- source_word: ἀποκαλυφθῆναι
  choice: yang akan dinyatakan
  rationale: Mempertahankan bentuk pasif serta gagasan bahwa kemuliaan itu kelak disingkapkan atau dibuat nyata.
- source_word: εἰς ἡμᾶς
  choice: kepada kita
  rationale: Merupakan padanan Indonesia yang alami untuk arah atau sasaran penyataan, sementara kemungkinan makna partisipatif dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna εἰς ἡμᾶς dalam penyataan kemuliaan
  choice: kepada kita
  alternative: di dalam kita
  rationale: Frasa Yunani ini dapat menunjukkan kemuliaan yang dinyatakan kepada orang percaya atau di dalam diri mereka. Teks utama memakai padanan arah yang alami, sedangkan nuansa partisipatif yang penting tidak dihapus, tetapi dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang bermartabat dan mudah dipahami. Pengulangan 'yang akan' dipertahankan untuk membedakan unsur μέλλουσαν ('yang akan datang') dari ἀποκαλυφθῆναι ('yang akan dinyatakan').
