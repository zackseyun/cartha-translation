id: ROM.8.29
reference: Romans 8:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/029.yaml
  text: For those whom he foreknew[a], he also predestined to be conformed to the image of his Son[b], so that he might be the firstborn among many brothers.
translation:
  language: id
  text: Sebab, mereka yang telah Ia kenal sebelumnya[a] juga telah ditentukan-Nya sebelumnya untuk menjadi serupa dengan gambaran Anak-Nya, supaya Anak itu menjadi yang sulung di antara banyak saudara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah diketahui-Nya sebelumnya”; sebagian orang memahami “telah Ia kenal sebelumnya” di sini dalam arti relasional, yaitu “telah menjadi sasaran perhatian-Nya sebelumnya.”
    reason: alternative_reading
  - marker: b
    text: Kata Yunani yang diterjemahkan “saudara” berbentuk maskulin secara gramatikal, tetapi dalam konteks keluarga Allah dapat mencakup laki-laki dan perempuan.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Menghubungkan ayat ini dengan alasan bagi pernyataan sebelumnya dan secara alami mempertahankan fungsi penjelasnya.
- source_word: προέγνω
  choice: telah dikenal-Nya sebelumnya
  rationale: Mempertahankan arti dasar 'mengenal sebelumnya' tanpa memutuskan apakah pengenalan itu terutama bersifat kognitif atau relasional.
- source_word: προώρισεν
  choice: telah ditentukan-Nya sebelumnya
  rationale: Menyampaikan unsur penetapan yang dilakukan lebih dahulu tanpa bergantung pada istilah teknis denominasi tertentu.
- source_word: συμμόρφους
  choice: untuk menjadi serupa
  rationale: Mengungkapkan kesesuaian bentuk atau keserupaan secara alami dalam bahasa Indonesia, dengan nuansa hasil yang dimaksudkan oleh konstruksi kalimat.
- source_word: τῆς εἰκόνος
  choice: dengan gambar
  rationale: Kata 'gambar' mempertahankan padanan langsung dan gema alkitabiah εἰκών; preposisi 'dengan' menghasilkan ungkapan Indonesia yang wajar setelah 'serupa'.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: Anak-Nya
  rationale: Mempertahankan gelar kristologis dan hubungan keanakan yang dinyatakan secara eksplisit.
- source_word: εἰς τὸ εἶναι
  choice: supaya ... menjadi
  rationale: Menyampaikan daya tujuan atau hasil dari konstruksi εἰς dengan infinitif berartikel tanpa meniadakan kedekatan antara kedua nuansa itu.
- source_word: πρωτότοκον
  choice: yang sulung
  rationale: Mempertahankan metafora kelahiran dan makna keutamaan yang melekat padanya dalam bentuk Indonesia yang lazim.
- source_word: ἐν πολλοῖς ἀδελφοῖς
  choice: di antara banyak saudara
  rationale: Menyampaikan lingkup relasional frasa Yunani secara alami; 'saudara' dapat merujuk pada sesama anggota keluarga Allah, sementara cakupan gender dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Apakah προέγνω harus diterjemahkan dengan cara yang menyelesaikan perdebatan tentang pengetahuan sebelumnya dan pemilihan.
  choice: telah dikenal-Nya sebelumnya
  alternative: telah diketahui-Nya sebelumnya; telah diperhatikan-Nya sebelumnya
  rationale: Pilihan ini mempertahankan verba personal 'mengenal' dan unsur waktu sebelumnya, tetapi tidak memasukkan tafsiran doktrinal tertentu ke dalam teks.
- issue: Apakah προώρισεν harus memakai istilah teknis 'dipredestinasikan'.
  choice: telah ditentukan-Nya sebelumnya
  alternative: telah ditakdirkan-Nya; telah ditetapkan-Nya sebelumnya
  rationale: Ungkapan ini transparan bagi pembaca Indonesia modern serta mempertahankan tindakan ilahi dan unsur 'sebelumnya' dalam verba Yunani.
- issue: Apakah εἰς τὸ εἶναι harus dibatasi sebagai tujuan atau hasil.
  choice: supaya Anak itu menjadi
  alternative: sehingga Anak itu menjadi
  rationale: '''Supaya'' menampilkan daya telis yang kuat, sementara konteks juga memungkinkan hasil yang dimaksudkan; terjemahan tidak menjelaskan mekanismenya lebih jauh.'
- issue: Apakah ἀδελφοῖς perlu dibuat eksplisit sebagai laki-laki dan perempuan di dalam teks utama.
  choice: saudara
  alternative: saudara-saudari
  rationale: Bentuk Yunani secara gramatikal maskulin, tetapi dapat mencakup komunitas campuran. 'Saudara' mempertahankan bentuk ringkas dan konteks kekeluargaan, dengan cakupan potensialnya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dengan enklitik -Nya mempertahankan subjek ilahi secara ringkas. Pengulangan 'sebelumnya' sengaja dipertahankan untuk mencerminkan prefiks προ- pada kedua verba Yunani, sedangkan 'Anak itu' memperjelas bahwa subjek klausa tujuan adalah Anak, bukan Allah.
