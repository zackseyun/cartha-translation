  to: Bukan hanya itu, tetapi kita sendiri juga, yang memiliki buah sulung dari Roh[a], kita sendiri mengeluh di dalam diri kita sendiri sambil menantikan dengan penuh kerinduan pengangkatan sebagai anak[b], yaitu penebusan tubuh kita[c].
  rationale: Revisi mengganti idiom yang terlalu spesifik dengan padanan yang lebih dekat kepada ἐν ἑαυτοῖς, memulihkan tekanan kedua pada «kita sendiri», dan memperhalus catatan tentang υἱοθεσίαν agar akurat secara leksikal serta tidak mengecualikan perempuan. Hubungan aposisional antara pengangkatan sebagai anak dan penebusan tubuh dipertahankan melalui «yaitu», sesuai sintaks Yunani.
