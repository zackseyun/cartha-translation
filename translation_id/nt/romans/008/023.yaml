id: ROM.8.23
reference: Romans 8:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ ⸂καὶ αὐτοὶ⸃ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες ⸂ἡμεῖς καὶ⸃ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν, υἱοθεσίαν ἀπεκδεχόμενοι τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/023.yaml
  text: And not only that[a], but we ourselves also, who have the firstfruits of the Spirit, even we ourselves groan within ourselves[c][b], eagerly awaiting adoption as sons—the redemption of our bodies.
translation:
  language: id
  text: Bukan hanya itu, tetapi kita sendiri juga, yang memiliki buah sulung dari Roh[a], kita sendiri mengeluh di dalam diri kita sendiri sambil menantikan dengan penuh kerinduan pengangkatan sebagai anak[b], yaitu penebusan tubuh kita[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “Roh sebagai buah sulung.”
    reason: alternative_reading
  - marker: b
    text: Istilah Yunani ini secara harfiah berkaitan dengan penetapan sebagai anak laki-laki dan mencakup status sebagai ahli waris; dalam konteks ini rujukannya mencakup semua orang percaya.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “tubuh kita”; bentuk tunggal Yunani dipakai secara distributif untuk tubuh masing-masing orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ
  choice: Bukan hanya itu, tetapi
  rationale: Meneruskan perbandingan dengan ayat sebelumnya secara alami sambil mempertahankan struktur penegasan dan pertentangan Paulus.
- source_word: καὶ αὐτοὶ / ἡμεῖς καὶ αὐτοὶ
  choice: kita sendiri juga
  rationale: Mengungkapkan penekanan bahwa orang percaya sendiri pun turut mengeluh, tanpa pengulangan yang terasa kaku dalam bahasa Indonesia.
- source_word: τὴν ἀπαρχὴν τοῦ πνεύματος
  choice: buah sulung dari Roh
  rationale: Mempertahankan metafora ἀπαρχή dan ambiguitas hubungan genitif, dengan kemungkinan apposisional dijelaskan dalam catatan kaki.
- source_word: ἔχοντες
  choice: yang memiliki
  rationale: Klausa relatif merupakan bentuk Indonesia yang alami untuk menerjemahkan partisipel ini.
- source_word: ἐν ἑαυτοῖς
  choice: dalam hati
  rationale: Menyampaikan lokasi batiniah dari keluhan secara idiomatis; bukan menunjuk organ fisik.
- source_word: στενάζομεν
  choice: mengeluh
  rationale: Menggambarkan erangan atau keluhan batin dan mempertahankan kaitannya dengan keluhan ciptaan dalam konteks.
- source_word: υἱοθεσίαν
  choice: pengangkatan sebagai anak
  rationale: Mengungkapkan tindakan pemberian status anak dalam bahasa Indonesia yang wajar, tanpa membatasi rujukannya hanya kepada laki-laki.
- source_word: ἀπεκδεχόμενοι
  choice: dengan penuh kerinduan menantikan
  rationale: Menyampaikan penantian yang kuat dan penuh harap dalam bentuk yang alami.
- source_word: τὴν ἀπολύτρωσιν
  choice: penebusan
  rationale: Mempertahankan kosakata teologis Paulus dan bobot eskatologisnya.
- source_word: τοῦ σώματος ἡμῶν
  choice: tubuh kita
  rationale: Mengikuti bentuk tunggal distributif bahasa Yunani; catatan menjelaskan bahwa yang dimaksud ialah tubuh masing-masing orang percaya.
theological_decisions:
- issue: Cara menerjemahkan υἱοθεσίαν dengan tetap mempertahankan citra status keluarga dan warisan Paulus
  choice: pengangkatan sebagai anak
  alternative: pengangkatan sebagai anak laki-laki; adopsi
  rationale: Istilah Yunani berhubungan dengan status sebagai anak laki-laki yang berhak mewaris, tetapi rujukannya mencakup semua orang percaya. Pilihan utama mempertahankan gagasan pemberian status anak tanpa menimbulkan kesan bahwa perempuan dikecualikan; nuansa harfiahnya dicatat.
- issue: Apakah τὴν ἀπαρχὴν τοῦ πνεύματος berarti pemberian awal yang berasal dari Roh atau Roh sendiri sebagai buah sulung
  choice: buah sulung dari Roh
  alternative: Roh sebagai buah sulung
  rationale: Konstruksi Yunani memungkinkan lebih dari satu hubungan makna. Teks utama mempertahankan bentuk genitif yang relatif terbuka, sedangkan kemungkinan apposisional dicantumkan dalam catatan.
- issue: Hubungan υἱοθεσίαν dengan τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν
  choice: yaitu penebusan tubuh kita
  alternative: pengangkatan sebagai anak, penebusan tubuh kita
  rationale: Frasa kedua paling alami dipahami sebagai penjelasan mengenai penggenapan pengangkatan sebagai anak yang sedang dinantikan, tanpa menyiratkan bahwa status anak sama sekali belum dimiliki dalam konteks Roma 8.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Mengeluh dalam hati” dipilih sebagai ungkapan alami bagi keluhan batin, sedangkan “buah sulung,” “pengangkatan sebagai anak,” dan “penebusan” mempertahankan metafora serta kosakata teologis Paulus. Semua penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
