id: ROM.8.10
reference: Romans 8:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς ἐν ὑμῖν, τὸ μὲν σῶμα νεκρὸν διὰ ἁμαρτίαν, τὸ δὲ πνεῦμα ζωὴ διὰ δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/010.yaml
  text: But if the Messiah is in you[a], the body is dead because of sin[c][b], but the spirit is life because of righteousness.
translation:
  language: id
  text: Namun, jika Kristus ada di dalam kamu, tubuh memang mati karena dosa, tetapi roh adalah kehidupan karena kebenaran.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Roh adalah kehidupan.” Istilah Yunani ini dapat menunjuk baik pada roh manusia yang dihidupkan Allah maupun pada Roh Kudus.
    reason: alternative_reading
  - marker: b
    text: “Tubuh memang mati” dapat juga dipahami sebagai “tubuh tunduk pada kematian” atau “tubuh bersifat fana”. Istilah “kebenaran” dapat juga diterjemahkan “keadilan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Kristus
  rationale: Dalam bahasa Indonesia modern, “Kristus” adalah padanan baku bagi gelar Yunani Χριστός dan tetap dapat dipahami sebagai gelar, bukan sekadar nama.
- source_word: σῶμα
  choice: tubuh
  rationale: σῶμα menunjuk pada tubuh dan membentuk kontras konkret dengan πνεῦμα; padanan “daging” akan mencampurkannya dengan σάρξ.
- source_word: νεκρὸν
  choice: mati
  rationale: Padanan langsung νεκρός adalah “mati”. Ungkapan tajam ini dipertahankan, sementara kemungkinan nuansa “tunduk pada kematian” atau “fana” dicatat dalam catatan kaki.
- source_word: διὰ ἁμαρτίαν
  choice: karena dosa
  rationale: διά dengan akusatif di sini menyatakan sebab; “karena dosa” alami dan mempertahankan hubungan kausal.
- source_word: πνεῦμα
  choice: roh
  rationale: Tanpa kapitalisasi, “roh” mempertahankan kemungkinan bahwa yang dimaksud ialah roh manusia yang dihidupkan Allah, tanpa menutup kemungkinan rujukan kepada Roh Kudus.
- source_word: ζωὴ
  choice: adalah kehidupan
  rationale: ζωή adalah nomina “kehidupan”, bukan adjektiva “hidup”; bentuk nominal Paulus dipertahankan meski ungkapannya padat.
- source_word: διὰ δικαιοσύνην
  choice: karena kebenaran
  rationale: δικαιοσύνη dalam konteks Paulus secara wajar diterjemahkan “kebenaran”, dengan daya kausal διά dipertahankan melalui “karena”.
theological_decisions:
- issue: Rujukan πνεῦμα
  choice: roh
  alternative: Roh
  rationale: Teks dapat menunjuk pada roh manusia yang dihidupkan oleh Allah atau pada Roh Kudus. Huruf kecil dalam teks utama mempertahankan kontras dengan tubuh, dan catatan kaki menjaga ambiguitasnya.
- issue: Daya νεκρὸν bersama σῶμα
  choice: tubuh memang mati
  alternative: tubuh tunduk pada kematian; tubuh bersifat fana
  rationale: Bahasa Yunani secara lugas mengatakan “mati”, meskipun dalam konteksnya dapat menekankan kefanaan tubuh akibat dosa. Teks utama mempertahankan bentuk sumber dan catatan kaki memberi nuansa alternatif.
- issue: Makna δικαιοσύνη
  choice: kebenaran
  alternative: keadilan
  rationale: “Kebenaran” merupakan padanan yang lebih lazim dan sesuai bagi δικαιοσύνη dalam wacana Paulus, tetapi rentang makna yang mencakup “keadilan” tetap diakui dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Partikel “memang ... tetapi ...” mencerminkan konstruksi kontras μὲν ... δὲ. Susunan kalimat tetap dekat dengan kepadatan retoris teks Yunani, sedangkan ambiguitas penting dijaga melalui catatan kaki.
