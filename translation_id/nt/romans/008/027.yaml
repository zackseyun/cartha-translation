  to: Dan Dia yang menyelidiki hati mengetahui apa yang ada dalam pikiran Roh, sebab Roh berdoa syafaat bagi orang-orang kudus menurut Allah.[a]
  rationale: Revisi memperbaiki keluwesan bahasa Indonesia dan ketepatan nuansa intersesif tanpa mengubah isi ayat. "Menurut Allah" dipilih sebagai padanan utama yang singkat dan idiomatis bagi κατὰ θεόν; catatan kaki mempertahankan alternatif penafsiran yang lazim, "sesuai dengan kehendak Allah," tanpa menjadikannya perluasan dalam teks utama.
