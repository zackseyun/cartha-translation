    rationale: Kata Yunani ini dalam konteks Roma 8:26–27 menyatakan tindakan intersesif. "Berdoa syafaat" menyampaikan fungsi itu secara lebih langsung dan alami.
  revised_text: Dan Dia yang menyelidiki hati mengetahui apa yang ada dalam pikiran Roh, sebab Roh berdoa syafaat bagi orang-orang kudus menurut Allah.[a]
