  text: ὁ δὲ ἐραυνῶν τὰς καρδίας οἶδεν τί τὸ φρόνημα τοῦ πνεύματος, ὅτι κατὰ θεὸν ἐντυγχάνει ὑπὲρ ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/027.yaml
  text: And he who searches hearts knows what the mindset of the Spirit is, because he intercedes for the saints according to God.
translation:
  language: id
  text: Dan Dia yang menyelidiki hati mengetahui apa yang ada dalam pikiran Roh, sebab Roh berdoa syafaat bagi orang-orang kudus menurut Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesuai dengan kehendak Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐραυνῶν
  choice: menyelidiki
  rationale: Kata ini mempertahankan nuansa pemeriksaan yang aktif dan mendalam, serta wajar digunakan dengan objek 'hati' dalam bahasa Indonesia.
- source_word: καρδίας
  choice: hati
  rationale: '''Hati'' mempertahankan metafora antropologis teks sumber dan dalam bahasa Indonesia dapat menunjuk pusat batin manusia.'
- source_word: τί τὸ φρόνημα
  choice: apa yang menjadi pikiran
  rationale: Ungkapan ini menyampaikan arah pikiran atau maksud yang terkandung dalam φρόνημα tanpa membatasinya pada kemampuan intelektual semata.
- source_word: τοῦ πνεύματος
  choice: Roh
  rationale: Konteks Roma 8 menunjuk kepada Roh Kudus, sehingga huruf kapital digunakan.
- source_word: ἐντυγχάνει
  choice: menjadi pengantara
  rationale: Pilihan ini menyatakan tindakan memohon atau bertindak demi pihak lain dalam konteks doa, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: ὑπὲρ ἁγίων
  choice: bagi orang-orang kudus
  rationale: Terjemahan ini mempertahankan istilah Paulus bagi umat yang dikuduskan dan menyatakan tindakan demi kepentingan mereka.
- source_word: κατὰ θεὸν
  choice: sesuai dengan Allah
  rationale: Terjemahan ini mengikuti bentuk ringkas teks Yunani dan tidak menambahkan kata 'kehendak' yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Apakah κατὰ θεὸν perlu diperjelas menjadi 'sesuai dengan kehendak Allah'
  choice: sesuai dengan Allah
  alternative: sesuai dengan kehendak Allah
  rationale: Maknanya kemungkinan mencakup kesesuaian dengan kehendak Allah, tetapi teks Yunani hanya menyatakan 'menurut/sesuai dengan Allah'. Teks utama mempertahankan ungkapan yang lebih ringkas, sedangkan penafsiran lazim dicatat dalam catatan kaki.
- issue: Rujukan subjek tersirat dalam ἐντυγχάνει
  choice: Roh menjadi pengantara
  alternative: Dia menjadi pengantara
  rationale: Subjek gramatikal dipahami sebagai Roh dari frasa terdekat τοῦ πνεύματος dan konteks ayat sebelumnya. Mengulang 'Roh' mencegah ketaksaan rujukan kata ganti dalam bahasa Indonesia tanpa mengubah isi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum sambil mempertahankan metafora 'hati', istilah 'orang-orang kudus', serta kekompakan ungkapan κατὰ θεὸν.
