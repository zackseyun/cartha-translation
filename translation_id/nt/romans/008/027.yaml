  source_fidelity: 'Makna pokok terpelihara: Allah/Pribadi yang menyelidiki hati mengetahui φρόνημα Roh, dan Roh berdoa syafaat bagi orang-orang kudus κατὰ θεόν. Namun, "sesuai dengan Allah" adalah padanan yang tidak lazim dalam bahasa Indonesia dan kurang jelas sebagai ungkapan untuk κατὰ θεόν. "Menurut Allah" mempertahankan bentuk ringkas serta ambiguitas terjemahan harfiahnya, sementara catatan kaki menyatakan perluasan yang lazim tanpa memasukkannya ke teks utama.'
  naturalness: '"Apa yang menjadi pikiran Roh" dapat dipahami, tetapi kurang luwes. "Apa yang ada dalam pikiran Roh" adalah ungkapan Indonesia baku yang alami dan tetap menyatakan isi/arah pikiran (φρόνημα), bukan sekadar kemampuan berpikir. "Berdoa syafaat" lebih tepat dan idiomatis untuk ἐντυγχάνει dalam konteks ini daripada "menjadi pengantara", yang dapat berarti perantaraan secara umum dan tidak secara khusus tindakan doa.'
  terminology: '"Hati", "Roh", dan "orang-orang kudus" tepat serta konsisten dengan istilah sumber. Kapitalisasi "Roh" sesuai konteks Roh Kudus dalam Roma 8. Istilah "berdoa syafaat" menyampaikan fungsi intersesif tanpa menetapkan teori perantaraan tertentu.'
