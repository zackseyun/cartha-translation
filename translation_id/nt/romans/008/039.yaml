id: ROM.8.39
reference: Romans 8:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὔτε ὕψωμα οὔτε βάθος οὔτε τις κτίσις ἑτέρα δυνήσεται ἡμᾶς χωρίσαι ἀπὸ τῆς ἀγάπης τοῦ θεοῦ τῆς ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/039.yaml
  text: nor height nor depth nor any other created thing will be able to separate us from the love of God that is in Messiah Jesus our Lord[a][b][c].
translation:
  language: id
  text: baik ketinggian maupun kedalaman maupun ciptaan lain apa pun, tidak akan mampu memisahkan kita dari kasih Allah yang ada dalam Mesias Yesus, Tuhan kita.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “apa pun yang lain dalam ciptaan” atau “makhluk lain apa pun.”
    reason: lexical_alternative
  - marker: b
    text: “Mesias Yesus” secara tradisional diterjemahkan “Kristus Yesus.” Frasa “kasih Allah” di sini kemungkinan besar berarti kasih Allah kepada kita.
    reason: lexical_and_alternative_reading
lexical_decisions:
- source_word: ὕψωμα
  choice: yang tinggi
  rationale: Dalam pasangan dengan βάθος, ungkapan ini menunjuk pada dimensi atau ranah yang tinggi; bentuk ini alami dalam rangkaian bahasa Indonesia.
- source_word: βάθος
  choice: yang dalam
  rationale: Dipasangkan dengan ὕψωμα untuk menyatakan dua ekstrem yang berlawanan, tanpa mempersempitnya menjadi tempat tertentu seperti jurang.
- source_word: κτίσις ἑτέρα
  choice: ciptaan lain apa pun
  rationale: κτίσις dapat berarti ciptaan atau makhluk; pilihan ini mempertahankan cakupan luas, sementara 'lain' menerjemahkan ἑτέρα dan 'apa pun' menyampaikan daya tak tentu τις.
- source_word: δυνήσεται
  choice: tidak akan mampu
  rationale: Bentuk futur menyatakan ketidakmampuan pada masa mendatang; 'akan mampu' mempertahankan unsur kala dan kemampuan.
- source_word: χωρίσαι
  choice: memisahkan
  rationale: Padanan langsung dan wajar yang sesuai dengan jaminan Paulus bahwa tidak ada sesuatu pun yang dapat memutuskan umat dari kasih Allah.
- source_word: ἀγάπης τοῦ θεοῦ
  choice: kasih Allah
  rationale: Ungkapan genitif diterjemahkan secara alami tanpa menjabarkan arahnya di teks utama; konteks terutama menunjuk pada kasih Allah kepada kita.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: Χριστός merupakan gelar yang berarti Mesias; 'dalam' mempertahankan ἐν serta ungkapan relasional Paulus.
- source_word: κυρίῳ ἡμῶν
  choice: Tuhan kita
  rationale: Padanan baku, wajar, dan sesuai dengan penggunaan kristologis κύριος dalam konteks ini.
theological_decisions:
- issue: Arah genitif dalam ἀγάπης τοῦ θεοῦ
  choice: Mempertahankan bentuk 'kasih Allah' dalam teks utama, dengan konteks paling mungkin berarti kasih Allah kepada kita
  alternative: Kasih kita kepada Allah, atau genitif luas yang mencakup kedua arah
  rationale: Roma 8:31–39 menekankan tindakan dan kesetiaan Allah terhadap umat-Nya. Namun, karena bentuk Yunani tidak menyatakan objek secara eksplisit, teks utama tidak menambahkan 'kepada kita'; penjelasan diberikan dalam catatan.
- issue: Makna Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar dan secara leksikal berarti 'Yang Diurapi/Mesias'. 'Mesias' menerjemahkan gelar tersebut secara transparan, sedangkan bentuk tradisional dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur namun mudah dipahami. Struktur berulang 'baik ... maupun ... maupun ...' mempertahankan dorongan retoris daftar Yunani dan menunjukkan bahwa ayat ini melanjutkan daftar dari ayat sebelumnya.
