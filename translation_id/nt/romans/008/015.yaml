  text: οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον, ἀλλὰ ἐλάβετε πνεῦμα υἱοθεσίας ἐν ᾧ κράζομεν· Αββα ὁ πατήρ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/015.yaml
  text: For you did not receive a spirit of slavery leading back into fear[a], but you received the Spirit of adoption as sons, by whom we cry[c][b], “Abba! Father!”
translation:
  language: id
  text: Sebab kamu tidak menerima roh perbudakan yang membawa kamu kembali kepada ketakutan,[a] melainkan kamu menerima Roh pengangkatan menjadi anak,[b] dan di dalam Roh itu[c] kita berseru, “Abba! Bapa!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “kembali ke dalam ketakutan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “roh pengangkatan menjadi anak.” Istilah Yunaninya menunjuk pada pemberian status sebagai anak, beserta hak-hak keluarga dan warisan.'
    reason: alternative_reading
  - marker: c
    text: 'Atau: “dengan perantaraan Roh itu.” Secara harfiah: “di dalamnya”; kata ganti relatif Yunaninya berjenis netral karena menyesuaikan diri dengan kata “roh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα δουλείας
  choice: roh perbudakan
  rationale: Mempertahankan gambaran keadaan sebagai budak dan kesejajarannya dengan πνεῦμα υἱοθεσίας. Huruf kecil membiarkan frasa pertama dipahami sebagai roh atau keadaan batin yang bercirikan perbudakan.
- source_word: πάλιν εἰς φόβον
  choice: yang membawa kamu kembali kepada ketakutan
  rationale: Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan unsur πάλιν, ‘kembali’, dan arah/hasil εἰς φόβον, ‘kepada ketakutan’.
- source_word: πνεῦμα υἱοθεσίας
  choice: Roh pengangkatan menjadi anak
  rationale: ‘Pengangkatan menjadi anak’ menyampaikan status kekeluargaan dan hukum yang terkandung dalam υἱοθεσία. Huruf kapital mencerminkan bahwa konteks Roma 8 menunjuk kepada Roh Kudus, sementara alternatif yang mempertahankan kesejajaran gramatikal dicatat dalam catatan kaki.
- source_word: ἐν ᾧ
  choice: di dalam-Nya
  rationale: Mempertahankan bentuk Yunani yang secara harfiah berarti ‘di dalam Dia/yang itu’ dan tidak menggantinya langsung dengan hubungan instrumental; kemungkinan ‘dengan perantaraan-Nya’ dicatat sebagai alternatif.
- source_word: κράζομεν
  choice: kita berseru
  rationale: ‘Berseru’ menyampaikan seruan yang lantang dan sungguh-sungguh serta sesuai dengan ragam bahasa Indonesia yang bermartabat.
- source_word: Αββα ὁ πατήρ
  choice: Abba! Bapa!
  rationale: Αββα ditransliterasikan, sedangkan ὁ πατήρ diterjemahkan sebagai ‘Bapa’. Tanda seru mempertahankan daya emosional seruan langsung tersebut.
theological_decisions:
- issue: Apakah πνεῦμα υἱοθεσίας secara eksplisit menunjuk kepada Roh Kudus atau dapat dipertahankan sebagai ‘roh’ yang sejajar dengan ‘roh perbudakan’
  choice: Teks utama memakai ‘Roh pengangkatan menjadi anak’ untuk mencerminkan rujukan personal yang sangat mungkin dalam konteks Roma 8.
  alternative: ‘roh pengangkatan menjadi anak’
  rationale: Konteks langsung berbicara tentang karya Roh dan seruan kepada Bapa, tetapi ketiadaan artikel serta kesejajaran dengan πνεῦμα δουλείας menyisakan ketegangan gramatikal. Alternatif karena itu dipertahankan dalam catatan kaki.
- issue: Nuansa gender dan status hukum dalam υἱοθεσία
  choice: pengangkatan menjadi anak
  alternative: pengangkatan sebagai anak laki-laki; adopsi
  rationale: Dalam bahasa Indonesia, ‘anak’ secara wajar mencakup semua penerima status keluarga dan warisan. ‘Anak laki-laki’ dapat keliru menyiratkan bahwa perempuan dikecualikan, sedangkan ‘adopsi’ saja kurang menampilkan pemberian status sebagai anak.
- issue: Nilai relasional atau instrumental ἐν ᾧ
  choice: di dalam-Nya
  alternative: dengan perantaraan-Nya / oleh-Nya
  rationale: Pilihan utama menjaga bentuk sumber dan relasi dengan Roh tanpa menutup kemungkinan nuansa instrumental.
translation_notes:
  register: Bahasa Indonesia standar modern, alami, dan bermartabat. ‘Melainkan’ menandai pertentangan yang tegas. ‘Bapa’ dipakai dalam seruan religius langsung, sedangkan struktur kalimat tetap mudah dipahami pembaca umum.
