    issue: Catatan kaki c salah menyatakan terjemahan harfiah sebagai ‘di dalam Dia’.
    rationale: Kata ganti relatif ᾧ adalah netral, selaras dengan πνεῦμα. Terjemahan harfiah yang tidak mengubah rujukan gramatikal ialah ‘di dalamnya’ atau, dengan anteceden disebutkan, ‘di dalam Roh itu’; bukan ‘di dalam Dia’.
  - severity: low
    issue: Pronomina ‘-Nya’ dalam teks pokok membuat penjelasan bentuk netral di catatan c kurang selaras.
    rationale: Bahasa Indonesia tidak menandai netral secara gramatikal, tetapi pengulangan anteceden ‘Roh itu’ menghindari kesan bahwa bentuk Yunani sendiri adalah maskulin dan mempertahankan relasi ἐν ᾧ dengan lebih transparan.
