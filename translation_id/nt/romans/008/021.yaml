  text: ὅτι καὶ αὐτὴ ἡ κτίσις ἐλευθερωθήσεται ἀπὸ τῆς δουλείας τῆς φθορᾶς εἰς τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/021.yaml
  text: because creation itself also will be set free from slavery to decay into the freedom of the glory of the children of God[a].
translation:
  language: id
  text: sebab ciptaan itu sendiri juga akan dibebaskan dari perbudakan kepada kebinasaan ke dalam kebebasan yang mulia yang dimiliki anak-anak Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “kebebasan kemuliaan anak-anak Allah.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: sebab
  rationale: Dipahami secara kausal sebagai penjelasan bagi pengharapan dalam konteks sebelumnya.
- source_word: καὶ αὐτὴ ἡ κτίσις
  choice: ciptaan itu sendiri juga
  rationale: Mempertahankan daya tambah καί dan penegasan αὐτή; κτίσις menunjuk pada seluruh ciptaan dalam konteks ini.
- source_word: ἐλευθερωθήσεται
  choice: akan dibebaskan
  rationale: Bentuk pasif futur dipertahankan dan menyatakan tindakan pembebasan yang akan dialami ciptaan.
- source_word: ἀπὸ τῆς δουλείας τῆς φθορᾶς
  choice: dari perbudakan kebinasaan
  rationale: Perbudakan mempertahankan kuatnya metafora δουλεία. Kebinasaan mencakup keadaan dapat rusak, merosot, dan binasa yang dinyatakan φθορά.
- source_word: εἰς τὴν ἐλευθερίαν
  choice: dan masuk ke dalam kemerdekaan
  rationale: Masuk ke dalam mengungkapkan perpindahan menuju keadaan baru yang ditandai εἰς; kata dan membuat peralihan dari pembebasan 'dari' menuju masuk 'ke dalam' lebih alami dalam bahasa Indonesia.
- source_word: τῆς δόξης
  choice: yang penuh kemuliaan
  rationale: Mengungkapkan kemerdekaan yang bercirikan atau dipenuhi kemuliaan secara alami tanpa menetapkan secara berlebihan hubungan genitifnya.
- source_word: τῶν τέκνων τοῦ θεοῦ
  choice: milik anak-anak Allah
  rationale: Anak-anak mempertahankan makna inklusif τέκνα, sedangkan milik menyatakan kaitan genitif dengan kemerdekaan tanpa mengubahnya menjadi 'putra-putra'.
theological_decisions:
- issue: Hubungan genitif dalam τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: kemerdekaan yang penuh kemuliaan milik anak-anak Allah
  alternative: kemerdekaan kemuliaan anak-anak Allah
  rationale: Teks utama dibuat alami dalam bahasa Indonesia sambil tetap mengaitkan kemerdekaan, kemuliaan, dan anak-anak Allah. Bentuk yang lebih harfiah dicantumkan dalam catatan agar ketegangan dan keluwesan hubungan genitif Yunani tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Perbudakan' mempertahankan kerasnya metafora, sedangkan 'kebinasaan' dipilih untuk φθορά dalam cakupan kerusakan, kefanaan, dan kehancuran ciptaan.
