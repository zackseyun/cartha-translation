  rationale: Revisi menghilangkan verba tambahan “masuk,” mempertahankan arah εἰς dengan “ke dalam,” dan memperjelas bahwa kebinasaan adalah kuasa/keadaan yang memperbudak ciptaan. Frasa utama merender δόξα secara adjektival demi kelancaran bahasa Indonesia, sedangkan catatan mempertahankan rantai genitif Yunani dan ambiguitas relasinya.
