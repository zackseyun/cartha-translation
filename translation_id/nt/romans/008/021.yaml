    rationale: “Kemerdekaan yang penuh kemuliaan milik anak-anak Allah” secara eksplisit menjadikan kemerdekaan milik anak-anak Allah dan kemuliaan sebagai sifat kebebasan. Yunani memungkinkan hubungan yang lebih padat/terbuka; bentuk utama dapat dibuat alami, sedangkan catatan memelihara bentuk harfiahnya.
