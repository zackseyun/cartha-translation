id: ROM.8.13
reference: Romans 8:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ γὰρ κατὰ σάρκα ζῆτε μέλλετε ἀποθνῄσκειν, εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/013.yaml
  text: For if you live according to the flesh[a], you are about to die; but if by the Spirit you put to death the deeds of the body, you will live.
translation:
  language: id
  text: Sebab, jika kamu hidup menurut daging[a], kamu akan mati. Namun, jika oleh Roh kamu mematikan perbuatan-perbuatan tubuh, kamu akan hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks ini, “daging” bukan sekadar tubuh jasmani, melainkan kehidupan manusia yang diarahkan dan dikuasai oleh dosa.
    reason: Menjelaskan penggunaan metaforis σάρξ tanpa mengganti metafora sumber di dalam teks utama.
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan ayat ini dengan alasan pada ayat sebelumnya.
- source_word: κατὰ σάρκα
  choice: menurut daging
  rationale: Mempertahankan metafora khas Paulus dan arti dasar κατά tanpa langsung menafsirkannya sebagai sekadar tubuh jasmani atau menggantinya dengan konsep abstrak.
- source_word: ζῆτε
  choice: kamu hidup
  rationale: Bentuk kini dalam kalimat bersyarat disampaikan secara alami dengan verba kini bahasa Indonesia.
- source_word: μέλλετε ἀποθνῄσκειν
  choice: kamu akan mati
  rationale: Dalam konteks ini μέλλω dengan infinitif menyatakan akibat yang akan terjadi; 'akan mati' alami dalam bahasa Indonesia dan tidak memaksakan arti bahwa kematian itu terjadi dalam waktu sangat dekat.
- source_word: πνεύματι
  choice: oleh Roh
  rationale: Dativus dipahami secara instrumental, yakni Roh sebagai pelaku yang memberdayakan tindakan tersebut; huruf kapital menandai Roh Kudus sesuai konteks Roma 8.
- source_word: τὰς πράξεις τοῦ σώματος
  choice: perbuatan-perbuatan tubuh
  rationale: Mempertahankan bentuk jamak πράξεις dan hubungan genitif dengan tubuh, sekaligus membedakannya dari metafora 'daging' pada klausa pertama.
- source_word: θανατοῦτε
  choice: kamu mematikan
  rationale: Menyampaikan tindakan aktif dan berkelanjutan untuk membuat perbuatan tubuh tidak berdaya, sambil mempertahankan gambaran kematian dalam verba Yunani.
- source_word: ζήσεσθε
  choice: kamu akan hidup
  rationale: Mewakili bentuk future secara langsung dan alami.
theological_decisions:
- issue: Apakah πνεύματι menunjuk kepada Roh Kudus atau roh manusia
  choice: Roh Kudus
  alternative: roh manusia atau ungkapan 'roh' yang dibiarkan ambigu
  rationale: Rangkaian argumentasi dalam Roma 8 berulang kali menunjuk kepada Roh Allah sebagai kuasa yang memungkinkan umat percaya mematikan perbuatan tubuh.
- issue: Makna σάρξ dalam pertentangan etis Paulus
  choice: Mempertahankan metafora 'daging' dengan penjelasan dalam catatan kaki
  alternative: menerjemahkannya secara interpretatif sebagai 'tabiat berdosa'
  rationale: Pilihan ini menjaga hubungan leksikal dan ketegangan metaforis teks, serta tidak menyamakan σάρξ dengan tubuh jasmani, khususnya karena σῶμα muncul secara tersendiri dalam klausa berikutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kamu' mempertahankan sapaan orang kedua jamak dari konteks meskipun bentuk Indonesia tidak menandai jumlah. Struktur paralel kedua klausa dipertahankan agar kontras antara hidup menurut daging dan mematikan perbuatan tubuh oleh Roh tetap jelas.
