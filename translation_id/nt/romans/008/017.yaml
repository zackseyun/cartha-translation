id: ROM.8.17
reference: Romans 8:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ τέκνα, καὶ κληρονόμοι· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/017.yaml
  text: and if children[a], then heirs also—heirs of God and fellow heirs with Messiah, if indeed we suffer with him so that we may also be glorified with him.
translation:
  language: id
  text: Dan jika kita adalah anak-anak, kita juga ahli waris—ahli waris Allah dan ahli waris bersama Mesias[a]—jika memang kita menderita bersama Dia, supaya kita juga dimuliakan bersama Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kristus.”'
    reason: Padanan alternatif bagi gelar Yunani Χριστός; 'Mesias' menonjolkan makna gelarnya, sedangkan 'Kristus' mempertahankan bentuk yang lazim dalam tradisi Indonesia.
lexical_decisions:
- source_word: τέκνα
  choice: anak-anak
  rationale: Bentuk jamak netral ini menyatakan status sebagai anak tanpa membatasi jenis kelamin dan sesuai dengan konteks warisan.
- source_word: κληρονόμοι
  choice: ahli waris
  rationale: Istilah hukum-kekeluargaan yang lazim dan tepat bagi orang yang berhak menerima warisan.
- source_word: θεοῦ
  choice: Allah
  rationale: Genitif dipertahankan secara alami dalam frasa Indonesia 'ahli waris Allah', tanpa menentukan lebih jauh apakah tekanannya pada kepemilikan atau sumber warisan.
- source_word: συγκληρονόμοι
  choice: ahli waris bersama
  rationale: Unsur συν- menyatakan bahwa warisan itu diterima bersama; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός tetap berfungsi sebagai gelar bagi Yang Diurapi; 'Mesias' mempertahankan makna gelarnya dalam konteks pewarisan kerajaan.
- source_word: εἴπερ
  choice: jika memang
  rationale: Mempertahankan daya kondisional sekaligus nuansa penegasan atau pengharapan retoris, tanpa melemahkannya menjadi 'karena'.
- source_word: συμπάσχομεν
  choice: kita menderita bersama Dia
  rationale: Memperjelas unsur συν- sebagai partisipasi dalam penderitaan bersama Mesias, yang menjadi rujukan kontekstual.
- source_word: ἵνα
  choice: supaya
  rationale: Menyampaikan hubungan tujuan atau hasil secara ringkas dan wajar.
- source_word: συνδοξασθῶμεν
  choice: kita juga dimuliakan bersama Dia
  rationale: Bentuk pasif dipertahankan melalui 'dimuliakan', sedangkan unsur συν- dinyatakan dengan 'bersama Dia'.
theological_decisions:
- issue: Apakah εἴπερ συμπάσχομεν menjadikan penderitaan syarat yang menghasilkan jasa atau pola yang menyertai persatuan dengan Mesias
  choice: 'Diterjemahkan sebagai kondisi nyata: ''jika memang kita menderita bersama Dia''.'
  alternative: Melemahkannya menjadi 'karena kita menderita bersama Dia' atau menafsirkannya sebagai penderitaan yang menghasilkan jasa.
  rationale: Bahasa Yunani mempertahankan daya kondisional, tetapi ayat ini berbicara tentang partisipasi bersama Mesias; terjemahan tidak menambahkan gagasan bahwa penderitaan memperoleh kemuliaan sebagai upah jasa.
- issue: Makna hubungan genitif dalam συγκληρονόμοι ... Χριστοῦ
  choice: Diterjemahkan 'ahli waris bersama Mesias'.
  alternative: Memahami frasa itu sebagai 'ahli waris milik Mesias'.
  rationale: Kata majemuk συγκληρονόμοι dan konteks partisipasi bersama mendukung pengertian bahwa orang percaya menjadi sesama penerima warisan bersama Mesias.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'ahli waris' serta 'bersama Dia' dipertahankan untuk mencerminkan penekanan dan kesejajaran dalam teks Yunani. Kapitalisasi 'Dia' dipakai bagi rujukan kepada Mesias sesuai kebiasaan religius Indonesia.
