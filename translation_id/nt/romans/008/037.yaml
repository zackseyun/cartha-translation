  text: ἀλλ’ ἐν τούτοις πᾶσιν ὑπερνικῶμεν διὰ τοῦ ἀγαπήσαντος ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/037.yaml
  text: But in all these things we overwhelmingly conquer through the one who loved us[a][b].
translation:
  language: id
  text: Namun, dalam semuanya itu kita menang dengan luar biasa melalui Dia yang telah mengasihi kita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud kemungkinan besar adalah Kristus dalam konteks langsung.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Namun
  rationale: Menandai pertentangan kuat dengan berbagai penderitaan dan ancaman yang disebut dalam konteks sebelumnya, sekaligus terdengar wajar dan bermartabat dalam bahasa Indonesia.
- source_word: ἐν τούτοις πᾶσιν
  choice: dalam semuanya itu
  rationale: Mempertahankan ungkapan preposisional Yunani dan menunjuk kembali kepada kesukaran-kesukaran yang baru saja disebutkan.
- source_word: ὑπερνικῶμεν
  choice: kita menang dengan luar biasa
  rationale: Bentuk verbal dipertahankan, sedangkan unsur ὑπερ- disampaikan sebagai penguatan yang menunjukkan kemenangan yang melampaui kemenangan biasa.
- source_word: διὰ
  choice: melalui
  rationale: 'Dengan frasa berkasus genitif, kata ini secara alami menyatakan sarana atau perantaraan: kemenangan itu terjadi melalui pribadi lain.'
- source_word: τοῦ ἀγαπήσαντος ἡμᾶς
  choice: Dia yang telah mengasihi kita
  rationale: Partisipel aoris berartikel berfungsi sebagai nomina. Terjemahan ini alami dalam bahasa Indonesia, tetap personal, dan tidak menambahkan nama yang tidak dinyatakan dalam ayat.
theological_decisions:
- issue: Identitas τοῦ ἀγαπήσαντος ἡμᾶς, ‘Dia yang telah mengasihi kita’
  choice: Tidak menyebutkan nama dalam teks utama; memakai ‘Dia yang telah mengasihi kita’.
  alternative: Menafsirkan dan menerjemahkannya secara eksplisit sebagai ‘Kristus’.
  rationale: Konteks dekat sangat mungkin menunjuk kepada Kristus, tetapi ungkapan Yunani dalam ayat ini sendiri tidak menyebutkan nama. Terjemahan utama mempertahankan ketakterusterangan teks, sedangkan kemungkinan rujukannya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Ungkapan ‘menang dengan luar biasa’ dipilih untuk mempertahankan bentuk verba dan daya intensif ὑπερνικῶμεν tanpa memakai ungkapan yang terlalu teknis atau denominatif.
