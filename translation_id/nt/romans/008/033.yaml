  yaml_path: translation/nt/romans/008/033.yaml
  text: Who will bring a charge against God's chosen ones? It is God who justifies[a][b][c].
translation:
  language: id
  text: Siapakah yang akan mengajukan tuduhan terhadap orang-orang pilihan Allah?[a][b] Allahlah yang membenarkan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang yang dipilih Allah.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Siapakah yang akan mendakwa orang-orang pilihan Allah?”'
    reason: lexical_alternative
  - marker: c
    text: '“Membenarkan” di sini bernuansa hukum: Allah menyatakan benar.'
    reason: cultural_note
lexical_decisions:
- source_word: τίς
  choice: Siapakah
  rationale: Kata ganti tanya ini membuka pertanyaan retoris; “Siapakah” langsung, wajar, dan bermartabat dalam bahasa Indonesia.
- source_word: ἐγκαλέσει
  choice: akan mengajukan tuduhan
  rationale: Kata kerja ini memiliki nuansa hukum, yaitu mengajukan dakwaan atau tuduhan. Pilihan ini mempertahankan gambaran ruang pengadilan.
- source_word: κατὰ
  choice: terhadap
  rationale: Bersama kata kerja yang menyatakan tuduhan, kata depan ini secara alami menunjukkan pihak yang menjadi sasaran tuduhan.
- source_word: ἐκλεκτῶν θεοῦ
  choice: orang-orang pilihan Allah
  rationale: Adjektiva ἐκλεκτῶν dipakai sebagai nomina dan menunjuk kepada mereka yang dipilih Allah. Ungkapan ini jelas bagi pembaca modern tanpa menjadikannya istilah teknis denominasi tertentu.
- source_word: θεὸς ὁ δικαιῶν
  choice: Allah adalah Dia yang membenarkan mereka
  rationale: Susunan ini mempertahankan penekanan pada Allah sebagai pihak yang membenarkan. Objek “mereka” dibuat eksplisit secara kontekstual agar kalimat alami dalam bahasa Indonesia, tanpa mengubah rujukannya.
theological_decisions:
- issue: Menerjemahkan ἐκλεκτῶν tanpa memasukkan sistem doktrinal yang berkembang kemudian
  choice: orang-orang pilihan Allah
  alternative: orang-orang yang dipilih Allah; umat pilihan Allah
  rationale: Pilihan ini menyampaikan bahwa mereka adalah orang-orang pilihan milik Allah, sambil membiarkan dasar dan cara pemilihan itu tetap tidak dijelaskan sebagaimana dalam teks.
- issue: Mempertahankan daya forensik θεὸς ὁ δικαιῶν
  choice: Allah adalah Dia yang membenarkan mereka
  alternative: Allah yang menyatakan mereka benar; Allah adalah pihak yang membenarkan
  rationale: Kata “membenarkan” mempertahankan istilah Paulus dan konteks pengadilan, sedangkan catatan kaki menjelaskan bahwa maksudnya ialah keputusan Allah yang menyatakan benar, bukan membuat perilaku yang salah menjadi benar.
- issue: Hubungan klausa kedua dengan pertanyaan pertama
  choice: 'Pernyataan mandiri: “Allah adalah Dia yang membenarkan mereka”'
  alternative: 'Pertanyaan lanjutan: “Allah yang membenarkan?”'
  rationale: Tanda baca tidak terdapat dalam naskah Yunani awal, sehingga secara sintaksis pembacaan interogatif mungkin. Namun, alur retoris ayat 33–34 dan penempatan Allah secara tegas paling alami dipahami sebagai jawaban deklaratif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada retoris dan bermartabat. “Mengajukan tuduhan” mempertahankan suasana hukum; “orang-orang pilihan Allah” mudah dipahami dan tidak terlalu teknis. Kata ganti “mereka” ditambahkan berdasarkan konteks untuk kelancaran bahasa Indonesia.
