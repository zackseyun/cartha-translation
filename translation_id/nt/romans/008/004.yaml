  text: ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/004.yaml
  text: so that the righteous requirement of the law might be fulfilled in us[c][b][a], who do not walk according to the flesh but according to the Spirit.
translation:
  language: id
  text: supaya tuntutan yang benar dari hukum Taurat digenapi di dalam kita, yang hidup bukan menurut daging[a], melainkan menurut Roh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Daging” di sini menunjuk pada manusia dalam keberdosaannya dan pada cara hidup yang berorientasi menjauh dari Allah; ada yang menerjemahkannya “tabiat berdosa”.
    reason: lexical_alternative
  - marker: b
    text: Atau “roh”; dalam konteks Roma 8, kemungkinan besar yang dimaksud adalah Roh Kudus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan atau hasil dengan ungkapan Indonesia yang alami dan tetap mempertahankan daya telis klausa.
- source_word: τὸ δικαίωμα τοῦ νόμου
  choice: tuntutan hukum Taurat yang benar
  rationale: δικαίωμα di sini menunjuk pada tuntutan yang adil atau benar dari Taurat; susunan ini mempertahankan dimensi hukum dan moralnya.
- source_word: πληρωθῇ
  choice: digenapi
  rationale: Bentuk pasif dipertahankan dan cocok dengan klausa tujuan sesudah ἵνα, tanpa menentukan pelaku yang tidak disebutkan.
- source_word: ἐν ἡμῖν
  choice: di dalam kita
  rationale: Menerjemahkan ἐν secara langsung dan tidak mengubahnya menjadi 'oleh kita', yang akan mempertegas peran manusia melebihi bunyi teks.
- source_word: περιπατοῦσιν
  choice: hidup
  rationale: Metafora berjalan menyatakan cara menjalani kehidupan; 'hidup' menyampaikan makna etisnya secara alami dalam bahasa Indonesia modern.
- source_word: σάρκα
  choice: daging
  rationale: Mempertahankan istilah Paulus tanpa langsung menafsirkannya sebagai 'tabiat berdosa'; penjelasan makna kontekstual diberikan dalam catatan kaki.
- source_word: πνεῦμα
  choice: Roh
  rationale: Konteks Roma 8 sangat kuat menunjuk kepada Roh Kudus, meskipun bentuk Yunani itu sendiri dapat berarti roh; ambiguitas dicatat.
- source_word: κατὰ σάρκα ... κατὰ πνεῦμα
  choice: menurut daging ... menurut Roh
  rationale: Mengikuti kontras dan pengulangan κατά secara transparan serta mempertahankan pola ungkapan Paulus.
theological_decisions:
- issue: Apakah πνεῦμα menunjuk kepada roh manusia atau Roh Kudus
  choice: Roh
  alternative: roh
  rationale: Alur Roma 8 menonjolkan karya dan lingkup Roh Kudus, sehingga 'Roh' paling sesuai dalam konteks; kemungkinan leksikal lain tetap dicatat.
- issue: Apakah ἐν ἡμῖν berarti penggenapan di dalam kita atau oleh kita
  choice: di dalam kita
  alternative: oleh kita; di antara kita
  rationale: Terjemahan ini mempertahankan preposisi ἐν dan tidak memasukkan penegasan tentang pelaku yang tidak dinyatakan oleh teks.
- issue: Cara menerjemahkan δικαίωμα τοῦ νόμου
  choice: tuntutan hukum Taurat yang benar
  alternative: tuntutan hukum Taurat; ketetapan benar dari hukum Taurat
  rationale: Pilihan utama mempertahankan sekaligus nuansa tuntutan hukum dan sifatnya yang benar, tanpa membatasinya pada satu peraturan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Hukum Taurat' dipakai untuk νόμος dalam konteks ini agar rujukannya jelas bagi pembaca umum. 'Hidup' dipilih daripada metafora harfiah 'berjalan' demi kealamian, sedangkan istilah teologis penting 'daging' dipertahankan dan dijelaskan melalui catatan kaki.
