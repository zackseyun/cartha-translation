id: ROM.8.5
reference: Romans 8:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ γὰρ κατὰ σάρκα ὄντες τὰ τῆς σαρκὸς φρονοῦσιν, οἱ δὲ κατὰ πνεῦμα τὰ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/005.yaml
  text: For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, on the things of the Spirit.
translation:
  language: id
  text: Sebab, orang-orang yang hidup menurut daging memikirkan hal-hal yang berkaitan dengan daging, sedangkan orang-orang yang hidup menurut Roh memikirkan hal-hal yang berkaitan dengan Roh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ... κατὰ σάρκα ὄντες
  choice: orang-orang yang hidup menurut daging
  rationale: Secara harfiah berarti ‘mereka yang berada menurut daging’. ‘Hidup menurut daging’ menyampaikan keadaan dan orientasi hidup yang dimaksud secara alami dalam bahasa Indonesia tanpa menyamakannya hanya dengan tubuh jasmani.
- source_word: φρονοῦσιν
  choice: memikirkan
  rationale: Kata ini menunjuk pada pola pikir, perhatian, atau orientasi batin. ‘Memikirkan’ mempertahankan keluasan maknanya tanpa memperkuatnya secara berlebihan menjadi tindakan pemusatan yang disengaja.
- source_word: τὰ τῆς σαρκὸς / τὰ τοῦ πνεύματος
  choice: hal-hal yang berkaitan dengan daging / hal-hal yang berkaitan dengan Roh
  rationale: Genitif Yunani memiliki hubungan makna yang luas. ‘Berkaitan dengan’ menjaga keluasan itu dan menghindari penetapan bahwa hal-hal tersebut semata-mata berasal dari, dimiliki oleh, atau diinginkan oleh daging maupun Roh.
- source_word: πνεῦμα
  choice: Roh
  rationale: Dalam kontras teologis Roma 8, konteks paling wajar menunjuk kepada Roh Allah. Huruf kapital menandai rujukan personal tersebut, sambil tidak menambahkan sebutan yang tidak tertulis dalam ayat ini.
theological_decisions:
- issue: Makna ‘menurut daging’ dan ‘menurut Roh’
  choice: Mempertahankan kedua ungkapan paralel sebagai ‘hidup menurut daging’ dan ‘hidup menurut Roh’.
  alternative: Menjelaskannya sebagai ‘dikuasai oleh tabiat berdosa’ dan ‘dikuasai oleh Roh Kudus’.
  rationale: Pilihan utama mempertahankan metafora dan paralelisme Paulus serta tidak menyamakan σάρξ secara langsung dengan suatu rumusan doktrinal tertentu.
- issue: Identitas πνεῦμα
  choice: Menerjemahkan ‘Roh’ dengan huruf kapital.
  alternative: Menerjemahkan ‘roh’ sebagai sisi rohani manusia.
  rationale: Konteks dekat Roma 8 berulang kali berbicara tentang Roh Allah dan Roh Kristus, sehingga rujukan kepada Roh ilahi paling kuat, meskipun bentuk kata itu sendiri tidak memakai kapitalisasi dalam naskah Yunani kuno.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Paralelisme antardua kelompok dipertahankan, dan istilah ‘daging’ tetap digunakan karena merupakan metafora utama Paulus dalam konteks ini.
