  text: For all who are led by the Spirit of God[a], these are sons of God.
translation:
  language: id
  text: Sebab semua orang yang dipimpin oleh Roh Allah, merekalah anak-anak Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Allah.” Kata Yunani yang dipakai berbentuk maskulin dan, dalam konteks ini, mempertahankan nuansa pengangkatan sebagai anak serta hak waris. Sebutan itu mencakup semua orang yang dipimpin oleh Roh Allah, baik laki-laki maupun perempuan.
    reason: Alternatif leksikal dan penjelasan nuansa istilah maskulin.
lexical_decisions:
- source_word: ὅσοι
  choice: semua orang yang
  rationale: Mengungkapkan cakupan menyeluruh dari konstruksi korelatif jamak secara wajar dalam bahasa Indonesia.
- source_word: γὰρ
  choice: sebab
  rationale: Mempertahankan hubungan penjelasan dengan argumen pada ayat sebelumnya.
- source_word: πνεύματι θεοῦ
  choice: oleh Roh Allah
  rationale: Datif dipahami secara instrumental bersama kata kerja pasif ἄγονται; bentuk ini juga mempertahankan ungkapan genitif Paulus.
- source_word: ἄγονται
  choice: dipimpin
  rationale: Mempertahankan bentuk pasif dan makna tuntunan yang berlangsung tanpa menerjemahkan aspek secara berlebihan.
- source_word: οὗτοι
  choice: merekalah
  rationale: Partikel -lah mempertahankan penekanan demonstratif Yunani dengan ungkapan Indonesia yang alami.
- source_word: υἱοί
  choice: putra-putra
  rationale: Mempertahankan bentuk maskulin eksplisit dan nuansa status pengangkatan serta hak waris dalam konteks Roma 8; cakupan inklusifnya dijelaskan dalam catatan kaki.
- source_word: θεοῦ
  choice: Allah
  rationale: Konstruksi posesif bahasa Indonesia secara langsung dan alami menyampaikan genitif θεοῦ pada kedua kemunculannya.
theological_decisions:
- issue: Apakah υἱοί θεοῦ diterjemahkan sebagai “putra-putra Allah” atau dengan ungkapan yang lebih inklusif.
  choice: putra-putra Allah
  alternative: anak-anak Allah; putra-putri Allah
  rationale: Teks Yunani memakai nomina maskulin jamak υἱοί. Dalam konteks pengangkatan dan warisan di Roma 8, “putra-putra” mempertahankan bentuk serta tekstur teologis istilah itu, sedangkan catatan kaki menjelaskan bahwa kelompok yang dimaksud tidak terbatas pada laki-laki.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Merekalah” menjaga penekanan οὗτοι, sedangkan “putra-putra” sengaja dipertahankan dalam teks utama dengan penjelasan inklusif dalam catatan kaki.
