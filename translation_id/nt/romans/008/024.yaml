source:
  edition: SBLGNT
  text: τῇ γὰρ ἐλπίδι ἐσώθημεν· ἐλπὶς δὲ βλεπομένη οὐκ ἔστιν ἐλπίς, ὃ γὰρ βλέπει ⸀τίς ἐλπίζει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/024.yaml
  text: For in hope we were saved[a]. But hope that is seen is not hope[b], for who hopes for what he sees?
translation:
  language: id
  text: Sebab dalam pengharapan kita telah diselamatkan.[a] Namun, pengharapan yang terlihat bukanlah pengharapan,[b] sebab siapa yang mengharapkan apa yang dilihatnya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “oleh pengharapan kita telah diselamatkan.”
    reason: Datif τῇ ἐλπίδι dapat dipahami secara lebih instrumental, meskipun “dalam pengharapan” lebih baik mempertahankan lingkup eskatologis ayat ini.
  - marker: b
    text: Maksudnya, pengharapan berkaitan dengan apa yang belum terlihat.
    reason: Catatan penjelas memperjelas kontras antara pengharapan dan penglihatan tanpa mengganti ungkapan konkret dalam teks utama.
lexical_decisions:
- source_word: τῇ γὰρ ἐλπίδι
  choice: Sebab dalam pengharapan
  rationale: 'Datif dipahami terutama sebagai lingkup atau keadaan: keselamatan telah menjadi milik umat percaya, tetapi kepenuhannya masih diharapkan dan belum terlihat. Ungkapan ini juga mempertahankan hubungan γὰρ dengan konteks sebelumnya.'
- source_word: ἐσώθημεν
  choice: kita telah diselamatkan
  rationale: Bentuk aoristus pasif dipertahankan sebagai tindakan keselamatan yang telah terjadi, dengan bentuk pasif yang tidak menyebut pelaku secara eksplisit. Dalam bahasa Indonesia, 'telah diselamatkan' menyampaikan hal ini secara alami tanpa menentukan seluruh nuansa waktunya secara berlebihan.
- source_word: ἐλπὶς δὲ βλεπομένη
  choice: Namun, pengharapan yang terlihat
  rationale: Partisipel pasif diterjemahkan sebagai klausa relatif yang alami. 'Terlihat' mempertahankan kontras antara pengharapan dan penglihatan tanpa mengubahnya menjadi tindakan sengaja seseorang.
- source_word: οὐκ ἔστιν ἐλπίς
  choice: bukanlah pengharapan
  rationale: 'Terjemahan ini mempertahankan pernyataan predikatif dan kualitatif Yunani: sesuatu yang sudah terlihat tidak lagi memiliki sifat pengharapan.'
- source_word: ὃ γὰρ βλέπει
  choice: apa yang dilihatnya
  rationale: Pronomina relatif netral ὃ diterjemahkan secara idiomatis sebagai 'apa yang', sedangkan akhiran '-nya' merujuk secara generik kepada orang dalam pertanyaan tersebut.
- source_word: τίς ἐλπίζει
  choice: siapa yang masih mengharapkan
  rationale: Pertanyaan retoris diterjemahkan secara alami. 'Masih' menjelaskan implikasi kontekstual bahwa pengharapan tidak berlanjut ketika objeknya sudah terlihat, tanpa mengubah pokok pernyataannya.
theological_decisions:
- issue: Hubungan keselamatan dengan pengharapan dalam τῇ ἐλπίδι ἐσώθημεν
  choice: dalam pengharapan kita telah diselamatkan
  alternative: oleh pengharapan kita telah diselamatkan
  rationale: '''Dalam pengharapan'' mempertahankan ketegangan eskatologis bahwa keselamatan itu nyata dan telah diterima, tetapi penggenapannya belum terlihat. Pilihan ini tidak menjadikan pengharapan sebagai penyebab efisien keselamatan.'
- issue: Hubungan antara pengharapan dan apa yang terlihat
  choice: pengharapan yang terlihat bukanlah pengharapan
  alternative: pengharapan yang sudah terpenuhi bukan lagi pengharapan
  rationale: Rumusan utama tetap dekat dengan gambaran penglihatan dalam teks Yunani dan tidak secara diam-diam menyamakan 'terlihat' dengan seluruh konsep 'terpenuhi'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Pengharapan' dipilih daripada 'harapan' untuk konsistensi istilah teologis yang tetap lazim, sedangkan susunan kalimat dibuat alami. Semua penanda catatan kaki dicantumkan dalam teks utama.
