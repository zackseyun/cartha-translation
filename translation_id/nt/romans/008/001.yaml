  text: Οὐδὲν ἄρα νῦν κατάκριμα τοῖς ἐν Χριστῷ ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/001.yaml
  text: Therefore[b][a], there is now no condemnation for those in Messiah Jesus.
translation:
  language: id
  text: Karena itu, sekarang tidak ada penghukuman bagi mereka yang ada di dalam Mesias[b] Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah yang lebih kemudian menambahkan, “yang tidak hidup menurut daging.” Saksi-saksi Yunani paling awal mendukung bacaan yang lebih pendek di sini.
    reason: textual_variant
  - marker: b
    text: 'Atau: “Kristus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδὲν
  choice: tidak ada
  rationale: 'Bersama κατάκριμα, bentuk ini menyampaikan penyangkalan yang tegas dalam bahasa Indonesia yang alami: “tidak ada penghukuman”.'
- source_word: ἄρα
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya dan mempertahankan hubungan logis dalam argumen Paulus.
- source_word: νῦν
  choice: sekarang
  rationale: Dipertahankan secara eksplisit karena menunjuk pada kenyataan yang berlaku kini sebagai hasil karya Allah dalam Mesias.
- source_word: κατάκριμα
  choice: penghukuman
  rationale: Istilah ini menyatakan putusan bersalah dalam ranah hukum, bukan sekadar rasa bersalah atau tindakan menghukum.
- source_word: τοῖς ἐν Χριστῷ Ἰησοῦ
  choice: bagi mereka yang ada di dalam Mesias Yesus
  rationale: Dativus diterjemahkan secara alami dengan “bagi”, sedangkan ἐν dipertahankan sebagai “di dalam” agar bahasa partisipasi atau persatuan Paulus tidak dipersempit menjadi parafrasa sebab-akibat.
- source_word: Χριστῷ
  choice: Mesias
  rationale: Menerjemahkan makna gelar Yunani Χριστός dan menjaga fungsi mesianiknya dalam konteks ini; alternatif tradisional dicatat dalam catatan kaki.
- source_word: Ἰησοῦ
  choice: Yesus
  rationale: Bentuk nama pribadi yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Makna ungkapan “di dalam Mesias Yesus”
  choice: Mempertahankan ungkapan “di dalam” sebagai bahasa yang mengidentifikasi orang-orang yang menjadi milik dan mengambil bagian dalam Mesias Yesus.
  alternative: “karena Mesias Yesus” atau ungkapan kausal lain
  rationale: Penggunaan ἐν oleh Paulus di sini kaya akan nuansa relasi, kepemilikan, partisipasi, dan persatuan. Terjemahan tidak membatasi ungkapan itu pada satu penjelasan teologis saja.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan khidmat. Susunan kalimat mengikuti daya simpul teks Yunani tanpa menjadi kaku. Istilah “penghukuman” dipilih untuk mempertahankan nuansa putusan hukum, dan “ada di dalam” mempertahankan ambiguitas teologis ungkapan Paulus.
