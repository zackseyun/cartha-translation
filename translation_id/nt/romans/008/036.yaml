base_translation:
  language: en
  yaml_path: translation/nt/romans/008/036.yaml
  text: 'Just as it is written: “For your sake we are being put to death all day long[a]; we were counted as sheep for slaughter.”'
translation:
  language: id
  text: 'Seperti ada tertulis: “Oleh karena Engkau, kami dibunuh sepanjang hari; kami dianggap sebagai domba-domba yang akan disembelih.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Seperti
  rationale: Mengantar kutipan Kitab Suci dengan daya perbandingan yang alami dalam bahasa Indonesia dan tetap menghubungkannya dengan konteks sebelumnya.
- source_word: γέγραπται
  choice: ada tertulis
  rationale: Rumus baku untuk memperkenalkan kutipan Kitab Suci; bentuk ini menyampaikan bahwa tulisan tersebut tetap berlaku.
- source_word: Ἕνεκεν σοῦ
  choice: Oleh karena Engkau
  rationale: Mempertahankan makna kausal dan sapaan langsung kepada Allah; huruf kapital menandai rujukan pronominal kepada-Nya tanpa menambah tafsiran.
- source_word: θανατούμεθα
  choice: kami terus menghadapi maut
  rationale: Mengungkapkan tindakan pasif yang berlangsung terus dalam idiom Indonesia yang wajar, tanpa mengesankan bahwa kelompok itu secara harfiah dibunuh berulang kali.
- source_word: ὅλην τὴν ἡμέραν
  choice: sepanjang hari
  rationale: Padanan Indonesia yang alami untuk ungkapan durasi waktu dan mempertahankan gagasan paparan yang terus-menerus.
- source_word: ἐλογίσθημεν
  choice: kami dianggap
  rationale: Menyampaikan arti pasif λογίζομαι sebagai dipandang atau dinilai sebagai sesuatu.
- source_word: ὡς
  choice: sebagai
  rationale: Secara alami memperkenalkan perbandingan atau penilaian dalam konstruksi bahasa Indonesia.
- source_word: πρόβατα σφαγῆς
  choice: domba-domba yang akan disembelih
  rationale: Mempertahankan citra kawanan domba yang ditentukan untuk penyembelihan dengan susunan yang jelas bagi pembaca modern.
theological_decisions:
- issue: Kutipan Mazmur 44:22 dalam konteks penderitaan
  choice: Mempertahankan suara komunal dan pengalaman ancaman maut yang terus berlangsung, tanpa membatasinya secara khusus pada kemartiran.
  alternative: Menerjemahkan secara lebih interpretatif sebagai pembunuhan atau kemartiran yang sedang berlangsung.
  rationale: Bahasa Yunani mengutip ratapan komunal dan menyajikan penderitaan dengan citra maut serta penyembelihan; terjemahan sebaiknya tidak mempersempit penerapannya melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kutipan dibuat alami bagi pembaca umum sambil mempertahankan citra maut dan penyembelihan serta bentuk orang pertama jamak.
