base_translation:
  language: en
  yaml_path: translation/nt/romans/008/031.yaml
  text: What then shall we say to these things? If God is for us[b][a], who is against us?
translation:
  language: id
  text: Jadi, apa yang akan kita katakan tentang semua ini?[a] Jika Allah memihak kita,[b] siapa yang melawan kita?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apa yang akan kita katakan sebagai tanggapan atas semua ini?”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Karena Allah memihak kita, siapa yang melawan kita?”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Jadi, apa yang akan kita katakan
  rationale: Ungkapan ini mempertahankan pertanyaan retoris-deliberatif dan hubungan kesimpulan dengan uraian sebelumnya dalam bahasa Indonesia yang alami.
- source_word: πρὸς ταῦτα
  choice: tentang semua ini
  rationale: Dalam konteks ini, frasa tersebut merujuk pada seluruh pokok yang baru saja diuraikan. 'Tentang semua ini' lebih wajar daripada terjemahan harfiah 'kepada hal-hal ini'.
- source_word: εἰ
  choice: Jika
  rationale: Mempertahankan bentuk kondisional Yunani dan daya retorisnya tanpa menyiratkan bahwa Paulus meragukan keberpihakan Allah.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Padanan baku dan bermartabat bagi θεός dalam konteks Kitab Suci berbahasa Indonesia.
- source_word: ὑπὲρ ἡμῶν
  choice: memihak kita
  rationale: Menyatakan keberpihakan atau sikap yang menguntungkan kita. Bentuk verbal ini alami dalam bahasa Indonesia dan cocok dengan lawannya, καθ’ ἡμῶν.
- source_word: τίς καθ’ ἡμῶν
  choice: siapa yang dapat melawan kita
  rationale: Pertanyaan retoris ini bukan menyangkal adanya lawan, melainkan menegaskan bahwa tidak seorang pun dapat berhasil melawan umat yang dibela Allah. Kata 'dapat' menyampaikan implikasi pragmatis itu secara alami.
theological_decisions:
- issue: Daya kondisional εἰ ὁ θεὸς ὑπὲρ ἡμῶν
  choice: Jika Allah memihak kita
  alternative: Karena Allah memihak kita
  rationale: Kata 'jika' mempertahankan bentuk Yunani dan ketegangan retoris. Konteks menunjukkan bahwa ini adalah kondisi yang dianggap benar, bukan ungkapan keraguan.
- issue: Daya pertanyaan τίς καθ’ ἡμῶν
  choice: siapa yang dapat melawan kita?
  alternative: siapa yang melawan kita?
  rationale: 'Tambahan ''dapat'' mengungkapkan maksud tantangan retoris: lawan mungkin ada, tetapi tidak dapat menang ketika Allah memihak kita. Alternatif yang lebih formal tetap dicatat karena kata yang sepadan dengan ''dapat'' tidak dinyatakan secara eksplisit dalam Yunani.'
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Jadi' mempertahankan alur argumentasi; 'semua ini' merangkum uraian sebelumnya. Penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
