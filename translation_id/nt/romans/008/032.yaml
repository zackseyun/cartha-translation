id: ROM.8.32
reference: Romans 8:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο, ἀλλὰ ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/032.yaml
  text: He indeed did not spare his own Son[c][b][a], but gave him over for us all—how will he not also with him graciously give us all things?
translation:
  language: id
  text: Ia bahkan tidak menyayangkan Anak-Nya sendiri, tetapi menyerahkan Dia[a] bagi kita semua[c]. Bagaimanakah mungkin Ia tidak juga, bersama dengan Dia, menganugerahkan segala sesuatu kepada kita[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyerahkan-Nya”.
    reason: lexical_alternative
  - marker: b
    text: Atau “memberikan segala sesuatu kepada kita dengan cuma-cuma”.
    reason: lexical_alternative
  - marker: c
    text: “Bagi kita semua” juga dapat diterjemahkan “demi kita semua” atau “untuk kepentingan kita semua”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅς γε
  choice: Ia bahkan
  rationale: ὅς menunjuk kembali kepada Allah dalam konteks sebelumnya, sedangkan γε memberi penegasan. Dalam bahasa Indonesia, “Ia bahkan” mengungkapkan hubungan dan tekanan itu secara alami.
- source_word: τοῦ ἰδίου υἱοῦ
  choice: Anak-Nya sendiri
  rationale: ἴδιος menegaskan kepunyaan dan hubungan yang khas; “Anak-Nya sendiri” mempertahankan daya ungkap tersebut.
- source_word: οὐκ ἐφείσατο
  choice: tidak menyayangkan
  rationale: Ungkapan ini mempertahankan arti tidak menahan atau mengecualikan dari penderitaan, sekaligus terdengar wajar dalam konteks pengorbanan.
- source_word: ὑπὲρ ἡμῶν πάντων
  choice: bagi kita semua
  rationale: ὑπέρ di sini menyatakan tindakan demi kepentingan atau atas nama pihak lain. “Bagi kita semua” alami dan tidak mempersempitnya menjadi rumusan teknis tertentu.
- source_word: παρέδωκεν αὐτόν
  choice: menyerahkan Dia
  rationale: παραδίδωμι mengandung arti menyerahkan seseorang kepada penderitaan dan kematian; “menyerahkan Dia” mempertahankan bobot tindakan tersebut.
- source_word: πῶς οὐχὶ καὶ
  choice: Bagaimanakah mungkin Ia tidak juga
  rationale: Bentuk ini mempertahankan pertanyaan retoris dan kesimpulan dari pemberian yang lebih besar menuju pemberian-pemberian lainnya.
- source_word: σὺν αὐτῷ
  choice: bersama dengan Dia
  rationale: Terjemahan langsung dan alami dari frasa σύν, dengan rujukan kepada Sang Anak tetap jelas.
- source_word: τὰ πάντα
  choice: segala sesuatu
  rationale: Ungkapan luas Paulus dipertahankan tanpa menentukan cakupannya lebih sempit daripada teks sumber.
- source_word: ἡμῖν
  choice: kepada kita
  rationale: Bentuk ini menyatakan penerima pemberian secara jelas dalam bahasa Indonesia.
- source_word: χαρίσεται
  choice: menganugerahkan
  rationale: Kata ini menyampaikan pemberian yang lahir dari kemurahan atau anugerah, bukan sekadar tindakan memberi secara netral.
theological_decisions:
- issue: Apakah ὑπὲρ ἡμῶν πάντων harus diterjemahkan dengan istilah yang secara khusus menyatakan penggantian
  choice: bagi kita semua
  alternative: demi kita semua; atas nama kita semua
  rationale: Teks jelas menyatakan tindakan untuk kepentingan semua orang yang dimaksud, dengan gema pengorbanan, tetapi preposisi tersebut tidak perlu dipersempit menjadi formula penebusan teknis.
- issue: Cakupan τὰ πάντα
  choice: segala sesuatu
  alternative: semuanya
  rationale: Ungkapan Paulus sengaja luas dan harus dibaca dalam alur konteks. Terjemahan tidak menambahkan batasan material, rohani, atau eskatologis yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Anak” dan pronomina yang merujuk kepada Allah atau Kristus mengikuti kebiasaan umum penerbitan Alkitab Indonesia tanpa menambahkan makna pada teks Yunani. Pertanyaan retoris dipertahankan, dan pilihan “menganugerahkan” menjaga kaitan leksikal dengan kemurahan/anugerah.
