revisions:
- from: Sebab aku yakin bahwa baik maut maupun hidup, baik malaikat-malaikat maupun para penguasa[a], baik yang ada sekarang maupun yang akan datang, maupun segala kuasa,
  to: Sebab aku yakin bahwa baik maut maupun hidup, baik malaikat-malaikat maupun para penguasa[a], baik yang ada sekarang maupun yang akan datang, maupun kuasa-kuasa,
  rationale: Revisi terbatas pada δυνάμεις dan catatan alternatif untuk ἀρχαί. Teks kini tidak menambahkan 'segala', mencerminkan bentuk jamak sumber, dan tetap tidak menentukan apakah penguasa atau kuasa itu bersifat manusiawi, kosmis, rohani, atau impersonal. Koma akhir dipertahankan karena struktur kalimatnya berlanjut ke Roma 8:39.
