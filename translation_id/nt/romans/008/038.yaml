  text: πέπεισμαι γὰρ ὅτι οὔτε θάνατος οὔτε ζωὴ οὔτε ἄγγελοι οὔτε ἀρχαὶ οὔτε ⸂ἐνεστῶτα οὔτε μέλλοντα οὔτε δυνάμεις⸃
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/038.yaml
  text: For I am convinced that neither death nor life[a], nor angels nor rulers, nor things present nor things to come, nor powers,
translation:
  language: id
  text: Sebab aku yakin bahwa baik maut maupun hidup, baik malaikat-malaikat maupun para penguasa[a], baik yang ada sekarang maupun yang akan datang, maupun kuasa-kuasa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pemerintahan-pemerintahan”; mungkin merujuk pada otoritas kosmis atau rohani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπεισμαι
  choice: aku yakin
  rationale: Bentuk perfektum menyatakan keyakinan teguh yang tetap berlangsung; ungkapan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan fungsi kata ini sebagai penghubung yang memberi alasan atau penjelasan bagi pernyataan sebelumnya.
- source_word: οὔτε ... οὔτε
  choice: baik ... maupun
  rationale: Dalam konteks kalimat negatif yang berlanjut ke ayat berikutnya, susunan ini secara alami merangkaikan unsur-unsur yang sama-sama tidak mampu memisahkan, sekaligus mempertahankan irama daftar.
- source_word: θάνατος
  choice: maut
  rationale: Padanan langsung yang lazim, ringkas, dan sesuai dengan ragam bahasa Alkitab Indonesia yang bermartabat.
- source_word: ζωή
  choice: hidup
  rationale: Padanan langsung yang mempertahankan pertentangan dengan maut.
- source_word: ἄγγελοι
  choice: malaikat-malaikat
  rationale: Konteks daftar realitas kosmis atau adimanusiawi mendukung arti malaikat, bukan utusan manusia.
- source_word: ἀρχαὶ
  choice: para penguasa
  rationale: Mempertahankan makna luas berupa pihak-pihak yang memerintah tanpa menetapkannya secara pasti sebagai istilah teknis bagi golongan makhluk rohani tertentu.
- source_word: ἐνεστῶτα
  choice: yang ada sekarang
  rationale: Mengungkapkan partisip substantival sebagai segala realitas masa kini dengan bahasa Indonesia yang alami.
- source_word: μέλλοντα
  choice: yang akan datang
  rationale: Mempertahankan kesejajaran dengan yang ada sekarang dan cakupan umum terhadap realitas masa depan.
- source_word: δυνάμεις
  choice: segala kuasa
  rationale: Mempertahankan bentuk jamak secara kolektif serta ambiguitas antara kekuatan dan pihak-pihak berkuasa.
theological_decisions:
- issue: Apakah ἀρχαὶ dan δυνάμεις harus diterjemahkan sebagai nama teknis bagi makhluk-makhluk rohani
  choice: para penguasa dan segala kuasa
  alternative: pemerintah-pemerintah dan kuasa-kuasa; para penguasa dan kekuatan-kekuatan
  rationale: Daftar ini mungkin mencakup kuasa kosmis atau rohani, tetapi istilah Yunani tetap cukup luas. Terjemahan utama tidak membatasi rujukannya pada sistem teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Pengulangan “baik ... maupun” menjaga irama retoris daftar Yunani. Tanda koma akhir dipertahankan karena kalimat berlanjut ke ayat 39.
