  text: τῇ γὰρ ματαιότητι ἡ κτίσις ὑπετάγη, οὐχ ἑκοῦσα ἀλλὰ διὰ τὸν ὑποτάξαντα, ⸀ἐφ’ ἑλπίδι
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/020.yaml
  text: For the creation was subjected to futility[a], not willingly, but because of the one who subjected it[c][b], in hope
translation:
  language: id
  text: Sebab ciptaan ditundukkan kepada kesia-siaan[a], bukan atas kehendaknya sendiri, melainkan karena dia yang menundukkannya[b], dalam pengharapan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kehampaan” atau “frustrasi.”
    reason: lexical_alternative
  - marker: b
    text: Bahasa Yunani tidak menyebutkan secara eksplisit siapa yang dimaksud dengan “dia yang menundukkannya.”
    reason: alternative_reading
  - marker: c
    text: Atau “dengan pengharapan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ματαιότητι
  choice: kesia-siaan
  rationale: Istilah ini menggambarkan keadaan yang tidak mampu mencapai maksud atau hasil semestinya, bukan terutama kejahatan moral. “Kesia-siaan” mempertahankan keluasan makna Yunani; catatan kaki memberi alternatif yang lebih kontekstual.
- source_word: ἡ κτίσις
  choice: seluruh ciptaan
  rationale: Dalam konteks Roma 8:19–22, bentuk tunggal kolektif ini menunjuk pada tatanan ciptaan secara luas. “Seluruh ciptaan” memperjelas pemakaian kolektif tanpa membatasinya pada satu makhluk.
- source_word: ὑπετάγη
  choice: telah ditaklukkan
  rationale: Bentuk pasif menunjukkan bahwa ciptaan mengalami keadaan yang dikenakan kepadanya. “Telah ditaklukkan” mempertahankan daya pasif serta gagasan berada di bawah suatu keadaan atau kuasa.
- source_word: οὐχ ἑκοῦσα
  choice: bukan atas kehendaknya sendiri
  rationale: Ungkapan ini menyatakan bahwa ciptaan tidak memilih keadaan tersebut. Bentuk Indonesia ini alami dan mempertahankan personifikasi ciptaan dalam ayat.
- source_word: διὰ τὸν ὑποτάξαντα
  choice: karena Dia yang menaklukkannya
  rationale: διά dengan akusatif paling wajar dipahami secara kausal. “Dia” menandai rujukan personal tanpa menyebut identitasnya secara eksplisit; catatan kaki mempertahankan ketidakjelasan identitas dalam bahasa Yunani.
- source_word: ἐφ’ ἑλπίδι
  choice: dalam pengharapan
  rationale: Ungkapan ringkas ini mengarahkan pembaca kepada pengharapan yang dijabarkan pada ayat berikutnya, tanpa memperluas hubungan sintaksis melampaui teks.
theological_decisions:
- issue: Identitas pihak yang menaklukkan ciptaan
  choice: Tidak disebutkan secara eksplisit; teks memakai “Dia yang menaklukkannya” dan memberikan penjelasan dalam catatan kaki.
  alternative: Menamai Allah secara langsung, mengaitkannya dengan Adam, atau mengusulkan Iblis.
  rationale: Teks Yunani memakai frasa partisipial personal tetapi tidak menyebut identitasnya. Terjemahan tidak seharusnya menyelesaikan pertanyaan tafsir yang dibiarkan tersirat oleh teks.
- issue: Hubungan frasa ἐφ’ ἑλπίδι dengan tindakan penaklukan
  choice: Diterjemahkan “dalam pengharapan” sebagai frasa tersendiri yang tetap ringkas.
  alternative: “Dengan pengharapan” atau “atas dasar pengharapan.”
  rationale: Susunan ini mempertahankan kepadatan dan kemungkinan nuansa konstruksi Yunani sekaligus menghubungkannya secara alami dengan kelanjutan pemikiran pada ayat 21.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Personifikasi ciptaan dipertahankan. Kata “Dia” digunakan untuk rujukan personal yang tersirat, tetapi identitasnya tidak ditentukan; catatan kaki menjelaskan ambiguitas tersebut.
