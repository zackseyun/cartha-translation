  text: αὐτὸ τὸ πνεῦμα συμμαρτυρεῖ τῷ πνεύματι ἡμῶν ὅτι ἐσμὲν τέκνα θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/016.yaml
  text: The Spirit himself testifies with our spirit that we are God's children[a][b][c].
translation:
  language: id
  text: Roh itu sendiri bersaksi bersama roh kita bahwa kita adalah anak-anak Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Roh itu sendiri bersaksi kepada roh kita bahwa kita adalah anak-anak Allah.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: αὐτὸ τὸ πνεῦμα
  choice: Roh itu sendiri
  rationale: Bentuk αὐτό memberi penegasan pada subjek. Ungkapan “Roh itu sendiri” mempertahankan penegasan tersebut secara alami dalam bahasa Indonesia; huruf kapital menandai bahwa yang dimaksud dalam konteks ini adalah Roh Allah.
- source_word: συμμαρτυρεῖ
  choice: bersaksi bersama
  rationale: Kata kerja ini menyatakan tindakan memberi kesaksian bersama atau sejalan dengan pihak lain. “Bersaksi bersama” jelas dan tetap mempertahankan unsur kebersamaan dari awalan συν-.
- source_word: τῷ πνεύματι ἡμῶν
  choice: bersama roh kita
  rationale: 'Bentuk datif paling wajar dipahami sebagai penyertaan atau persekutuan dalam kesaksian: Roh bersaksi bersama roh manusia. Alternatif relasional “kepada roh kita” tetap dicatat karena mungkin secara sintaksis.'
- source_word: ὅτι ἐσμὲν
  choice: bahwa kita adalah
  rationale: ὅτι memperkenalkan isi kesaksian, dan bentuk ini menerjemahkannya secara langsung tanpa menambahkan penekanan yang tidak dinyatakan.
- source_word: τέκνα θεοῦ
  choice: anak-anak Allah
  rationale: τέκνα berarti anak-anak dan tidak terbatas pada anak laki-laki. Bentuk “anak-anak Allah” alami, inklusif, dan mempertahankan hubungan kekeluargaan yang dinyatakan teks.
theological_decisions:
- issue: Hubungan antara kesaksian Roh dan roh manusia
  choice: Roh bersaksi bersama roh kita
  alternative: Roh bersaksi kepada roh kita
  rationale: Kata majemuk συμμαρτυρεῖ dan bentuk datif mendukung gagasan kesaksian bersama. Namun, karena datif dapat dipahami sebagai pihak yang menerima kesaksian, alternatif itu dicatat tanpa menghapus ketegangan penafsirannya.
- issue: Sifat personal Roh
  choice: Roh itu sendiri
  alternative: Roh sendiri
  rationale: Bahasa Indonesia tidak memerlukan kata ganti bergender, sehingga penekanan Yunani dapat dipertahankan tanpa harus memutuskan persoalan gender gramatikal. Tindakan “bersaksi” tetap menyatakan peran aktif dan personal Roh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Susunan kalimat dekat dengan teks Yunani, sementara “bersaksi bersama” dipilih agar makna kesaksian yang sejalan tetap mudah dipahami.
