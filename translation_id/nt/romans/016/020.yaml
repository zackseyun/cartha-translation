id: ROM.16.20
reference: Romans 16:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν Σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει. ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ ⸀Χριστοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/020.yaml
  text: And the God of peace will soon crush Satan under your feet[a]. The grace of our Lord Jesus Christ be with you.
translation:
  language: id
  text: Allah sumber damai sejahtera akan segera meremukkan Satan di bawah kaki kalian. Anugerah Tuhan kita, Yesus Sang Mesias[a], menyertai kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut bentuk yang lazim dalam tradisi, “Yesus Kristus.”
    reason: Mencatat padanan tradisional bagi Χριστός sekaligus mempertahankan makna gelar “Mesias” dalam teks utama.
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς εἰρήνης
  choice: Allah, sumber damai sejahtera
  rationale: Ungkapan ini mempertahankan gelar khas Paulus sambil menyatakan hubungan genitif secara wajar dalam bahasa Indonesia. Kata δέ tidak perlu diterjemahkan secara tersendiri karena ayat ini beralih secara alami kepada janji penutup.
- source_word: συντρίψει
  choice: akan segera meremukkan
  rationale: Bentuk futur menyatakan tindakan yang akan dilakukan Allah. 'Meremukkan' cocok dengan gambaran penaklukan di bawah kaki dan lebih kuat daripada sekadar 'mengalahkan'.
- source_word: τὸν Σατανᾶν
  choice: Satan
  rationale: Dalam teks Yunani, istilah ini digunakan sebagai nama diri. Bentuk 'Satan' mempertahankan nama tersebut tanpa menggantinya dengan tafsiran seperti 'si Lawan' atau dengan nama lain.
- source_word: ὑπὸ τοὺς πόδας ὑμῶν
  choice: di bawah kaki kalian
  rationale: Ungkapan kemenangan ini dipertahankan secara langsung. 'Kalian' menunjukkan bahwa sapaan Yunani berbentuk jamak dan ditujukan kepada jemaat secara bersama-sama.
- source_word: ἐν τάχει
  choice: segera
  rationale: Dalam konteks ini, ungkapan tersebut paling alami menunjukkan kedekatan waktu, bukan hanya cepatnya cara tindakan itu berlangsung.
- source_word: ἡ χάρις
  choice: Anugerah
  rationale: '''Anugerah'' mempertahankan istilah penting dalam teologi Paulus dan cocok dengan rumusan berkat penutup.'
- source_word: τοῦ κυρίου ἡμῶν
  choice: Tuhan kita
  rationale: Genitif menyatakan bahwa anugerah itu adalah anugerah Tuhan kita; susunan Indonesia yang ringkas ini alami dalam berkat penutup.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός pada frasa ini dapat terdengar sebagai gelar. 'Sang Mesias' menyampaikan makna gelarnya dengan jelas dan alami, sementara bentuk tradisional 'Kristus' dicatat dalam catatan kaki.
- source_word: μεθ’ ὑμῶν
  choice: menyertai kalian
  rationale: Bahasa Indonesia membutuhkan predikat yang tersirat dalam bahasa Yunani. 'Menyertai kalian' merupakan ungkapan berkat yang alami dan tetap mempertahankan sapaan jamak.
theological_decisions:
- issue: Cara menerjemahkan Χριστοῦ dalam berkat penutup
  choice: Sang Mesias
  alternative: Kristus
  rationale: Istilah ini masih dapat dipahami sebagai gelar bagi Yesus, sehingga maknanya diterjemahkan sebagai 'Sang Mesias'. Namun, karena 'Kristus' sudah lama digunakan sebagai bentuk nama-gelar dalam tradisi Indonesia, bentuk itu dipertahankan dalam catatan kaki tanpa memaksakan salah satu pemahaman sebagai satu-satunya kemungkinan.
- issue: Pelaku dan penerima dalam gambaran kemenangan
  choice: Allah meremukkan Satan di bawah kaki jemaat
  alternative: Allah meremukkan Satan di bawah kaki-Nya sendiri
  rationale: Teks secara tegas memakai 'kaki kalian' dalam bentuk jamak. Terjemahan mempertahankan ketegangan bahwa Allah adalah pelaku kemenangan, sedangkan jemaat turut berada dalam posisi kemenangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kalian' dipakai untuk memperjelas bentuk jamak ὑμῶν tanpa memakai bentuk yang sangat formal atau bertele-tele. Tanda koma membantu menampilkan 'sumber damai sejahtera' sebagai gelar dan 'Yesus Sang Mesias' sebagai aposisi.
