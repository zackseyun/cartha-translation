id: ROM.16.14
reference: Romans 16:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀσύγκριτον, Φλέγοντα, ⸂Ἑρμῆν, Πατροβᾶν, Ἑρμᾶν⸃ καὶ τοὺς σὺν αὐτοῖς ἀδελφούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/014.yaml
  text: Greet Asyncritus[a], Phlegon, Hermes, Patrobas, Hermas, and the brothers with them.
translation:
  language: id
  text: Sampaikanlah salam kepada Asinkritus, Flegon, Hermes, Patrobas, Hermas, dan saudara-saudara yang bersama mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa ini kemungkinan menunjuk kepada sesama orang percaya yang berkumpul atau berhubungan dengan kelima orang tersebut.
    reason: Menjelaskan rujukan yang mungkin dari “saudara-saudara” tanpa menjadikannya bagian dari terjemahan utama atau menetapkan komposisi kelompok.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Salam kepada
  rationale: Imperatif aoristus ini berada dalam rangkaian salam penutup Paulus. Ungkapan “Salam kepada” merupakan bentuk perintah yang ringkas, alami, dan lazim dalam bahasa Indonesia, dengan subjek jamak tersirat.
- source_word: Ἀσύγκριτον
  choice: Asinkritus
  rationale: Nama diri ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia, termasuk pengalihan bunyi Yunani υ menjadi “i” dan κ menjadi “k”.
- source_word: Φλέγοντα
  choice: Flegon
  rationale: Nama diri ditransliterasikan ke bentuk Indonesia yang wajar; huruf Yunani Φ dialihkan menjadi “F”.
- source_word: Ἑρμῆν
  choice: Hermes
  rationale: Nama diri ini ditransliterasikan sebagai “Hermes”. Walaupun bentuknya sama dengan nama dewa Yunani, konteksnya jelas menunjuk kepada seseorang dalam daftar salam.
- source_word: Πατροβᾶν
  choice: Patrobas
  rationale: Nama diri ditransliterasikan sebagai “Patrobas” menurut bentuk yang telah dikenal dan sesuai dengan pelafalan sumber.
- source_word: Ἑρμᾶν
  choice: Hermas
  rationale: Nama diri ditransliterasikan sebagai “Hermas”, sehingga tetap dibedakan dari nama sebelumnya, Ἑρμῆν (“Hermes”).
- source_word: τοὺς σὺν αὐτοῖς ἀδελφούς
  choice: saudara-saudara yang bersama mereka
  rationale: Frasa ini mempertahankan hubungan langsung yang dinyatakan oleh σύν (“bersama”) dan menerjemahkan ἀδελφούς dengan istilah kekeluargaan yang alami dalam bahasa Indonesia. Dalam konteks surat Paulus, “saudara-saudara” menunjuk kepada sesama orang percaya tanpa memaksakan rincian komposisi kelompok yang tidak dinyatakan teks.
theological_decisions:
- issue: Cakupan ἀδελφούς dalam salam kepada suatu kelompok
  choice: saudara-saudara
  alternative: saudara-saudari; sesama orang percaya
  rationale: Bentuk Yunani adalah maskulin jamak, tetapi kata Indonesia “saudara-saudara” dapat berfungsi secara komunal tanpa menetapkan bahwa kelompok itu hanya terdiri dari laki-laki. Pilihan ini mempertahankan metafora kekeluargaan Paulus sekaligus tidak menambahkan komposisi gender yang tidak dijelaskan oleh konteks.
translation_notes:
  register: Bahasa dibuat ringkas, bermartabat, dan alami sebagai bagian dari daftar salam penutup. Transliterasi nama mengikuti kebiasaan ejaan Indonesia dan menjaga pembedaan antara Hermes dan Hermas.
