  yaml_path: translation/nt/romans/016/003.yaml
  text: Greet Prisca and Aquila[a], my fellow workers in Messiah Jesus[b],
translation:
  language: id
  text: Sampaikan salam kepada Priska dan Akwila[a], rekan-rekan sekerjaku dalam Mesias Yesus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Priska adalah bentuk nama yang terdapat di sini; Priskila adalah bentuk yang lebih dikenal dan dipakai di bagian lain untuk orang yang sama.
    reason: alternative_reading
  - marker: b
    text: Atau, “dalam Kristus Yesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Sampaikan salam kepada
  rationale: Imperatif aoris orang kedua jamak ini merupakan perintah lazim dalam surat untuk menyampaikan salam. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya imperatifnya.
- source_word: Πρίσκαν
  choice: Priska
  rationale: Mentransliterasikan bentuk nama yang benar-benar terdapat dalam teks Yunani, yaitu Πρίσκα, bukan bentuk Priskila yang muncul di bagian lain.
- source_word: Ἀκύλαν
  choice: Akwila
  rationale: Transliterasi Indonesia yang jelas dan lazim untuk nama Yunani Ἀκύλας.
- source_word: συνεργούς μου
  choice: teman-teman sekerjaku
  rationale: Menyatakan orang-orang yang bekerja bersama Paulus dalam tugas bersama. Bentuk jamak dipertahankan, dan ungkapan ini alami serta tidak bernuansa korporat.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: Mempertahankan ἐν sebagai 'dalam' dan menerjemahkan Χριστός sebagai gelar 'Mesias' dalam rumusan yang menyatakan lingkup atau persatuan tempat pelayanan bersama itu berlangsung.
theological_decisions:
- issue: Terjemahan Χριστῷ dalam rumusan Paulus ἐν Χριστῷ Ἰησοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Di sini Χριστός tetap dapat dipahami sebagai gelar yang menunjuk pada identitas mesianik Yesus. 'Mesias' menerjemahkan makna gelar tersebut, sementara bentuk tradisional 'Kristus' dicantumkan dalam catatan kaki tanpa meniadakan kemungkinan nuansa nama-gelar dalam rumusan Paulus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Sampaikan salam' dipilih sebagai bentuk surat-menyurat yang wajar; 'teman-teman sekerjaku' mempertahankan hubungan pribadi dan kerja bersama dalam pelayanan.
