translation:
  language: id
  text: bagi satu-satunya Allah yang bijaksana, melalui Yesus Sang Mesias, bagi-Nyalah kemuliaan selama-lamanya. Amin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini menutup doksologi pada Roma 16:25–27. Dalam naskah-naskah kuno, letak dan keberadaan doksologi ini sangat beragam; teks ini mempertahankannya di sini sesuai dengan tradisi mayoritas Bizantin.
    reason: textual_critical
lexical_decisions:
- source_word: μόνῳ
  choice: satu-satunya
  rationale: Bersama σοφῷ θεῷ, bentuk ini menegaskan bahwa Allah adalah satu-satunya yang bijaksana dalam arti mutlak; pilihan ini alami dalam bahasa Indonesia dan mempertahankan penekanan eksklusif teks.
- source_word: σοφῷ
  choice: yang bijaksana
  rationale: Menerjemahkan adjektiva datif yang menerangkan Allah dengan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: διὰ
  choice: melalui
  rationale: Dengan kasus genitif, preposisi ini menyatakan perantaraan; 'melalui' mempertahankan peran Yesus Sang Mesias dalam doksologi tanpa memperinci lebih jauh sifat perantaraan itu.
- source_word: Χριστοῦ
  choice: Sang Mesias
  rationale: Χριστός adalah gelar yang berarti 'Yang Diurapi'; 'Sang Mesias' menyampaikan gelar tersebut secara idiomatis dan membedakannya dari nama diri biasa.
- source_word: ᾧ
  choice: bagi Dialah
  rationale: Mewakili pronomina relatif datif 'kepada/bagi siapa'. Bentuk Indonesia ini tetap membiarkan kemungkinan rujukannya kepada Allah atau Yesus Sang Mesias, sebagaimana struktur Yunani.
- source_word: ἡ δόξα
  choice: kemuliaan
  rationale: Padanan baku dan alami untuk δόξα dalam sebuah doksologi.
- source_word: εἰς τοὺς αἰῶνας
  choice: selama-lamanya
  rationale: Ungkapan harfiah 'ke dalam zaman-zaman' merupakan idiom Yunani untuk durasi tanpa akhir; 'selama-lamanya' adalah padanan Indonesia yang alami.
theological_decisions:
- issue: Rujukan pronomina relatif ᾧ
  choice: bagi Dialah
  alternative: bagi Allah itu / bagi Yesus Sang Mesias itu
  rationale: Susunan Yunani memungkinkan pembaca mengaitkan ᾧ terutama dengan Allah, tetapi kedekatannya dengan Ἰησοῦ Χριστοῦ menimbulkan ketegangan gramatikal. Terjemahan tidak menetapkan salah satu rujukan secara eksplisit.
- issue: Fungsi Yesus Sang Mesias dalam doksologi
  choice: melalui Yesus Sang Mesias
  alternative: oleh Yesus Sang Mesias
  rationale: Pilihan 'melalui' mempertahankan gagasan perantaraan dalam διά dengan genitif tanpa menambahkan penafsiran denominatif tentang bentuk atau cakupan perantaraan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada doksologis. Frasa pembuka sengaja diawali huruf kecil karena ayat ini secara sintaksis melanjutkan kalimat dari ayat 25–26. 'Sang Mesias' dipakai sebagai gelar yang jelas dan idiomatis. Penanda catatan kaki [a] ditempatkan sesudah keseluruhan ayat karena catatan membahas doksologi secara keseluruhan.
