id: ROM.16.23
reference: Romans 16:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ⸂ὅλης τῆς ἐκκλησίας⸃. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/023.yaml
  text: Gaius[a], my host and the host of the whole church, greets you. Erastus, the city treasurer, greets you, and Quartus, the brother.
translation:
  language: id
  text: Gayus, yang menjadi tuan rumah bagi saya dan bagi seluruh jemaat, menyampaikan salam kepada kalian. Erastus, bendahara kota[a], menyampaikan salam kepada kalian, demikian juga Kuartus, saudara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengurus kota.” Istilah Yunani ini dapat menunjuk secara lebih luas kepada seorang pejabat pengelola pemerintahan kota, meskipun “bendahara” mungkin sesuai dengan jabatan yang dimaksud di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: menyampaikan salam kepada
  rationale: Dalam penutup surat Paulus, verba ini menyatakan pemberian atau penyampaian salam. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan arah salam kepada para penerima surat.
- source_word: ξένος
  choice: yang menjadi tuan rumah bagi
  rationale: Dalam konteks ini, kata tersebut menunjuk kepada orang yang menerima dan menjamu orang lain, bukan kepada orang asing atau tamu. Bentuk verbal relatif membuat hubungan Gayus dengan Paulus dan seluruh jemaat jelas serta alami dalam bahasa Indonesia.
- source_word: ὅλης τῆς ἐκκλησίας
  choice: seluruh jemaat
  rationale: ἐκκλησία di sini menunjuk kepada komunitas orang percaya. 'Jemaat' tepat dalam konteks lokal dan tidak menyiratkan gedung, sedangkan 'seluruh' mempertahankan cakupan ὅλης.
- source_word: οἰκονόμος τῆς πόλεως
  choice: bendahara kota
  rationale: οἰκονόμος berarti pengelola atau pengurus. Dalam konteks jabatan sipil, 'bendahara kota' merupakan padanan yang mungkin dan jelas, sementara catatan kaki mempertahankan kemungkinan arti administratif yang lebih luas.
- source_word: ὁ ἀδελφός
  choice: saudara seiman itu
  rationale: Kata sumber berbentuk maskulin tunggal dengan artikel tertentu dan dalam konteks Kristen kemungkinan menandai Kuartus sebagai sesama orang percaya. 'Saudara seiman itu' menghindari penambahan posesif 'kita' yang tidak terdapat dalam bahasa Yunani.
theological_decisions:
- issue: Makna ἐκκλησία dalam salam pribadi
  choice: jemaat
  alternative: perkumpulan
  rationale: Dalam penggunaan Paulus, istilah ini lazim menunjuk kepada komunitas Kristen. 'Jemaat' alami dan akurat dalam bahasa Indonesia tanpa menambahkan gagasan mengenai struktur atau gedung gereja.
- issue: Identitas yang dinyatakan oleh ὁ ἀδελφός
  choice: saudara seiman itu
  alternative: saudara itu
  rationale: Sebutan ini kemungkinan menyatakan hubungan Kuartus dalam persekutuan Kristen, bukan hubungan biologis. Penambahan 'seiman' menjernihkan idiom tersebut, sedangkan 'itu' mencerminkan artikel tertentu tanpa memasukkan posesif yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai bahwa ὑμᾶς berbentuk jamak. Nama diri ditransliterasikan secara lazim sebagai Gayus, Erastus, dan Kuartus. Pengulangan 'menyampaikan salam kepada kalian' mengikuti struktur dua klausa Yunani, sementara 'demikian juga' menghubungkan Kuartus secara alami.
