  naturalness: Struktur kalimat dan register pada umumnya baik untuk doksologi yang berlanjut. “Injilku” lebih langsung dan setia daripada parafrasa “Injil yang kuberitakan.” “Yang telah disembunyikan selama zaman-zaman lampau” menyampaikan partisipel pasif sempurna σεσιγημένου secara alami tanpa tautologi “rahasia yang dirahasiakan.”
  terminology: “Meneguhkan,” “Sang Mesias,” dan “penyingkapan” sesuai dan jelas. “Kalian” secara tepat mencerminkan bentuk jamak ὑμᾶς. Catatan tekstual a dan catatan ambiguitas b dapat dipertahankan.
