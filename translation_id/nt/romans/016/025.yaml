  text: Τῷ δὲ δυναμένῳ ὑμᾶς στηρίξαι κατὰ τὸ εὐαγγέλιόν μου καὶ τὸ κήρυγμα Ἰησοῦ Χριστοῦ, κατὰ ἀποκάλυψιν μυστηρίου χρόνοις αἰωνίοις σεσιγημένου,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/025.yaml
  text: '[A] to him who is able to strengthen you according to my gospel and the preaching of Jesus the Messiah, according to the revelation of the mystery kept secret for long ages,'
translation:
  language: id
  text: '[a]Bagi Dia yang sanggup meneguhkan kalian sesuai dengan Injilku dan pemberitaan tentang Yesus Sang Mesias,[b] sesuai dengan penyingkapan rahasia yang telah disembunyikan selama zaman-zaman lampau,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat 25–27 membentuk doksologi penutup yang terdapat di lokasi berbeda-beda dalam naskah-naskah kuno. Dalam tradisi mayoritas Bizantin, bagian ini terdapat pada akhir pasal 14; dalam papirus tertua yang masih ada, sesudah pasal 15; dan dalam naskah-naskah utama abad keempat serta tradisi Latin, di sini pada akhir pasal 16. Sejumlah naskah memuatnya di lebih dari satu tempat, sedangkan beberapa naskah tidak memuatnya. Kebanyakan terjemahan modern mempertahankannya di sini sebagai penutup surat Paulus.
    reason: textual_critical
  - marker: b
    text: Frasa Yunani ini dapat berarti “pemberitaan tentang Yesus Sang Mesias” atau “pemberitaan yang disampaikan oleh Yesus Sang Mesias.”
    reason: source_ambiguity
lexical_decisions:
- source_word: στηρίξαι
  choice: meneguhkan
  rationale: Menyatakan tindakan membuat orang percaya teguh dan kokoh dalam iman; bentuk ini alami dalam ragam Alkitab Indonesia tanpa kehilangan daya aktif verba Yunani.
- source_word: τὸ εὐαγγέλιόν μου
  choice: Injil yang kuberitakan
  rationale: Secara harfiah berarti “Injilku,” tetapi dalam konteks ini menunjuk pada Injil yang Paulus beritakan, bukan Injil yang berasal darinya. Ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: τὸ κήρυγμα Ἰησοῦ Χριστοῦ
  choice: pemberitaan tentang Yesus Sang Mesias
  rationale: κῆρυγμα berarti berita atau tindakan pemberitaan. Genitif Ἰησοῦ Χριστοῦ dapat dipahami secara objektif (“tentang Yesus Sang Mesias”) atau subjektif (“yang disampaikan oleh Yesus Sang Mesias”); teks utama memakai pemahaman objektif yang paling sesuai dengan konteks, sementara alternatif dicatat dalam catatan kaki.
- source_word: μυστηρίου
  choice: rahasia
  rationale: Dalam pemakaian Paulus, kata ini menunjuk pada rencana ilahi yang dahulu tersembunyi lalu disingkapkan, bukan sesuatu yang tetap tidak dapat dipahami.
- source_word: χρόνοις αἰωνίοις
  choice: selama zaman-zaman yang lampau
  rationale: Frasa idiomatis ini menunjuk pada rentang masa lampau yang sangat panjang. Terjemahan ini mempertahankan bentuk jamak dan nuansa zaman dahulu tanpa memaksakan arti “kekal” yang kurang alami dalam konteks temporal ini.
- source_word: σεσιγημένου
  choice: yang telah dirahasiakan
  rationale: Partisip perfek pasif dari σιγάω secara harfiah berkaitan dengan berdiam atau tidak mengucapkan. Dalam kaitannya dengan “rahasia,” bentuk ini menyatakan bahwa perkara tersebut tidak diberitahukan atau disingkapkan pada masa sebelumnya.
theological_decisions:
- issue: Hubungan genitif dalam Ἰησοῦ Χριστοῦ
  choice: pemberitaan tentang Yesus Sang Mesias
  alternative: pemberitaan yang disampaikan oleh Yesus Sang Mesias
  rationale: Genitif Yunani memungkinkan kedua hubungan tersebut. Pemahaman objektif lebih lazim dalam konteks ringkasan Injil Paulus, tetapi kemungkinan subjektif tetap dinyatakan dalam catatan kaki agar ambiguitas sumber tidak dihapus.
- issue: Χριστός sebagai gelar
  choice: Sang Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar yang berarti “Yang Diurapi” atau “Mesias.” Bentuk “Sang Mesias” membuat fungsi gelarnya nyata dan tetap wajar dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. “Kalian” dipakai untuk menandai bahwa ὑμᾶς berbentuk jamak. Kalimat sengaja berakhir dengan koma karena ayat ini merupakan awal doksologi yang berlanjut sampai ayat 27.
