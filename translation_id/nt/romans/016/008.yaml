  text: ἀσπάσασθε ⸀Ἀμπλιᾶτον τὸν ἀγαπητόν μου ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/008.yaml
  text: Greet Ampliatus[a], my beloved in the Lord.
translation:
  language: id
  text: Sampaikan salam kepada Ampliatus[a], yang kukasihi dalam Tuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk nama Yunani ini juga dapat dituliskan “Amplias”; bacaan SBLGNT di sini mendukung “Ampliatus.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Salam kepada
  rationale: Imperatif aoris orang kedua jamak ini merupakan perintah khas dalam surat untuk menyampaikan salam. Dalam bahasa Indonesia, bentuk eliptis imperatif “Salam kepada” terdengar alami dan ringkas dalam rangkaian salam.
- source_word: Ἀμπλιᾶτον
  choice: Ampliatus
  rationale: Nama diri ditransliterasikan dan bentuk akusatif Yunani dinormalkan menjadi bentuk nama “Ampliatus,” sesuai bacaan SBLGNT.
- source_word: τὸν ἀγαπητόν μου
  choice: yang kukasihi
  rationale: Ungkapan ini menyatakan kasih pribadi Paulus dengan hangat dan alami. “Yang kukasihi” mempertahankan unsur posesif μου tanpa gaya yang kaku.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Terjemahan ini mempertahankan ungkapan khas Paulus tentang hubungan atau lingkup persekutuan di dalam Tuhan, tanpa menambahkan “Yesus” yang tidak terdapat dalam teks Yunani.
theological_decisions:
- issue: Hubungan sintaksis dan daya teologis ἐν κυρίῳ
  choice: “dalam Tuhan” menerangkan Ampliatus sebagai orang yang dikasihi Paulus dalam lingkup persekutuan dengan Tuhan.
  alternative: Ungkapan itu dapat dipahami sekadar sebagai penanda persahabatan Kristen atau dikaitkan dengan tindakan memberi salam.
  rationale: Urutan dan susunan Yunani paling wajar menghubungkan τὸν ἀγαπητόν μου ἐν κυρίῳ dengan Ampliatus. Terjemahan mempertahankan ungkapan tersebut tanpa mempersempit secara berlebihan nuansa relasional maupun teologisnya.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, hangat, dan bermartabat. Bentuk “yang kukasihi” lebih alami daripada “kekasihku” untuk sapaan kepada seorang rekan seiman, sedangkan “dalam Tuhan” mempertahankan ungkapan Paulus secara formal.
