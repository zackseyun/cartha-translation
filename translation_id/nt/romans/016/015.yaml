id: ROM.16.15
reference: Romans 16:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/015.yaml
  text: Greet Philologus and Julia[a], Nereus and his sister, and Olympas and all the saints with them.
translation:
  language: id
  text: Sampaikan salam kepada Filologus dan Yulia[a], Nereus dan saudara perempuannya, serta Olimpas dan semua orang kudus yang bersama mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “Yulias” jika nama ini dipahami sebagai nama laki-laki; bentuk Yunani ini umumnya dipahami sebagai nama perempuan “Yulia”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Sampaikan salam kepada
  rationale: Imperatif aoris medium orang kedua jamak ini memerintahkan para penerima surat untuk menyampaikan salam; ungkapan ini alami dalam konteks surat berbahasa Indonesia.
- source_word: Φιλόλογον
  choice: Filologus
  rationale: Nama diri ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia.
- source_word: Ἰουλίαν
  choice: Yulia
  rationale: Bentuk akusatif ini paling wajar dipahami sebagai nama perempuan Yulia; kemungkinan nama laki-laki dicatat dalam catatan kaki.
- source_word: Νηρέα
  choice: Nereus
  rationale: Nama diri ditransliterasikan sebagai Nereus, sesuai bentuk nominatif Yunani dan kebiasaan Indonesia.
- source_word: τὴν ἀδελφὴν αὐτοῦ
  choice: saudara perempuannya
  rationale: ἀδελφή berarti saudara perempuan, sedangkan αὐτοῦ merujuk secara wajar kepada Nereus.
- source_word: Ὀλυμπᾶν
  choice: Olimpas
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia sebagai Olimpas.
- source_word: τοὺς σὺν αὐτοῖς
  choice: yang bersama mereka
  rationale: σύν dengan datif menyatakan kebersamaan atau persekutuan; frasa relatif mempertahankan rujukan kepada orang-orang tersebut dengan jelas.
- source_word: πάντας ἁγίους
  choice: semua orang kudus
  rationale: Dalam surat-surat Paulus, ἅγιοι lazim menunjuk kepada umat percaya sebagai orang-orang yang dikuduskan; padanan ini mempertahankan istilah gerejawi tanpa menambahkan gagasan kanonisasi di kemudian hari.
theological_decisions:
- issue: Pemadanan ἅγιοι dalam daftar salam Paulus
  choice: orang kudus
  alternative: umat Allah yang kudus; orang-orang suci
  rationale: “Orang kudus” mempertahankan sebutan khas Paulus bagi sesama orang percaya dan tidak memperluas teks dengan unsur yang tidak tersurat.
- issue: Gender nama Ἰουλίαν
  choice: Yulia
  alternative: Yulias
  rationale: Bentuk ini paling lazim dan paling mungkin merupakan nama perempuan Yulia, tetapi kemungkinan bahwa nama itu dipahami sebagai nama laki-laki tetap dicatat demi mempertahankan keterbukaan bukti.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Sampaikan salam kepada” dipilih sebagai ungkapan surat-menyurat yang alami; nama-nama disesuaikan dengan ejaan Indonesia, dan “orang kudus” mempertahankan istilah Paulus yang sudah dikenal.
