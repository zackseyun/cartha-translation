id: ROM.16.1
reference: Romans 16:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Συνίστημι δὲ ὑμῖν Φοίβην τὴν ἀδελφὴν ἡμῶν, οὖσαν ⸀καὶ διάκονον τῆς ἐκκλησίας τῆς ἐν Κεγχρεαῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/001.yaml
  text: I commend to you Phoebe[a], our sister, who is also a deacon of the church in Cenchreae,
translation:
  language: id
  text: Aku merekomendasikan Febe kepada kalian, saudari kita, yang juga seorang diaken[a] dari jemaat di Kengkrea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelayan” atau “pelayan jemaat.” Kata Yunani diakonos dapat menunjuk pada peran pelayanan yang diakui atau, secara lebih umum, pada orang yang melayani.
    reason: Mempertahankan ambiguitas leksikal antara peran khusus dalam jemaat dan pelayanan dalam arti umum.
lexical_decisions:
- source_word: Συνίστημι
  choice: Aku memperkenalkan
  rationale: Dalam konteks surat, verba ini memperkenalkan seseorang secara baik kepada para penerima sekaligus menyiratkan rekomendasi. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan objek pujian yang tidak disebutkan.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai peralihan ringan. Dalam bahasa Indonesia modern, peralihan tersebut dapat dibiarkan tersirat tanpa menambahkan kontras atau penanda waktu.
- source_word: Φοίβην
  choice: Febe
  rationale: Mengikuti bentuk nama Yunani yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: τὴν ἀδελφὴν ἡμῶν
  choice: saudari kita
  rationale: Mempertahankan bahasa kekeluargaan yang dipakai Paulus bagi sesama orang percaya tanpa menambahkan penjelasan interpretatif.
- source_word: οὖσαν καὶ
  choice: yang juga seorang
  rationale: Menyampaikan fungsi partisipial dan daya tambah καί secara wajar dalam bahasa Indonesia.
- source_word: διάκονον
  choice: diaken
  rationale: Hubungannya dengan suatu jemaat tertentu memungkinkan pengertian peran pelayanan yang dikenali. Karena istilah Yunani juga dapat berarti pelayan secara umum, ambiguitas dicatat dalam catatan kaki.
- source_word: τῆς ἐκκλησίας
  choice: jemaat
  rationale: Dalam konteks Paulus, ἐκκλησία menunjuk komunitas orang percaya setempat; 'jemaat' jelas dan alami dalam bahasa Indonesia.
- source_word: τῆς ἐν Κεγχρεαῖς
  choice: di Kengkrea
  rationale: Menerjemahkan frasa lokatif secara langsung dan memakai bentuk nama tempat yang sesuai dengan transliterasi Indonesia.
theological_decisions:
- issue: Apakah διάκονον merupakan sebutan umum bagi seorang pelayan atau nama peran pelayanan dalam jemaat
  choice: diaken
  alternative: pelayan atau pelayan jemaat
  rationale: Frasa 'jemaat di Kengkrea' menunjukkan hubungan pelayanan yang dapat dikenali dengan jemaat lokal, tetapi teks tidak menjelaskan struktur jabatan itu. Terjemahan utama memakai 'diaken', sedangkan cakupan leksikal yang lebih umum dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'Aku' dan 'kepadamu' mempertahankan orang pertama tunggal serta penerima jamak secara idiomatis; konteks surat menunjukkan bahwa 'kamu' merujuk kepada komunitas. Tanda catatan kaki ditempatkan langsung sesudah istilah yang diterangkan.
