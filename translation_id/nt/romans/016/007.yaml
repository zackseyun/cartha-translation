id: ROM.16.7
reference: Romans 16:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀνδρόνικον καὶ ⸀Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ ⸀γέγοναν ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/007.yaml
  text: Greet Andronicus and Junia[a], my kinsmen and my fellow prisoners. They are notable among the apostles[b], and they were in Messiah before me.
translation:
  language: id
  text: Sampaikan salam kepada Andronikus dan Yunia[a], kaum sebangsaku dan sesama tahananku. Mereka terkemuka di antara para rasul[b], dan mereka sudah berada dalam Mesias sebelum aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunia: dapat juga dipahami sebagai “Yunias,” nama laki-laki; namun, berdasarkan bentuk Yunani dan pemakaian historis, nama perempuan lebih mungkin.'
    reason: alternative_reading
  - marker: b
    text: Atau “dikenal baik oleh para rasul.” Ungkapan Yunani dapat dipahami bahwa mereka terkemuka dalam kalangan para rasul atau bahwa mereka dikenal baik oleh para rasul.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Sampaikan salam kepada
  rationale: Menyampaikan imperatif epistoler secara alami dan langsung dalam bahasa Indonesia modern.
- source_word: Ἀνδρόνικον
  choice: Andronikus
  rationale: Transliterasi nama Yunani yang lazim dalam bahasa Indonesia.
- source_word: Ἰουνίαν
  choice: Yunia
  rationale: Bentuk Yunani paling wajar dipahami sebagai nama perempuan Junia/Yunia; ejaan Yunia mengikuti bentuk Indonesia yang alami. Kemungkinan nama maskulin dicatat dalam catatan kaki.
- source_word: συγγενεῖς μου
  choice: kaum sebangsaku
  rationale: Dalam pemakaian Paulus, istilah ini kerap menunjuk sesama orang Yahudi. Pilihan ini lebih alami daripada 'sanak saudaraku' dalam pasangan jamak ini, meski nuansa kerabat tetap mungkin dan dicatat dalam pertimbangan.
- source_word: συναιχμαλώτους μου
  choice: rekan-rekanku dalam penjara
  rationale: Mengungkapkan orang-orang yang turut mengalami pemenjaraan bersama Paulus dengan bahasa Indonesia yang jelas dan wajar.
- source_word: ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: terkemuka di antara para rasul
  rationale: Mencerminkan arti langsung 'menonjol/terkemuka di antara para rasul' tanpa menghapus kemungkinan sintaksis bahwa mereka dikenal baik oleh para rasul; alternatif itu dicatat dalam catatan kaki.
- source_word: πρὸ ἐμοῦ
  choice: sebelum aku
  rationale: Mempertahankan prioritas waktu secara ringkas dan idiomatis.
- source_word: γέγοναν ἐν Χριστῷ
  choice: sudah berada dalam Mesias
  rationale: 'Mempertahankan idiom teologis ''dalam Mesias'' serta daya aspek perfektif: keadaan itu telah dimulai sebelum Paulus dan masih berlaku.'
theological_decisions:
- issue: Identitas/gender Ἰουνίαν
  choice: Yunia, nama perempuan
  alternative: Yunias, nama laki-laki
  rationale: Bentuk Yunani dan bukti pemakaian historis lebih mendukung nama perempuan. Alternatif maskulin dipertahankan dalam catatan kaki karena berpengaruh dalam sejarah penafsiran.
- issue: Makna ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: terkemuka di antara para rasul
  alternative: dikenal baik oleh para rasul
  rationale: Ungkapan Yunani paling langsung dapat menempatkan Andronikus dan Yunia di antara para rasul, tetapi konstruksinya memang diperdebatkan. Catatan kaki menjaga ambiguitas dan ketegangan teologis yang asli.
- issue: Ungkapan ἐν Χριστῷ
  choice: dalam Mesias
  alternative: dalam Kristus
  rationale: Mesias menerjemahkan Χριστός sebagai gelar dan tetap mempertahankan ungkapan relasional Paulus tanpa mengubahnya menjadi parafrasa tentang pertobatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara istilah 'dalam Mesias' serta ambiguitas mengenai Yunia dan hubungan mereka dengan para rasul dipertahankan secara transparan.
