id: ROM.16.11
reference: Romans 16:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἡρῳδίωνα τὸν ⸀συγγενῆ μου. ἀσπάσασθε τοὺς ἐκ τῶν Ναρκίσσου τοὺς ὄντας ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/011.yaml
  text: Greet Herodion[a], my kinsman[b]. Greet those of Narcissus who are in the Lord.
translation:
  language: id
  text: Sampaikan salam kepada Herodion, kerabatku.[a] Sampaikan salam kepada mereka dari kalangan Narkisus yang ada di dalam Tuhan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang sebangsaku” atau “sesama orang Yahudi”; istilah Yunani ini dapat menunjuk kerabat sedarah ataupun sesama anggota bangsa Paulus.
    reason: lexical_alternative
  - marker: b
    text: Kemungkinan besar yang dimaksud ialah orang-orang dari rumah tangga atau lingkungan milik Narkisus yang percaya kepada Tuhan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Sampaikan salam kepada
  rationale: Dalam konteks salam surat, bentuk imperatif ini paling alami diterjemahkan sebagai perintah untuk menyampaikan salam. Bahasa Indonesia tidak perlu menandai jamak pada bentuk imperatifnya.
- source_word: Ἡρῳδίωνα
  choice: Herodion
  rationale: Nama diri ditransliterasikan menurut bentuk Yunani dengan ejaan yang wajar dalam bahasa Indonesia.
- source_word: συγγενῆ μου
  choice: kerabatku
  rationale: Kata συγγενής dapat menunjuk kerabat sedarah atau, dalam pemakaian Paulus, orang sebangsa. 'Kerabatku' ringkas dan cukup luas, sementara kemungkinan makna etnis dicantumkan dalam catatan kaki.
- source_word: τοὺς ἐκ τῶν Ναρκίσσου
  choice: mereka dari kalangan Narkisus
  rationale: Ungkapan ini menyatakan hubungan dengan Narkisus tanpa menyebut secara eksplisit 'keluarga' atau 'rumah tangga'. 'Dari kalangan Narkisus' mempertahankan ketidakspesifikan itu dengan bahasa Indonesia yang dapat dipahami.
- source_word: τοὺς ὄντας ἐν κυρίῳ
  choice: yang ada di dalam Tuhan
  rationale: Terjemahan ini mempertahankan ungkapan khas Paulus 'di dalam Tuhan' dan membatasi salam kepada orang-orang dalam kalangan Narkisus yang memiliki hubungan tersebut.
- source_word: κυρίῳ
  choice: Tuhan
  rationale: Dalam ungkapan Paulus ini, κύριος sewajarnya diterjemahkan 'Tuhan', dengan kapitalisasi sesuai pemakaiannya sebagai sebutan bagi Kristus.
theological_decisions:
- issue: Makna συγγενής dalam salam Paulus
  choice: kerabatku
  alternative: orang sebangsaku; sesama orang Yahudi
  rationale: Ayat ini tidak memastikan apakah Herodion merupakan kerabat sedarah Paulus atau sesama anggota bangsanya. Teks utama memakai istilah yang relatif luas, dan catatan kaki mempertahankan kemungkinan makna etnis.
- issue: Cakupan orang-orang yang berhubungan dengan Narkisus
  choice: mereka dari kalangan Narkisus
  alternative: orang-orang dari rumah tangga Narkisus; orang-orang di lingkungan rumah atau tanah milik Narkisus
  rationale: Bahasa Yunani menyatakan hubungan atau asal dari kelompok Narkisus, tetapi tidak memuat kata 'rumah tangga'. Karena itu, rincian yang mungkin tetapi tidak eksplisit tidak dimasukkan ke dalam teks utama.
- issue: Makna ungkapan ἐν κυρίῳ
  choice: di dalam Tuhan
  alternative: yang menjadi milik Tuhan; yang percaya kepada Tuhan
  rationale: Bentuk harfiah mempertahankan ungkapan teologis khas Paulus tanpa mereduksinya hanya menjadi kepemilikan atau kepercayaan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan tetap bernada hormat. Pengulangan 'Sampaikan salam kepada' mengikuti struktur Yunani. Ungkapan 'di dalam Tuhan' dipertahankan karena merupakan idiom Paulus yang penting. Penanda catatan kaki ditempatkan setelah frasa yang benar-benar dijelaskannya.
