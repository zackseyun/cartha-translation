  terminology: “Tuhan” tepat bagi κυρίῳ dalam ungkapan Paulus ini. Nama Herodion dan Narkisus ditulis konsisten. Catatan a secara memadai mencatat kemungkinan makna etnis dari συγγενής, sementara catatan b membatasi penjelasan rumah tangga/lingkungan sebagai kemungkinan, bukan sebagai isi eksplisit teks.
