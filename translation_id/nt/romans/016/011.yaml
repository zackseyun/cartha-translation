  source_fidelity: Teks menerjemahkan kedua imperatif ἀσπάσασθε secara tepat. “Kerabatku” mempertahankan keluasan συγγενής tanpa memutuskan apakah maksudnya kerabat sedarah atau sesama bangsa. “Mereka dari kalangan Narkisus” menyampaikan hubungan dengan Narkisus tanpa menambahkan kata “rumah tangga”, dan “yang ada di dalam Tuhan” mempertahankan pembatasan serta idiom Paulus ἐν κυρίῳ.
