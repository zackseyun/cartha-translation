  text: ἀσπάσασθε ⸀Μαριάμ, ἥτις πολλὰ ἐκοπίασεν εἰς ⸀ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/006.yaml
  text: Greet Mary[a], who has worked very hard for you.
translation:
  language: id
  text: Sampaikan salam kepada Maria[a], yang telah bekerja sangat keras untuk kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi “untuk kami” atau “di antara kalian”, bukan “untuk kalian”.
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Sampaikan salam kepada
  rationale: Imperatif aoris medium orang kedua jamak ini digunakan dalam konteks surat untuk meminta para penerima menyampaikan salam; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: Μαριάμ
  choice: Maria
  rationale: Menggunakan bentuk nama yang sudah baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: ἥτις
  choice: yang
  rationale: Pronomina relatif ini memperkenalkan keterangan mengenai Maria; 'yang' menyampaikan fungsinya secara alami tanpa memaksakan nuansa kualitatif yang tipis.
- source_word: πολλὰ
  choice: sangat keras
  rationale: Dipakai secara adverbial untuk menekankan besarnya jerih payah; bersama 'bekerja' menghasilkan ungkapan Indonesia yang idiomatis.
- source_word: ἐκοπίασεν
  choice: telah bekerja
  rationale: Kata ini menunjuk pada kerja yang menguras tenaga. 'Bekerja sangat keras' mempertahankan intensitasnya dalam bahasa Indonesia modern, sedangkan 'telah' menempatkan pekerjaan itu sebelum salam dan pujian Paulus.
- source_word: εἰς ὑμᾶς
  choice: untuk kalian
  rationale: Dalam konteks ini, εἰς dengan orang paling wajar menyatakan arah manfaat atau kepentingan. 'Untuk kalian' jelas membedakan orang kedua jamak dan mengikuti teks SBLGNT.
theological_decisions:
- issue: Varian tekstual pada frasa terakhir
  choice: untuk kalian
  alternative: untuk kami; di antara kalian
  rationale: Teks SBLGNT berbunyi εἰς ὑμᾶς, yang paling wajar diterjemahkan 'untuk kalian'. Bacaan lain yang bermakna 'untuk kami' atau 'di antara kalian' dipertahankan dalam catatan kaki agar perbedaan naskah tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. 'Kalian' dipilih untuk menyatakan orang kedua jamak secara jelas; 'Sampaikan salam kepada' merupakan bentuk surat-menyurat yang alami. Penanda catatan kaki ditempatkan langsung setelah nama Maria.
