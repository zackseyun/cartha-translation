  text: Ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι ⸀πᾶσαι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/016.yaml
  text: Greet one another with a holy kiss[b][a]. All the churches of Messiah greet you.
translation:
  language: id
  text: Hendaklah kalian saling memberi salam dengan ciuman kudus.[a] Semua jemaat milik Mesias menyampaikan salam kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ciuman kudus” adalah bentuk salam yang dikenal dalam budaya pada masa itu dan menyatakan kasih serta persekutuan kudus di antara orang-orang percaya.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Hendaklah ... menyapa
  rationale: Imperatif aoris dari ἀσπάζομαι menyatakan perintah untuk memberi salam; bentuk “hendaklah” menjaga nada yang tegas namun wajar dalam bahasa Indonesia.
- source_word: ἀλλήλους
  choice: saling
  rationale: Pronomina resiprokal ini paling alami diungkapkan dengan “saling” dalam bahasa Indonesia.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: dengan cium kudus
  rationale: ἐν berd Nuansa sarana atau cara, φίλημα berarti cium, dan ἁγίῳ menandai sifat kudusnya dalam persekutuan umat percaya. “Cium kudus” ringkas, bermartabat, dan mempertahankan gambaran sumber.
- source_word: Ἀσπάζονται ὑμᾶς
  choice: menyampaikan salam kepada kalian
  rationale: Dalam konteks surat, ungkapan ini secara alami berarti menyampaikan salam. “Kalian” memperjelas bahwa ὑμᾶς berbentuk jamak.
- source_word: αἱ ἐκκλησίαι πᾶσαι
  choice: semua jemaat
  rationale: Urutan dan artikelnya menyatakan keseluruhan jemaat-jemaat yang dimaksud. “Jemaat” lebih lazim daripada “gereja” untuk komunitas orang percaya dalam konteks Perjanjian Baru.
- source_word: τοῦ Χριστοῦ
  choice: milik Mesias
  rationale: Genitif menunjukkan kepunyaan atau keterikatan, sedangkan Χριστός di sini tetap dapat dipahami sebagai gelar “Mesias”. “Milik Mesias” mengungkapkan relasi tersebut dengan jelas.
theological_decisions:
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός secara leksikal berarti Yang Diurapi/Mesias dan di sini masih dapat dibaca sebagai gelar. “Kristus” merupakan padanan tradisional yang sah, tetapi “Mesias” membuat makna gelarnya lebih transparan tanpa menambahkan tafsir denominasi.
- issue: Relasi genitif dalam τοῦ Χριστοῦ
  choice: milik Mesias
  alternative: dari Mesias
  rationale: “Milik Mesias” secara alami menyatakan bahwa jemaat-jemaat itu menjadi kepunyaan atau berasosiasi dengan Mesias, sedangkan “dari Mesias” dalam bahasa Indonesia dapat secara keliru terdengar seperti asal-usul geografis atau pengutusan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan komunikatif. Kata ganti “kalian” dipakai untuk menampilkan bentuk jamak Yunani secara jelas. Susunan kalimat dijaga ringkas dan sesuai dengan gaya penutup surat.
