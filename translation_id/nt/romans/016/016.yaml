  terminology: “Mesias” merupakan terjemahan yang sah bagi Χριστοῦ sebagai gelar. “Jemaat” sesuai untuk ἐκκλησίαι dalam konteks komunitas-komunitas percaya. “Ciuman kudus” mempertahankan istilah penting tanpa mengubahnya menjadi penjelasan tafsir.
