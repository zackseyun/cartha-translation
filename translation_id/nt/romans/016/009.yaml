id: ROM.16.9
reference: Romans 16:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀσπάσασθε Οὐρβανὸν τὸν συνεργὸν ἡμῶν ἐν Χριστῷ καὶ Στάχυν τὸν ἀγαπητόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/009.yaml
  text: Greet Urbanus[a], our fellow worker in Messiah, and Stachys, my beloved.
translation:
  language: id
  text: Salam kepada Urbanus, rekan sekerja kami dalam Mesias[a], dan kepada Stakhis, yang kukasihi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam Kristus.”
    reason: Terjemahan alternatif bagi Χριστῷ; 'Kristus' merupakan bentuk tradisional yang juga mungkin dalam konteks ini.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Salam kepada
  rationale: Dalam rangkaian salam, bentuk imperatif jamak ini secara alami diterjemahkan sebagai perintah ringkas untuk menyampaikan salam.
- source_word: Οὐρβανὸν
  choice: Urbanus
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dipakai dalam bahasa Indonesia.
- source_word: συνεργὸν ἡμῶν
  choice: rekan sekerja kami
  rationale: Ungkapan ini menunjukkan seseorang yang bekerja bersama Paulus dan rekan-rekannya; 'rekan sekerja' mempertahankan gagasan kemitraan dalam pekerjaan.
- source_word: ἐν Χριστῷ
  choice: dalam Mesias
  rationale: Frasa ini menyatakan lingkup atau kesatuan yang berkaitan dengan Χριστός. 'Mesias' mempertahankan fungsi gelarnya, sedangkan 'dalam' menjaga keluwesan makna ungkapan Yunani.
- source_word: Στάχυν
  choice: Stakhis
  rationale: Nama pribadi Yunani ditransliterasikan agar pengucapannya wajar dalam bahasa Indonesia.
- source_word: ἀγαπητόν μου
  choice: yang kukasihi
  rationale: Pilihan ini menyampaikan kehangatan pribadi tanpa kesan romantis yang dapat timbul dari kata 'kekasihku' dalam bahasa Indonesia modern.
theological_decisions:
- issue: Terjemahan Χριστῷ dalam frasa ἐν Χριστῷ
  choice: Mesias
  alternative: Kristus
  rationale: Di sini Χριστός masih dapat dipahami sebagai gelar. 'Mesias' mempertahankan nilai gelar tersebut, sementara alternatif tradisional 'Kristus' dicatat tanpa mengubah makna relasional frasa itu.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan hangat. Pengulangan 'kepada' sebelum Stakhis dipakai untuk menghasilkan susunan daftar salam yang alami dan jelas.
