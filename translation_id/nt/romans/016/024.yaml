id: ROM.16.24
reference: Romans 16:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ὑμῶν.⸃ ⸀Ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/024.yaml
  text: The grace of our Lord Jesus Christ be with all of you[b][a]. Amen.
translation:
  language: id
  text: '[b]Kiranya anugerah Tuhan kita Yesus Kristus[a] menyertai kamu semua. Amin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Yesus Mesias.” Kata Yunani Χριστός berarti “Mesias” dan secara tradisional dialihaksarakan sebagai “Kristus.”'
    reason: alternative_reading
  - marker: b
    text: Sejumlah naskah memuat ayat ini, sedangkan yang lain tidak; banyak edisi modern menandainya sebagai varian tekstual pada bagian penutup Surat Roma.
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: anugerah
  rationale: Dalam berkat penutup Paulus, istilah ini menunjuk pada kemurahan dan pemberian Allah yang tidak layak diterima; “anugerah” mempertahankan bobot teologis sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: κυρίου
  choice: Tuhan
  rationale: Dalam gelar kristologis ini, κύριος menyatakan kedudukan dan kewibawaan Yesus; “Tuhan” merupakan padanan baku dan alami.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Kristus
  rationale: “Yesus” mempertahankan nama diri, sedangkan “Kristus” adalah bentuk yang telah mapan dalam bahasa Indonesia untuk Χριστός; makna gelarnya sebagai Mesias dijelaskan dalam catatan kaki agar tetap jelas.
- source_word: μετὰ πάντων ὑμῶν
  choice: menyertai kamu semua
  rationale: Ungkapan ini menyampaikan harapan berkat agar anugerah hadir bersama seluruh jemaat; “menyertai kamu semua” alami dan mempertahankan cakupan πάντων.
- source_word: Ἀμήν
  choice: Amin
  rationale: Bentuk liturgis yang sudah baku dalam bahasa Indonesia dan sesuai dengan fungsi peneguhan pada akhir berkat.
theological_decisions:
- issue: Penerjemahan Χριστός dalam Ἰησοῦ Χριστοῦ
  choice: Kristus
  alternative: Mesias
  rationale: Dalam pemakaian bahasa Indonesia, “Yesus Kristus” merupakan bentuk gelar-nama yang mapan dan mudah dipahami. Karena Χριστός tetap bermakna “Mesias,” alternatif semantis tersebut dicantumkan dalam catatan kaki tanpa menghilangkan bentuk tradisional dari teks utama.
- issue: Status tekstual seluruh ayat
  choice: Ayat dipertahankan dengan penanda varian tekstual
  alternative: Ayat dihilangkan dari teks utama
  rationale: SBLGNT menampilkan ayat ini sebagai bagian yang dipersoalkan secara tekstual. Mempertahankannya dengan catatan memungkinkan pembaca melihat isinya sekaligus mengetahui bahwa sejumlah saksi naskah tidak memuatnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk optatif Yunani disampaikan secara alami dengan “Kiranya,” sedangkan “kamu semua” mempertahankan sapaan jamak yang mencakup seluruh jemaat. Penanda [b] ditempatkan sebelum seluruh ayat karena variannya menyangkut keberadaan ayat secara keseluruhan; [a] mengikuti frasa yang diterangkannya.
