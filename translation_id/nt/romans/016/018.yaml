id: ROM.16.18
reference: Romans 16:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ⸀ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσι τὰς καρδίας τῶν ἀκάκων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/018.yaml
  text: For such people do not serve our Lord Messiah[a], but their own belly[c][b], and by smooth talk and flattery they deceive the hearts of the unsuspecting.
translation:
  language: id
  text: Sebab orang-orang seperti itu tidak melayani Tuhan kita, Sang Mesias,[a] melainkan perut mereka sendiri,[b] dan dengan kata-kata manis serta sanjungan mereka memperdaya hati orang-orang yang tidak menaruh curiga.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tuhan kita, Kristus.”
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “perut mereka sendiri,” suatu gambaran tajam tentang hasrat untuk memuaskan diri.
    reason: lexical_alternative
  - marker: c
    text: Atau, “orang-orang yang tidak bersalah” atau “orang-orang yang tidak licik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιοῦτοι
  choice: orang-orang seperti itu
  rationale: Merujuk kembali kepada para pembuat perpecahan dalam ayat sebelumnya dan mempertahankan daya tunjuk ungkapan Yunani secara alami.
- source_word: τῷ κυρίῳ ἡμῶν Χριστῷ
  choice: Tuhan kita, Sang Mesias
  rationale: Menerjemahkan κύριος sebagai 'Tuhan' dan Χριστός sebagai gelar 'Sang Mesias'; nama Yesus tidak ditambahkan karena tidak terdapat dalam teks Yunani.
- source_word: δουλεύουσιν
  choice: melayani
  rationale: Menyampaikan gagasan mengabdi atau melayani sebagai hamba, sekaligus menjaga kontras alami antara melayani Tuhan dan melayani perut sendiri.
- source_word: κοιλίᾳ
  choice: perut
  rationale: Mempertahankan gambaran konkret Paulus tentang kepentingan dan hasrat diri, tanpa mempersempitnya menjadi sekadar selera makan.
- source_word: χρηστολογίας
  choice: kata-kata manis
  rationale: Menggambarkan ucapan menyenangkan dan memikat yang dipakai untuk mengelabui; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: εὐλογίας
  choice: sanjungan
  rationale: Dalam konteks manipulatif ini, kata tersebut menunjuk pada pujian atau tutur yang menyanjung, bukan berkat yang tulus.
- source_word: ἐξαπατῶσι
  choice: memperdaya
  rationale: Menangkap unsur penipuan yang disengaja dan kuat dalam verba majemuk Yunani.
- source_word: καρδίας
  choice: hati
  rationale: Mempertahankan gambaran antropologis tentang pusat batin manusia, bukan membatasinya hanya pada pikiran.
- source_word: ἀκάκων
  choice: orang-orang yang tidak menaruh curiga
  rationale: Sesuai dengan konteks peringatan terhadap penyesatan dan mempertahankan nuansa orang yang lugu, tidak berniat jahat, serta rentan diperdaya.
theological_decisions:
- issue: Penerjemahan Χριστός dalam frasa gelar Paulus
  choice: Sang Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar bagi pribadi yang diurapi; 'Sang Mesias' menyatakan makna gelar itu, sedangkan bentuk tradisional 'Kristus' dicatat sebagai alternatif.
- issue: Makna kiasan 'perut mereka sendiri'
  choice: Mempertahankan metafora dalam teks utama
  alternative: keinginan diri mereka sendiri
  rationale: Metafora Paulus sengaja tajam dan dapat mencakup kepentingan serta pemuasan diri secara luas; menggantinya dengan uraian abstrak akan menutup sebagian keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan kontras retoris antara Tuhan dan perut sendiri. Koma sebelum penanda catatan [a] mengikuti fungsi aposisi 'Sang Mesias'; titik koma membantu memperjelas dua bagian tuduhan.
