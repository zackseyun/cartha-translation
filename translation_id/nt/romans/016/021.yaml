  source_fidelity: 'Teks dengan tepat mencerminkan struktur dan makna Yunani: Timotius sebagai subjek tunggal yang menyampaikan salam, diikuti Lukius, Yason, dan Sosipater sebagai pemberi salam tambahan. "Rekan sekerjaku" menerjemahkan συνεργός dengan baik, dan "kaum kerabatku" mempertahankan keluasan συγγενεῖς χωρίς menentukan apakah yang dimaksud adalah kerabat keluarga atau sesama bangsa.'
