id: ROM.16.21
reference: Romans 16:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου, καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/021.yaml
  text: Timothy[a], my fellow worker, greets you, and so do Lucius and Jason and Sosipater, my kinsmen.
translation:
  language: id
  text: Timotius, rekan sekerjaku, menyampaikan salam kepada kalian. Demikian juga Lukius, Yason, dan Sosipater, kaum kerabatku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sanak saudaraku” atau “sesama orang Yahudi denganku.” Istilah Yunani yang dipakai dapat menunjuk kepada hubungan keluarga ataupun hubungan kekerabatan atau kebangsaan yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: menyampaikan salam kepada
  rationale: Dalam konteks surat, ἀσπάζομαι berarti memberi atau menyampaikan salam. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan tindakan pribadi dari subjeknya.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Kata ganti ini adalah bentuk orang kedua jamak dan mengacu kepada para penerima surat di Roma secara kolektif. 'Kalian' menyatakan kejamakan itu dengan jelas dalam bahasa Indonesia modern.
- source_word: συνεργός
  choice: rekan sekerja
  rationale: συνεργός menunjuk kepada orang yang bekerja bersama dalam suatu pekerjaan bersama, khususnya pelayanan dalam konteks Paulus. 'Rekan sekerja' jelas, wajar, dan tidak bernuansa korporat secara berlebihan.
- source_word: Λούκιος
  choice: Lukius
  rationale: Nama ini dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: Ἰάσων
  choice: Yason
  rationale: Nama ini dialihaksarakan menurut kaidah dan kelaziman bahasa Indonesia.
- source_word: Σωσίπατρος
  choice: Sosipater
  rationale: Bentuk Yunani dalam ayat ini adalah Σωσίπατρος, sehingga 'Sosipater' mempertahankan bentuk nama tersebut, bukan bentuk pendek 'Sopater' yang dikenal di tempat lain.
- source_word: συγγενεῖς
  choice: kaum kerabat
  rationale: συγγενής dapat menunjuk kepada kerabat sedarah ataupun hubungan kekerabatan yang lebih luas, termasuk kesamaan bangsa. 'Kaum kerabat' mempertahankan nuansa hubungan tersebut tanpa membatasinya secara tegas hanya pada keluarga dekat atau sesama orang Yahudi.
theological_decisions:
- issue: Makna συγγενεῖς μου dalam pemakaian Paulus
  choice: kaum kerabatku
  alternative: sanak saudaraku; sesama orang Yahudi denganku
  rationale: Istilah Yunani ini dapat berarti kerabat keluarga atau orang-orang yang memiliki ikatan bangsa dengan Paulus. Karena ayat ini tidak menentukan lingkup yang dimaksud, teks utama mempertahankan keterbukaannya dan catatan kaki menyebutkan kemungkinan-kemungkinannya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kalimat dibagi dua agar rangkaian salam terdengar alami, sementara 'Demikian juga' mempertahankan hubungan καί dengan tiga nama berikutnya. Bentuk 'kalian' dipakai untuk menyatakan objek jamak secara eksplisit.
