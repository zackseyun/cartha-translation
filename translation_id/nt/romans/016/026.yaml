  text: φανερωθέντος δὲ νῦν, διά τε γραφῶν προφητικῶν, κατ' ἐπιταγὴν τοῦ αἰωνίου θεοῦ, εἰς ὑπακοὴν πίστεως εἰς πάντα τὰ ἔθνη γνωρισθέντος,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/026.yaml
  text: but[a] has now been revealed, and through the prophetic Scriptures made known to all nations, according to the command of the eternal God, to bring about the obedience of faith,
translation:
  language: id
  text: tetapi sekarang telah dinyatakan dan, melalui tulisan-tulisan profetis, telah diberitahukan kepada segala bangsa, sesuai dengan perintah Allah yang kekal, untuk membawa mereka kepada ketaatan iman,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini merupakan kelanjutan doksologi penutup (Roma 16:25–27). Lihat catatan pada Roma 16:25 mengenai letak doksologi ini dan bukti naskahnya.
    reason: textual_critical
lexical_decisions:
- source_word: φανερωθέντος
  choice: telah dinyatakan
  rationale: Partisipel ini merujuk kembali kepada 'rahasia' dalam ayat 25 dan menyatakan bahwa rahasia yang dahulu tersembunyi kini telah dibuat nyata.
- source_word: γραφαῖς προφητικαῖς
  choice: Kitab-kitab Suci para nabi
  rationale: Ungkapan ini menunjuk kepada tulisan-tulisan suci yang bersifat profetis; bentuk ini alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan para nabi.
- source_word: ἐπιταγήν
  choice: perintah
  rationale: Kata ini menyatakan arahan yang berwibawa dan menegaskan bahwa pemberitaan kepada segala bangsa berlangsung atas perintah Allah.
- source_word: ὑπακοὴν πίστεως
  choice: ketaatan iman
  rationale: Terjemahan ini mempertahankan ungkapan Yunani yang padat serta ambiguitas relasi antara iman dan ketaatan, sekaligus menjaga kaitannya dengan Roma 1:5.
- source_word: πάντα τὰ ἔθνη
  choice: segala bangsa
  rationale: Pilihan ini mempertahankan cakupan universal ungkapan Yunani tanpa membatasinya secara eksplisit hanya kepada orang bukan Yahudi.
- source_word: αἰωνίου θεοῦ
  choice: Allah yang kekal
  rationale: Terjemahan langsung dan wajar yang menyatakan sifat kekal Allah.
theological_decisions:
- issue: Makna genitif dalam ὑπακοὴν πίστεως
  choice: ketaatan iman
  alternative: ketaatan yang timbul dari iman / ketaatan kepada iman
  rationale: Bahasa Yunani memungkinkan lebih dari satu hubungan antara 'ketaatan' dan 'iman'. Bentuk yang padat dipertahankan agar ketegangan semantis itu tidak diselesaikan secara sepihak.
- issue: Objek tersirat dalam tujuan pemberitahuan
  choice: untuk membawa mereka kepada ketaatan iman
  alternative: menuju ketaatan iman
  rationale: Kata 'mereka' menjelaskan secara alami bahwa segala bangsa adalah sasaran yang hendak dibawa kepada ketaatan, tanpa mengubah arah teologis frasa tujuan Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dipertahankan sebagai kelanjutan dari ayat 25. Istilah 'Kitab-kitab Suci para nabi' dipilih agar jelas bagi pembaca umum, dan 'ketaatan iman' sengaja mempertahankan kepadatan serta ambiguitas ungkapan sumber.
