id: ROM.16.17
reference: Romans 16:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ⸀ἐκκλίνετε ἀπ’ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/017.yaml
  text: I urge you[a], brothers, to watch out for those who cause divisions and stumbling blocks contrary to the teaching that you learned, and turn away from them.
translation:
  language: id
  text: Saya mengimbau kalian, Saudara-saudara[a], agar mewaspadai orang-orang yang, bertentangan dengan ajaran yang telah kalian pelajari, menimbulkan perpecahan dan batu sandungan. Jauhilah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudara-saudara laki-laki”; sapaan Yunani ini kemungkinan ditujukan kepada seluruh jemaat, baik laki-laki maupun perempuan.
    reason: Menjelaskan bentuk gramatikal Yunani dan kemungkinan cakupan inklusif sapaan tersebut.
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Saya mengimbau
  rationale: Kata kerja ini menyampaikan seruan pastoral yang sungguh-sungguh. “Mengimbau” alami dan berwibawa dalam bahasa Indonesia modern tanpa terdengar terlalu keras.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Bentuk sapaan jamak maskulin diterjemahkan secara langsung dengan sapaan Indonesia yang wajar; dalam konteks Paulus, sapaan ini kemungkinan mencakup seluruh jemaat.
- source_word: σκοπεῖν
  choice: agar mewaspadai
  rationale: Infinitif ini menyerukan perhatian yang disertai kehati-hatian terhadap orang-orang tertentu. “Mewaspadai” menyampaikan kedua unsur tersebut dengan ringkas.
- source_word: διχοστασίας
  choice: perpecahan
  rationale: Istilah ini menunjuk pada pertentangan yang memecah komunitas; “perpecahan” jelas dan alami dalam konteks jemaat.
- source_word: σκάνδαλα
  choice: batu sandungan
  rationale: Pilihan ini mempertahankan gambaran metaforis tentang sesuatu yang menyebabkan orang tersandung, bukan meratakannya menjadi sekadar pelanggaran atau rasa tersinggung.
- source_word: παρὰ τὴν διδαχήν
  choice: bertentangan dengan ajaran
  rationale: παρά dengan akusatif menyatakan penyimpangan dari atau perlawanan terhadap patokan ajaran yang telah diterima.
- source_word: ἐμάθετε
  choice: yang telah kalian pelajari
  rationale: Bentuk aoristus menunjuk pada ajaran yang sebelumnya sudah dipelajari oleh para penerima surat. “Telah kalian pelajari” menyatakannya secara langsung.
- source_word: ποιοῦντας
  choice: menimbulkan
  rationale: Partisip ini menggambarkan orang-orang tersebut sebagai penyebab perpecahan dan batu sandungan; “menimbulkan” merupakan ungkapan Indonesia yang idiomatis.
- source_word: ἐκκλίνετε ἀπ’ αὐτῶν
  choice: Jauhilah mereka
  rationale: Ungkapan ini memerintahkan pembaca untuk berbalik atau menjauh dari mereka. “Jauhilah” mempertahankan daya imperatif dan menyampaikan tindakan praktis yang dimaksud.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί kepada jemaat Roma
  choice: Memakai “Saudara-saudara” dalam teks utama dan menjelaskan cakupan seluruh jemaat dalam catatan kaki.
  alternative: “Saudara-saudari” dalam teks utama.
  rationale: Bentuk Yunani secara harfiah adalah jamak maskulin, tetapi dalam pemakaian Paulus kemungkinan besar menyapa seluruh jemaat, termasuk perempuan. Catatan kaki mempertahankan kedua fakta itu tanpa menghapus bentuk sumber atau mempersempit cakupannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk mempertahankan bentuk orang kedua jamak yang eksplisit; susunan kalimat menempatkan frasa “bertentangan dengan ajaran” dekat dengan tindakan yang dinilainya, sementara metafora “batu sandungan” tetap dipertahankan.
