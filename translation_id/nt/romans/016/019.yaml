revisions:
- from: Sebab ketaatanmu telah sampai kepada semua orang.[a] Karena itu, aku bersukacita atas kamu,[b] tetapi aku ingin agar kamu bijaksana dalam hal yang baik dan tulus dalam hal yang jahat.[c]
  to: Sebab ketaatanmu telah sampai kepada semua orang.[a] Karena itu, aku bersukacita atas kamu,[b] tetapi aku ingin agar kamu bijaksana dalam hal yang baik dan tidak tercemar oleh yang jahat.[c]
  rationale: Revisi hanya mengganti “tulus dalam hal yang jahat” dengan “tidak tercemar oleh yang jahat” untuk mencegah pembacaan yang berlawanan dengan maksud sumber. Ungkapan baru menyampaikan kemurnian moral yang ditekankan ἀκεραίους tanpa menambahkan gagasan bahwa pembaca harus tidak mengetahui adanya kejahatan.
