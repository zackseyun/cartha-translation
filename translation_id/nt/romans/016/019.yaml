id: ROM.16.19
reference: Romans 16:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ γὰρ ὑμῶν ὑπακοὴ εἰς πάντας ἀφίκετο· ⸂ἐφ’ ὑμῖν οὖν χαίρω⸃, θέλω δὲ ὑμᾶς ⸀σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/019.yaml
  text: For your obedience has reached everyone[a]. Therefore I rejoice over you, but I want you to be wise in what is good[c][b], and innocent in what is evil.
translation:
  language: id
  text: Sebab ketaatanmu telah sampai kepada semua orang.[a] Karena itu, aku bersukacita atas kamu,[b] tetapi aku ingin agar kamu bijaksana dalam hal yang baik dan tidak tercemar oleh yang jahat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketaatanmu telah dikenal luas.” Secara harfiah, bahasa Yunani berbunyi “ketaatanmu telah sampai kepada semua orang.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “aku bersukacita karena kamu.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “murni” atau “tanpa kelicikan” dalam hal yang jahat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακοή
  choice: ketaatan
  rationale: Dalam pemakaian Paulus, kata ini menunjuk pada tanggapan yang taat, bukan sekadar tindakan mendengar.
- source_word: εἰς πάντας ἀφίκετο
  choice: telah sampai kepada semua orang
  rationale: Terjemahan ini mempertahankan gambaran harfiah bahwa ketaatan mereka 'sampai' kepada semua orang, sambil membiarkan konteks menyiratkan bahwa kabar tentangnya telah tersebar luas.
- source_word: ἐφ’ ὑμῖν ... χαίρω
  choice: aku bersukacita atas kamu
  rationale: ἐπί dengan datif dapat menunjukkan dasar atau alasan sukacita; frasa ini mempertahankan bentuk ringkas dan ambiguitas antara 'atas' dan 'karena' mereka.
- source_word: σοφοὺς ... εἰς τὸ ἀγαθόν
  choice: bijaksana dalam hal yang baik
  rationale: Ungkapan ini menyatakan kebijaksanaan atau kecakapan membedakan yang diarahkan kepada apa yang baik.
- source_word: ἀκεραίους ... εἰς τὸ κακόν
  choice: tulus dalam hal yang jahat
  rationale: ἀκέραιος secara dasar berarti tidak bercampur, murni, tulus, atau tanpa kelicikan. 'Tulus' menjaga kontras dengan kebijaksanaan tanpa menyiratkan ketidaktahuan naif tentang kejahatan.
theological_decisions:
- issue: Cakupan πάντας
  choice: '''semua orang'' dipertahankan sebagai ungkapan retoris yang luas'
  alternative: '''semua orang di jemaat-jemaat'' atau ''dikenal luas'''
  rationale: Teks Yunani tidak menyebut kelompok yang lebih sempit. Terjemahan utama mempertahankan keluasan ungkapannya tanpa menjadikannya klaim universal matematis.
- issue: Kontras σοφούς dan ἀκεραίους
  choice: bijaksana mengenai yang baik dan tulus mengenai yang jahat
  alternative: cerdik untuk kebaikan dan tidak bersalah terhadap kejahatan
  rationale: Terjemahan mempertahankan ketegangan antara daya membedakan secara aktif dalam kebaikan dan sikap yang tidak tercemar atau tidak licik dalam hubungannya dengan kejahatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel 'dalam hal yang baik ... dalam hal yang jahat' dipertahankan. 'Tulus' dipilih untuk ἀκεραίους karena alami dalam bahasa Indonesia serta mencakup nuansa murni dan tanpa kelicikan; alternatif penting dicatat dalam catatan kaki.
