id: ROM.16.22
reference: Romans 16:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀσπάζομαι ὑμᾶς ἐγὼ Τέρτιος ὁ γράψας τὴν ἐπιστολὴν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/022.yaml
  text: I[a], Tertius, who wrote the letter, greet you in the Lord.
translation:
  language: id
  text: Aku[a], Tertius, yang menulis surat ini, menyampaikan salam kepada kalian dalam Tuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, meskipun kemungkinannya lebih kecil, “Aku, Tertius, yang menulis surat ini dalam Tuhan, menyampaikan salam kepada kalian.” Frasa Yunani “dalam Tuhan” dapat dikaitkan dengan “menulis”, tetapi lebih alami menerangkan penyampaian salam.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάζομαι
  choice: menyampaikan salam kepada
  rationale: Dalam penutup surat, ungkapan ini secara alami menyatakan pemberian atau penyampaian salam; pilihan ini lebih wajar dalam bahasa Indonesia daripada terjemahan harfiah 'menyalami' ketika dilakukan melalui tulisan.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Kata ganti ini berbentuk jamak. 'Kalian' menyatakan jumlah jamak secara jelas dan cocok untuk sapaan kepada jemaat.
- source_word: ἐγὼ Τέρτιος
  choice: Aku, Tertius
  rationale: Kata ganti yang dinyatakan secara eksplisit bersama nama menonjolkan identitas pembicara. Susunan ini mempertahankan penegasan tersebut secara alami.
- source_word: ὁ γράψας
  choice: yang menulis
  rationale: Partisip aoristus dengan artikel mengidentifikasi Tertius sebagai orang yang menuliskan surat itu, kemungkinan sebagai juru tulis, tanpa menambahkan peran yang tidak dinyatakan langsung.
- source_word: τὴν ἐπιστολήν
  choice: surat ini
  rationale: Walaupun bahasa Yunani memakai artikel dan bukan kata penunjuk, konteks rujukan kepada surat yang sedang dibaca membuat 'surat ini' alami dan jelas dalam bahasa Indonesia.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Ungkapan khas Paulus ini dipertahankan sebagai ungkapan relasional atau lingkup persekutuan Kristen, tanpa menguraikan maknanya secara berlebihan.
theological_decisions:
- issue: Kaitan frasa ἐν κυρίῳ ('dalam Tuhan')
  choice: 'Dipahami terutama menerangkan salam: Tertius menyampaikan salam kepada para penerima dalam Tuhan.'
  alternative: 'Frasa itu dapat menerangkan tindakan menulis: ''yang menulis surat ini dalam Tuhan''.'
  rationale: Dalam konteks penutup surat, frasa tersebut lebih alami berkaitan dengan salam utama dan menunjukkan persekutuan di dalam Tuhan. Namun, susunan bahasa Yunani memungkinkan kaitan dengan 'menulis', sehingga alternatif itu dicatat dan tidak disingkirkan.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada surat yang hangat dan bermartabat. 'Aku' mempertahankan bentuk orang pertama tunggal dan cocok dengan suara pribadi Tertius; 'kalian' memperjelas bahwa para penerima berjumlah jamak. Istilah 'Tuhan' mengikuti pemakaian Kristen yang mapan untuk κύριος.
