base_translation:
  language: en
  yaml_path: translation/nt/romans/016/013.yaml
  text: Greet Rufus[a], the chosen one in the Lord, and his mother and mine.
translation:
  language: id
  text: Salamilah Rufus[a], orang pilihan dalam Tuhan, dan ibunya serta ibuku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang terpilih dalam Tuhan.” Kata sifat Yunani yang dipakai di sini juga dapat berarti “istimewa” atau “unggul.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Salamilah
  rationale: Bentuk imperatif jamak ini memerintahkan para penerima surat untuk menyampaikan salam. “Salamilah” ringkas, wajar, dan sesuai dengan rangkaian salam penutup Paulus.
- source_word: Ῥοῦφον
  choice: Rufus
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: ἐκλεκτὸν
  choice: orang pilihan
  rationale: Ungkapan ini mempertahankan kemungkinan makna seseorang yang dipilih sekaligus nuansa seseorang yang istimewa atau unggul, tanpa menjadikannya istilah teologis yang terlalu teknis.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Terjemahan ini mempertahankan ungkapan relasional atau lingkup yang terdapat dalam bahasa Yunani tanpa mempersempitnya menjadi “oleh Tuhan”.
- source_word: μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: ibunya, yang juga adalah ibuku
  rationale: Bahasa Yunani secara eliptis berbunyi “ibunya dan ibuku.” Susunan Indonesia ini memperjelas bahwa yang dimaksud adalah satu perempuan, sambil mempertahankan pernyataan Paulus yang hangat tanpa menjabarkan sifat hubungan itu.
theological_decisions:
- issue: Makna ἐκλεκτὸν ἐν κυρίῳ
  choice: orang pilihan dalam Tuhan
  alternative: orang yang terpilih dalam Tuhan; orang yang istimewa dalam Tuhan
  rationale: Frasa itu dapat menunjuk pada pemilihan ilahi atau pada kedudukan Rufus sebagai orang yang istimewa dan teruji di antara umat Tuhan. Terjemahan utama mempertahankan keluasan maknanya, sedangkan catatan kaki menunjukkan alternatif leksikalnya.
- issue: Makna “ibunya ... juga adalah ibuku”
  choice: Mempertahankan bahasa kekerabatan Paulus tanpa menjelaskan secara eksplisit bahwa ungkapan itu bersifat afektif atau relasional.
  alternative: ibunya, yang sudah seperti ibu bagiku
  rationale: Konteks sangat mendukung makna relasional, bukan klaim bahwa perempuan itu ibu biologis Paulus. Namun, teks utama tidak menambahkan “seperti,” sehingga kehangatan dan ketegasan ungkapan aslinya tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Bentuk “Salamilah” cocok dengan konteks salam penutup surat. Ungkapan “yang juga adalah ibuku” dibuat jelas sebagai rujukan kepada perempuan yang sama tanpa memperluas teks menjadi tafsiran eksplisit.
