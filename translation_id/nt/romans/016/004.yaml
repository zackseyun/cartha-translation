id: ROM.16.4
reference: Romans 16:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἵτινες ὑπὲρ τῆς ψυχῆς μου τὸν ἑαυτῶν τράχηλον ὑπέθηκαν, οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ πᾶσαι αἱ ἐκκλησίαι τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/004.yaml
  text: who laid down their own necks for my life[a], to whom not only I give thanks, but also all the churches of the Gentiles[b],
translation:
  language: id
  text: yang telah mempertaruhkan nyawa mereka demi nyawaku[a]. Bukan hanya aku yang berterima kasih kepada mereka, tetapi juga semua jemaat dari kalangan bangsa-bangsa bukan Yahudi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menaruh leher mereka sendiri”; ungkapan Yunani ini berarti menghadapkan diri pada bahaya maut.
    reason: lexical_alternative
  - marker: b
    text: Atau “semua jemaat bangsa-bangsa.”
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: yang telah
  rationale: Memperkenalkan klausa relatif deskriptif tentang Priskila dan Akwila; bentuk ini alami dalam bahasa Indonesia dan menghubungkannya dengan ayat sebelumnya.
- source_word: ὑπὲρ τῆς ψυχῆς μου
  choice: demi nyawaku
  rationale: Dalam konteks ini ψυχή menunjuk pada hidup atau nyawa Paulus yang terancam, bukan pada jiwa sebagai unsur tak berjasmani.
- source_word: τὸν ἑαυτῶν τράχηλον ὑπέθηκαν
  choice: mempertaruhkan nyawa mereka
  rationale: Ungkapan harfiah tentang menaruh leher sendiri menggambarkan tindakan menghadapkan diri pada bahaya maut. Padanan idiomatis Indonesia menyampaikan maknanya secara jelas sambil mempertahankan bobot pengorbanannya.
- source_word: οἷς ... εὐχαριστῶ
  choice: aku ... berterima kasih kepada mereka
  rationale: Datif οἷς bersama εὐχαριστῶ secara alami dinyatakan dengan 'kepada mereka' dalam bahasa Indonesia.
- source_word: οὐκ ἐγὼ μόνος ... ἀλλὰ καὶ
  choice: Bukan hanya aku ... tetapi juga
  rationale: Mempertahankan penekanan kontras bahwa Paulus bukan satu-satunya pihak yang berterima kasih.
- source_word: πᾶσαι αἱ ἐκκλησίαι
  choice: semua jemaat
  rationale: Dalam konteks surat-surat Paulus, ἐκκλησίαι menunjuk pada komunitas-komunitas umat percaya; 'jemaat' merupakan padanan Indonesia yang alami.
- source_word: τῶν ἐθνῶν
  choice: dari bangsa-bangsa lain
  rationale: Menunjuk pada komunitas non-Yahudi. Ungkapan ini jelas bagi pembaca Indonesia dan tetap memperlihatkan dimensi Yahudi–non-Yahudi dalam konteks Roma.
theological_decisions:
- issue: Makna ψυχή dalam pernyataan Paulus
  choice: nyawa
  alternative: jiwa
  rationale: Konteksnya adalah bahaya nyata dan tindakan pengorbanan untuk menyelamatkan hidup Paulus, sehingga 'nyawa' lebih tepat daripada pengertian antropologis 'jiwa'.
- issue: Makna τῶν ἐθνῶν
  choice: bangsa-bangsa lain
  alternative: orang-orang bukan Yahudi
  rationale: Frasa itu paling wajar merujuk pada jemaat-jemaat non-Yahudi. Pilihan ini mempertahankan cakupan kolektif frasa Yunani tanpa menjadikannya istilah denominasi.
- issue: Metafora menaruh leher
  choice: maknanya dinyatakan sebagai 'mempertaruhkan nyawa mereka' dalam teks utama
  alternative: secara harfiah, 'menaruh leher mereka sendiri'
  rationale: Ungkapan Yunani menggambarkan keterpaparan pada bahaya maut. Padanan idiomatis menghindari ungkapan Indonesia yang janggal, sementara metafora aslinya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kontras Yunani dipertahankan, sedangkan idiom tentang leher dialihkan secara alami menjadi 'mempertaruhkan nyawa'. Semua penanda catatan kaki dicantumkan dalam teks utama.
