  source_fidelity: Terjemahan dengan tepat menyampaikan dua imperatif jamak ἀσπάσασθε sebagai “Salamilah,” nama-nama pribadi, kedua pemakaian κοπιάω sebagai “bekerja keras,” serta ἐν κυρίῳ sebagai “dalam Tuhan.” “Telah banyak bekerja keras” secara memadai menerjemahkan πολλὰ ἐκοπίασεν dan mempertahankan penekanan intensitasnya.
