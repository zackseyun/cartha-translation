id: ROM.16.12
reference: Romans 16:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀσπάσασθε Τρύφαιναν καὶ Τρυφῶσαν τὰς κοπιώσας ἐν κυρίῳ. ἀσπάσασθε Περσίδα τὴν ἀγαπητήν, ἥτις πολλὰ ἐκοπίασεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/012.yaml
  text: Greet Tryphaena and Tryphosa[a], who have labored in the Lord. Greet Persis, the beloved[b], who has labored much in the Lord.
translation:
  language: id
  text: Salamilah Trifena dan Trifosa, yang telah bekerja keras dalam Tuhan. Salamilah Persis, yang terkasih, yang telah banyak bekerja keras dalam Tuhan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Salamilah
  rationale: Dalam daftar salam surat, bentuk imperatif jamak ini paling wajar diterjemahkan secara ringkas sebagai “Salamilah”.
- source_word: Τρύφαιναν καὶ Τρυφῶσαν
  choice: Trifena dan Trifosa
  rationale: Nama-nama pribadi ditransliterasikan ke ejaan yang alami dalam bahasa Indonesia.
- source_word: τὰς κοπιώσας
  choice: yang telah bekerja keras
  rationale: Partisip berartikel ini menerangkan kedua perempuan tersebut. “Bekerja keras” menyampaikan jerih lelah yang terkandung dalam κοπιάω dengan bahasa Indonesia yang alami.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Terjemahan ini mempertahankan rumusan khas Paulus serta cakupan makna relasional dan lingkup pelayanan, tanpa mempersempitnya menjadi hanya “untuk Tuhan”.
- source_word: Περσίδα
  choice: Persis
  rationale: Nama pribadi ditransliterasikan ke bentuk yang lazim dan jelas dalam bahasa Indonesia.
- source_word: τὴν ἀγαπητήν
  choice: yang terkasih
  rationale: Bahasa Yunani memakai artikel dan adjektiva tanpa kata ganti milik; “yang terkasih” menjaga ketepatan itu tanpa menambahkan “ku” atau “saya”.
- source_word: ἥτις
  choice: yang
  rationale: Kata ganti relatif ini secara alami membuka keterangan tentang Persis; nuansa karakterisasinya tidak perlu diperluas secara berlebihan.
- source_word: πολλὰ ἐκοπίασεν
  choice: telah banyak bekerja keras
  rationale: πολλὰ menekankan besarnya jerih lelah Persis. Pilihan ini juga mempertahankan pengulangan verba κοπιάω dari klausa sebelumnya.
theological_decisions:
- issue: Makna ἐν κυρίῳ dalam rumusan pelayanan Paulus
  choice: dalam Tuhan
  alternative: untuk Tuhan; dalam pelayanan kepada Tuhan
  rationale: “Dalam Tuhan” mempertahankan kemungkinan makna lingkup, hubungan, dan kesatuan dengan Tuhan, bukan hanya tujuan atau pihak yang dilayani.
- issue: Penyebutan Persis sebagai τὴν ἀγαπητήν
  choice: yang terkasih
  alternative: yang kukasihi; yang saya kasihi
  rationale: Teks Yunani tidak memuat kata ganti milik μου. Karena itu, terjemahan tidak menambahkan kepemilikan atau keintiman pribadi yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pengulangan “bekerja keras” dipertahankan untuk mencerminkan pengulangan κοπιάω dalam teks Yunani. Tidak diperlukan catatan kaki karena pilihan terjemahan utama dapat menyampaikan perbedaan leksikal dan tekstual secara memadai tanpa membebani ayat.
