- from: Sampaikan salam kepada Apeles, yang telah teruji dalam Mesias.[a] Sampaikan salam kepada orang-orang dari keluarga Aristobulus.[b]
  to: Sampaikan salam kepada Apeles, yang telah teruji dan terbukti dalam Mesias.[a] Sampaikan salam kepada orang-orang dari rumah tangga Aristobulus.[b]
