id: ROM.16.10
reference: Romans 16:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀπελλῆν τὸν δόκιμον ἐν Χριστῷ. ἀσπάσασθε τοὺς ἐκ τῶν Ἀριστοβούλου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/010.yaml
  text: Greet Apelles[a], the approved one in Messiah. Greet those of the household of Aristobulus.
translation:
  language: id
  text: Sampaikan salam kepada Apeles, yang telah teruji dan terbukti dalam Mesias.[a] Sampaikan salam kepada orang-orang dari rumah tangga Aristobulus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut ungkapan yang lebih tradisional, “dalam Kristus.”
    reason: Mencatat padanan tradisional bagi ἐν Χριστῷ sambil mempertahankan “Mesias” dalam teks utama.
  - marker: b
    text: Secara harfiah, “orang-orang dari Aristobulus”; ungkapan ini dapat menunjuk kepada anggota rumah tangga atau orang-orang dalam lingkungannya.
    reason: Menjelaskan ungkapan Yunani yang eliptis dan mempertahankan ketidakpastian mengenai hubungan tepat kelompok itu dengan Aristobulus.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Sampaikan salam kepada
  rationale: Bentuk imperatif jamak ini meminta para penerima surat menyampaikan salam. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gaya perintah yang berulang.
- source_word: Ἀπελλῆν
  choice: Apeles
  rationale: Nama diri ditransliterasikan ke bentuk yang wajar dalam ejaan bahasa Indonesia.
- source_word: τὸν δόκιμον
  choice: yang telah teruji
  rationale: δόκιμος menunjuk kepada orang yang sudah diuji dan terbukti tulen atau layak. 'Telah teruji' mempertahankan unsur pengujian dan hasil positif tanpa menjelaskan secara berlebihan.
- source_word: ἐν Χριστῷ
  choice: dalam Mesias
  rationale: Preposisi 'dalam' mempertahankan ungkapan khas Paulus mengenai lingkup atau persatuan dengan Sang Mesias; Χριστός diterjemahkan sebagai gelar 'Mesias'.
- source_word: τοὺς ἐκ τῶν Ἀριστοβούλου
  choice: orang-orang dari keluarga Aristobulus
  rationale: Ungkapan Yunani yang eliptis ini menunjuk kepada orang-orang yang termasuk dalam rumah tangga, keluarga besar, atau lingkungan Aristobulus, bukan dengan pasti kepada Aristobulus sendiri. 'Dari keluarga' jelas dan wajar, sementara catatan kaki mempertahankan keluasan maknanya.
theological_decisions:
- issue: Makna ἐν Χριστῷ dalam pujian bagi Apeles
  choice: dalam Mesias
  alternative: dalam Kristus
  rationale: Terjemahan ini mempertahankan preposisi dan ketegangan teologis ungkapan Paulus tanpa memparafrasakannya menjadi 'sebagai orang percaya'. 'Mesias' menampilkan Χριστός sebagai gelar, sedangkan bentuk tradisional dicatat sebagai alternatif.
- issue: Rujukan τοὺς ἐκ τῶν Ἀριστοβούλου
  choice: orang-orang dari keluarga Aristobulus
  alternative: orang-orang yang termasuk kelompok Aristobulus
  rationale: Teks tidak menyatakan bahwa Aristobulus sendiri hadir atau menjadi orang percaya. Terjemahan ini tidak memasukkannya ke dalam kelompok yang disalami dan catatan kaki mengakui kemungkinan cakupan rumah tangga atau lingkungan yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat dan lugas. Pengulangan 'Sampaikan salam kepada' mengikuti struktur retoris teks Yunani. Istilah 'telah teruji' cukup mudah dipahami sekaligus mempertahankan nuansa seseorang yang diuji dan terbukti tulen.
