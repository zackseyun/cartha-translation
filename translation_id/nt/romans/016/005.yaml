id: ROM.16.5
reference: Romans 16:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὴν κατ’ οἶκον αὐτῶν ἐκκλησίαν. ἀσπάσασθε Ἐπαίνετον τὸν ἀγαπητόν μου, ὅς ἐστιν ἀπαρχὴ τῆς ⸀Ἀσίας εἰς Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/005.yaml
  text: Also greet the church in their house[a]. Greet Epaenetus, my beloved[c][b], who is the firstfruits of Asia for Messiah.
translation:
  language: id
  text: Sampaikan juga salam kepada jemaat yang ada di rumah mereka.[a] Sampaikan salam kepada Epenetus, yang kukasihi, yang merupakan buah sulung dari Asia[b] bagi Mesias.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jemaat yang berkumpul di rumah mereka.”
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud adalah Provinsi Asia dalam Kekaisaran Romawi, bukan benua Asia pada masa kini.
    reason: cultural_note
  - marker: c
    text: Atau, “yang merupakan orang pertama di Asia yang percaya kepada Mesias.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατ’ οἶκον αὐτῶν ἐκκλησίαν
  choice: jemaat yang ada di rumah mereka
  rationale: Ungkapan ini menunjuk pada jemaat yang terkait dengan atau berkumpul di rumah mereka. Terjemahan utama tetap dekat dengan bentuk Yunani, sedangkan makna pertemuannya dijelaskan dalam catatan kaki.
- source_word: ἀσπάσασθε
  choice: sampaikan salam kepada
  rationale: Dalam daftar salam surat, ungkapan ini secara alami berarti menyampaikan salam, bukan sekadar menyambut.
- source_word: Ἐπαίνετον
  choice: Epenetus
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang wajar dan lazim dalam bahasa Indonesia.
- source_word: ἀγαπητόν μου
  choice: yang kukasihi
  rationale: Pilihan ini mengungkapkan kasih pribadi Paulus dengan bahasa Indonesia yang alami, hangat, dan bermartabat.
- source_word: ἀπαρχὴ
  choice: buah sulung
  rationale: Pilihan ini mempertahankan metafora Paulus tentang bagian pertama dari hasil, alih-alih langsung menafsirkannya sebagai orang pertama yang bertobat.
- source_word: τῆς Ἀσίας
  choice: dari Asia
  rationale: Genitif menunjukkan asal atau keterkaitan dengan Asia; dalam konteks Perjanjian Baru, Asia adalah provinsi Romawi, yang dijelaskan dalam catatan kaki.
- source_word: εἰς Χριστόν
  choice: bagi Mesias
  rationale: Dengan 'buah sulung', preposisi εἰς menyatakan arah atau hubungan tujuan. 'Bagi Mesias' mempertahankan konstruksi dan gelar Χριστός tanpa mengubahnya menjadi penjelasan tafsir.
theological_decisions:
- issue: Penerjemahan Χριστόν
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar. 'Mesias' menyampaikan arti gelar tersebut secara langsung tanpa menambahkan kekhasan denominasi.
- issue: Makna ἀπαρχὴ τῆς Ἀσίας εἰς Χριστόν
  choice: buah sulung dari Asia bagi Mesias
  alternative: orang pertama di Asia yang percaya kepada Mesias
  rationale: Teks utama mempertahankan metafora 'buah sulung' dan hubungan εἰς yang tidak sepenuhnya eksplisit. Tafsiran kontekstual yang mungkin dicantumkan dalam catatan kaki agar ketegangan dan nuansa asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat yang hangat dan bermartabat. Pengulangan “sampaikan salam” dipertahankan untuk mencerminkan susunan daftar salam Yunani; metafora “buah sulung” dipertahankan dan diberi penjelasan alternatif melalui catatan kaki.
