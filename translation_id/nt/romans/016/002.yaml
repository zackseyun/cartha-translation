  to: supaya kalian menyambut dia di dalam Tuhan dengan cara yang layak bagi orang-orang kudus, dan membantu dia dalam urusan apa pun yang untuk itu ia mungkin memerlukan bantuan kalian. Sebab dia sendiri telah menjadi penyokong bagi banyak orang[a], dan juga bagi saya sendiri.
  rationale: Revisi terbatas pada dua bagian. "Dalam urusan apa pun yang untuk itu ia mungkin memerlukan bantuan kalian" mencerminkan cakupan πρᾶγμα dan hubungan χρῄζῃ dengan ὑμῶν tanpa menyatakan bahwa urusan itu menyebabkan kebutuhannya. "Dan juga bagi saya sendiri" menerjemahkan καὶ ἐμοῦ αὐτοῦ secara alami dan tegas. Catatan kaki dipertahankan karena "penyokong" tidak sepenuhnya menyatakan kemungkinan nuansa patronase sosial pada προστάτις.
