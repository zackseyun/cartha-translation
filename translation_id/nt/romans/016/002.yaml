id: ROM.16.2
reference: Romans 16:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα ⸂αὐτὴν προσδέξησθε⸃ ἐν κυρίῳ ἀξίως τῶν ἁγίων, καὶ παραστῆτε αὐτῇ ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι, καὶ γὰρ αὐτὴ προστάτις πολλῶν ἐγενήθη καὶ ⸂ἐμοῦ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/002.yaml
  text: so that you may welcome her in the Lord in a manner worthy of the saints[a], and assist her in whatever matter she may need from you, for she herself has become a patron of many[b], and of myself as well.
translation:
  language: id
  text: supaya kalian menyambut dia di dalam Tuhan dengan cara yang layak bagi orang-orang kudus, dan membantu dia dalam urusan apa pun yang untuk itu ia mungkin memerlukan bantuan kalian. Sebab dia sendiri telah menjadi penyokong bagi banyak orang[a], dan juga bagi saya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelindung”, “dermawan”, atau “patron”. Kata Yunani ini menggambarkan seorang perempuan yang memberikan dukungan kepada orang lain, mungkin dalam hubungan patronase.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέξησθε
  choice: menyambut
  rationale: Dalam konteks ini, kata tersebut menunjuk pada penerimaan Febe dengan baik ke dalam persekutuan; 'menyambut' secara alami mencakup penerimaan yang ramah.
- source_word: ἐν κυρίῳ
  choice: di dalam Tuhan
  rationale: Ungkapan Paulus ini mempertahankan lingkup dan hubungan persekutuan yang berpusat pada Tuhan tanpa mempersempit maknanya.
- source_word: ἀξίως τῶν ἁγίων
  choice: dengan cara yang layak bagi orang-orang kudus
  rationale: Terjemahan ini mempertahankan unsur cara pada ἀξίως dan penggunaan khas Paulus atas ἅγιοι untuk umat Allah.
- source_word: παραστῆτε αὐτῇ
  choice: membantu dia
  rationale: Dalam konteks permintaan praktis ini, παρίστημι berarti memberikan bantuan atau dukungan; 'membantu dia' lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'berdiri di sisinya'.
- source_word: ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι
  choice: dalam perkara apa pun yang membuatnya memerlukan kalian
  rationale: Rumusan ini mempertahankan keluasan πρᾶγμα ('perkara/urusan') serta konstruksi bahwa Febe memerlukan mereka dalam perkara tersebut.
- source_word: προστάτις
  choice: penyokong
  rationale: '''Penyokong'' menyatakan seorang perempuan yang memberikan dukungan nyata kepada orang lain dan tidak mereduksinya menjadi sekadar penolong, sementara catatan kaki mempertahankan kemungkinan nuansa sosial patronase atau kemurahan hati.'
- source_word: ἐγενήθη
  choice: telah menjadi
  rationale: Bentuk ini menyampaikan keadaan atau peran yang telah terbentuk dan tetap relevan saat Paulus menulis.
- source_word: ἐμοῦ αὐτοῦ
  choice: termasuk bagi saya sendiri
  rationale: '''Saya sendiri'' mempertahankan penekanan αὐτοῦ, sedangkan ''termasuk'' menyampaikan daya tambah καί secara wajar.'
theological_decisions:
- issue: Makna προστάτις sebagai gambaran peran Febe
  choice: penyokong
  alternative: pelindung, dermawan, atau patron
  rationale: Kata Yunani itu kemungkinan menggambarkan dukungan yang berarti, mungkin dalam hubungan sosial patronase. 'Penyokong' mempertahankan peran aktif dan penting Febe tanpa menetapkannya sebagai jabatan gerejawi tertentu atau membatasi bantuannya pada dukungan finansial.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Pronomina jamak 'kalian' dipakai untuk menyatakan bahwa nasihat ditujukan kepada jemaat. Istilah Paulus 'orang-orang kudus' dipertahankan, sedangkan struktur kalimat sedikit diurai agar hubungan antarklausa jelas.
