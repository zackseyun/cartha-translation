id: 1JN.5.9
reference: 1 John 5:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ τὴν μαρτυρίαν τῶν ἀνθρώπων λαμβάνομεν, ἡ μαρτυρία τοῦ θεοῦ μείζων ἐστίν, ὅτι αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ ⸀ὅτι μεμαρτύρηκεν περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/009.yaml
  text: 'If we receive the testimony of men[a], the testimony of God is greater[c][b], because this is the testimony of God: that he has testified concerning his Son.'
translation:
  language: id
  text: 'Jika kita menerima kesaksian manusia, kesaksian Allah lebih besar, sebab inilah kesaksian Allah: bahwa Ia telah bersaksi tentang Anak-Nya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Klausa terakhir juga dapat dipahami sebagai alasan: “sebab Ia telah bersaksi tentang Anak-Nya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρίαν / μαρτυρία
  choice: kesaksian
  rationale: Mempertahankan pengulangan istilah Yunani dan nuansa pembuktian dalam konteks; bentuk ini alami dan lazim dalam bahasa Indonesia.
- source_word: ἀνθρώπων
  choice: manusia
  rationale: Bentuk jamak ini bersifat generik dan mengontraskan kesaksian manusia dengan kesaksian Allah; 'manusia' menyampaikan cakupan itu secara tepat tanpa pembatasan gender.
- source_word: λαμβάνομεν
  choice: menerima
  rationale: Padanan langsung yang tetap memungkinkan nuansa menerima maupun mengakui kesaksian tanpa mempersempit maknanya menjadi persetujuan penuh.
- source_word: μείζων
  choice: lebih besar
  rationale: Padanan komparatif yang langsung dan alami, menyatakan bahwa kesaksian Allah melampaui kesaksian manusia.
- source_word: αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ
  choice: inilah kesaksian Allah
  rationale: Ungkapan ini alami dalam bahasa Indonesia sambil mempertahankan penekanan deiktis dan pengulangan 'kesaksian'.
- source_word: μεμαρτύρηκεν
  choice: telah bersaksi
  rationale: Bentuk 'telah' mencerminkan tindakan sempurna yang sudah terjadi dan tetap relevan; akar kata 'saksi' juga menjaga hubungan leksikal dengan 'kesaksian'.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: tentang Anak-Nya
  rationale: '''Tentang'' adalah padanan alami bagi περί dengan genitif. ''Anak'' dikapitalisasi karena dalam konteks merujuk kepada Yesus sebagai Anak Allah.'
theological_decisions:
- issue: Fungsi ὅτι yang kedua
  choice: 'klausa isi: ''bahwa Ia telah bersaksi tentang Anak-Nya'''
  alternative: 'klausa sebab: ''sebab Ia telah bersaksi tentang Anak-Nya'''
  rationale: Klausa tersebut paling wajar menjelaskan isi kesaksian Allah. Namun, fungsi kausal tetap mungkin dan dicatat dalam catatan kaki agar ambiguitas asli tidak dihilangkan.
- issue: Cakupan ἀνθρώπων
  choice: manusia
  alternative: orang-orang
  rationale: Kata Yunani menunjuk manusia secara umum dalam kontras dengan Allah. 'Manusia' mempertahankan kontras kolektif tersebut secara ringkas dan tepat.
- issue: Rujukan subjek dalam μεμαρτύρηκεν
  choice: Ia, yakni Allah
  alternative: Allah disebut ulang secara eksplisit
  rationale: Subjek tersirat ditentukan oleh frasa sebelumnya, 'kesaksian Allah'. Pronomina hormat 'Ia' alami dalam register Alkitab Indonesia dan tidak menambahkan identifikasi baru.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'kesaksian' dipertahankan sebagai unsur retoris teks. Struktur kalimat dibuat jelas bagi pembaca umum tanpa meniadakan kemungkinan fungsi kausal pada ὅτι kedua.
