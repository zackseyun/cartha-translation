  yaml_path: translation/nt/1_john/005/019.yaml
  text: We know that we are from God[b][a], and the whole world lies in the evil one.
translation:
  language: id
  text: Kita tahu bahwa kita berasal dari Allah, dan seluruh dunia berada di bawah kuasa si jahat.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “seluruh dunia terbaring di dalam si jahat.”'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “si jahat” juga dapat dipahami sebagai “kejahatan,” tetapi dalam pemakaian Yohanes makna pribadi lebih mungkin.
    reason: alternative_reading
lexical_decisions:
- source_word: οἴδαμεν
  choice: Kita tahu
  rationale: Bentuk ini menyatakan pengetahuan atau keyakinan yang mantap. “Kita tahu” merupakan padanan Indonesia yang langsung dan alami serta mempertahankan nada kepastian surat ini.
- source_word: ἐκ τοῦ θεοῦ
  choice: berasal dari Allah
  rationale: Frasa ἐκ τοῦ θεοῦ menunjukkan sumber, asal, atau keberpihakan. “Berasal dari Allah” mempertahankan makna itu tanpa menambahkan gagasan “dilahirkan dari Allah,” yang tidak dinyatakan secara eksplisit dalam klausa ini.
- source_word: ὁ κόσμος ὅλος
  choice: seluruh dunia
  rationale: κόσμος di sini menunjuk pada dunia sebagai tatanan manusia yang berlawanan dengan Allah, sedangkan ὅλος menegaskan cakupannya. “Seluruh dunia” ringkas, alami, dan setia pada keluasan ungkapan Yunani.
- source_word: ἐν τῷ πονηρῷ
  choice: di bawah kuasa si jahat
  rationale: Dalam konteks tulisan Yohanes, bentuk substantival τῷ πονηρῷ paling mungkin menunjuk kepada pribadi yang jahat. Ungkapan “di bawah kuasa” menyampaikan keadaan dunia yang berada dalam lingkup atau cengkeramannya, sedangkan bentuk Yunani yang lebih harfiah dicatat dalam catatan kaki.
- source_word: κεῖται
  choice: berada
  rationale: κεῖται secara harfiah berarti “terbaring,” tetapi dalam konteks ini menggambarkan keadaan atau kedudukan yang menetap. “Berada” menghasilkan bahasa Indonesia yang wajar ketika dipadukan dengan “di bawah kuasa,” sementara metafora harfiahnya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Apakah τῷ πονηρῷ menunjuk kepada kejahatan abstrak atau kepada pribadi yang jahat
  choice: 'Pribadi: “si jahat”'
  alternative: 'Abstrak: “kejahatan”'
  rationale: Dalam tulisan Yohanes, ὁ πονηρός lazim menunjuk kepada si jahat sebagai pribadi (bdk. 1 Yoh. 2:13–14; 3:12; 5:18). Namun, karena bentuk Yunani dapat dipahami secara abstrak, kemungkinan itu dicatat tanpa membiarkannya mengaburkan pembacaan personal yang lebih mungkin.
- issue: Kekuatan hubungan pertentangan antara kedua klausa
  choice: sedangkan
  alternative: dan
  rationale: καί secara dasar berarti “dan,” tetapi di sini kedua klausa membandingkan asal komunitas orang percaya dari Allah dengan keadaan seluruh dunia. “Sedangkan” menyampaikan pertentangan kontekstual itu secara alami tanpa mengubah isi kedua klausa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kata ganti “kita” mempertahankan bentuk inklusif alami dari orang pertama jamak. “Si jahat” dipilih sebagai sebutan personal yang mudah dipahami tanpa menambahkan nama atau identifikasi yang tidak terdapat dalam ayat.
