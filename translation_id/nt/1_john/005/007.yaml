  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sejumlah naskah yang lebih kemudian menambahkan bacaan panjang yang sering dikenal sebagai Comma Johanneum: “di surga: Bapa, Firman, dan Roh Kudus; dan ketiganya adalah satu. Dan ada tiga yang bersaksi di bumi ...” Kata-kata ini tidak terdapat dalam bukti naskah Yunani paling awal dan tidak dimuat dalam teks SBLGNT.'
