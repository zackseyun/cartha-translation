lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteks, konjungsi ini memperkenalkan penjelasan bagi pernyataan sebelumnya. “Sebab” menyampaikan fungsi penjelas tersebut secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: τρεῖς
  choice: tiga
  rationale: Angka kardinal ini diterjemahkan langsung tanpa perlu diperluas menjadi nomina tertentu.
- source_word: εἰσιν
  choice: ada
  rationale: Dalam konstruksi ini, bentuk kopula menyatakan keberadaan tiga pihak yang bersaksi; “ada” merupakan padanan Indonesia yang paling alami.
- source_word: οἱ μαρτυροῦντες
  choice: yang bersaksi
  rationale: Partisipel kini berartikel ini berfungsi substantival. “Yang bersaksi” mempertahankan sifat verbal dan tindakan kesaksian, tanpa mengubahnya menjadi nomina “saksi-saksi”.
theological_decisions:
- issue: Bentuk teks 1 Yohanes 5:7 dan Comma Johanneum
  choice: 'Menerjemahkan hanya teks SBLGNT yang lebih pendek: “Sebab ada tiga yang bersaksi,”'
  alternative: 'Tradisi naskah yang lebih kemudian menambahkan: “di surga: Bapa, Firman, dan Roh Kudus; dan ketiganya adalah satu. Dan ada tiga yang bersaksi di bumi ...”'
  rationale: Sumber Yunani yang diberikan memuat bacaan pendek. Tambahan Trinitaris yang dikenal sebagai Comma Johanneum tidak terdapat dalam bukti naskah Yunani paling awal dan tidak termasuk dalam teks SBLGNT. Karena itu, teks utama mengikuti sumber tersebut, sedangkan varian bersejarah dicatat secara transparan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan bermartabat. Koma dipertahankan karena kalimat berlanjut ke ayat berikutnya; penanda catatan kaki ditempatkan langsung setelah klausa.
