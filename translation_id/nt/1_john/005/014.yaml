id: 1JN.5.14
reference: 1 John 5:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ παρρησία ἣν ἔχομεν πρὸς αὐτόν, ὅτι ἐάν τι αἰτώμεθα κατὰ τὸ θέλημα αὐτοῦ ἀκούει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/014.yaml
  text: 'And this is the confidence that we have before him: that if we ask anything according to his will[a], he hears us.'
translation:
  language: id
  text: 'Dan inilah keyakinan[a] yang kita miliki di hadapan-Nya: jika kita meminta apa pun sesuai dengan kehendak-Nya, Ia mendengarkan kita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keberanian” atau “kepastian”.
    reason: παρρησία dapat menekankan keyakinan, keberanian untuk menghadap, atau kepastian; catatan ini mempertahankan keluasan maknanya.
lexical_decisions:
- source_word: παρρησία
  choice: keyakinan
  rationale: Dalam konteks doa kepada Allah, kata ini menyatakan keyakinan yang terbuka dan berani di hadapan-Nya. “Keyakinan” alami dalam bahasa Indonesia dan tidak membatasi maknanya pada keberanian berbicara di depan umum.
- source_word: πρὸς αὐτόν
  choice: di hadapan-Nya
  rationale: Ungkapan ini menyampaikan orientasi relasional dan keberadaan dalam hadirat Allah; “di hadapan-Nya” lebih wajar daripada terjemahan harfiah “ke arah-Nya”.
- source_word: ὅτι
  choice: ': jika'
  rationale: ὅτι memperkenalkan isi keyakinan tersebut. Dalam bahasa Indonesia, tanda titik dua yang diikuti klausa “jika” menyampaikan hubungan penjelas ini secara alami tanpa menjadikannya hubungan sebab-akibat.
- source_word: ἐάν τι αἰτώμεθα
  choice: jika kita meminta apa pun
  rationale: Bentuk ini menyatakan syarat umum, sedangkan “apa pun” mempertahankan cakupan terbuka dari τι.
- source_word: κατὰ τὸ θέλημα αὐτοῦ
  choice: sesuai dengan kehendak-Nya
  rationale: “Sesuai dengan” menyatakan keselarasan dengan norma, dan “kehendak” mempertahankan bobot θέλημα tanpa parafrasa tambahan.
- source_word: ἀκούει ἡμῶν
  choice: Ia mendengarkan kita
  rationale: Dalam konteks doa, “mendengarkan” menyatakan bahwa Allah memperhatikan permohonan. Pilihan ini tidak memperluas makna menjadi janji bahwa setiap permohonan langsung dikabulkan.
theological_decisions:
- issue: Makna Allah mendengar doa
  choice: Ia mendengarkan kita
  alternative: Ia menjawab kita; Ia mengabulkan permohonan kita
  rationale: Ayat ini menegaskan bahwa Allah mendengar atau memperhatikan permohonan yang sesuai dengan kehendak-Nya. Terjemahan tidak boleh lebih dahulu menyamakan tindakan mendengar dengan mengabulkan setiap permohonan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Kapitalisasi pronomina ilahi digunakan secara konsisten dalam ayat ini.
