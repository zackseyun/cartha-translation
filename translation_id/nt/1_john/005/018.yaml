id: 1JN.5.18
reference: 1 John 5:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οἴδαμεν ὅτι πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ οὐχ ἁμαρτάνει, ἀλλ’ ὁ γεννηθεὶς ἐκ τοῦ θεοῦ τηρεῖ ⸀αὐτόν, καὶ ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/018.yaml
  text: We know that everyone who has been born of God does not keep sinning[a]; rather, the one who was born of God keeps him[c][b], and the evil one does not touch him.
translation:
  language: id
  text: Kita tahu bahwa setiap orang yang telah lahir dari Allah tidak terus berbuat dosa[a]. Sebaliknya, orang yang lahir dari Allah menjaganya[b], dan si jahat tidak menyentuhnya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “tidak terus berbuat dosa” kemungkinan menunjuk pada dosa yang berlangsung atau menjadi kebiasaan, bukan berarti bahwa orang percaya tidak pernah melakukan dosa apa pun (bandingkan 1 Yohanes 1:8–10; 2:1).
    reason: cross_reference
  - marker: b
    text: Atau, “orang yang lahir dari Allah menjaga dirinya sendiri.” Banyak penafsir memahami “orang yang lahir dari Allah” sebagai Yesus, Sang Anak, yang menjaga orang percaya.
    reason: alternative_reading
  - marker: c
    text: Kata “menyentuh” di sini dapat mengandung arti memegang atau menguasai seseorang untuk mencelakakannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Kita tahu
  rationale: Bentuk perfek οἶδα berfungsi secara idiomatis sebagai verba statif masa kini; “kita tahu” alami dan tepat dalam bahasa Indonesia.
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: setiap orang yang telah lahir dari Allah
  rationale: Konstruksi πᾶς ὁ dengan partisip bersifat distributif, sedangkan partisip perfek pasif menekankan keadaan yang dihasilkan. “Lahir dari Allah” mempertahankan ungkapan khas Yohanes.
- source_word: οὐχ ἁμαρτάνει
  choice: tidak terus berbuat dosa
  rationale: Bentuk kini memberi sudut pandang imperfektif dan dalam konteks ini paling mungkin menunjuk pada perbuatan dosa yang berlangsung atau menjadi kebiasaan, tanpa menyatakan bahwa orang percaya sama sekali tidak pernah berdosa.
- source_word: ἀλλ’
  choice: Sebaliknya
  rationale: Menandai kontras yang tegas dengan klausa sebelumnya dan terdengar wajar dalam bahasa Indonesia.
- source_word: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: Dia yang lahir dari Allah
  rationale: Ungkapan ini sengaja tidak dijelaskan sebagai “Anak Allah” dalam teks utama. Huruf kapital membantu pembacaan yang kemungkinan besar merujuk kepada Yesus, sementara catatan kaki mempertahankan kemungkinan bahwa frasa itu merujuk kepada orang percaya.
- source_word: τηρεῖ αὐτόν
  choice: menjaganya
  rationale: τηρέω dapat berarti menjaga, melindungi, atau memelihara. “Menjaganya” alami dan tetap dekat dengan bentuk Yunani; pronomina αὐτόν dipertahankan sebagai objek orang ketiga.
- source_word: ὁ πονηρὸς
  choice: si jahat
  rationale: Dengan artikel dan menurut pemakaian Yohanes, frasa ini paling alami menunjuk secara personal kepada Iblis, bukan kepada kejahatan abstrak.
- source_word: οὐχ ἅπτεται αὐτοῦ
  choice: tidak menyentuhnya
  rationale: ἅπτομαι secara harfiah berarti menyentuh, tetapi dapat menyiratkan memegang atau menguasai untuk mencelakakan. Teks utama mempertahankan bentuk leksikal dan catatan menjelaskan nuansanya.
theological_decisions:
- issue: Makna pernyataan bentuk kini οὐχ ἁμαρτάνει
  choice: Klausa ini menyangkal perbuatan dosa yang terus berlangsung atau menjadi kebiasaan.
  alternative: Orang yang lahir dari Allah sama sekali tidak pernah melakukan dosa.
  rationale: Pilihan ini mencerminkan aspek imperfektif verba kini dan menjaga keselarasan dengan 1 Yohanes 1:8–10 dan 2:1 tanpa menghapus ketegangan etis dalam surat ini.
- issue: Rujukan ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: Teks utama memakai “Dia yang lahir dari Allah,” yang dapat dibaca sebagai rujukan kepada Yesus tanpa menambahkan gelar “Anak.”
  alternative: Frasa itu merujuk kepada orang percaya yang lahir dari Allah dan menjaga dirinya sendiri.
  rationale: Sintaksis Yunani memungkinkan perbedaan penafsiran. Peralihan dari partisip perfek sebelumnya ke partisip aoris di sini mendukung rujukan kepada Yesus bagi banyak penafsir, tetapi alternatif refleksif tetap dicatat.
- issue: Rujukan αὐτόν dan αὐτοῦ
  choice: 'Keduanya diterjemahkan sebagai pronomina yang menunjuk kepada orang percaya: “-nya.”'
  alternative: Jika subjek klausa kedua adalah orang percaya, αὐτόν dapat dipahami secara refleksif sebagai “dirinya sendiri.”
  rationale: Bacaan naskah adalah pronomina nonrefleksif αὐτόν. Terjemahan utama mempertahankan bentuk itu, sedangkan catatan mengakui pemahaman refleksif yang timbul dari penafsiran subjek yang berbeda.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kita” mempertahankan sifat inklusif pernyataan komunitas. “Terus berbuat dosa” menyampaikan aspek berlangsung tanpa menjadi parafrasa yang terlalu jauh. Kapitalisasi “Dia” mengisyaratkan rujukan kristologis yang dinilai mungkin, tetapi catatan kaki secara terbuka mempertahankan ambiguitas sumber.
