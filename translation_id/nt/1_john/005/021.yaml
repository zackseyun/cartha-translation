  text: Little children[a], guard yourselves from idols.
translation:
  language: id
  text: Anak-anakku[a], jagalah diri kalian dari berhala-berhala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Anak-anak” atau “Anak-anak terkasih.” Istilah Yunani ini merupakan bentuk kecil bernuansa kasih yang dipakai Yohanes dalam sapaan langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: Anak-anakku
  rationale: Sapaan jamak bernuansa kasih dari τεκνίον. Dalam bahasa Indonesia, bentuk ini alami sebagai sapaan pastoral yang hangat dan tetap mempertahankan gambaran kekeluargaan.
- source_word: φυλάξατε
  choice: jagalah
  rationale: Imperatif aoris aktif orang kedua jamak yang menyerukan kewaspadaan tegas. “Jagalah” menyampaikan tindakan menjaga secara aktif dan wajar dalam bahasa Indonesia.
- source_word: ἑαυτὰ
  choice: dirimu
  rationale: Pronomina refleksif jamak sebagai objek imperatif. Bahasa Indonesia baku lazim memakai “dirimu” untuk sapaan kolektif; konteks menunjukkan bahwa seluruh penerima surat disapa.
- source_word: ἀπὸ
  choice: dari
  rationale: Menandai pemisahan atau penjauhan dan diterjemahkan langsung dengan “dari”.
- source_word: εἰδώλων
  choice: berhala-berhala
  rationale: Bentuk jamak εἴδωλον secara langsung menunjuk pada berhala atau objek penyembahan palsu. Pengulangan kata menampilkan jamaknya secara eksplisit tanpa memperluas makna.
theological_decisions:
- issue: Cakupan “berhala-berhala”
  choice: Menerjemahkan secara konkret sebagai “berhala-berhala” tanpa memperluasnya menjadi segala sesuatu yang menggantikan Allah.
  alternative: segala sesuatu yang menjadi berhala; penyembahan palsu secara umum
  rationale: Teks Yunani secara langsung menyebut berhala. Penerjemahan yang konkret menjaga kemungkinan cakupan implikasinya tanpa memasukkan penafsiran yang lebih luas ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Sapaan “Anak-anakku” mempertahankan kehangatan pastoral; “jagalah dirimu” merupakan bentuk kolektif yang alami; bentuk ulang “berhala-berhala” mempertahankan jamak Yunani.
