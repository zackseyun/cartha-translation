id: 1JN.5.1
reference: 1 John 5:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πᾶς ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ἐκ τοῦ θεοῦ γεγέννηται, καὶ πᾶς ὁ ἀγαπῶν τὸν γεννήσαντα ἀγαπᾷ ⸀καὶ τὸν γεγεννημένον ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/001.yaml
  text: Everyone who believes that Jesus is the Messiah has been born of God[b][a], and everyone who loves the one who fathered him also loves the one born of him.
translation:
  language: id
  text: Setiap orang yang percaya bahwa Yesus adalah Mesias[a] telah dilahirkan dari Allah; dan setiap orang yang mengasihi Dia yang melahirkan juga mengasihi orang yang dilahirkan dari-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.” Kata Yunani Christos merupakan gelar yang berarti “Yang Diurapi.”
    reason: alternative_reading
  - marker: b
    text: Kata Yunani yang sama mendasari ungkapan “telah dilahirkan”, “yang melahirkan”, dan “yang dilahirkan” dalam ayat ini.
    reason: lexical_connection
lexical_decisions:
- source_word: Πᾶς ὁ πιστεύων
  choice: Setiap orang yang percaya
  rationale: Partisipel kini berartikel ini bersifat substantival dan umum. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan cakupan universal dan sifat kepercayaan yang menjadi ciri orang tersebut.
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: bahwa Yesus adalah Mesias
  rationale: Χριστός merupakan gelar bagi sosok yang diurapi, bukan sekadar unsur nama. 'Mesias' mempertahankan makna gelar dan latar pengharapan Yahudinya.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: telah dilahirkan dari Allah
  rationale: Bentuk perfektum pasif menunjukkan tindakan yang telah terjadi dengan hasil yang tetap berlaku. 'Dari Allah' mempertahankan gagasan sumber yang dinyatakan oleh ἐκ.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: setiap orang yang mengasihi
  rationale: Partisipel kini berartikel kembali berfungsi secara substantival dan umum; bentuk ini jelas dan sejajar dengan klausa pertama.
- source_word: τὸν γεννήσαντα
  choice: Dia yang melahirkan
  rationale: Partisipel aoris aktif menunjuk kepada Allah sebagai pihak yang menyebabkan kelahiran. Pilihan ini tidak menambahkan objek yang tidak tersurat dan mempertahankan kaitan leksikal dengan bentuk-bentuk γεννάω lainnya.
- source_word: ἀγαπᾷ καὶ
  choice: juga mengasihi
  rationale: καί yang mendahului objek kedua secara alami menyatakan bahwa kasih kepada pihak yang dilahirkan menyertai kasih kepada pihak yang melahirkan.
- source_word: τὸν γεγεννημένον ἐξ αὐτοῦ
  choice: orang yang dilahirkan dari-Nya
  rationale: Partisipel perfektum pasif mempertahankan hubungan verbal dengan γεγέννηται dan menunjuk kepada seseorang yang berasal dari Allah. 'Orang' membuat bentuk substantivalnya wajar dalam bahasa Indonesia tanpa mempersempitnya menjadi hanya satu individu tertentu.
theological_decisions:
- issue: Bahasa γεννάω untuk kelahiran dari Allah
  choice: Memakai rumpun kata 'dilahirkan/melahirkan' secara konsisten
  alternative: Memakai 'diperanakkan/memperanakkan' atau memperhalusnya menjadi 'Bapa/anak'
  rationale: 'Pengulangan akar kata Yunani merupakan unsur penting dalam logika ayat: kasih kepada pihak yang melahirkan terkait dengan kasih kepada pihak yang dilahirkan. ''Dilahirkan'' merupakan ungkapan Yohanes yang dapat dipahami pembaca modern, sedangkan ''Bapa/anak'' akan menafsirkan bentuk leksikalnya lebih jauh.'
- issue: Identitas τὸν γεγεννημένον ἐξ αὐτοῦ
  choice: Menerjemahkannya secara umum sebagai 'orang yang dilahirkan dari-Nya'
  alternative: Menerjemahkannya sebagai 'Anak yang diperanakkan-Nya' atau secara khusus menunjuk kepada Kristus
  rationale: Bentuk tunggal substantival dapat merujuk secara umum kepada setiap orang yang lahir dari Allah dalam konteks kasih kepada sesama anak Allah. Terjemahan tidak mengunci frasa ini kepada Kristus dan mempertahankan kemungkinan cakupan yang diberikan konteks.
- issue: Gelar ὁ χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam pengakuan ini kata tersebut berfungsi sebagai gelar bagi Yang Diurapi. 'Mesias' menyampaikan fungsi gelarnya dengan jelas, sementara catatan kaki mencatat padanan tradisionalnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Huruf kapital pada 'Dia' dan '-Nya' menandai rujukan kepada Allah sesuai kebiasaan ejaan religius Indonesia. Titik koma mempertahankan dua klausa utama yang erat hubungannya.
