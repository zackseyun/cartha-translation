id: 1JN.5.12
reference: 1 John 5:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ἔχων τὸν υἱὸν ἔχει τὴν ζωήν· ὁ μὴ ἔχων τὸν υἱὸν τοῦ θεοῦ τὴν ζωὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/012.yaml
  text: The one who has the Son has life[a]; the one who does not have the Son of God does not have life.
translation:
  language: id
  text: Orang yang memiliki Anak memiliki hidup[a]; orang yang tidak memiliki Anak Allah tidak memiliki hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hidup kekal”; dalam pemakaian Yohanes, “hidup” di sini menunjuk kepada hidup yang terdapat dalam Anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: orang yang memiliki
  rationale: Artikel dengan partisipel kini berfungsi sebagai nomina dan menunjuk secara umum kepada orang yang dicirikan oleh relasinya dengan Anak. Bentuk ini alami dalam bahasa Indonesia modern dan mempertahankan pola tunggal generik.
- source_word: τὸν υἱόν
  choice: Anak
  rationale: Klausa pertama hanya memakai sebutan 'Anak'. Bentuk yang lebih singkat dipertahankan agar variasi dalam teks Yunani tidak dihapus.
- source_word: ἔχει
  choice: memiliki
  rationale: Menerjemahkan ἔχω secara langsung sekaligus cocok dengan konstruksi 'memiliki Anak' dan 'memiliki hidup'. Kata ini tidak mempersempit maknanya menjadi kepemilikan material semata.
- source_word: τὴν ζωήν
  choice: hidup
  rationale: Dalam konteks tulisan Yohanes, ζωή memiliki bobot teologis dan menunjuk kepada hidup yang terdapat dalam Anak. Namun, karena ayat ini hanya menyebut 'hidup', teks utama tidak memperluasnya menjadi 'hidup kekal'.
- source_word: ὁ μὴ ἔχων
  choice: orang yang tidak memiliki
  rationale: μή menyangkal frasa partisipial substantival. Terjemahan ini mempertahankan kesejajaran dan pertentangan dengan klausa pertama.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: Anak Allah
  rationale: Ini merupakan gelar kristologis lengkap dalam klausa kedua dan secara transparan mempertahankan hubungan genitif pada teks Yunani.
- source_word: οὐκ ἔχει
  choice: tidak memiliki
  rationale: οὐκ menyangkal verba finit. Pilihan ini mempertahankan kesejajaran verbal yang kuat dengan klausa positif.
theological_decisions:
- issue: Makna ζωή dalam konteks Yohanes
  choice: Menerjemahkannya sebagai 'hidup' dalam teks utama.
  alternative: '''hidup kekal'''
  rationale: Dalam 1 Yohanes, ζωή sering mengandung arti hidup kekal yang ada dalam Anak, tetapi ayat ini sendiri hanya mengatakan ζωή. Terjemahan utama mempertahankan bentuk itu, sementara catatan kaki menjelaskan nuansa kontekstualnya.
- issue: Partisipel substantival maskulin tunggal yang bersifat generik
  choice: Menggunakan 'orang yang ...'.
  alternative: '''siapa yang ...'' atau bentuk maskulin khusus'
  rationale: Bentuk Yunani adalah maskulin tunggal secara gramatikal, tetapi cakupannya generik. 'Orang yang' menyampaikan maksud tersebut dengan wajar tanpa membatasi pernyataan kepada laki-laki.
- issue: Pengulangan gelar Anak
  choice: Mempertahankan 'Anak' pada klausa pertama dan 'Anak Allah' pada klausa kedua.
  alternative: Menyeragamkan kedua klausa menjadi 'Anak Allah'.
  rationale: Perbedaan bentuk ini terdapat dalam sumber Yunani dan tidak menimbulkan ketidakjelasan dalam konteks; karena itu, variasinya patut dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur antitesis dua klausa dipertahankan secara dekat. 'Memiliki' dipilih daripada 'mempunyai' untuk register yang sedikit lebih formal tanpa menjadi kuno.
