  text: Ταῦτα ἔγραψα ⸀ὑμῖν ἵνα εἰδῆτε ὅτι ζωὴν ⸂ἔχετε αἰώνιον⸃, ⸂τοῖς πιστεύουσιν⸃ εἰς τὸ ὄνομα τοῦ υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/013.yaml
  text: I have written these things to you who believe in the name of the Son of God[a], so that you may know that you have eternal life.
translation:
  language: id
  text: Hal-hal ini telah kutuliskan kepada kalian yang percaya kepada nama Anak Allah, supaya kalian tahu bahwa kalian memiliki hidup kekal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, frasa “kepada mereka yang percaya kepada nama Anak Allah” muncul sesudah “hidup kekal” dalam urutan bahasa Yunani.
    reason: Menjelaskan letak frasa τοῖς πιστεύουσιν dalam bahasa Yunani tanpa menghasilkan susunan Indonesia yang tidak alami atau mengubah hubungan sintaksisnya.
lexical_decisions:
- source_word: Ταῦτα
  choice: Hal-hal ini
  rationale: Mempertahankan bentuk jamak netral yang merujuk pada isi surat atau uraian sebelumnya.
- source_word: ἔγραψα
  choice: telah kutuliskan
  rationale: Aoristus epistoler diterjemahkan secara wajar sebagai tindakan penulisan yang telah selesai dan hasilnya kini ada di hadapan pembaca.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: Dativus penerima; bentuk jamak 'kalian' memperjelas bahwa sapaan ditujukan kepada komunitas pembaca.
- source_word: ἵνα εἰδῆτε
  choice: supaya kalian tahu
  rationale: ἵνα menyatakan tujuan, sedangkan εἰδῆτε menyatakan pengetahuan atau kepastian yang dimaksudkan penulis.
- source_word: ζωὴν αἰώνιον
  choice: hidup kekal
  rationale: Ungkapan baku dan tepat bagi konsep Yohanes, tanpa membatasi maknanya hanya pada durasi.
- source_word: ἔχετε
  choice: kalian memiliki
  rationale: Indikatif kini menegaskan kepemilikan hidup kekal pada masa sekarang.
- source_word: τοῖς πιστεύουσιν
  choice: kalian yang percaya
  rationale: Dipahami sebagai aposisi pada ὑμῖν yang mengidentifikasi para penerima; susunan ini paling alami dalam bahasa Indonesia.
- source_word: πιστεύουσιν εἰς
  choice: percaya kepada
  rationale: Dalam bahasa Indonesia, 'percaya kepada' secara alami mengungkapkan kepercayaan yang diarahkan kepada pribadi, bukan sekadar menyetujui suatu pernyataan.
- source_word: τὸ ὄνομα
  choice: nama
  rationale: Mempertahankan idiom alkitabiah yang menunjuk kepada pribadi dan kewibawaan yang dinyatakan oleh nama itu.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: Anak Allah
  rationale: Terjemahan langsung bagi gelar kristologis tersebut dan mempertahankan bobot teologisnya.
theological_decisions:
- issue: Letak dan hubungan sintaksis τοῖς πιστεύουσιν
  choice: 'Dihubungkan dengan ὑμῖν: ''kepada kalian yang percaya kepada nama Anak Allah'''
  alternative: 'Ditempatkan sesudah klausa kepastian: ''supaya kalian tahu bahwa kalian memiliki hidup kekal, yaitu kalian yang percaya kepada nama Anak Allah'''
  rationale: Urutan Yunani memungkinkan frasa partisipial itu dibaca sebagai aposisi yang muncul belakangan, tetapi secara makna kemungkinan besar tetap mengidentifikasi para penerima. Teks utama memakai susunan Indonesia yang alami, sementara urutan Yunani yang lebih dekat dicatat dalam catatan kaki untuk mempertahankan ambiguitas bentuknya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai bentuk jamak ὑμῖν secara jelas; bentuk terikat 'kutuliskan' menjaga kelancaran dan nada pribadi surat.
