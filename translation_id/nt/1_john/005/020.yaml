id: 1JN.5.20
reference: 1 John 5:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα ⸀γινώσκωμεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/020.yaml
  text: And we know that the Son of God has come and has given us understanding so that we may know the True One; and we are in the True One[a], in his Son Jesus the Messiah. This one is the true God and eternal life.
translation:
  language: id
  text: Namun, kita tahu bahwa Anak Allah telah datang dan telah memberi kita pengertian supaya kita mengenal Dia yang benar; dan kita berada di dalam Dia yang benar, di dalam Anak-Nya, Yesus Sang Mesias. Dialah[a] Allah yang benar dan hidup yang kekal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata tunjuk “Dialah” paling langsung merujuk kepada Yesus Sang Mesias. Namun, sebagian orang memahaminya sebagai rujukan kepada “Dia yang benar”, yaitu Bapa, dalam klausa sebelumnya.
    reason: alternative_reading
lexical_decisions:
- source_word: οἴδαμεν
  choice: kita tahu
  rationale: Bentuk perfek οἶδα secara idiomatis berfungsi sebagai statif kini dan menyatakan pengetahuan yang mantap.
- source_word: ἥκει
  choice: telah datang
  rationale: Menyampaikan tindakan datang yang sudah terjadi dengan hasil yang tetap berlaku.
- source_word: δέδωκεν
  choice: telah memberi
  rationale: Bentuk perfek menunjukkan pemberian yang telah berlangsung dan dampaknya tetap ada.
- source_word: διάνοιαν
  choice: pengertian
  rationale: Dalam konteks ini menunjuk pada kemampuan memahami kebenaran, bukan sekadar pikiran sebagai fakultas abstrak.
- source_word: ἵνα γινώσκωμεν
  choice: supaya kita mengenal
  rationale: Menjaga makna tujuan dari ἵνα dengan subjungtif kini; 'mengenal' sesuai untuk pengetahuan relasional dalam konteks Yohanes.
- source_word: τὸν ἀληθινόν / τῷ ἀληθινῷ
  choice: Dia yang benar
  rationale: Adjektiva substantival ini merujuk kepada pribadi ilahi; pengulangan yang sama dipertahankan dalam bahasa Indonesia.
- source_word: ἐσμὲν ἐν
  choice: kita berada di dalam
  rationale: Mempertahankan ungkapan relasional Yohanes tanpa memperluasnya menjadi 'tinggal' atau 'bersatu'.
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: di dalam Anak-Nya
  rationale: Ungkapan Indonesia yang wajar sekaligus mempertahankan relasi kepunyaan.
- source_word: Ἰησοῦ Χριστῷ
  choice: Yesus Sang Mesias
  rationale: Χριστός berfungsi sebagai gelar; 'Sang Mesias' mengungkapkan gelar itu secara alami dan bermartabat.
- source_word: οὗτός
  choice: Dialah
  rationale: Mencerminkan daya tunjuk demonstratif Yunani secara alami dalam bahasa Indonesia, tanpa secara eksplisit menghapus kemungkinan perbedaan anteseden.
- source_word: ὁ ἀληθινὸς θεὸς
  choice: Allah yang benar
  rationale: Padanan baku dan tepat bagi frasa predikatif Yunani.
- source_word: ζωὴ αἰώνιος
  choice: hidup yang kekal
  rationale: Padanan yang lazim dalam sastra Yohanes dan mencakup dimensi durasi serta mutu hidup.
theological_decisions:
- issue: Anteseden οὗτός dalam οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος
  choice: Teks utama memakai 'Dialah', yang paling alami menunjuk kepada anteseden pribadi terdekat, Yesus Sang Mesias.
  alternative: '''Dia'' dapat dipahami menunjuk kepada ''Dia yang benar'', yakni Bapa, dalam kalimat sebelumnya.'
  rationale: Secara sintaksis, demonstratif οὗτός paling wajar menunjuk kepada anteseden pribadi terdekat, tetapi rujukannya telah lama diperdebatkan. Catatan kaki mempertahankan ketegangan tersebut tanpa menetapkannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada bermartabat dan mudah dipahami. Pengulangan khas Yohanes dipertahankan, sedangkan tanda baca dan penghubung disesuaikan agar alami. Penanda catatan kaki [a] ditempatkan sesudah klausa yang dipersoalkan.
