- from: Namun, kita tahu bahwa Anak Allah telah datang dan telah memberi kita pengertian supaya kita mengenal Dia yang benar. Kita berada di dalam Dia yang benar, yaitu di dalam Anak-Nya, Yesus Sang Mesias. Dialah Allah yang benar dan hidup yang kekal.[a]
