  rationale: Revisi mempertahankan padanan leksikal dan ambiguitas anteseden οὗτός, sambil memulihkan penghubung Yunani, menghindari tambahan eksplikatif “yaitu”, dan memindahkan jangkar catatan kaki ke kata yang benar-benar dipersoalkan.
