  source_fidelity: 'Terjemahan mempertahankan unsur-unsur utama teks Yunani: pengulangan «kita tahu», «Dia mendengar kita», cakupan tak tentu ὃ ἐὰν, bentuk kini «kita memiliki», dan perfektum «telah kita minta». Namun, «dalam apa pun yang kita minta» merupakan calque yang kurang idiomatis dalam bahasa Indonesia.'
  naturalness: «Dalam apa pun yang kita minta» tidak terdengar alami sebagai pelengkap «mendengar kita». Selain itu, «memiliki permintaan-permintaan yang telah kita minta» terlalu berulang dan kaku dalam bahasa Indonesia, walaupun pengulangan akar kata memang ada dalam Yunani.
  terminology: «Dia mendengar kita» tepat dan tidak menafsirkan ἀκούει sebagai «mengabulkan». «Hal-hal yang telah kita minta» menyampaikan τὰ αἰτήματα secara idiomatis tanpa mengubahnya menjadi penerimaan atau pengabulan. Kapitalisasi pronomina ilahi konsisten dengan konvensi yang dinyatakan.
