  text: καὶ ἐὰν οἴδαμεν ὅτι ἀκούει ἡμῶν ὃ ⸀ἐὰν αἰτώμεθα, οἴδαμεν ὅτι ἔχομεν τὰ αἰτήματα ἃ ᾐτήκαμεν ⸀ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/015.yaml
  text: And if we know that he hears us in whatever we ask, we know that we have the requests that we have asked from him.
translation:
  language: id
  text: Dan jika kita tahu bahwa Dia mendengar kita, apa pun yang kita minta[a], kita tahu bahwa kita memiliki hal-hal yang telah kita minta dari-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apa saja yang mungkin kita minta.” Konstruksi Yunani menyatakan arti “apa pun” yang tidak dibatasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούει ἡμῶν
  choice: Dia mendengar kita
  rationale: Mempertahankan arti dasar ἀκούω dalam konteks doa tanpa memperkuatnya menjadi 'mengabulkan' atau 'menjawab'.
- source_word: ὃ ἐὰν αἰτώμεθα
  choice: dalam apa pun yang kita minta
  rationale: Konstruksi relatif tak tentu menyatakan cakupan terbuka, yaitu 'apa pun'; kata 'dalam' menghubungkannya secara alami dengan 'mendengar kita'.
- source_word: αἰτώμεθα
  choice: kita minta
  rationale: '''Meminta'' merupakan padanan langsung dan wajar dalam konteks doa.'
- source_word: ἔχομεν
  choice: kita memiliki
  rationale: Mempertahankan bentuk kini dan arti lugas 'memiliki', tanpa menafsirkannya sebagai 'menerima'.
- source_word: τὰ αἰτήματα
  choice: permintaan-permintaan
  rationale: Menunjuk pada hal-hal yang diminta dan mempertahankan hubungan leksikal dengan kata kerja 'meminta'.
- source_word: ἃ ᾐτήκαμεν
  choice: yang telah kita minta
  rationale: Kata 'telah' mencerminkan tindakan lampau yang tetap relevan pada saat kini dalam bentuk perfektum Yunani.
- source_word: ἀπ’ αὐτοῦ
  choice: dari-Nya
  rationale: ἀπό menandai sumber atau pihak yang darinya sesuatu diminta; bentuk ini mempertahankan arah permohonan kepada Allah.
- source_word: οἴδαμεν
  choice: kita tahu
  rationale: Mempertahankan pengulangan kata pengetahuan yang penting dalam tulisan Yohanes dan tidak memperluasnya menjadi parafrasa.
theological_decisions:
- issue: Apakah ἀκούει berarti sekadar 'mendengar' atau secara implisit 'mengabulkan/menjawab' doa.
  choice: Dia mendengar kita
  alternative: Dia mengabulkan permintaan kita
  rationale: Teks Yunani menyatakan bahwa Dia mendengar, lalu menarik kesimpulan bahwa kita memiliki permintaan itu. Terjemahan 'mengabulkan' akan melebur kedua langkah tersebut dan menyelesaikan ketegangan yang dibiarkan oleh teks.
- issue: Makna ἔχομεν sebagai kepemilikan kini atau penerimaan kelak.
  choice: kita memiliki
  alternative: kita akan menerima
  rationale: Bentuk kini Yunani secara eksplisit berarti 'kita memiliki'; bentuk futur akan menambahkan penafsiran temporal yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pengulangan 'kita tahu' dipertahankan untuk mencerminkan gaya Yohanes. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia.
