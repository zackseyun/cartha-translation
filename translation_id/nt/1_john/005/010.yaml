id: 1JN.5.10
reference: 1 John 5:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ ἔχει τὴν μαρτυρίαν ἐν ⸀αὑτῷ· ὁ μὴ πιστεύων τῷ θεῷ ψεύστην πεποίηκεν αὐτόν, ὅτι οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/010.yaml
  text: The one who believes in the Son of God has the testimony in himself[a]; the one who does not believe God has made him a liar[b], because he has not believed the testimony that God has testified about his Son.
translation:
  language: id
  text: Orang yang percaya kepada Anak Allah memiliki kesaksian itu di dalam dirinya sendiri.[a] Orang yang tidak memercayai Allah telah menjadikan Dia pendusta[b], karena ia tidak memercayai kesaksian yang telah Allah berikan tentang Anak-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “di dalam Dia”, bukan “di dalam dirinya sendiri”; bacaan itu dapat dipahami sebagai “di dalam Anak”.
    reason: textual_variant
  - marker: b
    text: Atau, “telah menganggap Dia pendusta.” Secara lebih harfiah, teks Yunani berbunyi “telah menjadikan Dia pendusta”; maksudnya, menolak kesaksian Allah berarti memperlakukan Allah seolah-olah Ia tidak berkata benar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: Orang yang percaya
  rationale: Partisipel kini dengan artikel berfungsi sebagai nomina dan menunjuk secara umum kepada siapa pun yang percaya; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: εἰς τὸν υἱὸν τοῦ θεοῦ
  choice: kepada Anak Allah
  rationale: Bersama πιστεύω, εἰς menyatakan kepercayaan yang diarahkan kepada seseorang. 'Percaya kepada' merupakan ungkapan Indonesia yang alami dan membedakannya dari sekadar mempercayai kebenaran suatu pernyataan.
- source_word: τὴν μαρτυρίαν
  choice: kesaksian itu
  rationale: μαρτυρία menunjuk pada kesaksian yang telah dibicarakan dalam konteks sebelumnya. Kata 'itu' mencerminkan artikelnya dan 'kesaksian' mempertahankan nuansa pemberian saksi.
- source_word: ἐν αὑτῷ
  choice: di dalam dirinya sendiri
  rationale: Bentuk refleksif paling wajar merujuk kembali kepada orang yang percaya dan menyatakan bahwa kesaksian itu dimilikinya secara batiniah.
- source_word: ὁ μὴ πιστεύων τῷ θεῷ
  choice: Orang yang tidak memercayai Allah
  rationale: Datif sesudah πιστεύω di sini berarti tidak menerima perkataan atau kesaksian Allah sebagai benar, bukan sekadar tidak percaya akan keberadaan Allah. 'Memercayai Allah' mempertahankan perbedaan itu.
- source_word: ψεύστην πεποίηκεν αὐτόν
  choice: telah menjadikan Dia pendusta
  rationale: 'Terjemahan ini mempertahankan ungkapan Yunani yang tegas serta aspek perfektum: penolakan terhadap kesaksian Allah menempatkan orang tersebut dalam keadaan telah memperlakukan Allah sebagai pendusta.'
- source_word: οὐ πεπίστευκεν
  choice: ia tidak memercayai
  rationale: Perfektum menyatakan ketidakpercayaan yang akibatnya tetap berlaku. Dalam bahasa Indonesia, bentuk 'tidak memercayai' paling alami; unsur keberlanjutannya ditopang oleh konteks dan bentuk 'telah' pada verba kesaksian berikutnya.
- source_word: ἣν μεμαρτύρηκεν ὁ θεὸς
  choice: yang telah Allah berikan
  rationale: Secara kontekstual yang diberikan Allah ialah kesaksian. 'Telah Allah berikan' menyampaikan perfektum dan hubungan dengan nomina 'kesaksian' tanpa menghasilkan pengulangan tidak alami seperti 'kesaksian yang Allah saksikan'.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: tentang Anak-Nya
  rationale: περί dengan genitif berarti 'tentang' atau 'mengenai'. Bentuk 'Anak-Nya' jelas dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan frasa 'di dalam dirinya sendiri'
  choice: Kesaksian itu berada secara batiniah dalam diri orang yang percaya.
  alternative: Menurut varian naskah 'di dalam Dia', kesaksian itu dapat dipahami berada di dalam Anak.
  rationale: Teks SBLGNT yang diberikan memakai αὑτῷ, bentuk refleksif yang paling alami merujuk kepada orang yang percaya. Varian naskah dicatat tanpa menyelesaikan implikasi teologisnya.
- issue: Makna 'tidak memercayai Allah'
  choice: Frasa ini menunjuk secara khusus pada penolakan terhadap kesaksian Allah.
  alternative: Frasa ini dapat dibaca secara lebih umum sebagai tidak percaya kepada Allah.
  rationale: Klausa ὅτι berikutnya menjelaskan bahwa masalahnya ialah tidak menerima kesaksian yang Allah berikan tentang Anak-Nya. Karena itu, terjemahan membedakan 'percaya kepada Anak Allah' dari 'memercayai Allah'.
- issue: Ungkapan 'menjadikan Dia pendusta'
  choice: Mempertahankan ungkapan Yunani yang keras dalam teks utama.
  alternative: Menganggap Allah pendusta atau memperlakukan-Nya seolah-olah Ia berdusta.
  rationale: Terjemahan harfiah menjaga daya retoris dan ketegangan teologis teks, sedangkan catatan kaki menjelaskan maksud idiomatisnya tanpa melunakkan teks utama.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat mempertahankan kesejajaran dua klausa Yunani. 'Memercayai Allah' dipilih untuk membedakannya dari 'percaya kepada Anak Allah', sedangkan kapitalisasi 'Dia' memperjelas bahwa pronomina tersebut merujuk kepada Allah.
