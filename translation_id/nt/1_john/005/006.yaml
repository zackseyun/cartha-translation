id: 1JN.5.6
reference: 1 John 5:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ ἐλθὼν δι’ ὕδατος καὶ αἵματος, Ἰησοῦς Χριστός· οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ⸀ἐν τῷ αἵματι· καὶ τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν, ὅτι τὸ πνεῦμά ἐστιν ἡ ἀλήθεια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/006.yaml
  text: This is the one who came by water and blood—Jesus the Messiah[a]; not by the water only, but by the water and by the blood. And the Spirit is the one testifying[c][b], because the Spirit is the truth.
translation:
  language: id
  text: Dialah yang datang melalui air dan darah[a], yaitu Yesus sang Mesias; bukan hanya dengan air, melainkan dengan air dan dengan darah. Rohlah yang bersaksi, karena[b] Roh adalah kebenaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan "melalui air dan darah" diperdebatkan. Ungkapan ini antara lain dipahami sebagai baptisan dan kematian Yesus, kelahiran dan kematian Yesus, atau gambaran sakramental. Teks utama mempertahankan ungkapan Yunani tanpa memilih salah satu tafsir tersebut.
    reason: interpretive_ambiguity
  - marker: b
    text: 'Kata Yunani yang diterjemahkan "karena" juga dapat diterjemahkan "bahwa": "Rohlah yang bersaksi bahwa Roh adalah kebenaran."'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ ἐλθὼν
  choice: Dialah yang datang
  rationale: Bentuk ini wajar dalam bahasa Indonesia dan mempertahankan penekanan identifikasional pada Yesus serta acuan historis partisip aoris.
- source_word: δι’ ὕδατος καὶ αἵματος
  choice: melalui air dan darah
  rationale: Kata depan διά dengan genitif dapat menyatakan sarana atau keadaan yang menyertai. 'Melalui' dekat dengan bentuk Yunani dan tidak menentukan tafsir khusus atas air dan darah.
- source_word: Ἰησοῦς Χριστός
  choice: Yesus sang Mesias
  rationale: Χριστός di sini berfungsi sebagai gelar dalam aposisi. 'Sang Mesias' mengungkapkan fungsi gelar itu secara alami dan terhormat dalam bahasa Indonesia.
- source_word: οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ἐν τῷ αἵματι
  choice: bukan hanya melalui air, melainkan melalui air dan darah
  rationale: Pengulangan unsur utama dipertahankan untuk menampilkan kontras Yunani, sementara 'melainkan' memberi pertentangan yang alami dalam bahasa Indonesia.
- source_word: τὸ πνεῦμά
  choice: Roh
  rationale: Konteks kesaksian ilahi dalam surat ini menunjuk kepada Roh Kudus; kapitalisasi menandai referennya tanpa menambahkan sebutan yang tidak terdapat dalam ayat.
- source_word: τὸ μαρτυροῦν
  choice: yang bersaksi
  rationale: Partisip kini mempertahankan daya verbal kesaksian. Konstruksi penegas 'Rohlah yang bersaksi' alami dan mencerminkan struktur identifikasional Yunani.
- source_word: ὅτι
  choice: karena
  rationale: Dipahami secara kausal sebagai dasar bagi kesaksian Roh. Kemungkinan makna isi, 'bahwa', dicatat dalam catatan kaki.
- source_word: ἡ ἀλήθεια
  choice: kebenaran
  rationale: 'Predikat nominal tetap bersifat identifikasional: Roh adalah kebenaran, bukan sekadar benar atau dapat dipercaya.'
theological_decisions:
- issue: Makna 'air dan darah'
  choice: Ungkapan dipertahankan tanpa penjelasan tafsir dalam teks utama.
  alternative: Baptisan dan kematian Yesus; kelahiran dan kematian-Nya; atau gambaran sakramental.
  rationale: Teks Yunani tidak menjelaskan lambangnya. Mempertahankan ungkapan tersebut menjaga ambiguitas dan ketegangan teologis yang asli.
- issue: Referen 'Roh'
  choice: Roh Kudus, ditandai dengan huruf kapital.
  alternative: roh dalam arti umum.
  rationale: Konteks kesaksian ilahi dan pemakaian Yohanes sangat mendukung rujukan kepada Roh Kudus, tanpa perlu memperluas teks menjadi 'Roh Kudus'.
- issue: Fungsi Χριστός
  choice: Mesias sebagai gelar.
  alternative: Kristus sebagai unsur nama yang telah membeku.
  rationale: Aposisi 'Yesus sang Mesias' menonjolkan fungsi gelar Χριστός dan tetap idiomatis dalam bahasa Indonesia.
- issue: Fungsi ὅτι
  choice: 'Kausal: ''karena''.'
  alternative: 'Isi kesaksian: ''bahwa''.'
  rationale: Bacaan kausal paling wajar memberi alasan mengapa Roh menjadi saksi, tetapi bentuk Yunani memungkinkan bacaan isi sehingga alternatifnya dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. 'Dialah' dan 'Rohlah' mempertahankan penekanan Yunani secara alami. Tanda pisah menandai aposisi identifikasional, sedangkan ungkapan 'air dan darah' sengaja dibiarkan tanpa penafsiran eksplisit.
