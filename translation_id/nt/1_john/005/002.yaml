base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/002.yaml
  text: 'By this we know that we love the children of God: when we love God and keep his commandments[a].'
translation:
  language: id
  text: 'Dengan ini kita mengetahui bahwa kita mengasihi anak-anak Allah: apabila kita mengasihi Allah dan melaksanakan perintah-perintah-Nya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “melakukan perintah-perintah-Nya”; dapat juga diterjemahkan “menaati perintah-perintah-Nya”. Kata kerja Yunani di sini adalah ποιέω, “melakukan”, bukan τηρέω, kata yang lebih lazim diterjemahkan “memelihara” atau “menaati”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Dengan inilah
  rationale: Ungkapan ini memperkenalkan dasar atau tanda untuk mengetahui sesuatu. “Dengan inilah” mempertahankan daya tunjuk frasa Yunani dan mengarah secara alami kepada klausa berikutnya.
- source_word: γινώσκομεν
  choice: kita mengetahui
  rationale: Bentuk kini dalam gaya Yohanes menyatakan pengenalan atau pengetahuan yang berlaku; “mengetahui” merupakan padanan baku dan jelas.
- source_word: ἀγαπῶμεν
  choice: kita mengasihi
  rationale: “Mengasihi” sesuai dengan ragam bahasa Alkitab Indonesia yang tetap wajar dan mempertahankan pengulangan verba yang sama dalam kedua klausa.
- source_word: τὰ τέκνα τοῦ θεοῦ
  choice: anak-anak Allah
  rationale: τέκνα bersifat inklusif dan menunjuk semua yang menjadi anak Allah; bentuk ini juga mempertahankan konstruksi genitif dan diksi khas Yohanes.
- source_word: ὅταν
  choice: apabila
  rationale: Dengan bentuk subjungtif kini, ὅταν memiliki nuansa waktu sekaligus syarat atau keadaan berulang. “Apabila” menjaga nuansa itu lebih baik daripada sekadar “ketika”.
- source_word: τὰς ἐντολὰς αὐτοῦ ποιῶμεν
  choice: melaksanakan perintah-perintah-Nya
  rationale: ποιέω secara dasar berarti “melakukan”. Dalam bahasa Indonesia, “melaksanakan perintah” merupakan ungkapan alami yang mempertahankan gagasan tindakan nyata tanpa menggantinya begitu saja dengan verba “menaati”.
theological_decisions:
- issue: Hubungan antara kasih kepada anak-anak Allah, kasih kepada Allah, dan pelaksanaan perintah-Nya
  choice: Ayat ini menyatakan bahwa kasih kepada anak-anak Allah diketahui apabila kita mengasihi Allah dan melaksanakan perintah-perintah-Nya, tanpa menentukan lebih lanjut apakah hubungannya terutama bersifat bukti, sebab, atau definisi timbal balik.
  alternative: Menafsirkannya secara khusus sebagai ujian pembuktian, sebab kasih kepada sesama, atau definisi timbal balik antara kasih kepada Allah dan kasih kepada orang percaya.
  rationale: Susunan Yunani menyajikan suatu kriteria secara ringkas. Terjemahan mempertahankan hubungan dan ketegangan teologis tersebut tanpa mempersempitnya pada satu sistem penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Dengan inilah” mempertahankan pola argumentasi Yohanes, sedangkan “melaksanakan perintah-perintah-Nya” lebih alami daripada “melakukan perintah-perintah-Nya” tanpa mengaburkan verba sumber. Tanda catatan kaki [a] dicantumkan dalam teks utama.
