id: 1JN.5.16
reference: 1 John 5:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐάν τις ἴδῃ τὸν ἀδελφὸν αὐτοῦ ἁμαρτάνοντα ἁμαρτίαν μὴ πρὸς θάνατον, αἰτήσει, καὶ δώσει αὐτῷ ζωήν, τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον. ἔστιν ἁμαρτία πρὸς θάνατον· οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/016.yaml
  text: If anyone sees his brother committing a sin not leading to death[a], he shall ask, and God will give him life—to those committing sins not leading to death. There is sin leading to death[c][b]; I am not saying that he should ask about that.
translation:
  language: id
  text: Jika seseorang melihat saudaranya berbuat dosa yang tidak mengarah kepada kematian[a], hendaklah ia memohon, dan Allah akan memberikan hidup kepadanya, yakni kepada orang-orang yang berbuat dosa yang tidak mengarah kepada kematian. Ada dosa yang mengarah kepada kematian; tentang dosa itu aku tidak mengatakan bahwa ia harus memohon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “kematian” tidak menjelaskan apakah yang dimaksud ialah kematian jasmani, kematian rohani, atau penghukuman akhir. Bahasa Yunani juga tidak menyebutkan subjek dalam kalimat “akan memberikan hidup”; konteks doa menunjukkan bahwa pemberinya dipahami sebagai Allah. “Saudara” berbentuk tunggal maskulin dan dalam konteks ini kemungkinan besar berarti saudara seiman.
    reason: Menjaga tiga unsur penting dari bentuk sumber dan ambiguitasnya tanpa membebani teks utama dengan beberapa penanda catatan.
lexical_decisions:
- source_word: ἀδελφὸν
  choice: saudaranya
  rationale: Bentuk Yunani adalah tunggal maskulin dan dalam konteks surat ini menunjuk pada saudara seiman. 'Saudaranya' mempertahankan bentuk sumber secara alami dalam bahasa Indonesia; cakupan kontekstualnya dijelaskan dalam catatan.
- source_word: ἁμαρτάνοντα ἁμαρτίαν
  choice: berbuat dosa
  rationale: Ungkapan Indonesia ini idiomatis dan menyampaikan tindakan konkret dari partisip dengan objek serumpun tanpa menghasilkan susunan yang janggal.
- source_word: μὴ πρὸς θάνατον
  choice: yang tidak menuju kematian
  rationale: '''Menuju kematian'' mempertahankan arah atau hasil yang terkandung dalam πρός sekaligus tidak menentukan apakah kematian itu jasmani, rohani, atau penghukuman akhir.'
- source_word: αἰτήσει
  choice: hendaklah ia memohon
  rationale: Bentuk futurum dapat berfungsi sebagai dorongan atau perintah dalam konteks. 'Hendaklah' menyampaikan fungsi itu, sedangkan 'memohon' cocok dengan konteks doa.
- source_word: δώσει αὐτῷ ζωήν
  choice: Allah akan memberikan hidup kepadanya
  rationale: Subjek verba tidak dinyatakan dalam bahasa Yunani. Konteks permohonan kepada Allah sangat kuat mendukung Allah sebagai pemberi hidup; penambahan ini ditandai dalam catatan.
- source_word: ζωήν
  choice: hidup
  rationale: Pilihan sederhana ini mempertahankan keluasan makna teologis ζωή dalam tulisan Yohanes dan tidak mempersempitnya menjadi hidup jasmani, rohani, atau kekal saja.
- source_word: τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον
  choice: yaitu kepada mereka yang berbuat dosa yang tidak menuju kematian
  rationale: Frasa datif jamak yang sulit ini disajikan sebagai penjelasan sesudah tanda pisah. 'Mereka' mempertahankan bentuk jamak tanpa memaksakan hubungan sintaksis yang lebih pasti daripada teks sumber.
- source_word: ἔστιν ἁμαρτία πρὸς θάνατον
  choice: Ada dosa yang menuju kematian
  rationale: Rumusan ini mempertahankan ketiadaan artikel dalam bahasa Yunani dan tidak memastikan apakah yang dimaksud ialah satu tindakan tertentu atau suatu golongan dosa.
- source_word: οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ
  choice: tentang dosa itu aku tidak mengatakan bahwa ia harus memohon
  rationale: Susunan ini mempertahankan pembatasan pernyataan penulis. 'Memohon' menyampaikan konteks doa, sedangkan 'harus' secara wajar mengungkapkan force klausa ἵνα tanpa menjadikannya larangan eksplisit.
theological_decisions:
- issue: Makna 'kematian' dalam dosa yang menuju kematian
  choice: Mempertahankan kata 'kematian' tanpa menentukan jenisnya.
  alternative: Kematian jasmani sebagai hukuman ilahi; kematian rohani atau kekal; penghukuman akhir.
  rationale: Ayat tidak mendefinisikan jenis kematian yang dimaksud. Menentukan salah satu tafsiran dalam teks utama akan menghilangkan ambiguitas dan ketegangan teologis yang asli.
- issue: Identitas pemberi hidup
  choice: Menjadikan Allah subjek eksplisit dalam teks dan menjelaskannya dalam catatan.
  alternative: Mempertahankan subjek sebagai 'ia', atau memahami orang yang berdoa sebagai pemberi hidup.
  rationale: Bahasa Yunani tidak menyebutkan subjek δώσει, tetapi konteks doa paling alami menunjuk kepada Allah sebagai pemberi hidup. Catatan menjaga transparansi terhadap bentuk sumber.
- issue: Sikap terhadap permohonan mengenai dosa yang menuju kematian
  choice: Menerjemahkan bahwa penulis tidak mengatakan orang itu harus memohon, bukan melarangnya secara tegas.
  alternative: 'Menerjemahkan sebagai larangan: ''janganlah ia memohon''.'
  rationale: οὐ ... λέγω ἵνα menyatakan bahwa penulis tidak menganjurkan atau tidak mengatakan hal itu, tetapi tidak dengan sendirinya merumuskan larangan mutlak.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Memohon' dipilih untuk konteks doa; 'menuju kematian' menjaga hubungan hasil atau arah tanpa menafsirkan jenis kematian. Tanda pisah mempertahankan sifat penjelas frasa datif jamak. Pronomina 'aku' mengikuti suara pribadi penulis dan lazim dalam terjemahan Alkitab Indonesia.
