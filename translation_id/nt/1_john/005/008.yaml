  text: τὸ πνεῦμα καὶ τὸ ὕδωρ καὶ τὸ αἷμα, καὶ οἱ τρεῖς εἰς τὸ ἕν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/008.yaml
  text: the Spirit and the water and the blood[a], and the three are for the one.
translation:
  language: id
  text: Roh, air, dan darah; dan ketiganya sepakat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “ketiganya adalah satu.” Ungkapan Yunani di sini kemungkinan berarti bahwa kesaksian ketiganya selaras.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Dalam konteks 1 Yohanes 5:6–8, πνεῦμα paling wajar merujuk kepada Roh Kudus sebagai saksi. Huruf kapital menandai rujukan tersebut tanpa menambahkan sebutan yang tidak terdapat dalam ayat ini.
- source_word: τὸ ὕδωρ
  choice: air
  rationale: Nomina konkret ini diterjemahkan secara langsung. Bahasa Indonesia tidak memakai kata sandang tentu seperti bahasa Yunani, dan rujukannya tidak diperjelas secara interpretatif dalam teks utama.
- source_word: τὸ αἷμα
  choice: darah
  rationale: Nomina konkret ini dipertahankan tanpa menafsirkan lebih lanjut apa yang dilambangkannya.
- source_word: οἱ τρεῖς
  choice: ketiganya
  rationale: Bentuk ini secara alami merujuk kembali kepada tiga unsur yang baru disebutkan dan mempertahankan sifat kolektif frasa Yunani.
- source_word: εἰς τὸ ἕν εἰσιν
  choice: sepakat
  rationale: Dalam konteks tiga saksi, ungkapan ini menyatakan bahwa kesaksian mereka mengarah kepada satu hal dan selaras. 'Sepakat' menyampaikan fungsi idiom tersebut secara alami dalam bahasa Indonesia tanpa mengubahnya menjadi pernyataan tentang kesatuan hakikat.
theological_decisions:
- issue: Apakah εἰς τὸ ἕν εἰσιν menyatakan keselarasan kesaksian atau kesatuan ontologis
  choice: ketiganya sepakat
  alternative: ketiganya adalah satu
  rationale: Konteks langsung membahas kesaksian Roh, air, dan darah. Karena itu, keselarasan kesaksian paling sesuai dengan fungsi frasa ini. Alternatif yang lebih harfiah dicatat agar bentuk dan ketegangan ungkapan Yunani tetap terlihat, tanpa memasukkan klaim ontologis yang tidak dituntut oleh konteks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Tanda titik koma memisahkan daftar para saksi dari pernyataan tentang keselarasan mereka. Kata sandang Yunani tidak dipaksakan ke dalam bahasa Indonesia karena tidak memiliki padanan alami.
