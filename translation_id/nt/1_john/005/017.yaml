  text: All unrighteousness is sin[b][a], and there is sin not leading to death.
translation:
  language: id
  text: Segala kejahatan[a] adalah dosa, dan ada dosa yang tidak membawa kepada kematian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Segala perbuatan salah adalah dosa” atau “Segala ketidakadilan adalah dosa.”
    reason: lexical_alternative
  - marker: b
    text: Atau “yang tidak berakibat pada kematian”; secara lebih harfiah, “yang tidak menuju kematian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα
  choice: Segala
  rationale: Bersama nomina tunggal tanpa artikel ἀδικία, kata ini menyatakan cakupan menyeluruh. “Segala” terdengar alami dan mempertahankan sifat universal pernyataan tersebut.
- source_word: ἀδικία
  choice: ketidakbenaran
  rationale: Pilihan ini mempertahankan cakupan moral-teologis ἀδικία dan kaitannya dengan konsep kebenaran, tanpa mempersempitnya hanya pada ketidakadilan sosial atau hukum.
- source_word: ἁμαρτία
  choice: dosa
  rationale: Padanan baku dan tepat dalam konteks untuk kedua kemunculan ἁμαρτία.
- source_word: καὶ
  choice: dan
  rationale: Kata sambung sederhana ini secara alami menghubungkan pernyataan umum dengan penjelasan yang mengikutinya.
- source_word: οὐ πρὸς θάνατον
  choice: tidak membawa kepada kematian
  rationale: Frasa πρὸς θάνατον menunjukkan arah atau akibat. “Tidak membawa kepada kematian” jelas dalam bahasa Indonesia modern dan mempertahankan daya ungkap frasa Yunani tersebut.
- source_word: θάνατον
  choice: kematian
  rationale: Padanan langsung yang tidak menentukan apakah kematian yang dimaksud bersifat jasmani, rohani, atau eskatologis.
theological_decisions:
- issue: Hakikat “kematian” dalam frasa “dosa yang tidak membawa kepada kematian”
  choice: Menerjemahkannya hanya sebagai “kematian” tanpa penjelas penafsiran
  alternative: kematian jasmani; kematian rohani; penghukuman terakhir
  rationale: Teks Yunani hanya menyebut θάνατον dan tidak menjelaskan jenis kematian yang dimaksud. Terjemahan mempertahankan keterbukaan penafsiran ini.
- issue: Makna moral-teologis ἀδικία
  choice: ketidakbenaran
  alternative: perbuatan salah; ketidakadilan
  rationale: Pernyataan ini bersifat luas dan moral-teologis. “Ketidakbenaran” menjaga keluasan makna serta hubungannya dengan konsep kebenaran, sedangkan “ketidakadilan” dapat dipahami terlalu sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat lugas bagi pembaca umum, sementara istilah “ketidakbenaran” mempertahankan bobot moral-teologis teks. Ambiguitas mengenai jenis kematian sengaja dipertahankan.
