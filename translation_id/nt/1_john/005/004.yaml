source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ γεγεννημένον ἐκ τοῦ θεοῦ νικᾷ τὸν κόσμον. καὶ αὕτη ἐστὶν ἡ νίκη ἡ νικήσασα τὸν κόσμον, ἡ πίστις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/004.yaml
  text: 'For everyone who has been born of God overcomes the world[b][a]. And this is the victory that has overcome the world: our faith.'
translation:
  language: id
  text: 'Sebab setiap orang yang telah lahir dari Allah mengalahkan dunia.[a] Dan inilah kemenangan yang telah mengalahkan dunia: iman kita.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “segala yang telah lahir dari Allah”; bentuk netral dalam bahasa Yunani mengungkapkan seluruh golongan orang yang lahir dari Allah.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “kesetiaan kita.” Dalam beberapa konteks, kata Yunani ini juga dapat berarti “kepercayaan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Kata ini memberikan alasan bagi pernyataan sebelumnya dan mempertahankan daya kausalnya secara alami dalam bahasa Indonesia.
- source_word: πᾶν τὸ γεγεννημένον
  choice: setiap orang yang telah lahir
  rationale: Walaupun bentuk Yunaninya netral tunggal dan secara harfiah dapat berarti 'segala yang telah lahir', konteksnya menunjuk secara kolektif kepada orang-orang yang lahir dari Allah.
- source_word: γεγεννημένον
  choice: telah lahir
  rationale: Bentuk partisip perfek pasif menyatakan kelahiran yang sudah terjadi dengan hasil yang tetap berlangsung; 'telah lahir' alami dan sesuai dengan bahasa kelahiran baru dalam tulisan Yohanes.
- source_word: ἐκ τοῦ θεοῦ
  choice: dari Allah
  rationale: Mempertahankan gagasan asal-usul ilahi yang dinyatakan oleh ἐκ dalam ungkapan kelahiran.
- source_word: νικᾷ
  choice: mengalahkan
  rationale: Padanan ini alami untuk kemenangan atas lawan dan memungkinkan hubungan leksikal dengan kata benda 'kemenangan' tetap terdengar.
- source_word: τὸν κόσμον
  choice: dunia
  rationale: Mempertahankan istilah khas Yohanes bagi dunia yang menentang Allah tanpa mempersempit maknanya melalui penafsiran tambahan.
- source_word: αὕτη ἐστὶν ἡ νίκη
  choice: inilah kemenangan
  rationale: Menyampaikan penekanan demonstratif dan mempertahankan hubungan dengan verba 'mengalahkan'.
- source_word: ἡ νικήσασα
  choice: yang telah mengalahkan
  rationale: Mencerminkan aspek tindakan yang dipandang sebagai tercapai dalam partisip aoris, dengan bentuk Indonesia yang wajar.
- source_word: ἡ πίστις ἡμῶν
  choice: iman kita
  rationale: Dalam konteks ini πίστις paling wajar menunjuk pada iman atau kepercayaan orang percaya; kepemilikan ἡμῶν diterjemahkan langsung sebagai 'kita'.
theological_decisions:
- issue: Rujukan πᾶν τὸ γεγεννημένον
  choice: setiap orang yang telah lahir dari Allah
  alternative: segala yang telah lahir dari Allah
  rationale: Bentuk netral Yunani mencakup seluruh golongan yang lahir dari Allah, sedangkan konteksnya membicarakan manusia. Teks utama memakai ungkapan personal yang alami, sementara bentuk formalnya dipertahankan dalam catatan.
- issue: Makna πίστις
  choice: iman
  alternative: kesetiaan; kepercayaan
  rationale: '''Iman'' paling sesuai dengan konteks sebagai sarana kemenangan orang percaya, tetapi kemungkinan leksikal lain tidak dihapuskan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'mengalahkan—kemenangan—mengalahkan' sengaja dipertahankan untuk mencerminkan rangkaian kata serumpun νικᾷ—νίκη—νικήσασα dalam teks Yunani.
