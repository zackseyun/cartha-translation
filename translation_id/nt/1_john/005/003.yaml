id: 1JN.5.3
reference: 1 John 5:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: αὕτη γάρ ἐστιν ἡ ἀγάπη τοῦ θεοῦ ἵνα τὰς ἐντολὰς αὐτοῦ τηρῶμεν, καὶ αἱ ἐντολαὶ αὐτοῦ βαρεῖαι οὐκ εἰσίν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/003.yaml
  text: 'For this is the love of God: that we keep his commandments[a], and his commandments are not burdensome.'
translation:
  language: id
  text: 'Sebab, inilah kasih kepada Allah: kita menaati perintah-perintah-Nya, dan perintah-perintah-Nya tidaklah memberatkan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὕτη
  choice: inilah
  rationale: Kata tunjuk ini mengarah ke depan, kepada klausa yang menjelaskan wujud kasih kepada Allah; “inilah” alami dan tegas dalam bahasa Indonesia.
- source_word: γάρ
  choice: Sebab
  rationale: Kata ini memberikan alasan atau penjelasan bagi pernyataan sebelumnya dan mempertahankan hubungan antarayat.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: kasih kepada Allah
  rationale: Genitif paling mungkin bersifat objektif dalam konteks ayat 2–3, yakni kasih orang percaya yang diarahkan kepada Allah. Pilihan ini juga lebih jelas dalam bahasa Indonesia daripada “kasih Allah”, yang biasanya dipahami sebagai kasih yang berasal dari Allah.
- source_word: ἵνα
  choice: ':'
  rationale: Di sini ἵνα memperkenalkan isi atau penjelasan tentang kasih kepada Allah. Tanda titik dua menyampaikan hubungan penjelas itu secara alami dalam bahasa Indonesia.
- source_word: ἐντολάς
  choice: perintah-perintah
  rationale: Bentuk jamak dipertahankan dan “perintah” merupakan padanan modern yang wajar bagi ἐντολή.
- source_word: τηρῶμεν
  choice: kita menaati
  rationale: Dalam konteks perintah, τηρέω berarti memelihara atau menuruti dengan taat. “Menaati” menyampaikan makna tersebut secara langsung dan alami.
- source_word: βαρεῖαι
  choice: memberatkan
  rationale: Adjektiva ini secara harfiah berkaitan dengan sesuatu yang berat, dan secara idiomatis berarti membebani atau sukar ditanggung; “tidaklah memberatkan” jelas dan alami.
theological_decisions:
- issue: Makna genitif dalam ἡ ἀγάπη τοῦ θεοῦ
  choice: 'Genitif objektif: kasih manusia kepada Allah'
  alternative: 'Genitif subjektif: kasih Allah kepada manusia; atau ungkapan yang mempertahankan kedua kemungkinan'
  rationale: Ayat sebelumnya menghubungkan kasih kepada Allah dengan pelaksanaan perintah-Nya, dan ayat ini langsung menjelaskan kasih itu sebagai menaati perintah-perintah-Nya. Karena bahasa Indonesia “kasih Allah” hampir selalu dibaca sebagai kasih yang berasal dari Allah, terjemahan “kasih kepada Allah” menyampaikan makna kontekstual yang paling kuat tanpa ambiguitas yang menyesatkan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat mempertahankan hubungan logis dengan konteks melalui “Sebab”, sementara tanda titik dua menandai klausa penjelas. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
