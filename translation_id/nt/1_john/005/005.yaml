id: 1JN.5.5
reference: 1 John 5:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τίς ⸂δέ ἐστιν⸃ ὁ νικῶν τὸν κόσμον εἰ μὴ ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/005.yaml
  text: And who is the one who overcomes the world except the one who believes that Jesus is the Son of God?[a]
translation:
  language: id
  text: Dan siapakah yang mengalahkan dunia, selain orang yang percaya bahwa Yesus adalah Anak Allah?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dia yang mengalahkan ... dia yang percaya.” Dalam bahasa Yunani, kedua partisipel itu berbentuk maskulin tunggal, tetapi digunakan dengan makna representatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: siapakah
  rationale: Kata ganti tanya ini membuka pertanyaan retoris; “siapakah” alami dan mempertahankan penekanannya.
- source_word: δέ
  choice: Dan
  rationale: δέ menghubungkan ayat ini secara ringan dengan pernyataan sebelumnya, bukan menyatakan pertentangan tajam.
- source_word: ὁ νικῶν
  choice: orang yang mengalahkan
  rationale: Partisipel kini berartikel dipakai sebagai nomina dan menyatakan ciri yang berlangsung; bentuk ini alami dalam bahasa Indonesia serta tidak membatasi rujukan pada laki-laki.
- source_word: τὸν κόσμον
  choice: dunia
  rationale: Mempertahankan ungkapan sumber tanpa memperluasnya secara tafsir menjadi “sistem dunia”.
- source_word: εἰ μὴ
  choice: selain
  rationale: Dalam pertanyaan retoris ini, ungkapan tersebut menyatakan pengecualian secara idiomatis dan eksklusif.
- source_word: ὁ πιστεύων
  choice: orang yang percaya
  rationale: Mempertahankan daya verbal partisipel kini, yakni percaya sebagai ciri orang tersebut, alih-alih mengubahnya menjadi nomina abstrak.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi kepercayaan, bukan alasan kausal.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Anak Allah
  rationale: Mempertahankan gelar kristologis secara langsung dan dengan bobot pengakuannya, tanpa penambahan tafsir.
theological_decisions:
- issue: Partisipel substantival maskulin tunggal ὁ νικῶν dan ὁ πιστεύων
  choice: orang yang mengalahkan / orang yang percaya
  alternative: dia yang mengalahkan / dia yang percaya
  rationale: Bentuk Yunani secara gramatikal maskulin tunggal, tetapi berdaya representatif atau generik. “Orang yang” mengungkapkan cakupan itu secara wajar dalam bahasa Indonesia sambil mempertahankan bentuk personal dan verbal.
- issue: Pengakuan kristologis ὁ υἱὸς τοῦ θεοῦ
  choice: Anak Allah
  alternative: Putra Allah
  rationale: “Anak Allah” merupakan padanan baku, langsung, dan mudah dipahami untuk gelar ini; terjemahan tidak memperluas ataupun mengurangi isi teologis teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pertanyaan retoris dipertahankan. “Siapakah” memberi penekanan yang alami, sedangkan “orang yang” menghindari kesan bahwa rujukannya hanya laki-laki tanpa menghilangkan sifat personal dari bentuk Yunani.
