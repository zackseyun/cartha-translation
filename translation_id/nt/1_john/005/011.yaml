  text: καὶ αὕτη ἐστὶν ἡ μαρτυρία, ὅτι ζωὴν αἰώνιον ἔδωκεν ⸂ὁ θεὸς ἡμῖν⸃, καὶ αὕτη ἡ ζωὴ ἐν τῷ υἱῷ αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/011.yaml
  text: 'And this is the testimony: that God has given us eternal life[c][b][a], and this life is in his Son.'
translation:
  language: id
  text: 'Dan inilah kesaksian[a]: Allah telah memberikan[b] hidup kekal kepada kita, dan hidup itu ada di dalam Anak-Nya.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “kesaksian” juga dapat diterjemahkan “saksi” atau “witness,” bergantung pada konteksnya.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “memberikan”; bentuk Yunani menunjuk pada tindakan pemberian yang telah terjadi, sedangkan “telah memberikan” menonjolkan hasilnya yang tetap berlaku.
    reason: lexical_alternative
  - marker: c
    text: “Di dalam Anak-Nya” mempertahankan ungkapan Yunani; terjemahan “melalui Anak-Nya” atau “bersama Anak-Nya” akan mempersempit atau melemahkan ungkapan khas Yohanes ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: kesaksian
  rationale: Kata ini menunjuk pada isi yang dinyatakan sebagai bukti; “kesaksian” alami dalam bahasa Indonesia dan mempertahankan nuansa yuridis-evidensial dalam konteks Yohanes.
- source_word: ὅτι
  choice: ':'
  rationale: Tanda titik dua secara alami memperkenalkan isi kesaksian dalam bahasa Indonesia tanpa menambah penafsiran; secara semantis mewakili ὅτι yang menjelaskan isi.
- source_word: ζωὴν αἰώνιον
  choice: hidup kekal
  rationale: Ungkapan baku dan alami dalam bahasa Indonesia untuk kehidupan dari Allah yang bersifat kekal, sesuai dengan pemakaian Yohanes.
- source_word: ἔδωκεν
  choice: telah memberikan
  rationale: Bentuk ini menyampaikan tindakan pemberian yang sudah terjadi sekaligus hasilnya yang tetap berlaku sekarang, tanpa mengubah verba umum δίδωμι menjadi istilah yang lebih khusus.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Padanan langsung dan lazim bagi θεός dalam konteks ini.
- source_word: ἡμῖν
  choice: kepada kita
  rationale: Menyatakan objek tak langsung secara jelas tanpa mempersempit cakupan komunitas yang dimaksud penulis.
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: di dalam Anak-Nya
  rationale: Mempertahankan preposisi ἐν dan ungkapan teologis khas Yohanes bahwa hidup berada di dalam Sang Anak, tanpa menguranginya menjadi sekadar sarana.
- source_word: αὕτη ... αὕτη ἡ ζωή
  choice: inilah ... hidup itu
  rationale: Mempertahankan pengulangan demonstratif serta kaitan erat antara kesaksian dan hidup yang baru disebutkan.
theological_decisions:
- issue: Daya aspek aoristus ἔδωκεν dan kaitannya dengan kepemilikan hidup pada masa kini
  choice: “telah memberikan”
  alternative: “memberikan” atau “memberi”
  rationale: Pilihan ini menyatakan tindakan ilahi yang telah terlaksana dan hasilnya yang masih berlaku, tanpa menetapkan sistem doktrinal di luar pernyataan ayat.
- issue: Makna hidup yang berada ἐν τῷ υἱῷ αὐτοῦ
  choice: “di dalam Anak-Nya”
  alternative: “melalui Anak-Nya” atau “bersama Anak-Nya”
  rationale: Ungkapan sumber mempertahankan hubungan yang padat dan kaya antara hidup dan Sang Anak. Menggantinya dengan “melalui” akan menekankan sarana, sedangkan “bersama” akan melemahkan daya ἐν.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan pengulangan demonstratif, kesederhanaan verba “memberikan,” dan ungkapan teologis “di dalam Anak-Nya.” Kapitalisasi “Anak-Nya” menandai gelar kristologis dalam konteks.
