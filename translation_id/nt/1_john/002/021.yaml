base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/021.yaml
  text: I have not written to you because you do not know the truth[a], but because you do know it[b], and because no lie is from the truth.
translation:
  language: id
  text: Aku menulis kepada kalian[a] bukan karena kalian tidak mengetahui kebenaran, melainkan karena kalian mengetahuinya, dan karena tidak ada dusta yang berasal dari kebenaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Aku telah menulis kepada kalian.” Aoristus Yunani dapat diterjemahkan sebagai tindakan yang telah selesai; dalam konteks surat, “Aku menulis” juga idiomatis dalam bahasa Indonesia, yang lazim tidak menandai kala secara morfologis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: Aku menulis
  rationale: Aoristus epistoler ini secara alami dinyatakan dengan bentuk tak bertanda waktu dalam bahasa Indonesia, merujuk pada surat yang sedang ditulis dan kini diterima pembaca. Catatan kaki mempertahankan kemungkinan bentuk lampau atau perfektif.
- source_word: οἴδατε
  choice: kalian mengetahui
  rationale: Kata ini menyatakan pengetahuan yang dimiliki. Pengulangan dalam dua klausa dipertahankan agar pertentangan antara tidak mengetahui dan mengetahui tetap jelas.
- source_word: τὴν ἀλήθειαν / τῆς ἀληθείας
  choice: kebenaran
  rationale: Bahasa Indonesia tidak memiliki kata sandang tentu yang sepadan. 'Kebenaran' mempertahankan keluasan istilah Yohanes tanpa mempersempitnya menjadi pesan atau rumusan doktrinal tertentu.
- source_word: αὐτήν
  choice: -nya
  rationale: Akhiran pronominal ini secara alami merujuk kembali kepada 'kebenaran'.
- source_word: πᾶν ψεῦδος ... οὐκ ἔστιν
  choice: tidak ada dusta
  rationale: Susunan Yunani secara harfiah mendekati 'setiap dusta bukanlah', tetapi dalam konteks ini menyatakan negasi menyeluruh. 'Tidak ada dusta' merupakan ungkapan Indonesia yang jelas dan wajar.
- source_word: ἐκ τῆς ἀληθείας
  choice: yang berasal dari kebenaran
  rationale: ἐκ menunjukkan sumber atau asal. 'Berasal dari' menyampaikan hubungan itu dengan tepat dan alami.
theological_decisions:
- issue: Makna 'kebenaran' dalam pemakaian Yohanes
  choice: kebenaran
  alternative: pesan yang benar; kebenaran Injil
  rationale: Ayat ini tidak mempersempit rujukannya. Terjemahan mempertahankan keluasan dan kedalaman teologis istilah aslinya tanpa menambahkan penafsiran doktrinal.
- issue: Hubungan dusta dengan kebenaran
  choice: tidak ada dusta yang berasal dari kebenaran
  alternative: setiap dusta bukan dari kebenaran
  rationale: Terjemahan menyatakan sumber atau asal sebagaimana ditandai oleh ἐκ, tanpa mengubahnya menjadi pernyataan lain tentang tempat atau hakikat dusta.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan komunikatif. 'Kalian' dipakai untuk menandai bahwa penerimanya jamak. Struktur pertentangan dipertahankan, tetapi susunan negasinya dibuat alami dalam bahasa Indonesia.
