base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/012.yaml
  text: I am writing to you[a], little children[c][b], because your sins have been forgiven for the sake of his name.
translation:
  language: id
  text: Aku menulis kepada kalian[a], anak-anakku, karena dosa-dosa kalian telah diampuni demi nama-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Aku sedang menulis kepada kalian.” Bentuk kini Yunani dapat dipahami sebagai bentuk kini sederhana atau sebagai tindakan menulis yang sedang berlangsung.
    reason: lexical_alternative
  - marker: b
    text: Kata “-Nya” dapat dipahami merujuk kepada Allah atau kepada Yesus; teks Yunani tidak menyebutkan rujukannya secara eksplisit. Kata “karena” juga dapat diterjemahkan “bahwa,” sehingga frasa berikutnya menjadi isi yang dituliskan, bukan alasan untuk menulis.
    reason: alternative_reading
lexical_decisions:
- source_word: Γράφω
  choice: Aku menulis
  rationale: Bentuk kini Yunani dapat menyatakan tindakan surat yang sedang dilakukan atau ungkapan surat yang sederhana. Dalam bahasa Indonesia, “Aku menulis” alami dan tidak perlu memaksakan aspek progresif.
- source_word: τεκνία
  choice: anak-anakku
  rationale: Sapaan ini bernada akrab dan penuh kasih, bukan terutama menunjuk usia. Bentuk posesif dalam bahasa Indonesia menyampaikan hubungan kekeluargaan dan kelembutan secara wajar.
- source_word: ὅτι
  choice: karena
  rationale: Dalam rangkaian pernyataan pada bagian ini, ὅτι paling wajar dipahami sebagai pemberi alasan Yohanes menulis, meskipun secara gramatikal dapat pula memperkenalkan isi.
- source_word: ἀφέωνται
  choice: telah diampuni
  rationale: Bentuk perfektum pasif menunjukkan tindakan pengampunan yang telah terjadi dengan hasil yang tetap berlaku.
- source_word: αἱ ἁμαρτίαι ... ὑμῖν
  choice: dosa-dosa kalian
  rationale: Walaupun bahasa Yunani memakai artikel dan datif, konstruksi pengampunan secara alami menyatakan bahwa dosa yang dimaksud adalah dosa para penerima surat.
- source_word: διὰ τὸ ὄνομα αὐτοῦ
  choice: demi nama-Nya
  rationale: διά dengan akusatif menyatakan alasan atau dasar. “Demi nama-Nya” mempertahankan idiom alkitabiah dan bobot personal-teologis dari “nama” tanpa mereduksinya menjadi reputasi.
theological_decisions:
- issue: Rujukan αὐτοῦ dalam “nama-Nya”
  choice: Tetap dinyatakan dengan pronomina “-Nya” tanpa menyebut tokohnya dalam teks utama
  alternative: Allah atau Yesus Kristus
  rationale: Ayat ini sendiri tidak menyebut rujukannya secara eksplisit. Mempertahankan pronomina menjaga ambiguitas yang sungguh terdapat dalam teks.
- issue: Fungsi ὅτι
  choice: 'Dipahami sebagai pemberi alasan: “karena”'
  alternative: 'Dipahami sebagai pengantar isi: “bahwa”'
  rationale: Pola wacana ayat-ayat di sekitarnya lebih mendukung alasan penulisan, tetapi kemungkinan gramatikal lainnya layak dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi, hangat, dan bermartabat. “Aku” dipilih untuk mempertahankan suara surat yang akrab; “kalian” membedakan penerima jamak. Kapitalisasi “-Nya” mengikuti kebiasaan penerbitan Alkitab Indonesia, sambil membiarkan identitas rujukannya tetap tidak ditentukan.
