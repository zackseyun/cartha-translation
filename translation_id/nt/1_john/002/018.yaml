id: 1JN.2.18
reference: 1 John 2:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ⸀ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/018.yaml
  text: Children[a], it is the last hour, and just as you heard that antichrist is coming, even now many antichrists have arisen[b]. From this we know that it is the last hour.
translation:
  language: id
  text: Anak-anak, inilah saat terakhir. Sebagaimana kamu telah dengar bahwa antikristus[a] akan datang, bahkan sekarang banyak antikristus telah muncul[b]. Dari hal ini kita tahu bahwa inilah saat terakhir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “sang Antikristus.” Kata benda Yunani ini tidak memakai kata sandang; dalam bahasa Indonesia, bentuk dengan “sang” dapat dipakai untuk menyatakan sosok yang telah dikenal atau diharapkan.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan, “telah tampil” atau “telah datang.” Bentuk perfek Yunani menekankan bahwa banyak antikristus telah muncul dan kini ada.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδία
  choice: Anak-anakku
  rationale: Sapaan pastoral kepada komunitas pembaca. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan kehangatan relasional tanpa menyatakan bahwa para pembaca adalah anak-anak secara harfiah.
- source_word: ἐσχάτη ὥρα
  choice: saat terakhir
  rationale: Mempertahankan gambaran temporal-eskatologis teks tanpa menafsirkannya sebagai satu jam harfiah atau menetapkan skema akhir zaman tertentu.
- source_word: καθὼς ἠκούσατε
  choice: Seperti yang telah kamu dengar
  rationale: Menyatakan kesesuaian dengan pengajaran yang sebelumnya telah diterima para pembaca; bentuk perfektif Indonesia wajar untuk sesuatu yang telah didengar dan tetap diketahui.
- source_word: ἀντίχριστος
  choice: antikristus
  rationale: Mempertahankan istilah khas Yohanes dan ketiadaan artikel dalam bahasa Yunani, tanpa secara tegas mengubahnya menjadi gelar bagi satu tokoh tertentu.
- source_word: ἔρχεται
  choice: akan datang
  rationale: Mengungkapkan daya futuris dari bentuk kini Yunani dalam bahasa Indonesia yang alami.
- source_word: καὶ νῦν
  choice: bahkan sekarang
  rationale: Menonjolkan kontras antara kedatangan yang telah didengar dan kenyataan bahwa banyak antikristus sudah hadir.
- source_word: ἀντίχριστοι πολλοὶ
  choice: banyak antikristus
  rationale: Mempertahankan hubungan leksikal yang langsung antara bentuk tunggal dan jamak tanpa menambahkan penjelasan interpretatif.
- source_word: γεγόνασιν
  choice: telah muncul
  rationale: 'Menyampaikan verba perfek Yunani: mereka telah tampil dan kini ada. Alternatif ''telah bangkit'' dapat membawa nuansa kebangkitan yang tidak dimaksudkan.'
- source_word: ὅθεν γινώσκομεν
  choice: Dari hal ini kita tahu
  rationale: Mempertahankan hubungan inferensial dengan munculnya banyak antikristus sebagai bukti bagi pernyataan berikutnya.
theological_decisions:
- issue: Makna 'saat terakhir'
  choice: Mempertahankan ungkapan eskatologis secara terbuka sebagai 'saat terakhir'.
  alternative: Menafsirkannya secara eksplisit sebagai detik-detik menjelang akhir dunia atau hanya sebagai masa krisis retoris.
  rationale: Teks menunjuk pada tahap akhir yang menentukan, tetapi tidak menjelaskan durasi atau skema kronologisnya; terjemahan tidak boleh mempersempit ketegangan itu.
- issue: Hubungan antara 'antikristus' tunggal dan 'banyak antikristus'
  choice: Mempertahankan bentuk tunggal tanpa penentu lalu bentuk jamak dalam kalimat berikutnya.
  alternative: Menjadikan yang tunggal secara eksplisit 'sang Antikristus' sebagai tokoh individual tertentu, atau mereduksinya menjadi kategori umum saja.
  rationale: Yohanes sengaja menyandingkan antikristus yang akan datang dengan banyak antikristus yang telah muncul. Terjemahan mempertahankan penyandingan ini tanpa membangun kesimpulan eskatologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pastoral dan bermartabat. 'Anak-anakku' dipilih sebagai sapaan relasional yang lazim; 'kamu' dipakai sebagai bentuk jamak yang netral dalam bahasa Indonesia modern. Susunan kalimat dibagi agar alurnya jelas, sementara pengulangan 'saat terakhir' dan hubungan leksikal antikristus/antikristus tetap dipertahankan.
