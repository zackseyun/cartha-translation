base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/006.yaml
  text: The one who says he remains in him ought also to walk just as that one walked[a][b][c].
translation:
  language: id
  text: Orang yang berkata bahwa ia tetap tinggal di dalam Dia wajib juga hidup sama seperti Dia telah hidup.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tetap tinggal” menerjemahkan kata Yunani μένω, istilah penting dalam tulisan Yohanes yang dapat berarti tetap, tinggal, atau bertekun dalam suatu hubungan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berjalan sama seperti Dia telah berjalan.” “Berjalan” adalah metafora Alkitab untuk cara seseorang menjalani hidup. Kata Yunani yang diterjemahkan “Dia” berbentuk kata tunjuk yang memberi penekanan dan di sini merujuk kepada Yesus.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λέγων
  choice: Orang yang berkata
  rationale: Partisipel berartikel ini berfungsi sebagai nomina dan menunjuk secara umum kepada siapa pun yang membuat pengakuan tersebut. Bentuk ini mempertahankan struktur tunggal Yunani secara wajar dalam bahasa Indonesia.
- source_word: ἐν αὐτῷ μένειν
  choice: bahwa ia tetap tinggal di dalam Dia
  rationale: Infinitif μένειν menyatakan isi perkataan. 'Tetap tinggal' mengungkapkan unsur keberlanjutan dalam μένω dan mempertahankan ungkapan relasional 'di dalam Dia' yang khas dalam tulisan Yohanes.
- source_word: ὀφείλει
  choice: wajib
  rationale: Kata ὀφείλει menyatakan kewajiban moral. 'Wajib' tegas dan alami, tanpa menjadikannya kewajiban hukum.
- source_word: καθὼς
  choice: sama seperti
  rationale: Ungkapan ini menyatakan kesesuaian cara atau pola dan memperjelas bahwa kehidupan Yesus menjadi teladan pembanding.
- source_word: ἐκεῖνος
  choice: Dia
  rationale: Kata tunjuk maskulin ini dalam konteks merujuk kepada Yesus. Bahasa Indonesia tidak memiliki padanan pronominal alami bagi penekanan harfiah 'yang itu'; 'Dia' paling wajar, sedangkan nuansa kata tunjuk dijelaskan dalam catatan.
- source_word: περιεπάτησεν ... περιπατεῖν
  choice: telah hidup ... hidup
  rationale: Secara harfiah berarti 'berjalan', tetapi di sini merupakan metafora bagi cara menjalani hidup. 'Hidup' menyampaikan makna idiomatisnya dengan jelas dalam bahasa Indonesia modern; metafora aslinya dicatat.
- source_word: καὶ αὐτὸς
  choice: juga
  rationale: καί menyatakan kesejajaran tambahan, sedangkan αὐτός menegaskan subjek orang yang mengaku. Dalam susunan Indonesia, 'juga' menyampaikan hubungan itu secara alami.
theological_decisions:
- issue: Rujukan αὐτῷ dan ἐκεῖνος
  choice: Keduanya diterjemahkan dengan 'Dia' dan dipahami merujuk kepada Yesus berdasarkan konteks.
  alternative: Menggunakan 'dia' tanpa kapital, atau menerjemahkan ἐκεῖνος secara harfiah sebagai 'orang itu'.
  rationale: Konteks dekat menunjuk kepada Yesus sebagai pribadi yang di dalam-Nya seseorang mengaku tinggal dan sebagai teladan hidup. Kapitalisasi membantu kejelasan rujukan dalam kebiasaan bahasa Indonesia, bukan sebagai upaya menambahkan ajaran yang tidak terdapat dalam teks.
- issue: Metafora etis περιπατέω
  choice: Diterjemahkan 'hidup' dalam teks utama, dengan arti harfiah 'berjalan' dalam catatan.
  alternative: Mempertahankan 'berjalan' dalam teks utama.
  rationale: Yang dimaksud ialah cara hidup, bukan gerak jasmani. Pilihan 'hidup' mencegah salah paham bagi pembaca umum sambil mempertahankan citra sumber melalui catatan kaki.
- issue: Kekuatan kewajiban ὀφείλει
  choice: Diterjemahkan 'wajib'.
  alternative: '''seharusnya'' atau ''harus''.'
  rationale: '''Wajib'' mempertahankan tuntutan moral yang nyata tanpa mengubahnya menjadi pernyataan tentang syarat keselamatan atau kewajiban legal formal.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Terjemahan memilih ungkapan idiomatis 'hidup' untuk metafora περιπατέω, tetapi menjaga bentuk sumber dan penekanan Yohanes melalui catatan kaki. Kapitalisasi 'Dia' digunakan untuk memperjelas rujukan kepada Yesus sesuai konteks Indonesia.
