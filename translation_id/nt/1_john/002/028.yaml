base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/028.yaml
  text: And now[a], little children, remain in him, so that if he is revealed[c][b], we may have confidence and not shrink away from him in shame at his coming.
translation:
  language: id
  text: Dan sekarang, anak-anakku, tetaplah di dalam Dia, supaya apabila Dia dinyatakan[a], kita dapat memiliki keberanian dan tidak menjauh dari-Nya karena malu[b] pada saat kedatangan-Nya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dia tampak.” Kata kerja Yunaninya berbentuk pasif dan secara harfiah berarti “dinyatakan” atau “dibuat nyata.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tidak malu di hadapan-Nya.” Ungkapan ini juga dapat dipahami sebagai rasa malu dalam kehadiran-Nya, tanpa menekankan tindakan menjauh.'
    reason: alternative_reading
  - marker: c
    text: 'Atau: “kehadiran-Nya.” Dalam konteks ini, “kedatangan” mencerminkan arti eskatologis istilah Yunani tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ νῦν
  choice: Dan sekarang
  rationale: Menerjemahkan penghubung dan penanda waktu secara langsung serta wajar dalam bahasa Indonesia.
- source_word: τεκνία
  choice: anak-anakku
  rationale: Sapaan ini menyampaikan keakraban dan kasih pastoral dari bentuk diminutif Yunani tanpa memberi kesan bahwa para pembaca secara harfiah masih anak kecil.
- source_word: μένετε
  choice: tetaplah
  rationale: Mempertahankan gagasan keberlangsungan yang penting dalam tulisan Yohanes; bentuk perintahnya juga tersampaikan dengan jelas.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Mempertahankan metafora relasional khas Yohanes tanpa menjelaskannya secara berlebihan sebagai 'dalam persatuan dengan Dia'.
- source_word: ἐὰν φανερωθῇ
  choice: apabila Dia dinyatakan
  rationale: '''Apabila'' mempertahankan unsur ketidakpastian waktu tanpa menyiratkan keraguan bahwa peristiwa itu akan terjadi, sedangkan ''dinyatakan'' mempertahankan bentuk pasif verba Yunani.'
- source_word: σχῶμεν παρρησίαν
  choice: kita memiliki keberanian
  rationale: Menyampaikan keterbukaan dan keyakinan untuk menghadap-Nya; 'keberanian' alami dalam konteks ini dan tidak mengubahnya menjadi kepastian doktrinal yang lebih khusus.
- source_word: αἰσχυνθῶμεν ἀπ’ αὐτοῦ
  choice: tidak menjauh dari-Nya karena malu
  rationale: Menggabungkan makna rasa malu dengan daya preposisi ἀπό, yaitu gerak atau penarikan diri menjauh dari-Nya, tanpa menyiratkan bahwa Dia secara langsung mempermalukan mereka.
- source_word: παρουσίᾳ
  choice: kedatangan
  rationale: Dalam konteks eskatologis ini, istilah tersebut secara lazim menunjuk pada kedatangan Kristus, sementara arti yang lebih harfiah, 'kehadiran', dicatat dalam catatan kaki.
theological_decisions:
- issue: Rujukan kata ganti dan penyataan eskatologis
  choice: Kata ganti merujuk kepada Anak, yaitu Yesus Kristus, dan ayat ini berbicara tentang penyataan serta kedatangan-Nya kelak.
  alternative: Kata ganti dapat dipahami secara lebih umum sebagai rujukan kepada Allah tanpa menentukan Sang Anak.
  rationale: Konteks dekat 1 Yohanes 2 berpusat pada tetap tinggal di dalam Anak dan pada saat Dia dinyatakan. Terjemahan tidak menambahkan nama 'Yesus Kristus' ke dalam ayat, tetapi kapitalisasi kata ganti mengikuti rujukan kontekstual tersebut.
- issue: Nuansa ungkapan malu pada kedatangan Kristus
  choice: Ungkapan itu menggambarkan kemungkinan orang menjauh dari-Nya karena malu, bukan secara eksplisit penghukuman akhir.
  alternative: Ungkapan itu dapat dipahami lebih sederhana sebagai 'malu di hadapan-Nya'.
  rationale: Gabungan αἰσχυνθῶμεν dan ἀπ’ αὐτοῦ mendukung nuansa menjauh atau menarik diri karena malu, tetapi teks tidak dengan sendirinya menyatakan vonis penghukuman.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan bermartabat. 'Anak-anakku' dipilih sebagai sapaan pastoral yang alami; 'tetaplah di dalam Dia' mempertahankan metafora khas Yohanes; dan susunan kalimat dijaga cukup dekat dengan struktur Yunani tanpa menjadi kaku.
