id: 1JN.2.4
reference: 1 John 2:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ λέγων ⸀ὅτι Ἔγνωκα αὐτὸν καὶ τὰς ἐντολὰς αὐτοῦ μὴ τηρῶν ψεύστης ἐστίν, καὶ ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/004.yaml
  text: The one who says[a], “I have come to know him,” and does not keep his commandments is a liar[b], and the truth is not in him.
translation:
  language: id
  text: Orang yang berkata, “Aku telah mengenal Dia,” tetapi tidak menaati perintah-perintah-Nya adalah seorang pendusta, dan kebenaran tidak ada di dalam dirinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ λέγων
  choice: Orang yang berkata
  rationale: Partisipel kini dengan artikel berfungsi sebagai nomina dan menunjuk secara umum kepada siapa pun yang membuat pengakuan tersebut; bentuk ini alami dan tidak menambahkan penekanan gender.
- source_word: Ἔγνωκα
  choice: Aku telah mengenal
  rationale: Bentuk perfektum γινώσκω menyatakan pengenalan yang telah terjadi dengan keadaan yang masih berlangsung. 'Telah mengenal' mempertahankan aspek itu tanpa membuat bahasa Indonesia terasa berlebihan.
- source_word: αὐτὸν / αὐτοῦ
  choice: Dia / -Nya
  rationale: Pronomina dipertahankan tanpa menyebut referennya secara lebih khusus. Huruf kapital mengikuti kebiasaan bahasa Indonesia untuk pronomina yang merujuk kepada Allah.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: perintah-perintah-Nya
  rationale: Bentuk jamak dipertahankan secara eksplisit, dan 'perintah' merupakan padanan modern yang wajar bagi ἐντολή.
- source_word: μὴ τηρῶν
  choice: tidak menaati
  rationale: Dalam konteks perintah, τηρέω berarti menjalankan atau mematuhi. 'Menaati' mengungkapkan makna idiomatisnya dengan lebih jelas daripada 'memelihara' dalam bahasa Indonesia modern; partisipel kini menunjukkan pola hidup yang tidak taat.
- source_word: ψεύστης
  choice: seorang pendusta
  rationale: Nomina predikatif diterjemahkan sebagai sebutan pribadi yang tegas, bukan sekadar sifat 'bohong'.
- source_word: ἐν τούτῳ
  choice: di dalam dirinya
  rationale: Demonstrativa datif ini secara alami merujuk kembali kepada orang yang baru disebut; ungkapan tersebut mempertahankan citra keberadaan batiniah dari teks Yunani.
- source_word: ἡ ἀλήθεια οὐκ ἔστιν
  choice: kebenaran tidak ada
  rationale: Terjemahan langsung ini mempertahankan keluasan makna 'kebenaran' dalam tulisan Yohanes, baik segi faktual maupun moral-rohaninya.
theological_decisions:
- issue: Referen αὐτόν / αὐτοῦ
  choice: Pronomina 'Dia / -Nya' dipertahankan tanpa menyebut 'Allah' atau 'Kristus'.
  alternative: Menjelaskan referennya sebagai Allah atau, secara lebih khusus, Kristus.
  rationale: Konteks terdekat paling mungkin menunjuk kepada Allah, tetapi hubungan erat antara Allah dan Anak dalam surat ini membuat penyebutan eksplisit berisiko menutup ketegangan yang memang ada dalam teks.
- issue: Daya makna bahasa 'mengenal' dalam Yohanes
  choice: '''telah mengenal'' sebagai pengenalan yang sudah terjadi dan tetap berlaku'
  alternative: '''mengenal'' sebagai keadaan kini tanpa penandaan aspek perfektum'
  rationale: Bentuk perfektum mendukung keadaan kini sebagai hasil proses mengenal sebelumnya. Terjemahan ini mempertahankan nuansa relasional tanpa menambahkan gagasan mistis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Pendusta' dipilih karena tegas dan sesuai register Kitab Suci, sedangkan 'menaati' memberi makna yang segera jelas bagi pembaca masa kini. Tidak diperlukan catatan kaki karena alternatif yang ada tidak cukup memengaruhi makna untuk publikasi ayat ini.
