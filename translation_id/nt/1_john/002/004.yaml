  source_fidelity: 'Terjemahan secara akurat mencerminkan struktur dan makna Yunani: subjek generik, pengakuan dalam bentuk orang pertama, klaim mengenal yang beraspek perfektum, kegagalan menaati perintah-perintah, predikat «pendusta», serta pernyataan bahwa kebenaran tidak ada dalam orang itu. «Tetapi» menyampaikan kontras yang tersirat secara wajar, tanpa mengubah makna καί.'
  naturalness: Bahasa Indonesia baku, jelas, dan mengalir alami. «Orang yang berkata» dan «tidak menaati perintah-perintah-Nya» sesuai register modern yang bermartabat. «Di dalam dirinya» merupakan pengungkapan yang idiomatis dan mempertahankan cakupan batiniah dari ἐν τούτῳ.
  terminology: «Mengenal», «perintah-perintah-Nya», «menaati», «pendusta», dan «kebenaran» adalah padanan yang tepat dan konsisten dengan istilah Yohanes. Pronomina «Dia/-Nya» dengan kapitalisasi konvensional Indonesia tidak mempersempit referen yang sengaja dibiarkan berupa pronomina dalam teks sumber.
