id: 1JN.2.14
reference: 1 John 2:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα· ἔγραψα ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· ἔγραψα ὑμῖν, νεανίσκοι, ὅτι ἰσχυροί ἐστε καὶ ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει καὶ νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/014.yaml
  text: I have written to you[a], children, because you have known the Father. I have written to you, fathers, because you have known him who is from the beginning. I have written to you, young men, because you are strong, and the word of God remains in you[c][b], and you have overcome the evil one.
translation:
  language: id
  text: Telah kutulis kepada kamu[a], anak-anak, karena kamu telah mengenal Bapa. Telah kutulis kepada kamu, para bapak, karena kamu telah mengenal Dia yang dari sejak semula[b]. Telah kutulis kepada kamu, para pemuda, karena kamu kuat, firman Allah tinggal di dalam kamu[c], dan kamu telah mengalahkan si jahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Kutulis kepada kamu,” pada ketiga kemunculannya dalam ayat ini. Bentuk aoristus Yunani dapat dipahami sebagai lampau sederhana, sedangkan “telah kutulis” menonjolkan tindakan yang sudah dilakukan dan tetap relevan bagi penerima surat.
    reason: lexical_alternative
  - marker: b
    text: “Dia yang dari sejak semula” kemungkinan besar menunjuk kepada Anak yang telah ada sebelumnya dalam pemakaian khas Yohanes, tetapi ayat ini tidak menyebutkan identitas-Nya secara eksplisit.
    reason: alternative_reading
  - marker: c
    text: Atau, “tetap tinggal di dalam kamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: telah kutulis
  rationale: Bentuk aoristus menyatakan tindakan menulis yang telah dilakukan. Ungkapan ini alami dalam bahasa Indonesia, mempertahankan relevansinya bagi pembaca surat, dan menjaga pola retoris yang diulang tiga kali.
- source_word: παιδία
  choice: anak-anak
  rationale: Mempertahankan sapaan kekeluargaan tanpa menambahkan nuansa seperti 'yang terkasih' yang tidak dinyatakan secara eksplisit.
- source_word: ἐγνώκατε
  choice: kamu telah mengenal
  rationale: Bentuk perfek menunjukkan pengenalan yang telah terjadi dan tetap berlaku; 'telah mengenal' menyampaikan aspek tersebut dengan wajar.
- source_word: τὸν πατέρα
  choice: Bapa
  rationale: Dalam konteks Yohanes, kata ini merupakan sebutan ilahi bagi Allah; huruf kapital menandai pemakaian sebagai gelar.
- source_word: πατέρες
  choice: para bapak
  rationale: Menerjemahkan bentuk maskulin jamak secara langsung dan mempertahankan susunan tiga kelompok dalam ayat ini tanpa menafsirkannya hanya sebagai golongan usia.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: Dia yang ada sejak semula
  rationale: Menyampaikan ungkapan berartikel yang menunjuk kepada pribadi tertentu, sekaligus tidak menyebutkan identitas yang tidak dinyatakan secara eksplisit dalam teks.
- source_word: νεανίσκοι
  choice: para pemuda
  rationale: Padanan Indonesia yang alami bagi bentuk maskulin jamak dan mempertahankan kontras dengan 'anak-anak' serta 'para bapak'.
- source_word: ἰσχυροί
  choice: kuat
  rationale: Padanan langsung dan alami dalam konteks kekuatan rohani dan moral.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: firman Allah
  rationale: Ungkapan baku dan mudah dipahami yang tetap membuka apakah acuannya adalah pesan Allah secara umum atau berita Injil secara khusus.
- source_word: μένει
  choice: tinggal
  rationale: Meneruskan nuansa duratif dari istilah penting dalam tulisan Yohanes dengan bahasa Indonesia yang alami; 'tetap tinggal' juga mungkin.
- source_word: νενικήκατε
  choice: kamu telah mengalahkan
  rationale: Bentuk perfek menyatakan kemenangan yang telah dicapai dan masih memiliki akibat; ungkapan ini alami dalam bahasa Indonesia.
- source_word: τὸν πονηρόν
  choice: si jahat
  rationale: Artikel dan bentuk maskulin menunjuk paling wajar kepada pribadi, bukan kejahatan abstrak; 'si jahat' mempertahankan acuan personal tanpa menambahkan nama.
theological_decisions:
- issue: Acuan 'Dia yang ada sejak semula'
  choice: Identitasnya dibiarkan tersirat sebagai 'Dia yang ada sejak semula'.
  alternative: Menyebutnya secara eksplisit sebagai Kristus/Anak, atau memahaminya secara umum sebagai Allah.
  rationale: Pemakaian dalam tulisan Yohanes sangat mungkin menunjuk kepada Anak yang telah ada sebelumnya, tetapi teks ayat ini sendiri tidak menamai-Nya. Terjemahan mempertahankan ketakterangan tersebut.
- issue: Jenis kelamin kelompok-kelompok yang disapa
  choice: παιδία diterjemahkan 'anak-anak', sedangkan πατέρες dan νεανίσκοι diterjemahkan 'para bapak' dan 'para pemuda'.
  alternative: Menetralkan semua sapaan sebagai kelompok tahap kedewasaan rohani bagi seluruh jemaat.
  rationale: Teks Yunani memakai istilah umum bagi kelompok pertama dan istilah maskulin bagi dua kelompok berikutnya. Terjemahan mempertahankan bentuk-bentuk itu tanpa menetapkan apakah pembagiannya harfiah, metaforis, atau representatif.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat, dengan sapaan langsung yang tetap mudah dipahami. Bentuk ringkas 'telah kutulis' dipilih untuk menjaga irama pengulangan; 'para bapak' dan 'para pemuda' mempertahankan bentuk maskulin sumber tanpa menjadi kaku.
