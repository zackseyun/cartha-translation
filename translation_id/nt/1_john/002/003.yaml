lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Dengan inilah
  rationale: Ungkapan ini secara alami menyatakan dasar atau bukti yang melaluinya sesuatu diketahui, sekaligus mempertahankan daya tunjuk τούτῳ.
- source_word: γινώσκομεν
  choice: kita tahu
  rationale: Bentuk kini menunjukkan pengenalan atau kepastian yang sedang berlaku; 'kita tahu' merupakan padanan Indonesia yang wajar.
- source_word: ὅτι ἐγνώκαμεν αὐτόν
  choice: bahwa kita telah mengenal Dia
  rationale: Bentuk perfektum menyatakan pengenalan yang telah terjadi dan hasilnya masih berlaku. 'Telah mengenal' mempertahankan aspek itu tanpa membuat bahasa Indonesia terasa kaku.
- source_word: αὐτόν
  choice: Dia
  rationale: Kata ganti dipertahankan agar terjemahan tidak menentukan rujukannya sebagai Allah atau Kristus secara lebih sempit daripada teks Yunani.
- source_word: ἐὰν
  choice: jika
  rationale: Padanan langsung dan alami untuk penanda syarat yang memperkenalkan bukti atau pengujian.
- source_word: ἐντολάς
  choice: perintah-perintah
  rationale: Pilihan ini mempertahankan bobot moral ἐντολή dan lebih alami dalam bahasa Indonesia modern daripada istilah yang dapat terdengar terlalu teknis.
- source_word: τηρῶμεν
  choice: kita menaati
  rationale: Dalam konteks perintah, 'menaati' menyampaikan tindakan memegang dan menjalankan perintah secara lebih alami daripada 'menjaga', tanpa mengurangi gagasan ketaatan yang terkandung dalam τηρέω.
theological_decisions:
- issue: Rujukan αὐτόν ('Dia')
  choice: Mempertahankan kata ganti 'Dia' tanpa menyebut Allah atau Yesus secara eksplisit.
  alternative: Menuliskan 'Allah' atau 'Yesus/Kristus'.
  rationale: Teks Yunani memakai kata ganti, sedangkan konteks 1 Yohanes menghubungkan pengenalan akan Allah dan relasi dengan Sang Anak secara erat. Mempertahankan kata ganti menjaga ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'Dengan inilah' mempertahankan corak Yohanes, sementara 'menaati perintah-perintah-Nya' terdengar alami bagi pembaca umum.
