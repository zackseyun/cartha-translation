id: 1JN.2.11
reference: 1 John 2:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ μισῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῇ σκοτίᾳ ἐστὶν καὶ ἐν τῇ σκοτίᾳ περιπατεῖ, καὶ οὐκ οἶδεν ποῦ ὑπάγει, ὅτι ἡ σκοτία ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/011.yaml
  text: But the one who hates his brother is in the darkness and walks in the darkness[a], and does not know where he is going, because the darkness has blinded his eyes.
translation:
  language: id
  text: Namun, orang yang membenci saudaranya[a] berada dalam kegelapan dan berjalan dalam kegelapan, dan ia tidak tahu ke mana ia pergi, karena kegelapan itu telah membutakan matanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saudara laki-laki atau perempuan”; teks Yunani memakai kata “saudara laki-laki” dan kemungkinan besar merujuk kepada sesama orang percaya dalam komunitas Kristen.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: yang membenci
  rationale: Partisipel kini dengan artikel berfungsi sebagai nomina dan menggambarkan sikap yang menjadi ciri orang tersebut; bentuk ini alami dalam bahasa Indonesia.
- source_word: ἀδελφὸν
  choice: saudaranya
  rationale: Mempertahankan bentuk tunggal dan bahasa kekerabatan dari teks Yunani; dalam konteks Yohanes, kemungkinan besar menunjuk kepada sesama anggota komunitas orang percaya.
- source_word: ἐν τῇ σκοτίᾳ
  choice: di dalam kegelapan
  rationale: Mempertahankan metafora teologis serta pengulangannya; 'di dalam' menonjolkan kegelapan sebagai ranah tempat orang itu berada dan berjalan.
- source_word: περιπατεῖ
  choice: berjalan
  rationale: Mempertahankan metafora alkitabiah tentang cara hidup dan tindakan, alih-alih meratakannya menjadi 'hidup' atau 'berperilaku'.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: tidak tahu ke mana ia pergi
  rationale: Ungkapan Indonesia yang alami dan tetap mempertahankan gambaran gerak serta ketidaktahuan mengenai arah tujuan.
- source_word: ἐτύφλωσεν
  choice: telah membutakan
  rationale: Menyatakan tindakan yang sudah terjadi dengan akibat yang tetap berlaku dalam keadaan orang tersebut sekarang.
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: matanya
  rationale: Padanan posesif Indonesia yang wajar dan mempertahankan gambaran konkret tentang mata.
theological_decisions:
- issue: Makna moral-rohani kegelapan dalam dualisme Yohanes
  choice: Menerjemahkan σκοτία secara metaforis sebagai 'kegelapan'.
  alternative: kejahatan; kegelapan dosa
  rationale: Metafora Yohanes sengaja membawa kedalaman moral dan teologis serta berlawanan dengan terang; tafsiran yang lebih sempit tidak dimasukkan ke dalam teks.
- issue: Rujukan 'saudara'
  choice: Mempertahankan 'saudaranya' dalam teks utama.
  alternative: saudara atau saudarinya; sesama orang percaya
  rationale: Teks sumber memakai nomina maskulin tunggal, kemungkinan dengan daya rujuk representatif kepada sesama orang percaya. Catatan kaki menjelaskan cakupan yang mungkin tanpa meniadakan bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pengulangan 'di dalam kegelapan' dipertahankan untuk mencerminkan penekanan teks Yunani, dan pronomina 'ia' dipakai agar alurnya jelas.
