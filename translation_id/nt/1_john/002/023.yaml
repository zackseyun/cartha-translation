base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/023.yaml
  text: Everyone who denies the Son does not have the Father either[a]; whoever confesses the Son has the Father also.
translation:
  language: id
  text: Setiap orang yang menyangkal Anak juga tidak memiliki Bapa; siapa yang mengakui Anak juga memiliki Bapa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sebagian naskah tidak memuat: “siapa yang mengakui Anak juga memiliki Bapa.”'
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ ἀρνούμενος
  choice: Setiap orang yang menyangkal
  rationale: Partisipel kini berartikel berfungsi sebagai nomina dengan cakupan umum. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan cakupan universalnya.
- source_word: ἀρνούμενος
  choice: menyangkal
  rationale: Dalam konteks pengakuan iman, ἀρνέομαι berarti menyangkal atau tidak mengakui. 'Menyangkal' mempertahankan keterkaitan leksikal dan teologis tanpa memperluas makna menjadi sekadar menolak.
- source_word: τὸν υἱὸν
  choice: Anak
  rationale: Teks Yunani hanya menyebut 'Anak' sebagai gelar kristologis tertentu. Penambahan 'Allah' tidak diperlukan dan tidak terdapat dalam klausa ini.
- source_word: οὐδὲ
  choice: tidak ... juga
  rationale: 'Susunan ini secara idiomatis meneruskan penyangkalan kepada Bapa: orang tersebut tidak memiliki Bapa juga.'
- source_word: τὸν πατέρα ἔχει
  choice: memiliki Bapa
  rationale: Terjemahan ini mempertahankan verba ἔχω secara langsung. Implikasi relasionalnya tetap terbuka dan tidak dipersempit menjadi 'bersekutu dengan' atau 'menjadi milik'.
- source_word: ὁ ὁμολογῶν
  choice: siapa yang mengakui
  rationale: Partisipel kini substantival ini menyatakan siapa pun yang secara terbuka mengakui Anak. 'Mengakui' alami dalam bahasa Indonesia dan sesuai dengan konteks pengakuan iman.
- source_word: καὶ
  choice: juga
  rationale: Dalam paralel antitetis ini, 'juga' menampilkan hubungan yang sepadan dengan οὐδὲ pada klausa pertama.
theological_decisions:
- issue: Klausa kedua diberi tanda variasi dalam teks Yunani tercetak
  choice: Klausa 'siapa yang mengakui Anak memiliki Bapa juga' dimasukkan dalam teks utama.
  alternative: Menghilangkan klausa kedua karena tidak terdapat dalam sebagian naskah.
  rationale: SBLGNT yang diberikan mencantumkan klausa tersebut, meskipun dengan tanda bahwa terdapat variasi tekstual. Karena itu klausa diterjemahkan dalam teks utama dan variasinya dicatat dalam catatan kaki.
- issue: Daya relasional ungkapan 'memiliki Bapa'
  choice: Mempertahankan ungkapan 'memiliki Bapa' tanpa parafrasa.
  alternative: Menerjemahkannya sebagai 'bersekutu dengan Bapa' atau 'menjadi milik Bapa'.
  rationale: Ungkapan Yohanes ini memuat klaim teologis yang kuat tentang hubungan Anak dan Bapa. Terjemahan harfiah mempertahankan keluasan serta ketegangannya tanpa menetapkan satu tafsiran relasional tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'Anak' dan 'Bapa' dikapitalisasi sebagai gelar ilahi dalam konteks ini. Struktur antitetis ayat dipertahankan dengan susunan yang ringkas dan mudah dipahami.
