base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/009.yaml
  text: The one who says he is in the light and hates his brother is in the darkness until now[a].
translation:
  language: id
  text: Orang yang berkata bahwa ia berada dalam terang dan membenci saudaranya masih berada dalam kegelapan sampai sekarang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang dipakai berbentuk tunggal maskulin, “saudara laki-laki.” Dalam konteks etis ini, bentuk tersebut dapat dipakai secara representatif dan mencakup saudara perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Orang yang berkata
  rationale: Artikel dengan partisipel kini berfungsi sebagai nomina dan menunjuk kepada seseorang secara representatif; ungkapan ini mempertahankan struktur Yunani secara wajar dalam bahasa Indonesia.
- source_word: ἐν τῷ φωτὶ εἶναι
  choice: bahwa ia berada di dalam terang
  rationale: Klausa infinitif sesudah verba 'berkata' dinaturalkan menjadi klausa dengan 'bahwa'; 'di dalam terang' mempertahankan gambaran ruang metaforis khas Yohanes.
- source_word: καί
  choice: tetapi
  rationale: Walaupun secara leksikal berarti 'dan', dalam konteks ini konjungsi menghubungkan pengakuan dengan perilaku yang berlawanan; 'tetapi' menyatakan hubungan pragmatis tersebut secara alami tanpa mengubah isi.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: saudaranya
  rationale: Kata Indonesia 'saudara' mempertahankan hubungan persaudaraan dan dapat digunakan secara representatif tanpa memaksakan tafsiran 'sesama orang percaya' ke dalam teks utama.
- source_word: μισῶν
  choice: membenci
  rationale: Partisipel kini menyatakan sikap yang sedang berlangsung atau berciri tetap; bentuk ini alami setelah subjek yang sama dalam bahasa Indonesia.
- source_word: ἐν τῇ σκοτίᾳ ἐστίν
  choice: masih berada di dalam kegelapan
  rationale: '''Berada di dalam kegelapan'' menjaga kesejajaran dengan ''di dalam terang''; ''masih'' menyampaikan keberlanjutan keadaan yang diperjelas oleh ἕως ἄρτι.'
- source_word: ἕως ἄρτι
  choice: sampai sekarang
  rationale: Terjemahan langsung dan alami yang mempertahankan penekanan temporal bahwa keadaan itu berlanjut hingga saat ini.
theological_decisions:
- issue: Cakupan ἀδελφός dalam pernyataan etis representatif
  choice: saudaranya
  alternative: saudara laki-lakinya; saudara seimannya
  rationale: '''Saudaranya'' secara leksikal dekat dengan bahasa sumber dan dalam bahasa Indonesia dapat mencakup saudara dalam pengertian komunitas tanpa menentukan secara berlebihan apakah yang dimaksud saudara kandung atau sesama orang percaya.'
- issue: Hubungan antara pengakuan berada dalam terang dan kebencian
  choice: tetapi
  alternative: dan
  rationale: Bahasa Yunani memakai καί, tetapi pertentangan semantisnya jelas. Bahasa Indonesia lazim memakai 'tetapi' untuk membuat hubungan itu terang, sementara ketegangan teologis antara pengakuan dan keadaan nyata tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada sederhana dan bermartabat. Pengulangan 'berada di dalam' mempertahankan kesejajaran terang-kegelapan khas Yohanes; 'masih ... sampai sekarang' dibuat idiomatis sekaligus menegaskan keberlanjutan.
