id: 1JN.2.16
reference: 1 John 2:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ ἐν τῷ κόσμῳ, ἡ ἐπιθυμία τῆς σαρκὸς καὶ ἡ ἐπιθυμία τῶν ὀφθαλμῶν καὶ ἡ ἀλαζονεία τοῦ βίου, οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/016.yaml
  text: For everything in the world—the desire of the flesh[a], the desire of the eyes, and the pride of life—is not from the Father[c][b], but is from the world.
translation:
  language: id
  text: Sebab semua yang ada di dalam dunia—keinginan daging[a], keinginan mata, dan keangkuhan hidup[b]—bukan berasal dari Bapa, melainkan dari dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nafsu daging.” Kata Yunani yang diterjemahkan “keinginan” dapat berarti keinginan kuat, hasrat, atau nafsu; “daging” di sini juga dapat dipahami secara metaforis sebagai tabiat manusia yang berdosa.
    reason: lexical_alternative
  - marker: b
    text: Atau “kesombongan dalam kehidupan” atau “keangkuhan atas apa yang dimiliki untuk hidup.” Frasa ini dapat mencakup kebanggaan akan kedudukan, harta, atau cara hidup seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Menghubungkan ayat ini sebagai alasan bagi larangan sebelumnya, sambil mempertahankan daya kausalnya.
- source_word: πᾶν τὸ ἐν τῷ κόσμῳ
  choice: semua yang ada di dalam dunia
  rationale: Konstruksi netral tunggal ini bersifat kolektif; ungkapan tersebut alami dan mempertahankan cakupan menyeluruh.
- source_word: κόσμῳ / κόσμου
  choice: dunia
  rationale: Mempertahankan istilah sumber tanpa mempersempitnya menjadi penafsiran seperti 'sistem dunia'.
- source_word: ἐπιθυμία
  choice: keinginan
  rationale: Istilah ini dapat menunjuk pada keinginan kuat yang negatif dalam konteks ini; 'keinginan' tidak membatasinya pada nafsu seksual.
- source_word: τῆς σαρκὸς
  choice: daging
  rationale: Padanan formal ini mempertahankan metafora dan ketegangan teologis σάρξ tanpa menafsirkannya langsung sebagai 'tabiat berdosa'.
- source_word: τῶν ὀφθαλμῶν
  choice: mata
  rationale: Padanan langsung yang mempertahankan bentuk jamak secara kolektif dan terdengar alami dalam bahasa Indonesia.
- source_word: ἀλαζονεία τοῦ βίου
  choice: keangkuhan hidup
  rationale: ἀλαζονεία menyatakan kesombongan atau pretensi yang membanggakan diri, sedangkan βίος dapat mencakup keadaan, sarana, dan cara hidup; bentuk ringkas ini mempertahankan keluasan frasa.
- source_word: οὐκ ἔστιν ἐκ τοῦ πατρός
  choice: bukan berasal dari Bapa
  rationale: ἐκ menandai sumber atau asal; 'berasal dari' menyatakannya dengan jelas dalam bahasa Indonesia.
- source_word: ἀλλὰ ἐκ τοῦ κόσμου ἐστίν
  choice: melainkan dari dunia
  rationale: Mempertahankan kontras asal antara Bapa dan dunia dengan susunan Indonesia yang alami.
theological_decisions:
- issue: Makna σάρξ dalam daftar yang bernuansa moral
  choice: daging
  alternative: tabiat berdosa
  rationale: Terjemahan 'daging' menjaga metafora sumber dan tidak mengunci frasa pada satu sistem antropologi tertentu; kemungkinan makna metaforis dijelaskan dalam catatan.
- issue: Makna κόσμος
  choice: dunia
  alternative: tatanan dunia yang jatuh dalam dosa
  rationale: Teks membedakan asal dari Bapa dan asal dari dunia. Padanan sederhana mempertahankan keluasan istilah Yunani dan membiarkan konteks menjelaskan nuansa moralnya.
- issue: Cakupan ἀλαζονεία τοῦ βίου
  choice: keangkuhan hidup
  alternative: kesombongan atas harta dan kedudukan
  rationale: Frasa Yunani dapat mencakup kebanggaan yang dipamerkan mengenai status, milik, sarana, atau cara hidup; teks utama tidak mempersempit cakupan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur tiga unsur dipertahankan, dengan tanda pisah untuk memperjelas bahwa ketiganya menguraikan 'semua yang ada di dalam dunia'. Istilah 'Bapa' memakai huruf kapital karena merujuk kepada Allah.
