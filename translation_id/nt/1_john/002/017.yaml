  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὁ κόσμος παράγεται καὶ ἡ ἐπιθυμία αὐτοῦ, ὁ δὲ ποιῶν τὸ θέλημα τοῦ θεοῦ μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/017.yaml
  text: And the world is passing away[a], along with its desire[b], but the one who does the will of God remains forever.
translation:
  language: id
  text: Dunia ini sedang berlalu, demikian juga keinginannya,[a] tetapi orang yang melakukan kehendak Allah tetap ada selama-lamanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan "keinginan" juga dapat diterjemahkan "hasrat" atau "hawa nafsu". Dalam konteks ini, kata tersebut mencakup berbagai keinginan dunia yang menyimpang, bukan hanya nafsu seksual.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan "tetap ada" juga dapat diterjemahkan "tetap tinggal" atau "bertahan"; kata ini penting dalam tulisan-tulisan Yohanes untuk menyatakan keberlangsungan yang tetap.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: dunia ini
  rationale: Dalam konteks 1 Yohanes 2:15–16, kata ini menunjuk pada dunia manusia beserta tata nilai yang menentang Allah, bukan sekadar ciptaan fisik. Frasa umum "dunia ini" mempertahankan keluasan maknanya tanpa memasukkan tafsiran panjang ke dalam teks.
- source_word: παράγεται
  choice: sedang berlalu
  rationale: Bentuk kini menyampaikan proses yang tengah berlangsung dan sifat dunia yang tidak tetap. "Sedang berlalu" mengungkapkan aspek duratif itu secara alami dalam bahasa Indonesia.
- source_word: ἐπιθυμία
  choice: keinginan
  rationale: Kata ini menyatakan hasrat yang kuat dan dalam konteks ini bernilai negatif. "Keinginan" cukup luas sehingga tidak mempersempit maknanya menjadi nafsu seksual saja; konteks ayat sebelumnya menunjukkan sifatnya yang menyimpang.
- source_word: αὐτοῦ
  choice: -nya
  rationale: Pronomina ini merujuk kepada κόσμος. Akhiran "-nya" secara alami menyatakan bahwa keinginan tersebut menjadi ciri atau milik dunia itu.
- source_word: ὁ δὲ ποιῶν
  choice: tetapi orang yang melakukan
  rationale: Partisipel bersubstantiva menunjuk pada seseorang yang dicirikan oleh tindakan melakukan kehendak Allah. Bentuk ini mempertahankan cakupan representatif tunggal dengan bahasa Indonesia yang wajar.
- source_word: θέλημα τοῦ θεοῦ
  choice: kehendak Allah
  rationale: '"Kehendak" merupakan padanan yang alami dan berbobot bagi θέλημα serta mempertahankan gagasan tentang maksud atau kemauan Allah yang ditaati.'
- source_word: μένει
  choice: tetap ada
  rationale: Kata μένω menyatakan keberlangsungan atau keberadaan yang terus bertahan. "Tetap ada" jelas bagi pembaca modern dan tidak memakai diksi gerejawi yang kurang umum seperti "tinggal tetap".
- source_word: εἰς τὸν αἰῶνα
  choice: selama-lamanya
  rationale: Ungkapan idiomatis ini dalam konteks menyatakan keberlangsungan tanpa akhir. "Selama-lamanya" menyampaikan maknanya secara alami dan khidmat.
theological_decisions:
- issue: Makna κόσμος dalam konteks Yohanes
  choice: dunia sebagai tatanan manusia yang fana dan menentang Allah
  alternative: dunia ciptaan secara fisik
  rationale: Konteks langsung, khususnya 2:15–16, menggambarkan dunia melalui keinginan dan keangkuhannya. Namun teks utama tetap memakai istilah luas "dunia" agar terjemahan tidak mempersempit makna secara berlebihan.
- issue: Daya ungkap μένει εἰς τὸν αἰῶνα
  choice: keberadaan orang yang melakukan kehendak Allah berlanjut selama-lamanya
  alternative: pernyataan teknis yang dijabarkan sebagai doktrin kehidupan kekal
  rationale: Bahasa Yunani menegaskan keberlangsungan yang kekal, tetapi tidak menjelaskan mekanisme doktrinalnya dalam ayat ini. Terjemahan mempertahankan bobot teologis tersebut tanpa menambahkan uraian yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan lugas. Susunan kontras antara dunia yang sedang berlalu dan orang taat yang tetap ada dipertahankan. "Demikian juga" memperjelas bahwa keinginan dunia turut berlalu tanpa mengubah hubungan sintaksis sumber.
