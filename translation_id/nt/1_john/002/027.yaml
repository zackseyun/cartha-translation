revisions:
- from: Namun, bagi kalian, pengurapan yang telah kalian terima dari Dia tetap tinggal di dalam kalian. Kalian tidak memerlukan siapa pun untuk mengajar kalian. Sebaliknya, pengurapan dari-Nya mengajar kalian tentang segala sesuatu; pengurapan itu benar dan bukan dusta. Sebagaimana pengurapan itu telah mengajar kalian, tetaplah tinggal di dalam Dia.[a][b]
  to: Dan kalian, pengurapan yang telah kalian terima dari Dia tetap tinggal dalam diri kalian, dan kalian tidak memerlukan siapa pun untuk mengajar kalian. Tetapi sebagaimana pengurapan-Nya mengajar kalian tentang segala sesuatu, dan pengurapan itu benar serta bukan dusta, sebagaimana pengurapan itu telah mengajar kalian, tetaplah tinggal di dalam Dia.[a][b]
  rationale: Revisi ini membuat pembuka lebih langsung dan idiomatis, membedakan "dari Dia" (ἀπ’ αὐτοῦ) dari posesif "pengurapan-Nya" (αὐτοῦ χρῖσμα), serta memperhalus idiom lokasi tanpa mengurangi pengulangan kata kunci μένω. Urutan dan ketegangan retoris klausa penutup, termasuk imperatif SBLGNT dan varian indikatif dalam catatan [a], dipertahankan.
