id: 1JN.2.27
reference: 1 John 2:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς τὸ χρῖσμα ὃ ἐλάβετε ἀπ’ αὐτοῦ ⸂μένει ἐν ὑμῖν⸃, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ’ ὡς τὸ ⸀αὐτοῦ χρῖσμα διδάσκει ὑμᾶς περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, ⸀μένετε ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/027.yaml
  text: And as for you[a], the anointing that you received from him remains in you, and you have no need that anyone should teach you. But as his anointing teaches you about all things, and is true and is not a lie, and just as it taught you[b], remain in him.
translation:
  language: id
  text: Dan kalian, pengurapan yang telah kalian terima dari Dia tetap tinggal dalam diri kalian, dan kalian tidak memerlukan siapa pun untuk mengajar kalian. Tetapi sebagaimana pengurapan-Nya mengajar kalian tentang segala sesuatu, dan pengurapan itu benar serta bukan dusta, sebagaimana pengurapan itu telah mengajar kalian, tetaplah tinggal di dalam Dia.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam beberapa naskah: “dan sebagaimana pengurapan itu telah mengajar kalian, kalian tetap tinggal di dalam Dia.”'
    reason: textual_variant
  - marker: b
    text: Kata Yunani yang sama diterjemahkan “tetap tinggal” dan “tetaplah tinggal” dalam ayat ini; kata itu juga dapat diterjemahkan “berdiam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῖσμα
  choice: pengurapan
  rationale: Mempertahankan metafora Yunani tanpa langsung menafsirkannya sebagai Roh Kudus atau berita Injil. Dalam konteks ini kata tersebut menunjuk pada sesuatu yang diterima dari Dia dan yang mengajar orang percaya.
- source_word: ἀπ’ αὐτοῦ / αὐτοῦ
  choice: dari Dia / dari-Nya
  rationale: Mempertahankan bentuk pronominal teks Yunani dan membiarkan konteks sebelumnya menentukan siapa yang dimaksud, tanpa mengganti kata ganti itu dengan sebutan yang lebih eksplisit.
- source_word: μένει ἐν ὑμῖν / μένετε ἐν αὐτῷ
  choice: tetap tinggal di dalam kalian / tetaplah tinggal di dalam Dia
  rationale: Ungkapan 'tetap tinggal' alami dalam bahasa Indonesia dan mempertahankan pengulangan kata μένω serta hubungan retoris antara keberadaan pengurapan dalam pembaca dan seruan agar mereka tinggal di dalam Dia.
- source_word: οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς
  choice: Kalian tidak memerlukan siapa pun untuk mengajar kalian
  rationale: Menyampaikan pernyataan Yunani secara langsung tanpa memperlemahnya ataupun mengembangkannya menjadi penolakan eksplisit terhadap semua pengajaran manusia.
- source_word: διδάσκῃ / διδάσκει / ἐδίδαξεν
  choice: mengajar / mengajar / telah mengajar
  rationale: Penggunaan kata yang sama mempertahankan pengulangan dan daya retoris teks sumber.
- source_word: περὶ πάντων
  choice: tentang segala sesuatu
  rationale: Mempertahankan keluasan πάντων tanpa membatasi cakupannya melalui penafsiran tambahan.
- source_word: ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος
  choice: pengurapan itu benar dan bukan dusta
  rationale: Mempertahankan pertentangan khas Yohanes antara kebenaran dan dusta dalam bahasa Indonesia yang lugas.
- source_word: καθὼς ἐδίδαξεν ὑμᾶς
  choice: Sebagaimana pengurapan itu telah mengajar kalian
  rationale: Kata penghubung komparatif dipertahankan, sedangkan subjek tersirat dinyatakan kembali agar rujukannya jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan 'pengurapan' (χρῖσμα)
  choice: Metafora 'pengurapan' dipertahankan tanpa identifikasi eksplisit dalam teks utama.
  alternative: Roh Kudus; berita atau Injil yang telah diterima
  rationale: Konteks mungkin menunjuk pada kehadiran dan karya pengajaran Roh, tetapi ayat ini sendiri memakai metafora 'pengurapan'. Penerjemahan tidak boleh menyelesaikan rujukan itu secara doktrinal.
- issue: Arti pernyataan bahwa mereka tidak memerlukan siapa pun untuk mengajar
  choice: Pernyataan diterjemahkan sebagaimana adanya, tanpa diperlemah atau dimutlakkan.
  alternative: Penolakan mutlak terhadap semua pengajar manusia; penolakan kontekstual terhadap pengajaran kelompok yang memisahkan diri
  rationale: Teks menyatakan hal tersebut secara tegas, tetapi kontekslah yang menentukan cakupannya. Terjemahan tidak menambahkan pembatas maupun menjadikannya rumusan doktrinal yang lebih luas.
- issue: Bentuk akhir μένετε
  choice: 'Diterjemahkan sebagai imperatif: ''tetaplah tinggal di dalam Dia.'''
  alternative: 'Indikatif: ''kalian tetap tinggal di dalam Dia'''
  rationale: Bacaan teks utama secara wajar berfungsi sebagai perintah dalam konteks ini. Bacaan indikatif yang didukung sebagian naskah dicatat dalam catatan kaki.
- issue: Rujukan pronomina akhir ἐν αὐτῷ
  choice: di dalam Dia
  alternative: di dalamnya, yakni di dalam pengurapan
  rationale: Bentuk Yunani maskulin dan konteks personal mendukung 'Dia', tetapi terjemahan tidak menamai pribadi tersebut secara lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Kalian' dipakai karena semua bentuk orang kedua dalam teks Yunani berbentuk jamak. Tanda titik koma membantu mempertahankan alur kalimat panjang Yunani tanpa menghasilkan susunan yang berat. Huruf kapital pada 'Dia/-Nya' mengikuti kebiasaan Indonesia bagi pronomina yang merujuk kepada Allah, sementara identitas rujukannya tetap tidak dijabarkan dalam teks.
