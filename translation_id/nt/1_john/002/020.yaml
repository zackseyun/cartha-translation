  text: But you have an anointing from the Holy One[a], and you all know.
translation:
  language: id
  text: Namun, kalian memiliki pengurapan dari Yang Kudus,[a] dan kalian semua tahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam pembacaan naskah lain: “dan kalian mengetahui segala sesuatu.” Teks SBLGNT mendukung: “dan kalian semua tahu.”'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Namun
  rationale: Di sini καί menghubungkan ayat ini dengan ayat sebelumnya sekaligus menandai pertentangan dengan para antikristus; “Namun” menyatakan kontras itu secara alami dalam bahasa Indonesia.
- source_word: ὑμεῖς
  choice: kamu semua
  rationale: Pronomina Yunani ini dinyatakan secara eksplisit dan bersifat menonjol. “Kamu semua” menyampaikan baik sapaan jamak maupun kontras dengan kelompok pada ayat sebelumnya.
- source_word: χρῖσμα
  choice: pengurapan
  rationale: Pilihan ini mempertahankan metafora Yunani dan gaung teologisnya tanpa langsung menafsirkannya sebagai Roh Kudus atau karya Roh.
- source_word: ἔχετε
  choice: telah menerima
  rationale: Secara harfiah berarti “memiliki,” tetapi bersama “pengurapan dari Yang Kudus,” ungkapan “telah menerima” lebih alami dalam bahasa Indonesia dan menyampaikan keadaan kini yang berasal dari pemberian sebelumnya.
- source_word: ἀπὸ τοῦ ἁγίου
  choice: dari Yang Kudus
  rationale: Terjemahan ini mempertahankan gelar ilahi dalam teks tanpa menentukan apakah yang dimaksud ialah Bapa atau Anak.
- source_word: καὶ
  choice: dan
  rationale: καί yang kedua bersifat penghubung biasa antara dua pernyataan.
- source_word: οἴδατε
  choice: tahu
  rationale: “Tahu” merupakan padanan langsung dan alami untuk οἴδατε dalam konteks ini.
- source_word: πάντες
  choice: kamu semua
  rationale: 'Dalam teks SBLGNT, πάντες berbentuk nominatif jamak dan menerangkan subjek: semua penerima surat tahu. Ini berbeda dari varian πάντα, “segala sesuatu.”'
theological_decisions:
- issue: Rujukan gelar “Yang Kudus”
  choice: Yang Kudus
  alternative: Allah Bapa; Yesus Kristus
  rationale: Teks tidak menyebutkan rujukannya secara tegas. Gelar tersebut dipertahankan agar ketegangan teologis yang asli tidak diselesaikan secara interpretatif.
- issue: Makna χρῖσμα
  choice: pengurapan
  alternative: Roh Kudus; pengurapan oleh Roh; karunia pengurapan
  rationale: Walaupun istilah ini sering dipahami sebagai Roh Kudus atau karya-Nya, teks memakai metafora “pengurapan.” Terjemahan mempertahankan metafora tersebut.
- issue: Cakupan pengetahuan
  choice: kamu semua tahu
  alternative: kamu tahu segala sesuatu
  rationale: Pilihan ini mengikuti πάντες dalam SBLGNT, yang menunjuk kepada semua orang yang disapa, bukan kepada segala sesuatu sebagai objek pengetahuan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. “Kamu semua” dipakai untuk memperjelas bentuk jamak serta penekanan subjek; “pengurapan” dan “Yang Kudus” mempertahankan metafora serta ambiguitas teks sumber.
