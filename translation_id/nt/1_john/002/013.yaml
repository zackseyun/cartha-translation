base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/013.yaml
  text: I write to you[a], fathers, because you have known him who is from the beginning; I write to you, young men, because you have overcome the evil one.
translation:
  language: id
  text: Aku menulis kepada kalian, para bapa, karena kalian telah mengenal dia yang ada sejak semula[a]; aku menulis kepada kalian, para pemuda, karena kalian telah mengalahkan si jahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang ada sejak semula”. Ungkapan ini kemungkinan merujuk kepada Sang Anak, walaupun sebagian orang memahaminya secara lebih luas sebagai rujukan kepada Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: γράφω
  choice: Aku menulis
  rationale: Bentuk kini dalam konteks surat diterjemahkan secara langsung dan alami sebagai “Aku menulis”, sambil mempertahankan kesegeraan ujaran penulis.
- source_word: πατέρες
  choice: para bapa
  rationale: Mempertahankan sapaan harfiah maskulin “bapa-bapa”, tetapi memakai bentuk “para bapa” yang lebih wajar dan bermartabat dalam bahasa Indonesia; konteksnya mungkin menunjuk kepada laki-laki yang matang secara rohani.
- source_word: ἐγνώκατε
  choice: telah mengenal
  rationale: Bentuk perfek menyatakan pengenalan yang telah terjadi dan tetap berlaku; “telah mengenal” mempertahankan aspek itu tanpa menambahkan gagasan perkembangan.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: Dia yang ada sejak semula
  rationale: Ungkapan substantival ini diterjemahkan sebagai rujukan personal tanpa menyebut identitasnya secara eksplisit. Kata “ada” membuat frasa tersebut alami dalam bahasa Indonesia dan mempertahankan nuansa keberadaan sejak semula.
- source_word: νεανίσκοι
  choice: para pemuda
  rationale: Nomina ini berbentuk jamak maskulin dan paling alami diterjemahkan sebagai “para pemuda”, bukan istilah netral gender.
- source_word: νενικήκατε
  choice: telah mengalahkan
  rationale: Bentuk perfek menunjukkan kemenangan yang telah dicapai dengan hasil yang tetap berlaku. “Telah mengalahkan” jelas dan alami dalam bahasa Indonesia.
- source_word: τὸν πονηρόν
  choice: si jahat
  rationale: Artikel maskulin dan adjektiva yang dipakai secara substantival menunjuk paling wajar kepada lawan jahat yang personal. “Si jahat” mempertahankan rujukan personal tanpa menambahkan nama yang tidak terdapat dalam teks Yunani.
theological_decisions:
- issue: Rujukan “Dia yang ada sejak semula”
  choice: Identitasnya tidak disebutkan secara eksplisit dalam teks utama
  alternative: Menyatakannya secara langsung sebagai Sang Anak atau, secara lebih luas, Allah
  rationale: Pemakaian Yohanes kemungkinan besar menunjuk kepada Sang Anak, tetapi frasa Yunani di ayat ini tidak menyebut identitas itu. Terjemahan mempertahankan ketegangan dan tekstur teologis sumber.
- issue: Makna “si jahat”
  choice: Lawan jahat yang personal
  alternative: Kejahatan sebagai konsep abstrak
  rationale: Bentuk tunggal maskulin dengan artikel sangat mendukung rujukan personal, tetapi terjemahan tidak menambahkan nama “Iblis” atau “Setan” karena nama itu tidak muncul dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat yang langsung dan bermartabat. Sapaan “para bapa” dan “para pemuda” mempertahankan bentuk maskulin sumber, sedangkan pengulangan “aku menulis kepada kalian” mempertahankan struktur retoris Yunani.
