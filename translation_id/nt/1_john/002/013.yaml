  naturalness: “Aku menulis kepada kalian, para bapa ... para pemuda” adalah bahasa Indonesia baku modern dan mempertahankan nada surat serta pengulangan retoris sumber. “Si jahat” alami untuk musuh personal dan tidak perlu diganti dengan nama yang tidak ada dalam teks.
  terminology: “Para bapa,” “para pemuda,” dan “si jahat” menyampaikan bentuk serta gender sumber dengan baik. Huruf kecil pada “dia” menghindari penetapan referen teologis melalui konvensi kapitalisasi Indonesia. Catatan kaki sebaiknya menawarkan alternatif frasa yang sungguh berbeda tanpa menambahkan penafsiran “Pribadi” ke dalam alternatifnya.
