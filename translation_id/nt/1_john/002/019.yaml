  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐξ ἡμῶν ἐξῆλθαν, ἀλλ’ οὐκ ἦσαν ἐξ ἡμῶν· εἰ γὰρ ⸂ἐξ ἡμῶν ἦσαν⸃, μεμενήκεισαν ἂν μεθ’ ἡμῶν· ἀλλ’ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/019.yaml
  text: They went out from us[a], but they were not of us; for if they had been of us, they would have remained with us[b]. But this happened so that it might be made clear that not all are of us.
translation:
  language: id
  text: Mereka keluar dari antara kita, tetapi mereka bukan berasal dari kita. Sebab, jika mereka berasal dari kita, mereka tentu tetap bersama kita. Namun, hal itu terjadi supaya menjadi nyata bahwa tidak semua berasal dari kita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἡμῶν
  choice: dari antara kita / berasal dari kita
  rationale: Pada kemunculan pertama, frasa ini menyatakan titik keberangkatan dari lingkungan komunitas; pada kemunculan berikutnya, frasa yang sama menyatakan asal atau keterikatan relasional. Variasi ini mempertahankan hubungan antarkemunculan sambil menghasilkan bahasa Indonesia yang wajar.
- source_word: ἐξῆλθαν
  choice: keluar
  rationale: Menerjemahkan verba secara konkret tanpa menambahkan penafsiran seperti 'murtad' yang tidak dinyatakan oleh verba itu sendiri.
- source_word: οὐκ ἦσαν ἐξ ἡμῶν
  choice: mereka bukan berasal dari kita
  rationale: '''Berasal dari kita'' mempertahankan ungkapan sumber dan tidak menyelesaikan secara eksplisit apakah yang dimaksud ialah keanggotaan, identitas, atau keterikatan sejati.'
- source_word: εἰ γὰρ ἐξ ἡμῶν ἦσαν
  choice: sebab, jika mereka berasal dari kita
  rationale: Bentuk syarat yang berlawanan dengan kenyataan tersampaikan secara alami melalui konteks dan hasil 'tentu tetap'.
- source_word: μεμενήκεισαν ἂν μεθ’ ἡμῶν
  choice: mereka tentu tetap bersama kita
  rationale: '''Tetap'' mencerminkan μένω dan resonansi Yohanes tentang keberlanjutan, sedangkan ''tentu'' menandai hasil yang tidak terjadi dalam konstruksi kontrafaktual.'
- source_word: ἀλλ’ ἵνα φανερωθῶσιν
  choice: namun, hal itu terjadi supaya menjadi nyata
  rationale: Tambahan 'hal itu terjadi' melengkapi klausa eliptis dalam bahasa Indonesia; 'menjadi nyata' mempertahankan makna pasif φανερωθῶσιν tanpa menentukan agen.
- source_word: ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: bahwa tidak semua dari mereka berasal dari kita
  rationale: Kata ganti 'mereka' dipasok agar cakupan negasi jelas dan kalimat alami dalam bahasa Indonesia, tanpa mengubah pernyataan bahwa kelompok itu tidak seluruhnya berasal dari komunitas penulis.
theological_decisions:
- issue: Apakah ἐξ ἡμῶν harus dijelaskan sebagai status keselamatan atau jenis keanggotaan tertentu
  choice: Memakai ungkapan relasional 'berasal dari kita'
  alternative: Mereka tidak pernah sungguh-sungguh percaya / tidak benar-benar termasuk dalam jemaat
  rationale: Bahasa Yunani membedakan tindakan keluar dari relasi 'berasal dari kita', tetapi tidak memakai kategori teologis sistematis. Terjemahan ini menjaga ketegangan tersebut.
- issue: Nuansa tujuan atau hasil dalam ἵνα φανερωθῶσιν
  choice: supaya menjadi nyata
  alternative: sehingga menjadi nyata
  rationale: ἵνα secara formal menyatakan tujuan, tetapi konteks dapat menyertakan nuansa hasil. 'Supaya' mempertahankan bentuk tujuan tanpa menjelaskan agen atau maksud ilahi secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Frasa 'berasal dari kita' dipilih daripada 'termasuk golongan kita' agar tidak mempersempit makna kepada keanggotaan formal. Penanda catatan kaki ditempatkan setelah klausa yang mengandung ambiguitas sintaksis.
