  terminology: “Berasal dari kita” secara konsisten mencerminkan ungkapan relasional ἐξ ἡμῶν tanpa memaksakan kategori teologis seperti keselamatan atau keanggotaan formal. “Tetap bersama kita” dengan baik mempertahankan nuansa μένω.
