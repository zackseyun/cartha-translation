id: 1JN.2.22
reference: 1 John 2:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τίς ἐστιν ὁ ψεύστης εἰ μὴ ὁ ἀρνούμενος ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός; οὗτός ἐστιν ὁ ἀντίχριστος, ὁ ἀρνούμενος τὸν πατέρα καὶ τὸν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/022.yaml
  text: 'Who is the liar except the one who denies that Jesus is the Messiah? This is the antichrist: the one who denies the Father and the Son[a][b].'
translation:
  language: id
  text: Siapakah pendusta itu, kalau bukan orang yang menyangkal bahwa Yesus adalah Mesias[a]? Dialah antikristus[b], yaitu orang yang menyangkal Bapa dan Anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.” Kata Yunani ὁ χριστός merupakan gelar; di sini diterjemahkan “Mesias.”
    reason: alternative_reading
  - marker: b
    text: Atau, “sang Antikristus.” Dalam surat-surat Yohanes, istilah ini dapat menunjuk kepada penentang yang dicirikan oleh penyangkalan terhadap Bapa dan Anak, tanpa harus menentukan di sini bahwa yang dimaksud hanya satu tokoh akhir zaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψεύστης
  choice: pendusta itu
  rationale: Kata sandang Yunani menunjuk secara definit pada sosok pendusta yang sedang dicirikan; bentuk ini lebih wajar daripada sekadar 'seorang pendusta'.
- source_word: ἀρνούμενος
  choice: orang yang menyangkal
  rationale: Partisipel kini yang berfungsi sebagai nomina menggambarkan penyangkalan sebagai ciri orang tersebut.
- source_word: ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός
  choice: bahwa Yesus adalah Mesias
  rationale: 'Dalam konstruksi dengan verba ''menyangkal'', klausa ini menyatakan hal positif yang disangkal: bahwa Yesus adalah Mesias. Bentuk ini alami dalam bahasa Indonesia dan tidak menghasilkan penyangkalan ganda yang menyesatkan.'
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar dan sepadan dengan Mesias, bukan sebagai unsur nama diri.
- source_word: ὁ ἀντίχριστος
  choice: antikristus
  rationale: Istilah baku Indonesia mempertahankan sebutan Yohanes tanpa mempersempitnya menjadi hanya satu tokoh akhir zaman; definiteness sudah ditopang oleh 'Dialah'.
- source_word: οὗτός ἐστιν
  choice: Dialah
  rationale: Demonstratif merujuk kembali kepada orang yang baru saja digambarkan dan menyatakan identifikasi secara tegas serta alami.
- source_word: τὸν πατέρα καὶ τὸν υἱόν
  choice: Bapa dan Anak
  rationale: Huruf kapital menandai rujukan khusus kepada Allah sebagai Bapa dan kepada Anak dalam relasi kristologis Yohanes.
theological_decisions:
- issue: Makna Χριστός dalam rumusan pengakuan atau penyangkalan
  choice: Mesias
  alternative: Kristus
  rationale: Di sini istilah tersebut jelas merupakan gelar yang menyatakan klaim mesianik mengenai Yesus; 'Mesias' menyampaikan maknanya secara langsung.
- issue: Cakupan rujukan ἀντίχριστος
  choice: antikristus
  alternative: sang Antikristus
  rationale: Terjemahan tidak membatasi istilah itu pada satu individu eskatologis tertentu. Konteks surat dapat mencirikan jenis penentang, sedangkan identifikasi definit dipertahankan melalui 'Dialah'.
- issue: Negasi dalam isi penyangkalan
  choice: menyangkal bahwa Yesus adalah Mesias
  alternative: menyangkal bahwa Yesus bukan Mesias
  rationale: Secara semantis, orang tersebut menolak proposisi bahwa Yesus adalah Mesias. Bahasa Indonesia lazim menyatakannya tanpa negasi kedua; alternatif dapat disalahpahami sebagai menyangkal proposisi negatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Pendusta' dipilih untuk mempertahankan ketegasan polemis teks; 'Dialah' memberi identifikasi yang alami. Penanda catatan kaki ditempatkan berurutan pada akhir klausa yang relevan.
