base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/010.yaml
  text: The one who loves his brother remains in the light[a], and there is no cause for stumbling in him.
translation:
  language: id
  text: Orang yang mengasihi saudaranya tetap berada dalam terang, dan tidak ada batu sandungan dalam dirinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak ada batu sandungan baginya.” Frasa Yunani ini dapat dipahami sebagai apa yang tidak ada dalam dirinya atau sebagai sesuatu yang tidak dihadapinya.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀγαπῶν
  choice: Orang yang mengasihi
  rationale: Partisipel kini dengan artikel berfungsi sebagai nomina dan menyatakan tindakan yang bersifat umum serta berkelanjutan. Bentuk ini alami dalam bahasa Indonesia modern.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: saudaranya
  rationale: ἀδελφός berbentuk maskulin tunggal dan dalam konteks ini menunjuk kepada saudara dalam komunitas iman. 'Saudaranya' mempertahankan bentuk sumber tanpa mempersempitnya secara tidak perlu pada saudara kandung.
- source_word: ἐν τῷ φωτὶ
  choice: di dalam terang
  rationale: Mempertahankan citra metaforis khas Yohanes sekaligus terdengar wajar dan bermartabat dalam bahasa Indonesia.
- source_word: μένει
  choice: tetap berada
  rationale: Menyampaikan aspek keberlangsungan dari μένω dengan bahasa Indonesia modern; 'tinggal' dapat terdengar terlalu harfiah sebagai tempat kediaman.
- source_word: σκάνδαλον
  choice: penyebab tersandung
  rationale: Mempertahankan metafora sandungan dan cakupan etis kata Yunani tanpa mengubahnya menjadi benda harfiah semata.
- source_word: ἐν αὐτῷ
  choice: di dalam dirinya
  rationale: Secara langsung mempertahankan konstruksi Yunani dan rujukan paling alami kepada orang yang mengasihi, sambil membiarkan nuansa alternatif dicatat dalam catatan kaki.
- source_word: οὐκ ἔστιν
  choice: tidak ada
  rationale: Konstruksi eksistensial ini merupakan padanan bahasa Indonesia yang alami bagi klausa Yunani.
theological_decisions:
- issue: Rujukan dan nuansa καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν
  choice: Tidak ada penyebab tersandung di dalam orang yang mengasihi saudaranya.
  alternative: Tidak ada batu sandungan baginya.
  rationale: ἐν αὐτῷ dapat menggambarkan apa yang tidak terdapat di dalam dirinya atau, dengan nuansa relasional, apa yang tidak menjadi sandungan baginya. Teks utama mempertahankan susunan internal yang paling langsung, sedangkan catatan kaki menjaga ambiguitas yang sungguh terdapat dalam bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Istilah 'terang' serta metafora 'tersandung' dipertahankan karena penting bagi gambaran teologis dan etis surat ini.
