  text: πάλιν ἐντολὴν καινὴν γράφω ὑμῖν, ὅ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν, ὅτι ἡ σκοτία παράγεται καὶ τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/008.yaml
  text: Again[a], I am writing to you a new commandment, which is true in him and in you, because the darkness is passing away and the true light is already shining.
translation:
  language: id
  text: Sekali lagi, saya menulis kepada kalian suatu perintah baru, yang benar di dalam Dia[a] dan di dalam kalian, sebab kegelapan sedang berlalu dan terang yang sejati sudah bersinar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di dalamnya dan di dalam kalian,” jika kata ganti tersebut merujuk kepada perintah, bukan kepada Dia secara pribadi.
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν
  choice: Sekali lagi
  rationale: 'Penanda wacana ini mengemukakan kembali pokok sebelumnya dari sudut yang berbeda: perintah yang disebut lama pada ayat sebelumnya juga disebut baru. “Sekali lagi” mempertahankan bentuk ringkas teks tanpa menentukan hubungan itu secara berlebihan.'
- source_word: ἐντολὴν καινὴν
  choice: sebuah perintah baru
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan tentang kebaruan sifat atau kualitas perintah tersebut.
- source_word: γράφω ὑμῖν
  choice: saya menulis kepada kalian
  rationale: Bentuk kini Yunani menunjuk pada tindakan penulis dalam surat ini. “Kalian” menyatakan dengan jelas bahwa penerimanya jamak.
- source_word: ὅ ἐστιν ἀληθὲς
  choice: Hal itu benar
  rationale: Kata ganti relatif netral merujuk pada gagasan sebelumnya sebagai suatu keseluruhan. “Hal itu benar” mempertahankan predikasi ἀληθές tanpa menambahkan gagasan seperti ‘terbukti’ atau ‘menjadi nyata’.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Dalam konteks surat ini, kata ganti tersebut paling mungkin merujuk kepada Kristus. Ungkapan “di dalam” juga mempertahankan corak khas tulisan Yohanes. Kemungkinan bahwa kata ganti itu merujuk kepada perintah dipertahankan dalam catatan kaki.
- source_word: ἐν ὑμῖν
  choice: di dalam kalian
  rationale: Terjemahan ini mempertahankan kesejajaran langsung dengan “di dalam Dia” dan tidak mempersempit maknanya menjadi hanya ‘di antara kalian’.
- source_word: ὅτι
  choice: sebab
  rationale: Kata sambung ini menyatakan dasar bagi pernyataan sebelumnya. “Sebab” jelas, ringkas, dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: ἡ σκοτία παράγεται
  choice: kegelapan sedang berlalu
  rationale: Bentuk kini menggambarkan proses yang masih berlangsung. “Sedang berlalu” mempertahankan aspek itu dan citra peralihan dari kegelapan.
- source_word: τὸ φῶς τὸ ἀληθινὸν
  choice: terang yang sejati
  rationale: Pilihan ini mempertahankan ungkapan penting dalam tulisan Yohanes serta nuansa sesuatu yang benar-benar sejati, dalam pertentangannya dengan kegelapan.
- source_word: ἤδη φαίνει
  choice: sudah bersinar
  rationale: “Sudah” menyampaikan bahwa tindakan itu telah menjadi kenyataan sekarang, sedangkan “bersinar” secara alami menggambarkan terang yang sedang memancarkan cahayanya.
theological_decisions:
- issue: Acuan kata ganti αὐτῷ
  choice: 'Kata ganti dipahami merujuk kepada Kristus: “di dalam Dia dan di dalam kalian.”'
  alternative: 'Kata ganti dipahami merujuk kepada perintah: “di dalamnya dan di dalam kalian.”'
  rationale: Bentuk kata ganti dan konteks Yohanes paling wajar menunjuk kepada seorang pribadi, yaitu Kristus, sehingga perintah itu benar di dalam diri-Nya dan para pembaca. Namun, karena konstruksi klausa relatif memungkinkan hubungan konseptual dengan perintah tersebut, pilihan itu tidak dihapus dan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Saya” dipakai untuk suara penulis surat, sedangkan “kalian” memperjelas bentuk jamak para penerima. Struktur dan metafora terang-kegelapan dipertahankan tanpa menambahkan penjelasan doktrinal ke dalam teks.
