  text: 'Dan inilah janji yang Ia sendiri janjikan kepada kita: hidup yang kekal[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “kehidupan yang kekal.” Bahasa Yunani memakai kata sandang tertentu, tetapi bahasa Indonesia biasanya tidak menyatakannya secara eksplisit dalam ungkapan ini.
    reason: lexical_alternative
  - marker: b
    text: Kata ganti yang diterjemahkan “Ia sendiri” mendapat penekanan dalam bahasa Yunani. Ayat ini tidak menyebutkan secara eksplisit apakah acuannya adalah Bapa atau Anak.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ αὕτη ἐστὶν
  choice: Dan inilah
  rationale: Ungkapan ini secara alami menghubungkan ayat dengan pembahasan sebelumnya sekaligus memperkenalkan isi janji.
- source_word: ἡ ἐπαγγελία ... ἐπηγγείλατο
  choice: janji yang dijanjikan
  rationale: Pengulangan akar kata dalam bahasa Yunani dipertahankan agar hubungan antara nomina dan verba tetap terlihat, meskipun menghasilkan gaya yang sedikit repetitif sebagaimana teks sumber.
- source_word: αὐτός
  choice: -Nya sendiri
  rationale: Bentuk ini mempertahankan penekanan pada pelaku tanpa menambahkan identitas yang tidak dinyatakan secara eksplisit dalam ayat.
- source_word: ἡμῖν
  choice: kepada kita
  rationale: Dativus penerima diterjemahkan secara wajar dalam bahasa Indonesia sebagai 'kepada kita'.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: hidup yang kekal
  rationale: Frasa ini menjelaskan isi janji. 'Hidup yang kekal' merupakan padanan yang jelas, alami, dan sesuai dengan pemakaian Yohanes.
theological_decisions:
- issue: Acuan αὐτός ('-Nya sendiri')
  choice: Acuannya tidak diperjelas melampaui pronomina bahasa Yunani.
  alternative: Menyebut secara eksplisit 'Bapa' atau 'Anak'.
  rationale: Ayat ini tidak menyebut ulang apakah yang dimaksud adalah Bapa atau Anak. Terjemahan mempertahankan keterbukaan tersebut dan tidak menyelesaikan ketegangan teologis yang ada dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'janji yang dijanjikan' sengaja dipertahankan untuk mencerminkan permainan akar kata dalam teks Yunani. Kapitalisasi '-Nya' menandai acuan ilahi tanpa menentukan apakah yang dimaksud adalah Bapa atau Anak.
