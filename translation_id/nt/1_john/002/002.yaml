source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/002.yaml
  text: And he himself is the atoning sacrifice for our sins[a], and not for ours only but also for the whole world.
translation:
  language: id
  text: Dan Dia sendiri adalah kurban pendamaian bagi dosa-dosa kita[a], dan bukan hanya bagi dosa-dosa kita, tetapi juga bagi dosa seluruh dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “propisiasi”; juga dipahami oleh sebagian orang sebagai “ekspiasi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: Dia sendiri
  rationale: Pemakaian intensif αὐτός ditegaskan dengan “sendiri”, sehingga peran pribadi Yesus tetap tampak tanpa menambahkan gagasan “Dia saja”.
- source_word: ἱλασμός
  choice: kurban pendamaian
  rationale: Ungkapan ini alami dan cukup mudah dipahami dalam bahasa Indonesia, mempertahankan unsur kurban serta cakupan makna pendamaian tanpa secara sempit memilih antara propisiasi dan penghapusan dosa.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: bagi dosa-dosa kita
  rationale: Dalam hubungannya dengan ἱλασμός, περί dapat diterjemahkan secara wajar sebagai “bagi”; bentuk jamak “dosa-dosa” mencerminkan teks Yunani.
- source_word: τῶν ἡμετέρων
  choice: dosa-dosa kita
  rationale: Kata sifat posesif ini dipakai secara eliptis dan menunjuk kembali kepada “dosa-dosa”; pengulangan nomina membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: ὅλου τοῦ κόσμου
  choice: seluruh dunia
  rationale: Terjemahan ini mempertahankan daya cakup ὅλου dan keluasan κόσμος tanpa membatasinya menurut sistem teologis tertentu.
- source_word: οὐ ... μόνον ἀλλὰ καὶ
  choice: bukan hanya ... tetapi juga
  rationale: Konstruksi korelatif Indonesia ini menyampaikan kontras dan perluasan yang terdapat dalam struktur Yunani.
theological_decisions:
- issue: Cakupan “seluruh dunia”
  choice: Mempertahankan ungkapan penuh “seluruh dunia” tanpa pembatasan interpretatif.
  alternative: “orang-orang dari seluruh dunia” atau “orang-orang pilihan di seluruh dunia”
  rationale: Teks Yunani menyatakan ὅλου τοῦ κόσμου secara luas. Terjemahan tidak sepatutnya memasukkan pembatasan denominatif yang tidak dinyatakan oleh teks.
- issue: Makna ἱλασμός
  choice: Memakai “kurban pendamaian” dalam teks utama.
  alternative: “kurban penebus”, “propisiasi”, atau “penghapus dosa”
  rationale: “Kurban pendamaian” menyampaikan dimensi kurban dan karya yang menangani dosa, sambil tidak menuntaskan secara sepihak perdebatan apakah tekanannya terutama pada murka yang diredakan atau dosa yang dihapus. Alternatif penting dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. “Kurban” dipilih sesuai ejaan baku; pengulangan “dosa-dosa kita” menghindari bentuk posesif eliptis yang kurang alami dan memperjelas rujukan.
