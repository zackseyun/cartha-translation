id: 1JN.2.7
reference: 1 John 2:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Ἀγαπητοί, οὐκ ἐντολὴν καινὴν γράφω ὑμῖν, ἀλλ’ ἐντολὴν παλαιὰν ἣν εἴχετε ἀπ’ ἀρχῆς· ἡ ἐντολὴ ἡ παλαιά ἐστιν ὁ λόγος ὃν ⸀ἠκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/007.yaml
  text: Beloved[a], I am not writing a new commandment to you, but an old commandment that you have had from the beginning. The old commandment is the message that you heard.
translation:
  language: id
  text: Saudara-saudara yang terkasih, aku tidak menuliskan perintah baru kepada kalian, melainkan perintah lama yang telah kalian miliki sejak semula. Perintah lama itu adalah firman[a] yang telah kalian dengar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pesan”: “Perintah lama itu adalah pesan yang telah kalian dengar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Saudara-saudara yang terkasih
  rationale: Sapaan jamak yang hangat dan bermartabat; mempertahankan unsur kasih dalam ἀγαπητοί serta terdengar alami dalam bahasa Indonesia.
- source_word: ἐντολήν
  choice: perintah
  rationale: Padanan Indonesia yang alami bagi ἐντολή dan tetap mempertahankan bobot kewajiban dalam konteks Yohanes.
- source_word: καινήν
  choice: baru
  rationale: Mempertahankan kontras langsung dengan παλαιάν, 'lama'.
- source_word: γράφω
  choice: aku menuliskan
  rationale: Bentuk kini epistoler menunjuk pada tindakan penulis dalam surat ini; 'menuliskan' alami dalam konteks tersebut.
- source_word: παλαιάν / παλαιά
  choice: lama
  rationale: Menyampaikan kontras dengan 'baru' dan keberadaan perintah itu sejak semula tanpa memberi kesan 'kuno' atau usang.
- source_word: εἴχετε
  choice: telah kalian miliki
  rationale: Imperfek menggambarkan kepemilikan yang sudah berlangsung; konstruksi ini menyatakan bahwa perintah itu telah ada pada mereka sejak semula.
- source_word: ἀπ’ ἀρχῆς
  choice: sejak semula
  rationale: Ungkapan Yohanes yang tetap cukup terbuka dan tidak menentukan secara sempit awal yang dimaksud.
- source_word: λόγος
  choice: firman
  rationale: Mempertahankan padanan tradisional dan hubungan leksikal Yohanes bagi λόγος, sementara catatan kaki memberi alternatif kontekstual 'pesan'.
- source_word: ἠκούσατε
  choice: telah kalian dengar
  rationale: Menyampaikan tindakan mendengar yang telah terjadi dan tetap relevan bagi keadaan pembaca sekarang.
theological_decisions:
- issue: Acuan frasa ἀπ’ ἀρχῆς ('sejak semula')
  choice: Dibiarkan sebagai 'sejak semula' tanpa menentukan titik awalnya.
  alternative: Sejak awal kehidupan Kristen kalian; sejak awal pemberitaan Injil.
  rationale: Konteks mengarah pada awal pengajaran yang diterima pembaca, tetapi teks tidak menentukannya secara eksplisit; terjemahan mempertahankan keluasan ungkapan Yohanes.
- issue: Hubungan antara 'perintah lama' dan λόγος yang didengar
  choice: 'Persamaan keduanya diterjemahkan langsung: ''Perintah lama itu adalah firman ... yang telah kalian dengar.'''
  alternative: Menjelaskannya sebagai perintah yang terkandung dalam pesan Injil.
  rationale: Teks Yunani menyamakan perintah lama dengan λόγος yang didengar tanpa penjelasan tambahan; terjemahan tidak menyelaraskan atau memperluas hubungan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, hangat, dan pastoral. 'Aku' dan 'kalian' mempertahankan bentuk orang pertama tunggal serta orang kedua jamak secara jelas; sapaan 'Saudara-saudara yang terkasih' menghindari pembatasan gender dan tetap wajar bagi komunitas pembaca.
