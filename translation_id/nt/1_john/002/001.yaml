  text: Τεκνία μου, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα Ἰησοῦν Χριστὸν δίκαιον,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/001.yaml
  text: My little children[a], I write these things to you so that you may not sin. But if anyone does sin[b], we have an advocate with the Father—Jesus the Messiah the Righteous One.
translation:
  language: id
  text: Anak-anakku, aku menulis hal-hal ini kepadamu supaya kamu tidak berbuat dosa. Namun, jika seseorang berbuat dosa, kita mempunyai Pembela[a] pada Bapa, yaitu Yesus sang Mesias[b], Yang Adil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Yunani παράκλητος juga dapat dipahami secara lebih luas sebagai “penolong”, “penasihat”, atau “penghibur”.
    reason: lexical_alternative
  - marker: b
    text: 'Terjemahan tradisional: “Yesus Kristus”. Gelar Yunani Χριστός dapat berarti “Mesias” atau berfungsi seperti bagian dari nama, “Kristus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τεκνία μου
  choice: Anak-anakku
  rationale: Sapaan ini mempertahankan gambaran kekeluargaan dan kasih pastoral dari bentuk diminutif τεκνία, tetapi tetap wajar dalam bahasa Indonesia modern.
- source_word: ταῦτα γράφω ὑμῖν
  choice: aku menulis hal-hal ini kepadamu
  rationale: Bentuk kini γράφω diterjemahkan secara langsung sebagai 'aku menulis'; 'hal-hal ini' mempertahankan rujukan ταῦτα tanpa mempersempit acuannya.
- source_word: ἵνα μὴ ἁμάρτητε
  choice: supaya kamu tidak berbuat dosa
  rationale: Konstruksi ἵνα dengan subjungtif menyatakan tujuan. Terjemahan ini mempertahankan tujuan penulis tanpa menyimpulkan bahwa keadaan tanpa dosa telah tercapai.
- source_word: καὶ ἐάν τις ἁμάρτῃ
  choice: Namun, jika seseorang berbuat dosa
  rationale: Dalam konteks ini καί mengalihkan perhatian secara kontras dari tujuan agar tidak berdosa kepada kemungkinan seseorang berdosa; 'Namun' menyampaikan alur tersebut secara alami.
- source_word: παράκλητον
  choice: seorang Pembela
  rationale: Dalam konteks seseorang yang berada di hadapan Bapa bagi orang berdosa, 'Pembela' menyampaikan nuansa perwakilan dan pertolongan hukum, sambil mengakui keluasan makna istilah Yunani itu melalui catatan kaki.
- source_word: πρὸς τὸν πατέρα
  choice: di hadapan Bapa
  rationale: πρός di sini menunjuk pada keberadaan dan arah relasional kepada Bapa. 'Di hadapan Bapa' cocok dengan gambaran pembelaan, tanpa mengharuskan pembacaan spasial semata.
- source_word: Ἰησοῦν Χριστὸν
  choice: Yesus sang Mesias
  rationale: Χριστός dipahami sebagai gelar dan diterjemahkan 'Mesias'; 'sang' menandai gelar itu secara idiomatis dalam bahasa Indonesia.
- source_word: δίκαιον
  choice: Yang Benar
  rationale: Adjektiva δίκαιον menerangkan Yesus Kristus. Bentuk substantival 'Yang Benar' mempertahankan bobot kristologis ungkapan tersebut dan lebih alami daripada adjektiva lepas.
theological_decisions:
- issue: Kemungkinan kesan kesempurnaan tanpa dosa dalam ἵνα μὴ ἁμάρτητε
  choice: 'Mempertahankan klausa tujuan: ''supaya kamu tidak berbuat dosa'''
  alternative: Menerjemahkannya sebagai pernyataan bahwa pembaca tidak akan pernah berdosa
  rationale: Ayat menyatakan tujuan pastoral Yohanes, lalu langsung mengakui kemungkinan seseorang berbuat dosa. Terjemahan mempertahankan ketegangan itu tanpa menyelesaikannya secara doktrinal.
- issue: Fungsi Χριστός sebagai gelar kristologis
  choice: Mesias
  alternative: Kristus
  rationale: Dalam rangkaian 'Yesus ... Yang Benar', Χριστός dapat dibaca sebagai gelar. 'Mesias' menyatakan fungsi gelar tersebut secara jelas, sedangkan bentuk tradisional 'Kristus' dicantumkan sebagai alternatif.
- issue: Nuansa παράκλητος dalam hubungan dengan Bapa
  choice: Pembela
  alternative: Penolong, penasihat, atau penghibur
  rationale: Konteks dosa dan keberadaan Yesus di hadapan Bapa mendukung nuansa pembelaan atau perwakilan, tetapi keluasan semantis istilah itu tetap diakui dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Sapaan 'Anak-anakku' mempertahankan kehangatan pastoral. Kapitalisasi 'Pembela' dan 'Yang Benar' menandai pemakaiannya sebagai sebutan bagi Yesus tanpa menambahkan gelar yang tidak terdapat dalam teks.
