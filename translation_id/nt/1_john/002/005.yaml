  text: ὃς δ’ ἂν τηρῇ αὐτοῦ τὸν λόγον, ἀληθῶς ἐν τούτῳ ἡ ἀγάπη τοῦ θεοῦ τετελείωται. ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/005.yaml
  text: 'But whoever keeps his word[a], truly in him the love of God has been perfected[b]. By this we know that we are in him:'
translation:
  language: id
  text: 'Namun, siapa pun yang menaati firman-Nya, kasih Allah[a] sungguh telah disempurnakan di dalam orang itu[b]. Dengan ini kita tahu bahwa kita ada di dalam Dia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kasih Allah” dapat berarti kasih Allah yang bekerja di dalam orang percaya atau kasih orang percaya kepada Allah.
    reason: alternative_reading
  - marker: b
    text: Secara lebih harfiah, “di dalam ini” atau “di dalam orang ini.” Ungkapan Yunani itu dapat menunjuk kepada orang yang menaati firman-Nya atau kepada hal tersebut sebagai bukti.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: Namun, siapa pun yang
  rationale: 'δέ menyatakan pertentangan ringan dengan pernyataan sebelumnya, sedangkan konstruksi relatif dengan ἄν menyatakan keadaan umum atau tak tentu: ‘siapa pun yang’.'
- source_word: τηρῇ
  choice: menuruti
  rationale: τηρέω di sini berarti memegang, menaati, atau menjalankan. ‘Menuruti’ terdengar alami dalam bahasa Indonesia dan mencakup kesetiaan terhadap firman, bukan sekadar menyimpannya.
- source_word: αὐτοῦ τὸν λόγον
  choice: firman-Nya
  rationale: λόγος berbentuk tunggal dan menunjuk pada perkataan atau pesan yang berasal dari Allah atau Kristus. ‘Firman-Nya’ mempertahankan corak khas tulisan Yohanes dan rujukan pronominal Yunani tanpa mempersempitnya menjadi satu perintah tertentu.
- source_word: ἀληθῶς
  choice: sungguh-sungguh
  rationale: Kata keterangan ini menegaskan bahwa kasih tersebut benar-benar telah mencapai keadaan yang disebutkan.
- source_word: ἐν τούτῳ
  choice: dalam dirinya
  rationale: Demonstrativa ini paling wajar dipahami menunjuk kepada orang yang menuruti firman-Nya. Bentuk ‘dalam dirinya’ alami dalam bahasa Indonesia, sementara kemungkinan arti yang lebih harfiah dipertahankan dalam catatan kaki.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: kasih Allah
  rationale: 'Ungkapan ini mempertahankan ketaksaan genitif Yunani: kasih yang berasal dari Allah atau kasih yang tertuju kepada Allah.'
- source_word: τετελείωται
  choice: telah mencapai kesempurnaan
  rationale: Bentuk perfek menyatakan keadaan kini sebagai hasil proses yang telah berlangsung. Ungkapan ini menyampaikan gagasan bahwa kasih telah dibawa kepada kepenuhan atau tujuannya tanpa menyiratkan kesempurnaan tanpa batas.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: Dengan inilah kita tahu
  rationale: Rumus khas Yohanes ini memperkenalkan dasar atau bukti yang memungkinkan umat mengetahui sesuatu.
- source_word: ὅτι ἐν αὐτῷ ἐσμεν
  choice: bahwa kita berada di dalam Dia
  rationale: ‘Di dalam Dia’ mempertahankan ungkapan relasional penting dalam tulisan Yohanes tanpa menjabarkannya secara interpretatif sebagai persatuan atau persekutuan.
theological_decisions:
- issue: Makna genitif dalam ἡ ἀγάπη τοῦ θεοῦ
  choice: kasih Allah
  alternative: kasih Allah kepada orang percaya; kasih orang percaya kepada Allah
  rationale: Genitif Yunani sungguh taksa dan konteks Yohanes dapat mendukung kasih yang berasal dari Allah maupun kasih manusia yang diarahkan kepada Allah. Teks utama mempertahankan ketegangan itu, dan kedua kemungkinan dijelaskan dalam catatan kaki.
- issue: Acuan ἐν τούτῳ pada klausa pertama
  choice: dalam dirinya
  alternative: dalam hal ini; dalam orang ini
  rationale: Demonstrativa dapat menunjuk secara personal kepada orang yang menuruti firman atau secara lebih abstrak kepada hal tersebut sebagai bukti. Teks utama memakai acuan personal yang paling wajar dalam bahasa Indonesia, sementara alternatif yang sungguh mungkin dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. ‘Firman-Nya’ dan ‘di dalam Dia’ mempertahankan corak teologis khas Yohanes; kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Tanda titik dua dipertahankan karena kalimat berlanjut ke ayat berikutnya.
