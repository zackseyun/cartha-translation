source:
  edition: SBLGNT
  text: ⸀ὑμεῖς ὃ ἠκούσατε ἀπ’ ἀρχῆς, ἐν ὑμῖν μενέτω· ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ’ ἀρχῆς ἠκούσατε, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/024.yaml
  text: As for you[a], let what you heard from the beginning remain in you. If what you heard from the beginning remains in you[b], you also will remain in the Son and in the Father.
translation:
  language: id
  text: Adapun kamu, hendaklah apa yang telah kamu dengar sejak semula tetap tinggal dalam kamu.[a] Jika apa yang telah kamu dengar sejak semula tetap tinggal dalam kamu,[b] kamu juga akan tetap tinggal dalam Anak dan dalam Bapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “apa yang telah kamu dengar sejak semula” kemungkinan mengacu pada pesan yang mula-mula diberitakan tentang Anak.
    reason: lexical_clarification
  - marker: b
    text: “Tetap tinggal” menerjemahkan kata kerja Yunani yang sama setiap kali muncul dalam ayat ini; kata itu juga dapat diterjemahkan “tetap berada” atau, secara tradisional, “berdiam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Adapun kamu
  rationale: Pronomina yang ditempatkan di awal bersifat menonjol dan menandai topik. “Adapun kamu” menyampaikan penekanan kontras secara wajar dalam konteks tanpa menambahkan kata penghubung yang tegas.
- source_word: ὃ ἠκούσατε ἀπ’ ἀρχῆς
  choice: apa yang telah kamu dengar sejak semula
  rationale: Pronomina relatif netral ὃ diterjemahkan secara luas sebagai “apa yang”, sehingga objeknya tidak dipersempit menjadi “Injil” atau “ajaran” dalam teks utama. “Sejak semula” mempertahankan ungkapan khas Yohanes.
- source_word: ἐν ὑμῖν μενέτω
  choice: hendaklah ... tetap tinggal di dalam kamu
  rationale: Bentuk imperatif kini menyerukan keberlangsungan. “Tetap tinggal” jelas dalam bahasa Indonesia modern dan memungkinkan pengulangan akar makna μένω dipertahankan sepanjang ayat.
- source_word: ἐὰν ἐν ὑμῖν μείνῃ
  choice: Jika ... tetap tinggal di dalam kamu
  rationale: ἐάν dengan subjungtif membentuk syarat. Susunan ini alami dalam bahasa Indonesia serta mempertahankan kaitannya dengan pemakaian μένω sebelumnya.
- source_word: καὶ ὑμεῖς
  choice: kamu juga
  rationale: καί bermakna “juga”, sedangkan pronomina yang dinyatakan secara eksplisit mempertahankan penekanan pada para pembaca.
- source_word: ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ
  choice: di dalam Anak dan di dalam Bapa
  rationale: Pengulangan “di dalam” mempertahankan kesejajaran relasional dari pengulangan ἐν. Sebutan “Anak” dan “Bapa” sesuai dengan pemakaian khas Yohanes.
- source_word: μενεῖτε
  choice: akan tetap tinggal
  rationale: Bentuk indikatif mendatang diterjemahkan langsung dengan “akan tetap tinggal”, sekaligus mempertahankan hubungan verbal dengan dua pemakaian μένω sebelumnya.
theological_decisions:
- issue: Sifat pernyataan bersyarat dalam klausa terakhir
  choice: Menerjemahkan bentuk mendatang secara langsung sebagai “kamu juga akan tetap tinggal di dalam Anak dan di dalam Bapa”.
  alternative: Menafsirkannya sebagai nasihat, atau sebagai rumusan doktrinal tertentu tentang ketekunan orang percaya.
  rationale: Bahasa Yunani menyatakan akibat mendatang yang bergantung pada syarat bahwa apa yang telah didengar tetap tinggal dalam diri pembaca. Terjemahan mempertahankan ketegangan ini tanpa menyelesaikannya menurut kerangka denominasi tertentu.
- issue: Rujukan frasa “apa yang telah kamu dengar sejak semula”
  choice: Mempertahankan ungkapan umum “apa yang” dalam teks utama.
  alternative: Menentukan rujukannya sebagai “Injil” atau “ajaran para rasul”.
  rationale: Konteks sangat mungkin menunjuk kepada pemberitaan semula tentang Anak, tetapi teks Yunani memakai pronomina relatif netral dan tidak menyebut objek itu secara lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Adapun kamu” menampilkan penekanan topikal tanpa terasa kasar; pengulangan “tetap tinggal” sengaja dipertahankan untuk mencerminkan pola retoris Yohanes.
