  text: I have written these things to you concerning those who are leading you astray[a].
translation:
  language: id
  text: Hal-hal ini telah kutuliskan kepada kalian mengenai orang-orang yang menyesatkan kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang sedang memperdaya kalian” atau “orang-orang yang berusaha menyesatkan kalian.” Partisipel Yunani ini dapat menggambarkan penyesatan aktif ataupun upaya untuk menyesatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Hal-hal ini
  rationale: Bentuk demonstratif netral jamak ini menunjuk kembali kepada pokok-pokok yang baru saja dituliskan; “hal-hal ini” menyampaikan rujukan jamaknya secara alami.
- source_word: ἔγραψα
  choice: telah kutuliskan
  rationale: Aoristus menyatakan tindakan menulis yang telah selesai. Bentuk “telah kutuliskan” wajar dalam konteks surat dan menonjolkan relevansi tulisan itu bagi para penerima sekarang.
- source_word: ὑμῖν
  choice: kepadamu
  rationale: Dativus menandai penerima tulisan. Bentuk tunggal kolektif “kamu” lazim dan jelas dalam bahasa Indonesia, meskipun kata Yunani ini berbentuk jamak.
- source_word: περὶ
  choice: mengenai
  rationale: Preposisi ini memperkenalkan pokok yang dibicarakan; “mengenai” mempertahankan nada yang lugas dan bermartabat.
- source_word: τῶν πλανώντων ὑμᾶς
  choice: orang-orang yang berusaha menyesatkan kamu
  rationale: Partisipel aktif kini mengidentifikasi orang-orang melalui tindakan mereka terhadap para pembaca. “Menyesatkan” mengungkapkan gagasan membawa orang menyimpang, sedangkan “berusaha” menghindari kesan bahwa tindakan itu pasti telah berhasil.
theological_decisions:
- issue: Apakah πλανώντων menyatakan penyesatan yang berhasil atau upaya untuk menyesatkan
  choice: orang-orang yang berusaha menyesatkan kamu
  alternative: orang-orang yang menyesatkan kamu
  rationale: Bahasa Yunani menggambarkan kegiatan para lawan terhadap pembaca, tetapi tidak dengan sendirinya memastikan bahwa para pembaca sudah berhasil disesatkan. Terjemahan ini mempertahankan ketegangan tersebut tanpa meniadakan ancaman nyata.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pastoral dan bermartabat. Bentuk “kutuliskan” menjaga kelancaran tanpa kehilangan penekanan pada penulis. “Kamu” dipakai secara kolektif untuk penerima jamak; konteks surat menjadikannya jelas.
