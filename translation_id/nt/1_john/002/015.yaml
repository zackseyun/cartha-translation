id: 1JN.2.15
reference: 1 John 2:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μὴ ἀγαπᾶτε τὸν κόσμον μηδὲ τὰ ἐν τῷ κόσμῳ. ἐάν τις ἀγαπᾷ τὸν κόσμον, οὐκ ἔστιν ἡ ἀγάπη τοῦ πατρὸς ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/015.yaml
  text: Do not love the world or the things in the world[a]. If anyone loves the world[c][b], the love of the Father is not in him.
translation:
  language: id
  text: Janganlah mengasihi dunia ataupun hal-hal yang ada di dalam dunia.[a] Jika seseorang mengasihi dunia, kasih Bapa tidak ada di dalam dirinya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “dan jangan pula mengasihi hal-hal yang ada di dalam dunia.”
    reason: lexical_alternative
  - marker: b
    text: “Kasih Bapa” kemungkinan berarti “kasih kepada Bapa”; dapat juga berarti “kasih yang berasal dari Bapa.”
    reason: alternative_reading
lexical_decisions:
- source_word: Μὴ ἀγαπᾶτε
  choice: Janganlah mengasihi
  rationale: Bentuk imperatif kini dengan μή dapat menyatakan larangan umum atau penghentian tindakan yang sedang berlangsung. Terjemahan ini mempertahankan larangannya tanpa menentukan aspek secara berlebihan.
- source_word: τὸν κόσμον
  choice: dunia
  rationale: κόσμος dipertahankan dengan padanan luas dan lazim. Dalam konteks ini istilah tersebut menunjuk pada tatanan yang menentang Allah, tetapi terjemahan utama tidak mempersempitnya menjadi penafsiran eksplisit.
- source_word: μηδὲ τὰ ἐν τῷ κόσμῳ
  choice: ataupun hal-hal yang ada di dalam dunia
  rationale: μηδέ melanjutkan larangan pertama, sedangkan bentuk netral jamak τὰ menunjuk secara umum pada hal-hal yang berada dalam dunia. Susunan ini dekat dengan bahasa sumber sekaligus wajar dalam bahasa Indonesia.
- source_word: ἐάν τις ἀγαπᾷ
  choice: Jika seseorang mengasihi
  rationale: τις bersifat tak tentu dan generik; 'seseorang' menyampaikan cakupan itu secara alami.
- source_word: ἡ ἀγάπη τοῦ πατρὸς
  choice: kasih Bapa
  rationale: 'Frasa ringkas ini mempertahankan ketaksaan genitif Yunani: secara kontekstual kemungkinan besar berarti kasih kepada Bapa, tetapi secara tata bahasa juga dapat dipahami sebagai kasih yang berasal dari Bapa.'
- source_word: ἐν αὐτῷ
  choice: di dalam dirinya
  rationale: Padanan ini mempertahankan gambaran bahwa kasih itu berada dalam batin orang tersebut dan secara alami merujuk kembali kepada 'seseorang' tanpa membatasi pernyataan generik pada laki-laki.
theological_decisions:
- issue: Makna 'dunia' dalam nasihat etis Yohanes
  choice: dunia
  alternative: tatanan duniawi; sistem dunia
  rationale: Teks memperhadapkan kasih kepada dunia dengan kasih Bapa. Padanan yang tidak diperluas menjaga keluasan istilah dan tidak menyiratkan bahwa ciptaan fisik atau manusia pada dirinya sendiri tidak boleh dikasihi.
- issue: Arti genitif dalam ἡ ἀγάπη τοῦ πατρὸς
  choice: kasih Bapa
  alternative: kasih kepada Bapa; kasih yang berasal dari Bapa
  rationale: Konteks kontras dengan mengasihi dunia mendukung pengertian 'kasih kepada Bapa', tetapi bentuk Yunani juga memungkinkan pengertian subjektif. Teks utama dan catatan kaki mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Janganlah' memberi nada nasihat kerasulan yang wajar; 'ataupun' menghubungkan kedua objek larangan dengan jelas. Rujukan generik diterjemahkan secara alami sebagai 'seseorang' dan 'dirinya'.
