base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/029.yaml
  text: If you know that he is righteous[b][a], you know that everyone who practices righteousness has been born of him.
translation:
  language: id
  text: Jika kamu tahu bahwa Dia benar[b], kamu tahu bahwa setiap orang yang berbuat benar telah lahir dari-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah diperanakkan oleh-Nya.” Ungkapan Yunani ini juga dapat dipahami dengan arti “dari-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Kata “Dia” dan “-Nya” dapat merujuk kepada Allah Bapa atau kepada Anak; teks Yunani tidak menyebut rujukannya secara eksplisit di sini.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν εἰδῆτε
  choice: Jika kamu tahu
  rationale: Menyampaikan klausa bersyarat secara alami dalam bahasa Indonesia; bentuk οἶδα di sini menyatakan pengetahuan.
- source_word: δίκαιός
  choice: benar
  rationale: Dalam konteks ini menunjuk pada sifat moral yang benar. Pilihan ini juga membentuk hubungan alami dengan tindakan 'berbuat benar'.
- source_word: γινώσκετε
  choice: kamu tahu
  rationale: Dipahami sebagai bentuk indikatif, sehingga menyatakan kesimpulan yang diketahui, bukan perintah. Pengulangan 'tahu' mempertahankan kesejajaran kedua verba Yunani meskipun leksemnya berbeda.
- source_word: πᾶς ὁ ποιῶν τὴν δικαιοσύνην
  choice: setiap orang yang berbuat benar
  rationale: Partisipel kini menggambarkan perilaku yang menjadi ciri seseorang. Ungkapan ini lebih alami daripada 'melakukan kebenaran' dan tetap menghubungkan perbuatan orang itu dengan sifat-Nya yang benar.
- source_word: ἐξ αὐτοῦ
  choice: dari-Nya
  rationale: Mempertahankan gagasan asal atau sumber dalam ἐξ tanpa mengubahnya secara eksplisit menjadi pelaku dengan frasa 'oleh-Nya'.
- source_word: γεγέννηται
  choice: telah lahir
  rationale: Bentuk perfekt pasif menggambarkan kelahiran yang sudah terjadi dengan akibat yang tetap berlaku. 'Telah lahir' merupakan ungkapan Indonesia yang alami dan mempertahankan citra kelahiran.
theological_decisions:
- issue: Rujukan Dia/-Nya dalam δίκαιός ἐστιν dan ἐξ αὐτοῦ
  choice: Mempertahankan pronomina Dia/-Nya tanpa menyebut Bapa atau Anak.
  alternative: Menyebut Allah Bapa atau Anak secara eksplisit.
  rationale: Konteks dapat dipahami menunjuk kepada Bapa ataupun Anak, sedangkan ayat Yunani ini sendiri tidak menyebut rujukannya secara eksplisit. Terjemahan tidak memutuskan ketegangan tersebut.
- issue: Nuansa kelahiran ilahi dalam γεγέννηται ἐξ αὐτοῦ
  choice: telah lahir dari-Nya
  alternative: telah diperanakkan oleh-Nya
  rationale: Pilihan utama mempertahankan metafora asal-usul ilahi dengan bahasa Indonesia modern dan tidak mempersempit ἐξ menjadi penanda pelaku semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Berbuat benar' dipilih sebagai ungkapan etis yang alami serta mudah dipahami; kapitalisasi Dia/-Nya menandai rujukan ilahi tanpa menentukan apakah yang dimaksud Bapa atau Anak.
