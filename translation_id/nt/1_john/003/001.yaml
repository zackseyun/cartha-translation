id: 1JN.3.1
reference: 1 John 3:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἴδετε ποταπὴν ἀγάπην δέδωκεν ἡμῖν ὁ πατὴρ ἵνα τέκνα θεοῦ κληθῶμεν, ⸂καὶ ἐσμέν⸃. διὰ τοῦτο ὁ κόσμος οὐ γινώσκει ⸀ἡμᾶς ὅτι οὐκ ἔγνω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/001.yaml
  text: See what kind of love the Father has given to us[a], that we should be called children of God—and we are. For this reason the world does not know us[e][d][c][b], because it did not know him.
translation:
  language: id
  text: Lihatlah betapa luar biasanya kasih yang telah Bapa berikan kepada kita[a], sehingga kita disebut anak-anak Allah—dan memang demikianlah kita.[b] Itulah sebabnya dunia tidak mengenal kita[c], karena dunia tidak mengenal Dia.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “kasih macam apa” atau “kasih seperti apa”; ungkapan Yunani menyatakan kekaguman terhadap sifat atau kualitas kasih Bapa.'
    reason: lexical_alternative
  - marker: b
    text: Sebagian naskah tidak memuat “dan memang demikianlah kita.”
    reason: textual_variant
  - marker: c
    text: 'Atau: “tidak mengakui kita” atau “tidak mengenali kita.”'
    reason: lexical_alternative
  - marker: d
    text: “Dia” paling wajar merujuk kepada Bapa dalam ayat ini; sebagian orang memahaminya sebagai rujukan kepada Kristus dalam konteks tulisan Yohanes.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: Lihatlah
  rationale: Imperatif yang mengajak para pembaca memberi perhatian; bentuk ini langsung, alami, dan tetap bermartabat.
- source_word: ποταπὴν ἀγάπην
  choice: betapa luar biasanya kasih
  rationale: ποταπός menyatakan keheranan terhadap sifat atau kualitas kasih, bukan hanya ukurannya. Ungkapan ini menyampaikan kekaguman tersebut secara alami dalam bahasa Indonesia; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: δέδωκεν ἡμῖν
  choice: yang telah Bapa berikan kepada kita
  rationale: Bentuk perfektum menunjukkan pemberian pada masa lalu yang hasilnya tetap berlaku; 'telah ... berikan' mempertahankan nuansa itu.
- source_word: ὁ πατὴρ
  choice: Bapa
  rationale: Merupakan sebutan definitif bagi Allah dalam konteks Yohanes; bentuk Indonesia yang lazim adalah 'Bapa' tanpa artikel.
- source_word: ἵνα τέκνα θεοῦ κληθῶμεν
  choice: sehingga kita disebut anak-anak Allah
  rationale: ἵνα di sini dapat menyatakan tujuan atau hasil/isi pemberian kasih. 'Sehingga' mempertahankan hubungan itu dengan alami, sedangkan τέκνα bersifat inklusif dan tepat diterjemahkan 'anak-anak'.
- source_word: καὶ ἐσμέν
  choice: dan memang demikianlah kita
  rationale: Menjaga penegasan bahwa sebutan 'anak-anak Allah' menyatakan kenyataan, bukan gelar kosong.
- source_word: διὰ τοῦτο
  choice: Itulah sebabnya
  rationale: Menandai hubungan penjelasan atau akibat dengan kalimat sebelumnya secara jelas dan idiomatis.
- source_word: ὁ κόσμος
  choice: dunia
  rationale: Mempertahankan istilah khas Yohanes tanpa menafsirkannya lebih sempit dalam teks utama.
- source_word: οὐ γινώσκει ἡμᾶς
  choice: tidak mengenal kita
  rationale: γινώσκω dapat berarti mengenal atau mengakui/mengenali. 'Mengenal' mempertahankan kesejajaran dengan klausa berikutnya dan merupakan padanan langsung.
- source_word: οὐκ ἔγνω αὐτόν
  choice: tidak mengenal Dia
  rationale: Mempertahankan pengulangan verba Yunani serta ambiguitas formal pronomina; kapitalisasi menandai rujukan ilahi tanpa menentukan Bapa atau Kristus di dalam teks utama.
theological_decisions:
- issue: Rujukan αὐτόν
  choice: '''Dia'' dalam teks utama, dengan Bapa sebagai rujukan paling wajar menurut sintaksis langsung'
  alternative: Kristus
  rationale: Anteseden eksplisit terdekat ialah Bapa, tetapi konteks Yohanes yang lebih luas memungkinkan sebagian pembaca memahami Kristus. Teks utama tidak menambahkan nama, dan catatan kaki mempertahankan alternatif tersebut.
- issue: Keberadaan καὶ ἐσμέν
  choice: Dimasukkan sebagai 'dan memang demikianlah kita'
  alternative: Ditiadakan menurut sebagian naskah
  rationale: SBLGNT memasukkan frasa ini, dan frasa tersebut menegaskan realitas status pembaca sebagai anak-anak Allah. Variannya dicatat.
- issue: Hubungan ἵνα dengan pemberian kasih
  choice: Diterjemahkan 'sehingga'
  alternative: '''supaya'' atau ''yaitu bahwa'''
  rationale: Konstruksi dapat bernuansa tujuan, hasil, atau isi yang menjelaskan kasih Bapa. 'Sehingga' menjaga hubungan yang terbuka tanpa memaksakan satu analisis teologis yang sempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. 'Lihatlah' mempertahankan seruan pembuka; 'betapa luar biasanya kasih' mengungkapkan keheranan kualitatif secara alami. Pengulangan 'dunia' pada klausa terakhir dipakai untuk menghindari ambiguitas subjek dalam bahasa Indonesia. Semua penanda catatan kaki ditempatkan pada bagian teks yang relevan.
