source:
  edition: SBLGNT
  text: ὃς δ’ ἂν ἔχῃ τὸν βίον τοῦ κόσμου καὶ θεωρῇ τὸν ἀδελφὸν αὐτοῦ χρείαν ἔχοντα καὶ κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ, πῶς ἡ ἀγάπη τοῦ θεοῦ μένει ἐν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/017.yaml
  text: But whoever has the world's goods and sees his brother in need[c][b][a], yet closes his heart against him—how does the love of God remain in him?
translation:
  language: id
  text: Namun, siapa saja yang mempunyai harta duniawi dan melihat saudaranya[a] yang berkekurangan, tetapi menutup hatinya terhadapnya[b], bagaimanakah kasih Allah[c] tetap ada di dalam dirinya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melihat saudaranya mempunyai kebutuhan.” Kata Yunani untuk “saudara” berbentuk maskulin tunggal dan dapat dipakai secara representatif untuk saudara atau saudari; dalam konteks ini dapat merujuk kepada sesama orang percaya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menutup bagian-bagian dalam tubuhnya terhadapnya,” sebuah ungkapan untuk menahan belas kasihan yang mendalam.
    reason: lexical_alternative
  - marker: c
    text: “Kasih Allah” dapat berarti kasih Allah yang ada di dalam dirinya atau kasihnya kepada Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: βίον τοῦ κόσμου
  choice: harta duniawi
  rationale: βίος dalam konteks ini menunjuk pada sarana hidup atau milik materi. 'Harta duniawi' alami dalam bahasa Indonesia dan sesuai dengan kontras antara kepemilikan dan kebutuhan saudara seiman.
- source_word: θεωρῇ
  choice: melihat
  rationale: θεωρέω menyatakan pengamatan langsung; 'melihat' menyampaikan kesadaran nyata akan kebutuhan orang lain tanpa nuansa terlalu formal.
- source_word: ἀδελφὸν αὐτοῦ
  choice: saudara seimannya
  rationale: ἀδελφός secara leksikal berarti saudara, tetapi dalam pemakaian Yohanes di sini menunjuk pada sesama orang percaya. Bentuk 'saudara seimannya' mempertahankan istilah kekerabatan sekaligus menjernihkan relasi yang dimaksud.
- source_word: χρείαν ἔχοντα
  choice: berkekurangan
  rationale: Ungkapan ini secara harfiah berarti 'mempunyai kebutuhan'. 'Berkekurangan' secara alami menyatakan keadaan tidak memiliki keperluan hidup yang memadai.
- source_word: κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ
  choice: menutup hatinya terhadap dia
  rationale: σπλάγχνα secara harfiah adalah bagian dalam tubuh dan secara idiomatis pusat belas kasihan. Ungkapan Indonesia ini mempertahankan metafora penolakan batin yang disengaja.
- source_word: πῶς
  choice: bagaimanakah
  rationale: πῶς membuka pertanyaan retoris. 'Bagaimanakah' mempertahankan bentuk pertanyaannya tanpa menambahkan modalitas yang tidak dinyatakan secara eksplisit.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: kasih Allah
  rationale: Genitif Yunani dapat menunjuk pada kasih yang berasal dari Allah atau kasih seseorang kepada Allah. 'Kasih Allah' mempertahankan ambiguitas itu dalam bahasa Indonesia.
- source_word: μένει ἐν αὐτῷ
  choice: tetap ada di dalam dirinya
  rationale: μένω adalah istilah penting dalam tulisan Yohanes yang menyatakan keberadaan yang berkelanjutan. 'Tetap ada' mudah dipahami dan mempertahankan daya duratifnya.
theological_decisions:
- issue: Ambiguitas genitif dalam ἡ ἀγάπη τοῦ θεοῦ
  choice: kasih Allah
  alternative: kasih dari Allah; kasih kepada Allah
  rationale: Bentuk Yunani memungkinkan nuansa kasih Allah yang hadir dalam diri seseorang maupun kasih orang itu kepada Allah. Terjemahan utama tidak memutuskan salah satu secara sepihak.
- issue: Cakupan ἀδελφός
  choice: saudara seimannya
  alternative: saudaranya; saudara atau saudari seimannya
  rationale: Konteks surat menunjukkan sesama orang percaya. Kata 'saudara' mempertahankan citra kekeluargaan, sementara catatan kaki menerangkan bahwa bentuk maskulin tunggal dapat dipakai secara representatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pertanyaan retoris serta ambiguitas teologis pada 'kasih Allah' dipertahankan; idiom anatomi Yunani diterjemahkan dengan metafora hati yang alami dalam bahasa Indonesia.
