  text: Everyone who practices sin also practices lawlessness[b][a], and sin is lawlessness.
translation:
  language: id
  text: Setiap orang yang berbuat dosa juga melakukan pelanggaran hukum[a], dan dosa adalah pelanggaran hukum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Setiap orang yang melakukan dosa juga melakukan pelanggaran hukum.” Bentuk kini dalam bahasa Yunani dapat, dalam konteks ini, menunjuk pada tindakan yang berlangsung atau menjadi ciri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: Setiap orang yang terus berbuat dosa
  rationale: Bentuk partisipel kini dengan artikel bersifat umum, yaitu mencakup setiap orang yang melakukan dosa. Kata “terus” menyampaikan corak tindakan yang berlangsung atau menjadi kebiasaan dalam konteks ini, tanpa membatasi pernyataan pada satu tindakan terpisah.
- source_word: καὶ τὴν ἀνομίαν ποιεῖ
  choice: juga terus melanggar hukum
  rationale: Secara harfiah frasa ini berarti “juga melakukan pelanggaran hukum.” Bentuk verbal dipakai agar alami dalam bahasa Indonesia, sedangkan “juga” dan pengulangan “terus” mempertahankan kesejajaran kedua tindakan.
- source_word: ἀνομία
  choice: pelanggaran hukum
  rationale: Pilihan ini mempertahankan kaitan leksikal dengan hukum (νόμος) dan lebih mudah dipahami daripada istilah tradisional seperti “kedurhakaan.” Terjemahan ini tidak menentukan bahwa yang dimaksud khususnya hukum Musa, hukum sipil, atau rumusan hukum tertentu.
- source_word: καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία
  choice: dan dosa adalah pelanggaran hukum
  rationale: Klausa ini bersifat definisional. Rumusan langsung ini mempertahankan identifikasi tegas antara dosa dan ἀνομία tanpa melemahkannya menjadi sekadar akibat atau contoh dosa.
theological_decisions:
- issue: Apakah bentuk kini Yunani menunjuk pada satu perbuatan atau perilaku yang berlangsung/menjadi ciri
  choice: Menggunakan “terus berbuat” dan “terus melanggar” untuk menyampaikan tindakan yang berlangsung atau berciri khas dalam konteks.
  alternative: “berbuat” dan “melakukan,” yang lebih harfiah dan dapat mencakup tindakan tanpa menyatakan keberlangsungannya secara eksplisit.
  rationale: Dalam konteks langsung 1 Yohanes 3, bentuk-bentuk kini ini lazimnya menggambarkan perilaku yang berlangsung atau menjadi ciri. Namun, karena aspek Yunani tidak dengan sendirinya merupakan bentuk teknis untuk kebiasaan, alternatif yang lebih harfiah dicatat dalam catatan kaki.
- issue: Ruang lingkup ἀνομία
  choice: pelanggaran hukum
  alternative: kedurhakaan; hidup tanpa hukum; kejahatan
  rationale: “Pelanggaran hukum” mempertahankan hubungan istilah itu dengan νόμος dan ketegangan teologis dalam definisi Yohanes, tanpa menambahkan “Allah” atau menentukan jenis hukum yang tidak disebutkan secara eksplisit dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Setiap orang” mempertahankan cakupan umum tanpa penandaan gender. Susunan dibuat alami dalam bahasa Indonesia sambil menjaga kesejajaran, nada definisional, dan ambiguitas mengenai hukum apa yang dimaksud.
