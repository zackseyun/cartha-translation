id: 1JN.3.21
reference: 1 John 3:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀγαπητοί, ἐὰν ἡ καρδία ⸂μὴ καταγινώσκῃ ἡμῶν⸃, παρρησίαν ἔχομεν πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/021.yaml
  text: Beloved[a], if our heart does not condemn us, we have confidence before God[c][b],
translation:
  language: id
  text: Saudara-saudara yang terkasih, jika hati kita[a] tidak menyatakan kita bersalah[b], kita memiliki keberanian di hadapan Allah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''Hati'' di sini menunjuk pada batin atau kesadaran moral seseorang; maknanya dapat dibandingkan dengan ''hati nurani''.'
    reason: cultural_note
  - marker: b
    text: 'Atau: “tidak menyalahkan kita” atau “tidak menghukum kita.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “keyakinan di hadapan Allah” atau “kebebasan untuk berbicara di hadapan Allah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Saudara-saudara yang terkasih
  rationale: Sapaan jamak penuh kasih ini mempertahankan kaitannya dengan tema kasih dalam 1 Yohanes sekaligus terdengar wajar dan bermartabat dalam bahasa Indonesia.
- source_word: ἐὰν
  choice: jika
  rationale: Partikel ini memperkenalkan klausa bersyarat dan paling wajar diterjemahkan dengan 'jika'.
- source_word: ἡ καρδία
  choice: hati kita
  rationale: '''Hati'' mempertahankan metafora sumber bagi batin atau kesadaran moral, tanpa mempersempit maknanya menjadi istilah psikologis ''hati nurani'' dalam teks utama.'
- source_word: μὴ καταγινώσκῃ ἡμῶν
  choice: tidak menyatakan kita bersalah
  rationale: Ungkapan ini mempertahankan nuansa penilaian yang menjatuhkan vonis atau menyalahkan, serta lebih alami daripada mengatakan bahwa hati 'menghukum' kita.
- source_word: παρρησίαν
  choice: keberanian
  rationale: Dalam konteks relasi dengan Allah, kata ini menyatakan kebebasan, keterbukaan, dan keyakinan untuk berada di hadapan-Nya. 'Keberanian' mempertahankan daya ungkapnya tanpa menjadikannya kepastian subjektif semata.
- source_word: πρὸς τὸν θεόν
  choice: di hadapan Allah
  rationale: Frasa ini menyatakan kedudukan atau relasi seseorang terhadap Allah; 'di hadapan Allah' alami dalam konteks penilaian batin dan kehadiran ilahi.
theological_decisions:
- issue: Makna daya batin yang ditunjuk oleh καρδία
  choice: hati
  alternative: hati nurani
  rationale: '''Hati'' mempertahankan ungkapan Yohanes dan keluasan makna batin manusia. Fungsi seperti hati nurani dijelaskan dalam catatan tanpa mengganti metafora asli.'
- issue: Nuansa παρρησίαν dalam relasi dengan Allah
  choice: keberanian di hadapan Allah
  alternative: keyakinan di hadapan Allah
  rationale: Pilihan ini menyampaikan sikap terbuka dan tidak gentar di hadapan Allah, tanpa menghilangkan rasa hormat atau mengubahnya menjadi klaim mengenai kepastian perasaan.
- issue: Nuansa penghakiman dalam καταγινώσκῃ
  choice: menyatakan kita bersalah
  alternative: menyalahkan kita; menghukum kita
  rationale: Ungkapan pilihan mempertahankan nuansa keputusan yang menentang seseorang dan selaras dengan konteks ayat sebelumnya, tetapi tidak menyiratkan pelaksanaan hukuman.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada akrab dan bermartabat. Struktur kalimat mengikuti alur Yunani, sedangkan ungkapan 'menyatakan kita bersalah' dipilih agar nuansa moral-yudisialnya jelas dan tetap alami.
