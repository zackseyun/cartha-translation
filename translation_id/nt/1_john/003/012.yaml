source:
  edition: SBLGNT
  text: οὐ καθὼς Κάϊν ἐκ τοῦ πονηροῦ ἦν καὶ ἔσφαξεν τὸν ἀδελφὸν αὐτοῦ· καὶ χάριν τίνος ἔσφαξεν αὐτόν; ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν, τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/012.yaml
  text: not like Cain[a], who was from the evil one and slaughtered his brother. And why did he slaughter him? Because his deeds were evil[b], but those of his brother were righteous.
translation:
  language: id
  text: Janganlah kita menjadi seperti Kain, yang berasal dari si jahat[a] dan membantai[b] saudaranya. Mengapa ia membantainya? Karena perbuatannya jahat, sedangkan perbuatan saudaranya benar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berasal dari kejahatan.” Ungkapan Yunani ini dapat dipahami secara lebih abstrak, tetapi dalam tulisan Yohanes biasanya menunjuk kepada si jahat sebagai pribadi.
    reason: alternative_reading
  - marker: b
    text: Kata Yunani yang diterjemahkan “membantai” lebih kuat daripada kata umum untuk “membunuh” dan menggambarkan tindakan membunuh dengan keras.
    reason: lexical_note
lexical_decisions:
- source_word: οὐ καθὼς Κάϊν
  choice: Jangan seperti Kain
  rationale: Dalam kesinambungan dengan nasihat pada ayat sebelumnya, bentuk ini menyampaikan perbandingan negatif secara alami dalam bahasa Indonesia.
- source_word: ἐκ τοῦ πονηροῦ
  choice: berasal dari si jahat
  rationale: Mempertahankan ἐκ sebagai penanda asal dan memahami bentuk berartikel τοῦ πονηροῦ secara personal, sesuai penggunaan yang lazim dalam tulisan Yohanes, sambil mencatat kemungkinan abstrak.
- source_word: ἔσφαξεν
  choice: membantai
  rationale: Kata σφάζω lebih keras dan lebih gamblang daripada sekadar 'membunuh'; 'membantai' mempertahankan daya ungkap kekerasannya.
- source_word: χάριν τίνος
  choice: Mengapa
  rationale: Padanan Indonesia yang alami bagi pertanyaan mengenai alasan.
- source_word: τὰ ἔργα αὐτοῦ πονηρὰ ἦν
  choice: perbuatan-perbuatannya jahat
  rationale: ἔργα dalam konteks etis ini paling alami diterjemahkan sebagai 'perbuatan-perbuatan'; bentuk jamak mempertahankan bentuk sumber.
- source_word: τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια
  choice: sedangkan perbuatan-perbuatan saudaranya benar
  rationale: Mengisi nomina yang dilesapkan dalam bahasa Yunani agar kontrasnya jelas dan alami; 'benar' menyatakan mutu moral δίκαια.
theological_decisions:
- issue: Apakah τοῦ πονηροῦ menunjuk kepada pribadi atau kejahatan secara abstrak
  choice: 'pribadi: ''si jahat'''
  alternative: 'abstrak: ''kejahatan'''
  rationale: Bentuk berartikel dan kebiasaan penggunaan dalam tulisan Yohanes mendukung rujukan personal, tetapi kemungkinan abstrak tetap dicatat karena frasa Yunani dapat dipahami demikian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan lugas. 'Si jahat' mempertahankan rujukan personal tanpa menambahkan nama atau gelar yang tidak terdapat dalam teks. 'Membantai' dipilih untuk mempertahankan kekuatan σφάζω; catatan [b] ditempatkan setelah kalimat agar tidak mengganggu alur pertanyaan retoris.
