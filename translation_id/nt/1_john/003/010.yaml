  text: ἐν τούτῳ φανερά ἐστιν τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου· πᾶς ὁ μὴ ποιῶν δικαιοσύνην οὐκ ἔστιν ἐκ τοῦ θεοῦ, καὶ ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/010.yaml
  text: 'By this the children of God and the children of the devil are evident: everyone who does not practice righteousness is not from God[c][b][a], nor is the one who does not love his brother.'
translation:
  language: id
  text: 'Dengan hal inilah tampak jelas siapa anak-anak Allah dan siapa anak-anak Iblis: setiap orang yang tidak melakukan kebenaran[b] tidak berasal dari Allah, dan demikian pula orang yang tidak mengasihi saudaranya.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Atau “keadilan.” Kata Yunani dapat berarti kebenaran atau keadilan; di sini konteksnya terutama menekankan perilaku yang benar.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “saudara laki-lakinya.” Dalam konteks surat ini, istilah tersebut dapat merujuk kepada saudara seiman, baik laki-laki maupun perempuan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Dengan inilah
  rationale: Ungkapan ini menunjuk pada dasar atau sarana yang membuat perbedaan tersebut dapat dikenali, sambil mempertahankan kemungkinan nuansa “dalam hal ini” atau “dari hal ini” dalam catatan kaki.
- source_word: φανερά ἐστιν
  choice: tampak nyata
  rationale: Adjektiva predikatif ini menyatakan bahwa kedua kelompok tersebut dapat dikenali atau terlihat jelas. “Tampak nyata” alami dalam bahasa Indonesia dan tidak memberi kesan bahwa mereka baru mulai menjadi nyata.
- source_word: τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου
  choice: anak-anak Allah dan anak-anak Iblis
  rationale: Bahasa kekeluargaan dalam teks dipertahankan karena mengungkapkan asal atau keberpihakan rohani yang menjadi ciri teologi Yohanes.
- source_word: πᾶς ὁ μὴ ποιῶν δικαιοσύνην
  choice: setiap orang yang tidak melakukan kebenaran
  rationale: Partisipel kini berartikel menyatakan pola perilaku yang menjadi ciri seseorang. “Melakukan kebenaran” mempertahankan ungkapan etis Yohanes dan menunjuk pada hidup yang benar, bukan sekadar mengetahui hal yang benar.
- source_word: οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: tidak berasal dari Allah
  rationale: Preposisi ἐκ menyatakan sumber, asal, atau keberadaan yang berhubungan dengan Allah tanpa mempersempitnya menjadi rumusan doktrinal tertentu.
- source_word: καὶ ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ
  choice: begitu pula orang yang tidak mengasihi saudaranya
  rationale: “Begitu pula” secara alami menerapkan kembali predikat “tidak berasal dari Allah” pada klausa kedua, sebagaimana elipsis dalam bahasa Yunani. “Saudaranya” mempertahankan istilah kekeluargaan, sedangkan cakupan kontekstualnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Bahasa kekeluargaan untuk identitas rohani dan moral
  choice: anak-anak Allah dan anak-anak Iblis
  alternative: orang-orang yang menjadi milik Allah dan orang-orang yang menjadi milik Iblis
  rationale: Teks Yunani secara eksplisit memakai τέκνα, “anak-anak.” Mempertahankan metafora ini menjaga ketegangan teologis Yohanes antara asal atau keberpihakan rohani dan perilaku yang terlihat.
- issue: Arti etis δικαιοσύνη
  choice: kebenaran
  alternative: keadilan; apa yang benar
  rationale: Dalam konteks ini istilah tersebut menunjuk pada perilaku benar yang selaras dengan Allah. “Kebenaran” mempertahankan istilah teologis yang lazim, sementara kemungkinan “keadilan” dicatat tanpa menjadikannya satu-satunya arti.
- issue: Cakupan ἀδελφός dalam bentuk maskulin tunggal
  choice: saudaranya
  alternative: saudara laki-lakinya; saudara seimannya
  rationale: Bahasa Indonesia tidak selalu menandai gender pada kata “saudara.” Pilihan ini alami dan mempertahankan bahasa relasional, sedangkan bentuk maskulin Yunani dan kemungkinan acuan kepada sesama orang percaya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Struktur kontras dan metafora kekeluargaan dipertahankan, sedangkan elipsis Yunani disampaikan secara alami melalui “begitu pula.”
