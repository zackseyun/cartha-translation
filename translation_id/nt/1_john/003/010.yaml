  to: 'Dengan hal inilah tampak jelas siapa anak-anak Allah dan siapa anak-anak Iblis: setiap orang yang tidak melakukan kebenaran[b] tidak berasal dari Allah, dan demikian pula orang yang tidak mengasihi saudaranya.[c]'
