  text: ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην, ὅτι ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν· καὶ ἡμεῖς ὀφείλομεν ὑπὲρ τῶν ἀδελφῶν τὰς ψυχὰς ⸀θεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/016.yaml
  text: 'By this we have come to know love: that he laid down his life for us[b][a], and we ought to lay down our lives for the brothers.'
translation:
  language: id
  text: 'Dari sinilah kita telah mengenal kasih: Ia telah menyerahkan nyawa-Nya bagi kita, dan kita pun wajib menyerahkan nyawa kita bagi saudara-saudara seiman.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Secara harfiah, “saudara-saudara”; dalam konteks ini, istilah tersebut kemungkinan mencakup semua sesama orang percaya, baik laki-laki maupun perempuan.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Dengan inilah
  rationale: Konstruksi ini menunjukkan dasar atau sarana untuk mengenal kasih. “Dengan inilah” alami dalam bahasa Indonesia dan tetap mempertahankan kemungkinan nuansa “dalam hal inilah.”
- source_word: ἐγνώκαμεν
  choice: kita telah mengenal
  rationale: Bentuk perfektum menyatakan pengenalan yang telah terjadi dan hasilnya tetap berlaku kini.
- source_word: τὴν ἀγάπην
  choice: kasih
  rationale: “Kasih” merupakan padanan baku dan bermartabat bagi ἀγάπη dalam konteks ini.
- source_word: ἐκεῖνος
  choice: Ia
  rationale: Kata ganti itu secara kontekstual menunjuk kepada Yesus, tetapi nama-Nya tidak ditambahkan agar bentuk teks Yunani tetap terpelihara.
- source_word: ὑπὲρ ἡμῶν
  choice: bagi kita
  rationale: Menyatakan tindakan demi kepentingan atau atas nama kita tanpa mempersempitnya menjadi satu rumusan teori pendamaian tertentu.
- source_word: τὴν ψυχὴν αὐτοῦ ἔθηκεν
  choice: telah menyerahkan nyawa-Nya
  rationale: Dalam ungkapan Yohanes ini, ψυχή berarti nyawa atau hidup seseorang, sedangkan τίθημι menyatakan penyerahan diri secara sukarela. “Menyerahkan nyawa” akurat dan wajar dalam bahasa Indonesia.
- source_word: ὀφείλομεν
  choice: kita pun wajib
  rationale: Kata kerja ini menyatakan kewajiban moral; “wajib” menyampaikan daya tuntutnya dengan jelas.
- source_word: ὑπὲρ τῶν ἀδελφῶν
  choice: bagi saudara-saudara seiman
  rationale: Dalam konteks jemaat, bentuk maskulin jamak ini menunjuk kepada sesama orang percaya. “Saudara-saudara seiman” mempertahankan citra kekerabatan sekaligus menjelaskan lingkupnya.
- source_word: τὰς ψυχὰς θεῖναι
  choice: menyerahkan nyawa kita
  rationale: Mengulang ungkapan yang sama seperti pada tindakan Kristus dan mempertahankan kesejajaran etis yang disengaja dalam ayat ini.
theological_decisions:
- issue: Rujukan ἐκεῖνος
  choice: Kata ganti “Ia” secara kontekstual merujuk kepada Yesus Kristus.
  alternative: Menerjemahkannya secara lebih demonstratif sebagai “Dia itu” tanpa menjelaskan rujukannya.
  rationale: Konteks surat dan ungkapan menyerahkan nyawa menunjukkan Yesus sebagai teladan kasih, sementara penerjemahan dengan kata ganti tidak menambahkan nama yang tidak tertulis dalam ayat.
- issue: Daya makna ὑπὲρ ἡμῶν
  choice: “bagi kita”
  alternative: “menggantikan kita” atau “demi kita”
  rationale: “Bagi kita” mempertahankan makna tindakan demi kepentingan atau atas nama orang lain tanpa menetapkan secara berlebihan suatu mekanisme pendamaian tertentu.
- issue: Lingkup τῶν ἀδελφῶν
  choice: “saudara-saudara seiman,” yang dalam konteks mencakup sesama orang percaya secara umum
  alternative: “saudara-saudara laki-laki” atau “saudara-saudari”
  rationale: Bentuk Yunani bersifat maskulin jamak tetapi lazim berfungsi secara representatif dalam komunitas. Pilihan ini menjaga metafora keluarga dan menjelaskan konteks gerejawinya tanpa membatasi rujukan hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Nyawa” dipilih untuk menegaskan kehidupan yang diserahkan dalam kematian, sedangkan pengulangan “menyerahkan nyawa” mempertahankan kesejajaran retoris antara tindakan Kristus dan kewajiban umat.
