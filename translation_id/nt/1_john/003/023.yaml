    rationale: Klausa Yunani menyatakan “sebagaimana Ia telah memberi/ memberikan perintah kepada kita,” bukan terutama kesesuaian dengan suatu perintah. Terjemahan langsung juga menjaga subjek tersirat tanpa penafsiran tambahan.
