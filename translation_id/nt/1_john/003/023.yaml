  rationale: Revisi mengganti preposisi yang tidak idiomatis dengan “kepada,” sambil mempertahankan “nama Anak-Nya” sebagai unsur sumber. Klausa terakhir diterjemahkan lebih langsung untuk mencerminkan καθὼς dan verba “memberikan perintah,” tanpa menentukan lebih jauh identitas subjek tersirat. Catatan kaki yang semula hanya menjelaskan bentuk yang kini menjadi teks utama dihapus; penanda yang tersisa ditempatkan pada ungkapan terkait.
