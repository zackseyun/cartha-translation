  text: καὶ αὕτη ἐστὶν ἡ ἐντολὴ αὐτοῦ, ἵνα ⸀πιστεύσωμεν τῷ ὀνόματι τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ καὶ ἀγαπῶμεν ἀλλήλους, καθὼς ἔδωκεν ἐντολὴν ⸀ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/023.yaml
  text: 'And this is his command: that we believe in the name of his Son Jesus the Messiah and love one another[d][c][b][a], just as he gave us command.'
translation:
  language: id
  text: 'Dan inilah perintah-Nya: supaya kita percaya kepada nama Anak-Nya, Yesus Sang Mesias, dan saling mengasihi, sebagaimana Ia telah memberikan perintah kepada kita.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menaruh kepercayaan pada nama Anak-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολή
  choice: perintah
  rationale: Kata 'perintah' alami dalam bahasa Indonesia modern dan mempertahankan daya mengikat dari nomina Yunani; bentuk tunggal dipertahankan.
- source_word: ἵνα πιστεύσωμεν
  choice: supaya kita percaya
  rationale: Sesudah 'inilah perintah-Nya', ἵνα memperkenalkan isi perintah. 'Supaya kita percaya' mempertahankan nuansa subjunktif-hortatif secara wajar.
- source_word: πιστεύω τῷ ὀνόματι
  choice: percaya dalam nama
  rationale: Ungkapan ini mempertahankan metafora Yohanes tentang iman yang diarahkan kepada pribadi sebagaimana dinyatakan oleh nama-Nya; alternatif yang lebih idiomatis ialah 'percaya kepada nama' atau 'menaruh kepercayaan pada nama'.
- source_word: υἱοῦ αὐτοῦ
  choice: Anak-Nya
  rationale: Huruf kapital menandai rujukan kristologis kepada Yesus sebagai Anak Allah tanpa mengubah makna leksikal.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός berfungsi sebagai gelar dan diterjemahkan 'Mesias'; 'Sang' membuat bentuk gelar itu alami dan bermartabat dalam bahasa Indonesia.
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: saling mengasihi
  rationale: Bentuk ini merupakan ungkapan resiprokal yang alami dan tepat bagi perintah kasih dalam konteks komunitas.
- source_word: καθὼς
  choice: sesuai dengan
  rationale: Di sini καθὼς mengaitkan tindakan percaya dan mengasihi dengan perintah yang telah diberikan; 'sesuai dengan' menyampaikan keselarasan itu secara alami.
- source_word: ἔδωκεν ἐντολὴν ἡμῖν
  choice: perintah yang telah diberikan-Nya kepada kita
  rationale: Susunan ini mempertahankan nomina 'perintah' dan pengulangannya, tetapi menghindari frasa Indonesia yang kaku seperti 'memberikan perintah kepada kita' tanpa penentu.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam frasa ini Χριστός tetap jelas berfungsi sebagai gelar bagi Yesus. 'Mesias' menyampaikan makna gelar tersebut, sedangkan 'Kristus' dapat terdengar seperti bagian dari nama diri.
- issue: Daya ungkapan πιστεύω τῷ ὀνόματι
  choice: percaya dalam nama
  alternative: menaruh kepercayaan pada nama
  rationale: Terjemahan utama mempertahankan ungkapan khas Yohanes dan ketegangan metaforisnya tanpa mereduksinya menjadi sekadar menerima kebenaran sebuah sebutan.
- issue: Hubungan καθὼς dengan klausa sebelumnya
  choice: sesuai dengan perintah yang telah diberikan-Nya kepada kita
  alternative: sebagaimana Ia telah memberikan perintah kepada kita
  rationale: Pilihan utama alami dalam bahasa Indonesia serta membiarkan satu perintah tunggal mencakup percaya dan saling mengasihi. Alternatif lebih dekat pada bentuk sintaksis Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'perintah-Nya', 'Anak-Nya', dan 'diberikan-Nya' memakai kapitalisasi pronomina ilahi yang lazim dalam penerbitan Alkitab Indonesia. Penanda catatan kaki [a] dan [b] ditempatkan dalam teks utama.
