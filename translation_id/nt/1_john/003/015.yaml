  text: πᾶς ὁ μισῶν τὸν ἀδελφὸν αὐτοῦ ἀνθρωποκτόνος ἐστίν, καὶ οἴδατε ὅτι πᾶς ἀνθρωποκτόνος οὐκ ἔχει ζωὴν αἰώνιον ἐν ⸀αὐτῷ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/015.yaml
  text: Everyone who hates his brother is a murderer[b][a], and you know that every murderer does not have eternal life remaining in him.
translation:
  language: id
  text: Setiap orang yang membenci saudaranya[a] adalah pembunuh, dan kamu tahu bahwa tidak seorang pembunuh pun memiliki hidup kekal yang tetap tinggal[b] di dalam dirinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''Saudaranya'' dalam konteks ini kemungkinan menunjuk kepada sesama orang percaya; kata Yunani yang dipakai berbentuk tunggal maskulin.'
    reason: cultural_note
  - marker: b
    text: Atau “menetap” atau “berdiam.” Kata kerja Yunani μένω merupakan istilah penting dalam tulisan Yohanes dan sering berarti “tinggal,” “menetap,” atau “berdiam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ μισῶν
  choice: Setiap orang yang membenci
  rationale: Partisipel kini berartikel menyatakan golongan secara umum dan dapat mengandung gagasan sikap yang terus berlangsung atau menjadi ciri; bentuk ini alami dalam bahasa Indonesia tanpa menghilangkan daya umumnya.
- source_word: ἀδελφὸν αὐτοῦ
  choice: saudaranya
  rationale: Mempertahankan istilah kekerabatan dalam teks Yunani. Dalam konteks surat ini, kata tersebut kemungkinan besar menunjuk kepada saudara seiman; keterangan itu dicatat tanpa menggantikan bentuk sumber dengan tafsiran.
- source_word: ἀνθρωποκτόνος
  choice: pembunuh
  rationale: Padanan Indonesia yang baku dan wajar bagi orang yang membunuh manusia serta mempertahankan bobot moral istilah sumber.
- source_word: οἴδατε
  choice: kamu tahu
  rationale: Kata ganti 'kamu' dalam bahasa Indonesia dapat merujuk kepada jamak sesuai konteks; tidak perlu ditambah 'kalian' atau 'kamu semua' karena jumlahnya sudah dipahami dari sapaan surat.
- source_word: πᾶς ἀνθρωποκτόνος οὐκ ἔχει
  choice: tidak seorang pembunuh pun memiliki
  rationale: Susunan Yunani berupa universal yang dinegasikan menyatakan bahwa tidak ada pembunuh yang memiliki hal tersebut. Bentuk 'tidak seorang ... pun' menyampaikan cakupan itu secara jelas dan alami, tanpa kemungkinan salah baca bahwa hanya sebagian pembunuh yang dimaksud.
- source_word: ζωὴν αἰώνιον
  choice: hidup kekal
  rationale: Padanan baku dalam tulisan Yohanes yang mempertahankan dimensi keberlangsungan dan mutu hidup yang dimaksud.
- source_word: ἐν αὐτῷ μένουσαν
  choice: yang tetap tinggal di dalam dirinya
  rationale: Partisipel μένουσαν menerangkan 'hidup kekal' sebagai sesuatu yang tinggal atau menetap di dalam orang itu. 'Tetap tinggal' mempertahankan nuansa keberlanjutan dari istilah penting dalam tulisan Yohanes.
theological_decisions:
- issue: Cakupan kata ἀδελφός
  choice: Memakai 'saudaranya' dalam teks utama dan menjelaskan kemungkinan makna 'saudara seiman' dalam catatan kaki.
  alternative: sesama orang percaya; saudara atau saudarinya
  rationale: Konteks dekat berpusat pada kasih dalam komunitas orang percaya, tetapi teks sumber memakai nomina kekerabatan tunggal. Terjemahan tidak mengubahnya menjadi tafsiran yang lebih eksplisit.
- issue: Makna teologis μένω
  choice: Menerjemahkannya 'tetap tinggal'.
  alternative: berdiam; menetap
  rationale: '''Tetap tinggal'' mudah dipahami dan mempertahankan gagasan kesinambungan yang berulang dalam tulisan Yohanes, sedangkan alternatifnya dicatat agar hubungan leksikal tidak dianggap hanya mempunyai satu ungkapan Indonesia.'
- issue: Hubungan hidup kekal dengan pembunuh
  choice: Mempertahankan pernyataan tegas bahwa tidak seorang pembunuh pun memiliki hidup kekal yang tetap tinggal di dalam dirinya.
  alternative: Menafsirkan pernyataan sebagai hanya merujuk pada pelaku pembunuhan yang tidak bertobat atau pada kebiasaan membenci.
  rationale: Ayat ini sendiri tidak menyatakan pembatas tersebut. Terjemahan mempertahankan ketegangan dan ketegasan teks tanpa memasukkan penyelesaian teologis dari luar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat langsung serta mudah dibaca. Istilah 'hidup kekal' dipertahankan sebagai ungkapan Alkitabiah yang sudah umum, sedangkan 'tetap tinggal' dipilih untuk menyampaikan aspek berkelanjutan tanpa diksi yang terlalu arkais.
