  text: τεκνία, μηδεὶς πλανάτω ὑμᾶς· ὁ ποιῶν τὴν δικαιοσύνην δίκαιός ἐστιν, καθὼς ἐκεῖνος δίκαιός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/007.yaml
  text: Little children, let no one deceive you. The one who practices righteousness is righteous, just as that one is righteous.
translation:
  language: id
  text: Anak-anakku, jangan biarkan seorang pun menyesatkan kalian.[a] Orang yang melakukan apa yang benar adalah orang benar, sama seperti Dia[b] adalah benar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menipu kalian.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang itu.” Kemungkinan besar menunjuk kepada Kristus, meskipun sebagian orang memahaminya sebagai Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: τεκνία
  choice: Anak-anakku
  rationale: Sapaan jamak yang penuh kasih dan bernuansa kekeluargaan. Bentuk ini alami dalam bahasa Indonesia dan menyampaikan keakraban penulis tanpa perlu menambahkan kata sifat.
- source_word: μηδεὶς πλανάτω ὑμᾶς
  choice: jangan biarkan seorang pun menyesatkan kalian
  rationale: Larangan ini mempertahankan konstruksi ‘jangan biarkan seorang pun’ dan memakai ‘menyesatkan’ untuk mencakup gagasan menipu sekaligus membawa ke jalan yang keliru.
- source_word: ὁ ποιῶν
  choice: Orang yang melakukan
  rationale: Partisipel kini berartikel menunjuk pada orang yang bercirikan perbuatan tersebut. Dalam konteks ini, bentuk Indonesia yang alami menyampaikan tindakan yang menjadi pola hidup, bukan hanya satu tindakan terpisah.
- source_word: τὴν δικαιοσύνην
  choice: apa yang benar
  rationale: Dalam konteks etis ini, frasa tersebut menunjuk pada perilaku lurus yang sesuai dengan kebenaran. ‘Melakukan kebenaran’ kurang alami dan dapat terdengar seperti menyatakan fakta, sedangkan ‘melakukan apa yang benar’ jelas bagi pembaca modern.
- source_word: δίκαιός ἐστιν
  choice: adalah orang benar
  rationale: Pilihan ini membedakan sifat atau identitas pelaku dari tindakannya dan tetap mempertahankan hubungan makna dengan ‘melakukan apa yang benar’.
- source_word: καθὼς
  choice: sama seperti
  rationale: Menyatakan perbandingan atau kesesuaian dengan jelas dan alami.
- source_word: ἐκεῖνος
  choice: Dia
  rationale: Kapitalisasi menandai rujukan ilahi yang paling mungkin tanpa memasukkan nama ‘Kristus’ ke dalam teks. Catatan kaki mempertahankan keterbukaan apakah rujukannya Kristus atau Allah.
theological_decisions:
- issue: Rujukan ἐκεῖνος
  choice: Memakai ‘Dia’ dalam teks utama, dengan catatan bahwa rujukan yang paling mungkin ialah Kristus.
  alternative: Allah/Bapa, atau rujukan ilahi yang sengaja dibiarkan agak terbuka.
  rationale: Dalam konteks etika peneladanan di 1 Yohanes, kata ganti ini paling wajar menunjuk kepada Kristus, tetapi teks Yunani tidak menyebut nama-Nya. Karena itu, terjemahan tidak mengganti kata ganti dengan ‘Kristus’ dan mencatat kemungkinan lain.
- issue: Hubungan antara perbuatan benar dan status sebagai orang benar
  choice: Menerjemahkan pernyataan secara langsung tanpa menjelaskan apakah perbuatan menjadi sebab, bukti, atau wujud dari keadaan benar.
  alternative: Menambahkan bahasa penjelas seperti ‘membuktikan bahwa ia benar’ atau ‘menjadi benar karena melakukannya’.
  rationale: Teks menyatakan hubungan tersebut secara tegas tetapi tidak menguraikan mekanismenya. Menambahkan sebab atau bukti akan menyelesaikan ketegangan teologis yang dibiarkan oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada hangat dan bermartabat. ‘Kalian’ dipakai karena ὑμᾶς berbentuk jamak dan cocok dengan sapaan ‘Anak-anakku’. Struktur dibuat alami bagi pembaca umum sambil mempertahankan keterbukaan rujukan kata ganti dan ketegangan antara perilaku benar dan keadaan sebagai orang benar.
