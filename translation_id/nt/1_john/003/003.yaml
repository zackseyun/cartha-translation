  text: καὶ πᾶς ὁ ἔχων τὴν ἐλπίδα ταύτην ἐπ’ αὐτῷ ἁγνίζει ἑαυτὸν καθὼς ἐκεῖνος ἁγνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/003.yaml
  text: And everyone who has this hope set on him purifies himself[b][a], just as he is pure.
translation:
  language: id
  text: Dan setiap orang yang menaruh pengharapan ini kepada-Nya[a] menyucikan dirinya, sebagaimana Dia suci.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memiliki pengharapan ini di dalam Dia.” Frasa Yunani dapat menyatakan pribadi yang menjadi sasaran atau tumpuan pengharapan.'
    reason: lexical_alternative
  - marker: b
    text: Kata ganti “Dia” menerjemahkan bentuk demonstratif Yunani dan kemungkinan besar mengacu kepada Anak/Kristus dalam konteks ini, meskipun teks Yunani hanya memakai kata ganti dan tidak menyebut gelar-Nya.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ ἔχων
  choice: setiap orang yang menaruh
  rationale: Partisipel berartikel ini bersifat substantival dan umum. Dalam hubungannya dengan pengharapan, frasa Indonesia 'menaruh pengharapan' alami dan tetap menyampaikan sikap yang menjadi ciri orang tersebut.
- source_word: τὴν ἐλπίδα ταύτην
  choice: pengharapan ini
  rationale: Demonstratif ταύτην menunjuk kembali pada pengharapan yang disebut dalam konteks sebelumnya; 'pengharapan' menyatakan penantian penuh keyakinan, bukan sekadar keinginan.
- source_word: ἐπ’ αὐτῷ
  choice: kepada-Nya
  rationale: ἐπί dengan datif dapat menunjukkan pribadi yang menjadi sasaran atau tumpuan pengharapan. 'Kepada-Nya' wajar dalam bahasa Indonesia dan membuat arah pengharapan jelas tanpa menyisipkan gelar yang tidak terdapat dalam teks.
- source_word: ἁγνίζει ἑαυτὸν
  choice: menyucikan dirinya
  rationale: '''Menyucikan'' mempertahankan hubungan leksikal dengan ἁγνός dan mencakup nuansa kemurnian etis; ''dirinya'' secara alami merujuk kembali kepada ''setiap orang'' tanpa perlu menandai gender yang tidak wajib dalam bahasa Indonesia.'
- source_word: καθὼς
  choice: sama seperti
  rationale: Ungkapan ini menandai perbandingan secara jelas dan alami.
- source_word: ἐκεῖνος
  choice: Dia itu
  rationale: Demonstratif ini memberi penekanan pada pribadi yang dimaksud. 'Dia itu' mempertahankan unsur demonstratif tanpa menggantinya dengan 'Kristus' atau 'Anak' yang tidak disebutkan secara eksplisit.
- source_word: ἁγνός
  choice: suci
  rationale: Dalam konteks etis ini, 'suci' merupakan padanan alami yang juga mempertahankan kaitan dengan verba 'menyucikan'.
theological_decisions:
- issue: Acuan αὐτῷ dan ἐκεῖνος
  choice: Keduanya dibiarkan sebagai pronomina yang paling wajar dipahami mengacu kepada Kristus/Anak dalam konteks dekat.
  alternative: αὐτῷ dapat dipahami mengacu kepada Allah Bapa, atau pronomina-pronomina itu sengaja menyisakan keluwesan antara Bapa dan Anak.
  rationale: Konteks sebelumnya, terutama pengharapan untuk melihat Dia sebagaimana adanya, kuat menunjuk kepada Kristus. Namun, teks Yunani tidak menyebut gelar secara eksplisit, sehingga terjemahan tidak menghapus ambiguitas yang masih ada.
- issue: Bentuk refleksif maskulin tunggal ἑαυτὸν dalam pernyataan umum
  choice: Diterjemahkan 'dirinya'.
  alternative: Dapat dibuat eksplisit sebagai 'dirinya sendiri', tetapi bentuk itu lebih berat dan tidak diperlukan.
  rationale: Bahasa Indonesia tidak mewajibkan penandaan gender pada pronomina refleksif. 'Dirinya' secara tepat mempertahankan acuan tunggal generik kepada 'setiap orang' tanpa menambah atau mengurangi cakupan.
- issue: Peran manusia dalam ἁγνίζει ἑαυτὸν
  choice: Diterjemahkan secara langsung 'menyucikan dirinya'.
  alternative: Parafrasa pasif seperti 'membiarkan dirinya disucikan'.
  rationale: Bentuk Yunani aktif dan refleksif menyatakan tindakan subjek terhadap dirinya sendiri. Terjemahan tidak mengubahnya menjadi pasif atau menyelesaikan ketegangan teologis mengenai hubungan tindakan manusia dan karya ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pada '-Nya' dan 'Dia' menandai acuan ilahi yang paling mungkin tanpa memasukkan nama atau gelar ke dalam ayat. Penempatan catatan kaki mengikuti unsur yang dijelaskan.
