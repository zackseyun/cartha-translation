    rationale: μὴ ἀγαπῶμεν adalah ajakan negatif orang pertama jamak. Dalam bahasa Indonesia, "Janganlah kita mengasihi" menyatakannya dengan lebih langsung dan alami daripada "marilah kita mengasihi bukan."
  - severity: low
    issue: Cakupan preposisi pada frasa penutup tidak paralel
    rationale: ἐν hanya muncul sekali dan mencakup ἔργῳ καὶ ἀληθείᾳ. Terjemahan "dengan perbuatan dan kebenaran" mempertahankan kesatuan konstruksi itu tanpa mempersempit atau membedakan relasi kedua nomina.
