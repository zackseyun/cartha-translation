  text: ⸀Τεκνία, μὴ ἀγαπῶμεν λόγῳ μηδὲ τῇ γλώσσῃ ἀλλὰ ἐν ἔργῳ καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/018.yaml
  text: Little children[a], let us not love in word or with the tongue[b], but in deed and truth.
translation:
  language: id
  text: Anak-anakku, janganlah kita mengasihi dengan perkataan atau dengan lidah, melainkan dengan perbuatan dan kebenaran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τεκνία
  choice: Anak-anakku
  rationale: Sapaan jamak bernuansa kasih sayang. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan kekeluargaan serta kelembutan sapaan penulis tanpa menambahkan kata 'terkasih' yang tidak tersurat.
- source_word: μὴ ἀγαπῶμεν
  choice: marilah kita mengasihi bukan
  rationale: Subjungtif hortatoris orang pertama jamak menyatakan ajakan bersama. Susunan dengan 'bukan ... melainkan ...' secara alami menyampaikan larangan terhadap cara mengasihi yang hanya verbal, bukan larangan untuk mengasihi sama sekali.
- source_word: λόγῳ
  choice: dengan perkataan
  rationale: λόγος di sini menunjuk pada ungkapan verbal. 'Dengan perkataan' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: μηδὲ τῇ γλώσσῃ
  choice: ataupun dengan lidah
  rationale: Mempertahankan citra konkret γλῶσσα, 'lidah', sekaligus dapat dipahami secara metonimis sebagai ucapan. 'Ataupun' meneruskan unsur negatif dalam pasangan tersebut.
- source_word: ἀλλὰ
  choice: melainkan
  rationale: Dalam konstruksi 'bukan ... melainkan ...', pilihan ini secara kuat dan alami menandai pertentangan.
- source_word: ἐν ἔργῳ
  choice: dengan perbuatan
  rationale: ἔργον berarti tindakan atau perbuatan. Ungkapan ini menegaskan kasih yang diwujudkan secara konkret dan berpasangan alami dengan 'dengan perkataan'.
- source_word: καὶ ἀληθείᾳ
  choice: dan dalam kebenaran
  rationale: Mengulangi 'dalam' membuat hubungan ἀλήθεια dengan preposisi ἐν jelas dalam bahasa Indonesia. 'Kebenaran' mempertahankan nilai leksikal dan resonansi khas Yohanes tanpa mempersempitnya menjadi sekadar ketulusan.
theological_decisions:
- issue: Makna ἀληθείᾳ dalam frasa ἐν ἔργῳ καὶ ἀληθείᾳ
  choice: dalam kebenaran
  alternative: dengan tulus / dengan sungguh-sungguh
  rationale: 'Terjemahan ''kebenaran'' mempertahankan kemungkinan makna ganda: kasih yang nyata dan autentik, sekaligus kasih yang selaras dengan kebenaran Allah. Pilihan yang hanya menekankan ketulusan akan mempersempit ketegangan teologis teks.'
translation_notes:
  register: Bahasa Indonesia baku, modern, hangat, dan bermartabat. Sapaan 'Anak-anakku' mempertahankan nada pastoral; struktur 'bukan ... melainkan ...' membuat kontras Yunani jelas dan alami. Tidak diperlukan catatan kaki karena alternatif leksikal utama dapat diwakili secara memadai dalam teks.
