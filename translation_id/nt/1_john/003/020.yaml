id: 1JN.3.20
reference: 1 John 3:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ἐὰν καταγινώσκῃ ἡμῶν ἡ καρδία, ὅτι μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν καὶ γινώσκει πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/020.yaml
  text: for if our heart condemns us[a], God is greater than our heart[b], and he knows all things.
translation:
  language: id
  text: sebab jika hati kita menghukum kita[a], Allah lebih besar daripada hati kita[b] dan Dia mengetahui segala sesuatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyalahkan kita” atau “mendapati kita bersalah.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “Allah lebih besar daripada hati kita” dapat menunjuk pada pengetahuan-Nya yang lebih utuh tentang kebenaran mengenai diri kita dan, secara tersirat, pada wewenang-Nya atas penghukuman diri kita.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: sebab
  rationale: ὅτι pertama menjelaskan dasar bagi pernyataan sebelumnya; “sebab” menyampaikan fungsi penjelas itu secara alami dalam bahasa Indonesia.
- source_word: ἐὰν
  choice: jika
  rationale: Bersama bentuk subjungtif sekarang καταγινώσκῃ, kata ini menandai keadaan bersyarat; “jika” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: καταγινώσκῃ
  choice: menghukum
  rationale: Kata kerja ini dapat berarti menyalahkan, menemukan kesalahan, atau menjatuhkan penilaian negatif. “Menghukum” mempertahankan nuansa penghakiman batin dalam konteks ini tanpa mengubah καρδία menjadi “hati nurani.”
- source_word: ἡ καρδία
  choice: hati kita
  rationale: “Hati” mempertahankan metafora asli sebagai pusat kehidupan batin, sedangkan “hati nurani” akan mempersempit maknanya secara interpretatif.
- source_word: ὅτι
  choice: tidak diterjemahkan tersendiri
  rationale: ὅτι kedua memperkenalkan isi atau dasar penegasan bahwa Allah lebih besar daripada hati kita. Dalam susunan bahasa Indonesia, dayanya tetap terpelihara tanpa perlu mengulang “bahwa.”
- source_word: μείζων
  choice: lebih besar
  rationale: Padanan ini mempertahankan keluasan perbandingan Yunani tanpa membatasinya hanya pada pengetahuan, belas kasihan, atau wewenang.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: “Allah” adalah padanan baku θεός dalam bahasa Indonesia.
- source_word: τῆς καρδίας ἡμῶν
  choice: daripada hati kita
  rationale: Genitif sesudah bentuk komparatif secara alami dinyatakan dengan “daripada”; pengulangan “hati kita” menjaga perbandingan tetap jelas.
- source_word: γινώσκει πάντα
  choice: Dia mengetahui segala sesuatu
  rationale: Ungkapan ini mempertahankan cakupan menyeluruh πάντα dan menggunakan ragam bahasa yang alami serta bermartabat.
theological_decisions:
- issue: Makna bahwa Allah “lebih besar daripada hati kita”
  choice: Pernyataan diterjemahkan secara luas tanpa dipersempit hanya kepada belas kasihan, wewenang, atau kemahatahuan Allah.
  alternative: Allah lebih berbelas kasih daripada hati yang menghukum kita; keputusan Allah mengatasi penghukuman diri; atau Allah mengetahui kebenaran sepenuhnya melampaui penilaian kita yang terbatas.
  rationale: Teks Yunani menyatakan secara umum bahwa Allah lebih besar daripada hati kita, lalu menambahkan bahwa Dia mengetahui segala sesuatu. Klausa berikut menonjolkan pengetahuan Allah, tetapi bentuk perbandingan itu sendiri tetap lebih luas dan patut dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Istilah “hati” dipertahankan demi metafora Yohanes; ambiguitas teologis pada “lebih besar” tidak diselesaikan secara sepihak. Huruf kapital pada “Dia” mengikuti kebiasaan hormat yang masih lazim dalam teks keagamaan Indonesia.
