  text: καὶ οἴδατε ὅτι ἐκεῖνος ἐφανερώθη ἵνα τὰς ⸀ἁμαρτίας ἄρῃ, καὶ ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/005.yaml
  text: And you know that he appeared in order to take away sins[b][a], and in him there is no sin.
translation:
  language: id
  text: Kamu tahu bahwa Dia telah menampakkan diri untuk menyingkirkan dosa-dosa[a], dan di dalam Dia tidak ada dosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membawa pergi dosa-dosa.” Kata Yunani yang digunakan dapat berarti mengangkat, membawa, atau menyingkirkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: kamu tahu
  rationale: Bentuk perfek οἶδα lazim memiliki makna kini dalam bahasa Yunani Koine; “kamu tahu” merupakan padanan Indonesia yang alami dan tepat.
- source_word: ἐκεῖνος
  choice: Dia
  rationale: Kata ini secara harfiah dapat berarti “dia itu,” tetapi dalam konteks Yohanes menunjuk secara tegas kepada Kristus. “Dia” alami dalam bahasa Indonesia, dan huruf kapital membantu menunjukkan rujukan yang sudah jelas tanpa menambahkan nama yang tidak terdapat dalam ayat.
- source_word: ἐφανερώθη
  choice: telah menyatakan diri
  rationale: Bentuk pasif φανερόω menunjuk pada penampakan historis Kristus. Ungkapan “menyatakan diri” mempertahankan gagasan bahwa sosok yang sebelumnya tidak tampak menjadi nyata, dan lebih alami daripada “dimanifestasikan.”
- source_word: ἵνα
  choice: untuk
  rationale: Dalam konstruksi ini ἵνα menyatakan tujuan. “Untuk” menyampaikan maksud tersebut secara ringkas dan alami.
- source_word: ἁμαρτίας
  choice: dosa-dosa
  rationale: Bentuk jamak dipertahankan agar tindakan-tindakan dosa yang beragam tidak diratakan menjadi nomina tunggal.
- source_word: ἄρῃ
  choice: menyingkirkan
  rationale: αἴρω dapat berarti mengangkat, membawa, atau menyingkirkan. “Menyingkirkan” menyatakan penghapusan dosa tanpa menentukan secara berlebihan mekanisme penebusan; kemungkinan nuansa “membawa pergi/menanggung” dicatat dalam catatan kaki.
- source_word: ἁμαρτία
  choice: dosa
  rationale: Nomina tunggal tanpa artikel paling alami diterjemahkan “dosa,” yang menyatakan bahwa pada diri-Nya sama sekali tidak terdapat dosa.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Padanan ini mempertahankan ungkapan khas Yohanes dan makna lokatif-relasional dari ἐν dengan datif.
theological_decisions:
- issue: Rujukan ἐκεῖνος
  choice: Dia, yakni Yesus Kristus menurut konteks
  alternative: dia itu; sosok tersebut
  rationale: Sosok yang menyatakan diri untuk menyingkirkan dosa dan yang tidak memiliki dosa adalah Yesus Kristus dalam konteks langsung. Terjemahan tidak menyisipkan nama “Yesus Kristus” ke dalam teks ayat karena nama itu tidak dinyatakan di sini.
- issue: Makna αἴρω ketika objeknya adalah dosa-dosa
  choice: menyingkirkan dosa-dosa
  alternative: membawa pergi atau menanggung dosa-dosa
  rationale: Pilihan utama menekankan hasil berupa disingkirkannya dosa, sesuai konteks, tetapi catatan kaki mempertahankan keluasan leksikal verba Yunani dan tidak membatasi ayat pada satu rumusan mekanisme penebusan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Kamu” dipilih sebagai sapaan jamak yang alami kepada para pembaca; kapitalisasi “Dia” mengikuti kebiasaan Indonesia untuk rujukan ilahi. Susunan kalimat mempertahankan dua klausa Yunani dan pengulangan kata “dosa.”
