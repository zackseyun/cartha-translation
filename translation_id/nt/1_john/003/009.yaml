id: 1JN.3.9
reference: 1 John 3:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ ἁμαρτίαν οὐ ποιεῖ, ὅτι σπέρμα αὐτοῦ ἐν αὐτῷ μένει, καὶ οὐ δύναται ἁμαρτάνειν, ὅτι ἐκ τοῦ θεοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/009.yaml
  text: Everyone who has been born of God does not practice sin[a], because his seed remains in him; and he is not able to keep sinning[c][b], because he has been born of God.
translation:
  language: id
  text: Setiap orang yang telah dilahirkan dari Allah tidak terus berbuat dosa[a], sebab benih-Nya tetap ada di dalam dirinya[b]. Ia tidak dapat terus berbuat dosa[c], sebab ia telah dilahirkan dari Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “tidak berbuat dosa” atau “tidak melakukan dosa.” Dalam konteks ini, susunan bahasa Yunani kemungkinan menunjuk pada perbuatan dosa yang terus berlangsung, bukan satu tindakan saja.
    reason: lexical_alternative
  - marker: b
    text: Atau “tinggal di dalam dirinya.”
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “ia tidak dapat berbuat dosa.” Dalam konteks ini, bentuk infinitif kala kini dalam bahasa Yunani kemungkinan bermakna “terus berbuat dosa.”
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ γεγεννημένος
  choice: Setiap orang yang telah dilahirkan
  rationale: Frasa ini menyatakan suatu golongan secara umum dan universal. Bentuk perfektum dipertahankan dengan 'telah dilahirkan' untuk menunjukkan tindakan kelahiran yang hasilnya tetap berlangsung.
- source_word: ἐκ τοῦ θεοῦ
  choice: dari Allah
  rationale: Kata depan ἐκ menyatakan asal atau sumber dalam bahasa Yohanes tentang kelahiran baru; 'dari Allah' merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: ἁμαρτίαν οὐ ποιεῖ
  choice: tidak terus berbuat dosa
  rationale: Secara formal berarti 'tidak berbuat dosa', tetapi kala kini dan konteksnya mendukung tindakan yang berlanjut atau menjadi pola. 'Terus berbuat dosa' menyampaikan hal itu tanpa menghapus alternatif harfiahnya.
- source_word: σπέρμα αὐτοῦ
  choice: benih-Nya
  rationale: Metafora konkret 'benih' dipertahankan karena rujukannya tidak dijelaskan secara tegas dalam teks dan dapat dipahami dengan beberapa cara.
- source_word: ἐν αὐτῷ μένει
  choice: tetap ada di dalam dirinya
  rationale: μένω menyatakan keberadaan yang berlanjut. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan 'tinggal/menetap' tanpa memakai bahasa yang terlalu arkais.
- source_word: οὐ δύναται ἁμαρτάνειν
  choice: Ia tidak dapat terus berbuat dosa
  rationale: Secara lebih harfiah, frasa ini berarti 'ia tidak dapat berbuat dosa'. Infinitif kala kini dalam konteks paling wajar dipahami sebagai tindakan berkelanjutan; kata 'terus' membuat nuansa itu jelas sambil mencatat bentuk harfiahnya dalam catatan kaki.
- source_word: γεγέννηται
  choice: ia telah dilahirkan
  rationale: Bentuk perfektum menunjukkan kelahiran yang telah terjadi dengan akibat yang masih berlaku; 'telah dilahirkan' mempertahankan aspek tersebut.
theological_decisions:
- issue: Apakah ayat ini mengajarkan ketidakberdosaan mutlak atau ketidakselarasan kelahiran dari Allah dengan kehidupan yang terus-menerus berdosa
  choice: Teks utama menyatakan bahwa orang yang dilahirkan dari Allah tidak terus menjalani perbuatan dosa.
  alternative: Orang tersebut sama sekali tidak dapat melakukan satu dosa pun.
  rationale: Bentuk kala kini ποιεῖ dan ἁμαρτάνειν, bersama konteks 1 Yohanes 1:8–2:1, mendukung pengertian tindakan yang berlanjut. Namun, bentuk yang lebih harfiah tetap dicatat agar ketegangan dalam teks tidak disembunyikan.
- issue: Makna 'benih-Nya'
  choice: Metafora 'benih-Nya' dipertahankan tanpa dijelaskan dalam teks utama.
  alternative: Menafsirkannya secara eksplisit sebagai firman Allah, hidup Allah, atau kodrat Allah.
  rationale: Teks Yunani tidak menetapkan rujukan metafora itu secara tegas. Mempertahankannya menghindari pemasukan tafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. 'Dilahirkan dari Allah' mempertahankan metafora kelahiran dan asal ilahi. Kapitalisasi pada '-Nya' merujuk kepada Allah, sedangkan 'dirinya' merujuk kepada orang yang telah dilahirkan dari Allah. Pengulangan 'terus berbuat dosa' sengaja dipertahankan untuk mencerminkan kesejajaran kedua klausa Yunani.
