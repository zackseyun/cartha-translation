id: 1JN.3.8
reference: 1 John 3:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/008.yaml
  text: 'The one who practices sin is from the devil[a], because the devil has been sinning from the beginning[d][c][b]. For this purpose the Son of God was revealed: to destroy the works of the devil.'
translation:
  language: id
  text: 'Orang yang terus berbuat dosa[a] berasal dari Iblis[b], sebab Iblis terus berbuat dosa sejak semula[c]. Untuk tujuan inilah Anak Allah telah dinyatakan[d]: untuk menghancurkan pekerjaan-pekerjaan Iblis[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melakukan dosa” atau “berbuat dosa.” Bentuk partisipel kini dalam bahasa Yunani dapat menunjukkan tindakan yang berlangsung atau menjadi ciri hidup, bukan hanya satu tindakan yang terpisah.
    reason: lexical_alternative
  - marker: b
    text: Atau “adalah dari Iblis.” Kata Yunani yang secara harfiah berarti “dari” menyatakan sumber atau keterarahan moral-rohani.
    reason: alternative_reading
  - marker: c
    text: Ungkapan “sejak semula” tidak menentukan secara khusus apakah yang dimaksud ialah awal penciptaan, awal pemberontakan Iblis, atau awal dosa manusia.
    reason: ambiguity
  - marker: d
    text: Atau “menjadi nyata” atau “menampakkan diri.” Kata Yunaninya menekankan penyataan atau penampakan Anak Allah.
    reason: lexical_alternative
  - marker: e
    text: Atau “membongkar” atau “meniadakan pekerjaan-pekerjaan Iblis.” Kata Yunaninya secara harfiah dapat berarti “melepaskan” atau “menguraikan,” dan dalam konteks ini berarti membatalkan atau menghancurkan pekerjaan-pekerjaan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν τὴν ἁμαρτίαν
  choice: orang yang terus berbuat dosa
  rationale: Partisipel kini ποιῶν menyatakan tindakan yang berlangsung atau menjadi ciri hidup. Kata 'terus' memperjelas daya aspek ini tanpa mengubahnya menjadi pernyataan tentang satu tindakan dosa yang terpisah.
- source_word: ἐκ τοῦ διαβόλου
  choice: berasal dari Iblis
  rationale: ἐκ menandai sumber atau keterarahan moral-rohani. 'Berasal dari' mempertahankan metafora sumber tanpa menyiratkan bahwa orang tersebut secara harfiah diperanakkan oleh Iblis.
- source_word: ὁ διάβολος
  choice: Iblis
  rationale: Dalam konteks ini διάβολος merupakan sebutan personal yang sudah mapan bagi lawan Allah, bukan sekadar kata umum 'pemfitnah'.
- source_word: ὅτι ἀπ’ ἀρχῆς
  choice: sebab ... sejak semula
  rationale: ὅτι memberikan alasan, sedangkan ἀπ’ ἀρχῆς dipertahankan secara terbuka sebagai 'sejak semula' tanpa menentukan secara khusus semula yang mana.
- source_word: ἁμαρτάνει
  choice: terus berbuat dosa
  rationale: Bentuk kini bersama 'sejak semula' menunjukkan kegiatan khas yang berlanjut; 'terus berbuat dosa' menyampaikan daya duratifnya secara alami dalam bahasa Indonesia.
- source_word: εἰς τοῦτο
  choice: untuk tujuan inilah
  rationale: Frasa ini menunjuk ke depan kepada klausa tujuan dengan ἵνα dan menyatakan maksud kemunculan Anak Allah.
- source_word: ἐφανερώθη
  choice: menyatakan diri
  rationale: Aoristus pasif φανερόω secara idiomatis dapat bermakna 'tampil/menjadi nyata'. 'Menyatakan diri' mengungkapkan manifestasi pribadi Anak Allah dengan wajar, meski bentuk gramatikal Indonesianya aktif-refleksif.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Anak Allah
  rationale: Padanan baku yang mempertahankan gelar kristologis dan hubungan keanakan yang eksplisit.
- source_word: ἵνα λύσῃ
  choice: yaitu untuk menghancurkan
  rationale: ἵνα menyatakan tujuan. λύω secara harfiah berarti melepaskan atau menguraikan, tetapi dengan objek 'pekerjaan-pekerjaan Iblis' berarti membongkar, meniadakan, atau menghancurkannya.
- source_word: τὰ ἔργα τοῦ διαβόλου
  choice: pekerjaan-pekerjaan Iblis
  rationale: Bentuk jamak dan hubungan genitif dipertahankan. 'Pekerjaan-pekerjaan' cukup luas untuk mencakup tindakan Iblis beserta hasil atau pengaruhnya.
theological_decisions:
- issue: Daya bahasa dosa dalam bentuk kini pada etika Yohanes
  choice: Tindakan yang berlangsung atau menjadi ciri dinyatakan dengan 'terus berbuat dosa'.
  alternative: Pernyataan mutlak mengenai satu tindakan dosa apa pun.
  rationale: Pilihan ini menjaga perbedaan antara pola dosa yang menetap dan satu tindakan terpisah, sekaligus mempertahankan ketegangan dengan pengakuan surat ini bahwa orang percaya masih dapat berbuat dosa.
- issue: Makna 'berasal dari Iblis'
  choice: Sumber atau keterarahan moral-rohani.
  alternative: Asal-usul ontologis atau diperanakkan secara harfiah oleh Iblis.
  rationale: Bahasa sumber dalam dualisme Yohanes menyatakan afiliasi etis-rohani; terjemahan mempertahankan metaforanya tanpa menambahkan gagasan keturunan harfiah.
- issue: Tujuan penyataan Anak Allah
  choice: Anak Allah menyatakan diri untuk menghancurkan atau membongkar pekerjaan-pekerjaan Iblis.
  alternative: Anak Allah hanya menyingkapkan pekerjaan-pekerjaan Iblis.
  rationale: Konstruksi ἵνα dengan λύσῃ menyatakan tujuan berupa tindakan pembongkaran atau peniadaan yang tegas, bukan sekadar penyingkapan.
- issue: Rujukan waktu 'sejak semula'
  choice: Dibiarkan tidak ditentukan.
  alternative: Ditetapkan khusus sebagai awal penciptaan, pemberontakan Iblis, atau awal dosa manusia.
  rationale: Teks tidak menetapkan rujukan tertentu, sehingga ambiguitas temporal-teologis Yohanes perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Terus berbuat dosa' dipilih agar pola tindakan terbaca jelas oleh pembaca umum. Kapitalisasi 'Iblis', 'Anak', dan 'Allah' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
