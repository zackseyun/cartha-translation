  text: ⸀μὴ θαυμάζετε, ⸀ἀδελφοί, εἰ μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/013.yaml
  text: Do not be surprised[a], brothers, if the world hates you.
translation:
  language: id
  text: Janganlah heran, saudara-saudara[a], jika dunia membenci kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Yunani, sapaan ini berbentuk jamak maskulin, tetapi di sini kemungkinan ditujukan kepada seluruh komunitas orang percaya, termasuk perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: Janganlah heran
  rationale: Larangan dengan μή dan imperatif kini paling wajar disampaikan sebagai “Janganlah heran”; bentuk ini mempertahankan daya larangan tanpa terdengar kuno.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Vokatif jamak maskulin ini merupakan sapaan kepada sesama anggota komunitas iman. “Saudara-saudara” adalah sapaan baku dan bermartabat dalam bahasa Indonesia serta dapat mencakup seluruh jemaat; cakupan tersebut dijelaskan dalam catatan kaki.
- source_word: εἰ
  choice: jika
  rationale: Partikel kondisional diterjemahkan secara langsung sebagai “jika”, sehingga sifat kondisi yang dinyatakan teks tetap dipertahankan dan tidak diubah menjadi kepastian temporal seperti “ketika”.
- source_word: μισεῖ
  choice: membenci
  rationale: Bentuk kini indikatif menyatakan kenyataan umum atau berkelanjutan; “membenci” menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: ὁ κόσμος
  choice: dunia
  rationale: “Dunia” mempertahankan keluasan istilah κόσμος dan bobot khasnya dalam tulisan Yohanes tanpa memasukkan tafsiran seperti “masyarakat yang menentang Allah” ke dalam teks utama.
theological_decisions:
- issue: Cakupan sapaan maskulin ἀδελφοί
  choice: Menggunakan “Saudara-saudara” dalam teks utama dengan catatan tentang cakupannya
  alternative: “Saudara-saudara laki-laki” atau “saudara-saudari”
  rationale: Bahasa Indonesia memakai “Saudara-saudara” sebagai sapaan jamak yang alami bagi komunitas dan tidak harus terbatas pada laki-laki. Catatan kaki menjaga informasi bahwa bentuk Yunani secara gramatikal maskulin, sekaligus menjelaskan bahwa konteks kemungkinan mencakup seluruh jemaat.
- issue: Makna teologis κόσμος dalam tulisan Yohanes
  choice: Menerjemahkan sebagai “dunia” tanpa perluasan interpretatif
  alternative: “tatanan dunia” atau “masyarakat yang menentang Allah”
  rationale: Istilah ini sering menunjuk umat manusia atau tatanan yang berlawanan dengan Allah, tetapi “dunia” mempertahankan keluasan dan ketegangan istilah sumber agar konteks yang menentukannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Kalian” dipakai untuk membedakan objek jamak ὑμᾶς dari sapaan “Saudara-saudara” serta menghindari bentuk “kamu sekalian” yang kurang luwes.
