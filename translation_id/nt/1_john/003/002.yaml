id: 1JN.3.2
reference: 1 John 3:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀγαπητοί, νῦν τέκνα θεοῦ ἐσμεν, καὶ οὔπω ἐφανερώθη τί ἐσόμεθα. ⸀οἴδαμεν ὅτι ἐὰν φανερωθῇ ὅμοιοι αὐτῷ ἐσόμεθα, ὅτι ὀψόμεθα αὐτὸν καθώς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/002.yaml
  text: Beloved[a], now we are children of God, and what we will be has not yet been revealed. We know that if he is revealed, we will be like him[b], because we will see him as he is.
translation:
  language: id
  text: Saudara-saudara yang terkasih, sekarang kita adalah anak-anak Allah, dan belum dinyatakan seperti apa kita kelak. Kita tahu bahwa jika Ia dinyatakan[a][b], kita akan serupa dengan-Nya, sebab kita akan melihat Dia sebagaimana adanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jika hal itu dinyatakan,” yaitu seperti apa kita kelak; subjek kata kerja Yunani tidak disebutkan. Konteks lebih mendukung “Ia,” yang merujuk kepada Kristus.
    reason: alternative_reading
  - marker: b
    text: Banyak terjemahan menerjemahkan bagian ini, “ketika Ia menampakkan diri.” Secara lebih harfiah, teks Yunani berbunyi “jika Ia dinyatakan” dan memakai kata kerja yang sama seperti dalam bagian sebelumnya pada ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Saudara-saudara yang terkasih
  rationale: Sapaan jamak ini menyampaikan kehangatan dan kasih tanpa membatasi jenis kelamin; bentuk tersebut alami dalam ragam Alkitab Indonesia modern.
- source_word: νῦν
  choice: sekarang
  rationale: Menandai keadaan umat percaya pada masa kini, yang dikontraskan dengan keadaan mereka kelak.
- source_word: τέκνα θεοῦ
  choice: anak-anak Allah
  rationale: Menyatakan hubungan sebagai anak tanpa memasukkan pembedaan gender yang tidak terdapat dalam teks Yunani.
- source_word: οὔπω ἐφανερώθη
  choice: belum dinyatakan
  rationale: Mempertahankan bentuk pasif dan gagasan bahwa keadaan mendatang itu belum tersingkap.
- source_word: τί ἐσόμεθα
  choice: seperti apa kita kelak
  rationale: Mengungkapkan keadaan atau sifat umat percaya pada masa mendatang secara alami dalam bahasa Indonesia, bukan identitas pribadi mereka.
- source_word: οἴδαμεν
  choice: Kita tahu
  rationale: Padanan langsung dengan makna kini; 'kita' sesuai dengan sapaan inklusif penulis kepada para pembaca.
- source_word: ἐὰν φανερωθῇ
  choice: jika Ia dinyatakan
  rationale: Mempertahankan bentuk bersyarat, bentuk pasif, dan hubungan leksikal dengan 'belum dinyatakan' sebelumnya. Huruf kapital menunjukkan bahwa konteks paling mungkin merujuk kepada Kristus.
- source_word: ὅμοιοι αὐτῷ
  choice: serupa dengan-Nya
  rationale: '''Serupa'' menyatakan kemiripan nyata tanpa menyiratkan kesamaan identitas atau hakikat.'
- source_word: ὀψόμεθα αὐτὸν
  choice: kita akan melihat Dia
  rationale: Menerjemahkan bentuk mendatang dan objek langsung secara jelas.
- source_word: καθώς ἐστιν
  choice: sebagaimana adanya
  rationale: Ungkapan Indonesia yang ringkas ini mempertahankan gagasan melihat Kristus sesuai dengan keadaan-Nya yang nyata tanpa menambahkan penjelasan yang tidak terdapat dalam teks.
theological_decisions:
- issue: Rujukan subjek tersirat dalam ἐὰν φανερωθῇ
  choice: 'Subjek dipahami sebagai Kristus: ''jika Ia dinyatakan.'''
  alternative: 'Subjek dapat dipahami sebagai keadaan umat percaya kelak: ''jika hal itu dinyatakan''; terjemahan yang lebih interpretatif ialah ''ketika Ia menampakkan diri.'''
  rationale: Konteks langsung tentang melihat Dia dan menjadi serupa dengan-Nya lebih mendukung Kristus sebagai rujukan. Catatan kaki tetap mempertahankan ambiguitas gramatikal Yunani.
- issue: Sifat keserupaan umat percaya dengan Kristus kelak
  choice: '''Kita akan menjadi serupa dengan-Nya'' menyatakan keserupaan yang nyata, bukan kesamaan identitas atau hakikat.'
  alternative: Ungkapan yang lebih kuat seperti 'kita akan menjadi sama seperti Dia.'
  rationale: ὅμοιοι berarti serupa atau mirip, bukan identik; karena itu terjemahan tidak boleh melebihkan pernyataan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'Saudara-saudara yang terkasih' mempertahankan nada pastoral; struktur kalimat dibuat alami sambil menjaga pengulangan kata 'dinyatakan' dan ketegangan antara keadaan sekarang dengan pengungkapan pada masa mendatang.
