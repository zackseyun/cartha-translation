  text: πᾶς ὁ ἐν αὐτῷ μένων οὐχ ἁμαρτάνει· πᾶς ὁ ἁμαρτάνων οὐχ ἑώρακεν αὐτὸν οὐδὲ ἔγνωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/006.yaml
  text: Everyone who remains in him does not sin[a]; everyone who sins has not seen him nor known him.
translation:
  language: id
  text: Setiap orang yang tetap di dalam Dia tidak terus berbuat dosa[a]; setiap orang yang terus berbuat dosa tidak pernah melihat Dia ataupun mengenal Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “tidak berbuat dosa … setiap orang yang berbuat dosa.” Bentuk-bentuk present dalam bahasa Yunani dapat dipahami sebagai tindakan yang berlangsung atau menjadi kebiasaan; karena itu diterjemahkan “tidak terus berbuat dosa … terus berbuat dosa.”
    reason: Alternatif leksikal dan aspektual yang mempertahankan ambiguitas bentuk present Yunani.
lexical_decisions:
- source_word: πᾶς ὁ
  choice: setiap orang yang
  rationale: Konstruksi ini bersifat umum dan mencakup siapa pun yang termasuk dalam kategori yang disebutkan; ungkapan ini alami serta mempertahankan daya universalnya.
- source_word: ἐν αὐτῷ μένων
  choice: yang tetap di dalam Dia
  rationale: μένω menyatakan keberlanjutan dalam relasi dan merupakan istilah penting dalam tulisan Yohanes. 'Tetap' mudah dipahami, sedangkan 'di dalam Dia' mempertahankan gambaran relasional teks sumber.
- source_word: οὐχ ἁμαρτάνει
  choice: tidak terus berbuat dosa
  rationale: Bentuk present dapat menggambarkan tindakan yang berlangsung atau menjadi kebiasaan. 'Tidak terus berbuat dosa' menyampaikan kemungkinan aspek itu tanpa mengubah pernyataan menjadi penyangkalan bahwa orang percaya pernah melakukan satu dosa pun. Terjemahan lebih harfiah dicatat dalam catatan kaki.
- source_word: πᾶς ὁ ἁμαρτάνων
  choice: setiap orang yang terus berbuat dosa
  rationale: Partisipel present selaras dengan verba present pada klausa pertama dan dapat menunjuk pada tindakan yang berlangsung atau berciri tetap; pengulangan 'terus' menjaga kesejajaran kedua klausa.
- source_word: οὐχ ἑώρακεν αὐτόν
  choice: belum pernah melihat Dia
  rationale: Bentuk perfektum menyatakan keadaan kini yang berasal dari tidak adanya pengalaman melihat. Dalam konstruksi Indonesia, 'belum pernah' secara alami menyampaikan keadaan itu, tanpa menyiratkan bahwa penglihatan tersebut pasti akan terjadi kemudian.
- source_word: οὐδὲ ἔγνωκεν αὐτόν
  choice: ataupun mengenal Dia
  rationale: οὐδέ menghubungkan dua penyangkalan secara erat. γινώσκω di sini dapat mencakup pengenalan relasional, yang dipertahankan oleh 'mengenal', bukan sekadar 'mengetahui tentang'.
- source_word: αὐτῷ / αὐτόν
  choice: Dia
  rationale: Teks Yunani memakai pronomina dan tidak memperjelas acuannya dalam ayat ini. Pronomina dipertahankan agar terjemahan tidak menetapkan 'Allah' atau 'Kristus' secara lebih khusus daripada sumber.
theological_decisions:
- issue: Apakah ayat ini mengajarkan bahwa orang yang tetap di dalam Dia sama sekali tidak pernah melakukan dosa
  choice: 'Bentuk present diterjemahkan sebagai tindakan yang berlangsung atau berciri kebiasaan: ''tidak terus berbuat dosa'' dan ''terus berbuat dosa''.'
  alternative: Terjemahan formal 'tidak berbuat dosa' dan 'yang berbuat dosa'.
  rationale: Pilihan utama mencerminkan kemungkinan daya aspektual bentuk present dalam konteks surat, sambil mempertahankan tuntutan etis yang kuat. Catatan kaki menjaga keterbukaan terhadap bentuk yang lebih formal dan tidak menyembunyikan ambiguitas gramatikal.
- issue: Acuan pronomina αὐτῷ / αὐτόν
  choice: Mempertahankan pronomina 'Dia'.
  alternative: Menjelaskan acuannya sebagai 'Allah', 'Anak', atau 'Kristus'.
  rationale: Ayat ini sendiri tidak menyebutkan acuan pronomina secara eksplisit. Mempertahankan pronomina menghindari penetapan teologis yang melampaui bentuk teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Huruf kapital pada 'Dia' mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia untuk pronomina ilahi, tetapi tidak memperjelas apakah acuannya adalah Bapa atau Anak. Frasa 'berbuat dosa' dipilih karena alami dan jelas bagi pembaca umum.
