  yaml_path: translation/nt/1_john/003/019.yaml
  text: By this we will know that we are from the truth[a], and before him we will persuade our hearts[b],
translation:
  language: id
  text: Dengan ini kita akan mengetahui bahwa kita berasal dari kebenaran[a], dan di hadapan-Nya kita akan meyakinkan hati kita[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “termasuk dalam kebenaran” atau “menjadi bagian dari kebenaran.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menenangkan hati kita” atau “membuat hati kita tenteram.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Dengan inilah
  rationale: Mempertahankan daya tunjuk frasa Yunani dan menyatakan sarana atau dasar untuk mengetahui hal yang disebut sesudahnya.
- source_word: γνωσόμεθα
  choice: kita akan mengetahui
  rationale: Menerjemahkan bentuk futur secara langsung tanpa menambahkan nuansa proses yang tidak diwajibkan oleh bentuk katanya.
- source_word: ἐκ τῆς ἀληθείας ἐσμέν
  choice: kita berasal dari kebenaran
  rationale: Mempertahankan gagasan sumber atau asal yang dibawa oleh ἐκ, tanpa menafsirkannya secara lebih jauh sebagai kepemilikan atau status umat Allah.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: di hadapan-Nya
  rationale: Ungkapan Indonesia yang alami dan dekat dengan makna berada di depan atau dalam hadirat seseorang; huruf kapital mengikuti konvensi Indonesia untuk pronomina yang merujuk kepada Allah.
- source_word: πείσομεν
  choice: kita akan meyakinkan
  rationale: Mempertahankan arti dasar πείθω dan ambiguitasnya, alih-alih langsung mempersempitnya menjadi tindakan menenangkan atau memberi rasa tenteram.
- source_word: τὴν καρδίαν ἡμῶν
  choice: hati kita
  rationale: Mengikuti bentuk tunggal kolektif dalam bahasa Yunani, yang juga wajar dalam bahasa Indonesia dengan subjek jamak.
theological_decisions:
- issue: Makna berasal dari kebenaran dalam teologi Yohanes
  choice: kita berasal dari kebenaran
  alternative: kita termasuk dalam kebenaran
  rationale: Rumusan yang berorientasi pada sumber dipertahankan agar teks tidak diperluas menjadi pernyataan doktrinal yang lebih tegas daripada bunyi ayat.
- issue: Arti πείσομεν ketika hati menjadi objeknya
  choice: meyakinkan hati kita
  alternative: menenangkan hati kita
  rationale: Pilihan utama mempertahankan arti leksikal dan ketegangan ungkapan Yunani; alternatif dalam catatan menjelaskan kemungkinan arti kontekstual berupa penenteraman batin di hadapan Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat tetap dekat dengan teks Yunani, sementara catatan kaki mempertahankan alternatif leksikal penting. Tanda koma pada akhir ayat dipertahankan karena kalimat berlanjut ke ayat berikutnya.
