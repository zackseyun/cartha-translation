source:
  edition: SBLGNT
  text: καὶ ὁ τηρῶν τὰς ἐντολὰς αὐτοῦ ἐν αὐτῷ μένει καὶ αὐτὸς ἐν αὐτῷ· καὶ ἐν τούτῳ γινώσκομεν ὅτι μένει ἐν ἡμῖν, ἐκ τοῦ πνεύματος οὗ ἡμῖν ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/024.yaml
  text: 'And the one who keeps his commandments remains in him[a], and he in him[b]. And by this we know that he remains in us: by the Spirit whom he gave to us.'
translation:
  language: id
  text: Orang yang menaati perintah-perintah-Nya tetap tinggal di dalam Dia, dan Dia di dalam orang itu. Dari Roh yang Dia berikan kepada kita, kita tahu bahwa Dia tetap tinggal di dalam kita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Melalui Roh yang Dia berikan kepada kita.” Kata depan Yunani dapat menekankan sumber maupun sarana.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῶν
  choice: menaati
  rationale: Dalam konteks perintah, τηρέω menyatakan tindakan memegang dan melaksanakan dengan setia. “Menaati” alami dalam bahasa Indonesia dan tidak mengurangi unsur ketaatan nyata.
- source_word: ἐντολάς
  choice: perintah-perintah
  rationale: Bentuk jamak dipertahankan, dan “perintah” merupakan padanan modern yang bermartabat serta sesuai dengan konteks Yohanes.
- source_word: μένει
  choice: tetap tinggal
  rationale: Ungkapan ini mempertahankan aspek keberlanjutan dari μένω dan istilah relasional khas tulisan Yohanes; ketiga kemunculannya diterjemahkan secara konsisten.
- source_word: ἐν αὐτῷ / αὐτὸς ἐν αὐτῷ
  choice: di dalam Dia / Dia di dalam orang itu
  rationale: “Di dalam” mempertahankan metafora sumber. Pada kemunculan terakhir, “orang itu” dipakai untuk menghindari ketaksaan pronomina Indonesia yang dapat membuat kedua pihak tampak sama, tanpa mengganti rujukan dengan nama eksplisit.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: Dengan inilah kita tahu
  rationale: Frasa ini secara alami menyatakan dasar atau sarana pengenalan, sambil tetap dekat dengan susunan Yunani.
- source_word: ἐκ τοῦ πνεύματος
  choice: dari Roh
  rationale: ἐκ secara langsung menyatakan sumber atau dasar. “Dari Roh” mempertahankan nuansa sumber yang sungguh ada dalam teks, sedangkan nuansa sarana dicatat sebagai alternatif.
- source_word: οὗ ἡμῖν ἔδωκεν
  choice: yang telah Dia berikan kepada kita
  rationale: Klausa relatif Indonesia tidak menandai personalitas melalui “yang”. Perfek bahasa Indonesia menyampaikan pemberian lampau dengan relevansi kini secara alami, tanpa mengubah identitas pemberi.
theological_decisions:
- issue: Rujukan αὐτῷ / αὐτός dan subjek μένει ἐν ἡμῖν
  choice: Pronomina ilahi dipertahankan sebagai “Dia”, dengan konteks menunjuk kepada Allah.
  alternative: Mengganti semua pronomina dengan “Allah”, atau memahami penyebutan terakhir secara khusus sebagai Kristus.
  rationale: Teks Yunani memakai pronomina, sedangkan konteks terdekat menunjuk kepada Allah sebagai pemberi Roh. Mempertahankan pronomina tidak menutup resonansi kristologis dalam teologi Yohanes.
- issue: Identitas πνεῦμα
  choice: “Roh” ditulis dengan huruf kapital sebagai rujukan kepada Roh Kudus.
  alternative: “roh” dengan huruf kecil.
  rationale: Roh yang diberikan Allah kepada umat percaya dalam konteks ini adalah Roh ilahi. Kapitalisasi menjelaskan rujukan tanpa menambahkan gelar yang tidak terdapat dalam ayat.
- issue: Hubungan timbal balik dari tinggal di dalam
  choice: Metafora “di dalam” dan verba “tetap tinggal” dipertahankan.
  alternative: Memparafrasakan sebagai persekutuan atau persatuan dengan Allah.
  rationale: Parafrasa teologis akan mempersempit metafora Yohanes. Terjemahan mempertahankan ketegangan dan keluasan relasional teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi “-Nya” dan “Dia” menandai rujukan ilahi menurut kebiasaan penulisan Indonesia. Susunan dibuat jelas bagi pembaca umum sambil mempertahankan metafora khas Yohanes dan ketaksaan teologis yang asli.
