  text: ἡμεῖς οἴδαμεν ὅτι μεταβεβήκαμεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν, ὅτι ἀγαπῶμεν τοὺς ἀδελφούς· ὁ μὴ ⸀ἀγαπῶν μένει ἐν τῷ θανάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/014.yaml
  text: We know that we have passed from death into life[a], because we love the brothers. The one who does not love remains in death.
translation:
  language: id
  text: Kita tahu bahwa kita telah berpindah dari kematian ke dalam kehidupan karena kita mengasihi saudara-saudara.[a] Orang yang tidak mengasihi tetap berada dalam kematian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudari”; teks Yunani berbunyi “saudara-saudara” dan dalam konteks ini kemungkinan merujuk kepada sesama orang percaya pada umumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: kita tahu
  rationale: Bentuk perfektum οἶδα berfungsi sebagai verba statif kala kini dalam bahasa Yunani Koine; “kita tahu” merupakan padanan Indonesia yang alami.
- source_word: μεταβεβήκαμεν
  choice: kita sudah berpindah
  rationale: Bentuk perfektum menyatakan perpindahan yang telah terjadi dengan akibat yang tetap berlangsung; “sudah berpindah” mempertahankan gambaran gerak serta keadaan yang dihasilkan.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: dari kematian ke dalam kehidupan
  rationale: Pasangan preposisi ἐκ...εἰς menggambarkan gerak keluar dari satu ranah dan masuk ke ranah lain; “ke dalam kehidupan” mempertahankan daya εἰς.
- source_word: ἀγαπῶμεν
  choice: kita mengasihi
  rationale: Indikatif kini menunjukkan tindakan yang menjadi ciri dan terus berlangsung; “mengasihi” alami, jelas, dan sesuai dengan kelompok kata ἀγαπάω/ἀγάπη.
- source_word: τοὺς ἀδελφούς
  choice: saudara-saudara seiman
  rationale: Bentuk Yunani harfiah berarti “saudara-saudara” dan dalam pemakaian Yohanes merujuk kepada sesama anggota komunitas orang percaya. “Seiman” menjernihkan referen tanpa memasukkan makna yang asing; cakupan yang mungkin meliputi laki-laki dan perempuan dicatat dalam catatan kaki.
- source_word: ὁ μὴ ἀγαπῶν
  choice: orang yang tidak mengasihi
  rationale: Partisip kini berartikel menunjuk secara umum kepada orang yang bercirikan tidak mengasihi; frasa Indonesia ini mempertahankan daya generiknya.
- source_word: μένει
  choice: tetap berada
  rationale: μένω menyatakan keadaan yang berlanjut. “Tetap berada” mudah dipahami dan cocok dengan frasa lokatif berikutnya.
- source_word: ἐν τῷ θανάτῳ
  choice: dalam kematian
  rationale: Frasa ini menggambarkan keberadaan yang berlanjut di dalam ranah kematian; terjemahan ringkas ini mempertahankan metafora tanpa menjelaskannya secara berlebihan.
theological_decisions:
- issue: Referen dan cakupan gender τοὺς ἀδελφούς
  choice: “saudara-saudara seiman” dalam teks utama, dengan kemungkinan cakupan laki-laki dan perempuan dijelaskan dalam catatan kaki
  alternative: “saudara-saudara laki-laki” atau “saudara-saudari seiman”
  rationale: Nomina Yunani berbentuk maskulin jamak, tetapi dalam konteks komunitas Yohanes kemungkinan menunjuk kepada sesama orang percaya secara umum. Teks utama mempertahankan bentuk “saudara-saudara” yang wajar dalam bahasa Indonesia, sedangkan catatan kaki menjaga informasi mengenai kemungkinan cakupan inklusifnya.
- issue: Hakikat “kematian” dan “kehidupan”
  choice: Mempertahankan istilah “kematian” dan “kehidupan” tanpa perluasan tafsiran
  alternative: “kematian rohani dan kehidupan kekal” atau “ranah kematian dan ranah kehidupan”
  rationale: Teks menyatakan peralihan teologis yang mendalam dengan metafora padat, tetapi tidak secara eksplisit memberikan kualifikasi tersebut. Terjemahan tidak mempersempit maknanya secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Kita” dipilih untuk bentuk orang pertama jamak karena penulis melibatkan para pembaca dalam pengetahuan dan pengalaman bersama. Metafora perpindahan serta pasangan kematian–kehidupan dipertahankan.
