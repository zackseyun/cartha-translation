base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/011.yaml
  text: 'For this is the message that you have heard from the beginning: that we should love one another[a][b].'
translation:
  language: id
  text: 'Sebab inilah pesan yang telah kamu dengar sejak semula: kita harus saling mengasihi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “supaya kita saling mengasihi” atau “marilah kita saling mengasihi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτι
  choice: Sebab
  rationale: Dalam konteks, kata ini memperkenalkan penjelasan bagi pernyataan sebelumnya; “Sebab” menyampaikan fungsi penjelas itu secara alami.
- source_word: αὕτη ἐστὶν ἡ ἀγγελία
  choice: inilah pesan
  rationale: Ungkapan ini mempertahankan penunjukan langsung dari bahasa Yunani, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: ἣν ἠκούσατε
  choice: yang telah kamu dengar
  rationale: Aoristus Yunani menunjuk pada penerimaan pesan pada masa lampau. “Telah ... dengar” mengungkapkan tindakan itu secara wajar tanpa meniadakan relevansinya kini.
- source_word: ἀπ’ ἀρχῆς
  choice: sejak semula
  rationale: Pilihan ini alami dan mempertahankan gema khas tulisan Yohanes mengenai sesuatu yang diterima sejak awal.
- source_word: ἵνα ἀγαπῶμεν
  choice: kita harus ... mengasihi
  rationale: Dalam konteks ini, ἵνα dapat memperkenalkan isi dan tuntutan etis pesan tersebut. “Harus” mempertahankan daya modal subjunktif tanpa mengubahnya menjadi sekadar kemungkinan.
- source_word: ἀλλήλους
  choice: saling
  rationale: “Saling mengasihi” merupakan ungkapan timbal balik yang alami dan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Daya ἵνα ἀγαπῶμεν ἀλλήλους
  choice: 'Dipahami sebagai isi sekaligus tuntutan etis pesan: “kita harus saling mengasihi.”'
  alternative: “supaya kita saling mengasihi” atau “marilah kita saling mengasihi”
  rationale: Konstruksi ini dapat memiliki nuansa isi, tujuan, atau dorongan. Teks utama menyampaikan kewajiban etis tanpa menjadikannya hanya tujuan atau mengubahnya menjadi ajakan langsung; catatan kaki mempertahankan kemungkinan nuansa tujuan dan ajakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bersahaja. Kata ganti “kamu” dipakai sebagai bentuk jamak yang wajar bagi komunitas pembaca; “sejak semula” mempertahankan resonansi Yohanes.
