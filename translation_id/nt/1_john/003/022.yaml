id: 1JN.3.22
reference: 1 John 3:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὃ ⸀ἐὰν αἰτῶμεν λαμβάνομεν ⸀ἀπ’ αὐτοῦ, ὅτι τὰς ἐντολὰς αὐτοῦ τηροῦμεν καὶ τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/022.yaml
  text: And whatever we ask[a], we receive from him, because we keep his commandments and do what is pleasing in his sight.
translation:
  language: id
  text: Dan apa pun yang kita minta, kita menerimanya dari-Nya, karena kita menuruti perintah-perintah-Nya dan melakukan apa yang berkenan di hadapan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: dalam pandangan-Nya.'
    reason: Alternatif idiomatis bagi ἐνώπιον αὐτοῦ, yang dapat berarti ‘di hadapan-Nya’ atau ‘dalam pandangan-Nya’.
lexical_decisions:
- source_word: ὃ ἐὰν
  choice: apa pun yang
  rationale: Gabungan pronomina relatif dengan ἐάν membentuk ungkapan tak tentu, ‘apa pun yang’; bentuk ini alami dalam bahasa Indonesia dan tidak membatasi jenis permintaan.
- source_word: αἰτῶμεν
  choice: kita minta
  rationale: αἰτέω berarti meminta atau memohon; ‘meminta’ merupakan padanan umum dan wajar dalam konteks doa.
- source_word: λαμβάνομεν
  choice: kita menerimanya
  rationale: Bentuk kini menyatakan kenyataan umum. Akhiran ‘-nya’ mengacu kembali secara alami kepada ‘apa pun yang kita minta’.
- source_word: ἀπ’ αὐτοῦ
  choice: dari-Nya
  rationale: ἀπό dengan bentuk genitif menunjukkan sumber. Kapitalisasi pronomina ilahi mengikuti kebiasaan baku dalam ragam keagamaan bahasa Indonesia.
- source_word: ὅτι
  choice: karena
  rationale: ὅτι menyatakan alasan dan mempertahankan hubungan sebab yang dinyatakan teks.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: perintah-perintah-Nya
  rationale: Bentuk jamak dipertahankan, dan ‘perintah’ menyampaikan makna ἐντολή secara jelas dalam bahasa Indonesia modern.
- source_word: τηροῦμεν
  choice: kita menuruti
  rationale: Dalam konteks perintah, τηρέω berarti memegang, memelihara, atau menaatinya. ‘Menuruti’ alami sekaligus mempertahankan gagasan ketaatan yang berkelanjutan.
- source_word: τὰ ἀρεστὰ
  choice: apa yang berkenan
  rationale: Adjektiva netral jamak yang dipakai secara substantival menunjuk kepada segala sesuatu yang menyenangkan atau berkenan kepada Allah; ungkapan ini tetap luas dan alami.
- source_word: ἐνώπιον αὐτοῦ
  choice: di hadapan-Nya
  rationale: Ungkapan ini mempertahankan citra ‘di depan/di hadapan’ sekaligus wajar dan bermartabat dalam bahasa Indonesia.
- source_word: ποιοῦμεν
  choice: melakukan
  rationale: ποιέω adalah verba umum ‘melakukan’; padanan ini tidak menambahkan nuansa kebiasaan yang tidak dinyatakan secara khusus.
theological_decisions:
- issue: Hubungan antara doa yang diterima dan ketaatan
  choice: 'Hubungan sebab dipertahankan: kita menerima dari-Nya karena kita menuruti perintah-perintah-Nya dan melakukan apa yang berkenan di hadapan-Nya.'
  alternative: Melemahkan ‘karena’ menjadi sekadar hubungan keadaan atau kebersamaan.
  rationale: ὅτι secara eksplisit memberikan alasan. Terjemahan mempertahankan ketegangan teologis tersebut tanpa mengubahnya menjadi rumus mekanis tentang doa maupun melunakkan hubungan sebabnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Menuruti’ dipilih agar mudah dipahami tanpa kehilangan nuansa menaati atau memelihara perintah. Bentuk pronomina ilahi memakai kapital sesuai kelaziman ragam keagamaan Indonesia.
