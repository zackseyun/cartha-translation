lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Kata penghubung yang secara alami mengaitkan ayat ini dengan kesaksian pada ayat-ayat sebelumnya.
- source_word: ταῦτα
  choice: hal-hal ini
  rationale: Mempertahankan bentuk jamak demonstratif dan menunjuk pada isi yang sedang dituliskan.
- source_word: γράφομεν ἡμεῖς
  choice: kami menuliskan
  rationale: Bentuk kini merujuk pada tindakan penulisan surat ini; pronomina eksplisit ἡμεῖς terwakili oleh 'kami'. 'Kami' dipilih karena pembaca tidak termasuk dalam kelompok penulis.
- source_word: ἵνα
  choice: supaya
  rationale: Secara alami menyatakan tujuan dalam bahasa Indonesia modern tanpa meniadakan kemungkinan nuansa hasil.
- source_word: ἡ χαρὰ ἡμῶν
  choice: sukacita kita
  rationale: χαρά diterjemahkan dengan padanan baku 'sukacita'. Bentuk inklusif 'kita' mencerminkan sukacita yang dimiliki penulis bersama para pembaca dalam konteks persekutuan, sementara teks Yunani utama tetap memakai bentuk orang pertama jamak.
- source_word: ᾖ πεπληρωμένη
  choice: menjadi sempurna
  rationale: Konstruksi perifrasis ini menyatakan keadaan sukacita yang telah mencapai kepenuhan atau kelengkapannya; 'menjadi sempurna' alami dan sesuai dengan ungkapan Yohanes.
theological_decisions:
- issue: Varian pronomina dalam ἡ χαρὰ ἡμῶν
  choice: sukacita kita
  alternative: sukacita kalian
  rationale: Teks SBLGNT yang diberikan berbunyi ἡμῶν ('kita/kami'), sehingga itulah yang diterjemahkan dalam teks utama. Varian 'kalian' dicatat dalam catatan kaki karena terdapat dalam sebagian naskah dan dapat memengaruhi pemahaman mengenai pihak yang mengalami sukacita.
- issue: Cakupan orang pertama jamak ἡμῶν
  choice: kita
  alternative: kami
  rationale: Dalam konteks ayat 3–4, tujuan penulisan berkaitan dengan persekutuan antara para saksi dan pembaca; 'kita' menyampaikan kemungkinan cakupan bersama itu secara wajar dalam bahasa Indonesia. Bahasa Yunani sendiri tidak membedakan bentuk inklusif dan eksklusif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'menuliskan hal-hal ini' mempertahankan bentuk jamak serta tindakan penulisan yang sedang dilakukan; 'sukacita' mempertahankan diksi Alkitabiah yang tetap umum dipahami.
