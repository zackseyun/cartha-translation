  text: Dan kami menuliskan hal-hal ini supaya sukacita kami menjadi sempurna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian naskah berbunyi “sukacita kalian”, bukan “sukacita kami”.
