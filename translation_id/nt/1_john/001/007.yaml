id: 1JN.1.7
reference: 1 John 1:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν δὲ ἐν τῷ φωτὶ περιπατῶμεν ὡς αὐτός ἐστιν ἐν τῷ φωτί, κοινωνίαν ἔχομεν μετ’ ἀλλήλων καὶ τὸ αἷμα ⸀Ἰησοῦ τοῦ υἱοῦ αὐτοῦ καθαρίζει ἡμᾶς ἀπὸ πάσης ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/007.yaml
  text: But if we walk in the light[a], as he himself is in the light, we have fellowship with one another[b], and the blood of Jesus his Son cleanses us from every sin.
translation:
  language: id
  text: Namun, jika kita berjalan di dalam terang, sebagaimana Dia sendiri berada di dalam terang, kita memiliki persekutuan satu sama lain[a], dan darah Yesus, Anak-Nya, menyucikan kita dari setiap dosa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saling.” Sebagian penafsir memahami “satu sama lain” sebagai persekutuan antara orang-orang percaya dan Allah, tetapi bentuk timbal balik dalam bahasa Yunani paling alami menunjuk pada persekutuan bersama di antara orang-orang percaya.
    reason: alternative_reading
  - marker: b
    text: Atau “dari segala dosa.” Ungkapan Yunani dapat dipahami secara distributif (“setiap dosa”) atau kolektif (“segala dosa”).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Namun, jika
  rationale: δέ menandai kontras dengan pernyataan sebelumnya tentang berjalan dalam kegelapan; “Namun, jika” menyampaikan daya adversatif itu secara alami.
- source_word: ἐν τῷ φωτὶ
  choice: di dalam terang
  rationale: Mempertahankan metafora khas Yohanes dan ungkapan tematis tentang terang tanpa menjelaskannya secara berlebihan.
- source_word: περιπατῶμεν
  choice: kita berjalan
  rationale: Mempertahankan metafora etis sumber Yunani, alih-alih langsung menafsirkannya sebagai “hidup” atau “menjalani kehidupan”.
- source_word: ὡς αὐτός ἐστιν ἐν τῷ φωτί
  choice: sebagaimana Dia sendiri berada di dalam terang
  rationale: “Dia sendiri” mencerminkan penekanan pada αὐτός, sedangkan “sebagaimana” mempertahankan perbandingan tanpa memaksakan kesetaraan mutlak.
- source_word: κοινωνίαν ἔχομεν
  choice: kita memiliki persekutuan
  rationale: “Persekutuan” menyampaikan partisipasi bersama dan hubungan yang erat, serta merupakan padanan yang lazim dan bermartabat dalam konteks ini.
- source_word: μετ’ ἀλλήλων
  choice: satu sama lain
  rationale: Padanan timbal balik yang alami dan paling langsung bagi ἀλλήλων.
- source_word: τὸ αἷμα Ἰησοῦ
  choice: darah Yesus
  rationale: Mempertahankan “darah” sebagai subjek klausa dan bobot teologis ungkapan sumber.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: Anak-Nya
  rationale: Padanan genitif yang alami dalam bahasa Indonesia; huruf kapital menandai gelar relasional Yesus terhadap Allah tanpa menambah isi.
- source_word: καθαρίζει
  choice: menyucikan
  rationale: Menyampaikan dimensi pemurnian moral dan ritual dari καθαρίζω. Bentuk kini Yunani dinyatakan dengan verba bahasa Indonesia yang dapat menunjukkan tindakan yang berlangsung atau bersifat tetap menurut konteks.
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: dari setiap dosa
  rationale: “Setiap dosa” menampilkan kemungkinan makna distributif πάσης dengan nomina tunggal secara jelas, sementara alternatif kolektif tetap dicatat.
theological_decisions:
- issue: Rujukan “satu sama lain” (μετ’ ἀλλήλων)
  choice: persekutuan timbal balik di antara orang-orang percaya
  alternative: persekutuan antara orang-orang percaya dan Allah
  rationale: Kata timbal balik ἀλλήλων paling wajar menunjuk pada hubungan timbal balik dalam kelompok. Konteks yang lebih luas memang berbicara tentang persekutuan dengan Allah, tetapi frasa ini tidak diperluas untuk memaksakan rujukan tersebut.
- issue: Daya bentuk kini καθαρίζει
  choice: penyucian yang berlangsung atau menjadi kenyataan tetap, dinyatakan dengan “menyucikan”
  alternative: penyucian satu kali atau ungkapan eksplisit “terus-menerus menyucikan”
  rationale: Bentuk kini Yunani mendukung tindakan yang berlangsung atau berciri tetap, tetapi teks utama tidak menambahkan keterangan aspek yang lebih tegas daripada yang dinyatakan sumber.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Metafora “berjalan di dalam terang” dipertahankan; struktur kalimat mengikuti alur Yunani tanpa menjadi kaku. Penulisan “Dia” dan “Anak-Nya” mengikuti kebiasaan penghormatan dalam teks keagamaan Indonesia.
