  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν ἀπαγγέλλομεν ⸀καὶ ὑμῖν, ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν· καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/003.yaml
  text: What we have seen and heard we also proclaim to you[a], so that you too may have fellowship with us; and indeed our fellowship is with the Father and with his Son[b], Jesus the Messiah.
translation:
  language: id
  text: Apa yang telah kami lihat dan dengar, kami beritakan juga kepada kamu, supaya kamu pun memiliki persekutuan[a] dengan kami. Dan memang, persekutuan kami adalah dengan Bapa dan dengan Anak-Nya, Yesus Sang Mesias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''Persekutuan'' juga dapat diterjemahkan ''kebersamaan'' atau ''partisipasi bersama''; istilah ini menekankan hubungan dan bagian yang dimiliki bersama.'
    reason: lexical_alternative
  - marker: b
    text: Atau "Yesus Kristus." Gelar Yunani Χριστός dapat dialihaksarakan sebagai "Kristus" atau diterjemahkan menurut maknanya sebagai "Mesias."
    reason: alternative_rendering
lexical_decisions:
- source_word: ὃ
  choice: Apa yang
  rationale: Menunjuk kembali secara luas kepada apa yang telah dilihat dan didengar dalam konteks sebelumnya, tanpa mempersempit rujukannya menjadi pribadi tertentu.
- source_word: ἑωράκαμεν καὶ ἀκηκόαμεν
  choice: telah kami lihat dan dengar
  rationale: Bentuk perfektum Yunani menyatakan kesaksian tentang pengalaman lampau yang tetap berlaku; kata 'telah' menaungi kedua verba secara alami dalam bahasa Indonesia.
- source_word: ἀπαγγέλλομεν καὶ ὑμῖν
  choice: kami beritakan juga kepada kamu
  rationale: '''Beritakan'' menyampaikan tindakan melaporkan atau menyatakan kesaksian, sedangkan ''juga'' mempertahankan καί dalam teks sumber.'
- source_word: κοινωνίαν ἔχητε μεθ’ ἡμῶν
  choice: memiliki persekutuan dengan kami
  rationale: Mempertahankan bentuk nomina κοινωνία dan gagasan relasi serta partisipasi bersama, tanpa membatasinya pada pergaulan sosial semata.
- source_word: καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα
  choice: Dan memang, persekutuan kami
  rationale: '''Memang'' mewakili daya penegasan atau penjelasan δέ dalam susunan yang wajar bagi bahasa Indonesia.'
- source_word: τοῦ πατρὸς
  choice: Bapa
  rationale: Dalam konteks Yohanes, kata ini merupakan sebutan bagi Allah dan karena itu ditulis sebagai gelar ilahi.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: Anak-Nya
  rationale: Menyampaikan hubungan kepunyaan dan hubungan Anak dengan Bapa secara idiomatis; huruf kapital mengikuti pemakaian sebagai gelar ilahi.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός di sini dipertahankan sebagai gelar, sehingga diterjemahkan 'Mesias'; 'Sang' membuat bentuk gelar itu alami dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Makna κοινωνία
  choice: persekutuan
  alternative: kebersamaan; persekutuan hidup; partisipasi
  rationale: '''Persekutuan'' menjaga cakupan relasional dan partisipatif istilah itu, baik antara para pembaca dan para saksi maupun dengan Bapa dan Anak, tanpa menentukan secara sempit bentuk persekutuan tersebut.'
- issue: Penerjemahan Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam frasa Ἰησοῦ Χριστοῦ, gelar yang bermakna 'Yang Diurapi' tetap tampak melalui 'Mesias'; catatan kaki mencantumkan bentuk tradisional 'Kristus'.
- issue: Rujukan ὃ
  choice: Apa yang
  alternative: Dia yang
  rationale: Bentuk netral tunggal dan konteks kesaksian mendukung rujukan luas kepada apa yang dilihat dan didengar. Terjemahan tidak mempersonalisasikannya secara paksa, sehingga ambiguitas konteks tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan pengulangan 'persekutuan' yang penting dalam teks sumber, sementara pilihan 'kepada kamu' tetap wajar dalam register Alkitab Indonesia dan tidak memaksakan pembedaan jumlah yang kaku.
