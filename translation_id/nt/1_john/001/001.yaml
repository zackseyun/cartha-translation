  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὃ ἦν ἀπ’ ἀρχῆς, ὃ ἀκηκόαμεν, ὃ ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν, ὃ ἐθεασάμεθα καὶ αἱ χεῖρες ἡμῶν ἐψηλάφησαν, περὶ τοῦ λόγου τῆς ζωῆς—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/001.yaml
  text: What was from the beginning[a], what we have heard, what we have seen with our eyes, what we looked upon and our hands have touched[b], concerning the word of life—
translation:
  language: id
  text: Apa yang telah ada sejak semula,[a] yang telah kami dengar, yang telah kami lihat dengan mata kami sendiri, yang telah kami pandang dan yang telah tangan kami sentuh, mengenai firman kehidupan[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yang telah ada sejak semula.” Kata ganti relatif dalam bahasa Yunani berbentuk netral dan dapat menunjuk secara luas kepada kesaksian para rasul mengenai Sang Anak, alih-alih secara langsung menyebut-Nya sebagai “Dia.”
    reason: alternative_reading
  - marker: b
    text: Atau, “Firman kehidupan” atau “berita kehidupan.” Frasa ini dapat merujuk secara personal kepada Sang Anak, dengan gema yang disengaja dari Yohanes 1:1, atau kepada berita yang memberi kehidupan mengenai Dia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ / ὃ
  choice: Apa yang
  rationale: Kata ganti relatif netral yang berulang menunjuk secara luas kepada keseluruhan kesaksian rasuli, bukan secara eksplisit hanya kepada seorang pribadi. 'Apa yang' alami dalam bahasa Indonesia dan mempertahankan keluasan rujukannya.
- source_word: ἦν ἀπ’ ἀρχῆς
  choice: telah ada sejak semula
  rationale: Ungkapan ini mempertahankan kedalaman waktu dalam idiom Yohanes. 'Telah ada' menyampaikan keberadaan yang mendahului kesaksian, sedangkan 'sejak semula' mempertahankan gema ἀπ’ ἀρχῆς.
- source_word: ἀκηκόαμεν
  choice: telah kami dengar
  rationale: Bentuk perfektum menyatakan pengalaman lampau yang tetap menjadi dasar kesaksian pada saat penulisan.
- source_word: ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν
  choice: telah kami lihat dengan mata kami sendiri
  rationale: Bentuk perfektum dipertahankan dengan 'telah'; frasa eksplisit tentang mata dipertahankan dan 'sendiri' menyampaikan penekanan kesaksian langsung secara alami.
- source_word: ἐθεασάμεθα
  choice: telah kami pandang
  rationale: Kata ini menyiratkan pengamatan yang disengaja, bukan sekadar melihat sepintas. 'Memandang' bermartabat dan mudah dipahami tanpa menjadi arkais.
- source_word: αἱ χεῖρες ἡμῶν ἐψηλάφησαν
  choice: telah disentuh oleh tangan kami
  rationale: ψηλαφάω menyatakan sentuhan nyata atau perabaan. Bentuk ini mempertahankan tangan sebagai pelaku eksplisit sekaligus menghasilkan susunan Indonesia yang alami dalam rangkaian klausa.
- source_word: περὶ
  choice: mengenai
  rationale: Kata ini memperkenalkan pokok kesaksian. 'Mengenai' sesuai dengan gaya prolog yang agak luhur tetapi tetap modern.
- source_word: τοῦ λόγου τῆς ζωῆς
  choice: firman kehidupan
  rationale: '''Firman'' mempertahankan kemungkinan gema personal-kristologis dan makna ujaran/pemberitaan, sedangkan huruf kecil tidak memaksakan identifikasi yang tidak ditandai oleh naskah Yunani. Catatan kaki menjelaskan ambiguitasnya.'
theological_decisions:
- issue: Rujukan klausa relatif netral dan λόγος
  choice: Pembukaan diterjemahkan dengan bentuk netral 'Apa yang', dan λόγος sebagai 'firman kehidupan' dengan huruf kecil.
  alternative: Menerjemahkan secara personal sebagai 'Dia yang telah ada sejak semula' atau memakai 'Firman Kehidupan' dengan kapitalisasi untuk menyatakan identifikasi kristologis secara eksplisit.
  rationale: Konteksnya jelas bersifat kristologis, tetapi bahasa Yunani memakai kata ganti relatif netral dan tidak mengenal perbedaan kapitalisasi semacam itu. Terjemahan utama mempertahankan bentuk serta ketegangan antara Sang Anak dan kesaksian/pemberitaan mengenai Dia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada prolog yang luhur namun tetap mudah dipahami. Pengulangan 'yang telah kami' dipertahankan untuk menjaga irama dan penekanan kesaksian indrawi. Tanda pisah akhir dipertahankan karena kalimat berlanjut ke ayat berikutnya.
