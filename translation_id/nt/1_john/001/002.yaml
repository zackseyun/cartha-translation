  text: καὶ ἡ ζωὴ ἐφανερώθη, καὶ ἑωράκαμεν καὶ μαρτυροῦμεν καὶ ἀπαγγέλλομεν ὑμῖν τὴν ζωὴν τὴν αἰώνιον ἥτις ἦν πρὸς τὸν πατέρα καὶ ἐφανερώθη ἡμῖν—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/002.yaml
  text: and the life was revealed[a], and we have seen and testify and proclaim to you the eternal life[b], which was with the Father and was revealed to us—
translation:
  language: id
  text: dan hidup itu telah dinyatakan[a], dan kami telah melihatnya, serta kami bersaksi dan memberitakan kepada kamu hidup yang kekal[b], yang ada bersama Bapa dan telah dinyatakan kepada kami—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah menampakkan diri” atau “telah dibuat nyata” untuk ἐφανερώθη.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “hidup yang kekal” secara tata bahasa diungkapkan sebagai sesuatu, tetapi dalam konteks menunjuk secara personal kepada Sang Anak, yang ada bersama Bapa dan dinyatakan kepada para rasul.
    reason: cross_reference
lexical_decisions:
- source_word: ἡ ζωὴ / τὴν ζωὴν
  choice: hidup itu / hidup yang kekal
  rationale: Kata sandang Yunani menandai hidup yang tertentu, bukan sekadar hidup secara abstrak. Dalam bahasa Indonesia, 'hidup itu' mempertahankan ketentuan pada penyebutan pertama, sedangkan 'hidup yang kekal' merupakan ungkapan alami pada penyebutan berikutnya.
- source_word: ἐφανερώθη
  choice: telah dinyatakan
  rationale: Mempertahankan bentuk pasif dan gagasan bahwa sesuatu yang sebelumnya tidak tampak kini disingkapkan. 'Telah' juga memberi nuansa tindakan lampau yang hasilnya tetap relevan.
- source_word: ἑωράκαμεν
  choice: kami telah melihatnya
  rationale: Bentuk perfektum diterjemahkan dengan 'telah melihat' untuk menyampaikan pengalaman saksi mata yang sudah terjadi dan tetap bermakna. Akhiran '-nya' membuat objek tersirat dalam bahasa Yunani jelas secara alami, dengan rujukan kepada hidup itu.
- source_word: μαρτυροῦμεν
  choice: kami bersaksi
  rationale: '''Bersaksi'' alami dalam bahasa Indonesia dan mempertahankan nuansa kesaksian langsung.'
- source_word: ἀπαγγέλλομεν
  choice: memberitakan
  rationale: '''Memberitakan'' membedakannya dari ''bersaksi'' dan menyampaikan tindakan menyatakan kabar kepada para pembaca tanpa mempersempitnya menjadi laporan biasa.'
- source_word: ὑμῖν
  choice: kepada kamu
  rationale: Menyatakan objek tidak langsung secara eksplisit; 'kamu' dapat merujuk kepada para pembaca secara kolektif dan sesuai dengan register modern.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: hidup yang kekal
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan ζωὴ sebagai nomina, sehingga rujukan personalnya tidak dijelaskan secara berlebihan.
- source_word: ἥτις
  choice: yang
  rationale: '''Yang'' secara alami menghubungkan klausa relatif dengan ''hidup yang kekal'' dan tidak memaksakan kata ganti personal yang tidak dinyatakan dalam bahasa Yunani.'
- source_word: ἦν πρὸς τὸν πατέρα
  choice: ada bersama Bapa
  rationale: '''Ada bersama Bapa'' menyampaikan keberadaan dan relasi dengan Bapa secara idiomatis, serta selaras dengan pemakaian Yohanes tanpa memperluasnya menjadi tafsiran.'
- source_word: τὸν πατέρα
  choice: Bapa
  rationale: Ditulis dengan huruf kapital karena berfungsi sebagai gelar ilahi yang menunjuk kepada Allah Bapa.
- source_word: ἡμῖν
  choice: kepada kami
  rationale: Mempertahankan datif penerima dan menegaskan bahwa para saksi mengalami penyataan tersebut.
theological_decisions:
- issue: Apakah 'hidup' harus dipersonalisasi secara eksplisit
  choice: Mempertahankan 'hidup itu' dan 'hidup yang kekal' dalam teks utama.
  alternative: Menggantikannya dengan 'Dia' atau secara langsung menyebut 'Anak'.
  rationale: Bahasa Yunani memakai nomina ζωὴ, bukan kata ganti maskulin atau nama Sang Anak. Terjemahan ini membiarkan rujukan personal muncul dari konteks sambil mempertahankan ketegangan dan kekayaan ungkapan Yohanes.
- issue: Seberapa eksplisit praeksistensi dinyatakan dalam πρὸς τὸν πατέρα
  choice: ada bersama Bapa
  alternative: berada di hadirat Bapa
  rationale: Pilihan ini secara langsung menyatakan keberadaan dalam relasi dengan Bapa tanpa menambahkan uraian doktrinal yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Tanda pisah pada akhir ayat dipertahankan karena kalimat berlanjut dari ayat sebelumnya dan menuju ayat berikutnya. Pengulangan 'dan' Yunani diringankan secukupnya agar alami, tanpa menghilangkan urutan melihat, bersaksi, dan memberitakan.
