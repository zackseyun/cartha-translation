base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/006.yaml
  text: If we say that we have fellowship with him and yet walk in the darkness[b][a], we are lying and are not practicing the truth.
translation:
  language: id
  text: Jika kita berkata bahwa kita memiliki persekutuan dengan Dia, tetapi kita berjalan dalam kegelapan, kita berdusta dan tidak melakukan kebenaran[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak melakukan kebenaran.” Atau, “tidak mengamalkan kebenaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Jika kita berkata
  rationale: Mempertahankan bentuk syarat tanpa menambahkan nuansa interpretatif seperti 'mengaku'.
- source_word: κοινωνίαν ἔχομεν
  choice: kita memiliki persekutuan
  rationale: Mencerminkan ungkapan Yunani 'memiliki persekutuan' dan mempertahankan makna relasional κοινωνία.
- source_word: μετ’ αὐτοῦ
  choice: dengan Dia
  rationale: Menerjemahkan hubungan penyertaan yang dinyatakan μετά dengan genitif; pronomina dipertahankan dan tidak diperluas menjadi 'Allah'.
- source_word: ἐν τῷ σκότει
  choice: dalam kegelapan
  rationale: Mempertahankan metafora Yohanes tentang ranah moral-rohani yang berlawanan dengan Allah. Bahasa Indonesia tidak memerlukan artikel yang sepadan dengan τῷ.
- source_word: περιπατῶμεν
  choice: kita berjalan
  rationale: Mempertahankan metafora alkitabiah bagi cara hidup, yang tetap dapat dipahami dalam bahasa Indonesia.
- source_word: ψευδόμεθα
  choice: kita berdusta
  rationale: Ungkapan alami dan langsung untuk tindakan yang berlangsung, tanpa mengubahnya menjadi sekadar keadaan 'palsu'.
- source_word: οὐ ποιοῦμεν τὴν ἀλήθειαν
  choice: tidak melakukan kebenaran
  rationale: Mempertahankan ungkapan khas Yohanes secara cukup formal dan dapat dipahami, alih-alih menafsirkannya secara lebih sempit sebagai 'tidak hidup benar'.
theological_decisions:
- issue: Metafora moral-rohani kegelapan
  choice: berjalan dalam kegelapan
  alternative: hidup dalam dosa
  rationale: Metafora sumber dipertahankan karena 'kegelapan' dalam tulisan Yohanes mencakup kejahatan moral, kepalsuan, dan keterasingan dari Allah tanpa mereduksinya menjadi satu penjelasan doktrinal.
- issue: Ungkapan 'melakukan kebenaran'
  choice: tidak melakukan kebenaran
  alternative: tidak mempraktikkan kebenaran
  rationale: Pilihan ini mempertahankan ketegangan konkret dalam idiom Yohanes bahwa kebenaran bukan hanya dikatakan atau dipercayai, tetapi 'dilakukan'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora 'berjalan dalam kegelapan' serta idiom 'melakukan kebenaran' dipertahankan agar ciri bahasa Yohanes dan ketegangan teologis teks sumber tidak diratakan.
