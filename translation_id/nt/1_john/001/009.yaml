  text: ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/009.yaml
  text: If we confess our sins[a], he is faithful and righteous to forgive us our sins and to cleanse us from all unrighteousness.
translation:
  language: id
  text: Jika kita mengakui dosa-dosa kita, Ia setia dan adil[a] untuk mengampuni dosa-dosa kita dan menyucikan kita dari segala kejahatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “benar.”
    reason: δίκαιος dapat berarti “adil” atau “benar”; “adil” dipakai dalam teks karena paling alami dalam pasangan “setia dan adil,” sementara alternatif ini mempertahankan nuansa kelurusan moral yang juga mungkin.
lexical_decisions:
- source_word: ἐὰν
  choice: Jika
  rationale: Mempertahankan daya syarat dari konstruksi kondisional Yunani tanpa menyiratkan bahwa tindakan itu selalu atau berulang kali terjadi.
- source_word: ὁμολογῶμεν
  choice: kita mengakui
  rationale: Dalam konteks dosa, ὁμολογέω berarti mengakui atau menyatakan terus terang. “Mengakui” alami dalam bahasa Indonesia modern dan tidak membatasi maknanya pada tindakan ritual tertentu.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: dosa-dosa kita
  rationale: Bentuk jamak dipertahankan untuk menunjuk pada dosa-dosa yang diakui, bukan hanya dosa sebagai konsep umum.
- source_word: πιστός
  choice: setia
  rationale: Menyatakan bahwa Dia dapat diandalkan dan bertindak sesuai dengan karakter serta janji-Nya.
- source_word: δίκαιος
  choice: adil
  rationale: “Adil” merupakan padanan Indonesia yang alami bagi δίκαιος dalam pasangan “setia dan adil” serta mempertahankan segi kebenaran tindakan-Nya. Kemungkinan “benar” dicatat karena istilah Yunani juga dapat menekankan kelurusan moral secara lebih luas.
- source_word: ἵνα
  choice: sehingga
  rationale: Dalam susunan ini, ἵνα menerangkan pengampunan dan penyucian sebagai tindakan yang selaras dengan sifat-Nya. “Sehingga” lebih alami daripada “untuk” dan tidak memberi kesan bahwa kesetiaan serta keadilan-Nya hanya merupakan sarana bagi suatu tujuan.
- source_word: ἀφῇ
  choice: mengampuni
  rationale: Dalam konteks dosa, ἀφίημι secara tepat berarti melepaskan kesalahan atau mengampuni.
- source_word: ἡμῖν τὰς ἁμαρτίας
  choice: mengampuni dosa-dosa kita
  rationale: Susunan ini idiomatis dalam bahasa Indonesia; pihak yang menerima pengampunan sudah tercakup dalam bentuk posesif “kita”.
- source_word: καθαρίσῃ
  choice: menyucikan
  rationale: Mempertahankan gambaran pembersihan dari kenajisan moral dan rohani dengan ungkapan Indonesia yang lazim serta bermartabat.
- source_word: ἀπὸ πάσης ἀδικίας
  choice: dari segala ketidakbenaran
  rationale: Mempertahankan keluasan ἀδικία—segala sesuatu yang bertentangan dengan apa yang benar—tanpa mempersempitnya hanya menjadi ketidakadilan sosial atau perbuatan jahat tertentu.
theological_decisions:
- issue: Makna δίκαιος sebagai dasar pengampunan ilahi
  choice: adil
  alternative: benar
  rationale: Ayat ini mendasarkan pengampunan dan penyucian pada karakter Allah. “Adil” menjaga segi keadilan tindakan-Nya, sedangkan “benar” dapat menonjolkan kelurusan moral yang lebih luas. Karena teks Yunani memungkinkan kedua nuansa itu, alternatif tersebut dipertahankan dalam catatan kaki tanpa menentukan suatu mekanisme teologis tertentu.
- issue: Hubungan ἵνα dengan sifat Allah dan tindakan mengampuni
  choice: sehingga Dia mengampuni
  alternative: untuk mengampuni
  rationale: ἵνα dapat menyatakan tujuan, hasil, atau melengkapi gagasan sebelumnya. “Sehingga” menyampaikan bahwa pengampunan dan penyucian merupakan tindakan yang sesuai dengan kesetiaan serta keadilan-Nya, sambil tidak memaksakan penjelasan dogmatis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. “Dia” dipakai untuk subjek ilahi yang tersirat tanpa menambahkan kata “Allah” yang tidak muncul dalam ayat. Bentuk jamak “dosa-dosa” dipertahankan, dan catatan kaki ditempatkan langsung setelah kata yang diterangkannya.
