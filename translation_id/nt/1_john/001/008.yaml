id: 1JN.1.8
reference: 1 John 1:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν καὶ ἡ ἀλήθεια ⸂οὐκ ἔστιν ἐν ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/008.yaml
  text: If we say that we have no sin[a], we deceive ourselves, and the truth is not in us.
translation:
  language: id
  text: Jika kita berkata bahwa kita tidak memiliki dosa[a], kita menipu diri sendiri, dan kebenaran tidak ada di dalam kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih interpretatif, “keberdosaan”; secara harfiah bahasa Yunani berbunyi “dosa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: Jika
  rationale: Memperkenalkan kalimat bersyarat; “jika” merupakan padanan Indonesia yang alami dalam konteks ini.
- source_word: εἴπωμεν
  choice: kita berkata
  rationale: Subjungtif aoris sesudah ἐὰν menyusun protasis bersyarat; bentuk kini bahasa Indonesia menyampaikan maksudnya secara wajar.
- source_word: ἁμαρτίαν
  choice: dosa
  rationale: Nomina tunggal tanpa artikel di sini paling tepat dipahami sebagai dosa yang ada pada seseorang, bukan satu perbuatan dosa tertentu. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih interpretatif.
- source_word: οὐκ ἔχομεν
  choice: kita tidak memiliki
  rationale: Menyampaikan konstruksi kepemilikan negatif secara jelas serta mempertahankan ungkapan Yunani “memiliki dosa.”
- source_word: ἑαυτοὺς πλανῶμεν
  choice: kita menipu diri sendiri
  rationale: Konstruksi refleksif menunjukkan penipuan terhadap diri sendiri; ungkapan ini alami dalam bahasa Indonesia.
- source_word: ἡ ἀλήθεια
  choice: kebenaran
  rationale: Mempertahankan ungkapan Yohanes yang dapat mencakup realitas kebenaran maupun keselarasan dengan kebenaran Allah tanpa mempersempit artinya.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: tidak ada di dalam kita
  rationale: Mempertahankan dimensi batiniah dari ἐν ἡμῖν dan merupakan bentuk eksistensial yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna “dosa” dalam pernyataan “kita tidak memiliki dosa”
  choice: Memakai “dosa” sebagai nomina umum tunggal yang menunjuk pada adanya dosa dalam diri seseorang.
  alternative: “kita tidak berdosa” atau “kita tidak memiliki keberdosaan”
  rationale: Bahasa Yunani memakai ἁμαρτίαν bersama ἔχομεν, secara harfiah “memiliki dosa,” dan berbeda dari penyangkalan bahwa seseorang pernah berbuat dosa dalam ayat 10. Terjemahan ini mempertahankan perbedaan serta ketegangan tersebut.
- issue: Makna ungkapan “kebenaran tidak ada di dalam kita”
  choice: Mempertahankan ungkapan ringkas “kebenaran tidak ada di dalam kita.”
  alternative: “kebenaran Allah tidak ada di dalam kita” atau “kita tidak hidup dalam kebenaran”
  rationale: Ungkapan Yohanes dapat mencakup kebenaran ilahi yang objektif sekaligus keadaan batin yang benar. Penambahan penjelasan akan mempersempit nuansa yang dibiarkan terbuka oleh teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Frasa “memiliki dosa” sengaja dipertahankan meskipun sedikit kurang lazim daripada “tidak berdosa,” karena lebih tepat mencerminkan konstruksi Yunani dan membedakan ayat ini dari 1 Yohanes 1:10.
