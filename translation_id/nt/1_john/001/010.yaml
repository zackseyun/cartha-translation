base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/010.yaml
  text: If we say that we have not sinned[a], we make him a liar[b], and his word is not in us.
translation:
  language: id
  text: Jika kita berkata bahwa kita tidak berbuat dosa[a], kita menjadikan Dia pendusta, dan firman-Nya[b] tidak ada di dalam kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Yunani berbentuk perfek, yang menyatakan perbuatan pada masa lampau dengan relevansi bagi keadaan sekarang. Bahasa Indonesia tidak menandai aspek ini secara langsung.
    reason: lexical_alternative
  - marker: b
    text: Atau “pesan-Nya.” Kata Yunani λόγος dapat berarti “firman,” “perkataan,” atau “pesan”; “firman” dipertahankan untuk mencerminkan diksi khas Yohanes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Jika kita berkata
  rationale: Bentuk ἐὰν dengan subjungtif aoris menyatakan syarat; terjemahan ini alami dan tidak menambahkan nuansa interpretatif seperti 'mengaku'.
- source_word: οὐχ ἡμαρτήκαμεν
  choice: kita tidak pernah berbuat dosa
  rationale: Perfek Yunani menunjuk pada perbuatan dosa pada masa lampau yang tetap relevan bagi keadaan sekarang. Dalam bahasa Indonesia, 'tidak pernah berbuat dosa' secara alami menyampaikan penyangkalan bahwa dosa pernah dilakukan, meskipun unsur 'pernah' dibuat eksplisit demi kejelasan.
- source_word: ψεύστην
  choice: pendusta
  rationale: Nomina ψεύστης berarti orang yang berdusta; 'pendusta' mempertahankan daya personal dan tuduhan langsung dari teks.
- source_word: ποιοῦμεν αὐτὸν
  choice: kita menjadikan Dia
  rationale: ποιέω dengan pelengkap predikatif berarti menjadikan atau menyatakan seseorang sebagai sesuatu; bentuk langsung ini mempertahankan ketegasan Yunani.
- source_word: ὁ λόγος αὐτοῦ
  choice: firman-Nya
  rationale: λόγος dapat berarti perkataan, firman, atau pesan. 'Firman-Nya' alami dalam konteks perkataan Allah dan mempertahankan diksi khas Yohanes tanpa membatasi maknanya semata-mata pada pesan yang diberitakan.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: tidak ada di dalam kita
  rationale: Terjemahan ini mempertahankan gambaran batiniah frasa Yunani tanpa menambahkan gagasan 'diam' yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Rujukan αὐτόν / αὐτοῦ
  choice: Kata ganti dipertahankan sebagai 'Dia/-Nya', dengan Allah sebagai rujukan kontekstual.
  alternative: Mengganti kata ganti dengan 'Allah' secara eksplisit.
  rationale: Konteks 1 Yohanes 1:5–10 menunjukkan bahwa Allah adalah pihak yang kesaksian-Nya dibantah, tetapi mempertahankan kata ganti mengikuti bentuk teks Yunani dan tidak menjelaskan lebih dari yang dinyatakannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada 'Dia/-Nya' mengikuti kebiasaan hormat dalam penulisan religius Indonesia; susunan kalimat tetap dekat dengan struktur Yunani tetapi mudah dipahami pembaca umum.
