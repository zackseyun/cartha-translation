  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἔστιν αὕτη ἡ ἀγγελία ἣν ἀκηκόαμεν ἀπ’ αὐτοῦ καὶ ἀναγγέλλομεν ὑμῖν, ὅτι ὁ θεὸς φῶς ἐστιν καὶ σκοτία ⸂ἐν αὐτῷ οὐκ ἔστιν⸃ οὐδεμία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/005.yaml
  text: 'And this is the message that we have heard from him and announce to you: that God is light[a], and there is no darkness at all in him.'
translation:
  language: id
  text: 'Dan inilah pesan yang telah kami dengar dari Dia dan kami beritakan[a] kepada kalian: Allah adalah terang, dan di dalam Dia sama sekali tidak ada kegelapan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kami nyatakan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγελία
  choice: pesan
  rationale: “Pesan” merupakan padanan bahasa Indonesia modern yang alami untuk isi yang diterima lalu disampaikan; “berita” juga mungkin, tetapi dapat memberi kesan terutama sebagai laporan peristiwa.
- source_word: ἀκηκόαμεν
  choice: telah kami dengar
  rationale: Bentuk perfek Yunani menunjukkan tindakan mendengar pada masa lampau yang hasilnya tetap berlaku; “telah kami dengar” mempertahankan nuansa itu secara wajar.
- source_word: ἀπ’ αὐτοῦ
  choice: dari Dia
  rationale: Kata ganti dipertahankan tanpa menggantinya dengan “Yesus” atau “Anak”, sehingga rujukannya tetap ditentukan oleh konteks seperti dalam teks Yunani.
- source_word: ἀναγγέλλομεν
  choice: kami beritakan
  rationale: “Memberitakan” menyampaikan tindakan meneruskan secara terbuka pesan yang telah diterima. Hubungan akar kata dengan ἀγγελία tidak dapat dipertahankan sepenuhnya tanpa menghasilkan ungkapan Indonesia yang kurang alami.
- source_word: ὅτι
  choice: ':'
  rationale: Tanda titik dua secara alami memperkenalkan isi pesan dalam bahasa Indonesia dan menjalankan fungsi ὅτι pada kalimat ini tanpa tambahan penafsiran.
- source_word: ὁ θεὸς φῶς ἐστιν
  choice: Allah adalah terang
  rationale: Metafora dan sifat kualitatif predikat dipertahankan langsung, tanpa menambahkan kata seperti “suci” atau “murni”.
- source_word: σκοτία
  choice: kegelapan
  rationale: “Kegelapan” mempertahankan daya harfiah sekaligus metaforis istilah tersebut dalam tulisan Yohanes.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Ungkapan ini mempertahankan bentuk relasional dan metaforis bahasa sumber tanpa menjabarkan maknanya.
- source_word: οὐδεμία
  choice: sama sekali tidak ada
  rationale: Susunan ini menyampaikan penyangkalan yang tegas dan menyeluruh dalam bahasa Indonesia modern yang alami.
theological_decisions:
- issue: Predikat metaforis “Allah adalah terang”
  choice: Metafora dipertahankan secara langsung tanpa penjelasan tambahan.
  alternative: Allah adalah terang yang suci; Allah adalah terang yang murni.
  rationale: Teks Yunani menyatakan metafora itu tanpa pembatas atau uraian. Penambahan sifat tertentu akan mempersempit cakupan teologis dan sastra pernyataan tersebut.
- issue: Rujukan kata ganti dalam “dari Dia”
  choice: Kata ganti dipertahankan.
  alternative: dari Yesus; dari Anak
  rationale: Walaupun konteks membantu mengenali rujukannya, teks Yunani sendiri memakai kata ganti. Menyisipkan nama atau gelar akan menutup ambiguitas gramatikal yang ada.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan metafora utama, aspek perfek, penegasan mutlak pada klausa terakhir, serta kata ganti sumber. Huruf kapital pada “Dia” mengikuti kebiasaan ejaan religius Indonesia tanpa mengganti kata ganti dengan identitas eksplisit.
