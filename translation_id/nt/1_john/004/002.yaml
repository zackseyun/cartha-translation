  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀γινώσκετε τὸ πνεῦμα τοῦ θεοῦ· πᾶν πνεῦμα ὃ ὁμολογεῖ Ἰησοῦν Χριστὸν ἐν σαρκὶ ἐληλυθότα ἐκ τοῦ θεοῦ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/002.yaml
  text: 'By this you know the Spirit of God: every spirit that confesses Jesus the Messiah having come in the flesh is from God[c][b][a],'
translation:
  language: id
  text: 'Beginilah kamu mengenali Roh Allah: setiap roh yang mengakui bahwa Yesus Sang Mesias[a] telah datang sebagai manusia[b] berasal dari Allah.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yesus Kristus.” Kata Yunani Χριστός berarti “Mesias” dan di sini dapat dipahami sebagai gelar.
    reason: lexical_alternative
  - marker: b
    text: Harfiah, “telah datang dalam daging.” Bentuk perfek Yunani menekankan kedatangan yang telah terjadi dan maknanya yang tetap berlaku.
    reason: lexical_alternative
  - marker: c
    text: Atau, “setiap roh yang mengakui Yesus Sang Mesias sebagai Dia yang telah datang sebagai manusia berasal dari Allah.”
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Beginilah
  rationale: Ungkapan ini secara alami memperkenalkan cara atau tolok ukur untuk mengenali sesuatu, sekaligus mempertahankan fungsi instrumental frasa Yunani.
- source_word: γινώσκετε
  choice: kamu mengenali
  rationale: Bentuk kini indikatif jamak dipahami sebagai pernyataan tentang proses pembedaan, bukan perintah. 'Mengenali' sesuai dengan konteks menguji roh-roh.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: Roh Allah
  rationale: Bentuk tunggal dengan artikel dan pertentangannya dengan roh-roh lain menunjuk kepada Roh yang berasal dan menjadi milik Allah; huruf kapital mengikuti kebiasaan bahasa Indonesia untuk sebutan ilahi.
- source_word: πᾶν πνεῦμα
  choice: setiap roh
  rationale: Ungkapan distributif ini mencakup tiap-tiap roh atau pengaruh rohani yang sedang diuji, baik benar maupun palsu.
- source_word: ὁμολογεῖ
  choice: mengakui
  rationale: Kata ini menyatakan pengakuan terbuka atau penegasan; 'mengakui' alami dalam bahasa Indonesia dan mempertahankan kekuatan pernyataannya.
- source_word: Ἰησοῦν Χριστόν
  choice: Yesus Sang Mesias
  rationale: Χριστός berfungsi sebagai gelar yang bermakna 'Mesias', bukan sekadar unsur nama. 'Sang' menandai gelar itu secara idiomatis dan terhormat.
- source_word: ἐν σαρκὶ
  choice: sebagai manusia
  rationale: Dalam konteks ini frasa tersebut menegaskan kedatangan Yesus dalam keberadaan manusia yang nyata. Terjemahan utama dibuat jelas bagi pembaca modern, sedangkan bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: ἐληλυθότα
  choice: telah datang
  rationale: Bentuk partisip perfek menyatakan kedatangan yang telah terjadi dengan makna yang tetap berlaku; 'telah datang' menyampaikan aspek itu secara alami.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: berasal dari Allah
  rationale: ἐκ menyatakan sumber atau asal. 'Berasal dari Allah' merupakan padanan bahasa Indonesia yang jelas dan langsung.
theological_decisions:
- issue: Apakah τὸ πνεῦμα τοῦ θεοῦ menunjuk secara khusus kepada Roh Allah atau secara umum kepada suatu roh dari Allah
  choice: Roh Allah
  alternative: roh yang berasal dari Allah
  rationale: Bentuk tunggal berartikel dalam konteks pengujian roh-roh paling wajar menunjuk kepada Roh Allah, yang dibedakan dari setiap roh yang diuji. Terjemahan ini tidak menambahkan istilah teologis yang tidak terdapat dalam teks.
- issue: Daya kristologis frasa ἐν σαρκὶ ἐληλυθότα
  choice: telah datang sebagai manusia
  alternative: telah datang dalam daging
  rationale: Terjemahan utama menegaskan kemanusiaan Yesus yang nyata tanpa memasukkan istilah kredal teknis. Bentuk lebih harfiah dicatat agar citra dan kemungkinan nuansa kata σάρξ tetap tersedia.
- issue: Hubungan sintaksis ὁμολογεῖ dengan Ἰησοῦν Χριστὸν ... ἐληλυθότα
  choice: mengakui bahwa Yesus Sang Mesias telah datang
  alternative: mengakui Yesus Sang Mesias sebagai Dia yang telah datang
  rationale: Konstruksi Yunani dapat dinyatakan secara alami sebagai klausa isi dalam bahasa Indonesia. Alternatif yang lebih dekat dengan pola objek dan partisip diberikan dalam catatan agar ketegangan sintaksis tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dibaca. 'Beginilah kamu mengenali' dipilih sebagai pembukaan yang alami untuk suatu tolok ukur. Gelar 'Sang Mesias' dipertahankan dengan nada terhormat; ungkapan 'sebagai manusia' mengutamakan kejelasan sambil mempertahankan bentuk harfiah 'dalam daging' dalam catatan kaki.
