  source_fidelity: 'Teks Indonesia dengan setia menyampaikan konstruksi utama Yunani: kriteria pengenalan Roh Allah, cakupan “setiap roh,” pengakuan mengenai Yesus Sang Mesias, kedatangan-Nya dalam kemanusiaan nyata, dan asal roh itu dari Allah. “Telah datang sebagai manusia” adalah penjelasan yang dapat dipertanggungjawabkan untuk ἐν σαρκὶ ἐληλυθότα; catatan b dengan tepat mempertahankan ungkapan harfiahnya serta nilai perfeknya.'
