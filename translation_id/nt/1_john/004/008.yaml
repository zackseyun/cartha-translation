  text: The one who does not love has not known God[a], because God is love.
translation:
  language: id
  text: Orang yang tidak mengasihi tidak pernah mengenal Allah[a], sebab Allah adalah kasih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak mengenal Allah.” Bentuk aoristus Yunani dapat diterjemahkan lebih sederhana demikian, tetapi “tidak pernah mengenal” menegaskan bahwa orang itu tidak pernah sampai pada pengenalan akan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν
  choice: Orang yang tidak mengasihi
  rationale: Artikel dengan partisipel kini berfungsi sebagai nomina dan menunjuk secara umum kepada orang yang dicirikan oleh ketiadaan kasih. Bentuk ini alami dalam bahasa Indonesia sekaligus mempertahankan nuansa tindakan atau sikap yang berlangsung.
- source_word: ἀγαπῶν
  choice: mengasihi
  rationale: Kata kerja “mengasihi” menyatakan tindakan kasih dengan wajar dan mempertahankan hubungan leksikal yang jelas dengan “kasih” (ἀγάπη) pada akhir ayat.
- source_word: οὐκ ἔγνω
  choice: belum mengenal
  rationale: Aoristus ἔγνω dalam konteks ini menunjuk kepada tidak pernah sampai pada pengenalan akan Allah, dengan akibat yang tampak dalam keadaan sekarang. “Belum mengenal” mengungkapkan hal itu secara alami tanpa mereduksinya menjadi pengetahuan intelektual saja.
- source_word: τὸν θεόν
  choice: Allah
  rationale: Padanan baku bagi θεός ketika menunjuk kepada Allah sebagai objek langsung.
- source_word: ὅτι
  choice: sebab
  rationale: ὅτι memperkenalkan alasan bagi pernyataan sebelumnya. “Sebab” menyampaikan hubungan kausal tersebut dalam ragam yang ringkas dan bermartabat.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Subjek klausa dan padanan baku untuk sebutan ilahi ini.
- source_word: ἀγάπη
  choice: kasih
  rationale: Nomina abstrak dipertahankan, bukan dilemahkan menjadi adjektiva “pengasih”, serta menjaga kaitan leksikal dengan “mengasihi” dalam klausa pertama.
- source_word: ἐστίν
  choice: adalah
  rationale: Kopula kini diterjemahkan secara langsung dan alami dalam pernyataan predikatif ini.
theological_decisions:
- issue: Daya pernyataan “Allah adalah kasih”
  choice: Allah adalah kasih
  alternative: Allah itu pengasih; Kasih adalah Allah
  rationale: Dalam bahasa Yunani, ὁ θεὸς adalah subjek dan ἀγάπη adalah predikat. Terjemahan ini mempertahankan bobot pernyataan tentang sifat Allah tanpa membaliknya menjadi “Kasih adalah Allah” atau menafsirkannya sebagai definisi yang mencakup segala sesuatu tentang Allah.
- issue: Aspek dan sifat pengenalan akan Allah
  choice: belum mengenal Allah
  alternative: tidak mengenal Allah; tidak memahami Allah
  rationale: Dalam konteks Yohanes, γινώσκω mengandung pengenalan relasional yang nyata dalam kehidupan, bukan sekadar pemahaman intelektual. “Belum mengenal” juga mempertahankan dampak kini dari aoristus, yakni orang itu tidak pernah sampai pada pengenalan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. “Mengasihi” dipilih agar kaitan dengan “kasih” tetap terdengar, sedangkan “sebab” menjaga alur argumentasi yang jelas.
