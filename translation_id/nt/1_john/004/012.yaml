source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς πώποτε τεθέαται· ἐὰν ἀγαπῶμεν ἀλλήλους, ὁ θεὸς ἐν ἡμῖν μένει καὶ ἡ ἀγάπη αὐτοῦ ⸂ἐν ἡμῖν τετελειωμένη ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/012.yaml
  text: No one has ever seen God[a]; if we love one another, God remains in us[b], and his love is perfected in us.
translation:
  language: id
  text: Tidak seorang pun pernah melihat Allah. Jika kita saling mengasihi, Allah tetap tinggal di dalam kita, dan kasih-Nya[a] telah disempurnakan di dalam kita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kasih kita kepada Allah.” Frasa Yunani yang diterjemahkan “kasih-Nya” dapat berarti kasih Allah kepada kita atau kasih kita kepada Allah; konteks lebih mendukung arti kasih Allah.
    reason: alternative_reading
  - marker: b
    text: Atau, “telah mencapai kesempurnaan di dalam kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεθέαται
  choice: pernah melihat
  rationale: Bersama πώποτε dan negasi, bentuk perfek ini menyatakan bahwa sampai sekarang tidak seorang pun pernah melihat Allah; ungkapan ini alami dalam bahasa Indonesia modern tanpa kehilangan cakupan waktunya.
- source_word: πώποτε
  choice: pernah
  rationale: 'Dalam konstruksi negatif, kata ini menegaskan klaim universal mengenai waktu: tidak seorang pun pernah melihat Allah.'
- source_word: ἐὰν ἀγαπῶμεν ἀλλήλους
  choice: jika kita saling mengasihi
  rationale: ἐάν dengan subjungtif kini menyatakan kondisi; 'jika' mempertahankan sifat kondisional, sedangkan 'saling mengasihi' menerjemahkan hubungan timbal balik ἀλλήλους secara alami.
- source_word: μένει
  choice: tetap tinggal
  rationale: Pilihan ini mempertahankan gagasan keberlanjutan yang penting dalam pemakaian μένω oleh Yohanes serta tetap mudah dipahami pembaca modern.
- source_word: ἡ ἀγάπη αὐτοῦ
  choice: kasih-Nya
  rationale: Frasa ringkas ini mempertahankan bentuk genitif Yunani. Dalam konteks ayat 10–11, rujukan utamanya kemungkinan besar adalah kasih yang berasal dari Allah, tetapi ambiguitas arah kasih dicatat dalam catatan kaki.
- source_word: τετελειωμένη ἐστιν
  choice: telah menjadi sempurna
  rationale: 'Ungkapan ini menyampaikan keadaan hasil dari konstruksi perfek perifrastik: kasih itu telah dibawa kepada kesempurnaan dan berada dalam keadaan demikian. Bentuk ini lebih alami daripada pasif harfiah ''telah disempurnakan''.'
- source_word: ἐν ἡμῖν
  choice: di dalam kita
  rationale: Terjemahan ini dipakai secara konsisten untuk kedua kemunculan frasa tersebut dan sesuai dengan tema Allah yang tinggal di dalam umat-Nya; kemungkinan kolektif 'di antara kita' tidak dipilih karena konteks mendukung makna keberadaan di dalam.
theological_decisions:
- issue: Arah makna genitif dalam ἡ ἀγάπη αὐτοῦ
  choice: kasih Allah kepada kita
  alternative: kasih kita kepada Allah
  rationale: Konteks langsung menekankan prakarsa kasih Allah (ayat 10–11), sehingga genitif subjektif lebih mungkin. Namun, bentuk Yunani dapat pula dipahami secara objektif; karena itu alternatif tersebut tidak dihapus, melainkan dicatat.
- issue: Makna kesempurnaan kasih
  choice: telah menjadi sempurna di dalam kita
  alternative: telah mencapai kepenuhannya di dalam kita
  rationale: τελειόω menunjuk pada dibawanya sesuatu kepada tujuan atau kelengkapannya. Terjemahan utama mempertahankan kosakata 'sempurna' dan keadaan hasil dari bentuk perfek tanpa menentukan secara berlebihan bagaimana proses itu berlangsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur tetapi mudah dipahami. 'Tetap tinggal' mempertahankan istilah khas Yohanes tanpa memakai bentuk yang arkais. Penanda catatan kaki ditempatkan langsung pada frasa yang dijelaskannya.
