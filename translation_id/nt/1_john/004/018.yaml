  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: φόβος οὐκ ἔστιν ἐν τῇ ἀγάπῃ, ἀλλ’ ἡ τελεία ἀγάπη ἔξω βάλλει τὸν φόβον, ὅτι ὁ φόβος κόλασιν ἔχει, ὁ δὲ φοβούμενος οὐ τετελείωται ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/018.yaml
  text: There is no fear in love[a], but perfect love drives out fear, because fear has punishment[c][b]. But the one who fears has not been perfected in love.
translation:
  language: id
  text: Dalam kasih tidak ada ketakutan. Sebaliknya, kasih yang sempurna[b] mengusir ketakutan, sebab ketakutan berkaitan dengan hukuman.[a] Orang yang takut belum disempurnakan dalam kasih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ketakutan memiliki hukuman.” Dapat juga diterjemahkan: “ketakutan melibatkan hukuman.”'
    reason: lexical_alternative
  - marker: b
    text: “Sempurna” juga dapat dipahami sebagai “utuh” atau “dewasa”, yakni telah mencapai kepenuhan yang dimaksudkan. Kata Yunani yang sama akarnya dipakai dalam frasa “belum disempurnakan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος / φοβούμενος
  choice: ketakutan / orang yang takut
  rationale: Mempertahankan pengulangan akar kata Yunani dan menunjuk pada rasa takut dalam kaitannya dengan hukuman, tanpa mempersempitnya menjadi sekadar kecemasan.
- source_word: ἀγάπῃ / ἀγάπη
  choice: kasih
  rationale: Padanan baku dan alami dalam konteks Yohanes serta mempertahankan pengulangan istilah kunci.
- source_word: τελεία
  choice: yang sempurna
  rationale: Menunjukkan kasih yang telah mencapai kepenuhan atau tujuannya, sekaligus menjaga hubungan leksikal dengan τετελείωται.
- source_word: ἔξω βάλλει
  choice: mengusir
  rationale: Ungkapan Indonesia yang alami untuk tindakan mengeluarkan secara kuat dan tetap mempertahankan metafora sumber.
- source_word: κόλασιν ἔχει
  choice: mengandung hukuman
  rationale: Lebih wajar daripada terjemahan harfiah 'memiliki hukuman', tetapi tetap dekat dengan konstruksi Yunani dan tidak secara eksplisit menambahkan gagasan 'berkaitan dengan' atau 'menantikan'.
- source_word: οὐ τετελείωται
  choice: belum disempurnakan
  rationale: Bentuk pasif dan keadaan hasil pada perfektum dipertahankan; 'belum' menyatakan bahwa penyempurnaan itu belum tercapai tanpa menentukan pelakunya.
- source_word: ἐν τῇ ἀγάπῃ
  choice: di dalam kasih
  rationale: Mempertahankan gambaran ranah atau lingkungan kasih secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna kasih yang sempurna dan orang yang belum disempurnakan dalam kasih
  choice: Memakai 'kasih yang sempurna' dan 'belum disempurnakan di dalam kasih'.
  alternative: Kasih yang utuh/dewasa; belum menjadi dewasa dalam kasih.
  rationale: Pilihan ini mempertahankan hubungan antara τελεία dan τετελείωται serta ketegangan mengenai kepenuhan kasih, tanpa mengubahnya menjadi ajaran tentang kesempurnaan tanpa dosa.
- issue: Hubungan ketakutan dengan hukuman
  choice: Ketakutan mengandung hukuman.
  alternative: Ketakutan berkaitan dengan hukuman; ketakutan melibatkan hukuman; secara harfiah, ketakutan memiliki hukuman.
  rationale: 'Konstruksi sumber dibiarkan cukup padat dan ambigu: teks menghubungkan ketakutan dengan hukuman tanpa menjelaskan apakah yang dimaksud adalah antisipasi, pengalaman, atau akibat hukuman.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dipecah agar jelas bagi pembaca umum; 'sebaliknya' mengungkapkan kontras ἀλλά secara alami. Istilah 'kasih', 'sempurna', dan 'disempurnakan' mempertahankan jaringan leksikal dan ketegangan teologis teks.
