  source_fidelity: 'Teks Indonesia menyampaikan dengan tepat struktur dan makna Yunani: mereka berasal dari dunia, karena itu ujaran mereka bersumber dari dunia, dan dunia menerima/mendengarkan mereka. Pengulangan “dunia” dan hubungan kausal διὰ τοῦτο terpelihara. “Mendengarkan” tepat untuk ἀκούει dalam konteks penerimaan yang simpatik.'
