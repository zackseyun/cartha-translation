  terminology: “Dunia” tepat sebagai padanan κόσμος dan dipertahankan tanpa memasukkan penafsiran “sistem dunia” ke teks utama. Catatan kaki secara memadai membatasi maksudnya pada tatanan manusia yang menentang Allah, bukan ciptaan fisik. Istilah “Allah” dan register keseluruhan sesuai bahasa Indonesia baku modern.
