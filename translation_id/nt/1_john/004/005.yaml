  text: αὐτοὶ ἐκ τοῦ κόσμου εἰσίν· διὰ τοῦτο ἐκ τοῦ κόσμου λαλοῦσιν καὶ ὁ κόσμος αὐτῶν ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/005.yaml
  text: They are from the world[a]; for this reason they speak from the world[b], and the world listens to them.
translation:
  language: id
  text: Mereka berasal dari dunia; karena itu, mereka berbicara dari dunia, dan dunia mendengarkan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dunia” di sini bukan alam semesta ciptaan, melainkan tatanan manusia yang menentang Allah. Bahasa Yunani dua kali memakai ungkapan yang secara harfiah berarti “dari/keluar dari dunia”, dengan penekanan pada sumber atau asal.
    reason: lexical_alternative dan cultural_note
lexical_decisions:
- source_word: αὐτοὶ
  choice: Mereka
  rationale: Kata ganti ini merujuk kepada nabi-nabi palsu dalam konteks sebelumnya dan mempertahankan pertentangan dengan “kita” pada ayat berikutnya. Penegasannya tidak perlu dibuat eksplisit dalam bahasa Indonesia.
- source_word: ἐκ τοῦ κόσμου
  choice: berasal dari dunia
  rationale: ἐκ menyatakan sumber atau asal. “Berasal dari dunia” menyampaikan nuansa ini secara alami pada kemunculan pertama.
- source_word: κόσμος
  choice: dunia
  rationale: Istilah sederhana “dunia” mempertahankan gema teologis khas Yohanes tanpa memasukkan tafsiran seperti “sistem dunia” ke dalam teks utama.
- source_word: διὰ τοῦτο
  choice: karena itu
  rationale: Ungkapan ini secara ringkas dan alami menghubungkan asal mereka dengan perkataan mereka.
- source_word: ἐκ τοῦ κόσμου λαλοῦσιν
  choice: mereka berbicara dari dunia
  rationale: Terjemahan ini mempertahankan pengulangan ἐκ τοῦ κόσμου dan menonjolkan dunia sebagai sumber perkataan mereka, meskipun susunannya sengaja sedikit tidak biasa dalam bahasa Indonesia.
- source_word: ὁ κόσμος αὐτῶν ἀκούει
  choice: dunia mendengarkan mereka
  rationale: Dalam konteks ini ἀκούει menunjukkan penerimaan atau perhatian, bukan sekadar mendengar bunyi; “mendengarkan” menyampaikan daya tersebut.
theological_decisions:
- issue: Makna κόσμος dalam teologi Yohanes
  choice: “dunia” menunjuk kepada tatanan manusia yang menentang Allah
  alternative: alam semesta ciptaan atau umat manusia dalam arti netral
  rationale: Konteks mempertentangkan mereka yang berasal dari Allah dengan mereka yang berasal dari dunia. Namun, teks utama tetap memakai “dunia” agar tidak memperluas tafsiran secara berlebihan.
- issue: Daya penegasan αὐτοὶ
  choice: Tidak menambahkan “mereka sendiri” dalam teks utama
  alternative: “Mereka sendiri berasal dari dunia”
  rationale: Kata ganti Yunani bersifat kontras, tetapi “mereka sendiri” dapat terdengar terlalu menekankan dalam bahasa Indonesia. Pertentangan dengan ayat berikutnya sudah cukup jelas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pengulangan “dunia” serta gagasan sumber dalam bahasa Yunani dipertahankan; “berbicara dari dunia” sengaja digunakan untuk menjaga ketegangan ungkapan sumber tanpa menggantinya dengan parafrasa yang lebih interpretatif.
