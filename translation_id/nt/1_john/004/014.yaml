  text: καὶ ἡμεῖς τεθεάμεθα καὶ μαρτυροῦμεν ὅτι ὁ πατὴρ ἀπέσταλκεν τὸν υἱὸν σωτῆρα τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/014.yaml
  text: And we have seen and testify that the Father has sent the Son as the Savior of the world[a].
translation:
  language: id
  text: Dan kami telah melihat dan bersaksi bahwa Bapa telah mengutus Anak sebagai Juruselamat dunia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Bapa telah mengutus Anak, Juruselamat dunia.”
    reason: Alternatif leksikal dan sintaksis yang mempertahankan apposisi Yunani secara lebih langsung.
lexical_decisions:
- source_word: καὶ ἡμεῖς
  choice: Dan kami
  rationale: Mempertahankan kesinambungan wacana melalui καί dan penekanan ringan dari pronomina eksplisit ἡμεῖς tanpa melebih-lebihkannya.
- source_word: τεθεάμεθα
  choice: telah melihat
  rationale: Bentuk perfek menyatakan tindakan melihat yang telah terjadi dan tetap bermakna; ungkapan ini alami dalam bahasa Indonesia modern serta mempertahankan daya kesaksian langsung.
- source_word: μαρτυροῦμεν
  choice: bersaksi
  rationale: Menyampaikan tindakan memberikan kesaksian yang sedang berlangsung dan menghindari kerancuan kata 'menyaksikan', yang juga dapat berarti melihat.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi kesaksian, bukan alasan atau sebab.
- source_word: ὁ πατήρ
  choice: Bapa
  rationale: Dalam pemakaian Yohanes, kata ini merupakan sebutan relasional bagi Allah; huruf kapital menandai fungsinya sebagai gelar ilahi.
- source_word: ἀπέσταλκεν
  choice: telah mengutus
  rationale: Bentuk perfek menunjukkan pengutusan yang telah terlaksana dan tetap relevan; 'mengutus' juga mempertahankan nuansa penugasan dalam verba Yunani.
- source_word: τὸν υἱόν
  choice: Anak
  rationale: Teks Yunani memakai artikel, bukan pronomina posesif. 'Anak' mempertahankan gelar relasionalnya terhadap Bapa tanpa menambahkan kata 'Nya'.
- source_word: σωτῆρα
  choice: Juruselamat
  rationale: Merupakan padanan Indonesia yang baku, jelas, dan tepat bagi gelar yang menunjuk pada sosok yang menyelamatkan.
- source_word: τοῦ κόσμου
  choice: dunia
  rationale: Dalam konstruksi 'Juruselamat dunia', bahasa Indonesia secara alami menyampaikan hubungan genitif dan mempertahankan cakupan luas κόσμος.
- source_word: σωτῆρα τοῦ κόσμου
  choice: sebagai Juruselamat dunia
  rationale: Kata 'sebagai' membuat fungsi apposisi σωτῆρα jelas dan alami dalam bahasa Indonesia, tanpa mengubah gelar atau cakupannya.
theological_decisions:
- issue: Cakupan ungkapan 'Juruselamat dunia'
  choice: Mempertahankan ungkapan luas 'Juruselamat dunia' tanpa mempersempit arti 'dunia'.
  alternative: Menafsirkannya sebagai Juruselamat kelompok tertentu atau sekadar Juruselamat yang potensial.
  rationale: Teks Yunani menyatakan gelar dan cakupan ini secara langsung; terjemahan tidak seharusnya memasukkan teori keselamatan tertentu.
- issue: Bahasa relasional Bapa-Anak
  choice: Menerjemahkan gelar relasional secara langsung sebagai 'Bapa' dan 'Anak'.
  alternative: Memperluasnya menjadi 'Allah Bapa' dan 'Yesus Kristus'.
  rationale: Ayat ini sendiri memakai gelar relasional dan tidak menyebut nama Yesus atau gelar Kristus; perluasan tersebut akan menambahkan unsur yang tidak terdapat dalam teks.
- issue: Fungsi σωτῆρα sebagai apposisi
  choice: Memakai 'sebagai Juruselamat dunia' dalam teks utama.
  alternative: Memakai bentuk lebih harfiah 'Anak, Juruselamat dunia'.
  rationale: Kata 'sebagai' menghasilkan susunan Indonesia yang lebih wajar, sedangkan bentuk apposisi yang lebih formal tetap dicatat dalam catatan kaki agar struktur sumber tidak tersembunyi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat dibuat mudah dipahami pembaca umum, dengan kapitalisasi gelar ilahi sesuai kebiasaan penerbitan Alkitab berbahasa Indonesia. Pengulangan aspek melalui 'telah' dipertahankan pada verba perfek yang utama.
