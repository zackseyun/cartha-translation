  text: Ἀγαπητοί, ἀγαπῶμεν ἀλλήλους, ὅτι ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν, καὶ πᾶς ὁ ἀγαπῶν ἐκ τοῦ θεοῦ γεγέννηται καὶ γινώσκει τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/007.yaml
  text: Beloved[a], let us love one another, because love is from God, and everyone who loves has been born of God and knows God.
translation:
  language: id
  text: Yang terkasih[a], marilah kita saling mengasihi, karena kasih berasal dari Allah, dan setiap orang yang mengasihi telah dilahirkan dari Allah dan mengenal Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Saudara-saudara yang terkasih.” Dalam bahasa Yunani, sapaan ini secara harfiah berarti “yang terkasih” dan berkaitan dengan kata “mengasihi” serta “kasih” yang berulang dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Saudara-saudara yang terkasih
  rationale: Sapaan jamak penuh kasih ini alami dan bermartabat dalam bahasa Indonesia, sekaligus mempertahankan kaitan leksikal dengan kata 'mengasihi' dan 'kasih' yang berulang dalam ayat.
- source_word: ἀγαπῶμεν
  choice: marilah kita saling mengasihi
  rationale: Subjungtif hortatoris orang pertama jamak diterjemahkan secara alami sebagai ajakan 'marilah kita'; aspek kini tidak diperjelas menjadi 'terus' agar tidak menentukan secara berlebihan.
- source_word: ἀλλήλους
  choice: saling
  rationale: Padanan ringkas dan idiomatis untuk tindakan timbal balik dalam bahasa Indonesia.
- source_word: ὅτι
  choice: karena
  rationale: Menyatakan alasan bagi ajakan sebelumnya secara jelas.
- source_word: ἡ ἀγάπη
  choice: kasih
  rationale: Padanan baku yang menjaga pengulangan rumpun kata ἀγαπ- dan nada teologis teks.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: berasal dari Allah
  rationale: ἐκ menyatakan sumber atau asal; 'berasal dari Allah' menyampaikan hubungan itu secara alami dan tepat.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: setiap orang yang mengasihi
  rationale: Mengungkapkan konstruksi partisip substantival yang bersifat umum tanpa mempersempit cakupannya.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: telah dilahirkan dari Allah
  rationale: Bentuk perfek pasif dipertahankan dengan 'telah dilahirkan', sedangkan 'dari Allah' menyatakan sumber ilahi secara langsung.
- source_word: γινώσκει τὸν θεόν
  choice: mengenal Allah
  rationale: Menerjemahkan bentuk kini secara langsung sebagai pengenalan yang nyata dan berkelanjutan, tanpa menambahkan nuansa 'mulai mengenal'.
theological_decisions:
- issue: Hubungan antara kasih, kelahiran dari Allah, dan pengenalan akan Allah
  choice: Menyatakan secara langsung bahwa setiap orang yang mengasihi telah dilahirkan dari Allah dan mengenal Allah.
  alternative: Menjadikannya rumusan teknis tentang urutan keselamatan, atau sekadar pernyataan etis yang dilepaskan dari kelahiran ilahi.
  rationale: Terjemahan mempertahankan kaitan teologis yang ditegaskan teks tanpa memasukkan kerangka denominasi tertentu atau melemahkannya menjadi moralisme.
- issue: Pengulangan rumpun kata ἀγαπ-
  choice: Memakai bentuk-bentuk serumpun 'terkasih', 'mengasihi', dan 'kasih'.
  alternative: Memakai sapaan 'sahabat-sahabat' atau variasi lain yang mengaburkan permainan kata.
  rationale: Pilihan ini menjaga penekanan sastra dan teologis yang dibangun melalui pengulangan akar kata Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat, khidmat, dan mudah dipahami. 'Saudara-saudara yang terkasih' dipilih sebagai sapaan jemaat yang alami; tanda [a] ditempatkan langsung sesudah sapaan.
