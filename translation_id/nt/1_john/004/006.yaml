  text: ἡμεῖς ἐκ τοῦ θεοῦ ἐσμεν· ὁ γινώσκων τὸν θεὸν ἀκούει ἡμῶν, ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ οὐκ ἀκούει ἡμῶν. ἐκ τούτου γινώσκομεν τὸ πνεῦμα τῆς ἀληθείας καὶ τὸ πνεῦμα τῆς πλάνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/006.yaml
  text: We are from God[a]. The one who knows God listens to us; whoever is not from God does not listen to us[c][b]. By this we know the Spirit of truth and the spirit of error.
translation:
  language: id
  text: Kami berasal dari Allah. Orang yang mengenal Allah mendengarkan kami; siapa yang tidak berasal dari Allah tidak mendengarkan kami.[a] Dengan ini kami mengenali Roh kebenaran[b] dan roh kesesatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mendengar kami” pada kedua kemunculannya. Kata kerja Yunani dapat berarti “mendengar”, tetapi di sini kemungkinan besar mengandung arti mendengarkan dengan sikap menerima kesaksian para rasul.
    reason: lexical_alternative
  - marker: b
    text: Atau “roh kebenaran”. Dalam tulisan Yohanes, ungkapan ini biasanya menunjuk kepada Roh Kudus (lihat Yohanes 14:17; 15:26; 16:13), meskipun secara gramatikal frasa ini juga dapat dibaca secara lebih umum.
    reason: alternative_reading_and_cross_reference
lexical_decisions:
- source_word: ἐκ τοῦ θεοῦ
  choice: berasal dari Allah
  rationale: Frasa ini mempertahankan arti ἐκ sebagai sumber atau asal, yang penting dalam pertentangan khas Yohanes, dan lebih alami daripada terjemahan harfiah yang kaku.
- source_word: ὁ γινώσκων τὸν θεόν
  choice: orang yang mengenal Allah
  rationale: Partisip substantival kini diterjemahkan secara generik dan berciri tetap; 'mengenal' mempertahankan hubungan leksikal dengan γινώσκομεν.
- source_word: ἀκούει ἡμῶν
  choice: mendengarkan kita
  rationale: Dalam konteks penerimaan kesaksian rasuli, kata ini menyatakan mendengar dengan sikap menerima, tetapi tidak diperkuat hingga berarti 'menaati'.
- source_word: ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: siapa yang tidak berasal dari Allah
  rationale: Bentuk generik ini alami dalam bahasa Indonesia dan tetap mempertahankan gagasan asal atau sumber dalam ἐκ.
- source_word: ἐκ τούτου
  choice: Dengan inilah
  rationale: Ungkapan ini menunjukkan dasar atau kriteria bagi pengenalan yang disebut sesudahnya, sekaligus mempertahankan penekanan demonstratif Yunani.
- source_word: γινώσκομεν
  choice: kita mengenali
  rationale: Dalam konteks menguji roh, 'mengenali' menyampaikan fungsi pembedaannya dengan alami, tanpa menghilangkan kaitan makna dengan 'mengenal' pada bagian sebelumnya.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Roh kebenaran
  rationale: Dalam pemakaian Yohanes, ungkapan ini lazim menunjuk kepada Roh Kudus; kapitalisasi menandai rujukan personal yang paling mungkin sambil tetap mengakui kemungkinan pembacaan umum dalam catatan kaki.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: roh kesesatan
  rationale: πλάνη mencakup kesesatan, kekeliruan, dan penyesatan. 'Kesesatan' membentuk antitesis yang alami dengan 'kebenaran' serta tetap dapat menunjuk kepada pengaruh rohani yang menyesatkan.
theological_decisions:
- issue: Apakah πνεῦμα pada frasa pertama menunjuk secara khusus kepada Roh Kudus
  choice: Roh kebenaran
  alternative: roh kebenaran
  rationale: Konteks pengujian roh dalam 1 Yohanes 4:1–6 dan pemakaian ungkapan yang sama dalam tulisan Yohanes mendukung rujukan kepada Roh Kudus, tetapi ambiguitas gramatikal tetap dicatat.
- issue: Apakah ἀκούει ἡμῶν berarti sekadar mendengar atau menerima kesaksian rasuli
  choice: mendengarkan kita
  alternative: mendengar kita
  rationale: Konteks menekankan tanggapan terhadap pemberitaan para saksi rasuli. 'Mendengarkan' menyiratkan perhatian dan penerimaan tanpa menambahkan gagasan 'menaati' secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Kita' dipertahankan untuk ἡμεῖς/ἡμῶν sebagai suara penulis bersama kelompok saksi yang melibatkan pembaca dalam bentuk pronomina Indonesia, sedangkan identitas tepat kelompok itu tidak diperluas di dalam teks. Struktur antitesis dan pengulangan dipertahankan.
