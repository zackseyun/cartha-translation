  text: We love because he first loved us[a].
translation:
  language: id
  text: Kita mengasihi karena Dia lebih dahulu mengasihi kita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi, “Kita mengasihi Dia karena Dia lebih dahulu mengasihi kita.”
    reason: textual_variant
lexical_decisions:
- source_word: ἡμεῖς
  choice: Kita
  rationale: Kata ganti orang pertama jamak ini dinyatakan secara eksplisit dalam bahasa Yunani. “Kita” alami dalam bahasa Indonesia dan mencakup penulis serta para pembacanya.
- source_word: ἀγαπῶμεν
  choice: mengasihi
  rationale: Bentuk kini aktif orang pertama jamak diterjemahkan dengan bentuk umum “mengasihi”, sekaligus mempertahankan hubungan leksikal dengan tema kasih dalam konteks.
- source_word: ὅτι
  choice: karena
  rationale: Di sini ὅτι berfungsi kausal, menyatakan dasar kasih kita, yaitu kasih Allah yang mendahului.
- source_word: αὐτὸς
  choice: Dia
  rationale: Dalam konteks, kata ganti ini merujuk kepada Allah. “Dia” menyampaikan rujukannya secara alami; huruf kapital dipakai sebagai kebiasaan penghormatan dalam bahasa Indonesia tanpa menambahkan identitas yang tidak dinyatakan di klausa ini.
- source_word: πρῶτος
  choice: lebih dahulu
  rationale: Ungkapan ini menyatakan prioritas waktu dengan lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “pertama”.
- source_word: ἠγάπησεν
  choice: mengasihi
  rationale: Aoristus menunjuk pada tindakan kasih Allah yang telah mendahului kasih kita. Bahasa Indonesia tidak menandai kala pada verba, dan urutan waktunya sudah dinyatakan oleh “lebih dahulu”.
- source_word: ἡμᾶς
  choice: kita
  rationale: Objek langsung yang mencakup penulis dan para pembacanya; diterjemahkan secara langsung sebagai “kita”.
theological_decisions:
- issue: Apakah objek perlu ditambahkan sesudah “kita mengasihi”
  choice: 'Objek tidak dinyatakan: “Kita mengasihi”'
  alternative: “Kita mengasihi Dia” atau “Kita mengasihi Allah”
  rationale: Teks SBLGNT tidak memuat objek eksplisit sesudah ἀγαπῶμεν. Tidak menambahkannya mempertahankan keluasan dan ketegangan teks, sedangkan “Dia” mencerminkan varian naskah lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Mengasihi” dipilih untuk menjaga kesinambungan istilah dalam konteks, sedangkan “lebih dahulu” menyampaikan prioritas kasih Allah secara idiomatis.
