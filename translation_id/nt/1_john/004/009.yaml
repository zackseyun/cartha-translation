source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐφανερώθη ἡ ἀγάπη τοῦ θεοῦ ἐν ἡμῖν, ὅτι τὸν υἱὸν αὐτοῦ τὸν μονογενῆ ἀπέσταλκεν ὁ θεὸς εἰς τὸν κόσμον ἵνα ζήσωμεν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/009.yaml
  text: 'In this the love of God was revealed among us: that God has sent his one and only Son into the world so that we might live through him[a][b].'
translation:
  language: id
  text: 'Dalam hal inilah kasih Allah dinyatakan di antara kita[a]: Allah telah mengutus Anak-Nya yang satu-satunya[b] ke dalam dunia supaya kita hidup melalui Dia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di dalam kita.” Frasa Yunani ini dapat berarti bahwa kasih Allah dinyatakan di dalam diri orang percaya atau di tengah kita sebagai suatu komunitas.'
    reason: lexical_alternative
  - marker: b
    text: 'Terjemahan tradisional: “Anak-Nya yang tunggal.” Sebagian terjemahan lama memakai “yang tunggal diperanakkan.” Kata Yunani μονογενής menekankan keunikan Sang Anak.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Dalam hal inilah
  rationale: Mempertahankan rumusan demonstratif Yohanes dan mengantar penjelasan yang mengikuti melalui klausa ὅτι.
- source_word: ἐφανερώθη
  choice: dinyatakan
  rationale: Menyampaikan bentuk pasif aoris dan gagasan bahwa kasih Allah dibuat nyata atau dapat dikenal.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: kasih Allah
  rationale: 'Genitif paling wajar dipahami secara subjektif: kasih yang berasal dari dan dimiliki Allah.'
- source_word: ἐν ἡμῖν
  choice: di antara kita
  rationale: Secara idiomatis menyatakan bahwa kasih Allah menjadi nyata di tengah komunitas atau dalam hubungannya dengan kita, sambil mencatat kemungkinan harfiah 'di dalam kita'.
- source_word: ὅτι
  choice: ':'
  rationale: Tanda titik dua secara alami memperkenalkan isi atau penjelasan tentang bagaimana kasih Allah dinyatakan; isi klausa tetap eksplisit dalam kalimat berikutnya.
- source_word: τὸν υἱὸν αὐτοῦ τὸν μονογενῆ
  choice: Anak-Nya yang satu-satunya
  rationale: Menyampaikan hubungan sebagai Anak dan keunikan μονογενής tanpa menjadikan gagasan tindakan memperanakkan sebagai arti leksikal yang pasti.
- source_word: ἀπέσταλκεν
  choice: telah mengutus
  rationale: 'Mencerminkan bentuk perfek: tindakan pengutusan telah terjadi dan tetap memiliki arti pada saat penulisan.'
- source_word: εἰς τὸν κόσμον
  choice: ke dalam dunia
  rationale: Padanan langsung dan alami untuk gerak masuk ke ranah dunia manusia.
- source_word: ἵνα ζήσωμεν
  choice: supaya kita hidup
  rationale: Menyatakan tujuan dari pengutusan Anak tanpa menambahkan modalitas yang tidak wajib dalam bahasa Indonesia.
- source_word: δι’ αὐτοῦ
  choice: melalui Dia
  rationale: διά dengan genitif menyatakan perantaraan atau sarana; kapitalisasi pronomina mengikuti konvensi bahasa Indonesia untuk rujukan ilahi.
theological_decisions:
- issue: Makna μονογενής sebagai sebutan bagi Anak
  choice: Anak-Nya yang satu-satunya
  alternative: Anak-Nya yang tunggal; Anak-Nya yang tunggal diperanakkan
  rationale: Bacaan utama menegaskan keunikan hubungan Anak dengan Bapa tanpa memasukkan rumusan teologis kemudian ke dalam arti leksikal. Padanan tradisional dicatat demi transparansi sejarah penerjemahan.
- issue: Daya makna ἐν ἡμῖν
  choice: di antara kita
  alternative: di dalam kita
  rationale: Konteks mendukung pernyataan bahwa kasih Allah dinyatakan di tengah umat atau dalam hubungan dengan mereka, tetapi bahasa Yunani juga dapat menunjuk pada kenyataan batiniah; ambiguitas itu dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan kalimat mempertahankan pola penjelasan teks Yunani, sedangkan titik dua menghindari konstruksi 'bahwa Allah' yang kurang luwes. Semua penanda catatan kaki ditempatkan tepat setelah frasa terkait.
