    rationale: '"Dia telah mengaruniakan kepada kita dari Roh-Nya" menempatkan "dari Roh-Nya" setelah penerima, sementara hal yang dikaruniakan tidak disebutkan. "Dia telah mengaruniakan dari Roh-Nya kepada kita" lebih dapat diterima dan tetap merepresentasikan ἐκ τοῦ πνεύματος αὐτοῦ tanpa memaksakan "sebagian."'
  - severity: low
    issue: Elipsis klausa kedua kurang wajar dalam bahasa Indonesia
    rationale: Yunani menghilangkan kata kerja kedua, tetapi bahasa Indonesia lebih alami bila menyatakan "Dia tetap tinggal di dalam kita." Pengulangan ini hanya mengekspresikan kata kerja yang jelas tersirat dari μένομεν.
  - severity: low
    issue: Penanda catatan kaki tidak ditempatkan pada frasa yang dijelaskan
    rationale: Penanda a menjelaskan "Dengan inilah" dan sebaiknya ditempatkan langsung sesudah frasa itu; penanda b menjelaskan "dari Roh-Nya" dan sebaiknya ditempatkan sesudah frasa tersebut, bukan keduanya pada akhir ayat.
