base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/013.yaml
  text: 'By this we know that we remain in him and he in us: because he has given us of his Spirit[a][b][c].'
translation:
  language: id
  text: Dengan inilah[a] kita tahu bahwa kita tetap tinggal di dalam Dia dan Dia tetap tinggal di dalam kita, karena Dia telah mengaruniakan dari Roh-Nya[b] kepada kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dalam hal inilah kita tahu ….” Ungkapan Yunani dapat diterjemahkan lebih harfiah demikian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari Roh-Nya,” yang menekankan sumber dan dapat pula mengandung nuansa partitif. Terjemahan yang lebih lancar dapat berbunyi, “karena Dia telah mengaruniakan Roh-Nya kepada kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τούτῳ
  choice: Dengan inilah
  rationale: Ungkapan ini memperkenalkan dasar atau bukti yang membuat sesuatu diketahui. “Dengan inilah” alami dalam bahasa Indonesia dan tetap mempertahankan daya tunjuk τούτῳ.
- source_word: γινώσκομεν
  choice: kita tahu
  rationale: Bentuk kini menyatakan pengetahuan atau keyakinan yang berlangsung; “kita tahu” adalah padanan langsung dan wajar.
- source_word: ἐν αὐτῷ μένομεν
  choice: kita tetap tinggal di dalam Dia
  rationale: “Tetap tinggal” mempertahankan unsur keberlanjutan pada μένω serta bahasa relasional khas Yohanes; “di dalam” mempertahankan gambaran saling berdiam.
- source_word: καὶ αὐτὸς ἐν ἡμῖν
  choice: dan Dia di dalam kita
  rationale: Mengikuti elipsis Yunani dengan tidak mengulang kata kerja, sambil mempertahankan paralelisme yang ringkas dan mudah dipahami.
- source_word: ὅτι
  choice: karena
  rationale: ὅτι kedua paling wajar dipahami sebagai pengantar dasar atau bukti bagi pengetahuan yang disebut sebelumnya.
- source_word: ἐκ τοῦ πνεύματος αὐτοῦ
  choice: dari Roh-Nya
  rationale: “Dari” mempertahankan arti sumber pada ἐκ dan tidak meniadakan kemungkinan nuansa partitif dalam ungkapan Yunani.
- source_word: δέδωκεν ἡμῖν
  choice: telah mengaruniakan kepada kita
  rationale: “Telah” mencerminkan tindakan sempurna dengan hasil yang tetap berlaku; “mengaruniakan” sesuai untuk pemberian ilahi tanpa menambahkan isi pemberian.
theological_decisions:
- issue: Rujukan αὐτός dan identitas πνεῦμα
  choice: Memakai “Dia” dan “Roh-Nya,” dengan huruf kapital, untuk merujuk kepada Allah dan Roh Kudus.
  alternative: Memakai huruf kecil sehingga “roh” dapat dipahami sebagai watak atau karunia rohani umum.
  rationale: Dalam konteks langsung 1 Yohanes 4, saling tinggal antara Allah dan orang percaya diketahui melalui pemberian Roh dari Allah. Kapitalisasi menandai referen kontekstual tanpa menambahkan gelar yang tidak terdapat dalam teks.
- issue: Bahasa saling tinggal khas Yohanes
  choice: “kita tetap tinggal di dalam Dia dan Dia di dalam kita”
  alternative: “kita hidup di dalam Dia dan Dia hidup di dalam kita”
  rationale: Pilihan ini mempertahankan metafora dan kesinambungan μένω, sekaligus tidak mengembangkan klausa kedua melampaui elipsis sumber.
- issue: Nuansa ἐκ τοῦ πνεύματος αὐτοῦ
  choice: Mempertahankan “dari Roh-Nya” dalam teks utama.
  alternative: “Roh-Nya” atau “sebagian dari Roh-Nya”
  rationale: “Dari” menjaga arti sumber dan kemungkinan nuansa partitif tanpa menyatakan bahwa Roh terbagi-bagi; alternatif yang lebih lancar dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. “Tetap tinggal” dipilih untuk menjaga istilah kunci Yohanes, sedangkan elipsis pada klausa kedua dipertahankan secara alami. Semua penanda catatan kaki ditempatkan dalam teks utama.
