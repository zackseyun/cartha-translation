  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ πᾶν πνεῦμα ὃ μὴ ὁμολογεῖ ⸀τὸν ⸀Ἰησοῦν ἐκ τοῦ θεοῦ οὐκ ἔστιν· καὶ τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου, ὃ ἀκηκόατε ὅτι ἔρχεται, καὶ νῦν ἐν τῷ κόσμῳ ἐστὶν ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/003.yaml
  text: and every spirit that does not confess Jesus is not from God[a]. And this is the spirit of the antichrist, which you have heard is coming[c][b], and now is already in the world.
translation:
  language: id
  text: dan setiap roh yang tidak mengakui Yesus tidak berasal dari Allah.[a] Inilah roh antikristus,[b] yang telah kamu dengar akan datang, dan sekarang sudah ada di dalam dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi, “tidak mengakui bahwa Yesus Kristus telah datang dalam daging.”
    reason: textual_variant
  - marker: b
    text: Secara harfiah, “inilah yang [milik] antikristus.” Bahasa Yunani tidak mengulangi kata “roh”, tetapi kata itu tersirat dari klausa sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν πνεῦμα
  choice: setiap roh
  rationale: Bentuk tunggal dengan πᾶν bersifat distributif. Dalam konteks ini yang dimaksud ialah berbagai pengaruh atau klaim rohani yang diuji, bukan Roh Kudus.
- source_word: ὁμολογεῖ τὸν Ἰησοῦν
  choice: mengakui Yesus
  rationale: Mengikuti teks pendek SBLGNT. 'Mengakui' secara alami menyampaikan pengakuan terbuka dan penerimaan terhadap Yesus; bacaan panjang dicatat dalam catatan kaki.
- source_word: ἐκ τοῦ θεοῦ
  choice: berasal dari Allah
  rationale: ἐκ menunjukkan sumber atau asal; frasa ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου
  choice: Inilah roh antikristus
  rationale: Bahasa Yunani berbentuk elipsis, tetapi 'roh' jelas tersirat dari klausa sebelumnya. Menyediakannya menghasilkan bahasa Indonesia yang wajar tanpa menambahkan gagasan asing; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ἀντιχρίστου
  choice: antikristus
  rationale: Istilah yang lazim dalam bahasa Indonesia. Frasa definit dalam konteks Yohanes menunjuk pada antikristus yang sudah dikenal para pembaca.
- source_word: ἀκηκόατε ὅτι ἔρχεται
  choice: yang telah kamu dengar akan datang
  rationale: Mempertahankan rujukan netral kepada 'roh antikristus' dan tidak mengubahnya menjadi pronomina maskulin yang akan menafsirkan anteseden sebagai pribadi antikristus.
- source_word: ἐν τῷ κόσμῳ
  choice: di dalam dunia
  rationale: Padanan yang sesuai bagi ungkapan khas Yohanes mengenai keberadaan dalam tatanan dunia manusia.
- source_word: ἤδη
  choice: sudah
  rationale: Menegaskan bahwa kehadiran yang dinantikan itu kini telah menjadi kenyataan.
theological_decisions:
- issue: Bentuk tekstual pengakuan yang ditolak
  choice: 'Teks utama mengikuti bacaan pendek SBLGNT: ''tidak mengakui Yesus''.'
  alternative: '''tidak mengakui bahwa Yesus Kristus telah datang sebagai manusia'''
  rationale: Bacaan kritis mendukung bentuk pendek, sedangkan ayat sebelumnya telah menyatakan isi kristologis pengakuan tersebut. Bacaan panjang dipertahankan dalam catatan kaki sebagai varian tekstual.
- issue: Elipsis dalam frasa τὸ τοῦ ἀντιχρίστου
  choice: Menyediakan kata tersirat 'roh' dalam teks utama.
  alternative: 'Secara lebih harfiah: ''inilah yang dari antikristus'' atau ''inilah milik antikristus''.'
  rationale: Kata πνεῦμα tidak diulang dalam bahasa Yunani, tetapi jelas tersirat dari klausa pertama. Penyediaannya diperlukan agar kalimat Indonesia alami, sementara elipsis sumber tetap dijelaskan dalam catatan kaki.
- issue: Anteseden bagi hal yang akan datang
  choice: Menghubungkannya dengan 'roh antikristus', bukan secara eksplisit dengan pribadi antikristus.
  alternative: '''yang telah kamu dengar bahwa ia akan datang'''
  rationale: Pronomina relatif Yunani berbentuk netral dan sesuai dengan ungkapan netral sebelumnya. Terjemahan tidak boleh diam-diam mengubahnya menjadi rujukan maskulin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kamu' dipakai sebagai sapaan jamak yang wajar kepada komunitas pembaca. Susunan klausa dibuat alami dalam bahasa Indonesia sambil menjaga ambiguitas rujukan netral dalam teks Yunani.
