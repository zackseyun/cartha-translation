  text: ὃς ⸀ἐὰν ὁμολογήσῃ ὅτι ⸀Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ, ὁ θεὸς ἐν αὐτῷ μένει καὶ αὐτὸς ἐν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/015.yaml
  text: Whoever confesses that Jesus is the Son of God[a], God remains in him, and he in God.
translation:
  language: id
  text: Siapa pun yang mengakui bahwa Yesus adalah Anak Allah, Allah tetap tinggal di dalam dia, dan dia di dalam Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah berdiam di dalam dia, dan dia di dalam Allah.” Kata Yunani menō merupakan istilah penting dalam tulisan Yohanes dan dapat diterjemahkan “tetap tinggal” atau “berdiam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: Siapa pun yang
  rationale: Gabungan pronomina relatif dan ἐάν membentuk klausa relatif tak tentu yang berlaku umum; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan arti ‘barang siapa’.
- source_word: ὁμολογήσῃ
  choice: mengakui
  rationale: Dalam konteks Yohanes, ὁμολογέω berarti menyatakan atau mengakui secara terbuka kebenaran tentang Yesus. ‘Mengakui’ alami dalam bahasa Indonesia dan tetap memiliki bobot pengakuan iman.
- source_word: Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ
  choice: Yesus adalah Anak Allah
  rationale: Terjemahan ini mempertahankan pernyataan identitas serta gelar kristologis yang eksplisit tanpa parafrasa tambahan.
- source_word: ἐν αὐτῷ μένει
  choice: tetap tinggal di dalam dia
  rationale: μένω adalah istilah penting dalam tulisan Yohanes yang memuat gagasan keberlangsungan dan relasi. ‘Tetap tinggal’ menyampaikan kedua unsur itu dengan bahasa modern.
- source_word: καὶ αὐτὸς ἐν τῷ θεῷ
  choice: dan dia di dalam Allah
  rationale: Sumber Yunani menghilangkan verba pada klausa kedua dan mengandalkan μένει dari klausa pertama. Terjemahan mempertahankan elipsis dan keseimbangan retoris tersebut.
theological_decisions:
- issue: Saling berdiam antara Allah dan orang percaya
  choice: Allah tetap tinggal di dalam dia, dan dia di dalam Allah
  alternative: Allah berdiam di dalam dia, dan dia berdiam di dalam Allah
  rationale: Rumusan timbal balik dipertahankan tanpa menjelaskan atau menyederhanakan hakikat relasi itu, sehingga ketegangan teologis teks tetap terjaga.
- issue: Gelar kristologis ὁ υἱὸς τοῦ θεοῦ
  choice: Anak Allah
  alternative: Anak-Nya Allah
  rationale: ‘Anak Allah’ adalah bentuk gelar yang baku, jelas, dan langsung mencerminkan konstruksi sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Dia’ dipakai untuk rujukan manusia agar tidak menambahkan kapitalisasi teologis yang tidak ditandai oleh bahasa Yunani; frasa ‘di dalam’ mempertahankan gambaran relasional sumber.
