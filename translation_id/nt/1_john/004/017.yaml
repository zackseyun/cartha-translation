source:
  edition: SBLGNT
  text: ἐν τούτῳ τετελείωται ἡ ἀγάπη μεθ’ ἡμῶν, ἵνα παρρησίαν ἔχωμεν ἐν τῇ ἡμέρᾳ τῆς κρίσεως, ὅτι καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν ἐν τῷ κόσμῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/017.yaml
  text: By this[a], love has been perfected with us, so that we may have boldness in the day of judgment, because as he is[d][c][b], so also are we in this world.
translation:
  language: id
  text: Dalam hal inilah[a] kasih telah dijadikan sempurna di antara kita, supaya kita memiliki keberanian[b] pada hari penghakiman, karena sebagaimana Dia[c] ada, demikian juga kita ada di dunia ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dengan inilah kasih telah dijadikan sempurna di antara kita.” Ungkapan Yunani dapat menunjuk pada dasar, cara, atau lingkup penyempurnaan kasih; frasa yang diterjemahkan “di antara kita” secara harfiah berarti “bersama kita.”
    reason: lexical_alternative
  - marker: b
    text: “Keberanian” juga dapat diterjemahkan “keyakinan” atau “keberanian penuh keyakinan.”
    reason: lexical_alternative
  - marker: c
    text: “Dia” kemungkinan besar menunjuk kepada Yesus; sebagian orang memahaminya sebagai rujukan yang lebih umum kepada Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Dengan inilah
  rationale: Ungkapan ini dapat menunjuk pada dasar, cara, atau hal yang kemudian dijelaskan; terjemahan ini alami dalam bahasa Indonesia sambil mempertahankan kemungkinan rujukan kontekstualnya.
- source_word: τετελείωται
  choice: telah dijadikan sempurna
  rationale: Bentuk perfekt pasif menyatakan tindakan yang sudah terlaksana dengan hasil yang tetap berlangsung; pilihan ini juga mempertahankan gagasan bahwa kasih dibawa kepada tujuan atau kelengkapannya.
- source_word: ἡ ἀγάπη μεθ’ ἡμῶν
  choice: kasih ... di antara kita
  rationale: Μετά dengan genitif secara harfiah berarti 'dengan', tetapi dalam konteks kehidupan bersama orang percaya, 'di antara kita' lebih wajar dan tetap tidak menentukan secara sempit apakah yang dimaksud ialah kasih Allah kepada kita, kasih kita kepada Allah, atau kasih timbal balik.
- source_word: ἵνα παρρησίαν ἔχωμεν
  choice: supaya kita memiliki keberanian
  rationale: Ἵνα menyatakan tujuan atau hasil, sedangkan παρρησία menunjuk pada kebebasan dan keyakinan untuk menghadap tanpa takut; 'keberanian' mempertahankan daya ungkap istilah itu.
- source_word: ἐν τῇ ἡμέρᾳ τῆς κρίσεως
  choice: pada hari penghakiman
  rationale: Ini merupakan ungkapan eskatologis yang alami dan jelas dalam bahasa Indonesia.
- source_word: ὅτι καθὼς ἐκεῖνός ἐστιν
  choice: karena sebagaimana Dia ada
  rationale: Ὅτι bersifat kausal. Kata ganti ἐκεῖνος kemungkinan besar menunjuk kepada Yesus, tetapi teks Yunani sendiri membiarkan antesedennya tersirat; kala kini ἐστιν dipertahankan dengan 'ada'.
- source_word: καὶ ἡμεῖς ἐσμεν
  choice: demikian juga kita ada
  rationale: Susunan korelatif 'sebagaimana ... demikian juga' menyampaikan hubungan perbandingan καθώς ... καί dengan jelas.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: di dunia ini
  rationale: κόσμος di sini menunjuk pada ranah kehidupan manusia sekarang; 'dunia ini' merupakan padanan Indonesia yang baku dan sesuai konteks.
theological_decisions:
- issue: Rujukan kata ganti ἐκεῖνος
  choice: Mempertahankan kata ganti 'Dia' dalam teks; kemungkinan besar menunjuk kepada Yesus Kristus
  alternative: Dipahami lebih umum sebagai Allah
  rationale: Dalam 1 Yohanes, ἐκεῖνος kerap menunjuk kepada Yesus dalam pernyataan etis dan kristologis. Namun, karena bahasa Yunani tidak menyebut nama secara eksplisit, terjemahan juga tidak menggantinya dengan nama tertentu; catatan kaki menjelaskan kemungkinan rujukannya.
- issue: Makna kasih yang dijadikan sempurna
  choice: Kasih dibawa kepada kepenuhan atau tujuan yang dimaksudkan dalam kehidupan bersama orang percaya
  alternative: Hanya kasih kita kepada Allah yang menjadi sempurna, atau hanya kasih Allah kepada kita yang mencapai kesempurnaan
  rationale: Teks Yunani tidak membatasi arah kasih itu secara tegas. Rumusan ini mempertahankan ketegangan teologis tersebut dan tidak memasukkan ajaran kesempurnaan moral tanpa dosa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur perbandingan dipertahankan secara dekat, sedangkan 'di antara kita' dipilih daripada 'bersama kita' agar alami tanpa mempersempit arah kasih. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
