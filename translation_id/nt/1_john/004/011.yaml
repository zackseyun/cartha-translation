reference: 1 John 4:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀγαπητοί, εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς, καὶ ἡμεῖς ὀφείλομεν ἀλλήλους ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/011.yaml
  text: Beloved[a], if God so loved us, we also ought to love one another.
translation:
  language: id
  text: Saudara-saudara terkasih, jika[a] Allah telah mengasihi kita sedemikian rupa, kita pun wajib saling mengasihi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena Allah telah mengasihi kita dengan cara demikian.” Bahasa Yunani memakai bentuk pengandaian (“jika”), yang dalam konteks ini tampaknya menganggap hal tersebut sebagai kenyataan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Saudara-saudara terkasih
  rationale: Sapaan jamak ini alami dan penuh kasih dalam bahasa Indonesia. Kata “terkasih” mempertahankan kaitan leksikal dengan kata kerja “mengasihi,” sedangkan “saudara-saudara” memperjelas bahwa jemaat sedang disapa tanpa menambahkan kepunyaan seperti “-ku” yang tidak terdapat dalam teks Yunani.
- source_word: εἰ
  choice: jika
  rationale: Mempertahankan bentuk pengandaian Yunani. Dalam konteks, kenyataan bahwa Allah mengasihi kita tidak diragukan, tetapi bentuk “jika” memberi daya retoris pada nasihat yang menyusul.
- source_word: οὕτως
  choice: sedemikian rupa
  rationale: Ungkapan ini dapat menunjuk kembali kepada cara sekaligus besarnya kasih Allah yang baru dijelaskan, sehingga ambiguitas wajar οὕτως tidak dipersempit.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Padanan baku dan alami untuk θεός dalam bahasa Indonesia.
- source_word: ἠγάπησεν
  choice: telah mengasihi
  rationale: Menyatakan tindakan kasih Allah yang sudah nyata dan mempertahankan kosakata “kasih” yang berulang dalam ayat ini.
- source_word: ἡμᾶς
  choice: kita
  rationale: Pronomina inklusif sesuai konteks, mencakup penulis dan para pembacanya.
- source_word: καὶ ἡμεῖς
  choice: kita pun
  rationale: “Pun” menyampaikan καί dan penekanan pada pronomina eksplisit ἡμεῖς secara alami.
- source_word: ὀφείλομεν
  choice: wajib
  rationale: Menyampaikan kewajiban moral yang terkandung dalam ὀφείλω dengan ringkas dan jelas, tanpa mengubahnya menjadi perintah langsung.
- source_word: ἀλλήλους ἀγαπᾶν
  choice: saling mengasihi
  rationale: Padanan idiomatis bagi tindakan timbal balik “mengasihi satu sama lain,” sekaligus mempertahankan istilah utama tentang kasih.
theological_decisions:
- issue: Daya pengandaian εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς
  choice: Mempertahankan “jika Allah telah mengasihi kita sedemikian rupa.”
  alternative: “karena Allah telah mengasihi kita dengan cara demikian”
  rationale: Konteks menganggap kasih Allah sebagai kenyataan, tetapi teks Yunani tetap menyatakannya dalam bentuk pengandaian. “Jika” mempertahankan susunan dan daya retoris sumber tanpa menyiratkan keraguan bahwa Allah sungguh mengasihi kita.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada hangat, luhur, dan mudah dipahami. Sapaan “Saudara-saudara terkasih” dipilih sebagai bentuk jemaat yang alami; susunan kalimat tetap dekat dengan teks Yunani, sedangkan “saling mengasihi” menjaga kelancaran idiom Indonesia.
