  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ θεοῦ ἐστε, τεκνία, καὶ νενικήκατε αὐτούς, ὅτι μείζων ἐστὶν ὁ ἐν ὑμῖν ἢ ὁ ἐν τῷ κόσμῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/004.yaml
  text: You are from God[a], little children, and you have overcome them[b], because the one who is in you is greater than the one who is in the world.
translation:
  language: id
  text: Kamu berasal dari Allah, anak-anakku, dan kamu telah mengalahkan mereka[a], sebab dia yang ada di dalam kamu lebih besar daripada dia yang ada di dalam dunia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaitu, pihak-pihak yang baru saja disebut, khususnya nabi-nabi palsu.
    reason: cross_reference
  - marker: b
    text: Dalam bahasa Yunani, kedua rujukan ini tidak menyebutkan identitasnya secara eksplisit. Konteks mengarah kepada Allah atau Roh-Nya untuk yang ada di dalam kamu, dan kepada si jahat di balik dunia untuk yang ada di dalam dunia.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς
  choice: Kamu
  rationale: Pronomina ini dinyatakan secara eksplisit dan bersifat menegaskan. 'Kamu' wajar dalam bahasa Indonesia dan sapaan 'anak-anakku' turut mempertahankan penekanan langsung kepada para pembaca.
- source_word: ἐκ τοῦ θεοῦ
  choice: berasal dari Allah
  rationale: ἐκ menyatakan sumber atau asal, sekaligus menyiratkan kepunyaan yang bersumber dari Allah. 'Berasal dari Allah' alami dan lebih tepat daripada sekadar 'milik Allah'.
- source_word: τεκνία
  choice: anak-anakku
  rationale: Bentuk diminutif ini merupakan sapaan kekeluargaan yang penuh kasih. Akhiran '-ku' secara alami menyampaikan hubungan afektif penulis dengan pembacanya tanpa mengharuskan arti usia harfiah.
- source_word: νενικήκατε
  choice: telah mengalahkan
  rationale: Bentuk perfek menyatakan kemenangan yang sudah dicapai dan hasilnya tetap berlaku. 'Telah mengalahkan' mempertahankan aspek itu secara wajar.
- source_word: αὐτούς
  choice: mereka
  rationale: Pronomina ini menunjuk kembali kepada pihak-pihak yang disebut dalam konteks sebelumnya. Terjemahan 'mereka' tidak mempersempit rujukannya di dalam teks utama.
- source_word: ὅτι
  choice: sebab
  rationale: ὅτι memperkenalkan alasan para pembaca dapat mengalahkan mereka. 'Sebab' jelas, ringkas, dan sesuai dengan ragam Alkitab modern yang bermartabat.
- source_word: μείζων
  choice: lebih besar
  rationale: Kata perbandingan ini luas cakupannya dan tidak boleh dipersempit hanya menjadi 'lebih kuat'. 'Lebih besar' mempertahankan keluasan maknanya.
- source_word: ὁ ἐν ὑμῖν
  choice: Dia yang ada di dalam kamu
  rationale: Frasa substantival ini menunjuk kepada sosok personal tetapi tidak menyebut identitasnya secara eksplisit. 'Dia yang ada di dalam kamu' mempertahankan implisitness rujukan sambil terdengar alami.
- source_word: ὁ ἐν τῷ κόσμῳ
  choice: dia yang ada di dalam dunia
  rationale: Terjemahan ini sejajar dengan frasa sebelumnya dan mempertahankan rujukan implisit. Huruf kecil membedakannya sesuai petunjuk konteks, tanpa menambahkan nama atau gelar yang tidak terdapat dalam bahasa Yunani.
- source_word: κόσμῳ
  choice: dunia
  rationale: Dalam tulisan Yohanes, κόσμος sering menunjuk kepada dunia yang menentang Allah, tetapi 'dunia' adalah padanan dasar yang menjaga jangkauan makna tanpa menambahkan tafsiran seperti 'sistem dunia'.
theological_decisions:
- issue: Identitas 'Dia yang ada di dalam kamu' dan 'dia yang ada di dalam dunia'
  choice: Kedua sosok tetap tidak dinamai dalam teks utama; kapitalisasi Indonesia membedakan rujukan pertama dan kedua.
  alternative: Menyebut yang pertama sebagai Allah atau Roh Kudus dan yang kedua sebagai Iblis atau si jahat.
  rationale: Konteks kuat mengarahkan rujukan pertama kepada Allah atau Roh-Nya dan rujukan kedua kepada si jahat di balik dunia, tetapi bahasa Yunani memakai ungkapan substantival tanpa menyebut identitas keduanya. Teks utama mempertahankan ketegangan itu, sedangkan catatan menjelaskannya.
- issue: Rujukan αὐτούς ('mereka')
  choice: Mempertahankan pronomina 'mereka' dalam teks utama dan menjelaskan rujukannya dalam catatan kaki.
  alternative: Mengganti dengan 'nabi-nabi palsu itu', 'roh-roh itu', atau 'lawan-lawan itu'.
  rationale: Konteks langsung menunjuk kepada nabi-nabi palsu dan pihak penentang yang baru disebut, tetapi pronomina Yunani tidak mengulangi identitas mereka. Mempertahankan pronomina menghindari penjelasan berlebih dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada akrab dan bermartabat. 'Anak-anakku' mempertahankan kasih pastoral Yohanes; 'berasal dari Allah' menyampaikan sumber; struktur perbandingan dipertahankan secara sejajar. Semua penjelasan yang melampaui bentuk eksplisit bahasa Yunani ditempatkan dalam catatan kaki.
