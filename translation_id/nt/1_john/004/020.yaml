  text: ἐάν τις εἴπῃ ὅτι Ἀγαπῶ τὸν θεόν, καὶ τὸν ἀδελφὸν αὐτοῦ μισῇ, ψεύστης ἐστίν· ὁ γὰρ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ὃν ἑώρακεν, τὸν θεὸν ὃν οὐχ ἑώρακεν ⸀οὐ δύναται ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/020.yaml
  text: If anyone says[a], “I love God,” and hates his brother, he is a liar; for the one who does not love his brother whom he has seen cannot love God whom he has not seen.
translation:
  language: id
  text: Jika seseorang berkata, “Aku mengasihi Allah,” dan membenci saudaranya, ia adalah pendusta. Sebab orang yang tidak mengasihi saudaranya yang sudah dilihatnya tidak dapat mengasihi Allah yang tidak pernah dilihatnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐάν τις εἴπῃ
  choice: Jika seseorang berkata
  rationale: ἐάν dengan subjungtif aoris memperkenalkan kondisi umum, sedangkan τις menyatakan orang yang tidak tertentu. Bentuk ini alami dalam bahasa Indonesia.
- source_word: Ἀγαπῶ
  choice: Aku mengasihi
  rationale: Bentuk kini indikatif diterjemahkan langsung dan mempertahankan hubungan leksikal dengan bentuk-bentuk ἀγαπάω yang berulang dalam ayat ini.
- source_word: τὸν θεόν
  choice: Allah
  rationale: Merupakan objek langsung ἀγαπῶ; 'Allah' adalah padanan baku dan alami dalam bahasa Indonesia.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: saudaranya
  rationale: ἀδελφός berbentuk maskulin tunggal. 'Saudaranya' mempertahankan ungkapan kekerabatan dan dalam bahasa Indonesia dapat dipahami secara representatif tanpa memaksakan tafsiran 'sesama orang percaya' ke dalam teks utama.
- source_word: μισῇ
  choice: membenci
  rationale: Subjungtif kini dalam klausa kondisi secara alami dinyatakan dengan verba aktif 'membenci'.
- source_word: ψεύστης ἐστίν
  choice: ia adalah pendusta
  rationale: ψεύστης adalah nomina predikatif. 'Pendusta' mempertahankan penilaian kategoris teks, bukan sekadar menyatakan bahwa orang itu sedang berbohong.
- source_word: ὁ γὰρ μὴ ἀγαπῶν
  choice: Sebab, orang yang tidak mengasihi
  rationale: Partisip berartikel berfungsi substantival. 'Orang yang tidak mengasihi' jelas dan alami, sementara 'sebab' mempertahankan fungsi penjelas γάρ.
- source_word: ὃν ἑώρακεν
  choice: yang telah dilihatnya
  rationale: Perfek ἑώρακεν menunjukkan tindakan melihat yang sudah terjadi dan tetap relevan; 'telah dilihatnya' menyampaikan aspek itu dengan wajar.
- source_word: ὃν οὐχ ἑώρακεν
  choice: yang belum pernah dilihatnya
  rationale: Negasi dengan bentuk perfek menyatakan bahwa sampai saat ini Allah tidak pernah dilihat oleh orang tersebut. 'Belum pernah' mengungkapkan keadaan itu secara alami.
- source_word: οὐ δύναται ἀγαπᾶν
  choice: tidak dapat mengasihi
  rationale: δύναται menyatakan kemampuan atau kemungkinan. 'Tidak dapat mengasihi' mempertahankan kuatnya ketidakmungkinan dalam argumen Yohanes.
theological_decisions:
- issue: Cakupan ἀδελφός dalam konteks komunitas orang percaya
  choice: saudaranya
  alternative: saudara laki-laki atau perempuannya; sesama orang percaya
  rationale: Bentuk Yunani adalah maskulin tunggal, tetapi dapat berfungsi secara representatif dalam konteks. 'Saudaranya' cukup dekat dengan bentuk sumber dan tidak mempersempitnya hanya kepada saudara kandung atau secara eksplisit menafsirkannya sebagai sesama orang percaya.
- issue: Kekuatan οὐ δύναται ἀγαπᾶν
  choice: tidak dapat mengasihi Allah
  alternative: tidak mampu mengasihi Allah
  rationale: Pernyataan ini mengungkapkan ketidakmungkinan moral-rohani dalam alur argumen Yohanes, bukan sekadar kesulitan praktis. Terjemahan utama mempertahankan klaim kuat itu tanpa menambahkan penjelasan filosofis.
- issue: Hubungan antara klaim mengasihi Allah dan kebencian terhadap saudara
  choice: tetapi membenci saudaranya
  alternative: dan membenci saudaranya
  rationale: καί secara bentuk berarti 'dan', tetapi di sini menghubungkan dua keadaan yang saling bertentangan. 'Tetapi' menyampaikan hubungan adversatif kontekstual secara alami tanpa mengubah isi proposisinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'ia' digunakan untuk narasi, sedangkan 'Aku' mempertahankan ujaran langsung. 'Pendusta' dipilih daripada 'pembohong' untuk nada sastra yang tegas namun tetap mudah dipahami.
