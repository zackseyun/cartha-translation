revisions:
- from: Jika seseorang berkata[a], “Aku mengasihi Allah,” tetapi membenci saudaranya, ia adalah pendusta. Sebab, orang yang tidak mengasihi saudaranya yang telah dilihatnya tidak dapat mengasihi Allah yang belum pernah dilihatnya.
  to: Jika seseorang berkata, “Aku mengasihi Allah,” dan membenci saudaranya, ia adalah pendusta. Sebab orang yang tidak mengasihi saudaranya yang sudah dilihatnya tidak dapat mengasihi Allah yang tidak pernah dilihatnya.
  rationale: Revisi mengganti “tetapi” dengan “dan” agar lebih dekat dengan καί tanpa menghilangkan kontras yang sudah tersirat dalam isi pernyataan. “Telah dilihatnya” diperbarui menjadi “sudah dilihatnya” demi kelancaran modern, dan “belum pernah dilihatnya” menjadi “tidak pernah dilihatnya” untuk menyatakan negasi perfek tanpa menyiratkan bahwa Allah mungkin akan dilihat kemudian. Catatan kaki yang tidak perlu dihapus.
