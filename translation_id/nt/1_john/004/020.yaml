  terminology: “Mengasihi” mempertahankan pengulangan ἀγαπάω; “Allah” tepat untuk θεός; dan “saudaranya” adalah padanan Indonesia yang alami bagi ἀδελφόν tanpa memasukkan tafsiran “sesama orang percaya” ke teks utama. Bahasa Indonesia tidak membedakan gender pada “saudara”; tidak diperlukan perluasan interpretatif dalam teks atau catatan.
