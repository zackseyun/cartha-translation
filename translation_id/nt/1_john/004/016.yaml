  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. Ὁ θεὸς ἀγάπη ἐστίν, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ ⸀μένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/016.yaml
  text: And we have come to know and have believed the love that God has for us[a]. God is love, and the one who remains in love remains in God[c][b], and God remains in him.
translation:
  language: id
  text: Kita telah mengenal dan memercayai kasih Allah yang ada di antara kita.[a] Allah adalah kasih. Orang yang tinggal di dalam kasih tinggal di dalam Allah, dan Allah tinggal di dalam dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kasih Allah yang ada di dalam kita.” Frasa Yunani dapat menunjuk pada kasih yang hadir dalam diri orang-orang percaya atau yang nyata di tengah persekutuan mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγνώκαμεν
  choice: telah mengenal
  rationale: Bentuk perfektum menunjukkan pengenalan yang telah diperoleh dan tetap berlaku; “telah mengenal” menyampaikan keadaan kini yang berasal dari pengalaman sebelumnya.
- source_word: πεπιστεύκαμεν
  choice: memercayai
  rationale: Kata ini menyatakan kepercayaan yang telah terbentuk dan tetap berlangsung. Unsur perfektum dipayungi oleh “telah” dalam rangkaian “telah mengenal dan memercayai” agar bahasa Indonesia tetap alami.
- source_word: τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν
  choice: kasih Allah yang ada di antara kita
  rationale: Susunan ini mempertahankan kasih sebagai objek kedua verba dan menerjemahkan ἐν ἡμῖν secara lokatif-komunal. Ungkapan ini lebih alami daripada terjemahan harfiah “kasih yang Allah miliki di dalam kita” tanpa mengubahnya menjadi makna benefaktif “bagi kita”.
- source_word: Ὁ θεὸς ἀγάπη ἐστίν
  choice: Allah adalah kasih
  rationale: Konstruksi predikat nominatif diterjemahkan langsung, tanpa penjelasan tambahan.
- source_word: ὁ μένων ἐν τῇ ἀγάπῃ
  choice: orang yang tinggal di dalam kasih
  rationale: “Tinggal” mempertahankan istilah kunci Yohanes μένω dan menggambarkan keberlangsungan relasi; “di dalam kasih” mempertahankan gambaran ranah atau lingkungan kasih.
- source_word: ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ μένει
  choice: tinggal di dalam Allah, dan Allah tinggal di dalam dia
  rationale: Pengulangan “tinggal” mempertahankan bentuk timbal balik dan pengulangan μένω dalam teks sumber. “Dia” secara alami merujuk kembali kepada “orang yang” dan tidak membatasi jenis kelamin dalam bahasa Indonesia.
theological_decisions:
- issue: Makna ἐν ἡμῖν pada klausa pertama
  choice: 'lokatif-komunal: “di antara kita”'
  alternative: “di dalam kita” sebagai kasih yang hadir atau bekerja dalam diri orang percaya; “bagi kita” sebagai kasih yang diarahkan kepada kita
  rationale: Preposisi ἐν pada dasarnya bersifat lokatif. Konteks surat ini memungkinkan dimensi batin maupun komunal; “di antara kita” mempertahankan lokasinya dalam persekutuan tanpa menutup kemungkinan partisipasi pribadi. Alternatif dicatat karena bahasa Yunani sungguh dapat dibaca “di dalam kita”.
- issue: Tinggal timbal balik antara Allah dan orang yang tinggal dalam kasih
  choice: mempertahankan kedua klausa secara sejajar
  alternative: menjelaskannya sebagai persatuan, persekutuan, atau kehadiran rohani
  rationale: Teks menyatakan hubungan timbal balik dengan bahasa “tinggal di dalam” tanpa menerangkan mekanismenya; terjemahan tidak menambahkan rumusan teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan khidmat. “Kita” mempertahankan bentuk jamak inklusif yang wajar dalam konteks penulis bersama para pembacanya. Istilah “tinggal di dalam” dipakai secara konsisten untuk menjaga metafora khas Yohanes dan hubungan timbal balik dalam ayat ini.
