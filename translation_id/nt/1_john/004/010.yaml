  text: ἐν τούτῳ ἐστὶν ἡ ἀγάπη, οὐχ ὅτι ἡμεῖς ⸀ἠγαπήκαμεν τὸν θεόν, ἀλλ’ ὅτι αὐτὸς ἠγάπησεν ἡμᾶς καὶ ἀπέστειλεν τὸν υἱὸν αὐτοῦ ἱλασμὸν περὶ τῶν ἁμαρτιῶν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/010.yaml
  text: 'In this is love: not that we have loved God, but that he loved us and sent his Son as an atoning sacrifice for our sins.'
translation:
  language: id
  text: 'Kasih itu terletak dalam hal ini: bukan bahwa kita telah mengasihi Allah, melainkan bahwa Dia mengasihi kita dan mengutus Anak-Nya sebagai kurban pendamaian[a] bagi dosa-dosa kita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pendamaian”; dapat juga dipahami sebagai “penghapusan dosa.” Istilah Yunani ἱλασμός menunjuk pada tindakan kurban Anak-Nya dalam kaitannya dengan dosa-dosa kita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ ἐστὶν ἡ ἀγάπη
  choice: Dalam hal inilah kasih itu nyata
  rationale: Ungkapan Yohanes ini menunjuk pada hal yang menyusul sebagai perwujudan yang menentukan dari kasih. Penambahan idiomatis 'nyata' membuat susunan tersebut alami dalam bahasa Indonesia tanpa mengubah arah rujukannya.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: bukan bahwa ... melainkan bahwa
  rationale: Mempertahankan konstruksi kontras Yunani yang mendefinisikan kasih, bukan mengubahnya menjadi penjelasan sebab-akibat.
- source_word: ἠγαπήκαμεν
  choice: kita telah mengasihi
  rationale: Kata 'telah' mewakili bentuk perfektum dan mempertahankan kontras dengan tindakan Allah yang tegas pada masa lampau.
- source_word: αὐτὸς ἠγάπησεν ἡμᾶς
  choice: Dia mengasihi kita
  rationale: Kontras 'bukan ... melainkan' sudah menyampaikan penekanan pada αὐτός; 'Dia sendiri' tidak diperlukan dan terasa lebih berat.
- source_word: ἀπέστειλεν τὸν υἱὸν αὐτοῦ
  choice: mengutus Anak-Nya
  rationale: Mengutus mempertahankan nuansa tindakan pengutusan yang penting dalam tulisan Yohanes, sedangkan 'Anak-Nya' merupakan bentuk Indonesia yang alami dan tepat.
- source_word: ἱλασμὸν
  choice: kurban pendamaian
  rationale: Pilihan ini menyampaikan sarana kurban yang secara efektif menangani dosa, dengan bahasa yang cukup mudah dipahami, tanpa secara sepihak membatasi istilah itu hanya pada peredaan murka atau hanya pada penghapusan dosa.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: bagi dosa-dosa kita
  rationale: Dalam konteks kurban, περί secara alami menyatakan hubungan kurban itu dengan dosa; 'bagi' menjaga hubungan tersebut tanpa parafrasa berlebihan.
theological_decisions:
- issue: Makna ἱλασμός dalam konteks pendamaian
  choice: kurban pendamaian
  alternative: kurban penebus; kurban penghapus dosa; pendamaian
  rationale: Istilah Yunani menunjuk pada tindakan kurban Sang Anak dalam menangani dosa. 'Kurban pendamaian' mempertahankan unsur kurban dan cakupan teologisnya tanpa menetapkan secara eksklusif teori peredaan murka atau penghapusan dosa; alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, khidmat tetapi mudah dipahami. Kapitalisasi 'Dia' dan bentuk '-Nya' digunakan bagi Allah dan Anak-Nya sesuai kebiasaan umum penerjemahan Alkitab Indonesia. Istilah teknis yang lebih sempit dijaga dalam catatan kaki agar ketegangan makna sumber tidak dihapus.
