source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν ἐντολὴν ἔχομεν ἀπ’ αὐτοῦ, ἵνα ὁ ἀγαπῶν τὸν θεὸν ἀγαπᾷ καὶ τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/021.yaml
  text: 'And we have this commandment from him: that the one who loves God should also love his brother[a].'
translation:
  language: id
  text: 'Dan inilah perintah yang kita miliki dari-Nya: orang yang mengasihi Allah harus juga mengasihi saudaranya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudaranya.” Kata Yunani berbentuk maskulin tunggal dan dapat dipakai secara representatif; dalam konteks ini dapat merujuk kepada saudara atau saudari seiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολήν
  choice: perintah
  rationale: Dalam bahasa Indonesia modern, “perintah” secara alami menyampaikan kewibawaan moral ἐντολή dalam konteks Yohanes; “perintah Allah” lebih wajar daripada “perintah hukum” atau bentuk lain yang terlalu teknis.
- source_word: ἀπ’ αὐτοῦ
  choice: dari-Nya
  rationale: Mempertahankan pronomina Yunani, yang dalam konteks langsung merujuk kepada Allah, tanpa mengulang nama Allah. Huruf kapital membantu menunjukkan rujukan ilahi menurut kebiasaan penulisan Indonesia.
- source_word: ἵνα
  choice: ':'
  rationale: Dalam konstruksi ini ἵνα memperkenalkan isi perintah. Tanda titik dua sesudah “ini” mengungkapkan fungsi tersebut secara wajar dalam bahasa Indonesia tanpa memberi kesan tujuan yang kuat.
- source_word: ὁ ἀγαπῶν τὸν θεόν
  choice: orang yang mengasihi Allah
  rationale: Menyampaikan partisipel berartikel sebagai sebutan umum bagi siapa pun yang mengasihi Allah, sambil tetap memakai bentuk tunggal yang alami dan tidak bergender dalam bahasa Indonesia.
- source_word: ἀγαπᾷ
  choice: harus ... mengasihi
  rationale: Subjungtif setelah ἵνα menyatakan tuntutan yang terkandung dalam perintah. “Harus” dengan jelas mempertahankan daya kewajiban itu dalam bahasa Indonesia.
- source_word: ἀδελφὸν αὐτοῦ
  choice: saudara seimannya
  rationale: Dalam konteks 1 Yohanes, ἀδελφός menunjuk sesama anggota komunitas orang percaya. “Saudara seiman” alami dalam bahasa Indonesia dan mempertahankan bahasa kekerabatan serta makna komunal, sedangkan cakupan gender dijelaskan dalam catatan kaki.
- source_word: καὶ
  choice: juga
  rationale: 'Καί yang kedua bersifat aditif: kasih kepada Allah harus disertai kasih kepada saudara seiman. “Juga” menyampaikan penekanan ini dengan alami.'
- source_word: ἀγαπάω / ἀγαπῶν / ἀγαπᾷ
  choice: mengasihi
  rationale: “Mengasihi” dipakai secara konsisten untuk kedua bentuk verba dan sesuai dengan register luhur tetapi mudah dipahami dalam teks Alkitab Indonesia.
theological_decisions:
- issue: Cakupan gender dan identitas ἀδελφὸν αὐτοῦ
  choice: saudara seimannya
  alternative: saudaranya; saudara laki-lakinya; saudara atau saudari seimannya
  rationale: Bentuk Yunani adalah maskulin tunggal, tetapi dalam konteks Yohanes dapat berfungsi secara representatif bagi sesama orang percaya. Bahasa Indonesia tidak mewajibkan penandaan gender pada “saudara”; penambahan “seiman” menjernihkan rujukan komunal tanpa membatasi kepada laki-laki. Catatan kaki mempertahankan informasi bentuk sumber dan alternatif yang lebih eksplisit.
- issue: Kadar kewajiban pada ἀγαπᾷ sesudah ἵνα
  choice: harus juga mengasihi
  alternative: hendaknya juga mengasihi
  rationale: Karena klausa ini menyatakan isi sebuah perintah, “harus” mempertahankan daya normatif teks. “Hendaknya” mungkin terdengar lebih lunak sebagai anjuran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat ringkas mengikuti alur Yunani. “Menerima perintah” dipilih agar frasa “kita ... dari-Nya” terdengar alami; “saudara seiman” mudah dipahami pembaca umum dan menjaga nuansa kekeluargaan komunitas iman.
