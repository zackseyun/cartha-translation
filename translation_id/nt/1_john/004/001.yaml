  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ παντὶ πνεύματι πιστεύετε, ἀλλὰ δοκιμάζετε τὰ πνεύματα εἰ ἐκ τοῦ θεοῦ ἐστιν, ὅτι πολλοὶ ψευδοπροφῆται ἐξεληλύθασιν εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/001.yaml
  text: Beloved[a], do not believe every spirit, but test the spirits to see whether they are from God[b], because many false prophets have gone out into the world.
translation:
  language: id
  text: Saudara-saudara yang terkasih,[a] janganlah percaya kepada setiap roh, tetapi ujilah roh-roh itu untuk mengetahui apakah mereka berasal dari Allah,[b] sebab banyak nabi palsu telah pergi ke dalam dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Sahabat-sahabat terkasih.” Sapaan Yunani ini secara harfiah berarti “orang-orang yang dikasihi.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, ujilah sumber rohani di balik berbagai klaim kenabian; anak kalimat berikutnya menyebut “nabi palsu” sebagai pelaku manusianya.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Saudara-saudara yang terkasih
  rationale: Sapaan jamak yang hangat dan bermartabat; mempertahankan kaitan leksikal dengan kasih sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: παντὶ πνεύματι
  choice: setiap roh
  rationale: Mempertahankan bahasa rohani dalam teks dan tidak mempersempit acuannya menjadi sekadar pengajar atau perkataan tertentu.
- source_word: πιστεύετε
  choice: percaya kepada
  rationale: Larangan umum agar pembaca tidak menerima begitu saja setiap roh atau klaim yang bersumber darinya.
- source_word: δοκιμάζετε
  choice: ujilah
  rationale: Menyatakan tindakan memeriksa untuk menentukan keaslian atau kebenaran.
- source_word: τὰ πνεύματα
  choice: roh-roh itu
  rationale: Mempertahankan bentuk jamak dan kerangka supranatural teks; kata penunjuk membuat rujukannya wajar dalam bahasa Indonesia.
- source_word: εἰ ἐκ τοῦ θεοῦ ἐστιν
  choice: untuk mengetahui apakah mereka berasal dari Allah
  rationale: Menyampaikan tujuan pengujian secara alami; bentuk Indonesia mengikuti anteseden jamak tanpa menghilangkan gagasan sumber atau asal.
- source_word: ἐκ τοῦ θεοῦ
  choice: berasal dari Allah
  rationale: ἐκ menunjukkan sumber atau asal; frasa ini lebih jelas daripada sekadar 'dari Allah' dalam konteks pengujian.
- source_word: πολλοὶ ψευδοπροφῆται
  choice: banyak nabi palsu
  rationale: Padanan langsung dan lazim yang mempertahankan pembedaan antara roh sebagai sumber dan nabi sebagai pelaku manusia.
- source_word: ἐξεληλύθασιν
  choice: telah pergi
  rationale: 'Mempertahankan citra gerak dan hasil kini dari bentuk perfek Yunani: mereka sudah pergi dan kini aktif.'
- source_word: εἰς τὸν κόσμον
  choice: ke seluruh dunia
  rationale: Ungkapan Indonesia yang alami untuk gerak memasuki ranah manusia secara luas; 'seluruh' mengungkapkan cakupan idiomatis tanpa menjadikan κόσμος suatu 'sistem' teologis.
theological_decisions:
- issue: Acuan 'roh-roh'
  choice: Roh atau sumber rohani nyata di balik klaim kenabian, yang diuji melalui para nabi manusia
  alternative: Hanya para pengajar manusia atau semata-mata ucapan kenabian
  rationale: Teks menyebut 'roh-roh' lalu 'nabi palsu', sehingga pembedaan antara sumber rohani dan pelaku manusia sebaiknya dipertahankan tanpa menjelaskan mekanismenya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern, hangat, dan bermartabat. Bentuk 'janganlah' dan 'ujilah' mempertahankan nada nasihat kerasulan. Semua penanda catatan kaki dicantumkan dalam teks utama.
