  text: μάλιστα δὲ τοὺς ὀπίσω σαρκὸς ἐν ἐπιθυμίᾳ μιασμοῦ πορευομένους καὶ κυριότητος καταφρονοῦντας. Τολμηταί, αὐθάδεις, δόξας οὐ τρέμουσιν, βλασφημοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/010.yaml
  text: especially those who go after the flesh in the desire for defilement and despise authority[a]. Bold, self-willed, they do not tremble as they blaspheme glorious ones[d][c][b],
translation:
  language: id
  text: terutama mereka yang menuruti daging dengan keinginan akan kenajisan dan yang meremehkan otoritas[a]. Mereka lancang dan keras kepala; mereka tidak gentar ketika menghujat makhluk-makhluk mulia[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketuanan” atau “pemerintahan.” Istilah Yunaninya tidak menentukan apakah yang dimaksud ialah otoritas Tuhan, otoritas secara umum, atau pemerintahan makhluk surgawi. Frasa sebelumnya juga dapat diterjemahkan “dalam hawa nafsu akan kenajisan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kemuliaan-kemuliaan”; kemungkinan besar yang dimaksud ialah makhluk-makhluk surgawi yang mulia, tetapi identitas mereka tidak disebutkan secara tegas.
    reason: alternative_reading
lexical_decisions:
- source_word: μάλιστα
  choice: terutama
  rationale: Menandai penekanan khusus dalam kelanjutan penghukuman yang disebut pada ayat sebelumnya.
- source_word: ὀπίσω σαρκὸς
  choice: mengikuti keinginan daging
  rationale: Mengungkapkan idiom Yunani secara alami dalam bahasa Indonesia sambil mempertahankan istilah 'daging' dan nuansa moral konteksnya.
- source_word: ἐν ἐπιθυμίᾳ μιασμοῦ
  choice: dalam hawa nafsu yang menajiskan
  rationale: Genitif μιασμοῦ dapat menyatakan sifat atau akibat hasrat itu. Rumusan ini alami dan mempertahankan kaitan antara nafsu dan kenajisan tanpa menyatakan bahwa kenajisan itu sendiri secara harfiah menjadi objek yang diinginkan.
- source_word: κυριότητος
  choice: kekuasaan
  rationale: Mencakup arti otoritas, ketuanan, atau wilayah kekuasaan tanpa memastikan siapa pemegangnya.
- source_word: καταφρονοῦντας
  choice: meremehkan
  rationale: Menyampaikan sikap memandang rendah dan tidak mengindahkan kekuasaan.
- source_word: Τολμηταί
  choice: lancang
  rationale: Dalam konteks negatif, kata ini menunjukkan keberanian yang nekat dan tidak tahu batas.
- source_word: αὐθάδεις
  choice: keras kepala
  rationale: Menggambarkan orang yang menuruti kehendaknya sendiri dan tidak mau tunduk; lebih mudah dipahami pembaca modern daripada bentuk harfiah 'berkehendak sendiri'.
- source_word: δόξας
  choice: makhluk-makhluk mulia
  rationale: Bentuk jamak ini kemungkinan menunjuk kepada makhluk surgawi yang memiliki kemuliaan, tetapi identitasnya tidak dipersempit menjadi malaikat.
- source_word: οὐ τρέμουσιν, βλασφημοῦντες
  choice: mereka tidak gentar ketika menghujat
  rationale: Mempertahankan gambaran kuat tentang tiadanya rasa takut dan hubungan serentak participium βλασφημοῦντες dengan verba utama.
theological_decisions:
- issue: Rujukan κυριότητος
  choice: kekuasaan, dengan rujukan dibiarkan terbuka
  alternative: ketuanan Tuhan atau pemerintahan makhluk surgawi
  rationale: Ayat ini tidak dengan tegas menentukan pemegang kekuasaan tersebut. Terjemahan utama tidak memasukkan penafsiran kristologis atau angelologis tertentu.
- issue: Rujukan δόξας
  choice: makhluk-makhluk mulia yang tidak disebutkan identitasnya
  alternative: malaikat atau kemuliaan/kedudukan mulia
  rationale: Konteks ayat berikutnya mendukung rujukan kepada makhluk surgawi, tetapi δόξας sendiri lebih luas. Frasa utama menjaga ambiguitas itu.
- issue: Hubungan ἐπιθυμίᾳ dengan μιασμοῦ
  choice: hawa nafsu yang menajiskan
  alternative: hawa nafsu akan kenajisan
  rationale: Konstruksi genitif memungkinkan nuansa karakteristik atau akibat maupun objektif. Teks utama memilih ungkapan Indonesia yang alami, sedangkan alternatif yang lebih formal dicatat.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada tegas dan bermartabat. Struktur tuduhan yang singkat dipertahankan melalui kalimat kedua. Istilah 'daging', 'kekuasaan', dan 'makhluk-makhluk mulia' dipilih untuk menjaga tekstur serta ambiguitas sumber tanpa terdengar kuno.
