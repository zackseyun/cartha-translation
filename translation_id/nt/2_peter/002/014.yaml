  text: ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος καὶ ⸀ἀκαταπαύστους ἁμαρτίας, δελεάζοντες ψυχὰς ἀστηρίκτους, καρδίαν γεγυμνασμένην πλεονεξίας ἔχοντες, κατάρας τέκνα,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/014.yaml
  text: having eyes full of an adulteress and insatiable for sin, enticing unstable souls, having a heart trained in greed, children of a curse,
translation:
  language: id
  text: Mata mereka penuh dengan seorang perempuan pezina[a] dan tidak pernah berhenti berbuat dosa[b]. Mereka memikat orang-orang yang tidak teguh. Hati mereka telah terlatih dalam keserakahan. Mereka adalah orang-orang terkutuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “penuh dengan seorang perempuan pezina”; ungkapan ini dapat dipahami sebagai “penuh dengan perzinaan” atau “penuh dengan hasrat berzina.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak henti-hentinya berbuat dosa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεστοὺς μοιχαλίδος
  choice: penuh dengan perempuan pezina
  rationale: Mempertahankan gambaran konkret genitif tunggal Yunani, tetapi memakai susunan Indonesia yang alami. Ungkapan ini menggambarkan mata yang dikuasai oleh pandangan atau hasrat berzina; alternatif interpretatif dicatat dalam catatan kaki.
- source_word: ἀκαταπαύστους ἁμαρτίας
  choice: tidak pernah berhenti berbuat dosa
  rationale: Menyampaikan makna tidak berhenti dari dosa secara jelas dan idiomatis, tanpa menggesernya menjadi gagasan ketidakpuasan atau nafsu yang tidak terpuaskan.
- source_word: δελεάζοντες
  choice: memikat
  rationale: Menyampaikan tindakan membujuk atau memancing korban dengan nuansa menyesatkan, dalam bahasa Indonesia modern yang wajar.
- source_word: ψυχὰς ἀστηρίκτους
  choice: orang-orang yang tidak teguh
  rationale: ψυχαί menunjuk kepada pribadi-pribadi, bukan semata-mata unsur rohani mereka. 'Orang-orang' lebih alami dalam bahasa Indonesia, sedangkan ἀστήρικτοι dipertahankan sebagai 'tidak teguh'.
- source_word: καρδίαν γεγυμνασμένην πλεονεξίας
  choice: Hati mereka telah terlatih dalam keserakahan
  rationale: Bentuk perfektif γεγυμνασμένην menyiratkan latihan yang telah membentuk keadaan sekarang. 'Keserakahan' jelas dan sesuai bagi πλεονεξία.
- source_word: κατάρας τέκνα
  choice: anak-anak kutuk
  rationale: 'Mempertahankan idiom genitif yang tajam dan padat: mereka dicirikan oleh dan berada di bawah kutuk, tanpa meratakannya sekadar menjadi kata sifat.'
- source_word: ἔχοντες ... ἔχοντες
  choice: Mata mereka ... Hati mereka ...
  rationale: Partisipium berulang diungkapkan melalui klausa-klausa Indonesia yang alami sambil mempertahankan penumpukan tuduhan dalam teks Yunani.
theological_decisions:
- issue: Apakah gambaran seksual μοιχαλίδος perlu diperhalus
  choice: Mempertahankan gambaran konkret 'perempuan pezina' dalam teks utama
  alternative: Menerjemahkan secara interpretatif sebagai 'perzinaan' atau 'hasrat berzina'
  rationale: Bentuk tunggal konkret dalam bahasa Yunani sengaja mencolok. Teks utama mempertahankannya, sementara kemungkinan makna idiomatis dijelaskan dalam catatan kaki.
- issue: Makna ἀκαταπαύστους ἁμαρτίας
  choice: tidak pernah berhenti berbuat dosa
  alternative: tidak pernah puas berbuat dosa
  rationale: Pilihan utama lebih dekat dengan gagasan leksikal 'tidak berhenti' dan tidak memasukkan konsep ketidakpuasan yang tidak dinyatakan secara langsung.
- issue: Daya ungkap κατάρας τέκνα
  choice: anak-anak kutuk
  alternative: orang-orang terkutuk atau anak-anak yang berada di bawah kutuk
  rationale: Ungkapan sumber dipertahankan agar hubungan mereka dengan kutuk tetap tajam sekaligus tidak menentukan secara berlebihan apakah genitif itu terutama menyatakan ciri atau nasib.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan tegas. Kalimat Yunani yang bertumpuk dibagi menjadi beberapa kalimat pendek agar mudah dipahami tanpa mengurangi kerasnya kecaman. Semua penanda catatan kaki muncul dalam teks utama.
