  naturalness: Teks revisi memakai bahasa Indonesia baku modern. "Karena keserakahan" menyatakan motif tindakan dengan jelas, dan "kata-kata yang dibuat-buat" lebih langsung serta idiomatis untuk πλαστοῖς λόγοις.
