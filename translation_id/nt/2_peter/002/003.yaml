  text: καὶ ἐν πλεονεξίᾳ πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ ⸀νυστάζει.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/003.yaml
  text: And in greed they will exploit you with fabricated words. Their judgment from long ago is not idle[a], and their destruction is not asleep.
translation:
  language: id
  text: Dan karena keserakahan, dengan kata-kata yang dibuat-buat mereka akan memanfaatkan kalian[a]. Hukuman bagi mereka sudah sejak dahulu tidak tinggal diam, dan kebinasaan mereka tidak tertidur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "mereka akan memperdagangkan kalian"; bahasa Yunani memakai metafora niaga tentang mengambil keuntungan dari orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: Karena serakah
  rationale: Datif ini menyatakan dorongan atau keadaan yang melandasi tindakan para guru palsu; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya moral πλεονεξία.
- source_word: πλαστοῖς λόγοις
  choice: dengan kata-kata yang mereka reka
  rationale: πλαστός menunjuk pada sesuatu yang dibentuk atau dibuat-buat. Frasa ini menyampaikan perkataan yang sengaja dikarang tanpa mempersempitnya menjadi cerita.
- source_word: ἐμπορεύσονται
  choice: mereka akan memanfaatkan kalian
  rationale: Kata kerja ini memakai metafora perdagangan, yakni memperlakukan orang sebagai sarana memperoleh keuntungan. 'Memanfaatkan' menyampaikan eksploitasi itu secara wajar dalam bahasa Indonesia.
- source_word: κρίμα
  choice: hukuman
  rationale: Dalam konteks ini κρίμα adalah keputusan pengadilan yang merugikan beserta akibat penghukumannya. 'Hukuman' lebih alami daripada 'penghakiman atas mereka' dan sesuai dengan ancaman dalam ayat ini.
- source_word: ἔκπαλαι
  choice: yang telah ditetapkan sejak dahulu
  rationale: ἔκπαλαι secara leksikal berarti sejak lama atau dahulu. Penambahan 'telah ditetapkan' menjelaskan hubungan temporal dengan hukuman tanpa menyatakan kapan atau melalui peristiwa apa penetapan itu terjadi.
- source_word: οὐκ ἀργεῖ
  choice: tidak tinggal diam
  rationale: ἀργέω berarti menganggur, tidak aktif, atau tidak bekerja. Ungkapan ini mempertahankan personifikasi dan tidak mereduksinya hanya menjadi gagasan penundaan.
- source_word: ἀπώλεια
  choice: kebinasaan
  rationale: ἀπώλεια menunjuk pada kebinasaan atau kehancuran. 'Kebinasaan' merupakan istilah Indonesia yang jelas dan bermartabat tanpa menentukan mekanisme atau durasi hukuman.
- source_word: οὐ νυστάζει
  choice: tidak tertidur
  rationale: νυστάζω berarti mengantuk atau terkantuk. Terjemahan ini mempertahankan personifikasi yang hidup bahwa kebinasaan mereka tidak sedang lengah atau tidak aktif.
theological_decisions:
- issue: Sifat hukuman yang diumumkan
  choice: Menerjemahkan sebagai hukuman dan kebinasaan yang pasti menimpa para guru palsu tanpa menjelaskan mekanisme atau lamanya.
  alternative: Menafsirkan 'kebinasaan' secara khusus sebagai pelenyapan, atau hanya sebagai keruntuhan sementara tanpa penghakiman terakhir.
  rationale: Ayat ini menegaskan kepastian hukuman, tetapi tidak menerangkan mekanisme maupun durasinya; terjemahan tidak boleh memasukkan kesimpulan doktrinal yang melampaui teks.
- issue: Waktu hukuman
  choice: Memahami ἔκπαλαι sebagai keterangan bahwa hukuman itu telah berlaku atau ditetapkan sejak dahulu, sementara pelaksanaannya tetap aktif dan pasti.
  alternative: Memahami frasa itu semata-mata sebagai hukuman yang dijatuhkan kepada mereka pada masa lampau.
  rationale: Bentuk kini οὐκ ἀργεῖ dan paralelnya οὐ νυστάζει menggambarkan hukuman serta kebinasaan yang tidak pasif; teks tidak menyatakan bahwa penghukuman itu sudah selesai dilaksanakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada peringatan yang bermartabat. 'Kalian' dipakai untuk ὑμᾶς yang jamak agar jumlahnya tampak jelas. Metafora komersial diterjemahkan secara idiomatis sebagai 'memanfaatkan', sedangkan dua personifikasi terakhir dipertahankan.
