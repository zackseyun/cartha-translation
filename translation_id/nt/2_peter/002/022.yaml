base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/022.yaml
  text: 'What the true proverb says has happened to them: “A dog returns to its own vomit,” and[b][a], “A washed sow returns to wallowing in the mud.”'
translation:
  language: id
  text: 'Apa yang dikatakan oleh peribahasa yang benar telah terjadi pada mereka: “Anjing kembali ke muntahnya sendiri,”[a] dan, “Babi betina yang sudah dimandikan kembali berkubang dalam lumpur.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Seekor anjing, setelah kembali ke muntahnya sendiri ... dan seekor babi betina yang sudah dimandikan, untuk berkubang dalam lumpur.” Bagian pertama menggemakan Amsal 26:11.'
    reason: literal_rendering_and_cross_reference
lexical_decisions:
- source_word: συμβέβηκεν αὐτοῖς
  choice: telah terjadi pada mereka
  rationale: Bentuk perfek menyatakan kejadian yang akibatnya masih berlaku; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan konstruksi datif.
- source_word: τὸ τῆς ἀληθοῦς παροιμίας
  choice: apa yang dikatakan peribahasa yang benar ini
  rationale: Konstruksi Yunani bersifat eliptis. Terjemahan ini menjelaskan bahwa isi peribahasa itu terbukti dalam keadaan mereka tanpa menambahkan tafsiran doktrinal.
- source_word: Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα
  choice: Anjing kembali ke muntahnya sendiri
  rationale: Rumusan peribahasa yang ringkas dan alami ini mempertahankan makna kembali, kepunyaan sendiri, dan muntah, serta menggemakan Amsal 26:11.
- source_word: Ὗς λουσαμένη
  choice: Babi betina yang sudah dimandikan
  rationale: Babi betina mempertahankan nuansa feminin Ὗς, sedangkan sudah dimandikan menyampaikan keadaan sesudah pembasuhan tanpa memaksakan apakah tindakannya refleksif atau pasif.
- source_word: εἰς κυλισμὸν βορβόρου
  choice: kembali berkubang dalam lumpur
  rationale: Berkubang dalam lumpur merupakan ungkapan Indonesia yang hidup dan tepat bagi tindakan berguling-guling dalam lumpur; kata kembali dilengkapi dari kesejajaran dan maksud peribahasa.
theological_decisions:
- issue: Konstruksi eliptis dan daya penerapan peribahasa
  choice: Isi peribahasa itu dikatakan telah terjadi pada mereka.
  alternative: Perkataan peribahasa yang benar itu telah terjadi pada mereka.
  rationale: Pilihan utama alami dalam bahasa Indonesia dan menyatakan bahwa peribahasa itu terbukti pada mereka, tanpa menguraikan doktrin mengenai kemurtadan yang tidak dinyatakan secara eksplisit dalam ayat.
- issue: Bentuk λουσαμένη
  choice: yang sudah dimandikan
  alternative: yang sudah mandi / yang sudah membasuh dirinya
  rationale: Bentuk Yunani dapat dipahami secara medial atau pasif. Pilihan ini sesuai dengan citra seekor babi yang berada dalam keadaan bersih, tetapi tidak menjadikan perbedaan tersebut dasar bagi kesimpulan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Berkubang” dipilih karena jelas serta mempertahankan kekuatan gambaran peribahasa. Penanda catatan kaki ditempatkan setelah kutipan pertama yang menggemakan Amsal 26:11.
