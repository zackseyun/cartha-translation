  terminology: “Peribahasa,” “muntahnya sendiri,” “babi betina,” dan “berkubang dalam lumpur” adalah pilihan yang tepat. “Babi betina” secara wajar mempertahankan gender feminin ὗς. Catatan kaki perlu diperbaiki karena “ke kubangan lumpur” menambahkan gagasan lokasi/kubangan yang tidak eksplisit dalam κυλισμὸν βορβόρου, yang secara harfiah menunjuk pada tindakan berkubang/berguling dalam lumpur.
