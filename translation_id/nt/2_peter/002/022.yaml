  source_fidelity: Terjemahan ini pada dasarnya setia kepada teks Yunani. “Telah terjadi pada mereka” menyampaikan perfektum συμβέβηκεν dengan baik, dan kedua gambaran peribahasa dipertahankan tanpa menambahkan kesimpulan doktrinal. Namun, demonstratif “ini” tidak terdapat dalam τῆς ἀληθοῦς παροιμίας dan sebaiknya dihilangkan.
