  text: οὗτοι δέ, ὡς ἄλογα ζῷα ⸂γεγεννημένα φυσικὰ⸃ εἰς ἅλωσιν καὶ φθοράν, ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες, ἐν τῇ φθορᾷ αὐτῶν ⸂καὶ φθαρήσονται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/012.yaml
  text: But these[a], like irrational animals—creatures of instinct, born for capture and destruction—blaspheming about things they do not understand, will also be destroyed in their destruction[d][c][b],
translation:
  language: id
  text: Namun mereka ini, seperti binatang yang tidak berakal—makhluk yang hidup menurut naluri, dilahirkan untuk ditangkap dan dibinasakan[a]—menghujat perkara-perkara yang tidak mereka pahami[b]. Dalam kebinasaan mereka sendiri, mereka pun akan dibinasakan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “binatang yang tidak berakal, yang secara alami dilahirkan untuk ditangkap dan dibinasakan.” Ungkapan Yunani menggambarkan makhluk yang dikuasai kodrat atau naluri.
    reason: lexical_alternative
  - marker: b
    text: Kata “menghujat” juga dapat diterjemahkan “mencaci” atau “memfitnah”; objeknya tidak disebutkan secara tegas di sini.
    reason: lexical_alternative
  - marker: c
    text: 'Bahasa Yunani mengulang kata-kata seakar yang dapat berarti “kebinasaan,” “kehancuran,” atau “kerusakan”: secara harfiah, “dalam kebinasaan mereka, mereka pun akan dibinasakan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογα ζῷα
  choice: binatang yang tidak berakal
  rationale: Ungkapan ini menunjuk kepada binatang yang tidak memiliki daya nalar; pilihan ini alami dalam bahasa Indonesia dan mempertahankan kontras moral dalam konteks.
- source_word: γεγεννημένα φυσικὰ
  choice: makhluk yang hidup menurut naluri, dilahirkan
  rationale: Gabungan partisip dan adjektiva Yunani sangat padat. Frasa Indonesia ini mempertahankan gambaran kelahiran dari γεγεννημένα serta gagasan bahwa makhluk tersebut dikuasai kodrat atau naluri dari φυσικά.
- source_word: εἰς ἅλωσιν καὶ φθοράν
  choice: untuk ditangkap dan dibinasakan
  rationale: εἰς menyatakan tujuan atau hasil, sedangkan ἅλωσις berarti penangkapan dan φθορά dalam gambaran ini berarti kebinasaan atau penghancuran.
- source_word: ἐν οἷς ἀγνοοῦσιν
  choice: perkara-perkara yang tidak mereka pahami
  rationale: Pronomina relatif netral jamak paling wajar menunjuk kepada hal atau perkara. 'Tidak mereka pahami' menyampaikan ketidaktahuan yang melandasi ucapan mereka.
- source_word: βλασφημοῦντες
  choice: menghujat
  rationale: Kata ini dapat berarti mencaci, memfitnah, atau menghujat. 'Menghujat' mempertahankan daya kecam yang kuat tanpa menentukan objek yang tidak dinyatakan dalam ayat.
- source_word: ἐν τῇ φθορᾷ αὐτῶν
  choice: dalam kebinasaan mereka sendiri
  rationale: Pilihan ini mempertahankan struktur Yunani dan kaitan leksikal dengan verba berikutnya. 'Sendiri' memperjelas pronomina refleksif secara alami tanpa menentukan lebih jauh sifat kebinasaan itu.
- source_word: καὶ φθαρήσονται
  choice: mereka pun akan dibinasakan
  rationale: Bentuk pasif futur paling wajar menyatakan bahwa mereka akan mengalami kebinasaan. 'Pun' mewakili καί dan menghubungkan nasib mereka dengan gambaran sebelumnya.
theological_decisions:
- issue: Makna βλασφημοῦντες dalam konteks
  choice: menghujat
  alternative: mencaci atau memfitnah
  rationale: Istilah yang lebih kuat dipertahankan agar bobot kecaman teks tidak dilemahkan, tetapi objek hujatan tidak ditentukan melampaui bahasa Yunani.
- issue: Makna φθορά dan φθαρήσονται
  choice: 'bahasa kebinasaan: ''kebinasaan'' dan ''dibinasakan'''
  alternative: kerusakan, kebobrokan, atau kehancuran
  rationale: Gambaran binatang yang ditangkap mendukung arti kebinasaan, sementara pengulangan akar kata mempertahankan gema retoris teks tanpa memperinci bentuk penghukuman.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. Struktur tanda pisah mempertahankan perbandingan yang padat, sedangkan kalimat kedua menjaga pengulangan retoris sumber tanpa menjadi terlalu janggal.
