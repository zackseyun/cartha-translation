id: 2PE.2.6
reference: 2 Peter 2:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας ⸀καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ⸀ἀσεβέσιν τεθεικώς,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/006.yaml
  text: and if by reducing the cities of Sodom and Gomorrah to ashes he condemned them to destruction[a], having made them an example for those who would be ungodly[b],
translation:
  language: id
  text: dan jika Ia, dengan menghanguskan kota-kota Sodom dan Gomora hingga menjadi abu[a], menghukum kota-kota itu untuk dibinasakan, serta menjadikan kota-kota itu contoh bagi orang-orang yang kelak hidup fasik[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjadikan kota-kota Sodom dan Gomora abu.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “menjadikan kota-kota itu contoh bagi orang-orang fasik pada masa mendatang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεφρώσας
  choice: dengan menjadikan ... abu
  rationale: Partisip aoristus ini menyatakan bahwa kota-kota tersebut dijadikan abu; bentuk ini mempertahankan hasil tindakan dan secara wajar dapat menyatakan sarana penghukuman.
- source_word: καταστροφῇ
  choice: kepada kebinasaan
  rationale: Datif ini dipahami sebagai hasil atau isi hukuman yang dinyatakan oleh κατέκρινεν, tanpa mereduksinya menjadi sekadar tindakan pembakaran.
- source_word: κατέκρινεν
  choice: menghukum
  rationale: Kata kerja ini memiliki nuansa yudisial, yakni menjatuhkan hukuman atau menyatakan bersalah; 'menghukum ... kepada kebinasaan' mempertahankan hubungan dengan καταστροφῇ.
- source_word: ὑπόδειγμα
  choice: contoh
  rationale: Istilah ini berarti contoh atau pola; dalam konteks penghakiman, daya peringatannya tersirat dari konteks.
- source_word: μελλόντων ἀσεβέσιν
  choice: bagi orang-orang yang kelak hidup fasik
  rationale: μέλλω memberi orientasi masa depan, sedangkan ἀσεβέσιν menunjuk orang-orang fasik. Penambahan 'hidup' menghasilkan bahasa Indonesia yang alami tanpa menentukan bentuk kefasikan secara lebih sempit.
- source_word: τεθεικώς
  choice: menjadikannya
  rationale: Partisip perfek τίθημι menekankan tindakan menetapkan atau menjadikan kota-kota itu sebagai contoh dengan keadaan hasil yang berlanjut.
- source_word: πόλεις Σοδόμων καὶ Γομόρρας
  choice: kota-kota Sodom dan Gomora
  rationale: Bentuk jamak 'kota-kota' dipertahankan, dan nama tempat ditransliterasikan menurut bentuk Indonesia yang lazim.
theological_decisions:
- issue: Subjek tersirat dari konteks sebelumnya
  choice: Ia
  alternative: Allah; Tuhan
  rationale: Bahasa Yunani meneruskan subjek yang dipahami dari konteks. Pronomina 'Ia' mempertahankan kesinambungan itu tanpa memasukkan gelar ilahi yang tidak dinyatakan dalam klausa ini.
- issue: Daya makna ἀσεβέσιν
  choice: orang-orang yang kelak hidup fasik
  alternative: orang-orang fasik pada masa mendatang; mereka yang kelak tidak saleh
  rationale: Pilihan ini mempertahankan rujukan personal, orientasi masa depan, dan dimensi moral-religius kata tersebut tanpa menambahkan perilaku tertentu.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Klausa tetap diawali 'dan jika' karena ayat ini merupakan bagian dari rangkaian kondisi dalam konteks. Kapitalisasi 'Ia' menandai rujukan kepada Allah tanpa mengganti subjek tersirat dengan gelar eksplisit.
