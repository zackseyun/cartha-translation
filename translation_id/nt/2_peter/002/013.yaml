translation:
  language: id
  text: Mereka menerima ganjaran atas kejahatan mereka[a]. Mereka menganggap berfoya-foya pada siang hari sebagai kenikmatan. Mereka adalah noda dan cela, bersenang-senang dalam tipu daya mereka sambil berpesta bersama kalian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “balasan dari perbuatan salah.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sejumlah naskah membaca “perjamuan kasih mereka” sebagai ganti “tipu daya mereka”: “mereka bersenang-senang dalam perjamuan kasih mereka sambil berpesta bersama kalian.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἀδικούμενοι
  choice: menerima
  rationale: Dalam konteks ini bentuk partisip tersebut menyatakan bahwa mereka mengalami pembalasan atas kejahatan mereka. ‘Menerima’ mengungkapkan akibat yang datang kepada mereka tanpa menyiratkan bahwa pihak lain sekadar memperlakukan mereka secara tidak adil.
- source_word: μισθὸν ἀδικίας
  choice: upah atas kejahatan mereka
  rationale: μισθός berarti ‘upah’ atau ‘balasan’, sedangkan ἀδικία menunjuk pada kejahatan atau perbuatan salah. Frasa ini mempertahankan gambaran upah sekaligus menjelaskan bahwa kejahatan merekalah yang mendatangkan upah tersebut.
- source_word: ἡδονὴν ἡγούμενοι
  choice: menganggap ... sebagai kenikmatan
  rationale: ἡγέομαι dengan pelengkap predikatif berarti ‘menganggap’, dan ἡδονή berarti ‘kenikmatan’ atau ‘kesenangan’. Susunan ini dekat dengan sumber dan wajar dalam bahasa Indonesia.
- source_word: τὴν ἐν ἡμέρᾳ τρυφήν
  choice: hidup berfoya-foya pada siang hari
  rationale: τρυφή menggambarkan kemewahan dan pemuasan diri yang berlebihan, sedangkan ἐν ἡμέρᾳ menekankan bahwa hal itu dilakukan terang-terangan pada siang hari. ‘Hidup berfoya-foya’ menyampaikan perilaku tersebut secara jelas bagi pembaca modern.
- source_word: σπίλοι καὶ μῶμοι
  choice: noda dan cela
  rationale: Kedua kata ini menggambarkan kecemaran dan cacat moral. Pasangan ‘noda dan cela’ mempertahankan citra ganda secara ringkas dan bermartabat.
- source_word: ἐντρυφῶντες
  choice: berpuas-puas
  rationale: Partisip ini meneruskan tema pemanjaan diri dan kesenangan berlebihan. ‘Berpuas-puas’ terdengar alami dengan frasa ‘dalam tipu daya mereka’ dan tetap membawa nada kecaman.
- source_word: ἀπάταις αὐτῶν
  choice: tipu daya mereka
  rationale: Teks SBLGNT membaca ἀπάταις, yakni ‘tipu daya’ atau ‘penipuan’. Pilihan ini sesuai dengan konteks para pengajar palsu dan tidak mencampurkannya dengan varian ἀγάπαις.
- source_word: συνευωχούμενοι ὑμῖν
  choice: sambil berpesta bersama kalian
  rationale: Kata kerja ini berarti ikut berpesta atau makan bersama. ‘Sambil’ mempertahankan hubungan serentak dari bentuk partisip, sedangkan ‘bersama kalian’ mempertahankan latar sosial tanpa menentukan jenis jamuannya.
theological_decisions:
- issue: Varian teks ἀπάταις / ἀγάπαις
  choice: ἀπάταις diterjemahkan ‘tipu daya mereka’ dalam teks utama
  alternative: 'ἀγάπαις: ‘perjamuan kasih mereka’'
  rationale: SBLGNT yang disediakan membaca ἀπάταις, dan bacaan ini selaras dengan konteks penipuan oleh para pengajar palsu. Karena ἀγάπαις merupakan varian bermakna yang mengubah gambaran ayat, alternatif itu dipertahankan dalam catatan kaki.
- issue: Hubungan μισθὸν dengan ἀδικίας
  choice: ‘upah atas kejahatan mereka’
  alternative: ‘balasan dari perbuatan salah’
  rationale: Terjemahan utama mempertahankan metafora ‘upah’ tanpa menentukan secara berlebihan apakah genitif tersebut terutama bersifat sumber, sifat, atau akibat. Catatan memberikan padanan yang lebih eksplisit sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. Kata ‘kalian’ dipakai untuk bentuk jamak ὑμῖν. Susunan dipecah menjadi beberapa kalimat agar jelas bagi pembaca umum, sementara rangkaian gambaran moral dan hubungan antartindakan tetap dipertahankan.
