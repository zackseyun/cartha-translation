  text: οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/009.yaml
  text: then the Lord knows how to rescue the godly from trial[a], and to keep the unrighteous under punishment until the day of judgment[b],
translation:
  language: id
  text: maka Tuhan tahu bagaimana menyelamatkan orang-orang saleh dari pencobaan[a] dan menahan orang-orang yang tidak benar tetap dihukum sampai hari penghakiman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “pencobaan” dapat berarti ujian atau kesulitan, dan juga godaan. Dalam konteks ini, penyelamatan dari ujian atau kesulitan lebih menonjol.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dan menahan orang-orang yang tidak benar untuk dihukum pada hari penghakiman.” Partisipel Yunani dapat dipahami sebagai hukuman yang sedang berlangsung atau sebagai hukuman yang berkaitan dengan hari penghakiman yang akan datang.
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδεν
  choice: tahu bagaimana
  rationale: 'Dengan konstruksi infinitif, οἶδεν menyatakan pengetahuan atau kemampuan praktis: Tuhan tahu bagaimana melakukan kedua tindakan berikutnya.'
- source_word: κύριος
  choice: Tuhan
  rationale: Padanan baku dan wajar bagi κύριος dalam konteks ilahi.
- source_word: εὐσεβεῖς
  choice: orang-orang saleh
  rationale: Adjektiva substantival ini menunjuk kepada orang yang hidup dengan kesalehan atau bakti kepada Allah; ungkapan ini alami dalam bahasa Indonesia.
- source_word: ἐκ πειρασμοῦ
  choice: dari pencobaan
  rationale: Pencobaan dapat mencakup ujian, kesukaran, atau godaan. Konteks terutama menunjuk pada keadaan berat yang menguji, dan ambiguitas leksikal dipertahankan melalui catatan kaki.
- source_word: ῥύεσθαι
  choice: menyelamatkan
  rationale: ῥύομαι menyatakan tindakan melepaskan atau menyelamatkan dari bahaya; pilihan ini jelas dan alami.
- source_word: ἀδίκους
  choice: orang-orang tidak benar
  rationale: Padanan ini mempertahankan daya moral dan yudisial ἄδικος tanpa mempersempitnya hanya menjadi pelaku kejahatan tertentu.
- source_word: εἰς ἡμέραν κρίσεως
  choice: sampai pada hari penghakiman
  rationale: Dalam hubungan dengan τηρεῖν, frasa ini secara alami dapat menyatakan batas waktu yang mengarah kepada hari penghakiman.
- source_word: κολαζομένους
  choice: dalam hukuman
  rationale: Partisipel kini dipertahankan sebagai keadaan hukuman yang menyertai penahanan, tanpa menghapus kemungkinan sintaksis bahwa hukuman terkait dengan hari penghakiman.
- source_word: τηρεῖν
  choice: menahan
  rationale: Dalam konteks orang tidak benar dan penghakiman, 'menahan' menyampaikan gagasan menjaga atau menahan mereka sampai waktu yang ditentukan.
theological_decisions:
- issue: Makna πειρασμός dalam konteks
  choice: pencobaan, terutama dalam arti ujian atau kesukaran
  alternative: godaan untuk berbuat dosa
  rationale: Konteks Nuh dan Lot menekankan penyelamatan dari keadaan berat dan penghukuman di sekitar mereka. Namun, karena πειρασμός juga dapat berarti godaan, kemungkinan itu tidak dihilangkan dan dicatat dalam catatan kaki.
- issue: Daya κολαζομένους
  choice: orang tidak benar ditahan dalam keadaan hukuman sampai hari penghakiman
  alternative: orang tidak benar ditahan untuk dihukum pada hari penghakiman
  rationale: Partisipel kini paling langsung menggambarkan hukuman yang sedang menyertai keadaan mereka, tetapi susunan Yunani memungkinkan hubungan hukuman dengan hari penghakiman; ketegangan ini dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel Yunani dipertahankan, dengan ungkapan yang tetap mudah dipahami pembaca umum.
