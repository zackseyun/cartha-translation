base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/008.yaml
  text: for by what he saw and heard[a], that righteous man, living among them[c][b], was tormenting his righteous soul day after day with their lawless deeds—
translation:
  language: id
  text: Sebab, oleh apa yang ia lihat dan dengar, orang benar itu, yang tinggal di tengah-tengah mereka, hari demi hari menyiksa jiwanya yang benar dengan perbuatan mereka yang melanggar hukum—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dengan pengelompokan yang berbeda: “Sebab, orang benar itu, yang tinggal di tengah-tengah mereka, hari demi hari menyiksa jiwanya yang benar karena perbuatan mereka yang melanggar hukum yang ia lihat dan dengar.” Susunan Yunani memungkinkan hubungan yang berbeda antara “melihat dan mendengar” dan “perbuatan yang melanggar hukum.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέμματι καὶ ἀκοῇ
  choice: oleh apa yang dilihat dan didengarnya
  rationale: Kedua bentuk datif ini menunjuk pada penglihatan dan pendengaran sebagai sarana atau sebab penderitaan Lot. Ungkapan ini alami dalam bahasa Indonesia sekaligus mempertahankan posisinya yang menonjol pada awal klausa Yunani.
- source_word: ὁ δίκαιος
  choice: orang benar itu
  rationale: Adjektiva dengan artikel berfungsi sebagai nomina dan merujuk kembali kepada Lot. Kata “itu” memperjelas rujukan tersebut.
- source_word: ἐγκατοικῶν ἐν αὐτοῖς
  choice: yang tinggal di tengah-tengah mereka
  rationale: Partisip ini menggambarkan keadaan Lot yang menetap di lingkungan mereka. Bentuk klausa relatif lebih alami dalam bahasa Indonesia daripada partisip harfiah.
- source_word: ἡμέραν ἐξ ἡμέρας
  choice: hari demi hari
  rationale: Ungkapan idiomatis ini menyatakan tindakan yang berlangsung berulang-ulang dan terus-menerus.
- source_word: ψυχὴν δικαίαν
  choice: jiwanya yang benar
  rationale: ψυχή di sini menunjuk pada kehidupan batin atau diri Lot. “Jiwa” mempertahankan padanan langsung tanpa menetapkan suatu teori antropologi tertentu, sedangkan “-nya” tersirat dari hubungan objek dengan subjek.
- source_word: ἀνόμοις ἔργοις
  choice: dengan perbuatan-perbuatan mereka yang melanggar hukum
  rationale: Datif ini menyatakan sarana atau sebab siksaan batin. Pilihan “melanggar hukum” mempertahankan nuansa moral-hukum ἄνομος; “mereka” dijelaskan oleh konteks.
- source_word: ἐβασάνιζεν
  choice: menyiksa
  rationale: Bentuk imperfek aktif menggambarkan tindakan yang terus berlangsung dan lebih kuat daripada sekadar merasa susah. Bentuk aktif dipertahankan, termasuk ketegangan ungkapan bahwa Lot menyiksa jiwanya sendiri.
theological_decisions:
- issue: Makna ψυχή dalam antropologi
  choice: “Jiwa” dipakai dalam arti non-spekulatif sebagai kehidupan batin atau diri Lot.
  alternative: “Diri” atau “batinnya”.
  rationale: Ayat ini menggambarkan penderitaan moral batiniah Lot, bukan mengajarkan secara teknis hubungan jiwa dan tubuh.
- issue: Hubungan sintaksis antara penglihatan-pendengaran, perbuatan durhaka, dan tindakan menyiksa
  choice: 'Urutan Yunani dipertahankan sejauh mungkin: apa yang dilihat dan didengar ditempatkan di awal, sedangkan perbuatan yang melanggar hukum ditempatkan setelah objek.'
  alternative: “Karena perbuatan-perbuatan melanggar hukum yang dilihat dan didengarnya, orang benar itu menyiksa batinnya sendiri hari demi hari.”
  rationale: Susunan Yunani memungkinkan beberapa pengaturan hubungan sarana atau sebab. Terjemahan utama tidak melebur kedua frasa sehingga ambiguitas dan tekanan retoris sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “benar” dipertahankan dari teks Yunani. Tanda pisah pada akhir ayat dipertahankan karena kalimat berlanjut dari konteks sebelumnya dan memiliki gaya parentetis.
