id: 2PE.2.18
reference: 2 Peter 2:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑπέρογκα γὰρ ματαιότητος φθεγγόμενοι δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις τοὺς ⸀ὀλίγως ⸀ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/018.yaml
  text: For[a], speaking inflated words of emptiness, they entice by fleshly desires and sensuality those who are barely escaping from those who live in error[d][c][b],
translation:
  language: id
  text: Sebab, dengan mengucapkan kata-kata muluk yang kosong[a], mereka memikat orang-orang yang nyaris lolos[c] dari mereka yang hidup dalam kesesatan dengan berbagai keinginan daging[b] dan hawa nafsu yang tak terkendali[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kata-kata pongah yang kosong.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “dengan berbagai keinginan dari daging.” Di sini “daging” dipakai secara metaforis dalam konteks moral.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “yang hampir melepaskan diri.” Sejumlah naskah memiliki bacaan yang berarti: “yang sungguh-sungguh telah lolos.”'
    reason: alternative_reading
  - marker: d
    text: 'Atau: “dengan berbagai keinginan daging, yaitu hawa nafsu yang tak terkendali.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ὑπέρογκα ματαιότητος
  choice: kata-kata muluk yang kosong
  rationale: ὑπέρογκα menunjuk pada ucapan yang berlebihan, pongah, atau membual, sedangkan ματαιότητος menyatakan kehampaan atau kesia-siaan isinya. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kontras antara kemegahan ucapan dan kekosongan isinya.
- source_word: φθεγγόμενοι
  choice: dengan mengucapkan
  rationale: Partisip ini menjelaskan cara mereka memikat. Bentuk 'dengan mengucapkan' menghubungkannya secara jelas dengan verba utama.
- source_word: δελεάζουσιν
  choice: mereka memikat
  rationale: Verba ini menggambarkan tindakan mengumpan atau memancing seseorang. 'Memikat' mempertahankan daya bujuk yang menyesatkan tanpa menjadi terlalu harfiah.
- source_word: ἐν ἐπιθυμίαις σαρκὸς
  choice: dengan berbagai keinginan daging
  rationale: ἐν dipahami sebagai sarana. 'Keinginan daging' mempertahankan metafora σάρξ dan tidak mempersempitnya menjadi kategori doktrinal seperti 'tabiat berdosa'. Bentuk jamak 'berbagai keinginan' mencerminkan ἐπιθυμίαις.
- source_word: ἀσελγείαις
  choice: hawa nafsu yang tak terkendali
  rationale: Kata ini menunjuk pada sikap atau perilaku sensual yang tidak mengenal kendali moral. Pilihan ini lebih mudah dipahami pembaca umum daripada 'kecabulan', sekaligus cukup luas untuk mempertahankan cakupan istilah Yunani.
- source_word: ὀλίγως ἀποφεύγοντας
  choice: yang baru mulai melepaskan diri
  rationale: Ungkapan ini menggambarkan orang-orang yang masih berada dalam proses awal dan genting untuk lolos. Terjemahan ini mempertahankan aspek kini dari partisip ἀποφεύγοντας tanpa menyiratkan bahwa pelepasan mereka sudah tuntas.
- source_word: τοὺς ἐν πλάνῃ ἀναστρεφομένους
  choice: mereka yang hidup dalam kesesatan
  rationale: ἀναστρεφομένους menunjuk pada cara hidup atau perilaku yang berlangsung, sedangkan πλάνη berarti kesesatan atau kekeliruan. Frasa Indonesia ini alami dan mempertahankan gagasan kehidupan yang dijalani dalam kesesatan.
theological_decisions:
- issue: Makna σάρξ dalam konteks moral
  choice: keinginan daging
  alternative: keinginan kedagingan; keinginan tabiat berdosa
  rationale: Terjemahan ini mempertahankan metafora sumber tanpa menjadikannya sekadar tubuh jasmani dan tanpa memasukkan konsep teologis yang lebih sistematis daripada teks.
- issue: Keadaan orang-orang yang dipikat
  choice: orang-orang yang baru mulai melepaskan diri
  alternative: orang-orang yang hampir lolos; orang-orang yang sungguh-sungguh telah lolos
  rationale: Bacaan yang diterjemahkan memakai partisip kini dan menggambarkan pelepasan yang masih berlangsung serta genting. Rumusan ini tidak memutuskan apakah pelepasan tersebut akhirnya berhasil atau apa status keselamatan mereka.
- issue: Hubungan ἀσελγείαις dengan ἐπιθυμίαις σαρκὸς
  choice: 'dua unsur sarana yang terkait erat: ''dengan berbagai keinginan daging dan hawa nafsu yang tak terkendali'''
  alternative: 'aposisi: ''dengan berbagai keinginan daging, yaitu hawa nafsu yang tak terkendali'''
  rationale: Bentuk datif memungkinkan ἀσελγείαις dibaca sebagai unsur sejajar atau sebagai penjelas. Teks utama mempertahankan keterkaitan keduanya tanpa menetapkan hubungan aposisional secara tegas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan kalimat yang tetap mudah dipahami. Susunan objek ditempatkan langsung sesudah 'memikat' agar alurnya alami, sedangkan frasa sarana diletakkan di akhir. Istilah teknis atau denominasi khusus dihindari.
