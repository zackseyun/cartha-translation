revisions:
- from: Sebab, dengan mengucapkan kata-kata muluk yang kosong[a], mereka memikat orang-orang yang baru mulai melepaskan diri[c] dari mereka yang hidup dalam kesesatan, dengan berbagai keinginan daging[b] dan hawa nafsu yang tak terkendali[d].
  to: Sebab, dengan mengucapkan kata-kata muluk yang kosong[a], mereka memikat orang-orang yang nyaris lolos[c] dari mereka yang hidup dalam kesesatan dengan berbagai keinginan daging[b] dan hawa nafsu yang tak terkendali[d].
  rationale: Revisi terbatas pada padanan ὀλίγως dan catatan terkait. “Yang nyaris lolos” mempertahankan gagasan bahwa orang-orang itu berada dalam keadaan genting dan belum tentu telah berhasil sepenuhnya, tanpa menambahkan gagasan bahwa mereka baru memulai proses tersebut. Frasa sarana dan istilah metaforis lainnya dipertahankan.
