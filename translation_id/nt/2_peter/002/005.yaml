source:
  edition: SBLGNT
  text: καὶ ἀρχαίου κόσμου οὐκ ἐφείσατο, ἀλλὰ ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν, κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/005.yaml
  text: and if he did not spare the ancient world[a], but preserved Noah, an eighth person, a herald of righteousness, when he brought a flood upon a world of the ungodly[c][b],
translation:
  language: id
  text: dan jika Ia tidak mengampuni dunia zaman dahulu, tetapi memelihara Nuh, orang kedelapan[a], seorang pemberita kebenaran[b], ketika Ia mendatangkan air bah atas dunia orang fasik,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani juga dapat dipahami sebagai “Nuh, salah seorang dari delapan orang” atau “Nuh yang kedelapan”; maksudnya mungkin bahwa Nuh dipelihara bersama tujuh orang lainnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “seorang pewarta kebenaran.” Kata Yunaninya menunjuk kepada orang yang menyampaikan pengumuman di muka umum. “Kebenaran” juga dapat diterjemahkan “keadilan” dalam konteks tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχαίου κόσμου
  choice: dunia zaman dahulu
  rationale: Ungkapan ini menunjuk kepada dunia pada masa lampau, khususnya dunia sebelum air bah. Pilihan ini lebih alami dalam bahasa Indonesia modern daripada 'dunia kuno' untuk konteks tersebut.
- source_word: οὐκ ἐφείσατο
  choice: tidak menyayangkan
  rationale: Dalam konteks penghukuman, φείδομαι berarti tidak membebaskan atau tidak menahan hukuman; 'tidak menyayangkan' mempertahankan bentuk ringkas dan daya yudisial ungkapan Yunani.
- source_word: ὄγδοον Νῶε
  choice: Nuh, orang kedelapan
  rationale: Terjemahan ini mempertahankan bentuk ordinal Yunani yang padat serta ambiguitasnya, sambil menyiratkan bahwa Nuh dipelihara bersama tujuh orang lain.
- source_word: δικαιοσύνης κήρυκα
  choice: seorang pemberita kebenaran
  rationale: κῆρυξ adalah orang yang mengumumkan sesuatu di muka umum. 'Pemberita' alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi jabatan keagamaan tertentu; δικαιοσύνη diterjemahkan 'kebenaran' dalam arti kelurusan moral.
- source_word: ἐφύλαξεν
  choice: memelihara
  rationale: Dalam konteks penyelamatan melalui penghukuman, kata ini berarti menjaga agar tetap selamat atau melindungi. 'Memelihara' mempertahankan nuansa penjagaan ilahi.
- source_word: κατακλυσμὸν
  choice: air bah
  rationale: κατακλυσμός menunjuk kepada banjir besar; 'air bah' merupakan ungkapan Indonesia yang jelas dan lazim untuk peristiwa Nuh.
- source_word: κόσμῳ ἀσεβῶν
  choice: dunia orang-orang fasik
  rationale: Genitif ἀσεβῶν menggambarkan dunia yang dihuni atau dicirikan oleh orang-orang yang tidak menghormati Allah. Bentuk ini mengikuti struktur Yunani tanpa mengubahnya menjadi sekadar sifat dunia.
- source_word: ἐπάξας
  choice: ketika Ia mendatangkan
  rationale: Partisip aoristus ini menyatakan tindakan yang berhubungan erat dengan pemeliharaan Nuh. Anak kalimat dengan 'ketika' alami dalam bahasa Indonesia dan tidak menetapkan hubungan kausal yang lebih kuat daripada teks.
theological_decisions:
- issue: Makna δικαιοσύνη
  choice: kebenaran
  alternative: keadilan
  rationale: Dalam konteks gambaran tentang Nuh sebagai pemberita, kata ini paling wajar menunjuk kepada kehidupan atau tatanan yang benar di hadapan Allah. 'Keadilan' tetap mungkin secara leksikal, tetapi dapat mempersempit makna menjadi keadilan yudisial.
- issue: Identitas subjek verba ilahi
  choice: Ia
  alternative: Allah
  rationale: Ayat Yunani melanjutkan subjek dari konteks sebelumnya tanpa menyebut nama Allah dalam klausa ini. Kata ganti mempertahankan kepaduan sintaksis dan tidak menambahkan nomina yang tidak terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan cukup formal. Susunan klausa dipertahankan karena ayat ini merupakan bagian dari kalimat bersyarat yang berlanjut dari konteks sekitarnya. Huruf kapital pada 'Ia' dipakai sebagai konvensi penghormatan untuk rujukan kepada Allah, bukan untuk menyelesaikan ambiguitas yang tidak ada dalam konteks.
