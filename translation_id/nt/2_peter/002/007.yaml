base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/007.yaml
  text: and he rescued righteous Lot[c][b][a], who was being tormented by the sensual conduct of the lawless—
translation:
  language: id
  text: dan Ia menyelamatkan Lot yang benar[a], yang terus tersiksa oleh perilaku bejat orang-orang yang tidak mengindahkan hukum—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Lot yang saleh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung ini meneruskan rangkaian dari ayat sebelumnya; 'dan' merupakan padanan Indonesia yang paling langsung.
- source_word: δίκαιον
  choice: yang benar
  rationale: Adjektiva ini secara eksplisit menilai status moral Lot. Ungkapan 'Lot yang benar' mempertahankan daya evaluatif teks dan terdengar wajar dalam bahasa Indonesia Alkitabiah modern.
- source_word: Λὼτ
  choice: Lot
  rationale: Mengikuti bentuk nama yang sudah baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: καταπονούμενον
  choice: yang terus tersiksa
  rationale: Partisipel pasif kini menunjukkan penderitaan berat yang berlangsung. Kata 'terus' memperjelas aspek berkelanjutan tanpa mengubah hubungan sintaksisnya.
- source_word: ὑπὸ τῆς ... ἀναστροφῆς
  choice: oleh perilaku ...
  rationale: Frasa ini menyatakan penyebab penderitaan Lot. Dalam konteks ini ἀναστροφή menunjuk pada perilaku atau cara hidup; 'perilaku' ringkas, alami, dan dekat dengan struktur Yunani.
- source_word: τῶν ἀθέσμων
  choice: orang-orang yang tidak mengenal hukum
  rationale: ἄθεσμος menggambarkan orang yang mengabaikan ketetapan atau batas moral yang semestinya. Ungkapan ini mempertahankan nuansa moral-legal dan lebih alami daripada nominalisasi 'orang-orang tanpa hukum'.
- source_word: ἐν ἀσελγείᾳ
  choice: bejat
  rationale: ἀσέλγεια menunjuk pada kebejatan atau pelampiasan hawa nafsu yang tak tahu malu. 'Bejat' dapat menerangkan 'perilaku' secara alami dan mempertahankan kecaman moral yang kuat.
- source_word: ἐρρύσατο
  choice: Ia menyelamatkan
  rationale: Bentuk aoris dari ῥύομαι berarti membebaskan atau menyelamatkan dari bahaya. 'Menyelamatkan' jelas dan alami; subjek 'Ia' mengikuti konteks ayat sebelumnya.
theological_decisions:
- issue: Penilaian moral terhadap Lot dalam kaitannya dengan kisah Kejadian
  choice: Mempertahankan sebutan eksplisit 'Lot yang benar' tanpa pelemahan atau kualifikasi.
  alternative: Menghindari atau melunakkan penilaian tersebut karena tindakan Lot dalam kisah Kejadian dapat menimbulkan kesulitan bagi pembaca.
  rationale: Teks Yunani secara terang menyebut Lot δίκαιος. Terjemahan perlu mempertahankan penilaian teologis teks itu sendiri tanpa menyelaraskannya secara diam-diam dengan kesulitan penafsiran dari kitab Kejadian.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada bermartabat dan mudah dipahami. Tanda pisah dipertahankan karena kalimat berlanjut ke ayat berikutnya. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
