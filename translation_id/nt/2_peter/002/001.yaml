id: 2PE.2.1
reference: 2 Peter 2:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/001.yaml
  text: But false prophets also arose among the people[a], just as there will also be false teachers among you, who will secretly bring in destructive heresies, even denying the Master who bought them[b], bringing swift destruction on themselves.
translation:
  language: id
  text: Namun, juga muncul nabi-nabi palsu di antara umat itu, sebagaimana di antara kamu pun akan ada guru-guru palsu. Mereka akan diam-diam memasukkan ajaran-ajaran sesat yang membawa kebinasaan[a], bahkan menyangkal Tuan yang membeli mereka[b], seraya mendatangkan kebinasaan yang segera atas diri mereka sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “golongan-golongan yang membawa kebinasaan.” Kata Yunani ini dapat berarti golongan atau sekte, tetapi dalam konteks ini kemungkinan besar menunjuk kepada ajaran atau gerakan yang membawa kepada kebinasaan.
    reason: lexical_alternative
  - marker: b
    text: Atau “Tuhan yang menebus mereka.” Secara harfiah, bahasa Yunani berbunyi “Tuan yang membeli mereka”; ungkapan ini mempertahankan metafora pembelian tanpa menyelesaikan perdebatan teologis yang lebih luas mengenai cakupannya.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένοντο
  choice: muncul
  rationale: Dalam konteks ini, bentuk aoris γίνομαι menyatakan tampil atau munculnya nabi-nabi palsu pada masa lampau; “muncul” alami dalam bahasa Indonesia dan tidak terlalu harfiah.
- source_word: ψευδοπροφῆται
  choice: nabi-nabi palsu
  rationale: Padanan langsung dan lazim yang mempertahankan kesejajaran dengan “guru-guru palsu”.
- source_word: ἐν τῷ λαῷ
  choice: di tengah umat itu
  rationale: “Umat” secara wajar menunjuk kepada umat perjanjian dalam latar Perjanjian Lama, sedangkan “itu” mempertahankan rujukan tertentu tanpa menambahkan nama Israel ke dalam teks.
- source_word: ὡς καὶ ἐν ὑμῖν ἔσονται
  choice: sebagaimana di tengah-tengah kamu pun akan ada
  rationale: Mempertahankan perbandingan antara pengalaman umat dahulu dan keadaan yang akan terjadi dalam komunitas para pembaca.
- source_word: ψευδοδιδάσκαλοι
  choice: guru-guru palsu
  rationale: Padanan transparan bagi kata majemuk Yunani dan sejajar dengan “nabi-nabi palsu”.
- source_word: παρεισάξουσιν
  choice: akan diam-diam memasukkan
  rationale: Kata kerja ini mengandung nuansa membawa masuk secara tersembunyi atau menyusupkan; susunan ini mempertahankan baik kala mendatang maupun unsur kerahasiaannya.
- source_word: αἱρέσεις ἀπωλείας
  choice: ajaran-ajaran sesat yang membawa kebinasaan
  rationale: Dalam konteks penyangkalan terhadap Sang Tuan, αἱρέσεις terutama menunjuk kepada ajaran atau paham menyimpang; frasa penjelas mempertahankan daya genitif ἀπωλείας sebagai akibat atau ciri yang membawa kepada kebinasaan.
- source_word: τὸν ... δεσπότην
  choice: Tuan
  rationale: “Tuan” mempertahankan gagasan otoritas dan kepemilikan pada δεσπότης serta tidak menyamakannya begitu saja dengan κύριος, yang lazim diterjemahkan “Tuhan”.
- source_word: ἀγοράσαντα αὐτοὺς
  choice: yang telah membeli mereka
  rationale: Terjemahan ini mempertahankan metafora pembelian dalam ἀγοράζω dan tidak menggantinya dengan penafsiran teologis yang lebih sempit seperti “menebus”.
- source_word: ἀρνούμενοι
  choice: menyangkal
  rationale: Padanan langsung yang mempertahankan bobot tindakan mereka terhadap Tuan; partisip ini disajikan sebagai tindakan yang menyertai masuknya ajaran sesat.
- source_word: ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν
  choice: mendatangkan kebinasaan yang segera atas diri mereka sendiri
  rationale: Mempertahankan unsur refleksif, akibat yang mereka datangkan sendiri, dan sifat kebinasaan yang akan datang dengan segera.
theological_decisions:
- issue: Makna αἱρέσεις dalam konteks ini
  choice: ajaran-ajaran sesat
  alternative: golongan-golongan atau sekte-sekte yang membawa kebinasaan
  rationale: Kata tersebut dapat menunjuk kepada kelompok atau golongan, tetapi hubungan dengan penyusupan diam-diam dan penyangkalan terhadap Tuan menonjolkan isi ajaran yang menyimpang. Catatan kaki mempertahankan kemungkinan makna sosial atau kelompok.
- issue: Daya ungkapan τὸν ἀγοράσαντα αὐτοὺς δεσπότην
  choice: Tuan yang telah membeli mereka
  alternative: Penguasa/Tuhan yang telah menebus mereka
  rationale: Teks menyatakan bahwa guru-guru palsu itu menyangkal Dia yang membeli mereka. Metafora pembelian dan ketegangan teologis mengenai cakupan atau hakikat pembelian tersebut dipertahankan tanpa diselesaikan dalam terjemahan.
- issue: Pembedaan δεσπότης dari κύριος
  choice: Tuan
  alternative: Penguasa atau Tuhan
  rationale: “Tuan” menyampaikan otoritas δεσπότης dan menjaga pembedaan leksikal dari κύριος. “Penguasa” mungkin menonjolkan kedaulatan, tetapi kurang mempertahankan hubungan tuan dengan pihak yang dibeli.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Umat itu” menjaga latar umat Allah dalam Perjanjian Lama tanpa memperjelas secara berlebihan. “Tuan” sengaja dipilih sebagai gelar berhuruf kapital untuk δεσπότης, sedangkan “membeli” mempertahankan metafora sumber. Ayat dibagi menjadi tiga kalimat agar mudah dipahami tanpa mengubah hubungan logisnya.
