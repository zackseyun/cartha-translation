    rationale: καί yang menghubungkan ἐπάγοντες tidak dengan sendirinya berarti “dengan demikian.” Partisip ἐπάγοντες menyatakan tindakan/akibat yang dilakukan oleh para guru palsu itu sendiri; “seraya” menyampaikan hubungan ini tanpa memperkerasnya menjadi kesimpulan penalaran.
  - severity: low
    issue: “telah membeli” lebih eksplisit secara aspektual daripada yang diperlukan.
    rationale: Partisip aoris ἀγοράσαντα menunjuk tindakan membeli, tetapi bahasa Indonesia tidak perlu menandainya dengan “telah.” Bentuk relatif sederhana “yang membeli” mempertahankan metafora sumber dan tetap alami.
