  source_fidelity: Secara umum setia pada teks Yunani. Namun, “Dengan demikian” memberi hubungan kesimpulan yang tidak dinyatakan secara eksplisit oleh καί; dua partisip terakhir lebih tepat diterjemahkan sebagai tindakan yang menyertai tindakan mereka. Bentuk “yang membeli mereka” juga lebih langsung mencerminkan partisip aoris ἀγοράσαντα daripada “yang telah membeli mereka,” tanpa perlu menambahkan penandaan waktu yang tidak ada dalam bahasa Indonesia.
  naturalness: Bahasanya pada umumnya modern dan jelas. “Seraya mendatangkan kebinasaan yang segera atas diri mereka sendiri” mengalir lebih baik dalam hubungan kalimat dan mempertahankan fungsi partisipial sumber. “Di antara umat itu” sedikit lebih idiomatis untuk konteks keanggotaan komunitas.
  terminology: “Nabi-nabi palsu,” “guru-guru palsu,” “Tuan,” “membeli,” dan “kebinasaan” merupakan pilihan yang baik. “Tuan” secara tepat menjaga perbedaan dari κύριος tanpa memasukkan penafsiran teologis tambahan. Catatan kaki mempertahankan alternatif leksikal dan metafora pembelian.
