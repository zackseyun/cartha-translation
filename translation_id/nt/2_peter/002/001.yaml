  to: Namun, juga muncul nabi-nabi palsu di antara umat itu, sebagaimana di antara kamu pun akan ada guru-guru palsu. Mereka akan diam-diam memasukkan ajaran-ajaran sesat yang membawa kebinasaan[a], bahkan menyangkal Tuan yang membeli mereka[b], seraya mendatangkan kebinasaan yang segera atas diri mereka sendiri.
