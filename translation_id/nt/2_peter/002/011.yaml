  text: ὅπου ἄγγελοι ἰσχύϊ καὶ δυνάμει μείζονες ὄντες οὐ φέρουσιν κατ’ ⸀αὐτῶν βλάσφημον κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/011.yaml
  text: whereas angels[a], though greater in might and power[b], do not bring a slanderous judgment against them.
translation:
  language: id
  text: Sedangkan para malaikat, meskipun kekuatan dan kuasa mereka lebih besar, tidak menjatuhkan penghakiman yang mencela terhadap mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “mereka” kemungkinan merujuk kepada sebutan “yang mulia” dalam ayat sebelumnya, tetapi Petrus tidak mengidentifikasi mereka dengan lebih jelas di sini. Ungkapan “penghakiman yang mencela” juga dapat diterjemahkan “penghakiman yang menghujat”, “penghakiman yang mencaci”, atau “penghakiman yang memfitnah”.
    reason: lexical_alternative_and_ambiguous_referent
lexical_decisions:
- source_word: ὅπου
  choice: sedangkan
  rationale: Dalam konteks ini, ὅπου menghubungkan ayat ini dengan ayat sebelumnya secara kontras, bukan terutama menyatakan tempat.
- source_word: ἄγγελοι
  choice: malaikat
  rationale: Konteks menunjuk kepada makhluk surgawi, bukan utusan manusia.
- source_word: ἰσχύϊ καὶ δυνάμει
  choice: dalam kekuatan dan kuasa
  rationale: Dua datif ini menyatakan segi yang membuat para malaikat lebih besar dan mempertahankan pasangan istilah Yunani yang saling menguatkan.
- source_word: μείζονες ὄντες
  choice: walaupun lebih besar
  rationale: 'Partisip ini paling wajar dipahami secara konsesif: sekalipun lebih besar, malaikat tidak melakukan hal tersebut.'
- source_word: οὐ φέρουσιν
  choice: tidak menjatuhkan
  rationale: Bersama κρίσιν, φέρω berarti mengajukan atau mengucapkan suatu penghakiman; 'menjatuhkan penghakiman' merupakan ungkapan yudisial yang alami dalam bahasa Indonesia.
- source_word: κατ’ αὐτῶν
  choice: terhadap mereka
  rationale: Kata ganti dibiarkan tanpa identifikasi tambahan agar rujukan anaforis bahasa Yunani tetap terbuka.
- source_word: βλάσφημον
  choice: yang menghina
  rationale: Dalam konteks ujaran terhadap pihak lain, kata ini menyatakan sifat mencaci, menghina, atau memfitnah; 'menghina' cukup luas dan alami tanpa membatasinya pada penghujatan terhadap Allah.
- source_word: κρίσιν
  choice: penghakiman
  rationale: Istilah ini menyatakan penilaian atau putusan yudisial; 'penghakiman' mempertahankan bobot forensiknya.
theological_decisions:
- issue: Rujukan αὐτῶν dalam kaitannya dengan 'makhluk-makhluk mulia' pada ayat sebelumnya
  choice: Mempertahankan kata ganti 'mereka' tanpa menjelaskan identitasnya dalam teks utama.
  alternative: Menentukannya sebagai malaikat yang jatuh, pejabat manusia, atau makhluk surgawi yang mulia secara umum.
  rationale: Bahasa Yunani tidak mengidentifikasi antesedennya secara lebih khusus. Terjemahan ini menjaga ambiguitas dan menghindari pemaksaan tafsiran doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Susunan kontras dipertahankan, pasangan 'kekuatan dan kuasa' diterjemahkan secara formal tetapi tetap alami, dan ketidakjelasan rujukan kata ganti tidak diselesaikan secara spekulatif.
