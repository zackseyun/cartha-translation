  text: Οὗτοί εἰσιν πηγαὶ ἄνυδροι ⸂καὶ ὁμίχλαι⸃ ὑπὸ λαίλαπος ἐλαυνόμεναι, οἷς ὁ ζόφος τοῦ ⸀σκότους τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/017.yaml
  text: These are waterless springs and mists driven by a storm[b][a], for whom the gloom of darkness has been kept.
translation:
  language: id
  text: Mereka adalah mata-mata air yang tidak berair dan kabut yang dihalau badai; bagi mereka telah disimpan kegelapan yang pekat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πηγαὶ ἄνυδροι
  choice: mata-mata air yang tidak berair
  rationale: πηγή menunjuk pada mata air, bukan sumur galian, sedangkan ἄνυδρος berarti tidak berair. Ungkapan ini mempertahankan ironi tentang sumber yang diharapkan memberi air tetapi ternyata tidak.
- source_word: ὁμίχλαι
  choice: kabut
  rationale: ὁμίχλη lebih tepat berarti kabut daripada awan. Dalam bahasa Indonesia, nomina 'kabut' lazim dipakai tanpa penanda jamak dan tetap sesuai dengan bentuk jamak Yunani dalam konteks ini.
- source_word: ὑπὸ λαίλαπος ἐλαυνόμεναι
  choice: yang dihalau badai
  rationale: λαῖλαψ adalah badai angin yang dahsyat, sedangkan ἐλαύνω menyatakan gerakan karena didorong atau dihalau. Bentuk pasif Yunani dipertahankan secara alami.
- source_word: οἷς
  choice: bagi mereka
  rationale: Pronomina relatif ini merujuk kepada para pengajar palsu yang dilukiskan dengan metafora sebelumnya, sehingga acuan personalnya dipertahankan.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: kelamnya kegelapan
  rationale: ζόφος menyatakan kekelaman pekat dan σκότος berarti kegelapan. Pilihan ini menjaga konstruksi dua unsur dan daya intensifnya tanpa menghapus citra asli.
- source_word: τετήρηται
  choice: telah tersedia
  rationale: Bentuk perfek pasif τηρέω menyatakan bahwa hukuman itu sudah disimpan atau disediakan dan tetap menanti mereka. 'Telah tersedia' terdengar wajar dalam bahasa Indonesia dan tetap tidak menyebut pelakunya.
theological_decisions:
- issue: Klausa terakhir sebagai bahasa penghakiman
  choice: 'Mempertahankan bentuk pasif tanpa menyebut pelaku ilahi: ''bagi mereka telah tersedia''.'
  alternative: Menambahkan 'telah disediakan Allah bagi mereka'.
  rationale: Teks Yunani menyiratkan penghakiman ilahi, tetapi tidak secara eksplisit menyebut Allah sebagai pelaku. Terjemahan tidak menambahkan hal yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Metafora sumber air yang gagal serta kabut yang tidak stabil dipertahankan. Urutan klausa mengikuti alur Yunani secara alami. Penanda catatan kaki [a] dicantumkan dalam teks utama.
