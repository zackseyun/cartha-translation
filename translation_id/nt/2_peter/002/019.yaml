  text: promising them freedom while they themselves are servants of corruption[a]; for whatever a person is overcome by[b], by this he is also enslaved.
translation:
  language: id
  text: Mereka menjanjikan kebebasan kepada orang-orang itu, padahal mereka sendiri adalah budak kerusakan[a]. Sebab, oleh apa pun seseorang telah dikalahkan, oleh itu pula ia telah diperbudak[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebinasaan” atau “kehancuran.” Kata Yunani ini dapat mencakup kerusakan atau kemerosotan, termasuk kerusakan moral dan akibatnya yang membinasakan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “Sebab, apa pun yang mengalahkan seseorang, kepada hal itulah orang itu juga telah diperbudak.”
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἐλευθερίαν
  choice: kemerdekaan
  rationale: Menyatakan keadaan bebas dan mempertahankan pertentangan tajam dengan perbudakan dalam klausa berikutnya; dalam konteks ini lebih wajar daripada “kebebasan” sebagai janji yang ditawarkan.
- source_word: ἐπαγγελλόμενοι
  choice: menjanjikan
  rationale: Mempertahankan makna partisip yang menunjuk pada tindakan memberikan janji, bukan sekadar menawarkan atau menyatakan.
- source_word: δοῦλοι
  choice: budak
  rationale: Status keterikatan dan kepemilikan sangat menonjol karena dikontraskan dengan kemerdekaan; “hamba” dapat terdengar lebih lunak dalam bahasa Indonesia modern.
- source_word: ὑπάρχοντες
  choice: padahal mereka sendiri adalah
  rationale: Mengungkapkan keadaan nyata yang berlangsung bersamaan dengan tindakan mereka serta menonjolkan ironi dan kontras dalam kalimat.
- source_word: φθορᾶς
  choice: kebinasaan
  rationale: Mencakup arah menuju kehancuran atau kebinasaan tanpa membatasi istilah hanya pada kebobrokan moral, meskipun nuansa kerusakan tetap dicatat.
- source_word: ᾧ γάρ τις ἥττηται
  choice: Sebab, oleh apa seseorang telah dikalahkan
  rationale: Mempertahankan konstruksi pasif, prinsip umum yang dinyatakan oleh τις, dan aspek perfektif yang menggambarkan kekalahan dengan keadaan yang masih berlaku.
- source_word: τούτῳ καὶ δεδούλωται
  choice: oleh itu pula ia telah diperbudak
  rationale: Mempertahankan kesejajaran datif dengan klausa sebelumnya, penegasan καί melalui “pula,” serta keadaan hasil yang terkandung dalam bentuk perfek pasif.
theological_decisions:
- issue: Pertentangan antara janji kemerdekaan dan keadaan sebagai δοῦλοι/δεδούλωται
  choice: Menggunakan “budak” dan “telah diperbudak.”
  alternative: Menggunakan “hamba” dan “berada dalam perhambaan.”
  rationale: Istilah yang lebih tegas mempertahankan ironi dan realitas penguasaan yang menjadi inti argumen tanpa menambahkan kerangka doktrinal tertentu.
- issue: Cakupan makna φθορά
  choice: Menggunakan “kebinasaan” dalam teks utama dan mencatat kemungkinan “kerusakan” dalam catatan kaki.
  alternative: Menggunakan “kerusakan,” “kebobrokan,” atau “kehancuran” dalam teks utama.
  rationale: Kata Yunani dapat menunjuk pada kerusakan, kebinasaan, atau kehancuran dan dapat memiliki nuansa moral maupun akibat yang menghancurkan. Pilihan utama tidak membatasi maknanya hanya pada moralitas.
- issue: Hubungan datif dalam τούτῳ καὶ δεδούλωται
  choice: Menerjemahkan “oleh itu pula ia telah diperbudak.”
  alternative: Menerjemahkan secara relasional, “kepada itulah ia juga telah diperbudak.”
  rationale: Datif dapat dipahami secara instrumental atau sebagai pihak yang menjadi tuan. Teks utama mengikuti kesejajaran dengan ᾧ, sedangkan catatan kaki mempertahankan kemungkinan relasional.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. “Orang-orang itu” memperjelas rujukan αὐτοῖς tanpa menambah identitas baru. Kata “ia” dipakai secara generik dan tidak menandai jenis kelamin dalam bahasa Indonesia. Susunan klausa terakhir sengaja agak formal agar bentuk pasif, kesejajaran datif, dan keadaan hasil dari bentuk perfek tetap tampak.
