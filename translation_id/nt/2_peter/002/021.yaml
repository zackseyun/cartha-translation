  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ⸀ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/021.yaml
  text: For it would have been better for them not to have known the way of righteousness than[a], after knowing it[c][b], to turn back from the holy commandment delivered to them.
translation:
  language: id
  text: Sebab, lebih baik bagi mereka jika mereka tidak mengenal jalan kebenaran daripada, setelah mengenalnya, berbalik dari perintah kudus yang telah disampaikan kepada mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρεῖττον γὰρ ἦν αὐτοῖς
  choice: Sebab, lebih baik bagi mereka jika
  rationale: Mengungkapkan hubungan penjelas γάρ dan perbandingan kontrafaktual lampau secara alami dalam bahasa Indonesia tanpa menghilangkan daya banding κρεῖττον.
- source_word: μὴ ἐπεγνωκέναι / ἐπιγνοῦσιν
  choice: tidak pernah mengenal / setelah mengenalnya
  rationale: Mempertahankan pengulangan verba ἐπιγινώσκω. 'Mengenal' lebih sesuai daripada sekadar 'mengetahui' untuk pengenalan terhadap suatu jalan hidup; 'sepenuhnya mengenal' akan melebihkan nuansa unsur ἐπι-.
- source_word: τὴν ὁδὸν τῆς δικαιοσύνης
  choice: jalan kebenaran
  rationale: '''Jalan'' mempertahankan metafora ὁδός sebagai cara atau arah hidup. Dalam konteks moral-religius ini, ''kebenaran'' merupakan padanan Indonesia yang wajar bagi δικαιοσύνη dan tidak membatasi maknanya pada keadilan sosial.'
- source_word: ὑποστρέψαι ἐκ
  choice: berbalik dari
  rationale: Menyatakan gerak pembalikan dan pemisahan. Padanan ini lebih kuat daripada 'kembali dari' yang kurang alami, tetapi tidak menambahkan kesimpulan doktrinal.
- source_word: τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς
  choice: perintah kudus yang telah disampaikan kepada mereka
  rationale: Mempertahankan bentuk tunggal ἐντολή, sifat ἁγία, dan arti pasif παραδοθείσης sebagai sesuatu yang diteruskan atau disampaikan kepada mereka.
theological_decisions:
- issue: Apakah terjemahan harus memastikan bahwa orang-orang itu kehilangan keselamatan atau hanya pernah memiliki pengenalan lahiriah
  choice: Menyatakan bahwa mereka benar-benar mengenal jalan kebenaran lalu berbalik dari perintah kudus, tanpa menentukan status keselamatan mereka.
  alternative: Memperkuat kalimat agar secara eksplisit menyatakan kehilangan keselamatan, atau memperlemahnya menjadi sekadar pernah mendengar ajaran.
  rationale: Teks Yunani menegaskan pengenalan dan pembalikan, tetapi tidak secara langsung menyelesaikan perdebatan teologis tentang kemurtadan dan ketekunan. Ketegangan itu perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan perbandingan, pengulangan 'mengenal', metafora 'jalan', dan bentuk tunggal 'perintah'.
