id: 2PE.2.20
reference: 2 Peter 2:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ ⸀κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/020.yaml
  text: For if[a], after escaping the defilements of the world through the knowledge of the Lord and Savior Jesus the Messiah, they are again entangled in these things and overcome[b], the last state has become worse for them than the first.
translation:
  language: id
  text: Sebab, jika setelah lolos dari kecemaran dunia melalui pengenalan akan Tuhan dan Juruselamat Yesus Sang Mesias, mereka kembali terjerat di dalamnya dan dikalahkan, keadaan terakhir mereka menjadi lebih buruk daripada keadaan semula.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποφυγόντες
  choice: setelah melepaskan diri
  rationale: Partisip aoristus menunjukkan tindakan yang mendahului keterjeratan kembali; frasa ini menyatakan urutan tersebut secara alami.
- source_word: τὰ μιάσματα τοῦ κόσμου
  choice: kecemaran-kecemaran dunia
  rationale: μίασμα menunjuk pada sesuatu yang mencemarkan atau menajiskan; bentuk jamak dipertahankan tanpa membatasi kecemaran itu pada satu jenis.
- source_word: ἐν ἐπιγνώσει
  choice: melalui pengenalan
  rationale: ἐν di sini paling wajar menyatakan sarana, sedangkan ἐπίγνωσις diterjemahkan secara netral agar tidak menentukan apakah pengenalan itu harus dipahami sebagai pengalaman keselamatan atau sekadar pengetahuan lahiriah.
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: Tuhan dan Juruselamat
  rationale: Kedua nomina merupakan gelar yang sama-sama merujuk kepada Yesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός dipertahankan sebagai gelar mesianik, dan 'Sang' membuat fungsi gelarnya jelas serta alami dalam bahasa Indonesia.
- source_word: τούτοις δὲ πάλιν ἐμπλακέντες
  choice: mereka kembali terjerat di dalam semuanya itu
  rationale: τούτοις merujuk kembali pada kecemaran-kecemaran dunia, sementara ἐμπλακέντες mempertahankan gambaran terbelit atau terjerat.
- source_word: ἡττῶνται
  choice: dikalahkan
  rationale: Verba ini berarti ditundukkan atau dikalahkan; bentuk pasif dipertahankan.
- source_word: τὰ ἔσχατα χείρονα τῶν πρώτων
  choice: keadaan mereka yang terakhir menjadi lebih buruk daripada yang semula
  rationale: Ungkapan substantival ini membandingkan keadaan akhir dengan keadaan awal tanpa menambahkan rincian eskatologis.
theological_decisions:
- issue: Hakikat pengenalan akan Yesus dalam kaitannya dengan kemurtadan
  choice: pengenalan
  alternative: pengenalan yang menyelamatkan; pengetahuan lahiriah semata
  rationale: Kata Yunani ἐπίγνωσις tidak dengan sendirinya menyelesaikan perdebatan tentang status rohani orang-orang tersebut; terjemahan mempertahankan ketegangan itu.
- issue: Fungsi Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam rangkaian gelar 'Tuhan dan Juruselamat', nuansa Χριστός sebagai gelar masih jelas, sehingga diterjemahkan 'Sang Mesias'.
- issue: Acuan keadaan terakhir dan semula
  choice: keadaan mereka yang terakhir ... yang semula
  alternative: kesudahan mereka ... permulaan mereka
  rationale: Terjemahan ini mempertahankan perbandingan kondisi tanpa menafsirkan secara khusus sifat atau akibat akhir tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat bersyarat serta ketegangan teologis teks dipertahankan; tidak ada catatan kaki karena alternatif utama dapat dijelaskan dalam keputusan penerjemahan tanpa membebani teks terbitan.
