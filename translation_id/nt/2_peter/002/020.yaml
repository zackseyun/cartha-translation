  to: Sebab, jika setelah lolos dari kecemaran dunia melalui pengenalan akan Tuhan dan Juruselamat Yesus Sang Mesias, mereka kembali terjerat di dalamnya dan dikalahkan, keadaan terakhir mereka menjadi lebih buruk daripada keadaan semula.
