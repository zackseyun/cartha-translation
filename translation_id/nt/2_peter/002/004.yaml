id: 2PE.2.4
reference: 2 Peter 2:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ ⸀σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/004.yaml
  text: For if God did not spare angels when they sinned[a], but cast them into Tartarus and committed them to chains of gloom, to be kept for judgment[b],
translation:
  language: id
  text: Sebab, jika Allah tidak menyayangkan para malaikat yang berdosa, tetapi melemparkan mereka ke Tartaros[a] dan menyerahkan mereka dalam rantai-rantai kekelaman, untuk tetap ditahan bagi penghakiman[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “melemparkan mereka ke neraka.” Kata kerja Yunani yang dipakai secara khusus berarti memasukkan ke Tartaros; karena itu, istilah yang lebih tepat tersebut dipertahankan dalam teks utama.'
    reason: lexical_alternative
  - marker: b
    text: Sejumlah naskah berbunyi “lubang-lubang kekelaman” dan bukan “rantai-rantai kekelaman.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐφείσατο
  choice: tidak menyayangkan
  rationale: Ungkapan ini secara wajar menyampaikan bahwa Allah tidak menahan hukuman atau memberikan pengecualian dari hukuman, tanpa mempersempit maknanya menjadi sekadar tidak berbelas kasihan.
- source_word: ἀγγέλων ἁμαρτησάντων
  choice: malaikat-malaikat ketika mereka berbuat dosa
  rationale: Klausa temporal mempertahankan daya peristiwa dari partisip aoristus dan menghasilkan bahasa Indonesia yang jelas serta alami.
- source_word: ταρταρώσας
  choice: melemparkan mereka ke Tartaros
  rationale: Kata kerja Yunani ini secara khusus berarti memasukkan ke Tartaros. Nama tersebut dipertahankan agar gambaran khas teks tidak digeneralisasi menjadi konsep neraka yang lebih luas.
- source_word: σειραῖς ζόφου
  choice: kepada rantai-rantai kekelaman
  rationale: Terjemahan ini mempertahankan citra rantai serta nuansa ζόφος sebagai kegelapan yang muram dan menindas, tanpa menentukan apakah rantai itu harfiah, metaforis, atau menunjukkan tempat penahanan.
- source_word: παρέδωκεν
  choice: menyerahkan mereka
  rationale: Dalam konteks penghakiman, kata ini menyatakan tindakan menyerahkan seseorang ke dalam tahanan atau penguasaan pihak lain.
- source_word: εἰς κρίσιν
  choice: sampai penghakiman
  rationale: Dalam hubungan dengan keadaan ditahan, frasa ini secara alami menunjukkan bahwa penahanan berlangsung menantikan penghakiman, tanpa menyamakannya langsung dengan vonis penghukuman.
- source_word: τηρουμένους
  choice: untuk ditahan
  rationale: Bentuk partisip pasif kini menggambarkan keadaan penjagaan atau penahanan yang terus berlangsung menuju penghakiman.
theological_decisions:
- issue: Penerjemahan ταρταρώσας tanpa memasukkan kekhususan doktrinal yang lebih kemudian
  choice: melemparkan mereka ke Tartaros
  alternative: melemparkan mereka ke neraka
  rationale: Teks memakai kata kerja langka yang secara khusus merujuk pada Tartaros. Mempertahankan nama itu menjaga kekhasan citra sumber dan menghindari penyamaan diam-diam dengan seluruh cakupan istilah teologis “neraka”.
- issue: Hubungan antara Tartaros, rantai-rantai kekelaman, dan keadaan ditahan
  choice: menyerahkan mereka kepada rantai-rantai kekelaman untuk ditahan sampai penghakiman
  alternative: melemparkan mereka ke Tartaros dalam rantai-rantai kekelaman hingga penghakiman
  rationale: Susunan ini mempertahankan semua unsur dalam sintaksis Yunani yang padat tanpa memastikan secara berlebihan apakah rantai-rantai itu bersifat instrumental, lokatif, harfiah, atau metaforis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. “Tartaros” dipertahankan sebagai istilah khas sumber serta dijelaskan dalam catatan kaki. Bentuk jamak pada “malaikat-malaikat” dan “rantai-rantai” dibuat eksplisit, sedangkan koma akhir dipertahankan karena ayat ini merupakan anak kalimat yang berlanjut ke ayat-ayat berikutnya.
