id: 2PE.2.16
reference: 2 Peter 2:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔλεγξιν δὲ ἔσχεν ἰδίας παρανομίας· ὑποζύγιον ἄφωνον ἐν ἀνθρώπου φωνῇ φθεγξάμενον ἐκώλυσεν τὴν τοῦ προφήτου παραφρονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/016.yaml
  text: 'But he received a rebuke for his own transgression: a mute beast of burden[a], speaking with a human voice[b], restrained the prophet’s madness.'
translation:
  language: id
  text: 'Namun, ia mendapat teguran atas pelanggarannya sendiri: seekor hewan beban yang bisu[a], berbicara dengan suara manusia[b], mengekang kegilaan nabi itu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hewan beban”; yang dimaksud adalah keledai Bileam (Bil. 22:28–30).
    reason: cross_reference
  - marker: b
    text: Atau “dengan suara seorang manusia.” Frasa Yunani ini kemungkinan besar mempertentangkan suara manusia dengan hewan yang bisu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξιν
  choice: teguran
  rationale: Kata ini menunjuk pada tindakan mengecam atau mengoreksi; 'teguran' alami dalam bahasa Indonesia dan sesuai dengan konteks Bileam yang dikoreksi.
- source_word: ἰδίας παρανομίας
  choice: pelanggarannya sendiri
  rationale: παρανομία menyatakan tindakan yang melanggar hukum atau ketentuan, sedangkan ἰδίας menekankan tanggung jawab pribadinya.
- source_word: ὑποζύγιον
  choice: hewan beban
  rationale: Istilah Yunani ini secara umum berarti hewan yang memikul beban. Terjemahan ini tidak memasukkan kata 'keledai' dari latar Bilangan 22 ke dalam teks utama.
- source_word: ἄφωνον
  choice: yang bisu
  rationale: ἄφωνος berarti tidak bersuara atau tidak dapat berbicara; 'bisu' mempertahankan ironi bahwa hewan tersebut kemudian berbicara.
- source_word: ἐν ἀνθρώπου φωνῇ
  choice: dengan suara manusia
  rationale: Frasa ini menyatakan cara hewan itu berbicara dan mempertentangkan suara manusia dengan hewan, bukan suara laki-laki dengan perempuan.
- source_word: φθεγξάμενον
  choice: yang berbicara
  rationale: Partisip ini merujuk pada ujaran yang dapat dipahami; 'berbicara' merupakan padanan Indonesia yang jelas dan wajar.
- source_word: ἐκώλυσεν
  choice: menahan
  rationale: κωλύω dapat berarti menghalangi, mencegah, atau menahan. 'Menahan' cocok dengan gagasan menghentikan atau membatasi tindakan irasional sang nabi tanpa memperjelas secara berlebihan hasil akhirnya.
- source_word: παραφρονίαν
  choice: kegilaan
  rationale: παραφρονία menunjuk pada keadaan atau tindakan yang tidak waras dan irasional; 'kegilaan' mempertahankan kekuatan ungkapannya.
- source_word: τοῦ προφήτου
  choice: nabi itu
  rationale: Genitif ini mengaitkan kegilaan tersebut dengan sang nabi. Bentuk 'nabi itu' alami dalam bahasa Indonesia dan menunjuk kembali kepada Bileam.
theological_decisions:
- issue: Apakah ὑποζύγιον perlu disebut secara khusus sebagai 'keledai' berdasarkan kisah Bileam
  choice: Mempertahankan istilah umum 'hewan beban' dalam teks utama
  alternative: keledai
  rationale: Bilangan 22 jelas menunjukkan bahwa hewan tersebut adalah keledai Bileam, tetapi teks Yunani ayat ini memakai istilah umum ὑποζύγιον. Identitas khususnya diberikan dalam catatan kaki.
- issue: Pemaknaan ἀνθρώπου dalam frasa ἐν ἀνθρώπου φωνῇ
  choice: manusia
  alternative: seorang laki-laki
  rationale: Dalam konteks ini, ἄνθρωπος membedakan suara manusia dari hewan, bukan membedakan jenis kelamin.
- issue: Kekuatan makna παραφρονίαν
  choice: kegilaan
  alternative: kebodohan
  rationale: Pilihan 'kegilaan' mempertahankan gambaran kuat tentang tindakan irasional Bileam tanpa melunakkannya menjadi sekadar kurang bijaksana.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti hubungan sintaksis teks Yunani, dengan pengulangan 'yang' untuk menjaga kejelasan tanpa terasa kaku.
