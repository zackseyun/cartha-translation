id: 2PE.2.15
reference: 2 Peter 2:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀καταλιπόντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ ⸀Βοσὸρ ὃς μισθὸν ἀδικίας ἠγάπησεν
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/015.yaml
  text: Having abandoned the straight way[a], they went astray, having followed the way of Balaam son of Bosor[b], who loved the wages of unrighteousness.
translation:
  language: id
  text: Setelah meninggalkan jalan yang lurus, mereka tersesat dengan mengikuti[b] jalan Bileam anak Bosor[a], yang mencintai upah kejahatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bosor adalah bentuk yang terdapat dalam teks Yunani; dalam Perjanjian Lama, Bileam biasanya disebut anak Beor.
    reason: alternative_reading
  - marker: b
    text: Atau, “mereka tersesat, setelah mengikuti.”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: καταλιπόντες
  choice: Setelah meninggalkan
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. “Meninggalkan” alami dalam bahasa Indonesia dan cukup kuat dalam konteks penyimpangan yang disengaja.
- source_word: εὐθεῖαν ὁδὸν
  choice: jalan yang lurus
  rationale: Mempertahankan gambaran konkret tentang jalan serta citra moral alkitabiah, tanpa mempersempitnya menjadi parafrasa seperti “jalan yang benar”.
- source_word: ἐπλανήθησαν
  choice: mereka tersesat
  rationale: Menyampaikan makna pasif-intransitif dalam konteks moral dan rohani tanpa menambahkan pelaku luar yang tidak dinyatakan.
- source_word: ἐξακολουθήσαντες
  choice: dengan mengikuti
  rationale: Mengungkapkan hubungan cara atau sarana yang mungkin antara partisip dan verba utama, sambil mempertahankan alternatif temporal dalam catatan kaki.
- source_word: τῇ ὁδῷ
  choice: jalan
  rationale: Menjaga pengulangan ὁδός dan kesinambungan metafora jalan dalam ayat ini.
- source_word: τοῦ Βαλαὰμ
  choice: Bileam
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: τοῦ Βοσὸρ
  choice: anak Bosor
  rationale: Genitif kedua sesudah nama pribadi paling wajar dipahami sebagai hubungan keturunan; bentuk Bosor mengikuti teks Yunani.
- source_word: μισθὸν ἀδικίας
  choice: upah kejahatan
  rationale: “Upah” mempertahankan gagasan bayaran atau keuntungan, sedangkan “kejahatan” menyampaikan bobot moral ἀδικία secara alami dalam bahasa Indonesia.
- source_word: ἠγάπησεν
  choice: mencintai
  rationale: Menerjemahkan ἀγαπάω secara langsung dan mempertahankan kuatnya keterikatan Bileam pada keuntungan yang jahat.
theological_decisions:
- issue: Gambaran jalan dalam εὐθεῖαν ὁδὸν dan τῇ ὁδῷ
  choice: Mempertahankan kata “jalan” pada kedua tempat.
  alternative: jalan yang benar; cara hidup Bileam
  rationale: Teks memakai metafora jalan yang mapan untuk arah moral. Mempertahankannya menghindari parafrasa yang terlalu menafsirkan.
- issue: Identitas Βοσόρ
  choice: Bosor dalam teks utama, dengan Beor dalam catatan kaki.
  alternative: Beor dalam teks utama
  rationale: SBLGNT berbunyi Βοσόρ, tetapi Perjanjian Lama umumnya menyebut tokoh yang sama sebagai Bileam anak Beor. Catatan kaki menjaga transparansi tekstual dan membantu pembaca mengenali tokohnya.
- issue: Hubungan sintaksis ἐξακολουθήσαντες dengan ἐπλανήθησαν
  choice: “tersesat dengan mengikuti,” yang menampilkan kemungkinan hubungan sarana.
  alternative: “tersesat, setelah mengikuti”
  rationale: Partisip aoris dapat dipahami sebagai tindakan pengiring atau sebagai cara mereka tersesat. Teks utama memakai bentuk Indonesia yang alami, sedangkan catatan kaki mempertahankan kemungkinan temporal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora “jalan” serta kekuatan moral “mencintai upah kejahatan” dipertahankan, sementara susunan kalimat dibuat alami bagi pembaca umum.
