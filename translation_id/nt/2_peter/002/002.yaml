  naturalness: “Banyak orang akan mengikuti perilaku mereka yang tidak tahu malu” adalah Bahasa Indonesia baku yang lebih lancar daripada “mengikuti perbuatan mereka yang tidak tahu malu.” Pengulangan “orang-orang itu” tidak diperlukan dan dapat memberi kesan anteseden yang lebih tegas daripada yang dituntut oleh teks.
  terminology: “Jalan kebenaran” dan “akan dihujat” merupakan padanan yang baik, bermartabat, dan setia bagi ἡ ὁδὸς τῆς ἀληθείας dan βλασφημηθήσεται. “Perilaku ... yang tidak tahu malu” mempertahankan keluasan ἀσέλγεια tanpa membatasinya pada percabulan saja.
