base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/002.yaml
  text: And many will follow their sensuality[c][b][a], and because of them the way of the truth will be blasphemed.
translation:
  language: id
  text: Banyak orang akan mengikuti perilaku mereka yang tidak tahu malu[a], dan karena mereka jalan kebenaran[b] akan dihujat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebejatan”, “perilaku tanpa kendali”, atau “perbuatan cabul”. Istilah Yunani ini menunjuk pada perilaku tanpa rasa malu dan tanpa pengekangan, sering kali dengan nuansa seksual.
    reason: lexical_alternative
  - marker: b
    text: Frasa ini kemungkinan menunjuk pada iman Kristen dan cara hidup yang benar.
    reason: lexical_alternative
  - marker: c
    text: Atau “akan dicela”, “akan dicemarkan namanya”, atau “akan diburuk-burukkan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: banyak orang
  rationale: Menyampaikan jumlah yang besar secara alami dan tetap mempertahankan rujukan kepada orang-orang.
- source_word: ἐξακολουθήσουσιν
  choice: akan mengikuti
  rationale: Mempertahankan bentuk masa depan dan gambaran mengikuti jalan atau pola hidup para guru palsu.
- source_word: αὐτῶν
  choice: mereka
  rationale: Kata ganti ini merujuk kepada para guru palsu dalam konteks sebelumnya.
- source_word: ταῖς ἀσελγείαις
  choice: perbuatan mereka yang tidak tahu malu
  rationale: Ungkapan ini mencakup perilaku tanpa kendali dan tanpa rasa malu, sering kali bernuansa seksual, tanpa membatasinya hanya pada dosa seksual. Kata 'perbuatan' juga mencerminkan bentuk jamak Yunani secara wajar.
- source_word: δι’ οὓς
  choice: karena orang-orang itu
  rationale: διά dengan akusatif menyatakan sebab. Ungkapan ini memperjelas bahwa para pengikut atau pelaku tersebut menjadi penyebab jalan kebenaran dihujat, sambil membiarkan cakupan tepat antesedennya mengikuti konteks.
- source_word: ἡ ὁδὸς τῆς ἀληθείας
  choice: jalan kebenaran
  rationale: Mempertahankan metafora 'jalan' dan konstruksi genitif secara alami dalam bahasa Indonesia; frasa ini menunjuk pada iman dan cara hidup yang selaras dengan kebenaran.
- source_word: βλασφημηθήσεται
  choice: akan dihujat
  rationale: Padanan langsung yang mempertahankan bentuk pasif, masa depan, dan bobot ucapan yang menghina atau mencemarkan sesuatu yang suci.
theological_decisions:
- issue: Rujukan dan makna 'jalan kebenaran'
  choice: Dipertahankan sebagai 'jalan kebenaran', yakni sebutan bagi iman dan cara hidup yang benar.
  alternative: '''jalan yang benar'' atau parafrasa langsung seperti ''iman Kristen'''
  rationale: Terjemahan ini mempertahankan metafora serta keluasan makna teks tanpa mengubahnya menjadi slogan doktrinal yang lebih sempit.
- issue: Cakupan moral ἀσέλγεια
  choice: '''perbuatan ... yang tidak tahu malu'''
  alternative: '''percabulan'', ''kebejatan'', atau ''hawa nafsu'''
  rationale: Istilah Yunani dapat mencakup pelampiasan seksual, tetapi juga perilaku tidak terkendali dan tidak tahu malu secara lebih luas. Pilihan utama tidak mempersempit cakupannya.
- issue: Pelaku yang menyebabkan jalan kebenaran dihujat
  choice: '''karena orang-orang itu'''
  alternative: '''karena mereka'' atau ''melalui mereka'''
  rationale: Bentuk Yunani dapat merujuk secara kontekstual kepada orang-orang yang baru disebut, terutama para pengikut perilaku tersebut. Pilihan ini alami dalam bahasa Indonesia dan tidak menetapkan identitas mereka secara lebih sempit daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur kalimat mengikuti alur Yunani, tetapi pengulangan 'orang-orang itu' dipakai agar hubungan sebab jelas dan alami. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
