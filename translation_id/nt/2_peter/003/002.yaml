  text: μνησθῆναι τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν καὶ τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/002.yaml
  text: to remember the words spoken beforehand by the holy prophets and the commandment of your apostles from the Lord and Savior[b][a],
translation:
  language: id
  text: supaya kamu mengingat perkataan yang telah diucapkan lebih dahulu[b] oleh para nabi kudus dan perintah Tuhan dan Juru Selamat yang disampaikan melalui rasul-rasulmu[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perintah rasul-rasulmu yang berasal dari Tuhan dan Juru Selamat.” Hubungan antarkata dalam rangkaian bentuk genitif Yunani ini dapat diungkapkan secara alami dengan lebih dari satu cara.
    reason: alternative_reading
  - marker: b
    text: Atau, “perkataan yang telah diucapkan sebelumnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μνησθῆναι
  choice: supaya kamu mengingat
  rationale: Infinitif ini melanjutkan tujuan yang dinyatakan dalam ayat 1. Bentuk aktif dalam bahasa Indonesia menyampaikan maknanya secara alami.
- source_word: προειρημένων ῥημάτων
  choice: perkataan yang telah disampaikan sebelumnya
  rationale: Ungkapan ini mempertahankan gagasan bahwa perkataan tersebut telah diucapkan lebih dahulu tanpa mempersempitnya menjadi ramalan.
- source_word: ὑπὸ τῶν ἁγίων προφητῶν
  choice: oleh para nabi kudus
  rationale: Bentuk ini alami dalam bahasa Indonesia dan mempertahankan sifat kudus para nabi.
- source_word: ἐντολῆς
  choice: perintah
  rationale: Kata ini menyatakan perintah yang berwenang dan mempertahankan bentuk tunggal Yunani.
- source_word: τῶν ἀποστόλων ὑμῶν
  choice: melalui rasul-rasulmu
  rationale: ὑμῶν paling wajar menerangkan para rasul yang berhubungan dengan para pembaca; 'melalui' menyatakan perantaraan mereka dalam menyampaikan perintah.
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: Tuhan dan Juru Selamat
  rationale: Kedua gelar dipertahankan tanpa menambahkan kata 'kita', yang tidak terdapat dalam teks Yunani.
theological_decisions:
- issue: Hubungan ὑμῶν dengan τῶν ἀποστόλων
  choice: '''mu'' menerangkan ''rasul-rasul'''
  alternative: '''perintah yang diberikan kepadamu oleh para rasul'''
  rationale: Urutan katanya paling langsung menghubungkan ὑμῶν dengan ἀποστόλων, tanpa bermaksud menyatakan kepemilikan mutlak.
- issue: Hubungan τοῦ κυρίου καὶ σωτῆρος dengan frasa perintah dan para rasul
  choice: Perintah berasal atau menjadi milik Tuhan dan Juru Selamat serta disampaikan melalui para rasul
  alternative: perintah rasul-rasulmu yang berasal dari Tuhan dan Juru Selamat
  rationale: Susunan genitif Yunani memungkinkan lebih dari satu pengungkapan alami. Teks utama menonjolkan Tuhan dan Juru Selamat sebagai sumber atau pemilik perintah, sedangkan catatan mempertahankan susunan alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Ayat dipertahankan sebagai kelanjutan sintaksis ayat 1. 'Rasul-rasulmu' mengikuti hubungan gramatikal Yunani, sedangkan catatan kaki mencegah ungkapan itu dipahami sebagai kepemilikan modern yang mutlak.
