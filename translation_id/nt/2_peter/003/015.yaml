  text: καὶ τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε, καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν ⸂δοθεῖσαν αὐτῷ⸃ σοφίαν ἔγραψεν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/015.yaml
  text: And regard the patience of our Lord as salvation[a], just as our beloved brother Paul also wrote to you according to the wisdom given to him[b],
translation:
  language: id
  text: Dan anggaplah kesabaran Tuhan kita sebagai keselamatan[a], sebagaimana saudara kita yang terkasih, Paulus, juga telah menulis kepada kamu sesuai dengan hikmat yang diberikan kepadanya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “panjang sabar”; maksudnya, Tuhan menunda penghukuman demi keselamatan, bukan karena Ia tidak peduli.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “hikmat yang diberikan kepadanya” kemungkinan menyiratkan bahwa hikmat itu diberikan oleh Allah, meskipun teks Yunani tidak menyebutkan pemberinya.
    reason: alternative_reading
lexical_decisions:
- source_word: μακροθυμίαν
  choice: kesabaran
  rationale: Kata ini menunjuk pada kesabaran yang menahan penghukuman. Dalam konteks kedatangan Tuhan yang tampak tertunda, “kesabaran” alami dalam bahasa Indonesia dan tetap mempertahankan gagasan penundaan penghukuman.
- source_word: σωτηρίαν
  choice: keselamatan
  rationale: Dalam konteks eskatologis ini, kata tersebut menunjuk pada maksud penyelamatan Allah melalui tertundanya penghukuman; “keselamatan” mempertahankan bobot teologis dan predikasi langsung teks Yunani.
- source_word: ἡγεῖσθε
  choice: anggaplah ... sebagai
  rationale: Bentuk imperatif ini meminta pembaca menilai atau memandang sesuatu dengan cara tertentu. Konstruksi “anggaplah ... sebagai” menyampaikan hubungan predikatif dengan jelas dan wajar.
- source_word: κυρίου
  choice: Tuhan
  rationale: Dalam konteks “Tuhan kita”, sebutan ini merujuk kepada Yesus dan mempertahankan kekuatan gelar κύριος.
- source_word: ἀγαπητὸς ... ἀδελφὸς
  choice: saudara ... yang terkasih
  rationale: Ungkapan ini merupakan sebutan penuh kasih bagi Paulus. Susunan Indonesia ini alami sekaligus mempertahankan unsur persaudaraan dan kasih.
- source_word: κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν
  choice: sesuai dengan hikmat yang diberikan kepadanya
  rationale: κατά dengan akusatif menyatakan kesesuaian. Bentuk pasif “diberikan” dipertahankan tanpa menyebut pemberinya karena pelaku tidak dinyatakan dalam bahasa Yunani.
- source_word: ἔγραψεν ὑμῖν
  choice: telah menulis kepada kamu
  rationale: Aoristus menunjuk pada tindakan menulis yang telah dilakukan. “Telah menulis” terdengar alami dalam rujukan surat dan menegaskan relevansi tulisan itu bagi para penerima.
- source_word: καθὼς καὶ
  choice: sama seperti ... juga
  rationale: Pilihan ini mempertahankan baik daya perbandingan καθὼς maupun nuansa tambahan καί, yang menghubungkan nasihat Petrus dengan tulisan Paulus.
theological_decisions:
- issue: Pelaku yang memberikan hikmat kepada Paulus
  choice: Mempertahankan bentuk pasif “diberikan kepadanya” tanpa menambahkan “oleh Allah” dalam teks utama.
  alternative: “sesuai dengan hikmat yang Allah berikan kepadanya”
  rationale: Konteks sangat mungkin menyiratkan bahwa Allah adalah pemberinya, tetapi teks Yunani tidak menyatakan pelaku. Bentuk pasif menjaga implikasi itu tanpa mengubahnya menjadi pernyataan eksplisit.
- issue: Makna kesabaran Tuhan dalam penundaan penghakiman
  choice: Menerjemahkan μακροθυμία sebagai “kesabaran” dan σωτηρία sebagai “keselamatan”, dengan mempertahankan hubungan langsung “anggaplah ... sebagai”.
  alternative: “anggaplah kelapangan hati Tuhan kita sebagai kesempatan untuk diselamatkan”
  rationale: Teks tidak secara eksplisit menambahkan “kesempatan untuk”. Terjemahan utama mempertahankan ketegangan dan kepadatan ungkapan Yunani bahwa kesabaran Tuhan harus dipandang sebagai keselamatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Kamu” dipakai sebagai bentuk jamak yang sesuai bagi para penerima surat. Struktur ayat dan koma akhir dipertahankan karena kalimat berlanjut ke ayat berikutnya.
