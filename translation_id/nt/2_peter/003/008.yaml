  text: Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/008.yaml
  text: 'But do not let this one thing escape your notice[a], beloved: with the Lord one day is like a thousand years[c][b], and a thousand years like one day.'
translation:
  language: id
  text: Namun, Saudara-saudara yang terkasih, jangan biarkan satu hal ini luput dari perhatian kalian:[a] bagi Tuhan, satu hari seperti seribu tahun,[c][b] dan seribu tahun seperti satu hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jangan sampai satu hal ini tidak kalian sadari.”
    reason: lexical_alternative
  - marker: b
    text: Kata “seperti” menyatakan perbandingan, bukan bahwa satu hari secara harfiah sama dengan seribu tahun.
    reason: cultural_note
  - marker: c
    text: Menggemakan Mazmur 90:4.
    reason: cross_reference
lexical_decisions:
- source_word: Ἓν δὲ τοῦτο
  choice: Namun ... satu hal ini
  rationale: Ἓν dan τοῦτο bersama-sama menonjolkan satu pokok tertentu. 'Satu hal ini' mempertahankan penekanan itu, sedangkan δέ diterjemahkan 'Namun' untuk menandai peralihan yang berlawanan dengan kelalaian para pengejek dalam konteks.
- source_word: μὴ λανθανέτω ὑμᾶς
  choice: jangan biarkan ... luput dari perhatian kalian
  rationale: Ungkapan ini berarti jangan sampai sesuatu tidak disadari atau luput dari perhatian. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya imperatif serta relasinya dengan ὑμᾶς.
- source_word: ἀγαπητοί
  choice: Saudara-saudara yang terkasih
  rationale: Sapaan ini menyatakan kasih kepada sesama orang percaya. 'Saudara-saudara yang terkasih' terdengar wajar, hangat, dan bermartabat dalam bahasa Indonesia modern.
- source_word: παρὰ κυρίῳ
  choice: bagi Tuhan
  rationale: παρά dengan datif di sini menyatakan perspektif atau penilaian di hadapan Tuhan. 'Bagi Tuhan' menyampaikan sudut pandang tersebut secara ringkas tanpa menguraikannya secara berlebihan.
- source_word: μία ἡμέρα ... ὡς χίλια ἔτη
  choice: satu hari seperti seribu tahun
  rationale: ὡς menandai perbandingan, bukan persamaan harfiah. 'Seperti' mempertahankan bentuk simile dengan jelas.
- source_word: καὶ χίλια ἔτη ὡς ἡμέρα μία
  choice: dan seribu tahun seperti satu hari
  rationale: Susunan ini mempertahankan kesejajaran terbalik dari kedua klausa Yunani. Kopula tidak perlu diulang dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat perbandingan waktu
  choice: Menerjemahkan pernyataan ini sebagai perbandingan mengenai perspektif Tuhan terhadap waktu, bukan persamaan matematis.
  alternative: Menafsirkan satu hari secara harfiah sama dengan seribu tahun atau menjadikannya rumus kronologi nubuat.
  rationale: Pengulangan ὡς ('seperti') secara gramatikal menandai analogi. Terjemahan mempertahankan perbandingan tersebut tanpa memasukkan suatu skema eskatologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pastoral dan bermartabat. Sapaan jamak 'Saudara-saudara yang terkasih' memperjelas bentuk vokatif jamak; 'kalian' dipakai agar rujukan jamak ὑμᾶς tetap jelas dan tidak terlalu formal. Penanda catatan kaki dipertahankan dalam teks utama.
