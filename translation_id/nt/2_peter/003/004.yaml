  text: καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/004.yaml
  text: and saying[a], “Where is the promise of his coming? For ever since the fathers fell asleep[b], all things continue just as they have from the beginning of creation.”
translation:
  language: id
  text: dan berkata, “Di manakah janji tentang kedatangan-Nya[a]? Sebab, sejak para leluhur meninggal[b], segala sesuatu tetap berlangsung seperti semula, sejak awal penciptaan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “kedatangan” juga dapat berarti “kehadiran” atau “ketibaan”. Dalam konteks ini, kata itu merujuk pada kedatangan Kristus yang dinantikan pada masa depan.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “tertidur”; ungkapan halus dalam bahasa Yunani untuk kematian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: dan berkata
  rationale: Mempertahankan hubungan partisipial dengan gambaran para pengejek pada ayat sebelumnya, sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: ἐπαγγελία
  choice: janji
  rationale: Padanan baku yang menunjuk pada janji mengenai kedatangan Kristus, tanpa mengubahnya menjadi pemenuhan janji.
- source_word: παρουσίας
  choice: kedatangan
  rationale: Dalam konteks eskatologis ini, kata tersebut menunjuk pada kedatangan atau tibanya Kristus yang dinantikan; ‘kedatangan’ paling jelas dan alami.
- source_word: ἀφ’ ἧς
  choice: sejak
  rationale: Mengungkapkan jangka waktu yang bermula pada suatu titik pada masa lampau.
- source_word: οἱ πατέρες
  choice: para leluhur
  rationale: Artikel Yunani tidak disertai kata ganti kepunyaan. ‘Para leluhur’ alami dalam bahasa Indonesia dan menyampaikan rujukan kepada generasi-generasi terdahulu.
- source_word: ἐκοιμήθησαν
  choice: meninggal
  rationale: Secara harfiah berarti ‘tertidur’ dan merupakan eufemisme Yunani bagi kematian. Dalam bahasa Indonesia modern, ‘meninggal’ menyampaikan maknanya secara alami; metafora sumber dicatat dalam catatan kaki.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Menyampaikan cakupan menyeluruh dari bentuk jamak netral Yunani.
- source_word: οὕτως διαμένει
  choice: tetap berlangsung seperti semula
  rationale: Mengungkapkan klaim bahwa keadaan segala sesuatu terus bertahan tanpa perubahan; ‘seperti semula’ memberi bentuk Indonesia yang alami bagi οὕτως dalam konteks ini.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: sejak awal penciptaan
  rationale: Padanan yang dekat dengan konstruksi Yunani dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna παρουσία dalam konteks eskatologis
  choice: kedatangan-Nya
  alternative: kehadiran-Nya; tibanya Dia
  rationale: Konteksnya adalah ejekan terhadap tertundanya penggenapan yang dinantikan, yakni kedatangan Kristus pada masa depan. ‘Kedatangan’ menyampaikan makna ini tanpa menambahkan rincian doktrinal.
- issue: Eufemisme kematian ἐκοιμήθησαν
  choice: meninggal, dengan catatan bahwa secara harfiah ‘tertidur’
  alternative: tertidur
  rationale: Bahasa Yunani memakai metafora yang lazim bagi kematian. Terjemahan utama dibuat jelas dan alami bagi pembaca Indonesia, sementara metafora asli dipertahankan melalui catatan kaki tanpa menarik kesimpulan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pertanyaan retoris dan klaim para pengejek dipertahankan. Bentuk ‘-Nya’ mengikuti kaidah ejaan untuk rujukan ilahi tanpa menjadikan kapitalisasi sebagai penafsiran tambahan.
