  text: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας ὅτι οὐρανοὶ ἦσαν ἔκπαλαι καὶ γῆ ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα τῷ τοῦ θεοῦ λόγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/005.yaml
  text: 'For they deliberately overlook this: that the heavens existed long ago[a], and the earth was formed out of water and through water by the word of God[c][b],'
translation:
  language: id
  text: 'Sebab mereka sengaja mengabaikan kenyataan ini: sejak dahulu kala langit sudah ada, dan bumi terbentuk dari air dan melalui air oleh firman Allah.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab mereka dengan rela tidak menyadari hal ini” atau “Sebab mereka memilih untuk tidak mengakui kenyataan ini.” Ungkapan Yunani memadukan ketidaksadaran dengan sikap yang disengaja.
    reason: lexical_alternative
lexical_decisions:
- source_word: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας
  choice: Sebab mereka sengaja mengabaikan kenyataan ini
  rationale: Ungkapan ini memadukan ketidaksadaran atau kegagalan mengakui dengan unsur kehendak. Terjemahan ini menyampaikan bahwa pengabaian tersebut disengaja, bukan sekadar ketidaktahuan.
- source_word: οὐρανοὶ ἦσαν ἔκπαλαι
  choice: sejak dahulu kala langit sudah ada
  rationale: Bentuk jamak Yunani οὐρανοί dapat dinyatakan secara alami dengan nomina kolektif Indonesia 'langit'; ἔκπαλαι menunjukkan keberadaan sejak masa lampau yang jauh.
- source_word: γῆ ... συνεστῶσα
  choice: bumi terbentuk
  rationale: Dalam bahasa Indonesia, 'bumi' tanpa artikel tetap alami dan tidak memaksakan definiteness yang tidak ditandai oleh bentuk Yunani. 'Terbentuk' menyatakan keadaan atau pembentukan yang digambarkan oleh participel perfektum συνεστῶσα tanpa menentukan lebih jauh apakah tekanannya pada asal-usul, susunan, atau keberlangsungannya.
- source_word: ἐξ ὕδατος καὶ δι’ ὕδατος
  choice: dari air dan melalui air
  rationale: Mempertahankan perbedaan antara ἐκ, yaitu asal 'dari', dan διά, yaitu perantaraan atau sarana 'melalui', sekalipun hubungan kosmologis tepatnya tetap terbuka.
- source_word: τῷ τοῦ θεοῦ λόγῳ
  choice: oleh firman Allah
  rationale: Datif instrumental diterjemahkan dengan 'oleh'. 'Firman Allah' mempertahankan λόγος sebagai perkataan Allah yang berdaya tanpa mengubahnya secara eksplisit menjadi gelar pribadi ataupun sekadar 'perintah'.
theological_decisions:
- issue: Apakah λόγος di sini harus diterjemahkan sebagai gelar pribadi Logos
  choice: firman Allah
  alternative: perintah Allah
  rationale: Konteks menunjuk pada perkataan Allah yang efektif dalam penciptaan, tetapi ayat ini tidak secara eksplisit memakai λόγος sebagai gelar kristologis. 'Firman Allah' mempertahankan kemungkinan resonansinya tanpa menambahkan identifikasi yang tidak dinyatakan.
- issue: Hubungan bumi dengan air dalam ἐξ ὕδατος καὶ δι’ ὕδατος
  choice: dari air dan melalui air
  alternative: dari air dan dengan perantaraan air
  rationale: Terjemahan mempertahankan kedua preposisi dan ambiguitas hubungan air dengan pembentukan atau keberadaan bumi, alih-alih menetapkan sebuah model kosmologi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kenyataan ini' melancarkan pengantar klausa isi. Urutan 'dari air dan melalui air' dipertahankan secara cukup formal demi menjaga perbedaan preposisi sumber. Tanda catatan kaki ditempatkan sesudah kalimat karena menjelaskan ungkapan pembuka.
