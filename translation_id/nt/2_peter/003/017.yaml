id: 2PE.3.17
reference: 2 Peter 3:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑμεῖς οὖν, ἀγαπητοί, προγινώσκοντες φυλάσσεσθε ἵνα μὴ τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες ἐκπέσητε τοῦ ἰδίου στηριγμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/017.yaml
  text: Therefore[a], you, beloved, knowing this beforehand, guard yourselves so that, being carried away by the error of the lawless[b], you may not fall from your own stability.
translation:
  language: id
  text: Karena itu, Saudara-saudara yang terkasih, karena kalian telah mengetahui hal ini sebelumnya, waspadalah agar kalian tidak ikut terseret oleh kesesatan orang-orang yang mengabaikan hukum, lalu jatuh dari keteguhan kalian sendiri.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kestabilan kalian sendiri” atau “kedudukan kalian yang kokoh.” Kata Yunani στηριγμός dapat berarti keteguhan, kestabilan, atau keadaan berdiri dengan kokoh.
    reason: lexical_alternative
  - marker: b
    text: “Jatuh dari” juga dapat diterjemahkan “jatuh keluar dari.” Terjemahan utama mempertahankan metafora Yunani tanpa menentukan bahwa peringatan ini secara khusus berbicara tentang kemurtadan atau kehilangan keselamatan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς οὖν
  choice: Karena itu, Saudara-saudara
  rationale: οὖν menyatakan kesimpulan dari peringatan sebelumnya, sedangkan ὑμεῖς memberi penekanan pada pihak yang disapa. Dalam bahasa Indonesia, sapaan eksplisit alami diwujudkan bersama ἀγαπητοί sebagai 'Saudara-saudara yang terkasih'.
- source_word: ἀγαπητοί
  choice: yang terkasih
  rationale: Mempertahankan kehangatan sapaan pastoral dan nada surat tanpa membatasi sapaan kepada jenis kelamin tertentu.
- source_word: προγινώσκοντες
  choice: karena kalian sudah mengetahui hal ini sebelumnya
  rationale: Partisip ini menyatakan pengetahuan atau peringatan yang telah diterima lebih dahulu. 'Hal ini' dipasok secara wajar dari konteks.
- source_word: φυλάσσεσθε
  choice: waspadalah
  rationale: Imperatif kini bentuk medial menuntut kewaspadaan yang terus-menerus demi menjaga diri. 'Waspadalah' merupakan ungkapan Indonesia yang alami dan mencakup daya refleksif dalam konteks.
- source_word: ἵνα μὴ
  choice: agar ... tidak
  rationale: Menyampaikan klausa tujuan sekaligus peringatan secara jelas dalam bahasa Indonesia modern.
- source_word: τῇ τῶν ἀθέσμων πλάνῃ
  choice: oleh kesesatan orang-orang yang tidak mengenal hukum
  rationale: πλάνη menunjuk pada kesalahan atau kesesatan, sedangkan ἄθεσμος menggambarkan orang yang mengabaikan batas atau norma hukum. Bentuk jamak substantival dinyatakan sebagai 'orang-orang'.
- source_word: συναπαχθέντες
  choice: ikut terseret
  rationale: Mempertahankan unsur pasif dan nuansa συν-, yaitu terseret bersama atau mengikuti pihak lain.
- source_word: ἐκπέσητε
  choice: jatuh dari
  rationale: Mempertahankan metafora ἐκπίπτω tanpa mempersempitnya menjadi kemurtadan atau kehilangan keselamatan.
- source_word: τοῦ ἰδίου στηριγμοῦ
  choice: keteguhan kalian sendiri
  rationale: στηριγμός dapat berarti keteguhan, kestabilan, atau kedudukan yang kokoh. 'Keteguhan' alami dalam konteks nasihat rohani dan tetap mempertahankan bentuk nomina; ἰδίου diterjemahkan 'sendiri' untuk menjaga penekanannya.
theological_decisions:
- issue: Apakah ἐκπέσητε menyatakan kemurtadan atau kehilangan keselamatan secara khusus
  choice: jatuh dari keteguhan kalian sendiri
  alternative: menyimpang dari iman atau kehilangan keselamatan
  rationale: Bahasa Yunani menyampaikan peringatan nyata tentang jatuh dari keadaan yang teguh, tetapi tidak menentukan secara eksplisit akibat doktrinalnya. Terjemahan mempertahankan ketegangan itu tanpa menyelesaikan perdebatan denominasi.
- issue: Rujukan 'keteguhan kalian sendiri'
  choice: Mempertahankan kepunyaan dan tanggung jawab pembaca tanpa menyiratkan bahwa keteguhan itu bersumber hanya dari kemampuan manusia
  alternative: kedudukan aman yang diberikan Allah
  rationale: ἰδίου menyatakan kepunyaan, tetapi ayat ini sendiri tidak menjelaskan sumber keteguhan tersebut; karena itu terjemahan tidak menambahkan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada pastoral. 'Kalian' dipakai untuk memperjelas bentuk jamak ὑμεῖς dan verba terkait, sementara sapaan 'Saudara-saudara yang terkasih' menjaga martabat serta kehangatan surat. Penanda catatan kaki ditempatkan sesudah frasa relevan dalam teks utama.
