  to: Karena itu, Saudara-saudara yang terkasih, karena kalian telah mengetahui hal ini sebelumnya, waspadalah agar kalian tidak ikut terseret oleh kesesatan orang-orang yang mengabaikan hukum, lalu jatuh dari keteguhan kalian sendiri.[a][b]
