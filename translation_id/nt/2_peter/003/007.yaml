  naturalness: Bahasa draf pada dasarnya baku dan bermartabat. Namun, susunan 'telah disimpan bagi api dan dipelihara sampai pada hari' kurang tegas dalam cakupan frasa 'bagi api'. Menempatkan 'dan dipelihara bagi api' secara langsung lebih alami dan lebih transparan.
