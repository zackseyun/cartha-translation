  text: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ τῷ ⸀αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρὶ τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/007.yaml
  text: But the present heavens and the earth are stored up by the same word, being kept for fire until the day of judgment and destruction of ungodly men.
translation:
  language: id
  text: Namun, langit dan bumi yang ada sekarang telah disimpan oleh firman yang sama dan dipelihara bagi api sampai pada hari penghakiman dan kebinasaan orang-orang fasik.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ
  choice: Namun, ... langit dan bumi yang sekarang ini
  rationale: δέ menandai kontras dengan dunia dahulu pada konteks sebelumnya. Bentuk jamak οὐρανοί diterjemahkan secara idiomatis sebagai “langit” dalam bahasa Indonesia, sedangkan νῦν menunjuk pada tatanan ciptaan yang ada sekarang.
- source_word: τῷ αὐτῷ λόγῳ
  choice: oleh firman yang sama
  rationale: Datif dipahami secara instrumental, dan “yang sama” mempertahankan rujukan kembali kepada firman Allah dalam konteks sebelumnya.
- source_word: τεθησαυρισμένοι εἰσὶν
  choice: telah disimpan
  rationale: Bentuk perfektum perifrastis menyatakan tindakan yang telah berlangsung dengan keadaan yang tetap berlaku. “Telah disimpan” menyampaikan hasil yang masih bertahan tanpa menyamakan istilah ini dengan τηρούμενοι.
- source_word: πυρὶ τηρούμενοι
  choice: bagi api dan dipelihara
  rationale: πυρί menyatakan tujuan atau peruntukan, sedangkan τηρέω berarti menjaga, memelihara, atau menahan tetap tersedia. Ungkapan ini sengaja tidak diterjemahkan “untuk dibinasakan oleh api” agar tidak menentukan lebih jauh sifat akhir kosmis yang tidak dijelaskan dalam ayat ini.
- source_word: εἰς ἡμέραν κρίσεως
  choice: sampai pada hari penghakiman
  rationale: εἰς dipahami memiliki daya temporal dan sekaligus mengarah kepada titik tujuan eskatologis.
- source_word: καὶ ἀπωλείας
  choice: dan kebinasaan
  rationale: ἀπώλεια menunjuk pada kebinasaan atau kehancuran. “Kebinasaan” sesuai dengan konteks penghakiman tanpa menjelaskan mekanismenya secara berlebihan.
- source_word: τῶν ἀσεβῶν ἀνθρώπων
  choice: orang-orang fasik
  rationale: ἀσεβής berarti tidak saleh, tidak menghormati Allah, atau fasik. “Orang-orang” secara alami mencakup manusia pada umumnya dan tidak membatasi rujukannya pada laki-laki.
theological_decisions:
- issue: Sifat kesudahan berapi yang akan datang
  choice: Ayat ini menyatakan bahwa langit dan bumi sekarang disimpan bagi api hingga penghakiman, tanpa menetapkan apakah hasilnya adalah pemusnahan total atau pembaruan melalui pemurnian.
  alternative: Menafsirkan ayat ini secara tegas sebagai pemusnahan kosmos sepenuhnya, atau sebaliknya sebagai transformasi ciptaan melalui pemurnian.
  rationale: Objek yang secara eksplisit terkait dengan ἀπώλεια adalah orang-orang fasik. Karena ayat ini sendiri tidak merinci akibat api atas langit dan bumi, terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Firman” dipertahankan karena konteks menunjuk pada ucapan Allah yang berdaya cipta dan menghakimi. Susunan kalimat dibuat alami dalam bahasa Indonesia sambil mempertahankan hubungan antara penyimpanan, api, pemeliharaan, dan hari penghakiman.
