id: 2PE.3.13
reference: 2 Peter 3:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/013.yaml
  text: But according to his promise[a], we are waiting for new heavens and a new earth, in which righteousness dwells.
translation:
  language: id
  text: 'Namun, sesuai dengan janji-Nya, kita menantikan langit yang baru dan bumi yang baru, tempat kebenaran[a] berdiam.


    [a] Atau, “keadilan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Partikel δέ menyatakan kontras ringan dengan kehancuran langit dan bumi yang sekarang dalam ayat sebelumnya. “Namun” menyampaikan kontras itu secara wajar dalam bahasa Indonesia.
- source_word: καινοὺς ... οὐρανοὺς / γῆν καινὴν
  choice: langit yang baru dan bumi yang baru
  rationale: καινός menunjuk pada kebaruan sifat atau keadaan, bukan sekadar sesuatu yang baru terjadi. Ungkapan ini mempertahankan cakupan kosmis dan gema Yesaya 65:17; 66:22, tanpa menafsirkan kata sifat tersebut secara berlebihan sebagai “yang diperbarui.”
- source_word: κατὰ τὸ ἐπάγγελμα αὐτοῦ
  choice: sesuai dengan janji-Nya
  rationale: κατά dengan akusatif menyatakan kesesuaian, sedangkan ἐπάγγελμα berarti “janji.” Bentuk “janji-Nya” secara alami merujuk kepada janji Allah.
- source_word: προσδοκῶμεν
  choice: kita menantikan
  rationale: Bentuk kini menunjukkan pengharapan yang terus berlangsung. “Menantikan” memadukan unsur menunggu dan berharap dalam bahasa Indonesia yang alami.
- source_word: ἐν οἷς
  choice: tempat
  rationale: Pronomina relatif jamak merujuk secara kolektif pada langit baru dan bumi baru. “Tempat” menyatakan ranah ciptaan baru itu dengan lancar tanpa memaksakan kesesuaian jumlah yang tidak alami dalam bahasa Indonesia.
- source_word: δικαιοσύνη
  choice: kebenaran
  rationale: δικαιοσύνη mencakup keadaan yang benar di hadapan Allah sekaligus tatanan moral yang lurus. “Kebenaran” mempertahankan keluasan makna teologis itu; “keadilan” dicantumkan sebagai alternatif yang sah.
- source_word: κατοικεῖ
  choice: berdiam
  rationale: κατοικέω berarti tinggal atau menetap. “Berdiam” bernada wajar dan bermartabat serta menyiratkan keberadaan yang menetap.
theological_decisions:
- issue: Makna δικαιοσύνη dalam konteks ciptaan baru
  choice: kebenaran
  alternative: keadilan
  rationale: Dalam konteks eskatologis ini, kata tersebut dapat menggambarkan seluruh keadaan yang benar dan selaras dengan kehendak Allah, bukan hanya keadilan dalam arti sosial atau hukum. Karena itu, “kebenaran” dipakai dalam teks utama, sementara “keadilan” dipertahankan dalam catatan kaki sebagai nuansa alternatif yang mungkin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur kalimat mempertahankan kontras, dasar pengharapan pada janji Allah, dan gambaran kebenaran yang menetap dalam ciptaan baru. Penanda catatan kaki ditempatkan langsung pada kata yang memiliki alternatif leksikal.
