reference: 2 Peter 3:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἥξει δὲ ⸀ἡμέρα κυρίου ὡς ⸀κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα ⸀λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα ⸀εὑρεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/010.yaml
  text: But the day of the Lord will come like a thief[a], in which the heavens will pass away with a roar, and the elements, being burned, will be dissolved[c][b], and the earth and the works in it will be found.
translation:
  language: id
  text: Namun, hari Tuhan akan datang seperti pencuri. Pada hari itu, langit akan lenyap dengan suara gemuruh, dan unsur-unsur[a] yang terbakar akan terurai. Bumi dan perbuatan-perbuatan di dalamnya akan didapati.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “benda-benda langit”; istilah Yunani στοιχεῖα dalam konteks ini juga dapat secara lebih khusus menunjuk pada komponen-komponen kosmos.
    reason: lexical_alternative
  - marker: b
    text: Sebagian orang memahami “akan didapati” sebagai “akan disingkapkan” atau “akan dinyatakan apa adanya”.
    reason: alternative_reading
  - marker: c
    text: Banyak naskah berbunyi “akan hangus terbakar” sebagai ganti “akan didapati”.
    reason: textual_variant
lexical_decisions:
- source_word: ἥξει
  choice: akan datang
  rationale: Bentuk futur ἥκω berarti datang atau tiba; “akan datang” wajar dalam ungkapan eskatologis ini.
- source_word: ἡμέρα κυρίου
  choice: hari Tuhan
  rationale: Mempertahankan ungkapan eskatologis yang berakar dalam bahasa para nabi dan rasul, bukan menunjuk pada hari ibadah mingguan.
- source_word: κλέπτης
  choice: pencuri
  rationale: Padanan langsung dan alami yang mempertahankan gambaran tentang kedatangan yang tidak disangka-sangka.
- source_word: ἐν ᾗ
  choice: Pada hari itu
  rationale: Menghubungkan peristiwa-peristiwa kosmis dengan hari yang baru disebut secara alami dalam bahasa Indonesia.
- source_word: οἱ οὐρανοὶ
  choice: langit
  rationale: Dalam bahasa Indonesia, bentuk tunggal kolektif “langit” secara wajar mencakup cakrawala atau ruang kosmis yang dinyatakan oleh bentuk jamak Yunani.
- source_word: ῥοιζηδόν
  choice: dengan suara gemuruh
  rationale: Mengungkapkan bunyi menderu, berdesing, atau menggemuruh yang terkandung dalam adverbia Yunani tanpa mempersempit jenis bunyinya.
- source_word: παρελεύσονται
  choice: akan lenyap
  rationale: Dalam konteks penghakiman kosmis, παρέρχομαι berarti berlalu atau lenyap; “lenyap” jelas dan alami dalam bahasa Indonesia.
- source_word: στοιχεῖα
  choice: unsur-unsur
  rationale: Padanan ini mempertahankan keluasan istilah Yunani dan tidak memutuskan apakah yang dimaksud ialah komponen dasar kosmos atau benda-benda langit.
- source_word: καυσούμενα
  choice: akan terbakar
  rationale: Mencerminkan proses pembakaran tanpa menyebut pelaku yang tidak dinyatakan dalam teks.
- source_word: λυθήσεται
  choice: lalu terurai
  rationale: λύω di sini menggambarkan sesuatu yang dilepaskan, dipecah, atau diuraikan; “terurai” mempertahankan citra disintegrasi dan lebih alami daripada istilah teknis “terlarut”.
- source_word: γῆ
  choice: Bumi
  rationale: Cakupan kosmis ayat ini mendukung “Bumi”, bukan “tanah” dalam arti wilayah setempat.
- source_word: τὰ ἐν αὐτῇ ἔργα
  choice: segala perbuatan yang ada di dalamnya
  rationale: ἔργα dapat berarti pekerjaan, karya, atau perbuatan. “Segala perbuatan” menampilkan dimensi tindakan tanpa menentukan hasil penghakimannya.
- source_word: εὑρεθήσεται
  choice: akan didapati
  rationale: Padanan paling langsung bagi bentuk pasif εὑρίσκω ini sengaja mempertahankan ungkapan Yunani yang sulit dan tidak menutup kemungkinan penafsiran yang diperdebatkan.
theological_decisions:
- issue: Makna klausa terakhir καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται
  choice: Mempertahankan bacaan sulit “Bumi dan segala perbuatan yang ada di dalamnya akan didapati” dalam teks utama.
  alternative: “akan disingkapkan” atau, menurut varian naskah, “akan hangus terbakar”
  rationale: Teks SBLGNT yang diberikan memuat εὑρεθήσεται, yang secara langsung berarti “akan didapati”. Karena makna klausa dan bentuk teksnya diperdebatkan, terjemahan utama tidak menghaluskan ketegangan tersebut.
- issue: Acuan στοιχεῖα
  choice: unsur-unsur
  alternative: benda-benda langit atau komponen-komponen dasar alam semesta
  rationale: Konteks tidak menentukan dengan pasti acuan khusus istilah ini; terjemahan yang luas mencegah penafsiran tertentu dimasukkan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Struktur kalimat dibagi agar hubungan waktunya jelas. Istilah yang secara leksikal atau tekstual ambigu dipertahankan dalam teks utama dan dijelaskan melalui catatan kaki.
