  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/014.yaml
  text: Therefore[a], beloved, since you are waiting for these things, make every effort to be found by him spotless and blameless in peace.
translation:
  language: id
  text: Karena itu, Saudara-saudara terkasih, sementara menantikan semuanya itu, berusahalah sungguh-sungguh agar kalian didapati oleh-Nya tak bernoda dan tak bercela, dalam damai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “agar kalian didapati tak bernoda dan tak bercela, dalam damai di hadapan-Nya.” Bentuk datif Yunani dapat dipahami sebagai menyatakan pelaku (“oleh-Nya”) atau rujukan/kehadiran (“di hadapan-Nya”).'
    reason: alternative_reading
lexical_decisions:
- source_word: Διό
  choice: Karena itu
  rationale: Kata penghubung ini menarik kesimpulan dari pembahasan sebelumnya tentang hari Tuhan serta langit dan bumi yang baru.
- source_word: ἀγαπητοί
  choice: Saudara-saudara yang terkasih
  rationale: Sapaan jamak yang hangat dan bermartabat; bentuk ini wajar dalam surat dan tidak membatasi sapaan hanya kepada laki-laki.
- source_word: ταῦτα προσδοκῶντες
  choice: sementara menantikan semuanya itu
  rationale: Menunjukkan penantian yang sedang berlangsung terhadap kenyataan eskatologis yang baru disebutkan, tanpa mempersempit acuannya.
- source_word: σπουδάσατε
  choice: berusahalah sungguh-sungguh
  rationale: Menyampaikan perintah untuk mengerahkan upaya dengan tekun dan serius dalam bahasa Indonesia masa kini.
- source_word: ἄσπιλοι
  choice: tak bernoda
  rationale: Mempertahankan gambaran tentang kemurnian moral.
- source_word: ἀμώμητοι
  choice: tak bercela
  rationale: Menyatakan integritas yang tidak memberi dasar bagi celaan, seraya tetap dibedakan dari metafora 'tak bernoda'.
- source_word: αὐτῷ εὑρεθῆναι
  choice: Dia mendapati kalian
  rationale: Mengungkapkan secara alami kemungkinan datif pelaku, yakni 'didapati oleh-Nya', sambil mempertahankan pronomina tanpa menambahkan identitas yang tidak disebut ulang dalam ayat ini.
- source_word: ἐν εἰρήνῃ
  choice: hidup dalam damai
  rationale: Menjadikan keadaan yang dimaksud jelas dan alami dalam bahasa Indonesia, tetapi tidak menentukan apakah damai itu terutama bersifat batiniah, relasional, atau komunal.
theological_decisions:
- issue: Fungsi αὐτῷ dalam konteks penghakiman eskatologis
  choice: Dia mendapati kalian
  alternative: kalian didapati tak bernoda dan tak bercela di hadapan-Nya
  rationale: Datif Yunani dapat dipahami sebagai pelaku ('oleh-Nya') atau sebagai rujukan/kehadiran ('di hadapan-Nya'). Teks utama memakai pembacaan pelaku yang alami, sedangkan ambiguitas aslinya dipertahankan dalam catatan kaki.
- issue: Cakupan ἐν εἰρήνῃ
  choice: hidup dalam damai
  alternative: dalam damai dengan-Nya
  rationale: Bahasa Yunani tidak secara eksplisit menyebut pihak dengan siapa damai itu berlaku. Terjemahan tidak menambahkan 'dengan-Nya' agar kemungkinan maknanya tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, hangat, dan bermartabat. Sapaan 'Saudara-saudara yang terkasih' mempertahankan nuansa surat. Susunan predikat dibuat alami bagi pembaca umum, dan penanda catatan kaki ditempatkan dalam teks utama.
