  terminology: '''Tak bernoda'' dan ''tak bercela'' mempertahankan dua istilah Yunani yang berdekatan tetapi tidak identik. ''Dalam damai'' mempertahankan keluasan makna tanpa menambahkan pihak tertentu atau verba ''hidup''. Pronomina ''Dia/-Nya'' mempertahankan referen yang tersirat tanpa menamainya.'
