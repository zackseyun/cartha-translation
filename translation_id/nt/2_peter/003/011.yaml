  text: Τούτων ⸀οὕτως πάντων λυομένων ποταποὺς δεῖ ὑπάρχειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/011.yaml
  text: Since all these things are being dissolved in this way[a], what sort of people ought you to be in holy conduct and godliness[b],
translation:
  language: id
  text: Karena semua ini sedang terurai demikian[a], kamu seharusnya menjadi orang seperti apa dalam perilaku kudus dan kesalehan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sedang dileraikan”; kata Yunani secara lebih harfiah berbicara tentang semua ini yang dilepaskan atau diuraikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων ... πάντων
  choice: semua ini
  rationale: Frasa genitif ini menunjuk kembali kepada seluruh tatanan ciptaan yang dibicarakan dalam konteks dekat. Bahasa Indonesia tidak perlu menambahkan kata “hal-hal” agar acuannya jelas.
- source_word: οὕτως
  choice: dengan cara demikian
  rationale: Ungkapan ini mempertahankan fungsi adverbial yang menerangkan cara terurainya semua itu.
- source_word: λυομένων
  choice: sedang terurai
  rationale: Partisipel kini pasif dari λύω menggambarkan pelepasan atau penguraian tatanan yang ada. “Sedang terurai” mempertahankan aspek progresif dan tidak memperkuatnya menjadi “dihancurkan” tanpa alasan leksikal.
- source_word: ποταποὺς
  choice: orang seperti apakah
  rationale: Dalam pertanyaan retoris ini, ποταπός menanyakan sifat atau mutu orang yang seharusnya menjadi ciri para pembaca.
- source_word: δεῖ
  choice: seharusnya
  rationale: Pilihan ini menyampaikan keharusan moral dalam konteks nasihat tanpa membuat nadanya lebih keras daripada yang dituntut teks.
- source_word: ὑπάρχειν
  choice: kamu
  rationale: Dalam konstruksi δεῖ ὑπάρχειν ὑμᾶς, verba ini secara idiomatis menyatakan keadaan atau jati diri para pembaca; dalam bahasa Indonesia maknanya terwakili secara alami oleh konstruksi “orang seperti apakah seharusnya kamu” tanpa menerjemahkan ὑπάρχειν secara kaku sebagai “berada” atau “eksis”.
- source_word: ἐν ἁγίαις ἀναστροφαῖς
  choice: dalam perilaku yang kudus
  rationale: ἀναστροφή menunjuk pada perilaku atau cara hidup. Bentuk jamak Yunani wajar dinyatakan dengan nomina kolektif tunggal dalam bahasa Indonesia.
- source_word: εὐσεβείαις
  choice: kesalehan
  rationale: εὐσέβεια menunjuk pada sikap hormat dan bakti kepada Allah yang diwujudkan dalam kehidupan. “Kesalehan” merupakan padanan Indonesia yang ringkas dan lazim.
theological_decisions:
- issue: Gambaran eskatologis tentang nasib tatanan dunia sekarang
  choice: sedang terurai
  alternative: sedang dihancurkan; akan terurai
  rationale: Kata Yunani itu sendiri menggambarkan pelepasan atau penguraian. Konteksnya memang eskatologis, tetapi terjemahan tidak perlu meningkatkan maknanya menjadi penghancuran total ataupun mengubah bentuk kini menjadi bentuk masa depan.
- issue: Daya retoris ποταποὺς
  choice: mempertahankan bentuk pertanyaan tentang seperti apa para pembaca seharusnya
  alternative: betapa kudus dan salehnya kamu harus hidup!
  rationale: Bentuk pertanyaan menjaga struktur dan tekanan etis teks Yunani, sedangkan bentuk seruan merupakan pengungkapan yang lebih interpretatif.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan cukup dekat dengan susunan retoris Yunani. Frasa “orang seperti apakah seharusnya kamu” sengaja mempertahankan pertanyaan tentang watak dan kualitas hidup, meskipun lebih formal daripada ungkapan percakapan sehari-hari.
