  text: through which the world of that time[a], having been flooded with water[b], perished.
translation:
  language: id
  text: Melalui semuanya itu, dunia pada waktu itu, setelah dilanda air bah, binasa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι’ ὧν
  choice: Melalui semuanya itu
  rationale: διά dengan genitif menyatakan sarana, sedangkan pronomina relatif jamak merujuk secara terbuka kepada hal-hal yang disebut pada ayat sebelumnya. Ungkapan ini mempertahankan bentuk jamak tanpa mempersempit acuannya.
- source_word: ὁ τότε κόσμος
  choice: dunia pada waktu itu
  rationale: κόσμος menunjuk kepada tatanan dunia yang ada pada masa tersebut, dan τότε menegaskan kontras waktu dengan dunia yang sekarang dalam konteks berikutnya.
- source_word: ὕδατι
  choice: air bah
  rationale: Dativus ὕδατι menyatakan sarana yang meliputi dunia. Dalam bahasa Indonesia, penggabungannya dengan verba κατακλύζω sebagai 'diliputi air bah' menyampaikan banjir besar secara alami tanpa pengulangan janggal.
- source_word: κατακλυσθεὶς
  choice: diliputi
  rationale: Partisip aoristus pasif ini berarti ditenggelamkan atau dilanda banjir. 'Diliputi air bah' mempertahankan keadaan pasif dan hubungan yang mendahului verba utama secara alami.
- source_word: ἀπώλετο
  choice: binasa
  rationale: Bentuk medio/intransitif ini dapat berarti binasa atau mengalami kehancuran. 'Binasa' mempertahankan daya intransitif dan beratnya penghakiman tanpa menyatakan pemusnahan metafisik.
theological_decisions:
- issue: Sifat penghukuman melalui air bah
  choice: binasa
  alternative: dihancurkan
  rationale: Verba Yunani menyatakan kebinasaan dunia pada zaman itu, tetapi tidak mengharuskan pengertian pemusnahan mutlak. 'Binasa' mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan partisip Yunani dialihkan menjadi rangkaian alami 'diliputi ... lalu binasa'. Tidak ada penanda catatan kaki karena alternatif utama dijelaskan dalam data keputusan dan teks Indonesia tidak memerlukan catatan publik untuk dipahami.
