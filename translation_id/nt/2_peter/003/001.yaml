id: 2PE.3.1
reference: 2 Peter 3:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/001.yaml
  text: Beloved[a], this is now the second letter I am writing to you; in both of them I am stirring up your sincere mind by way of reminder[b],
translation:
  language: id
  text: Saudara-saudara yang terkasih, sekarang saya menulis surat yang kedua ini kepada kalian. Dalam kedua surat itu[a], saya menggugah pikiran kalian yang tulus[b] dengan mengingatkan kalian,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di dalam keduanya”; bentuk Yunani jamak paling wajar merujuk kepada kedua surat tersebut.
    reason: clarification
  - marker: b
    text: Atau “pikiran kalian yang murni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Saudara-saudara yang terkasih
  rationale: Sapaan jamak ini menyampaikan kasih yang terkandung dalam ἀγαπητοί dengan bentuk sapaan yang wajar, hangat, dan bermartabat dalam bahasa Indonesia.
- source_word: Ταύτην ἤδη ... δευτέραν ... ἐπιστολήν
  choice: sekarang saya menulis surat yang kedua ini
  rationale: Susunan Yunani ditata ulang agar alami dalam bahasa Indonesia, sambil mempertahankan penekanan bahwa surat yang sedang ditulis ini adalah surat kedua kepada para penerima.
- source_word: γράφω
  choice: saya menulis
  rationale: Bentuk kini dalam konteks penulisan surat diterjemahkan secara alami sebagai tindakan yang sedang dilakukan penulis.
- source_word: ἐν αἷς
  choice: Dalam kedua surat itu
  rationale: Kata ganti relatif Yunani berbentuk jamak feminin dan paling wajar merujuk kepada kedua surat yang disebutkan.
- source_word: διεγείρω
  choice: saya menggugah
  rationale: Kata kerja ini menggambarkan tindakan membangunkan atau menggerakkan kembali perhatian; 'menggugah' mempertahankan daya metaforisnya secara alami.
- source_word: ἐν ὑπομνήσει
  choice: dengan mengingatkan kalian
  rationale: Frasa ini menyatakan sarana atau cara. Bentuk verbal ini lebih lancar dalam bahasa Indonesia daripada terjemahan harfiah yang nominal.
- source_word: εἰλικρινῆ διάνοιαν
  choice: pikiran kalian yang tulus
  rationale: διάνοια menunjuk pada pikiran atau cara berpikir, sedangkan εἰλικρινής dapat menyatakan ketulusan atau kemurnian. 'Tulus' mempertahankan dimensi integritas tanpa mempersempitnya hanya pada kemurnian moral.
theological_decisions:
- issue: Rujukan bentuk jamak ἐν αἷς
  choice: Merujuk kepada kedua surat yang ditulis kepada para penerima
  alternative: Menganggapnya hanya merujuk kepada surat yang sekarang melalui pemakaian bentuk jamak yang longgar
  rationale: Secara gramatikal, bentuk jamak paling langsung merujuk kepada dua surat. Terjemahan menjadikannya jelas tanpa menarik kesimpulan tambahan mengenai identitas atau status surat sebelumnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat yang hangat dan bermartabat. 'Kalian' dipakai untuk memperjelas bahwa semua kata ganti orang kedua dalam ayat ini berbentuk jamak. Tanda koma akhir dipertahankan karena kalimat berlanjut ke ayat berikutnya.
