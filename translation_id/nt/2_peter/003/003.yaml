  text: τοῦτο πρῶτον γινώσκοντες ὅτι ἐλεύσονται ἐπ’ ⸀ἐσχάτων τῶν ἡμερῶν ⸂ἐν ἐμπαιγμονῇ⸃ ἐμπαῖκται κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν πορευόμενοι
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/003.yaml
  text: 'knowing this first: that in the last days scoffers will come with scoffing[a], walking according to their own desires[b],'
translation:
  language: id
  text: Pertama-tama, ketahuilah bahwa pada hari-hari terakhir para pengejek akan datang dengan ejekan[a] dan hidup menurut keinginan mereka sendiri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “para pengejek akan datang sambil mengejek.” Bahasa Yunani memakai dua kata serumpun, “ejekan” dan “pengejek,” untuk memberi penekanan.
    reason: lexical_alternative
  - marker: b
    text: “Keinginan” juga dapat diterjemahkan “hawa nafsu”; kata Yunani ini dapat berarti berbagai hasrat kuat, bukan hanya hasrat seksual.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: Pertama-tama, ketahuilah
  rationale: Ungkapan ini menyampaikan prioritas πρῶτον dan daya pragmatis partisip γινώσκοντες secara alami dalam bahasa Indonesia. Bentuk ajakan/perintah sesuai dengan konteks sapaan kepada para pembaca, tanpa mengubah isi proposisionalnya.
- source_word: ἐλεύσονται
  choice: akan datang
  rationale: Padanan langsung dan alami bagi bentuk futur ἔρχομαι.
- source_word: ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: pada hari-hari terakhir
  rationale: Padanan eskatologis yang lazim dan alami, tanpa menentukan suatu skema akhir zaman tertentu.
- source_word: ἐν ἐμπαιγμονῇ ἐμπαῖκται
  choice: para pengejek yang mengejek
  rationale: Mempertahankan penegasan melalui kata-kata serumpun dalam bahasa Yunani, sambil tetap terdengar wajar dalam bahasa Indonesia.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν
  choice: mengikuti keinginan mereka sendiri
  rationale: Kata 'keinginan' mempertahankan cakupan luas ἐπιθυμία dan tidak mempersempitnya menjadi hasrat seksual saja; 'mereka sendiri' mempertahankan penekanan kepemilikan.
- source_word: πορευόμενοι
  choice: hidup
  rationale: Dalam konteks ini partisip tersebut menggambarkan cara hidup atau perilaku. 'Hidup' menyampaikan metafora berjalan secara alami bagi pembaca Indonesia modern.
theological_decisions:
- issue: Makna eskatologis ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: pada hari-hari terakhir
  alternative: pada akhir zaman
  rationale: Pilihan ini mempertahankan bentuk jamak dan cakupan ungkapan sumber tanpa mempersempitnya menjadi satu titik waktu atau memasukkan sistem eskatologi tertentu.
- issue: Cakupan moral ἐπιθυμίαι
  choice: keinginan
  alternative: hawa nafsu
  rationale: Konteks memberi nuansa moral negatif, tetapi istilah Yunani dapat menunjuk pada berbagai hasrat kuat. 'Keinginan' menjaga keluasan makna tersebut, sedangkan catatan kaki menjelaskan alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pengulangan 'pengejek yang mengejek' sengaja dipertahankan untuk mencerminkan penekanan leksikal teks Yunani; metafora 'berjalan' dialihkan menjadi 'hidup' agar makna perilaku terasa alami.
