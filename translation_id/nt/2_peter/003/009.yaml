  text: οὐ βραδύνει ⸀κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ⸀ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/009.yaml
  text: The Lord is not slow concerning the promise[a], as some consider slowness, but is patient toward you[c][b], not wanting any to perish but all to come to repentance.
translation:
  language: id
  text: Tuhan tidak lambat menepati janji-Nya[a], sebagaimana sebagian orang menganggapnya sebagai kelambatan, melainkan Ia sabar terhadap kamu[b][c], karena Ia tidak menghendaki seorang pun binasa, melainkan semua orang sampai pada pertobatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Tuhan tidak lambat berkenaan dengan janji itu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Ia bersabar terhadap kamu.”'
    reason: lexical_alternative
  - marker: c
    text: Cakupan “seorang pun” dan “semua orang” dibiarkan sebagaimana dinyatakan dalam bahasa Yunani. Para penafsir berbeda pendapat apakah Petrus secara khusus merujuk kepada para pembacanya atau secara lebih luas kepada seluruh umat manusia.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: Tuhan
  rationale: Padanan baku dan alami untuk gelar ilahi κύριος dalam bahasa Indonesia; konteks menentukan rujukannya tanpa perlu diperjelas secara denominatif.
- source_word: οὐ βραδύνει ... τῆς ἐπαγγελίας
  choice: tidak lambat menepati janji-Nya
  rationale: Bahasa Indonesia memerlukan pelengkap yang alami untuk menyatakan kelambatan sehubungan dengan janji. 'Menepati' mengungkapkan relasi yang tersirat oleh konstruksi genitif tanpa mengubah pokok janji menjadi objek lain.
- source_word: ὥς τινες βραδύτητα ἡγοῦνται
  choice: seperti yang dianggap sebagian orang sebagai kelambatan
  rationale: Mempertahankan pengulangan gagasan βραδύνει/βραδύτητα dan arti ἡγέομαι sebagai 'menganggap', dengan susunan yang dapat dipahami dalam bahasa Indonesia modern.
- source_word: μακροθυμεῖ
  choice: Ia sabar
  rationale: Mengungkapkan kesabaran dan penahanan diri dalam jangka waktu panjang secara alami dan bermartabat.
- source_word: εἰς ὑμᾶς
  choice: terhadap kamu
  rationale: Mempertahankan arah sikap yang dinyatakan εἰς. Bentuk 'kamu' tidak menentukan sendiri apakah penerimanya dipahami secara individual atau kolektif.
- source_word: μὴ βουλόμενός
  choice: Ia tidak menghendaki
  rationale: Mengungkapkan unsur kehendak atau keinginan dalam βούλομαι tanpa memakai istilah teknis tentang ketetapan ilahi.
- source_word: τινας ἀπολέσθαι
  choice: seorang pun binasa
  rationale: Padanan Indonesia yang idiomatis untuk konstruksi negatif dengan τινας; 'binasa' mempertahankan bobot ἀπόλλυμι tanpa menjadikannya secara eksplisit pasif-kausatif.
- source_word: πάντας
  choice: semua orang
  rationale: Dalam bahasa Indonesia, bentuk ini melengkapi paralel antitesis dengan 'seorang pun' secara jelas, sambil tidak menetapkan batas rujukannya.
- source_word: εἰς μετάνοιαν χωρῆσαι
  choice: sampai pada pertobatan
  rationale: χωρέω dengan εἰς menyatakan masuk atau mencapai suatu keadaan. 'Sampai pada pertobatan' mempertahankan nuansa gerak menuju keadaan itu dan menerjemahkan μετάνοια dengan istilah Indonesia yang baku.
theological_decisions:
- issue: Cakupan 'kamu', 'seorang pun', dan 'semua orang' dalam kaitannya dengan kesabaran Tuhan dan keselamatan
  choice: 'Membiarkan cakupan tetap sebagaimana dinyatakan teks: ''terhadap kamu ... seorang pun ... semua orang''.'
  alternative: Membatasi 'seorang pun' dan 'semua orang' hanya kepada umat pilihan, atau memperjelasnya sebagai seluruh umat manusia.
  rationale: Bahasa Yunani tidak menambahkan pembatasan atau perluasan teologis yang eksplisit. Terjemahan mempertahankan ketegangan itu, sedangkan catatan menjelaskan adanya perbedaan penafsiran.
- issue: Daya makna βουλόμενος mengenai kehendak Tuhan
  choice: Ia tidak menghendaki
  alternative: Ia tidak menetapkan; Ia tidak bermaksud; Ia tidak ingin
  rationale: '''Menghendaki'' menjaga unsur volisional βούλομαι tanpa mengklasifikasikannya sebagai jenis kehendak ilahi tertentu menurut sistem teologi kemudian.'
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Kalimat Yunani dibagi menjadi dua kalimat agar alurnya jelas tanpa mengubah hubungan logisnya. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan ortografi religius Indonesia. Penanda catatan kaki semuanya hadir dalam teks utama.
