id: 2PE.3.18
reference: 2 Peter 3:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ⸀ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/018.yaml
  text: But grow in the grace and knowledge of our Lord and Savior Jesus the Messiah[a]. To him be the glory both now and to the day of eternity[b]. Amen.
translation:
  language: id
  text: Namun, bertumbuhlah dalam anugerah dan pengenalan akan Tuhan dan Juruselamat kita, Yesus Sang Mesias.[a] Bagi-Nyalah kemuliaan, baik sekarang maupun sampai hari kekekalan.[b] Amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut penggunaan tradisional, “Yesus Kristus.”
    reason: alternative_reading
  - marker: b
    text: Atau “sekarang dan selama-lamanya.” Secara lebih harfiah, bahasa Yunani berbunyi “sekarang dan sampai hari kekekalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐξάνετε
  choice: bertumbuhlah
  rationale: Imperatif aktif kini orang kedua jamak; bentuk ini alami dalam bahasa Indonesia dan dapat menyampaikan pertumbuhan yang terus berlangsung tanpa menambah kata penjelas.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang bernuansa kontras terhadap peringatan sebelumnya; 'Namun' sesuai dengan register modern yang bermartabat.
- source_word: ἐν χάριτι καὶ γνώσει
  choice: dalam anugerah dan pengenalan
  rationale: Satu preposisi menaungi kedua nomina. 'Dalam' mempertahankan gambaran lingkup pertumbuhan; 'pengenalan' wajar untuk pengetahuan relasional tentang seseorang.
- source_word: χάριτι
  choice: anugerah
  rationale: Padanan teologis yang mapan dan alami untuk χάρις dalam konteks ini.
- source_word: γνώσει
  choice: pengenalan
  rationale: Konteks genitif yang merujuk kepada Yesus mendukung pengetahuan relasional; 'pengenalan akan' lebih alami daripada 'pengetahuan tentang' tanpa meniadakan unsur mengetahui.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: akan Tuhan dan Juruselamat kita, Yesus Sang Mesias
  rationale: Artikel tunggal yang menaungi κύριος dan σωτήρ menunjukkan satu pribadi sebagai pemilik kedua gelar. Koma memperjelas aposisi, dan Χριστός diterjemahkan sebagai gelar 'Sang Mesias'.
- source_word: αὐτῷ ἡ δόξα
  choice: Bagi Dialah kemuliaan
  rationale: Mencerminkan atribusi doksologis dengan verba yang tersirat dan terdengar wajar serta khidmat dalam bahasa Indonesia.
- source_word: καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος
  choice: baik sekarang maupun sampai hari kekekalan
  rationale: '''Baik ... maupun ...'' mencerminkan korelasi καὶ ... καὶ; ''hari kekekalan'' mempertahankan unsur ἡμέραν dan keunikan ungkapan Yunani, alih-alih meratakannya menjadi sekadar ''selamanya''.'
- source_word: ἀμήν
  choice: Amin
  rationale: Transliterasi konvensional dalam bahasa Indonesia untuk penutup doksologi.
theological_decisions:
- issue: Penerjemahan Χριστοῦ dalam Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: Χριστός tetap membawa daya sebagai gelar dalam pengakuan kristologis dan doksologi ini. 'Sang Mesias' menerjemahkan maknanya secara idiomatis; bentuk tradisional dicatat sebagai alternatif.
- issue: Rujukan gelar 'Tuhan dan Juruselamat kita'
  choice: Kedua gelar merujuk kepada satu pribadi, yaitu Yesus Sang Mesias
  alternative: Susunan yang dibiarkan kurang eksplisit dapat tampak seolah-olah merujuk kepada dua pihak
  rationale: Konstruksi Yunani dengan satu artikel untuk κύριος dan σωτήρ secara kuat menunjukkan satu rujukan. Teks Indonesia memperjelas aposisi tanpa menambahkan klaim di luar tata bahasa.
- issue: Ungkapan εἰς ἡμέραν αἰῶνος
  choice: sampai hari kekekalan
  alternative: selama-lamanya
  rationale: Ungkapan Yunani tidak lazim dan secara harfiah memuat kata 'hari'. Terjemahan utama mempertahankan ketegangan ungkapan tersebut, sementara padanan idiomatis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. 'Namun' memberi hubungan wacana yang jelas; 'bertumbuhlah' mempertahankan bentuk perintah jamak yang dalam bahasa Indonesia tidak perlu ditandai secara morfologis. Kapitalisasi pronomina ilahi mengikuti konvensi register Alkitab Indonesia.
