  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/012.yaml
  text: as you wait for and hasten the coming of the day of God[a], because of which the heavens, being set on fire, will be dissolved, and the elements, burning[b], will melt.
translation:
  language: id
  text: Sambil menantikan dan mempercepat kedatangan hari Allah[a], yang olehnya langit, yang terbakar, akan terurai, dan unsur-unsur yang terbakar[b] akan meleleh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sambil menantikan dan dengan sungguh-sungguh mengharapkan kedatangan hari Allah.” Kata Yunani yang diterjemahkan “mempercepat” juga dapat berarti “sangat merindukan” atau “menantikan dengan sungguh-sungguh.”
    reason: alternative_reading
  - marker: b
    text: “Unsur-unsur” dapat menunjuk pada komponen-komponen dasar kosmos, atau mungkin benda-benda langit.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδοκῶντας
  choice: menantikan
  rationale: Partisipel ini meneruskan nasihat ayat sebelumnya dan menyatakan penantian yang penuh harap.
- source_word: σπεύδοντας
  choice: mempercepat
  rationale: Dengan παρουσίαν sebagai objek langsung, arti kausatif 'mempercepat kedatangan' paling lugas secara gramatikal; kemungkinan arti 'sangat merindukan' dipertahankan dalam catatan kaki.
- source_word: παρουσίαν
  choice: kedatangan
  rationale: Dalam konteks eskatologis, 'kedatangan' alami dalam bahasa Indonesia dan mencakup gagasan tibanya kehadiran.
- source_word: τῆς τοῦ θεοῦ ἡμέρας
  choice: hari Allah
  rationale: Mempertahankan ungkapan Yunani yang tidak lazim dan membedakannya dari ungkapan 'hari Tuhan'.
- source_word: δι’ ἣν
  choice: Oleh karena hari itu
  rationale: διά dengan akusatif menyatakan sebab; anteseden eksplisit dipakai agar kalimat Indonesia jelas.
- source_word: οὐρανοὶ
  choice: langit
  rationale: Bahasa Indonesia lazim memakai bentuk tak bertanda jumlah untuk cakrawala kosmis; konteks tetap menyampaikan cakupan luas bentuk jamak Yunani.
- source_word: πυρούμενοι
  choice: akan terbakar
  rationale: Menyampaikan bahwa langit mengalami pembakaran serta menyesuaikan hubungan waktunya dengan verba futurum utama.
- source_word: λυθήσονται
  choice: terurai
  rationale: Menyatakan sesuatu yang dilepaskan atau tercerai menjadi bagian-bagiannya tanpa memaksakan gagasan pemusnahan mutlak.
- source_word: στοιχεῖα
  choice: unsur-unsur dunia
  rationale: '''Unsur-unsur'' mempertahankan keluasan istilah, sedangkan ''dunia'' memperjelas konteks kosmis tanpa menetapkan bahwa yang dimaksud pasti benda-benda langit.'
- source_word: καυσούμενα
  choice: dalam panas yang membakar
  rationale: Mengungkapkan proses terbakar oleh panas secara alami dan menghindari rangkaian partisipel yang kaku dalam bahasa Indonesia.
- source_word: τήκεται
  choice: akan meleleh
  rationale: Mengikuti makna meleleh akibat panas dan menyelaraskan bentuk Indonesia dengan orientasi futurum dari klausa tersebut.
theological_decisions:
- issue: Makna σπεύδοντας τὴν παρουσίαν
  choice: mempercepat kedatangan
  alternative: sangat merindukan kedatangan
  rationale: Konstruksi dengan objek langsung mendukung arti 'mempercepat', tetapi verba ini juga dapat menyatakan kerinduan atau penantian yang sungguh-sungguh. Alternatif dicatat agar ketegangan teologis tidak dihilangkan.
- issue: Rujukan στοιχεῖα
  choice: unsur-unsur dunia
  alternative: benda-benda langit
  rationale: Istilah ini dapat menunjuk pada komponen dasar kosmos atau mungkin benda-benda langit. Terjemahan utama sengaja tetap luas dan tidak memaksakan suatu kosmologi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan struktur yang mudah dipahami. Ungkapan 'hari Allah' dipertahankan secara formal, sedangkan ambiguitas utama pada σπεύδοντας dan στοιχεῖα dijaga melalui catatan kaki.
