  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν πάσαις ⸀ταῖς ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν ⸀αἷς ἐστιν δυσνόητά τινα, ἃ οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/016.yaml
  text: as also in all his letters[a], speaking in them about these things. In them are some things hard to understand, which the ignorant and unstable twist, as they do the rest of the Scriptures[c][b], to their own destruction.
translation:
  language: id
  text: Seperti juga dalam semua suratnya, ia membicarakan hal-hal ini. Dalam surat-surat itu ada beberapa hal yang sulit dipahami, yang diputarbalikkan[c] oleh orang-orang yang kurang pengetahuan[b] dan tidak teguh, seperti yang mereka lakukan juga terhadap Kitab Suci lainnya[a], menuju kebinasaan mereka sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Kitab Suci selebihnya”. Kata Yunani yang dipakai dapat berarti “yang lain” atau “yang selebihnya”.
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak terdidik” atau “tidak diajar”.
    reason: lexical_alternative
  - marker: c
    text: Atau “disimpangkan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολαῖς
  choice: surat
  rationale: Istilah modern dan wajar untuk surat-surat Paulus, tanpa memakai bentuk gerejawi yang kurang umum seperti 'epistel'.
- source_word: λαλῶν
  choice: membicarakan
  rationale: Secara harfiah berarti 'berbicara', tetapi dalam konteks isi surat, 'membicarakan' menyampaikan tindakan komunikatifnya secara alami tanpa mengubahnya menjadi sekadar 'menulis'.
- source_word: περὶ τούτων
  choice: hal-hal ini
  rationale: Mempertahankan rujukan demonstratif kepada pokok-pokok yang baru disebutkan dalam konteks.
- source_word: δυσνόητά τινα
  choice: beberapa hal yang sulit dipahami
  rationale: Mencerminkan unsur tak tentu τινα dan arti δυσνόητα dengan ungkapan Indonesia yang jelas dan alami.
- source_word: ἀμαθεῖς
  choice: orang-orang yang tidak berpengetahuan
  rationale: Menyatakan kurangnya pengetahuan atau pengajaran tanpa menyiratkan bahwa mereka buta huruf; alternatif 'tidak terdidik' dicatat dalam catatan kaki.
- source_word: ἀστήρικτοι
  choice: tidak teguh
  rationale: Menggambarkan orang yang tidak memiliki keteguhan atau landasan yang mantap, sesuai pemakaian Perjanjian Baru.
- source_word: στρεβλοῦσιν
  choice: diputarbalikkan
  rationale: Menjaga gambaran sesuatu yang dibengkokkan dari bentuk atau maksudnya dan merupakan ungkapan Indonesia yang lazim.
- source_word: τὰς λοιπὰς γραφὰς
  choice: bagian-bagian lain dari Kitab Suci
  rationale: γραφαί dalam konteks ini menunjuk pada tulisan-tulisan suci, sedangkan λοιπάς membandingkan surat-surat tersebut dengan Kitab Suci lainnya. Kata 'bagian-bagian' membuat frasa Indonesia lebih alami tanpa mereduksi Kitab Suci menjadi tulisan biasa.
- source_word: ἀπώλειαν
  choice: kebinasaan
  rationale: Menyampaikan akibat berat dari ἀπώλεια dengan istilah Alkitabiah yang tetap dipahami luas, tanpa menentukan rincian teologis yang tidak dinyatakan ayat.
theological_decisions:
- issue: Implikasi status Kitab Suci dalam τὰς λοιπὰς γραφὰς
  choice: bagian-bagian lain dari Kitab Suci
  alternative: tulisan-tulisan lainnya
  rationale: Dalam Perjanjian Baru, bentuk jamak γραφαί lazimnya merujuk kepada Kitab Suci, dan λοιπάς secara alami menempatkan surat-surat Paulus dalam perbandingan dengan tulisan-tulisan suci lainnya. Terjemahan mempertahankan implikasi ini tanpa menambahkan rumusan doktrinal di luar teks.
- issue: Arah akibat dalam πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν
  choice: sehingga mendatangkan kebinasaan atas diri mereka sendiri
  alternative: menuju kebinasaan mereka sendiri
  rationale: Ungkapan ini menyatakan hasil yang menimpa para pemutarbalik teks. Terjemahan tidak merinci sifat atau waktu kebinasaan itu, sehingga ketegangan teologis sumber tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur kalimat dibagi untuk menghindari kalimat yang terlalu panjang. Pronomina 'ia' mengikuti konteks yang menunjuk kepada Paulus, sedangkan 'mereka' memperjelas subjek οἱ ἀμαθεῖς καὶ ἀστήρικτοι. Semua penanda catatan kaki ditempatkan langsung sesudah ungkapan terkait.
