  text: ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ⸀ἁμαρτημάτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/009.yaml
  text: For whoever lacks these things is blind[a], being shortsighted[b], having forgotten the cleansing of his former sins.
translation:
  language: id
  text: Sebab, orang yang tidak memiliki hal-hal itu buta dan rabun[a], serta telah melupakan pembersihan dari dosa-dosanya yang dahulu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berpandangan dekat” atau “hanya melihat yang dekat.” Kata Yunaninya dapat berarti rabun atau melihat hanya apa yang dekat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: orang yang
  rationale: Pronomina relatif datif ini menunjuk secara umum kepada siapa pun yang tidak memiliki sifat-sifat tersebut. “Orang yang” alami dalam bahasa Indonesia dan tidak membatasi rujukan pada laki-laki.
- source_word: μὴ πάρεστιν ταῦτα
  choice: tidak memiliki semuanya itu
  rationale: Ungkapan ini menyatakan bahwa hal-hal yang baru disebut tidak ada pada orang tersebut. “Semuanya itu” dengan jelas menunjuk kembali kepada sifat-sifat dalam ayat sebelumnya tanpa memasukkan kata “sifat” ke dalam teks utama.
- source_word: τυφλός ἐστιν μυωπάζων
  choice: buta dan rabun
  rationale: “Buta” mempertahankan metafora utama, sedangkan “rabun” menyampaikan μυωπάζων secara ringkas. Hubungan tepat antara kedua gambaran itu tidak dipastikan lebih jauh.
- source_word: λήθην λαβὼν
  choice: karena ia telah melupakan
  rationale: Ungkapan harfiah “telah menerima kelupaan” merupakan idiom yang secara alami berarti telah melupakan. “Karena” menyatakan hubungan penjelas yang wajar dengan keadaan buta dan rabun dalam konteks.
- source_word: τοῦ καθαρισμοῦ
  choice: bahwa dirinya sudah dibersihkan
  rationale: Genitif setelah verba melupakan dapat dialihkan secara alami menjadi klausa isi dalam bahasa Indonesia. Bentuk pasif mempertahankan gagasan pembersihan yang diterima orang itu tanpa menentukan pelakunya secara eksplisit.
- source_word: τῶν πάλαι αὐτοῦ ἁμαρτημάτων
  choice: dari dosa-dosanya yang dahulu
  rationale: “Dosa-dosanya yang dahulu” mempertahankan rujukan tunggal dan unsur waktu πάλαι, serta mengaitkan pembersihan dengan pembebasan dari dosa-dosa tersebut.
theological_decisions:
- issue: Makna pembersihan dari dosa-dosa yang dahulu
  choice: bahwa dirinya sudah dibersihkan dari dosa-dosanya yang dahulu
  alternative: pembersihan dosa-dosanya yang dahulu
  rationale: Terjemahan ini menyatakan tindakan pembersihan yang telah terjadi, tetapi tidak menjelaskan mekanisme, pelaku, atau implikasi soteriologisnya melampaui teks.
- issue: Rujukan gender pada αὐτοῦ
  choice: dirinya ... dosa-dosanya
  alternative: dosa-dosa orang itu
  rationale: Bahasa Indonesia tidak menandai gender pada pronomina ini. Bentuk tunggal tetap dipertahankan tanpa menyiratkan bahwa ayat hanya berbicara tentang laki-laki.
- issue: Hubungan antara τυφλός dan μυωπάζων
  choice: buta dan rabun
  alternative: buta karena hanya dapat melihat yang dekat
  rationale: Teks Yunani menempatkan adjektiva “buta” bersama partisip “rabun/melihat dekat”; terjemahan tidak memaksakan apakah unsur kedua menjelaskan, membatasi, atau menguatkan unsur pertama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang mudah dipahami pembaca umum. Nada tetap bermartabat; metafora penglihatan dan rujukan tunggal dipertahankan.
