source:
  edition: SBLGNT
  text: οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/011.yaml
  text: For in this way entry into the eternal kingdom of our Lord and Savior Jesus the Messiah will be richly provided for you[a][b][c].
translation:
  language: id
  text: Sebab dengan cara demikian, jalan masuk ke dalam kerajaan kekal Tuhan dan Juruselamat kita, Yesus Sang Mesias, akan disediakan dengan berlimpah bagi kalian.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "masuk"; kata Yunani εἴσοδος dapat menunjuk pada tindakan masuk atau jalan masuk.
    reason: lexical_alternative
  - marker: b
    text: 'Terjemahan tradisional: "Yesus Kristus". Di sini gelar Yunani Χριστός diterjemahkan "Sang Mesias" untuk menyampaikan maknanya.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: dengan cara demikian
  rationale: Menunjuk kembali kepada cara hidup yang diuraikan dalam konteks sebelumnya dan mempertahankan daya tunjuk οὕτως.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai bahwa ayat ini memberikan alasan atau penjelasan bagi pernyataan sebelumnya.
- source_word: πλουσίως
  choice: dengan berlimpah
  rationale: Menyampaikan nuansa kelimpahan atau kemurahan tanpa mempersempitnya menjadi gagasan tertentu seperti kemegahan penyambutan.
- source_word: ἐπιχορηγηθήσεται
  choice: akan disediakan
  rationale: Mempertahankan bentuk pasif futurum dan makna menyediakan atau membekali; pelaku tindakan tetap tidak dinyatakan sebagaimana dalam teks Yunani.
- source_word: ὑμῖν
  choice: bagi kalian
  rationale: Menyatakan datif penerima atau keuntungan dan memperjelas bahwa sapaan ditujukan kepada pembaca jamak.
- source_word: ἡ εἴσοδος
  choice: jalan masuk
  rationale: Ungkapan ini dapat menunjuk pada akses maupun tindakan masuk dan terdengar wajar bersama verba 'disediakan'.
- source_word: εἰς τὴν αἰώνιον βασιλείαν
  choice: ke dalam kerajaan kekal
  rationale: Menerjemahkan arah εἰς dan sifat αἰώνιος secara langsung dalam konteks eskatologis.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος
  choice: Tuhan dan Juruselamat kita
  rationale: Menerjemahkan kedua gelar secara baku; konstruksi satu artikel dalam bahasa Yunani menunjukkan bahwa keduanya merujuk kepada pribadi yang sama.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Menyampaikan Χριστός sebagai gelar yang bermakna 'Mesias', bukan sekadar mempertahankan bentuk transliterasinya.
theological_decisions:
- issue: Rujukan frasa 'Tuhan dan Juruselamat kita'
  choice: Kedua gelar merujuk kepada satu pribadi, yaitu Yesus Sang Mesias.
  alternative: Kedua gelar dapat dibaca secara lebih longgar sebagai rujukan yang berbeda.
  rationale: Satu artikel Yunani menaungi dua nomina personal tunggal yang dihubungkan oleh καί, lalu diikuti nama Ἰησοῦ Χριστοῦ; secara gramatikal, satu rujukan sangat kuat.
- issue: Pelaku yang menyediakan jalan masuk
  choice: Pelakunya tidak disebutkan secara eksplisit.
  alternative: Menyebut Allah atau Tuhan secara langsung sebagai pelaku.
  rationale: Bentuk pasif ἐπιχορηγηθήσεται tidak menyatakan pelaku. Terjemahan mempertahankan ketaktersebutsan itu agar tidak menambahkan penafsiran teologis ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'kalian' dipakai untuk menyatakan bentuk jamak ὑμῖν secara jelas. Susunan pasif dipertahankan untuk menjaga fokus teks Yunani pada jalan masuk yang disediakan, sedangkan koma mengapit nama yang menjelaskan siapa 'Tuhan dan Juruselamat kita'.
