  text: knowing that the putting off of my tent is near[c][b][a], just as our Lord Jesus the Messiah made clear to me.
translation:
  language: id
  text: aku tahu bahwa waktu untuk menanggalkan kemahku sudah dekat[a], sebagaimana telah dinyatakan dengan jelas kepadaku oleh Tuhan kita Yesus Sang Mesias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “penanggalan kemahku sudah dekat.” Petrus memakai gambaran menanggalkan tempat tinggal sementara untuk berbicara tentang kematiannya yang akan segera tiba.
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “Yesus Kristus”; Χριστός berarti “Yang Diurapi” atau “Mesias” dan di sini diterjemahkan sebagai gelar.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: karena aku tahu
  rationale: Partisipel ini berkaitan dengan pernyataan sebelumnya. Dalam bahasa Indonesia, klausa “karena aku tahu” menyampaikan hubungan itu secara alami, meski nuansa dasarnya tetap ‘dengan mengetahui’.
- source_word: ταχινή
  choice: sudah dekat
  rationale: Dalam konstruksi predikatif ini, kata tersebut menyatakan bahwa peristiwa itu segera atau dekat waktunya. “Sudah dekat” mempertahankan gambaran kedekatan tanpa memperkuatnya menjadi kepastian waktu yang lebih spesifik.
- source_word: ἀπόθεσις
  choice: saat untuk menanggalkan
  rationale: Nomina ini berarti tindakan menanggalkan atau melepaskan. Ungkapan ini dibuat alami dalam bahasa Indonesia sambil mempertahankan metafora, bukan langsung menggantinya dengan ‘kematian’.
- source_word: σκηνώματός
  choice: kemahku
  rationale: Kata ini menunjuk pada kemah atau tempat tinggal sementara. “Kemahku” mempertahankan gambaran tubuh sebagai tempat tinggal sementara.
- source_word: καθὼς καὶ
  choice: sebagaimana
  rationale: Penghubung ini memperkenalkan kesesuaian dengan apa yang telah dinyatakan Tuhan; “sebagaimana” alami dan bermartabat dalam konteks ini.
- source_word: κύριος
  choice: Tuhan
  rationale: Ini adalah gelar baku bagi Yesus dalam konteks Perjanjian Baru dan sesuai dengan pemakaian bahasa Indonesia.
- source_word: Ἰησοῦς Χριστός
  choice: Yesus Sang Mesias
  rationale: Χριστός dipahami sebagai gelar yang berarti Mesias. “Sang” membuat gelar itu idiomatis dalam bahasa Indonesia, bukan memperlakukannya sebagai nama keluarga.
- source_word: ἐδήλωσέν
  choice: telah dinyatakan dengan jelas
  rationale: Verba ini berarti membuat sesuatu jelas atau memberitahukannya. Bentuk pasif menghasilkan susunan bahasa Indonesia yang alami dan tetap mempertahankan Tuhan Yesus sebagai pelaku.
- source_word: μοι
  choice: kepadaku
  rationale: Diterjemahkan sebagai objek tak langsung yang menunjuk kepada Petrus.
theological_decisions:
- issue: Metafora tentang kematian Petrus yang mendekat
  choice: Mempertahankan gambaran ‘menanggalkan kemahku’.
  alternative: Aku akan segera mati; kepergianku sudah dekat.
  rationale: Teks Yunani tidak menyebut kematian secara langsung, melainkan memakai metafora tubuh sebagai kemah sementara. Terjemahan mempertahankan gambaran dan ketegangan teologis itu.
- issue: Makna Χριστός dalam Ἰησοῦς Χριστός
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: Terjemahan utama menampilkan makna gelar Χριστός, sedangkan bentuk tradisional ‘Kristus’ dicatat sebagai alternatif agar pembaca mengenali padanan yang lazim.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa dibuat alami tanpa menghilangkan metafora kemah. Ayat ini secara sintaksis melanjutkan kalimat sebelumnya, sehingga diawali huruf kecil dan memakai “karena” untuk menunjukkan keterkaitannya.
