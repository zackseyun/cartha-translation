id: 2PE.1.19
reference: 2 Peter 1:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/019.yaml
  text: And we have the prophetic word more certain[a], to which you do well to pay attention as to a lamp shining in a dark place[b], until the day dawns and the morning star rises in your hearts.
translation:
  language: id
  text: Dan kami memiliki firman kenabian yang lebih teguh[a]. Kamu berbuat baik dengan memperhatikannya seperti pelita yang bersinar di tempat yang gelap, sampai hari mulai terang dan bintang timur[b] terbit di dalam hatimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Firman kenabian itu menjadi lebih teguh bagi kita.” Bahasa Yunani dapat dipahami sebagai firman kenabian yang diteguhkan oleh kesaksian para rasul, atau sebagai penekanan pada sifat firman kenabian yang lebih teguh.
    reason: alternative_reading
  - marker: b
    text: “Bintang timur” dapat menggemakan gambaran tentang Mesias; bandingkan Wahyu 22:16.
    reason: cross_reference
lexical_decisions:
- source_word: βεβαιότερον
  choice: semakin teguh
  rationale: Mempertahankan bentuk komparatif dan dapat menyatakan bahwa firman kenabian mendapat peneguhan dalam konteks kesaksian para rasul, tanpa menambahkan gagasan kausatif yang tidak dinyatakan secara eksplisit.
- source_word: προφητικὸν λόγον
  choice: firman kenabian
  rationale: Mencerminkan konstruksi adjektival Yunani secara ringkas dan mempertahankan istilah 'firman' yang wajar dalam ragam Alkitab bahasa Indonesia.
- source_word: ᾧ ... προσέχοντες
  choice: dengan memperhatikannya
  rationale: Menyampaikan tindakan memberi perhatian sungguh-sungguh dengan bahasa Indonesia modern dan alami.
- source_word: λύχνῳ φαίνοντι
  choice: pelita yang bersinar
  rationale: Mempertahankan perumpamaan serta nuansa tindakan yang sedang berlangsung.
- source_word: αὐχμηρῷ τόπῳ
  choice: tempat yang gelap
  rationale: Sesuai dengan citra pelita dan merupakan padanan yang jelas bagi keadaan suram atau muram yang dimaksud.
- source_word: ἡμέρα διαυγάσῃ
  choice: fajar menyingsing
  rationale: Ungkapan Indonesia yang alami untuk datangnya terang hari, seraya mempertahankan metafora.
- source_word: φωσφόρος
  choice: bintang timur
  rationale: Istilah Indonesia yang lazim dalam tradisi Alkitab untuk bintang pagi, tanpa memasukkan identifikasi referennya ke dalam teks utama.
- source_word: ἀνατείλῃ
  choice: terbit
  rationale: Kata yang paling alami bagi gerak tampak sebuah benda langit.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: di dalam hatimu
  rationale: Padanan langsung yang mempertahankan arti 'hati' sebagai batin manusia tanpa penjelasan interpretatif.
theological_decisions:
- issue: Hubungan βεβαιότερον dengan kesaksian para rasul dan firman kenabian
  choice: firman kenabian itu semakin teguh bagi kita
  alternative: kita memiliki firman kenabian yang lebih teguh
  rationale: Susunan Yunani memungkinkan peneguhan firman kenabian oleh pengalaman yang baru disebutkan maupun penekanan pada sifatnya yang lebih pasti. Teks utama mempertahankan komparatif dan konteks peneguhan; catatan kaki menyimpan alternatif yang sungguh mungkin.
- issue: Referen φωσφόρος
  choice: bintang timur, tanpa identifikasi eksplisit
  alternative: rujukan langsung kepada Mesias/Kristus atau gambaran penerangan eskatologis
  rationale: Ayat mempertahankan citra benda langit tanpa menjelaskan referennya. Terjemahan tidak memasukkan kesimpulan teologis yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk orang kedua jamak Yunani diterjemahkan dengan 'kamu' sebagai bentuk yang alami dan tidak memasukkan pembedaan kehormatan. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
