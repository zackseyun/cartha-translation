  to: Dan kami memiliki firman kenabian yang lebih teguh[a]. Kamu berbuat baik dengan memperhatikannya seperti pelita yang bersinar di tempat yang gelap, sampai hari mulai terang dan bintang timur[b] terbit di dalam hatimu.
  rationale: Revisi menghilangkan inferensi tambahan pada pembuka, mengganti komparatif progresif "semakin teguh" dengan "lebih teguh," serta memperbaiki idiom metafora hari yang mulai terang. Catatan a mempertahankan dua kemungkinan hubungan βεβαιότερον tanpa memutuskan salah satunya, dan penanda catatan b kini melekat pada "bintang timur."
