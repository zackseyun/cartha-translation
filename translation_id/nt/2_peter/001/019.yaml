  naturalness: Teks revisi memakai bahasa Indonesia baku dan alami. "Hari mulai terang" menyampaikan metafora ἡμέρα διαυγάσῃ tanpa ungkapan yang kurang tepat seperti "fajar menyingsing" untuk subjek "hari."
