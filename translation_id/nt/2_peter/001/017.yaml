id: 2PE.1.17
reference: 2 Peter 1:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λαβὼν γὰρ παρὰ θεοῦ πατρὸς τιμὴν καὶ δόξαν φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης· ⸂Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν⸃, εἰς ὃν ἐγὼ εὐδόκησα—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/017.yaml
  text: 'For when he received honor and glory from God the Father[a], such a voice was borne to him from the Majestic Glory: “This is my Son, my Beloved[c][b], in whom I am well pleased”—'
translation:
  language: id
  text: 'Sebab ketika Ia menerima kehormatan dan kemuliaan dari Allah Bapa, suara seperti ini disampaikan kepada-Nya oleh Kemuliaan Yang Mahagung[a]: “Inilah Anak-Ku, Yang Kukasihi[b]; kepada-Nyalah Aku berkenan[c]”—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari Kemuliaan Yang Mahagung.” Kata Yunani ὑπό dapat menandai pelaku (“oleh”); dalam konteks suara, terjemahan “dari” menonjolkan sumbernya.
    reason: lexical_alternative
  - marker: b
    text: Atau “Inilah Anak-Ku yang terkasih.” Secara lebih harfiah, bahasa Yunani berbunyi, “Inilah Anak-Ku, Yang Kukasihi.”
    reason: lexical_alternative
  - marker: c
    text: Atau “kepada-Nyalah Aku telah berkenan” atau “kepada-Nyalah Aku bersukacita.” Secara harfiah, bahasa Yunani memakai bentuk lampau dan preposisi yang berarti “ke/kepada”; ungkapan ini juga menggemakan kisah pembaptisan dan pemuliaan Yesus dalam Injil.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν
  choice: ketika Ia menerima
  rationale: Partisip aoris ini menerangkan subjek tersirat, yaitu Yesus dalam konteks. Bentuk “ketika Ia menerima” menyatakan hubungan temporal secara alami tanpa mengubahnya menjadi tindakan yang tidak berkaitan.
- source_word: παρὰ θεοῦ πατρὸς
  choice: dari Allah Bapa
  rationale: παρά dengan genetif menyatakan sumber. Ungkapan ini mempertahankan kedua nomina dan merupakan bentuk Indonesia yang jelas serta lazim.
- source_word: τιμὴν καὶ δόξαν
  choice: kehormatan dan kemuliaan
  rationale: Kedua nomina dipertahankan secara terpisah sesuai teks Yunani.
- source_word: φωνῆς ἐνεχθείσης αὐτῷ
  choice: suara ... disampaikan kepada-Nya
  rationale: Genetif absolut dialihkan menjadi klausa yang wajar dalam bahasa Indonesia. Bentuk pasif “disampaikan” mempertahankan nuansa ἐνεχθείσης, dari φέρω, dan penerima yang ditandai αὐτῷ.
- source_word: τοιᾶσδε
  choice: seperti ini
  rationale: Demonstrativa ini menunjuk ke depan kepada perkataan yang segera dikutip. “Seperti ini” alami dalam bahasa Indonesia dan mempertahankan fungsi kataforis tersebut.
- source_word: ὑπὸ τῆς μεγαλοπρεποῦς δόξης
  choice: oleh Kemuliaan Yang Mahagung
  rationale: ὑπό paling langsung menandai pelaku dalam konstruksi pasif. Kapitalisasi menunjukkan bahwa frasa hormat ini merujuk kepada hadirat ilahi, tanpa menggantinya dengan sebutan yang lebih eksplisit daripada teks sumber.
- source_word: Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν
  choice: Inilah Anak-Ku, Yang Kukasihi
  rationale: Susunan ini mempertahankan hubungan aposisional antara “Anak-Ku” dan “Yang Kukasihi”, termasuk pengulangan μου, alih-alih meleburkannya menjadi satu frasa atributif.
- source_word: εἰς ὃν ἐγὼ εὐδόκησα
  choice: kepada-Nyalah Aku berkenan
  rationale: Ungkapan ini menjaga arah relasional εἰς ὃν dan penegasan ἐγώ melalui “-lah” dan penyebutan “Aku”, sambil memakai ungkapan Indonesia yang alami untuk perkenanan ilahi.
theological_decisions:
- issue: Frasa hormat ilahi τῆς μεγαλοπρεποῦς δόξης
  choice: Kemuliaan Yang Mahagung
  alternative: kemuliaan yang sangat agung; Keagungan Ilahi
  rationale: Teks tampaknya memakai “Kemuliaan” sebagai sebutan tidak langsung yang penuh hormat bagi Allah atau hadirat-Nya. Terjemahan mempertahankan sebutan tersebut dan tidak menguraikannya menjadi identifikasi teologis yang lebih khusus.
- issue: Susunan pernyataan Bapa mengenai Anak
  choice: Inilah Anak-Ku, Yang Kukasihi
  alternative: Inilah Anak-Ku yang terkasih
  rationale: Pilihan utama mempertahankan aposisi dan pengulangan unsur posesif dalam bahasa Yunani, sehingga bobot pernyataan tetap ada tanpa memasukkan rumusan doktrinal tambahan.
- issue: Aspek aoris dalam εὐδόκησα
  choice: Aku berkenan
  alternative: Aku telah berkenan; Aku berkenan kepada-Nya
  rationale: Aoris Yunani dapat diterjemahkan secara formal dengan bentuk lampau, tetapi dalam deklarasi ini bahasa Indonesia tanpa penanda waktu lebih alami dan tidak memaksa perkenanan itu hanya menjadi peristiwa lampau. Catatan kaki mempertahankan kemungkinan nuansa alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada pronomina yang merujuk kepada pribadi ilahi mengikuti register Alkitab Indonesia yang umum. Tanda pisah di akhir dipertahankan karena kalimat berlanjut ke ayat berikutnya.
