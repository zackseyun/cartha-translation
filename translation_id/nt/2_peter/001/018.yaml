  text: καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ⸂ἁγίῳ ὄρει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/018.yaml
  text: And we ourselves heard this voice brought from heaven when we were with him on the holy mountain[a].
translation:
  language: id
  text: Dan kami sendiri mendengar suara ini, yang disampaikan dari surga, ketika kami bersama Dia di gunung yang kudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dibawa dari surga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην τὴν φωνὴν
  choice: suara ini
  rationale: φωνή menunjuk pada ucapan ilahi dalam ayat sebelumnya, sehingga 'suara' lebih tepat daripada 'bunyi'.
- source_word: ἡμεῖς
  choice: kami sendiri
  rationale: Pronomina yang dinyatakan secara eksplisit memberi penekanan pada kesaksian para saksi mata; 'kami sendiri' mempertahankan tekanan itu.
- source_word: ἠκούσαμεν
  choice: mendengar
  rationale: Bentuk aoris menunjukkan peristiwa mereka mendengar suara tersebut, bukan tindakan mendengarkan yang berlangsung terus.
- source_word: ἐξ οὐρανοῦ
  choice: dari surga
  rationale: Ungkapan Indonesia yang wajar untuk asal suara tersebut dan sesuai dengan makna frasa Yunani.
- source_word: ἐνεχθεῖσαν
  choice: dibawa
  rationale: Partisip pasif dari φέρω menerangkan 'suara' sebagai sesuatu yang disampaikan atau dibawa dari surga; bentuk pasif dipertahankan tanpa menentukan pelaku.
- source_word: σὺν αὐτῷ ὄντες
  choice: ketika kami bersama Dia
  rationale: Konstruksi partisip paling alami dipahami secara temporal. 'Dia' merujuk kepada Yesus dalam konteks.
- source_word: ἐν τῷ ἁγίῳ ὄρει
  choice: di gunung yang kudus
  rationale: '''Di gunung'' merupakan ungkapan Indonesia yang alami, sedangkan ''yang kudus'' mempertahankan sifat khusus gunung itu tanpa mengidentifikasinya.'
theological_decisions:
- issue: Rujukan 'gunung yang kudus'
  choice: Rujukan deskriptif kepada gunung tempat transfigurasi Yesus, tanpa menyebut nama gunung tertentu.
  alternative: Mengidentifikasinya secara eksplisit sebagai Gunung Tabor atau Gunung Hermon.
  rationale: Teks Yunani hanya menyebut 'gunung yang kudus' dan tidak menamainya; terjemahan tidak memasukkan identifikasi tradisional yang tidak dinyatakan dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan penekanan kesaksian langsung serta bentuk pasif sumber Yunani, sambil tetap mudah dipahami.
