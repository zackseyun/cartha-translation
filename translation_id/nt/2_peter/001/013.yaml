  text: But I consider it right[a], as long as I am in this tent, to stir you up by way of reminder,
translation:
  language: id
  text: Namun, aku menganggap sudah sepatutnya, selama aku masih berada dalam kemah ini[a], menggugah kalian dengan mengingatkan kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: “kemah”; kata ini juga dapat berarti “tempat tinggal.” Dalam konteks ini, “kemah” merupakan metafora bagi kehidupan fana Petrus dalam tubuhnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιον
  choice: sudah sepatutnya
  rationale: Dalam konstruksi dengan ἡγοῦμαι, kata ini menyatakan penilaian tentang apa yang patut atau benar dilakukan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa kepantasan moral.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai peralihan atau kontras ringan dengan pernyataan sebelumnya; “Namun” menyampaikan hubungan itu tanpa membuat kontrasnya terlalu keras.
- source_word: ἡγοῦμαι
  choice: aku menganggap
  rationale: Kata kerja ini menunjukkan penilaian yang dipertimbangkan, bukan sekadar pikiran sepintas.
- source_word: ἐφ’ ὅσον
  choice: selama
  rationale: Bersama εἰμί, frasa ini bersifat temporal dan berarti “selama” atau “selagi”.
- source_word: σκηνώματι
  choice: kemah
  rationale: Pilihan ini mempertahankan metafora Yunani tentang tubuh atau kehidupan fana sebagai tempat tinggal sementara dan menghubungkannya dengan gambaran pada ayat berikutnya.
- source_word: διεγείρειν
  choice: menggugah
  rationale: Kata ini berarti membangunkan atau membangkitkan. Dalam konteks dorongan rohani dan moral, “menggugah” alami serta tetap mempertahankan daya metaforanya.
- source_word: ἐν ὑπομνήσει
  choice: dengan mengingatkan kalian
  rationale: 'Frasa ini menyatakan sarana: Petrus menggugah para pembaca melalui tindakan mengingatkan mereka.'
theological_decisions:
- issue: Acuan metaforis “kemah ini”
  choice: Mempertahankan metafora secara langsung sebagai “kemah ini”.
  alternative: “tubuh ini” atau “tempat tinggal ini”
  rationale: Teks Yunani memakai gambaran kemah bagi keberadaan jasmani Petrus yang sementara. Mempertahankan metafora menjaga kaitannya dengan ayat berikutnya tanpa memasukkan penafsiran teologis tambahan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi dan bermartabat. Kata ganti “aku” dan “kalian” mempertahankan orang pertama tunggal serta orang kedua jamak secara jelas. Susunan kalimat dibuat alami dalam bahasa Indonesia sambil menjaga metafora utama teks sumber.
