id: 2PE.1.10
reference: 2 Peter 1:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/010.yaml
  text: Therefore[a], brothers, be all the more diligent to make your calling and election sure, for if you do these things, you will certainly never stumble.
translation:
  language: id
  text: Karena itu, Saudara-saudara[a], berusahalah dengan lebih sungguh-sungguh untuk meneguhkan panggilan dan pemilihanmu. Sebab, jika kamu melakukan hal-hal itu, kamu pasti tidak akan pernah tersandung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Saudara-saudara sekalian”; kata Yunani secara harfiah berbentuk maskulin jamak, tetapi dapat mencakup seluruh komunitas orang percaya, baik laki-laki maupun perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan dari nasihat sebelumnya dan mempertahankan hubungan logis secara alami dalam bahasa Indonesia.
- source_word: μᾶλλον
  choice: dengan lebih sungguh-sungguh
  rationale: Memperkuat perintah σπουδάσατε; ungkapan ini menyampaikan daya komparatifnya secara wajar.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan jamak ini mempertahankan bentuk sumber dan lazim dipakai secara inklusif bagi komunitas orang percaya; cakupan inklusif dijelaskan dalam catatan kaki.
- source_word: σπουδάσατε
  choice: berusahalah ... sungguh-sungguh
  rationale: Menyampaikan seruan untuk mengerahkan upaya dengan tekun dan serius dalam ragam nasihat yang alami.
- source_word: βεβαίαν
  choice: meneguhkan
  rationale: Dalam konstruksi dengan ποιεῖσθαι, kata ini menunjuk pada menjadikan pasti, kukuh, atau terkonfirmasi; 'meneguhkan' alami dan tidak menyiratkan bahwa manusia menciptakan tindakan Allah.
- source_word: κλῆσιν
  choice: panggilan
  rationale: Padanan Perjanjian Baru yang tepat untuk tindakan Allah memanggil, sekaligus menjaga kesinambungan istilah teologis.
- source_word: ἐκλογὴν
  choice: pemilihan
  rationale: Menunjuk pada tindakan memilih; istilah ini tepat dan tidak memaksakan sistem teologis tertentu.
- source_word: ποιεῖσθαι
  choice: untuk meneguhkan
  rationale: Bersama βεβαίαν menyatakan tindakan membuat panggilan dan pemilihan menjadi kukuh atau terkonfirmasi.
- source_word: ταῦτα
  choice: hal-hal itu
  rationale: Merujuk kembali pada sifat dan praktik yang disebut dalam konteks sebelumnya.
- source_word: ποιοῦντες
  choice: jika kamu melakukan
  rationale: Partisip ini memiliki daya kondisional dalam konteks dan diterjemahkan secara idiomatis.
- source_word: οὐ μὴ
  choice: pasti tidak akan pernah
  rationale: Mempertahankan penyangkalan Yunani yang sangat tegas tanpa terdengar janggal dalam bahasa Indonesia.
- source_word: πταίσητέ
  choice: tersandung
  rationale: Mempertahankan metafora kegagalan atau kejatuhan tanpa mempersempitnya menjadi dosa tertentu, kesempurnaan tanpa dosa, atau kemurtadan akhir.
theological_decisions:
- issue: Makna meneguhkan panggilan dan pemilihan
  choice: Nasihat agar orang percaya mengukuhkan atau mengonfirmasi panggilan dan pemilihan dalam kehidupan mereka melalui ketekunan dalam kebajikan.
  alternative: Upaya manusia yang menciptakan atau menentukan panggilan dan pemilihan Allah.
  rationale: Konstruksi ποιεῖσθαι dengan βεβαίαν berbicara tentang membuat kukuh atau terkonfirmasi. Terjemahan mempertahankan ketegangan teks tanpa memutuskan suatu kerangka denominasi.
- issue: Daya ungkapan tidak akan pernah tersandung
  choice: Janji kuat mengenai tidak tersandung ketika terus melakukan hal-hal yang disebutkan.
  alternative: Jaminan mutlak bahwa seseorang tidak akan pernah berbuat dosa, atau pernyataan teknis yang khusus mengenai ketidakmungkinan murtad pada akhirnya.
  rationale: πταίω mempertahankan metafora tersandung dan konteks nasihat; terjemahan tidak menajamkannya melampaui yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang khidmat namun mudah dipahami. Sapaan 'Saudara-saudara' dipertahankan dekat dengan bentuk Yunani, sedangkan cakupan inklusifnya dijelaskan dalam catatan kaki. Kata ganti jamak 'kamu' dipakai secara konsisten untuk membedakannya dari sapaan kehormatan tunggal.
