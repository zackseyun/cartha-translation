id: 2PE.1.12
reference: 2 Peter 1:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διὸ ⸀μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν περὶ τούτων, καίπερ εἰδότας καὶ ἐστηριγμένους ἐν τῇ παρούσῃ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/012.yaml
  text: Therefore I will always be ready to remind you about these things[a], even though you know them and have been established in the present truth.
translation:
  language: id
  text: Karena itu, aku akan selalu siap mengingatkan kalian tentang hal-hal ini, meskipun kalian sudah mengetahuinya dan telah diteguhkan dalam kebenaran yang sekarang ada pada kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam kebenaran yang sekarang hadir di tengah kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya dengan penghubung inferensial yang alami dalam bahasa Indonesia.
- source_word: μελλήσω
  choice: aku akan ... siap
  rationale: Bentuk futur μέλλω bersama infinitif di sini menyatakan kesiapan atau tekad untuk bertindak, bukan sekadar tindakan yang segera akan terjadi.
- source_word: ἀεὶ
  choice: selalu
  rationale: Menyampaikan tindakan yang terus atau berulang kali dilakukan.
- source_word: ὑπομιμνῄσκειν
  choice: mengingatkan
  rationale: Secara langsung menyatakan tindakan membuat orang lain mengingat; aspek berulang sudah ditunjukkan oleh 'selalu'.
- source_word: περὶ τούτων
  choice: tentang hal-hal ini
  rationale: Padanan alami bagi περί dengan genitif dan tetap merujuk pada pokok-pokok sebelumnya.
- source_word: καίπερ
  choice: meskipun
  rationale: Mempertahankan hubungan konsesif antara tindakan mengingatkan dan keadaan para pembaca.
- source_word: εἰδότας
  choice: kalian sudah mengetahuinya
  rationale: Partisip perfektif οἶδα menunjukkan keadaan telah mengetahui; '-nya' merujuk pada hal-hal yang baru disebut.
- source_word: ἐστηριγμένους
  choice: telah diteguhkan
  rationale: Mempertahankan bentuk pasif dan keadaan mantap sebagai hasil tindakan sebelumnya.
- source_word: ἐν τῇ παρούσῃ ἀληθείᾳ
  choice: dalam kebenaran yang sekarang ada pada kalian
  rationale: Mengungkapkan arti παρούσῃ sebagai kebenaran yang kini hadir atau tersedia bagi para pembaca, sambil menghindari kesan istilah teknis tentang suatu zaman tertentu.
theological_decisions:
- issue: Makna 'kebenaran yang sekarang ada'
  choice: kebenaran yang sekarang ada pada kalian
  alternative: kebenaran masa kini; kebenaran yang hadir di tengah kalian
  rationale: Frasa Yunani tidak menetapkan suatu pengertian dispensasional atau zaman teologis khusus. Terjemahan ini menyatakan bahwa kebenaran itu kini hadir atau dimiliki para pembaca, tetapi catatan kaki mempertahankan kemungkinan nuansa lokatif.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti 'aku/kalian' dipakai agar pembedaan tunggal-jamak dari teks Yunani tetap jelas. Susunan kalimat mempertahankan hubungan inferensial dan konsesif sumber tanpa menjadikan 'kebenaran yang sekarang ada' sebagai istilah doktrinal teknis.
