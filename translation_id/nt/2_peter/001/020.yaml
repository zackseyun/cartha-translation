  text: 'knowing this first: that every prophecy of Scripture does not come about from one''s own interpretation.'
translation:
  language: id
  text: 'Pertama-tama, ketahuilah ini: tidak ada satu pun nubuat Kitab Suci yang berasal dari penafsiran sendiri.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “penjelasan sendiri.” Ungkapan Yunani tidak menyebut secara tegas siapa yang dimaksud dengan “sendiri”; konteks berikutnya menekankan asal nubuat, bukan kehendak manusia.'
    reason: Menjaga ambiguitas ἰδίας ἐπιλύσεως serta menjelaskan bahwa terjemahan “berasal dari” mengikuti hubungan ungkapan itu dengan οὐ γίνεται tanpa menentukan pelakunya.
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: Pertama-tama, ketahuilah ini
  rationale: Menyampaikan prioritas πρῶτον dan daya imperatif kontekstual dari partisip γινώσκοντες secara alami dalam bahasa Indonesia.
- source_word: πᾶσα προφητεία γραφῆς
  choice: setiap nubuat dalam Kitab Suci
  rationale: Mempertahankan πᾶσα sebagai 'setiap'; genitif γραφῆς dibuat secara alami sebagai nubuat yang terdapat dalam Kitab Suci tanpa memaksakan apakah genitif itu terutama sumber atau kepemilikan.
- source_word: ἰδίας ἐπιλύσεως
  choice: penafsiran sendiri
  rationale: ἰδίας berarti milik/sendiri, sedangkan ἐπίλυσις menunjuk pada penjelasan atau penafsiran; ungkapan ini tetap membiarkan terbuka siapa pelaku yang dimaksud.
- source_word: οὐ γίνεται
  choice: tidak muncul dari
  rationale: γίνεται secara harfiah berarti 'menjadi/terjadi'; bersama genitif, frasa ini secara wajar menyatakan asal-usul. 'Muncul dari' menjaga kaitannya dengan asal nubuat dan menghindari kata yang terlalu teknis.
theological_decisions:
- issue: Apakah ayat ini berbicara tentang penafsiran pembaca atau asal-usul nubuat?
  choice: Mempertahankan ungkapan 'penafsiran sendiri' sambil menerjemahkan οὐ γίνεται sebagai 'tidak muncul dari'.
  alternative: Tidak boleh ditafsirkan menurut kehendak sendiri; atau tidak berasal dari penjelasan nabi sendiri.
  rationale: Bahasa Yunani dapat menimbulkan pertanyaan tentang penafsiran dan asal-usul. Konteks ayat 21 menekankan datangnya nubuat, tetapi ayat 20 sendiri tidak secara eksplisit menyebut pembaca ataupun nabi. Terjemahan tidak menetapkan pelaku secara sepihak.
- issue: Cakupan πᾶσα dengan negasi
  choice: setiap nubuat ... tidak
  alternative: tidak ada nubuat ... yang
  rationale: Bentuk ini mengikuti susunan Yunani dan bukti konsultasi yang diaudit, sekaligus menyampaikan bahwa hal tersebut berlaku pada tiap nubuat Kitab Suci.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kitab Suci' dipakai sebagai padanan baku γραφή; tanda titik dua mempertahankan struktur penjelasan dalam teks Yunani.
