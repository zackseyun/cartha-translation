reference: 2 Peter 1:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/016.yaml
  text: For we did not make known to you the power and coming of our Lord Jesus the Messiah by following cleverly devised myths[b][a], but by becoming eyewitnesses of his majesty.
translation:
  language: id
  text: Sebab, kami memberitahukan kepada kalian tentang kuasa dan kedatangan Tuhan kita Yesus, Sang Mesias, bukan dengan mengikuti mitos-mitos yang direka dengan cerdik, melainkan sebagai orang-orang yang telah menyaksikan sendiri keagungan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani παρουσία juga dapat berarti “kehadiran” atau “kedatangan”; dalam banyak konteks Perjanjian Baru, kata ini menunjuk pada kedatangan Mesias.
    reason: alternative_reading
lexical_decisions:
- source_word: σεσοφισμένοις μύθοις
  choice: mitos-mitos yang direka dengan licik
  rationale: Bentuk partisipel pasif perfek menerangkan mitos yang sengaja dan cerdik direkayasa; pilihan ini mempertahankan nada negatif serta unsur fabrikasinya.
- source_word: ἐξακολουθήσαντες
  choice: mengikuti
  rationale: 'Partisipel aoris ini menyatakan latar atau cara yang ditolak: pemberitaan para rasul tidak didasarkan pada tindakan mengikuti mitos.'
- source_word: ἐγνωρίσαμεν ὑμῖν
  choice: kami memberitahukan kepada kalian
  rationale: γνωρίζω berarti membuat sesuatu diketahui atau memberitahukannya; frasa ini juga mempertahankan penerima jamak ὑμῖν.
- source_word: δύναμιν
  choice: kuasa
  rationale: Padanan langsung dan lazim bagi δύναμις, khususnya dalam konteks kuasa ilahi.
- source_word: παρουσίαν
  choice: kedatangan
  rationale: Dalam konteks kristologis Perjanjian Baru, παρουσία sering menunjuk pada kedatangan Mesias, meskipun secara leksikal juga dapat berarti kehadiran atau tibanya seseorang.
- source_word: κυρίου
  choice: Tuhan
  rationale: Mempertahankan pemakaian κύριος sebagai gelar bagi Yesus dalam bahasa Indonesia Alkitabiah yang wajar.
- source_word: Χριστοῦ
  choice: Sang Mesias
  rationale: Χριστός berfungsi sebagai gelar; 'Sang Mesias' menyampaikan maknanya secara jelas dan idiomatis dalam bahasa Indonesia.
- source_word: ἐπόπται γενηθέντες
  choice: kami telah menyaksikan sendiri
  rationale: Ungkapan idiomatis ini membawa daya bukti ἐπόπται, yakni orang yang melihat secara langsung, tanpa kekakuan harfiah 'menjadi saksi mata'.
- source_word: μεγαλειότητος
  choice: keagungan
  rationale: μεγαλειότης menyatakan kebesaran atau kemegahan yang luhur; 'keagungan' alami dan sesuai dengan konteks penampakan kemuliaan Yesus.
- source_word: ἐκείνου
  choice: -Nya
  rationale: Demonstrativa tersebut merujuk kembali kepada Tuhan Yesus, Sang Mesias; pronomina posesif adalah bentuk Indonesia yang alami.
theological_decisions:
- issue: Makna παρουσία dalam konteks kristologis
  choice: kedatangan
  alternative: kehadiran; tibanya
  rationale: Pemakaian Perjanjian Baru dan pasangan 'kuasa dan παρουσία' mendukung rujukan kepada kedatangan Mesias. Namun, keluasan leksikalnya dipertahankan dalam catatan kaki.
- issue: Χριστός sebagai gelar atau nama
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam frasa ini Χριστός tetap dapat dipahami sebagai gelar bagi Yesus. Terjemahan maknawi 'Sang Mesias' membuat fungsi gelar itu transparan tanpa memasukkan tafsir denominasi.
- issue: Hubungan kedua partisipel dengan verba utama
  choice: 'kontras dasar pemberitaan: tidak mengikuti mitos, melainkan menyaksikan sendiri'
  alternative: 'terjemahan bentuk yang lebih harfiah: ''setelah mengikuti ... setelah menjadi saksi mata'''
  rationale: Struktur οὐ ... ἀλλά membentuk pertentangan yang jelas antara cerita hasil rekayasa dan pengalaman langsung para saksi. Susunan dua kalimat Indonesia mempertahankan kontras itu secara alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kalian' dipakai untuk menandai bahwa ὑμῖν berbentuk jamak. Struktur Yunani ditata ulang menjadi dua kalimat agar kontras οὐ ... ἀλλά jelas dan alami. Penulisan '-Nya' mengikuti kaidah bahasa Indonesia untuk pronomina yang merujuk kepada Tuhan.
