id: 2PE.1.7
reference: 2 Peter 1:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν δὲ τῇ εὐσεβείᾳ τὴν φιλαδελφίαν, ἐν δὲ τῇ φιλαδελφίᾳ τὴν ἀγάπην·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/007.yaml
  text: and in godliness[a], brotherly affection; and in brotherly affection, love.
translation:
  language: id
  text: dan dalam kesalehan, kasih persaudaraan; dan dalam kasih persaudaraan, kasih.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐσεβείᾳ
  choice: kesalehan
  rationale: εὐσέβεια menunjuk pada pengabdian penuh hormat kepada Allah yang nyata dalam sikap dan perilaku; “kesalehan” merupakan padanan Indonesia yang alami dan mencakup dimensi rohani serta etis.
- source_word: φιλαδελφίαν
  choice: kasih persaudaraan
  rationale: φιλαδελφία berarti kasih atau keakraban seperti antara saudara, khususnya di antara sesama orang percaya. “Kasih persaudaraan” menyatakan lingkup kekeluargaan istilah ini dan tetap dapat dibedakan dari ἀγάπη yang lebih umum.
- source_word: ἀγάπην
  choice: kasih
  rationale: ἀγάπη di sini merupakan puncak rangkaian kebajikan dan berlingkup lebih luas daripada φιλαδελφία; padanan sederhana “kasih” tidak mempersempit maknanya.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: dan dalam ..., ...
  rationale: Bentuk ini mempertahankan pengulangan struktur Yunani dan menggambarkan kebajikan berikutnya sebagai unsur yang hadir dalam kebajikan sebelumnya, tanpa menambahkan kata kerja yang tidak terdapat dalam ayat ini.
- source_word: δέ
  choice: dan
  rationale: δέ bersifat penghubung ringan dalam daftar kumulatif ini, bukan pertentangan, sehingga “dan” paling sesuai.
theological_decisions:
- issue: Pembedaan φιλαδελφία dan ἀγάπη dalam rangkaian kebajikan
  choice: φιλαδελφία diterjemahkan “kasih persaudaraan,” sedangkan ἀγάπη diterjemahkan “kasih.”
  alternative: Menerjemahkan keduanya dengan “kasih,” atau memakai “rasa sayang persaudaraan” untuk φιλαδελφία.
  rationale: Bahasa Yunani memakai dua istilah berbeda secara berurutan. “Kasih persaudaraan” mempertahankan lingkup khusus φιλαδελφία, sementara “kasih” membiarkan cakupan ἀγάπη tetap lebih luas tanpa memasukkan penafsiran teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur paralel sumber dipertahankan karena ayat ini melanjutkan rangkaian kebajikan dari konteks sebelumnya. Tidak diperlukan catatan kaki karena “kasih persaudaraan” secara langsung dan alami menyampaikan makna φιλαδελφία.
