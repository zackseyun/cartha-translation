reference: 2 Peter 1:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/001.yaml
  text: 'Simeon Peter[a], a servant and apostle of Jesus the Messiah[d][c][b], to those who have obtained a faith as precious as ours in the righteousness of our God and Savior Jesus the Messiah:'
translation:
  language: id
  text: 'Simeon Petrus, hamba[a] dan rasul Yesus Sang Mesias, kepada mereka yang telah memperoleh iman yang sama berharganya dengan iman kami[b] melalui[c] keadilan Allah dan Juru Selamat kita, Yesus Sang Mesias[d]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “budak”. Kata Yunani ini menekankan bahwa Simeon sepenuhnya menjadi milik dan berada di bawah kuasa Yesus Sang Mesias, bukan hanya bekerja sebagai pelayan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “iman yang sederajat dengan iman kami” atau “iman yang mendapat kehormatan yang sama dengan iman kami”. Kata sifat Yunaninya dapat menekankan kesamaan nilai, kehormatan, atau kedudukan.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “dalam keadilan” atau “oleh keadilan”. Kata depan Yunaninya dapat menyatakan lingkup ataupun sarana.
    reason: lexical_alternative
  - marker: d
    text: 'Susunan Yunaninya paling alami berarti bahwa “Allah dan Juru Selamat kita” adalah satu pribadi, yaitu Yesus Sang Mesias. Kemungkinan yang kurang kuat secara tata bahasa ialah bahwa frasa itu menunjuk kepada dua pribadi: “Allah kita dan Juru Selamat Yesus Sang Mesias”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Συμεὼν Πέτρος
  choice: Simeon Petrus
  rationale: “Simeon” mencerminkan bentuk Συμεών dalam SBLGNT, sedangkan “Petrus” adalah bentuk nama Πέτρος yang mapan dalam bahasa Indonesia.
- source_word: δοῦλος
  choice: hamba
  rationale: Dalam bahasa Indonesia, “hamba” merupakan padanan alami dan bermartabat bagi seorang yang sepenuhnya menjadi milik serta mengabdi kepada tuannya. Catatan kaki mempertahankan nuansa perhambaan yang lebih kuat daripada sekadar pelayan.
- source_word: ἀπόστολος
  choice: rasul
  rationale: “Rasul” adalah istilah Indonesia yang mapan bagi utusan yang diberi wewenang dan jabatan khusus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός dipertahankan sebagai gelar yang bermakna, “Mesias”, dan “Sang” membuat gelar tersebut idiomatis dalam bahasa Indonesia.
- source_word: τοῖς ... λαχοῦσιν
  choice: kepada mereka yang telah memperoleh
  rationale: λαγχάνω menunjukkan sesuatu yang diterima atau dianugerahkan, bukan sesuatu yang dicapai dengan usaha; “memperoleh” tetap alami tanpa memaksakan gambaran undian.
- source_word: ἰσότιμον ... πίστιν
  choice: iman yang sama berharganya dengan iman kami
  rationale: ἰσότιμος dapat menyatakan kesetaraan nilai, kehormatan, atau kedudukan. Pilihan ini mengungkapkan kesetaraan nilainya sambil mempertahankan alternatif nuansa dalam catatan kaki.
- source_word: πίστιν
  choice: iman
  rationale: Dalam konteks ini πίστις menunjuk pada iman yang diterima bersama oleh para pembaca dan para rasul; “iman” adalah padanan yang tepat dan mapan.
- source_word: ἐν δικαιοσύνῃ
  choice: dalam kebenaran
  rationale: Terjemahan ini mempertahankan keterbukaan ἐν, yang dapat menyatakan lingkup maupun sarana. Kemungkinan instrumental dijelaskan dalam catatan kaki.
- source_word: δικαιοσύνῃ
  choice: kebenaran
  rationale: “Kebenaran” adalah istilah teologis Indonesia yang mapan untuk δικαιοσύνη dalam konteks ini dan lebih sesuai daripada “keadilan”, meskipun unsur keadilan tetap terkandung di dalamnya.
- source_word: τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: Allah dan Juru Selamat kita, Yesus Sang Mesias
  rationale: Satu artikel Yunani yang menaungi dua sebutan pribadi tunggal yang dihubungkan dengan καί paling alami menunjuk kepada satu pribadi. Tanda koma menjadikan “Yesus Sang Mesias” sebagai aposisi yang mengidentifikasi Dia sebagai Allah dan Juru Selamat, tanpa menambahkan kata penjelas yang tidak ada dalam sumber.
theological_decisions:
- issue: Apakah “Allah dan Juru Selamat kita, Yesus Sang Mesias” menunjuk kepada satu pribadi atau dua pribadi
  choice: 'Satu pribadi: Yesus disebut Allah dan Juru Selamat kita.'
  alternative: 'Dua pribadi: “Allah kita” dan “Juru Selamat Yesus Sang Mesias”.'
  rationale: Konstruksi Yunani memakai satu artikel untuk θεοῦ dan σωτῆρος, dua nomina pribadi tunggal yang dihubungkan oleh καί, sehingga secara paling alami keduanya memiliki satu rujukan. Karena alternatif dua-pribadi pernah diajukan dan persoalannya penting secara kristologis, alternatif itu dicatat, bukan dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Hamba” dipilih agar alami dalam pengenalan diri seorang rasul, dengan nuansa kepemilikan kuat dari δοῦλος dijelaskan secara terbuka. Bentuk “Juru Selamat” dan “Sang Mesias” dipakai sebagai gelar. Struktur salam dan tanda titik dua dipertahankan karena ayat ini membuka kalimat yang berlanjut.
