  text: ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/008.yaml
  text: For if these things are yours and are increasing[c][b][a], they keep you from being ineffective or unfruitful in the knowledge of our Lord Jesus the Messiah.
translation:
  language: id
  text: Sebab, jika hal-hal itu ada padamu dan makin bertambah[a], hal-hal itu mencegah kamu menjadi tidak giat ataupun tidak berbuah dalam pengenalan[b] akan Tuhan kita, Yesus Sang Mesias.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berlimpah”.
    reason: lexical_alternative
  - marker: b
    text: Atau “pengenalan penuh”.
    reason: lexical_alternative
  - marker: c
    text: 'Yunani: “Yesus Kristus”; di sini Χριστός diterjemahkan sebagai gelar, “Sang Mesias”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: semua itu
  rationale: Kata tunjuk ini merujuk kembali pada sifat-sifat dalam ayat 5–7. “Semua itu” mempertahankan rujukan tersebut tanpa menambahkan kata tafsiran seperti “sifat-sifat”.
- source_word: ὑμῖν ὑπάρχοντα
  choice: ada padamu
  rationale: Gabungan datif ὑμῖν dan partisip ὑπάρχοντα menyatakan bahwa hal-hal tersebut hadir pada atau dimiliki para pembaca. “Ada padamu” alami dalam bahasa Indonesia dan tidak membatasi maknanya hanya pada lokasi batiniah.
- source_word: πλεονάζοντα
  choice: makin bertambah
  rationale: Partisip ini dapat menyatakan pertambahan maupun kelimpahan. “Makin bertambah” sesuai dengan konteks pertumbuhan etis dan mempertahankan nuansa dinamisnya.
- source_word: ἀργούς
  choice: tidak giat
  rationale: Kata ini berarti menganggur, tidak bekerja, atau tidak produktif. “Tidak giat” mempertahankan gagasan ketidakaktifan tanpa menyempitkannya menjadi kemalasan moral.
- source_word: ἀκάρπους
  choice: tidak berbuah
  rationale: Pilihan ini mempertahankan metafora Yunani tentang ketiadaan buah atau hasil.
- source_word: καθίστησιν
  choice: mencegah kamu menjadi
  rationale: 'Dalam susunan negatif οὐκ ... οὐδὲ, verba ini menyatakan hasil: keberadaan sifat-sifat tersebut membuat para pembaca tidak menjadi tidak giat maupun tidak berbuah. Bentuk ini alami sekaligus mempertahankan struktur negatif teks.'
- source_word: εἰς τὴν ... ἐπίγνωσιν
  choice: dalam pengenalan akan
  rationale: εἰς di sini menyatakan lingkup atau hubungan dengan pengenalan tersebut. Ungkapan “dalam pengenalan akan” merupakan padanan Indonesia yang wajar.
- source_word: ἐπίγνωσιν
  choice: pengenalan
  rationale: “Pengenalan” cocok untuk pengetahuan relasional tentang pribadi dan tidak memaksakan nuansa “penuh”, yang tetap dicatat sebagai kemungkinan leksikal.
- source_word: κυρίου
  choice: Tuhan
  rationale: Ini adalah padanan baku dan wajar bagi κύριος sebagai gelar kristologis.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός bermakna “Yang Diurapi” atau “Mesias”. “Sang Mesias” mempertahankan daya gelarnya dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna Χριστοῦ dalam gelar Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: Menerjemahkan gelar Χριστός sebagai “Sang Mesias” menyampaikan makna gelar Yunani secara langsung tanpa mengubah klaim kristologis teks.
- issue: Kekuatan makna ἐπίγνωσις
  choice: pengenalan
  alternative: pengenalan penuh
  rationale: Kata Yunani dapat mengandung nuansa pengetahuan yang penuh atau mendalam, tetapi nuansa itu tidak harus selalu dinyatakan secara eksplisit. Teks utama memakai padanan yang lebih netral dan kemungkinan yang lebih kuat dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur negatif dipertahankan agar ketegangan ungkapan Yunani “tidak giat atau tidak berbuah” tidak diam-diam diubah menjadi pernyataan positif.
