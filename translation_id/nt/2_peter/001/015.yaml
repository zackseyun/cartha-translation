  text: σπουδάσω δὲ καὶ ἑκάστοτε ἔχειν ὑμᾶς μετὰ τὴν ἐμὴν ἔξοδον τὴν τούτων μνήμην ποιεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/015.yaml
  text: And I will make every effort so that[a], after my departure, you may be able at any time to recall these things.
translation:
  language: id
  text: Aku juga akan berusaha sungguh-sungguh agar, sesudah kepergianku[a], kalian dapat setiap saat mengingat hal-hal ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih jelas, “setelah kematianku.” Bahasa Yunani mengatakan “setelah kepergianku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσω
  choice: Aku akan berusaha sungguh-sungguh
  rationale: Bentuk mendatang ini menyatakan tekad untuk mengerahkan upaya dengan sungguh-sungguh; ungkapan tersebut alami dalam bahasa Indonesia dan mempertahankan intensitasnya.
- source_word: δὲ καὶ
  choice: pun ... supaya
  rationale: δέ melanjutkan alur dengan nuansa tambahan, sedangkan καί bersama konstruksi infinitif mendukung tujuan lanjutan dari usaha Petrus. Susunan ini menyampaikannya secara alami tanpa memberi kesan pertentangan kuat.
- source_word: ἑκάστοτε
  choice: kapan pun diperlukan
  rationale: Kata ini menunjuk pada setiap kesempatan atau sewaktu-waktu; frasa ini menyampaikan bahwa mereka dapat mengingatnya pada kesempatan mana pun sesudah Petrus pergi.
- source_word: ἔχειν ὑμᾶς
  choice: kalian dapat
  rationale: Dalam konstruksi ini, ἔχειν menyatakan kemampuan atau kesempatan. 'Kalian dapat' merupakan padanan Indonesia yang jelas dan alami.
- source_word: μετὰ τὴν ἐμὴν ἔξοδον
  choice: setelah kepergianku
  rationale: ἔξοδος secara harfiah berarti kepergian atau keluar, dan di sini menjadi ungkapan halus bagi kematian Petrus. 'Kepergianku' mempertahankan metaforanya.
- source_word: τὴν τούτων μνήμην ποιεῖσθαι
  choice: mengingat hal-hal ini
  rationale: Ungkapan idiomatis Yunani ini berarti mengingat atau membawa sesuatu kembali ke dalam ingatan. Padanan Indonesia ini ringkas dan wajar.
- source_word: τούτων
  choice: hal-hal ini
  rationale: Kata ini merujuk kembali kepada pokok-pokok yang baru saja ditekankan Petrus; 'hal-hal ini' adalah padanan langsung dan transparan.
theological_decisions:
- issue: Makna ἔξοδος sehubungan dengan akhir hidup Petrus
  choice: kepergian
  alternative: kematian
  rationale: Teks memakai metafora bagi kematian Petrus. Teks utama mempertahankan metafora itu, sementara catatan kaki menjelaskan maksudnya tanpa memasukkan nuansa teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi dan bermartabat. Pronomina 'Aku' dan 'kalian' menjaga sapaan tunggal penulis kepada pembaca jamak. Ungkapan 'kapan pun diperlukan' dipilih untuk memperjelas nilai kontekstual ἑκάστοτε tanpa mengubah maksud pokok.
