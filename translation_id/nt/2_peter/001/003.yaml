id: 2PE.1.3
reference: 2 Peter 1:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ⸂ἰδίᾳ δόξῃ καὶ ἀρετῇ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/003.yaml
  text: As his divine power has granted to us all things for life and godliness[a], through the knowledge of the one who called us by his own glory and excellence,
translation:
  language: id
  text: Mengingat bahwa kuasa ilahi-Nya telah menganugerahkan kepada kita segala sesuatu yang berkaitan dengan kehidupan dan kesalehan melalui pengenalan akan Dia yang memanggil kita dengan kemuliaan dan keunggulan-Nya sendiri[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kepada kemuliaan dan keunggulan-Nya sendiri.” Frasa datif dalam bahasa Yunani dapat dipahami dengan cara yang berbeda.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς
  choice: Mengingat bahwa
  rationale: Mengantar dasar bagi nasihat yang menyusul tanpa menjadikannya sekadar perbandingan; ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan hubungan antarkalimat.
- source_word: πάντα ... τὰ πρὸς ζωὴν καὶ εὐσέβειαν
  choice: segala sesuatu yang berkaitan dengan kehidupan dan kesalehan
  rationale: Mempertahankan cakupan πάντα serta arti konstruksi τὰ πρὸς sebagai hal-hal yang berkaitan dengan atau menunjang kehidupan dan kesalehan, tanpa menambahkan kata 'dibutuhkan' yang tidak dinyatakan langsung.
- source_word: θείας δυνάμεως αὐτοῦ
  choice: kuasa ilahi-Nya
  rationale: Susunan yang alami dalam bahasa Indonesia untuk menyatakan kuasa yang bersifat ilahi dan dimiliki oleh tokoh yang dimaksud.
- source_word: δεδωρημένης
  choice: telah menganugerahkan
  rationale: Menyampaikan pemberian sebagai karunia serta tindakan yang telah terjadi dengan hasil yang tetap berlaku.
- source_word: διὰ τῆς ἐπιγνώσεως
  choice: melalui pengenalan
  rationale: ἐπίγνωσις menunjuk pada pengetahuan atau pengenalan yang sungguh; 'pengenalan' paling alami ketika objeknya adalah pribadi, tanpa memaksakan arti teknis 'pengetahuan penuh'.
- source_word: τοῦ καλέσαντος ἡμᾶς
  choice: Dia yang memanggil kita
  rationale: Mempertahankan bentuk personal dari partisip substantival dan tindakan memanggil secara jelas serta wajar.
- source_word: ἰδίᾳ
  choice: -Nya sendiri
  rationale: Menjaga penegasan kepunyaan yang terkandung dalam ἴδιος.
- source_word: δόξῃ
  choice: kemuliaan
  rationale: Padanan baku yang mencakup keagungan dan kemegahan ilahi.
- source_word: ἀρετῇ
  choice: keunggulan
  rationale: ἀρετή dapat berarti kebajikan atau keunggulan; 'keunggulan' cocok bagi sifat ilahi dan tidak mempersempitnya menjadi moralitas manusia.
- source_word: ζωὴν
  choice: kehidupan
  rationale: Menjaga keluasan makna yang dapat mencakup kehidupan sekarang maupun kehidupan eskatologis tanpa tambahan penafsiran.
- source_word: εὐσέβειαν
  choice: kesalehan
  rationale: Menyatakan sikap hidup yang terarah kepada Allah dan merupakan padanan Indonesia yang mapan bagi εὐσέβεια.
theological_decisions:
- issue: Fungsi datif dalam ἰδίᾳ δόξῃ καὶ ἀρετῇ
  choice: dengan kemuliaan dan keunggulan-Nya sendiri
  alternative: kepada kemuliaan dan keunggulan-Nya sendiri
  rationale: Dengan teks SBLGNT yang diberikan, datif paling wajar dipahami secara instrumental, yakni kemuliaan dan keunggulan-Nya menjadi sarana atau dasar panggilan. Namun, fungsi tujuan tetap mungkin dan dipertahankan dalam catatan kaki agar ketegangan sintaksis tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Bentuk kalimat sengaja berakhir dengan koma karena ayat ini secara sintaksis berlanjut ke konteks berikutnya. Kapitalisasi pronomina mengikuti kebiasaan penerbitan Alkitab Indonesia tanpa menambahkan nama yang tidak disebutkan dalam frasa Yunani ini.
