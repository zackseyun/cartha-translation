id: 2PE.1.4
reference: 2 Peter 1:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: δι’ ὧν τὰ ⸂τίμια καὶ μέγιστα ἡμῖν⸃ ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν ⸀τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/004.yaml
  text: through which he has granted to us his precious and very great promises[a], so that through these you may become sharers in the divine nature[b], having escaped the corruption that is in the world because of sinful desire.
translation:
  language: id
  text: Melalui hal-hal itu, Ia telah mengaruniakan kepada kita janji-janji yang berharga dan sangat besar, supaya melalui janji-janji itu kamu dapat mengambil bagian dalam kodrat ilahi[a], setelah luput dari kerusakan yang ada di dunia karena keinginan berdosa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi peserta dalam kodrat ilahi.” Ungkapan ini menyatakan partisipasi dalam kodrat ilahi, tanpa mengatakan bahwa manusia menjadi ilahi dalam hakikat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah dapat diterjemahkan “karena keinginan” atau “oleh hawa nafsu.” Kata Yunaninya dapat berarti keinginan secara umum, tetapi dalam konteks ini bernilai moral negatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: Melalui hal-hal itu
  rationale: διά dengan genetif menyatakan sarana atau perantaraan. Ungkapan ini mempertahankan kaitan dengan ayat sebelumnya tanpa menetapkan secara sempit apa yang menjadi antesedennya.
- source_word: τίμια καὶ μέγιστα
  choice: yang berharga dan sangat besar
  rationale: τίμια menyatakan sesuatu yang berharga, sedangkan bentuk superlatif μέγιστα secara wajar diungkapkan sebagai intensif ‘sangat besar’ dalam bahasa Indonesia.
- source_word: ἡμῖν
  choice: kepada kita
  rationale: Datif ini menyatakan penerima karunia dan paling alami diterjemahkan ‘kepada kita’.
- source_word: ἐπαγγέλματα
  choice: janji-janji
  rationale: ‘Janji-janji’ adalah padanan jelas dan lazim bagi ἐπαγγέλματα dalam konteks ini.
- source_word: δεδώρηται
  choice: Ia telah mengaruniakan
  rationale: Bentuk perfektum menekankan pemberian yang telah berlangsung dan tetap berdampak. ‘Mengaruniakan’ menyampaikan sifat pemberian yang murah hati; subjek tersirat dipulihkan dari konteks ayat sebelumnya.
- source_word: ἵνα
  choice: supaya
  rationale: ‘Supaya’ mempertahankan nuansa tujuan atau hasil yang dimaksudkan.
- source_word: διὰ τούτων
  choice: melalui janji-janji itu
  rationale: τούτων paling dekat menunjuk kepada janji-janji yang baru disebut. Penyebutan ulang nomina membuat hubungan itu jelas dan alami dalam bahasa Indonesia.
- source_word: γένησθε
  choice: kamu dapat menjadi
  rationale: γίνομαι menyatakan proses menjadi, bukan sekadar keadaan. ‘Dapat’ secara alami membawa nuansa subjunktif tanpa menjadikannya sekadar kemungkinan yang lemah.
- source_word: θείας κοινωνοὶ φύσεως
  choice: orang-orang yang mengambil bagian dalam kodrat ilahi
  rationale: κοινωνοί menyatakan pihak yang berbagi atau berpartisipasi. ‘Mengambil bagian dalam’ alami dan mudah dipahami, sedangkan ‘kodrat ilahi’ mempertahankan kekuatan dan keterbukaan ungkapan Yunani.
- source_word: ἀποφυγόντες
  choice: setelah melepaskan diri
  rationale: Partisipel aoris menunjuk pada tindakan yang mendahului atau menyertai tindakan utama. ‘Setelah melepaskan diri’ menyatakan hubungan itu dengan jelas tanpa mengubahnya menjadi klausa utama.
- source_word: φθορᾶς
  choice: kerusakan
  rationale: φθορά dapat menunjuk pada pembusukan, kehancuran, atau kerusakan moral. ‘Kerusakan’ mempertahankan keluasan makna sambil sesuai dengan konteks etis.
- source_word: ἐν τῷ κόσμῳ
  choice: yang ada di dunia
  rationale: Klausa relatif ini memperjelas bahwa frasa tersebut menerangkan kerusakan, sesuai susunan Yunani.
- source_word: ἐν ἐπιθυμίᾳ
  choice: karena keinginan berdosa
  rationale: ἐν dapat menyatakan lingkungan atau sarana, sedangkan ἐπιθυμία secara leksikal berarti keinginan. Dalam konteks kerusakan dunia, keinginan itu jelas bernilai moral negatif; ‘berdosa’ menyatakan daya konteks tersebut tanpa membatasinya hanya pada nafsu seksual.
theological_decisions:
- issue: θείας κοινωνοὶ φύσεως dan partisipasi dalam yang ilahi
  choice: orang-orang yang mengambil bagian dalam kodrat ilahi
  alternative: orang-orang yang turut serta dalam kodrat ilahi
  rationale: Terjemahan mempertahankan pernyataan kuat tentang partisipasi tanpa mengembangkannya menjadi rumusan doktrinal tertentu atau melemahkannya. Catatan menjelaskan batas makna yang melekat pada gagasan ‘mengambil bagian’, bukan mengganti ungkapan teks.
- issue: Daya moral negatif ἐπιθυμία
  choice: keinginan berdosa
  alternative: keinginan; hawa nafsu
  rationale: Kata Yunani dapat berarti keinginan secara umum, tetapi kaitannya dengan kerusakan dunia memberinya nilai negatif di sini. ‘Keinginan berdosa’ lebih luas dan lebih jelas daripada ‘hawa nafsu’, yang dalam pemakaian modern dapat dipahami terutama secara seksual.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur Yunani, tetapi hubungan rujukan diperjelas secara wajar. Istilah ‘kodrat ilahi’ dipertahankan karena tepat dan teologis tanpa menjadi teknis berlebihan; ‘keinginan berdosa’ dipilih agar jelas bagi pembaca modern.
