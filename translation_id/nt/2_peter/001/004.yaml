revisions:
- from: Melalui hal-hal itu, Ia telah mengaruniakan kepada kita janji-janji yang berharga dan sangat besar, supaya melalui janji-janji itu kamu dapat menjadi orang-orang yang mengambil bagian dalam kodrat ilahi[a], setelah melepaskan diri dari kerusakan yang ada di dunia karena keinginan berdosa.[b]
  to: Melalui hal-hal itu, Ia telah mengaruniakan kepada kita janji-janji yang berharga dan sangat besar, supaya melalui janji-janji itu kamu dapat mengambil bagian dalam kodrat ilahi[a], setelah luput dari kerusakan yang ada di dunia karena keinginan berdosa.[b]
  rationale: Revisi mengganti ungkapan refleksif “melepaskan diri” dengan “luput dari” untuk lebih setia pada ἀποφυγόντες, menyederhanakan predikat partisipasi agar lebih alami, dan menetralkan catatan a agar tidak membatasi makna frasa teologis Yunani di luar yang dinyatakan teks.
