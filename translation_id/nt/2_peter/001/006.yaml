  text: ἐν δὲ τῇ γνώσει τὴν ἐγκράτειαν, ἐν δὲ τῇ ἐγκρατείᾳ τὴν ὑπομονήν, ἐν δὲ τῇ ὑπομονῇ τὴν εὐσέβειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/006.yaml
  text: and in knowledge[a], self-control; and in self-control, steadfastness; and in steadfastness, godliness[b],
translation:
  language: id
  text: dan dalam pengetahuan, penguasaan diri; dan dalam penguasaan diri, ketekunan[a]; dan dalam ketekunan, kesalehan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketabahan”, “keteguhan”, atau “ketekunan yang sabar” (ὑπομονή).
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Yunani memakai susunan eliptis yang meneruskan rangkaian kebajikan dari ayat sebelumnya: setiap sifat dimaksudkan untuk dilengkapi dengan sifat berikutnya.'
    reason: cross_reference
lexical_decisions:
- source_word: γνώσει
  choice: pengetahuan
  rationale: γνῶσις secara langsung berarti pengetahuan; pilihan ini mempertahankan hubungan dengan daftar kebajikan pada ayat sebelumnya tanpa mempersempit maknanya menjadi sekadar pemahaman.
- source_word: ἐγκράτειαν / ἐγκρατείᾳ
  choice: penguasaan diri
  rationale: ἐγκράτεια menunjuk pada kemampuan mengendalikan hasrat dan dorongan diri. “Penguasaan diri” merupakan ungkapan Indonesia modern yang jelas dan lebih mencakup daripada “pengendalian diri” yang dapat terdengar situasional.
- source_word: ὑπομονήν / ὑπομονῇ
  choice: ketekunan
  rationale: ὑπομονή menyatakan keteguhan untuk tetap bertahan di tengah kesukaran. “Ketekunan” alami dalam daftar kebajikan dan tidak membatasi maknanya pada sikap menunggu dengan sabar.
- source_word: εὐσέβειαν
  choice: kesalehan
  rationale: εὐσέβεια menunjuk pada sikap hormat dan bakti kepada Allah yang terwujud dalam kehidupan. “Kesalehan” adalah padanan Indonesia yang lazim dan bermartabat.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: dan dalam ..., ...
  rationale: Konstruksi berulang ini bersifat eliptis dan meneruskan perintah pada ayat sebelumnya untuk melengkapi satu kebajikan dengan kebajikan berikutnya. Bentuk “dalam ..., ...” mempertahankan kepadatan dan pola sumber tanpa menambahkan kata kerja tafsiran.
- source_word: δέ
  choice: dan
  rationale: Dalam rangkaian ini δέ menghubungkan unsur-unsur secara aditif, bukan menyatakan pertentangan.
theological_decisions:
- issue: Sintaksis eliptis dalam rangkaian kebajikan
  choice: Mempertahankan susunan ringkas “dan dalam ..., ...”
  alternative: Mengembangkan menjadi “tambahkanlah kepada ..., ...” atau “dalam ..., tunjukkanlah ...”
  rationale: Bahasa Yunani meneruskan pola penambahan kebajikan dari ayat sebelumnya tanpa mengulangi kata kerjanya. Mempertahankan elipsis menjaga ketegangan dan kepadatan teks serta menghindari penambahan penafsiran yang tidak dinyatakan secara eksplisit.
- issue: Cakupan makna εὐσέβεια
  choice: kesalehan
  alternative: ibadah atau ketaatan kepada Allah
  rationale: “Kesalehan” dapat mencakup sikap hormat kepada Allah beserta kehidupan yang selaras dengannya, tanpa mereduksi istilah ini menjadi kegiatan ibadah atau satu bentuk ketaatan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “dan dalam” sengaja dipertahankan untuk mencerminkan pola retoris Yunani, meskipun susunannya lebih padat daripada prosa Indonesia biasa. Penanda catatan a ditempatkan pada “ketekunan”, yaitu kata yang benar-benar dijelaskan oleh catatan tersebut.
