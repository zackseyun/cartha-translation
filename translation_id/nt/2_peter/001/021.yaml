base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/021.yaml
  text: For prophecy was never brought forth by the will of man[c][b][a], but men spoke from God as they were carried along by the Holy Spirit.
translation:
  language: id
  text: Sebab nubuat tidak pernah dihasilkan oleh kehendak manusia[a], tetapi orang-orang berbicara dari Allah ketika mereka digerakkan oleh Roh Kudus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dibawa forth” atau “dihasilkan.” Kata Yunani ini berbentuk pasif dan berkerabat dengan kata yang diterjemahkan “digerakkan” kemudian dalam ayat ini.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “ketika mereka dibawa terus oleh Roh Kudus.” Ungkapan ini menekankan dorongan dan pengarahan aktif Roh.
    reason: lexical_alternative
lexical_decisions:
- source_word: θελήματι ἀνθρώπου
  choice: oleh kehendak manusia
  rationale: Frasa datif ini menyatakan sarana atau asal dorongan manusiawi. Pilihan ini mempertahankan bentuk tunggal generik tanpa memberi kesan khusus laki-laki.
- source_word: ἠνέχθη
  choice: dihasilkan
  rationale: Bentuk pasif aoris dari φέρω menunjukkan bahwa nubuat tidak muncul atau berasal karena kehendak manusia. 'Dihasilkan' menjaga bentuk pasif dan terdengar alami dalam bahasa Indonesia.
- source_word: προφητεία
  choice: nubuat
  rationale: '''Nubuat'' adalah padanan baku yang dapat mencakup perkataan atau pesan kenabian.'
- source_word: οὐ ... ποτέ
  choice: tidak pernah
  rationale: Ungkapan ini menyampaikan penyangkalan tegas mengenai asal nubuat.
- source_word: ὑπὸ πνεύματος ἁγίου
  choice: oleh Roh Kudus
  rationale: Ὑπό dengan genitif menandai pelaku atau daya penggerak; konteksnya menunjuk secara definitif kepada Roh Kudus.
- source_word: φερόμενοι
  choice: ketika mereka digerakkan
  rationale: Partisipel ini menggambarkan tindakan aktif Roh atas para pembicara. 'Digerakkan' alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan gambaran harfiahnya, 'dibawa'.
- source_word: ἐλάλησαν
  choice: berbicara
  rationale: Padanan langsung dan wajar bagi λαλέω tanpa meninggikan gaya secara tidak perlu.
- source_word: ἀπὸ θεοῦ
  choice: dari Allah
  rationale: Ἀπό menyatakan sumber atau asal, sehingga dibedakan dari ὑπό yang menyatakan pelaku pada frasa tentang Roh Kudus.
- source_word: ἄνθρωποι
  choice: orang-orang
  rationale: Kata ini merujuk kepada para pembicara manusia dan tidak perlu dibuat khusus laki-laki dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan tindakan ilahi dan manusia dalam nubuat
  choice: Nubuat tidak berasal dari kehendak manusia; orang-orang sungguh berbicara, tetapi perkataan mereka berasal dari Allah ketika Roh Kudus menggerakkan mereka.
  alternative: Nubuat didiktekan secara mekanis, atau nubuat sebagian berasal dari prakarsa mandiri manusia.
  rationale: Teks Yunani mempertahankan sekaligus tindakan manusia ('orang-orang berbicara'), sumber ilahi ('dari Allah'), dan pengarahan aktif Roh Kudus ('digerakkan oleh Roh Kudus'). Terjemahan tidak menyelesaikan ketegangan ini ke salah satu ekstrem.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat mempertahankan kontras antara kehendak manusia dan karya Roh Kudus, sambil memakai 'orang-orang' sebagai padanan generik yang alami.
