base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/005.yaml
  text: And for this very reason[a], making every effort, supply in your faith virtue, and in virtue knowledge[d][c][b],
translation:
  language: id
  text: Karena alasan inilah pula, dengan mengerahkan segenap upaya, lengkapilah iman kalian[a] dengan kebajikan[b], dan kebajikan dengan pengetahuan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “iman” juga dapat berarti “kesetiaan” atau “kepercayaan”.
    reason: lexical_alternative
  - marker: b
    text: Atau “keunggulan moral”.
    reason: lexical_alternative
  - marker: c
    text: Kata kerja yang diterjemahkan “lengkapilah ... dengan” juga dapat diterjemahkan “tambahkanlah” atau “sediakanlah”; dalam bahasa Yunani, sifat-sifat ini dirangkaikan dengan ungkapan “dalam iman ... kebajikan, dan dalam kebajikan ... pengetahuan”.
    reason: translation_and_structural_alternative
lexical_decisions:
- source_word: καὶ αὐτὸ τοῦτο δὲ
  choice: Justru karena itu
  rationale: Ungkapan ini menegaskan hubungan dengan ayat sebelumnya. “Justru karena itu” menyampaikan daya transisi dan penekanannya secara wajar dalam bahasa Indonesia.
- source_word: σπουδὴν πᾶσαν παρεισενέγκαντες
  choice: dengan mengerahkan segenap upaya
  rationale: Partisip aoris menyatakan tindakan yang menyertai perintah utama, sedangkan σπουδὴν πᾶσαν menunjuk pada kesungguhan sepenuhnya. Rumusan ini alami dan mempertahankan tuntutan akan usaha yang sungguh-sungguh.
- source_word: ἐπιχορηγήσατε
  choice: lengkapilah ... dengan
  rationale: Kata kerja ini berarti menyediakan atau membekali, bahkan dapat menyiratkan pemberian yang berlimpah. “Lengkapilah ... dengan” menyampaikan gagasan membekali dengan lebih alami daripada “sediakanlah di dalam” dan lebih kaya daripada sekadar “tambahkanlah”.
- source_word: ἐν τῇ πίστει ὑμῶν
  choice: iman kalian dengan
  rationale: Konstruksi ἐν + datif dalam rangkaian ini menyatakan hubungan erat antara sifat yang menjadi dasar dan sifat yang dibekalkan kepadanya. Susunan “lengkapilah iman kalian dengan” alami dalam bahasa Indonesia; “kalian” mempertahankan bentuk jamak ὑμῶν.
- source_word: πίστει
  choice: iman
  rationale: “Iman” merupakan padanan langsung dan lazim bagi πίστις di sini, sementara kemungkinan nuansa “kesetiaan” atau “kepercayaan” dipertahankan dalam catatan kaki.
- source_word: ἀρετήν
  choice: kebajikan
  rationale: ἀρετή menunjuk pada mutu atau keunggulan moral. “Kebajikan” ringkas, bermartabat, dan mudah dipahami; alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: γνῶσιν
  choice: pengetahuan
  rationale: “Pengetahuan” mempertahankan arti inti γνῶσις tanpa mempersempitnya menjadi “pengertian” atau “daya membedakan”.
theological_decisions:
- issue: Makna πίστις dalam daftar sifat
  choice: iman
  alternative: kesetiaan; kepercayaan
  rationale: Konteks mendukung arti lazim “iman”, tetapi rentang makna πίστις dapat mencakup kesetiaan atau kepercayaan. Alternatif tersebut dicatat tanpa menjadikan salah satunya tafsiran wajib.
- issue: Hubungan antarunsur dalam rangkaian ἐν + datif
  choice: lengkapilah ... dengan
  alternative: tambahkanlah ... kepada; sediakanlah ... di dalam
  rationale: Rumusan utama menyajikan rangkaian sifat secara alami sebagai pembekalan atau pelengkapan. Catatan mempertahankan kemungkinan menerjemahkan hubungan itu sebagai penambahan dan mengakui bentuk harfiah “di dalam”.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. “Kalian” dipakai untuk mempertahankan orang kedua jamak dari ὑμῶν. Struktur Yunani yang kaku disusun ulang menjadi pola “lengkapilah ... dengan” agar wajar bagi pembaca umum, sementara bentuk dan alternatif relasinya dijelaskan dalam catatan kaki.
