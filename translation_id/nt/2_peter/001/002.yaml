  text: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/002.yaml
  text: Grace to you and peace be multiplied in the knowledge of God and of Jesus our Lord[a][b].
translation:
  language: id
  text: Kiranya anugerah dan damai sejahtera dilipatgandakan bagi kalian dalam pengenalan akan Allah dan akan Yesus, Tuhan kita.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melalui pengenalan akan Allah dan akan Yesus, Tuhan kita.” Preposisi Yunani dapat menunjukkan lingkup (“dalam”) atau sarana (“melalui/dengan perantaraan”).
    reason: alternative_reading
  - marker: b
    text: Atau, “pengenalan penuh.” Kata Yunani ἐπίγνωσις dapat mengandung arti pengenalan atau pengetahuan yang lebih penuh dan lengkap.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: anugerah
  rationale: Istilah yang alami dan bermartabat dalam bahasa Indonesia untuk kemurahan ilahi, sekaligus mempertahankan bobot teologis ungkapan berkat surat ini.
- source_word: ὑμῖν
  choice: bagi kalian
  rationale: Pronomina ini berbentuk jamak. 'Kalian' menyatakannya dengan jelas dalam bahasa Indonesia modern.
- source_word: εἰρήνη
  choice: damai sejahtera
  rationale: Ungkapan baku ini mencakup baik kedamaian maupun kesejahteraan utuh yang tersirat dalam sapaan tersebut.
- source_word: πληθυνθείη
  choice: kiranya ... dilipatgandakan
  rationale: Bentuk optatif pasif menyatakan harapan atau berkat; susunan ini mempertahankan baik nuansa harapan maupun bentuk pasifnya.
- source_word: ἐν
  choice: dalam
  rationale: Padanan langsung yang mempertahankan kemungkinan makna lingkup, tanpa menutup kemungkinan bahwa preposisi tersebut menyatakan sarana.
- source_word: ἐπιγνώσει
  choice: pengenalan
  rationale: '''Pengenalan'' terdengar relasional dan alami dengan objek pribadi Allah dan Yesus, tanpa secara tegas menambahkan nuansa ''penuh'' atau ''sejati'' yang mungkin tetapi tidak wajib.'
- source_word: τοῦ θεοῦ καὶ Ἰησοῦ
  choice: akan Allah dan akan Yesus
  rationale: Pengulangan 'akan' memperjelas bahwa Allah dan Yesus sama-sama menjadi objek pengenalan, tanpa mengubah hubungan gramatikal Yunani.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Tuhan kita
  rationale: '''Tuhan'' mempertahankan bobot kristologis κύριος dan merupakan sebutan Perjanjian Baru yang lazim; ''kita'' mencerminkan bentuk jamak inklusif ἡμῶν.'
theological_decisions:
- issue: Arti ἐν sebelum ἐπιγνώσει
  choice: dalam pengenalan
  alternative: melalui pengenalan / dengan perantaraan pengenalan
  rationale: ἐν dapat menunjukkan lingkup maupun sarana. Teks utama memakai padanan formal 'dalam', sedangkan kemungkinan instrumental dipertahankan dalam catatan kaki.
- issue: Nuansa ἐπίγνωσις
  choice: pengenalan
  alternative: pengenalan penuh / pengetahuan penuh
  rationale: Kata ini dapat menyiratkan pengenalan yang lebih penuh atau lengkap, tetapi konteks langsung tidak mengharuskan nuansa penguatan itu dinyatakan dalam teks utama. Alternatifnya dicatat agar ketegangan leksikal tetap terbuka.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. 'Kiranya' menandai rumusan berkat; 'kalian' mempertahankan jamaknya ὑμῖν secara jelas. Penanda catatan kaki ditempatkan sesudah kalimat yang dirujuk.
