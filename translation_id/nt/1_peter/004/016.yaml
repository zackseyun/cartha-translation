  text: εἰ δὲ ὡς Χριστιανός, μὴ αἰσχυνέσθω, δοξαζέτω δὲ τὸν θεὸν ἐν τῷ ⸀ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/016.yaml
  text: But if as a Christian[a], let him not be ashamed, but let him glorify God in this name.
translation:
  language: id
  text: Namun, jika ia menderita sebagai orang Kristen, janganlah ia malu; sebaliknya, hendaklah ia memuliakan Allah dalam nama itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam nama itu.” Ungkapan ini kemungkinan merujuk pada sebutan “orang Kristen”; dapat juga dipahami sebagai “dalam hal ini” atau “karena nama itu.”
    reason: Menjaga ambiguitas fungsi ἐν sambil mempertahankan hubungan eksplisit antara ὄνομα (“nama”) dan Χριστιανός (“orang Kristen”).
lexical_decisions:
- source_word: εἰ δὲ
  choice: Namun, jika
  rationale: Menyampaikan syarat εἰ dan daya kontras ringan δέ secara alami dalam bahasa Indonesia.
- source_word: ὡς Χριστιανός
  choice: sebagai orang Kristen
  rationale: Χριστιανός adalah sebutan yang sudah mapan. Kata 'menderita' dipahami secara eliptis dari konteks ayat sebelumnya dan perlu dinyatakan agar klausa Indonesia lengkap dan jelas.
- source_word: μὴ αἰσχυνέσθω
  choice: janganlah ia merasa malu
  rationale: Mempertahankan daya imperatif orang ketiga dari bentuk kini αἰσχυνέσθω dengan ungkapan Indonesia yang wajar.
- source_word: δοξαζέτω δὲ τὸν θεόν
  choice: Sebaliknya, hendaklah ia memuliakan Allah
  rationale: Mengungkapkan kontras δέ dan mempertahankan daya imperatif δοξαζέτω serta objek langsungnya.
- source_word: ἐν τῷ ὀνόματι τούτῳ
  choice: karena menyandang nama itu
  rationale: Menangkap hubungan ungkapan tersebut dengan sebutan 'orang Kristen' dalam bahasa Indonesia yang alami, sambil mempertahankan unsur 'nama'. Arti harfiah dan kemungkinan alternatif dicatat dalam catatan kaki.
theological_decisions:
- issue: Rujukan dan fungsi ἐν τῷ ὀνόματι τούτῳ
  choice: Dipahami terutama sebagai memuliakan Allah karena menyandang nama 'orang Kristen'.
  alternative: “dalam nama itu” atau “dalam hal ini”
  rationale: Χριστιανός merupakan rujukan terdekat bagi ὄνομα. Namun, cakupan preposisi ἐν tetap dapat dipahami secara lokatif, instrumental, atau berkaitan dengan keadaan; karena itu alternatif tidak dihapus, melainkan dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan khidmat. Bentuk 'hendaklah' mempertahankan nuansa nasihat imperatif, sedangkan 'menyandang nama' mengungkapkan identitas sosial-keagamaan tanpa memasukkan tafsiran denominasi.
