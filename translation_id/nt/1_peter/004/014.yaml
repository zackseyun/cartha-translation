  text: εἰ ὀνειδίζεσθε ἐν ὀνόματι Χριστοῦ, μακάριοι, ὅτι τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα ἐφ’ ὑμᾶς ⸀ἀναπαύεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/014.yaml
  text: If you are insulted in the name of Messiah[a], you are blessed[b], because the Spirit of glory and of God rests upon you.
translation:
  language: id
  text: Jika kamu dihina karena nama Mesias[a], kamu berbahagia, sebab Roh kemuliaan—Roh Allah[b]—berdiam di atas kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: Kristus; kata ini berarti “Yang Diurapi” dan berfungsi sebagai gelar, yakni Mesias.'
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani menyebut satu Roh dalam ungkapan yang padat. Ungkapan ini juga dapat dipahami sebagai “Roh Allah yang mulia” atau “Roh kemuliaan, yaitu Roh Allah.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὀνειδίζεσθε
  choice: dihina
  rationale: Bentuk pasif kini ini menunjuk pada perlakuan berupa celaan, penghinaan, atau penistaan. “Dihina” alami dalam bahasa Indonesia modern dan mempertahankan dimensi aib sosial.
- source_word: ἐν ὀνόματι Χριστοῦ
  choice: karena nama Mesias
  rationale: Dalam konteks ini, frasa tersebut menyatakan bahwa penghinaan dialami karena keterkaitan dengan nama dan identitas Mesias. “Karena” menyampaikan hubungan sebab dengan wajar, sedangkan “nama” tetap dipertahankan.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar, sehingga “Mesias” mempertahankan makna gelarnya dan bukan sekadar memperlakukannya sebagai nama diri.
- source_word: μακάριοι
  choice: kamu berbahagia
  rationale: Ungkapan ini menyatakan keadaan yang diperkenan dan diberkati Allah, bukan sekadar perasaan senang. “Berbahagia” merupakan bentuk yang wajar dan bernuansa ucapan bahagia dalam bahasa Alkitab Indonesia.
- source_word: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: Roh kemuliaan dan Roh Allah
  rationale: Rumusan ini mempertahankan kedua keterangan genitif dalam ungkapan Yunani yang padat. Pengulangan “Roh” diperlukan agar bahasa Indonesia dapat dibaca secara wajar, sementara catatan kaki menjelaskan bahwa teks Yunani tetap menunjuk kepada satu Roh dan memungkinkan beberapa hubungan sintaksis.
- source_word: δόξης
  choice: kemuliaan
  rationale: “Kemuliaan” adalah padanan baku yang mempertahankan kaitannya dengan kehadiran dan keagungan ilahi.
- source_word: ἀναπαύεται
  choice: berdiam di atas
  rationale: Kata kerja ini berarti beristirahat, menetap, atau tinggal pada seseorang. “Berdiam di atas” cukup alami, mempertahankan gambaran Roh yang menetap, dan menggemakan bahasa profetis tentang Roh yang turun dan tinggal atas seseorang.
theological_decisions:
- issue: Hubungan sintaksis dalam τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: Roh kemuliaan dan Roh Allah
  alternative: Roh Allah yang mulia; atau, Roh kemuliaan, yaitu Roh Allah
  rationale: Bahasa Yunani memakai satu kata “Roh” dalam konstruksi yang padat dengan dua unsur berartikel. Terjemahan utama mempertahankan kedua keterangan tanpa memastikan apakah keduanya sejajar atau yang kedua menjelaskan yang pertama. Catatan kaki mencegah pengulangan “Roh” dalam bahasa Indonesia disalahpahami sebagai dua Roh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. “Kamu” dipakai sebagai sapaan jamak sesuai ὑμᾶς. Susunan kalimat dibuat langsung dan mudah dipahami, sementara ambiguitas teologis dalam sebutan bagi Roh dipertahankan melalui teks utama dan dijelaskan dalam catatan kaki.
