id: 1PE.4.17
reference: 1 Peter 4:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ· εἰ δὲ πρῶτον ἀφ’ ἡμῶν, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/017.yaml
  text: For it is time for judgment to begin from the household of God[a]; and if it begins first from us[c][b], what will be the outcome for those who disobey the gospel of God?
translation:
  language: id
  text: Sebab sekaranglah waktunya penghakiman dimulai dari keluarga Allah[a]. Dan jika penghakiman itu pertama-tama dimulai dari kita, bagaimanakah kesudahan[b] orang-orang yang tidak menaati[c] Injil Allah?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rumah Allah.” Kata Yunani οἶκος dapat berarti “rumah” atau “keluarga seisi rumah”; di sini tampaknya menunjuk kepada umat Allah sebagai keluarga-Nya.
    reason: lexical_alternative
  - marker: b
    text: Atau “akhir,” “hasil,” atau “akibat.” Kata Yunani τέλος dapat berarti akhir, hasil, atau kesudahan.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “tidak menaati” juga dapat diterjemahkan “menolak untuk percaya,” sebab kata Yunani ini dapat menyatakan baik ketidaktaatan maupun ketidakpercayaan sebagai respons terhadap Injil.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi nasihat dalam konteks sebelumnya; “Sebab” merupakan penghubung kausal yang alami dan bermartabat.
- source_word: ὁ καιρός
  choice: sudah tiba waktunya
  rationale: καιρός menunjuk pada waktu yang tepat atau telah ditetapkan. Ungkapan ini menyampaikan bahwa saat tersebut kini telah tiba, bukan sekadar waktu kronologis.
- source_word: τοῦ ἄρξασθαι
  choice: dimulai
  rationale: Infinitif artikular melengkapi gagasan καιρός. Bentuk pasif alami dalam bahasa Indonesia tetap mempertahankan isi bahwa penghakiman mulai berlangsung.
- source_word: τὸ κρίμα
  choice: penghakiman
  rationale: Pilihan ini mempertahankan cakupan tindakan penilaian Allah tanpa mempersempitnya menjadi penghukuman atau disiplin saja.
- source_word: ἀπὸ τοῦ οἴκου τοῦ θεοῦ
  choice: dari keluarga Allah
  rationale: οἶκος dapat berarti rumah atau keluarga seisi rumah. Konteks dan frasa berikutnya “dari kita” menunjuk kepada umat Allah; “keluarga Allah” mengungkapkan makna komunal secara alami.
- source_word: εἰ δὲ πρῶτον ἀφ’ ἡμῶν
  choice: Dan jika penghakiman itu pertama-tama dimulai dari kita
  rationale: Kata kerja dan subjeknya dinyatakan kembali dari klausa sebelumnya agar jelas dalam bahasa Indonesia. “Dari” mempertahankan pengulangan ἀπό.
- source_word: τί τὸ τέλος
  choice: bagaimana kesudahan
  rationale: τέλος dapat berarti akhir, hasil, atau kesudahan. “Bagaimana kesudahan” alami untuk pertanyaan retoris ini dan tetap membuka nuansa hasil akhir maupun nasib.
- source_word: τῶν ἀπειθούντων
  choice: orang-orang yang tidak menaati
  rationale: Partisipel ini menyatakan ketidaktaatan yang, dalam kaitannya dengan Injil, juga dapat mencakup penolakan untuk percaya; alternatif tersebut dicatat dalam catatan kaki.
- source_word: τῷ τοῦ θεοῦ εὐαγγελίῳ
  choice: Injil Allah
  rationale: Genitif menyatakan Injil yang berasal dari atau menjadi milik Allah. “Injil Allah” ringkas, lazim, dan mempertahankan bobot formal frasa Yunani.
theological_decisions:
- issue: Hakikat κρίμα bagi umat Allah
  choice: Diterjemahkan “penghakiman” tanpa ditentukan sebagai penghukuman atau disiplin.
  alternative: “penghukuman” atau “pendisiplinan”
  rationale: Istilah yang lebih sempit akan menyelesaikan ketegangan yang dibiarkan teks. “Penghakiman” mencakup tindakan penilaian Allah terhadap umat-Nya sekaligus memungkinkan kontras dengan kesudahan mereka yang tidak menaati Injil.
- issue: Rujukan οἶκος τοῦ θεοῦ
  choice: Dipahami sebagai umat Allah dan diterjemahkan “keluarga Allah.”
  alternative: “rumah Allah,” yang dapat dipahami sebagai bangunan atau bait
  rationale: Klausa “dari kita” menegaskan rujukan personal-komunal, selaras dengan gambaran orang percaya sebagai rumah rohani dalam 1 Petrus 2:5.
- issue: Nuansa ἀπειθέω dalam respons terhadap Injil
  choice: Teks utama memakai “tidak menaati,” dengan nuansa penolakan untuk percaya dicatat.
  alternative: “tidak percaya” atau “menolak untuk percaya”
  rationale: Bahasa Yunani dapat memadukan ketidakpercayaan dan ketidaktaatan. Pilihan utama mempertahankan daya moral verba, sedangkan catatan kaki menjaga ambiguitas leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada kitab suci yang jelas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan pengulangan “dimulai dari” dan pertanyaan retoris teks sumber. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
