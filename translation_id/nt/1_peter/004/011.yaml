id: 1PE.4.11
reference: 1 Peter 4:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἴ τις λαλεῖ, ὡς λόγια θεοῦ· εἴ τις διακονεῖ, ὡς ἐξ ἰσχύος ⸀ἧς χορηγεῖ ὁ θεός· ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς διὰ Ἰησοῦ Χριστοῦ, ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/011.yaml
  text: If anyone speaks[a], let it be as the utterances of God; if anyone serves, let it be from the strength that God supplies, so that in everything God may be glorified through Jesus the Messiah, to whom belong the glory and the dominion forever and ever[e][d][c][b]. Amen.
translation:
  language: id
  text: Jika seseorang berbicara, hendaklah ia berbicara sebagai orang yang menyampaikan firman Allah[a]; jika seseorang melayani, hendaklah ia melayani dari kekuatan yang Allah sediakan[b], supaya dalam segala sesuatu Allah dimuliakan melalui Yesus Sang Mesias. Bagi Dialah kemuliaan dan kuasa untuk selama-lamanya[c][d]. Amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebagai ucapan-ucapan Allah.” Kata Yunani λόγια menunjuk pada perkataan atau sabda ilahi.
    reason: lexical_alternative
  - marker: b
    text: Kata depan Yunani menekankan bahwa Allah adalah sumber kekuatan itu.
    reason: previous_rendering
  - marker: c
    text: Kata “Dia” paling wajar merujuk kepada Yesus Sang Mesias sebagai tokoh yang disebut paling dekat, meskipun sebagian orang memahaminya sebagai rujukan kepada Allah karena klausa sebelumnya berbicara tentang Allah yang dimuliakan.
    reason: alternative_reading
  - marker: d
    text: Secara harfiah, “sampai zaman segala zaman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλεῖ
  choice: berbicara
  rationale: Padanan luas dan alami untuk tindakan berkata-kata; tidak mempersempit maknanya hanya pada khotbah.
- source_word: λόγια θεοῦ
  choice: firman Allah
  rationale: λόγια menunjuk pada perkataan atau sabda ilahi. 'Firman Allah' terdengar wajar dan luhur dalam bahasa Indonesia, sementara catatan kaki mempertahankan nuansa 'ucapan-ucapan ilahi'.
- source_word: διακονεῖ
  choice: melayani
  rationale: Mencakup pelayanan secara luas tanpa membatasinya pada jabatan gerejawi resmi.
- source_word: ἐξ ἰσχύος ἧς χορηγεῖ ὁ θεός
  choice: dengan kekuatan yang Allah sediakan
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menyatakan bahwa kekuatan untuk melayani berasal dari penyediaan Allah; catatan kaki mempertahankan bentuk sumber yang lebih harfiah.
- source_word: ἐν πᾶσιν
  choice: dalam segala sesuatu
  rationale: Mempertahankan cakupan luas frasa Yunani secara jelas dan bermartabat.
- source_word: δοξάζηται
  choice: dimuliakan
  rationale: Mempertahankan bentuk pasif serta daya tujuan dari klausa yang diperkenalkan oleh ἵνα.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: melalui Yesus Sang Mesias
  rationale: διά diterjemahkan 'melalui', sedangkan Χριστός dipertahankan sebagai gelar 'Sang Mesias' dalam susunan Indonesia yang idiomatis.
- source_word: κράτος
  choice: kuasa
  rationale: Dalam doksologi, kata ini menyatakan kekuatan atau kekuasaan yang berdaulat. 'Kuasa' alami dan tetap mempertahankan nuansa luhur.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: untuk selama-lamanya
  rationale: Padanan idiomatis Indonesia bagi ungkapan Yunani tentang durasi tanpa akhir.
theological_decisions:
- issue: Rujukan ᾧ dalam doksologi penutup
  choice: '''Bagi Dialah'' ditempatkan sebagai kalimat baru dengan rujukan terdekat, yaitu Yesus Sang Mesias.'
  alternative: Kata ganti itu dapat dipahami merujuk kepada Allah dalam klausa sebelumnya.
  rationale: Secara tata bahasa, anteseden terdekat ialah Yesus Sang Mesias, tetapi alur klausa tujuan berpusat pada Allah yang dimuliakan melalui-Nya. Ambiguitas yang sungguh ada dipertahankan dalam catatan kaki.
- issue: Daya ὡς dalam kedua klausa
  choice: Diterjemahkan secara ekshortatif dengan pengulangan 'hendaklah ia berbicara/melayani'.
  alternative: 'Bentuk eliptis yang lebih harfiah: ''Jika seseorang berbicara, seperti firman Allah; jika seseorang melayani, seperti dari kekuatan ...''.'
  rationale: Bahasa Yunani membiarkan verba pembanding tersirat, sedangkan bahasa Indonesia memerlukan pelengkap agar seruan terbaca alami. Bentuk 'hendaklah' menyampaikan daya nasihat tanpa menambahkan tuntutan teologis baru.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam Kitab Suci yang luhur tetapi mudah dipahami. Pengulangan verba setelah 'hendaklah' dipakai untuk memperjelas elipsis Yunani. 'Sang Mesias' mempertahankan Χριστός sebagai gelar, bukan sekadar unsur nama.
