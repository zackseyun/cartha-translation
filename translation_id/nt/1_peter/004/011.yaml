revisions:
- from: Jika seseorang berbicara, hendaklah ia berbicara seolah-olah menyampaikan firman Allah[a]; jika seseorang melayani, hendaklah ia melayani dengan kekuatan yang Allah sediakan[b], supaya dalam segala sesuatu Allah dimuliakan melalui Yesus Sang Mesias. Bagi Dialah kemuliaan dan kuasa untuk selama-lamanya[c][d]. Amin.
  to: Jika seseorang berbicara, hendaklah ia berbicara sebagai orang yang menyampaikan firman Allah[a]; jika seseorang melayani, hendaklah ia melayani dari kekuatan yang Allah sediakan[b], supaya dalam segala sesuatu Allah dimuliakan melalui Yesus Sang Mesias. Bagi Dialah kemuliaan dan kuasa untuk selama-lamanya[c][d]. Amin.
  rationale: Mengganti “seolah-olah menyampaikan” dengan “sebagai orang yang menyampaikan” menghilangkan implikasi yang tidak didukung sumber sambil mempertahankan daya nasihat dari konstruksi eliptis. Mengganti “dengan kekuatan” dengan “dari kekuatan” memperjelas asal ilahi kekuatan pelayanan. Catatan kaki a diselaraskan dengan bentuk Yunani dan teks utama.
