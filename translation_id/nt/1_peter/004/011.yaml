    issue: “seolah-olah menyampaikan firman Allah” untuk ὡς λόγια θεοῦ
    rationale: “Seolah-olah” lazimnya berarti ‘as if’ dan dapat mengisyaratkan bahwa tindakan itu hanya tampak demikian. ὡς di sini menuntut standar atau cara berbicara yang selaras dengan ucapan Allah, tanpa implikasi tersebut.
  - severity: low
    issue: “dengan kekuatan” kurang langsung menyatakan sumber ἐξ
    rationale: Walaupun dapat diterima dan telah dijelaskan dalam catatan kaki, “dari kekuatan” lebih transparan merepresentasikan bahwa kekuatan itu bersumber dari Allah.
