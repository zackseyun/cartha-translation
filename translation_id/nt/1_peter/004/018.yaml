  text: καὶ εἰ ὁ δίκαιος μόλις σῴζεται, ⸀ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/018.yaml
  text: And if the righteous is scarcely saved[b][a], where will the ungodly and the sinner appear?
translation:
  language: id
  text: Dan jika orang benar diselamatkan hanya dengan susah payah[a], di manakah orang fasik dan orang berdosa akan muncul[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nyaris tidak diselamatkan” atau “dengan sulit diselamatkan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “akan ditemukan.”
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιος
  choice: orang benar
  rationale: Adjektiva substantival tunggal dengan artikel ini menunjuk secara representatif kepada orang yang benar. “Orang benar” alami dalam bahasa Indonesia dan mempertahankan bentuk tunggal pepatah.
- source_word: μόλις
  choice: dengan susah payah
  rationale: Kata ini menyatakan kesulitan atau keadaan yang nyaris. Dalam konteks penderitaan dan penghakiman, “dengan susah payah” mempertahankan gagasan bahwa keselamatan dilalui melalui ujian berat tanpa menyatakan bahwa hasil akhirnya tidak pasti.
- source_word: σῴζεται
  choice: diselamatkan
  rationale: Bentuk kini pasif/medial dari σῴζω. Bentuk pasif Indonesia ini ringkas, alami, dan sesuai dengan pernyataan bernada pepatah.
- source_word: ἀσεβής
  choice: orang fasik
  rationale: Istilah ini menyatakan orang yang tidak menghormati Allah dan hidup tanpa kesalehan. “Orang fasik” mempertahankan dimensi moral-keagamaannya.
- source_word: ἁμαρτωλός
  choice: orang berdosa
  rationale: Padanan yang lazim dan tepat; dipertahankan sebagai sebutan tersendiri agar tidak melebur dengan ἀσεβής.
- source_word: ποῦ
  choice: di manakah
  rationale: Mempertahankan pertanyaan langsung dan daya retoris teks Yunani.
- source_word: φανεῖται
  choice: akan muncul
  rationale: Bentuk mendatang medial dari φαίνω secara langsung berarti “akan muncul” atau “akan tampak”. Padanan ini mempertahankan ungkapan retoris dan gema Amsal 11:31 LXX.
theological_decisions:
- issue: Makna μόλις σῴζεται
  choice: Keselamatan orang benar berlangsung dengan kesukaran besar dalam konteks penderitaan dan penghakiman.
  alternative: Orang benar nyaris tidak diselamatkan sehingga hasil akhir keselamatannya tidak pasti.
  rationale: Konteks 1 Petrus 4 membahas penderitaan, penghakiman yang dimulai dari rumah Allah, dan ketekunan. Terjemahan mempertahankan ketegangan ungkapan Yunani tanpa menjadikannya pernyataan tentang ketidakpastian keselamatan akhir.
- issue: Bentuk tunggal representatif δίκαιος
  choice: orang benar
  alternative: orang-orang benar
  rationale: Bahasa Yunani memakai bentuk tunggal maskulin dengan daya representatif. Bentuk tunggal mempertahankan gaya pepatah dan tidak memperluas teks menjadi bentuk jamak.
- issue: Daya retoris φανεῖται
  choice: akan muncul
  alternative: akan ditemukan
  rationale: “Akan muncul” lebih langsung mengikuti verba Yunani dan membiarkan pertanyaan mengenai kedudukan orang fasik serta orang berdosa tetap terbuka, sedangkan “akan ditemukan” merupakan penafsiran yang juga mungkin.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Ungkapan “orang benar”, “orang fasik”, dan “orang berdosa” mempertahankan gaya peribahasa serta pembedaan istilah Yunani. Partikel “saja” menonjolkan logika argumentasi: jika bahkan orang benar mengalami kesukaran demikian.'
