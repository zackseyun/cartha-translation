base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/007.yaml
  text: But the end of all things has drawn near[b][a]. Therefore be self-controlled and sober-minded for prayers.
translation:
  language: id
  text: Namun, akhir segala sesuatu sudah dekat.[a] Karena itu, kuasailah diri dan tetaplah berpikiran jernih agar kamu dapat berdoa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “telah mendekat.” Bentuk perfektum Yunani dapat menekankan bahwa akhir itu telah mendekat dan kini sudah dekat.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “berpikirlah dengan waras dan tetaplah sadar untuk doa-doa.” Kedua perintah itu menekankan penilaian yang waras dan kejernihan atau kesiagaan rohani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντων
  choice: segala sesuatu
  rationale: Bentuk genitif netral jamak ini secara alami melengkapi τὸ τέλος dan menghasilkan ungkapan menyeluruh, tanpa membatasi rujukannya.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan ringan yang bernuansa kontras dengan konteks sebelumnya; 'Namun' wajar dan cukup lembut dalam bahasa Indonesia.
- source_word: τὸ τέλος
  choice: kesudahan
  rationale: Dalam konteks eskatologis, kata ini menunjuk pada akhir atau penyelesaian. 'Kesudahan' mempertahankan bobot eskatologisnya dan terdengar dignified dalam ragam Alkitab Indonesia.
- source_word: ἤγγικεν
  choice: sudah dekat
  rationale: Bentuk perfektum menyatakan bahwa sesuatu telah mendekat dan kini berada dalam keadaan dekat. 'Sudah dekat' menyampaikan hasil kini itu dengan idiom Indonesia yang alami.
- source_word: σωφρονήσατε
  choice: kuasailah dirimu
  rationale: Imperatif ini menuntut penilaian yang waras dan pengendalian diri. Ungkapan ini alami serta mencakup disiplin pikiran dan perilaku.
- source_word: οὖν
  choice: Karena itu
  rationale: Ungkapan ini dengan jelas menandai kesimpulan praktis yang ditarik dari dekatnya kesudahan.
- source_word: νήψατε
  choice: berjaga-jagalah
  rationale: 'Dalam pemakaian Perjanjian Baru kata ini bersifat kiasan: waspada, sadar, dan tidak lengah. ''Berjaga-jagalah'' mempertahankan unsur kewaspadaan rohani tanpa membatasinya pada pantang minuman keras.'
- source_word: εἰς προσευχάς
  choice: supaya kamu dapat berdoa
  rationale: εἰς menyatakan arah atau tujuan kedua imperatif tersebut. Bentuk ini lebih alami dalam bahasa Indonesia daripada 'untuk doa-doa', sedangkan 'berdoa' dapat mencakup tindakan doa yang berulang.
theological_decisions:
- issue: Daya eskatologis ungkapan 'kesudahan segala sesuatu'
  choice: Dipertahankan sebagai pernyataan eskatologis langsung bahwa kesudahan sudah dekat.
  alternative: Menafsirkannya sebagai sekadar tujuan segala sesuatu atau sebagai pernyataan yang sepenuhnya telah terwujud.
  rationale: Teks menghubungkan dekatnya kesudahan dengan panggilan etis untuk menguasai diri, berjaga-jaga, dan berdoa, tetapi tidak menetapkan jadwal atau sistem eskatologi tertentu.
- issue: Hubungan penguasaan diri dan kewaspadaan dengan doa
  choice: Keduanya diterjemahkan sebagai syarat atau tujuan praktis agar pembaca dapat berdoa.
  alternative: Menerjemahkan secara lebih harfiah 'untuk doa-doa' tanpa memperjelas hubungan sintaksisnya.
  rationale: εἰς mendukung nuansa tujuan, sementara terjemahan ini tidak menentukan bentuk atau tata cara doa tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kesudahan' mempertahankan nuansa eskatologis; 'kuasailah dirimu' dan 'berjaga-jagalah' merupakan imperatif yang jelas bagi pembaca umum. Struktur tujuan diungkapkan secara idiomatis dengan 'supaya kamu dapat berdoa'.
