  source_fidelity: 'Secara umum draf mencerminkan unsur-unsur Yunani dengan baik: reaksi terkejut (ξενίζονται), ketidakikutsertaan pembaca dalam perilaku lama (μὴ συντρεχόντων ὑμῶν), gambaran luapan (ἀνάχυσις), dan ujaran bermusuhan (βλασφημοῦντες). Namun, βλασφημοῦντες adalah partisipel yang lebih baik dinyatakan sebagai tindakan yang menyertai reaksi mereka, bukan sebagai peristiwa berurutan melalui “lalu.”'
  naturalness: Bahasa draf pada dasarnya baku dan jelas. “Sambil mencaci kamu” lebih alami sekaligus lebih dekat dengan hubungan partisipial daripada “lalu mereka mencaci kamu.” Susunan “luapan yang sama dari hidup tanpa kendali” membuat hubungan metaforis antara ἀνάχυσις dan ἀσωτία lebih terbaca dalam bahasa Indonesia.
  terminology: “Hidup tanpa kendali” merupakan padanan yang cukup luas bagi ἀσωτία dan tidak secara tidak semestinya membatasi maknanya pada dosa seksual. “Mencaci” sesuai dalam konteks manusia sebagai sasaran βλασφημέω; istilah “menghujat” sebaiknya tidak dipakai sebagai teks utama karena dalam pemakaian Indonesia modern mudah dipahami sebagai penghujatan terhadap Allah.
