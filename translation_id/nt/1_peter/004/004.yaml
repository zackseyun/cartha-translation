    rationale: βλασφημοῦντες adalah partisipel kini dan menggambarkan tindakan yang menyertai reaksi mereka. “Sambil mencaci kamu” mempertahankan hubungan ini secara lebih dekat dan tetap alami.
  - severity: low
    issue: Hubungan “luapan” dengan “hidup tanpa kendali” dapat dibuat lebih jelas.
    rationale: Dalam Yunani, ἀνάχυσις ditentukan oleh genitif τῆς ἀσωτίας. Susunan “luapan yang sama dari hidup tanpa kendali” lebih jelas menunjukkan bahwa luapan itu adalah gambaran bagi kehidupan yang tidak terkendali.
