  text: ἐν ᾧ ξενίζονται μὴ συντρεχόντων ὑμῶν εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν, βλασφημοῦντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/004.yaml
  text: In this[a], they are surprised that you do not run with them into the same flood of debauchery[c][b], slandering you.
translation:
  language: id
  text: Dalam hal ini, mereka merasa heran[a] karena kamu tidak ikut berlari bersama mereka ke dalam luapan yang sama dari hidup tanpa kendali[b], sambil mencaci kamu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menganggapnya aneh” atau “tercengang.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ke dalam luapan yang sama dari hidup tanpa kendali.” Ungkapan ini menggambarkan perilaku liar yang berlebihan.
    reason: lexical_alternative
  - marker: c
    text: Atau “menghina kamu,” “memfitnah kamu,” atau “berkata-kata kasar tentang kamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Dalam hal ini
  rationale: Mempertahankan kaitan dengan perubahan cara hidup pada konteks sebelumnya tanpa mempertegas hubungan kausal yang hanya tersirat.
- source_word: ξενίζονται
  choice: mereka merasa heran
  rationale: Mengungkapkan reaksi terkejut dan anggapan bahwa perilaku orang percaya terasa asing; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: μὴ συντρεχόντων ὑμῶν
  choice: karena kamu tidak ikut berlari bersama mereka
  rationale: Mengubah konstruksi genitif absolut menjadi anak kalimat Indonesia yang wajar sambil mempertahankan metafora harfiah 'berlari bersama' dan gagasan ikut serta.
- source_word: εἰς τὴν αὐτὴν
  choice: ke dalam ... yang sama
  rationale: Mempertahankan gambaran gerak menuju atau masuk ke dalam pola kehidupan yang juga dijalani mereka.
- source_word: τῆς ἀσωτίας
  choice: hidup tanpa kendali
  rationale: Menyampaikan perilaku boros, liar, dan tidak terkendali secara moral dalam bahasa yang jelas bagi pembaca modern tanpa mempersempitnya hanya pada penyimpangan seksual.
- source_word: ἀνάχυσιν
  choice: luapan
  rationale: Menjaga metafora pencurahan atau limpahan berlebihan secara lebih dekat daripada sekadar istilah abstrak.
- source_word: βλασφημοῦντες
  choice: lalu mereka mencaci kamu
  rationale: Dalam konteks ini kata tersebut menunjuk pada ucapan menghina terhadap orang percaya, bukan secara khusus penghujatan terhadap Allah. 'Lalu' menghubungkan partisipel dengan klausa utama secara alami tanpa membuatnya sepenuhnya terpisah.
theological_decisions:
- issue: Sasaran dan sifat ujaran dalam βλασφημοῦντες
  choice: mencaci kamu
  alternative: menghujat; memfitnah kamu; berkata-kata buruk
  rationale: Konteks menggambarkan reaksi orang lain terhadap perubahan perilaku orang percaya. 'Mencaci' mempertahankan unsur ujaran kasar dan penghinaan, sedangkan 'menghujat' dalam bahasa Indonesia lazim dipahami sebagai serangan terhadap Allah atau agama dan dapat menyesatkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora 'ikut berlari' serta 'luapan' dipertahankan karena keduanya membentuk gambaran Yunani yang kuat. Kata ganti 'kamu' mengikuti sapaan jamak konteks surat dan dibaca secara kolektif; bahasa Indonesia tidak menandai jumlah pada bentuk ini.
