  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ νεκροῖς εὐηγγελίσθη ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/006.yaml
  text: 'For this is why the gospel was also proclaimed to the dead: so that[a], though judged according to men in the flesh[b], they might live according to God in the spirit.'
translation:
  language: id
  text: 'Sebab, untuk itulah Injil juga diberitakan kepada orang-orang mati: supaya mereka, sekalipun dihakimi menurut manusia dalam daging[a], hidup menurut Allah dalam roh[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berdasarkan ukuran manusia dalam kehidupan jasmani.” Secara harfiah, bahasa Yunani berbunyi “menurut manusia dalam daging,” yang dikontraskan dengan “menurut Allah dalam roh.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam Roh.” Ungkapan ini dapat menunjuk pada ranah kehidupan rohani sebagai lawan dari kehidupan dalam daging; sebagian orang memahaminya secara lebih khusus sebagai kehidupan oleh Roh Kudus.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: untuk tujuan inilah
  rationale: Menjaga daya ungkap tujuan yang mengarah ke depan dan menghubungkan ayat ini dengan pembahasan sebelumnya tanpa menentukan secara berlebihan hubungan logisnya.
- source_word: νεκροῖς
  choice: kepada orang-orang mati
  rationale: Adjektiva datif jamak yang dipakai sebagai nomina; terjemahan ini netral dan tidak menetapkan kapan atau dalam arti apa mereka disebut mati.
- source_word: εὐηγγελίσθη
  choice: Injil juga diberitakan
  rationale: Bentuk pasif dari εὐαγγελίζω menyatakan penyampaian kabar baik; 'Injil diberitakan' alami dalam bahasa Indonesia dan mempertahankan makna evangelistiknya.
- source_word: ἵνα
  choice: supaya
  rationale: Menyampaikan fungsi tujuan atau hasil yang dimaksud dalam klausa berikutnya.
- source_word: κριθῶσι μὲν ... ζῶσι δὲ
  choice: sekalipun mereka dihakimi ... mereka hidup
  rationale: Mengungkapkan kontras μὲν...δὲ secara alami sebagai hubungan konsesif, sambil mempertahankan bentuk pasif 'dihakimi' dan hasil 'hidup'.
- source_word: κατὰ ἀνθρώπους
  choice: menurut manusia
  rationale: Mempertahankan kesejajaran langsung dengan κατὰ θεὸν dan tidak mempersempitnya hanya menjadi penilaian manusia atau ukuran manusia; alternatif yang lebih idiomatis dicatat dalam catatan kaki.
- source_word: σαρκὶ
  choice: dalam daging
  rationale: Mempertahankan istilah konkret dan kontrasnya dengan πνεύματι, tanpa memasukkan gagasan 'tabiat berdosa' yang tidak dinyatakan di sini.
- source_word: κατὰ θεὸν
  choice: menurut Allah
  rationale: Menjaga kesejajaran dan ketegangan dengan 'menurut manusia' tanpa menentukan apakah yang dimaksud terutama standar, kehendak, atau perspektif Allah.
- source_word: πνεύματι
  choice: dalam roh
  rationale: Diterjemahkan sebagai ranah kehidupan yang berlawanan dengan 'dalam daging'; huruf kecil dipakai karena teks tidak secara eksplisit mengidentifikasikannya sebagai Roh Kudus.
theological_decisions:
- issue: Identitas 'orang-orang mati'
  choice: Dibiarkan netral sebagai 'orang-orang mati'.
  alternative: Mereka yang sekarang sudah mati tetapi mendengar Injil semasa hidup; orang yang mati secara rohani; atau orang mati yang dikaitkan dengan pemberitaan dalam 3:19.
  rationale: Bahasa Yunani tidak menjelaskan kapan Injil diberitakan kepada mereka atau dalam arti apa mereka mati. Terjemahan tidak menetapkan salah satu penafsiran yang diperdebatkan.
- issue: Makna penghakiman dalam daging dan kehidupan dalam roh
  choice: Kontras 'dihakimi menurut manusia dalam daging' dan 'hidup menurut Allah dalam roh' dipertahankan.
  alternative: Dihukum oleh manusia dalam kehidupan jasmani; mengalami kematian jasmani yang berlaku bagi manusia; atau mengalami penghakiman dalam ranah daging tetapi hidup secara rohani di hadapan Allah.
  rationale: Susunan Yunani memungkinkan beberapa penjelasan yang berdekatan. Terjemahan mempertahankan kesejajaran dan ketegangan teologisnya tanpa menentukan pelaku penghakiman atau sifat kehidupan secara lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur antitesis sumber dipertahankan meskipun ungkapan 'menurut manusia dalam daging' sengaja tetap agak padat; catatan kaki memberi padanan yang lebih idiomatis tanpa menghapus ambiguitas.
