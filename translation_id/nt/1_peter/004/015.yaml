id: 1PE.4.15
reference: 1 Peter 4:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μὴ γάρ τις ὑμῶν πασχέτω ὡς φονεὺς ἢ κλέπτης ἢ κακοποιὸς ἢ ὡς ἀλλοτριεπίσκοπος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/015.yaml
  text: For let none of you suffer as a murderer or a thief or an evildoer or as a meddler[a].
translation:
  language: id
  text: Sebab, janganlah seorang pun di antara kamu menderita sebagai pembunuh, pencuri, pelaku kejahatan, atau orang yang mencampuri urusan orang lain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang suka ikut campur”; secara lebih harfiah, “orang yang mengawasi urusan orang lain,” yaitu orang yang mencampuri perkara yang bukan urusannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γάρ
  choice: Sebab, janganlah
  rationale: γάρ mempertahankan hubungan penjelasan dengan konteks sebelumnya melalui “Sebab”, sedangkan μὴ bersama bentuk imperatif πασχέτω dinyatakan sebagai larangan “janganlah”.
- source_word: τις ὑμῶν
  choice: seorang pun di antara kamu
  rationale: Ungkapan ini mempertahankan makna individual dari τις dan hubungan partitif ὑμῶν; dalam lingkup penyangkalan, “seorang pun” merupakan ungkapan Indonesia yang wajar.
- source_word: πασχέτω
  choice: menderita
  rationale: Kata ini secara luas berarti mengalami penderitaan. Terjemahan “menderita” mempertahankan kaitannya dengan tema penderitaan dalam 1 Petrus tanpa menambahkan gagasan hukuman yang tidak dinyatakan secara eksplisit.
- source_word: ὡς
  choice: sebagai
  rationale: Di sini ὡς menunjukkan sifat atau dasar seseorang mengalami penderitaan, yaitu sebagai pelaku dari perbuatan-perbuatan yang disebutkan.
- source_word: φονεύς
  choice: pembunuh
  rationale: φονεύς menunjuk kepada orang yang melakukan pembunuhan; “pembunuh” lebih tepat daripada istilah umum seperti “orang yang membunuh”.
- source_word: κλέπτης
  choice: pencuri
  rationale: “Pencuri” adalah padanan langsung dan lazim bagi κλέπτης, tanpa memasukkan nuansa perampokan yang tidak dinyatakan.
- source_word: κακοποιός
  choice: pelaku kejahatan
  rationale: Pilihan ini mempertahankan cakupan umum kata tersebut bagi orang yang berbuat jahat, tanpa membatasinya pada status hukum tertentu.
- source_word: ἀλλοτριεπίσκοπος
  choice: orang yang mencampuri urusan orang lain
  rationale: 'Kata majemuk yang langka ini secara harfiah berkaitan dengan mengawasi hal-hal milik orang lain, tetapi dalam daftar keburukan ini bernada negatif: mencampuri perkara yang bukan urusannya. Terjemahan ini menyampaikan makna tersebut secara jelas dalam bahasa Indonesia modern.'
theological_decisions:
- issue: Makna ἀλλοτριεπίσκοπος
  choice: orang yang mencampuri urusan orang lain
  alternative: orang yang suka ikut campur; orang yang mengawasi urusan orang lain
  rationale: Istilah ini langka dan makna tepatnya tidak sepenuhnya pasti. Konteksnya adalah daftar perbuatan tercela yang membuat penderitaan layak disalahkan, sehingga makna campur tangan yang tidak patut paling sesuai. Unsur -ἐπίσκοπος tidak diterjemahkan dengan istilah jabatan gerejawi karena konteks tidak mendukung nuansa tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan langsung. Susunan daftar dibuat ringkas dan alami, sementara istilah terakhir dijelaskan dalam catatan kaki karena ἀλλοτριεπίσκοπος langka dan memiliki ketidakpastian leksikal.
