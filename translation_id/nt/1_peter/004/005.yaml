  yaml_path: translation/nt/1_peter/004/005.yaml
  text: They will give an account to the one who stands ready to judge the living and the dead[a].
translation:
  language: id
  text: Mereka akan memberi pertanggungjawaban kepada dia yang siap menghakimi orang-orang yang hidup dan yang mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang siap untuk menghakimi.” Secara harfiah, ungkapan Yunani itu menggambarkan seseorang yang memiliki kesiapan untuk menghakimi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: Mereka
  rationale: Kata ganti relatif ini merujuk kepada orang-orang yang disebut dalam ayat sebelumnya. Memulai kalimat dengan “Mereka” wajar dalam bahasa Indonesia dan memperjelas rujukannya.
- source_word: ἀποδώσουσιν λόγον
  choice: akan memberi pertanggungjawaban
  rationale: Ungkapan ini berarti memberikan pertanggungjawaban atau menjawab atas perbuatan seseorang. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan nuansa pengadilan.
- source_word: τῷ
  choice: kepada Dia yang
  rationale: Artikel dengan partisip berfungsi sebagai sebutan substantival. “Dia yang” mempertahankan ketidaktersuratan identitas sang hakim tanpa menambahkan nama yang tidak terdapat dalam teks Yunani.
- source_word: ἑτοίμως ἔχοντι κρῖναι
  choice: siap menghakimi
  rationale: Ungkapan Yunani secara harfiah menggambarkan seseorang yang memiliki kesiapan untuk menghakimi. “Siap menghakimi” ringkas, alami, dan mempertahankan kesiapan yang sedang berlangsung.
- source_word: ζῶντας καὶ νεκρούς
  choice: orang yang hidup dan yang mati
  rationale: Pilihan ini mencakup kedua kelompok manusia secara jelas dan mempertahankan cakupan eskatologis ungkapan Yunani.
theological_decisions:
- issue: Identitas Dia yang siap menghakimi orang yang hidup dan yang mati
  choice: Identitas tidak disebutkan secara eksplisit; diterjemahkan “Dia yang”.
  alternative: Allah atau Mesias/Kristus
  rationale: Teks Yunani ayat ini tidak secara eksplisit menamai sang hakim. Perjanjian Baru berbicara tentang Allah sebagai hakim dan juga tentang Mesias yang menghakimi; karena itu terjemahan tidak menyelesaikan ketegangan teologis tersebut melampaui teks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. “Memberi pertanggungjawaban” mempertahankan nuansa yudisial, sedangkan “Dia yang” tidak secara eksplisit menentukan identitas sang hakim.
