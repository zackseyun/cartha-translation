  text: ὥστε καὶ οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ ⸀θεοῦ πιστῷ κτίστῃ παρατιθέσθωσαν τὰς ψυχὰς ⸀αὐτῶν ἐν ἀγαθοποιΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/019.yaml
  text: Therefore[a], let also those who suffer according to the will of God entrust their souls to a faithful Creator in doing good.
translation:
  language: id
  text: Karena itu, hendaklah juga mereka yang menderita sesuai dengan kehendak Allah memercayakan jiwa mereka[a] kepada Pencipta yang setia, sambil berbuat baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hidup mereka” atau “diri mereka”; kata Yunani ini dapat merujuk pada jiwa, hidup, atau diri seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: οἱ πάσχοντες
  choice: mereka yang menderita
  rationale: Partisipel substantival ini menunjuk kepada orang-orang yang mengalami penderitaan, tanpa membatasi penderitaan itu pada satu saat saja.
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ
  choice: sesuai dengan kehendak Allah
  rationale: Mempertahankan gagasan kesesuaian yang dinyatakan oleh κατά tanpa menentukan apakah penderitaan itu diizinkan, ditetapkan, atau dimaksudkan Allah dalam suatu kerangka teologis tertentu.
- source_word: πιστῷ κτίστῃ
  choice: kepada Sang Pencipta yang setia
  rationale: πιστός menyatakan kesetiaan sekaligus sifat dapat dipercaya; sebutan 'Sang Pencipta' secara alami menunjuk kepada Allah dan mempertahankan bobot gelar κτίστης.
- source_word: παρατιθέσθωσαν
  choice: hendaklah ... memercayakan
  rationale: Imperatif medial ini menyatakan penyerahan kepada pemeliharaan atau penjagaan pihak lain; 'memercayakan' jelas dan alami.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: jiwa mereka
  rationale: Mempertahankan padanan langsung dan resonansi ψυχή, sementara cakupan makna 'hidup' atau 'diri' dicatat dalam catatan kaki.
- source_word: ἐν ἀγαθοποιΐᾳ
  choice: sambil terus berbuat baik
  rationale: Mengungkapkan keadaan atau tindakan yang menyertai penyerahan diri kepada Allah; 'terus' mencerminkan praktik kebaikan yang tetap dijalankan di tengah penderitaan tanpa menjadikannya syarat keselamatan.
theological_decisions:
- issue: Hubungan penderitaan dengan kehendak Allah
  choice: menderita sesuai dengan kehendak Allah
  alternative: menderita oleh kehendak Allah
  rationale: Ungkapan ini mempertahankan hubungan kesesuaian dalam teks Yunani tanpa merinci mekanisme kedaulatan, izin, atau penetapan Allah.
- issue: Makna ψυχή dalam konteks
  choice: jiwa mereka
  alternative: hidup mereka; diri mereka
  rationale: Pilihan utama mempertahankan bentuk leksikal dan kedalaman teologis istilah itu, sedangkan keluasan maknanya disajikan dalam catatan kaki agar ambiguitas aslinya tidak hilang.
- issue: Identitas dan sifat κτίστης
  choice: Sang Pencipta yang setia
  alternative: Pencipta yang dapat dipercaya
  rationale: '''Setia'' mempertahankan nuansa πιστός yang mencakup kesetiaan dan keterandalan, sedangkan kapitalisasi dan ''Sang'' menjelaskan bahwa gelar tersebut merujuk kepada Allah tanpa menambahkan doktrin khusus.'
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Susunan kalimat mempertahankan daya imperatif serta hubungan logis dengan ayat-ayat sebelumnya. Penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkan.
