revisions:
- from: Karena itu, hendaklah mereka yang menderita sesuai dengan kehendak Allah memercayakan jiwa mereka[a] kepada Sang Pencipta yang setia, sambil terus berbuat baik.
  to: Karena itu, hendaklah juga mereka yang menderita sesuai dengan kehendak Allah memercayakan jiwa mereka[a] kepada Pencipta yang setia, sambil berbuat baik.
  rationale: Revisi menambahkan padanan ‘juga’ untuk καί, menghapus ‘terus’ yang merupakan penambahan makna, dan memakai ‘Pencipta yang setia’ tanpa ‘Sang’ agar lebih dekat dengan bentuk Yunani. Ambiguitas ψυχή tetap dipelihara melalui catatan kaki.
