  verdict: revise
  source_fidelity: Draf secara umum setia pada struktur dan makna Yunani. Namun, καί (‘juga’) belum diterjemahkan, dan ‘terus’ dalam ‘sambil terus berbuat baik’ menambahkan gagasan keberlangsungan yang tidak dinyatakan secara eksplisit oleh ἐν ἀγαθοποιΐᾳ.
  naturalness: Kalimatnya baku, jelas, dan bernada wajar untuk bahasa Indonesia modern. ‘Sambil berbuat baik’ alami dan cukup menyampaikan keadaan/tindakan yang menyertai penyerahan diri tanpa penambahan ‘terus’.
  terminology: ‘kehendak Allah’, ‘jiwa mereka’, ‘memercayakan’, dan ‘Pencipta yang setia’ merupakan padanan yang baik. Penghilangan ‘Sang’ menjaga ungkapan tetap dekat dengan κτίστῃ yang tidak memakai artikel, sambil kapitalisasi ‘Pencipta’ tetap jelas merujuk kepada Allah dalam konteksnya. Catatan kaki untuk ψυχή tepat dan penandanya ditempatkan pada frasa yang dijelaskan.
  issues:
  - severity: medium
    issue: Kata καί tidak tercermin dalam terjemahan.
    rationale: Dalam ‘ὥστε καὶ οἱ πάσχοντες’, καί menambahkan kelompok ‘mereka yang menderita’ dalam simpulan. ‘Hendaklah juga mereka yang menderita’ menerjemahkan unsur ini secara alami.
  - severity: low
    issue: Kata ‘terus’ menambahkan aspek yang tidak eksplisit.
    rationale: ἐν ἀγαθοποιΐᾳ menyatakan konteks atau cara ‘dalam/dengan berbuat baik’; kata benda tersebut tidak dengan sendirinya menuntut makna ‘terus’. Menghapusnya lebih dekat kepada sumber.
  - severity: low
    issue: ‘Sang’ pada ‘Sang Pencipta’ menambahkan pemastian artikel.
    rationale: Walaupun rujukan kepada Allah jelas dari konteks dan kapitalisasi tepat, κτίστῃ tidak berartikel. ‘Pencipta yang setia’ lebih hemat dan tetap alami dalam bahasa Indonesia.
  revised_text: Karena itu, hendaklah juga mereka yang menderita sesuai dengan kehendak Allah memercayakan jiwa mereka[a] kepada Pencipta yang setia, sambil berbuat baik.
