  text: πρὸ ⸀πάντων τὴν εἰς ἑαυτοὺς ἀγάπην ἐκτενῆ ἔχοντες, ὅτι ἀγάπη ⸀καλύπτει πλῆθος ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/008.yaml
  text: Above all[a], maintain fervent love for one another[c][b], because love covers a multitude of sins.
translation:
  language: id
  text: Yang terutama, hendaklah kamu sungguh-sungguh saling mengasihi,[a] karena kasih menutupi banyak dosa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hendaklah kamu tetap memiliki kasih yang tekun satu sama lain.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan ini menggemakan Amsal 10:12. “Menutupi” juga dapat dipahami dalam arti tidak membesar-besarkan atau tidak mengungkit pelanggaran.
    reason: cross_reference
lexical_decisions:
- source_word: πρὸ πάντων
  choice: Yang terutama
  rationale: Ungkapan ini menyatakan prioritas utama, bukan urutan waktu; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya nasihatnya.
- source_word: τὴν εἰς ἑαυτοὺς ἀγάπην
  choice: kasih ... seorang terhadap yang lain
  rationale: Frasa refleksif dalam konteks jemaat berfungsi timbal balik; pilihan ini menyampaikan kasih yang saling diarahkan di antara mereka.
- source_word: ἐκτενῆ
  choice: sungguh-sungguh
  rationale: Kata ini menggambarkan sesuatu yang direntangkan atau dikerahkan dengan tekun, sehingga dapat mencakup kesungguhan, intensitas, dan ketekunan tanpa mempersempitnya hanya pada emosi yang berkobar.
- source_word: ἔχοντες
  choice: peliharalah
  rationale: Partisipel kini meneruskan rangkaian nasihat dari konteks sebelumnya. Bentuk imperatif alami dalam bahasa Indonesia, sedangkan 'peliharalah' menyiratkan bahwa kasih itu harus terus dijaga dan dijalankan.
- source_word: ὅτι
  choice: karena
  rationale: Menandai alasan bagi nasihat sebelumnya secara jelas dan alami.
- source_word: καλύπτει
  choice: menutupi
  rationale: Mempertahankan metafora sumber dan gema Amsal 10:12 tanpa menetapkan bahwa maksudnya semata-mata menyembunyikan, mengabaikan, atau menghasilkan pengampunan.
- source_word: πλῆθος ἁμαρτιῶν
  choice: banyak dosa
  rationale: Ungkapan Indonesia yang alami dan setara bagi jumlah besar dosa, tanpa kekakuan frasa 'sejumlah besar dosa'.
theological_decisions:
- issue: Makna 'kasih menutupi banyak dosa'
  choice: Metafora 'menutupi' dipertahankan tanpa menentukan dosa siapa atau mekanisme penutupannya.
  alternative: Kasih mengabaikan banyak pelanggaran; kasih mendatangkan pengampunan atas banyak dosa.
  rationale: Ungkapan Yunani bersifat pepatah dan menggemakan Amsal 10:12. Teks tidak mengharuskan satu tafsiran doktrinal tertentu, sehingga metafora perlu dipertahankan agar ketegangan maknanya tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur partisipial Yunani dialihkan menjadi nasihat langsung agar ayat ini alami sebagai kelanjutan konteks, sementara metafora utama tetap dipertahankan.
