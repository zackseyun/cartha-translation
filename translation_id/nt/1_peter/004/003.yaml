  to: Sebab, waktu yang telah berlalu sudah cukup bagi kamu untuk melakukan kehendak orang-orang bukan Yahudi, dengan hidup dalam berbagai perbuatan cabul[a], hawa nafsu, kemabukan[b], pesta pora, pesta minum-minum, dan berbagai praktik penyembahan berhala yang terlarang[c].
