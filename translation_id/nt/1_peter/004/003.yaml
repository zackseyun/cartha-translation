id: 1PE.4.3
reference: 1 Peter 4:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀρκετὸς ⸀γὰρ ὁ παρεληλυθὼς ⸀χρόνος τὸ ⸀βούλημα τῶν ἐθνῶν ⸀κατειργάσθαι, πεπορευμένους ἐν ἀσελγείαις, ἐπιθυμίαις, οἰνοφλυγίαις, κώμοις, πότοις, καὶ ἀθεμίτοις εἰδωλολατρίαις.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/003.yaml
  text: For the time that has passed is enough to have carried out the will of the Gentiles[a], having walked in sensualities, lusts, drunkenness, carousing, drinking parties[c][b], and lawless idolatries.
translation:
  language: id
  text: Sebab, waktu yang telah berlalu sudah cukup bagi kamu untuk melakukan kehendak orang-orang bukan Yahudi, dengan hidup dalam berbagai perbuatan cabul[a], hawa nafsu, kemabukan[b], pesta pora, pesta minum-minum, dan berbagai praktik penyembahan berhala yang terlarang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berbagai perbuatan tak tahu malu.” Kata Yunaninya menunjuk pada perilaku tanpa malu dan pemuasan diri yang tak terkendali, sering kali dalam ranah seksual.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “berbagai pesta mabuk.” Bentuk Yunaninya dapat menekankan kejadian atau kebiasaan mabuk yang berulang.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “berbagai praktik penyembahan berhala yang melanggar hukum.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρκετὸς γὰρ ὁ παρεληλυθὼς χρόνος
  choice: Sebab pada waktu yang telah berlalu, kamu sudah cukup lama
  rationale: Susunan ini mengungkapkan secara alami bahwa masa lampau itu telah lebih dari cukup, sambil mempertahankan fungsi penjelas γάρ melalui 'Sebab'.
- source_word: τὸ βούλημα τῶν ἐθνῶν
  choice: kehendak orang-orang bukan Yahudi
  rationale: βούλημα berarti kehendak atau maksud; dalam konteks ini ἔθνη menunjuk kepada kalangan non-Yahudi, bukan negara-negara secara geopolitik.
- source_word: κατειργάσθαι
  choice: melakukan
  rationale: Kata ini menyatakan pelaksanaan atau pengerjaan sesuatu. Aspek tindakan yang telah berlangsung dalam masa lampau disampaikan oleh 'pada waktu yang telah berlalu' dan 'sudah cukup lama'.
- source_word: πεπορευμένους
  choice: dengan hidup
  rationale: πορεύομαι dipakai secara metaforis untuk cara hidup atau perilaku. 'Hidup' lebih alami daripada mempertahankan metafora 'berjalan' dalam bahasa Indonesia.
- source_word: ἐν ἀσελγείαις
  choice: dalam berbagai perbuatan tak senonoh
  rationale: ἀσέλγεια mencakup perilaku tanpa malu dan pemuasan diri yang tak terkendali, sering kali bersifat seksual. 'Berbagai perbuatan' mencerminkan bentuk jamak.
- source_word: ἐπιθυμίαις
  choice: hawa nafsu
  rationale: Dalam daftar keburukan ini, ἐπιθυμία bermakna keinginan yang tidak teratur atau jahat. 'Hawa nafsu' menyampaikan daya moral negatifnya tanpa membatasi hanya pada satu tindakan.
- source_word: οἰνοφλυγίαις
  choice: kemabukan
  rationale: Istilah langka ini menunjuk pada minum anggur secara berlebihan atau keadaan mabuk. Nomina kolektif Indonesia 'kemabukan' wajar dan dapat mencakup kejadian berulang.
- source_word: κώμοις
  choice: pesta pora
  rationale: κῶμος menunjuk pada keramaian atau perayaan liar yang biasanya disertai minuman dan perilaku berlebihan.
- source_word: πότοις
  choice: pesta minum-minum
  rationale: πότος adalah acara atau pertemuan yang berpusat pada minum. Pilihan ini membedakannya dari kemabukan dan pesta pora.
- source_word: ἀθεμίτοις εἰδωλολατρίαις
  choice: berbagai penyembahan berhala yang terlarang
  rationale: ἀθέμιτος berarti tidak diperbolehkan atau bertentangan dengan tatanan yang semestinya; 'terlarang' mempertahankan daya normatifnya. 'Berbagai' mencerminkan bentuk jamak εἰδωλολατρίαις.
theological_decisions:
- issue: Makna ἐθνῶν
  choice: orang-orang bukan Yahudi
  alternative: bangsa-bangsa lain; orang-orang kafir
  rationale: Konteks membandingkan kehidupan lama para pembaca dengan pola hidup masyarakat non-Yahudi. Pilihan ini paling langsung dan tidak menambahkan penilaian yang terkandung dalam istilah 'kafir'.
- issue: Daya moral ἀθεμίτοις εἰδωλολατρίαις
  choice: penyembahan berhala yang terlarang
  alternative: penyembahan berhala yang keji; penyembahan berhala yang melanggar hukum
  rationale: Frasa Yunani menekankan bahwa praktik itu tidak diperbolehkan atau bertentangan dengan norma, bukan semata-mata membangkitkan rasa jijik. 'Terlarang' mempertahankan kecaman objektif tanpa melebihkan retorikanya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Kalimat disusun ulang secukupnya agar hubungan waktu dan tindakan lampau terbaca alami. Bentuk-bentuk jamak Yunani yang tidak wajar bila diterjemahkan sebagai nomina jamak Indonesia disampaikan dengan 'berbagai' atau sebagai nomina kolektif.
