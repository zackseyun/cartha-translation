  naturalness: Kalimatnya umumnya baku dan mudah dipahami. 'Turut mengambil bagian dalam' sedikit berlebih karena 'turut' dan 'mengambil bagian' sama-sama menyatakan partisipasi; 'mengambil bagian dalam' lebih ringkas dan alami. 'Dengan kegembiraan yang meluap-luap' menyampaikan intensitas ἀγαλλιώμενοι dengan baik.
  terminology: '''Mesias'' merupakan padanan yang tepat untuk Χριστός sebagai gelar dan catatan alternatif ''Kristus'' sesuai. ''Bersukacitalah'' mempertahankan register yang layak dan kesinambungan dengan χαρῆτε. Kapitalisasi ''-Nya'' konsisten dengan konvensi yang dipilih.'
