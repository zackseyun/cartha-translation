id: 1PE.4.13
reference: 1 Peter 4:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/013.yaml
  text: But insofar as you share in the sufferings of Messiah[a], rejoice[b], so that at the revelation of his glory you may also rejoice with exultation.
translation:
  language: id
  text: Sebaliknya, sejauh kamu mengambil bagian dalam penderitaan Mesias[a], bersukacitalah, supaya pada penyingkapan kemuliaan-Nya[b] kamu juga bersukacita dengan kegembiraan yang meluap-luap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.”
    reason: Memberikan padanan tradisional bagi gelar Yunani Χριστός.
  - marker: b
    text: Atau, “ketika kemuliaan-Nya dinyatakan.”
    reason: Menyediakan ungkapan verbal yang lebih idiomatis sebagai alternatif bagi frasa nominal Yunani ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sebaliknya
  rationale: Menandai pertentangan dengan konteks sebelumnya secara alami dan jelas.
- source_word: καθὸ
  choice: sejauh
  rationale: 'Mempertahankan nuansa kadar atau proporsi: mereka bersukacita sejauh mereka turut mengalami penderitaan tersebut.'
- source_word: κοινωνεῖτε
  choice: turut mengambil bagian dalam
  rationale: Menyampaikan partisipasi nyata tanpa membatasi maknanya pada simpati emosional atau persekutuan dalam arti teknis.
- source_word: τοῖς τοῦ Χριστοῦ παθήμασιν
  choice: dalam penderitaan Mesias
  rationale: Konstruksi genitif diterjemahkan secara alami sambil mempertahankan keterbukaan mengenai bagaimana orang percaya mengambil bagian dalam penderitaan yang berkaitan dengan Mesias.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar; 'Mesias' mempertahankan arti gelar itu dan konteks mesianiknya.
- source_word: χαίρετε
  choice: bersukacitalah
  rationale: Bentuk imperatif dipertahankan dengan diksi yang bermartabat dan lazim dalam bahasa Indonesia.
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan hubungan tujuan atau hasil tanpa memaksakan pembedaan yang tidak ditegaskan oleh konteks.
- source_word: ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ
  choice: ketika kemuliaan-Nya dinyatakan
  rationale: Mengungkapkan makna peristiwa penyingkapan secara alami dalam bahasa Indonesia; alternatif yang lebih formal dicatat dalam catatan kaki.
- source_word: χαρῆτε
  choice: kamu juga bersukacita
  rationale: Mempertahankan kesinambungan leksikal dengan χαίρετε serta nilai καί, sedangkan nuansa subjunktif ditopang oleh klausa 'supaya'.
- source_word: ἀγαλλιώμενοι
  choice: dengan kegembiraan yang meluap-luap
  rationale: Menangkap intensitas sukacita perayaan yang terkandung dalam partisipel tanpa menghasilkan susunan Indonesia yang kaku.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Di sini istilah tersebut diperlakukan sebagai gelar. 'Mesias' menerjemahkan maknanya, sementara 'Kristus' tetap diberikan sebagai alternatif yang lazim.
- issue: Hakikat partisipasi dalam penderitaan Mesias
  choice: turut mengambil bagian dalam penderitaan Mesias
  alternative: menderita bagi Mesias
  rationale: Teks Yunani berbicara tentang partisipasi dalam penderitaan yang berkaitan dengan Mesias, tetapi tidak secara eksplisit menjabarkan sifat hubungan itu. Terjemahan tidak menyamakannya dengan karya penebusan Mesias dan juga tidak mempersempitnya menjadi sekadar penderitaan demi Dia.
- issue: Hubungan ἵνα
  choice: supaya
  alternative: sehingga
  rationale: ἵνα dapat membawa nuansa tujuan atau hasil. 'Supaya' menjaga struktur sumber tanpa meniadakan kemungkinan adanya unsur hasil.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur Yunani sejauh tetap alami. Kapitalisasi pronomina '-Nya' mengikuti kebiasaan penulisan religius Indonesia untuk rujukan kepada Mesias.
