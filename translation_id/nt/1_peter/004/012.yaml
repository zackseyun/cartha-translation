  text: Ἀγαπητοί, μὴ ξενίζεσθε τῇ ἐν ὑμῖν πυρώσει πρὸς πειρασμὸν ὑμῖν γινομένῃ ὡς ξένου ὑμῖν συμβαίνοντος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/012.yaml
  text: Beloved[a], do not be surprised at the fiery trial among you that is happening to test you, as though something strange were happening to you.
translation:
  language: id
  text: Saudara-saudara terkasih, janganlah heran terhadap ujian yang berapi-api yang sedang terjadi di antara kalian untuk menguji kalian, seolah-olah sesuatu yang aneh sedang menimpa kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terhadap ujian yang berapi-api di antara kalian yang sedang terjadi sebagai pengujian.” Kata Yunani untuk “yang berapi-api” secara harfiah membangkitkan gambaran pembakaran atau api, sedangkan kata untuk “pengujian” dapat berarti pengujian, cobaan, atau—dalam konteks lain—godaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Saudara-saudara yang terkasih
  rationale: Sapaan jamak ini menyatakan kasih pastoral. Ungkapan tersebut alami dan bermartabat dalam bahasa Indonesia serta mempertahankan hubungan maknanya dengan kasih.
- source_word: μὴ ξενίζεσθε
  choice: janganlah heran
  rationale: Kata kerja ini dapat berarti merasa heran atau menganggap sesuatu asing. Pilihan ini alami dalam bahasa Indonesia dan tetap berhubungan secara konseptual dengan ξένου pada akhir ayat.
- source_word: τῇ ... πυρώσει
  choice: akan cobaan berat bagaikan api
  rationale: πύρωσις secara harfiah membangkitkan gambaran pembakaran atau api, tetapi dalam konteks menunjuk pada penderitaan berat. Terjemahan ini mempertahankan citra api tanpa membuat pembaca mengartikannya sebagai kebakaran harfiah.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Konteks sapaan komunal mendukung arti 'di antara kalian', meskipun pengalaman setiap orang tidak ditiadakan.
- source_word: πρὸς πειρασμὸν ὑμῖν
  choice: untuk menguji kalian
  rationale: Dalam konteks penderitaan, πειρασμός menunjuk pada pengujian atau cobaan, bukan terutama godaan untuk berbuat dosa. Bentuk verbal menghasilkan bahasa Indonesia yang jelas.
- source_word: γινομένῃ
  choice: yang sedang terjadi
  rationale: Menampilkan aspek berlangsung dari partisipel kini yang menerangkan cobaan berat tersebut.
- source_word: ὡς ξένου
  choice: seolah-olah sesuatu yang aneh
  rationale: ξένος berarti asing, aneh, atau tidak biasa. 'Aneh' mempertahankan kaitan dengan perintah 'janganlah heran' secara alami.
- source_word: συμβαίνοντος
  choice: sedang menimpa
  rationale: Kata ini menyatakan suatu kejadian yang dialami seseorang. 'Menimpa' cocok dengan konteks penderitaan dan konstruksi datif ὑμῖν.
theological_decisions:
- issue: Makna πειρασμός dalam konteks
  choice: pengujian/cobaan
  alternative: godaan untuk berbuat dosa
  rationale: Konteks langsung membahas penderitaan yang menguji umat percaya. Karena itu, makna pengujian lebih kuat, sementara rentang leksikal yang lebih luas dicatat dalam catatan kaki.
- issue: Fungsi πρὸς πειρασμόν
  choice: 'tujuan: ''untuk menguji kalian'''
  alternative: 'hasil atau fungsi umum: ''sebagai pengujian'''
  rationale: πρός dengan akusatif mendukung arah atau tujuan. Terjemahan tujuan jelas dan wajar, tanpa menyebut secara eksplisit siapa pelaku pengujian itu.
translation_notes:
  register: Bahasa Indonesia modern, hangat, dan pastoral. 'Kalian' dipakai untuk menandai bentuk jamak Yunani secara jelas; 'janganlah' menjaga nada nasihat yang bermartabat. Citra api dipertahankan sambil dijelaskan sebagai perbandingan agar tidak disalahpahami secara harfiah.
