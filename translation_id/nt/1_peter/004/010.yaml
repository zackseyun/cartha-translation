  text: ἕκαστος καθὼς ἔλαβεν χάρισμα, εἰς ἑαυτοὺς αὐτὸ διακονοῦντες ὡς καλοὶ οἰκονόμοι ποικίλης χάριτος θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/010.yaml
  text: As each has received a gift[a], use it in serving one another as good stewards of God’s varied grace.
translation:
  language: id
  text: Hendaklah setiap orang, sesuai dengan karunia yang telah diterimanya, menggunakannya untuk saling melayani[a] sebagai pengelola yang baik atas anugerah Allah yang beraneka ragam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melayani di antara kalian”; atau, “melayani bagi satu sama lain”; atau, “melayani kepada satu sama lain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: masing-masing
  rationale: Mempertahankan penekanan distributif pada setiap anggota komunitas secara individual.
- source_word: καθὼς ἔλαβεν χάρισμα
  choice: dengan karunia yang telah diterimanya
  rationale: Mengungkapkan hubungan antara karunia yang diterima dan pelayanan yang dilakukan secara alami dalam bahasa Indonesia; 'karunia' mempertahankan kaitannya dengan anugerah tanpa mempersempitnya menjadi istilah teknis 'karunia rohani'.
- source_word: εἰς ἑαυτοὺς αὐτὸ διακονοῦντες
  choice: melayani seorang terhadap yang lain dengan karunia
  rationale: Menyampaikan bahwa karunia menjadi sarana pelayanan di dalam komunitas. Ungkapan timbal balik ini alami dan mempertahankan komunitas sebagai penerima manfaat pelayanan.
- source_word: ὡς καλοὶ οἰκονόμοι
  choice: sebagai pengelola yang baik
  rationale: '''Pengelola'' menyatakan orang yang dipercayai mengurus milik pihak lain serta mempertahankan unsur tanggung jawab dari οἰκονόμος.'
- source_word: ποικίλης χάριτος θεοῦ
  choice: anugerah Allah yang beraneka ragam
  rationale: Menggambarkan anugerah Allah yang hadir dalam berbagai bentuk; 'beraneka ragam' jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Apakah χάρισμα harus diterjemahkan secara sempit sebagai 'karunia rohani'
  choice: karunia
  alternative: karunia rohani; pemberian anugerah
  rationale: Konteksnya menyangkut pelayanan yang dimampukan oleh anugerah, tetapi kata Yunani itu sendiri tidak mengharuskan pengertian teknis yang lebih sempit.
- issue: Cara menyatakan daya komunal εἰς ἑαυτούς
  choice: seorang terhadap yang lain
  alternative: di antara kalian; bagi satu sama lain; kepada satu sama lain
  rationale: Bentuk refleksif jamak menunjuk kepada komunitas sebagai lingkup dan penerima manfaat pelayanan. Terjemahan utama menyatakan hubungan timbal balik secara alami, sedangkan catatan mempertahankan kemungkinan nuansa lain.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk 'Hendaklah' menyampaikan daya nasihat dari partisipel Yunani dalam konteksnya. 'Pengelola' dipilih daripada 'penatalayan' agar mudah dipahami pembaca umum tanpa kehilangan gagasan tanggung jawab atas sesuatu yang dipercayakan.
