review_pass:
  verdict: revise
  source_fidelity: Draf secara umum menyampaikan nasihat agar setiap anggota memakai karunia yang diterimanya untuk pelayanan dalam komunitas. Namun, susunan "melayani seorang terhadap yang lain dengan karunia" kurang jelas dalam bahasa Indonesia mengenai karunia sebagai sarana yang digunakan, dan "pengelola ... dari anugerah" tidak menyatakan relasi penatalayanan secara idiomatis. Revisi menempatkan karunia yang diterima dan penggunaannya lebih dekat pada struktur serta makna Yunani.
  naturalness: '"Hendaklah setiap orang, sesuai dengan karunia yang telah diterimanya, menggunakannya untuk saling melayani" adalah bahasa Indonesia modern yang jelas dan wajar. "Atas anugerah Allah" lebih idiomatis daripada "dari anugerah Allah" dalam konteks tanggung jawab pengelolaan.'
  terminology: '"Karunia" mempertahankan keluasan χάρισμα tanpa membatasinya menjadi "karunia rohani". "Anugerah Allah yang beraneka ragam" dengan tepat mencerminkan ποικίλης χάριτος θεοῦ. "Pengelola" tetap dapat dipakai untuk οἰκονόμοι, dan preposisi "atas" menyatakan bahwa mereka dipercayai mengelola anugerah itu.'
  issues:
  - severity: medium
    issue: Frasa "melayani seorang terhadap yang lain dengan karunia" kurang idiomatis dan dapat mengaburkan bahwa karunia itulah yang harus dipakai dalam pelayanan.
    rationale: αὐτό merujuk kepada χάρισμα, sedangkan διακονοῦντες menyatakan penggunaan karunia itu dalam pelayanan kepada komunitas. "Menggunakannya untuk saling melayani" menyatakan kedua unsur tersebut dengan jelas.
  - severity: medium
    issue: '"Pengelola yang baik dari anugerah Allah" memakai relasi yang tidak wajar dalam bahasa Indonesia.'
    rationale: οἰκονόμοι ποικίλης χάριτος θεοῦ berarti para pengelola/penatalayan yang dipercayai mengurus anugerah Allah, bukan pengelola yang berasal dari anugerah. "Pengelola yang baik atas anugerah Allah" menyampaikan relasi tersebut.
  - severity: low
    issue: Penanda catatan kaki diletakkan pada akhir ayat, bukan pada ungkapan yang memiliki alternatif terjemahan.
    rationale: Alternatif berkaitan dengan εἰς ἑαυτούς dan sebaiknya ditambatkan pada "saling melayani".
  revised_text: Hendaklah setiap orang, sesuai dengan karunia yang telah diterimanya, menggunakannya untuk saling melayani[a] sebagai pengelola yang baik atas anugerah Allah yang beraneka ragam.
