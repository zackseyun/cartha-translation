- from: Hendaklah masing-masing melayani seorang terhadap yang lain dengan karunia yang telah diterimanya, sebagai pengelola yang baik dari anugerah Allah yang beraneka ragam.[a]
  to: Hendaklah setiap orang, sesuai dengan karunia yang telah diterimanya, menggunakannya untuk saling melayani[a] sebagai pengelola yang baik atas anugerah Allah yang beraneka ragam.
  rationale: 'Revisi mengikuti hubungan dalam teks Yunani: setiap orang telah menerima suatu karunia, dan karunia itu dipakai untuk pelayanan dalam komunitas. Ungkapan "saling melayani" adalah padanan Indonesia yang alami bagi daya komunal εἰς ἑαυτούς, sementara catatan kaki mempertahankan alternatif arah atau lingkup yang mungkin. "Atas anugerah Allah" memperbaiki relasi οἰκονόμοι dengan anugerah yang dikelola.'
