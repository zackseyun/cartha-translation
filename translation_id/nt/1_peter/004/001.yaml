  text: Χριστοῦ οὖν ⸀παθόντος σαρκὶ καὶ ὑμεῖς τὴν αὐτὴν ἔννοιαν ὁπλίσασθε, ὅτι ὁ ⸀παθὼν σαρκὶ πέπαυται ⸀ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/001.yaml
  text: Therefore[a], since the Messiah suffered in the flesh, you also arm yourselves with the same mindset, because the one who has suffered in the flesh has ceased from sin[c][b],
translation:
  language: id
  text: Jadi, karena Mesias[a] telah menderita dalam daging[b], kalian juga hendaklah mempersenjatai diri dengan cara berpikir yang sama, sebab orang yang telah menderita dalam daging telah berhenti dari dosa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Kristus” untuk “Mesias” (Yunani: Christos). Di sini kata itu dipertahankan sebagai gelar.'
    reason: lexical_alternative
  - marker: b
    text: “Dalam daging” menerjemahkan kata Yunani sarx secara harfiah di sini dan menunjuk pada keberadaan manusia secara jasmani, bukan dengan sendirinya pada “natur berdosa”.
    reason: lexical_alternative
  - marker: c
    text: Klausa “orang yang telah menderita dalam daging telah berhenti dari dosa” diperdebatkan. Klausa ini dapat merujuk secara khusus kepada Mesias, kepada orang percaya yang mengikuti pola-Nya, atau kepada prinsip umum bahwa penderitaan menandai pemutusan yang tegas dengan dosa.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός dipahami sebagai gelar dan diterjemahkan secara wajar dalam bahasa Indonesia sebagai “Mesias”; alternatif tradisional “Kristus” dicatat dalam catatan kaki.
- source_word: οὖν
  choice: Jadi
  rationale: Menandai kesimpulan atau konsekuensi dari konteks sebelumnya dengan penghubung yang alami dalam bahasa Indonesia modern.
- source_word: παθόντος
  choice: telah menderita
  rationale: Partisip aoris yang bergantung pada Χριστοῦ diungkapkan sebagai klausa sebab “karena ... telah menderita”, dengan tetap mempertahankan tindakan lampau.
- source_word: σαρκὶ
  choice: dalam daging
  rationale: Mempertahankan ungkapan konkret bahasa Yunani dan pengulangannya; di sini menunjuk pada keberadaan manusia secara jasmani, bukan dengan sendirinya pada “natur berdosa”.
- source_word: ἔννοιαν
  choice: cara berpikir
  rationale: Mencakup gagasan pikiran, sikap batin, atau tekad, dan lebih mudah dipahami pembaca umum daripada istilah abstrak yang kurang lazim.
- source_word: ὁπλίσασθε
  choice: persenjatai ... dirimu
  rationale: Mempertahankan metafora militer serta daya refleksif imperatif Yunani; “dirimu” merujuk kepada para pembaca secara kolektif.
- source_word: ὅτι
  choice: sebab
  rationale: Mengungkapkan dasar bagi nasihat sebelumnya dengan hubungan kausal yang jelas dan bernada wajar.
- source_word: ὁ παθὼν
  choice: orang yang telah menderita
  rationale: Mempertahankan rumusan substantival yang cukup umum tanpa menentukan secara eksplisit apakah rujukannya khusus kepada Mesias, orang percaya, atau suatu prinsip umum.
- source_word: πέπαυται
  choice: telah berhenti
  rationale: Mencerminkan bentuk perfektum yang menyatakan tindakan berhenti dengan keadaan hasil yang berlanjut.
- source_word: ἁμαρτίας
  choice: dari dosa
  rationale: Genitif sesudah παύω menyatakan pemisahan; bentuk tunggal dipertahankan dan dapat menunjuk pada dosa sebagai kuasa, ranah, atau praktik.
theological_decisions:
- issue: Rujukan dan maksud klausa “orang yang telah menderita dalam daging telah berhenti dari dosa”
  choice: Pernyataan dipertahankan dalam bentuk luas dan padat sebagaimana teks Yunani, tanpa menetapkan satu rujukan tertentu.
  alternative: Klausa itu dapat dipahami khusus tentang Mesias, tentang orang percaya yang mengikuti pola penderitaan-Nya, atau sebagai prinsip umum mengenai putusnya hubungan dengan kehidupan berdosa.
  rationale: Bahasa Yunani bersifat ringkas dan diperdebatkan. Terjemahan tidak menambahkan unsur yang akan meniadakan ketegangan teologis tersebut; berbagai kemungkinan dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Metafora militer “persenjatai” serta pengulangan “dalam daging” dipertahankan. Bentuk “dirimu” dipakai sebagai objek refleksif bagi sapaan jamak kolektif agar kalimat tetap alami.
