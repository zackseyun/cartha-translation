  yaml_path: translation/nt/1_peter/004/002.yaml
  text: so as to live the rest of his time in the flesh no longer for human desires[a], but for the will of God.
translation:
  language: id
  text: supaya selama sisa waktunya dalam daging[a], ia tidak lagi hidup untuk keinginan manusia, melainkan untuk kehendak Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “selama sisa hidupnya dalam tubuh.” Ungkapan Yunani “dalam daging” di sini menunjuk pada kehidupan jasmani di dunia, dan tidak harus berarti “tabiat berdosa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸ
  choice: supaya
  rationale: Gabungan preposisi dan infinitif berartikel ini menyatakan tujuan atau hasil yang berkaitan dengan ayat sebelumnya; “supaya” menyampaikan daya purposifnya secara alami.
- source_word: μηκέτι
  choice: tidak lagi
  rationale: Mengungkapkan berhentinya pola hidup yang terdahulu.
- source_word: ἀνθρώπων
  choice: manusia
  rationale: Bentuk jamak ini bersifat generik dan tidak terbatas pada laki-laki.
- source_word: ἐπιθυμίαις
  choice: keinginan-keinginan
  rationale: Istilah ini lebih luas daripada nafsu seksual dan dalam konteks menunjuk pada beragam dorongan manusia yang berlawanan dengan kehendak Allah.
- source_word: ἀλλὰ
  choice: melainkan
  rationale: 'Menandai pertentangan tegas setelah klausa negatif: bukan lagi menurut keinginan manusia, melainkan menurut kehendak Allah.'
- source_word: θελήματι θεοῦ
  choice: menurut kehendak Allah
  rationale: Dativus ini paling wajar dipahami sebagai patokan atau orientasi hidup, sejajar dan berlawanan dengan keinginan-keinginan manusia.
- source_word: τὸν ἐπίλοιπον ... χρόνον
  choice: selama sisa waktunya
  rationale: Menyatakan waktu yang masih tersisa dalam kehidupan orang yang dibicarakan; “selama” membuat fungsi rentang waktunya jelas dalam bahasa Indonesia.
- source_word: ἐν σαρκὶ
  choice: dalam daging
  rationale: Terjemahan ini mempertahankan ungkapan sumber dan ambiguitas leksikalnya, sementara catatan kaki menjelaskan bahwa dalam konteks ini ungkapan tersebut menunjuk pada kehidupan jasmani di dunia.
- source_word: βιῶσαι
  choice: hidup
  rationale: Padanan langsung dan alami bagi infinitif yang menggambarkan cara menjalani sisa kehidupan.
theological_decisions:
- issue: Makna σάρξ dalam ἐν σαρκὶ
  choice: kehidupan jasmani di dunia, diterjemahkan “dalam daging”
  alternative: tabiat berdosa
  rationale: Konteks membicarakan waktu hidup fana yang masih tersisa. Ungkapan ini tidak dengan sendirinya menunjuk pada suatu prinsip batin yang berdosa; terjemahan literal disertai catatan menjaga pembedaan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan “tidak lagi ... melainkan ...” mempertahankan kontras kuat dalam teks Yunani, sedangkan “menurut” menyatakan orientasi hidup tanpa menambahkan gagasan memenuhi atau melakukan yang tidak dinyatakan secara eksplisit.
