id: 1PE.1.18
reference: 1 Peter 1:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰδότες ὅτι οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ, ἐλυτρώθητε ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/018.yaml
  text: knowing that you were redeemed from your futile way of life handed down from your fathers[a], not with perishable things such as silver or gold[b],
translation:
  language: id
  text: Kamu tahu bahwa kamu telah ditebus[a] dari cara hidupmu yang sia-sia, yang diwariskan dari nenek moyangmu[b], bukan dengan hal-hal yang dapat binasa seperti perak atau emas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dibebaskan dengan pembayaran tebusan.” Kata kerja Yunani ini mengandung gagasan pembebasan melalui pembayaran.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang diwariskan dari para bapakmu.”
    reason: literal_rendering
lexical_decisions:
- source_word: εἰδότες
  choice: Kamu tahu
  rationale: Bentuk partisipial ini menyatakan pengetahuan yang mendasari nasihat dalam konteks. Ungkapan ini mempertahankan hubungan dengan kalimat sekitar tanpa memaksakan apakah hubungannya terutama kausal atau sirkumstansial.
- source_word: ἐλυτρώθητε
  choice: kamu telah ditebus
  rationale: Kata kerja ini berarti dibebaskan melalui pembayaran tebusan. 'Ditebus' alami dalam bahasa Indonesia dan mempertahankan bobot kiasan penebusan, sedangkan kontras dengan perak dan emas memperjelas gambaran pembayarannya.
- source_word: φθαρτοῖς
  choice: barang-barang fana
  rationale: Kata sifat ini dipakai secara substantival dan menunjuk pada sesuatu yang dapat rusak atau binasa. 'Barang-barang fana' jelas serta cocok dengan perak dan emas sebagai contoh.
- source_word: ἀργυρίῳ ἢ χρυσίῳ
  choice: seperti perak atau emas
  rationale: Perak dan emas menjelaskan contoh barang-barang fana. 'Seperti' menyampaikan hubungan penjelas itu secara wajar dalam bahasa Indonesia.
- source_word: ματαίας
  choice: sia-sia
  rationale: Kata ini menyatakan kehampaan, ketidakbergunaan, atau kesia-siaan. 'Sia-sia' mempertahankan keluasan makna moral dan eksistensialnya.
- source_word: ἀναστροφῆς
  choice: cara hidup
  rationale: Dalam konteks surat ini, kata tersebut mencakup perilaku dan pola kehidupan secara keseluruhan. 'Cara hidup' lebih luas dan alami daripada sekadar 'perilaku'.
- source_word: πατροπαραδότου
  choice: yang diwariskan oleh bapak-bapak leluhurmu
  rationale: Pilihan ini mempertahankan unsur paternal πατρο- sekaligus menyampaikan gagasan suatu pola hidup yang diteruskan dari generasi terdahulu.
theological_decisions:
- issue: Istilah penebusan
  choice: ditebus
  alternative: dibebaskan dengan pembayaran tebusan
  rationale: Ayat ini memakai gambaran pembebasan melalui tebusan, tetapi klausa ini sendiri tidak merinci suatu mekanisme doktrinal. 'Ditebus' menjaga resonansi teologis tanpa menambahkan penjelasan yang tidak dinyatakan.
- issue: Bahasa tentang tradisi warisan
  choice: diwariskan oleh bapak-bapak leluhurmu
  alternative: diwariskan oleh nenek moyangmu
  rationale: Teks Yunani secara eksplisit memakai unsur 'bapak'. Terjemahan utama mempertahankan unsur itu, sedangkan catatan kaki memberi padanan Indonesia yang lebih lazim dan mencakup leluhur secara umum.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami sambil mempertahankan urutan gagasan utama: pengetahuan, penebusan dari cara hidup lama, asal-usul pola hidup itu, lalu penyangkalan bahwa tebusannya berupa barang fana.'
