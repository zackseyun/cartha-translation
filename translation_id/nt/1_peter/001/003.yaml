id: 1PE.1.3
reference: 1 Peter 1:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who according to his great mercy has caused us to be born again to a living hope through the resurrection of Jesus the Messiah from the dead[b],
translation:
  language: id
  text: Terpujilah Allah dan Bapa Tuhan kita, Yesus Sang Mesias[a], yang, sesuai dengan belas kasihan-Nya yang besar, telah membuat kita dilahirkan kembali untuk suatu pengharapan yang hidup melalui kebangkitan Yesus Sang Mesias dari antara orang mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Yesus Kristus.” Gelar Yunani Χριστός diterjemahkan “Mesias” untuk mempertahankan maknanya sebagai gelar.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Terpujilah
  rationale: Bentuk pujian ini paling wajar dalam bahasa Indonesia untuk ungkapan doksologis, bukan sekadar menyatakan bahwa Allah 'terpuji'.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Allah dan Bapa
  rationale: Mempertahankan kedua sebutan dalam satu ungkapan relasional sebagaimana struktur Yunani.
- source_word: κυρίου
  choice: Tuhan
  rationale: κύριος dipakai sebagai gelar, sehingga diterjemahkan 'Tuhan', bukan sapaan kehormatan biasa.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός tetap disampaikan sebagai gelar yang bermakna; 'Sang Mesias' alami dalam bahasa Indonesia dan tidak memperlakukannya semata-mata sebagai nama belakang.
- source_word: κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: karena belas kasihan-Nya yang besar
  rationale: κατά di sini menghubungkan tindakan Allah dengan kelimpahan belas kasihan-Nya. 'Karena' menyampaikan dasar tindakan itu secara alami, tanpa menghilangkan ukuran besarnya belas kasihan.
- source_word: ἀναγεννήσας
  choice: telah melahirkan kita kembali
  rationale: Mempertahankan Allah sebagai pelaku dan citra kelahiran kembali yang terkandung dalam verba Yunani.
- source_word: εἰς ἐλπίδα ζῶσαν
  choice: kepada pengharapan yang hidup
  rationale: εἰς menyatakan arah atau hasil, sedangkan 'pengharapan yang hidup' mempertahankan metafora ζῶσαν.
- source_word: δι’ ἀναστάσεως
  choice: melalui kebangkitan
  rationale: διά dengan genitif menyatakan sarana; 'melalui' merupakan padanan Indonesia yang jelas.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Ungkapan ini mempertahankan gagasan bangkit keluar dari lingkungan orang-orang mati dan tetap alami dalam bahasa Indonesia alkitabiah modern.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar kristologis
  choice: Sang Mesias
  alternative: Kristus
  rationale: Pilihan ini mempertahankan arti gelar Χριστός, sementara catatan kaki mengakui bentuk tradisional 'Kristus'.
- issue: Peran Allah dalam ἀναγεννήσας
  choice: Ia telah melahirkan kita kembali
  alternative: Ia telah memberi kita kelahiran baru
  rationale: Teks Yunani menampilkan Allah sebagai pelaku kelahiran baru. Rumusan utama mempertahankan keagenan itu beserta citra kelahiran tanpa memperluasnya menjadi suatu sistem doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar mudah dipahami, sementara hubungan doksologi, belas kasihan Allah, kelahiran kembali, pengharapan, dan kebangkitan tetap utuh.
