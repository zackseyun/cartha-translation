  text: Τὰς ψυχὰς ὑμῶν ἡγνικότες ἐν τῇ ὑπακοῇ τῆς ⸀ἀληθείας εἰς φιλαδελφίαν ἀνυπόκριτον ⸀ἐκ καρδίας ἀλλήλους ἀγαπήσατε ἐκτενῶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/022.yaml
  text: Having purified your souls by obedience to the truth for sincere brotherly love[a], love one another earnestly from the heart[b],
translation:
  language: id
  text: Setelah kamu menyucikan dirimu dalam ketaatan kepada kebenaran untuk kasih persaudaraan yang tulus[a], kasihilah satu sama lain dengan sungguh-sungguh dari hati[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kasih kepada saudara-saudari seiman.” Istilah Yunani ini menunjuk pada kasih kekeluargaan di antara sesama orang percaya.
    reason: lexical_alternative
  - marker: b
    text: Sejumlah naskah berbunyi, “dari hati yang murni.”
    reason: textual_variant
lexical_decisions:
- source_word: ἡγνικότες
  choice: karena kamu telah menyucikan
  rationale: Partisipel perfek menyatakan tindakan yang telah terjadi dan tetap relevan bagi perintah utama. Bentuk kausal tersirat dibuat alami dalam bahasa Indonesia tanpa memutus kaitannya dengan perintah.
- source_word: ψυχὰς ὑμῶν
  choice: jiwamu
  rationale: ψυχή dapat menunjuk pada jiwa, hidup, atau diri. 'Jiwamu' mempertahankan padanan leksikal dan mengacu pada pribadi dalam kehidupan batinnya; bentuk tunggal kolektif alami setelah 'kamu'.
- source_word: ἐν τῇ ὑπακοῇ τῆς ἀληθείας
  choice: melalui ketaatan kepada kebenaran
  rationale: ἐν dengan datif dapat menyatakan sarana atau lingkup. 'Melalui' menyampaikan nuansa instrumental, sedangkan 'kepada kebenaran' menyatakan bahwa kebenaran itu ditaati.
- source_word: ἀληθείας
  choice: kebenaran
  rationale: Dalam konteks ini istilah tersebut kemungkinan menunjuk pada kebenaran berita Injil, bukan sekadar kebenaran abstrak. Bahasa Indonesia tidak memerlukan kata sandang untuk menyampaikan rujukan tertentu ini.
- source_word: εἰς φιλαδελφίαν ἀνυπόκριτον
  choice: sehingga kamu memiliki kasih persaudaraan yang tulus
  rationale: εἰς menyatakan tujuan atau hasil. Rumusan ini alami dalam bahasa Indonesia dan mempertahankan φιλαδελφία sebagai kasih bercorak kekeluargaan serta ἀνυπόκριτον sebagai 'tulus'.
- source_word: φιλαδελφίαν
  choice: kasih persaudaraan
  rationale: Pilihan ini mempertahankan citra hubungan saudara dan membedakannya dari kata kerja ἀγαπάω yang menyusul, tanpa membatasi cakupannya hanya kepada laki-laki.
- source_word: ἐκ καρδίας
  choice: dari hati
  rationale: Menerjemahkan teks SBLGNT tanpa menambahkan sifat 'murni'. Varian yang memuat sifat tersebut dicatat dalam catatan kaki.
- source_word: ἀγαπήσατε
  choice: kasihilah
  rationale: Imperatif aoris diterjemahkan sebagai perintah langsung dan tegas. 'Kasihilah' sesuai dengan ragam Alkitab Indonesia yang tetap mudah dipahami.
- source_word: ἀλλήλους
  choice: satu sama lain
  rationale: Padanan timbal balik yang alami dan jelas dalam bahasa Indonesia modern.
- source_word: ἐκτενῶς
  choice: dengan sungguh-sungguh
  rationale: Ungkapan ini menyampaikan intensitas dan ketekunan tanpa memakai diksi yang kuno atau mempersempit makna menjadi emosi semata.
theological_decisions:
- issue: Perbedaan antara φιλαδελφία dan ἀγαπάω dalam ayat yang sama
  choice: φιλαδελφία diterjemahkan 'kasih persaudaraan', sedangkan ἀγαπήσατε diterjemahkan 'kasihilah'.
  alternative: Menerjemahkan keduanya hanya dengan bentuk kata 'kasih' tanpa penanda persaudaraan.
  rationale: Pilihan ini mempertahankan tekstur retoris dua istilah Yunani tanpa menganggap bahwa keduanya merupakan dua jenis kasih yang sepenuhnya terpisah.
- issue: Cakupan gender φιλαδελφία
  choice: Gunakan 'kasih persaudaraan' dan jelaskan dalam catatan bahwa cakupannya meliputi semua sesama orang percaya.
  alternative: Kasih kepada saudara-saudari seiman.
  rationale: '''Kasih persaudaraan'' mempertahankan citra keluarga dan secara wajar bersifat inklusif dalam bahasa Indonesia; catatan menghilangkan kemungkinan salah paham.'
- issue: Varian tekstual sesudah ἐκ καρδίας
  choice: Terjemahkan 'dari hati' sesuai SBLGNT.
  alternative: Dari hati yang murni.
  rationale: Kata sifat 'murni' tidak terdapat dalam teks sumber yang ditetapkan, tetapi variannya cukup penting untuk dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mempertahankan hubungan antara penyucian, ketaatan, kasih persaudaraan, dan perintah untuk mengasihi, sambil menghindari ungkapan yang terlalu harfiah atau bernada denominasi.
