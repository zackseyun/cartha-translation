    issue: Frasa “kamu dibuat berdukacita oleh berbagai ujian” kaku dan kurang idiomatis.
    rationale: Bentuk ini memberi kesan bahwa “berbagai ujian” merupakan agen personal yang secara langsung ‘membuat’ pembaca berdukacita. Yunani menyatakan keadaan berdukacita dalam/oleh berbagai πειρασμοί. Bahasa Indonesia lebih wajar memakai “harus berdukacita ... karena berbagai ujian,” sambil tetap tidak menyebut pelaku penderitaan.
  - severity: low
    issue: “Dalam hal itu” kurang lazim dibanding “Dalam hal ini.”
    rationale: Keduanya mungkin, tetapi “Dalam hal ini” merupakan rujukan anaforis yang lebih alami dalam bahasa Indonesia modern dan tidak mempersempit anteseden relatif Yunani.
