  text: ἐν ᾧ ἀγαλλιᾶσθε, ὀλίγον ἄρτι εἰ ⸀δέον λυπηθέντες ἐν ποικίλοις πειρασμοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/006.yaml
  text: In this you rejoice[a], though now for a little while, if necessary, you have been grieved by various trials,
translation:
  language: id
  text: Dalam hal ini kamu sangat bersukacita, sekalipun sekarang ini, jika perlu, kamu harus berdukacita untuk waktu yang singkat karena berbagai ujian[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cobaan”; istilah Yunani ini dalam konteks lain juga dapat berarti “pencobaan” atau “godaan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Dalam hal itu
  rationale: Ungkapan ini secara alami menunjuk kembali kepada keselamatan, warisan, dan pengharapan dalam ayat-ayat sebelumnya, sambil mempertahankan keluwesan hubungan yang dapat menyatakan lingkup atau dasar sukacita.
- source_word: ἀγαλλιᾶσθε
  choice: kamu sangat bersukacita
  rationale: Kata kerja ini menyatakan sukacita yang kuat atau meluap. Penambahan 'sangat' menyampaikan intensitas tersebut dalam bahasa Indonesia yang wajar.
- source_word: ὀλίγον ἄρτι
  choice: sekarang, untuk waktu yang singkat
  rationale: 'Terjemahan ini mempertahankan kedua unsur waktu: keadaan yang sedang berlangsung sekarang dan durasinya yang singkat.'
- source_word: εἰ δέον
  choice: jika memang perlu
  rationale: '''Jika'' mempertahankan nuansa bersyarat, sedangkan ''memang perlu'' menyampaikan gagasan keharusan tanpa menjelaskan sumber atau tujuan keharusan itu.'
- source_word: λυπηθέντες
  choice: kamu dibuat berdukacita
  rationale: Bentuk pasif dan bobot emosional partisip Yunani dipertahankan. Ungkapan ini tidak menentukan siapa atau apa yang menyebabkan dukacita tersebut selain ujian sebagai keadaannya.
- source_word: ἐν ποικίλοις πειρασμοῖς
  choice: oleh berbagai ujian
  rationale: Dalam konteks penderitaan dan terujinya iman pada ayat berikutnya, 'ujian' menyampaikan kesukaran yang menguji iman. 'Oleh' mengungkapkan keadaan atau sarana yang menimbulkan dukacita secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna πειρασμοῖς dalam konteks penderitaan
  choice: ujian
  alternative: cobaan; pencobaan; godaan
  rationale: Konteks langsung berbicara tentang dukacita dan pengujian iman, sehingga 'ujian' paling sesuai tanpa membatasi makna pada bujukan untuk berbuat dosa. Catatan kaki mempertahankan keluasan makna istilah Yunani.
- issue: Sumber keharusan dalam εἰ δέον
  choice: tidak dinyatakan
  alternative: menyebutnya sebagai kehendak atau ketetapan Allah
  rationale: Teks hanya mengatakan 'jika memang perlu' dan tidak secara eksplisit menyebut sumber keharusan itu; terjemahan tidak menambahkan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang khidmat tetapi mudah dipahami. Susunan kalimat mempertahankan pertentangan antara sukacita sekarang dan dukacita sementara, tanpa menghilangkan nuansa bersyarat 'jika memang perlu'.
