  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα τὸ δοκίμιον ὑμῶν τῆς πίστεως ⸀πολυτιμότερον χρυσίου τοῦ ἀπολλυμένου διὰ πυρὸς δὲ δοκιμαζομένου εὑρεθῇ εἰς ἔπαινον καὶ ⸂δόξαν καὶ τιμὴν⸃ ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/007.yaml
  text: so that the proven genuineness of your faith—more precious than gold that perishes though it is tested by fire—may be found to result in praise and glory and honor at the revelation of Jesus the Messiah[a][b][c].
translation:
  language: id
  text: supaya kemurnian iman kalian yang telah teruji—yang lebih berharga daripada emas yang dapat musnah sekalipun diuji dengan api—ternyata menghasilkan pujian, kemuliaan, dan kehormatan pada saat Yesus Sang Mesias menyatakan diri.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pengujian iman kalian”; istilah Yunani dapat menekankan proses pengujian atau kemurnian yang terbukti sebagai hasilnya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Yesus Kristus.” Di sini “Mesias” menerjemahkan gelar Χριστός menurut maknanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκίμιον
  choice: kemurnian ... yang telah teruji
  rationale: Ungkapan ini menonjolkan mutu iman yang terbukti melalui pengujian, sambil tetap terdengar alami dalam bahasa Indonesia.
- source_word: πίστεως
  choice: iman
  rationale: Dalam konteks ini, yang diuji adalah iman para pembaca; 'iman' merupakan padanan baku dan paling sesuai.
- source_word: πολυτιμότερον
  choice: lebih berharga
  rationale: Menyatakan perbandingan nilai dengan emas secara jelas dan wajar.
- source_word: χρυσίου τοῦ ἀπολλυμένου
  choice: emas yang dapat musnah
  rationale: Mempertahankan kontras antara tingginya nilai emas dan sifatnya yang tidak kekal.
- source_word: διὰ πυρὸς δὲ δοκιμαζομένου
  choice: sekalipun diuji dengan api
  rationale: '''Sekalipun'' menyampaikan hubungan konsesif dalam susunan kalimat, sedangkan ''diuji dengan api'' mempertahankan citra pengujian emas.'
- source_word: εὑρεθῇ εἰς
  choice: ternyata menghasilkan
  rationale: Mengungkapkan hasil yang kelak didapati atau dinyatakan tanpa mempertahankan bentuk pasif Yunani secara kaku.
- source_word: ἔπαινον καὶ δόξαν καὶ τιμήν
  choice: pujian, kemuliaan, dan kehormatan
  rationale: Mempertahankan ketiga unsur dan tidak menentukan secara eksplisit siapa yang menerima atau memberikan semuanya itu.
- source_word: ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ
  choice: pada saat Yesus sang Mesias menyatakan diri
  rationale: Memahami ἐν secara temporal dan ἀποκάλυψις sebagai penampakan atau penyataan eskatologis Yesus; Χριστός diterjemahkan menurut makna gelarnya.
theological_decisions:
- issue: Makna τὸ δοκίμιον ὑμῶν τῆς πίστεως
  choice: kemurnian iman yang telah teruji
  alternative: pengujian imanmu
  rationale: δοκίμιον kemungkinan besar menunjuk pada mutu yang terbukti sebagai hasil pengujian, tetapi kemungkinan nuansa proses pengujian dicatat dalam catatan kaki.
- issue: Pihak yang terkait dengan pujian, kemuliaan, dan kehormatan
  choice: Dibiarkan tersirat seperti dalam teks Yunani
  alternative: Secara eksplisit menyatakan bahwa orang percaya menerimanya atau bahwa semuanya ditujukan kepada Allah/Kristus
  rationale: Teks Yunani tidak menyebutkan penerima atau sumber rangkaian tersebut; penjelasan tambahan akan menutup ambiguitas yang asli.
- issue: Penerjemahan Χριστός
  choice: sang Mesias
  alternative: Kristus
  rationale: Menerjemahkan makna gelar Yunani, dengan bentuk Indonesia yang idiomatis; padanan tradisional dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk tunggal 'imanmu' mengikuti kata ganti jamak Yunani secara kolektif dalam ungkapan Indonesia; jika pembedaan jumlah perlu dibuat eksplisit, 'iman kalian' juga mungkin. Tanda pisah mempertahankan sisipan perbandingan dengan emas tanpa mengaburkan alur kalimat.
