  text: τοὺς ἐν δυνάμει θεοῦ φρουρουμένους διὰ πίστεως εἰς σωτηρίαν ἑτοίμην ἀποκαλυφθῆναι ἐν καιρῷ ἐσχάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/005.yaml
  text: who are being guarded by the power of God through faith for a salvation ready to be revealed in the last time[a][b].
translation:
  language: id
  text: yang sedang dijaga oleh kuasa Allah melalui iman[a] untuk keselamatan yang siap dinyatakan pada waktu terakhir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melalui kepercayaan”; yang kurang mungkin di sini, “melalui kesetiaan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam waktu terakhir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φρουρουμένους
  choice: yang sedang dijaga
  rationale: Partisipel kini pasif menunjukkan tindakan yang terus berlangsung atas para penerima surat. 'Dijaga' mempertahankan nuansa perlindungan kuat, bahkan bernuansa penjagaan militer, tanpa menjadi kaku.
- source_word: ἐν δυνάμει θεοῦ
  choice: oleh kuasa Allah
  rationale: Dalam konstruksi pasif ini, ἐν paling wajar menyatakan sarana; ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: διὰ πίστεως
  choice: melalui iman
  rationale: διά dengan genitif menyatakan perantaraan atau sarana. 'Iman' merupakan padanan utama πίστις di sini, sementara kemungkinan 'kepercayaan' dan, dengan peluang lebih kecil, 'kesetiaan' dicatat dalam catatan kaki.
- source_word: εἰς σωτηρίαν
  choice: untuk menerima keselamatan
  rationale: εἰς menyatakan arah atau tujuan. Penambahan 'menerima' membuat hubungan tujuan alami dalam bahasa Indonesia tanpa mengubah keselamatan menjadi hasil usaha manusia.
- source_word: ἑτοίμην ἀποκαλυφθῆναι
  choice: yang siap dinyatakan
  rationale: Konstruksi adjektiva dan infinitif pasif diterjemahkan secara langsung dan alami, dengan tetap mempertahankan kesiapan serta sifat pewahyuan yang akan datang.
- source_word: ἐν καιρῷ ἐσχάτῳ
  choice: pada waktu terakhir
  rationale: καιρός menunjuk pada waktu atau saat yang menentukan. 'Pada waktu terakhir' alami dalam bahasa Indonesia dan mempertahankan orientasi eskatologis tanpa memasukkan skema tertentu.
- source_word: τοὺς
  choice: yang
  rationale: Artikel akusatif ini melanjutkan rujukan kepada para penerima surat dari ayat sebelumnya; pronomina relatif 'yang' menjaga keterkaitan itu dengan lancar.
theological_decisions:
- issue: Hubungan antara pemeliharaan ilahi dan tanggapan manusia dalam διὰ πίστεως
  choice: Allah menjaga dengan kuasa-Nya, dan iman dinyatakan sebagai sarana perantara.
  alternative: Allah menjaga tanpa kaitan sintaksis yang berarti dengan iman; atau πίστις terutama berarti kesetiaan manusia di sini.
  rationale: Terjemahan mempertahankan kuasa Allah dan iman dalam hubungan yang dinyatakan teks, tanpa menentukan doktrin denominasi tentang ketekunan atau kemungkinan murtad.
- issue: Waktu keselamatan secara eskatologis
  choice: Keselamatan dalam ayat ini berorientasi pada penyingkapannya di masa depan.
  alternative: Keselamatan hanya menunjuk pada pertobatan masa kini; atau ayat ini meniadakan seluruh dimensi keselamatan masa kini.
  rationale: Frasa 'siap dinyatakan pada waktu terakhir' jelas berorientasi ke depan, tetapi teks ini sendiri tidak meniadakan dimensi lain dari keselamatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang bermartabat dan mudah dipahami. Susunan tetap terkait dengan ayat sebelumnya melalui 'yang'; semua penanda catatan kaki dicantumkan dalam teks utama.
