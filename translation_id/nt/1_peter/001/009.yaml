translation:
  language: id
  text: sementara kalian sedang menerima hasil[a] dari iman kalian, yaitu keselamatan jiwa kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tujuan akhir” atau “hasil akhir” dari iman kalian.
    reason: lexical_alternative
  - marker: b
    text: Atau “keselamatan nyawa kalian” atau “keselamatan diri kalian”. Kata Yunani yang digunakan dapat berarti “jiwa”, “nyawa”, atau “diri”, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιζόμενοι
  choice: sedang menerima
  rationale: Partisipel kini ini menyatakan bahwa para pembaca sedang memperoleh apa yang dihasilkan oleh iman mereka. Bentuk ini mempertahankan nuansa berlangsung tanpa memaksakan pembedaan diatesis yang tidak utama dalam konteks.
- source_word: τέλος
  choice: hasil
  rationale: Dalam konteks ini, τέλος menunjuk pada hasil yang dicapai atau tujuan akhir iman. “Hasil” paling alami dalam bahasa Indonesia dan tidak membatasi maknanya pada akhir secara waktu saja.
- source_word: πίστεως
  choice: iman
  rationale: Genitif ini paling wajar merujuk pada iman para pembaca. “Iman” mempertahankan istilah teologis yang lazim tanpa mengubahnya menjadi kesetiaan.
- source_word: ὑμῶν
  choice: kalian
  rationale: Kata ganti ini berbentuk jamak dan menerangkan “iman”. “Kalian” menyatakan jamaknya dengan jelas dalam bahasa Indonesia modern.
- source_word: σωτηρίαν
  choice: keselamatan
  rationale: “Keselamatan” merupakan padanan baku dan sesuai konteks, serta dapat mencakup pengalaman sekarang maupun kepenuhannya pada masa mendatang.
- source_word: ψυχῶν
  choice: jiwa kalian
  rationale: “Jiwa” merupakan padanan langsung yang mempertahankan ungkapan Yunani. Catatan kaki menjaga kemungkinan makna “nyawa” atau “diri” tanpa memaksakan antropologi dualistis.
theological_decisions:
- issue: Makna πίστις dalam frasa “iman kalian”
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Konteks paling alami menunjuk pada respons percaya para pembaca. Pilihan ini tidak mengubahnya menjadi kualitas kesetiaan, meskipun kemungkinan leksikal itu tetap diakui.
- issue: Makna ψυχαί dalam frasa “keselamatan jiwa”
  choice: jiwa
  alternative: nyawa; diri
  rationale: Terjemahan ini dekat dengan bentuk Yunani dan mempertahankan ketegangan antropologis teks. Kata “jiwa” di sini tidak dimaksudkan untuk menyangkal keselamatan tubuh atau menetapkan pemisahan mutlak antara tubuh dan jiwa.
- issue: Hubungan σωτηρίαν ψυχῶν dengan τέλος τῆς πίστεως
  choice: yaitu keselamatan jiwa kalian
  alternative: 'hasil dari iman kalian: keselamatan jiwa kalian'
  rationale: σωτηρίαν ψυχῶν berada dalam aposisi terhadap τέλος τῆς πίστεως, sehingga “yaitu” menjelaskan bahwa keselamatan jiwa adalah hasil yang sedang diterima, tanpa menambahkan hubungan teologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipakai untuk menyatakan bentuk jamak Yunani secara eksplisit. Kata “sedang” mempertahankan aspek partisipel kini, sedangkan “yaitu” membuat hubungan aposisional antarklausa terbaca alami.
