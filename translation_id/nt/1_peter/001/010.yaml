  text: Περὶ ἧς σωτηρίας ἐξεζήτησαν καὶ ἐξηραύνησαν προφῆται οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/010.yaml
  text: Concerning this salvation[a], the prophets who prophesied about the grace for you searched and investigated carefully[b],
translation:
  language: id
  text: Mengenai keselamatan ini, para nabi yang bernubuat tentang anugerah bagi kamu telah mencari dengan sungguh-sungguh dan menyelidikinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Περὶ ἧς σωτηρίας
  choice: Tentang keselamatan inilah
  rationale: περί dengan genitif menyatakan pokok pembicaraan, sedangkan ἧς merujuk kembali kepada keselamatan dalam konteks sebelumnya. Bentuk “inilah” menjaga daya rujuk itu secara alami dalam bahasa Indonesia.
- source_word: σωτηρίας
  choice: keselamatan
  rationale: Dalam konteks 1 Petrus, σωτηρία memuat bobot teologis keselamatan dan selaras dengan konteks terdekat.
- source_word: ἐξεζήτησαν
  choice: telah mencari
  rationale: Kata kerja ini menyatakan upaya mencari dengan sungguh-sungguh. “Mencari” alami dalam bahasa Indonesia dan tetap dapat dibedakan dari kata kerja berikutnya.
- source_word: ἐξηραύνησαν
  choice: menyelidikinya dengan saksama
  rationale: Kata ini berarti menyelidiki atau menelusuri secara mendalam. “Dengan saksama” mempertahankan intensifikasi dari pasangan kedua kata kerja; akhiran -nya memperjelas bahwa objeknya ialah keselamatan tersebut.
- source_word: προφῆται
  choice: para nabi
  rationale: Frasa partisipial berartikel sesudahnya mengidentifikasi kelompok nabi yang dimaksud. “Para nabi” merupakan bentuk Indonesia yang wajar untuk kelompok tersebut.
- source_word: οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες
  choice: yang bernubuat mengenai anugerah bagi kamu
  rationale: Frasa partisipial ini menerangkan para nabi. περί menyatakan isi nubuat, sementara εἰς ὑμᾶς dapat menyatakan arah atau manfaat; “bagi kamu” mempertahankan nuansa itu tanpa menambahkan unsur waktu yang tidak dinyatakan secara eksplisit.
- source_word: χάριτος
  choice: anugerah
  rationale: Dalam konteks sejarah keselamatan, χάρις menunjuk kepada kemurahan Allah. “Anugerah” adalah istilah baku, jelas, dan bermartabat dalam bahasa Indonesia modern.
- source_word: εἰς ὑμᾶς
  choice: bagi kamu
  rationale: Pilihan ini menyampaikan arah sekaligus manfaat anugerah kepada para pembaca dengan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah unsur masa depan dalam frasa “anugerah bagi kamu” perlu dinyatakan secara eksplisit
  choice: Tidak menambahkan “yang akan datang” dalam teks utama
  alternative: anugerah yang akan datang kepada kamu
  rationale: Orientasi ke masa depan dapat disimpulkan dari konteks nubuat, tetapi ayat ini sendiri tidak memuat kata kerja atau partisip eksplisit yang menyatakan masa depan. Terjemahan utama karena itu tidak memperjelas secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan topik yang dikedepankan dalam bahasa Yunani sambil tetap mudah dibaca. Dua kata kerja pencarian dibedakan untuk menjaga intensifikasi retoris sumber.
