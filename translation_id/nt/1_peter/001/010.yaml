  source_fidelity: Dua verba aoris ἐξεζήτησαν dan ἐξηραύνησαν dipertahankan, demikian pula topik yang didahulukan, para nabi sebagai pelaku, serta isi nubuat tentang anugerah bagi para pembaca. Namun, dalam teks draf, pronomina -nya hanya melekat pada verba kedua, sehingga hubungan kedua verba dengan “keselamatan ini” kurang sejajar dan “mencari” dapat terbaca seolah-olah para nabi mencari keselamatan itu sendiri.
  naturalness: “Tentang keselamatan inilah” dapat dipahami, tetapi susunannya agak bertanda dalam prosa Indonesia modern. “Mengenai keselamatan ini” lebih lugas dan tetap mempertahankan rujukan anaforis dari ἧς. Menempatkan “dengan sungguh-sungguh” pada verba pertama dan objek pada kedua verba menghasilkan kalimat yang lebih alami.
  terminology: “Keselamatan,” “nabi,” “bernubuat,” dan “anugerah” tepat untuk register baku dan konteks surat ini. “Bagi kamu” secara memadai menyampaikan εἰς ὑμᾶς tanpa memasukkan unsur waktu yang tidak eksplisit.
