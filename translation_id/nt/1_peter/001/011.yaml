  terminology: ‘Roh Mesias’ tepat untuk πνεῦμα Χριστοῦ sesuai kebijakan proyek. ‘Penderitaan bagi Mesias’ secara hati-hati mempertahankan keluwesan εἰς Χριστόν, dan catatan kaki dengan tepat mencatat pembacaan kontekstual ‘penderitaan Mesias’.
