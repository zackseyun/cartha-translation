revisions:
- from: Mereka menyelidiki kapan atau masa seperti apa yang ditunjukkan oleh Roh Mesias yang ada di dalam mereka, ketika Roh itu sebelumnya memberi kesaksian tentang penderitaan bagi Mesias[a] dan berbagai kemuliaan sesudah semuanya itu.
  to: Mereka menyelidiki pribadi mana atau masa seperti apa yang sedang ditunjukkan oleh Roh Mesias yang ada di dalam mereka, yang terlebih dahulu memberi kesaksian tentang penderitaan bagi Mesias[a] dan kemuliaan-kemuliaan sesudahnya.
  rationale: Revisi memulihkan kontras eksplisit antara τίνα (‘pribadi mana’) dan ποῖον καιρόν (‘masa seperti apa’) tanpa memutuskan secara spekulatif identitas pribadi itu. ‘Sedang ditunjukkan’ mempertahankan daya imperfek ἐδήλου. Klausa relatif ‘yang terlebih dahulu memberi kesaksian’ tetap merujuk pada ‘Roh Mesias’, dan ‘kemuliaan-kemuliaan sesudahnya’ mempertahankan bentuk jamak δόξας serta hubungan temporal μετὰ ταῦτα.
