  text: ἐραυνῶντες εἰς τίνα ἢ ποῖον καιρὸν ἐδήλου τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ προμαρτυρόμενον τὰ εἰς Χριστὸν παθήματα καὶ τὰς μετὰ ταῦτα δόξας·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/011.yaml
  text: inquiring into what person or what time the Spirit of Messiah in them was indicating[a], as it testified beforehand to the sufferings for Messiah and the glories after these things.
translation:
  language: id
  text: Mereka menyelidiki pribadi mana atau masa seperti apa yang sedang ditunjukkan oleh Roh Mesias yang ada di dalam mereka, yang terlebih dahulu memberi kesaksian tentang penderitaan bagi Mesias[a] dan kemuliaan-kemuliaan sesudahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “penderitaan Mesias.”
    reason: Ungkapan Yunani dapat dipahami sebagai penderitaan yang diperuntukkan bagi atau berkaitan dengan Mesias, maupun secara kontekstual sebagai penderitaan yang dialami Mesias.
lexical_decisions:
- source_word: ἐραυνῶντες
  choice: Mereka menyelidiki
  rationale: Partisipel ini melanjutkan kegiatan para nabi dalam ayat sebelumnya. 'Menyelidiki' menyampaikan usaha pencarian yang tekun dengan bahasa Indonesia yang wajar.
- source_word: εἰς τίνα ἢ ποῖον καιρόν
  choice: kapan atau masa seperti apa
  rationale: 'τίνα dan ποῖον paling wajar dipahami bersama καιρόν: para nabi menyelidiki waktu yang dimaksud dan seperti apa ciri masa itu. Rumusan ini mempertahankan dua sisi pertanyaan tanpa memaksakan τίνα sebagai rujukan kepada seorang pribadi.'
- source_word: ἐδήλου
  choice: yang ditunjukkan
  rationale: Pilihan ini menyampaikan tindakan Roh yang memberi petunjuk atau menyatakan sesuatu. Konteks kalimat Indonesia tetap memungkinkan nuansa tindakan yang berlangsung.
- source_word: τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ
  choice: Roh Mesias yang ada di dalam mereka
  rationale: Susunan ini mempertahankan hubungan langsung Roh dengan Mesias dan keberadaan Roh di dalam para nabi. Χριστός diterjemahkan sebagai gelar 'Mesias'.
- source_word: προμαρτυρόμενον
  choice: sebelumnya memberi kesaksian
  rationale: Terjemahan ini mempertahankan unsur kesaksian dalam μαρτυρέω dan unsur waktu sebelumnya dalam awalan προ-.
- source_word: τὰ εἰς Χριστὸν παθήματα
  choice: penderitaan bagi Mesias
  rationale: Rumusan ini mempertahankan secara ringkas relasi yang diungkapkan oleh εἰς tanpa menambahkan gagasan 'ditakdirkan' yang tidak dinyatakan secara eksplisit. Kemungkinan makna posesif yang kuat dicantumkan dalam catatan kaki.
- source_word: τὰς μετὰ ταῦτα δόξας
  choice: berbagai kemuliaan sesudah semuanya itu
  rationale: '''Berbagai kemuliaan'' mempertahankan bentuk jamak δόξας secara alami, sedangkan ''sesudah semuanya itu'' menyampaikan urutan setelah penderitaan yang baru disebutkan.'
theological_decisions:
- issue: Makna 'Roh Mesias' dalam hubungannya dengan para nabi
  choice: Mempertahankan ungkapan langsung 'Roh Mesias yang ada di dalam mereka'.
  alternative: Roh kenabian yang berbicara tentang Mesias; Roh yang diberikan oleh Mesias.
  rationale: Teks Yunani secara langsung mengaitkan Roh dengan Mesias dan menyatakan bahwa Roh itu berada di dalam para nabi. Terjemahan tidak mereduksi atau menjelaskan hubungan teologis tersebut secara sepihak.
- issue: Daya makna εἰς dalam τὰ εἰς Χριστὸν παθήματα
  choice: penderitaan bagi Mesias
  alternative: penderitaan Mesias; penderitaan yang berkaitan dengan Mesias
  rationale: Konstruksi ini memiliki keluwesan makna. Teks utama mempertahankan nuansa relasional preposisi εἰς, sementara catatan kaki menyajikan pemahaman posesif yang tradisional dan kuat secara kontekstual.
- issue: Rujukan εἰς τίνα ἢ ποῖον καιρόν
  choice: kapan atau masa seperti apa
  alternative: pribadi mana atau masa apa
  rationale: καιρόν secara paling alami menjadi nomina yang diterangkan oleh kedua unsur pertanyaan. Terjemahan ini menjaga pertanyaan tentang waktu dan sifat masa tersebut serta menghindari pengenalan rujukan pribadi yang tidak harus dituntut oleh sintaksis Yunani.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pengulangan 'Roh itu' dipakai untuk memperjelas pelaku 'memberi kesaksian' tanpa mengubah rujukan. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang diterangkannya.
