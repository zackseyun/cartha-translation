  naturalness: “Sebab ada tertulis” dan “Aku kudus” wajar dalam register Alkitab Indonesia modern. “Kamu akan menjadi kudus” terdengar lebih sebagai prediksi atau proses perubahan daripada tuntutan etis. “Kamu harus kudus” lebih idiomatis dan jelas sebagai tuntutan.
  terminology: “Kudus” adalah padanan baku dan tepat bagi ἅγιος di sini. “Aku” mempertahankan penegasan subjek ilahi tanpa menambahkan tafsiran. Catatan kaki perlu menyatakan bahwa bentuk futur Yunani secara harfiah tidak mencakup kata “menjadi.”
