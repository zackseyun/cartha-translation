  text: sebab ada tertulis[a], “Kamu harus kudus, sebab Aku kudus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Kamu akan kudus.” Bahasa Yunani mengikuti rumusan kutipan Kitab Suci dalam bentuk futur; dalam konteks ini bentuk tersebut berdaya perintah.
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: sebab
  rationale: Memperkenalkan dasar Kitab Suci bagi nasihat sebelumnya dan mempertahankan hubungan sebab-akibat secara alami dalam bahasa Indonesia.
- source_word: γέγραπται
  choice: ada tertulis
  rationale: Ungkapan baku untuk memperkenalkan kutipan Kitab Suci; bentuk ini juga menyiratkan bahwa apa yang telah ditulis tetap berlaku.
- source_word: ὅτι (pertama)
  choice: tidak diterjemahkan secara tersurat
  rationale: Berfungsi memperkenalkan kutipan langsung; dalam bahasa Indonesia, tanda kutip sudah menjalankan fungsi tersebut.
- source_word: Ἅγιοι
  choice: kudus
  rationale: Mencakup makna etis dan perjanjian dalam konteks ini, bukan sekadar ‘terpisah’ atau ‘dikhususkan’.
- source_word: ἔσεσθε
  choice: akan menjadi
  rationale: Mempertahankan bentuk gramatikal futur dalam kutipan Yunani sekaligus membiarkan nuansa perintah yang dimiliki rumusan Kitab Suci dijelaskan dalam catatan kaki.
- source_word: ὅτι (kedua)
  choice: sebab
  rationale: Mengungkapkan alasan bagi panggilan untuk hidup kudus, yaitu kekudusan Allah sendiri.
- source_word: ἐγὼ
  choice: Aku
  rationale: Mempertahankan pronomina yang tersurat dan bernada tegas dalam pernyataan diri Allah.
- source_word: ἅγιος
  choice: kudus
  rationale: Menjaga kesepadanan dengan sebutan bagi umat dan menegaskan bahwa kekudusan mereka didasarkan pada kekudusan Allah.
theological_decisions:
- issue: Daya futur ἔσεσθε dalam kutipan tentang kekudusan
  choice: “Kamu akan menjadi kudus” untuk mempertahankan bentuk futur Yunani.
  alternative: “Hendaklah kamu kudus” atau “Jadilah kudus.”
  rationale: Teks Yunani mengikuti rumusan kutipan Kitab Suci dalam bentuk futur, tetapi dalam gaya hukum dan nasihat alkitabiah bentuk itu dapat berdaya imperatif. Terjemahan utama mempertahankan bentuknya, sedangkan catatan kaki menyatakan daya perintahnya tanpa menghapus ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Ada tertulis” mempertahankan formula kutipan Kitab Suci, sedangkan “kudus” menjaga istilah teologis yang umum dan dapat dipahami.
