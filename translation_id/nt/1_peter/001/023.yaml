  text: ἀναγεγεννημένοι οὐκ ἐκ σπορᾶς φθαρτῆς ἀλλὰ ἀφθάρτου, διὰ λόγου ζῶντος θεοῦ καὶ ⸀μένοντος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/023.yaml
  text: having been born again[a], not from perishable seed but imperishable, through the living and abiding word of God.
translation:
  language: id
  text: Kamu telah dilahirkan kembali, bukan dari benih yang dapat binasa, melainkan dari benih yang tidak dapat binasa, melalui firman Allah—firman yang hidup dan tetap ada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melalui firman dari Allah yang hidup dan tetap ada.” Dalam bahasa Yunani, kata-kata “hidup” dan “tetap ada” dapat menerangkan “firman” ataupun “Allah”, meskipun konteks lebih mendukung bahwa keduanya menerangkan “firman”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγεγεννημένοι
  choice: telah dilahirkan kembali
  rationale: Partisipel perfek pasif ini menyatakan tindakan yang telah terjadi dengan hasil yang terus berlangsung. Bentuk pasif dan gagasan kelahiran kembali dipertahankan secara wajar dalam bahasa Indonesia.
- source_word: σπορᾶς
  choice: benih
  rationale: Dalam pertentangan metaforis antara yang dapat dan tidak dapat binasa, 'benih' alami dalam bahasa Indonesia serta mempertahankan kaitannya dengan gambaran kelahiran.
- source_word: φθαρτῆς
  choice: yang dapat binasa
  rationale: Padanan ini jelas dan alami, sekaligus membentuk pertentangan langsung dengan ἀφθάρτου.
- source_word: ἀφθάρτου
  choice: yang tidak dapat binasa
  rationale: Pilihan ini mempertahankan kontras leksikal dengan φθαρτῆς tanpa memakai istilah yang kaku atau kurang umum.
- source_word: διὰ
  choice: melalui
  rationale: Dengan kasus genitif, διά menunjukkan sarana atau perantaraan; 'melalui' ringkas dan tepat.
- source_word: λόγου
  choice: firman
  rationale: Dalam konteks pewartaan ilahi pada ayat-ayat berikutnya, 'firman' merupakan padanan Indonesia yang mapan dan tetap dekat dengan λόγος; 'pesan' mungkin, tetapi lebih interpretatif.
- source_word: ζῶντος
  choice: yang hidup
  rationale: Partisipel kini ini digunakan secara adjektival. 'Yang hidup' merupakan padanan langsung dan wajar ketika menerangkan 'firman'.
- source_word: θεοῦ
  choice: Allah
  rationale: Genitif ini paling alami dipahami sebagai 'firman Allah', yang dapat menyatakan kepunyaan atau sumber tanpa mempersempitnya hanya menjadi 'dari Allah'.
- source_word: μένοντος
  choice: tetap ada
  rationale: Ungkapan ini menyampaikan makna keberlangsungan μένω dalam bahasa Indonesia modern dengan lebih alami daripada 'berdiam' dan lebih dekat secara leksikal daripada parafrasa 'kekal'.
theological_decisions:
- issue: Apakah ζῶντος dan μένοντος menerangkan 'firman' atau 'Allah'
  choice: 'Keduanya menerangkan ''firman'': ''firman Allah yang hidup dan tetap ada'''
  alternative: '''firman dari Allah yang hidup dan tetap ada'''
  rationale: Secara gramatikal, kedua partisipel genitif maskulin tunggal dapat berhubungan dengan λόγου, sementara θεοῦ menjadi genitif yang bergantung pada λόγου. Konteks dekat, terutama ayat 25, juga menekankan firman yang tetap. Namun, karena bentuk-bentuk tersebut juga cocok dengan θεοῦ, kemungkinan bahwa keduanya menerangkan Allah dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'kamu' dipakai untuk nomina jamak tersirat dalam partisipel Yunani. Klausa partisipial dibuat menjadi klausa utama agar ayat dapat dibaca alami sebagai satuan tersendiri, tanpa menghilangkan hasil berkelanjutan yang dinyatakan oleh bentuk perfek.
