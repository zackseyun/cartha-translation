id: 1PE.1.13
reference: 1 Peter 1:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διὸ ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν, νήφοντες τελείως, ἐλπίσατε ἐπὶ τὴν φερομένην ὑμῖν χάριν ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/013.yaml
  text: Therefore[a], having girded up the loins of your mind, being fully clear-minded[d][c][b], set your hope completely on the grace being brought to you at the revelation of Jesus the Messiah.
translation:
  language: id
  text: Karena itu, siapkanlah pikiran kalian untuk bertindak[a], tetaplah berpikiran jernih, dan letakkanlah harapan kalian sepenuhnya[b] pada anugerah yang sedang dibawa kepada kalian pada saat Yesus Sang Mesias dinyatakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ikatlah pinggang pikiran kalian,” yaitu bersiaplah secara mental untuk bertindak.
    reason: lexical_alternative
  - marker: b
    text: Atau, “tetaplah sepenuhnya berpikiran jernih, dan letakkanlah harapan kalian pada anugerah.” Kata yang berarti “sepenuhnya” dapat dipahami menerangkan kejernihan pikiran atau tindakan menaruh harapan.
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan atau dorongan yang ditarik dari uraian sebelumnya, dengan ungkapan Indonesia yang wajar.
- source_word: ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν
  choice: siapkanlah pikiranmu untuk bertindak
  rationale: Ungkapan harfiah 'mengikat pinggang pikiran' menggambarkan kesiapan untuk bertindak, tetapi tidak langsung dipahami dalam bahasa Indonesia modern; maknanya disampaikan dalam teks dan citranya dipertahankan dalam catatan kaki.
- source_word: νήφοντες
  choice: tetaplah berpikiran jernih
  rationale: Dalam konteks ini kata tersebut bersifat kiasan dan menunjuk pada kewaspadaan serta kejernihan mental, bukan terutama pantang dari minuman keras.
- source_word: τελείως
  choice: seluruh
  rationale: 'Dihubungkan dengan perintah menaruh pengharapan: seluruh pengharapan diarahkan kepada anugerah. Kemungkinan bahwa kata ini menerangkan kejernihan pikiran dicatat dalam catatan kaki.'
- source_word: ἐλπίσατε ἐπὶ
  choice: taruhlah ... pengharapanmu pada
  rationale: Mengungkapkan imperatif yang mengarahkan pengharapan secara tegas kepada satu sasaran.
- source_word: τὴν φερομένην ὑμῖν χάριν
  choice: anugerah yang sedang dibawa kepadamu
  rationale: Mempertahankan aspek partisipel kini pasif φερομένην serta arah penerima yang dinyatakan oleh ὑμῖν.
- source_word: ἐν ἀποκαλύψει
  choice: ketika ... dinyatakan
  rationale: Menyampaikan hubungan temporal antara datangnya anugerah dan penyingkapan Yesus secara alami dalam bahasa Indonesia.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus sang Mesias
  rationale: Χριστός tetap terdengar sebagai gelar; 'sang Mesias' merupakan bentuk Indonesia yang idiomatis dan bermartabat.
theological_decisions:
- issue: Metafora 'mengikat pinggang pikiran' dibandingkan makna idiomatisnya
  choice: Makna idiomatis 'siapkanlah pikiranmu untuk bertindak' ditempatkan dalam teks utama.
  alternative: Ikatlah pinggang pikiranmu.
  rationale: Metafora sumber penting, tetapi bentuk harfiahnya terasa asing dan berpotensi membingungkan pembaca Indonesia. Catatan kaki mempertahankan citra asli tanpa mengorbankan kejelasan.
- issue: Cakupan τελείως
  choice: 'Dihubungkan dengan ἐλπίσατε: ''taruhlah seluruh pengharapanmu''.'
  alternative: 'Dihubungkan dengan νήφοντες: ''berpikiran sepenuhnya jernih''.'
  rationale: Letaknya memungkinkan kedua hubungan sintaksis. Teks utama memilih hubungan yang alami dengan imperatif, sedangkan ambiguitas asli dinyatakan dalam catatan kaki.
- issue: Makna Χριστός
  choice: sang Mesias
  alternative: Kristus
  rationale: Dalam konteks penyingkapan eskatologis ini, nilai Χριστός sebagai gelar tetap nyata; terjemahan tidak memperlakukannya sekadar sebagai nama diri.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ajakan yang tegas dan bermartabat. Bentuk tunggal 'pikiranmu/kepadamu' mengikuti sapaan kolektif sumber Yunani dan gaya umum terjemahan Alkitab Indonesia; 'anugerah' dipilih untuk χάρις, sedangkan 'sang Mesias' mempertahankan fungsi gelar.
