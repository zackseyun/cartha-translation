  text: προεγνωσμένου μὲν πρὸ καταβολῆς κόσμου, φανερωθέντος δὲ ἐπ’ ⸀ἐσχάτου τῶν χρόνων δι’ ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/020.yaml
  text: He was foreknown before the foundation of the world[a], but was revealed at the end of the times for your sake[b],
translation:
  language: id
  text: Ia memang telah dikenal sebelumnya, sebelum dunia dijadikan[a], tetapi dinyatakan pada akhir zaman demi kamu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah dipilih sebelumnya”; teks Yunani mengatakan “telah dikenal sebelumnya”. Ungkapan itu dapat menyiratkan maksud ilahi, tetapi tafsiran yang lebih lengkap tersebut tidak harus dimasukkan ke dalam teks utama.
    reason: lexical_alternative
  - marker: b
    text: Atau “pada zaman-zaman terakhir ini”.
    reason: alternative_reading
lexical_decisions:
- source_word: προεγνωσμένου
  choice: telah dikenal sebelumnya
  rationale: Bentuk partisip pasif aoris ini menerangkan Kristus yang disebut dalam ayat 19. Terjemahan ini mempertahankan arti dasar προγινώσκω tanpa langsung menafsirkannya sebagai pemilihan atau penetapan sebelumnya.
- source_word: πρὸ καταβολῆς κόσμου
  choice: sebelum dunia dijadikan
  rationale: Ungkapan Yunani ini secara harfiah merujuk pada waktu sebelum peletakan dasar dunia. Dalam bahasa Indonesia, 'sebelum dunia dijadikan' menyampaikan maksud penciptaan secara alami dan jelas.
- source_word: φανερωθέντος
  choice: dinyatakan
  rationale: Partisip pasif ini menyatakan bahwa Kristus dibuat nyata atau diperlihatkan secara terbuka. 'Dinyatakan' alami dalam bahasa Indonesia dan tetap mempertahankan unsur penyingkapan.
- source_word: ἐπ’ ἐσχάτου τῶν χρόνων
  choice: pada akhir segala zaman
  rationale: Pilihan ini mempertahankan daya temporal dan eskatologis ungkapan Yunani, yang secara dekat berarti 'pada bagian terakhir dari zaman-zaman', tanpa menambahkan kata penunjuk 'ini' yang tidak tersurat.
- source_word: δι’ ὑμᾶς
  choice: demi kamu
  rationale: διά dengan akusatif di sini menyatakan kepentingan atau manfaat bagi para pembaca. 'Demi kamu' menyampaikannya dengan ringkas dan alami.
theological_decisions:
- issue: Makna προεγνωσμένου mengenai Kristus sebelum penciptaan
  choice: Memakai 'telah dikenal sebelumnya' dalam teks utama.
  alternative: telah dipilih sebelumnya; telah ditetapkan sebelumnya
  rationale: Kata Yunani dapat menyiratkan maksud ilahi, tetapi tidak dengan sendirinya mengharuskan penerjemah menggantinya dengan istilah pemilihan atau penetapan. Terjemahan utama mempertahankan ketegangan teologis teks.
- issue: Daya temporal ἐπ’ ἐσχάτου τῶν χρόνων
  choice: Memakai 'pada akhir segala zaman'.
  alternative: pada zaman-zaman terakhir ini
  rationale: Teks Yunani menunjuk pada masa eskatologis, tetapi tidak secara eksplisit memuat kata penunjuk 'ini'. Pilihan utama lebih dekat dengan bentuk sumber sekaligus tetap dapat dipahami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan 'memang ... tetapi ...' mencerminkan kontras μέν ... δέ. Kata ganti 'Ia' mengikuti rujukan kepada Kristus dari ayat sebelumnya.
