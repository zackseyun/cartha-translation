id: 1PE.1.24
reference: 1 Peter 1:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διότι πᾶσα σὰρξ ὡς χόρτος, καὶ πᾶσα δόξα ⸀αὐτῆς ὡς ἄνθος χόρτου· ἐξηράνθη ὁ χόρτος, καὶ τὸ ⸀ἄνθος ἐξέπεσεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/024.yaml
  text: because all flesh is like grass[a], and all its glory is like the flower of grass; the grass withered[b], and the flower fell off.
translation:
  language: id
  text: sebab, “Semua manusia[a] seperti rumput, dan segala kemuliaannya[b] seperti bunga rumput; rumput mengering, dan bunganya gugur.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “semua daging,” yaitu seluruh umat manusia. Ungkapan ini menggemakan Yesaya 40:6 dan menekankan kefanaan manusia.
    reason: lexical_alternative
  - marker: b
    text: Atau “segala semaraknya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: sebab
  rationale: Menunjukkan bahwa kutipan Kitab Suci ini menjadi dasar bagi pernyataan sebelumnya; ‘sebab’ mempertahankan hubungan kausal secara wajar.
- source_word: πᾶσα σὰρξ
  choice: semua manusia[a]
  rationale: Secara harfiah berarti ‘semua daging’, tetapi dalam konteks Yesaya 40:6 frasa ini merujuk kepada seluruh umat manusia dalam kefanaan mereka. Terjemahan utama dibuat alami, sedangkan bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: ὡς χόρτος
  choice: seperti rumput
  rationale: Mempertahankan perbandingan yang menggambarkan singkat dan rapuhnya kehidupan manusia.
- source_word: πᾶσα δόξα αὐτῆς
  choice: segala kemuliaannya[b]
  rationale: δόξα di sini dapat menunjuk pada kemuliaan, kehormatan, atau semarak yang dimiliki manusia; akhiran ‘-nya’ merujuk kembali kepada umat manusia secara kolektif.
- source_word: ὡς ἄνθος χόρτου
  choice: seperti bunga rumput
  rationale: Mempertahankan gambaran genitif dalam teks Yunani dan kaitannya dengan rumput, tanpa menggantinya dengan ‘bunga di padang’.
- source_word: ἐξηράνθη
  choice: mengering
  rationale: Menggambarkan rumput yang kehilangan kesegarannya; bentuk bahasa Indonesia ini alami dan tidak memaksakan penandaan kala yang tidak dimiliki bahasa Indonesia.
- source_word: ἐξέπεσεν
  choice: gugur
  rationale: ‘Gugur’ merupakan ungkapan alami untuk bunga yang jatuh atau terlepas dari tangkainya.
theological_decisions:
- issue: Makna σάρξ dalam kutipan tentang kefanaan manusia
  choice: semua manusia
  alternative: semua daging
  rationale: Konteksnya bukan sifat berdosa, melainkan seluruh manusia sebagai makhluk fana. ‘Semua manusia’ menyampaikan rujukannya dengan jelas, sementara catatan kaki mempertahankan ungkapan harfiah dan gema Yesaya 40:6.
- issue: Cakupan δόξα αὐτῆς
  choice: segala kemuliaannya
  alternative: segala semaraknya
  rationale: Terjemahan ini membiarkan δόξα mencakup kehormatan, keindahan, dan kebesaran manusia tanpa mempersempitnya pada satu aspek.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secukupnya untuk sebuah kutipan Kitab Suci. Tanda petik menunjukkan bahwa ayat ini mengutip Yesaya 40:6. Tanda titik koma mempertahankan aliran satu kalimat dan hubungan erat antara perbandingan dan hasilnya.
