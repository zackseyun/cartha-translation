base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/021.yaml
  text: who through him are believers in God[a], who raised him from the dead and gave him glory[b], so that your faith and hope are in God.
translation:
  language: id
  text: Kamu yang melalui Dia percaya kepada Allah[a], yang telah membangkitkan Dia dari antara orang mati dan memberi-Nya kemuliaan, sehingga[b] iman dan pengharapanmu tertuju kepada Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang yang setia kepada Allah melalui Dia”; dalam susunan kalimat ini, makna “orang-orang yang percaya kepada Allah melalui Dia” lebih mungkin.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dengan akibat bahwa iman dan pengharapanmu tertuju kepada Allah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: Melalui Dia
  rationale: διά dengan genitif menyatakan perantaraan atau sarana. Pilihan ini menunjukkan bahwa orang percaya datang kepada iman kepada Allah melalui Kristus tanpa memperluas maknanya menjadi rumusan teologis tambahan.
- source_word: πιστοὺς εἰς θεόν
  choice: kamu percaya kepada Allah
  rationale: Dalam konstruksi dengan εἰς θεόν, πιστούς paling wajar menunjuk kepada orang-orang yang percaya kepada Allah. Bentuk verbal ini lebih alami dalam bahasa Indonesia daripada sebutan “orang-orang percaya” di tengah kalimat.
- source_word: τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν
  choice: yang telah membangkitkan Dia dari antara orang mati
  rationale: Ungkapan ini menerjemahkan idiom kebangkitan secara langsung. “Dari antara orang mati” mempertahankan unsur ἐκ νεκρῶν dan tetap jelas bagi pembaca modern.
- source_word: δόξαν αὐτῷ δόντα
  choice: dan memberi-Nya kemuliaan
  rationale: Terjemahan langsung ini mempertahankan kesejajaran dengan tindakan Allah yang membangkitkan Kristus dan tidak mereduksi δόξα menjadi sekadar penghormatan manusia.
- source_word: ὥστε
  choice: sehingga
  rationale: “Sehingga” secara alami memperkenalkan keadaan yang dihasilkan oleh tindakan Allah, sambil tidak sepenuhnya menutup kemungkinan nuansa maksud.
- source_word: τὴν πίστιν ὑμῶν καὶ ἐλπίδα
  choice: iman dan pengharapanmu
  rationale: “Iman” dan “pengharapan” merupakan padanan baku, jelas, dan sesuai konteks untuk πίστις dan ἐλπίς. Akhiran tunggal kolektif “-mu” mengikuti sapaan langsung kepada komunitas pembaca.
- source_word: εἶναι εἰς θεόν
  choice: tertuju kepada Allah
  rationale: Pilihan ini mempertahankan arah atau objek yang dinyatakan oleh εἰς dan berlaku secara alami bagi baik iman maupun pengharapan.
theological_decisions:
- issue: Makna πιστούς
  choice: menunjuk kepada mereka yang percaya kepada Allah melalui Kristus
  alternative: menunjuk kepada mereka yang setia kepada Allah
  rationale: Hubungan langsung dengan εἰς θεόν lebih kuat mendukung arti percaya atau menaruh kepercayaan. Alternatif leksikal yang sah tetap dicatat dalam catatan kaki.
- issue: Peran Kristus dalam hubungan pembaca dengan Allah
  choice: “Melalui Dia” menyatakan perantaraan Kristus
  alternative: “oleh Dia” atau “karena Dia”
  rationale: διά dengan genitif paling lazim menyatakan sarana atau perantaraan. Terjemahan ini mengikuti tata bahasa tanpa memasukkan penjelasan doktrinal yang melampaui ayat.
- issue: Daya ὥστε
  choice: “sehingga” mempertahankan nuansa hasil yang mungkin juga menyentuh maksud
  alternative: “supaya” untuk maksud yang lebih tegas, atau “dengan akibat bahwa” untuk hasil yang lebih tegas
  rationale: Konstruksi tersebut dapat dipahami sebagai hasil, dengan kemungkinan nuansa tujuan. Teks utama tidak memaksakan pembedaan yang lebih tajam daripada bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Huruf kapital pada “Dia” dan “-Nya” dipakai untuk rujukan kepada Kristus sesuai kebiasaan penerbitan Alkitab Indonesia. Susunan kalimat dibuat alami sambil mempertahankan pengulangan arah kepada Allah dan ketegangan antara hasil serta maksud dalam ὥστε.
