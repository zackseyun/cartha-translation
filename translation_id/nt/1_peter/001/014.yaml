base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/014.yaml
  text: as children of obedience[a], not conforming yourselves to the desires you formerly had in your ignorance,
translation:
  language: id
  text: Sebagai anak-anak ketaatan[a], janganlah kamu membentuk dirimu menurut keinginan-keinginan yang dahulu kamu miliki dalam ketidaktahuanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “anak-anak yang taat.” Secara harfiah, teks Yunani berbunyi “anak-anak ketaatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Sebagai
  rationale: Menunjukkan identitas atau kedudukan yang menjadi dasar nasihat, dan sesuai dengan daya nasihat konteks.
- source_word: τέκνα ὑπακοῆς
  choice: anak-anak ketaatan
  rationale: 'Mempertahankan konstruksi genitif Yunani dan daya ungkapan etisnya: mereka dicirikan oleh ketaatan. Bentuk yang lebih idiomatis dicantumkan dalam catatan kaki.'
- source_word: μὴ συσχηματιζόμενοι
  choice: janganlah kamu mengikuti pola
  rationale: Mengungkapkan larangan yang sedang berlaku dengan tanggung jawab moral pembaca, sambil mempertahankan gagasan membentuk diri menurut suatu pola.
- source_word: ταῖς ... ἐπιθυμίαις
  choice: berbagai keinginan
  rationale: ἐπιθυμίαι menunjuk pada keinginan kuat yang bernilai buruk dalam konteks ini. 'Keinginan' alami dalam bahasa Indonesia dan tidak mempersempit artinya menjadi nafsu seksual saja; bentuk jamak diwakili secara wajar oleh 'berbagai'.
- source_word: πρότερον
  choice: yang dahulu kamu miliki
  rationale: Menandai keinginan-keinginan yang menjadi ciri kehidupan mereka sebelumnya; penambahan 'miliki' membuat hubungannya alami dalam bahasa Indonesia tanpa mengubah makna.
- source_word: ἐν τῇ ἀγνοίᾳ ὑμῶν
  choice: dalam ketidaktahuanmu
  rationale: Mempertahankan ungkapan preposisional dan nuansa keadaan hidup mereka dahulu tanpa menentukan lebih jauh objek ketidaktahuan tersebut.
theological_decisions:
- issue: Apakah ungkapan etis τέκνα ὑπακοῆς diperhalus menjadi frasa adjektival
  choice: anak-anak ketaatan
  alternative: anak-anak yang taat
  rationale: Bentuk genitif dipertahankan untuk menjaga tekanan identitas yang dicirikan oleh ketaatan, sedangkan padanan Indonesia yang lebih idiomatis diberikan sebagai alternatif dalam catatan kaki.
- issue: Apakah objek ketidaktahuan perlu dijelaskan sebagai ketidaktahuan akan Allah
  choice: tidak menambahkan objek ketidaktahuan
  alternative: ketika kamu belum mengenal Allah
  rationale: Teks Yunani hanya menyebut 'ketidaktahuanmu'. Tidak menambahkan objek menjaga ambiguitas dan menghindari penafsiran teologis yang melampaui ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'anak-anak ketaatan' sengaja agak bercorak sumber untuk mempertahankan metafora identitas; catatan kaki menyediakan bentuk yang lebih alami. Pronomina tunggal kolektif '-mu' mengikuti bentuk jamak Yunani yang dalam bahasa Indonesia dapat ditujukan kepada komunitas pembaca.
