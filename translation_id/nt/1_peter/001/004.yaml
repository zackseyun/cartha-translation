  text: into an inheritance imperishable and undefiled and unfading, kept in the heavens for you,
translation:
  language: id
  text: menuju suatu warisan yang tidak dapat binasa, tidak tercemar, dan tidak layu, yang terpelihara di surga bagi kamu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς κληρονομίαν
  choice: menuju suatu warisan
  rationale: Preposisi εἰς meneruskan arah/tujuan dari konteks sebelumnya, sedangkan κληρονομία berarti warisan; 'menuju' mempertahankan gerak menuju tujuan tanpa mengubahnya menjadi sekadar kepemilikan.
- source_word: ἄφθαρτον
  choice: yang tidak dapat binasa
  rationale: Mengungkapkan sifat warisan yang tidak mengalami kebinasaan atau kerusakan.
- source_word: ἀμίαντον
  choice: tidak tercemar
  rationale: Mempertahankan gagasan bahwa warisan itu tidak ternoda atau terkontaminasi.
- source_word: ἀμάραντον
  choice: tidak layu
  rationale: Mempertahankan citra sesuatu yang tidak kehilangan kesegaran, keindahan, atau kemuliaannya.
- source_word: τετηρημένην
  choice: yang tersimpan
  rationale: Bentuk perfekt pasif menunjukkan warisan itu telah dijaga dan tetap tersedia; 'tersimpan' menyampaikan keadaan berkelanjutan itu secara alami.
- source_word: ἐν οὐρανοῖς
  choice: di surga
  rationale: Bentuk jamak Yunani merupakan ungkapan lazim bagi ranah surgawi; bahasa Indonesia idiomatis memakai bentuk tunggal 'surga'.
- source_word: εἰς ὑμᾶς
  choice: bagi kamu
  rationale: Dalam kaitan dengan τετηρημένην, εἰς menyatakan pihak yang menjadi tujuan atau penerima warisan.
theological_decisions:
- issue: Hubungan εἰς κληρονομίαν dengan ayat sebelumnya
  choice: menuju suatu warisan
  alternative: kepada suatu warisan / untuk menerima suatu warisan
  rationale: Terjemahan mempertahankan unsur arah dalam εἰς dan tidak menambahkan verba 'menerima' yang tidak tertulis, sekalipun gagasan penerimaan tersirat dalam konsep warisan.
- issue: Makna τετηρημένην sebagai perfekt pasif
  choice: yang tersimpan
  alternative: yang dijaga / yang telah disediakan
  rationale: '''Tersimpan'' mencakup keadaan warisan yang tetap terpelihara bagi para penerima tanpa secara teologis memperinci siapa pelaku pasifnya.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Deretan tiga sifat dipertahankan untuk mencerminkan penekanan retoris teks Yunani. Koma akhir dipertahankan karena ayat ini merupakan bagian dari satu kalimat yang berlanjut.
