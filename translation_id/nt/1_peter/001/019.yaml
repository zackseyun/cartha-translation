id: 1PE.1.19
reference: 1 Peter 1:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ τιμίῳ αἵματι ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/019.yaml
  text: but with the precious blood of Messiah[a], like that of a lamb without blemish and without spot,
translation:
  language: id
  text: melainkan dengan darah Mesias[a] yang berharga, seperti darah anak domba yang tidak bercacat dan tidak bernoda,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kristus.” Kata Yunani Χριστός berarti “Mesias”; “Kristus” adalah bentuk yang lebih tradisional dalam bahasa Indonesia.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: melainkan
  rationale: Menandai pertentangan kuat dengan penyangkalan pada ayat sebelumnya (‘bukan dengan barang yang fana ... melainkan ...’) dan paling alami dalam konstruksi bahasa Indonesia tersebut.
- source_word: τιμίῳ
  choice: yang berharga
  rationale: Menyampaikan nilai tinggi sekaligus kehormatan tanpa mengubahnya menjadi istilah komersial.
- source_word: αἵματι
  choice: darah
  rationale: Mempertahankan nomina konkret; makna kematian sebagai kurban tersirat oleh konteks dan tidak menggantikan kata sumber.
- source_word: ὡς
  choice: seperti darah
  rationale: Mengungkapkan secara wajar bahwa perbandingan menyangkut darah, sehingga hubungan sintaksisnya jelas dalam bahasa Indonesia.
- source_word: ἀμνοῦ
  choice: anak domba
  rationale: Padanan langsung dan lazim yang mempertahankan gema persembahan kurban tanpa menjelaskannya di dalam teks.
- source_word: ἀμώμου
  choice: tidak bercacat
  rationale: Sesuai dengan kosakata tentang kelayakan hewan kurban serta mempertahankan citra konkret.
- source_word: καὶ
  choice: dan
  rationale: Mempertahankan koordinasi sederhana antara kedua sifat.
- source_word: ἀσπίλου
  choice: tidak bernoda
  rationale: Membedakannya dari ‘tidak bercacat’ sambil mempertahankan kesejajaran kedua ungkapan.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Di sini Χριστός berfungsi sebagai gelar; ‘Mesias’ menyatakan makna gelar itu secara transparan dalam bahasa Indonesia, sedangkan ‘Kristus’ dicatat sebagai padanan tradisional.
theological_decisions:
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Bentuk genitif ini menunjuk kepada pemilik darah dan tetap dapat dipahami sebagai gelar mesianik. ‘Mesias’ mempertahankan makna gelarnya; ‘Kristus’ merupakan padanan gerejawi tradisional yang sah dan dicantumkan dalam catatan kaki.
- issue: Hubungan perbandingan ὡς ἀμνοῦ dengan αἵματι
  choice: seperti darah anak domba
  alternative: seperti anak domba
  rationale: Pengulangan ‘darah’ memperjelas bahwa yang dibandingkan secara langsung ialah darah Mesias dengan darah anak domba, tanpa menyangkal bahwa gambaran anak domba juga menggambarkan Mesias.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk fragmen serta koma akhir dipertahankan karena ayat ini melanjutkan kalimat dari ayat sebelumnya dan bersambung ke ayat berikutnya.
