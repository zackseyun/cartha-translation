id: 1PE.1.1
reference: 1 Peter 1:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ ἐκλεκτοῖς παρεπιδήμοις διασπορᾶς Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/001.yaml
  text: Peter[a], an apostle of Jesus the Messiah, to the chosen sojourners of the dispersion in Pontus, Galatia, Cappadocia, Asia, and Bithynia[e][d][c][b],
translation:
  language: id
  text: 'Petrus, seorang rasul Yesus Sang Mesias[a], kepada orang-orang pilihan, para pendatang[b] yang terserak[c] di Pontus, Galatia, Kapadokia, Asia, dan Bitinia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yesus Kristus.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “orang-orang yang menetap sementara” atau “orang-orang asing yang bermukim.”
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “para pendatang dari penyebaran.” Ungkapan ini dapat mengingatkan pada Diaspora Yahudi sekaligus pada umat Allah yang hidup jauh dari tanah air sejati mereka.
    reason: cultural_note
lexical_decisions:
- source_word: Πέτρος
  choice: Petrus
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: ἀπόστολος
  choice: rasul
  rationale: Istilah baku bahasa Indonesia untuk utusan yang memegang peranan dan kewenangan khusus dalam kesaksian Perjanjian Baru.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός dipertahankan sebagai gelar mesianik, sedangkan “Sang” membuat konstruksi gelar itu alami dan bermartabat dalam bahasa Indonesia.
- source_word: ἐκλεκτοῖς
  choice: orang-orang pilihan
  rationale: Menyatakan bahwa para penerima telah dipilih tanpa memasukkan rumusan doktrinal yang lebih sempit.
- source_word: παρεπιδήμοις
  choice: para pendatang
  rationale: Menunjukkan orang yang menetap sementara di tempat yang bukan tanah asalnya; pilihan ini tetap terbuka terhadap makna sosial maupun kiasan teologis.
- source_word: διασπορᾶς
  choice: yang terserak
  rationale: Mengungkapkan gagasan diaspora dengan bahasa Indonesia yang wajar sambil mempertahankan gaung umat yang hidup tersebar jauh dari tanah asal.
- source_word: Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας
  choice: di Pontus, Galatia, Kapadokia, Asia, dan Bitinia
  rationale: Memakai bentuk nama geografis yang lazim dalam bahasa Indonesia dan menambahkan “di” untuk menyatakan hubungan lokatif yang tersirat.
theological_decisions:
- issue: Makna ἐκλεκτοῖς
  choice: orang-orang pilihan
  alternative: orang-orang terpilih
  rationale: Pilihan ini menegaskan tindakan memilih tanpa menjadikannya label teknis dari suatu sistem teologi tertentu.
- issue: Hubungan παρεπιδήμοις διασπορᾶς
  choice: para pendatang yang terserak
  alternative: para pendatang dari diaspora
  rationale: Rumusan ini membiarkan sebutan tersebut mengacu sekaligus pada keadaan sosial-geografis dan pada identitas umat Allah yang hidup jauh dari tanah air sejatinya, tanpa membatasi pembaca hanya pada salah satu makna.
- issue: Makna Χριστοῦ
  choice: Sang Mesias
  alternative: Kristus
  rationale: Gelar mesianik dinyatakan secara transparan, sementara bentuk tradisional “Kristus” dicatat sebagai padanan alternatif.
translation_notes:
  register: Bahasa Indonesia modern yang formal, alami, dan bermartabat. Tanda titik dua dipakai karena ayat ini merupakan pembukaan surat yang berlanjut ke ayat berikutnya. Aposisi “orang-orang pilihan, para pendatang” mempertahankan hubungan erat kedua sebutan dalam bahasa Yunani tanpa memaksakan apakah keadaan mereka terutama bersifat etnis, sosial, atau teologis.
