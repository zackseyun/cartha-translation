  text: ὃν οὐκ ⸀ἰδόντες ἀγαπᾶτε, εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ⸀ἀγαλλιᾶσθε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/008.yaml
  text: Though you have not seen him[a], you love him. Though you do not now see him, yet believing in him, you rejoice with inexpressible and glorious joy,
translation:
  language: id
  text: Sekalipun kalian belum pernah melihat Dia, kalian mengasihi-Nya. Sekalipun sekarang kalian tidak melihat Dia, kalian percaya kepada-Nya dan bersukacita dengan sukacita yang tak terkatakan dan mulia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sukacita yang telah dimuliakan” atau “sukacita yang penuh kemuliaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: Dia / -Nya
  rationale: Kata ganti relatif ini merujuk kepada Yesus Kristus dalam konteks sebelumnya. Bentuk pronominal Indonesia dipilih agar rujukannya jelas dan kalimatnya alami.
- source_word: οὐκ ἰδόντες
  choice: belum pernah melihat
  rationale: Partisip aoris menyatakan bahwa para pembaca tidak memiliki pengalaman melihat Kristus; 'belum pernah melihat' menyampaikan keadaan itu secara alami dengan relevansi pada masa kini.
- source_word: ἀγαπᾶτε
  choice: kalian mengasihi-Nya
  rationale: Bentuk kini menunjukkan tindakan atau keadaan yang berlangsung. 'Mengasihi' adalah padanan yang wajar dan bermartabat bagi ἀγαπάω.
- source_word: εἰς ὃν ... πιστεύοντες
  choice: kalian percaya kepada-Nya
  rationale: Dengan πιστεύω, εἰς menandai pribadi yang menjadi tujuan iman atau kepercayaan. 'Percaya kepada-Nya' alami dalam bahasa Indonesia dan mempertahankan unsur relasional.
- source_word: ἄρτι μὴ ὁρῶντες
  choice: sekarang kalian tidak melihat Dia
  rationale: ἄρτι menandai keadaan pada masa sekarang, sedangkan partisip kini menggambarkan ketiadaan penglihatan yang sedang berlangsung.
- source_word: δὲ
  choice: dan
  rationale: Partikel ini menghubungkan keadaan tidak melihat dengan tindakan percaya dan bersukacita. Dalam susunan konsesif yang sudah dibuka dengan 'sekalipun', 'dan' lebih alami daripada mengulang penanda pertentangan.
- source_word: ἀγαλλιᾶσθε
  choice: bersukacita
  rationale: Kata kerja ini menyatakan sukacita yang kuat. Intensitasnya juga diperjelas oleh frasa berikutnya, sehingga 'bersukacita' cukup alami tanpa parafrasa berlebih.
- source_word: χαρᾷ ἀνεκλαλήτῳ
  choice: dengan sukacita yang tak terkatakan
  rationale: Datif menyatakan cara atau keadaan bersukacita, sementara ἀνεκλάλητος berarti melampaui kemampuan untuk diungkapkan dengan kata-kata.
- source_word: δεδοξασμένῃ
  choice: mulia
  rationale: Partisip pasif perfektum ini secara harfiah berkaitan dengan keadaan telah dimuliakan atau dipenuhi kemuliaan. 'Mulia' menghasilkan bahasa Indonesia yang alami, sementara nuansa verbal dan alternatif yang lebih eksplisit dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna πιστεύοντες dengan εἰς ὃν
  choice: percaya kepada-Nya
  alternative: menaruh kepercayaan kepada-Nya
  rationale: Konstruksi ini menunjuk Kristus sebagai pribadi yang menjadi tujuan iman. Pilihan utama mempertahankan istilah 'percaya' tanpa membatasi maknanya hanya pada persetujuan intelektual.
- issue: Makna δεδοξασμένῃ yang menerangkan χαρᾷ
  choice: sukacita yang ... mulia
  alternative: sukacita yang telah dimuliakan / penuh kemuliaan
  rationale: Bentuk Yunani dapat dipahami secara verbal ('telah dimuliakan') atau secara resultatif sebagai sukacita yang bercirikan atau dipenuhi kemuliaan. Teks utama memakai ungkapan Indonesia yang alami, sedangkan catatan mempertahankan ketegangan bentuk dan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menyatakan bahwa kata ganti orang kedua Yunani berbentuk jamak. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia dan memperjelas rujukan kepada Kristus.
