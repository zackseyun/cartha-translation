  text: Sebaliknya, sama seperti Dia yang memanggil kamu itu kudus, hendaklah kamu sendiri juga menjadi kudus[a] dalam seluruh cara hidupmu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “hendaklah kamu kudus” atau “jadilah kudus.” Kata Yunani yang dipakai dapat menekankan memasuki atau menunjukkan keadaan tersebut.
