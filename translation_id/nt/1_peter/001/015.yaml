lexical_decisions:
- source_word: ἀλλὰ
  choice: Sebaliknya
  rationale: Menandai pertentangan dengan keinginan lama yang disebut pada ayat sebelumnya; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya adversatifnya.
- source_word: κατὰ
  choice: sama seperti
  rationale: 'Dalam konstruksi ini kata tersebut menyatakan kesesuaian atau kesepadanan: kekudusan umat harus sesuai dengan kekudusan Dia yang memanggil mereka.'
- source_word: τὸν καλέσαντα ὑμᾶς
  choice: Dia yang memanggil kamu
  rationale: Partisip berartikel berfungsi sebagai sebutan bagi pribadi yang memanggil. Klausa relatif ini alami dalam bahasa Indonesia tanpa menghilangkan rujukannya kepada Allah.
- source_word: ἅγιον
  choice: kudus
  rationale: Dipertahankan sebagai predikat bagi Dia yang memanggil, sehingga pengulangan dengan ἅγιοι dan hubungan teladan antara kekudusan Allah dan umat tetap jelas.
- source_word: καὶ αὐτοὶ
  choice: kamu sendiri juga
  rationale: ‘Sendiri’ mempertahankan penekanan αὐτοὶ, sedangkan ‘juga’ mencerminkan καί.
- source_word: ἅγιοι
  choice: kudus
  rationale: Mengulang padanan yang sama dengan ἅγιον agar kesejajaran yang disengaja antara kekudusan Allah dan panggilan bagi umat tetap terpelihara.
- source_word: ἐν πάσῃ ἀναστροφῇ
  choice: dalam seluruh cara hidupmu
  rationale: ἀναστροφή menunjuk pada perilaku atau keseluruhan pola hidup. ‘Cara hidup’ menyampaikan cakupan yang lebih luas daripada tindakan-tindakan terpisah, dan akhiran ‘-mu’ diperjelas dari konteks.
- source_word: γενήθητε
  choice: hendaklah ... menjadi
  rationale: Bentuk imperatif γίνομαι dapat menyoroti masuk ke dalam atau tampilnya suatu keadaan. ‘Hendaklah ... menjadi kudus’ merupakan nasihat yang wajar dan tetap membuka nuansa ‘jadilah/become’ tanpa menjabarkan suatu model teologis tertentu.
theological_decisions:
- issue: Hubungan antara kekudusan Allah dan panggilan umat
  choice: sama seperti Dia yang memanggil kamu itu kudus ... kamu sendiri juga menjadi kudus
  alternative: sesuai dengan Dia Yang Kudus yang memanggil kamu ... jadilah kudus
  rationale: Susunan terpilih membuat perbandingan lengkap dan jelas dalam bahasa Indonesia serta mempertahankan pengulangan ‘kudus’ bagi Allah dan umat, tanpa mengubahnya menjadi uraian sebab-akibat.
- issue: Daya imperatif γενήθητε
  choice: hendaklah ... menjadi kudus
  alternative: hendaklah ... kudus; jadilah kudus
  rationale: Terjemahan ini mempertahankan perintah dan kemungkinan nuansa memasuki atau menunjukkan keadaan tersebut, tetapi tidak memaksakan pandangan khusus tentang proses pengudusan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang khidmat tetapi mudah dipahami. ‘Dia’ dipakai sebagai rujukan personal kepada Allah tanpa menambahkan gelar yang tidak dinyatakan secara eksplisit, sedangkan ‘cara hidup’ mempertahankan keluasan makna ἀναστροφή.
