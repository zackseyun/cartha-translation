  text: Καὶ εἰ πατέρα ἐπικαλεῖσθε τὸν ἀπροσωπολήμπτως κρίνοντα κατὰ τὸ ἑκάστου ἔργον, ἐν φόβῳ τὸν τῆς παροικίας ὑμῶν χρόνον ἀναστράφητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/017.yaml
  text: And if you call as Father the one who judges impartially according to each person's work[c][b][a], conduct yourselves in fear during the time of your sojourn.
translation:
  language: id
  text: Dan jika kamu memanggil-Nya Bapa[a]—Dia yang menghakimi tanpa memihak menurut perbuatan setiap orang—hiduplah dengan takut[b] selama masa hidupmu sebagai pendatang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berseru kepada-Nya sebagai Bapa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dengan hormat” atau “dengan rasa gentar penuh hormat.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “selama masa kamu hidup sebagai orang asing.” Istilah Yunani dapat menunjuk pada kehidupan sebagai orang asing atau penduduk sementara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεῖσθε
  choice: memanggil
  rationale: Bentuk ini menyatakan tindakan menyapa atau berseru kepada Allah. “Memanggil Dia Bapa” alami dalam bahasa Indonesia dan tetap memungkinkan nuansa memohon kepada-Nya, yang dicatat dalam catatan kaki.
- source_word: πατέρα
  choice: Bapa
  rationale: 'Kata ini berfungsi sebagai sebutan predikatif bagi Allah: orang percaya memanggil Dia “Bapa”. Huruf kapital dipakai karena merupakan sebutan bagi Allah.'
- source_word: ἀπροσωπολήμπτως
  choice: tanpa memihak
  rationale: Ungkapan ini menyatakan bahwa penghakiman Allah tidak didasarkan pada kedudukan atau penampilan seseorang. “Tanpa memihak” jelas, ringkas, dan alami.
- source_word: κρίνοντα
  choice: yang menghakimi
  rationale: Partisipel kini menerangkan Allah sebagai Dia yang menghakimi; klausa relatif Indonesia mempertahankan fungsi tersebut secara alami.
- source_word: κατὰ τὸ ἑκάστου ἔργον
  choice: menurut perbuatan setiap orang
  rationale: κατά menyatakan tolok ukur penghakiman, sedangkan ἔργον berbentuk tunggal dan dapat merangkum tindakan atau sepak terjang seseorang. Terjemahan ini mempertahankan pertanggungjawaban tiap-tiap orang tanpa memasukkan sistem teologis tertentu.
- source_word: ἐν φόβῳ
  choice: dengan takut
  rationale: φόβος dapat berarti takut, hormat, atau rasa gentar. “Dengan takut” mempertahankan keluasan makna dan ketegangan antara Allah sebagai Bapa dan sebagai Hakim.
- source_word: παροικίας
  choice: tinggal sebagai pendatang
  rationale: Kata ini menunjuk pada keadaan menetap sementara sebagai orang asing atau pendatang. Ungkapan Indonesia ini mudah dipahami dan tidak mempersempitnya menjadi pembuangan politis.
- source_word: ἀναστράφητε
  choice: hiduplah
  rationale: Dalam konteks etis, verba ini berarti menjalani atau mengatur cara hidup. “Hiduplah” menyampaikan daya imperatif secara alami dalam bahasa Indonesia.
- source_word: τὸν τῆς παροικίας ὑμῶν χρόνον
  choice: selama masa kamu tinggal sebagai pendatang
  rationale: Akusatif χρόνον menyatakan rentang waktu. Susunan ini menerjemahkan baik unsur durasi maupun keadaan pembaca sebagai pendatang.
theological_decisions:
- issue: Makna φόβος dalam hubungan dengan Allah sebagai Bapa dan Hakim
  choice: Mempertahankan “takut” dalam teks utama
  alternative: “dengan hormat” atau “dengan rasa gentar penuh hormat”
  rationale: Ayat ini menghubungkan kebapaan Allah dengan penghakiman-Nya yang tidak memihak. “Takut” menjaga kesungguhan moral dan ketegangan teologis tersebut tanpa melunakkannya menjadi rasa hormat saja.
- issue: Penghakiman menurut perbuatan
  choice: Menerjemahkan langsung sebagai “menurut perbuatan setiap orang”
  alternative: Menafsirkannya secara khusus sebagai penghakiman akhir atas perbuatan orang percaya atau sebagai prinsip umum penilaian ilahi
  rationale: Teks Yunani menyatakan penghakiman yang tidak memihak menurut perbuatan masing-masing. Terjemahan tidak menetapkan teori denominasi tertentu tentang jasa, keselamatan, atau kepastian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Bentuk “kamu” dibiarkan tidak bertanda jumlah, sebagaimana lazim dalam bahasa Indonesia, meskipun bentuk Yunani menyapa para pembaca secara jamak. Tanda pisah mengapit keterangan tentang Bapa sebagai Hakim agar struktur kalimat panjang tetap jelas.
