  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα. τοῦτο δέ ἐστιν τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/025.yaml
  text: But the word of the Lord remains forever." And this is the word that was proclaimed as good news to you[a].
translation:
  language: id
  text: Tetapi firman Tuhan tetap untuk selama-lamanya.” Dan inilah firman yang telah diberitakan sebagai kabar baik kepada kalian[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “firman yang telah diberitakan kepada kalian sebagai Injil.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥῆμα
  choice: firman
  rationale: Dalam konteks kutipan Yesaya 40:8 dan penerapannya pada pemberitaan Injil, “firman” mempertahankan gema antarteks serta dapat menunjuk pada perkataan atau pesan yang berasal dari Tuhan.
- source_word: κυρίου
  choice: Tuhan
  rationale: Bentuk genitif κυρίου menyatakan “dari/milik Tuhan”; ungkapan baku “firman Tuhan” alami dalam bahasa Indonesia dan tidak memaksakan pembedaan tipografis yang tidak terdapat dalam teks Yunani.
- source_word: μένει
  choice: tetap
  rationale: “Tetap” menyampaikan keberlangsungan dan ketidakberubahan yang dinyatakan oleh μένω dengan bahasa Indonesia modern dan ringkas.
- source_word: εἰς τὸν αἰῶνα
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir; “untuk selama-lamanya” alami, jelas, dan sesuai dengan gaya kutipan yang khidmat.
- source_word: τοῦτο δέ ἐστιν
  choice: Dan inilah
  rationale: δέ menandai peralihan ringan, sedangkan “inilah” mempertahankan penekanan demonstratif τοῦτο dan menghubungkan kutipan dengan penerapannya.
- source_word: τὸ ῥῆμα τὸ εὐαγγελισθὲν
  choice: firman yang telah diberitakan sebagai kabar baik
  rationale: Pilihan ini mempertahankan ῥῆμα sebagai “firman” dan menyatakan daya verbal εὐαγγελίζω secara transparan, tanpa menggantinya semata-mata dengan istilah gerejawi “Injil”.
- source_word: εἰς ὑμᾶς
  choice: kepada kalian
  rationale: εἰς menunjukkan arah pemberitaan kepada para pendengar, dan “kalian” menyatakan bentuk jamak Yunani secara jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Hubungan “firman Tuhan” dalam kutipan Yesaya 40:8 dengan kabar baik yang diberitakan kepada para pembaca
  choice: Mempertahankan “firman Tuhan” dalam kutipan, lalu mengidentifikasinya sebagai firman yang diberitakan sebagai kabar baik kepada para pembaca.
  alternative: Menafsirkan keduanya secara seragam sebagai “pesan dari Tuhan”.
  rationale: Pilihan ini menjaga kesinambungan antara kutipan Kitab Suci dan penerapan Petrus pada pemberitaan kabar baik, tanpa melebur ketegangan antara bahasa kutipan dan penjelasannya.
- issue: Penerjemahan εὐαγγελισθέν
  choice: Menggunakan ungkapan verbal “telah diberitakan sebagai kabar baik”.
  alternative: “Telah diberitakan kepada kalian sebagai Injil.”
  rationale: Ungkapan “kabar baik” memperjelas makna dasar kata kerja εὐαγγελίζω bagi pembaca modern sekaligus tidak menambahkan isi teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kalian” dipakai untuk menandai bahwa ὑμᾶς berbentuk jamak. Tanda petik penutup dipertahankan karena kalimat pertama mengakhiri kutipan yang dimulai pada ayat sebelumnya.
