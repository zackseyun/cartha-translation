id: 1PE.1.12
reference: 1 Peter 1:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἷς ἀπεκαλύφθη ὅτι οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά, ἃ νῦν ἀνηγγέλη ὑμῖν διὰ τῶν εὐαγγελισαμένων ⸀ὑμᾶς πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ, εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/012.yaml
  text: To them it was revealed that they were serving not themselves but you in these things[c][b][a], which now have been announced to you through those who preached the good news to you by the Holy Spirit sent from heaven—things into which angels long to look.
translation:
  language: id
  text: Kepada mereka dinyatakan bahwa dalam hal-hal itu mereka melayani bukan diri mereka sendiri, melainkan kamu.[a] Hal-hal itu sekarang telah diberitakan kepada kamu melalui orang-orang yang memberitakan kabar baik[b] kepada kamu oleh Roh Kudus yang diutus dari surga—hal-hal yang sangat ingin dilihat lebih dekat oleh para malaikat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bukan bagi diri mereka sendiri, melainkan bagi kamu”; bentuk datif Yunani menunjukkan pihak yang memperoleh manfaat dari pelayanan para nabi.
    reason: lexical_alternative
  - marker: b
    text: Atau “memberitakan Injil”; bahasa Yunani memakai kata kerja yang berarti memberitakan kabar baik.
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “menunduk untuk melihat ke dalam.” Ungkapan ini menggambarkan pengamatan yang penuh minat dan saksama.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: Kepada mereka
  rationale: Kata ganti relatif datif ini menunjuk kembali kepada para nabi dalam ayat sebelumnya; bentuk ini mempertahankan fungsi penerima pewahyuan secara alami dalam bahasa Indonesia.
- source_word: ἀπεκαλύφθη
  choice: dinyatakan
  rationale: Bentuk pasif aoristus dipertahankan tanpa menyebut pelaku yang tidak dinyatakan secara eksplisit dalam klausa ini.
- source_word: οὐχ ἑαυτοῖς ὑμῖν δὲ
  choice: bukan diri mereka sendiri, melainkan kamu
  rationale: Kontras datif menyatakan pihak yang mendapat manfaat dari pelayanan para nabi. Catatan kaki mempertahankan alternatif eksplisit dengan 'bagi'.
- source_word: διηκόνουν
  choice: mereka melayani
  rationale: Imperfek menunjukkan pelayanan yang berlangsung pada masa lampau; 'melayani' jelas, wajar, dan tidak terlalu teknis.
- source_word: αὐτά
  choice: dalam hal-hal itu
  rationale: Kata ganti ini merujuk kepada pokok-pokok nubuat yang baru disebutkan; 'hal-hal itu' membuat rujukannya jelas.
- source_word: ἃ νῦν ἀνηγγέλη ὑμῖν
  choice: Hal-hal itu sekarang telah diberitakan kepada kamu
  rationale: Bentuk pasif dan νῦν dipertahankan, sementara 'telah diberitakan' menghubungkan pemberitaan yang sudah terjadi dengan keadaan para pembaca sekarang.
- source_word: διὰ τῶν εὐαγγελισαμένων ὑμᾶς
  choice: melalui orang-orang yang memberitakan kabar baik kepada kamu
  rationale: Menerjemahkan bentuk verbal εὐαγγελίζω secara transparan dan mempertahankan διά sebagai perantara manusia dalam pemberitaan.
- source_word: πνεύματι ἁγίῳ
  choice: oleh Roh Kudus
  rationale: Datif dipahami terutama sebagai sarana atau pelaku perantara ilahi dalam pemberitaan, tanpa menambahkan kata seperti 'kuasa' yang tidak terdapat dalam teks.
- source_word: ἀποσταλέντι ἀπ’ οὐρανοῦ
  choice: yang diutus dari surga
  rationale: Frasa partisipial pasif dipertahankan sebagai keterangan bagi Roh Kudus dan menjaga gambaran pengutusan dari surga.
- source_word: ἐπιθυμοῦσιν ἄγγελοι παρακύψαι
  choice: ingin sekali diselidiki oleh para malaikat
  rationale: Ungkapan ini menyampaikan hasrat yang terus berlangsung dan pengamatan yang sungguh-sungguh; catatan kaki memberi gambaran harfiah παρακύπτω.
theological_decisions:
- issue: Rujukan πνεύματι ἁγίῳ
  choice: Roh Kudus sebagai pelaku ilahi dalam pemberitaan kabar baik
  alternative: roh kudus sebagai daya atau sikap rohani umum
  rationale: Konteks sejarah keselamatan, pengutusan dari surga, dan pemakaian Petrus mendukung rujukan kepada Roh Kudus; huruf kapital menandai rujukan personal itu tanpa menambahkan isi pada teks.
- issue: Hubungan pelayanan para nabi dengan para pembaca
  choice: Para nabi melayani kepentingan para pembaca kemudian melalui hal-hal yang mereka nubuatkan
  alternative: Para nabi hanya melayani orang-orang sezaman mereka
  rationale: Kontras eksplisit 'bukan diri mereka sendiri, melainkan kamu' mengaitkan pelayanan kenabian dengan pemberitaan kabar baik yang kini diterima para pembaca.
- issue: Daya instrumental πνεύματι ἁγίῳ
  choice: oleh Roh Kudus
  alternative: dalam Roh Kudus
  rationale: Datif Yunani dapat bernuansa instrumental atau sferis. Konteks paling alami menonjolkan Roh sebagai sarana atau pelaku pemberitaan, tetapi terjemahan tidak menambahkan konsep 'kuasa'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. 'Kabar baik' dipilih untuk mempertahankan bentuk verbal Yunani, sedangkan 'Injil' dicatat sebagai alternatif lazim. Struktur kalimat dipecah menjadi dua kalimat agar jelas tanpa memutus hubungan antara nubuat dan pemberitaan sekarang.
