id: 1PE.1.2
reference: 1 Peter 1:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κατὰ πρόγνωσιν θεοῦ πατρός, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/002.yaml
  text: 'according to the foreknowledge of God the Father[a], in the sanctification of the Spirit[c][b], for obedience and sprinkling with the blood of Jesus the Messiah: Grace to you and peace be multiplied.'
translation:
  language: id
  text: sesuai dengan pengetahuan sebelumnya[a] dari Allah Bapa, dalam pengudusan oleh Roh,[b] untuk ketaatan dan pemercikan dengan darah[c] Yesus Sang Mesias. Kiranya anugerah dan damai sejahtera dilipatgandakan bagi kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pengetahuan sebelumnya” menerjemahkan πρόγνωσις. Para penafsir berbeda pendapat apakah istilah ini terutama menekankan pengetahuan Allah sebelumnya, pilihan-Nya sebelumnya, atau keduanya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dalam pengudusan Roh.” Dalam susunan ayat ini, “Roh” paling mungkin merujuk kepada Roh Kudus, dan bentuk Yunaninya dapat dipahami sebagai pengudusan yang dikerjakan oleh Roh.
    reason: grammatical_clarification
  - marker: c
    text: Ungkapan “pemercikan dengan darah” kemungkinan menggemakan gambaran perjanjian dan penyucian dalam Perjanjian Lama, khususnya Keluaran 24:8.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρόγνωσιν
  choice: sesuai dengan pengetahuan sebelumnya
  rationale: κατά dengan akusatif menyatakan kesesuaian atau norma. Ungkapan ini mempertahankan arti dasar πρόγνωσις tanpa menentukan apakah yang terutama dimaksud ialah pengetahuan terdahulu, pilihan terdahulu, atau keduanya.
- source_word: θεοῦ πατρός
  choice: dari Allah Bapa
  rationale: Bentuk genitif menunjukkan bahwa pengetahuan sebelumnya itu adalah milik Allah Bapa; susunan ini alami dalam bahasa Indonesia.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: dalam pengudusan oleh Roh
  rationale: ἁγιασμός diterjemahkan dengan istilah teologis yang tetap mudah dipahami, sedangkan genitif πνεύματος dipahami sebagai pelaku pengudusan dalam struktur trinitaris ayat ini.
- source_word: εἰς ὑπακοὴν
  choice: untuk ketaatan
  rationale: εἰς menyatakan tujuan atau hasil, dan 'untuk ketaatan' mempertahankan keluasan makna tersebut.
- source_word: καὶ ῥαντισμὸν αἵματος
  choice: dan pemercikan dengan darah
  rationale: Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan gambaran perjanjian serta penyucian yang terkandung dalam ῥαντισμός.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός dipertahankan sebagai gelar, bukan sekadar unsur nama; 'Sang Mesias' merupakan bentuk gelar yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη
  choice: Kiranya anugerah dan damai sejahtera dilipatgandakan bagimu
  rationale: Optatif πληθυνθείη dinyatakan sebagai doa atau berkat dengan 'kiranya'; bentuk pasif 'dilipatgandakan' mempertahankan citra leksikal kata Yunani.
theological_decisions:
- issue: Makna πρόγνωσις dalam kaitannya dengan pemilihan
  choice: pengetahuan sebelumnya
  alternative: penetapan sebelumnya; kasih yang memilih sebelumnya; prapengetahuan
  rationale: Pilihan ini menjaga ketegangan teologis dalam istilah Yunani dan tidak membatasinya pada sekadar ramalan maupun memperluasnya menjadi suatu sistem doktrinal tertentu.
- issue: Rujukan πνεύματος
  choice: Roh, yakni Roh Kudus
  alternative: roh manusia atau pengertian nonpersonal
  rationale: Rangkaian Allah Bapa—Roh—Yesus Sang Mesias mendukung rujukan kepada Roh Kudus; huruf kapital menyatakannya tanpa menambahkan kata ke teks utama.
- issue: Daya gelar Χριστοῦ
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam konteks ini Χριστός tetap membawa daya gelar bagi Yesus. Terjemahan 'Sang Mesias' membuat fungsi tersebut jelas dalam bahasa Indonesia.
- issue: Hubungan genitif dalam ἁγιασμῷ πνεύματος
  choice: Roh dipahami sebagai pelaku pengudusan
  alternative: kekudusan yang menjadi ciri roh atau pengudusan roh manusia
  rationale: Struktur trinitaris paling kuat mendukung genitif subjektif, tetapi terjemahan tetap ringkas dan tidak menguraikan mekanisme pengudusan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah 'pengudusan', 'ketaatan', 'anugerah', dan 'damai sejahtera' dipertahankan karena dikenal luas serta tepat secara teologis. Tanda baca memisahkan uraian tentang umat pilihan dari berkat penutup, sementara semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
