id: 1PE.3.16
reference: 1 Peter 3:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἀλλὰ μετὰ πραΰτητος καὶ φόβου, συνείδησιν ἔχοντες ἀγαθήν, ἵνα ἐν ᾧ ⸀καταλαλεῖσθε καταισχυνθῶσιν οἱ ἐπηρεάζοντες ὑμῶν τὴν ἀγαθὴν ἐν Χριστῷ ἀναστροφήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/016.yaml
  text: but with gentleness and fear[a], having a good conscience, so that in what you are slandered[c][b], those who revile your good conduct in Messiah may be put to shame.
translation:
  language: id
  text: tetapi lakukanlah dengan lemah lembut dan takut[a], sambil memiliki hati nurani yang baik, supaya dalam hal kamu difitnah[b], orang-orang yang mencela perilakumu yang baik di dalam Mesias[c] dipermalukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hormat” atau “rasa segan”.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam perkara yang mengenainya kamu dibicarakan dengan buruk”.
    reason: lexical_alternative
  - marker: c
    text: Secara tradisional, “di dalam Kristus”.
    reason: alternative_reading
lexical_decisions:
- source_word: πραΰτητος
  choice: lemah lembut
  rationale: Ungkapan ini menyatakan sikap rendah hati dan tidak kasar; “lemah lembut” alami dalam bahasa Indonesia dan tidak menyiratkan kelemahan.
- source_word: φόβου
  choice: takut
  rationale: Istilah Yunani ini dapat berarti takut, hormat, atau rasa segan. “Takut” mempertahankan keluasan makna dan tidak menentukan objeknya secara tersirat.
- source_word: συνείδησιν ἔχοντες ἀγαθήν
  choice: sambil memiliki hati nurani yang baik
  rationale: Bentuk partisipial menyatakan keadaan yang menyertai tindakan sebelumnya; “sambil memiliki” mempertahankan hubungan itu dengan wajar.
- source_word: ἐν ᾧ
  choice: dalam hal
  rationale: Frasa ini menunjuk secara terbuka pada perkara atau ranah tempat mereka difitnah tanpa menetapkan anteseden yang lebih khusus.
- source_word: καταλαλεῖσθε
  choice: kamu difitnah
  rationale: Kata ini menggambarkan tindakan berbicara melawan seseorang secara bermusuhan; “difitnah” menyampaikan daya tuduhan verbal tersebut.
- source_word: καταισχυνθῶσιν
  choice: dipermalukan
  rationale: Bentuk pasif subjungtif sesudah ἵνα dipertahankan dan menyampaikan hasil atau tujuan yang diharapkan.
- source_word: ἐπηρεάζοντες
  choice: orang-orang yang mencela
  rationale: Dalam konteks serangan terhadap perilaku, “mencela” secara alami menyampaikan tindakan menghina atau memperlakukan dengan permusuhan, terutama melalui perkataan.
- source_word: ἀναστροφήν
  choice: perilaku
  rationale: Kata ini menunjuk pada cara hidup atau tingkah laku; “perilaku” jelas dan mempertahankan tekanan etisnya.
- source_word: ἐν Χριστῷ
  choice: di dalam Mesias
  rationale: Χριστός berfungsi sebagai gelar di sini, sehingga diterjemahkan menurut maknanya sebagai “Mesias”; bentuk tradisional dicatat dalam catatan kaki.
- source_word: ἀγαθήν / ἀγαθὴν
  choice: baik
  rationale: “Baik” mempertahankan pengulangan leksikal yang menghubungkan hati nurani dan perilaku.
theological_decisions:
- issue: Makna φόβου dalam ungkapan μετὰ πραΰτητος καὶ φόβου
  choice: takut tanpa menyebutkan objeknya
  alternative: hormat; rasa segan; takut akan Allah
  rationale: Konteks langsung tidak menyebutkan objek rasa takut tersebut. Terjemahan utama mempertahankan ketegangan antara takut, hormat, dan sikap khidmat.
- issue: Penerjemahan Χριστῷ
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa ini gelar Χριστός tetap bermakna aktif; “Mesias” menerjemahkan gelar itu, sedangkan bentuk tradisional “Kristus” disediakan sebagai alternatif.
- issue: Daya pasif καταισχυνθῶσιν
  choice: dipermalukan
  alternative: menjadi malu
  rationale: “Dipermalukan” mempertahankan bentuk pasif Yunani, sedangkan “menjadi malu” lebih idiomatis tetapi mengurangi daya pasifnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. “Lemah lembut”, “hati nurani”, dan “di dalam Mesias” mempertahankan kosakata teologis yang mudah dipahami. Kata “lakukanlah” melengkapi hubungan ayat ini dengan perintah pada konteks sebelumnya tanpa mengubah isi utama klausa.
