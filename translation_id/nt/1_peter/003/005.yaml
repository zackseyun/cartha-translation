  text: οὕτως γάρ ποτε καὶ αἱ ἅγιαι γυναῖκες αἱ ἐλπίζουσαι ⸀εἰς θεὸν ἐκόσμουν ἑαυτάς, ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/005.yaml
  text: For in this way formerly also the holy women who hoped in God adorned themselves[a], submitting to their own husbands,
translation:
  language: id
  text: Sebab, demikianlah juga perempuan-perempuan kudus pada zaman dahulu yang berharap kepada Allah menghiasi diri mereka, dengan tunduk kepada suami mereka sendiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: demikianlah
  rationale: Menunjuk kembali kepada cara berhias yang baru saja dijelaskan dalam konteks sebelumnya, sekaligus mempertahankan daya tunjuk adverbia Yunani.
- source_word: γάρ
  choice: Sebab
  rationale: Menandai alasan atau penjelasan yang mendukung nasihat sebelumnya.
- source_word: ποτε
  choice: dahulu
  rationale: Mengacu kepada masa lampau dan teladan perempuan dari generasi terdahulu.
- source_word: καὶ
  choice: juga
  rationale: 'Mempertahankan unsur penambahan: perempuan-perempuan kudus pada masa dahulu pun berhias dengan cara tersebut.'
- source_word: αἱ ἅγιαι γυναῖκες
  choice: perempuan-perempuan kudus
  rationale: Mempertahankan makna baku ἅγιαι tanpa melemahkannya menjadi sekadar ‘saleh’.
- source_word: αἱ ἐλπίζουσαι εἰς θεὸν
  choice: yang berharap kepada Allah
  rationale: Partisipel kini berfungsi sebagai ciri perempuan-perempuan tersebut. ‘Berharap kepada Allah’ ringkas, alami, dan tetap menyatakan arah atau tumpuan harapan.
- source_word: ἐκόσμουν ἑαυτάς
  choice: menghiasi diri mereka
  rationale: Mempertahankan hubungan leksikal dengan pembahasan tentang perhiasan atau keindahan dalam konteks dekat.
- source_word: ὑποτασσόμεναι
  choice: dengan tunduk
  rationale: 'Mengungkapkan partisipel sebagai keterangan cara: ketundukan kepada suami merupakan cara mereka menghiasi diri.'
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: kepada suami masing-masing
  rationale: 'Dalam konteks rumah tangga, ἀνδράσιν berarti ‘suami’. ‘Masing-masing’ menyampaikan pembatasan ἰδίοις secara alami dalam bahasa Indonesia: yang dimaksud ialah suami mereka sendiri, bukan laki-laki pada umumnya.'
theological_decisions:
- issue: Cakupan ketundukan dalam hubungan pernikahan
  choice: dengan tunduk kepada suami masing-masing
  alternative: dengan menundukkan diri kepada suami mereka sendiri
  rationale: Terjemahan mempertahankan hubungan partisipial serta membatasi pernyataan pada relasi setiap istri dengan suaminya sendiri. Ayat ini tidak diperluas menjadi klaim mengenai semua perempuan terhadap semua laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan ‘demikian jugalah dahulu’ mempertahankan οὕτως, καὶ, dan ποτε tanpa terasa terlalu kaku. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
