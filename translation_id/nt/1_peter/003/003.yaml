  text: ὧν ἔστω οὐχ ὁ ἔξωθεν ἐμπλοκῆς τριχῶν καὶ περιθέσεως χρυσίων ἢ ἐνδύσεως ἱματίων κόσμος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/003.yaml
  text: Do not let your adornment be the outward one—braiding of hair[a], wearing of gold jewelry, or putting on of clothing—
translation:
  language: id
  text: Janganlah perhiasanmu hanya bersifat lahiriah—mengepang rambut[a], mengenakan perhiasan emas, atau memakai pakaian—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Janganlah perhiasanmu berupa perhiasan lahiriah: mengepang rambut, mengenakan perhiasan emas, atau memakai pakaian.” Kata “hanya” tidak dinyatakan secara eksplisit dalam bahasa Yunani, tetapi kontras dengan ayat 4 menunjukkan bahwa yang ditekankan ialah keutamaan karakter batiniah, bukan larangan menyeluruh terhadap berdandan atau berpakaian.'
    reason: Menjelaskan bentuk alternatif yang lebih dekat dengan susunan Yunani serta dasar kontekstual bagi “hanya”.
lexical_decisions:
- source_word: ὧν
  choice: perhiasanmu
  rationale: Pronomina relatif genitif jamak ini merujuk kepada para istri/perempuan pada ayat sebelumnya. Dalam bahasa Indonesia, hubungan posesifnya paling alami dinyatakan dengan enklitik -mu pada “perhiasanmu”.
- source_word: ἔστω οὐχ
  choice: Janganlah ... hanya
  rationale: Imperatif orang ketiga yang dinegasikan menyampaikan nasihat agar perhiasan mereka tidak berpusat pada hal lahiriah. Kata “hanya” membuat kontras dengan manusia batiniah pada ayat berikutnya jelas tanpa mengubah daftar ini menjadi larangan mutlak yang secara harfiah juga mencakup pemakaian pakaian.
- source_word: ὁ ἔξωθεν ... κόσμος
  choice: perhiasan ... yang lahiriah
  rationale: κόσμος di sini berarti hiasan atau perhiasan, bukan dunia; ἔξωθεν menandai sifat luarnya. Ungkapan ini alami dan mempertahankan kontras dengan manusia batiniah dalam ayat 4.
- source_word: ἐμπλοκῆς τριχῶν
  choice: mengepang rambut
  rationale: Mengungkapkan tindakan penataan rambut yang dimaksud oleh konstruksi genitif dengan bahasa Indonesia yang lugas dan modern.
- source_word: περιθέσεως χρυσίων
  choice: mengenakan perhiasan emas
  rationale: περίθεσις menunjuk pada tindakan memasang atau mengenakan, sedangkan χρυσίων menunjuk pada benda-benda emas, kemungkinan besar perhiasan.
- source_word: ἢ ἐνδύσεως ἱματίων
  choice: atau memakai pakaian
  rationale: Menerjemahkan paralel terakhir dalam daftar secara alami; “pakaian” mempertahankan cakupan umum ἱματίων.
theological_decisions:
- issue: Apakah Petrus melarang mutlak penataan rambut, perhiasan emas, dan pakaian, atau menempatkannya di bawah prioritas karakter batiniah
  choice: Menyatakan pengutamaan karakter batiniah dengan “janganlah ... hanya yang lahiriah”
  alternative: Larangan mutlak terhadap rambut yang dikepang, perhiasan emas, dan pemakaian pakaian
  rationale: Ayat 4 langsung mengontraskan perhiasan lahiriah dengan manusia batiniah. Karena daftar itu juga menyebut pemakaian pakaian, membacanya sebagai larangan mutlak akan menghasilkan arti yang tidak masuk akal. Namun, catatan kaki tetap menunjukkan bahwa kata “hanya” bersifat penjelas kontekstual, bukan unsur yang dinyatakan secara eksplisit dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Tanda pisah mempertahankan struktur kalimat yang berlanjut ke ayat 4. “Perhiasan” dipakai dalam arti luas, mencakup cara menghias atau memperindah diri, bukan hanya barang perhiasan.
