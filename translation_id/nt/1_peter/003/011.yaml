  text: ἐκκλινάτω ⸀δὲ ἀπὸ κακοῦ καὶ ποιησάτω ἀγαθόν, ζητησάτω εἰρήνην καὶ διωξάτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/011.yaml
  text: But let him turn away from evil and do good[a]; let him seek peace and pursue it.
translation:
  language: id
  text: Hendaklah ia berbalik dari yang jahat dan melakukan yang baik; hendaklah ia mencari damai dan mengejarnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bentuk tunggal dalam bahasa Yunani bersifat mewakili siapa saja: “Hendaklah orang berbalik dari yang jahat dan melakukan yang baik; hendaklah ia mencari damai dan mengejarnya.”'
    reason: Menjelaskan daya generik dari imperatif orang ketiga tunggal dalam kutipan.
lexical_decisions:
- source_word: ἐκκλινάτω
  choice: hendaklah ia berbalik
  rationale: Imperatif aoris aktif orang ketiga tunggal menyerukan tindakan tegas. “Berbalik” mempertahankan unsur arah dalam ἐκκλίνω, bukan sekadar menghindar.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ memberi kesinambungan dengan sedikit kontras dalam kutipan. Dalam bahasa Indonesia, hubungan itu sudah alami tanpa konjungsi pembuka; “tetapi” di sini akan terasa lebih tajam daripada bahasa Yunani.
- source_word: ἀπὸ κακοῦ
  choice: dari yang jahat
  rationale: κακόν dipahami secara moral dan berlawanan dengan ἀγαθόν. Bentuk “yang jahat” alami dalam bahasa Indonesia dan dapat mencakup kejahatan maupun hal yang jahat.
- source_word: ποιησάτω ἀγαθόν
  choice: melakukan yang baik
  rationale: Menyampaikan tindakan etis secara langsung serta mempertahankan kesejajaran dengan “yang jahat” pada klausa sebelumnya.
- source_word: ζητησάτω
  choice: hendaklah ia mencari
  rationale: “Mencari” mempertahankan arti dasar ζητέω dan membedakannya dari verba berikutnya, διώκω.
- source_word: εἰρήνην
  choice: damai
  rationale: “Damai” merupakan padanan alkitabiah yang ringkas dan cukup luas untuk mencakup keadaan damai dan hubungan yang rukun.
- source_word: διωξάτω αὐτήν
  choice: dan mengejarnya
  rationale: “Mengejar” mempertahankan daya kuat διώκω, sedangkan akhiran “-nya” dengan jelas merujuk kembali kepada damai.
- source_word: ἐκκλινάτω / ποιησάτω / ζητησάτω / διωξάτω
  choice: hendaklah ia ...
  rationale: Pola ini mempertahankan imperatif orang ketiga tunggal dalam bahasa Indonesia dengan nada yang wajar, bermartabat, dan bersifat nasihat kuat.
theological_decisions:
- issue: Daya representatif bentuk maskulin tunggal dalam rangkaian imperatif
  choice: Gunakan “ia” dalam teks utama
  alternative: Gunakan “orang itu” atau ubah menjadi bentuk jamak/generik tanpa pronomina
  rationale: Bahasa Yunani memakai bentuk orang ketiga tunggal yang bersifat representatif. “Ia” mempertahankan ketunggalan tanpa menambahkan jenis kelamin yang tidak perlu dalam bahasa Indonesia; catatan menjelaskan cakupan generiknya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang khidmat. Pengulangan “hendaklah ia” menjaga irama imperatif sumber, sementara pasangan “berbalik/melakukan” dan “mencari/mengejar” mempertahankan perkembangan retoris ayat.
