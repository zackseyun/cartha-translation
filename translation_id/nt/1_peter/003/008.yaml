lexical_decisions:
- source_word: Τὸ δὲ τέλος
  choice: Akhirnya
  rationale: Ungkapan ini berfungsi sebagai penanda wacana yang memperkenalkan rangkuman nasihat. “Akhirnya” alami dalam bahasa Indonesia dan tidak memaksakan arti harfiah “kesudahan”.
- source_word: πάντες
  choice: kamu semua
  rationale: Bentuk ini menyapa seluruh penerima surat secara langsung dan kolektif.
- source_word: ὁμόφρονες
  choice: sehati
  rationale: “Sehati” menyampaikan kesatuan sikap dan cara pandang, serta merupakan ungkapan Indonesia yang alami.
- source_word: συμπαθεῖς
  choice: turut merasakan apa yang dirasakan orang lain
  rationale: Frasa ini mempertahankan gagasan ikut merasakan perasaan atau pengalaman orang lain tanpa membatasinya hanya pada rasa kasihan.
- source_word: φιλάδελφοι
  choice: saling mengasihi sebagai saudara
  rationale: Pilihan ini mempertahankan gambaran kasih dalam keluarga saudara kandung sekaligus memperjelas sifat timbal baliknya dalam komunitas orang percaya.
- source_word: εὔσπλαγχνοι
  choice: berbelaskasihan
  rationale: Kata ini menyatakan belas kasih yang mendalam dan hangat; “berbelaskasihan” jelas dan bermartabat dalam bahasa Indonesia modern.
- source_word: ταπεινόφρονες
  choice: rendah hati
  rationale: Ungkapan ini menyampaikan kerendahan dalam sikap dan pikiran secara alami. Bentuk yang lebih harfiah, “berpikiran rendah hati,” terasa kaku dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa kekerabatan dalam φιλάδελφοι
  choice: saling mengasihi sebagai saudara
  alternative: saling mengasihi sebagai saudara dan saudari
  rationale: Teks utama mempertahankan metafora kekerabatan Yunani tanpa perluasan eksplisit. Catatan menjelaskan bahwa dalam konteks komunitas orang percaya, ungkapan ini mencakup laki-laki dan perempuan.
- issue: Bentuk tekstual kata sifat terakhir
  choice: ταπεινόφρονες = rendah hati
  alternative: φιλόφρονες = ramah atau berbudi baik
  rationale: Teks SBLGNT memakai ταπεινόφρονες. Varian φιλόφρονες cukup bermakna untuk dicatat, tetapi tidak menggantikan bacaan sumber dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang hangat dan bermartabat. Kata kerja “hendaklah” ditambahkan untuk membuat rangkaian kata sifat Yunani berfungsi alami sebagai seruan, tanpa mengubah daya nasihatnya.
