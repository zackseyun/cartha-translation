  to: Demikian juga, para istri, tunduklah kepada suami masing-masing, supaya, sekalipun ada suami yang tidak menaati firman[a], mereka dapat dimenangkan tanpa perkataan melalui perilaku istri mereka.
  rationale: Revisi memperjelas bahwa τινες merujuk kepada sebagian suami tanpa mengubah cakupan atau daya konsesif kalimat. Catatan kaki diselaraskan dengan alternatif leksikal audit bahasa Inggris dan tetap menjelaskan bahwa λόγος di sini merujuk pada berita Injil. Struktur tujuan, metafora "dimenangkan," dan kontras antara firman/berita dengan perkataan tetap dipertahankan.
