  - severity: low
    issue: Catatan kaki menerjemahkan alternatif terutama sebagai "tidak percaya," bukan alternatif leksikal langsung "tidak menaati berita itu."
    rationale: ἀπειθέω dapat mencakup penolakan atau ketidakpercayaan dalam konteks ini, tetapi alternatif audit bahasa Inggris secara khusus mempertahankan unsur "tidak menaati." Catatan kaki sebaiknya menjaga kemungkinan itu sebelum memberi penjelasan Injil.
  revised_text: Demikian juga, para istri, tunduklah kepada suami masing-masing, supaya, sekalipun ada suami yang tidak menaati firman[a], mereka dapat dimenangkan tanpa perkataan melalui perilaku istri mereka.
