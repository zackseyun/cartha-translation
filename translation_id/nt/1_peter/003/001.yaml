id: 1PE.3.1
reference: 1 Peter 3:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Ὁμοίως γυναῖκες ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν, ἵνα ⸀καὶ εἴ τινες ἀπειθοῦσιν τῷ λόγῳ διὰ τῆς τῶν γυναικῶν ἀναστροφῆς ἄνευ λόγου κερδηθήσονται
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/001.yaml
  text: Likewise[a], wives, being subject to your own husbands, so that even if some are disobeying the word, they may be won without a word through the conduct of their wives,
translation:
  language: id
  text: Demikian juga, para istri, tunduklah kepada suami masing-masing, supaya, sekalipun ada suami yang tidak menaati firman[a], mereka dapat dimenangkan tanpa perkataan melalui perilaku istri mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak menaati berita itu”; yaitu, mereka menolak berita Injil.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁμοίως
  choice: Demikian juga
  rationale: Penghubung ini mempertahankan kaitan dengan nasihat rumah tangga sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: γυναῖκες
  choice: hai para istri
  rationale: Keterangan tentang suami masing-masing menuntut makna relasional 'istri', bukan 'perempuan' secara umum; 'hai' menandai sapaan langsung secara wajar.
- source_word: ὑποτασσόμεναι
  choice: tunduklah kepada
  rationale: Bentuk perintah membuat fungsi partisip Yunani yang bersifat nasihat menjadi jelas dalam bahasa Indonesia. 'Tunduk' mempertahankan gagasan penataan relasi tanpa menambahkan makna ketaatan mutlak atau inferioritas.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: kepada suamimu masing-masing
  rationale: Dalam konteks rumah tangga, ἀνήρ berarti 'suami'. 'Masing-masing' menyampaikan penekanan ἰδίοις pada pasangan sendiri secara idiomatis.
- source_word: ἵνα καὶ εἴ τινες
  choice: supaya sekalipun ada di antara mereka yang
  rationale: '''Supaya'' mempertahankan daya tujuan/hasil dari ἵνα, sedangkan ''sekalipun'' menangkap nuansa konsesif καὶ εἴ.'
- source_word: ἀπειθοῦσιν τῷ λόγῳ
  choice: tidak menaati firman
  rationale: Pilihan ini mempertahankan nuansa ketidaktaatan sekaligus ungkapan Alkitabiah 'firman'. Kemungkinan makna ketidakpercayaan atau penolakan terhadap berita Injil dicatat dalam catatan kaki.
- source_word: διὰ τῆς τῶν γυναικῶν ἀναστροφῆς
  choice: melalui perilaku istri mereka
  rationale: ἀναστροφή menunjuk pada perilaku atau cara hidup. Relasi kepemilikan dibuat eksplisit secara alami sebagai 'istri mereka'.
- source_word: ἄνευ λόγου
  choice: tanpa perkataan
  rationale: Ungkapan ini mempertahankan permainan makna dengan λόγος sebelumnya, tetapi dalam konteks ini menunjuk pada perkataan atau bujukan lisan dari para istri.
- source_word: κερδηθήσονται
  choice: mereka dapat dimenangkan
  rationale: Bentuk pasif dan metafora 'memenangkan' dipertahankan; 'dapat' sesuai dengan konstruksi tujuan tanpa memastikan hasil bagi setiap orang.
theological_decisions:
- issue: Sifat ketundukan dalam ὑποτασσόμεναι
  choice: tunduklah kepada
  alternative: taatilah; tempatkanlah dirimu di bawah kuasa
  rationale: Ayat ini mengungkapkan ketundukan dalam relasi rumah tangga, tetapi tidak memakai kata kerja yang lebih langsung untuk 'menaati' dan tidak menyatakan inferioritas hakiki. Terjemahan tidak memperkuat atau melemahkan ketegangan teks.
- issue: Makna ἀπειθοῦσιν τῷ λόγῳ
  choice: tidak menaati firman
  alternative: tidak percaya kepada berita itu; menolak Injil
  rationale: Kata kerja Yunani dapat mencakup ketidaktaatan dan ketidakpercayaan. Teks utama mempertahankan unsur ketidaktaatan, sedangkan catatan kaki menjaga kemungkinan bahwa yang dimaksud ialah penolakan terhadap berita Injil.
- issue: Makna 'dimenangkan'
  choice: mempertahankan metafora tanpa menyebut secara eksplisit siapa yang memenangkan atau rincian hasilnya
  alternative: dibawa kepada iman; diselamatkan
  rationale: κερδαίνω memakai metafora memperoleh atau memenangkan seseorang. Memperluasnya menjadi 'diselamatkan' atau 'dibawa kepada iman' akan menafsirkan hasil itu lebih khusus daripada yang dinyatakan ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan langsung dipertahankan dengan 'hai', sementara susunan kalimat dibuat lancar bagi pembaca umum. Pengulangan antara 'firman' dan 'perkataan' mencerminkan dua pemakaian λόγος dalam bahasa Yunani tanpa menyamakan arti kontekstual keduanya.
