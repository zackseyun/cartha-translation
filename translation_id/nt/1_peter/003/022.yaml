base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/022.yaml
  text: who is at the right hand of God[a], having gone into heaven, with angels and authorities and powers subjected to him.
translation:
  language: id
  text: yang, setelah pergi ke surga[a], berada di sebelah kanan Allah, dan kepada-Nya para malaikat, para penguasa, dan kuasa-kuasa telah ditundukkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke dalam surga.” Bahasa Yunani secara lebih harfiah mengatakan “ke dalam surga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅς
  choice: yang
  rationale: Kata ganti relatif ini merujuk kembali kepada Yesus Kristus dalam ayat sebelumnya dan mempertahankan hubungan sintaksis dengan kalimat sebelumnya.
- source_word: ἐν δεξιᾷ θεοῦ
  choice: di sebelah kanan Allah
  rationale: Ungkapan Indonesia yang alami ini mempertahankan idiom alkitabiah tentang kedudukan dan kehormatan yang luhur tanpa menguraikannya menjadi tafsiran.
- source_word: πορευθεὶς εἰς οὐρανόν
  choice: setelah pergi ke dalam surga
  rationale: Kata 'setelah' menyampaikan tindakan partisip aoris yang mendahului keadaan pada verba utama, sedangkan 'ke dalam' mempertahankan arah gerak yang dinyatakan oleh εἰς.
- source_word: ὑποταγέντων αὐτῷ
  choice: telah ditundukkan kepada-Nya
  rationale: Bentuk pasif dan aspek tindakan yang telah terjadi dipertahankan; 'kepada-Nya' menyatakan pribadi yang kepadanya semua itu dibuat takluk.
- source_word: ἀγγέλων
  choice: para malaikat
  rationale: Dalam konteks kekuasaan kosmis, kata ini menunjuk kepada makhluk surgawi, bukan utusan manusia.
- source_word: ἐξουσιῶν
  choice: para penguasa
  rationale: Pilihan ini mempertahankan istilah bagi golongan otoritas kosmis dan membedakannya dari δυνάμεις.
- source_word: δυνάμεων
  choice: kuasa-kuasa
  rationale: Bentuk ini mempertahankan istilah tersendiri dalam rangkaian tiga golongan dan lazim dipahami sebagai kekuatan atau kuasa kosmis.
theological_decisions:
- issue: Sifat pemuliaan Kristus di sebelah kanan Allah
  choice: Mempertahankan ungkapan spasial-relasional 'di sebelah kanan Allah'.
  alternative: di tempat kehormatan tertinggi di sisi Allah
  rationale: Teks mempertahankan idiom alkitabiah yang sarat makna kristologis; parafrasa alternatif akan mempersempitnya menjadi penjelasan interpretatif.
- issue: Identitas para malaikat, penguasa, dan kuasa
  choice: Mempertahankan daftar luas tentang makhluk dan kuasa surgawi atau kosmis tanpa menentukan sifat moralnya.
  alternative: malaikat yang baik saja; kuasa rohani yang jahat saja
  rationale: Bahasa Yunani tidak secara eksplisit menyatakan apakah semua golongan ini baik, jahat, atau campuran, sehingga ambiguitas tersebut dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada luhur. 'Sementara' menghubungkan konstruksi partisipial terakhir secara alami tanpa mengubahnya menjadi hubungan sebab-akibat. Kapitalisasi '-Nya' mengikuti kebiasaan hormat dalam ragam keagamaan Indonesia.
