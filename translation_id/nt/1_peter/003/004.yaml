  text: ἀλλ’ ὁ κρυπτὸς τῆς καρδίας ἄνθρωπος ἐν τῷ ἀφθάρτῳ τοῦ ⸂πραέως καὶ ἡσυχίου⸃ πνεύματος, ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/004.yaml
  text: but the hidden person of the heart[a], in the imperishable beauty of a gentle and quiet spirit[c][b], which is very precious before God.
translation:
  language: id
  text: melainkan pribadi yang tersembunyi di dalam hati[a], dalam keindahan yang tidak dapat binasa[b] dari roh yang lemah lembut dan tenang[c]. Hal itu sangat berharga di hadapan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “manusia yang tersembunyi dalam hati.” Kata Yunani ἄνθρωπος dapat berarti “manusia” atau, secara lebih umum, “pribadi”; di sini kata itu menunjuk pada diri batin seseorang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dalam apa yang tidak dapat binasa dari roh yang lemah lembut dan tenang.” Kata “keindahan” dilengkapi berdasarkan kontras dengan perhiasan lahiriah dalam ayat sebelumnya.
    reason: lexical_alternative
  - marker: c
    text: “Tenang” menunjuk pada watak yang tenteram dan suka damai, bukan berarti harus selalu diam atau tidak berbicara.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸς τῆς καρδίας ἄνθρωπος
  choice: pribadi yang tersembunyi di dalam hati
  rationale: ἄνθρωπος di sini menunjuk pada diri seseorang, bukan secara khusus laki-laki. “Pribadi” mempertahankan acuan generiknya, sedangkan “tersembunyi di dalam hati” mengungkapkan diri batin yang tidak tampak tanpa mengganti κρυπτός dengan istilah yang terlalu interpretatif.
- source_word: ἐν τῷ ἀφθάρτῳ
  choice: dalam keindahan yang tidak dapat binasa
  rationale: Ungkapan Yunani ini eliptis dan secara harfiah tidak menyebut nomina setelah ἀφθάρτῳ. “Keindahan” dilengkapi berdasarkan pertentangan dengan perhiasan lahiriah dalam ayat sebelumnya; catatan kaki mempertahankan bentuk harfiahnya.
- source_word: πραέως
  choice: lemah lembut
  rationale: “Lemah lembut” merupakan padanan Indonesia yang lazim dan bermartabat untuk πραΰς, dengan makna kelembutan sikap, bukan kelemahan.
- source_word: ἡσυχίου
  choice: tenang
  rationale: “Tenang” menyatakan watak yang tenteram dan tidak suka mengacau; kata ini tidak dengan sendirinya menuntut seseorang untuk tidak berbicara.
- source_word: πνεύματος
  choice: roh
  rationale: “Roh” mempertahankan bahasa antropologis teks. Padanan seperti “watak” dapat menjelaskan maksudnya, tetapi lebih interpretatif.
- source_word: ὅ ἐστιν
  choice: yang ... berharga
  rationale: Klausa relatif dipertahankan dengan “yang”; sebagaimana dalam bahasa Yunani, acuannya dapat dipahami sebagai roh tersebut atau keseluruhan sifat batin yang baru disebutkan.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: Ungkapan ini secara langsung menyatakan penilaian Allah dan merupakan padanan Indonesia yang alami bagi ἐνώπιον τοῦ θεοῦ.
- source_word: πολυτελές
  choice: sangat berharga
  rationale: πολυτελές menyatakan nilai yang sangat tinggi atau mahal. “Sangat berharga” sesuai dengan konteks penilaian Allah dan pertentangan dengan perhiasan lahiriah.
theological_decisions:
- issue: Ungkapan antropologis dalam konteks yang membicarakan perempuan
  choice: Menerjemahkan ἄνθρωπος dengan “pribadi”, bukan “laki-laki” atau “manusia laki-laki”.
  alternative: manusia batiniah yang tersembunyi di dalam hati
  rationale: Dalam frasa ini ἄνθρωπος merujuk kepada diri batin seseorang, bukan jenis kelaminnya. “Pribadi” menghindari kesan keliru bahwa yang dimaksud adalah sosok laki-laki, sekaligus tetap mempertahankan bahasa tentang diri manusia.
- issue: Nomina tersirat sesudah ἀφθάρτῳ
  choice: 'Melengkapi dengan “keindahan”: “dalam keindahan yang tidak dapat binasa”.'
  alternative: dalam sifat yang tidak dapat binasa; dalam apa yang tidak dapat binasa
  rationale: Bahasa Yunani ringkas dan eliptis. Kontras dengan perhiasan lahiriah pada ayat 3 mendukung pelengkapan “keindahan”, tetapi bentuk harfiahnya dicatat agar pembaca mengetahui bahwa nomina itu tidak dinyatakan secara eksplisit.
- issue: Acuan kata ganti relatif ὅ
  choice: Mempertahankan klausa relatif “yang sangat berharga” tanpa mempersempit acuannya secara tegas.
  alternative: Itulah yang sangat berharga di hadapan Allah.
  rationale: Bentuk netral ὅ dapat merangkum sifat atau realitas yang baru disebutkan, bukan hanya satu nomina secara mekanis. Struktur relatif Indonesia menjaga hubungan tersebut dan tidak memaksakan penafsiran yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur kalimat sengaja tetap terhubung dengan ayat sebelumnya melalui “melainkan”. “Pribadi” dipilih agar mudah dipahami dan tidak menimbulkan kekhususan gender yang tidak terdapat dalam sumber.
