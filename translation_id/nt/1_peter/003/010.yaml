  text: ὁ γὰρ θέλων ζωὴν ἀγαπᾶν καὶ ἰδεῖν ἡμέρας ἀγαθὰς παυσάτω τὴν ⸀γλῶσσαν ἀπὸ κακοῦ καὶ ⸀χείλη τοῦ μὴ λαλῆσαι δόλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/010.yaml
  text: For the one who wants to love life and see good days must keep his tongue from evil and his lips from speaking deceit[a].
translation:
  language: id
  text: Sebab, “Siapa yang ingin mencintai hidup dan mengalami hari-hari yang baik, hendaklah ia menjaga lidahnya supaya tidak mengatakan yang jahat dan bibirnya supaya tidak mengucapkan tipu daya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelicikan” atau “muslihat.” Kata Yunani ini dapat berarti tipu daya, kelicikan, atau muslihat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... θέλων
  choice: orang yang ingin
  rationale: Artikel dengan partisipel kini berfungsi substantival dan merujuk secara umum kepada siapa pun; bentuk ini alami dalam bahasa Indonesia tanpa memberi batasan gender.
- source_word: γὰρ
  choice: Sebab
  rationale: Mengantar dasar Kitab Suci yang mendukung nasihat sebelumnya dan mempertahankan hubungan penjelasannya.
- source_word: ζωὴν ἀγαπᾶν
  choice: mencintai hidup
  rationale: Menerjemahkan ungkapan infinitif secara langsung tanpa menambahkan pronomina posesif yang tidak terdapat dalam teks Yunani.
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: mengalami hari-hari yang baik
  rationale: Secara harfiah berarti 'melihat hari-hari yang baik', tetapi dalam ungkapan ini 'mengalami' menyampaikan maksud idiomatis dengan jelas; 'baik' tidak mempersempit makna menjadi kemakmuran materi.
- source_word: παυσάτω τὴν γλῶσσαν ἀπὸ κακοῦ
  choice: harus menjaga lidahnya dari yang jahat
  rationale: Aoristus imperatif memberi tuntutan tegas untuk menghentikan atau menahan lidah; 'harus menjaga ... dari' menyampaikan daya imperatif secara alami. 'Yang jahat' mempertahankan keluasan κακόν.
- source_word: χείλη τοῦ μὴ λαλῆσαι δόλον
  choice: bibirnya agar tidak mengucapkan tipu daya
  rationale: Infinitif berartikel dengan μή menyatakan pencegahan atau tujuan. Bentuk konkret jamak 'bibir' dipertahankan, sedangkan 'tipu daya' merupakan padanan modern dan luas bagi δόλος.
theological_decisions:
- issue: Subjek tunggal generik dan representasi gender
  choice: Gunakan 'orang yang' dengan bentuk posesif '-nya'.
  alternative: Gunakan 'siapa yang' atau bentuk yang secara eksplisit maskulin.
  rationale: Bahasa Yunani memakai bentuk tunggal yang generik, bukan khusus laki-laki. Bahasa Indonesia dapat mempertahankan ketunggalan dan sifat generiknya secara alami melalui 'orang yang' dan '-nya'.
- issue: Makna hari-hari yang baik
  choice: Pertahankan ungkapan luas 'hari-hari yang baik'.
  alternative: Terjemahkan sebagai 'hari-hari makmur'.
  rationale: ἀγαθός lebih luas daripada kemakmuran material; terjemahan tidak boleh mempersempit janji atau pengalaman yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Diksi dibuat mudah dipahami pembaca umum sambil mempertahankan citra konkret 'lidah' dan 'bibir' serta bentuk kutipan yang mendasari nasihat.
