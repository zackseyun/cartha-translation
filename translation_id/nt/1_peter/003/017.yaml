  text: κρεῖττον γὰρ ἀγαθοποιοῦντας, εἰ θέλοι τὸ θέλημα τοῦ θεοῦ, πάσχειν ἢ κακοποιοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/017.yaml
  text: For it is better to suffer for doing good[a], if the will of God should so will it[b], than for doing evil.
translation:
  language: id
  text: Sebab lebih baik menderita ketika berbuat baik[a]—jika memang demikian dikehendaki Allah[b]—daripada ketika berbuat jahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena berbuat baik ... daripada karena berbuat jahat.” Kedua partisipel Yunani dapat dipahami secara kausal (“karena”) atau secara lebih umum sebagai keadaan yang menyertai (“ketika”).
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bahasa Yunani berbunyi, “jika kehendak Allah menghendakinya,” suatu ungkapan yang memberi penekanan. Di sini maknanya disampaikan tanpa mempertahankan pengulangan yang kaku.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον
  choice: lebih baik
  rationale: Adjektiva komparatif ini berfungsi secara impersonal; 'lebih baik' merupakan padanan Indonesia yang langsung dan alami.
- source_word: γὰρ
  choice: Sebab
  rationale: Konjungsi ini memberikan alasan atau penjelasan bagi nasihat sebelumnya dan mempertahankan hubungan logis antarayat.
- source_word: ἀγαθοποιοῦντας
  choice: ketika berbuat baik
  rationale: Partisipel kini aktif ini menggambarkan keadaan yang menyertai penderitaan tanpa menetapkan secara tegas bahwa perbuatan baik adalah penyebabnya.
- source_word: εἰ θέλοι
  choice: jika memang demikian dikehendaki
  rationale: Konstruksi εἰ dengan optatif menyatakan kondisi yang bersifat tentatif atau potensial; 'jika memang' mempertahankan nuansa itu secara wajar dalam bahasa Indonesia.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: dikehendaki Allah
  rationale: Ungkapan verbal Indonesia ini menyampaikan permainan akar antara θέλοι dan θέλημα tanpa menghasilkan pengulangan yang kaku, serta tetap merujuk kepada kehendak Allah.
- source_word: πάσχειν
  choice: menderita
  rationale: Infinitif pelengkap bagi κρεῖττον diterjemahkan langsung dan idiomatis.
- source_word: ἢ
  choice: daripada
  rationale: Konjungsi komparatif standar sesudah 'lebih baik'.
- source_word: κακοποιοῦντας
  choice: ketika berbuat jahat
  rationale: Terjemahan ini sejajar dengan ἀγαθοποιοῦντας dan mempertahankan sifat partisipialnya tanpa memaksakan hubungan sebab-akibat.
theological_decisions:
- issue: Hubungan penderitaan dengan kehendak Allah
  choice: Ayat ini menyatakan secara tentatif bahwa penderitaan ketika berbuat baik dapat terjadi sesuai dengan kehendak Allah, tanpa menjelaskan jenis kausalitasnya.
  alternative: Allah secara deterministis menetapkan setiap penderitaan; atau Allah hanya mengizinkannya tanpa keterlibatan lain.
  rationale: Frasa εἰ θέλοι τὸ θέλημα τοῦ θεοῦ menghubungkan kemungkinan penderitaan dengan kehendak Allah, tetapi tidak menyelesaikan perdebatan yang lebih luas mengenai penetapan dan izin ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah menandai sisipan bersyarat agar perbandingan antara menderita ketika berbuat baik dan ketika berbuat jahat tetap jelas.
