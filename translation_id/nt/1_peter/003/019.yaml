translation:
  language: id
  text: Dalam hal itu[a] ia juga pergi dan memaklumkan[b] kepada roh-roh yang dalam penjara[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di dalam Dia”; dapat juga dipahami, “melalui itu.” Hubungan frasa Yunani ini dengan klausa sebelumnya dapat dimengerti dengan lebih dari satu cara.
    reason: alternative_reading
  - marker: b
    text: Atau, “memberitakan.” Kata Yunaninya berarti menyampaikan suatu proklamasi, tetapi ayat ini tidak menyebutkan secara khusus isi proklamasi itu.
    reason: lexical_alternative
  - marker: c
    text: Identitas “roh-roh yang dalam penjara” diperdebatkan; kemungkinannya mencakup manusia yang telah meninggal atau makhluk-makhluk malaikat yang jatuh.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Dalam keadaan itulah
  rationale: Frasa ini mempertahankan hubungan dengan klausa sebelumnya tanpa menetapkan secara tegas apakah nuansanya lokatif, personal, atau instrumental. Dalam bahasa Indonesia, ungkapan ini lebih alami daripada terjemahan harfiah 'di dalam yang'.
- source_word: καὶ
  choice: juga
  rationale: Kata 'juga' menyampaikan fungsi aditif καί, yakni menambahkan tindakan ini pada pernyataan sebelumnya.
- source_word: τοῖς ... πνεύμασιν
  choice: kepada roh-roh
  rationale: Terjemahan langsung ini tidak mengganti πνεύμασιν dengan 'jiwa-jiwa' atau mempersempit identitas mereka menjadi jenis makhluk tertentu.
- source_word: ἐν φυλακῇ
  choice: yang berada dalam penjara
  rationale: Kata φυλακή menunjuk tempat penjagaan atau penahanan; 'dalam penjara' merupakan padanan Indonesia yang jelas dan alami.
- source_word: πορευθεὶς
  choice: ia ... pergi
  rationale: Partisip aoristus dialihkan menjadi verba finit agar alami dalam bahasa Indonesia sambil mempertahankan gagasan gerak yang terdapat dalam teks Yunani.
- source_word: ἐκήρυξεν
  choice: memberitakan
  rationale: Kata ini menyampaikan tindakan mengumumkan atau memaklumkan pesan tanpa menentukan bahwa isinya adalah Injil, penghakiman, atau kemenangan.
theological_decisions:
- issue: Acuan ἐν ᾧ
  choice: Diterjemahkan 'Dalam keadaan itulah' untuk menghubungkannya secara netral dengan klausa sebelumnya.
  alternative: '''di dalam Dia'' atau ''dengan perantaraan itu'''
  rationale: Susunan Yunani memungkinkan lebih dari satu pemahaman. Terjemahan utama tidak menetapkan secara pasti pribadi, sarana, atau ranah yang dimaksud.
- issue: Identitas 'roh-roh ... dalam penjara'
  choice: Dibiarkan sebagai 'roh-roh yang berada dalam penjara'.
  alternative: manusia yang telah meninggal, malaikat yang jatuh, atau kelompok roh terpenjara yang lebih luas
  rationale: Ayat ini sendiri tidak mengidentifikasi mereka secara lebih khusus, sehingga terjemahan tidak seharusnya memilih salah satu tafsiran.
- issue: Sifat pemberitaan dalam ἐκήρυξεν
  choice: Diterjemahkan 'memberitakan'.
  alternative: mengabarkan Injil, mengumumkan penghakiman, atau memaklumkan kemenangan
  rationale: Verba Yunani menyatakan tindakan memaklumkan, tetapi tidak menjelaskan isi pemberitaan tersebut di sini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan bermartabat. Bentuk 'ia' dipakai sesuai konteks penggalan ayat; ambiguitas sintaksis dan teologis dipertahankan dalam teks utama serta dijelaskan secara ringkas dalam catatan kaki.
