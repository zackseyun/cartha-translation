reference: 1 Peter 3:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς Σάρρα ⸀ὑπήκουσεν τῷ Ἀβραάμ, κύριον αὐτὸν καλοῦσα· ἧς ἐγενήθητε τέκνα ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι μηδεμίαν πτόησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/006.yaml
  text: just as Sarah obeyed Abraham[a], calling him lord. You have become her children if you do good and do not fear any intimidation.
translation:
  language: id
  text: seperti Sara menaati Abraham dengan menyebutnya “tuan”. Kalian telah menjadi anak-anaknya jika kalian berbuat baik dan tidak takut terhadap apa pun yang menakutkan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “teror apa pun” atau “intimidasi apa pun.”'
    reason: Alternatif leksikal bagi πτόησις, yang dapat berarti ketakutan atau teror, maupun sesuatu yang menimbulkan ketakutan.
lexical_decisions:
- source_word: ὡς
  choice: seperti
  rationale: Memperkenalkan Sara sebagai teladan yang selaras dengan nasihat sebelumnya; bentuk ini alami dalam bahasa Indonesia tanpa kehilangan daya perbandingannya.
- source_word: ὑπήκουσεν (ὑπακούω)
  choice: menaati
  rationale: Makna langsung verba ini ialah menaati atau mengindahkan. Pilihan ini mempertahankan kekuatan teks tanpa memperluasnya menjadi ajaran umum tentang pernikahan.
- source_word: κύριον
  choice: tuan
  rationale: Di sini kata tersebut merupakan sebutan hormat Sara bagi Abraham, bukan gelar ilahi. Huruf kecil mencegah kesan bahwa Abraham disebut Tuhan.
- source_word: καλοῦσα
  choice: menyebutnya
  rationale: Partisip ini menerangkan tindakan Sara ketika menyebut Abraham 'tuan'; susunan dengan 'dan' menghasilkan bahasa Indonesia yang lancar.
- source_word: ἧς ... τέκνα
  choice: anak-anaknya
  rationale: Pronomina relatif feminin merujuk kepada Sara, sedangkan τέκνα mempertahankan gambaran hubungan keluarga secara kiasan.
- source_word: ἐγενήθητε
  choice: telah menjadi
  rationale: Bentuk aoris γίνομαι menunjukkan masuknya para pembaca ke dalam suatu keadaan atau identitas dengan hasil yang tetap relevan.
- source_word: ἀγαθοποιοῦσαι
  choice: jika kalian berbuat baik
  rationale: Partisip ini, bersama partisip berikutnya, secara kontekstual memiliki nuansa bersyarat yang perlu dibuat eksplisit agar hubungan sintaksisnya jelas dalam bahasa Indonesia.
- source_word: μὴ φοβούμεναι
  choice: tidak takut
  rationale: Mengungkapkan sikap berkelanjutan yang dikehendaki, dengan bentuk verbal yang wajar dalam klausa bersyarat bahasa Indonesia.
- source_word: μηδεμίαν πτόησιν
  choice: apa pun yang menakutkan
  rationale: πτόησις dapat menunjuk pada ketakutan, teror, atau sesuatu yang menimbulkan ketakutan. Rumusan ini mempertahankan keluasan makna dan tidak membatasi ungkapan itu hanya pada intimidasi dari pihak tertentu.
theological_decisions:
- issue: Ketaatan Sara sebagai teladan bagi para istri Kristen
  choice: Mempertahankan verba langsung 'menaati' sebagai gambaran tindakan Sara dalam ayat ini.
  alternative: Melemahkannya menjadi 'tunduk kepada' atau 'mengindahkan'.
  rationale: ὑπήκουσεν secara wajar berarti 'menaati'. Terjemahan tidak boleh melunakkannya karena pertimbangan budaya, tetapi juga tidak boleh memperluas ayat ini menjadi doktrin pernikahan yang lebih menyeluruh daripada yang dinyatakan teks.
- issue: Hubungan partisip ἀγαθοποιοῦσαι dan μὴ φοβούμεναι dengan klausa utama
  choice: Menyatakannya secara bersyarat dengan 'jika kalian berbuat baik dan tidak takut'.
  alternative: 'Menyatakannya secara deskriptif: ''dengan berbuat baik dan tidak takut'' atau ''selama kalian berbuat baik''.'
  rationale: Partisip-partisip itu menjelaskan cara para pembaca memperlihatkan diri sebagai anak-anak Sara dan dalam konteks mengandung nuansa praktis bersyarat. Pilihan ini mempertahankan daya nasihat tanpa mengubahnya menjadi syarat keselamatan yang dirumuskan secara sistematis.
- issue: Arti πτόησις dan kemungkinan adanya ancaman dari luar
  choice: Menggunakan ungkapan luas 'apa pun yang menakutkan'.
  alternative: Menerjemahkannya secara khusus sebagai 'intimidasi apa pun' atau secara harfiah sebagai 'teror apa pun'.
  rationale: Konteks mungkin mencakup tekanan atau ancaman, tetapi nomina Yunani tidak mengharuskan pelaku intimidasi tertentu. Terjemahan utama mempertahankan ketidakpastian antara rasa takut dan hal yang menimbulkan rasa takut.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Kalian' dipakai untuk menandai bahwa sapaan Yunani berbentuk jamak dan ditujukan kepada para perempuan dalam konteks. 'Tuan' ditulis dengan huruf kecil karena bukan gelar ilahi. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang diterangkannya.
