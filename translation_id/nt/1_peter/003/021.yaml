id: 1PE.3.21
reference: 1 Peter 3:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃ ⸂καὶ ὑμᾶς ἀντίτυπον νῦν⸃ σῴζει βάπτισμα, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/021.yaml
  text: Corresponding to that[a], baptism now also saves you—not the removal of dirt from the flesh, but an appeal to God for a good conscience—through the resurrection of Jesus the Messiah,
translation:
  language: id
  text: Yang sepadan dengan itu, yaitu baptisan, sekarang juga menyelamatkan kalian—bukan dengan menyingkirkan kotoran dari tubuh, melainkan permohonan[a] kepada Allah untuk hati nurani yang baik—melalui kebangkitan Yesus sang Mesias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ikrar hati nurani yang baik kepada Allah.” Kata Yunani yang diterjemahkan “permohonan” (ἐπερώτημα) juga dapat dipahami sebagai “ikrar” atau “jawaban.” Susunan frasa ini juga dapat berarti “permohonan kepada Allah yang timbul dari hati nurani yang baik.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀντίτυπον
  choice: Yang sepadan dengan itu
  rationale: Merujuk kembali kepada air dalam peristiwa air bah pada ayat sebelumnya dan mempertahankan hubungan tipologis tanpa memakai istilah teknis yang kurang mudah dipahami.
- source_word: σῴζει
  choice: menyelamatkan
  rationale: Mempertahankan pernyataan langsung dalam bentuk kini dan tidak memperlemah kaitan baptisan dengan keselamatan.
- source_word: βάπτισμα
  choice: baptisan
  rationale: Istilah baku dalam bahasa Indonesia; konteks langsung membedakannya dari pembersihan jasmani semata.
- source_word: σαρκὸς
  choice: tubuh
  rationale: Dalam konteks kotoran dan pembersihan lahiriah, 'tubuh' menyampaikan rujukan fisik secara alami dalam bahasa Indonesia tanpa mengubah kontrasnya.
- source_word: ἀπόθεσις ῥύπου
  choice: menyingkirkan kotoran
  rationale: Ungkapan alami yang menyatakan pembersihan fisik dan mempertahankan penyangkalan bahwa baptisan hanyalah pembasuhan lahiriah.
- source_word: συνειδήσεως ἀγαθῆς
  choice: untuk hati nurani yang baik
  rationale: Genitif Yunani padat dan dapat dipahami dalam beberapa cara. Pilihan ini menghubungkannya dengan permohonan yang diarahkan kepada Allah, tanpa menutup alternatif bahwa permohonan itu berasal dari hati nurani yang baik.
- source_word: ἐπερώτημα
  choice: permohonan
  rationale: Cocok dengan arah εἰς θεόν dan tidak memasukkan teologi ikrar baptisan tertentu; arti alternatif 'ikrar' dicatat dalam catatan kaki.
- source_word: εἰς θεόν
  choice: kepada Allah
  rationale: Menyatakan arah permohonan secara jelas dan alami.
- source_word: δι’ ἀναστάσεως
  choice: melalui kebangkitan
  rationale: Mempertahankan makna sarana dari διά dengan genitif.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus sang Mesias
  rationale: Χριστός dipertahankan sebagai gelar mesianik, dan 'sang' membuat bentuk gelar itu wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan baptisan dengan keselamatan
  choice: Mempertahankan pernyataan langsung bahwa baptisan sekarang juga menyelamatkan kalian, lalu membiarkan pembatasan Petrus sendiri menjelaskan maksudnya.
  alternative: Mengubahnya menjadi 'baptisan melambangkan keselamatan' atau memperluasnya menurut teologi sakramental denominasi tertentu.
  rationale: Teks secara tegas menghubungkan baptisan dengan keselamatan, tetapi segera menegaskan bahwa yang dimaksud bukan pembersihan tubuh semata dan mengaitkannya dengan hati nurani di hadapan Allah serta kebangkitan Yesus.
- issue: Makna ἐπερώτημα dalam konteks baptisan
  choice: Menerjemahkannya sebagai 'permohonan' dalam teks utama.
  alternative: ikrar; jawaban
  rationale: '''Permohonan'' sesuai dengan εἰς θεόν, sedangkan kemungkinan arti ''ikrar'' tetap disajikan dalam catatan kaki agar ambiguitas asli tidak disembunyikan.'
- issue: Hubungan συνειδήσεως ἀγαθῆς dengan ἐπερώτημα
  choice: '''permohonan kepada Allah untuk hati nurani yang baik'''
  alternative: '''permohonan kepada Allah yang timbul dari hati nurani yang baik'' atau ''ikrar hati nurani yang baik kepada Allah'''
  rationale: Susunan genitif Yunani bersifat padat dan diperdebatkan. Teks utama memakai pembacaan tujuan yang alami, sementara catatan kaki mempertahankan pembacaan utama lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai bentuk jamak ὑμᾶς. Struktur kalimat mempertahankan penegasan teologis dan sisipan penjelas teks Yunani tanpa menambahkan tafsir denominasi.
