id: 1PE.3.12
reference: 1 Peter 3:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ὀφθαλμοὶ κυρίου ἐπὶ δικαίους καὶ ὦτα αὐτοῦ εἰς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/012.yaml
  text: For the eyes of the Lord are on the righteous[a], and his ears are open to their prayer[b], but the face of the Lord is against those who do evil.
translation:
  language: id
  text: Sebab mata Tuhan tertuju kepada orang-orang benar, dan telinga-Nya mendengarkan permohonan mereka,[a] tetapi wajah Tuhan menentang orang-orang yang berbuat jahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “telinga-Nya kepada permohonan mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Konjungsi ini memberikan dasar bagi nasihat atau kutipan sebelumnya; “Sebab” menyatakan hubungan kausal secara alami dalam bahasa Indonesia.
- source_word: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους
  choice: mata Tuhan tertuju kepada orang-orang benar
  rationale: Ungkapan ini mempertahankan citra antropomorfis “mata Tuhan”, sedangkan “tertuju kepada” menyampaikan arah perhatian yang dinyatakan oleh ἐπί dengan akusatif.
- source_word: ὦτα αὐτοῦ εἰς δέησιν αὐτῶν
  choice: telinga-Nya mendengarkan permohonan mereka
  rationale: Bahasa Yunani bersifat eliptis, secara harfiah “telinga-Nya kepada permohonan mereka”. “Mendengarkan” melengkapi makna perhatian secara wajar, dan “permohonan” mempertahankan nuansa δέησις sebagai doa atau permintaan yang sungguh-sungguh.
- source_word: πρόσωπον δὲ κυρίου
  choice: tetapi wajah Tuhan
  rationale: “Wajah” mempertahankan citra sumber Mazmur dan bahasa antropomorfis teks; δέ bersifat kontras sehingga diterjemahkan “tetapi”.
- source_word: ἐπὶ ποιοῦντας κακά
  choice: menentang orang-orang yang berbuat jahat
  rationale: Dalam klausa negatif ini, arah wajah Tuhan menyatakan perlawanan. Bentuk partisipial dipertahankan secara alami sebagai “orang-orang yang berbuat jahat”.
theological_decisions:
- issue: Bahasa antropomorfis tentang mata, telinga, dan wajah Tuhan
  choice: Mempertahankan ketiga gambaran tubuh secara langsung
  alternative: Menguraikannya sebagai “Tuhan menjaga, mendengarkan, dan melawan”
  rationale: Citra tersebut merupakan unsur sastra dan teologis yang disengaja dalam kutipan Mazmur. Terjemahan mempertahankan mata, telinga, dan wajah tanpa menegaskan bahwa Allah memiliki tubuh jasmani.
- issue: Makna respons Tuhan terhadap permohonan orang benar
  choice: “mendengarkan permohonan mereka”
  alternative: “terbuka terhadap doa mereka” atau secara harfiah “kepada permohonan mereka”
  rationale: Teks Yunani menyatakan perhatian Tuhan secara eliptis dan tidak secara eksplisit menjanjikan bahwa setiap permohonan akan dikabulkan. “Mendengarkan” menjaga pembedaan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel serta citra mata, telinga, dan wajah dipertahankan, sementara elipsis Yunani diperjelas secara minimal agar alami bagi pembaca umum.
