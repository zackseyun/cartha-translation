base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/009.yaml
  text: not repaying evil for evil or insult for insult[a], but on the contrary blessing, because you were called to this[c][b], so that you might inherit a blessing.
translation:
  language: id
  text: Jangan membalas kejahatan dengan kejahatan atau hinaan dengan hinaan[a]. Sebaliknya[b], berkatilah, sebab untuk itulah kamu dipanggil[c], supaya kamu mewarisi berkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “caci maki dengan caci maki.” Kata Yunani ini dapat menunjuk pada perkataan yang menghina atau mencaci.
    reason: lexical_alternative
  - marker: b
    text: Atau, “justru.” Ungkapan Yunani ini menandai pembalikan yang tegas.
    reason: lexical_alternative
  - marker: c
    text: Maksudnya, kamu dipanggil oleh Allah untuk menanggapi perlakuan buruk dengan berkat, bukan dengan pembalasan. Dalam konteks yang lebih luas, panggilan ini juga dapat mencakup kehidupan yang rela menderita tanpa membalas.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποδιδόντες
  choice: membalas
  rationale: Dalam konteks nasihat dengan μή, bentuk partisip ini menyatakan tindakan yang harus dihindari. “Membalas” mempertahankan gagasan memberi kembali sesuai perlakuan yang diterima dan terdengar alami dalam bahasa Indonesia.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: kejahatan dengan kejahatan
  rationale: “Kejahatan” mempertahankan bobot moral κακόν, sedangkan pola “dengan” secara alami menyatakan pembalasan setimpal dalam bahasa Indonesia.
- source_word: λοιδορίαν ἀντὶ λοιδορίας
  choice: hinaan dengan hinaan
  rationale: λοιδορία menunjuk pada tutur kata yang menghina atau mencaci. “Hinaan” jelas bagi pembaca modern dan mempertahankan kesejajaran dengan frasa sebelumnya.
- source_word: τοὐναντίον δὲ
  choice: Sebaliknya
  rationale: Ungkapan ini menandai pembalikan yang tegas dari pembalasan menuju pemberkatan. “Sebaliknya” ringkas, kuat, dan alami.
- source_word: εὐλογοῦντες
  choice: ucapkanlah berkat
  rationale: Pilihan ini mengungkapkan tindakan memberkati secara alami tanpa menambahkan objek yang tidak dinyatakan dalam bahasa Yunani, sekaligus mempertahankan nuansa perkataan baik dan permohonan akan perkenanan Allah.
- source_word: ὅτι
  choice: sebab
  rationale: Kata ini memperkenalkan dasar bagi nasihat sebelumnya. “Sebab” mempertahankan hubungan kausal dengan ragam bahasa yang wajar dan bermartabat.
- source_word: εἰς τοῦτο ἐκλήθητε
  choice: untuk itulah kamu dipanggil
  rationale: Bentuk pasif mempertahankan Allah sebagai pelaku yang tersirat, sedangkan “itulah” menunjuk kembali pada pola hidup yang baru disebutkan tanpa mempersempit acuannya secara berlebihan.
- source_word: ἵνα
  choice: supaya
  rationale: “Supaya” menyampaikan tujuan atau hasil yang dimaksud secara alami dalam bahasa Indonesia modern.
- source_word: εὐλογίαν
  choice: berkat
  rationale: Bahasa Indonesia tidak memerlukan kata sandang tak tentu. “Berkat” dapat menunjuk pada berkat yang diterima dari Allah tanpa penjelasan tambahan.
- source_word: κληρονομήσητε
  choice: kamu mewarisi
  rationale: “Mewarisi” mempertahankan nuansa menerima sebagai ahli waris, yang lebih kuat daripada sekadar “menerima.” Bentuk setelah “supaya” secara alami menyampaikan fungsi subjungtif Yunani.
theological_decisions:
- issue: Acuan frasa εἰς τοῦτο ἐκλήθητε
  choice: “Untuk itulah” terutama menunjuk pada panggilan untuk memberkati alih-alih membalas perlakuan buruk.
  alternative: Frasa ini dapat menunjuk secara lebih luas pada seluruh pola hidup Kristen yang mencakup penderitaan dan sikap tidak membalas.
  rationale: Konteks langsung mendukung hubungan dengan nasihat yang baru diberikan, terutama tindakan memberkati. Namun, kata “itulah” dibiarkan cukup luas agar terjemahan tidak menutup kemungkinan bahwa acuannya mencakup keseluruhan pola hidup dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang lugas dan bermartabat. Struktur paralel dipertahankan, sementara bentuk partisip Yunani dialihkan menjadi imperatif agar alami dalam konteks nasihat. Semua penanda catatan kaki muncul dalam teks utama.
