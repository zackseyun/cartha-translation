  text: And who will harm you if you become zealous for what is good?[a]
translation:
  language: id
  text: Dan siapakah yang akan mencelakai kalian jika kalian menjadi orang-orang yang giat melakukan apa yang baik?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bersemangat untuk apa yang baik.”
    reason: Alternatif ini mempertahankan secara lebih langsung kekuatan leksikal ζηλωταί dan hubungan genitif τοῦ ἀγαθοῦ.
lexical_decisions:
- source_word: Καὶ
  choice: Dan
  rationale: Kata penghubung netral ini mempertahankan kesinambungan dengan nasihat sebelumnya.
- source_word: τίς ὁ κακώσων ὑμᾶς
  choice: siapakah yang akan mencelakakan kalian
  rationale: Ungkapan dengan partisipel futur substantival diterjemahkan secara alami sebagai pertanyaan retoris dengan makna mendatangkan celaka atau kerugian. 'Kalian' memperjelas bahwa ὑμᾶς berbentuk jamak.
- source_word: ἐὰν
  choice: jika
  rationale: Menyampaikan syarat yang diperkenalkan oleh ἐὰν dengan bentuk subjungtif secara langsung dan wajar.
- source_word: τοῦ ἀγαθοῦ
  choice: apa yang baik
  rationale: Adjektiva netral substantival ini menunjuk kepada hal yang baik dan menjadi sasaran kegairahan para pembaca.
- source_word: ζηλωταὶ γένησθε
  choice: kalian menjadi orang-orang yang giat melakukan
  rationale: Bentuk nomina ζηλωταί dipertahankan sebagai sebutan bagi orang yang sungguh bersemangat, sedangkan γένησθε diterjemahkan 'menjadi'. Tambahan 'melakukan' membuat hubungan dengan 'apa yang baik' alami dalam bahasa Indonesia dan sesuai konteks perbuatan baik.
theological_decisions:
- issue: Daya pertanyaan retoris dalam kaitannya dengan penderitaan karena kebenaran
  choice: Pertanyaan dipertahankan sebagai jaminan retoris umum tanpa diubah menjadi janji mutlak bahwa orang percaya tidak akan mengalami celaka atau penderitaan.
  alternative: Menerjemahkannya sebagai pernyataan mutlak bahwa tidak seorang pun dapat sungguh-sungguh mencelakakan orang percaya.
  rationale: Ayat-ayat sesudahnya mengakui kemungkinan menderita karena berbuat baik. Bentuk pertanyaan asli mempertahankan ketegangan itu tanpa menyelesaikannya secara doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang wajar dan bermartabat. 'Kalian' dipakai untuk menandai sapaan jamak; 'giat melakukan apa yang baik' dipilih agar mudah dipahami, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
