id: 1PE.3.18
reference: 1 Peter 3:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/018.yaml
  text: For Messiah also suffered once for sins[a], the righteous for the unrighteous, so that he might bring you to God[b], having been put to death in the flesh but made alive in the spirit.
translation:
  language: id
  text: Sebab Mesias juga telah menderita satu kali untuk dosa-dosa[a], yang benar untuk orang-orang yang tidak benar, supaya ia membawa kamu kepada Allah[b]. Ia telah dibunuh dalam daging, tetapi dihidupkan dalam roh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “telah mati”, bukan “telah menderita”.
    reason: textual_variant
  - marker: b
    text: Atau “dihidupkan oleh Roh”. Bahasa Yunaninya dapat menunjuk pada lingkup atau aspek roh, ataupun pada Roh Kudus sebagai pelaku.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: Mesias
  rationale: Mempertahankan makna gelar Χριστός secara alami dan jelas, bukan memperlakukannya semata-mata sebagai nama diri.
- source_word: ἅπαξ
  choice: satu kali
  rationale: Menyatakan arti langsung adverbia tersebut tanpa menambahkan penegasan teologis 'sekali untuk selama-lamanya' yang tidak dinyatakan secara eksplisit.
- source_word: περὶ ἁμαρτιῶν
  choice: karena dosa-dosa
  rationale: Dalam konteks penderitaan penebusan, frasa ini menunjuk kepada dosa-dosa sebagai alasan atau perkara yang ditanggung; pilihan ini alami dalam bahasa Indonesia tanpa memperinci teori penebusan tertentu.
- source_word: ἔπαθεν
  choice: telah menderita
  rationale: Mengikuti bacaan SBLGNT ἔπαθεν, sementara varian 'telah mati' dicatat dalam catatan kaki.
- source_word: δίκαιος ὑπὲρ ἀδίκων
  choice: orang benar bagi orang-orang yang tidak benar
  rationale: Menjaga kontras substantival serta daya perwakilan/manfaat ὑπέρ tanpa mengembangkannya menjadi rumusan doktrinal yang lebih sempit.
- source_word: προσαγάγῃ
  choice: membawa kamu kepada Allah
  rationale: Mengungkapkan gagasan membawa seseorang ke hadirat Allah atau memberinya jalan masuk dengan bahasa Indonesia yang wajar.
- source_word: θανατωθεὶς
  choice: telah dibunuh
  rationale: Mempertahankan bentuk pasif dan makna dijadikan mati dalam ungkapan Indonesia yang ringkas dan alami.
- source_word: σαρκὶ
  choice: dalam daging
  rationale: Mempertahankan istilah 'daging' dan kesejajarannya dengan πνεύματι, tanpa menafsirkannya sebagai 'tabiat berdosa' atau sekadar menggantinya dengan 'tubuh'.
- source_word: ζῳοποιηθεὶς
  choice: dihidupkan
  rationale: Padanan pasif yang jelas dan alami untuk tindakan membuat hidup.
- source_word: πνεύματι
  choice: dalam roh
  rationale: Mempertahankan kemungkinan datif lingkup/aspek dalam teks utama; kemungkinan datif pelaku, yakni 'oleh Roh', dicatat sebagai alternatif.
theological_decisions:
- issue: Kontras daging dan roh pada klausa terakhir
  choice: dalam daging ... dalam roh
  alternative: dalam tubuh ... dalam roh; atau oleh Roh
  rationale: Dua bentuk datif Yunani sejajar dan padat. Terjemahan utama mempertahankan ketaksaan antara lingkup/aspek roh dan tindakan oleh Roh Kudus, alih-alih menyelesaikannya secara diam-diam.
- issue: Daya ὑπέρ dalam 'orang benar bagi orang-orang yang tidak benar'
  choice: bagi
  alternative: menggantikan; demi
  rationale: Kata 'bagi' mempertahankan gagasan tindakan untuk kepentingan atau atas nama pihak lain tanpa memasukkan uraian lengkap mengenai model penebusan tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan susunan yang tetap dekat dengan teks Yunani. Dua kalimat dipakai agar rangkaian partisipial terakhir tetap jelas bagi pembaca umum; huruf kecil pada 'roh' dalam teks utama sengaja mempertahankan ketaksaan sumber.
