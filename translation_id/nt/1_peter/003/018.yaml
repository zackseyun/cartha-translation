  to: Sebab Mesias juga telah menderita satu kali untuk dosa-dosa[a], yang benar untuk orang-orang yang tidak benar, supaya ia membawa kamu kepada Allah[b]. Ia telah dibunuh dalam daging, tetapi dihidupkan dalam roh.
