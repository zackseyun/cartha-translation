  naturalness: Susunan “orang benar bagi orang-orang yang tidak benar” kurang idiomatis dalam bahasa Indonesia modern. “Yang benar untuk orang-orang yang tidak benar” lebih lancar dan tetap mempertahankan kontras substantival serta daya ὑπέρ. Dua kalimat pada akhir ayat tetap jelas dan wajar.
  terminology: “Mesias” tepat untuk Χριστός sesuai kebijakan proyek. “Allah,” “daging,” dan “roh” konsisten dengan sumber dan register baku. Huruf kecil pada “roh” dalam teks utama dengan catatan alternatif “oleh Roh” tepat untuk menjaga ambiguitas πνεύματι.
