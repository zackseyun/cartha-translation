  text: when they observe your pure conduct in fear.
translation:
  language: id
  text: ketika mereka mengamati perilaku kalian yang murni, yang disertai rasa takut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Yunani yang diterjemahkan “yang disertai rasa takut” juga dapat dipahami sebagai “dengan penuh hormat”; objek rasa takut atau hormat itu tidak dinyatakan secara eksplisit.
    reason: Menjelaskan ambiguitas ἐν φόβῳ tanpa menyelesaikannya secara sepihak dalam teks utama.
lexical_decisions:
- source_word: ἐποπτεύσαντες
  choice: ketika mereka mengamati
  rationale: Partisip aoris ini menyatakan keadaan atau waktu yang terkait dengan konteks kalimat sebelumnya; “mengamati” mempertahankan nuansa melihat dengan saksama.
- source_word: ἁγνὴν ἀναστροφὴν
  choice: perilakumu yang murni
  rationale: ἀναστροφή menunjuk pada cara hidup atau perilaku, sedangkan ἁγνός berarti murni atau suci; susunan ini alami dalam bahasa Indonesia dan dekat dengan bentuk sumber.
- source_word: ἐν φόβῳ
  choice: dalam rasa takut
  rationale: Terjemahan ini mempertahankan bentuk dan ketaksaan frasa Yunani, tanpa menentukan secara eksplisit apakah rasa takut itu tertuju kepada Allah, suami, atau menyatakan sikap hormat.
theological_decisions:
- issue: Arah dan nuansa φόβος
  choice: dalam rasa takut
  alternative: dengan penuh hormat
  rationale: Teks Yunani hanya menyebut ἐν φόβῳ tanpa objek. Terjemahan utama tidak mengubahnya menjadi “hormat” atau menambahkan “kepada Allah,” sehingga ketegangan dan ketaksaan teologis tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pronomina “-mu” mengikuti bentuk orang kedua jamak dalam konteks, tetapi terbaca alami dalam kutipan ayat ini.
