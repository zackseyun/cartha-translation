source:
  edition: SBLGNT
  text: ἀλλ’ εἰ καὶ πάσχοιτε διὰ δικαιοσύνην, μακάριοι. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/014.yaml
  text: But even if you should suffer for righteousness, you are blessed. And do not fear their fear, nor be troubled,
translation:
  language: id
  text: Namun, sekalipun kalian menderita karena kebenaran, kalian berbahagia. Janganlah takut akan ketakutan mereka[a] dan janganlah gelisah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “takut kepada mereka” atau “apa yang mereka takuti.” Ungkapan Yunani harfiah “ketakutan mereka” menggemakan Yesaya 8:12 dan dapat dipahami dalam lebih dari satu cara.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’ εἰ καὶ πάσχοιτε
  choice: Namun, sekalipun kalian harus menderita
  rationale: Gabungan ἀλλ’ εἰ καὶ menyatakan kondisi konsesif, sedangkan optatif πάσχοιτε menunjukkan kemungkinan yang sungguh dapat terjadi. Ungkapan ini mempertahankan keduanya dalam bahasa Indonesia yang alami.
- source_word: διὰ δικαιοσύνην
  choice: karena kebenaran
  rationale: διά dengan akusatif menyatakan sebab. 'Kebenaran' mempertahankan cakupan moral-teologis δικαιοσύνη tanpa mempersempitnya menjadi keadilan sosial atau sekadar perbuatan benar.
- source_word: μακάριοι
  choice: kalian berbahagia
  rationale: Predikat ini menyatakan keadaan yang patut disebut berbahagia atau diberkati, bukan semata-mata perasaan senang. 'Berbahagia' alami dalam konteks ucapan bahagia dan tidak mengharuskan penambahan pelaku yang memberkati.
- source_word: τὸν ... φόβον αὐτῶν
  choice: ketakutan mereka
  rationale: 'Terjemahan dekat ini menjaga gema Yesaya 8:12 LXX dan ambiguitas frasa Yunani: ketakutan yang mereka timbulkan, ketakutan terhadap mereka, atau hal yang mereka sendiri takuti.'
- source_word: μὴ φοβηθῆτε
  choice: janganlah takut
  rationale: Larangan ini diterjemahkan secara langsung dan mempertahankan permainan akar kata φόβος/φοβέομαι melalui 'takut' dan 'ketakutan'.
- source_word: μηδὲ ταραχθῆτε
  choice: dan janganlah gelisah
  rationale: ταράσσω di sini menunjuk pada keguncangan atau keresahan batin. 'Gelisah' jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna δικαιοσύνη
  choice: kebenaran
  alternative: keadilan; melakukan yang benar
  rationale: Dalam konteks 1 Petrus, istilah ini menunjuk pada hidup benar di hadapan Allah yang dapat mendatangkan penderitaan. 'Kebenaran' mempertahankan istilah teologis dan keluasan makna sumber.
- issue: Ambiguitas τὸν φόβον αὐτῶν
  choice: ketakutan mereka
  alternative: takut kepada mereka; apa yang mereka takuti
  rationale: Bentuk posesif Yunani ambigu dan menggemakan Yesaya 8:12. Teks utama tidak boleh diam-diam menetapkan salah satu tafsiran; kemungkinan makna dijelaskan dalam catatan kaki.
- issue: Nuansa μακάριοι
  choice: kalian berbahagia
  alternative: kalian diberkati
  rationale: Bentuk Yunani menyatakan status orang yang patut disebut berbahagia dalam pandangan Allah. 'Berbahagia' menjaga bentuk ucapan bahagia tanpa menyiratkan bahwa penderitaan itu sendiri terasa menyenangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak 'kalian' dipakai agar sapaan orang kedua jamak terlihat jelas. Struktur dibuat alami sambil mempertahankan ambiguitas utama dan gema Kitab Suci.
