id: 1PE.3.7
reference: 1 Peter 3:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν, ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ ἀπονέμοντες τιμήν, ὡς καὶ ⸀συγκληρονόμοις χάριτος ζωῆς, εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/007.yaml
  text: Likewise[a], husbands, living together with your wives according to knowledge, assigning honor to the woman as to a weaker vessel, as also fellow heirs of the grace of life[c][b], so that your prayers may not be hindered.
translation:
  language: id
  text: Demikian juga, para suami, hiduplah bersama istri kalian dengan penuh pengertian, dan berilah hormat kepada mereka sebagai bejana perempuan yang lebih lemah dan sebagai sesama ahli waris anugerah kehidupan, supaya doa-doa kalian tidak terhalang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, "sebagai bejana perempuan yang lebih lemah." Ungkapan ini mungkin menunjuk pada kelemahan fisik atau kerentanan sosial yang relatif, bukan pada martabat yang lebih rendah; kalimat ini juga menyebut para istri sebagai sesama ahli waris anugerah kehidupan.
    reason: Metafora dan latar budaya perlu dijelaskan tanpa menentukan satu tafsiran di dalam teks utama.
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: para suami
  rationale: Dalam konteks aturan rumah tangga sesudah nasihat kepada para istri (3:1), kata ini menunjuk kepada para suami.
- source_word: ὁμοίως
  choice: Demikian juga
  rationale: Mempertahankan hubungan wacana dan daya banding dengan nasihat sebelumnya.
- source_word: συνοικοῦντες κατὰ γνῶσιν
  choice: hiduplah bersama istrimu dengan penuh pengertian
  rationale: Mengungkapkan kehidupan bersama dalam perkawinan yang dibentuk oleh pengetahuan dan pemahaman; bentuk ini alami dalam bahasa Indonesia tanpa mempersempitnya menjadi perasaan semata.
- source_word: ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ
  choice: sebagai pihak yang lebih lemah, yaitu perempuan
  rationale: Mempertahankan perbandingan 'lebih lemah' dan rujukan kepada perempuan, tetapi menerjemahkan metafora σκεῦος secara idiomatis sebagai 'pihak'; catatan kaki mempertahankan bentuk harfiahnya.
- source_word: ἀπονέμοντες τιμήν
  choice: berilah hormat kepadanya
  rationale: Secara alami menyatakan tindakan memberikan penghormatan yang patut.
- source_word: συγκληρονόμοις
  choice: sesama ahli waris
  rationale: Menegaskan bahwa para istri turut berbagi warisan yang sama.
- source_word: χάριτος ζωῆς
  choice: anugerah kehidupan
  rationale: Mempertahankan konstruksi genitif dan keluasan maknanya, baik anugerah yang berupa kehidupan maupun anugerah yang menghasilkan kehidupan.
- source_word: εἰς τὸ μὴ ἐγκόπτεσθαι
  choice: supaya ... tidak terhalang
  rationale: Menyampaikan tujuan atau hasil dengan alami sekaligus mempertahankan makna pasif.
- source_word: τὰς προσευχὰς ὑμῶν
  choice: doa-doamu
  rationale: Menerjemahkan bentuk jamak dan sapaan orang kedua jamak kepada para suami sebagai kelompok.
theological_decisions:
- issue: Makna 'bejana yang lebih lemah'
  choice: Dipertahankan sebagai gambaran kelemahan relatif tanpa menyatakan rendahnya martabat atau kedudukan rohani.
  alternative: Lebih lemah secara fisik; lebih rentan secara sosial; lebih lemah secara emosional.
  rationale: Teks tidak menentukan jenis kelemahannya. Perintah untuk menghormati dan penegasan bahwa istri adalah sesama ahli waris mencegah penafsiran sebagai nilai atau martabat yang lebih rendah.
- issue: Hubungan ὡς καὶ dengan pemberian hormat
  choice: Diterjemahkan 'sebab mereka juga adalah sesama ahli waris' sebagai dasar konseptual bagi penghormatan.
  alternative: '''sebagai sesama ahli waris juga'' atau ''karena mereka juga sesama ahli waris''.'
  rationale: Bahasa Indonesia memerlukan hubungan yang jelas dan alami. 'Sebab' menyatakan alasan yang tersirat dalam konteks, meskipun ὡς καὶ secara formal dapat dipertahankan dengan 'sebagai ... juga'.
- issue: Rujukan warisan bersama
  choice: Para istri adalah sesama ahli waris anugerah kehidupan bersama para suami.
  alternative: Warisan khusus berupa kehidupan kekal; pemberian kehidupan secara lebih luas.
  rationale: Terjemahan tidak mempersempit 'anugerah kehidupan' melampaui ungkapan Yunani dan tetap menegaskan kebersamaan dalam warisan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan 'hai para suami' menandai alamat langsung; bentuk tunggal distributif 'istrimu' dan 'kepadanya' berlaku kepada setiap suami, sedangkan 'doa-doamu' mempertahankan sapaan jamak. Metafora 'bejana' dialihkan menjadi 'pihak' dalam teks utama agar dapat dipahami pembaca umum, sementara bentuk sumber dijaga dalam catatan kaki.
