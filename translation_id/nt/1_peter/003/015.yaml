  text: κύριον δὲ τὸν ⸀Χριστὸν ἁγιάσατε ἐν ταῖς καρδίαις ὑμῶν, ⸀ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον περὶ τῆς ἐν ὑμῖν ἐλπίδος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/015.yaml
  text: But regard Messiah the Lord as holy in your hearts[a], always ready for a defense to everyone who asks you for a reason concerning the hope that is in you[b],
translation:
  language: id
  text: Namun, kuduskanlah Mesias sebagai Tuhan di dalam hati kalian[a], dan hendaklah kalian selalu siap memberikan pembelaan kepada setiap orang yang meminta alasan dari kalian mengenai pengharapan yang ada pada kalian,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pandanglah Mesias, Sang Tuhan, sebagai kudus di dalam hati kalian.” Ungkapan ini berarti mengakui dan menghormati dia sebagai Tuhan yang kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριον ... τὸν Χριστὸν
  choice: Mesias sebagai Tuhan
  rationale: Menerjemahkan Χριστός sebagai gelar “Mesias” dan κύριος sebagai “Tuhan”; susunan ini menyatakan kedudukan Mesias sebagai Tuhan tanpa mengaburkan gema Yesaya 8:13.
- source_word: ἁγιάσατε
  choice: kuduskanlah
  rationale: Mempertahankan daya imperatif dan makna harfiah “perlakukan/akuilah sebagai kudus”; catatan kaki menjelaskan maksudnya agar tidak dipahami bahwa manusia membuat Mesias menjadi kudus.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: di dalam hatimu
  rationale: Ungkapan alami dalam bahasa Indonesia untuk ranah batin; bentuk tunggal kolektif “-mu” sesuai sapaan kepada komunitas.
- source_word: ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν
  choice: selalu siap memberikan pembelaan
  rationale: Mengungkapkan konstruksi predikatif secara wajar; “pembelaan” mempertahankan nuansa jawaban atau penjelasan yang dipertanggungjawabkan.
- source_word: παντὶ τῷ αἰτοῦντι ὑμᾶς
  choice: kepada setiap orang yang meminta ... darimu
  rationale: Mempertahankan cakupan distributif παντί dan tindakan meminta yang dinyatakan partisipel kini.
- source_word: λόγον
  choice: pertanggungjawaban
  rationale: Dalam konteks ini λόγος berarti alasan, keterangan, atau pertanggungjawaban yang diminta; pilihan ini berpasangan secara alami dengan “meminta” dan ἀπολογία.
- source_word: περὶ τῆς ἐν ὑμῖν ἐλπίδος
  choice: tentang pengharapan yang ada padamu
  rationale: Dekat dengan struktur Yunani dan tetap alami, sambil mempertahankan kemungkinan bahwa pengharapan itu berada di dalam atau dimiliki komunitas pembaca.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Di sini Χριστός berfungsi sebagai gelar dan berkaitan dengan κύριος, sehingga “Mesias” menyampaikan arti gelarnya, bukan sekadar mentransliterasikannya.
- issue: Makna ἁγιάσατε ketika Mesias menjadi objek
  choice: kuduskanlah Mesias sebagai Tuhan
  alternative: pandanglah Mesias, Sang Tuhan, sebagai kudus
  rationale: Teks Yunani mempertahankan bahasa pengudusan dan gema Yesaya 8:13. Terjemahan utama menjaganya, sedangkan catatan kaki menerangkan bahwa perintah itu menyangkut pengakuan dan penghormatan batin, bukan membuat Mesias menjadi kudus.
- issue: Hubungan sintaksis κύριον dengan Χριστόν
  choice: Mesias sebagai Tuhan
  alternative: Mesias, Sang Tuhan
  rationale: “Sebagai Tuhan” secara alami menyampaikan κύριον sebagai pelengkap yang terkait dengan tindakan ἁγιάσατε, sementara alternatif aposisional tetap mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Namun” meneruskan pertentangan dari konteks sebelumnya. Tanda koma akhir dipertahankan karena kutipan sumber merupakan bagian awal dari kalimat yang berlanjut ke ayat berikutnya.
