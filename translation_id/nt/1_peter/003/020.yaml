  text: ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ εἰς ἣν ⸀ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν δι’ ὕδατος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/020.yaml
  text: who formerly were disobedient[a], when the patience of God was waiting in the days of Noah while the ark was being prepared, into which a few—that is[b], eight persons—were brought safely through water.
translation:
  language: id
  text: yang dahulu tidak taat, ketika kesabaran Allah terus menanti pada zaman Nuh, sementara bahtera sedang dipersiapkan, ke dalam bahtera itu hanya sedikit orang, yakni delapan orang[a], dibawa dengan selamat melalui air.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “delapan jiwa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “diselamatkan melalui air.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπειθήσασίν
  choice: yang dahulu tidak taat
  rationale: Bentuk partisip aoris ini menyatakan ketidaktaatan atau penolakan untuk taat; pilihan ini tidak mempersempit maknanya menjadi ketidakpercayaan secara intelektual saja.
- source_word: ποτε
  choice: dahulu
  rationale: Menandai suatu waktu pada masa lampau dan menyatu secara alami dengan ungkapan partisipial dalam bahasa Indonesia.
- source_word: ἀπεξεδέχετο
  choice: terus menanti
  rationale: Bentuk imperfek menggambarkan tindakan menanti yang sedang berlangsung; kata 'terus' menyampaikan aspek tersebut tanpa mengulang gagasan kesabaran.
- source_word: μακροθυμία
  choice: kesabaran
  rationale: Padanan modern yang jelas untuk penahanan diri Allah dalam menangguhkan penghukuman.
- source_word: κατασκευαζομένης
  choice: sedang dipersiapkan
  rationale: Mempertahankan cakupan makna 'dipersiapkan/dibuat siap' dan aspek tindakan yang sedang berlangsung tanpa membatasi maknanya hanya pada pembangunan fisik.
- source_word: κιβωτοῦ
  choice: bahtera
  rationale: Istilah baku dan mudah dikenali dalam konteks kisah Nuh.
- source_word: εἰς ἣν
  choice: ke dalam bahtera itu
  rationale: Mempertahankan arah gerak yang dinyatakan oleh εἰς, bukan sekadar lokasi di dalam bahtera.
- source_word: ὀλίγοι
  choice: hanya sedikit orang
  rationale: Ungkapan alami dalam bahasa Indonesia yang menonjolkan kecilnya jumlah mereka.
- source_word: τοῦτ’ ἔστιν
  choice: yakni
  rationale: Mengantar penjelasan tepat mengenai jumlah orang yang dimaksud.
- source_word: ψυχαί
  choice: orang
  rationale: Dalam konteks penghitungan manusia di dalam bahtera, ψυχή menunjuk kepada pribadi atau orang, bukan mengajarkan pembedaan antropologis teknis.
- source_word: διεσώθησαν
  choice: dibawa dengan selamat
  rationale: Menangkap nuansa διασῴζω sebagai pemeliharaan dan pembawaan dengan selamat melewati bahaya, tanpa menghilangkan kemungkinan terjemahan 'diselamatkan'.
- source_word: δι’ ὕδατος
  choice: melalui air
  rationale: Mempertahankan gambaran perjalanan melewati air bah sekaligus membiarkan hubungan tipologis dengan baptisan dalam ayat berikutnya muncul dari teks.
theological_decisions:
- issue: Nuansa soteriologis διεσώθησαν
  choice: dibawa dengan selamat melalui air
  alternative: diselamatkan melalui air
  rationale: Dalam kisah air bah, verba ini secara konkret menunjuk pada pemeliharaan dari bahaya. Terjemahan utama mempertahankan nuansa itu, sedangkan alternatif 'diselamatkan' dicatat karena sah secara leksikal dan penting bagi hubungan dengan ayat berikutnya.
- issue: Makna ψυχαί dalam penghitungan penghuni bahtera
  choice: delapan orang
  alternative: delapan jiwa
  rationale: Yang dihitung adalah manusia yang berada di bahtera. 'Orang' menyampaikan maksud itu dengan jelas, sedangkan arti harfiah 'jiwa' dipertahankan dalam catatan tanpa memaksakan suatu antropologi tertentu.
- issue: Hubungan air dengan penyelamatan
  choice: melalui air
  alternative: oleh air
  rationale: διά dengan genitif dapat menyatakan sarana, tetapi konteks juga menggambarkan mereka melewati air bah. 'Melalui air' menjaga ketegangan ini dan tidak menentukan secara berlebihan apakah air terutama dipandang sebagai sarana atau lingkungan bahaya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan awal yang berupa anak kalimat dipertahankan karena ayat ini melanjutkan rujukan dari ayat sebelumnya. Personifikasi 'kesabaran Allah terus menanti' dipertahankan agar struktur dan tekanan teks Yunani tidak diam-diam diubah.
