  text: ᾧ ἀντίστητε στερεοὶ τῇ πίστει, εἰδότες τὰ αὐτὰ τῶν παθημάτων τῇ ἐν ⸀τῷ κόσμῳ ὑμῶν ἀδελφότητι ἐπιτελεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/009.yaml
  text: Resist him[a], firm in the faith[c][b], knowing that the same sufferings are being experienced by your brotherhood in the world.
translation:
  language: id
  text: Lawanlah dia dengan teguh dalam iman, sebab kamu tahu bahwa penderitaan yang sama sedang dialami oleh persekutuan saudara seimanmu di seluruh dunia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih harfiah: “sedang digenapi dalam persekutuan saudara seimanmu di seluruh dunia.”'
    reason: Menjaga kemungkinan nuansa ἐπιτελεῖσθαι sebagai penderitaan yang sedang dilaksanakan atau digenapi, sambil mempertahankan sifat kolektif ἀδελφότης.
lexical_decisions:
- source_word: ᾧ
  choice: dia
  rationale: Kata ganti relatif datif ini merujuk kepada Iblis dalam ayat 8; bahasa Indonesia secara alami memakai objek langsung setelah “lawanlah”.
- source_word: ἀντίστητε
  choice: Lawanlah
  rationale: Imperatif aoris ini menyerukan perlawanan yang tegas; “lawanlah” ringkas, alami, dan mempertahankan daya perintahnya.
- source_word: στερεοὶ τῇ πίστει
  choice: dengan teguh dalam iman
  rationale: Ungkapan ini menggambarkan cara melawan. “Dalam iman” tetap memungkinkan iman sebagai kepercayaan maupun komitmen kepada iman Kristen, tanpa memaksakan pembedaan yang tidak mutlak.
- source_word: εἰδότες
  choice: sebab kamu tahu
  rationale: Partisipel ini dapat menyatakan dasar bagi perintah sebelumnya; bentuk klausa kausal lebih alami dalam bahasa Indonesia.
- source_word: τὰ αὐτὰ τῶν παθημάτων
  choice: penderitaan-penderitaan yang sama
  rationale: Menyampaikan penderitaan sejenis yang dialami komunitas orang percaya tanpa menyiratkan bahwa setiap peristiwa identik.
- source_word: τῇ ... ὑμῶν ἀδελφότητι
  choice: oleh seluruh saudara seimanmu
  rationale: ἀδελφότης adalah nomina kolektif bagi segenap persekutuan orang percaya, bukan hanya laki-laki; ungkapan ini alami dan inklusif dalam bahasa Indonesia.
- source_word: ἐν τῷ κόσμῳ
  choice: di dunia
  rationale: Padanan langsung yang menunjukkan lokasi komunitas orang percaya.
- source_word: ἐπιτελεῖσθαι
  choice: sedang dialami
  rationale: Dalam konstruksi dengan penderitaan dan komunitas sebagai datif, padanan ini menyampaikan maksud konteks secara alami; makna lebih harfiah “sedang digenapi/diselesaikan” dicatat sebagai alternatif.
theological_decisions:
- issue: Makna τῇ πίστει
  choice: dalam iman
  alternative: dalam ajaran iman itu
  rationale: Artikel Yunani dan konteks dapat menunjuk kepada iman Kristen yang dipegang teguh, tetapi juga tidak meniadakan unsur kepercayaan pribadi. Bahasa Indonesia “dalam iman” menjaga ketegangan tersebut.
- issue: Cakupan ἀδελφότητι
  choice: seluruh saudara seimanmu
  alternative: persekutuan saudara-saudaramu
  rationale: Nomina kolektif ini mencakup seluruh komunitas orang percaya, perempuan maupun laki-laki, tanpa memasukkan gagasan denominasi tertentu.
- issue: Nuansa ἐπιτελεῖσθαι
  choice: sedang dialami
  alternative: sedang digenapi
  rationale: “Dialami” paling alami dalam konteks penderitaan, sedangkan “digenapi” mempertahankan kemungkinan nuansa bahwa penderitaan sedang mencapai penyelesaiannya; alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan khidmat. “Seluruh saudara seimanmu” dipilih agar nomina kolektif Yunani terdengar alami serta jelas mencakup seluruh komunitas orang percaya.
