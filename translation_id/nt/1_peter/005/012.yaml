reference: 1 Peter 5:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διὰ Σιλουανοῦ ὑμῖν τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι, δι’ ὀλίγων ἔγραψα, παρακαλῶν καὶ ἐπιμαρτυρῶν ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ· εἰς ἣν ⸀στῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/012.yaml
  text: Through Silvanus[a], the faithful brother, as I regard him, I have written to you briefly, exhorting and testifying that this is the true grace of God[b]. Stand firm in it.
translation:
  language: id
  text: Melalui Silwanus, saudara yang setia—demikianlah penilaianku—aku telah menulis kepada kamu secara singkat[a], untuk menasihati dan bersaksi bahwa inilah anugerah Allah yang sejati. Berdirilah teguh di dalamnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku telah menulis kepada kamu dengan sedikit kata.”
    reason: lexical_alternative
  - marker: b
    text: Beberapa naskah berbunyi, “di dalamnya kamu berdiri,” bukan “Berdirilah teguh di dalamnya.”
    reason: textual_variant
lexical_decisions:
- source_word: Διὰ Σιλουανοῦ
  choice: Melalui Silwanus
  rationale: διά dengan bentuk genitif menyatakan perantaraan atau sarana. Terjemahan ini mempertahankan kemungkinan bahwa Silwanus menjadi pembawa surat atau membantu penulisannya tanpa menentukan perannya secara berlebihan.
- source_word: Σιλουανοῦ
  choice: Silwanus
  rationale: Nama ini ditransliterasikan langsung dari bentuk Yunani Σιλουανός; bentuk terkait 'Silas' tidak dipakai karena bukan bentuk yang terdapat dalam ayat ini.
- source_word: τοῦ πιστοῦ ἀδελφοῦ
  choice: saudara yang setia
  rationale: πιστός dapat berarti setia atau dapat dipercaya. 'Saudara yang setia' merupakan ungkapan wajar dalam bahasa Indonesia dan tepat untuk seorang rekan laki-laki tertentu.
- source_word: ὡς λογίζομαι
  choice: demikianlah penilaianku
  rationale: Ungkapan ini menyampaikan penilaian pribadi Petrus mengenai Silwanus. Bentuk sisipan dengan tanda pisah mempertahankan nuansa parentetisnya.
- source_word: δι’ ὀλίγων
  choice: dengan singkat
  rationale: Ungkapan ini secara idiomatis berarti menulis secara ringkas atau dengan sedikit kata.
- source_word: ἔγραψα
  choice: aku telah menulis
  rationale: Aoristus epistoler dipahami dari sudut pandang penerima ketika surat dibaca; bentuk perfektif Indonesia ini alami dalam penutup surat.
- source_word: παρακαλῶν
  choice: untuk menasihati
  rationale: Dalam konteks nasihat surat ini, παρακαλέω mencakup dorongan dan seruan yang sungguh-sungguh. 'Menasihati' mempertahankan daya hortatoris tanpa terdengar kuno.
- source_word: ἐπιμαρτυρῶν
  choice: bersaksi
  rationale: Kata ini menyatakan peneguhan melalui kesaksian yang sungguh-sungguh, bukan sekadar pernyataan biasa.
- source_word: ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ
  choice: bahwa inilah anugerah Allah yang sejati
  rationale: Susunan ini mempertahankan penunjukan ταύτην dan penegasan ἀληθῆ. 'Anugerah' merupakan padanan alami dan bermartabat bagi χάρις dalam konteks teologis.
- source_word: εἰς ἣν στῆτε
  choice: Berdirilah teguh di dalamnya
  rationale: στῆτε dalam teks SBLGNT adalah imperatif yang menyerukan keteguhan. 'Di dalamnya' merujuk kembali kepada anugerah dan mengungkapkan lingkup tempat mereka harus tetap teguh.
theological_decisions:
- issue: Rujukan 'inilah' dalam pernyataan 'inilah anugerah Allah yang sejati'
  choice: '''Inilah'' dibiarkan menunjuk secara luas pada isi pesan dan nasihat dalam surat Petrus sebagai kesaksian tentang anugerah Allah.'
  alternative: '''Inilah'' dapat menunjuk lebih sempit pada pengalaman anugerah para pembaca atau pada berita Injil yang disampaikan melalui Silwanus.'
  rationale: Konteks menulis, menasihati, dan bersaksi mendukung rujukan pada isi yang telah ditulis, tetapi cakupannya tidak dipersempit secara dogmatis oleh terjemahan.
- issue: Daya bentuk akhir στῆτε
  choice: 'Imperatif: ''Berdirilah teguh di dalamnya.'''
  alternative: 'Varian tekstual berbentuk indikatif: ''di dalamnya kamu berdiri.'''
  rationale: Teks SBLGNT yang diberikan memakai στῆτε sebagai perintah. Varian indikatif tetap dicatat agar bukti tekstual tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat yang hangat, sungguh-sungguh, dan bermartabat. Kata ganti 'aku' dan 'kamu' mengikuti suara pribadi surat serta sapaan kepada komunitas tanpa menambahkan unsur yang tidak dinyatakan. Tanda pisah menandai komentar parentetis ὡς λογίζομαι dengan jelas.
