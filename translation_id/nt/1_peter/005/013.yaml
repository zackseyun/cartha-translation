  terminology: “Babel,” “Markus,” “dipilih bersama-sama dengan kamu,” dan “anakku” konsisten dengan istilah Alkitab bahasa Indonesia serta dengan nuansa teks Yunani. Catatan kaki menjelaskan bentuk feminin, kemungkinan Babel sebagai Roma, dan kemungkinan hubungan rohani tanpa menjadikannya bagian dari terjemahan utama.
