id: 1PE.5.13
reference: 1 Peter 5:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς ἡ ἐν Βαβυλῶνι συνεκλεκτὴ καὶ Μᾶρκος ὁ υἱός μου.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/013.yaml
  text: She who is in Babylon[a], chosen together with you, greets you, and so does Mark[c][b], my son.
translation:
  language: id
  text: Yang berada di Babel[a][b] dan dipilih bersama-sama dengan kamu menyampaikan salam kepadamu. Demikian juga Markus, anakku.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih interpretatif, “Jemaat di Babel, yang dipilih bersama-sama dengan kamu.” Bahasa Yunani memakai ungkapan feminin tunggal dengan nomina yang tidak disebutkan.
    reason: alternative_reading
  - marker: b
    text: Dalam pemakaian Kristen mula-mula, “Babel” mungkin merupakan sebutan simbolis untuk Roma; teksnya sendiri menyebut “Babel.”
    reason: cultural_note
  - marker: c
    text: “Anakku” kemungkinan besar menyatakan hubungan rohani, bukan hubungan biologis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: menyampaikan salam kepada
  rationale: Ungkapan ini wajar dalam konteks surat dan mencakup arti ‘menyalami’ atau ‘mengirimkan salam’ tanpa menambahkan nuansa yang tidak dinyatakan.
- source_word: ἡ ... συνεκλεκτὴ
  choice: Yang ... dipilih bersama-sama dengan kamu
  rationale: Bahasa Yunani memakai bentuk feminin tunggal dengan nomina yang tidak disebutkan. Ungkapan Indonesia ini membiarkan acuannya tersirat dan tidak langsung memasukkan kata ‘jemaat’ atau ‘perempuan’; keterangan tentang bentuk feminin diberikan dalam catatan kaki.
- source_word: ἐν Βαβυλῶνι
  choice: di Babel
  rationale: Teks sumber secara langsung menyebut Babel. Nama itu dipertahankan, sedangkan kemungkinan pemaknaan simbolisnya dijelaskan dalam catatan kaki.
- source_word: συνεκλεκτὴ
  choice: dipilih bersama-sama dengan kamu
  rationale: Pilihan ini menyatakan bahwa pihak yang dimaksud turut dipilih bersama para penerima surat dan terdengar alami dalam bahasa Indonesia modern.
- source_word: Μᾶρκος
  choice: Markus
  rationale: Markus adalah bentuk nama yang baku dan lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: ὁ υἱός μου
  choice: anakku
  rationale: Terjemahan ini mempertahankan ungkapan kekeluargaan yang harfiah. Kemungkinan bahwa hubungan tersebut bersifat rohani, bukan biologis, tidak dimasukkan ke dalam teks utama.
theological_decisions:
- issue: Identitas ἡ ... συνεκλεκτὴ
  choice: 'Acuan feminin tunggal dibiarkan tersirat: ‘Yang ... dipilih bersama-sama dengan kamu.’'
  alternative: ‘Jemaat di Babel, yang dipilih bersama-sama dengan kamu’ atau seorang perempuan tertentu.
  rationale: Teks Yunani tidak menyebutkan nominanya. Memasukkan ‘jemaat’ ke dalam teks utama akan menyelesaikan ambiguitas yang masih ada dalam sumber; catatan kaki menyajikan penafsiran yang umum.
- issue: Makna Babel
  choice: Mempertahankan ‘Babel’ dalam teks utama.
  alternative: Roma sebagai makna simbolis, atau kota Babel di Mesopotamia secara harfiah.
  rationale: Teks menyebut Babel, sedangkan identifikasi tempat itu diperdebatkan. Terjemahan tidak mengganti nama yang tertulis dengan penafsiran tertentu.
- issue: Arti ‘anakku’ bagi Markus
  choice: Mempertahankan bahasa kekeluargaan secara harfiah.
  alternative: ‘Anak rohaniku.’
  rationale: Hubungan rohani sangat mungkin dimaksudkan, tetapi kata ‘rohani’ tidak terdapat dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kalimat mempertahankan acuan yang tersirat tanpa memaksakan identitasnya. Bentuk feminin dalam bahasa Yunani tidak dapat ditampilkan secara alami dalam pronomina Indonesia, sehingga informasi itu dipertahankan melalui catatan kaki.
