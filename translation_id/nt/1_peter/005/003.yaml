  text: not domineering over those allotted to your care[a], but becoming examples to the flock.
translation:
  language: id
  text: jangan juga menguasai dengan sewenang-wenang atas orang-orang yang dipercayakan kepada kalian[a], tetapi jadilah teladan bagi kawanan domba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “atas bagian-bagian yang dibagikan kepada kalian.” Kata Yunani ini secara harfiah berarti “bagian-bagian yang diperoleh melalui undian” atau “bagian-bagian yang dibagikan”; dalam konteks ini, kemungkinan menunjuk pada bagian-bagian dari kawanan Allah yang dipercayakan kepada pemeliharaan setiap penatua.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδ’ ὡς
  choice: jangan juga
  rationale: Meneruskan rangkaian larangan dari ayat sebelumnya dan secara wajar menyatakan cara menggembalakan yang tidak boleh dilakukan.
- source_word: κατακυριεύοντες
  choice: bertindak sewenang-wenang sebagai penguasa atas
  rationale: Kata kerja ini menunjuk pada penggunaan kekuasaan secara menindas atau berlebihan, bukan sekadar pelaksanaan kepemimpinan yang sah.
- source_word: τῶν κλήρων
  choice: orang-orang yang dipercayakan kepada kalian
  rationale: Secara harfiah berarti ‘bagian-bagian yang diperoleh melalui undian/dibagikan’; dalam konteks para penatua dan kawanan Allah, ungkapan ini menunjuk pada bagian umat yang dipercayakan kepada pemeliharaan mereka. Catatan kaki mempertahankan gambaran leksikal aslinya.
- source_word: ἀλλὰ
  choice: tetapi
  rationale: Menandai pertentangan tegas antara kepemimpinan sewenang-wenang dan kepemimpinan melalui teladan.
- source_word: τύποι
  choice: teladan
  rationale: Menyatakan pola atau contoh yang patut ditiru; ‘teladan’ alami dan bermartabat dalam bahasa Indonesia.
- source_word: γινόμενοι
  choice: jadilah
  rationale: Dalam rangkaian nasihat ini, partisip tersebut membawa daya perintah dan menekankan perwujudan nyata sebagai teladan.
- source_word: τοῦ ποιμνίου
  choice: kawanan domba itu
  rationale: Mempertahankan metafora pastoral yang menunjuk pada komunitas orang percaya yang digembalakan.
theological_decisions:
- issue: Makna κλήρων dalam kaitannya dengan kepemimpinan jemaat
  choice: orang-orang yang dipercayakan kepada para penatua untuk dipelihara
  alternative: bagian-bagian yang dibagikan kepada para penatua
  rationale: Konteksnya adalah menggembalakan kawanan Allah. Terjemahan ini menekankan tanggung jawab pengelolaan, bukan kepemilikan, sementara makna harfiahnya tetap dicatat dalam catatan kaki.
- issue: Daya κατακυριεύοντες
  choice: melarang penggunaan wewenang secara sewenang-wenang atau menindas
  alternative: melarang segala bentuk kepemimpinan atau wewenang penatua
  rationale: Kata tersebut mengecam penyalahgunaan kekuasaan. Kontras dengan menjadi teladan menunjukkan bahwa yang ditolak bukan kepemimpinan itu sendiri, melainkan cara memimpin yang dominatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat pastoral yang lugas dan bermartabat. Bentuk ‘kalian’ menyatakan orang kedua jamak kepada para penatua; ‘kawanan domba’ mempertahankan metafora penggembalaan.
