id: 1PE.5.2
reference: 1 Peter 5:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ποιμάνατε τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ, ⸀ἐπισκοποῦντες μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως ⸂κατὰ θεόν⸃, μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/002.yaml
  text: Shepherd the flock of God among you[a], exercising oversight not under compulsion but willingly, according to God; nor for shameful gain, but eagerly.
translation:
  language: id
  text: Gembalakanlah kawanan domba Allah yang ada di antara kalian, sambil mengawasinya—bukan karena terpaksa, melainkan dengan sukarela, menurut Allah[a]; bukan pula demi keuntungan yang memalukan, melainkan dengan penuh semangat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesuai dengan kehendak Allah” atau “sebagaimana yang Allah kehendaki.” Secara harfiah, “menurut Allah”; frasa ini dapat juga menyiratkan standar atau cara yang sesuai dengan Allah.
    reason: Frasa κατὰ θεόν padat; catatan ini memberi pembacaan yang lebih idiomatis tanpa membatasi maknanya dalam teks utama.
lexical_decisions:
- source_word: ποιμάνατε
  choice: Gembalakanlah
  rationale: Bentuk imperatif ini memanggil para penatua untuk bertindak sebagai gembala. Pilihan ini mempertahankan metafora penggembalaan tanpa menjadikannya nama jabatan.
- source_word: τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ
  choice: kawanan domba Allah yang ada di antara kalian
  rationale: Mempertahankan gambaran kawanan domba, kepemilikan Allah, dan nuansa lokal-relasional ἐν ὑμῖν; kawanan itu milik Allah, bukan milik para penatua.
- source_word: ἐπισκοποῦντες
  choice: dengan mengawasinya
  rationale: Partisip ini menerangkan cara menggembalakan. Ungkapan deskriptif ini menyampaikan tanggung jawab pengawasan tanpa mengubahnya menjadi gelar jabatan gerejawi.
- source_word: μὴ ἀναγκαστῶς
  choice: bukan karena terpaksa
  rationale: Mengungkap tindakan yang dilakukan akibat keharusan atau tekanan dan membentuk kontras alami dengan pelayanan sukarela.
- source_word: ἀλλὰ ἑκουσίως
  choice: melainkan dengan sukarela
  rationale: Menyampaikan tindakan yang dilakukan dengan kemauan sendiri dan mempertahankan kontras dengan keterpaksaan.
- source_word: κατὰ θεόν
  choice: sesuai dengan kehendak Allah
  rationale: Frasa Yunani ini padat dan dapat menunjuk pada kehendak atau cara yang berkenan kepada Allah. Terjemahan ini alami dalam bahasa Indonesia, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: μηδὲ αἰσχροκερδῶς
  choice: bukan pula demi keuntungan yang memalukan
  rationale: Mempertahankan unsur keuntungan materi serta penilaian moral bahwa pengejaran keuntungan semacam itu tercela.
- source_word: ἀλλὰ προθύμως
  choice: melainkan dengan penuh semangat
  rationale: Menyampaikan kesiapan dan kesungguhan, sekaligus membedakannya dari ἑκουσίως yang sebelumnya diterjemahkan 'dengan sukarela'.
theological_decisions:
- issue: Apakah ἐπισκοποῦντες harus diterjemahkan sebagai istilah jabatan teknis
  choice: Diterjemahkan secara deskriptif sebagai 'dengan mengawasinya'.
  alternative: melayani sebagai penilik; menjalankan jabatan uskup
  rationale: Dalam konteks ini partisip tersebut menggambarkan kegiatan para penatua, tanpa harus menunjuk pada gelar gerejawi yang telah dibakukan. Pilihan ini menghindari pemasukan tata gereja denominasi tertentu.
- issue: Seberapa eksplisit κατὰ θεόν perlu ditafsirkan
  choice: Diterjemahkan 'sesuai dengan kehendak Allah' dalam teks utama, dengan alternatif yang lebih harfiah dalam catatan kaki.
  alternative: menurut Allah; sebagaimana yang Allah kehendaki
  rationale: Frasa ini sangat ringkas. Terjemahan utama dibuat alami dan dapat dipahami, sedangkan catatan kaki menjaga kemungkinan nuansa standar atau cara yang sesuai dengan Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Sapaan jamak 'kalian' dipakai untuk memperjelas bahwa perintah ditujukan kepada para penatua secara kolektif. Metafora gembala dan kawanan domba dipertahankan.
