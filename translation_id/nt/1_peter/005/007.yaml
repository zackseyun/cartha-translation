lexical_decisions:
- source_word: πᾶσαν τὴν μέριμναν ὑμῶν
  choice: seluruh kekhawatiran kalian
  rationale: Bentuk tunggal kolektif dengan πᾶσαν mencakup segenap kekhawatiran para pembaca. “Kalian” mempertahankan bentuk orang kedua jamak.
- source_word: ἐπιρίψαντες
  choice: dengan menyerahkan
  rationale: Partisip aoris ini bergantung pada nasihat dalam ayat 6. “Dengan menyerahkan” mempertahankan hubungan sintaksis tersebut sekaligus menyampaikan gambaran memindahkan beban kepada pihak lain.
- source_word: ἐπ’ αὐτόν
  choice: kepada-Nya
  rationale: Mengungkapkan arah pemindahan beban kepada pribadi yang dirujuk oleh kata ganti. Kapitalisasi mengikuti kebiasaan bahasa Indonesia untuk kata ganti yang merujuk kepada Allah tanpa mengganti kata ganti itu dengan nama eksplisit.
- source_word: ὅτι
  choice: karena
  rationale: Memperkenalkan alasan bagi tindakan menyerahkan kekhawatiran.
- source_word: αὐτῷ μέλει περὶ ὑμῶν
  choice: Ia peduli kepada kalian
  rationale: Ungkapan Yunani menyatakan kepedulian aktif terhadap para pembaca. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan personalnya.
theological_decisions:
- issue: Rujukan αὐτόν/αὐτῷ
  choice: kata ganti -Nya/Ia yang merujuk kepada Allah
  alternative: menyebut “Allah” secara eksplisit
  rationale: Konteks langsung ayat 6 menyebut Allah sebagai rujukan yang paling wajar, tetapi teks ayat 7 sendiri memakai kata ganti. Terjemahan mempertahankan bentuk pronominal dan menjelaskan rujukannya dalam catatan.
- issue: Hubungan ἐπιρίψαντες dengan nasihat ayat 6
  choice: “dengan menyerahkan,” sebagai tindakan yang menyertai atau menjabarkan perendahan diri
  alternative: “serahkanlah,” sebagai perintah mandiri
  rationale: Partisip Yunani secara gramatikal terkait dengan perintah dalam ayat sebelumnya. Terjemahan tidak mengubahnya menjadi imperatif mandiri sehingga hubungan dan kemungkinan nuansanya tetap terpelihara.
translation_notes:
  register: Bahasa modern, lugas, dan bermartabat. “Kalian” dipakai untuk memperjelas bahwa ὑμῶν berbentuk jamak. Ungkapan “peduli kepada” dipilih karena alami bagi pembaca umum, sedangkan struktur pembuka “dengan menyerahkan” sengaja mempertahankan kaitan ayat ini dengan ayat sebelumnya.
