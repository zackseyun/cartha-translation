id: 1PE.5.14
reference: 1 Peter 5:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἀγάπης. εἰρήνη ὑμῖν πᾶσιν τοῖς ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/014.yaml
  text: Greet one another with a kiss of love[a]. Peace to all of you who are in Messiah.
translation:
  language: id
  text: Salamilah satu sama lain dengan ciuman kasih. Damai sejahtera bagi kamu semua yang ada dalam Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut terjemahan yang lebih tradisional, “dalam Kristus.”
    reason: Menampilkan padanan tradisional bagi Χριστῷ tanpa mengganti terjemahan gelarnya dalam teks utama.
lexical_decisions:
- source_word: ἀσπάσασθε ἀλλήλους
  choice: Salamilah satu sama lain
  rationale: Bentuk imperatif jamak ini memerintahkan tindakan saling memberi salam. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan sifat timbal balik ἀλλήλους.
- source_word: ἐν φιλήματι ἀγάπης
  choice: dengan ciuman kasih
  rationale: ἐν menyatakan cara atau sarana pemberian salam; φίλημα berarti 'ciuman', sedangkan genitif ἀγάπης menerangkan ciuman itu sebagai ungkapan kasih. Pilihan ini mempertahankan hubungan leksikal dengan ἀγάπη.
- source_word: εἰρήνη
  choice: Damai sejahtera
  rationale: Dalam rumusan berkat penutup, 'damai sejahtera' menyampaikan cakupan εἰρήνη secara alami dan bermartabat dalam bahasa Indonesia tanpa mengubahnya menjadi kalimat permohonan eksplisit.
- source_word: ὑμῖν πᾶσιν
  choice: bagi kamu semua
  rationale: Frasa datif ini menunjuk para penerima berkat dan menegaskan cakupan yang menyeluruh.
- source_word: τοῖς ἐν Χριστῷ
  choice: yang ada dalam Mesias
  rationale: Artikel dengan frasa preposisional berfungsi substantival, yakni 'mereka yang ada dalam'. Χριστός dipahami sebagai gelar 'Yang Diurapi' dan karena itu diterjemahkan 'Mesias'; ungkapan 'dalam' dipertahankan agar bahasa persatuan atau keberadaan relasional dalam teks tidak dipersempit.
theological_decisions:
- issue: Penerjemahan Χριστῷ dalam ungkapan ἐν Χριστῷ
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός pada dasarnya adalah gelar yang berarti Yang Diurapi. 'Mesias' mempertahankan makna gelar tersebut, sedangkan bentuk tradisional 'Kristus' dicatat dalam catatan kaki agar pembaca mengenali padanan yang lazim.
- issue: Makna ungkapan ἐν Χριστῷ
  choice: dalam Mesias
  alternative: milik Mesias
  rationale: Terjemahan harfiah dan alami 'dalam Mesias' mempertahankan keluasan serta ketegangan teologis ungkapan Yunani tanpa mereduksinya hanya menjadi kepemilikan atau keanggotaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Bentuk 'Salamilah' sesuai dengan penutup surat, sedangkan 'ciuman kasih' mempertahankan gambaran konkret teks sumber. Pronomina 'kamu' dipilih karena sapaan ditujukan kepada komunitas secara jamak.
