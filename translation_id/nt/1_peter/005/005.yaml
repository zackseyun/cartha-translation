id: 1PE.5.5
reference: 1 Peter 5:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ⸀ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/005.yaml
  text: Likewise[a], you younger men, submit yourselves to the elders. And all of you, clothe yourselves with humility toward one another, because God opposes the proud[c][b], but gives grace to the humble.
translation:
  language: id
  text: 'Demikian juga, hai para pemuda[a], tunduklah kepada para penatua. Kamu semua, kenakanlah kerendahan hati terhadap satu sama lain[b], sebab,


    “Allah menentang orang-orang yang sombong,


    tetapi memberikan anugerah kepada orang-orang yang rendah hati.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hai kamu yang lebih muda.” Kata Yunaninya berbentuk maskulin jamak dan dapat berarti “para pemuda”, tetapi sebagian penafsir memahaminya secara lebih umum sebagai anggota jemaat yang lebih muda.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “ikatkanlah kerendahan hati.” Kata kerja Yunaninya menggambarkan tindakan mengenakan atau mengikat pakaian, sehingga menekankan kerendahan hati yang sengaja dikenakan.
    reason: lexical_alternative
  - marker: c
    text: Kutipan atau rujukan kepada Amsal 3:34 dalam Septuaginta, terjemahan Yunani Perjanjian Lama.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: Demikian juga
  rationale: Penanda wacana ini menghubungkan nasihat kepada kaum muda dengan nasihat sebelumnya kepada para penatua.
- source_word: νεώτεροι
  choice: hai para pemuda
  rationale: Bentuk vokatif maskulin jamak dipertahankan secara wajar dalam bahasa Indonesia; kemungkinan arti yang lebih umum dicatat dalam catatan kaki.
- source_word: ὑποτάγητε
  choice: tunduklah
  rationale: Imperatif ini menyatakan kesediaan menempatkan diri di bawah kepemimpinan atau kewenangan pihak yang disebut, tanpa tambahan kata yang tidak diperlukan.
- source_word: πρεσβυτέροις
  choice: kepada para penatua
  rationale: Konteks langsung 5:1–4 menunjuk kepada para penatua jemaat, bukan sekadar laki-laki yang lebih tua.
- source_word: πάντες δὲ
  choice: Kamu semua
  rationale: Ungkapan ini memperluas nasihat kepada seluruh komunitas dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἀλλήλοις
  choice: dalam hubungan seorang dengan yang lain
  rationale: Mengungkapkan arah relasional timbal balik dari kerendahan hati dengan jelas dan alami.
- source_word: ταπεινοφροσύνην
  choice: kerendahan hati
  rationale: Padanan Indonesia yang baku, jelas, dan bermartabat untuk sikap rendah hati.
- source_word: ἐγκομβώσασθε
  choice: kenakanlah
  rationale: Mempertahankan metafora mengenakan atau mengikat pakaian, sekaligus tetap mudah dipahami.
- source_word: ὅτι
  choice: sebab
  rationale: Memperkenalkan dasar alkitabiah bagi nasihat sebelumnya dengan hubungan sebab yang jelas.
- source_word: ὑπερηφάνοις
  choice: orang-orang yang sombong
  rationale: Menyampaikan adjektiva substantival secara alami dalam bahasa Indonesia.
- source_word: ἀντιτάσσεται
  choice: menentang
  rationale: Menyatakan tindakan Allah yang secara aktif berhadapan dengan kesombongan; lebih kuat dan tepat daripada sekadar 'tidak menyukai'.
- source_word: ταπεινοῖς δὲ δίδωσιν χάριν
  choice: tetapi memberikan anugerah kepada orang-orang yang rendah hati
  rationale: Mempertahankan kontras, tindakan memberi, serta istilah teologis χάρις tanpa mempersempit maknanya.
theological_decisions:
- issue: Rujukan πρεσβυτέροις
  choice: para penatua jemaat
  alternative: orang-orang yang lebih tua
  rationale: Konteks terdekat, khususnya 5:1–4, secara eksplisit membahas para penatua dan tugas penggembalaan mereka.
- issue: Cakupan νεώτεροι
  choice: para pemuda
  alternative: orang-orang yang lebih muda
  rationale: Bentuk Yunani adalah maskulin jamak dan kontrasnya kemungkinan ialah para penatua; catatan kaki mempertahankan kemungkinan bahwa sebutan itu dipakai lebih umum bagi anggota yang lebih muda.
- issue: Citra ἐγκομβώσασθε
  choice: kenakanlah kerendahan hati
  alternative: ikatkanlah kerendahan hati
  rationale: Terjemahan utama mempertahankan citra pakaian tanpa mengunci kata pada gambaran khusus yang tidak pasti; alternatif yang lebih harfiah dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang bermartabat. Bentuk “hai para pemuda” mempertahankan sapaan langsung dan gender gramatikal sumber; “kenakanlah” menjaga metafora pakaian. Kutipan puitis ditata sebagai kutipan tersendiri agar sumber hikmatnya tampak jelas.
