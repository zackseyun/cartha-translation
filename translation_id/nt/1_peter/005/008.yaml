  text: νήψατε, γρηγορήσατε. ὁ ἀντίδικος ὑμῶν διάβολος ὡς λέων ὠρυόμενος περιπατεῖ ζητῶν ⸀τινα ⸀καταπιεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/008.yaml
  text: Be clear-minded[a]; stay alert. Your adversary, the devil, walks around like a roaring lion[b], seeking someone to devour.
translation:
  language: id
  text: Berpikirlah jernih[a] dan tetaplah waspada. Lawanmu, yaitu Iblis, berjalan berkeliling[b] seperti singa yang mengaum, mencari seseorang untuk ditelannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kuasailah dirimu” atau “Sadarlah.” Kata Yunani νήψατε secara harfiah berkaitan dengan keadaan tidak mabuk, tetapi di sini dipakai secara kiasan untuk kejernihan pikiran dan penguasaan diri, bukan terutama untuk pantang minuman keras.
    reason: lexical_alternative
  - marker: b
    text: “Berjalan berkeliling” dapat juga diterjemahkan “mengendap-endap berkeliling.” Kata kerja Yunaninya pada dasarnya berarti berjalan atau pergi berkeliling, sedangkan gambaran singa menyiratkan gerak memburu mangsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: νήψατε
  choice: Berpikirlah jernih
  rationale: Kata kerja ini secara harfiah berkaitan dengan keadaan tidak mabuk, tetapi dalam semua pemakaiannya di Perjanjian Baru bermakna kiasan. Dalam konteks ini, ungkapan tersebut menunjuk pada kejernihan pikiran dan penguasaan diri dalam menghadapi ancaman rohani, serta tetap dibedakan dari γρηγορήσατε.
- source_word: γρηγορήσατε
  choice: tetaplah waspada
  rationale: Imperatif ini menyatakan kesiagaan yang terus dipelihara. Pilihan ini alami dalam bahasa Indonesia modern dan melengkapi, tanpa mengulang, gagasan νήψατε.
- source_word: ἀντίδικος
  choice: lawan
  rationale: Kata ini dapat merujuk kepada pihak lawan dalam perkara hukum, tetapi di sini secara lebih luas menunjuk kepada pihak yang memusuhi para pembaca. 'Lawan' mempertahankan cakupan tersebut tanpa mempersempitnya menjadi penuduh.
- source_word: διάβολος
  choice: Iblis
  rationale: Dalam konteks ini kata tersebut berfungsi sebagai sebutan bagi pribadi jahat yang menjadi lawan orang percaya, bukan sekadar kata benda umum yang berarti pemfitnah.
- source_word: ὡς λέων ὠρυόμενος
  choice: seperti singa yang mengaum
  rationale: Terjemahan ini mempertahankan perbandingan eksplisit dan gambaran ancaman pemangsa secara alami.
- source_word: περιπατεῖ
  choice: berjalan berkeliling
  rationale: Ini mempertahankan arti dasar kata kerja, yaitu berjalan atau pergi berkeliling, sementara gambaran singa sudah menyampaikan ancamannya.
- source_word: ζητῶν
  choice: mencari
  rationale: Partisipel ini menyatakan tindakan yang menyertai dan mengarah pada tujuan menelan mangsa.
- source_word: τινα
  choice: seseorang
  rationale: Kata ganti tak tentu ini berbentuk tunggal dan tidak menunjuk orang tertentu.
- source_word: καταπιεῖν
  choice: untuk ditelannya
  rationale: Kata ini secara harfiah berarti menelan. Dalam metafora singa, bentuk ini mempertahankan daya gambar sumber dengan alami dan tidak melunakkannya.
theological_decisions:
- issue: Apakah διάβολος diterjemahkan sebagai kata benda umum 'pemfitnah' atau sebagai sebutan pribadi bagi Satan
  choice: Iblis
  alternative: pemfitnah
  rationale: Konteks menunjuk kepada pribadi jahat yang memusuhi orang percaya. 'Iblis' mencerminkan pemakaian Perjanjian Baru yang lazim tanpa menambahkan rincian doktrinal di luar teks.
- issue: Seberapa kuat nuansa pemangsaan dinyatakan dalam περιπατεῖ
  choice: berjalan berkeliling
  alternative: mengendap-endap berkeliling
  rationale: Terjemahan utama mempertahankan arti biasa kata kerja Yunani dan membiarkan perumpamaan singa menyampaikan ancamannya. Alternatif yang lebih interpretatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Bentuk imperatif jamak Yunani diterjemahkan dengan imperatif umum bahasa Indonesia. Pronomina posesif tunggal 'lawanmu' mencerminkan ὑμῶν yang jamak secara kolektif dalam sapaan kepada komunitas; bahasa Indonesia tidak membedakan jumlah pada enklitik -mu.
