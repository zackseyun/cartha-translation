base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/004.yaml
  text: And when the Chief Shepherd is revealed[b][a], you will receive the unfading crown of glory.
translation:
  language: id
  text: Dan ketika Gembala Agung dinyatakan[a], kamu akan menerima mahkota kemuliaan yang tidak akan layu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menampakkan diri.”
    reason: alternative_reading
  - marker: b
    text: Kata Yunani yang diterjemahkan “mahkota” dapat menunjuk pada karangan bunga yang dianugerahkan kepada pemenang sebagai tanda kehormatan, bukan mahkota kerajaan secara khusus.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθέντος
  choice: ketika ... dinyatakan
  rationale: Partisip aoristus pasif dalam konstruksi genitif absolut berfungsi temporal. Pilihan ini mempertahankan nuansa pasif dan gagasan penyingkapan; 'menampakkan diri' juga mungkin, tetapi kurang langsung mempertahankan bentuk pasif Yunani.
- source_word: ἀρχιποίμενος
  choice: Gembala Agung
  rationale: Kata majemuk ini menunjuk kepada gembala utama atau tertinggi. 'Gembala Agung' alami dalam bahasa Indonesia, menjaga daya gelar kristologis dalam konteks, dan tidak terdengar administratif seperti 'kepala gembala'.
- source_word: κομιεῖσθε
  choice: kamu akan menerima
  rationale: Bentuk future middle indicative di sini menyatakan penerimaan ganjaran. 'Akan menerima' merupakan padanan Indonesia yang paling alami tanpa mengubahnya menjadi bentuk pasif.
- source_word: ἀμαράντινον
  choice: yang tidak akan layu
  rationale: Adjektiva ini berarti tidak memudar atau kehilangan kesegaran. Karena metaforanya adalah karangan kehormatan dari tumbuhan, 'tidak akan layu' jelas dan konkret bagi pembaca Indonesia serta tidak memperkuat maknanya menjadi 'tidak dapat binasa'.
- source_word: τῆς δόξης
  choice: kemuliaan
  rationale: Genitif dipertahankan dalam frasa 'mahkota kemuliaan', sehingga hubungan metaforis yang ringkas tetap terbuka dan tidak diratakan menjadi sekadar 'mahkota yang mulia'.
- source_word: στέφανον
  choice: mahkota
  rationale: Istilah ini dapat menunjuk kepada karangan yang dianugerahkan sebagai tanda kemenangan atau kehormatan, bukan khusus mahkota kerajaan. 'Mahkota' adalah padanan utama yang wajar dalam bahasa Indonesia, sedangkan nuansa historisnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Identitas 'Gembala Agung'
  choice: Gelar kristologis yang mengacu kepada Yesus
  alternative: Menuliskannya sebagai sebutan umum tanpa kapitalisasi
  rationale: Konteks nasihat kepada para penatua, gambaran penggembalaan, dan penyataan eskatologis menunjukkan bahwa gelar ini mengacu kepada Yesus. Kapitalisasi menandai penggunaannya sebagai gelar tanpa menambahkan uraian doktrinal ke dalam teks.
- issue: Bahasa penyataan eskatologis
  choice: dinyatakan
  alternative: menampakkan diri
  rationale: Bentuk pasif mempertahankan bahasa manifestasi dalam teks Yunani dan tidak mempersempit cara peristiwa itu dipahami. Alternatif idiomatis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur namun mudah dipahami. Bentuk 'kamu' mengikuti sapaan jamak kepada para penatua dalam konteks. Urutan penanda catatan dibuat [a] lalu [b], masing-masing ditempatkan langsung pada unsur yang dijelaskan.
