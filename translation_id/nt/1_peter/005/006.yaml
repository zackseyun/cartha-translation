  text: Ταπεινώθητε οὖν ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ, ἵνα ὑμᾶς ὑψώσῃ ἐν καιρῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/006.yaml
  text: Humble yourselves[a], therefore, under the mighty hand of God, so that he may exalt you at the proper time,
translation:
  language: id
  text: Karena itu, rendahkanlah diri kalian[a] di bawah tangan Allah yang perkasa, supaya Ia meninggikan kalian pada waktunya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Biarlah kalian direndahkan ... supaya Ia meninggikan kalian pada waktu yang tepat.” Kata kerja Yunani berbentuk pasif, meskipun dalam konteks ini lazim dipahami secara refleksif: “rendahkanlah diri kalian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταπεινώθητε
  choice: rendahkanlah dirimu
  rationale: 'Bentuknya adalah imperatif aoris pasif, tetapi dalam konteks nasihat ini wajar dipahami dengan daya refleksif: para pembaca diperintahkan untuk merendahkan diri. Catatan kaki mempertahankan kemungkinan bentuk pasif yang lebih harfiah.'
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari pernyataan sebelumnya bahwa Allah menentang orang sombong tetapi memberi anugerah kepada orang rendah hati.
- source_word: ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ
  choice: di bawah tangan Allah yang kuat
  rationale: Mempertahankan metafora alkitabiah tentang kuasa dan tindakan Allah. 'Yang kuat' merupakan padanan alami bagi κραταιά dalam bahasa Indonesia modern.
- source_word: ἵνα
  choice: supaya
  rationale: Mengungkapkan tujuan atau hasil yang dimaksud secara ringkas dan alami.
- source_word: ὑμᾶς ὑψώσῃ
  choice: Ia meninggikan kamu
  rationale: Subjek yang tersirat ialah Allah. 'Meninggikan' mempertahankan gagasan pemberian kehormatan atau pembenaran, bukan sekadar pengangkatan fisik.
- source_word: ἐν καιρῷ
  choice: pada waktunya
  rationale: καιρός menunjuk pada waktu yang tepat atau sesuai; ungkapan Indonesia ini alami tanpa menentukan lebih jauh apakah waktu itu secara khusus telah ditetapkan.
theological_decisions:
- issue: Bentuk dan pelaku dalam Ταπεινώθητε
  choice: Perintah diterjemahkan secara refleksif, 'rendahkanlah dirimu', dalam konteks ketundukan di bawah kuasa Allah.
  alternative: '''Biarlah kamu direndahkan'' atau ''rendahkanlah dirimu ... supaya Ia meninggikan kamu pada waktu yang tepat.'''
  rationale: Pilihan utama menyampaikan daya perintah secara alami dan tanggung jawab manusia, sedangkan frasa berikutnya menjaga bahwa kerendahan itu berlangsung di bawah kuasa Allah. Catatan kaki mempertahankan ketegangan karena bentuk Yunani secara gramatikal pasif.
- issue: Makna ἐν καιρῷ
  choice: '''pada waktunya'' dibiarkan menunjuk pada waktu yang tepat menurut tindakan Allah.'
  alternative: '''pada waktu yang tepat'' atau ''pada waktu yang ditetapkan'''
  rationale: Teks menyatakan kepantasan waktu tanpa secara eksplisit menerangkan kapan waktunya atau sejauh mana penetapannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk tunggal 'dirimu' dipakai secara kolektif selaras dengan imperatif orang kedua jamak Yunani dan rujukan jamak 'kamu'; metafora 'tangan Allah' dipertahankan.
