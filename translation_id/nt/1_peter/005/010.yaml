reference: 1 Peter 5:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πάσης χάριτος, ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν ⸀Χριστῷ, ὀλίγον παθόντας αὐτὸς ⸀καταρτίσει, στηρίξει, σθενώσει, ⸀θεμελιώσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/010.yaml
  text: And the God of all grace, who called you into his eternal glory in Messiah, after you have suffered a little while, will himself restore, establish, strengthen, and ground you.
translation:
  language: id
  text: Dan Allah, sumber segala anugerah, yang telah memanggil kamu kepada kemuliaan-Nya yang kekal dalam Mesias,[a] setelah kamu menderita untuk waktu yang singkat, Allah sendiri akan memulihkan,[b] meneguhkan, menguatkan, dan meletakkan kamu di atas dasar yang kokoh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam Kristus.” Gelar Yunani Χριστός dapat diterjemahkan “Mesias” atau, menurut bentuk tradisional, “Kristus.”
    reason: alternative_reading
  - marker: b
    text: Atau “menyempurnakan” atau “membuat kamu lengkap.” Kata kerjanya mencakup arti mengembalikan sesuatu kepada keadaan yang semestinya.
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “memberi kamu dasar” atau “meletakkan kamu di atas fondasi yang kokoh.” Kata Yunani ini memakai gambaran fondasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης χάριτος
  choice: sumber segala anugerah
  rationale: Genitif ini secara harfiah dapat diterjemahkan 'Allah segala anugerah', tetapi dalam bahasa Indonesia ungkapan 'sumber segala anugerah' menyampaikan hubungan yang dimaksud dengan lebih alami tanpa membatasi keluasan πάσης.
- source_word: καλέσας
  choice: yang telah memanggil
  rationale: Partisip aoris dialihkan menjadi klausa relatif; 'telah memanggil' secara alami menunjukkan tindakan yang mendahului janji tindakan Allah dalam ayat ini.
- source_word: εἰς τὴν αἰώνιον αὐτοῦ δόξαν
  choice: kepada kemuliaan-Nya yang kekal
  rationale: Kata depan εἰς menunjukkan arah atau tujuan. 'Kepada' terdengar alami dalam bahasa Indonesia dan tidak memaksakan gambaran spasial yang lebih kuat daripada konteks.
- source_word: ἐν Χριστῷ
  choice: dalam Mesias
  rationale: ἐν dipertahankan sebagai 'dalam', sedangkan Χριστός diterjemahkan sebagai gelar 'Mesias', bukan diperlakukan semata-mata sebagai nama diri.
- source_word: ὀλίγον παθόντας
  choice: setelah kamu menderita untuk waktu yang singkat
  rationale: ὀλίγον dipahami secara temporal. 'Setelah' memperjelas hubungan partisip dengan rangkaian verba masa depan, sambil mempertahankan bahwa penderitaan itu terbatas lamanya.
- source_word: αὐτὸς
  choice: akan ...
  rationale: Subjek 'Allah' tetap jelas dalam kalimat Indonesia. Penambahan 'sendiri' berpotensi terbaca sebagai 'tanpa pihak lain'; karena itu penekanan αὐτός terutama dipertahankan melalui subjek eksplisit dan susunan janji tindakan langsung Allah.
- source_word: καταρτίσει
  choice: memulihkan
  rationale: Dalam konteks sesudah penderitaan, verba ini menunjuk pada tindakan membawa kembali kepada keadaan yang semestinya; kemungkinan arti 'menyempurnakan' dicatat dalam catatan kaki.
- source_word: στηρίξει
  choice: meneguhkan
  rationale: Pilihan ini menyampaikan tindakan membuat teguh atau stabil dan tetap dapat dibedakan dari verba berikutnya yang berarti menguatkan.
- source_word: σθενώσει
  choice: menguatkan
  rationale: Padanan langsung dan wajar yang mempertahankan gagasan pemberian kekuatan.
- source_word: θεμελιώσει
  choice: meletakkan kamu di atas dasar yang kokoh
  rationale: Ungkapan ini mempertahankan citra fondasi dalam verba Yunani dan membedakannya dari 'meneguhkan'.
theological_decisions:
- issue: Arti Χριστῷ
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar. 'Mesias' menerjemahkan maknanya, sedangkan bentuk tradisional 'Kristus' tetap dicatat sebagai alternatif.
- issue: Hubungan penderitaan dengan tindakan Allah
  choice: setelah kamu menderita untuk waktu yang singkat
  alternative: ketika kamu telah menderita untuk waktu yang singkat
  rationale: Frasa partisipial paling alami dipahami sebagai keadaan temporal yang mendahului tindakan pemulihan Allah. Terjemahan tidak menambahkan penjelasan mengenai tujuan atau penyebab penderitaan.
- issue: Arah panggilan menuju kemuliaan
  choice: kepada kemuliaan-Nya yang kekal
  alternative: ke dalam kemuliaan-Nya yang kekal
  rationale: εἰς memiliki daya arah/tujuan. 'Kepada' mempertahankan tujuan panggilan secara alami, sementara alternatif 'ke dalam' mungkin lebih menonjolkan gagasan masuk dan berpartisipasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan jamak ὑμᾶς diterjemahkan 'kamu' sesuai pemakaian Indonesia yang dapat bersifat jamak dalam konteks; rangkaian empat tindakan ilahi dipertahankan dengan verba yang berbeda. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
