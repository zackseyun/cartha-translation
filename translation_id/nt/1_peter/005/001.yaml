  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πρεσβυτέρους ⸀οὖν ἐν ὑμῖν παρακαλῶ ὁ συμπρεσβύτερος καὶ μάρτυς τῶν τοῦ Χριστοῦ παθημάτων, ὁ καὶ τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/001.yaml
  text: 'Therefore I exhort the elders among you[a], as a fellow elder and a witness of the sufferings of the Messiah[b], and also a sharer in the glory that is about to be revealed:'
translation:
  language: id
  text: 'Karena itu, saya menasihati para penatua di antara kalian, sebagai sesama penatua dan saksi atas penderitaan Mesias,[a] serta sebagai orang yang turut mengambil bagian dalam kemuliaan yang akan dinyatakan:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “penderitaan Kristus.” Gelar Yunani Χριστός dapat diterjemahkan “Mesias” atau, secara tradisional, “Kristus.”
    reason: alternative_reading
lexical_decisions:
- source_word: Πρεσβυτέρους
  choice: para penatua
  rationale: Dalam konteks jemaat, istilah ini menunjuk kepada para pemimpin jemaat, bukan sekadar laki-laki lanjut usia. 'Penatua' merupakan padanan Indonesia yang lazim tanpa memasukkan istilah jabatan denominasi tertentu.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai hubungan kesimpulan dengan pembahasan sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Menyampaikan makna relasional frasa Yunani secara lugas dan alami.
- source_word: παρακαλῶ
  choice: saya menasihati
  rationale: Mengungkapkan seruan pastoral yang sungguh-sungguh. 'Menasihati' lebih wajar dalam register Alkitab Indonesia daripada padanan harfiah yang kaku, tanpa mengurangi daya desaknya.
- source_word: συμπρεσβύτερος
  choice: saya yang juga seorang penatua
  rationale: Menjaga unsur kebersamaan status yang dinyatakan oleh awalan συν- sekaligus menghasilkan susunan Indonesia yang alami.
- source_word: μάρτυς
  choice: saksi
  rationale: Makna langsungnya adalah orang yang menyaksikan atau memberi kesaksian; konteks ini tidak mengharuskan arti 'martir'.
- source_word: τῶν τοῦ Χριστοῦ παθημάτων
  choice: penderitaan Mesias
  rationale: Genitif paling wajar dipahami sebagai penderitaan yang dialami Mesias. Bentuk ringkas ini alami dalam bahasa Indonesia dan tidak mengubah relasinya.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός masih berfungsi sebagai gelar bagi Yang Diurapi. 'Mesias' menyampaikan arti gelar itu; bentuk tradisional 'Kristus' dicatat sebagai alternatif.
- source_word: κοινωνός
  choice: orang yang turut mengambil bagian
  rationale: Menyatakan partisipasi dalam sesuatu secara jelas dan idiomatis, tanpa nuansa komersial yang mungkin muncul dari 'mitra'.
- source_word: τῆς μελλούσης ἀποκαλύπτεσθαι δόξης
  choice: dalam kemuliaan yang akan segera dinyatakan
  rationale: Mempertahankan bentuk pasif ἀποκαλύπτεσθαι serta nuansa pengharapan atau kedekatan yang dibawa oleh μέλλω, tanpa menentukan jadwal eskatologis secara lebih rinci.
theological_decisions:
- issue: Penerjemahan Χριστοῦ sebagai gelar kristologis
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks ini arti gelar 'Yang Diurapi' tetap hidup. 'Mesias' mempertahankan nilai gelarnya, sementara 'Kristus' adalah bentuk tradisional yang sah dan dicatat dalam catatan kaki.
- issue: Daya ungkap μελλούσης ἀποκαλύπτεσθαι
  choice: yang akan segera dinyatakan
  alternative: yang akan dinyatakan
  rationale: Pilihan utama mempertahankan nuansa ekspektasi atau kedekatan dalam μέλλω, tetapi tidak dimaksudkan untuk menyelesaikan perdebatan mengenai waktu penggenapan eskatologis.
- issue: Sifat kesaksian dalam μάρτυς τῶν τοῦ Χριστοῦ παθημάτων
  choice: saksi penderitaan Mesias
  alternative: orang yang memberi kesaksian tentang penderitaan Mesias
  rationale: Teks tidak merinci apakah kesaksian itu terutama berupa pengalaman melihat langsung atau pemberian kesaksian. Rumusan ringkas mempertahankan keluasan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pastoral yang khidmat dan mudah dipahami. Kata ganti jamak 'kalian' dipakai untuk memperjelas bahwa penerimanya jamak. Tanda pisah menata keterangan panjang tentang pembicara, dan titik dua mempertahankan fungsi ayat sebagai pengantar nasihat berikutnya.
