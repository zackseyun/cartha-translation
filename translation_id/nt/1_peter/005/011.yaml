  text: Bagi-Nyalah kuasa untuk selama-lamanya.[a] Amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “sampai kepada zaman-zaman dari zaman-zaman.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτῷ
  choice: Milik Dialah
  rationale: Bentuk datif tunggal ini merujuk kepada Allah dalam konteks sebelumnya. Dalam doksologi bahasa Indonesia, konstruksi kepunyaan ini secara wajar menyampaikan bahwa kuasa adalah milik-Nya.
- source_word: κράτος
  choice: kuasa
  rationale: Dalam doksologi, kata ini menunjuk pada kekuatan berdaulat atau kuasa memerintah. 'Kuasa' alami dalam bahasa Indonesia dan tetap mencakup gagasan kekuasaan yang efektif.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: untuk selama-lamanya
  rationale: Ungkapan idiomatis yang menegaskan durasi tanpa akhir. 'Untuk selama-lamanya' jelas, bermartabat, dan lazim dalam bahasa Indonesia alkitabiah modern.
- source_word: ἀμήν
  choice: Amin
  rationale: Transliterasi konvensional Indonesia mempertahankan fungsi liturgisnya sebagai peneguhan.
theological_decisions:
- issue: Predikat verbal yang tersirat dalam doksologi tanpa verba
  choice: Milik Dialah kuasa
  alternative: Bagi Dialah kuasa; Dialah yang mempunyai kuasa
  rationale: Bahasa Yunani tidak memuat verba. Bentuk 'Milik Dialah kuasa' melengkapinya secara alami dalam bahasa Indonesia sambil mempertahankan corak doksologis dan tidak menentukan verba lebih jauh daripada yang diperlukan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada doksologis. Kapitalisasi pada 'Dia' menandai rujukan kepada Allah sesuai kelaziman penerbitan Alkitab Indonesia.
