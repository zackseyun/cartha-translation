translation:
  language: id
  text: jika memang kamu telah mengecap betapa baiknya Tuhan[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena kamu telah mengecap.” Bahasa Yunani menggunakan bentuk bersyarat yang mungkin mengandaikan bahwa hal itu benar.
    reason: alternative_reading
  - marker: b
    text: “Baik” juga dapat diterjemahkan “baik hati” atau “penuh kemurahan.” Ungkapan ini menggemakan Mazmur 34:8.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: jika memang
  rationale: Mempertahankan bentuk bersyarat Yunani, sedangkan “memang” mengisyaratkan bahwa keadaan itu dipandang sebagai kenyataan yang diharapkan.
- source_word: ἐγεύσασθε
  choice: kamu sudah mengecap
  rationale: Mengecap mempertahankan gambaran harfiah yang selaras dengan citra makanan dalam konteks 2:2–3 dan gema Mazmur 34:8; “sudah” menyatakan pengalaman lampau yang tetap relevan.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi dari apa yang telah dikecap dan mencerminkan susunan Yunani secara alami dalam bahasa Indonesia.
- source_word: χρηστὸς
  choice: baik
  rationale: Mencakup makna luas tentang kebaikan dan mempertahankan gema Mazmur 34:8; “baik hati” atau “penuh kasih karunia” akan mempersempit nuansanya.
- source_word: κύριος
  choice: Tuhan
  rationale: Padanan baku bagi κύριος yang menjaga bobot gelar tersebut sekaligus gema Mazmur, tanpa menjelaskan referennya secara berlebihan.
theological_decisions:
- issue: Daya klausa bersyarat εἰ
  choice: 'Mempertahankan syarat nyata: “jika memang kamu sudah mengecap”'
  alternative: “karena kamu sudah mengecap” atau “sebab kamu sudah mengecap”
  rationale: Klausa ini mungkin mengandaikan bahwa para pembaca sungguh telah mengalaminya, tetapi bahasa Yunani tetap memakai bentuk bersyarat. Terjemahan utama menjaga bentuk retoris dan ketegangannya.
- issue: Referen “Tuhan”
  choice: Menerjemahkan hanya sebagai “Tuhan”
  alternative: “Tuhan, yaitu Kristus”
  rationale: Dalam konteks 1 Petrus referennya berkaitan erat dengan Yesus, tetapi ungkapan ini juga menggemakan Mazmur 34:8. Tidak menambahkan penjelasan menjaga kedua hubungan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Mengecap” dipilih alih-alih “merasakan” untuk menjaga metafora indrawi dan kaitannya dengan gambaran makanan dalam konteks. Pronomina “kamu” mengikuti sapaan jamak yang tersirat dalam bentuk verba Yunani dan tetap mudah dipahami pembaca umum.
