  text: οἵ ποτε οὐ λαὸς νῦν δὲ λαὸς θεοῦ, οἱ οὐκ ἠλεημένοι νῦν δὲ ἐλεηθέντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/010.yaml
  text: you who once were not a people[a], but now are God's people; you who had not received mercy[b], but now have received mercy.
translation:
  language: id
  text: kalian yang dahulu bukan suatu umat[a], tetapi sekarang adalah umat Allah; kalian yang dahulu tidak menerima belas kasihan[b], tetapi sekarang telah menerima belas kasihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Petrus menggemakan Hosea 1:9-10; 2:23 dan menerapkan bahasa tentang pemulihan Israel pada identitas para pembacanya sekarang sebagai umat Allah.
    reason: cross_reference
  - marker: b
    text: 'Atau: “kalian yang dahulu tidak dikasihani, tetapi sekarang telah dikasihani.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ
  choice: kalian yang
  rationale: Kata ganti relatif jamak ini mengacu kembali kepada para pembaca pada ayat sebelumnya. “Kalian yang” menyatakan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: ποτε
  choice: dahulu
  rationale: Menandai keadaan lampau yang dikontraskan dengan νῦν, “sekarang”.
- source_word: λαὸς
  choice: suatu umat / umat Allah
  rationale: λαός menunjuk pada satu komunitas atau umat, khususnya dalam bahasa perjanjian. “Suatu umat” mempertahankan bentuk ungkapan pertama tanpa menambahkan “Allah,” sedangkan λαὸς θεοῦ diterjemahkan alami sebagai “umat Allah”.
- source_word: θεοῦ
  choice: Allah
  rationale: Genitif ini menyatakan kepunyaan atau hubungan; “umat Allah” merupakan ungkapan Indonesia yang alami dan mempertahankan nuansa perjanjian.
- source_word: οὐκ ἠλεημένοι
  choice: tidak menerima belas kasihan
  rationale: Partisipel perfektif pasif menggambarkan keadaan mereka yang sebelumnya bukan penerima belas kasihan. Ungkapan ini jelas dan alami, sementara alternatif pasif dicatat dalam catatan kaki.
- source_word: ἐλεηθέντες
  choice: telah menerima belas kasihan
  rationale: Partisipel aoris pasif menyatakan tindakan belas kasihan Allah yang menghasilkan keadaan mereka sekarang. “Telah menerima” menonjolkan hasil kini tanpa mengaburkan tindakan ilahi.
- source_word: δὲ
  choice: tetapi
  rationale: Dalam kedua bagian, δέ menandai kontras dan pembalikan dari keadaan dahulu kepada keadaan sekarang.
- source_word: νῦν
  choice: sekarang
  rationale: Menandai status para pembaca pada masa kini, berlawanan dengan keadaan mereka dahulu.
theological_decisions:
- issue: Gema Hosea dan bahasa identitas umat perjanjian
  choice: Mempertahankan perbedaan antara “bukan suatu umat” dan “umat Allah.”
  alternative: Menerjemahkan bagian pertama secara lebih interpretatif sebagai “bukan umat Allah.”
  rationale: Teks Yunani pertama-tama mengatakan “bukan suatu umat,” bukan secara eksplisit “bukan umat Allah,” lalu mengatakan “sekarang umat Allah.” Pilihan ini mempertahankan pembalikan identitas komunal dan gema Hosea tanpa mempersempitnya menjadi klaim etnis atau denominasi tertentu.
- issue: Pelaku pemberian belas kasihan
  choice: Menggunakan bentuk penerima, “menerima belas kasihan,” sambil membiarkan Allah sebagai pelaku tersirat oleh konteks.
  alternative: Menggunakan bentuk pasif, “tidak dikasihani ... telah dikasihani.”
  rationale: Bentuk Yunani bersifat pasif dan mengisyaratkan Allah sebagai pelaku. Terjemahan utama lebih alami dalam bahasa Indonesia, sedangkan catatan kaki menyediakan bentuk pasif yang lebih dekat dengan struktur sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menyatakan sapaan jamak secara jelas; “suatu umat” mempertahankan sifat komunal ungkapan Yunani dan perbedaannya dari “umat Allah.”
