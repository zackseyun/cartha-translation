  naturalness: Susunan gelar kolektif—“umat pilihan, imamat rajani, bangsa yang kudus”—alami dalam register Alkitab bahasa Indonesia modern. Revisi memakai “keunggulan-keunggulan Allah” agar relasi genitif dan anteseden partisipel jelas, tanpa tanda pisah yang membuat frasa terakhir tampak sebagai tambahan yang kurang lancar.
  terminology: “Imamat rajani,” “bangsa yang kudus,” dan “umat kepunyaan Allah” tepat dan mapan. “Keunggulan-keunggulan Allah” mempertahankan cakupan ἀρετάς lebih baik daripada “perbuatan-perbuatan agung”; alternatif yang menekankan pujian atau perbuatan besar tetap dicatat dalam catatan kaki.
