  text: Ὑμεῖς δὲ γένος ἐκλεκτόν, βασίλειον ἱεράτευμα, ἔθνος ἅγιον, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/009.yaml
  text: But you are a chosen people[a], a royal priesthood, a holy nation, a people for his own possession[b], so that you may proclaim the excellencies of the one who called you out of darkness into his marvelous light.
translation:
  language: id
  text: Namun, kamu adalah umat pilihan[a], imamat rajani, bangsa yang kudus, umat kepunyaan Allah, supaya kamu memberitakan keunggulan-keunggulan Allah yang telah memanggil kamu keluar dari kegelapan ke dalam terang-Nya yang menakjubkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kaum pilihan” atau “keturunan pilihan.” Kata Yunani ini dapat menunjuk pada keturunan, kaum, atau bangsa; “umat” dipakai di sini untuk mempertahankan makna kolektif tanpa menyiratkan kategori ras modern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δὲ
  choice: Namun, kamu
  rationale: δὲ menandai pertentangan dengan orang-orang yang tidak percaya dalam konteks sebelumnya, sedangkan Ὑμεῖς memberi penekanan pada para pembaca. 'Namun, kamu' menyampaikan keduanya secara wajar.
- source_word: γένος ἐκλεκτόν
  choice: umat pilihan
  rationale: γένος dapat berarti keturunan, kaum, atau bangsa. 'Umat' mempertahankan makna kolektif dan gema perjanjian tanpa menimbulkan kesan kategori ras modern.
- source_word: βασίλειον ἱεράτευμα
  choice: imamat rajani
  rationale: Ungkapan padat ini mempertahankan baik dimensi kerajaan maupun keimaman serta gemanya dengan Keluaran 19:6 LXX.
- source_word: ἔθνος ἅγιον
  choice: bangsa yang kudus
  rationale: Terjemahan langsung yang mempertahankan makna dikhususkan bagi Allah dan bentuk gelar kolektifnya.
- source_word: λαὸς εἰς περιποίησιν
  choice: umat kepunyaan Allah
  rationale: περιποίησις menyatakan kepemilikan khusus. Penyebutan 'Allah' memperjelas pemilik yang tersirat dalam konteks tanpa menambahkan klaim asing.
- source_word: ὅπως
  choice: supaya
  rationale: Menyampaikan hubungan tujuan secara alami dalam bahasa Indonesia.
- source_word: τὰς ἀρετὰς
  choice: segala perbuatan-Nya yang agung
  rationale: Dalam konteks ini ἀρεταί mencakup keunggulan Allah yang layak diberitakan dan dapat menunjuk pada tindakan-tindakan-Nya yang besar. Pilihan ini alami dalam bahasa Indonesia; keluasan leksikalnya dicatat dalam catatan kaki.
- source_word: ἐξαγγείλητε
  choice: kamu memberitakan
  rationale: Kata ini menyatakan pengumuman atau pemberitaan secara terbuka; 'memberitakan' sesuai dengan tujuan yang diperkenalkan oleh ὅπως.
- source_word: τοῦ ... καλέσαντος
  choice: Dia yang telah memanggil
  rationale: Konstruksi partisipel genitif mengidentifikasi Allah melalui tindakan-Nya. 'Dia' tetap personal tanpa mengulang nama Allah.
- source_word: ἐκ σκότους ... εἰς τὸ θαυμαστὸν αὐτοῦ φῶς
  choice: keluar dari kegelapan menuju terang-Nya yang menakjubkan
  rationale: Mempertahankan gerak dari satu ranah ke ranah lain dan metafora kontras kegelapan-terang. 'Menakjubkan' menyampaikan θαυμαστός dalam bahasa Indonesia modern dan bermartabat.
theological_decisions:
- issue: Gelar-gelar identitas kolektif yang berasal dari bahasa perjanjian Israel
  choice: 'Mempertahankan sebutan kolektif secara langsung: ''umat pilihan'', ''imamat rajani'', dan ''bangsa yang kudus''.'
  alternative: Mengabstrakkan atau memperlemah sebutan-sebutan itu agar tidak menimbulkan implikasi teologis tertentu.
  rationale: Ayat ini dengan sengaja menerapkan bahasa identitas perjanjian kepada para pembaca Petrus. Terjemahan mempertahankan ketegangan intertekstual itu tanpa menetapkan suatu sistem teologis di luar teks.
- issue: Pemilik yang tersirat dalam λαὸς εἰς περιποίησιν
  choice: 'Menjadikan Allah sebagai pemilik yang tersirat: ''umat kepunyaan Allah''.'
  alternative: Menerjemahkan secara harfiah dan janggal sebagai 'umat untuk kepemilikan' atau memakai 'umat kepunyaan-Nya'.
  rationale: Konteks menunjuk kepada Allah, tetapi anteseden pronomina berpotensi kurang jelas dalam bahasa Indonesia. Penyebutan 'Allah' merupakan penjelasan kontekstual, bukan tambahan doktrinal.
- issue: Cakupan makna τὰς ἀρετὰς
  choice: Memakai 'segala perbuatan-Nya yang agung' dalam teks dan mencatat alternatif yang berfokus pada sifat-sifat terpuji.
  alternative: Memakai 'keunggulan-keunggulan-Nya', 'sifat-sifat-Nya yang terpuji', atau 'puji-pujian bagi-Nya'.
  rationale: Istilah Yunani dapat menunjuk pada keunggulan atau sifat terpuji dan, dalam konteks pemberitaan karya Allah, pada tindakan-Nya yang agung. Catatan kaki mempertahankan ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur tetapi mudah dipahami. Istilah 'imamat rajani' dipertahankan karena ringkas, mapan, dan mencerminkan bentuk nominal Yunani. Tanda pisah membantu memperjelas bahwa 'Dia yang telah memanggil' merujuk kepada Allah sebagai pihak yang sifat dan karya-Nya diberitakan.
