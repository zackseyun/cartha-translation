reference: 1 Peter 2:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ ⸀μώλωπι ἰάθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/024.yaml
  text: He himself bore our sins in his body on the tree[a], so that, having died to sins, we might live to righteousness[c][b]. By his wound you were healed.
translation:
  language: id
  text: Dia sendiri menanggung dosa-dosa kita dalam tubuh-Nya pada kayu[a], supaya kita, yang telah mati terhadap dosa-dosa, hidup untuk kebenaran. Oleh luka-Nya[b] kamu telah disembuhkan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada salib” atau “pada kayu salib”; secara harfiah, bahasa Yunani memakai kata “kayu”, yang kemungkinan menggemakan Ulangan 21:23.
    reason: alternative_reading
  - marker: b
    text: Atau “bilur-Nya” atau “memar-Nya”; kata benda tunggal ini menggemakan Yesaya 53:5.
    reason: lexical_alternative
  - marker: c
    text: Kesembuhan di sini dinyatakan secara luas. Dalam konteksnya, kesembuhan itu berkaitan dengan dosa dan kebenaran, tanpa membatasi maknanya hanya pada kesembuhan jasmani atau hanya pada kesembuhan rohani.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνήνεγκεν
  choice: menanggung
  rationale: Kata ἀναφέρω dapat berarti membawa, mempersembahkan, atau menanggung. Dalam konteks ini, dengan “dosa-dosa kita” sebagai objek serta gema Yesaya 53, “menanggung” mempertahankan cakupan makna tanpa menjadikannya istilah teknis korban secara berlebihan.
- source_word: ἐν τῷ σώματι αὐτοῦ
  choice: dalam tubuh-Nya
  rationale: Terjemahan langsung ini mempertahankan sifat penderitaan Kristus yang konkret dan jasmani. Penekanan pada pribadi-Nya sudah disampaikan oleh αὐτός sebagai “Dia sendiri”.
- source_word: ἐπὶ τὸ ξύλον
  choice: di atas kayu
  rationale: ξύλον berarti kayu atau pohon. “Di atas kayu” mempertahankan ungkapan sumber dan kemungkinan gemanya terhadap Ulangan 21:23, tanpa menggantinya dalam teks utama dengan istilah yang lebih interpretatif, “salib”.
- source_word: ταῖς ἁμαρτίαις ἀπογενόμενοι
  choice: yang telah mati terhadap dosa-dosa
  rationale: ἀπογίνομαι menyatakan perpisahan atau pemutusan yang tegas. “Mati terhadap dosa-dosa” mengungkapkan daya metaforis itu secara wajar dan mempertahankan bentuk jamak ἁμαρτίαις.
- source_word: τῇ δικαιοσύνῃ
  choice: untuk kebenaran
  rationale: Datif setelah ζήσωμεν menyatakan arah atau tujuan hidup. “Hidup untuk kebenaran” alami dalam bahasa Indonesia dan di sini menunjuk pada kehidupan yang benar, tanpa mempersempit δικαιοσύνη menjadi sekadar keadilan sosial atau status hukum.
- source_word: μώλωπι
  choice: luka
  rationale: μώλωψ adalah luka atau memar akibat pukulan. “Luka” merupakan padanan modern yang jelas serta mempertahankan bentuk tunggal kolektif dan gema Yesaya 53:5.
- source_word: ἰάθητε
  choice: kamu telah disembuhkan
  rationale: Bentuk aoristus pasif diterjemahkan secara langsung. “Disembuhkan” mempertahankan keluasan metafora tanpa membatasinya hanya pada kesembuhan jasmani atau hanya pada pemulihan rohani.
- source_word: αὐτὸς
  choice: Dia sendiri
  rationale: Kata ganti intensif ini menekankan bahwa Kristus sendirilah yang melakukan tindakan tersebut; “Dia sendiri” menyampaikan penekanan itu dengan jelas dan alami.
theological_decisions:
- issue: Cakupan kesembuhan dalam klausa terakhir
  choice: Mempertahankan “kamu telah disembuhkan” tanpa menentukan kesembuhan jasmani saja atau rohani saja.
  alternative: Menafsirkannya secara eksplisit sebagai kesembuhan jasmani; atau secara eksklusif sebagai pemulihan rohani dari dosa.
  rationale: Konteks langsung berbicara tentang dosa, kebenaran, dan penderitaan Kristus, sehingga pemulihan dari dosa jelas termasuk di dalamnya. Namun, teks tidak membatasi sendiri cakupan metafora tersebut; terjemahan mempertahankan keluasan dan ketegangan teologisnya.
- issue: Pemaknaan ξύλον
  choice: Menggunakan “kayu” dalam teks utama.
  alternative: “Salib” atau “kayu salib.”
  rationale: Ayat ini jelas merujuk pada penyaliban Yesus, tetapi teks Yunani memakai ξύλον, bukan σταυρός. “Kayu” menjaga pilihan kata sumber dan kemungkinan gema Kitab Suci, sedangkan hubungan dengan salib dijelaskan dalam catatan kaki.
- issue: Arti δικαιοσύνη dalam tujuan hidup
  choice: Menggunakan “kebenaran” dengan nuansa kehidupan yang benar.
  alternative: “Keadilan” atau penjelasan eksplisit tentang status benar di hadapan Allah.
  rationale: Konteks etis mendukung kehidupan yang diarahkan kepada apa yang benar, tetapi terjemahan tidak menutup dimensi teologis δικαιοσύνη dengan uraian doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Bentuk “tubuh-Nya” dan “luka-Nya” mempertahankan rujukan yang jelas kepada Kristus. Ungkapan “di atas kayu” sengaja mempertahankan kekhasan sumber Yunani; catatan kaki membantu pembaca mengenali rujukannya kepada salib.
