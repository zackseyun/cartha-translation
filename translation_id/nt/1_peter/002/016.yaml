source:
  edition: SBLGNT
  text: ὡς ἐλεύθεροι, καὶ μὴ ὡς ἐπικάλυμμα ἔχοντες τῆς κακίας τὴν ἐλευθερίαν, ἀλλ’ ὡς ⸂θεοῦ δοῦλοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/016.yaml
  text: as free people[a], and not using freedom as a cover for evil, but as servants of God.
translation:
  language: id
  text: sebagai orang-orang merdeka, dan bukan sebagai orang-orang yang menjadikan kemerdekaan sebagai kedok kejahatan, melainkan sebagai budak-budak Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba-hamba Allah.”
    reason: Alternatif ini lebih lazim dalam bahasa gerejawi Indonesia, tetapi dapat memperlunak kontras antara orang merdeka dan δοῦλοι dalam teks Yunani.
lexical_decisions:
- source_word: ἐλεύθεροι
  choice: orang-orang merdeka
  rationale: Menunjukkan orang-orang yang berstatus bebas secara kolektif dan mempertahankan kontras langsung dengan δοῦλοι tanpa membatasi rujukannya pada laki-laki.
- source_word: ἐπικάλυμμα
  choice: kedok
  rationale: Mempertahankan gambaran sesuatu yang menutupi atau menyembunyikan kejahatan, sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: ἔχοντες ... τὴν ἐλευθερίαν
  choice: menjadikan kemerdekaan
  rationale: Mengungkapkan secara idiomatis gagasan 'memiliki kemerdekaan sebagai kedok', yaitu memperlakukan atau memakai kemerdekaan untuk fungsi tersebut.
- source_word: κακίας
  choice: kejahatan
  rationale: Menyampaikan arti keburukan moral secara luas; 'kedengkian' akan terlalu mempersempit maknanya dalam konteks ini.
- source_word: θεοῦ δοῦλοι
  choice: budak-budak Allah
  rationale: Mempertahankan kekuatan δοῦλοι dan paradoks antara kemerdekaan dengan kepemilikan serta ketundukan penuh kepada Allah. Bentuk jamak mengikuti rujukan kolektif teks Yunani.
theological_decisions:
- issue: Penerjemahan δοῦλοι sebagai identitas umat Allah
  choice: budak-budak Allah
  alternative: hamba-hamba Allah
  rationale: Konteks sengaja mempertentangkan orang merdeka dengan mereka yang sepenuhnya menjadi milik Allah. 'Budak-budak' menjaga ketegangan retoris dan bobot relasi kepemilikan itu, sedangkan 'hamba-hamba' dapat terdengar lebih lunak dan lebih dekat pada pelayan sukarela. Alternatif yang lazim dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'orang-orang' mempertahankan struktur perbandingan ὡς ... μὴ ὡς ... ἀλλ’ ὡς, sedangkan 'tetapi ... melainkan' menyatakan pertentangan secara alami.
