  yaml_path: translation/nt/1_peter/002/019.yaml
  text: 'For this is grace: if someone endures sorrows while suffering unjustly because of consciousness of God[a][b][c].'
translation:
  language: id
  text: 'Sebab inilah kasih karunia[b]: jika seseorang, karena kesadaran akan Allah[a], menanggung kesukaran sambil menderita secara tidak adil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena hati nuraninya terhadap Allah” atau “karena ia mengingat Allah.”
    reason: lexical_alternative
  - marker: b
    text: “Kasih karunia” di sini juga dapat dipahami sebagai sesuatu yang berkenan atau patut dipuji.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γὰρ
  choice: Sebab, inilah
  rationale: Menjaga fungsi γάρ sebagai penghubung penjelas dan τοῦτο sebagai penunjuk kepada keadaan yang kemudian diuraikan.
- source_word: χάρις
  choice: kasih karunia
  rationale: Mempertahankan padanan utama istilah χάρις dan kaitan leksikalnya dalam Perjanjian Baru, sambil membiarkan konteks menyampaikan nuansa sesuatu yang berkenan atau patut dipuji.
- source_word: διὰ συνείδησιν θεοῦ
  choice: karena kesadarannya akan Allah
  rationale: Menyampaikan motif yang diarahkan kepada Allah serta mempertahankan cakupan συνείδησις sebagai kesadaran maupun hati nurani; frasa alternatif dicatat dalam catatan kaki.
- source_word: ὑποφέρει
  choice: menanggung
  rationale: Secara alami menyatakan ketabahan memikul keadaan berat tanpa menambahkan gagasan yang tidak tersurat.
- source_word: λύπας
  choice: dukacita
  rationale: Mencakup kesusahan batin dan pengalaman menyakitkan yang dinyatakan oleh bentuk jamak λύπας.
- source_word: πάσχων ἀδίκως
  choice: dengan menderita secara tidak adil
  rationale: Mempertahankan hubungan partisipial sebagai keadaan atau cara seseorang menanggung dukacita, tanpa mengubahnya menjadi klausa sebab.
- source_word: τις
  choice: seseorang
  rationale: Padanan netral dan alami bagi kata ganti tak tentu tunggal.
theological_decisions:
- issue: Makna χάρις dalam konteks
  choice: kasih karunia
  alternative: sesuatu yang patut dipuji; sesuatu yang berkenan; mendapat perkenanan
  rationale: Teks Yunani hanya menyatakan τοῦτο ... χάρις dan tidak secara eksplisit menambahkan 'di hadapan Allah' dalam ayat ini. Padanan utama mempertahankan ketegangan antara makna kasih karunia dan penilaian positif.
- issue: Makna συνείδησις θεοῦ
  choice: kesadarannya akan Allah
  alternative: hati nurani terhadap Allah; karena mengingat Allah
  rationale: Genitif θεοῦ paling wajar dipahami sebagai sasaran atau acuan kesadaran. Pilihan ini tidak mempersempit συνείδησις menjadi hati nurani moral saja, tetapi alternatif itu tetap diberi ruang dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan frasa sebab ditempatkan sebelum verba utama agar jelas bahwa kesadaran akan Allah merupakan alasan seseorang menanggung dukacita, bukan alasan ia diperlakukan tidak adil.
