id: 1PE.2.12
reference: 1 Peter 2:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὴν ἀναστροφὴν ὑμῶν ⸂ἐν τοῖς ἔθνεσιν ἔχοντες καλήν⸃, ἵνα, ἐν ᾧ καταλαλοῦσιν ὑμῶν ὡς κακοποιῶν, ἐκ τῶν καλῶν ἔργων ⸀ἐποπτεύοντες δοξάσωσι τὸν θεὸν ἐν ἡμέρᾳ ἐπισκοπῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/012.yaml
  text: Keep your conduct among the Gentiles honorable, so that, in what they slander you as evildoers, by observing your good works they may glorify God on the day of visitation.
translation:
  language: id
  text: Jagalah agar cara hidup kalian di tengah bangsa-bangsa lain tetap baik, supaya, dalam hal mereka memfitnah kalian sebagai pelaku kejahatan[a], dengan menyaksikan perbuatan-perbuatan kalian yang baik, mereka memuliakan Allah pada hari Ia melawat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ungkapan Yunani dapat juga dipahami: “meskipun mereka memfitnah kalian” atau “ketika mereka memfitnah kalian.”'
    reason: Konstruksi ἐν ᾧ memiliki beberapa kemungkinan hubungan sintaksis yang wajar dan tidak boleh diselesaikan secara dogmatis dalam teks utama.
  - marker: b
    text: “Melawat” dapat menunjuk kepada kedatangan Allah untuk menyelamatkan ataupun untuk menghakimi.
    reason: Mempertahankan rentang makna ἐπισκοπή dan ketegangan teologis dalam ungkapan “hari lawatan.”
lexical_decisions:
- source_word: ἀναστροφή
  choice: cara hidup
  rationale: Mencakup keseluruhan perilaku atau pola hidup, bukan hanya tindakan tertentu.
- source_word: ἔθνη
  choice: bangsa-bangsa lain
  rationale: Mempertahankan cakupan istilah Yunani tanpa menambahkan tafsiran bahwa semua yang dimaksud tidak mengenal Allah; dalam konteks ini istilah tersebut menunjuk kepada lingkungan non-Yahudi di sekitar para pembaca.
- source_word: καλήν / καλῶν
  choice: baik / yang baik
  rationale: Menerjemahkan pengulangan akar kata yang sama dan mempertahankan kaitan antara cara hidup yang baik dan perbuatan-perbuatan yang baik.
- source_word: καταλαλοῦσιν
  choice: memfitnah
  rationale: Mengungkapkan tindakan berbicara buruk atau melontarkan tuduhan yang merugikan terhadap orang lain.
- source_word: ἐποπτεύοντες
  choice: menyaksikan
  rationale: Menunjukkan pengamatan langsung dan saksama terhadap perbuatan para percaya.
- source_word: ἐπισκοπῆς
  choice: melawat
  rationale: Kata ini menyatakan tindakan Allah mendatangi atau memperhatikan manusia, dengan kemungkinan nuansa penyelamatan maupun penghakiman yang ditentukan oleh konteks.
theological_decisions:
- issue: Makna ἐν ᾧ sebelum καταλαλοῦσιν
  choice: dalam hal mereka memfitnah kalian
  alternative: meskipun mereka memfitnah kalian; ketika mereka memfitnah kalian
  rationale: Terjemahan utama mempertahankan konstruksi relasional yang harfiah dan tidak secara diam-diam mengubahnya menjadi konsesif atau temporal.
- issue: Makna hari pelawatan Allah
  choice: pada hari Ia melawat
  alternative: pada hari pemeriksaan; pada hari kedatangan-Nya
  rationale: Pilihan ini mempertahankan keterbukaan istilah terhadap lawatan Allah yang dapat bermakna kemurahan, penyelamatan, pemeriksaan, atau penghakiman, tanpa menetapkan satu skenario eskatologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak “kalian” membuat bentuk orang kedua jamak dalam bahasa Yunani terlihat jelas. Kalimat dipecah menjadi dua agar hubungan tujuan dan hasil mudah dipahami tanpa menghilangkan struktur pemikiran ayat.
