  source_fidelity: Teks ini dengan baik mempertahankan sapaan jamak yang tegas, perbandingan dengan batu hidup, bentuk pasif progresif, metafora rumah rohani, korban rohani, dan perantaraan melalui Yesus Sang Mesias. Namun, “menuju suatu imamat yang kudus” memberi kesan arah spasial atau perjalanan menuju imamat, yang bukan cara paling wajar maupun paling tepat untuk menyatakan εἰς sebagai tujuan/hasil dalam konstruksi ini.
  naturalness: Bahasa umumnya baku dan bernada sesuai. “Sedang dibangun menjadi rumah rohani, untuk menjadi imamat yang kudus” lebih idiomatis daripada “dibangun menjadi rumah rohani menuju suatu imamat yang kudus.” Artikel tak tentu “suatu” juga tidak diperlukan dan membuat “imamat” kurang alami dalam bahasa Indonesia.
  terminology: “Rumah rohani,” “imamat yang kudus,” “kurban rohani,” “Allah,” dan “Yesus Sang Mesias” merupakan padanan yang baik. “Kurban” mempertahankan citra korban/persembahan kultis dalam θυσίας; bentuk jamak dipertahankan sebagai “kurban-kurban.”
