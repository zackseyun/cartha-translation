base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/005.yaml
  text: you yourselves also[a], as living stones, are being built up as a spiritual house into a holy priesthood[d][c][b], to offer spiritual sacrifices acceptable to God through Jesus the Messiah.
translation:
  language: id
  text: Kalian sendiri juga, seperti batu-batu yang hidup,[a] sedang dibangun menjadi rumah rohani, untuk menjadi imamat yang kudus,[b] untuk mempersembahkan kurban-kurban rohani yang berkenan kepada Allah melalui Yesus Sang Mesias.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebagai batu-batu yang hidup.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “menjadi imamat yang kudus” atau “bagi imamat yang kudus”; kata depan Yunani dapat menyatakan tujuan atau hasil.
    reason: alternative_reading
  - marker: c
    text: 'Yunani: “Yesus Kristus”; di sini Χριστός diterjemahkan sebagai gelar, “Sang Mesias.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: kalian sendiri juga
  rationale: Menunjukkan bahwa sapaan ini berbentuk jamak, mempertahankan penekanan αὐτοὶ, dan mengungkapkan daya tambah καί yang menghubungkan para pembaca dengan Batu Hidup pada konteks sebelumnya.
- source_word: ὡς λίθοι ζῶντες
  choice: seperti batu-batu yang hidup
  rationale: Mempertahankan perbandingan ὡς dan gema gambaran 'batu yang hidup' dari ayat sebelumnya. Bentuk ulang 'batu-batu' menyatakan jamak secara jelas dalam bahasa Indonesia.
- source_word: οἰκοδομεῖσθε
  choice: sedang dibangun
  rationale: Mempertahankan bentuk pasif dan tindakan yang sedang berlangsung tanpa menambahkan pelaku yang tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: οἶκος πνευματικὸς
  choice: rumah rohani
  rationale: Padanan langsung dan wajar yang mempertahankan metafora bangunan serta tidak mempersempit arti πνευματικός.
- source_word: εἰς ἱεράτευμα ἅγιον
  choice: menuju suatu imamat yang kudus
  rationale: Kata 'menuju' mempertahankan arah, tujuan, atau hasil yang dapat dinyatakan εἰς. 'Imamat' menunjuk pada suatu tubuh keimaman, bukan hanya beberapa imam secara individual.
- source_word: ἀνενέγκαι
  choice: untuk mempersembahkan
  rationale: Dalam konteks kurban, ἀναφέρω berarti mempersembahkan atau mempersembahkan naik; pilihan ini alami dalam bahasa Indonesia dan mempertahankan tujuan infinitif tersebut.
- source_word: πνευματικὰς θυσίας
  choice: kurban-kurban rohani
  rationale: Mempertahankan gambaran peribadatan dan bentuk jamak tanpa menjelaskan jenis kurban rohani melampaui teks.
- source_word: εὐπροσδέκτους θεῷ
  choice: yang berkenan kepada Allah
  rationale: Ungkapan Indonesia yang alami untuk sesuatu yang diterima dengan baik oleh Allah dalam konteks persembahan.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: melalui Yesus Sang Mesias
  rationale: διά dengan genitif menyatakan perantaraan atau sarana. 'Sang Mesias' menerjemahkan Χριστός sebagai gelar dan terdengar idiomatis serta bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan εἰς ἱεράτευμα ἅγιον dengan οἶκος πνευματικός
  choice: menuju suatu imamat yang kudus
  alternative: untuk menjadi suatu imamat yang kudus; bagi suatu imamat yang kudus
  rationale: εἰς dapat menandai tujuan atau hasil. Teks utama menjaga gerak metaforis tanpa menetapkan secara tegas apakah frasa itu terutama menyatakan tujuan atau hasil; alternatif dicatat dalam catatan kaki.
- issue: Suara dan pelaku οἰκοδομεῖσθε
  choice: bentuk pasif 'sedang dibangun' tanpa menyebut pelaku
  alternative: bangunlah diri kalian; kalian membangun diri
  rationale: Bentuk Yunani paling wajar dipahami sebagai pasif dalam konteks ini. Tidak menyebut pelaku mempertahankan bentuk teks dan menghindari penambahan penafsiran eksplisit.
- issue: Fungsi Χριστοῦ
  choice: Sang Mesias
  alternative: Kristus
  rationale: Χριστός di sini melekat pada nama Yesus sebagai gelar. Menerjemahkan makna gelar mempertahankan unsur mesianiknya, sementara alternatif tradisional dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. 'Kalian' dipakai untuk memperjelas sapaan jamak; 'kurban' mengikuti ejaan baku untuk persembahan religius. Susunan metaforis dipertahankan sedekat mungkin, sementara catatan kaki menjaga alternatif yang sungguh terdapat dalam bahasa sumber.
