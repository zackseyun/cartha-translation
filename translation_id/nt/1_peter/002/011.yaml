  text: Ἀγαπητοί, παρακαλῶ ὡς παροίκους καὶ παρεπιδήμους ἀπέχεσθαι τῶν σαρκικῶν ἐπιθυμιῶν, αἵτινες στρατεύονται κατὰ τῆς ψυχῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/011.yaml
  text: Beloved[a], I urge you as sojourners and exiles to abstain from fleshly desires[c][b], which wage war against the soul.
translation:
  language: id
  text: Saudara-saudara yang terkasih, saya mendesak kalian, sebagai pendatang dan perantau[a], agar menjauhkan diri dari keinginan-keinginan kedagingan[b], yang berperang melawan jiwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang asing dan penduduk sementara.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih interpretatif, “keinginan-keinginan berdosa.” Ungkapan ini tidak terbatas pada hasrat seksual.
    reason: lexical_alternative
  - marker: c
    text: Atau “hidup” atau “diri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Saudara-saudara yang terkasih
  rationale: Sapaan ini menyampaikan kasih yang hangat kepada komunitas pembaca dalam bahasa Indonesia yang alami dan bermartabat.
- source_word: παρακαλῶ
  choice: saya mendesak
  rationale: Dalam konteks ini kata tersebut menyatakan ajakan yang sungguh-sungguh dan kuat, bukan sekadar permintaan biasa.
- source_word: ὡς
  choice: sebagai
  rationale: Mempertahankan cara atau kedudukan pembaca yang dinyatakan langsung oleh teks tanpa menambahkan hubungan sebab-akibat.
- source_word: παροίκους καὶ παρεπιδήμους
  choice: pendatang dan orang asing
  rationale: Pasangan istilah ini menggambarkan orang yang tinggal bukan di tanah asalnya dan tidak sepenuhnya menjadi bagian tetap dari tempat tinggalnya; dua istilah dipertahankan untuk menjaga penekanannya.
- source_word: ἀπέχεσθαι
  choice: agar menjauhkan diri
  rationale: Mengungkapkan tindakan berkelanjutan untuk menahan diri dan tetap jauh dari sesuatu, dengan bahasa Indonesia yang wajar.
- source_word: σαρκικῶν ἐπιθυμιῶν
  choice: keinginan-keinginan daging
  rationale: Mempertahankan metafora dan hubungan leksikal dengan σάρξ tanpa langsung menafsirkannya sebagai sekadar keinginan seksual atau menggantinya dengan parafrasa doktrinal.
- source_word: αἵτινες
  choice: yang
  rationale: Menghubungkan klausa penjelas secara alami dengan keinginan-keinginan yang baru disebutkan.
- source_word: στρατεύονται
  choice: berperang
  rationale: Mempertahankan gambaran militer tentang permusuhan aktif.
- source_word: κατὰ τῆς ψυχῆς
  choice: melawan jiwa
  rationale: Mempertahankan bobot antropologis ψυχή serta ketaksaan antara jiwa, hidup, dan diri tanpa menambahkan kata ganti yang tidak eksplisit.
theological_decisions:
- issue: Makna σαρκικῶν dalam konteks moral
  choice: daging
  alternative: berdosa; yang berasal dari tabiat berdosa
  rationale: Terjemahan ini mempertahankan metafora sumber dan ketegangan teologisnya tanpa memasukkan tafsiran tentang 'tabiat berdosa' ke dalam teks utama.
- issue: Makna ψυχή
  choice: jiwa
  alternative: hidup; diri
  rationale: Pilihan ini mempertahankan istilah yang luas dan berbobot dalam teks, tanpa memaksakan dikotomi teknis antara tubuh dan jiwa.
- issue: Status pembaca sebagai παροίκους καὶ παρεπιδήμους
  choice: pendatang dan orang asing
  alternative: orang asing dan penduduk sementara; perantau dan pendatang
  rationale: Pasangan ini menjaga gambaran keterasingan dan ketidaktetapan pembaca, sambil tidak menentukan apakah penekanannya semata-mata sosial, harfiah, atau teologis.
translation_notes:
  register: Bahasa Indonesia modern, komunikatif, dan bermartabat. Bentuk jamak “kalian” dipakai agar sasaran nasihat kepada komunitas tetap jelas. Metafora “daging,” “berperang,” dan “jiwa” dipertahankan; catatan kaki menjelaskan alternatif tanpa menyelesaikan ketaksaan asli secara berlebihan.
