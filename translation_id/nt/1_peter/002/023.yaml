base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/023.yaml
  text: who[a], when he was insulted, did not insult in return; when he suffered, he did not threaten[b], but kept entrusting himself to the one who judges justly.
translation:
  language: id
  text: Ketika dihina, ia tidak membalas dengan hinaan; ketika menderita, ia tidak mengancam, tetapi terus menyerahkan dirinya kepada Dia yang menghakimi dengan adil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tetapi terus menyerahkan perkaranya kepada Dia yang menghakimi dengan adil.” Bahasa Yunani tidak menyebutkan secara eksplisit apa yang diserahkan.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: λοιδορούμενος
  choice: ketika dihina
  rationale: Partisipel pasif ini menyatakan bahwa ia menerima penghinaan secara verbal; bentuk temporal alami dalam bahasa Indonesia dan sejajar dengan πάσχων.
- source_word: ἀντελοιδόρει
  choice: tidak membalas dengan hinaan
  rationale: Bentuk imperfek dan unsur ἀντί- menyampaikan sikap tidak membalas penghinaan verbal; rumusan ini alami serta mempertahankan daya resiprokalnya.
- source_word: πάσχων
  choice: ketika menderita
  rationale: Partisipel kini dapat dipahami secara temporal dan membentuk kesejajaran dengan klausa sebelumnya.
- source_word: οὐκ ἠπείλει
  choice: ia tidak mengancam
  rationale: Mengungkapkan bahwa ia tidak melontarkan ancaman saat menderita; bentuk lampau Yunani dalam konteks naratif dapat diterjemahkan alami tanpa harus menandai aspek berulang secara eksplisit.
- source_word: παρεδίδου
  choice: terus menyerahkan dirinya
  rationale: Imperfek menunjukkan tindakan atau sikap yang berlangsung. Objek refleksif tidak tertulis dalam bahasa Yunani tetapi tersirat oleh konteks dan diperlukan agar maknanya jelas dalam bahasa Indonesia; catatan kaki mempertahankan kemungkinan bahwa yang diserahkan adalah perkaranya.
- source_word: τῷ κρίνοντι δικαίως
  choice: kepada Dia yang menghakimi dengan adil
  rationale: Mempertahankan bentuk deskriptif partisipel artikular dan fungsi adverbial δικαίως tanpa mengubahnya menjadi gelar eksplisit.
- source_word: δὲ
  choice: tetapi
  rationale: Menandai kontras antara tidak membalas atau mengancam dan tindakan positif menyerahkan diri kepada hakim yang adil.
- source_word: ὃς
  choice: ia
  rationale: Pronomina relatif merujuk kepada Kristus dalam ayat sebelumnya. Karena kutipan ayat berdiri sendiri dalam bahasa Indonesia, 'ia' menghasilkan kalimat yang wajar tanpa mengubah referennya.
theological_decisions:
- issue: Referen 'Dia yang menghakimi dengan adil'
  choice: Referennya dibiarkan tersirat dan diungkapkan secara deskriptif sebagaimana teks Yunani.
  alternative: Menyebut secara eksplisit 'Allah' atau 'Allah Bapa'.
  rationale: Konteks menunjuk kepada Allah, tetapi teks tidak memberikan gelar atau penyebutan pribadi secara eksplisit; terjemahan tidak mempersempit referen melebihi sumber.
- issue: Objek dari παρεδίδου
  choice: Menyerahkan dirinya
  alternative: Menyerahkan perkaranya atau menyerahkan mereka yang menyiksanya kepada penghakiman Allah.
  rationale: Bahasa Yunani tidak menyatakan objek secara eksplisit. Konteks penderitaan Kristus paling alami mendukung objek refleksif, tetapi ambiguitas asli tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada “Dia” membantu keterbacaan rujukan ilahi, tetapi tidak menambahkan gelar yang tidak terdapat dalam teks sumber. Kesejajaran dua klausa temporal dan kontras dengan “tetapi” dipertahankan.
