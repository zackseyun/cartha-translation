  text: ὡς ἀρτιγέννητα βρέφη τὸ λογικὸν ἄδολον γάλα ἐπιποθήσατε, ἵνα ἐν αὐτῷ αὐξηθῆτε ⸂εἰς σωτηρίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/002.yaml
  text: Like newborn infants[a], long for the pure, rational milk, so that by it you may grow into salvation,
translation:
  language: id
  text: Seperti bayi yang baru lahir, rindukanlah susu yang murni dan rohani[a], supaya melalui susu itu kamu bertumbuh menuju keselamatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “susu yang murni dan rasional” atau “susu yang murni dan masuk akal.” Kata Yunani yang diterjemahkan “rohani” juga dapat berkaitan dengan akal atau nalar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Seperti
  rationale: Memperkenalkan perbandingan dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἀρτιγέννητα βρέφη
  choice: bayi yang baru lahir
  rationale: Mempertahankan gambaran bayi yang baru saja lahir dengan ungkapan Indonesia yang wajar.
- source_word: τὸ λογικὸν
  choice: rohani
  rationale: Dalam metafora susu, pilihan ini menyampaikan makanan batiniah, bukan susu harfiah; kemungkinan makna 'yang berkenaan dengan akal' tetap dicatat dalam catatan kaki.
- source_word: ἄδολον
  choice: murni
  rationale: Menyatakan susu yang tidak dicampur atau dipalsukan dan selaras dengan konteks sebelumnya tentang tipu daya.
- source_word: γάλα
  choice: susu
  rationale: Mempertahankan metafora utama tentang makanan bagi bayi.
- source_word: ἐπιποθήσατε
  choice: rindukanlah
  rationale: Menyampaikan perintah untuk menginginkan dengan sungguh-sungguh dalam ragam bahasa yang bermartabat.
- source_word: ἵνα
  choice: supaya
  rationale: Mengungkapkan tujuan secara alami dalam bahasa Indonesia.
- source_word: ἐν αὐτῷ
  choice: olehnya
  rationale: Menunjukkan susu tersebut sebagai sarana pertumbuhan, sambil mempertahankan rujukan pronominalnya.
- source_word: αὐξηθῆτε
  choice: kamu bertumbuh
  rationale: Bentuk ini alami dalam bahasa Indonesia; nuansa pasif Yunani tidak perlu dibuat kaku.
- source_word: εἰς σωτηρίαν
  choice: menuju keselamatan
  rationale: Mempertahankan daya arah atau tujuan εἰς tanpa mengubahnya menjadi rumusan doktrinal yang hanya kini atau hanya kelak.
theological_decisions:
- issue: Makna λογικός dalam metafora susu
  choice: rohani
  alternative: yang berkenaan dengan akal; masuk akal
  rationale: Konteks kelahiran baru dan pertumbuhan menunjukkan makanan nonharfiah bagi kehidupan batin. Namun, karena λογικός berkaitan dengan akal atau nalar, alternatif literal dicatat agar ambiguitas penting tidak dihapus.
- issue: Daya arah εἰς σωτηρίαν
  choice: menuju keselamatan
  alternative: untuk keselamatan; sampai pada keselamatan
  rationale: Pilihan ini mempertahankan gerak menuju keselamatan tanpa menetapkan secara sepihak hubungan doktrinal antara pertumbuhan, keselamatan masa kini, dan penyempurnaan keselamatan kelak.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Bentuk tunggal kolektif 'kamu' mengikuti sapaan kepada para pembaca sebagai satu komunitas; metafora bayi dan susu dipertahankan.
