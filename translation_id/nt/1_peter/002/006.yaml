reference: 1 Peter 2:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διότι περιέχει ⸀ἐν γραφῇ· Ἰδοὺ τίθημι ἐν Σιὼν λίθον ⸂ἀκρογωνιαῖον ἐκλεκτὸν⸃ ἔντιμον, καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ μὴ καταισχυνθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/006.yaml
  text: 'For it stands in Scripture: “Behold[a], I lay in Zion a chosen and honored cornerstone[e][d][c][b], and the one who believes in him will certainly not be put to shame.”'
translation:
  language: id
  text: 'Sebab ada tertulis dalam Kitab Suci: “Lihatlah, Aku meletakkan di Sion sebuah batu penjuru yang terpilih dan berharga[a], dan orang yang percaya kepada-Nya[b] pasti tidak akan dipermalukan[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “terhormat.” Kata Yunani ini dapat menunjuk pada nilai tinggi maupun kehormatan.'
    reason: lexical_alternative
  - marker: b
    text: Secara gramatikal dapat juga dipahami “kepadanya,” yakni kepada batu itu. “Kepada-Nya” mencerminkan penerapan gambaran batu kepada Kristus dalam konteks ayat 4–8.
    reason: alternative_reading
  - marker: c
    text: 'Atau: “tidak akan pernah dipermalukan.” Bentuk Yunani memakai penyangkalan yang sangat tegas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Sebab
  rationale: Memperkenalkan kutipan Kitab Suci sebagai dasar bagi pernyataan sebelumnya, dengan daya penjelas yang wajar dalam bahasa Indonesia.
- source_word: περιέχει ἐν γραφῇ
  choice: ada tertulis dalam Kitab Suci
  rationale: Ungkapan Yunani ini bersifat idiomatis dan secara harfiah tidak alami bila dipindahkan ke bahasa Indonesia. Pilihan ini menyampaikan bahwa perkataan tersebut termuat dalam Kitab Suci tanpa mengubah fungsinya.
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan seruan profetis yang menarik perhatian, tetapi lebih mudah dipahami pembaca modern daripada bentuk arkais.
- source_word: τίθημι ἐν Σιὼν
  choice: Aku meletakkan di Sion
  rationale: Menjaga tindakan peletakan batu dalam gambaran bangunan dan arti lokatif ἐν.
- source_word: λίθον ἀκρογωνιαῖον
  choice: sebuah batu penjuru
  rationale: Istilah Indonesia yang lazim dan jelas untuk batu utama pada sudut bangunan; tidak menambahkan gagasan 'utama' yang tidak dinyatakan tersendiri.
- source_word: ἐκλεκτὸν
  choice: terpilih
  rationale: Menyampaikan bahwa batu itu dipilih, dengan bentuk adjektival yang alami dan tanpa menjadikannya istilah teologis teknis.
- source_word: ἔντιμον
  choice: berharga
  rationale: Kata Yunani mencakup nilai tinggi dan kehormatan. 'Berharga' alami dalam konteks sebuah batu dan tetap membuka nuansa nilai maupun penghargaan.
- source_word: ὁ πιστεύων ἐπ’ αὐτῷ
  choice: orang yang percaya kepada-Nya
  rationale: Mewakili partisip substantival secara alami. Pronomina personal mengikuti penerapan kristologis Petrus dalam konteks, sambil mencatat kemungkinan mengikuti metafora batu secara lebih ketat.
- source_word: οὐ μὴ καταισχυνθῇ
  choice: pasti tidak akan dipermalukan
  rationale: Mengungkapkan negasi Yunani yang sangat tegas dan mempertahankan makna malu/aib dari verba tersebut.
theological_decisions:
- issue: Rujukan αὐτῷ dalam kutipan Yesaya sebagaimana dipakai Petrus
  choice: kepada-Nya
  alternative: kepadanya, dengan rujukan gramatikal kepada batu itu
  rationale: Konteks 1 Petrus 2:4–8 menerapkan gambaran batu kepada pribadi Kristus. Huruf kapital menandai rujukan personal itu, sedangkan catatan kaki mempertahankan ketegangan dengan metafora batu.
- issue: Nuansa ἔντιμον
  choice: berharga
  alternative: terhormat
  rationale: Keduanya dimungkinkan oleh kata Yunani. 'Berharga' paling alami untuk batu dan selaras dengan nilai tinggi, tanpa meniadakan nuansa kehormatan.
- issue: Kekuatan οὐ μὴ
  choice: pasti tidak akan
  alternative: tidak akan pernah
  rationale: Pilihan utama menyatakan kepastian negasi secara tegas tanpa menggeser fokus menjadi durasi temporal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Kutipan profetis dipertahankan sebagai tuturan langsung. Struktur dibuat alami dalam bahasa Indonesia sambil menjaga metafora batu, dua adjektiva Yunani, penerapan personal, dan penyangkalan yang emphatik.
