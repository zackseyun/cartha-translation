id: 1PE.2.4
reference: 1 Peter 2:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πρὸς ὃν προσερχόμενοι, λίθον ζῶντα, ὑπὸ ἀνθρώπων μὲν ἀποδεδοκιμασμένον παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/004.yaml
  text: As you come to him[a], a living stone, rejected by men but chosen and precious in the sight of God[b],
translation:
  language: id
  text: Sementara kamu datang kepada-Nya[a], batu yang hidup itu—yang telah ditolak oleh manusia, tetapi dipilih dan berharga dalam pandangan Allah[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “ketika kamu datang kepada-Nya” atau “sementara kamu terus datang kepada-Nya.”
    reason: Bentuk partisipel kini Yunani dapat menonjolkan tindakan yang sedang atau terus berlangsung.
  - marker: b
    text: 'Atau: “dipilih dan dihormati di sisi Allah.”'
    reason: Ungkapan Yunani dapat menyatakan kedudukan dalam penilaian Allah, dan ἔντιμος mencakup nuansa ‘berharga’ maupun ‘dihormati’.
lexical_decisions:
- source_word: Πρὸς ὃν
  choice: kepada-Nya
  rationale: Mempertahankan arah gerak yang dinyatakan oleh πρός dan rujukan pronominal kepada Tuhan dalam konteks, tanpa menyisipkan nama yang tidak tertulis dalam ayat ini.
- source_word: προσερχόμενοι
  choice: ketika kamu datang
  rationale: Partisipel kini diterjemahkan sebagai anak kalimat temporal yang alami dalam bahasa Indonesia dan tetap dapat menyatakan tindakan yang sedang atau terus berlangsung.
- source_word: λίθον ζῶντα
  choice: Batu yang hidup itu
  rationale: Mempertahankan metafora paradoksal tentang batu bangunan yang hidup; 'batu' lebih tepat daripada 'karang' dalam rangkaian gambaran bangunan pada konteks berikutnya.
- source_word: ὑπὸ ἀνθρώπων
  choice: oleh manusia
  rationale: Dalam bahasa Indonesia, 'manusia' secara alami mencakup umat manusia tanpa membatasi rujukan kepada laki-laki dan mempertahankan kontras antara penilaian manusia dan Allah.
- source_word: ἀποδεδοκιμασμένον
  choice: yang telah ditolak
  rationale: Bentuk partisipel pasif perfek menyatakan penolakan yang sudah terjadi dan hasilnya masih berlaku; 'telah ditolak' menyampaikan aspek itu secara jelas.
- source_word: παρὰ δὲ θεῷ
  choice: tetapi ... dalam pandangan Allah
  rationale: παρά dengan datif di sini menunjukkan kedudukan atau penilaian di sisi Allah; ungkapan ini menyampaikan kontras evaluatif secara alami.
- source_word: ἐκλεκτὸν
  choice: dipilih
  rationale: Menyampaikan makna pemilihan ilahi secara langsung tanpa memakai istilah teknis yang tidak diperlukan.
- source_word: ἔντιμον
  choice: berharga
  rationale: Mencakup gagasan bernilai tinggi dan terhormat serta selaras dengan metafora batu; alternatif 'dihormati' dicatat karena rentang maknanya juga memungkinkan nuansa kehormatan.
theological_decisions:
- issue: Rujukan kata ganti dan Batu yang hidup
  choice: Kata ganti tetap dipertahankan, sedangkan aposisi 'Batu yang hidup itu' menunjuk kepada Tuhan Yesus/Mesias dalam konteks.
  alternative: Menyisipkan nama 'Yesus' atau 'Kristus'.
  rationale: Konteks 1 Petrus 2:3–8 mengidentifikasi rujukannya sebagai Kristus, tetapi teks ayat ini sendiri memakai kata ganti; terjemahan tidak membuat rujukan itu lebih eksplisit daripada sumber.
- issue: Hubungan 'dipilih dan berharga' dengan Allah
  choice: 'Kedua sifat itu disajikan sebagai penilaian Allah: ''dipilih dan berharga dalam pandangan Allah''.'
  alternative: Menerjemahkan secara lebih harfiah 'di sisi Allah, terpilih dan terhormat'.
  rationale: Susunan Yunani menempatkan ἐκλεκτόν dan ἔντιμον dalam kontras dengan penolakan oleh manusia. Terjemahan mempertahankan ketegangan antara penilaian manusia dan penilaian Allah tanpa mengembangkannya menjadi rumusan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ayat sengaja berakhir terbuka dengan tanda pisah karena partisipel Yunani berlanjut secara sintaksis ke ayat 5. Huruf kapital pada 'Batu' membantu menandai pemakaian sebagai sebutan metaforis bagi referen pronominal tanpa mengganti kata ganti dengan nama.
