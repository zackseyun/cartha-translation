  text: Οἱ οἰκέται ὑποτασσόμενοι ἐν παντὶ φόβῳ τοῖς δεσπόταις, οὐ μόνον τοῖς ἀγαθοῖς καὶ ἐπιεικέσιν ἀλλὰ καὶ τοῖς σκολιοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/018.yaml
  text: Household servants, submitting yourselves to your masters with all respect, not only to the good and gentle but also to the crooked.
translation:
  language: id
  text: Para hamba rumah tangga[a], tunduklah kepada tuan-tuanmu dengan penuh hormat[b], bukan hanya kepada mereka yang baik dan lemah lembut, tetapi juga kepada mereka yang bertabiat bengkok[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “budak rumah tangga.” Kata Yunani οἰκέται secara khusus menunjuk kepada hamba atau budak yang melayani dalam sebuah rumah tangga.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dengan segala rasa takut”; dalam konteks ini ungkapan tersebut menyatakan sikap penuh hormat atau rasa segan.
    reason: lexical_alternative
  - marker: c
    text: Atau “keras” atau “tidak adil.” Kata Yunaninya secara harfiah berarti “bengkok” atau “berpilin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέται
  choice: hamba rumah tangga
  rationale: Istilah ini menunjuk secara khusus kepada orang yang berada dalam kedudukan melayani dan bergantung dalam sebuah rumah tangga. Pilihan ini mempertahankan lingkup domestik serta ketimpangan status tanpa menyamakannya begitu saja dengan pelayan modern.
- source_word: ὑποτασσόμενοι
  choice: tunduklah
  rationale: Partisip ini berfungsi sebagai perintah dalam konteks nasihat. Bentuk imperatif Indonesia menyampaikan daya serunya secara alami.
- source_word: ἐν παντὶ φόβῳ
  choice: dengan penuh hormat
  rationale: φόβος dapat berarti takut, hormat, atau rasa segan. Dalam konteks ini, 'penuh hormat' menyampaikan sikap takzim tanpa mempersempit maknanya menjadi rasa gentar terhadap tuan.
- source_word: δεσπόταις
  choice: tuan-tuanmu
  rationale: δεσπότης adalah orang yang memegang kuasa atas hamba dalam rumah tangga. 'Tuan' menyampaikan hubungan sosial tersebut dengan tepat dalam bahasa Indonesia.
- source_word: ἀγαθοῖς
  choice: baik
  rationale: Padanan langsung dan alami bagi sifat moral yang dinyatakan oleh ἀγαθός.
- source_word: ἐπιεικέσιν
  choice: lemah lembut
  rationale: ἐπιεικής mencakup sikap lembut, tenggang rasa, dan tidak keras. 'Lemah lembut' merupakan padanan yang jelas dan bermartabat dalam konteks ini.
- source_word: σκολιοῖς
  choice: bertabiat bengkok
  rationale: σκολιός secara harfiah berarti bengkok atau berpilin dan secara kiasan menggambarkan orang yang menyimpang, tidak adil, atau keras. Tambahan 'bertabiat' membuat metafora tersebut wajar dalam bahasa Indonesia tanpa menghapusnya.
theological_decisions:
- issue: Menyatakan status sosial οἰκέται tanpa melunakkan atau melebih-lebihkan keadaan mereka
  choice: hamba rumah tangga
  alternative: budak rumah tangga; pelayan rumah tangga
  rationale: '''Hamba rumah tangga'' mempertahankan unsur ketundukan dan lingkup domestik. Catatan kaki mencantumkan ''budak rumah tangga'' karena kondisi yang dimaksud dapat mencakup perbudakan, sedangkan ''pelayan rumah tangga'' saja dapat menimbulkan gambaran pekerjaan modern yang terlalu lunak.'
- issue: Apakah φόβος harus diterjemahkan sebagai ketakutan atau padanan kontekstual
  choice: dengan penuh hormat
  alternative: dengan segala rasa takut; dengan penuh rasa segan
  rationale: Ungkapan ini menuntut sikap hormat dalam ketundukan, tetapi kata sumber tetap memiliki rentang makna takut, segan, dan hormat. Teks utama memakai ungkapan Indonesia yang alami, sedangkan arti harfiahnya dipertahankan dalam catatan.
- issue: Mempertahankan metafora moral dalam σκολιοῖς
  choice: mereka yang bertabiat bengkok
  alternative: mereka yang keras; mereka yang tidak adil
  rationale: Pilihan utama mempertahankan gambaran 'bengkok' dari bahasa Yunani dan tidak membatasi sifat buruk itu hanya pada kekerasan atau ketidakadilan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'tunduklah' dipakai sebagai seruan yang alami; 'hamba rumah tangga' mempertahankan latar sosial kuno, dan metafora 'bertabiat bengkok' sengaja dipertahankan dengan penjelasan dalam catatan kaki.
