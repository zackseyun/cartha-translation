  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑμῖν οὖν ἡ τιμὴ τοῖς πιστεύουσιν· ⸀ἀπιστοῦσιν δὲ ⸀λίθος ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/007.yaml
  text: Therefore[a], for you who believe is the honor, but for those who do not believe[c][b], “The stone that the builders rejected—this one has become the head of the corner.”
translation:
  language: id
  text: 'Jadi, kehormatan itu bagi kamu yang percaya[a], tetapi bagi mereka yang tidak percaya[b]: “Batu yang ditolak oleh para pembangun, batu itulah yang telah menjadi batu penjuru[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “batu itu berharga bagi kamu yang percaya.”
    reason: alternative_reading
  - marker: b
    text: Atau, “mereka yang tidak taat”; verba ini dapat mengandung arti menolak untuk percaya dan karena itu bertindak tidak taat.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “kepala sudut”; atau, “batu penjuru utama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: kehormatan
  rationale: Kata ini dapat berarti kehormatan, nilai, atau keberhargaan. “Kehormatan” mempertahankan ungkapan Yunani yang ringkas dan kontras tersirat dengan rasa malu, tanpa membatasi maknanya hanya pada keberhargaan batu itu.
- source_word: τοῖς πιστεύουσιν
  choice: bagi kamu yang percaya
  rationale: Bentuk datif partisipial ini berkaitan dengan ὑμῖν dan secara alami menyapa para pembaca secara langsung.
- source_word: ἀπιστοῦσιν
  choice: mereka yang tidak percaya
  rationale: Pilihan ini mempertahankan kontras langsung dengan “kamu yang percaya.” Nuansa ketidaktaatan yang mungkin terkandung dalam verba dicantumkan dalam catatan kaki.
- source_word: λίθος
  choice: batu
  rationale: Padanan langsung dan alami dalam gambaran pembangunan.
- source_word: ἀπεδοκίμασαν
  choice: ditolak
  rationale: Verba ini menyatakan penolakan setelah penilaian; “ditolak” jelas dan idiomatis dalam konteks kutipan ini.
- source_word: οἰκοδομοῦντες
  choice: para pembangun
  rationale: Partisip yang dipakai sebagai nomina diterjemahkan secara alami sambil mempertahankan metafora pembangunan.
- source_word: κεφαλὴν γωνίας
  choice: kepala sudut
  rationale: Padanan transparan bagi ungkapan harfiah Yunani, sehingga citra asli tidak dipersempit menjadi satu penafsiran arsitektural tertentu.
theological_decisions:
- issue: Makna ἡ τιμή dalam hubungannya dengan orang percaya dan Kristus sebagai batu
  choice: Kehormatan tersedia bagi orang-orang yang percaya.
  alternative: Batu itu berharga bagi orang-orang yang percaya.
  rationale: Susunan ὑμῖν οὖν ἡ τιμή paling langsung menyatakan bahwa kehormatan adalah bagi orang percaya dan sesuai dengan tema tidak dipermalukan. Kemungkinan bahwa ungkapan ini terutama menunjuk pada keberhargaan Kristus tetap dipertahankan dalam catatan kaki.
- issue: Makna κεφαλὴ γωνίας
  choice: Metafora diterjemahkan secara transparan sebagai “kepala sudut.”
  alternative: “Batu penjuru” atau “batu penjuru utama.”
  rationale: Ungkapan Yunani secara harfiah berarti “kepala sudut.” Terjemahan utama mempertahankan keluasan citranya, sedangkan padanan arsitektural yang lazim diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Tanda titik dua memperjelas masuknya kutipan bagi pembaca Indonesia tanpa menambahkan isi proposisional. Pengulangan “batu” pada “batu itulah” mencerminkan penekanan οὗτος dan menghasilkan alur yang alami.
