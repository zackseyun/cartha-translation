  text: καὶ λίθος προσκόμματος καὶ πέτρα σκανδάλου· οἳ προσκόπτουσιν τῷ λόγῳ ἀπειθοῦντες· εἰς ὃ καὶ ἐτέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/008.yaml
  text: and, “a stone of stumbling and a rock of offense.” They stumble because they disobey the word, and to this they were also appointed.
translation:
  language: id
  text: dan, “batu yang membuat orang tersandung dan batu karang yang menjadi sandungan.” Mereka tersandung karena tidak menaati firman, dan untuk itulah mereka juga ditetapkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan untuk keadaan itulah mereka juga ditetapkan.” Ungkapan Yunaninya dapat dipahami sebagai menunjuk pada tersandung atau pada keadaan yang baru disebutkan.'
    reason: Menjelaskan ambiguitas rujukan εἰς ὃ tanpa menentukan bahwa ketidaktaatan itu sendiri ditetapkan.
lexical_decisions:
- source_word: λίθος προσκόμματος
  choice: batu yang membuat orang tersandung
  rationale: Menyampaikan citra konkret batu yang menjadi penyebab tersandung dalam bahasa Indonesia yang alami.
- source_word: πέτρα σκανδάλου
  choice: batu karang yang menyebabkan orang jatuh
  rationale: Membedakan πέτρα dari λίθος sebagai batu karang dan mengungkapkan σκανδάλου sebagai penyebab kejatuhan, tanpa membatasinya pada perasaan tersinggung.
- source_word: τῷ λόγῳ ἀπειθοῦντες
  choice: karena tidak menaati firman
  rationale: Partisip ἀπειθοῦντες menyatakan ketidaktaatan atau penolakan percaya terhadap firman; 'tidak menaati' mempertahankan kaitan langsung dengan datif τῷ λόγῳ.
- source_word: εἰς ὃ καὶ ἐτέθησαν
  choice: dan untuk itulah mereka juga ditetapkan
  rationale: Mempertahankan bentuk pasif ἐτέθησαν dan ketidakjelasan alami rujukan ὃ, yang dapat menunjuk pada tersandung atau pada keadaan yang baru disebutkan.
theological_decisions:
- issue: Rujukan penetapan dalam εἰς ὃ καὶ ἐτέθησαν
  choice: untuk itulah mereka juga ditetapkan
  alternative: mereka juga ditetapkan untuk tidak taat kepada firman
  rationale: Teks Yunani memakai kata ganti relatif netral yang rujukannya tidak sepenuhnya eksplisit. Terjemahan utama mempertahankan ambiguitas dan tidak menyatakan bahwa ketidaktaatan itu sendiri secara khusus ditetapkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan citra batu dipertahankan, sedangkan konstruksi Yunani dibuat cukup alami bagi pembaca umum.
