  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ἐκλήθητε, ὅτι καὶ Χριστὸς ἔπαθεν ὑπὲρ ⸀ὑμῶν, ὑμῖν ὑπολιμπάνων ὑπογραμμὸν ἵνα ἐπακολουθήσητε τοῖς ἴχνεσιν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/021.yaml
  text: For you were called to this[a], because Messiah also suffered for you, leaving you an example so that you might follow in his steps.
translation:
  language: id
  text: Sebab untuk itulah kamu dipanggil, karena Mesias pun telah menderita demi kamu dan meninggalkan teladan[a] bagi kamu, supaya kamu mengikuti jejak-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pola” atau “contoh untuk disalin”; istilah Yunani ini dapat merujuk pada contoh tulisan yang diberikan kepada pelajar untuk dijiplak atau ditiru.
    reason: Menjaga gambaran pedagogis konkret dalam ὑπογραμμός yang tidak sepenuhnya tampak dalam kata “teladan”.
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: untuk itulah
  rationale: Ungkapan ini menunjuk kembali pada panggilan untuk bertahan dalam penderitaan yang tidak adil dan tetap mempertahankan nuansa tujuan.
- source_word: ἐκλήθητε
  choice: kamu dipanggil
  rationale: Bentuk pasif dipertahankan tanpa menyebut pelaku secara eksplisit; dalam konteks ini panggilan ilahi tetap tersirat.
- source_word: ὅτι
  choice: karena
  rationale: Menyatakan dasar atau alasan bagi panggilan tersebut.
- source_word: Χριστὸς
  choice: Mesias
  rationale: Menerjemahkan gelar Yunani secara bermakna dan menegaskan sosok yang diurapi tanpa memperlakukannya semata-mata sebagai nama diri.
- source_word: ἔπαθεν
  choice: telah menderita
  rationale: Menyampaikan tindakan penderitaan yang telah terjadi tanpa menambahkan bentuk atau akibat penderitaan yang tidak disebutkan dalam ayat.
- source_word: ὑπὲρ ὑμῶν
  choice: demi kamu
  rationale: Ungkapan alami dalam bahasa Indonesia yang mempertahankan arti bagi kepentingan atau atas nama pembaca tanpa mempersempitnya menjadi rumusan substitusi tertentu.
- source_word: ὑμῖν ὑπολιμπάνων
  choice: dengan meninggalkan ... bagimu
  rationale: Menunjukkan bahwa Mesias meninggalkan sesuatu bagi para pembaca; konstruksi partisipial diungkapkan secara alami sebagai tindakan yang menyertai penderitaan-Nya.
- source_word: ὑπογραμμὸν
  choice: teladan
  rationale: Menyampaikan fungsi sebuah pola untuk ditiru; gambaran konkret tentang contoh tulisan bagi pelajar dijelaskan dalam catatan kaki.
- source_word: ἵνα
  choice: supaya
  rationale: Mempertahankan hubungan tujuan yang dinyatakan oleh ἵνα.
- source_word: ἐπακολουθήσητε
  choice: kamu mengikuti
  rationale: Bentuk setelah ἵνα menyatakan tujuan yang dikehendaki; bahasa Indonesia tidak perlu menambahkan modalitas yang dapat melemahkan maksud tersebut.
- source_word: τοῖς ἴχνεσιν αὐτοῦ
  choice: jejak-Nya
  rationale: Mempertahankan metafora mengikuti bekas langkah seseorang dalam jalan hidup dan penderitaannya.
theological_decisions:
- issue: Makna ὑπὲρ ὑμῶν dalam penderitaan Mesias
  choice: demi kamu
  alternative: untuk kamu; menggantikan kamu
  rationale: Pilihan ini menjaga cakupan benefaktif dan representatif serta kemungkinan gema substitusi, tetapi tidak memaksakan rumusan pendamaian yang lebih sempit daripada yang dinyatakan klausa ini.
- issue: Hubungan panggilan dengan penderitaan yang tidak adil
  choice: untuk itulah kamu dipanggil
  alternative: untuk tujuan inilah kamu dipanggil
  rationale: Terjemahan menunjuk kembali kepada konteks sebelumnya tanpa memperluas isi panggilan di dalam ayat ini; teladan Mesias menjadi dasar untuk mengikuti jalan penderitaan-Nya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti orang kedua jamak Yunani diterjemahkan dengan “kamu”, sedangkan bentuk penghormatan “-Nya” digunakan bagi Mesias sesuai kebiasaan ejaan religius Indonesia. Penanda catatan kaki [a] ditempatkan langsung sesudah kata yang dijelaskan.
