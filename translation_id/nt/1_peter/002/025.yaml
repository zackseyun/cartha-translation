  text: ἦτε γὰρ ὡς πρόβατα ⸀πλανώμενοι, ἀλλὰ ἐπεστράφητε νῦν ἐπὶ τὸν ποιμένα καὶ ἐπίσκοπον τῶν ψυχῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/025.yaml
  text: For you were like sheep going astray[c][b][a], but now you have returned to the Shepherd and Overseer of your souls.
translation:
  language: id
  text: Sebab dahulu kalian seperti domba yang tersesat[a], tetapi sekarang kalian telah kembali[b] kepada Gembala dan Pengawas[c] jiwa kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang mengembara” atau “yang disesatkan”.
    reason: lexical_alternative
  - marker: b
    text: Atau “telah berbalik kembali”; bentuk Yunaninya juga dapat dipahami dengan nuansa pasif, “telah dikembalikan”.
    reason: alternative_reading
  - marker: c
    text: Atau “Penjaga”; secara tradisional, “Uskup”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε γὰρ
  choice: Sebab dahulu kalian
  rationale: γάρ menghubungkan ayat ini sebagai alasan bagi pernyataan sebelumnya, sedangkan bentuk imperfek ἦτε menggambarkan keadaan mereka pada masa lampau. Kata “dahulu” menyampaikan nuansa keadaan sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ὡς πρόβατα
  choice: seperti domba
  rationale: ὡς menandai perbandingan. Dalam bahasa Indonesia, “domba” dapat dipakai secara kolektif setelah “seperti” tanpa harus diulang menjadi “domba-domba”.
- source_word: πλανώμενοι
  choice: yang tersesat
  rationale: Partisipel πλανάω dapat berarti berkeliaran atau tersesat, dan juga dapat bernuansa pasif, yaitu disesatkan. “Yang tersesat” mempertahankan gambaran domba dan tidak menentukan penyebab kesesatan itu.
- source_word: ἀλλὰ ἐπεστράφητε νῦν
  choice: tetapi sekarang kalian telah kembali
  rationale: ἀλλά menyatakan pertentangan yang kuat. Walaupun ἐπεστράφητε berbentuk pasif, verba ini dapat berfungsi dengan makna medial atau intransitif. “Telah kembali” menyatakan perubahan yang sudah terjadi dan masih relevan sekarang tanpa memaksakan penentuan pelakunya.
- source_word: ἐπὶ τὸν ποιμένα
  choice: kepada Gembala
  rationale: ποιμήν berarti “gembala”. Huruf kapital dipakai karena dalam konteks ini kata tersebut merupakan sebutan bagi Kristus.
- source_word: καὶ ἐπίσκοπον
  choice: dan Pengawas
  rationale: ἐπίσκοπος menunjuk kepada orang yang mengawasi dan memelihara. “Pengawas” transparan secara leksikal dan menghindari asosiasi jabatan gerejawi kemudian yang dapat muncul dari “uskup”.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: jiwa kalian
  rationale: ψυχή dapat berarti jiwa, nyawa, diri, atau pribadi. “Jiwa kalian” mempertahankan ungkapan sumber dan sesuai dengan konteks pemeliharaan rohani tanpa menyiratkan bahwa perhatian Kristus terbatas pada unsur nonjasmani.
theological_decisions:
- issue: ἐπίσκοπος sebagai sebutan kristologis
  choice: Pengawas
  alternative: Penjaga; Uskup
  rationale: Ayat ini menerapkan ποιμήν dan ἐπίσκοπος kepada Kristus. “Pengawas” mempertahankan fungsi pengawasan dan pemeliharaan dalam istilah Yunani tanpa memasukkan tata gereja denominasi tertentu.
- issue: Nuansa diatesis ἐπεστράφητε
  choice: kalian telah kembali
  alternative: kalian telah dibawa kembali; kalian telah berbalik kembali
  rationale: Bentuk pasifnya dapat memberi ruang bagi nuansa tindakan ilahi, tetapi verba tersebut juga lazim dipahami secara medial atau intransitif. Terjemahan utama tidak menyelesaikan secara sepihak ketegangan antara tindakan Allah dan tanggapan manusia; kemungkinan pasif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya yang wajar, khidmat, dan mudah dipahami. “Kalian” memperjelas bahwa sapaan Yunani berbentuk jamak. Kapitalisasi “Gembala” dan “Pengawas” menandai keduanya sebagai sebutan bagi Kristus.
