  yaml_path: translation/nt/1_peter/002/015.yaml
  text: 'For this is the will of God: that by doing good you should silence the ignorance of foolish people[a].'
translation:
  language: id
  text: 'Sebab demikianlah kehendak Allah: dengan berbuat baik, kalian membungkam ketidaktahuan orang-orang bodoh[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memasang berangus pada ketidaktahuan orang-orang bodoh”; kata kerja ini dipakai secara kiasan untuk menghentikan ucapan yang memusuhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteksnya, kata ini memberikan dasar bagi nasihat sebelumnya; bentuk kausal ini alami dalam bahasa Indonesia.
- source_word: οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ
  choice: inilah kehendak Allah
  rationale: Ungkapan ini menyatakan bahwa cara yang disebutkan berikutnya merupakan kehendak Allah; terjemahan ini ringkas dan alami.
- source_word: ἀγαθοποιοῦντας
  choice: dengan berbuat baik
  rationale: Partisip ini paling wajar dipahami sebagai sarana untuk membungkam ketidaktahuan para penentang.
- source_word: φιμοῦν
  choice: membungkam
  rationale: Kata ini secara harfiah berarti memasang berangus, tetapi secara metaforis berarti membuat diam; 'membungkam' mempertahankan daya metaforanya dalam bahasa Indonesia.
- source_word: ἀγνωσίαν
  choice: ketidaktahuan
  rationale: Padanan langsung yang mempertahankan fokus teks pada keadaan tidak tahu atau tidak memahami.
- source_word: ἀφρόνων ἀνθρώπων
  choice: orang-orang bodoh
  rationale: ἄφρων berarti bodoh atau tidak berakal, sedangkan ἄνθρωποι merujuk secara umum kepada manusia dan tidak khusus kepada laki-laki.
theological_decisions:
- issue: Cakupan gender ἀνθρώπων
  choice: orang-orang
  alternative: laki-laki
  rationale: Kata Yunani ini merujuk secara umum kepada manusia yang menentang, bukan secara khusus kepada laki-laki.
- issue: Hubungan berbuat baik dengan membungkam ketidaktahuan
  choice: dengan berbuat baik
  alternative: sambil berbuat baik
  rationale: Partisip tersebut paling mungkin menyatakan sarana, tetapi terjemahan tidak menambahkan bentuk perbuatan baik atau mekanisme pembungkaman yang tidak dijelaskan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kata ganti 'kalian' membuat subjek jamak yang tersirat dalam partisip Yunani menjadi jelas tanpa membatasi gender.
