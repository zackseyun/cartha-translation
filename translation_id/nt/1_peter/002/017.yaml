id: 1PE.2.17
reference: 1 Peter 2:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πάντας τιμήσατε, τὴν ἀδελφότητα ⸀ἀγαπᾶτε, τὸν θεὸν φοβεῖσθε, τὸν βασιλέα τιμᾶτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/017.yaml
  text: Honor everyone[a], love the brotherhood, fear God[b], honor the king.
translation:
  language: id
  text: Hormatilah semua orang; kasihilah persaudaraan seiman[a]; takutlah akan Allah; hormatilah raja[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Persaudaraan seiman” berarti seluruh komunitas saudara-saudari sesama orang percaya.
    reason: lexical_alternative
  - marker: b
    text: Atau “kaisar”; kata Yunani secara harfiah berarti “raja”, tetapi dalam konteks Romawi pada zaman Petrus kemungkinan besar menunjuk kepada kaisar.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντας
  choice: semua orang
  rationale: Bentuk ini berfungsi sebagai nomina dan mencakup setiap orang. “Semua orang” alami dalam bahasa Indonesia serta mempertahankan cakupan universalnya.
- source_word: τιμήσατε / τιμᾶτε
  choice: hormatilah
  rationale: Kedua bentuk berasal dari τιμάω. Terjemahan yang sama pada awal dan akhir ayat mempertahankan pengulangan retoris Yunani; perbedaan aspek aoristus dan kini tidak perlu dibuat eksplisit dalam rangkaian perintah singkat ini.
- source_word: τὴν ἀδελφότητα
  choice: persaudaraan seiman
  rationale: ἀδελφότης menunjuk secara kolektif kepada komunitas saudara-saudari dalam iman. “Persaudaraan seiman” mempertahankan citra kekeluargaan dan sifat korporat istilah tersebut tanpa membatasinya hanya kepada laki-laki.
- source_word: ἀγαπᾶτε
  choice: kasihilah
  rationale: Terjemahan baku dan langsung untuk ἀγαπάω dalam bentuk perintah. Aspek tindakan yang berkelanjutan dapat dipahami dari konteks tanpa tambahan kata.
- source_word: τὸν θεὸν
  choice: Allah
  rationale: Padanan langsung dan lazim bagi θεός dalam konteks ini.
- source_word: φοβεῖσθε
  choice: takutlah akan
  rationale: Mempertahankan daya kata φοβέομαι dan perbedaan sengaja antara sikap kepada Allah dan sikap kepada penguasa; “hormatilah” atau “seganilah” akan melunakkan istilah sumber.
- source_word: τὸν βασιλέα
  choice: raja
  rationale: βασιλεύς secara leksikal berarti “raja”. Dalam konteks Romawi, yang dimaksud kemungkinan besar ialah kaisar, tetapi kemungkinan historis itu dicatat dalam catatan kaki alih-alih mengganti kata sumber di teks utama.
theological_decisions:
- issue: Perbedaan antara tanggapan kepada Allah dan kepada penguasa sipil
  choice: “takutlah akan Allah” dan “hormatilah raja”
  alternative: “hormatilah/seganilah Allah” dan “hormatilah penguasa/kaisar”
  rationale: 'Pilihan ini mempertahankan hierarki ungkapan dalam teks: semua orang dihormati, komunitas seiman dikasihi, Allah ditakuti, dan raja dihormati. Ayat ini tidak menyamakan kewajiban kepada Allah dengan kewajiban kepada penguasa.'
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Empat perintah dibuat sejajar dengan akhiran imperatif -lah dan dipisahkan oleh titik koma. Penanda catatan kaki ditempatkan tepat pada istilah yang dijelaskan.
