  text: ὃς ἁμαρτίαν οὐκ ἐποίησεν οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/022.yaml
  text: who committed no sin[b][a], nor was deceit found in his mouth.
translation:
  language: id
  text: Ia tidak berbuat dosa[b], dan tipu daya pun tidak ditemukan dalam mulut-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelicikan”; istilah Yunani ini dapat berarti penipuan, kecurangan, atau kelicikan.
    reason: lexical_alternative
  - marker: b
    text: Rumusan ini menggemakan Yesaya 53:9.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς
  choice: Ia
  rationale: Pronomina relatif ini merujuk kepada Kristus pada ayat sebelumnya. Karena ayat Indonesia perlu tetap wajar ketika berdiri sebagai unit, “Ia” menyatakan rujukan itu tanpa menambahkan penekanan.
- source_word: ἁμαρτίαν οὐκ ἐποίησεν
  choice: tidak berbuat dosa
  rationale: Kolokasi ini secara idiomatis berarti melakukan atau berbuat dosa. Bentuk tunggal “dosa” dipertahankan sebagai pengertian umum dan menjaga kedekatan dengan gema Yesaya 53:9.
- source_word: οὐδὲ
  choice: dan ... pun tidak
  rationale: Ungkapan ini menghubungkan klausa negatif kedua secara alami dalam bahasa Indonesia serta mempertahankan koordinasi negatif teks Yunani.
- source_word: εὑρέθη
  choice: ditemukan
  rationale: Bentuk pasif dipertahankan, tanpa menentukan siapa yang mencari atau mendapati, dan sesuai dengan corak kutipan Kitab Suci.
- source_word: δόλος
  choice: tipu daya
  rationale: “Tipu daya” merupakan padanan modern yang mencakup kelicikan atau maksud menipu, tanpa mempersempitnya hanya menjadi perkataan bohong.
- source_word: ἐν τῷ στόματι αὐτοῦ
  choice: dalam mulut-Nya
  rationale: Metafora tubuh dalam teks sumber dipertahankan dan gema Yesaya 53:9 tetap terlihat; “di bibir-Nya” lebih idiomatis tetapi kurang dekat dengan bentuk Yunani.
theological_decisions:
- issue: Gema intertekstual Yesaya 53:9 mengenai ketidakberdosaan dan ketiadaan tipu daya pada Kristus
  choice: Mempertahankan rumusan “tidak berbuat dosa” dan “tipu daya ... tidak ditemukan dalam mulut-Nya.”
  alternative: “Ia tidak pernah berdosa dan tidak pernah berkata bohong.”
  rationale: Rumusan yang relatif formal menjaga daya teologis dan gema Yesaya tanpa mengubah pernyataan menjadi parafrasa yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapital pada “-Nya” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Kristus. Penempatan penanda [b] sesudah klausa pertama menunjukkan gema Yesaya; [a] ditempatkan sesudah frasa yang memuat “tipu daya” agar alternatif leksikal jelas.
