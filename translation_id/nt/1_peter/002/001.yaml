base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/001.yaml
  text: Therefore[a], having put away all malice and all deceit and hypocrisies and envies and all slanders[b],
translation:
  language: id
  text: Karena itu, setelah menanggalkan[a] segala kejahatan, segala tipu daya, berbagai kemunafikan dan kedengkian, serta segala perkataan yang menjelekkan orang lain,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “setelah membuang” atau, secara lebih harfiah, “dengan menanggalkan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “segala ucapan jahat tentang orang lain” atau “segala fitnah.” Istilah Yunani ini secara luas menunjuk pada perkataan yang menyerang atau menjelekkan orang lain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποθέμενοι
  choice: setelah menanggalkan
  rationale: Partisip aoris ini menyatakan tindakan persiapan yang mendahului perintah utama pada ayat 2. Ungkapan ini mempertahankan hubungan sintaksis tersebut sekaligus memakai gambaran menanggalkan sesuatu seperti pakaian.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan atau konsekuensi dari konteks sebelumnya, khususnya 1:22–25.
- source_word: πᾶσαν κακίαν
  choice: segala niat jahat
  rationale: Dalam daftar sifat buruk yang berhubungan dengan sesama, κακία paling wajar dipahami sebagai keburukan atau maksud jahat, bukan sekadar kejahatan dalam arti yang sangat umum.
- source_word: πάντα δόλον
  choice: segala tipu daya
  rationale: δόλος menunjuk pada kelicikan atau penipuan; 'tipu daya' merupakan ungkapan Indonesia yang jelas dan alami.
- source_word: ὑποκρίσεις
  choice: berbagai kemunafikan
  rationale: Kata Yunani berbentuk jamak. 'Berbagai' menyampaikan keragaman bentuk atau tindakan munafik tanpa menghasilkan bentuk jamak Indonesia yang kaku.
- source_word: φθόνους
  choice: kedengkian
  rationale: φθόνος menunjuk pada iri hati yang memusuhi atau mendengki. Bahasa Indonesia lazim memakai nomina abstrak tunggal untuk cakupan jamak semacam ini.
- source_word: πάσας καταλαλιάς
  choice: segala perkataan yang menjelekkan orang lain
  rationale: καταλαλιά mencakup perkataan yang menyerang, mencela, atau merusak nama orang lain. Frasa ini mempertahankan cakupan luasnya tanpa membatasinya pada tuduhan palsu dalam arti hukum.
theological_decisions:
- issue: Cakupan daftar sifat buruk
  choice: Menerjemahkan setiap unsur secara konkret sebagai perilaku atau sikap terhadap sesama tanpa memperluasnya menjadi uraian doktrinal.
  alternative: Menerjemahkan κακία secara umum sebagai 'segala kejahatan' dan καταλαλιάς secara lebih sempit sebagai 'segala fitnah'.
  rationale: Konteksnya adalah nasihat etis. Pilihan ini menjaga daya moral dan hubungan antarmanusia dalam daftar Yunani tanpa memasukkan penafsiran denominasi tertentu.
- issue: Hubungan partisip dengan perintah pada ayat 2
  choice: Mempertahankan bentuk subordinatif 'setelah menanggalkan' sehingga kalimat berlanjut ke ayat 2.
  alternative: Mengubahnya menjadi perintah mandiri, 'Buanglah'.
  rationale: Bentuk Yunani adalah partisip yang secara sintaksis bergantung pada perintah utama di ayat berikutnya. Terjemahan tidak mengubah struktur itu menjadi perintah tersendiri.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang bermartabat. Bentuk 'setelah menanggalkan' mempertahankan struktur yang berlanjut ke ayat 2; 'berbagai' dipakai untuk mengungkapkan jamak Yunani secara alami, sedangkan pengulangan 'segala' mengikuti penekanan teks sumber.
