  text: εἴτε ἡγεμόσιν ὡς δι’ αὐτοῦ πεμπομένοις εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/014.yaml
  text: or to governors[a], as those sent by him for the punishment of evildoers and the praise of those who do good.
translation:
  language: id
  text: atau kepada para gubernur sebagai orang-orang yang diutus olehnya[a] untuk menjatuhkan hukuman atas orang-orang yang berbuat jahat dan memberikan pujian kepada orang-orang yang berbuat baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “olehnya” kemungkinan besar merujuk kepada raja atau kaisar yang disebut dalam ayat sebelumnya; sebagian orang memahaminya sebagai rujukan kepada Allah yang menata kewenangan pemerintahan.
    reason: alternative_reading
lexical_decisions:
- source_word: εἴτε
  choice: atau kepada
  rationale: Melanjutkan susunan pilihan dari ayat sebelumnya dan menghubungkan objek berikutnya secara alami dalam bahasa Indonesia.
- source_word: ἡγεμόσιν
  choice: para gubernur
  rationale: Dalam konteks pemerintahan sipil, istilah ini menunjuk kepada para pejabat penguasa; “para gubernur” cukup spesifik tanpa menetapkan secara berlebihan struktur administratif Romawi.
- source_word: ὡς
  choice: sebagai orang-orang yang
  rationale: Memperkenalkan gambaran mengenai para gubernur sebagai pihak yang diutus dan mempertahankan hubungan sintaksis dengan partisipel berikutnya.
- source_word: δι’ αὐτοῦ
  choice: olehnya
  rationale: διά dengan genitif menyatakan perantaraan atau pelaku. “Olehnya” alami bersama kata “diutus” dan tetap membiarkan rujukan kata ganti dijelaskan dalam catatan kaki.
- source_word: πεμπομένοις
  choice: yang diutus
  rationale: Menyatakan kewenangan yang didelegasikan tanpa memperkuat maknanya menjadi penugasan resmi yang tidak dinyatakan secara eksplisit.
- source_word: εἰς ἐκδίκησιν
  choice: untuk menghukum
  rationale: Dalam konteks fungsi pemerintahan, frasa ini paling wajar menyatakan pelaksanaan hukuman terhadap pelaku kejahatan, bukan pembalasan pribadi.
- source_word: κακοποιῶν
  choice: orang-orang yang berbuat jahat
  rationale: Mempertahankan unsur verbal dan menggambarkan orang berdasarkan perbuatan jahat mereka.
- source_word: ἔπαινον
  choice: memuji
  rationale: Mengungkapkan tujuan kedua secara alami dan sejajar dengan verba “menghukum”; makna dasarnya tetap pujian, bukan sekadar persetujuan administratif.
- source_word: ἀγαθοποιῶν
  choice: orang-orang yang berbuat baik
  rationale: Mempertahankan unsur tindakan dalam istilah Yunani dengan ungkapan Indonesia yang jelas dan alami.
theological_decisions:
- issue: Rujukan αὐτοῦ dalam δι’ αὐτοῦ
  choice: Kata “-nya” terutama merujuk kepada raja/kaisar yang disebut dalam ayat sebelumnya.
  alternative: Kata “-nya” dipahami merujuk kepada Allah sebagai pihak yang menata kewenangan pemerintahan.
  rationale: Raja/kaisar adalah anteseden terdekat dan paling alami dalam alur kalimat, tetapi teks Yunani tidak menyebut ulang nomina itu sehingga kemungkinan rujukan yang lebih luas kepada Allah dicatat tanpa disisipkan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Ayat dipertahankan sebagai kelanjutan sintaksis dari ayat 13; karena itu dimulai dengan huruf kecil dan memakai “atau kepada”. Struktur tujuan ganda diterjemahkan secara verbal agar jelas dan alami.
