id: 1PE.2.20
reference: 1 Peter 2:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ποῖον γὰρ κλέος εἰ ἁμαρτάνοντες καὶ κολαφιζόμενοι ὑπομενεῖτε; ἀλλ’ εἰ ἀγαθοποιοῦντες καὶ πάσχοντες ὑπομενεῖτε, τοῦτο χάρις παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/020.yaml
  text: For what credit is it if[a], when you are sinning and being beaten, you endure? But if, when you are doing good and suffering, you endure, this is grace before God.
translation:
  language: id
  text: Sebab, pujian apa yang kamu peroleh jika kamu bertahan ketika berbuat dosa dan dipukuli? Namun, jika kamu bertahan ketika berbuat baik dan menderita, hal itu merupakan kasih karunia di hadapan Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hal itu berkenan kepada Allah” atau “hal itu patut dipuji di hadapan Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κλέος
  choice: apa yang patut dipuji
  rationale: Dalam pertanyaan retoris ini, kata tersebut menunjuk pada pujian atau penghargaan yang layak diterima, bukan kemasyhuran. Ungkapan ini wajar dalam bahasa Indonesia dan mempertahankan daya retorisnya.
- source_word: ἁμαρτάνοντες
  choice: ketika berbuat dosa
  rationale: Pilihan ini mempertahankan bobot moral-teologis verba sumber dan fungsi partisip yang menyatakan keadaan saat mereka bertahan.
- source_word: κολαφιζόμενοι
  choice: dipukuli
  rationale: Verba ini menyatakan pukulan fisik, bahkan secara harfiah pukulan dengan kepalan tangan. 'Dipukuli' jelas dan alami dalam bahasa Indonesia modern.
- source_word: ὑπομενεῖτε
  choice: kamu bertahan
  rationale: '''Bertahan'' menyampaikan ketabahan di bawah penderitaan dan dapat diulang secara alami pada kedua klausa sebagaimana dalam teks Yunani.'
- source_word: ἀγαθοποιοῦντες
  choice: ketika berbuat baik
  rationale: Ini merupakan padanan langsung dan alami yang dapat mencakup tindakan benar maupun tindakan yang mendatangkan kebaikan.
- source_word: πάσχοντες
  choice: menderita
  rationale: Kata sumber bermakna luas dan tidak menentukan satu bentuk perlakuan buruk tertentu; 'menderita' menjaga keluasan itu.
- source_word: χάρις
  choice: kasih karunia
  rationale: Padanan ini mempertahankan istilah teologis yang penting dan ketegangan leksikal teks, sementara arti kontekstual berupa perkenanan atau hal yang terpuji dijelaskan dalam catatan kaki.
- source_word: παρὰ θεῷ
  choice: di hadapan Allah
  rationale: Frasa ini menunjuk pada kedudukan atau penilaian dalam relasi dengan Allah. 'Di hadapan Allah' ringkas dan tetap dekat dengan bentuk sumber.
theological_decisions:
- issue: Makna χάρις dalam klausa penutup
  choice: Diterjemahkan 'kasih karunia di hadapan Allah' dalam teks utama.
  alternative: Hal ini berkenan kepada Allah; hal ini patut dipuji di hadapan Allah.
  rationale: Dalam konteks ini χάρις dapat menunjuk pada perkenanan atau persetujuan Allah, tetapi juga tetap membawa resonansi teologis 'kasih karunia'. Teks utama menjaga transparansi leksikal, sedangkan catatan kaki mempertahankan kemungkinan makna kontekstual tanpa memutuskannya secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur paralel kedua klausa dipertahankan, termasuk pengulangan 'kamu bertahan'. Bentuk partisip Yunani disampaikan secara alami dengan 'ketika', tanpa menghilangkan hubungan antara tindakan dan penderitaan.
