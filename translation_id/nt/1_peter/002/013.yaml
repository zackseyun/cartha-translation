  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Ὑποτάγητε πάσῃ ἀνθρωπίνῃ κτίσει διὰ τὸν κύριον· εἴτε βασιλεῖ ὡς ὑπερέχοντι,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/013.yaml
  text: Submit yourselves to every human institution for the Lord’s sake[a], whether to a king as one in authority[b],
translation:
  language: id
  text: Tunduklah kepada setiap lembaga manusia demi Tuhan,[a] baik kepada raja sebagai pihak yang berkuasa,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap ciptaan manusia”; secara tradisional juga diterjemahkan “setiap peraturan manusia”. Dalam konteks ini, frasa tersebut menunjuk pada lembaga atau kewenangan sipil manusia, sebagaimana terlihat dari penyebutan raja dan para gubernur.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebagai yang tertinggi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποτάγητε
  choice: Tundukkanlah dirimu
  rationale: Imperatif aoris pasif yang berfungsi secara medial menyampaikan tindakan sukarela untuk menempatkan diri di bawah kewenangan; bentuk ini mempertahankan daya perintah dan lebih wajar daripada terjemahan pasif yang kaku.
- source_word: πάσῃ
  choice: setiap
  rationale: Dengan nomina tunggal datif κτίσει, kata ini dipahami secara distributif.
- source_word: ἀνθρωπίνῃ κτίσει
  choice: lembaga manusia
  rationale: Secara harfiah dapat berarti 'ciptaan manusia', tetapi konteks langsung tentang raja dan para gubernur menunjukkan tatanan atau lembaga kemasyarakatan sipil. Pilihan ini menghindari kesan bahwa yang dimaksud ialah setiap orang secara individual.
- source_word: διὰ τὸν κύριον
  choice: demi Tuhan
  rationale: διά dengan akusatif menyatakan alasan atau motivasi; ungkapan ini ringkas, alami, dan mempertahankan dasar kristiani bagi ketundukan tersebut.
- source_word: κύριον
  choice: Tuhan
  rationale: Teks hanya menggunakan gelar κύριος; terjemahan tidak mempersempit rujukannya secara eksplisit kepada Yesus atau Allah.
- source_word: εἴτε βασιλεῖ
  choice: baik kepada raja
  rationale: εἴτε memulai rangkaian 'baik ... maupun ...' yang berlanjut pada ayat berikutnya, sedangkan βασιλεύς secara leksikal berarti raja; pilihan ini tidak mempersempitnya menjadi kaisar.
- source_word: ὡς ὑπερέχοντι
  choice: sebagai pemegang kekuasaan yang lebih tinggi
  rationale: Partisip ini menunjukkan kedudukan atau kewenangan yang berada di atas; rumusan tersebut menjaga sifat relatifnya tanpa memberi kesan supremasi mutlak.
theological_decisions:
- issue: Hakikat kewenangan sipil dalam ἀνθρωπίνῃ κτίσει
  choice: lembaga manusia
  alternative: ciptaan manusia; peraturan manusia; setiap manusia
  rationale: Raja dalam ayat ini dan para gubernur dalam ayat berikutnya menjelaskan bahwa yang dimaksud ialah susunan kewenangan sipil. Terjemahan ini mempertahankan unsur manusiawi dalam frasa Yunani tanpa menyatakan lebih jauh asal-usul teologis atau legitimasi mutlak lembaga itu.
- issue: Rujukan κύριον
  choice: Tuhan
  alternative: Yesus; Allah
  rationale: Karena teks tidak menyebut rujukan itu secara lebih khusus, gelarnya dipertahankan agar ambiguitas asli tidak diselesaikan secara diam-diam.
- issue: Cakupan ὑπερέχοντι
  choice: kekuasaan yang lebih tinggi
  alternative: yang tertinggi; yang berdaulat
  rationale: Pilihan ini menyampaikan kedudukan unggul dalam susunan sipil tanpa menyiratkan bahwa raja memiliki kekuasaan mutlak atau tertinggi dalam segala hal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam hormat dan lugas. 'Tundukkanlah dirimu' mempertahankan nuansa tindakan sukarela; 'lembaga manusia' jelas bagi pembaca umum, sedangkan catatan kaki menjaga arti harfiah dan alternatif tradisional. Tanda koma akhir dipertahankan karena konstruksi berlanjut ke ayat 14.
