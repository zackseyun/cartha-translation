  yaml_path: translation/nt/mark/003/034.yaml
  text: And looking around at those seated around him in a circle[a], he says, “Behold, my mother and my brothers!”
translation:
  language: id
  text: Sambil memandang sekeliling, Ia berkata kepada orang-orang yang duduk melingkar di sekeliling-Nya, “Lihatlah, inilah ibu-Ku dan saudara-saudara-Ku![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudara-saudara lelaki-Ku.” Namun, kelompok yang mengelilingi Yesus mungkin juga mencakup perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: sambil memandang
  rationale: Partisip aoris ini menggambarkan Yesus mengarahkan pandangan ke sekeliling-Nya. Ungkapan ini alami dalam bahasa Indonesia dan tetap menyampaikan tindakan yang disengaja.
- source_word: τοὺς περὶ αὐτὸν κύκλῳ καθημένους
  choice: orang-orang yang duduk mengelilingi-Nya
  rationale: Terjemahan ini mempertahankan unsur duduk serta penekanan spasial περὶ αὐτόν dan κύκλῳ tanpa pengulangan yang kaku dalam bahasa Indonesia.
- source_word: λέγει
  choice: Ia berkata
  rationale: Walaupun bentuk Yunani memakai kala kini historis, bentuk lampau adalah cara naratif yang paling alami dalam bahasa Indonesia; daya hidup adegan tetap terpelihara oleh susunan langsungnya.
- source_word: Ἴδε
  choice: Lihatlah, inilah
  rationale: Ἴδε berfungsi menarik perhatian sekaligus menunjuk orang-orang di hadapan Yesus. Gabungan ini terdengar wajar dan mempertahankan kedua nuansa tersebut.
- source_word: μήτηρ
  choice: ibu
  rationale: Padanan leksikal langsung dan alami.
- source_word: ἀδελφοί
  choice: saudara-saudara
  rationale: Kata Indonesia ini dapat menunjuk saudara lelaki maupun kelompok saudara secara lebih luas. Karena bentuk Yunani adalah maskulin jamak tetapi kelompok di sekitar Yesus mungkin mencakup perempuan, ketegangan itu dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Istilah kekerabatan maskulin ἀδελφοί dalam kelompok pengikut yang mungkin mencakup perempuan
  choice: saudara-saudara
  alternative: saudara-saudara lelaki; saudara sekalian
  rationale: “Saudara-saudara” adalah padanan Indonesia yang alami bagi bentuk jamak tersebut dan tidak secara paksa membatasi kelompok hanya pada laki-laki. Catatan kaki menjaga informasi bahwa bentuk Yunani secara harfiah berarti saudara laki-laki sekaligus mengakui kemungkinan cakupan yang lebih luas.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab berbahasa Indonesia. Susunan “Lihatlah, inilah” mempertahankan daya tunjuk Ἴδε tanpa memakai ungkapan arkais.
