  text: καὶ λέγει αὐτοῖς· Ἔξεστιν τοῖς σάββασιν ⸀ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ἀποκτεῖναι; οἱ δὲ ἐσιώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/004.yaml
  text: And he said to them[a], “Is it lawful on the Sabbath to do good or to do harm[b], to save a life or to kill?” But they were silent.
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Apakah pada hari Sabat[a] diperbolehkan berbuat baik atau berbuat jahat, menyelamatkan nyawa atau membunuh?” Namun, mereka tetap diam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Yunani secara harfiah memakai bentuk jamak, “pada hari-hari Sabat,” suatu ungkapan yang lazim untuk hari Sabat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔξεστιν
  choice: diperbolehkan
  rationale: Dalam perdebatan mengenai ketaatan terhadap hari Sabat, kata ini menanyakan apa yang diizinkan menurut hukum atau ketentuan yang berlaku. “Diperbolehkan” menyampaikan nuansa tersebut secara alami dalam bahasa Indonesia.
- source_word: τοῖς σάββασιν
  choice: pada hari Sabat
  rationale: Bentuk Yunani ini secara gramatikal jamak, tetapi merupakan ungkapan umum yang di sini merujuk secara idiomatis pada hari Sabat. Bentuk tunggal lebih alami dan sesuai dengan konteks peristiwa tertentu ini.
- source_word: ἀγαθοποιῆσαι
  choice: berbuat baik
  rationale: Ungkapan ini secara langsung berarti melakukan sesuatu yang baik atau bermanfaat; “berbuat baik” ringkas, alami, dan mempertahankan bentuk verbalnya.
- source_word: κακοποιῆσαι
  choice: berbuat jahat
  rationale: Pilihan ini mempertahankan pertentangan leksikal dan etis dengan “berbuat baik.” Dalam konteksnya, perbuatan jahat itu mencakup tindakan yang mencelakakan, sebagaimana diperjelas oleh kontras berikutnya antara menyelamatkan dan membunuh.
- source_word: ψυχὴν
  choice: nyawa
  rationale: Dalam pertentangan dengan tindakan membunuh, kata ini menunjuk pada kehidupan seseorang, bukan secara khusus pada jiwa yang tidak berwujud. “Nyawa” menghasilkan ungkapan Indonesia yang alami.
- source_word: σῶσαι
  choice: menyelamatkan
  rationale: Pilihan ini mempertahankan arti dasar menyelamatkan atau memelihara kehidupan dan sesuai dengan konteks penyembuhan.
- source_word: ἀποκτεῖναι
  choice: membunuh
  rationale: Ini adalah padanan langsung yang tidak menambahkan unsur hukum atau niat khusus seperti yang dapat tersirat dalam istilah yang berarti pembunuhan terencana.
- source_word: ἐσιώπων
  choice: mereka tetap diam
  rationale: Bentuk imperfek menggambarkan sikap diam yang berlangsung sebagai tanggapan terhadap pertanyaan Yesus. Kata “tetap” membantu menyampaikan daya naratif tersebut.
theological_decisions:
- issue: Bentuk ungkapan Sabat dalam perdebatan hukum-keagamaan
  choice: pada hari Sabat
  alternative: pada hari-hari Sabat
  rationale: Walaupun teks Yunani memakai bentuk jamak, bentuk itu merupakan idiom yang lazim dan konteksnya menunjuk pada satu hari Sabat tertentu. Bentuk tunggal menghindari kesan keliru bahwa pertanyaan ini hanya mengenai serangkaian hari Sabat, sementara bentuk sumber dijelaskan dalam catatan kaki.
- issue: Pertentangan antara ἀγαθοποιῆσαι dan κακοποιῆσαι
  choice: berbuat baik atau berbuat jahat
  alternative: berbuat baik atau mencelakakan
  rationale: “Berbuat jahat” mempertahankan pertentangan etis yang terbuka dalam kedua verba Yunani, tanpa membatasi κακοποιῆσαι hanya pada akibat fisik. Klausa berikutnya memperjelas penerapannya pada kehidupan dan kematian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan pertanyaan yang alami dan bernada bermartabat. Kata ganti “Ia” dipakai sesuai kebiasaan penulisan Alkitab bahasa Indonesia ketika merujuk kepada Yesus. Terjemahan mempertahankan ketegangan etis antara berbuat baik dan berbuat jahat serta tidak mempersempit ψυχή menjadi konsep teknis tentang jiwa.
