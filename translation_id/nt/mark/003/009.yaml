  source_fidelity: 'Draf menangkap unsur-unsur utama: perahu kecil, kesiapsediaan bagi Yesus, alasan berupa kerumunan, dan tujuan agar Yesus tidak dihimpit. Namun, εἶπεν pada dasarnya berarti “berkata,” sedangkan “menyuruh” memperkuatnya menjadi tindakan memerintah. Walaupun konteksnya memang berupa arahan, penguatan ini tidak diperlukan. Pronomina “mereka” juga berpotensi secara gramatikal merujuk kepada murid-murid, padahal subjek θλίβωσιν adalah orang banyak.'
