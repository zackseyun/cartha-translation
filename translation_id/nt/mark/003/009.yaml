  terminology: “Murid-murid,” “perahu kecil,” “orang banyak,” dan “menghimpit” sesuai dengan register Alkitab Indonesia modern dan konteks fisik θλίβω. Kapitalisasi pronomina ilahi dipertahankan sesuai gaya draf.
