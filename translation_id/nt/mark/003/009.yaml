  text: And he told his disciples that a small boat should stay ready for him because of the crowd[a], so that they might not crush him.
translation:
  language: id
  text: Ia berkata kepada murid-murid-Nya supaya sebuah perahu kecil tetap tersedia bagi-Nya karena orang banyak itu, supaya orang banyak itu tidak menghimpit-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menekan-Nya.” Kata Yunani ini dapat berarti menekan, menghimpit, atau meremukkan akibat tekanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: menyuruh
  rationale: Dalam konstruksi ini, Yesus menyampaikan arahan kepada para murid; 'menyuruh ... agar' terdengar alami dalam bahasa Indonesia dan menyatakan daya perintah konteks tanpa menambahkan isi yang tidak tersurat.
- source_word: μαθηταῖς
  choice: murid-murid
  rationale: '''Murid-murid'' merupakan padanan baku dalam Injil dan mempertahankan relasi guru-pengikut.'
- source_word: πλοιάριον
  choice: sebuah perahu kecil
  rationale: Padanan ini mempertahankan nuansa diminutif πλοιάριον sekaligus tetap alami dalam bahasa Indonesia modern.
- source_word: προσκαρτερῇ
  choice: tetap siap
  rationale: Kata ini dalam konteks tersebut menunjukkan kesiapsiagaan atau ketersediaan yang berkelanjutan; 'tetap siap' mengungkapkannya secara ringkas dan wajar.
- source_word: αὐτῷ
  choice: bagi-Nya
  rationale: Datif ini menunjukkan bahwa perahu tersebut harus tersedia untuk keperluan Yesus; 'bagi-Nya' mempertahankan hubungan itu secara alami.
- source_word: διὰ τὸν ὄχλον
  choice: karena orang banyak itu
  rationale: διά dengan akusatif menyatakan sebab. 'Orang banyak itu' merujuk pada kerumunan yang hadir dalam konteks.
- source_word: θλίβωσιν
  choice: menghimpit
  rationale: Kata 'menghimpit' mencakup tekanan fisik akibat desakan kerumunan dan mempertahankan kemungkinan makna menekan atau meremukkan tanpa berlebihan.
