  text: Καὶ ὁ Ἰησοῦς ⸂μετὰ τῶν μαθητῶν αὐτοῦ ἀνεχώρησεν⸃ πρὸς τὴν θάλασσαν· καὶ πολὺ πλῆθος ἀπὸ τῆς Γαλιλαίας ⸀ἠκολούθησεν, καὶ ἀπὸ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/007.yaml
  text: And Jesus withdrew with his disciples to the sea[a], and a great crowd from Galilee followed, and from Judea[b],
translation:
  language: id
  text: Lalu Yesus menyingkir bersama murid-murid-Nya ke arah laut[a][b]. Sejumlah besar orang dari Galilea mengikuti-Nya, juga dari Yudea,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke laut.” Kata depan Yunani yang digunakan dapat menunjukkan gerak menuju laut.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah Danau Galilea, yang juga dikenal sebagai Laut Galilea. Teks Yunani hanya menyebutnya “laut.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: menyingkir
  rationale: Kata ini menyatakan tindakan pergi atau menarik diri, sering kali dari tekanan atau pertentangan. “Menyingkir” mempertahankan nuansa tersebut tanpa menyiratkan ketakutan atau kekalahan.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: bersama murid-murid-Nya
  rationale: Dalam konteks Injil, μαθηταί adalah orang-orang yang belajar dari dan mengikuti Yesus; “murid-murid” merupakan padanan Indonesia yang alami dan mapan.
- source_word: πρὸς τὴν θάλασσαν
  choice: ke arah laut
  rationale: πρός dengan akusatif dapat menunjukkan gerak menuju atau ke arah suatu tempat. “Ke arah laut” mempertahankan kemungkinan bahwa tujuan akhirnya tidak dinyatakan secara tegas, sementara θάλασσα diterjemahkan secara harfiah sebagai “laut”.
- source_word: πολὺ πλῆθος
  choice: sejumlah besar orang
  rationale: Ungkapan ini menunjuk pada kumpulan orang yang sangat banyak. Pilihan ini alami dalam bahasa Indonesia modern dan menghindari kesan arkais dari “khalayak ramai” atau “orang banyak yang amat besar”.
- source_word: ἠκολούθησεν
  choice: mengikuti-Nya
  rationale: Di sini ἀκολουθέω terutama menggambarkan orang banyak yang bergerak mengikuti Yesus. Objek tersirat dibuat eksplisit sebagai “-Nya” agar kalimat Indonesia jelas dan alami.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: dari Galilea
  rationale: Padanan langsung yang menyatakan tempat asal orang banyak tersebut.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: dan dari Yudea,
  rationale: Frasa ini memulai kelanjutan daftar wilayah pada ayat berikutnya. Koma penutup mempertahankan struktur kalimat yang belum selesai pada batas ayat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Bentuk “-Nya” dipakai sesuai konvensi penerjemahan Alkitab Indonesia untuk rujukan kepada Yesus. Susunan akhir sengaja dibiarkan menggantung karena daftar wilayah berlanjut ke ayat berikutnya. Kedua penanda catatan ditempatkan sesudah “laut”, sesuai unsur yang dijelaskan.
