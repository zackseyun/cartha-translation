  yaml_path: translation/nt/mark/003/015.yaml
  text: and to have authority to cast out demons[a].
translation:
  language: id
  text: dan berwenang mengusir roh-roh jahat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menghalau roh-roh jahat.”
    reason: Alternatif leksikal untuk ἐκβάλλειν yang tetap menyampaikan tindakan memaksa keluar.
lexical_decisions:
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung ini meneruskan rangkaian tujuan atau pelengkap infinitif dari ayat sebelumnya.
- source_word: ἔχειν
  choice: untuk memiliki
  rationale: Infinitif kini aktif dari ἔχω diterjemahkan secara langsung dan mempertahankan kesejajarannya dengan rangkaian sebelumnya.
- source_word: ἐξουσίαν
  choice: wewenang
  rationale: Dalam konteks penugasan kedua belas murid oleh Yesus, kata ini menekankan hak atau kewenangan yang diberikan untuk bertindak, bukan sekadar kekuatan.
- source_word: ἐκβάλλειν
  choice: untuk mengusir
  rationale: Pilihan ini menyampaikan tindakan mengeluarkan secara paksa dalam konteks pengusiran setan dengan bahasa Indonesia yang alami.
- source_word: τὰ δαιμόνια
  choice: setan-setan
  rationale: Istilah Yunani yang dipakai secara khusus berarti makhluk-makhluk jahat; terjemahan ini tidak menggantinya dengan ungkapan berbeda, seperti 'roh-roh najis'.
theological_decisions:
- issue: Makna ἐξουσία dalam penugasan para murid
  choice: wewenang
  alternative: kuasa
  rationale: “Wewenang” menonjolkan kewenangan yang diberikan oleh Yesus tanpa menyangkal kemampuan adikodrati yang diperlukan untuk mengusir setan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk infinitif dipertahankan agar ayat yang merupakan lanjutan kalimat sebelumnya tetap terasa terhubung.
