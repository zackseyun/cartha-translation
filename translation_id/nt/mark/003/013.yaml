  text: Καὶ ἀναβαίνει εἰς τὸ ὄρος καὶ προσκαλεῖται οὓς ἤθελεν αὐτός, καὶ ἀπῆλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/013.yaml
  text: And he went up on the mountain and called to himself those whom he wanted[b][a], and they came to him.
translation:
  language: id
  text: Lalu Yesus naik ke gunung dan memanggil kepada-Nya orang-orang yang Ia sendiri kehendaki, dan mereka datang kepada-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: lalu mereka pergi kepada-Nya.'
    reason: ἀπῆλθον secara leksikal dapat diterjemahkan “pergi”, tetapi dengan frasa “kepada-Nya” gerakan itu dipandang menuju Yesus dan secara alami juga dapat disebut “datang”.
lexical_decisions:
- source_word: ἀναβαίνει
  choice: naik
  rationale: Bentuk kini historis Yunani diterjemahkan dengan verba Indonesia yang netral terhadap waktu; konteks naratif menentukan peristiwa lampau, sedangkan makna gerak ke atas tetap terpelihara.
- source_word: εἰς τὸ ὄρος
  choice: ke gunung
  rationale: Bersama verba 'naik', frasa ini secara alami menyatakan gerak menuju atau naik ke kawasan gunung tanpa memaksakan arti harfiah 'ke dalam'.
- source_word: προσκαλεῖται
  choice: memanggil
  rationale: Dalam konteks ini verba bentuk medial menyatakan panggilan yang diarahkan agar orang-orang itu mendekat kepada Yesus. Bahasa Indonesia cukup alami memakai 'memanggil', sementara tujuan relasionalnya ditegaskan oleh klausa berikutnya.
- source_word: οὓς ἤθελεν αὐτός
  choice: orang-orang yang Ia sendiri kehendaki
  rationale: '''Kehendaki'' sesuai dengan θέλω dan terdengar lebih bermartabat daripada ''inginkan'' dalam konteks ini. ''Ia sendiri'' mempertahankan penekanan eksplisit pada αὐτός tanpa menambahkan kesimpulan teologis di luar ayat.'
- source_word: ἀπῆλθον πρὸς αὐτόν
  choice: mereka datang kepada-Nya
  rationale: Walaupun ἀπέρχομαι lazimnya berarti 'pergi', frasa πρὸς αὐτόν menunjukkan gerak menuju Yesus. 'Datang kepada-Nya' paling alami dalam bahasa Indonesia bila peristiwa dipandang dari posisi Yesus; alternatif yang lebih dekat dengan bentuk verba dicatat dalam catatan kaki.
theological_decisions:
- issue: Penekanan pada kehendak pribadi Yesus dalam pemanggilan
  choice: Ia sendiri kehendaki
  alternative: Ia kehendaki
  rationale: αὐτός memberi penekanan nyata pada prakarsa Yesus. Terjemahan mempertahankan penekanan itu, tetapi tidak mengembangkannya menjadi rumusan doktrinal mengenai pemilihan yang tidak dinyatakan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama 'Yesus' dipakai untuk memperjelas subjek yang dalam bahasa Yunani hanya dinyatakan melalui bentuk verba dan konteks. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
