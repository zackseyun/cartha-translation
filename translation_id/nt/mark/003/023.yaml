  text: καὶ προσκαλεσάμενος αὐτοὺς ἐν παραβολαῖς ἔλεγεν αὐτοῖς· Πῶς δύναται Σατανᾶς Σατανᾶν ἐκβάλλειν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/023.yaml
  text: 'And after calling them to himself, he was speaking to them in parables: “How can Satan cast out Satan?”'
translation:
  language: id
  text: 'Setelah memanggil mereka kepada-Nya, Yesus berbicara kepada mereka dalam perumpamaan-perumpamaan: “Bagaimana mungkin Iblis mengusir Iblis?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: memanggil mereka datang kepada-Nya
  rationale: Partisip aoris medium ini menunjukkan bahwa Yesus memanggil mereka untuk mendekat kepada-Nya sebelum berbicara; ungkapan ini menyampaikan urutan dan arah panggilan secara alami dalam bahasa Indonesia.
- source_word: ἐν παραβολαῖς
  choice: dengan perumpamaan
  rationale: Bentuk jamak παραβολαῖς menunjuk pada perumpamaan atau perbandingan ilustratif. Bahasa Indonesia lazim memakai bentuk yang sama tanpa penanda jamak ulang ketika makna jamaknya sudah ditopang konteks.
- source_word: ἔλεγεν
  choice: berbicara
  rationale: Imperfek Yunani menggambarkan tindakan berbicara yang sedang berlangsung. Dalam alur narasi ini, 'berbicara' terdengar alami dan tidak mereduksinya menjadi satu ujaran sesaat.
- source_word: Πῶς δύναται
  choice: Bagaimana mungkin
  rationale: Gabungan ini memperkenalkan pertanyaan retoris mengenai kemungkinan. 'Bagaimana mungkin' mempertahankan daya sanggahnya secara wajar dalam bahasa Indonesia.
- source_word: Σατανᾶς
  choice: Iblis
  rationale: '''Iblis'' adalah padanan baku dan mudah dipahami dalam tradisi bahasa Indonesia untuk gelar/nama Satan, serta tetap digunakan bagi bentuk nominatif dan akusatif.'
- source_word: ἐκβάλλειν
  choice: mengusir
  rationale: Dalam konteks pengusiran roh jahat di Markus, 'mengusir' merupakan padanan idiomatis dan tepat bagi ἐκβάλλω.
theological_decisions:
- issue: Daya pertanyaan Yesus tentang Iblis yang bertindak melawan dirinya sendiri
  choice: 'Diterjemahkan sebagai pertanyaan retoris tentang kemustahilan: “Bagaimana mungkin Iblis mengusir Iblis?”'
  alternative: “Bagaimana Iblis dapat mengusir Iblis?”
  rationale: Bahasa Yunani mempertanyakan kemungkinan tindakan tersebut. Rumusan ini mempertahankan daya retoris dan ketegangan teks tanpa menambahkan penjelasan doktrinal bahwa Iblis pasti tidak mungkin bertindak demikian.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama Yesus disebut kembali untuk memperjelas subjek yang tersirat dalam bentuk verba Yunani. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal yang perlu dijelaskan di luar teks utama.
