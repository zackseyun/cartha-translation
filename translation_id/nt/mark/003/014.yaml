  source_fidelity: Draf tepat menerjemahkan ἐποίησεν sebagai tindakan penetapan dan tidak memasukkan gelar “rasul” ke dalam teks utama. Namun, “untuk menyertai-Nya” kurang langsung untuk ἵνα ὦσιν μετ’ αὐτοῦ, yang menyatakan bahwa mereka berada bersama Dia, dan “memberitakan kabar” menambahkan nomina yang tidak ada dalam teks Yunani serta tidak alami dalam ragam baku.
  naturalness: 'Kalimat revisi mempertahankan dua klausa tujuan ἵνα secara eksplisit dan memakai ungkapan Indonesia modern yang wajar: “supaya mereka bersama Dia” dan “mengutus mereka untuk memberitakan.” Koma terakhir dipertahankan karena struktur kalimat berlanjut pada ayat berikutnya.'
  terminology: “Menetapkan dua belas orang” sesuai konteks pembentukan kelompok tanpa mengimpor “rasul.” “Memberitakan” merupakan padanan yang lazim bagi κηρύσσειν; alternatif “memaklumkan” layak dicantumkan. Catatan varian diperjelas menjadi “yang juga dinamai-Nya rasul,” sesuai makna pembacaan yang lebih panjang.
  issues:
