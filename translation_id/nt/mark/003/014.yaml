  text: And he appointed twelve[a], so that they might be with him and so that he might send them out to preach[b],
translation:
  language: id
  text: Ia menetapkan dua belas orang[a] supaya mereka bersama Dia dan supaya Dia mengutus mereka untuk memberitakan,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah menambahkan, “yang juga dinamai-Nya rasul.”
