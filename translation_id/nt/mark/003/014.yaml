    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: menetapkan
  rationale: Walaupun secara dasar dapat berarti 'membuat', dalam konteks ini verba tersebut menyatakan tindakan membentuk atau menetapkan suatu kelompok. 'Menetapkan' alami dalam bahasa Indonesia dan tidak memberi kesan bahwa mereka diciptakan.
- source_word: δώδεκα
  choice: dua belas orang
  rationale: Teks Yunani hanya menyebut 'dua belas' tanpa nomina. Bahasa Indonesia lebih alami dengan menambahkan penggolong 'orang', tanpa memasukkan gelar 'rasul' yang tidak terdapat dalam teks utama SBLGNT.
- source_word: ἵνα ὦσιν μετ’ αὐτοῦ
  choice: untuk menyertai-Nya
  rationale: ἵνα dengan bentuk subjungtif menyatakan tujuan. 'Untuk menyertai-Nya' menyampaikan tujuan itu secara ringkas dan alami; 'menyertai' di sini berarti berada bersama Dia.
- source_word: ἀποστέλλῃ
  choice: untuk diutus-Nya
  rationale: Bentuk ini berarti bahwa Yesus akan mengutus mereka. Susunan pasif 'diutus-Nya' mempertahankan Yesus sebagai pelaku dan sesuai dengan kesejajaran dua tujuan dalam kalimat.
- source_word: κηρύσσειν
  choice: memberitakan kabar
  rationale: Verba ini berarti menyampaikan atau memaklumkan pesan di depan umum. 'Memberitakan kabar' dapat dipahami pembaca umum dan menjaga objek pesannya tetap tidak dinyatakan secara khusus dalam ayat ini.
theological_decisions:
- issue: Apakah gelar 'rasul' yang tersirat perlu dimasukkan ke dalam teks utama
  choice: Tidak menambahkan 'rasul' dalam teks utama.
  alternative: Ia menetapkan dua belas orang, yang juga disebut-Nya rasul, ...
  rationale: Teks utama SBLGNT yang diberikan hanya berbunyi bahwa Ia menetapkan dua belas. Frasa mengenai penamaan mereka sebagai rasul merupakan varian naskah dan karena itu dicatat dalam catatan kaki, bukan dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia. Struktur dua tujuan dipertahankan, dan tanda koma akhir mengikuti kenyataan bahwa ayat ini berlanjut ke ayat berikutnya.
