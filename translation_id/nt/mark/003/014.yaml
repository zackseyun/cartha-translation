    issue: “untuk menyertai-Nya” tidak secara paling jelas menyatakan “mereka berada bersama Dia.”
    rationale: Frasa μετ’ αὐτοῦ berarti “bersama dia”; “menyertai-Nya” dapat lebih mudah dipahami sebagai mengikuti atau menemani Dia dalam perjalanan. Struktur tujuan eksplisit juga lebih dekat dengan dua klausa ἵνα.
  - severity: medium
    issue: “memberitakan kabar” menambahkan “kabar” dan terdengar tidak idiomatis.
    rationale: κηρύσσειν di sini tidak memiliki objek tersurat. “Memberitakan” dapat berdiri sendiri dalam bahasa Indonesia dan mempertahankan keterbukaan objek dalam sumber.
  - severity: low
    issue: Rumusan catatan varian “yang juga disebut-Nya rasul” kurang tepat untuk unsur penamaan.
    rationale: Pembacaan varian menyatakan bahwa ia “menamai” mereka rasul; “yang juga dinamai-Nya rasul” lebih langsung dan alami.
