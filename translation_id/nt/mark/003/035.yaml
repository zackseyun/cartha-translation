id: MRK.3.35
reference: Mark 3:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς ⸀γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ θεοῦ, οὗτος ἀδελφός μου καὶ ⸀ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/035.yaml
  text: For whoever does the will of God, this one is my brother and sister and mother.
translation:
  language: id
  text: Sebab siapa pun yang melakukan kehendak Allah, dialah[a] saudara laki-laki-Ku, saudara perempuan-Ku, dan ibu-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “orang inilah.”'
    reason: Menjelaskan tekanan demonstratif pada οὗτος yang diterjemahkan secara alami dengan “dialah”.
lexical_decisions:
- source_word: ὃς ... ἂν ποιήσῃ
  choice: siapa pun yang melakukan
  rationale: Gabungan pronomina relatif, ἄν, dan subjungtif aoris menyatakan syarat umum yang tidak tertentu. Ungkapan ini secara alami berarti “siapa pun yang melakukan” dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ menjelaskan alasan bagi pernyataan sebelumnya. “Sebab” mempertahankan hubungan penjelas itu dengan jelas dan wajar.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: kehendak Allah
  rationale: Padanan langsung dan lazim yang mempertahankan hubungan genitif tanpa penjelasan tambahan.
- source_word: οὗτος
  choice: dialah
  rationale: Bentuk “dialah” menyampaikan tekanan demonstratif pada οὗτος secara alami dalam bahasa Indonesia dan tidak membatasi acuannya pada laki-laki.
- source_word: ἀδελφός μου καὶ ἀδελφὴ καὶ μήτηρ
  choice: saudara laki-laki-Ku, saudara perempuan-Ku, dan ibu-Ku
  rationale: Istilah kekerabatan yang konkret dipertahankan satu per satu. Unsur kepunyaan diulang agar hubungan setiap sebutan dengan Yesus jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Representasi gender pada subjek tunggal dengan sebutan kekerabatan laki-laki dan perempuan
  choice: dialah
  alternative: orang itu / ia
  rationale: “Dialah” mempertahankan subjek tunggal dan penekanan demonstratif tanpa memberi kesan bahwa pernyataan ini hanya berlaku bagi laki-laki; daftar predikatnya sendiri menyebut peran laki-laki dan perempuan.
- issue: Sifat bahasa keluarga yang dipakai Yesus
  choice: mempertahankan sebutan konkret “saudara laki-laki”, “saudara perempuan”, dan “ibu”
  alternative: anggota keluarga-Ku
  rationale: Generalisasi menjadi “anggota keluarga” akan menghilangkan susunan retoris dan daya teologis dari tiga istilah kekerabatan yang dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Sebab” menjaga kaitan dengan ayat sebelumnya; “dialah” memberi penekanan yang alami; kapital pada akhiran pronominal dalam “-Ku” mengikuti konvensi penulisan rujukan kepada Yesus.
