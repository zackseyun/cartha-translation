reference: Mark 3:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὰ πνεύματα τὰ ἀκάθαρτα, ὅταν αὐτὸν ⸂ἐθεώρουν, προσέπιπτον⸃ αὐτῷ καὶ ⸀ἔκραζον ⸀λέγοντα ὅτι Σὺ εἶ ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/011.yaml
  text: And whenever the unclean spirits saw him[a], they fell down before him and cried out, saying, “You are the Son of God.”
translation:
  language: id
  text: Setiap kali roh-roh najis melihat Dia, mereka tersungkur[a] di hadapan-Nya dan berteriak, “Engkaulah Anak Allah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjatuhkan diri di hadapan-Nya.” Kata kerja Yunani yang dipakai dapat berarti tersungkur di hadapan seseorang sebagai tanda ketundukan atau permohonan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα τὰ ἀκάθαρτα
  choice: roh-roh najis
  rationale: Padanan langsung ini mempertahankan istilah khas Injil serta cakupan makna ritual dan moral dari ἀκάθαρτα tanpa mempersempitnya menjadi sekadar ‘jahat’.
- source_word: ὅταν
  choice: setiap kali
  rationale: Dengan verba-verba imperfek yang mengikutinya, ὅταν menunjukkan kejadian berulang; ‘setiap kali’ menyampaikan daya iteratif itu secara alami.
- source_word: ἐθεώρουν
  choice: melihat
  rationale: Dalam konteks naratif ini, ‘melihat’ merupakan padanan alami dan memadai; unsur keberulangan sudah dinyatakan oleh ‘setiap kali’.
- source_word: προσέπιπτον αὐτῷ
  choice: tersungkur di hadapan-Nya
  rationale: Ungkapan ini mempertahankan tindakan fisik menjatuhkan diri di hadapan seseorang, tanpa memastikan apakah motifnya penyembahan, permohonan, atau ketundukan.
- source_word: ἔκραζον
  choice: berteriak
  rationale: ‘Berteriak’ menyampaikan kuatnya suara yang terkandung dalam κράζω secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: λέγοντα
  choice: —
  rationale: Partisipel ‘sambil berkata/mengatakan’ dilebur secara alami ke dalam kutipan langsung setelah ‘berteriak’; isi teriakan itu sendiri sudah menyatakan apa yang mereka katakan.
- source_word: Σὺ εἶ
  choice: Engkaulah
  rationale: Bentuk ini menyampaikan penekanan dari pronomina eksplisit Σὺ secara alami dalam pernyataan langsung yang khidmat.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Anak Allah
  rationale: Padanan ini mempertahankan bentuk gelar dan bobot kristologis ungkapan Yunani tanpa parafrasa.
theological_decisions:
- issue: Apakah tindakan roh-roh najis di hadapan Yesus harus diterjemahkan sebagai penyembahan atau sebagai tindakan tersungkur
  choice: Diterjemahkan ‘tersungkur di hadapan-Nya’ tanpa memakai ‘menyembah’.
  alternative: ‘menyembah-Nya’ atau ‘sujud kepada-Nya’
  rationale: προσπίπτω dapat menggambarkan tindakan menjatuhkan diri dalam penghormatan, permohonan, atau ketundukan yang terpaksa. Ayat ini tidak secara eksplisit menyebut tindakan itu sebagai penyembahan, sehingga terjemahan mempertahankan tindakan fisiknya dan membiarkan makna teologisnya tetap terbuka menurut konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Roh-roh najis’ mempertahankan istilah Injil yang dikenal luas; ‘Engkaulah’ menjaga penekanan dan nada khidmat ucapan tersebut. Kapitalisasi pronomina yang merujuk kepada Yesus dipakai secara konsisten.
