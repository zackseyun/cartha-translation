  text: Καὶ εἰσῆλθεν πάλιν ⸀εἰς συναγωγήν, καὶ ἦν ἐκεῖ ἄνθρωπος ἐξηραμμένην ἔχων τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/001.yaml
  text: And he entered a synagogue again[c][b][a], and a man was there with a withered hand.
translation:
  language: id
  text: Ia masuk lagi ke sebuah sinagoge, dan di situ ada seseorang yang salah satu tangannya layu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “salah satu tangannya mengering” atau “salah satu tangannya mengerut.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: masuk
  rationale: Bentuk aoris εἰσέρχομαι menyatakan tindakan memasuki suatu tempat; 'masuk' merupakan padanan naratif yang langsung dan alami.
- source_word: πάλιν
  choice: lagi
  rationale: πάλιν menandai pengulangan tindakan; 'lagi' alami dalam narasi Indonesia modern.
- source_word: εἰς συναγωγήν
  choice: ke sebuah rumah ibadat
  rationale: εἰς menyatakan gerak menuju dan masuk ke suatu tempat, sedangkan συναγωγήν tidak berartikel. 'Ke sebuah rumah ibadat' mempertahankan ketidakspesifikan itu dan cocok dengan verba 'masuk' dalam bahasa Indonesia.
- source_word: ἦν ἐκεῖ
  choice: di situ ada
  rationale: Susunan ini secara alami memperkenalkan seseorang yang hadir di lokasi tersebut sekaligus mempertahankan unsur lokatif ἐκεῖ.
- source_word: ἄνθρωπος
  choice: seorang
  rationale: Dalam konstruksi Indonesia ini, 'seorang' sudah secara alami menunjuk seorang manusia tanpa perlu menambahkan kata 'laki-laki', yang tidak dinyatakan secara leksikal oleh ἄνθρωπος.
- source_word: ἐξηραμμένην
  choice: layu
  rationale: Partisipel perfek ξηραίνω menggambarkan tangan yang telah mengering atau mengalami penyusutan/kelumpuhan. 'Layu' ringkas, lazim dalam konteks ini, dan mempertahankan citra dasarnya.
- source_word: ἔχων τὴν χεῖρα
  choice: yang salah satu tangannya layu
  rationale: Konstruksi ini menyampaikan keadaan tangan orang tersebut secara alami dalam bahasa Indonesia. 'Salah satu tangannya' mencegah kesan bahwa kedua tangannya terkena keadaan itu tanpa menentukan tangan kanan atau kiri.
