  register: Bahasa Indonesia baku-modern dengan gaya naratif yang sederhana dan bermartabat. Pronomina 'Ia' dipakai karena referennya berlanjut dari konteks sebelumnya. 'Rumah ibadat' dipilih sebagai istilah umum yang mudah dipahami untuk συναγωγή.
