  text: but whoever blasphemes against the Holy Spirit never has forgiveness[c][b][a], but is guilty of an eternal sin.
translation:
  language: id
  text: Namun, siapa pun yang menghujat Roh Kudus tidak akan pernah mendapat pengampunan[a], melainkan bersalah atas dosa kekal[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak mempunyai pengampunan sampai selama-lamanya,” yaitu, “tidak pernah mendapat pengampunan” atau “tidak mendapat pengampunan untuk selama-lamanya.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “bertanggung jawab atas dosa kekal.”
    reason: lexical_alternative
  - marker: c
    text: Sejumlah naskah berbunyi “penghakiman kekal” atau “hukuman kekal,” bukan “dosa kekal.”
    reason: textual_variant
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: Namun, siapa pun yang
  rationale: ὃς dengan ἄν membentuk klausa relatif tak tentu, yang secara alami diterjemahkan “siapa pun yang.” δέ menyatakan pertentangan ringan dengan ayat sebelumnya, sehingga “namun” sesuai.
- source_word: βλασφημήσῃ
  choice: menghujat
  rationale: Kata “menghujat” mempertahankan bobot religius dan teologis βλασφημέω, sedangkan bentuk kini dalam bahasa Indonesia menyampaikan sifat umum dari konstruksi Yunani tersebut.
- source_word: εἰς τὸ πνεῦμα τὸ ἅγιον
  choice: Roh Kudus
  rationale: Dengan βλασφημέω, εἰς menandai sasaran penghujatan. Dalam bahasa Indonesia, verba “menghujat” dapat langsung mengambil objek, sehingga “menghujat Roh Kudus” lebih alami daripada “menghujat terhadap Roh Kudus.”
- source_word: οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα
  choice: tidak akan pernah mendapat pengampunan
  rationale: Ungkapan harfiah “tidak memiliki pengampunan sampai ke zaman” bermakna tidak mendapat pengampunan untuk selama-lamanya. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya temporal εἰς τὸν αἰῶνα.
- source_word: ἀλλὰ
  choice: melainkan
  rationale: ἀλλά menyatakan pertentangan kuat setelah klausa negatif; “melainkan” merupakan padanan Indonesia yang tepat dalam susunan “tidak ..., melainkan ...”.
- source_word: ἔνοχός ἐστιν
  choice: bersalah karena
  rationale: ἔνοχος dapat berarti “bersalah” atau “terkena/menanggung tanggung jawab atas.” Dengan genitif ἁμαρτήματος, “bersalah karena dosa” merupakan ungkapan yang jelas dan wajar, sementara kemungkinan “menanggung dosa” dicatat dalam catatan kaki.
- source_word: αἰωνίου ἁμαρτήματος
  choice: dosa yang kekal
  rationale: Teks SBLGNT membaca ἁμαρτήματος, “dosa,” dan αἰωνίου berarti “kekal.” Terjemahan ini mengikuti teks tercetak tanpa menggantinya dengan varian “penghakiman” atau “hukuman.”
theological_decisions:
- issue: Hakikat penghujatan yang tidak mendapat pengampunan
  choice: Mempertahankan rumusan langsung “menghujat Roh Kudus” tanpa menambahkan penjelasan doktrinal.
  alternative: Menjelaskannya sebagai penolakan yang disengaja dan terus-menerus terhadap kesaksian Roh, atau sebagai penyebutan karya Roh sebagai karya kuasa jahat.
  rationale: Konteks dekat membantu pembaca memahami perkataan ini, tetapi ayat tersebut sendiri hanya menyebut penghujatan terhadap Roh Kudus. Terjemahan tidak seharusnya menyelesaikan ketegangan teologis dengan memasukkan tafsiran ke dalam teks.
- issue: Varian tekstual pada akhir ayat
  choice: Menerjemahkan bacaan SBLGNT “dosa yang kekal.”
  alternative: “penghakiman kekal” atau “hukuman kekal.”
  rationale: Sumber Yunani yang diberikan membaca αἰωνίου ἁμαρτήματος. Varian yang dikenal luas tetap dicatat agar keputusan tekstual transparan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan lugas. “Menghujat” dipertahankan karena dikenal luas serta membawa bobot keagamaan yang sesuai. Susunan “tidak ..., melainkan ...” menjaga kontras Yunani dengan alami.
