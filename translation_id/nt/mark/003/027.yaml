id: MRK.3.27
reference: Mark 3:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂ἀλλ’ οὐδεὶς δύναται⸃ ⸂εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν τὰ σκεύη⸃ αὐτοῦ διαρπάσαι ἐὰν μὴ πρῶτον τὸν ἰσχυρὸν δήσῃ, καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/027.yaml
  text: But no one can enter the house of the strong man and plunder his goods unless he first ties up the strong man[b][a]; then indeed he will plunder his house.
translation:
  language: id
  text: Namun, tidak seorang pun dapat masuk ke rumah orang kuat dan merampas barang-barangnya[a], kecuali ia terlebih dahulu mengikat orang kuat itu[b]. Sesudah itu, barulah ia akan merampas rumahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “harta miliknya”; secara lebih harfiah, “bejana-bejana” atau “benda-bendanya.”
    reason: lexical_alternative
  - marker: b
    text: Dalam konteksnya, “orang kuat” merupakan bagian dari kiasan Yesus tentang mengalahkan Iblis; teks utama mempertahankan gambaran kiasan itu.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Namun
  rationale: Menandai pertentangan dengan tuduhan sebelumnya secara alami dalam bahasa Indonesia.
- source_word: οὐδεὶς δύναται
  choice: tidak seorang pun dapat
  rationale: Menyatakan ketidakmungkinan dengan jelas dan bermartabat.
- source_word: εἰς τὴν οἰκίαν ... εἰσελθὼν
  choice: masuk ke rumah
  rationale: Mengalihkan konstruksi partisip Yunani menjadi susunan Indonesia yang wajar tanpa menghilangkan tindakan masuk.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: orang kuat
  rationale: Mempertahankan adjektiva substantival dan pengulangan metaforis dalam teks sumber.
- source_word: τὰ σκεύη αὐτοῦ
  choice: barang-barangnya
  rationale: Dalam konteks perampasan rumah, istilah ini menunjuk pada benda-benda atau harta milik; pilihan ini lebih alami daripada terjemahan harfiah 'bejana-bejananya'.
- source_word: διαρπάσαι / διαρπάσει
  choice: merampas
  rationale: Mempertahankan nuansa mengambil dengan paksa dan memakai padanan yang sama pada kedua kemunculannya.
- source_word: ἐὰν μὴ πρῶτον
  choice: jika ia tidak terlebih dahulu
  rationale: Menjaga syarat negatif dan urutan waktu yang ditegaskan teks Yunani.
- source_word: δήσῃ
  choice: mengikat
  rationale: Padanan langsung dan alami bagi tindakan membelenggu atau mengikat dalam gambaran ini.
- source_word: καὶ τότε
  choice: Sesudah itu, barulah
  rationale: Menegaskan bahwa perampasan baru berlangsung setelah orang kuat itu diikat.
- source_word: τὴν οἰκίαν αὐτοῦ διαρπάσει
  choice: ia akan merampas rumahnya
  rationale: Mempertahankan bentuk masa depan serta gambaran konkret tentang rumah sebagai keseluruhan wilayah milik orang kuat.
theological_decisions:
- issue: Daya metaforis 'orang kuat' dalam argumentasi Yesus mengenai Satan
  choice: Mempertahankan ungkapan 'orang kuat' dalam teks utama.
  alternative: Menjelaskannya langsung sebagai Satan dalam teks utama.
  rationale: Konteks menunjukkan bahwa gambaran ini berkaitan dengan tindakan mengalahkan Satan, tetapi teks Yunani menyajikannya sebagai metafora. Terjemahan mempertahankan gambaran dan ketegangan penafsirannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Struktur kalimat dibuat alami, sementara pengulangan 'orang kuat', 'rumah', dan 'merampas' dipertahankan untuk menjaga jalinan metafora sumber.
