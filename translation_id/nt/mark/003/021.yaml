revisions:
- from: Ketika orang-orang yang dekat dengan-Nya mendengar hal itu,[a] mereka pergi untuk membawa-Nya secara paksa, sebab mereka berkata, “Ia sudah tidak waras.”[b]
  to: Ketika orang-orang yang dekat dengan-Nya mendengar hal itu,[a] mereka berangkat untuk menangkap-Nya, sebab mereka berkata, “Ia tidak waras.”[b]
  rationale: Revisi mengganti ungkapan yang terlalu berfokus pada membawa seseorang dengan padanan yang lebih dekat bagi κρατῆσαι, sambil menghindari kesan bahwa penangkapan itu pasti tindakan hukum. Penanda aspek “sudah” dihapus agar tuduhan ἐξέστη diterjemahkan secara netral. Ambiguitas identitas kelompok tersebut, register, dan penandaan catatan kaki dipertahankan.
