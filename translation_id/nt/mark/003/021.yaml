  text: καὶ ἀκούσαντες οἱ παρ’ αὐτοῦ ἐξῆλθον κρατῆσαι αὐτόν, ἔλεγον γὰρ ὅτι ἐξέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/021.yaml
  text: And when those close to him heard[a], they went out to seize him, for they were saying[b], “He is out of his mind.”
translation:
  language: id
  text: Ketika orang-orang yang dekat dengan-Nya mendengar hal itu,[a] mereka berangkat untuk menangkap-Nya, sebab mereka berkata, “Ia tidak waras.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keluarga-Nya” atau “orang-orang-Nya sendiri”; ungkapan Yunani ini bersifat idiomatis dan dapat secara khusus menunjuk kepada orang-orang dalam rumah tangga atau lingkaran dekat Yesus.
    reason: alternative_reading
  - marker: b
    text: Atau “Ia sudah kehilangan akal” atau “Ia tidak dapat menguasai diri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρ’ αὐτοῦ
  choice: orang-orang yang dekat dengan-Nya
  rationale: Ungkapan Yunani ini bersifat idiomatis dan dapat menunjuk kepada keluarga, orang-orang serumah, atau lingkaran dekat Yesus. Pilihan ini alami dalam bahasa Indonesia sekaligus mempertahankan ketidakjelasan rujukannya.
- source_word: ἀκούσαντες
  choice: ketika ... mendengar hal itu
  rationale: Partisip aoris dipahami secara temporal. Penambahan 'hal itu' membuat objek tersiratnya wajar dalam bahasa Indonesia tanpa menentukan secara berlebihan apa tepatnya yang mereka dengar.
- source_word: ἐξῆλθον
  choice: mereka pergi
  rationale: Kata kerja ini menandai gerak keluar atau berangkat. 'Pergi' terdengar alami dalam konteks narasi Indonesia dan tidak memaksakan titik asal yang tidak disebutkan.
- source_word: κρατῆσαι
  choice: untuk membawa-Nya secara paksa
  rationale: κρατέω berarti memegang atau menguasai seseorang dengan kekuatan. Dalam konteks ini, pilihan tersebut menyampaikan tindakan paksa tanpa menjadikannya penangkapan resmi atau secara interpretatif membatasinya pada tindakan menahan.
- source_word: ἔλεγον
  choice: mereka berkata
  rationale: Bentuk imperfek dapat menggambarkan ujaran yang sedang berlangsung atau berulang. Bahasa Indonesia tidak selalu menandai aspek ini secara eksplisit; 'mereka berkata' paling alami, sedangkan nuansa berulang tidak cukup pasti untuk menerjemahkan 'terus berkata'.
- source_word: ἐξέστη
  choice: Ia sudah tidak waras
  rationale: Dalam konteks ini, bentuk tersebut menyatakan penilaian bahwa Yesus telah kehilangan kewarasan atau tidak dapat menguasai diri. 'Sudah tidak waras' jelas, modern, dan tetap merupakan tuduhan pihak yang berbicara, bukan pernyataan narator.
theological_decisions:
- issue: Identitas οἱ παρ’ αὐτοῦ
  choice: orang-orang yang dekat dengan-Nya
  alternative: keluarga-Nya; orang-orang-Nya sendiri; rekan-rekan-Nya
  rationale: Konteks berikutnya membuat keluarga Yesus sangat mungkin dimaksudkan, tetapi ungkapan Yunani ini bukan istilah kekerabatan yang eksplisit. Teks utama karena itu mempertahankan cakupan yang lebih luas, sementara kemungkinan 'keluarga-Nya' dicatat dalam catatan kaki.
- issue: Kekuatan dan tujuan κρατῆσαι
  choice: membawa-Nya secara paksa
  alternative: menangkap-Nya; memegang-Nya; menahan-Nya
  rationale: '''Menangkap'' dapat menyiratkan tindakan hukum, sedangkan ''menahan'' terlalu cepat menetapkan tujuan mereka. Pilihan utama mempertahankan unsur penggunaan kekuatan tanpa menambahkan kerangka hukum atau motif tertentu.'
- issue: Status ucapan ἐξέστη
  choice: ditampilkan sebagai penilaian orang-orang yang dekat dengan Yesus
  alternative: pernyataan faktual narator bahwa Yesus tidak waras
  rationale: Secara sintaksis, alasan tindakan mereka adalah apa yang mereka katakan. Tanda kutip mempertahankan jarak naratif dan mencegah tuduhan itu dibaca sebagai penilaian penulis Injil sendiri.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas penerbitan Alkitab bahasa Indonesia. Susunan kalimat dibuat lancar bagi pembaca umum sambil menjaga ambiguitas ungkapan tentang orang-orang yang dekat dengan Yesus dan mempertahankan tuduhan tentang kewarasan sebagai ucapan mereka.
