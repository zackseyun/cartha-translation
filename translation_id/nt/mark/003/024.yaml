  text: καὶ ἐὰν βασιλεία ἐφ’ ἑαυτὴν μερισθῇ, οὐ δύναται σταθῆναι ἡ βασιλεία ἐκείνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/024.yaml
  text: And if a kingdom is divided against itself, that kingdom cannot stand.
translation:
  language: id
  text: Dan jika suatu kerajaan terpecah dalam pertentangan internal, kerajaan itu tidak dapat bertahan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Mempertahankan hubungan langsung dengan argumen pada ayat sebelumnya secara wajar dalam bahasa Indonesia.
- source_word: ἐὰν
  choice: jika
  rationale: Menyatakan syarat dengan alami dan tetap mempertahankan sifat umum dari pernyataan ini.
- source_word: βασιλεία
  choice: kerajaan
  rationale: Sesuai dengan gambaran kesatuan politik dan sosial dalam perumpamaan ini; lebih konkret daripada 'pemerintahan'.
- source_word: ἐφ’ ἑαυτὴν
  choice: melawan dirinya sendiri
  rationale: Mengungkapkan pertentangan internal sebagaimana dimaksud oleh idiom Yunani tersebut.
- source_word: μερισθῇ
  choice: terpecah
  rationale: Menunjukkan keadaan terbagi secara internal tanpa menambahkan penyebab perpecahan; bentuk 'ter-' terasa lebih alami daripada konstruksi pasif harfiah dalam konteks ini.
- source_word: οὐ δύναται
  choice: tidak dapat
  rationale: Padanan Indonesia yang lugas bagi ketidakmampuan.
- source_word: σταθῆναι
  choice: bertahan
  rationale: Dalam konteks kerajaan, kata ini menyampaikan makna tetap berdiri atau terus ada dengan bahasa Indonesia yang alami.
- source_word: ἡ βασιλεία ἐκείνη
  choice: kerajaan itu
  rationale: Mempertahankan pengulangan nomina dan penunjuk yang memberi penegasan dalam teks Yunani.
theological_decisions:
- issue: Sifat pernyataan
  choice: Diterjemahkan sebagai prinsip umum dalam rangkaian argumen Yesus, tanpa memperluasnya menjadi klaim doktrinal atau politik.
  alternative: Menjadikannya pepatah luas tentang semua lembaga politik atau secara eksplisit mengaitkannya dengan doktrin mengenai Iblis.
  rationale: Ayat ini berfungsi sebagai analogi dalam sanggahan Yesus. Terjemahan mempertahankan daya ungkapnya tanpa memasukkan kesimpulan yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'kerajaan' dipertahankan demi tekanan retoris, sedangkan 'bertahan' dipilih sebagai ungkapan alami bagi metafora tetap berdiri.
