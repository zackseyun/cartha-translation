  to: Para ahli Taurat yang turun dari Yerusalem terus berkata, “Ia dikuasai Beelzebul[a][b],” dan, “Dengan kuasa penguasa setan-setan[c], Ia mengusir setan-setan.”
  rationale: Revisi hanya mengganti konstruksi yang tidak alami (‘datang turun’) dengan ‘turun’ dan memindahkan jangkar catatan kaki Beelzebul ke nama yang diterangkannya. Terjemahan mempertahankan aspek berkelanjutan/berulang dari ἔλεγον melalui ‘terus berkata’, idiom tuduhan tanpa mengharuskan satu penafsiran dogmatis, serta pengulangan ‘setan-setan’ dalam teks Yunani.
