  text: καὶ οἱ γραμματεῖς οἱ ἀπὸ Ἱεροσολύμων καταβάντες ἔλεγον ὅτι Βεελζεβοὺλ ἔχει καὶ ὅτι ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/022.yaml
  text: And the scribes who had come down from Jerusalem were saying[a], “He has Beelzebul,” and[c][b], “By the ruler of the demons he casts out the demons.”
translation:
  language: id
  text: Para ahli Taurat yang turun dari Yerusalem terus berkata, “Ia dikuasai Beelzebul[a][b],” dan, “Dengan kuasa penguasa setan-setan[c], Ia mengusir setan-setan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Ia mempunyai Beelzebul”; maksudnya dapat dipahami sebagai “Ia kerasukan Beelzebul.”
    reason: lexical_alternative
  - marker: b
    text: Beelzebul adalah bentuk nama dalam teks Yunani; secara tradisional juga disebut “Beelzebub.”
    reason: alternative_reading
  - marker: c
    text: Atau “pemimpin setan-setan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: ahli Taurat
  rationale: Dalam konteks Injil, istilah ini menunjuk kepada pakar dan pengajar hukum Taurat, bukan sekadar penyalin naskah. Bentuk ini jelas dan lazim bagi pembaca Indonesia.
- source_word: ἀπὸ Ἱεροσολύμων καταβάντες
  choice: yang datang turun dari Yerusalem
  rationale: Klausa relatif menghasilkan bahasa Indonesia yang alami, sedangkan 'turun' mempertahankan arah geografis yang dinyatakan oleh καταβάντες.
- source_word: ἔλεγον
  choice: terus berkata
  rationale: Bentuk imperfek menggambarkan perkataan yang sedang berlangsung atau diulang, bukan hanya satu ucapan sesaat.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Bentuk ini mentransliterasikan ejaan Yunani sumber secara langsung; bentuk tradisional 'Beelzebub' dicatat dalam catatan kaki.
- source_word: Βεελζεβοὺλ ἔχει
  choice: Ia dikuasai Beelzebul
  rationale: Ungkapan harfiah 'mempunyai Beelzebul' mudah disalahpahami dalam bahasa Indonesia sebagai kepemilikan. 'Dikuasai' menyampaikan tuduhan bahwa Yesus berada di bawah kuasa atau pengaruh Beelzebul tanpa mempersempitnya secara mutlak menjadi kerasukan; bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: ἐν τῷ ἄρχοντι τῶν δαιμονίων
  choice: Dengan kuasa penguasa setan-setan
  rationale: ἐν berfungsi secara instrumental atau asosiatif dalam tuduhan ini. 'Dengan kuasa' menyatakan bahwa tindakan itu dituduhkan berlangsung melalui kuasa penguasa dunia setan.
- source_word: δαιμονίων / δαιμόνια
  choice: setan-setan
  rationale: Kata δαιμόνιον secara langsung menunjuk kepada makhluk-makhluk jahat. 'Setan-setan' merupakan padanan Indonesia yang umum dan tidak mencampurkannya dengan ungkapan Yunani berbeda yang berarti 'roh-roh najis'.
- source_word: ἐκβάλλει
  choice: mengusir
  rationale: Dalam konteks eksorsisme, 'mengusir' secara alami menyampaikan tindakan memaksa setan keluar.
theological_decisions:
- issue: Makna tuduhan Βεελζεβοὺλ ἔχει
  choice: Ia dikuasai Beelzebul
  alternative: Ia mempunyai Beelzebul; Ia kerasukan Beelzebul
  rationale: Pilihan utama menghindari kesan kepemilikan yang keliru dalam bahasa Indonesia, tetapi tetap menyisakan kemungkinan kuasa, pengaruh, atau kerasukan. Catatan kaki mempertahankan bentuk harfiah dan penjelasan yang lebih eksplisit tanpa memaksakan salah satunya ke dalam teks utama.
- issue: Makna instrumental ἐν dan gelar ἄρχων
  choice: Dengan kuasa penguasa setan-setan
  alternative: Melalui pemimpin setan-setan; dengan kuasa penghulu setan-setan
  rationale: Frasa utama menyampaikan tuduhan bahwa kuasa untuk mengusir setan berasal dari penguasa mereka. 'Penguasa' adalah bahasa modern yang jelas dan tidak membawa nuansa kebangsawanan dari kata 'pangeran'.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Para ahli Taurat' menghindari kesalahpahaman bahwa mereka hanya penyalin. 'Terus berkata' mempertahankan aspek berulang dari bentuk imperfek. Susunan tuduhan dibuat alami dalam bahasa Indonesia sambil mempertahankan pengulangan 'setan-setan' dari teks Yunani.
