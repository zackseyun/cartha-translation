  text: καὶ Ἰούδαν ⸀Ἰσκαριώθ, ὃς καὶ παρέδωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/019.yaml
  text: and Judas Iscariot[a], who also betrayed him.
translation:
  language: id
  text: dan Yudas Iskariot[a], yang juga mengkhianati Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang juga menyerahkan Dia.” Kata kerja Yunani yang dipakai dapat berarti “menyerahkan”; di sini dipilih “mengkhianati” karena tindakan Yudas terhadap Yesus mengandung makna itu dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung biasa yang mengaitkan nama terakhir ini dengan daftar para rasul sebelumnya.
- source_word: Ἰούδαν
  choice: Yudas
  rationale: Nama pribadi ditransliterasikan menurut bentuk baku dalam bahasa Indonesia.
- source_word: Ἰσκαριώθ
  choice: Iskariot
  rationale: Sebutan diri ini ditransliterasikan menurut bentuk baku; asal katanya tidak cukup pasti untuk diterjemahkan secara spekulatif.
- source_word: ὃς
  choice: yang
  rationale: Pronomina relatif yang secara alami memperkenalkan keterangan tentang Yudas.
- source_word: καὶ
  choice: juga
  rationale: Dalam klausa relatif ini, καί berfungsi secara adverbial dan menandai ciri tambahan yang mengidentifikasi Yudas.
- source_word: παρέδωκεν
  choice: mengkhianati
  rationale: Secara leksikal verba ini dapat berarti menyerahkan, tetapi ketika Yudas menjadi pelaku dan Yesus menjadi objek, konteks Injil memberi tindakan itu makna pengkhianatan.
- source_word: αὐτόν
  choice: Dia
  rationale: Pronomina objek ini merujuk kepada Yesus; huruf kapital mengikuti kebiasaan bahasa Indonesia untuk pronomina yang merujuk kepada Tuhan tanpa menambahkan unsur makna baru.
theological_decisions:
- issue: Pemaknaan παραδίδωμι untuk tindakan Yudas terhadap Yesus
  choice: mengkhianati
  alternative: menyerahkan
  rationale: Verba Yunani dasarnya menyatakan tindakan menyerahkan seseorang dan tidak selalu mengandung arti pengkhianatan. Namun, dalam konteks Yudas dan Yesus, 'mengkhianati' menyampaikan bobot naratif dan moral tindakan tersebut. Alternatif yang lebih harfiah dipertahankan dalam catatan kaki agar keluasan makna sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan dipertahankan sebagai kelanjutan daftar pada ayat sebelumnya; pilihan 'mengkhianati' alami bagi pembaca umum, sedangkan arti leksikal yang lebih luas dicatat dalam catatan kaki.
