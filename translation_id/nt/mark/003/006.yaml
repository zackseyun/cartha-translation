  text: καὶ ἐξελθόντες οἱ Φαρισαῖοι ⸀εὐθὺς μετὰ τῶν Ἡρῳδιανῶν συμβούλιον ⸀ἐδίδουν κατ’ αὐτοῦ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/006.yaml
  text: And the Pharisees went out and immediately began plotting with the Herodians against him[a], how they might destroy him.
translation:
  language: id
  text: Lalu orang-orang Farisi keluar dan segera bersekongkol dengan para pendukung Herodes untuk melawan Yesus, mencari cara untuk membinasakan Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam konteks ini, dapat juga diterjemahkan secara lebih eksplisit: “membunuh Dia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: keluar
  rationale: Partisip aoris ini menyertai tindakan utama dan secara alami diterjemahkan sebagai tindakan berurutan dalam narasi Indonesia.
- source_word: εὐθὺς
  choice: segera
  rationale: Mempertahankan kesan mendesak yang khas dalam narasi Markus.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: dengan para pendukung Herodes
  rationale: μετά dengan genitif menyatakan kebersamaan. Sebutan ini menunjuk kepada kelompok yang berpihak pada kepentingan dinasti Herodes; terjemahan deskriptif lebih mudah dipahami daripada transliterasi 'orang-orang Herodian'.
- source_word: συμβούλιον ἐδίδουν
  choice: bersekongkol
  rationale: Ungkapan ini berarti berunding atau menyusun rencana bersama; tujuan bermusuhan dalam klausa berikutnya membuat nuansa persekongkolannya jelas. Bentuk imperfek menyatakan tindakan yang mulai atau sedang berlangsung.
- source_word: κατ’ αὐτοῦ
  choice: untuk melawan Yesus
  rationale: κατά dengan genitif memiliki daya adversatif. Nama 'Yesus' dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia tanpa mengubah pelakunya.
- source_word: ὅπως
  choice: mencari cara untuk
  rationale: Bersama subjungtif, kata ini memperkenalkan tujuan sekaligus nuansa pertimbangan mengenai cara untuk mencapainya.
- source_word: ἀπολέσωσιν
  choice: membinasakan Dia
  rationale: ἀπόλλυμι dapat berarti membinasakan, menghancurkan, atau membunuh. Pilihan ini mempertahankan keluasan leksikalnya, sementara konteks menunjukkan maksud yang mematikan.
theological_decisions:
- issue: Apakah niat para pemimpin harus dinyatakan secara eksplisit sebagai pembunuhan dalam teks utama
  choice: Memakai ungkapan yang lebih luas, 'membinasakan Dia', dalam teks utama.
  alternative: membunuh Dia; membuat Dia mati
  rationale: Kata Yunani ἀπόλλυμι lebih luas daripada verba yang hanya berarti membunuh, walaupun dalam konteks ini jelas mengarah pada upaya menghilangkan nyawa Yesus. Catatan kaki menyampaikan arti kontekstual yang lebih eksplisit tanpa mempersempit teks utama.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Para pendukung Herodes' dipilih agar kelompok politik tersebut langsung dapat dipahami pembaca umum. Penanda catatan kaki ditempatkan tepat setelah klausa yang dijelaskannya.
