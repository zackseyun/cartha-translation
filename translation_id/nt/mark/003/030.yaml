lexical_decisions:
- source_word: ὅτι
  choice: sebab
  rationale: Dalam konteks, kata ini menyatakan alasan bagi pernyataan Yesus sebelumnya mengenai kesalahan mereka. 'Sebab' menyampaikan hubungan kausal itu secara alami dan jelas.
- source_word: ἔλεγον
  choice: mereka terus berkata
  rationale: Bentuk imperfek menunjukkan perkataan yang berlangsung atau diulang. 'Terus berkata' mempertahankan aspek tersebut lebih baik daripada sekadar 'berkata'.
- source_word: Πνεῦμα ἀκάθαρτον
  choice: roh najis
  rationale: '''Roh najis'' adalah ungkapan Injil yang lazim untuk roh jahat dan mempertahankan kaitan leksikal dengan ἀκάθαρτος tanpa memparafrasakannya.'
- source_word: ἔχει
  choice: mempunyai
  rationale: Kata Yunani ini secara langsung berarti 'mempunyai'. Pilihan ini mempertahankan bentuk tuduhan dalam sumber tanpa memperluasnya menjadi penafsiran tentang kerasukan.
theological_decisions:
- issue: Sifat tuduhan terhadap Yesus
  choice: Mempertahankan tuduhan langsung, 'Dia mempunyai roh najis.'
  alternative: Dia kerasukan roh najis.
  rationale: Teks melaporkan tuduhan lawan-lawan Yesus dengan ungkapan yang tajam dan langsung. Menerjemahkan ἔχει sebagai 'mempunyai' menjaga ketegangan dan beratnya tuduhan itu tanpa menambahkan penafsiran; padanan yang lebih idiomatis dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Mereka terus berkata' menandai aspek imperfek, sedangkan 'mempunyai roh najis' sengaja mempertahankan bentuk harfiah tuduhan Yunani. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang dijelaskan.
