base_translation:
  language: en
  yaml_path: translation/nt/mark/003/003.yaml
  text: And he says to the man with the withered hand[a], “Rise and come to the middle.”
translation:
  language: id
  text: Lalu Ia berkata kepada orang yang tangannya layu itu, “Bangkitlah, majulah ke tengah!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Berdirilah dan majulah ke tengah.” Secara harfiah, keadaan tangannya digambarkan sebagai “kering” atau “layu”.
    reason: Menjelaskan alternatif untuk Ἔγειρε serta nuansa harfiah ξηράν, sambil mempertahankan gerak menuju tengah dalam εἰς τὸ μέσον.
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis khas narasi Markus diterjemahkan dengan bentuk naratif Indonesia yang alami; bahasa Indonesia tidak menandai kala secara morfologis.
- source_word: ἀνθρώπῳ
  choice: orang
  rationale: Dalam bahasa Indonesia, “orang” adalah sebutan alami bagi individu ini; konteks telah mengidentifikasinya tanpa perlu menambahkan penanda gender yang tidak diperlukan.
- source_word: τὴν χεῖρα ἔχοντι ξηράν
  choice: yang tangannya lumpuh
  rationale: Ungkapan ini menyampaikan kondisi tangan yang tidak berfungsi secara alami dalam bahasa Indonesia tanpa menentukan diagnosis medis yang tidak diberikan teks.
- source_word: ξηράν
  choice: lumpuh
  rationale: Secara harfiah berarti “kering”, tetapi ketika menerangkan tangan, kata ini menunjuk pada tangan yang layu atau tidak berfungsi; “lumpuh” paling jelas bagi pembaca modern, sementara nuansa harfiahnya dicatat dalam kaki catatan.
- source_word: Ἔγειρε
  choice: Berdirilah
  rationale: Imperatif ini dalam konteks menyuruh orang itu bangkit atau berdiri; “Berdirilah” ringkas dan idiomatis.
- source_word: εἰς τὸ μέσον
  choice: di tengah
  rationale: Frasa itu secara harfiah mengarah “ke tengah”; bersama perintah untuk berdiri, bahasa Indonesia yang alami dapat menyatakannya sebagai “berdiri di tengah”, dengan unsur gerak yang tetap dijelaskan dalam alternatif kaki catatan.
