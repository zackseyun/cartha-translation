  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Lalu” mempertahankan kesinambungan καί tanpa menghasilkan susunan yang kaku. Sapaan langsung dibuat singkat sesuai ketegasan perintah Yunani.
