  text: Καὶ ⸀ἔρχεται εἰς οἶκον· καὶ συνέρχεται πάλιν ⸀ὁ ὄχλος, ὥστε μὴ δύνασθαι αὐτοὺς ⸀μηδὲ ἄρτον φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/020.yaml
  text: And he comes into a house[a], and the crowd gathers again[c][b], so that they are not even able to eat bread.
translation:
  language: id
  text: Kemudian Yesus masuk ke sebuah rumah[a], dan orang banyak kembali berkumpul sehingga mereka bahkan tidak dapat makan roti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "pulang". Secara harfiah, bahasa Yunani berbunyi "ke dalam sebuah rumah", tetapi ungkapan itu dapat dipahami secara idiomatis sebagai pulang ke rumah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "makan roti"; ungkapan ini dapat berarti makan atau bersantap.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: masuk
  rationale: Dalam konstruksi ἔρχεται εἰς οἶκον, bahasa Indonesia alami memakai 'masuk ke'. Kala kini historis Yunani tidak perlu ditiru secara kaku karena verba Indonesia tidak menandai kala.
- source_word: εἰς οἶκον
  choice: ke sebuah rumah
  rationale: οἶκον tidak memakai artikel dan tidak menyatakan pemilik; 'sebuah rumah' mempertahankan ketidakpastian itu. Kemungkinan idiomatis 'pulang' dicatat dalam catatan kaki.
- source_word: συνέρχεται πάλιν ὁ ὄχλος
  choice: Orang banyak kembali berkumpul
  rationale: '''Orang banyak'' merupakan padanan kolektif yang wajar bagi ὁ ὄχλος, sedangkan ''kembali berkumpul'' menyampaikan συνέρχεται dan πάλιν secara alami.'
- source_word: ὥστε μὴ δύνασθαι αὐτοὺς
  choice: sehingga mereka ... tidak dapat
  rationale: ὥστε dengan infinitif menyatakan akibat. 'Mereka' mempertahankan bentuk jamak αὐτούς tanpa memperinci secara berlebihan siapa saja yang tercakup.
- source_word: μηδὲ ἄρτον φαγεῖν
  choice: bahkan tidak dapat makan
  rationale: Dalam konteks ini, 'makan roti' merupakan ungkapan untuk makan atau bersantap. Teks utama memakai ungkapan Indonesia yang alami, sementara arti harfiahnya dicatat.
