  text: Ἀμὴν λέγω ὑμῖν ὅτι πάντα ἀφεθήσεται ⸂τοῖς υἱοῖς τῶν ἀνθρώπων, τὰ ἁμαρτήματα⸃ καὶ ⸂αἱ βλασφημίαι ὅσα ἐὰν⸃ βλασφημήσωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/028.yaml
  text: Truly I tell you that all sins will be forgiven to the sons of men[a], and whatever blasphemies they may utter;
translation:
  language: id
  text: 'Sesungguhnya Aku berkata kepadamu: segala dosa dan hujatan apa pun yang mereka ucapkan akan diampuni kepada manusia[a];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak manusia”; ungkapan Yunani ini merujuk kepada manusia pada umumnya.
    reason: Menjelaskan bentuk harfiah dan makna generik ungkapan Semitis τοῖς υἱοῖς τῶν ἀνθρώπων.
lexical_decisions:
- source_word: Ἀμὴν
  choice: Sesungguhnya
  rationale: Dalam rumusan khidmat Ἀμὴν λέγω ὑμῖν, “Sesungguhnya” menyampaikan penegasan dengan wajar dalam bahasa Indonesia tanpa sekadar mentransliterasikan “Amin”.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Ungkapan ini mempertahankan sapaan langsung dan nada khidmat perkataan Yesus.
- source_word: πάντα
  choice: segala
  rationale: Bentuk jamak netral ini merangkum unsur yang dijelaskan sesudahnya, yakni dosa dan hujatan; “segala” menyatakan cakupan menyeluruh tanpa memberi kesan bahwa segala sesuatu tanpa batas sedang dibicarakan.
- source_word: ἀφεθήσεται
  choice: akan diampunkan
  rationale: Bentuk pasif futurum dari ἀφίημι dalam konteks dosa berarti pengampunan. “Diampunkan” memungkinkan dosa dan hujatan tetap menjadi subjek gramatikal serta dapat diikuti penerima dengan “kepada”.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: kepada manusia[a]
  rationale: Ungkapan Semitis ini secara idiomatis menunjuk kepada manusia pada umumnya. Terjemahan utama dibuat alami bagi pembaca Indonesia, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: τὰ ἁμαρτήματα
  choice: dosa
  rationale: Nomina jamak ini menunjuk kepada perbuatan-perbuatan dosa; bentuk kolektif “dosa” wajar dalam bahasa Indonesia.
- source_word: αἱ βλασφημίαι
  choice: hujatan
  rationale: “Hujatan” mempertahankan bobot religius dan teologis istilah tersebut dalam konteks perkataan menentang Roh Kudus.
- source_word: ὅσα ἐὰν βλασφημήσωσιν
  choice: hujatan apa pun yang mereka ucapkan
  rationale: “Apa pun” mempertahankan cakupan terbuka yang dinyatakan oleh ὅσα ἐάν dengan subjungtif, sedangkan “ucapkan” menghasilkan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Cakupan pernyataan pengampunan sehubungan dengan peringatan tentang penghujatan terhadap Roh Kudus dalam ayat berikutnya
  choice: Ayat ini diterjemahkan sebagai pernyataan luas tentang pengampunan tanpa memasukkan pengecualian dari ayat berikutnya.
  alternative: Menyisipkan batasan atau pengecualian secara tersirat ke dalam ayat ini.
  rationale: Teks ayat ini terlebih dahulu menyatakan luasnya pengampunan, sedangkan ayat berikutnya menyampaikan pengecualian. Terjemahan mempertahankan ketegangan teologis dan urutan retoris tersebut.
- issue: Makna generik ungkapan τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: Menggunakan “manusia” dalam teks utama dan mencantumkan bentuk harfiah dalam catatan kaki.
  alternative: Memakai “anak-anak manusia” dalam teks utama.
  rationale: Dalam ungkapan Semitis ini, bentuk maskulin jamak bersifat generik dan tidak membatasi makna pada laki-laki atau anak-anak. “Manusia” menyampaikan referennya secara tepat dan alami dalam bahasa Indonesia, sementara catatan kaki menjaga bentuk ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dirapikan agar alami, tetapi cakupan menyeluruh, bentuk pasif pengampunan, penerima pengampunan, serta sifat terbuka dari hujatan yang dimaksud tetap dipertahankan. Tanda titik koma menandai bahwa perkataan berlanjut ke ayat berikutnya.
