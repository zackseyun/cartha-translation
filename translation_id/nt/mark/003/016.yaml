  source_fidelity: Teks Indonesia dengan setia mencerminkan καὶ ἐποίησεν τοὺς δώδεκα, καὶ ἐπέθηκεν ὄνομα τῷ Σίμωνι Πέτρον. “Menetapkan” wajar untuk tindakan konstitutif ἐποίησεν dalam konteks ini; “kedua belas orang itu” secara tepat menyatakan kelompok yang dimaksud; dan “memberi Simon nama Petrus” mempertahankan tindakan pemberian nama. Koma akhir tepat, karena konstruksi dan daftar nama berlanjut pada ayat berikutnya.
