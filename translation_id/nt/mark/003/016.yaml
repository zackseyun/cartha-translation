id: MRK.3.16
reference: Mark 3:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸂ἐποίησεν τοὺς δώδεκα, καὶ⸃ ἐπέθηκεν ⸂ὄνομα τῷ Σίμωνι⸃ Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/016.yaml
  text: And he appointed the twelve[a], and he gave Simon the name Peter,
translation:
  language: id
  text: Ia menetapkan kedua belas orang itu dan memberi Simon nama Petrus,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Petrus berarti “batu”.
    reason: Menjelaskan arti nama Yunani Πέτρος tanpa mengganti nama diri tersebut dalam teks utama.
lexical_decisions:
- source_word: ἐποίησεν
  choice: menetapkan
  rationale: Walaupun secara dasar berarti 'membuat', dalam konteks pemilihan dan pembentukan kelompok kedua belas orang, 'menetapkan' menyampaikan fungsi konstitutif verba ini secara wajar tanpa memasukkan jabatan gerejawi yang tidak disebutkan.
- source_word: τοὺς δώδεκα
  choice: kedua belas orang itu
  rationale: Frasa ini menunjuk kepada kelompok tertentu yang terdiri atas dua belas murid. Penambahan 'orang' diperlukan agar ungkapannya alami dan jelas dalam bahasa Indonesia.
- source_word: ἐπέθηκεν ὄνομα
  choice: memberi ... nama
  rationale: Idiom Yunani ini secara harfiah berarti 'menaruh nama pada'. Ungkapan 'memberi Simon nama Petrus' mempertahankan tindakan pemberian nama sekaligus tetap alami dalam bahasa Indonesia.
- source_word: Σίμωνι
  choice: Simon
  rationale: Nama diri ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: Πέτρον
  choice: Petrus
  rationale: Karena berfungsi sebagai nama diri yang diberikan kepada Simon, bentuk ini ditransliterasikan sesuai tradisi baku bahasa Indonesia; makna leksikalnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Tindakan Yesus terhadap kedua belas orang
  choice: menetapkan kedua belas orang itu
  alternative: membentuk kedua belas orang itu; menjadikan kedua belas orang itu
  rationale: '''Menetapkan'' menyampaikan bahwa Yesus membentuk mereka sebagai kelompok khusus, tanpa memasukkan istilah jabatan gerejawi yang tidak ada dalam teks.'
- issue: Perlakuan terhadap Πέτρον
  choice: Petrus
  alternative: Batu Karang; Batu
  rationale: Πέτρον berfungsi sebagai nama diri. Transliterasi mempertahankan identitas tokoh, sedangkan arti nama itu disampaikan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti 'Ia' merujuk kepada Yesus dari konteks sebelumnya. Tanda koma pada akhir ayat dipertahankan karena kalimat dan daftar berlanjut ke ayat berikutnya.
