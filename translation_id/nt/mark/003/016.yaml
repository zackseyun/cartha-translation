  terminology: “Petrus” adalah bentuk nama diri yang mapan dalam bahasa Indonesia. Catatan kaki “Petrus berarti ‘batu’” secara ringkas menjelaskan nilai leksikal nama tersebut tanpa menggantikannya dalam teks utama dan tanpa membebani ayat dengan penafsiran teologis.
