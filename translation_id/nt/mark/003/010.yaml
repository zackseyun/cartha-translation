base_translation:
  language: en
  yaml_path: translation/nt/mark/003/010.yaml
  text: For he had healed many, so that all who had afflictions were pressing in on him in order to touch him.
translation:
  language: id
  text: Sebab Ia telah menyembuhkan banyak orang, sehingga semua orang yang mengalami penderitaan mendesak-Nya[a] untuk menyentuh-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jatuh menimpa-Nya.” Kata Yunani ini menggambarkan orang-orang yang berdesak kuat ke arah Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς
  choice: banyak orang
  rationale: Objek dari ἐθεράπευσεν adalah banyak orang; penambahan “orang” diperlukan agar ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai penjelasan bagi keadaan yang diceritakan dalam konteks sebelumnya.
- source_word: ἐθεράπευσεν
  choice: telah menyembuhkan
  rationale: Aoristus ini menunjuk pada tindakan penyembuhan yang mendahului dan menjelaskan desakan orang banyak; “telah” menyampaikan hubungan itu secara alami.
- source_word: ὥστε
  choice: sehingga
  rationale: Memperkenalkan akibat dari tindakan Yesus menyembuhkan banyak orang.
- source_word: ἐπιπίπτειν αὐτῷ
  choice: berdesak-desakan mendekati-Nya
  rationale: Dalam konteks kerumunan, verba yang secara harfiah dapat berarti “menjatuhkan diri ke atas/menyerbu” menggambarkan orang-orang yang bergerak kuat ke arah Yesus. Pilihan ini mempertahankan tekanan fisik tanpa memberi kesan bahwa mereka benar-benar menjatuhkan tubuh di atas-Nya.
- source_word: ἵνα αὐτοῦ ἅψωνται
  choice: untuk menyentuh-Nya
  rationale: ἵνα menyatakan tujuan, sedangkan ἅπτομαι dengan genitif berarti menyentuh secara fisik.
- source_word: ὅσοι
  choice: semua orang yang
  rationale: Menyampaikan cakupan menyeluruh dari kata relatif tersebut secara wajar dalam bahasa Indonesia.
- source_word: εἶχον μάστιγας
  choice: menderita penyakit
  rationale: μάστιξ secara harfiah berarti “cambuk,” tetapi di sini digunakan secara kiasan untuk penyakit atau penderitaan berat dalam konteks penyembuhan. “Menderita penyakit” alami dalam bahasa Indonesia dan tetap menunjukkan pengalaman penderitaan.
theological_decisions:
- issue: Cakupan makna μάστιγας dalam konteks penyembuhan
  choice: menderita penyakit
  alternative: mengalami penderitaan berat; terkena tulah; memiliki penyakit
  rationale: Konteksnya jelas berkaitan dengan penyembuhan, tetapi istilah Yunaninya lebih tajam daripada istilah medis netral. Teks utama memakai ungkapan Indonesia yang alami, sementara catatan kaki mempertahankan citra harfiahnya dan keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Catatan [a] ditempatkan sesudah frasa yang diterangkannya. Catatan [b] harus ditandai dalam teks utama pada frasa terkait.
