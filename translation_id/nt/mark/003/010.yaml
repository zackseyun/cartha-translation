  verdict: revise
  source_fidelity: Teks utama dengan tepat menyampaikan hubungan sebab-akibat, tindakan penyembuhan yang mendahului respons orang banyak, serta tujuan mereka menyentuh Yesus. Namun, “penyakit” mempersempit μάστιγας, yang dalam konteks ini mencakup penyakit atau penderitaan/derita berat secara lebih luas. Frasa “berdesak-desakan mendekati-Nya” cukup baik, tetapi catatan kaki perlu menyatakan dengan lebih tepat daya fisik ἐπιπίπτειν αὐτῷ.
  naturalness: Bahasa Indonesia baku dan jelas. “Semua orang yang mengalami penderitaan” lebih alami daripada “semua orang yang menderita penyakit” sambil menghindari pembatasan makna sumber. “Mendesak-Nya” dapat dipahami sebagai tekanan fisik dalam konteks kerumunan dan lebih langsung menyatakan arah tindakan kepada Yesus.
  terminology: “Ia” dan akhiran -Nya sesuai register naratif Alkitab Indonesia. “Penderitaan” mempertahankan keluasan μάστιγες tanpa menetapkan diagnosis medis. Catatan kaki menjelaskan alternatif harfiah tanpa memasukkannya secara kaku ke dalam teks utama.
