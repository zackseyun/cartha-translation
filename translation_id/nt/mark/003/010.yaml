  - severity: low
    issue: Catatan kaki [a] memakai alternatif “menyerbu-Nya” yang kurang tepat sebagai padanan utama alternatif leksikal.
    rationale: ἐπιπίπτω secara lebih dekat berarti “jatuh/menimpa atas” dan, dalam konteks ini, mendesak atau berkerumun kuat pada seseorang. “Menerjang-Nya” atau penjelasan tentang desakan kuat lebih tepat daripada “menyerbu-Nya,” yang dapat menyiratkan serangan.
