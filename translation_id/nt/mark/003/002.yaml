  text: καὶ παρετήρουν αὐτὸν εἰ τοῖς σάββασιν θεραπεύσει αὐτόν, ἵνα ⸀κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/002.yaml
  text: And they were watching him closely to see whether he would heal him on the Sabbath[a], so that they might accuse him.
translation:
  language: id
  text: Mereka terus mengawasi Yesus dengan saksama untuk melihat apakah Ia akan menyembuhkan orang itu pada hari Sabat[a], supaya mereka dapat menuduh-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada hari-hari Sabat.” Bentuk jamak dalam bahasa Yunani dapat digunakan secara idiomatis untuk hari Sabat.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετήρουν
  choice: terus mengawasi ... dengan saksama
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung, sedangkan παρατηρέω dalam konteks ini menyiratkan pengamatan cermat yang bernada mencurigai atau memusuhi.
- source_word: αὐτὸν ... αὐτόν
  choice: Yesus ... orang itu
  rationale: 'Kedua pronomina Yunani memiliki rujukan berbeda. Penyebutan rujukannya secara eksplisit menghindari ketaksaan yang tidak wajar dalam bahasa Indonesia: mereka mengawasi Yesus dan menantikan apakah Ia menyembuhkan orang yang disebut pada ayat sebelumnya.'
- source_word: εἰ
  choice: untuk melihat apakah
  rationale: Dalam konstruksi setelah tindakan mengawasi, frasa ini menyampaikan pertanyaan tidak langsung secara alami dalam bahasa Indonesia.
- source_word: τοῖς σάββασιν
  choice: pada hari Sabat
  rationale: Walaupun bentuk Yunaninya jamak, bentuk jamak tersebut dapat berfungsi secara idiomatis untuk hari Sabat. Bentuk tunggal merupakan ungkapan Indonesia yang alami; bentuk gramatikal Yunaninya dicatat dalam catatan kaki.
- source_word: θεραπεύσει
  choice: akan menyembuhkan
  rationale: Future indicative dalam pertanyaan tidak langsung ini secara alami diterjemahkan dengan 'akan menyembuhkan' dan tidak perlu dilemahkan menjadi sekadar kemungkinan.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: supaya mereka dapat menuduh-Nya
  rationale: ἵνα dengan subjunctive menyatakan tujuan. 'Menuduh' mempertahankan kemungkinan nuansa hukum tanpa memperkuatnya menjadi penuntutan resmi yang tidak dinyatakan teks.
theological_decisions:
- issue: Maksud orang-orang yang mengawasi Yesus
  choice: Pengawasan yang bermusuhan dengan tujuan memperoleh alasan untuk menuduh Yesus
  alternative: Menggambarkannya sebagai proses hukum resmi atau penuntutan
  rationale: Konteks dan pilihan kata menunjukkan pengamatan yang bermusuhan, tetapi κατηγορέω hanya menyatakan tindakan menuduh dan tidak dengan sendirinya menetapkan adanya proses pengadilan resmi.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Terus mengawasi ... dengan saksama' mempertahankan aspek berkelanjutan dan nada pengamatan yang mencurigakan. Nama 'Yesus' dan frasa 'orang itu' dipakai untuk memperjelas dua rujukan pronomina Yunani yang berbeda. Penanda catatan kaki [a] ditempatkan langsung setelah frasa terkait.
