  source_fidelity: Terjemahan dengan tepat menyampaikan aspek imperfek παρετήρουν melalui “terus mengawasi ... dengan saksama,” pertanyaan tidak langsung εἰ melalui “untuk melihat apakah,” futurum θεραπεύσει melalui “akan menyembuhkan,” serta tujuan ἵνα κατηγορήσωσιν melalui “supaya mereka dapat menuduh-Nya.” Pembedaan Yesus sebagai objek pengawasan dan “orang itu” sebagai orang yang mungkin disembuhkan setia pada dua rujukan pronominal yang berbeda dalam konteks dekat. “Pada hari Sabat” merupakan padanan idiomatis yang sah untuk τοῖς σάββασιν, sementara catatan kaki secara memadai mencatat bentuk jamaknya.
