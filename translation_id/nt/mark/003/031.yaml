review_pass:
  verdict: revise
  source_fidelity: 'Teks Yunani menyatakan bahwa ibu dan saudara-saudara laki-laki Yesus datang, berdiri di luar, lalu mengutus (secara tersirat seorang utusan atau pesan) kepada Yesus sambil memanggil-Nya. Draf "menyuruh orang menemui-Nya" menggeser tujuan pengutusan: yang dikatakan partisipel καλοῦντες adalah memanggil Yesus, bukan sekadar menemui Dia. Terjemahan yang direvisi mempertahankan fungsi itu secara wajar dalam bahasa Indonesia.'
  naturalness: '"Menyuruh orang memanggil-Nya" adalah ungkapan modern dan idiomatis. Susunan "ibu Yesus dan saudara-saudara laki-laki-Nya" juga lebih langsung daripada pemakaian nama Yesus hanya pada unsur kedua.'
  terminology: '"Saudara-saudara laki-laki" tepat untuk ἀδελφοί dan tidak mengambil posisi mengenai rincian hubungan keluarga. "Memanggil-Nya" mempertahankan keluasan καλέω tanpa secara eksplisit menambahkan bahwa Yesus diminta datang.'
  issues:
  - severity: medium
    issue: Tujuan tindakan pengutusan berubah dalam frasa "menyuruh orang menemui-Nya".
    rationale: ἀπέστειλαν πρὸς αὐτὸν καλοῦντες αὐτόν menyatakan pengutusan kepada Yesus dengan tindakan/tujuan memanggil Yesus. "Menemui-Nya" hanya menerjemahkan arah pengutusan dan tidak menerjemahkan secara memadai καλοῦντες αὐτόν.
  - severity: low
    issue: Catatan kaki menyebut alternatif "mengirim pesan", tetapi teks utama tidak perlu disertai catatan kaki untuk menandai alternatif ini.
    rationale: Dalam bahasa Indonesia, "menyuruh orang memanggil-Nya" dengan wajar mewakili pengutusan yang tersirat dalam konteks tanpa mengklaim bahwa objek yang dikirim secara eksplisit disebutkan dalam Yunani. Catatan kaki lama juga memperluasnya menjadi "meminta Dia datang," yang merupakan implikasi konteks, bukan bentuk eksplisit kata kerja.
  revised_text: Kemudian ibu Yesus dan saudara-saudara laki-laki-Nya datang. Sambil berdiri di luar, mereka menyuruh orang memanggil-Nya.
  revised_footnotes: []
