revisions:
- from: Kemudian ibu dan saudara-saudara laki-laki Yesus datang. Sambil berdiri di luar, mereka menyuruh orang menemui-Nya untuk memanggil-Nya.[a]
  to: Kemudian ibu Yesus dan saudara-saudara laki-laki-Nya datang. Sambil berdiri di luar, mereka menyuruh orang memanggil-Nya.
  rationale: Revisi mengganti "menemui-Nya" dengan "memanggil-Nya" agar καλοῦντες αὐτόν diterjemahkan langsung. Frasa "menyuruh orang" merupakan cara Indonesia yang alami untuk menyatakan pengutusan dengan utusan yang tersirat, tanpa menentukan identitasnya. Catatan kaki dihapus karena alternatif sebelumnya tidak diperlukan dan memasukkan penjelasan yang melampaui perumusan eksplisit teks.
