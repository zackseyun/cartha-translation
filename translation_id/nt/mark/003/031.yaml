  text: ⸂Καὶ ἔρχονται⸃ ⸂ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ⸃ καὶ ἔξω ⸀στήκοντες ἀπέστειλαν πρὸς αὐτὸν ⸀καλοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/031.yaml
  text: Then his mother and his brothers came[a], and standing outside they sent word to him[b], calling him.
translation:
  language: id
  text: Kemudian ibu Yesus dan saudara-saudara laki-laki-Nya datang. Sambil berdiri di luar, mereka menyuruh orang memanggil-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Kemudian
  rationale: Pada awal klausa, καί meneruskan alur cerita; “Kemudian” wajar dalam narasi Indonesia dan mempertahankan fungsi penghubungnya.
- source_word: ἔρχονται
  choice: datang
  rationale: Bentuk kini Yunani berfungsi sebagai present historis; bahasa Indonesia tidak menandai kala secara morfologis, dan “datang” alami dalam narasi ini.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: ibu ... Yesus
  rationale: Nama “Yesus” digunakan untuk memperjelas acuan pronomina dalam bahasa Indonesia tanpa menambah informasi baru.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: saudara-saudara laki-laki Yesus
  rationale: ἀδελφοί berbentuk jamak maskulin dan di sini menunjuk kepada anggota keluarga laki-laki; ungkapan ini mempertahankan arti harfiahnya tanpa menentukan lebih jauh hubungan biologis mereka.
- source_word: ἔξω στήκοντες
  choice: Sambil berdiri di luar
  rationale: Partisipel kini menggambarkan keadaan atau tindakan yang menyertai tindakan utama; bentuk ini alami dan tetap dekat dengan susunan Yunani.
- source_word: ἀπέστειλαν πρὸς αὐτόν
  choice: mereka menyuruh orang menemui-Nya
  rationale: Objek yang dikirim tidak disebutkan dalam Yunani. Dalam konteks ini, idiom tersebut menyiratkan pengiriman orang atau pesan kepada Yesus; terjemahan ini membuat tindakan dapat dipahami tanpa menentukan identitas utusan.
- source_word: καλοῦντες αὐτόν
  choice: untuk memanggil-Nya
  rationale: Partisipel ini paling alami dipahami sebagai tujuan pengutusan, yaitu meminta Yesus datang kepada mereka. “Memanggil-Nya” mempertahankan keluasan makna καλέω.
theological_decisions:
- issue: Acuan “saudara-saudara laki-laki-Nya”
  choice: Diterjemahkan sebagai “saudara-saudara laki-laki Yesus” tanpa penjelasan mengenai jenis hubungan keluarga mereka.
  alternative: “kerabat-kerabat Yesus” atau penegasan bahwa mereka adalah saudara kandung
  rationale: ἀδελφοί secara langsung berarti “saudara-saudara laki-laki”, tetapi ayat ini sendiri tidak menyelesaikan perdebatan tentang tepatnya hubungan keluarga tersebut. Terjemahan tidak boleh memasukkan kesimpulan denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan “Yesus” menghindari rangkaian pronomina yang canggung. Huruf kapital pada pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab Indonesia, tanpa menambahkan penafsiran pada isi ayat.
