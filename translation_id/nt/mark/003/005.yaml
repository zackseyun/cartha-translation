source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος αὐτοὺς μετ’ ὀργῆς, συλλυπούμενος ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν, λέγει τῷ ἀνθρώπῳ· Ἔκτεινον τὴν ⸀χεῖρα· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/005.yaml
  text: And after looking around at them with anger[a], grieved at the hardness of their hearts, he says to the man, “Stretch out your hand.” And he stretched it out, and his hand was restored.
translation:
  language: id
  text: Setelah memandang orang-orang di sekeliling-Nya dengan marah, sambil berdukacita atas kekerasan hati mereka,[a] Ia berkata kepada orang itu, “Ulurkanlah tanganmu.” Orang itu mengulurkannya, lalu tangannya pulih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “hati” berbentuk tunggal dan mungkin dipakai secara kolektif.
    reason: Menjelaskan bentuk tunggal καρδίας yang disertai pronomina jamak tanpa membuat ungkapan utama menjadi tidak alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: setelah memandang orang-orang di sekeliling-Nya
  rationale: Partisip aoris ini menggambarkan pandangan menyeluruh yang mendahului verba utama. Ungkapan ini mempertahankan urutan tindakan dan arah pandangan kepada kelompok di sekitar Yesus dengan bahasa Indonesia yang wajar.
- source_word: μετ’ ὀργῆς
  choice: dengan marah
  rationale: μετά dengan genitif menyatakan keadaan atau cara yang menyertai tindakan. Terjemahan ini langsung, alami, dan tidak melunakkan emosi yang dinyatakan teks.
- source_word: συλλυπούμενος
  choice: sambil berdukacita
  rationale: Partisip kini menunjukkan dukacita yang menyertai pandangan dan kemarahan Yesus. 'Berdukacita' menyampaikan rasa pedih yang serius tanpa menambahkan tingkat intensitas yang tidak dinyatakan.
- source_word: ἐπὶ τῇ πωρώσει
  choice: atas kekerasan
  rationale: ἐπί dengan datif di sini menunjukkan dasar atau penyebab dukacita. 'Kekerasan' mempertahankan metafora πώρωσις tentang ketumpulan atau ketidakpekaan batin.
- source_word: τῆς καρδίας αὐτῶν
  choice: hati mereka
  rationale: καρδία berbentuk tunggal dengan pronomina jamak dan kemungkinan dipakai secara kolektif. 'Hati mereka' alami dalam bahasa Indonesia sekaligus tetap dekat dengan bentuk sumber.
- source_word: λέγει
  choice: Ia berkata
  rationale: Bentuk kini ini merupakan kala kini historis khas Markus. Bahasa Indonesia tidak menandai kala secara morfologis, sehingga 'berkata' dapat mempertahankan gerak narasi tanpa memaksakan penanda waktu.
- source_word: τῷ ἀνθρώπῳ
  choice: kepada orang itu
  rationale: ἄνθρωπος menunjuk kepada laki-laki tertentu yang telah disebut dalam konteks. 'Orang itu' merupakan rujukan yang alami dan tidak perlu mengulang keterangan yang sudah jelas.
- source_word: Ἔκτεινον τὴν χεῖρα
  choice: Ulurkanlah tanganmu
  rationale: Imperatif aoris menuntut tindakan tegas. 'Ulurkanlah' adalah padanan idiomatis bagi ἐκτείνω dan memungkinkan pengulangan verbal dalam respons orang itu.
- source_word: ἐξέτεινεν
  choice: mengulurkannya
  rationale: Terjemahan ini menggemakan verba dalam perintah, sedangkan akhiran '-nya' secara wajar merujuk kepada tangan tanpa pengulangan yang kaku.
- source_word: ἀπεκατεστάθη
  choice: pulih
  rationale: Bentuk pasif ini menyatakan pengembalian kepada keadaan semestinya. 'Pulih' menyampaikan hasil pemulihan secara alami tanpa mempersempit makna menjadi istilah medis tertentu.
theological_decisions:
- issue: Kemarahan dan dukacita Yesus
  choice: Kedua emosi diterjemahkan secara terbuka sebagai 'dengan marah' dan 'sambil berdukacita'.
  alternative: Melembutkan ὀργή menjadi 'dengan rasa tidak senang' atau memperluas συλλυπούμενος menjadi 'sangat sedih'.
  rationale: Teks secara eksplisit menyandingkan kemarahan dan dukacita Yesus. Keduanya dipertahankan tanpa pelunakan, penguatan, atau penyelarasan teologis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Struktur partisip dipertahankan sejauh tetap mudah dibaca, dan hubungan antara kemarahan serta dukacita tidak dilunakkan.
