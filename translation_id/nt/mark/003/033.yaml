base_translation:
  language: en
  yaml_path: translation/nt/mark/003/033.yaml
  text: And answering them[a], he says[b], “Who are my mother and my brothers?”
translation:
  language: id
  text: Lalu Ia menjawab mereka, “Siapakah ibu-Ku dan saudara-saudara laki-laki-Ku?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Siapakah ibu-Ku atau saudara-saudara laki-laki-Ku?” Bahasa Yunani memakai kata “atau” dan verba tunggal yang menyesuaikan unsur pertama, “ibu-Ku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: Lalu Ia menjawab mereka
  rationale: Ungkapan partisipel yang diikuti present historis dialihkan secara idiomatis menjadi verba lampau dalam narasi Indonesia. 'Lalu' menjaga gerak naratif Markus tanpa menghasilkan susunan kaku seperti 'sambil menjawab ... Ia berkata'.
- source_word: Τίς
  choice: Siapakah
  rationale: Bentuk tanya ini secara langsung menanyakan identitas dan sesuai dengan ragam Indonesia yang wajar serta bermartabat.
- source_word: μήτηρ μου
  choice: ibu-Ku
  rationale: '''Ibu'' adalah padanan baku dan alami; enklitik ''-Ku'' mempertahankan pronomina kepunyaan orang pertama.'
- source_word: ἢ
  choice: dan
  rationale: Walaupun bentuk Yunani secara leksikal berarti 'atau', dalam pertanyaan yang menggabungkan dua kelompok keluarga, 'dan' menghasilkan bahasa Indonesia yang alami dan menyampaikan cakupan pertanyaan tanpa mengubah acuannya. Bentuk harfiah dicatat dalam catatan kaki.
- source_word: ἀδελφοί μου
  choice: saudara-saudara-Ku
  rationale: '''Saudara-saudara'' mempertahankan bentuk jamak dan, dalam konteks keluarga, merupakan padanan Indonesia yang alami. Istilah ini tidak menentukan lebih jauh hubungan biologis atau status kekerabatan yang tidak dijelaskan oleh ayat.'
theological_decisions:
- issue: Cakupan hubungan keluarga dalam ἀδελφοί
  choice: saudara-saudara-Ku
  alternative: saudara-saudara lelaki-Ku / saudara kandung-Ku
  rationale: Bahasa Yunani memakai bentuk maskulin jamak, tetapi istilah ἀδελφοί sendiri dapat digunakan dalam rentang hubungan persaudaraan. 'Saudara-saudara-Ku' alami dalam bahasa Indonesia, tetap cocok bagi rujukan laki-laki dalam konteks ini, dan tidak memasukkan klaim denominatif tentang sifat tepat hubungan keluarga tersebut.
- issue: Hubungan dua unsur dalam pertanyaan
  choice: ibu-Ku dan saudara-saudara-Ku
  alternative: ibu-Ku atau saudara-saudara-Ku
  rationale: Teks Yunani memakai ἢ ('atau') dan verba tunggal yang mengikuti unsur pertama. Teks utama memakai konstruksi Indonesia yang lebih alami, sedangkan bentuk sumber yang lebih harfiah dipertahankan dalam catatan agar ketegangan gramatikal tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan mudah dibaca. Present historis Yunani dinaturalkan sebagai bentuk naratif lampau. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti konvensi penerbitan Alkitab Indonesia.
