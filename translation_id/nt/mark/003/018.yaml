  text: καὶ Ἀνδρέαν καὶ Φίλιππον καὶ Βαρθολομαῖον καὶ Μαθθαῖον καὶ Θωμᾶν καὶ Ἰάκωβον τὸν τοῦ Ἁλφαίου καὶ Θαδδαῖον καὶ Σίμωνα τὸν ⸀Καναναῖον
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/018.yaml
  text: and Andrew[a], and Philip, and Bartholomew, and Matthew, and Thomas, and James the son of Alphaeus, and Thaddaeus, and Simon the Cananaean.
translation:
  language: id
  text: dan Andreas, Filipus, Bartolomeus, Matius, Tomas, Yakobus anak Alfeus, Tadeus, dan Simon orang Zelot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: Kananaios. Istilah ini kemungkinan besar berarti “orang Zelot”, seperti sebutan bagi Simon dalam Lukas 6:15, dan bukan “orang Kanaan”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: dan; tanda koma dalam deretan
  rationale: Kata pertama diterjemahkan sebagai “dan” karena ayat ini melanjutkan daftar dari ayat sebelumnya. Pengulangan καὶ di dalam daftar sebagian besar diungkapkan dengan tanda koma agar alami dalam bahasa Indonesia, lalu “dan” dipakai sebelum nama terakhir.
- source_word: Ἀνδρέαν; Φίλιππον; Βαρθολομαῖον; Μαθθαῖον; Θωμᾶν; Θαδδαῖον
  choice: Andreas; Filipus; Bartolomeus; Matius; Tomas; Tadeus
  rationale: Nama-nama pribadi memakai bentuk yang telah mapan dan mudah dikenali dalam bahasa Indonesia.
- source_word: Ἰάκωβον τὸν τοῦ Ἁλφαίου
  choice: Yakobus anak Alfeus
  rationale: Konstruksi artikel dan genitif mengidentifikasi Yakobus melalui hubungan dengan Alfeus; “anak Alfeus” menyampaikan maksud itu secara jelas dan alami.
- source_word: Σίμωνα τὸν Καναναῖον
  choice: Simon orang Kanana
  rationale: Bentuk khas Markus ditampilkan secara langsung tanpa mengubahnya diam-diam menjadi sebutan lain. Catatan kaki menjelaskan bahwa istilah ini kemungkinan besar bersumber dari kata Aram yang berarti “orang Zelot”, bukan penanda etnis Kanaan.
theological_decisions:
- issue: Arti julukan Καναναῖος bagi Simon
  choice: orang Kanana
  alternative: orang Zelot; orang Kanaan
  rationale: Teks Markus memakai Καναναῖος, sedangkan padanan dalam Lukas memakai ζηλωτής. Terjemahan utama mempertahankan bentuk khas Markus dan catatan menjelaskan makna yang paling mungkin. “Orang Kanaan” dihindari karena dapat keliru dipahami sebagai keterangan etnis atau asal geografis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan daftar dibuat alami dengan tanda koma tanpa menghilangkan “dan” pembuka yang menghubungkan ayat ini dengan konteks sebelumnya. Semua nama memakai bentuk Indonesia yang lazim.
