  yaml_path: translation/nt/mark/003/012.yaml
  text: And he sternly warned them many times not to make him known[a].
translation:
  language: id
  text: Ia berkali-kali memperingatkan mereka dengan keras agar tidak membuat Dia dikenal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyatakan Dia,” “membuat Dia diketahui,” atau “membuat Dia dikenal secara terbuka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: berkali-kali
  rationale: Bentuk netral jamak ini dipakai secara adverbial bersama ἐπετίμα dan secara alami menyatakan tindakan yang berulang, sambil tetap memungkinkan adanya nuansa intensitas.
- source_word: ἐπετίμα
  choice: memperingatkan ... dengan keras
  rationale: Pilihan ini mempertahankan daya teguran atau perintah yang kuat dalam konteks larangan kepada roh-roh najis, tetapi tetap wajar dalam bahasa Indonesia modern.
- source_word: αὐτοῖς
  choice: mereka
  rationale: Kata ganti datif jamak ini merujuk kepada roh-roh najis dalam konteks langsung.
- source_word: ἵνα μὴ
  choice: agar ... tidak
  rationale: Ungkapan ini menyampaikan isi sekaligus maksud larangan secara jelas dan alami.
- source_word: αὐτὸν φανερὸν ποιήσωσιν
  choice: membuat diri-Nya dikenal
  rationale: Ungkapan tersebut berarti membuat seseorang nyata, diketahui, atau dikenal. Terjemahan ini mempertahankan objeknya sebagai pribadi Yesus tanpa menambahkan secara eksplisit identitas atau gelar tertentu.
theological_decisions:
- issue: Sifat larangan Yesus kepada roh-roh najis
  choice: Larangan diterjemahkan sebagai larangan membuat Yesus dikenal, tanpa menentukan lebih jauh apa yang hendak mereka nyatakan tentang Dia.
  alternative: Menerjemahkannya secara khusus sebagai larangan menyatakan bahwa Ia adalah Anak Allah, atau sekadar sebagai perintah umum untuk diam.
  rationale: Konteks sebelumnya berkaitan dengan pengenalan identitas Yesus, tetapi ayat ini sendiri hanya mengatakan bahwa mereka tidak boleh membuat Dia dikenal. Terjemahan mempertahankan batas dan ketegangan teks tersebut.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. Susunan “membuat diri-Nya dikenal” dipilih untuk mempertahankan idiom sumber dan menghindari penambahan keterangan tentang identitas Yesus.
