  text: καὶ ἐὰν οἰκία ἐφ’ ἑαυτὴν μερισθῇ, οὐ ⸀δυνήσεται ⸂ἡ οἰκία ἐκείνη σταθῆναι⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/025.yaml
  text: And if a house is divided against itself[a], that house will not be able to stand.
translation:
  language: id
  text: Dan jika sebuah rumah terpecah-belah sehingga saling melawan, rumah itu tidak akan dapat bertahan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκία
  choice: rumah
  rationale: Makna dasarnya adalah bangunan ‘rumah’. Walaupun dapat juga berarti ‘rumah tangga’, gambaran tentang rumah yang dapat atau tidak dapat berdiri/bertahan mendukung metafora konkret ini.
- source_word: ἐφ’ ἑαυτὴν
  choice: melawan dirinya sendiri
  rationale: Dalam ungkapan ini, ἐπί dengan kata ganti refleksif menyatakan pertentangan internal. Pilihan ini mempertahankan unsur ‘melawan’ dan sifat refleksifnya.
- source_word: μερισθῇ
  choice: terpecah
  rationale: Bentuk pasif aoristus subjungtif setelah ἐὰν menyatakan syarat umum. ‘Terpecah’ secara alami menggambarkan perpecahan internal dalam bahasa Indonesia.
- source_word: δυνήσεται
  choice: akan dapat
  rationale: Bentuk futur dari δύναμαι menyatakan kemampuan pada akibat yang akan terjadi dalam konstruksi bersyarat.
- source_word: σταθῆναι
  choice: bertahan
  rationale: Secara harfiah berarti ‘berdiri’, tetapi dalam konteks ini mengandung arti tetap utuh atau terus ada. ‘Bertahan’ menyampaikan maksud idiomatis secara alami sambil tetap selaras dengan gambaran rumah.
- source_word: ἡ οἰκία ἐκείνη
  choice: rumah itu
  rationale: Kata penunjuk ἐκείνη memberi penegasan pada rumah yang baru disebut; ‘rumah itu’ merupakan padanan Indonesia yang wajar.
- source_word: καὶ ἐὰν
  choice: Dan jika
  rationale: ‘Dan’ mempertahankan hubungan dengan argumen sebelumnya, sedangkan ‘jika’ memperkenalkan syarat umum.
