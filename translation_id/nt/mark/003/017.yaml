id: MRK.3.17
reference: Mark 3:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν τοῦ Ἰακώβου (καὶ ἐπέθηκεν αὐτοῖς ⸀ὀνόματα Βοανηργές, ὅ ἐστιν Υἱοὶ Βροντῆς),
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/017.yaml
  text: and James the son of Zebedee[a], and John the brother of James (he gave them the name Boanerges, which means Sons of Thunder),
translation:
  language: id
  text: dan Yakobus anak Zebedeus, serta Yohanes saudara Yakobus (kepada mereka ia memberi nama Boanerges,[a] yang berarti “Anak-Anak Guntur”),
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Yunani memakai bentuk jamak, “nama-nama”; bentuk jamak ini tampaknya digunakan secara kolektif untuk satu julukan bersama yang diberikan kepada kedua saudara itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰάκωβον
  choice: Yakobus
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia untuk Ἰάκωβος, dan membedakannya dari tokoh Perjanjian Lama yang lazim disebut Yakub.
- source_word: τὸν τοῦ Ζεβεδαίου
  choice: anak Zebedeus
  rationale: Konstruksi artikel dan genitif secara idiomatis menyatakan hubungan anak dengan ayahnya.
- source_word: Ἰωάννην
  choice: Yohanes
  rationale: Bentuk nama Ἰωάννης yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: τὸν ἀδελφὸν τοῦ Ἰακώβου
  choice: saudara Yakobus
  rationale: Dalam konteks ini ἀδελφός menunjuk pada saudara kandung; bahasa Indonesia secara alami cukup memakai 'saudara'.
- source_word: ἐπέθηκεν αὐτοῖς ὀνόματα
  choice: kepada mereka ia memberi nama
  rationale: Dengan objek 'nama', ἐπιτίθημι berarti memberi atau menyematkan nama. Susunan ini mempertahankan datif αὐτοῖς dan menyampaikan bentuk jamak Yunani secara idiomatis sebagai satu nama julukan bersama.
- source_word: Βοανηργές
  choice: Boanerges
  rationale: Nama julukan Semitik dipertahankan melalui transliterasi karena teks sendiri juga memberikan artinya.
- source_word: ὅ ἐστιν
  choice: yang berarti
  rationale: Ungkapan ini memperkenalkan penjelasan arti nama, sehingga 'yang berarti' alami dan tepat dalam bahasa Indonesia modern.
- source_word: Υἱοὶ Βροντῆς
  choice: Anak-Anak Guntur
  rationale: Terjemahan harfiah mempertahankan citra kuat julukan tersebut; huruf kapital menandai fungsinya sebagai julukan.
theological_decisions:
- issue: Penyajian julukan bagi Yakobus dan Yohanes
  choice: Mempertahankan bentuk 'Boanerges' dan menerangkan artinya sebagai 'Anak-Anak Guntur'
  alternative: Hanya menerjemahkan artinya tanpa mempertahankan bentuk Boanerges
  rationale: Teks Yunani sengaja menyajikan bentuk nama asing sekaligus penjelasannya. Mempertahankan keduanya menjaga bentuk dan tekstur narasi tanpa menambahkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Ayat dipertahankan sebagai lanjutan daftar dari konteks sebelumnya; tanda kurung mengikuti struktur sisipan dalam teks Yunani. 'Ia' tidak dikapitalisasi karena acuan kepada Yesus tetap jelas dari konteks dan kapitalisasi pronomina bukan tuntutan sumber.
