  text: καὶ ἀπὸ Ἱεροσολύμων καὶ ἀπὸ τῆς Ἰδουμαίας ⸀καὶ πέραν τοῦ Ἰορδάνου ⸁καὶ περὶ Τύρον καὶ Σιδῶνα, πλῆθος πολύ, ⸀ἀκούοντες ὅσα ⸀ἐποίει ἦλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/008.yaml
  text: and from Jerusalem[a], and from Idumea, and beyond the Jordan, and around Tyre and Sidon, a great crowd, hearing what he was doing[c][b], came to him.
translation:
  language: id
  text: Dan dari Yerusalem, dan dari Idumea, dan dari seberang Sungai Yordan[a], dan dari daerah sekitar Tirus dan Sidon[b], sejumlah besar orang datang kepada-Nya setelah mendengar apa yang dilakukan-Nya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seberang Yordan”; ungkapan Yunani ini dapat menunjuk wilayah di sisi lain Sungai Yordan.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Yunaninya menyebut daerah “sekitar Tirus dan Sidon”, jadi yang dimaksud tidak harus hanya kedua kota itu.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “segala sesuatu yang sedang dilakukan-Nya”. Kata ganti relatif Yunaninya dapat mengandung arti menyeluruh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ Ἱεροσολύμων
  choice: dari Yerusalem
  rationale: ἀπό dengan genitif menyatakan asal; nama tempat Ἱεροσόλυμα secara baku diterjemahkan “Yerusalem”.
- source_word: ἀπὸ τῆς Ἰδουμαίας
  choice: dari Idumea
  rationale: Mempertahankan makna asal geografis dan memakai bentuk nama wilayah yang lazim dalam bahasa Indonesia.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: dari seberang Sungai Yordan
  rationale: πέραν dengan genitif menunjuk wilayah di sisi lain suatu batas. Penambahan “Sungai” memperjelas rujukan geografis secara alami.
- source_word: περὶ Τύρον καὶ Σιδῶνα
  choice: dari daerah sekitar Tirus dan Sidon
  rationale: περί dengan akusatif bermakna spasial dan menunjuk kawasan di sekitar kedua kota, bukan hanya kota-kota itu sendiri.
- source_word: πλῆθος πολύ
  choice: orang banyak
  rationale: Ungkapan ini menunjuk kerumunan besar. “Orang banyak” alami dalam register Alkitab Indonesia, meski derajat besarnya sudah turut ditopang konteks daftar wilayah yang luas.
- source_word: ἀκούοντες
  choice: setelah mendengar
  rationale: Partisipel kini ini berkaitan dengan verba utama dan secara alami dapat diungkapkan sebagai hubungan waktu dalam bahasa Indonesia, tanpa menegaskan sebab secara mutlak.
- source_word: ὅσα ἐποίει
  choice: apa saja yang sedang dilakukan-Nya
  rationale: ὅσα dapat bermakna komprehensif, sedangkan bentuk imperfek ἐποίει menyatakan kegiatan yang sedang atau berulang berlangsung.
- source_word: ἦλθον πρὸς αὐτόν
  choice: mereka datang kepada-Nya
  rationale: ἔρχομαι dengan πρός dan akusatif menyatakan gerak menuju seseorang; “datang kepada-Nya” akurat dan wajar.
- source_word: καὶ ... καὶ ... καὶ
  choice: dan ... dan ... dan
  rationale: Pengulangan καί dipertahankan untuk mencerminkan gaya daftar akumulatif khas Markus.
