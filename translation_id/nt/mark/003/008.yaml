  source_fidelity: 'Draf memecah satu klausa Yunani menjadi dua dan menghasilkan dua tindakan “datang”: “datanglah orang banyak” lalu “mereka datang kepada-Nya”. Dalam teks sumber, πλῆθος πολύ adalah subjek tunggal secara kolektif bagi satu verba utama, ἦλθον πρὸς αὐτόν. Revisi menyatukan kembali subjek, partisipel, dan verba utama. “Sejumlah besar orang” menyatakan penekanan πολύ yang belum terwakili memadai oleh “orang banyak” saja.'
  naturalness: Revisi memakai susunan Indonesia baku yang jelas dan alami, sambil mempertahankan daftar asal yang akumulatif. “Setelah mendengar” adalah pengungkapan temporal yang wajar bagi partisipel ἀκούοντες; tidak mengubah isi yang mereka dengar.
  terminology: Yerusalem, Idumea, Sungai Yordan, Tirus, dan Sidon dipertahankan. Kapitalisasi “-Nya” mengikuti register Alkitab Indonesia yang dipakai draf. Catatan kaki dipertahankan dan jangkar c ditempatkan pada frasa yang tepat.
