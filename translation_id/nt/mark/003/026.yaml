id: MRK.3.26
reference: Mark 3:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς ἀνέστη ἐφ’ ἑαυτὸν καὶ ⸀ἐμερίσθη, οὐ δύναται ⸀στῆναι ἀλλὰ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/026.yaml
  text: And if Satan has risen up against himself and is divided[a], he cannot stand, but has come to an end.
translation:
  language: id
  text: Dan jika Satan bangkit melawan dirinya sendiri dan terpecah, ia tidak dapat bertahan, melainkan sudah sampai pada kesudahannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “melainkan mempunyai kesudahan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σατανᾶς
  choice: Satan
  rationale: Memakai transliterasi nama diri yang sudah baku dalam bahasa Indonesia.
- source_word: ἀνέστη ἐφ’ ἑαυτὸν
  choice: bangkit melawan dirinya sendiri
  rationale: Mengungkapkan tindakan permusuhan terhadap diri sendiri sekaligus mempertahankan gambaran 'bangkit' dari verba Yunani.
- source_word: ἐμερίσθη
  choice: terpecah
  rationale: Bentuk pasif ini menunjuk pada keadaan terbagi secara internal; 'terpecah' alami dan ringkas dalam bahasa Indonesia.
- source_word: οὐ δύναται στῆναι
  choice: tidak dapat bertahan
  rationale: Dalam konteks kerajaan atau kekuasaan, ungkapan ini berarti tidak mampu tetap tegak atau terus berlangsung; 'bertahan' menyampaikan idiom tersebut secara wajar.
- source_word: ἀλλὰ τέλος ἔχει
  choice: melainkan sudah sampai pada kesudahannya
  rationale: Mencerminkan secara dekat idiom harfiah 'mempunyai kesudahan' dan konsekuensi bahwa kekuasaan yang terpecah tidak dapat berlanjut, tanpa memperluasnya menjadi pernyataan eskatologis penuh.
theological_decisions:
- issue: Sifat pernyataan tentang berakhirnya kekuasaan Satan
  choice: 'Menyajikannya sebagai akibat logis dalam argumen Yesus: kekuasaan yang melawan dirinya sendiri telah sampai pada kesudahannya.'
  alternative: Menerjemahkan secara lebih mutlak sebagai 'ia sudah tamat' atau secara progresif sebagai 'ia sedang menuju kehancuran'.
  rationale: Konteksnya adalah argumen reductio tentang ketidakmungkinan kerajaan Satan bertahan jika terpecah. Terjemahan tidak boleh mengembangkan ayat ini sendiri menjadi uraian lengkap mengenai kekalahan eskatologis terakhir.
translation_notes:
  register: Bahasa Indonesia modern, baku, ringkas, dan bermartabat. Pronomina 'ia' menjaga alur alami, sedangkan 'kesudahan' mempertahankan bobot retoris τέλος tanpa terdengar terlalu sehari-hari.
