  naturalness: Versi revisi tetap memakai bahasa Indonesia modern dan alami. Pengulangan “dan” dapat dipertahankan untuk mencerminkan rangkaian καί tanpa mengurangi kelancaran.
  terminology: “Saudara-saudara laki-laki” dengan tepat mempertahankan bentuk maskulin plural ἀδελφοί tanpa menentukan sifat hubungan keluarga itu. “Sedang duduk” dan “sedang mencari” cukup mencerminkan latar tindakan yang berlangsung.
