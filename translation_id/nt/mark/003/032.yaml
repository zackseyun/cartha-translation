- from: Orang banyak sedang duduk mengelilingi Yesus, lalu orang-orang berkata kepada-Nya, “Lihat, ibu dan saudara-saudara laki-laki-Mu ada di luar dan sedang mencari-Mu.[a]”
  to: Dan orang banyak sedang duduk di sekeliling-Nya, dan mereka berkata kepada-Nya, “Lihat, ibu-Mu dan saudara-saudara laki-laki-Mu ada di luar dan sedang mencari-Mu.”[a]
  rationale: Revisi menyatakan secara eksplisit bahwa baik ibu maupun saudara-saudara laki-laki itu adalah milik/keluarga Yesus sebagaimana ditandai oleh dua kemunculan σου dalam teks Yunani. Subjek kata kerja ujaran dikembalikan menjadi “mereka” agar tidak menambahkan identitas kelompok. Letak penanda catatan kaki dipindahkan setelah tanda titik penutup kutipan.
