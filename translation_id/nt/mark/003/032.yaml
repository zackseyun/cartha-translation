  text: καὶ ἐκάθητο ⸂περὶ αὐτὸν ὄχλος⸃, ⸂καὶ λέγουσιν⸃ αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί ⸀σου ἔξω ζητοῦσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/032.yaml
  text: And a crowd was sitting around him[a], and they said to him, “Look, your mother and your brothers are outside looking for you.”
translation:
  language: id
  text: Dan orang banyak sedang duduk di sekeliling-Nya, dan mereka berkata kepada-Nya, “Lihat, ibu-Mu dan saudara-saudara laki-laki-Mu ada di luar dan sedang mencari-Mu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “mencari” juga dapat berarti “berusaha menemui.”
    reason: Alternatif leksikal ζητέω dipertahankan karena konteks dapat mencakup pencarian fisik maupun upaya untuk menemui Yesus.
lexical_decisions:
- source_word: ἐκάθητο
  choice: sedang duduk
  rationale: Bentuk imperfek menggambarkan keadaan yang sedang berlangsung sebagai latar adegan.
- source_word: περὶ αὐτὸν ὄχλος
  choice: Orang banyak sedang duduk mengelilingi Yesus
  rationale: περί dengan akusatif menyatakan posisi di sekeliling; nama “Yesus” dipakai agar rujukan pronomina alami dan jelas dalam bahasa Indonesia.
- source_word: λέγουσιν
  choice: lalu orang-orang berkata
  rationale: Bentuk kini historis dialihkan ke bentuk naratif Indonesia; “orang-orang” mempertahankan subjek jamak yang tersirat tanpa menentukan identitas mereka lebih jauh.
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: Partikel ini menarik perhatian lawan bicara; “Lihat” alami, langsung, dan tidak bernuansa arkais.
- source_word: μήτηρ
  choice: ibu
  rationale: Padanan langsung bagi istilah kekerabatan ini.
- source_word: ἀδελφοί
  choice: saudara-saudara laki-laki
  rationale: Bentuk Yunani adalah jamak maskulin. Padanan ini mempertahankan penandaan gender tanpa menambahkan penafsiran tentang sifat tepat hubungan keluarga tersebut.
- source_word: ἔξω
  choice: di luar
  rationale: Padanan lokasi yang lugas dan alami.
- source_word: ζητοῦσίν σε
  choice: sedang mencari-Mu
  rationale: ζητέω dapat berarti mencari atau berusaha menemui; dalam konteks ini “mencari” secara alami menyampaikan tindakan yang sedang berlangsung sambil mempertahankan keluasan makna dasarnya.
theological_decisions:
- issue: Rujukan ἀδελφοί
  choice: saudara-saudara laki-laki
  alternative: saudara-saudara; saudara-saudara dekat; saudara sekandung
  rationale: Ayat ini memakai istilah kekerabatan biasa tetapi tidak menjelaskan secara lebih khusus hubungan mereka dengan Yesus. Terjemahan mempertahankan bentuk maskulin tanpa menyisipkan kesimpulan denominasi mengenai hubungan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sementara aspek adegan yang sedang berlangsung dan istilah kekerabatan maskulin tetap dipertahankan.
