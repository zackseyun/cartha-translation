  text: καὶ ἐπηρώτησεν αὐτὸν ὁ Πιλᾶτος· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς ⸂αὐτῷ λέγει⸃· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/002.yaml
  text: And Pilate asked him[a], “Are you the king of the Jews?” And he answered him[b], “You say so.”
translation:
  language: id
  text: Lalu Pilatus bertanya kepada Yesus, “Apakah Engkau Raja orang Yahudi[a]?” Yesus menjawab Pilatus, “Engkau sendiri yang mengatakannya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Raja orang Yudea.” Di sini, ungkapan “Raja orang Yahudi” mencerminkan dakwaan politis yang lazim diajukan kepada Pilatus.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “Engkau berkata,” atau “Engkau yang berkata demikian.” Jawaban Yesus singkat dan tetap mengandung kadar ambiguitas.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: bertanya
  rationale: Kata ini berarti bertanya atau mengajukan pertanyaan. Dalam konteks ini, “bertanya” alami dalam bahasa Indonesia dan tidak melebihkan nuansanya menjadi pemeriksaan resmi.
- source_word: Σὺ εἶ
  choice: Apakah Engkau
  rationale: Dalam konteks pertanyaan langsung, bentuk ini diterjemahkan sebagai pertanyaan; pronomina yang eksplisit turut memberi penekanan kepada lawan bicara.
- source_word: βασιλεὺς
  choice: Raja
  rationale: “Raja” mempertahankan makna kerajaan serta bobot politis dan mesianik dari dakwaan tersebut.
- source_word: Ἰουδαίων
  choice: orang Yahudi
  rationale: Dalam kisah pengadilan di hadapan Pilatus, “Raja orang Yahudi” merupakan rumusan dakwaan politis yang lazim dan mudah dikenali. “Orang Yudea” mungkin secara leksikal, tetapi kurang tepat untuk ungkapan ini.
- source_word: ἀποκριθεὶς αὐτῷ λέγει
  choice: menjawabnya
  rationale: Ungkapan Yunani yang secara harfiah berpola “setelah menjawab, berkata kepadanya” disampaikan secara wajar sebagai “menjawabnya” dalam bahasa Indonesia tanpa kehilangan tindakan responsnya.
- source_word: Σὺ λέγεις
  choice: Engkau sendiri yang mengatakannya
  rationale: Terjemahan ini mempertahankan jawaban yang singkat dan tidak langsung, dengan menempatkan rumusan itu pada perkataan Pilatus tanpa mengubahnya menjadi penegasan “Ya” ataupun penyangkalan.
theological_decisions:
- issue: Daya ujar jawaban Yesus, Σὺ λέγεις
  choice: 'Jawaban terkendali dan agak ambigu: “Engkau sendiri yang mengatakannya.”'
  alternative: “Ya, benar seperti yang engkau katakan,” atau bentuk lebih harfiah “Engkau mengatakan.”
  rationale: Teks Yunani tidak secara eksplisit memuat kata “ya”. Terjemahan ini mempertahankan ketegangan antara pengakuan terbatas dan penolakan untuk menerima begitu saja pengertian politis Pilatus.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama “Yesus” dipakai untuk memperjelas rujukan pronomina dalam alur kalimat Indonesia. Huruf kapital pada “Engkau” mengikuti kebiasaan umum teks Alkitab Indonesia ketika menyapa Yesus; ini merupakan pilihan register, bukan penambahan makna dari bahasa Yunani.
