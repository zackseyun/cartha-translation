  text: ὁμοίως καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες πρὸς ἀλλήλους μετὰ τῶν γραμματέων ἔλεγον· Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/031.yaml
  text: In the same way the chief priests[a], mocking among themselves with the scribes, were saying, “He saved others; he cannot save himself.”
translation:
  language: id
  text: Demikian juga imam-imam kepala bersama para ahli Taurat berkata satu sama lain sambil mengolok-olok Dia[a], “Orang lain Ia selamatkan; diri-Nya sendiri tidak dapat Ia selamatkan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “imam-imam kepala, sambil mengolok-olok Dia satu sama lain bersama para ahli Taurat, berkata.” Frasa Yunani ini dapat menekankan percakapan timbal balik di antara imam-imam kepala, dengan para ahli Taurat turut serta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: Demikian juga
  rationale: Menandai bahwa ejekan para pemimpin agama sejajar dengan ejekan kelompok-kelompok yang disebut sebelumnya.
- source_word: οἱ ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Istilah ini menunjuk kepada para pemimpin kalangan imam, bukan berarti ada beberapa orang yang sekaligus memegang jabatan imam besar.
- source_word: ἐμπαίζοντες
  choice: mengolok-olok Dia
  rationale: Mengungkapkan ejekan yang menghina. Objek “Dia” dibuat tersurat dalam bahasa Indonesia berdasarkan konteks, tanpa mengubah sasaran ejekan.
- source_word: πρὸς ἀλλήλους
  choice: dalam percakapan mereka satu sama lain
  rationale: 'Menjaga unsur timbal balik: mereka menyampaikan ejekan itu dalam percakapan di antara mereka, bukan mengolok-olok satu sama lain.'
- source_word: μετὰ τῶν γραμματέων
  choice: bersama para ahli Taurat
  rationale: Menunjukkan bahwa para ahli Taurat ikut serta dengan imam-imam kepala. “Ahli Taurat” adalah sebutan Indonesia yang lazim bagi kelompok ini.
- source_word: ἔλεγον
  choice: Mereka berkata
  rationale: Bentuk imperfek menggambarkan ujaran yang berlangsung dalam adegan tersebut. Dalam narasi Indonesia, “Mereka berkata” terdengar alami tanpa menutup kemungkinan bahwa ejekan itu diucapkan berulang.
- source_word: Ἄλλους ἔσωσεν
  choice: Orang lain Ia selamatkan
  rationale: Susunan ini mempertahankan penonjolan “orang lain” dan memakai “selamatkan” agar hubungan verbal serta ironi dengan klausa berikutnya tetap jelas.
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: diri-Nya sendiri tidak dapat Ia selamatkan
  rationale: Mempertahankan penekanan pada diri-Nya sendiri, unsur ketidakmampuan dalam ejekan itu, dan pengulangan kata kerja yang sama.
theological_decisions:
- issue: Penerjemahan σῴζω secara konsisten dalam kedua klausa
  choice: selamatkan … selamatkan
  alternative: lepaskan … lepaskan; tolong … tolong
  rationale: Pengulangan “selamatkan” mempertahankan pengulangan Yunani dan ironi teologis dalam ejekan mereka, tanpa mempersempit maknanya hanya pada keselamatan rohani atau pertolongan jasmani.
- issue: Sasaran tindakan ἐμπαίζοντες
  choice: mengolok-olok Dia
  alternative: mengejek dalam percakapan mereka
  rationale: Konteks jelas menunjukkan bahwa Yesus adalah sasaran ejekan, meskipun objeknya tidak dinyatakan secara eksplisit dalam partisipel Yunani. Penambahan “Dia” diperlukan demi kejelasan alami dalam bahasa Indonesia dan tidak menyelesaikan ketegangan teologis secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk “Ia” dan “diri-Nya” dipakai untuk kejelasan rujukan dan kelaziman gaya Alkitab Indonesia, sedangkan kalimat Yunani yang panjang dibagi menjadi dua agar mudah dipahami tanpa menghilangkan hubungan antarbagiannya.
