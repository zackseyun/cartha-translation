base_translation:
  language: en
  yaml_path: translation/nt/mark/015/023.yaml
  text: And they were giving him wine mixed with myrrh[b][a], but he did not take it.
translation:
  language: id
  text: Mereka memberikan kepada-Nya anggur yang dicampur mur[a], tetapi Dia tidak menerimanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Mereka menawarkan kepada-Nya anggur yang dicampur mur.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau secara harfiah: tetapi Dia tidak mengambilnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδουν
  choice: memberi
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung atau diupayakan. Dalam bahasa Indonesia, konteks dan penolakan pada klausa berikutnya cukup menyampaikan bahwa minuman itu diberikan atau ditawarkan; bentuk sederhana 'memberi' tetap alami.
- source_word: ἐσμυρνισμένον οἶνον
  choice: anggur yang dicampur mur
  rationale: Partisipel dari σμυρνίζω menunjukkan anggur yang disiapkan dengan mur. Ungkapan ini jelas, alami, dan mempertahankan bahan yang disebutkan dalam bahasa Yunani.
- source_word: ὃς δὲ
  choice: tetapi Dia
  rationale: Walaupun ὃς secara formal merupakan kata ganti relatif, di sini ungkapan itu bersifat resumtif dan kembali menunjuk kepada Yesus. 'Tetapi Dia' secara alami mempertahankan daya pertentangan ringan dari δέ.
- source_word: ἔλαβεν
  choice: meminumnya
  rationale: λαμβάνω secara harfiah dapat berarti 'mengambil' atau 'menerima'. Dalam konteks minuman, 'meminumnya' merupakan ungkapan Indonesia yang alami, meski lebih eksplisit daripada bahasa Yunani; alternatif yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Alasan Yesus menolak minuman itu
  choice: Menyatakan tindakan tersebut tanpa menjelaskan alasan penolakan-Nya.
  alternative: Menafsirkan bahwa Yesus menolak obat pereda rasa sakit atau minuman adat tertentu.
  rationale: Ayat ini hanya menyebut pemberian anggur bercampur mur dan bahwa Yesus tidak mengambil atau meminumnya; alasan penolakan tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Huruf kapital pada 'Dia' mengikuti kebiasaan umum teks Alkitab Indonesia untuk rujukan kepada Yesus. Semua penjelasan mengenai fungsi minuman dihindari karena tidak dinyatakan dalam teks.
