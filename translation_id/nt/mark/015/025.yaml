base_translation:
  language: en
  yaml_path: translation/nt/mark/015/025.yaml
  text: It was the third hour[a], and they crucified him.
translation:
  language: id
  text: Saat itu adalah jam ketiga[a], dan mereka menyalibkan Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Menurut perhitungan waktu Yahudi yang umum, jam ketiga adalah kira-kira pukul sembilan pagi.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν
  choice: Saat itu
  rationale: Bentuk imperfek εἰμί dalam ungkapan waktu menetapkan latar waktu; “Saat itu” menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: dan
  rationale: δέ merupakan penghubung ringan dalam alur narasi, bukan pertentangan kuat; “dan” mempertahankan kesinambungan kalimat.
- source_word: ὥρα τρίτη
  choice: jam ketiga
  rationale: Terjemahan ini mempertahankan cara penghitungan waktu dalam teks sumber dan tidak memasukkan konversi modern ke dalam teks utama.
- source_word: ἐσταύρωσαν
  choice: mereka menyalibkan
  rationale: Bentuk aoris aktif menyatakan tindakan penyaliban secara langsung; “menyalibkan” adalah padanan Indonesia yang baku dan tepat.
- source_word: αὐτόν
  choice: Dia
  rationale: Kata ganti objek ini merujuk kepada Yesus; “Dia” jelas dan alami dalam konteks narasi.
theological_decisions:
- issue: Ungkapan waktu dan kaitannya dengan kronologi
  choice: Mempertahankan ungkapan harfiah “jam ketiga” dalam teks utama.
  alternative: Menerjemahkannya sebagai “kira-kira pukul sembilan pagi”.
  rationale: Ayat ini memakai penamaan waktu kuno tanpa mengubahnya menjadi sistem jam modern. Mempertahankan bentuk tersebut menghindari dimasukkannya suatu upaya penyelarasan kronologi atau kerangka penjelasan tertentu ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Jam ketiga” dipertahankan sebagai ungkapan budaya sumber, dengan penjelasan bagi pembaca modern dalam catatan kaki.
