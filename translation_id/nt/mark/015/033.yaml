  text: ⸂Καὶ γενομένης⸃ ὥρας ἕκτης σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/033.yaml
  text: And when the sixth hour had come[b][a], darkness came over the whole land until the ninth hour.
translation:
  language: id
  text: Ketika jam keenam tiba[a], kegelapan meliputi seluruh negeri[b] sampai jam kesembilan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Artinya, kira-kira pukul dua belas siang; jam kesembilan kira-kira pukul tiga sore.
    reason: cultural_note
  - marker: b
    text: Atau “seluruh bumi.” Kata Yunani yang digunakan dapat berarti “negeri” atau “bumi.”
    reason: alternative_reading
lexical_decisions:
- source_word: γενομένης ὥρας ἕκτης
  choice: Ketika jam keenam tiba
  rationale: Konstruksi genitif absolut diterjemahkan secara temporal dan alami. Ungkapan waktu sumber dipertahankan dalam teks utama, sedangkan padanannya menurut waktu modern dijelaskan dalam catatan.
- source_word: σκότος
  choice: kegelapan
  rationale: Padanan langsung dan wajar bagi nomina Yunani yang berarti keadaan gelap.
- source_word: ἐγένετο
  choice: meliputi
  rationale: Dalam hubungan dengan frasa berikutnya, pilihan ini menghasilkan bahasa Indonesia yang alami untuk datangnya kegelapan di atas suatu wilayah, tanpa mengubahnya menjadi sekadar suasana muram.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: meliputi seluruh negeri
  rationale: γῆ dapat berarti tanah, negeri, atau bumi. Dalam konteks narasi ini, 'negeri' merupakan pilihan utama yang tidak secara pasti menetapkan cakupan global; kemungkinan 'bumi' dipertahankan dalam catatan kaki.
- source_word: ἕως ὥρας ἐνάτης
  choice: sampai jam kesembilan
  rationale: Mempertahankan cara penghitungan waktu dalam sumber dan sejajar dengan 'jam keenam'; konversi ke waktu modern diberikan dalam catatan.
theological_decisions:
- issue: Cakupan γῆ dalam peristiwa kegelapan saat penyaliban
  choice: seluruh negeri
  alternative: seluruh bumi
  rationale: Istilah Yunani γῆ memiliki cakupan leksikal yang luas. Teks utama tidak memastikan bahwa kegelapan itu mencakup seluruh planet, sementara catatan kaki tetap mempertahankan kemungkinan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'jam keenam' dan 'jam kesembilan' dipertahankan agar dekat dengan bentuk sumber, dengan penjelasan waktu modern dalam catatan kaki. Penanda catatan ditempatkan langsung sesudah unsur yang dijelaskan.
