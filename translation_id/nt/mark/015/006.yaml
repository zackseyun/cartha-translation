  yaml_path: translation/nt/mark/015/006.yaml
  text: At the feast he would release for them one prisoner whom they asked for[a].
translation:
  language: id
  text: Pada hari raya itu, ia biasa membebaskan seorang tahanan bagi mereka, yaitu orang yang mereka minta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: Pada setiap hari raya
  rationale: κατά dengan akusatif menyatakan waktu berlangsungnya kebiasaan. Karena ἀπέλυεν menunjukkan tindakan yang berulang, “setiap” membuat makna kebiasaan itu jelas dan wajar dalam bahasa Indonesia. δέ hanya bersifat penghubung ringan dan tidak perlu diterjemahkan tersendiri.
- source_word: ἀπέλυεν
  choice: ia biasa membebaskan
  rationale: Bentuk imperfek menyatakan kebiasaan pada masa lampau, bukan hanya satu tindakan. “Biasa membebaskan” menyampaikannya secara alami.
- source_word: αὐτοῖς
  choice: bagi mereka
  rationale: Dativus ini menunjuk kepada pihak yang menerima manfaat dari pembebasan. “Bagi mereka” mempertahankan fungsi tersebut tanpa menentukan identitas mereka lebih jauh daripada teks sumber.
- source_word: ἕνα δέσμιον
  choice: seorang tahanan
  rationale: ἕνα menegaskan satu orang, yang secara alami tercakup dalam “seorang”; δέσμιος dalam konteks pengadilan berarti “tahanan” atau “narapidana,” dan “tahanan” tidak mengandaikan bahwa orang itu telah dijatuhi hukuman.
- source_word: ὃν παρῃτοῦντο
  choice: orang yang mereka minta
  rationale: παραιτέομαι di sini berarti meminta atau memohon agar seseorang diberikan kepada mereka. “Orang yang mereka minta” ringkas dan mempertahankan acuan relatif kepada tahanan tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “ia” dipertahankan karena subjek tidak disebutkan dalam ayat ini, melainkan dipahami dari konteks. Tanda pisah membantu menjelaskan bahwa “orang yang mereka minta” merujuk kepada “seorang tahanan.”
