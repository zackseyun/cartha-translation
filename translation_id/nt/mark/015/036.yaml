  to: Lalu seseorang berlari, mengisi sebuah spons dengan anggur asam[a], menaruhnya pada sebatang buluh, lalu memberi Yesus minum sambil berkata, “Biarkan dia saja[b]. Mari kita lihat apakah Elia datang untuk menurunkannya.”
