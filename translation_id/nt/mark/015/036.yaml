id: MRK.15.36
reference: Mark 15:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: δραμὼν δέ ⸂τις καὶ⸃ γεμίσας σπόγγον ὄξους ⸀περιθεὶς καλάμῳ ἐπότιζεν αὐτόν, λέγων· Ἄφετε ἴδωμεν εἰ ἔρχεται Ἠλίας καθελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/036.yaml
  text: Then someone ran[a], filled a sponge with sour wine, put it on a reed, and gave him a drink, saying, “Leave him alone[b]. Let us see whether Elijah is coming to take him down.”
translation:
  language: id
  text: Lalu seseorang berlari, mengisi sebuah spons dengan anggur asam[a], menaruhnya pada sebatang buluh, lalu memberi Yesus minum sambil berkata, “Biarkan dia saja[b]. Mari kita lihat apakah Elia datang untuk menurunkannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anggur asam” mengacu pada minuman anggur yang asam dan murah; istilah ini tidak harus dipahami sebagai cuka dapur dalam pengertian modern.
    reason: cultural_note
  - marker: b
    text: Atau, “Tunggu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δραμὼν
  choice: berlari
  rationale: Partisip aoristus menyatakan tindakan awal dalam rangkaian peristiwa; koordinasi dengan verba berikutnya menghasilkan narasi Indonesia yang alami.
- source_word: τις καὶ
  choice: seseorang
  rationale: Pronomina tak tentu menunjuk kepada orang yang tidak disebutkan identitasnya. καί tidak perlu diterjemahkan secara terpisah karena ‘juga’ akan terasa janggal dan tidak memperjelas maksud.
- source_word: γεμίσας σπόγγον ὄξους
  choice: mengisi sebuah spons dengan anggur asam
  rationale: ὄξος mengacu pada minuman anggur yang asam atau murah, bukan terutama cuka dapur dalam pengertian modern.
- source_word: περιθεὶς καλάμῳ
  choice: memasangnya pada sebatang buluh
  rationale: κάλαμος secara leksikal berarti buluh; ‘memasangnya’ menyampaikan tindakan menempatkan spons pada buluh agar dapat dijulurkan kepada Yesus.
- source_word: ἐπότιζεν αὐτόν
  choice: memberi Yesus minum
  rationale: Bentuk imperfek menggambarkan tindakan memberi minum. Dalam bahasa Indonesia, bentuk sederhana ini paling alami; nama ‘Yesus’ dipakai untuk memperjelas rujukan pronomina tanpa mengubah referennya.
- source_word: Ἄφετε
  choice: Biarkan dia
  rationale: Imperatif ini secara dasar memerintahkan orang lain untuk membiarkan atau berhenti bertindak. Alternatif idiomatis ‘Tunggu’ dipertahankan dalam catatan kaki.
- source_word: ἴδωμεν εἰ ἔρχεται Ἠλίας
  choice: Mari kita lihat apakah Elia datang
  rationale: Ungkapan ini menyatakan ajakan untuk melihat apakah Elia akan atau sedang datang; bentuk kini Yunani dipertahankan secara wajar dengan ‘datang’.
- source_word: καθελεῖν αὐτόν
  choice: untuk menurunkan dia
  rationale: Dalam konteks penyaliban, καθαιρέω berarti menurunkan seseorang dari tempat tinggi, yakni dari salib.
theological_decisions:
- issue: Maksud penutur dalam Ἄφετε
  choice: Diterjemahkan ‘Biarkan dia’, sebagai perintah agar orang lain tidak bertindak untuk sementara waktu.
  alternative: ‘Tunggu’ atau ‘Biarkan saja’.
  rationale: Makna dasar ἀφίημι dipertahankan dalam teks utama, sedangkan kemungkinan fungsi idiomatisnya sebagai seruan ‘Tunggu’ dicatat agar ambiguitas sumber tidak diselesaikan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. ‘Spons’ dan ‘buluh’ mempertahankan benda konkret dalam teks sumber; ‘anggur asam’ menghindari kesan cuka dapur modern.
