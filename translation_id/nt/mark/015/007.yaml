  terminology: “Para pemberontak” dan “pemberontakan itu” adalah padanan yang baik bagi στασιασταί dan στάσις serta mempertahankan keterkaitan leksikalnya. “Pembunuhan” cukup netral terhadap jumlah korban dan tidak menambahkan rincian.
