  text: The man called Barabbas was bound with the rebels who had committed murder in the rebellion[a].
translation:
  language: id
  text: Orang yang bernama Barabas itu telah dibelenggu bersama para pemberontak yang telah melakukan pembunuhan dalam pemberontakan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersama para pelaku pemberontakan” / “dalam pemberontakan itu.” Dalam bahasa Yunani, kata-kata yang berkerabat digunakan untuk para pelaku pemberontakan dan peristiwa pemberontakannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: sedang
  rationale: ἦν menyatakan keadaan Barabas pada saat itu; dalam bahasa Indonesia, aspek keadaan berlangsung dapat disampaikan secara alami dengan 'sedang', sedangkan δέ yang ringan tidak perlu selalu dinyatakan tersendiri.
- source_word: ὁ λεγόμενος Βαραββᾶς
  choice: Barabas, yang disebut demikian
  rationale: Bentuk artikel dan partisipel mengidentifikasi orang yang dikenal dengan nama Barabas tanpa memberi nada meremehkan seperti 'yang disebut-sebut'.
- source_word: μετὰ τῶν στασιαστῶν
  choice: bersama para pemberontak
  rationale: στασιασταί menunjuk kepada orang-orang yang terlibat dalam pemberontakan; 'para pemberontak' jelas, wajar, dan mempertahankan kaitan leksikal dengan στάσις.
- source_word: δεδεμένος
  choice: terbelenggu
  rationale: Partisipel perfek pasif dari δέω menyatakan keadaan telah diikat atau dibelenggu dalam tahanan; 'terbelenggu' mempertahankan gambaran konkret Yunani.
- source_word: οἵτινες
  choice: yang
  rationale: Kata ganti relatif ini memperkenalkan keterangan tentang para pemberontak dan dapat diterjemahkan secara alami dengan 'yang'.
- source_word: ἐν τῇ στάσει
  choice: dalam pemberontakan itu
  rationale: στάσις dalam konteks ini berarti pemberontakan atau perlawanan terorganisasi, bukan sekadar kerusuhan; artikel tertentu dinyatakan dengan 'itu'.
- source_word: φόνον πεποιήκεισαν
  choice: telah melakukan pembunuhan
  rationale: Bentuk verba menunjukkan tindakan yang sudah terjadi sebelumnya; φόνος menyatakan pembunuhan, tanpa memastikan dari bentuk ini saja jumlah korban atau pelaku individual.
