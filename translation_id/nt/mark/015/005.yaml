  text: ὁ δὲ Ἰησοῦς οὐκέτι οὐδὲν ἀπεκρίθη, ὥστε θαυμάζειν τὸν Πιλᾶτον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/005.yaml
  text: But Jesus no longer answered anything[a], so that Pilate was amazed.
translation:
  language: id
  text: Namun, Yesus tidak menjawab apa-apa lagi[a], sehingga Pilatus heran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Namun, Yesus tidak memberikan jawaban apa pun lagi, sehingga Pilatus merasa takjub.”
    reason: Alternatif leksikal yang mempertahankan cakupan penuh οὐδὲν dan kemungkinan nuansa θαυμάζειν sebagai rasa takjub.
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan ringan dengan konteks sebelumnya dan terdengar wajar dalam narasi Indonesia.
- source_word: οὐκέτι
  choice: lagi
  rationale: Dalam konstruksi negatif “tidak ... lagi,” kata ini mempertahankan makna bahwa tindakan menjawab tidak berlanjut.
- source_word: οὐδὲν
  choice: apa-apa
  rationale: Bersama verba negatif, “tidak menjawab apa-apa” merupakan ungkapan Indonesia yang alami dan menyatakan keheningan secara menyeluruh.
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Padanan langsung dan lazim dalam konteks pemeriksaan atau percakapan.
- source_word: ὥστε
  choice: sehingga
  rationale: Menyatakan hasil dari sikap diam Yesus, bukan tujuan.
- source_word: θαυμάζειν
  choice: heran
  rationale: Mengungkapkan reaksi kuat Pilatus secara alami tanpa menambahkan alasan atau penilaian yang tidak dinyatakan teks.
- source_word: Πιλᾶτον
  choice: Pilatus
  rationale: Mengikuti bentuk nama yang sudah mapan dalam tradisi dan pemakaian Alkitab bahasa Indonesia.
