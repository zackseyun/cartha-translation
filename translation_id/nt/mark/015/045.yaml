  text: καὶ γνοὺς ἀπὸ τοῦ κεντυρίωνος ἐδωρήσατο τὸ ⸀πτῶμα τῷ Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/045.yaml
  text: And after learning from the centurion[a], he granted the body to Joseph.
translation:
  language: id
  text: Setelah menerima informasi dari perwira itu, Pilatus memberikan jenazah[a] itu kepada Yusuf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mayat” atau “tubuh yang sudah mati.”
    reason: Menampilkan alternatif yang lebih harfiah bagi πτῶμα, yang secara tegas menunjuk pada tubuh orang mati.
lexical_decisions:
- source_word: γνοὺς
  choice: setelah mendapat kepastian
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului tindakan utama. Dalam konteks, Pilatus memperoleh konfirmasi tentang kematian Yesus; ungkapan ini alami dalam bahasa Indonesia tanpa menyebut objek secara berlebihan.
- source_word: ἀπὸ τοῦ κεντυρίωνος
  choice: dari perwira itu
  rationale: ἀπό dengan genitif menandai sumber informasi. κεντυρίων adalah perwira Romawi yang memimpin kira-kira seratus prajurit; 'perwira' jelas bagi pembaca modern dan konteks sebelumnya sudah mengidentifikasi orang tersebut.
- source_word: ἐδωρήσατο
  choice: menyerahkan
  rationale: Bentuk ini berarti memberikan atau menganugerahkan sebagai suatu izin atau kemurahan. 'Menyerahkan' sesuai dengan tindakan resmi Pilatus yang memberikan jenazah kepada Yusuf, tanpa membuat kalimat terasa kaku.
- source_word: πτῶμα
  choice: jenazah
  rationale: Kata ini secara khusus menunjuk pada tubuh yang telah mati. 'Jenazah' menyampaikan makna itu dengan alami, jelas, dan bermartabat dalam bahasa Indonesia.
- source_word: τῷ Ἰωσήφ
  choice: kepada Yusuf
  rationale: Bentuk datif menandai Yusuf sebagai penerima penyerahan tersebut.
theological_decisions:
- issue: Subjek tersirat pada ἐδωρήσατο
  choice: Pilatus
  alternative: ia
  rationale: Bahasa Yunani tidak mengulang nama subjek, tetapi konteks langsung menetapkan Pilatus sebagai pelaku. Menyebut namanya menghindari ketidakjelasan dalam bahasa Indonesia tanpa menambahkan identitas baru.
translation_notes:
  register: 'Bahasa Indonesia modern, lugas, dan bermartabat. Urutan tindakan dipertahankan: Pilatus lebih dahulu menerima kepastian dari perwira, lalu menyerahkan jenazah kepada Yusuf.'
