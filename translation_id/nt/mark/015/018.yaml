  text: καὶ ἤρξαντο ἀσπάζεσθαι αὐτόν· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/018.yaml
  text: 'And they began to salute him: “Hail[b][a], King of the Jews!”'
translation:
  language: id
  text: Lalu mereka mulai memberi salam kepada-Nya, “Salam, hai Raja orang Yahudi!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Dalam alur narasi bahasa Indonesia, “Lalu” menyampaikan kesinambungan tindakan secara alami; kata ini sedikit lebih idiomatis daripada memulai kalimat dengan “Dan” tanpa menambahkan hubungan sebab-akibat.
- source_word: ἤρξαντο
  choice: mulai
  rationale: Dengan infinitif ἀσπάζεσθαι, bentuk ini menyatakan awal suatu tindakan; “mulai” mempertahankan perkembangan narasi secara ringkas dan alami.
- source_word: ἀσπάζεσθαι
  choice: memberi salam
  rationale: Verba ini pada dasarnya berarti menyapa atau memberi salam. Dalam konteks ini tindakannya berupa penghormatan resmi yang mengejek; “memberi salam” mempertahankan arti leksikal sambil membiarkan konteks menunjukkan ejekannya.
- source_word: Χαῖρε
  choice: Salam
  rationale: Di sini bentuk imperatif χαῖρε berfungsi idiomatis sebagai ucapan salam atau penghormatan, bukan perintah harfiah untuk bersukacita. “Salam” terdengar wajar dan tetap cocok dengan penghormatan kerajaan yang diparodikan.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: hai Raja orang Yahudi
  rationale: Bentuk vokatif βασιλεῦ dinyatakan secara alami dengan “hai Raja”, sedangkan τῶν Ἰουδαίων diterjemahkan “orang Yahudi”, pengertian baku dan kontekstual dalam gelar pada kisah sengsara ini.
theological_decisions:
- issue: Menyampaikan penghormatan olok-olok kepada Yesus tanpa menghilangkan ironi dan makna kerajaannya
  choice: “Salam, hai Raja orang Yahudi!” sebagai penghormatan kerajaan yang diparodikan
  alternative: “Salam, Raja orang Yudea!” atau “Bersukacitalah, Raja orang Yahudi!”
  rationale: Konteks para prajurit menunjukkan ejekan, tetapi terjemahan tidak perlu menambahkan kata “mengejek”. “Salam” mempertahankan fungsi idiomatis Χαῖρε dan seruan “hai Raja” mempertahankan sapaan langsung serta ironi kerajaan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapital pada “Raja” dipertahankan sebagai bagian dari gelar dalam seruan langsung, sedangkan “kepada-Nya” mengikuti konvensi penghormatan Indonesia bagi rujukan kepada Yesus. Tidak diperlukan catatan kaki karena alternatif leksikal tidak cukup penting untuk mengganggu teks utama.
