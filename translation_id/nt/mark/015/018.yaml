  source_fidelity: 'Terjemahan dengan tepat mencerminkan unsur-unsur utama teks Yunani: καί sebagai penghubung naratif (“Lalu”), ἤρξαντο sebagai aspek ingresif (“mulai”), ἀσπάζεσθαι sebagai tindakan memberi salam, serta aklamasi langsung Χαῖρε, βασιλεῦ τῶν Ἰουδαίων. Konteks ejekan tidak perlu ditambahkan ke dalam teks karena sudah ditentukan oleh konteks naratif sekitarnya.'
