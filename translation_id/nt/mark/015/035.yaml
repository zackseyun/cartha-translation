id: MRK.15.35
reference: Mark 15:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καί τινες τῶν παρεστηκότων ἀκούσαντες ἔλεγον· ⸀Ἴδε Ἠλίαν φωνεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/035.yaml
  text: And some of those standing there[a], when they heard it, were saying, “Look, he is calling Elijah.”
translation:
  language: id
  text: Ketika mendengar itu, beberapa orang yang berdiri di situ berkata, “Lihat, Dia memanggil Elia.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Lihat, Dia memanggil Elia untuk datang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: Ketika
  rationale: Hubungan dengan tindakan berikutnya diungkapkan secara alami melalui anak kalimat temporal bersama ἀκούσαντες; καί tidak perlu diterjemahkan tersendiri karena alur narasinya tetap jelas.
- source_word: τινες
  choice: beberapa orang
  rationale: Menunjuk pada sejumlah orang yang tidak ditentukan dari antara mereka yang hadir.
- source_word: τῶν παρεστηκότων
  choice: yang berdiri di situ
  rationale: Mempertahankan gambaran konkret tentang orang-orang yang berada dan berdiri dekat tempat kejadian.
- source_word: ἀκούσαντες
  choice: ketika mendengar itu
  rationale: Partisip aoris menunjukkan tindakan yang mendahului perkataan mereka; “itu” diperjelas dari konteks sebagai seruan Yesus sebelumnya.
- source_word: ἔλεγον
  choice: berkata
  rationale: Bentuk imperfek menyajikan ujaran yang sedang berlangsung, tetapi bahasa Indonesia tidak wajib menandai aspek tersebut secara eksplisit; “berkata” paling wajar dalam narasi.
- source_word: Ἴδε
  choice: Lihat
  rationale: Imperatif penarik perhatian diterjemahkan dengan ungkapan modern dan langsung.
- source_word: Ἠλίαν
  choice: Elia
  rationale: Mengikuti bentuk nama nabi yang baku dalam bahasa Indonesia.
- source_word: φωνεῖ
  choice: Dia memanggil
  rationale: Mempertahankan verba umum “memanggil” tanpa memperkuatnya menjadi “berseru meminta pertolongan”; subjek tersirat dibuat eksplisit secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah perlu dijelaskan bahwa orang-orang itu keliru memahami seruan Yesus sebagai panggilan kepada Elia
  choice: Mempertahankan pernyataan langsung “Dia memanggil Elia” tanpa penjelasan narator
  alternative: Dia memanggil-manggil Elia / Mereka mengira Dia memanggil Elia
  rationale: Teks Yunani hanya melaporkan ucapan mereka. Kesalahpahaman tersebut muncul dari konteks dan tidak boleh dijelaskan melampaui sumber.
- issue: Nuansa φωνεῖ dengan objek langsung Ἠλίαν
  choice: Dia memanggil Elia
  alternative: Dia memanggil Elia untuk datang
  rationale: Terjemahan utama mempertahankan bentuk yang dekat dengan konstruksi Yunani dan tidak menambahkan tujuan panggilan; kemungkinan nuansa meminta Elia datang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara ucapan para saksi tetap ringkas dan tidak diberi tafsiran tambahan.
