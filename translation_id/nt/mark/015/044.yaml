  text: ὁ δὲ Πιλᾶτος ἐθαύμασεν εἰ ἤδη τέθνηκεν, καὶ προσκαλεσάμενος τὸν κεντυρίωνα ἐπηρώτησεν αὐτὸν εἰ ⸀πάλαι ἀπέθανεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/044.yaml
  text: But Pilate was amazed that he had already died[a], and summoning the centurion, he asked him whether he had died already.
translation:
  language: id
  text: Tetapi Pilatus heran bahwa Yesus sudah meninggal. Setelah memanggil perwira seratus itu, ia bertanya kepadanya apakah Yesus sudah meninggal cukup lama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apakah Yesus telah meninggal beberapa waktu sebelumnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμασεν
  choice: heran
  rationale: Kata ini menyatakan keterkejutan Pilatus karena Yesus dilaporkan meninggal begitu cepat; “heran” alami dan tepat dalam narasi Indonesia.
- source_word: εἰ ἤδη τέθνηκεν
  choice: bahwa Yesus sudah meninggal
  rationale: Sesudah verba yang menyatakan keheranan, εἰ secara idiomatis dapat menyampaikan isi yang menimbulkan keheranan. Bentuk perfek menyoroti kematian yang telah terjadi beserta keadaan sebagai orang yang sudah mati; nama “Yesus” dipakai untuk memperjelas rujukan pronomina tersirat.
- source_word: προσκαλεσάμενος
  choice: Ia memanggil
  rationale: Partisip ini menyatakan tindakan yang mendahului pertanyaan Pilatus. Pemecahan menjadi kalimat baru menghasilkan bahasa Indonesia yang jelas dan alami.
- source_word: κεντυρίωνα
  choice: perwira
  rationale: Istilah ini menunjuk kepada centurion, yaitu perwira militer Romawi. “Perwira” mempertahankan fungsi jabatannya tanpa memakai istilah serapan yang kurang umum.
- source_word: ἐπηρώτησεν αὐτόν
  choice: bertanya kepadanya
  rationale: Ungkapan ini secara lugas menyatakan bahwa Pilatus meminta keterangan dari perwira tersebut.
- source_word: εἰ πάλαι ἀπέθανεν
  choice: apakah Yesus sudah meninggal sejak beberapa waktu sebelumnya
  rationale: πάλαι di sini menunjuk pada selang waktu yang telah berlalu relatif terhadap saat Pilatus bertanya, bukan pada masa lampau yang jauh. Terjemahan ini membedakannya dari ἤδη pada klausa sebelumnya dan mempertahankan fokus pertanyaan pada lamanya Yesus telah meninggal.
theological_decisions:
- issue: Rujukan subjek tersirat pada kedua klausa tentang kematian
  choice: Yesus
  alternative: ia
  rationale: Bahasa Yunani tidak menyebut nama pada ayat ini, tetapi konteks langsung dengan jelas menunjuk kepada Yesus. Penyebutan nama mencegah kerancuan dengan Pilatus atau perwira tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dua klausa utama dipisahkan menjadi dua kalimat agar urutan tindakan Pilatus mudah dipahami. Ungkapan “sejak beberapa waktu sebelumnya” mempertahankan nuansa duratif πάλαι tanpa memberi kesan bahwa kematian itu terjadi jauh sebelumnya.
