id: MRK.15.15
reference: Mark 15:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος βουλόμενος τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, καὶ παρέδωκεν τὸν Ἰησοῦν φραγελλώσας ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/015.yaml
  text: So Pilate[a], wanting to satisfy the crowd, released Barabbas to them; and after having Jesus flogged, he handed him over to be crucified.
translation:
  language: id
  text: Karena Pilatus ingin memuaskan orang banyak,[a] ia membebaskan Barabas bagi mereka. Setelah menyuruh orang mencambuk Yesus, ia menyerahkan-Nya untuk disalibkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menyenangkan orang banyak.” Secara harfiah: “melakukan apa yang cukup bagi orang banyak.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενος
  choice: ingin
  rationale: Partisipel ini menyatakan kehendak atau maksud Pilatus; 'ingin' alami dalam bahasa Indonesia modern tanpa melebih-lebihkan kadar pertimbangannya.
- source_word: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: memuaskan orang banyak
  rationale: Ungkapan ini secara harfiah berarti melakukan apa yang memadai bagi orang banyak, dan dalam konteks menunjukkan upaya memenuhi tuntutan mereka. 'Memuaskan' mempertahankan tekanan politisnya dengan lebih baik daripada sekadar 'menyenangkan'.
- source_word: ἀπέλυσεν
  choice: membebaskan
  rationale: Dalam konteks hukum, verba ini berarti melepaskan seorang tahanan; 'membebaskan' merupakan padanan Indonesia yang jelas dan wajar.
- source_word: αὐτοῖς
  choice: bagi mereka
  rationale: Dativus ini merujuk kepada orang banyak sebagai pihak yang mendapatkan pembebasan Barabas sesuai tuntutan mereka.
- source_word: παρέδωκεν
  choice: menyerahkan-Nya
  rationale: Verba ini berarti menyerahkan seseorang ke dalam kuasa pihak lain. 'Menyerahkan' mempertahankan bobot khas kisah penderitaan sekaligus alami dalam bahasa Indonesia.
- source_word: φραγελλώσας
  choice: setelah menyuruh orang mencambuk Yesus
  rationale: Partisipel aoris menunjukkan tindakan yang mendahului penyerahan. Bentuk kausatif yang wajar ini menjelaskan bahwa Pilatus memerintahkan pencambukan, bukan melakukannya sendiri.
- source_word: ἵνα σταυρωθῇ
  choice: untuk disalibkan
  rationale: Klausa ἵνα menyatakan tujuan atau hasil yang dimaksudkan; bentuk ini idiomatis sesudah 'menyerahkan' dan mempertahankan bentuk pasif sumber.
- source_word: Βαραββᾶν
  choice: Barabas
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam tradisi bahasa Indonesia.
- source_word: Ἰησοῦν
  choice: Yesus
  rationale: Nama pribadi ditransliterasikan menurut bentuk baku bahasa Indonesia.
theological_decisions:
- issue: Maksud Pilatus dalam τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: Pilatus bertindak untuk memuaskan tuntutan orang banyak
  alternative: Pilatus bertindak untuk menyenangkan orang banyak atau melakukan apa yang dianggap cukup bagi mereka
  rationale: '''Memuaskan orang banyak'' menyampaikan idiom Yunani sebagai tindakan memenuhi desakan mereka dan mempertahankan ketegangan moral-politis narasi tanpa menambahkan penafsiran doktrinal.'
translation_notes:
  register: Bahasa Indonesia baku yang modern, jelas, dan bermartabat. Struktur kalimat dipecah menjadi dua agar alur tindakan mudah diikuti. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kelaziman luas dalam penerbitan Alkitab Indonesia tanpa mengubah makna gramatikal sumber.
