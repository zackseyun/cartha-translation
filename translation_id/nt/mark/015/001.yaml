id: MRK.15.1
reference: Mark 15:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς πρωῒ συμβούλιον ποιήσαντες οἱ ἀρχιερεῖς μετὰ τῶν πρεσβυτέρων καὶ γραμματέων καὶ ὅλον τὸ συνέδριον δήσαντες τὸν Ἰησοῦν ἀπήνεγκαν καὶ ⸀παρέδωκαν Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/001.yaml
  text: And immediately[a], early in the morning, the chief priests held a consultation with the elders and scribes and the whole council; then they bound Jesus, led him away, and handed him over to Pilate.
translation:
  language: id
  text: Pagi-pagi sekali, para imam kepala segera mengadakan perundingan bersama para tua-tua, ahli-ahli Taurat, dan seluruh Mahkamah Agama. Setelah mengikat Yesus, mereka membawa-Nya pergi dan menyerahkan-Nya kepada Pilatus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: segera
  rationale: Mempertahankan desakan khas narasi Markus dengan ungkapan Indonesia yang alami.
- source_word: πρωῒ
  choice: pagi-pagi sekali
  rationale: Menyatakan waktu pada pagi buta atau sangat awal secara jelas dan idiomatis.
- source_word: συμβούλιον ποιήσαντες
  choice: mengadakan perundingan
  rationale: Menangkap tindakan bermusyawarah secara resmi tanpa mengesankan bahwa mereka sekadar menyusun rencana.
- source_word: ἀρχιερεῖς
  choice: para imam kepala
  rationale: Sebutan baku bagi kalangan pemimpin imam, bukan beberapa imam besar yang menjabat sekaligus.
- source_word: πρεσβυτέρων
  choice: para tua-tua
  rationale: Dalam konteks pemerintahan Yahudi, kata ini menunjuk kepada para pemimpin yang diakui.
- source_word: γραμματέων
  choice: ahli-ahli Taurat
  rationale: Ungkapan yang lazim dan mudah dipahami untuk para pakar serta penafsir hukum Taurat.
- source_word: ὅλον τὸ συνέδριον
  choice: seluruh Mahkamah Agama
  rationale: Menyampaikan fungsi lembaga pemerintahan dan peradilan Yahudi secara lebih transparan bagi pembaca Indonesia.
- source_word: δήσαντες
  choice: setelah mengikat
  rationale: 'Menjaga urutan tindakan partisipel aoristus: Yesus diikat sebelum dibawa pergi.'
- source_word: ἀπήνεγκαν
  choice: membawa-Nya pergi
  rationale: Alami untuk pemindahan seseorang dalam tahanan tanpa menyiratkan bahwa Ia harus digotong.
- source_word: παρέδωκαν
  choice: menyerahkan-Nya
  rationale: Mempertahankan nuansa pemindahan resmi ke dalam kuasa atau tahanan Pilatus.
- source_word: Πιλάτῳ
  choice: Pilatus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan συνέδριον
  choice: Mahkamah Agama
  alternative: Sanhedrin; seluruh dewan
  rationale: Istilah ini menunjuk lembaga pemerintahan dan peradilan Yahudi. Terjemahan fungsional membantu pembaca modern, sedangkan nama historisnya dicantumkan dalam catatan.
- issue: Daya makna παρέδωκαν dalam kisah penderitaan
  choice: menyerahkan-Nya
  alternative: menyerahkan-Nya ke dalam tahanan; menyerahkan-Nya kepada pihak berwenang
  rationale: Pilihan ini mempertahankan pemindahan kuasa secara yudisial tanpa memasukkan penafsiran teologis yang melampaui ayat.
- issue: Hubungan para pemimpin dengan seluruh συνέδριον
  choice: para imam kepala mengadakan perundingan dengan para tua-tua, ahli-ahli Taurat, dan seluruh Mahkamah Agama
  alternative: para imam kepala, para tua-tua, ahli-ahli Taurat, yakni seluruh Mahkamah Agama, mengadakan perundingan
  rationale: Sintaksis Yunani memungkinkan pembacaan bahwa semua kelompok itu terlibat dalam perundingan; terjemahan utama mengikuti susunan paling langsung tanpa menjadikan frasa terakhir sebagai penjelasan identitas yang pasti.
translation_notes:
  register: Bahasa modern, lugas, dan khidmat. Pronomina untuk Yesus ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan [a] ditempatkan sesudah ‘segera’, yaitu unsur yang dijelaskan.
