  terminology: “Para imam kepala,” “para tua-tua,” “ahli-ahli Taurat,” dan “menyerahkan-Nya kepada Pilatus” tepat. “Mahkamah Agama” dapat dipakai untuk συνέδριον dalam konteks ini; istilah tersebut menyampaikan fungsi lembaga tanpa memaksakan transliterasi “Sanhedrin.”
