  text: ὁ δὲ Πιλᾶτος ἀπεκρίθη αὐτοῖς λέγων· Θέλετε ἀπολύσω ὑμῖν τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/009.yaml
  text: But Pilate answered them[a], saying, “Do you want me to release to you the King of the Jews?”
translation:
  language: id
  text: Namun Pilatus menjawab mereka, “Apakah kalian ingin aku membebaskan Raja orang Yahudi untuk kalian?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan pertentangan ringan terhadap konteks sebelumnya dan terdengar alami dalam narasi Indonesia.
- source_word: ἀπεκρίθη αὐτοῖς λέγων
  choice: menjawab mereka, katanya
  rationale: Mempertahankan unsur respons dari ἀπεκρίθη serta partisip λέγων tanpa membuat kalimat terlalu kaku.
- source_word: Θέλετε
  choice: Apakah kalian mau
  rationale: Mengungkapkan kehendak atau keinginan dengan bahasa Indonesia modern; bentuk jamak tercermin dalam 'kalian'.
- source_word: ἀπολύσω
  choice: supaya aku membebaskan
  rationale: Dalam konteks pengadilan, ἀπολύω berarti melepaskan atau membebaskan seorang tahanan; konstruksi ini juga mempertahankan subjek orang pertama.
- source_word: ὑμῖν
  choice: bagi kalian
  rationale: Menyatakan bahwa pembebasan itu dilakukan untuk orang banyak, sekaligus menghindari pengulangan 'kepada kalian' yang kurang alami setelah 'membebaskan'.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: Raja orang Yahudi
  rationale: Merupakan gelar politis yang tetap dalam kisah sengsara. Kapitalisasi 'Raja' menandai pemakaiannya sebagai gelar dalam ucapan langsung, bukan tambahan penafsiran teologis penerjemah.
theological_decisions:
- issue: Pemaknaan gelar τὸν βασιλέα τῶν Ἰουδαίων
  choice: Raja orang Yahudi
  alternative: raja orang Yudea
  rationale: Ἰουδαίων dapat menunjuk kepada orang Yahudi atau orang Yudea. Dalam gelar politis yang berulang pada kisah sengsara, 'Raja orang Yahudi' adalah ungkapan Indonesia yang mapan dan sesuai konteks, sambil tetap mencatat alternatif geografis-etnis dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. 'Kalian' dipakai untuk memperjelas bentuk jamak dari ὑμῖν/Θέλετε; 'aku' sesuai dengan ucapan langsung Pilatus dan gaya modern.
