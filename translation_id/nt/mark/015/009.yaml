  naturalness: Kalimat 'menjawab mereka, katanya' terasa berlebihan dalam bahasa Indonesia modern. Partisip λέγων lazim diterjemahkan secara implisit setelah verba ujaran/penjawaban. Susunan yang direvisi lebih lancar tanpa kehilangan daya responsif ἀπεκρίθη.
  terminology: '''Raja orang Yahudi'' adalah terjemahan yang mapan dan sesuai untuk τὸν βασιλέα τῶν Ἰουδαίων dalam gelar politis ini. Catatan kaki secara tepat mempertahankan kemungkinan ''orang Yudea'' tanpa memaksakan salah satu nuansa leksikal yang diperdebatkan.'
