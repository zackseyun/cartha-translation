  text: ὁ δὲ Πιλᾶτος ⸂πάλιν ἀποκριθεὶς ἔλεγεν⸃ αὐτοῖς· Τί οὖν ⸀θέλετε ποιήσω ⸂ὃν λέγετε⸃ ⸀τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/012.yaml
  text: Pilate answered them again[a], “Then what do you want me to do with the one you call the king of the Jews?”
translation:
  language: id
  text: Pilatus menjawab mereka lagi, “Kalau begitu, apa yang kalian ingin kulakukan terhadap orang yang kalian sebut raja orang Yahudi[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terhadap dia yang kalian sebut raja orang Yahudi?”
    reason: Alternatif idiomatis yang memakai “dia” alih-alih “orang” untuk menerjemahkan ὃν; keduanya mempertahankan bahwa sebutan itu berasal dari pihak orang banyak.
lexical_decisions:
- source_word: πάλιν
  choice: lagi
  rationale: Kata ini menunjukkan bahwa Pilatus kembali berbicara dalam percakapan yang sedang berlangsung; “lagi” ringkas dan alami dalam bahasa Indonesia.
- source_word: ἀποκριθεὶς ἔλεγεν
  choice: menjawab
  rationale: Gabungan partisip dan verba imperfek ini merupakan ungkapan naratif untuk memperkenalkan jawaban. “Menjawab” menyampaikan fungsinya secara alami tanpa bentuk harfiah yang kaku seperti “setelah menjawab, berkata”.
- source_word: Τί οὖν
  choice: Kalau begitu, apa
  rationale: οὖν menghubungkan pertanyaan Pilatus dengan tuntutan orang banyak sebelumnya. “Kalau begitu” mempertahankan hubungan penalaran itu dalam bahasa Indonesia modern.
- source_word: θέλετε
  choice: kalian ingin
  rationale: Dalam konteks ini θέλω menyatakan keinginan atau pilihan. “Kalian ingin” jelas, alami, dan menunjukkan bahwa Pilatus berbicara kepada banyak orang.
- source_word: ποιήσω
  choice: kulakukan
  rationale: Subjungtif aoris orang pertama setelah θέλετε secara alami diungkapkan sebagai “kalian ingin kulakukan,” dengan Pilatus sebagai pelaku.
- source_word: ὃν λέγετε
  choice: orang yang kalian sebut
  rationale: Klausa relatif ini menempatkan sebutan tersebut pada pihak orang banyak. Terjemahan ini tidak menambahkan pengakuan bahwa gelar itu benar ataupun menyangkalnya.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: raja orang Yahudi
  rationale: Ini adalah gelar politis yang berulang dalam kisah sengsara. Huruf kecil pada “raja” sesuai karena dalam ucapan ini gelar tersebut berfungsi sebagai sebutan, bukan secara eksplisit sebagai pengakuan iman.
theological_decisions:
- issue: Apakah perkataan Pilatus mengakui Yesus sebagai raja atau menjaga jarak dari gelar tersebut
  choice: “orang yang kalian sebut raja orang Yahudi”
  alternative: “raja orang Yahudi itu”
  rationale: Klausa Yunani ὃν λέγετε menonjolkan bahwa orang banyaklah yang menggunakan sebutan itu. Terjemahan mempertahankan jarak retoris Pilatus tanpa memutuskan apakah ia sendiri menerima atau menolak gelar tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan dialog yang alami. “Kalian” dipakai untuk memperjelas bahwa lawan bicara Pilatus berbentuk jamak, sedangkan bentuk “kulakukan” menjaga kelancaran ujaran langsung. Gelar “raja orang Yahudi” ditulis dengan huruf kecil karena konteksnya berupa sebutan politis dalam perkataan Pilatus.
