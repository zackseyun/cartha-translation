  source_fidelity: 'Draf pada dasarnya setia: ‘membawa’ tepat untuk φέρουσιν dan ‘Tempat Tengkorak’ mempertahankan konstruksi Κρανίου Τόπος tanpa memaksakan ketakrifan. Namun, ‘yang jika diterjemahkan berarti’ melemahkan pernyataan eksplanatoris partisip μεθερμηνευόμενον dengan nuansa pengandaian yang tidak ada dalam bahasa Yunani.'
