  register: Bahasa Indonesia modern, baku, dan bermartabat. ‘Lalu’ mengalir alami dalam narasi; ‘membawa’ tidak menyiratkan secara pasti bahwa Yesus dipikul. Ungkapan ‘Tempat Tengkorak’ mempertahankan ambiguitas ketakrifan teks Yunani.
