base_translation:
  language: en
  yaml_path: translation/nt/mark/015/022.yaml
  text: And they bring him to the place Golgotha[a], which is translated, “Place of a Skull.”
translation:
  language: id
  text: Lalu mereka membawa Yesus ke tempat yang disebut Golgota, yang diterjemahkan sebagai “Tempat Tengkorak.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φέρουσιν αὐτὸν
  choice: mereka membawa Yesus
  rationale: Bentuk kini berfungsi sebagai kala kini historis dalam narasi dan secara alami diterjemahkan dengan bentuk lampau bahasa Indonesia. ‘Membawa’ menyatakan gerak menuju tujuan tanpa memastikan bahwa Yesus digotong. Pronomina ‘dia’ diperjelas menjadi ‘Yesus’ agar rujukannya alami dan tidak ambigu dalam bahasa Indonesia.
- source_word: ἐπὶ τὸν Γολγοθᾶν τόπον
  choice: ke tempat yang bernama Golgota
  rationale: ἐπί dengan akusatif menunjukkan gerak menuju suatu tempat. Rumusan ini mempertahankan unsur τόπον dan nama tempatnya; ‘yang bernama’ membuat konstruksi aposisional Yunani menjadi wajar dalam bahasa Indonesia tanpa mengubah maksudnya.
- source_word: Γολγοθᾶν
  choice: Golgota
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: μεθερμηνευόμενον
  choice: yang jika diterjemahkan berarti
  rationale: Partisip ini menjelaskan terjemahan atau penafsiran nama tersebut. Gabungan ‘jika diterjemahkan berarti’ terdengar alami dalam bahasa Indonesia sekaligus mempertahankan gagasan penerjemahan.
- source_word: Κρανίου Τόπος
  choice: Tempat Tengkorak
  rationale: Konstruksi genitif diterjemahkan secara idiomatis tanpa artikel karena bahasa Indonesia tidak mewajibkan pembedaan antara ‘sebuah tengkorak’ dan ‘tengkorak itu’ seperti bahasa Inggris. Kapitalisasi menandai ungkapan tersebut sebagai penjelasan nama tempat.
theological_decisions: []
