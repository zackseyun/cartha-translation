id: MRK.15.11
reference: Mark 15:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς ἀνέσεισαν τὸν ὄχλον ἵνα μᾶλλον τὸν Βαραββᾶν ἀπολύσῃ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/011.yaml
  text: But the chief priests stirred up the crowd so that he would release Barabbas to them instead[a][b].
translation:
  language: id
  text: Namun, imam-imam kepala menghasut orang banyak agar Pilatus membebaskan Barabas bagi mereka sebagai gantinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “agar Pilatus justru membebaskan Barabas bagi mereka.” Maksudnya, Barabas dibebaskan sebagai pilihan yang lebih mereka kehendaki daripada orang lain yang tersirat dari konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Namun
  rationale: δέ menandai kontras ringan dengan pertanyaan Pilatus pada ayat sebelumnya; “Namun” menyampaikan peralihan adversatif itu secara alami.
- source_word: ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Istilah baku dan tepat untuk kelompok pemimpin keimaman di Yerusalem.
- source_word: ἀνέσεισαν
  choice: menghasut
  rationale: ἀνασείω dalam konteks ini berarti menggerakkan atau membangkitkan orang banyak menuju tindakan yang dikehendaki; “menghasut” menyampaikan unsur dorongan kuat secara wajar.
- source_word: τὸν ὄχλον
  choice: orang banyak
  rationale: ὄχλος menunjuk pada kumpulan orang; “orang banyak” alami dalam narasi Indonesia dan lebih luwes daripada “kerumunan” dalam konteks ini.
- source_word: ἵνα
  choice: agar
  rationale: Memperlihatkan tujuan tindakan imam-imam kepala secara ringkas dan alami.
- source_word: μᾶλλον
  choice: sebagai gantinya
  rationale: Menandai bahwa Barabas lebih dipilih daripada alternatif yang tersirat oleh konteks, tanpa menambahkan nama Yesus yang tidak disebut dalam teks ayat ini.
- source_word: τὸν Βαραββᾶν
  choice: Barabas
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: ἀπολύσῃ
  choice: membebaskan
  rationale: Subjungtif aoris setelah ἵνα menyatakan hasil yang dikehendaki. Bentuk Indonesia tidak perlu menandai modus itu secara tersendiri.
- source_word: αὐτοῖς
  choice: bagi mereka
  rationale: Datif ini dapat menyatakan pihak yang menerima manfaat; “bagi mereka” terdengar lebih alami daripada “kepada mereka” untuk pembebasan seorang tahanan.
theological_decisions:
- issue: Subjek tersirat dari ἀπολύσῃ
  choice: Pilatus disebut secara eksplisit demi kejelasan dalam bahasa Indonesia.
  alternative: 'Membiarkan subjek tersirat: “agar Barabas dibebaskan bagi mereka.”'
  rationale: Bentuk verba Yunani tidak menyebut nama subjek, tetapi konteks langsung menetapkan Pilatus sebagai orang yang akan membebaskan tahanan. Menyebutnya mencegah konstruksi Indonesia yang kabur tanpa mengubah pelaku yang dimaksud.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Menghasut” dipilih karena alami bagi tindakan sengaja yang menggerakkan massa. Penanda catatan kaki ditempatkan setelah frasa yang menerangkan daya banding μᾶλλον.
