  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan unsur-unsur utama Yunani: penyaliban, pembagian pakaian-Nya, pengundian berkaitan dengan pakaian itu, dan hasil distributif “siapa mendapat apa.” Bentuk verba Indonesia yang tidak bertanda kala dapat menyampaikan present historis σταυροῦσιν tanpa tambahan yang tidak ada dalam sumber.'
