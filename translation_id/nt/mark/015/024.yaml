  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸂σταυροῦσιν αὐτὸν καὶ⸃ διαμερίζονται τὰ ἱμάτια αὐτοῦ, βάλλοντες κλῆρον ἐπ’ αὐτὰ τίς τί ἄρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/024.yaml
  text: And they crucify him and divide his garments among themselves[a], casting lots for them to decide what each would take.
translation:
  language: id
  text: Mereka menyalibkan Dia dan membagi-bagi pakaian-Nya, sambil membuang undi atas pakaian itu untuk menentukan siapa mendapat apa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “siapa mengambil apa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σταυροῦσιν
  choice: menyalibkan
  rationale: Bentuk verba bahasa Indonesia tidak menandai kala seperti bahasa Yunani, sehingga “menyalibkan” secara alami mempertahankan daya hidup present historis Markus tanpa memaksakan penanda waktu tambahan.
- source_word: διαμερίζονται
  choice: membagi-bagi
  rationale: Bentuk ini menyampaikan pembagian pakaian menjadi bagian-bagian untuk para pelaku dan terdengar alami dalam bahasa Indonesia.
- source_word: ἱμάτια
  choice: pakaian
  rationale: “Pakaian” adalah istilah modern, konkret, dan bermartabat untuk barang-barang yang dikenakan, tanpa kesan terlalu arkais.
- source_word: βάλλοντες κλῆρον
  choice: sambil membuang undi
  rationale: “Membuang undi” merupakan ungkapan Indonesia yang lazim untuk menentukan pembagian melalui undian; “sambil” mencerminkan hubungan partisipial dengan tindakan membagi.
- source_word: ἐπ’ αὐτὰ
  choice: atas pakaian itu
  rationale: Terjemahan ini mempertahankan acuan eksplisit kepada pakaian sebagai hal yang ditentukan melalui undi.
- source_word: τίς τί ἄρῃ
  choice: untuk menentukan siapa mendapat apa
  rationale: Ungkapan ini mempertahankan pola distributif τίς τί dan menyampaikan hasil pembagian secara wajar dalam bahasa Indonesia; nuansa harfiah “mengambil” dicatat dalam catatan kaki.
theological_decisions:
- issue: Present historis dalam kisah penderitaan
  choice: Menggunakan bentuk tak berkala “menyalibkan” tanpa menambahkan penanda lampau.
  alternative: “telah menyalibkan” atau bentuk lampau yang dijelaskan secara eksplisit
  rationale: Bahasa Indonesia tidak mewajibkan penandaan kala pada verba. Bentuk sederhana mempertahankan kelangsungan dan daya hidup narasi Yunani tanpa menambahkan aspek selesai yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern standar dengan nada naratif yang khidmat namun mudah dipahami. Kapitalisasi “Dia” dan enklitik “-Nya” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia ketika merujuk kepada Yesus.
