  text: Καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα, Καὶ μετὰ ἀνόμων ἐλογίσθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/028.yaml
  text: And[a] the scripture was fulfilled that says, "And he was numbered with the transgressors."
translation:
  language: id
  text: Dan genaplah nas Kitab Suci yang berkata, “Ia terhitung di antara orang-orang durhaka.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini tidak terdapat dalam naskah-naskah Yunani tertua, termasuk Sinaiticus dan Vaticanus dari abad ke-4, maupun dalam terjemahan-terjemahan Koptik awal. Namun, ayat ini terdapat dalam mayoritas naskah tradisi Bizantin dan dalam tradisi Latin. Kemungkinan besar ayat ini ditambahkan oleh penyalin pada masa kemudian untuk menyelaraskannya dengan Lukas 22:37, yang mengutip Yesaya 53:12.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπληρώθη (πληρόω)
  choice: genaplah
  rationale: Dalam konteks nubuat Kitab Suci, bentuk pasif ini menyatakan bahwa apa yang tertulis menjadi kenyataan; ungkapan Indonesia yang alami dan lazim ialah “genaplah”.
- source_word: ἡ γραφή
  choice: nas Kitab Suci
  rationale: Frasa ini menunjuk pada bagian tertulis tertentu yang kemudian dikutip, sehingga “nas Kitab Suci” lebih tepat daripada sekadar “tulisan”.
- source_word: ἀνόμων (ἄνομος)
  choice: orang-orang durhaka
  rationale: Kata ini secara harfiah menunjuk kepada mereka yang tidak berhukum atau melanggar hukum. “Orang-orang durhaka” mempertahankan bobot moral dan teologis kutipan Yesaya tanpa membatasinya hanya pada kategori pidana.
- source_word: ἐλογίσθη (λογίζομαι)
  choice: terhitung
  rationale: Bentuk pasif ini berarti dianggap atau dimasukkan dalam hitungan suatu kelompok. “Terhitung di antara” menyampaikan pengelompokan tersebut secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan ayat dengan nubuat Yesaya 53:12
  choice: Mempertahankan bentuk pernyataan penggenapan dan kutipan tanpa menambahkan identifikasi penafsirannya.
  alternative: Menjelaskan secara eksplisit dalam teks bahwa Yesus menggenapi nubuat tentang Hamba TUHAN.
  rationale: Teks Yunani hanya menyatakan bahwa nas itu digenapi dan mengutipnya; penjelasan tambahan akan melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Genaplah nas Kitab Suci” mempertahankan nuansa formula penggenapan nubuat, sedangkan “terhitung di antara orang-orang durhaka” tetap jelas bagi pembaca umum serta dekat dengan struktur kutipan sumber.
