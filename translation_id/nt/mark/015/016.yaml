review_pass:
  verdict: revise
  source_fidelity: Draf secara umum mengikuti alur dan unsur-unsur utama teks Yunani. Namun, “istana” menambahkan spesifikasi yang tidak dinyatakan oleh αὐλή, dan “gedung pengadilan gubernur” terlalu sempit serta kurang tepat untuk πραιτώριον, yang menunjuk pada pretorium, yakni kompleks/markas atau kediaman resmi gubernur.
  naturalness: Kalimatnya alami dalam bahasa Indonesia modern. “Ke dalam halaman” lebih langsung dan tidak membebani αὐλή dengan arti “halaman dalam istana”. Istilah “pretorium” dapat dipertahankan sebagai istilah historis dan dijelaskan dalam catatan kaki.
  terminology: “Prajurit” dan “kohor” tepat. “Pretorium” lebih setia kepada istilah πραιτώριον daripada “gedung pengadilan gubernur”; penjelasan catatan kaki mempertahankan kemungkinan makna markas atau kediaman resmi tanpa menetapkan satu rekonstruksi historis secara berlebihan.
  issues:
  - severity: medium
    issue: “Halaman dalam istana” menerjemahkan ἔσω τῆς αὐλῆς secara terlalu spesifik.
    rationale: αὐλή dapat berarti halaman atau pelataran sebuah kompleks, tetapi teks tidak secara eksplisit menyebut “istana”. Unsur “dalam” juga sudah cukup diungkapkan oleh “ke dalam halaman”.
  - severity: high
    issue: “Gedung pengadilan gubernur” tidak memadai untuk πραιτώριον.
    rationale: πραιτώριον adalah istilah administratif-Romawi untuk pretorium, yang dapat merujuk pada markas atau kediaman resmi gubernur, bukan khusus sebuah gedung pengadilan. Terjemahan ini berisiko mengubah rujukan tempat.
  revised_text: Kemudian para prajurit membawa Yesus ke dalam halaman, yaitu pretorium[a], lalu mereka memanggil seluruh kohor untuk berkumpul.[b]
