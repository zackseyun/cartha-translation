revisions:
- from: Kemudian para prajurit membawa Yesus masuk ke halaman dalam istana, yaitu gedung pengadilan gubernur[a], lalu mereka memanggil seluruh kohor untuk berkumpul.[b]
  to: Kemudian para prajurit membawa Yesus ke dalam halaman, yaitu pretorium[a], lalu mereka memanggil seluruh kohor untuk berkumpul.[b]
  rationale: Revisi menghilangkan tambahan makna “istana” dan mengganti padanan πραιτώριον yang terlalu membatasi. Istilah historis “pretorium” dipertahankan dalam teks, dengan alternatif deskriptif yang ringkas dalam catatan kaki. Makna tindakan mengumpulkan seluruh kohor tetap dipertahankan.
