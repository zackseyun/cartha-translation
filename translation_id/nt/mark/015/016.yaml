  text: Then the soldiers led him inside the courtyard[a], which is the praetorium[b], and they call together the whole cohort.
translation:
  language: id
  text: Kemudian para prajurit membawa Yesus ke dalam halaman, yaitu pretorium[a], lalu mereka memanggil seluruh kohor untuk berkumpul.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “markas atau kediaman resmi gubernur.”
    reason: lexical_alternative
  - marker: b
    text: Kohor adalah satuan militer Romawi; di sini istilah itu merujuk pada pasukan yang dihimpun di bawah wewenang Romawi.
    reason: cultural_note
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Kemudian
  rationale: δέ menandai kelanjutan narasi, bukan pertentangan yang kuat; “Kemudian” alami dalam bahasa Indonesia.
- source_word: στρατιῶται
  choice: para prajurit
  rationale: Padanan langsung dan wajar bagi para anggota pasukan Romawi.
- source_word: ἀπήγαγον αὐτὸν
  choice: membawa Yesus
  rationale: ἀπάγω berarti membawa atau menggiring seseorang. Nama “Yesus” dipakai agar rujukan pronomina jelas dan alami dalam bahasa Indonesia.
- source_word: ἔσω τῆς αὐλῆς
  choice: masuk ke halaman dalam istana
  rationale: ἔσω menyatakan gerak ke bagian dalam, sedangkan αὐλή dalam konteks ini merujuk pada halaman kompleks kediaman atau markas resmi.
- source_word: ὅ ἐστιν πραιτώριον
  choice: yaitu gedung pengadilan gubernur
  rationale: πραιτώριον adalah istilah Romawi untuk kediaman atau markas resmi gubernur; padanan deskriptif ini lebih mudah dipahami pembaca Indonesia, sementara istilah historis dipertahankan dalam catatan kaki.
- source_word: συγκαλοῦσιν
  choice: memanggil ... untuk berkumpul
  rationale: Mencerminkan makna memanggil orang-orang bersama-sama. Bentuk kini historis Yunani dialihkan menjadi bentuk naratif Indonesia yang alami.
- source_word: ὅλην τὴν σπεῖραν
  choice: seluruh kohor
  rationale: σπεῖρα merupakan satuan militer Romawi. Istilah teknis “kohor” mempertahankan kekhususan historisnya dan dijelaskan dalam catatan kaki.
