  text: ἐγίνωσκεν γὰρ ὅτι διὰ φθόνον παραδεδώκεισαν αὐτὸν οἱ ἀρχιερεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/010.yaml
  text: For he knew that the chief priests had handed him over because of envy[a].
translation:
  language: id
  text: Sebab Pilatus tahu bahwa imam-imam kepala telah menyerahkan Yesus karena iri hati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena kecemburuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: tahu
  rationale: Bentuk imperfek menyatakan pengetahuan atau kesadaran Pilatus yang sudah berlangsung. Dalam bahasa Indonesia, “tahu” menyampaikan makna itu secara alami tanpa bentuk progresif yang kaku.
- source_word: γὰρ
  choice: Sebab
  rationale: Partikel ini memberikan alasan atau penjelasan bagi pernyataan sebelumnya. “Sebab” mempertahankan hubungan wacana tersebut dengan jelas.
- source_word: ὅτι
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang diketahui Pilatus; “bahwa” adalah padanan pelengkap yang langsung dan wajar.
- source_word: διὰ φθόνον
  choice: karena iri hati
  rationale: διά dengan akusatif menyatakan sebab atau alasan. φθόνος menunjuk pada iri hati atau kecemburuan; “iri hati” paling tepat untuk motif menginginkan atau membenci karena apa yang dimiliki atau diterima pihak lain.
- source_word: παραδεδώκεισαν
  choice: telah menyerahkan
  rationale: Bentuk pluperfek menunjukkan tindakan yang telah selesai sebelum pengetahuan yang disebutkan. “Telah menyerahkan” mempertahankan urutan waktunya dan sesuai dengan konteks penyerahan kepada penguasa hukum, tanpa mempersempit maknanya menjadi “mengkhianati”.
- source_word: αὐτὸν
  choice: Yesus
  rationale: Pronomina ini merujuk kepada Yesus. Nama diri digunakan dalam bahasa Indonesia untuk menghindari ketidakjelasan karena subjek dan objek sama-sama laki-laki.
- source_word: οἱ ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Ini adalah padanan baku bagi kelompok pemimpin keimaman dalam kisah sengsara, bukan sebutan bagi beberapa imam besar yang masing-masing memegang jabatan tunggal.
theological_decisions:
- issue: Motif imam-imam kepala ketika menyerahkan Yesus
  choice: Ayat ini menyatakan penilaian Pilatus bahwa mereka menyerahkan Yesus karena iri hati.
  alternative: karena kecemburuan
  rationale: Terjemahan menyampaikan motif yang dinyatakan teks tanpa menambahkan penjelasan teologis atau memperkuat tuduhan melampaui cakupan φθόνος.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama “Pilatus” dan “Yesus” dipakai untuk memperjelas rujukan kedua pronomina Yunani dalam konteks, sementara “imam-imam kepala” mempertahankan istilah kelembagaan yang lazim.
