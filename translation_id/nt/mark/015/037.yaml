id: MRK.15.37
reference: Mark 15:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἀφεὶς φωνὴν μεγάλην ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/037.yaml
  text: But Jesus[a], uttering a loud cry[b], breathed his last.
translation:
  language: id
  text: Tetapi Yesus mengeluarkan seruan keras[a], lalu mengembuskan napas terakhir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seruan nyaring” atau “suara keras.”
    reason: lexical_alternative
  - marker: b
    text: Atau “meninggal”; secara harfiah, “mengembuskan napas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Tetapi
  rationale: δέ merupakan kata penghubung ringan yang di sini menandai peralihan sekaligus kontras dalam alur penderitaan Yesus; “Tetapi” wajar dalam bahasa Indonesia dan tidak melebih-lebihkan pertentangannya.
- source_word: ἀφεὶς
  choice: mengeluarkan
  rationale: Partisip aoris dari ἀφίημι bersama φωνή secara idiomatis berarti mengeluarkan atau melontarkan suara. “Mengeluarkan” jelas dan alami dalam konstruksi “mengeluarkan seruan keras”.
- source_word: φωνὴν μεγάλην
  choice: seruan keras
  rationale: φωνή dapat berarti suara atau seruan, sedangkan μεγάλην di sini menunjuk pada kuatnya bunyi. Dalam konteks ini, “seruan keras” menyampaikan ledakan suara tanpa menentukan kata-kata yang diserukan.
- source_word: ἐξέπνευσεν
  choice: mengembuskan napas terakhir
  rationale: ἐκπνέω secara harfiah berkaitan dengan mengembuskan napas dan secara idiomatis berarti meninggal. Ungkapan ini mempertahankan citra napas serta kekhidmatan teks tanpa memasukkan gagasan “menyerahkan roh” dari rumusan Injil lain.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Tetapi Yesus
  rationale: Artikel Yunani sebelum nama diri tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia; subjek dan kata penghubung disampaikan secara alami sebagai “Tetapi Yesus”.
theological_decisions:
- issue: Menggambarkan kematian Yesus tanpa menambahkan nuansa teologis dari bagian lain
  choice: mengembuskan napas terakhir
  alternative: meninggal; menyerahkan roh-Nya
  rationale: Pilihan ini menyatakan kematian Yesus sambil mempertahankan citra ἐξέπνευσεν. “Menyerahkan roh-Nya” tidak dipakai karena lebih interpretatif dan dapat mengharmoniskan ayat ini dengan ungkapan Injil lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur dengan “lalu” memperjelas urutan tindakan yang tersirat oleh partisip aoris tanpa memperberat kalimat. Penanda catatan kaki ditempatkan tepat sesudah ungkapan yang dijelaskannya.
