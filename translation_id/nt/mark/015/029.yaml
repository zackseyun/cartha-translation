  text: Καὶ οἱ παραπορευόμενοι ἐβλασφήμουν αὐτὸν κινοῦντες τὰς κεφαλὰς αὐτῶν καὶ λέγοντες· Οὐὰ ὁ καταλύων τὸν ναὸν καὶ ⸂οἰκοδομῶν ἐν τρισὶν ἡμέραις⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/029.yaml
  text: And those passing by were reviling him[a], shaking their heads and saying[b], “Aha! You who would tear down the temple and build it in three days,”
translation:
  language: id
  text: Orang-orang yang sedang lewat terus menghina Dia sambil menggeleng-gelengkan kepala dan berkata, “Huh! Engkau yang mau merobohkan Bait Allah[a] dan membangunnya dalam tiga hari[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau lebih khusus, “tempat suci.”
    reason: lexical_alternative
  - marker: b
    text: Atau “membangunnya kembali dalam tiga hari.” Kata kerja Yunani secara harfiah berarti “membangun”, meskipun konteksnya dapat menyiratkan pembangunan kembali.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: orang-orang yang lewat
  rationale: Mengungkapkan partisipel yang menunjuk kepada orang-orang yang sedang melewati tempat itu dengan bahasa Indonesia yang alami.
- source_word: ἐβλασφήμουν
  choice: menghina
  rationale: Dalam konteks ini verba tersebut menggambarkan ucapan kasar dan merendahkan yang ditujukan kepada Yesus; 'menghina' tidak mempersempit maknanya menjadi istilah teknis keagamaan.
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: sambil menggeleng-gelengkan kepala
  rationale: Ungkapan ini menyatakan gerak kepala sebagai tanda cemoohan; bentuk ulang memberi kesan tindakan yang berlangsung.
- source_word: Οὐὰ
  choice: Huh!
  rationale: Seruan ini menyampaikan nada mengejek dalam bahasa Indonesia masa kini tanpa terdengar sebagai ratapan.
- source_word: ὁ καταλύων
  choice: Engkau yang mau merobohkan
  rationale: Partisipel berartikel berfungsi seperti sapaan langsung. 'Mau merobohkan' mempertahankan bentuk tuduhan atau klaim yang sedang mereka ejek.
- source_word: ναὸν
  choice: Bait Allah
  rationale: Padanan umum dan mudah dipahami untuk bangunan Bait Allah; nuansa bahwa kata Yunani dapat menunjuk lebih khusus pada tempat suci dipertahankan dalam catatan kaki.
- source_word: οἰκοδομῶν ἐν τρισὶν ἡμέραις
  choice: membangunnya dalam tiga hari
  rationale: Menerjemahkan verba Yunani secara langsung sebagai 'membangun'; konteks dapat menyiratkan pembangunan kembali, yang dicatat sebagai alternatif.
theological_decisions:
- issue: Rujukan perkataan tentang Bait Allah
  choice: Menyajikan ucapan para pengejek sebagai tuduhan atau alusi sebagaimana tampil dalam narasi Markus.
  alternative: Menjelaskan dalam teks utama bahwa Bait Allah merupakan metafora bagi tubuh Yesus.
  rationale: Ayat ini menyampaikan ejekan orang-orang yang lewat. Terjemahan tidak memasukkan penafsiran dari konteks Injil lain dan membiarkan ketegangan teologis tetap terbuka.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang lugas dan bermartabat. Seruan 'Huh!' dipilih untuk menyampaikan ejekan, sedangkan 'menggeleng-gelengkan kepala' memakai idiom Indonesia yang alami.
