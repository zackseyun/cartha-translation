  text: And the curtain of the temple was torn in two[b][a], from top to bottom.
translation:
  language: id
  text: Dan tirai Bait Allah[a] terbelah menjadi dua, dari atas sampai ke bawah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “Bait Allah” dapat merujuk secara khusus pada tempat atau ruang kudus, bukan seluruh kompleks Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Dalam alur narasi, καί menghubungkan peristiwa ini dengan kejadian sebelumnya. "Lalu" terdengar alami dalam bahasa Indonesia tanpa menambahkan penjelasan teologis.
- source_word: καταπέτασμα
  choice: tirai
  rationale: Menunjuk pada kain gantung atau tirai di dalam Bait Allah. "Tirai" merupakan padanan modern, konkret, dan mudah dipahami.
- source_word: ναοῦ
  choice: ruang kudus di Bait Allah
  rationale: ναός lebih khusus menunjuk bangunan atau ruang kudus Bait Allah, bukan seluruh kompleksnya. Ungkapan ini mempertahankan kekhususan tersebut sekaligus tetap jelas bagi pembaca umum.
- source_word: ἐσχίσθη
  choice: terbelah
  rationale: Bentuk pasif aoris menyatakan bahwa tirai itu mengalami pembelahan atau perobekan. "Terbelah" menyampaikan hasil tindakannya secara ringkas tanpa menyebut pelaku yang tidak dinyatakan.
- source_word: εἰς δύο
  choice: dua
  rationale: Bersama "terbelah", ungkapan ini secara alami berarti terbagi menjadi dua bagian.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: dari atas sampai ke bawah
  rationale: Padanan Indonesia yang alami dan tepat untuk arah serta jangkauan pembelahan.
theological_decisions:
- issue: Makna teologis terbelahnya tirai ruang kudus
  choice: Peristiwa diterjemahkan secara deskriptif tanpa menjelaskan simbolismenya dalam teks utama.
  alternative: Menafsirkannya sebagai terbukanya jalan kepada Allah atau sebagai penghakiman atas tata ibadah Bait Allah.
  rationale: Ayat ini melaporkan peristiwa tersebut, tetapi tidak secara eksplisit menerangkan makna teologisnya. Terjemahan mempertahankan ketegangan penafsiran itu.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan kalimat mengikuti alur naratif secara alami. Istilah "ruang kudus di Bait Allah" dipakai untuk membedakan ναός dari keseluruhan kompleks Bait Allah tanpa memasukkan tafsiran mengenai tirai mana yang dimaksud.
