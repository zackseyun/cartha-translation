  source_fidelity: Draf menangkap peristiwa, bentuk pasif, pembagian menjadi dua, dan arah perobekan dengan baik. Namun, “ruang kudus di Bait Allah” terlalu mempersempit dan membuat hubungan genitif ναοῦ kurang langsung; ναός dapat merujuk pada bangunan/tempat suci Bait Allah, tetapi ayat ini sendiri tidak perlu menetapkan “ruang kudus” sebagai lokasi tirai. “Lalu” juga memberi nuansa urutan temporal yang lebih kuat daripada καί sederhana.
  naturalness: “Tirai ruang kudus di Bait Allah” terdengar berat dan kurang alami dalam bahasa Indonesia modern. “Tirai Bait Allah” ringkas, idiomatis, dan tetap memungkinkan nuansa lebih khusus dijelaskan dalam catatan kaki. “Terbelah menjadi dua” secara jelas menyatakan εἰς δύο.
  terminology: “Tirai” adalah padanan yang baik untuk καταπέτασμα. “Bait Allah” adalah istilah yang lazim dan tepat untuk ναός dalam konteks ini; catatan kaki dapat menjaga kemungkinan makna “tempat/ruang kudus” tanpa mengubah teks utama atau menentukan tirai tertentu.
