  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀ἐνδιδύσκουσιν αὐτὸν πορφύραν καὶ περιτιθέασιν αὐτῷ πλέξαντες ἀκάνθινον στέφανον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/017.yaml
  text: And they dress him in purple[a], and after weaving a crown of thorns, they place it on him.
translation:
  language: id
  text: Mereka memakaikan kain ungu[a] kepada-Nya. Sesudah menganyam sebuah mahkota duri, mereka memasangnya pada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pakaian ungu”; kata Yunani di ayat ini tidak secara khusus menyebut “jubah”, meskipun konteksnya menunjukkan suatu pakaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδιδύσκουσιν
  choice: memakaikan ... kepada-Nya
  rationale: Bentuk kausatif ini menyatakan bahwa mereka mengenakan sesuatu sebagai pakaian kepada Yesus; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan tindakan para prajurit.
- source_word: πορφύραν
  choice: kain ungu
  rationale: Kata ini dapat menunjuk pada kain ungu atau pakaian ungu. 'Kain ungu' tidak menambahkan jenis pakaian tertentu seperti 'jubah', tetapi tetap jelas sebagai sesuatu yang dipakaikan.
- source_word: περιτιθέασιν
  choice: memasangnya pada-Nya
  rationale: Kata kerja ini berarti menaruh atau memasang di sekeliling/di atas seseorang. Pronomina '-nya' merujuk pada mahkota yang baru disebutkan.
- source_word: πλέξαντες
  choice: sesudah menganyam
  rationale: Partisip aoris menunjukkan tindakan yang mendahului tindakan memasang; 'sesudah' menyatakan urutan itu dengan jelas.
- source_word: ἀκάνθινον
  choice: duri
  rationale: Adjektiva ini menyatakan bahwa mahkota tersebut terbuat dari duri; konstruksi 'mahkota duri' merupakan ungkapan Indonesia yang wajar.
- source_word: στέφανον
  choice: mahkota
  rationale: Dalam konteks olok-olok kerajaan, 'mahkota' menyampaikan ironi naratif dengan tepat, lebih baik daripada 'karangan'.
theological_decisions:
- issue: Citra kerajaan yang diparodikan dalam penghinaan terhadap Yesus
  choice: Menggunakan 'mahkota' untuk στέφανον.
  alternative: '''karangan'' atau ''untaian'''
  rationale: Kain ungu dan mahkota duri bersama-sama menggambarkan ejekan terhadap status raja. 'Mahkota' mempertahankan bobot naratif itu tanpa menambahkan tafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina untuk Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Kalimat dibagi dua agar urutan tindakan jelas dan alami.
