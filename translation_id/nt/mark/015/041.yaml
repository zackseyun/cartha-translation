id: MRK.15.41
reference: Mark 15:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀αἳ ὅτε ἦν ἐν τῇ Γαλιλαίᾳ ἠκολούθουν αὐτῷ καὶ διηκόνουν αὐτῷ, καὶ ἄλλαι πολλαὶ αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/041.yaml
  text: These women[a], when he was in Galilee, used to follow him and minister to him[b]; and there were many other women who had gone up with him to Jerusalem.
translation:
  language: id
  text: Perempuan-perempuan ini, ketika Dia berada di Galilea, biasa mengikuti-Nya dan melayani-Nya[a]. Ada juga banyak perempuan lain yang telah ikut naik bersama-Nya ke Yerusalem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “melayani” dapat menunjuk pada pelayanan praktis atau pemberian dukungan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “naik bersama-Nya ke Yerusalem.” Ungkapan “naik” mencerminkan cara bicara yang lazim dalam Alkitab tentang perjalanan menuju Yerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: αἳ
  choice: Perempuan-perempuan ini
  rationale: Kata ganti relatif feminin jamak ini menunjuk kembali kepada para perempuan yang disebut dalam ayat sebelumnya. Bentuk ini membuat kalimat Indonesia berdiri secara alami sambil mempertahankan rujukan tersebut.
- source_word: ὅτε ἦν ἐν τῇ Γαλιλαίᾳ
  choice: ketika Dia berada di Galilea
  rationale: Menerjemahkan anak kalimat waktu dan frasa tempat secara langsung. Huruf kapital pada kata ganti mengikuti kebiasaan penulisan Alkitab bahasa Indonesia untuk rujukan kepada Yesus.
- source_word: ἠκολούθουν
  choice: biasa mengikuti-Nya
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung secara kebiasaan pada masa pelayanan Yesus di Galilea, bukan hanya satu tindakan mengikuti.
- source_word: διηκόνουν
  choice: melayani-Nya
  rationale: διακονέω mencakup pelayanan praktis dan pemberian dukungan. 'Melayani' mempertahankan keluasan makna tanpa membatasinya pada pekerjaan rumah tangga atau menjadikannya jabatan gerejawi.
- source_word: ἄλλαι πολλαὶ
  choice: banyak perempuan lain
  rationale: Konteks feminin jamak memungkinkan nomina 'perempuan' dinyatakan agar jelas dan alami dalam bahasa Indonesia.
- source_word: αἱ συναναβᾶσαι αὐτῷ
  choice: yang telah ikut naik bersama-Nya
  rationale: Partisip aoris menyatakan tindakan yang mendahului keadaan yang sedang diceritakan. 'Naik' mempertahankan ungkapan alkitabiah dan geografis tentang perjalanan menuju Yerusalem.
- source_word: εἰς Ἱεροσόλυμα
  choice: ke Yerusalem
  rationale: Ini merupakan padanan Indonesia yang wajar bagi εἰς yang menyatakan tujuan perjalanan menuju sebuah kota.
theological_decisions:
- issue: Sifat pelayanan para perempuan dalam kata διηκόνουν
  choice: melayani-Nya
  alternative: membantu memenuhi kebutuhan-Nya
  rationale: '''Melayani'' mempertahankan martabat dan keluasan tindakan para perempuan sebagai pendukung aktif pelayanan Yesus. Pilihan ini tidak menyempitkan tindakan itu menjadi pelayanan domestik saja dan tidak pula mengimpor gagasan tentang jabatan gerejawi tertentu.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'biasa mengikuti' menyampaikan aspek kebiasaan dari bentuk imperfek, sedangkan 'ikut naik' mempertahankan idiom sumber tanpa terdengar kaku.
