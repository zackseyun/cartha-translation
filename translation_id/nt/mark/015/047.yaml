  naturalness: '"Maria Magdalena dan Maria, ibu Yoses" alami dan jelas. Untuk ἐθεώρουν, "terus mengamati tempat Ia telah dibaringkan" lebih lancar dalam bahasa Indonesia modern serta lebih jelas menyatakan aspek imperfek dan hasil tindakan penguburan yang telah selesai.'
  terminology: '"Maria Magdalena," "Yoses," dan "Ia" dapat dipertahankan. Catatan kaki perlu memperbaiki "mengenali" menjadi "mengidentifikasi" atau "membedakan," karena teks Yunani tidak sekadar "mengenali" Maria tersebut, melainkan mengidentifikasinya melalui hubungannya dengan Yoses.'
