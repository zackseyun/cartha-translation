base_translation:
  language: en
  yaml_path: translation/nt/mark/015/047.yaml
  text: And Mary Magdalene and Mary the mother of Joses were watching where he was laid[a].
translation:
  language: id
  text: Maria Magdalena dan Maria, ibu Yoses, terus mengamati tempat Ia telah dibaringkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Maria dari Yoses.” Teks Yunani mengidentifikasi Maria ini berdasarkan hubungannya dengan Yoses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: dan
  rationale: Partikel ini merupakan penghubung ringan yang melanjutkan kisah penguburan, bukan pertentangan kuat.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Maria Magdalena
  rationale: Bentuk nama dan sebutan yang baku dalam bahasa Indonesia; sebutan itu membedakan Maria ini dari Maria yang lain.
- source_word: Μαρία ἡ Ἰωσῆτος
  choice: Maria, ibu Yoses
  rationale: Genitif Yunani secara harfiah hanya menyatakan hubungan dengan Yoses, tetapi dalam konteks Markus hubungan yang paling wajar ialah ibu dan anak; catatan kaki mempertahankan bentuk harfiahnya.
- source_word: ἐθεώρουν
  choice: memperhatikan
  rationale: Imperfek menunjukkan tindakan yang berlangsung; kata ini menyampaikan pengamatan yang disengaja tanpa ungkapan progresif yang kaku dalam bahasa Indonesia.
- source_word: ποῦ
  choice: di mana
  rationale: Menerjemahkan keterangan tempat secara langsung dan alami.
- source_word: τέθειται
  choice: Ia dibaringkan
  rationale: Perfek pasif menyatakan tindakan yang sudah dilakukan dengan keadaan hasil yang masih berlaku. Dalam narasi Indonesia, bentuk pasif ini alami; subjek tersirat dijelaskan sebagai Yesus dengan pronomina hormat 'Ia'.
theological_decisions:
- issue: Subjek tersirat pada verba pasif
  choice: Menyatakan subjek sebagai “Ia”, yang merujuk kepada Yesus
  alternative: Menggunakan “jenazah-Nya” atau membiarkan subjek tidak dinyatakan
  rationale: Bahasa Yunani membiarkan referennya tersirat karena jelas dari konteks. Bahasa Indonesia memerlukan subjek agar klausa ini alami; “Ia” mempertahankan rujukan kepada pribadi Yesus dan tidak mereduksi-Nya menjadi sekadar jenazah.
- issue: Hubungan Maria dengan Yoses
  choice: Menjelaskan hubungan sebagai ibu Yoses dalam teks utama
  alternative: Menerjemahkan secara harfiah “Maria dari Yoses”
  rationale: Konstruksi genitif itu sendiri tidak menyebut kata “ibu”, tetapi konteks Markus mendukung hubungan ibu-anak. Catatan kaki menjaga transparansi atas bentuk Yunani dan ambiguitas formalnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Memperhatikan” dipilih untuk menyampaikan pengamatan yang berlangsung, sedangkan “dibaringkan” cocok dengan konteks pemakaman. Pronomina “Ia” mengikuti kebiasaan penulisan hormat untuk Yesus.
