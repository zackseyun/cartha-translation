    rationale: ἐθεώρουν berarti mereka terus mengamati/menyaksikan. Dalam bahasa Indonesia, objek tempat membuat relasi dengan ποῦ lebih idiomatis.
  - severity: low
    issue: Kata "mengenali" dalam catatan kaki tidak tepat untuk fungsi identifikasi genitif Yunani.
    rationale: Frasa Yunani membedakan atau mengidentifikasi Maria ini berdasarkan relasinya dengan Yoses; "mengidentifikasi" menyatakan fungsi tersebut dengan tepat.
