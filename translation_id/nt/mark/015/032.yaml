  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ χριστὸς ὁ ⸀βασιλεὺς Ἰσραὴλ καταβάτω νῦν ἀπὸ τοῦ σταυροῦ, ἵνα ἴδωμεν καὶ ⸀πιστεύσωμεν. καὶ οἱ συνεσταυρωμένοι ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/032.yaml
  text: Let the Messiah[a], the King of Israel, come down now from the cross[b], so that we may see and believe.” And those who were crucified with him were also insulting him.
translation:
  language: id
  text: Biarlah Mesias[a], Raja Israel, turun sekarang dari salib, supaya kami melihat dan percaya.” Orang-orang yang disalibkan bersama dia pun menghina dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Gelar Yunani Χριστός berarti sosok yang diurapi; “Mesias” dipakai di sini karena konteksnya menonjolkan kedudukan raja yang dijanjikan.
    reason: alternative_reading
  - marker: b
    text: Atau “mencela dia” atau “mencerca dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Istilah ini berfungsi sebagai gelar bagi sosok yang diurapi dan dijanjikan, khususnya dalam ejekan bernuansa kerajaan; “Mesias” mempertahankan makna gelar tersebut lebih jelas daripada transliterasi “Kristus”.
- source_word: ὁ βασιλεὺς Ἰσραήλ
  choice: Raja Israel
  rationale: Menerjemahkan gelar dan hubungan genitif secara langsung serta mempertahankan gema ejekan terhadap klaim kerajaan Yesus.
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: turun sekarang dari salib
  rationale: Bentuk imperatif orang ketiga menyampaikan tuntutan yang mengejek; “turun” alami dalam bahasa Indonesia, sedangkan “sekarang” mempertahankan desakan νῦν.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμεν
  choice: supaya kami melihat dan percaya
  rationale: Mempertahankan hubungan tujuan/hasil yang dinyatakan oleh ἵνα dan dua verba sejajar tanpa menambahkan gagasan kemampuan atau objek iman yang tidak tersurat.
- source_word: οἱ συνεσταυρωμένοι σὺν αὐτῷ
  choice: orang-orang yang disalibkan bersama dia
  rationale: Mengungkapkan partisipel pasif secara jelas dan alami tanpa menambahkan rincian yang tidak dinyatakan dalam frasa Yunani.
- source_word: ὠνείδιζον αὐτόν
  choice: pun menghina dia
  rationale: “Menghina” mudah dipahami dan sesuai dengan ejekan verbal dalam konteks; partikel “pun” mewakili καί, sementara konteks naratif mendukung nuansa tindakan yang sedang berlangsung.
theological_decisions:
- issue: Penerjemahan Χριστός dalam konteks ejekan mesianik-kerajaan
  choice: Mesias
  alternative: Kristus
  rationale: Di sini Χριστός jelas berfungsi sebagai gelar yang langsung disandingkan dengan “Raja Israel”; “Mesias” mempertahankan makna sosok yang diurapi tanpa menjadikannya sekadar nama diri.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas dan bernada khidmat. Huruf kecil pada pronomina “dia” mengikuti bentuk sumber yang tidak menandai penghormatan secara tipografis. Tanda kutip penutup dipertahankan karena ucapan ini berlanjut dari ayat sebelumnya.
