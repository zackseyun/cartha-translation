  text: Ἦσαν δὲ καὶ γυναῖκες ἀπὸ μακρόθεν θεωροῦσαι, ἐν ⸀αἷς καὶ ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸀ἡ Ἰακώβου τοῦ μικροῦ καὶ ⸀Ἰωσῆτος μήτηρ καὶ Σαλώμη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/040.yaml
  text: There were also women watching from a distance[a], among whom were Mary Magdalene, Mary the mother of James the younger and of Joses, and Salome[c][b],
translation:
  language: id
  text: Ada juga perempuan yang mengamati dari kejauhan.[a] Di antara mereka ada Maria Magdalena, Maria, ibu Yakobus yang muda dan Yoses,[b] serta Salome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari jauh.”
    reason: lexical_alternative
  - marker: b
    text: Istilah Yunani yang diterjemahkan “yang muda” juga dapat berarti “yang kecil”; makna tepat julukan ini tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ καὶ
  choice: Ada juga
  rationale: Menyampaikan bentuk imperfek εἰμί serta daya tambah δέ dan καί secara alami dalam narasi bahasa Indonesia tanpa memberi tekanan berlebihan pada δέ.
- source_word: γυναῖκες
  choice: beberapa perempuan
  rationale: Kata benda jamak ini merujuk kepada sekelompok perempuan. Kata “beberapa” membuat konstruksi eksistensial Indonesia terasa alami tanpa menentukan jumlah.
- source_word: ἀπὸ μακρόθεν
  choice: dari kejauhan
  rationale: Ungkapan Indonesia yang wajar dan tepat untuk posisi para perempuan yang jauh dari tempat kejadian.
- source_word: θεωροῦσαι
  choice: yang mengamati
  rationale: Partisipel kini menunjukkan perhatian visual yang berlangsung; “mengamati” lebih kuat daripada sekadar “melihat” dan tetap alami.
- source_word: ἐν αἷς καὶ
  choice: Di antara mereka ada
  rationale: Menunjukkan bahwa nama-nama berikut merupakan bagian dari kelompok perempuan yang lebih besar.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Maria Magdalena
  rationale: Bentuk nama yang sudah lazim dalam bahasa Indonesia dan mempertahankan sebutan asalnya.
- source_word: Μαρία ἡ Ἰακώβου τοῦ μικροῦ καὶ Ἰωσῆτος μήτηρ
  choice: Maria ibu Yakobus yang Muda dan Yoses
  rationale: μήτηρ mencakup kedua bentuk genitif sehingga Maria dinyatakan sebagai ibu Yakobus dan Yoses. “Yang Muda” berfungsi sebagai sebutan pembeda, sementara catatan kaki mempertahankan keluasan makna μικρός.
- source_word: Ἰακώβου
  choice: Yakobus
  rationale: Bentuk nama Perjanjian Baru yang lazim dalam bahasa Indonesia untuk Ἰάκωβος.
- source_word: τοῦ μικροῦ
  choice: yang Muda
  rationale: Pilihan ini jelas sebagai julukan pembeda dalam bahasa Indonesia, tetapi makna tepat μικρός—usia, ukuran tubuh, atau kedudukan—tidak pasti dan karena itu dijelaskan dalam catatan kaki.
- source_word: Ἰωσῆτος
  choice: Yoses
  rationale: Mentransliterasikan bentuk nama Yunani Ἰωσῆς dan tidak menyamakannya dengan bentuk Ἰωσήφ, yang lazim diterjemahkan “Yusuf”.
- source_word: Σαλώμη
  choice: Salome
  rationale: Transliterasi baku nama pribadi tersebut dalam bahasa Indonesia.
theological_decisions:
- issue: Makna julukan τοῦ μικροῦ bagi Yakobus
  choice: “Yakobus yang Muda,” dengan catatan yang menyatakan kemungkinan makna lain
  alternative: “Yakobus yang Kecil” atau “Yakobus yang Kurang Penting”
  rationale: Teks memakai μικρός sebagai pembeda tetapi tidak menjelaskan apakah yang dimaksud ialah usia, tubuh, atau kedudukan. Terjemahan utama harus mudah dipahami, sedangkan catatan menjaga ambiguitas sumber dan menghindari penetapan identitas atau status yang tidak dinyatakan.
- issue: Bentuk nama Ἰωσῆτος
  choice: Yoses
  alternative: Yusuf
  rationale: Mempertahankan bentuk nama yang berbeda dalam teks Yunani dan menghindari harmonisasi dengan nama Ἰωσήφ.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan kalimat dibagi menjadi dua agar alami, tanpa mengubah hubungan antarklausa. Nama-nama mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia, sementara Yoses dipertahankan sebagai bentuk tersendiri.
