  to: Sesudah mereka mengolok-olok dia, mereka melepaskan jubah ungu[a] itu darinya lalu memakaikan kembali pakaian miliknya sendiri kepadanya. Kemudian mereka membawa dia ke luar untuk menyalibkan dia.[b]
