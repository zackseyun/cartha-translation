  text: And when they had mocked him, they stripped the purple robe off him and put his own clothes on him. And they lead him out to crucify him.
translation:
  language: id
  text: Sesudah mereka mengolok-olok dia, mereka melepaskan jubah ungu[a] itu darinya lalu memakaikan kembali pakaian miliknya sendiri kepadanya. Kemudian mereka membawa dia ke luar untuk menyalibkan dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “yang ungu”; jenis pakaiannya dipahami dari konteks. Dapat juga diterjemahkan “pakaian ungu” atau “mantel ungu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “supaya mereka menyalibkan dia.” Bahasa Yunani memakai klausa yang menyatakan tujuan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: mengolok-olok
  rationale: Kata kerja ini menyatakan perlakuan yang menghina melalui ejekan. Pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan nada penghinaan dalam adegan tersebut.
- source_word: ἐξέδυσαν αὐτὸν τὴν πορφύραν
  choice: menanggalkan jubah ungu itu dari tubuhnya
  rationale: ἐκδύω berarti menanggalkan pakaian dari seseorang. Ungkapan 'dari tubuhnya' memperjelas objek ganda Yunani secara idiomatis tanpa menambah unsur naratif.
- source_word: τὴν πορφύραν
  choice: jubah ungu
  rationale: Secara harfiah ungkapan Yunani hanya menyebut 'yang ungu' dengan jenis pakaian dipahami dari konteks. 'Jubah ungu' jelas dan wajar serta sesuai dengan pakaian olok-olok kerajaan dalam konteks dekat.
- source_word: ἐνέδυσαν αὐτὸν
  choice: mengenakan kembali ... kepadanya
  rationale: Kata kerja ini berarti memakaikan atau mengenakan pakaian kepada seseorang. 'Kembali' tersirat oleh pemulihan pakaian miliknya sesudah jubah ungu dilepaskan dan membuat urutan tindakan alami dalam bahasa Indonesia.
- source_word: τὰ ἱμάτια τὰ ἴδια
  choice: pakaiannya sendiri
  rationale: ἱμάτια merujuk pada pakaian secara umum, sedangkan τὰ ἴδια menegaskan bahwa pakaian itu miliknya sendiri.
- source_word: ἐξάγουσιν
  choice: membawa dia ke luar
  rationale: Bentuk kini Yunani berfungsi sebagai kala kini historis yang menghidupkan narasi. Bahasa Indonesia tidak menandai kala pada verba, sehingga 'membawa' secara alami mempertahankan kelangsungan tindakan tanpa memaksakan penandaan waktu.
- source_word: ἵνα σταυρώσωσιν αὐτόν
  choice: untuk menyalibkan dia
  rationale: ἵνα dengan bentuk subjungtif menyatakan tujuan. Konstruksi 'untuk' menyampaikan tujuan itu dengan ringkas dan alami.
theological_decisions:
- issue: Penggambaran penghinaan Yesus sebelum penyaliban
  choice: Menerjemahkan tindakan secara langsung sebagai ejekan, pelepasan pakaian ungu olok-olok, pemakaian kembali pakaiannya sendiri, dan pembawaan ke luar untuk disalibkan.
  alternative: Menambahkan penjelasan bahwa jubah itu merupakan lambang kerajaan palsu atau bahwa tindakan tersebut menggenapi nubuat tertentu.
  rationale: Ayat ini menyampaikan rangkaian tindakan secara naratif tanpa menjelaskan makna teologisnya secara eksplisit. Terjemahan mempertahankan penghinaan yang nyata dalam tindakan itu tanpa memasukkan tafsiran tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat, dengan susunan kalimat yang mudah dipahami. Kata ganti untuk Yesus ditulis dengan huruf kecil agar tidak menambahkan pembedaan ortografis yang tidak terdapat dalam teks Yunani. Pengulangan 'dia' pada akhir ayat dipertahankan demi kejernihan rujukan dan kedekatan dengan penekanan objek dalam sumber.
