  text: καὶ ἀγοράσας ⸀σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ⸀ἔθηκεν αὐτὸν ἐν ⸀μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/046.yaml
  text: And after buying a linen cloth[a], he took him down, wrapped him in the linen cloth, and laid him in a tomb that had been cut out of rock[c][b]. Then he rolled a stone against the entrance of the tomb.
translation:
  language: id
  text: Setelah membeli sehelai kain linen[a], Yusuf menurunkan jenazah Yesus, membungkusnya dengan kain itu, lalu membaringkannya di dalam sebuah makam yang telah dipahat dari batu[b]. Kemudian ia menggulingkan sebuah batu ke depan pintu masuk makam itu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sehelai kain lenan” atau “kain kafan dari linen.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “yang telah dipahat dari batu.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “ke depan pintu makam itu.” Kata Yunani yang digunakan dapat berarti “pintu” atau “pintu masuk.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σινδόνα / σινδόνι
  choice: sehelai kain linen / kain itu
  rationale: σινδών menunjuk pada kain dari linen yang dalam konteks ini dipakai sebagai pembungkus jenazah. 'Kain linen' mempertahankan bahan tanpa mempersempit makna menjadi kain kafan tertentu; penyebutan kedua dibuat alami sebagai 'kain itu'.
- source_word: καθελών αὐτόν
  choice: menurunkan jenazah Yesus
  rationale: καθαιρέω di sini berarti menurunkan tubuh Yesus dari salib. Penyebutan 'jenazah Yesus' memperjelas acuan pronomina secara alami dalam bahasa Indonesia dan sesuai dengan konteks sesudah kematian-Nya.
- source_word: ἐνείλησεν
  choice: membungkusnya
  rationale: Kata kerja ini berarti membungkus atau menyelubungi. 'Membungkusnya' merupakan padanan Indonesia yang alami tanpa menambahkan rincian tata cara pemakaman.
- source_word: ἔθηκεν αὐτόν
  choice: membaringkannya
  rationale: τίθημι berarti menaruh atau menempatkan. Dalam konteks jenazah yang diletakkan di makam, 'membaringkannya' terdengar alami dan bermartabat, meskipun posisi tubuh tersirat oleh konteks.
- source_word: μνημείῳ / μνημείου
  choice: makam / makam itu
  rationale: μνημεῖον di sini adalah tempat penguburan berbentuk ruang yang dipahat pada batu. 'Makam' merupakan istilah Indonesia yang umum dan tidak menyiratkan sekadar lubang kubur.
- source_word: λελατομημένον ἐκ πέτρας
  choice: yang telah dipahat pada bukit batu
  rationale: Bentuk perfektif pasif menyatakan keadaan yang sudah selesai. 'Dipahat pada bukit batu' menggambarkan makam berupa ruang yang dibuat pada massa batu, bukan bangunan yang dibuat dari batu-batu lepas.
- source_word: προσεκύλισεν
  choice: menggulingkan
  rationale: Kata kerja ini menyatakan gerakan menggulirkan sesuatu menuju atau ke suatu tempat. 'Menggulingkan' sesuai untuk batu penutup makam, sementara arah geraknya dinyatakan oleh frasa berikutnya.
- source_word: ἐπὶ τὴν θύραν τοῦ μνημείου
  choice: ke depan pintu masuk makam itu
  rationale: θύρα dapat berarti pintu atau jalan masuk. 'Pintu masuk' alami bagi bukaan makam, dan 'ke depan' menyampaikan bahwa batu digulingkan hingga menutup atau menghadang bukaan tanpa membayangkan daun pintu berengsel.
- source_word: ἀγοράσας
  choice: setelah membeli
  rationale: Partisip aoris menyatakan tindakan yang mendahului rangkaian tindakan utama. 'Setelah membeli' mempertahankan urutan itu dengan jelas.
theological_decisions:
- issue: Acuan αὐτόν sesudah kematian Yesus
  choice: jenazah Yesus
  alternative: Dia / tubuh-Nya
  rationale: Bahasa Yunani hanya memakai pronomina maskulin, tetapi konteksnya adalah tubuh Yesus setelah kematian. 'Jenazah Yesus' memperjelas acuan tanpa membuat klaim teologis tambahan; penggunaan berikutnya kembali memakai pronomina.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Nama 'Yusuf' dan 'Yesus' dipakai untuk menjernihkan subjek serta objek yang dalam teks Yunani dinyatakan dengan bentuk verbal dan pronomina. Istilah 'linen' dipertahankan karena sudah dikenal dalam bahasa Indonesia modern, dengan alternatif 'lenan' dalam catatan kaki.
