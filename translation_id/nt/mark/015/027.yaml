  text: καὶ σὺν αὐτῷ σταυροῦσιν δύο λῃστάς, ἕνα ἐκ δεξιῶν καὶ ἕνα ἐξ εὐωνύμων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/027.yaml
  text: And with him they crucify two robbers[a], one at his right and one at his left.
translation:
  language: id
  text: Bersama dengan Dia, mereka menyalibkan dua orang perampok[a], seorang di sebelah kanan-Nya dan seorang lagi di sebelah kiri-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penyamun”; mungkin “pemberontak” jika istilah ini dipahami memiliki nuansa politik.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν αὐτῷ
  choice: bersama dengan Dia
  rationale: σύν dengan datif menyatakan penyertaan. Ungkapan ini alami dalam bahasa Indonesia dan tetap menonjolkan bahwa kedua orang itu disalibkan bersama Yesus.
- source_word: σταυροῦσιν
  choice: mereka menyalibkan
  rationale: Bentuk kini indikatif aktif orang ketiga jamak merupakan kala kini historis yang khas dalam narasi Markus. Bentuk kini bahasa Indonesia mempertahankan daya hidup narasinya tanpa terdengar janggal.
- source_word: δύο λῃστάς
  choice: dua orang perampok
  rationale: λῃστής dapat berarti perampok atau penyamun, dan kadang memiliki nuansa bandit atau pemberontak. 'Perampok' adalah pilihan umum dan mudah dipahami tanpa menetapkan nuansa politik yang tidak dinyatakan secara eksplisit.
- source_word: ἕνα ἐκ δεξιῶν
  choice: seorang di sebelah kanan-Nya
  rationale: Dalam konteks posisi, ungkapan ini menunjukkan sisi kanan. Akhiran '-Nya' menyatakan bahwa posisi tersebut relatif terhadap Yesus.
- source_word: ἕνα ἐξ εὐωνύμων αὐτοῦ
  choice: seorang lagi di sebelah kiri-Nya
  rationale: εὐώνυμος digunakan untuk sisi kiri, sebagai pasangan bagi sisi kanan. 'Seorang lagi' membuat kesejajaran kedua orang itu alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna λῃσταί dalam kisah penyaliban
  choice: perampok
  alternative: penyamun; mungkin pemberontak jika istilah itu mengandung nuansa politik
  rationale: Istilah Yunani ini dapat menunjuk kepada perampok atau bandit yang melakukan kekerasan, dan dalam konteks tertentu dapat bertumpang tindih dengan kegiatan pemberontakan. Ayat ini sendiri tidak mengharuskan makna politis, sehingga teks utama memakai istilah yang lebih luas dan alternatifnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Kala kini historis dipertahankan agar sesuai dengan gaya hidup narasi Markus.
