  naturalness: Kalimatnya pada dasarnya alami dan register-nya sesuai. “Seorang yang kebetulan lewat” sedikit lebih idiomatis untuk παράγοντά τινα daripada “seorang yang sedang lewat,” sambil menyampaikan sifat kebetulan/insidental kehadiran Simon. Keterangan aposisional dengan tanda pisah tetap jelas.
  terminology: “Simon dari Kirene,” “memaksa,” “memikul,” dan “salib” adalah pilihan yang tepat. Catatan mengenai “palang salib” layak dipertahankan sebagai alternatif leksikal, dan catatan tentang pengerahan paksa perlu ditambahkan agar keputusan leksikal ἀγγαρεύω terdokumentasi dengan anchor yang tepat.
