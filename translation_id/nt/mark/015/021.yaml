id: MRK.15.21
reference: Mark 15:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἀγγαρεύουσιν παράγοντά τινα Σίμωνα Κυρηναῖον ἐρχόμενον ἀπ’ ἀγροῦ, τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου, ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/021.yaml
  text: And they compelled a certain passerby[a], Simon of Cyrene, who was coming from the country, the father of Alexander and Rufus[c][b], to carry his cross.
translation:
  language: id
  text: Mereka memaksa seorang yang kebetulan lewat, yaitu Simon dari Kirene, yang datang dari daerah pedesaan[a]—ayah Aleksander dan Rufus—untuk memikul salib-Nya.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang datang dari ladang.”'
    reason: lexical_alternative
  - marker: b
    text: Kata kerja yang diterjemahkan “memaksa” menunjuk pada pengerahan atau pelayanan paksa.
    reason: cultural_note
  - marker: c
    text: Sebagian orang memahami “salib” di sini secara lebih khusus sebagai “palang salib”, tetapi teks Yunani hanya menyebut “salib”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγαρεύουσιν
  choice: memaksa
  rationale: Kata kerja ini menunjuk pada pengerahan paksa untuk suatu tugas, bukan sekadar permintaan; 'memaksa' mempertahankan unsur paksaan dengan bahasa Indonesia yang wajar.
- source_word: παράγοντά τινα
  choice: seorang yang sedang lewat
  rationale: Partisipel παράγοντα menggambarkan seseorang yang kebetulan sedang melintas, sedangkan τινα menyatakan ketaktentuan.
- source_word: Σίμωνα Κυρηναῖον
  choice: Simon dari Kirene
  rationale: Nama diri ditransliterasikan, dan penanda geografis Κυρηναῖον diterjemahkan secara alami sebagai 'dari Kirene'.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: yang baru datang dari luar kota
  rationale: ἀγρός dapat berarti ladang atau wilayah pedesaan. Dalam konteks gerak menuju tempat kejadian, ungkapan ini secara alami menyatakan bahwa Simon datang dari daerah di luar kota, sambil mempertahankan kemungkinan leksikal dalam catatan kaki.
- source_word: τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου
  choice: ayah Aleksander dan Rufus
  rationale: Keterangan aposisional ini dipertahankan secara langsung tanpa menafsirkan lebih jauh alasan Markus menyebut kedua nama tersebut.
- source_word: ἵνα ἄρῃ
  choice: untuk memikul
  rationale: ἵνα dengan bentuk subjungtif menyatakan tujuan. Sesudah 'memaksa', konstruksi 'untuk memikul' alami dalam bahasa Indonesia dan sesuai dengan tindakan membawa beban.
- source_word: σταυρὸν
  choice: salib
  rationale: σταυρός berarti 'salib' dalam teks ini. Terjemahan tidak mempersempitnya menjadi 'palang salib', yang merupakan rekonstruksi historis lebih spesifik daripada kata Yunani tersebut.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Pronomina ini secara alami merujuk kepada Yesus dalam konteks. Bentuk '-Nya' mempertahankan pronomina sumber tanpa menggantinya dengan nama yang tidak tertulis pada ayat ini.
theological_decisions:
- issue: Sifat tindakan terhadap Simon
  choice: Simon dipaksa untuk memikul salib Yesus.
  alternative: Simon hanya diminta atau direkrut tanpa paksaan.
  rationale: ἀγγαρεύω mengandung arti pengerahan atau kewajiban paksa, sehingga unsur koersif tidak boleh diperhalus.
- issue: Benda yang dipikul Simon
  choice: salib
  alternative: palang salib
  rationale: Walaupun rekonstruksi historis tertentu memahami benda itu secara lebih khusus sebagai palang salib, teks Yunani hanya memakai σταυρός; terjemahan utama mempertahankan keluasan istilah tersebut.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Tanda pisah menata keterangan aposisional tentang Simon agar kalimat tetap mudah dibaca. Kapital pada '-Nya' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Yesus, tanpa menambahkan nama yang tidak terdapat dalam teks Yunani.
