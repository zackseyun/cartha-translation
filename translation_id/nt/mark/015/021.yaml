revisions:
- from: Mereka memaksa seorang yang sedang lewat, yaitu Simon dari Kirene, yang baru datang dari luar kota[a]—ayah Aleksander dan Rufus—untuk memikul salib-Nya.[b]
  to: Mereka memaksa seorang yang kebetulan lewat, yaitu Simon dari Kirene, yang datang dari daerah pedesaan[a]—ayah Aleksander dan Rufus—untuk memikul salib-Nya.[b][c]
  rationale: Revisi mengganti ungkapan yang terlalu spesifik “yang baru datang dari luar kota” dengan “yang datang dari daerah pedesaan,” yang mencakup makna umum ἀγρός tanpa menambahkan rincian yang tidak dinyatakan. Catatan kaki dipulihkan untuk mendokumentasikan makna paksaan ἀγγαρεύω dan alternatif “palang salib,” sementara teks utama tetap tidak mempersempit σταυρός.
