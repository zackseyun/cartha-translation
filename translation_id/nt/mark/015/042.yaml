  text: And when evening had already come[a], since it was the Preparation Day—that is[c][b], the day before the Sabbath—
translation:
  language: id
  text: Dan ketika hari sudah petang[a], karena hari itu adalah Hari Persiapan[b], yaitu hari sebelum Sabat[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “ketika hari sudah menjadi petang.”
