lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: ketika hari sudah menjelang malam
  rationale: Konstruksi genitif absolut menyatakan waktu. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan unsur ἤδη, meskipun konteks penanggalan Yahudi membuat batas waktu yang tepat tetap memiliki ketegangan naratif.
- source_word: παρασκευή
  choice: Hari Persiapan
  rationale: Dalam konteks ini, kata tersebut merupakan sebutan kalender bagi hari persiapan menjelang Sabat, bukan sekadar kegiatan mempersiapkan sesuatu.
- source_word: προσάββατον
  choice: hari sebelum Sabat
  rationale: Padanan ini menyampaikan arti istilah Yunani secara langsung dan mudah dipahami tanpa menggantinya dengan 'Jumat', yang lebih interpretatif.
- source_word: ἐπεὶ
  choice: karena
  rationale: Kata ini memperkenalkan keterangan sebab atau penjelasan; 'karena' jelas dan alami dalam alur narasi Indonesia.
- source_word: ὅ ἐστιν
  choice: yaitu
  rationale: Formula penjelas ini paling ringkas dan alami diterjemahkan 'yaitu' dalam bahasa Indonesia modern.
- source_word: Καὶ
  choice: Ketika
  rationale: Hubungan naratif Καὶ tercermin melalui kelanjutan kalimat dalam konteks, sementara pembukaan dengan 'Ketika' menghasilkan susunan Indonesia yang alami tanpa menambah hubungan logis baru.
