  text: καὶ ἔτυπτον αὐτοῦ τὴν κεφαλὴν καλάμῳ καὶ ἐνέπτυον αὐτῷ, καὶ τιθέντες τὰ γόνατα προσεκύνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/019.yaml
  text: And they were striking his head with a reed and spitting on him[a], and kneeling down they were bowing down to him.
translation:
  language: id
  text: Mereka terus memukul kepala-Nya dengan sebatang buluh dan terus meludahi-Nya. Sambil berlutut, mereka bersujud kepada-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menyembah Dia.” Kata Yunani yang dipakai dapat berarti “bersujud di hadapan-Nya”, “memberi hormat kepada”, atau “menyembah”. Di sini tindakan itu merupakan olok-olok para prajurit yang menirukan penghormatan kepada seorang raja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυπτον
  choice: terus memukul
  rationale: Bentuk imperfek menggambarkan tindakan yang berlangsung atau dilakukan berulang kali. Ungkapan ini mempertahankan aspek tersebut tanpa menambahkan tingkat kekerasan yang tidak dinyatakan oleh verba Yunani.
- source_word: αὐτοῦ τὴν κεφαλήν
  choice: kepala-Nya
  rationale: Susunan Yunani ini secara idiomatis menyatakan kepemilikan dan paling wajar diterjemahkan demikian dalam bahasa Indonesia.
- source_word: καλάμῳ
  choice: dengan sebatang buluh
  rationale: κάλαμος biasanya menunjuk pada buluh atau batang buluh. Pilihan ini juga mempertahankan kaitan dengan benda yang dipakai dalam adegan penghinaan terhadap Yesus.
- source_word: ἐνέπτυον αὐτῷ
  choice: meludahi-Nya
  rationale: Verba imperfek menunjukkan tindakan yang berlangsung atau berulang. Dalam rangkaian dengan 'terus memukul', bentuk ini menyampaikan pelecehan yang berkelanjutan tanpa membuat kalimat terasa berat.
- source_word: τιθέντες τὰ γόνατα
  choice: sambil berlutut
  rationale: Ungkapan harfiah 'menaruh lutut' merupakan idiom untuk berlutut. Bentuk partisip menunjukkan bahwa tindakan ini menyertai tindakan bersujud.
- source_word: προσεκύνουν
  choice: bersujud
  rationale: προσκυνέω dapat menunjuk pada tindakan merendahkan diri atau bersujud untuk memberi hormat, dan dalam konteks ini dilakukan sebagai olok-olok terhadap seorang raja. 'Bersujud' mempertahankan gerak tubuh yang dimaksud tanpa memastikan bahwa para prajurit sungguh-sungguh menyembah.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Dativus sesudah προσκυνέω secara alami menyatakan pihak yang menjadi tujuan tindakan tersebut.
theological_decisions:
- issue: Makna προσκυνέω dalam konteks olok-olok
  choice: bersujud kepada-Nya
  alternative: menyembah Dia; memberi hormat kepada-Nya
  rationale: Konteks menunjukkan bahwa para prajurit sedang menirukan penghormatan kerajaan secara mengejek, bukan menyatakan ibadah yang tulus. 'Bersujud' mempertahankan tindakan lahiriah dan ironi naratif, sedangkan kemungkinan leksikal 'menyembah' dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk hormat ilahi '-Nya' dipertahankan sesuai kebiasaan penerbitan Alkitab Indonesia, tanpa menjadikan tindakan para prajurit sebagai ibadah yang tulus.
