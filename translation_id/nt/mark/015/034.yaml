id: MRK.15.34
reference: Mark 15:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τῇ ⸂ἐνάτῃ ὥρᾳ⸃ ἐβόησεν ὁ Ἰησοῦς φωνῇ ⸀μεγάλῃ· Ἐλωῒ ἐλωῒ ⸀λεμὰ σαβαχθάνι; ὅ ἐστιν μεθερμηνευόμενον Ὁ θεός μου ὁ θεός μου, εἰς τί ⸂ἐγκατέλιπές με⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/034.yaml
  text: And at the ninth hour Jesus cried out with a loud voice[a], “Eloi, Eloi, lema sabachthani?” which is translated, “My God, my God[c][b], for what reason have you forsaken me?”
translation:
  language: id
  text: Pada jam kesembilan, Yesus berseru dengan suara nyaring, “Eloi, Eloi, lema sabakhtani?” Artinya, “Allah-Ku, Allah-Ku, mengapa Engkau meninggalkan Aku?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah memuat bentuk “lama sabakhtani” dan bukan “lema sabakhtani”.
    reason: textual_variant
  - marker: b
    text: Perkataan Yesus ini menggemakan Mazmur 22:1.
    reason: cross_reference
lexical_decisions:
- source_word: τῇ ἐνάτῃ ὥρᾳ
  choice: pada jam kesembilan
  rationale: Mempertahankan cara penandaan waktu dalam teks sumber tanpa mengubahnya secara interpretatif menjadi pukul tiga sore.
- source_word: ἐβόησεν ... φωνῇ μεγάλῃ
  choice: berseru dengan suara nyaring
  rationale: Mengungkapkan seruan yang kuat dan terdengar keras dalam bahasa Indonesia yang alami serta bermartabat.
- source_word: Ἐλωῒ ἐλωῒ λεμὰ σαβαχθάνι
  choice: Eloi, Eloi, lema sabakhtani?
  rationale: Mempertahankan ucapan Semitik yang dilestarikan Markus sebelum memberikan terjemahannya; ejaan disesuaikan secara wajar dengan kaidah bunyi bahasa Indonesia.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: Artinya
  rationale: Secara alami menyampaikan bahwa Markus memberikan terjemahan atau penjelasan makna ucapan Semitik tersebut.
- source_word: Ὁ θεός μου ὁ θεός μου
  choice: Allah-Ku, Allah-Ku
  rationale: Padanan baku dan khidmat untuk sapaan langsung kepada Allah; kapitalisasi pronomina mengikuti kelaziman Alkitab bahasa Indonesia.
- source_word: εἰς τί
  choice: mengapa
  rationale: Dalam konteks pertanyaan ini, frasa tersebut secara idiomatis menanyakan alasan; 'mengapa' lebih alami daripada 'untuk alasan apa' dalam bahasa Indonesia.
- source_word: ἐγκατέλιπές με
  choice: Engkau meninggalkan Aku
  rationale: Menyampaikan tindakan meninggalkan atau menelantarkan tanpa menambahkan penjelasan teologis; bentuk lampau Yunani tidak perlu ditandai secara mekanis karena bahasa Indonesia tidak memiliki kala gramatikal yang sepadan.
theological_decisions:
- issue: Hubungan seruan Yesus dengan Mazmur 22:1
  choice: Mempertahankan seruan itu secara langsung dan mencatat gema Mazmur 22:1 dalam catatan kaki.
  alternative: Menambahkan penjelasan doktrinal dalam teks utama atau melunakkan makna 'meninggalkan'.
  rationale: Teks menghadirkan seruan keterlantaran sekaligus gema Kitab Suci. Terjemahan mempertahankan ketegangan tersebut tanpa menjelaskan bagaimana hal itu berkaitan dengan relasi Anak dan Bapa.
- issue: Penyajian ucapan Semitik Yesus
  choice: Mempertahankan transliterasi, kemudian memberikan artinya sebagaimana dilakukan Markus.
  alternative: Hanya menerjemahkan maknanya atau menyelaraskannya dengan bentuk 'Eli, Eli' dalam Matius.
  rationale: Cara ini menghormati bentuk khas Injil Markus dan menghindari harmonisasi antarinjil.
translation_notes:
  register: Bahasa Indonesia modern, baku, khidmat, dan mudah dipahami. Ungkapan waktu sumber dipertahankan. Kata 'mengapa' dipilih karena alami sekaligus setia pada fungsi εἰς τί; ambiguitas dan ketegangan teologis seruan Yesus tidak diselesaikan melalui parafrasa.
