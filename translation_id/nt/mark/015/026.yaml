  text: καὶ ἦν ἡ ἐπιγραφὴ τῆς αἰτίας αὐτοῦ ἐπιγεγραμμένη· Ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/026.yaml
  text: 'And the inscription of the charge against him was written: “The King of the Jews.”[a]'
translation:
  language: id
  text: Dan tulisan yang menyatakan tuduhan terhadap-Nya berbunyi, “Raja orang Yahudi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Raja orang Yudea.”
    reason: Alternatif leksikal bagi Ἰουδαίων.
lexical_decisions:
- source_word: ἐπιγραφή
  choice: tulisan
  rationale: Menunjuk pada keterangan tertulis yang dipasang pada atau di atas salib. “Tulisan” alami dalam bahasa Indonesia dan tidak menambahkan bentuk benda tertentu yang tidak disebutkan dalam teks.
- source_word: αἰτία
  choice: tuduhan terhadap-Nya
  rationale: Dalam konteks hukum ini, kata tersebut menyatakan tuduhan atau dakwaan yang menjadi alasan penghukuman. “Tuduhan terhadap-Nya” jelas serta mempertahankan hubungan pronominal dalam teks Yunani.
- source_word: ἐπιγεγραμμένη
  choice: berbunyi
  rationale: Konstruksi perifrastik ἦν ... ἐπιγεγραμμένη menyatakan bahwa tulisan itu terpampang dalam keadaan tertulis. Dalam bahasa Indonesia, “tulisan ... berbunyi” secara alami memperkenalkan isi persis suatu inskripsi tanpa mengubah maknanya.
- source_word: βασιλεὺς
  choice: Raja
  rationale: Merupakan gelar kerajaan dalam rumusan tuduhan; huruf kapital sesuai karena kata itu menjadi bagian dari kutipan resmi yang dipasang.
- source_word: Ἰουδαίων
  choice: orang Yahudi
  rationale: Dalam kisah sengsara Markus, frasa ini merupakan gelar baku yang dikenakan kepada Yesus. “Orang Yahudi” adalah padanan Indonesia yang lazim, sementara kemungkinan arti “orang Yudea” dicatat dalam catatan kaki.
theological_decisions:
- issue: Pemaknaan Ἰουδαίων dalam gelar penyaliban
  choice: orang Yahudi
  alternative: orang Yudea
  rationale: Ayat ini melaporkan rumusan tuduhan atau gelar Romawi yang dipasang pada Yesus. Terjemahan “orang Yahudi” mempertahankan ungkapan yang dikenal dalam kisah sengsara dan tidak mempersempitnya menjadi keterangan geografis saja. Karena Ἰουδαῖος dalam konteks tertentu dapat berarti “orang Yudea,” kemungkinan itu tetap dicantumkan demi transparansi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Susunan “tulisan yang menyatakan tuduhan ... berbunyi” menyampaikan fungsi hukum inskripsi secara alami tanpa membuat kalimat terlalu teknis.
