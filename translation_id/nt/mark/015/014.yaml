  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἔλεγεν αὐτοῖς· Τί γὰρ ⸂ἐποίησεν κακόν⸃; οἱ δὲ ⸀περισσῶς ἔκραξαν· Σταύρωσον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/014.yaml
  text: But Pilate was saying to them[a], “For what evil has he done?” But they cried out all the more, “Crucify him!”
translation:
  language: id
  text: Namun Pilatus terus bertanya kepada mereka, “Memangnya, kejahatan apa yang telah dilakukannya?”[a] Tetapi mereka berteriak makin keras, “Salibkan dia!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mengapa? Kejahatan apa yang telah dilakukannya?”
    reason: Alternatif ini menampilkan γάρ secara lebih eksplisit sebagai keberatan Pilatus terhadap tuntutan orang banyak.
lexical_decisions:
- source_word: ἔλεγεν
  choice: terus bertanya
  rationale: Bentuk imperfek menggambarkan ujaran yang sedang berlangsung atau berulang. Karena ujaran Pilatus berbentuk pertanyaan, ‘terus bertanya’ menyampaikan aspek tersebut secara alami dalam bahasa Indonesia.
- source_word: Τί γὰρ ἐποίησεν κακόν
  choice: Kejahatan apa sebenarnya yang telah dilakukannya?
  rationale: Dalam konteks ini γάρ menegaskan tantangan Pilatus terhadap tuntutan orang banyak; ‘sebenarnya’ menyampaikan fungsi itu secara wajar. ‘Kejahatan’ mempertahankan bobot moral κακόν.
- source_word: περισσῶς
  choice: semakin keras
  rationale: Adverbia ini memperkuat dan menunjukkan meningkatnya seruan orang banyak. ‘Semakin keras’ alami dalam konteks teriakan dan mempertahankan unsur eskalasi.
- source_word: ἔκραξαν
  choice: berteriak
  rationale: κράζω menunjukkan seruan publik dengan suara keras; ‘berteriak’ menyampaikannya secara langsung dan lazim.
- source_word: Σταύρωσον αὐτόν
  choice: Salibkan dia!
  rationale: Imperatif aoris adalah tuntutan langsung kepada Pilatus. ‘Salibkan dia!’ mempertahankan bentuk perintah yang singkat dan kuat.
- source_word: δὲ
  choice: Namun / Tetapi
  rationale: 'Kedua kemunculan δέ menandai pertentangan: pertama antara Pilatus dan orang banyak, lalu antara pertanyaan Pilatus dan jawaban mereka.'
- source_word: Πιλᾶτος
  choice: Pilatus
  rationale: Nama diri ditransliterasikan menurut bentuk yang sudah baku dalam bahasa Indonesia.
theological_decisions:
- issue: Bobot moral κακόν dalam pertanyaan Pilatus
  choice: kejahatan
  alternative: kesalahan / perbuatan buruk
  rationale: ‘Kejahatan’ mempertahankan daya moral dan yuridis istilah Yunani tanpa menambahkan kesimpulan teologis di luar teks.
- issue: Kapitalisasi kata ganti yang merujuk kepada Yesus
  choice: dia
  alternative: Dia
  rationale: Teks Yunani tidak menandai kata ganti ini dengan kapitalisasi kehormatan. Huruf kecil mempertahankan gaya bahasa Indonesia modern tanpa memasukkan konvensi teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Susunan kalimat mempertahankan pertentangan dalam narasi, sedangkan pilihan kata tetap kuat tanpa terdengar kuno.
