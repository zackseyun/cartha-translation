translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab Indonesia. Terjemahan menghindari bentuk kaku 'berkata' setelah verba bertanya dan mempertahankan nuansa yudisial tanpa memperkerasnya menjadi 'menginterogasi'.
