  yaml_path: translation/nt/mark/015/004.yaml
  text: But Pilate again questioned him, saying, “Do you give no answer? Look how many charges they are bringing against you.”
translation:
  language: id
  text: Namun Pilatus kembali bertanya kepada-Nya, “Tidakkah Engkau memberi jawaban? Lihatlah betapa banyak tuduhan yang mereka ajukan terhadap-Mu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Lihatlah betapa banyak hal yang mereka tuduhkan kepada-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai perkembangan narasi dengan pertentangan ringan terhadap sikap diam Yesus dalam konteks sebelumnya.
- source_word: πάλιν
  choice: kembali
  rationale: Secara alami menyatakan bahwa Pilatus mengulangi tindakannya.
- source_word: ἐπηρώτα
  choice: bertanya
  rationale: Bentuk imperfek dapat menyiratkan tindakan yang berlangsung atau berulang; dalam bahasa Indonesia, 'kembali bertanya' menyampaikan hal itu tanpa kesan sekeras 'menginterogasi'.
- source_word: λέγων
  choice: bertanya ... [dengan kutipan langsung]
  rationale: Partisipel pengantar ujaran tidak perlu diterjemahkan secara kaku sebagai 'dengan berkata'; kutipan langsung setelah 'bertanya' menghasilkan bahasa Indonesia yang lebih alami.
- source_word: Οὐκ ἀποκρίνῃ οὐδέν;
  choice: Tidakkah Engkau menjawab?
  rationale: Mempertahankan tekanan pertanyaan negatif terhadap sikap diam Yesus dalam ungkapan Indonesia yang wajar.
- source_word: ἴδε
  choice: Lihatlah
  rationale: Imperatif ini mengarahkan perhatian Yesus kepada banyaknya tuduhan; bentuk '-lah' sesuai dengan register yang bermartabat.
- source_word: πόσα
  choice: betapa banyak tuduhan
  rationale: Secara harfiah berarti 'betapa banyak hal', tetapi konteks pengadilan dan verba κατηγοροῦσιν membuat 'tuduhan' sebagai objek tersirat yang alami.
- source_word: σου
  choice: terhadap-Mu
  rationale: Genitif bersama κατηγορέω menandai pihak yang dituduh; 'terhadap-Mu' merupakan padanan Indonesia yang idiomatis.
- source_word: κατηγοροῦσιν
  choice: mereka ajukan
  rationale: Dalam konteks hukum, verba ini berarti menuduh atau mengajukan tuduhan; dipadukan dengan 'tuduhan' untuk menghasilkan frasa Indonesia yang alami dan tetap mencerminkan tindakan yang sedang berlangsung dalam adegan.
