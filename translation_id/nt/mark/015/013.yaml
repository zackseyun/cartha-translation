  text: Namun, mereka kembali berteriak, “Salibkan Dia!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ
  choice: mereka
  rationale: Kata sandang nominatif jamak ini berfungsi sebagai nomina dan merujuk kepada kelompok yang telah disebut dalam konteks; pronomina 'mereka' merupakan padanan Indonesia yang alami tanpa mempersempitnya menjadi 'orang banyak'.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai kontras ringan terhadap perkataan Pilatus sebelumnya. 'Namun' menyampaikan hubungan adversatif itu secara wajar dan bermartabat.
- source_word: πάλιν
  choice: kembali
  rationale: πάλιν menunjukkan pengulangan. 'Kembali' alami dalam konstruksi 'kembali berteriak' dan mempertahankan penekanan naratif bahwa seruan itu diulangi.
- source_word: ἔκραξαν
  choice: berteriak
  rationale: κράζω menyatakan seruan dengan suara keras. 'Berteriak' mempertahankan intensitas tindakan tersebut dalam bahasa Indonesia modern.
- source_word: Σταύρωσον
  choice: Salibkan
  rationale: Bentuk imperatif aoris aktif orang kedua tunggal ini ditujukan kepada Pilatus. Imperatif langsung 'Salibkan' mempertahankan bentuk dan daya desak teks Yunani tanpa mengubahnya menjadi bentuk kausatif tidak langsung.
- source_word: αὐτόν
  choice: Dia
  rationale: Pronomina objek ini merujuk kepada Yesus. 'Dia' jelas dan alami; huruf kapital mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk pronomina yang merujuk kepada Yesus, tanpa mengubah makna sumber.
