  text: σῶσον σεαυτὸν ⸀καταβὰς ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/030.yaml
  text: Save yourself[a], coming down from the cross!
translation:
  language: id
  text: Selamatkanlah diri-Mu[a] dengan turun dari salib!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih harfiah: “Selamatkanlah diri-Mu setelah turun dari salib,” atau “Selamatkanlah diri-Mu; turunlah dari salib!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶσον
  choice: Selamatkanlah
  rationale: Imperatif aoris orang kedua tunggal yang berfungsi sebagai ejekan sekaligus perintah. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan bahasa keselamatan.
- source_word: σεαυτόν
  choice: diri-Mu
  rationale: Pronomina refleksif sebagai objek langsung. Huruf kapital mengikuti kebiasaan bahasa Indonesia dalam penyebutan Yesus tanpa menambah tafsiran pada makna Yunani.
- source_word: καταβάς
  choice: dengan turun
  rationale: Partisip aoris aktif ini menerangkan tindakan yang menyertai atau menjadi cara untuk melaksanakan tantangan tersebut. Ungkapan ini ringkas dan alami, sementara kemungkinan hubungan sintaksis lain dicatat dalam catatan kaki.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: dari salib
  rationale: Frasa preposisional yang menyatakan gerakan menjauh dari salib; 'salib' merupakan padanan baku bagi σταυρός dalam konteks penyaliban.
theological_decisions:
- issue: Hubungan partisip καταβάς dengan imperatif σῶσον
  choice: Selamatkanlah diri-Mu dengan turun dari salib!
  alternative: Selamatkanlah diri-Mu, lalu turunlah dari salib! / Selamatkanlah diri-Mu setelah turun dari salib!
  rationale: Bahasa Yunani memakai imperatif yang diikuti partisip aoris dalam ejekan yang padat. Terjemahan utama membacanya secara adverbial sebagai cara atau tindakan penyerta, tetapi catatan kaki mempertahankan kemungkinan koordinatif dan temporal agar ketegangan sintaksis tidak diselesaikan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada ejekan-perintah. Partikel -lah memberi bentuk perintah yang wajar dan tegas.
