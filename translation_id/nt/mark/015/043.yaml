id: MRK.15.43
reference: Mark 15:43
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἐλθὼν Ἰωσὴφ ⸀ὁ ἀπὸ Ἁριμαθαίας εὐσχήμων βουλευτής, ὃς καὶ αὐτὸς ἦν προσδεχόμενος τὴν βασιλείαν τοῦ θεοῦ, τολμήσας εἰσῆλθεν πρὸς ⸀τὸν Πιλᾶτον καὶ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/043.yaml
  text: Joseph of Arimathea[a], a respected council member who was himself also waiting for the kingdom of God[d][c][b], boldly went in to Pilate and asked for the body of Jesus.
translation:
  language: id
  text: Yusuf dari Arimatea datang. Ia adalah seorang anggota dewan yang terpandang[a] dan ia sendiri juga sedang menantikan Kerajaan Allah. Setelah memberanikan diri[b], ia menghadap Pilatus dan meminta jenazah Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terhormat” atau “berkedudukan tinggi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan berani ia menghadap Pilatus”; bahasa Yunani menonjolkan keberanian Yusuf untuk menghadap Pilatus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: datang
  rationale: Partisip aoristus ini menyatakan tindakan pendahuluan Yusuf. Pemisahan menjadi kalimat singkat mempertahankan maknanya tanpa menghasilkan rangkaian verba gerak yang janggal dalam bahasa Indonesia.
- source_word: ὁ ἀπὸ Ἁριμαθαίας
  choice: dari Arimatea
  rationale: Ungkapan asal ini diterjemahkan langsung dan alami sebagai penanda tempat asal Yusuf.
- source_word: εὐσχήμων
  choice: terpandang
  rationale: Kata ini menunjukkan kedudukan baik, kehormatan, atau penghargaan sosial. 'Terpandang' alami dalam bahasa Indonesia dan tidak menjadikannya gelar resmi.
- source_word: βουλευτής
  choice: anggota dewan
  rationale: Terjemahan ini menyampaikan keanggotaan dalam suatu dewan tanpa menyebut Sanhedrin secara eksplisit, karena nama lembaga itu tidak terdapat dalam kata Yunani.
- source_word: ὃς καὶ αὐτὸς
  choice: dan ia sendiri juga
  rationale: Susunan ini mempertahankan penekanan καὶ αὐτός bahwa Yusuf secara pribadi termasuk orang yang menantikan Kerajaan Allah.
- source_word: ἦν προσδεχόμενος
  choice: sedang menantikan
  rationale: Bentuk perifrastis ini menggambarkan sikap penantian yang berlangsung, bukan tindakan sesaat.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ini adalah padanan baku, langsung, dan jelas bagi ungkapan utama dalam Injil.
- source_word: τολμήσας
  choice: setelah memberanikan diri
  rationale: Pilihan ini mempertahankan gagasan bahwa Yusuf harus berani mengambil langkah yang berisiko sebelum menghadap Pilatus.
- source_word: εἰσῆλθεν πρὸς τὸν Πιλᾶτον
  choice: menghadap Pilatus
  rationale: Dalam konteks memasuki hadapan seorang penguasa, 'menghadap' secara alami menyampaikan gerak masuk menuju hadirat Pilatus tanpa ungkapan Indonesia yang kaku.
- source_word: ᾐτήσατο
  choice: meminta
  rationale: Padanan sederhana ini tepat untuk permohonan Yusuf kepada Pilatus dan tidak menambahkan tingkat formalitas yang tidak diwajibkan teks.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: jenazah Yesus
  rationale: Dalam konteks Yesus telah wafat dan hendak dimakamkan, 'jenazah' merupakan padanan Indonesia yang alami dan penuh hormat bagi σῶμα, tanpa mengubah referennya.
theological_decisions:
- issue: Identitas lembaga yang dimaksud oleh βουλευτής
  choice: anggota dewan
  alternative: anggota Mahkamah Agama atau anggota Sanhedrin
  rationale: Konteks kemungkinan besar menunjuk kepada dewan Yahudi, tetapi kata Yunani hanya menyatakan bahwa Yusuf adalah seorang anggota dewan. Teks utama tidak menambahkan nama lembaga yang tidak disebutkan secara eksplisit.
- issue: Daya makna τολμήσας
  choice: setelah memberanikan diri
  alternative: dengan berani
  rationale: Bentuk ini menonjolkan tindakan Yusuf dalam mengumpulkan keberanian untuk menghadap Pilatus, sekaligus mempertahankan hubungan tindakan pendahuluan partisip dengan verba utama.
- issue: Penekanan dalam ὃς καὶ αὐτὸς
  choice: ia sendiri juga sedang menantikan Kerajaan Allah
  alternative: ia juga menantikan Kerajaan Allah
  rationale: Kata 'sendiri' mempertahankan penekanan Yunani bahwa Yusuf secara pribadi turut memiliki pengharapan tersebut, tanpa menjelaskan lebih jauh sifat teologis pengharapannya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kalimat Yunani yang panjang dibagi agar mudah dipahami, sementara hubungan tindakan dan penekanan penting tetap dipertahankan. 'Dewan' sengaja tidak diperinci menjadi 'Sanhedrin', dan 'jenazah' dipilih sebagai ungkapan kontekstual yang alami serta hormat.
