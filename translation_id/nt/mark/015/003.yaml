  text: And the chief priests were accusing him of many things[a].
translation:
  language: id
  text: Dan para imam kepala terus menuduh Dia tentang banyak hal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih formal, “terus mengajukan banyak tuduhan terhadap Dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Mempertahankan penghubung sederhana dan alur naratif parataktis khas Markus.
- source_word: κατηγόρουν
  choice: terus melontarkan ... tuduhan
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung atau dilakukan berulang kali pada masa lampau; kata 'terus' menyatakan aspek duratif itu secara alami.
- source_word: αὐτοῦ
  choice: terhadap Dia
  rationale: Bentuk genitif sesudah κατηγορέω menandai pihak yang dituduh; 'terhadap Dia' sesuai dengan konstruksi bahasa Indonesia ketika verba sumber diungkapkan sebagai 'melontarkan tuduhan'.
- source_word: οἱ ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Istilah ini menunjuk para pemimpin kalangan imam, bukan beberapa orang yang masing-masing sedang memegang jabatan imam besar.
- source_word: πολλά
  choice: banyak tuduhan
  rationale: Bentuk netral jamak menunjukkan banyaknya perkara yang dituduhkan. Ungkapan ini alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan kemungkinan terjemahan yang tidak mengubahnya menjadi nomina hukum secara eksplisit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Terus' mempertahankan nuansa imperfek, sedangkan 'melontarkan banyak tuduhan' menyampaikan tindakan menuduh secara alami tanpa menentukan isi tuduhannya.
