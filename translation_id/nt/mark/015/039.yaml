revisions:
- from: Ketika perwira itu, yang berdiri berhadapan dengan Yesus, melihat bahwa Yesus mengembuskan napas terakhir dengan cara demikian, ia berkata, “Sungguh, orang ini adalah Anak Allah.”[a]
  to: Ketika perwira Romawi itu, yang berdiri berhadapan dengan Yesus, melihat bahwa Yesus mengembuskan napas terakhir seperti itu, ia berkata, “Sungguh, orang ini adalah Anak Allah.”[a]
  rationale: Revisi mempertajam κεντυρίων sebagai “perwira Romawi,” mengganti ungkapan yang kurang alami “dengan cara demikian” dengan “seperti itu,” dan membetulkan catatan alternatif agar mempertahankan ambiguitas gramatikal tanpa mengganti θεός/Allah dengan “dewa.” Bentuk “adalah” dipertahankan sebagai kopula deklaratif Indonesia yang wajar dalam ujaran berbingkai masa lampau.
