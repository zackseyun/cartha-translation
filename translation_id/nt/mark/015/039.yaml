  text: ἰδὼν δὲ ὁ κεντυρίων ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ ὅτι ⸀οὕτως ἐξέπνευσεν εἶπεν· Ἀληθῶς ⸂οὗτος ὁ ἄνθρωπος⸃ υἱὸς ⸂θεοῦ ἦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/039.yaml
  text: When the centurion[a], who was standing opposite him, saw that he breathed his last in this way, he said, “Truly this man was God's Son.”
translation:
  language: id
  text: Ketika perwira Romawi itu, yang berdiri berhadapan dengan Yesus, melihat bahwa Yesus mengembuskan napas terakhir seperti itu, ia berkata, “Sungguh, orang ini adalah Anak Allah.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sungguh, orang ini adalah seorang anak Allah.” Ungkapan Yunani ini dapat dipahami secara kualitatif atau tak-takrif, tetapi dalam konteks Injil Markus kemungkinan besar ungkapan ini berfungsi sebagai gelar “Anak Allah”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Ketika ... melihat
  rationale: Partisip aoris ἰδών paling wajar menyatakan waktu dalam konteks ini. δέ bersifat penghubung ringan dan tidak perlu diterjemahkan sebagai pertentangan yang tegas.
- source_word: κεντυρίων
  choice: perwira
  rationale: κεντυρίων menunjuk kepada perwira Romawi yang memimpin sekitar seratus prajurit. Dalam bahasa Indonesia modern, “perwira” alami dalam teks utama tanpa membebani kalimat dengan istilah historis yang kurang umum.
- source_word: ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ
  choice: yang berdiri berhadapan dengan Yesus
  rationale: παρεστηκώς menggambarkan posisi berdiri yang telah diambil, sedangkan ἐξ ἐναντίας menyatakan posisi berhadapan. Nama “Yesus” dipakai untuk memperjelas acuan pronomina dalam bahasa Indonesia.
- source_word: ὅτι οὕτως ἐξέπνευσεν
  choice: bahwa Yesus mengembuskan napas terakhir dengan cara demikian
  rationale: ἐκπνέω secara harfiah berkaitan dengan mengembuskan napas dan secara idiomatis berarti meninggal. Ungkapan ini mempertahankan gambaran hidup sumber serta menerjemahkan οὕτως secara eksplisit.
- source_word: Ἀληθῶς
  choice: Sungguh
  rationale: “Sungguh” menyampaikan penegasan khidmat ἀληθῶς secara alami dalam bahasa Indonesia.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: orang ini
  rationale: “Orang ini” merupakan padanan langsung dan alami bagi οὗτος ὁ ἄνθρωπος dalam tuturan tersebut.
- source_word: υἱὸς θεοῦ
  choice: Anak Allah
  rationale: Dalam alur Injil Markus, ungkapan ini memiliki bobot sebagai sebutan kristologis. Bahasa Indonesia tidak memakai artikel takrif atau tak takrif seperti bahasa Yunani, sehingga “Anak Allah” mempertahankan daya ungkapan tanpa menambahkan kata sandang.
- source_word: ἦν
  choice: adalah
  rationale: Walaupun ἦν berbentuk lampau, bahasa Indonesia tidak menandai kala pada kopula. “Adalah” memberi bentuk deklaratif yang alami; menerjemahkannya dengan “dahulu” akan menyiratkan bahwa status itu telah berakhir.
theological_decisions:
- issue: Daya ungkapan υἱὸς θεοῦ dalam pengakuan perwira
  choice: Anak Allah
  alternative: seorang anak dewa
  rationale: Ketiadaan artikel memungkinkan pembahasan tentang nuansa kualitatif atau tak takrif, tetapi konteks naratif Markus mendukung daya gelar “Anak Allah”. Alternatif dicatat agar ambiguitas bahasa Yunani tidak disembunyikan.
- issue: Kala lampau ἦν dan implikasinya dalam bahasa Indonesia
  choice: adalah
  alternative: dahulu adalah
  rationale: Bahasa Indonesia lazim memakai kopula tanpa penandaan kala. “Dahulu adalah” dapat secara keliru menyiratkan bahwa Yesus tidak lagi Anak Allah, suatu kesimpulan yang tidak dituntut oleh bentuk imperfek Yunani dalam ucapan naratif ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. Pengulangan nama “Yesus” menghindari rangkaian pronomina yang berpotensi kabur. Penanda catatan kaki ditempatkan sesudah kutipan yang dijelaskannya.
