translation:
  language: id
  text: Lalu orang banyak itu datang dan mulai meminta Pilatus melakukan seperti yang biasa ia lakukan bagi mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Lalu orang banyak itu, setelah datang, mulai meminta Pilatus melakukan seperti yang biasa ia lakukan bagi mereka.”'
    reason: Alternatif ini mempertahankan struktur partisip dari bahasa Yunani, sementara teks utama menyajikannya dengan susunan yang lebih alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: ἀναβὰς
  choice: datang
  rationale: Partisip aoris ἀναβαίνω secara harfiah menyatakan gerak 'naik/mendatangi'. Dalam konteks orang banyak menghampiri tempat Pilatus, 'datang' terdengar alami tanpa menetapkan rincian topografis yang tidak dijelaskan.
- source_word: ὁ ὄχλος
  choice: orang banyak itu
  rationale: ὄχλος menunjuk kepada kerumunan atau orang banyak. 'Orang banyak itu' merupakan ungkapan naratif Alkitab yang tetap jelas dalam bahasa Indonesia modern.
- source_word: ἤρξατο αἰτεῖσθαι
  choice: mulai meminta
  rationale: Konstruksi ἄρχομαι dengan infinitif berarti 'mulai', sedangkan αἰτέω di sini berarti meminta atau memohon. 'Mulai meminta' ringkas dan alami.
- source_word: καθὼς
  choice: seperti
  rationale: καθώς berarti 'seperti/sebagaimana' dan menghubungkan permintaan orang banyak dengan kebiasaan Pilatus. Terjemahan ini mempertahankan bentuk perbandingan yang agak padat dalam bahasa sumber.
- source_word: ἐποίει
  choice: yang biasa dilakukannya
  rationale: Bentuk imperfek ποιέω menyatakan tindakan yang lazim dilakukan pada masa lampau; 'biasa dilakukannya' menyampaikan aspek kebiasaan tersebut.
- source_word: αὐτοῖς
  choice: bagi mereka
  rationale: 'Datif ini bersifat benefaktif: tindakan kebiasaan itu dilakukan untuk kepentingan mereka. ''Bagi mereka'' menyampaikan hubungan tersebut dengan jelas.'
- source_word: implied referent of ἐποίει
  choice: Pilatus
  rationale: Bahasa Yunani memakai subjek tersirat yang dalam konteks merujuk kepada Pilatus. Menyebut namanya menghindari ambiguitas pronominal dalam bahasa Indonesia dan membuat kalimat alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan aspek kebiasaan pada verba imperfek dan tanpa menjelaskan di ayat ini tindakan khusus yang diminta.
