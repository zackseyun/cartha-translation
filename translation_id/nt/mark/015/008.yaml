  naturalness: '"Meminta Pilatus melakukan seperti yang biasa ia lakukan bagi mereka" adalah susunan baku yang lebih lancar. Penambahan "untuk" sesudah meminta juga mungkin, tetapi dapat dihilangkan demi gaya naratif yang ringkas dan tetap jelas.'
  terminology: '"Orang banyak", "meminta", dan "biasa ... lakukan" sesuai untuk bahasa Indonesia modern dan mempertahankan register naratif. Nama Pilatus tepat sebagai penjelasan subjek tersirat ἐποίει, tanpa menambahkan tindakan spesifik yang belum disebutkan dalam ayat ini.'
