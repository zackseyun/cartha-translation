  yaml_path: translation/nt/mark/005/024.yaml
  text: And he went with him[a]. And a large crowd was following him and pressing around him.
translation:
  language: id
  text: Lalu Yesus pergi bersamanya. Kerumunan besar terus mengikuti-Nya dan menghimpit-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berdesak-desakan di sekeliling-Nya” atau “mendesak-Nya.” Kata Yunani yang dipakai menggambarkan tekanan fisik kerumunan yang merapat pada Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: pergi
  rationale: Bentuk aoris ini melanjutkan narasi dengan menyatakan bahwa Yesus bergerak bersama Yairus. “Pergi” alami dalam bahasa Indonesia dan tidak menyiratkan bahwa Ia meninggalkan Yairus.
- source_word: μετ’ αὐτοῦ
  choice: bersamanya
  rationale: μετά dengan genitif menyatakan penyertaan. Dalam konteks, “-nya” merujuk kepada Yairus.
- source_word: ἠκολούθει
  choice: mengikuti
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung. Dalam narasi Indonesia, aspek berkelanjutan ini tersampaikan secara alami melalui konteks tanpa harus menambahkan “sedang”.
- source_word: ὄχλος πολύς
  choice: kerumunan besar
  rationale: Ungkapan ini menyatakan kumpulan orang dalam jumlah besar. “Kerumunan besar” jelas, modern, dan sesuai dengan suasana orang-orang yang berhimpit.
- source_word: συνέθλιβον
  choice: berdesak-desakan menghimpit
  rationale: Kata kerja ini menggambarkan tekanan fisik dari kerumunan yang merapat pada Yesus. Gabungan ini mempertahankan unsur saling berdesakan sekaligus tekanan terhadap-Nya tanpa menyatakan bahwa Ia sampai terluka.
- source_word: αὐτόν
  choice: -Nya
  rationale: Pronomina ini merujuk kepada Yesus sebagai orang yang dihimpit oleh kerumunan.
