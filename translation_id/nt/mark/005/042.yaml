  text: καὶ ⸀εὐθὺς ἀνέστη τὸ κοράσιον καὶ περιεπάτει, ἦν γὰρ ἐτῶν δώδεκα. καὶ ἐξέστησαν ⸁εὐθὺς ἐκστάσει μεγάλῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/042.yaml
  text: And immediately the girl stood up and began walking[a], for she was twelve years old[b]. And immediately they were overcome with great amazement.
translation:
  language: id
  text: Segera gadis itu bangkit[a] dan mulai berjalan, sebab ia berumur dua belas tahun. Segera mereka diliputi ketakjuban yang besar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "berdiri" atau "bangun". Kata Yunani yang diterjemahkan "bangkit" juga dapat berarti demikian.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, "mereka tercengang dengan ketakjuban yang besar." Bahasa Yunani memakai kata kerja dan kata benda serumpun untuk menegaskan betapa besar ketakjuban mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: saat itu juga / seketika
  rationale: Mempertahankan tempo narasi Markus yang cepat dengan ungkapan Indonesia yang wajar; variasi menghindari pengulangan yang kaku tanpa mengurangi makna.
- source_word: ἀνέστη
  choice: bangkit
  rationale: Dalam konteks ini berarti anak itu kembali berdiri sesudah diperintah Yesus. 'Bangkit' mempertahankan keluasan makna verba Yunani tanpa secara eksplisit menjadikannya istilah teknis kebangkitan.
- source_word: τὸ κοράσιον
  choice: anak perempuan itu
  rationale: Secara alami menunjuk kepada gadis yang masih muda; keterangan bahwa ia berumur dua belas tahun membuat penambahan lain tidak perlu.
- source_word: περιεπάτει
  choice: berjalan ke sana kemari
  rationale: Bentuk imperfek menggambarkan tindakan berjalan yang berlangsung; ungkapan ini membuat gerak yang tampak sesudah ia bangkit menjadi jelas.
- source_word: ἦν γὰρ ἐτῶν δώδεκα
  choice: sebab umurnya dua belas tahun
  rationale: Menerjemahkan γάρ secara eksplisit sebagai penjelasan dan memakai cara penyebutan umur yang alami dalam bahasa Indonesia.
- source_word: ἐξέστησαν ... ἐκστάσει μεγάλῃ
  choice: sangat takjub
  rationale: Mengungkapkan secara idiomatis konstruksi serumpun Yunani yang menekankan ketakjuban luar biasa, tanpa pengulangan janggal dalam teks utama.
theological_decisions:
- issue: Nuansa kemungkinan kebangkitan dalam ἀνέστη
  choice: bangkit
  alternative: berdiri / bangun
  rationale: Konteksnya memang pemulihan dari kematian, tetapi verba itu sendiri juga dapat berarti bangun atau berdiri. 'Bangkit' mempertahankan kemungkinan gema yang lebih luas tanpa menambahkan pernyataan doktrinal yang lebih tegas daripada teks.
- issue: Konstruksi intensif ἐξέστησαν ... ἐκστάσει μεγάλῃ
  choice: sangat takjub
  alternative: tercengang dengan ketercengangan yang besar
  rationale: Bahasa Indonesia alami menyampaikan intensitas melalui 'sangat'; catatan kaki mempertahankan informasi bahwa bahasa Yunani memakai verba dan nomina serumpun.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur narasi dibuat alami bagi pembaca umum, sementara kedua catatan kaki menjaga keluasan makna ἀνέστη dan intensitas ungkapan serumpun ἐξέστησαν ... ἐκστάσει μεγάλῃ.
