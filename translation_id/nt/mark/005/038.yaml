  yaml_path: translation/nt/mark/005/038.yaml
  text: And they come to the house of the synagogue leader[a], and he sees a commotion, and people weeping and wailing loudly.
translation:
  language: id
  text: Lalu mereka tiba di rumah pemimpin rumah ibadat, dan Ia melihat suatu keributan[a], orang-orang yang menangis dan meratap dengan nyaring.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: kegaduhan; istilah Yunani ini dapat menunjuk pada keadaan gaduh atau kacau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: mereka tiba
  rationale: Bentuk kini historis menyajikan peristiwa secara hidup; “tiba” secara alami menyatakan bahwa mereka sampai di rumah itu tanpa memaksakan sudut pandang deiktis yang kurang wajar dalam bahasa Indonesia.
- source_word: οἶκον
  choice: rumah
  rationale: Padanan langsung dan netral untuk tempat tinggal yang dimaksud.
- source_word: ἀρχισυναγώγου
  choice: pemimpin rumah ibadat
  rationale: Istilah ini menunjuk pada pejabat yang memimpin sinagoge; frasa ini jelas bagi pembaca Indonesia modern dan tidak memakai ungkapan arkais.
- source_word: θεωρεῖ
  choice: Dia melihat
  rationale: Kata kerja tunggal ini secara kontekstual merujuk pada Yesus. “Melihat” menyampaikan tindakan secara sederhana, sedangkan kata ganti mempertahankan bentuk rujukan yang tidak menyebut nama dalam teks Yunani.
- source_word: θόρυβον
  choice: keributan
  rationale: Kata ini menyatakan kegaduhan atau suasana gaduh, bukan sekadar bunyi.
- source_word: κλαίοντας
  choice: orang-orang yang menangis
  rationale: Partisipel ini berfungsi substantival; penyebutan “orang-orang” menghasilkan bahasa Indonesia yang alami.
- source_word: ἀλαλάζοντας
  choice: meratap
  rationale: Dalam konteks perkabungan, kata ini menunjuk pada seruan ratapan yang nyaring.
- source_word: πολλά
  choice: dengan suara keras
  rationale: Kata ini berfungsi adverbial untuk menguatkan tindakan meratap; padanan ini menyampaikan intensitas bunyinya secara alami.
