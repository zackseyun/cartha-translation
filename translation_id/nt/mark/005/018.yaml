  yaml_path: translation/nt/mark/005/018.yaml
  text: And as he was getting into the boat[a], the man who had been demon-possessed kept begging him that he might be with him.
translation:
  language: id
  text: Ketika Yesus sedang naik ke perahu, orang yang tadinya kerasukan setan[a] terus memohon kepada-Nya agar ia dapat bersama-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “orang yang tadinya dikuasai roh jahat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβαίνοντος αὐτοῦ
  choice: Ketika Yesus sedang naik
  rationale: Partisipel kini dalam konstruksi genitif absolut menunjukkan tindakan yang sedang berlangsung bersamaan dengan permohonan. Nama “Yesus” memperjelas acuan pronomina tanpa mengubah makna.
- source_word: πλοῖον
  choice: perahu
  rationale: Dalam konteks Danau Galilea, “perahu” merupakan padanan Indonesia modern yang wajar dan tidak menyiratkan kapal besar.
- source_word: παρεκάλει
  choice: terus memohon
  rationale: Bentuk imperfek menggambarkan permohonan yang berlangsung atau diulang; “terus memohon” mempertahankan aspek duratif sekaligus kesungguhannya.
- source_word: ὁ δαιμονισθείς
  choice: orang yang tadinya kerasukan setan
  rationale: Partisipel substantival menunjuk kepada orang yang sebelumnya dirasuki tetapi kini telah dibebaskan. “Tadinya” menandai bahwa keadaan itu sudah berlalu dalam konteks narasi.
- source_word: ἵνα μετ’ αὐτοῦ ᾖ
  choice: agar ia boleh bersama-Nya
  rationale: Konstruksi ἵνα dengan subjungtif menyatakan isi permohonan. “Bersama-Nya” mempertahankan nuansa relasional μετ’ αὐτοῦ tanpa membatasinya hanya pada tindakan ikut bepergian.
theological_decisions:
- issue: Makna δαιμονισθείς sebagai penderitaan akibat kuasa roh jahat
  choice: kerasukan setan
  alternative: dikuasai roh jahat
  rationale: “Kerasukan setan” adalah ungkapan Indonesia yang mapan dan mudah dipahami untuk dominasi demonis nyata dalam narasi Injil, tanpa mereduksinya menjadi penyakit atau metafora. Bentuk Yunani tunggal tidak dengan sendirinya menentukan jumlah roh yang merasuki orang itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “-Nya” mempertahankan kejelasan bahwa kedua acuan tersebut adalah Yesus, sedangkan “ia” menunjuk kepada orang yang telah dibebaskan.
