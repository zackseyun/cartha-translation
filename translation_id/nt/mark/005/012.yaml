review_pass:
  verdict: revise
  source_fidelity: '"Suruhlah kami masuk" shifts Πέμψον (''send'') toward an instruction that the speakers themselves should enter. The Greek expressly asks Jesus to send them into the pigs. The purpose clause should retain the subsequent entering without making Jesus merely command an action.'
  naturalness: The draft is generally clear and suitably modern, but "Suruhlah kami masuk ... supaya kami dapat masuk" is both semantically imprecise and needlessly repetitive in Indonesian. "Kirimlah kami ke dalam ... supaya kami dapat masuk ke dalamnya" is natural enough while retaining the deliberate two-stage formulation of the Greek.
  terminology: '"Memohon kepada-Nya" appropriately conveys παρεκάλεσαν, and "babi-babi" is an accurate modern rendering of χοίρους. Capitalized "-Nya" is an acceptable Bible-publication convention. No Indonesian footnote is needed: the English pig/swine alternative does not represent a meaningful Indonesian textual or lexical ambiguity.'
  issues:
  - severity: medium
    issue: Πέμψον is rendered "Suruhlah kami masuk."
    rationale: πέμπω means 'send,' not 'tell/command [us] to enter.' In this context Jesus is asked to send the demons into the pigs; "Kirimlah kami" preserves that request and its implication of his authority.
  revised_text: Mereka memohon kepada-Nya, “Kirimlah kami ke dalam babi-babi itu supaya kami dapat masuk ke dalamnya.”
