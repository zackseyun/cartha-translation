- from: Mereka memohon kepada-Nya, “Suruhlah kami masuk ke dalam babi-babi itu supaya kami dapat masuk ke dalamnya.”
  to: Mereka memohon kepada-Nya, “Kirimlah kami ke dalam babi-babi itu supaya kami dapat masuk ke dalamnya.”
  rationale: The revision replaces "Suruhlah" with "Kirimlah" to represent Πέμψον accurately. It retains the direct quotation, the urgent request, the plural pigs, and the Greek purpose clause without adding interpretive material.
