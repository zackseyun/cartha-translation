id: MRK.5.12
reference: Mark 5:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ παρεκάλεσαν ⸀αὐτὸν λέγοντες· Πέμψον ἡμᾶς εἰς τοὺς χοίρους, ἵνα εἰς αὐτοὺς εἰσέλθωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/012.yaml
  text: And they begged him[a], saying, “Send us into the pigs, so that we may enter them.”
translation:
  language: id
  text: Mereka memohon kepada-Nya, “Kirimlah kami ke dalam babi-babi itu supaya kami dapat masuk ke dalamnya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλεσαν
  choice: memohon
  rationale: Dalam konteks roh-roh najis yang berbicara kepada Yesus, kata ini menyatakan permintaan yang sungguh-sungguh. “Memohon” alami dan kuat tanpa berlebihan.
- source_word: αὐτὸν
  choice: kepada-Nya
  rationale: Kata ganti objek ini mengacu kepada Yesus. Bentuk hormat dengan huruf kapital mengikuti kelaziman penerbitan Alkitab bahasa Indonesia.
- source_word: λέγοντες
  choice: dinyatakan melalui awal kutipan langsung
  rationale: Partisip ini memperkenalkan isi permohonan. Dalam bahasa Indonesia, kutipan langsung setelah “memohon kepada-Nya” sudah menyampaikan fungsi “dengan berkata” secara alami tanpa ungkapan yang kaku.
- source_word: Πέμψον
  choice: Suruhlah
  rationale: Secara leksikal berarti “kirimlah/utuslah”, tetapi dalam konteks ini permintaan itu memohon tindakan atau izin dari pihak yang berkuasa. “Suruhlah” mempertahankan daya imperatif sekaligus terdengar alami ketika tujuan pengiriman adalah memasuki binatang.
- source_word: ἡμᾶς
  choice: kami
  rationale: Kata ganti orang pertama jamak sebagai objek, dengan Yesus tidak termasuk dalam kelompok pembicara.
- source_word: εἰς τοὺς χοίρους
  choice: masuk ke dalam babi-babi itu
  rationale: χοῖρος berarti babi. Bentuk jamak “babi-babi” mempertahankan bentuk sumber tanpa menambahkan kata “kawanan”, sedangkan “ke dalam” mempertahankan gambaran masuknya roh-roh itu ke tubuh binatang.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan dari permohonan secara wajar dalam bahasa Indonesia.
- source_word: εἰς αὐτοὺς εἰσέλθωμεν
  choice: kami dapat masuk ke dalamnya
  rationale: Mempertahankan makna εἰσέρχομαι, yaitu masuk, serta tujuan masuknya para pembicara ke dalam babi-babi tersebut. Akhiran “-nya” secara alami merujuk kembali kepada babi-babi itu.
theological_decisions:
- issue: Sifat permohonan para roh kepada Yesus
  choice: Para pembicara digambarkan memohon kepada Yesus agar Ia menyuruh mereka masuk ke dalam babi-babi itu.
  alternative: Menerjemahkannya sebagai permintaan perpindahan biasa tanpa kesan bahwa mereka berada di bawah kewenangan Yesus.
  rationale: Kata “memohon” dan bentuk perintah “Suruhlah kami” mempertahankan gambaran naratif bahwa mereka bergantung pada keputusan Yesus, tanpa menambahkan penjelasan doktrinal di luar teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kutipan dibuat alami dengan tidak menerjemahkan λέγοντες secara tersendiri. Tidak digunakan catatan kaki karena alternatif Inggris “swine” tidak menghasilkan perbedaan makna yang perlu dicatat dalam bahasa Indonesia; penanda catatan Inggris tampaknya juga tidak selaras dengan frasa yang diterangkannya.
