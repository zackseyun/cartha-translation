  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔρχονται πρὸς τὸν Ἰησοῦν, καὶ θεωροῦσιν τὸν δαιμονιζόμενον ⸀καθήμενον ἱματισμένον καὶ σωφρονοῦντα, τὸν ἐσχηκότα τὸν ⸀λεγιῶνα, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/015.yaml
  text: And they came to Jesus and saw the demon-possessed man sitting there[b][a], clothed and in his right mind—the one who had the legion—and they were afraid.
translation:
  language: id
  text: Mereka datang kepada Yesus dan melihat orang yang tadinya kerasukan setan itu duduk, berpakaian, dan berpikiran sehat—orang yang pernah dikuasai oleh Legion[a]—dan mereka takut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "legiun itu." Istilah ini dapat dipahami sebagai nama atau sebagai sebutan bagi kumpulan besar roh jahat.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχονται
  choice: Mereka datang
  rationale: Bentuk kini historis dialihkan ke bentuk lampau yang tersirat oleh alur narasi bahasa Indonesia; ungkapan ini alami tanpa mengubah urutan peristiwa.
- source_word: θεωροῦσιν
  choice: melihat
  rationale: Bentuk kini historis kedua diterjemahkan secara naratif sebagai 'melihat'; kata ini cukup menyampaikan pengamatan langsung tanpa nuansa klinis.
- source_word: δαιμονιζόμενον
  choice: orang yang tadinya kerasukan setan itu
  rationale: Partisip substantival menunjuk kepada orang yang sudah dikenal dari konteks. 'Kerasukan setan' mempertahankan klaim narasi mengenai kuasa roh jahat, sedangkan 'tadinya' memperjelas bahwa keadaan tersebut telah berubah.
- source_word: καθήμενον
  choice: sedang duduk
  rationale: Menggambarkan keadaan yang mereka saksikan secara langsung. Tidak ditambahkan 'di sana' karena unsur itu tidak dinyatakan dalam teks Yunani.
- source_word: ἱματισμένον
  choice: sudah berpakaian
  rationale: Menyampaikan keadaan pulih yang tampak dan kontras dengan keadaan sebelumnya; 'sudah' secara alami mencerminkan hasil yang sedang berlaku.
- source_word: σωφρονοῦντα
  choice: berpikiran sehat
  rationale: Mencakup kejernihan pikiran dan penguasaan diri tanpa memakai istilah klinis atau ungkapan yang merendahkan.
- source_word: ἐσχηκότα
  choice: yang sebelumnya dikuasai oleh
  rationale: Partisip perfek mengidentifikasi orang itu berdasarkan keadaan terdahulu yang tetap relevan bagi pengenalannya. 'Sebelumnya' menghindari kesan bahwa Legion masih menguasainya saat itu.
- source_word: λεγιῶνα
  choice: Legion
  rationale: Dalam konteks dekat, istilah ini menggemakan sebutan yang diberikan roh-roh itu sebelumnya. Kapitalisasi memperlakukannya sebagai sebutan atau nama kolektif, sementara catatan kaki mempertahankan kemungkinan pembacaan deskriptif.
- source_word: ἐφοβήθησαν
  choice: mereka menjadi takut
  rationale: Ungkapan ini menangkap kemungkinan nuansa ingresif aoristus, yakni timbulnya rasa takut sebagai reaksi terhadap apa yang mereka lihat.
theological_decisions:
- issue: Gambaran kerasukan roh jahat
  choice: orang yang tadinya kerasukan setan itu
  alternative: orang yang dirasuki setan itu
  rationale: Terjemahan mempertahankan kerasukan sebagai kenyataan dalam narasi, bukan mereduksinya menjadi penyakit, sambil menandai bahwa orang tersebut kini telah dipulihkan.
- issue: λεγιών sebagai nama atau sebutan deskriptif
  choice: Legion
  alternative: legiun itu
  rationale: Konteks mengizinkan istilah ini dipahami sebagai nama atau sebutan kolektif roh-roh jahat, tetapi bentuk Yunani dengan artikel juga dapat dibaca secara deskriptif. Teks utama memakai bentuk nama yang alami dalam bahasa Indonesia dan catatan kaki mempertahankan alternatifnya.
- issue: Hubungan keadaan lampau dengan keadaan yang terlihat sekarang
  choice: yang sebelumnya dikuasai oleh Legion
  alternative: yang pernah memiliki Legion
  rationale: Secara harfiah ἔχω berarti 'memiliki', tetapi dalam konteks kerasukan ungkapan harfiah itu berpotensi menyesatkan dalam bahasa Indonesia. 'Dikuasai oleh' menyatakan relasi yang dimaksud tanpa menganggapnya masih berlangsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Susunan partisip Yunani diungkapkan sebagai rangkaian keadaan yang terlihat, dan kontras antara kerasukan dahulu dengan pemulihan sekarang dibuat jelas tanpa menambahkan penjelasan doktrinal.
