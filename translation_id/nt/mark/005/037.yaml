  text: καὶ οὐκ ἀφῆκεν οὐδένα ⸂μετ’ αὐτοῦ⸃ συνακολουθῆσαι εἰ μὴ ⸀τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/037.yaml
  text: And he allowed no one to accompany him except Peter and James and John, the brother of James.
translation:
  language: id
  text: Ia tidak mengizinkan seorang pun ikut bersama-Nya, kecuali Petrus, Yakobus, dan Yohanes, saudara Yakobus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: mengizinkan
  rationale: Dalam konstruksi dengan infinitif, kata ini berarti memberi izin atau membiarkan. “Mengizinkan” alami dalam bahasa Indonesia modern dan menyatakan bahwa Yesus tidak memperbolehkan orang lain ikut.
- source_word: οὐδένα
  choice: seorang pun
  rationale: 'Bersama penyangkalan “tidak”, ungkapan ini menyatakan pengecualian menyeluruh dengan wajar: “tidak ... seorang pun”.'
- source_word: μετ’ αὐτοῦ συνακολουθῆσαι
  choice: ikut bersama-Nya
  rationale: Kata kerja majemuk dan frasa preposisionalnya menyampaikan tindakan mengikuti atau pergi menyertai Yesus. “Ikut bersama-Nya” jelas, alami, dan mempertahankan unsur kebersamaan.
- source_word: εἰ μὴ
  choice: kecuali
  rationale: Dalam konteks ini ungkapan tersebut memperkenalkan pengecualian, bukan syarat.
- source_word: τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Petrus, Yakobus, dan Yohanes
  rationale: Nama-nama memakai bentuk Indonesia yang lazim. Daftar dengan koma dan “dan” terakhir lebih alami dalam bahasa Indonesia daripada mengulang “dan”.
- source_word: τὸν ἀδελφὸν Ἰακώβου
  choice: saudara Yakobus
  rationale: Frasa aposisional ini mengidentifikasi Yohanes sebagai saudara Yakobus. Bentuk ini mempertahankan makna tanpa menentukan kakak atau adik, yang tidak dinyatakan oleh teks Yunani.
