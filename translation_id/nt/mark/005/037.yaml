  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pronomina “Ia” dan akhiran “-Nya” merujuk kepada Yesus sesuai kebiasaan penerbitan Alkitab Indonesia. Tidak ada penanda catatan kaki karena tidak diperlukan.
