  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ κατεγέλων αὐτοῦ. ⸀αὐτὸς δὲ ἐκβαλὼν πάντας παραλαμβάνει τὸν πατέρα τοῦ παιδίου καὶ τὴν μητέρα καὶ τοὺς μετ’ αὐτοῦ, καὶ εἰσπορεύεται ὅπου ἦν τὸ ⸀παιδίον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/040.yaml
  text: And they were laughing at him[a]. But he, after putting them all outside, takes the child's father and mother and those with him[b], and goes in where the child was.
translation:
  language: id
  text: Mereka menertawakan Dia[a]. Tetapi, setelah menyuruh semua orang itu keluar, Ia membawa serta ayah dan ibu anak itu, serta orang-orang yang bersama-Nya[b], lalu masuk ke tempat anak itu berada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengejek Dia.” Kata kerja Yunani ini dapat menunjuk pada tawa yang bernada mengejek.
    reason: lexical_alternative
  - marker: b
    text: Yaitu, murid-murid yang menyertai-Nya.
    reason: cross_reference
lexical_decisions:
- source_word: κατεγέλων
  choice: menertawakan
  rationale: Kata kerja ini menyatakan tertawa yang bernada merendahkan atau mengejek. Bentuk imperfek menggambarkan tindakan yang sedang berlangsung; dalam bahasa Indonesia, aspek itu dapat dipahami dari alur tanpa tambahan yang terasa berat.
- source_word: ἐκβαλὼν πάντας
  choice: setelah menyuruh mereka semua keluar
  rationale: Partisip ini menyatakan tindakan yang mendahului tindakan utama. Pilihan ini alami dalam bahasa Indonesia dan menyampaikan bahwa semua orang lain dikeluarkan tanpa menimbulkan kesan teknis pengusiran roh jahat.
- source_word: παραλαμβάνει
  choice: mengajak
  rationale: Dalam konteks ini, kata tersebut berarti membawa orang-orang tertentu bersama-Nya. 'Mengajak' terdengar alami dan tidak menyiratkan bahwa mereka dibawa secara paksa.
- source_word: παιδίου / παιδίον
  choice: anak
  rationale: παιδίον berarti anak. Walaupun konteks sebelumnya menunjukkan bahwa anak itu perempuan, terjemahan ini mempertahankan ungkapan netral yang dipakai dalam ayat ini.
- source_word: τοὺς μετ’ αὐτοῦ
  choice: orang-orang yang bersama-Nya
  rationale: Terjemahan ini mempertahankan keluasan ungkapan Yunani; identitas mereka sebagai murid-murid yang menyertai Yesus dijelaskan dalam catatan kaki.
- source_word: εἰσπορεύεται
  choice: masuk
  rationale: Kata ini menggambarkan gerakan masuk ke tempat anak itu berada. Bahasa Indonesia tidak perlu menandai kala kini historis secara khusus untuk mempertahankan kelancaran narasi.
- source_word: ὅπου ἦν τὸ παιδίον
  choice: ke tempat anak itu berada
  rationale: Pilihan ini mempertahankan pernyataan lokasi yang sederhana dan tidak menambahkan bahwa anak itu sedang berbaring, yang tidak dinyatakan secara eksplisit dalam klausa ini.
theological_decisions:
- issue: Kala kini historis dalam narasi
  choice: 'Menerjemahkan παραλαμβάνει dan εἰσπορεύεται dengan bentuk naratif Indonesia yang tidak bertanda kala: ''mengajak'' dan ''masuk'''
  alternative: Menambahkan penanda aspek atau waktu untuk meniru kala kini historis secara eksplisit
  rationale: Bahasa Indonesia tidak menginfleksikan kata kerja menurut kala. Bentuk tanpa penanda waktu tetap alami, hidup, dan tidak mengubah urutan tindakan dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Struktur kalimat mempertahankan urutan tindakan Yunani tanpa membuat narasinya kaku.
