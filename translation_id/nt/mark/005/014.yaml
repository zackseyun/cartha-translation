  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂Καὶ οἱ⸃ βόσκοντες ⸀αὐτοὺς ἔφυγον καὶ ⸀ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς· καὶ ⸀ἦλθον ἰδεῖν τί ἐστιν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/014.yaml
  text: And those who were tending them fled and reported it in the city and in the countryside[a], and they came to see what had happened.
translation:
  language: id
  text: Para penjaga babi itu melarikan diri dan memberitakan kejadian itu di kota dan di daerah pedesaan[a]. Lalu orang-orang datang untuk melihat apa yang telah terjadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di ladang-ladang.” Dalam konteks ini, kata Yunaninya kemungkinan menunjuk pada daerah pedesaan di sekitar kota.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βόσκοντες
  choice: para penjaga babi
  rationale: Partisip ini menunjuk kepada orang-orang yang sedang mengurus kawanan babi. Penyebutan “babi” memperjelas acuan pronomina αὐτούς secara alami berdasarkan konteks ayat sebelumnya.
- source_word: ἔφυγον
  choice: melarikan diri
  rationale: Ungkapan ini menyampaikan tindakan pergi dengan segera karena takut atau gentar, sesuai daya naratif bentuk aoris.
- source_word: ἀπήγγειλαν
  choice: memberitakan kejadian itu
  rationale: Kata kerja ini berarti menyampaikan atau melaporkan kabar. “Kejadian itu” membuat objek yang tersirat dapat dipahami secara alami dalam bahasa Indonesia.
- source_word: εἰς τὴν πόλιν
  choice: di kota
  rationale: Walaupun εἰς secara harfiah dapat berarti “ke/ke dalam”, bersama kata kerja pelaporan ungkapan ini secara idiomatis menunjukkan tempat tersebarnya berita.
- source_word: εἰς τοὺς ἀγρούς
  choice: di daerah pedesaan
  rationale: Dalam pertentangannya dengan “kota”, bentuk jamak ἀγρούς kemungkinan menunjuk pada kawasan luar kota atau pedesaan, bukan hanya petak-petak ladang.
- source_word: ἦλθον
  choice: orang-orang datang
  rationale: Subjek jamak dalam bahasa Yunani tidak dinyatakan. “Orang-orang” memperjelas bahwa yang datang ialah para pendengar berita dari kota dan pedesaan tanpa menentukan kelompok secara lebih sempit.
- source_word: ἰδεῖν
  choice: untuk melihat
  rationale: Infinitif ini menyatakan tujuan kedatangan mereka dan diterjemahkan secara langsung serta alami.
- source_word: τί ἐστιν τὸ γεγονός
  choice: apa yang telah terjadi
  rationale: Ungkapan ini menanyakan peristiwa yang sudah berlangsung; bentuk perfektumnya tetap tercermin melalui “telah terjadi”.
