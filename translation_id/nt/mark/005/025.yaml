  text: And there was a woman who had been suffering from a flow of blood for twelve years,[a]
translation:
  language: id
  text: Ada seorang perempuan yang mengalami pendarahan selama dua belas tahun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "mengalami keluarnya darah" atau "terus mengeluarkan darah."
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ada
  rationale: Dalam konstruksi yang berlanjut ke ayat berikutnya, καί memperkenalkan tokoh baru. Bahasa Indonesia alami dapat memakai 'Ada' tanpa menambahkan urutan waktu yang tidak dinyatakan.
- source_word: γυνὴ
  choice: seorang perempuan
  rationale: Nomina tanpa artikel ini memperkenalkan peserta baru; 'seorang perempuan' merupakan padanan alami dalam bahasa Indonesia.
- source_word: οὖσα
  choice: yang telah mengalami
  rationale: Partisip ini menyatakan keadaan yang berlangsung, sedangkan keterangan dua belas tahun menunjukkan bahwa keadaan itu telah lama dialami. Pilihan ini alami dan tidak memasukkan unsur penderitaan yang tidak dinyatakan langsung oleh kata tersebut.
- source_word: ἐν ῥύσει αἵματος
  choice: mengalami pendarahan
  rationale: Frasa ini menyatakan keadaan berupa aliran atau keluarnya darah. 'Mengalami pendarahan' jelas dan idiomatis dalam bahasa Indonesia modern.
- source_word: ῥύσει
  choice: pendarahan
  rationale: ῥύσις berarti aliran atau keluarnya cairan; dalam kaitannya dengan darah, 'pendarahan' menyampaikan kondisi medis secara ringkas dan alami.
- source_word: αἵματος
  choice: darah (tercakup dalam 'pendarahan')
  rationale: Makna αἷμα dipertahankan secara leksikal dalam bentukan 'pendarahan'.
- source_word: δώδεκα ἔτη
  choice: selama dua belas tahun
  rationale: Akusatif ini menyatakan rentang waktu; 'selama' menandai durasi secara wajar dalam bahasa Indonesia.
theological_decisions: []
