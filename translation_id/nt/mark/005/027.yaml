  text: ⸀ἀκούσασα περὶ τοῦ Ἰησοῦ, ἐλθοῦσα ἐν τῷ ὄχλῳ ὄπισθεν ἥψατο τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/027.yaml
  text: having heard about Jesus[a], she came up behind him in the crowd and touched his garment.
translation:
  language: id
  text: Setelah mendengar tentang Yesus, perempuan itu mendekati-Nya dari belakang di tengah kerumunan, lalu menyentuh pakaian-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jubah-Nya” atau “pakaian luar-Nya.” Kata Yunani ἱμάτιον merujuk secara luas pada pakaian, sering kali pakaian luar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσασα
  choice: Setelah mendengar
  rationale: Partisip aoristus feminin tunggal menunjukkan tindakan yang mendahului tindakan utama; klausa waktu ini alami dalam bahasa Indonesia dan mempertahankan urutan tersebut.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: tentang Yesus
  rationale: περί dengan genitif di sini menyatakan hal atau berita yang didengar mengenai Yesus.
- source_word: ἐλθοῦσα
  choice: mendekati-Nya
  rationale: Partisip aoristus ini menggambarkan gerakan perempuan itu menuju Yesus; 'mendekati-Nya' menyampaikan arah yang tersirat secara alami.
- source_word: ἐν τῷ ὄχλῳ
  choice: di tengah kerumunan
  rationale: Frasa ini menunjukkan lokasi atau keadaan perempuan itu yang berada di antara orang banyak.
- source_word: ὄπισθεν
  choice: dari belakang
  rationale: Adverbia ini menunjukkan bahwa perempuan itu datang dari arah belakang Yesus.
- source_word: ἥψατο
  choice: menyentuh
  rationale: Bentuk aoristus medium ἅπτω dalam konteks ini berarti menyentuh atau menjamah, tanpa harus menyiratkan bahwa ia menggenggam erat.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: pakaian-Nya
  rationale: ἱμάτιον dapat merujuk secara luas pada pakaian, khususnya pakaian luar; 'pakaian' alami dan tidak mempersempit acuannya menjadi jenis tertentu.
