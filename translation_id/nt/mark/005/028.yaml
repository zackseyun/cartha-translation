  yaml_path: translation/nt/mark/005/028.yaml
  text: For she was saying[a], "If I touch even his garments, I will be healed."
translation:
  language: id
  text: Sebab perempuan itu terus berkata, “Jika aku hanya menyentuh pakaian-Nya saja, aku akan sembuh[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “aku akan diselamatkan.” Kata kerja Yunani ini dapat berarti “diselamatkan,” “disembuhkan,” atau “dipulihkan”; dalam konteks ini yang terutama dimaksud ialah kesembuhan jasmani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: terus berkata
  rationale: Bentuk imperfek menggambarkan ujaran atau pikiran yang berlangsung atau berulang pada waktu lampau. Ungkapan ini mempertahankan aspek tersebut tanpa menentukan apakah ia mengatakannya dengan suara keras atau dalam hati.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan yang menjelaskan tindakan dalam ayat sebelumnya.
- source_word: ὅτι
  choice: ditampilkan sebagai kutipan langsung
  rationale: Kata ini memperkenalkan isi perkataan perempuan itu; kutipan langsung alami dalam bahasa Indonesia.
- source_word: Ἐὰν
  choice: Asalkan
  rationale: Memperkenalkan syarat yang menurut perempuan itu cukup untuk menghasilkan kesembuhan; 'asalkan' secara alami menyampaikan kondisi tersebut.
- source_word: ἅψωμαι
  choice: aku menyentuh
  rationale: Bentuk tengah dari ἅπτω lazim berarti 'menyentuh' dalam konteks ini.
- source_word: κἂν
  choice: asalkan ... pakaian
  rationale: Gabungan καὶ ἐάν memberi penekanan minimal, yakni bahwa menyentuh pakaiannya saja sudah cukup. Dalam bahasa Indonesia, nuansa 'bahkan hanya' disampaikan secara alami oleh konstruksi 'asalkan ... pakaian' tanpa menambahkan objek lain.
- source_word: τῶν ἱματίων αὐτοῦ
  choice: pakaiannya
  rationale: ἱμάτια berbentuk jamak dan merujuk secara umum pada pakaian. Bahasa Indonesia lazim memakai bentuk kolektif tunggal 'pakaian' dan enklitik -nya secara alami merujuk kepada Yesus.
- source_word: σωθήσομαι
  choice: aku akan sembuh
  rationale: Dalam konteks langsung tentang pendarahan, verba σῴζω menunjuk pada pemulihan jasmani. Kemungkinan makna yang lebih luas, 'diselamatkan', dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna σωθήσομαι dalam kisah penyembuhan
  choice: aku akan sembuh
  alternative: aku akan diselamatkan; aku akan menjadi sehat kembali
  rationale: Konteks langsung mendukung kesembuhan fisik, tetapi verba Yunani yang sama juga dapat berarti 'diselamatkan'. Catatan kaki mempertahankan tumpang tindih makna dan ketegangan teologis itu tanpa membuat teks utama terasa tidak alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Terus berkata' mempertahankan aspek imperfek; 'pakaiannya' lebih alami bagi pembaca umum daripada 'jubahnya' yang terlalu spesifik atau 'pakaian-pakaiannya' yang kaku.
