id: MRK.5.35
reference: Mark 5:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχονται ἀπὸ τοῦ ἀρχισυναγώγου λέγοντες ὅτι Ἡ θυγάτηρ σου ἀπέθανεν· τί ἔτι σκύλλεις τὸν διδάσκαλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/035.yaml
  text: While he was still speaking[a], people came from the synagogue leader's house, saying, “Your daughter has died[b]. Why do you still trouble the Teacher?”
translation:
  language: id
  text: Ketika Dia masih berbicara, beberapa orang datang dari rumah pemimpin rumah ibadat itu[a] dan berkata, “Anak perempuanmu sudah meninggal. Mengapa masih menyusahkan Sang Guru[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari pemimpin rumah ibadat itu”; dalam konteks ini maksudnya adalah dari rumah atau rumah tangganya.'
    reason: clarification
  - marker: b
    text: 'Atau: “merepotkan Guru itu” atau “mengganggu Guru itu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Ketika Dia masih berbicara
  rationale: Konstruksi genitif absolut menyatakan tindakan yang sedang berlangsung pada saat peristiwa berikutnya terjadi. “Ketika ... masih berbicara” alami dalam bahasa Indonesia dan mempertahankan daya temporal ἔτι.
- source_word: ἔρχονται
  choice: beberapa orang datang
  rationale: Bentuk kini historis dialihkan menjadi bentuk naratif Indonesia “datang”. Subjek jamak tersirat dalam verba dan participel λέγοντες; “beberapa orang” menyatakannya secara wajar tanpa menentukan identitas mereka.
- source_word: ἀπὸ τοῦ ἀρχισυναγώγου
  choice: dari rumah pemimpin rumah ibadat itu
  rationale: Secara harfiah frasa ini berbunyi “dari pemimpin rumah ibadat”, tetapi dalam konteks Yairus sedang bersama Yesus. Frasa tersebut secara idiomatis menunjuk kepada rumah atau lingkungan rumah tangganya; “rumah” ditambahkan agar maknanya jelas, dengan catatan kaki yang mempertahankan bentuk harfiahnya.
- source_word: λέγοντες ὅτι
  choice: dan berkata, “
  rationale: Participel ini memperkenalkan perkataan langsung. “Dan berkata” menghasilkan narasi Indonesia yang lancar.
- source_word: Ἡ θυγάτηρ σου
  choice: Anak perempuanmu
  rationale: Padanan langsung yang mempertahankan sapaan orang kedua tunggal.
- source_word: ἀπέθανεν
  choice: sudah meninggal
  rationale: Aoristus menyatakan kematian sebagai peristiwa yang telah terjadi dan kini menentukan keadaan. “Sudah meninggal” alami, jelas, dan sesuai dengan suasana khidmat.
- source_word: τί ἔτι
  choice: Mengapa masih
  rationale: Mempertahankan pertanyaan mengenai alasan untuk melanjutkan tindakan tersebut setelah kematian anak itu diberitakan.
- source_word: σκύλλεις
  choice: menyusahkan
  rationale: Dalam konteks ini σκύλλω berarti merepotkan atau mengganggu seseorang dengan terus meminta bantuannya. “Menyusahkan” sesuai dengan nada serius dan tidak sekeras “mengusik” atau “mengganggu” dalam konteks tertentu.
- source_word: τὸν διδάσκαλον
  choice: Sang Guru
  rationale: διδάσκαλος berarti guru atau pengajar. “Sang Guru” mempertahankan gelar tertentu yang dipakai para pembicara tanpa menggantinya dengan nama Yesus atau memasukkan gagasan “tuan” yang tidak dinyatakan oleh kata itu.
theological_decisions:
- issue: Rujukan gelar τὸν διδάσκαλον
  choice: Sang Guru
  alternative: Yesus; Sang Tuan
  rationale: Teks Yunani memakai gelar, bukan nama. Terjemahan mempertahankan sudut pandang para pembicara dan tidak memperluasnya menjadi pengakuan kristologis yang lebih penuh daripada yang dinyatakan teks.
- issue: Implikasi perkataan para utusan setelah kematian anak itu
  choice: Mempertahankan pertanyaan “Mengapa masih menyusahkan Sang Guru?” tanpa menjelaskan anggapan mereka
  alternative: Menambahkan bahwa pertolongan Yesus dianggap sudah tidak berguna
  rationale: Ucapan itu menyiratkan bahwa para utusan menganggap kematian telah mengakhiri kemungkinan pertolongan, tetapi teks tidak menyatakannya secara eksplisit. Ketegangan naratif dan teologis tersebut dibiarkan tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan khidmat. “Rumah ibadat” dipilih sebagai istilah yang mudah dipahami untuk συναγωγή dalam gelar ἀρχισυνάγωγος. Pronomina “Dia” mempertahankan rujukan Yunani tanpa mengganti gelar atau nama dalam klausa pembuka. Kapitalisasi “Sang Guru” menandai gelar tertentu dalam konteks, bukan menambahkan klaim doktrinal.
