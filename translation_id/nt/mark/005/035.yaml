  verdict: approve
  source_fidelity: Terjemahan dengan setia menyampaikan genitif absolut Ἔτι αὐτοῦ λαλοῦντος (“Ketika Dia masih berbicara”), kini historis ἔρχονται dalam bentuk naratif Indonesia (“datang”), subjek jamak yang tidak diperinci (“beberapa orang”), serta ucapan langsung para utusan. “Dari rumah pemimpin rumah ibadat itu” adalah penjelasan kontekstual yang aman bagi ἀπὸ τοῦ ἀρχισυναγώγου, sementara catatan kaki mempertahankan bentuk lebih harfiah. “Sudah meninggal” dan pertanyaan “Mengapa masih menyusahkan Sang Guru?” menyampaikan ἀπέθανεν dan τί ἔτι σκύλλεις dengan baik.
  naturalness: Bahasa Indonesia baku, lancar, dan sesuai register naratif yang khidmat. “Pemimpin rumah ibadat” jelas bagi pembaca modern, dan bentuk eliptis subjek pada “Mengapa masih menyusahkan ...?” tetap secara wajar merujuk kepada Yairus melalui akhiran -mu pada kalimat sebelumnya.
  terminology: “Rumah ibadat” untuk συναγωγή dan “Sang Guru” untuk τὸν διδάσκαλον konsisten, jelas, serta tidak menambahkan penafsiran kristologis. Pilihan “menyusahkan” tepat untuk σκύλλω dalam konteks permintaan yang dipandang tidak perlu lagi.
