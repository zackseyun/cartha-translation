base_translation:
  language: en
  yaml_path: translation/nt/mark/005/043.yaml
  text: And he strictly ordered them that no one should know this[c][b][a], and he said that she should be given something to eat.
translation:
  language: id
  text: Lalu Yesus dengan tegas memerintahkan mereka agar tidak seorang pun mengetahui hal ini,[a] dan Ia berkata agar anak itu diberi sesuatu untuk dimakan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berulang kali memberi mereka perintah keras” atau “dengan sungguh-sungguh memperingatkan mereka.” Kata Yunani yang secara harfiah berarti “banyak” memperkuat perintah tersebut.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “supaya diberikan kepadanya untuk makan”; maksudnya, supaya ia diberi sesuatu untuk dimakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο αὐτοῖς πολλὰ
  choice: dengan tegas memerintahkan mereka
  rationale: Kata kerja διαστέλλομαι menyatakan perintah atau pesan yang kuat, sedangkan πολλὰ mempertegas daya perintah itu. Ungkapan ini alami dalam bahasa Indonesia dan tidak memaksakan makna harfiah 'banyak hal'.
- source_word: ἵνα μηδεὶς γνοῖ τοῦτο
  choice: agar tidak seorang pun mengetahui hal ini
  rationale: ἵνα dengan bentuk subjungtif menyatakan maksud atau hasil yang dikehendaki; terjemahan ini mempertahankan cakupan larangan tanpa menambahkan penjelasan teologis.
- source_word: εἶπεν
  choice: Ia mengatakan
  rationale: Pilihan ini mengikuti arti dasar λέγω secara langsung, sementara konteks dan konstruksi berikutnya menyampaikan daya instruktifnya.
- source_word: δοθῆναι αὐτῇ φαγεῖν
  choice: supaya anak itu diberi sesuatu untuk dimakan
  rationale: Bentuk pasif δοθῆναι dipertahankan melalui 'diberi'. 'Sesuatu' merupakan pelengkap tersirat yang diperlukan agar idiomnya wajar dalam bahasa Indonesia, dan αὐτῇ diperjelas sebagai 'anak itu' sesuai rujukan dalam konteks.
theological_decisions:
- issue: Motif kerahasiaan Mesianik dan cakupan perintah Yesus
  choice: Menyatakan secara lugas bahwa Yesus melarang peristiwa ini diketahui orang lain.
  alternative: Menjelaskan perintah tersebut sebagai bagian dari motif kerahasiaan Mesianik atau membatasinya secara eksplisit hanya kepada keluarga dan para saksi yang hadir.
  rationale: Ayat hanya menyatakan perintah kuat agar tidak seorang pun mengetahui hal ini. Terjemahan mempertahankan ketegangan naratif tersebut tanpa memasukkan penafsiran yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Yesus' dipakai untuk memperjelas subjek pada awal ayat yang berdiri sendiri; 'anak itu' memperjelas rujukan kata ganti feminin αὐτῇ berdasarkan konteks. Kapitalisasi 'Ia' mengikuti kelaziman penulisan Alkitab bahasa Indonesia tanpa menambahkan isi teologis.
