id: MRK.5.30
reference: Mark 5:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ὁ Ἰησοῦς ἐπιγνοὺς ἐν ἑαυτῷ τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν ἐπιστραφεὶς ἐν τῷ ὄχλῳ ἔλεγεν· Τίς μου ἥψατο τῶν ἱματίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/030.yaml
  text: And immediately Jesus[a], perceiving in himself that power had gone out from him, turned around in the crowd and said, “Who touched my garments?”
translation:
  language: id
  text: Yesus segera menyadari dalam diri-Nya bahwa kuasa telah keluar dari-Nya. Ia berbalik di tengah orang banyak itu dan berkata, “Siapa yang menyentuh pakaian-Ku?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: segera
  rationale: Mempertahankan penanda waktu khas Markus yang memberi kesan gerak narasi yang cepat.
- source_word: ἐπιγνοὺς ἐν ἑαυτῷ
  choice: menyadari dalam diri-Nya
  rationale: Mengungkapkan kesadaran batin Yesus secara dekat dengan teks Yunani dan tetap wajar dalam bahasa Indonesia.
- source_word: δύναμιν
  choice: kuasa
  rationale: Merujuk pada daya efektif yang keluar dari Yesus dalam peristiwa penyembuhan tanpa menambahkan penjelasan yang tidak dinyatakan teks.
- source_word: ἐξελθοῦσαν
  choice: telah keluar
  rationale: Bentuk partisip menunjukkan bahwa keluarnya kuasa telah terjadi ketika Yesus menyadarinya.
- source_word: ἐπιστραφεὶς ἐν τῷ ὄχλῳ
  choice: berbalik di tengah orang banyak itu
  rationale: Menggambarkan gerakan fisik Yesus dalam kerumunan dengan bahasa Indonesia yang jelas dan alami.
- source_word: ἔλεγεν
  choice: berkata
  rationale: Mempertahankan verba ujaran umum dalam teks; bentuk pertanyaan sudah tampak dari kalimat langsung.
- source_word: ἥψατο τῶν ἱματίων
  choice: menyentuh pakaian-Ku
  rationale: ἅπτομαι berarti menyentuh dalam konteks ini, sedangkan bentuk jamak ἱμάτια menunjuk secara umum pada pakaian, bukan hanya satu jubah tertentu.
theological_decisions:
- issue: Kuasa keluar dari Yesus
  choice: Mempertahankan pernyataan langsung bahwa kuasa telah keluar dari-Nya
  alternative: Menjelaskannya sebagai ‘kuasa penyembuhan’ atau sekadar perasaan subjektif Yesus
  rationale: Teks menyatakan keluarnya kuasa sebagai kenyataan dalam narasi, tetapi tidak menjelaskan mekanismenya; terjemahan tidak mempersempit ataupun merasionalisasikannya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. ‘Orang banyak’ dipilih sebagai padanan alami untuk ὄχλος, sedangkan ‘pakaian-Ku’ lebih mudah dipahami pembaca masa kini daripada ‘pakaian-pakaian-Ku’ atau ‘jubah-Ku’.
