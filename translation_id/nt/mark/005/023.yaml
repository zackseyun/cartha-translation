  text: καὶ ⸀παρακαλεῖ αὐτὸν πολλὰ λέγων ὅτι Τὸ θυγάτριόν μου ἐσχάτως ἔχει, ἵνα ἐλθὼν ἐπιθῇς ⸂τὰς χεῖρας αὐτῇ⸃ ⸀ἵνα σωθῇ καὶ ⸀ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/023.yaml
  text: And he begged him earnestly[a], saying, “My little daughter is at the point of death. Come and lay your hands on her, so that she may be healed and live.”
translation:
  language: id
  text: Ia memohon dengan sangat kepada Yesus, katanya, “Anak perempuanku yang masih kecil sudah hampir mati. Datanglah dan letakkanlah kedua tangan-Mu ke atasnya supaya ia diselamatkan[a] dan hidup.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “disembuhkan” atau “dipulihkan.” Kata kerja Yunani ini dapat berarti menyelamatkan, menolong, atau menyembuhkan; dalam konteks ini yang terutama dimaksud adalah kesembuhan jasmani.
    reason: alternative_reading
lexical_decisions:
- source_word: παρακαλεῖ αὐτὸν πολλὰ
  choice: memohon dengan sangat kepada Yesus
  rationale: Dalam konteks permohonan mendesak ini, παρακαλεῖ menyatakan permohonan sungguh-sungguh, sedangkan πολλὰ memperkuat intensitasnya. Nama “Yesus” dipakai sebagai pengganti pronomina agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: θυγάτριόν μου
  choice: anak perempuanku yang masih kecil
  rationale: Ungkapan ini mempertahankan arti θυγάτριον sebagai anak perempuan sekaligus nuansa usia muda atau kasih sayang yang terkandung dalam bentuk diminutifnya.
- source_word: ἐσχάτως ἔχει
  choice: sudah hampir mati
  rationale: Idiom Yunani ini menunjukkan keadaan yang sangat gawat dan mendekati kematian. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan urgensinya.
- source_word: ἐλθὼν ἐπιθῇς τὰς χεῖρας αὐτῇ
  choice: Datanglah dan letakkanlah tangan-Mu ke atasnya
  rationale: Partisip aoris ἐλθών secara idiomatis menjadi ajakan atau permohonan “Datanglah,” disusul tindakan menumpangkan kedua tangan. Bentuk “tangan-Mu” tetap dapat mewakili bentuk jamak Yunani secara alami karena kata “tangan” tidak perlu diulang atau dijamakkan dalam bahasa Indonesia.
- source_word: σωθῇ
  choice: diselamatkan
  rationale: σῴζω dapat berarti menyelamatkan, menolong, atau menyembuhkan. “Diselamatkan” mempertahankan keluasan leksikalnya, sementara konteks dan catatan kaki menjelaskan makna kesembuhan jasmani yang sangat mungkin di sini.
- source_word: ζήσῃ
  choice: hidup
  rationale: Kata kerja ini secara langsung berarti “hidup” dan menyatakan hasil yang diharapkan dari penyelamatan atau penyembuhan anak itu.
theological_decisions:
- issue: Makna σωθῇ dalam konteks penyembuhan
  choice: diselamatkan
  alternative: disembuhkan; dipulihkan
  rationale: Konteks langsung menunjuk pada kesembuhan jasmani, tetapi kata Yunani memiliki cakupan lebih luas daripada “sembuh.” Teks utama mempertahankan keluasan dan ketegangan leksikal itu, sedangkan catatan kaki mencantumkan padanan kontekstual yang mungkin.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk sapaan ilahi dalam dialog ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab bahasa Indonesia. Susunan kalimat mempertahankan desakan permohonan tanpa terdengar kaku.
