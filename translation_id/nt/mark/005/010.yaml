  yaml_path: translation/nt/mark/005/010.yaml
  text: And he begged him repeatedly not to send them out of the region[a].
translation:
  language: id
  text: Ia berkali-kali memohon kepada Yesus agar Yesus tidak mengirim mereka ke luar dari daerah itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia memohon dengan sangat kepada-Nya supaya Ia tidak menyuruh mereka pergi ke luar daerah itu.”
    reason: Alternatif leksikal untuk πολλὰ (‘dengan sangat’), αὐτόν (‘kepada-Nya’), dan ἀποστείλῃ (‘menyuruh ... pergi’); bentuk tunggal pembicara dan bentuk jamak ‘mereka’ tetap dipertahankan.
lexical_decisions:
- source_word: παρεκάλει
  choice: memohon
  rationale: Dalam konteks pengusiran roh jahat, kata ini menyatakan permohonan yang sungguh-sungguh. 'Memohon' alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: πολλὰ
  choice: berkali-kali
  rationale: 'Sebagai akusatif adverbial, kata ini menguatkan tindakan memohon dan paling wajar dipahami secara iteratif: permohonan itu disampaikan berulang kali.'
- source_word: ἵνα μὴ
  choice: agar tidak
  rationale: Konstruksi ini menyatakan isi atau tujuan permohonan secara alami tanpa menghilangkan unsur negatifnya.
- source_word: αὐτὰ
  choice: mereka
  rationale: Pronomina netral jamak ini merujuk kepada roh-roh jahat. Bahasa Indonesia sewajarnya memakai 'mereka' bagi pelaku-pelaku personal tersebut dan tetap mempertahankan bentuk jamaknya.
- source_word: ἀποστείλῃ
  choice: mengusir
  rationale: Secara harfiah berarti 'menyuruh pergi/mengirim keluar'. Dalam konteks eksorsisme, 'mengusir' menyampaikan tindakan membuat roh-roh itu pergi dengan jelas dan alami, meskipun unsur daya paksa berasal dari konteks.
- source_word: ἔξω τῆς χώρας
  choice: dari wilayah itu
  rationale: χώρα menunjuk pada daerah atau distrik setempat, bukan negara dalam pengertian modern. 'Wilayah itu' jelas dan alami.
- source_word: αὐτόν
  choice: Yesus
  rationale: Pronomina objek merujuk kepada Yesus. Menyebut nama-Nya menghindari rangkaian pronomina Indonesia yang berpotensi kabur, tanpa mengubah referen.
theological_decisions:
- issue: Peralihan antara subjek tunggal dan objek jamak dalam ucapan roh-roh jahat
  choice: Memakai subjek tunggal 'ia' untuk juru bicara dan objek jamak 'mereka' untuk roh-roh jahat.
  alternative: Mengubahnya menjadi subjek kolektif jamak agar kesesuaian jumlah lebih mulus.
  rationale: Teks Yunani mempertahankan ketegangan antara satu juru bicara yang memohon dan banyak roh yang tidak ingin diusir. Terjemahan tidak menyelaraskan peralihan itu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Ia' mempertahankan subjek tunggal; nama 'Yesus' dipakai untuk memperjelas referen pronomina. Penanda catatan kaki [a] dicantumkan dalam teks utama.
