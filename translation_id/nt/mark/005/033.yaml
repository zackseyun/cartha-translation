  text: ἡ δὲ γυνὴ φοβηθεῖσα καὶ τρέμουσα, εἰδυῖα ὃ γέγονεν ⸀αὐτῇ, ἦλθεν καὶ προσέπεσεν αὐτῷ καὶ εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/033.yaml
  text: But the woman[a], fearing and trembling, knowing what had happened to her[b], came and fell down before him and told him the whole truth.
translation:
  language: id
  text: Namun perempuan itu, dalam ketakutan dan gemetar, menyadari apa yang telah terjadi pada dirinya; ia datang, tersungkur di hadapan-Nya, dan mengatakan kepada-Nya seluruh kebenaran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras ringan sekaligus kelanjutan narasi dari pertanyaan Yesus dan reaksi orang banyak.
- source_word: ἡ γυνὴ
  choice: perempuan itu
  rationale: Artikel dan konteks menunjuk kepada perempuan yang telah diperkenalkan sebelumnya.
- source_word: φοβηθεῖσα καὶ τρέμουσα
  choice: dengan takut dan gemetar
  rationale: Mempertahankan kedua unsur keadaan emosionalnya secara wajar dalam bahasa Indonesia tanpa mengurangi daya ungkap pasangan partisip tersebut.
- source_word: εἰδυῖα
  choice: mengetahui
  rationale: Mempertahankan hubungan sirkumstansial partisip dan tidak menjadikannya secara eksplisit kausal.
- source_word: ὃ γέγονεν αὐτῇ
  choice: apa yang telah terjadi pada dirinya
  rationale: Ungkapan Indonesia yang alami untuk peristiwa yang dialaminya, yakni kesembuhan yang baru terjadi.
- source_word: ἦλθεν
  choice: datang
  rationale: Menerjemahkan aoristus naratif secara langsung tanpa menambahkan gagasan mendekat yang tidak dinyatakan secara khusus.
- source_word: προσέπεσεν αὐτῷ
  choice: tersungkur di hadapan Yesus
  rationale: Menyampaikan tindakan jatuh di depan-Nya dengan sikap merendahkan diri, tanpa memastikan bentuk tubuh yang lebih terperinci atau menyatakannya sebagai penyembahan.
- source_word: εἶπεν αὐτῷ
  choice: mengatakan kepada-Nya
  rationale: Bentuk ini alami dengan objek isi 'seluruh kebenaran' serta mempertahankan rujukan kepada Yesus dengan jelas.
- source_word: πᾶσαν τὴν ἀλήθειαν
  choice: seluruh kebenaran
  rationale: Mempertahankan penekanan πᾶσαν bahwa perempuan itu menyampaikan keterangan sepenuhnya tanpa menyembunyikan apa pun.
theological_decisions:
- issue: Sikap tubuh di hadapan Yesus dalam προσέπεσεν αὐτῷ
  choice: tersungkur di hadapan Yesus
  alternative: jatuh di hadapan-Nya; sujud di hadapan-Nya
  rationale: Kata kerja ini dapat menggambarkan tindakan jatuh di depan seseorang karena hormat, takut, atau memohon. Pilihan ini mempertahankan tindakan fisiknya tanpa menetapkannya secara khusus sebagai ibadah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama 'Yesus' digunakan alih-alih pronomina pada kemunculan pertama dalam kalimat agar rujukannya jelas; sesudah itu digunakan '-Nya'. Struktur partisip Yunani dipertahankan sejauh tetap alami dalam bahasa Indonesia.
