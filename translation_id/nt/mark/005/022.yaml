  text: ⸀καὶ ἔρχεται εἷς τῶν ἀρχισυναγώγων, ὀνόματι Ἰάϊρος, καὶ ἰδὼν αὐτὸν πίπτει πρὸς τοὺς πόδας αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/022.yaml
  text: And one of the synagogue rulers[a], named Jairus, came, and when he saw him[b], he fell at his feet.
translation:
  language: id
  text: Lalu datanglah salah seorang pemimpin rumah ibadat bernama Yairus. Ketika ia melihat Yesus, ia tersungkur di kaki-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: datanglah
  rationale: Bentuk kini historis memberi daya hidup pada kisah. Dalam narasi Indonesia, 'datanglah' terdengar alami, menandai munculnya tokoh baru, dan tidak mengharuskan pemakaian bentuk waktu eksplisit.
- source_word: εἷς τῶν ἀρχισυναγώγων
  choice: seorang dari antara para pemimpin rumah ibadat
  rationale: Ungkapan ini mempertahankan konstruksi partitif 'seorang dari antara' dan memahami ἀρχισυνάγωγος sebagai pejabat atau pemimpin yang mengurus rumah ibadat.
- source_word: ὀνόματι Ἰάϊρος
  choice: bernama Yairus
  rationale: Padanan idiomatis dan ringkas untuk ungkapan datif yang memperkenalkan nama orang; 'Yairus' mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: ἰδὼν αὐτὸν
  choice: ketika melihat Yesus
  rationale: Partisip aoris diterjemahkan sebagai anak kalimat temporal. Nama 'Yesus' dipakai untuk memperjelas rujukan pronomina Yunani dalam bahasa Indonesia.
- source_word: πίπτει πρὸς τοὺς πόδας αὐτοῦ
  choice: ia tersungkur di kaki-Nya
  rationale: '''Tersungkur di kaki'' secara alami menyampaikan tindakan menjatuhkan diri di hadapan seseorang, tanpa menambahkan bahwa tindakan itu secara khusus merupakan penyembahan.'
theological_decisions:
- issue: Makna sikap Yairus di hadapan Yesus
  choice: ia tersungkur di kaki-Nya
  alternative: ia menyembah-Nya; ia berlutut di hadapan-Nya
  rationale: Bahasa Yunani menggambarkan tindakan fisik yang dapat menyatakan hormat, keputusasaan, atau permohonan. Karena tidak ada kata yang secara eksplisit berarti 'menyembah', terjemahan tidak memastikan makna teologis yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. 'Rumah ibadat' dipilih sebagai istilah yang mudah dipahami untuk sinagoge; 'para pemimpin' menunjukkan bahwa yang dimaksud adalah pejabat pengelola, bukan semata-mata pengajar. Kapitalisasi '-Nya' mengikuti konvensi umum Alkitab bahasa Indonesia untuk rujukan kepada Yesus.
