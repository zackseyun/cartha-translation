  text: καὶ διὰ παντὸς νυκτὸς καὶ ἡμέρας ἐν τοῖς ⸂μνήμασιν καὶ ἐν τοῖς ὄρεσιν⸃ ἦν κράζων καὶ κατακόπτων ἑαυτὸν λίθοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/005.yaml
  text: And continually[a], night and day, among the tombs and on the mountains, he was crying out and cutting himself with stones.
translation:
  language: id
  text: Terus-menerus, malam dan siang, di antara makam-makam dan di gunung-gunung, ia berteriak dan menyayat-nyayat dirinya dengan batu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “terus berteriak dan melukai dirinya dengan batu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ παντὸς νυκτὸς καὶ ἡμέρας
  choice: Terus-menerus, malam dan siang
  rationale: Ungkapan διά + genitif menyatakan tindakan yang berlangsung terus sepanjang waktu. Susunan “malam dan siang” mempertahankan urutan teks Yunani, sedangkan “terus-menerus” menyampaikan daya duratifnya secara alami dalam bahasa Indonesia.
- source_word: μνήμασιν
  choice: makam-makam
  rationale: μνῆμα menunjuk pada tempat penguburan atau makam. “Makam-makam” sesuai dengan konteks tempat pemakaman, termasuk kemungkinan makam yang dipahat pada batu.
- source_word: ὄρεσιν
  choice: gunung-gunung
  rationale: Bentuk jamak ὄρος secara langsung berarti “gunung-gunung”. Pilihan ini mempertahankan bentuk dan gambaran geografis sumber tanpa mengubahnya menjadi “bukit-bukit”.
- source_word: ἦν κράζων
  choice: ia berteriak
  rationale: Konstruksi imperfek perifrastik menggambarkan tindakan yang sedang berlangsung atau berulang pada masa lampau. Daya duratifnya sudah diperjelas oleh “terus-menerus, malam dan siang”.
- source_word: κατακόπτων ἑαυτὸν
  choice: melukai dirinya
  rationale: κατακόπτω dapat menggambarkan tindakan memukul atau menyayat hingga terluka. “Melukai dirinya” jelas, wajar, dan tidak mempersempit ambiguitas cara tindakannya; kemungkinan arti yang lebih tajam dicatat dalam catatan kaki.
- source_word: λίθοις
  choice: dengan batu
  rationale: Bentuk datif ini berfungsi instrumental, sehingga “dengan batu” merupakan padanan Indonesia yang alami.
