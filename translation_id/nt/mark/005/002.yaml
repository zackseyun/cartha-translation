  source_fidelity: Frasa «yang bersama dengan roh najis» tidak mencerminkan idiom bahasa Indonesia yang wajar untuk ἐν πνεύματι ἀκαθάρτῳ. Terjemahan «dengan roh najis» mempertahankan keterbukaan ungkapan Yunani tanpa memasukkan penafsiran «dirasuki». «Dari antara makam-makam» dengan jelas mempertahankan ἐκ τῶν μνημείων yang jamak dan arah asal orang itu.
  naturalness: Susunan revisi lebih lancar dalam bahasa Indonesia baku. «Seorang laki-laki dengan roh najis» merupakan padanan naratif yang ringkas dan cukup harfiah; bentuk sebelumnya, «yang bersama dengan roh najis», terdengar tidak lazim dan dapat menyiratkan sekadar kebersamaan eksternal.
  terminology: «Roh najis» adalah padanan mapan dan tepat untuk πνεῦμα ἀκάθαρτον. «Makam-makam» lebih dekat dengan μνημεῖα daripada «pekuburan», yang dapat menggeser gambaran kepada kompleks pemakaman modern. Kapitalisasi «-Nya» konsisten dengan rujukan kepada Yesus.
