  text: καὶ ⸂ἐξελθόντος αὐτοῦ⸃ ἐκ τοῦ πλοίου ⸂εὐθὺς ὑπήντησεν⸃ αὐτῷ ἐκ τῶν μνημείων ἄνθρωπος ἐν πνεύματι ἀκαθάρτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/002.yaml
  text: And when he got out of the boat[a], immediately a man with an unclean spirit came out from the tombs to meet him,
translation:
  language: id
  text: Ketika Yesus keluar dari perahu, segera seorang laki-laki dengan roh najis[a] datang dari antara makam-makam untuk menemui-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang dirasuki roh najis.” Bahasa Yunaninya secara lebih harfiah berarti “dengan roh najis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ
  choice: ketika Yesus keluar
  rationale: Genitivus absolutus dengan partisip aoristus diterjemahkan sebagai anak kalimat waktu. Nama “Yesus” dipakai agar rujukan pronomina jelas dan alami dalam bahasa Indonesia.
- source_word: πλοίου
  choice: perahu
  rationale: Dalam latar Danau Galilea, “perahu” merupakan padanan modern yang lebih wajar daripada “kapal”.
- source_word: εὐθὺς
  choice: segera
  rationale: Mempertahankan penanda naratif khas Markus yang memberi kesan langsung dan mendesak.
- source_word: ὑπήντησεν αὐτῷ
  choice: datang ... menemui-Nya
  rationale: Mengungkapkan gerak orang itu dari pekuburan menuju Yesus sekaligus arti dasar ὑπαντάω, yaitu menemui.
- source_word: ἐκ τῶν μνημείων
  choice: dari pekuburan
  rationale: μνημεῖον menunjuk pada makam atau tempat pemakaman; bentuk jamak kolektif “pekuburan” alami dalam konteks Indonesia dan sesuai dengan gambaran kawasan makam.
- source_word: ἄνθρωπος
  choice: seorang laki-laki
  rationale: Kata benda ini berbentuk maskulin tunggal dan dalam konteks menunjuk kepada seorang pria tertentu.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: yang bersama dengan roh najis
  rationale: Ungkapan ini mempertahankan hubungan yang dinyatakan secara umum oleh ἐν dan tidak langsung menentukannya sebagai “kerasukan” atau “dirasuki,” meskipun ungkapan Indonesia ini sengaja agak harfiah demi menjaga ambiguitas sumber.
theological_decisions:
- issue: Bahasa mengenai gangguan oleh roh jahat
  choice: yang bersama dengan roh najis
  alternative: yang dirasuki roh najis
  rationale: Bahasa sumber secara lebih harfiah berbunyi “dalam/dengan roh najis.” Pilihan utama tidak menambahkan rumusan demonologis yang lebih khusus, sedangkan catatan kaki menyediakan ungkapan Indonesia yang lazim sebagai kemungkinan makna.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Kapitalisasi “-Nya” memperjelas bahwa pronomina itu merujuk kepada Yesus. Susunan “datang dari pekuburan menemui-Nya” mempertahankan arah gerak dalam teks Yunani. Penanda catatan kaki ditempatkan setelah frasa yang dijelaskannya.
