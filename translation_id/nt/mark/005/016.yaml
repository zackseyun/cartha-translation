  text: ⸂καὶ διηγήσαντο⸃ αὐτοῖς οἱ ἰδόντες πῶς ἐγένετο τῷ δαιμονιζομένῳ καὶ περὶ τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/016.yaml
  text: And those who had seen it told them how it had happened to the demon-possessed man[a], and about the pigs.
translation:
  language: id
  text: Orang-orang yang telah melihatnya menceritakan kepada mereka bagaimana hal itu terjadi pada orang yang kerasukan roh jahat itu dan tentang babi-babi itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διηγήσαντο
  choice: menceritakan
  rationale: Kata kerja ini berarti mengisahkan atau menuturkan suatu kejadian. “Menceritakan” alami dalam bahasa Indonesia modern dan menyampaikan adanya laporan mengenai peristiwa tersebut.
- source_word: οἱ ἰδόντες
  choice: orang-orang yang telah melihat kejadian itu
  rationale: Partisipel berartikel ini menunjuk kepada orang-orang yang menyaksikan kejadian tersebut. Frasa ini mempertahankan fungsi partisipelnya, sedangkan “kejadian itu” memperjelas objek tersirat secara alami dari konteks.
- source_word: πῶς ἐγένετο
  choice: bagaimana hal itu terjadi
  rationale: Terjemahan ini mempertahankan unsur πῶς, yakni cara atau rangkaian terjadinya peristiwa, tanpa memadatkannya menjadi sekadar “apa yang terjadi”.
- source_word: τῷ δαιμονιζομένῳ
  choice: orang yang kerasukan roh jahat itu
  rationale: Bentuk partisipel ini menunjuk kepada orang yang berada di bawah kuasa makhluk roh jahat. “Kerasukan roh jahat” jelas dan lazim bagi pembaca Indonesia, serta tidak mengubah peristiwa naratif menjadi kategori psikologis semata.
- source_word: περὶ τῶν χοίρων
  choice: tentang babi-babi itu
  rationale: περί dengan genitif berarti “tentang” atau “mengenai.” Bentuk ulang “babi-babi” menyatakan jamak secara jelas, dan “itu” menandai kawanan tertentu dalam konteks.
theological_decisions:
- issue: Pengungkapan δαιμονιζομένῳ dalam kisah tentang aktivitas roh jahat
  choice: orang yang kerasukan roh jahat itu
  alternative: orang yang dirasuki setan itu; orang yang dikuasai roh jahat itu
  rationale: Pilihan utama menyampaikan secara jelas bahwa kisah Markus menggambarkan penderitaan yang berkaitan dengan kuasa roh jahat. Kata “kerasukan” merupakan ungkapan Indonesia yang alami, sementara “roh jahat” sesuai dengan pemakaian kontekstual Markus tanpa menentukan secara tidak perlu apakah nomina tunggal atau jamak harus dimasukkan ke dalam terjemahan bentuk partisipel ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Susunan kalimat mengikuti alur sumber Yunani sambil tetap alami; “dan juga” memperjelas bahwa laporan para saksi mencakup pula kejadian mengenai babi-babi.
