  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· ὕπαγε εἰς εἰρήνην, καὶ ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/034.yaml
  text: But he said to her[a], “Daughter, your faith has saved you. Go in peace[b], and be well from your affliction.”
translation:
  language: id
  text: Namun, ia berkata kepada perempuan itu, “Anakku, imanmu telah menyelamatkanmu.[a] Pergilah dalam damai dan sembuhlah dari penyakitmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “menyelamatkanmu” juga dapat berarti “menyembuhkanmu” atau “membuatmu sembuh.”
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Anakku
  rationale: Sapaan ini mempertahankan kehangatan dan nuansa kekeluargaan dari bentuk vokatif Yunani. Bentuk harfiah “anak perempuan” tidak wajar sebagai sapaan dalam bahasa Indonesia, sedangkan “Anakku” alami dan bermartabat.
- source_word: πίστις
  choice: iman
  rationale: Dalam konteks ini kata tersebut menunjuk pada kepercayaan perempuan itu kepada Yesus. “Iman” mempertahankan istilah teologis utama sekaligus tetap lazim bagi pembaca Indonesia.
- source_word: σέσωκέν σε
  choice: telah menyelamatkanmu
  rationale: Terjemahan ini mempertahankan cakupan luas verba σῴζω dan bentuk perfektumnya, tanpa menyempitkan maknanya menjadi kesembuhan jasmani saja. Kemungkinan makna kesembuhan dijelaskan dalam catatan kaki.
- source_word: ὕπαγε εἰς εἰρήνην
  choice: Pergilah dalam damai
  rationale: Ungkapan ini menyampaikan perintah untuk pergi dalam keadaan damai dan sejahtera, dengan bentuk yang alami serta khidmat dalam bahasa Indonesia.
- source_word: ἴσθι ὑγιὴς
  choice: tetaplah sehat
  rationale: Imperatif statif ini menyatakan agar perempuan tersebut berada dalam keadaan sehat. “Tetaplah sehat” sesuai dengan konteks bahwa kesembuhannya sudah terjadi, dan membedakannya dari verba σῴζω sebelumnya.
- source_word: ἀπὸ τῆς μάστιγός σου
  choice: bebas dari penyakit yang menyiksamu
  rationale: Preposisi ἀπό menyatakan keterlepasan dari keadaan itu, sedangkan μάστιξ secara metaforis menggambarkan penyakit sebagai deraan yang menyiksa. Ungkapan Indonesia ini mempertahankan kedua unsur tersebut secara alami.
theological_decisions:
- issue: Hubungan antara keselamatan dan kesembuhan dalam σέσωκέν σε
  choice: telah menyelamatkanmu
  alternative: telah menyembuhkanmu / telah membuatmu sembuh
  rationale: σῴζω dapat berarti menyelamatkan maupun menyembuhkan. Terjemahan utama mempertahankan keluasan dan ketegangan maknanya, terutama karena klausa berikutnya secara khusus menyebut keadaan sehat; alternatif fisik dicatat tanpa meniadakan makna yang lebih luas.
- issue: Makna πίστις dalam tindakan perempuan itu
  choice: iman
  alternative: kepercayaan
  rationale: “Iman” merupakan padanan mapan dan sesuai dengan respons percaya perempuan itu kepada Yesus. Terjemahan ini tidak mengubahnya menjadi “kesetiaan,” yang kurang sesuai dalam konteks ini.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Sapaan “Anakku” dipilih sebagai padanan idiomatis bagi “Putri/anak perempuan” dalam bentuk vokatif. Kata ganti untuk Yesus ditulis dengan huruf kecil sesuai kaidah umum bahasa Indonesia modern; kutipan langsung tetap hangat tanpa menjadi percakapan yang terlalu santai.
