  text: ὁ δὲ Ἰησοῦς ⸀παρακούσας τὸν λόγον λαλούμενον λέγει τῷ ἀρχισυναγώγῳ· Μὴ φοβοῦ, μόνον πίστευε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/036.yaml
  text: But Jesus[a], overhearing the word being spoken, says to the synagogue leader, “Do not be afraid[b]; only believe.”
translation:
  language: id
  text: Namun, Yesus, yang mendengar apa yang sedang dikatakan itu,[a] berkata kepada pemimpin rumah ibadat, “Jangan takut; percaya saja.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang mengabaikan apa yang sedang dikatakan itu.” Kata Yunani yang dipakai dapat berarti mendengar sesuatu yang sedang diucapkan atau tidak menghiraukannya.
    reason: alternative_reading
  - marker: b
    text: Atau, “hanya tetaplah percaya” atau “hanya percayalah kepada-Nya.” Kata Yunani yang dipakai adalah πιστεύω.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσας
  choice: yang mendengar
  rationale: Partisip ini dapat berarti mendengar sesuatu yang diucapkan, termasuk mendengar sepintas, atau mengabaikannya. Dalam alur kisah, Yesus menanggapi laporan yang baru saja disampaikan, sehingga 'yang mendengar' paling alami; kemungkinan 'mengabaikan' dipertahankan dalam catatan kaki.
- source_word: τὸν λόγον λαλούμενον
  choice: perkataan itu
  rationale: Ungkapan ini menunjuk pada laporan yang sedang disampaikan dalam konteks sebelumnya. 'Perkataan itu' alami dalam bahasa Indonesia dan tetap dekat dengan λόγον tanpa membuat konstruksi yang kaku.
- source_word: λέγει
  choice: berkata
  rationale: Walaupun bentuk Yunaninya adalah kala kini historis, bahasa Indonesia lazim memakai 'berkata' dalam narasi tanpa penandaan kala; kejelasan dan kelugasan tetap terjaga.
- source_word: ἀρχισυναγώγῳ
  choice: pemimpin rumah ibadat
  rationale: Istilah ini menunjuk pada pejabat atau pemimpin sinagoge. 'Pemimpin rumah ibadat' jelas bagi pembaca Indonesia dan selaras dengan istilah yang umum dalam tradisi penerjemahan Alkitab Indonesia.
- source_word: Μὴ φοβοῦ
  choice: Jangan takut
  rationale: Ini adalah padanan Indonesia yang langsung, alami, dan tepat untuk larangan tersebut.
- source_word: μόνον
  choice: saja
  rationale: Dalam susunan 'percaya saja', kata ini secara idiomatis membatasi tanggapan yang diminta Yesus, sesuai dengan μόνον.
- source_word: πίστευε
  choice: percaya
  rationale: Bentuk imperatif kini dapat menyiratkan tindakan yang berlanjut, tetapi 'percaya' merupakan padanan langsung dan alami. Nuansa 'tetap percaya' serta alternatif 'menaruh kepercayaan' dicatat agar aspek dan medan maknanya tidak disempitkan.
theological_decisions:
- issue: Daya semantis παρακούσας
  choice: Yesus mendengar laporan itu lalu berbicara kepada pemimpin rumah ibadat.
  alternative: Yesus mengabaikan atau tidak menghiraukan laporan itu.
  rationale: Kedua arti dimungkinkan secara leksikal. Respons langsung Yesus mendukung arti 'mendengar', tetapi kemungkinan 'mengabaikan' merupakan ambiguitas nyata yang perlu dipertahankan dalam catatan kaki.
- issue: Makna πιστεύω dalam perintah Yesus
  choice: percaya
  alternative: tetap percaya; menaruh kepercayaan
  rationale: '''Percaya'' adalah padanan verbal yang paling langsung dan tidak memasukkan penafsiran denominasi tertentu. Bentuk imperatif kini mungkin menonjolkan keberlanjutan, sedangkan ''menaruh kepercayaan'' menonjolkan relasi percaya; keduanya dicatat sebagai kemungkinan.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Rumah ibadat' dipilih sebagai istilah yang mudah dipahami untuk sinagoge. Kedua penanda catatan kaki ditempatkan sesudah kutipan karena catatan [a] menjelaskan anak kalimat sebelum ucapan dan [b] menjelaskan perintah penutup.
