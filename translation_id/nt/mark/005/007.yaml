review_pass:
  verdict: revise
  source_fidelity: Draf mempertahankan unsur-unsur utama ayat, termasuk seruan keras, sapaan kepada Yesus sebagai Anak Allah Yang Mahatinggi, dan larangan untuk menyiksa. Namun, κράξας ... λέγει lebih baik diterjemahkan dengan dua tindakan verbal (“Sambil berteriak ... ia berkata”), bukan dengan “berteriak” saja. Selain itu, “aku meminta-Mu dengan sumpah” tidak idiomatis dalam bahasa Indonesia dan kurang tepat menangkap ὁρκίζω.
  naturalness: “Apa urusanku dengan-Mu?” adalah idiom Indonesia yang alami dan tajam. Susunan “Demi Allah, aku meminta-Mu dengan sumpah” terdengar janggal; “aku memohon kepada-Mu demi Allah” alami dalam register keagamaan Indonesia. Penempatan penanda catatan kaki juga perlu dipindahkan agar masing-masing melekat pada frasa yang benar-benar dijelaskan.
  terminology: “Yesus, Anak Allah Yang Mahatinggi” tepat dan mempertahankan gelar ilahi Yunani. “Menyiksa” dapat dipertahankan untuk βασανίσῃς, meskipun konteksnya juga memungkinkan “menyiksa/menyengsarakan”; tidak perlu mengurangi intensitasnya.
  issues:
  - severity: medium
    issue: λέγει tidak tercermin sebagai verba ujaran tersendiri.
    rationale: Teks Yunani memuat partisipel κράξας diikuti verba utama historis λέγει. Draf hanya memakai “Ia berteriak” sebelum kutipan, sehingga tindakan “ia berkata” tidak dinyatakan secara eksplisit.
  - severity: medium
    issue: “aku meminta-Mu dengan sumpah” janggal dan kurang akurat untuk ὁρκίζω.
    rationale: ὁρκίζω menyatakan permohonan atau desakan yang khidmat dengan seruan kepada Allah, dan secara leksikal juga dapat melibatkan pengikatan dengan sumpah. Frasa draf tidak lazim dalam bahasa Indonesia dan dapat menyiratkan bahwa pembicara sendiri bersumpah, bukan bahwa ia memohon/desak Yesus demi Allah.
  - severity: low
    issue: Penanda catatan kaki a ditempatkan pada gelar, bukan pada idiom yang dijelaskannya.
    rationale: Catatan a membahas “Apa urusanku dengan-Mu?”, sehingga penandanya perlu melekat langsung pada frasa tersebut.
