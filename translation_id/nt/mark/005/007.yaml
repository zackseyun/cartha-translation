  text: καὶ κράξας φωνῇ μεγάλῃ ⸀λέγει· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; ὁρκίζω σε τὸν θεόν, μή με βασανίσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/007.yaml
  text: And crying out with a loud voice[a], he says, “What have I to do with you, Jesus, Son of the Most High God? I adjure you by God[c][b], do not torment me.”
translation:
  language: id
  text: Sambil berteriak dengan suara nyaring, ia berkata, “Apa urusanku dengan-Mu[a], Yesus, Anak Allah Yang Mahatinggi? Aku memohon kepada-Mu demi Allah[b], jangan menyiksa aku!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Apa bagiku dan bagi-Mu?” Ini adalah ungkapan yang menyatakan jarak, pertentangan, atau penolakan untuk terlibat.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Aku mengikat-Mu dengan sumpah demi Allah” atau “Aku mendesak-Mu demi Allah.” Kata Yunani yang dipakai menyatakan permohonan atau desakan khidmat dan dapat membawa nuansa pengikatan dengan sumpah.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας φωνῇ μεγάλῃ
  choice: Ia berteriak dengan suara nyaring
  rationale: Menyampaikan seruan keras dan mendesak secara alami dalam bahasa Indonesia, sambil mempertahankan hubungan partisipel dengan ujaran utama.
- source_word: λέγει
  choice: berteriak …
  rationale: Kala kini historis Yunani diungkapkan melalui bentuk naratif Indonesia yang alami; verba ujaran dipadukan dengan κράξας agar tidak menghasilkan susunan kaku seperti ‘setelah berteriak … berkata’.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Apa urusanku dengan-Mu
  rationale: Ungkapan Indonesia ini mempertahankan daya idiom Yunani sebagai penolakan, pertentangan, atau keinginan untuk tidak terlibat, tanpa menjabarkan maknanya secara berlebihan.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Anak Allah Yang Mahatinggi
  rationale: Mempertahankan gelar ‘Anak’ dan sebutan ilahi ‘Yang Mahatinggi’ dalam urutan Indonesia yang wajar.
- source_word: ὁρκίζω σε τὸν θεόν
  choice: Demi Allah, aku meminta-Mu dengan sumpah
  rationale: Menyatakan permohonan yang disertai seruan sumpah secara jelas bagi pembaca modern; ungkapan ini mempertahankan daya khidmat dan ketegangan dari ὁρκίζω tanpa memakai istilah Indonesia yang terlalu teknis.
- source_word: μή με βασανίσῃς
  choice: jangan menyiksa aku
  rationale: ‘Menyiksa’ mempertahankan intensitas βασανίζω dan sesuai dengan konteks penderitaan berat.
theological_decisions:
- issue: Pengakuan roh itu terhadap identitas Yesus
  choice: Yesus, Anak Allah Yang Mahatinggi
  alternative: Yesus, Anak dari Allah Yang Mahatinggi
  rationale: Terjemahan mempertahankan sapaan kristologis yang eksplisit tanpa menambah rumusan teologis di luar ayat.
- issue: Daya ὁρκίζω dalam permohonan roh kepada Yesus
  choice: Demi Allah, aku meminta-Mu dengan sumpah
  alternative: Demi Allah, aku memohon kepada-Mu
  rationale: Pilihan utama mempertahankan unsur sumpah dan ketegangan bahwa roh itu menyerukan Allah dalam permohonannya kepada Yesus, sedangkan alternatif lebih lancar tetapi melemahkan unsur tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapitalisasi pronomina ‘-Mu’ mengikuti kebiasaan luas dalam teks keagamaan Indonesia ketika merujuk kepada Yesus. Tanda kaki ditempatkan langsung pada bagian yang dijelaskannya.
