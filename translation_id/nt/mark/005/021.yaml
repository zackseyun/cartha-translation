    issue: “danau” menggantikan θάλασσαν dalam teks utama.
    rationale: Walaupun lokasi yang dimaksud adalah Danau Galilea, teks Yunani memakai θάλασσα (“laut”). Optimal-equivalence lebih baik mempertahankan “laut” di teks dan memberi penjelasan geografis dalam catatan kaki.
  - severity: low
    issue: “orang banyak” tidak secara jelas menerjemahkan πολὺς.
    rationale: Ungkapan itu dapat menyiratkan keramaian, tetapi πολὺς secara eksplisit menyatakan jumlah yang besar. “Sejumlah besar orang” mempertahankan unsur tersebut.
  - severity: low
    issue: “Saat itu” tidak diperlukan bagi καὶ ἦν.
    rationale: Konjungsi καί cukup diterjemahkan “dan”; “Saat itu” memberi penekanan temporal tambahan dan membuat hubungan naratif sedikit kurang langsung.
