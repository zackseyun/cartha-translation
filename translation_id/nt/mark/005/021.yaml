  source_fidelity: Revisi diperlukan karena θάλασσαν secara leksikal adalah “laut”; konteksnya memang Danau Galilea, tetapi keterangan geografis tersebut sebaiknya berada dalam catatan kaki, bukan menggantikan kata sumber dalam teks utama. Selain itu, ὄχλος πολύς menyatakan kuantitas besar secara eksplisit, sehingga “orang banyak” saja kurang menyatakan πολὺς.
  naturalness: Teks draf umumnya alami, tetapi “Saat itu Ia berada” menambahkan penanda waktu yang tidak diperlukan dan memutus koordinasi sederhana καί ... καί. Kalimat revisi tetap baku dan lancar dalam bahasa Indonesia modern.
  terminology: “Laut” mempertahankan istilah sumber θάλασσα, sementara catatan kaki menjelaskan bahwa yang dimaksud adalah Danau Galilea. “Sejumlah besar orang” secara jelas menyampaikan ὄχλος πολύς tanpa gaya yang kaku.
  issues:
