  text: Καὶ διαπεράσαντος τοῦ Ἰησοῦ ἐν τῷ πλοίῳ πάλιν εἰς τὸ πέραν συνήχθη ὄχλος πολὺς ἐπ’ αὐτόν, καὶ ἦν παρὰ τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/021.yaml
  text: And after Jesus had crossed over again in the boat to the other side[a], a large crowd gathered around him, and he was beside the sea.
translation:
  language: id
  text: Setelah Yesus menyeberang lagi dengan perahu ke seberang, sejumlah besar orang berkumpul di sekeliling-Nya, dan Ia berada di tepi laut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Laut yang dimaksud ialah Danau Galilea, sebuah danau yang lazim disebut “laut” dalam kitab-kitab Injil.
    reason: cultural_note
lexical_decisions:
- source_word: διαπεράσαντος
  choice: Setelah ... menyeberang
  rationale: Partisip aoris dalam konstruksi genitif absolut menyatakan tindakan yang mendahului berkumpulnya orang banyak. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan urutan waktunya.
- source_word: ἐν τῷ πλοίῳ
  choice: dengan perahu
  rationale: Dalam bahasa Indonesia, alat perjalanan paling alami dinyatakan dengan 'dengan perahu'; ini tetap menyampaikan bahwa Yesus berada di dalam perahu saat menyeberang.
- source_word: πάλιν
  choice: lagi
  rationale: Mempertahankan penanda pengulangan tindakan secara lugas dan alami.
- source_word: εἰς τὸ πέραν
  choice: ke seberang
  rationale: Ungkapan ini secara idiomatis menunjuk ke pantai di sisi lain dan tidak perlu diperpanjang menjadi 'ke sisi yang lain'.
- source_word: συνήχθη
  choice: berkerumun
  rationale: Walaupun bentuk Yunaninya pasif, konteks menggambarkan orang banyak yang berkumpul rapat menuju dan mengelilingi Yesus. 'Berkerumun' alami dan menangkap konvergensi tersebut.
- source_word: ὄχλος πολὺς
  choice: orang banyak
  rationale: '''Orang banyak'' merupakan ungkapan Indonesia yang wajar untuk kerumunan besar; besarnya kerumunan sudah tersirat secara idiomatis, meski ''kerumunan besar'' juga mungkin.'
- source_word: ἐπ’ αὐτόν
  choice: di sekeliling-Nya
  rationale: Bersama verba berkumpul, ἐπί dengan akusatif menggambarkan gerak yang tertuju kepada Yesus dan menghasilkan kerumunan di sekitar-Nya.
- source_word: παρὰ τὴν θάλασσαν
  choice: di tepi danau
  rationale: παρά menyatakan lokasi di sisi garis pantai. 'Di tepi' adalah padanan Indonesia yang alami.
- source_word: θάλασσαν
  choice: danau
  rationale: θάλασσα secara leksikal berarti 'laut', tetapi di sini menunjuk Danau Galilea. Dalam bahasa Indonesia modern, 'danau' mencegah kesan geografis yang keliru; catatan kaki tetap menerangkan kebiasaan Injil menyebutnya 'laut'.
