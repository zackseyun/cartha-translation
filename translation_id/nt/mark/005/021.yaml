revisions:
- from: Setelah Yesus menyeberang lagi dengan perahu ke seberang,[a] orang banyak berkerumun di sekeliling-Nya. Saat itu Ia berada di tepi danau.
  to: Setelah Yesus menyeberang lagi dengan perahu ke seberang, sejumlah besar orang berkumpul di sekeliling-Nya, dan Ia berada di tepi laut.[a]
  rationale: Revisi mempertahankan urutan temporal partisip genitif absolut (“Setelah ...”), pengulangan πάλιν (“lagi”), sarana perjalanan (“dengan perahu”), dan tujuan εἰς τὸ πέραν (“ke seberang”). Unsur jumlah dalam ὄχλος πολύς dipulihkan dengan “sejumlah besar orang”. θάλασσα diterjemahkan “laut” sesuai sumber, sedangkan identifikasi sebagai Danau Galilea dipindahkan ke catatan kaki. Penempatan jangkar pada “laut” sesuai langsung dengan istilah yang dijelaskan.
