  text: ἦν δὲ ἐκεῖ πρὸς τῷ ὄρει ἀγέλη χοίρων μεγάλη βοσκομένη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/011.yaml
  text: There was there near the mountain a large herd of pigs feeding[a][b].
translation:
  language: id
  text: Di sana, di dekat gunung itu, ada sekawanan besar babi yang sedang makan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sedang merumput.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: ada
  rationale: ἦν menyatakan keberadaan, sedangkan δέ merupakan penghubung naratif ringan yang tidak perlu diterjemahkan secara tersendiri dalam susunan bahasa Indonesia ini.
- source_word: ἐκεῖ
  choice: di sana
  rationale: Padanan lokatif yang langsung dan alami dalam bahasa Indonesia modern.
- source_word: πρὸς τῷ ὄρει
  choice: di dekat gunung itu
  rationale: Dengan datif, πρός menunjukkan lokasi di dekat atau di sisi gunung; bentuk definit 'gunung itu' sesuai dengan artikel Yunani τῷ.
- source_word: ἀγέλη χοίρων μεγάλη
  choice: sekawanan besar babi
  rationale: ἀγέλη berarti kawanan hewan, χοίρων menyatakan jenisnya, dan μεγάλη menerangkan besarnya kawanan; susunan ini alami dalam bahasa Indonesia.
- source_word: βοσκομένη
  choice: sedang mencari makan
  rationale: Partisipel kini ini menggambarkan kawanan yang tengah makan atau merumput. 'Mencari makan' alami untuk hewan dan tidak membatasi makanannya hanya pada rumput.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Partikel δέ tidak dibuat eksplisit karena hanya menandai kelanjutan narasi secara ringan. Istilah sehari-hari 'babi' dipilih tanpa catatan alternatif karena 'babi' juga merupakan padanan baku dan langsung bagi χοῖρος.
