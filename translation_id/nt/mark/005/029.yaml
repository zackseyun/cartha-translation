  text: καὶ ⸀εὐθὺς ἐξηράνθη ἡ πηγὴ τοῦ αἵματος αὐτῆς, καὶ ἔγνω τῷ σώματι ὅτι ἴαται ἀπὸ τῆς μάστιγος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/029.yaml
  text: And immediately the flow of her blood dried up[b][a], and she knew in her body that she had been healed of the affliction.
translation:
  language: id
  text: Saat itu juga sumber pendarahannya mengering,[a] dan ia merasakan dalam tubuhnya bahwa ia telah disembuhkan dari penderitaan itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mata air darahnya mengering.” Bahasa Yunani memakai gambaran hidup tentang mata air atau sumber.
    reason: lexical_alternative
  - marker: b
    text: Atau “dari siksaan itu” atau “dari penyakit berat itu.” Istilah Yunani yang secara harfiah dapat berarti “cambuk” di sini menunjuk pada penderitaannya yang menyakitkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: saat itu juga
  rationale: Ungkapan ini alami dalam bahasa Indonesia modern dan mempertahankan ketergesaan narasi khas Markus.
- source_word: ἐξηράνθη
  choice: mengering
  rationale: Mempertahankan gambaran konkret verba pasif Yunani dalam bentuk Indonesia yang alami; dalam konteks ini menunjukkan berhentinya pendarahan.
- source_word: πηγὴ τοῦ αἵματος αὐτῆς
  choice: sumber pendarahannya
  rationale: πηγή secara harfiah menunjuk pada mata air atau sumber. Pilihan ini mempertahankan metafora sumber sekaligus menjelaskan bahwa yang dimaksud adalah pendarahan perempuan itu.
- source_word: ἔγνω τῷ σώματι
  choice: ia tahu dalam tubuhnya
  rationale: Mempertahankan unsur pengenalan atau pengetahuan dalam ἔγνω serta kesadaran jasmani yang dinyatakan oleh datif τῷ σώματι, tanpa mereduksinya menjadi sekadar perasaan.
- source_word: ἴαται
  choice: ia telah disembuhkan
  rationale: Bentuk perfek Yunani menyatakan kesembuhan yang sudah terjadi dan hasilnya tetap berlaku; bentuk 'telah disembuhkan' menyampaikan hubungan itu secara alami.
- source_word: ἀπὸ τῆς μάστιγος
  choice: dari penderitaan itu
  rationale: μάστιξ secara harfiah dapat berarti cambuk, tetapi secara kiasan di sini menunjuk pada penyakit atau penderitaan berat. 'Penderitaan' jelas dan wajar bagi pembaca modern.
theological_decisions:
- issue: Sifat kesembuhan yang dinyatakan
  choice: Menyatakan berhentinya pendarahan secara nyata dan pengenalan jasmani perempuan itu bahwa ia telah disembuhkan.
  alternative: Menjadikannya hanya sebagai perasaan subjektif perempuan itu.
  rationale: Teks Yunani menyandingkan kejadian jasmani yang objektif dengan kesadaran perempuan itu dalam tubuhnya, tanpa menjelaskan lebih jauh mekanisme kesembuhan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Struktur dipertahankan dekat dengan teks Yunani, sedangkan metafora πηγή dijelaskan melalui catatan kaki.
