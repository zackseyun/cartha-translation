  text: καὶ κρατήσας τῆς χειρὸς τοῦ παιδίου λέγει αὐτῇ· Ταλιθα ⸀κουμ, ὅ ἐστιν μεθερμηνευόμενον· Τὸ κοράσιον, σοὶ λέγω, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/041.yaml
  text: And taking the child's hand[a], he says to her, “Talitha koum,” which is translated, “Little girl, I say to you, get up.”
translation:
  language: id
  text: Lalu Ia memegang tangan anak itu dan berkata kepadanya, “Talita kum,”[a] yang diterjemahkan, “Gadis kecil, Aku berkata kepadamu, bangunlah!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa terjemahan mengeja ungkapan Aram ini “Talitha cum”, mengikuti transliterasi tradisional. Teks Yunani di sini berbunyi κουμ, yang mendukung bentuk “kum”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατήσας τῆς χειρὸς τοῦ παιδίου
  choice: sambil memegang tangan anak itu
  rationale: Konstruksi ini menyatakan tindakan memegang tangan anak tersebut yang menyertai perkataan Yesus. 'Memegang' alami dalam bahasa Indonesia dan tidak memberi kesan keras seperti 'mencengkeram'.
- source_word: λέγει αὐτῇ
  choice: Ia berkata kepadanya
  rationale: λέγει adalah present historis khas narasi Markus. Bahasa Indonesia lazim memakai bentuk verba yang tidak menandai kala, sehingga kejelasan dan daya hidup narasi tetap terpelihara.
- source_word: Ταλιθα κουμ
  choice: Talita kum
  rationale: Ungkapan bahasa Aram dipertahankan oleh teks Yunani dan kemudian diterjemahkan oleh Markus. Ejaan ini menyesuaikan transliterasi dengan kaidah dan pelafalan bahasa Indonesia sambil mengikuti κουμ.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: yang berarti
  rationale: Partisipel ini memperkenalkan terjemahan atau penjelasan ungkapan Aram. 'Yang berarti' merupakan ungkapan Indonesia yang ringkas dan alami.
- source_word: Τὸ κοράσιον
  choice: Gadis kecil
  rationale: κοράσιον menunjuk kepada seorang anak perempuan dan memiliki nuansa diminutif; 'gadis kecil' menyampaikan usia serta kelembutan sapaan itu.
- source_word: σοὶ λέγω
  choice: Aku berkata kepadamu
  rationale: Frasa yang eksplisit dalam bahasa Yunani dipertahankan agar penekanan langsung kepada anak itu tidak hilang.
- source_word: ἔγειρε
  choice: bangunlah
  rationale: Imperatif ἐγείρω dapat berarti bangun atau berdiri. Dalam konteks anak yang terbaring mati, 'bangunlah' mempertahankan kaitan alami dengan bangun dari tidur sekaligus perintah untuk bangkit.
theological_decisions:
- issue: Pemertahanan perkataan Yesus dalam bahasa Aram
  choice: Mempertahankan 'Talita kum' lalu memberikan terjemahan Markus
  alternative: Hanya menerjemahkan ungkapan itu sebagai 'Gadis kecil, Aku berkata kepadamu, bangunlah!'
  rationale: Teks sumber sendiri mempertahankan ucapan Semitik tersebut dan segera menjelaskannya. Menampilkan keduanya menjaga tekstur naratif tanpa mengaburkan artinya.
- issue: Cakupan makna ἔγειρε dalam konteks kebangkitan anak
  choice: bangunlah
  alternative: bangkitlah atau berdirilah
  rationale: '''Bangunlah'' merupakan perintah langsung yang alami dan tetap memelihara ketegangan makna antara bangun dari keadaan terbaring dan dipulihkan dari kematian, tanpa menambahkan rumusan doktrinal.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan serta perintah langsung dibuat alami, sementara ungkapan Aram dan penjelasan Markus tetap dipertahankan.
