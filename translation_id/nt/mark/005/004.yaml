base_translation:
  language: en
  yaml_path: translation/nt/mark/005/004.yaml
  text: because he had often been bound with shackles and chains[a], and the chains had been torn apart by him and the shackles smashed to pieces, and no one was strong enough to subdue him.
translation:
  language: id
  text: sebab ia telah berkali-kali diikat dengan belenggu kaki dan rantai, rantai-rantai itu telah direnggutnya hingga putus dan belenggu-belenggu kaki itu telah diremukkannya, dan tidak seorang pun cukup kuat untuk menundukkannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjinakkannya.” Kata kerja Yunani ini dapat berarti “menjinakkan” atau, secara lebih luas, “menundukkan” atau “mengendalikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ αὐτὸν
  choice: sebab ia sudah
  rationale: διά dengan infinitif berartikel menyatakan alasan bagi pernyataan sebelumnya. “Sebab” mempertahankan hubungan kausal itu secara alami dalam bahasa Indonesia.
- source_word: πολλάκις
  choice: sering
  rationale: Menyatakan tindakan yang berulang kali terjadi; “sering” ringkas dan wajar.
- source_word: πέδαις
  choice: belenggu kaki
  rationale: πέδη secara khusus menunjuk pada alat pengekang kaki. Pilihan ini membedakannya dari rantai pada umumnya.
- source_word: ἁλύσεσι / τὰς ἁλύσεις
  choice: rantai / rantai-rantai itu
  rationale: ἅλυσις berarti rantai. Bentuk ini mempertahankan pembedaan dengan πέδαι, yaitu belenggu kaki.
- source_word: δεδέσθαι
  choice: sudah sering diikat
  rationale: Infinitif perfektum δέω menggambarkan keadaan sebagai hasil tindakan pengikatan yang berulang. “Sudah sering diikat” mengungkapkan latar naratif tersebut dengan jelas.
- source_word: διεσπάσθαι ὑπ’ αὐτοῦ
  choice: rantai-rantai itu diputuskan olehnya
  rationale: διασπάω menyatakan tindakan memutus atau merenggut hingga terpisah, sedangkan ὑπό dengan genitif menandai pelaku. Bentuk pasif dipertahankan agar susunan dan penekanannya dekat dengan bahasa Yunani.
- source_word: συντετρῖφθαι
  choice: dihancurkan
  rationale: συντρίβω menyampaikan tindakan meremukkan atau menghancurkan. “Dihancurkan” alami dan cukup kuat tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: οὐδεὶς ἴσχυεν
  choice: tidak seorang pun cukup kuat
  rationale: ἰσχύω menekankan kekuatan atau kemampuan. “Cukup kuat” mempertahankan nuansa kekuatan, bukan sekadar kemampuan umum.
- source_word: δαμάσαι
  choice: menundukkannya
  rationale: δαμάζω dapat berarti menjinakkan atau menundukkan hingga terkendali. Dalam konteks manusia yang tidak dapat dikekang, “menundukkan” lebih wajar dan tidak menyiratkan pelatihan hewan.
theological_decisions:
- issue: Sumber kekuatan luar biasa orang itu
  choice: Ayat diterjemahkan secara deskriptif tanpa secara eksplisit menyebut sumber kekuatannya.
  alternative: Memperjelas bahwa kekuatan tersebut berasal dari kuasa roh jahat.
  rationale: Bahasa Yunani ayat ini menekankan kegagalan berulang kali untuk mengekangnya, tetapi tidak secara tersurat menjelaskan sumber kekuatan itu. Penjelasan teologis dibiarkan muncul dari konteks narasi.
- issue: Cakupan makna δαμάσαι
  choice: menundukkannya
  alternative: menjinakkannya
  rationale: Kedua makna dimungkinkan secara leksikal. Teks utama memakai ungkapan yang paling alami bagi pengendalian manusia, sedangkan alternatif yang lebih harfiah dicatat tanpa menghapus ambiguitas kata Yunani.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dua istilah pengekang dalam bahasa Yunani dibedakan sebagai “belenggu kaki” dan “rantai.” Kalimat panjang Yunani dibagi menjadi tiga kalimat agar mudah dipahami, sementara hubungan kausal dengan ayat sebelumnya tetap dipertahankan melalui “sebab.”
