id: MRK.5.3
reference: Mark 5:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς τὴν κατοίκησιν εἶχεν ἐν τοῖς μνήμασιν, καὶ ⸂οὐδὲ ἁλύσει οὐκέτι⸃ οὐδεὶς ἐδύνατο αὐτὸν δῆσαι
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/003.yaml
  text: who had his dwelling among the tombs[a], and no one could bind him anymore, not even with a chain.
translation:
  language: id
  text: Ia tinggal di antara makam-makam[a], dan tidak seorang pun dapat lagi mengikatnya, bahkan dengan rantai sekalipun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Ia mempunyai tempat tinggal di dalam makam-makam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοίκησιν εἶχεν
  choice: tinggal
  rationale: Ungkapan Yunani harfiah berarti 'mempunyai tempat tinggal', tetapi dalam bahasa Indonesia modern paling wajar dinyatakan dengan verba 'tinggal' tanpa mengubah maknanya.
- source_word: ἐν τοῖς μνήμασιν
  choice: di antara makam-makam
  rationale: μνῆμα menunjuk pada makam atau tempat penguburan. 'Di antara makam-makam' sesuai dengan latar dan tidak mengharuskan pengertian bahwa ia selalu berada di dalam ruang makam.
- source_word: οὐδὲ ἁλύσει
  choice: bahkan dengan rantai sekalipun
  rationale: Bentuk tunggal ἁλύσει dipertahankan sebagai 'rantai'; pasangan 'bahkan ... sekalipun' menyampaikan penegasan οὐδέ secara alami.
- source_word: οὐκέτι
  choice: lagi
  rationale: Kata ini menandakan bahwa kemampuan tersebut tidak ada lagi, mungkin berbeda dari keadaan sebelumnya.
- source_word: οὐδεὶς ἐδύνατο αὐτὸν δῆσαι
  choice: tidak seorang pun dapat lagi mengikatnya
  rationale: '''Mengikat'' mempertahankan arti fisik δῆσαι, sedangkan ''dapat'' secara alami menyampaikan ketidakmampuan yang dinyatakan oleh ἐδύνατο.'
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, jelas, dan bermartabat. Kata 'makam' dipilih daripada 'kuburan' karena lebih tepat untuk μνῆμα dalam latar ini; susunan kalimat tetap alami bagi pembaca Indonesia umum.
