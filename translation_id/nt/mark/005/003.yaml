  source_fidelity: Teks Indonesia secara setia menyampaikan κατοίκησιν εἶχεν sebagai “tinggal,” lokasi ἐν τοῖς μνήμασιν sebagai “di antara makam-makam,” serta ketidakmampuan berkelanjutan yang ditekankan oleh οὐκέτι dan οὐδέ. “Bahkan dengan rantai sekalipun” dengan tepat mempertahankan penegasan “bahkan tidak dengan sebuah rantai.”
