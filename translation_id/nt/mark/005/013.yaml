source:
  edition: SBLGNT
  text: καὶ ἐπέτρεψεν ⸀αὐτοῖς. καὶ ἐξελθόντα τὰ πνεύματα τὰ ἀκάθαρτα εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, ⸀ὡς δισχίλιοι, καὶ ἐπνίγοντο ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/013.yaml
  text: And he permitted them[a]. Then the unclean spirits came out and entered the pigs, and the herd—about two thousand—rushed down the steep bank into the sea[b], and they drowned in the sea.
translation:
  language: id
  text: Ia pun mengizinkan mereka. Lalu roh-roh najis itu keluar dan masuk ke dalam babi-babi. Kawanan itu—kira-kira dua ribu ekor—berlari deras menuruni lereng terjal[a] ke dalam laut[b], lalu tenggelam di laut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menuruni tebing” atau “menuruni tubir”; kata Yunani yang dipakai dapat menunjuk lereng curam atau tebing.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “laut”; yang dimaksud ialah Danau Galilea.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέτρεψεν αὐτοῖς
  choice: mengizinkan mereka
  rationale: ἐπιτρέπω berarti memberi izin atau membolehkan. Bentuk ini ringkas, alami, dan mempertahankan bahwa izin diberikan kepada roh-roh najis yang disebut dalam konteks.
- source_word: τὰ πνεύματα τὰ ἀκάθαρτα
  choice: roh-roh najis
  rationale: Ungkapan ini mempertahankan bahasa personal-spiritual dalam teks serta cakupan makna ἀκάθαρτος, tanpa mereduksinya menjadi kekuatan jahat yang impersonal.
- source_word: ἐξελθόντα ... εἰσῆλθον εἰς τοὺς χοίρους
  choice: keluar dan masuk ke dalam babi-babi
  rationale: Terjemahan ini mengikuti urutan tindakan dalam bahasa Yunani dan memakai ungkapan Indonesia yang jelas untuk perpindahan roh-roh itu dari orang tersebut kepada babi-babi.
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: kawanan itu ... berlari deras
  rationale: ὁρμάω menggambarkan gerakan mendadak dan kuat. 'Berlari deras' terdengar alami bagi kawanan hewan dan tidak menambahkan gagasan teknis seperti kepanikan massal.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: menuruni lereng terjal
  rationale: κρημνός dapat menunjuk lereng curam, tebing, atau tubir. 'Lereng terjal' menyampaikan bahayanya tanpa memastikan bahwa permukaannya tegak lurus.
- source_word: εἰς τὴν θάλασσαν
  choice: ke dalam laut
  rationale: θάλασσα secara harfiah berarti 'laut'. Terjemahan mempertahankan sebutan sumber, sedangkan catatan menjelaskan bahwa yang dimaksud ialah Danau Galilea.
- source_word: ὡς δισχίλιοι
  choice: kira-kira dua ribu ekor
  rationale: ὡς di depan bilangan menyatakan perkiraan. Kata penggolong 'ekor' diperlukan agar jumlah hewan terdengar alami dalam bahasa Indonesia.
- source_word: ἐπνίγοντο
  choice: tenggelam
  rationale: Bentuk imperfek menggambarkan kejadian yang berlangsung dalam adegan itu. 'Tenggelam' alami dalam narasi Indonesia dan tetap menyampaikan nasib kawanan tersebut tanpa memakai konstruksi pasif yang tidak diperlukan.
theological_decisions:
- issue: Rujukan kata ganti 'mereka' dalam 'mengizinkan mereka'
  choice: '''Mereka'' merujuk kepada roh-roh najis yang meminta izin untuk memasuki babi-babi.'
  alternative: Mengganti kata ganti dengan 'roh-roh itu' di dalam teks utama.
  rationale: Konteks langsung membuat rujukannya cukup jelas. Mempertahankan kata ganti mengikuti bentuk Yunani dan menghindari penjelasan berlebih.
- issue: Sifat personal roh-roh najis
  choice: Mempertahankan sebutan 'roh-roh najis'.
  alternative: Kekuatan-kekuatan jahat.
  rationale: πνεύματα dalam narasi bertindak sebagai pelaku personal. Terjemahan 'roh-roh' mempertahankan penyajian teks tanpa menambahkan uraian demonologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. 'Ia pun' menjaga kesinambungan cerita; tanda pisah mengapit keterangan jumlah tanpa mengaburkan gerak utama kalimat. Sebutan 'laut' dipertahankan dari bahasa Yunani dan dijelaskan dalam catatan.
