id: MRK.5.26
reference: Mark 5:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ πολλὰ παθοῦσα ὑπὸ πολλῶν ἰατρῶν καὶ δαπανήσασα τὰ παρ’ αὐτῆς πάντα καὶ μηδὲν ὠφεληθεῖσα ἀλλὰ μᾶλλον εἰς τὸ χεῖρον ἐλθοῦσα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/026.yaml
  text: and after suffering much under many physicians[a], and after spending all that she had and benefiting nothing, but rather becoming worse[b],
translation:
  language: id
  text: Ia telah banyak menderita akibat penanganan banyak tabib[a] dan telah menghabiskan segala miliknya[b], tetapi sama sekali tidak tertolong; malah keadaannya semakin buruk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “karena banyak tabib” atau “di tangan banyak tabib.” Bahasa Yunaninya dapat menekankan tindakan para tabib ataupun pengalaman perempuan itu selama menjalani pengobatan mereka.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “segala sesuatu yang ada padanya,” yaitu segala miliknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ παθοῦσα
  choice: telah banyak menderita
  rationale: Menyampaikan pengalaman penderitaan yang mendahului keadaan berikutnya secara alami dalam bahasa Indonesia.
- source_word: ὑπὸ πολλῶν ἰατρῶν
  choice: akibat penanganan banyak tabib
  rationale: Ὑπό dengan genitif menunjukkan pelaku atau sumber; frasa ini mempertahankan kaitan penderitaannya dengan tindakan para tabib tanpa menyatakan bahwa profesi tabib itu sendiri menjadi penyebab.
- source_word: δαπανήσασα
  choice: telah menghabiskan
  rationale: Dalam konteks pengeluaran seluruh miliknya, 'menghabiskan' mengungkapkan tindakan membelanjakan sampai tidak tersisa secara wajar.
- source_word: τὰ παρ’ αὐτῆς πάντα
  choice: segala miliknya
  rationale: Ungkapan Yunani menunjuk pada segala sesuatu yang berada padanya atau menjadi kepunyaannya.
- source_word: μηδὲν ὠφεληθεῖσα
  choice: sama sekali tidak tertolong
  rationale: Bentuk pasif ὠφεληθεῖσα menyatakan bahwa ia tidak menerima manfaat atau pertolongan apa pun.
- source_word: ἀλλὰ μᾶλλον
  choice: malah
  rationale: 'Menandai kontras yang meningkat: bukan hanya tidak tertolong, melainkan mengalami kebalikan yang lebih buruk.'
- source_word: εἰς τὸ χεῖρον ἐλθοῦσα
  choice: keadaannya semakin buruk
  rationale: Terjemahan idiomatis untuk peralihan menuju kondisi yang lebih buruk.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Tabib' dipilih karena sesuai dengan latar dunia kuno, sedangkan 'penanganan' memperjelas bahwa penderitaan itu berkaitan dengan perawatan yang diterimanya. Rangkaian partisip Yunani disusun sebagai klausa-klausa sejajar agar mudah dipahami tanpa menghilangkan urutan dan kontrasnya.
