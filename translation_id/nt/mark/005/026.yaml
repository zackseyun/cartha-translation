  source_fidelity: 'Terjemahan dengan tepat mencerminkan rangkaian partisip Yunani: perempuan itu telah banyak menderita dalam kaitannya dengan banyak tabib, telah menghabiskan seluruh miliknya, tidak memperoleh pertolongan/manfaat apa pun, dan justru memburuk. “Akibat penanganan banyak tabib” secara wajar menyampaikan daya agensi ὑπό + genitif dalam konteks perawatan, tanpa menambahkan rincian jenis pengobatan.'
  naturalness: Kalimatnya alami, jelas, dan sesuai ragam Indonesia modern yang bermartabat. Susunan dengan titik koma menandai kontras ἀλλὰ μᾶλλον secara efektif. “Malah keadaannya semakin buruk” merupakan padanan idiomatis yang baik untuk εἰς τὸ χεῖρον ἐλθοῦσα.
  terminology: “Tabib” cocok dengan register naratif kuno dan tetap dapat dipahami dalam bahasa Indonesia modern. “Sama sekali tidak tertolong” secara tepat menyatakan bahwa ia tidak menerima manfaat/pertolongan, dan “segala miliknya” menangkap τὰ παρ’ αὐτῆς πάντα.
