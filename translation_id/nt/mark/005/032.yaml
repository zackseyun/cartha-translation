  yaml_path: translation/nt/mark/005/032.yaml
  text: And he kept looking around to see the one who had done this[a].
translation:
  language: id
  text: Lalu Ia terus memandang ke sekeliling untuk melihat perempuan yang telah melakukan hal itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Penghubung naratif ini diterjemahkan secara alami sebagai “Lalu”; tidak diberi daya simpulan yang tidak terdapat dalam bahasa Yunani.
- source_word: περιεβλέπετο
  choice: Ia terus memandang ke sekeliling
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung, sedangkan verba ini menyatakan pandangan yang diarahkan ke sekeliling.
- source_word: ἰδεῖν
  choice: untuk melihat
  rationale: Infinitif aoris ini menyatakan tujuan dari tindakan memandang dan dapat diterjemahkan langsung serta wajar sebagai “untuk melihat”.
- source_word: τὴν ... ποιήσασαν
  choice: perempuan yang telah melakukan
  rationale: Artikel dan partisipnya berbentuk feminin serta dipakai secara substantival, sehingga menunjuk kepada seorang perempuan. Bahasa Indonesia dapat menyatakannya secara alami tanpa kehilangan informasi gender yang dikodekan dalam bahasa Yunani.
- source_word: τοῦτο
  choice: hal itu
  rationale: Kata penunjuk ini mengacu pada tindakan yang baru saja disebut; “hal itu” jelas dan idiomatis dalam konteks bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Ia” dipakai untuk Yesus sesuai register narasi Alkitab Indonesia, dan “terus” mempertahankan aspek duratif bentuk imperfek.
