  text: καὶ ἔλεγον αὐτῷ οἱ μαθηταὶ αὐτοῦ· Βλέπεις τὸν ὄχλον συνθλίβοντά σε, καὶ λέγεις· Τίς μου ἥψατο;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/031.yaml
  text: And his disciples were saying to him[a], “You see the crowd pressing in on you, and you say, ‘Who touched me?’”
translation:
  language: id
  text: Murid-murid-Nya berkata kepada-Nya, “Engkau melihat orang banyak itu menghimpit-Mu, dan Engkau berkata, ‘Siapa yang menyentuh Aku?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: berkata
  rationale: Bentuk imperfek menunjukkan ujaran yang sedang berlangsung atau dapat pula bersifat berulang. Dalam narasi bahasa Indonesia, “berkata” paling alami; nuansa duratif tidak perlu dibuat eksplisit karena konteks percakapan langsung sudah memadai.
- source_word: μαθηταὶ
  choice: murid-murid
  rationale: Padanan baku dan alami bagi para μαθηταί Yesus, yang mempertahankan hubungan sebagai pengikut sekaligus pelajar.
- source_word: Βλέπεις
  choice: Engkau melihat
  rationale: Mempertahankan bentuk indikatif kini sebagai pernyataan langsung tentang keadaan yang jelas di hadapan Yesus.
- source_word: ὄχλον
  choice: orang banyak
  rationale: Padanan Alkitabiah yang tetap wajar dalam bahasa Indonesia modern dan sesuai untuk kerumunan dalam adegan ini.
- source_word: συνθλίβοντά
  choice: berdesak-desakan menghimpit
  rationale: Mengungkapkan tekanan fisik kerumunan yang merapat dari berbagai sisi; “menghimpit” mempertahankan kekuatan verba, sedangkan “berdesak-desakan” membuat gambaran situasinya alami.
- source_word: λέγεις
  choice: Engkau berkata
  rationale: Bentuk kini dalam dialog dapat diterjemahkan secara alami dengan “berkata” dalam bahasa Indonesia, sambil mempertahankan nada heran para murid.
- source_word: Τίς μου ἥψατο
  choice: Siapa yang menyentuh Aku?
  rationale: ἅπτομαι dalam konteks ini berarti menyentuh, dan aoristus menunjuk pada tindakan tertentu yang baru saja terjadi. Genitif μου secara idiomatis menjadi objek “Aku”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina “Engkau/Mu” dan “Aku” mengikuti register dialog Alkitabiah yang umum. Tidak ditambahkan catatan kaki karena alternatif leksikal συνθλίβοντά telah tercakup secara ringkas dalam frasa “berdesak-desakan menghimpit” tanpa perlu membebani ayat.
