  text: καὶ ἐπηρώτα αὐτόν· Τί ⸂ὄνομά σοι⸃; καὶ ⸂λέγει αὐτῷ⸃· ⸀Λεγιὼν ὄνομά μοι, ὅτι πολλοί ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/009.yaml
  text: And he was asking him, “What is your name?” And he says to him, “My name is Legion,[a] because we are many.”
translation:
  language: id
  text: Ia terus bertanya kepadanya, “Siapa namamu?” Lalu ia berkata kepadanya, “Namaku Legion,[a] karena kami banyak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Legion” adalah istilah militer Latin yang diserap ke dalam bahasa Yunani dan menunjuk pada satuan besar tentara Romawi. Di sini istilah itu menjadi nama yang dinyatakan oleh roh jahat itu dan menyiratkan jumlah yang sangat banyak.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτα
  choice: terus bertanya
  rationale: Bentuk imperfek menyatakan tindakan yang sedang berlangsung atau dilakukan berulang; 'terus bertanya' mempertahankan nuansa aspek itu secara alami dalam bahasa Indonesia.
- source_word: Τί ὄνομά σοι
  choice: Siapa namamu?
  rationale: Ini merupakan ungkapan Indonesia yang paling alami untuk menanyakan nama seseorang, sekaligus mempertahankan kelangsungan dan ketegasan pertanyaan Yunani.
- source_word: λέγει αὐτῷ
  choice: ia berkata kepada-Nya
  rationale: Present historis Yunani menghidupkan narasi, tetapi bentuk lampau naratif lebih alami dalam bahasa Indonesia. Huruf kapital pada '-Nya' memperjelas bahwa jawaban ditujukan kepada Yesus tanpa menambahkan nama yang tidak ada dalam teks.
- source_word: Λεγιὼν
  choice: Legion
  rationale: Istilah ini dipertahankan sebagai nama atau sebutan yang dinyatakan oleh roh itu, bukan diterjemahkan sebagai nomina umum.
- source_word: ὄνομά μοι
  choice: Namaku
  rationale: Padanan idiomatis dan ringkas bagi konstruksi nominal Yunani dengan pronomina datif.
- source_word: ὅτι πολλοί ἐσμεν
  choice: karena kami banyak
  rationale: ὅτι memberikan alasan bagi nama tersebut. Bentuk orang pertama jamak dipertahankan karena penting bagi peralihan dari satu pembicara kepada banyak roh.
theological_decisions:
- issue: Peralihan rujukan diri dari tunggal ke jamak
  choice: Mempertahankan bentuk tunggal 'Namaku Legion' dan bentuk jamak 'kami banyak'.
  alternative: Menghaluskan ketegangan menjadi 'Nama kami Legion'.
  rationale: Teks Yunani sengaja memuat peralihan dramatis dari pengenalan diri tunggal ke penjelasan jamak. Terjemahan tidak boleh menyelaraskan atau meniadakan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. 'Terus bertanya' menjaga aspek imperfek tanpa terdengar kaku. Istilah asing 'Legion' dipertahankan dan dijelaskan melalui catatan kaki.
