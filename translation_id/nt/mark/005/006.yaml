  source_fidelity: 'Terjemahan dengan tepat menyampaikan urutan dasar Yunani: melihat Yesus dari jauh, lalu berlari dan melakukan προσκυνέω kepada-Nya. “Ketika melihat” adalah pengungkapan temporal yang wajar untuk partisip aoristus ἰδών dan tidak menambahkan sebab. “Dari jauh” cocok untuk ἀπὸ μακρόθεν. Penambahan “orang itu” secara tepat memperjelas subjek yang tersirat dari konteks sebelumnya tanpa mengubah makna.'
