id: MRK.5.6
reference: Mark 5:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν ἀπὸ μακρόθεν ἔδραμεν καὶ προσεκύνησεν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/006.yaml
  text: And seeing Jesus from a distance[a], he ran and bowed down before him,
translation:
  language: id
  text: Ketika melihat Yesus dari jauh, orang itu berlari dan sujud di hadapan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyembah-Nya” atau “memberi hormat kepada-Nya.” Kata kerja Yunani yang digunakan dapat berarti menyembah atau melakukan tindakan bersujud sebagai penghormatan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: ketika melihat
  rationale: Partisip aoristus dari ὁράω menyatakan tindakan yang mendahului atau menyertai tindakan utama. Klausa temporal ini alami dalam bahasa Indonesia dan tidak menambahkan gagasan sebab.
- source_word: ἀπὸ μακρόθεν
  choice: dari jauh
  rationale: Ungkapan ini menyatakan jarak secara lugas dan alami dalam bahasa Indonesia modern.
- source_word: ἔδραμεν
  choice: berlari
  rationale: Bentuk aoristus dari τρέχω secara langsung berarti berlari; pilihan ini tidak menambahkan intensitas seperti 'bergegas'.
- source_word: προσεκύνησεν αὐτόν
  choice: sujud di hadapan-Nya
  rationale: προσκυνέω dapat menunjuk pada tindakan bersujud, memberi hormat, atau menyembah. Pilihan utama mempertahankan tindakan lahiriah tanpa memastikan apakah tindakan itu merupakan penyembahan dalam arti penuh.
- source_word: καὶ
  choice: dan
  rationale: Mempertahankan koordinasi naratif sederhana khas Markus, meskipun καί pertama diwujudkan secara alami melalui klausa 'Ketika melihat'.
- source_word: τὸν Ἰησοῦν
  choice: Yesus
  rationale: Nama diri diterjemahkan secara biasa tanpa artikel dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah προσεκύνησεν harus diterjemahkan secara tegas sebagai tindakan menyembah Yesus
  choice: sujud di hadapan-Nya
  alternative: menyembah-Nya; memberi hormat kepada-Nya
  rationale: Kata kerja Yunani tersebut dapat menyatakan penyembahan maupun tindakan bersujud atau penghormatan. Dalam konteks ini, terjemahan utama mempertahankan ketegangan leksikal dan teologis tanpa menetapkan satu nuansa secara berlebihan; alternatifnya dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Orang itu' memasok subjek tersirat dari konteks agar kalimat alami dan jelas; rujukannya adalah orang yang kerasukan dalam narasi sebelumnya. Bentuk 'sujud di hadapan-Nya' menjaga ambiguitas προσκυνέω.
