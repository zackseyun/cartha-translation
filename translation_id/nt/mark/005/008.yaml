  text: ἔλεγεν γὰρ αὐτῷ· Ἔξελθε τὸ πνεῦμα τὸ ἀκάθαρτον ἐκ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/008.yaml
  text: For he was saying to him[a], “Come out of the man, unclean spirit.”
translation:
  language: id
  text: Sebab Yesus sedang berkata kepadanya, “Keluarlah dari orang itu, hai roh najis!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: sebelumnya ... berkata
  rationale: Bentuk imperfek memberi latar bagi tindakan pada ayat sebelumnya. Dalam bahasa Indonesia, 'sebelumnya ... berkata' menyampaikan hubungan lampau dan duratif secara alami tanpa harus memakai bentuk kaku seperti 'sedang berkata'.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ menjelaskan alasan bagi kejadian pada ayat sebelumnya; 'sebab' mempertahankan hubungan penjelas itu secara ringkas.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Pronomina datif tunggal dipertahankan tanpa menentukan secara berlebihan apakah acuannya dipahami sebagai orang itu atau roh najis; konteks langsung memperlihatkan bahwa perintah ditujukan kepada roh.
- source_word: Ἔξελθε
  choice: Keluarlah
  rationale: Imperatif aoris ini merupakan perintah langsung untuk keluar. 'Keluarlah' adalah bentuk Indonesia yang alami dan tegas.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: hai roh najis
  rationale: Walaupun secara bentuk memakai nominatif berartikel, frasa ini berfungsi sebagai sapaan langsung. Partikel 'hai' menandai fungsi vokatif dengan jelas dan bermartabat.
- source_word: ἐκ τοῦ ἀνθρώπου
  choice: dari orang ini
  rationale: ἐκ menyatakan gerak keluar dari dalam, sedangkan ἄνθρωπος menunjuk kepada orang tertentu dalam adegan tersebut. 'Dari orang ini' alami dalam perintah bahasa Indonesia dan tidak menambahkan nama atau identitas.
theological_decisions:
- issue: Terjemahan πνεῦμα ἀκάθαρτον dalam konteks pengusiran roh
  choice: roh najis
  alternative: roh jahat
  rationale: Teks Yunani secara eksplisit menyebut 'roh najis'. 'Roh jahat' merupakan penafsiran yang mengurangi nuansa kenajisan yang terdapat dalam ungkapan Injil.
- issue: Acuan αὐτῷ
  choice: kepadanya
  alternative: kepada roh itu
  rationale: Terjemahan mempertahankan pronomina Yunani dan ketegangan naratifnya, sementara isi perintah menjelaskan bahwa roh najis adalah pihak yang diperintahkan keluar.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan fungsi penjelas γάρ, latar imperfek ἔλεγεν, serta sapaan langsung kepada roh najis.
