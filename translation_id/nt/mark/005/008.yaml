revisions:
- from: Sebab sebelumnya Yesus berkata kepadanya, “Keluarlah dari orang ini, hai roh najis!”
  to: Sebab Yesus sedang berkata kepadanya, “Keluarlah dari orang itu, hai roh najis!”
  rationale: The revision removes the unsupported temporal adverb “sebelumnya,” represents the imperfect with “sedang berkata,” and changes the added deictic “ini” to the contextually definite “itu.” It retains the source-close terminology “roh najis,” the direct imperative, and the Greek ambiguity of “kepadanya.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T04:36:34Z'
review_pass:
  verdict: revise
  source_fidelity: γάρ is correctly rendered by “Sebab,” and “kepadanya” appropriately preserves the Greek dative's narrative ambiguity. “Keluarlah ... hai roh najis” faithfully conveys the imperative and the vocative-like force of τὸ πνεῦμα τὸ ἀκάθαρτον. However, “sebelumnya” adds a temporal-sequential element not expressed by ἔλεγεν. The imperfect supplies ongoing/background action (“sedang berkata”), while γάρ explains the preceding narration; neither word specifically means “previously.” “Orang ini” likewise introduces deictic emphasis (“this”) absent from τοῦ ἀνθρώπου; “orang itu” is the natural contextual Indonesian rendering of the definite referent.
  naturalness: The draft is generally clear and suitably dignified. “Sebab Yesus sedang berkata kepadanya” is natural modern Indonesian narrative prose and better represents the imperfect than “Sebab sebelumnya Yesus berkata kepadanya.” “Keluarlah dari orang itu, hai roh najis!” is idiomatic and clear.
  terminology: '“Roh najis” is the established, source-close rendering of πνεῦμα ἀκάθαρτον and should be retained. The vocative particle “hai” is acceptable in a solemn direct command. No footnote is required: Indonesian wording can preserve both the pronoun ambiguity and direct address without an explanatory note.'
  issues:
  - severity: medium
    issue: “sebelumnya” overtranslates ἔλεγεν.
    rationale: The imperfect ἔλεγεν indicates ongoing or repeated past speech in narrative background. “Sebelumnya” asserts a prior temporal relation not explicitly encoded in the Greek and weakens the imperfect aspect.
  - severity: low
    issue: “orang ini” adds deictic emphasis absent from τοῦ ἀνθρώπου.
    rationale: The Greek definite article identifies the man in the narrative, not explicitly “this man.” “Orang itu” better reflects the contextual definite reference in Indonesian.
  revised_text: Sebab Yesus sedang berkata kepadanya, “Keluarlah dari orang itu, hai roh najis!”
  revised_footnotes: []
  revision_rationale: The revision removes the unsupported temporal adverb “sebelumnya,” represents the imperfect with “sedang berkata,” and changes the added deictic “ini” to the contextually definite “itu.” It retains the source-close terminology “roh najis,” the direct imperative, and the Greek ambiguity of “kepadanya.”
