base_translation:
  language: en
  yaml_path: translation/nt/mark/005/001.yaml
  text: And they came to the other side of the sea[a], to the region of the Gerasenes.
translation:
  language: id
  text: Lalu mereka tiba di seberang danau, di daerah orang Gerasa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah memuat “daerah orang Gadara”; naskah-naskah lain memuat “daerah orang Gergesa.”
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ
  choice: Lalu
  rationale: Kata penghubung ini meneruskan alur narasi khas Markus. Dalam bahasa Indonesia modern, “Lalu” lebih alami daripada memulai kalimat dengan “Dan”, tanpa menambahkan hubungan sebab-akibat.
- source_word: ἦλθον
  choice: sampailah mereka
  rationale: Bentuk jamak menunjuk kepada Yesus dan para pengikut yang menyertai-Nya dalam konteks sebelumnya. “Sampailah” menyampaikan tibanya mereka di tujuan setelah penyeberangan.
- source_word: εἰς τὸ πέραν τῆς θαλάσσης
  choice: di seberang danau
  rationale: Ungkapan ini menunjuk ke sisi seberang Danau Galilea. “Danau” menyatakan jenis perairan yang dimaksud secara akurat dan wajar dalam bahasa Indonesia, meskipun θάλασσα secara leksikal juga dapat diterjemahkan “laut”.
- source_word: εἰς τὴν χώραν
  choice: di daerah
  rationale: χώρα di sini berarti wilayah atau kawasan, bukan negara dalam pengertian modern. “Daerah” jelas dan alami.
- source_word: Γερασηνῶν
  choice: orang Gerasa
  rationale: Bentuk gentilik jamak ini berarti penduduk atau orang-orang yang terkait dengan Gerasa. Ungkapan “orang Gerasa” lebih mudah dipahami pembaca Indonesia daripada transliterasi adjektival yang tidak lazim.
theological_decisions:
- issue: Variasi tekstual dan geografis nama tempat dalam kisah orang yang kerasukan
  choice: orang Gerasa
  alternative: orang Gadara; orang Gergesa
  rationale: Teks SBLGNT berbunyi Γερασηνῶν. Teks utama mengikuti sumber Yunani tersebut, sementara bacaan penting lainnya dipertahankan dalam catatan kaki tanpa mencoba menyelesaikan persoalan geografis secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan gerak narasi Markus, tetapi menghindari bentuk yang terasa kaku. Penanda catatan kaki ditempatkan langsung sesudah nama yang memiliki variasi tekstual.
