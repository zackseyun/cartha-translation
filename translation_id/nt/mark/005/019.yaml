  terminology: “Tuhan” mempertahankan κύριος tanpa menetapkan rujukannya sebagai “Allah.” “Berbelas kasihan” menyampaikan ἠλέησέν dengan baik dan lebih netral daripada “mengasihani,” yang dalam pemakaian modern dapat bernuansa merendahkan.
