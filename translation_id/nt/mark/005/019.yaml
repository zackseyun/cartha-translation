revisions:
- from: Namun, Yesus tidak mengizinkannya, melainkan berkata kepadanya, “Pulanglah kepada orang-orangmu[a] dan ceritakanlah kepada mereka betapa besar yang telah Tuhan lakukan bagimu dan bagaimana Ia telah mengasihani engkau.”[b]
  to: Namun, Yesus tidak mengizinkannya, melainkan berkata kepadanya, “Pulanglah ke rumahmu, kepada orang-orangmu sendiri[a], dan ceritakanlah kepada mereka segala sesuatu yang telah Tuhan[b] lakukan bagimu dan bahwa Ia telah berbelas kasihan kepadamu.”
  rationale: Revisi memulihkan “ke rumahmu” yang eksplisit dalam teks Yunani, memperbaiki ungkapan yang tidak gramatikal untuk ὅσα dengan “segala sesuatu yang,” dan menggunakan “berbelas kasihan” untuk ἠλέησέν. Istilah “Tuhan” serta ambiguitas teologisnya dipertahankan, dan penanda catatan dipindahkan ke kata yang dijelaskan.
