  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀καὶ οὐκ ἀφῆκεν αὐτόν, ἀλλὰ λέγει αὐτῷ· Ὕπαγε εἰς τὸν οἶκόν σου πρὸς τοὺς σούς, καὶ ⸀ἀπάγγειλον αὐτοῖς ὅσα ⸂ὁ κύριός σοι⸃ πεποίηκεν καὶ ἠλέησέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/019.yaml
  text: And he did not permit him[a], but said to him, “Go to your home, to your own people[c][b], and report to them how much the Lord has done for you and has shown mercy to you.”
translation:
  language: id
  text: Namun, Yesus tidak mengizinkannya, melainkan berkata kepadanya, “Pulanglah ke rumahmu, kepada orang-orangmu sendiri[a], dan ceritakanlah kepada mereka segala sesuatu yang telah Tuhan[b] lakukan bagimu dan bahwa Ia telah berbelas kasihan kepadamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepada orang-orangmu sendiri.” Ungkapan ini dapat mencakup keluarga, kerabat, dan orang-orang dekatnya.
    reason: lexical_alternative
  - marker: b
    text: Sebutan “Tuhan” di sini dapat dipahami secara khusus sebagai Allah. Namun, susunan kisah ini juga mempertahankan kaitan antara belas kasihan Tuhan dan tindakan serta kuasa Yesus sendiri.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφῆκεν
  choice: tidak mengizinkannya
  rationale: Dalam konteks ini ἀφίημι berarti mengizinkan, bukan mengampuni atau meninggalkan. Bentuk dengan pronomina mempertahankan objek αὐτόν.
- source_word: λέγει
  choice: berkata
  rationale: Kala kini historis Yunani dialihkan ke bentuk naratif Indonesia yang alami tanpa mengubah makna.
- source_word: Ὕπαγε εἰς τὸν οἶκόν σου
  choice: Pulanglah
  rationale: Tujuannya adalah rumah orang itu sendiri; 'pulanglah' secara alami menyampaikan gerak kembali ke rumah, tanpa pengulangan yang kaku.
- source_word: πρὸς τοὺς σούς
  choice: kepada orang-orangmu
  rationale: Ungkapan harfiahnya 'kepada milikmu/orang-orangmu'. Pilihan ini mempertahankan cakupan yang dapat meliputi keluarga, kerabat, dan orang dekat.
- source_word: ἀπάγγειλον
  choice: ceritakanlah
  rationale: Kata ini berarti menyampaikan atau melaporkan kabar. 'Ceritakanlah' alami dalam bahasa Indonesia untuk memberi tahu orang dekat mengenai apa yang telah terjadi.
- source_word: ὅσα
  choice: betapa besar yang
  rationale: Dalam konstruksi ini ὅσα menyatakan isi sekaligus besarnya tindakan. Ungkapan ini menjaga nuansa keluasan tindakan, meski 'segala sesuatu yang' juga mungkin.
- source_word: ὁ κύριός σοι πεποίηκεν
  choice: yang telah Tuhan lakukan bagimu
  rationale: σοι dipahami sebagai datif penerima manfaat, yakni 'bagimu', sedangkan κύριος diterjemahkan secara baku sebagai 'Tuhan'.
- source_word: ἠλέησέν σε
  choice: bagaimana Ia telah mengasihani engkau
  rationale: Mempertahankan tindakan belas kasihan sebagai klausa tersendiri dan menjaga bobot istilah ἐλεάω.
theological_decisions:
- issue: Rujukan κύριος setelah tindakan penyembuhan dan pembebasan oleh Yesus
  choice: Tuhan
  alternative: Allah
  rationale: Teks Yunani memakai κύριος. 'Tuhan' mempertahankan kemungkinan bahwa perkataan itu menunjuk kepada Allah sekaligus gema hubungan antara belas kasihan Tuhan dan tindakan Yesus, tanpa memutuskan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Pulanglah' dipilih untuk menghindari ungkapan kaku 'pergilah ke rumahmu', sedangkan 'orang-orangmu' sengaja dibiarkan luas. Pronomina hormat 'Ia' dipakai untuk rujukan kepada Tuhan.
