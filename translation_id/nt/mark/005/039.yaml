  text: καὶ εἰσελθὼν λέγει αὐτοῖς· Τί θορυβεῖσθε καὶ κλαίετε; τὸ παιδίον οὐκ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/039.yaml
  text: And after entering, he says to them, “Why are you making a commotion and weeping? The child has not died, but is sleeping.”
translation:
  language: id
  text: Setelah masuk, Ia berkata kepada mereka, “Mengapa kalian ribut dan menangis? Anak itu tidak mati, tetapi sedang tidur.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Anak itu tidak mati, tetapi tidur.” Dalam konteks pembangkitan yang akan segera terjadi, perkataan Yesus mungkin memakai “tidur” sebagai kiasan untuk kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: Setelah masuk
  rationale: Partisip aoristis ini menyatakan tindakan yang mendahului kata kerja utama; bentuk ini alami dalam bahasa Indonesia tanpa menambahkan tempat yang tidak disebutkan dalam ayat.
- source_word: λέγει
  choice: Ia berkata
  rationale: Bahasa Indonesia tidak menandai kala pada bentuk kata kerja. Ungkapan ini alami dalam narasi dan tidak perlu memaksakan pembedaan antara kala kini historis dan lampau.
- source_word: Τί
  choice: Mengapa
  rationale: Dalam pertanyaan teguran ini, Τί berfungsi idiomatis untuk menanyakan alasan, sehingga 'Mengapa' paling tepat.
- source_word: θορυβεῖσθε
  choice: kalian ribut
  rationale: Kata ini menunjuk pada kegaduhan atau keributan yang dilakukan orang banyak. 'Ribut' ringkas, alami, dan mempertahankan unsur bunyi dalam suasana perkabungan.
- source_word: κλαίετε
  choice: menangis
  rationale: '''Menangis'' merupakan padanan Indonesia yang alami dan bermartabat tanpa mempersempit makna menjadi ratapan ritual.'
- source_word: παιδίον
  choice: Anak itu
  rationale: παιδίον berarti 'anak' dan tidak menyatakan jenis kelamin secara gramatikal dalam ayat ini, meskipun konteks menunjukkan bahwa anak tersebut perempuan.
- source_word: οὐκ ἀπέθανεν
  choice: tidak mati
  rationale: Padanan ini mempertahankan pernyataan verbal Yunani secara langsung dan tidak mengubahnya menjadi ungkapan keadaan seperti 'tidak dalam keadaan mati'.
- source_word: καθεύδει
  choice: sedang tidur
  rationale: Bentuk ini alami untuk tindakan yang tengah berlangsung dan mempertahankan bahasa tidur tanpa menafsirkannya secara eksplisit.
theological_decisions:
- issue: Apakah ucapan Yesus harus dipahami sebagai penyangkalan harfiah atas kematian atau sebagai bahasa metaforis tentang tidur
  choice: Mempertahankan pernyataan 'tidak mati, tetapi sedang tidur' tanpa penjelasan interpretatif dalam teks utama.
  alternative: Menjelaskannya sebagai 'tidak mati untuk selamanya' atau 'seolah-olah hanya tidur karena akan dibangkitkan'.
  rationale: Teks Yunani menyajikan kontras itu secara tegas, sedangkan konteks kebangkitan yang segera terjadi memungkinkan bahasa tidur dipahami secara metaforis atau antisipatif. Terjemahan tidak seharusnya menyelesaikan ketegangan tersebut secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. 'Kalian' dipakai karena Yesus berbicara kepada beberapa orang; 'Ia' mempertahankan ragam hormat yang lazim tanpa memasukkan tafsiran tambahan.
