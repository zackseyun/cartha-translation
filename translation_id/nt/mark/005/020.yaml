base_translation:
  language: en
  yaml_path: translation/nt/mark/005/020.yaml
  text: And he went away and began to proclaim in the Decapolis how much Jesus had done for him[a], and everyone was amazed.
translation:
  language: id
  text: Lalu orang itu pergi dan mulai memberitakan di Dekapolis betapa banyak yang telah Yesus lakukan baginya[a], dan semua orang takjub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “segala sesuatu yang telah Yesus lakukan baginya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: pergi
  rationale: Bentuk aoristus dari ἀπέρχομαι menyatakan bahwa orang itu meninggalkan tempat tersebut; “pergi” alami dalam bahasa Indonesia modern.
- source_word: ἤρξατο κηρύσσειν
  choice: mulai memberitakan
  rationale: Konstruksi ini menyatakan permulaan suatu tindakan. “Memberitakan” mempertahankan gagasan penyampaian secara terbuka tanpa mengesankan khotbah formal.
- source_word: ἐν τῇ Δεκαπόλει
  choice: di Dekapolis
  rationale: ἐν paling langsung berarti “di”; Dekapolis adalah nama kawasan yang terdiri atas sepuluh kota.
- source_word: ὅσα
  choice: betapa banyak
  rationale: ὅσα dapat menunjuk pada banyaknya atau besarnya hal-hal yang dilakukan. Pilihan ini mempertahankan nuansa tersebut tanpa menambahkan penilaian yang tidak dinyatakan secara eksplisit.
- source_word: ἐποίησεν αὐτῷ
  choice: yang telah Yesus lakukan baginya
  rationale: Datif αὐτῷ dalam konteks ini menunjukkan tindakan demi atau untuk kepentingan orang itu. “Telah” menandai bahwa tindakan Yesus mendahului pemberitaannya.
- source_word: πάντες
  choice: semua orang
  rationale: Pilihan idiomatis ini menyampaikan acuan manusia kolektif dari πάντες tanpa mengubah cakupannya.
- source_word: ἐθαύμαζον
  choice: merasa takjub
  rationale: Imperfek menggambarkan reaksi takjub yang berlangsung atau berulang; ungkapan ini alami dan jelas bagi pembaca Indonesia modern.
- source_word: ὁ Ἰησοῦς
  choice: Yesus
  rationale: Nama pribadi ditulis menurut bentuk baku bahasa Indonesia.
theological_decisions:
- issue: Cakupan pemberitaan orang itu dalam kaitannya dengan identitas Yesus
  choice: Ayat diterjemahkan sebagai laporan langsung bahwa orang itu memberitakan apa yang telah Yesus lakukan baginya.
  alternative: Memperluas terjemahan dengan penjelasan teologis eksplisit tentang otoritas ilahi Yesus.
  rationale: Teks menyiratkan kuasa Yesus yang luar biasa, tetapi tidak merumuskan kesimpulan doktrinal dalam ayat ini; terjemahan mempertahankan klaim naratif tanpa penambahan tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan narasi, nama kawasan Dekapolis, serta ambiguitas wajar ὅσα antara banyaknya dan keseluruhan tindakan.
