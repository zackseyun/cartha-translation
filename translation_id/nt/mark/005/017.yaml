  text: καὶ ἤρξαντο παρακαλεῖν αὐτὸν ἀπελθεῖν ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/017.yaml
  text: And they began to beg him to leave their region[a].
translation:
  language: id
  text: Lalu mereka mulai memohon kepada-Nya supaya Dia meninggalkan wilayah mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mendesak-Nya agar pergi dari daerah mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Dalam alur narasi, καί menghubungkan tindakan ini dengan peristiwa sebelumnya. “Lalu” merupakan penghubung naratif yang alami tanpa mengubah urutan kejadian.
- source_word: ἤρξαντο
  choice: mulai
  rationale: Bersama infinitif, bentuk ini menyatakan awal suatu tindakan; “mulai” adalah padanan langsung dan alami.
- source_word: παρακαλεῖν
  choice: memohon
  rationale: Konteks menunjukkan permintaan yang sungguh-sungguh dan mendesak. “Memohon” menyampaikan intensitas itu dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: αὐτὸν
  choice: kepada-Nya
  rationale: Pronomina ini merujuk kepada Yesus sebagai pihak yang menjadi sasaran permohonan. Bentuk “-Nya” mengikuti kebiasaan penulisan bahasa Indonesia untuk rujukan kepada Yesus.
- source_word: ἀπελθεῖν
  choice: supaya Dia meninggalkan
  rationale: Infinitif menyatakan isi permohonan mereka. Konstruksi “supaya Dia meninggalkan” jelas dan alami dalam bahasa Indonesia.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: wilayah mereka
  rationale: ὅρια secara harfiah berkaitan dengan batas-batas, tetapi dalam ungkapan ini menunjuk pada kawasan atau teritori di dalam batas tersebut. “Wilayah mereka” menyampaikan makna idiomatisnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Memohon” mempertahankan kekuatan παρακαλεῖν, sedangkan catatan kaki mencatat alternatif “mendesak.”
