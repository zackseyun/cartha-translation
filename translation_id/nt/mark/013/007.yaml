  verdict: revise
  source_fidelity: Draf ini pada umumnya setia pada teks Yunani. “Kabar tentang peperangan” dengan tepat mempertahankan keluasan ἀκοὰς πολέμων, dan “harus terjadi” menyampaikan δεῖ tanpa menambahkan penjelasan teologis. Namun, “kesudahannya” dapat dibaca sebagai akhir dari peperangan/peristiwa-peristiwa tersebut, sedangkan τὸ τέλος menunjuk kepada “akhir itu” secara eskatologis dan tidak memakai penanda posesif.
  naturalness: Bahasa draf jelas, modern, dan bernada layak. “Janganlah gelisah” merupakan padanan yang alami untuk larangan agar tidak menjadi terguncang atau cemas. “Akhir itu belum tiba” juga alami dalam bahasa Indonesia modern dan lebih tepat daripada bentuk posesif “kesudahannya.”
  terminology: “Peperangan,” “kabar,” dan “harus terjadi” sesuai dengan register dan istilah penting nas ini. “Akhir itu” mempertahankan ketakterperincian τὸ τέλος tanpa mengidentifikasikannya dengan suatu skema eskatologis tertentu.
  issues:
