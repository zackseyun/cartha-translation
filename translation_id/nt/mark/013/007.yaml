  text: ὅταν δὲ ⸀ἀκούσητε πολέμους καὶ ἀκοὰς πολέμων, μὴ θροεῖσθε· ⸀δεῖ γενέσθαι, ἀλλ’ οὔπω τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/007.yaml
  text: And when you hear of wars and reports of wars[a], do not be alarmed; these things must happen, but the end is not yet.
translation:
  language: id
  text: Ketika kamu mendengar tentang peperangan dan kabar tentang peperangan[a], janganlah gelisah. Semua itu harus terjadi, tetapi akhir itu belum tiba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “desas-desus tentang peperangan.” Kata Yunani yang digunakan dapat berarti kabar, laporan, atau desas-desus yang terdengar mengenai peperangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ketika
  rationale: ὅταν menyatakan waktu yang bersifat mendatang atau berulang, sedangkan δέ merupakan penghubung ringan yang tidak perlu selalu dinyatakan tersendiri dalam bahasa Indonesia.
- source_word: ἀκούσητε
  choice: kamu mendengar tentang
  rationale: Bentuk aorist subjunctive setelah ὅταν paling alami diterjemahkan dengan bentuk kini dalam klausa waktu yang mengarah ke masa depan; 'tentang' menghubungkan verba ini secara idiomatis dengan objek berikutnya.
- source_word: πολέμους
  choice: peperangan
  rationale: Padanan Indonesia yang baku dan alami bagi bentuk jamak πόλεμος dalam konteks konflik-konflik bersenjata.
- source_word: ἀκοὰς πολέμων
  choice: kabar tentang peperangan
  rationale: ἀκοή dapat berarti kabar, laporan, atau sesuatu yang didengar. 'Kabar' mempertahankan keluasan makna tanpa menyiratkan bahwa beritanya pasti belum terverifikasi.
- source_word: μὴ θροεῖσθε
  choice: janganlah gelisah
  rationale: θροέομαι menunjuk pada keadaan terguncang, cemas, atau gentar. 'Janganlah gelisah' alami, bermartabat, dan tidak membatasi maknanya pada rasa takut saja.
- source_word: δεῖ γενέσθαι
  choice: Semuanya itu harus terjadi
  rationale: δεῖ menyatakan keharusan dan γενέσθαι berarti terjadi. Subjek 'semuanya itu' dipasok dari konteks dan merujuk pada peperangan serta kabarnya.
- source_word: ἀλλ’ οὔπω τὸ τέλος
  choice: tetapi kesudahannya belum tiba
  rationale: τέλος dalam konteks ini menunjuk pada kesudahan yang dinantikan. Penambahan 'tiba' menghasilkan kalimat Indonesia yang alami tanpa menentukan rincian kerangka eskatologis.
theological_decisions:
- issue: Keharusan eskatologis dalam δεῖ γενέσθαι
  choice: harus terjadi
  alternative: perlu terjadi
  rationale: Kata 'harus' mempertahankan daya keharusan dalam δεῖ, tetapi tidak menjelaskan mekanismenya atau memasukkan suatu sistem akhir zaman tertentu.
- issue: Makna τὸ τέλος
  choice: kesudahannya
  alternative: akhir itu
  rationale: '''Kesudahan'' mempertahankan rujukan eskatologis yang tersirat oleh konteks tanpa menjabarkan peristiwa mana yang dimaksud. Akhiran ''-nya'' mengaitkannya secara alami dengan rangkaian peristiwa yang sedang dibicarakan tanpa meniadakan ketegangan makna.'
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Bentuk 'janganlah' mempertahankan nada ajaran yang khidmat, sedangkan pilihan 'kabar' menghindari kesan bahwa semua berita tersebut pasti hanya rumor.
