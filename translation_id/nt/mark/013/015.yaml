  text: ⸀ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω μηδὲ εἰσελθάτω ⸂τι ἆραι⸃ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/015.yaml
  text: Let the one on the housetop not go down[a], nor enter to take anything out of his house.
translation:
  language: id
  text: Orang yang berada di atap rumah[a] janganlah turun dan jangan masuk ke dalam rumah untuk mengambil apa pun dari rumahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah bagian atap rumah yang datar dan dapat diakses, yang sering digunakan sebagai ruang kegiatan.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: orang yang berada di atap rumah
  rationale: Frasa berartikel ini berfungsi sebagai nomina dan menunjuk kepada siapa pun yang berada di tempat tersebut. Bentuk ini alami dalam bahasa Indonesia serta mempertahankan acuan tunggal generik.
- source_word: δώματος
  choice: atap rumah
  rationale: Dalam latar Yudea, yang dimaksud ialah atap datar yang dapat diakses dan kerap dimanfaatkan sebagai ruang kegiatan. 'Atap rumah' lebih jelas daripada sekadar 'atap'.
- source_word: μὴ καταβάτω
  choice: janganlah turun
  rationale: Imperatif orang ketiga yang bersifat melarang diterjemahkan secara alami dengan 'janganlah'. 'Turun' mempertahankan gerak dari atap ke bagian bawah.
- source_word: μηδὲ εἰσελθάτω
  choice: ataupun masuk
  rationale: μηδέ menghubungkan larangan kedua dengan larangan pertama. 'Ataupun' menegaskan bahwa kedua tindakan sama-sama dilarang tanpa menambahkan tujuan yang tidak dinyatakan.
- source_word: τι ἆραι
  choice: untuk mengambil sesuatu
  rationale: Infinitif menyatakan tujuan, sedangkan τι bersifat tak tentu. 'Sesuatu' mempertahankan keluasan larangan tanpa menentukan barang tertentu.
- source_word: ἐκ τῆς οἰκίας αὐτοῦ
  choice: dari rumahnya
  rationale: '''Dari rumahnya'' secara alami menyatakan pengambilan barang dari dalam rumah. Akhiran ''-nya'' mempertahankan acuan orang ketiga tunggal tanpa memaksakan gender yang tidak perlu dinyatakan dalam tata bahasa Indonesia.'
theological_decisions:
- issue: Bentuk maskulin tunggal representatif dalam perintah yang berlaku umum
  choice: rumahnya
  alternative: rumah orang itu
  rationale: Bahasa Yunani memakai bentuk maskulin tunggal dengan daya umum. Bahasa Indonesia tidak menandai gender pada pronomina orang ketiga; 'rumahnya' mempertahankan bentuk tunggal dan cakupan umum tanpa menambahkan atau menghapus acuan gender secara tidak wajar.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada mendesak. 'Janganlah' memberi bobot perintah yang pantas bagi konteks nubuat, sementara susunan kalimat tetap mudah dipahami pembaca umum.
