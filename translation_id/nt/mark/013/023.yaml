  source_fidelity: Teks Yunani menempatkan ὑμεῖς secara eksplisit dan kontrasif, diikuti imperatif kini βλέπετε, lalu perfect προείρηκα dengan πάντα. Terjemahan perlu mempertahankan seruan langsung untuk tetap berjaga/waspada serta pemberitahuan sebelumnya yang masih relevan. “Harus waspada” menyampaikan gagasan umum, tetapi mengubah imperatif langsung menjadi pernyataan kewajiban.
  naturalness: “Tetapi kalian, waspadalah” merupakan Bahasa Indonesia modern yang lugas, alami, dan sesuai dengan register peringatan Yesus. “Aku sudah mengatakan semuanya kepada kalian sebelumnya” juga lebih idiomatis daripada susunan “memberitahukan semuanya kepada kalian sebelumnya,” sambil tetap menyatakan unsur ‘terlebih dahulu’.
  terminology: Tidak ada istilah teologis teknis atau nama yang memerlukan penyesuaian. “Semuanya” mempertahankan keluasan πάντα tanpa memutuskan apakah cakupannya setiap rincian atau seluruh hal yang relevan dalam konteks.
