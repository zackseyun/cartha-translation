  text: But you[a], watch out[b]; I have told you all things beforehand.
translation:
  language: id
  text: Tetapi kalian, waspadalah[a]! Aku sudah mengatakan semuanya kepada kalian sebelumnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berjaga-jagalah” atau “perhatikanlah baik-baik.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Aku sudah memberitahukan semuanya kepada kalian terlebih dahulu” atau “Aku sudah memperingatkan kalian tentang semuanya sebelumnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: Namun, kalian
  rationale: Pronomina jamak yang dinyatakan secara eksplisit memberi penekanan kontras; “kalian” mempertahankan bentuk jamak yang jelas, sedangkan “namun” menyampaikan peralihan bernada kontras.
- source_word: βλέπετε
  choice: harus waspada
  rationale: Imperatif kini ini dalam konteks peringatan menyerukan kewaspadaan berkelanjutan; bentuk ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “lihatlah”.
- source_word: προείρηκα
  choice: sudah memberitahukan ... sebelumnya
  rationale: Verba perfek menyatakan pemberitahuan yang telah diberikan dan tetap relevan, sedangkan unsur προ- dipertahankan melalui “sebelumnya”.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: Datif menunjukkan penerima perkataan; frasa ini alami dan tetap memperlihatkan bahwa para murid adalah penerimanya.
- source_word: πάντα
  choice: semuanya
  rationale: Menyampaikan cakupan menyeluruh dari bentuk netral jamak tanpa menentukan secara berlebihan apakah yang dimaksud setiap detail atau semua hal yang relevan dalam konteks.
theological_decisions:
- issue: Cakupan pemberitahuan Yesus sebelumnya
  choice: “semuanya” dibiarkan memiliki cakupan yang ditentukan oleh konteks
  alternative: Menjelaskannya sebagai “semua peringatan ini” atau sebagai setiap rincian masa depan tanpa kecuali
  rationale: πάντα bersifat menyeluruh, tetapi ayat ini tidak secara eksplisit menentukan batas cakupannya. Terjemahan mempertahankan ketegangan itu dan tidak menambahkan penafsiran yang mempersempit atau memperluasnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai untuk menandai orang kedua jamak secara jelas; “harus waspada” menyampaikan daya imperatif secara alami. Semua penanda catatan kaki muncul dalam teks utama.
