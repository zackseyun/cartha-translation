  - severity: low
    issue: Pilihan “memberitahukan” kurang langsung untuk προείρηκα.
    rationale: προείρηκα secara dasar berarti ‘telah mengatakan/memberitahukan sebelumnya’. “Mengatakan semuanya ... sebelumnya” lebih dekat dengan verba sumber dan lebih luwes dalam ragam Indonesia modern.
