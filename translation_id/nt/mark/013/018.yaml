id: MRK.13.18
reference: Mark 13:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: προσεύχεσθε δὲ ἵνα μὴ ⸀γένηται χειμῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/018.yaml
  text: But pray that it may not happen in winter[a].
translation:
  language: id
  text: Namun, berdoalah supaya itu tidak terjadi pada musim dingin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih eksplisit sesuai konteks, “supaya pelarianmu tidak terjadi pada musim dingin.” Ungkapan Yunani dalam Markus lebih eliptis daripada bagian paralelnya dalam Matius 24:20.
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: berdoalah
  rationale: Imperatif kini medio/deponen orang kedua jamak. Bentuk 'berdoalah' merupakan perintah yang alami dan bermartabat dalam bahasa Indonesia; unsur jamaknya dipahami dari konteks tanpa harus ditambahkan secara eksplisit.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan ringan dengan nuansa pertentangan terhadap peringatan sebelumnya. 'Namun' mempertahankan hubungan tersebut secara alami.
- source_word: ἵνα μὴ
  choice: supaya ... tidak
  rationale: Mengantar isi atau tujuan doa dalam bentuk negatif. 'Supaya ... tidak' merupakan susunan yang wajar setelah 'berdoalah' dan tidak searkais padanan seperti 'agar jangan sampai'.
- source_word: γένηται
  choice: itu tidak terjadi
  rationale: Subjungtif aoris dari γίνομαι merujuk secara eliptis pada peristiwa atau keadaan yang dibicarakan. Kata tunjuk netral 'itu' mempertahankan keeliptisan Markus tanpa memasukkan 'pelarianmu' dari bagian paralel dalam Matius.
- source_word: χειμῶνος
  choice: pada musim dingin
  rationale: Genitif waktu atau musim yang berfungsi adverbial. 'Pada musim dingin' adalah ungkapan Indonesia yang jelas dan alami untuk waktu terjadinya peristiwa.
theological_decisions:
- issue: Hal yang secara tersirat menjadi subjek γένηται
  choice: Mempertahankan ungkapan eliptis dengan 'itu tidak terjadi'.
  alternative: Menjelaskannya sebagai 'pelarianmu tidak terjadi pada musim dingin'.
  rationale: Teks Yunani Markus tidak menyebutkan 'pelarianmu' secara eksplisit, berbeda dengan Matius 24:20. Terjemahan ini tidak memasukkan kata-kata dari bagian paralel, tetapi catatan kaki menjelaskan rujukan yang mungkin dimaksud berdasarkan konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada sederhana dan bermartabat. Keeliptisan teks sumber dipertahankan dalam ayat, sedangkan konteks yang mungkin dimaksud dijelaskan dalam catatan kaki.
