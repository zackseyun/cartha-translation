  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλαις μετὰ δυνάμεως πολλῆς καὶ δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/026.yaml
  text: And then they will see the Son of Man coming in the clouds with great power and glory[a].
translation:
  language: id
  text: Lalu mereka akan melihat Anak Manusia datang dalam awan-awan dengan kuasa besar dan kemuliaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “datang dengan awan-awan.” Bahasa Yunani secara harfiah berbunyi “dalam awan-awan,” tetapi pilihan lain itu menonjolkan kemungkinan gaung Daniel 7:13.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: mereka akan melihat
  rationale: Bentuk futur dari ὁράω di sini menyatakan tindakan melihat secara langsung; ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan tafsiran.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Sebutan baku ini mempertahankan fungsi gelar serta gaung antarteksnya dengan Daniel 7.
- source_word: ἐρχόμενον
  choice: datang
  rationale: Partisipel ini menerangkan Anak Manusia; 'datang' mempertahankan aspek tindakan dan ragam apokaliptik tanpa nuansa tambahan dari 'tiba'.
- source_word: ἐν νεφέλαις
  choice: dalam awan-awan
  rationale: ἐν secara langsung berarti 'dalam', sedangkan bentuk jamak anartikular νεφέλαις wajar dinyatakan dengan reduplikasi 'awan-awan' dalam bahasa Indonesia. Kemungkinan 'bersama awan-awan', yang menonjolkan gaung Daniel 7:13, dicatat dalam catatan kaki.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: dengan kuasa besar
  rationale: μετά dengan genitif menyatakan penyertaan, dan 'kuasa besar' merupakan padanan Indonesia yang alami untuk δυνάμεως πολλῆς.
- source_word: καὶ δόξης
  choice: dan kemuliaan
  rationale: Dalam konteks ini δόξα menunjuk pada keagungan yang dinyatakan; 'kemuliaan' mempertahankan pemakaian alkitabiah dan kaitan teologisnya.
theological_decisions:
- issue: Gelar apokaliptik dan gambaran awan
  choice: Mempertahankan 'Anak Manusia' dan gambaran kedatangan dalam awan-awan tanpa uraian tafsir dalam teks utama.
  alternative: Menerjemahkan gelar secara dinamis sebagai 'Sang Manusia' atau menjelaskan secara eksplisit rujukan kepada Daniel 7.
  rationale: Ayat ini kuat menggemakan Daniel 7:13, tetapi terjemahan sebaiknya mempertahankan gaung itu, bukan menguraikannya di dalam teks utama. Gelar tradisional juga menjaga ketegangan kristologis dan eskatologis dalam bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat lugas untuk pembaca umum, sambil mempertahankan gelar 'Anak Manusia', citra apokaliptik, dan ambiguitas preposisional yang relevan melalui catatan kaki.
