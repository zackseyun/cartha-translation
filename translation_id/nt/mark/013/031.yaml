  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ ⸀μὴ ⸁παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/031.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: id
  text: Langit dan bumi akan berlalu, tetapi perkataan-Ku sama sekali tidak akan berlalu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak akan pernah berlalu.” Bahasa Yunani memakai bentuk penyangkalan yang sangat tegas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: langit dan bumi
  rationale: Pasangan ini merupakan ungkapan kosmis yang mencakup seluruh tatanan ciptaan; “langit dan bumi” adalah padanan Indonesia yang alami dan mapan.
- source_word: παρελεύσονται
  choice: akan berlalu
  rationale: Dalam konteks eskatologis ini, παρέρχομαι berarti berlalu atau berakhir. “Akan berlalu” mempertahankan citra dan kelugasan teks tanpa menentukan bagaimana hal itu terjadi.
- source_word: οἱ λόγοι μου
  choice: perkataan-Ku
  rationale: λόγοι μου menunjuk pada perkataan atau pernyataan Yesus. Bentuk tunggal kolektif “perkataan-Ku” alami dalam bahasa Indonesia dan tetap mencakup seluruh ucapan-Nya.
- source_word: οὐ μὴ παρελεύσονται
  choice: sama sekali tidak akan berlalu
  rationale: Konstruksi οὐ μή dengan bentuk futur menyatakan penyangkalan yang sangat tegas. “Sama sekali tidak akan” menyuarakan penekanan itu secara jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Kekuatan penyangkalan tegas mengenai perkataan Yesus
  choice: sama sekali tidak akan berlalu
  alternative: tidak akan pernah berlalu
  rationale: Terjemahan utama mempertahankan kontras tajam antara kefanaan langit dan bumi dan ketetapan perkataan Yesus, sekaligus membuat penegasan οὐ μή terdengar jelas tanpa menambahkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Perkataan-Ku” dipilih sebagai ungkapan idiomatis untuk kumpulan ucapan Yesus; kapitalisasi pronomina mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
