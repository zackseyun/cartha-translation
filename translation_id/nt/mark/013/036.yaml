translation:
  language: id
  text: Jangan sampai ia datang tiba-tiba dan mendapati kalian sedang tidur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ
  choice: supaya jangan
  rationale: Menyatakan akibat yang hendak dihindari dalam hubungan dengan perintah untuk berjaga-jaga pada konteks sebelumnya.
- source_word: ἐλθὼν ἐξαίφνης
  choice: ia datang tiba-tiba
  rationale: Partisip aoris ἐλθών dipadukan secara alami dengan adverbia ἐξαίφνης tanpa mengubah hubungan waktunya.
- source_word: εὕρῃ
  choice: mendapati
  rationale: Mengungkapkan arti menemukan seseorang dalam suatu keadaan.
- source_word: ὑμᾶς καθεύδοντας
  choice: kalian sedang tidur
  rationale: Kata ganti jamak diterjemahkan sebagai 'kalian', dan partisip kini mempertahankan keadaan yang sedang berlangsung ketika mereka didapati.
theological_decisions:
- issue: Identitas subjek tersirat pada ἐλθών dan εὕρῃ
  choice: ia
  alternative: tuannya
  rationale: Teks Yunani ayat ini hanya menyiratkan subjek maskulin tunggal. 'Ia' mempertahankan rujukan kontekstual tanpa menambahkan nomina yang tidak terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kalian' dipakai untuk menandai bahwa ὑμᾶς berbentuk jamak; susunan kalimat dibuat alami tanpa menghilangkan unsur kedatangan yang tiba-tiba dan keadaan sedang tidur.
