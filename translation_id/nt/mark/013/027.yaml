  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τότε ἀποστελεῖ τοὺς ⸀ἀγγέλους καὶ ἐπισυνάξει τοὺς ⸀ἐκλεκτοὺς ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/027.yaml
  text: And then he will send out the angels and gather the chosen ones from the four winds[c][b][a], from the end of the earth to the end of heaven.
translation:
  language: id
  text: Lalu Ia akan mengutus para malaikat dan mengumpulkan orang-orang pilihan[a] dari keempat penjuru[b], dari ujung bumi sampai ke ujung langit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang terpilih.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dari keempat angin,” suatu ungkapan yang berarti dari segala arah.'
    reason: cultural_note
  - marker: c
    text: 'Frasa terakhir juga dapat diterjemahkan lebih interpretatif: “dari ujung bumi yang paling jauh sampai ke ujung langit yang paling jauh.” Sebagian terjemahan mengungkapkan cakupan keseluruhannya sebagai “dari satu ujung langit sampai ke ujung lainnya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: lalu
  rationale: Menandai urutan waktu dalam wacana eskatologis; “lalu” alami dalam bahasa Indonesia dan sesuai dengan alur naratif Markus.
- source_word: ἀποστελεῖ
  choice: Ia akan mengutus
  rationale: Bentuk futur aktif yang menyatakan pengiriman dengan tugas tertentu; “mengutus” lebih tepat daripada sekadar “mengirim” bagi agen yang diberi amanat.
- source_word: ἀγγέλους
  choice: para malaikat
  rationale: Dalam konteks apokaliptik ini yang dimaksud ialah makhluk surgawi, bukan utusan manusia.
- source_word: ἐπισυνάξει
  choice: mengumpulkan
  rationale: Menyampaikan makna membawa bersama-sama secara alami tanpa pengulangan yang tidak perlu.
- source_word: ἐκλεκτούς
  choice: orang-orang pilihan
  rationale: Adjektiva yang dipakai secara substantival menunjuk kepada mereka yang dipilih; ungkapan ini jelas bagi pembaca modern dan tidak menjadikannya istilah teknis suatu sistem teologi tertentu.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: dari keempat penjuru
  rationale: Ungkapan Yunani harfiah “dari keempat angin” merupakan idiom bagi segala arah. “Keempat penjuru” mempertahankan gambaran empat arah dengan bentuk yang alami dalam bahasa Indonesia.
- source_word: ἀπ’ ἄκρου γῆς
  choice: dari ujung bumi
  rationale: ἄκρον menunjuk pada batas atau titik terjauh; “ujung bumi” mempertahankan gambaran spasial sumber.
- source_word: ἕως ἄκρου οὐρανοῦ
  choice: sampai ke ujung langit
  rationale: Mempertahankan kesejajaran dengan “ujung bumi” serta cakupan kosmis ungkapan Yunani; “langit” tidak memaksakan penafsiran bahwa yang dimaksud khususnya tempat kediaman Allah.
- source_word: καὶ τότε ... καὶ
  choice: Lalu ... dan
  rationale: “Lalu” menyampaikan hubungan urutan dari καὶ τότε secara wajar, sedangkan “dan” mempertahankan koordinasi kedua tindakan.
theological_decisions:
- issue: Terjemahan ἐκλεκτούς dalam konteks eskatologis
  choice: orang-orang pilihan
  alternative: orang-orang terpilih; kaum pilihan
  rationale: Pilihan ini menyatakan bahwa mereka adalah orang yang dipilih tanpa memasukkan kepunyaan yang tidak eksplisit dalam bahasa Yunani dan tanpa menjadikannya label teknis dari doktrin tertentu.
- issue: Cakupan gambaran pengumpulan
  choice: dari keempat penjuru, dari ujung bumi sampai ke ujung langit
  alternative: dari keempat angin; dari satu ujung bumi sampai ke ujung langit yang lain
  rationale: Terjemahan mempertahankan cakupan menyeluruh dan merisme kosmis teks, sambil mengungkapkan idiom “empat angin” secara alami. Frasa akhir dibiarkan memiliki gambaran bumi–langit yang khas dan tidak diselaraskan secara diam-diam menjadi “dari satu ujung langit ke ujung lainnya”.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam bermartabat dan mudah dipahami. Pronomina “Ia” mengikuti kebiasaan penulisan rujukan kepada Yesus tanpa menambahkan unsur kepunyaan yang tidak ada dalam teks Yunani. Citra kosmis dipertahankan, sedangkan idiom “empat angin” diterjemahkan secara alami dan dijelaskan dalam catatan kaki.
