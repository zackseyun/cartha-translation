base_translation:
  language: en
  yaml_path: translation/nt/mark/013/006.yaml
  text: Many will come in my name[a], saying, ‘I am he,’ and they will lead many astray.
translation:
  language: id
  text: Banyak orang akan datang dengan mengatasnamakan Aku dan berkata, “Akulah dia,”[a] dan mereka akan menyesatkan banyak orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Akulah.” Bahasa Yunani tidak menyatakan predikatnya secara eksplisit.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Banyak orang
  rationale: Adjektiva jamak yang dipakai secara substantival; “banyak orang” jelas dan alami dalam bahasa Indonesia.
- source_word: ἐλεύσονται
  choice: akan datang
  rationale: Menerjemahkan bentuk futur ἔρχομαι secara langsung tanpa mempersempit maknanya menjadi sekadar muncul atau tiba.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: dengan memakai nama-Ku
  rationale: Ungkapan ini menunjukkan bahwa mereka datang dengan mengatasnamakan atau mengklaim hubungan dengan Yesus. Pilihan ini lebih jelas dalam bahasa Indonesia daripada “dalam nama-Ku,” yang dapat disalahpahami sebagai tindakan sah berdasarkan wewenang-Nya.
- source_word: λέγοντες
  choice: dan berkata
  rationale: Partisip ini menyatakan tindakan yang menyertai kedatangan mereka; bentuk klausa koordinatif lebih alami dalam bahasa Indonesia.
- source_word: ὅτι Ἐγώ εἰμι
  choice: “Akulah Dia”
  rationale: Bahasa Yunani secara harfiah berbunyi “Aku adalah/Akulah” tanpa predikat yang dinyatakan. Dalam konteks para penuntut identitas atau peran Yesus, “Akulah Dia” menyampaikan predikat tersirat tanpa menentukan gelar tertentu.
- source_word: πολλοὺς
  choice: banyak orang
  rationale: Sebagai objek πλανήσουσιν, rujukannya kepada orang dibuat eksplisit agar alami dan tidak rancu dalam bahasa Indonesia.
- source_word: πλανήσουσιν
  choice: akan menyesatkan
  rationale: Kata πλανάω berarti menyebabkan orang menyimpang atau tersesat; “menyesatkan” mempertahankan nuansa penyimpangan dari kebenaran dan lazim dalam konteks peringatan.
theological_decisions:
- issue: Terjemahan Ἐγώ εἰμι dalam konteks para penuntut palsu
  choice: Akulah Dia
  alternative: Akulah / Aku adalah
  rationale: Konteks menunjukkan klaim identitas yang terkait dengan Yesus, tetapi teks Yunani tidak menyebutkan predikat atau gelar secara eksplisit. “Akulah Dia” memberi bentuk Indonesia yang wajar sambil tidak menambahkan sebutan seperti “Mesias”; bentuk yang lebih harfiah dicatat dalam catatan kaki untuk mempertahankan ketegangan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Dengan memakai nama-Ku” dipilih untuk menyampaikan makna mengatasnamakan secara mudah dipahami, sedangkan kapitalisasi “Dia” menandai predikat persona yang tersirat tanpa menambahkan gelar teologis tertentu.
