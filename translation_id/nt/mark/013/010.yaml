  text: And the good news must first be proclaimed to all the nations[a][b].
translation:
  language: id
  text: Dan kabar baik itu[a] harus terlebih dahulu diberitakan kepada semua bangsa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Injil.” Kata Yunani εὐαγγέλιον secara harfiah berarti “kabar baik.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “di antara semua bangsa”; dalam konteks tertentu, ἔθνη juga dapat berarti “orang-orang bukan Yahudi.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Meneruskan alur perkataan sebelumnya tanpa menambahkan nuansa pertentangan.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: kepada semua bangsa
  rationale: εἰς bersama verba pemberitaan dapat menunjukkan arah atau cakupan. Pilihan ini mempertahankan keluasan universal frasa Yunani tanpa mempersempit ἔθνη menjadi hanya orang-orang bukan Yahudi.
- source_word: πρῶτον
  choice: terlebih dahulu
  rationale: Menandai prioritas waktu secara alami dalam bahasa Indonesia dan tetap mempertahankan urutan yang tersirat.
- source_word: δεῖ
  choice: harus
  rationale: Menyatakan keharusan dengan tegas dan alami tanpa menjelaskan sumber keharusan itu secara eksplisit.
- source_word: κηρυχθῆναι
  choice: diberitakan
  rationale: Bentuk pasif ini menunjuk pada penyampaian pesan secara terbuka. 'Diberitakan' alami dan cukup luas dalam bahasa Indonesia.
- source_word: τὸ εὐαγγέλιον
  choice: kabar baik
  rationale: Menyampaikan arti dasar εὐαγγέλιον dalam bahasa Indonesia modern; istilah tradisional 'Injil' tetap dicantumkan sebagai alternatif dalam catatan kaki.
theological_decisions:
- issue: Cakupan ἔθνη
  choice: semua bangsa
  alternative: semua orang bukan Yahudi
  rationale: ἔθνη dapat berarti bangsa-bangsa atau, dalam konteks tertentu, orang-orang bukan Yahudi. Konteks ini mendukung cakupan universal, tetapi kemungkinan leksikal lainnya tetap dicatat tanpa dipaksakan ke dalam teks utama.
- issue: Daya δεῖ
  choice: harus
  alternative: perlu
  rationale: Kata ini dapat menyiratkan keharusan ilahi atau eskatologis, tetapi ayat ini tidak menyebutkan sumber keharusan itu. 'Harus' mempertahankan dayanya tanpa tambahan tafsir.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'harus terlebih dahulu diberitakan' menjaga penekanan pada keharusan dan prioritas waktu, sedangkan dua catatan kaki mempertahankan alternatif leksikal yang sungguh ada dalam bahasa Yunani.
