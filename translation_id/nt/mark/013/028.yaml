  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ⸂ἤδη ὁ κλάδος αὐτῆς⸃ ἁπαλὸς γένηται καὶ ἐκφύῃ τὰ φύλλα, γινώσκετε ὅτι ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/028.yaml
  text: 'Learn the parable from the fig tree: when its branch has already become tender and puts out leaves[a], you know that summer is near.'
translation:
  language: id
  text: 'Belajarlah dari pohon ara perumpamaan ini[a]: ketika rantingnya sudah menjadi lunak dan mengeluarkan daun, kalian tahu bahwa musim panas sudah dekat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pelajaran” atau “ibarat” untuk “perumpamaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς μάθετε
  choice: Belajarlah ... dari pohon ara
  rationale: ἀπό dengan genitif menandai sumber pelajaran, sedangkan μάθετε adalah perintah untuk belajar. δέ bersifat penghubung ringan dan tidak perlu dinyatakan secara eksplisit dalam bahasa Indonesia.
- source_word: τὴν παραβολήν
  choice: perumpamaan
  rationale: παραβολή menunjuk pada perbandingan ilustratif; 'perumpamaan' mempertahankan istilah yang lazim dalam Injil sekaligus cocok dengan gambaran pohon ara.
- source_word: ὅταν ἤδη ὁ κλάδος αὐτῆς ἁπαλὸς γένηται
  choice: ketika ranting-rantingnya sudah menjadi lunak
  rationale: ὅταν memperkenalkan keadaan waktu yang umum, ἤδη berarti 'sudah', dan ἁπαλός menggambarkan ranting yang menjadi lunak sebagai tanda pertumbuhan baru. Bentuk jamak idiomatis dalam bahasa Indonesia menggambarkan percabangan pohon tanpa mengubah acuan kolektif bentuk tunggal Yunani.
- source_word: ἐκφύῃ τὰ φύλλα
  choice: mulai bertunas
  rationale: ἐκφύω berarti menumbuhkan atau mengeluarkan, dengan τὰ φύλλα sebagai daun. 'Mulai bertunas' merupakan ungkapan alami untuk pohon yang mulai mengeluarkan daun; unsur awal pertumbuhan sesuai dengan gambaran musiman.
- source_word: γινώσκετε
  choice: kamu tahu
  rationale: Bentuk ini paling wajar dipahami sebagai indikatif kini dalam konteks, yaitu menyatakan apa yang diketahui orang dari tanda tersebut, bukan memberi perintah kedua.
- source_word: ἐγγὺς τὸ θέρος ἐστίν
  choice: musim panas sudah dekat
  rationale: θέρος paling langsung berarti musim panas, dan ἐγγύς menyatakan kedekatan waktu. 'Sudah dekat' alami dalam bahasa Indonesia dan mempertahankan nuansa temporal.
theological_decisions:
- issue: Makna παραβολή dalam konteks ini
  choice: perumpamaan
  alternative: pelajaran; ibarat
  rationale: Istilah 'perumpamaan' menjaga kesinambungan kosakata pengajaran Yesus tanpa menuntut bahwa setiap unsur harus ditafsirkan secara alegoris. Catatan kaki memberi alternatif yang menonjolkan fungsi ilustratifnya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk 'Belajarlah' menyampaikan imperatif jamak tanpa memakai bentuk yang kaku; 'kamu' dipakai secara umum untuk para pendengar. Penanda catatan kaki ditempatkan pada akhir ayat agar alternatif bagi 'perumpamaan' tetap jelas tanpa mengganggu alur kalimat.
