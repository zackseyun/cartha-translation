  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς ἄνθρωπος ἀπόδημος ἀφεὶς τὴν οἰκίαν αὐτοῦ καὶ δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν, ⸀ἑκάστῳ τὸ ἔργον αὐτοῦ, καὶ τῷ θυρωρῷ ἐνετείλατο ἵνα γρηγορῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/034.yaml
  text: It is like a man away on a journey[a], who left his house and gave authority to his servants, to each one his work, and commanded the doorkeeper to stay awake.
translation:
  language: id
  text: 'Hal itu seperti seorang yang bepergian: ia meninggalkan rumahnya, memberikan wewenang kepada budak-budaknya[a], kepada setiap orang tugasnya, dan memerintahkan penjaga pintu supaya tetap berjaga.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba-hambanya”. Yunani douloi berarti “budak-budaknya”, yaitu anggota rumah tangga yang terikat di bawah wewenang tuannya.
    reason: Mencatat alternatif Indonesia yang idiomatis sambil menjelaskan makna sosial dasar istilah Yunani δοῦλοι.
lexical_decisions:
- source_word: ὡς
  choice: Keadaannya seperti
  rationale: Mengungkapkan perbandingan yang tersirat secara alami dalam bahasa Indonesia dan mengaitkannya dengan nasihat sebelumnya.
- source_word: ἄνθρωπος ἀπόδημος
  choice: seorang yang bepergian jauh
  rationale: ἀπόδημος menunjuk pada orang yang berada jauh dari tempat tinggalnya, lazimnya karena bepergian; ungkapan ini menyampaikan perjalanan sekaligus ketidakhadirannya.
- source_word: ἀφεὶς τὴν οἰκίαν αὐτοῦ
  choice: Ia meninggalkan rumahnya
  rationale: Memindahkan partisip aoris ke klausa utama menghasilkan susunan Indonesia yang alami tanpa mengubah urutan tindakan.
- source_word: δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν
  choice: memberikan wewenang kepada hamba-hambanya
  rationale: ἐξουσία berarti wewenang atau hak bertindak yang dilimpahkan. 'Hamba' mempertahankan relasi ketundukan dalam rumah tangga tanpa memakai istilah Indonesia yang terutama diasosiasikan dengan perbudakan modern; makna sosial Yunani dijelaskan dalam catatan kaki.
- source_word: ἑκάστῳ τὸ ἔργον αὐτοῦ
  choice: masing-masing dengan tugasnya
  rationale: Menyampaikan pembagian pekerjaan kepada setiap hamba secara ringkas dan idiomatis; 'tugas' menangkap pekerjaan khusus yang diberikan dalam konteks ini.
- source_word: τῷ θυρωρῷ
  choice: penjaga pintu
  rationale: Padanan langsung dan mudah dipahami untuk orang yang bertugas menjaga pintu masuk rumah.
- source_word: ἐνετείλατο ἵνα γρηγορῇ
  choice: memerintahkan ... untuk tetap berjaga-jaga
  rationale: ἐνετείλατο memiliki daya perintah, sedangkan γρηγορέω dapat berarti tetap terjaga dan, dalam konteks penjaga pintu serta wacana ini, berjaga dengan waspada. Pilihan ini mempertahankan kedua nuansa tersebut secara alami.
theological_decisions:
- issue: Pemadanan δοῦλος dalam gambaran rumah tangga
  choice: hamba-hamba
  alternative: budak-budak; pelayan-pelayan
  rationale: δοῦλος menunjukkan orang yang berada di bawah kepemilikan dan wewenang tuan, bukan sekadar pekerja rumah tangga bebas. 'Hamba' paling wajar dan bermartabat dalam teks utama Indonesia, sedangkan catatan kaki menyatakan nuansa perbudakan agar relasi sosial dalam bahasa sumber tidak diperhalus atau dihapus.
- issue: Nuansa γρηγορέω
  choice: tetap berjaga-jaga
  alternative: tetap terjaga; tetap waspada
  rationale: Dalam konteks penjaga pintu, kata ini sekaligus menyiratkan tidak tidur dan terus waspada. 'Berjaga-jaga' membiarkan kedua aspek itu hadir tanpa membatasinya hanya pada keadaan fisik terjaga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dibaca. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar alami, sementara urutan tindakan dan hubungan antarklausa tetap dipertahankan. Diksi 'wewenang', 'tugas', dan 'berjaga-jaga' menjaga nada yang bermartabat dan cocok untuk wacana pengajaran.
