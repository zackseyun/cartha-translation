review_pass:
  verdict: revise
  source_fidelity: Terjemahan menangkap perbandingan, kepergian tuan rumah, pelimpahan wewenang, pemberian pekerjaan secara individual, dan perintah kepada penjaga pintu. Namun, "masing-masing dengan tugasnya" tidak menyatakan dengan cukup jelas bahwa tugas diberikan kepada setiap orang, dan "tetap berjaga-jaga" dapat berarti mengambil tindakan pencegahan, bukan terus berjaga/terjaga sebagaimana γρηγορῇ. Istilah δοῦλοι lebih tepat diterjemahkan "budak-budaknya" dalam teks utama; catatan kaki dapat mencatat "hamba-hambanya" sebagai pilihan yang lebih idiomatis.
  naturalness: '"Hal itu seperti" lebih alami daripada "Keadaannya seperti" untuk memperkenalkan perbandingan ini. Susunan "kepada setiap orang tugasnya" mempertahankan elipsis Yunani secara jelas dalam bahasa Indonesia baku. "Supaya tetap berjaga" merupakan padanan yang lazim dan tepat bagi perintah kepada penjaga pintu.'
  terminology: '"Wewenang" tepat untuk ἐξουσία, "penjaga pintu" tepat untuk θυρωρός, dan "memerintahkan" mempertahankan daya ἐνετείλατο. "Budak-budaknya" menyatakan makna dasar δοῦλοι tanpa menghapus realitas status terikat dalam gambaran rumah tangga; alternatif "hamba-hambanya" dicantumkan dalam catatan kaki.'
  issues:
  - severity: medium
    issue: Pemberian tugas individual kurang eksplisit
    rationale: Frasa "masing-masing dengan tugasnya" dapat hanya menjelaskan keadaan para hamba, sedangkan ἑκάστῳ τὸ ἔργον αὐτοῦ menyatakan bahwa kepada setiap orang diberikan pekerjaannya.
  - severity: medium
    issue: '"Berjaga-jaga" tidak cukup spesifik untuk γρηγορῇ'
    rationale: Dalam pemakaian Indonesia modern, "berjaga-jaga" juga berarti berhati-hati atau mengambil pencegahan. γρηγορέω dalam konteks ini menuntut terus berjaga/terjaga.
  - severity: low
    issue: Catatan kaki menyebut "secara harfiah" meski teks utama memakai "hamba-hamba"
    rationale: Jika δοῦλοι diterjemahkan dengan "budak-budaknya" dalam teks utama, catatan kaki sebaiknya berfungsi mencatat alternatif "hamba-hambanya", bukan menyajikan makna leksikal utama seolah-olah hanya catatan tambahan.
  revised_text: 'Hal itu seperti seorang yang bepergian: ia meninggalkan rumahnya, memberikan wewenang kepada budak-budaknya[a], kepada setiap orang tugasnya, dan memerintahkan penjaga pintu supaya tetap berjaga.'
