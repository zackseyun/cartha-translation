- from: Keadaannya seperti seorang yang bepergian jauh. Ia meninggalkan rumahnya dan memberikan wewenang kepada hamba-hambanya[a], masing-masing dengan tugasnya, serta memerintahkan penjaga pintu untuk tetap berjaga-jaga.
  to: 'Hal itu seperti seorang yang bepergian: ia meninggalkan rumahnya, memberikan wewenang kepada budak-budaknya[a], kepada setiap orang tugasnya, dan memerintahkan penjaga pintu supaya tetap berjaga.'
  rationale: Revisi ini memperjelas bahwa setiap budak menerima tugasnya sendiri, membedakan perintah untuk terus berjaga dari sekadar sikap berhati-hati, dan memakai padanan utama yang lebih langsung untuk δοῦλοι. Tidak ada penafsiran teologis tambahan atau penyelesaian atas ambiguitas yang disengketakan.
