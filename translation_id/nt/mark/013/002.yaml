base_translation:
  language: en
  yaml_path: translation/nt/mark/013/002.yaml
  text: And Jesus said to him[c][b][a], “Do you see these great buildings? Not one stone will be left here upon another that will not be torn down.”
translation:
  language: id
  text: Yesus pun berkata kepadanya, “Apakah kau melihat bangunan-bangunan megah ini?[a] Tidak satu batu pun akan dibiarkan di sini di atas batu lain yang tidak akan dirobohkan.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “bangunan-bangunan besar ini” atau, sesuai konteks, “bangunan-bangunan Bait Allah yang megah ini.” Teks Yunani sendiri hanya menyebut “bangunan-bangunan.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “tidak satu batu pun ... di atas batu lain” menggambarkan kehancuran menyeluruh. Kata yang diterjemahkan “dirobohkan” juga dapat diterjemahkan “diruntuhkan,” “dibongkar,” atau “dihancurkan.”
    reason: cultural_note
lexical_decisions:
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: Yesus pun berkata kepadanya
  rationale: Partikel “pun” mengalir wajar dalam narasi Indonesia dan mencerminkan fungsi penghubung καί tanpa menambahkan gagasan bahwa Yesus sedang menjawab, yang tidak dinyatakan oleh verba εἶπεν.
- source_word: Βλέπεις
  choice: Kau melihat
  rationale: Bentuk indikatif kini ini berfungsi sebagai pertanyaan langsung. “Kau melihat” mempertahankan bentuk pertanyaan dan terdengar alami dalam percakapan, tanpa mengubahnya menjadi perintah seperti “Lihatlah”.
- source_word: ταύτας τὰς μεγάλας οἰκοδομάς
  choice: bangunan-bangunan megah ini
  rationale: οἰκοδομάς berarti bangunan-bangunan, sedangkan μεγάλας dapat menunjuk pada ukuran besar sekaligus kemegahan. “Megah” menangkap kesan bangunan kompleks Bait Allah tanpa memasukkan kata “Bait Allah” ke dalam teks utama.
- source_word: οὐ μὴ ἀφεθῇ ὧδε λίθος ἐπὶ λίθον
  choice: Tidak satu batu pun di sini akan dibiarkan tetap tersusun di atas batu yang lain
  rationale: οὐ μή menyatakan penyangkalan masa depan yang sangat tegas; pola “tidak satu ... pun” menyampaikan penekanan itu secara alami. “Tetap tersusun” memperjelas gambaran batu yang masih berada di atas batu lain tanpa menghilangkan unsur “dibiarkan” dari ἀφεθῇ.
- source_word: ὃς οὐ μὴ καταλυθῇ
  choice: setiap batu akan dirobohkan
  rationale: 'καταλύω dalam konteks bangunan berarti membongkar atau merobohkan. Rumusan positif menyampaikan secara wajar daya penyangkalan ganda Yunani dan hubungan klausa relatifnya: tidak ada batu dalam susunan itu yang luput dari perobohan.'
theological_decisions:
- issue: Cakupan nubuat Yesus mengenai kompleks Bait Allah
  choice: Memakai istilah umum “bangunan-bangunan” dalam teks utama.
  alternative: “bangunan-bangunan Bait Allah”
  rationale: Konteks segera menunjuk pada kompleks Bait Allah, tetapi teks Yunani hanya menyebut “bangunan-bangunan.” Pilihan utama tidak mempersempit ungkapan sumber, sedangkan catatan kaki menjelaskan rujukan kontekstualnya.
- issue: Kekuatan pernyataan kehancuran
  choice: Menyatakan bahwa tidak satu batu pun akan tetap tersusun dan bahwa setiap batu akan dirobohkan.
  alternative: Menerjemahkan secara lebih harfiah, “yang tidak akan dirobohkan,” sebagai klausa relatif negatif.
  rationale: Susunan Yunani memakai dua penyangkalan tegas dan sebuah klausa relatif. Bahasa Indonesia menjadi lebih jelas dengan klausa kedua yang positif, tanpa mengurangi ketegasan atau mengubah cakupan kehancuran yang dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada percakapan yang tetap bermartabat. “Kau” dipakai karena Yesus berbicara langsung kepada seorang murid; bentuk ini lebih alami daripada “engkau” bagi banyak pembaca masa kini. Pengulangan “bangunan-bangunan” dipertahankan untuk menunjukkan bentuk jamak Yunani dan cakupan kompleks bangunan.
