  register: Bahasa Indonesia modern, jelas, dan bermartabat. Tanda seru dipakai untuk mencerminkan bentuk seruan οὐαί. Tidak diperlukan catatan kaki karena alternatif leksikal bahasa Inggris tidak mewakili ambiguitas bermakna yang perlu dipertahankan dalam bahasa Indonesia.
