  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/017.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a][b].
translation:
  language: id
  text: Namun, celakalah perempuan yang sedang hamil dan yang menyusui pada hari-hari itu!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ
  choice: celakalah
  rationale: Mempertahankan daya seru profetis yang sekaligus menyatakan ratapan dan peringatan tentang kesusahan yang akan datang.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan ringan dari peringatan sebelumnya tanpa membuat pertentangan terlalu tajam.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: perempuan-perempuan yang sedang mengandung
  rationale: Ungkapan harfiah 'memiliki dalam rahim' secara idiomatis berarti sedang hamil; pilihan ini jelas, alami, dan mempertahankan acuan feminin jamak.
- source_word: θηλαζούσαις
  choice: yang sedang menyusui
  rationale: Mengungkap tindakan menyusui anak secara alami dalam bahasa Indonesia; objeknya dapat dipahami dari verba itu sendiri sehingga tidak perlu ditambahkan.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: pada hari-hari itu
  rationale: Padanan temporal yang lugas dan alami serta mempertahankan kaitannya dengan masa yang dibicarakan dalam konteks.
theological_decisions: []
