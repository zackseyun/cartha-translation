  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται καὶ δώσουσιν σημεῖα καὶ τέρατα πρὸς τὸ ἀποπλανᾶν εἰ ⸀δυνατὸν τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/022.yaml
  text: For false messiahs and false prophets will arise and will give signs and wonders in order to lead astray[a], if possible[c][b], the elect.
translation:
  language: id
  text: Sebab mesias-mesias palsu dan nabi-nabi palsu akan muncul dan mengadakan tanda-tanda dan keajaiban dengan tujuan menyesatkan orang-orang pilihan, jika mungkin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan tujuan menyesatkan, jika mungkin, orang-orang pilihan.” Susunan Yunani tidak secara tegas menentukan apakah orang-orang pilihan benar-benar dapat disesatkan; yang dinyatakan ialah tujuan para penyesat.
    reason: ambiguity
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: akan muncul
  rationale: Dalam konteks ini bentuk pasif ἐγείρω dipakai secara idiomatis untuk kemunculan orang-orang tertentu; pilihan ini alami dan tidak menyiratkan secara berlebihan bahwa mereka dibangkitkan oleh suatu pelaku.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai bahwa ayat ini memberi alasan atau penjelasan bagi peringatan sebelumnya.
- source_word: ψευδόχριστοι
  choice: mesias-mesias palsu
  rationale: Χριστός dalam kata majemuk ini berfungsi sebagai gelar 'Mesias'; bentuk ulang nomina menyatakan jamak secara jelas dalam bahasa Indonesia.
- source_word: ψευδοπροφῆται
  choice: nabi-nabi palsu
  rationale: Padanan baku, jelas, dan langsung bagi nomina majemuk Yunani tersebut.
- source_word: δώσουσιν
  choice: mengadakan
  rationale: Dalam kolokasi tanda dan keajaiban, 'mengadakan' lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'memberikan', tanpa mengubah tindakan yang dinyatakan.
- source_word: σημεῖα καὶ τέρατα
  choice: tanda-tanda serta keajaiban-keajaiban
  rationale: Mempertahankan dua unsur ungkapan Yunani tanpa menambahkan kata 'mukjizat' yang akan mempersempit penafsiran.
- source_word: πρὸς τὸ ἀποπλανᾶν
  choice: dengan tujuan menyesatkan
  rationale: Konstruksi ini menyatakan tujuan, sedangkan ἀποπλανάω berarti membawa orang menyimpang atau menyesatkan.
- source_word: εἰ δυνατόν
  choice: jika mungkin
  rationale: Padanan langsung yang mempertahankan bentuk bersyarat tanpa memastikan apakah penyesatan orang pilihan benar-benar mungkin atau mustahil.
- source_word: τοὺς ἐκλεκτούς
  choice: orang-orang pilihan
  rationale: Padanan Indonesia yang alami bagi kelompok yang dipilih, sambil mempertahankan bobot teologis istilah tersebut tanpa menentukan doktrin tertentu.
theological_decisions:
- issue: Makna ψευδόχριστοι sebagai gelar mesianik
  choice: mesias-mesias palsu
  alternative: Kristus-Kristus palsu
  rationale: Unsur Χριστός di sini jelas bersifat gelar, sehingga 'Mesias' menyampaikan maknanya dengan lebih transparan dalam konteks Yahudi dan eskatologis.
- issue: Implikasi εἰ δυνατόν mengenai dapat tidaknya orang-orang pilihan disesatkan
  choice: jika mungkin
  alternative: sekiranya hal itu mungkin
  rationale: Ungkapan Yunani tidak secara eksplisit memutuskan apakah penyesatan itu pada akhirnya mungkin. Terjemahan ringkas ini menjaga ketegangan tersebut.
- issue: Cakupan frasa εἰ δυνατόν
  choice: menempatkan 'jika mungkin' sebelum objek 'orang-orang pilihan'
  alternative: menyesatkan orang-orang pilihan, jika mungkin
  rationale: Urutan ini mengikuti struktur Yunani dan menjaga kemungkinan bahwa syarat tersebut berkaitan erat dengan sasaran penyesatan, meskipun hasil akhirnya tetap ambigu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Mesias' dipakai sebagai gelar yang mudah dipahami; 'mengadakan tanda-tanda serta keajaiban-keajaiban' mempertahankan ungkapan berpasangan dengan susunan yang alami. Tanda catatan kaki [a] ditempatkan pada akhir ayat karena menjelaskan keseluruhan susunan klausa penutup.
