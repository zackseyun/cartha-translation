  text: Καὶ καθημένου αὐτοῦ εἰς τὸ Ὄρος τῶν Ἐλαιῶν κατέναντι τοῦ ἱεροῦ ⸀ἐπηρώτα αὐτὸν κατ’ ἰδίαν Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/003.yaml
  text: And as he was sitting on the Mount of Olives opposite the temple, Peter and James and John and Andrew were asking him privately,
translation:
  language: id
  text: Ketika Yesus sedang duduk di Bukit Zaitun, berhadapan dengan kompleks Bait Allah,[a] Petrus, Yakobus, Yohanes, dan Andreas bertanya kepada-Nya secara tersendiri,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ἱερόν merujuk pada kompleks atau kawasan Bait Allah, bukan secara khusus pada ruang kudus bagian dalam (ναός).
    reason: lexical_alternative
lexical_decisions:
- source_word: καθημένου αὐτοῦ
  choice: Ketika Yesus sedang duduk
  rationale: Konstruksi genitif absolut dengan partisipel kini menggambarkan keadaan yang sedang berlangsung. Nama “Yesus” dipakai untuk memperjelas rujukan pronomina secara alami dalam bahasa Indonesia.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: di Bukit Zaitun
  rationale: Dengan verba posisi, εἰς secara idiomatis menunjukkan lokasi. “Bukit Zaitun” adalah nama geografis baku dalam bahasa Indonesia.
- source_word: κατέναντι τοῦ ἱεροῦ
  choice: berhadapan dengan kompleks Bait Allah
  rationale: κατέναντι menyatakan posisi berhadapan atau di seberang, sedangkan ἱερόν merujuk pada seluruh kompleks atau pelataran Bait Allah, bukan hanya ruang kudus bagian dalam.
- source_word: ἐπηρώτα
  choice: bertanya
  rationale: Bentuk imperfek menyajikan tindakan dalam bingkai naratif lampau dan dapat membawa nuansa berlangsung; bahasa Indonesia tidak wajib menandainya secara gramatikal, dan “bertanya” paling alami di sini tanpa mengubah jenis tindakannya.
- source_word: κατ’ ἰδίαν
  choice: secara pribadi
  rationale: Ungkapan ini berarti secara tersendiri, terpisah dari orang banyak, atau dalam suasana pribadi.
- source_word: Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας
  choice: Petrus, Yakobus, Yohanes, dan Andreas
  rationale: Nama-nama memakai bentuk Indonesia yang lazim. Daftar dengan koma dan “dan” terakhir lebih alami dalam bahasa Indonesia daripada mempertahankan seluruh polisindeton Yunani.
theological_decisions: []
