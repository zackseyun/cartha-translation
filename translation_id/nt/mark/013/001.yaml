  naturalness: “Betapa mengagumkan batu-batu dan bangunan-bangunan ini” dapat dipahami, tetapi dalam bahasa Indonesia modern bentuk yang lebih alami adalah “betapa mengagumkannya ...”. Pengulangan “betapa mengagumkannya” juga menghasilkan seruan yang jelas dan lancar.
  terminology: “Kompleks Bait Allah,” “murid-Nya,” dan “Guru” sudah tepat dan sesuai register Alkitab bahasa Indonesia modern. Catatan tentang ἱερόν juga akurat. Catatan leksikal untuk seruan ποταπός perlu ditambahkan agar jejak audit bahasa Inggris terwakili.
