- from: Ketika Yesus sedang keluar dari kompleks Bait Allah[a], salah seorang murid-Nya berkata kepada-Nya, “Guru, lihatlah! Betapa mengagumkan batu-batu dan bangunan-bangunan ini!”
  to: Ketika Yesus sedang keluar dari kompleks Bait Allah[a], salah seorang murid-Nya berkata kepada-Nya, “Guru, lihatlah! Betapa mengagumkannya batu-batu itu[b], dan betapa mengagumkannya bangunan-bangunan itu!”
  rationale: Revisi memperbaiki kelancaran seruan bahasa Indonesia melalui bentuk “mengagumkannya”, mempertahankan pengulangan eksklamatif yang ada dalam bahasa Yunani, dan menambahkan catatan kaki yang menjelaskan keluasan nuansa ποταπός. Kata “itu” berfungsi secara idiomatis untuk menunjuk batu-batu dan bangunan yang sedang diperlihatkan oleh murid; konteks imperatif “lihatlah” mendukung penunjukan tersebut.
