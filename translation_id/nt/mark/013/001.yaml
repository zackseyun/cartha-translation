source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ ἐκ τοῦ ἱεροῦ λέγει αὐτῷ εἷς τῶν μαθητῶν αὐτοῦ· Διδάσκαλε, ἴδε ποταποὶ λίθοι καὶ ποταπαὶ οἰκοδομαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/001.yaml
  text: And as he was going out of the temple[a], one of his disciples says to him, “Teacher[b], look—what wonderful stones and what wonderful buildings!”
translation:
  language: id
  text: Ketika Yesus sedang keluar dari kompleks Bait Allah[a], salah seorang murid-Nya berkata kepada-Nya, “Guru, lihatlah! Betapa mengagumkannya batu-batu itu[b], dan betapa mengagumkannya bangunan-bangunan itu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ἱερόν menunjuk seluruh kompleks atau kawasan Bait Allah, bukan secara khusus ruang kudus bagian dalam.
    reason: lexical_alternative
  - marker: b
    text: Atau “betapa besar” atau “betapa megah”. Kata sifat Yunani ini menyatakan kekaguman atau ketercengangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ
  choice: Ketika Yesus sedang keluar
  rationale: Konstruksi genitif absolut dengan partisipel kini menunjukkan tindakan yang sedang berlangsung dan bersamaan. Nama “Yesus” dipakai agar rujukan pronomina alami dan jelas dalam bahasa Indonesia.
- source_word: τοῦ ἱεροῦ
  choice: dari kompleks Bait Allah
  rationale: ἱερόν menunjuk seluruh kawasan atau kompleks Bait Allah, bukan hanya ruang kudus bagian dalam; terjemahan eksplisit ini mencegah penyempitan makna.
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis khas narasi Markus dinaturalkan menjadi bentuk lampau naratif bahasa Indonesia; memakai “berkata” lebih wajar daripada mempertahankan kini secara kaku.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: salah seorang murid-Nya
  rationale: Ungkapan partitif ini paling alami diterjemahkan “salah seorang”; akhiran hormat “-Nya” mengikuti kelaziman penulisan Alkitab bahasa Indonesia.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Sapaan vokatif ini berarti orang yang mengajar; “Guru” merupakan padanan modern yang jelas dan tidak menambahkan gagasan lain.
- source_word: ἴδε
  choice: lihatlah
  rationale: Imperatif ini menarik perhatian lawan bicara. “Lihatlah” alami, tegas, dan tetap bermartabat.
- source_word: ποταποὶ ... καὶ ποταπαὶ
  choice: Betapa mengagumkan ... dan ...
  rationale: ποταπός dalam konstruksi seruan menyatakan kekaguman terhadap mutu atau rupa. “Betapa mengagumkan” menangkap daya serunya tanpa menentukan apakah yang dimaksud terutama ukuran, keindahan, atau kemegahan.
- source_word: λίθοι
  choice: batu-batu
  rationale: Bentuk jamak dipertahankan dan konteks sudah menunjukkan bahwa ini batu-batu bangunan Bait Allah.
- source_word: οἰκοδομαί
  choice: bangunan-bangunan
  rationale: Bentuk jamak merujuk berbagai bangunan dalam kompleks Bait Allah; pengulangan bentuk jamak mempertahankan penekanan seruan Yunani.
