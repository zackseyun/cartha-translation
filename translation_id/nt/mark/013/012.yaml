source:
  edition: SBLGNT
  text: ⸂καὶ παραδώσει⸃ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/012.yaml
  text: And brother will hand over brother to death[a], and a father his child[b], and children will rise up against parents and put them to death.
translation:
  language: id
  text: Seorang saudara laki-laki akan menyerahkan[a] saudara laki-lakinya untuk dibunuh, dan seorang ayah akan menyerahkan anaknya untuk dibunuh; anak-anak akan bangkit melawan orang tua mereka dan membunuh mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengkhianati”; kata Yunani ini dapat berarti “menyerahkan,” “menyerahkan kepada pihak lain,” atau, dalam konteks ini, “mengkhianati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: akan menyerahkan
  rationale: Kata kerja ini berarti menyerahkan atau menyerahkan ke dalam kekuasaan pihak lain; dalam konteks penganiayaan, terjemahan ini mempertahankan gambaran konkret tanpa langsung membatasi maknanya menjadi pengkhianatan.
- source_word: ἀδελφὸς ἀδελφὸν
  choice: Saudara ... saudaranya
  rationale: Bentuk tunggal maskulin dalam bahasa Yunani dipertahankan, sedangkan akhiran -nya mengungkapkan hubungan keluarga secara alami dalam bahasa Indonesia.
- source_word: εἰς θάνατον
  choice: untuk dibunuh
  rationale: Ungkapan ini menyatakan tujuan atau akibat berupa kematian. 'Untuk dibunuh' lebih alami daripada terjemahan harfiah 'kepada kematian' dan tidak mengharuskan adanya proses pengadilan.
- source_word: πατὴρ τέκνον
  choice: seorang ayah ... anaknya
  rationale: πατήρ secara khusus berarti ayah, sedangkan τέκνον mencakup anak laki-laki maupun perempuan. Kata 'menyerahkan' diulang untuk memperjelas elipsis Yunani secara alami.
- source_word: ἐπαναστήσονται
  choice: akan bangkit melawan
  rationale: Pilihan ini mempertahankan gambaran tindakan permusuhan yang kuat dalam kata Yunani, tanpa mempersempitnya menjadi pemberontakan dalam arti politik.
- source_word: γονεῖς
  choice: orang tua mereka
  rationale: Bentuk jamak ini berarti orang tua. Kata 'mereka' memperjelas hubungan anak dengan orang tuanya dalam bahasa Indonesia.
- source_word: θανατώσουσιν αὐτούς
  choice: membunuh mereka
  rationale: θανατόω berarti membunuh atau membuat seseorang mati. 'Membunuh mereka' merupakan padanan Indonesia yang langsung, wajar, dan kuat.
theological_decisions:
- issue: Istilah keluarga yang bergender dalam pernyataan representatif
  choice: Mempertahankan 'saudara' dan 'ayah' pada dua klausa pertama, sambil memakai 'anak-anak' dan 'orang tua' ketika istilah Yunani memang lebih luas.
  alternative: Menetralkan semua istilah menjadi 'saudara sekandung' atau 'salah satu orang tua'.
  rationale: ἀδελφός dan πατήρ berbentuk maskulin secara khusus di sini, sedangkan τέκνον dan γονεῖς mencakup kategori yang lebih luas. Terjemahan mempertahankan perbedaan itu tanpa menambahkan pembatasan yang tidak ada dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan struktur keluarga dipertahankan untuk menjaga ketegangan dan daya hantam retoris ayat, sementara elipsis pada klausa tentang ayah dibuat eksplisit agar alami dalam bahasa Indonesia.
