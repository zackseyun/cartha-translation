  verdict: revise
  source_fidelity: Revisi diperlukan untuk menyatakan secara konsisten bahwa ἀδελφός pada kedua sisi klausa pertama adalah maskulin (‘saudara laki-laki’) dan untuk mempertahankan akibat ‘untuk dibunuh’ yang secara eliptis berlaku pula pada klausa tentang ayah. Terjemahan ‘bangkit melawan’ dan ‘membunuh mereka’ dengan tepat mencerminkan ἐπαναστήσονται dan θανατώσουσιν αὐτούς.
  naturalness: Teks revisi tetap memakai bahasa Indonesia modern dan jelas. Pengulangan ‘untuk dibunuh’ membuat paralelisme dua klausa pertama eksplisit tanpa mengubah makna, sedangkan titik koma menjaga rangkaian tiga tindakan yang erat dalam kalimat sumber.
  terminology: ‘Saudara laki-laki’ membedakan ἀδελφός yang maskulin dari τέκνον (‘anak’) dan γονεῖς (‘orang tua’), yang lebih luas. ‘Menyerahkan’ mempertahankan arti konkret παραδίδωμι tanpa memaksakan nuansa ‘mengkhianati’.
  issues:
  - severity: medium
    issue: Istilah ‘saudara’ dalam klausa pertama tidak mempertahankan kekhususan maskulin ἀδελφός.
    rationale: Dalam bahasa Indonesia, ‘saudara’ dapat bersifat netral. Bentuk Yunani ἀδελφός di kedua posisi adalah maskulin, sehingga ‘saudara laki-laki’ lebih setia pada teks sumber.
  - severity: low
    issue: Klausa tentang ayah tidak menyatakan akibat ‘untuk dibunuh’ yang dielipsiskan dari klausa pertama.
    rationale: Makna itu memang dapat dipahami dari paralelisme, tetapi pemisahan menjadi dua kalimat membuat elipsisnya kurang jelas. Menyatakannya kembali secara eksplisit mempertahankan cakupan εἰς θάνατον secara alami.
  - severity: medium
    issue: Catatan kaki alternatif memperluas makna dengan ‘sehingga ia dibunuh’.
    rationale: Kata ‘sehingga’ menambahkan hubungan kausal dan ‘ia’ menggeser fokus dari alternatif leksikal bagi παραδώσει. Catatan sebaiknya hanya menyajikan alternatif makna kata kerja.
