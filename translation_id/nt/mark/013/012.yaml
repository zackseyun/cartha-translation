  to: Seorang saudara laki-laki akan menyerahkan[a] saudara laki-lakinya untuk dibunuh, dan seorang ayah akan menyerahkan anaknya untuk dibunuh; anak-anak akan bangkit melawan orang tua mereka dan membunuh mereka.
  rationale: Revisi memperjelas gender maskulin pada ἀδελφός, memulihkan secara eksplisit akibat yang berlaku bagi tindakan ayah dalam paralelisme Yunani, dan memperbaiki catatan kaki agar tetap merupakan alternatif leksikal tanpa menambahkan hubungan kausal. Tidak ada perubahan pada makna dasar ayat.
