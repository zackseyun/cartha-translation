  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου. ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/013.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: id
  text: Kalian akan dibenci oleh semua orang karena nama-Ku. Namun, orang yang bertahan sampai akhir akan diselamatkan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang yang tetap teguh sampai akhir.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “akan dibebaskan.” Kata Yunani ini dapat berarti dibebaskan dari bahaya atau diselamatkan; konteks tidak mempersempit seluruh nuansanya.
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: dibenci oleh semua orang
  rationale: Bentuk partisip dengan ἔσεσθε menyatakan keadaan pada masa mendatang, yang secara alami diterjemahkan 'akan dibenci'. πάντων tetap dipertahankan dalam bentuk menyeluruh tanpa dipersempit.
- source_word: διὰ τὸ ὄνομά μου
  choice: karena nama-Ku
  rationale: διά dengan akusatif menyatakan sebab. Ungkapan ini mempertahankan 'nama' sebagai sebutan yang menunjuk pada pribadi, kewibawaan, dan hubungan dengan Yesus.
- source_word: ὁ δὲ ὑπομείνας
  choice: Namun, orang yang bertahan
  rationale: Partisip berartikel berfungsi sebagai nomina, yaitu 'orang yang bertahan'. 'Bertahan' alami dalam bahasa Indonesia dan mencakup keteguhan di bawah tekanan tanpa memasukkan istilah doktrinal yang lebih khusus.
- source_word: εἰς τέλος
  choice: sampai akhir
  rationale: Ungkapan ini menyatakan keberlangsungan hingga suatu titik akhir, sambil membiarkan terbuka apakah yang dimaksud ialah akhir pencobaan, kehidupan, atau akhir zaman.
- source_word: οὗτος
  choice: tidak diterjemahkan secara terpisah
  rationale: Kata tunjuk ini menegaskan dan merangkum kembali subjek partisipial. Dalam bahasa Indonesia, pengulangan 'orang inilah' dapat terasa kaku; penekanannya cukup terwakili oleh susunan kalimat yang alami.
- source_word: σωθήσεται
  choice: akan diselamatkan
  rationale: σῴζω dapat menunjuk pada penyelamatan dari bahaya maupun keselamatan dalam arti yang lebih penuh. 'Diselamatkan' mempertahankan keluasan makna dan bobot teologisnya.
theological_decisions:
- issue: Makna σωθήσεται dalam perkataan tentang ketekunan
  choice: akan diselamatkan
  alternative: akan dilepaskan
  rationale: Terjemahan ini tidak membatasi maknanya hanya pada pelepasan sementara ataupun menjadikannya rumusan doktrin denominasi tertentu; keluasan dan ketegangan teologis teks tetap terpelihara.
- issue: Cakupan πάντων
  choice: oleh semua orang
  alternative: oleh setiap orang
  rationale: Ungkapan menyeluruh dalam teks dipertahankan tanpa penjelasan pembatas di dalam ayat, sehingga daya retorisnya tetap kuat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' agar bentuk orang kedua jamak Yunani tampak jelas. Nada dibuat lugas dan bermartabat. Tanda kapital pada '-Ku' mengikuti kaidah umum penulisan rujukan kepada Allah dalam penerbitan Alkitab Indonesia.
