  text: γρηγορεῖτε οὖν, οὐκ οἴδατε γὰρ πότε ὁ κύριος τῆς οἰκίας ἔρχεται, ⸀ἢ ὀψὲ ἢ ⸀μεσονύκτιον ἢ ἀλεκτοροφωνίας ἢ πρωΐ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/035.yaml
  text: 'Therefore stay awake[a], for you do not know when the master of the house is coming: whether in the evening, or at midnight, or at cockcrow[b], or in the morning.'
translation:
  language: id
  text: Karena itu, tetaplah berjaga-jaga[a], sebab kamu tidak tahu kapan tuan rumah akan datang—entah pada petang hari, tengah malam, saat ayam berkokok[b], atau pada pagi hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tetaplah waspada." Perintah ini berarti terus bersiaga dan waspada.
    reason: lexical_alternative
  - marker: b
    text: Istilah "saat ayam berkokok" menunjuk pada salah satu giliran jaga malam yang dikaitkan dengan kokok ayam.
    reason: cultural_note
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: tetaplah berjaga-jaga
  rationale: Imperatif ini menuntut kewaspadaan yang terus dipertahankan. Pilihan ini alami dalam bahasa Indonesia dan mencakup makna tetap terjaga serta waspada.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan atau konsekuensi dari pengajaran sebelumnya.
- source_word: οὐκ οἴδατε
  choice: kamu tidak tahu
  rationale: Menerjemahkan negasi verba mengetahui secara langsung tanpa menambahkan unsur kepastian yang tidak dinyatakan.
- source_word: πότε
  choice: kapan
  rationale: Padanan temporal yang alami dan tepat dalam pertanyaan tidak langsung.
- source_word: ὁ κύριος τῆς οἰκίας
  choice: tuan rumah
  rationale: Dalam gambaran rumah tangga ini, frasa tersebut menunjuk kepada orang yang berwenang atas rumah. 'Tuan rumah' ringkas, wajar, dan tidak mengubahnya menjadi gelar ilahi secara eksplisit.
- source_word: ἔρχεται
  choice: akan datang
  rationale: Bentuk kini Yunani mengacu pada kedatangan yang dinantikan; bentuk futur bahasa Indonesia menyampaikan acuannya secara alami.
- source_word: ὀψὲ
  choice: pada petang hari
  rationale: Dalam urutan giliran jaga malam, kata ini menunjuk pada bagian awal malam, bukan sekadar waktu yang 'terlambat'.
- source_word: μεσονύκτιον
  choice: tengah malam
  rationale: Padanan temporal yang baku dan jelas dalam daftar giliran malam.
- source_word: ἀλεκτοροφωνίας
  choice: saat ayam berkokok
  rationale: Mengungkap penanda waktu berdasarkan kokok ayam dengan bahasa Indonesia yang mudah dipahami, sambil mempertahankan kaitannya dengan giliran malam.
- source_word: πρωΐ
  choice: pagi hari
  rationale: Menunjuk pada giliran terakhir malam yang beralih ke pagi tanpa mempersempitnya secara tidak perlu menjadi tepat saat fajar.
theological_decisions:
- issue: Makna κύριος dalam ungkapan perumpamaan yang secara tidak langsung dapat menunjuk kepada Yesus, tetapi secara langsung menggambarkan pemegang wewenang atas rumah
  choice: tuan rumah
  alternative: Tuhan atas rumah; pemilik rumah
  rationale: Konteks langsungnya adalah gambaran rumah tangga. 'Tuan rumah' mempertahankan arti biasa dalam gambaran tersebut tanpa meniadakan kemungkinan rujukan kristologis pada tingkat perumpamaan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur yang mudah dipahami. Tanda pisah memperkenalkan empat kemungkinan waktu kedatangan. Semua penanda catatan kaki dicantumkan dalam teks utama.
