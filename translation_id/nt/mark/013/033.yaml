  text: βλέπετε ⸀ἀγρυπνεῖτε, οὐκ οἴδατε γὰρ πότε ὁ καιρός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/033.yaml
  text: Be on guard; stay awake[a], for you do not know when the time is.
translation:
  language: id
  text: Waspadalah; tetaplah berjaga-jaga, sebab kamu tidak tahu kapan waktunya tiba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kapan saat yang ditetapkan itu tiba” atau “kapan masanya tiba.” Kata Yunani καιρός sering menunjuk pada waktu yang menentukan atau telah ditetapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: Waspadalah
  rationale: Bentuk perintah jamak ini dipakai secara idiomatis sebagai peringatan agar berhati-hati dan siaga, bukan sekadar melihat secara fisik. Pilihan ini juga membedakannya dari perintah berikutnya.
- source_word: ἀγρυπνεῖτε
  choice: tetaplah berjaga-jaga
  rationale: Bentuk perintah jamak ini berarti tetap terjaga atau terus waspada. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan gambaran berjaga.
- source_word: οὐκ οἴδατε
  choice: kamu tidak tahu
  rationale: Menerjemahkan secara langsung bentuk indikatif negatif tanpa menambahkan unsur kepastian yang tidak dinyatakan dalam bahasa Yunani.
- source_word: γὰρ
  choice: sebab
  rationale: Memperkenalkan alasan bagi dua perintah sebelumnya dan terdengar wajar dalam ragam bahasa Indonesia yang bermartabat.
- source_word: πότε
  choice: kapan
  rationale: Padanan paling alami untuk kata keterangan tanya yang menunjuk pada waktu.
- source_word: ὁ καιρός
  choice: waktunya
  rationale: καιρός dapat menunjuk pada saat yang menentukan atau telah ditetapkan. 'Waktunya' menjaga ungkapan tetap alami dan cukup terbuka, sedangkan nuansa alternatif dijelaskan dalam catatan kaki.
- source_word: ἐστιν
  choice: tiba
  rationale: Dalam susunan bahasa Indonesia, 'kapan waktunya tiba' menyampaikan secara alami keberadaan atau datangnya waktu yang dimaksud; padanan harfiah 'kapan waktunya ada' tidak idiomatis.
theological_decisions:
- issue: Nuansa καιρός dalam konteks eskatologis
  choice: waktunya
  alternative: saat yang ditetapkan; masanya
  rationale: Dalam khotbah eskatologis Yesus, καιρός dapat berarti waktu yang menentukan atau ditetapkan. Teks utama tidak mempersempit maknanya secara berlebihan, sementara catatan kaki mempertahankan nuansa tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Dua perintah dibedakan dengan 'Waspadalah' dan 'tetaplah berjaga-jaga' agar penekanan beruntun dalam bahasa Yunani tetap terasa tanpa terdengar sebagai pengulangan yang sama.
