  verdict: approve
  source_fidelity: Teks Indonesia secara setia menyampaikan dua imperatif jamak yang berurutan (βλέπετε, ἀγρυπνεῖτε), alasan yang diperkenalkan γάρ, ketidaktahuan para pendengar, dan pertanyaan tidak langsung mengenai καιρός. “Waspadalah” dan “tetaplah berjaga-jaga” membedakan peringatan untuk siaga dari perintah untuk terus terjaga. “Kapan waktunya tiba” merupakan susunan Indonesia yang idiomatis untuk πότε ὁ καιρός ἐστιν tanpa menambahkan suatu peristiwa tertentu.
  naturalness: Ragamnya baku, jelas, dan alami dalam bahasa Indonesia modern. Tanda titik koma efektif menandai dua perintah pendek yang berurutan, sementara “sebab” memberi hubungan alasan dengan jelas.
  terminology: “Waktunya” mempertahankan keluasan καιρός; catatan kaki dengan tepat memberi kemungkinan “saat yang ditetapkan” dan “masanya” serta menjelaskan nuansa leksikalnya. Tidak ada istilah teologis atau nama yang memerlukan penyesuaian.
