id: MRK.13.11
reference: Mark 13:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂καὶ ὅταν⸃ ⸀ἄγωσιν ὑμᾶς παραδιδόντες, μὴ προμεριμνᾶτε τί ⸀λαλήσητε, ἀλλ’ ὃ ἐὰν δοθῇ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τοῦτο λαλεῖτε, οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τὸ ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/011.yaml
  text: And when they lead you away and hand you over[a], do not worry beforehand about what you should say; but whatever is given to you in that hour, speak that. For it is not you who are speaking[b], but the Holy Spirit.
translation:
  language: id
  text: Dan apabila mereka membawa kamu dan menyerahkan kamu, janganlah terlebih dahulu mencemaskan apa yang harus kamu katakan. Sebaliknya, katakanlah apa pun yang diberikan kepadamu pada saat itu. Sebab bukan kamu yang berbicara, melainkan Roh Kudus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὅταν
  choice: Dan apabila
  rationale: Menghubungkan ayat ini dengan konteks sebelumnya sekaligus menyatakan keadaan yang akan terjadi tanpa menghilangkan unsur kemungkinan dalam ὅταν.
- source_word: ἄγωσιν ὑμᾶς παραδιδόντες
  choice: mereka membawa kamu dan menyerahkan kamu
  rationale: Mengungkapkan verba utama dan partisipel sebagai dua verba terkoordinasi yang alami dalam bahasa Indonesia. 'Menyerahkan' di sini berarti menyerahkan kepada pihak berwenang, bukan secara khusus mengkhianati.
- source_word: μὴ προμεριμνᾶτε
  choice: janganlah terlebih dahulu mencemaskan
  rationale: Mempertahankan unsur waktu dari awalan προ- dan nuansa kekhawatiran atau kecemasan dalam μεριμνάω.
- source_word: τί λαλήσητε
  choice: apa yang harus kamu katakan
  rationale: Bentuk ini alami dalam bahasa Indonesia untuk pertanyaan mengenai isi pembelaan yang harus disampaikan; λαλέω dapat berarti 'berkata' atau 'berbicara'.
- source_word: ὃ ἐὰν δοθῇ ὑμῖν
  choice: apa pun yang diberikan kepadamu
  rationale: Mempertahankan bentuk pasif yang menyiratkan pemberi ilahi tanpa menyebutkannya secara eksplisit pada klausa ini.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: pada saat itu
  rationale: Padanan Indonesia yang alami bagi ungkapan Yunani yang menunjuk pada waktu genting tersebut.
- source_word: τοῦτο λαλεῖτε
  choice: katakanlah
  rationale: 'Dalam susunan ''katakanlah apa pun yang diberikan'', objek yang ditekankan oleh τοῦτο tetap tersampaikan secara alami: tepat apa yang diberikan itulah yang harus dikatakan.'
- source_word: οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες
  choice: Sebab bukan kamu yang berbicara
  rationale: Mempertahankan penekanan pada ὑμεῖς dan pertentangan langsung dengan Roh Kudus sebagai pelaku utama.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roh Kudus
  rationale: Padanan baku dan modern untuk sebutan ini dalam bahasa Indonesia.
theological_decisions:
- issue: Pelaku dalam perkataan yang diilhami saat penganiayaan
  choice: Para murid tetap diperintahkan untuk berkata, tetapi Roh Kudus dinyatakan sebagai pelaku utama yang berbicara melalui perkataan mereka.
  alternative: Menafsirkan para murid sebagai alat pasif semata, atau menafsirkan Roh Kudus hanya sebagai pengaruh ilahi yang umum.
  rationale: 'Teks Yunani mempertahankan kedua sisi sekaligus: para murid harus mengatakan apa yang diberikan kepada mereka, namun pertentangan ''bukan kamu ... melainkan Roh Kudus'' menegaskan sumber ilahi perkataan itu. Terjemahan tidak menyelesaikan ketegangan ini ke salah satu ekstrem.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Mencemaskan' menyampaikan kekhawatiran yang bersifat antisipatif, sedangkan 'terlebih dahulu' mempertahankan unsur προ-. Bentuk 'apa yang harus kamu katakan' dipilih karena lebih alami daripada padanan harfiah 'apa yang harus kamu bicarakan'.
