  source_fidelity: Terjemahan dengan setia menyampaikan rangkaian tindakan ‘membawa’ dan ‘menyerahkan’, larangan untuk tidak mencemaskan terlebih dahulu isi perkataan, pemberian yang pasif dan tidak menyebut pemberinya, serta kontras tegas antara para murid dan Roh Kudus sebagai yang berbicara. ‘Pada saat itu’ secara wajar menyampaikan ἐν ἐκείνῃ τῇ ὥρᾳ tanpa membatasi ‘jam’ secara harfiah.
  naturalness: Bahasa Indonesia modern, jelas, dan sesuai register. ‘Apa yang harus kamu katakan’ dan ‘katakanlah apa pun yang diberikan kepadamu’ adalah susunan yang alami. Pengulangan ‘kamu’ dalam klausa awal masih dapat diterima dan membantu mempertahankan kedua verba Yunani.
  terminology: ‘Roh Kudus’ adalah istilah baku modern dan tepat untuk τὸ πνεῦμα τὸ ἅγιον. ‘Mencemaskan’ dan ‘menyerahkan’ mempertahankan nuansa kecemasan antisipatif serta penyerahan kepada pihak berwenang tanpa menambahkan penafsiran.
