  text: Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ⸂ταῦτα συντελεῖσθαι πάντα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/004.yaml
  text: Tell us[a], when will these things be, and what will be the sign when all these things are about to be accomplished?
translation:
  language: id
  text: “Katakan kepada kami, kapan semua ini akan terjadi, dan apa tandanya ketika semua ini hendak diselesaikan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰπὸν ἡμῖν
  choice: Katakanlah kepada kami
  rationale: Imperatif aoris λέγω dengan objek tak langsung ἡμῖν diterjemahkan secara wajar dan tetap dekat dengan bentuk Yunani.
- source_word: πότε ταῦτα ἔσται
  choice: kapan semua itu akan terjadi
  rationale: Dalam konteks peristiwa yang telah dinubuatkan, ἔσται paling alami dipahami sebagai ‘akan terjadi’; ‘semua itu’ mempertahankan rujukan jamak ταῦτα tanpa terdengar kaku.
- source_word: τί τὸ σημεῖον
  choice: apa tandanya
  rationale: σημεῖον diterjemahkan dengan istilah Indonesia yang lazim, ‘tanda’; bentuk posesif -nya menghubungkannya secara alami dengan terjadinya seluruh peristiwa tersebut.
- source_word: ὅταν μέλλῃ
  choice: ketika ... akan segera
  rationale: ὅταν membuka klausa waktu, sedangkan μέλλω dengan infinitif mengandung nuansa prospektif atau sesuatu yang sudah mendekati pelaksanaan. ‘Akan segera’ mempertahankan nuansa itu dalam bahasa Indonesia yang alami.
- source_word: ταῦτα συντελεῖσθαι πάντα
  choice: semuanya itu ... digenapi
  rationale: πάντα memperluas ταῦτα menjadi keseluruhan peristiwa. συντελεῖσθαι adalah infinitif pasif yang menunjuk pada penyelesaian atau pencapaian akhir; ‘digenapi’ mempertahankan aspek pasif dan resultatif, meski ‘diselesaikan’ juga mungkin.
theological_decisions:
- issue: Daya eskatologis μέλλῃ + infinitif
  choice: Mempertahankan nuansa prospektif/dekat melalui ‘akan segera digenapi’.
  alternative: ‘akan digenapi’ atau ‘akan selesai terjadi’
  rationale: μέλλω tidak sebaiknya diratakan menjadi masa depan sederhana. Namun ‘segera’ di sini menyatakan bahwa peristiwa-peristiwa itu mendekati penggenapannya dalam klausa yang ditanyakan, bukan menetapkan suatu skema kronologi akhir zaman.
- issue: Makna συντελεῖσθαι
  choice: digenapi
  alternative: diselesaikan; mencapai akhirnya
  rationale: Kata kerja ini dapat menandakan penyelesaian atau pembawaan menuju akhir. ‘Digenapi’ cocok dengan register nubuat dan mempertahankan bentuk pasif, tanpa secara eksplisit menambahkan gagasan yang tidak ada seperti ‘mulai terjadi’.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan pertanyaan dibuat alami bagi pembaca umum; ‘semua itu’ menghindari kekakuan ‘hal-hal ini’, sedangkan ‘akan segera digenapi’ mempertahankan nuansa μέλλω tanpa menambahkan penjelasan doktrinal.
