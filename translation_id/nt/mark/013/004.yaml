  terminology: “Tanda” merupakan padanan yang tepat bagi σημεῖον. “Diselesaikan” lebih netral untuk συντελεῖσθαι dalam konteks rangkaian peristiwa daripada “digenapi,” yang dalam register Alkitab Indonesia lebih lazim mengacu pada nubuat atau janji.
