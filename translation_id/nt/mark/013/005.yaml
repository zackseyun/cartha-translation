  source_fidelity: Terjemahan setia pada teks Yunani. “Lalu” menyampaikan fungsi penghubung δέ secara wajar; “mulai berkata kepada mereka” mencerminkan ἤρξατο λέγειν αὐτοῖς tanpa menambahkan “murid-murid”; dan “Waspadalah, jangan sampai seorang pun menyesatkan kalian” mempertahankan imperatif berjaga-jaga serta peringatan μή dengan subjungtif. “Menyesatkan” dengan tepat memelihara cakupan πλανήσῃ, yaitu menipu dan membawa menyimpang.
  naturalness: Bahasa Indonesia baku modern, jelas, dan bernada naratif sewajarnya. “Waspadalah” cocok untuk register peringatan Yesus, sementara “kalian” secara alami menandai sasaran jamak.
  terminology: Nama “Yesus” dan istilah “menyesatkan” konsisten serta tidak memasukkan penafsiran teologis tambahan. Catatan kaki menyediakan alternatif leksikal yang sah, “memperdaya,” tanpa mempersempit arti utama.
