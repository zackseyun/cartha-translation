  text: ὁ δὲ Ἰησοῦς ⸂ἤρξατο λέγειν αὐτοῖς⸃· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/005.yaml
  text: Then Jesus began to say to them[a], “See to it that no one leads you astray.”
translation:
  language: id
  text: Lalu Yesus mulai berkata kepada mereka, “Waspadalah, jangan sampai seorang pun menyesatkan kalian.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Berhati-hatilah agar tidak seorang pun memperdaya kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lalu
  rationale: Partikel penghubung ringan ini melanjutkan alur narasi. “Lalu” terdengar alami dalam bahasa Indonesia tanpa memberi kesan pertentangan yang tidak dinyatakan oleh teks.
- source_word: ἤρξατο λέγειν
  choice: mulai berkata
  rationale: Ungkapan ini mempertahankan aspek permulaan dalam konstruksi Yunani dan tetap alami dalam narasi bahasa Indonesia. Kata “menjawab” tidak ditambahkan karena tidak terdapat dalam ayat ini.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Teks Yunani memakai kata ganti, bukan kata benda “murid-murid”. Terjemahan mempertahankan bentuk eksplisit ayat dan membiarkan konteks menentukan siapa yang dimaksud.
- source_word: Βλέπετε
  choice: Waspadalah
  rationale: Imperatif kini ini menyerukan kewaspadaan yang terus-menerus. “Waspadalah” menyampaikan daya peringatan dengan bahasa yang ringkas, wajar, dan bermartabat.
- source_word: μή τις ὑμᾶς πλανήσῃ
  choice: jangan sampai seorang pun menyesatkan kalian
  rationale: Konstruksi μή dengan subjungtif sesudah imperatif menyatakan bahaya yang harus dicegah. “Menyesatkan” mempertahankan cakupan πλανάω, yaitu memperdaya sekaligus membawa orang menyimpang dari jalan yang benar.
theological_decisions:
- issue: Cakupan peringatan dalam πλανήσῃ
  choice: Peringatan terhadap penipuan yang menyebabkan orang menyimpang dari jalan yang benar
  alternative: Peringatan yang hanya menyangkut penipuan intelektual
  rationale: πλανάω dapat menggambarkan tindakan memperdaya atau menyebabkan seseorang tersesat. “Menyesatkan” menjaga keluasan makna moral dan arah hidup tersebut tanpa menambahkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. “Kalian” dipakai untuk menandai bahwa ὑμᾶς berbentuk jamak; “mereka” dipertahankan agar identitas rujukannya tidak ditambahkan ke dalam teks.
