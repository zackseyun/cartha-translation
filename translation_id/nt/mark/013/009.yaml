  text: βλέπετε δὲ ὑμεῖς ἑαυτούς· ⸀παραδώσουσιν ὑμᾶς εἰς συνέδρια καὶ εἰς συναγωγὰς δαρήσεσθε καὶ ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/009.yaml
  text: But watch yourselves. They will hand you over to councils[a], and you will be beaten in synagogues, and you will stand before governors and kings because of me, as a testimony to them.
translation:
  language: id
  text: Tetapi, kalian sendiri harus berjaga-jaga. Orang-orang akan menyerahkan kalian kepada majelis-majelis, dan kalian akan dipukuli di rumah-rumah ibadat. Kalian juga akan dihadapkan kepada para gubernur dan raja karena Aku, sebagai kesaksian kepada mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai kesaksian terhadap mereka”; frasa ini juga dapat mengandung nuansa kesaksian yang memberatkan mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε δὲ ὑμεῖς ἑαυτούς
  choice: Namun, jagalah dirimu
  rationale: Imperatif kini menyerukan kewaspadaan terus-menerus, sedangkan pronomina eksplisit dan refleksif menegaskan tanggung jawab para murid sendiri. Bentuk tunggal kolektif 'dirimu' secara alami menyapa kelompok dengan nada langsung.
- source_word: παραδώσουσιν
  choice: akan menyerahkan
  rationale: Dalam konteks penganiayaan dan proses hukum, kata ini berarti menyerahkan seseorang kepada pihak berwenang; pilihan ini tidak mempersempit maknanya menjadi pengkhianatan pribadi.
- source_word: συνέδρια
  choice: majelis-majelis
  rationale: Bentuk jamak menunjuk pada berbagai dewan atau badan peradilan setempat, bukan hanya Sanhedrin di Yerusalem.
- source_word: συναγωγάς
  choice: rumah-rumah ibadat
  rationale: Padanan Indonesia yang lazim dan mudah dipahami untuk tempat sekaligus lingkungan kelembagaan sinagoge Yahudi.
- source_word: δαρήσεσθε
  choice: akan dipukuli
  rationale: Bentuk pasif mendatang menyatakan pemukulan fisik tanpa menentukan alat atau tata cara khusus sebagaimana dapat tersirat dalam 'dicambuk'.
- source_word: ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε
  choice: akan dihadapkan kepada para gubernur dan raja
  rationale: Bentuk pasif σταθήσεσθε dalam konteks yudisial menyiratkan bahwa mereka dibuat tampil di hadapan penguasa. 'Dihadapkan kepada' terdengar alami dan mempertahankan unsur keterpaksaan.
- source_word: ἕνεκεν ἐμοῦ
  choice: karena Aku
  rationale: Frasa ini menyatakan bahwa hubungan atau kesetiaan kepada Yesus menjadi alasan penganiayaan; kapitalisasi mengikuti kebiasaan penulisan pronomina ilahi dalam bahasa Indonesia.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: sebagai kesaksian bagi mereka
  rationale: μαρτύριον berarti kesaksian atau bukti. 'Bagi mereka' mempertahankan arah kepada para penguasa tanpa memaksakan nuansa menghakimi yang tidak diwajibkan oleh datif αὐτοῖς.
theological_decisions:
- issue: Daya makna εἰς μαρτύριον αὐτοῖς
  choice: Penampilan para murid di hadapan penguasa berfungsi sebagai kesaksian bagi mereka.
  alternative: Kesaksian itu berfungsi melawan mereka atau menjadi bukti yang memberatkan mereka.
  rationale: Bahasa Yunani memungkinkan nuansa kesaksian yang diarahkan kepada mereka dan, menurut konteks, mungkin juga kesaksian yang memberatkan. Teks utama memakai rumusan yang kurang interpretatif, sedangkan catatan kaki mempertahankan kemungkinan adversatif.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kalimat dipecah agar daftar penganiayaan mudah diikuti tanpa menghilangkan hubungan antarklausa Yunani. Istilah 'majelis-majelis' menjaga bentuk jamak dan tidak menyamakannya secara sempit dengan Sanhedrin.
