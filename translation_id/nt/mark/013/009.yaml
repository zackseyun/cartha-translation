  to: Tetapi, kalian sendiri harus berjaga-jaga. Orang-orang akan menyerahkan kalian kepada majelis-majelis, dan kalian akan dipukuli di rumah-rumah ibadat. Kalian juga akan dihadapkan kepada para gubernur dan raja karena Aku, sebagai kesaksian kepada mereka.[a]
