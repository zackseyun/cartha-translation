  text: 'And what I say to you I say to all: stay awake[a].'
translation:
  language: id
  text: 'Apa yang Kukatakan kepada kalian, Kukatakan kepada semua orang: Berjaga-jagalah.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tetaplah terjaga” atau “waspadalah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: apa yang
  rationale: Pronomina relatif netral tunggal ini dipakai secara substantival; “apa yang” menyampaikan makna resumptifnya secara alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ di sini hanya merupakan penghubung ringan. Hubungan dengan perkataan sebelumnya sudah wajar dalam bahasa Indonesia tanpa menambahkan “dan” atau “tetapi” yang dapat memberi tekanan berlebih.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: Bentuk datif orang kedua jamak mula-mula menunjuk kepada para murid. “Kalian” menyatakan kejamakan dengan jelas dan menyiapkan kontras dengan “semua orang”.
- source_word: λέγω ... λέγω
  choice: Kukatakan ... Kukatakan
  rationale: Pengulangan dipertahankan untuk mencerminkan struktur dan penekanan retoris bahasa Yunani.
- source_word: πᾶσιν
  choice: kepada semua orang
  rationale: Ungkapan ini mempertahankan cakupan luas dan inklusif. Penambahan “orang” diperlukan agar frasa tersebut alami dan tidak rancu dalam bahasa Indonesia.
- source_word: γρηγορεῖτε
  choice: tetaplah berjaga-jaga
  rationale: Imperatif kini jamak menyerukan kewaspadaan yang berkelanjutan. “Tetaplah berjaga-jaga” mempertahankan gambaran tetap terjaga sekaligus makna kewaspadaan dalam konteks.
theological_decisions:
- issue: Cakupan nasihat Yesus
  choice: Perkataan yang ditujukan kepada para murid secara eksplisit diperluas kepada semua orang.
  alternative: Perkataan ini dapat dipahami hanya berlaku bagi para pendengar langsung dalam konteks narasi.
  rationale: Bahasa Yunani membedakan “kepada kalian” dari “kepada semua”; terjemahan mempertahankan perluasan cakupan tersebut tanpa menjelaskan lebih jauh siapa saja yang tercakup.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapitalisasi pada bentuk klitik “Ku-” menandai bahwa penuturnya adalah Yesus. “Kalian” dipilih untuk menyatakan bentuk jamak secara jelas, sedangkan “semua orang” menyampaikan perluasan cakupan secara alami.
