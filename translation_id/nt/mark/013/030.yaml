  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη μέχρις οὗ ⸂ταῦτα πάντα⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/030.yaml
  text: Truly I say to you that this generation will certainly not pass away until all these things happen[a][b].
translation:
  language: id
  text: 'Sesungguhnya Aku berkata kepada kalian: Generasi ini[a] sama sekali tidak akan berlalu[b] hingga semua hal ini terjadi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bangsa ini” atau “keturunan ini”; kata Yunani γενεά dapat memiliki arti yang lebih luas, meskipun “generasi” merupakan terjemahan yang paling alami di sini.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “sama sekali tidak akan berlalu” menerjemahkan bentuk penyangkalan yang sangat tegas dalam bahasa Yunani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Sesungguhnya
  rationale: Menandai perkataan yang khidmat dan berwibawa; ungkapan ini alami dalam ragam Alkitab Indonesia yang tetap mudah dipahami.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepada kalian
  rationale: Mempertahankan bentuk ujaran langsung dan pronomina jamak ὑμῖν secara jelas.
- source_word: οὐ μὴ παρέλθῃ
  choice: pasti tidak akan berlalu
  rationale: Menyampaikan negasi Yunani yang sangat tegas tanpa mengubahnya menjadi pernyataan mutlak 'tidak akan pernah berlalu'.
- source_word: ἡ γενεὰ αὕτη
  choice: Angkatan ini
  rationale: Dalam konteks temporal ini, γενεά paling wajar menunjuk kepada kelompok sezaman atau generasi; 'angkatan' mempertahankan ketegangan penafsirannya tanpa penjelasan tambahan dalam teks.
- source_word: μέχρις οὗ
  choice: sebelum
  rationale: Dalam konstruksi negatif bahasa Indonesia, 'tidak akan ... sebelum' menyatakan batas waktu secara alami dan sepadan dengan 'hingga ... terjadi'.
- source_word: ταῦτα πάντα
  choice: semuanya ini
  rationale: Mewakili demonstrativa jamak dan cakupan πᾶς, dengan rujukan kepada seluruh peristiwa yang baru dibicarakan.
- source_word: γένηται
  choice: terjadi
  rationale: Secara alami menyatakan berlangsungnya peristiwa-peristiwa dalam konteks eskatologis.
theological_decisions:
- issue: Makna ἡ γενεὰ αὕτη dalam pembicaraan eskatologis
  choice: Diterjemahkan secara langsung sebagai 'Angkatan ini'.
  alternative: '''bangsa ini'' atau ''keturunan ini''; atau generasi mendatang yang menyaksikan tanda-tanda tersebut'
  rationale: Konteks paling alami mendukung arti generasi atau kelompok sezaman. Terjemahan tidak menentukan sistem eskatologis tertentu dan tetap mempertahankan ketegangan yang ada dalam sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kalian' dipakai untuk menyatakan dengan jelas bahwa ὑμῖν berbentuk jamak; kapitalisasi 'Aku' mengikuti konvensi rujukan ilahi dalam penerbitan Alkitab Indonesia. Semua penanda catatan kaki ditempatkan dalam teks utama.
