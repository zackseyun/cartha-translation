review_pass:
  verdict: revise
  source_fidelity: Draf pada dasarnya setia pada teks Yunani. Namun, μέχρις οὗ paling tepat diterjemahkan "hingga/sampai"; "sebelum" dapat terdengar seolah-olah peristiwa-peristiwa itu harus terjadi lebih dahulu daripada berlalunya generasi, bukan sebagai batas temporal yang dinyatakan oleh Yunani. Negasi οὐ μή sebaiknya dinyatakan dengan penegasan negatif "sama sekali tidak akan", bukan terutama dengan adverbia kepastian "pasti".
  naturalness: '"Generasi ini" lebih lazim dan jelas dalam bahasa Indonesia baku modern daripada "angkatan ini" untuk kelompok orang sezaman. "Hingga semua hal ini terjadi" alami, jelas, dan mempertahankan bentuk jamak ταῦτα πάντα.'
  terminology: '"Sesungguhnya", "Aku berkata kepada kalian", dan "terjadi" sesuai dengan register Alkitab Indonesia yang khidmat tetapi modern. Kapitalisasi "Aku" konsisten dengan konvensi penerbitan yang dirujuk draf. Catatan mengenai γενεά mempertahankan alternatif leksikal tanpa memaksakan tafsiran eskatologis.'
  issues:
