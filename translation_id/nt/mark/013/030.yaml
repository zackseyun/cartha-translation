    rationale: μέχρις οὗ berarti "hingga/sampai [waktu]". Dalam kalimat negatif Indonesia, "hingga" menyampaikan batas temporal sumber dengan lebih langsung dan menghindari nuansa urutan yang mungkin ditimbulkan oleh "sebelum".
  - severity: low
    issue: '"angkatan" kurang natural dibanding "generasi"'
    rationale: Walaupun "angkatan" dapat berarti kelompok sezaman, "generasi" merupakan padanan modern yang paling langsung untuk γενεά dalam konteks ini.
  - severity: medium
