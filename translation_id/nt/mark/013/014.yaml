source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως ⸀ἑστηκότα ὅπου οὐ δεῖ, ὁ ἀναγινώσκων νοείτω, τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/014.yaml
  text: But when you see the abomination of desolation standing where it ought not to be (let the reader understand)[a], then let those in Judea flee to the mountains[b],
translation:
  language: id
  text: Namun, ketika kamu melihat kekejian yang mendatangkan kehancuran berdiri di tempat yang tidak semestinya (hendaklah pembaca mengerti)[a], maka hendaklah orang-orang yang berada di Yudea melarikan diri ke pegunungan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Partisipel Yunani yang diterjemahkan “berdiri” berbentuk maskulin, meskipun kata “kekejian” berbentuk netral. Hal ini mungkin mengisyaratkan seorang pribadi di balik “kekejian” itu, sehingga ungkapan tersebut dapat dipahami sebagai “berdiri di tempat yang tidak seharusnya ia tempati.”
    reason: alternative_reading
  - marker: b
    text: Ungkapan “kekejian yang mendatangkan kehancuran” menggemakan bahasa dalam kitab Daniel (lihat Dan. 9:27; 11:31; 12:11).
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Namun, ketika
  rationale: Ὅταν memperkenalkan keadaan waktu yang akan terjadi, sedangkan δέ menjadi penghubung ringan. “Namun, ketika” menyatakan perkembangan dari peringatan sebelumnya tanpa membuat pertentangannya terlalu kuat.
- source_word: ἴδητε
  choice: kamu melihat
  rationale: Bentuk orang kedua jamak ini ditujukan kepada para murid. Bahasa Indonesia tidak wajib menandai jumlah pada “kamu”, sehingga ungkapan ini tetap alami dan tidak menambah penafsiran.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: kekejian yang mendatangkan kehancuran
  rationale: “Kekejian” mempertahankan bobot religius βδέλυγμα, sedangkan “yang mendatangkan kehancuran” menyampaikan hubungan dengan ἐρήμωσις secara jelas bagi pembaca modern tanpa menentukan apakah acuannya benda, tindakan, atau pribadi.
- source_word: ἑστηκότα
  choice: berdiri
  rationale: Partisipel perfek ἵστημι menggambarkan keadaan yang sedang berlangsung sebagai hasil penempatan sebelumnya. “Berdiri” mempertahankan gambaran konkret teks dan tidak mempersempit maknanya menjadi “didirikan” atau “dipasang”.
- source_word: ὅπου οὐ δεῖ
  choice: di tempat yang tidak semestinya
  rationale: δεῖ di sini menyatakan kepatutan atau keharusan. Susunan tanpa pronomina terdengar alami dalam bahasa Indonesia dan tidak memaksa pembaca memilih acuan benda atau pribadi.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: hendaklah pembaca memahaminya
  rationale: Ungkapan ini merupakan seruan dalam tanda kurung kepada orang yang membaca. “Hendaklah” mempertahankan daya imperatif, dan “memahaminya” menyampaikan νοείτω secara langsung.
- source_word: τότε
  choice: maka
  rationale: “Maka” menandai tindakan yang harus dilakukan sebagai akibat ketika tanda tersebut terlihat.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: orang-orang yang berada di Yudea
  rationale: Terjemahan ini mempertahankan cakupan kelompok dan lokasi geografis secara eksplisit.
- source_word: φευγέτωσαν
  choice: hendaklah ... melarikan diri
  rationale: Bentuk imperatif orang ketiga jamak menyampaikan perintah yang mendesak. “Hendaklah ... melarikan diri” mempertahankan kekuatan perintah dalam ragam Indonesia yang bermartabat.
- source_word: εἰς τὰ ὄρη
  choice: ke pegunungan
  rationale: ὄρη dapat berarti gunung-gunung atau daerah pegunungan. “Ke pegunungan” alami dalam konteks mencari perlindungan dan tetap mempertahankan gambaran topografis.
theological_decisions:
- issue: Makna ungkapan Danielik βδέλυγμα τῆς ἐρημώσεως
  choice: Memakai “kekejian yang mendatangkan kehancuran” tanpa menyebut acuan historis tertentu.
  alternative: “kekejian pembinasaan”; “pembinasa keji”; atau menyebut suatu benda, tindakan, maupun tokoh tertentu.
  rationale: Ungkapan ini dapat menunjuk pada benda, tindakan, atau pribadi yang bersifat mencemarkan. Teks utama mempertahankan daya alusi dan ketidakpastian acuannya, sedangkan catatan kaki menunjukkan kaitannya dengan Daniel.
- issue: Partisipel maskulin ἑστηκότα yang berkaitan dengan nomina netral βδέλυγμα
  choice: 'Menggunakan susunan Indonesia tanpa pronomina: “berdiri di tempat yang tidak semestinya,” lalu menjelaskan bentuk maskulin Yunani dalam catatan kaki.'
  alternative: “berdiri di tempat yang tidak seharusnya ia tempati,” yang lebih tegas memberi kesan acuan pribadi.
  rationale: Ketidakselarasan gramatikal dalam bahasa Yunani mungkin mengisyaratkan pribadi di balik istilah “kekejian”, tetapi tidak memastikan hal itu. Susunan Indonesia yang tidak menyatakan gender mempertahankan ambiguitas tersebut dengan alami.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur kalimat mempertahankan urutan tanda, seruan kepada pembaca, dan perintah mendesak dalam teks Yunani. Istilah apokaliptik dibuat cukup jelas bagi pembaca umum tanpa menetapkan acuan historis atau teologis yang diperdebatkan.
