base_translation:
  language: en
  yaml_path: translation/nt/mark/013/008.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom. There will be earthquakes in various places; there will be famines. These are the beginning of birth pains.
translation:
  language: id
  text: Sebab bangsa akan bangkit melawan bangsa, dan kerajaan melawan kerajaan. Akan terjadi gempa bumi di berbagai tempat, dan akan terjadi kelaparan. Semua ini adalah permulaan dari rasa sakit bersalin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “permulaan dari nyeri persalinan” atau “permulaan dari rasa sakit menjelang kelahiran.” Ungkapan Yunani menggambarkan rasa sakit yang menyertai persalinan dan digunakan sebagai metafora untuk penderitaan yang mendahului apa yang akan terjadi selanjutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: akan bangkit
  rationale: Bentuk pasif masa depan ini secara idiomatis menggambarkan bangkitnya suatu kelompok untuk berkonflik dengan kelompok lain. Bahasa Indonesia alami memakai bentuk aktif “akan bangkit” tanpa harus mempertahankan kepasifan gramatikal Yunani.
- source_word: ἔθνος ... ἐπ’ ἔθνος
  choice: bangsa ... melawan bangsa
  rationale: Dalam konteks konflik dan dalam kesejajaran dengan βασιλεία, “bangsa” mempertahankan cakupan politis-komunal ἔθνος, sedangkan “melawan” menyampaikan makna konfrontatif ἐπί.
- source_word: βασιλεία ... ἐπὶ βασιλείαν
  choice: kerajaan ... melawan kerajaan
  rationale: Di sini βασιλεία menunjuk pada wilayah atau kekuasaan politik, bukan semata-mata konsep abstrak tentang pemerintahan. Pilihan ini juga mempertahankan kesejajaran kalimat.
- source_word: σεισμοὶ
  choice: gempa bumi
  rationale: Dalam konteks ini σεισμός secara jelas menunjuk pada gempa bumi; bentuk Indonesia tidak perlu diulang untuk menyatakan jamak karena keberagaman tempat sudah menunjukkan kejadian berulang.
- source_word: κατὰ τόπους
  choice: di berbagai tempat
  rationale: 'Ungkapan ini menyampaikan daya distributif κατά dengan τόπους jamak: gempa terjadi di sejumlah lokasi.'
- source_word: λιμοί
  choice: kelaparan
  rationale: λιμός menunjuk pada bencana kelaparan atau kekurangan pangan yang parah. “Kelaparan” merupakan padanan langsung dan alami; bentuk jamak Yunani dapat dinyatakan tanpa reduplikasi dalam bahasa Indonesia.
- source_word: ἀρχὴ
  choice: awal
  rationale: “Awal” menyatakan bahwa kejadian-kejadian tersebut merupakan tahap permulaan, bukan keseluruhan dari apa yang akan menyusul.
- source_word: ὠδίνων
  choice: rasa sakit bersalin
  rationale: ὠδίν menggambarkan rasa sakit yang terkait dengan persalinan dan digunakan secara metaforis. Ungkapan ini mempertahankan citra kelahiran sekaligus mudah dipahami pembaca modern.
- source_word: ταῦτα
  choice: Semua ini
  rationale: Kata tunjuk jamak ini merujuk secara kolektif kepada peristiwa-peristiwa yang baru disebut. “Semua ini” alami dalam bahasa Indonesia dan mempertahankan cakupan jamaknya.
theological_decisions:
- issue: Metafora apokaliptik dalam ἀρχὴ ὠδίνων
  choice: “Semua ini adalah awal rasa sakit bersalin,” yang mempertahankan gambaran penderitaan pendahuluan tanpa menjelaskan secara dogmatis apa yang dilahirkannya.
  alternative: Meratakan metafora menjadi “ini hanyalah awal penderitaan” atau menafsirkannya secara khusus sebagai tahap tertentu dalam suatu skema eskatologis.
  rationale: Teks memakai citra persalinan untuk penderitaan yang mendahului sesuatu yang akan datang. Terjemahan mempertahankan citra dan ketegangan teologisnya tanpa memasukkan sistem penafsiran yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang lugas dan bernada khidmat. Pengulangan “akan terjadi” mempertahankan kesejajaran klausa Yunani. Penanda catatan kaki ditempatkan sesudah “rasa sakit bersalin,” yakni pada ungkapan yang dijelaskan.
