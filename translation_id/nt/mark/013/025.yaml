  text: καὶ οἱ ἀστέρες ⸂ἔσονται ἐκ τοῦ οὐρανοῦ πίπτοντες⸃, καὶ αἱ δυνάμεις αἱ ἐν τοῖς οὐρανοῖς σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/025.yaml
  text: And the stars will be falling from heaven[b][a], and the powers in the heavens will be shaken.
translation:
  language: id
  text: Dan bintang-bintang akan berjatuhan dari langit,[a] dan kuasa-kuasa yang ada di langit akan diguncangkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari surga.” Kata Yunani οὐρανός dapat berarti “langit” atau “surga”, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: “Kuasa-kuasa yang ada di langit” dapat merujuk pada kuasa surgawi, daya kosmis, atau tatanan langit; teks Yunani tidak menyatakannya secara lebih khusus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστέρες
  choice: bintang-bintang
  rationale: Padanan baku untuk bentuk jamak ἀστέρες dan sesuai dengan gambaran kosmis dalam wacana apokaliptik ini.
- source_word: ἔσονται ... πίπτοντες
  choice: akan berjatuhan
  rationale: Konstruksi perifrastis futurum dengan partisipel kini menyajikan tindakan mendatang secara hidup atau berlangsung. 'Akan berjatuhan' mempertahankan nuansa itu dengan bahasa Indonesia yang alami.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: dari langit
  rationale: Dalam kaitannya dengan bintang-bintang yang jatuh, 'langit' merupakan padanan Indonesia yang paling alami bagi οὐρανός; kemungkinan cakupan 'surga' tetap dicatat dalam catatan kaki.
- source_word: δυνάμεις
  choice: kuasa-kuasa
  rationale: Padanan ini mempertahankan keluasan makna δύναμις dalam bentuk jamak tanpa menentukan apakah yang dimaksud ialah makhluk surgawi, daya kosmis, atau tatanan langit.
- source_word: αἱ ἐν τοῖς οὐρανοῖς
  choice: yang ada di surga
  rationale: Frasa relatif Yunani dipertahankan. 'Di surga' terdengar wajar dalam bahasa Indonesia dan membedakannya dari langit yang tampak pada klausa pertama, tanpa menetapkan hakikat kuasa-kuasa tersebut.
- source_word: σαλευθήσονται
  choice: akan diguncangkan
  rationale: Mencerminkan futurum pasif σαλευθήσονται secara langsung dan mempertahankan daya gambaran kosmisnya.
theological_decisions:
- issue: Makna 'kuasa-kuasa yang ada di surga'
  choice: Diterjemahkan secara umum sebagai 'kuasa-kuasa yang ada di surga'.
  alternative: Makhluk-makhluk surgawi, daya-daya kosmis, atau unsur/tatanan langit.
  rationale: Bahasa Yunani tidak menentukan rujukannya secara lebih sempit. Terjemahan utama dan catatan kaki mempertahankan ambiguitas apokaliptik itu tanpa memasukkan tafsiran teologis tertentu.
- issue: Makna οὐρανός pada klausa pertama
  choice: '''Langit'' dalam teks utama.'
  alternative: '''Surga''.'
  rationale: Karena bintang-bintang digambarkan jatuh darinya, 'langit' paling alami dalam bahasa Indonesia. Namun, polisemi istilah Yunani tetap diakui dalam catatan kaki.
translation_notes:
  register: Bahasa modern, lugas, dan bermartabat. 'Berjatuhan' mengungkapkan tindakan yang hidup atau berlangsung; pengulangan 'akan' menjaga kesejajaran kedua klausa. Semua penanda catatan kaki dicantumkan dalam teks utama.
