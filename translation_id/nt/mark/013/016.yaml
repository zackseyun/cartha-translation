  text: καὶ ὁ εἰς τὸν ⸀ἀγρὸν μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω ἆραι τὸ ἱμάτιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/016.yaml
  text: And the one in the field must not turn back to get his cloak[a].
translation:
  language: id
  text: Dan orang yang berada di ladang jangan kembali untuk mengambil jubahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pakaian luarnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰς τὸν ἀγρόν
  choice: orang yang berada di ladang
  rationale: Konstruksi berartikel ini berfungsi sebagai nomina dan menunjuk secara umum kepada seseorang yang berada di ladang; ungkapan ini alami dalam bahasa Indonesia tanpa membatasi rujukannya hanya kepada laki-laki.
- source_word: ἀγρός
  choice: ladang
  rationale: Dalam konteks peringatan untuk segera melarikan diri, kata ini paling langsung menunjuk pada ladang atau tanah pertanian.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: jangan kembali
  rationale: Imperatif aoris dengan μή menyatakan larangan mendesak, sedangkan εἰς τὰ ὀπίσω menegaskan gerakan kembali ke tempat di belakang; 'jangan kembali' menyampaikan idiom tersebut secara alami.
- source_word: ἆραι
  choice: untuk mengambil
  rationale: Infinitif ini menyatakan tujuan kembali, yakni untuk mengambil barang yang ditinggalkan; 'mengambil' mempertahankan arti luas verba tanpa menambahkan cara tindakan.
- source_word: ἱμάτιον
  choice: jubah
  rationale: Kata ini menunjuk pada pakaian luar. 'Jubah' ringkas dan mudah dipahami, sementara alternatif yang lebih eksplisit dicantumkan dalam catatan kaki.
- source_word: αὐτοῦ
  choice: -nya
  rationale: Pronomina maskulin tunggal Yunani mengacu kepada orang tunggal tersebut. Sufiks '-nya' mempertahankan jumlah tunggal dan kepemilikan secara alami dalam bahasa Indonesia tanpa menentukan gender yang tidak perlu secara gramatikal.
theological_decisions:
- issue: Rujukan maskulin generik
  choice: Mempertahankan rujukan tunggal melalui 'orang yang ... jubahnya'.
  alternative: Menjamakkan menjadi 'orang-orang ... jubah mereka' atau menyebut secara khusus 'laki-laki'.
  rationale: Bahasa Yunani memakai bentuk maskulin tunggal secara generik. Bahasa Indonesia tidak memiliki pembedaan gender pada 'orang' dan '-nya', sehingga bentuk tunggal dapat dipertahankan tanpa mempersempit rujukan hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Larangan dibuat langsung dan mendesak; struktur tunggal sumber dipertahankan secara alami.
