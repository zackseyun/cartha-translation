  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης ἢ ⸀τῆς ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι ⸀ἐν οὐρανῷ οὐδὲ ὁ υἱός, εἰ μὴ ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/032.yaml
  text: But concerning that day or hour[a], no one knows—not even the angels in heaven, nor the Son, but only the Father.
translation:
  language: id
  text: Namun, mengenai hari itu atau saat itu, tidak seorang pun tahu—bahkan para malaikat di surga pun tidak, Anak pun tidak—hanya Bapa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian penafsir memahami frasa “Anak pun tidak” dengan mengacu pada tugas Anak dalam inkarnasi-Nya atau pada kodrat manusia-Nya. Terjemahan ini mempertahankan bunyi teks Yunani tanpa menambahkan penjelasan tersebut ke dalam teks utama.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Namun, mengenai
  rationale: περί dengan bentuk genitif memperkenalkan topik, sedangkan δέ menandai peralihan atau kontras ringan. Gabungan ini mempertahankan keduanya secara wajar dalam bahasa Indonesia.
- source_word: τῆς ἡμέρας ἐκείνης ἢ τῆς ὥρας
  choice: hari atau saat itu
  rationale: Frasa ini menunjuk kepada waktu yang sedang dibicarakan. 'Saat' dipilih untuk ὥρα karena dalam konteks ini cakupannya dapat berupa waktu tertentu, tidak harus satu jam berdurasi enam puluh menit.
- source_word: οὐδεὶς οἶδεν
  choice: tidak seorang pun tahu
  rationale: οὐδείς menyatakan penyangkalan menyeluruh, dan οἶδα, meskipun secara bentuk merupakan perfek, lazim bermakna kini, yaitu 'tahu'.
- source_word: οὐδὲ οἱ ἄγγελοι ἐν οὐρανῷ
  choice: bahkan malaikat-malaikat di surga tidak
  rationale: οὐδέ melanjutkan penyangkalan dengan tekanan klimaktis. Bentuk ulang 'malaikat-malaikat' menyatakan jamak secara jelas, dan ἐν οὐρανῷ dipahami secara lokatif.
- source_word: οὐδὲ ὁ υἱός
  choice: Anak pun tidak
  rationale: οὐδέ meneruskan rangkaian negatif dan memberi tekanan. 'Anak' dipertahankan sebagai gelar kristologis tanpa tambahan penafsiran.
- source_word: εἰ μὴ ὁ πατήρ
  choice: hanya Bapa
  rationale: Sesudah pernyataan negatif, εἰ μή memperkenalkan satu-satunya pengecualian. 'Hanya Bapa' menyatakan eksklusivitas itu secara alami dan ringkas.
theological_decisions:
- issue: Pernyataan kristologis bahwa Anak tidak mengetahui hari atau saat itu
  choice: Mempertahankan pernyataan lugas 'Anak pun tidak' tanpa pelunakan atau penjelasan tambahan dalam teks utama.
  alternative: Menambahkan pembatas seperti 'dalam kemanusiaan-Nya' atau 'dalam tugas-Nya sebagai manusia'.
  rationale: Teks Yunani secara eksplisit memuat οὐδὲ ὁ υἱός. Terjemahan mempertahankan ketegangan teologis yang asli dan tidak memasukkan sintesis doktrinal ke dalam kalimat terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan negatif dibuat alami sekaligus mempertahankan peningkatan tekanan dalam teks Yunani. Istilah 'saat' menghindari pembatasan ὥρα pada jam sebagai satuan durasi.
