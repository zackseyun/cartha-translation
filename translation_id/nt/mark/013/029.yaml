  verdict: approve
  source_fidelity: Teks Indonesia dengan setia menyampaikan hubungan inferensial οὕτως καὶ ὑμεῖς, pengamatan atas ταῦτα γινόμενα, dan perintah γινώσκετε. Subjek ἐγγύς ἐστιν memang tidak dinyatakan dalam bahasa Yunani; penggunaan “itu” beserta alternatif catatan kaki menjaga ketidakjelasan itu tanpa menentukannya secara teologis. “Di ambang pintu” merupakan idiom Indonesia yang wajar untuk ἐπὶ θύραις dan menyampaikan kedekatan yang sangat segera.
  naturalness: Bahasanya baku, jelas, dan mengalir alami dalam bahasa Indonesia modern. “Demikian juga kamu,” “apabila kamu melihat,” dan “ketahuilah” sesuai dengan register pengajaran Yesus. “Hal-hal ini sedang terjadi” jelas dan mempertahankan bentuk jamak sumber.
  terminology: Tidak ada istilah teologis yang dipaksakan. Kapitalisasi “Dia” dalam pembacaan alternatif selaras dengan kemungkinan pembacaan personal yang dicatat, sementara teks utama tetap netral. Penanda catatan kaki [a] ditempatkan tepat pada kata yang memerlukan klarifikasi.
