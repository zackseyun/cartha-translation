id: MRK.13.29
reference: Mark 13:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ⸂ἴδητε ταῦτα⸃ γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/029.yaml
  text: So also you[a], when you see these things happening, know that it is near, at the doors.
translation:
  language: id
  text: Demikian juga kamu, apabila kamu melihat hal-hal ini sedang terjadi, ketahuilah bahwa itu[a] sudah dekat, di ambang pintu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia sudah dekat.” Bahasa Yunani tidak menyebutkan subjeknya secara eksplisit.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Demikian juga kamu
  rationale: Mempertahankan kaitan dengan perumpamaan pohon ara sebelumnya sekaligus penekanan pada para murid sebagai pengamat yang sepadan.
- source_word: ὅταν ἴδητε
  choice: apabila kamu melihat
  rationale: ὅταν dengan subjungtif aoris menyatakan kemungkinan pada masa depan; 'apabila' alami dalam konteks nubuat bersyarat ini.
- source_word: ταῦτα γινόμενα
  choice: hal-hal ini sedang terjadi
  rationale: Bentuk jamak ταῦτα dipertahankan, sedangkan γινόμενα menunjukkan berbagai peristiwa yang berlangsung atau menjadi kenyataan.
- source_word: γινώσκετε
  choice: ketahuilah
  rationale: Menerjemahkan imperatif kini secara langsung sebagai perintah untuk menarik kesimpulan dari tanda-tanda yang terlihat.
- source_word: ὅτι ἐγγύς ἐστιν
  choice: bahwa itu sudah dekat
  rationale: Bahasa Yunani tidak menyebutkan subjek ἐστιν. 'Itu' mempertahankan rujukan umum pada penggenapan atau peristiwa yang mendekat tanpa menentukan subjek secara berlebihan.
- source_word: ἐπὶ θύραις
  choice: di ambang pintu
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan kedekatan yang amat segera. Walaupun θύραις berbentuk jamak, terjemahan harfiah 'di pintu-pintu' tidak alami dalam bahasa Indonesia.
theological_decisions:
- issue: Subjek tersirat dalam ἐστιν ('sudah dekat')
  choice: Memakai kata ganti netral 'itu' dalam teks utama.
  alternative: Memakai kata ganti personal 'Dia'.
  rationale: Teks Yunani tidak menyatakan subjek. 'Itu' tidak memaksakan apakah yang dimaksud ialah peristiwa atau penggenapan yang dinubuatkan, sedangkan catatan kaki mempertahankan kemungkinan bahwa yang dimaksud ialah Anak Manusia.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. 'Di ambang pintu' dipilih sebagai idiom alami untuk ἐπὶ θύραις; ambiguitas subjek dipertahankan melalui teks utama dan catatan kaki.
