  text: ἔσονται γὰρ αἱ ἡμέραι ἐκεῖναι θλῖψις οἵα οὐ γέγονεν τοιαύτη ἀπ’ ἀρχῆς κτίσεως ⸀ἣν ἔκτισεν ὁ θεὸς ἕως τοῦ νῦν καὶ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/019.yaml
  text: For those days will be a tribulation such as has not been from the beginning of the creation that God created until now[a], and never will be.
translation:
  language: id
  text: Sebab pada hari-hari itu akan terjadi kesusahan sedemikian rupa sehingga belum pernah terjadi sejak awal ciptaan yang diciptakan Allah sampai sekarang[a], dan tidak akan pernah terjadi lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kesusahan seperti yang belum pernah ada sejak awal ciptaan yang diciptakan Allah sampai sekarang, dan tidak akan pernah ada lagi.”'
    reason: Alternatif ini memakai verba “ada” untuk menerjemahkan γίνομαι secara idiomatis dan mempertahankan perbandingan kesusahan yang tiada bandingannya.
lexical_decisions:
- source_word: θλῖψις
  choice: masa kesusahan
  rationale: Kata ini menunjuk pada tekanan, penderitaan, atau kesusahan yang berat. Dalam kalimat ini, penambahan “masa” membuat hubungan predikatif dengan “hari-hari itu” alami dalam bahasa Indonesia tanpa menambahkan sistem eskatologis tertentu.
- source_word: οἵα οὐ γέγονεν τοιαύτη
  choice: yang belum pernah terjadi
  rationale: Ungkapan perbandingan ini menegaskan bahwa kesusahan tersebut tidak ada bandingannya dalam sejarah. Bentuk Indonesia ini alami dan mempertahankan penekanan pada keunikannya.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: sejak awal ciptaan
  rationale: “Ciptaan” mempertahankan istilah konkret κτίσις dan cakupan tatanan yang diciptakan, sedangkan “sejak” menyampaikan rentang waktu secara wajar.
- source_word: ἣν ἔκτισεν ὁ θεὸς
  choice: yang diciptakan Allah
  rationale: Klausa relatif dipertahankan meskipun terasa sedikit berulang, karena teks Yunani secara eksplisit menyebut Allah sebagai pencipta.
- source_word: ἕως τοῦ νῦν
  choice: sampai sekarang
  rationale: Padanan temporal langsung dan alami dalam bahasa Indonesia modern.
- source_word: οὐ μὴ γένηται
  choice: tidak akan pernah terjadi lagi
  rationale: Gabungan “tidak ... pernah” menyampaikan penyangkalan masa depan yang sangat tegas; “lagi” menunjukkan bahwa kesusahan sebanding tidak akan berulang tanpa menyatakan bahwa peristiwa yang sama berulang.
- source_word: ἔσονται ... αἱ ἡμέραι ἐκεῖναι θλῖψις
  choice: hari-hari itu akan menjadi masa kesusahan
  rationale: Susunan Yunani bersifat padat dan predikatif. “Masa kesusahan” menjelaskan bahwa hari-hari tersebut merupakan suatu periode kesusahan, bukan bahwa hari-harinya secara harfiah identik dengan sebuah peristiwa abstrak.
theological_decisions:
- issue: Cakupan bahasa tentang ciptaan
  choice: Mempertahankan “sejak awal ciptaan yang diciptakan Allah” tanpa mempersempitnya menjadi permulaan lokal atau perjanjian tertentu.
  alternative: “sejak dunia dijadikan” atau parafrasa “sejak awal dunia”
  rationale: Teks memakai κτίσις dan κτίζω serta menyebut Allah sebagai pelaku. Terjemahan ini mempertahankan cakupan penciptaan dan pengulangan yang disengaja tanpa memasukkan kerangka eskatologis tertentu.
- issue: Keunikan kesusahan pada masa depan
  choice: Menerjemahkan penyangkalan terakhir sebagai “tidak akan pernah terjadi lagi”.
  alternative: “sama sekali tidak akan terjadi” atau “tidak akan pernah ada”
  rationale: οὐ μή menyatakan penyangkalan masa depan yang tegas. Terjemahan tidak menentukan identitas historis peristiwa atau urutan eskatologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. “Masa kesusahan” menghindari kekakuan harfiah “hari-hari itu akan menjadi kesusahan”, sedangkan pengulangan “ciptaan yang diciptakan” dipertahankan karena mencerminkan penekanan teks sumber.
