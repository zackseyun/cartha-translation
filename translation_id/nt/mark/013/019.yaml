- from: Sebab hari-hari itu akan menjadi masa kesusahan yang belum pernah terjadi sejak awal ciptaan yang diciptakan Allah sampai sekarang[a], dan tidak akan pernah terjadi lagi.
  to: Sebab pada hari-hari itu akan terjadi kesusahan sedemikian rupa sehingga belum pernah terjadi sejak awal ciptaan yang diciptakan Allah sampai sekarang[a], dan tidak akan pernah terjadi lagi.
