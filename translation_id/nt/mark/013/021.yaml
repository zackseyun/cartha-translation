id: MRK.13.21
reference: Mark 13:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀καὶ τότε ἐάν τις ὑμῖν εἴπῃ· ⸀Ἴδε ὧδε ὁ ⸀χριστός, ⸁Ἴδε ἐκεῖ, μὴ πιστεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/021.yaml
  text: And then[a], if anyone says to you, ‘Look, here is the Messiah!’ or, ‘Look, there!’ do not believe it.
translation:
  language: id
  text: Kemudian, jika ada orang berkata kepada kalian, “Lihat, Mesias ada di sini!” atau, “Lihat, dia ada di sana!” jangan percaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ τότε
  choice: Kemudian
  rationale: Dalam bahasa Indonesia, “Kemudian” secara alami menandai hubungan dengan uraian sebelumnya sekaligus waktu berikutnya; menerjemahkan καί secara terpisah sebagai “dan” akan terasa kurang luwes di sini.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: jika ada orang berkata kepada kalian
  rationale: Menyampaikan syarat umum dan subjek tak tentu τις. “Kalian” memperjelas bahwa ὑμῖν berbentuk jamak.
- source_word: Ἴδε
  choice: Lihat
  rationale: Seruan penarik perhatian yang langsung, kuat, dan wajar dalam bahasa Indonesia modern.
- source_word: ὧδε
  choice: ada di sini
  rationale: ὧδε adalah adverbia tempat proksimal. Penambahan “ada” menghasilkan klaim keberadaan/lokasi yang alami dalam bahasa Indonesia tanpa mengubah makna.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Dengan artikel dan dalam konteks klaim tentang tokoh penyelamat akhir zaman, χριστός berfungsi sebagai gelar, sehingga “Mesias” mempertahankan daya titularnya.
- source_word: ἐκεῖ
  choice: ada di sana
  rationale: Menjaga kontras lokasi dengan “di sini”; “Dia” dipulihkan dari klausa sebelumnya agar ungkapan eliptis Yunani tetap jelas dan alami dalam bahasa Indonesia.
- source_word: μὴ πιστεύετε
  choice: jangan percaya
  rationale: Bahasa Yunani tidak menyebut objek secara eksplisit. Bentuk Indonesia ini juga membiarkannya terbuka, sehingga larangan dapat tertuju pada klaim tersebut tanpa mempersempitnya secara tidak perlu kepada pembicaranya.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Di sini istilah tersebut jelas berfungsi sebagai gelar dalam klaim mesianik palsu, bukan sebagai sebutan yang menyerupai nama diri. “Mesias” mempertahankan fungsi gelar dan latar Yahudinya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai untuk menandai bentuk jamak ὑμῖν. Elipsis pada seruan kedua dibuat alami dengan “Dia ada,” sementara objek πιστεύετε tetap tidak dinyatakan agar ambiguitas sumber terpelihara.
