  terminology: '"Tuhan", "diselamatkan", dan "orang-orang pilihan" sesuai. Klausa "yang telah dipilih-Nya" mempertahankan hubungan leksikal ἐκλεκτούς/ἐξελέξατο tanpa menentukan teori pemilihan. Catatan kaki dengan tepat menjelaskan σάρξ sebagai idiom manusia.'
