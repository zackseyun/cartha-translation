  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ⸂ἐκολόβωσεν κύριος⸃ τὰς ἡμέρας, οὐκ ἂν ἐσώθη πᾶσα σάρξ. ἀλλὰ διὰ τοὺς ἐκλεκτοὺς οὓς ἐξελέξατο ἐκολόβωσεν τὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/020.yaml
  text: And if the Lord had not cut short the days[a], no flesh would have been saved. But for the sake of the elect, whom he chose, he cut short the days.
translation:
  language: id
  text: Seandainya Tuhan tidak memperpendek hari-hari itu, tidak seorang pun[a] akan diselamatkan. Namun, demi orang-orang pilihan yang telah dipilih-Nya, Ia memperpendek hari-hari itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Harfiah: “tidak ada satu daging pun”; maksudnya, tidak ada seorang manusia pun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολόβωσεν
  choice: memperpendek
  rationale: Kata ini berarti memendekkan atau mempersingkat. Bentuk yang sama dipakai pada kedua kemunculannya untuk menjaga konsistensi.
- source_word: κύριος
  choice: Tuhan
  rationale: Merujuk secara definit kepada Tuhan; bahasa Indonesia tidak memerlukan artikel.
- source_word: τὰς ἡμέρας
  choice: masa itu
  rationale: Secara harfiah berarti 'hari-hari itu', tetapi dalam konteks menunjuk pada kurun kesengsaraan yang baru dibicarakan. 'Masa itu' menyampaikan rujukan temporal tersebut secara alami tanpa mempersempit maknanya.
- source_word: οὐκ ἂν ἐσώθη
  choice: tidak ... akan diselamatkan
  rationale: Konstruksi dengan ἄν menyatakan akibat yang tidak terjadi karena syaratnya berlawanan dengan kenyataan. 'Diselamatkan' mempertahankan padanan leksikal σῴζω, sementara konteks menunjukkan penyelamatan nyawa.
- source_word: πᾶσα σάρξ
  choice: tidak seorang pun[a]
  rationale: Ungkapan harfiahnya, 'tidak ada satu daging pun', merupakan idiom bagi manusia. Padanan alami Indonesia dipakai dalam teks utama, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: demi orang-orang pilihan
  rationale: διά dengan akusatif di sini menyatakan kepentingan atau alasan. 'Demi' ringkas dan alami; 'orang-orang pilihan' lebih mudah dipahami daripada istilah teknis 'kaum pilihan'.
- source_word: οὓς ἐξελέξατο
  choice: yang telah dipilih-Nya
  rationale: Menerjemahkan klausa relatif secara langsung dan mempertahankan kaitan leksikal dengan 'orang-orang pilihan'. Bentuk lampau 'telah dipilih' menunjukkan tindakan pemilihan yang mendahului tindakan memperpendek masa.
theological_decisions:
- issue: Makna 'diselamatkan' dalam konteks
  choice: Mempertahankan kata 'diselamatkan', dengan penyelamatan nyawa sebagai arti langsung dalam konteks.
  alternative: Menggunakan 'bertahan hidup' atau menafsirkannya semata-mata sebagai keselamatan rohani.
  rationale: Konteks membicarakan masa bencana yang diperpendek agar manusia tidak binasa. Padanan leksikal tetap dipertahankan tanpa menjadikan ayat ini pernyataan khusus tentang keselamatan kekal.
- issue: Identitas 'orang-orang pilihan'
  choice: Mempertahankan sebutan 'orang-orang pilihan' tanpa menjelaskan sifat pemilihan itu lebih jauh.
  alternative: Menentukan pemilihan ini secara khusus sebagai korporatif atau individual-predestinarian.
  rationale: Ayat menyebut mereka sebagai orang yang dipilih Tuhan, tetapi tidak menyelesaikan perdebatan teologis yang lebih luas mengenai hakikat pemilihan.
- issue: Subjek tersirat pada ἐξελέξατο dan ἐκολόβωσεν
  choice: Menyatakannya sebagai Tuhan melalui akhiran '-Nya' dan kata ganti 'Ia'.
  alternative: Mengulang 'Tuhan' pada setiap klausa.
  rationale: Subjek Yunani tersirat dan secara alami merujuk kembali kepada κύριος. Bentuk Indonesia ini jelas serta menghindari pengulangan yang kaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Masa itu' dipilih agar idiomatis untuk rangkaian 'hari-hari' yang menunjuk pada suatu kurun. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia dan tidak menambahkan klaim teologis baru.
