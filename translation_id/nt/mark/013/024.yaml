  terminology: '“Kesengsaraan” merupakan pilihan yang baik untuk θλῖψις dalam konteks ini: cukup berbobot untuk konteks apokaliptik tanpa menjadikannya istilah teknis bagi suatu sistem eskatologi tertentu. Istilah kosmis “matahari,” “bulan,” dan “cahayanya” jelas dan modern.'
