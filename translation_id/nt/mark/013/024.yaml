  source_fidelity: 'Teks Indonesia menyampaikan semua unsur utama Yunani: kontras Ἀλλὰ, penanda waktu ἐν ἐκείναις ταῖς ἡμέραις, urutan temporal μετὰ, demonstratif “itu,” serta dua tanda kosmis pada masa depan. “Akan menjadi gelap” adalah padanan Indonesia yang wajar bagi σκοτισθήσεται; walaupun bentuk pasif Yunani tidak direplikasi secara formal, terjemahan ini tidak menambahkan pelaku yang tidak disebutkan. “Tidak akan memancarkan cahayanya” secara idiomatis menyampaikan gambaran οὐ δώσει τὸ φέγγος αὐτῆς tanpa mengubah makna.'
