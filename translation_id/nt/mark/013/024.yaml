id: MRK.13.24
reference: Mark 13:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀλλὰ ἐν ἐκείναις ταῖς ἡμέραις μετὰ τὴν θλῖψιν ἐκείνην ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/024.yaml
  text: But in those days[a], after that tribulation, the sun will be darkened, and the moon will not give its light,
translation:
  language: id
  text: Namun, pada hari-hari itu, sesudah kesengsaraan itu, matahari akan menjadi gelap, dan bulan tidak akan memancarkan cahayanya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Namun
  rationale: Menandai kontras atau peralihan yang kuat dari uraian sebelumnya dengan bentuk yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: pada hari-hari itu
  rationale: Ungkapan waktu yang mempertahankan penunjukan demonstratif dan nuansa eskatologis teks Yunani.
- source_word: μετὰ τὴν θλῖψιν ἐκείνην
  choice: sesudah kesengsaraan itu
  rationale: μετά dengan akusatif menyatakan waktu, sedangkan kesengsaraan mempertahankan bobot θλῖψις dalam konteks apokaliptik tanpa menetapkan suatu skema akhir zaman tertentu.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: matahari akan menjadi gelap
  rationale: Menyampaikan kejadian pada masa depan secara alami dalam bahasa Indonesia; bentuk ini tidak menentukan pelaku yang tidak disebutkan oleh pasif Yunani.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: bulan tidak akan memancarkan cahayanya
  rationale: Memancarkan cahaya merupakan ungkapan Indonesia yang alami untuk bulan, sekaligus mempertahankan gambaran bahwa bulan tidak lagi memberikan terangnya.
theological_decisions:
- issue: Makna θλῖψις dalam wacana apokaliptik
  choice: kesengsaraan
  alternative: penderitaan; tekanan berat
  rationale: Kesengsaraan membawa bobot kuat yang sesuai dengan konteks, tetapi tidak menjadikannya istilah teknis yang mengharuskan sistem eskatologi tertentu.
- issue: Pasif σκοτισθήσεται dan pelaku yang tersirat
  choice: akan menjadi gelap
  alternative: akan digelapkan
  rationale: Terjemahan utama terdengar alami dan tidak menambahkan pelaku. Alternatif lebih formal mempertahankan bentuk pasif, tetapi dalam bahasa Indonesia dapat lebih kuat menyiratkan adanya pelaku tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Susunan paralel tanda-tanda kosmis dipertahankan. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas penting yang harus ditampilkan pada ayat ini.
