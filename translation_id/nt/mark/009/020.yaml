  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἤνεγκαν αὐτὸν πρὸς αὐτόν. καὶ ἰδὼν αὐτὸν ⸂τὸ πνεῦμα εὐθὺς⸃ ⸀συνεσπάραξεν αὐτόν, καὶ πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο ἀφρίζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/020.yaml
  text: And they brought him to him[a]. And when the spirit saw him, it immediately convulsed him, and he fell on the ground and rolled about[b], foaming.
translation:
  language: id
  text: Mereka pun membawa anak itu kepada Yesus. Ketika roh itu[a] melihat Yesus, roh itu segera membuat anak itu kejang-kejang hebat[b]. Anak itu jatuh ke tanah, lalu berguling-guling sambil berbusa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini secara harfiah hanya menyebut “roh itu”; konteks yang lebih luas mengidentifikasinya sebagai roh najis.
    reason: Menjaga ketepatan wording ayat sambil menjelaskan identitas yang diberikan oleh konteks.
  - marker: b
    text: 'Dapat juga diterjemahkan: “membuat anak itu mengalami kejang hebat.”'
    reason: Mencatat alternatif leksikal bagi συνεσπάραξεν tanpa menghilangkan gambaran kejang yang kuat.
lexical_decisions:
- source_word: ἤνεγκαν
  choice: membawa
  rationale: Dalam konteks ini, bentuk aoristus dari φέρω menyatakan bahwa mereka membawa anak itu menghadap Yesus; “membawa” alami dan tidak menyiratkan bahwa ia harus digendong.
- source_word: πρὸς αὐτόν
  choice: kepada Yesus
  rationale: πρός dengan akusatif menunjukkan gerak menuju seseorang. Nama “Yesus” dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia tanpa mengubah maknanya.
- source_word: ἰδὼν αὐτόν
  choice: ketika roh itu melihat Yesus
  rationale: Partisip aoristus diterjemahkan sebagai klausa waktu yang alami. Rujukan αὐτόν diperjelas sebagai Yesus agar dua pronomina maskulin dalam bahasa Yunani tidak menjadi rancu dalam bahasa Indonesia.
- source_word: τὸ πνεῦμα
  choice: roh itu
  rationale: Teks ayat ini hanya mengatakan “roh itu”; kata “jahat”, “najis”, atau “setan” tidak ditambahkan ke teks utama, meskipun sifat roh tersebut jelas dari konteks.
- source_word: εὐθὺς
  choice: segera
  rationale: “Segera” mempertahankan daya adverbia yang khas dalam narasi Markus dan tetap wajar dalam bahasa Indonesia modern.
- source_word: συνεσπάραξεν
  choice: membuat anak itu kejang-kejang hebat
  rationale: Kata kerja ini menggambarkan spasme atau kejang yang keras. Ungkapan ini jelas bagi pembaca modern serta mempertahankan roh sebagai penyebab tindakan tersebut.
- source_word: πεσὼν ἐπὶ τῆς γῆς
  choice: anak itu jatuh ke tanah
  rationale: Konstruksi partisipial diungkapkan sebagai klausa berpredikat agar pelakunya jelas dan rangkaian tindakan terdengar alami dalam bahasa Indonesia.
- source_word: ἐκυλίετο
  choice: berguling-guling
  rationale: Bentuk imperfek menggambarkan gerakan yang berlangsung atau berulang; reduplikasi “berguling-guling” menyampaikan aspek itu secara alami.
- source_word: ἀφρίζων
  choice: dengan mulut berbusa
  rationale: “Berbusa” menggambarkan keadaan yang menyertai gerakan anak itu. Penyebutan mulut membuat ungkapan ini idiomatis dalam bahasa Indonesia, dengan lokasi yang secara wajar tersirat oleh kata Yunani.
theological_decisions:
- issue: Identitas τὸ πνεῦμα
  choice: roh itu
  alternative: roh jahat; roh najis; setan
  rationale: Konteks bagian ini mengidentifikasi roh tersebut sebagai roh yang tidak tahir, tetapi ayat ini sendiri hanya memakai τὸ πνεῦμα. Terjemahan utama mempertahankan bentuk yang lebih umum itu dan tidak memasukkan penafsiran kontekstual ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama “Yesus” dan frasa “anak itu” menggantikan pronomina yang berpotensi rancu. Pengulangan “roh itu” disengaja untuk memastikan bahwa roh adalah subjek yang melihat dan menyebabkan kejang. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
