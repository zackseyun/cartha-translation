translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Urutan tindakan dalam bahasa Yunani dipertahankan, sementara rangkaian partisip disusun menjadi kalimat Indonesia yang alami. Koma penutup dipakai karena perkataan langsung Yesus berlanjut pada ayat berikutnya.
