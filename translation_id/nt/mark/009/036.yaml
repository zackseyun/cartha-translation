  text: καὶ λαβὼν παιδίον ἔστησεν αὐτὸ ἐν μέσῳ αὐτῶν καὶ ἐναγκαλισάμενος αὐτὸ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/036.yaml
  text: 'And taking a child[a], he set him in their midst, and taking him in his arms[b], he said to them:'
translation:
  language: id
  text: Lalu Ia mengambil seorang anak, lalu menempatkannya berdiri di tengah-tengah mereka.[a] Sambil memeluknya,[b] Ia berkata kepada mereka,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menempatkan anak itu di tengah-tengah mereka.” Verba Yunani yang dipakai secara harfiah berarti “menyebabkan berdiri”; dalam konteks ini, verba itu juga dapat diterjemahkan lebih luwes sebagai “menempatkan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “merangkulnya” atau “mengambilnya ke dalam pelukan-Nya.” Verba Yunani ini dapat menunjuk pada tindakan merangkul atau mengambil seseorang ke dalam pelukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: mengambil
  rationale: Partisip aoris dari λαμβάνω menyatakan tindakan yang mendahului verba utama. “Mengambil” mempertahankan tindakan konkret tanpa menambahkan bahwa anak itu dibawa dari tempat tertentu.
- source_word: παιδίον
  choice: seorang anak
  rationale: παιδίον menunjuk kepada seorang anak, kemungkinan masih kecil, tetapi nuansa usia yang lebih khusus tidak perlu dipaksakan dalam teks utama.
- source_word: ἔστησεν
  choice: menyuruh ... berdiri
  rationale: Bentuk kausatif dari ἵστημι berarti menyebabkan seseorang berdiri. Ungkapan ini mempertahankan gambaran konkret dalam bahasa Indonesia yang wajar.
- source_word: ἐν μέσῳ αὐτῶν
  choice: di tengah-tengah mereka
  rationale: Ungkapan ini mempertahankan unsur spasial bahwa anak tersebut ditempatkan di pusat kelompok, bukan sekadar berada bersama mereka.
- source_word: ἐναγκαλισάμενος
  choice: memeluk
  rationale: Verba ini dapat berarti merangkul atau mengambil ke dalam pelukan. “Memeluk” merupakan padanan Indonesia yang alami dan tetap mempertahankan tindakan fisiknya.
- source_word: εἶπεν αὐτοῖς
  choice: Ia berkata kepada mereka
  rationale: Padanan langsung dan netral yang mempertahankan penerima perkataan. “Ia” merujuk kepada Yesus dari konteks tanpa mengulang nama yang tidak terdapat dalam ayat Yunani ini.
