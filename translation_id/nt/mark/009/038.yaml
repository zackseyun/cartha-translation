  text: ⸂Ἔφη αὐτῷ ὁ Ἰωάννης⸃· Διδάσκαλε, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, ⸂καὶ ἐκωλύομεν αὐτόν, ὅτι οὐκ ἠκολούθει ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/038.yaml
  text: John said to him[a], “Teacher, we saw someone casting out demons in your name, and we tried to stop him because he was not following us.”
translation:
  language: id
  text: Yohanes berkata kepada-Nya, “Guru, kami melihat seseorang mengusir roh-roh jahat dalam nama-Mu, dan kami berusaha mencegahnya karena ia tidak mengikuti kami.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan kami terus mencegahnya.” Bentuk imperfek Yunani dapat menggambarkan tindakan yang berulang atau tindakan yang diupayakan; karena itu diterjemahkan “kami berusaha mencegahnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔφη αὐτῷ ὁ Ἰωάννης
  choice: Yohanes berkata kepada-Nya
  rationale: Bentuk ἔφη berfungsi sebagai verba ujaran dalam narasi dan wajar diterjemahkan dengan bentuk lampau kontekstual 'berkata'; subjek Yohanes dan objek tak langsung yang merujuk kepada Yesus dipertahankan.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Sapaan ini secara langsung berarti 'Guru' dan merupakan padanan Indonesia yang alami tanpa menambahkan nuansa lain.
- source_word: εἴδομέν τινα
  choice: kami melihat seseorang
  rationale: τινα bersifat tak tentu dan tidak perlu diperjelas menjadi 'seorang laki-laki'; 'seseorang' mempertahankan ketaktertentuan sumber.
- source_word: ἐν τῷ ὀνόματί σου
  choice: dalam nama-Mu
  rationale: Ungkapan ini mempertahankan idiom alkitabiah dan menyampaikan tindakan yang dilakukan dengan memakai atau berdasarkan kewibawaan nama Yesus.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: mengusir roh-roh jahat
  rationale: Dalam konteks Injil, frasa ini menunjuk pada tindakan mengeluarkan makhluk roh jahat. 'Roh-roh jahat' lebih mudah dipahami pembaca Indonesia modern daripada 'demon-demon'.
- source_word: καὶ ἐκωλύομεν αὐτόν
  choice: dan kami berusaha mencegahnya
  rationale: Imperfek ἐκωλύομεν dapat menggambarkan tindakan yang sedang, berulang, atau diupayakan. 'Berusaha mencegahnya' menyampaikan kemungkinan nuansa usaha tanpa menyatakan bahwa mereka pasti berhasil.
- source_word: ὅτι οὐκ ἠκολούθει ἡμῖν
  choice: karena ia tidak mengikuti kami
  rationale: ἡμῖν secara eksplisit berarti 'kami'. Terjemahan ini mempertahankan fokus Yohanes pada keterikatan kepada kelompok murid dan tidak mengubahnya menjadi mengikuti Yesus.
theological_decisions:
- issue: Arah kesetiaan orang itu dalam klausa penutup
  choice: karena ia tidak mengikuti kami
  alternative: karena ia tidak mengikuti-Mu; karena ia bukan bagian dari kelompok kami
  rationale: Teks Yunani secara eksplisit memakai ἡμῖν, 'kami'. Mempertahankannya menjaga ketegangan naratif yang akan ditanggapi Yesus dan menghindari penafsiran tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital menurut kebiasaan penerbitan Alkitab Indonesia. Penanda catatan kaki ditempatkan setelah kalimat yang memuat frasa terkait.
