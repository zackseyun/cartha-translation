  text: καὶ τὸν λόγον ἐκράτησαν πρὸς ἑαυτοὺς συζητοῦντες τί ἐστιν τὸ ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/010.yaml
  text: And they kept the matter to themselves[b][a], discussing what it meant to rise from the dead.
translation:
  language: id
  text: Mereka menyimpan perkataan itu di antara mereka sendiri sambil membicarakan apa artinya bangkit dari antara orang mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bangkit dari kematian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: perkataan itu
  rationale: Dalam konteks ini λόγος menunjuk pada perkataan atau pernyataan Yesus sebelumnya, bukan sekadar satu kata. “Perkataan itu” alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan ucapan Yesus.
- source_word: ἐκράτησαν
  choice: menyimpan
  rationale: κρατέω dengan πρὸς ἑαυτούς di sini menyatakan bahwa mereka memegang dan tidak menyebarkan perkataan itu di luar kalangan mereka; “menyimpan” menyampaikan makna tersebut secara wajar.
- source_word: πρὸς ἑαυτοὺς
  choice: di antara mereka sendiri
  rationale: Frasa ini dapat menyatakan bahwa perkara tersebut tetap berada dalam lingkaran mereka, sekaligus cocok dengan pembicaraan yang berlangsung antarmurid.
- source_word: συζητοῦντες
  choice: sambil membicarakan
  rationale: Partisipel ini menggambarkan percakapan atau pembahasan bersama. “Membicarakan” tidak melebihkan unsur pertentangan seperti yang mungkin tersirat oleh “berdebat”.
- source_word: τί ἐστιν
  choice: apa artinya
  rationale: Secara harfiah berarti “apa itu,” tetapi dalam konteks para murid berusaha memahami ungkapan Yesus; “apa artinya” merupakan padanan Indonesia yang alami.
- source_word: τὸ ἐκ νεκρῶν ἀναστῆναι
  choice: bangkit dari antara orang mati
  rationale: Bentuk ἐκ νεκρῶν secara lebih tepat menyatakan keluar dari antara golongan orang mati. Ungkapan ini dapat dipahami dalam bahasa Indonesia dan mempertahankan rincian sumber Yunani.
theological_decisions:
- issue: Bahasa kebangkitan dalam pembicaraan para murid
  choice: bangkit dari antara orang mati
  alternative: bangkit dari kematian
  rationale: Pilihan ini mempertahankan bentuk konkret ἐκ νεκρῶν dan kebingungan para murid tanpa memasukkan penjelasan doktrinal yang baru diberikan kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan hubungan perkataan Yesus dengan pembahasan pribadi para murid.
