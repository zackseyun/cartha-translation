base_translation:
  language: en
  yaml_path: translation/nt/mark/009/029.yaml
  text: And he said to them[a], “This kind cannot come out by anything except prayer.”
translation:
  language: id
  text: Lalu Yesus berkata kepada mereka, “Jenis ini tidak dapat keluar dengan cara apa pun kecuali melalui doa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah kemudian berbunyi, “melalui doa dan puasa.”
    reason: textual_variant
lexical_decisions:
- source_word: Τοῦτο τὸ γένος
  choice: Jenis ini
  rationale: γένος menunjuk pada suatu jenis atau golongan. Konteksnya adalah roh najis, tetapi teks Yunani tidak mengulangi kata 'roh', sehingga 'Jenis ini' mempertahankan ungkapan ringkas dan tidak menambahkan kata yang tidak tersurat.
- source_word: ἐν οὐδενὶ
  choice: dengan cara apa pun
  rationale: Frasa ini menyatakan sarana dan, dalam konstruksi negatif, berarti bahwa tidak ada cara atau sarana lain yang efektif. Ungkapan ini alami dalam bahasa Indonesia.
- source_word: δύναται ἐξελθεῖν
  choice: tidak dapat keluar
  rationale: δύναται dengan infinitif ἐξελθεῖν menyatakan ketidakmampuan. 'Keluar' sesuai dengan konteks keluarnya roh najis tanpa menambahkan gagasan pengusiran yang tidak dinyatakan langsung dalam frasa ini.
- source_word: εἰ μὴ
  choice: selain
  rationale: εἰ μὴ memperkenalkan satu-satunya pengecualian. 'Selain' menyatu secara alami dengan konstruksi negatif sebelumnya.
- source_word: ἐν προσευχῇ
  choice: melalui doa
  rationale: Preposisi ἐν di sini menunjukkan sarana. 'Melalui doa' mempertahankan nuansa instrumental dan menghasilkan kalimat Indonesia yang jelas dan alami.
theological_decisions:
- issue: Apakah frasa 'dan puasa' dimasukkan
  choice: Hanya 'doa' dalam teks utama
  alternative: '''doa dan puasa'''
  rationale: Teks SBLGNT hanya memuat προσευχῇ ('doa'). Bacaan yang menambahkan 'dan puasa' terdapat dalam sejumlah naskah yang lebih kemudian, sehingga dipertahankan dalam catatan kaki sebagai varian tekstual, bukan dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. Nama 'Yesus' dipakai untuk memperjelas subjek pronominal dalam pergantian adegan, sesuai kelaziman bahasa Indonesia. Penanda catatan kaki ditempatkan sesudah kutipan yang berkaitan.
