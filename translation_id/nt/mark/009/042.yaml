  source_fidelity: 'Terjemahan dengan setia mencerminkan struktur dan makna Yunani: σκανδαλίσῃ dipertahankan sebagai metafora “menyebabkan ... tersandung”; μικρῶν τούτων tidak dibatasi menjadi anak-anak; πιστευόντων εἰς ἐμέ diterjemahkan langsung; dan gambaran μύλος ὀνικός, benda di sekeliling leher, serta pelemparan ke laut tetap utuh. “Batu kilangan besar yang diputar oleh keledai” secara akurat mengomunikasikan jenis batu kilangan yang dimaksud.'
  naturalness: Bahasa Indonesia baku, jelas, dan bernada tegas. Susunan “Siapa pun yang menyebabkan salah seorang dari orang-orang kecil ini yang percaya kepada-Ku tersandung” memang padat, tetapi tetap alami dan dengan tepat mempertahankan keterikatan frasa “yang percaya kepada-Ku” pada “orang-orang kecil ini.” “Dikalungkan pada lehernya” dan “dilemparkan ke laut” juga wajar dalam register Alkitab modern.
  terminology: “Orang-orang kecil ini” secara sengaja mempertahankan keluasan rujukan tanpa menentukan bahwa mereka hanya anak-anak. “Tersandung” menjaga metafora sumber tanpa mempersempitnya menjadi dosa atau kemurtadan. Istilah “batu kilangan besar yang diputar oleh keledai” tepat, dan catatan kaki menjelaskan bentuk harfiahnya serta fungsi pembeda dari batu kilangan tangan.
