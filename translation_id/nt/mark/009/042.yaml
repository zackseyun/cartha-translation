id: MRK.9.42
reference: Mark 9:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὃς ⸀ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν ⸀τούτων τῶν πιστευόντων ⸂εἰς ἐμέ⸃, καλόν ἐστιν αὐτῷ μᾶλλον εἰ περίκειται ⸂μύλος ὀνικὸς⸃ περὶ τὸν τράχηλον αὐτοῦ καὶ βέβληται εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/042.yaml
  text: And whoever causes one of these little ones who believe in me to stumble[a], it is better for him if a donkey millstone is put around his neck and he is thrown into the sea.
translation:
  language: id
  text: Siapa pun yang menyebabkan salah seorang dari orang-orang kecil ini yang percaya kepada-Ku tersandung, lebih baik baginya jika sebuah batu kilangan besar yang diputar oleh keledai[a] dikalungkan pada lehernya dan ia dilemparkan ke laut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “batu kilangan keledai,” yaitu batu kilangan besar yang diputar oleh seekor keledai.
    reason: lexical_clarification
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: menyebabkan ... tersandung
  rationale: Mempertahankan metafora Yunani tentang tersandung, yang dalam konteks ini dapat mencakup jatuh ke dalam dosa atau meninggalkan iman, tanpa mempersempit maknanya.
- source_word: μικρῶν τούτων
  choice: orang-orang kecil ini
  rationale: Ungkapan ini tidak dibatasi hanya pada anak-anak; frasa berikutnya menyebut mereka sebagai orang yang percaya kepada Yesus. Pilihan ini mempertahankan cakupan yang dapat meliputi orang yang lemah, rentan, atau dipandang tidak penting.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: yang percaya kepada-Ku
  rationale: Merupakan padanan langsung dan lazim bagi konstruksi πιστεύω εἰς dengan objek pribadi.
- source_word: καλόν ἐστιν αὐτῷ μᾶλλον
  choice: lebih baik baginya
  rationale: Menyampaikan daya perbandingan μᾶλλον secara alami dalam bahasa Indonesia dan sesuai dengan nada peringatan yang keras.
- source_word: μύλος ὀνικός
  choice: sebuah batu kilangan besar yang diputar oleh keledai
  rationale: Menjelaskan bahwa yang dimaksud bukan batu kilangan tangan yang kecil, melainkan batu besar yang digerakkan oleh keledai; bentuk ini lebih jelas bagi pembaca modern.
- source_word: περίκειται ... περὶ τὸν τράχηλον
  choice: dikalungkan pada lehernya
  rationale: Mengungkapkan tindakan menempatkan sesuatu mengelilingi leher dengan idiom Indonesia yang ringkas dan wajar.
- source_word: βέβληται εἰς τὴν θάλασσαν
  choice: ia dilemparkan ke laut
  rationale: Menyampaikan bentuk pasif dan hasil tindakan secara hidup serta alami dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan 'orang-orang kecil ini'
  choice: Dibiarkan cukup luas untuk mencakup orang-orang percaya yang kecil, lemah, rentan, atau dipandang tidak penting.
  alternative: Membatasinya khusus pada anak-anak atau menafsirkannya hanya sebagai para murid yang rendah hati.
  rationale: Keterangan 'yang percaya kepada-Ku' menunjukkan bahwa usia bukan satu-satunya unsur yang dimaksud. Terjemahan tidak memaksakan satu rujukan yang lebih sempit.
- issue: Cakupan σκανδαλίσῃ
  choice: Menggunakan metafora 'menyebabkan ... tersandung'.
  alternative: Menafsirkannya secara lebih sempit sebagai 'menyebabkan ... berbuat dosa' atau 'membuat ... meninggalkan iman'.
  rationale: Kata Yunani dapat mencakup dosa, kejatuhan rohani, atau kemurtadan; metafora mempertahankan ketegangan dan keluasan makna tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. Metafora rohani 'tersandung' dipertahankan, sedangkan jenis batu kilangan dijelaskan dalam teks agar gambaran ancamannya mudah dipahami.
