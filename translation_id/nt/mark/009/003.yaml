base_translation:
  language: en
  yaml_path: translation/nt/mark/009/003.yaml
  text: And his clothes became gleaming[a], very white, such as no launderer on earth is able to whiten.
translation:
  language: id
  text: Pakaian-Nya menjadi berkilau dan sangat putih, seperti yang tidak dapat diputihkan demikian oleh seorang pun pencuci kain di bumi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱμάτια
  choice: pakaian
  rationale: Istilah umum untuk pakaian; alami dalam bahasa Indonesia modern dan tidak mempersempit makna menjadi jubah.
- source_word: ἐγένετο
  choice: menjadi
  rationale: Menandai perubahan keadaan dalam peristiwa transfigurasi.
- source_word: στίλβοντα
  choice: berkilau-kilau
  rationale: Menggambarkan kecemerlangan terang yang tampak tanpa menambahkan tafsiran teologis.
- source_word: λευκὰ λίαν
  choice: sangat putih
  rationale: Menerjemahkan warna dasar λευκά dan intensifikasi λίαν secara langsung dan wajar.
- source_word: γναφεύς
  choice: pencuci kain
  rationale: Merujuk kepada pekerja yang membersihkan dan memutihkan kain; frasa ini lebih mudah dipahami daripada istilah teknis atau kuno.
- source_word: ἐπὶ τῆς γῆς
  choice: di bumi
  rationale: Mempertahankan cakupan perbandingan dengan kemampuan manusia di bumi.
- source_word: οὐ δύναται οὕτως λευκᾶναι
  choice: tidak ... dapat memutihkannya seperti itu
  rationale: Menyatakan ketidakmampuan mencapai tingkat keputihan tersebut; objek -nya dipulihkan secara alami dari pakaian.
theological_decisions:
- issue: Dampak yang terlihat dalam peristiwa transfigurasi
  choice: Menggambarkan pakaian Yesus sebagai berkilau-kilau dan luar biasa putih tanpa penjelasan doktrinal tambahan.
  alternative: Memakai ungkapan interpretatif seperti “bersinar dengan kemuliaan”.
  rationale: Ayat ini melukiskan penampakan pakaian, bukan secara eksplisit menjelaskan makna teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Pengulangan “putih” mempertahankan tekanan retoris perbandingan dalam bahasa sumber sekaligus menghasilkan kalimat Indonesia yang alami.
