  - severity: low
    issue: Kapitalisasi pronomina “Ia”
    rationale: Kapitalisasi pronomina untuk Allah/Yesus merupakan konvensi tradisional, bukan tuntutan bahasa Indonesia baku modern. Huruf kecil lebih konsisten dengan register modern standar dan tidak mengubah makna.
