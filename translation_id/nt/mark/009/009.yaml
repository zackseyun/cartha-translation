  text: ⸂Καὶ καταβαινόντων⸃ αὐτῶν ⸀ἐκ τοῦ ὄρους διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸂ἃ εἶδον διηγήσωνται⸃, εἰ μὴ ὅταν ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ἀναστῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/009.yaml
  text: And as they were coming down from the mountain[a], he ordered them to tell no one what they had seen[b], except when the Son of Man had risen from among the dead.
translation:
  language: id
  text: Ketika mereka sedang turun dari gunung, ia memerintahkan mereka supaya tidak menceritakan kepada siapa pun apa yang telah mereka lihat, kecuali setelah Anak Manusia bangkit dari antara orang mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih dekat dengan ungkapan Yunani, “kecuali apabila Anak Manusia sudah bangkit dari antara orang mati”; secara idiomatis, “sampai Anak Manusia bangkit dari antara orang mati.”
    reason: alternative_reading
lexical_decisions:
- source_word: καταβαινόντων
  choice: ketika mereka sedang turun
  rationale: Partisipel kini dalam konstruksi genitif absolut menyatakan tindakan yang sedang berlangsung bersamaan dengan perintah; bentuk ini alami dalam bahasa Indonesia dan mempertahankan aspek tersebut.
- source_word: ὄρους
  choice: gunung
  rationale: ὄρος lazim berarti gunung dan sesuai dengan latar kisah pemuliaan.
- source_word: διεστείλατο
  choice: Ia memerintahkan
  rationale: Kata kerja ini menyatakan pemberian perintah atau arahan yang tegas. 'Memerintahkan' mempertahankan kekuatannya tanpa ungkapan arkais.
- source_word: ἵνα μηδενὶ ... διηγήσωνται
  choice: supaya tidak menceritakan kepada siapa pun
  rationale: Terjemahan ini mempertahankan isi perintah, unsur negatif μηδενί, dan makna διηγέομαι sebagai menceritakan atau menuturkan.
- source_word: ἃ εἶδον
  choice: apa yang telah mereka lihat
  rationale: Pronomina relatif netral jamak diterjemahkan secara alami sebagai 'apa yang'; 'telah' menunjukkan bahwa penglihatan itu terjadi sebelum perintah diberikan.
- source_word: εἰ μὴ ὅταν
  choice: kecuali apabila
  rationale: Ungkapan ini secara dekat berarti 'kecuali ketika/apabila' dan mengaitkan pengecualian dengan suatu peristiwa yang akan datang, tanpa diam-diam menggantinya dengan konstruksi 'sampai'.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Sebutan ini diterjemahkan dengan bentuk Indonesia yang mapan sambil mempertahankan daya titular serta gema alkitabiahnya.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: ἐκ dengan bentuk jamak νεκρῶν menggambarkan kebangkitan dari antara orang-orang mati, bukan hanya keluar dari keadaan kematian.
- source_word: ἀναστῇ
  choice: sudah bangkit
  rationale: Aoris subjungtif sesudah ὅταν menunjuk pada peristiwa mendatang yang telah selesai pada saat pengecualian itu berlaku; 'sudah bangkit' menyatakannya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: Bentuk tradisional ini tetap jelas dan mempertahankan sebutan diri Yesus serta kemungkinan gema Daniel tanpa mereduksinya menjadi sebutan manusia biasa.
- issue: Daya temporal εἰ μὴ ὅταν
  choice: kecuali apabila Anak Manusia sudah bangkit
  alternative: sampai Anak Manusia bangkit
  rationale: Pilihan utama mengikuti bentuk Yunani 'kecuali apabila' dan tetap menyatakan pembatasan waktu. Alternatif 'sampai' menyampaikan dampak praktis perintah dengan lebih idiomatis, sehingga dicatat tanpa menghapus ketegangan bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pronomina 'Ia' mempertahankan subjek tersirat dari konteks tanpa menambahkan nama. Frasa 'dari antara orang mati' sengaja mempertahankan nuansa bentuk jamak Yunani.
