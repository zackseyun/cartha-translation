  terminology: “Anak Manusia” adalah padanan mapan dan tepat untuk ὁ υἱὸς τοῦ ἀνθρώπου. “Dari antara orang mati” dengan baik mempertahankan nuansa ἐκ νεκρῶν. Penggunaan huruf kecil pada “ia” mengikuti ejaan modern baku tanpa mengubah rujukan kontekstualnya.
