  to: Ketika mereka sedang turun dari gunung, ia memerintahkan mereka supaya tidak menceritakan kepada siapa pun apa yang telah mereka lihat, kecuali setelah Anak Manusia bangkit dari antara orang mati.[a]
  rationale: Revisi mengganti penghubung bersyarat “kecuali apabila” dengan “kecuali setelah” agar pembatasan waktu yang dimaksud oleh εἰ μὴ ὅταν dan ἀναστῇ jelas dalam bahasa Indonesia modern. Catatan kaki mempertahankan kedekatan bentuk Yunani sekaligus mencatat alternatif idiomatis “sampai.” Kapitalisasi pronomina juga dinormalkan untuk ragam Indonesia baku modern.
