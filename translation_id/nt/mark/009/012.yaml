revisions:
- from: Ia berkata kepada mereka, “Memang, Elia datang lebih dahulu dan memulihkan segala sesuatu. Lalu, bagaimana ada tertulis tentang Anak Manusia bahwa Ia harus banyak menderita dan dipandang sebagai bukan apa-apa[a]?”
  to: Ia berkata kepada mereka, “Elia memang datang lebih dahulu dan memulihkan segala sesuatu. Dan bagaimana tentang Anak Manusia ada tertulis bahwa Ia harus banyak menderita dan dianggap tidak bernilai[a]?”
  rationale: The revision removes the added connective nuance of “Lalu,” improves the naturalness of the question, and replaces an awkward literalism with an idiomatic equivalent that preserves the passive sense and evaluative force of ἐξουδενηθῇ. The rhetorical question and the unresolved juxtaposition of restoration and suffering remain intact.
