    text: Atau “dihina” atau “dianggap bukan apa-apa.” Kata Yunani ini berarti dipandang atau diperlakukan sebagai sesuatu yang tidak bernilai.
    reason: lexical_alternative
  revision_rationale: The revision removes the added connective nuance of “Lalu,” improves the naturalness of the question, and replaces an awkward literalism with an idiomatic equivalent that preserves the passive sense and evaluative force of ἐξουδενηθῇ. The rhetorical question and the unresolved juxtaposition of restoration and suffering remain intact.
