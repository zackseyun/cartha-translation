source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἔφη αὐτοῖς· Ἠλίας μὲν ἐλθὼν πρῶτον ⸀ἀποκαθιστάνει πάντα, καὶ πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου ἵνα πολλὰ πάθῃ καὶ ⸀ἐξουδενηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/012.yaml
  text: He said to them[a], “Elijah indeed, having come first, restores all things. And how is it written about the Son of Man that he should suffer many things and be treated with contempt?”
translation:
  language: id
  text: Ia berkata kepada mereka, “Elia memang datang lebih dahulu dan memulihkan segala sesuatu. Dan bagaimana tentang Anak Manusia ada tertulis bahwa Ia harus banyak menderita dan dianggap tidak bernilai[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dihina” atau “dianggap bukan apa-apa.” Kata Yunani ini berarti dipandang atau diperlakukan sebagai sesuatu yang tidak bernilai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: Ia berkata kepada mereka
  rationale: Ungkapan naratif yang alami dan tepat untuk verba ujaran Yunani beserta objek tak langsungnya.
- source_word: Ἠλίας μὲν ἐλθὼν πρῶτον
  choice: Memang, Elia datang lebih dahulu
  rationale: Partikel μὲν diberi nuansa penegasan dengan “memang,” sedangkan partisip aoris diperlancar menjadi verba finit tanpa menghilangkan gagasan bahwa kedatangan Elia mendahului pemulihan.
- source_word: ἀποκαθιστάνει πάντα
  choice: memulihkan segala sesuatu
  rationale: Bentuk kini dipertahankan sebagai pernyataan umum; “memulihkan” menyampaikan gagasan mengembalikan kepada keadaan semestinya, dan “segala sesuatu” mempertahankan keluasan πάντα.
- source_word: πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: bagaimana ada tertulis tentang Anak Manusia
  rationale: “Ada tertulis” merupakan rumusan rujukan Kitab Suci yang lazim, sementara “tentang” sesuai dengan fungsi ἐπί di sini. Gelar “Anak Manusia” dipertahankan tanpa penafsiran tambahan.
- source_word: ἵνα πολλὰ πάθῃ
  choice: bahwa Ia harus banyak menderita
  rationale: ἵνα menyatakan isi atau ketentuan yang tertulis; “harus” secara alami menyampaikan keniscayaan menurut Kitab Suci, sedangkan πολλὰ dirender idiomatis sebagai “banyak.”
- source_word: ἐξουδενηθῇ
  choice: dipandang sebagai bukan apa-apa
  rationale: Pilihan ini mempertahankan citra leksikal verba tersebut, yaitu dianggap tidak bernilai atau tidak berarti, sekaligus mempertahankan bentuk pasif.
theological_decisions:
- issue: Hubungan antara pemulihan oleh Elia dan penderitaan Anak Manusia
  choice: Mempertahankan kalimat kedua sebagai pertanyaan retoris yang sungguh-sungguh tanpa menjelaskan hubungan logisnya.
  alternative: Menambahkan penghubung pertentangan seperti “tetapi kalau begitu” atau mengubahnya menjadi penjelasan doktrinal.
  rationale: Teks Yunani menjajarkan pemulihan dan penderitaan dalam bentuk pertanyaan. Terjemahan tidak boleh menyelesaikan ketegangan yang dibiarkan terbuka oleh teks.
- issue: Rujukan gelar υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia atau Mesias
  rationale: Gelar Injili yang penting secara teologis ini diterjemahkan menurut bentuk tradisional yang jelas dan tidak diperluas secara interpretatif.
- issue: Daya ἵνα dalam pernyataan tentang penderitaan
  choice: bahwa Ia harus banyak menderita
  alternative: supaya Ia banyak menderita
  rationale: Dalam konteks rumusan “ada tertulis,” klausa tersebut menyatakan isi dan keniscayaan yang dinyatakan Kitab Suci, bukan tujuan sederhana.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur Yunani dipertahankan sejauh alami; partisip diperlancar menjadi verba finit. Pertanyaan retoris dan ketegangan teologisnya tidak diharmoniskan.
