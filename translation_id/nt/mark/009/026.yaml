base_translation:
  language: en
  yaml_path: translation/nt/mark/009/026.yaml
  text: And after crying out and convulsing him greatly[a], it came out; and he became like a dead man, so that many were saying[b], “He is dead.”
translation:
  language: id
  text: Setelah menjerit dan membuat anak itu mengalami kejang-kejang hebat[a], roh itu keluar. Anak itu menjadi seperti orang mati, sehingga banyak orang berkata[b], “Ia sudah mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “setelah mengguncang anak itu hingga kejang-kejang hebat.”
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “ia menjadi seperti orang mati,” yang menunjukkan bagaimana ia tampak di mata orang-orang yang melihatnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας
  choice: sesudah menjerit
  rationale: Partisip aoris menunjukkan tindakan yang mendahului verba utama. “Menjerit” mempertahankan tindakan berseru keras tanpa menambahkan rincian nada yang tidak dinyatakan.
- source_word: πολλὰ σπαράξας
  choice: membuat anak itu kejang hebat
  rationale: Dalam konteks pengusiran roh, σπαράσσω menunjuk pada tindakan menyebabkan kejang, bukan merobek secara harfiah. πολλὰ berfungsi sebagai penguat; “hebat” menyampaikan intensitasnya secara alami. Objek “anak itu” diperjelas dari konteks.
- source_word: ἐξῆλθεν
  choice: roh itu keluar
  rationale: Subjek tersiratnya adalah roh dari konteks sebelumnya. Menyebut “roh itu” menghindari pronomina Indonesia yang kabur dan tetap tidak menambahkan jenis roh yang tidak disebut dalam ayat ini.
- source_word: ἐγένετο ὡσεὶ νεκρός
  choice: Anak itu menjadi seperti orang mati
  rationale: ὡσεὶ menyatakan kemiripan atau penampakan, bukan penegasan narator bahwa anak itu benar-benar mati. “Menjadi seperti orang mati” mempertahankan perbandingan tersebut.
- source_word: ὥστε τοὺς πολλοὺς λέγειν
  choice: sehingga banyak orang berkata
  rationale: τοὺς πολλούς paling wajar diterjemahkan “banyak orang” tanpa harus berarti mayoritas. Konstruksi akibat dengan λέγειν disampaikan secara alami sebagai “sehingga ... berkata.”
- source_word: ὅτι ἀπέθανεν
  choice: “Ia sudah mati.”
  rationale: Tuturan langsung alami dalam bahasa Indonesia. “Sudah mati” menyampaikan kesimpulan para pengamat bahwa kematian telah terjadi, tanpa menjadikannya pernyataan narator.
theological_decisions:
- issue: Apakah anak itu benar-benar mati atau hanya tampak mati
  choice: Narator menyatakan bahwa anak itu menjadi seperti orang mati, sedangkan kematiannya merupakan kesimpulan orang banyak.
  alternative: Anak itu benar-benar mati untuk sementara.
  rationale: Kata pembanding ὡσεὶ (“seperti/seakan-akan”) dan pembingkaian “banyak orang berkata” menempatkan kematian sebagai penampakan dan persepsi para saksi, bukan sebagai penegasan langsung narator. Terjemahan mempertahankan ketegangan ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Rujukan subjek diperjelas sebagai “roh itu” dan “anak itu” karena bahasa Indonesia tidak membedakan gender dalam pronomina orang ketiga; penjelasan ini mencegah ambiguitas tanpa mengubah isi.
