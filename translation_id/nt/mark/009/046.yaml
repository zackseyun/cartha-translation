  register: Bahasa Indonesia baku modern dengan susunan yang ringkas dan khidmat. Ungkapan "di tempat" menerjemahkan ὅπου secara alami, sedangkan "ulat mereka" mempertahankan citra dan ambiguitas kepunyaan dalam teks Yunani.
