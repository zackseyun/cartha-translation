  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini tidak terdapat dalam naskah-naskah Yunani paling awal (termasuk Sinaiticus dan Vaticanus dari abad ke-4) maupun dalam terjemahan-terjemahan Koptik awal, tetapi terdapat dalam tradisi mayoritas Bizantin dan tradisi Latin. Kemungkinan besar ayat ini merupakan tambahan penyalin pada masa kemudian yang mengulangi kata-kata yang sama persis dari ayat 48 (dan ayat 44).
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: ulat
  rationale: Menunjuk pada ulat yang memakan bahan membusuk. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kaitan langsung dengan Yesaya 66:24.
- source_word: τελευτᾷ
  choice: mati
  rationale: Dalam konteks ini, verba tersebut menyatakan bahwa ulat itu tidak mati; bentuk kini menekankan keadaan yang terus berlangsung.
- source_word: σβέννυται
  choice: dipadamkan
  rationale: Bentuk pasif ini secara tepat menggambarkan api yang tidak dibuat padam, sekaligus mempertahankan bahasa penghakiman yang kuat.
