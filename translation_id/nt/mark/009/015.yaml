  text: καὶ ⸀εὐθὺς πᾶς ὁ ὄχλος ⸂ἰδόντες αὐτὸν ἐξεθαμβήθησαν⸃, καὶ προστρέχοντες ἠσπάζοντο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/015.yaml
  text: And immediately the whole crowd[a], when they saw him, were greatly amazed, and running up to him, greeted him.
translation:
  language: id
  text: Segera, ketika seluruh orang banyak itu melihat dia, mereka sangat tercengang[a]. Mereka berlari menghampirinya dan memberi salam kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “sangat takjub” atau “menjadi gentar”. Kata Yunani yang digunakan dapat menyatakan ketakjuban, keterkejutan, atau kegentaran yang sangat kuat, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: segera
  rationale: Mempertahankan desakan dan gerak cepat yang khas dalam narasi Markus dengan ungkapan Indonesia yang alami.
- source_word: πᾶς ὁ ὄχλος
  choice: seluruh orang banyak itu
  rationale: Menyatakan kelompok tersebut sebagai satu keseluruhan dan mempertahankan cakupan πᾶς.
- source_word: ἰδόντες αὐτόν
  choice: setelah melihat dia
  rationale: Partisip aoris dipahami secara temporal sebagai peristiwa yang langsung mendahului dan memicu reaksi orang banyak.
- source_word: ἐξεθαμβήθησαν
  choice: sangat takjub
  rationale: Mengungkapkan intensitas keterkejutan atau ketakjuban tanpa menetapkan penyebab yang tidak disebutkan dalam teks.
- source_word: προστρέχοντες
  choice: berlari menghampirinya
  rationale: Mempertahankan gerakan cepat ke arah Yesus dalam bentuk Indonesia yang jelas dan hidup.
- source_word: ἠσπάζοντο αὐτόν
  choice: memberi salam kepadanya
  rationale: Menyampaikan arti netral ἀσπάζομαι tanpa menyiratkan tindakan khusus seperti berjabat tangan.
theological_decisions:
- issue: Nuansa reaksi orang banyak dalam ἐξεθαμβήθησαν
  choice: sangat takjub
  alternative: sangat tercengang; menjadi gentar
  rationale: Konteks menunjukkan reaksi yang sangat kuat, tetapi tidak menjelaskan apakah itu semata-mata ketakjuban, keterkejutan, atau kegentaran. Teks utama memakai ungkapan alami yang cukup luas, sedangkan catatan kaki mempertahankan kemungkinan nuansa lainnya tanpa memasukkan dugaan tentang cahaya adikodrati pada wajah Yesus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Kalimat Yunani yang panjang dibagi menjadi dua agar alami dan mudah dipahami tanpa mengubah urutan peristiwa. Pronomina untuk Yesus ditulis dengan huruf kecil karena kapitalisasi penghormatan tidak ditandai dalam teks Yunani.
