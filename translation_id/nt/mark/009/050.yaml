base_translation:
  language: en
  yaml_path: translation/nt/mark/009/050.yaml
  text: Salt is good[a]; but if the salt becomes unsalty, with what will you season it? Have salt in yourselves[c][b], and be at peace with one another.
translation:
  language: id
  text: Garam itu baik. Namun, jika garam menjadi tawar, dengan apakah kalian akan membuatnya asin? Miliki garam dalam diri kalian[a] dan hiduplah dalam damai satu sama lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “Miliki garam dalam diri kalian” mempertahankan metafora Yunani. Kemungkinan maknanya mencakup memelihara kemurnian, hikmat, kesetiaan pada perjanjian, atau pengaruh yang menjaga, tetapi teks tidak secara tegas menentukan satu makna.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: baik
  rationale: Kata ini menilai garam secara positif tanpa mempersempit maknanya menjadi sekadar berguna atau bermanfaat.
- source_word: ἅλας / ἅλα
  choice: garam
  rationale: Metafora sumber dipertahankan secara konsisten, termasuk dalam perintah pada bagian akhir ayat.
- source_word: ἄναλον γένηται
  choice: menjadi tawar
  rationale: Ungkapan ini secara alami menyatakan perubahan menjadi tidak asin atau kehilangan rasa asin dalam bahasa Indonesia.
- source_word: ἐν τίνι αὐτὸ ἀρτύσετε
  choice: dengan apa kamu akan mengasinkannya?
  rationale: Pertanyaan tentang sarana dipertahankan, sedangkan verba kuliner diterjemahkan dengan kata yang menjaga permainan gagasan mengenai garam dan rasa asin.
- source_word: ἔχετε ἐν ἑαυτοῖς ἅλα
  choice: Milikilah garam dalam dirimu
  rationale: Bentuk perintah dan metafora sengaja dipertahankan tanpa menafsirkannya sebagai kemurnian, hikmat, atau konsep tertentu.
- source_word: εἰρηνεύετε ἐν ἀλλήλοις
  choice: hiduplah berdamai seorang dengan yang lain
  rationale: Pilihan ini menyampaikan perintah untuk terus menjalani hubungan yang damai dan membuat nilai resiprokalnya jelas.
theological_decisions:
- issue: Makna metaforis garam dalam perintah
  choice: Mempertahankan ungkapan “Milikilah garam dalam dirimu”
  alternative: Menjabarkannya sebagai kemurnian, hikmat, kesetiaan pada perjanjian, atau pengaruh yang memelihara
  rationale: Teks tidak menetapkan satu arti khusus; menerjemahkan metaforanya secara langsung mempertahankan ambiguitas dan ketegangan teologis yang asli.
- issue: Perintah penutup mengenai damai
  choice: “hiduplah berdamai seorang dengan yang lain”
  alternative: “berdamailah seorang dengan yang lain” atau “hendaklah kamu hidup dalam damai seorang dengan yang lain”
  rationale: Terjemahan ini mempertahankan sifat etis dan berkelanjutan dari imperatif kini tanpa memasukkan penafsiran doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kata ganti orang kedua jamak Yunani diterjemahkan dengan “kamu” yang dapat berfungsi jamak; frasa resiprokal pada akhir ayat memperjelas bahwa para murid sebagai kelompok sedang disapa.
