translation:
  language: id
  text: Sebab setiap orang akan digarami dengan api[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “setiap orang akan dibumbui dengan api.” Gambaran ini dapat mengacu pada penghakiman, pemurnian, atau gambaran persembahan; bandingkan Im. 2:13.
    reason: lexical_alternative
  - marker: b
    text: Beberapa naskah menambahkan, “dan setiap kurban akan digarami dengan garam.”
    reason: textual_variant
lexical_decisions:
- source_word: Πᾶς
  choice: setiap orang
  rationale: Bentuk tunggal maskulin nominatif ini dipakai secara substantival. Dalam konteks wejangan kepada orang-orang mengenai penghakiman dan kemuridan, frasa “setiap orang” paling wajar, sambil tetap mempertahankan cakupan distributifnya.
- source_word: γὰρ
  choice: Sebab
  rationale: Partikel ini memberikan alasan atau penjelasan bagi peringatan sebelumnya. “Sebab” mempertahankan hubungan logis itu secara jelas dan alami.
- source_word: πυρὶ
  choice: dengan api
  rationale: Bentuk datifnya dapat menyatakan sarana atau unsur yang menyertai. “Dengan api” cukup alami dan tidak mempersempit maknanya menjadi semata-mata “oleh api” atau “di dalam api”.
- source_word: ἁλισθήσεται
  choice: akan digarami
  rationale: Bentuk pasif futur dari ἁλίζω secara harfiah berarti diberi garam. Ungkapan yang mencolok dan sukar ini dipertahankan, bukan dilunakkan menjadi tafsiran tertentu seperti dimurnikan atau diuji.
theological_decisions:
- issue: Makna metafora “digarami dengan api”
  choice: Mempertahankan ungkapan metaforis secara harfiah tanpa menentukan satu penafsiran utama.
  alternative: Menerjemahkannya sebagai dihakimi oleh api, dimurnikan oleh api, atau dipersembahkan seperti kurban yang diberi garam.
  rationale: Teks Yunani ringkas dan bersifat kiasan. Konteks dapat menggemakan penghakiman, pemurnian, pengujian dalam kemuridan, atau bahasa persembahan. Terjemahan utama mempertahankan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang lugas dan bermartabat. “Digarami dengan api” sengaja dipertahankan sebagai metafora yang ganjil tetapi setia pada teks sumber; catatan kaki membantu pembaca tanpa menutup ambiguitasnya.
