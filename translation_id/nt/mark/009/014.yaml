  yaml_path: translation/nt/mark/009/014.yaml
  text: And when they came to the disciples[a], they saw a large crowd around them, and scribes arguing with them.
translation:
  language: id
  text: Ketika mereka datang kepada murid-murid, mereka melihat kerumunan besar mengelilingi para murid itu dan para ahli Taurat sedang berdebat dengan para murid itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sedang berdiskusi dengan mereka.” Kata Yunani yang digunakan dapat berarti berdiskusi atau berdebat, tetapi dalam konteks ini kemungkinan besar menyiratkan perdebatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες πρὸς τοὺς μαθητάς
  choice: ketika mereka sampai kepada murid-murid yang lain
  rationale: Partisip aoristus dinyatakan sebagai anak kalimat waktu yang alami dalam bahasa Indonesia. Frasa 'yang lain' memperjelas bahwa rombongan Yesus mendatangi murid-murid yang tidak ikut naik ke gunung, tanpa mengubah acuan naratif.
- source_word: εἶδον
  choice: mereka melihat
  rationale: Bentuk aoristus naratif ini menyatakan tindakan melihat secara langsung dan wajar diterjemahkan 'mereka melihat'.
- source_word: ὄχλον πολὺν περὶ αὐτούς
  choice: banyak orang mengerumuni murid-murid itu
  rationale: ὄχλον πολύν menunjuk kepada kerumunan besar, sedangkan περὶ αὐτούς bersifat spasial. Ungkapan ini alami dan jelas dalam bahasa Indonesia serta mempertegas acuan pronomina.
- source_word: γραμματεῖς
  choice: beberapa ahli Taurat
  rationale: Dalam konteks Injil, γραμματεῖς menunjuk kepada para pakar hukum Taurat. 'Ahli Taurat' merupakan padanan Indonesia yang umum dan mudah dipahami; 'beberapa' diperlukan secara idiomatis karena nomina Yunani berbentuk jamak tanpa artikel.
- source_word: συζητοῦντας πρὸς αὐτούς
  choice: sedang berdebat dengan mereka
  rationale: Partisip kini menunjukkan tindakan yang sedang berlangsung. συζητέω dapat berarti berdiskusi atau berdebat; konteks pertentangan mendukung 'berdebat', sementara 'dengan mereka' mempertahankan arah relasional πρός dan mengacu kepada para murid.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Acuan pronomina diperjelas dengan pengulangan 'murid-murid' agar pembaca tidak keliru menganggap ahli Taurat berdebat dengan orang banyak. Penanda catatan kaki ditempatkan setelah klausa yang memuat pilihan leksikal terkait.
