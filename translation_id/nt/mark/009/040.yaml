  terminology: “Sebab,” “melawan kita,” dan “berpihak kepada kita” konsisten dengan register Alkitab Indonesia modern dan dengan relasi antitetis dalam teks Yunani. Catatan kaki secara tepat mencatat kemungkinan nuansa “mendukung” dan “bertindak demi,” tanpa mengubah terjemahan utama.
