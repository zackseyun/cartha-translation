  text: For whoever is not against us is for us[a].
translation:
  language: id
  text: Sebab siapa yang tidak melawan kita, ia berpihak kepada kita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ia mendukung kita” atau “ia bertindak demi kita.” Ungkapan Yunani ὑπὲρ ἡμῶν dapat menyatakan keberpihakan, dukungan, atau tindakan demi pihak yang dimaksud.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: siapa yang
  rationale: Kata ganti relatif ini dipakai secara substantival dan generik. Ungkapan “siapa yang” alami dalam bahasa Indonesia serta mempertahankan cakupan umum dan tak tentu.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ menghubungkan perkataan ini dengan konteks sebelumnya sebagai penjelasan atau alasan. “Sebab” menyatakan hubungan itu secara ringkas dan wajar.
- source_word: οὐκ ἔστιν
  choice: tidak
  rationale: Dalam konstruksi predikatif dengan frasa preposisional, kopula Yunani tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia; “tidak melawan” menyampaikan maknanya secara alami.
- source_word: καθ’ ἡμῶν
  choice: melawan kita
  rationale: κατά dengan genetif menyatakan pertentangan atau perlawanan. “Melawan kita” jelas, langsung, dan sesuai dengan konteks.
- source_word: ὑπὲρ ἡμῶν
  choice: berpihak kepada kita
  rationale: ὑπέρ dengan genetif dapat berarti mendukung, berada di pihak, atau bertindak demi seseorang. Dalam antitesis dengan “melawan kita,” “berpihak kepada kita” paling alami dan mempertahankan kesejajaran relasional.
- source_word: ἐστιν
  choice: ia berpihak
  rationale: Kopula Yunani diekspresikan secara idiomatis melalui predikat verbal “berpihak”; “ia” memperjelas subjek dalam klausa kedua tanpa mengubah cakupan generiknya.
theological_decisions:
- issue: Cakupan keberpihakan dalam ungkapan “melawan kita” dan “berpihak kepada kita”
  choice: Mempertahankan rujukan orang pertama jamak, “kita,” tanpa memperluasnya menjadi keberpihakan kepada Allah, Kerajaan Allah, atau suatu misi tertentu.
  alternative: “Siapa yang tidak menentang Allah, berpihak kepada Allah” atau “Siapa yang tidak menentang misi kita, berada di pihak kita.”
  rationale: Teks Yunani secara eksplisit memakai ἡμῶν (“kita”) pada kedua sisi antitesis. Terjemahan tidak boleh menutup ketegangan atau menentukan cakupan teologis yang dibiarkan bagi konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Sebab” mempertahankan hubungan penjelas dengan ayat sebelumnya. “Berpihak kepada kita” dipilih agar antitesis dengan “melawan kita” terdengar alami, sedangkan catatan kaki mempertahankan rentang makna ὑπέρ.
