  text: καὶ ⸂ἀπεκρίθη αὐτῷ εἷς ἐκ τοῦ ὄχλου⸃· Διδάσκαλε, ἤνεγκα τὸν υἱόν μου πρὸς σέ, ἔχοντα πνεῦμα ἄλαλον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/017.yaml
  text: And one from the crowd answered him[a], “Teacher, I brought my son to you, having a mute spirit.”
translation:
  language: id
  text: Lalu seseorang dari antara orang banyak itu menjawab-Nya, “Guru, saya membawa anak laki-laki saya yang mempunyai roh bisu[a] kepada-Mu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Guru, saya membawa anak laki-laki saya kepada-Mu, karena ia mempunyai roh bisu.”
    reason: Partisip Yunani ἔχοντα menerangkan “anak laki-laki saya.” Teks utama mempertahankan fungsi atributifnya; bentuk klausa penjelas/kausal juga mungkin dalam bahasa Indonesia.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Padanan naratif yang lazim bagi tindakan menanggapi; tidak menambahkan isi yang tidak dinyatakan.
- source_word: εἷς ἐκ τοῦ ὄχλου
  choice: seseorang dari antara orang banyak itu
  rationale: Mempertahankan bentuk tunggal tak tentu dan ungkapan partitif tanpa menambahkan kata 'laki-laki', yang tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Padanan modern dan tepat bagi sapaan kepada seorang pengajar; 'Tuan' akan lebih menonjolkan kewenangan daripada fungsi mengajar.
- source_word: ἤνεγκα
  choice: saya membawa
  rationale: Menyampaikan aoristus sebagai tindakan lampau yang sudah terjadi, sesuai dengan idiom bahasa Indonesia dalam konteks ini.
- source_word: τὸν υἱόν μου
  choice: anak laki-laki saya
  rationale: Mempertahankan hubungan anak dengan ayah serta jenis kelamin yang terkandung dalam υἱός; lebih alami bagi pembaca umum daripada 'putra saya'.
- source_word: πρὸς σέ
  choice: kepada-Mu
  rationale: Padanan alami bagi πρός dengan akusatif setelah verba 'membawa'.
- source_word: ἔχοντα
  choice: karena ia mempunyai
  rationale: Partisip ini menerangkan keadaan anak dan secara wajar dapat diungkapkan sebagai klausa penjelas dalam bahasa Indonesia. Catatan kaki mempertahankan kemungkinan bentuk atributif yang lebih dekat dengan susunan Yunani.
- source_word: πνεῦμα ἄλαλον
  choice: roh bisu
  rationale: Terjemahan langsung yang mempertahankan kata 'roh' dan sifat 'bisu' tanpa secara eksplisit menambahkan 'jahat', 'setan', atau penjelasan bahwa roh itu membuat anak tidak dapat berbicara.
theological_decisions:
- issue: Makna πνεῦμα dalam konteks pengusiran roh
  choice: roh, dengan sifat jahat atau demonis tersirat dari konteks
  alternative: roh dalam pengertian yang lebih umum; atau 'roh jahat'/'setan' secara eksplisit
  rationale: Dalam alur Markus, yang dimaksud ialah roh yang menguasai dan menyiksa anak itu. Namun, ayat ini sendiri hanya menyebut 'roh', sehingga terjemahan tidak menambahkan 'jahat' atau 'setan' dan membiarkan konteks memberi penjelasan.
- issue: Makna ἄλαλον
  choice: bisu
  alternative: yang membuatnya tidak dapat berbicara
  rationale: Bentuk Yunani secara langsung menerangkan roh sebagai 'bisu'. Terjemahan utama mempertahankan ungkapan itu dan tidak mengubahnya menjadi pernyataan kausal yang lebih tegas tentang dampaknya pada anak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami, dengan nada naratif yang bermartabat. Bentuk 'saya' dipakai dalam ucapan sang ayah karena alami dalam percakapan sopan masa kini. Huruf kapital pada enklitik yang merujuk kepada Yesus mengikuti kebiasaan ejaan religius Indonesia tanpa menambahkan gelar kristologis.
