source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ὅτι ἐπισυντρέχει ὄχλος ἐπετίμησεν τῷ πνεύματι τῷ ἀκαθάρτῳ λέγων αὐτῷ· Τὸ ⸂ἄλαλον καὶ κωφὸν πνεῦμα⸃, ἐγὼ ⸂ἐπιτάσσω σοι⸃, ἔξελθε ἐξ αὐτοῦ καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/025.yaml
  text: But when Jesus saw that a crowd was quickly gathering[a], he rebuked the unclean spirit, saying to it, “You mute and deaf spirit, I command you, come out of him and never enter him again.”
translation:
  language: id
  text: 'Namun, ketika Yesus melihat orang banyak bergegas berkumpul[a], Ia menegur roh najis itu dengan berkata kepadanya, “Hai roh bisu dan tuli, Aku memerintahkan engkau: keluarlah dari anak ini dan jangan pernah masuk lagi ke dalam dirinya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang banyak berlarian datang dan berkumpul.” Kata kerja Yunani menunjukkan orang-orang yang dengan cepat datang dari berbagai arah dan berkumpul.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Namun, ketika Yesus melihat
  rationale: Partisip aoris memberi latar waktu bagi tindakan utama, sedangkan δέ merupakan penghubung ringan. “Namun, ketika” menghasilkan peralihan naratif yang alami tanpa memberi pertentangan yang terlalu kuat.
- source_word: ἐπισυντρέχει ὄχλος
  choice: orang banyak bergegas berkumpul
  rationale: Kata kerja ἐπισυντρέχω menggambarkan orang-orang yang bergerak cepat dan datang bersama-sama; bentuk kini historis menampilkan kerumunan yang sedang terbentuk.
- source_word: ἐπετίμησεν
  choice: menegur
  rationale: Dalam konteks Injil, ἐπιτιμάω menyatakan teguran berwibawa Yesus terhadap roh jahat. “Menegur” mempertahankan kekuatan itu dan merupakan ungkapan Indonesia yang wajar.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: roh najis itu
  rationale: “Roh najis” mempertahankan kategori kenajisan yang digunakan teks, tanpa melemahkannya menjadi penyakit atau menambah penjelasan doktrinal.
- source_word: Τὸ ἄλαλον καὶ κωφὸν πνεῦμα
  choice: Hai roh bisu dan tuli
  rationale: Bentuk nominatif berartikel berfungsi sebagai sapaan. “Hai” menandai sapaan langsung secara jelas dan bermartabat; “bisu dan tuli” mempertahankan kedua sifat yang dibedakan dalam bahasa Yunani.
- source_word: ἐγὼ ἐπιτάσσω σοι
  choice: Aku memerintahkan engkau
  rationale: ἐπιτάσσω menyatakan perintah yang berwibawa, dan pronomina eksplisit ἐγώ mendapat penekanan yang wajar melalui “Aku” dalam ujaran langsung.
- source_word: ἔξελθε ἐξ αὐτοῦ
  choice: keluarlah dari anak ini
  rationale: Imperatif diterjemahkan secara langsung. Acuan maskulin αὐτοῦ adalah anak laki-laki dalam konteks; “anak ini” lebih alami daripada “dia” dan tetap tidak menambahkan identitas baru.
- source_word: μηκέτι εἰσέλθῃς εἰς αὐτόν
  choice: jangan pernah masuk lagi ke dalam dirinya
  rationale: μηκέτι dengan bentuk larangan menyatakan pelarangan tegas atas masuknya kembali roh itu. “Jangan pernah ... lagi” menyampaikan daya larangan tersebut dengan alami.
theological_decisions:
- issue: Istilah bagi roh jahat dan kewibawaan Yesus
  choice: Memakai “roh najis”, “menegur”, dan “Aku memerintahkan engkau”
  alternative: “roh jahat/roh cemar”, “menghardik”, atau ungkapan lebih lunak seperti “berkata keras”
  rationale: Teks menampilkan suatu roh personal yang disapa langsung dan tunduk kepada perintah Yesus. Pilihan ini mempertahankan kategori serta kewibawaan dalam teks tanpa mengubah roh itu menjadi sekadar penyakit atau menambahkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Ia” dipakai untuk Yesus dalam narasi, sedangkan “Aku” mempertahankan bentuk ujaran langsung. Partikel “Hai” menandai sapaan kepada roh secara alami dan jelas.
