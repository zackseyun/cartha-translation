id: MRK.9.39
reference: Mark 9:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Μὴ κωλύετε αὐτόν, οὐδεὶς γάρ ἐστιν ὃς ποιήσει δύναμιν ἐπὶ τῷ ὀνόματί μου καὶ δυνήσεται ταχὺ κακολογῆσαί με·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/039.yaml
  text: But Jesus said[a], “Do not stop him[b], for there is no one who will do a mighty work in my name and soon be able to speak evil of me.”
translation:
  language: id
  text: Namun Yesus berkata, “Jangan menghalangi dia, sebab tidak seorang pun yang akan melakukan suatu perbuatan penuh kuasa[a] dalam nama-Ku akan segera dapat mencela Aku[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mukjizat” atau “perbuatan ajaib”; Yunani “kuasa,” yang dalam konteks ini dapat menunjuk pada perbuatan yang menunjukkan kuasa.
    reason: lexical_alternative
  - marker: b
    text: Atau “berbicara buruk tentang Aku,” “menjelek-jelekkan Aku,” atau “memfitnah Aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλύετε
  choice: menghalangi
  rationale: Dalam konteks para murid berusaha mencegah orang itu bertindak, imperatif kini dengan μή menyatakan larangan. ‘Jangan menghalangi dia’ alami dan tetap mencakup nuansa mencegah atau melarang.
- source_word: δύναμιν
  choice: perbuatan penuh kuasa
  rationale: Pilihan ini mempertahankan hubungan leksikal dengan δύναμις, sekaligus menyatakan suatu perbuatan luar biasa tanpa mempersempit maknanya hanya menjadi ‘mukjizat’.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: dalam nama-Ku
  rationale: Ungkapan baku ini menyampaikan tindakan yang dilakukan dengan menyerukan atau berdasarkan kewibawaan nama Yesus.
- source_word: ταχὺ
  choice: segera
  rationale: Adverbia ini menunjukkan kedekatan waktu, bukan terutama kecepatan cara berbicara.
- source_word: κακολογῆσαί
  choice: menjelek-jelekkan Aku
  rationale: Ungkapan ini secara alami menyampaikan tindakan berbicara buruk tentang seseorang tanpa mempersempitnya menjadi fitnah dalam arti hukum atau kutukan formal.
- source_word: οὐδεὶς γάρ ἐστιν ὃς
  choice: sebab tidak seorang pun yang
  rationale: Bentuk ini mempertahankan struktur dan penekanan Yunani dengan bahasa Indonesia yang jelas.
- source_word: δυνήσεται
  choice: akan dapat
  rationale: Bentuk ini mempertahankan baik unsur futuritas maupun nuansa kemampuan dari bentuk mendatang δύναμαι.
theological_decisions:
- issue: Sifat perbuatan yang dilakukan dalam nama Yesus
  choice: δύναμιν diterjemahkan ‘perbuatan penuh kuasa’.
  alternative: ‘mukjizat’ atau ‘perbuatan ajaib’
  rationale: Terjemahan ini mempertahankan rentang makna istilah sumber dan tidak memaksakan konsep modern yang lebih sempit, sambil tetap menunjukkan perbuatan luar biasa.
- issue: Implikasi hubungan orang itu dengan Yesus
  choice: Pernyataan diterjemahkan secara deskriptif tanpa menyiratkan bahwa orang itu pasti murid sejati atau mendapat persetujuan menyeluruh.
  alternative: Parafrasa yang menyatakan kemuridan sejati atau, sebaliknya, oportunisme semata
  rationale: Ayat ini hanya menyatakan bahwa orang yang melakukan perbuatan penuh kuasa dalam nama Yesus tidak akan segera menjelek-jelekkan-Nya; penilaian teologis yang lebih luas tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. ‘Namun’ menandai kontras δέ; ‘menjelek-jelekkan’ dipilih sebagai ungkapan umum yang alami, sedangkan alternatif yang lebih formal dicatat dalam catatan kaki.
