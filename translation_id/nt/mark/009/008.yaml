  text: And suddenly, looking around, they no longer saw anyone except Jesus alone with them.
translation:
  language: id
  text: Lalu tiba-tiba, ketika mereka memandang ke sekeliling, mereka tidak lagi melihat siapa pun kecuali Yesus, hanya Dia yang bersama mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάπινα
  choice: tiba-tiba
  rationale: Menyampaikan perubahan keadaan yang mendadak secara alami dalam bahasa Indonesia modern.
- source_word: περιβλεψάμενοι
  choice: ketika memandang ke sekeliling
  rationale: Partisip aoris ini menyatakan tindakan mereka melihat ke segala arah, dengan hubungan waktu yang wajar terhadap verba utama.
- source_word: οὐκέτι οὐδένα εἶδον
  choice: mereka tidak lagi melihat siapa pun
  rationale: Mempertahankan οὐκέτι sebagai 'tidak lagi' dan οὐδένα sebagai 'siapa pun'.
- source_word: ἀλλὰ τὸν Ἰησοῦν μόνον
  choice: selain Yesus seorang diri
  rationale: Menyatakan pengecualian sekaligus penekanan μόνον bahwa hanya Yesus yang tampak.
- source_word: μεθ’ ἑαυτῶν
  choice: bersama mereka
  rationale: Menerjemahkan frasa pendamping secara langsung dan alami.
