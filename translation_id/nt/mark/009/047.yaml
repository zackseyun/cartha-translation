id: MRK.9.47
reference: Mark 9:47
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ ὀφθαλμός σου σκανδαλίζῃ σε, ἔκβαλε αὐτόν· καλόν ⸀σέ ἐστιν μονόφθαλμον εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς ⸀τὴν ⸀γέενναν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/047.yaml
  text: And if your eye causes you to stumble[a], throw it out. It is better for you to enter the kingdom of God with one eye than, having two eyes, to be thrown into Gehenna,
translation:
  language: id
  text: Dan jika matamu membuatmu tersandung, buanglah mata itu. Lebih baik bagimu masuk ke dalam Kerajaan Allah dengan satu mata daripada dilemparkan ke dalam Gehena dengan dua mata,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "neraka". Kata Yunani yang dipakai ialah "Gehena", istilah yang berakar pada nama Lembah Hinom dan dipakai untuk penghakiman akhir zaman.
    reason: Menjelaskan istilah historis-teologis dan memberikan padanan Indonesia yang lazim tanpa menghilangkan kekhususan kata sumber.
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: menyebabkan engkau tersandung
  rationale: Mempertahankan metafora tersandung dalam bahasa Yunani sekaligus tetap menyampaikan bahaya rohani dan moral tanpa mempersempit maknanya hanya menjadi 'berbuat dosa'.
- source_word: ἔκβαλε
  choice: buanglah itu
  rationale: Mencerminkan imperatif ἐκβάλλω, yakni membuang atau melemparkan keluar, tanpa menambahkan tindakan khusus seperti mencungkil yang tidak dinyatakan oleh verba Yunani.
- source_word: καλόν ... ἤ
  choice: lebih baik ... daripada
  rationale: Walaupun καλόν secara harfiah berarti 'baik', konstruksi dengan ἤ memiliki daya perbandingan dan secara alami diterjemahkan 'lebih baik ... daripada' dalam bahasa Indonesia.
- source_word: μονόφθαλμον
  choice: dengan satu mata
  rationale: Ungkapan alami dalam bahasa Indonesia yang mempertahankan gambaran konkret 'bermata satu'.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Padanan baku, jelas, dan bermartabat yang mempertahankan bobot teologis frasa Yunani.
- source_word: βληθῆναι
  choice: dilemparkan
  rationale: Menerjemahkan secara langsung infinitif pasif βάλλω dan mempertahankan daya gambaran tindakan paksa.
- source_word: γέενναν
  choice: Gehena
  rationale: Transliterasi Indonesia mempertahankan kekhususan istilah Yunani yang berakar pada Lembah Hinom dan terkait dengan penghakiman eskatologis, alih-alih langsung menyamakannya dengan istilah yang lebih umum.
theological_decisions:
- issue: Penerjemahan γέεννα dalam konteks penghakiman
  choice: Gehena
  alternative: neraka
  rationale: Teks memakai istilah khusus γέεννα, bukan istilah umum untuk alam maut atau hukuman. 'Gehena' menjaga latar historis dan kekhasan kosakata penghakiman Alkitab; padanan umum 'neraka' dicantumkan dalam catatan kaki agar pembaca tetap memahami pemakaian tradisionalnya.
- issue: Cakupan makna σκανδαλίζῃ
  choice: menyebabkan engkau tersandung
  alternative: menyebabkan engkau berdosa
  rationale: Pilihan utama mempertahankan metafora sumber dan tidak menutup kemungkinan cakupan yang meliputi jebakan, kejatuhan, atau dosa. Konteks tetap membuat dimensi moralnya jelas.
translation_notes:
  register: Bahasa Indonesia standar modern dengan sapaan tunggal 'engkau' untuk menjaga kejelasan pronomina sumber dan nada perkataan Yesus yang langsung serta khidmat. Struktur dibuat alami, tetapi metafora dan ketegangan penghakiman dalam teks Yunani dipertahankan.
