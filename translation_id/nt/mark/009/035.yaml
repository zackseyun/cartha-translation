  source_fidelity: 'Revisi diperlukan untuk menyampaikan ἔσται secara lebih langsung sebagai “akan menjadi,” bukan mempertegasnya menjadi kewajiban dengan “harus menjadi.” Pengulangan πάντων paling wajar dan jelas dalam bahasa Indonesia dirujukkan kepada orang-orang: “semua orang.”'
