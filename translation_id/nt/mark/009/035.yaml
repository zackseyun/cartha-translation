    issue: “ia harus menjadi” untuk ἔσται
    rationale: Bentuk masa depan indikatif secara harfiah menyatakan “ia akan menjadi.” Walaupun ujaran itu mempunyai daya pengajaran normatif, “harus” menambahkan modalitas kewajiban yang tidak dinyatakan secara eksplisit dan mengurangi ambiguitas antara tuntutan dan akibat/pembalikan yang terkandung dalam bentuk Yunani.
  - severity: low
    issue: “dari semuanya ... bagi semuanya” untuk πάντων
    rationale: Dalam konteks ini πάντων secara alami merujuk pada orang-orang. “Semua orang” lebih idiomatis dalam bahasa Indonesia serta mempertahankan pengulangan sumber.
  - severity: low
    issue: Penambahan “murid” pada “kedua belas murid itu”
    rationale: τοὺς δώδεκα secara harfiah adalah “Kedua Belas.” Penambahan “murid” tidak mengubah makna secara berarti, tetapi tidak diperlukan; sebutan mapan “Kedua Belas” lebih dekat dengan sumber.
