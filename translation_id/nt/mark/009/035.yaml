  text: And sitting down, he called the twelve and says to them, “If anyone wants to be first, he will be last of all and servant of all.”
translation:
  language: id
  text: Lalu Ia duduk, memanggil Kedua Belas itu, dan berkata kepada mereka, “Jika seseorang ingin menjadi yang pertama, ia akan menjadi yang terakhir dari semua orang dan pelayan bagi semua orang.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσας
  choice: Ia duduk
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului tindakan utama; dalam konteks pengajaran, ungkapan alami bahasa Indonesia adalah “Ia duduk”.
- source_word: ἐφώνησεν
  choice: memanggil
  rationale: Kata ini menunjukkan bahwa Yesus memanggil kedua belas murid untuk datang atau memberi perhatian.
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani diterjemahkan dengan bentuk naratif Indonesia yang alami tanpa mengubah urutan peristiwa.
- source_word: πρῶτος
  choice: yang pertama
  rationale: Mempertahankan bahasa peringkat dan kontras langsung dengan “yang terakhir”.
- source_word: ἔσχατος
  choice: yang terakhir
  rationale: Mempertahankan antitesis dengan “yang pertama” tanpa mempersempit maknanya.
- source_word: διάκονος
  choice: pelayan
  rationale: Dalam konteks ini berarti orang yang melayani orang lain; “pelayan” alami dan tidak mengimpor jabatan gerejawi tertentu.
theological_decisions:
- issue: Daya modal ἔσται dalam pernyataan tentang menjadi yang pertama
  choice: ia harus menjadi
  alternative: ia akan menjadi
  rationale: Dalam konteks ajaran tentang syarat untuk menjadi yang pertama, bentuk masa depan berfungsi sebagai tuntutan atau konsekuensi normatif. “Harus menjadi” menyampaikan daya tersebut secara alami, meskipun alternatif “akan menjadi” mungkin bila bentuknya dipahami sebagai akibat atau pembalikan eskatologis.
- issue: Cakupan πάντων yang diulang
  choice: dari semuanya ... bagi semuanya
  alternative: dari semua orang ... bagi semua orang
  rationale: Ungkapan ini mempertahankan pengulangan dan keluasan bahasa Yunani. Dalam bahasa Indonesia, acuannya secara wajar dipahami sebagai semua orang dalam cakupan yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Sebutan “kedua belas murid” dipakai agar rujukan “kedua belas” jelas bagi pembaca umum; kutipan mempertahankan kesejajaran retoris antara yang pertama, yang terakhir, dan pelayan.
