id: MRK.9.11
reference: Mark 9:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτων αὐτὸν λέγοντες· Ὅτι λέγουσιν οἱ γραμματεῖς ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/011.yaml
  text: And they were asking him[a], saying, “Why do the scribes say that Elijah must come first?”
translation:
  language: id
  text: Mereka bertanya kepada-Nya[a], “Mengapa ahli-ahli Taurat mengatakan bahwa Elia harus datang lebih dahulu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bagaimana mungkin ahli-ahli Taurat mengatakan bahwa Elia harus datang lebih dahulu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτων
  choice: bertanya
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung dalam narasi. Bahasa Indonesia tidak wajib menandai aspek ini secara eksplisit; konteks sudah memadai, sedangkan 'terus bertanya' dapat memberi kesan pengulangan yang berlebihan.
- source_word: λέγοντες
  choice: tidak diterjemahkan secara terpisah
  rationale: Partisip ini memperkenalkan isi pertanyaan. Dalam bahasa Indonesia, bentuk alami ialah langsung menempatkan pertanyaan setelah verba 'bertanya', tanpa menambahkan 'dengan berkata'.
- source_word: Ὅτι
  choice: Mengapa
  rationale: Dalam konteks interogatif ini, ὅτι secara idiomatis memperkenalkan pertanyaan 'mengapa/bagaimana mungkin'. 'Mengapa' menyampaikan maksudnya dengan jelas dan alami.
- source_word: γραμματεῖς
  choice: ahli-ahli Taurat
  rationale: Istilah ini secara alami menyatakan golongan pakar dan pengajar hukum Taurat dalam konteks Yahudi, bukan sekadar penyalin tulisan.
- source_word: Ἠλίαν
  choice: Elia
  rationale: Mengikuti bentuk nama yang baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: δεῖ
  choice: harus
  rationale: Menjaga daya keharusan yang dinyatakan oleh δεῖ tanpa menjelaskan sumber keharusan itu secara interpretatif.
- source_word: ἐλθεῖν
  choice: datang
  rationale: Padanan langsung dan wajar dalam konteks pengharapan kenabian.
- source_word: πρῶτον
  choice: lebih dahulu
  rationale: Menyatakan prioritas waktu secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Daya pertanyaan yang diperkenalkan oleh Ὅτι
  choice: Diterjemahkan sebagai pertanyaan langsung dengan 'Mengapa'
  alternative: '''Bagaimana mungkin ahli-ahli Taurat mengatakan ...?'' atau ''Bagaimana halnya sehingga ahli-ahli Taurat mengatakan ...?'''
  rationale: Bentuk Yunani dapat dipahami sebagai 'mengapa' atau 'bagaimana halnya sehingga'. Teks utama memakai ungkapan Indonesia yang paling jelas, sementara alternatif yang asli dipertahankan dalam catatan kaki.
- issue: Sifat kedatangan Elia
  choice: Dibiarkan sebagai 'Elia harus datang lebih dahulu'
  alternative: '''Elia harus datang kembali lebih dahulu'' atau ''Elia harus datang sebelum Mesias'''
  rationale: Teks Yunani tidak secara eksplisit memuat 'kembali' atau menyebut Mesias sebagai pembanding. Penambahan tersebut akan menyelesaikan secara interpretatif sesuatu yang dibiarkan tersirat dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan pronominal kepada Yesus ditulis 'kepada-Nya' sesuai kelaziman penerbitan Alkitab Indonesia. Struktur partisip Yunani dilancarkan menjadi pertanyaan langsung agar tidak kaku.
