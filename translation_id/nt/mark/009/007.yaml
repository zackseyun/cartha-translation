reference: Mark 9:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐγένετο νεφέλη ἐπισκιάζουσα αὐτοῖς, καὶ ⸀ἐγένετο φωνὴ ἐκ τῆς νεφέλης· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/007.yaml
  text: 'And a cloud came[a], overshadowing them, and a voice came out of the cloud: “This is my beloved Son; listen to him.”'
translation:
  language: id
  text: Lalu datanglah awan yang menaungi mereka, dan dari dalam awan itu terdengar suara, “Inilah Anak-Ku yang Kukasihi. Dengarkanlah Dia!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini juga mengandung arti mengindahkan perkataan-Nya, bukan sekadar mendengar suara-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο νεφέλη
  choice: datanglah awan
  rationale: γίνομαι di sini menandai kemunculan atau datangnya awan sebagai suatu peristiwa. Pilihan ini mempertahankan daya peristiwa ungkapan Yunani tanpa menambahkan penafsiran.
- source_word: ἐπισκιάζουσα αὐτοῖς
  choice: yang menaungi mereka
  rationale: ἐπισκιάζω dapat berarti menaungi atau menyelubungi. “Menaungi” mempertahankan gambaran bayangan yang meliputi mereka dan tetap wajar dalam bahasa Indonesia.
- source_word: φωνὴ ἐκ τῆς νεφέλης
  choice: dari dalam awan itu terdengar suara
  rationale: φωνή dalam konteks ini adalah suara yang mengucapkan perkataan, sedangkan ἐκ menyatakan asal dari dalam awan. “Terdengar” mengungkapkan kemunculan suara secara alami tanpa menambahkan subjek yang berbicara.
- source_word: Οὗτός ἐστιν ὁ υἱός μου
  choice: Inilah Anak-Ku
  rationale: “Inilah” merupakan bentuk penunjukan yang alami dan tegas untuk Οὗτός ἐστιν. “Anak-Ku” mempertahankan pernyataan hubungan sebagaimana terdapat dalam teks.
- source_word: ὁ ἀγαπητός
  choice: yang Kukasihi
  rationale: ἀγαπητός menyatakan bahwa Anak itu dikasihi. “Yang Kukasihi” alami, jelas, dan mempertahankan hubungan pribadi dalam pernyataan tersebut.
- source_word: ἀκούετε αὐτοῦ
  choice: Dengarkanlah Dia
  rationale: Imperatif kini ini menuntut perhatian yang berkelanjutan dan tanggapan terhadap perkataan-Nya. “Dengarkanlah” lebih luas daripada sekadar mendengar bunyi, tetapi tidak mempersempit artinya menjadi hanya “taatilah”.
theological_decisions:
- issue: Pernyataan ilahi tentang identitas Yesus
  choice: “Inilah Anak-Ku yang Kukasihi” diterjemahkan sebagai penegasan langsung dari suara yang berasal dari awan.
  alternative: Mengembangkan ungkapan itu dengan penjelasan doktrinal mengenai keilahian atau kedudukan Yesus.
  rationale: Teks dengan jelas menyatakan Yesus sebagai Anak Allah, tetapi tidak menjabarkan makna teologis sebutan itu dalam ayat ini. Terjemahan mempertahankan kekuatan kristologisnya tanpa tambahan penafsiran.
- issue: Daya perintah ἀκούετε αὐτοῦ
  choice: Dengarkanlah Dia
  alternative: Taatilah Dia
  rationale: Kata kerja Yunani mencakup mendengar dengan penuh perhatian dan mengindahkan, tetapi bukan kata khusus yang hanya berarti menaati. Terjemahan mempertahankan keluasan makna tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Susunan kalimat mempertahankan rangkaian peristiwa dalam teks Yunani, sementara “terdengar suara” dipakai agar idiomatis dalam bahasa Indonesia. Huruf kapital pada “Anak-Ku” dan “Dia” mengikuti konvensi penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Yesus, bukan perbedaan bentuk dalam bahasa Yunani.
