  text: καὶ ἀποκριθεὶς ὁ Πέτρος λέγει τῷ Ἰησοῦ· Ῥαββί, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν ⸂τρεῖς σκηνάς⸃, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/005.yaml
  text: 'And Peter answered and said to Jesus[a], “Rabbi, it is good for us to be here, and let us make three shelters: one for you, one for Moses, and one for Elijah.”'
translation:
  language: id
  text: 'Petrus menanggapi dan berkata kepada Yesus, “Rabi, alangkah baiknya kita berada di sini. Marilah kita membuat tiga tempat berteduh[a]: satu untuk Engkau, satu untuk Musa, dan satu untuk Elia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kemah-kemah”, “pondok-pondok”, atau “tabernakel-tabernakel”. Kata Yunani yang dipakai menunjuk pada tempat berteduh sementara dan mungkin mengandung kaitan dengan kemah atau pondok, tetapi ayat ini tidak menyatakan kaitan tersebut secara eksplisit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: menanggapi
  rationale: Partisipel ini secara harfiah dapat berarti ‘menjawab’, tetapi dalam narasi Yunani juga menjadi ungkapan untuk memberikan tanggapan meskipun tidak ada pertanyaan yang disebutkan. ‘Menanggapi’ mempertahankan gagasan respons tanpa menyiratkan adanya pertanyaan eksplisit.
- source_word: λέγει
  choice: berkata
  rationale: Bentuk Yunaninya memakai kala kini historis, tetapi kala lampau tersirat secara alami dalam narasi bahasa Indonesia. ‘Berkata’ menyampaikan tindakan tutur tanpa membuat gaya narasi terasa janggal.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Gelar sapaan Semitik ini dipertahankan untuk menjaga latar dan nuansa penghormatan; maknanya berkaitan dengan ‘Guru’, tetapi menerjemahkannya langsung sebagai ‘Guru’ akan menghilangkan bentuk sapaan khas tersebut.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: alangkah baiknya kita berada di sini
  rationale: Ungkapan ini mempertahankan penilaian Petrus bahwa keberadaan mereka di sana adalah baik, tanpa memperkuatnya menjadi ‘luar biasa’ atau menafsirkannya sebagai kewajiban moral.
- source_word: ποιήσωμεν
  choice: marilah kita membuat
  rationale: Subjungtif orang pertama jamak bersifat ajakan. ‘Marilah kita membuat’ menyampaikan daya hortatifnya dan tetap dekat dengan arti dasar ποιέω.
- source_word: σκηνάς
  choice: tempat bernaung
  rationale: Kata ini dapat menunjuk pada kemah, pondok, atau tempat perlindungan sementara. ‘Tempat bernaung’ memberikan arti dasarnya secara netral dan mudah dipahami tanpa memastikan kaitan dengan Hari Raya Pondok Daun atau Kemah Suci.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: satu untuk Engkau, satu untuk Musa, dan satu untuk Elia
  rationale: Susunan ini mempertahankan pengulangan distributif μίαν dan kesejajaran ketiga frasa dalam teks Yunani.
theological_decisions:
- issue: Kemungkinan konotasi perayaan atau peribadatan pada σκηνάς
  choice: Menggunakan istilah netral ‘tempat bernaung’ dalam teks utama
  alternative: kemah; pondok; tabernakel
  rationale: Ayat ini tidak secara eksplisit menghubungkan bangunan tersebut dengan Hari Raya Pondok Daun atau Kemah Suci. Pilihan netral mencegah tafsiran teologis tertentu dimasukkan ke dalam teks, sedangkan kemungkinan makna lainnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Sapaan ‘Rabi’ mempertahankan latar Semitik. Kata ganti ‘Engkau’ dipakai sebagai sapaan hormat langsung kepada Yesus, sedangkan struktur berulang pada bagian akhir dipertahankan agar kesejajaran sumber tetap terdengar.
