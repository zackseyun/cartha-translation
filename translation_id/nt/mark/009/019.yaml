base_translation:
  language: en
  yaml_path: translation/nt/mark/009/019.yaml
  text: And answering them[a], he says, “O unbelieving generation[b], how long will I be with you? How long will I put up with you? Bring him to me.”
translation:
  language: id
  text: Ia menjawab mereka dan berkata, “Hai generasi yang tidak percaya[a]! Berapa lama lagi aku akan bersama kalian? Berapa lama lagi aku akan bersabar terhadap kalian[b]? Bawalah dia kepadaku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang tidak beriman” atau “yang tidak setia.” Kata Yunani ἄπιστος dapat menunjukkan ketiadaan kepercayaan atau ketidaksetiaan.
    reason: lexical_alternative
  - marker: b
    text: Atau “Berapa lama lagi aku akan menanggung kalian?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: ia menjawab mereka, katanya
  rationale: Mempertahankan bentuk partisipial dan kala kini historis khas narasi Markus, tetapi tetap wajar dalam bahasa Indonesia.
- source_word: γενεὰ ἄπιστος
  choice: generasi yang tidak percaya
  rationale: Dalam konteks kegagalan untuk percaya pada kuasa Allah, frasa ini menyampaikan teguran terhadap ketidakpercayaan; kemungkinan makna ‘tidak setia’ dipertahankan dalam catatan kaki.
- source_word: ἕως πότε πρὸς ὑμᾶς ἔσομαι
  choice: Berapa lama lagi aku harus bersama kalian?
  rationale: Ungkapan idiomatis ἕως πότε diterjemahkan secara alami sebagai ‘berapa lama lagi’, sedangkan πρός dengan εἰμί menyatakan keberadaan bersama mereka.
- source_word: ἀνέξομαι ὑμῶν
  choice: aku harus bersabar terhadap kalian
  rationale: Mengungkapkan makna menanggung atau menoleransi sambil mempertahankan nada kejengkelan; alternatif yang lebih tajam dicatat dalam catatan kaki.
- source_word: φέρετε αὐτὸν πρός με
  choice: Bawalah dia kepadaku
  rationale: Perintah langsung dan alami agar anak itu dibawa kepada Yesus.
theological_decisions:
- issue: Daya makna ἄπιστος dalam teguran Yesus
  choice: yang tidak percaya
  alternative: yang tidak beriman; yang tidak setia
  rationale: Pilihan utama paling langsung menyatakan kurangnya kepercayaan dalam konteks ini tanpa menyimpulkan kemurtadan atau pelanggaran perjanjian; rentang makna lainnya dijaga dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. ‘Kalian’ dipakai untuk menandai bentuk jamak ὑμᾶς secara eksplisit. Huruf kecil pada pronomina yang merujuk kepada Yesus mengikuti gaya naratif modern dan tidak menambahkan penanda kehormatan yang tidak terdapat dalam bahasa sumber.
