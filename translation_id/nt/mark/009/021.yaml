  text: And he asked his father[a], “How long has this been happening to him?” And he said, “From childhood.”
translation:
  language: id
  text: Lalu Yesus bertanya kepada ayah anak itu, “Sudah berapa lama hal ini terjadi pada anak itu?” Ayah anak itu menjawab, “Sejak anak itu masih kecil.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: bertanya
  rationale: Bentuk aoris ini memperkenalkan pertanyaan langsung tanpa menyiratkan pemeriksaan atau desakan khusus; “bertanya” adalah padanan Indonesia yang wajar.
- source_word: τὸν πατέρα αὐτοῦ
  choice: kepada ayahnya
  rationale: αὐτοῦ paling wajar merujuk kepada anak yang menderita dalam konteks. Bentuk “ayahnya” mempertahankan pronomina Yunani tanpa menambahkan penjelasan yang tidak dinyatakan secara eksplisit.
- source_word: Πόσος χρόνος ἐστὶν ὡς
  choice: Sudah berapa lama
  rationale: Ungkapan Yunani ini menanyakan jangka waktu sejak suatu keadaan bermula hingga saat percakapan; susunan ini alami dalam bahasa Indonesia modern.
- source_word: τοῦτο γέγονεν αὐτῷ
  choice: hal ini terjadi padanya
  rationale: Bentuk perfek γέγονεν menunjuk pada keadaan yang telah bermula dan masih relevan. Bersama “sudah berapa lama,” terjemahan ini menyampaikan keberlangsungannya tanpa mempersempit “hal ini” menjadi diagnosis tertentu.
- source_word: ὁ δὲ εἶπεν
  choice: Ayahnya menjawab
  rationale: Dalam dialog bahasa Indonesia, “menjawab” menyatakan fungsi ujaran dengan alami. Subjek diulangi sebagai “ayahnya” agar pergantian pembicara jelas.
- source_word: Ἐκ παιδιόθεν
  choice: Sejak kecil
  rationale: Ungkapan ini menunjukkan titik awal pada masa kanak-kanak. “Sejak kecil” ringkas, alami, dan menyampaikan bahwa keadaan itu berlangsung dari masa tersebut.
