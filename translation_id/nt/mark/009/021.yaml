  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama “Yesus” digunakan untuk memperjelas subjek tersirat dari ἐπηρώτησεν berdasarkan konteks, sedangkan “hal ini” mempertahankan cara rujukan umum dalam teks Yunani dan tidak menambahkan penafsiran medis atau teologis.
