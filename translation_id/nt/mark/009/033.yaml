  text: Καὶ ⸀ἦλθον εἰς Καφαρναούμ. καὶ ἐν τῇ οἰκίᾳ γενόμενος ἐπηρώτα αὐτούς· Τί ἐν τῇ ⸀ὁδῷ διελογίζεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/033.yaml
  text: And they came to Capernaum. And when he was in the house, he was asking them, “What were you discussing on the way?”
translation:
  language: id
  text: Kemudian mereka tiba di Kapernaum. Ketika Yesus berada di dalam rumah, Ia bertanya kepada mereka, “Apa yang kalian perbincangkan dalam perjalanan?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Apa yang kalian perdebatkan dalam perjalanan?” Kata Yunaninya dapat merujuk pada perbincangan, perdebatan, atau perselisihan; ayat berikutnya menunjukkan bahwa mereka membicarakan siapa yang terbesar di antara mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: mereka tiba
  rationale: Dalam konteks perjalanan dengan εἰς + nama tempat, bentuk aoris ini menyatakan tibanya rombongan di Kapernaum. 'Tiba' alami dalam narasi Indonesia dan tidak menentukan apakah gerak itu dipandang sebagai 'datang' atau 'pergi'.
- source_word: Καφαρναούμ
  choice: Kapernaum
  rationale: Mengikuti bentuk nama tempat yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: ἐν τῇ οἰκίᾳ γενόμενος
  choice: setelah berada di dalam rumah
  rationale: Partisip γενόμενος berfungsi temporal. Terjemahan ini mempertahankan latar konkret 'di dalam rumah' tanpa menafsirkan rumah tersebut sebagai rumah Yesus atau sebagai 'rumah sendiri'.
- source_word: ἐπηρώτα
  choice: bertanya
  rationale: Imperfek Yunani dapat menggambarkan tindakan yang sedang berlangsung, tetapi dalam bahasa Indonesia bentuk sederhana 'bertanya' lebih alami; konteks narasi tetap memungkinkan nuansa bahwa pertanyaan itu diajukan kepada mereka sebagai kelompok.
- source_word: ἐν τῇ ὁδῷ
  choice: di tengah jalan
  rationale: Ungkapan Indonesia ini secara idiomatis berarti 'selama dalam perjalanan', sesuai konteks, bukan harus menunjuk lokasi di permukaan jalan.
- source_word: διελογίζεσθε
  choice: kalian perbincangkan
  rationale: Verba ini dapat berarti membicarakan, memperdebatkan, atau mempersoalkan. 'Perbincangkan' menjaga keluasan makna dan tidak lebih dahulu menetapkan nadanya sebagai pertengkaran.
theological_decisions:
- issue: Peralihan subjek dari bentuk jamak ἦλθον ke bentuk tunggal γενόμενος/ἐπηρώτα
  choice: Menyebut 'Yesus' sebagai subjek tindakan tunggal
  alternative: Memakai kata ganti 'Ia' tanpa menyebut nama
  rationale: Konteks mengidentifikasi Yesus sebagai subjek tersirat. Penyebutan nama menjernihkan peralihan gramatikal dalam bahasa Indonesia tanpa menambah klaim teologis.
- issue: Nada διελογίζεσθε
  choice: perbincangkan
  alternative: perdebatkan atau pertengkarkan
  rationale: Ayat berikutnya menunjukkan adanya perselisihan mengenai siapa yang terbesar, tetapi kata pada ayat ini sendiri memiliki cakupan makna yang lebih luas. Teks utama mempertahankan ambiguitas tersebut, sedangkan catatan kaki menyampaikan kemungkinan nuansa yang lebih tajam.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Kalian' dipakai karena Yesus berbicara kepada beberapa murid; bentuk ini jelas dan mudah dipahami. Konjungsi awal Καί diterjemahkan 'Kemudian' agar alur narasi alami, sedangkan καί berikutnya diwujudkan melalui susunan kalimat temporal.
