id: MRK.9.1
reference: Mark 9:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι εἰσίν τινες ⸂τῶν ὧδε⸃ ἑστηκότων οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ ἐληλυθυῖαν ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/001.yaml
  text: And he was saying to them[a], “Truly I say to you[d][c][b], there are some standing here who will certainly not taste death until they see the kingdom of God having come in power.”
translation:
  language: id
  text: 'Lalu Ia berkata kepada mereka, “Sesungguhnya Aku berkata kepadamu: Di antara orang-orang yang berdiri di sini, ada beberapa orang yang pasti tidak akan mengecap kematian[a] sampai mereka melihat Kerajaan Allah telah datang dengan kuasa.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “mengecap kematian” berarti mengalami kematian atau mati.
    reason: lexical_alternative
  - marker: b
    text: Teks tidak menyebutkan peristiwa yang dimaksud dengan Kerajaan Allah yang telah datang dengan kuasa. Ungkapan ini antara lain dipahami berkaitan dengan transfigurasi, kebangkitan dan pemuliaan Yesus, Pentakosta, penghakiman atas Yerusalem, atau penggenapan akhir Kerajaan Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ἔλεγεν αὐτοῖς
  choice: Lalu Ia berkata kepada mereka
  rationale: Imperfek ἔλεγεν melanjutkan tuturan dalam konteks narasi. Bahasa Indonesia secara alami memakai bentuk lampau sederhana berdasarkan konteks; “lalu” menyatakan kesinambungan tanpa memaksakan makna berulang.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya Aku berkata kepadamu
  rationale: Formula pembuka ἀμήν dalam perkataan Yesus menyatakan penegasan yang khidmat. “Sesungguhnya” alami dalam bahasa Indonesia dan lebih jelas daripada transliterasi “Amin” pada posisi ini.
- source_word: τινες τῶν ὧδε ἑστηκότων
  choice: Di antara orang-orang yang berdiri di sini, ada beberapa orang
  rationale: 'Susunan ini mempertahankan makna partitif: yang dimaksud ialah sebagian dari orang-orang yang hadir dan berdiri di sana.'
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: pasti tidak akan mengecap kematian
  rationale: “Pasti tidak akan” mencerminkan negasi kuat οὐ μή, sedangkan “mengecap kematian” mempertahankan metafora Yunani tanpa mengaburkan makna idiomatisnya.
- source_word: ἕως ἂν ἴδωσιν
  choice: sampai mereka melihat
  rationale: Ungkapan ini mempertahankan hubungan temporal dan orientasi masa depan dari ἕως ἄν dengan bentuk subjungtif.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: “Kerajaan Allah” merupakan padanan Indonesia yang mapan dan tetap dapat mencakup baik pemerintahan Allah maupun ranah tempat pemerintahan-Nya dinyatakan.
- source_word: ἐληλυθυῖαν ἐν δυνάμει
  choice: telah datang dengan kuasa
  rationale: “Telah datang” mencerminkan aspek perfektum, yakni kedatangan yang telah terlaksana dan menghasilkan suatu keadaan; “dengan kuasa” menyampaikan cara atau keadaan kedatangan itu tanpa menentukan peristiwa yang dimaksud.
theological_decisions:
- issue: Peristiwa yang dimaksud dengan Kerajaan Allah yang telah datang dengan kuasa
  choice: Terjemahan tidak menentukan peristiwa tertentu.
  alternative: Menafsirkannya secara khusus sebagai transfigurasi, kebangkitan dan pemuliaan Yesus, Pentakosta, penghakiman atas Yerusalem, atau penggenapan akhir Kerajaan Allah.
  rationale: Teks Yunani tidak menyebutkan secara eksplisit peristiwa mana yang dimaksud. Terjemahan mempertahankan keterbukaan dan ketegangan penafsirannya.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Bentuk “Ia” dan “Aku” mengikuti kebiasaan penulisan pronomina yang merujuk kepada Yesus. Metafora “mengecap kematian” dipertahankan dan dijelaskan dalam catatan kaki.
