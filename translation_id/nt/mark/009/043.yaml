id: MRK.9.43
reference: Mark 9:43
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐὰν ⸀σκανδαλίζῃ σε ἡ χείρ σου, ἀπόκοψον αὐτήν· καλόν ⸂ἐστίν σε⸃ κυλλὸν ⸂εἰσελθεῖν εἰς τὴν ζωὴν⸃ ἢ τὰς δύο χεῖρας ἔχοντα ἀπελθεῖν εἰς τὴν γέενναν, εἰς τὸ πῦρ τὸ ⸀ἄσβεστον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/043.yaml
  text: And if your hand causes you to stumble[a], cut it off. It is better for you to enter into life crippled than, having two hands, to go away into Gehenna[b], into the unquenchable fire.
translation:
  language: id
  text: Dan jika tanganmu membuatmu tersandung[a], potonglah tangan itu. Lebih baik bagimu masuk ke dalam kehidupan tanpa satu tangan daripada pergi ke Gehena[b] dengan kedua tangan, ke dalam api yang tidak dapat dipadamkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membuatmu berbuat dosa.” Kata kerja Yunani ini dapat berarti menyebabkan seseorang tersandung, jatuh, atau berbuat dosa.'
    reason: lexical_alternative
  - marker: b
    text: Gehena adalah bentuk Yunani dari nama tempat yang dikaitkan dengan penghakiman ilahi; secara tradisional diterjemahkan “neraka”.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: menyebabkan engkau tersandung
  rationale: Mempertahankan metafora Yunani tentang tersandung tanpa mempersempit maknanya hanya menjadi tindakan berdosa; cakupan moralnya dijelaskan dalam catatan kaki.
- source_word: ἀπόκοψον
  choice: potonglah tangan itu
  rationale: Imperatif aorisnya tegas dan konkret; pilihan ini mempertahankan kerasnya gambaran tersebut dan memperjelas acuan pronomina dalam bahasa Indonesia.
- source_word: καλόν
  choice: lebih baik
  rationale: Walaupun secara leksikal berarti 'baik', konstruksi perbandingan dengan ἢ secara idiomatis menuntut 'lebih baik'.
- source_word: κυλλόν
  choice: dengan kehilangan satu tangan
  rationale: Dalam konteks tangan yang dipotong, ungkapan ini menyampaikan keadaan anggota tubuh yang termutilasi secara tepat, alami, dan tanpa memakai istilah yang berpotensi merendahkan penyandang disabilitas.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: masuk ke dalam kehidupan
  rationale: Mempertahankan ungkapan eskatologis dan preposisinya, serta tidak mereduksi ζωή menjadi sekadar hidup biologis.
- source_word: ἀπελθεῖν
  choice: pergi
  rationale: Bahasa Indonesia alami tidak memerlukan unsur 'menjauh' di sini; verba ini tetap membentuk kontras dengan 'masuk'.
- source_word: γέενναν
  choice: Gehena
  rationale: Mentransliterasikan nama khusus Yunani yang berakar pada nama tempat Yahudi, alih-alih langsung menyamakannya dengan istilah teologis yang lebih luas.
- source_word: ἄσβεστον
  choice: yang tidak dapat dipadamkan
  rationale: Menyatakan secara alami bahwa api itu tidak bisa dipadamkan, sesuai daya makna ἄσβεστος.
- source_word: χεὶρ σου
  choice: tanganmu
  rationale: Padanan langsung yang mempertahankan gambaran anggota tubuh sebagai pusat peringatan.
- source_word: τὰς δύο χεῖρας ἔχοντα
  choice: dengan kedua tanganmu
  rationale: Padanan idiomatis Indonesia yang tetap mempertahankan kontras eksplisit antara kehilangan satu tangan dan memiliki kedua tangan.
theological_decisions:
- issue: Penerjemahan γέεννα dalam perkataan tentang penghakiman
  choice: Gehena
  alternative: neraka
  rationale: Nama khusus dipertahankan agar latar gambaran Yahudi dan ketegangan istilah sumber tidak dilebur ke dalam istilah teologis Indonesia yang lebih luas; padanan tradisional dicantumkan dalam catatan kaki.
- issue: Daya gambaran memotong tangan
  choice: Mempertahankan bahasa tubuh yang konkret tanpa pelunakan interpretatif
  alternative: Parafrasa moral seperti 'jauhilah segala sesuatu yang membuatmu berdosa'
  rationale: Teks memakai gambaran jasmani yang mengejutkan untuk menegaskan seriusnya sandungan dan penghakiman; terjemahan tidak menjelaskan atau mengurangi retorikanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan khidmat. Struktur dibuat alami bagi pembaca umum, sementara metafora 'tersandung', gambaran pemotongan tangan, ungkapan 'kehidupan', dan nama 'Gehena' dipertahankan. Semua penanda catatan kaki muncul dalam teks utama.
