  terminology: “Gehena” merupakan transliterasi yang sah untuk γέεννα dan catatan kaki dengan padanan tradisional “neraka” memadai. “Kehidupan,” “api yang tidak dapat dipadamkan,” dan bahasa perintah pemotongan mempertahankan register serius serta tidak menambahkan penafsiran denominasi.
