  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ λέγω ὑμῖν ὅτι καὶ Ἠλίας ἐλήλυθεν, καὶ ἐποίησαν αὐτῷ ὅσα ⸀ἤθελον, καθὼς γέγραπται ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/013.yaml
  text: But I tell you that Elijah also has come[a], and they did to him whatever they wanted, just as it is written about him.
translation:
  language: id
  text: Namun, Aku berkata kepada kalian bahwa Elia pun sudah datang[a], dan mereka memperlakukannya sesuka hati mereka, sebagaimana ada tertulis tentang dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, Elia sudah datang dalam diri dan pelayanan Yohanes Pembaptis; lihat Markus 9:11–12 dan bandingkan Matius 11:14; 17:12–13.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai kontras dengan harapan para murid mengenai kedatangan Elia dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mempertahankan bentuk ujaran langsung dan sapaan jamak yang dalam bahasa Indonesia tetap dapat dinyatakan dengan 'kepadamu'.
- source_word: ὅτι καὶ Ἠλίας ἐλήλυθεν
  choice: bahwa Elia pun sudah datang
  rationale: '''Pun'' mencerminkan καὶ, sedangkan ''sudah datang'' menyampaikan aspek perfektum ἐλήλυθεν: kedatangannya telah terjadi dan tetap relevan bagi pembicaraan.'
- source_word: ἐποίησαν αὐτῷ
  choice: mereka memperlakukannya
  rationale: Dalam konteks tindakan terhadap seseorang, ungkapan ini lebih alami daripada terjemahan harfiah 'melakukan kepadanya', sambil tetap membiarkan klausa berikutnya menjelaskan sifat perlakuan itu.
- source_word: ὅσα ἤθελον
  choice: sesuka hati mereka
  rationale: Ungkapan alami bahasa Indonesia yang menyampaikan tindakan tanpa batas menurut kehendak para pelaku.
- source_word: καθὼς γέγραπται
  choice: sebagaimana ada tertulis
  rationale: Mempertahankan formula rujukan Kitab Suci serta nuansa perfektum pasif tanpa terdengar terlalu kaku.
- source_word: ἐπ’ αὐτόν
  choice: tentang dia
  rationale: Dalam konstruksi dengan γέγραπται, frasa ini paling wajar dipahami sebagai 'tentang/mengenai dia'; kemungkinan 'menentang dia' tidak dipaksakan ke dalam teks utama.
theological_decisions:
- issue: Identitas Elia dalam perkataan ini
  choice: Nama 'Elia' dipertahankan tanpa penjelasan identitas dalam teks utama.
  alternative: Menuliskan bahwa Elia datang dalam diri atau pelayanan Yohanes Pembaptis.
  rationale: Teks Yunani secara eksplisit menyebut Elia. Konteks mengarahkan pembaca kepada Yohanes Pembaptis, tetapi identifikasi itu bersifat interpretatif dan lebih tepat dijelaskan dalam catatan kaki.
- issue: Makna ἐπ’ αὐτόν
  choice: tentang dia
  alternative: menentang dia
  rationale: Pemakaian bersama formula 'ada tertulis' lebih mendukung arti 'tentang dia', tetapi bentuk Yunani memiliki keluwesan semantis yang patut diakui.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Aku' mengikuti ujaran langsung Yesus; 'sesuka hati mereka' dipilih sebagai ungkapan idiomatis yang mudah dipahami. Penanda catatan kaki [a] ditempatkan tepat setelah klausa yang dijelaskannya.
