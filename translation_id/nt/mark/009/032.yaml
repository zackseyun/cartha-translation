  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα, καὶ ἐφοβοῦντο αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/032.yaml
  text: But they did not understand the statement[a], and they were afraid to ask him.
translation:
  language: id
  text: Namun, mereka tidak memahami perkataan itu[a] dan takut bertanya kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ucapan itu” atau “pernyataan itu.” Kata Yunani ῥῆμα dapat merujuk pada perkataan, ucapan, atau pernyataan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Namun, mereka
  rationale: δέ menandai kontras ringan dengan pemberitahuan Yesus sebelumnya; subjek tersiratnya adalah para murid dan secara alami diterjemahkan sebagai “mereka”.
- source_word: ἠγνόουν
  choice: tidak memahami
  rationale: ἀγνοέω di sini menyatakan kegagalan memahami ucapan Yesus. Bentuk imperfek menggambarkan keadaan yang sedang berlangsung, yang dalam bahasa Indonesia wajar disampaikan tanpa penanda aspek tambahan.
- source_word: τὸ ῥῆμα
  choice: perkataan itu
  rationale: ῥῆμα merujuk pada hal yang baru saja diucapkan Yesus. “Perkataan” mencakup ucapan atau pernyataan dan terdengar alami dalam bahasa Indonesia.
- source_word: ἐφοβοῦντο
  choice: takut
  rationale: φοβέομαι menyatakan keadaan takut; bentuk “takut” ringkas dan alami, sementara konteks lampau sudah jelas dari narasi.
- source_word: αὐτὸν ἐπερωτῆσαι
  choice: menanyakannya kepada Yesus
  rationale: Secara harfiah konstruksi ini berarti “bertanya kepada dia.” Dalam bahasa Indonesia, objek pertanyaan perlu dibuat wajar dari konteks, sedangkan rujukan αὐτόν diperjelas sebagai Yesus untuk menghindari ambiguitas pronominal.
