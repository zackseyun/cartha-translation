  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐδίδασκεν γὰρ τοὺς μαθητὰς αὐτοῦ καὶ ἔλεγεν αὐτοῖς ὅτι Ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἀνθρώπων, καὶ ἀποκτενοῦσιν αὐτόν, καὶ ἀποκτανθεὶς ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/031.yaml
  text: For he was teaching his disciples and telling them[a], “The Son of Man is being handed over into the hands of men, and they will kill him, and after he is killed[b], after three days he will rise.”
translation:
  language: id
  text: Sebab Ia sedang mengajar murid-murid-Nya dan berkata kepada mereka, “Anak Manusia sedang diserahkan ke tangan manusia[a], dan mereka akan membunuh-Nya, dan sesudah Ia dibunuh, Ia akan bangkit setelah tiga hari[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke tangan orang-orang.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam tiga hari.” Teks Yunani berbunyi “setelah tiga hari,” ungkapan yang di bagian lain digunakan berdampingan dengan “pada hari ketiga.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: sedang mengajar
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung sebagai latar narasi.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan fungsi penghubung yang menjelaskan konteks sebelumnya.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: murid-murid-Nya
  rationale: Padanan baku dan alami yang mempertahankan hubungan guru dan pengikut.
- source_word: ἔλεγεν αὐτοῖς
  choice: berkata kepada mereka
  rationale: Bentuk imperfek menunjukkan pengajaran yang berlanjut; ungkapan ini alami dalam bahasa Indonesia.
- source_word: Ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Sebutan diri yang telah mapan serta mempertahankan kemungkinan gema Daniel tanpa memparafrasakannya.
- source_word: παραδίδοται
  choice: sedang diserahkan
  rationale: Bentuk kini pasif mempertahankan tindakan penyerahan yang sedang menuju penggenapan tanpa mempersempitnya menjadi sekadar pengkhianatan.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: ke tangan manusia
  rationale: Mempertahankan idiom konkret tentang masuk ke bawah kuasa manusia serta kontras dengan 'Anak Manusia'.
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: mereka akan membunuh-Nya
  rationale: Menyampaikan bentuk aktif futur dengan pelaku jamak yang tidak disebutkan secara khusus.
- source_word: ἀποκτανθεὶς
  choice: Sesudah Ia dibunuh
  rationale: Partisip aoristus pasif menunjukkan bahwa pembunuhan mendahului tindakan bangkit.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: setelah tiga hari
  rationale: μετά dengan akusatif secara langsung berarti 'setelah'; frasa ini tidak diselaraskan secara diam-diam dengan 'pada hari ketiga'.
- source_word: ἀναστήσεται
  choice: Ia akan bangkit
  rationale: Bentuk futur tengah secara alami dapat diterjemahkan secara intransitif, tanpa mengubahnya menjadi bentuk pasif.
theological_decisions:
- issue: Makna dan suara παραδίδοται
  choice: sedang diserahkan
  alternative: dikhianati; diserahkan nanti
  rationale: Bentuk pasif Yunani tidak menyebut pelakunya dan dapat mencakup pengkhianatan, penangkapan, tindakan manusia, serta izin ilahi tanpa menetapkan salah satunya sebagai satu-satunya makna.
- issue: Kontras antara Ὁ υἱὸς τοῦ ἀνθρώπου dan ἀνθρώπων
  choice: Anak Manusia ... tangan manusia
  alternative: Anak Manusia ... tangan orang-orang
  rationale: Pilihan ini mempertahankan permainan dan kontras leksikal antara sebutan 'Anak Manusia' dan para pelaku manusia.
- issue: Suara ἀναστήσεται
  choice: Ia akan bangkit
  alternative: Ia akan dibangkitkan
  rationale: Terjemahan intransitif mengikuti bentuk tengah dalam ayat ini dan tidak memasukkan bentuk pasif dari pernyataan kebangkitan di tempat lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapital pada kata ganti yang merujuk kepada Yesus mengikuti konvensi penerbitan Alkitab bahasa Indonesia. Struktur pengulangan 'Sesudah Ia dibunuh, setelah tiga hari' dipertahankan untuk mencerminkan dua unsur berurutan dalam teks Yunani.
