base_translation:
  language: en
  yaml_path: translation/nt/mark/009/027.yaml
  text: But Jesus[a], taking hold of his hand, raised him up[b], and he stood up.
translation:
  language: id
  text: Namun, Yesus memegang tangan anak itu, mengangkatnya[a], lalu anak itu berdiri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membangkitkannya”; kata Yunani ini juga dapat digunakan untuk membangunkan dari tidur atau membangkitkan dari kematian.
    reason: lexical_alternative
  - marker: b
    text: Atau “anak itu bangkit” atau “anak itu bangun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras ringan antara anggapan orang banyak bahwa anak itu sudah mati dan tindakan Yesus selanjutnya.
- source_word: κρατήσας
  choice: memegang
  rationale: Mengungkapkan tindakan fisik Yesus memegang tangan anak itu secara alami, tanpa kesan keras yang dapat timbul dari 'mencengkeram'.
- source_word: τῆς χειρὸς αὐτοῦ
  choice: tangan anak itu
  rationale: Mempertahankan anggota tubuh yang disebut secara khusus, yaitu χείρ ('tangan'), sekaligus memperjelas acuan pronomina dalam bahasa Indonesia.
- source_word: ἤγειρεν
  choice: membangunkannya
  rationale: Dalam konteks anak yang terbaring seperti mati, pilihan ini dapat berarti membuatnya bangkit dari keadaan terbaring dan tetap mempertahankan gema leksikal ἐγείρω yang juga dipakai untuk bangun dari tidur atau bangkit dari kematian.
- source_word: ἀνέστη
  choice: ia berdiri
  rationale: 'Menyatakan hasil tindakan itu dalam bahasa Indonesia modern dan wajar: anak tersebut bangkit hingga berada dalam posisi berdiri.'
theological_decisions:
- issue: Kemungkinan gema bahasa kebangkitan dalam ἤγειρεν / ἀνέστη
  choice: Gunakan bahasa fisik yang wajar dalam konteks, yaitu 'membangunkannya, lalu ia berdiri', sambil menerangkan keluasan makna kedua verba dalam catatan kaki.
  alternative: Menggunakan 'mengangkatnya, lalu ia bangkit' untuk lebih menonjolkan gema kebangkitan, atau 'membantunya berdiri' untuk menghilangkan gema tersebut.
  rationale: Konteks langsung tidak secara tegas menyatakan bahwa anak itu dibangkitkan dari kematian, tetapi kedua verba Yunani dapat dipakai dalam konteks kebangkitan. Terjemahan utama tidak memaksakan kesimpulan teologis, sedangkan catatan kaki menjaga ketegangan leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Anak itu' dipakai untuk memperjelas rujukan αὐτοῦ/αὐτόν. Penanda catatan kaki ditempatkan tepat sesudah verba terkait.
