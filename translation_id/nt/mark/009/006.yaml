  yaml_path: translation/nt/mark/009/006.yaml
  text: For he did not know what he should answer[b][a], for they were terrified.
translation:
  language: id
  text: Sebab ia tidak tahu apa yang harus ia jawab[a], karena mereka menjadi sangat ketakutan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “apa yang harus ia katakan sebagai jawaban.”
    reason: lexical_alternative
  - marker: b
    text: Sebagian terjemahan mengungkapkannya secara lebih lancar sebagai “mereka sangat ketakutan”; bahasa Yunani secara lebih harfiah berbunyi “mereka menjadi sangat ketakutan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: tidak tahu
  rationale: οἶδα menyatakan pengetahuan atau kesadaran; bentuk lampau Yunani di sini secara alami diterjemahkan dengan 'tidak tahu' dalam bahasa Indonesia.
- source_word: τί ἀποκριθῇ
  choice: apa yang harus dijawabnya
  rationale: ἀποκρίνομαι berarti menjawab atau memberi tanggapan; konstruksi deliberatif sesudah τί dipertahankan dengan 'apa yang harus dijawabnya'.
- source_word: ἔκφοβοι
  choice: sangat ketakutan
  rationale: ἔκφοβος menyatakan rasa takut yang kuat; 'sangat ketakutan' jelas, wajar, dan mempertahankan intensitasnya.
- source_word: ἐγένοντο
  choice: menjadi
  rationale: γίνομαι menandai masuknya mereka ke dalam suatu keadaan; 'menjadi' mempertahankan unsur perubahan keadaan yang ada dalam bahasa Yunani.
- source_word: γὰρ ... γὰρ
  choice: sebab ... karena
  rationale: Kedua partikel memberi penjelasan. Variasi 'sebab ... karena' mempertahankan kedua hubungan penjelas tanpa menghasilkan pengulangan yang kaku dalam bahasa Indonesia.
theological_decisions:
- issue: Subjek klausa jamak
  choice: mereka menjadi sangat ketakutan
  alternative: ia menjadi sangat ketakutan
  rationale: Kata sifat ἔκφοβοι dan verba ἐγένοντο berbentuk jamak. Dalam konteks, subjeknya paling alami merujuk kepada Petrus beserta rekan-rekannya, bukan Petrus seorang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'ia' digunakan untuk narasi tertulis; susunan kalimat mempertahankan dua penjelasan dengan γάρ sambil tetap alami. Semua penanda catatan kaki dicantumkan dalam teks utama.
