  yaml_path: translation/nt/mark/009/037.yaml
  text: Whoever receives one of such children in my name receives me; and whoever receives me receives not me, but the one who sent me.
translation:
  language: id
  text: “Siapa pun yang menerima salah seorang dari antara anak-anak seperti ini dalam nama-Ku[a] menerima Aku. Dan siapa pun yang menerima Aku, bukan Aku yang diterimanya, melainkan Dia yang mengutus Aku.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “karena nama-Ku.” Ungkapan Yunani dapat menyatakan bahwa anak itu diterima dengan mengacu kepada nama, pribadi, atau kewibawaan Yesus.'
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “menerima” juga dapat diterjemahkan “menyambut”; kata yang sama diulangi dalam setiap klausa ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃς ἂν
  choice: Siapa pun yang
  rationale: Gabungan pronomina relatif dan ἄν menyatakan kondisi umum tak tentu; bentuk ini alami dalam bahasa Indonesia dan mempertahankan cakupan universalnya.
- source_word: ἓν τῶν τοιούτων παιδίων
  choice: salah seorang anak seperti ini
  rationale: Ungkapan ini mempertahankan arti partitif ἓν ... παιδίων (‘satu dari antara anak-anak’) sekaligus daya kualitatif τοιούτων (‘seperti ini’, ‘dari jenis ini’), tanpa mengubahnya menjadi penunjukan deiktis ‘anak-anak ini’.
- source_word: δέξηται / δέχεται / δέχηται
  choice: menerima
  rationale: Kata δέχομαι diulangi dalam setiap klausa. ‘Menerima’ cukup luas untuk mencakup penyambutan dan penerimaan pribadi serta mempertahankan rantai retoris antara anak, Yesus, dan Dia yang mengutus-Nya.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: dalam nama-Ku
  rationale: Ungkapan ringkas ini mempertahankan kaitan tindakan tersebut dengan nama, pribadi, dan kewibawaan Yesus. Kemungkinan nuansa alasan (‘karena nama-Ku’) dicatat dalam catatan kaki.
- source_word: οὐκ ἐμὲ δέχεται ἀλλὰ
  choice: bukan Aku yang diterimanya, melainkan
  rationale: Susunan ini mempertahankan kontras tegas οὐκ ... ἀλλά dan penekanan pada ἐμέ, tanpa menambahkan ‘bukan hanya’ yang tidak tertulis dalam bahasa Yunani.
- source_word: τὸν ἀποστείλαντά με
  choice: Dia yang mengutus Aku
  rationale: Partisipel berartikel diterjemahkan sebagai frasa substantival yang alami dan tetap mempertahankan bahasa pengutusan.
theological_decisions:
- issue: 'Kontras terakhir: ‘bukan Aku ... melainkan Dia yang mengutus Aku’'
  choice: Mempertahankan kontras harfiah tanpa parafrasa penjelas
  alternative: ‘bukan hanya Aku, tetapi juga Dia yang mengutus Aku’
  rationale: Bahasa Yunani menyatakan kontras ‘bukan Aku, melainkan’. Dalam konteks, ungkapan itu menekankan bahwa penerimaan terhadap Yesus menjangkau Dia yang mengutus-Nya, tetapi teks tidak memakai kata ‘hanya’ atau ‘juga’. Terjemahan mempertahankan ketegangan teologis tersebut tanpa memberi kesan melalui parafrasa bahwa unsur tambahan ada dalam teks.
- issue: Rujukan τοιούτων
  choice: ‘anak seperti ini’
  alternative: ‘anak ini’ atau ‘anak-anak ini’
  rationale: τοιούτων bersifat kualitatif (‘seperti ini’, ‘dari jenis ini’), bukan terutama deiktis. Pilihan ini tidak membatasi perkataan Yesus hanya pada anak tertentu yang sedang berada di hadapan-Nya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya langsung dan bermartabat. Pengulangan ‘menerima’ dipertahankan untuk menampilkan struktur retoris teks. Kapitalisasi pronomina dalam ucapan Yesus mengikuti kebiasaan penulisan Alkitab bahasa Indonesia.
