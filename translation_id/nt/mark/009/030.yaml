id: MRK.9.30
reference: Mark 9:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Κἀκεῖθεν ἐξελθόντες ⸀παρεπορεύοντο διὰ τῆς Γαλιλαίας, καὶ οὐκ ἤθελεν ἵνα τις γνοῖ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/030.yaml
  text: And from there[a] they went on through Galilee[b], and he did not want anyone to know.
translation:
  language: id
  text: Setelah berangkat dari sana, mereka meneruskan perjalanan melintasi Galilea[a], dan ia tidak ingin seorang pun tahu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk kata kerja Yunani dapat menekankan bahwa mereka sedang dalam perjalanan melintasi Galilea.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Yunani tidak menyatakan apa yang tidak ingin ia ketahui orang lain; dalam konteks, hal itu mungkin merujuk pada keberadaan atau perjalanan mereka melalui Galilea.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντες
  choice: Setelah berangkat dari sana
  rationale: Ungkapan ini mempertahankan kesinambungan narasi dalam καί, titik asal dalam ἐκεῖθεν, dan tindakan meninggalkan tempat sebelumnya dalam ἐξελθόντες, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: παρεπορεύοντο
  choice: mereka meneruskan perjalanan melintasi
  rationale: Bentuk imperfek menggambarkan perjalanan yang sedang berlangsung. Pilihan ini menyampaikan gerak berkelanjutan sekaligus perkembangan narasi tanpa terjemahan yang kaku.
- source_word: διὰ τῆς Γαλιλαίας
  choice: melintasi Galilea
  rationale: διά dengan genitif menyatakan gerak melalui suatu wilayah. 'Melintasi Galilea' merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: οὐκ ἤθελεν
  choice: ia tidak ingin
  rationale: θέλω menyatakan kehendak atau keinginan. 'Tidak ingin' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: ἵνα τις γνοῖ
  choice: seorang pun tahu
  rationale: Klausa ἵνα dengan subjungtif menyatakan hal yang hendak dicegah. Objek dari 'tahu' tetap tidak dinyatakan, sebagaimana dalam teks Yunani.
theological_decisions:
- issue: Subjek tersirat dari ἤθελεν
  choice: Diterjemahkan dengan 'ia', yang mengacu kepada Yesus.
  alternative: Menyebut nama 'Yesus' secara eksplisit.
  rationale: Kata kerja tunggal itu secara alami mengacu kepada Yesus sebagai subjek narasi. Kata ganti diperlukan dalam bahasa Indonesia, sedangkan pengulangan nama tidak diperlukan oleh teks.
- issue: Objek yang tidak dinyatakan dari γνοῖ
  choice: 'Dibiarkan tersirat: ''seorang pun tahu''.'
  alternative: Menambahkan 'tentang keberadaan atau perjalanan mereka'.
  rationale: Teks Yunani tidak menyebutkan apa yang tidak boleh diketahui. Membiarkannya tersirat mempertahankan ambiguitas asli dan tidak mempersempit maknanya secara tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. 'Meneruskan perjalanan melintasi' menjaga aspek perjalanan yang berlangsung, sedangkan objek 'tahu' sengaja dibiarkan tersirat sesuai teks sumber.
