source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν αὐτὸν καταλάβῃ ῥήσσει αὐτόν, καὶ ἀφρίζει καὶ τρίζει τοὺς ⸀ὀδόντας καὶ ξηραίνεται· καὶ εἶπα τοῖς μαθηταῖς σου ἵνα αὐτὸ ἐκβάλωσιν, καὶ οὐκ ἴσχυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/018.yaml
  text: And wherever it seizes him[a], it throws him down, and he foams and grinds his teeth and becomes rigid. And I told your disciples to cast it out, but they were not able.
translation:
  language: id
  text: Setiap kali roh itu mencengkeramnya, roh itu membantingnya; anak itu berbusa, menggertakkan gigi, dan menjadi kaku.[a] Aku telah meminta murid-murid-Mu untuk mengusir roh itu, tetapi mereka tidak sanggup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengering” atau “menjadi layu”; secara harfiah, “mengering.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν
  choice: di mana pun
  rationale: Ungkapan ini menyatakan keadaan relatif yang tidak tentu, yakni ‘di mana pun’ peristiwa itu terjadi, sekaligus menyiratkan kejadian yang berulang.
- source_word: καταλάβῃ
  choice: mencengkeramnya
  rationale: Kata ini menggambarkan roh yang menangkap atau menguasai anak itu secara bermusuhan. ‘Mencengkeram’ hidup dan wajar dalam bahasa Indonesia.
- source_word: ῥήσσει
  choice: membantingnya
  rationale: Dalam konteks serangan roh ini, verba tersebut menunjuk pada tindakan keras yang menjatuhkan anak itu. ‘Membanting’ menyampaikan kekerasan tindakan tanpa menyiratkan tubuhnya tercabik.
- source_word: ἀφρίζει
  choice: berbusa
  rationale: Terjemahan langsung dan ringkas; sumber tidak menyebutkan secara eksplisit ‘di mulut’.
- source_word: τρίζει τοὺς ὀδόντας
  choice: menggertakkan gigi
  rationale: Ungkapan Indonesia yang alami untuk gerakan menggesekkan atau mengertakkan gigi sebagai gejala jasmani.
- source_word: ξηραίνεται
  choice: menjadi kaku
  rationale: Dalam rangkaian gejala serangan, kata ini dapat dipahami sebagai tubuh yang menjadi kaku. Karena arti harfiahnya berkaitan dengan mengering atau menjadi layu, kemungkinan lain dipertahankan dalam catatan kaki.
- source_word: εἶπα
  choice: sudah meminta
  rationale: Dalam konteks ini, perkataan ayah kepada para murid berupa permintaan agar mereka mengusir roh. ‘Sudah meminta’ alami dalam bahasa Indonesia dan sesuai dengan maksud ujarannya.
- source_word: ἐκβάλωσιν
  choice: mengusir
  rationale: Dalam konteks eksorsisme, verba ini berarti mengeluarkan atau mengusir roh jahat.
- source_word: οὐκ ἴσχυσαν
  choice: mereka tidak sanggup
  rationale: Menyatakan ketidakmampuan atau kurangnya kuasa tanpa menjelaskan penyebab kegagalan mereka.
theological_decisions:
- issue: Rujukan αὐτό dalam frasa ‘mengusir roh itu’
  choice: Pronomina itu dibuat eksplisit sebagai ‘roh itu’.
  alternative: Pronomina dapat dipahami secara lebih umum sebagai gangguan yang diderita anak itu.
  rationale: Konteks langsung berbicara tentang roh bermusuhan yang mencengkeram anak tersebut dan hendak diusir para murid. Bahasa Indonesia lebih jelas dan alami bila rujukannya dinyatakan kembali sebagai ‘roh itu’.
- issue: Makna ξηραίνεται dalam rangkaian gejala
  choice: menjadi kaku
  alternative: mengering, menjadi layu, atau merana
  rationale: Konteks gejala serangan mendukung pemahaman ‘menjadi kaku’, tetapi arti leksikal dasarnya tidak sepenuhnya pasti di sini. Karena itu, alternatif yang lebih harfiah dicatat tanpa meniadakan ambiguitas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pengulangan ‘roh itu’ dan ‘anak itu’ dipakai untuk memperjelas rujukan pronomina Yunani yang dapat terasa kabur jika diterjemahkan hanya dengan ‘ia’ atau ‘itu’.
