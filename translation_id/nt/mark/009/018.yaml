  to: Setiap kali roh itu mencengkeramnya, roh itu membantingnya; anak itu berbusa, menggertakkan gigi, dan menjadi kaku.[a] Aku telah meminta murid-murid-Mu untuk mengusir roh itu, tetapi mereka tidak sanggup.
  rationale: Revisi mengganti konstruksi yang kurang idiomatis dengan “setiap kali” untuk menyampaikan sifat berulang dari serangan yang diungkapkan oleh ὅπου ἐὰν dalam konteks ini. “Sudah meminta” disederhanakan menjadi “telah meminta” agar tetap baku dan tidak memberi penekanan aspek yang tidak diperlukan. Catatan kaki diperketat supaya hanya menyajikan alternatif yang dekat dengan ξηραίνεται, sambil mempertahankan ketidakpastian nuansanya.
