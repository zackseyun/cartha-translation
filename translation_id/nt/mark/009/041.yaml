  text: Ὃς γὰρ ἂν ποτίσῃ ὑμᾶς ποτήριον ὕδατος ἐν ⸀ὀνόματι ὅτι χριστοῦ ἐστε, ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ ⸀ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/041.yaml
  text: For whoever gives you a cup of water to drink in the name that you are Messiah's[a], truly I say to you, he will certainly not lose his reward.
translation:
  language: id
  text: Sebab siapa pun yang memberi kalian secangkir air untuk diminum karena kalian dikenal sebagai milik Mesias[a], sesungguhnya Aku berkata kepada kalian, orang itu sama sekali tidak akan kehilangan upahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena kalian dikenal sebagai milik Kristus.”
    reason: Mencatat padanan tradisional untuk gelar Χριστός tanpa mengubah makna hubungan kepemilikan dan identitas dalam frasa Yunani.
lexical_decisions:
- source_word: Ὃς γὰρ ἂν
  choice: Sebab siapa pun yang
  rationale: Mempertahankan hubungan penjelas γάρ dengan ayat sebelumnya dan menyampaikan konstruksi relatif tak tentu secara wajar dalam bahasa Indonesia.
- source_word: ποτίσῃ ὑμᾶς ποτήριον ὕδατος
  choice: memberi kalian secangkir air untuk diminum
  rationale: Mengungkapkan arti harfiah ποτίζω, yaitu memberi minum, dengan susunan Indonesia yang alami serta tetap mempertahankan gambaran sederhana tentang secangkir air.
- source_word: ἐν ὀνόματι ὅτι χριστοῦ ἐστε
  choice: karena kalian adalah milik Mesias
  rationale: 'Dalam konteks ini, ungkapan tersebut menyatakan dasar tindakan: pertolongan diberikan karena penerimanya dikenali sebagai milik Mesias. Terjemahan ini menghindari ungkapan harfiah ''dalam nama bahwa'' yang tidak alami dalam bahasa Indonesia, tanpa memasukkan kata ''Aku'' yang tidak terdapat dalam teks Yunani.'
- source_word: ἀμὴν λέγω ὑμῖν
  choice: sesungguhnya Aku berkata kepada kalian
  rationale: Mempertahankan bobot pernyataan khidmat ἀμήν dan bentuk langsung perkataan Yesus. Huruf kapital pada 'Aku' mengikuti kebiasaan ejaan Alkitab bahasa Indonesia untuk rujukan kepada Yesus.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: sama sekali tidak akan kehilangan
  rationale: Gabungan οὐ μή dengan subjungtif menyatakan penyangkalan yang sangat tegas; 'sama sekali tidak akan' menyampaikan penekanan itu dengan jelas.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: upahnya
  rationale: μισθός dapat berarti upah atau ganjaran. 'Upah' ringkas, lazim dalam bahasa Alkitab Indonesia, dan tidak menentukan lebih jauh sifat atau waktu pemberiannya.
theological_decisions:
- issue: Penerjemahan Χριστός dalam konstruksi kepemilikan
  choice: milik Mesias
  alternative: milik Kristus
  rationale: Χριστός berfungsi sebagai gelar bagi Yesus dalam frasa χριστοῦ ἐστε. 'Mesias' mempertahankan makna gelar itu, sedangkan bentuk tradisional 'Kristus' dicatat sebagai alternatif.
- issue: Hubungan ἐν ὀνόματι dengan ὅτι χριστοῦ ἐστε
  choice: karena kalian adalah milik Mesias
  alternative: dalam nama bahwa kalian adalah milik Mesias
  rationale: Konstruksi Yunani padat dan secara harfiah tidak dapat dialihkan dengan alami. Terjemahan utama memahami klausa ὅτι sebagai dasar atau alasan pemberian air, tetapi tidak menambahkan 'dalam nama-Ku', sebab kata ganti 'Ku' tidak terdapat dalam teks sumber.
translation_notes:
  register: Bahasa modern, lugas, dan bermartabat. 'Kalian' dipakai karena ὑμᾶς dan ὑμῖν berbentuk jamak. Susunan kalimat dibuat alami dalam bahasa Indonesia sambil mempertahankan penekanan kuat pada jaminan bahwa upah tidak akan hilang.
