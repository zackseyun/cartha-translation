source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ πούς σου σκανδαλίζῃ σε, ἀπόκοψον αὐτόν· καλόν ἐστίν ⸀σε εἰσελθεῖν εἰς τὴν ζωὴν χωλὸν ἢ τοὺς δύο πόδας ἔχοντα βληθῆναι εἰς τὴν ⸀γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/045.yaml
  text: And if your foot causes you to stumble[a], cut it off. It is better for you to enter into life lame than, having both feet, to be thrown into Gehenna.
translation:
  language: id
  text: Dan jika kakimu menyebabkan kamu tersandung, potonglah kaki itu. Lebih baik bagimu masuk ke dalam hidup dalam keadaan pincang daripada dilemparkan ke dalam Gehena dengan kedua kakimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “neraka.” Istilah Yunani yang dipakai ialah Gehena, yang mengingatkan pada Lembah Hinom dan kaitannya dengan penghakiman ilahi.'
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: menyebabkan kamu tersandung
  rationale: Mempertahankan metafora tersandung dalam bahasa Yunani sekaligus mencakup gagasan jatuh ke dalam dosa tanpa mempersempit maknanya secara eksplisit.
- source_word: ἀπόκοψον
  choice: potonglah itu
  rationale: Mencerminkan imperatif yang tegas dan gambaran konkret dalam sumber tanpa melunakkan ungkapan hiperbolisnya.
- source_word: καλόν ἐστίν
  choice: lebih baik
  rationale: Dalam konstruksi perbandingan dengan ἢ, ungkapan ini secara idiomatis berarti 'lebih baik'.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: masuk ke dalam hidup
  rationale: Mempertahankan metafora dan tidak menambahkan 'kekal', sebab teks Yunani hanya menyebut ζωή, 'hidup'.
- source_word: χωλὸν
  choice: dengan kaki timpang
  rationale: χωλός menunjuk pada ketimpangan atau kepincangan, khususnya dalam berjalan; bentuk ini alami dalam konteks kaki.
- source_word: βληθῆναι
  choice: dilemparkan
  rationale: Menerjemahkan infinitif pasif βάλλω secara langsung dan wajar dalam bahasa Indonesia modern.
- source_word: γέενναν
  choice: Gehena
  rationale: Mempertahankan kekhususan istilah Yunani yang berasal dari nama Lembah Hinom dan sarat dengan gambaran penghakiman ilahi.
- source_word: τοὺς δύο πόδας ἔχοντα
  choice: memiliki kedua kaki
  rationale: Ungkapan Indonesia yang alami dan tetap mempertahankan kontras dengan keadaan timpang.
theological_decisions:
- issue: Penerjemahan γέεννα dalam konteks penghakiman
  choice: Gehena
  alternative: neraka
  rationale: Teks memakai istilah khusus γέεννα, bukan istilah umum tentang alam kematian. 'Gehena' mempertahankan latar historis dan eskatologisnya, sedangkan padanan tradisional 'neraka' dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur perbandingan dibuat jelas dengan 'tetapi' tanpa mengubah hubungan makna sumber. Istilah 'hidup' dibiarkan tanpa tambahan 'kekal' untuk menjaga ketepatan leksikal.
