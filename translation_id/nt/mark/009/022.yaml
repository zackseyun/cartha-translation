  text: καὶ πολλάκις ⸂καὶ εἰς πῦρ αὐτὸν⸃ ἔβαλεν καὶ εἰς ὕδατα ἵνα ἀπολέσῃ αὐτόν· ἀλλ’ εἴ τι ⸀δύνῃ, βοήθησον ἡμῖν σπλαγχνισθεὶς ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/022.yaml
  text: And many times it has thrown him both into fire and into waters to destroy him[a]. But if you can do anything, help us[b], having compassion on us.
translation:
  language: id
  text: Dan berkali-kali roh itu melemparkannya ke dalam api dan ke dalam air untuk membinasakannya.[a] Tetapi jika Engkau dapat berbuat sesuatu, tolonglah kami, dan kasihanilah kami.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke dalam perairan”; bahasa Yunani memakai bentuk jamak.
    reason: lexical_alternative
  - marker: b
    text: Atau, “tolonglah kami, dengan berbelas kasihan kepada kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: berkali-kali
  rationale: Menyatakan kejadian yang berulang dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἔβαλεν
  choice: melemparkannya
  rationale: Aoristus merangkum tindakan yang berulang pada masa lalu; konteks dan πολλάκις sudah membuat keberulangannya jelas tanpa bentuk verbal tambahan.
- source_word: εἰς πῦρ ... καὶ εἰς ὕδατα
  choice: ke dalam api dan ke dalam air
  rationale: Mengikuti arah gerak yang dinyatakan εἰς dan menghasilkan ungkapan Indonesia yang wajar. Bentuk jamak ὕδατα dijelaskan dalam catatan kaki.
- source_word: ἵνα ἀπολέσῃ αὐτόν
  choice: untuk membinasakannya
  rationale: Mempertahankan makna tujuan serta cakupan destruktif ἀπόλλυμι tanpa mempersempitnya menjadi sekadar 'membunuh'.
- source_word: ἀλλ’ εἴ τι δύνῃ
  choice: Tetapi jika Engkau dapat berbuat sesuatu
  rationale: Mewakili τι ('sesuatu') dan mempertahankan keraguan dalam permohonan sang ayah.
- source_word: βοήθησον ἡμῖν
  choice: tolonglah kami
  rationale: Imperatif langsung yang alami dan mendesak dalam bahasa Indonesia.
- source_word: σπλαγχνισθεὶς ἐφ’ ἡμᾶς
  choice: dan kasihanilah kami
  rationale: Mengungkapkan belas kasih yang mendalam secara alami. Koordinasi dengan 'dan' lebih lancar daripada mempertahankan partisipel secara kaku; alternatif yang lebih formal dicatat di kaki halaman.
theological_decisions:
- issue: Nada permohonan sang ayah dan keraguannya tentang kemampuan Yesus
  choice: jika Engkau dapat berbuat sesuatu
  alternative: jika kiranya Engkau sanggup melakukan sesuatu
  rationale: Klausa bersyarat Yunani menyatakan keraguan dengan jelas. Terjemahan tidak melunakkan atau menyelesaikan ketegangan itu.
- issue: Acuan subjek tersirat pada ἔβαλεν
  choice: roh itu
  alternative: ia
  rationale: Subjek gramatikal berasal dari konteks sebelumnya dan mengacu pada roh. Menyatakannya sebagai 'roh itu' mencegah kata ganti Indonesia disalahpahami sebagai anak tersebut tanpa menambahkan identifikasi doktrinal baru.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan kepada Yesus memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Susunan mempertahankan desakan emosional sang ayah sekaligus menghindari kekakuan partisipel Yunani.
