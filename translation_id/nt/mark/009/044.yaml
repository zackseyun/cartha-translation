  text: Di mana ulat mereka tidak mati dan api tidak dipadamkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini tidak terdapat dalam manuskrip-manuskrip Yunani paling awal, termasuk Sinaiticus dan Vaticanus dari abad ke-4, maupun dalam terjemahan-terjemahan Koptik awal. Namun, ayat ini terdapat dalam Alexandrinus dari abad ke-5, tradisi Latin, dan mayoritas manuskrip Bizantin yang lebih kemudian. Banyak ahli menilai ayat ini sebagai tambahan penyalin yang mengulangi frasa identik dari ayat 48.
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: ulat
  rationale: Kata ini menunjuk pada ulat atau belatung yang memakan bahan membusuk. “Ulat” merupakan padanan langsung dan mempertahankan gema gambaran dalam Yesaya 66:24.
- source_word: τελευτᾷ
  choice: mati
  rationale: Dalam konteks makhluk hidup, verba ini secara alami berarti mencapai akhir hidup atau mati.
- source_word: σβέννυται
  choice: dipadamkan
  rationale: Bentuk pasif kini ini berarti dibuat padam. “Tidak dipadamkan” alami dalam bahasa Indonesia dan tetap mempertahankan bentuk pasif serta gambaran api yang terus menyala.
