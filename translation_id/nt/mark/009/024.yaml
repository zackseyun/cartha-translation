  text: ⸀εὐθὺς κράξας ὁ πατὴρ τοῦ ⸀παιδίου ἔλεγεν· ⸀Πιστεύω· βοήθει μου τῇ ἀπιστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/024.yaml
  text: Immediately the father of the child cried out and said[a], “I believe[b]; help my unbelief!”
translation:
  language: id
  text: Segera ayah anak itu berseru dan berkata, “Aku percaya; tolonglah aku dalam ketidakpercayaanku!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tolonglah aku yang kurang percaya!” Kata Yunani ἀπιστία dapat berarti ketidakpercayaan atau kekurangan iman.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: Segera
  rationale: Menandai cepatnya tanggapan sang ayah dan mempertahankan rasa mendesak yang khas dalam Injil Markus.
- source_word: κράξας
  choice: berseru
  rationale: Partisip aoris ini menggambarkan ucapan yang keras dan penuh desakan; “berseru” alami dan bermartabat dalam bahasa Indonesia.
- source_word: ὁ πατὴρ τοῦ παιδίου
  choice: ayah anak itu
  rationale: Ungkapan ini menerjemahkan konstruksi genetif secara alami. παιδίον dapat berarti anak atau anak laki-laki; “anak” tidak mempersempit maknanya tanpa perlu.
- source_word: ἔλεγεν
  choice: berkata
  rationale: Walaupun bentuk imperfek dapat menyiratkan tindakan yang sedang berlangsung, “berkata” merupakan pengantar ujaran langsung yang paling alami di sini.
- source_word: Πιστεύω
  choice: Aku percaya
  rationale: Mempertahankan hubungan langsung dengan tema percaya dan ketidakpercayaan dalam konteks serta keintiman permohonan pribadi.
- source_word: βοήθει
  choice: tolonglah
  rationale: Imperatif kini menyampaikan permohonan langsung dan mendesak. “Tolonglah” lebih idiomatis dalam seruan pribadi daripada bentuk yang lebih formal.
- source_word: μου τῇ ἀπιστίᾳ
  choice: ketidakpercayaanku
  rationale: Mempertahankan paradoks leksikal dengan πιστεύω. Bentuk ini dapat dipahami sebagai ketidakpercayaan atau kekurangan iman, tanpa mengubahnya menjadi ketidaksetiaan.
theological_decisions:
- issue: Ketegangan antara Πιστεύω dan ἀπιστίᾳ
  choice: 'Mempertahankan paradoks: “Aku percaya; tolonglah ketidakpercayaanku!”'
  alternative: “Aku percaya; tolonglah aku yang kurang percaya!” atau “Aku beriman; tolonglah kekurangan imanku!”
  rationale: Ucapan itu sengaja menyandingkan kepercayaan yang nyata dengan ketidakpercayaan yang masih tersisa. Terjemahan utama tidak menyelaraskan atau menyelesaikan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kata ganti “Aku” sesuai dengan ujaran langsung yang emosional kepada Yesus. Penanda catatan kaki ditempatkan setelah keseluruhan seruan yang dijelaskannya.
