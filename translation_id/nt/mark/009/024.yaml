  source_fidelity: 'Teks Yunani menyatakan tanggapan yang segera dan mendesak: sang ayah berseru lalu mengucapkan pengakuan percaya yang disandingkan secara sengaja dengan permohonan terkait ἀπιστία-nya. “Segera,” “berseru,” dan “Aku percaya” setia pada sumber. Namun, “tolonglah ketidakpercayaanku” dalam bahasa Indonesia cenderung terdengar seolah-olah ketidakpercayaan itu sendiri menjadi pihak yang ditolong, bukan sebagai keadaan/kekurangan yang menjadi pokok permohonan.'
