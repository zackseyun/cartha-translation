  terminology: “Percaya” dan “ketidakpercayaan” mempertahankan keterkaitan leksikal πιστεύω—ἀπιστία dan tidak menambahkan penafsiran doktrinal. Istilah “ketidakpercayaan” tetap dipakai dalam teks utama; catatan kaki menyediakan padanan yang lebih idiomatis, “kurang percaya.”
