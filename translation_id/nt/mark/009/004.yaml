  text: καὶ ὤφθη αὐτοῖς Ἠλίας σὺν Μωϋσεῖ, καὶ ἦσαν συλλαλοῦντες τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/004.yaml
  text: And Elijah appeared to them with Moses[a], and they were talking with Jesus.
translation:
  language: id
  text: Lalu Elia tampak kepada mereka bersama Musa, dan keduanya sedang berbicara[a] dengan Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sedang bercakap-cakap.”
    reason: Alternatif leksikal yang lebih eksplisit menonjolkan sifat timbal balik dari συλλαλοῦντες.
lexical_decisions:
- source_word: ὤφθη
  choice: tampak
  rationale: Bentuk pasif aoris dari ὁράω di sini secara idiomatis menyatakan bahwa Elia muncul atau menjadi terlihat. “Tampak” alami dalam bahasa Indonesia dan tidak menambahkan penjelasan tentang sifat penampakan itu.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Bentuk datif menunjukkan orang-orang yang menyaksikan penampakan tersebut; “kepada mereka” merupakan padanan langsung dan wajar.
- source_word: Ἠλίας
  choice: Elia
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: σὺν Μωϋσεῖ
  choice: bersama Musa
  rationale: σύν menyatakan penyertaan. “Bersama Musa” mempertahankan hubungan Elia dengan Musa secara jelas dan alami.
- source_word: συλλαλοῦντες
  choice: sedang berbicara
  rationale: Partisipel ini menyatakan percakapan timbal balik yang sedang berlangsung. “Sedang berbicara” jelas, alami, dan sesuai dengan konteks naratif.
- source_word: τῷ Ἰησοῦ
  choice: dengan Yesus
  rationale: Walaupun bentuknya datif, verba συλλαλέω menyiratkan percakapan dengan seseorang; “dengan Yesus” menyampaikan makna timbal balik itu secara idiomatis.
theological_decisions:
- issue: Identitas dan kenyataan Elia serta Musa dalam peristiwa transfigurasi
  choice: Ayat diterjemahkan secara langsung sebagai penampakan Elia bersama Musa yang berbicara dengan Yesus.
  alternative: Menafsirkannya secara eksplisit sebagai penampakan yang semata-mata visioner atau sebagai lambang, bukan penampakan pribadi.
  rationale: Narasi Yunani menyajikan Elia dan Musa sebagai tampak dan berbicara dengan Yesus. Terjemahan tidak memperlemah atau memperluas pernyataan itu dengan penjelasan doktrinal yang tidak dinyatakan dalam ayat.
- issue: Subjek jamak ἦσαν συλλαλοῦντες
  choice: Menambahkan “keduanya” untuk memperjelas bahwa Elia dan Musa sama-sama berbicara dengan Yesus.
  alternative: Mempertahankan subjek tersirat tanpa menyebut “keduanya”.
  rationale: Bentuk verba dan partisipel Yunani adalah jamak, merujuk kepada Elia dan Musa. “Keduanya” membuat rujukan itu jelas dalam bahasa Indonesia tanpa menambah tokoh atau tindakan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat mempertahankan urutan naratif Yunani, sedangkan “keduanya” memperjelas subjek jamak yang tersirat.
