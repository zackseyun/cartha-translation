  text: καὶ ⸂εἰσελθόντος αὐτοῦ⸃ εἰς οἶκον οἱ μαθηταὶ αὐτοῦ ⸂κατ’ ἰδίαν ἐπηρώτων αὐτόν⸃· Ὅτι ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/028.yaml
  text: And when he had entered the house[a], his disciples were asking him privately, “Why were we not able to cast it out?”
translation:
  language: id
  text: Setelah Yesus masuk ke dalam rumah, murid-murid-Nya bertanya kepada-Nya secara tersendiri, “Mengapa kami tidak dapat mengusirnya?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pronomina Yunani berbentuk netral, sehingga lebih wajar merujuk kepada roh itu. Namun, “-nya” juga dapat dipahami merujuk kepada anak laki-laki tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: Setelah Yesus masuk
  rationale: Genitivus absolutus dengan partisip aoris memberi latar waktu yang mendahului kata kerja utama. Nama “Yesus” digunakan untuk memperjelas rujukan pronomina secara alami dalam bahasa Indonesia tanpa mengubah makna.
- source_word: εἰς οἶκον
  choice: ke dalam rumah
  rationale: Ungkapan ini menyatakan gerak memasuki sebuah rumah; “rumah” tanpa penanda takrif tetap alami dalam bahasa Indonesia dan tidak memaksakan apakah rumah itu sudah dikenal.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: murid-murid-Nya
  rationale: “Murid” merupakan padanan baku yang mempertahankan hubungan belajar dan mengikuti seorang guru.
- source_word: κατ’ ἰδίαν
  choice: secara pribadi
  rationale: Menunjukkan bahwa pertanyaan diajukan terpisah dari orang lain; padanan ini ringkas dan alami.
- source_word: ἐπηρώτων
  choice: bertanya
  rationale: Imperfek Yunani menggambarkan tindakan yang sedang berlangsung, tetapi dalam narasi Indonesia bentuk sederhana “bertanya” lebih alami dan tidak menambahkan gagasan pengulangan yang belum tentu dimaksudkan.
- source_word: Ὅτι
  choice: Mengapa
  rationale: Dalam pertanyaan ini, ὅτι berfungsi idiomatis untuk menanyakan alasan.
- source_word: οὐκ ἠδυνήθημεν
  choice: kami tidak dapat
  rationale: Menyatakan ketidakmampuan atau ketidaksanggupan secara langsung dan wajar dalam bahasa Indonesia.
- source_word: ἐκβαλεῖν
  choice: mengusir
  rationale: Dalam konteks pengusiran roh, “mengusir” adalah padanan Indonesia yang lazim dan tepat bagi ἐκβάλλω.
- source_word: αὐτό
  choice: -nya
  rationale: Pronomina Yunani berbentuk netral tunggal dan paling alami merujuk kepada roh itu. Klitika Indonesia “-nya” tidak menandai gender, sehingga ambiguitas rujukan dalam terjemahan perlu dijelaskan dalam catatan.
theological_decisions:
- issue: Rujukan pronomina terakhir αὐτό
  choice: Dipahami terutama sebagai roh yang hendak diusir, diterjemahkan dengan “-nya.”
  alternative: Pronomina itu dapat dipahami merujuk kepada anak laki-laki tersebut.
  rationale: Bentuk netral αὐτό lebih wajar merujuk kepada roh, bukan kepada anak laki-laki yang berjenis gramatikal maskulin. Namun, karena pronomina Indonesia tidak membedakan gender dan konteks memungkinkan pembaca mengaitkannya dengan anak itu, catatan mempertahankan alternatif tersebut tanpa menetapkan klaim teologis tambahan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum. Kapitalisasi “-Nya” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Yesus, sedangkan “-nya” pada objek pengusiran dibiarkan huruf kecil.
