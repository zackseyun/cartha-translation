id: MRK.9.23
reference: Mark 9:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τὸ Εἰ ⸀δύνῃ, πάντα δυνατὰ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/023.yaml
  text: But Jesus said to him[b][a], “ ‘If you can’? All things are possible for the one who believes.”
translation:
  language: id
  text: Namun, Yesus berkata kepadanya, “ ‘Kalau Engkau sanggup’?[a] Segala sesuatu mungkin bagi orang yang percaya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Perkataan ‘kalau Engkau sanggup’ itu?” Yesus mengulangi sekaligus menantang kata-kata ayah tersebut dari ayat sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “orang yang percaya” juga dapat diterjemahkan “orang yang beriman” atau “orang yang menaruh kepercayaan.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τὸ Εἰ δύνῃ
  choice: ‘Kalau Engkau sanggup’?
  rationale: Artikel netral Τὸ menandai pengulangan tajam atas ucapan ayah itu pada ayat sebelumnya. Bentuk kutipan berupa pertanyaan mempertahankan nada Yesus yang menyoroti dan menantang kata-kata tersebut secara wajar dalam bahasa Indonesia.
- source_word: δύνῃ
  choice: Engkau sanggup
  rationale: δύναμαι berarti ‘mampu’ atau ‘sanggup’. Dalam sapaan langsung kepada Yesus, ‘Engkau sanggup’ alami dan mempertahankan acuannya.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Bentuk jamak netral ini mencakup segala hal dan tetap mempertahankan bobot retoris pernyataan Yunani.
- source_word: δυνατὰ
  choice: mungkin
  rationale: Dalam konstruksi predikatif ini, δυνατός menyatakan bahwa sesuatu mungkin atau dapat terjadi; ‘mungkin’ ringkas dan idiomatis.
- source_word: τῷ πιστεύοντι
  choice: bagi orang yang percaya
  rationale: Partisipel kini menunjuk secara umum kepada orang yang percaya. ‘Bagi’ menyampaikan hubungan datif dengan kemungkinan secara alami tanpa mengubahnya menjadi sebutan tetap seperti ‘orang percaya’.
- source_word: πιστεύοντι
  choice: percaya
  rationale: πιστεύω paling langsung diterjemahkan ‘percaya’; nuansa ‘beriman’ atau ‘menaruh kepercayaan’ tetap mungkin, tetapi tidak perlu dipaksakan dalam teks utama.
theological_decisions:
- issue: Cakupan ‘segala sesuatu mungkin’
  choice: Pernyataan yang terdengar mutlak dipertahankan tanpa penjelas tambahan dalam teks utama.
  alternative: ‘Segala sesuatu mungkin bersama Allah bagi orang yang percaya’ atau pembatasan eksplisit pada kuasa dan kehendak Allah.
  rationale: Teks Yunani tidak secara eksplisit menambahkan ‘bersama Allah’ di ayat ini. Penambahan itu akan meredakan ketegangan teologis dan mengurangi daya retoris ucapan Yesus.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. ‘Namun’ menandai tanggapan yang kontras; ‘Engkau’ dipakai dalam kutipan ayah yang ditujukan kepada Yesus. Tanda catatan ditempatkan langsung setelah unsur yang dijelaskannya.
