  text: ὅπου ὁ σκώληξ αὐτῶν οὐ τελευτᾷ καὶ τὸ πῦρ οὐ σβέννυται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/048.yaml
  text: where their worm does not die[b][a], and the fire is not quenched.
translation:
  language: id
  text: di mana ulat mereka tidak mati,[a][b] dan api tidak dipadamkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di mana belatung mereka tidak berakhir, dan api tidak dipadamkan.”'
    reason: lexical_alternative
  - marker: b
    text: Kalimat ini menggemakan Yesaya 66:24.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: di mana
  rationale: Kata keterangan relatif ini memperkenalkan tempat atau keadaan yang digambarkan; “di mana” alami dan tetap dekat dengan bentuk Yunani.
- source_word: ὁ σκώληξ αὐτῶν
  choice: ulat mereka
  rationale: “Ulat” mempertahankan gambaran konkret σκώληξ dan kaitannya dengan Yesaya 66:24 tanpa mempersempitnya secara berlebihan menjadi jenis larva tertentu. Bentuk posesif “mereka” mencerminkan αὐτῶν.
- source_word: οὐ τελευτᾷ
  choice: tidak mati
  rationale: Walaupun τελευτάω dapat berarti “berakhir”, dengan ulat sebagai subjek, “tidak mati” merupakan ungkapan Indonesia yang wajar, tajam, dan sesuai dengan gema Yesaya.
- source_word: τὸ πῦρ
  choice: api
  rationale: Padanan langsung dan alami yang mempertahankan gambaran konkret teks.
- source_word: οὐ σβέννυται
  choice: tidak dipadamkan
  rationale: Bentuk pasif kini dipertahankan dan menyatakan api yang terus tidak dibuat padam; ungkapan ini juga mempertahankan gema Yesaya tanpa menambahkan pelaku.
theological_decisions:
- issue: Sifat gambaran penghakiman
  choice: Mempertahankan gambaran konkret tentang ulat dan api tanpa menafsirkannya dalam terjemahan sebagai kebinasaan, siksaan sadar yang berlangsung terus, atau metafora semata.
  alternative: Menjelaskannya sebagai hukuman sadar yang terus berlangsung; sebagai kehancuran yang tidak dapat dibatalkan; atau terutama sebagai gambaran metaforis tentang aib dan kenajisan.
  rationale: Ayat ini menyajikan gambaran penghakiman yang tajam dan menggemakan Yesaya 66:24, tetapi tidak dengan sendirinya menyelesaikan perdebatan doktrinal yang lebih luas. Terjemahan karena itu mempertahankan ketegangan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas dan bermartabat. “Ulat” dipilih sebagai istilah umum yang mudah dipahami; “dipadamkan” mempertahankan bentuk pasif sumber. Urutan penanda catatan kaki dinormalkan menjadi [a][b].
