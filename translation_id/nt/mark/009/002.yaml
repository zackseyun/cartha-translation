  terminology: Nama-nama dan pronomina penghormatan sudah tepat. “Berubah rupa” adalah padanan Indonesia yang wajar untuk μετεμορφώθη serta tidak menambahkan penjelasan kristologis. Istilah teknis “ditransfigurasikan” tidak diperlukan sebagai alternatif karena kurang alami dalam bahasa Indonesia modern.
