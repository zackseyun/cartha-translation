source:
  edition: SBLGNT
  text: Καὶ μετὰ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ τὸν Ἰάκωβον ⸀καὶ Ἰωάννην, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν μόνους. καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/002.yaml
  text: And after six days[a], Jesus takes Peter and James and John, and brings them up onto a high mountain by themselves. And he was transfigured before them[c][b],
translation:
  language: id
  text: Enam hari kemudian[a], Yesus mengajak Petrus, Yakobus, dan Yohanes, lalu membawa mereka naik ke sebuah gunung yang tinggi secara tersendiri, hanya mereka saja.[b] Di hadapan mereka, Ia berubah rupa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Setelah enam hari.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “secara tersendiri, hanya mereka.” Bahasa Yunani memakai dua ungkapan yang menekankan bahwa Yesus membawa ketiga murid itu terpisah dari orang lain.'
    reason: lexical_alternative
  - marker: c
    text: 'Dapat juga diterjemahkan: “Ia mengalami perubahan rupa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ἡμέρας ἓξ
  choice: Enam hari kemudian
  rationale: Ungkapan μετά dengan akusatif menunjukkan urutan waktu. Bentuk ini alami dalam bahasa Indonesia dan tetap menyatakan selang enam hari.
- source_word: παραλαμβάνει
  choice: mengajak
  rationale: Dalam konteks membawa orang serta, παραλαμβάνω berarti mengajak atau membawa bersama. 'Mengajak' paling alami karena ketiga murid itu menyertai Yesus.
- source_word: ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν
  choice: membawa mereka naik ke sebuah gunung yang tinggi
  rationale: ἀναφέρει menyatakan gerak membawa ke atas, sedangkan εἰς menunjukkan tujuan. Terjemahan ini mempertahankan unsur pendakian tanpa menentukan gunung tertentu.
- source_word: κατ’ ἰδίαν μόνους
  choice: Hanya mereka saja yang bersama-Nya
  rationale: Dua ungkapan Yunani menekankan keterpisahan dan bahwa Yesus hanya membawa ketiga murid tersebut. Kalimat tersendiri menyampaikan penekanan itu secara alami dalam bahasa Indonesia.
- source_word: μετεμορφώθη
  choice: rupa-Nya berubah
  rationale: Bentuk pasif ini menyatakan perubahan yang tampak pada Yesus. 'Rupa-Nya berubah' alami dan dapat dipahami pembaca umum tanpa menjelaskan hakikat perubahan melampaui teks.
- source_word: ἔμπροσθεν αὐτῶν
  choice: Di hadapan mereka
  rationale: Ungkapan ini menunjukkan bahwa perubahan tersebut terjadi dalam kehadiran dan penglihatan ketiga murid.
theological_decisions:
- issue: Makna μετεμορφώθη dalam konteks kristologis
  choice: rupa-Nya berubah
  alternative: Ia ditransfigurasikan; Ia berubah rupa
  rationale: Pilihan ini mempertahankan kenyataan perubahan yang terlihat tanpa menentukan mekanisme atau hakikat metafisisnya. Istilah teknis 'ditransfigurasikan' kurang mudah dipahami dalam bahasa Indonesia umum, sedangkan 'berubah rupa' tetap dekat dengan makna leksikal.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kala kini historis Yunani dialihkan menjadi bentuk naratif Indonesia tanpa penanda kala khusus. Pronomina penghormatan -Nya dipakai untuk Yesus sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
