  text: καὶ ἐπηρώτησεν ⸀αὐτούς· Τί συζητεῖτε πρὸς ⸀αὑτούς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/016.yaml
  text: And he asked them[a], “What are you discussing with one another?”
translation:
  language: id
  text: Lalu Dia bertanya kepada mereka, “Apa yang kalian perbincangkan di antara kalian?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apa yang kalian perdebatkan di antara kalian?” Kata kerja Yunaninya dapat mengacu pada pembicaraan, perdebatan, atau perselisihan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Dalam alur narasi, καί menghubungkan tindakan ini dengan peristiwa sebelumnya. “Lalu” merupakan penghubung naratif yang alami dalam bahasa Indonesia tanpa menambahkan hubungan sebab-akibat.
- source_word: ἐπηρώτησεν
  choice: bertanya kepada
  rationale: Bentuk aoris ἐπερωτάω memperkenalkan ucapan langsung dan paling wajar diterjemahkan “bertanya kepada” dalam bahasa Indonesia modern.
- source_word: αὐτούς
  choice: mereka
  rationale: Pronomina jamak Yunani tidak menyebut kelompok tertentu dalam ayat ini; “mereka” mempertahankan ketidakspesifikan tersebut.
- source_word: Τί
  choice: Apa
  rationale: τί menanyakan isi atau pokok pembicaraan, bukan terutama alasannya.
- source_word: συζητεῖτε
  choice: sedang kalian bicarakan
  rationale: συζητέω dapat berarti membicarakan, memperdebatkan, atau berselisih mengenai sesuatu. Terjemahan utama memakai ungkapan netral dan alami, sedangkan kemungkinan nuansa perdebatan dicatat dalam catatan kaki.
- source_word: πρὸς αὑτούς
  choice: satu sama lain
  rationale: Frasa ini menyatakan interaksi timbal balik di antara orang-orang yang ditanya; “satu sama lain” menyampaikan makna resiprokal secara idiomatis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Kalian” dipakai karena sapaan dalam bahasa Yunani berbentuk jamak. Huruf kapital pada “Dia” mengikuti konvensi penghormatan yang lazim bagi Yesus dalam penerbitan Alkitab bahasa Indonesia.
