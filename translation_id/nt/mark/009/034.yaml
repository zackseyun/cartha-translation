base_translation:
  language: en
  yaml_path: translation/nt/mark/009/034.yaml
  text: But they kept silent[a], because on the road they had argued with one another about who was greater.
translation:
  language: id
  text: Namun, mereka tetap diam, sebab di jalan mereka telah berdebat satu sama lain tentang siapa yang lebih besar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “siapa yang paling besar.” Banyak terjemahan memakai bentuk superlatif secara idiomatis, tetapi kata sifat Yunani yang digunakan berbentuk komparatif: “lebih besar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπων
  choice: tetap diam
  rationale: Bentuk imperfek menggambarkan sikap diam yang berlangsung sebagai tanggapan atas pertanyaan Yesus; “tetap diam” menyampaikan aspek berkelanjutan itu secara alami.
- source_word: διελέχθησαν
  choice: telah berdebat
  rationale: Dalam konteks persaingan mengenai kedudukan, kata ini lebih tepat diterjemahkan “berdebat” daripada “berdiskusi”; “telah” menandai bahwa perdebatan itu mendahului sikap diam mereka.
- source_word: πρὸς ἀλλήλους
  choice: satu sama lain
  rationale: Ungkapan ini menunjukkan tindakan timbal balik di antara para murid.
- source_word: ἐν τῇ ὁδῷ
  choice: di jalan
  rationale: Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan latar perjalanan.
- source_word: τίς μείζων
  choice: siapa yang lebih besar
  rationale: Bentuk μείζων adalah komparatif, sehingga “lebih besar” mempertahankan bentuk dan ketegangan makna teks Yunani tanpa mengubahnya menjadi superlatif.
- source_word: οἱ δὲ
  choice: Namun, mereka
  rationale: δέ menandai kontras ringan antara pertanyaan Yesus sebelumnya dan tanggapan para murid.
- source_word: γὰρ
  choice: sebab
  rationale: γάρ memberikan alasan mereka tetap diam; “sebab” menyatakan hubungan kausal dengan jelas dan bermartabat.
theological_decisions:
- issue: Komparatif μείζων versus ungkapan superlatif idiomatis
  choice: siapa yang lebih besar
  alternative: siapa yang paling besar
  rationale: Teks Yunani memakai bentuk komparatif. Terjemahan mempertahankan “lebih besar,” sementara kemungkinan pemahaman idiomatis sebagai superlatif dicatat tanpa dipaksakan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang alami dan bermartabat. “Namun” menyampaikan kontras secara lancar, sedangkan “tetap diam” mempertahankan aspek imperfek. Penanda catatan kaki ditempatkan setelah klausa yang dijelaskannya.
