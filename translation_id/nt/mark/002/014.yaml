base_translation:
  language: en
  yaml_path: translation/nt/mark/002/014.yaml
  text: And as he was passing by[a], he saw Levi the son of Alphaeus sitting at the tax booth, and he says to him, “Follow me.” And he rose and followed him.
translation:
  language: id
  text: Ketika Yesus sedang lewat, Ia melihat Lewi, anak Alfeus, sedang duduk di tempat pemungutan pajak[a]. Yesus berkata kepadanya, “Ikutlah Aku.” Lalu Lewi bangkit dan mengikuti-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tempat pemungutan bea.” Istilah Yunani ini dapat menunjuk pada tempat pajak, bea, atau pungutan dikumpulkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων
  choice: ketika sedang lewat
  rationale: Partisipel kini ini menggambarkan tindakan yang sedang berlangsung ketika Yesus melihat Lewi. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan hubungan waktunya.
- source_word: εἶδεν
  choice: melihat
  rationale: Padanan langsung yang tidak menambahkan nuansa seperti ‘memperhatikan’ atau ‘menyadari’.
- source_word: Λευὶν
  choice: Lewi
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: τὸν τοῦ Ἁλφαίου
  choice: anak Alfeus
  rationale: Konstruksi genetif menunjukkan hubungan keturunan; bahasa Indonesia secara alami melengkapinya dengan ‘anak’.
- source_word: καθήμενον
  choice: duduk
  rationale: Menggambarkan posisi Lewi saat Yesus melihatnya secara langsung dan alami.
- source_word: ἐπὶ τὸ τελώνιον
  choice: di tempat pemungutan pajak
  rationale: τελώνιον menunjuk pada tempat pajak, bea, atau pungutan dikumpulkan. Pilihan ini cukup luas dan mudah dipahami tanpa membatasinya pada gerbang tol modern.
- source_word: λέγει
  choice: berkata
  rationale: Bahasa Indonesia tidak menandai kala pada verba, sehingga ‘berkata’ dapat menyampaikan bentuk kini historis Yunani dengan wajar tanpa memaksakan perbedaan kala yang tidak tersedia secara gramatikal.
- source_word: Ἀκολούθει μοι
  choice: Ikutlah Aku
  rationale: Imperatif ini menyatakan panggilan langsung untuk mengikuti Yesus. Partikel ‘-lah’ memberi bentuk perintah yang alami dan tegas tanpa menambahkan kata yang tidak ada dalam sumber.
- source_word: ἀναστὰς
  choice: bangkit
  rationale: 'Menjaga urutan tindakan: Lewi terlebih dahulu bangkit, lalu mengikuti Yesus. ‘Bangkit’ ringkas dan bermartabat.'
- source_word: ἠκολούθησεν αὐτῷ
  choice: mengikuti-Nya
  rationale: Mempertahankan kaitan verbal dengan perintah ‘Ikutlah Aku’ dan menyatakan tanggapan langsung Lewi. Kapitalisasi pronomina mengikuti konvensi penghormatan yang umum dalam terjemahan Alkitab bahasa Indonesia.
theological_decisions:
- issue: Bentuk kini historis dalam narasi Markus
  choice: Menerjemahkan λέγει dengan ‘berkata’ tanpa penanda waktu tambahan.
  alternative: Menambahkan bentuk seperti ‘lalu berkatalah Yesus’ untuk menonjolkan peralihan naratif.
  rationale: Verba bahasa Indonesia tidak membedakan kala kini dan lampau. Bentuk sederhana mempertahankan kelancaran dan daya hidup narasi tanpa menciptakan kontras waktu yang tidak alami.
- issue: Cakupan panggilan Ἀκολούθει μοι
  choice: Ikutlah Aku
  alternative: Jadilah pengikut-Ku
  rationale: Pilihan langsung mempertahankan tindakan konkret sekaligus kemungkinan makna kemuridan, tanpa mempersempitnya menjadi rumusan teologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama pelaku diulang untuk menghindari ketidakjelasan rujukan pronomina yang mudah timbul dalam bahasa Indonesia. Ungkapan ‘tempat pemungutan pajak’ dipilih agar tidak menimbulkan gambaran khusus tentang gerbang tol modern.
