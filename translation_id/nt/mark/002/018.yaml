  naturalness: Teks revisi tetap memakai bahasa Indonesia modern dan baku. «Kemudian mereka datang dan berkata kepada-Nya» adalah alur naratif yang wajar, sementara catatan kaki menjelaskan ambiguitas subjek secara memadai.
