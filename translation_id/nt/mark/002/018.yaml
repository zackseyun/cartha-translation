id: MRK.2.18
reference: Mark 2:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἦσαν οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀Φαρισαῖοι νηστεύοντες. καὶ ἔρχονται καὶ λέγουσιν αὐτῷ· Διὰ τί οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀μαθηταὶ τῶν Φαρισαίων νηστεύουσιν, οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/018.yaml
  text: John's disciples and the Pharisees were fasting. And they come and say to him[a], "Why do John's disciples and the disciples of the Pharisees fast, but your disciples do not fast?"
translation:
  language: id
  text: Murid-murid Yohanes dan orang-orang Farisi sedang berpuasa. Kemudian mereka datang dan berkata kepada-Nya[a], “Mengapa murid-murid Yohanes dan murid-murid orang Farisi berpuasa, tetapi murid-murid-Mu tidak berpuasa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “datang dan berkata kepada-Nya.” Bahasa Yunani tidak menyatakan siapa yang datang dan berkata itu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν ... νηστεύοντες
  choice: sedang berpuasa
  rationale: Konstruksi perifrastis dengan bentuk imperfek εἰμί dan partisipel kini menyatakan tindakan yang sedang berlangsung pada waktu lampau; ‘sedang berpuasa’ menyampaikan aspek itu secara alami.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: murid-murid Yohanes
  rationale: Genitif menyatakan hubungan atau keterikatan; bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: οἱ Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Sebutan baku dalam bahasa Indonesia untuk kelompok Yahudi tersebut.
- source_word: ἔρχονται καὶ λέγουσιν
  choice: Lalu datanglah beberapa orang dan berkata
  rationale: Kata kerja kini historis khas narasi Markus dialihkan ke bentuk lampau naratif yang alami dalam bahasa Indonesia. Subjek tidak dinyatakan dalam bahasa Yunani, sehingga ‘beberapa orang’ bersifat generik dan tidak mengidentifikasi kelompok tertentu.
- source_word: αὐτῷ
  choice: kepada Yesus
  rationale: Pronomina merujuk kepada Yesus dalam konteks. Nama dipakai agar rujukannya jelas dan alami bagi pembaca Indonesia.
- source_word: Διὰ τί
  choice: Mengapa
  rationale: Padanan interogatif yang ringkas, alami, dan tepat.
- source_word: οἱ μαθηταὶ τῶν Φαρισαίων
  choice: murid-murid orang Farisi
  rationale: Mempertahankan hubungan genitif tanpa menyiratkan bahwa hanya satu orang Farisi yang dimaksud.
- source_word: νηστεύουσιν
  choice: berpuasa
  rationale: Bentuk kini dalam pertanyaan dapat menyatakan kebiasaan atau praktik; bentuk Indonesia ini tetap wajar dan tidak membatasi tindakan pada saat itu saja.
- source_word: οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν
  choice: tetapi murid-murid-Mu tidak
  rationale: δέ menyatakan pertentangan, sedangkan bentuk posesif diterjemahkan dengan enklitik hormat ‘-Mu’. Kata ‘berpuasa’ dapat dilesapkan secara alami karena sudah jelas dari paralel sebelumnya.
theological_decisions:
- issue: Identitas subjek dalam ἔρχονται καὶ λέγουσιν αὐτῷ
  choice: Menggunakan subjek generik ‘beberapa orang’ dan memberi catatan bahwa bahasa Yunani tidak menyatakannya.
  alternative: Memakai ‘mereka’ atau secara khusus mengidentifikasi murid-murid Yohanes dan orang-orang Farisi sebagai para penanya.
  rationale: Bahasa Yunani tidak menyatakan subjek kedua kata kerja tersebut. Terjemahan tidak boleh menetapkan kelompok tertentu yang tidak disebutkan oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan mudah dipahami, dengan nada naratif yang bermartabat. Bentuk ‘datanglah’ membantu alur narasi; kapitalisasi ‘-Mu’ mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk sapaan kepada Yesus. Penanda catatan kaki [a] ditempatkan sesudah nama Yesus.
