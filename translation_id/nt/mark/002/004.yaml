  yaml_path: translation/nt/mark/002/004.yaml
  text: And not being able to bring him to him because of the crowd[a], they removed the roof where he was, and after digging through it[c][b], they lower the mat on which the paralyzed man was lying.
translation:
  language: id
  text: Karena tidak dapat membawanya kepada Yesus akibat kerumunan orang,[a] mereka membuka atap di tempat Yesus berada. Setelah menggali lubang pada atap itu, mereka menurunkan tikar[b] tempat orang lumpuh itu[c] terbaring.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “membawanya kepada-Nya”; “-nya” yang pertama menunjuk kepada orang lumpuh itu, sedangkan yang kedua menunjuk kepada Yesus.
    reason: lexical_alternative
  - marker: b
    text: Atau “alas tidur sederhana” atau “tilam.” Kata Yunani ini menunjuk pada alas yang ringan dan dapat dibawa.
    reason: lexical_alternative
  - marker: c
    text: 'Yunani: “orang lumpuh itu” (secara harfiah, “si lumpuh”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δυνάμενοι
  choice: Karena tidak dapat
  rationale: Partisipel ini menyatakan keadaan yang menjadi alasan bagi tindakan berikutnya. Bentuk kausal ini wajar dalam bahasa Indonesia tanpa mengembangkan maknanya secara berlebihan.
- source_word: προσενέγκαι αὐτῷ
  choice: membawanya kepada Yesus
  rationale: 'Teks Yunani memuat dua pronomina dengan rujukan berbeda: orang lumpuh sebagai objek yang dibawa dan Yesus sebagai tujuan. Nama Yesus digunakan untuk mencegah pengulangan pronomina yang kabur dalam bahasa Indonesia.'
- source_word: διὰ τὸν ὄχλον
  choice: akibat kerumunan orang
  rationale: Menyampaikan fungsi kausal διά dengan akusatif dan makna ὄχλος secara jelas serta alami.
- source_word: ἀπεστέγασαν τὴν στέγην
  choice: mereka membuka atap
  rationale: Ungkapan ini menyatakan bahwa penutup atap disingkirkan. 'Membuka atap' alami dan tidak menyiratkan bahwa seluruh struktur atap diangkat.
- source_word: ὅπου ἦν
  choice: tepat di atas tempat Yesus berada
  rationale: Teks secara harfiah berbunyi 'di tempat ia berada'; hubungan vertikal tersirat oleh konteks atap. 'Di atas' membuat hubungan ruang itu jelas tanpa menambah detail bahan atau bangunan.
- source_word: ἐξορύξαντες
  choice: Setelah membongkar atap itu
  rationale: Kata kerja ini secara harfiah berkaitan dengan menggali atau membuat lubang. Dalam konteks atap, 'membongkar' menyampaikan tindakan menembus bahan atap secara alami tanpa menentukan bahannya.
- source_word: χαλῶσι
  choice: mereka menurunkan
  rationale: Menunjukkan gerakan tikar dari atap ke ruang di bawah. Kala kini historis Yunani tidak memerlukan penanda kala khusus dalam bahasa Indonesia.
- source_word: κράβαττον
  choice: tikar
  rationale: Merujuk pada alas tidur sederhana atau usungan ringan, bukan tempat tidur besar. 'Tikar' jelas, ringkas, dan sesuai dengan benda yang dapat dibawa serta diturunkan.
- source_word: ὅπου ὁ παραλυτικὸς κατέκειτο
  choice: tempat orang lumpuh itu terbaring
  rationale: Klausa relatif menerangkan tikar sebagai alas tempat orang tersebut berbaring. 'Orang lumpuh' merupakan ungkapan Indonesia modern yang lebih alami daripada istilah nominal teknis.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama Yesus dipakai untuk memperjelas dua rujukan pronominal Yunani. Susunan dua tindakan pada atap dipertahankan: mula-mula penutup atap dibuka, kemudian bahan atap dibongkar hingga terbentuk jalan untuk menurunkan tikar.'
