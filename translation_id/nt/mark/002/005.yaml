id: MRK.2.5
reference: Mark 2:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂καὶ ἰδὼν⸃ ὁ Ἰησοῦς τὴν πίστιν αὐτῶν λέγει τῷ παραλυτικῷ· Τέκνον, ⸂ἀφίενταί σου⸃ αἱ ⸀ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/005.yaml
  text: And Jesus[a], seeing their faith, says to the paralyzed man, “Child, your sins are forgiven.”
translation:
  language: id
  text: Ketika melihat iman mereka, Yesus berkata kepada orang lumpuh itu, “Nak[a], dosa-dosamu diampuni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Anak”; kata Yunani τέκνον merupakan sapaan yang lembut kepada seorang anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: ketika melihat
  rationale: Partisip aoristus dari ὁράω menyatakan keadaan yang berkaitan dengan verba utama. Bentuk ini mempertahankan hubungan tersebut dan terdengar alami dalam narasi bahasa Indonesia.
- source_word: πίστιν
  choice: iman
  rationale: Dalam konteks ini πίστις menunjuk pada kepercayaan yang tampak melalui tindakan kelompok itu ketika membawa orang lumpuh tersebut kepada Yesus.
- source_word: αὐτῶν
  choice: mereka
  rationale: Pronomina genitif jamak ini menerangkan iman yang dimiliki kelompok yang membawa orang lumpuh itu; teks tidak merinci apakah orang lumpuh tersebut termasuk di dalam cakupan 'mereka'.
- source_word: λέγει
  choice: berkata
  rationale: Walaupun bentuk Yunaninya adalah present historis, bentuk lampau yang tidak bertanda waktu secara morfologis dalam bahasa Indonesia menghasilkan narasi yang wajar tanpa mengubah peristiwa tutur.
- source_word: παραλυτικῷ
  choice: orang lumpuh itu
  rationale: Adjektiva yang dipakai secara substantival ini menunjuk kepada seorang yang lumpuh. Ungkapan ini alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: Τέκνον
  choice: Nak
  rationale: Sapaan 'Nak' menyampaikan kelembutan dan kedekatan sapaan τέκνον secara alami, tanpa mewajibkan nuansa laki-laki yang tidak dinyatakan oleh kata Yunani tersebut.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: dosa-dosamu diampuni
  rationale: Susunan ini mempertahankan bentuk pasif dan pernyataan langsung tentang pengampunan, tanpa menambahkan pelaku atau menentukan aspek waktu secara lebih sempit daripada teks Yunani.
- source_word: ἁμαρτίαι
  choice: dosa-dosa
  rationale: Padanan baku bagi bentuk jamak ἁμαρτίαι; pengulangan nomina mempertahankan makna jamaknya.
theological_decisions:
- issue: Sifat pernyataan Yesus mengenai pengampunan
  choice: dosa-dosamu diampuni
  alternative: dosa-dosamu telah diampuni; dosa-dosamu sedang diampuni
  rationale: Bentuk pasif present menyatakan pengampunan sebagai kenyataan dalam sapaan Yesus. Terjemahan mempertahankan daya deklaratif serta pelaku ilahi yang tersirat tanpa menetapkan mekanisme atau urutan waktunya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Sapaan “Nak” memberi kehangatan yang terdapat dalam teks sumber, sedangkan bentuk pasif “diampuni” mempertahankan ambiguitas mengenai pelaku dan aspek waktunya.
