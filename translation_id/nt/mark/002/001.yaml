source:
  edition: SBLGNT
  text: Καὶ ⸀εἰσελθὼν πάλιν εἰς Καφαρναοὺμ δι’ ⸀ἡμερῶν ἠκούσθη ὅτι ⸂ἐν οἴκῳ⸃ ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/001.yaml
  text: And when he entered Capernaum again after some days[a], it was heard that he was at home.
translation:
  language: id
  text: Beberapa hari kemudian, Yesus masuk lagi ke Kapernaum. Terdengarlah kabar bahwa Ia berada di rumah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: di dalam sebuah rumah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: masuk
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului berita utama; susunan dua kalimat dengan keterangan waktu menyampaikan urutan itu secara alami dalam bahasa Indonesia.
- source_word: πάλιν
  choice: lagi
  rationale: Menyatakan bahwa Yesus kembali memasuki Kapernaum; 'lagi' merupakan padanan ringkas dan wajar.
- source_word: Καφαρναούμ
  choice: Kapernaum
  rationale: Mengikuti bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia.
- source_word: δι’ ἡμερῶν
  choice: beberapa hari kemudian
  rationale: Ungkapan ini menunjukkan selang waktu yang tidak ditentukan; padanan tersebut alami dan tidak menentukan jumlah harinya.
- source_word: ἠκούσθη
  choice: Terdengarlah kabar
  rationale: Mempertahankan corak pasif-tak berpelaku dari formula laporan Yunani sambil menghasilkan ungkapan Indonesia yang jelas dan idiomatis.
- source_word: ἐν οἴκῳ
  choice: di rumah
  rationale: Dapat berarti berada di rumah atau di dalam sebuah rumah. 'Di rumah' alami dalam konteks, sedangkan kemungkinan yang lebih umum dipertahankan dalam catatan kaki.
- source_word: ἐστίν
  choice: berada
  rationale: Bahasa Indonesia tidak menuntut pergeseran kala; 'berada' menyatakan lokasi tanpa menambahkan nuansa yang tidak ada dalam teks.
theological_decisions:
- issue: Apakah ἐν οἴκῳ menunjuk rumah yang dianggap sebagai tempat tinggal Yesus atau sekadar sebuah rumah.
  choice: di rumah
  alternative: di dalam sebuah rumah
  rationale: Konteks memungkinkan arti idiomatis 'di rumah', tetapi teks Yunani tidak memastikan kepemilikan atau identitas rumah tersebut. Catatan kaki mempertahankan ketidakpastian itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama 'Yesus' dinyatakan untuk memperjelas subjek tersirat bahasa Yunani; pemecahan menjadi dua kalimat menghindari struktur yang kaku tanpa mengubah urutan peristiwa.
