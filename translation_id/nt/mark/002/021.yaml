  register: Bahasa Indonesia baku modern dengan susunan yang lugas dan bermartabat. 'Secarik kain' menghidupkan gambaran konkret, sedangkan 'belum susut' mudah dipahami pembaca umum. Struktur Yunani yang sukar pada klausa akhir dijelaskan secukupnya dalam teks dan bentuk harfiahnya dipertahankan dalam catatan kaki.
