  terminology: “Tambalan,” “kain yang belum disusutkan,” “pakaian tua,” dan “sobekan” mencerminkan istilah Yunani dalam konteks perbaikan pakaian. Catatan a mempertahankan alternatif teknis “belum dikempa,” sedangkan catatan b memberi bentuk harfiah klausa yang sukar tanpa menjadikannya terjemahan utama yang tidak jelas.
