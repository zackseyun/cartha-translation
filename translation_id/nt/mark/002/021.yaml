  text: ⸀Οὐδεὶς ἐπίβλημα ῥάκους ἀγνάφου ἐπιράπτει ἐπὶ ⸂ἱμάτιον παλαιόν⸃· εἰ δὲ μή, αἴρει τὸ πλήρωμα ⸀ἀπ’ αὐτοῦ τὸ καινὸν τοῦ παλαιοῦ, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/021.yaml
  text: No one sews a patch of unshrunk cloth onto an old garment[a]; otherwise[b], the patch pulls away from it—the new from the old—and a worse tear results.
translation:
  language: id
  text: Tidak seorang pun menjahit tambalan dari kain yang belum disusutkan pada pakaian tua[a]. Jika tidak[b], tambalan baru itu akan menarik pakaian tua itu, sehingga sobekannya menjadi lebih parah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kain yang belum dikempa.” Kata Yunani ini menggambarkan kain yang belum diolah dengan proses yang membuatnya menyusut; jika dipakai sebagai tambalan, kain itu akan menyusut.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jika tidak.” Klausa berikutnya secara harfiah berbunyi, “tambalan itu menarik dari pakaian tersebut, yang baru dari yang tua.” Maksudnya, tambalan baru menarik pakaian tua sehingga sobekannya menjadi lebih parah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίβλημα
  choice: tambalan
  rationale: Dalam konteks memperbaiki pakaian, kata ini menunjuk pada secarik kain yang dipasang untuk menutup bagian yang sobek; 'tambalan' adalah padanan Indonesia yang alami.
- source_word: ῥάκους ἀγνάφου
  choice: secarik kain yang belum susut
  rationale: ἄγναφος menggambarkan kain yang belum melalui proses penyusutan atau pengolahan akhir. Ungkapan ini menyampaikan akibat praktisnya dengan jelas tanpa memakai istilah teknis yang asing.
- source_word: ἐπιράπτει
  choice: menjahitkan ... pada
  rationale: Kata kerja ini berarti memasang dengan cara menjahit; bentuk ini konkret dan wajar dalam bahasa Indonesia.
- source_word: ἱμάτιον παλαιόν
  choice: pakaian tua
  rationale: ἱμάτιον dapat merujuk secara umum pada pakaian, terutama pakaian luar. 'Pakaian' tidak mempersempitnya menjadi jenis tertentu, sedangkan 'tua' mempertahankan kontras dengan yang baru.
- source_word: εἰ δὲ μή
  choice: Jika demikian
  rationale: Dalam konteks larangan yang baru dinyatakan, ungkapan ini memperkenalkan akibat jika tindakan tersebut tetap dilakukan. Catatan kaki mempertahankan bentuk harfiahnya.
- source_word: αἴρει
  choice: tertarik lepas
  rationale: Dalam gambaran kain yang menyusut, kata ini menyatakan bahwa tambalan menarik diri hingga terlepas dari pakaian lama; pilihan ini menyampaikan gerak dan akibatnya.
- source_word: τὸ πλήρωμα
  choice: tambalan
  rationale: Secara harfiah berarti bagian pengisi, tetapi di sini menunjuk pada kain yang mengisi atau menutup sobekan, yakni tambalan.
- source_word: τὸ καινὸν τοῦ παλαιοῦ
  choice: yang baru itu ... dari pakaian yang tua
  rationale: Terjemahan mempertahankan pertentangan eksplisit antara yang baru dan yang tua sambil memperjelas acuan masing-masing dalam bahasa Indonesia.
- source_word: χεῖρον σχίσμα γίνεται
  choice: sobekannya menjadi lebih parah
  rationale: Padanan ini alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa hasil akhirnya adalah sobekan yang lebih buruk.
