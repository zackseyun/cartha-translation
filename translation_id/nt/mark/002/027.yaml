  text: καὶ ἔλεγεν αὐτοῖς· Τὸ σάββατον διὰ τὸν ἄνθρωπον ἐγένετο ⸀καὶ οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/027.yaml
  text: And he was saying to them[a], “The Sabbath came into being for man, and not man for the Sabbath.”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Hari Sabat diadakan untuk manusia, bukan manusia untuk hari Sabat.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: berkata
  rationale: Bentuk imperfek berada dalam konteks naratif dan memperkenalkan ucapan yang berlanjut. Dalam bahasa Indonesia, “berkata” menyampaikan fungsi ini secara alami tanpa ungkapan progresif yang kaku.
- source_word: τὸ σάββατον
  choice: Hari Sabat
  rationale: Bentuk tunggal dengan artikel menunjuk pada hari atau pranata Sabat. “Hari Sabat” merupakan padanan Indonesia yang jelas dan lazim.
- source_word: διὰ τὸν ἄνθρωπον
  choice: untuk manusia
  rationale: διά dengan akusatif menyatakan tujuan atau manfaat. “Manusia” dapat dipakai secara tunggal dan representatif dalam bahasa Indonesia serta secara alami mencakup umat manusia.
- source_word: ἐγένετο
  choice: dijadikan
  rationale: γίνομαι di sini menyatakan bahwa Sabat menjadi ada atau ditetapkan. “Dijadikan” mempertahankan gagasan asal dan tujuan Sabat dengan ungkapan Indonesia yang ringkas dan wajar.
- source_word: οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον
  choice: bukan manusia untuk hari Sabat
  rationale: Susunan eliptis ini mempertahankan pertentangan dan kesejajaran retoris dengan klausa pertama; kata kerja “dijadikan” dipahami dari klausa sebelumnya.
theological_decisions:
- issue: Cakupan umum ἄνθρωπος dalam pernyataan prinsip
  choice: manusia
  alternative: umat manusia
  rationale: Kata Yunani berbentuk tunggal tetapi digunakan secara representatif untuk manusia pada umumnya. Bahasa Indonesia “manusia” mempertahankan bentuk tunggal sekaligus makna inklusif tanpa perlu mengubahnya menjadi bentuk kolektif.
- issue: Nuansa ἐγένετο tentang asal atau penetapan Sabat
  choice: dijadikan
  alternative: ada
  rationale: “Dijadikan” mempertahankan gagasan bahwa Sabat menjadi ada bagi kepentingan manusia, sedangkan “ada” lebih alami tetapi kurang jelas menyampaikan nuansa asal. Pelaku tindakan tetap tidak disebut, sebagaimana dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pengulangan “manusia” dan “hari Sabat” dipertahankan untuk menjaga kesejajaran antitetis ucapan Yesus.
