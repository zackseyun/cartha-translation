  yaml_path: translation/nt/mark/002/011.yaml
  text: I say to you[a], get up, pick up your mat[b], and go to your house.
translation:
  language: id
  text: '“Aku berkata kepadamu: Bangkitlah, angkatlah tikarmu dan pergilah ke rumahmu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σοὶ λέγω
  choice: Kepadamu Aku berkata
  rationale: Susunan ini mempertahankan penempatan Σοὶ di awal sebagai penekanan pada orang yang disapa, sekaligus menyampaikan formula perintah yang berwibawa.
- source_word: ἔγειρε
  choice: Bangunlah
  rationale: Imperatif ini secara alami menyuruh orang lumpuh itu bangkit dari tempatnya; bentuk -lah menjaga ketegasan dengan ragam yang bermartabat.
- source_word: ἆρον
  choice: angkatlah
  rationale: Kata ini menyatakan tindakan mengangkat benda yang sebelumnya terhampar dan hendak dibawa; 'angkatlah' alami dan jelas dalam bahasa Indonesia.
- source_word: κράβαττόν
  choice: tikarmu
  rationale: κράβαττος menunjuk alas tidur sederhana yang mudah dibawa, bukan ranjang besar; 'tikar' paling dekat dan mudah dipahami dalam konteks ini.
- source_word: ὕπαγε
  choice: pulanglah
  rationale: Jika digabungkan dengan tujuan εἰς τὸν οἶκόν σου, 'pulanglah' merupakan ungkapan Indonesia yang alami untuk pergi ke rumah sendiri.
- source_word: εἰς τὸν οἶκόν σου
  choice: pulanglah
  rationale: Frasa ini secara harfiah berarti 'ke rumahmu'; maknanya tercakup secara idiomatis dalam 'pulanglah' tanpa mengubah arah atau tujuan perintah.
theological_decisions:
- issue: Nada dan kekuatan perintah penyembuhan Yesus
  choice: 'Perintah langsung dan berwibawa kepada orang itu: “Kepadamu Aku berkata: Bangunlah, angkatlah tikarmu, lalu pulanglah.”'
  alternative: '“Aku berkata kepadamu: Bangunlah, angkatlah tikarmu, dan pergilah ke rumahmu.”'
  rationale: Terjemahan mempertahankan penekanan pada orang yang disapa dan rangkaian tiga perintah tanpa menambahkan penafsiran tentang cara penyembuhan itu terjadi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Kepadamu Aku berkata' agak bertanda tetapi sengaja mempertahankan penekanan awal dalam bahasa Yunani; 'lalu' menyampaikan urutan perintah secara alami. Tidak diperlukan catatan kaki karena pilihan 'tikar' dan 'pulanglah' cukup jelas serta tidak menutup ambiguitas teologis yang penting.
