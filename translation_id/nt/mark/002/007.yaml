  text: Τί οὗτος οὕτως λαλεῖ; ⸀βλασφημεῖ· τίς δύναται ἀφιέναι ἁμαρτίας εἰ μὴ εἷς ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/007.yaml
  text: Why does this man speak like this? He is blaspheming! Who can forgive sins except God alone?[a][b]
translation:
  language: id
  text: Mengapa orang ini berbicara seperti itu?[a] Dia menghujat! Siapa yang dapat mengampuni dosa selain Allah sendiri?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, susunan Yunaninya berbunyi, “Apa orang ini berbicara seperti itu?” Ini adalah ungkapan Yunani yang bermakna, “Mengapa orang ini berbicara seperti itu?”
    reason: lexical_alternative
  - marker: b
    text: Atau, “selain Allah yang esa.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: Mengapa
  rationale: Dalam susunan Τί ... λαλεῖ, kata tanya ini berfungsi menanyakan alasan atau dasar perkataan, sehingga “Mengapa” lebih wajar dan tepat daripada terjemahan kaku “Apa”.
- source_word: οὗτος
  choice: orang ini
  rationale: Ungkapan ini menunjuk kepada Yesus dengan nada berjarak. “Orang ini” mempertahankan nuansa tersebut tanpa menambahkan penghinaan yang lebih tajam daripada teks Yunani.
- source_word: οὕτως λαλεῖ
  choice: berbicara seperti itu
  rationale: Ungkapan Indonesia yang alami ini mempertahankan keberatan para ahli Taurat terhadap cara sekaligus isi perkataan Yesus.
- source_word: βλασφημεῖ
  choice: Dia menghujat!
  rationale: Bentuk kini menyatakan tuduhan langsung yang timbul dari perkataan Yesus. “Menghujat” mempertahankan bobot keagamaan tuduhan itu.
- source_word: τίς δύναται
  choice: Siapa yang dapat
  rationale: Padanan Indonesia yang alami untuk pertanyaan mengenai kemampuan atau wewenang.
- source_word: ἀφιέναι ἁμαρτίας
  choice: mengampuni dosa
  rationale: Dalam konteks ini ἀφίημι dengan ἁμαρτίας secara jelas berarti mengampuni dosa, bukan sekadar melepaskan atau membiarkannya pergi.
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: selain Allah saja
  rationale: Susunan ini menyatakan pengecualian yang eksklusif. “Selain Allah saja” alami dalam bahasa Indonesia dan tidak memaksakan salah satu cara memahami penekanan pada εἷς.
theological_decisions:
- issue: Apakah οὗτος perlu diterjemahkan dengan penghinaan yang lebih kuat
  choice: orang ini
  alternative: orang ini juga; orang semacam ini
  rationale: Sikap para ahli Taurat memang bermusuhan, tetapi terjemahan tidak boleh memperkeras nada melampaui bahasa Yunani.
- issue: Bobot tuduhan βλασφημεῖ
  choice: Dia menghujat!
  alternative: Dia sedang menghujat!; Ini penghujatan!
  rationale: Teks menyajikan penilaian teologis para ahli Taurat terhadap perkataan Yesus. Rumusan ini mempertahankan tuduhan mereka tanpa lebih dahulu menyelesaikan ketegangan kristologis dalam narasi.
- issue: Makna eksklusif εἰ μὴ εἷς ὁ θεός
  choice: selain Allah saja
  alternative: selain Allah yang esa
  rationale: Terjemahan utama menyatakan bahwa hanya Allah dapat mengampuni dosa. Alternatif mempertahankan kemungkinan bahwa εἷς menonjolkan keesaan Allah, dan dicatat tanpa menjadikannya satu-satunya penafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Orang ini” menyampaikan jarak dan keberatan tanpa menambahkan cercaan; “menghujat” mempertahankan istilah keagamaan yang umum dipahami.
