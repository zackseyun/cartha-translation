  text: ⸀καὶ συνήχθησαν πολλοὶ ὥστε μηκέτι χωρεῖν μηδὲ τὰ πρὸς τὴν θύραν, καὶ ἐλάλει αὐτοῖς τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/002.yaml
  text: And many were gathered together[a], so that there was no longer room, not even at the door, and he was speaking the word to them.
translation:
  language: id
  text: Lalu banyak orang berkumpul sehingga tidak ada lagi tempat, bahkan di dekat pintu pun tidak ada tempat. Yesus sedang menyampaikan firman[a] kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, "pesan." Yunani: "firman."'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πολλοὶ
  choice: banyak orang berkumpul
  rationale: Bentuk pasif aoristus menyatakan bahwa banyak orang telah terhimpun. Dalam bahasa Indonesia, bentuk aktif-intransitif 'berkumpul' lebih alami dan tetap menyampaikan hasil berkumpulnya orang banyak.
- source_word: ὥστε μηκέτι χωρεῖν
  choice: sehingga tidak ada lagi tempat
  rationale: ὥστε memperkenalkan akibat, sedangkan χωρεῖν dalam konteks ini berkaitan dengan kapasitas ruang. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan hubungan hasil.
- source_word: μηδὲ τὰ πρὸς τὴν θύραν
  choice: bahkan di dekat pintu pun tidak
  rationale: Frasa tersebut menunjuk pada area di sekitar atau menuju pintu. Pilihan ini menyatakan bahwa bahkan area dekat pintu sudah tidak menyediakan tempat.
- source_word: ἐλάλει
  choice: sedang menyampaikan
  rationale: Imperfek menunjukkan tindakan yang sedang berlangsung. 'Sedang menyampaikan' mempertahankan aspek duratif dan, bersama objek 'firman', terdengar lebih alami daripada 'sedang mengatakan'.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Mempertahankan rujukan pronominal kepada orang-orang yang berkumpul tanpa menambahkan identitas yang tidak dinyatakan.
- source_word: τὸν λόγον
  choice: firman
  rationale: Dalam konteks pewartaan Yesus, 'firman' merupakan padanan Indonesia yang mapan bagi λόγος dan mempertahankan bentuk ungkapan Yunani tanpa menambahkan 'Allah'. Catatan kaki memberi alternatif dinamis 'pesan'.
theological_decisions:
- issue: Makna τὸν λόγον dalam perkataan Yesus
  choice: firman
  alternative: pesan
  rationale: Teks hanya menyebut 'firman' tanpa pelengkap 'Allah'. Pilihan ini mempertahankan ungkapan sumber dan keterbukaan teologisnya, sedangkan catatan kaki menunjukkan bahwa maknanya dalam konteks dapat dipahami sebagai pesan yang disampaikan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama 'Yesus' digunakan untuk memperjelas subjek tersirat orang ketiga dari konteks dekat; struktur kalimat mempertahankan urutan peristiwa dan aspek tindakan yang sedang berlangsung.
