reference: Mark 2:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς ⸂τῶν Φαρισαίων⸃ ⸀ἰδόντες ⸂ὅτι ἐσθίει⸃ μετὰ τῶν ⸂ἁμαρτωλῶν καὶ τελωνῶν⸃ ἔλεγον τοῖς μαθηταῖς αὐτοῦ· ⸀Ὅτι μετὰ τῶν ⸂τελωνῶν καὶ ἁμαρτωλῶν⸃ ⸀ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/016.yaml
  text: And the scribes of the Pharisees[a], seeing that he was eating with sinners and tax collectors, were saying to his disciples, “Why does he eat with tax collectors and sinners?”
translation:
  language: id
  text: Ahli-ahli Taurat dari kalangan orang Farisi melihat bahwa Yesus sedang makan bersama orang-orang berdosa dan para pemungut pajak.[a] Mereka pun berkata kepada murid-murid-Nya, “Mengapa Dia makan bersama para pemungut pajak dan orang-orang berdosa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “makan dengan.” Dalam konteks ini, ungkapan tersebut menyiratkan kebersamaan dalam perjamuan atau pergaulan semeja.
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: ahli-ahli Taurat
  rationale: Dalam konteks Injil, istilah ini menunjuk kepada para ahli teks dan hukum Taurat. Pilihan ini lebih jelas bagi pembaca Indonesia modern daripada serapan atau istilah historis yang kurang transparan.
- source_word: τῶν Φαρισαίων
  choice: dari kalangan orang Farisi
  rationale: Genitif ini menyatakan hubungan atau afiliasi dengan kelompok Farisi tanpa memastikan secara berlebihan apakah setiap ahli Taurat tersebut secara formal adalah anggota kelompok itu.
- source_word: ἰδόντες
  choice: melihat
  rationale: Partisip aoris ini menyatakan keadaan yang menyertai tindakan utama dan dapat diterjemahkan secara alami sebagai tindakan yang mendahului perkataan mereka.
- source_word: ὅτι ἐσθίει
  choice: bahwa Yesus sedang makan
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung dalam adegan tersebut. Nama 'Yesus' dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: μετὰ
  choice: bersama
  rationale: Dengan bentuk genitif, kata ini menyatakan kebersamaan atau pergaulan; dalam konteks ini, kebersamaan di meja makan.
- source_word: ἁμαρτωλῶν
  choice: orang-orang berdosa
  rationale: Padanan langsung ini mempertahankan label sosial-keagamaan yang bernada tajam dalam tuduhan tersebut, tanpa memperhalusnya.
- source_word: τελωνῶν
  choice: para pemungut pajak
  rationale: Ini merupakan padanan Indonesia yang lazim dan tepat bagi petugas pemungut pajak atau bea yang dipandang buruk dalam konteks Injil.
- source_word: ἔλεγον
  choice: Mereka pun berkata
  rationale: Bahasa Indonesia tidak selalu perlu menandai aspek imperfek secara eksplisit. 'Berkata' menyampaikan tindakan ujaran secara alami, sedangkan 'pun' menjaga kesinambungan naratif.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: kepada murid-murid-Nya
  rationale: '''Murid'' mempertahankan hubungan guru-murid yang terkandung dalam μαθητής dan merupakan istilah baku yang mudah dipahami.'
- source_word: Ὅτι
  choice: Mengapa
  rationale: Dalam pertanyaan ini, ὅτι memperkenalkan keberatan secara idiomatis. 'Mengapa' menyampaikan fungsi pertanyaannya dengan wajar dalam bahasa Indonesia.
- source_word: ἐσθίει
  choice: Dia makan
  rationale: Bentuk ini dapat menyatakan tindakan yang sedang dipersoalkan maupun kebiasaan bergaul semeja, sehingga ambiguitas aspek dalam pertanyaan tidak dipersempit secara berlebihan.
theological_decisions:
- issue: Bobot sosial-keagamaan dari persekutuan makan
  choice: Mempertahankan ungkapan sederhana 'makan bersama orang-orang berdosa dan para pemungut pajak'.
  alternative: Menggunakan parafrasa seperti 'bergaul akrab dan makan bersama' untuk menonjolkan makna persekutuan.
  rationale: Bahasa Yunani memakai kata biasa untuk 'makan' disertai 'bersama'. Terjemahan utama membiarkan konteks naratif menyampaikan ketegangan sosial dan teologis tanpa menambahkan tafsiran ke dalam teks.
- issue: Hubungan ahli-ahli Taurat dengan orang Farisi
  choice: Menerjemahkan τῶν Φαρισαίων sebagai 'dari kalangan orang Farisi'.
  alternative: Menerjemahkan 'ahli-ahli Taurat yang merupakan orang Farisi' atau 'ahli-ahli Taurat milik kelompok Farisi'.
  rationale: Bentuk genitif menunjukkan afiliasi, tetapi rincian persis hubungan itu dapat dipahami dengan beberapa cara. Pilihan ini menjaga hubungan tersebut tanpa menetapkan keanggotaan formal secara lebih tegas daripada teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dipecah secara alami agar subjek tidak terlalu jauh dari verba utama. Pengulangan urutan kelompok—mula-mula orang berdosa lalu pemungut pajak, kemudian sebaliknya dalam pertanyaan—dipertahankan sesuai teks Yunani. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital mengikuti kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia.
