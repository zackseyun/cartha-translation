id: MRK.2.15
reference: Mark 2:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ⸀γίνεται κατακεῖσθαι αὐτὸν ἐν τῇ οἰκίᾳ αὐτοῦ, καὶ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ, ἦσαν γὰρ πολλοὶ καὶ ⸀ἠκολούθουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/015.yaml
  text: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
translation:
  language: id
  text: Kemudian, ketika Ia sedang makan sambil berbaring di rumahnya[a], banyak pemungut pajak dan orang berdosa makan bersama Yesus dan murid-murid-Nya. Sebab, jumlah mereka banyak, dan mereka mengikuti Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di rumah Lewi”; sebagian orang memahami “di rumah Yesus.” Teks Yunani hanya mengatakan “di rumahnya.”
    reason: alternative_reading
lexical_decisions:
- source_word: γίνεται
  choice: kemudian, ketika
  rationale: Bentuk kini historis khas Markus menggerakkan alur cerita. Dalam bahasa Indonesia, peralihan naratif alami dipadukan dengan anak kalimat waktu tanpa mempertahankan bentuk kini secara kaku.
- source_word: κατακεῖσθαι
  choice: sedang makan dengan berbaring
  rationale: Kata ini menunjuk posisi berbaring yang lazim saat bersantap, bukan sekadar berbaring. Pilihan ini mempertahankan gambaran budaya sekaligus menjelaskan bahwa peristiwa tersebut adalah perjamuan.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: di rumahnya
  rationale: Mempertahankan pronomina posesif Yunani dan ketidakjelasan acuannya; pemilik rumah tidak ditentukan dalam teks utama.
- source_word: τελῶναι
  choice: pemungut pajak
  rationale: Padanan baku dan mudah dipahami untuk petugas pemungut pendapatan pada masa itu.
- source_word: ἁμαρτωλοὶ
  choice: orang berdosa
  rationale: Padanan langsung yang mempertahankan label sosial-keagamaan dalam teks tanpa menambahkan penafsiran.
- source_word: συνανέκειντο
  choice: makan bersama
  rationale: Kata majemuk ini menyatakan turut berbaring dalam perjamuan bersama seseorang. Karena posisi berbaring sudah dinyatakan sebelumnya, 'makan bersama' menyampaikan tindakan dan persekutuan meja secara alami tanpa pengulangan yang berat.
- source_word: μαθηταῖς
  choice: murid-murid
  rationale: Padanan Perjanjian Baru yang baku dan mempertahankan hubungan belajar serta mengikuti.
- source_word: ἦσαν γὰρ πολλοὶ
  choice: Sebab, ada banyak orang seperti itu
  rationale: Mempertahankan fungsi penjelas γάρ. Tambahan 'orang seperti itu' membuat rujukan kelompok secara alami dalam bahasa Indonesia, yakni para pemungut pajak dan orang berdosa yang baru disebut.
- source_word: ἠκολούθουν αὐτῷ
  choice: yang mengikuti Dia
  rationale: Bentuk imperfek menyatakan tindakan yang sedang atau berulang berlangsung. Dalam konstruksi relatif Indonesia, 'mengikuti' secara alami dapat mencakup kesinambungan tersebut.
theological_decisions:
- issue: Acuan pronomina pada frasa 'di rumahnya' (αὐτοῦ)
  choice: Dibiarkan sebagai 'di rumahnya' dalam teks utama
  alternative: Di rumah Lewi; di rumah Yesus
  rationale: Pronomina Yunani tidak secara eksplisit menentukan pemilik rumah. Konteks dapat dipahami menunjuk kepada Lewi, sedangkan sebagian orang memahaminya menunjuk kepada Yesus. Teks utama mempertahankan ambiguitas sumber, dan catatan kaki menyebutkan kedua kemungkinan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'makan dengan berbaring' dipakai untuk menjelaskan kebiasaan bersantap kuno tanpa istilah teknis, sedangkan ambiguitas pemilik rumah tetap dipertahankan.
