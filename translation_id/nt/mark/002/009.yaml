  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν τῷ παραλυτικῷ· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ ἆρον ⸂τὸν κράβαττόν σου⸃ καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/009.yaml
  text: 'Which is easier: to say to the paralyzed man[a], ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’?”'
translation:
  language: id
  text: 'Mana yang lebih mudah: mengatakan kepada orang lumpuh itu, ‘Dosa-dosamu diampuni[a],’ atau mengatakan, ‘Bangunlah, angkat tikarmu, dan berjalanlah’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dosa-dosamu sudah diampuni.” Kata kerja Yunani dapat dipahami sebagai menekankan keadaan yang dihasilkan oleh pengampunan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: Mana yang lebih mudah
  rationale: Bentuk komparatif ini mengajukan pilihan antara dua ucapan; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya bandingnya.
- source_word: εἰπεῖν
  choice: mengatakan
  rationale: Kata ini memperkenalkan ucapan langsung pada kedua bagian dan paling tepat diterjemahkan secara konsisten sebagai ‘mengatakan’.
- source_word: τῷ παραλυτικῷ
  choice: kepada orang lumpuh itu
  rationale: Ungkapan ini menunjuk kepada orang yang mengalami kelumpuhan; bentuk deskriptif ini jelas, wajar, dan tidak terlalu teknis.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Dosa-dosamu sudah diampuni
  rationale: Bentuk kini pasif dapat menyatakan keadaan yang dihasilkan oleh pengampunan. ‘Sudah diampuni’ merupakan ungkapan Indonesia yang alami untuk keadaan tersebut tanpa menyebut pelaku pengampunan.
- source_word: ἁμαρτίαι
  choice: dosa-dosa
  rationale: Padanan baku dan sesuai konteks untuk bentuk jamak ἁμαρτίαι.
- source_word: Ἔγειρε
  choice: Bangunlah
  rationale: Imperatif ini memerintahkan orang itu untuk bangkit; ‘Bangunlah’ alami, jelas, dan bermartabat.
- source_word: ἆρον
  choice: angkat
  rationale: Dalam konteks ini kata tersebut berarti mengangkat benda agar dapat dibawa; ‘angkat’ ringkas dan konkret.
- source_word: τὸν κράβαττόν σου
  choice: tikarmu
  rationale: κράβαττος adalah alas tidur sederhana yang mudah dibawa. ‘Tikar’ lebih tepat daripada ‘tempat tidur’ yang dapat mengesankan perabot besar.
- source_word: περιπάτει
  choice: berjalanlah
  rationale: Imperatif ini secara alami diterjemahkan sebagai perintah untuk berjalan, sebagai puncak rangkaian perintah.
theological_decisions:
- issue: Bentuk pernyataan pengampunan
  choice: Dosa-dosamu sudah diampuni
  alternative: Dosa-dosamu diampuni
  rationale: Pilihan ini menyampaikan keadaan hasil yang dapat terkandung dalam bentuk ἀφίενταί, sambil tetap mempertahankan bentuk pasif dan tidak menetapkan secara eksplisit pelaku atau uraian teologis tentang waktunya.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Susunan pertanyaan dipertahankan, dan kedua alternatif dibuat sejajar. Tidak ditambahkan catatan kaki karena alternatif aspek dapat diwakili secara memadai oleh terjemahan utama tanpa mengaburkan teks.
