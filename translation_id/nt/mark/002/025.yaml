  text: καὶ ⸀λέγει αὐτοῖς· Οὐδέποτε ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε χρείαν ἔσχεν καὶ ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/025.yaml
  text: And he said to them, “Have you never read what David did when he was in need and was hungry, he and those with him?”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Belum pernahkah kalian membaca apa yang dilakukan Daud ketika ia dan orang-orang yang bersamanya berkekurangan dan lapar?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani dialihkan secara alami ke narasi Indonesia tanpa harus mempertahankan aspek kini secara kaku.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: Belum pernahkah kalian membaca
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan jawaban bahwa mereka tentu pernah membacanya.
- source_word: χρείαν ἔσχεν
  choice: ia kekurangan
  rationale: Ungkapan ini menyatakan keadaan membutuhkan atau berkekurangan; pilihan ini alami dalam bahasa Indonesia dan tidak menambahkan objek kebutuhan yang tidak disebutkan.
- source_word: ἐπείνασεν
  choice: merasa lapar
  rationale: Menyampaikan keadaan lapar secara lugas dan membedakannya dari frasa sebelumnya.
- source_word: οἱ μετ’ αὐτοῦ
  choice: orang-orang yang menyertainya
  rationale: Mengungkapkan para pengikut atau rekan yang bersama Daud tanpa menentukan hubungan mereka lebih jauh daripada teks.
theological_decisions:
- issue: Identitas subjek Yesus dalam narasi
  choice: Ia
  alternative: Yesus
  rationale: Teks Yunani memakai pronomina tersirat dalam verba dan tidak mengulang nama Yesus; pronomina mempertahankan kesinambungan wacana tanpa menambah nama.
- issue: Hubungan antara kebutuhan dan kelaparan Daud beserta rombongannya
  choice: ketika ia kekurangan dan merasa lapar, ia dan orang-orang yang menyertainya
  alternative: ketika ia dan orang-orang yang menyertainya kekurangan dan merasa lapar
  rationale: Urutan dan konstruksi Yunani menyebut Daud terlebih dahulu, lalu menambahkan 'ia dan orang-orang yang menyertainya'; terjemahan mempertahankan susunan yang agak menggantung itu agar tidak secara diam-diam merapikan cakupan kedua keadaan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Kalian' dipakai untuk αὐτοῖς yang jamak agar jumlah penerima ujaran jelas; tanda petik dan pertanyaan mengikuti konvensi Indonesia.
