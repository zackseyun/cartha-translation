  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν νηστεύειν; ὅσον χρόνον ⸂ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν⸃ οὐ δύνανται νηστεύειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/019.yaml
  text: And Jesus said to them[a], “The wedding guests cannot fast while the bridegroom is with them, can they? As long as they have the bridegroom with them, they cannot fast.”
translation:
  language: id
  text: Lalu Yesus berkata kepada mereka, “Dapatkah para tamu pernikahan[a] berpuasa selama pengantin laki-laki itu bersama mereka? Selama pengantin laki-laki itu bersama mereka, mereka tidak dapat berpuasa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak ruang pernikahan” atau “anak-anak kamar pengantin,” yaitu ungkapan bagi orang-orang yang ikut dalam perayaan pernikahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνανται ... νηστεύειν;
  choice: Tidak mungkin ... berpuasa ..., bukan?
  rationale: μή dengan bentuk indikatif memperkenalkan pertanyaan retoris yang mengharapkan jawaban negatif. Bentuk pernyataan negatif dengan ekor pertanyaan “bukan?” menyampaikan daya retorisnya secara alami dalam bahasa Indonesia.
- source_word: οἱ υἱοὶ τοῦ νυμφῶνος
  choice: para tamu pernikahan
  rationale: Ungkapan harfiahnya, “anak-anak ruang pengantin,” merupakan idiom bagi orang-orang yang ikut dalam perayaan pernikahan, terutama rekan-rekan pengantin laki-laki. “Para tamu pernikahan” jelas dan wajar tanpa mempersempit rujukannya hanya kepada pendamping tertentu.
- source_word: ἐν ᾧ ... ἐστιν
  choice: selama ... ada bersama mereka
  rationale: Konstruksi ini bersifat temporal dalam konteks ini. “Selama” menyatakan jangka waktu dengan jelas dan alami.
- source_word: ὁ νυμφίος / τὸν νυμφίον
  choice: pengantin laki-laki
  rationale: Pilihan ini mempertahankan gambaran pengantin dalam teks sekaligus memakai istilah baku dan mudah dipahami dalam bahasa Indonesia.
- source_word: μετ’ αὐτῶν
  choice: bersama mereka
  rationale: μετά dengan genitif menunjukkan kebersamaan atau penyertaan; “bersama mereka” merupakan padanan langsung dan alami.
- source_word: ὅσον χρόνον
  choice: Selama
  rationale: Ungkapan ini menandai lamanya waktu; “selama” ringkas dan idiomatis.
- source_word: ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν
  choice: pengantin laki-laki itu masih bersama mereka
  rationale: Secara harfiah teks berbunyi “mereka memiliki pengantin laki-laki bersama mereka.” Dalam bahasa Indonesia, mempertahankan “memiliki” terasa kaku dan dapat menyiratkan kepemilikan. Bentuk “masih bersama mereka” menyampaikan keberadaan yang berlanjut dan durasi yang ditekankan oleh konteks.
- source_word: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: Lalu Yesus berkata kepada mereka
  rationale: “Lalu” menghubungkan tuturan ini dengan alur narasi secara alami, sedangkan “berkata kepada mereka” mempertahankan bentuk pengantar ujaran yang lugas.
theological_decisions:
- issue: Penggambaran Yesus sebagai pengantin laki-laki
  choice: Mempertahankan metafora tanpa menjelaskan identitas atau implikasi teologisnya di dalam teks utama.
  alternative: Menerjemahkan secara lebih interpretatif untuk menonjolkan citra mesianik atau hubungan Allah dengan umat-Nya.
  rationale: Ayat ini memakai citra pengantin laki-laki dengan implikasi teologis, tetapi terjemahan tidak boleh menetapkan penafsiran yang tidak dinyatakan secara eksplisit. “Pengantin laki-laki” mempertahankan citra dan ketegangannya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pertanyaan retoris dibuat alami dengan “bukan?”, sedangkan idiom kuno dijelaskan dalam catatan kaki. Pengulangan “pengantin laki-laki” dipertahankan agar struktur dan metafora sumber tetap jelas.
