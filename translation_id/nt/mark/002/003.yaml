  source_fidelity: Revisi diperlukan karena "beberapa orang" menambahkan kuantifikasi yang tidak dinyatakan dalam bahasa Yunani. Teks hanya memiliki subjek jamak tersirat ("mereka") dan kemudian menyatakan bahwa orang lumpuh itu dibawa oleh empat orang. "Mereka" mempertahankan ketidakjelasan yang ada tanpa mengidentikkan atau membedakan secara paksa kelompok yang datang dan keempat pengusung.
  naturalness: 'Susunan revisi lebih alami dalam bahasa Indonesia modern: "datang kepada-Nya sambil membawa" menyatakan gerak menuju Yesus dan tindakan penyerta dengan jelas. Frasa "yang sedang dibawa" menyampaikan nilai partisipel pasif αἰρόμενον tanpa membatasi cara pengangkutannya seperti "diusung" dapat lakukan.'
  terminology: '"Seorang lumpuh" lazim dan dapat dipahami dalam ragam modern; "empat orang" secara tepat mengisi elipsis Yunani secara wajar dalam bahasa Indonesia tanpa menentukan jenis kelamin. Kapitalisasi "-Nya" dipertahankan sebagai konvensi rujukan hormat yang lazim dan tidak menambah makna teologis.'
