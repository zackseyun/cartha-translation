    rationale: αἰρόμενον berarti "sedang dibawa/diangkat" dan tidak sendiri menyatakan bahwa orang itu diusung di bahu atau dengan cara tertentu. "Sedang dibawa" mempertahankan keluasan makna sumber.
  revised_text: Lalu mereka datang kepada-Nya sambil membawa seorang lumpuh yang sedang dibawa oleh empat orang.
