  text: And they came[a], bringing to him a paralyzed man carried by four.
translation:
  language: id
  text: Lalu mereka datang kepada-Nya sambil membawa seorang lumpuh yang sedang dibawa oleh empat orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Dalam alur narasi, kata penghubung ini meneruskan rangkaian peristiwa secara alami; “Lalu” mempertahankan gaya naratif Markus tanpa memperberat kalimat.
- source_word: ἔρχονται
  choice: datanglah beberapa orang
  rationale: Bentuk kini historis dialihkan menjadi bentuk naratif Indonesia. Subjek jamak yang tersirat dibuat eksplisit secara minimal agar kalimat alami, tanpa menentukan identitas mereka.
- source_word: φέροντες πρὸς αὐτὸν
  choice: membawa kepada-Nya
  rationale: Partisipel menyatakan tindakan yang menyertai kedatangan. “Kepada-Nya” secara idiomatis menyatakan gerak menuju Yesus.
- source_word: παραλυτικὸν
  choice: seorang lumpuh
  rationale: Adjektiva substantival ini menunjuk kepada seseorang yang lumpuh. Ungkapan tersebut ringkas dan lazim dalam bahasa Indonesia modern.
- source_word: αἰρόμενον
  choice: yang diusung
  rationale: Partisipel pasif menunjukkan bahwa orang lumpuh itu secara fisik dibawa dengan ditopang atau diangkat oleh orang lain; “diusung” membedakannya dari kata “membawa” sebelumnya.
- source_word: ὑπὸ τεσσάρων
  choice: oleh empat orang
  rationale: Bahasa Yunani hanya menyebut “oleh empat,” dengan penyebutan orang secara eliptis. Bahasa Indonesia membutuhkan nomina agar ungkapan ini wajar; “orang” tidak menentukan jenis kelamin mereka.
