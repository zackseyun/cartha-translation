  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ⸂αὐτὸν ἐν τοῖς σάββασιν παραπορεύεσθαι⸃ διὰ τῶν σπορίμων, καὶ ⸂οἱ μαθηταὶ αὐτοῦ ἤρξαντο⸃ ὁδὸν ποιεῖν τίλλοντες τοὺς στάχυας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/023.yaml
  text: And it happened that on the Sabbath he was passing through the grainfields[a], and his disciples began to make their way[c][b], plucking the heads of grain.
translation:
  language: id
  text: Pada hari Sabat, Yesus sedang berjalan melintasi ladang-ladang tanaman biji-bijian[a], dan murid-murid-Nya mulai berjalan[b] sambil memetik bulir-bulir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ladang-ladang gandum” atau “tanaman biji-bijian yang sedang tumbuh.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mulai membuat jalan sambil memetik bulir-bulir.” Ungkapan ini kemungkinan besar berarti mereka berjalan melintasi ladang sambil memetik bulir-bulir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Pada suatu hari
  rationale: Rumus naratif ini dialihkan secara alami untuk memperkenalkan peristiwa; unsur waktu Sabat digabungkan ke dalam pembukaan tanpa ungkapan Indonesia yang kaku seperti 'terjadilah'.
- source_word: ἐν τοῖς σάββασιν
  choice: Sabat
  rationale: Bentuk jamak Yunani lazim berfungsi secara idiomatis untuk satu hari Sabat dalam konteks ini.
- source_word: παραπορεύεσθαι
  choice: melewati
  rationale: Mengungkapkan gerak melalui suatu kawasan secara ringkas dan alami.
- source_word: διὰ τῶν σπορίμων
  choice: ladang-ladang gandum
  rationale: σπόριμος menunjuk pada ladang yang ditanami biji-bijian; 'ladang gandum' adalah ungkapan Indonesia yang jelas, walaupun jenis tanaman tidak ditentukan secara khusus oleh kata Yunani.
- source_word: ἤρξαντο
  choice: mulai
  rationale: Padanan langsung dan alami bagi verba yang menandai awal tindakan.
- source_word: ὁδὸν ποιεῖν
  choice: Sambil berjalan
  rationale: Dalam konteks ini idiom harfiah 'membuat jalan' menyatakan bahwa para murid bergerak melintasi ladang, bukan membangun jalan. Susunan ini juga menghubungkan gerak mereka dengan tindakan memetik.
- source_word: τίλλοντες
  choice: memetik
  rationale: Menyatakan tindakan mencabut atau mengambil bulir dari tangkainya dengan bahasa Indonesia yang umum.
- source_word: τοὺς στάχυας
  choice: bulir-bulir gandum
  rationale: στάχυς berarti bulir atau malai tanaman biji-bijian; 'bulir gandum' mudah dipahami pembaca modern.
- source_word: αὐτὸν
  choice: Yesus
  rationale: Pronomina Yunani secara gramatikal merujuk kepada tokoh utama dari konteks sebelumnya; nama 'Yesus' dipakai demi kejelasan dalam ayat yang disajikan tersendiri.
theological_decisions:
- issue: Istilah Sabat
  choice: Pada suatu hari Sabat
  alternative: pada hari-hari Sabat
  rationale: Bentuk jamak Yunani dipahami secara idiomatis sebagai satu hari Sabat di sini; keputusan ini bersifat kebahasaan dan tidak mengubah latar perselisihan mengenai Sabat.
- issue: Makna ὁδὸν ποιεῖν dalam perselisihan Sabat
  choice: Sambil berjalan
  alternative: mulai membuka jalan
  rationale: Terjemahan idiomatis tidak memberi kesan bahwa para murid membangun atau membuka jalan. Teks menggambarkan mereka bergerak sambil memetik bulir, tanpa membesar-besarkan pekerjaan yang dilakukan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur Yunani yang kaku dialihkan menjadi narasi lancar. Istilah 'gandum' dipakai sebagai sebutan umum yang lazim dalam bahasa Indonesia, dengan keluasan makna sumber dijelaskan dalam catatan kaki.
