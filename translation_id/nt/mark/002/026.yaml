revisions:
- from: bagaimana ia masuk ke rumah Allah pada zaman Abyatar, Imam Besar itu,[a] lalu memakan roti sajian,[b] yang menurut hukum tidak boleh dimakan kecuali oleh para imam, dan juga memberikannya kepada orang-orang yang menyertainya?
  to: bagaimana ia masuk ke rumah Allah pada zaman Abyatar, imam besar, lalu memakan roti sajian,[b] yang tidak boleh dimakan kecuali oleh para imam, dan juga memberikannya kepada orang-orang yang bersama dia?[a]
  rationale: Revisi menghapus demonstrativa yang tidak ada dalam bahasa sumber, menghindari pembatasan makna yang tidak perlu pada “menurut hukum,” dan memperjelas bahwa orang-orang tersebut adalah mereka yang bersama Daud. Penanda catatan kaki dipindahkan agar catatan a melekat langsung pada frasa yang dibahas, yaitu frasa tentang Abyatar. Ambiguitas frasa ἐπὶ Ἀβιαθὰρ ἀρχιερέως tetap dipertahankan dalam teks utama dan dijelaskan dalam catatan kaki.
