id: MRK.2.26
reference: Mark 2:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ ἐπὶ Ἀβιαθὰρ ἀρχιερέως καὶ τοὺς ἄρτους τῆς προθέσεως ἔφαγεν, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ ⸂τοὺς ἱερεῖς⸃, καὶ ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/026.yaml
  text: how he entered into the house of God in the time of Abiathar the high priest[a], and ate the bread of the Presence, which it is not lawful to eat except for the priests[b], and also gave some to those who were with him?
translation:
  language: id
  text: bagaimana ia masuk ke rumah Allah pada zaman Abyatar, imam besar, lalu memakan roti sajian,[b] yang tidak boleh dimakan kecuali oleh para imam, dan juga memberikannya kepada orang-orang yang bersama dia?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “selama masa Abyatar menjadi imam besar.” Frasa ini juga dapat dipahami secara lebih luas sebagai masa atau latar kisah yang dikaitkan dengan Abyatar, imam besar.
    reason: alternative_reading
  - marker: b
    text: “Roti sajian” adalah roti kudus yang diletakkan di hadapan Allah di tempat suci.
    reason: cultural_note
lexical_decisions:
- source_word: πῶς
  choice: bagaimana
  rationale: Secara alami memperkenalkan uraian tentang apa yang dilakukan Daud dan mempertahankan bentuk pertanyaan dalam konteks.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: ia masuk ke rumah Allah
  rationale: Terjemahan langsung dan wajar bagi verba aoris beserta frasa preposisionalnya; 'rumah Allah' mempertahankan ungkapan Yunani.
- source_word: ἐπὶ Ἀβιαθὰρ ἀρχιερέως
  choice: pada zaman Abyatar, Imam Besar itu
  rationale: ἐπί dengan genitif dapat menyatakan waktu atau latar masa. Pilihan ini alami dalam bahasa Indonesia dan tidak mempersempit frasa menjadi pernyataan teknis tentang masa jabatan.
- source_word: ἄρτους τῆς προθέσεως
  choice: roti sajian
  rationale: Istilah Indonesia yang ringkas dan dikenal untuk roti kudus yang diletakkan di hadapan Allah; maknanya dijelaskan dalam catatan kaki.
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν
  choice: yang menurut hukum tidak boleh dimakan
  rationale: Mengungkapkan ketidakbolehan legal-sakral yang dinyatakan oleh ἔξεστιν dalam bahasa Indonesia yang jelas.
- source_word: εἰ μὴ τοὺς ἱερεῖς
  choice: kecuali oleh para imam
  rationale: Menunjukkan secara jelas bahwa para imam merupakan satu-satunya pihak yang diizinkan memakannya.
- source_word: ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν
  choice: dan juga memberikannya kepada orang-orang yang menyertainya
  rationale: Mempertahankan objek tersirat sebagai '-nya' dan menerjemahkan frasa partisipial dengan ungkapan Indonesia yang alami serta dekat dengan teks.
theological_decisions:
- issue: Frasa waktu mengenai Abyatar dan hubungannya dengan kisah paralel dalam 1 Samuel 21
  choice: pada zaman Abyatar, Imam Besar itu
  alternative: selama masa Abyatar menjadi imam besar; dalam bagian kisah tentang Imam Besar Abyatar
  rationale: Frasa Yunani dapat menunjuk secara luas pada masa atau latar kisah yang dikaitkan dengan Abyatar. Terjemahan utama mempertahankan keluwesan temporal dan ketegangan dengan 1 Samuel 21 tanpa menyelesaikannya secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang alami dan bermartabat. 'Imam Besar' dipakai sebagai gelar yang menjelaskan aposisi, sedangkan 'roti sajian' mempertahankan istilah kultis yang lazim dan diberi penjelasan singkat.
