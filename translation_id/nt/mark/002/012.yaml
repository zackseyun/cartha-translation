id: MRK.2.12
reference: Mark 2:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἠγέρθη ⸂καὶ εὐθὺς⸃ ἄρας τὸν κράβαττον ἐξῆλθεν ⸀ἔμπροσθεν πάντων, ὥστε ἐξίστασθαι πάντας καὶ δοξάζειν τὸν θεὸν λέγοντας ὅτι ⸂Οὕτως οὐδέποτε⸃ εἴδομεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/012.yaml
  text: And he got up[a], and immediately picked up the mat and went out before them all, so that they were all amazed and glorified God, saying, “We have never seen anything like this.”
translation:
  language: id
  text: Orang itu pun bangkit, lalu segera mengangkat tikarnya dan keluar di depan semua orang. Akibatnya, mereka semua tercengang dan memuliakan Allah. Kata mereka, “Belum pernah kami melihat hal seperti ini.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Belum pernah kami melihat demikian.” Ungkapan Yunani ini berarti bahwa mereka belum pernah menyaksikan kejadian seperti itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγέρθη
  choice: bangkit
  rationale: Dalam konteks penyembuhan ini, kata tersebut menyatakan bahwa orang lumpuh itu berdiri sebagai tanggapan terhadap perintah Yesus. ‘Bangkit’ alami dalam bahasa Indonesia dan tidak mengharuskan pembacaan tentang kebangkitan dari kematian.
- source_word: εὐθύς
  choice: segera
  rationale: Mempertahankan kesan tindakan seketika dan gerak naratif khas Markus.
- source_word: ἄρας
  choice: mengangkat
  rationale: Partisip ini menggambarkan tindakan mengangkat tikar untuk dibawa sebelum orang itu keluar.
- source_word: κράβαττον
  choice: tikar
  rationale: Merujuk pada alas tidur sederhana, bukan tempat tidur besar; ‘tikar’ jelas dan mudah dipahami dalam bahasa Indonesia.
- source_word: ἔμπροσθεν πάντων
  choice: di depan semua orang
  rationale: Ungkapan ini menekankan bahwa kesembuhan dan keluarnya orang itu terlihat secara terbuka oleh semua yang hadir.
- source_word: ὥστε ἐξίστασθαι πάντας
  choice: Akibatnya, mereka semua tercengang
  rationale: Konstruksi ὥστε menyatakan akibat, sedangkan ἐξίστασθαι di sini menyatakan rasa takjub yang sangat kuat.
- source_word: δοξάζειν τὸν θεόν
  choice: memuliakan Allah
  rationale: Padanan ini mempertahankan arah tanggapan mereka kepada Allah dan diksi teologis yang lazim tanpa mengubahnya sekadar menjadi pujian umum.
- source_word: Οὕτως οὐδέποτε εἴδομεν
  choice: Belum pernah kami melihat hal seperti ini
  rationale: Terjemahan idiomatis ini menyampaikan bahwa kejadian tersebut belum pernah mereka saksikan, sambil mencatat bentuk yang lebih harfiah dalam catatan kaki.
theological_decisions:
- issue: Kemungkinan nuansa kebangkitan dalam ἠγέρθη
  choice: bangkit dalam arti berdiri setelah disembuhkan
  alternative: dibangkitkan
  rationale: Bentuk Yunani dapat digunakan dalam konteks kebangkitan, tetapi konteks langsung di sini adalah orang lumpuh yang menaati perintah Yesus untuk berdiri. Terjemahan tidak memasukkan penekanan kebangkitan yang tidak ditonjolkan dalam peristiwa ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. ‘Orang itu’ memperjelas rujukan pelaku dalam ayat yang dibaca tersendiri. Kalimat panjang Yunani dibagi menjadi tiga kalimat agar alami dalam bahasa Indonesia tanpa menghilangkan urutan tindakan, akibat, dan tanggapan. Penanda catatan kaki ditempatkan setelah ungkapan yang benar-benar dijelaskannya.
