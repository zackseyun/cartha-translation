source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/022.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the wine will burst the wineskins, and the wine is ruined, and the wineskins too[b]. But new wine is for fresh wineskins.
translation:
  language: id
  text: Dan tidak seorang pun menuangkan anggur baru ke dalam kantong kulit yang lama. Jika ia melakukannya, anggur itu akan membuat kantong-kantong kulit tersebut pecah; anggurnya akan terbuang[a], dan kantong-kantongnya pun rusak. Sebaliknya, anggur baru adalah untuk kantong kulit yang masih baru.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “anggurnya akan hilang” atau “anggurnya akan rusak.”'
    reason: Verba Yunani ἀπόλλυται dapat menyatakan hilang, binasa, atau menjadi rusak; dalam konteks ini anggur terbuang ketika kantong kulit pecah.
  - marker: b
    text: Secara harfiah, “kantong kulit baru.” Kata Yunani di sini menekankan keadaan yang baru atau segar, berlawanan dengan kantong kulit yang lama.
    reason: Menjelaskan nuansa kualitatif καινούς dan alasan penggunaan “masih baru”.
lexical_decisions:
- source_word: βάλλει
  choice: menuangkan
  rationale: Dalam konteks memasukkan cairan ke wadah, “menuangkan” merupakan ungkapan Indonesia yang paling wajar, meskipun verba Yunani itu sendiri lebih umum, yaitu ‘menaruh/memasukkan’.
- source_word: οἶνον νέον
  choice: anggur baru
  rationale: Padanan baku yang mempertahankan pasangan nomina-adjektiva; yang dimaksud ialah anggur yang baru dibuat dan masih mengalami proses fermentasi.
- source_word: ἀσκούς
  choice: kantong kulit
  rationale: Merujuk pada wadah dari kulit binatang. “Kantong kulit” jelas dan alami dalam bahasa Indonesia serta mempertahankan gambaran budaya aslinya.
- source_word: παλαιούς
  choice: yang lama
  rationale: Menerjemahkan arti langsung ‘lama/tua’ tanpa mempersempitnya menjadi ‘usang’, sekalipun kondisi usang tersirat oleh perumpamaan.
- source_word: ῥήξει
  choice: akan membuat ... pecah
  rationale: Mengungkapkan akibat tekanan fermentasi terhadap kantong kulit secara alami dalam bahasa Indonesia; anggur tetap menjadi penyebab gramatikal pecahnya wadah.
- source_word: ἀπόλλυται
  choice: akan terbuang
  rationale: Dalam konteks ini verba tersebut menyatakan bahwa anggur menjadi hilang atau sia-sia karena tumpah. “Terbuang” menyampaikan hasil praktisnya tanpa menyiratkan bahwa anggur secara harfiah binasa.
- source_word: καινούς
  choice: yang masih baru
  rationale: Frasa “masih baru” menonjolkan keadaan atau mutu kantong kulit yang belum tua dan masih lentur, sehingga membantu mempertahankan nuansa kualitatif καινός dalam kontras dengan παλαιός.
- source_word: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινούς
  choice: Sebaliknya, anggur baru adalah untuk kantong kulit yang masih baru
  rationale: Klausa Yunani ini eliptis dan tidak memiliki verba tersurat. Bentuk “adalah untuk” mempertahankan sifatnya sebagai prinsip umum dan tidak menambahkan perintah atau keharusan.
theological_decisions:
- issue: Sifat klausa penutup yang eliptis
  choice: 'Diterjemahkan sebagai prinsip umum: “anggur baru adalah untuk kantong kulit yang masih baru.”'
  alternative: “Anggur baru harus dituangkan ke dalam kantong kulit yang masih baru” atau “orang menuangkan anggur baru ke dalam kantong kulit yang masih baru.”
  rationale: Teks Yunani tidak menyatakan verba pada klausa penutup. Rumusan sebagai prinsip umum mempertahankan gaya pepatah yang ringkas dan tidak memasukkan daya perintah atau modalitas ‘harus’ yang tidak tersurat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Kantong kulit” dipakai secara konsisten sebagai istilah budaya yang mudah dipahami. Klausa hasil dibuat eksplisit secukupnya agar hubungan sebab-akibat jelas, sedangkan kehematan dan sifat proverbial klausa terakhir tetap dipertahankan.
