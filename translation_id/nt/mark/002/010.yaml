  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας⸃— λέγει τῷ παραλυτικῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/010.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he says to the paralyzed man[b][a],
translation:
  language: id
  text: Tetapi, supaya kalian tahu bahwa Anak Manusia[a] memiliki wewenang di bumi untuk mengampuni dosa—Ia berkata kepada orang lumpuh itu[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sang Manusia.” Gelar Yunani ini dapat menyatakan kemanusiaan sekaligus menggemakan Daniel 7.
    reason: alternative_reading
  - marker: b
    text: Atau “orang yang mengalami kelumpuhan itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ
  choice: Namun, supaya
  rationale: “Supaya” menyatakan tujuan, sedangkan “namun” mempertahankan peralihan yang agak kontras dalam δέ.
- source_word: εἰδῆτε
  choice: kalian tahu
  rationale: Bentuk Yunani ini adalah orang kedua jamak. “Kalian” menyatakan jumlah jamak dengan jelas, dan “tahu” mempertahankan daya pembuktian dari mukjizat yang akan dilakukan.
- source_word: ἐξουσίαν ἔχει
  choice: memiliki wewenang
  rationale: ἐξουσία menunjuk pada hak atau kewenangan yang sah, bukan sekadar kemampuan atau tenaga.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Sebutan yang sudah dikenal ini mempertahankan bentuk ungkapan Yunani serta kemungkinan gaung Daniel 7 tanpa membatasi maknanya pada satu penafsiran.
- source_word: ἐπὶ τῆς γῆς
  choice: di bumi
  rationale: Ungkapan ini secara alami menunjuk pada ranah bumi dan dapat mengandung kontras tersirat dengan ranah surga.
- source_word: ἀφιέναι ἁμαρτίας
  choice: untuk mengampuni dosa
  rationale: Dalam konteks ini ἀφίημι berarti mengampuni atau menghapuskan kesalahan; “mengampuni dosa” merupakan ungkapan Indonesia yang jelas dan lazim.
- source_word: λέγει τῷ παραλυτικῷ
  choice: ia berkata kepada orang lumpuh itu
  rationale: “Berkata” mempertahankan kala kini historis secara wajar dalam narasi Indonesia, sedangkan “orang lumpuh” mudah dipahami dan tidak menjadikan kondisi orang tersebut sebagai label teknis.
theological_decisions:
- issue: Makna gelar ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: “Anak Manusia” mempertahankan gelar tradisional sekaligus ketegangan antara makna yang berkaitan dengan kemanusiaan dan kemungkinan rujukan kepada sosok dalam Daniel 7.
- issue: Makna ἐξουσία dalam pengampunan dosa
  choice: wewenang
  alternative: kuasa
  rationale: Konteks menekankan hak dan kewenangan Yesus untuk mengampuni dosa, bukan hanya kemampuan untuk melakukannya.
- issue: Cakupan frasa ἐπὶ τῆς γῆς
  choice: memiliki wewenang di bumi untuk mengampuni dosa
  alternative: memiliki wewenang untuk mengampuni dosa di bumi
  rationale: Susunan yang dipilih mengikuti urutan Yunani dan tidak memaksakan keputusan apakah “di bumi” terutama menerangkan wewenang atau tindakan mengampuni.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk memperlihatkan bahwa sapaan Yunani berbentuk jamak. Huruf kecil pada “ia” mengikuti kaidah umum pronomina dan menghindari penambahan penandaan kehormatan yang tidak terdapat dalam teks Yunani. Tanda pisah mempertahankan kalimat yang terputus dan berlanjut ke ayat berikutnya.
