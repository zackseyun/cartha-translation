  naturalness: 'Kalimat pertama dan pilihan register pada umumnya alami dalam bahasa Indonesia modern. Namun, “Orang yang kuat tidak memerlukan tabib, melainkan orang yang sakit” meninggalkan elipsis yang terasa tidak lengkap dalam bahasa Indonesia: unsur yang dikontraskan adalah pihak yang memerlukan tabib. Menyatakan predikat pada klausa kedua membuat pepatah itu jelas dan tetap ringkas.'
  terminology: “Orang benar” dan “orang berdosa” adalah padanan baku yang tepat. “Tabib” dapat dipahami dan sesuai register Alkitab yang bermartabat; tidak perlu diganti. Catatan kaki a sebaiknya memakai “sehat” sebagai alternatif yang lebih alami daripada frasa “berada dalam keadaan baik.”
