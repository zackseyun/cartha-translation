  text: καὶ ἀκούσας ὁ Ἰησοῦς λέγει αὐτοῖς ⸀ὅτι Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλ’ οἱ κακῶς ἔχοντες· οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/017.yaml
  text: And when Jesus heard it, he says to them, “Those who are strong have no need of a physician, but those who are sick. I did not come to call the righteous, but sinners.”
translation:
  language: id
  text: Ketika Yesus mendengarnya, Ia berkata kepada mereka, “Orang yang kuat[a] tidak memerlukan tabib, tetapi orang yang sakit memerlukannya. Aku datang bukan untuk memanggil orang benar[b], melainkan orang berdosa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang sehat”; kata Yunani secara harfiah menunjuk kepada orang yang kuat atau sehat.
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ini, “orang benar” dapat dipahami secara ironis, yaitu orang yang dipandang benar atau menganggap dirinya benar; teks Yunani sendiri hanya mengatakan “orang benar”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: ketika Yesus mendengarnya
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama dan secara alami diterjemahkan sebagai anak kalimat waktu. Objek tersirat dinyatakan dengan akhiran -nya berdasarkan konteks terdekat.
- source_word: λέγει
  choice: Ia berkata
  rationale: Bentuk kini historis menghidupkan narasi Yunani, tetapi bentuk lampau adalah cara alami untuk menuturkan rangkaian peristiwa dalam bahasa Indonesia dan tidak mengubah maknanya.
- source_word: οἱ ἰσχύοντες
  choice: orang yang kuat
  rationale: Mempertahankan arti leksikal ἰσχύω, yaitu kuat atau memiliki kekuatan, sambil membiarkan padanan kontekstual 'sehat' tampil dalam catatan kaki.
- source_word: χρείαν ἔχουσιν
  choice: tidak memerlukan
  rationale: Ungkapan idiomatis ini berarti tidak mempunyai kebutuhan akan sesuatu; 'tidak memerlukan' alami dan jelas dalam bahasa Indonesia.
- source_word: ἰατροῦ
  choice: tabib
  rationale: Padanan yang bermartabat dan lazim dalam bahasa Indonesia untuk seorang penyembuh atau dokter dalam konteks dunia kuno.
- source_word: οἱ κακῶς ἔχοντες
  choice: orang yang sakit
  rationale: Ungkapan harfiahnya menunjuk kepada mereka yang keadaannya buruk dan lazim dipakai untuk orang sakit; terjemahan ini mempertahankan pertentangan medisnya.
- source_word: οὐκ ἦλθον καλέσαι
  choice: Aku datang bukan untuk memanggil
  rationale: Susunan 'bukan ... melainkan ...' secara alami menyampaikan kontras οὐκ ... ἀλλά tanpa menyiratkan bahwa kedatangan itu tidak terjadi.
- source_word: δικαίους
  choice: orang benar
  rationale: Adjektiva substantival ini menunjuk kepada orang-orang yang benar. Terjemahan tidak menambahkan penafsiran bahwa mereka hanya menganggap diri benar.
- source_word: ἁμαρτωλούς
  choice: orang berdosa
  rationale: Padanan baku bagi adjektiva substantival yang menunjuk kepada para pendosa sebagai kategori moral-keagamaan.
theological_decisions:
- issue: Objek tersirat dari 'mendengar'
  choice: Menyatakan objek secara kontekstual dengan 'mendengarnya'
  alternative: 'Membiarkannya tanpa objek: ''Ketika mendengar'''
  rationale: Bahasa Yunani tidak menyebut objek, tetapi konteks menunjukkan perkataan atau keluhan yang didengar Yesus. Akhiran -nya membuat bahasa Indonesia alami tanpa menentukan lebih jauh isi yang didengar.
- issue: Makna 'orang benar'
  choice: Mempertahankan frasa 'orang benar' dalam teks utama
  alternative: Menafsirkan secara eksplisit sebagai 'orang yang menganggap dirinya benar'
  rationale: Konteks mungkin memberi nuansa ironis, tetapi teks Yunani hanya mengatakan 'orang benar'. Catatan kaki menjaga kemungkinan pembacaan kontekstual tanpa menyelesaikan ketegangan itu di dalam teks.
- issue: Bentuk kini historis λέγει
  choice: Menggunakan bentuk naratif alami 'Ia berkata'
  alternative: 'Mencerminkan bentuk kini secara lebih formal: ''Ia berkata kepada mereka'' tetap tidak bertanda waktu secara morfologis dalam bahasa Indonesia, atau memakai ''Ia mengatakan'''
  rationale: Bahasa Indonesia tidak memiliki kontras kala morfologis yang sama seperti bahasa Yunani. 'Ia berkata' adalah narasi yang alami dan tidak menghilangkan isi atau daya ujaran.
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Pronomina ilahi 'Ia' dan 'Aku' mengikuti kebiasaan gaya Alkitab Indonesia tanpa menambah gelar. Struktur pepatah dipertahankan secara ringkas, dan semua penanda catatan kaki ditempatkan langsung pada frasa terkait.
