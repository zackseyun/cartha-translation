  to: Ketika Yesus mendengarnya, Ia berkata kepada mereka, “Orang yang kuat[a] tidak memerlukan tabib, tetapi orang yang sakit memerlukannya. Aku datang bukan untuk memanggil orang benar[b], melainkan orang berdosa.”
