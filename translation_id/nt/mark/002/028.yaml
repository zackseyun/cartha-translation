  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥστε κύριός ἐστιν ὁ υἱὸς τοῦ ἀνθρώπου καὶ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/028.yaml
  text: So the Son of Man is Lord even of the Sabbath[a].
translation:
  language: id
  text: Jadi, Anak Manusia adalah Tuhan bahkan atas hari Sabat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Karena itu, Anak Manusia juga adalah Tuhan atas hari Sabat.” Kata penghubung Yunani dapat diterjemahkan “dan/juga”, tetapi di sini kemungkinan bermakna “bahkan”, yang menegaskan luasnya kewenangan-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Jadi
  rationale: Menandai kesimpulan yang ditarik dari alasan pada ayat sebelumnya dengan ungkapan Indonesia yang alami dan jelas.
- source_word: κύριος
  choice: Tuhan
  rationale: Mempertahankan sebutan yang kuat bagi kewenangan dan kedaulatan Anak Manusia, sekaligus menjaga bobot kristologis pernyataan ini.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan gelar khas yang digunakan Yesus dan tidak meniadakan gema serta ketegangan teologisnya dengan parafrasa umum.
- source_word: καὶ
  choice: bahkan
  rationale: Dalam konteks ini καί kemungkinan bersifat menanjak, menegaskan luasnya kewenangan Anak Manusia sampai atas hari Sabat.
- source_word: σαββάτου
  choice: hari Sabat
  rationale: Ungkapan baku dan mudah dipahami dalam bahasa Indonesia untuk hari perhentian yang menjadi pokok perdebatan dalam konteks ini.
theological_decisions:
- issue: Daya kristologis klaim Yesus atas hari Sabat
  choice: Menerjemahkannya secara langsung sebagai pernyataan bahwa Anak Manusia adalah Tuhan atas hari Sabat.
  alternative: Anak Manusia memiliki wewenang mengenai hari Sabat.
  rationale: κύριος menyatakan ketuhanan atau kekuasaan, bukan sekadar izin terbatas; terjemahan ini mempertahankan kekuatan klaim tanpa menambahkan penjelasan doktrinal.
- issue: Rujukan gelar 'Anak Manusia'
  choice: Mempertahankan 'Anak Manusia' sebagai gelar Yesus.
  alternative: manusia; sosok manusia
  rationale: Dalam Injil Markus, ungkapan ini berfungsi sebagai gelar yang merujuk pada diri Yesus dan menyimpan kemungkinan gema Daniel; ketegangan itu sebaiknya tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan predikatif dibuat alami, sedangkan gelar tradisional 'Anak Manusia', sebutan 'Tuhan', dan istilah 'hari Sabat' dipertahankan demi kejelasan serta kesinambungan antarbagian Kitab Suci.
