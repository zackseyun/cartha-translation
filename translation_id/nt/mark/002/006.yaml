  text: ἦσαν δέ τινες τῶν γραμματέων ἐκεῖ καθήμενοι καὶ διαλογιζόμενοι ἐν ταῖς καρδίαις αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/006.yaml
  text: 'But some of the scribes were sitting there[a], reasoning in their hearts:'
translation:
  language: id
  text: Namun, beberapa ahli Taurat sedang duduk di situ dan berpikir-pikir dalam hati mereka:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mempertimbangkan dalam diri mereka” atau “berpikir dalam pikiran mereka.” Secara harfiah, bahasa Yunani berbunyi “dalam hati mereka,” sebuah ungkapan biblis untuk pikiran batin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Namun, ... sedang
  rationale: δέ menandai peralihan yang agak kontras kepada tanggapan batin kelompok lain; “Namun” menyampaikan kontras itu tanpa membuatnya terlalu tajam, sedangkan “sedang” membantu membentuk konstruksi perifrastis Yunani.
- source_word: τινες τῶν γραμματέων
  choice: beberapa ahli Taurat
  rationale: τινες dengan genitif partitif menunjukkan sebagian dari kelompok ahli Taurat. Dalam bahasa Indonesia, “beberapa ahli Taurat” menyampaikan hal itu secara alami.
- source_word: ἐκεῖ καθήμενοι
  choice: duduk di situ
  rationale: Terjemahan langsung dan wajar bagi keterangan tempat serta partisip yang menggambarkan posisi mereka.
- source_word: διαλογιζόμενοι
  choice: berpikir-pikir
  rationale: Kata ini menyatakan pertimbangan atau penalaran batin. “Berpikir-pikir” alami dalam bahasa Indonesia dan mempertahankan nuansa proses internal tanpa terlebih dahulu menjadikannya pertanyaan atau perdebatan.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: dalam hati mereka
  rationale: Ungkapan ini mempertahankan idiom biblis yang menempatkan pikiran dan pertimbangan batin di dalam hati, tanpa memaksakan pembedaan modern antara hati dan pikiran.
theological_decisions:
- issue: Idiom antropologis καρδίαις
  choice: dalam hati mereka
  alternative: dalam pikiran mereka; dalam diri mereka
  rationale: Terjemahan utama mempertahankan dunia konseptual teks, yaitu hati sebagai pusat pemikiran batin. Catatan kaki menjelaskan maknanya agar tidak disalahpahami hanya sebagai emosi.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. “Ahli Taurat” dipakai sebagai istilah Injil yang sudah lazim; susunan kalimat mempertahankan gerak narasi dan idiom sumber.
