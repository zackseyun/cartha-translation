  text: καὶ ⸀εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς τῷ πνεύματι αὐτοῦ ὅτι ⸀οὕτως διαλογίζονται ἐν ἑαυτοῖς ⸀λέγει αὐτοῖς· Τί ταῦτα διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/008.yaml
  text: And immediately Jesus[a], perceiving in his spirit that they were reasoning this way within themselves, said to them, “Why are you reasoning about these things in your hearts?”
translation:
  language: id
  text: Segera Yesus menyadari dalam roh-Nya[a] bahwa mereka sedang berpikir demikian dalam batin mereka. Ia berkata kepada mereka, “Mengapa kalian memikirkan hal-hal ini dalam hati kalian?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengetahui dengan roh-Nya” atau “mengenali dalam diri-Nya.” Bahasa Yunani tidak menjelaskan secara tegas cara Yesus mengetahui hal itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: segera
  rationale: Mempertahankan penanda naratif khas Markus dan nuansa tindakan yang langsung dengan ungkapan Indonesia yang alami.
- source_word: ἐπιγνοὺς
  choice: menyadari
  rationale: Menyampaikan pengenalan atau persepsi yang jelas tanpa menentukan secara berlebihan bagaimana Yesus memperoleh pengetahuan itu.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: dalam roh-Nya
  rationale: Mencerminkan bentuk Yunani secara dekat dan mempertahankan kemungkinan datif lingkup atau sarana tanpa menyelesaikan ambiguitasnya.
- source_word: οὕτως διαλογίζονται
  choice: sedang berpikir demikian
  rationale: Mengungkapkan proses pertimbangan batin secara alami; 'demikian' menunjuk kepada isi pikiran dalam konteks sebelumnya.
- source_word: ἐν ἑαυτοῖς
  choice: dalam diri mereka
  rationale: Menunjukkan bahwa pertimbangan itu berlangsung secara batin, bukan berupa perdebatan lisan.
- source_word: Τί ταῦτα διαλογίζεσθε
  choice: Mengapa kalian memikirkan hal-hal itu
  rationale: Dalam konteks pertanyaan ini τί berfungsi secara idiomatis sebagai pertanyaan alasan; pilihan ini wajar dalam bahasa Indonesia dan mempertahankan rujukan ταῦτα.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: dalam hati kalian
  rationale: Mempertahankan metafora alkitabiah tentang hati sebagai pusat pikiran dan niat, tanpa mereduksinya menjadi 'pikiran' saja.
theological_decisions:
- issue: Sifat pengetahuan Yesus dalam frasa τῷ πνεύματι αὐτοῦ
  choice: Mempertahankan ungkapan 'dalam roh-Nya' dan menyatakan bahwa Yesus menyadari pemikiran batin mereka tanpa menentukan mekanismenya.
  alternative: Menafsirkannya secara eksplisit sebagai kemahatahuan ilahi, karya Roh Kudus, atau intuisi manusia semata.
  rationale: Ayat ini menegaskan bahwa Yesus mengetahui pertimbangan batin mereka, tetapi frasa Yunani tersebut tidak secara eksplisit menentukan cara pengetahuan itu diperoleh. Terjemahan mempertahankan ketegangan teologis ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Kalian' dipakai untuk menandai sapaan jamak secara jelas; 'roh-Nya' mempertahankan ambiguitas sumber.
