  yaml_path: translation/nt/mark/002/013.yaml
  text: And he went out again beside the sea[a], and the whole crowd was coming to him[c][b], and he was teaching them.
translation:
  language: id
  text: Lalu Yesus keluar lagi ke tepi danau. Seluruh orang banyak datang kepada-Nya,[a] dan Ia mengajar mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja yang diterjemahkan “datang” dan “mengajar” berbentuk imperfek dalam bahasa Yunani dan dapat menggambarkan tindakan yang sedang berlangsung pada waktu lampau.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: pergi
  rationale: Dalam konteks ini, bentuk aoris ἐξέρχομαι menyatakan bahwa Yesus pergi ke luar menuju tepi danau. Bahasa Indonesia cukup menyatakannya dengan 'pergi'; menambahkan 'keluar' tanpa titik asal yang disebutkan terasa kurang alami.
- source_word: πάλιν
  choice: lagi
  rationale: Menandai pengulangan tindakan secara alami dalam bahasa Indonesia modern.
- source_word: παρὰ τὴν θάλασσαν
  choice: ke tepi danau
  rationale: παρά dengan akusatif di sini menunjukkan gerak menuju atau menyusuri kawasan di sisi perairan. 'Ke tepi danau' alami dalam konteks Danau Galilea dan mempertahankan arah geraknya.
- source_word: πᾶς ὁ ὄχλος
  choice: seluruh orang banyak
  rationale: Mewakili ungkapan kolektif πᾶς ὁ ὄχλος tanpa mengubahnya menjadi klaim tentang setiap orang secara individual.
- source_word: ἤρχετο
  choice: datang
  rationale: Imperfek Yunani menggambarkan tindakan yang sedang berlangsung dalam latar masa lampau. Dalam narasi Indonesia, bentuk 'datang' paling alami; nuansa keberlangsungannya dijelaskan dalam catatan kaki.
- source_word: πρὸς αὐτόν
  choice: kepada-Nya
  rationale: Menyatakan gerak menuju Yesus dengan padanan Indonesia yang wajar.
- source_word: ἐδίδασκεν
  choice: Ia mengajar
  rationale: Imperfek menunjukkan kegiatan mengajar yang berlangsung. Narasi Indonesia secara alami memakai 'mengajar', sementara aspek keberlangsungannya dicatat di kaki halaman.
- source_word: αὐτούς
  choice: mereka
  rationale: Kata ganti objek ini merujuk kembali kepada orang banyak.
