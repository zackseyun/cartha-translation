  text: καὶ οἱ Φαρισαῖοι ἔλεγον αὐτῷ· Ἴδε τί ⸀ποιοῦσιν τοῖς σάββασιν ὃ οὐκ ἔξεστιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/024.yaml
  text: And the Pharisees were saying to him[a], “Look, why are they doing what is not permitted on the Sabbath?”
translation:
  language: id
  text: Lalu orang-orang Farisi berkata kepada-Nya, “Lihat, mengapa[a] mereka melakukan apa yang tidak diperbolehkan pada hari Sabat?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Lihat, apa yang mereka lakukan pada hari Sabat yang tidak diperbolehkan?” Kata Yunani yang diterjemahkan “mengapa” juga dapat dibaca sebagai “apa”, meskipun dalam konteks ini kemungkinan besar bermakna “mengapa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Menghubungkan adegan ini dengan alur sebelumnya secara alami tanpa memberi urutan waktu yang terlalu tegas.
- source_word: οἱ Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Sebutan baku dan mudah dipahami untuk kelompok tersebut; bentuk jamak dinyatakan secara alami dalam bahasa Indonesia.
- source_word: ἔλεγον
  choice: berkata
  rationale: Bahasa Indonesia umumnya tidak menandai aspek imperfektif secara khusus; 'berkata' alami dalam narasi dan tidak menutup kemungkinan bahwa ucapan itu berlangsung atau berulang.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Menyatakan objek tak langsung yang merujuk kepada Yesus menurut konteks.
- source_word: Ἴδε
  choice: Lihat
  rationale: Mempertahankan seruan untuk menarik perhatian dengan ungkapan modern dan langsung.
- source_word: τί
  choice: mengapa
  rationale: Dalam konteks keluhan ini, τί paling wajar dipahami secara adverbial sebagai pertanyaan alasan, meskipun bacaan harfiah 'apa' tetap mungkin dan dicatat dalam catatan kaki.
- source_word: ποιοῦσιν
  choice: mereka melakukan
  rationale: Padanan alami untuk verba kini dalam pertanyaan langsung; konteks sudah menunjukkan tindakan yang sedang berlangsung.
- source_word: τοῖς σάββασιν
  choice: pada hari Sabat
  rationale: Bentuk jamak Yunani merupakan ungkapan idiomatis yang dalam konteks ini menunjuk pada hari Sabat; bentuk tunggal adalah ungkapan Indonesia yang wajar.
- source_word: ὃ οὐκ ἔξεστιν
  choice: apa yang tidak diperbolehkan
  rationale: Mempertahankan gagasan tentang izin atau keabsahan tanpa menentukan apakah tolok ukurnya adalah Taurat, tradisi Farisi, atau penafsiran hukum yang lebih luas.
theological_decisions:
- issue: Dasar keberatan orang-orang Farisi
  choice: apa yang tidak diperbolehkan
  alternative: apa yang melanggar hukum
  rationale: Teks Yunani hanya menyatakan bahwa tindakan itu tidak diperbolehkan; terjemahan tidak menentukan secara sepihak apakah yang dimaksud ialah pelanggaran Taurat atau tradisi penafsiran tertentu.
- issue: Fungsi τί dalam pertanyaan
  choice: mengapa mereka melakukan
  alternative: apa yang mereka lakukan ... yang tidak diperbolehkan
  rationale: Makna 'mengapa' paling sesuai dengan fungsi pragmatis keluhan tersebut, tetapi ambiguitas leksikal Yunani dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Lalu' menjaga alur naratif; 'Lihat' mempertahankan seruan langsung; dan 'tidak diperbolehkan' menyampaikan nuansa hukum-keagamaan tanpa terdengar terlalu teknis.
