  text: ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν ἐν ⸂ἐκείνῃ τῇ ἡμέρᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/020.yaml
  text: But days will come when the bridegroom is taken away from them[a], and then they will fast in that day.
translation:
  language: id
  text: Namun, akan datang hari-hari ketika pengantin laki-laki diambil dari mereka, dan pada hari itu[a] mereka akan berpuasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Menurut bacaan yang diikuti di sini, frasa Yunani berbentuk tunggal, “pada hari itu”. Beberapa naskah memiliki bentuk jamak, “pada hari-hari itu”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Namun, akan datang hari-hari
  rationale: Ungkapan ini mempertahankan bentuk jamak ἡμέραι dan menyampaikan kontras δέ dengan keadaan sekarang secara alami dalam bahasa Indonesia.
- source_word: ὅταν
  choice: ketika
  rationale: Dengan verba aoristus subjungtif ἀπαρθῇ, kata ini menunjuk pada peristiwa mendatang dan paling wajar diterjemahkan “ketika”, bukan “setiap kali”.
- source_word: ἀπαρθῇ ἀπ’ αὐτῶν
  choice: diambil dari mereka
  rationale: Bentuk pasif dipertahankan tanpa menyebut pelaku atau cara pengambilan. Pilihan ini juga menjaga nuansa pemisahan yang mendadak.
- source_word: ὁ νυμφίος
  choice: pengantin laki-laki
  rationale: Istilah ini jelas dan lazim dalam bahasa Indonesia serta mempertahankan metafora pernikahan dalam teks Yunani.
- source_word: καὶ τότε
  choice: dan pada hari itu
  rationale: Urutan waktunya dipertahankan, sedangkan keterangan waktu berikutnya diterjemahkan bersama frasa ἐν ἐκείνῃ τῇ ἡμέρᾳ agar alami.
- source_word: νηστεύσουσιν
  choice: mereka akan berpuasa
  rationale: “Berpuasa” adalah padanan langsung dan umum bagi νηστεύω serta mempertahankan makna praktik keagamaannya.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: pada hari itu
  rationale: Bahasa Yunani memakai bentuk tunggal. “Pada hari itu” merupakan ungkapan waktu yang alami dalam bahasa Indonesia dan tidak mengubahnya menjadi bentuk jamak.
theological_decisions:
- issue: Identifikasi metaforis Yesus sebagai pengantin laki-laki
  choice: Mempertahankan sebutan “pengantin laki-laki” tanpa menjelaskannya sebagai Yesus di dalam teks utama.
  alternative: Mengganti metafora dengan “ketika Aku diambil dari mereka”.
  rationale: Konteks mengarahkan metafora itu kepada Yesus, tetapi teks Yunani tetap memakai metafora. Mempertahankannya menjaga daya sastra dan teologis ayat.
- issue: Sifat pengambilan pengantin laki-laki
  choice: Memakai bentuk pasif “diambil” tanpa menyebut pelaku, kematian, atau penyaliban.
  alternative: “diambil melalui kematian” atau “direnggut dari mereka”.
  rationale: Ayat ini mengantisipasi tersingkirnya Yesus, tetapi tidak menyebut pelaku maupun caranya secara eksplisit. Terjemahan tidak menyelesaikan ketegangan yang dibiarkan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan peralihan dari “hari-hari” yang jamak kepada “hari itu” yang tunggal, meskipun peralihan tersebut terasa menonjol.
