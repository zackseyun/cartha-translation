  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂ἔφη ὁ Ἰησοῦς⸃· Ἀμὴν λέγω ὑμῖν, οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ἀδελφοὺς ἢ ἀδελφὰς ἢ ⸂μητέρα ἢ πατέρα⸃ ἢ τέκνα ἢ ἀγροὺς ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/029.yaml
  text: Jesus said, “Truly I say to you, there is no one who has left house or brothers or sisters or mother or father or children or fields for my sake and for the sake of the gospel,”
translation:
  language: id
  text: Yesus berkata, “Sesungguhnya Aku berkata kepada kalian, tidak ada seorang pun yang telah meninggalkan rumah, saudara laki-laki, saudara perempuan, ibu, ayah, anak-anak, atau ladang demi Aku dan demi Injil,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: berkata
  rationale: Bentuk aoris dari φημί di sini secara sederhana memperkenalkan ucapan Yesus; 'berkata' alami dan tidak menambahkan nuansa menjawab atau menyatakan.
- source_word: Ἀμὴν
  choice: Sesungguhnya
  rationale: Dalam formula pembuka perkataan Yesus di Injil-Injil Sinoptik, ἀμήν menyatakan penegasan yang khidmat; 'Sesungguhnya' mempertahankan fungsi itu dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Terjemahan ini mempertahankan kelangsungan serta kekhidmatan rumusan Yunani. Huruf kapital pada 'Aku' mengikuti kebiasaan bahasa Indonesia untuk rujukan ilahi tanpa mengubah makna leksikal.
- source_word: οὐδείς ἐστιν ὃς
  choice: tidak ada seorang pun yang
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya universal dari konstruksi negatif Yunani.
- source_word: ἀφῆκεν
  choice: telah meninggalkan
  rationale: '''Telah meninggalkan'' menyampaikan tindakan yang sudah dilakukan dalam pernyataan umum ini. Kata ini tidak sekeras ''menelantarkan'' atau ''membuang'', sehingga tidak melebihkan gagasan Yunani.'
- source_word: οἰκίαν
  choice: rumah
  rationale: '''Rumah'' adalah padanan langsung dan konkret, tanpa menggeser makna menjadi rumah tangga atau keluarga.'
- source_word: ἀδελφοὺς
  choice: saudara laki-laki
  rationale: Bentuk maskulin ini menyebut saudara laki-laki secara khusus dan diikuti oleh sebutan terpisah bagi saudara perempuan.
- source_word: ἀδελφὰς
  choice: saudara perempuan
  rationale: Padanan langsung yang mempertahankan penyebutan terpisah berdasarkan jenis kelamin dalam teks Yunani.
- source_word: μητέρα
  choice: ibu
  rationale: Padanan langsung dan alami.
- source_word: πατέρα
  choice: ayah
  rationale: Padanan langsung dan alami dalam bahasa Indonesia modern.
- source_word: τέκνα
  choice: anak-anak
  rationale: τέκνα mencakup keturunan tanpa menentukan jenis kelamin; 'anak-anak' adalah padanan yang paling alami dan akurat.
- source_word: ἀγρούς
  choice: ladang
  rationale: ἀγρός menunjuk pada bidang tanah, khususnya tanah yang digarap; 'ladang' konkret dan lebih dekat daripada 'pertanian' atau 'tanah milik'.
- source_word: ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου
  choice: demi Aku dan demi Injil
  rationale: Pengulangan 'demi' mencerminkan pengulangan ἕνεκεν dan mempertahankan dua alasan yang disejajarkan dalam teks.
theological_decisions:
- issue: Penggambaran tindakan meninggalkan keluarga dan milik tanpa melebihkan penolakan terhadap kewajiban keluarga
  choice: telah meninggalkan rumah, saudara laki-laki, saudara perempuan, ibu, ayah, anak-anak, atau ladang
  alternative: telah menelantarkan ... / telah membuang ...
  rationale: '''Meninggalkan'' mempertahankan tuntutan dan harga pemuridan yang dinyatakan teks, tetapi tidak secara tidak sah menyimpulkan bahwa orang itu menolak semua tanggung jawab moral terhadap keluarganya.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur daftar dipertahankan secara jelas, sementara koma digunakan agar kalimat panjang tetap mudah dibaca. Ayat berakhir dengan koma karena kalimat dan perkataan Yesus berlanjut ke ayat berikutnya.
