  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐν τῇ ὁδῷ ἀναβαίνοντες εἰς Ἱεροσόλυμα, καὶ ἦν προάγων αὐτοὺς ὁ Ἰησοῦς, καὶ ἐθαμβοῦντο, ⸂οἱ δὲ⸃ ἀκολουθοῦντες ἐφοβοῦντο. καὶ παραλαβὼν πάλιν τοὺς δώδεκα ἤρξατο αὐτοῖς λέγειν τὰ μέλλοντα αὐτῷ συμβαίνειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/032.yaml
  text: They were on the road[a], going up to Jerusalem, and Jesus was going ahead of them; and they were astonished, while those who were following were afraid. And taking the Twelve aside again[b], he began to tell them the things that were about to happen to him.
translation:
  language: id
  text: Mereka sedang dalam perjalanan[a], naik ke Yerusalem, dan Yesus berjalan di depan mereka[b]. Mereka tercengang, sedangkan orang-orang yang mengikuti-Nya takut. Lalu Yesus kembali mengajak Kedua Belas itu menyendiri dan mulai memberitahukan kepada mereka apa yang akan terjadi pada diri-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di jalan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “mendahului mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ὁδῷ
  choice: sedang dalam perjalanan
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap menggambarkan keadaan mereka ketika menempuh perjalanan; alternatif yang lebih harfiah, “di jalan,” dicatat dalam catatan kaki.
- source_word: ἀναβαίνοντες εἰς Ἱεροσόλυμα
  choice: naik ke Yerusalem
  rationale: Mempertahankan ungkapan arah dalam bahasa Yunani, yang sesuai dengan letak Yerusalem di dataran tinggi dan bahasa perjalanan menuju kota itu.
- source_word: προάγων αὐτούς
  choice: berjalan di depan mereka
  rationale: Menggambarkan posisi Yesus secara langsung tanpa menambahkan secara pasti gagasan bahwa Ia sedang memimpin, meskipun makna itu mungkin tersirat.
- source_word: ἐθαμβοῦντο
  choice: tercengang
  rationale: Menyampaikan rasa takjub atau kebingungan yang kuat tanpa mempersempitnya menjadi kengerian.
- source_word: οἱ δὲ ἀκολουθοῦντες
  choice: orang-orang yang mengikuti dari belakang
  rationale: Mempertahankan bentuk partisipial dan tidak menentukan identitas kelompok itu lebih jauh daripada teks Yunani; “dari belakang” memperjelas hubungan spasial dalam konteks.
- source_word: ἐφοβοῦντο
  choice: merasa takut
  rationale: Padanan Indonesia yang lugas dan membedakan reaksi ini dari rasa tercengang pada kelompok sebelumnya.
- source_word: παραλαβὼν πάλιν τοὺς δώδεκα
  choice: kembali mengajak kedua belas murid itu menepi
  rationale: “Mengajak ... menepi” menyampaikan tindakan membawa kedua belas murid terpisah untuk pengajaran khusus, sedangkan “kembali” mempertahankan πάλιν.
- source_word: ἤρξατο αὐτοῖς λέγειν
  choice: mulai memberitahukan kepada mereka
  rationale: Bentuk yang wajar dalam bahasa Indonesia, mempertahankan aspek permulaan tindakan dan penerima pemberitahuan.
- source_word: τὰ μέλλοντα αὐτῷ συμβαίνειν
  choice: apa yang akan terjadi pada diri-Nya
  rationale: Mempertahankan makna peristiwa yang segera atau akan dialami Yesus tanpa menambahkan gagasan takdir yang lebih kuat daripada teks.
theological_decisions:
- issue: Perbedaan reaksi emosional antara kelompok utama dan orang-orang yang mengikuti
  choice: Menerjemahkan ἐθαμβοῦντο sebagai “tercengang” dan ἐφοβοῦντο sebagai “merasa takut.”
  alternative: Menyamakan keduanya sebagai bentuk umum rasa takjub atau gentar.
  rationale: Teks Yunani memakai dua verba berbeda dan tampaknya membedakan reaksi kedua kelompok. Perbedaan ini dipertahankan tanpa menjelaskan penyebab emosi mereka.
- issue: Nuansa προάγων αὐτούς
  choice: “berjalan di depan mereka”
  alternative: “memimpin mereka”
  rationale: Pilihan utama mempertahankan gambaran posisi Yesus dan tidak memastikan fungsi kepemimpinan yang hanya mungkin tersirat.
- issue: Kekuatan makna μέλλοντα
  choice: “akan terjadi”
  alternative: “ditakdirkan akan terjadi”
  rationale: Terjemahan utama mempertahankan sifat peristiwa yang akan datang tanpa memasukkan konsep keniscayaan atau takdir secara lebih tegas daripada konstruksi Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. “Kedua belas murid” dipakai agar sebutan “kedua belas” jelas bagi pembaca umum, tanpa mengubah identitas kelompok yang sudah dikenal dalam konteks. Penanda catatan kaki ditempatkan tepat pada frasa yang diterangkan.
