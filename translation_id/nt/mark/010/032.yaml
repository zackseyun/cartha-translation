revisions:
- from: Mereka sedang dalam perjalanan[a] naik ke Yerusalem. Yesus berjalan di depan mereka[b]. Mereka tercengang, sedangkan orang-orang yang mengikuti dari belakang merasa takut. Lalu Yesus kembali mengajak kedua belas murid itu menepi dan mulai memberitahukan kepada mereka apa yang akan terjadi pada diri-Nya.
  to: Mereka sedang dalam perjalanan[a], naik ke Yerusalem, dan Yesus berjalan di depan mereka[b]. Mereka tercengang, sedangkan orang-orang yang mengikuti-Nya takut. Lalu Yesus kembali mengajak Kedua Belas itu menyendiri dan mulai memberitahukan kepada mereka apa yang akan terjadi pada diri-Nya.
  rationale: Revisi menghapus penambahan yang tidak diperlukan (“dari belakang” dan “murid”), mempertahankan perbedaan dua reaksi emosional dalam teks Yunani, dan menyesuaikan catatan kaki b dengan makna posisi dari προάγων αὐτούς. Struktur kalimat tetap mencerminkan perjalanan menuju Yerusalem, Yesus yang berada di depan, dan pengajaran pribadi kepada Kedua Belas.
