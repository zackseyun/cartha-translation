review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan untuk menghindari tambahan nuansa spasial yang tidak eksplisit dalam οἱ ... ἀκολουθοῦντες. Teks Yunani membedakan kelompok yang tercengang dari mereka yang mengikuti dan takut; terjemahan revisi mempertahankan pembedaan itu tanpa menambahkan “dari belakang.” Terjemahan “Kedua Belas” mempertahankan sebutan τοὺς δώδεκα tanpa menambahkan nomina “murid.”
  naturalness: Teks revisi memakai Bahasa Indonesia baku modern dan alur naratif yang lebih padu. “Mengajak Kedua Belas itu menyendiri” secara alami menyampaikan tindakan mengambil mereka secara terpisah untuk pengajaran pribadi.
  terminology: Yerusalem, Yesus, dan “Kedua Belas” dipertahankan sebagai istilah naratif yang mapan. “Tercengang” dan “takut” tetap membedakan ἐθαμβοῦντο dari ἐφοβοῦντο. Catatan kaki b diperbaiki agar alternatifnya tetap dekat dengan arti posisi προάγων, bukan menambahkan kepemimpinan sebagai makna utama.
  issues:
  - severity: low
    issue: “dari belakang” ditambahkan pada “orang-orang yang mengikuti.”
    rationale: Partisip ἀκολουθοῦντες menyatakan bahwa mereka mengikuti, tetapi tidak secara eksplisit menyatakan frasa spasial “dari belakang.” Tambahan ini tidak diperlukan dan sedikit mempersempit ungkapan sumber.
  - severity: low
    issue: “kedua belas murid itu” menambahkan “murid.”
    rationale: τοὺς δώδεκα secara harfiah adalah “Kedua Belas.” Konteks memang mengidentifikasi mereka sebagai murid, tetapi sebutan sumber dapat dipertahankan secara lebih tepat tanpa penambahan.
  - severity: low
    issue: Catatan kaki b menawarkan “memimpin mereka.”
    rationale: Alternatif tersebut lebih interpretatif daripada προάγων αὐτούς, yang terutama menggambarkan Yesus berjalan atau mendahului mereka. Alternatif yang lebih dekat dengan sumber lebih tepat.
