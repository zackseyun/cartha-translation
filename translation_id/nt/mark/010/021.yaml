id: MRK.10.21
reference: Mark 10:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐμβλέψας αὐτῷ ἠγάπησεν αὐτὸν καὶ εἶπεν αὐτῷ· Ἕν ⸀σε ὑστερεῖ· ὕπαγε ὅσα ἔχεις πώλησον καὶ δὸς ⸀τοῖς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ, καὶ δεῦρο ἀκολούθει ⸀μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/021.yaml
  text: 'And Jesus[a], looking at him, loved him and said to him, “One thing you lack: go, sell whatever you have and give to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: id
  text: 'Yesus menatap dia dan mengasihinya, lalu berkata kepadanya, “Satu hal masih kurang padamu: pergilah, juallah segala yang kaumiliki[a] dan berikanlah kepada orang-orang miskin. Engkau akan memiliki harta di surga. Kemudian datanglah dan ikutlah Aku.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apa pun yang kaumiliki.” Ungkapan Yunani ὅσα ἔχεις dapat diterjemahkan dengan kedua cara tersebut; konteks menunjukkan bahwa seluruh miliknya tercakup.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψας
  choice: menatap dia
  rationale: Partisip aoris ini menggambarkan pandangan yang terarah dan penuh perhatian. “Menatap dia” alami dalam bahasa Indonesia dan mempertahankan intensitas yang wajar tanpa menambahkan tafsiran emosional.
- source_word: ἠγάπησεν αὐτόν
  choice: mengasihinya
  rationale: Menyatakan secara langsung bahwa Yesus sungguh mengasihi orang itu. Pilihan ini tidak melemahkannya menjadi sekadar keramahan dan tidak pula memberinya muatan teknis teologis yang tidak dinyatakan teks.
- source_word: Ἕν σε ὑστερεῖ
  choice: Satu hal masih kurang padamu
  rationale: Bentuk netral tunggal ἕν dipahami secara substantival sebagai “satu hal,” sedangkan ὑστερεῖ menyatakan kekurangan yang ada pada orang tersebut. “Masih” membuat ungkapan Indonesia alami dalam konteks tanpa mengubah inti pernyataan.
- source_word: ὕπαγε
  choice: pergilah
  rationale: Imperatif ini merupakan perintah langsung untuk pergi; “pergilah” adalah padanan Indonesia yang lugas.
- source_word: ὅσα ἔχεις
  choice: segala yang kaumiliki
  rationale: Ungkapan relatif ini dapat berarti “segala yang kaumiliki” atau “apa pun yang kaumiliki.” Konteks menunjukkan cakupan menyeluruh atas miliknya, sementara catatan kaki mempertahankan alternatif leksikalnya.
- source_word: πώλησον
  choice: juallah
  rationale: Imperatif aoris dengan arti jual yang langsung; bentuk “juallah” menyampaikan perintah secara tegas dan alami.
- source_word: δὸς τοῖς πτωχοῖς
  choice: berikanlah kepada orang-orang miskin
  rationale: Adjektiva substantival τοῖς πτωχοῖς menunjuk kepada orang miskin sebagai kelompok. Bentuk ini jelas dan alami bagi pembaca Indonesia modern.
- source_word: θησαυρὸν ἐν οὐρανῷ
  choice: harta di surga
  rationale: “Harta” mengungkapkan sesuatu yang bernilai dan tersimpan, sedangkan bentuk tunggal οὐρανῷ secara wajar diterjemahkan “surga” dalam konteks ini.
- source_word: δεῦρο
  choice: datanglah
  rationale: Adverbia imperatival ini mengundang gerak menuju pembicara. “Datanglah” menyampaikan undangan tersebut tanpa perlu menambahkan “ke sini.”
- source_word: ἀκολούθει μοι
  choice: ikutlah Aku
  rationale: Imperatif kini mengandung panggilan untuk mengikuti Yesus sebagai murid secara berkelanjutan. “Ikutlah Aku” merupakan ungkapan Indonesia yang alami dan mempertahankan daya panggilannya.
theological_decisions:
- issue: Makna kasih Yesus kepada orang itu
  choice: 'Diterjemahkan secara langsung sebagai kasih yang nyata: “mengasihinya.”'
  alternative: Memahaminya hanya sebagai keramahan lahiriah, atau secara teknis sebagai kasih pemilihan/perjanjian.
  rationale: Teks secara eksplisit menyatakan ἠγάπησεν αὐτόν. Terjemahan tidak boleh melemahkan kasih itu ataupun memasukkan sistem teologis yang melampaui pernyataan ayat, sehingga ketegangan naratif dan teologisnya tetap terpelihara.
- issue: Cakupan perintah mengenai harta milik
  choice: “Segala yang kaumiliki” mempertahankan kekuatan menyeluruh dari perintah dalam konteks.
  alternative: “Apa pun yang kaumiliki,” yang lebih dekat pada bentuk relatif tetapi dapat terdengar kurang tegas dalam bahasa Indonesia; atau melunakkannya menjadi anjuran umum untuk bermurah hati.
  rationale: ὅσα ἔχεις secara leksikal memungkinkan kedua ungkapan tersebut, tetapi dalam konteks perintah menjual dan memberi kepada orang miskin cakupannya bersifat menyeluruh. Catatan kaki menjaga alternatif bentuknya tanpa melunakkan perintah.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Bentuk imperatif berakhiran -lah mempertahankan rangkaian perintah Yesus, sedangkan “Aku” ditulis dengan huruf kapital sesuai kebiasaan umum dalam teks Alkitab bahasa Indonesia ketika merujuk kepada Yesus sebagai pembicara.
