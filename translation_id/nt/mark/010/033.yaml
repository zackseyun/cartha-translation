  source_fidelity: Revisi diperlukan karena ἀναβαίνομεν secara khusus menyatakan gerak “naik” menuju Yerusalem; “sedang pergi” menghilangkan unsur ini. Rangkaian παραδίδωμι dipertahankan dengan “diserahkan/menyerahkan”, dan τοῖς ἔθνεσιν paling jelas dalam konteks ini adalah “orang-orang bukan Yahudi”, bukan bangsa-bangsa sebagai entitas politis.
  naturalness: Teks revisi memakai bahasa Indonesia modern yang alami dan tetap bernada Alkitab. “Naik ke Yerusalem” lazim serta tepat secara geografis dan naratif. “Menjatuhkan hukuman mati atas-Nya” merupakan ungkapan yudisial yang wajar.
  terminology: “Anak Manusia”, “imam-imam kepala”, dan “ahli-ahli Taurat” tepat dan konsisten. “Orang-orang bukan Yahudi” menyampaikan fungsi kontekstual ἔθνεσιν tanpa mengubahnya menjadi istilah politik abstrak.
  issues:
  - severity: medium
    issue: ἀναβαίνομεν diterjemahkan “kita sedang pergi”.
    rationale: Terjemahan ini menyampaikan gerak menuju tujuan, tetapi tidak mempertahankan unsur “naik” yang terdapat dalam verba Yunani dan relevan bagi perjalanan ke Yerusalem.
  - severity: medium
    issue: “bangsa-bangsa lain” kurang tepat sebagai terjemahan utama untuk τοῖς ἔθνεσιν dalam konteks ini.
    rationale: Yang dimaksud ialah pihak/orang non-Yahudi yang menerima Yesus dari para pemimpin Yahudi, bukan bangsa-bangsa sebagai kesatuan politis. “Orang-orang bukan Yahudi” lebih jelas dalam bahasa Indonesia modern.
