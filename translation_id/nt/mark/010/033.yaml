  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ ⸀τοῖς γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/033.yaml
  text: that[a], ‘Look, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and the scribes[b], and they will condemn him to death and hand him over to the Gentiles.’
translation:
  language: id
  text: kata-Nya, “Lihat, kita sedang naik ke Yerusalem. Anak Manusia akan diserahkan[a] kepada imam-imam kepala dan ahli-ahli Taurat. Mereka akan menjatuhkan hukuman mati atas-Nya, lalu menyerahkan-Nya kepada orang-orang bukan Yahudi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “disampaikan”; kata kerja yang sama juga dipakai dalam “menyerahkan-Nya” kemudian dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: kata-Nya
  rationale: Kata ini memperkenalkan isi ucapan Yesus sebagai kelanjutan langsung dari ayat sebelumnya. Dalam bahasa Indonesia, tanda petik dan frasa pelapor 'kata-Nya' membuat hubungan sintaksis itu alami tanpa memberi arti sebab.
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: Penanda wacana yang menarik perhatian; 'Lihat' mempertahankan daya penegasannya dalam bahasa Indonesia modern.
- source_word: ἀναβαίνομεν
  choice: kita sedang pergi
  rationale: Bentuk kini menunjukkan perjalanan yang sedang berlangsung menuju Yerusalem. 'Pergi' lebih alami daripada 'naik' dalam bahasa Indonesia umum, sementara tujuan geografis tetap jelas dari konteks.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Padanan baku yang mempertahankan bentuk ungkapan, resonansi Kitab Suci, dan fungsi sebutan diri Yesus.
- source_word: παραδοθήσεται / παραδώσουσιν
  choice: akan diserahkan / menyerahkan
  rationale: Padanan yang sama dipertahankan pada kedua kemunculan untuk menampilkan rantai penyerahan dan tidak mempersempit kemunculan pertama menjadi 'dikhianati'.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: kepada imam-imam kepala
  rationale: Menunjuk kelompok pemimpin keimaman, bukan hanya seorang imam besar.
- source_word: τοῖς γραμματεῦσιν
  choice: ahli-ahli Taurat
  rationale: Padanan Indonesia yang lazim dan mudah dipahami bagi para ahli kitab atau hukum Yahudi dalam konteks Injil.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: menjatuhkan hukuman mati atas Dia
  rationale: Mengungkapkan tindakan penghakiman resmi dan hasilnya secara alami serta tepat dalam bahasa Indonesia.
- source_word: τοῖς ἔθνεσιν
  choice: kepada bangsa-bangsa lain
  rationale: Mempertahankan bentuk jamak dan pembedaan antara orang Yahudi dan bangsa-bangsa non-Yahudi tanpa mengabstraksikannya menjadi negara-negara.
theological_decisions:
- issue: Sebutan ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Manusia itu
  rationale: Bentuk tradisional dan harfiah ini mempertahankan gema Daniel serta bobot kristologis sebutan tersebut tanpa meratakannya menjadi ungkapan biasa.
- issue: Makna τοῖς ἔθνεσιν
  choice: bangsa-bangsa lain
  alternative: orang-orang bukan Yahudi
  rationale: Konteks penderitaan menunjuk pada penyerahan dari para pemimpin Yahudi kepada pihak non-Yahudi. Pilihan utama menjaga bentuk jamak 'bangsa-bangsa' sekaligus menyatakan pembedaan kontekstual itu.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Sapaan 'kita' bersifat inklusif sesuai rombongan yang sedang menuju Yerusalem. Pengulangan 'diserahkan/menyerahkan' sengaja dipertahankan. Pronomina 'Dia' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Yesus.
