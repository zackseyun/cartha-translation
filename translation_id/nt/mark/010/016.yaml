  text: And he took them in his arms and blessed them[b][a], laying his hands on them.
translation:
  language: id
  text: Lalu Dia memeluk anak-anak itu[a] dan terus memberkati mereka[b] sambil meletakkan tangan-Nya atas mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “merengkuh anak-anak itu ke dalam pelukan-Nya.” Kata Yunani ini secara khusus menunjuk pada tindakan mengambil seseorang ke dalam pelukan.'
    reason: lexical_alternative
  - marker: b
    text: 'Bentuk kata kerja Yunani menunjukkan tindakan yang berlangsung atau berulang dan mungkin juga menyiratkan kesungguhan: “berulang kali memberkati mereka” atau “memberkati mereka dengan sungguh-sungguh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισάμενος
  choice: memeluk anak-anak itu
  rationale: Verba ini secara khusus menggambarkan tindakan merengkuh atau mengambil seseorang ke dalam pelukan. 'Memeluk anak-anak itu' alami dalam bahasa Indonesia dan mempertahankan kehangatan tindakan tersebut; penyebutan eksplisit 'anak-anak itu' memperjelas rujukan pronomina netral Yunani dari konteks.
- source_word: κατευλόγει
  choice: terus memberkati mereka
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung atau dilakukan berulang kali, sedangkan bentuk majemuk intensif dapat memberi nuansa kesungguhan. 'Terus memberkati' mempertahankan aspek yang jelas tanpa menambahkan tafsiran tentang bentuk upacara.
- source_word: τιθεὶς τὰς χεῖρας ἐπ’ αὐτά
  choice: sambil meletakkan tangan-Nya atas mereka
  rationale: Partisipel ini menyatakan tindakan yang menyertai pemberkatan. 'Sambil' menunjukkan keserentakan, dan 'meletakkan tangan ... atas' mempertahankan gambaran konkret serta ungkapan alkitabiah tanpa memasukkan istilah sakramental.
- source_word: αὐτὰ ... αὐτά
  choice: anak-anak itu ... mereka
  rationale: Pronomina tersebut merujuk kepada anak-anak dalam konteks langsung. Penyebutan nomina pada kemunculan pertama membuat ayat mandiri dan jelas, lalu 'mereka' menghindari pengulangan yang kaku.
- source_word: καὶ
  choice: Lalu
  rationale: Dalam alur narasi Markus, καί menghubungkan tindakan berikutnya. 'Lalu' terdengar alami dalam bahasa Indonesia dan menyampaikan kelanjutan naratif tanpa memberi hubungan sebab-akibat.
theological_decisions:
- issue: Sifat tindakan Yesus terhadap anak-anak
  choice: 'Mempertahankan tindakan konkret: memeluk, memberkati, dan meletakkan tangan atas mereka.'
  alternative: Merumuskan tindakan itu sebagai upacara atau pemberkatan sakramental.
  rationale: Teks menggambarkan penerimaan penuh kasih dan pemberkatan oleh Yesus, tetapi tidak menamai atau menetapkan suatu ritus. Terjemahan tidak boleh memasukkan kategori doktrinal yang tidak dinyatakan.
- issue: Nuansa aspek dan intensitas κατευλόγει
  choice: Menerjemahkan aspek berkelanjutan sebagai 'terus memberkati' dan mencatat kemungkinan nuansa kesungguhan dalam catatan kaki.
  alternative: Hanya 'memberkati' atau 'memberkati dengan sungguh-sungguh'.
  rationale: Bentuk imperfek mendukung tindakan berkelanjutan atau berulang, tetapi kadar intensitas verba majemuk tidak perlu dipastikan secara berlebihan. Pilihan ini menjaga aspek sambil membiarkan nuansa intensif tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki [a] dan [b] ditempatkan tepat sesudah unsur yang dijelaskan.
