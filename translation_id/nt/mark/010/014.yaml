id: MRK.10.14
reference: Mark 10:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ἠγανάκτησεν καὶ εἶπεν αὐτοῖς· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/014.yaml
  text: But when Jesus saw it[a], he was indignant and said to them, “Let the children come to me; do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: id
  text: Namun, ketika Yesus melihat hal itu, Ia marah dan berkata kepada mereka, “Biarkanlah anak-anak itu datang kepada-Ku; jangan menghalang-halangi mereka, sebab Kerajaan Allah adalah milik orang-orang seperti mereka.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “sebab Kerajaan Allah adalah milik orang-orang yang seperti ini.”'
    reason: Menunjukkan bentuk genitif Yunani dan mempertahankan kemungkinan nuansa ungkapan representatifnya.
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: Namun, ketika Yesus melihat hal itu
  rationale: Partisip aoris menyatakan keadaan yang memicu reaksi Yesus. 'Hal itu' diisi secara alami dari konteks sebelumnya, sedangkan 'Namun' menyampaikan kontras ringan terhadap tindakan para murid.
- source_word: ἠγανάκτησεν
  choice: Ia marah
  rationale: Kata ini menyatakan kemarahan atau kejengkelan yang kuat. 'Marah' adalah ungkapan Indonesia yang lugas dan alami tanpa menyiratkan hilangnya pengendalian diri.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: Biarkanlah anak-anak itu datang kepada-Ku
  rationale: Imperatif ἄφετε berarti mengizinkan atau membiarkan; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan daya perintahnya.
- source_word: μὴ κωλύετε αὐτά
  choice: jangan menghalang-halangi mereka
  rationale: κωλύω berarti merintangi atau mencegah. Bentuk ulang 'menghalang-halangi' lazim dan menonjolkan tindakan merintangi akses mereka kepada Yesus.
- source_word: τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ
  choice: sebab Kerajaan Allah adalah milik orang-orang seperti mereka
  rationale: Genitif τῶν τοιούτων secara idiomatis menyatakan bahwa Kerajaan Allah menjadi bagian atau milik orang-orang yang seperti anak-anak tersebut; τοιούτων bersifat representatif, bukan hanya menunjuk anak-anak yang hadir.
theological_decisions:
- issue: Makna ungkapan 'τῶν ... τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ'
  choice: Kerajaan Allah adalah milik orang-orang seperti mereka
  alternative: orang-orang semacam inilah yang memiliki Kerajaan Allah; sebab orang-orang seperti merekalah yang empunya Kerajaan Allah
  rationale: Terjemahan ini mempertahankan daya representatif τοιούτων tanpa menyatakan bahwa hanya anak-anak secara harfiah yang termasuk di dalamnya, dan tanpa menambahkan alasan doktrinal seperti kepolosan atau keselamatan otomatis yang tidak disebutkan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia. 'Anak-anak' dipilih tanpa tambahan 'kecil' karena παιδία sendiri tidak mengharuskan penekanan diminutif.
