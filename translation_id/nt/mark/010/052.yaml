  text: ⸂καὶ ὁ⸃ Ἰησοῦς εἶπεν αὐτῷ· Ὕπαγε, ἡ πίστις σου σέσωκέν σε. καὶ ⸀εὐθὺς ἀνέβλεψεν, καὶ ἠκολούθει ⸀αὐτῷ ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/052.yaml
  text: And Jesus said to him[a], “Go[c][b]; your faith has saved you.” And immediately he regained his sight and followed him on the road.
translation:
  language: id
  text: Lalu Yesus berkata kepadanya, “Pergilah! Imanmu[a] telah menyelamatkanmu[b].” Seketika itu juga ia dapat melihat kembali, lalu mengikuti Yesus di jalan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepercayaanmu.” Di sini “iman” menunjuk pada kepercayaan orang itu kepada Yesus.
    reason: alternative_reading
  - marker: b
    text: Atau “telah menyembuhkanmu” atau “telah memulihkanmu.” Kata Yunani yang digunakan dapat merujuk pada kesembuhan maupun keselamatan.
    reason: lexical_alternative
  - marker: c
    text: Atau “dalam perjalanan.” Ungkapan Yunani ini juga dapat dipahami sebagai “di jalan” atau “di jalan itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕπαγε
  choice: Pergilah
  rationale: Bentuk imperatif ini secara langsung menyuruh orang itu pergi. “Pergilah” alami dalam bahasa Indonesia dan tidak menambahkan unsur kepemilikan yang tidak ada dalam teks Yunani.
- source_word: πίστις
  choice: iman
  rationale: Dalam konteks ini kata tersebut menunjuk pada kepercayaan orang itu kepada Yesus. “Iman” mempertahankan istilah kunci dan cakupan teologisnya, sedangkan kemungkinan “kepercayaan” dicatat dalam catatan kaki.
- source_word: σέσωκέν
  choice: telah menyelamatkanmu
  rationale: Bentuk perfek dari σῴζω dapat menyatakan penyelamatan maupun pemulihan atau kesembuhan. Pilihan ini mempertahankan keluasan makna dan ketegangan antara kesembuhan jasmani yang langsung tampak dan keselamatan dalam arti lebih luas.
- source_word: εὐθύς
  choice: seketika itu juga
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kecepatan alur khas Injil Markus.
- source_word: ἀνέβλεψεν
  choice: dapat melihat kembali
  rationale: Dalam konteks penyembuhan orang buta, verba ini menyatakan pulihnya penglihatan, bukan sekadar tindakan menengadah.
- source_word: ἠκολούθει
  choice: mengikuti
  rationale: Bentuk imperfek menggambarkan tindakan yang berlangsung. Dalam kalimat Indonesia, “lalu mengikuti” menyampaikan kelanjutan tindakan secara alami tanpa ungkapan yang kaku.
- source_word: αὐτῷ
  choice: Yesus
  rationale: Pronomina Yunani berarti “dia/nya”; menyebut “Yesus” menghindari ketidakjelasan rujukan dalam bahasa Indonesia tanpa mengubah pelakunya.
- source_word: ἐν τῇ ὁδῷ
  choice: di jalan
  rationale: Terjemahan ini mempertahankan gambaran konkret perjalanan sekaligus tidak menutup kemungkinan nuansa “jalan” sebagai pola mengikut Yesus.
- source_word: καὶ ὁ Ἰησοῦς
  choice: Lalu Yesus
  rationale: “Lalu” menyampaikan hubungan naratif καί secara alami dalam bahasa Indonesia modern tanpa memberi penafsiran kausal.
theological_decisions:
- issue: Makna σῴζω dalam pernyataan Yesus
  choice: telah menyelamatkanmu
  alternative: telah menyembuhkanmu; telah memulihkanmu
  rationale: Konteks langsung menunjukkan pemulihan penglihatan, tetapi verba Yunani juga dapat menunjuk pada keselamatan yang lebih luas. Terjemahan utama tidak mempersempit maknanya hanya pada kesembuhan jasmani.
- issue: Makna πίστις dalam konteks penyembuhan
  choice: iman
  alternative: kepercayaan
  rationale: Yang dimaksud ialah sikap percaya dan bersandar kepada Yesus. “Iman” mempertahankan istilah teologis yang lazim, sementara “kepercayaan” tetap diakui sebagai padanan kontekstual.
- issue: Nuansa ἐν τῇ ὁδῷ
  choice: di jalan
  alternative: dalam perjalanan; di Jalan itu
  rationale: “Di jalan” mempertahankan latar perjalanan yang konkret dan kemungkinan gema pemuridan tanpa mengubahnya menjadi istilah teologis eksplisit yang tidak dituntut oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami, dengan nada naratif yang tetap bermartabat. Tanda seru sesudah “Pergilah” menghasilkan perintah yang wajar dalam dialog Indonesia. Nama “Yesus” diulang untuk memperjelas rujukan pronomina tanpa memakai kapitalisasi pronomina yang bersifat tradisional-denominasional.
