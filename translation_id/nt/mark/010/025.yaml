id: MRK.10.25
reference: Mark 10:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸂τῆς τρυμαλιᾶς τῆς⸃ ῥαφίδος ⸀διελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/025.yaml
  text: It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God[a][b][c].
translation:
  language: id
  text: Lebih mudah seekor unta melewati lubang jarum daripada seorang kaya masuk ke dalam Kerajaan Allah.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ada yang mengusulkan “tali” sebagai ganti “unta”, tetapi teks Yunani di sini berbunyi “unta”.
    reason: alternative_reading
  - marker: b
    text: “Seorang kaya” menerjemahkan bentuk maskulin tunggal dalam bahasa Yunani; ucapan ini berlaku secara representatif.
    reason: cultural_note
lexical_decisions:
- source_word: εὐκοπώτερόν
  choice: Lebih mudah
  rationale: Bentuk komparatif ini menyatakan bahwa sesuatu lebih mudah atau lebih mungkin dilakukan; padanan ini alami dalam bahasa Indonesia dan mempertahankan perbandingan hiperbolis.
- source_word: κάμηλον
  choice: seekor unta
  rationale: Teks Yunani memakai κάμηλος, yaitu 'unta'. Kata bantu bilangan 'seekor' wajar untuk hewan dalam bahasa Indonesia.
- source_word: διὰ τῆς τρυμαλιᾶς τῆς ῥαφίδος
  choice: melewati lubang jarum
  rationale: Frasa ini menunjuk pada lubang tempat benang dimasukkan pada jarum jahit. 'Lubang jarum' merupakan ungkapan Indonesia yang jelas dan tepat.
- source_word: διελθεῖν
  choice: melewati
  rationale: Infinitif διέρχομαι berarti bergerak atau lewat menembus sesuatu; 'melewati' sesuai dengan gambaran konkret unta dan lubang jarum.
- source_word: πλούσιον
  choice: seorang kaya
  rationale: Adjektiva maskulin tunggal ini dipakai secara substantival. 'Seorang kaya' mempertahankan bentuk tunggal dan daya representatifnya tanpa menambahkan kata yang tidak diperlukan.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: masuk ke dalam Kerajaan Allah
  rationale: '''Kerajaan Allah'' adalah padanan mapan bagi βασιλεία τοῦ θεοῦ, sedangkan ''masuk ke dalam'' secara alami menyampaikan gerak menuju ranah kerajaan itu.'
- source_word: εἰσελθεῖν
  choice: masuk
  rationale: Infinitif εἰσέρχομαι berarti masuk; padanan ringkas ini alami bersama frasa 'ke dalam Kerajaan Allah'.
theological_decisions:
- issue: Penafsiran gambaran unta dan lubang jarum
  choice: Mempertahankan gambaran harfiah yang hiperbolis tentang seekor unta dan lubang jarum.
  alternative: Menafsirkannya sebagai gerbang kecil yang konon bernama 'Lubang Jarum', atau mengganti 'unta' dengan 'tali'.
  rationale: Teks Yunani menyajikan gambaran ekstrem ini tanpa menyebut gerbang. Terjemahan perlu mempertahankan ketegangan dan daya hiperbolis ucapan Yesus, bukan memasukkan penjelasan kemudian yang tidak didukung oleh teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang lugas dan bermartabat. Ungkapan 'lubang jarum' sudah alami sehingga catatan alternatif yang hanya membalik susunan kata tidak diperlukan. Huruf kapital pada 'Kerajaan Allah' mengikuti kelaziman penerbitan Alkitab bahasa Indonesia.
