id: MRK.10.49
reference: Mark 10:49
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς εἶπεν· ⸂Φωνήσατε αὐτόν⸃. καὶ φωνοῦσι τὸν τυφλὸν λέγοντες αὐτῷ· Θάρσει, ⸀ἔγειρε, φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/049.yaml
  text: And Jesus stopped and said[a], “Call him.” And they called the blind man, saying to him, “Take courage; get up[b], he is calling you.”
translation:
  language: id
  text: Lalu Yesus berhenti[a] dan berkata, “Panggillah dia.” Mereka pun memanggil orang buta itu dan berkata kepadanya, “Tabahkan hatimu[b]! Bangunlah, dia memanggilmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “setelah berdiri”; dalam konteks ini dapat juga diterjemahkan “berdiri diam.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Kuatkan hatimu” atau “Beranilah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς
  choice: berhenti
  rationale: Bentuk partisip dari ἵστημι secara harfiah berkaitan dengan berdiri, tetapi dalam alur cerita ini menyatakan bahwa Yesus menghentikan langkah-Nya. “Berhenti” alami dan tepat dalam bahasa Indonesia.
- source_word: Φωνήσατε αὐτόν
  choice: Panggillah dia
  rationale: φωνέω di sini berarti memanggil seseorang agar datang. Bentuk “Panggillah” mempertahankan daya perintah dan pengulangan verba yang sama dalam ayat ini.
- source_word: φωνοῦσι
  choice: memanggil
  rationale: Pilihan ini mempertahankan pengulangan leksikal dengan perintah Yesus dan terdengar wajar dalam narasi Indonesia.
- source_word: τὸν τυφλὸν
  choice: orang buta itu
  rationale: τυφλός dipakai secara substantival dan menunjuk kepada seorang laki-laki yang telah dikenal dalam konteks. “Orang buta itu” alami dan tidak menambahkan nama yang tidak terdapat dalam ayat.
- source_word: Θάρσει
  choice: Tabahkan hatimu
  rationale: Imperatif ini memberi dorongan agar orang tersebut berani dan berbesar hati. “Tabahkan hatimu” jelas, bermartabat, dan mempertahankan nuansa penguatan hati.
- source_word: ἔγειρε
  choice: Bangunlah
  rationale: Imperatif ἐγείρω memerintahkan seseorang untuk bangkit dari posisi duduk atau berbaring. Dalam konteks pengemis yang duduk di pinggir jalan, “Bangunlah” merupakan ungkapan Indonesia yang alami.
- source_word: φωνεῖ σε
  choice: dia memanggilmu
  rationale: Bentuk kini menyampaikan panggilan yang sedang berlaku pada saat itu. Bahasa Indonesia tidak wajib menandai aspek progresif, sehingga “dia memanggilmu” ringkas dan langsung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Pengulangan kata “memanggil” dipertahankan untuk mencerminkan pengulangan φωνέω dalam teks Yunani. Kata ganti “dia” tidak dikapitalisasi karena teks Yunani tidak menandai penghormatan melalui kapitalisasi.
