base_translation:
  language: en
  yaml_path: translation/nt/mark/010/012.yaml
  text: and if she divorces her husband and marries another man[a], she commits adultery.
translation:
  language: id
  text: Dan jika seorang istri menceraikan suaminya lalu menikah dengan laki-laki lain[a], ia berzina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “menyuruh pergi suaminya.” Dalam konteks perkawinan ini, maksudnya ialah “menceraikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Kata penghubung ini mengaitkan pernyataan tersebut dengan kasus sejajar pada ayat sebelumnya.
- source_word: ἐὰν
  choice: jika
  rationale: Memperkenalkan klausa bersyarat dan merupakan padanan alami dalam perkataan hukum-moral ini.
- source_word: αὐτὴ
  choice: seorang istri
  rationale: Subjek feminin dibuat jelas secara alami dalam bahasa Indonesia; konteks perkawinan menunjukkan bahwa perempuan tersebut adalah seorang istri.
- source_word: ἀπολύσασα
  choice: menceraikan
  rationale: Dalam konteks perkawinan, ἀπολύω mengacu pada perceraian, bukan sekadar menyuruh pergi.
- source_word: τὸν ἄνδρα αὐτῆς
  choice: suaminya
  rationale: Dalam konteks perkawinan, ἀνήρ berarti suami.
- source_word: γαμήσῃ ἄλλον
  choice: menikah dengan laki-laki lain
  rationale: ἄλλον berbentuk maskulin; frasa ini mempertahankan kekhususan gender sumber dan terdengar wajar dalam bahasa Indonesia.
- source_word: μοιχᾶται
  choice: ia berzina
  rationale: Padanan langsung, ringkas, dan alami untuk verba kini yang menyatakan tindakan perzinaan.
theological_decisions:
- issue: Apakah kekhususan gender dalam perkataan ini perlu dipertahankan
  choice: 'Subjek perempuan dan pasangan baru laki-laki dinyatakan secara eksplisit: “jika seorang istri ... menikah dengan laki-laki lain”.'
  alternative: “jika ia ... menikah dengan orang lain”
  rationale: Teks Yunani secara khusus memakai subjek feminin dan objek maskulin. Mempertahankannya menjaga kesejajaran yang disengaja dengan ayat sebelumnya tanpa menetralkan teks.
- issue: Apakah ἀπολύω diterjemahkan secara harfiah atau sebagai istilah perkawinan
  choice: “menceraikan”
  alternative: “menyuruh pergi”
  rationale: Konteksnya adalah pembubaran perkawinan. “Menceraikan” menyampaikan daya hukum-perkawinan ungkapan tersebut tanpa mengimpor penafsiran tambahan.
translation_notes:
  register: Bahasa Indonesia modern, baku, ringkas, dan bermartabat. “Seorang istri” lebih alami daripada pronomina “ia” sebagai pembuka mandiri serta memperjelas subjek feminin; “lalu” menyampaikan urutan partisip aoristus dan verba utama secara wajar.
