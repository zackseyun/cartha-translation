id: MRK.10.31
reference: Mark 10:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ⸀οἱ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/031.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: id
  text: Namun, banyak orang yang pertama akan menjadi yang terakhir, dan yang terakhir menjadi yang pertama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: banyak orang
  rationale: Adjektiva ini dipakai secara substantival dan menunjuk pada kelompok luas, bukan setiap orang tanpa kecuali. Penambahan 'orang' membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Partikel δέ menandai peralihan dengan kontras ringan terhadap janji pada ayat sebelumnya. 'Namun' menyampaikan daya adversatif itu secara wajar dan bermartabat.
- source_word: ἔσονται
  choice: akan menjadi
  rationale: Bentuk futur dari εἰμί di sini menyatakan keadaan atau kedudukan pada masa mendatang. Dalam konstruksi pembalikan kedudukan ini, 'akan menjadi' lebih alami daripada 'akan berada'.
- source_word: πρῶτοι
  choice: yang pertama
  rationale: πρῶτοι menunjuk pada peringkat atau kedudukan. 'Yang pertama' mempertahankan ungkapan ringkas dan paradoksal tanpa menentukan jenis kedudukan tersebut.
- source_word: ἔσχατοι
  choice: yang terakhir
  rationale: ἔσχατοι berlawanan langsung dengan πρῶτοι dalam hal kedudukan. 'Yang terakhir' mempertahankan antitesis tersebut tanpa mempersempitnya menjadi 'yang paling rendah'.
- source_word: οἱ ἔσχατοι
  choice: yang terakhir
  rationale: Artikel menjadikan frasa ini substantival. Bahasa Indonesia secara alami dapat memakai 'yang terakhir', dengan nomina 'orang' dipahami dari konteks.
- source_word: καὶ
  choice: dan
  rationale: Konjungsi ini menghubungkan kedua bagian perkataan secara sederhana dan mempertahankan kesejajarannya.
theological_decisions:
- issue: Sifat pembalikan antara yang pertama dan yang terakhir
  choice: Pernyataan diterjemahkan sebagai prinsip umum tentang pembalikan kedudukan tanpa menetapkan kategori sosial, moral, atau keselamatan tertentu.
  alternative: Menafsirkannya secara khusus sebagai pembalikan antara orang kaya dan miskin, antara murid dan orang luar, atau sebagai aturan mutlak bagi setiap individu.
  rationale: Ayat ini menyampaikan paradoks yang luas dan tidak mendefinisikan secara terperinci siapa yang termasuk 'yang pertama' dan 'yang terakhir'. Terjemahan mempertahankan keterbukaan dan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas, alami, dan bermartabat. Susunan paralel dipertahankan untuk menjaga daya aforistik perkataan Yesus. Tidak diperlukan catatan kaki karena bentuk eksplisit 'banyak orang' sudah hadir dalam teks utama dan tidak ada varian atau ambiguitas yang perlu dijelaskan di luar teks.
