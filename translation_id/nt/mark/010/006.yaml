  text: ἀπὸ δὲ ἀρχῆς κτίσεως ἄρσεν καὶ θῆλυ ἐποίησεν ⸀αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/006.yaml
  text: But from the beginning of creation[b][a], he made them male and female.
translation:
  language: id
  text: Namun, sejak awal penciptaan, Ia menjadikan[a] mereka laki-laki dan perempuan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menciptakan.” Kata Yunani di sini berarti “menjadikan” atau “membuat,” sedangkan “menciptakan” menonjolkan latar kisah Kejadian.
    reason: lexical_alternative
  - marker: b
    text: Susunan yang lebih dekat dengan urutan kata Yunani ialah, “laki-laki dan perempuan Ia menjadikan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ
  choice: sejak
  rationale: Dalam ungkapan waktu ἀπὸ ἀρχῆς, “sejak awal” merupakan bahasa Indonesia yang alami dan tetap menunjukkan titik asal dalam waktu.
- source_word: δὲ
  choice: Namun
  rationale: Partikel δέ menyatakan pertentangan dengan kelonggaran mengenai perceraian yang disebut dalam konteks sebelumnya.
- source_word: ἀρχῆς κτίσεως
  choice: awal penciptaan
  rationale: Ungkapan ini mempertahankan hubungan genitif antara “awal” dan “penciptaan” tanpa memperluasnya menjadi “tatanan ciptaan”.
- source_word: ἄρσεν καὶ θῆλυ
  choice: laki-laki dan perempuan
  rationale: Pilihan ini mempertahankan pasangan istilah mengenai jenis kelamin dalam kutipan kisah penciptaan dan lebih alami daripada “jantan dan betina” ketika merujuk kepada manusia.
- source_word: ἐποίησεν
  choice: menjadikan
  rationale: Kata ποιέω secara langsung berarti membuat atau menjadikan. “Menjadikan” terdengar alami dalam konstruksi ini dan tidak mengganti verba Yunani tersebut dengan istilah khusus “menciptakan.”
- source_word: αὐτούς
  choice: mereka
  rationale: Pronomina ini merujuk kepada manusia yang dijadikan laki-laki dan perempuan; “mereka” menyampaikan rujukan itu tanpa menambahkan penekanan seperti “keduanya.”
theological_decisions:
- issue: Penerjemahan istilah jenis kelamin dalam kutipan Kejadian
  choice: laki-laki dan perempuan
  alternative: pria dan wanita; jantan dan betina
  rationale: “Laki-laki dan perempuan” mempertahankan pasangan jenis kelamin yang dimaksud sumber sekaligus tetap wajar dan bermartabat bagi pembaca Indonesia.
- issue: Subjek ilahi yang tersirat dalam verba Yunani
  choice: Ia menjadikan mereka
  alternative: Allah menjadikan mereka
  rationale: Bahasa Yunani hanya menyiratkan subjek orang ketiga tunggal. “Ia” membuat kalimat Indonesia jelas tanpa menambahkan nama “Allah” ke dalam teks ayat.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Namun” mempertahankan pertentangan kontekstual; “Ia” menjaga subjek ilahi tetap tersirat seperti dalam sumber, sementara kapitalisasi mengikuti kebiasaan bahasa Indonesia untuk rujukan kepada Allah.
