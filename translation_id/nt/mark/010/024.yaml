  text: οἱ δὲ μαθηταὶ ἐθαμβοῦντο ἐπὶ τοῖς λόγοις αὐτοῦ. ὁ δὲ Ἰησοῦς πάλιν ἀποκριθεὶς λέγει αὐτοῖς· Τέκνα, πῶς δύσκολόν ⸀ἐστιν εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/024.yaml
  text: But the disciples were astonished at his words. Jesus answered again and said to them[a], “Children, how difficult it is to enter the kingdom of God!”
translation:
  language: id
  text: Namun, murid-murid tercengang mendengar perkataan-Nya. Yesus menjawab lagi dan berkata kepada mereka[a], “Anak-anak, betapa sulitnya masuk ke dalam Kerajaan Allah!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi, “Anak-anak, betapa sulitnya bagi orang yang mengandalkan kekayaan untuk masuk ke dalam Kerajaan Allah.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐθαμβοῦντο
  choice: tercengang
  rationale: Bentuk imperfek menggambarkan reaksi yang sedang berlangsung. “Tercengang” menyampaikan keheranan yang kuat secara alami tanpa melebih-lebihkan maknanya.
- source_word: ἐπὶ τοῖς λόγοις αὐτοῦ
  choice: mendengar perkataan-Nya
  rationale: ἐπί dengan datif menunjukkan dasar atau objek ketercengangan mereka. Dalam bahasa Indonesia, “tercengang mendengar perkataan-Nya” lebih alami daripada bentuk harfiah “tercengang atas perkataan-Nya” dan tetap mempertahankan hubungan maknanya.
- source_word: πάλιν
  choice: lagi
  rationale: Kata ini menandai bahwa Yesus kembali berbicara; “lagi” ringkas dan alami dalam alur narasi.
- source_word: ἀποκριθεὶς λέγει
  choice: berkata
  rationale: Ungkapan naratif Yunani ini secara harfiah memadukan “menjawab” dan “berkata”. Karena ucapan Yesus merupakan tanggapan terhadap reaksi para murid, bahasa Indonesia yang wajar cukup memakai “berkata”; unsur tanggapan tetap jelas dari konteks.
- source_word: Τέκνα
  choice: Anak-anak
  rationale: Sapaan ini hangat dan bersifat kekeluargaan. “Anak-anak” mempertahankan kelembutan sapaan tanpa menambahkan kata kepunyaan yang tidak terdapat dalam teks Yunani.
- source_word: πῶς δύσκολόν ἐστιν
  choice: betapa sulitnya
  rationale: πῶς bersifat seruan dan menguatkan pernyataan. “Betapa sulitnya” mempertahankan tekanan tersebut dalam bahasa Indonesia yang alami dan bermartabat.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: masuk ke dalam Kerajaan Allah
  rationale: Frasa infinitif ini menyatakan hal yang sulit dilakukan. “Masuk ke dalam Kerajaan Allah” merupakan ungkapan Indonesia yang jelas dan lazim.
theological_decisions:
- issue: Apakah frasa varian “bagi orang yang mengandalkan kekayaan” dimasukkan setelah “betapa sulitnya”
  choice: 'Mengikuti bacaan pendek SBLGNT: “betapa sulitnya masuk ke dalam Kerajaan Allah”'
  alternative: “Anak-anak, betapa sulitnya bagi orang yang mengandalkan kekayaan untuk masuk ke dalam Kerajaan Allah”
  rationale: Teks sumber yang diberikan memuat bacaan pendek. Bacaan ini mempertahankan keluasan dan ketegangan pernyataan Yesus, sedangkan bacaan panjang mempersempit penerapannya. Karena bacaan panjang dikenal luas dan memengaruhi penafsiran, bacaan itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang alami, jelas, dan bermartabat. Sapaan “Anak-anak” mempertahankan kehangatan teks, sedangkan “betapa sulitnya” menjaga daya seru dan ketegangan teologis bacaan pendek.
