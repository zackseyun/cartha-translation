  text: καὶ γὰρ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/045.yaml
  text: For even the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: id
  text: Sebab Anak Manusia pun datang bukan untuk dilayani, melainkan untuk melayani dan memberikan nyawa-Nya sebagai tebusan bagi banyak orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebagai tebusan sebagai pengganti banyak orang.” Kata depan yang diterjemahkan “bagi” dapat mengandung arti penggantian atau pertukaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sebab ... pun
  rationale: “Sebab” mempertahankan fungsi γάρ yang menjelaskan dan mendasari ajaran sebelumnya, sedangkan “pun” menyampaikan penekanan καί secara alami dalam bahasa Indonesia.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Ini adalah sebutan diri Yesus yang sudah mapan dan mempertahankan kaitan antarteksnya, termasuk gema dari kitab Daniel.
- source_word: οὐκ ἦλθεν
  choice: datang bukan
  rationale: Ungkapan ini menyampaikan tindakan datang dan, bersama bentuk infinitif berikutnya, menunjukkan tujuan kedatangan-Nya.
- source_word: διακονηθῆναι
  choice: untuk dilayani
  rationale: Bentuk pasif diterjemahkan secara langsung dan dipasangkan dengan “untuk melayani” agar pembalikan retorisnya tetap jelas.
- source_word: ἀλλὰ διακονῆσαι
  choice: melainkan untuk melayani
  rationale: “Melainkan” menandai pertentangan yang tegas, sementara pengulangan akar kata “layan” mempertahankan kesejajaran dengan “dilayani”.
- source_word: δοῦναι
  choice: memberikan
  rationale: Ini mempertahankan arti dasar verba tersebut tanpa mempersempitnya menjadi tindakan penyerahan tertentu yang tidak dinyatakan secara eksplisit.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: nyawa-Nya
  rationale: Dalam konteks ini ψυχή menunjuk pada hidup yang diserahkan sampai mati. “Nyawa-Nya” alami dalam bahasa Indonesia dan lebih tepat daripada “jiwa-Nya,” yang dapat dipahami hanya sebagai unsur nonjasmani.
- source_word: λύτρον
  choice: tebusan
  rationale: “Tebusan” secara ringkas menyampaikan harga yang diberikan untuk pembebasan dan mempertahankan bobot metaforanya.
- source_word: ἀντὶ πολλῶν
  choice: bagi banyak orang
  rationale: Ungkapan ini alami dalam teks utama. Karena ἀντί dapat menyatakan pertukaran atau penggantian dengan lebih tegas daripada “bagi,” nuansa itu dicantumkan dalam catatan kaki.
theological_decisions:
- issue: Daya makna ἀντί dalam perkataan tentang tebusan
  choice: Teks utama memakai “bagi banyak orang,” dengan nuansa penggantian dijelaskan dalam catatan kaki.
  alternative: sebagai ganti banyak orang
  rationale: ἀντί paling wajar dapat menunjukkan pertukaran atau penggantian. Terjemahan utama tetap lancar dan tidak memaksakan penjelasan teologis ke dalam kalimat, sedangkan catatan kaki mempertahankan daya leksikal yang lebih kuat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pasangan “dilayani—melayani” dipertahankan untuk menampilkan kontras retoris. “Nyawa-Nya” dipilih agar makna penyerahan hidup sampai mati jelas bagi pembaca umum.
