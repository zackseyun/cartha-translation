  yaml_path: translation/nt/mark/010/011.yaml
  text: And he says to them[a], “Whoever divorces his wife and marries another commits adultery against her.”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Siapa pun yang menceraikan istrinya lalu menikahi perempuan lain, ia melakukan perzinaan terhadap istrinya itu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis khas narasi Markus diterjemahkan secara alami dengan bentuk lampau netral bahasa Indonesia; kata kerja bahasa Indonesia sendiri tidak menandai kala.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Pronomina datif ini secara wajar menyatakan pihak yang menerima perkataan.
- source_word: Ὃς ἂν
  choice: Siapa pun yang
  rationale: Gabungan pronomina relatif dan ἄν membentuk kondisi umum tak tentu; ungkapan ini alami dan tidak mempersempit cakupannya secara tidak perlu.
- source_word: ἀπολύσῃ
  choice: menceraikan
  rationale: Dalam konteks perkawinan, kata ini menunjuk pada perceraian, bukan sekadar menyuruh pergi.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: istrinya
  rationale: γυνή dapat berarti perempuan atau istri, tetapi unsur posesif dan konteks perceraian menuntut arti istri.
- source_word: γαμήσῃ ἄλλην
  choice: menikahi perempuan lain
  rationale: ἄλλην berbentuk feminin dan mengacu pada perempuan lain; penyebutan eksplisit 'perempuan' paling jelas dan alami dalam bahasa Indonesia.
- source_word: μοιχᾶται
  choice: berzina
  rationale: Ini adalah padanan baku dan ringkas untuk tindakan melakukan perzinaan dalam konteks tersebut.
- source_word: ἐπ’ αὐτήν
  choice: terhadap istrinya itu
  rationale: Frasa ini menyatakan arah atau sasaran pelanggaran terhadap istri yang diceraikan. Pengulangan 'istrinya itu' memperjelas anteseden tanpa menghapus daya frasa Yunani.
theological_decisions:
- issue: Daya ἐπ’ αὐτήν sebagai pelanggaran yang dilakukan terhadap istri
  choice: berzina terhadap istrinya itu
  alternative: berzina; berzina dengan perempuan lain
  rationale: Frasa Yunani tersebut tidak boleh dihilangkan atau diubah menjadi keterangan pasangan zina. Terjemahan ini mempertahankan penekanan bahwa tindakan sang suami merupakan kesalahan terhadap istri yang diceraikannya.
- issue: Rumusan maskulin generik
  choice: Siapa pun yang
  alternative: Setiap laki-laki yang
  rationale: Konstruksi Yunani merupakan kondisi umum tak tentu. 'Siapa pun yang' mempertahankan sifat umum itu, sedangkan konteks suami tetap nyata melalui kata 'istrinya'.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Lalu' menyambungkan ujaran ini dengan konteks naratif. Tidak diperlukan catatan kaki karena makna feminin ἄλλην dinyatakan langsung sebagai 'perempuan lain'.
