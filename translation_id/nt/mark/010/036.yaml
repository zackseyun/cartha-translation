  text: And he said to them, “What do you want me to do for you?”
translation:
  language: id
  text: Lalu dia berkata kepada mereka, “Apa yang kalian inginkan aku lakukan untuk kalian?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Lalu dia
  rationale: Gabungan artikel dan δέ secara idiomatis melanjutkan alur narasi dengan subjek yang dipahami dari konteks. “Lalu dia” alami dalam bahasa Indonesia dan tidak memberi tekanan pertentangan yang berlebihan.
- source_word: εἶπεν
  choice: berkata
  rationale: Bentuk dari λέγω ini adalah verba umum untuk berbicara. Meskipun ucapannya berupa pertanyaan, “berkata” mempertahankan padanan leksikal langsung, sedangkan bentuk kalimatnya sendiri menyatakan pertanyaan.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Pronomina datif jamak ini secara langsung berarti “kepada mereka”. Kata “berdua” tidak ditambahkan karena tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: Τί
  choice: Apa
  rationale: Pronomina tanya netral ini membuka pertanyaan isi secara langsung dan wajar diterjemahkan “Apa”.
- source_word: θέλετε
  choice: kalian ingin
  rationale: θέλω menyatakan kehendak atau keinginan. “Kalian ingin” merupakan ungkapan bahasa Indonesia modern yang alami dan memperjelas bahwa subjeknya jamak.
- source_word: ποιήσω
  choice: aku lakukan
  rationale: Aoristus subjungtif setelah θέλετε menyatakan tindakan yang dikehendaki. Dalam konstruksi bahasa Indonesia, “ingin aku lakukan” secara alami menyampaikan arti tersebut; “lakukan” lebih tepat daripada “buat” dalam konteks ini.
- source_word: ὑμῖν
  choice: untuk kalian
  rationale: 'Datif ini bersifat benefaktif: tindakan itu hendak dilakukan demi atau bagi mereka. “Untuk kalian” menyampaikan fungsi tersebut dan mempertahankan bentuk jamak.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “dia/aku” tidak dikapitalisasi karena teks Yunani tidak menandai kapitalisasi penghormatan. “Kalian” dipakai untuk membedakan bentuk jamak ὑμεῖς dari bentuk tunggal tanpa menambahkan informasi yang tidak ada.
