source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ εἰς ὁδὸν προσδραμὼν εἷς καὶ γονυπετήσας αὐτὸν ἐπηρώτα αὐτόν· Διδάσκαλε ἀγαθέ, τί ποιήσω ἵνα ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/017.yaml
  text: And as he was going out onto the road[a], one man ran up and knelt before him and asked him, “Good Teacher, what must I do so that I may inherit eternal life?”
translation:
  language: id
  text: Ketika Yesus sedang berangkat[a], seorang laki-laki berlari mendekati-Nya, berlutut di hadapan-Nya, dan bertanya kepada-Nya, “Guru yang baik, apa yang harus kulakukan supaya aku mewarisi hidup kekal?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ketika Yesus keluar menuju jalan.” Ungkapan Yunani ini dapat berarti keluar menuju jalan atau mulai menempuh perjalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ εἰς ὁδόν
  choice: Ketika Yesus hendak berangkat melanjutkan perjalanan
  rationale: Genitivus absolutus memberi latar bagi tindakan utama, sedangkan εἰς ὁδόν dapat menunjuk pada keluar menuju jalan atau mulai menempuh perjalanan. Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan gagasan keberangkatan tanpa menentukan lokasi secara berlebihan.
- source_word: προσδραμὼν
  choice: berlari mendekati-Nya
  rationale: Partisip aoris ini menggambarkan pendekatan yang cepat dan mendesak; ungkapan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: εἷς
  choice: seorang laki-laki
  rationale: Kata bilangan maskulin yang dipakai secara substantival ini memperkenalkan seorang individu laki-laki dalam narasi.
- source_word: γονυπετήσας αὐτόν
  choice: berlutut di hadapan-Nya
  rationale: Kata kerjanya menyatakan tindakan berlutut di depan seseorang, suatu sikap hormat atau permohonan sungguh-sungguh, tanpa harus menambahkan intensitas 'menjatuhkan diri'.
- source_word: ἐπηρώτα αὐτόν
  choice: bertanya
  rationale: Imperfek dapat menyoroti tindakan yang sedang berlangsung, tetapi dalam narasi Indonesia bentuk sederhana 'bertanya' paling alami dan cukup menyampaikan tindakannya.
- source_word: Διδάσκαλε ἀγαθέ
  choice: Guru yang baik
  rationale: διδάσκαλος berarti guru, bukan tuan, dan ἀγαθέ merupakan sapaan adjektival yang penting bagi percakapan pada ayat berikutnya.
- source_word: τί ποιήσω
  choice: apa yang harus kulakukan
  rationale: Pertanyaan deliberatif ini menanyakan tindakan apa yang diperlukan; 'harus' menyampaikan daya praktisnya secara idiomatis tanpa menambahkan kesimpulan teologis.
- source_word: ἵνα
  choice: supaya
  rationale: Kata ini memperkenalkan tujuan atau hasil yang dimaksud dan diterjemahkan secara alami dengan 'supaya'.
- source_word: ζωὴν αἰώνιον
  choice: hidup kekal
  rationale: Ini adalah padanan Indonesia yang baku, jelas, dan mempertahankan bobot teologis ungkapan Yunani.
- source_word: κληρονομήσω
  choice: aku mewarisi
  rationale: κληρονομέω menunjuk pada menerima sebagai warisan. 'Mewarisi' mempertahankan metafora ahli waris yang akan hilang jika diterjemahkan hanya sebagai 'memperoleh'.
theological_decisions:
- issue: Sapaan laki-laki itu kepada Yesus
  choice: Guru yang baik
  alternative: Tuan yang baik
  rationale: Teks memakai διδάσκαλε, bukan κύριε. 'Guru' tidak memasukkan gelar yang lebih kuat daripada yang dinyatakan teks dan tetap menjaga arti 'baik' yang penting bagi jawaban Yesus berikutnya.
- issue: Penandaan gender pada εἷς
  choice: seorang laki-laki
  alternative: seseorang
  rationale: Bentuk maskulin tunggal dan konteks naratif mendukung rujukan kepada seorang laki-laki; terjemahan ini mempertahankan informasi yang ada dalam sumber.
- issue: Hubungan tindakan dengan warisan hidup kekal
  choice: apa yang harus kulakukan supaya aku mewarisi hidup kekal
  alternative: apa yang harus kulakukan untuk memperoleh hidup kekal
  rationale: Susunan ini mempertahankan pertanyaan tokoh sebagaimana adanya, termasuk ketegangan antara 'melakukan' dan 'mewarisi', tanpa menyelaraskannya terlebih dahulu dengan suatu rumusan teologis.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Nama 'Yesus' dipakai untuk memperjelas rujukan pronominal pada awal kutipan yang berdiri sendiri. Bentuk terikat 'kulakukan' dan pronomina 'aku' sesuai dengan ujaran langsung yang natural. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab Indonesia tanpa mengubah isi sumber.
