  yaml_path: translation/nt/mark/010/010.yaml
  text: And in the house again[b][a], the disciples were asking him about this.
translation:
  language: id
  text: Lalu, setelah masuk ke dalam rumah, murid-murid kembali bertanya kepada-Nya tentang hal itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Lalu, setelah kembali berada di dalam rumah, murid-murid bertanya kepada-Nya tentang hal itu.”
    reason: πάλιν (“kembali/lagi”) dapat dihubungkan dengan tindakan murid-murid yang kembali bertanya atau dengan kembalinya mereka ke dalam rumah.
lexical_decisions:
- source_word: Καὶ
  choice: Setelah
  rationale: Dalam alur narasi bahasa Indonesia, hubungan dengan adegan sebelumnya dinyatakan secara alami melalui anak kalimat situasional; makna penghubung Καὶ tetap terwakili tanpa memakai 'Dan' yang kaku pada awal kalimat.
- source_word: εἰς τὴν οἰκίαν
  choice: berada di dalam rumah
  rationale: Secara harfiah berarti 'ke dalam rumah', tetapi dalam konteks ini frasa tersebut menunjukkan tempat percakapan berikutnya setelah mereka masuk. 'Berada di dalam rumah' alami dalam bahasa Indonesia dan tidak memaksakan apakah rumah itu rumah sendiri.
- source_word: πάλιν
  choice: lagi
  rationale: Penempatan πάλιν secara sintaksis dapat dikaitkan dengan keadaan di rumah atau tindakan bertanya. Teks utama mengaitkannya dengan kembalinya mereka ke suasana di dalam rumah, sambil mempertahankan kemungkinan lain dalam catatan kaki.
- source_word: οἱ μαθηταὶ
  choice: murid-murid
  rationale: Artikel Yunani menunjuk kepada kelompok murid yang sudah dikenal dalam konteks; bahasa Indonesia tidak memerlukan kata kepunyaan tambahan.
- source_word: περὶ τούτου
  choice: tentang hal itu
  rationale: Padanan langsung dan alami yang merujuk pada persoalan yang baru dibahas.
- source_word: ἐπηρώτων
  choice: bertanya
  rationale: Bentuk imperfek menggambarkan tindakan lampau yang sedang berlangsung atau berulang. Bahasa Indonesia tidak wajib menandainya secara eksplisit; 'bertanya' menghindari penambahan makna inseptif 'mulai' yang tidak pasti.
- source_word: αὐτόν
  choice: kepada-Nya
  rationale: Pronomina merujuk kepada Yesus. Bentuk 'kepada-Nya' sesuai dengan konstruksi verba 'bertanya' dalam bahasa Indonesia; kapitalisasi mengikuti kebiasaan penerbitan Alkitab Indonesia.
