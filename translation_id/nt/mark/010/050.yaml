base_translation:
  language: en
  yaml_path: translation/nt/mark/010/050.yaml
  text: And throwing off his cloak[a], he sprang up and came to Jesus.
translation:
  language: id
  text: Ia pun melemparkan jubahnya[a], melonjak berdiri, lalu datang kepada Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pakaian luarnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβαλών
  choice: melemparkan
  rationale: Partisip aoris ini menggambarkan tindakan tegas dan mendadak menyingkirkan sesuatu; 'melemparkan' mempertahankan daya hidup adegan tanpa melunakkannya menjadi sekadar 'menanggalkan'.
- source_word: ἱμάτιον
  choice: jubah
  rationale: Dalam konteks ini ἱμάτιον menunjuk pada pakaian luar; 'jubah' ringkas, alami, dan mudah dipahami dalam bahasa Indonesia.
- source_word: ἀναπηδήσας
  choice: melompat berdiri
  rationale: Kata ini menyatakan gerakan bangkit yang mendadak dan penuh semangat. 'Melompat berdiri' mempertahankan unsur gerak naik sekaligus kecepatan tindakan.
- source_word: ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: datang kepada Yesus
  rationale: Gabungan ἔρχομαι dan πρός menyatakan gerakan menuju Yesus; 'datang kepada Yesus' merupakan ungkapan Indonesia yang wajar dan sesuai dengan sudut pandang narasi.
- source_word: δὲ
  choice: pun
  rationale: δέ di sini adalah penghubung ringan yang melanjutkan narasi, bukan pertentangan kuat. Partikel 'pun' secara alami menandai respons tokoh dalam rangkaian tindakan.
