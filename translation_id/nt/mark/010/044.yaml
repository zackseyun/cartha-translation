base_translation:
  language: en
  yaml_path: translation/nt/mark/010/044.yaml
  text: And whoever wants to be first among you will be the servant of all[a].
translation:
  language: id
  text: Dan siapa pun yang ingin menjadi yang pertama di antara kalian akan menjadi budak bagi semua orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba bagi semua orang.” Kata Yunani doulos lebih kuat daripada kata yang berarti “pelayan” pada ayat sebelumnya; karena itu, “budak” dipakai di sini untuk mempertahankan kontras tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: siapa pun yang ingin
  rationale: Gabungan pronomina relatif, ἄν, dan bentuk subjungtif menyatakan kondisi umum atau tak tentu; “siapa pun yang ingin” alami dalam bahasa Indonesia dan mempertahankan unsur kehendak.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Dalam konteks peringkat sosial di kalangan para murid, frasa ini berarti berada dalam lingkup kelompok mereka, bukan sekadar lokasi fisik.
- source_word: πρῶτος
  choice: yang pertama
  rationale: Mempertahankan arti peringkat atau kedudukan terkemuka serta kesejajaran dengan ajaran di sekitarnya.
- source_word: ἔσται
  choice: akan menjadi
  rationale: Menerjemahkan bentuk futur secara langsung tanpa menghilangkan daya tuntut yang timbul dari konteks pengajaran Yesus.
- source_word: πάντων
  choice: semua orang
  rationale: Genitif jamak menunjukkan hubungan ketundukan kepada semua; bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: δοῦλος
  choice: budak
  rationale: δοῦλος lebih kuat daripada διάκονος pada ayat sebelumnya. “Budak” mempertahankan peningkatan makna berupa keterikatan, ketundukan, dan status yang rendah.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam perkataan tentang kemuridan
  choice: budak
  alternative: pelayan; hamba
  rationale: Konteks membalik ambisi akan kedudukan melalui perendahan diri secara radikal. Karena ayat 43 memakai διάκονος, menerjemahkan δοῦλος sebagai “budak” pada ayat ini mempertahankan perbedaan dan peningkatan kekuatan istilah tersebut, tanpa mengubahnya menjadi sebutan teologis khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Kalian” dipakai untuk bentuk jamak ὑμῖν agar cakupan kepada kelompok murid jelas; “budak” sengaja dipertahankan sebagai istilah kuat dan berstatus rendah.
