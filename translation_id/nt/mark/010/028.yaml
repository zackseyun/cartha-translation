  text: Ἤρξατο ⸂λέγειν ὁ Πέτρος⸃ αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ⸀ἠκολουθήκαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/028.yaml
  text: Peter began to say to him[a], “Look, we have left everything and followed you.”
translation:
  language: id
  text: Petrus mulai berkata kepada-Nya, “Lihatlah[a], kami telah meninggalkan segala sesuatu dan mengikuti Engkau.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Lihat” atau “Perhatikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤρξατο λέγειν
  choice: mulai berkata
  rationale: Gabungan verba ἤρξατο dengan infinitif λέγειν secara idiomatis menyatakan permulaan tindakan berbicara; bentuk ini tetap alami dalam narasi Indonesia.
- source_word: ὁ Πέτρος
  choice: Petrus
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang sudah baku dalam bahasa Indonesia.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Pronomina datif merujuk kepada Yesus dalam konteks. Pronomina dipertahankan dan nama Yesus tidak ditambahkan ke teks.
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: Kata ini berfungsi sebagai penanda wacana yang menarik perhatian lawan bicara. “Lihat” alami dalam bahasa Indonesia modern dan tetap mempertahankan daya serunya.
- source_word: ἡμεῖς
  choice: kami
  rationale: Petrus berbicara mewakili kelompok murid kepada Yesus, sehingga bentuk eksklusif “kami” menyampaikan rujukannya dengan tepat. Kehadiran pronomina eksplisit juga mempertahankan penekanan pada kelompok mereka.
- source_word: ἀφήκαμεν
  choice: telah meninggalkan
  rationale: Aoristus menunjuk pada tindakan yang sudah dilakukan, sedangkan konteks menonjolkan akibatnya yang masih berlaku. “Telah meninggalkan” menyampaikan kedua unsur itu tanpa melebihkan maknanya menjadi “mengorbankan” atau “menelantarkan.”
- source_word: πάντα
  choice: segala sesuatu
  rationale: Bentuk netral jamak ini bersifat menyeluruh, mencakup milik dan keterikatan terdahulu. “Segala sesuatu” jelas, wajar, dan cukup luas.
- source_word: ἠκολουθήκαμεν
  choice: mengikuti
  rationale: Bentuk perfektum menyatakan tindakan mengikuti yang telah dimulai dan tetap bermakna pada saat Petrus berbicara. Dalam koordinasi setelah “telah meninggalkan,” bahasa Indonesia secara alami tidak perlu mengulang “telah.”
- source_word: σοι
  choice: Engkau
  rationale: Pronomina datif adalah objek dari tindakan mengikuti dan merujuk langsung kepada Yesus. Bentuk mandiri “Engkau” menjaga kejelasan serta ragam bahasa yang bermartabat.
theological_decisions:
- issue: Klaim Petrus tentang pengorbanan para murid
  choice: Pernyataan Petrus diterjemahkan secara langsung sebagai klaimnya sendiri.
  alternative: Melunakkan klaim menjadi “kami telah banyak meninggalkan” atau memparafrasakannya berdasarkan jawaban Yesus pada ayat berikutnya.
  rationale: Ayat ini mencatat ucapan Petrus, bukan penilaian narator atas ketepatan klaim tersebut. Terjemahan tidak mengesahkan, membantah, ataupun melunakkannya sebelum tanggapan Yesus.
- issue: Aspek tindakan mengikuti Yesus
  choice: Rangkaian “telah meninggalkan segala sesuatu dan mengikuti Engkau” dibiarkan menyatakan tindakan lampau yang tetap relevan.
  alternative: Mengulang “telah” menjadi “telah meninggalkan ... dan telah mengikuti,” atau memperluasnya menjadi “dan terus mengikuti.”
  rationale: Perfektum Yunani mengandung makna keadaan atau relevansi yang berlanjut, tetapi menambahkan “terus” akan membuat unsur kesinambungan lebih eksplisit daripada teks sumber. Susunan Indonesia yang dipilih tetap alami dan tidak menutup nuansa tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan kepada Yesus memakai bentuk yang lazim dalam ragam Alkitab Indonesia tanpa menambahkan nama atau penjelasan yang tidak terdapat dalam teks Yunani. Penanda catatan kaki ditempatkan langsung pada “Lihat,” yaitu kata yang diterangkan.
