id: MRK.10.47
reference: Mark 10:47
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὅτι Ἰησοῦς ὁ ⸀Ναζαρηνός ἐστιν ἤρξατο κράζειν καὶ λέγειν· ⸀Υἱὲ Δαυὶδ Ἰησοῦ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/047.yaml
  text: And when he heard that it was Jesus the Nazarene[a], he began to cry out and say, “Jesus, Son of David, have mercy on me!”
translation:
  language: id
  text: Ketika ia mendengar bahwa itu adalah Yesus orang Nazaret[a], mulailah ia berseru dan berkata, “Yesus, Anak Daud, kasihanilah aku!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yesus dari Nazaret.” Teks Yunani memakai sebutan yang secara harfiah berarti “Yesus orang Nazaret,” bukan ungkapan geografis yang lebih eksplisit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: ketika ia mendengar
  rationale: Partisip aoris dipahami secara temporal dan menyatakan peristiwa yang mendahului tindakan utama; bentuk ini alami dalam bahasa Indonesia.
- source_word: Ναζαρηνός
  choice: orang Nazaret
  rationale: Sebutan adjektival bagi seseorang yang berasal atau terkait dengan Nazaret. Ungkapan ini alami dalam bahasa Indonesia, sementara bentuk alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: ἤρξατο κράζειν καὶ λέγειν
  choice: mulailah ia berseru dan berkata
  rationale: Mempertahankan aspek permulaan serta kedua verba dalam gaya Markus tanpa menggabungkannya menjadi satu tindakan.
- source_word: κράζειν
  choice: berseru
  rationale: Menyampaikan seruan keras dan mendesak tanpa harus menyiratkan kemarahan.
- source_word: Υἱὲ Δαυὶδ
  choice: Anak Daud
  rationale: Mempertahankan bentuk harfiah dan gema gelar mesianik dalam konteks Injil.
- source_word: ἐλέησόν με
  choice: kasihanilah aku
  rationale: Ungkapan permohonan langsung yang wajar, khidmat, dan setara dengan imperatif Yunani.
- source_word: Ἰησοῦ
  choice: Yesus
  rationale: Mengikuti bentuk nama yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Daya mesianik gelar Υἱὲ Δαυίδ
  choice: Mempertahankan “Anak Daud” sebagai sapaan kepada Yesus.
  alternative: “keturunan Daud”
  rationale: Bentuk literal mempertahankan makna dinasti dan potensi mesianiknya tanpa mereduksinya menjadi keterangan silsilah semata.
- issue: Pemaknaan Ναζαρηνός
  choice: Menerjemahkan sebagai “orang Nazaret”.
  alternative: “Yesus dari Nazaret” atau “orang Nazaret itu”
  rationale: “Orang Nazaret” mempertahankan sifat sebutannya dan tetap alami dalam bahasa Indonesia; catatan kaki menyajikan bentuk geografis yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan “mulailah ia” dipakai untuk mempertahankan penekanan pada dimulainya seruan, sedangkan tanda seru mencerminkan kuatnya permohonan.
