  yaml_path: translation/nt/mark/010/020.yaml
  text: And he said to him, “Teacher, I have kept all these things from my youth.”
translation:
  language: id
  text: Orang itu berkata kepada-Nya, “Guru, semua itu telah kuturuti sejak masa mudaku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: Kata
  rationale: Verba ujaran naratif ini diterjemahkan secara alami dan ringkas; konteks sudah menunjukkan bahwa perkataan itu ditujukan kepada Yesus.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Sapaan ini menyatakan orang yang mengajar dan mempertahankan arti biasa διδάσκαλος tanpa menambahkan nuansa kekuasaan dari sebutan lain.
- source_word: ταῦτα πάντα
  choice: semua itu
  rationale: Ungkapan ini secara alami merujuk kembali kepada semua perintah yang baru saja disebutkan.
- source_word: ἐφυλαξάμην
  choice: sudah kuturuti
  rationale: Dalam konteks perintah, φυλάσσω berarti memelihara atau menaati. 'Turuti' terdengar alami dalam bahasa Indonesia dan menyatakan pengakuan bahwa perintah-perintah itu dijalankan hingga saat berbicara.
- source_word: ἐκ νεότητός μου
  choice: sejak masa mudaku
  rationale: ἐκ dengan bentuk genitif temporal menunjukkan titik awal; 'sejak masa mudaku' menyampaikan rentang waktu yang berlanjut tanpa mempersempitnya menjadi masa kanak-kanak.
- source_word: ὁ δὲ
  choice: orang itu
  rationale: δέ merupakan penghubung naratif ringan, sedangkan subjek eksplisit 'orang itu' memperjelas rujukan pronomina secara wajar dalam bahasa Indonesia.
