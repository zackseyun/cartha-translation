source:
  edition: SBLGNT
  text: Καὶ περιβλεψάμενος ὁ Ἰησοῦς λέγει τοῖς μαθηταῖς αὐτοῦ· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/023.yaml
  text: And looking around[a], Jesus says to his disciples, “How difficult it is for those who have wealth to enter the kingdom of God!”
translation:
  language: id
  text: Setelah memandang sekeliling, Yesus berkata kepada murid-murid-Nya, “Betapa sulitnya bagi orang-orang yang memiliki kekayaan[a] untuk masuk ke dalam Kerajaan Allah!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang mempunyai uang” atau “orang-orang yang memiliki banyak harta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: memandang sekeliling
  rationale: Partisip aoris ini menggambarkan Yesus mengarahkan pandangan ke sekeliling sebelum atau sambil beralih kepada perkataan-Nya. Ungkapan ini alami dalam bahasa Indonesia dan tidak perlu memperberat urutan dengan bentuk harfiah seperti ‘setelah memandang sekeliling’.
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini ini merupakan present historis yang lazim dalam narasi Markus. Bahasa Indonesia umumnya memakai ‘berkata’ untuk narasi lampau tanpa kehilangan daya hidup adegan.
- source_word: Πῶς δυσκόλως
  choice: Betapa sulitnya
  rationale: Gabungan ini menyatakan seruan yang menekankan kesulitan. ‘Betapa sulitnya’ mempertahankan tekanan tersebut secara alami tanpa mengubahnya menjadi ketidakmungkinan mutlak.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: orang-orang yang memiliki kekayaan
  rationale: Frasa partisipial ini dipertahankan, bukan dipadatkan menjadi label sosial ‘orang kaya’, sehingga menonjolkan keadaan memiliki harta sebagaimana dalam bahasa Yunani.
- source_word: χρήματα
  choice: kekayaan
  rationale: Kata ini dapat menunjuk pada uang maupun harta benda. ‘Kekayaan’ mencakup sumber daya material secara luas; alternatif leksikal dicatat dalam catatan kaki.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ini adalah padanan baku, jelas, dan mempertahankan citra kerajaan serta kesinambungan istilah teologis dalam Injil Markus.
- source_word: εἰσελεύσονται
  choice: masuk
  rationale: Walaupun verba Yunani berbentuk futur, konstruksi Indonesia setelah ‘sulitnya’ secara alami memakai verba ‘masuk’; orientasi prospektifnya tetap dapat dipahami dari tindakan memasuki Kerajaan Allah.
theological_decisions:
- issue: Apakah perkataan Yesus menyatakan ketidakmungkinan mutlak atau kesulitan besar bagi pemilik kekayaan
  choice: 'Diterjemahkan sebagai kesulitan besar: ‘Betapa sulitnya ... masuk ke dalam Kerajaan Allah!’'
  alternative: Terjemahan yang mempertajamnya menjadi ketidakmungkinan praktis atau mutlak
  rationale: Bahasa Yunani memakai δυσκόλως, ‘dengan sulit’, bukan istilah yang secara langsung berarti mustahil. Terjemahan mempertahankan ketegangan perkataan itu tanpa menarik kesimpulan doktrinal yang lebih kuat daripada ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Murid-murid-Nya’ mengikuti konvensi ejaan religius Indonesia, sedangkan ‘Kerajaan Allah’ mempertahankan istilah Alkitab yang umum. Penanda catatan kaki ditempatkan setelah seluruh kutipan karena menjelaskan frasa di dalam perkataan Yesus.
