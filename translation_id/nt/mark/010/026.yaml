base_translation:
  language: en
  yaml_path: translation/nt/mark/010/026.yaml
  text: And they were exceedingly astonished[a], saying to one another, “Then who can be saved?”
translation:
  language: id
  text: Mereka pun sangat tercengang dan berkata satu sama lain[a], “Kalau begitu, siapa yang dapat diselamatkan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antara mereka sendiri”; secara lebih harfiah, “kepada diri mereka sendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mereka pun
  rationale: Artikel menunjuk kembali kepada para murid dalam konteks, sedangkan δέ melanjutkan sekaligus menandai perkembangan reaksi mereka. “Mereka pun” terdengar alami dalam bahasa Indonesia tanpa memberi pertentangan yang terlalu kuat.
- source_word: περισσῶς ἐξεπλήσσοντο
  choice: semakin tercengang
  rationale: περισσῶς memperkuat reaksi yang sudah disebut sebelumnya, dan bentuk imperfek menggambarkan keadaan yang berlangsung. “Semakin tercengang” menyampaikan peningkatan intensitas secara alami dan kuat.
- source_word: λέγοντες
  choice: dan berkata
  rationale: Partisipel ini menyatakan tindakan yang terjadi bersamaan dengan ketercengangan mereka. Klausa koordinatif lebih wajar dalam bahasa Indonesia modern.
- source_word: πρὸς ἑαυτούς
  choice: satu sama lain
  rationale: Secara harfiah ungkapan ini dapat berarti “kepada diri mereka sendiri,” tetapi dalam konteks percakapan jamak paling wajar dipahami secara timbal balik, yaitu mereka berbicara sesama mereka. Catatan kaki mempertahankan kemungkinan bentuk yang lebih harfiah.
- source_word: Καὶ τίς
  choice: Kalau begitu, siapa
  rationale: καί di sini mengantar kesimpulan atau konsekuensi dari perkataan Yesus sebelumnya. “Kalau begitu” menyampaikan daya inferensial pertanyaan itu secara alami.
- source_word: δύναται σωθῆναι
  choice: dapat diselamatkan
  rationale: δύναται menyatakan kemampuan atau kemungkinan, sedangkan infinitif pasif σωθῆναι dalam konteks masuk ke dalam Kerajaan Allah membawa makna keselamatan, bukan sekadar pertolongan sementara.
theological_decisions:
- issue: Makna bahasa keselamatan dalam konteks
  choice: diselamatkan
  alternative: ditolong; dilepaskan
  rationale: Pembahasan di sekitarnya menyangkut masuk ke dalam Kerajaan Allah. Karena itu, “diselamatkan” mempertahankan bobot teologis dan eskatologis σωθῆναι tanpa mempersempitnya menjadi pertolongan sementara.
- issue: Hubungan καί dengan pertanyaan
  choice: Kalau begitu
  alternative: Dan; Jadi
  rationale: Ungkapan ini menunjukkan kesimpulan para murid dari sulitnya masuk ke dalam Kerajaan Allah. “Kalau begitu” menjaga hubungan konsekuensial tersebut tanpa menambahkan jawaban teologis yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Tercengang” mempertahankan kuatnya reaksi, sementara “Kalau begitu” membuat alur penalaran dalam dialog jelas bagi pembaca umum.
