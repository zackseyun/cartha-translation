  text: Καὶ προσπορεύονται αὐτῷ Ἰάκωβος καὶ Ἰωάννης ⸀οἱ υἱοὶ Ζεβεδαίου λέγοντες ⸀αὐτῷ· Διδάσκαλε, θέλομεν ἵνα ὃ ἐὰν αἰτήσωμέν ⸀σε ποιήσῃς ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/035.yaml
  text: And James and John[a], the sons of Zebedee, came to him and said to him, “Teacher, we want you to do for us whatever we ask of you.”
translation:
  language: id
  text: Kemudian Yakobus dan Yohanes, anak-anak Zebedeus, mendatangi Yesus[a] dan berkata kepada-Nya, “Guru, kami ingin Engkau melakukan apa pun yang kami minta kepada-Mu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menghampiri-Nya.” Kata kerja Yunani ini lebih harfiah menggambarkan gerakan mendekati Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπορεύονται αὐτῷ
  choice: datang kepada Yesus
  rationale: Kata kerja ini menggambarkan gerak mendekati seseorang. Nama “Yesus” dipakai sebagai pengganti pronomina agar rujukannya jelas dan alami dalam bahasa Indonesia; bentuk kini Yunani berfungsi sebagai kala kini historis dalam narasi.
- source_word: οἱ υἱοὶ Ζεβεδαίου
  choice: anak-anak Zebedeus
  rationale: Ungkapan ini mempertahankan identifikasi aposisional dan bentuk jamak sumber secara lugas.
- source_word: λέγοντες αὐτῷ
  choice: dan berkata kepada-Nya
  rationale: Partisipel Yunani dialihkan menjadi verba finit yang alami dalam narasi Indonesia tanpa mengubah hubungan tindakannya.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Sapaan ini secara langsung menunjuk pada peran sebagai pengajar; “Guru” lebih tepat daripada “Tuan” atau gelar lain yang menambah nuansa berbeda.
- source_word: θέλομεν
  choice: kami ingin
  rationale: Pilihan ini menyampaikan keinginan mereka secara langsung dalam bahasa Indonesia modern.
- source_word: ἵνα ὃ ἐὰν αἰτήσωμέν σε ποιήσῃς ἡμῖν
  choice: Engkau melakukan bagi kami apa pun yang kami minta kepada-Mu
  rationale: Susunan ini alami dalam bahasa Indonesia, mempertahankan makna tak tentu ὃ ἐάν (“apa pun”), serta tidak mempersempit ποιέω menjadi “mengabulkan” meskipun hal itu tersirat dalam konteks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan kepada Yesus memakai kapitalisasi pronomina yang lazim dalam penerbitan Alkitab Indonesia. Tuturan para murid dipertahankan langsung dan agak berani sebagaimana dalam sumber.
