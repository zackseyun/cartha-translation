  yaml_path: translation/nt/mark/010/002.yaml
  text: And they were asking him whether it is lawful for a man to divorce a wife[a], testing him.
translation:
  language: id
  text: Mereka sedang bertanya kepada-Nya apakah seorang laki-laki boleh menceraikan istrinya[a], sambil menguji-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apakah seorang suami boleh menceraikan istrinya.”
    reason: ἀνήρ dapat berarti “laki-laki” atau “suami”; konteks perkawinan memungkinkan kedua cara pengungkapan tersebut.
lexical_decisions:
- source_word: ἐπηρώτων
  choice: bertanya
  rationale: Bentuk imperfek menggambarkan tindakan bertanya yang sedang berlangsung dalam adegan itu. Bahasa Indonesia tidak wajib menandai aspek tersebut secara eksplisit; 'bertanya' tetap alami dan tidak melebih-lebihkan maknanya.
- source_word: ἔξεστιν
  choice: boleh
  rationale: '''Boleh'' menyampaikan persoalan izin atau keabsahan menurut hukum dengan jelas dan alami dalam bahasa Indonesia modern.'
- source_word: ἀνδρὶ
  choice: seorang laki-laki
  rationale: ἀνήρ dapat berarti 'laki-laki' atau 'suami'. Pilihan ini mempertahankan bentuk umum dalam bahasa Yunani, sementara konteks perkawinan dijelaskan oleh 'istrinya'.
- source_word: γυναῖκα
  choice: istrinya
  rationale: Dalam konteks ἀπολῦσαι dan perdebatan tentang perceraian, γυνή berarti 'istri'. Akhiran posesif menghasilkan ungkapan Indonesia yang alami tanpa menunjuk kepada istri tertentu.
- source_word: ἀπολῦσαι
  choice: menceraikan
  rationale: Dalam konteks hukum perkawinan, verba ini secara idiomatis berarti menceraikan, bukan sekadar menyuruh pergi atau melepaskan.
- source_word: πειράζοντες
  choice: untuk menguji
  rationale: Partisipel ini menyatakan bahwa pertanyaan tersebut diajukan sebagai ujian. 'Menguji' mempertahankan makna langsung tanpa menambahkan gambaran eksplisit tentang jebakan.
- source_word: Καὶ
  choice: Mereka
  rationale: Καί berfungsi sebagai penghubung naratif. Dalam ayat Indonesia yang berdiri sebagai satuan rujukan, penghubung itu dapat dibiarkan tersirat agar pembukaan kalimat tetap alami.
theological_decisions:
- issue: Ambiguitas ἀνήρ antara 'laki-laki' dan 'suami' dalam pertanyaan hukum perkawinan
  choice: seorang laki-laki
  alternative: seorang suami
  rationale: Pilihan utama mempertahankan bentuk generik sumber dan tidak mengubah istilah itu secara diam-diam menjadi sebutan hubungan. Alternatif yang kontekstual dicatat dalam catatan kaki.
- issue: Hubungan sintaksis partisipel πειράζοντες dengan pertanyaan
  choice: untuk menguji-Nya
  alternative: sambil menguji-Nya
  rationale: Konteks menunjukkan bahwa pengujian merupakan maksud pertanyaan tersebut, tetapi terjemahan tetap memakai 'menguji' dan tidak memperluasnya menjadi 'menjebak'.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk sapaan ilahi memakai huruf kapital pada enklitik '-Nya'. Susunan kalimat mempertahankan pertanyaan hukum dan tujuan pengujian tanpa menambahkan rincian denominatif.
