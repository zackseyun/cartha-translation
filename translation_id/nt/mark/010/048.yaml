base_translation:
  language: en
  yaml_path: translation/nt/mark/010/048.yaml
  text: And many were rebuking him so that he would be silent[a], but he was crying out all the more, “Son of David, have mercy on me!”
translation:
  language: id
  text: Banyak orang menegurnya supaya ia diam. Namun, ia justru berseru lebih lagi, “Anak Daud, kasihanilah aku!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anak Daud” adalah gelar kerajaan yang mengandung makna mesianis; maknanya dapat diungkapkan sebagai “Mesias”, tetapi kata-kata Yunani dipertahankan di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμων
  choice: menegurnya
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung atau berulang. “Menegur” mempertahankan ketegasan ἐπιτιμάω tanpa menambahkan unsur yang tidak dinyatakan.
- source_word: πολλοὶ
  choice: banyak orang
  rationale: Kata sifat ini dipakai secara substantival. “Banyak orang” alami dalam bahasa Indonesia dan tidak mengubahnya menjadi kelompok yang lebih khusus seperti “orang banyak”.
- source_word: ἵνα σιωπήσῃ
  choice: supaya ia diam
  rationale: Ungkapan ini menyatakan tujuan teguran secara ringkas dan alami.
- source_word: πολλῷ μᾶλλον
  choice: malah semakin
  rationale: Mengungkapkan pertentangan dan peningkatan tindakan tanpa menambahkan bahwa suaranya secara khusus menjadi lebih keras.
- source_word: ἔκραζεν
  choice: berseru
  rationale: “Berseru” menyampaikan seruan yang kuat dan mendesak; konteks serta bentuk imperfek didukung oleh “semakin” sebagai tindakan yang terus dilakukan.
- source_word: Υἱὲ Δαυίδ
  choice: Anak Daud
  rationale: Terjemahan langsung gelar kerajaan-mesianis ini mempertahankan kata-kata Yunani dan gema teologisnya tanpa menggantinya dengan tafsiran “Mesias”.
- source_word: ἐλέησόν με
  choice: kasihanilah aku
  rationale: Bentuk permohonan ini alami, bermartabat, dan mempertahankan daya religius serta urgensi ἐλεέω.
theological_decisions:
- issue: Makna mesianis gelar Υἱὲ Δαυίδ
  choice: Mempertahankan gelar sebagai “Anak Daud”.
  alternative: “Mesias”
  rationale: Teks Yunani memakai gelar itu secara langsung. Menerjemahkan gelarnya, bukan menggantinya dengan penafsirannya, mempertahankan redaksi dan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, ringkas, dan bermartabat. “Namun, ia malah semakin berseru” mempertahankan kontras serta intensifikasi tanpa menafsirkan πολλῷ μᾶλλον sebagai peningkatan volume secara eksplisit.
