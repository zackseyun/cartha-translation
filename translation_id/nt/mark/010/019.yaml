  text: τὰς ἐντολὰς οἶδας· Μὴ ⸂φονεύσῃς, Μὴ μοιχεύσῃς⸃, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Μὴ ἀποστερήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/019.yaml
  text: 'You know the commandments: Do not murder[a], do not commit adultery, do not steal, do not bear false witness, do not defraud[b], honor your father and mother.'
translation:
  language: id
  text: 'Engkau tahu perintah-perintah itu: Jangan membunuh[a], jangan berzina, jangan mencuri, jangan memberikan kesaksian palsu, jangan mengurangi hak orang lain[b], hormatilah ayah dan ibumu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang digunakan di sini secara khusus berarti membunuh manusia secara melawan hukum, yaitu melakukan pembunuhan, bukan mengambil nyawa dalam arti yang seluas-luasnya.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “jangan menahan apa yang menjadi hak orang lain,” “jangan menipu orang,” atau “jangan merampas.” Istilah ini menunjuk pada tindakan mengurangi, mengambil, atau menahan milik maupun hak seseorang, sering kali melalui kecurangan atau eksploitasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς ἐντολάς
  choice: perintah-perintah
  rationale: Bentuk jamak ini menunjuk pada perintah-perintah Allah yang kemudian disebutkan dan mempertahankan kaitannya dengan Sepuluh Perintah.
- source_word: οἶδας
  choice: Engkau tahu
  rationale: Bentuk οἶδα bermakna kini dalam bahasa Yunani Koine; bentuk sapaan tunggal dipertahankan dengan 'engkau' dalam register Kitab Suci yang tetap mudah dipahami.
- source_word: Μὴ φονεύσῃς
  choice: Jangan membunuh
  rationale: Dalam konteks perintah ini, φονεύω menunjuk pada pembunuhan manusia secara melawan hukum; ungkapan Indonesia yang lazim untuk rumusan perintah ialah 'jangan membunuh', dengan batasan makna dijelaskan dalam catatan kaki.
- source_word: Μὴ μοιχεύσῃς
  choice: jangan berzina
  rationale: '''Berzina'' merupakan padanan Indonesia yang ringkas dan lazim bagi μοιχεύω dalam konteks hukum-moral.'
- source_word: Μὴ κλέψῃς
  choice: jangan mencuri
  rationale: Padanan langsung dan alami untuk κλέπτω dalam daftar perintah.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: jangan memberikan kesaksian palsu
  rationale: Mempertahankan nuansa hukum dan kesaksian dari ψευδομαρτυρέω, bukan memperluasnya menjadi larangan berdusta secara umum.
- source_word: Μὴ ἀποστερήσῃς
  choice: jangan merampas hak orang lain
  rationale: ἀποστερέω berarti menahan atau mengambil apa yang semestinya menjadi milik atau hak seseorang. Rumusan ini lebih jelas dalam bahasa Indonesia modern daripada 'jangan menipu' dan tetap mencakup eksploitasi atau kecurangan.
- source_word: Τίμα
  choice: hormatilah
  rationale: '''Hormatilah'' membawa bobot kewajiban yang sesuai dengan τιμάω dalam perintah tentang orang tua.'
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: ayah dan ibumu
  rationale: Ungkapan Indonesia yang alami ini mempertahankan rujukan langsung kepada kedua orang tua tanpa pengulangan kata ganti yang tidak perlu.
theological_decisions:
- issue: Rumusan kutipan atau alusi kepada Sepuluh Perintah
  choice: Menggunakan gaya perintah yang dikenal dalam bahasa Indonesia sambil mengikuti kekhususan makna bahasa Yunani
  alternative: Menggunakan parafrasa kontemporer yang lebih bebas atau istilah teknis yang kurang dikenal
  rationale: Daftar ini perlu terdengar sebagai rangkaian perintah yang dapat dikenali, tetapi ketepatan leksikal tetap dijaga, terutama pada φονεύω dan ἀποστερέω.
- issue: Cakupan larangan φονεύω
  choice: Memakai 'membunuh' dalam teks dan menjelaskan bahwa kata Yunani secara khusus mengacu pada pembunuhan manusia secara melawan hukum
  alternative: Memakai 'membunuh dengan sengaja' atau 'melakukan pembunuhan' langsung dalam teks
  rationale: Rumusan yang dikenal dipertahankan tanpa membuat larangan itu seolah-olah mencakup setiap tindakan mengambil nyawa; ambiguitas bahasa Indonesia ditangani melalui catatan kaki.
- issue: Cakupan larangan ἀποστερέω
  choice: Merampas hak orang lain
  alternative: Menipu; merampok; menahan milik orang lain
  rationale: Pilihan ini mempertahankan gagasan luas tentang mengambil atau menahan sesuatu yang menjadi hak pihak lain tanpa membatasinya pada satu modus kejahatan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'engkau' dipakai karena tuturan ditujukan kepada satu orang dan selaras dengan register Kitab Suci; daftar larangan dibuat ringkas dan berirama. Semua penanda catatan kaki muncul dalam teks utama.
