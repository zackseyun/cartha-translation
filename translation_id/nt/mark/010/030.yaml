  source_fidelity: Revisi diperlukan karena “berbagai penganiayaan” menambahkan nuansa distributif/varietas yang tidak dinyatakan oleh μετὰ διωγμῶν. Frasa Yunani itu menyatakan bahwa penganiayaan menyertai penerimaan pada masa kini, tanpa merinci macam-macamnya.
  naturalness: Teks pada dasarnya baku dan jelas. “Disertai penganiayaan” lebih idiomatis dan lebih dekat dengan sumber daripada “disertai berbagai penganiayaan.” Bentuk daftar dan elipsis menuju “hidup kekal” tetap jelas sebagai kelanjutan dari “menerima.”
  terminology: Istilah “seratus kali lipat,” “masa ini,” “zaman yang akan datang,” dan “hidup kekal” tepat. Pembedaan eksplisit antara saudara laki-laki dan saudara perempuan dipertahankan. Catatan kaki tetap merupakan alternatif leksikal yang sah.
