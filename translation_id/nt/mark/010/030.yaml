  text: ἐὰν μὴ λάβῃ ἑκατονταπλασίονα νῦν ἐν τῷ καιρῷ τούτῳ οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ ⸀μητέρας καὶ τέκνα καὶ ἀγροὺς μετὰ διωγμῶν, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/030.yaml
  text: who will not receive a hundredfold now in this time—houses and brothers and sisters and mothers and children and fields[a], with persecutions—and in the age to come[b], eternal life.
translation:
  language: id
  text: yang tidak akan menerima seratus kali lipat sekarang, pada masa ini—rumah-rumah, saudara-saudara laki-laki, saudara-saudara perempuan, ibu-ibu, anak-anak, dan ladang-ladang, disertai penganiayaan—dan pada zaman yang akan datang[a], hidup kekal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada zaman mendatang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λάβῃ
  choice: menerima
  rationale: Dalam konteks janji balasan ini, 'menerima' menyatakan sesuatu yang diperoleh sebagai pemberian, bukan tindakan mengambil.
- source_word: ἑκατονταπλασίονα
  choice: seratus kali lipat
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya kuantitatif dari balasan seratus kali.
- source_word: νῦν ἐν τῷ καιρῷ τούτῳ
  choice: sekarang, pada masa ini
  rationale: Terjemahan ini mempertahankan penegasan waktu sekarang dan kontrasnya dengan zaman yang akan datang.
- source_word: οἰκίας
  choice: rumah-rumah
  rationale: Padanan konkret yang mempertahankan bentuk jamak dalam teks sumber.
- source_word: ἀδελφοὺς καὶ ἀδελφὰς
  choice: saudara-saudara laki-laki, saudara-saudara perempuan
  rationale: Teks Yunani menyebut saudara laki-laki dan perempuan secara terpisah; terjemahan mempertahankan pembedaan itu.
- source_word: μητέρας καὶ τέκνα
  choice: ibu-ibu, anak-anak
  rationale: Padanan langsung yang mempertahankan bentuk jamak dan cakupan umum τέκνα.
- source_word: ἀγρούς
  choice: ladang-ladang
  rationale: Padanan konkret bagi bidang tanah yang dibudidayakan dan sesuai dengan bentuk jamak sumber.
- source_word: μετὰ διωγμῶν
  choice: disertai berbagai penganiayaan
  rationale: Kata 'disertai' mengungkapkan bahwa berkat masa kini hadir bersama penganiayaan; 'berbagai' membuat bentuk jamak διωγμῶν alami dalam bahasa Indonesia tanpa mengubah maknanya.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: pada zaman yang akan datang
  rationale: αἰών menunjuk pada zaman atau era; terjemahan ini mempertahankan kontras eskatologis dengan masa sekarang.
- source_word: ζωὴν αἰώνιον
  choice: hidup kekal
  rationale: Ini merupakan ungkapan Indonesia yang mapan dan tepat untuk makna eskatologis frasa tersebut.
theological_decisions:
- issue: Sifat balasan yang dijanjikan pada masa sekarang
  choice: Daftar rumah, hubungan keluarga, dan ladang diterjemahkan secara langsung, sementara penganiayaan tetap disebut secara tegas.
  alternative: Menjadikan semuanya berkat rohani semata, atau menonjolkan kemakmuran materi tanpa penderitaan.
  rationale: Teks mempertahankan ketegangan antara balasan berlimpah pada masa kini dan penganiayaan yang menyertainya; terjemahan tidak boleh menghapus salah satunya.
- issue: Pembedaan gender dalam istilah kekerabatan
  choice: ἀδελφοὺς dan ἀδελφὰς diterjemahkan terpisah sebagai 'saudara-saudara laki-laki' dan 'saudara-saudara perempuan'.
  alternative: Meringkas keduanya menjadi 'saudara-saudara'.
  rationale: Penyebutan terpisah dalam bahasa Yunani sengaja dipertahankan.
- issue: Hubungan sintaksis 'hidup kekal' dengan kata kerja 'menerima'
  choice: Frasa 'hidup kekal' tetap menjadi objek yang diterima pada zaman yang akan datang.
  alternative: Menambahkan kata kerja baru seperti 'memperoleh' atau 'mewarisi'.
  rationale: Sumber tidak mengulang kata kerja; mempertahankan elipsis menjaga struktur dan kesinambungan janji.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda pisah mempertahankan struktur daftar dan kontras teks Yunani. Ayat ini merupakan kelanjutan sintaksis dari ayat sebelumnya, sehingga dimulai dengan 'yang tidak akan menerima'. Bentuk ulang dipakai pada nomina jamak agar daftar konkret dan bentuk jamak sumber tetap jelas.
