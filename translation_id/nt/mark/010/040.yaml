  text: τὸ δὲ καθίσαι ἐκ δεξιῶν μου ⸀ἢ ἐξ εὐωνύμων οὐκ ἔστιν ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/040.yaml
  text: But to sit at my right or at my left is not mine to give[a], but for those for whom it has been prepared.
translation:
  language: id
  text: Namun, duduk di sebelah kanan-Ku atau di sebelah kiri-Ku bukan Aku yang berhak memberikannya,[a] melainkan tempat itu telah disiapkan bagi mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bukan untuk Kuberikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... καθίσαι
  choice: duduk
  rationale: Infinitif berartikel ini berfungsi sebagai nomina, tetapi bentuk infinitif “duduk” paling wajar dalam bahasa Indonesia dan tetap mempertahankan daya verbalnya.
- source_word: ἐκ δεξιῶν μου
  choice: di sebelah kanan-Ku
  rationale: Ungkapan ini menunjukkan posisi di sisi kanan Yesus. “Di sebelah kanan-Ku” alami dan tidak menambahkan kata “tangan” yang tidak dinyatakan secara eksplisit.
- source_word: ἢ ἐξ εὐωνύμων
  choice: atau di sebelah kiri-Ku
  rationale: Bentuk jamak εὐωνύμων dalam ungkapan ini menunjuk pada sisi kiri; terjemahan dibuat sejajar dengan frasa sebelumnya.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: bukanlah hak-Ku untuk memberikannya
  rationale: Konstruksi ini menyatakan bahwa pemberian kedudukan tersebut bukan hak atau kewenangan Yesus untuk diberikan dalam konteks ini. Rumusan ini dekat dengan teks, tetap wajar dalam bahasa Indonesia, dan tidak menambahkan penjelasan teologis.
- source_word: ἀλλ’ οἷς
  choice: melainkan bagi mereka yang untuknya
  rationale: Bahasa Yunani memakai konstruksi eliptis sesudah ἀλλά. Terjemahan ini mempertahankan pertentangan dan melengkapi maknanya secukupnya agar dapat dipahami dalam bahasa Indonesia.
- source_word: ἡτοίμασται
  choice: telah disiapkan
  rationale: Bentuk perfek pasif menunjukkan persiapan yang sudah terlaksana dengan hasil yang tetap berlaku; “telah disiapkan” mencerminkan aspek tersebut secara alami.
theological_decisions:
- issue: Apakah pernyataan Yesus harus diterjemahkan sebagai penyangkalan mutlak atas kewenangan-Nya atau dijelaskan sebagai batasan dalam konteks langsung
  choice: Menerjemahkannya secara langsung sebagai “bukanlah hak-Ku untuk memberikannya” tanpa keterangan tambahan.
  alternative: “bukan untuk Kuberikan” atau penjelasan seperti “bukan hak-Ku untuk memberikannya di luar kehendak Bapa”
  rationale: Teks Yunani menyatakan batasan itu tanpa menjelaskan dasar atau cakupannya. Menambahkan rujukan kepada kehendak Bapa akan menyelesaikan ketegangan teologis yang dibiarkan terbuka oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk sapaan ilahi menggunakan kapital pada enklitik “-Ku”. Konstruksi eliptis pada bagian akhir dipertahankan sejauh masih dapat dipahami secara alami.
