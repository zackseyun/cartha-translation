review_pass:
  verdict: revise
  source_fidelity: Frasa "bukanlah hak-Ku" dapat menyampaikan gagasan kewenangan, tetapi "bukan Aku yang berhak memberikannya" lebih langsung mencerminkan οὐκ ἔστιν ἐμὸν δοῦναι tanpa menominalkan secara kurang alami. Bagian akhir draf perlu diperbaiki karena "mereka yang untuknya" tidak idiomatis dalam bahasa Indonesia. Teks Yunani secara eliptis menyatakan bahwa tempat tersebut telah disiapkan bagi orang-orang tertentu; revisi menyatakannya dengan jelas tanpa menentukan siapa yang menyiapkannya.
  naturalness: 'Revisi memakai susunan baku dan alami: "bukan Aku yang berhak memberikannya" serta "telah disiapkan bagi mereka." Pengulangan "tempat itu" diperlukan secara ringan untuk membuat elipsis Yunani dapat dipahami dalam bahasa Indonesia.'
  terminology: '"Di sebelah kanan-Ku" dan "di sebelah kiri-Ku" tepat dan sejajar. Kapitalisasi enklitik "-Ku" konsisten dengan register naskah. Istilah "berhak" mempertahankan nuansa prerogatif tanpa menambahkan penjelasan teologis mengenai Bapa atau kehendak ilahi.'
  issues:
  - severity: medium
    issue: Konstruksi "melainkan bagi mereka yang untuknya tempat itu telah disiapkan" tidak alami dan kabur.
    rationale: Relatif "yang untuknya" tidak berfungsi dengan baik dalam bahasa Indonesia modern. Selain itu, hubungan eliptis antara kedudukan yang diminta dan orang-orang yang baginya kedudukan itu disiapkan perlu dibuat jelas.
  - severity: low
    issue: '"Bukanlah hak-Ku untuk memberikannya" agak nominal dan kurang langsung.'
    rationale: Walaupun maknanya pada dasarnya dapat diterima, "bukan Aku yang berhak memberikannya" lebih idiomatis dan lebih dekat dengan konstruksi Yunani yang menyatakan bahwa pemberian itu bukan milik/prerogatif Yesus untuk diberikan.
  revised_text: Namun, duduk di sebelah kanan-Ku atau di sebelah kiri-Ku bukan Aku yang berhak memberikannya,[a] melainkan tempat itu telah disiapkan bagi mereka.
