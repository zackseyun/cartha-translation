  to: Namun, duduk di sebelah kanan-Ku atau di sebelah kiri-Ku bukan Aku yang berhak memberikannya,[a] melainkan tempat itu telah disiapkan bagi mereka.
  rationale: Revisi memperbaiki kelancaran dan kejelasan klausa eliptis terakhir dengan menyebut kembali "tempat itu," yang tersirat dari konteks, lalu mempertahankan pasif perfek "telah disiapkan." Tidak ada keterangan teologis tambahan yang dimasukkan. Catatan kaki tetap merupakan alternatif yang sah bagi οὐκ ἔστιν ἐμὸν δοῦναι.
