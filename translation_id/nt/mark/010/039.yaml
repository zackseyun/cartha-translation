  text: οἱ δὲ εἶπαν αὐτῷ· Δυνάμεθα. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· ⸀Τὸ ποτήριον ὃ ἐγὼ πίνω πίεσθε καὶ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθήσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/039.yaml
  text: And they said to him[a], “We are able.” But Jesus said to them, “The cup that I drink, you will drink; and the baptism with which I am baptized[b], you will be baptized,”
translation:
  language: id
  text: Mereka berkata kepada-Nya, “Kami sanggup.” Namun Yesus berkata kepada mereka, “Cawan yang Kuminum akan kamu minum, dan dengan baptisan yang Aku terima, kamu akan dibaptis.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cawan” dan “baptisan” merupakan kiasan tentang penderitaan dan nasib yang akan dialami Yesus, yang juga akan dialami para murid-Nya.
    reason: cross_reference
lexical_decisions:
- source_word: Δυνάμεθα
  choice: Kami sanggup
  rationale: Ungkapan ini alami dan berbobot dalam bahasa Indonesia serta menyampaikan pengakuan kemampuan mereka tanpa perlu catatan alternatif yang tidak menambah makna.
- source_word: ποτήριον
  choice: cawan
  rationale: Mempertahankan gambaran metaforis alkitabiah tentang bagian atau pengalaman yang ditetapkan, khususnya penderitaan, tanpa menjabarkannya di dalam teks utama.
- source_word: πίνω / πίεσθε
  choice: Kuminum / akan kamu minum
  rationale: Mempertahankan kesejajaran kata kerja kini dan mendatang serta metafora minum dari cawan.
- source_word: βάπτισμα
  choice: baptisan
  rationale: Istilah baku ini menjaga bentuk leksikal dan gema antarteks, sementara konteks menunjukkan bahwa penggunaannya di sini bersifat metaforis.
- source_word: βαπτίζομαι / βαπτισθήσεσθε
  choice: Kujalani / kamu akan dibaptis
  rationale: Pada klausa pertama, 'Kujalani' menghindari konstruksi Indonesia yang kaku seperti 'dengan baptisan yang dengannya Aku dibaptis'; pada klausa kedua, bentuk pasif 'akan dibaptis' dipertahankan dan hubungan dengan kata 'baptisan' tetap jelas.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Namun Yesus berkata kepada mereka
  rationale: '''Namun'' menandai kontras ringan antara keyakinan para murid dan tanggapan Yesus.'
theological_decisions:
- issue: Bahasa metaforis tentang cawan dan baptisan
  choice: Kedua metafora dipertahankan dalam teks utama, dengan penjelasan singkat dalam catatan kaki.
  alternative: Mengganti metafora secara langsung dengan 'penderitaan', 'kematian', atau 'kemartiran'.
  rationale: Teks Yunani sengaja memakai gambaran yang kaya secara teologis; menerjemahkannya sebagai tafsiran langsung akan mempersempit makna.
- issue: Hubungan baptisan dalam ayat ini dengan baptisan sakramental
  choice: Memakai kata 'baptisan' sambil menjelaskan penggunaan metaforisnya dalam konteks ini.
  alternative: Memakai 'pencelupan' atau 'penderitaan berat' agar tidak dipahami secara sakramental.
  rationale: βάπτισμα secara leksikal berarti baptisan, tetapi konteks mengarah kepada pengalaman penderitaan dan nasib yang akan dialami Yesus serta dibagikan oleh para murid.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Bentuk terikat pada kata ganti ilahi ('kepada-Nya', 'Kuminum', 'Kujalani') mengikuti kebiasaan ejaan Alkitab Indonesia. Susunan klausa mempertahankan kesejajaran metaforis sumber tanpa menghasilkan ungkapan yang terlalu harfiah dan kaku.
