  text: οἱ δὲ εἶπαν αὐτῷ· Δὸς ἡμῖν ἵνα εἷς ⸂σου ἐκ δεξιῶν⸃ καὶ εἷς ἐξ ⸀ἀριστερῶν καθίσωμεν ἐν τῇ δόξῃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/037.yaml
  text: They said to him, “Grant to us that one of us may sit at your right and one at your left in your glory.”
translation:
  language: id
  text: Mereka berkata kepada-Nya, “Izinkanlah kami duduk dalam kemuliaan-Mu, seorang di sebelah kanan-Mu dan seorang di sebelah kiri-Mu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δὸς ἡμῖν ἵνα
  choice: Izinkanlah kami
  rationale: Ungkapan permohonan ini secara harfiah berarti ‘berikanlah kepada kami supaya’, tetapi dalam bahasa Indonesia alami menyatakan permintaan agar Yesus mengabulkan atau mengizinkan hal yang dimohon.
- source_word: εἷς ... καὶ εἷς
  choice: seorang ... dan seorang
  rationale: Menunjukkan masing-masing dari kedua pemohon tanpa menambahkan identitas yang tidak dinyatakan dalam ayat.
- source_word: ἐκ δεξιῶν ... ἐξ ἀριστερῶν
  choice: di sebelah kanan-Mu ... di sebelah kiri-Mu
  rationale: Padanan Indonesia yang alami bagi posisi kehormatan di kanan dan kiri, dengan hubungan kepada Yesus tetap eksplisit.
- source_word: ἐν τῇ δόξῃ σου
  choice: dalam kemuliaan-Mu
  rationale: Mempertahankan ungkapan Yunani dan keterbukaannya mengenai manifestasi kemuliaan Yesus tanpa menafsirkannya lebih jauh.
theological_decisions:
- issue: Makna ‘kemuliaan-Mu’
  choice: dalam kemuliaan-Mu
  alternative: ketika Engkau datang sebagai Raja
  rationale: Teks Yunani menyebut ‘kemuliaan’, bukan secara eksplisit kedatangan atau kerajaan; terjemahan mempertahankan ketegangan dan cakupan makna aslinya.
- issue: Sifat permohonan Δὸς ἡμῖν ἵνα
  choice: Izinkanlah kami duduk
  alternative: Kabulkanlah kepada kami supaya kami dapat duduk
  rationale: Pilihan utama menyampaikan permohonan dengan wajar tanpa menyiratkan bahwa tempat itu telah diberikan; unsur duduk dari καθίσωμεν tetap dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat diatur agar permohonan terdengar alami, sedangkan ‘dalam kemuliaan-Mu’ dipertahankan dekat dengan bentuk dan ambiguitas sumber.
