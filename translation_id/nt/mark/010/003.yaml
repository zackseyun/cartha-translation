  text: But he answered them, “What did Moses command you?”
translation:
  language: id
  text: Namun Ia menjawab, “Apa yang Musa perintahkan kepada kalian?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Partikel penghubung ringan ini menandai peralihan dengan sedikit pertentangan terhadap pertanyaan yang menguji pada ayat sebelumnya; “Namun” alami dalam konteks ini tanpa membuat kontrasnya terlalu keras.
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ia menjawab
  rationale: Ungkapan Yunani yang secara harfiah berarti “setelah menjawab, berkata” menyatakan satu tindakan verbal dan paling wajar diterjemahkan sebagai “Ia menjawab” dalam bahasa Indonesia.
- source_word: αὐτοῖς
  choice: mereka
  rationale: Pronomina datif ini menunjuk kepada orang-orang yang menerima jawaban dan secara alami menjadi objek dalam frasa “menjawab mereka”.
- source_word: Τί
  choice: Apa
  rationale: Kata tanya ini menanyakan isi perintah Musa; “Apa” merupakan padanan langsung dan alami.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: Bentuk datif menandai penerima perintah. “Kepada kalian” mempertahankan fungsi itu dengan jelas dan membedakannya dari “mereka” dalam klausa pengantar.
- source_word: ἐνετείλατο
  choice: perintahkan
  rationale: Kata kerja ini berarti memberi perintah atau ketetapan yang berwenang; “perintahkan” mempertahankan nuansa hukum dan otoritas dalam pembahasan ini.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Nama diri ini diterjemahkan menurut bentuk baku yang dikenal luas dalam bahasa Indonesia.
theological_decisions:
- issue: Penyebutan kewenangan Musa dalam jawaban Yesus
  choice: Mempertahankan “Musa” sebagai perantara manusia yang disebut memberi perintah.
  alternative: “Apa yang diperintahkan hukum Musa kepada kalian?” atau “Apa yang Allah perintahkan kepada kalian melalui Musa?”
  rationale: Teks Yunani secara eksplisit menyebut Musa dan tidak memperluasnya menjadi “hukum Musa” ataupun “Allah melalui Musa.” Terjemahan ini mempertahankan bentuk pertanyaan Yesus tanpa memasukkan penjelasan teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipakai untuk menandai bahwa ὑμῖν berbentuk jamak; kapitalisasi “Ia” mengikuti kebiasaan terjemahan Alkitab Indonesia untuk rujukan kepada Yesus.
