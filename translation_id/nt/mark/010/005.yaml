  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν αὐτοῖς· Πρὸς τὴν σκληροκαρδίαν ὑμῶν ἔγραψεν ὑμῖν τὴν ἐντολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/005.yaml
  text: But Jesus said to them[c][b][a], “Because of your hardness of heart he wrote this commandment for you.”
translation:
  language: id
  text: Namun Yesus berkata kepada mereka, “Karena ketegaran hati kalian[b], ia[a] menuliskan perintah[c] ini bagi kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah Musa, yang disebut dalam ayat sebelumnya.
    reason: cross_reference
  - marker: b
    text: Atau “kekerasan hati” atau “sikap keras kepala.”
    reason: lexical_alternative
  - marker: c
    text: Atau “ketetapan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras ringan ketika Yesus menanggapi jawaban mereka tentang perintah Musa; “namun” alami dalam dialog dan tidak membuat pertentangannya terlalu tajam.
- source_word: Πρὸς
  choice: Karena
  rationale: Dalam konstruksi ini, πρός dengan akusatif menyatakan alasan atau keadaan yang melatarbelakangi pemberian perintah tersebut.
- source_word: σκληροκαρδίαν
  choice: kekerasan hati
  rationale: Mempertahankan metafora Yunani tentang hati yang keras serta bobot moralnya, tanpa mempersempit maknanya menjadi sekadar sikap keras kepala.
- source_word: ἔγραψεν
  choice: ia menuliskan
  rationale: Subjek tunggal tersirat merujuk kepada Musa dalam ayat sebelumnya. Kata ganti mempertahankan kesinambungan wacana tanpa menambahkan nama yang tidak diulang dalam teks Yunani.
- source_word: ἐντολὴν
  choice: perintah
  rationale: Menyampaikan ketetapan yang berwibawa dalam konteks hukum Musa dengan bahasa Indonesia modern dan wajar.
- source_word: ταύτην
  choice: ini
  rationale: Menunjuk langsung kepada perintah khusus yang sedang dibicarakan.
theological_decisions:
- issue: Apakah Musa perlu disebut secara eksplisit sebagai subjek ἔγραψεν
  choice: Memakai “ia” dan menjelaskan rujukannya dalam catatan kaki
  alternative: “Musa menuliskan”
  rationale: Teks Yunani tidak mengulangi nama Musa dalam ayat ini. Kata ganti menjaga bentuk dan alur sumber, sedangkan catatan kaki mencegah ketidakjelasan bagi pembaca.
- issue: Cara menerjemahkan σκληροκαρδία tanpa mengurangi daya metaforis dan moralnya
  choice: “kekerasan hati”
  alternative: “sikap keras kepala”
  rationale: Pilihan utama mempertahankan gambaran antropologis dalam bahasa sumber dan membiarkan cakupan maknanya tetap luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “kalian” dipakai karena bentuk Yunani ὑμῶν dan ὑμῖν jamak serta konteksnya adalah percakapan langsung. Struktur kalimat tetap dekat dengan urutan dan hubungan sebab dalam teks Yunani, tetapi mengalir alami dalam bahasa Indonesia.
