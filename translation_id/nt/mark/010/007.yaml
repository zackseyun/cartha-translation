  text: ἕνεκεν τούτου καταλείψει ἄνθρωπος τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα ⸂καὶ προσκολληθήσεται πρὸς τὴν γυναῖκα αὐτοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/007.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife,[a]
translation:
  language: id
  text: Karena itu, seorang laki-laki akan meninggalkan ayah dan ibunya dan berpaut kepada istrinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melekat erat pada istrinya.” Kata kerja Yunani ini menekankan keterikatan yang erat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνεκεν τούτου
  choice: Karena itu
  rationale: Ungkapan sebab-akibat yang alami dalam bahasa Indonesia dan tetap mempertahankan fungsi penjelasnya.
- source_word: καταλείψει
  choice: akan meninggalkan
  rationale: Menerjemahkan bentuk futur secara langsung dan menyatakan tindakan meninggalkan rumah tangga orang tua tanpa nuansa negatif yang tidak perlu.
- source_word: ἄνθρωπος
  choice: seorang laki-laki
  rationale: Walaupun dapat berarti manusia secara umum, konteks perkawinan dan penyebutan istrinya menunjukkan bahwa pihak laki-laki dimaksudkan di sini.
- source_word: τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα
  choice: ayah dan ibunya
  rationale: Susunan ini alami dalam bahasa Indonesia; akhiran posesif pada 'ibunya' secara wajar berlaku bagi kedua orang tua.
- source_word: προσκολληθήσεται
  choice: berpaut kepada
  rationale: Mengungkapkan keterikatan erat dan menetap, sekaligus mempertahankan citra leksikal verba Yunani lebih baik daripada ungkapan yang semata-mata berarti disatukan.
- source_word: πρὸς τὴν γυναῖκα αὐτοῦ
  choice: kepada istrinya
  rationale: Dalam konteks perkawinan, γυνή jelas berarti istri; preposisi 'kepada' sesuai dengan verba 'berpaut'.
theological_decisions:
- issue: Bahasa bergender dalam kutipan mengenai perkawinan
  choice: seorang laki-laki ... istrinya
  alternative: seseorang ... pasangannya
  rationale: Konteks secara khusus menggambarkan pasangan laki-laki dan perempuan; karena itu, unsur jenis kelamin dalam teks sumber tidak dinetralkan.
- issue: Nuansa keterikatan dalam προσκολληθήσεται
  choice: berpaut kepada
  alternative: dipersatukan dengan
  rationale: Pilihan utama mempertahankan gagasan melekat atau terikat erat tanpa membatasi maknanya pada tindakan eksternal yang menyatukan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Berpaut' cukup dikenal dalam ragam Alkitabiah dan sastra, sementara catatan kaki menjelaskan nuansa keterikatan erat bagi pembaca umum.
