  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/009.yaml
  text: Therefore[a], what God has joined together, man must not separate.
translation:
  language: id
  text: Karena itu, apa yang telah dipersatukan Allah, janganlah manusia[a] memisahkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “manusia” berbentuk tunggal tetapi digunakan secara umum, dengan arti siapa pun.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: apa yang
  rationale: Pronomina relatif netral tunggal ini merujuk secara kolektif kepada ikatan pernikahan yang baru saja dibicarakan. “Apa yang” wajar dalam bahasa Indonesia dan mempertahankan bentuk rujukan tersebut.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari uraian sebelumnya mengenai maksud Allah bagi pernikahan. “Karena itu” menyampaikan hubungan logis ini secara jelas dan alami.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Subjek dari tindakan mempersatukan; “Allah” merupakan padanan baku dan wajar dalam bahasa Indonesia.
- source_word: συνέζευξεν
  choice: telah dipersatukan
  rationale: Kata kerja ini berarti menyatukan atau memasangkan, secara harfiah dapat menggambarkan pemasangan dalam satu kuk. Bentuk “telah dipersatukan” menyampaikan tindakan Allah yang sudah terjadi dan tetap relevan, tanpa terlalu menonjolkan metafora kuk.
- source_word: ἄνθρωπος
  choice: manusia
  rationale: Nomina tunggal tanpa artikel ini digunakan secara generik. “Manusia” mempertahankan rujukan kepada manusia sebagai lawan dari Allah dan berlaku bagi siapa pun, bukan hanya laki-laki.
- source_word: μὴ χωριζέτω
  choice: janganlah ... memisahkannya
  rationale: Imperatif kini dengan μή menyatakan larangan. Susunan aktif ini mempertahankan manusia sebagai subjek dan “memisahkan” menjaga cakupan makna leksikal dalam konteks ikatan pernikahan.
theological_decisions:
- issue: Cakupan generik ἄνθρωπος dalam perkataan tentang pernikahan
  choice: Diterjemahkan “manusia” dengan arti generik
  alternative: seseorang; siapa pun; laki-laki
  rationale: Dalam konteks ini ἄνθρωπος menunjuk kepada manusia secara umum, bukan khusus kepada laki-laki. “Manusia” juga mempertahankan kontras antara tindakan Allah dan tindakan manusia tanpa membatasi penerapan larangan tersebut.
- issue: Nuansa συνέζευξεν sebagai tindakan ilahi
  choice: telah dipersatukan Allah
  alternative: telah dipasangkan Allah; telah disatukan Allah; telah dipasang dalam satu kuk oleh Allah
  rationale: “Dipersatukan” mempertahankan gagasan bahwa Allah adalah pelaku yang membentuk ikatan tersebut, sekaligus menghindari penafsiran tambahan tentang mekanisme atau saat persatuan itu terjadi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan “janganlah manusia memisahkannya” sedikit formal tetapi tetap alami serta mempertahankan bentuk larangan aktif dan kontras Allah–manusia dalam teks Yunani.
