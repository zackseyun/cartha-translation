id: MRK.10.42
reference: Mark 10:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂καὶ προσκαλεσάμενος αὐτοὺς ὁ Ἰησοῦς⸃ λέγει αὐτοῖς· Οἴδατε ὅτι οἱ δοκοῦντες ἄρχειν τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι αὐτῶν κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/042.yaml
  text: And Jesus called them to himself and said to them[a], “You know that those who are considered rulers of the Gentiles lord it over them[b], and their great ones exercise authority over them.”
translation:
  language: id
  text: Lalu Yesus memanggil mereka untuk mendekat dan berkata kepada mereka, “Kalian tahu bahwa orang-orang yang dianggap sebagai penguasa bangsa-bangsa lain[a] memerintah mereka dengan sewenang-wenang, dan para pembesar mereka menjalankan kekuasaan atas mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bangsa-bangsa bukan Yahudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: memanggil mereka untuk mendekat
  rationale: Bentuk medium προσκαλέομαι menyatakan bahwa Yesus memanggil mereka datang kepada-Nya. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan arah tindakan tanpa terasa kaku.
- source_word: λέγει
  choice: berkata
  rationale: Walaupun bahasa Yunani memakai kala kini historis, bentuk lampau naratif tersirat secara alami melalui rangkaian kalimat bahasa Indonesia; 'berkata' menyampaikan fungsi wacananya dengan lancar.
- source_word: Οἴδατε
  choice: Kalian tahu
  rationale: οἶδα berbentuk perfektum tetapi bermakna kini. 'Kalian tahu' langsung, alami, dan sesuai dengan sapaan Yesus kepada kelompok murid.
- source_word: οἱ δοκοῦντες ἄρχειν
  choice: orang-orang yang dianggap sebagai penguasa
  rationale: δοκοῦντες dapat berarti 'tampak' atau 'dianggap'. Dalam konteks ini frasa tersebut menunjuk kepada orang yang diakui sebagai penguasa, tanpa harus menyangkal bahwa mereka benar-benar berkuasa.
- source_word: τῶν ἐθνῶν
  choice: bangsa-bangsa lain
  rationale: Dalam konteks Yahudi, ἔθνη menunjuk kepada bangsa-bangsa non-Yahudi. 'Bangsa-bangsa lain' mempertahankan cakupan kolektifnya dan lebih mudah dipahami pembaca Indonesia daripada istilah gerejawi 'bangsa-bangsa bukan Yahudi' dalam teks utama.
- source_word: κατακυριεύουσιν
  choice: memerintah ... dengan sewenang-wenang
  rationale: Kata majemuk ini menyiratkan penguasaan yang menindas atau mendominasi, bukan sekadar pemerintahan yang netral. Pilihan ini menyatakan konotasi negatif tersebut secara jelas dan alami.
- source_word: οἱ μεγάλοι αὐτῶν
  choice: para pembesar mereka
  rationale: μέγαλοι di sini berarti orang-orang berkedudukan tinggi atau berpengaruh. 'Para pembesar' mempertahankan sifat umum istilah itu tanpa menetapkan jabatan tertentu.
- source_word: κατεξουσιάζουσιν
  choice: menjalankan kekuasaan atas
  rationale: Ungkapan ini mempertahankan arti dasar pelaksanaan wewenang dan membedakannya dari nuansa dominasi yang lebih tegas pada κατακυριεύουσιν.
theological_decisions:
- issue: Rujukan τῶν ἐθνῶν
  choice: bangsa-bangsa lain
  alternative: bangsa-bangsa bukan Yahudi; bangsa-bangsa
  rationale: Dalam latar tutur Yahudi, frasa ini secara wajar menunjuk dunia non-Yahudi. Pilihan utama mempertahankan kontras kontekstual tanpa memakai istilah yang mungkin kurang lazim bagi pembaca umum.
- issue: Daya makna δοκοῦντες
  choice: yang dianggap sebagai penguasa
  alternative: yang tampaknya memerintah; yang diakui sebagai penguasa
  rationale: Bahasa Yunani memuat kemungkinan nuansa penilaian atau penampakan. Dalam konteks ini, 'dianggap' mempertahankan nuansa tersebut tanpa menyimpulkan bahwa kekuasaan mereka hanya semu.
- issue: Sifat kekuasaan dalam κατακυριεύουσιν dan κατεξουσιάζουσιν
  choice: membedakan 'memerintah dengan sewenang-wenang' dari 'menjalankan kekuasaan atas'
  alternative: menerjemahkan keduanya dengan ungkapan dominasi yang sama kuat
  rationale: Pilihan ini mempertahankan paralelisme sekaligus perbedaan leksikal kedua verba; konotasi penyalahgunaan kuasa tampak jelas pada verba pertama tanpa meratakan keduanya.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada naratif yang bermartabat dan mudah dipahami. 'Kalian' dipakai sebagai pronomina jamak yang jelas untuk para murid; 'para pembesar' mempertahankan kesejajaran retoris tanpa menentukan jabatan yang tidak disebut dalam sumber.
