id: MRK.10.43
reference: Mark 10:43
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐχ οὕτως δέ ⸀ἐστιν ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ⸂μέγας γενέσθαι⸃ ἐν ὑμῖν, ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/043.yaml
  text: But it is not so among you[a]. Instead, whoever wants to become great among you will be your servant[b],
translation:
  language: id
  text: Namun, tidaklah demikian di antara kalian.[a] Sebaliknya, siapa pun yang ingin menjadi besar di antara kalian akan menjadi pelayan kalian,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Namun, caranya tidak demikian di antara kalian.”
    reason: lexical_alternative
  - marker: b
    text: 'Dalam konteks ini, bentuk futur “akan menjadi” juga dapat mengandung arti “harus menjadi”: siapa pun yang ingin menjadi besar di antara kalian harus menjadi pelayan kalian.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν
  choice: Namun, tidaklah demikian di antara kalian
  rationale: Ungkapan ini secara alami menyatakan pertentangan dengan pola kekuasaan yang disebut sebelumnya. “Tidaklah demikian” mempertahankan penyangkalan terhadap cara atau pola tersebut, sedangkan “di antara kalian” menyampaikan makna komunal ἐν ὑμῖν.
- source_word: ἀλλ’
  choice: Sebaliknya
  rationale: Menandai koreksi dan pertentangan kuat antara pola kebesaran duniawi dan pola yang harus berlaku dalam komunitas para murid.
- source_word: ὃς ἂν θέλῃ
  choice: siapa pun yang ingin
  rationale: Konstruksi relatif dengan ἄν dan bentuk subjungtif menyatakan kondisi umum atau tak tentu; frasa ini wajar dalam bahasa Indonesia dan mempertahankan unsur kehendak dalam θέλῃ.
- source_word: μέγας γενέσθαι
  choice: menjadi besar
  rationale: “Menjadi” mempertahankan aspek ingresif γενέσθαι, sementara “besar” menjaga bahasa mengenai kedudukan tanpa mempersempitnya menjadi terkenal atau penting.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Menyampaikan lingkup sosial dan komunal frasa tersebut serta diterapkan secara konsisten pada kedua kemunculannya.
- source_word: ἔσται ὑμῶν διάκονος
  choice: akan menjadi pelayan kalian
  rationale: “Akan menjadi” mempertahankan bentuk futur ἔσται, dan “pelayan” menyampaikan διάκονος sebagai orang yang melayani tanpa mengesankan jabatan gerejawi atau perbudakan.
theological_decisions:
- issue: Daya instruktif bentuk futur ἔσται
  choice: akan menjadi pelayan kalian
  alternative: harus menjadi pelayan kalian
  rationale: Bentuk futur dalam konteks ini dapat memiliki daya normatif atau instruktif. Teks utama mempertahankan bentuk futur Yunani, sedangkan catatan kaki menjaga kemungkinan bahwa maksud kontekstualnya adalah keharusan.
- issue: Makna διάκονος
  choice: pelayan
  alternative: diaken; hamba
  rationale: Dalam konteks ini istilah tersebut menunjuk pada orang yang melayani dengan rendah hati, bukan secara khusus jabatan gerejawi. “Pelayan” juga membedakannya dari bahasa perbudakan yang lebih kuat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Kalian” dipilih untuk bentuk jamak ὑμῖν/ὑμῶν agar pembedaan jumlah tetap jelas. Struktur paralel dan ketegangan antara bentuk futur serta daya normatifnya dipertahankan.
