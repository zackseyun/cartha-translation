base_translation:
  language: en
  yaml_path: translation/nt/mark/010/051.yaml
  text: And answering him[a], Jesus said, “What do you want me to do for you?” And the blind man said to him, “Rabboni, that I may see again.”
translation:
  language: id
  text: Yesus menjawabnya, “Apa yang kamu ingin Aku lakukan bagimu?” Orang buta itu berkata kepada-Nya, “Rabuni,[a] aku ingin dapat melihat kembali.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rabuni adalah bentuk sapaan dalam bahasa Aram yang berarti “guruku” atau “tuanku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: berkata
  rationale: Partisip ini secara harfiah berarti 'menjawab', tetapi dalam konteks ini berfungsi sebagai pengantar tanggapan Yesus. 'Berkata' alami dalam bahasa Indonesia dan tidak menyiratkan bahwa perkataan sebelumnya berbentuk pertanyaan.
- source_word: Τί σοι θέλεις ποιήσω
  choice: Apa yang kamu ingin Aku lakukan bagimu?
  rationale: Ungkapan ini mempertahankan unsur kehendak dalam θέλεις dan datif σοι melalui 'bagimu', dengan susunan yang jelas dan wajar dalam bahasa Indonesia modern.
- source_word: τυφλὸς
  choice: orang buta itu
  rationale: Adjektiva ini dipakai secara substantival. 'Orang buta itu' mengungkapkan rujukan individualnya secara alami dan sesuai konteks.
- source_word: Ραββουνι
  choice: Rabuni
  rationale: Bentuk sapaan Aram yang ditransliterasikan dalam teks Yunani dipertahankan sebagai gelar khas; ejaan 'Rabuni' mudah dibaca dalam bahasa Indonesia, sedangkan maknanya dijelaskan dalam catatan kaki.
- source_word: ἵνα ἀναβλέψω
  choice: aku ingin dapat melihat kembali
  rationale: Dalam konteks penyembuhan, ἀναβλέπω berarti memperoleh kembali penglihatan. Karena frasa ἵνα ini merupakan jawaban eliptis atas pertanyaan tentang keinginan, 'aku ingin' melengkapinya secara alami tanpa mengubah maksud.
theological_decisions:
- issue: Penerjemahan Ραββουνι sebagai gelar sapaan
  choice: Mempertahankan 'Rabuni' dalam teks utama dan menjelaskan artinya dalam catatan kaki
  alternative: Menerjemahkannya langsung sebagai 'Guruku' atau 'Tuanku'
  rationale: Teks Yunani sendiri mempertahankan bentuk Semitik ini, sehingga transliterasi menjaga warna historis dan kekuatan sapaannya tanpa menetapkan hanya satu padanan Indonesia.
- issue: Makna ἀναβλέψω dalam konteks kebutaan
  choice: melihat kembali
  alternative: menengadah atau melihat
  rationale: Dalam kisah pemulihan penglihatan, verba ini paling wajar menunjuk pada memperoleh kembali kemampuan melihat. Terjemahan ini menjaga nuansa pemulihan tanpa menambahkan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Sapaan 'kamu' dipakai secara alami dalam percakapan langsung; huruf kapital pada kata ganti yang merujuk kepada Yesus mengikuti kebiasaan luas penerbitan Alkitab bahasa Indonesia. Struktur Yunani disampaikan secara idiomatis tanpa menghilangkan isi semantisnya.
