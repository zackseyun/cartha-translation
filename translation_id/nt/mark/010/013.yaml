  text: Καὶ προσέφερον αὐτῷ παιδία ἵνα ⸂αὐτῶν ἅψηται⸃· οἱ δὲ μαθηταὶ ⸂ἐπετίμησαν αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/013.yaml
  text: And they were bringing children to him so that he might touch them[a], but the disciples rebuked them.
translation:
  language: id
  text: Orang-orang membawa anak-anak[a] kepada-Nya supaya Ia menyentuh mereka, tetapi murid-murid menegur mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “anak-anak kecil.” Kata Yunani παιδία dapat berarti anak-anak dalam arti luas, termasuk anak-anak yang masih kecil.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέφερον
  choice: terus membawa
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung atau berulang pada masa lampau. Ungkapan ini mempertahankan aspek tersebut tanpa mengubah tindakan dasarnya, yaitu membawa atau menghadapkan seseorang kepada orang lain.
- source_word: παιδία
  choice: anak-anak
  rationale: Kata ini dapat menunjuk kepada anak-anak secara luas, termasuk anak-anak yang masih kecil. “Anak-anak” merupakan padanan Indonesia yang paling alami dan tidak mempersempit usia mereka secara berlebihan.
- source_word: ἵνα αὐτῶν ἅψηται
  choice: supaya Ia menyentuh mereka
  rationale: ἵνα dengan bentuk subjungtif menyatakan tujuan, sedangkan ἅπτομαι secara langsung berarti menyentuh atau memegang. Terjemahan ini tidak memasukkan tindakan menumpangkan tangan dari kisah-kisah sejajar.
- source_word: ἐπετίμησαν
  choice: menegur
  rationale: ἐπιτιμάω menyatakan teguran atau celaan yang tegas. “Menegur” jelas, wajar, dan tetap bermartabat dalam bahasa Indonesia modern.
- source_word: αὐτοῖς
  choice: mereka
  rationale: Kata ganti ini kemungkinan besar merujuk kepada orang-orang yang membawa anak-anak. Namun, penggunaan “mereka” mempertahankan bentuk pronominal dan kadar ambiguitas yang terdapat dalam teks Yunani.
- source_word: δὲ
  choice: tetapi
  rationale: δέ menandai pertentangan ringan antara tindakan orang-orang yang membawa anak-anak dan tanggapan para murid.
theological_decisions:
- issue: Pihak yang ditegur oleh murid-murid
  choice: Kata ganti “mereka” dipertahankan; dalam konteks, rujukan yang paling mungkin ialah orang-orang yang membawa anak-anak.
  alternative: Murid-murid menegur anak-anak itu sendiri.
  rationale: Subjek tersirat dari προσέφερον merupakan anteseden yang paling masuk akal, dan alur ayat berikutnya menunjukkan bahwa para murid menghalangi orang-orang tersebut. Namun, karena teks Yunani memakai kata ganti tanpa menyebut rujukannya secara eksplisit, terjemahan utama juga memakai kata ganti agar ambiguitas gramatikalnya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kata ganti ilahi ditulis dengan huruf kapital menurut kebiasaan umum penerbitan Alkitab bahasa Indonesia. Ungkapan “terus membawa” mempertahankan nuansa tindakan yang berlangsung atau berulang, sedangkan “menyentuh” mempertahankan makna langsung teks tanpa mengimpor rincian dari bagian sejajar.
