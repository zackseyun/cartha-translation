base_translation:
  language: en
  yaml_path: translation/nt/mark/010/015.yaml
  text: Truly I say to you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: id
  text: 'Sesungguhnya Aku berkata kepada kalian: siapa pun yang tidak menerima Kerajaan Allah seperti seorang anak[a] pasti tidak akan masuk ke dalamnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai seorang anak.” Ungkapan ini dapat menunjuk pada kerendahan hati, kepercayaan, atau ketergantungan seorang anak, tetapi teks Yunani tidak menentukan nuansa yang dimaksud.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Sesungguhnya
  rationale: Menyampaikan pembuka ucapan yang khidmat dan berwibawa secara alami dalam bahasa Indonesia, tanpa mempertahankan bentuk pinjaman “Amin” yang dalam pemakaian umum lebih sering dipahami sebagai tanggapan penutup.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Terjemahan langsung dan wajar untuk verba kini dengan pronomina datif; “kepadamu” dapat menyapa kelompok maupun individu dalam bahasa Indonesia.
- source_word: ὃς ἂν
  choice: siapa pun yang
  rationale: Menangkap sifat tak tentu dan umum dari pronomina relatif yang disertai ἄν.
- source_word: μὴ δέξηται
  choice: tidak menerima
  rationale: “Menerima” cocok dengan objek Kerajaan Allah serta mempertahankan gambaran sikap reseptif, tanpa mempersempitnya menjadi sekadar menyambut atau menyetujui.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Padanan baku dan mudah dipahami yang tetap dapat mencakup dimensi pemerintahan maupun ranah kerajaan.
- source_word: ὡς παιδίον
  choice: seperti seorang anak
  rationale: Mempertahankan bentuk perbandingan dan tidak menentukan apakah yang dimaksud ialah kerendahan hati, kepercayaan, ketergantungan, atau nuansa lain.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: pasti tidak akan masuk
  rationale: Menyampaikan penyangkalan kuat οὐ μή dengan bentuk yang tegas namun alami dalam bahasa Indonesia modern.
- source_word: εἰς αὐτήν
  choice: ke dalamnya
  rationale: Pronomina merujuk kembali kepada Kerajaan Allah; “masuk ke dalamnya” mempertahankan unsur arah εἰς secara alami.
theological_decisions:
- issue: Makna menerima Kerajaan Allah “seperti seorang anak”
  choice: Mempertahankan perumpamaan tanpa menetapkan sifat anak tertentu.
  alternative: Menjelaskannya sebagai menerima dengan kerendahan hati, kepercayaan, atau ketergantungan seorang anak.
  rationale: Teks Yunani menyatakan perbandingan, tetapi tidak menyebutkan secara khusus sifat anak yang dimaksud. Terjemahan tidak boleh menutup ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Huruf kapital pada “Aku” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Yesus, sedangkan susunan kalimat tetap dekat dengan bentuk pernyataan Yunani.
