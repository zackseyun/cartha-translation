  text: ὁ δὲ στυγνάσας ἐπὶ τῷ λόγῳ ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/022.yaml
  text: But he[a], becoming gloomy at the word, went away grieving[c][b], for he had many possessions.
translation:
  language: id
  text: Namun, wajahnya menjadi muram karena perkataan itu[a]; ia pergi sambil bersedih, sebab ia memiliki banyak harta benda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi sedih” atau “menjadi patah semangat”; kata Yunaninya dapat menyiratkan perubahan muram yang tampak pada raut wajah.
    reason: lexical_alternative
lexical_decisions:
- source_word: στυγνάσας
  choice: wajahnya menjadi muram
  rationale: Ungkapan ini mempertahankan nuansa perubahan yang tampak pada raut wajah, bukan hanya perasaan batin, dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἐπὶ τῷ λόγῳ
  choice: mendengar perkataan itu
  rationale: Frasa Yunani menunjukkan perkataan tersebut sebagai kesempatan atau penyebab reaksinya. Bentuk ini alami dalam bahasa Indonesia, meskipun hubungan kausal juga mungkin.
- source_word: ἀπῆλθεν
  choice: Ia pergi
  rationale: Padanan naratif yang sederhana dan alami untuk tindakan meninggalkan tempat itu.
- source_word: λυπούμενος
  choice: dengan sedih
  rationale: Menggambarkan kesedihan yang menyertai kepergiannya tanpa menambahkan penilaian moral yang tidak dinyatakan teks.
- source_word: κτήματα πολλά
  choice: hartanya banyak
  rationale: κτήματα menunjuk pada milik atau harta benda; susunan ini alami dan mempertahankan gagasan banyaknya kepemilikan.
- source_word: ἦν γὰρ ἔχων
  choice: sebab hartanya
  rationale: Konstruksi perifrastis Yunani dipadatkan secara wajar dalam bahasa Indonesia menjadi keadaan memiliki harta.
theological_decisions:
- issue: Sifat tanggapan emosional orang itu terhadap perkataan Yesus
  choice: Menggambarkan raut wajah yang menjadi muram dan kepergian dalam kesedihan tanpa menambahkan kemarahan atau pemberontakan.
  alternative: Menerjemahkannya sebagai marah atau sekadar kecewa.
  rationale: Kosakata Yunani menyatakan kemuraman yang tampak dan kesedihan yang berlanjut, tetapi tidak secara eksplisit menyebut kemarahan atau memberi penilaian moral lebih jauh.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Terjemahan mengutamakan kejelasan sekaligus mempertahankan gambaran visual στυγνάσας dan ketegangan naratif tanpa tafsiran tambahan.
