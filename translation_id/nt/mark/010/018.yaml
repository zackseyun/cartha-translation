  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/018.yaml
  text: But Jesus said to him[a], “Why do you call me good? No one is good except one—God.”
translation:
  language: id
  text: Tetapi Yesus berkata kepadanya, “Mengapa kamu menyebut Aku baik? Tidak seorang pun baik, kecuali satu, yaitu Allah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan tanggapan yang bernuansa kontras ringan; lebih wajar daripada mempertahankan konjungsi secara kaku.
- source_word: εἶπεν αὐτῷ
  choice: berkata kepadanya
  rationale: Padanan langsung dan alami yang mempertahankan verba ujaran beserta objek tak langsungnya.
- source_word: Τί
  choice: Mengapa
  rationale: Dalam konstruksi ini τί berfungsi secara adverbial untuk menanyakan alasan; 'Mengapa' merupakan ungkapan Indonesia yang alami.
- source_word: με λέγεις ἀγαθόν
  choice: kamu menyebut Aku baik
  rationale: Mempertahankan με sebagai objek dan ἀγαθόν sebagai pelengkap predikatif tanpa menambahkan tafsiran.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: baik
  rationale: Kata yang sama dipakai pada kedua kemunculan untuk mempertahankan pengulangan dan daya retoris teks Yunani.
- source_word: οὐδεὶς
  choice: Tidak ada yang
  rationale: Menyampaikan penyangkalan universal secara jelas dan alami dalam bahasa Indonesia.
- source_word: εἰ μὴ εἷς
  choice: selain satu
  rationale: Mempertahankan konstruksi pengecualian sekaligus penekanan pada keesaan sebelum identifikasi 'Allah'.
- source_word: ὁ θεός
  choice: Allah
  rationale: Sebutan baku dan alami bagi θεός dalam konteks monoteistis ini; artikel Yunani tidak perlu diterjemahkan tersendiri.
theological_decisions:
- issue: Kemungkinan implikasi kristologis dari perkataan Yesus tentang kebaikan
  choice: Menerjemahkan pernyataan secara langsung tanpa penjelas yang menyiratkan bahwa Yesus menyangkal keilahian-Nya atau secara eksplisit menegaskannya di sini.
  alternative: Merumuskan ayat sehingga menjadi penyangkalan terhadap keilahian Yesus, atau sebaliknya menjadi klaim keilahian yang eksplisit.
  rationale: Teks menantang penggunaan sebutan 'baik' oleh orang itu, tetapi tidak secara eksplisit menjelaskan seluruh implikasi kristologisnya; ketegangan tersebut dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Huruf kapital pada 'Aku' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Yesus. Tidak diperlukan catatan kaki karena idiom τί diwakili secara alami oleh 'Mengapa' tanpa kehilangan ambiguitas penting.
