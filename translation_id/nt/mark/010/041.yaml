translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Merasa geram” dipilih untuk menyampaikan ketidaksenangan kuat tanpa terdengar terlalu teknis. Penambahan “murid” bersifat kontekstual dan membantu kejelasan rujukan; penanda definit tetap dinyatakan dengan “itu”.
