translation:
  language: id
  text: Ketika kesepuluh murid itu mendengarnya, mereka mulai geram terhadap Yakobus dan Yohanes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengenai Yakobus dan Yohanes” atau “karena Yakobus dan Yohanes.” Kata depan Yunani yang digunakan dapat menandai sasaran ataupun penyebab kegusaran mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Ketika
  rationale: Dalam bahasa Indonesia, hubungan naratif dan temporal Καὶ ἀκούσαντες paling alami diungkapkan sebagai anak kalimat “Ketika ... mendengarnya”; daya penghubung Καὶ tetap tercakup tanpa menambahkan urutan waktu yang berlebihan.
- source_word: ἀκούσαντες
  choice: mendengarnya
  rationale: Partisip aoris menunjukkan tindakan yang mendahului verba utama. Akhiran -nya secara wajar menyatakan objek tersirat, yakni perkataan atau permintaan yang baru disampaikan.
- source_word: οἱ δέκα
  choice: kesepuluh murid itu
  rationale: Secara harfiah berarti “kesepuluh orang itu.” Kata “murid” memperjelas rujukan yang sudah pasti dari konteks, sedangkan “itu” mempertahankan sifat definit frasa Yunani.
- source_word: ἤρξαντο
  choice: mulai
  rationale: Mempertahankan aspek ingresif, yaitu awal munculnya reaksi mereka.
- source_word: ἀγανακτεῖν
  choice: merasa geram
  rationale: Mengungkapkan ketidaksenangan kuat atau kejengkelan bernuansa keberatan, lebih tajam daripada sekadar “kesal” tetapi tetap alami bagi pembaca Indonesia modern.
- source_word: περὶ Ἰακώβου καὶ Ἰωάννου
  choice: terhadap Yakobus dan Yohanes
  rationale: “Terhadap” secara alami menunjukkan bahwa Yakobus dan Yohanes menjadi sasaran kegusaran, sambil mempertahankan alternatif bahwa περί dapat menunjuk pokok atau penyebab reaksi melalui catatan kaki.
- source_word: Ἰακώβου
  choice: Yakobus
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia untuk Ἰάκωβος.
- source_word: Ἰωάννου
  choice: Yohanes
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia untuk Ἰωάννης.
