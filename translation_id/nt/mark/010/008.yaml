  yaml_path: translation/nt/mark/010/008.yaml
  text: and the two will become one flesh. So they are no longer two[a], but one flesh.
translation:
  language: id
  text: Dan keduanya akan menjadi satu daging. Dengan demikian, mereka bukan lagi dua, melainkan satu daging.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσονται ... εἰς
  choice: akan menjadi
  rationale: Walaupun ἔσονται berasal dari verba 'ada/adalah', konstruksi dengan εἰς dan akusatif menyatakan hasil atau peralihan menuju kesatuan; 'akan menjadi' merupakan ungkapan Indonesia yang alami.
- source_word: οἱ δύο
  choice: keduanya
  rationale: Pilihan ini menyatakan dua pihak secara eksplisit dan tetap mendukung kontras berikutnya dengan 'bukan lagi dua'.
- source_word: εἰς σάρκα μίαν
  choice: satu daging
  rationale: Ungkapan alkitabiah ini dipertahankan untuk menjaga kaitannya dengan Kejadian serta keluasan makna persatuan dalam perkawinan; unsur εἰς tercakup secara idiomatis dalam 'menjadi'.
- source_word: ὥστε
  choice: Dengan demikian
  rationale: Di sini ὥστε memperkenalkan hasil atau kesimpulan dari pernyataan sebelumnya. 'Dengan demikian' mempertahankan hubungan logis dengan ragam bahasa yang wajar dan bermartabat.
- source_word: οὐκέτι εἰσὶν δύο
  choice: mereka bukan lagi dua
  rationale: Terjemahan ini mempertahankan penyangkalan keadaan sebelumnya dan pengulangan kata 'dua' yang menjadi bagian penting dari argumen.
- source_word: ἀλλὰ μία σάρξ
  choice: melainkan satu daging
  rationale: '''Melainkan'' menyampaikan kontras setelah penyangkalan secara alami, sedangkan ''satu daging'' mempertahankan istilah sumber tanpa menggantinya dengan tafsiran.'
theological_decisions:
- issue: Makna 'satu daging' dalam kutipan Yesus dari Kejadian
  choice: Mempertahankan ungkapan 'satu daging' tanpa penjelasan interpretatif di dalam teks.
  alternative: satu tubuh; satu pribadi; bersatu secara seksual
  rationale: Teks tidak membatasi ungkapan ini pada satu aspek saja. Mempertahankan bentuk alkitabiahnya menjaga keluasan makna antropologis dan perkawinan serta menghindari penyisipan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, ringkas, dan bermartabat. Struktur paralel 'dua ... satu daging' dipertahankan untuk menonjolkan logika ayat.
