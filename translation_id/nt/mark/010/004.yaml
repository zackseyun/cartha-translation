base_translation:
  language: en
  yaml_path: translation/nt/mark/010/004.yaml
  text: They said[b][a], “Moses permitted us to write a certificate of divorce and send her away.”
translation:
  language: id
  text: Mereka berkata, “Musa mengizinkan seorang suami menulis surat cerai[a] dan menceraikan istrinya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “surat perceraian.” Frasa Yunani ini menunjuk pada dokumen hukum tertulis mengenai perceraian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menyuruhnya pergi”; dalam konteks ini berarti menceraikan istri. Kata “istrinya” tersirat dari konteks dan tidak dinyatakan secara eksplisit dalam teks Yunani.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Jawab mereka
  rationale: Ungkapan ini memperkenalkan jawaban orang-orang Farisi yang disebut sebelumnya. δέ menandai kelanjutan atau pertentangan ringan; susunan ‘Jawab mereka’ alami dalam bahasa Indonesia dan cukup menyampaikan fungsi tersebut.
- source_word: Ἐπέτρεψεν
  choice: mengizinkan
  rationale: ἐπιτρέπω berarti memberi izin atau membolehkan. ‘Mengizinkan’ mempertahankan perbedaan penting dalam konteks antara izin dan perintah.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Bentuk nama yang baku dalam Alkitab dan bahasa Indonesia.
- source_word: βιβλίον ἀποστασίου
  choice: surat cerai
  rationale: Frasa ini menunjuk pada dokumen hukum tertulis yang mengesahkan perceraian. ‘Surat cerai’ jelas, alami, dan lazim dipahami dalam bahasa Indonesia modern.
- source_word: γράψαι
  choice: menulis
  rationale: γράφω secara langsung berarti ‘menulis’; pilihan ini tidak mempersempit maknanya menjadi penyusunan teknis dokumen.
- source_word: καὶ ἀπολῦσαι
  choice: lalu menceraikan istrinya
  rationale: Dalam konteks perkawinan, ἀπολύω berarti melepaskan atau menceraikan istri. ‘Menceraikan’ menyampaikan makna idiomatisnya secara jelas; ‘istrinya’ melengkapi objek yang tersirat dari konteks, bukan dinyatakan secara eksplisit dalam bahasa Yunani.
theological_decisions:
- issue: Sifat ketetapan Musa mengenai perceraian
  choice: Musa mengizinkan perceraian, bukan memerintahkannya secara positif
  alternative: Musa memerintahkan seorang suami menulis surat cerai
  rationale: Kata Ἐπέτρεψεν secara eksplisit menyatakan izin. Ini mempertahankan ketegangan dalam konteks berikutnya antara kelonggaran karena kekerasan hati dan maksud Allah sejak penciptaan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. ‘Seorang suami’ ditambahkan untuk memperjelas subjek tersirat dari kedua infinitif tanpa mengubah acuan kontekstual. Urutan ‘lalu’ menyatakan rangkaian tindakan yang dihubungkan dengan καί secara alami.
