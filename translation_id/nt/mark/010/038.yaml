  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω, ⸀ἢ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/038.yaml
  text: But Jesus said to them[a], “You do not know what you are asking. Are you able to drink the cup that I drink[b], or to be baptized with the baptism with which I am baptized?”
translation:
  language: id
  text: Namun Yesus berkata kepada mereka, “Kamu tidak tahu apa yang kamu minta. Sanggupkah kamu meminum cawan yang Kuminum[a], atau dibaptis dengan baptisan yang Aku terima[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cawan” merupakan metafora alkitabiah untuk bagian atau pengalaman yang ditetapkan bagi seseorang; di sini terutama menunjuk kepada penderitaan Yesus yang akan datang.
    reason: cross_reference
  - marker: b
    text: Atau, secara lebih interpretatif, “mengalami baptisan yang Kualami.” Bahasa Yunani mengulang kata-kata dari kelompok “baptisan/baptis” untuk memberi penekanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Namun, Yesus berkata kepada mereka
  rationale: δέ menandai peralihan yang bersifat korektif terhadap permintaan sebelumnya. “Namun” menyatakan kontras ringan dengan wajar dalam bahasa Indonesia.
- source_word: Οὐκ οἴδατε τί αἰτεῖσθε
  choice: Kamu tidak tahu apa yang kamu minta
  rationale: Terjemahan ini mempertahankan arti dasar οἶδα sebagai ‘tahu’ dan αἰτέω sebagai ‘meminta’, tanpa mempersempitnya menjadi sekadar ‘memahami’.
- source_word: δύνασθε
  choice: Sanggupkah kamu
  rationale: “Sanggup” menyatakan kemampuan atau kapasitas dan terdengar alami dalam pertanyaan langsung bahasa Indonesia.
- source_word: πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω
  choice: minum dari cawan yang Kuminum
  rationale: Metafora cawan dipertahankan. Preposisi “dari” membuat ungkapan tindakan minum lebih alami dalam bahasa Indonesia tanpa menjelaskan metaforanya di dalam teks.
- source_word: ποτήριον
  choice: cawan
  rationale: “Cawan” merupakan istilah Indonesia yang lazim dan bermartabat untuk metafora alkitabiah ini; maknanya tidak diperluas menjadi ‘penderitaan’ dalam teks utama.
- source_word: ἢ
  choice: atau
  rationale: Mempertahankan konjungsi disjungtif yang terdapat dalam teks SBLGNT dan tidak menyelaraskannya dengan tradisi teks lain.
- source_word: τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι
  choice: dibaptis dengan baptisan yang dengannya Aku dibaptis
  rationale: Pengulangan kelompok kata βάπτισμα/βαπτίζω dipertahankan untuk menjaga penekanan retoris dan hubungan leksikalnya, meskipun hasilnya sengaja lebih padat daripada parafrasa interpretatif.
theological_decisions:
- issue: Bahasa metaforis ‘cawan’ dan ‘baptisan’
  choice: Kedua metafora dipertahankan secara harfiah dalam teks utama.
  alternative: Menafsirkannya langsung sebagai penderitaan, kematian, atau murka ilahi.
  rationale: Ayat ini menunjuk kepada pengalaman yang akan dijalani Yesus tanpa menguraikan seluruh maknanya. Mempertahankan metafora menjaga ketegangan teologis dan gema antarteks tanpa memasukkan penjelasan doktrinal yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti orang kedua jamak diterjemahkan “kamu” karena konteks menyebut lebih dari satu orang. Kapitalisasi enklitik pada “Kuminum” dan kata “Aku” mengikuti kebiasaan penghormatan dalam penerbitan Alkitab bahasa Indonesia. Metafora dan pengulangan sumber dipertahankan, sementara catatan kaki membantu pembaca memahami ungkapan yang kurang lazim.
