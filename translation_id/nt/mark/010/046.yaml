id: MRK.10.46
reference: Mark 10:46
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἰεριχώ. καὶ ἐκπορευομένου αὐτοῦ ἀπὸ Ἰεριχὼ καὶ τῶν μαθητῶν αὐτοῦ καὶ ὄχλου ἱκανοῦ ⸀ὁ υἱὸς Τιμαίου Βαρτιμαῖος ⸀τυφλὸς ⸂προσαίτης ἐκάθητο παρὰ τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/046.yaml
  text: And they came to Jericho[a]. And as he was going out from Jericho, along with his disciples and a considerable crowd, Bartimaeus, the son of Timaeus, a blind beggar[c][b], was sitting beside the road.
translation:
  language: id
  text: Kemudian tibalah mereka di Yerikho.[a] Ketika Yesus keluar dari Yerikho bersama murid-murid-Nya dan orang banyak dalam jumlah besar,[b] Bartimeus, anak Timeus, seorang pengemis buta, sedang duduk di pinggir jalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bentuk kata kerjanya adalah bentuk kini: “mereka tiba” atau “mereka datang.” Bentuk kini historis ini lazim dipakai dalam narasi Yunani.'
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “bersama murid-murid-Nya dan kerumunan besar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: tibalah mereka
  rationale: Bentuk kini historis Yunani dialihkan ke bentuk naratif Indonesia yang alami. Partikel -lah memberi gerak pada alur tanpa mengubah urutan peristiwa.
- source_word: ἐκπορευομένου αὐτοῦ
  choice: ketika Yesus keluar
  rationale: Konstruksi genitif absolut menyatakan tindakan yang berlangsung bersamaan. Nama 'Yesus' dipakai untuk memperjelas rujukan kata ganti dalam bahasa Indonesia.
- source_word: ὄχλου ἱκανοῦ
  choice: orang banyak dalam jumlah besar
  rationale: ἱκανός di sini menunjukkan jumlah yang besar atau cukup banyak. Ungkapan ini alami dan tidak melebih-lebihkan maknanya.
- source_word: ὁ υἱὸς Τιμαίου Βαρτιμαῖος
  choice: Bartimeus, anak Timeus
  rationale: Susunan aposisi dipertahankan dengan nama pribadi sekaligus penjelasannya, sesuai dengan informasi yang diberikan teks Yunani.
- source_word: τυφλὸς προσαίτης
  choice: seorang pengemis buta
  rationale: Kedua unsur diterjemahkan langsung dengan ungkapan Indonesia yang jelas dan wajar.
- source_word: ἐκάθητο
  choice: sedang duduk
  rationale: Bentuk imperfek menggambarkan keadaan yang sedang berlangsung ketika Yesus keluar dari kota.
- source_word: παρὰ τὴν ὁδόν
  choice: di pinggir jalan
  rationale: Frasa ini menyatakan posisi di sisi jalan; 'di pinggir jalan' merupakan padanan Indonesia yang alami dan tepat.
- source_word: Ἰεριχώ
  choice: Yerikho
  rationale: Menggunakan bentuk baku nama tempat yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Identifikasi Bartimeus dalam narasi
  choice: Mempertahankan nama 'Bartimeus' dan keterangan 'anak Timeus'.
  alternative: Hanya memakai nama Bartimeus atau hanya menerjemahkan artinya sebagai anak Timeus.
  rationale: Teks Yunani memuat keduanya. Mempertahankan keduanya menjaga rincian narasi tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat mengalir bagi pembaca umum, sambil mempertahankan urutan peristiwa, identifikasi lengkap Bartimeus, dan nuansa tindakan yang sedang berlangsung.
