id: MRK.10.1
reference: Mark 10:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐκεῖθεν ἀναστὰς ἔρχεται εἰς τὰ ὅρια τῆς Ἰουδαίας ⸀καὶ πέραν τοῦ Ἰορδάνου, καὶ συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν, καὶ ὡς εἰώθει πάλιν ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/001.yaml
  text: And from there[a], rising, he comes into the region of Judea and beyond the Jordan, and crowds gather to him again, and as was his custom[b], he again taught them.
translation:
  language: id
  text: Lalu Ia beranjak dari sana dan pergi ke wilayah Yudea dan ke daerah di seberang Sungai Yordan.[a] Orang banyak kembali berbondong-bondong datang kepada-Nya. Seperti biasa, Ia kembali mengajar mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani ini juga dapat dipahami sebagai “wilayah Yudea yang berada di seberang Sungai Yordan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκεῖθεν
  choice: dari sana
  rationale: Ungkapan tempat yang alami dan langsung, merujuk kepada lokasi sebelumnya.
- source_word: ἀναστὰς
  choice: beranjak
  rationale: Dalam konteks ini partisip tersebut menandai tindakan bangun untuk pergi, bukan kebangkitan dari kematian. “Beranjak” menyampaikan gerak meninggalkan tempat tanpa menimbulkan kesan teologis yang keliru.
- source_word: ἔρχεται
  choice: pergi
  rationale: Bentuk kini historis khas Markus tidak perlu ditiru dengan bentuk waktu khusus karena bahasa Indonesia tidak memiliki kala gramatikal. Dari sudut lokasi keberangkatan, “pergi” paling alami.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: wilayah Yudea
  rationale: ὅρια di sini menunjuk kawasan atau daerah, bukan semata-mata garis perbatasan.
- source_word: καὶ πέραν τοῦ Ἰορδάνου
  choice: dan ke daerah di seberang Sungai Yordan
  rationale: Menyatakan kawasan di sisi lain Sungai Yordan sambil mempertahankan unsur koordinatif καί; pengulangan “ke daerah” membuat susunan Indonesia jelas tanpa menutup ambiguitas geografisnya.
- source_word: συμπορεύονται ... ὄχλοι πρὸς αὐτόν
  choice: orang banyak ... berbondong-bondong datang kepada-Nya
  rationale: Ungkapan ini menggambarkan kumpulan orang yang bergerak bersama menuju Yesus. “Berbondong-bondong datang” menyampaikan gerak kolektif secara alami.
- source_word: πάλιν
  choice: kembali
  rationale: Kedua kemunculannya dipertahankan untuk mencerminkan gaya pengulangan Markus dan tindakan yang terjadi lagi.
- source_word: ὡς εἰώθει
  choice: seperti biasa
  rationale: Padanan Indonesia yang ringkas dan alami untuk tindakan yang menjadi kebiasaan-Nya.
- source_word: ἐδίδασκεν αὐτούς
  choice: Ia ... mengajar mereka
  rationale: Bentuk imperfek menyatakan kegiatan mengajar yang berlangsung atau berulang; bersama “seperti biasa” nuansa kebiasaan sudah tersampaikan.
theological_decisions:
- issue: Bentuk kini historis ἔρχεται dan συμπορεύονται
  choice: Diterjemahkan dengan narasi Indonesia tanpa penandaan kala khusus
  alternative: Menambahkan “sekarang” atau memakai susunan yang meniru bentuk kini Yunani
  rationale: Bahasa Indonesia tidak menggramatikalkan kala seperti bahasa Yunani. Peniruan secara mekanis akan terdengar tidak alami dan dapat memberi makna waktu yang tidak dimaksudkan.
- issue: Hubungan geografis καὶ πέραν τοῦ Ἰορδάνου
  choice: “wilayah Yudea dan ke daerah di seberang Sungai Yordan”
  alternative: “wilayah Yudea yang berada di seberang Sungai Yordan”
  rationale: Susunan Yunani dapat dipahami sebagai dua keterangan wilayah atau sebagai satu wilayah Yudea yang diterangkan lebih lanjut. Teks utama mempertahankan koordinasi, sedangkan catatan kaki menyatakan kemungkinan lainnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia. Kalimat Yunani yang panjang dibagi menjadi tiga kalimat agar mudah dipahami tanpa menghilangkan urutan gagasan.
