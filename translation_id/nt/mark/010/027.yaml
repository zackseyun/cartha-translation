  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἐμβλέψας αὐτοῖς ὁ Ἰησοῦς λέγει· Παρὰ ἀνθρώποις ἀδύνατον ἀλλ’ οὐ παρὰ θεῷ, πάντα γὰρ ⸀δυνατὰ παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/027.yaml
  text: Jesus looked at them and said, “With men it is impossible, but not with God, because all things are possible with God.”
translation:
  language: id
  text: Yesus memandang mereka dan berkata, “Bagi manusia hal itu mustahil, tetapi tidak bagi Allah, sebab segala sesuatu mungkin bagi Allah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας αὐτοῖς
  choice: memandang mereka
  rationale: Mengungkapkan tatapan langsung dan penuh perhatian secara alami dalam bahasa Indonesia tanpa menambahkan nuansa yang tidak dinyatakan.
- source_word: Παρὰ ἀνθρώποις
  choice: Bagi manusia
  rationale: Padanan Indonesia yang wajar untuk menyatakan apa yang mustahil dari sisi atau kemampuan manusia.
- source_word: ἀδύνατον
  choice: mustahil
  rationale: Mempertahankan penegasan kuat teks sumber bahwa hal tersebut tidak mungkin bagi manusia.
- source_word: ἀλλ’ οὐ παρὰ θεῷ
  choice: tetapi tidak bagi Allah
  rationale: Mempertahankan bentuk kontras eliptis dari bahasa Yunani tanpa menjabarkannya secara berlebihan.
- source_word: πάντα γὰρ δυνατὰ παρὰ τῷ θεῷ
  choice: sebab segala sesuatu mungkin bagi Allah
  rationale: γάρ diterjemahkan sebagai alasan bagi pernyataan sebelumnya; πάντα tetap luas sebagai 'segala sesuatu', dan konstruksi παρά diterjemahkan konsisten sebagai 'bagi Allah'.
theological_decisions:
- issue: Cakupan 'segala sesuatu'
  choice: Mempertahankan ungkapan luas 'segala sesuatu'
  alternative: Membatasi menjadi 'semua hal ini' atau 'segala sesuatu yang Allah kehendaki'
  rationale: Teks Yunani sendiri memakai πάντα tanpa pembatas eksplisit; konteks memberi arah penerapan, tetapi terjemahan tidak boleh menyisipkan batas teologis yang tidak dinyatakan.
- issue: Kontras kemampuan manusia dan Allah
  choice: Mempertahankan 'mustahil ... tetapi tidak bagi Allah'
  alternative: Menjelaskan menjadi 'manusia tidak dapat melakukannya, tetapi Allah dapat'
  rationale: Pilihan ini menjaga ketegangan dan struktur retoris asli serta tidak mempersempit pokok yang dimaksud.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan kontras tegas teks sumber dan cocok dibaca dalam konteks naratif Markus.
