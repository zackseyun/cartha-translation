  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐμπαίξουσιν αὐτῷ καὶ ⸂ἐμπτύσουσιν αὐτῷ καὶ μαστιγώσουσιν αὐτὸν⸃ καὶ ⸀ἀποκτενοῦσιν, καὶ ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/034.yaml
  text: And they will mock him[a], and spit on him, and flog him, and kill him, and after three days he will rise.
translation:
  language: id
  text: Mereka akan mengolok-olok Dia, meludahi-Nya, mencambuk-Nya, dan membunuh-Nya. Setelah tiga hari[a], Dia akan bangkit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam tiga hari.” Teks Yunani Markus berbunyi “setelah tiga hari”, sedangkan bagian-bagian lain menyatakan waktunya sebagai “pada hari ketiga”.
    reason: Menjelaskan kemungkinan ungkapan waktu lain sekaligus mempertahankan rumusan Yunani Markus dalam teks utama.
lexical_decisions:
- source_word: ἐμπαίξουσιν
  choice: akan mengolok-olok
  rationale: Kata kerja ini menyatakan ejekan yang menghina. “Mengolok-olok” alami dalam bahasa Indonesia modern dan mempertahankan nada permusuhannya.
- source_word: ἐμπτύσουσιν αὐτῷ
  choice: akan meludahi-Nya
  rationale: Konstruksi ini menggambarkan tindakan meludah yang diarahkan kepada-Nya sebagai penghinaan; “meludahi-Nya” merupakan ungkapan Indonesia yang ringkas dan kuat.
- source_word: μαστιγώσουσιν
  choice: akan mencambuk-Nya
  rationale: Kata ini merujuk pada pemukulan dengan cambuk, termasuk dalam konteks penghukuman. “Mencambuk” jelas dan mudah dipahami tanpa memakai istilah arkais.
- source_word: ἀποκτενοῦσιν
  choice: akan membunuh-Nya
  rationale: Kata kerja ini secara langsung berarti membunuh. Pilihan ini tidak menambahkan nuansa hukum atau penilaian moral yang tidak dinyatakan secara khusus oleh kata Yunani.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: setelah tiga hari
  rationale: μετά dengan akusatif pada dasarnya berarti “setelah”. Terjemahan langsung ini mempertahankan rumusan khas Markus dan tidak menyelaraskannya secara diam-diam dengan ungkapan “pada hari ketiga” di bagian lain.
- source_word: ἀναστήσεται
  choice: akan bangkit
  rationale: Bentuk future middle ini secara alami menyatakan tindakan intransitif, yaitu “akan bangkit”. Kata “kembali” tidak ditambahkan karena tidak tersurat dalam bahasa Yunani.
theological_decisions:
- issue: Rumusan kebangkitan
  choice: Dia akan bangkit
  alternative: Dia akan dibangkitkan; Dia akan bangkit kembali
  rationale: Bentuk ἀναστήσεται mendukung rumusan intransitif “akan bangkit”. Ini mempertahankan bentuk ayat tanpa meniadakan kesaksian Perjanjian Baru di tempat lain bahwa Bapa membangkitkan Yesus. “Kembali” dihilangkan karena tidak tersurat.
- issue: Waktu kebangkitan
  choice: setelah tiga hari
  alternative: dalam tiga hari; pada hari ketiga
  rationale: Teks Markus secara harfiah memakai “setelah tiga hari”. Rumusan ini dipertahankan meskipun bagian-bagian paralel menggunakan “pada hari ketiga”, sehingga ketegangan ungkapan antarteks tidak diselesaikan melalui harmonisasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Deretan tindakan dibuat alami dengan koma dan satu penghubung terakhir, sementara urutan serta kekerasan progresif teks Yunani tetap dipertahankan. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital mengikuti konvensi umum penerbitan Alkitab bahasa Indonesia.
