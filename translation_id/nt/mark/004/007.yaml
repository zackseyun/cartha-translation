  text: καὶ ἄλλο ἔπεσεν εἰς τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ συνέπνιξαν αὐτό, καὶ καρπὸν οὐκ ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/007.yaml
  text: And other seed fell among the thorns[a], and the thorns came up and choked it[b], and it yielded no fruit.
translation:
  language: id
  text: Benih yang lain jatuh di antara semak-semak berduri, lalu semak-semak berduri itu tumbuh dan menghimpitnya sehingga tidak menghasilkan buah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλο
  choice: benih yang lain
  rationale: Bentuk netral tunggal ini secara eliptis menunjuk pada benih dalam konteks perumpamaan. Kata “benih” ditambahkan demi kejelasan tanpa menambah gagasan baru.
- source_word: ἔπεσεν
  choice: jatuh
  rationale: Menerjemahkan verba πίπτω secara langsung dan tidak menggantinya dengan tafsiran kontekstual seperti “ditaburkan”.
- source_word: εἰς τὰς ἀκάνθας
  choice: di antara semak-semak berduri
  rationale: εἰς secara harfiah dapat berarti “ke dalam,” tetapi dalam gambaran pertanian ini ungkapan Indonesia yang wajar ialah “di antara,” yakni pada lahan yang ditumbuhi semak berduri.
- source_word: ἀνέβησαν
  choice: tumbuh
  rationale: Dalam konteks tumbuhan, ἀναβαίνω menggambarkan semak berduri yang naik atau bertumbuh. “Tumbuh” paling alami dalam bahasa Indonesia modern.
- source_word: συνέπνιξαν
  choice: menghimpitnya
  rationale: Verba ini menggambarkan tumbuhan lain yang menyesakkan atau mendesak tanaman hingga pertumbuhannya terhambat. “Menghimpit” mempertahankan gambaran kuat sekaligus terdengar alami.
- source_word: καρπὸν οὐκ ἔδωκεν
  choice: tidak menghasilkan buah
  rationale: Secara harfiah berarti “tidak memberikan buah”; “tidak menghasilkan buah” merupakan ungkapan pertanian Indonesia yang alami dan tepat.
theological_decisions: []
