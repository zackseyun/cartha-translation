  source_fidelity: 'Teks utama dengan tepat menyampaikan urutan dan hubungan sebab-akibat: tanaman/crop mencapai kesiapan untuk dipanen, lalu ia segera bertindak dengan sabit karena panen telah tiba. “Siap dipanen” merupakan pengungkapan kontekstual yang baik untuk παραδοῖ, meski tidak menampilkan secara langsung keaktifan ungkapan Yunani yang tidak lazim; catatan kaki memang diperlukan untuk itu. “Mengayunkan sabit” adalah idiom Indonesia yang wajar untuk tindakan mulai menuai, walaupun Yunani secara harfiah berbunyi ‘mengirim sabit.’'
  naturalness: Bahasa teks utama baku, modern, dan lancar. “Musim panen sudah tiba” dapat dipahami, tetapi “masa panen sudah tiba” lebih langsung bagi θερισμός sebagai panen/reaping yang kini hadir. Subjek tersirat Yunani dapat dinyatakan dengan “ia” dalam bahasa Indonesia tanpa menambahkan identitas baru.
  terminology: '“Tanaman” cocok dalam konteks pertanian bagi καρπός tanpa mempersempitnya menjadi jenis hasil tertentu. Catatan kaki perlu diperbaiki: “menghasilkan buah” bukan alternatif yang cukup dekat untuk παραδοῖ dalam konstruksi ini; “memberikan hasil” lebih baik menyampaikan ‘yields/gives itself up.’ “Sudah matang” lebih idiomatis daripada “sudah masak” untuk hasil tanaman.'
  issues:
