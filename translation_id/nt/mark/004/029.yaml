  text: ὅταν δὲ ⸀παραδοῖ ὁ καρπός, ⸀εὐθὺς ἀποστέλλει τὸ δρέπανον, ὅτι παρέστηκεν ὁ θερισμός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/029.yaml
  text: But when the crop is ready[a], he immediately sends in the sickle, because the harvest has come.
translation:
  language: id
  text: Namun, ketika tanaman itu siap dipanen[a], ia segera mengayunkan sabit, karena masa panen sudah tiba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “memberikan hasil” atau “sudah matang”; secara lebih harfiah, “menyerahkan dirinya”. Dalam bahasa Yunani dipakai ungkapan aktif yang tidak lazim, dengan tanaman sebagai subjek.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Namun, ketika
  rationale: ὅταν memperkenalkan keadaan waktu yang tidak tertentu, sedangkan δέ menandai peralihan ringan; ungkapan ini alami dalam bahasa Indonesia dan tetap menunjukkan gerak wacana.
- source_word: παραδοῖ ὁ καρπός
  choice: tanaman itu siap dipanen
  rationale: Secara tidak lazim, παραδοῖ memakai tanaman sebagai subjek yang secara harfiah 'menyerahkan' atau 'memberikan' dirinya. Dalam konteks pertanian, maksudnya tanaman telah memungkinkan panen; terjemahan ini menyampaikan makna kontekstual, sedangkan catatan kaki mempertahankan keunikan ungkapan Yunani.
- source_word: εὐθὺς
  choice: segera
  rationale: Menjaga tekanan khas Markus pada tindakan yang langsung dilakukan.
- source_word: ἀποστέλλει τὸ δρέπανον
  choice: mengayunkan sabit
  rationale: Secara harfiah frasa ini berarti 'mengirimkan sabit', sebuah ungkapan untuk mulai menuai. 'Mengayunkan sabit' merupakan ungkapan Indonesia yang jelas dan tetap mempertahankan gambaran konkret sabit.
- source_word: ὅτι παρέστηκεν ὁ θερισμός
  choice: karena musim panen sudah tiba
  rationale: ὅτι memberikan alasan, sedangkan bentuk perfektum παρέστηκεν menunjukkan bahwa panen telah datang dan kini sudah hadir. 'Musim panen' terdengar alami serta membedakannya dari tanaman yang dipanen.
theological_decisions:
- issue: Kesiapan tanaman sebagai metafora dalam perumpamaan Kerajaan Allah
  choice: Mempertahankan gambaran pertanian tanpa menentukan siapa atau apa yang dilambangkan oleh panen.
  alternative: Menafsirkan panen secara eksplisit sebagai penghakiman terakhir, misi, atau penggenapan Kerajaan Allah.
  rationale: Teks hanya menggambarkan tanaman yang siap dan dimulainya panen. Terjemahan tidak boleh memasukkan satu penafsiran teologis tertentu ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Tanaman' dipilih untuk καρπός dalam konteks ladang, sementara 'siap dipanen' menyampaikan makna idiomatis tanpa membebani teks utama dengan ungkapan harfiah yang janggal.
