id: MRK.4.41
reference: Mark 4:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐφοβήθησαν φόβον μέγαν, καὶ ἔλεγον πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ ὁ ἄνεμος καὶ ἡ θάλασσα ⸀ὑπακούει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/041.yaml
  text: And they feared a great fear[a], and they said to one another, “Who then is this, that even the wind and the sea obey him?”
translation:
  language: id
  text: Mereka pun menjadi sangat takut[a] dan berkata satu sama lain, “Kalau begitu, siapakah Dia ini, sampai-sampai angin dan danau pun taat kepada-Nya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “takut dengan ketakutan yang besar.” Bahasa Yunani memakai ungkapan yang diperkuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: menjadi sangat takut
  rationale: Konstruksi verba dengan objek serumpun menguatkan rasa takut. Ungkapan ini mempertahankan intensitasnya dalam bahasa Indonesia yang alami; bentuk harfiah ‘takut dengan ketakutan yang besar’ terasa kaku.
- source_word: ἔλεγον
  choice: berkata
  rationale: Bentuk imperfek dapat menunjukkan tindakan yang berlangsung atau berulang, tetapi dalam narasi Indonesia bentuk sederhana ‘berkata’ paling alami dan tidak meniadakan kemungkinan nuansa tersebut.
- source_word: πρὸς ἀλλήλους
  choice: satu sama lain
  rationale: Menyampaikan dengan langsung bahwa perkataan itu saling ditujukan di antara para murid.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Kalau begitu, siapakah Dia ini
  rationale: ‘Kalau begitu’ mempertahankan nuansa kesimpulan sekaligus keheranan pada ἄρα setelah angin ribut diredakan.
- source_word: ὅτι
  choice: sampai-sampai
  rationale: Dalam pertanyaan ini, penghubung tersebut memperkenalkan kenyataan menakjubkan yang mendasari pertanyaan para murid. ‘Sampai-sampai’ terdengar alami dan menonjolkan akibat atau bukti yang membuat mereka heran.
- source_word: καὶ ὁ ἄνεμος καὶ ἡ θάλασσα
  choice: angin dan danau pun
  rationale: Partikel ‘pun’ menangkap fungsi penegasan καί (‘bahkan’), sementara ‘dan’ menghubungkan kedua subjek. Dalam konteks geografis Injil Markus, θάλασσα menunjuk Danau Galilea; ‘danau’ alami dan akurat bagi pembaca Indonesia.
- source_word: ὑπακούει αὐτῷ
  choice: taat kepada-Nya
  rationale: ὑπακούω berarti menaati atau mengindahkan. ‘Taat kepada-Nya’ mempertahankan personifikasi angin dan danau serta kuatnya kewibawaan Yesus.
theological_decisions:
- issue: Penggambaran kewibawaan Yesus atas ciptaan
  choice: Mempertahankan pertanyaan para murid dan pernyataan bahwa angin serta danau taat kepada Yesus tanpa menambahkan kesimpulan doktrinal eksplisit.
  alternative: Memperluas pertanyaan dengan keterangan yang secara langsung menyatakan identitas ilahi Yesus.
  rationale: Ayat ini menyiratkan kewibawaan yang luar biasa melalui keheranan para murid, tetapi tetap berbentuk pertanyaan. Terjemahan perlu mempertahankan bobot dan ketegangan itu tanpa menjawab pertanyaan di dalam teks.
- issue: Rujukan pronomina kepada Yesus
  choice: Menggunakan ‘Dia’ dan ‘-Nya’ dengan huruf kapital.
  alternative: Menggunakan ‘dia’ dan ‘-nya’ dengan huruf kecil.
  rationale: Kapitalisasi mengikuti kebiasaan umum Alkitab bahasa Indonesia untuk pronomina yang merujuk kepada Yesus; hal ini merupakan konvensi penghormatan dan tidak menambahkan isi pada pernyataan Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Menjadi sangat takut’ mudah dipahami dan tetap menyampaikan intensitas ungkapan Yunani. ‘Danau’ dipilih untuk θάλασσα sesuai rujukan setempat, sedangkan ‘sampai-sampai’ mengalir alami dalam pertanyaan penuh keheranan.
