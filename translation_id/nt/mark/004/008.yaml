  text: And other seed fell into the good soil[a], and it was producing fruit, growing up and increasing, and bearing thirtyfold and sixtyfold and a hundredfold.
translation:
  language: id
  text: Benih-benih lainnya jatuh ke tanah yang baik[a] dan menghasilkan buah, bertumbuh dan makin besar, serta memberikan hasil tiga puluh kali lipat, enam puluh kali lipat, dan seratus kali lipat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yang lainnya jatuh ke tanah yang baik,” dengan kata “benih” dipahami dari konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: Benih-benih lainnya
  rationale: Adjektiva netral jamak ini dipakai secara substantival dan mengacu pada benih dalam konteks perumpamaan. Kata 'benih-benih' ditambahkan agar rujukannya jelas dan jumlah jamaknya tetap tampak.
- source_word: γῆν τὴν καλήν
  choice: tanah yang baik
  rationale: Dalam konteks pertanian, γῆ menunjuk pada tanah tempat menabur. Ungkapan ini alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: ἐδίδου καρπὸν
  choice: menghasilkan buah
  rationale: Bentuk imperfek menggambarkan proses yang berlangsung. 'Menghasilkan buah' menyampaikan gambaran pertanian dengan wajar.
- source_word: ἀναβαίνοντα
  choice: tanamannya tumbuh makin tinggi
  rationale: Partisipel ini menggambarkan pertumbuhan tanaman ke atas. Subjek 'tanamannya' dinyatakan untuk menjernihkan peralihan dari benih kepada pertumbuhan yang muncul darinya.
- source_word: αὐξανόμενα
  choice: makin besar
  rationale: Pilihan ini mempertahankan nuansa pertambahan yang berbeda dari pertumbuhan ke atas pada ἀναβαίνοντα, tanpa mengulang kata yang sama.
- source_word: ἔφερεν
  choice: memberikan hasil
  rationale: Dalam konteks panen, verba ini menunjuk pada hasil yang diberikan tanaman. Bentuk imperfek dipadukan dengan rangkaian proses yang berkelanjutan.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: tiga puluh kali lipat, enam puluh kali lipat, dan seratus kali lipat
  rationale: Bilangan-bilangan ini menyatakan perbandingan hasil panen. 'Kali lipat' merupakan padanan Indonesia yang jelas dan alami.
