  text: ὃς γὰρ ⸀ἔχει, δοθήσεται αὐτῷ· καὶ ὃς οὐκ ἔχει, καὶ ⸀ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/025.yaml
  text: For whoever has[a], more will be given to him; and whoever does not have, even what he has will be taken away from him.
translation:
  language: id
  text: Sebab siapa yang mempunyai akan diberikan kepadanya; dan siapa yang tidak mempunyai, bahkan apa yang dipunyainya akan diambil darinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς
  choice: siapa yang
  rationale: Pronomina relatif tak tentu ini bersifat umum dan seperti peribahasa; “siapa yang” alami dalam bahasa Indonesia serta tidak membatasi rujukannya.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini memberi alasan atau penjelasan bagi perkataan sebelumnya; “Sebab” mempertahankan hubungan logis tersebut.
- source_word: ἔχει
  choice: mempunyai
  rationale: Verba ini menyatakan kepemilikan secara sederhana. “Mempunyai” jelas, wajar, dan tetap membiarkan objeknya tidak disebutkan seperti dalam bahasa Yunani.
- source_word: δοθήσεται αὐτῷ
  choice: kepadanya akan diberikan
  rationale: Bahasa Yunani tidak menyebutkan objek pemberian. Susunan ini dapat dipahami dalam bahasa Indonesia tanpa menambahkan “lebih banyak”, sehingga ketaktertentuan teks sumber dipertahankan.
- source_word: καὶ
  choice: dan
  rationale: Menghubungkan kedua bagian peribahasa yang berlawanan secara langsung.
- source_word: οὐκ ἔχει
  choice: tidak mempunyai
  rationale: Padanan modern dan lugas untuk bentuk kepemilikan yang dinegasikan.
- source_word: ὃ ἔχει
  choice: apa yang dipunyainya
  rationale: Pronomina relatif netral menunjuk pada apa pun yang dimiliki tanpa menentukan bendanya; pilihan ini menjaga rujukan luas tersebut sekaligus menghindari pengulangan yang kaku.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: akan diambil darinya
  rationale: Bentuk pasif mendatang dengan ἀπό menyatakan pengambilan atau penyingkiran dari seseorang; “diambil darinya” ringkas dan alami.
theological_decisions:
- issue: Objek yang tidak dinyatakan pada δοθήσεται
  choice: Tidak menambahkan “lebih banyak”; menerjemahkan “kepadanya akan diberikan”.
  alternative: Menambahkan “lebih banyak” berdasarkan kontras peribahasa.
  rationale: Walaupun gagasan pertambahan dapat tersirat oleh konteks dan kontras, bahasa Yunani tidak menyatakan objek. Bahasa Indonesia masih memungkinkan konstruksi tanpa objek eksplisit, sehingga ambiguitas asli dapat dipertahankan tanpa membuat kalimat tidak wajar.
- issue: Rujukan umum dalam bentuk tunggal
  choice: Menggunakan “siapa yang ... kepadanya/darinya”.
  alternative: Menggunakan bentuk jamak “mereka yang ... kepada mereka/dari mereka”.
  rationale: Bentuk tunggal generik bahasa Yunani dipertahankan secara alami. Bahasa Indonesia tidak perlu menandai gender, sehingga daya berlaku umum tetap jelas tanpa menambahkan pembedaan gender.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur antitetis serta nada peribahasa dipertahankan. Tidak diperlukan catatan kaki karena objek yang tidak disebutkan dalam teks Yunani dapat tetap tidak disebutkan secara wajar dalam bahasa Indonesia.
