source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ σπείρειν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ἦλθεν τὰ πετεινὰ καὶ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/004.yaml
  text: And as he was sowing[a], some seed fell along the path, and the birds came and devoured it.
translation:
  language: id
  text: Ketika ia sedang menabur, sebagian benih jatuh di sepanjang jalan setapak[a]. Burung-burung datang dan melahapnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di tepi jalan.” Frasa Yunani ini berarti di sisi atau sepanjang jalan setapak.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ σπείρειν
  choice: Ketika ia sedang menabur
  rationale: Konstruksi naratif ini menyatakan kejadian yang berlangsung pada waktu penaburan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan aspek temporalnya tanpa terjemahan kaku seperti “terjadilah pada waktu ia menabur”.
- source_word: ὃ μὲν
  choice: sebagian benih
  rationale: Bentuk relatif netral dengan μέν menunjuk secara distributif kepada sebagian dari benih yang ditaburkan. Bahasa Indonesia memerlukan penyebutan nomina agar rujukannya jelas.
- source_word: ἔπεσεν
  choice: jatuh
  rationale: Padanan langsung dan wajar bagi πίπτω dalam konteks benih yang ditaburkan.
- source_word: παρὰ τὴν ὁδόν
  choice: di sepanjang jalan setapak
  rationale: παρά dengan akusatif di sini menggambarkan lokasi di sisi atau sepanjang jalur. “Jalan setapak” cocok dengan latar ladang, sementara catatan kaki mempertahankan kemungkinan ungkapan “di tepi jalan”.
- source_word: τὰ πετεινὰ
  choice: burung-burung
  rationale: πετεινά menunjuk kepada burung; teks Yunani ayat ini tidak menambahkan keterangan seperti “di udara” atau “di langit”.
- source_word: κατέφαγεν
  choice: melahapnya
  rationale: Kata majemuk κατεσθίω lebih kuat daripada sekadar “makan”; “melahap” mempertahankan gagasan memakan habis dengan cepat.
- source_word: αὐτό
  choice: -nya
  rationale: Pronomina tunggal itu merujuk secara kolektif kepada bagian benih tersebut; akhiran “-nya” merupakan bentuk yang alami dalam bahasa Indonesia.
