translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Ia” dipertahankan karena ayat ini tidak menyebut nama penabur, dan “jalan setapak” dipilih untuk menjaga gambaran lingkungan pertanian.
