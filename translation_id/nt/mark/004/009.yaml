  text: Dan Ia berkata, “Siapa yang mempunyai telinga untuk mendengar, hendaklah ia mendengar.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Dalam alur narasi bahasa Indonesia, “Lalu” menghubungkan ucapan ini dengan perumpamaan sebelumnya secara alami tanpa memberi penekanan tambahan.
- source_word: ἔλεγεν
  choice: Dia berkata
  rationale: Bentuk imperfek Yunani dapat menggambarkan tindakan berkata dalam jalannya narasi; bahasa Indonesia tidak wajib menandai aspek ini secara eksplisit, dan “Dia berkata” paling alami dalam konteks ini.
- source_word: Ὃς ἔχει
  choice: Siapa yang mempunyai
  rationale: Konstruksi relatif ini bersifat umum. “Siapa yang mempunyai” mempertahankan bentuk tunggal dan cakupan generiknya tanpa membatasi pada laki-laki.
- source_word: ὦτα
  choice: telinga
  rationale: Terjemahan langsung dari bentuk jamak Yunani; dalam bahasa Indonesia, nomina tanpa penanda jamak dapat memiliki makna jamak dan lebih wajar dalam ungkapan ini.
- source_word: ἀκούειν
  choice: untuk mendengar
  rationale: Infinitif melengkapi kata “telinga” dan mempertahankan pengulangan akar kata dengan perintah berikutnya.
- source_word: ἀκουέτω
  choice: hendaklah dia mendengar
  rationale: “Hendaklah” menyampaikan imperatif orang ketiga secara tepat dan bermartabat; “dia” mempertahankan struktur tunggal yang mengacu secara generik kepada siapa pun.
theological_decisions:
- issue: Ungkapan maskulin generik dalam pepatah
  choice: Siapa yang ... hendaklah dia ...
  alternative: Orang yang ... hendaklah ia ...
  rationale: Bahasa Indonesia memungkinkan rujukan tunggal yang tidak menandai gender. Pilihan ini mempertahankan cakupan umum serta struktur tunggal sumber tanpa mengesankan bahwa hanya laki-laki yang dimaksud.
- issue: Makna ἀκούω dalam seruan penutup
  choice: mendengar
  alternative: menyimak atau memperhatikan
  rationale: “Mendengar” mempertahankan metafora telinga dan pengulangan leksikal Yunani. Nuansa memahami atau menaati tetap tersirat dan tidak dimasukkan secara interpretatif ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kata ganti “Dia” merujuk kepada Yesus dan ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab Indonesia. Tanda seru mencerminkan daya seruan imperatif tanpa mengubah isinya.
