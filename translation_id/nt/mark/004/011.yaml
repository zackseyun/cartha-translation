  text: καὶ ἔλεγεν αὐτοῖς· Ὑμῖν ⸂τὸ μυστήριον δέδοται⸃ τῆς βασιλείας τοῦ θεοῦ· ἐκείνοις δὲ τοῖς ἔξω ἐν παραβολαῖς τὰ πάντα γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/011.yaml
  text: And he was saying to them, “To you the mystery of the kingdom of God has been given, but to those outside everything comes in parables,”
translation:
  language: id
  text: Ia berkata kepada mereka, “Kepada kalian telah diberikan rahasia Kerajaan Allah, tetapi bagi mereka yang di luar, segala sesuatu disampaikan dalam perumpamaan,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μυστήριον
  choice: rahasia
  rationale: Dalam konteks ini, μυστήριον adalah kebenaran atau rencana ilahi yang dahulu tersembunyi dan kini dinyatakan, bukan sesuatu yang mustahil dipahami; ‘rahasia’ adalah padanan Indonesia yang alami dan tetap mempertahankan nuansa tersebut.
- source_word: δέδοται
  choice: telah diberikan
  rationale: Bentuk perfektum pasif menunjukkan pemberian yang sudah terjadi dengan hasil yang tetap berlaku; bentuk pasif juga dipertahankan tanpa menyebut pelaku secara eksplisit.
- source_word: τῆς βασιλείας τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ungkapan baku dan jelas untuk pemerintahan atau kekuasaan Allah; kapitalisasi menandai istilah teologis yang merujuk pada kerajaan-Nya.
- source_word: τοῖς ἔξω
  choice: mereka yang di luar
  rationale: Mempertahankan metafora batas kelompok dalam teks sumber tanpa mempersempitnya menjadi kategori tertentu.
- source_word: ἐν παραβολαῖς
  choice: dalam perumpamaan
  rationale: Padanan lazim bagi bentuk pengajaran figuratif παραβολή dan mempertahankan konstruksi preposisional sumber.
- source_word: τὰ πάντα γίνεται
  choice: segala sesuatu disampaikan
  rationale: γίνεται secara harfiah berarti ‘terjadi/menjadi’, tetapi dalam konteks komunikasi melalui perumpamaan, ‘disampaikan’ menghasilkan bahasa Indonesia yang alami sambil mempertahankan gagasan bahwa semuanya datang kepada pihak luar dalam bentuk perumpamaan.
theological_decisions:
- issue: Sumber dan sifat pemberian rahasia Kerajaan Allah
  choice: Mempertahankan bentuk pasif ‘telah diberikan’
  alternative: ‘Allah telah memberikan kepadamu’
  rationale: Teks Yunani tidak menyebut pelaku secara eksplisit. Bentuk pasif mempertahankan kemungkinan pasif ilahi tanpa menambahkan subjek yang tidak tertulis.
- issue: Identitas ‘mereka yang di luar’
  choice: Tidak dijelaskan lebih lanjut dalam teks utama
  alternative: ‘orang-orang di luar kelompok pengikut’
  rationale: Ungkapan sumber sengaja ringkas dan bergantung pada konteks; penjelasan tambahan akan mempersempit ambiguitasnya.
- issue: Cakupan ‘segala sesuatu’
  choice: Dipertahankan sebagai ‘segala sesuatu’
  alternative: ‘semua ajaran’
  rationale: Teks memakai τὰ πάντα secara luas. Membatasinya pada ‘ajaran’ merupakan interpretasi yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Ia berkata’ lebih alami daripada meniru aspek imperfektif secara kaku dengan ‘Ia sedang berkata’. Struktur kontras ‘kepadamu ... tetapi bagi mereka’ dipertahankan. Tidak ada catatan kaki karena tidak diperlukan untuk memahami ayat ini.
