  text: καὶ ⸀ἐκεῖνοί εἰσιν οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες, οἵτινες ἀκούουσιν τὸν λόγον καὶ παραδέχονται καὶ καρποφοροῦσιν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/020.yaml
  text: 'And those are the ones sown on the good soil: they hear the word and receive it and bear fruit—thirtyfold and sixtyfold and a hundredfold[a].'
translation:
  language: id
  text: 'Dan mereka itulah yang ditaburkan di tanah yang baik: mereka mendengar firman itu, menerimanya[a], dan menghasilkan buah—tiga puluh kali lipat, enam puluh kali lipat, dan seratus kali lipat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyambutnya” atau “menerimanya dengan baik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοί
  choice: mereka itulah
  rationale: Kata tunjuk ini merujuk kembali kepada kelompok terakhir dalam penjelasan perumpamaan dan sekaligus membedakannya dari kelompok-kelompok sebelumnya.
- source_word: οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες
  choice: yang ditaburkan di tanah yang baik
  rationale: Mempertahankan bentuk pasif dan gambaran benih yang ditaburkan, dengan ungkapan Indonesia yang alami.
- source_word: γῆν τὴν καλὴν
  choice: tanah yang baik
  rationale: Dalam konteks pertanian, γῆ menunjuk pada tanah tempat benih tumbuh; 'tanah yang baik' jelas dan lazim dalam bahasa Indonesia.
- source_word: ἀκούουσιν τὸν λόγον
  choice: mendengar firman itu
  rationale: '''Firman'' mempertahankan istilah yang berulang dalam Markus 4 dan nuansa pemberitaan ilahi, sedangkan ''itu'' menunjukkan bahwa firman yang dimaksud telah disebut sebelumnya.'
- source_word: παραδέχονται
  choice: menerimanya
  rationale: Kata ini menyatakan sambutan atau penerimaan yang positif. Akhiran '-nya' merujuk secara wajar kepada firman itu tanpa menambah tafsiran.
- source_word: καρποφοροῦσιν
  choice: menghasilkan buah
  rationale: Mempertahankan metafora pertanian dan implikasi rohaninya tanpa merinci bentuk buah tersebut.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: ada yang tiga puluh kali lipat, ada yang enam puluh kali lipat, dan ada yang seratus kali lipat
  rationale: Mengungkapkan hasil panen secara jelas dalam bahasa Indonesia serta mencerminkan tiga tingkat hasil yang disebut dalam teks Yunani.
theological_decisions:
- issue: Sifat tanggapan terhadap firman pada tanah yang baik
  choice: Ayat ini menggambarkan orang yang sungguh mendengar dan menerima firman sehingga menghasilkan buah.
  alternative: Menafsirkan tanah yang baik secara khusus sebagai jaminan ketekunan sampai akhir, atau hanya sebagai tanggapan awal.
  rationale: Teks menyatakan urutan mendengar, menerima, dan menghasilkan buah, tetapi tidak merumuskan kesimpulan doktrinal lebih jauh mengenai ketekunan atau kemurtadan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur tetap dekat dengan gambaran perumpamaan, sementara pengulangan 'ada yang' membuat angka hasil panen jelas dan alami bagi pembaca umum.
