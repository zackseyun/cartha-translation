  source_fidelity: 'Draf secara umum setia pada teks Yunani: mempertahankan kelompok yang “ditaburkan” di tanah baik, urutan mendengar–menerima–menghasilkan buah, serta tiga ukuran hasil. Namun, “lalu” dapat memberi nuansa urutan waktu yang lebih tegas daripada καί, dan pengulangan “ada yang” menambahkan pembagian eksplisit antarkelompok hasil yang tidak dinyatakan secara langsung dalam teks.'
