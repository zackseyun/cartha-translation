  terminology: “Firman” sesuai dengan pemakaian istilah yang berulang dalam Markus 4 dan pantas untuk register Alkitab bahasa Indonesia. “Menerimanya” adalah padanan yang baik untuk παραδέχονται; catatan kaki secara tepat menyediakan alternatif “menyambutnya.” “Menghasilkan buah” mempertahankan metafora καρποφοροῦσιν tanpa penafsiran tambahan.
