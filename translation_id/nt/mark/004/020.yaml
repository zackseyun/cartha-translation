  - severity: low
    issue: Pengulangan “ada yang” pada ukuran hasil
    rationale: Ungkapan ini idiomatis, tetapi menyatakan distribusi “sebagian ... sebagian ...” secara eksplisit. Bentuk langsung “tiga puluh kali lipat, enam puluh kali lipat, dan seratus kali lipat” cukup alami dan lebih dekat dengan deretan Yunani maupun jejak audit Inggris.
