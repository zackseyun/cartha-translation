source:
  edition: SBLGNT
  text: ⸂Καὶ ὅτε⸃ ἐγένετο κατὰ μόνας, ⸀ἠρώτων αὐτὸν οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα ⸂τὰς παραβολάς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/010.yaml
  text: And when he was alone[a], those around him with the Twelve were asking him about the parables.
translation:
  language: id
  text: Ketika Yesus berada di tempat tersendiri, orang-orang di sekitar-Nya[a], bersama kedua belas murid, bertanya kepada-Nya tentang perumpamaan-perumpamaan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang menyertai-Nya”; ungkapan ini menunjuk kepada lingkaran para pengikut Yesus dan tidak harus terbatas pada kedua belas murid.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: Ketika
  rationale: Καί meneruskan alur narasi, tetapi dalam bahasa Indonesia modern hubungan itu sudah wajar tersirat melalui “ketika”; menambahkan “dan” akan terasa lebih kaku.
- source_word: ἐγένετο κατὰ μόνας
  choice: Yesus berada di tempat tersendiri
  rationale: Ungkapan ini menunjukkan keadaan menyendiri atau berada dalam suasana privat. “Di tempat tersendiri” mempertahankan nuansa privat tanpa memberi kesan mutlak bahwa tidak seorang pun kemudian berada bersama-Nya.
- source_word: ἠρώτων
  choice: bertanya
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung atau berulang. Bahasa Indonesia tidak wajib menandai aspek tersebut secara verbal; “bertanya” tetap alami dan tidak melebihkan makna menjadi “terus-menerus bertanya”.
- source_word: οἱ περὶ αὐτὸν
  choice: orang-orang di sekitar-Nya
  rationale: Pilihan ini dekat dengan bentuk Yunani dan tetap memungkinkan makna lingkaran para pengikut yang menyertai Yesus, bukan sekadar kedekatan ruang.
- source_word: σὺν τοῖς δώδεκα
  choice: bersama kedua belas murid
  rationale: σύν menyatakan kebersamaan. “Kedua belas murid” jelas bagi pembaca Indonesia, sementara susunan kalimat tetap membedakan mereka dari kelompok yang lebih luas di sekitar Yesus.
- source_word: τὰς παραβολάς
  choice: perumpamaan-perumpamaan itu
  rationale: Bentuk jamak dalam teks Yunani dipertahankan. Kata penunjuk “itu” merujuk secara alami pada pengajaran dalam bentuk perumpamaan yang baru disampaikan.
theological_decisions:
- issue: Identitas kelompok yang bertanya
  choice: Kelompok yang lebih luas di sekitar Yesus, bersama kedua belas murid, bertanya kepada-Nya.
  alternative: Hanya kedua belas murid yang bertanya; atau suatu kelompok inti yang terpisah dari kedua belas murid.
  rationale: Susunan οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα paling wajar menunjukkan orang-orang di sekitar Yesus bersama kedua belas murid. Terjemahan tidak melebur kedua kelompok itu menjadi satu kelompok yang hanya terdiri atas kedua belas murid.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama “Yesus” dipakai untuk memperjelas subjek tersirat, dan “kedua belas murid” dipilih agar sebutan kelompok tersebut langsung dipahami pembaca umum.
