  text: καὶ ⸀ἄλλοι εἰσὶν οἱ εἰς τὰς ἀκάνθας σπειρόμενοι· ⸂οὗτοί εἰσιν⸃ οἱ τὸν λόγον ⸀ἀκούσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/018.yaml
  text: And others are those sown among the thorns[a]; these are the ones who have heard the word[b],
translation:
  language: id
  text: Yang lain adalah mereka yang ditaburkan di antara semak berduri[a]; merekalah orang-orang yang telah mendengar firman[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke tengah semak berduri.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pesan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι
  choice: yang lain
  rationale: Adjektiva ini dipakai secara substantival dan membedakan kelompok ini dari kelompok-kelompok sebelumnya; “yang lain” alami dalam bahasa Indonesia.
- source_word: εἰς τὰς ἀκάνθας
  choice: di antara semak berduri
  rationale: Walaupun εἰς secara harfiah dapat berarti “ke dalam”, konteks pertanian menunjuk pada benih yang ditaburkan di kawasan yang ditumbuhi semak berduri. Alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ἀκάνθας
  choice: semak berduri
  rationale: Pilihan ini konkret dan alami, serta menggambarkan tumbuhan berduri yang menghimpit tanaman dalam perumpamaan.
- source_word: σπειρόμενοι
  choice: ditaburkan
  rationale: Partisipel pasif ini mempertahankan metafora orang sebagai benih, tanpa menguraikannya menjadi parafrasa.
- source_word: οὗτοί εἰσιν
  choice: merekalah
  rationale: Bentuk penegasan ini secara alami meneruskan rumusan identifikasi dalam penjelasan perumpamaan.
- source_word: οἱ ... ἀκούσαντες
  choice: orang-orang yang telah mendengar
  rationale: Partisipel aoris menunjukkan tindakan mendengar yang mendahului kejadian berikutnya; “telah mendengar” menyampaikan urutan itu secara wajar.
- source_word: τὸν λόγον
  choice: firman
  rationale: Dalam konteks perumpamaan Markus, λόγος adalah firman atau pesan yang diberitakan. “Firman” mempertahankan gema religius istilah itu, sedangkan “pesan” tetap merupakan alternatif yang sah.
theological_decisions:
- issue: Identifikasi metaforis manusia dengan benih dalam penjelasan perumpamaan
  choice: 'Mempertahankan metafora secara langsung: “mereka yang ditaburkan di antara semak berduri”'
  alternative: “mereka yang ditanam di tanah bersemak duri” atau parafrasa yang menjelaskan mereka sebagai orang yang menerima firman
  rationale: Teks Yunani secara eksplisit meneruskan metafora penaburan. Mempertahankannya menjaga susunan sastra dan ketegangan perumpamaan tanpa menambahkan penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur metaforis sumber dipertahankan, dengan pilihan idiomatis “di antara” dalam teks utama dan alternatif yang lebih formal-harfiah pada catatan kaki.
