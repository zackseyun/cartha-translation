  yaml_path: translation/nt/mark/004/016.yaml
  text: 'And these are likewise the ones sown on the rocky ground: when they hear the word[a], they immediately receive it with joy,'
translation:
  language: id
  text: 'Demikian pula, inilah orang-orang yang ditaburkan di tanah berbatu[a]: ketika mereka mendengar firman itu, mereka segera menerimanya dengan sukacita,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tempat-tempat berbatu.”
    reason: alternatif_leksikal
lexical_decisions:
- source_word: ὁμοίως
  choice: Demikian juga
  rationale: Menjaga hubungan analogis dengan penjelasan kelompok sebelumnya dan terdengar alami dalam bahasa Indonesia.
- source_word: ἐπὶ τὰ πετρώδη
  choice: di tanah berbatu
  rationale: Menggambarkan lokasi dengan lapisan tanah tipis di atas batu dalam citra pertanian; ungkapan ini alami dan tidak menambahkan penafsiran.
- source_word: σπειρόμενοι
  choice: yang ditaburkan
  rationale: Mempertahankan metafora pasif penaburan yang dalam penjelasan perumpamaan ini menunjuk kepada orang-orang yang dilambangkan oleh benih.
- source_word: τὸν λόγον
  choice: firman itu
  rationale: Mempertahankan istilah yang berulang dalam konteks perumpamaan dan resonansi pewartaan ilahi, sedangkan penunjuk 'itu' menandai acuannya yang sudah dikenal.
- source_word: εὐθύς
  choice: segera
  rationale: Menyampaikan kekuatan adverbia dan gaya khas Markus secara ringkas serta wajar.
- source_word: μετὰ χαρᾶς
  choice: dengan sukacita
  rationale: Mengikuti bentuk frasa sumber dan mempertahankan cara mereka menerima firman.
- source_word: λαμβάνουσιν αὐτόν
  choice: menerimanya
  rationale: Menyampaikan makna dasar menerima tanpa melebihkan gagasan menjadi iman yang pasti bertahan.
theological_decisions:
- issue: Acuan frasa οἱ ... σπειρόμενοι dalam penjelasan perumpamaan
  choice: Mempertahankan ungkapan perumpamaan 'mereka ... yang ditaburkan di tanah berbatu'.
  alternative: Menjelaskannya sebagai 'orang-orang yang hatinya seperti tanah berbatu'.
  rationale: Bahasa sumber tetap menggabungkan orang-orang yang dilambangkan dengan gambaran benih yang ditaburkan; parafrasa tentang hati akan menambahkan penafsiran yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Susunan 'mereka inilah' menandai identifikasi dengan tegas, sementara kosakata perumpamaan dan ketegangan metaforis sumber dipertahankan.
