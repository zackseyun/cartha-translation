  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ τοιαύταις παραβολαῖς πολλαῖς ἐλάλει αὐτοῖς τὸν λόγον, καθὼς ἠδύναντο ἀκούειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/033.yaml
  text: And with many such parables he was speaking the word to them[b][a], as they were able to hear it.
translation:
  language: id
  text: Dengan banyak perumpamaan semacam itu, Ia menyampaikan firman kepada mereka[a], sejauh mereka mampu mendengarnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pesan” atau “ajaran” sebagai pengganti “firman”.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebanyak yang mampu mereka dengar” atau “sesuai dengan kemampuan mereka untuk mendengar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαύταις
  choice: semacam itu
  rationale: Ungkapan ini menunjuk kembali kepada jenis perumpamaan yang baru saja diberikan dan mempertahankan nuansa perbandingan secara alami dalam bahasa Indonesia.
- source_word: παραβολαῖς
  choice: perumpamaan
  rationale: Istilah baku dan tepat untuk bentuk pengajaran Yesus yang memakai kisah atau perbandingan.
- source_word: πολλαῖς
  choice: banyak
  rationale: Padanan kuantitatif yang langsung dan alami.
- source_word: ἐλάλει
  choice: menyampaikan
  rationale: Dalam konstruksi dengan τὸν λόγον, pilihan ini lebih alami daripada 'berbicara firman' dan tetap menyatakan tindakan pengajaran tanpa mempersempitnya menjadi pemberitaan formal. Aspek imperfektif dipahami dari konteks, tanpa menambahkan 'terus' yang dapat menekankan keberulangan secara berlebihan.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Menyatakan penerima perkataan secara wajar sesuai fungsi datif sesudah λαλέω.
- source_word: τὸν λόγον
  choice: firman
  rationale: '''Firman'' mempertahankan ungkapan Yunani dan gaung khas bahasa Alkitab, sambil dalam konteks merujuk kepada isi yang disampaikan Yesus. Padanan ''pesan'' atau ''ajaran'' tetap dicatat sebagai kemungkinan.'
- source_word: καθὼς
  choice: sejauh
  rationale: Dalam konteks ini kata tersebut menyatakan ukuran atau tingkat yang sesuai dengan kemampuan para pendengar.
- source_word: ἠδύναντο
  choice: mampu
  rationale: Menyampaikan makna kemampuan yang berkelanjutan dengan ringkas dan alami.
- source_word: ἀκούειν
  choice: mendengarnya
  rationale: Mempertahankan makna dasar 'mendengar' dan tidak mengubahnya menjadi 'memahami', meskipun pemahaman mungkin tersirat dalam konteks. Akhiran '-nya' merujuk kepada firman yang disampaikan.
theological_decisions:
- issue: Makna τὸν λόγον dalam pelayanan pengajaran Yesus
  choice: firman
  alternative: pesan; ajaran
  rationale: Pilihan utama mempertahankan bentuk dan gaung istilah Yunani tanpa menjadikannya klaim doktrinal yang lebih sempit; alternatif menjelaskan fungsi istilah itu dalam konteks.
- issue: Implikasi ἀκούειν
  choice: mendengarnya
  alternative: memahaminya; menerimanya
  rationale: Teks secara eksplisit berbicara tentang kemampuan mendengar. Terjemahan tidak menyelesaikan ketegangan itu dengan menggantinya menjadi pemahaman atau penerimaan.
- issue: Hubungan καθὼς dengan kemampuan pendengar
  choice: sejauh mereka mampu
  alternative: sesuai dengan kemampuan mereka
  rationale: Pilihan utama mempertahankan gagasan derajat atau batas kemampuan tanpa menentukan apakah batas tersebut terutama bersifat intelektual, rohani, atau situasional.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' mempertahankan subjek tersirat yang dalam konteks merujuk kepada Yesus. Susunan kalimat dibuat alami tanpa menghilangkan hubungan ukuran yang dinyatakan oleh καθὼς.
