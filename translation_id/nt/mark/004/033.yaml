  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan unsur-unsur Yunani: τοιαύταις παραβολαῖς πολλαῖς sebagai “banyak perumpamaan semacam itu,” ἐλάλει sebagai tindakan penyampaian/pengajaran, τὸν λόγον sebagai “firman,” dan καθὼς ἠδύναντο ἀκούειν sebagai batas kemampuan pendengar. “Sejauh mereka mampu mendengarnya” mempertahankan ἀκούειν sebagai “mendengar,” tanpa menafsirkan lebih jauh menjadi “memahami.”'
