  text: καὶ οὐκ ἔχουσιν ῥίζαν ἐν ἑαυτοῖς ἀλλὰ πρόσκαιροί εἰσιν, εἶτα γενομένης θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον ⸀εὐθὺς σκανδαλίζονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/017.yaml
  text: and they have no root in themselves[a], but are temporary; then, when affliction or persecution arises because of the word, they immediately fall away.
translation:
  language: id
  text: dan mereka tidak mempunyai akar dalam diri mereka sendiri, tetapi hanya bertahan sebentar. Lalu, ketika kesusahan atau penganiayaan timbul karena firman itu, mereka segera gugur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tersandung” atau “dibuat tersandung.” Kata kerja Yunani ini juga dapat berarti merasa tersinggung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν
  choice: akar
  rationale: Mempertahankan metafora pertanian yang menjadi dasar perumpamaan tentang benih dan tanah, tanpa menambahkan gagasan ‘dalam’ atau ‘kuat’ yang tidak dinyatakan dalam teks Yunani.
- source_word: ἐν ἑαυτοῖς
  choice: dalam diri mereka sendiri
  rationale: Mengungkapkan makna refleksif secara jelas dan alami dalam bahasa Indonesia.
- source_word: πρόσκαιροί εἰσιν
  choice: hanya bertahan untuk sementara waktu
  rationale: Mengungkapkan bahwa keberadaan atau ketahanan mereka hanya berlangsung sejenak. Bentuk verbal ini lebih alami dalam bahasa Indonesia daripada ‘mereka bersifat sementara’ dan sesuai dengan konteks ketekunan.
- source_word: εἶτα
  choice: lalu
  rationale: Menandai perkembangan berikutnya dalam urutan perumpamaan secara ringkas dan alami.
- source_word: γενομένης θλίψεως ἢ διωγμοῦ
  choice: ketika kesusahan atau penganiayaan timbul
  rationale: Menerjemahkan konstruksi genitif absolut secara temporal. ‘Kesusahan’ menyampaikan tekanan atau penderitaan, sedangkan ‘penganiayaan’ mempertahankan arti khusus διωγμός.
- source_word: διὰ τὸν λόγον
  choice: karena firman itu
  rationale: ‘Firman’ mempertahankan pengulangan istilah λόγος dalam perumpamaan, sedangkan kata penunjuk ‘itu’ memperjelas bahwa yang dimaksud ialah firman yang telah disebutkan.
- source_word: εὐθὺς
  choice: segera
  rationale: Mempertahankan rasa mendesak yang khas dalam Injil Markus dan konsisten dengan pemakaian istilah ini di seluruh kitab.
- source_word: σκανδαλίζονται
  choice: berpaling
  rationale: Dalam konteks penerimaan firman yang tidak bertahan ketika tekanan datang, ‘berpaling’ menyampaikan tindakan meninggalkan komitmen sebelumnya tanpa menetapkan lebih jauh status keselamatan akhir mereka. Kemungkinan metaforis seperti ‘tersandung’ dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna σκανδαλίζονται dalam konteks ketekunan dan kemurtadan
  choice: mereka segera berpaling
  alternative: mereka segera tersandung; mereka dibuat tersandung; mereka menjadi murtad
  rationale: ‘Berpaling’ menyampaikan kegagalan untuk bertahan dan tindakan meninggalkan penerimaan sebelumnya, tetapi tidak memakai istilah ‘murtad’ yang dapat terdengar sebagai penetapan doktrinal yang lebih tegas. Catatan kaki mempertahankan rentang makna metaforis dan pasif dari kata Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur kalimat mempertahankan alur sebab-akibat teks Yunani, sementara ‘hanya bertahan untuk sementara waktu’ dipilih demi kealamian ungkapan.
