  text: εἴ τις ἔχει ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/023.yaml
  text: If anyone has ears to hear[a], let him hear.
translation:
  language: id
  text: Jika seseorang mempunyai telinga untuk mendengar, hendaklah ia mendengar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴ τις
  choice: Jika seseorang
  rationale: Mempertahankan bentuk bersyarat dan acuan tunggal tak tentu dalam bahasa Yunani; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: ἔχει
  choice: mempunyai
  rationale: Menyatakan kepemilikan secara lugas dan sesuai dengan idiom Indonesia 'mempunyai telinga untuk mendengar'.
- source_word: ὦτα
  choice: telinga
  rationale: Bahasa Yunani memakai bentuk jamak, tetapi dalam bahasa Indonesia nomina tanpa reduplikasi dapat bermakna umum atau jamak; 'telinga' menghasilkan ungkapan yang lebih alami tanpa mengubah makna.
- source_word: ἀκούειν
  choice: untuk mendengar
  rationale: Mempertahankan hubungan tujuan atau kemampuan serta pengulangan akar kata ἀκούω dalam ayat ini.
- source_word: ἀκουέτω
  choice: hendaklah ia mendengar
  rationale: Menyampaikan imperatif orang ketiga tunggal dengan nada yang tegas dan bermartabat, sambil mempertahankan pengulangan kata 'mendengar'.
theological_decisions:
- issue: Daya generik dari bentuk tunggal pada imperatif
  choice: hendaklah ia mendengar
  alternative: hendaklah orang itu mendengar
  rationale: Kata Yunani τις dan imperatif ἀκουέτω sama-sama berbentuk tunggal. Pronomina 'ia' mempertahankan bentuk tunggal generik tanpa menentukan jenis kelamin, sebagaimana dimungkinkan secara alami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan bentuk kondisional, acuan tunggal, serta pengulangan 'mendengar' dari teks Yunani. Tidak diperlukan catatan kaki karena bahasa Indonesia dapat memakai 'ia' secara tunggal dan netral gender.
