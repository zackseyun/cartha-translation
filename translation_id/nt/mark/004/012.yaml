id: MRK.4.12
reference: Mark 4:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα βλέποντες βλέπωσι καὶ μὴ ἴδωσιν, καὶ ἀκούοντες ἀκούωσι καὶ μὴ συνιῶσιν, μήποτε ἐπιστρέψωσιν καὶ ἀφεθῇ ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/012.yaml
  text: so that seeing they may see and not perceive[a], and hearing they may hear and not understand[c][b], lest they turn back and it be forgiven them.
translation:
  language: id
  text: supaya mereka melihat tetapi tidak menangkap[a], dan mendengar tetapi tidak mengerti[b], jangan sampai mereka berbalik[c] dan diampuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak memahami apa yang mereka lihat.”
    reason: lexical_alternative
  - marker: b
    text: Yesus menggemakan Yesaya 6:9–10 dan mempertahankan ketegangannya antara penghakiman ilahi dan kegagalan manusia untuk menanggapi.
    reason: cross_reference
  - marker: c
    text: “Berbalik” juga dapat diterjemahkan “kembali”; dalam konteks ini, kata tersebut dapat menyiratkan “bertobat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Mempertahankan daya tujuan/hasil dalam bahasa Indonesia yang alami tanpa melunakkan ketegangan kalimat Yunani.
- source_word: βλέποντες βλέπωσι
  choice: sekalipun melihat, mereka terus melihat
  rationale: Mempertahankan unsur partisip dan verba finit serta pengulangan retorisnya; 'terus' membuat bentuk berulang itu dapat dipahami secara alami dalam bahasa Indonesia.
- source_word: ἴδωσιν
  choice: menangkap
  rationale: Membedakannya dari βλέπω dan menyampaikan penglihatan yang mencapai persepsi atau pemahaman, bukan sekadar tindakan melihat.
- source_word: ἀκούοντες ἀκούωσι
  choice: sekalipun mendengar, mereka terus mendengar
  rationale: Mempertahankan pola ganda yang sejajar dengan klausa melihat dan gema gaya Semitis dari Yesaya.
- source_word: συνιῶσιν
  choice: mengerti
  rationale: Padanan modern dan jelas bagi pemahaman mental atau rohani.
- source_word: μήποτε
  choice: agar jangan sampai
  rationale: Mengungkapkan daya prospektif-negatif dengan wajar sekaligus mempertahankan hubungan tujuan yang sulit dalam teks.
- source_word: ἐπιστρέψωσιν
  choice: berbalik
  rationale: Mempertahankan citra dasar verba dan membiarkan nuansa kembali kepada Allah atau bertobat tetap terbuka.
- source_word: ἀφεθῇ αὐτοῖς
  choice: mendapat pengampunan
  rationale: Menyampaikan pasif ilahi secara idiomatis tanpa menentukan secara eksplisit siapa yang mengampuni atau apa objek yang diampuni.
theological_decisions:
- issue: Daya tujuan/hasil dalam kutipan Yesaya dan kesan bahwa perumpamaan menghalangi pertobatan
  choice: Memakai 'supaya ... agar jangan sampai' dan mempertahankan ketegangan teks.
  alternative: Mengubahnya menjadi hubungan hasil belaka, misalnya 'akibatnya ... kalau tidak, mereka mungkin berbalik'.
  rationale: ἵνα dan μήποτε tidak dilunakkan; terjemahan membiarkan ketegangan antara penghakiman ilahi dan kegagalan manusia untuk menanggapi tetap terdengar.
- issue: Makna ἐπιστρέψωσιν dalam kaitannya dengan pertobatan
  choice: berbalik
  alternative: bertobat; kembali
  rationale: Verba ini dapat menyiratkan pertobatan dalam konteks kenabian, tetapi secara leksikal lebih luas; catatan kaki mempertahankan kemungkinan itu.
- issue: Bentuk pasif ἀφεθῇ αὐτοῖς
  choice: mendapat pengampunan
  alternative: diampuni; kesalahan mereka diampuni
  rationale: Rumusan ini alami dalam bahasa Indonesia dan tidak menambahkan objek yang tidak disebutkan dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Pengulangan sumber dipertahankan, tetapi dibentuk dengan 'terus' agar pola paradoksal tetap jelas bagi pembaca umum. Semua penanda catatan kaki ditempatkan pada klausa yang diterangkannya.
