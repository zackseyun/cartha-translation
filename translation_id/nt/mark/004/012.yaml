review_pass:
  verdict: revise
  source_fidelity: Draf mempertahankan struktur tujuan yang sulit dalam ἵνα dan μήποτε serta nuansa pasif ilahi pada ἀφεθῇ αὐτοῖς. Namun, “sekalipun” menambahkan hubungan konsesif yang tidak dinyatakan oleh partisip βλέποντες/ἀκούοντες, sedangkan “terus” menambahkan gagasan keberlangsungan. Keduanya sebaiknya dihapus. Pengulangan retoris Yunani tetap dapat diwakili secara wajar melalui pasangan “melihat ... tetapi tidak menangkap” dan “mendengar ... tetapi tidak mengerti.”
  naturalness: Teks revisi memakai bahasa Indonesia baku modern dan tetap bernada khidmat. Bentuk “supaya ... jangan sampai ...” mempertahankan ketegangan sintaksis sumber tanpa pengulangan penghubung tujuan yang kurang luwes seperti “agar jangan sampai” setelah “supaya.”
  terminology: “Menangkap” membedakan ἴδωσιν dari βλέπω dengan baik dalam konteks persepsi; “mengerti” tepat untuk συνιῶσιν. “Berbalik” mempertahankan citra ἐπιστρέφω tanpa memaksakan “bertobat,” dan “diampuni” menyatakan pasif ilahi tanpa menambahkan objek yang tidak disebutkan.
  issues:
  - severity: medium
    issue: “Sekalipun” memberi makna konsesif.
    rationale: Partisip βλέποντες dan ἀκούοντες membentuk ungkapan retoris “melihat mereka melihat / mendengar mereka mendengar”; teks Yunani tidak memakai konjungsi konsesif. Makna paradoksal sebaiknya muncul dari kontras “tetapi tidak ...,” bukan dari tambahan “sekalipun.”
  - severity: low
    issue: “Terus” menambahkan aspek duratif.
    rationale: Pengulangan partisip dan verba finit menambah tekanan retoris, bukan secara khusus tindakan yang berlangsung terus-menerus.
  - severity: medium
    issue: Penanda catatan kaki c tidak melekat pada kata yang dijelaskannya.
    rationale: Catatan c membahas “berbalik,” tetapi dalam draf penandanya ditempatkan setelah “mendapat pengampunan.” Penanda dipindahkan ke “berbalik.”
  revised_text: supaya mereka melihat tetapi tidak menangkap[a], dan mendengar tetapi tidak mengerti[b], jangan sampai mereka berbalik[c] dan diampuni.
