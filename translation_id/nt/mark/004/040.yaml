lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Menghubungkan perkataan ini dengan peristiwa sebelumnya secara alami dalam narasi Indonesia.
- source_word: εἶπεν αὐτοῖς
  choice: ia berkata kepada mereka
  rationale: Terjemahan langsung dan wajar untuk verba pengantar ujaran beserta penerimanya; huruf kecil pada 'ia' mengikuti konteks ayat yang berdiri sebagai kelanjutan narasi.
- source_word: Τί
  choice: Mengapa
  rationale: Dalam konstruksi ini, τί berfungsi menanyakan alasan atau keadaan, bukan sekadar 'apa'.
- source_word: δειλοί
  choice: begitu takut
  rationale: Menyampaikan teguran kuat dalam bahasa Indonesia yang alami tanpa menjadikannya secara pasti sebagai penilaian watak; nuansa 'pengecut' dipertahankan dalam catatan kaki.
- source_word: οὔπω
  choice: masih belum
  rationale: Menjaga unsur waktu 'belum' sekaligus daya retoris pertanyaan dalam bahasa Indonesia.
- source_word: ἔχετε πίστιν
  choice: mempunyai iman
  rationale: Mereproduksi konstruksi kepemilikan secara jelas; 'iman' adalah padanan utama πίστις, sementara nuansa 'kepercayaan' dicatat sebagai alternatif kontekstual.
theological_decisions:
- issue: Makna πίστις dalam teguran Yesus di tengah badai
  choice: iman
  alternative: kepercayaan
  rationale: Kata 'iman' mempertahankan istilah teologis yang luas dan tidak menambahkan objek yang tidak dinyatakan dalam bahasa Yunani. Dalam konteks ini, πίστις juga dapat menekankan kepercayaan, sehingga kemungkinan itu dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan jamak 'kalian' memperjelas bahwa para murid disapa sebagai kelompok. Bentuk 'masih belum' secara alami mempertahankan arti οὔπω tanpa memerlukan catatan alternatif tersendiri.
