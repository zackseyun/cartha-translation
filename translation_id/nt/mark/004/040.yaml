  text: And he said to them[c][b][a], “Why are you so fearful? Do you still have no faith?”
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Mengapa kalian begitu takut?[a] Apakah kalian masih belum mempunyai iman[c]?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mengapa kalian begitu pengecut?”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Apakah kalian belum mempunyai iman?”
    reason: lexical_alternative
