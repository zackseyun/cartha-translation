id: MRK.4.1
reference: Mark 4:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ πάλιν ἤρξατο διδάσκειν παρὰ τὴν θάλασσαν. καὶ ⸀συνάγεται πρὸς αὐτὸν ὄχλος ⸀πλεῖστος, ὥστε αὐτὸν ⸂εἰς πλοῖον ἐμβάντα⸃ καθῆσθαι ἐν τῇ θαλάσσῃ, καὶ πᾶς ὁ ὄχλος πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς ⸀ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/001.yaml
  text: And again he began to teach beside the sea. And a very large crowd gathers to him, so that he got into a boat and sat on the sea, and the whole crowd was by the sea on the land.
translation:
  language: id
  text: Sekali lagi Ia mulai mengajar di tepi laut. Lalu, sangat banyak orang berkumpul kepada-Nya,[a] sehingga Ia naik ke sebuah perahu dan duduk di dalam perahu itu di atas air, sedangkan seluruh orang banyak itu berada di darat, di tepi laut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Yunani ini berbentuk kini historis, yang sering dipakai Markus untuk menghidupkan penuturan; dapat juga diterjemahkan, “sedang berkumpul kepada-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, Ia berada di atas air di dalam perahu, sedangkan orang banyak tetap berada di darat.
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: lagi
  rationale: Menandai pengulangan kegiatan mengajar Yesus dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἤρξατο διδάσκειν
  choice: mulai mengajar
  rationale: Mempertahankan makna ingresif konstruksi Yunani secara ringkas dan wajar.
- source_word: παρὰ τὴν θάλασσαν
  choice: di tepi danau
  rationale: παρά dengan akusatif menunjukkan lokasi di sisi perairan. Dalam konteks Markus yang dimaksud ialah Danau Galilea; bahasa Indonesia lazim menyebut badan air tawar ini 'danau'.
- source_word: συνάγεται πρὸς αὐτόν
  choice: berkumpul mengerumuni-Nya
  rationale: Bentuk kini historis memberi daya hidup pada narasi; gabungan ini menyampaikan baik gerak berkumpul menuju Yesus maupun keadaan orang banyak di sekitar-Nya.
- source_word: ὄχλος πλεῖστος
  choice: orang banyak yang sangat besar
  rationale: Mempertahankan daya penguat bentuk superlatif πλεῖστος tanpa melebih-lebihkan.
- source_word: ὥστε
  choice: sehingga
  rationale: Menyatakan hasil yang ditimbulkan oleh besarnya kerumunan.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: Ia naik ke sebuah perahu
  rationale: Mengungkapkan tindakan menaiki perahu secara idiomatis; meskipun berbentuk partisip dalam bahasa Yunani, tindakan itu berada di bawah konstruksi hasil yang berpusat pada καθῆσθαι.
- source_word: καθῆσθαι ἐν τῇ θαλάσσῃ
  choice: duduk di atas air
  rationale: Secara harfiah menunjuk Ia duduk 'di/dalam laut'; konteks perahu menunjukkan bahwa posisi-Nya berada di atas perairan, bukan terendam.
- source_word: πᾶς ὁ ὄχλος πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς
  choice: seluruh orang banyak itu berada di darat, di tepi danau
  rationale: Menjaga kontras spasial antara Yesus di perahu di atas air dan orang banyak di daratan dekat perairan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk kini historis dipertahankan pada 'berkumpul' karena bentuk verba Indonesia tidak menandai kala secara morfologis. Sapaan pronominal bagi Yesus memakai kapital sesuai konvensi umum penerbitan Alkitab Indonesia. 'Danau' dipilih daripada 'laut' agar alami dan tepat secara geografis bagi pembaca Indonesia, tanpa menambahkan nama Galilea yang tidak terdapat dalam ayat.
