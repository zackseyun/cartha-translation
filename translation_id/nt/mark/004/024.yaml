revisions:
- from: Ia juga berkata kepada mereka, “Perhatikanlah apa yang kamu dengar. Dengan ukuran yang kamu pakai untuk mengukur, akan diukurkan kepadamu, dan akan ditambahkan lagi kepadamu.[a]”
  to: Ia berkata kepada mereka, “Perhatikanlah apa yang kamu dengar. Dengan ukuran yang kamu pakai untuk mengukur, akan diukurkan kepadamu, dan akan ditambahkan kepadamu.[a]”
  rationale: Revisi menghapus “juga” dan “lagi” agar terjemahan tidak menambahkan nuansa yang tidak diperlukan oleh teks Yunani. Metafora ukuran, bentuk pasif, arah “kepadamu,” dan ketaktertentuan mengenai apa yang diukur atau ditambahkan tetap dipertahankan. Catatan kaki varian tekstual diganti dengan catatan penafsiran yang selaras dengan audit bahasa Inggris, sambil menandai pembacaan itu sebagai salah satu pemahaman dan bukan makna yang dipastikan oleh teks.
