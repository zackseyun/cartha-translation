  text: καὶ ἔλεγεν αὐτοῖς· Βλέπετε τί ἀκούετε. ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν καὶ προστεθήσεται ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/024.yaml
  text: And he was saying to them[a], “Pay attention to what you hear. With the measure you use, it will be measured to you[b], and more will be added to you.”
translation:
  language: id
  text: Ia berkata kepada mereka, “Perhatikanlah apa yang kamu dengar. Dengan ukuran yang kamu pakai untuk mengukur, akan diukurkan kepadamu, dan akan ditambahkan kepadamu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian memahami “akan ditambahkan kepadamu” sebagai bertambahnya pengertian bagi mereka yang menerima pengajaran Yesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ia juga berkata
  rationale: Bentuk imperfek menampilkan ucapan Yesus sebagai bagian dari rangkaian pengajaran yang sedang berlangsung. Dalam narasi Indonesia, “berkata” lebih alami daripada bentuk progresif yang kaku, sedangkan “juga” meneruskan rangkaian perkataan.
- source_word: Βλέπετε
  choice: Perhatikanlah
  rationale: Dalam konteks ini kata yang secara harfiah berkaitan dengan melihat berfungsi sebagai seruan agar pendengar mencermati dengan sungguh-sungguh.
- source_word: τί ἀκούετε
  choice: apa yang kamu dengar
  rationale: Kata τί berarti “apa”, bukan “bagaimana”. Terjemahan ini mempertahankan perbedaan redaksi Markus dari Lukas 8:18 dan tidak menyelaraskannya.
- source_word: ἐν ᾧ μέτρῳ μετρεῖτε
  choice: Dengan ukuran yang kamu pakai untuk mengukur
  rationale: Ungkapan ini mempertahankan metafora ukuran dan kegiatan mengukur, sekaligus memakai susunan yang wajar dalam bahasa Indonesia.
- source_word: μετρηθήσεται ὑμῖν
  choice: akan diukurkan kepadamu
  rationale: Bentuk pasif dan arah tindakan kepada para pendengar dipertahankan tanpa menambahkan gagasan “kembali” yang tidak dinyatakan secara eksplisit.
- source_word: προστεθήσεται ὑμῖν
  choice: akan ditambahkan lagi kepadamu
  rationale: “Ditambahkan” mengikuti makna dasar verba, sedangkan “lagi” menyatakan adanya tambahan tanpa menentukan secara eksplisit apa yang ditambahkan.
theological_decisions:
- issue: Cakupan prinsip ukuran yang timbal balik
  choice: Metafora dibiarkan terbuka dalam konteks mendengar pengajaran Yesus, tanpa menentukan secara eksplisit bahwa yang diukur atau ditambahkan adalah pengertian, penghakiman, kemurahan hati, atau pahala.
  alternative: Menjelaskannya secara khusus sebagai bertambahnya pengertian rohani bagi orang yang menerima ajaran Yesus.
  rationale: Konteks dekat memang membahas mendengar dan menerima firman, tetapi kalimat Yunani tidak menyebut objek yang diukur atau ditambahkan. Terjemahan perlu mempertahankan keluasan dan ketegangan teologis itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pengajaran yang lugas dan berwibawa. Pronomina “kamu” dipakai karena Yesus berbicara langsung kepada sekelompok pendengar; bentuk yang sama dapat berfungsi tunggal maupun jamak dalam bahasa Indonesia modern.
