base_translation:
  language: en
  yaml_path: translation/nt/mark/004/026.yaml
  text: 'And he was saying[c][b][a], “The kingdom of God is like this: as when a man casts the seed upon the ground,”'
translation:
  language: id
  text: Ia berkata, “Kerajaan Allah itu seperti ketika seseorang menaburkan benih di tanah.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Kerajaan Allah itu seumpama seseorang yang menaburkan benih di tanah.” Perbandingan dalam bahasa Yunani tersusun secara padat dan berlanjut ke ayat berikutnya.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἔλεγεν
  choice: Ia berkata lagi
  rationale: Καί menghubungkan perkataan ini dengan ajaran sebelumnya, sedangkan bentuk imperfek ἔλεγεν dapat memperkenalkan ujaran lanjutan atau berulang. Ungkapan ini alami dalam narasi Indonesia tanpa memaksakan bentuk progresif yang kaku.
- source_word: Οὕτως ἐστὶν ἡ βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah itu seperti
  rationale: Οὕτως memperkenalkan perbandingan tentang cara kerja Kerajaan Allah. 'Kerajaan Allah' mempertahankan istilah Injil yang dikenal dan tetap dapat mencakup pemerintahan maupun ranah kekuasaan Allah.
- source_word: ὡς ἄνθρωπος
  choice: ketika seseorang
  rationale: ὡς membuka perbandingan yang berlanjut ke ayat berikutnya. Dalam konteks perumpamaan, ἄνθρωπος adalah tokoh manusia representatif; 'seseorang' menyampaikan fungsi tersebut secara wajar dalam bahasa Indonesia tanpa menyimpulkan bahwa jenis kelaminnya penting bagi maksud perumpamaan.
- source_word: βάλῃ τὸν σπόρον
  choice: menaburkan benih
  rationale: Walaupun βάλλω secara dasar berarti melempar atau menaruh, dalam konteks pertanian tindakan yang dimaksud ialah menabur. 'Menaburkan benih' jelas dan idiomatis, sedangkan artikelnya dapat dipahami secara generik dalam bahasa Indonesia.
- source_word: ἐπὶ τῆς γῆς
  choice: di tanah
  rationale: Dalam gambaran pertanian ini, γῆ menunjuk pada tanah tempat benih ditaburkan, bukan bumi dalam arti kosmis.
theological_decisions:
- issue: Bentuk perbandingan yang secara sintaksis berlanjut ke ayat berikutnya
  choice: Memakai 'seperti ketika' agar perbandingan tetap terbuka menuju tindakan-tindakan dalam ayat 27
  alternative: Kerajaan Allah itu seperti seseorang yang menaburkan benih di tanah
  rationale: Susunan Οὕτως ... ὡς bersifat padat dan perbandingannya berkembang melampaui ayat ini. Terjemahan utama mempertahankan alur tersebut tanpa menambahkan penjelasan teologis.
- issue: Jenis kelamin tokoh dalam perumpamaan
  choice: seseorang
  alternative: seorang laki-laki
  rationale: ἄνθρωπος dapat menunjuk pada seorang manusia secara representatif. Konteks ini tidak menonjolkan jenis kelamin tokoh, sehingga bentuk Indonesia yang umum menghindari penekanan yang tidak dituntut teks.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. 'Ia berkata lagi' sesuai dengan alur pengajaran, sementara 'seperti ketika' mempertahankan perbandingan yang belum selesai tanpa menghasilkan susunan yang terlalu harfiah.
