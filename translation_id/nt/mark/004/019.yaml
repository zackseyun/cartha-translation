  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ αἱ μέριμναι τοῦ ⸀αἰῶνος καὶ ἡ ἀπάτη τοῦ πλούτου καὶ αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι εἰσπορευόμεναι συμπνίγουσιν τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/019.yaml
  text: and the cares of the age[a], and the deceitfulness of riches, and the desires for other things entering in choke the word[d][c][b], and it becomes unfruitful.
translation:
  language: id
  text: lalu kekhawatiran zaman ini[a], tipu daya kekayaan[b], dan keinginan akan hal-hal lain masuk dan mencekik firman itu, sehingga firman itu tidak berbuah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kekhawatiran dunia ini.” Kata Yunani yang dipakai pada dasarnya berarti “zaman”, tetapi juga dapat menunjuk pada tata dunia masa kini.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “daya tipu kekayaan.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dan ia menjadi tidak berbuah.” Rujukan terdekatnya ialah “firman itu”, tetapi dalam gambaran perumpamaan ini dapat pula dipahami sebagai benih atau tanaman, atau sebagai orang yang mendengar firman.
    reason: alternative_reading
lexical_decisions:
- source_word: μέριμναι τοῦ αἰῶνος
  choice: kekhawatiran zaman ini
  rationale: “Kekhawatiran” menyampaikan beban dan kecemasan yang terkandung dalam μέριμναι. “Zaman ini” mempertahankan nuansa temporal αἰών sekaligus menunjuk pada tata kehidupan masa kini dalam konteks perumpamaan.
- source_word: ἀπάτη τοῦ πλούτου
  choice: tipu daya kekayaan
  rationale: Ungkapan ini menggambarkan kekayaan sebagai sesuatu yang menyesatkan. “Tipu daya kekayaan” alami dalam bahasa Indonesia dan mempertahankan hubungan genitif Yunani tanpa mempersempitnya menjadi penipuan yang dilakukan manusia.
- source_word: αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι
  choice: keinginan akan hal-hal lain
  rationale: Terjemahan ini mempertahankan cakupan luas λοιπά dan menyatakan dengan jelas bahwa keinginan tersebut tertuju kepada berbagai hal lain.
- source_word: εἰσπορευόμεναι
  choice: masuk
  rationale: Partisip Yunani menggambarkan berbagai pengaruh itu datang menyusup ke dalam. Bentuk verba “masuk” menghasilkan susunan Indonesia yang alami tanpa menghilangkan geraknya.
- source_word: συμπνίγουσιν
  choice: mencekik
  rationale: “Mencekik” mempertahankan gambaran kuat tentang tanaman yang terhimpit sampai tidak dapat bertumbuh dan berbuah.
- source_word: τὸν λόγον
  choice: firman itu
  rationale: Dalam konteks perumpamaan, λόγος adalah firman atau berita yang diberitakan. “Firman” mempertahankan idiom Alkitab dan kaitannya dengan ayat-ayat sekitar.
- source_word: ἄκαρπος γίνεται
  choice: sehingga firman itu tidak berbuah
  rationale: Susunan ini menyampaikan hasil yang dinyatakan oleh γίνεται dan ἄκαρπος secara alami. Penyebutan ulang “firman itu” menjernihkan rujukan terdekat tanpa mengubah metafora buah.
theological_decisions:
- issue: Rujukan subjek tersirat dalam ἄκαρπος γίνεται
  choice: firman itu tidak berbuah
  alternative: orang yang mendengarnya menjadi tidak berbuah; benih atau tanaman itu tidak berbuah
  rationale: Anteseden tunggal eksplisit yang terdekat ialah τὸν λόγον (“firman itu”), sehingga terjemahan utama merujuk kepadanya. Namun, karena perumpamaan menautkan firman, benih, tanaman, dan pendengar, kemungkinan pemahaman lain tetap dicatat tanpa dipaksakan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Diksi “firman” menjaga kesinambungan istilah dalam perumpamaan, sedangkan “mencekik” mempertahankan kekuatan citra pertanian sumber Yunani.
