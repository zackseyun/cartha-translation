  text: ⸂καὶ ὅτε ἀνέτειλεν ὁ ἥλιος⸃ ⸀ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/006.yaml
  text: And when the sun rose[a], it was scorched, and because it had no root, it withered.
translation:
  language: id
  text: Dan ketika matahari terbit, tanaman itu terbakar oleh panas matahari dan, karena tidak berakar, menjadi kering[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi layu”. Kata kerja Yunani ini dapat berarti menjadi kering atau layu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Namun
  rationale: Dalam konteks benih yang segera tumbuh tetapi kemudian rusak, penghubung ini secara alami menyatakan peralihan yang berlawanan; 'Namun' mempertahankan alur tanpa menambah urutan waktu.
- source_word: ὅτε ἀνέτειλεν ὁ ἥλιος
  choice: ketika matahari terbit
  rationale: Padanan langsung dan alami bagi klausa waktu Yunani yang menggambarkan terbitnya matahari.
- source_word: ἐκαυματίσθη
  choice: terbakar oleh panasnya
  rationale: Kata kerja pasif ini menyatakan kerusakan akibat panas yang menyengat; frasa ini lebih jelas dalam bahasa Indonesia daripada sekadar 'terbakar', yang dapat mengesankan terkena api.
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: karena tidak berakar
  rationale: Konstruksi διά dengan infinitif berartikel menyatakan sebab. 'Tidak berakar' merupakan ungkapan Indonesia yang alami dan tetap mencerminkan bentuk tunggal kolektif ῥίζαν.
- source_word: ἐξηράνθη
  choice: menjadi kering
  rationale: ξηραίνω dapat berarti menjadi kering atau layu. 'Menjadi kering' sesuai dengan akibat panas dalam konteks ini, sementara alternatif leksikal dipertahankan dalam catatan kaki.
