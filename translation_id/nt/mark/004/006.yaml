translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Subjek tersirat dijelaskan sebagai 'tanaman itu' agar rujukannya jelas dalam ayat yang berdiri sendiri. Hubungan sebab dipertahankan, dan ambiguitas leksikal antara kering dan layu dicatat tanpa menetapkan tafsiran teologis.
