  text: ⸀αὐτομάτη ἡ γῆ καρποφορεῖ, πρῶτον χόρτον, ⸂εἶτα στάχυν, εἶτα⸃ ⸂πλήρης σῖτον⸃ ἐν τῷ στάχυϊ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/028.yaml
  text: 'The soil bears fruit by itself: first the stalk[a], then the head, then the full grain in the head.'
translation:
  language: id
  text: 'Tanah itu dengan sendirinya menghasilkan buah: mula-mula tunas, kemudian bulir, lalu biji yang penuh di dalam bulir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτομάτη
  choice: dengan sendirinya
  rationale: Ungkapan ini secara alami menyatakan bahwa tanah menghasilkan tanpa tindakan manusia yang tampak, tanpa kesan mekanis dari kata seperti 'secara otomatis'.
- source_word: ἡ γῆ
  choice: tanah itu
  rationale: Dalam konteks pertanian, γῆ menunjuk pada tanah tempat tanaman tumbuh; bentuk tertentu Yunani dipertahankan dengan 'itu'.
- source_word: καρποφορεῖ
  choice: menghasilkan panen
  rationale: Verba ini berarti menghasilkan buah atau hasil tanaman. Dalam rangkaian pertumbuhan biji-bijian, 'menghasilkan panen' jelas dan alami.
- source_word: πρῶτον χόρτον
  choice: mula-mula tunas
  rationale: χόρτος di sini adalah pertumbuhan hijau pertama tanaman biji-bijian. 'Tunas' lebih mudah dipahami dalam bahasa Indonesia modern daripada terjemahan harfiah 'rumput'.
- source_word: εἶτα στάχυν
  choice: kemudian bulir
  rationale: στάχυς menunjuk pada bulir atau malai tempat biji-biji terbentuk. 'Bulir' ringkas dan lazim dalam gambaran tanaman serealia.
- source_word: εἶτα πλήρης σῖτον ἐν τῷ στάχυϊ
  choice: lalu bulir yang penuh dengan biji-bijian
  rationale: Teks Yunani secara padat menggambarkan tahap ketika biji-bijian telah penuh di dalam bulir. Susunan Indonesia ini menyampaikan tahap tersebut secara alami tanpa menambahkan gagasan 'matang' yang tidak dinyatakan eksplisit.
