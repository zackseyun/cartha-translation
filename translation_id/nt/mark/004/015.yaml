id: MRK.4.15
reference: Mark 4:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδὸν ὅπου σπείρεται ὁ λόγος, καὶ ὅταν ἀκούσωσιν ⸀εὐθὺς ἔρχεται ὁ Σατανᾶς καὶ αἴρει τὸν λόγον τὸν ἐσπαρμένον ⸂εἰς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/015.yaml
  text: 'And these are the ones along the road where the word is sown: when they hear[a], Satan immediately comes and takes away the word that was sown in them.'
translation:
  language: id
  text: Mereka ini adalah orang-orang yang di pinggir jalan, tempat firman ditaburkan. Ketika mereka mendengarnya, segera datanglah Satan dan mengambil firman yang telah ditaburkan dalam diri mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke dalam diri mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι δέ εἰσιν
  choice: Mereka ini adalah
  rationale: Mengidentifikasi kelompok yang sedang dijelaskan; δέ berfungsi sebagai penghubung ringan dan tidak perlu diterjemahkan secara tersendiri agar bahasa Indonesia tetap alami.
- source_word: οἱ παρὰ τὴν ὁδόν
  choice: orang-orang yang di pinggir jalan
  rationale: παρά dengan akusatif menunjukkan posisi di sisi jalan; ungkapan ini tetap mempertahankan gambaran perumpamaan sekaligus menunjukkan bahwa yang dimaksud adalah manusia.
- source_word: σπείρεται ὁ λόγος
  choice: firman ditaburkan
  rationale: Bentuk pasif Yunani dipertahankan. 'Firman' menyampaikan λόγος sebagai pemberitaan ilahi dan menjaga pengulangan istilah dalam ayat.
- source_word: ὅταν ἀκούσωσιν
  choice: Ketika mereka mendengarnya
  rationale: ὅταν dengan subjungtif aoris menyatakan keadaan umum; pronomina '-nya' secara alami merujuk kepada firman.
- source_word: εὐθύς
  choice: segera
  rationale: Mempertahankan penekanan khas Markus pada tindakan yang langsung terjadi.
- source_word: ὁ Σατανᾶς
  choice: Iblis
  rationale: Padanan baku dan mudah dipahami dalam bahasa Indonesia untuk tokoh personal yang disebut Σατανᾶς.
- source_word: αἴρει
  choice: mengambil
  rationale: Mencerminkan arti luas 'mengambil/mengangkat' tanpa menambahkan nuansa kekerasan yang tidak diwajibkan oleh verba Yunani.
- source_word: τὸν λόγον τὸν ἐσπαρμένον εἰς αὐτούς
  choice: firman yang telah ditaburkan dalam diri mereka
  rationale: Partisip sempurna menunjukkan penaburan yang telah berlangsung dengan hasil yang relevan; εἰς αὐτούς dipahami secara idiomatis sebagai penerimaan batin, sambil mencatat kemungkinan terjemahan yang lebih harfiah.
theological_decisions:
- issue: Pelaku personal dalam sebutan ὁ Σατανᾶς
  choice: Iblis datang dan mengambil firman
  alternative: si lawan; kuasa jahat yang impersonal
  rationale: Teks Yunani menyebut Σατανᾶς sebagai pelaku yang datang dan bertindak. Terjemahan mempertahankan penggambaran personal itu tanpa mereduksinya menjadi abstraksi.
- issue: Arti εἰς αὐτούς dalam gambaran penaburan
  choice: dalam diri mereka
  alternative: ke dalam mereka; di antara mereka
  rationale: Konteks menjelaskan para pendengar dan penerimaan firman. 'Dalam diri mereka' alami dalam bahasa Indonesia, tetapi kemungkinan gambaran arah 'ke dalam' dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat alami tanpa menghilangkan metafora penaburan, bentuk pasif, pengulangan 'firman', atau tindakan langsung Iblis.
