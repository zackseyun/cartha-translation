base_translation:
  language: en
  yaml_path: translation/nt/mark/004/037.yaml
  text: And a great windstorm arose[a], and the waves were breaking into the boat[c][b], so that the boat was already filling.
translation:
  language: id
  text: Lalu datanglah badai angin besar[a]. Ombak terus menerjang masuk ke dalam perahu[b], sehingga perahu itu sudah mulai penuh dengan air[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “badai angin yang besar.”
    reason: lexical_alternative
  - marker: b
    text: Atau “ombak berulang kali menghantam ke dalam perahu.” Bentuk kata kerja Yunani menggambarkan tindakan yang berlangsung atau berulang.
    reason: lexical_alternative
  - marker: c
    text: Atau “sehingga perahu itu sudah mulai dipenuhi air.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεται
  choice: datanglah
  rationale: Bentuk kini historis dalam narasi Markus menyatakan munculnya badai secara tiba-tiba; “datanglah” alami dalam narasi Indonesia dan tetap mempertahankan nuansa permulaan kejadian.
- source_word: λαῖλαψ μεγάλη ἀνέμου
  choice: badai angin yang dahsyat
  rationale: λαῖλαψ menunjuk pada badai atau angin ribut yang kuat, ἀνέμου menegaskan unsur angin, dan μεγάλη menyatakan besarnya atau kedahsyatannya.
- source_word: τὰ κύματα
  choice: ombak
  rationale: “Ombak” merupakan padanan modern yang wajar untuk κύματα dalam konteks danau.
- source_word: ἐπέβαλλεν εἰς τὸ πλοῖον
  choice: terus menerjang masuk ke dalam perahu
  rationale: Bentuk imperfek menggambarkan tindakan berulang atau berkelanjutan; “menerjang masuk” menyampaikan baik benturan ombak maupun geraknya ke dalam perahu.
- source_word: τὸ πλοῖον
  choice: perahu
  rationale: “Perahu” paling sesuai bagi jenis kendaraan air di Danau Galilea dan lebih tepat daripada “kapal” yang dapat menyiratkan ukuran lebih besar.
- source_word: ὥστε
  choice: sehingga
  rationale: ὥστε memperkenalkan akibat; “sehingga” menyatakan hubungan hasil secara ringkas dan alami.
- source_word: ἤδη
  choice: sudah
  rationale: Padanan langsung yang menandai bahwa proses memenuhi perahu telah berlangsung hingga tahap yang mengkhawatirkan.
- source_word: γεμίζεσθαι τὸ πλοῖον
  choice: perahu itu sudah mulai penuh dengan air
  rationale: Bentuk infinitif kini pasif/medial menggambarkan proses perahu sedang dipenuhi. Ungkapan Indonesia ini alami, membuat penyebab pengisian tersirat menjadi jelas dari konteks, dan tidak menyatakan bahwa perahu telah sepenuhnya penuh.
