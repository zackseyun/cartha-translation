  verdict: revise
  source_fidelity: Draf dengan tepat menerjemahkan ὡς sebagai perbandingan yang merujuk pada Kerajaan Allah dari konteks sebelumnya, κόκκῳ σινάπεως sebagai “biji sesawi,” bentuk pasif ὅταν σπαρῇ, dan terutama komparatif μικρότερον sebagai “lebih kecil,” bukan superlatif. Pengulangan keterangan ἐπὶ τῆς γῆς juga dipertahankan. Namun, susunan relatif dengan sisipan koma meniru struktur Inggris/Yunani secara kaku dan kurang lancar dalam bahasa Indonesia.
  naturalness: “Hal itu seperti biji sesawi yang, ketika ditaburkan di tanah, lebih kecil ...” dapat dipahami, tetapi pemisahan anak kalimat dengan koma setelah “yang” tidak alami dalam bahasa Indonesia baku. Mengulang “biji itu” menghasilkan hubungan rujukan dan alur kalimat yang lebih jelas tanpa menambah makna. “Semua benih di tanah” juga lebih langsung daripada “segala benih yang ada di tanah.”
  terminology: “Biji sesawi” adalah istilah yang alami dan tepat. “Benih” tepat untuk σπερμάτων dalam perbandingan umum. Catatan “sebutir sesawi” kurang idiomatis karena “sesawi” sendiri biasanya menunjuk tanaman; “sebutir biji sesawi” merupakan alternatif leksikal yang jelas. Tidak diperlukan catatan khusus untuk komparatif karena teks Indonesia sudah menyatakannya secara eksplisit.
  issues:
  - severity: low
    issue: Sintaks kalimat terlalu mengikuti susunan bahasa sumber/Inggris.
    rationale: Sisipan “yang, ketika ...,” setelah nomina terdengar janggal dalam bahasa Indonesia. Penyusunan ulang dengan “ketika ... , biji itu ...” mempertahankan hubungan relatif dan partisipial sumber secara alami.
  - severity: low
    issue: Rumusan catatan kaki alternatif kurang idiomatis.
    rationale: “Sebutit sesawi” tidak sejelas alternatif yang menyebut kepala nomina “biji”; “sebutir biji sesawi” menyampaikan alternatif “a grain of mustard” dengan baik.
  revised_text: 'Hal itu seperti biji sesawi[a]: ketika ditaburkan di tanah, biji itu lebih kecil daripada semua benih di tanah—'
