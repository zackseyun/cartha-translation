  text: ὡς ⸀κόκκῳ σινάπεως, ὃς ὅταν σπαρῇ ἐπὶ τῆς γῆς, ⸂μικρότερον ὂν⸃ πάντων τῶν ⸀σπερμάτων τῶν ἐπὶ τῆς γῆς—
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/031.yaml
  text: It is like a mustard seed[a], which, when it is sown on the ground[b], being smaller than all the seeds on the ground—
translation:
  language: id
  text: 'Hal itu seperti biji sesawi[a]: ketika ditaburkan di tanah, biji itu lebih kecil daripada semua benih di tanah—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sebutir biji sesawi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Hal itu seperti
  rationale: Ungkapan ini memperkenalkan perbandingan dan secara eliptis merujuk pada Kerajaan Allah dalam pertanyaan ayat sebelumnya; 'Hal itu' melengkapi elipsis secara alami.
- source_word: κόκκῳ σινάπεως
  choice: biji sesawi
  rationale: κόκκος dapat berarti butir atau biji; 'biji sesawi' merupakan ungkapan Indonesia yang alami dan tepat bagi gambaran tanaman ini.
- source_word: ὅταν σπαρῇ
  choice: ketika ditaburkan
  rationale: Menyampaikan konstruksi waktu tak tentu dengan aoristus subjungtif dalam bentuk pasif yang alami dalam bahasa Indonesia.
- source_word: ἐπὶ τῆς γῆς
  choice: di tanah
  rationale: Dalam konteks pertanian, γῆ berarti tanah, bukan seluruh bumi; bahasa Indonesia secara idiomatis menggunakan 'di tanah' untuk penaburan.
- source_word: μικρότερον ὂν
  choice: lebih kecil
  rationale: Mempertahankan bentuk komparatif μικρότερον tanpa mengubahnya menjadi superlatif; kopula/partisipel tidak perlu dinyatakan tersendiri dalam bahasa Indonesia.
- source_word: πάντων τῶν σπερμάτων τῶν ἐπὶ τῆς γῆς
  choice: daripada segala benih yang ada di tanah
  rationale: Menyampaikan genitif perbandingan serta mempertahankan pembatas berulang 'yang ada di tanah' tanpa mempersempitnya menjadi klasifikasi botani.
theological_decisions:
- issue: Deskripsi komparatif atau superlatif tentang biji sesawi
  choice: lebih kecil daripada segala benih
  alternative: yang paling kecil dari segala benih
  rationale: Teks Yunani memakai bentuk komparatif μικρότερον, bukan bentuk superlatif yang eksplisit. Terjemahan mempertahankan bentuk itu sekaligus membiarkan keluasan perbandingan dalam perumpamaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Benih' dipakai pada perbandingan umum, sedangkan ungkapan lazim 'biji sesawi' dipakai untuk objek utama. Tanda pisah dipertahankan karena kalimat berlanjut ke ayat berikutnya.
