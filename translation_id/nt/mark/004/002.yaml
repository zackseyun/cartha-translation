  text: καὶ ἐδίδασκεν αὐτοὺς ἐν παραβολαῖς πολλά καὶ ἔλεγεν αὐτοῖς ἐν τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/002.yaml
  text: 'And he was teaching them many things in parables[a], and in his teaching he was saying to them:'
translation:
  language: id
  text: 'Dan Ia mengajar mereka banyak hal dengan perumpamaan[a]. Dalam pengajaran-Nya Ia berkata kepada mereka:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia banyak mengajar mereka dengan perumpamaan.” Kata Yunani πολλά dapat diterjemahkan “banyak hal” atau, secara lebih ringkas, “banyak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: mengajar
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung dalam adegan. Dalam bahasa Indonesia, aspek tersebut cukup alami tersirat oleh konteks naratif tanpa perlu menambahkan 'sedang'.
- source_word: ἐν παραβολαῖς
  choice: dengan perumpamaan
  rationale: Konstruksi ἐν dengan datif menyatakan sarana atau cara. 'Dengan perumpamaan' alami dalam bahasa Indonesia dan menunjukkan metode pengajaran.
- source_word: πολλά
  choice: banyak hal
  rationale: Bentuk netral jamak dapat dipahami sebagai objek pengajaran; 'banyak hal' menyampaikan keluasan isi pengajaran secara alami.
- source_word: ἔλεγεν
  choice: berkata
  rationale: Bentuk imperfek mengantar pada tuturan langsung yang berlanjut dalam ayat berikutnya. 'Berkata' merupakan pengantar ujaran yang paling alami dalam narasi Indonesia, sementara keberlangsungannya dipahami dari konteks.
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: Dalam pengajaran-Nya
  rationale: Terjemahan ini mempertahankan konstruksi Yunani dan menghubungkan perkataan berikut dengan kegiatan serta isi pengajaran Yesus.
- source_word: καὶ
  choice: Dan
  rationale: Kata sambung awal dipertahankan untuk kesinambungan naratif dan untuk mencerminkan gaya parataktis Markus.
- source_word: αὐτοὺς / αὐτοῖς
  choice: mereka / kepada mereka
  rationale: 'Pembedaan kasus Yunani dipertahankan secara alami: ''mereka'' sebagai objek mengajar dan ''kepada mereka'' sebagai penerima perkataan.'
theological_decisions: []
