  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti hormat untuk Yesus ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. Pemenggalan menjadi dua kalimat membuat pengantar tuturan langsung alami tanpa menghilangkan hubungan antarklausa Yunani.
