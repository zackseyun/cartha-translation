  text: καὶ καθεύδῃ καὶ ἐγείρηται νύκτα καὶ ἡμέραν, καὶ ὁ σπόρος ⸀βλαστᾷ καὶ μηκύνηται ὡς οὐκ οἶδεν αὐτός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/027.yaml
  text: and he sleeps and rises night and day[a], and the seed sprouts and grows[b], though he himself does not know how.
translation:
  language: id
  text: Ia tidur dan bangun malam dan siang, dan benih itu bertunas dan tumbuh tinggi[a], sedangkan ia sendiri tidak tahu bagaimana hal itu terjadi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bertunas dan tumbuh” atau “bertunas dan memanjang.” Kata kerja kedua secara khusus menyiratkan pemanjangan atau pertambahan tinggi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bagaimana ia sendiri tidak tahu”; maksudnya ialah bahwa ia sendiri tidak tahu bagaimana hal itu terjadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεύδῃ
  choice: ia tidur
  rationale: Subjungtif kini dalam rangkaian perumpamaan ini menggambarkan tindakan yang berlangsung atau berulang; bentuk kini Indonesia menyampaikannya secara wajar.
- source_word: ἐγείρηται
  choice: bangun
  rationale: Bentuk medial/pasif ini dipakai secara intransitif untuk bangun dari tidur, bukan untuk kebangkitan.
- source_word: νύκτα καὶ ἡμέραν
  choice: malam dan siang
  rationale: Ungkapan akusatif ini menggambarkan siklus waktu yang terus berjalan dan mempertahankan urutan Yunani.
- source_word: ὁ σπόρος
  choice: benih itu
  rationale: Artikel menunjuk kembali kepada benih yang ditaburkan dalam perumpamaan.
- source_word: βλαστᾷ
  choice: bertunas
  rationale: Padanan modern dan tepat untuk awal pertumbuhan tanaman.
- source_word: μηκύνηται
  choice: bertambah tinggi
  rationale: Kata ini secara khusus menyiratkan pemanjangan atau pertambahan tinggi, bukan sekadar pertumbuhan umum.
- source_word: ὡς οὐκ οἶδεν αὐτός
  choice: tanpa ia sendiri tahu bagaimana terjadinya
  rationale: Ungkapan Yunani menekankan ketidaktahuan orang itu mengenai cara pertumbuhan berlangsung; 'sendiri' mencerminkan αὐτός yang emfatis, sedangkan 'terjadinya' membuat rujukan 'bagaimana' jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Pelaku atau penyebab pertumbuhan benih dalam perumpamaan
  choice: Membiarkan cara pertumbuhan tidak dijelaskan dari sudut pandang penabur.
  alternative: Menyatakan secara eksplisit bahwa Allah menumbuhkannya, atau menggambarkannya semata-mata sebagai proses alamiah.
  rationale: Ayat ini menekankan ketidaktahuan penabur dan pertumbuhan benih tanpa menyebut pelakunya secara eksplisit; terjemahan tidak boleh menyelesaikan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Urutan “malam dan siang” dipertahankan dari teks Yunani. “Bertambah tinggi” menjaga nuansa khusus μηκύνηται tanpa terdengar terlalu teknis.
