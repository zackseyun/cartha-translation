  source_fidelity: Pembuka Yunani καί berarti “dan”; “Namun” menambahkan kontras yang tidak dinyatakan oleh teks sumber. Penekanan αὐτὸς dipertahankan oleh “Dia sendiri.” “Buritan,” “bantal,” “membangunkan,” sapaan “Guru,” dan pertanyaan tajam para murid secara akurat mencerminkan Yunani. Frasa “dengan kepala di atas bantal” menyatakan fungsi normal προσκεφάλαιον sebagai alas kepala dan menghindari kesan bahwa seluruh tubuh-Nya tidur di atas bantal.
  naturalness: “Namun” tidak wajar sebagai penghubung tanpa kontras eksplisit dan kurang setia pada καί. Selain itu, “sedang tidur di atas bantal” dapat secara harfiah terdengar seolah-olah seluruh tubuh berada di atas bantal. Revisi menghasilkan narasi Indonesia baku yang lebih lancar dan jelas.
  terminology: “Buritan” tepat untuk πρύμνῃ; “Guru” tepat untuk Διδάσκαλε; dan “peduli” mempertahankan daya teguran οὐ μέλει σοι. Kapitalisasi pronomina yang merujuk kepada Yesus konsisten dengan register Alkitab Indonesia yang digunakan draf.
