    rationale: Konjungsi καί hanya menghubungkan narasi (“Dan”) dan tidak menyatakan pertentangan. “Namun” menambahkan relasi adversatif yang tidak ada dalam sumber.
  - severity: low
    issue: “sedang tidur di atas bantal” berpotensi ambigu dalam bahasa Indonesia.
    rationale: Konstruksi ini dapat memberi kesan bahwa seluruh tubuh-Nya berada di atas bantal. Menyebut kepala secara eksplisit adalah penjelasan idiomatis yang sesuai dengan makna προσκεφάλαιον sebagai alas kepala, bukan tambahan naratif spekulatif.
