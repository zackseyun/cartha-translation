base_translation:
  language: en
  yaml_path: translation/nt/mark/004/038.yaml
  text: But he himself was in the stern[a], asleep on the cushion; and they woke him and said to him, “Teacher, do you not care that we are perishing?”
translation:
  language: id
  text: Dan Dia sendiri berada di buritan, sedang tidur dengan kepala di atas bantal.[a] Mereka membangunkan-Nya dan berkata kepada-Nya, “Guru, tidakkah Engkau peduli bahwa kita akan binasa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “alas kepala.” Istilah Yunani ini dapat merujuk pada bantal atau alas untuk kepala.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς ἦν
  choice: Dia sendiri berada
  rationale: Pronomina eksplisit αὐτός memberi penekanan dan kontras; “Dia sendiri” mempertahankan daya itu secara alami dalam bahasa Indonesia.
- source_word: πρύμνῃ
  choice: buritan
  rationale: πρύμνα menunjuk secara khusus pada bagian belakang perahu; “buritan” tepat dan lazim dalam bahasa Indonesia.
- source_word: ἐπὶ τὸ προσκεφάλαιον
  choice: di atas bantal
  rationale: προσκεφάλαιον adalah alas atau bantal untuk kepala. “Bantal” alami dalam bahasa Indonesia tanpa menambahkan bahwa kepala-Nya pasti berada di atasnya.
- source_word: καθεύδων
  choice: sedang tidur
  rationale: Partisipel ini menggambarkan keadaan tidur yang sedang berlangsung.
- source_word: ἐγείρουσιν
  choice: membangunkan
  rationale: Bentuk kini historis dialihkan menjadi bentuk naratif Indonesia; verba ini menyatakan bahwa para murid membangunkan Dia.
- source_word: λέγουσιν
  choice: berkata
  rationale: Bentuk kini historis diterjemahkan secara alami dalam alur naratif bahasa Indonesia.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Sapaan ini secara langsung berarti guru atau pengajar dan tidak perlu diberi nuansa lain.
- source_word: οὐ μέλει σοι
  choice: tidakkah Engkau peduli
  rationale: Ungkapan ini menyampaikan pertanyaan tajam tentang kepedulian dan mempertahankan nada mendesak serta menuduh.
- source_word: ἀπολλύμεθα
  choice: kita akan binasa
  rationale: Dalam konteks bahaya yang mengancam, bentuk kini ini mengungkapkan kebinasaan atau kematian yang segera terjadi. “Akan binasa” terdengar alami dan tetap kuat dalam bahasa Indonesia.
theological_decisions:
- issue: Daya naratif pertanyaan para murid kepada Yesus
  choice: 'Dipertahankan sebagai pertanyaan tajam: “tidakkah Engkau peduli bahwa kita akan binasa?”'
  alternative: “Tidakkah hal itu menjadi soal bagi-Mu bahwa kita hampir mati?”
  rationale: Bahasa Yunani bernada mendesak dan menuduh, bukan sekadar meminta informasi. Terjemahan ini mempertahankan ketegangan tersebut tanpa menjelaskan motif Yesus atau menilai iman para murid.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas penerbitan Alkitab bahasa Indonesia. “Buritan” dipertahankan karena tepat dan cukup dikenal; catatan kaki menjelaskan rentang makna benda yang dipakai sebagai alas kepala.
