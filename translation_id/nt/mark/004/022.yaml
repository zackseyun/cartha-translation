  text: οὐ γάρ ἐστιν ⸀κρυπτὸν ἐὰν μὴ ⸀ἵνα φανερωθῇ, οὐδὲ ἐγένετο ἀπόκρυφον ἀλλ’ ἵνα ⸂ἔλθῃ εἰς φανερόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/022.yaml
  text: For nothing is hidden except to be revealed[b][a], nor has anything become concealed except to come to light.
translation:
  language: id
  text: Sebab tidak ada yang tersembunyi selain untuk dinyatakan[a], dan tidak ada yang menjadi tersembunyi selain untuk tampil secara terbuka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab tidak ada yang tersembunyi kecuali agar dinyatakan … kecuali agar tampil secara terbuka.” Kedua klausa Yunani dengan ἵνα dapat dipahami bernuansa tujuan ataupun hasil.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “datang ke dalam keadaan yang tampak/terbuka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Sebab
  rationale: Menandai bahwa perkataan ini menjelaskan pernyataan sebelumnya, dengan penghubung yang wajar dalam bahasa Indonesia.
- source_word: κρυπτόν
  choice: tersembunyi
  rationale: Mempertahankan arti dasar sesuatu yang tidak tampak tanpa menyiratkan bahwa hal itu pasti sengaja dirahasiakan.
- source_word: ἐὰν μὴ ἵνα
  choice: selain untuk
  rationale: Menyampaikan konstruksi pengecualian sekaligus nuansa tujuan dari ἵνα secara ringkas dan alami.
- source_word: φανερωθῇ
  choice: dinyatakan
  rationale: Mencerminkan bentuk pasif dan mencakup gagasan membuat sesuatu tampak atau diketahui.
- source_word: ἐγένετο ἀπόκρυφον
  choice: menjadi terselubung
  rationale: Kata 'menjadi' mempertahankan gagasan masuk ke dalam suatu keadaan, sedangkan 'terselubung' membedakannya secara halus dari κρυπτόν tanpa menambahkan pelaku.
- source_word: ἔλθῃ εἰς φανερόν
  choice: tampil secara terbuka
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran peralihan menuju keadaan yang tampak atau terbuka.
theological_decisions:
- issue: Nuansa tujuan atau hasil dalam kedua klausa ἵνα
  choice: Menggunakan 'selain untuk', yang terutama menyampaikan tujuan.
  alternative: Menggunakan 'kecuali bahwa', yang lebih menonjolkan hasil.
  rationale: ἵνα lazim menyatakan tujuan, tetapi dalam bahasa Yunani Koine dapat mendekati nuansa hasil. Teks utama mempertahankan daya tujuannya, sedangkan catatan kaki mengakui kemungkinan nuansa hasil tanpa menetapkan secara berlebihan penyebab ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme kedua bagian dipertahankan; pilihan 'terselubung' menghindari pengulangan penuh sekaligus tetap dapat dipahami pembaca umum.
