id: MRK.4.21
reference: Mark 4:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν ⸀αὐτοῖς· Μήτι ⸂ἔρχεται ὁ λύχνος⸃ ἵνα ὑπὸ τὸν μόδιον τεθῇ ἢ ὑπὸ τὴν κλίνην, οὐχ ἵνα ἐπὶ τὴν λυχνίαν ⸀τεθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/021.yaml
  text: And he was saying to them[a], “A lamp does not come to be put under a basket or under a bed[b], does it? Is it not to be put on the lampstand?”
translation:
  language: id
  text: Ia juga berkata kepada mereka, “Apakah sebuah pelita datang[a] untuk ditaruh di bawah wadah takaran[b] atau di bawah tempat tidur? Bukankah pelita itu datang untuk ditaruh di atas kaki pelita?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Apakah sebuah pelita datang ...?” Bahasa Yunani memakai ungkapan personifikasi yang hidup; maksudnya dapat diungkapkan lebih biasa sebagai “Apakah sebuah pelita dibawa ...?”
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani ini menunjuk pada wadah untuk menakar bahan kering; dalam terjemahan lama kadang disebut “gantang.”
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἔλεγεν αὐτοῖς
  choice: Ia juga berkata kepada mereka
  rationale: Bentuk imperfek ἔλεγεν dapat menggambarkan kelanjutan ujaran dalam rangkaian pengajaran. Ungkapan ini alami dalam narasi Indonesia dan tidak memaksakan arti bahwa perkataan tersebut terus-menerus diulang.
- source_word: Μήτι ... οὐχ
  choice: Apakah ...? Bukankah ...?
  rationale: Pasangan pertanyaan retoris ini mempertahankan jawaban negatif yang diharapkan pada pertanyaan pertama dan jawaban positif pada pertanyaan kedua.
- source_word: ἔρχεται ὁ λύχνος
  choice: sebuah pelita datang
  rationale: Terjemahan ini mempertahankan personifikasi yang hidup dalam bahasa Yunani. Kata sandang Yunani dipahami secara generik, sehingga 'sebuah pelita' lebih alami dalam peribahasa Indonesia.
- source_word: λύχνος
  choice: pelita
  rationale: Kata ini menunjuk pada lampu minyak portabel, bukan cahaya sebagai konsep abstrak. 'Pelita' mempertahankan benda dan latar rumah tangga kuno.
- source_word: μόδιον
  choice: wadah takaran
  rationale: μόδιος adalah satuan takaran bahan kering dan juga wadah yang digunakan untuk menakar. 'Wadah takaran' menyampaikan fungsi bendanya tanpa memakai satuan lokal atau istilah kuno yang dapat menyesatkan.
- source_word: κλίνην
  choice: tempat tidur
  rationale: κλίνη dapat berarti tempat tidur atau dipan. 'Tempat tidur' paling jelas dan lazim bagi pembaca Indonesia.
- source_word: λυχνίαν
  choice: kaki pelita
  rationale: λυχνία adalah penyangga khusus tempat pelita diletakkan. 'Kaki pelita' merupakan ungkapan Indonesia yang konkret dan dapat dipahami.
- source_word: ἵνα ... τεθῇ
  choice: untuk ditaruh
  rationale: Bentuk ini menyampaikan tujuan yang diungkapkan oleh ἵνα dengan konstruksi pasif yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah personifikasi harfiah 'pelita datang' dipertahankan atau diperhalus menjadi bentuk pasif 'pelita dibawa'
  choice: Mempertahankan ungkapan aktif 'sebuah pelita datang'
  alternative: Apakah sebuah pelita dibawa untuk ditaruh ...?
  rationale: Bahasa Yunani sengaja memakai gambaran peribahasa yang hidup. Mempertahankannya menjaga daya retoris tanpa menambahkan penafsiran teologis.
- issue: Ketakrifan ὁ λύχνος dalam pernyataan yang bersifat umum
  choice: Menerjemahkan penyebutan pertama secara generik sebagai 'sebuah pelita', lalu merujuknya sebagai 'pelita itu'
  alternative: pelita itu / sang pelita
  rationale: Kata sandang Yunani tidak harus menunjuk pada satu pelita tertentu. Bentuk ini menyampaikan prinsip umum secara alami sekaligus menjaga kesinambungan rujukan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan dua pertanyaan dipertahankan agar gerak retoris teks Yunani tetap terasa, sementara istilah rumah tangga kuno dijelaskan secara ringkas dalam catatan kaki.
