  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀφέντες τὸν ὄχλον παραλαμβάνουσιν αὐτὸν ὡς ἦν ἐν τῷ πλοίῳ, καὶ ἄλλα ⸀πλοῖα ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/036.yaml
  text: And leaving the crowd[a], they take him with them just as he was, in the boat[b], and other boats were with him.
translation:
  language: id
  text: Sesudah meninggalkan orang banyak itu, mereka membawa Yesus bersama mereka sebagaimana adanya di dalam perahu[a]. Perahu-perahu lain juga menyertai-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Yunani ini dapat menekankan bahwa Yesus sudah berada di dalam perahu atau bahwa mereka membawa-Nya tanpa persiapan tambahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  choice: Sesudah meninggalkan
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. Pilihan ini alami dalam bahasa Indonesia dan tidak menyiratkan pembubaran resmi orang banyak.
- source_word: τὸν ὄχλον
  choice: orang banyak itu
  rationale: ὄχλος menunjuk kepada kerumunan yang telah disebut dalam konteks; 'orang banyak itu' merupakan ungkapan Alkitabiah yang tetap jelas dan wajar.
- source_word: παραλαμβάνουσιν αὐτόν
  choice: mereka membawa Yesus bersama mereka
  rationale: παραλαμβάνω di sini berarti membawa seseorang serta. Nama 'Yesus' dipakai untuk memperjelas acuan pronomina tanpa mengubah makna.
- source_word: ὡς ἦν ἐν τῷ πλοίῳ
  choice: sebagaimana adanya di dalam perahu
  rationale: Terjemahan ini mengikuti susunan Yunani dan mempertahankan kemungkinan bahwa frasa tersebut menekankan keadaan Yesus, kenyataan bahwa Ia sudah berada di perahu, atau keduanya.
- source_word: ἄλλα πλοῖα
  choice: Perahu-perahu lain
  rationale: Tidak ada kata sifat yang berarti 'kecil' dalam teks, sehingga tidak ditambahkan.
- source_word: ἦν μετ’ αὐτοῦ
  choice: juga menyertai-Nya
  rationale: μετά dengan konteks perjalanan dapat dinyatakan secara alami sebagai 'menyertai'; bentuk Indonesia dibuat jamak sesuai subjek 'perahu-perahu lain'.
theological_decisions:
- issue: Acuan dan cakupan frasa ὡς ἦν ἐν τῷ πλοίῳ
  choice: sebagaimana adanya di dalam perahu
  alternative: membawa-Nya di dalam perahu, tanpa persiapan lagi
  rationale: Teks Yunani dapat menonjolkan bahwa Yesus sudah berada di perahu atau bahwa Ia dibawa tanpa persiapan tambahan. Teks utama mempertahankan ketegangan sintaksis itu, sedangkan catatan kaki menjelaskannya tanpa menetapkan satu tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk kala kini naratif Yunani diterjemahkan dengan bentuk lampau kontekstual yang lebih alami dalam bahasa Indonesia. Kapitalisasi pronomina ilahi dipakai sesuai kebiasaan luas penerbitan Alkitab Indonesia.
