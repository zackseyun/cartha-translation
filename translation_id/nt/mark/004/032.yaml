  text: καὶ ὅταν σπαρῇ, ἀναβαίνει καὶ γίνεται ⸂μεῖζον πάντων τῶν λαχάνων⸃ καὶ ποιεῖ κλάδους μεγάλους, ὥστε δύνασθαι ὑπὸ τὴν σκιὰν αὐτοῦ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/032.yaml
  text: and when it is sown[a], it comes up and becomes larger than all the garden plants, and it produces large branches[b], so that the birds of the sky are able to nest under its shade.
translation:
  language: id
  text: dan ketika benih itu ditaburkan, benih itu tumbuh dan menjadi lebih besar daripada semua tanaman kebun. Tanaman itu mengeluarkan cabang-cabang besar sehingga burung-burung di langit[a] dapat bersarang[b] di bawah naungannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “burung-burung langit.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tinggal” atau “menetap.” Ungkapan ini mungkin menggemakan gambaran Perjanjian Lama tentang burung-burung yang mendapat perlindungan pada sebuah pohon besar (misalnya Yeh. 17:23; Dan. 4:12).
    reason: cross_reference
lexical_decisions:
- source_word: σπαρῇ
  choice: ditaburkan
  rationale: Bentuk aoristus pasif sesudah ὅταν menyatakan waktu yang tidak tertentu, yaitu “ketika ditaburkan.” Pilihan ini mempertahankan gambaran penaburan dan kaitannya dengan benih dalam perumpamaan.
- source_word: ἀναβαίνει
  choice: tumbuh
  rationale: Dalam konteks tanaman, kata ini menggambarkan muncul dan bertumbuhnya tanaman dari tanah. “Tumbuh” merupakan ungkapan Indonesia yang alami.
- source_word: γίνεται
  choice: menjadi
  rationale: 'Kata ini menandai keadaan yang dihasilkan dalam perkembangan tanaman: tanaman itu menjadi lebih besar.'
- source_word: μεῖζον πάντων τῶν λαχάνων
  choice: lebih besar daripada semua tanaman kebun
  rationale: λάχανα menunjuk pada tumbuhan atau tanaman yang dibudidayakan di kebun, bukan khusus sayur-mayur. Bentuk komparatif μεῖζον diterjemahkan langsung sebagai “lebih besar daripada semua.”
- source_word: ποιεῖ κλάδους μεγάλους
  choice: mengeluarkan cabang-cabang yang besar
  rationale: Dalam bahasa Indonesia, tanaman secara alami dikatakan “mengeluarkan” cabang. Bentuk jamak pada κλάδους dipertahankan.
- source_word: ὥστε δύνασθαι
  choice: sehingga ... dapat
  rationale: ὥστε dengan infinitif menyatakan hasil. “Sehingga ... dapat” menyampaikan hubungan hasil itu secara wajar.
- source_word: ὑπὸ τὴν σκιὰν αὐτοῦ
  choice: di bawah naungannya
  rationale: σκιά dapat berarti bayang-bayang atau tempat teduh. “Naungan” secara alami menyampaikan perlindungan teduh yang diberikan tanaman.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: burung-burung di langit
  rationale: Ungkapan ini dekat dengan susunan Yunani dan alami dalam bahasa Indonesia. Alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: κατασκηνοῦν
  choice: bersarang
  rationale: Kata ini dapat berarti tinggal atau menetap. Dengan subjek burung, “bersarang” menyampaikan gambaran secara alami tanpa menambahkan penafsiran teologis ke dalam teks.
theological_decisions:
- issue: Gambaran antar-teks tentang burung yang berlindung pada cabang-cabang
  choice: Gambaran dipertahankan secara langsung, dengan “bersarang” dalam teks utama dan kemungkinan arti yang lebih umum dijelaskan dalam catatan kaki.
  alternative: Menerjemahkan κατασκηνοῦν sebagai “tinggal” atau “menetap” untuk mempertahankan gema yang lebih verbal dengan gambaran pohon kerajaan dalam Perjanjian Lama.
  rationale: Bahasa ayat ini mungkin menggemakan gambaran dalam Yehezkiel 17:23 dan Daniel 4:12, tetapi teks Yunani tidak menafsirkan gambaran itu secara eksplisit. Terjemahan tidak memasukkan identifikasi teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. “Benih itu” dinyatakan untuk memperjelas subjek tersirat dalam verba Yunani. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskan; ini juga memperbaiki ketidaksesuaian posisi penanda dalam lapisan konsultasi Inggris.
