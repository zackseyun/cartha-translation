  text: χωρὶς δὲ παραβολῆς οὐκ ἐλάλει αὐτοῖς, κατ’ ἰδίαν δὲ τοῖς ⸂ἰδίοις μαθηταῖς⸃ ἐπέλυεν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/034.yaml
  text: And he was not speaking to them without a parable[b][a], but in private he was explaining everything to his own disciples.
translation:
  language: id
  text: Tanpa perumpamaan, Ia tidak berbicara kepada mereka. Namun, secara pribadi Ia menjelaskan segala sesuatu kepada murid-murid-Nya sendiri.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “sendiri” mempertahankan penekanan dalam bahasa Yunani bahwa mereka adalah murid-murid-Nya sendiri.
    reason: lexical_alternative
  - marker: b
    text: Atau “Ia menafsirkan segala sesuatu” atau “Ia menguraikan segala sesuatu.” Kata kerja Yunaninya dapat berarti menjelaskan, menafsirkan, atau menguraikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς παραβολῆς
  choice: tanpa perumpamaan
  rationale: Ungkapan ini secara langsung berarti 'tanpa perumpamaan' dan mempertahankan bentuk konkret tunggal dalam bahasa Yunani.
- source_word: οὐκ ἐλάλει αὐτοῖς
  choice: Ia tidak berbicara kepada mereka
  rationale: Bentuk imperfek menggambarkan kebiasaan atau tindakan berulang dalam ringkasan naratif; dalam bahasa Indonesia, nuansa ini cukup alami disampaikan melalui konteks tanpa konstruksi progresif yang kaku.
- source_word: κατ’ ἰδίαν
  choice: ketika sendirian bersama
  rationale: Dalam konteks ini idiom tersebut menyatakan keadaan tersendiri dari orang banyak, yaitu suasana pribadi bersama para murid, bukan bahwa Yesus benar-benar seorang diri.
- source_word: τοῖς ἰδίοις μαθηταῖς
  choice: murid-murid-Nya sendiri
  rationale: Kata 'sendiri' mempertahankan penekanan posesif ἰδίοις, yang lebih kuat daripada sekadar 'murid-murid-Nya'.
- source_word: ἐπέλυεν
  choice: Ia menjelaskan
  rationale: Kata kerja ini dapat berarti menjelaskan, menafsirkan, atau menguraikan. 'Menjelaskan' paling alami dan mudah dipahami, sedangkan konteks naratif menyampaikan sifat tindakan yang berulang.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Terjemahan ini mempertahankan cakupan luas ungkapan Yunani tanpa mempersempitnya secara eksplisit menjadi hanya semua perumpamaan.
theological_decisions:
- issue: Cakupan penjelasan pribadi Yesus
  choice: segala sesuatu
  alternative: semua perumpamaan; semua yang telah Ia katakan
  rationale: Teks Yunani hanya menyatakan πάντα, 'segala sesuatu'. Konteks dapat menunjuk pada pengajaran atau perumpamaan-Nya, tetapi terjemahan tidak mempersempit cakupannya melampaui bentuk sumber.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat mempertahankan kontras antara pengajaran kepada orang banyak melalui perumpamaan dan penjelasan pribadi kepada murid-murid. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas penerbitan Alkitab bahasa Indonesia.
