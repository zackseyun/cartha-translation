id: MRK.4.13
reference: Mark 4:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς· Οὐκ οἴδατε τὴν παραβολὴν ταύτην, καὶ πῶς πάσας τὰς παραβολὰς γνώσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/013.yaml
  text: And he says to them[a], “Do you not understand this parable? Then how will you understand all the parables?”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Kalian tidak memahami perumpamaan ini? Kalau begitu, bagaimana kalian akan memahami semua perumpamaan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Ia berkata
  rationale: Bentuk kini historis khas Markus dialihkan dengan bentuk naratif Indonesia yang wajar; bahasa Indonesia tidak menandai kala secara morfologis, dan konteks menunjukkan ujaran dalam rangkaian peristiwa lampau.
- source_word: οἴδατε
  choice: memahami
  rationale: Dalam konteks perumpamaan, verba ini menunjuk pada menangkap makna, bukan sekadar mengenal atau mengetahui keberadaannya.
- source_word: παραβολὴν
  choice: perumpamaan
  rationale: Istilah baku dan tepat dalam bahasa Indonesia untuk bentuk pengajaran ini.
- source_word: ταύτην
  choice: ini
  rationale: Demonstrativa ini menunjuk langsung kepada perumpamaan yang baru disampaikan.
- source_word: καὶ πῶς
  choice: Kalau begitu, bagaimana
  rationale: καί menghubungkan pertanyaan kedua sebagai konsekuensi retoris dari pertanyaan pertama; ungkapan ini menyampaikan hubungan tersebut secara alami.
- source_word: πάσας τὰς παραβολὰς
  choice: semua perumpamaan
  rationale: Mewakili bentuk jamak dengan πᾶς dan cakupan luas terhadap pengajaran berbentuk perumpamaan.
- source_word: γνώσεσθε
  choice: akan memahami
  rationale: Dalam konteks ini γινώσκω berarti menangkap makna perumpamaan; bentuk 'akan' mempertahankan orientasi futuranya.
theological_decisions:
- issue: Hubungan makna οἴδατε dan γνώσεσθε
  choice: Keduanya diterjemahkan dengan 'memahami'.
  alternative: Menerjemahkan salah satu atau keduanya dengan 'mengetahui'.
  rationale: Pokok ujaran ialah pemahaman akan makna perumpamaan. Pilihan yang sama pada kedua klausa mempertahankan kesejajaran dan daya retoris tanpa menambahkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Kalian' dipakai untuk menyatakan penerima jamak αὐτοῖς secara jelas; 'Ia' mempertahankan rujukan hormat kepada Yesus. Susunan pertanyaan mempertahankan nada teguran retoris.
