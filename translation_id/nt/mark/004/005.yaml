  text: And other seed fell on the rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil.
translation:
  language: id
  text: Benih lain jatuh di tanah berbatu[a], di tempat yang tanahnya tidak banyak. Benih itu segera bertunas karena tanahnya tidak dalam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tempat berbatu.” Ungkapan Yunani ini menggambarkan tempat yang lapisan tanahnya tipis di atas batu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: Benih yang lain
  rationale: Adjektiva netral tunggal ini digunakan secara substantival dan secara tersirat menunjuk pada benih dalam konteks sebelumnya; kata 'benih' ditambahkan agar elipsis Yunani jelas dalam bahasa Indonesia.
- source_word: πετρῶδες
  choice: tanah berbatu
  rationale: Menunjuk pada tempat berbatu dengan lapisan tanah yang tipis, bukan sekadar tanah yang kebetulan mengandung beberapa batu. Ungkapan ini alami dan mempertahankan gambaran pertanian.
- source_word: γῆν πολλήν
  choice: tanahnya tidak banyak
  rationale: Di sini γῆ berarti tanah tempat tumbuh. Susunan ini menyampaikan sedikitnya jumlah atau ketebalan tanah tanpa mengubahnya menjadi pernyataan eksplisit tentang kedalaman sebelum klausa berikutnya.
- source_word: εὐθὺς
  choice: segera
  rationale: Menyatakan bahwa benih itu bertunas dengan cepat; 'segera' merupakan padanan Indonesia yang langsung dan wajar.
- source_word: ἐξανέτειλεν
  choice: bertunas
  rationale: Dalam konteks pertanian, verba ini menggambarkan benih yang mulai tumbuh atau muncul. 'Bertunas' tepat dan mudah dipahami.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: karena tanahnya tidak dalam
  rationale: Konstruksi διά dengan infinitif berartikula menyatakan sebab. Klausa Indonesia ini alami serta mempertahankan gambaran lapisan tanah yang dangkal.
- source_word: ὅπου
  choice: yang
  rationale: Relasi lokatif Yunani dialihkan secara alami menjadi klausa relatif yang menerangkan 'tanah berbatu'; pengulangan 'tanah' membuat maksudnya jelas dalam bahasa Indonesia.
