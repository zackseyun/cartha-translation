id: MRK.4.39
reference: Mark 4:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ εἶπεν τῇ θαλάσσῃ· Σιώπα, πεφίμωσο. καὶ ἐκόπασεν ὁ ἄνεμος, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/039.yaml
  text: And having awakened[a], he rebuked the wind and said to the sea, “Be silent! Be still!” And the wind ceased[b], and there was a great calm.
translation:
  language: id
  text: Setelah bangun, Ia menegur angin itu dan berkata kepada laut[a], “Diam! Tenanglah!”[b] Angin itu pun reda, dan keadaan menjadi sangat tenang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah Danau Galilea; teks Yunani menyebutnya “laut.”
    reason: cultural_note
  - marker: b
    text: 'Secara lebih harfiah: “Diam! Terbungkamlah!” Kata Yunani yang kedua memakai gambaran mulut yang diberangus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεγερθεὶς
  choice: Setelah bangun
  rationale: Partisip aoristus ini menyatakan tindakan yang mendahului tindakan utama. Ungkapan ini wajar dalam bahasa Indonesia dan tidak menentukan secara berlebihan apakah Yesus bangun sendiri atau dibangunkan.
- source_word: ἐπετίμησεν
  choice: menegur
  rationale: Kata ini menyampaikan teguran atau perintah berwibawa dan mempertahankan pemakaian khas Markus terhadap kuasa yang mengancam.
- source_word: ἀνέμῳ
  choice: angin itu
  rationale: Teks Yunani secara khusus menyebut angin, bukan badai secara umum. Kata penunjuk tersirat oleh artikelnya dan merujuk pada angin yang telah disebut dalam konteks.
- source_word: θαλάσσῃ
  choice: laut
  rationale: Terjemahan ini mengikuti arti langsung θάλασσα dan mempertahankan gambaran naratif tentang kuasa atas laut, meskipun secara geografis yang dimaksud ialah Danau Galilea.
- source_word: Σιώπα
  choice: Diam!
  rationale: Imperatif ini memerintahkan agar suara atau kegaduhan segera berhenti. “Diam!” ringkas, kuat, dan alami dalam bahasa Indonesia.
- source_word: πεφίμωσο
  choice: Tenanglah!
  rationale: Secara harfiah kata ini berarti “terbungkamlah” atau “biarlah mulutmu diberangus,” tetapi dalam sapaan kepada laut maksudnya ialah agar laut berhenti bergelora. “Tenanglah!” mempertahankan daya perintah dengan bahasa Indonesia yang alami; metafora harfiahnya dicatat dalam catatan kaki.
- source_word: ἐκόπασεν
  choice: reda
  rationale: κοπάζω berarti mereda atau berhenti, khususnya tentang angin. “Reda” merupakan padanan Indonesia yang alami dalam konteks badai.
- source_word: ἐγένετο γαλήνη μεγάλη
  choice: keadaan menjadi sangat tenang
  rationale: Ungkapan ini menyampaikan hasil berupa ketenangan besar dengan susunan yang alami bagi pembaca Indonesia modern.
theological_decisions:
- issue: Apakah perintah Yesus kepada laut harus mengikuti ungkapan tradisional atau mempertahankan citra leksikal Yunani
  choice: Teks utama memakai “Diam! Tenanglah!” dan catatan kaki menjelaskan citra harfiah “terbungkamlah/diberangus.”
  alternative: “Diam! Terbungkamlah!” atau ungkapan tradisional yang memasukkan kata “damai.”
  rationale: Teks Yunani berisi dua imperatif dan tidak memakai kata benda yang berarti “damai.” Terjemahan utama dibuat alami tanpa menghilangkan citra tajam bahasa sumber, yang dipertahankan dalam catatan.
- issue: Apakah θάλασσα diterjemahkan “laut” atau disesuaikan secara geografis menjadi “danau”
  choice: laut
  alternative: danau
  rationale: “Laut” mengikuti kata Yunani dan mempertahankan cakupan gambaran naratifnya. Catatan kaki memberi penjelasan geografis agar pembaca tidak keliru.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Huruf kapital pada “Ia” mengikuti kebiasaan penulisan rujukan kepada Yesus tanpa menambahkan gelar yang tidak terdapat dalam teks. Penghubung awal καί tidak diterjemahkan dengan “dan” karena ayat ini tetap mengalir alami dari konteks melalui frasa pembuka “Setelah bangun.”
