  text: Καὶ λέγει αὐτοῖς ἐν ἐκείνῃ τῇ ἡμέρᾳ ὀψίας γενομένης· Διέλθωμεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/035.yaml
  text: And he says to them on that day[a], when evening had come, “Let us go across to the other side.”
translation:
  language: id
  text: Pada hari itu, ketika hari sudah petang, ia berkata kepada mereka, “Mari kita menyeberang ke sisi lain[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mari kita pergi ke seberang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk ini alami dalam narasi bahasa Indonesia dan tidak memaksa pembedaan kala yang tidak ditandai secara morfologis dalam bahasa Indonesia; konteks tetap menyampaikan present historis khas Markus.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: pada hari itu
  rationale: Padanan temporal yang baku dan alami untuk frasa Yunani tersebut.
- source_word: ὀψίας γενομένης
  choice: ketika hari sudah petang
  rationale: Menyampaikan fungsi temporal konstruksi genitif absolut dengan bahasa Indonesia yang wajar.
- source_word: Διέλθωμεν
  choice: Mari kita menyeberang
  rationale: Menangkap bentuk subjungtif orang pertama jamak yang bersifat ajakan serta tindakan menyeberangi danau.
- source_word: εἰς τὸ πέραν
  choice: ke sisi lain
  rationale: Menunjuk sisi seberang danau secara jelas tanpa menambahkan nama tempat yang tidak terdapat dalam ayat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kata ganti “ia” tidak diberi kapital khusus karena teks Yunani tidak menandai kapitalisasi teologis. Penanda catatan kaki ditempatkan pada ungkapan yang memiliki alternatif leksikal.
