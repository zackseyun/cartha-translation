  yaml_path: translation/nt/mark/004/003.yaml
  text: Listen! Behold[a], the sower went out to sow.
translation:
  language: id
  text: “Dengarkan! Lihatlah, seorang penabur keluar untuk menabur.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούετε
  choice: Dengarkan!
  rationale: Imperatif kini aktif orang kedua jamak yang berfungsi sebagai seruan untuk memusatkan perhatian. “Dengarkan!” alami dalam bahasa Indonesia modern dan mempertahankan daya perintahnya.
- source_word: ἰδού
  choice: Lihat,
  rationale: Partikel wacana yang menarik perhatian kepada gambaran berikutnya. “Lihat” mempertahankan fungsi penanda perhatian tanpa memakai bentuk yang terasa usang.
- source_word: ἐξῆλθεν
  choice: pergi keluar
  rationale: Aoris aktif indikatif yang menyatakan gerakan ke luar. “Pergi keluar” mempertahankan unsur arah dalam verba Yunani dan sesuai dengan sudut pandang narasi.
- source_word: ὁ σπείρων
  choice: seorang penabur
  rationale: Partisip kini berartikel yang dipakai secara substantival sebagai sebutan peran. Bahasa Indonesia secara alami memperkenalkan tokoh ini dengan “seorang penabur”.
- source_word: σπεῖραι
  choice: untuk menabur
  rationale: Infinitif aoris aktif yang menyatakan tujuan sesudah ἐξῆλθεν; “untuk menabur” menyampaikan hubungan tujuan itu secara langsung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dua seruan pembuka dipertahankan untuk mencerminkan tekanan retoris teks Yunani; pengulangan akar kata dalam “penabur ... menabur” juga dipertahankan.
