  edition: SBLGNT
  text: ὁ σπείρων τὸν λόγον σπείρει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/014.yaml
  text: The sower sows the word[a].
translation:
  language: id
  text: Penabur menaburkan firman[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pesan”. Kata Yunani λόγος dapat berarti “firman” atau “pesan”, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σπείρων
  choice: Penabur
  rationale: Partisipel kini dengan artikel ini berfungsi sebagai nomina dan menunjuk kepada orang yang bercirikan tindakan menabur. “Penabur” ringkas, alami, dan mempertahankan gambaran perumpamaan; “petani” terlalu luas dan interpretatif.
- source_word: τὸν λόγον
  choice: firman
  rationale: λόγος dapat berarti “kata”, “firman”, atau “pesan”. Dalam konteks pemberitaan ilahi, “firman” alami dalam bahasa Indonesia dan tetap tidak menambahkan keterangan seperti “Allah” atau “Injil” yang tidak terdapat dalam ayat ini. Alternatif “pesan” dicantumkan dalam catatan kaki.
- source_word: σπείρει
  choice: menaburkan
  rationale: Indikatif kini menyatakan tindakan umum dalam penjelasan perumpamaan. Bentuk kini sederhana bahasa Indonesia sesuai dengan nuansa ini, sedangkan akar yang sama dalam “Penabur” dan “menaburkan” mempertahankan pengulangan retoris bahasa Yunani.
theological_decisions:
- issue: Acuan τὸν λόγον dalam penjelasan perumpamaan
  choice: firman
  alternative: pesan; firman Allah; Injil
  rationale: Teks Yunani hanya berbunyi τὸν λόγον. “Firman” mempertahankan acuan yang umum dan tidak menambahkan “Allah” atau “Injil”, meskipun konteks yang lebih luas menunjukkan pesan ilahi yang diberitakan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pengulangan “Penabur menaburkan” sengaja dipertahankan untuk mencerminkan permainan akar kata ὁ σπείρων ... σπείρει dalam bahasa Yunani.
