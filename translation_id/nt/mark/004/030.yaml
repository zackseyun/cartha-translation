  text: Καὶ ἔλεγεν· ⸀Πῶς ὁμοιώσωμεν τὴν βασιλείαν τοῦ θεοῦ, ἢ ἐν ⸀τίνι ⸂αὐτὴν παραβολῇ θῶμεν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/030.yaml
  text: And he was saying[a], “How should we compare the kingdom of God, or in what parable should we set it forth?”
translation:
  language: id
  text: Ia berkata, “Bagaimana kita akan membandingkan Kerajaan Allah, atau dengan perumpamaan apa kita akan menggambarkannya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ia berkata
  rationale: Bentuk imperfek menampilkan tindakan berbicara dalam alur narasi; bahasa Indonesia alami umumnya memakai bentuk lampau sederhana tanpa harus menambahkan unsur keberlangsungan yang tidak diperlukan konteks.
- source_word: Πῶς ... ὁμοιώσωμεν
  choice: Dengan apakah kita akan membandingkan
  rationale: Subjungtif aoris dalam pertanyaan deliberatif diungkapkan secara alami dengan 'akan'; 'dengan apakah' menangkap cara atau sarana perbandingan dan menyatu dengan pertanyaan berikutnya.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ungkapan baku ini mempertahankan citra kerajaan sekaligus cakupan makna pemerintahan Allah.
- source_word: ἐν τίνι ... παραβολῇ
  choice: dengan perumpamaan apakah
  rationale: ἐν dengan datif dapat berfungsi instrumental di sini; 'dengan' merupakan ungkapan Indonesia yang alami untuk sarana penyajian.
- source_word: παραβολῇ
  choice: perumpamaan
  rationale: Istilah baku dan tepat dalam konteks Injil untuk παραβολή.
- source_word: αὐτὴν ... θῶμεν
  choice: kita akan menggambarkannya
  rationale: τίθημι secara harfiah berarti menaruh atau menempatkan, tetapi dalam ungkapan ini menunjuk pada penyajian Kerajaan Allah melalui perumpamaan; 'menggambarkannya' alami dan mempertahankan fungsi ilustratifnya.
theological_decisions:
- issue: Makna βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  alternative: pemerintahan Allah
  rationale: '''Kerajaan Allah'' mempertahankan metafora dan keluasan semantis istilah Yunani tanpa mempersempitnya hanya menjadi tindakan memerintah.'
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti 'Ia' merujuk kepada Yesus sesuai konteks; bentuk pertanyaan deliberatif dipertahankan dengan pemakaian 'kita' sebagaimana bentuk orang pertama jamak dalam teks Yunani.
