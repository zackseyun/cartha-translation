  text: ⸂καὶ ἔλεγεν⸃ αὐτῇ· Ἄφες πρῶτον χορτασθῆναι τὰ τέκνα, οὐ γὰρ ⸂καλόν ἐστιν⸃ λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ ⸂τοῖς κυναρίοις βαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/027.yaml
  text: And he was saying to her[a], “Let the children be fed first, for it is not good to take the children’s bread and throw it to the little dogs.”
translation:
  language: id
  text: Ia berkata kepada perempuan itu, “Biarlah anak-anak makan sampai kenyang lebih dahulu, sebab tidak baik mengambil roti anak-anak lalu melemparkannya kepada anjing-anjing kecil[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anjing-anjing rumah,” atau cukup “anjing-anjing.” Kata Yunani yang digunakan berbentuk diminutif dan dapat mengisyaratkan anjing kecil atau anjing yang dipelihara di rumah, alih-alih terutama menekankan anjing liar pemakan bangkai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: berkata
  rationale: Bentuk imperfek menggambarkan ujaran dalam alur narasi; dalam bahasa Indonesia, “berkata” paling alami tanpa harus memaksakan aspek berkelanjutan yang tidak lazim dalam konteks ini.
- source_word: Ἄφες
  choice: Biarlah
  rationale: Imperatif ini secara idiomatis berarti membiarkan atau mengizinkan sesuatu berlangsung; “Biarlah” alami dan mempertahankan daya perintahnya.
- source_word: πρῶτον
  choice: lebih dahulu
  rationale: Mempertahankan urutan atau prioritas temporal, tanpa menyiratkan bahwa pihak lain dikecualikan secara permanen.
- source_word: χορτασθῆναι
  choice: dikenyangkan
  rationale: Bentuk pasif ini berarti diberi makan sampai kenyang; pilihan ini mempertahankan gambaran jamuan dan nuansa kepuasan.
- source_word: τὰ τέκνα
  choice: anak-anak
  rationale: Padanan umum yang mempertahankan metafora keluarga tanpa menentukan usia atau jenis kelamin.
- source_word: καλόν ἐστιν
  choice: tidak baik
  rationale: Mencerminkan secara langsung penilaian καλόν sebagai baik, patut, atau layak, sambil tetap alami dalam bahasa Indonesia.
- source_word: λαβεῖν
  choice: mengambil
  rationale: Padanan langsung yang tidak menambahkan gagasan ‘merampas’ atau ‘mengambil pergi’ secara eksplisit.
- source_word: ἄρτον
  choice: roti
  rationale: Mempertahankan benda konkret dalam gambaran rumah tangga, alih-alih meratakannya menjadi ‘makanan’.
- source_word: κυναρίοις
  choice: anjing-anjing kecil
  rationale: Mempertahankan bentuk diminutif Yunani dan kemungkinan gambaran anjing kecil atau anjing rumah, tanpa menjadikannya ‘anak anjing’ secara berlebihan.
- source_word: βαλεῖν
  choice: melemparkannya kepada
  rationale: Mempertahankan gambaran nyata dari βάλλω; akhiran “-nya” secara alami merujuk kepada roti.
theological_decisions:
- issue: Daya metaforis ‘anak-anak’ dan ‘anjing-anjing kecil’
  choice: Metafora rumah tangga dipertahankan tanpa menjelaskan rujukannya dalam teks utama.
  alternative: Mengganti atau menjelaskan ‘anak-anak’ sebagai Israel/orang Yahudi dan ‘anjing-anjing kecil’ sebagai bangsa-bangsa lain.
  rationale: Teks Yunani menyampaikan rujukan tersebut melalui metafora. Mempertahankannya menghindari penambahan tafsiran ke dalam terjemahan.
- issue: Nuansa πρῶτον
  choice: Diterjemahkan “lebih dahulu”.
  alternative: Menghilangkan unsur urutan demi kelancaran.
  rationale: Unsur ini mempertahankan ketegangan naratif dan teologis berupa prioritas bagi ‘anak-anak’ tanpa memastikan penolakan permanen terhadap pihak lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. Susunan kalimat mempertahankan metafora serta urutan argumen sumber, tetapi menghindari bentuk aspek yang kaku. Penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkannya.
