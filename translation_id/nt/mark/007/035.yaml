  text: ⸀καὶ ⸀ἠνοίγησαν αὐτοῦ αἱ ἀκοαί, καὶ ἐλύθη ὁ δεσμὸς τῆς γλώσσης αὐτοῦ, καὶ ἐλάλει ὀρθῶς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/035.yaml
  text: And his ears were opened[a], and the bond of his tongue was released[c][b], and he spoke plainly.
translation:
  language: id
  text: Lalu terbukalah telinganya[a], ikatan lidahnya pun terlepas[b], dan ia berbicara dengan jelas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pendengarannya terbuka.” Kata Yunani yang dipakai dapat menunjuk pada telinga maupun kemampuan mendengar.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ikatan lidahnya terlepas”; maksudnya, penghalang yang membuatnya sulit berbicara telah disingkirkan.
    reason: lexical_alternative
  - marker: c
    text: Atau “dengan benar” atau “dengan semestinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνοίγησαν
  choice: terbukalah
  rationale: Bentuk aoristus pasif jamak dari ἀνοίγω dipertahankan dengan ungkapan pasif alami dalam bahasa Indonesia; partikel -lah juga menyampaikan terjadinya perubahan secara langsung dalam alur cerita.
- source_word: αἱ ἀκοαί
  choice: telinganya
  rationale: Bentuk jamak ini dapat menunjuk pada telinga ataupun kemampuan mendengar. Dalam konteks penyembuhan, 'telinganya' merupakan ungkapan konkret dan alami, sementara kemungkinan arti 'pendengarannya' dicatat dalam catatan kaki.
- source_word: ἐλύθη
  choice: terlepas
  rationale: Aoristus pasif dari λύω menyatakan bahwa sesuatu yang mengikat telah dilepaskan. 'Terlepas' alami dalam bahasa Indonesia dan tetap mempertahankan gambaran metaforis teks sumber.
- source_word: ὁ δεσμὸς τῆς γλώσσης αὐτοῦ
  choice: ikatan lidahnya
  rationale: δεσμός secara harfiah berarti ikatan, belenggu, atau sesuatu yang menahan. Terjemahan ini mempertahankan metafora Yunani tanpa langsung menggantinya dengan istilah klinis 'gangguan bicara'.
- source_word: ἐλάλει
  choice: ia berbicara
  rationale: Imperfek λαλέω dapat menggambarkan tindakan yang berlangsung, tetapi dalam urutan naratif ini bentuk sederhana 'ia berbicara' paling alami dan tidak menambahkan makna bahwa ia baru mulai berbicara.
- source_word: ὀρθῶς
  choice: dengan jelas
  rationale: Dalam konteks pemulihan kemampuan bicara, ὀρθῶς menunjuk pada berbicara dengan semestinya dan dapat dipahami. 'Dengan jelas' menghindari kesan bahwa yang dimaksud terutama ialah ketepatan moral atau tata bahasa.
theological_decisions:
- issue: Apakah gambaran penyembuhan kemampuan bicara diterjemahkan secara harfiah atau dijelaskan secara interpretatif
  choice: Mempertahankan metafora 'ikatan lidahnya ... terlepas' dalam teks utama
  alternative: Gangguan bicaranya pun hilang; lidahnya pun dibebaskan
  rationale: Teks Yunani menggambarkan penyembuhan ajaib dengan metafora konkret, bukan istilah klinis. Mempertahankan metafora itu menjaga bentuk dan ketegangan ungkapan sumber tanpa mengaburkan hasil penyembuhannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan tiga klausa dipertahankan untuk mencerminkan ritme Yunani. Partikel 'pun' memperjelas perkembangan berturut-turut tanpa menambahkan penafsiran teologis.
