  text: ἀκυροῦντες τὸν λόγον τοῦ θεοῦ τῇ παραδόσει ὑμῶν ᾗ παρεδώκατε· καὶ παρόμοια τοιαῦτα πολλὰ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/013.yaml
  text: thus nullifying the word of God by your tradition that you have handed down[c][b][a]. And you do many other similar things.
translation:
  language: id
  text: Dengan demikian, kalian membatalkan[a] firman Allah melalui tradisi kalian yang kalian teruskan.[b] Dan kalian melakukan banyak hal lain yang serupa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “meniadakan” atau “membuat firman Allah tidak berlaku.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “yang kalian wariskan.”'
    reason: lexical_alternative
  - marker: c
    text: 'Secara lebih harfiah: “banyak hal serupa seperti ini.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ἀκυροῦντες
  choice: membatalkan
  rationale: Partisip ini meneruskan tuduhan Yesus dan menyatakan tindakan membuat firman Allah kehilangan daya atau keabsahannya. 'Membatalkan' alami dalam bahasa Indonesia dan tetap mempertahankan ketegasan makna.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: firman Allah
  rationale: '''Firman Allah'' merupakan padanan Indonesia yang langsung, wajar, dan bermartabat bagi frasa ini serta mempertahankan kontrasnya dengan ''tradisi kalian''.'
- source_word: τῇ παραδόσει ὑμῶν
  choice: melalui tradisi
  rationale: 'Datif ini dipahami secara instrumental: tradisi mereka menjadi sarana untuk membatalkan firman Allah. Kepemilikan ''kalian'' dinyatakan secara alami dalam klausa relatif berikutnya tanpa pengulangan yang kaku.'
- source_word: ᾗ παρεδώκατε
  choice: yang kalian teruskan
  rationale: Kata kerja ini berhubungan secara semantis dengan 'tradisi' dan menunjuk pada sesuatu yang diteruskan kepada orang lain. 'Teruskan' idiomatis dan tidak menentukan apakah mereka mula-mula menciptakannya.
- source_word: παρόμοια τοιαῦτα πολλὰ
  choice: banyak hal lain yang serupa
  rationale: Ungkapan ini mempertahankan unsur jumlah, kemiripan, dan tambahan contoh, tetapi menghindari redundansi Yunani yang akan terasa janggal bila disalin secara harfiah ke bahasa Indonesia.
- source_word: ποιεῖτε
  choice: kalian melakukan
  rationale: Bentuk kini menyatakan kebiasaan atau tindakan yang berulang. Bentuk kini sederhana dalam bahasa Indonesia menyampaikan hal itu secara alami.
theological_decisions:
- issue: Sifat tradisi dalam tuduhan Yesus
  choice: Diterjemahkan secara netral sebagai 'tradisi' dan konteks dibiarkan menunjukkan bahwa tradisi khusus ini bertentangan dengan firman Allah.
  alternative: Menambahkan 'tradisi manusia'.
  rationale: Teks Yunani pada ayat ini tidak memuat kata 'manusia'. Penambahan itu akan memperjelas implikasi konteks, tetapi melampaui bunyi ayat.
- issue: Daya firman Allah yang 'dibatalkan'
  choice: '''Membatalkan'' dipakai untuk tindakan mereka terhadap kewibawaan atau keberlakuan firman dalam praktik.'
  alternative: '''Meniadakan'' atau ''membuat tidak berlaku''.'
  rationale: Terjemahan ini mempertahankan kerasnya tuduhan tanpa menyimpulkan secara teologis bahwa firman Allah pada dirinya sendiri kehilangan kuasa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian', sesuai sasaran langsung Yesus kepada sekelompok lawan bicara. Susunan dibuat alami dan tegas. Semua penanda catatan kaki ditempatkan pada bagian teks yang dijelaskannya.
