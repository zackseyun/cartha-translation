id: MRK.7.3
reference: Mark 7:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ γὰρ Φαρισαῖοι καὶ πάντες οἱ Ἰουδαῖοι ἐὰν μὴ πυγμῇ νίψωνται τὰς χεῖρας οὐκ ἐσθίουσιν, κρατοῦντες τὴν παράδοσιν τῶν πρεσβυτέρων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/003.yaml
  text: For the Pharisees and all the Jews do not eat unless they wash their hands with a fist[a], holding to the tradition of the elders.
translation:
  language: id
  text: Sebab orang-orang Farisi dan semua orang Yahudi tidak makan sebelum mencuci tangan menurut tata cara tertentu,[a] sambil berpegang teguh pada tradisi para tua-tua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan kepalan tangan”; mungkin berarti “sampai pergelangan tangan” atau “secara menyeluruh.” Istilah Yunani ini sulit dipastikan dan tampaknya menunjuk pada tata cara tertentu dalam pencucian tangan menurut kebiasaan ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai penjelasan tambahan mengenai pertanyaan pada ayat sebelumnya; bentuk ini mempertahankan hubungan kausal-eksplanatoris.
- source_word: Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Sebutan baku dan mudah dipahami bagi kelompok Yahudi tersebut.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: semua orang Yahudi
  rationale: Mempertahankan cakupan luas ungkapan Yunani tanpa mempersempitnya menjadi penduduk Yudea; dalam konteks ini merupakan generalisasi retoris.
- source_word: ἐὰν μὴ
  choice: sebelum
  rationale: Dalam kalimat kebiasaan negatif ini, 'tidak ... sebelum' mengungkapkan syarat secara alami dalam bahasa Indonesia, setara dengan 'kecuali jika'.
- source_word: πυγμῇ
  choice: menurut tata cara tertentu
  rationale: Istilah ini sangat sulit dan tampaknya menunjuk pada cara atau jangkauan pencucian tangan menurut kebiasaan ritual. Pilihan ini tidak memaksakan salah satu rekonstruksi yang diperdebatkan; alternatif dijelaskan dalam catatan kaki.
- source_word: νίψωνται τὰς χεῖρας
  choice: mencuci tangan
  rationale: Padanan Indonesia yang alami untuk mencuci bagian tubuh, di sini tangan.
- source_word: οὐκ ἐσθίουσιν
  choice: tidak makan
  rationale: Mempertahankan tindakan kebiasaan dalam kala kini tanpa menambahkan objek yang tidak disebutkan.
- source_word: κρατοῦντες
  choice: karena mereka berpegang pada
  rationale: Mengungkapkan kepatuhan yang teguh sekaligus hubungan penjelas partisipel dengan tindakan utama.
- source_word: παράδοσιν τῶν πρεσβυτέρων
  choice: tradisi para tua-tua
  rationale: Mempertahankan gagasan ajaran atau kebiasaan yang diwariskan dan keterkaitannya dengan para pemimpin generasi terdahulu.
theological_decisions:
- issue: Cakupan πάντες οἱ Ἰουδαῖοι
  choice: semua orang Yahudi
  alternative: semua orang Yudea; banyak orang Yahudi
  rationale: Teks Yunani secara eksplisit memakai 'semua'. Ungkapan luas itu dipertahankan sebagai generalisasi penjelas Markus, tanpa mengubahnya menjadi klaim statistik mengenai setiap individu.
- issue: Makna πυγμῇ
  choice: menurut tata cara tertentu
  alternative: dengan kepalan tangan; sampai pergelangan tangan; dengan saksama; secara menyeluruh
  rationale: Makna tepat kata ini diperdebatkan dan mungkin menunjuk pada cara atau batas pencucian ritual. Teks utama menyampaikan adanya tata cara khusus tanpa menyelesaikan ketidakpastian secara sepihak, sedangkan kemungkinan konkretnya dicatat dalam catatan kaki.
- issue: Sifat tradisi yang dimaksud
  choice: tradisi para tua-tua
  alternative: tradisi yang diwariskan oleh para tua-tua
  rationale: Genitif Yunani dapat menandai asal atau hubungan. Bentuk ringkas ini mempertahankan keluwesan tersebut dan tidak menambahkan penilaian teologis terhadap tradisinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tua-tua' dipakai sebagai sebutan tradisional bagi para pemimpin atau tokoh generasi terdahulu. Catatan kaki mempertahankan ketidakpastian leksikal πυγμῇ; penanda [a] hadir dalam teks utama.
