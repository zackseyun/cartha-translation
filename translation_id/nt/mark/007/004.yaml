source:
  edition: SBLGNT
  text: καὶ ἀπ’ ⸀ἀγορᾶς ἐὰν μὴ ⸀βαπτίσωνται οὐκ ἐσθίουσιν, καὶ ἄλλα πολλά ἐστιν ἃ παρέλαβον κρατεῖν, βαπτισμοὺς ποτηρίων καὶ ξεστῶν καὶ χαλκίων ⸂καὶ κλινῶν⸃—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/004.yaml
  text: 'And when they come from the marketplace[a], they do not eat unless they wash themselves[b], and there are many other things that they have received to keep: washings of cups and pitchers and copper vessels and dining couches—'
translation:
  language: id
  text: Dan sepulang dari pasar, mereka tidak makan sebelum membasuh diri[a]. Masih banyak hal lain yang telah mereka terima untuk dijalankan, seperti pembasuhan cawan, kendi, bejana tembaga, dan dipan yang digunakan saat makan[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membenamkan diri.” Bahasa Yunani memakai bentuk dari kata kerja yang sering diterjemahkan “membaptis,” tetapi di sini kata itu mengacu pada pembasuhan ritual dalam konteks adat kemurnian.
    reason: lexical_alternative
  - marker: b
    text: Beberapa naskah tidak memuat “dan dipan yang digunakan saat makan.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀγορᾶς
  choice: pasar
  rationale: Ἀγορά menunjuk pada kawasan pasar atau tempat jual beli umum. Dalam bahasa Indonesia modern, “pasar” sudah jelas dan alami.
- source_word: βαπτίσωνται
  choice: membasuh diri
  rationale: Dalam konteks adat kemurnian ritual sebelum makan, bentuk verba ini menunjuk pada tindakan membersihkan diri. “Membasuh diri” mempertahankan unsur refleksif dan menghindari kesan bahwa yang dimaksud ialah baptisan Kristen.
- source_word: παρέλαβον κρατεῖν
  choice: telah mereka terima untuk dijalankan
  rationale: Ungkapan ini menyatakan berbagai kebiasaan yang diterima lalu dipelihara atau ditaati. “Dijalankan” menyampaikan penerapan yang terus-menerus secara alami tanpa mengubah fokus dari penerimaan menjadi pewarisan.
- source_word: βαπτισμοὺς
  choice: pembasuhan
  rationale: Dalam konteks ini βαπτισμός mengacu pada pencucian ritual berbagai benda. “Pembasuhan” cukup luas untuk tidak membatasi caranya pada pencelupan.
- source_word: ξεστῶν
  choice: kendi
  rationale: Ξέστης adalah wadah seperti tempayan kecil atau kendi. “Kendi” merupakan padanan konkret dan mudah dipahami tanpa memastikan bentuk yang terlalu spesifik.
- source_word: χαλκίων
  choice: bejana tembaga
  rationale: Χαλκίον menunjuk pada benda atau wadah dari tembaga maupun logam campurannya. “Bejana tembaga” dekat dengan unsur leksikalnya dan jelas bagi pembaca modern.
- source_word: κλινῶν
  choice: dipan yang digunakan saat makan
  rationale: Κλίνη dapat berarti tempat tidur atau dipan; dalam konteks jamuan kuno, kemungkinan besar yang dimaksud ialah dipan tempat orang berbaring ketika makan. Frasa ini menjelaskan fungsi bendanya tanpa menerjemahkannya sebagai “meja”.
- source_word: ἄλλα πολλά
  choice: masih banyak hal lain
  rationale: Bahasa Yunani tetap umum, yaitu “banyak hal lain”; terjemahan ini tidak mempersempitnya menjadi hanya “tradisi” atau “kebiasaan”.
theological_decisions:
- issue: Makna βαπτίσωνται dan βαπτισμοὺς dalam konteks kemurnian ritual
  choice: Diterjemahkan “membasuh diri” dan “pembasuhan.”
  alternative: “membenamkan diri” dan “pembenaman,” atau istilah yang memakai kata “baptis”
  rationale: Ayat ini membahas praktik kemurnian orang Farisi, bukan baptisan Kristen. Pilihan ini mempertahankan konteks ritual Yahudi, sedangkan catatan kaki menjaga kemungkinan nuansa pencelupan pada verba Yunani.
- issue: Identitas κλινῶν dalam daftar benda yang dibasuh
  choice: Diterjemahkan sebagai dipan yang digunakan saat makan.
  alternative: “tempat tidur” atau “dipan” tanpa penjelasan fungsi
  rationale: Konteks makan mendukung pemahaman sebagai dipan untuk berbaring pada jamuan, tetapi terjemahan tetap mempertahankan bendanya dan tidak menggantinya dengan “meja.”
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. “Sepulang dari pasar” mengungkapkan elipsis Yunani secara alami. Istilah ritual diterjemahkan secara konkret tanpa memasukkan muatan sakramental yang tidak dituntut konteks.
