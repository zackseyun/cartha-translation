  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama 'Yesus' dinyatakan untuk memperjelas subjek tersirat dalam bahasa Indonesia; 'kalian semua' mempertahankan cakupan πάντες dan bentuk jamak perintah.
