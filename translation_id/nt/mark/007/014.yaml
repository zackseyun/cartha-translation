  text: Καὶ προσκαλεσάμενος ⸀πάλιν τὸν ὄχλον ἔλεγεν αὐτοῖς· ⸀Ἀκούσατέ μου πάντες καὶ ⸀σύνετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/014.yaml
  text: And calling the crowd to him again, he was saying to them, “Listen to me, all of you, and understand.”
translation:
  language: id
  text: Lalu Yesus sekali lagi memanggil orang banyak itu dan berkata kepada mereka, “Dengarkanlah Aku, kalian semua, dan pahamilah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: memanggil ... kembali
  rationale: Partisip aoristus ini menyatakan tindakan Yesus memanggil orang banyak untuk mendekat sebelum berbicara; susunan Indonesia dibuat alami.
- source_word: πάλιν
  choice: kembali
  rationale: Menandai bahwa Yesus sekali lagi memanggil orang banyak.
- source_word: ἔλεγεν
  choice: berkata
  rationale: Imperfek Yunani memperkenalkan ucapan yang menyusul. Dalam narasi Indonesia, 'berkata' lebih alami daripada bentuk progresif yang kaku, tanpa mengubah isi ucapan.
- source_word: Ἀκούσατέ μου
  choice: Dengarkanlah Aku
  rationale: Imperatif aoristus jamak menuntut perhatian seluruh pendengar kepada perkataan Yesus.
- source_word: σύνετε
  choice: pahamilah
  rationale: Imperatif ini meminta para pendengar menangkap atau memahami makna ajaran yang akan disampaikan.
