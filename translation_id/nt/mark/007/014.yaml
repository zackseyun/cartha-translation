  source_fidelity: 'Makna pokok tersampaikan dengan baik: Yesus memanggil orang banyak, lalu memerintahkan mereka untuk mendengarkan dan memahami. Namun, penempatan «kembali» setelah objek dalam «memanggil orang banyak itu kembali» lazimnya dapat dibaca sebagai memanggil mereka untuk kembali/berbalik, bukan sebagai πάλιν, ‘sekali lagi’. Menempatkan keterangan itu sebelum verba menghilangkan ambiguitas tersebut.'
