  naturalness: “Apakah kalian juga sebegitu tidak mengerti?” terdengar tidak lazim dalam bahasa Indonesia modern. Susunan “Apakah kalian juga sedemikian kurang mengerti?” mempertahankan penekanan Οὕτως καὶ ὑμεῖς dan tetap bernada teguran tanpa menjadi kasar.
  terminology: “Menajiskan” adalah padanan yang baik bagi κοινῶσαι dalam konteks kemurnian ritual. Catatan kaki perlu memakai alternatif yang lebih langsung, “membuatnya najis,” serta menjelaskan nuansa ritualnya.
