  text: καὶ λέγει αὐτοῖς· Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε; οὐ νοεῖτε ὅτι πᾶν τὸ ἔξωθεν εἰσπορευόμενον εἰς τὸν ἄνθρωπον οὐ δύναται αὐτὸν κοινῶσαι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/018.yaml
  text: And he said to them[b][a], “So are you also without understanding? Do you not understand that everything that enters into the man from outside is not able to defile him,”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Apakah kalian juga sedemikian kurang mengerti? Tidakkah kalian memahami bahwa apa pun yang masuk ke dalam tubuh seseorang dari luar tidak dapat menajiskannya?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membuatnya najis.” Kata Yunani yang dipakai di sini mengandung nuansa kemurnian ritual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ia berkata
  rationale: Bentuk kini historis Yunani dialihkan ke bentuk lampau naratif yang alami dalam bahasa Indonesia.
- source_word: Οὕτως καὶ ὑμεῖς
  choice: Apakah kalian juga sebegitu
  rationale: Mengungkapkan tekanan teguran dan keterkejutan dalam οὕτως καὶ ὑμεῖς secara wajar.
- source_word: ἀσύνετοί
  choice: tidak mengerti
  rationale: Menyatakan kurangnya pengertian tanpa memakai istilah yang terlalu keras, sekaligus mempertahankan kaitannya dengan νοεῖτε.
- source_word: νοεῖτε
  choice: memahami
  rationale: Padanan Indonesia yang jelas dan alami untuk tindakan menangkap maksud.
- source_word: πᾶν τὸ ἔξωθεν εἰσπορευόμενον
  choice: apa pun yang masuk ... dari luar
  rationale: Menerjemahkan konstruksi partisipial substantival secara generik dan idiomatis sambil mempertahankan ἔξωθεν.
- source_word: εἰς τὸν ἄνθρωπον
  choice: ke dalam diri seseorang
  rationale: Mempertahankan arah εἰς dan arti generik ἄνθρωπος tanpa menyiratkan bahwa yang dimaksud hanya laki-laki.
- source_word: κοινῶσαι
  choice: menajiskannya
  rationale: Dalam konteks ini, kata tersebut merujuk pada keadaan najis atau tidak tahir, terutama dalam ranah kemurnian ritual.
theological_decisions:
- issue: Istilah kemurnian dalam κοινόω
  choice: menajiskannya
  alternative: membuatnya tidak tahir
  rationale: “Menajiskan” ringkas dan sesuai dengan konteks perselisihan mengenai kemurnian ritual; catatan kaki menjelaskan nuansa tersebut agar tidak semata-mata dipahami sebagai kerusakan moral.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan “kalian” menandai orang kedua jamak. Kalimat dibiarkan berakhir sebagai pernyataan yang berlanjut ke ayat berikutnya dalam wacana sumber, meskipun tanda baca ditutup untuk penyajian ayat mandiri.
