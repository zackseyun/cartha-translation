  text: καὶ ὑπερπερισσῶς ἐξεπλήσσοντο λέγοντες· Καλῶς πάντα πεποίηκεν, καὶ τοὺς κωφοὺς ποιεῖ ἀκούειν ⸀καὶ ἀλάλους λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/037.yaml
  text: And they were utterly astonished[a], saying, “He has done everything well[b]. He makes even the deaf hear and the mute speak.”
translation:
  language: id
  text: Mereka takjub bukan kepalang dan berkata, “Ia telah melakukan segala sesuatu dengan baik.[a] Ia membuat orang tuli mendengar dan orang bisu berbicara.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Ia telah melakukan semua hal dengan baik.” Ungkapan ini mungkin menggemakan bahasa Kitab Suci tentang karya-karya Allah.
    reason: lexical_alternative
  - marker: b
    text: 'Perkataan ini mengingatkan pada Yesaya 35:5–6, yang menggambarkan pemulihan dari Allah: orang tuli mendengar dan lidah orang bisu bersorak.'
    reason: cross_reference
lexical_decisions:
- source_word: ὑπερπερισσῶς ἐξεπλήσσοντο
  choice: takjub bukan kepalang
  rationale: Gabungan adverbia yang sangat intensif dan verba ini menyatakan ketakjuban pada taraf yang luar biasa. Ungkapan ini kuat, alami, dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: λέγοντες
  choice: dan berkata
  rationale: Partisip ini menyertai reaksi orang banyak dan secara alami dinyatakan sebagai verba berkoordinasi dalam bahasa Indonesia.
- source_word: Καλῶς πάντα πεποίηκεν
  choice: Ia telah melakukan segala sesuatu dengan baik
  rationale: Bentuk perfektum dipertahankan dengan 'telah', πάντα diterjemahkan secara menyeluruh sebagai 'segala sesuatu', dan καλῶς sebagai penilaian mutu, 'dengan baik'.
- source_word: τοὺς κωφοὺς ποιεῖ ἀκούειν
  choice: orang tuli dibuat-Nya mendengar
  rationale: Konstruksi ποιεῖ dengan infinitif menyatakan sebab atau hasil. Susunan pasif-inversi ini alami dalam seruan bahasa Indonesia dan menonjolkan orang yang dipulihkan.
- source_word: ἀλάλους λαλεῖν
  choice: orang bisu berbicara
  rationale: ἄλαλος dalam konteks penyembuhan berarti orang yang tidak dapat berbicara, sedangkan λαλεῖν berarti berbicara.
- source_word: καὶ ... καὶ
  choice: Bahkan ... dan
  rationale: Koordinasi Yunani menghubungkan kedua karya penyembuhan. 'Bahkan' mengungkapkan daya klimaks yang mungkin dimiliki καί pertama, sedangkan 'dan' mempertahankan kesejajaran kedua kelompok.
theological_decisions:
- issue: Kemungkinan gema bahasa penciptaan dalam Καλῶς πάντα πεποίηκεν
  choice: Mempertahankan ungkapan langsung 'melakukan segala sesuatu dengan baik' tanpa menjelaskan gema itu di dalam teks utama.
  alternative: Menerjemahkan lebih kaku sebagai 'Ia telah menjadikan segala sesuatu baik' untuk memperkuat kaitan dengan kisah penciptaan.
  rationale: ποιέω di sini secara alami berarti 'melakukan', dan teks tidak secara eksplisit menyebut penciptaan. Terjemahan yang dekat tetap memungkinkan gema Kitab Suci tanpa memastikannya.
- issue: Kemungkinan rujukan kepada Yesaya 35:5–6
  choice: Mempertahankan gambaran orang tuli mendengar dan orang bisu berbicara, lalu menunjukkan kemungkinan rujukannya dalam catatan kaki.
  alternative: Membuat nubuat atau tindakan ilahi itu eksplisit di dalam teks utama.
  rationale: Bahasa ayat ini kuat mengingatkan pada pemulihan dalam Yesaya, tetapi Markus tidak menyatakan rujukan itu secara eksplisit di sini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan tetap mudah dipahami. 'Takjub bukan kepalang' dipakai untuk menyampaikan intensitas luar biasa tanpa ungkapan teknis atau kaku; susunan 'dibuat-Nya' mempertahankan daya retoris seruan orang banyak.
