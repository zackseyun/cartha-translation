revisions:
- from: Mereka takjub bukan kepalang dan berkata, “Ia telah melakukan segala sesuatu dengan baik.[a] Bahkan orang tuli dibuat-Nya mendengar dan orang bisu berbicara.”[b]
  to: Mereka takjub bukan kepalang dan berkata, “Ia telah melakukan segala sesuatu dengan baik.[a] Ia membuat orang tuli mendengar dan orang bisu berbicara.”[b]
  rationale: 'Revisi mengganti penegasan tambahan «Bahkan» dan inversi pasif dengan kausatif aktif yang lebih langsung: «Ia membuat orang tuli mendengar». Ini lebih dekat dengan ποιεῖ ἀκούειν dan mempertahankan paralelisme dengan «orang bisu berbicara». Catatan silang diperjelas agar secara akurat membedakan formulasi Markus dari ungkapan Yesaya tentang lidah orang bisu yang bersorak.'
