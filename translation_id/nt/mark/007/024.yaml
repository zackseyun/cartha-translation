  text: ⸂Ἐκεῖθεν δὲ⸃ ἀναστὰς ἀπῆλθεν εἰς τὰ ⸀ὅρια ⸀Τύρου. καὶ εἰσελθὼν εἰς οἰκίαν οὐδένα ἤθελεν γνῶναι, καὶ οὐκ ἠδυνήθη λαθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/024.yaml
  text: From there he got up and went away to the region of Tyre[a]. After entering a house, he wanted no one to know it[c][b], yet he could not remain hidden.
translation:
  language: id
  text: Yesus berangkat dari sana ke wilayah Tirus.[a] Setelah masuk ke sebuah rumah, ia tidak ingin seorang pun mengetahui keberadaannya,[b] tetapi ia tidak dapat luput dari perhatian.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke daerah Tirus” atau “ke kawasan perbatasan Tirus”; kata Yunani yang dipakai dapat menunjuk wilayah yang terkait dengan Tirus, bukan hanya garis batasnya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ia tidak ingin seorang pun mengetahui”; objeknya tersirat dalam bahasa Yunani dan mengacu pada kehadiran atau tempat ia berada.
    reason: lexical_alternative
  - marker: c
    text: Atau “ia tidak dapat tetap tersembunyi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκεῖθεν δὲ
  choice: Dari sana
  rationale: Ἐκεῖθεν menunjukkan gerak dari tempat sebelumnya, sedangkan δέ hanya berfungsi sebagai penghubung ringan dan tidak perlu diterjemahkan secara tersendiri.
- source_word: ἀναστὰς
  choice: bangkit
  rationale: Partisip aoris ini mengantar tindakan berikutnya. 'Bangkit' mempertahankan gerak konkret dan tetap wajar dalam narasi Indonesia.
- source_word: ἀπῆλθεν
  choice: lalu pergi
  rationale: ἀπέρχομαι menyatakan keberangkatan dari suatu tempat; 'lalu pergi' menyampaikan urutan dan perpindahannya secara alami.
- source_word: εἰς τὰ ὅρια Τύρου
  choice: ke wilayah Tirus
  rationale: ὅρια dapat menunjuk daerah, wilayah, atau kawasan perbatasan yang terkait dengan Tirus, bukan hanya garis batasnya.
- source_word: καὶ εἰσελθὼν εἰς οἰκίαν
  choice: Setelah masuk ke sebuah rumah
  rationale: Partisip ini bersifat temporal dan berurutan; οἰκίαν tanpa artikel paling wajar diterjemahkan secara tak tentu sebagai 'sebuah rumah'.
- source_word: οὐδένα ἤθελεν γνῶναι
  choice: ia tidak ingin seorang pun mengetahui keberadaannya
  rationale: Objek dari 'mengetahui' tersirat dalam bahasa Yunani dan menunjuk pada kehadiran atau keberadaan Yesus; ungkapan Indonesia memerlukan objek yang lebih eksplisit.
- source_word: καὶ οὐκ ἠδυνήθη λαθεῖν
  choice: tetapi ia tidak dapat luput dari perhatian
  rationale: λανθάνω berarti tidak diketahui atau luput dari perhatian. Terjemahan ini mempertahankan fokus pada ketidakmampuan menghindari diketahuinya kehadiran Yesus.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan register naratif yang lugas dan bermartabat. Nama 'Yesus' digunakan untuk memperjelas subjek dalam awal unit ayat Indonesia, sementara kata ganti selanjutnya memakai 'ia'. Ambiguitas cakupan ὅρια dan objek tersirat γνῶναι dipertahankan melalui catatan kaki.
