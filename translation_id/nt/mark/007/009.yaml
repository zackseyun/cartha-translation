id: MRK.7.9
reference: Mark 7:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν αὐτοῖς· Καλῶς ἀθετεῖτε τὴν ἐντολὴν τοῦ θεοῦ, ἵνα τὴν παράδοσιν ὑμῶν ⸀τηρήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/009.yaml
  text: And he was saying to them[a], “You neatly set aside the commandment of God so that you may keep your tradition.”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Pandai sekali kalian mengesampingkan perintah Allah supaya kalian dapat mempertahankan tradisi kalian!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Baik sekali cara kalian mengesampingkan perintah Allah untuk mempertahankan tradisi kalian.” Kata Yunani yang diterjemahkan “pandai sekali” dipakai secara ironis, bukan sebagai pujian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ia berkata
  rationale: Imperfek Yunani dapat menggambarkan tuturan yang sedang berlangsung, tetapi dalam narasi Indonesia bentuk sederhana ini paling alami tanpa mengharuskan makna berulang.
- source_word: Καλῶς
  choice: Pandai sekali
  rationale: Ungkapan ini menyampaikan pujian semu yang ironis dan tajam; dalam konteks, Yesus mengecam kecakapan mereka menyingkirkan perintah Allah.
- source_word: ἀθετεῖτε
  choice: mengesampingkan
  rationale: Pilihan ini menyatakan tindakan sengaja menolak keberlakuan suatu perintah dan mempertahankan pertentangannya dengan τηρήσητε.
- source_word: ἐντολὴν τοῦ θεοῦ
  choice: perintah Allah
  rationale: Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan bobot otoritas ilahi.
- source_word: ἵνα
  choice: supaya
  rationale: Kata ini mempertahankan hubungan tujuan dalam bahasa Indonesia yang wajar.
- source_word: παράδοσιν ὑμῶν
  choice: tradisi kalian
  rationale: Frasa ini mempertahankan kontras langsung antara perintah Allah dan tradisi milik para lawan bicara.
- source_word: τηρήσητε
  choice: mempertahankan
  rationale: Dalam konteks tradisi, 'mempertahankan' lebih alami daripada 'menjaga' dan dapat berarti terus memegang atau memelihara keberlakuannya.
theological_decisions:
- issue: Nada perkataan Yesus
  choice: Teguran ironis melalui ungkapan “Pandai sekali”
  alternative: 'Pujian harfiah: “Kalian berbuat baik dengan mengesampingkan...”'
  rationale: Konteks menunjukkan kecaman terhadap tindakan mendahulukan tradisi manusia daripada perintah Allah; ironi perlu terdengar tanpa diubah menjadi pernyataan persetujuan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “kalian” menandai bahwa lawan bicara berbentuk jamak. Tanda seru membantu pembaca menangkap teguran ironis, sementara catatan kaki mempertahankan alternatif yang lebih dekat dengan bentuk leksikal Yunani.
