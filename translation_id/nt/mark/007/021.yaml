source:
  edition: SBLGNT
  text: ἔσωθεν γὰρ ἐκ τῆς καρδίας τῶν ἀνθρώπων οἱ διαλογισμοὶ οἱ κακοὶ ἐκπορεύονται, ⸂πορνεῖαι, κλοπαί, φόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/021.yaml
  text: 'For from within[a], out of the heart of men, evil thoughts come out: sexual immoralities, thefts, murders[b],'
translation:
  language: id
  text: 'Sebab dari dalam, dari hati manusia, keluarlah pikiran-pikiran jahat: tindakan-tindakan seksual yang tidak bermoral[a], pencurian, dan pembunuhan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbagai percabulan.” Kata Yunani berbentuk jamak dan merujuk secara luas pada tindakan-tindakan seksual yang terlarang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσωθεν
  choice: dari dalam
  rationale: Mempertahankan gambaran tentang sumber batiniah dan kontrasnya dengan hal-hal dari luar dalam konteks sekitarnya.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai bahwa ayat ini menjelaskan dan mendasari pernyataan sebelumnya.
- source_word: καρδίας
  choice: hati
  rationale: Mempertahankan istilah antropologis alkitabiah bagi pusat batin, pikiran, kehendak, dan moral manusia tanpa menafsirkannya secara terlalu sempit.
- source_word: ἀνθρώπων
  choice: manusia
  rationale: Bentuk jamak Yunani digunakan secara generik bagi umat manusia; 'manusia' menyampaikan cakupan itu secara alami dan tepat dalam bahasa Indonesia.
- source_word: διαλογισμοὶ οἱ κακοὶ
  choice: pikiran-pikiran jahat
  rationale: Bentuk jamak dipertahankan, sedangkan 'jahat' menyampaikan bobot moral κακοί, bukan sekadar pikiran yang buruk atau tidak menyenangkan.
- source_word: ἐκπορεύονται
  choice: timbul
  rationale: Secara alami menyatakan bahwa hal-hal tersebut muncul atau keluar dari dalam hati. 'Keluar' lebih harfiah, tetapi kurang luwes dalam konstruksi Indonesia ini.
- source_word: πορνεῖαι
  choice: tindakan-tindakan seksual yang tidak bermoral
  rationale: Menyampaikan bentuk jamak dan cakupan luas tindakan seksual terlarang tanpa mempersempitnya pada satu kategori tertentu.
- source_word: κλοπαί
  choice: pencurian
  rationale: Istilah Indonesia yang alami untuk tindakan mengambil milik orang lain secara melawan hukum; dalam daftar ini dapat mencakup berbagai tindakan pencurian.
- source_word: φόνοι
  choice: pembunuhan
  rationale: Menunjuk pada pembunuhan yang salah secara moral, bukan segala bentuk tindakan membunuh.
theological_decisions:
- issue: Cakupan ἀνθρώπων dalam pernyataan antropologis umum
  choice: manusia
  alternative: orang-orang; laki-laki
  rationale: Walaupun bentuk Yunani secara gramatikal maskulin jamak, dalam konteks ini acuannya generik. 'Manusia' mempertahankan pernyataan umum tentang umat manusia tanpa membatasi maknanya pada laki-laki.
- issue: Cakupan dan bentuk jamak πορνεῖαι
  choice: tindakan-tindakan seksual yang tidak bermoral
  alternative: percabulan; amoralitas seksual
  rationale: Terjemahan ini mempertahankan keluasan istilah dan nuansa jamaknya, tanpa memasukkan definisi denominasi tertentu atau membatasinya pada satu jenis pelanggaran seksual.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pengulangan 'dari dalam, dari hati' dipertahankan karena mencerminkan penekanan dan gambaran sumber batiniah dalam teks Yunani. Bentuk daftar dibuat alami dalam bahasa Indonesia tanpa menghilangkan keluasan unsur-unsurnya.
