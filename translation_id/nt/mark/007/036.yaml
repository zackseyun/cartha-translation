  text: καὶ διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸀λέγωσιν· ὅσον δὲ ⸂αὐτοῖς διεστέλλετο, αὐτοὶ⸃ μᾶλλον περισσότερον ἐκήρυσσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/036.yaml
  text: And he ordered them to tell no one. But the more he ordered them[a], the more abundantly they proclaimed it.
translation:
  language: id
  text: Lalu ia memerintahkan mereka agar tidak memberi tahu siapa pun. Namun, semakin ia melarang mereka,[a] semakin luas mereka memberitakannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semakin ia berpesan dengan tegas kepada mereka, semakin luas mereka memberitakannya”; atau, “mereka justru semakin memberitakannya.”
    reason: Menjelaskan bahwa διεστέλλετο dapat mengandung nuansa perintah atau pesan yang tegas, dan bahwa μᾶλλον περισσότερον memberi penekanan tambahan pada peningkatan pemberitaan.
lexical_decisions:
- source_word: διεστείλατο
  choice: memerintahkan
  rationale: Bentuk ini menyatakan perintah atau pesan yang tegas. “Memerintahkan” alami dalam bahasa Indonesia modern dan mempertahankan kekuatan ungkapannya tanpa memakai bentuk yang kuno.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: agar tidak memberi tahu siapa pun
  rationale: Klausa ini menyatakan isi perintah. “Memberi tahu” sesuai dengan konteks penyampaian kabar tentang peristiwa yang baru terjadi.
- source_word: ὅσον ... διεστέλλετο
  choice: semakin ia melarang mereka
  rationale: 'ὅσον bersama bentuk imperfek menyampaikan tindakan berulang dengan hubungan bertingkat: makin sering atau makin kuat larangan itu diberikan. Karena isi perintahnya sudah dinyatakan sebagai larangan, “melarang” menghasilkan ungkapan Indonesia yang ringkas dan alami.'
- source_word: μᾶλλον περισσότερον
  choice: semakin gencar
  rationale: Gabungan kedua kata keterangan ini menegaskan peningkatan tindakan mereka. “Semakin gencar” mempertahankan intensitas tersebut dan berpasangan secara alami dengan klausa “semakin ia melarang mereka”.
- source_word: ἐκήρυσσον
  choice: mereka memberitakannya
  rationale: κηρύσσω menunjuk pada penyampaian atau pengumuman secara terbuka. “Memberitakan” mempertahankan nuansa publik itu tanpa harus memberi kesan khotbah formal; akhiran “-nya” menyatakan isi pemberitaan yang tersirat dari konteks.
theological_decisions:
- issue: Motif kerahasiaan Mesias dan kekuatan perintah Yesus
  choice: Perintah itu diterjemahkan sebagai larangan yang sungguh-sungguh, tanpa menjelaskan alasan di baliknya.
  alternative: Memakai “memperingatkan dengan keras” atau menambahkan penjelasan tentang alasan Yesus menuntut kerahasiaan.
  rationale: Ayat ini mempertahankan ketegangan antara larangan yang tegas dan tindakan orang-orang yang justru makin luas memberitakannya. Terjemahan tidak memasukkan teori teologis tertentu mengenai motif larangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Semakin ... semakin ...” mempertahankan struktur korelatif teks Yunani, sedangkan “gencar” menyampaikan peningkatan intensitas pemberitaan secara alami.
