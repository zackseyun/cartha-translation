source:
  edition: SBLGNT
  text: ⸂ἡ δὲ γυνὴ ἦν⸃ Ἑλληνίς, Συροφοινίκισσα τῷ γένει· καὶ ἠρώτα αὐτὸν ἵνα τὸ δαιμόνιον ἐκβάλῃ ἐκ τῆς θυγατρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/026.yaml
  text: The woman was a Greek[a], a Syrophoenician by birth[b], and she kept asking him to cast the demon out of her daughter.
translation:
  language: id
  text: Perempuan itu adalah seorang Yunani[a], seorang Siro-Fenisia menurut asal-usulnya[b]. Ia terus meminta Yesus untuk mengusir setan itu dari anak perempuannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "seorang bukan Yahudi". Teks Yunani menyebutnya "seorang Yunani", yang dalam konteks ini kemungkinan juga menandakan bahwa ia bukan orang Yahudi dan berbudaya Yunani.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "seorang Siro-Fenisia menurut asal-usulnya"; ungkapan ini menunjuk pada asal-usul atau garis keturunan Siro-Fenisia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑλληνίς
  choice: seorang Yunani
  rationale: Menerjemahkan sebutan Yunani secara langsung dan mempertahankan kemungkinan bahwa istilah ini sekaligus menandai dirinya sebagai bukan orang Yahudi; alternatif itu dicatat dalam catatan kaki.
- source_word: Συροφοινίκισσα τῷ γένει
  choice: keturunan Siro-Fenisia
  rationale: τῷ γένει menunjuk pada asal-usul atau garis keturunan. Ungkapan ini alami dalam bahasa Indonesia dan tidak memakai istilah 'ras' yang dapat memberi kesan biologis modern.
- source_word: ἠρώτα
  choice: terus meminta
  rationale: Bentuk imperfek menggambarkan permintaan yang berlangsung atau diulangi, tanpa menambahkan intensitas emosional yang tidak wajib terkandung dalam ἐρωτάω.
- source_word: ἵνα ... ἐκβάλῃ
  choice: meminta ... mengusir
  rationale: Konstruksi ἵνα menyatakan isi permintaannya, sedangkan 'mengusir' merupakan padanan Indonesia yang wajar bagi ἐκβάλλω dalam konteks pengusiran setan.
- source_word: τὸ δαιμόνιον
  choice: setan itu
  rationale: δαιμόνιον secara khusus menunjuk pada makhluk jahat supernatural; terjemahan ini tidak menggantinya dengan ungkapan berbeda seperti 'roh najis'.
- source_word: ἐκ τῆς θυγατρὸς αὐτῆς
  choice: dari anak perempuannya
  rationale: Dalam bahasa Indonesia, 'mengusir setan itu dari anak perempuannya' menyampaikan daya ἐκ secara alami dan jelas.
- source_word: δὲ
  choice: tidak dinyatakan dengan kata penghubung tersendiri
  rationale: δέ di sini merupakan transisi naratif ringan. Pemisahan menjadi dua kalimat mempertahankan alur tanpa memaksakan pertentangan atau penanda waktu yang tidak eksplisit.
- source_word: αὐτόν
  choice: Yesus
  rationale: Pronomina Yunani berarti 'dia', tetapi penyebutan 'Yesus' memperjelas rujukan dalam ayat yang dibaca tersendiri tanpa mengubah referennya.
theological_decisions:
- issue: Identitas etnis dan sosial perempuan itu
  choice: 'Kedua sebutan dipertahankan: ''seorang Yunani'' dan ''keturunan Siro-Fenisia''.'
  alternative: '''seorang bukan Yahudi, berasal dari Siro-Fenisia'''
  rationale: 'Teks Yunani memuat dua lapisan identitas yang tidak sebaiknya dilebur: Ἑλληνίς dan asal-usul Siro-Fenisia. Catatan kaki mempertahankan implikasi kemungkinan bukan-Yahudi tanpa menggantikan kata utama.'
- issue: Sifat penderitaan anak perempuan itu
  choice: Teks menyatakan bahwa perempuan itu meminta Yesus mengusir 'setan itu'.
  alternative: '''roh jahat itu'''
  rationale: Terjemahan mengikuti δαιμόνιον secara langsung dan tidak melunakkan atau menafsirkan ulang klaim supernatural dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua kalimat menghindari rangkaian klausa yang kaku serta membuat tindakan berulang pada ἠρώτα jelas. 'Siro-Fenisia' dipakai sebagai bentuk geografis-etnis yang mudah dikenali.
