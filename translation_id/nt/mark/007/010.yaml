  text: Μωϋσῆς γὰρ εἶπεν· Τίμα τὸν πατέρα σου καὶ τὴν μητέρα σου, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/010.yaml
  text: For Moses said[a], ‘Honor your father and your mother,’ and[b], ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: id
  text: Sebab Musa berkata, “Hormatilah ayahmu dan ibumu,” dan, “Siapa pun yang mencaci ayah atau ibu[a] harus dihukum mati[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengutuk ayah atau ibu.” Kata Yunaninya dapat berarti mencaci, menjelek-jelekkan, atau mengutuk.
    reason: lexical_alternative
  - marker: b
    text: Atau, “harus mati.” Bahasa Yunani memakai rumusan hukum yang secara harfiah berbunyi “harus mati dengan kematian.”
    reason: alternative_reading
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai bahwa kutipan Musa menjadi dasar penjelasan bagi argumen Yesus.
- source_word: εἶπεν
  choice: berkata
  rationale: Padanan alami untuk verba pelaporan dalam formula pengutipan.
- source_word: Τίμα
  choice: Hormatilah
  rationale: Bentuk imperatif yang alami dan bermartabat serta mempertahankan bobot etis perintah tersebut.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα σου
  choice: ayahmu dan ibumu
  rationale: Mengungkapkan kedua objek secara jelas sesuai teks Yunani dan bentuk perintah yang lazim dalam bahasa Indonesia.
- source_word: Ὁ κακολογῶν
  choice: Siapa pun yang mencaci
  rationale: Partisipel berartikel menyatakan siapa saja yang melakukan tindakan itu; 'mencaci' mencakup perkataan yang menghina atau mengutuk tanpa membatasi maknanya pada kutukan formal.
- source_word: πατέρα ἢ μητέρα
  choice: ayah atau ibunya
  rationale: Akhiran posesif diperlukan agar hubungan kekeluargaan terbaca alami dan tidak ambigu dalam bahasa Indonesia.
- source_word: θανάτῳ τελευτάτω
  choice: harus dihukum mati
  rationale: Ungkapan hukum yang secara harfiah berbentuk 'hendaklah mati dengan kematian' menyatakan hukuman mati; padanan ini alami dalam bahasa Indonesia dan mempertahankan daya wajib dari imperatif orang ketiga.
theological_decisions:
- issue: Cara menerjemahkan rumusan hukuman θανάτῳ τελευτάτω
  choice: harus dihukum mati
  alternative: harus mati
  rationale: Konteks kutipan hukum Taurat mendukung pengertian hukuman yang dijatuhkan, sedangkan 'harus mati' lebih dekat pada bentuk permukaan Yunani tetapi dapat terdengar sekadar menyatakan kematian yang pasti. Alternatif dipertahankan dalam catatan karena bentuk Yunani tidak menyebut pelaksana hukuman secara eksplisit.
- issue: Cakupan makna κακολογῶν
  choice: mencaci
  alternative: mengutuk
  rationale: '''Mencaci'' mempertahankan cakupan perkataan jahat, penghinaan, atau kutukan dan tidak mempersempitnya menjadi kutukan formal saja.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya lugas dan bermartabat. 'Ayah' dan 'ibu' dipilih sebagai bentuk umum yang alami; struktur kutipan dipertahankan tanpa menghilangkan hubungan penjelas yang ditandai oleh γὰρ.
