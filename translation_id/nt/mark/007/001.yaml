  text: Καὶ συνάγονται πρὸς αὐτὸν οἱ Φαρισαῖοι καί τινες τῶν γραμματέων ἐλθόντες ἀπὸ Ἱεροσολύμων
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/001.yaml
  text: And the Pharisees and some of the scribes[a], who had come from Jerusalem, gather around him.
translation:
  language: id
  text: Lalu orang-orang Farisi dan beberapa ahli Taurat yang datang dari Yerusalem berkumpul mengelilingi Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “berkumpul kepada-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Lalu
  rationale: Dalam alur narasi Markus, καί meneruskan kisah; 'Lalu' lebih alami dalam bahasa Indonesia daripada memulai kalimat dengan 'Dan'.
- source_word: συνάγονται πρὸς αὐτὸν
  choice: berkumpul mengelilingi Yesus
  rationale: Gabungan verba dan frasa preposisional menyatakan bahwa mereka berkumpul menuju dan di sekitar Yesus. Nama 'Yesus' memperjelas rujukan pronomina tanpa mengubah acuannya.
- source_word: οἱ Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Bentuk baku dan mudah dipahami untuk nama kelompok Yahudi tersebut.
- source_word: τινες τῶν γραμματέων
  choice: beberapa ahli Taurat
  rationale: Menyampaikan makna partitif bahwa hanya sebagian dari kelompok itu yang hadir; 'ahli Taurat' merupakan padanan Indonesia yang lazim bagi γραμματεῖς dalam konteks Injil.
- source_word: ἐλθόντες ἀπὸ Ἱεροσολύμων
  choice: yang datang dari Yerusalem
  rationale: Klausa relatif alami dalam bahasa Indonesia dan mempertahankan asal mereka; partisip aoris menunjukkan kedatangan yang berkaitan dan secara logis mendahului tindakan berkumpul.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Kala kini historis Yunani diterjemahkan dengan bentuk verba Indonesia yang tidak menandai kala. Penanda catatan ditempatkan setelah kalimat karena catatan menjelaskan gabungan ungkapan 'berkumpul mengelilingi Yesus'.
