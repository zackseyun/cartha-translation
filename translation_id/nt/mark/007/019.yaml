  text: ὅτι οὐκ εἰσπορεύεται αὐτοῦ εἰς τὴν καρδίαν ἀλλ’ εἰς τὴν κοιλίαν, καὶ εἰς τὸν ἀφεδρῶνα ἐκπορεύεται; —⸀καθαρίζων πάντα τὰ βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/019.yaml
  text: because it does not enter into his heart but into his stomach[a], and goes out into the latrine"—thus cleansing all foods.
translation:
  language: id
  text: sebab makanan itu tidak masuk ke dalam hatinya, melainkan ke dalam perutnya, lalu keluar ke jamban”—dengan demikian membersihkan semua makanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang dengan demikian membersihkan semua makanan,” jika frasa terakhir dipahami merujuk kepada proses pencernaan, bukan sebagai komentar penjelas Markus.
    reason: alternative_reading
lexical_decisions:
- source_word: καρδίαν
  choice: hati
  rationale: Mempertahankan gambaran antropologis Alkitabiah dan pertentangan antara batin manusia dengan saluran pencernaan tanpa menafsirkannya secara berlebihan sebagai pikiran atau diri batiniah.
- source_word: κοιλίαν
  choice: perut
  rationale: Merupakan padanan fisiologis yang wajar dalam bahasa Indonesia modern dan sesuai dengan konteks pencernaan.
- source_word: ἀφεδρῶνα
  choice: jamban
  rationale: Menunjuk secara konkret dan cukup santun pada tempat pembuangan kotoran tanpa mengandaikan sistem perpipaan modern.
- source_word: καθαρίζων
  choice: membersihkan
  rationale: Menerjemahkan partisip Yunani secara langsung tanpa memperjelasnya menjadi 'menyatakan tahir', sehingga hubungan sintaksis dan nuansa ritual-fisiologisnya tetap terbuka.
- source_word: βρώματα
  choice: semua makanan
  rationale: Bentuk jamak Yunani dipertahankan secara idiomatis untuk mencakup berbagai jenis makanan.
- source_word: αὐτοῦ
  choice: -nya
  rationale: Pronomina posesif ini merujuk kepada orang yang sedang dibicarakan dan paling alami dinyatakan dengan akhiran '-nya' pada 'hati' dan, berdasarkan konstruksi paralel, pada 'perut'.
- source_word: εἰσπορεύεται / ἐκπορεύεται
  choice: masuk / keluar
  rationale: Mempertahankan kontras gerak masuk dan keluar secara lugas dan alami.
theological_decisions:
- issue: Hubungan dan makna καθαρίζων πάντα τὰ βρώματα
  choice: 'Ungkapan penjelas narator: ''dengan demikian membersihkan semua makanan'''
  alternative: 'Ungkapan yang mengacu pada proses pencernaan: ''dengan demikian membuang bersih semua makanan'''
  rationale: Partisip maskulin tunggal dapat dipahami sebagai komentar narator mengenai implikasi perkataan Yesus, tetapi konstruksinya sulit dan penafsiran fisiologis tetap mungkin. Terjemahan utama mengikuti pembacaan sebagai komentar narator tanpa menambahkan kata 'menyatakan' atau 'tahir', sedangkan catatan kaki mempertahankan alternatif yang sungguh diperdebatkan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Jamban' dipilih karena konkret tetapi tidak kasar. Struktur kutipan dan tanda pisah mempertahankan kemungkinan bahwa frasa terakhir merupakan komentar narator, sementara pilihan 'membersihkan' menghindari penafsiran eksplisit yang tidak dinyatakan langsung oleh bentuk Yunani.
