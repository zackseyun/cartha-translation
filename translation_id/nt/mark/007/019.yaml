  source_fidelity: Terjemahan mempertahankan kontras utama Yunani antara hati dan saluran pencernaan, serta gerak ‘masuk’ dan ‘keluar’. ‘Jamban’ merupakan padanan yang konkret dan wajar untuk ἀφεδρών. Frasa akhir καθαρίζων πάντα τὰ βρώματα memang sukar secara sintaksis; terjemahan utama yang tidak menambahkan ‘menyatakan tahir’ dengan tepat mempertahankan keterbukaan maknanya.
  naturalness: Teks utama dapat dipahami dalam bahasa Indonesia modern dan tanda kutip penutup konsisten dengan kutipan yang sedang berlangsung dari konteks sebelumnya. Namun, ‘membuang bersih semua makanan’ dalam catatan kaki tidak idiomatis dalam bahasa Indonesia dan tidak secara jelas mengungkapkan alternatif bahwa frasa itu dapat merujuk pada proses pencernaan.
  terminology: ‘Hati’, ‘perut’, dan ‘jamban’ sesuai dengan register modern yang bermartabat. ‘Membersihkan semua makanan’ secara sengaja tidak memaksakan istilah ritual ‘mentahirkan’; ini tepat mengingat ambiguitas partisip tersebut.
