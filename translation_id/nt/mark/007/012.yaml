translation:
  language: id
  text: Kalian tidak lagi mengizinkannya melakukan apa pun untuk ayah atau ibunya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melakukan apa pun untuk menolong ayah atau ibunya.” Ungkapan Yunani yang lebih luas ini, dalam konteks tersebut, dapat mencakup bantuan praktis atau keuangan.
