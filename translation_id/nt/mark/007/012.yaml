lexical_decisions:
- source_word: οὐκέτι
  choice: tidak lagi
  rationale: Mempertahankan makna temporal bahwa keadaan atau tindakan yang sebelumnya mungkin dilakukan kini sudah tidak diizinkan.
- source_word: ἀφίετε
  choice: mengizinkan
  rationale: Dalam konteks ini, ἀφίημι berarti memberi izin atau membiarkan, bukan ‘mengampuni’ atau ‘meninggalkan’. ‘Mengizinkan’ secara alami menyatakan tindakan mencegah yang tersirat dalam konteks.
- source_word: αὐτόν
  choice: -nya
  rationale: Pronomina objek maskulin tunggal merujuk kepada orang yang seharusnya dapat berbuat sesuatu bagi orang tuanya. Bentuk enklitik ‘-nya’ wajar dalam bahasa Indonesia.
- source_word: οὐδέν
  choice: apa pun
  rationale: Dalam konstruksi negatif setelah verba ‘mengizinkan’, ‘apa pun’ menyampaikan bahwa tidak ada satu tindakan pun yang diperbolehkan.
- source_word: ποιῆσαι
  choice: berbuat
  rationale: Infinitif ini memiliki arti umum ‘melakukan/berbuat’. Pilihan ‘berbuat’ mempertahankan keluasan ungkapan Yunani tanpa membatasinya khusus pada bantuan keuangan.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: bagi ayah atau ibunya
  rationale: Bentuk datif menyatakan pihak yang menerima manfaat. ‘Bagi’ mempertahankan cakupan umum itu, sedangkan akhiran posesif pada ‘ibunya’ secara alami berlaku bagi kedua orang tua dalam frasa Indonesia.
theological_decisions:
- issue: Apakah nuansa bantuan materi atau keuangan dari konteks korban perlu dinyatakan secara eksplisit
  choice: Mempertahankan ungkapan umum ‘berbuat apa pun bagi ayah atau ibunya’
  alternative: ‘berbuat apa pun untuk menolong ayah atau ibunya’ atau ‘memberikan bantuan apa pun kepada ayah atau ibunya’
  rationale: Teks Yunani ayat ini memakai ungkapan luas, sedangkan konteks sebelumnya menyiratkan dukungan praktis atau materi. Terjemahan utama tidak mempersempit makna ayat, dan catatan kaki menjelaskan implikasi kontekstualnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Kalian’ mempertahankan orang kedua jamak yang tersirat dalam ἀφίετε. Susunan ‘mengizinkannya berbuat’ dipilih sebagai bentuk yang alami, sementara ‘bagi’ menjaga nuansa penerima manfaat dan keluasan makna sumber.
