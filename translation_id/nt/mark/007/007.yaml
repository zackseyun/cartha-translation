  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/007.yaml
  text: But they worship me in vain[a], teaching as doctrines the commandments of men.
translation:
  language: id
  text: Namun, mereka menyembah Aku dengan sia-sia, sambil mengajarkan perintah-perintah manusia sebagai ajaran.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sambil mengajarkan ajaran-ajaran yang berupa perintah-perintah manusia.”
    reason: Bahasa Yunani dapat menyajikan ‘ajaran-ajaran’ dan ‘perintah-perintah manusia’ dalam hubungan aposisional, bukan secara eksplisit dengan konstruksi ‘sebagai ajaran’.
lexical_decisions:
- source_word: μάτην
  choice: sia-sialah
  rationale: Adverbia ini berarti ‘tanpa hasil atau tujuan yang benar’. Bentuk ‘sia-sialah’ alami dalam kutipan yang bernada tegas dan mempertahankan daya kecaman nubuat tersebut.
- source_word: δὲ
  choice: Namun
  rationale: 'Partikel ini menandai pertentangan dengan ayat sebelumnya: mereka menghormati Allah dengan bibir, tetapi hati mereka jauh dari-Nya.'
- source_word: σέβονταί με
  choice: mereka menyembah Aku
  rationale: Kata kerja σέβομαι di sini menunjuk pada penghormatan religius kepada Allah. ‘Menyembah’ paling jelas menyatakan makna itu, sedangkan ‘Aku’ mempertahankan ujaran langsung Allah dalam kutipan.
- source_word: διδάσκοντες
  choice: dengan mengajarkan
  rationale: Partisipel kini ini menyatakan cara atau hal yang menyertai penyembahan mereka. ‘Dengan mengajarkan’ mempertahankan hubungan tersebut tanpa mengubahnya menjadi alasan sebab-akibat yang terlalu tegas.
- source_word: διδασκαλίας
  choice: sebagai ajaran
  rationale: Dalam hubungan sintaksisnya dengan ἐντάλματα, kata ini menunjukkan bahwa perintah manusia diajarkan dengan kedudukan sebagai ajaran yang berwenang.
- source_word: ἐντάλματα ἀνθρώπων
  choice: perintah-perintah manusia
  rationale: Ἐντάλματα adalah perintah atau ketetapan yang berwenang, sedangkan genitif ἀνθρώπων menyatakan sumbernya. ‘Manusia’ bersifat generik dan menegaskan kontras antara asal manusiawi dan ilahi.
theological_decisions:
- issue: Hubungan antara ajaran dan perintah manusia dalam kutipan
  choice: mengajarkan perintah-perintah manusia sebagai ajaran
  alternative: mengajarkan ajaran-ajaran yang berupa perintah-perintah manusia
  rationale: Bahasa Yunani padat dan dapat dipahami secara predikatif atau aposisional. Terjemahan utama menyatakan bahwa perintah yang berasal dari manusia diberi status sebagai ajaran, tanpa menambahkan doktrin denominasi tertentu; catatan kaki mempertahankan susunan alternatif yang lebih dekat dengan bentuk harfiahnya.
- issue: Hubungan partisipel dengan penyembahan yang sia-sia
  choice: dengan mengajarkan
  alternative: sambil mengajarkan
  rationale: Partisipel dapat menyatakan cara atau keadaan yang menyertai. ‘Dengan’ menonjolkan cara penyembahan itu menjadi sia-sia, tetapi tidak sekuat penghubung kausal seperti ‘karena’, sehingga ketegangan sintaksis sumber tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Sia-sialah’ mempertahankan tekanan retoris kutipan, sementara ‘perintah-perintah manusia’ mudah dipahami dan tidak membatasi ἀνθρώπων pada laki-laki.
