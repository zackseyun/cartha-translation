  text: ⸂ἀλλ’ εὐθὺς ἀκούσασα⸃ γυνὴ περὶ αὐτοῦ, ἧς εἶχεν τὸ θυγάτριον αὐτῆς πνεῦμα ἀκάθαρτον, ἐλθοῦσα προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/025.yaml
  text: But immediately a woman whose little daughter had an unclean spirit[a], having heard about him[c][b], came and fell at his feet.
translation:
  language: id
  text: Namun, begitu mendengar tentang Dia[c], seorang perempuan yang anak perempuannya yang masih kecil[a] dirasuki roh najis[b] datang dan tersungkur di kaki-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang dipakai merupakan bentuk diminutif dari kata “anak perempuan” dan dapat juga diterjemahkan “gadis kecil.”
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “roh yang tidak tahir”; secara tradisional juga dipahami sebagai setan.'
    reason: alternative_reading
  - marker: c
    text: 'Susunan kalimat Yunani dapat juga diterjemahkan: “Namun, seorang perempuan yang anak perempuannya yang masih kecil dirasuki roh najis segera mendengar tentang Dia, lalu datang dan tersungkur di kaki-Nya.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Namun
  rationale: Menjaga daya penghubung yang agak berlawanan dengan konteks sebelumnya tanpa membuat peralihan narasi terasa kaku.
- source_word: εὐθὺς ἀκούσασα ... περὶ αὐτοῦ
  choice: begitu mendengar tentang Dia
  rationale: Ungkapan ini secara alami menyampaikan bahwa perempuan itu segera bertindak setelah mendengar kabar tentang Yesus, sekaligus mempertahankan urgensi khas narasi Markus.
- source_word: γυνὴ
  choice: seorang perempuan
  rationale: Nomina tanpa artikel ini memperkenalkan tokoh baru sehingga bentuk tak tentu paling sesuai.
- source_word: θυγάτριον
  choice: anak perempuannya yang masih kecil
  rationale: Mempertahankan hubungan keluarga dan nuansa bentuk diminutif Yunani tanpa memakai ungkapan yang tidak alami dalam bahasa Indonesia.
- source_word: πνεῦμα ἀκάθαρτον
  choice: roh najis
  rationale: Mempertahankan istilah khas Markus serta cakupan makna kenajisan, alih-alih langsung menafsirkannya sebagai setan.
- source_word: ἧς εἶχεν τὸ θυγάτριον αὐτῆς πνεῦμα ἀκάθαρτον
  choice: yang anak perempuannya yang masih kecil dirasuki roh najis
  rationale: Konstruksi ini menyampaikan keadaan anak secara alami dalam bahasa Indonesia. Kata 'dirasuki' menjelaskan hubungan idiomatis antara anak dan roh tanpa mengganti sebutan 'roh najis' dengan istilah yang lebih interpretatif.
- source_word: ἐλθοῦσα
  choice: datang
  rationale: Partisip aoristus diterjemahkan sebagai tindakan berurutan agar alur narasi alami dalam bahasa Indonesia.
- source_word: προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ
  choice: tersungkur di kaki-Nya
  rationale: Mengungkapkan gerak tubuh berupa permohonan mendesak dan kerendahan hati, sambil mempertahankan gambaran fisik teks Yunani.
theological_decisions:
- issue: Penerjemahan πνεῦμα ἀκάθαρτον
  choice: roh najis
  alternative: roh jahat; setan
  rationale: Pilihan ini mempertahankan istilah Markus dan nuansa kenajisannya. 'Setan' akan lebih interpretatif, sedangkan 'roh jahat' menggeser kata 'najis' menjadi penilaian moral yang lebih umum.
- issue: Hubungan anak dengan roh najis
  choice: dirasuki roh najis
  alternative: mempunyai roh najis
  rationale: Bahasa sumber secara harfiah menyatakan bahwa anak itu 'mempunyai' roh najis, tetapi ungkapan tersebut tidak alami dan dapat disalahpahami dalam bahasa Indonesia. 'Dirasuki' menyampaikan keadaan yang dimaksud dalam konteks tanpa menentukan lebih jauh sifat atau mekanismenya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Begitu mendengar' dipilih untuk alur yang wajar sekaligus mempertahankan kesegeraan. Kapitalisasi pronomina untuk Yesus mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
