  terminology: Nama Yesus, penyebutan “orang itu,” serta “telinga” dan “lidah” konsisten dan jelas. Kapitalisasi pronomina ilahi dapat dipertahankan sesuai kebiasaan editorial yang dinyatakan. Catatan tentang ludah dengan tepat menjaga ketidakjelasan yang ada dalam teks Yunani.
