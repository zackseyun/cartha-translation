  text: καὶ ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου κατ’ ἰδίαν ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ καὶ πτύσας ἥψατο τῆς γλώσσης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/033.yaml
  text: And taking him aside from the crowd privately[a], he put his fingers into his ears, and after spitting[b], he touched his tongue.
translation:
  language: id
  text: Lalu Yesus membawa orang itu menjauh dari orang banyak, secara tersendiri.[a] Ia memasukkan jari-jari-Nya ke telinga orang itu, lalu setelah meludah,[b] Ia menyentuh lidahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tempat tersendiri” atau “secara terpisah.”
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani menyatakan, “setelah meludah, Ia menyentuh lidahnya.” Teks ini tidak secara eksplisit mengatakan bahwa Yesus menaruh ludah pada lidah orang itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου
  choice: membawa orang itu menjauh dari orang banyak
  rationale: Partisip ini menggambarkan tindakan memisahkan orang tersebut dari kerumunan. Ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan kekerasan.
- source_word: κατ’ ἰδίαν
  choice: supaya mereka sendirian
  rationale: Frasa ini menyatakan keadaan terpisah atau tersendiri. Pilihan ini memperjelas bahwa Yesus dan orang itu berada terpisah dari orang banyak, tanpa menentukan lebih jauh tempat atau maksudnya.
- source_word: ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ
  choice: Ia memasukkan jari-jari-Nya ke telinga orang itu
  rationale: Dalam konteks gerakan tubuh ini, ἔβαλεν berarti menaruh atau memasukkan. Penyebutan 'orang itu' menghindari ketaksaan rujukan pronomina dalam bahasa Indonesia.
- source_word: πτύσας
  choice: setelah meludah
  rationale: Partisip aoris menyatakan tindakan yang mendahului atau menyertai tindakan utama. Terjemahan ini menjaga urutan narasi tanpa menambahkan bahwa ludah dioleskan pada lidah orang tersebut.
- source_word: ἥψατο τῆς γλώσσης αὐτοῦ
  choice: Ia menyentuh lidahnya
  rationale: ἅπτομαι dengan objek genitif lazim berarti menyentuh. Konteks menunjukkan bahwa akhiran '-nya' mengacu kepada orang yang dibawa Yesus.
theological_decisions:
- issue: Gerakan penyembuhan Yesus dan hubungan ludah dengan lidah orang itu
  choice: Melaporkan bahwa Yesus meludah lalu menyentuh lidah orang itu, tanpa menyatakan bahwa ludah-Nya dikenakan pada lidah tersebut.
  alternative: Menerjemahkan bahwa Yesus membasahi atau mengolesi lidah orang itu dengan ludah-Nya.
  rationale: Teks Yunani hanya mengatakan bahwa Yesus meludah dan menyentuh lidah orang itu. Objek atau arah ludah tidak dinyatakan secara eksplisit, sehingga terjemahan mempertahankan ketaksaan naratif tersebut dan tidak menambahkan penjelasan simbolis, ritual, atau medis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama 'Yesus' dipakai pada awal ayat untuk memperjelas pelaku karena ayat ini dapat dibaca secara mandiri. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas penerbitan Alkitab bahasa Indonesia; 'orang itu' digunakan untuk membedakan rujukan pronomina.
