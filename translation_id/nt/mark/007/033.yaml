revisions:
- from: Lalu Yesus membawa orang itu menjauh dari orang banyak supaya mereka sendirian.[a] Ia memasukkan jari-jari-Nya ke telinga orang itu, lalu setelah meludah,[b] Ia menyentuh lidahnya.
  to: Lalu Yesus membawa orang itu menjauh dari orang banyak, secara tersendiri.[a] Ia memasukkan jari-jari-Nya ke telinga orang itu, lalu setelah meludah,[b] Ia menyentuh lidahnya.
  rationale: Revisi mengganti frasa yang menyatakan tujuan dan eksklusivitas (“supaya mereka sendirian”) dengan “secara tersendiri,” yang menyampaikan κατ’ ἰδίαν tanpa menambah informasi. Catatan kaki a juga disesuaikan agar alternatif Indonesianya mencerminkan makna ‘apart/in private’ dengan lebih baik. Bagian lain dipertahankan karena setia pada teks sumber dan tidak menyatakan bahwa ludah dikenakan pada lidah orang itu.
