  text: καὶ ἀναβλέψας εἰς τὸν οὐρανὸν ἐστέναξεν, καὶ λέγει αὐτῷ· Εφφαθα, ὅ ἐστιν Διανοίχθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/034.yaml
  text: And looking up to heaven[a], he sighed and said to him, “Ephphatha,” that is[b], “Be opened.”
translation:
  language: id
  text: Lalu, sambil menengadah ke langit, ia menghela napas[a] dan berkata kepadanya, “Efata,”[b] yang berarti, “Terbukalah!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengerang”; kata Yunaninya dapat menggambarkan helaan napas yang dalam atau erangan.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Aram: “Efata” berarti “Terbukalah!”'
    reason: cultural_note
lexical_decisions:
- source_word: ἀναβλέψας εἰς τὸν οὐρανόν
  choice: sambil menengadah ke langit
  rationale: Partisip aoristus menunjukkan tindakan yang menyertai dan mendahului verba utama. “Menengadah ke langit” secara alami menyampaikan arah pandangan ke atas tanpa menambahkan bahwa Yesus berdoa.
- source_word: ἐστέναξεν
  choice: ia menghela napas dalam-dalam
  rationale: στενάζω dapat berarti menghela napas atau mengerang. Pilihan ini menyampaikan napas berat yang terdengar tanpa memastikan bahwa tindakannya merupakan erangan; alternatif leksikal dicatat dalam catatan kaki.
- source_word: λέγει αὐτῷ
  choice: berkata kepada orang itu
  rationale: Pronomina datif tunggal paling wajar merujuk kepada orang yang tuli dan sulit berbicara. Bentuk kini historis diterjemahkan dengan bentuk naratif Indonesia yang alami.
- source_word: Εφφαθα
  choice: Efata
  rationale: Ucapan bahasa Aram dipertahankan dalam transliterasi yang lazim dan mudah dibaca dalam bahasa Indonesia, lalu dijelaskan oleh terjemahan Markus sendiri.
- source_word: Διανοίχθητι
  choice: Terbukalah!
  rationale: Imperatif pasif aoristus tunggal diterjemahkan secara langsung dengan bentuk pasif imperatif bahasa Indonesia, sehingga bentuk dan ketegasan perintah tetap terpelihara.
theological_decisions:
- issue: Rujukan αὐτῷ
  choice: kepada orang itu
  alternative: kepada telinga atau kemampuan bicara orang itu secara tidak langsung
  rationale: Datif Yunani paling alami merujuk kepada orang yang sedang dihadapi Yesus. Terjemahan mempertahankan sapaan kepada pribadi tersebut dan tidak mempersempit perintah hanya kepada salah satu organ tubuhnya.
- issue: Makna οὐρανός dalam gerak menengadah
  choice: langit
  alternative: surga
  rationale: οὐρανός dapat berarti langit maupun surga. Dalam frasa arah pandangan ini, bahasa Indonesia alami memakai “menengadah ke langit”; pilihan tersebut mempertahankan tindakan yang tampak dan tidak secara eksplisit menentukan apakah yang dimaksud ialah ranah ilahi, meski konteks memungkinkan nuansa itu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan klausa mengikuti alur Yunani tanpa terasa kaku. Semua penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan; urutan catatan dibetulkan berdasarkan letaknya dalam ayat, karena data konsultasi Inggris tampak menukar isi catatan a dan b.
