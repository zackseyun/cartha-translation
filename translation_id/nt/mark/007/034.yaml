  rationale: Revisi menghapus penguatan yang tidak tersurat dalam verba Yunani dan memakai pronomina yang lebih dekat dengan datif αὐτῷ. Pilihan "langit," transliterasi "Efata," serta penanda dan isi catatan kaki dipertahankan; semua jangkar catatan kaki tetap ditempatkan pada unsur yang dijelaskan.
