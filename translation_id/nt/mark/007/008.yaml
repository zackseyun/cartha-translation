  text: ⸀ἀφέντες τὴν ἐντολὴν τοῦ θεοῦ κρατεῖτε τὴν παράδοσιν τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/008.yaml
  text: Leaving the commandment of God[a], you hold fast to the tradition of men.
translation:
  language: id
  text: Dengan mengabaikan perintah Allah, kalian berpegang teguh pada tradisi manusia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέντες
  choice: Dengan mengabaikan
  rationale: Partisip aoristus ini menyatakan tindakan yang menyertai atau mendahului verba utama. Dalam konteks teguran, “mengabaikan” secara alami menyampaikan tindakan menyingkirkan perintah Allah tanpa memperkuatnya sampai menjadi “meninggalkan sama sekali”.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: perintah Allah
  rationale: “Perintah” adalah padanan Indonesia yang alami dan bermartabat bagi ἐντολή, sedangkan genitif τοῦ θεοῦ menyatakan bahwa perintah itu berasal dari atau merupakan milik Allah.
- source_word: κρατεῖτε
  choice: kalian berpegang teguh pada
  rationale: κρατέω di sini berarti tetap memegang atau menaati dengan kuat. “Berpegang teguh pada” mempertahankan tekanan pada keterikatan yang kukuh.
- source_word: τὴν παράδοσιν τῶν ἀνθρώπων
  choice: tradisi manusia
  rationale: παράδοσις berarti tradisi yang diwariskan, dan ἀνθρώπων mengontraskan asal-usul manusiawinya dengan perintah Allah, bukan menunjuk khusus kepada laki-laki.
theological_decisions:
- issue: Pertentangan antara perintah Allah dan tradisi manusia
  choice: Mempertahankan kontras langsung antara “perintah Allah” dan “tradisi manusia”.
  alternative: Memakai “tradisi orang-orang” atau memperluasnya menjadi “tradisi yang diwariskan manusia”.
  rationale: Kekuatan teguran terletak pada pertentangan antara otoritas ilahi dan tradisi yang berasal dari manusia. “Tradisi manusia” tajam dan alami, tetapi tidak menyiratkan bahwa semua tradisi pada dirinya selalu salah.
- issue: Daya teguran pada ἀφέντες
  choice: “Dengan mengabaikan”
  alternative: “Setelah meninggalkan” atau “Dengan menyingkirkan”
  rationale: Pilihan ini mempertahankan kecaman bahwa perintah Allah tidak diindahkan, tanpa secara tidak perlu menetapkan bahwa perintah itu telah ditinggalkan secara mutlak dan permanen.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Pronomina “kalian” dipakai karena verba Yunani berbentuk orang kedua jamak dan teguran ditujukan kepada sekelompok lawan bicara. Tidak diperlukan catatan kaki karena “manusia” secara tepat mencakup manusia secara umum dan mempertahankan kontras dengan Allah.
