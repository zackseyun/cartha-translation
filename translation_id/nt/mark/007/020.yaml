  yaml_path: translation/nt/mark/007/020.yaml
  text: And he was saying, “What comes out from the man—that defiles the man.”
translation:
  language: id
  text: Lalu Ia berkata, “Apa yang keluar dari seseorang, itulah yang menajiskan orang itu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuat orang itu tidak tahir.” Kata kerja Yunani yang digunakan merupakan istilah kemurnian yang berarti menjadikan seseorang najis atau tidak tahir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ia berkata
  rationale: Bentuk imperfek menggambarkan ujaran yang sedang berlanjut dalam narasi; dalam bahasa Indonesia, aspek itu sudah cukup terbaca dari konteks dan paling alami diterjemahkan dengan bentuk lampau naratif sederhana.
- source_word: δὲ
  choice: Lalu
  rationale: Partikel ini merupakan penghubung naratif ringan, bukan pertentangan kuat; “Lalu” menyambungkan perkataan ini dengan konteks sebelumnya secara alami.
- source_word: ὅτι
  choice: tanda petik langsung
  rationale: ὅτι memperkenalkan isi perkataan; bahasa Indonesia alami menyajikannya sebagai kutipan langsung.
- source_word: Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον
  choice: Apa yang keluar dari seseorang
  rationale: Konstruksi partisip berartikel bersifat substantival dan secara alami berarti “apa yang keluar.” ἄνθρωπος di sini bersifat generik, sehingga “seseorang” menyampaikan cakupan manusia secara umum tanpa mengubah maksud.
- source_word: ἐκεῖνο
  choice: itulah
  rationale: Bentuk demonstratif ini memberi penekanan pada hal yang baru disebut; “itulah” mempertahankan tekanan retoris tersebut.
- source_word: κοινοῖ
  choice: menajiskan
  rationale: Dalam konteks kemurnian, verba ini berarti membuat seseorang menjadi najis atau cemar. “Menajiskan” ringkas, wajar dalam register Alkitab Indonesia, dan mempertahankan latar bahasa kemurnian.
- source_word: τὸν ἄνθρωπον
  choice: orang itu
  rationale: Frasa ini menunjuk kembali kepada manusia yang disebut sebelumnya. “Orang itu” menjaga paralelisme serta rujukan spesifik dalam kalimat.
theological_decisions:
- issue: Bahasa kemurnian pada κοινόω
  choice: menajiskan
  alternative: membuat orang itu tidak tahir
  rationale: “Menajiskan” mempertahankan daya moral dan ritual istilah Yunani tanpa menentukan bahwa hanya salah satu ranah yang dimaksud. Alternatif di catatan kaki memperjelas latar kategori tahir-najis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “itulah” mempertahankan penekanan Yunani, sedangkan “seseorang ... orang itu” menyampaikan pemakaian ἄνθρωπος yang generik secara alami.
