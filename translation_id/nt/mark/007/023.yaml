base_translation:
  language: en
  yaml_path: translation/nt/mark/007/023.yaml
  text: All these evil things come out from within and defile the man[a].
translation:
  language: id
  text: Semua hal jahat ini keluar dari dalam dan menajiskan orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani memakai bentuk tunggal “manusia” secara umum untuk seorang manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ταῦτα τὰ πονηρά
  choice: Semua hal jahat ini
  rationale: Ungkapan ini bersifat menegaskan dan menyeluruh serta merujuk kembali kepada daftar kejahatan pada ayat sebelumnya. Bentuk konkret jamaknya dipertahankan secara alami dalam bahasa Indonesia.
- source_word: ἔσωθεν
  choice: dari dalam
  rationale: Menunjukkan asal dari batin dan mempertahankan kontras dalam konteks antara sumber kenajisan dari dalam dan hal-hal dari luar.
- source_word: ἐκπορεύεται
  choice: berasal
  rationale: Dalam konstruksi Yunani ini, verba tunggal menyertai subjek netral jamak. 'Berasal dari dalam' menyampaikan sumber sekaligus gerak keluarnya secara wajar dalam bahasa Indonesia.
- source_word: κοινοῖ
  choice: menajiskan
  rationale: Dalam konteks pembahasan Markus tentang kenajisan, kata ini berarti membuat najis dalam pengertian keagamaan dan moral, bukan sekadar membuat sesuatu menjadi umum.
- source_word: τὸν ἄνθρωπον
  choice: orang
  rationale: '''Orang'' secara alami menyampaikan bentuk tunggal generik ἄνθρωπος dalam bahasa Indonesia tanpa membatasi pernyataan umum ini pada laki-laki.'
theological_decisions:
- issue: Cakupan τὸν ἄνθρωπον dalam pernyataan umum tentang kenajisan manusia
  choice: orang
  alternative: manusia itu
  rationale: Kata Yunani berbentuk tunggal dan digunakan secara generik bagi seorang manusia. 'Orang' mempertahankan acuan tunggal serta cakupan umum secara alami; catatan kaki menjelaskan bentuk sumbernya.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Istilah 'menajiskan' mempertahankan kaitan dengan tema kenajisan dalam konteks, sedangkan 'orang' mengungkapkan bentuk tunggal generik secara idiomatis.
