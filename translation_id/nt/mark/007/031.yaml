id: MRK.7.31
reference: Mark 7:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ πάλιν ἐξελθὼν ἐκ τῶν ὁρίων Τύρου ⸂ἦλθεν διὰ Σιδῶνος εἰς⸃ τὴν θάλασσαν τῆς Γαλιλαίας ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/031.yaml
  text: And again[a], after departing from the region of Tyre, he came through Sidon to the Sea of Galilee[b], through the midst of the region of the Decapolis.
translation:
  language: id
  text: Kemudian, setelah meninggalkan wilayah Tirus, Yesus kembali pergi melalui Sidon menuju Danau Galilea, melintasi wilayah Dekapolis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “melalui tengah-tengah wilayah Dekapolis,” atau mungkin, “di antara wilayah-wilayah Dekapolis.” Ungkapan Yunani ini tidak biasa, dan rute yang dimaksud sulit dipastikan secara geografis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: Kemudian
  rationale: Dalam konteks ini πάλιν menandai kelanjutan atau peralihan kembali dalam rangkaian perjalanan; 'Kemudian' lebih alami dalam narasi Indonesia daripada 'lagi' yang dapat secara keliru menyiratkan pengulangan seluruh rute.
- source_word: ἐξελθὼν ἐκ τῶν ὁρίων Τύρου
  choice: meninggalkan wilayah Tirus
  rationale: Partisip aoristus menyatakan tindakan yang mendahului verba utama; bentuk ini menyampaikan urutan dengan alami. ὅρια menunjuk kawasan atau wilayah, bukan sekadar garis batas.
- source_word: ἦλθεν διὰ Σιδῶνος εἰς
  choice: pergi melalui Sidon menuju
  rationale: ἦλθεν dapat diterjemahkan menurut sudut pandang perjalanan sebagai 'pergi'; διά dengan genitif menyatakan rute melalui atau lewat Sidon, sedangkan εἰς menunjukkan arah tujuan.
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: Danau Galilea
  rationale: Walaupun θάλασσα secara harfiah berarti 'laut', tempat ini secara geografis adalah danau dan nama 'Danau Galilea' lazim serta mudah dipahami dalam bahasa Indonesia.
- source_word: ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως
  choice: melintasi wilayah Dekapolis
  rationale: Ungkapan ruang yang tidak biasa ini menggambarkan perjalanan di tengah atau melalui kawasan Dekapolis. 'Melintasi' alami dalam bahasa Indonesia sambil mempertahankan arah perjalanan; alternatif yang lebih harfiah dicatat karena rutenya sulit dipastikan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama Yesus dinyatakan untuk menjernihkan subjek tersirat dalam verba Yunani. Kalimat mempertahankan urutan rute yang secara geografis tidak biasa tanpa berusaha menyelaraskannya.
