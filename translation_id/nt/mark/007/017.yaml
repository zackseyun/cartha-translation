  text: Καὶ ὅτε εἰσῆλθεν ⸀εἰς οἶκον ἀπὸ τοῦ ὄχλου, ἐπηρώτων αὐτὸν οἱ μαθηταὶ αὐτοῦ ⸂τὴν παραβολήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/017.yaml
  text: And when he entered a house away from the crowd[a], his disciples asked him about the parable.
translation:
  language: id
  text: Ketika Yesus masuk ke sebuah rumah setelah meninggalkan orang banyak, murid-murid-Nya bertanya kepada-Nya tentang perumpamaan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "perkataan itu" atau "kiasan itu". Kata Yunaninya adalah παραβολή (parabolē).
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Ketika
  rationale: Dalam bahasa Indonesia, penghubung naratif Καὶ dapat dilebur secara wajar ke dalam anak kalimat temporal yang diawali ὅτε tanpa kehilangan urutan peristiwa.
- source_word: ὅτε
  choice: ketika
  rationale: Menandai keadaan waktu saat para murid bertanya kepada Yesus.
- source_word: εἰσῆλθεν εἰς οἶκον
  choice: Yesus masuk ke sebuah rumah
  rationale: Subjek tersirat dijelaskan sebagai Yesus agar alami dan jelas dalam bahasa Indonesia; οἶκον tidak memakai artikel, sehingga 'sebuah rumah' tepat tanpa memaksakan rumah tertentu.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: menjauh dari orang banyak
  rationale: Mengungkapkan pemisahan dari kerumunan dalam suasana setelah masuk ke rumah, dengan bahasa Indonesia yang alami.
- source_word: ἐπηρώτων
  choice: bertanya
  rationale: Bentuk imperfek dapat menggambarkan tindakan yang sedang berlangsung, tetapi bentuk naratif sederhana ini paling alami dalam bahasa Indonesia dan tidak menutup nuansa tersebut.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: murid-murid-Nya
  rationale: Menyampaikan bentuk jamak dan hubungan kepunyaan secara ringkas serta wajar.
- source_word: τὴν παραβολήν
  choice: perumpamaan itu
  rationale: Mempertahankan kategori παραβολή yang dipakai Markus, meskipun ucapan sebelumnya juga dapat dipahami secara lebih luas sebagai perkataan kiasan.
theological_decisions:
- issue: Makna παραβολή dalam konteks perkataan singkat yang bersifat kiasan
  choice: perumpamaan itu
  alternative: perkataan itu; kiasan itu
  rationale: Pilihan ini mengikuti istilah Yunani secara langsung dan mempertahankan cara Markus menggolongkan pengajaran Yesus tanpa mempersempit maknanya melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama 'Yesus' dipakai untuk memperjelas subjek tersirat. Penempatan frasa 'menjauh dari orang banyak' dipertahankan dekat dengan tindakan masuk ke rumah, dan penanda catatan kaki dicantumkan sesudah istilah yang dijelaskan.
