revisions:
- from: Namun, ia berkata kepada mereka, “Tepatlah nubuat Yesaya tentang kalian, orang-orang munafik, seperti ada tertulis, ‘Bangsa ini menghormati Aku dengan bibir mereka, tetapi hati mereka jauh dari-Ku.’”
  to: 'Namun, ia berkata kepada mereka, “Yesaya telah bernubuat dengan tepat tentang kalian, orang-orang munafik, seperti yang tertulis: ‘Bangsa ini menghormati Aku dengan bibir mereka, tetapi hati mereka jauh dari-Ku.’”'
  rationale: The revision restores the verbal force of καλῶς ἐπροφήτευσεν through "Yesaya telah bernubuat dengan tepat" and uses a standard Indonesian formula to introduce the quotation. It otherwise retains the draft's faithful direct address, collective singular "hati," and established reverential capitalization.
  reviewer_model: gpt-5.6-terra
