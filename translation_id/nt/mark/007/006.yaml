  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν ⸀αὐτοῖς· Καλῶς ἐπροφήτευσεν Ἠσαΐας περὶ ὑμῶν τῶν ὑποκριτῶν, ὡς γέγραπται ⸀ὅτι Οὗτος ὁ λαὸς τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/006.yaml
  text: 'But he said to them[a], “Isaiah prophesied well about you hypocrites, as it is written: ‘This people honors me with their lips, but their heart is far from me.’”'
translation:
  language: id
  text: 'Namun, ia berkata kepada mereka, “Yesaya telah bernubuat dengan tepat tentang kalian, orang-orang munafik, seperti yang tertulis: ‘Bangsa ini menghormati Aku dengan bibir mereka, tetapi hati mereka jauh dari-Ku.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang bernuansa pertentangan dalam jawaban Yesus; alami dalam bahasa Indonesia dan tidak sekeras 'akan tetapi'.
- source_word: εἶπεν αὐτοῖς
  choice: ia berkata kepada mereka
  rationale: Padanan naratif langsung yang mempertahankan verba berkata dan objek tak langsung Yunani.
- source_word: Καλῶς ἐπροφήτευσεν
  choice: Tepatlah nubuat
  rationale: Mengungkapkan bahwa nubuat Yesaya tepat mengenai para pendengar, sambil mempertahankan nilai evaluatif καλῶς tanpa menentukan apakah tekanannya terutama moral atau faktual.
- source_word: περὶ ὑμῶν τῶν ὑποκριτῶν
  choice: tentang kalian, orang-orang munafik
  rationale: Mempertahankan penerapan langsung kepada para pendengar dan fungsi aposisional τῶν ὑποκριτῶν; 'kalian' jelas jamak dan wajar dalam bahasa Indonesia modern.
- source_word: ὡς γέγραπται ὅτι
  choice: seperti ada tertulis
  rationale: Rumus pengantar kutipan Kitab Suci yang alami dan cukup formal; tanda koma memperkenalkan kutipan langsung.
- source_word: Οὗτος ὁ λαὸς
  choice: Bangsa ini
  rationale: λαός menunjuk suatu umat atau bangsa sebagai kelompok; bentuk tunggal dan nada kenabian tetap terpelihara.
- source_word: τοῖς χείλεσίν με τιμᾷ
  choice: menghormati Aku dengan bibir mereka
  rationale: Mempertahankan citra bibir dan arti τιμάω sebagai 'menghormati'; pronomina jamak merujuk secara alami kepada anggota-anggota bangsa itu.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: tetapi hati mereka
  rationale: Menjaga 'hati' tetap tunggal sebagaimana teks Yunani, dengan 'mereka' sebagai rujukan kolektif yang alami.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: jauh dari-Ku
  rationale: Padanan idiomatis yang dapat mencakup jarak relasional dan rohani tanpa menambahkan tafsiran eksplisit.
theological_decisions:
- issue: Penerapan nubuat Yesaya 29:13 kepada para penentang Yesus
  choice: Mempertahankan teguran langsung 'tentang kalian, orang-orang munafik' dan kutipan 'Bangsa ini'.
  alternative: Menggeneralisasi atau memperhalus teguran sehingga tidak lagi diarahkan langsung kepada para pendengar.
  rationale: Teks secara eksplisit menerapkan nubuat Yesaya kepada lawan bicara Yesus; daya tegurnya perlu dipertahankan tanpa tambahan doktrinal.
- issue: Kesatuan kolektif dalam frasa 'hati mereka'
  choice: Mempertahankan nomina tunggal 'hati' dengan pronomina jamak 'mereka'.
  alternative: Menggunakan 'hati masing-masing' atau bentuk jamak konseptual yang menekankan individu.
  rationale: Bentuk Yunani menyajikan hati secara tunggal dan kolektif; terjemahan ini mempertahankan ketegangan itu dalam ungkapan Indonesia yang alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' dipakai sesuai gaya naratif formal; 'kalian' menandai orang kedua jamak secara jelas. Kapitalisasi Aku/-Ku mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan ilahi. Tidak diperlukan catatan kaki karena konstruksi kolektif 'Bangsa ini ... bibir mereka ... hati mereka' tetap jelas dan alami dalam bahasa Indonesia.
