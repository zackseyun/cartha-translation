id: MRK.7.2
reference: Mark 7:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδόντες τινὰς τῶν μαθητῶν αὐτοῦ ⸂ὅτι κοιναῖς χερσίν, τοῦτ’ ἔστιν ἀνίπτοις, ἐσθίουσιν⸃ ⸀τοὺς ⸀ἄρτους—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/002.yaml
  text: and they saw that some of his disciples were eating the bread with defiled hands—that is[a], unwashed hands—
translation:
  language: id
  text: dan mereka melihat bahwa beberapa murid-Nya makan roti dengan tangan najis[a]—artinya, tangan yang tidak dibasuh—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan tangan biasa”; maksudnya, tangan yang dipandang najis atau tidak tahir secara ritual, bukan sekadar kotor secara fisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: mereka melihat
  rationale: Partisip aoris ini merujuk kepada orang-orang Farisi dan beberapa ahli Taurat pada ayat sebelumnya. Bentuk verba finit alami dalam bahasa Indonesia dan mempertahankan tindakan pengamatan.
- source_word: τινὰς τῶν μαθητῶν αὐτοῦ
  choice: beberapa murid-Nya
  rationale: τινάς dengan genitif partitif berarti sebagian dari para murid Yesus.
- source_word: ὅτι
  choice: bahwa
  rationale: Di sini ὅτι memperkenalkan isi dari apa yang mereka lihat, bukan alasan.
- source_word: κοιναῖς χερσίν
  choice: dengan tangan najis
  rationale: Dalam konteks kemurnian Yahudi, κοινός berarti tidak tahir secara ritual, bukan sekadar kotor secara fisik. 'Tangan najis' menyampaikan makna kontekstual itu secara wajar; arti harfiahnya dicatat dalam catatan kaki.
- source_word: τοῦτ’ ἔστιν ἀνίπτοις
  choice: artinya, tangan yang tidak dibasuh
  rationale: Ungkapan penjelas Markus menerangkan idiom sebelumnya. 'Tidak dibasuh' mempertahankan arti langsung ἀνίπτοις tanpa menyiratkan bahwa persoalannya hanya kebersihan biasa.
- source_word: ἐσθίουσιν
  choice: makan
  rationale: Bentuk kini historis menyatakan tindakan yang sedang diamati; bahasa Indonesia tidak wajib menandai aspek progresif secara eksplisit.
- source_word: τοὺς ἄρτους
  choice: roti
  rationale: Walaupun bentuk Yunaninya jamak dan berartikel, 'roti' merupakan ungkapan idiomatis bahasa Indonesia untuk makanan tersebut; 'roti-roti' atau 'roti itu' akan terlalu spesifik.
theological_decisions:
- issue: Nuansa kemurnian ritual dalam κοινός
  choice: Teks utama memakai 'najis', disertai catatan bahwa bahasa Yunani secara harfiah berbunyi 'tangan biasa'.
  alternative: tangan biasa; tangan tidak tahir
  rationale: '''Najis'' secara alami menandai status ritual dalam bahasa Indonesia dan menghindari kesan keliru bahwa ''biasa'' hanya berarti umum. Catatan kaki mempertahankan bentuk leksikal harfiahnya serta membedakannya dari kotor secara fisik.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Tanda pisah pada akhir ayat dipertahankan karena kalimat berlanjut ke ayat berikutnya; kapitalisasi pronomina 'Nya' mengikuti kebiasaan umum teks Alkitab Indonesia.
