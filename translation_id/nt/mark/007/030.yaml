  text: καὶ ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς εὗρεν τὸ ⸂παιδίον βεβλημένον ἐπὶ τὴν κλίνην καὶ τὸ δαιμόνιον ἐξεληλυθός⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/030.yaml
  text: And when she went away to her house, she found the child lying on the bed[a], and the demon gone.
translation:
  language: id
  text: Ketika perempuan itu pulang ke rumahnya, ia mendapati anak itu terbaring di tempat tidur, dan setan itu sudah keluar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “setan itu telah keluar.”'
    reason: Menunjukkan bentuk partisip perfekt Yunani yang menggambarkan tindakan keluar yang telah selesai dan keadaan yang dihasilkannya.
lexical_decisions:
- source_word: ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς
  choice: ketika perempuan itu pulang ke rumahnya
  rationale: Partisip aoris menunjukkan tindakan yang mendahului kata kerja utama. Ungkapan ini menyampaikan urutan waktu secara alami dalam bahasa Indonesia, sementara 'pulang ke rumahnya' sesuai dengan gerak menuju kediamannya.
- source_word: εὗρεν
  choice: ia mendapati
  rationale: '''Mendapati'' alami dalam narasi dan menyatakan bahwa perempuan itu menemukan keadaan yang sudah berlangsung ketika ia tiba.'
- source_word: παιδίον
  choice: anak itu
  rationale: παιδίον berarti 'anak'. Bentuk netral ini dipertahankan tanpa mengubahnya menjadi 'anak perempuan', meskipun konteks sebelumnya menjelaskan bahwa anak tersebut adalah putrinya.
- source_word: βεβλημένον ἐπὶ τὴν κλίνην
  choice: terbaring di tempat tidur
  rationale: Partisip perfekt pasif menggambarkan keadaan anak di atas tempat tidur. 'Terbaring' menyampaikan keadaan hasil secara alami tanpa menyiratkan bahwa anak itu dilempar dengan keras.
- source_word: δαιμόνιον
  choice: setan itu
  rationale: δαιμόνιον secara langsung menunjuk pada setan; kata tunjuk 'itu' menandai referen yang telah dikenal dari konteks.
- source_word: ἐξεληλυθός
  choice: sudah keluar
  rationale: 'Partisip perfekt aktif menekankan tindakan keluar yang telah selesai beserta hasilnya: setan itu tidak lagi merasuki anak tersebut. ''Sudah keluar'' mempertahankan gagasan gerak keluar dan keadaan hasil.'
theological_decisions:
- issue: Hasil pengusiran setan
  choice: setan itu sudah keluar
  alternative: setan itu sudah pergi
  rationale: Pilihan ini mempertahankan gambaran eksplisit ἐξέρχομαι, yaitu keluar, sekaligus menyatakan bahwa keluarnya setan itu telah selesai. Terjemahan tidak menambahkan penjelasan tentang cara pengusiran itu terjadi.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Subjek 'perempuan itu' dibuat eksplisit untuk memperjelas rujukan, sedangkan susunan temporal mempertahankan hubungan partisip dengan kata kerja utama.
