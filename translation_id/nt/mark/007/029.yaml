  - severity: low
    issue: “Karena perkataanmu itu” menambahkan posesif “-mu.”
    rationale: τοῦτον (“ini”) menerangkan λόγον dan tidak memuat posesif. Konteks memang menunjukkan bahwa perkataan itu adalah jawaban perempuan tersebut, tetapi tambahan itu tidak diperlukan dalam teks utama. Bentuk “Karena perkataan ini” lebih dekat pada sumber dan tetap alami.
  revised_text: Lalu Yesus berkata kepadanya, “Karena perkataan ini, pergilah; setan itu sudah keluar dari anak perempuanmu.”[a]
