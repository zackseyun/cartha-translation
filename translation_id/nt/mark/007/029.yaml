  source_fidelity: 'Terjemahan umumnya setia: Διὰ τοῦτον τὸν λόγον dinyatakan sebagai alasan, ὕπαγε sebagai perintah, dan perfektum ἐξελήλυθεν sebagai tindakan yang telah terjadi. Namun, τὸ δαιμόνιον lebih tepat diterjemahkan “setan itu” atau “demon itu”; “roh jahat” merupakan padanan yang lebih luas dan kurang langsung secara leksikal. Selain itu, τοῦτον bersifat demonstratif (“ini”), sedangkan “perkataanmu itu” menambahkan posesif yang tidak tertulis, walaupun rujukannya jelas dari konteks. Terjemahan revisi mempertahankan demonstratif tanpa tambahan tersebut.'
  naturalness: “Lalu Yesus berkata kepadanya” dan “pergilah” alami dalam bahasa Indonesia baku. “Karena perkataan ini” juga jelas dan wajar dalam dialog ini. “Setan itu sudah keluar dari anak perempuanmu” adalah ungkapan yang lazim dan idiomatis dalam konteks ini.
  terminology: Untuk δαιμόνιον, “setan” adalah padanan Alkitab Indonesia yang lazim dan lebih spesifik daripada “roh jahat,” tanpa mengimpor istilah πνεῦμα ἀκάθαρτον (“roh najis”) dari konteks dekat. “Anak perempuanmu” mempertahankan cakupan literal θυγάτηρ dan sesuai register modern.
