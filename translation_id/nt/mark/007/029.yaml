  text: καὶ εἶπεν αὐτῇ· Διὰ τοῦτον τὸν λόγον ὕπαγε, ἐξελήλυθεν ⸂ἐκ τῆς θυγατρός σου τὸ δαιμόνιον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/029.yaml
  text: And he said to her[a], “Because of this word, go; the demon has gone out of your daughter.”
translation:
  language: id
  text: Lalu Yesus berkata kepadanya, “Karena perkataan ini, pergilah; setan itu sudah keluar dari anak perempuanmu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Atas perkataan ini, pergilah; setan itu sudah keluar dari anak perempuanmu.”
    reason: 'Alternatif untuk Διὰ τοῦτον τὸν λόγον: διά dengan akusatif dapat menyatakan alasan (“karena”) atau dasar/landasan tindakan (“atas”).'
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῇ
  choice: Lalu Yesus berkata kepadanya
  rationale: καί melanjutkan alur narasi dan secara alami dapat diterjemahkan “Lalu”. Subjek tersirat diperjelas sebagai “Yesus” agar wajar dalam bahasa Indonesia tanpa mengubah rujukannya.
- source_word: Διὰ τοῦτον τὸν λόγον
  choice: Karena perkataanmu itu
  rationale: διά dengan akusatif menyatakan alasan, sedangkan λόγος menunjuk pada jawaban perempuan itu sebelumnya. Unsur “-mu” memperjelas hubungan yang sudah nyata dalam konteks; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ὕπαγε
  choice: pergilah
  rationale: Imperatif kini ὕπαγε berfungsi sebagai pelepasan atau suruhan untuk pergi. “Pergilah” ringkas, alami, dan mempertahankan bentuk perintah.
- source_word: ἐξελήλυθεν
  choice: sudah keluar
  rationale: Bentuk perfektum menyatakan tindakan yang telah selesai dengan hasil yang tetap berlaku. “Sudah keluar” menyampaikan keadaan kini sebagai hasil keluarnya roh itu.
- source_word: ἐκ τῆς θυγατρός σου
  choice: dari anak perempuanmu
  rationale: ἐκ menandai orang yang ditinggalkan roh tersebut. “Dari anak perempuanmu” mempertahankan gambaran keluarnya roh sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: τὸ δαιμόνιον
  choice: roh jahat itu
  rationale: δαιμόνιον menunjuk pada makhluk roh jahat. “Roh jahat” merupakan padanan Indonesia yang alami dan jelas dalam konteks pengusiran roh, sedangkan “itu” mencerminkan bentuk definit.
theological_decisions:
- issue: Bahasa pengusiran roh tanpa melunakkan klaim supernatural
  choice: roh jahat itu sudah keluar dari anak perempuanmu
  alternative: setan itu sudah keluar dari anak perempuanmu
  rationale: Teks Yunani secara eksplisit menyebut δαιμόνιον dan menyatakan bahwa roh itu telah keluar. Terjemahan mempertahankan rujukan personal dan supernatural, bukan menafsirkannya sebagai penyakit atau pengaruh jahat yang samar.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. “Anak perempuanmu” dipilih daripada “putrimu” untuk keterbacaan umum dan kedekatan dengan θυγάτηρ. Penanda catatan kaki ditempatkan sesudah seluruh kutipan karena menjelaskan frasa di dalam ucapan Yesus.
