  text: Jika seseorang mempunyai telinga untuk mendengar, hendaklah ia mendengar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini tidak terdapat dalam naskah-naskah Yunani tertua, termasuk Kodeks Sinaitikus dan Kodeks Vatikanus dari abad ke-4, ataupun dalam versi-versi Koptik awal. Namun, ayat ini terdapat dalam tradisi mayoritas Bizantium, tradisi Latin, dan sebagian besar saksi berbahasa Suryani. Kemungkinan besar ayat ini merupakan tambahan penyalin pada masa kemudian yang menggemakan ungkapan identik dalam Markus 4:9 dan 4:23.
    reason: textual_critical
