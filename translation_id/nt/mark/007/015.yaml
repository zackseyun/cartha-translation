  text: οὐδέν ἐστιν ἔξωθεν τοῦ ἀνθρώπου εἰσπορευόμενον εἰς αὐτὸν ὃ δύναται ⸂κοινῶσαι αὐτόν⸃· ἀλλὰ τὰ ⸂ἐκ τοῦ ἀνθρώπου ἐκπορευόμενά⸃ ἐστιν τὰ κοινοῦντα τὸν ⸀ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/015.yaml
  text: There is nothing outside a man that by going into him is able to defile him; rather, the things that come out from the man are what defile the man.
translation:
  language: id
  text: Tidak ada sesuatu pun dari luar seseorang yang masuk ke dalam dirinya yang dapat menajiskannya.[a] Sebaliknya, hal-hal yang keluar dari dalam diri seseorang itulah yang menajiskannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuatnya najis.” Kata Yunani yang dipakai dapat menunjuk pada menjadikan seseorang najis dalam pengertian kemurnian; “menajiskan” juga dapat mencakup makna moral yang lebih luas dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέν
  choice: tidak ada sesuatu pun
  rationale: Menyampaikan penyangkalan mutlak dari bentuk netral tunggal secara alami dan tegas dalam bahasa Indonesia.
- source_word: ἔξωθεν τοῦ ἀνθρώπου
  choice: dari luar seseorang
  rationale: Mempertahankan gagasan sumber eksternal dan kontras dengan hal-hal yang keluar dari dalam diri orang itu.
- source_word: εἰσπορευόμενον εἰς αὐτόν
  choice: yang masuk ke dalam dirinya
  rationale: Menerjemahkan partisip yang menerangkan sesuatu dari luar dengan konstruksi relatif yang wajar dalam bahasa Indonesia.
- source_word: δύναται
  choice: dapat
  rationale: Padanan alami untuk kemampuan atau kemungkinan yang dinyatakan verba Yunani.
- source_word: κοινῶσαι / κοινοῦντα
  choice: menajiskan / menajiskan
  rationale: Dalam konteks perselisihan tentang kenajisan, 'menajiskan' mencakup nuansa ketidakmurnian ritual sekaligus daya moral yang lebih luas.
- source_word: ἀλλὰ
  choice: Sebaliknya
  rationale: Menandai kontras korektif yang kuat antara apa yang masuk dan apa yang keluar.
- source_word: τὰ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενα
  choice: hal-hal yang keluar dari dalam diri seseorang
  rationale: Mempertahankan bentuk jamak substantival serta kontras sumber dengan 'dari luar seseorang'.
- source_word: τοῦ ἀνθρώπου / τὸν ἄνθρωπον
  choice: seseorang / dirinya
  rationale: ἄνθρωπος bersifat generik di sini; 'seseorang' merupakan bentuk tunggal yang alami dan inklusif dalam bahasa Indonesia, sedangkan 'dirinya' menjaga rujukan kepada orang yang sama.
theological_decisions:
- issue: Makna κοινόω dalam perdebatan tentang kemurnian
  choice: menajiskan
  alternative: membuat najis
  rationale: '''Menajiskan'' merupakan istilah Indonesia yang ringkas dan lazim, serta tidak membatasi maknanya hanya pada kenajisan seremonial.'
- issue: Pemakaian generik ἄνθρωπος
  choice: seseorang
  alternative: manusia
  rationale: Konteks memakai bentuk tunggal secara representatif, bukan khusus laki-laki. 'Seseorang' mempertahankan ketunggalan dan terdengar alami tanpa mempersempit cakupan.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Susunan dua klausa mempertahankan kontras retoris antara yang berasal dari luar dan yang keluar dari dalam diri seseorang.
