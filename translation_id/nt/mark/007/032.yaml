  text: καὶ φέρουσιν αὐτῷ κωφὸν ⸀καὶ ⸀μογιλάλον, καὶ παρακαλοῦσιν αὐτὸν ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/032.yaml
  text: And they brought to him a man who was deaf and had difficulty speaking[a], and they begged him to lay his hand on him.
translation:
  language: id
  text: Lalu orang-orang membawa kepada Yesus seorang yang tuli dan mengalami kesulitan berbicara,[a] dan mereka memohon kepada-Nya supaya Ia meletakkan tangan-Nya pada orang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “seorang yang tuli dan yang berbicara dengan kesulitan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: membawa
  rationale: Bentuk kini historis lazim dalam narasi Markus; bahasa Indonesia secara alami dapat memakai bentuk verba tanpa penandaan kala, sementara «lalu» menjaga urutan peristiwa.
- source_word: αὐτῷ
  choice: kepada Yesus
  rationale: Pronomina datif menunjuk kepada Yesus. Nama disebut secara eksplisit agar rujukan jelas dan alami dalam bahasa Indonesia.
- source_word: κωφόν
  choice: seorang yang tuli
  rationale: κωφός di sini paling tepat menunjuk pada ketulian, sebab μογιλάλον secara terpisah menerangkan gangguan bicaranya.
- source_word: μογιλάλον
  choice: sulit berbicara
  rationale: Kata langka ini berarti berbicara dengan susah atau mengalami hambatan bicara, bukan sama sekali tidak dapat berbicara.
- source_word: παρακαλοῦσιν
  choice: memohon
  rationale: Dalam konteks penyembuhan, kata ini menyatakan permintaan yang sungguh-sungguh; «memohon» lebih kuat daripada sekadar «meminta» dan tetap wajar.
- source_word: ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα
  choice: supaya Ia meletakkan tangan-Nya pada orang itu
  rationale: Klausa ini menyatakan isi atau tujuan permohonan. Bentuk tunggal «tangan-Nya» mengikuti τὴν χεῖρα dan mempertahankan gambaran tindakan penyembuhan.
theological_decisions:
- issue: Sifat keterbatasan orang itu
  choice: Ia tuli dan sulit berbicara, bukan sama sekali bisu.
  alternative: Ia tuli dan bisu.
  rationale: Dua kata sifat yang terpisah, κωφός dan μογιλάλος, menunjukkan ketulian disertai kesulitan berbicara. Terjemahan «bisu» akan melebihkan makna μογιλάλος dan menghapus pembedaan dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. «Orang-orang» mengungkapkan subjek jamak yang tersirat dalam verba Yunani. Pengulangan «orang itu» dipilih untuk menghindari rangkaian pronomina yang berpotensi kabur.
