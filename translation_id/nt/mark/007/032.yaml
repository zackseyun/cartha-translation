  terminology: «Tuli», «memohon», dan «meletakkan tangan-Nya» sesuai dengan register Alkitab Indonesia modern serta tidak menambahkan penafsiran teologis. Kapitalisasi pronomina ilahi dipertahankan sesuai kebiasaan register tersebut.
