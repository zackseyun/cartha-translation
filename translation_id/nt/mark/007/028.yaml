base_translation:
  language: en
  yaml_path: translation/nt/mark/007/028.yaml
  text: But she answered and said to him[a], “Lord[b], even the little dogs under the table eat from the children's crumbs.”
translation:
  language: id
  text: Namun perempuan itu menjawab dan berkata kepada-Nya, “Tuhan,[a] bahkan anjing-anjing kecil[b] di bawah meja pun makan dari remah-remah milik anak-anak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuan.” Kata Yunani κύριε dapat dipakai sebagai sapaan hormat maupun sebagai gelar “Tuhan.”
    reason: alternative_reading
  - marker: b
    text: Istilah Yunani ini menunjuk pada anjing kecil atau anjing rumah; “anjing-anjing kecil” mempertahankan nuansa diminutifnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ λέγει
  choice: menjawab dan berkata
  rationale: Mempertahankan dua verba Yunani dan mengungkapkan present historis λέγει secara wajar dalam narasi bahasa Indonesia.
- source_word: Κύριε
  choice: Tuhan
  rationale: Padanan utama bagi sapaan κύριε kepada Yesus, sambil mencatat bahwa bentuk ini juga dapat menjadi sapaan hormat.
- source_word: καὶ
  choice: bahkan ... pun
  rationale: 'Konstruksi ini menyampaikan daya aditif atau konsesif: anjing-anjing kecil juga mendapat bagian.'
- source_word: κυνάρια
  choice: anjing-anjing kecil
  rationale: Menjaga nuansa bentuk diminutif dan gambaran anjing kecil atau anjing rumah tanpa mempersempitnya menjadi anak anjing.
- source_word: ὑποκάτω τῆς τραπέζης
  choice: di bawah meja
  rationale: Padanan spasial yang langsung dan alami.
- source_word: ἐσθίουσιν
  choice: makan
  rationale: Kala kini menyatakan kebiasaan umum dalam perumpamaan ini.
- source_word: ἀπὸ τῶν ψιχίων
  choice: remah-remah makanan
  rationale: Mengungkapkan ψιχίων sebagai serpihan kecil makanan dan menjadikan frasa genitif berikutnya alami dalam bahasa Indonesia.
- source_word: τῶν παιδίων
  choice: anak-anak
  rationale: Menjaga rujukan kepada anak-anak tanpa menambahkan gagasan yang tidak dinyatakan.
theological_decisions:
- issue: Makna κύριε dalam sapaan perempuan itu kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: “Tuhan” mempertahankan gelar yang lazim bagi Yesus, tetapi catatan kaki menjaga kemungkinan bahwa dalam konteks ini kata Yunani tersebut berfungsi sebagai sapaan hormat “Tuan”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Pengulangan “menjawab dan berkata” dipertahankan demi kedekatan dengan bentuk Yunani; pasangan “bahkan ... pun” menyampaikan penekanan καί secara alami.
