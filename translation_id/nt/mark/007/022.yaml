source:
  edition: SBLGNT
  text: μοιχεῖαι⸃, πλεονεξίαι, πονηρίαι, δόλος, ἀσέλγεια, ὀφθαλμὸς πονηρός, βλασφημία, ὑπερηφανία, ἀφροσύνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/022.yaml
  text: adulteries[a], greed, wickedness, deceit, sensuality, an evil eye, slander, pride[b], foolishness.
translation:
  language: id
  text: perzinaan, ketamakan, berbagai kejahatan, tipu daya, perilaku tak tahu malu, mata yang jahat[a], fitnah[b], kesombongan, dan kebodohan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “iri hati”, “pandangan dengki”, atau “sikap kikir”; secara harfiah, “mata yang jahat”, suatu ungkapan untuk pandangan yang iri, dengki, atau enggan bermurah hati.
    reason: lexical_alternative
  - marker: b
    text: Atau “hujatan”. Kata Yunani ini dapat berarti perkataan yang memfitnah orang lain ataupun perkataan yang menghina Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχεῖαι
  choice: perzinaan
  rationale: Bentuk Yunani adalah jamak dan menunjuk pada tindakan-tindakan zina. Dalam bahasa Indonesia, nomina kolektif “perzinaan” lebih alami daripada bentuk ulang, tanpa menghilangkan cakupan tindakan yang berulang atau beragam.
- source_word: πλεονεξίαι
  choice: ketamakan
  rationale: Istilah ini menyatakan hasrat serakah untuk memperoleh lebih banyak, sering dengan unsur material atau eksploitatif. “Ketamakan” jelas dan wajar dalam daftar keburukan.
- source_word: πονηρίαι
  choice: berbagai kejahatan
  rationale: Kata Yunani berbentuk jamak. “Berbagai kejahatan” mempertahankan gagasan kemajemukan dengan bahasa Indonesia yang lebih alami daripada “kejahatan-kejahatan”.
- source_word: δόλος
  choice: tipu daya
  rationale: Pilihan ini menyampaikan penipuan yang disengaja dan lebih alami dalam bahasa Indonesia modern daripada istilah yang lebih sastra seperti “kelicikan” dalam konteks ini.
- source_word: ἀσέλγεια
  choice: perilaku tak tahu malu
  rationale: Kata ini menunjuk pada perilaku tanpa kendali dan tanpa rasa malu, kerap tetapi tidak selalu bersifat seksual. Terjemahan ini menjaga cakupannya agar tidak dipersempit hanya menjadi hawa nafsu seksual.
- source_word: ὀφθαλμὸς πονηρός
  choice: mata yang jahat
  rationale: Metafora harfiah dipertahankan karena merupakan ungkapan idiomatis yang dapat mencakup iri hati, kedengkian, atau sikap enggan bermurah hati; maknanya dijelaskan dalam catatan kaki.
- source_word: βλασφημία
  choice: fitnah
  rationale: Dalam daftar keburukan ini, kata tersebut dapat menunjuk pada perkataan yang merusak nama orang lain. Namun, karena juga dapat berarti hujatan terhadap Allah, kemungkinan itu dipertahankan dalam catatan kaki.
- source_word: ὑπερηφανία
  choice: kesombongan
  rationale: Istilah ini menyatakan sikap meninggikan diri atau keangkuhan. “Kesombongan” ringkas, alami, dan tepat dalam daftar keburukan.
- source_word: ἀφροσύνη
  choice: kebodohan
  rationale: Yang dimaksud ialah ketiadaan pengertian secara moral dan praktis, bukan sekadar rendahnya kecerdasan. Dalam konteks daftar sifat buruk, “kebodohan” membawa bobot moral tersebut.
theological_decisions:
- issue: Cakupan makna βλασφημία dalam daftar keburukan
  choice: fitnah
  alternative: hujatan
  rationale: Konteks memungkinkan dosa perkataan terhadap sesama, tetapi kata Yunani juga dapat menunjuk pada perkataan yang menghina Allah. Teks utama memilih padanan interpersonal yang alami, sedangkan catatan kaki mempertahankan kemungkinan teologis lainnya tanpa menutup ambiguitas.
- issue: Makna idiom ὀφθαλμὸς πονηρός
  choice: mata yang jahat
  alternative: iri hati; pandangan dengki; sikap kikir
  rationale: Metafora sumber dipertahankan agar hubungan dengan idiom Alkitab tetap terlihat, sementara catatan menjelaskan beberapa nuansa yang mungkin terkandung di dalamnya tanpa memaksakan satu arti saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar dipertahankan, dengan bentuk kolektif yang alami dalam bahasa Indonesia. Istilah yang berpotensi terlalu sempit secara seksual dihindari untuk ἀσέλγεια, dan dua ambiguitas penting dijaga melalui catatan kaki.
