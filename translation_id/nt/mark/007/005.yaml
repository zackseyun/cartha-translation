id: MRK.7.5
reference: Mark 7:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀καὶ ἐπερωτῶσιν αὐτὸν οἱ Φαρισαῖοι καὶ οἱ γραμματεῖς· Διὰ τί ⸂οὐ περιπατοῦσιν οἱ μαθηταί σου⸃ κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων, ἀλλὰ ⸀κοιναῖς χερσὶν ἐσθίουσιν τὸν ἄρτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/005.yaml
  text: And the Pharisees and the scribes asked him[a], “Why do your disciples not walk according to the tradition of the elders, but eat bread with unclean hands?”
translation:
  language: id
  text: Lalu orang-orang Farisi dan ahli-ahli Taurat bertanya kepada Yesus, “Mengapa murid-murid-Mu tidak hidup menurut tradisi para tua-tua, tetapi makan roti dengan tangan yang najis[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tangan biasa”; maksudnya, tangan yang dianggap najis secara ritual.
    reason: Menjelaskan arti kontekstual κοινός sekaligus mempertahankan arti harfiahnya yang tidak dapat dibawa secara alami ke dalam teks utama.
lexical_decisions:
- source_word: ἐπερωτῶσιν
  choice: bertanya
  rationale: Bentuk kini berfungsi sebagai kala kini historis dalam narasi; “bertanya” menyampaikan tindakan tutur secara alami tanpa melebihkan aspek.
- source_word: γραμματεῖς
  choice: ahli-ahli Taurat
  rationale: Dalam konteks Injil, istilah ini menunjuk golongan pakar dan penafsir hukum Taurat; padanan ini lebih jelas bagi pembaca Indonesia modern daripada “juru tulis”.
- source_word: Διὰ τί
  choice: Mengapa
  rationale: Padanan interogatif yang alami dan langsung.
- source_word: περιπατοῦσιν
  choice: hidup
  rationale: Secara harfiah berarti “berjalan”, tetapi di sini merupakan idiom bagi cara hidup atau perilaku. “Hidup” menyampaikan maksud idiom itu secara alami dalam bahasa Indonesia.
- source_word: κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων
  choice: menurut tradisi para tua-tua
  rationale: “Menurut” menyatakan kesesuaian dengan suatu patokan; “para tua-tua” mempertahankan rujukan kepada otoritas terdahulu tanpa mengubahnya menjadi “nenek moyang” atau pejabat gerejawi.
- source_word: κοιναῖς χερσὶν
  choice: dengan tangan yang najis
  rationale: κοινός secara harfiah berarti “biasa/umum”, tetapi dalam konteks ini menunjuk keadaan tidak suci secara ritual, bukan tangan yang sekadar kotor. “Najis” mempertahankan nuansa kemurnian ritual.
- source_word: ἄρτον
  choice: roti
  rationale: Padanan langsung bagi bentuk tunggal ἄρτον; meskipun dapat mewakili makanan secara umum, “roti” mempertahankan citra konkret teks sumber.
theological_decisions:
- issue: Status ritual yang dinyatakan oleh κοινός
  choice: tangan yang najis
  alternative: tangan biasa; tangan yang tidak suci; tangan kotor
  rationale: Persoalannya adalah kemurnian ritual menurut tradisi Farisi, bukan kejahatan moral atau kebersihan jasmani. “Najis” menyampaikan daya religius istilah itu tanpa menarik kesimpulan doktrinal lebih lanjut.
- issue: Metafora περιπατέω untuk perilaku
  choice: hidup
  alternative: berjalan; berperilaku
  rationale: Bahasa Indonesia tidak lazim memakai “berjalan menurut tradisi” untuk cara hidup. “Hidup” mempertahankan maksud ungkapan tanpa menjadikan tuduhan itu lebih sempit daripada teks.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam naratif yang wajar dan khidmat. “Ahli-ahli Taurat” dipakai sebagai istilah Injil yang mapan; sapaan pronominal kepada Yesus ditulis dengan huruf kapital sesuai konvensi penerbitan Alkitab Indonesia. Nama “Yesus” dipakai menggantikan pronomina Yunani agar rujukan jelas dan alami dalam ayat yang berdiri sendiri.
