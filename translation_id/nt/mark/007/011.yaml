  verdict: revise
  source_fidelity: Secara umum setia pada teks Yunani. “Namun, kamu berkata” mencerminkan kontras δέ, “Jika seseorang berkata” menyampaikan kondisi ἐὰν + subjungtif aoris, dan “Korban—artinya, persembahan—” mempertahankan istilah Semitik beserta glosa Markus. Frasa terakhir sebaiknya menyatakan penerimaan/manfaat (ὠφεληθῇς), bukan sekadar memperoleh sesuatu.
  naturalness: Bahasa dan registernya modern serta wajar. Namun, tanda petik dalam draf memecah satu ujaran yang dikutip menjadi dua bagian secara tidak konsisten. Penataan ulang tanda petik dan penggunaan “kaumanfaatkan” membuat kalimat lebih jelas tanpa menyelesaikan konstruksi yang memang dilanjutkan dalam ayat 12.
  terminology: “Korban” tepat sebagai transliterasi istilah teknis, dan “persembahan” layak untuk δῶρον dalam konteks ini; alternatif “pemberian” patut dipertahankan dalam catatan kaki. Catatan budaya perlu dirumuskan secara hati-hati sebagai penjelasan penggunaan istilah, bukan sebagai definisi hukum yang terlalu mutlak.
