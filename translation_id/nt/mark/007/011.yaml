  text: ὑμεῖς δὲ λέγετε· Ἐὰν εἴπῃ ἄνθρωπος τῷ πατρὶ ἢ τῇ μητρί· Κορβᾶν, ὅ ἐστιν Δῶρον, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/011.yaml
  text: But you say[a], ‘If a man says to his father or his mother, “Corban” (that is, a gift)[b], whatever you might have benefited from me—’
translation:
  language: id
  text: Namun, kamu berkata, “Jika seseorang berkata kepada ayahnya atau ibunya, ‘Korban’—artinya, persembahan—, yaitu apa pun yang mungkin dapat kaumanfaatkan dariku,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Namun, kamu berkata
  rationale: δὲ menyatakan pertentangan dengan perintah Allah yang disebut sebelumnya. Bentuk kini λέγετε paling wajar diterjemahkan sebagai pernyataan umum, “kamu berkata”.
- source_word: Ἐὰν εἴπῃ ἄνθρωπος
  choice: Jika seseorang berkata
  rationale: ἐὰν dengan subjungtif aoris memperkenalkan keadaan bersyarat. ἄνθρωπος di sini bersifat representatif, sehingga “seseorang” menyampaikan maksudnya secara alami dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: kepada ayah atau ibunya
  rationale: Dativus menandai pihak yang diajak bicara. Susunan ini mempertahankan kedua hubungan keluarga yang disebutkan secara khusus.
- source_word: Κορβᾶν
  choice: Korban
  rationale: Teks Yunani mempertahankan istilah pinjaman Semitik ini dan kemudian menjelaskannya. Bentuk “Korban” mempertahankan kekhususan historisnya dan sekaligus mudah dikenali dalam bahasa Indonesia.
- source_word: ὅ ἐστιν Δῶρον
  choice: artinya, persembahan
  rationale: δῶρον dapat berarti “pemberian” atau “persembahan”. Dalam konteks sesuatu yang dikhususkan bagi Allah, “persembahan” menyampaikan nuansa religius dengan alami, sedangkan alternatif yang lebih umum dicatat dalam catatan kaki.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: apa pun yang dapat kauperoleh dariku
  rationale: Pronomina relatif dengan ἐὰν memberi arti tak tentu, “apa pun”. ὠφεληθῇς berarti menerima manfaat atau bantuan; “dapat kauperoleh dariku” menjaga cakupan makna itu tanpa membatasinya hanya pada uang. Konstruksi dibiarkan terbuka karena akibatnya dilanjutkan pada ayat 12.
theological_decisions:
- issue: Makna rumusan Korban dalam konteks pengkhususan harta dan tradisi manusia
  choice: Mempertahankan “Korban” dalam teks utama serta menyertakan penjelasan Markus, “artinya, persembahan”.
  alternative: Menerjemahkannya langsung sebagai “persembahan” atau “pemberian yang dikhususkan bagi Allah”.
  rationale: Teks Yunani sendiri mempertahankan istilah Semitik lalu memberinya glosa. Pilihan ini menjaga latar historis dan religius perkataan Yesus tanpa menambahkan rincian tentang mekanisme nazar yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan “kamu” sesuai dengan bentuk jamak ὑμεῖς dalam konteks teguran kepada kelompok, sedangkan “-nya” dan “kau-” dalam contoh langsung menjaga peralihan kepada orang ketiga tunggal dan sapaan kepada orang tua. Tanda pisah mengapit glosa Markus, dan akhir ayat sengaja tetap berupa konstruksi bersyarat yang dilanjutkan dalam ayat 12.
