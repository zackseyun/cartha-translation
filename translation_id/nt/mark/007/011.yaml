    issue: Struktur tanda petik tidak konsisten
    rationale: Draf menutup petikan setelah “Korban” lalu membuka lagi sebelum frasa berikutnya, padahal “Korban ... apa pun yang mungkin dapat kaumanfaatkan dariku” merupakan satu rumusan ujaran. Petikan bersarang diperlukan bila seluruh kalimat bersyarat diperlakukan sebagai ujaran yang dikutip.
  - severity: low
