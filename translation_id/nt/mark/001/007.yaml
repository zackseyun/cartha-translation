  text: καὶ ἐκήρυσσεν λέγων· Ἔρχεται ὁ ἰσχυρότερός μου ὀπίσω μου, οὗ οὐκ εἰμὶ ἱκανὸς κύψας λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/007.yaml
  text: And he was proclaiming[a], saying, “The one stronger than I is coming after me[c][b], of whom I am not worthy to stoop down and untie the strap of his sandals.”
translation:
  language: id
  text: Ia terus memberitakan, “Dia yang lebih kuat daripada aku akan datang sesudah aku. Aku tidak layak membungkuk dan melepaskan tali sandalnya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκήρυσσεν
  choice: terus memberitakan
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung atau berulang; ‘memberitakan’ mempertahankan nuansa pewartaan terbuka tanpa terdengar terlalu teknis.
- source_word: λέγων
  choice: katanya
  rationale: Partisip ini memperkenalkan isi pemberitaan dan diterjemahkan secara alami dalam bahasa Indonesia.
- source_word: Ἔρχεται
  choice: akan datang
  rationale: Present Yunani menyatakan kedatangan yang sudah dekat; dalam bahasa Indonesia, ‘akan datang’ paling alami untuk rujukan kepada sosok yang menyusul Yohanes.
- source_word: ὁ ἰσχυρότερός μου
  choice: Dia yang lebih kuat daripada aku
  rationale: Adjektiva komparatif berartikel berfungsi sebagai nomina. ‘Lebih kuat’ menyampaikan arti lugas ἰσχυρός tanpa meninggikan ragam secara berlebihan.
- source_word: ὀπίσω μου
  choice: sesudah aku
  rationale: Dalam konteks urutan kemunculan dan pelayanan, frasa ini terutama berarti datang sesudah Yohanes, walaupun bahasa Yunani juga dapat memiliki nuansa posisi di belakang.
- source_word: ἱκανὸς
  choice: layak
  rationale: Dalam ungkapan ini kata tersebut menyatakan ketidaklayakan Yohanes di hadapan sosok yang akan datang, bukan sekadar ketidakmampuan praktis.
- source_word: κύψας
  choice: membungkuk
  rationale: Menggambarkan tindakan merendahkan tubuh untuk mencapai sandal; koordinasi dengan verba berikut menghasilkan bahasa Indonesia yang wajar sambil menjaga tindakan penyertanya.
- source_word: λῦσαι
  choice: melepaskan
  rationale: Untuk tali sandal, ‘melepaskan’ merupakan padanan Indonesia yang alami bagi tindakan membuka atau menguraikan ikatannya.
- source_word: ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: tali sandal-Nya
  rationale: ‘Tali sandal’ jelas dan sesuai dengan jenis alas kaki dalam latar kuno; kapitalisasi pronomina mengikuti kebiasaan hormat yang lazim dalam penerbitan Alkitab Indonesia.
theological_decisions:
- issue: Kadar kerendahan hati dalam pernyataan Yohanes
  choice: Aku tidak layak ... melepaskan tali sandal-Nya
  alternative: Aku tidak sanggup/cukup pantas ... melepaskan tali sandal-Nya
  rationale: Konteks menekankan rendahnya kedudukan Yohanes dibandingkan dengan Dia yang akan datang. ‘Tidak layak’ menyampaikan kontras itu tanpa menambahkan identifikasi atau klaim doktrinal yang tidak dinyatakan langsung dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat dibagi menjadi dua agar kutipan mudah dipahami. ‘Aku’ dipakai dalam ujaran langsung sesuai register Alkitab Indonesia yang alami; rujukan kepada sosok yang akan datang dipertahankan tanpa menyebut identitas yang tidak eksplisit dalam ayat ini.
