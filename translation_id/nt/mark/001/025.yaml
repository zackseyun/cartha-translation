  naturalness: Perintah "Diam!" dan "Keluarlah dari orang ini!" jelas, tegas, dan alami dalam bahasa Indonesia modern. Mengganti "kata-Nya" dengan "sambil berkata" menghasilkan hubungan yang lebih alami dan lebih dekat dengan fungsi partisip λέγων.
  terminology: '"Yesus", "roh", "menegur ... dengan keras", dan "keluarlah" sesuai dengan register naratif serta makna leksikal ayat ini. Catatan "Terberanguslah" tidak alami sebagai bentuk imperatif bahasa Indonesia; alternatif harfiah yang lebih jelas perlu memakai gambaran "pasang berangus".'
