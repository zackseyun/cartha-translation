base_translation:
  language: en
  yaml_path: translation/nt/mark/001/025.yaml
  text: And Jesus rebuked him[a], saying, “Be silent, and come out of him!”
translation:
  language: id
  text: Lalu Yesus menegur roh itu dengan keras sambil berkata, “Diam![a] Keluarlah dari orang ini!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Pasanglah berangus!”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: menegur ... dengan keras
  rationale: Kata ἐπιτιμάω menyatakan teguran tajam yang berwibawa. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan ketegasan tindakan Yesus.
- source_word: αὐτῷ
  choice: roh itu
  rationale: Pronomina maskulin tunggal ini, berdasarkan konteks dan perintah berikutnya, merujuk kepada roh najis, bukan kepada orang yang dirasuk. Penyebutan eksplisit menghindari ketidakjelasan rujukan dalam bahasa Indonesia.
- source_word: λέγων
  choice: kata-Nya
  rationale: Partisipel ini memperkenalkan isi teguran. Bentuk 'kata-Nya' alami dan bermartabat dalam narasi Indonesia.
- source_word: Φιμώθητι
  choice: Diam!
  rationale: Secara harfiah verba ini berarti memasang berangus, tetapi sebagai perintah berarti membungkam atau menyuruh diam dengan tegas. 'Diam!' mempertahankan daya perintah dan terdengar alami.
- source_word: ἔξελθε
  choice: Keluarlah
  rationale: Dalam konteks pengusiran roh, ἐξέρχομαι menyatakan gerak keluar dari dalam orang tersebut. 'Keluarlah' adalah padanan langsung dan idiomatis.
- source_word: ἐξ αὐτοῦ
  choice: dari orang ini
  rationale: Frasa ini menunjukkan gerak keluar dari dalam orang yang dirasuk. 'Orang ini' membedakan orang tersebut dari roh yang sedang disapa tanpa menambahkan nama atau identitas yang tidak terdapat dalam teks.
theological_decisions:
- issue: Rujukan pihak yang ditegur Yesus
  choice: Yesus berbicara langsung kepada roh najis.
  alternative: Yesus menegur orang yang dirasuk sebagai rujukan gramatikal langsung.
  rationale: Konteks sebelumnya mengidentifikasi roh najis sebagai pihak yang berbicara, sedangkan perintah 'keluarlah dari orang ini' membedakan roh yang disapa dari orang yang dirasuk.
translation_notes:
  register: Bahasa Indonesia modern, jelas, tegas, dan bermartabat. Susunan ujaran langsung dibuat singkat untuk mempertahankan nada perintah yang mendadak dan berwibawa.
