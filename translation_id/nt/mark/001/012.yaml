  text: And immediately the Spirit drives him out into the wilderness[a].
translation:
  language: id
  text: Dan segera Roh itu menghalau Dia ke padang belantara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "mengusir Dia ke padang belantara" atau "mengutus Dia ke padang belantara." Kata kerja Yunani yang dipakai di sini bernada kuat; bandingkan pemakaian kata yang sama berulang kali dalam Markus untuk mengusir roh-roh jahat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Dan
  rationale: Mempertahankan kata penghubung sederhana yang menjadi ciri alur narasi Markus tanpa menafsirkan urutannya secara berlebihan.
- source_word: εὐθὺς
  choice: segera
  rationale: Menyampaikan gerak narasi yang cepat dan mendesak dalam bahasa Indonesia modern.
- source_word: τὸ πνεῦμα
  choice: Roh itu
  rationale: Artikel Yunani dipertahankan secara wajar; dalam konteks, ungkapan ini menunjuk kepada Roh yang baru disebutkan pada baptisan Yesus, tanpa menambahkan kata 'Kudus' yang tidak terdapat dalam ayat ini.
- source_word: αὐτὸν
  choice: Dia
  rationale: Kata ganti objek ini mengacu kepada Yesus. Huruf kapital membantu memperjelas acuannya sesuai kebiasaan penulisan Alkitab bahasa Indonesia.
- source_word: ἐκβάλλει
  choice: mendorong ... keluar
  rationale: Pilihan ini mempertahankan daya paksa ἐκβάλλω dan unsur gerak keluar, tetapi tetap terdengar alami dalam bahasa Indonesia. Ungkapan yang lebih lunak seperti 'memimpin' dihindari.
- source_word: εἰς τὴν ἔρημον
  choice: ke padang belantara
  rationale: ἔρημος menunjuk tempat sunyi, terpencil, atau tidak berpenghuni; 'padang belantara' tidak membatasi gambaran pada gurun berpasir dan mempertahankan nuansa latar pengujian.
theological_decisions:
- issue: Kekuatan tindakan Roh terhadap Yesus
  choice: mendorong Dia keluar
  alternative: memimpin Dia; mengutus Dia keluar; menghalau Dia keluar
  rationale: Kata ἐκβάλλω memiliki daya yang kuat dan sering dipakai Markus untuk tindakan mengusir. Terjemahan ini mempertahankan ketegangan bahwa perjalanan Yesus menuju tempat pengujian terjadi atas prakarsa Roh, tanpa melunakkannya agar selaras dengan ungkapan Injil lain.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mengikuti gerak cepat narasi Markus. 'Padang belantara' dipilih daripada 'gurun' agar tidak menyiratkan bahwa lokasinya harus berupa hamparan pasir.
