  text: ἐγένετο Ἰωάννης ⸀ὁ βαπτίζων ἐν τῇ ⸀ἐρήμῳ κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/004.yaml
  text: John the Baptist appeared in the wilderness[a], proclaiming a baptism of repentance for the forgiveness of sins.
translation:
  language: id
  text: Yohanes Pembaptis[a] tampil di padang gurun dan memberitakan baptisan pertobatan untuk pengampunan dosa-dosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Yohanes yang membaptis tampil di padang gurun dan memberitakan ....”'
    reason: Partisipel Yunani ὁ βαπτίζων dapat diterjemahkan secara lebih eksplisit sebagai sebutan berdasarkan tindakan Yohanes.
lexical_decisions:
- source_word: ἐγένετο
  choice: tampil
  rationale: Dalam narasi Markus, kata ini memperkenalkan Yohanes ke dalam adegan. “Tampil” menyampaikan fungsi naratif tersebut secara alami tanpa terjemahan harfiah yang kaku seperti “menjadi”.
- source_word: Ἰωάννης
  choice: Yohanes
  rationale: Mengikuti bentuk nama Alkitab yang sudah baku dan dikenal luas dalam bahasa Indonesia.
- source_word: ὁ βαπτίζων
  choice: Pembaptis
  rationale: Partisipel berartikel ini mengenali Yohanes berdasarkan kegiatannya membaptis. “Pembaptis” adalah gelar yang alami dan mapan; alternatif yang lebih eksplisit dicantumkan dalam catatan kaki.
- source_word: ἐν τῇ ἐρήμῳ
  choice: di padang gurun
  rationale: “Padang gurun” adalah padanan Indonesia yang lazim bagi ἔρημος dan tidak membatasi maknanya pada gurun pasir.
- source_word: κηρύσσων
  choice: memberitakan
  rationale: Kata ini mempertahankan nuansa penyampaian berita secara terbuka dan berwibawa tanpa terlalu membatasinya pada kegiatan berkhotbah di lingkungan ibadah.
- source_word: βάπτισμα
  choice: baptisan
  rationale: Istilah ini merupakan padanan yang tepat, mapan, dan mudah dikenali untuk tindakan yang dimaksud dalam konteks ini.
- source_word: μετανοίας
  choice: pertobatan
  rationale: Bentuk genitifnya menggambarkan baptisan yang berkaitan erat dengan atau bercirikan pertobatan. “Pertobatan” mempertahankan daya moral dan rohaninya.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: untuk pengampunan dosa-dosa
  rationale: “Untuk” secara alami mempertahankan hubungan tujuan atau hasil yang dapat dinyatakan oleh εἰς tanpa memaksakan penafsiran teologis tertentu. Bentuk jamak ἁμαρτιῶν dipertahankan sebagai “dosa-dosa”.
theological_decisions:
- issue: Hubungan antara baptisan, pertobatan, dan pengampunan
  choice: “baptisan pertobatan untuk pengampunan dosa-dosa”
  alternative: “baptisan yang melambangkan pertobatan demi pengampunan” atau “baptisan yang menghasilkan pengampunan melalui pertobatan”
  rationale: Susunan Yunani menghubungkan ketiga gagasan tersebut, tetapi tidak mengharuskan penerjemah menentukan apakah baptisan berfungsi secara instrumental, simbolis, atau deklaratif. Terjemahan mempertahankan ketegangan teologis sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sambil mempertahankan hubungan gramatikal dan ambiguitas teologis teks Yunani.
