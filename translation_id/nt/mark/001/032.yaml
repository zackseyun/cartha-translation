  text: Ὀψίας δὲ γενομένης, ὅτε ⸀ἔδυ ὁ ἥλιος, ἔφερον πρὸς αὐτὸν πάντας τοὺς κακῶς ἔχοντας καὶ τοὺς δαιμονιζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/032.yaml
  text: When evening came[a], when the sun had set[d][c][b], they brought to him all who were sick and those who were demon-possessed.
translation:
  language: id
  text: Ketika hari sudah petang, saat matahari telah terbenam, mereka membawa kepada-Nya semua orang yang sakit dan semua yang kerasukan setan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “yang berada di bawah kuasa setan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Ketika hari sudah petang
  rationale: Konstruksi genitif absolut menandai peralihan waktu. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan keterangan waktu yang terpisah dari penyebutan terbenamnya matahari.
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: saat matahari telah terbenam
  rationale: ὅτε menyatakan waktu, sedangkan bentuk aoris ἔδυ menunjuk pada terbenamnya matahari. 'Telah terbenam' menyampaikan bahwa peristiwa itu sudah terjadi pada waktu orang-orang mulai membawa mereka.
- source_word: ἔφερον
  choice: orang-orang membawa
  rationale: Imperfek menggambarkan kegiatan yang sedang berlangsung atau berulang. Dalam bahasa Indonesia, aspek tersebut dapat dipahami dari konteks tanpa harus menambahkan 'terus', yang dapat memberi penekanan lebih daripada teks Yunani. Subjek tak tentu dinyatakan secara alami dengan 'orang-orang'.
- source_word: πρὸς αὐτὸν
  choice: kepada-Nya
  rationale: πρός dengan akusatif menunjukkan gerak menuju seseorang. Pronomina mempertahankan rujukan teks Yunani tanpa mengulang nama Yesus.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: semua orang yang sakit
  rationale: Ungkapan idiomatis κακῶς ἔχειν berarti berada dalam keadaan tidak sehat. Terjemahan ini jelas, alami, dan mempertahankan cakupan πάντας.
- source_word: τοὺς δαιμονιζομένους
  choice: yang kerasukan roh-roh jahat
  rationale: Partisipel ini menunjuk kepada orang-orang yang berada di bawah kuasa makhluk roh jahat. 'Kerasukan roh-roh jahat' merupakan ungkapan Indonesia yang jelas dan tidak menghapus kenyataan aktivitas demonis dalam teks.
theological_decisions:
- issue: Kadar makna δαιμονιζομένους
  choice: yang kerasukan roh-roh jahat
  alternative: yang berada di bawah kuasa roh-roh jahat
  rationale: Pilihan utama mempertahankan kekuatan istilah Yunani dan pembedaannya dari penyakit, tanpa menambahkan uraian demonologi yang tidak terdapat dalam ayat. Catatan kaki mempertahankan kemungkinan ungkapan yang lebih luas.
- issue: Aspek imperfek ἔφερον
  choice: orang-orang membawa
  alternative: orang-orang terus membawa
  rationale: Bahasa Indonesia tidak wajib menandai aspek progresif secara eksplisit. Bentuk sederhana lebih alami, sedangkan 'terus' berpotensi memberi penekanan tambahan; nuansa berlangsung tetap muncul dari adegan banyak orang yang dibawa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Dua keterangan waktu dipertahankan karena keduanya hadir dalam teks Yunani. Kapitalisasi pada pronomina “-Nya” mengikuti kebiasaan penulisan hormat untuk rujukan kepada Yesus.
