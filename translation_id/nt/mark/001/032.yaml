  terminology: '"Kerasukan setan" adalah padanan Indonesia yang lazim untuk δαιμονιζομένους serta mempertahankan pembedaan tekstualnya dari penyakit. Istilah ini tidak menambahkan jumlah setan ataupun menggantinya dengan kategori umum "roh-roh jahat."'
