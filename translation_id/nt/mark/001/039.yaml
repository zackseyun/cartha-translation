  yaml_path: translation/nt/mark/001/039.yaml
  text: And he went throughout all Galilee[a], preaching in their synagogues and casting out demons.
translation:
  language: id
  text: Lalu ia pergi berkeliling ke seluruh Galilea[a], sambil berkhotbah di rumah-rumah ibadat mereka dan mengusir setan-setan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Lalu ia datang, sambil berkhotbah di rumah-rumah ibadat mereka di seluruh Galilea dan mengusir setan-setan.” Kata Yunani yang dipakai dapat diterjemahkan “datang”, tetapi dalam konteks ini kemungkinan besar menggambarkan perjalanannya berkeliling wilayah itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: ia pergi ke seluruh
  rationale: Bentuk aoris ἔρχομαι dapat berarti 'datang' atau 'pergi'. Bersama keterangan wilayah dan dua partisipel, konteks ini menggambarkan pelayanan keliling Yesus; 'pergi ke seluruh' menyatakannya secara alami tanpa melampaui konteks.
- source_word: κηρύσσων
  choice: memberitakan kabar
  rationale: κηρύσσω berarti menyampaikan sesuatu secara terbuka sebagai pewarta. 'Memberitakan kabar' alami dalam konteks pelayanan Yesus dan mempertahankan gagasan proklamasi, tanpa menentukan isi kabar yang tidak disebutkan dalam ayat ini.
- source_word: εἰς τὰς συναγωγὰς αὐτῶν
  choice: di rumah-rumah ibadat mereka
  rationale: Walaupun εἰς secara harfiah dapat berarti 'ke dalam', di sini frasa itu menyatakan tempat kegiatan pemberitaan. 'Di' merupakan bentuk Indonesia yang alami. αὐτῶν dipertahankan sebagai 'mereka'.
- source_word: εἰς ὅλην τὴν Γαλιλαίαν
  choice: ke seluruh Galilea
  rationale: Frasa ini menyatakan jangkauan pergerakan ke segenap wilayah Galilea. 'Seluruh' mempertahankan ὅλην.
- source_word: τὰ δαιμόνια
  choice: roh-roh jahat
  rationale: δαιμόνια menunjuk kepada makhluk rohani jahat. 'Roh-roh jahat' adalah padanan Indonesia modern yang jelas dan alami; pilihan ini tidak menyamakannya secara leksikal dengan ungkapan Yunani πνεύματα ἀκάθαρτα, tetapi menyampaikan rujukannya bagi pembaca umum.
- source_word: ἐκβάλλων
  choice: mengusir
  rationale: Dalam konteks eksorsisme, ἐκβάλλω berarti membuat roh jahat keluar atau pergi. 'Mengusir' merupakan ungkapan Indonesia yang ringkas dan lazim.
theological_decisions:
- issue: Hakikat τὰ δαιμόνια
  choice: Diterjemahkan 'roh-roh jahat' dalam arti makhluk rohani personal yang diusir Yesus.
  alternative: '''setan-setan'' atau ''demon-demon'''
  rationale: Teks menggambarkan mereka sebagai objek tindakan mengusir. 'Roh-roh jahat' menyampaikan pengertian tersebut secara langsung bagi pembaca Indonesia tanpa menambahkan rincian doktrinal yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Pronomina 'ia' dipakai karena ayat yang berdiri sendiri tidak menyebut nama subjek, selaras dengan bentuk Yunani; huruf kecil mengikuti kaidah umum pronomina orang ketiga. 'Rumah-rumah ibadat' dipilih sebagai istilah yang mudah dipahami untuk συναγωγαί.
