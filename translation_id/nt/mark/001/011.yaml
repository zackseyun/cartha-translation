  text: καὶ φωνὴ ἐγένετο ἐκ τῶν οὐρανῶν· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν ⸀σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/011.yaml
  text: 'And a voice came from the heavens: “You are my beloved Son[b][a]; in you I am well pleased.”'
translation:
  language: id
  text: 'Lalu terdengarlah suara dari langit: “Engkaulah Anak-Ku yang Kukasihi; kepada-Mulah Aku berkenan.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: terdengarlah suara
  rationale: Ungkapan ini menyatakan terjadinya suara dalam narasi. Dalam bahasa Indonesia, “terdengarlah suara” lebih alami daripada terjemahan harfiah “terjadilah suara” dan tetap menyampaikan kemunculan suara itu.
- source_word: ἐκ τῶν οὐρανῶν
  choice: dari langit
  rationale: Walaupun bentuk Yunaninya jamak, bahasa Indonesia lazim memakai “langit” sebagai nomina yang tidak perlu dibedakan jumlahnya dalam konteks ini. Pilihan ini alami dan tidak menghilangkan makna asal-usul suara dari ranah surgawi.
- source_word: Σὺ εἶ
  choice: Engkaulah
  rationale: Bentuk “Engkaulah” menyampaikan baik sapaan langsung maupun penekanan dari pronomina eksplisit Σὺ. Register ini tetap khidmat dan mudah dipahami.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Anak-Ku yang Kukasihi
  rationale: Pilihan ini mempertahankan identitas sebagai Anak dan kasih ilahi yang dinyatakan oleh ἀγαπητός. Huruf kapital mengikuti penggunaan sebagai sapaan ilahi langsung kepada Yesus.
- source_word: ἐν σοὶ
  choice: kepada-Mulah
  rationale: Dalam gabungan dengan εὐδόκησα, bahasa Indonesia secara alami menyatakan objek perkenanan dengan “kepada-Mu.” Partikel “-lah” turut mempertahankan penekanan pada σοὶ.
- source_word: εὐδόκησα
  choice: Aku berkenan
  rationale: Aoristus dalam formula pernyataan ini dapat mengungkapkan perkenanan yang dinyatakan pada saat itu. “Aku berkenan” terdengar alami, khidmat, dan mempertahankan gagasan persetujuan serta kesukaan ilahi tanpa memaksakan waktu lampau yang kaku.
theological_decisions:
- issue: Menerjemahkan pernyataan ilahi kepada Yesus tanpa mengurangi daya kristologisnya
  choice: Anak-Ku yang Kukasihi
  alternative: Anak-Ku, Yang Terkasih
  rationale: Rumusan ini mempertahankan hubungan sebagai Anak dan kasih Bapa tanpa memasukkan istilah doktrinal yang tidak terdapat dalam ayat.
- issue: Menangani bentuk jamak οὐρανῶν dalam bahasa Indonesia
  choice: dari langit
  alternative: dari langit-langit
  rationale: Dalam bahasa Indonesia, “langit-langit” terutama berarti plafon dan karena itu akan menyesatkan. “Dari langit” merupakan padanan idiomatis yang dapat mencakup konsep Yunani tanpa memaksakan penandaan jumlah yang tidak alami.
- issue: Menjaga rentang makna εὐδόκησα
  choice: Aku berkenan
  alternative: Aku telah berkenan / Aku bersukacita
  rationale: “Berkenan” memelihara ketegangan antara persetujuan dan kesukaan ilahi serta sesuai dengan daya deklaratif ujaran tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. “Engkau” dipilih karena merupakan sapaan langsung dalam deklarasi ilahi dan tetap dikenal luas dalam register Alkitab; bentuk terikat yang merujuk kepada Allah ditulis dengan huruf kapital menurut kebiasaan ejaan religius Indonesia.
