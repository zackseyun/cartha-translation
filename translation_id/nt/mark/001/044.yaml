id: MRK.1.44
reference: Mark 1:44
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ὅρα μηδενὶ μηδὲν εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου ἃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/044.yaml
  text: And he says to him[a], “See that you say nothing to anyone; rather, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”
translation:
  language: id
  text: Lalu Yesus berkata kepadanya, “Ingat, jangan katakan apa pun kepada siapa pun. Sebaliknya, pergilah, perlihatkanlah dirimu kepada imam dan persembahkanlah untuk pentahiranmu apa yang diperintahkan Musa, sebagai kesaksian bagi mereka.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ungkapan ini juga dapat dipahami sebagai “sebagai bukti bagi mereka”; “mereka” mungkin merujuk kepada para imam atau orang-orang lain. Sebagian orang memahaminya dengan arti yang lebih tajam: “sebagai kesaksian yang memberatkan mereka.”'
    reason: Menjaga ambiguitas rujukan αὐτοῖς dan daya ungkapan εἰς μαρτύριον tanpa menetapkan nuansa yang tidak dinyatakan secara eksplisit dalam teks.
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Yesus berkata kepadanya
  rationale: Bentuk kini historis λέγει dinaturalkan menjadi bentuk naratif Indonesia. Subjek tersirat dijelaskan sebagai Yesus agar rujukannya jelas dalam ayat yang berdiri sendiri.
- source_word: Ὅρα
  choice: Ingat
  rationale: Imperatif ini berfungsi sebagai peringatan atau desakan sebelum larangan. “Ingat” menyampaikan daya desaknya secara wajar tanpa mengartikannya secara harfiah sebagai tindakan melihat.
- source_word: μηδενὶ μηδὲν εἴπῃς
  choice: jangan katakan apa pun kepada siapa pun
  rationale: 'Mempertahankan cakupan ganda larangan: tidak ada isi yang boleh dikatakan dan tidak ada seorang pun yang boleh diberi tahu.'
- source_word: ἀλλὰ ὕπαγε
  choice: Sebaliknya, pergilah
  rationale: ἀλλά menandai kontras korektif antara tindakan yang dilarang dan tindakan yang harus dilakukan; ὕπαγε adalah perintah langsung untuk pergi.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: perlihatkanlah dirimu kepada imam
  rationale: Mempertahankan objek refleksif dan tindakan menghadap imam untuk pemeriksaan menurut ketentuan Taurat.
- source_word: προσένεγκε περὶ τοῦ καθαρισμοῦ σου
  choice: persembahkanlah untuk pentahiranmu
  rationale: Konteks ibadah dan korban mendukung “persembahkanlah”, sedangkan “pentahiran” mempertahankan nuansa ritual καθαρισμός, bukan sekadar kebersihan jasmani.
- source_word: ἃ προσέταξεν Μωϋσῆς
  choice: apa yang diperintahkan Musa
  rationale: Bentuk relatif jamak netral diterjemahkan secara kolektif dan alami, merujuk pada ketentuan Musa mengenai pentahiran.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: sebagai kesaksian bagi mereka
  rationale: Terjemahan ini mempertahankan fungsi bukti atau kesaksian tanpa memastikan siapa tepatnya “mereka” atau apakah nuansanya mendukung atau menentang mereka.
theological_decisions:
- issue: Rujukan dan daya ungkapan εἰς μαρτύριον αὐτοῖς
  choice: sebagai kesaksian bagi mereka
  alternative: sebagai bukti bagi para imam; sebagai kesaksian yang memberatkan mereka
  rationale: Teks Yunani tidak secara tegas menentukan rujukan “mereka” dan tidak memuat kata yang secara eksplisit berarti “melawan”. Karena itu, ungkapan yang lebih luas dipertahankan, sementara kemungkinan nuansa lain dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Pentahiran” dipakai untuk menjaga latar ritual Taurat, sedangkan susunan larangan dibuat lugas dan mudah dipahami.
