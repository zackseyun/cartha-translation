  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἐκ τῆς συναγωγῆς ⸂ἐξελθόντες ἦλθον⸃ εἰς τὴν οἰκίαν Σίμωνος καὶ Ἀνδρέου μετὰ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/029.yaml
  text: And immediately, after leaving the synagogue, they came into the house of Simon and Andrew, with James and John.
translation:
  language: id
  text: Segera setelah keluar dari rumah ibadat, mereka masuk ke rumah Simon dan Andreas bersama Yakobus dan Yohanes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: segera
  rationale: Mempertahankan gerak narasi Markus yang cepat dan mendesak dalam bahasa Indonesia modern.
- source_word: ἐκ τῆς συναγωγῆς
  choice: dari rumah ibadat
  rationale: ἐκ menyatakan gerak keluar dari tempat itu; bersama ἐξελθόντες, ungkapan ini secara alami menjadi 'setelah keluar dari rumah ibadat'.
- source_word: ἐξελθόντες ἦλθον
  choice: setelah keluar ... mereka pergi
  rationale: 'Partisip aoris menyatakan tindakan yang mendahului verba utama: mereka keluar terlebih dahulu, lalu pergi menuju rumah itu.'
- source_word: ἦλθον
  choice: mereka pergi
  rationale: ἔρχομαι dapat berarti datang atau pergi menurut sudut pandang. Karena narator mengikuti perpindahan mereka dari rumah ibadat menuju rumah Simon dan Andreas, 'pergi' paling wajar dalam bahasa Indonesia.
- source_word: εἰς τὴν οἰκίαν
  choice: ke rumah
  rationale: εἰς menunjukkan arah menuju atau masuk ke tempat tujuan; bahasa Indonesia lazim memakai 'ke rumah' tanpa harus menambahkan 'masuk ke dalam'.
- source_word: Σίμωνος καὶ Ἀνδρέου
  choice: Simon dan Andreas
  rationale: Bentuk genitif menunjukkan bahwa rumah itu adalah kediaman Simon dan Andreas; konstruksi Indonesia 'rumah Simon dan Andreas' menyatakannya secara alami.
- source_word: μετὰ Ἰακώβου καὶ Ἰωάννου
  choice: bersama Yakobus dan Yohanes
  rationale: μετά dengan genitif menyatakan penyertaan atau pendampingan.
- source_word: Σίμωνος / Ἀνδρέου / Ἰακώβου / Ἰωάννου
  choice: Simon / Andreas / Yakobus / Yohanes
  rationale: Mengikuti bentuk nama Alkitab yang telah mapan dan mudah dikenali dalam bahasa Indonesia.
- source_word: συναγωγή
  choice: rumah ibadat
  rationale: Dalam konteks ini kata tersebut menunjuk tempat pertemuan dan ibadah orang Yahudi; 'rumah ibadat' jelas bagi pembaca umum dan sesuai dengan register Alkitab Indonesia.
