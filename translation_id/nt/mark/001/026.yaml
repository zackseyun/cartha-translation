id: MRK.1.26
reference: Mark 1:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ σπαράξαν αὐτὸν τὸ πνεῦμα τὸ ἀκάθαρτον καὶ ⸀φωνῆσαν φωνῇ μεγάλῃ ἐξῆλθεν ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/026.yaml
  text: And the unclean spirit[a], after convulsing him and crying out with a loud voice[b], came out of him.
translation:
  language: id
  text: Lalu, setelah membuat orang itu kejang-kejang[a] dan berteriak dengan suara keras[b], roh najis itu keluar dari dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengguncang-guncangkan orang itu.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “dengan suara yang besar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπαράξαν
  choice: membuat orang itu kejang-kejang
  rationale: Partisip aoris ini menggambarkan tindakan roh terhadap orang itu sebelum roh tersebut keluar. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan gerakan tubuh yang hebat tanpa memberi kesan bahwa tubuhnya benar-benar dicabik.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: roh najis
  rationale: Ini merupakan ungkapan baku dalam Perjanjian Baru bagi roh jahat. Kata 'najis' mempertahankan nuansa ketidakmurnian dalam ἀκάθαρτος dan sesuai dengan pemakaian Injil.
- source_word: φωνῆσαν
  choice: berteriak
  rationale: Partisip ini menyatakan tindakan bersuara yang menyertai keluarnya roh. 'Berteriak' wajar dalam bahasa Indonesia dan mempertahankan kekuatan adegan tanpa menentukan emosi tertentu.
- source_word: φωνῇ μεγάλῃ
  choice: dengan suara keras
  rationale: Frasa datif ini menyatakan cara. Terjemahan ini mempertahankan unsur konkret 'suara' dan menyampaikan besarnya volume.
- source_word: ἐξῆλθεν ἐξ αὐτοῦ
  choice: keluar dari dia
  rationale: Terjemahan langsung bagi rumusan pengusiran roh ini mempertahankan gambaran spasial dan pelaku pribadi yang meninggalkan orang tersebut.
- source_word: καὶ ... καὶ
  choice: Lalu ... dan
  rationale: '''Lalu'' menghubungkan ayat ini dengan alur narasi sebelumnya, sedangkan ''dan'' mempertahankan koordinasi kedua tindakan pendahulu sebelum tindakan utama.'
theological_decisions:
- issue: Sifat entitas yang merasuki orang itu
  choice: Frasa ini merujuk kepada roh najis sebagai pelaku pribadi.
  alternative: Kekuatan jahat yang tidak berpribadi.
  rationale: 'Dalam narasi Markus, roh itu bertindak sebagai pelaku: ia membuat orang tersebut kejang-kejang, berteriak, dan keluar darinya. Terjemahan mempertahankan keagenan itu tanpa menambahkan uraian doktrinal.'
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan 'setelah ... dan ..., roh najis itu keluar' memperjelas bahwa kedua partisip Yunani memiliki subjek yang sama dan mendahului tindakan utama.
