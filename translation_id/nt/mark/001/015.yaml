id: MRK.1.15
reference: Mark 1:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ λέγων ὅτι Πεπλήρωται ὁ καιρὸς καὶ ἤγγικεν ἡ βασιλεία τοῦ θεοῦ· μετανοεῖτε καὶ πιστεύετε ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/015.yaml
  text: and saying[a], “The time has been fulfilled, and the kingdom of God has drawn near[b]. Repent and believe in the good news.”
translation:
  language: id
  text: seraya berkata, “Waktunya telah genap, dan Kerajaan Allah[a] sudah dekat. Bertobatlah dan percayalah kepada kabar baik[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pemerintahan Allah.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Injil.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπλήρωται
  choice: telah genap
  rationale: Bentuk perfektum menyatakan penggenapan yang telah terjadi dengan hasil yang tetap berlaku; “telah genap” mempertahankan aspek itu secara ringkas dan wajar.
- source_word: ὁ καιρὸς
  choice: waktunya
  rationale: καιρός menunjuk pada saat yang menentukan atau ditetapkan, bukan sekadar waktu secara umum. Bentuk definit “waktunya” menyampaikan bahwa saat yang dimaksud telah tiba tanpa menambahkan tafsiran.
- source_word: ἤγγικεν
  choice: sudah dekat
  rationale: Perfektum menekankan keadaan kini sebagai hasil dari mendekatnya sesuatu. “Sudah dekat” alami dalam bahasa Indonesia dan mempertahankan makna kedekatan kini, tanpa menentukan lebih jauh apakah yang ditekankan ialah kedatangan atau jarak.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ungkapan baku ini mempertahankan keluasan βασιλεία, yang dapat mencakup pemerintahan, kekuasaan sebagai raja, dan ranah kerajaan, tanpa mempersempitnya menjadi salah satu unsur saja.
- source_word: μετανοεῖτε
  choice: Bertobatlah
  rationale: Imperatif ini menyerukan perubahan pikiran dan arah hidup. “Bertobatlah” merupakan padanan Indonesia yang ringkas, jelas, dan mencakup lebih dari perubahan pendapat semata.
- source_word: πιστεύετε
  choice: percayalah
  rationale: Padanan ini mempertahankan seruan untuk percaya atau menaruh iman tanpa mempersempitnya menjadi persetujuan intelektual belaka.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: kepada kabar baik
  rationale: εὐαγγέλιον pada dasarnya berarti berita atau kabar baik. Sesudah “percaya”, preposisi Yunani diungkapkan secara idiomatis dengan “kepada”; istilah tradisional “Injil” dicatat sebagai alternatif.
- source_word: λέγων
  choice: seraya berkata
  rationale: Partisipel ini melanjutkan alur dari ayat sebelumnya. “Seraya berkata” mempertahankan hubungan dengan tindakan sebelumnya tanpa menambahkan subjek yang tidak dinyatakan dalam frasa ini.
theological_decisions:
- issue: Makna βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  alternative: pemerintahan Allah
  rationale: “Kerajaan Allah” menjaga gema kanonis dan keluasan ungkapan sumber. Alternatif “pemerintahan Allah” dapat menonjolkan tindakan Allah memerintah, tetapi berisiko mempersempit cakupan istilah.
- issue: Makna εὐαγγέλιον
  choice: kabar baik
  alternative: Injil
  rationale: “Kabar baik” menyampaikan arti leksikal secara langsung dan mudah dipahami pembaca modern, sedangkan istilah gerejawi yang mapan dipertahankan dalam catatan kaki.
- issue: Daya imperatif μετανοεῖτε καὶ πιστεύετε
  choice: Bertobatlah dan percayalah
  alternative: Teruslah bertobat dan percaya
  rationale: Bentuk imperatif kini dapat memiliki aspek berkelanjutan, tetapi imperatif sederhana dalam bahasa Indonesia mempertahankan desakan seruan tanpa memaksakan tafsiran aspektual yang lebih khusus.
- issue: Kedekatan Kerajaan Allah dalam ἤγγικεν
  choice: sudah dekat
  alternative: telah mendekat
  rationale: Pilihan utama menegaskan keadaan dekat yang kini berlaku sebagai hasil dari pendekatan, sambil tidak menyelesaikan ketegangan antara sesuatu yang sedang mendekat dan sesuatu yang telah hadir dekat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Kapitalisasi “Kerajaan Allah” mengikuti kebiasaan penulisan istilah ilahi dalam teks Alkitab bahasa Indonesia. Susunan “seraya berkata” sengaja mempertahankan kaitan sintaksis dengan ayat sebelumnya.
