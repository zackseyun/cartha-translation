  text: καὶ ⸀εὐθὺς ἀπῆλθεν ἀπ’ αὐτοῦ ἡ λέπρα, καὶ ἐκαθαρίσθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/042.yaml
  text: And immediately the leprosy left him[a], and he was cleansed.
translation:
  language: id
  text: Seketika itu juga penyakit kulit itu lenyap darinya, dan ia ditahirkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia menjadi tahir.” Kata ini mencakup ketahiran secara ritual, bukan hanya pemulihan jasmani.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: seketika itu juga
  rationale: Mengungkapkan tindakan yang langsung terjadi serta mempertahankan ciri urgensi dalam Injil Markus dengan bahasa Indonesia yang alami.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: lenyap
  rationale: Dengan penyakit kulit sebagai subjek, ungkapan ini secara idiomatis menyatakan bahwa penyakit itu pergi darinya; 'lenyap' menyampaikan hasil tersebut secara ringkas dan alami.
- source_word: ἡ λέπρα
  choice: penyakit kulitnya
  rationale: Dalam pemakaian Alkitab, λέπρα mencakup berbagai penyakit kulit dan tidak selalu identik dengan penyakit Hansen modern. Akhiran '-nya' secara alami menyampaikan ἀπ’ αὐτοῦ dan kaitan penyakit itu dengan orang tersebut.
- source_word: ἐκαθαρίσθη
  choice: ia menjadi tahir
  rationale: '''Menjadi tahir'' mempertahankan nuansa pemulihan jasmani sekaligus status kemurnian ritual, bukan sekadar kesembuhan medis.'
theological_decisions:
- issue: Hubungan antara kesembuhan jasmani dan ketahiran ritual dalam ἐκαθαρίσθη
  choice: ia menjadi tahir
  alternative: ia disembuhkan; ia dibersihkan
  rationale: Konteks penyakit kulit dalam hukum dan kehidupan Israel membuat verba ini memuat dimensi ketahiran, sementara bentuk pasifnya tidak perlu diperjelas pelakunya. Pilihan ini menjaga kedua dimensi tanpa menambahkan klaim doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. 'Penyakit kulit' dipilih untuk menghindari penyamaan otomatis dengan kusta atau penyakit Hansen modern; 'menjadi tahir' mempertahankan latar ritual yang penting.
