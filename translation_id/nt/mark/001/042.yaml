  terminology: “Penyakit kulit” menghindari penyempitan makna λέπρα menjadi diagnosis medis modern. “Ditahirkan” mempertahankan dimensi pemulihan dan ketahiran ritual dari καθαρίζω tanpa menambahkan pelaku yang tidak disebutkan.
