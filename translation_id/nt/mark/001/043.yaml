lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Kata penghubung ini melanjutkan alur kisah. “Lalu” terdengar alami dalam narasi Indonesia dan tetap mencerminkan gaya cepat Markus.
- source_word: ἐμβριμησάμενος αὐτῷ
  choice: setelah memperingatkan dia dengan keras
  rationale: Partisipel ἐμβριμάομαι menyatakan teguran atau peringatan dengan intensitas emosi yang kuat. Pilihan ini mempertahankan daya perintahnya tanpa memastikan bahwa Yesus mengecam pribadi orang itu.
- source_word: εὐθύς
  choice: segera
  rationale: Mempertahankan unsur kesegeraan dan laju khas narasi Markus.
- source_word: ἐξέβαλεν αὐτόν
  choice: Yesus ... menyuruhnya pergi
  rationale: ἐκβάλλω lebih kuat daripada ungkapan netral untuk menyuruh pergi. Dalam konteks manusia yang baru disembuhkan, “menyuruhnya pergi” alami dalam bahasa Indonesia; kekuatan verba sumber dijelaskan dalam catatan kaki. Subjek “Yesus” dinyatakan agar rangkaian klausa jelas dan alami.
theological_decisions:
- issue: Nada tindakan Yesus terhadap orang yang disembuhkan
  choice: Yesus memberi peringatan keras dan menyuruh orang itu pergi dengan tegas.
  alternative: Yesus sekadar memberi petunjuk tegas tanpa warna emosi, atau Yesus mengecam pribadi orang itu.
  rationale: Dua verba Yunani memiliki daya yang mencolok. Terjemahan mempertahankan ketegangan itu, tetapi tidak menambahkan kesimpulan bahwa Yesus bersikap berdosa, memusuhi orang tersebut, atau mengecam pribadinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara kedua catatan kaki menjaga kekuatan dan ambiguitas leksikal teks Yunani.
