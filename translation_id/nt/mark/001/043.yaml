  text: Lalu, setelah memperingatkan dia dengan keras[a], Yesus segera menyuruhnya pergi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setelah memberi perintah yang tegas kepadanya”; kata Yunani ini juga dapat mengandung arti rasa geram yang kuat atau teguran keras.
