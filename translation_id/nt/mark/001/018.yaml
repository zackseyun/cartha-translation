  text: καὶ ⸀εὐθὺς ἀφέντες τὰ ⸀δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/018.yaml
  text: And immediately they left the nets and followed him[a].
translation:
  language: id
  text: Dan mereka segera[a] meninggalkan jala-jala itu dan mengikuti Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saat itu juga.”
    reason: Alternatif leksikal untuk εὐθὺς yang sama-sama menekankan kesegeraan.
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Kata penghubung sederhana ini mempertahankan alur narasi Markus tanpa menambahkan nuansa penafsiran.
- source_word: εὐθὺς
  choice: segera
  rationale: Pilihan ini menyampaikan tindakan yang langsung dan mendesak dengan bahasa Indonesia modern dan alami.
- source_word: ἀφέντες
  choice: meninggalkan
  rationale: Partisipel aoris ini menunjukkan tindakan yang mendahului verba utama; dalam bahasa Indonesia wajar diungkapkan dengan verba sejajar. 'Meninggalkan' tidak melebih-lebihkan maknanya seperti 'menelantarkan'.
- source_word: τὰ δίκτυα
  choice: jala-jala itu
  rationale: Bentuk jamak dan artikelnya dipertahankan secara alami. 'Milik mereka' tidak ditambahkan karena kepemilikan hanya tersirat oleh konteks.
- source_word: ἠκολούθησαν
  choice: mengikuti
  rationale: Kata ini mempertahankan sekaligus arti gerak harfiah dan nuansa awal pemuridan tanpa menjabarkannya secara berlebihan.
- source_word: αὐτῷ
  choice: Dia
  rationale: Pronomina ini merujuk kepada Yesus dalam konteks langsung; nama 'Yesus' tidak disisipkan karena teks Yunani memakai pronomina.
theological_decisions:
- issue: Nuansa pemuridan dalam ἠκολούθησαν
  choice: mengikuti Dia
  alternative: menjadi murid-Nya; pergi bersama-Nya
  rationale: Ungkapan sederhana ini membiarkan makna naratif dan teologis pemuridan muncul dari konteks, tanpa memperluas teks menjadi pernyataan yang lebih eksplisit daripada bahasa sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan 'meninggalkan ... lalu mengikuti' secara alami menandai urutan tindakan yang dalam bahasa Yunani dinyatakan oleh partisipel aoris dan verba utama. Huruf kapital pada 'Dia' mengikuti konvensi umum penerbitan Alkitab bahasa Indonesia untuk pronomina yang merujuk kepada Yesus.
