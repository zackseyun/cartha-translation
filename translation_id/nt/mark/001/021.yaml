translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama Yesus dinyatakan untuk menghindari ketidakjelasan pronomina orang ketiga dalam bahasa Indonesia, sebab subjek tunggalnya tersirat dalam verba Yunani dan jelas dari konteks sebelumnya. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
