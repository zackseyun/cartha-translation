  to: Lalu mereka masuk ke Kapernaum.[a] Pada hari Sabat,[b] Yesus segera mengajar[c] di rumah ibadat.[d]
  rationale: Revisi mengganti “Begitu hari Sabat tiba” dengan “Pada hari Sabat, Yesus segera ...” agar εὐθύς diterjemahkan sebagai kesegeraan tindakan Yesus tanpa menambahkan bahwa Sabat baru tiba. Terjemahan “mengajar” tetap mempertahankan keterbukaan aspek imperfek, sementara alternatif aspek dan istilah “sinagoge” dipisahkan ke catatan kaki dengan penambat yang tepat.
