  naturalness: Bahasa draf jelas dan modern, tetapi “Begitu hari Sabat tiba” kurang alami serta menambahkan hubungan waktu yang tidak dinyatakan sumber. Susunan revisi lebih langsung dan wajar dalam narasi Indonesia.
  terminology: “Kapernaum,” “Sabat,” dan “rumah ibadat” dapat dipertahankan. Catatan tentang “sinagoge” sebaiknya ditambatkan pada “rumah ibadat,” bukan digabungkan dengan catatan tentang bentuk imperfek.
