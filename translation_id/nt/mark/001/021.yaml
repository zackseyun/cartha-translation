  yaml_path: translation/nt/mark/001/021.yaml
  text: And they went into Capernaum, and immediately on the Sabbath he began teaching in the synagogue.
translation:
  language: id
  text: Lalu mereka masuk ke Kapernaum.[a] Pada hari Sabat,[b] Yesus segera mengajar[c] di rumah ibadat.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka memasuki Kapernaum.” Kata kerja Yunani berbentuk kini historis, yang sering dipakai Markus untuk membuat narasi terasa hidup.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pada hari-hari Sabat”; bentuk jamak ini merupakan ungkapan idiomatis yang dapat berarti “pada hari Sabat.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “sedang mengajar” atau “mulai mengajar”; bentuk imperfek Yunani dapat menonjolkan tindakan yang berlangsung atau, dalam konteks tertentu, awal tindakan.
    reason: lexical_alternative
  - marker: d
    text: Atau, “sinagoge.” Dalam konteks Yahudi, istilah ini menunjuk pada tempat ibadat Yahudi setempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσπορεύονται
  choice: mereka masuk
  rationale: Bentuk kini ini merupakan present historis yang khas dalam narasi Markus. Bahasa Indonesia dapat memakai bentuk tanpa penanda waktu eksplisit secara alami; konteks menempatkannya dalam rangkaian peristiwa lampau, sementara makna gerak masuk tetap terpelihara.
- source_word: Καφαρναούμ
  choice: Kapernaum
  rationale: Mengikuti bentuk nama tempat yang sudah mapan dalam bahasa Indonesia.
- source_word: εὐθύς
  choice: begitu ... tiba
  rationale: Dalam kaitannya dengan keterangan waktu hari Sabat, ungkapan ini menyampaikan bahwa tindakan berlangsung segera ketika hari Sabat tiba, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: τοῖς σάββασιν
  choice: hari Sabat
  rationale: Walaupun berbentuk jamak dalam bahasa Yunani, frasa ini merupakan ungkapan waktu idiomatis yang secara wajar dipahami sebagai satu hari Sabat dalam konteks ini.
- source_word: ἐδίδασκεν
  choice: mengajar
  rationale: Bentuk imperfek dapat menggambarkan tindakan yang sedang atau terus berlangsung. Terjemahan tanpa tambahan seperti 'mulai' tidak memutuskan secara berlebihan apakah nuansanya inkoatif atau progresif.
- source_word: συναγωγήν
  choice: rumah ibadat
  rationale: Dalam konteks Yahudi, kata ini menunjuk pada sinagoge setempat. 'Rumah ibadat' merupakan padanan Indonesia yang jelas dan lazim, sementara catatan kaki memberi istilah alternatif yang lebih teknis.
