  text: ⸀καὶ ⸀ὀργισθεὶς ἐκτείνας τὴν χεῖρα ⸂αὐτοῦ ἥψατο⸃ καὶ λέγει αὐτῷ· Θέλω, καθαρίσθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/041.yaml
  text: And being angry[a], he stretched out his hand, touched him, and said to him, “I am willing; be cleansed.”
translation:
  language: id
  text: Dengan marah, ia mengulurkan tangannya, menyentuh orang itu, dan berkata kepadanya, “Aku mau; jadilah tahir!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: karena marah
  rationale: Partisip aoris ini menyatakan bahwa ia marah. Ungkapan “karena marah” alami dalam narasi Indonesia dan tetap mempertahankan emosi yang terdapat dalam teks SBLGNT tanpa menentukan sasaran atau alasan kemarahan yang tidak disebutkan.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: ia mengulurkan tangannya
  rationale: Konstruksi partisipial dialihkan menjadi verba berurutan agar alami dalam bahasa Indonesia, sambil mempertahankan tindakan fisik yang konkret.
- source_word: ἥψατο
  choice: menyentuh orang itu
  rationale: Dalam konteks ini bentuk medial ἅπτω paling jelas berarti menyentuh. “Orang itu” memperjelas rujukan pronomina secara alami tanpa menambah identitas baru.
- source_word: λέγει αὐτῷ
  choice: berkata kepadanya
  rationale: Present historis Yunani diterjemahkan dengan bentuk naratif Indonesia yang tidak menandai kala secara morfologis; ungkapan ini alami dan mempertahankan hubungan pembicara-pendengar.
- source_word: Θέλω
  choice: Aku mau
  rationale: θέλω di sini menyatakan kemauan atau kesediaan sebagai jawaban langsung terhadap permohonan sebelumnya. “Aku mau” ringkas, alami, dan lebih langsung daripada “Aku bersedia.”
- source_word: καθαρίσθητι
  choice: Jadilah tahir
  rationale: Imperatif pasif ini mencakup dimensi pemulihan fisik sekaligus ketahiran dalam konteks penyakit kulit. “Tahir” mempertahankan cakupan ritual yang dapat hilang jika hanya diterjemahkan “sembuh” atau “bersih.”
theological_decisions:
- issue: Varian tekstual mengenai keadaan emosi Yesus
  choice: Teks utama menerjemahkan ὀργισθείς dalam SBLGNT sebagai “karena marah.”
  alternative: Sejumlah naskah berbunyi “tergerak oleh belas kasihan.”
  rationale: Teks utama mengikuti edisi sumber yang diberikan. Karena varian ini secara berarti memengaruhi penggambaran emosi Yesus, bacaan alternatif dicatat tanpa menyelaraskan atau menjelaskan kepada siapa kemarahan itu ditujukan.
- issue: Cakupan makna καθαρίσθητι
  choice: Diterjemahkan “Jadilah tahir!”
  alternative: “Jadilah bersih!” atau “Sembuhlah!”
  rationale: Pilihan ini mempertahankan ketegangan antara pemulihan jasmani dan status ketahiran yang hadir dalam konteks penderita penyakit kulit, tanpa mempersempitnya hanya menjadi kesembuhan medis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas dengan nada naratif yang bermartabat. Huruf kecil pada “ia” dipakai karena teks sumber tidak menandai penghormatan melalui kapitalisasi pronomina. Tanda seru pada perintah mempertahankan daya ujar imperatif tanpa menambahkan penafsiran emosional.
