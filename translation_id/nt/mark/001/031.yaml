  text: καὶ προσελθὼν ἤγειρεν αὐτὴν κρατήσας τῆς ⸀χειρός· καὶ ἀφῆκεν αὐτὴν ὁ ⸀πυρετός, καὶ διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/031.yaml
  text: And coming near[a], he raised her up, taking her by the hand; and the fever left her, and she served them.
translation:
  language: id
  text: Lalu Yesus mendekat, memegang tangannya, lalu mengangkatnya. Demam itu pun meninggalkannya, lalu ia melayani mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “lalu ia mulai melayani mereka.” Bentuk kata kerja Yunani dapat sekadar menggambarkan tindakannya melayani, tetapi konteks juga mendukung pengertian bahwa ia langsung mulai melayani mereka setelah disembuhkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: mendekat
  rationale: Partisip aoris ini menyatakan gerakan Yesus menghampiri perempuan itu sebelum tindakan utama. Dalam bahasa Indonesia, urutannya wajar diungkapkan dengan verba beruntun.
- source_word: ἤγειρεν αὐτὴν
  choice: membangunkan dia
  rationale: ἐγείρω di sini berarti membuatnya bangun dari pembaringan. 'Membangunkan' alami dalam konteks tersebut dan tetap mempertahankan diksi bangkit/bangun tanpa menjadikannya pernyataan eksplisit tentang kebangkitan.
- source_word: κρατήσας τῆς χειρός
  choice: memegang tangannya
  rationale: Ungkapan ini menyatakan bahwa Yesus memegang tangan perempuan itu ketika membangunkannya. Bentuk posesif 'tangannya' lebih alami daripada terjemahan harfiah konstruksi genitif Yunani.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: Demam itu pun meninggalkannya
  rationale: Susunan ini mempertahankan demam sebagai subjek gramatikal dan gambaran bahwa penyakit itu pergi meninggalkan perempuan tersebut.
- source_word: διηκόνει
  choice: melayani
  rationale: Imperfek dapat menggambarkan tindakan melayani yang berlangsung tanpa harus secara leksikal menyatakan permulaannya. Konteks memungkinkan arti 'mulai melayani', sehingga alternatif itu dicatat dalam catatan kaki.
- source_word: αὐτοῖς
  choice: mereka
  rationale: Pronomina datif jamak menunjuk kepada Yesus dan orang-orang yang hadir bersama-Nya, bukan hanya kepada Yesus.
theological_decisions:
- issue: Kemungkinan gema bahasa kebangkitan dalam ἐγείρω
  choice: membangunkan dia
  alternative: membantu dia bangun
  rationale: Pilihan ini mempertahankan unsur 'bangun' dalam verba Yunani, tetapi konteksnya tetap jelas sebagai penyembuhan, bukan peristiwa kebangkitan.
- issue: Aspek imperfek διηκόνει
  choice: ia melayani mereka
  alternative: ia mulai melayani mereka
  rationale: Imperfek tidak dengan sendirinya menuntut makna ingresif. Terjemahan utama tidak menambahkan 'mulai', sedangkan kemungkinan bahwa pelayanan itu langsung dimulai sebagai hasil penyembuhan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Urutan tindakan Yunani dialihkan menjadi rangkaian verba yang lancar; 'pun' menandai hasil langsung tanpa menambahkan gagasan yang tidak ada dalam teks.
