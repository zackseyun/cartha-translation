lexical_decisions:
- source_word: εὐθὺς
  choice: saat itu juga
  rationale: Ungkapan ini mempertahankan gerak narasi Markus yang cepat dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἦν
  choice: ada
  rationale: Bentuk εἰμί di sini bersifat eksistensial; 'ada' secara alami menyatakan kehadiran orang itu di sinagoge.
- source_word: συναγωγῇ αὐτῶν
  choice: sinagoge mereka
  rationale: '''Sinagoge'' tepat untuk tempat ibadah Yahudi dalam konteks ini, sedangkan ''mereka'' mempertahankan αὐτῶν.'
- source_word: ἄνθρωπος
  choice: seorang
  rationale: Dalam konstruksi Indonesia, 'seorang' secara alami menunjukkan satu orang; konteks selanjutnya memperkenalkan individu laki-laki tanpa perlu menambahkan kata 'laki-laki' secara kaku.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: yang dirasuki roh najis
  rationale: Secara harfiah ungkapan ini berbunyi 'dalam roh najis', tetapi itu tidak alami dan kabur dalam bahasa Indonesia. 'Dirasuki roh najis' menyampaikan relasi yang dimaksud dalam konteks, sementara catatan kaki mempertahankan bentuk harfiahnya.
- source_word: ἀκαθάρτῳ
  choice: najis
  rationale: '''Najis'' mempertahankan konotasi ketidakmurnian ritual dan moral yang lazim dalam bahasa Alkitab sekaligus tetap mudah dipahami.'
- source_word: ἀνέκραξεν
  choice: berteriak
  rationale: Kata ini menyatakan seruan keras; 'berteriak' alami dan cukup kuat tanpa menentukan emosi secara berlebihan.
theological_decisions:
- issue: Bahasa tentang gangguan roh dalam ἐν πνεύματι ἀκαθάρτῳ
  choice: dirasuki roh najis
  alternative: dalam roh najis; bersama roh najis
  rationale: '''Dirasuki'' merupakan ungkapan Indonesia yang jelas untuk keadaan yang digambarkan, tetapi lebih interpretatif daripada bentuk Yunani. Karena itu, bentuk yang lebih harfiah dicantumkan dalam catatan agar nuansa sumber tetap terlihat.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dipecah setelah penyebutan roh najis agar alurnya jelas. Istilah 'sinagoge' dan 'roh najis' dipertahankan sebagai kosakata konteks Yahudi dan Injil yang mapan.
