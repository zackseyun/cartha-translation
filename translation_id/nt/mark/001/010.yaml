  text: καὶ ⸀εὐθὺς ἀναβαίνων ⸀ἐκ τοῦ ὕδατος εἶδεν σχιζομένους τοὺς οὐρανοὺς καὶ τὸ πνεῦμα ⸀ὡς περιστερὰν καταβαῖνον ⸀εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/010.yaml
  text: And immediately[a], as he was coming up out of the water[b], he saw the heavens being torn open and the Spirit descending like a dove upon him.
translation:
  language: id
  text: Saat Yesus keluar dari air, ia segera melihat langit terkoyak[a] dan Roh turun seperti burung merpati ke atasnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “langit terbelah.” Kata Yunaninya lebih kuat daripada sekadar “terbuka.”
    reason: lexical_alternative
  - marker: b
    text: Atau “ke dalam dirinya.” Kata Yunani yang dipakai dapat berarti “ke dalam”, tetapi dalam konteks turunnya Roh, “ke atasnya” paling sesuai dengan maksud ungkapan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: segera
  rationale: Mempertahankan desakan waktu yang khas dalam narasi Markus dengan ungkapan Indonesia yang alami.
- source_word: ἀναβαίνων ἐκ τοῦ ὕδατος
  choice: setelah Yesus keluar dari air
  rationale: Menyampaikan tindakan yang berlangsung beriringan dengan tindakan utama secara alami; nama Yesus dipakai untuk menghindari ambiguitas pronomina dalam bahasa Indonesia.
- source_word: εἶδεν
  choice: ia melihat
  rationale: Padanan langsung bagi verba persepsi bentuk aoristus tanpa menambahkan tindakan lain.
- source_word: σχιζομένους τοὺς οὐρανούς
  choice: langit terkoyak
  rationale: Kata 'terkoyak' mempertahankan daya gambaran σχίζω yang lebih kuat daripada sekadar 'terbuka'; 'langit' merupakan bentuk Indonesia yang alami untuk οὐρανούς dalam konteks ini.
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Huruf kapital menandai bahwa yang dimaksud ialah Roh ilahi, sementara tidak menambahkan kata 'Kudus' yang tidak terdapat dalam ayat Yunani.
- source_word: ὡς περιστερὰν
  choice: seperti burung merpati
  rationale: Mempertahankan perbandingan tanpa menentukan apakah keserupaannya menyangkut rupa, gerak, atau keduanya.
- source_word: καταβαῖνον
  choice: turun
  rationale: Padanan ringkas dan alami bagi καταβαίνω dalam narasi Indonesia.
- source_word: εἰς αὐτόν
  choice: ke atasnya
  rationale: Mengikuti makna kontekstual datangnya Roh kepada dan atas Yesus, sambil mencatat kemungkinan lebih harfiah 'ke dalam dirinya'.
theological_decisions:
- issue: Rujukan τὸ πνεῦμα
  choice: Roh ilahi, diterjemahkan 'Roh'
  alternative: '''Roh Kudus'''
  rationale: Konteks menunjuk kepada Roh Allah, tetapi teks Yunani hanya berbunyi 'Roh'; terjemahan tidak menambahkan sebutan 'Kudus'.
- issue: Sifat perbandingan dengan merpati
  choice: Dibiarkan terbuka melalui 'seperti burung merpati'
  alternative: Roh berwujud merpati atau turun dengan gerakan seperti merpati
  rationale: ὡς menandai perbandingan tanpa menjelaskan titik keserupaannya.
- issue: Arah εἰς αὐτόν
  choice: '''ke atasnya'' sebagai makna kontekstual'
  alternative: '''ke dalam dirinya'''
  rationale: εἰς secara leksikal dapat berarti 'ke dalam', tetapi dengan verba 'turun' ungkapan ini secara kontekstual dapat menyatakan gerak menuju dan atas Yesus; alternatif dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan khidmat. Susunan kalimat dibuat alami tanpa menghilangkan kegentingan narasi atau kekuatan gambaran langit yang terkoyak.
