  rationale: Revisi mengganti ungkapan yang berfokus pada ‘kuasa’ dengan “dengan wibawa” untuk mencerminkan κατ’ ἐξουσίαν secara lebih tepat. Susunan percakapan diperhalus tanpa menambahkan objek yang tidak dinyatakan sumber. Tanda pisah mempertahankan pembacaan seruan dalam teks utama, sedangkan catatan kaki mempertahankan kemungkinan pembacaan interogatif.
