  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐθαμβήθησαν ⸀ἅπαντες, ὥστε συζητεῖν ⸂πρὸς ἑαυτοὺς⸃ λέγοντας· Τί ἐστιν τοῦτο; ⸂διδαχὴ καινή⸃· κατ’ ἐξουσίαν καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις ἐπιτάσσει, καὶ ὑπακούουσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/027.yaml
  text: And they were all amazed[a], so that they discussed among themselves, saying, “What is this? A new teaching with authority! He even commands the unclean spirits, and they obey him.”
translation:
  language: id
  text: Mereka semua takjub[a], sehingga mereka saling berdiskusi sambil berkata, “Apa ini? Ajaran baru—dengan wibawa! Ia bahkan memerintahkan roh-roh najis, dan mereka menaati-Nya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apa ini? Apa ini ajaran baru dengan wibawa?” Teks Yunani dapat diberi tanda baca sehingga “ajaran baru” lebih langsung menjadi bagian dari pertanyaan itu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐθαμβήθησαν
  choice: takjub
  rationale: Bentuk pasif ini menggambarkan orang-orang yang diliputi rasa heran yang kuat; “takjub” alami dalam bahasa Indonesia dan tidak melebih-lebihkan intensitasnya.
- source_word: ἅπαντες
  choice: semua
  rationale: Menjaga penekanan pada keseluruhan orang yang hadir.
- source_word: ὥστε συζητεῖν πρὸς ἑαυτούς
  choice: sehingga mereka membicarakannya satu sama lain
  rationale: ὥστε dengan infinitif menyatakan akibat, sedangkan συζητέω dan πρὸς ἑαυτούς menggambarkan pembicaraan timbal balik dalam kelompok; “membicarakannya” memakai objek tersirat yang wajar dalam bahasa Indonesia.
- source_word: Τί ἐστιν τοῦτο;
  choice: Apa ini?
  rationale: Mempertahankan pertanyaan langsung dan reaksi spontan dalam bahasa Indonesia yang ringkas.
- source_word: διδαχὴ καινή
  choice: Suatu ajaran baru
  rationale: “Ajaran” merupakan padanan modern yang wajar untuk διδαχή dan tidak seteknis “doktrin”; “suatu” mendukung pembacaan sebagai seruan terpisah.
- source_word: κατ’ ἐξουσίαν
  choice: yang penuh kuasa
  rationale: Mengungkapkan sifat berwibawa dan berkuasa dari ajaran serta tindakan Yesus dengan frasa Indonesia yang alami, sambil tidak membatasi kaitannya hanya pada verba berikutnya.
- source_word: τοῖς πνεύμασι τοῖς ἀκαθάρτοις
  choice: roh-roh najis
  rationale: “Najis” mempertahankan cakupan ritual dan moral ἀκάθαρτος lebih baik daripada padanan yang lebih lunak seperti “tidak murni”.
- source_word: ἐπιτάσσει
  choice: diperintah-Nya
  rationale: Bentuk pasif Indonesia menempatkan “bahkan roh-roh najis pun” di depan secara alami dan tetap menyatakan perintah Yesus yang berkuasa.
- source_word: ὑπακούουσιν αὐτῷ
  choice: mereka taat kepada-Nya
  rationale: Menyampaikan respons patuh terhadap perintah dengan jelas; “mereka” merujuk kepada roh-roh najis.
theological_decisions:
- issue: Hubungan κατ’ ἐξουσίαν dengan struktur kalimat
  choice: Menerjemahkan “Suatu ajaran baru yang penuh kuasa!” sebagai penilaian seruan yang menghubungkan kuasa secara langsung dengan ajaran, sementara kalimat berikutnya memperlihatkan kuasa itu dalam perintah kepada roh-roh najis.
  alternative: '“Apa ini? Apa ini ajaran baru yang penuh kuasa?” atau menghubungkan frasa itu terutama dengan verba berikutnya: “Dengan kuasa Ia memerintah bahkan roh-roh najis.”'
  rationale: Sintaksis dan tanda baca Yunani memungkinkan lebih dari satu hubungan. Teks utama mengikuti pembacaan seruan yang alami, sedangkan catatan kaki mempertahankan kemungkinan bahwa seluruh frasa merupakan pertanyaan.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Bentuk penghormatan “-Nya/kepada-Nya” dipakai untuk rujukan kepada Yesus sesuai kebiasaan penerbitan Alkitab Indonesia; “mereka” bagi roh-roh mempertahankan personifikasi gramatikal dan tindakan sadar dalam konteks.
