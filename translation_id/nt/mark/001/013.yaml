base_translation:
  language: en
  yaml_path: translation/nt/mark/001/013.yaml
  text: And he was in the wilderness forty days[a], being tempted by Satan; and he was with the wild animals, and the angels were ministering to him.
translation:
  language: id
  text: Ia berada di padang belantara selama empat puluh hari dan dicobai oleh Iblis.[a] Ia berada bersama binatang liar, dan para malaikat melayani-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diuji oleh Iblis.” Kata kerja Yunani yang digunakan dapat berarti “dicobai” atau “diuji”, tetapi “dicobai” paling sesuai karena Iblis disebut langsung sebagai pelakunya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρήμῳ
  choice: padang belantara
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menggambarkan tempat sunyi serta liar tanpa mempersempit maknanya menjadi gurun pasir.
- source_word: τεσσεράκοντα ἡμέρας
  choice: selama empat puluh hari
  rationale: Kata 'selama' memperjelas fungsi akusatif yang menyatakan durasi, sementara gema alkitabiah angka empat puluh dibiarkan tersirat.
- source_word: πειραζόμενος
  choice: dicobai
  rationale: Kata Yunani ini dapat berarti dicobai atau diuji. Karena Iblis disebut sebagai pelakunya, 'dicobai' paling wajar, tetapi alternatif 'diuji' dipertahankan dalam catatan kaki.
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: oleh Iblis
  rationale: '''Iblis'' merupakan sebutan baku dan mudah dipahami dalam bahasa Indonesia bagi tokoh adikodrati yang dimaksud oleh Σατανᾶς.'
- source_word: μετὰ τῶν θηρίων
  choice: bersama binatang-binatang liar
  rationale: Pilihan ini mempertahankan arti keberadaan bersama satwa liar tanpa menambahkan apakah kehadiran mereka mengancam atau damai.
- source_word: ἄγγελοι
  choice: para malaikat
  rationale: Dalam konteks Iblis dan pelayanan adikodrati, kata ini menunjuk pada makhluk surgawi, bukan utusan manusia.
- source_word: διηκόνουν αὐτῷ
  choice: melayani-Nya
  rationale: Bentuk imperfek menyiratkan tindakan yang berlangsung; 'melayani' mempertahankan cakupan makna tanpa menentukan bentuk pelayanannya.
- source_word: καὶ ἦν ... καὶ ἦν ... καὶ
  choice: Ia berada ... dan ... Ia tinggal ... dan ...
  rationale: Hubungan koordinatif khas Markus tetap tampak melalui pengulangan 'dan', tetapi pembagian menjadi dua kalimat menjaga kelancaran bahasa Indonesia modern.
theological_decisions:
- issue: Makna πειραζόμενος dalam kaitannya dengan Iblis
  choice: dicobai
  alternative: diuji
  rationale: Pelaku yang disebutkan, yaitu Iblis, mendukung nuansa godaan yang bermusuhan. Namun, karena verba Yunani juga dapat menyatakan pengujian, kemungkinan itu tidak dihapus dan dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Padang belantara' dipilih daripada 'gurun' agar tidak menyiratkan secara khusus bentang alam berpasir. Kapitalisasi pronomina '-Nya' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Yesus.
