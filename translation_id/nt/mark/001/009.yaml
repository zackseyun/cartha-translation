source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις ἦλθεν Ἰησοῦς ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας καὶ ἐβαπτίσθη ⸂εἰς τὸν Ἰορδάνην ὑπὸ Ἰωάννου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/009.yaml
  text: And it happened in those days that Jesus came from Nazareth of Galilee and was baptized in the Jordan by John[a].
translation:
  language: id
  text: Pada hari-hari itu, Yesus datang dari Nazaret di Galilea dan dibaptis oleh Yohanes di Sungai Yordan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke dalam Sungai Yordan.” Preposisi Yunani dapat diterjemahkan secara lebih harfiah demikian.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις
  choice: Pada hari-hari itu
  rationale: Ungkapan Yunani ini berfungsi sebagai peralihan naratif dan penanda waktu. Dalam bahasa Indonesia modern, “Pada hari-hari itu” menyampaikan fungsinya secara alami tanpa ungkapan berlebih seperti “terjadilah.”
- source_word: ἦλθεν
  choice: datang
  rationale: Menerjemahkan verba gerak dasar secara langsung tanpa menambahkan penekanan pada tibanya di tujuan.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας
  choice: dari Nazaret di Galilea
  rationale: “Di Galilea” secara alami menjelaskan lokasi Nazaret dalam bahasa Indonesia dan tetap setia pada hubungan geografis yang dinyatakan oleh bentuk genitif Yunani.
- source_word: ἐβαπτίσθη
  choice: dibaptis
  rationale: Bentuk pasif ini menyatakan peristiwa baptisan tanpa mempersempit maknanya menjadi cara pelaksanaan tertentu yang diperdebatkan antardenominasi.
- source_word: εἰς τὸν Ἰορδάνην
  choice: di Sungai Yordan
  rationale: Dalam konteks baptisan, “di” merupakan ungkapan lokasi yang alami dalam bahasa Indonesia. Penambahan “Sungai” menjernihkan nama geografis yang lazim disebut Sungai Yordan dalam bahasa Indonesia; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ὑπὸ Ἰωάννου
  choice: oleh Yohanes
  rationale: ὑπό dengan genitif menandai pelaku dalam konstruksi pasif, sehingga “oleh Yohanes” merupakan padanan langsung dan alami.
theological_decisions:
- issue: Penerjemahan βαπτίζω dalam konteks yang sensitif secara denominasi
  choice: dibaptis
  alternative: dibenamkan
  rationale: “Dibaptis” melaporkan peristiwa tersebut dengan setia tanpa menetapkan cara pelaksanaan yang lebih sempit daripada yang perlu dinyatakan oleh ayat ini.
- issue: Makna preposisi εἰς pada lokasi baptisan
  choice: di Sungai Yordan
  alternative: ke dalam Sungai Yordan
  rationale: “Di” menghasilkan bahasa Indonesia yang wajar untuk lokasi tindakan baptisan, sedangkan “ke dalam” mempertahankan kemungkinan nuansa gerak dari εἰς. Ambiguitas leksikal ini dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dibuat alami dengan menempatkan pelaku “oleh Yohanes” sebelum keterangan tempat, sementara isi dan urutan peristiwa tetap dipertahankan.
