  text: καὶ ⸀εὐθὺς ἐκάλεσεν αὐτούς. καὶ ἀφέντες τὸν πατέρα αὐτῶν Ζεβεδαῖον ἐν τῷ πλοίῳ μετὰ τῶν μισθωτῶν ἀπῆλθον ὀπίσω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/020.yaml
  text: And immediately he called them[a], and leaving their father Zebedee in the boat with the hired workers, they went after him.
translation:
  language: id
  text: Ia segera memanggil mereka. Mereka pun meninggalkan ayah mereka, Zebedeus, di dalam perahu bersama para pekerja upahan, lalu pergi mengikuti dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pergi di belakang dia.” Ungkapan Yunani ini dapat menunjuk pada gerak fisik maupun pada mulai mengikuti dia sebagai murid.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: segera
  rationale: Mempertahankan penanda waktu yang khas dalam Injil Markus sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: ἐκάλεσεν
  choice: memanggil
  rationale: Padanan langsung yang tidak mempersempit makna menjadi sekadar mengundang atau secara khusus memerintah.
- source_word: ἀφέντες
  choice: meninggalkan
  rationale: Menyatakan tindakan yang mendahului tindakan utama tanpa menambahkan kesan keras seperti 'menelantarkan'.
- source_word: πατέρα αὐτῶν Ζεβεδαῖον
  choice: ayah mereka, Zebedeus
  rationale: Susunan ini alami dalam bahasa Indonesia dan mempertahankan hubungan keluarga serta nama diri dalam teks Yunani.
- source_word: ἐν τῷ πλοίῳ
  choice: di dalam perahu
  rationale: Sesuai dengan konteks perahu nelayan di Galilea; 'kapal' dapat memberi kesan sarana angkut yang lebih besar.
- source_word: μετὰ τῶν μισθωτῶν
  choice: bersama para pekerja upahan
  rationale: Menunjukkan orang-orang yang bekerja dengan menerima upah tanpa menganggap mereka pekerja harian atau pegawai dalam pengertian modern.
- source_word: ἀπῆλθον ὀπίσω αὐτοῦ
  choice: pergi mengikuti dia
  rationale: Ungkapan Indonesia yang alami dan tetap memuat gerak fisik serta awal tindakan mengikuti sebagai murid.
theological_decisions:
- issue: Nuansa pemuridan dalam ὀπίσω αὐτοῦ
  choice: pergi mengikuti dia
  alternative: pergi di belakang dia
  rationale: Konteks memungkinkan makna gerak secara harfiah dan tindakan menjadi pengikut. Terjemahan utama mempertahankan keduanya secara alami, sedangkan catatan kaki menyatakan kemungkinan spasialnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Partikel 'pun' dan 'lalu' mengalirkan urutan tindakan yang dalam bahasa Yunani dihubungkan berulang kali dengan καί. Kata ganti 'dia' ditulis menurut kaidah umum bahasa Indonesia tanpa menambahkan kapitalisasi teologis yang tidak ditandai dalam sumber Yunani.
