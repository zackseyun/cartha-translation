base_translation:
  language: en
  yaml_path: translation/nt/mark/001/002.yaml
  text: 'Just as it is written in Isaiah the prophet: ‘Behold[a], I send my messenger before your face[c][b], who will prepare your way.’'
translation:
  language: id
  text: 'Seperti yang tertulis dalam kitab Nabi Yesaya: “Lihatlah, aku mengutus utusanku mendahului engkau,[a] yang akan mempersiapkan jalanmu.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di depan wajahmu”; maksudnya, “di depanmu” atau “mendahuluimu.”
    reason: lexical_alternative
  - marker: b
    text: Sejumlah naskah berbunyi “dalam kitab para nabi” alih-alih “dalam kitab Nabi Yesaya.” Kutipan ini memadukan kata-kata dari Maleakhi 3:1 dan Yesaya 40:3.
    reason: textual_variant_and_cross_reference
lexical_decisions:
- source_word: Καθὼς
  choice: Seperti
  rationale: Memperkenalkan kesesuaian dengan kutipan yang menyusul secara alami dalam bahasa Indonesia.
- source_word: γέγραπται
  choice: yang tertulis
  rationale: Mencerminkan rumusan kutipan Kitab Suci dalam bentuk pasif perfektif yang menekankan keadaan teks yang tetap tertulis.
- source_word: ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ
  choice: dalam kitab Nabi Yesaya
  rationale: Dalam bahasa Indonesia, penambahan implisit 'kitab' menjelaskan bahwa yang dimaksud ialah tulisan yang dikaitkan dengan Nabi Yesaya, bukan keberadaan secara harfiah di dalam pribadi Yesaya.
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan fungsi seruan untuk menarik perhatian dan tetap terdengar wajar serta khidmat dalam bahasa Indonesia modern.
- source_word: ἀποστέλλω
  choice: Aku mengutus
  rationale: Bentuk kini Yunani diterjemahkan dengan bentuk Indonesia yang alami dan langsung dalam ujaran profetis.
- source_word: ἄγγελόν
  choice: utusan
  rationale: Konteks menunjuk kepada seorang pendahulu manusia; arti umum kata tersebut adalah pembawa pesan atau utusan, bukan harus makhluk surgawi.
- source_word: πρὸ προσώπου σου
  choice: mendahului Engkau
  rationale: Mengungkapkan makna idiomatis 'di depanmu/sebelum engkau' secara alami sambil mempertahankan arah dan fungsi sang utusan sebagai pendahulu.
- source_word: κατασκευάσει
  choice: akan mempersiapkan
  rationale: Menyatakan tindakan membuat siap dengan tepat dan jelas.
- source_word: τὴν ὁδόν σου
  choice: jalan-Mu
  rationale: Mempertahankan gambaran jalan serta kemungkinan daya kiasannya.
theological_decisions:
- issue: Rumusan kutipan menyebut Nabi Yesaya, sedangkan kata-kata kutipan memadukan bahan yang berkaitan dengan Maleakhi 3:1 dan Yesaya 40:3.
  choice: Mempertahankan 'dalam kitab Nabi Yesaya' dalam teks utama.
  alternative: dalam kitab para nabi
  rationale: SBLGNT menyajikan bacaan yang secara khusus menyebut Yesaya. Ketegangan dengan sumber gabungan tidak diselaraskan dalam terjemahan, sedangkan varian naskah dan latar kutipan dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan khidmat. Huruf kapital pada kata ganti yang merujuk kepada tokoh ilahi mengikuti kebiasaan ejaan Alkitab bahasa Indonesia; kapitalisasi itu tidak dimaksudkan untuk menghilangkan ketegangan referensial dalam kutipan.
