id: MRK.1.28
reference: Mark 1:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂καὶ ἐξῆλθεν⸃ ἡ ἀκοὴ αὐτοῦ εὐθὺς ⸀πανταχοῦ εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/028.yaml
  text: And the news about him went out at once everywhere into the whole surrounding region of Galilee[a][b].
translation:
  language: id
  text: Kabar tentang Dia pun segera tersebar ke mana-mana di seluruh daerah sekitar Galilea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “laporan tentang Dia” atau “berita tentang Dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: tersebar
  rationale: Dalam konteks kabar, bentuk aoristus ἐξέρχομαι menggambarkan kabar yang bergerak keluar. 'Tersebar' merupakan ungkapan Indonesia yang alami dan tetap mempertahankan gagasan penyebaran keluar.
- source_word: ἀκοὴ
  choice: kabar
  rationale: ἀκοή di sini berarti sesuatu yang didengar, yakni kabar atau laporan tentang Yesus. 'Kabar' alami dalam bahasa Indonesia dan tidak menambahkan gagasan ketenaran.
- source_word: αὐτοῦ
  choice: tentang Dia
  rationale: Genitif ini paling wajar dipahami sebagai penanda isi kabar, bukan kepemilikan; karena itu diterjemahkan 'tentang Dia'.
- source_word: εὐθὺς
  choice: segera
  rationale: '''Segera'' menyampaikan kecepatan tindakan yang khas dalam narasi Markus dengan bahasa Indonesia baku dan ringkas.'
- source_word: πανταχοῦ
  choice: ke mana-mana
  rationale: Ungkapan ini menyampaikan arti adverbial 'di segala tempat' secara alami dalam konteks kabar yang tersebar.
- source_word: περίχωρον
  choice: daerah sekitar
  rationale: περίχωρος menunjuk wilayah atau daerah di sekeliling suatu tempat. 'Daerah sekitar' jelas tanpa mempersempitnya menjadi pedesaan.
- source_word: εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας
  choice: di seluruh daerah sekitar Galilea
  rationale: Walaupun εἰς secara harfiah dapat menyatakan gerak 'ke dalam', bersama verba penyebaran frasa ini secara alami menyatakan jangkauan kabar di seluruh wilayah sekitar Galilea. 'Di seluruh' menghindari susunan Indonesia yang kaku.
theological_decisions:
- issue: Rujukan ἀκοὴ αὐτοῦ
  choice: kabar tentang Dia
  alternative: nama-Nya menjadi terkenal
  rationale: Teks menggambarkan tersebarnya apa yang didengar mengenai Yesus. Pilihan ini tidak memperkuat maknanya menjadi ketenaran atau reputasi.
- issue: Hubungan περίχωρον dengan Galilea
  choice: daerah sekitar Galilea
  alternative: seluruh wilayah Galilea dan sekitarnya
  rationale: Genitif τῆς Γαλιλαίας dibiarkan memiliki hubungan geografis yang ringkas sebagaimana teks Yunani. Terjemahan tidak menambahkan cakupan ganda yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan mudah dipahami. Partikel 'pun' menghubungkan akibat peristiwa sebelumnya secara alami; huruf kapital pada 'Dia' mengikuti konvensi penghormatan yang lazim dalam penerbitan Alkitab bahasa Indonesia.
