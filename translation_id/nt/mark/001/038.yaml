  text: καὶ λέγει αὐτοῖς· Ἄγωμεν ⸀ἀλλαχοῦ εἰς τὰς ἐχομένας κωμοπόλεις, ἵνα καὶ ἐκεῖ κηρύξω, εἰς τοῦτο γὰρ ⸀ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/038.yaml
  text: And he said to them[a], “Let us go elsewhere, to the neighboring towns, so that I may preach there also[b], for that is why I came out.”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Marilah kita pergi ke tempat lain, ke kota-kota kecil yang berdekatan[b], supaya Aku juga berkhotbah di sana, sebab untuk itulah Aku keluar[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk tujuan inilah Aku keluar.” Ungkapan ini dapat menunjuk sekadar pada tindakan Yesus meninggalkan tempat itu, atau secara lebih luas pada tujuan-Nya pergi untuk berkhotbah.
    reason: alternative_reading
  - marker: b
    text: Istilah Yunani yang diterjemahkan “kota-kota kecil” dapat menunjuk pada permukiman yang berada di antara desa dan kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγωμεν
  choice: Marilah kita pergi
  rationale: Subjungtif hortatoris orang pertama jamak menyatakan ajakan; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya ajaknya.
- source_word: ἀλλαχοῦ
  choice: ke tempat lain
  rationale: Adverbia ini berarti ‘di tempat lain’ atau, dengan verba gerak, ‘ke tempat lain’; pilihan ini sesuai dengan konteks perpindahan.
- source_word: ἐχομένας
  choice: di sekitar sini
  rationale: Partisip ini dipakai secara idiomatis untuk tempat-tempat yang berdekatan atau berikutnya; frasa ini menyampaikan kedekatan geografis secara alami.
- source_word: κωμοπόλεις
  choice: kota-kota kecil
  rationale: Istilah ini menunjuk pada permukiman kecil dengan ciri di antara desa dan kota. ‘Kota-kota kecil’ jelas dan wajar, sementara catatan kaki mempertahankan nuansa leksikalnya.
- source_word: ἵνα καὶ ἐκεῖ κηρύξω
  choice: supaya Aku juga berkhotbah di sana
  rationale: ἵνα menyatakan tujuan, καὶ ἐκεῖ menekankan ‘juga di sana’, dan ‘berkhotbah’ memungkinkan κηρύσσω dipakai tanpa menambahkan objek yang tidak dinyatakan dalam teks Yunani.
- source_word: εἰς τοῦτο
  choice: untuk itulah
  rationale: Ungkapan ini menyatakan tujuan atau alasan; bentuk tersebut ringkas, alami, dan mempertahankan hubungan penjelasannya.
- source_word: ἐξῆλθον
  choice: Aku keluar
  rationale: Terjemahan harfiah ini tidak menetapkan apakah yang dimaksud ialah keluar dari tempat saat itu atau, secara lebih luas, tampil untuk pelayanan pemberitaan.
- source_word: λέγει αὐτοῖς
  choice: Ia berkata kepada mereka
  rationale: Present historis Yunani dialihkan ke bentuk naratif Indonesia yang lazim tanpa mengubah makna.
theological_decisions:
- issue: Cakupan makna ἐξῆλθον
  choice: Aku keluar
  alternative: Aku pergi dari sini; Aku datang untuk tujuan ini
  rationale: Bahasa Yunani dapat menunjuk secara setempat pada tindakan meninggalkan rumah atau lokasi itu, tetapi dalam konteksnya juga dapat mengandung nuansa tujuan pelayanan yang lebih luas. Terjemahan utama mempertahankan ketaksaan tersebut tanpa menegaskan asal-usul atau misi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kapitalisasi kata ganti yang merujuk kepada Yesus mengikuti kebiasaan luas penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan pada unsur yang benar-benar dijelaskannya.
