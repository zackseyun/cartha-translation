  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/003.yaml
  text: 'A voice of one crying out in the wilderness: ‘Prepare the way of the Lord[b][a]; make his paths straight,’'
translation:
  language: id
  text: Ada suara orang yang berseru-seru di padang belantara, “Siapkanlah jalan bagi Tuhan[b]; luruskanlah jalan-jalan-Nya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dengan tanda baca lain pada kutipan dari Yesaya: “Ada suara orang yang berseru-seru, ‘Di padang belantara siapkanlah jalan bagi Tuhan ….’”'
    reason: alternative_reading
  - marker: b
    text: “Tuhan” menerjemahkan kata Yunani kyriou. Kutipan ini menggemakan Yesaya 40:3, yang dalam teks Ibraninya merujuk kepada TUHAN (YHWH).
    reason: cross_reference
lexical_decisions:
- source_word: φωνὴ
  choice: Ada suara
  rationale: Dalam bahasa Indonesia, konstruksi eksistensial ini memperkenalkan suara yang belum disebut sebelumnya secara alami, tanpa mengharuskan kata sandang yang tidak dimiliki bahasa Indonesia.
- source_word: βοῶντος
  choice: orang yang berseru-seru
  rationale: Partisipel genitif ini bergantung pada φωνή. 'Berseru-seru' menyampaikan seruan lantang seorang pembawa berita dan lebih kuat daripada sekadar 'memanggil'.
- source_word: ἐν τῇ ἐρήμῳ
  choice: di padang belantara
  rationale: ἔρημος menunjuk wilayah sunyi dan tidak berpenghuni, tidak selalu gurun pasir. 'Padang belantara' cocok dengan latar Yohanes dalam Markus serta gaung nubuat Yesaya.
- source_word: Ἑτοιμάσατε
  choice: Siapkanlah
  rationale: Imperatif aoristus jamak menyerukan tindakan persiapan yang tegas. Akhiran '-lah' memberi bentuk perintah yang wajar dan bermartabat.
- source_word: τὴν ὁδὸν κυρίου
  choice: jalan bagi Tuhan
  rationale: ὁδός mempertahankan citra jalan sekaligus makna kiasan. Walaupun genitif κυρίου secara harfiah dapat diterjemahkan 'jalan Tuhan', 'jalan bagi Tuhan' secara alami menyatakan jalan yang harus disiapkan untuk kedatangan-Nya tanpa mengubah acuannya.
- source_word: εὐθείας ποιεῖτε
  choice: luruskanlah
  rationale: Ungkapan harfiah 'buatlah menjadi lurus' secara idiomatis dipadatkan menjadi 'luruskanlah', tetap mempertahankan daya imperatif dan makna εὐθείας.
- source_word: τὰς τρίβους αὐτοῦ
  choice: jalan-jalan-Nya
  rationale: τρίβος berarti jalan atau jalur. Bentuk ulang mempertahankan jamak; '-Nya' merujuk kepada Tuhan dan mengikuti konvensi ejaan Indonesia untuk rujukan ilahi.
theological_decisions:
- issue: Penerjemahan κύριος dalam kutipan Yesaya yang teks Ibraninya merujuk kepada YHWH
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani memakai κύριος, sehingga teks utama menerjemahkannya 'Tuhan'. Latar perjanjian dari Yesaya 40:3, tempat teks Ibrani menyebut YHWH, dijelaskan dalam catatan kaki agar gaung tersebut tidak hilang tanpa mengganti bentuk Yunani dengan terjemahan langsung nama ilahi.
- issue: Keterikatan frasa ἐν τῇ ἐρήμῳ ('di padang belantara')
  choice: Dihubungkan dengan orang yang berseru-seru
  alternative: Dihubungkan dengan perintah 'siapkanlah jalan bagi Tuhan'
  rationale: Susunan Yunani Markus paling alami menghubungkan frasa itu dengan βοῶντος. Kemungkinan tanda baca lain dalam kutipan Yesaya dipertahankan melalui catatan kaki, bukan diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak lisan yang bermartabat. 'Padang belantara' dipilih daripada 'gurun' untuk menghindari kesan bahwa lokasi itu harus berupa hamparan pasir. Penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskan; catatan alternatif tanda baca ditempatkan pada akhir kutipan.
