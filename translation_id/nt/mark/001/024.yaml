  terminology: Kapitalisasi pronomina untuk Yesus dan “Yang Kudus” konsisten dengan register penerbitan Alkitab yang dinyatakan. “Membinasakan” memadai untuk ἀπολέσαι dalam konteks ini. Bentuk inklusif “kami,” bukan “kita,” tepat karena Yesus tidak termasuk dalam kelompok pembicara.
