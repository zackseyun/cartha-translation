  text: λέγων· ⸀Τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/024.yaml
  text: saying[a], “What have you to do with us[b], Jesus the Nazarene? Have you come to destroy us? I know who you are—the Holy One of God.”
translation:
  language: id
  text: katanya, “Apa urusan-Mu dengan kami[a], Yesus orang Nazaret[b]? Apakah Engkau datang untuk membinasakan kami? Aku tahu siapa Engkau—Yang Kudus dari Allah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apa hubungan kami dengan-Mu?” Ungkapan Yunani ini menyatakan pemisahan atau permusuhan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Yesus dari Nazaret.” Bahasa Yunani memakai sebutan “orang Nazaret.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: katanya
  rationale: Partisipel ini memperkenalkan ucapan langsung. “Katanya” alami dalam bahasa Indonesia dan tetap menunjukkan bahwa klausa ini melanjutkan tindakan pada konteks sebelumnya.
- source_word: Τί ἡμῖν καὶ σοί
  choice: Apa urusan-Mu dengan kami
  rationale: Ungkapan idiomatis yang secara harfiah berbunyi “apa bagi kami dan bagi-Mu” menyatakan pemisahan atau penolakan dengan nada konfrontatif. Pilihan ini alami dalam bahasa Indonesia tanpa menghilangkan daya permusuhannya.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: Yesus orang Nazaret
  rationale: Bentuk vokatif Ναζαρηνέ menyebut Yesus sebagai orang Nazaret. Terjemahan ini mempertahankan bentuk sebutan tersebut, sedangkan bentuk geografis “Yesus dari Nazaret” dicatat sebagai alternatif.
- source_word: ἦλθες
  choice: Apakah Engkau datang
  rationale: Aoristus dalam pertanyaan langsung ini menyatakan kedatangan yang sedang dipersoalkan beserta tujuannya; bentuk Indonesia ini jelas dan wajar.
- source_word: ἀπολέσαι
  choice: untuk membinasakan
  rationale: Infinitif ini menyatakan tujuan dan dalam konteks pengusiran roh berarti menghancurkan atau membinasakan. “Membinasakan” mempertahankan bobot kuat kata sumber.
- source_word: οἶδά σε τίς εἶ
  choice: Aku tahu siapa Engkau
  rationale: Terjemahan langsung dan alami dari pernyataan pengenalan identitas tersebut.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: Yang Kudus dari Allah
  rationale: Frasa berartikel ini berfungsi sebagai gelar. “Yang Kudus dari Allah” mempertahankan hubungan genitif tanpa memperluasnya menjadi rumusan doktrinal.
theological_decisions:
- issue: Gelar kristologis dalam pengakuan roh najis
  choice: Yang Kudus dari Allah
  alternative: Yang Kudus milik Allah
  rationale: Pilihan utama mempertahankan kekuatan gelar dan ambiguitas hubungan genitif dalam bahasa Yunani, tanpa menambahkan penjelasan kristologis yang tidak dinyatakan teks.
- issue: Bentuk jamak ἡμῖν dan ἡμᾶς dalam ucapan satu roh
  choice: kami
  alternative: kita
  rationale: “Kami” mempertahankan bentuk jamak dan secara alami mengecualikan Yesus sebagai pihak yang disapa. Teks tidak menjelaskan siapa saja yang tercakup dalam bentuk jamak itu, sehingga terjemahan tidak menentukannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia; tanda pisah menandai aposisi gelar pada akhir ucapan.
