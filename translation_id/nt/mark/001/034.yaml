  text: καὶ ἐθεράπευσεν πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις, καὶ δαιμόνια πολλὰ ἐξέβαλεν, καὶ οὐκ ἤφιεν λαλεῖν τὰ δαιμόνια, ὅτι ᾔδεισαν ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/034.yaml
  text: And he healed many who were sick with various diseases[a], and he cast out many demons, and he would not allow the demons to speak, because they knew him.
translation:
  language: id
  text: Ia menyembuhkan banyak orang yang menderita berbagai penyakit dan mengusir banyak setan. Ia tidak mengizinkan setan-setan itu berbicara, karena mereka mengenal Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka tahu siapa Dia.” Secara harfiah teks Yunani berbunyi, “mereka mengenal Dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεράπευσεν
  choice: menyembuhkan
  rationale: Kata θεραπεύω dalam konteks ini berarti menyembuhkan; pilihan ini alami dalam bahasa Indonesia dan mempertahankan tindakan pemulihan yang dinyatakan teks.
- source_word: πολλοὺς κακῶς ἔχοντας
  choice: banyak orang yang menderita
  rationale: Ungkapan idiomatis κακῶς ἔχω berarti berada dalam keadaan sakit. Karena penyakit disebut langsung sesudahnya, 'menderita' menghasilkan kalimat Indonesia yang alami tanpa pengulangan 'sakit ... penyakit'.
- source_word: ποικίλαις νόσοις
  choice: berbagai penyakit
  rationale: Ποικίλος menyatakan keragaman dan νόσος berarti penyakit; padanan ini jelas, ringkas, dan dekat dengan ungkapan Yunani.
- source_word: δαιμόνια πολλὰ ἐξέβαλεν
  choice: mengusir banyak setan
  rationale: Dalam konteks pengusiran roh jahat, ἐκβάλλω menyatakan tindakan mengeluarkan atau mengusir dengan tegas. 'Mengusir' merupakan ungkapan Indonesia yang wajar.
- source_word: οὐκ ἤφιεν
  choice: tidak mengizinkan
  rationale: Ἀφίημι di sini berarti mengizinkan. Bentuk imperfek menggambarkan sikap yang berlangsung dalam adegan; susunan Indonesia ini menyampaikan larangan tersebut secara alami.
- source_word: λαλεῖν
  choice: berbicara
  rationale: Λαλέω berarti berbicara; pilihan ini sesuai dengan register narasi yang bermartabat.
- source_word: ὅτι
  choice: karena
  rationale: Dalam konteks ini ὅτι paling alami dipahami sebagai penghubung kausal yang memberikan alasan mengapa Yesus membungkam setan-setan itu.
- source_word: ᾔδεισαν αὐτόν
  choice: mereka mengenal Dia
  rationale: Teks Yunani secara ringkas memakai objek pronominal 'Dia'. 'Mengenal Dia' mempertahankan bentuk itu dan tidak memperluasnya menjadi pernyataan eksplisit tentang identitas-Nya.
theological_decisions:
- issue: Apakah pengetahuan setan-setan perlu diperluas menjadi pengakuan kristologis yang eksplisit
  choice: mereka mengenal Dia
  alternative: mereka tahu siapa Dia; mereka tahu bahwa Dia adalah Mesias/Anak Allah
  rationale: Ayat ini hanya mengatakan bahwa mereka mengenal Dia. Perluasan menjadi gelar atau pengakuan tertentu akan memasukkan informasi dari konteks lain dan menghilangkan keringkasan serta ketegangan teologis teks ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'Ia' dan 'Dia' dipakai untuk Yesus sesuai konvensi religius Indonesia; pengulangan 'setan-setan itu' memperjelas subjek verba jamak tanpa mengubah makna.
