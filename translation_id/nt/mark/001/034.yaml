  source_fidelity: 'Teks Indonesia menerjemahkan semua unsur utama SBLGNT dengan tepat: tindakan menyembuhkan, banyak orang yang sakit dengan beragam penyakit, pengusiran banyak setan, larangan berkelanjutan untuk berbicara, serta alasan bahwa setan-setan itu mengenal Dia. Frasa “menderita berbagai penyakit” secara idiomatis menyampaikan πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις tanpa kehilangan makna sakit/berpenyakit.'
