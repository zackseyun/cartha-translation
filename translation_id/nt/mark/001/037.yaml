base_translation:
  language: en
  yaml_path: translation/nt/mark/001/037.yaml
  text: And they found him and said to him[a], “Everyone is looking for you.”
translation:
  language: id
  text: Mereka menemukan Dia dan berkata kepada-Nya, “Semua orang sedang mencari Engkau.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὗρον
  choice: menemukan
  rationale: Bentuk aoristus dari εὑρίσκω menyatakan bahwa pencarian itu berhasil; “menemukan” merupakan padanan naratif yang langsung dan alami.
- source_word: λέγουσιν
  choice: berkata
  rationale: Walaupun bentuk Yunaninya adalah kala kini historis, bentuk lampau naratif tersirat secara alami dalam bahasa Indonesia melalui konteks rangkaian peristiwa.
- source_word: ὅτι
  choice: tanda petik pembuka
  rationale: ὅτι memperkenalkan perkataan langsung; dalam bahasa Indonesia modern, hal ini paling alami dinyatakan dengan tanda petik tanpa menambahkan “bahwa”.
- source_word: Πάντες
  choice: Semua orang
  rationale: Bentuk jamak ini secara idiomatis menunjuk kepada orang-orang dalam konteks sekitar, bukan harus berarti setiap manusia tanpa pengecualian.
- source_word: ζητοῦσίν σε
  choice: sedang mencari Engkau
  rationale: ζητέω di sini paling mungkin berarti berusaha menemukan Yesus secara fisik. “Sedang mencari” mempertahankan aspek tindakan yang tengah berlangsung dan terdengar alami dalam bahasa Indonesia.
- source_word: καὶ
  choice: dan
  rationale: Mempertahankan fungsi penghubung sederhana καί serta gaya narasi Markus tanpa menambahkan hubungan waktu atau sebab yang tidak dinyatakan.
- source_word: αὐτὸν / αὐτῷ / σε
  choice: Dia / kepada-Nya / Engkau
  rationale: Kata-kata ganti diterjemahkan sesuai fungsi kasusnya. Huruf kapital mengikuti kebiasaan ejaan Alkitab bahasa Indonesia untuk rujukan kepada Yesus.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Engkau” dipakai dalam sapaan langsung kepada Yesus, sedangkan “Dia” dan “-Nya” dipakai dalam narasi. Tidak diperlukan catatan kaki karena kemungkinan arti “mencari” sudah tercakup secara wajar oleh padanan Indonesia dan tidak menimbulkan perbedaan makna yang cukup besar.
