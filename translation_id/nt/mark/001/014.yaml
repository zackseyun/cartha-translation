  text: ⸂Καὶ μετὰ⸃ τὸ παραδοθῆναι τὸν Ἰωάννην ἦλθεν ὁ Ἰησοῦς εἰς τὴν Γαλιλαίαν κηρύσσων τὸ ⸀εὐαγγέλιον τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/014.yaml
  text: And after John was handed over[a], Jesus came into Galilee[c][b], proclaiming the good news of God.
translation:
  language: id
  text: Setelah Yohanes diserahkan[a], Yesus datang ke Galilea dan memberitakan kabar baik Allah[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setelah Yohanes ditangkap.” Secara lebih harfiah, teks Yunani berbunyi “setelah Yohanes diserahkan”, ungkapan yang juga menggemakan bahasa yang kemudian dipakai Markus dalam kisah penderitaan.
    reason: lexical_alternative
  - marker: b
    text: Atau “Injil Allah.”
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “kabar baik Allah” dapat berarti kabar baik yang berasal dari Allah, merupakan milik Allah, atau berpusat pada Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὸ παραδοθῆναι
  choice: setelah ... diserahkan
  rationale: Konstruksi μετά dengan infinitif berartikel menyatakan waktu, yaitu “setelah”. Kata παραδίδωμι berarti menyerahkan atau membiarkan seseorang jatuh ke tangan pihak lain. “Diserahkan” mempertahankan kaitan verbal dengan bahasa tentang penderitaan Yesus yang muncul kemudian dalam Markus, tanpa menambahkan secara eksplisit tindakan penangkapan.
- source_word: Ἰωάννην
  choice: Yohanes
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia untuk Ἰωάννης.
- source_word: ἦλθεν
  choice: datang
  rationale: Padanan alami bagi bentuk aoristus ἔρχομαι dalam konteks perpindahan Yesus menuju Galilea.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ke Galilea
  rationale: Kata depan εἰς menyatakan gerak menuju atau masuk ke suatu tempat. “Ke Galilea” alami dalam bahasa Indonesia dan tetap mempertahankan arah geraknya.
- source_word: κηρύσσων
  choice: memberitakan
  rationale: Kata κηρύσσω menunjuk pada penyampaian atau pengumuman di hadapan umum. “Memberitakan” menyampaikan makna itu secara wajar tanpa membatasinya pada khotbah formal.
- source_word: εὐαγγέλιον
  choice: kabar baik
  rationale: “Kabar baik” menyampaikan arti leksikal εὐαγγέλιον secara langsung bagi pembaca modern; padanan tradisional “Injil” dicatat sebagai alternatif.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: 'Susunan “kabar baik Allah” mempertahankan keluasan hubungan genitif Yunani: kabar baik itu dapat dipahami berasal dari Allah, menjadi milik-Nya, atau berpusat pada-Nya. Terjemahan yang memakai “dari” atau “tentang” akan mempersempit hubungan tersebut.'
theological_decisions:
- issue: Makna παραδοθῆναι dan kaitannya dengan kosakata penderitaan dalam Markus
  choice: diserahkan
  alternative: ditangkap
  rationale: Markus berulang kali memakai παραδίδωμι untuk penyerahan ke tangan pihak yang bermusuhan, termasuk dalam kisah penderitaan Yesus. “Diserahkan” menjaga gema naratif dan teologis ini, sedangkan “ditangkap” menerangkan peristiwa secara lebih khusus daripada kata Yunani itu sendiri.
- issue: Hubungan genitif dalam τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: kabar baik Allah
  alternative: kabar baik dari Allah; kabar baik tentang Allah
  rationale: 'Genitif Yunani memungkinkan beberapa hubungan makna yang saling berkaitan: kabar baik yang berasal dari Allah, merupakan milik Allah, atau berpusat pada Allah. Teks utama tidak memilih hanya satu di antaranya.'
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Koordinasi “dan memberitakan” dipakai agar partisipel Yunani κηρύσσων terdengar alami dalam narasi Indonesia. Istilah “kabar baik” dipilih untuk kejelasan umum, sementara “Injil” dipertahankan dalam catatan kaki sebagai padanan tradisional.
