translation:
  language: id
  text: Seluruh penduduk kota itu berkumpul di depan pintu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "ke pintu itu." Kata depan Yunani dapat diterjemahkan lebih harfiah demikian, tetapi dalam konteks ini menunjuk pada orang banyak yang berkumpul di pintu masuk rumah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν … ἐπισυνηγμένη
  choice: berkumpul
  rationale: Bentuk imperfek ἦν bersama participel perfekt pasif ἐπισυνηγμένη menggambarkan keadaan yang sedang berlangsung. Dalam bahasa Indonesia, 'berkumpul' menyampaikan keadaan itu secara alami tanpa konstruksi pasif yang kaku.
- source_word: ὅλη ἡ πόλις
  choice: seluruh penduduk kota itu
  rationale: Secara harfiah berarti 'seluruh kota', tetapi yang berkumpul adalah penduduknya. Metonimia ini dinyatakan secara eksplisit agar alami dan jelas dalam bahasa Indonesia, sambil mempertahankan generalisasi kuat dalam teks Yunani.
- source_word: πρὸς τὴν θύραν
  choice: di depan pintu
  rationale: Dengan klausa yang menyatakan keadaan, πρός menunjuk lokasi orang banyak dalam kaitannya dengan pintu. 'Di depan pintu' secara alami menggambarkan mereka berkumpul pada jalan masuk rumah; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: θύραν
  choice: pintu
  rationale: θύρα berarti 'pintu' dan dalam konteks ini merujuk pada pintu atau jalan masuk rumah. 'Pintu' merupakan padanan langsung dan wajar.
