  terminology: “Tahir” tepat sebagai istilah register Alkitab untuk καθαρίσαι dan tidak memaksakan pembacaan semata-mata medis. Kapitalisasi “-Nya” dan “Engkau” konsisten dengan kebiasaan penerbitan Alkitab Indonesia. Catatan kaki b perlu diperbaiki karena bentuk yang tepat ialah “mentahirkan,” bukan “menahirkan.”
