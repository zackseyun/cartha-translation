base_translation:
  language: en
  yaml_path: translation/nt/mark/001/040.yaml
  text: And a man with leprosy comes to him[a], pleading with him and kneeling, and saying to him, “If you are willing[d][c][b], you are able to make me clean.”
translation:
  language: id
  text: Lalu seorang yang menderita penyakit kulit[a] datang kepada-Nya, memohon kepada-Nya sambil berlutut dan berkata, “Kalau Engkau mau, Engkau sanggup menjadikan aku tahir[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang yang berpenyakit kusta.” Istilah Yunani ini mencakup berbagai penyakit kulit dan tidak selalu sama dengan penyakit Hansen yang kini disebut kusta.
    reason: lexical_alternative
  - marker: b
    text: Atau “mentahirkan aku.” Ungkapan Yunani dapat merujuk pada pemulihan dari kenajisan sekaligus pemulihan jasmani.
    reason: lexical_alternative
lexical_decisions:
- source_word: λεπρὸς
  choice: seorang yang menderita penyakit kulit
  rationale: Istilah Yunani ini menunjuk pada orang yang terkena penyakit kulit yang dalam konteks kuno dikategorikan sebagai lepra; ungkapan ini memakai bahasa yang mengutamakan pribadi dan tidak mempersempitnya pada penyakit Hansen modern.
- source_word: παρακαλῶν
  choice: memohon kepada-Nya
  rationale: Dalam konteks ini kata tersebut menyatakan permohonan yang sungguh-sungguh; 'memohon' alami dalam bahasa Indonesia tanpa melebih-lebihkan kadar keputusasaannya.
- source_word: γονυπετῶν
  choice: sambil berlutut
  rationale: Bentuk partisip ini menggambarkan sikap berlutut yang menyertai permohonannya.
- source_word: Ἐὰν θέλῃς
  choice: Kalau Engkau mau
  rationale: Ungkapan ini menyatakan kemauan atau kesediaan Yesus, bukan tindakan masa depan semata; bentuk ini langsung dan alami dalam dialog bahasa Indonesia.
- source_word: δύνασαί
  choice: Engkau sanggup
  rationale: '''Sanggup'' mempertahankan gagasan kemampuan atau kuasa, bukan sekadar izin.'
- source_word: καθαρίσαι
  choice: membuat aku menjadi tahir
  rationale: Pilihan ini mempertahankan bahasa pentahiran dalam teks Yunani serta membuka cakupan pemulihan jasmani dan status ketahiran, tanpa menggantinya dengan kata 'menyembuhkan'.
- source_word: ἔρχεται
  choice: datanglah
  rationale: Bahasa Indonesia lazim memakai bentuk naratif ini; partikel '-lah' memberi gerak narasi yang hidup tanpa memaksakan kala gramatikal yang tidak dimiliki bahasa Indonesia.
theological_decisions:
- issue: Sifat pentahiran dalam konteks penyakit kulit
  choice: membuat aku menjadi tahir
  alternative: menyembuhkan aku
  rationale: Teks memakai καθαρίζω, bukan kata kerja umum untuk menyembuhkan. 'Tahir' mempertahankan ketegangan antara pemulihan jasmani dan pemulihan dari kenajisan ritual.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Sapaan kepada Yesus memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Susunan kalimat menjaga gerak naratif Markus dan hubungan tindakan memohon, berlutut, lalu berkata.
