  source_fidelity: 'Teks Indonesia menyampaikan seluruh rangkaian Yunani dengan setia: waktu yang sangat dini ketika masih gelap (πρωῒ ἔννυχα λίαν), bangun, keluar, pergi menjauh, tujuan ke tempat ἔρημος, dan doa di sana. Pembedaan ἐξῆλθεν dan ἀπῆλθεν dipertahankan melalui “keluar, lalu pergi.” Bentuk “berdoa” tidak secara eksplisit menandai imperfek, tetapi dalam bahasa Indonesia bentuk ini netral terhadap aspek dan tidak meniadakan kemungkinan tindakan yang berlangsung; karena itu cukup memadai tanpa parafrasa berlebihan.'
