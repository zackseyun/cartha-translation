id: MRK.1.35
reference: Mark 1:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ πρωῒ ἔννυχα λίαν ἀναστὰς ἐξῆλθεν καὶ ἀπῆλθεν εἰς ἔρημον τόπον κἀκεῖ προσηύχετο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/035.yaml
  text: And very early[a], while it was still dark, he got up, went out, and went away to a desolate place, and there he was praying.
translation:
  language: id
  text: Pagi-pagi sekali, ketika hari masih gelap, Yesus bangun, keluar, lalu pergi ke tempat yang sunyi[a]. Di sana Ia berdoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat yang sepi,” “tempat terpencil,” atau “daerah belantara.” Kata Yunani ini dapat menggambarkan tempat yang tidak dihuni, tandus, atau berciri belantara.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωῒ ἔννυχα λίαν
  choice: Pagi-pagi sekali, ketika hari masih gelap
  rationale: Gabungan ketiga unsur waktu menyatakan waktu yang sangat dini saat kegelapan masih berlangsung. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan penekanan teks Yunani.
- source_word: ἀναστὰς
  choice: bangun
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba-verba utama; bentuk finit lebih alami dalam narasi bahasa Indonesia.
- source_word: ἐξῆλθεν
  choice: keluar
  rationale: Mempertahankan gerak konkret dari tempat Yesus berada serta membedakannya dari verba gerak berikutnya.
- source_word: ἀπῆλθεν
  choice: lalu pergi
  rationale: Menyatakan gerak menjauh sesudah keluar. 'Lalu' membuat urutan tindakan jelas tanpa menghapus perbedaan kedua verba Yunani.
- source_word: εἰς ἔρημον τόπον
  choice: ke tempat yang sunyi
  rationale: ἔρημος menggambarkan tempat yang sepi, tidak dihuni, atau berciri belantara. 'Tempat yang sunyi' alami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan keluasan maknanya.
- source_word: κἀκεῖ
  choice: Di sana
  rationale: Menyampaikan καὶ ἐκεῖ secara alami sekaligus menghubungkan tindakan berdoa dengan lokasi tersebut.
- source_word: προσηύχετο
  choice: Ia berdoa
  rationale: Imperfek Yunani menggambarkan kegiatan yang sedang atau terus berlangsung. Dalam konteks ini, bentuk 'berdoa' dalam bahasa Indonesia tidak secara wajib membatasi tindakan sebagai sesaat; keduratifannya juga didukung oleh alur narasi.
theological_decisions:
- issue: Penekanan naratif pada doa Yesus
  choice: Menerjemahkan secara langsung bahwa Yesus pergi ke tempat sunyi dan berdoa, tanpa menambahkan penafsiran doktrinal.
  alternative: Menonjolkan tindakan itu sebagai teladan disiplin rohani atau menjelaskan implikasi kristologis doa Yesus.
  rationale: Teks Yunani hanya menarasikan waktu, perpindahan, lokasi, dan tindakan berdoa; kesimpulan teologis tidak boleh dimasukkan ke dalam bunyi ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Nama 'Yesus' dipakai untuk memperjelas subjek yang tersirat dalam verba Yunani dan jelas dari konteks; 'Ia' mempertahankan kesinambungan rujukan. Penanda catatan kaki ditempatkan tepat setelah frasa terkait.
