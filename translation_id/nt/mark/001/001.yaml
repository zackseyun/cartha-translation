  text: Ἀρχὴ τοῦ εὐαγγελίου Ἰησοῦ ⸀χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/001.yaml
  text: The beginning of the good news of Jesus the Messiah[a][b].
translation:
  language: id
  text: Permulaan kabar baik[a] tentang[b] Yesus, Sang Mesias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Injil.” Kata Yunani εὐαγγέλιον dapat diterjemahkan “kabar baik” atau, menurut istilah tradisional, “Injil.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kabar baik Yesus, Sang Mesias.” Bentuk Yunani dapat berarti kabar baik tentang Yesus, tetapi juga dapat mencakup kabar baik yang berasal dari atau diberitakan oleh Yesus.
    reason: source_ambiguity
  - marker: c
    text: Atau “Kristus.” Kata Yunani Χριστός berarti “Mesias” ketika dipakai sebagai gelar.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρχὴ
  choice: Permulaan
  rationale: Nomina pembuka dipertahankan sebagai ungkapan nominal, sehingga dapat berfungsi sebagai judul atau sebagai penanda awal kisah dan pemberitaan tanpa mengubahnya menjadi kalimat lengkap.
- source_word: εὐαγγελίου
  choice: kabar baik
  rationale: Menerjemahkan makna leksikal εὐαγγέλιον secara transparan bagi pembaca modern; padanan tradisional “Injil” dicantumkan dalam catatan kaki.
- source_word: Ἰησοῦ
  choice: Yesus
  rationale: Menggunakan bentuk baku nama Ἰησοῦ dalam bahasa Indonesia.
- source_word: χριστοῦ
  choice: Sang Mesias
  rationale: Χριστός di sini dipahami sebagai gelar yang mengidentifikasi Yesus. “Mesias” mempertahankan fungsi gelarnya, sedangkan “Sang” membuat konstruksi tersebut wajar dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah Χριστός diterjemahkan sebagai gelar atau dipertahankan dalam bentuk tradisional “Kristus”
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam pembukaan Markus, Χριστός menyatakan kedudukan mesianik Yesus dan bukan sekadar unsur nama diri. Terjemahan “Sang Mesias” menyampaikan daya gelar itu; bentuk tradisional “Kristus” tetap diberikan sebagai alternatif.
- issue: Hubungan genitif dalam εὐαγγελίου Ἰησοῦ χριστοῦ
  choice: tentang Yesus, Sang Mesias
  alternative: yang dibawa atau diberitakan oleh Yesus, Sang Mesias
  rationale: Konteks pembukaan terutama memperkenalkan kabar baik mengenai identitas dan karya Yesus. Namun, bentuk genitif Yunani dapat mencakup hubungan lain, termasuk kabar baik yang berasal dari atau diberitakan oleh Yesus; kemungkinan itu tidak dihapus, melainkan dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Bentuk nominal pembukaan dipertahankan. “Kabar baik” dipilih agar maknanya langsung dipahami, sementara istilah gerejawi tradisional dicatat. Koma sebelum “Sang Mesias” menandai gelar yang menerangkan Yesus.
