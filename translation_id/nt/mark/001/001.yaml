  source_fidelity: Teks dengan tepat mencerminkan Ἀρχὴ τοῦ εὐαγγελίου Ἰησοῦ χριστοῦ. Bentuk nominal “Permulaan” mempertahankan sifat pembuka/tajuk dari Yunani. “Kabar baik” merupakan padanan yang jelas bagi εὐαγγέλιον, dan “Sang Mesias” menerjemahkan χριστοῦ sebagai gelar. Tidak ada tambahan seperti “Anak Allah,” yang tidak terdapat dalam teks SBLGNT yang diberikan. “Tentang” memilih pembacaan genitif objektif yang paling wajar dalam konteks, sementara catatan b dengan tepat mencatat keluasan kemungkinan hubungan genitif.
  naturalness: “Permulaan kabar baik tentang Yesus, Sang Mesias” adalah bahasa Indonesia baku, ringkas, dan layak sebagai pembukaan nominal. Koma dan “Sang Mesias” membentuk aposisi gelar yang jelas serta bernada bermartabat tanpa menjadi kuno.
  terminology: Pilihan “kabar baik” transparan dan catatan untuk “Injil” menjaga akses kepada istilah tradisional. “Mesias” secara tepat menerjemahkan Χριστός sebagai gelar, sedangkan alternatif “Kristus” dicatat. Nama “Yesus” memakai bentuk baku Indonesia. Semua penanda catatan kaki a–c hadir dan terpasang pada unsur yang relevan.
