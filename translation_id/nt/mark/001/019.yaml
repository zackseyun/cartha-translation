review_pass:
  verdict: revise
  source_fidelity: Draf pada umumnya mengikuti urutan dan unsur-unsur sumber Yunani dengan baik. Namun, “Mereka juga berada” mengubah konstruksi objek persepsi εἶδεν ... καὶ αὐτοὺς ... καταρτίζοντας menjadi klausa baru dan kata “juga” berpotensi memberi penekanan tambahan yang tidak diperlukan oleh καί. Dalam konteks jala, “memperbaiki” merupakan padanan utama yang lebih tepat dan alami bagi καταρτίζοντας, sambil mempertahankan alternatif makna dalam catatan kaki.
  naturalness: Bahasa draf umumnya modern dan jelas. Revisi menyatukan kembali apa yang Yesus lihat dalam satu kalimat Indonesia yang alami, sehingga jelas bahwa Yakobus dan Yohaneslah yang dilihat sedang melakukan kegiatan tersebut.
  terminology: Nama Yakobus, Zebedeus, dan Yohanes sudah tepat dan konsisten. “Jala-jala” tepat untuk bentuk jamak τὰ δίκτυα. “Memperbaiki” paling idiomatis dalam konteks perbaikan jala; catatan kaki mempertahankan keluasan leksikal καταρτίζω.
  issues:
  - severity: medium
    issue: “Mereka juga berada” menambahkan nuansa “juga” dan melepaskan objek persepsi dari verba “melihat”.
    rationale: 'καί di sini menghubungkan αὐτούς dengan deskripsi partisipial setelah εἶδεν: ia melihat mereka berada di perahu sambil mengerjakan jala. “Juga” dapat menyiratkan perbandingan atau tambahan yang tidak dinyatakan, sedangkan kalimat baru kurang langsung mempertahankan bahwa keadaan itu adalah isi dari apa yang dilihat.'
  - severity: low
    issue: “Membereskan jala-jala” terlalu umum sebagai terjemahan utama dalam konteks penangkapan ikan.
    rationale: καταρτίζω memang dapat mencakup menata atau menyiapkan, tetapi untuk jala, “memperbaiki” adalah padanan Indonesia yang paling spesifik dan lazim. Alternatif yang lebih luas tetap layak dicantumkan dalam catatan kaki.
