  text: καὶ ⸀προβὰς ὀλίγον εἶδεν Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ αὐτοὺς ἐν τῷ πλοίῳ καταρτίζοντας τὰ δίκτυα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/019.yaml
  text: And going on a little farther[a], he saw James the son of Zebedee and John his brother, and they were in the boat mending the nets,
translation:
  language: id
  text: Setelah berjalan sedikit lebih jauh, ia melihat Yakobus, anak Zebedeus, dan Yohanes, saudaranya, di dalam perahu sedang memperbaiki[a] jala-jala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membereskan” atau “menyiapkan” jala-jala; kata kerja Yunani yang digunakan dapat berarti menata sesuatu atau memulihkannya ke keadaan yang semestinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: προβὰς ὀλίγον
  choice: Setelah berjalan sedikit lebih jauh
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama dan gerak maju dalam jarak pendek. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan urutan narasi.
- source_word: εἶδεν
  choice: ia melihat
  rationale: Bentuk aoris naratif dari ὁράω menyatakan tindakan melihat secara biasa, tanpa penekanan tambahan.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Yakobus anak Zebedeus
  rationale: Konstruksi artikel dan genitif mengidentifikasi Yakobus berdasarkan hubungan ayah-anak; bentuk tanpa penambahan kata 'putra' terdengar alami dan tetap jelas.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: Yohanes, saudaranya
  rationale: Kata ganti αὐτοῦ paling wajar mengacu kepada Yakobus. Tanda koma membantu menunjukkan bahwa frasa ini menerangkan Yohanes.
- source_word: καὶ αὐτούς
  choice: Mereka juga
  rationale: Kata αὐτούς kembali menunjuk Yakobus dan Yohanes, sedangkan καί memberi nuansa bahwa mereka pun berada dalam keadaan serupa. Kalimat baru menghasilkan bahasa Indonesia yang lebih alami tanpa mengubah hubungan sintaksisnya.
- source_word: ἐν τῷ πλοίῳ
  choice: berada di dalam perahu
  rationale: Artikel pada πλοίῳ menunjuk perahu tertentu dalam adegan itu. 'Di dalam perahu' menerjemahkan lokasi dengan jelas.
- source_word: καταρτίζοντας
  choice: sedang membereskan
  rationale: καταρτίζω dapat berarti menata hingga siap atau memulihkan ke keadaan semestinya. Dalam konteks jala, 'membereskan' cukup luas untuk mencakup penataan maupun perbaikan, sementara aspek tindakan yang sedang berlangsung dinyatakan dengan 'sedang'.
- source_word: τὰ δίκτυα
  choice: jala-jala
  rationale: Bentuk jamak merujuk pada jala penangkap ikan. Pengulangan kata menyatakan jamak secara alami tanpa menambahkan kepemilikan yang tidak dinyatakan eksplisit dalam bahasa Yunani.
