id: MRK.1.8
reference: Mark 1:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἐγὼ ἐβάπτισα ⸀ὑμᾶς ὕδατι, αὐτὸς δὲ βαπτίσει ὑμᾶς ⸀ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/008.yaml
  text: I baptized you with water[a], but he will baptize you with the Holy Spirit.
translation:
  language: id
  text: Aku membaptis kamu dengan air, tetapi Dia akan membaptis kamu dengan[a] Roh Kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di dalam Roh Kudus.” Preposisi Yunani yang dipakai dapat diterjemahkan dengan kedua cara tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: Aku
  rationale: Kata ganti yang dinyatakan secara eksplisit dipertahankan untuk menonjolkan perbandingan antara Yohanes dan Dia yang akan datang.
- source_word: ἐβάπτισα
  choice: membaptis
  rationale: Padanan baku yang mempertahankan makna ritual serta kaitan antarteks tanpa mempersempitnya pada cara pelaksanaan tertentu.
- source_word: ὑμᾶς
  choice: kamu
  rationale: Merujuk kepada orang banyak secara kolektif; dalam bahasa Indonesia, 'kamu' dapat dipakai dengan makna jamak dalam konteks ini.
- source_word: ὕδατι
  choice: dengan air
  rationale: Datif ini secara alami menyatakan sarana; 'dengan air' juga membentuk kesejajaran yang jelas dengan baptisan oleh Roh Kudus.
- source_word: αὐτὸς
  choice: Dia
  rationale: Kata ganti ini bersifat kontras dan menunjuk kepada tokoh yang akan datang; susunan 'tetapi Dia' mempertahankan penekanannya secara alami.
- source_word: δὲ
  choice: tetapi
  rationale: Partikel ini menandai kontras yang jelas antara baptisan Yohanes dan baptisan oleh Dia yang akan datang.
- source_word: βαπτίσει
  choice: akan membaptis
  rationale: Bentuk mendatang dipertahankan, sekaligus menjaga kesinambungan leksikal dengan 'membaptis' pada klausa pertama.
- source_word: ἐν
  choice: dengan
  rationale: Dalam konstruksi ini, preposisi tersebut dapat menyatakan sarana atau ranah. 'Dengan' alami dalam bahasa Indonesia dan mempertahankan kesejajaran dengan 'dengan air'; kemungkinan 'di dalam' dicatat dalam catatan kaki.
- source_word: πνεύματι ἁγίῳ
  choice: Roh Kudus
  rationale: Dalam konteks nubuat mengenai Dia yang akan datang, ungkapan ini paling wajar menunjuk kepada Roh Kudus ilahi.
theological_decisions:
- issue: Apakah πνεύματι ἁγίῳ menunjuk kepada Roh Kudus ilahi atau suatu kuasa kudus yang impersonal
  choice: Roh Kudus
  alternative: roh kudus; suatu roh kudus
  rationale: Konteks Markus, yaitu perbandingan antara baptisan air Yohanes dan baptisan oleh tokoh yang lebih berkuasa, paling alami menunjuk kepada Roh Kudus ilahi, tanpa menambahkan uraian tentang hakikat atau cara kerja-Nya.
- issue: Cara menerjemahkan ἐν dalam ἐν πνεύματι ἁγίῳ
  choice: dengan Roh Kudus
  alternative: di dalam Roh Kudus
  rationale: Bahasa Yunani memungkinkan pengertian sarana maupun ranah. Teks utama memakai 'dengan' karena alami dan sejajar dengan 'dengan air', sementara kemungkinan 'di dalam' dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Aku' sesuai dengan tuturan langsung Yohanes; 'Dia' diberi huruf kapital untuk memperjelas rujukan kepada tokoh yang akan datang. Penanda catatan kaki ditempatkan tepat setelah 'dengan' karena catatan menjelaskan alternatif bagi preposisi Yunani ἐν.
