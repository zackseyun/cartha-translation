  yaml_path: translation/nt/mark/001/022.yaml
  text: And they were astonished at his teaching[a], for he was teaching them as one having authority, and not as the scribes.
translation:
  language: id
  text: Mereka takjub pada pengajaran-Nya, sebab Ia mengajar mereka sebagai orang yang memiliki wewenang[a], dan tidak seperti para ahli Taurat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan wewenang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: takjub
  rationale: Bentuk imperfek menggambarkan reaksi kuat yang berlangsung ketika mereka mendengar Yesus. “Takjub” alami dalam narasi Indonesia dan mempertahankan intensitas maknanya.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: mendengar pengajaran-Nya
  rationale: Preposisi ἐπί di sini menandai hal yang menimbulkan ketakjuban. Penambahan “mendengar” membuat hubungan itu wajar dalam bahasa Indonesia tanpa mengubah acuannya, yaitu pengajaran Yesus.
- source_word: ἦν γὰρ διδάσκων
  choice: sebab Ia mengajar
  rationale: Konstruksi perifrastik menyatakan kegiatan mengajar yang sedang berlangsung. Dalam narasi Indonesia, bentuk “Ia mengajar” sudah menyampaikan tindakan yang berlangsung secara alami.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: sebagai orang yang memiliki wewenang
  rationale: Pilihan ini mempertahankan struktur perbandingan ὡς dan arti ἐξουσία sebagai hak atau wewenang yang sah, bukan sekadar gaya bicara yang tegas.
- source_word: γραμματεῖς
  choice: para ahli Taurat
  rationale: Dalam konteks Yahudi abad pertama, istilah ini menunjuk para pakar dan pengajar hukum Taurat. “Ahli Taurat” merupakan padanan Indonesia yang jelas dan lazim.
theological_decisions:
- issue: Hakikat wewenang Yesus dalam perbandingan dengan para ahli Taurat
  choice: Menyatakan bahwa Yesus mengajar sebagai orang yang memiliki wewenang tanpa menjelaskan sumber atau hakikat wewenang itu.
  alternative: “dengan wewenang ilahi”
  rationale: Ayat ini menegaskan perbedaan antara cara Yesus dan para ahli Taurat mengajar, tetapi tidak secara eksplisit mendefinisikan wewenang tersebut sebagai ilahi dalam kalimat ini. Terjemahan mempertahankan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ia” dipakai untuk alur naratif yang alami; “para ahli Taurat” dipilih agar peran kelompok itu langsung dipahami pembaca umum. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang dijelaskannya.
