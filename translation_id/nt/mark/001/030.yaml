  text: ἡ δὲ πενθερὰ Σίμωνος κατέκειτο πυρέσσουσα, καὶ ⸀εὐθὺς λέγουσιν αὐτῷ περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/030.yaml
  text: Simon’s mother-in-law was lying sick with a fever[b][a], and immediately they told him about her.
translation:
  language: id
  text: Ibu mertua Simon sedang terbaring karena demam, dan mereka segera memberi tahu Yesus tentang dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka berkata kepada-Nya tentang dia.” Bahasa Yunani memakai bentuk kini historis untuk menghidupkan kisah.
    reason: lexical_alternative
lexical_decisions:
- source_word: πενθερὰ Σίμωνος
  choice: ibu mertua Simon
  rationale: πενθερά adalah istilah kekerabatan yang lazim untuk ibu mertua; frasa posesif Yunani diterjemahkan secara alami dalam bahasa Indonesia.
- source_word: κατέκειτο
  choice: sedang terbaring
  rationale: Bentuk imperfek menyatakan keadaan yang berlangsung. 'Sedang terbaring' mempertahankan aspek duratif tanpa melebih-lebihkan bahwa ia terus-menerus terbaring di tempat tidur.
- source_word: πυρέσσουσα
  choice: karena demam
  rationale: Partisipel ini menyatakan bahwa ia menderita demam. Ungkapan ini alami dalam bahasa Indonesia dan menjelaskan sebab ia terbaring.
- source_word: εὐθὺς
  choice: segera
  rationale: Mempertahankan arti ketergesaan dan ciri gaya narasi Markus secara ringkas dan alami.
- source_word: λέγουσιν αὐτῷ
  choice: mereka memberi tahu Yesus
  rationale: Bentuk kini historis Yunani dialihkan ke bentuk naratif Indonesia yang alami. Nama 'Yesus' dipakai sebagai pengganti pronomina agar rujukannya jelas dalam ayat mandiri.
- source_word: περὶ αὐτῆς
  choice: tentang dia
  rationale: περί dengan genitif berarti 'tentang' atau 'mengenai'; 'tentang dia' merupakan padanan Indonesia yang alami.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ adalah penghubung naratif ringan. Alur kalimat bahasa Indonesia sudah cukup menandai kelanjutan tanpa menambahkan kata temporal atau kontras yang tidak dinyatakan secara tegas.
