id: MRK.1.16
reference: Mark 1:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂Καὶ παράγων⸃ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν Σίμωνα καὶ Ἀνδρέαν τὸν ⸀ἀδελφὸν Σίμωνος ⸀ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/016.yaml
  text: And as he was passing along beside the Sea of Galilee, he saw Simon and Andrew, Simon’s brother, casting a net into the sea, for they were fishermen.
translation:
  language: id
  text: Ketika Yesus berjalan menyusuri tepi Danau Galilea, ia melihat Simon dan Andreas, saudara Simon, sedang menebarkan jala ke danau, sebab mereka adalah nelayan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράγων παρὰ τὴν θάλασσαν
  choice: berjalan menyusuri tepi danau
  rationale: Partisipel kini menyatakan tindakan yang sedang berlangsung dan bersamaan dengan ‘melihat’; παρά dengan akusatif menunjukkan gerak menyusuri atau di sepanjang sisi danau.
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: Danau Galilea
  rationale: Walaupun θάλασσα secara leksikal berarti ‘laut’, perairan ini secara geografis merupakan danau, dan ‘Danau Galilea’ adalah sebutan Indonesia yang alami serta jelas.
- source_word: εἶδεν
  choice: ia melihat
  rationale: Menerjemahkan bentuk aoris ὁράω secara langsung tanpa menambahkan nuansa seperti ‘memperhatikan’.
- source_word: Σίμωνα καὶ Ἀνδρέαν
  choice: Simon dan Andreas
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi dan penggunaan Alkitab bahasa Indonesia.
- source_word: τὸν ἀδελφὸν Σίμωνος
  choice: saudara Simon
  rationale: Frasa genetif ini mengidentifikasi Andreas sebagai saudara Simon; susunan ini ringkas dan alami dalam bahasa Indonesia.
- source_word: ἀμφιβάλλοντας
  choice: sedang menebarkan jala
  rationale: Kata kerja ini secara khusus menunjuk pada tindakan melempar atau menebarkan jala; ‘sedang’ mempertahankan aspek tindakan yang berlangsung saat mereka terlihat.
- source_word: ἐν τῇ θαλάσσῃ
  choice: ke danau
  rationale: Meskipun ἐν biasanya berarti ‘di/dalam’, bersama tindakan menebarkan jala bahasa Indonesia secara idiomatis menggunakan arah ‘ke’.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: sebab mereka adalah nelayan
  rationale: γάρ memberi keterangan penjelas tentang alasan tindakan mereka; ‘sebab’ mempertahankan hubungan tersebut dengan ragam naratif yang wajar.
theological_decisions:
- issue: Subjek tersirat pada παράγων dan εἶδεν
  choice: Yesus ... ia
  alternative: ia ... ia
  rationale: Bahasa Yunani tidak menyebut nama dalam ayat ini, tetapi subjek berlanjut langsung dari Yesus dalam konteks sebelumnya. Menyebut ‘Yesus’ menghindari rujukan awal yang kabur dalam kutipan ayat mandiri tanpa menambahkan tafsir teologis.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. ‘Ia’ dipakai untuk narasi, sementara ‘sedang menebarkan’ menjaga keberlangsungan tindakan. Tidak diperlukan catatan kaki.
