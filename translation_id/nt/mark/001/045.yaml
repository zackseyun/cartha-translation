id: MRK.1.45
reference: Mark 1:45
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ἐξελθὼν ἤρξατο κηρύσσειν πολλὰ καὶ διαφημίζειν τὸν λόγον, ὥστε μηκέτι αὐτὸν δύνασθαι φανερῶς εἰς πόλιν εἰσελθεῖν, ἀλλὰ ἔξω ⸀ἐπ’ ἐρήμοις τόποις ἦν· καὶ ἤρχοντο πρὸς αὐτὸν ⸀πάντοθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/045.yaml
  text: But after he went out, he began to proclaim widely and to spread the message, so that Jesus could no longer enter a town openly, but stayed outside in deserted places; and people were coming to him from everywhere.
translation:
  language: id
  text: Namun, setelah orang itu pergi, ia mulai memberitakan hal itu ke mana-mana dan menyebarluaskan kabar tersebut. Akibatnya, Yesus tidak dapat lagi masuk ke sebuah kota secara terang-terangan, tetapi tinggal di luar, di tempat-tempat yang sepi. Meskipun demikian, orang-orang terus berdatangan kepada-Nya dari segala penjuru.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσειν πολλὰ
  choice: memberitakan hal itu ke mana-mana
  rationale: Ungkapan ini secara harfiah mengandung gagasan 'memberitakan banyak/luas'; dalam konteks, maksudnya orang itu memberitakannya secara luas, bukan menyampaikan banyak pokok yang berbeda.
- source_word: διαφημίζειν τὸν λόγον
  choice: menyebarluaskan kabar tersebut
  rationale: διαφημίζω menyatakan penyebaran berita secara luas, sedangkan τὸν λόγον di sini menunjuk pada kabar mengenai peristiwa yang baru terjadi.
- source_word: φανερῶς
  choice: secara terang-terangan
  rationale: Mempertahankan arti masuk secara terbuka atau di depan umum, tanpa menyiratkan bahwa Yesus sama sekali tidak mampu memasuki kota.
- source_word: ἐπ’ ἐρήμοις τόποις
  choice: di tempat-tempat yang sepi
  rationale: ἐρήμοις menunjuk pada tempat yang tidak berpenghuni atau terpencil; 'sepi' lebih alami daripada 'gurun' dan cocok dengan konteks geografis yang tidak harus berupa padang pasir.
- source_word: ἤρχοντο ... πάντοθεν
  choice: orang-orang terus berdatangan ... dari segala penjuru
  rationale: Bentuk imperfek menggambarkan arus kedatangan yang berkelanjutan; subjek jamak tersirat diterjemahkan alami sebagai 'orang-orang'.
theological_decisions:
- issue: Rujukan pronomina αὐτόν dalam 'tidak dapat lagi masuk'
  choice: Yesus
  alternative: ia
  rationale: Secara tata bahasa pronomina dapat tampak beralih rujukan, tetapi konteks jelas menunjuk kepada Yesus; penyebutan nama menghindari kerancuan dalam bahasa Indonesia tanpa menambah tafsiran teologis.
- issue: Nuansa δύνασθαι
  choice: tidak dapat lagi masuk ... secara terang-terangan
  alternative: tidak mungkin lagi masuk
  rationale: Keterbatasan ini dipahami sebagai akibat praktis dari publisitas dan kerumunan, bukan ketidakmampuan mutlak; keterangan 'secara terang-terangan' tetap membatasi maksudnya.
- issue: Hubungan klausa penutup
  choice: Meskipun demikian, orang-orang terus berdatangan
  alternative: dan orang-orang berdatangan
  rationale: 'Kata καί secara formal berarti ''dan'', tetapi dalam konteks klausa terakhir membentuk kontras: Yesus berada di tempat sepi, namun orang tetap datang. ''Meskipun demikian'' mengungkapkan hubungan wacana itu secara alami.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. 'Orang itu' mempertahankan rujukan kepada orang yang baru disembuhkan; kapitalisasi pronomina bagi Yesus mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Tidak ada catatan kaki yang diperlukan.
