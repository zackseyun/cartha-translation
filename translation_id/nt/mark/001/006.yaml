    issue: Nuansa statif ἦν ἐνδεδυμένος belum terwakili sepenuhnya.
    rationale: '"Mengenakan" lazimnya bersifat dinamis (''put on/wear''), sedangkan teks menggambarkan keadaan Yohanes yang berpakaian. "Berpakaian dari" menyampaikan deskripsi statif secara lebih baik.'
  - severity: low
    issue: Lokasi ikat pinggang diterjemahkan kurang presisi dan repetitif.
    rationale: περὶ τὴν ὀσφὺν αὐτοῦ berarti 'di sekeliling pinggangnya'; "pada pinggangnya" tidak menyatakan unsur melingkari dan menghasilkan pengulangan dengan "ikat pinggang".
  - severity: low
    issue: Catatan kaki berpotensi terlalu afirmatif secara interpretatif.
    rationale: Markus 1:6 menggemakan deskripsi Elia, tetapi tidak secara eksplisit menyebut Yohanes 'pendahulu kenabian'. Catatan dapat mempertahankan fungsi informatifnya dengan mengaitkannya pada penyajian Markus tanpa menambahkan identifikasi ke teks utama.
  revised_text: Yohanes berpakaian dari bulu unta dan mengenakan ikat pinggang kulit di sekeliling pinggangnya[a], serta makan belalang dan madu hutan.
