  text: ⸂καὶ ἦν⸃ ὁ Ἰωάννης ἐνδεδυμένος τρίχας καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, καὶ ἔσθων ἀκρίδας καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/006.yaml
  text: John was clothed with camel’s hair and a leather belt around his waist[a], and he was eating locusts and wild honey.
translation:
  language: id
  text: Yohanes berpakaian dari bulu unta dan mengenakan ikat pinggang kulit di sekeliling pinggangnya[a], serta makan belalang dan madu hutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pakaian Yohanes mengingatkan pada gambaran Elia dalam 2 Raja-Raja 1:8 dan turut membentuk penyajian Markus tentang Yohanes sebagai pendahulu profetis.
    reason: cross_reference
lexical_decisions:
- source_word: ἐνδεδυμένος
  choice: mengenakan pakaian
  rationale: Partisip perfek menggambarkan keadaan Yohanes yang berpakaian; ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan nuansa statif.
- source_word: τρίχας καμήλου
  choice: dari bulu unta
  rationale: Frasa ini menunjuk pada bahan pakaian yang terbuat dari bulu unta, bukan kulit unta.
- source_word: ζώνην δερματίνην
  choice: ikat pinggang kulit
  rationale: Padanan modern yang langsung bagi ikat pinggang atau sabuk yang bahannya kulit.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: pada pinggangnya
  rationale: Menyampaikan letak ikat pinggang secara alami; dalam bahasa Indonesia, 'ikat pinggang ... pada pinggangnya' sudah mengandung makna mengelilingi pinggang.
- source_word: ἔσθων
  choice: makan
  rationale: Partisip kini dalam gambaran ini menunjukkan kebiasaan atau pola makan Yohanes, bukan hanya satu tindakan pada suatu saat.
- source_word: ἀκρίδας
  choice: belalang
  rationale: Makna leksikal bakunya adalah serangga belalang; konteks tidak memberi alasan untuk memilih arti lain.
- source_word: μέλι ἄγριον
  choice: madu hutan
  rationale: Padanan Indonesia yang alami untuk madu yang ditemukan atau dihasilkan di alam liar.
- source_word: καὶ ἦν
  choice: Yohanes mengenakan
  rationale: Καί meneruskan narasi, tetapi tidak perlu diterjemahkan dengan penanda awal khusus; bentuk ἦν bersama partisip dinyatakan secara alami melalui predikat deskriptif.
theological_decisions:
- issue: Hubungan pakaian dan makanan Yohanes dengan gambaran kenabian
  choice: Ayat diterjemahkan secara deskriptif, sedangkan kaitannya dengan Elia dijelaskan dalam catatan kaki.
  alternative: Menyebut Yohanes sebagai Elia atau pendahulu kenabian secara eksplisit di dalam teks utama.
  rationale: Kata-kata ayat ini mengingatkan pembaca pada gambaran Elia dalam 2 Raja-Raja 1:8, tetapi Markus 1:6 sendiri tidak menyatakan identifikasi itu secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. 'Pakaian dari bulu unta' menghindari kesan bahwa Yohanes mengenakan kulit unta. 'Madu hutan' dipilih sebagai ungkapan alami bagi μέλι ἄγριον.
