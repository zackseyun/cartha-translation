  to: Yohanes berpakaian dari bulu unta dan mengenakan ikat pinggang kulit di sekeliling pinggangnya[a], serta makan belalang dan madu hutan.
  rationale: Revisi memakai "berpakaian dari bulu unta" untuk mencerminkan keadaan yang dinyatakan oleh ἦν ἐνδεδυμένος. Frasa "di sekeliling pinggangnya" menerjemahkan περί secara lebih tepat dan menghindari pengulangan yang janggal. Catatan kaki dipertahankan sebagai rujukan intertekstual, dengan perumusan yang tidak menjadikan hubungan dengan Elia sebagai pernyataan eksplisit ayat.
