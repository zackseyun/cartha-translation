  text: καὶ ⸀κατεδίωξεν αὐτὸν ⸀Σίμων καὶ οἱ μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/036.yaml
  text: And Simon and those with him pursued him,[a]
translation:
  language: id
  text: Simon dan orang-orang yang bersamanya mengejar Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencari Dia.” Kata kerja Yunani ini dapat menyiratkan pengejaran atau pencarian yang sungguh-sungguh.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδίωξεν
  choice: mengejar
  rationale: Kata kerja καταδιώκω menyiratkan tindakan mengikuti atau mencari dengan sungguh-sungguh. “Mengejar” mempertahankan daya ungkap yang lebih kuat daripada sekadar “mencari”, tanpa harus menyiratkan niat bermusuhan.
- source_word: αὐτὸν
  choice: Dia
  rationale: Kata ganti ini merujuk kepada Yesus dalam konteks langsung. Huruf kapital dipakai menurut kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia untuk kata ganti yang merujuk kepada-Nya.
- source_word: Σίμων
  choice: Simon
  rationale: Nama pribadi ini ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: οἱ μετ’ αὐτοῦ
  choice: orang-orang yang bersamanya
  rationale: Ungkapan ini mempertahankan arti harfiah “mereka yang bersama dia” dan tidak menambahkan identitas atau status tertentu kepada kelompok tersebut.
- source_word: καὶ
  choice: dan
  rationale: Kata sambung ini menghubungkan ayat dengan alur sebelumnya dan mempertahankan gaya narasi parataktis Markus secara wajar dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan Simon sebagai tokoh yang disebut pertama, disusul orang-orang yang bersamanya. Pilihan “mengejar” menjaga kekuatan verba Yunani, sedangkan catatan kaki menyediakan padanan yang lebih idiomatis dan lebih netral.
