id: MRK.1.5
reference: Mark 1:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐξεπορεύετο πρὸς αὐτὸν πᾶσα ἡ Ἰουδαία χώρα καὶ οἱ Ἱεροσολυμῖται ⸂πάντες, καὶ ἐβαπτίζοντο⸃ ⸂ὑπ’ αὐτοῦ ἐν τῷ Ἰορδάνῃ ποταμῷ⸃ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/005.yaml
  text: And all the Judean countryside and all the people of Jerusalem were going out to him, and they were being baptized by him in the Jordan River, confessing their sins.
translation:
  language: id
  text: Orang-orang dari seluruh wilayah Yudea dan semua penduduk Yerusalem terus berdatangan kepada Yohanes. Mereka dibaptis olehnya di Sungai Yordan sambil mengakui dosa-dosa mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: terus berdatangan
  rationale: Bentuk imperfek menggambarkan tindakan yang berlangsung atau berulang pada masa lampau. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran arus orang yang datang.
- source_word: πᾶσα ἡ Ἰουδαία χώρα
  choice: seluruh daerah Yudea
  rationale: χώρα dapat berarti daerah, wilayah, atau kawasan pedesaan. 'Daerah Yudea' mempertahankan cakupan geografis tanpa membuat daerah itu sendiri seolah-olah bertindak secara harfiah.
- source_word: οἱ Ἱεροσολυμῖται πάντες
  choice: semua penduduk Yerusalem
  rationale: Ἱεροσολυμῖται menunjuk kepada para penghuni Yerusalem; pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: ἐβαπτίζοντο
  choice: mereka dibaptis
  rationale: Bentuk pasif dipertahankan. Konteks dan rangkaian orang yang berdatangan menyampaikan sifat tindakan yang berulang, sehingga konstruksi progresif yang kaku tidak diperlukan.
- source_word: ὑπ’ αὐτοῦ
  choice: olehnya
  rationale: Mempertahankan pronomina Yunani tanpa menggantinya dengan nama Yohanes dalam klausa ini; anteseden diperjelas secara alami pada kalimat sebelumnya.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: di Sungai Yordan
  rationale: ποταμός dinyatakan secara eksplisit sebagai 'Sungai', dengan susunan nama geografis yang lazim dalam bahasa Indonesia.
- source_word: ἐξομολογούμενοι
  choice: sambil mengakui
  rationale: Partisipel menunjukkan tindakan yang menyertai pembaptisan. 'Sambil' mengungkapkan hubungan simultan itu secara alami tanpa menambah penafsiran.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: dosa-dosa mereka
  rationale: Bentuk jamak dan kepemilikan diterjemahkan langsung dan idiomatis.
theological_decisions:
- issue: Cakupan kata 'seluruh' dan 'semua' bagi Yudea dan Yerusalem
  choice: Mempertahankan bahasa menyeluruh sebagai generalisasi kolektif yang wajar
  alternative: Melonggarkannya menjadi 'banyak orang dari Yudea dan Yerusalem'
  rationale: Teks Yunani memakai πᾶσα dan πάντες. Retorika menyeluruhnya perlu dipertahankan tanpa memaksanya menjadi klaim bahwa setiap individu tanpa kecuali hadir.
- issue: Makna tindakan baptisan
  choice: Menggunakan 'dibaptis' tanpa menentukan cara atau makna teologisnya
  alternative: Menggunakan 'dibenamkan' atau 'dibasuh'
  rationale: Ayat ini melaporkan tindakan baptisan tanpa menjelaskan cara pelaksanaan atau seluruh signifikansi teologisnya. Istilah yang mapan menghindari penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ayat dibagi menjadi dua kalimat agar subjek kolektif geografis dapat disampaikan secara alami. Nama 'Yohanes' dipakai sebagai anteseden kontekstual untuk menghindari pronomina Indonesia yang kabur, sedangkan 'olehnya' tetap mencerminkan ὑπ’ αὐτοῦ.
