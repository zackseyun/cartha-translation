  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς γενέσθαι ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/017.yaml
  text: And Jesus said to them, “Come after me, and I will make you become fishers of men.”
translation:
  language: id
  text: Lalu Yesus berkata kepada mereka, “Ikutlah Aku, dan Aku akan menjadikan kalian penjala manusia.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῦτε ὀπίσω μου
  choice: Ikutlah Aku
  rationale: Ungkapan ajakan harfiah ‘mari di belakang-Ku’ secara idiomatis berarti mengikuti Yesus sebagai murid; ‘Ikutlah Aku’ menyampaikannya secara alami dan langsung dalam bahasa Indonesia.
- source_word: ποιήσω ὑμᾶς γενέσθαι
  choice: Aku akan menjadikan kalian
  rationale: Mempertahankan gagasan bahwa Yesus akan menyebabkan mereka menjadi sesuatu, tanpa menghasilkan susunan Indonesia yang kaku seperti ‘membuat kalian menjadi’.
- source_word: ἁλιεῖς ἀνθρώπων
  choice: penjala manusia
  rationale: Mempertahankan metafora penangkapan ikan dan cakupan umum ἀνθρώπων, yakni manusia/orang-orang, bukan hanya laki-laki.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Pronomina ini berbentuk jamak; ‘kalian’ menyatakan jumlahnya dengan jelas dan wajar.
theological_decisions:
- issue: Makna metaforis ‘penjala manusia’
  choice: Metafora dipertahankan tanpa penjelasan tambahan dalam teks utama.
  alternative: Menguraikannya sebagai ‘orang yang membawa orang lain menjadi pengikut-Ku’.
  rationale: Teks Yunani memakai metafora yang sengaja terkait dengan pekerjaan para nelayan; menguraikannya akan mempersempit atau menafsirkan makna yang tidak dijelaskan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Aku’ sesuai dengan tuturan langsung Yesus; ‘kalian’ dipilih untuk menandai objek jamak secara jelas. Tidak diperlukan catatan kaki.
