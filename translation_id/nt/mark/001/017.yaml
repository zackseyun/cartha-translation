  source_fidelity: 'Terjemahan menyampaikan seluruh unsur utama Yunani: καὶ sebagai penghubung naratif (“Lalu”), ujaran Yesus kepada para nelayan, panggilan untuk mengikuti-Nya, serta janji bahwa Ia akan menjadikan mereka “penjala manusia.” Bentuk jamak ὑμᾶς tercermin dalam “kalian.” Metafora ἁλιεῖς ἀνθρώπων dipertahankan dan ἀνθρώπων diterjemahkan secara inklusif sebagai “manusia,” tanpa mempersempitnya menjadi laki-laki.'
