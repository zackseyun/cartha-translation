  terminology: Istilah “makam,” “sabat-sabat,” dan “present historis” digunakan secara tepat. Catatan a menjelaskan idiom Yunani tanpa memaksakan makna harfiahnya ke dalam teks utama. Catatan c secara tepat menjaga keluwesan hubungan waktu antara “ketika” dan “setelah.”
