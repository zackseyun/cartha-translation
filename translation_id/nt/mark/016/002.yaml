  text: καὶ λίαν πρωῒ ⸂τῇ μιᾷ τῶν⸃ σαββάτων ἔρχονται ἐπὶ τὸ μνημεῖον ἀνατείλαντος τοῦ ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/002.yaml
  text: And very early on the first day of the week[c][b][a], they come to the tomb when the sun had risen.
translation:
  language: id
  text: Pagi-pagi sekali, pada hari pertama minggu itu[a], mereka tiba[b] di makam ketika matahari telah terbit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “pada yang pertama dari sabat-sabat”; ini adalah ungkapan yang berarti “pada hari pertama minggu itu.”'
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Yunani, Markus memakai bentuk kini, “mereka tiba,” sebagai present historis yang membuat kisah terasa hidup.
    reason: lexical_alternative
  - marker: c
    text: 'Dapat juga diterjemahkan: “setelah matahari terbit.” Konstruksi Yunani menunjukkan waktu kedatangan mereka tanpa menetapkan secara tegas perbedaan antara “ketika” dan “setelah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λίαν πρωῒ
  choice: pagi-pagi sekali
  rationale: 'Ungkapan ini secara alami menyampaikan penegasan λίαν terhadap πρωῒ: waktunya masih sangat pagi.'
- source_word: τῇ μιᾷ τῶν σαββάτων
  choice: pada hari pertama minggu itu
  rationale: Ini adalah ungkapan Yunani yang secara harfiah berbunyi ‘pada yang pertama dari sabat-sabat’, tetapi secara idiomatis berarti hari pertama dalam satu minggu.
- source_word: ἔρχονται
  choice: mereka tiba
  rationale: Dalam konteks gerak menuju makam, ‘tiba’ menyampaikan kedatangan mereka dengan wajar. Bahasa Indonesia tidak menandai kala secara morfologis, sehingga bentuk ini juga tidak perlu memaksakan perubahan present historis Yunani menjadi lampau.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: di makam
  rationale: μνημεῖον dalam konteks pemakaman berarti makam. Bersama verba kedatangan ‘tiba’, tujuan gerak secara alami dinyatakan dengan ‘di’ dalam bahasa Indonesia.
- source_word: ἀνατείλαντος τοῦ ἡλίου
  choice: ketika matahari telah terbit
  rationale: Konstruksi genitif absolut menyatakan keadaan waktu pada saat kedatangan. ‘Telah terbit’ mempertahankan aspek bahwa terbitnya matahari sudah terjadi, sedangkan ‘ketika’ tidak memperkuat hubungan waktunya melebihi yang dinyatakan teks Yunani.
