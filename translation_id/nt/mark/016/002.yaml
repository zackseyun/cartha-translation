  source_fidelity: Terjemahan dengan tepat menyampaikan λίαν πρωῒ sebagai “Pagi-pagi sekali,” idiom τῇ μιᾷ τῶν σαββάτων sebagai “pada hari pertama minggu itu,” dan genitif absolut ἀνατείλαντος τοῦ ἡλίου sebagai keadaan waktu, “ketika matahari telah terbit.” “Mereka tiba di makam” secara idiomatis menyatakan ἔρχονται ἐπὶ τὸ μνημεῖον; meskipun “datang ke makam” lebih dekat secara leksikal, bentuk yang dipilih tidak mengubah makna atau arah gerak.
