  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐταῖς· Μὴ ἐκθαμβεῖσθε· Ἰησοῦν ζητεῖτε τὸν Ναζαρηνὸν τὸν ἐσταυρωμένον· ἠγέρθη, οὐκ ἔστιν ὧδε· ἴδε ὁ τόπος ὅπου ἔθηκαν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/006.yaml
  text: But he says to them[a], “Do not be alarmed. You are looking for Jesus the Nazarene, the one who has been crucified. He has been raised; he is not here[b]. Look—the place where they laid him.”
translation:
  language: id
  text: Tetapi dia berkata kepada mereka, “Jangan gentar. Kalian mencari Yesus, orang Nazaret[a], yang telah disalibkan. Ia telah dibangkitkan[b]; Ia tidak ada di sini. Lihatlah tempat di mana mereka membaringkan-Nya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang Nazorean” atau “yang berasal dari Nazaret.” Dalam bahasa Yunani, ini adalah sebutan yang dibentuk dari nama Nazaret.
    reason: lexical_alternative
  - marker: b
    text: 'Atau, “Ia telah bangkit.” Kata kerja Yunani berbentuk pasif: “Ia telah dibangkitkan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκθαμβεῖσθε
  choice: jangan gentar
  rationale: Kata kerja ini menyatakan keguncangan atau ketakutan yang kuat, bukan sekadar rasa heran. “Jangan gentar” alami, ringkas, dan sesuai dengan suasana di makam.
- source_word: Ναζαρηνὸν
  choice: orang Nazaret
  rationale: Bentuk adjektival Yunani berfungsi sebagai sebutan yang berasal dari nama Nazaret. “Orang Nazaret” mempertahankan fungsi sebutan itu dalam bahasa Indonesia yang alami.
- source_word: ἐσταυρωμένον
  choice: yang telah disalibkan
  rationale: Partisipel perfektif menunjuk pada tindakan penyaliban yang telah selesai dan tetap menentukan identitas Yesus dalam konteks ini. Bentuk ini juga mempertahankan diatesis pasif.
- source_word: ἠγέρθη
  choice: Ia telah dibangkitkan
  rationale: Bentuk Yunani adalah pasif. “Telah dibangkitkan” mempertahankan diatesis tersebut serta menyampaikan tindakan yang sudah terjadi tanpa menjelaskan pelakunya secara eksplisit.
- source_word: ὧδε
  choice: di sini
  rationale: Padanan lokatif langsung, jelas, dan alami dalam bahasa Indonesia modern.
- source_word: ἴδε
  choice: Lihatlah
  rationale: Bentuk imperatif ini mengarahkan perhatian secara tegas. “Lihatlah” tetap wajar dan bermartabat tanpa terasa arkais.
- source_word: τόπος
  choice: tempat
  rationale: Padanan umum yang cukup konkret untuk lokasi di dalam makam.
- source_word: ἔθηκαν
  choice: membaringkan
  rationale: Dalam konteks pemakaman, “membaringkan” lebih alami dan bermartabat daripada “menaruh,” sekaligus menggambarkan penempatan jenazah.
- source_word: ζητεῖτε
  choice: Kalian mencari
  rationale: Bentuk kini menunjukkan tindakan yang sedang dilakukan. “Kalian mencari” alami dalam bahasa Indonesia dan memperjelas bahwa sapaan ditujukan kepada beberapa perempuan.
- source_word: λέγει αὐταῖς
  choice: dia berkata kepada mereka
  rationale: Bahasa Indonesia tidak menandai kala pada verba, sehingga “berkata” dapat menyampaikan gaya naratif hidup Markus tanpa memaksakan perbedaan kala yang tidak alami.
theological_decisions:
- issue: Bunyi dan diatesis pernyataan kebangkitan
  choice: Ia telah dibangkitkan
  alternative: Ia telah bangkit
  rationale: ἠγέρθη berbentuk pasif. Terjemahan utama mempertahankan diatesis itu dan kemungkinan tindakan ilahi yang tersirat, tetapi tidak menyebut pelaku yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipakai karena αὐταῖς menunjuk kepada beberapa perempuan. Sebutan “orang Nazaret” lebih alami daripada bentuk serapan seperti “orang Nazorean.” Kapitalisasi “Ia” dan akhiran “-Nya” mengikuti kebiasaan penulisan Indonesia untuk rujukan kepada Yesus.
