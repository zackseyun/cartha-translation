translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Frasa “pada waktu itu” memperjelas bahwa berkabung dan menangis berlangsung ketika berita tersebut disampaikan, tanpa mengubah identitas kelompok yang dimaksud.
