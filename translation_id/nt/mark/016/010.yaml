  text: ἐκείνη πορευθεῖσα ἀπήγγειλεν τοῖς μετ’ αὐτοῦ γενομένοις πενθοῦσι καὶ κλαίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/010.yaml
  text: She went and reported it to those who had been with him[a], who were mourning and weeping.
translation:
  language: id
  text: Ia pergi dan memberitahukan hal itu kepada orang-orang yang pernah bersama Yesus, yang sedang berkabung dan menangis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνη
  choice: Ia
  rationale: Kata tunjuk ini merujuk kembali kepada Maria Magdalena pada ayat sebelumnya. Dalam bahasa Indonesia, “Ia” merupakan rujukan yang alami tanpa mengulang namanya.
- source_word: πορευθεῖσα
  choice: pergi
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. Susunan “Ia pergi dan ...” mempertahankan urutan tindakan secara wajar.
- source_word: ἀπήγγειλεν
  choice: memberitahukan hal itu
  rationale: Verba ini berarti menyampaikan atau melaporkan suatu berita. “Hal itu” menyatakan objek yang tersirat dalam bahasa Yunani, yaitu peristiwa yang baru disebutkan.
- source_word: τοῖς μετ’ αὐτοῦ γενομένοις
  choice: kepada orang-orang yang pernah bersama Yesus
  rationale: Frasa ini menunjuk kepada orang-orang yang sebelumnya menyertai dia. Nama “Yesus” dipakai agar rujukan pronominal tetap jelas dalam bahasa Indonesia.
- source_word: πενθοῦσι
  choice: sedang berkabung
  rationale: Verba ini menggambarkan dukacita karena kematian atau kehilangan; “berkabung” sesuai dengan konteks tersebut.
- source_word: καὶ κλαίουσιν
  choice: dan menangis
  rationale: κλαίω berarti menangis atau meratap. “Menangis” jelas, alami, dan mempertahankan nada khidmat ayat ini.
