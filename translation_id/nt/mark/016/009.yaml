  text: ⟦Ἀναστὰς δὲ πρωῒ πρώτῃ σαββάτου ἐφάνη πρῶτον Μαρίᾳ τῇ Μαγδαληνῇ, ⸀παρ’ ἧς ἐκβεβλήκει ἑπτὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/009.yaml
  text: After he had risen[a], early on the first day of the week, he appeared first to Mary Magdalene, from whom he had cast out seven demons.
translation:
  language: id
  text: Setelah bangkit[a], pagi-pagi pada hari pertama minggu itu, ia pertama-tama menampakkan diri kepada Maria Magdalena, darinya ia telah mengusir tujuh setan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat 9–20 tidak terdapat dalam beberapa naskah awal Injil Markus; naskah-naskah lain memuatnya, kadang-kadang dengan variasi.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀναστὰς
  choice: Setelah bangkit
  rationale: Partisip aoris ini berfungsi secara temporal terhadap verba utama ἐφάνη. Ungkapan ini menyatakan bahwa kebangkitan mendahului penampakan, tanpa menambahkan subjek yang tidak dinyatakan secara eksplisit dalam frasa Yunani.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ adalah penghubung ringan. Dalam susunan bahasa Indonesia ini, alur wacananya sudah alami tanpa 'lalu', 'dan', atau 'tetapi', yang dapat memberi nuansa lebih kuat daripada sumber.
- source_word: πρωῒ
  choice: pagi-pagi
  rationale: Adverbia ini menunjuk pada waktu pagi yang masih awal. 'Pagi-pagi' alami dan jelas dalam bahasa Indonesia modern.
- source_word: πρώτῃ σαββάτου
  choice: pada hari pertama minggu itu
  rationale: Ungkapan ini merupakan idiom Yahudi-Yunani untuk hari pertama dalam satu pekan. 'Minggu itu' di sini berarti pekan tersebut, bukan nama hari, dan mempertahankan acuan definit dalam konteks.
- source_word: ἐφάνη
  choice: menampakkan diri
  rationale: Bentuk ini dalam konteks penampakan sesudah kebangkitan secara idiomatis berarti 'menampakkan diri'. Pilihan ini lebih alami daripada 'terlihat' dan tidak mengubah peristiwa menjadi tindakan melihat oleh Maria.
- source_word: πρῶτον
  choice: pertama-tama
  rationale: Adverbia ini menyatakan urutan penampakan. 'Pertama-tama' secara jelas menerangkan verba 'menampakkan diri'.
- source_word: Μαρίᾳ τῇ Μαγδαληνῇ
  choice: kepada Maria Magdalena
  rationale: Bentuk datif menandai orang yang menerima penampakan; nama diri mengikuti bentuk baku Indonesia.
- source_word: παρ’ ἧς
  choice: yang darinya
  rationale: Dengan ἐκβεβλήκει, frasa ini menunjuk kepada orang yang darinya setan-setan telah diusir. Bentuk tersebut mempertahankan hubungan relatif dengan Maria.
- source_word: ἐκβεβλήκει
  choice: pernah ia usir
  rationale: Bentuk pluperfek menunjukkan tindakan yang sudah terjadi sebelum penampakan. 'Pernah' menyampaikan latar terdahulu secara alami, sementara 'usir' mempertahankan daya ἐκβάλλω dalam konteks pengusiran setan.
- source_word: ἑπτὰ δαιμόνια
  choice: tujuh setan
  rationale: δαιμόνια dalam konteks pengusiran di Injil berarti makhluk rohani jahat; 'setan' adalah padanan Indonesia yang umum dan tidak melunakkan istilah sumber.
theological_decisions:
- issue: Status tekstual Markus 16:9 dalam bagian akhir panjang Injil Markus
  choice: Ayat diterjemahkan sesuai teks SBLGNT yang disediakan, dengan penanda catatan pada klausa pembuka dan keterangan tentang sengketa tekstual.
  alternative: Sejumlah naskah mengakhiri Injil Markus pada 16:8 dan tidak memuat 16:9–20; naskah lain memuat bagian itu, kadang-kadang dengan variasi.
  rationale: Teks Yunani yang diberikan memuat ayat ini di dalam tanda kurung kritis. Menerjemahkan ayat sambil mencatat bukti naskah mempertahankan baik isi teks yang disediakan maupun ketidakpastian sejarah teks tanpa memutuskannya secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, tanpa memasukkan istilah denominasi. Penanda [a] ditempatkan sesudah klausa kebangkitan agar mengingatkan pembaca bahwa seluruh ayat berada dalam bagian yang status tekstualnya diperdebatkan.
