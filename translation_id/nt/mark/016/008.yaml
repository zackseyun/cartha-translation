source:
  edition: SBLGNT
  text: καὶ ἐξελθοῦσαι ἔφυγον ἀπὸ τοῦ μνημείου, εἶχεν ⸀γὰρ αὐτὰς τρόμος καὶ ἔκστασις· καὶ οὐδενὶ οὐδὲν εἶπαν, ἐφοβοῦντο ⸁γάρ. ⟦Πάντα δὲ τὰ παρηγγελμένα τοῖς περὶ τὸν Πέτρον συντόμως ἐξήγγειλαν. μετὰ δὲ ταῦτα καὶ αὐτὸς ὁ Ἰησοῦς ἀπὸ ἀνατολῆς καὶ ἄχρι δύσεως ἐξαπέστειλεν δι’ αὐτῶν τὸ ἱερὸν καὶ ἄφθαρτον κήρυγμα τῆς αἰωνίου σωτηρίας. ἀμήν.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/008.yaml
  text: And they went out and fled from the tomb[a], for trembling and astonishment had seized them. And they said nothing to anyone, for they were afraid.
translation:
  language: id
  text: Lalu mereka keluar dan melarikan diri dari makam itu,[a] sebab kegentaran dan keheranan telah meliputi mereka. Mereka tidak mengatakan apa pun kepada siapa pun, karena mereka takut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sejumlah naskah menambahkan apa yang disebut akhir pendek: “Semua yang telah diperintahkan kepada mereka, mereka laporkan secara singkat kepada orang-orang di sekitar Petrus. Sesudah itu, Yesus sendiri juga mengutus melalui mereka, dari timur sampai ke barat, pemberitaan kudus dan tidak dapat binasa tentang keselamatan kekal. Amin.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐξελθοῦσαι
  choice: mereka keluar
  rationale: Partisip aoris feminin jamak ini mengacu kepada para perempuan dan menyatakan tindakan yang mendahului kata kerja utama; susunan berurutan dalam bahasa Indonesia menyampaikan hubungan itu secara alami.
- source_word: ἔφυγον
  choice: melarikan diri
  rationale: Ungkapan ini mempertahankan daya kuat φεύγω dan lebih tepat daripada sekadar 'pergi' atau 'berlari'.
- source_word: μνημείου
  choice: makam
  rationale: Dalam konteks penguburan dan kebangkitan, 'makam' merupakan padanan Indonesia yang alami dan tepat untuk μνημεῖον.
- source_word: εἶχεν αὐτὰς
  choice: mereka diliputi
  rationale: Konstruksi idiomatis ini menggambarkan kegentaran dan keheranan yang menguasai para perempuan; bentuk pasif alami ini mempertahankan intensitas tanpa terasa kaku.
- source_word: τρόμος
  choice: kegentaran
  rationale: Pilihan ini mencakup rasa takut yang membuat orang gemetar dan tetap dapat dibedakan dari pernyataan eksplisit bahwa mereka takut pada akhir ayat.
- source_word: ἔκστασις
  choice: keheranan
  rationale: Dalam konteks ini kata tersebut menunjuk pada keadaan tercengang atau terpana, bukan 'ekstase' dalam pengertian modern.
- source_word: οὐδενὶ οὐδὲν εἶπαν
  choice: mereka tidak mengatakan apa pun kepada siapa pun
  rationale: Padanan ini mempertahankan penyangkalan menyeluruh dan penekanannya dalam bahasa Indonesia yang wajar.
- source_word: ἐφοβοῦντο
  choice: mereka takut
  rationale: Bentuk imperfek menggambarkan keadaan takut yang sedang berlangsung; ungkapan sederhana ini paling alami dalam bahasa Indonesia.
- source_word: γάρ
  choice: karena
  rationale: Kata penghubung kausal pada akhir ayat diterjemahkan secara jelas tanpa menutupi penutup narasi yang mendadak.
theological_decisions:
- issue: Penanganan akhir pendek yang diberi kurung ganda sesudah Markus 16:8
  choice: Tidak memasukkannya ke dalam teks utama, tetapi mencantumkannya dalam catatan kaki sebagai varian tekstual.
  alternative: Memasukkan akhir pendek ke dalam teks utama atau mencetak kedua bentuk akhir dalam teks utama.
  rationale: SBLGNT menempatkan tambahan itu dalam kurung ganda, yang menandakan bahwa bagian tersebut tidak dianggap sebagai teks utama. Catatan kaki menjaga transparansi bukti naskah tanpa mencampurkan tambahan tersebut ke dalam terjemahan ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas, alami, dan bermartabat. Pengulangan cakupan dalam 'apa pun kepada siapa pun' dipertahankan untuk mencerminkan penekanan teks Yunani, sedangkan penutup kausal tetap singkat agar sifat akhirnya yang mendadak tidak diperhalus.
