id: MRK.16.12
reference: Mark 16:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα δυσὶν ἐξ αὐτῶν περιπατοῦσιν ἐφανερώθη ἐν ἑτέρᾳ μορφῇ πορευομένοις εἰς ἀγρόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/012.yaml
  text: After these things[b][a], he appeared in a different form to two of them as they were walking on their way into the countryside.
translation:
  language: id
  text: Sesudah itu, Ia menampakkan diri dalam rupa yang berbeda[a] kepada dua orang dari antara mereka ketika mereka sedang berjalan menuju daerah pedesaan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam rupa yang lain.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menuju sebuah ladang”; di sini “menuju daerah pedesaan” mencerminkan kemungkinan makna ἀγρός dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Sesudah itu
  rationale: Ungkapan ini mempertahankan urutan waktu yang ditandai oleh μετά dengan akusatif, sedangkan nuansa resumtif δέ tersampaikan secara alami tanpa perlu diterjemahkan sebagai kata penghubung tersendiri.
- source_word: δυσὶν ἐξ αὐτῶν
  choice: kepada dua orang dari antara mereka
  rationale: Bentuk datif δυσίν menunjukkan penerima penampakan, dan ἐξ αὐτῶν menyatakan bahwa keduanya berasal dari kelompok yang lebih besar.
- source_word: περιπατοῦσιν
  choice: ketika mereka sedang berjalan
  rationale: Partisipel kini ini menggambarkan tindakan yang sedang berlangsung bersamaan dengan tindakan utama.
- source_word: ἐφανερώθη
  choice: Ia menampakkan diri
  rationale: Dalam konteks penampakan sesudah kebangkitan, bentuk pasif φανερόω secara idiomatis menyatakan bahwa Ia menjadi tampak atau hadir kepada mereka. 'Menampakkan diri' alami dalam bahasa Indonesia dan tidak menyiratkan pihak lain yang membuat-Nya tampak.
- source_word: ἐν ἑτέρᾳ μορφῇ
  choice: dalam rupa yang berbeda
  rationale: ἑτέρᾳ menandai perbedaan, sedangkan μορφή menunjuk pada rupa atau bentuk. Terjemahan ini mempertahankan pernyataan teks tanpa menerangkan sifat perbedaannya.
- source_word: πορευομένοις
  choice: menuju
  rationale: Partisipel ini menyatakan gerak dengan tujuan. Karena περιπατοῦσιν sudah diterjemahkan 'sedang berjalan', 'menuju' menghindari pengulangan janggal sambil tetap menyampaikan arah perjalanan.
- source_word: εἰς ἀγρόν
  choice: menuju daerah pedesaan
  rationale: Walaupun ἀγρός dapat berarti sebuah ladang, dalam konteks perjalanan frasa ini kemungkinan menunjuk pada kawasan luar kota atau pedesaan. Pilihan ini menyampaikan tujuan secara alami, sementara arti yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Sifat penampakan kebangkitan yang dinyatakan oleh ἐν ἑτέρᾳ μορφῇ
  choice: dalam rupa yang berbeda
  alternative: dalam rupa yang lain; dengan penampilan yang berbeda
  rationale: Ayat ini menyatakan bahwa Yesus menampakkan diri dalam rupa yang berbeda, tetapi tidak menjelaskan apakah perbedaan itu menyangkut perubahan penampilan, persepsi para saksi, atau cara lain untuk dikenali. Terjemahan mempertahankan ketegangan tersebut tanpa menambahkan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. 'Ia' dipakai untuk subjek tersirat yang dalam konteks merujuk kepada Yesus. Susunan kalimat diatur agar kedua partisipel Yunani tersampaikan tanpa pengulangan gerak yang kaku.
