  text: καὶ ἔλεγον πρὸς ἑαυτάς· Τίς ἀποκυλίσει ἡμῖν τὸν λίθον ⸀ἐκ τῆς θύρας τοῦ μνημείου;
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/003.yaml
  text: And they were saying to one another[a], “Who will roll away the stone for us from the entrance of the tomb?”
translation:
  language: id
  text: Mereka berkata satu sama lain, “Siapa yang akan menggulingkan batu itu dari pintu masuk[a] makam bagi kami?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pintu makam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: berkata
  rationale: Bentuk imperfek menggambarkan percakapan yang sedang berlangsung dalam latar narasi. Dalam bahasa Indonesia, aspek ini cukup alami tersampaikan oleh konteks tanpa harus menambahkan ‘terus berkata’.
- source_word: πρὸς ἑαυτάς
  choice: satu sama lain
  rationale: 'Walaupun secara harfiah dapat berarti ‘kepada diri mereka sendiri’, bentuk jamak dalam konteks ini bersifat timbal balik: para perempuan itu berbicara seorang kepada yang lain.'
- source_word: Τίς
  choice: Siapa
  rationale: Kata tanya ini menanyakan orang yang dapat melakukan tindakan tersebut; ‘Siapa’ adalah padanan Indonesia yang langsung dan alami.
- source_word: ἀποκυλίσει
  choice: akan menggulingkan
  rationale: Kata kerja ini secara khusus menunjuk pada tindakan menggulingkan sesuatu menjauh dari posisinya dan mempertahankan gambaran konkret batu penutup makam.
- source_word: ἡμῖν
  choice: bagi kita
  rationale: 'Datif ini menyatakan kepentingan atau manfaat: tindakan itu dilakukan demi mereka. ‘Bagi kita’ mempertahankan fungsi tersebut secara jelas.'
- source_word: τὸν λίθον
  choice: batu itu
  rationale: Artikelnya menunjuk pada batu tertentu yang menutup makam. Ukurannya tidak ditambahkan karena tidak dinyatakan dalam ayat ini.
- source_word: ἐκ τῆς θύρας
  choice: dari pintu masuk
  rationale: θύρα dapat berarti ‘pintu’ atau ‘jalan masuk’. Karena yang dimaksud ialah bukaan makam, ‘pintu masuk’ jelas dan alami dalam bahasa Indonesia.
- source_word: τοῦ μνημείου
  choice: makam
  rationale: Dalam konteks penguburan ini, μνημεῖον menunjuk pada makam, bukan sekadar monumen peringatan.
