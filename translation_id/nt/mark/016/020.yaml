source:
  edition: SBLGNT
  text: ἐκεῖνοι δὲ ἐξελθόντες ἐκήρυξαν πανταχοῦ, τοῦ κυρίου συνεργοῦντος καὶ τὸν λόγον βεβαιοῦντος διὰ τῶν ἐπακολουθούντων ⸀σημείων.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/020.yaml
  text: And they went out and proclaimed everywhere[b][a], while the Lord worked with them and confirmed the message through the accompanying signs.
translation:
  language: id
  text: Mereka pun pergi dan memberitakan di mana-mana. Tuhan turut bekerja bersama mereka dan meneguhkan berita itu[a] melalui tanda-tanda yang menyusul.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “firman.” Kata Yunani λόγος dapat berarti “firman” atau “perkataan”; di sini kata itu menunjuk pada berita yang diberitakan.
    reason: lexical_alternative
  - marker: b
    text: Atau “melalui tanda-tanda yang menyertai.” Ungkapan Yunaninya dapat berarti tanda-tanda yang menyusul atau yang menyertai.
    reason: lexical_alternative
  - marker: c
    text: Markus 16:9–20 tidak terdapat dalam beberapa naskah Yunani yang paling awal, sedangkan banyak naskah lain memuat bagian ini; sejumlah naskah juga memiliki penutup yang berbeda.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκεῖνοι δὲ
  choice: Mereka pun
  rationale: ἐκεῖνοι merujuk kembali kepada kelompok murid yang baru disebutkan, sedangkan δέ melanjutkan alur narasi. “Mereka pun” alami dalam bahasa Indonesia dan tidak menambahkan penegasan gender.
- source_word: ἐξελθόντες ἐκήρυξαν
  choice: pergi dan memberitakan
  rationale: Partisip aoris paling wajar dipahami sebagai tindakan yang menyertai verba utama. “Memberitakan” menyampaikan gagasan proklamasi publik tanpa membatasinya pada khotbah dalam ibadah.
- source_word: πανταχοῦ
  choice: di mana-mana
  rationale: Padanan adverbial yang alami dan tepat untuk cakupan luas πανταχοῦ.
- source_word: τοῦ κυρίου συνεργοῦντος
  choice: Tuhan turut bekerja bersama mereka
  rationale: Konstruksi genitivus absolut menyatakan tindakan Tuhan yang berlangsung bersama pelayanan mereka. “Turut bekerja bersama mereka” mempertahankan unsur kerja bersama dalam συνεργέω.
- source_word: τὸν λόγον
  choice: berita itu
  rationale: Dalam konteks ini λόγος menunjuk pada berita yang mereka proklamasikan. “Berita itu” lebih transparan bagi pembaca modern, sementara padanan harfiah “firman” dicatat sebagai alternatif.
- source_word: βεβαιοῦντος
  choice: meneguhkan
  rationale: βεβαιόω di sini berarti mengukuhkan atau mengonfirmasi kebenaran dan keandalan pemberitaan.
- source_word: διὰ τῶν ἐπακολουθούντων σημείων
  choice: melalui tanda-tanda yang menyusul
  rationale: διά dengan genitif menyatakan sarana. “Yang menyusul” mempertahankan kemungkinan makna mengikuti pada ἐπακολουθέω dan tidak menentukan secara tersirat apakah tanda-tanda itu menyertai para pemberita atau berita mereka.
theological_decisions:
- issue: Rujukan gelar “Tuhan”
  choice: Mempertahankan “Tuhan” tanpa menggantinya dengan nama Yesus
  alternative: Menyebut “Yesus” secara eksplisit
  rationale: Konteks langsung pada ayat 19 menunjukkan bahwa gelar itu merujuk kepada Yesus yang bangkit, tetapi teks ayat ini sendiri memakai κύριος. Mempertahankan gelarnya setia pada bentuk sumber tanpa mengaburkan rujukan kontekstual.
- issue: Fungsi tanda-tanda
  choice: Tanda-tanda merupakan sarana yang meneguhkan berita
  alternative: Tanda-tanda hanya mengikuti para pemberita tanpa fungsi pengesahan yang jelas
  rationale: Sintaksis menghubungkan “meneguhkan berita itu” dengan frasa “melalui tanda-tanda,” sehingga fungsi pengesahannya dinyatakan oleh teks. Terjemahan tidak menarik kesimpulan tambahan tentang kelanjutan atau kenormatifan tanda-tanda tersebut.
- issue: Hubungan tanda-tanda dengan yang diiringinya
  choice: Membiarkan objek hubungan itu tidak dinyatakan
  alternative: Menentukan bahwa tanda-tanda menyertai berita atau para murid
  rationale: Partisip ἐπακολουθούντων menerangkan tanda-tanda, tetapi teks tidak menyebut objek yang diikuti atau disertai. “Yang menyusul” menjaga keterbukaan ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar alami dalam bahasa Indonesia tanpa mengubah hubungan logisnya. “Memberitakan” dipilih daripada istilah yang lebih sempit dan bernuansa kelembagaan; ambiguitas pada tanda-tanda yang ‘menyusul/menyertai’ dipertahankan.
