  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπάγετε εἴπατε τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ ὅτι Προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν· ἐκεῖ αὐτὸν ὄψεσθε, καθὼς εἶπεν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/007.yaml
  text: But go[a], tell his disciples and Peter, ‘He is going ahead of you into Galilee. There you will see him[b], just as he told you.’
translation:
  language: id
  text: Tetapi pergilah, katakanlah kepada murid-murid-Nya dan kepada Petrus[a], “Ia mendahului kalian ke Galilea[b]. Di sana kalian akan melihat Dia, seperti yang telah Ia katakan kepada kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Petrus disebut secara tersendiri dari “murid-murid-Nya”. Hal ini mungkin menyoroti pemulihannya setelah ia menyangkal Yesus, tetapi teks Yunani tidak secara eksplisit mengatakan “terutama Petrus”.
    reason: alternative_reading
  - marker: b
    text: Atau “memasuki Galilea”. Kata depan Yunani dapat menyatakan gerak “ke” ataupun “masuk ke” dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan dan peralihan yang tegas kepada tindakan yang diperintahkan, dengan ungkapan yang alami dalam bahasa Indonesia.
- source_word: ὑπάγετε
  choice: pergilah
  rationale: Mempertahankan bentuk perintah jamak dan desakan untuk berangkat tanpa melebih-lebihkan aspek verba.
- source_word: εἴπατε
  choice: katakanlah
  rationale: Bentuk perintah jamak yang secara langsung menyampaikan tugas untuk memberitakan pesan kepada para penerima yang disebutkan.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: kepada murid-murid-Nya
  rationale: Menyampaikan datif penerima dan kepunyaan secara wajar dalam bahasa Indonesia.
- source_word: καὶ τῷ Πέτρῳ
  choice: dan kepada Petrus
  rationale: Mempertahankan penyebutan Petrus secara terpisah tanpa menambahkan makna ‘terutama’ atau ‘termasuk’ yang tidak dinyatakan secara gramatikal.
- source_word: ὅτι
  choice: tanda petik langsung
  rationale: Memperkenalkan isi pesan sebagai kutipan langsung, cara yang jelas dan alami untuk mewakili klausa isi dalam konteks ini.
- source_word: Προάγει ὑμᾶς
  choice: Ia mendahului kalian
  rationale: Menjaga makna gerak lebih dahulu di depan para murid. ‘Kalian’ memperjelas bahwa pronomina sumber berbentuk jamak.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ke Galilea
  rationale: ‘Ke’ merupakan padanan Indonesia yang paling alami untuk arah tujuan di sini, sambil mengakui bahwa εἰς juga dapat menekankan gerak masuk.
- source_word: ἐκεῖ
  choice: Di sana
  rationale: Padanan lokatif langsung yang merujuk kembali kepada Galilea.
- source_word: αὐτὸν ὄψεσθε
  choice: kalian akan melihat Dia
  rationale: Menyampaikan persepsi atau perjumpaan pada masa mendatang secara lugas tanpa menambahkan rincian yang tidak tersurat.
- source_word: καθὼς εἶπεν ὑμῖν
  choice: sebagaimana telah dikatakan-Nya kepada kalian
  rationale: Mempertahankan gagasan kesesuaian dengan perkataan Yesus sebelumnya; ‘telah’ menyatakan bahwa perkataan itu sudah disampaikan.
theological_decisions:
- issue: Petrus disebut tersendiri setelah murid-murid Yesus
  choice: Mempertahankan susunan koordinatif ‘murid-murid-Nya dan ... Petrus’.
  alternative: ‘murid-murid-Nya, terutama Petrus’ atau ‘murid-murid-Nya, termasuk Petrus’
  rationale: Teks Yunani menonjolkan Petrus dengan menyebutnya secara terpisah, tetapi tidak secara eksplisit menjelaskan apakah maksudnya terutama pemulihan, penegasan bahwa ia tetap termasuk murid, atau nuansa lain. Terjemahan tidak menyelesaikan ketegangan naratif dan teologis itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘kalian’ dipakai untuk memperjelas bahwa ὑμᾶς dan ὑμῖν berbentuk jamak. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan hormat yang lazim dalam penerbitan Alkitab Indonesia.
