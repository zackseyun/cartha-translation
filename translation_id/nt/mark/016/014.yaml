  to: Kemudian Ia menampakkan diri kepada kesebelas murid ketika mereka sedang berbaring sambil makan[a]. Ia menegur mereka karena ketidakpercayaan dan kekerasan hati mereka, sebab mereka tidak memercayai orang-orang yang telah melihat-Nya sesudah Ia dibangkitkan[b].
