source:
  edition: SBLGNT
  text: Ὕστερον ⸀δὲ ἀνακειμένοις αὐτοῖς τοῖς ἕνδεκα ἐφανερώθη, καὶ ὠνείδισεν τὴν ἀπιστίαν αὐτῶν καὶ σκληροκαρδίαν ὅτι τοῖς θεασαμένοις αὐτὸν ⸀ἐγηγερμένον οὐκ ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/014.yaml
  text: Later[a], he appeared to the eleven themselves as they were reclining at the table, and he rebuked their unbelief and hardness of heart[c][b], because they had not believed those who had seen him after he had been raised.
translation:
  language: id
  text: Kemudian Ia menampakkan diri kepada kesebelas murid ketika mereka sedang berbaring sambil makan[a]. Ia menegur mereka karena ketidakpercayaan dan kekerasan hati mereka, sebab mereka tidak memercayai orang-orang yang telah melihat-Nya sesudah Ia dibangkitkan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pada zaman itu, orang lazim makan dalam posisi berbaring atau bersandar.
    reason: cultural_note
  - marker: b
    text: 'Secara lebih harfiah: “orang-orang yang telah melihat-Nya dalam keadaan telah dibangkitkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕστερον
  choice: Kemudian
  rationale: Menandai peristiwa yang terjadi sesudah penampakan-penampakan sebelumnya dengan ungkapan waktu yang alami dalam bahasa Indonesia modern.
- source_word: ἀνακειμένοις
  choice: ketika mereka sedang berbaring untuk makan
  rationale: Mempertahankan gambaran sikap tubuh yang lazim dalam perjamuan pada zaman itu sekaligus menjelaskan konteks makan bagi pembaca modern.
- source_word: αὐτοῖς τοῖς ἕνδεκα
  choice: kepada kesebelas murid itu sendiri
  rationale: Kata 'murid' memperjelas kelompok yang dimaksud, sedangkan 'itu sendiri' mencerminkan penekanan αὐτοῖς pada kelompok kesebelas tersebut.
- source_word: ἐφανερώθη
  choice: Ia menampakkan diri
  rationale: Ungkapan ini alami untuk konteks penampakan pascakebangkitan dan tetap mencerminkan bentuk Yunani yang menyatakan bahwa Ia menjadi tampak kepada mereka.
- source_word: ὠνείδισεν
  choice: menegur
  rationale: Menyampaikan kecaman lisan yang tegas tanpa memakai diksi yang kuno atau berlebihan.
- source_word: ἀπιστίαν
  choice: ketidakpercayaan
  rationale: Secara langsung menyatakan kegagalan atau penolakan mereka untuk memercayai kesaksian yang telah diberikan.
- source_word: σκληροκαρδίαν
  choice: kekerasan hati
  rationale: Mempertahankan metafora alkitabiah tentang batin yang keras dan tidak mau menerima kesaksian.
- source_word: θεασαμένοις
  choice: orang-orang yang telah melihat-Nya
  rationale: Mengungkapkan dengan jelas bahwa orang-orang tersebut merupakan saksi mata.
- source_word: ἐγηγερμένον
  choice: sesudah Ia dibangkitkan
  rationale: Mempertahankan makna kebangkitan dan bentuk pasif verba Yunani dalam susunan Indonesia yang wajar.
- source_word: οὐκ ἐπίστευσαν
  choice: mereka tidak memercayai
  rationale: Objeknya adalah orang-orang yang telah bersaksi; bentuk ini alami dalam bahasa Indonesia dan menunjukkan penolakan terhadap kesaksian mereka.
theological_decisions:
- issue: Bentuk pasif dalam ἐγηγερμένον
  choice: sesudah Ia dibangkitkan
  alternative: setelah Ia bangkit; melihat-Nya dalam keadaan telah dibangkitkan
  rationale: Pilihan utama menjaga bentuk pasif kebangkitan tanpa menetapkan pelaku yang tidak disebutkan secara eksplisit dalam ayat ini. Catatan kaki mempertahankan bentuk partisipel yang lebih harfiah.
- issue: Metafora σκληροκαρδία
  choice: kekerasan hati
  alternative: sikap keras kepala
  rationale: Metafora sumber dipertahankan karena mencakup penolakan batin dan memiliki resonansi alkitabiah yang lebih luas daripada sekadar keras kepala.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kalimat dibuat alami tanpa menghilangkan penekanan pada kesebelas murid, metafora 'kekerasan hati', atau bentuk pasif dalam pernyataan kebangkitan.
