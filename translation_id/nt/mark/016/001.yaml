  text: Καὶ διαγενομένου τοῦ σαββάτου ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ τοῦ⸃ Ἰακώβου καὶ Σαλώμη ἠγόρασαν ἀρώματα ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/001.yaml
  text: And when the Sabbath was over[a], Mary Magdalene, Mary the mother of James, and Salome bought spices so that they might come and anoint him.
translation:
  language: id
  text: Setelah Sabat berakhir, Maria Magdalena, Maria ibu Yakobus[a], dan Salome membeli rempah-rempah supaya mereka dapat datang dan mengurapi-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Yunani berbunyi “Maria yang dari Yakobus”. Ini adalah ungkapan eliptis yang mengidentifikasi Maria sebagai ibu Yakobus.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαγενομένου τοῦ σαββάτου
  choice: Setelah hari Sabat berlalu
  rationale: Genitif absolut menyatakan waktu yang mendahului tindakan utama. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan urutan waktunya.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Maria Magdalena
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: Μαρία ἡ τοῦ Ἰακώβου
  choice: Maria yang terkait dengan Yakobus
  rationale: Bahasa Yunani secara eliptis menyebut Maria sebagai 'yang dari Yakobus' tanpa menyatakan jenis hubungannya. Terjemahan utama mempertahankan ketidakjelasan asli, sedangkan catatan menjelaskan pemahaman tradisional.
- source_word: Σαλώμη
  choice: Salome
  rationale: Transliterasi nama yang lazim dalam bahasa Indonesia.
- source_word: ἠγόρασαν
  choice: membeli
  rationale: Padanan naratif sederhana dan langsung bagi verba aoris tersebut.
- source_word: ἀρώματα
  choice: rempah-rempah harum
  rationale: Menunjuk pada bahan-bahan beraroma yang digunakan dalam penanganan jenazah; padanan ini lebih jelas daripada sekadar 'rempah-rempah'.
- source_word: ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν
  choice: untuk datang dan mengurapi Dia
  rationale: ἵνα menyatakan tujuan, dan partisip ἐλθοῦσαι menunjukkan tindakan datang sebelum mengurapi. Susunan ini alami sekaligus mempertahankan rangkaian tindakannya.
- source_word: ἀλείψωσιν
  choice: mengurapi
  rationale: Mempertahankan arti langsung verba, yakni mengoleskan bahan harum atau minyak, dan sesuai dengan konteks pemakaman.
theological_decisions:
- issue: Hubungan Maria dengan Yakobus dalam ungkapan eliptis Μαρία ἡ τοῦ Ἰακώβου
  choice: Maria yang terkait dengan Yakobus
  alternative: Maria ibu Yakobus
  rationale: Teks Yunani tidak menyebut kata 'ibu'. Walaupun konteks Injil dan pemahaman tradisional mendukung arti 'ibu Yakobus', teks utama mempertahankan ambiguitas gramatikal yang asli dan menjelaskannya dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah 'hari Sabat', 'mengurapi', serta kapitalisasi pronomina 'Dia' mengikuti register Alkitab Indonesia yang lazim tanpa memperluas makna sumber.
