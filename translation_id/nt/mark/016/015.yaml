id: MRK.16.15
reference: Mark 16:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἰς τὸν κόσμον ἅπαντα κηρύξατε τὸ εὐαγγέλιον πάσῃ τῇ κτίσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/015.yaml
  text: And he said to them[b][a], “Go into all the world and proclaim the good news to all creation.”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Pergilah ke seluruh dunia dan beritakanlah kabar baik[a] kepada seluruh ciptaan.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Injil”. Kata Yunani εὐαγγέλιον secara harfiah berarti “kabar baik”.
    reason: lexical_alternative
  - marker: b
    text: Atau, “kepada setiap makhluk”. Frasa Yunani ini dapat dipahami secara kolektif (“seluruh ciptaan”) atau secara distributif (“setiap makhluk”).
    reason: alternative_reading
lexical_decisions:
- source_word: Πορευθέντες
  choice: Pergilah
  rationale: Partisip aoris ini mendahului imperatif utama κηρύξατε dan berfungsi sebagai tindakan penyerta dalam amanat tersebut. Bentuk imperatif “Pergilah” menyampaikan daya perintah secara wajar dalam bahasa Indonesia tanpa kekakuan “setelah pergi” atau pelemahan “sementara kalian pergi”.
- source_word: κόσμον ἅπαντα
  choice: seluruh dunia
  rationale: κόσμος di sini menunjuk dunia sebagai ruang lingkup misi, sedangkan ἅπαντα menegaskan keseluruhannya. “Seluruh dunia” alami dan mempertahankan cakupan universal ungkapan Yunani.
- source_word: κηρύξατε
  choice: beritakanlah
  rationale: κηρύσσω berarti mengumumkan atau memberitakan secara terbuka sebagai seorang bentara. “Beritakanlah” mempertahankan nuansa pengumuman publik dan lebih luas daripada istilah yang dapat terdengar khusus sebagai kegiatan gerejawi.
- source_word: τὸ εὐαγγέλιον
  choice: kabar baik
  rationale: εὐαγγέλιον secara harfiah berarti “kabar baik”. Pilihan ini menyampaikan maknanya secara langsung dalam bahasa Indonesia modern, sementara istilah Kristen yang mapan, “Injil”, dipertahankan dalam catatan kaki.
- source_word: πάσῃ τῇ κτίσει
  choice: kepada seluruh ciptaan
  rationale: κτίσις dapat berarti “ciptaan” atau “makhluk”. Ungkapan “seluruh ciptaan” mempertahankan keluasan dan gema kosmis frasa Yunani tanpa mempersempitnya hanya kepada individu manusia.
- source_word: εἶπεν αὐτοῖς
  choice: Ia berkata kepada mereka
  rationale: Ini merupakan pengantar naratif langsung yang mencerminkan verba λέγω dengan objek tak langsung αὐτοῖς tanpa menambahkan nuansa penafsiran.
theological_decisions:
- issue: Cakupan πάσῃ τῇ κτίσει dalam amanat pemberitaan
  choice: kepada seluruh ciptaan
  alternative: kepada setiap makhluk
  rationale: Frasa Yunani dapat dipahami secara kolektif atau kosmis (“seluruh ciptaan”) maupun secara distributif (“setiap makhluk”). Teks utama mempertahankan cakupan luasnya, sementara catatan kaki menjaga kemungkinan distributif tanpa membatasi ungkapan itu secara diam-diam hanya kepada manusia.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk “Pergilah” dan “beritakanlah” mempertahankan daya amanat, sedangkan “kabar baik” mudah dipahami pembaca umum. Kata ganti “Ia” mengikuti kelaziman narasi Alkitab bahasa Indonesia tanpa menambahkan gelar yang tidak terdapat dalam ayat.
