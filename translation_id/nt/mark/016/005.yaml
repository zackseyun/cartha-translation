  text: καὶ εἰσελθοῦσαι εἰς τὸ μνημεῖον εἶδον νεανίσκον καθήμενον ἐν τοῖς δεξιοῖς περιβεβλημένον στολὴν λευκήν, καὶ ἐξεθαμβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/005.yaml
  text: And when they entered the tomb, they saw a young man sitting on the right, clothed in a white robe, and they were alarmed.
translation:
  language: id
  text: Ketika mereka masuk ke dalam makam itu, mereka melihat seorang pemuda[a] duduk di sebelah kanan, mengenakan jubah putih, dan mereka sangat terkejut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “malaikat.” Di sini Markus menggambarkannya sebagai “seorang pemuda,” meskipun konteks yang lebih luas dan kisah-kisah sejajar menunjukkan bahwa ia adalah seorang malaikat, yaitu utusan Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: ketika mereka masuk
  rationale: Partisip aoris feminin jamak ini mengacu kepada para perempuan dalam konteks. Klausa waktu alami dalam bahasa Indonesia mempertahankan hubungannya dengan verba utama.
- source_word: μνημεῖον
  choice: makam
  rationale: Dalam konteks penguburan dan kebangkitan, 'makam' merupakan padanan Indonesia yang jelas dan lazim untuk tempat jenazah dibaringkan.
- source_word: νεανίσκον
  choice: seorang pemuda
  rationale: Kata Yunani ini secara langsung menyebut seorang laki-laki muda; ayat ini sendiri tidak secara eksplisit memakai kata 'malaikat'.
- source_word: καθήμενον ἐν τοῖς δεξιοῖς
  choice: duduk di sebelah kanan
  rationale: Mengungkapkan postur dan posisi tokoh tersebut secara alami tanpa menambahkan acuan tempat yang tidak dinyatakan secara eksplisit.
- source_word: περιβεβλημένον στολὴν λευκήν
  choice: mengenakan jubah putih
  rationale: Partisip perfektum menggambarkan keadaannya yang berpakaian, sedangkan στολή menunjuk pada pakaian luar atau jubah yang panjang dan khas.
- source_word: ἐξεθαμβήθησαν
  choice: mereka pun sangat terkejut
  rationale: Verba ini menyatakan guncangan emosional atau keterkejutan yang kuat. 'Sangat terkejut' mempertahankan intensitasnya tanpa mempersempit makna menjadi ketakutan semata.
theological_decisions:
- issue: Identitas νεανίσκος
  choice: Teks utama menerjemahkannya secara deskriptif sebagai 'seorang pemuda'.
  alternative: malaikat
  rationale: Walaupun pakaian putih, konteks kebangkitan, dan kisah-kisah sejajar menunjukkan seorang utusan malaikat, Markus 16:5 sendiri memakai νεανίσκος. Terjemahan utama mempertahankan cara Markus menyebut tokoh itu, sementara catatan menjelaskan identifikasi kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. 'Makam' dipilih daripada 'kubur' agar jelas menunjuk ruang pemakaman yang dapat dimasuki. Kata 'pun' membantu menyampaikan alur akibat secara wajar tanpa menambah isi teologis.
