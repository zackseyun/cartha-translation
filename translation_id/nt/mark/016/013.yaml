  text: κἀκεῖνοι ἀπελθόντες ἀπήγγειλαν τοῖς λοιποῖς· οὐδὲ ἐκείνοις ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/013.yaml
  text: And they went away and reported it to the rest[a], but they did not believe them either.
translation:
  language: id
  text: Mereka pun pergi dan memberitahukan hal itu kepada yang lain[a], tetapi yang lain itu pun tidak percaya kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kepada orang-orang yang selebihnya.”'
    reason: Alternatif ini menonjolkan nuansa λοιποί sebagai anggota kelompok yang masih tersisa.
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: Mereka pun
  rationale: Bentuk gabungan ini berarti “dan mereka itu” atau “mereka juga.” “Mereka pun” menyampaikan kesinambungan dan unsur tambahan secara alami tanpa menambahkan penyebutan gender yang tidak eksplisit dalam bentuk ungkapan Indonesia.
- source_word: ἀπελθόντες
  choice: pergi
  rationale: Partisip aoris ini menunjukkan tindakan pergi yang mendahului tindakan melaporkan. Dalam bahasa Indonesia, urutan verba “pergi dan memberitahukan” menyampaikan urutan tersebut secara wajar.
- source_word: ἀπήγγειλαν
  choice: memberitahukan hal itu
  rationale: Verba ini berarti melaporkan atau menyampaikan berita. “Hal itu” melengkapi objek yang tersirat dalam bahasa Yunani berdasarkan konteks tanpa menentukan lebih jauh isi laporan.
- source_word: τοῖς λοιποῖς
  choice: kepada yang lain
  rationale: Ungkapan ini menunjuk kepada anggota kelompok lainnya atau yang masih tersisa. “Yang lain” ringkas, alami, dan tidak mempersempit rujukannya dengan menambahkan “murid-murid” ke teks utama.
- source_word: οὐδὲ
  choice: tetapi ... pun tidak
  rationale: Dalam konteks ini οὐδέ menghubungkan penolakan ini dengan penolakan sebelumnya dan membawa arti tambahan “juga tidak.” Susunan “tetapi ... pun tidak” mempertahankan peralihan naratif sekaligus daya tambahannya.
- source_word: ἐκείνοις
  choice: mereka
  rationale: Pronomina datif jamak ini merujuk kembali kepada dua orang yang menyampaikan laporan. “Memercayai mereka” merupakan ungkapan Indonesia yang alami dalam konteks menerima kesaksian seseorang.
- source_word: ἐπίστευσαν
  choice: memercayai
  rationale: Dalam konteks naratif ini πιστεύω berarti menerima atau menganggap benar kesaksian yang disampaikan, bukan secara khusus menaruh kepercayaan religius.
theological_decisions:
- issue: Makna πιστεύω dalam konteks kesaksian naratif
  choice: tidak memercayai mereka
  alternative: tidak percaya kepada mereka; tidak menerima kesaksian mereka
  rationale: Ayat ini berbicara tentang penolakan terhadap laporan kedua orang itu. “Tidak memercayai mereka” mempertahankan makna langsung verba tersebut tanpa memasukkan rumusan doktrinal atau menambahkan kata “kesaksian” yang tidak eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Pengulangan “yang lain” dalam klausa kedua dipertahankan demi memperjelas bahwa kelompok penerima laporanlah yang tidak memercayai kedua pelapor.
