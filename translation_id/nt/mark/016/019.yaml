id: MRK.16.19
reference: Mark 16:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁ μὲν οὖν κύριος ⸀Ἰησοῦς μετὰ τὸ λαλῆσαι αὐτοῖς ἀνελήμφθη εἰς τὸν οὐρανὸν καὶ ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/019.yaml
  text: So then, the Lord Jesus, after speaking to them, was taken up into heaven and sat down at the right hand of God.
translation:
  language: id
  text: Jadi, setelah berbicara kepada mereka, Tuhan Yesus diangkat ke surga dan duduk di sebelah kanan Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὲν οὖν
  choice: Jadi
  rationale: Gabungan partikel ini menandai peralihan sekaligus kesimpulan. “Jadi” menyampaikan daya resumptif dan inferensialnya secara wajar dalam bahasa Indonesia.
- source_word: κύριος Ἰησοῦς
  choice: Tuhan Yesus
  rationale: “Tuhan” mempertahankan bobot gelar κύριος dalam pemakaian kristologis Perjanjian Baru, sedangkan Ἰησοῦς diterjemahkan sebagai nama “Yesus”.
- source_word: μετὰ τὸ λαλῆσαι αὐτοῖς
  choice: setelah berbicara kepada mereka
  rationale: Konstruksi μετά dengan infinitif berartikel menyatakan waktu, yakni “setelah”; frasa ini juga mempertahankan αὐτοῖς sebagai “kepada mereka” tanpa membuat kalimat kaku.
- source_word: ἀνελήμφθη
  choice: diangkat
  rationale: Bentuk pasif aoris dipertahankan dengan “diangkat,” tanpa menentukan pelaku yang tidak disebutkan secara eksplisit dalam klausa ini.
- source_word: εἰς τὸν οὐρανόν
  choice: ke surga
  rationale: “Ke surga” merupakan padanan bahasa Indonesia yang alami bagi arah yang dinyatakan oleh εἰς dengan akusatif.
- source_word: ἐκάθισεν
  choice: duduk
  rationale: Aoris aktif menyatakan tindakan mengambil posisi duduk; “duduk” alami dalam bahasa Indonesia dan cukup menyampaikan tindakan tersebut dalam rangkaian naratif.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: di sebelah kanan Allah
  rationale: Ungkapan Yunani ini merupakan idiom tempat dan kedudukan terhormat. “Di sebelah kanan Allah” mempertahankan ungkapan alkitabiah yang lazim tanpa menerjemahkan ἐκ secara harfiah dan menyesatkan.
theological_decisions:
- issue: Bahasa kenaikan dan pemuliaan Yesus
  choice: diangkat ke surga dan duduk di sebelah kanan Allah
  alternative: diterima ke surga dan mengambil tempat di sebelah kanan Allah
  rationale: Pilihan ini mempertahankan bentuk pasif kenaikan serta idiom kedudukan di sebelah kanan Allah, tanpa menambahkan penjelasan doktrinal yang tidak dinyatakan oleh teks.
- issue: κύριος sebagai gelar kristologis
  choice: Tuhan Yesus
  alternative: Tuan Yesus
  rationale: “Tuhan” mempertahankan bobot teologis dan pemakaian baku κύριος sebagai gelar bagi Yesus; “Tuan” akan terlalu membatasi maknanya pada sapaan sosial.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan peristiwa dan bentuk pasif teks Yunani.
