  text: κἀκεῖνοι ἀκούσαντες ὅτι ζῇ καὶ ἐθεάθη ὑπ’ αὐτῆς ἠπίστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/011.yaml
  text: And they[a], when they heard that he was alive and had been seen by her[b], did not believe.
translation:
  language: id
  text: Dan mereka, ketika mendengar bahwa Ia hidup[a] dan telah dilihat oleh perempuan itu,[b] tidak percaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Yunani berbentuk kala kini; juga dapat diterjemahkan, “Ia masih hidup.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “telah dilihat olehnya.” Kata kerja Yunani berbentuk pasif.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: mereka
  rationale: Merujuk kepada kelompok yang baru disebutkan. Hubungan naratif yang dibawa καί tersampaikan secara alami melalui kesinambungan kalimat tanpa perlu menambahkan penanda yang berlebihan.
- source_word: ἀκούσαντες
  choice: ketika mereka mendengar
  rationale: Partisip aoris ini paling wajar dipahami secara temporal dan menunjukkan peristiwa yang mendahului ketidakpercayaan mereka.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi berita yang mereka dengar.
- source_word: ζῇ
  choice: Ia hidup
  rationale: Bentuk kini Yunani menyatakan bahwa Yesus berada dalam keadaan hidup. Bahasa Indonesia tidak memerlukan penyesuaian kala sesudah kata kerja lampau seperti dalam bahasa Inggris.
- source_word: ἐθεάθη
  choice: telah dilihat
  rationale: Bentuk pasif mempertahankan sudut pandang bahwa perempuan itu melihat Dia; kata 'telah' memperjelas bahwa peristiwa tersebut sudah terjadi sebelum berita itu didengar.
- source_word: ὑπ’ αὐτῆς
  choice: oleh perempuan itu
  rationale: Menjelaskan rujukan pronomina feminin secara alami tanpa memasukkan nama Maria yang tidak disebut dalam ayat ini.
- source_word: ἠπίστησαν
  choice: tidak percaya
  rationale: Padanan langsung dan wajar yang tidak menambahkan gagasan bahwa mereka secara sengaja menolak untuk percaya.
theological_decisions:
- issue: Ungkapan kehidupan Yesus sesudah kebangkitan
  choice: Ia hidup
  alternative: Ia masih hidup
  rationale: Pilihan utama mempertahankan bentuk kini dan pernyataan langsung teks tanpa kata 'masih', yang dapat secara keliru menyiratkan bahwa kematian tidak sungguh-sungguh terjadi.
- issue: Cara menggambarkan perjumpaan dengan perempuan itu
  choice: telah dilihat oleh perempuan itu
  alternative: telah menampakkan diri kepada perempuan itu
  rationale: Pilihan utama mengikuti bentuk pasif Yunani dan tidak memutuskan apakah penekanannya terletak pada tindakan Yesus menampakkan diri atau pada pengalaman perempuan itu melihat-Nya; alternatif idiomatis dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami, sementara bentuk pasif dan ketegangan makna mengenai 'dilihat' atau 'menampakkan diri' tetap dipertahankan.
