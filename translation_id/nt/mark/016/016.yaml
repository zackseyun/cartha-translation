  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ πιστεύσας καὶ βαπτισθεὶς σωθήσεται, ὁ δὲ ἀπιστήσας κατακριθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/016.yaml
  text: The one who has believed and been baptized will be saved[b][a], but the one who has disbelieved will be condemned.
translation:
  language: id
  text: Orang yang telah percaya dan telah dibaptis akan diselamatkan[a], tetapi orang yang tidak percaya akan dihukum[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Siapa yang percaya dan dibaptis akan diselamatkan.”
    reason: Alternatif ini lebih idiomatis, tetapi kurang menonjolkan bentuk partisip aoris dan konstruksi tunggal pada teks Yunani.
  - marker: b
    text: Atau, “akan dinyatakan bersalah dan dijatuhi hukuman.”
    reason: Alternatif ini mengungkapkan unsur vonis bersalah serta penghukuman dalam κατακριθήσεται, sedangkan “akan dihukum” lebih ringkas dan alami dalam konteks ini.
lexical_decisions:
- source_word: ὁ πιστεύσας
  choice: orang yang telah percaya
  rationale: Artikel dengan partisip aoris berfungsi sebagai nomina dan menunjuk secara umum kepada seseorang yang dicirikan oleh tindakan percaya. Bentuk tunggal dipertahankan, sedangkan “telah” menyatakan tindakan yang mendahului hasil pada verba utama.
- source_word: βαπτισθεὶς
  choice: dibaptis
  rationale: Partisip aoris pasif dipertahankan dengan bentuk pasif “dibaptis”. Kata bantu “telah” pada unsur pertama secara alami menaungi kedua unsur yang dikoordinasikan dalam bahasa Indonesia.
- source_word: σωθήσεται
  choice: akan diselamatkan
  rationale: Bentuk futur pasif diterjemahkan langsung. Dalam konteks ini, maknanya adalah keselamatan, bukan sekadar pertolongan dari bahaya sementara.
- source_word: ὁ δὲ ἀπιστήσας
  choice: tetapi orang yang tidak percaya
  rationale: Ungkapan ini mempertahankan pertentangan dengan “percaya” dan merupakan bentuk Indonesia yang lebih alami daripada “telah tidak percaya”, meskipun nuansa aorisnya menjadi kurang kentara.
- source_word: κατακριθήσεται
  choice: akan dihukum
  rationale: Verba futur pasif ini menyatakan putusan bersalah yang berujung pada penghukuman. “Akan dihukum” jelas dan alami bagi pembaca umum; alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: καὶ
  choice: dan
  rationale: Konjungsi ini mengoordinasikan tindakan percaya dan dibaptis tanpa menambahkan penekanan yang tidak ada dalam teks.
- source_word: δὲ
  choice: tetapi
  rationale: Partikel ini menandai kontras antara kedua orang dan hasil yang berlawanan.
theological_decisions:
- issue: Hubungan antara percaya, baptisan, dan keselamatan
  choice: Kedua partisip diterjemahkan secara langsung sebagai gambaran tentang orang yang akan diselamatkan.
  alternative: Menjadikan baptisan secara eksplisit sebagai penyebab instrumental keselamatan, atau sebaliknya memperlakukannya sebagai unsur sampingan yang tidak terkait.
  rationale: Teks Yunani menghubungkan percaya dan dibaptis dalam klausa pertama, tetapi klausa kedua menyebut ketidakpercayaan—bukan tidak dibaptis—sebagai ciri orang yang dihukum. Terjemahan mempertahankan ketegangan ini tanpa menyelesaikannya menurut ajaran denominasi tertentu.
- issue: Konstruksi tunggal maskulin yang bersifat umum
  choice: orang yang
  alternative: barang siapa; mereka yang
  rationale: “Orang yang” mempertahankan acuan tunggal representatif secara wajar dalam bahasa Indonesia tanpa membatasi rujukannya hanya kepada laki-laki.
- issue: Makna pasif dalam keselamatan dan penghukuman
  choice: akan diselamatkan; akan dihukum
  alternative: akan selamat; akan menerima hukuman
  rationale: Bentuk pasif Yunani dipertahankan tanpa secara eksplisit menyebut pelaku, sebagaimana teks sumber juga tidak menyebutkannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Susunan kalimat mempertahankan kesejajaran serta kontras teks Yunani. Pengulangan kata bantu “telah” dihindari demi kelancaran, tetapi cakupannya atas kedua verba tetap dapat dipahami.
