  terminology: 'Istilah penting digunakan secara konsisten dan memadai: “tanda-tanda,” “menyertai,” “dalam nama-Ku,” “roh-roh jahat,” dan “bahasa-bahasa baru.” Pemakaian “bahasa-bahasa” memilih salah satu kemungkinan leksikal γλώσσαις secara idiomatis dalam bahasa Indonesia, sementara catatan kaki menjelaskan arti alternatif “lidah” dan mempertahankan ambiguitas sumber.'
