source:
  edition: SBLGNT
  text: σημεῖα δὲ τοῖς πιστεύσασιν ⸂ταῦτα παρακολουθήσει⸃, ἐν τῷ ὀνόματί μου δαιμόνια ἐκβαλοῦσιν, γλώσσαις λαλήσουσιν ⸀καιναῖς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/017.yaml
  text: 'And these signs will accompany those who have believed: in my name they will cast out demons[b][a]; they will speak in new tongues.'
translation:
  language: id
  text: 'Tanda-tanda ini akan menyertai[a] orang-orang yang telah percaya: dalam nama-Ku mereka akan mengusir roh-roh jahat; mereka akan berbicara dalam bahasa-bahasa baru.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “mengikuti.” Kata Yunaninya dapat berarti mengikuti atau menyertai; di sini “menyertai” menekankan bahwa tanda-tanda itu hadir bersama orang-orang yang telah percaya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dengan lidah-lidah baru.” Dalam bahasa Yunani, kata “lidah” juga dapat berarti “bahasa.” Ayat ini tidak menjelaskan apakah yang dimaksud adalah bahasa manusia yang sebelumnya tidak dikenal atau jenis ujaran lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: tanda-tanda
  rationale: Kata ini menunjuk pada tanda yang dapat mengesahkan atau menjadi bukti; “tanda-tanda” mempertahankan nuansa itu tanpa mempersempitnya menjadi sekadar mukjizat.
- source_word: τοῖς πιστεύσασιν
  choice: orang-orang yang telah percaya
  rationale: Bentuk partisip aoris dipertahankan dengan “telah percaya,” sementara frasa ini tetap berfungsi secara umum untuk menyebut mereka yang percaya.
- source_word: ταῦτα
  choice: ini
  rationale: Kata tunjuk ini mengarah ke depan, kepada daftar tanda yang segera disebutkan.
- source_word: παρακολουθήσει
  choice: akan menyertai
  rationale: Dalam konteks ini verba tersebut menyatakan bahwa tanda-tanda hadir bersama orang-orang percaya, bukan hanya mengikuti mereka dalam urutan waktu.
- source_word: ἐν τῷ ὀνόματί μου
  choice: dalam nama-Ku
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menyatakan tindakan yang dilakukan dengan otoritas Yesus, tanpa menjabarkan lebih dari yang dikatakan teks.
- source_word: δαιμόνια
  choice: roh-roh jahat
  rationale: Ini merupakan padanan Indonesia yang alami dan mudah dipahami untuk makhluk-makhluk roh jahat yang dimaksud oleh δαιμόνια; “setan-setan” dihindari agar tidak mengaburkan perbedaan dengan nama atau sebutan bagi Satan.
- source_word: ἐκβαλοῦσιν
  choice: akan mengusir
  rationale: “Mengusir” menyampaikan tindakan mengeluarkan secara paksa dan merupakan ungkapan Indonesia yang wajar dalam konteks ini.
- source_word: γλώσσαις
  choice: dalam bahasa-bahasa
  rationale: Dalam konteks berbicara, γλῶσσα dapat berarti bahasa. Bahasa Indonesia tidak memiliki padanan alami yang sekaligus mempertahankan arti harfiah “lidah” dan arti “bahasa,” sehingga ambiguitas sumber dijelaskan dalam catatan kaki.
- source_word: λαλήσουσιν
  choice: mereka akan berbicara
  rationale: Padanan langsung dan bermartabat untuk verba biasa yang berarti berbicara.
- source_word: καιναῖς
  choice: baru
  rationale: “Baru” mempertahankan keterbukaan makna mengenai kebaruan jenis atau sifat tanpa menafsirkannya sebagai sekadar asing atau belum dikenal.
theological_decisions:
- issue: Hakikat “bahasa-bahasa baru”
  choice: Teks utama memakai “bahasa-bahasa baru” tanpa menentukan jenis ujaran yang dimaksud.
  alternative: Fenomena ini dapat dipahami sebagai bahasa manusia yang sebelumnya tidak dikenal atau sebagai ujaran rohani yang tidak identik dengan bahasa manusia biasa.
  rationale: γλώσσαις dapat berarti bahasa-bahasa, tetapi ayat ini sendiri tidak menjelaskan fenomenanya dengan lebih khusus. Terjemahan dan catatan kaki tidak memaksakan salah satu tafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Bentuk jamak dinyatakan secara eksplisit pada unsur-unsur penting. Kapital pada “-Ku” mengikuti konvensi ortografi Alkitab bahasa Indonesia untuk pronomina yang merujuk kepada Yesus.
