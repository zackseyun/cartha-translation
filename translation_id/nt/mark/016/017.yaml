  verdict: approve
  source_fidelity: 'Terjemahan dengan tepat mencerminkan urutan dan isi teks Yunani: tanda-tanda akan menyertai mereka yang telah percaya; pengusiran δαιμόνια dilakukan dalam nama Yesus; dan mereka akan berbicara dalam γλώσσαις καιναῖς. “Orang-orang yang telah percaya” secara memadai menyampaikan partisip aoris πιστεύσασιν dalam fungsi generiknya. “Roh-roh jahat” adalah padanan yang layak bagi δαιμόνια dan tidak mencampurkannya dengan sebutan khusus bagi Iblis. Catatan b secara tepat mempertahankan keterbukaan makna γλῶσσα tanpa menentukan fenomena tersebut secara doktrinal.'
