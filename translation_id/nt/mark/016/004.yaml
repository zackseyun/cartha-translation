translation:
  language: id
  text: Ketika mereka mengangkat pandangan, mereka melihat bahwa batu itu sudah terguling dari tempatnya, sebab batu itu sangat besar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka menyadari bahwa batu itu telah terguling.” Verba perfek Yunani menekankan bahwa batu itu sudah berada dalam keadaan terguling ketika mereka melihatnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβλέψασαι
  choice: ketika mereka mengangkat pandangan
  rationale: Partisip aoris ini menggambarkan para perempuan mengarahkan pandangan ke atas atau ke arah makam. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan tindakan yang mendahului penglihatan mereka.
- source_word: θεωροῦσιν
  choice: mereka melihat
  rationale: Dalam konteks naratif, bentuk kini historis ini menyatakan persepsi visual. Bentuk lampau Indonesia tidak ditandai secara morfologis, sehingga 'mereka melihat' menyampaikan alur cerita dengan wajar.
- source_word: ὅτι
  choice: bahwa
  rationale: Kata ini memperkenalkan isi dari apa yang mereka lihat dan secara alami diterjemahkan dengan 'bahwa'.
- source_word: ἀποκεκύλισται
  choice: sudah terguling
  rationale: 'Bentuk perfek pasif menekankan tindakan yang telah selesai beserta keadaan hasilnya: ketika dilihat, batu itu telah berada dalam keadaan terguling dari tempatnya. ''Sudah terguling'' mempertahankan aspek hasil tersebut tanpa memaksakan penyebutan pelaku.'
- source_word: ὁ λίθος
  choice: batu itu
  rationale: Frasa ini merujuk pada batu penutup makam yang telah disebut atau dipahami dari konteks. 'Batu itu' jelas tanpa menambahkan keterangan yang tidak eksplisit dalam teks Yunani.
- source_word: ἦν γὰρ μέγας σφόδρα
  choice: sebab batu itu sangat besar
  rationale: γάρ memberi alasan atau penjelasan, sedangkan σφόδρα sangat menguatkan μέγας. Pengulangan 'batu itu' menghindari ambiguitas pronominal dalam bahasa Indonesia dan 'sangat besar' terdengar alami serta bermartabat.
- source_word: καὶ
  choice: ketika
  rationale: Hubungan antartindakan dalam kalimat Indonesia dinyatakan secara alami melalui konstruksi temporal partisipial. Makna kesinambungan narasi tetap terpelihara tanpa harus memakai 'dan' secara kaku.
