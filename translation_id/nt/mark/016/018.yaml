  source_fidelity: Draf ini pada umumnya mencerminkan isi Yunani dengan baik, termasuk penegasan kuat οὐ μή melalui “sama sekali tidak.” Namun, “memegang ular” tidak sepenuhnya menyampaikan ἀροῦσιν, yang berarti ‘akan mengangkat/mengambil,’ bukan sekadar memegang. Frasa untuk penumpangan tangan juga perlu diperbaiki agar lebih idiomatis dalam bahasa Indonesia sambil tetap sesuai dengan ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν.
  naturalness: “Meletakkan tangan atas orang-orang sakit” terdengar tidak alami dalam bahasa Indonesia baku modern. “Menumpangkan tangan pada orang-orang sakit” adalah ungkapan yang lazim dan jelas. “Mengangkat ular” lebih dekat pada verba sumber dan tetap alami.
  terminology: Istilah “ular,” “sesuatu yang mematikan,” “sama sekali tidak akan mencelakakan,” dan “sembuh” sesuai dengan register modern serta tidak menambahkan penafsiran doktrinal. Catatan tekstual mengenai akhir panjang Markus patut dipertahankan.
