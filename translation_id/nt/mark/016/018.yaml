  text: ⸀ὄφεις ἀροῦσιν κἂν θανάσιμόν τι πίωσιν οὐ μὴ αὐτοὺς βλάψῃ, ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν καὶ καλῶς ἕξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/018.yaml
  text: They will pick up snakes[a], and if they drink anything deadly, it will certainly not harm them; they will lay hands on the sick[d][c][b], and they will recover.
translation:
  language: id
  text: Mereka akan mengangkat ular[a], dan sekalipun mereka minum sesuatu yang mematikan, itu sama sekali tidak akan mencelakakan mereka. Mereka akan menumpangkan tangan pada orang-orang sakit, dan orang-orang itu akan sembuh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah awal tidak memuat Markus 16:9–20; ayat ini termasuk dalam akhir panjang Injil Markus.
    reason: textual_variant
  - marker: b
    text: Secara harfiah, “mereka akan berada dalam keadaan baik” atau “mereka akan sehat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφεις
  choice: ular
  rationale: Kata Indonesia yang umum dan alami untuk ular; tidak diperlukan istilah yang lebih arkais.
- source_word: ἀροῦσιν
  choice: akan memegang
  rationale: αἴρω dapat berarti mengangkat atau mengambil. Dalam konteks ular, 'memegang' menyampaikan tindakan fisiknya secara alami tanpa menentukan apakah ular itu diangkat dari tanah.
- source_word: κἂν
  choice: dan sekalipun
  rationale: καὶ ἐάν memperkenalkan kondisi dengan nuansa konsesif; 'sekalipun' mempertahankan daya ungkap tersebut dengan wajar.
- source_word: θανάσιμόν τι
  choice: sesuatu yang mematikan
  rationale: Mempertahankan cakupan ungkapan Yunani yang luas dan tidak mempersempitnya khusus menjadi racun.
- source_word: οὐ μὴ ... βλάψῃ
  choice: sama sekali tidak akan mencelakakan
  rationale: οὐ μή merupakan penyangkalan yang sangat tegas; 'sama sekali tidak' mempertahankan penekanannya, sedangkan 'mencelakakan' sesuai dengan bahaya serius dalam konteks.
- source_word: ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν
  choice: Mereka akan meletakkan tangan atas orang-orang sakit
  rationale: Terjemahan idiomatis yang tetap dekat dengan susunan Yunani dan jelas bagi pembaca Indonesia.
- source_word: καλῶς ἕξουσιν
  choice: orang-orang itu akan sembuh
  rationale: Secara harfiah berarti 'akan berada dalam keadaan baik/sehat'; dalam konteks orang sakit, 'akan sembuh' mengungkapkan hasilnya secara alami. Subjek diulangi agar rujukannya jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat perlindungan dan kesembuhan yang dijanjikan
  choice: Ayat diterjemahkan secara langsung sebagai tindakan dan hasil yang akan terjadi, tanpa pembatas atau penjelasan doktrinal tambahan.
  alternative: Menafsirkannya sebagai tanda yang wajib berlaku universal, terbatas pada zaman rasul, atau semata-mata simbolis.
  rationale: Teks Yunani tidak menjelaskan cakupan zaman atau frekuensinya; terjemahan perlu mempertahankan ketegangan itu tanpa memasukkan pandangan denominasi.
- issue: Status tekstual Markus 16:9–20
  choice: Ayat diterjemahkan sesuai teks SBLGNT yang diberikan, dengan catatan kaki mengenai akhir panjang Markus.
  alternative: Menghilangkan atau memberi kurung pada ayat dalam teks utama.
  rationale: Sumber yang diberikan memuat ayat ini, tetapi perbedaan bukti manuskrip cukup penting sehingga perlu disampaikan secara transparan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Memegang ular' dipilih daripada bentuk yang lebih kaku seperti 'mengangkat ular'; 'orang-orang sakit' menghindari kemungkinan bahwa 'yang sakit' dibaca sebagai keadaan abstrak. Semua penanda catatan kaki muncul dalam teks utama.
