  text: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/002.yaml
  text: I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat.
translation:
  language: id
  text: “Aku berbelas kasihan kepada orang banyak ini, karena sudah tiga hari mereka tetap bersama-Ku dan mereka tidak mempunyai apa pun untuk dimakan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σπλαγχνίζομαι
  choice: Aku berbelas kasihan
  rationale: Kata kerja ini menyatakan belas kasihan yang mendalam. Ungkapan ini alami dan bermartabat dalam bahasa Indonesia serta mempertahankan bentuk kini.
- source_word: ἐπὶ τὸν ὄχλον
  choice: kepada orang banyak ini
  rationale: Dengan σπλαγχνίζομαι, frasa ini menandai sasaran belas kasihan. 'Kepada orang banyak ini' merupakan ungkapan Indonesia yang wajar; 'ini' memperjelas kelompok yang sedang dibicarakan sesuai konteks, tanpa mengubah rujukannya.
- source_word: ὅτι
  choice: karena
  rationale: ὅτι memperkenalkan alasan belas kasihan Yesus.
- source_word: ἤδη ἡμέραι τρεῖς
  choice: sudah tiga hari
  rationale: Ungkapan ini secara alami menyatakan bahwa lamanya waktu itu kini telah mencapai tiga hari.
- source_word: προσμένουσίν μοι
  choice: mereka tetap bersama-Ku
  rationale: προσμένω menyatakan terus tinggal atau bertahan bersama seseorang. 'Tetap bersama-Ku' mempertahankan unsur keberlanjutan dan hubungan yang dinyatakan oleh datif μοι.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: mereka tidak mempunyai makanan
  rationale: Konstruksi ini berarti mereka tidak memiliki sesuatu untuk dimakan. 'Tidak mempunyai makanan' menyampaikan maknanya secara langsung dan alami, tanpa meniru konstruksi Yunani secara kaku.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Bentuk sapaan ilahi 'Aku' dan enklitik '-Ku' mengikuti kebiasaan penulisan Alkitab bahasa Indonesia. Tidak diperlukan catatan kaki karena tidak ada varian atau ambiguitas penting yang perlu ditampilkan dalam ayat ini.
