source:
  edition: SBLGNT
  text: Καὶ ἤρξατο διδάσκειν αὐτοὺς ὅτι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ⸀ὑπὸ τῶν πρεσβυτέρων καὶ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ ἀποκτανθῆναι καὶ μετὰ τρεῖς ἡμέρας ἀναστῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/031.yaml
  text: And he began to teach them that the Son of Man must suffer many things[a], and be rejected by the elders and the chief priests and the scribes, and be killed, and after three days rise again.
translation:
  language: id
  text: Lalu Ia mulai mengajar mereka bahwa Anak Manusia harus banyak menderita, ditolak oleh para tua-tua, imam-imam kepala, dan ahli-ahli Taurat, dibunuh, dan sesudah tiga hari bangkit kembali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: “sesudah tiga hari.” Ungkapan ini kadang diterjemahkan “dalam tiga hari” atau diselaraskan dengan bagian-bagian sejajar yang berbunyi “pada hari ketiga”.'
    reason: Menjelaskan ungkapan waktu Yunani dan alternatif tradisional tanpa mengubah redaksi utama Markus.
lexical_decisions:
- source_word: Καὶ ἤρξατο διδάσκειν αὐτοὺς
  choice: Kemudian Ia mulai mengajar mereka
  rationale: Καί menandai kelanjutan narasi dan secara alami diterjemahkan “Kemudian”; konstruksi ἤρξατο dengan infinitif dipertahankan sebagai “mulai mengajar”.
- source_word: δεῖ
  choice: harus
  rationale: Kata ini menyatakan keharusan yang kuat tanpa menjelaskan lebih jauh sumber atau mekanisme keharusan tersebut.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Bentuk gelar yang mapan ini mempertahankan gema antarteks dan tidak memparafrasakan identitasnya.
- source_word: πολλὰ παθεῖν
  choice: banyak menderita
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan luasnya penderitaan yang dinyatakan oleh πολλά.
- source_word: ἀποδοκιμασθῆναι
  choice: ditolak
  rationale: Terjemahan ini menyampaikan penolakan resmi setelah penilaian tanpa menambahkan rincian yang tidak dinyatakan teks.
- source_word: ὑπὸ τῶν πρεσβυτέρων
  choice: oleh para tua-tua
  rationale: Istilah ini menunjuk pada kelompok pemimpin Yahudi yang diakui, bukan sekadar orang-orang lanjut usia.
- source_word: τῶν ἀρχιερέων
  choice: imam-imam kepala
  rationale: Bentuk jamak ini menunjuk pada kalangan imam terkemuka, bukan pada beberapa orang yang sekaligus memegang jabatan imam besar.
- source_word: τῶν γραμματέων
  choice: ahli-ahli Taurat
  rationale: Pilihan yang mapan dan mudah dipahami untuk para pakar hukum serta penafsir Kitab Suci Yahudi.
- source_word: ἀποκτανθῆναι
  choice: dibunuh
  rationale: Bentuk pasif diterjemahkan secara langsung dan tegas.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: sesudah tiga hari
  rationale: Μετά dengan akusatif secara langsung berarti “sesudah”; pilihan ini mempertahankan ungkapan khas Markus dan tidak menyelaraskannya dengan rumusan “pada hari ketiga” dalam teks-teks sejajar.
- source_word: ἀναστῆναι
  choice: bangkit kembali
  rationale: Infinitif aktif intransitif dipertahankan dengan “bangkit”; “kembali” membuat makna kebangkitan dari kematian alami dalam bahasa Indonesia tanpa mengubah diatesis menjadi pasif.
theological_decisions:
- issue: Keharusan dalam nubuat penderitaan melalui δεῖ
  choice: harus
  alternative: perlu
  rationale: “Harus” mempertahankan bobot keharusan ilahi yang tersirat, tetapi tidak memasukkan penjelasan doktrinal mengenai bagaimana atau mengapa hal itu menjadi keharusan.
- issue: Ungkapan waktu μετὰ τρεῖς ἡμέρας
  choice: sesudah tiga hari
  alternative: pada hari ketiga
  rationale: Teks Yunani Markus secara harfiah memakai ungkapan “sesudah tiga hari”. Menerjemahkannya “pada hari ketiga” akan menyelaraskan redaksi Markus dengan bagian sejajar dan menghilangkan ketegangan tekstual yang asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah historis “para tua-tua”, “imam-imam kepala”, dan “ahli-ahli Taurat” dipertahankan karena sudah dikenal luas. Rangkaian pasif Yunani dijaga dalam bentuk “ditolak” dan “dibunuh”, sedangkan ἀναστῆναι tetap aktif sebagai “bangkit kembali”.
