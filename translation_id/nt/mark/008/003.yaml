source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀπολύσω αὐτοὺς νήστεις εἰς οἶκον αὐτῶν, ἐκλυθήσονται ἐν τῇ ὁδῷ· ⸂καί τινες⸃ αὐτῶν ⸀ἀπὸ μακρόθεν ⸀ἥκασιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/003.yaml
  text: And if I send them away hungry to their homes[a], they will collapse on the way, and some of them have come from far away.
translation:
  language: id
  text: Jika Aku menyuruh mereka pulang dalam keadaan lapar, mereka akan kehabisan tenaga[a] di tengah jalan, dan beberapa orang di antara mereka telah datang dari jauh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: akan jatuh lemas. Kata Yunani ini dapat berarti menjadi lemah atau sangat letih sampai tidak sanggup melanjutkan perjalanan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσω
  choice: menyuruh mereka pulang
  rationale: Dalam konteks membubarkan orang banyak, kata ini berarti membiarkan atau menyuruh mereka pergi. Karena tujuan mereka adalah rumah masing-masing, “menyuruh mereka pulang” alami dan tepat dalam bahasa Indonesia.
- source_word: νήστεις
  choice: dalam keadaan lapar
  rationale: Kata ini secara harfiah dapat berarti berpuasa atau tanpa makan, tetapi konteks menunjukkan keadaan mereka yang belum mendapat makanan, bukan puasa keagamaan yang disengaja.
- source_word: εἰς οἶκον αὐτῶν
  choice: pulang
  rationale: Ungkapan Yunani menunjuk pada kepulangan setiap orang ke rumahnya. Bahasa Indonesia secara alami mengungkapkannya dengan verba “pulang” tanpa perlu mengulang “ke rumah mereka masing-masing”.
- source_word: ἐκλυθήσονται
  choice: akan kehabisan tenaga
  rationale: Verba ini menggambarkan menjadi lemah atau letih sampai tidak sanggup melanjutkan perjalanan. “Kehabisan tenaga” mempertahankan makna dasarnya tanpa memastikan bahwa mereka akan kehilangan kesadaran.
- source_word: ἐν τῇ ὁδῷ
  choice: di tengah jalan
  rationale: Ungkapan idiomatis ini menyatakan bahwa kelemahan itu akan terjadi selama perjalanan pulang.
- source_word: καί τινες αὐτῶν
  choice: dan beberapa orang di antara mereka
  rationale: Terjemahan ini mempertahankan koordinasi sederhana dengan καί serta menunjukkan bahwa yang datang dari jauh hanyalah sebagian dari orang banyak itu.
- source_word: ἀπὸ μακρόθεν
  choice: dari jauh
  rationale: Dalam konteks ini frasa tersebut menunjukkan jauhnya tempat asal atau perjalanan mereka.
- source_word: ἥκασιν
  choice: telah datang
  rationale: Bentuk perfektum menyoroti keadaan mereka sekarang sebagai orang-orang yang sudah datang dari tempat jauh; “telah datang” mempertahankan nuansa itu.
