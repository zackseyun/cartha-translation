  text: καὶ ἔλεγεν αὐτοῖς· ⸀Οὔπω συνίετε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/021.yaml
  text: And he was saying to them[a], “Do you not yet understand?”
translation:
  language: id
  text: Dan Ia berkata kepada mereka, “Apakah kalian masih belum mengerti?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Belum jugakah kalian mengerti?”
    reason: Alternatif idiomatis untuk Οὔπω yang mempertahankan makna bahwa pemahaman belum tercapai sampai saat itu.
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Dalam alur narasi, καὶ menghubungkan ucapan ini dengan konteks sebelumnya. “Lalu” menghasilkan hubungan yang alami dalam bahasa Indonesia tanpa menambahkan urutan waktu yang kuat.
- source_word: ἔλεγεν
  choice: Ia berkata
  rationale: Bentuk imperfek Yunani menyajikan tindakan berkata dari dalam prosesnya dan dapat menyiratkan kelanjutan atau pengulangan. Bahasa Indonesia tidak menandai aspek itu secara gramatikal; “Ia berkata” adalah bentuk naratif yang alami, sedangkan “Ia terus berkata” akan menegaskan kelanjutan secara berlebihan.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Kata ganti datif jamak diterjemahkan langsung tanpa menggantinya dengan rujukan tersirat seperti “murid-murid-Nya”.
- source_word: Οὔπω
  choice: masih belum
  rationale: Οὔπω berarti “belum” atau “masih belum.” Dalam pertanyaan ini, “masih belum” secara alami menyampaikan bahwa pengertian itu tetap belum tercapai sampai saat tersebut.
- source_word: συνίετε
  choice: mengerti
  rationale: Kata kerja ini menunjuk pada pemahaman atau penangkapan makna. “Mengerti” jelas, alami, dan mempertahankan bentuk orang kedua jamak melalui kata ganti “kalian”.
theological_decisions:
- issue: Apakah objek dari tindakan mengerti perlu dinyatakan secara eksplisit
  choice: 'Objek dibiarkan tersirat: “Apakah kalian masih belum mengerti?”'
  alternative: “Apakah kalian masih belum mengerti hal ini?”
  rationale: Teks Yunani tidak menyebutkan objek. Membiarkannya tersirat mempertahankan keluasan dan daya tegur pertanyaan Yesus tanpa mempersempitnya pada objek tertentu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Kalian” dipakai untuk menyatakan orang kedua jamak yang terdapat dalam συνίετε; kapitalisasi “Ia” mengikuti konvensi umum teks Alkitab bahasa Indonesia.
