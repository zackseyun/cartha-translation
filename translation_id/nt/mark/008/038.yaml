  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/038.yaml
  text: For whoever is ashamed of me and of my words in this adulterous and sinful generation[a], the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.
translation:
  language: id
  text: Sebab siapa pun yang malu terhadap Aku dan kata-kata-Ku di tengah angkatan yang berzina dan berdosa ini,[a] Anak Manusia juga akan malu terhadap dia ketika Ia datang dalam kemuliaan Bapa-Nya bersama para malaikat kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "angkatan yang tidak setia dan berdosa ini." Ungkapan "yang berzina" dipertahankan dalam teks karena bahasa Yunani memakai metafora konkret perzinaan, sebagaimana dalam gaya para nabi, untuk ketidaksetiaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: malu mengakui / akan malu mengakui
  rationale: Ungkapan ini menyampaikan rasa malu terhadap seseorang atau perkataannya dalam konteks pengakuan terbuka. Pengulangan yang sama mempertahankan daya timbal balik dalam bahasa Yunani; bentuk ini juga lebih alami daripada sekadar 'malu terhadap' dalam bahasa Indonesia.
- source_word: λόγους
  choice: perkataan-perkataan
  rationale: Bentuk jamak dipertahankan dan menunjuk pada perkataan Yesus, tanpa mereduksinya menjadi satu 'pesan' yang lebih interpretatif.
- source_word: γενεᾷ
  choice: angkatan
  rationale: '''Angkatan'' secara alami menunjuk pada kelompok manusia sezaman beserta ciri moralnya dan lebih tepat daripada ''zaman'', yang dapat terdengar sebagai periode abstrak.'
- source_word: μοιχαλίδι
  choice: yang berzina
  rationale: Mempertahankan metafora konkret profetis tentang perzinaan, yang dalam konteks dapat menyiratkan ketidaksetiaan rohani dan moral.
- source_word: ἁμαρτωλῷ
  choice: yang berdosa
  rationale: Padanan langsung yang mempertahankan bentuk adjektival dan tidak menambah intensitas seperti 'jahat'.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan gelar kristologis dan gema Danielisnya, tanpa menggantinya dengan 'Aku' atau 'Mesias'.
- source_word: δόξῃ
  choice: kemuliaan
  rationale: Padanan Alkitabiah yang lazim dan mempertahankan bobot kehormatan serta keagungan ilahi.
- source_word: μετὰ τῶν ἀγγέλων τῶν ἁγίων
  choice: bersama para malaikat kudus
  rationale: Mencerminkan konstruksi atributif Yunani secara alami tanpa menambahkan kata milik 'malaikat-malaikat-Nya', yang tidak terdapat dalam sumber.
- source_word: ὃς γὰρ ἐὰν
  choice: Sebab siapa pun yang
  rationale: Menyampaikan pernyataan bersyarat yang berlaku umum sekaligus mempertahankan hubungan penjelas γάρ.
- source_word: ἐν τῇ γενεᾷ ταύτῃ
  choice: di tengah angkatan ... ini
  rationale: Menunjukkan lingkungan sosial-moral tempat rasa malu itu dinyatakan; 'di tengah' terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Daya metaforis μοιχαλίδι
  choice: Mempertahankan 'yang berzina' dalam teks utama sebagai metafora profetis.
  alternative: Menerjemahkannya 'yang tidak setia'.
  rationale: Bahasa Yunani memakai istilah konkret perzinaan yang menggemakan bahasa para nabi mengenai ketidaksetiaan umat. Catatan kaki menjelaskan maknanya tanpa menghilangkan metafora.
- issue: Rujukan 'Anak Manusia'
  choice: Mempertahankan gelar 'Anak Manusia'.
  alternative: Menggantinya dengan 'Aku' atau 'Mesias'.
  rationale: Teks Yunani menggunakan gelar kristologis tersendiri yang memiliki bobot eskatologis; penggantian akan meratakan ketegangan dan gema antarteksnya.
- issue: Pronomina αὐτόν
  choice: Menerjemahkan dengan 'dia'.
  alternative: Membuatnya jamak atau mengulang 'orang itu'.
  rationale: '''Dia'' mempertahankan acuan tunggal generik secara alami dalam bahasa Indonesia tanpa menentukan gender yang tidak perlu dalam bahasa sasaran.'
- issue: Makna ἐπαισχύνομαι dalam konteks
  choice: Menggunakan 'malu mengakui' pada kedua kemunculan.
  alternative: Menggunakan 'malu terhadap' atau 'menyangkal'.
  rationale: '''Malu mengakui'' mengungkapkan implikasi relasional dan publik secara alami, tetapi tidak sekuat ''menyangkal''; pengulangan menjaga timbal balik peringatan tersebut.'
translation_notes:
  register: Bahasa Indonesia baku modern, khidmat namun mudah dipahami. Kapitalisasi pronomina yang merujuk kepada Yesus dan Bapa mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan kalimat mempertahankan hubungan sebab-akibat dan kesejajaran timbal balik teks Yunani.
