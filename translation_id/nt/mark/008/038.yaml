  to: Sebab siapa pun yang malu terhadap Aku dan kata-kata-Ku di tengah angkatan yang berzina dan berdosa ini,[a] Anak Manusia juga akan malu terhadap dia ketika Ia datang dalam kemuliaan Bapa-Nya bersama para malaikat kudus.
