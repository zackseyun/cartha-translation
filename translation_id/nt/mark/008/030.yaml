  text: And he warned them to tell no one about him[a].
translation:
  language: id
  text: Lalu Yesus memperingatkan mereka dengan tegas supaya tidak memberi tahu siapa pun tentang Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menegur mereka” atau “memerintahkan mereka dengan keras.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: memperingatkan ... dengan tegas
  rationale: Kata ini dapat berarti ‘menegur’ dan juga menyampaikan perintah atau peringatan keras. Dalam konteks larangan untuk mengungkapkan identitas Yesus, frasa ini menyampaikan daya perintahnya secara alami tanpa menyiratkan bahwa para murid sedang dimarahi.
- source_word: αὐτοῖς
  choice: mereka
  rationale: Pronomina datif jamak ini merujuk kepada para murid dalam konteks terdekat.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: supaya tidak memberi tahu siapa pun
  rationale: Sesudah verba yang menyatakan perintah atau peringatan, ἵνα dengan subjungtif menyatakan isi perintah. Susunan ini alami dalam bahasa Indonesia dan mempertahankan larangan menyeluruh μηδενί.
- source_word: περὶ αὐτοῦ
  choice: tentang diri-Nya
  rationale: περί dengan genitif berarti ‘tentang’ atau ‘mengenai’. Bentuk refleksif ‘diri-Nya’ secara alami merujuk kembali kepada Yesus sebagai subjek kalimat.
theological_decisions:
- issue: Kekuatan larangan Yesus dalam konteks kerahasiaan identitas-Nya
  choice: Menyatakan larangan itu sebagai peringatan tegas agar para murid tidak memberi tahu siapa pun tentang Yesus.
  alternative: ‘menegur mereka’ atau ‘memerintahkan mereka dengan keras’
  rationale: Teks jelas menunjukkan larangan yang kuat, tetapi tidak menjelaskan alasannya di ayat ini. Terjemahan mempertahankan kekuatan perintah tanpa memasukkan teori teologis mengenai motif kerahasiaan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. ‘Dengan tegas’ mempertahankan kekuatan ἐπετίμησεν, sedangkan ‘memberi tahu’ sesuai dengan konstruksi λέγωσιν yang memiliki penerima dan pokok pemberitaan.
