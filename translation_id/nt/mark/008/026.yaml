  text: καὶ ἀπέστειλεν αὐτὸν ⸀εἰς οἶκον αὐτοῦ λέγων· Μηδὲ εἰς τὴν κώμην ⸀εἰσέλθῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/026.yaml
  text: And he sent him to his home[a], saying, “Do not even enter the village.”
translation:
  language: id
  text: Lalu Yesus menyuruh orang itu pulang ke rumahnya[a] dengan berkata, “Jangan sekali pun masuk ke desa itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah menambahkan, “dan jangan memberi tahu siapa pun di desa itu.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: menyuruh ... pulang
  rationale: Dalam konteks ini, verba tersebut menyatakan bahwa Yesus menyuruh orang itu pergi dari tempat tersebut. Karena tujuannya adalah rumahnya sendiri, ungkapan idiomatis Indonesia 'menyuruh ... pulang' menyampaikan maksudnya secara alami tanpa memberi kesan bahwa ia diutus untuk suatu misi.
- source_word: εἰς οἶκον αὐτοῦ
  choice: ke rumahnya
  rationale: Frasa ini menunjukkan tujuan, yaitu rumah orang itu sendiri. 'Ke rumahnya' alami dalam bahasa Indonesia dan mempertahankan rujukan kepemilikan dari αὐτοῦ.
- source_word: λέγων
  choice: dengan berkata
  rationale: Partisipel ini memperkenalkan ucapan yang menyertai tindakan menyuruh pergi. 'Dengan berkata' mempertahankan kaitan sintaksis tersebut secara wajar.
- source_word: Μηδὲ
  choice: Jangan ... sekalipun
  rationale: Dalam konteks larangan ini, μηδέ memberi tekanan tambahan. Susunan 'jangan ... sekalipun' menyampaikan bahwa orang itu sama sekali tidak boleh memasuki desa tersebut.
- source_word: κώμην
  choice: desa itu
  rationale: κώμη lazim menunjuk permukiman kecil, sehingga 'desa' merupakan padanan langsung. Kata penunjuk 'itu' secara alami mewakili artikel tertentu τὴν dan merujuk desa yang sudah diketahui dari konteks.
- source_word: εἰσέλθῃς
  choice: masuk
  rationale: Bentuk aoris subjungtif setelah negasi berfungsi sebagai larangan. 'Masuk' ringkas, alami, dan mempertahankan arah tindakan ke dalam desa.
theological_decisions:
- issue: Cakupan larangan Yesus mengenai desa itu
  choice: Menerjemahkan perintah sebagai larangan langsung untuk memasuki desa itu saja.
  alternative: Sejumlah naskah memperluas perintah itu dengan larangan memberi tahu siapa pun di desa tersebut.
  rationale: Teks SBLGNT hanya memuat larangan untuk masuk ke desa itu. Tambahan dari tradisi naskah lain tidak dimasukkan ke teks utama, tetapi dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Menyuruh orang itu pulang' lebih idiomatis daripada 'mengutusnya ke rumahnya', sedangkan 'sekalipun' mempertahankan tekanan negasi tanpa membuat kalimat terasa kaku.
