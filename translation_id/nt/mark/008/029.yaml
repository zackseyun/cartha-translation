  terminology: “Mesias” tepat untuk ὁ χριστός sebagai gelar dan selaras dengan keputusan proyek untuk menerjemahkan gelar tersebut. Catatan kaki “Kristus” menyediakan padanan tradisional tanpa mengaburkan makna gelar dalam teks utama. Kapitalisasi “Ia,” “Aku,” dan “-Nya” konsisten dengan register Alkitab Indonesia yang dipilih.
