source:
  edition: SBLGNT
  text: καὶ αὐτὸς ⸂ἐπηρώτα αὐτούς⸃· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸀ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ· Σὺ εἶ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/029.yaml
  text: And he was asking them[a], “But who do you say that I am?” Peter answered him, “You are the Messiah.”
translation:
  language: id
  text: Lalu Ia bertanya kepada mereka, “Tetapi menurut kalian, siapakah Aku ini?” Petrus menjawab-Nya, “Engkaulah Mesias[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.”
    reason: Menampilkan padanan tradisional bagi gelar Yunani ὁ χριστός tanpa menghilangkan makna mesianiknya dari teks utama.
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Dalam alur narasi Markus, καί menghubungkan tindakan berikutnya; “Lalu” terdengar alami dalam bahasa Indonesia tanpa memperberat kalimat.
- source_word: ἐπηρώτα αὐτούς
  choice: bertanya kepada mereka
  rationale: Bentuk imperfek ἐπηρώτα menyajikan tindakan dalam proses, tetapi bahasa Indonesia tidak wajib menandai aspek itu secara gramatikal. Terjemahan ini alami dan tidak menambahkan kesan pengulangan yang belum tentu dimaksudkan.
- source_word: Ὑμεῖς δὲ
  choice: Tetapi menurut kalian
  rationale: δέ menandai pertentangan dengan pendapat orang-orang yang baru dibicarakan, sedangkan ὑμεῖς bersifat tegas. Susunan ini mempertahankan kontras tersebut dalam bahasa Indonesia yang wajar.
- source_word: τίνα με λέγετε εἶναι
  choice: siapakah Aku ini?
  rationale: Ungkapan “menurut kalian” sebelumnya membawa unsur λέγετε, sementara “siapakah Aku ini?” menyampaikan konstruksi akusatif-plus-infinitif secara idiomatis.
- source_word: ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ
  choice: Petrus menjawab-Nya
  rationale: Partisip ἀποκριθείς dan verba ujaran historis λέγει digabungkan secara alami menjadi satu verba naratif. Akhiran “-Nya” menyatakan bahwa jawaban itu ditujukan kepada Yesus.
- source_word: Σὺ εἶ
  choice: Engkaulah
  rationale: Bentuk ini mencerminkan pronomina eksplisit dan penegasan predikatif dalam pengakuan Petrus, sekaligus mempertahankan ragam bahasa yang khidmat.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: χριστός di sini berfungsi sebagai gelar bagi sosok yang diurapi, bukan sebagai nama diri. “Mesias” mempertahankan latar pengharapan Yahudi dan dikenal luas oleh pembaca Indonesia.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam pengakuan Petrus, ὁ χριστός adalah gelar tertentu, yaitu sosok yang diurapi. “Mesias” menyampaikan fungsi gelar itu dan latar Yahudinya; bentuk tradisional “Kristus” dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Kalian” dipakai karena sapaan Yunani berbentuk jamak dan ditujukan kepada para murid; “Engkau” mempertahankan nada khidmat dalam jawaban Petrus.
