  source_fidelity: Teks Indonesia secara tepat menyampaikan pertanyaan Yesus kepada para murid, kontras dalam Ὑμεῖς δέ melalui “Tetapi menurut kalian,” dan pengakuan Petrus bahwa Yesus adalah ὁ χριστός. “Bertanya” merupakan padanan yang wajar bagi imperfek ἐπηρώτα dalam narasi Indonesia, tanpa memaksakan nuansa iteratif yang tidak perlu dipastikan.
