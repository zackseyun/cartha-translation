source:
  edition: SBLGNT
  text: καὶ ἀναστενάξας τῷ πνεύματι αὐτοῦ λέγει· Τί ἡ γενεὰ αὕτη ⸂ζητεῖ σημεῖον⸃; ἀμὴν λέγω ⸀ὑμῖν, εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/012.yaml
  text: And sighing deeply in his spirit[a], he says, “Why does this generation seek a sign? Truly I say to you, no sign will be given to this generation.”
translation:
  language: id
  text: Ia menghela napas dalam-dalam dalam roh-Nya, lalu berkata, “Mengapa generasi ini mencari tanda? Sesungguhnya Aku berkata kepadamu, tidak satu tanda pun akan diberikan kepada generasi ini.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “jika suatu tanda akan diberikan kepada generasi ini”—ungkapan Yunani seperti sumpah yang berarti bahwa tidak satu tanda pun akan diberikan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστενάξας
  choice: menghela napas dalam-dalam
  rationale: Kata kerja ini menyatakan keluhan atau helaan napas yang kuat. Pilihan ini menyampaikan bobot emosional bentuk berawalan ἀνα- dengan bahasa Indonesia yang alami tanpa melebih-lebihkan.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: dalam roh-Nya
  rationale: Frasa datif ini menunjukkan lingkup batin tempat helaan napas itu terjadi. 'Dalam roh-Nya' mempertahankan istilah antropologis πνεῦμα dan tidak mereduksinya menjadi keadaan psikologis semata.
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini Yunani merupakan present historis yang menghidupkan narasi. Dalam narasi bahasa Indonesia, 'berkata' tetap alami tanpa perlu menandai waktu secara eksplisit.
- source_word: Τί
  choice: Mengapa
  rationale: Dalam konstruksi ini τί berfungsi menanyakan alasan, sehingga 'Mengapa' merupakan padanan idiomatis yang tepat.
- source_word: γενεὰ
  choice: generasi
  rationale: Pilihan ini mempertahankan dimensi kolektif dan temporal istilah Yunani, bukannya mempersempitnya menjadi sekadar 'orang-orang'.
- source_word: ζητεῖ
  choice: mencari
  rationale: '''Mencari'' adalah padanan langsung yang mempertahankan tindakan aktif dalam teks; ''menuntut'' akan memberi tekanan konfrontatif yang lebih kuat daripada kata Yunani itu sendiri.'
- source_word: σημεῖον
  choice: tanda
  rationale: '''Tanda'' mempertahankan nuansa sesuatu yang mengesahkan atau menunjuk kepada makna lebih lanjut tanpa menambahkan kata ''mukjizat'' ke dalam teks utama.'
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya Aku berkata kepadamu
  rationale: Rumusan ini menyampaikan kekhidmatan dan penegasan ἀμήν dengan ungkapan Indonesia yang jelas dan bermartabat.
- source_word: εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον
  choice: tidak satu tanda pun akan diberikan kepada generasi ini
  rationale: Klausa εἰ merupakan rumusan sumpah eliptis bercorak Semitis yang berfungsi sebagai penyangkalan tegas. Negasi eksplisit menyampaikan maksudnya secara jelas, sedangkan 'tidak satu ... pun' mempertahankan daya tekan ungkapan itu.
theological_decisions:
- issue: Pemaknaan klausa εἰ dalam rumusan seperti sumpah setelah ἀμὴν λέγω ὑμῖν
  choice: 'Diterjemahkan sebagai penyangkalan tegas: ''tidak satu tanda pun akan diberikan kepada generasi ini.'''
  alternative: 'Terjemahan sangat harfiah: ''jika suatu tanda akan diberikan kepada generasi ini.'''
  rationale: Konstruksi Yunani ini adalah ungkapan sumpah eliptis, bukan syarat terbuka. Terjemahan dengan negasi menyampaikan fungsi pragmatisnya tanpa mengaburkan arti, sementara bentuk harfiahnya dicatat dalam catatan kaki untuk mempertahankan bentuk sumber.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah 'generasi', 'tanda', dan 'roh-Nya' dipertahankan untuk menjaga bentuk serta nuansa sumber. Penanda catatan kaki ditempatkan sesudah klausa yang dijelaskannya, bukan sesudah 'roh-Nya'.
