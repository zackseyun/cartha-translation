  text: ⸂καὶ ἔφαγον⸃ καὶ ἐχορτάσθησαν, καὶ ἦραν περισσεύματα κλασμάτων ἑπτὰ σπυρίδας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/008.yaml
  text: And they ate and were satisfied[a], and they picked up seven baskets of leftover pieces.
translation:
  language: id
  text: Mereka makan sampai kenyang, lalu mengumpulkan tujuh keranjang berisi potongan-potongan yang tersisa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani σπυρίδας merujuk pada keranjang, mungkin keranjang besar. Markus memakai kata yang berbeda, κόφινοι, dalam kisah Yesus memberi makan lima ribu orang (6:43).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: makan
  rationale: Bentuk aoristus ἐσθίω menyatakan tindakan makan dalam narasi secara lugas; bahasa Indonesia tidak memerlukan penanda kala tersendiri.
- source_word: ἐχορτάσθησαν
  choice: sampai kenyang
  rationale: Ungkapan ini secara alami menyampaikan bahwa mereka mendapat makanan hingga berkecukupan atau kenyang, tanpa kekakuan bentuk pasif harfiah.
- source_word: ἦραν
  choice: mengumpulkan
  rationale: Dalam konteks pengambilan sisa makanan, 'mengumpulkan' menyampaikan tindakan αἴρω secara idiomatis dan jelas.
- source_word: περισσεύματα κλασμάτων
  choice: potongan-potongan yang tersisa
  rationale: Frasa ini mempertahankan hubungan antara sisa berlebih dan potongan-potongan makanan dengan bahasa Indonesia yang alami.
- source_word: ἑπτὰ σπυρίδας
  choice: tujuh bakul
  rationale: Σπυρίς adalah wadah anyaman, kemungkinan bakul besar, dan berbeda dari κόφινος dalam Markus 6:43. 'Bakul' mempertahankan citra wadah tersebut tanpa menambahkan ukuran yang tidak dinyatakan langsung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan 'makan sampai kenyang' menggabungkan dua verba Yunani secara alami tanpa menghilangkan makna kecukupan. Penanda catatan kaki ditempatkan sesudah 'bakul', istilah yang dijelaskannya.
