  text: ὅτε τοὺς πέντε ἄρτους ἔκλασα εἰς τοὺς πεντακισχιλίους, πόσους κοφίνους ⸂κλασμάτων πλήρεις⸃ ἤρατε; λέγουσιν αὐτῷ· Δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/019.yaml
  text: When I broke the five loaves for the five thousand[a], how many baskets full of broken pieces did you pick up?” They said to him[c][b], “Twelve.”
translation:
  language: id
  text: “Ketika Aku memecahkan lima roti bagi lima ribu orang[a], berapa keranjang penuh potongan-potongan roti yang kalian kumpulkan[b]?” Mereka berkata kepada-Nya, “Dua belas.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lima ribu”; bentuk Yunani dapat juga dipahami sebagai “lima ribu laki-laki.”
    reason: Menjaga kemungkinan cakupan bentuk maskulin Yunani tanpa membuat teks utama terlalu kaku atau terlalu spesifik.
  - marker: b
    text: Atau “kalian angkat.”
    reason: Αἴρω pada dasarnya dapat berarti mengangkat atau mengambil; dalam konteks ini tindakan tersebut mencakup pengumpulan sisa roti.
lexical_decisions:
- source_word: ὅτε
  choice: ketika
  rationale: Memperkenalkan klausa waktu yang mengacu kembali pada peristiwa pemberian makan; bentuk ini langsung dan alami dalam bahasa Indonesia.
- source_word: ἔκλασα
  choice: Aku memecah-mecahkan
  rationale: Kata κλάω menunjuk pada tindakan memecahkan roti. Bentuk ulang menyampaikan pembagian roti menjadi beberapa bagian secara alami.
- source_word: τοὺς πέντε ἄρτους
  choice: lima roti
  rationale: Ἄρτος di sini adalah roti yang dapat dihitung. Bahasa Indonesia lazim memakai ‘lima roti’ tanpa kata penggolong tambahan.
- source_word: εἰς τοὺς πεντακισχιλίους
  choice: bagi lima ribu orang
  rationale: Εἰς menyatakan arah atau peruntukan bagi kelompok yang diberi makan. ‘Orang’ diperlukan agar jumlah itu alami dalam bahasa Indonesia, tanpa menetapkan bahwa semuanya laki-laki.
- source_word: κοφίνους
  choice: bakul
  rationale: Κόφινος adalah wadah anyaman atau keranjang untuk membawa barang. ‘Bakul’ mempertahankan gambaran konkret dan sesuai dengan konteks pengumpulan sisa makanan.
- source_word: κλασμάτων πλήρεις
  choice: penuh potongan-potongan roti
  rationale: Κλάσματα adalah bagian-bagian yang tersisa dari roti yang dipecahkan. Penambahan ‘roti’ dibuat eksplisit dari konteks agar acuannya jelas dalam bahasa Indonesia.
- source_word: ἤρατε
  choice: kalian kumpulkan
  rationale: Dalam konteks sisa makanan, αἴρω menunjuk pada tindakan mengambil dan mengumpulkan potongan-potongan itu. ‘Kalian’ membedakan sapaan jamak kepada para murid.
- source_word: λέγουσιν αὐτῷ
  choice: Mereka berkata kepada-Nya
  rationale: Present historis Yunani dialihkan ke bentuk naratif Indonesia yang alami tanpa mengubah isi ujaran.
- source_word: Δώδεκα
  choice: Dua belas
  rationale: Jawaban angka langsung dipertahankan tanpa tambahan karena acuannya, yaitu bakul, sudah jelas.
theological_decisions:
- issue: Cakupan πεντακισχιλίους
  choice: lima ribu orang
  alternative: lima ribu laki-laki
  rationale: Bentuk Yunani maskulin dapat merujuk pada laki-laki, tetapi di ayat ini juga berfungsi sebagai sebutan ringkas bagi kelompok dalam peristiwa pemberian makan. Teks utama tidak mempersempit cakupannya secara tidak perlu; kemungkinan eksplisit ‘laki-laki’ dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan jamak ‘kalian’ dipakai karena Yesus berbicara kepada para murid. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
