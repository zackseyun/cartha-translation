  text: καὶ παρρησίᾳ τὸν λόγον ἐλάλει. καὶ προσλαβόμενος ⸂ὁ Πέτρος αὐτὸν⸃ ἤρξατο ἐπιτιμᾶν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/032.yaml
  text: And he was speaking the word openly[a]. And Peter took him aside and began to rebuke him.
translation:
  language: id
  text: Ia menyampaikan hal itu dengan terus terang.[a] Lalu Petrus menarik-Nya ke samping dan mulai menegur-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan jelas” atau “dengan berani.” Istilah Yunani ini menyatakan cara berbicara yang terbuka dan terus terang.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: dengan terus terang
  rationale: Ungkapan ini menyatakan keterbukaan dan kelugasan dalam berbicara. Pilihan ini alami dalam bahasa Indonesia dan menekankan bahwa Yesus tidak menyembunyikan atau menyamarkan maksud-Nya.
- source_word: τὸν λόγον
  choice: perkataan itu
  rationale: Frasa ini menunjuk kembali pada pemberitahuan Yesus sebelumnya. 'Perkataan itu' mempertahankan kaitan wacana dan lebih alami daripada terjemahan harfiah 'firman itu' dalam konteks ini.
- source_word: ἐλάλει
  choice: menyampaikan
  rationale: Imperfek Yunani menggambarkan tindakan yang sedang berlangsung. Dalam kalimat Indonesia, 'menyampaikan perkataan itu' mengungkapkan tindakan berbicara secara wajar tanpa memaksakan gagasan pengulangan.
- source_word: προσλαβόμενος
  choice: membawa-Nya ke samping
  rationale: Dalam konteks ini, Petrus membawa Yesus menyisih sebelum berbicara kepada-Nya. Ungkapan tersebut idiomatis dan mempertahankan implikasi tindakan privat.
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: mulai menegur
  rationale: Konstruksi ἄρχομαι dengan infinitif secara langsung menyatakan awal tindakan. 'Menegur' menyampaikan koreksi keras Petrus secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Daya makna παρρησίᾳ dalam pemberitahuan tentang penderitaan Yesus
  choice: dengan terus terang
  alternative: dengan jelas; dengan berani; secara terbuka
  rationale: Pilihan ini menekankan kelugasan dan keterbukaan ucapan Yesus tanpa membatasi maknanya hanya pada keberanian atau sifat publik. Hal itu mempertahankan kontras naratif dengan reaksi langsung Petrus.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas penerbitan Alkitab bahasa Indonesia. 'Membawa-Nya ke samping' dipilih agar tindakan Petrus jelas tanpa menambahkan penafsiran bahwa percakapan itu sepenuhnya rahasia.
