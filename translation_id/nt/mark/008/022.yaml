  text: Καὶ ⸀ἔρχονται εἰς Βηθσαϊδάν. καὶ φέρουσιν αὐτῷ τυφλὸν καὶ παρακαλοῦσιν αὐτὸν ἵνα αὐτοῦ ἅψηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/022.yaml
  text: And they came to Bethsaida. And they brought a blind man to him and begged him to touch him.
translation:
  language: id
  text: Lalu mereka tiba di Betsaida. Mereka membawa seorang laki-laki buta kepada Yesus dan memohon kepada Yesus supaya Ia menyentuh laki-laki itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: mereka tiba
  rationale: Bentuk kini historis dialihkan ke bentuk naratif Indonesia yang wajar. 'Tiba' menyatakan sampainya mereka di tempat tujuan tanpa menambahkan gagasan bahwa mereka masuk ke dalam kota.
- source_word: εἰς Βηθσαϊδάν
  choice: di Betsaida
  rationale: Sesudah verba 'tiba', bahasa Indonesia baku secara alami memakai 'di'. Nama tempat Βηθσαϊδά ditransliterasikan dengan bentuk Indonesia yang lazim, 'Betsaida'.
- source_word: φέρουσιν
  choice: membawa
  rationale: '''Membawa'' merupakan padanan luas dan alami yang tidak menentukan apakah orang tersebut dipapah, dituntun, atau digotong.'
- source_word: τυφλὸν
  choice: seorang buta
  rationale: Adjektiva substantival maskulin tunggal ini menunjuk kepada seorang laki-laki. 'Seorang buta' ringkas dan idiomatis dalam konteks naratif, tanpa menambahkan kata yang tidak diperlukan.
- source_word: παρακαλοῦσιν
  choice: memohon
  rationale: Dalam konteks ini verba tersebut menyatakan permintaan yang sungguh-sungguh. 'Memohon' mempertahankan kesungguhan itu dalam register yang alami dan bermartabat.
- source_word: ἵνα αὐτοῦ ἅψηται
  choice: agar ia menyentuh orang itu
  rationale: Konstruksi ἵνα dengan subjungtif menyatakan isi atau tujuan permohonan. 'Agar' mempertahankan struktur tersebut; 'menyentuh' menerjemahkan ἅπτομαι, sedangkan 'orang itu' memperjelas bahwa objeknya adalah orang buta.
- source_word: καὶ
  choice: Lalu / dan
  rationale: καί pertama berfungsi sebagai penghubung urutan narasi dan diterjemahkan 'Lalu'. καί berikutnya tercermin melalui kesinambungan kalimat tanpa dipaksakan menjadi pembuka 'Dan', sehingga hasilnya alami dalam bahasa Indonesia.
- source_word: αὐτῷ / αὐτόν
  choice: kepada Yesus / ia
  rationale: Dua pronomina dapat membingungkan bila semuanya diterjemahkan 'dia'. Nama 'Yesus' dipakai sebagai rujukan kontekstual yang jelas, lalu 'ia' menunjuk kembali kepada Yesus tanpa mengubah pelaku tindakan.
