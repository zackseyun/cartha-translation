source:
  edition: SBLGNT
  text: καὶ ⸀παραγγέλλει τῷ ὄχλῳ ἀναπεσεῖν ἐπὶ τῆς γῆς· καὶ λαβὼν τοὺς ἑπτὰ ἄρτους εὐχαριστήσας ἔκλασεν καὶ ἐδίδου τοῖς μαθηταῖς αὐτοῦ ἵνα ⸀παρατιθῶσιν καὶ παρέθηκαν τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/006.yaml
  text: And he instructed the crowd to recline on the ground[a]. Then, taking the seven loaves, after giving thanks he broke them and kept giving them to his disciples so that they might set them before the crowd[b], and they set them before the crowd.
translation:
  language: id
  text: Lalu ia menyuruh orang banyak itu duduk di tanah.[a] Setelah mengambil tujuh roti itu dan mengucap syukur, ia memecah-mecahkannya dan terus memberikannya kepada murid-muridnya supaya mereka menghidangkannya kepada orang banyak.[b] Lalu mereka menghidangkannya kepada orang banyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berbaring atau bersandar untuk makan.” Kata Yunani ini lebih khusus menggambarkan posisi makan demikian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menaruhnya di hadapan orang banyak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλει
  choice: menyuruh
  rationale: Kata ini menyatakan perintah atau arahan yang berwibawa. 'Menyuruh' alami dalam narasi Indonesia dan mempertahankan daya perintahnya. Bentuk kini historis dialihkan ke bentuk naratif Indonesia.
- source_word: ἀναπεσεῖν
  choice: duduk
  rationale: Dalam konteks jamuan, verba ini secara khusus dapat berarti mengambil posisi berbaring atau bersandar untuk makan. Karena 'berbaring untuk makan' tidak alami dalam budaya dan bahasa Indonesia modern, 'duduk' dipakai dalam teks, sementara nuansa harfiahnya dicatat.
- source_word: ἐπὶ τῆς γῆς
  choice: di tanah
  rationale: γῆ di sini menunjuk permukaan tanah tempat orang banyak mengambil posisi untuk makan; 'di tanah' merupakan ungkapan Indonesia yang alami.
- source_word: λαβὼν τοὺς ἑπτὰ ἄρτους
  choice: setelah mengambil ketujuh roti itu
  rationale: ἄρτοι menunjuk roti-roti utuh dalam konteks pemberian makan. Bahasa Indonesia lazim memakai nomina kolektif 'roti'; 'ketujuh ... itu' mempertahankan jumlah dan kekhususannya.
- source_word: εὐχαριστήσας
  choice: mengucap syukur
  rationale: Ungkapan ini mempertahankan tindakan mengucap syukur tanpa menambahkan objek eksplisit yang tidak disebutkan dalam bahasa Yunani.
- source_word: ἔκλασεν
  choice: memecah-mecahkannya
  rationale: Objeknya, yaitu roti, tersirat dari klausa sebelumnya. Bentuk reduplikasi menyampaikan pembagian roti menjadi potongan-potongan secara alami.
- source_word: ἐδίδου
  choice: terus memberikannya
  rationale: Imperfek Yunani menyiratkan tindakan yang berlangsung atau berulang. 'Terus memberikannya' mempertahankan aspek distributif tersebut.
- source_word: ἵνα παρατιθῶσιν
  choice: supaya mereka menghidangkannya kepada orang banyak
  rationale: παρατίθημι secara konkret berarti menaruh atau menyajikan di hadapan seseorang, terutama makanan. 'Menghidangkan' merupakan padanan Indonesia yang alami dan masih mempertahankan gambaran penyajian makanan.
- source_word: παρέθηκαν
  choice: mereka menghidangkannya kepada orang banyak
  rationale: Aoris menyatakan tindakan murid-murid dalam alur narasi. Pengulangan 'menghidangkan' menjaga kesinambungan leksikal dengan bentuk sebelumnya.
- source_word: ὄχλος
  choice: orang banyak
  rationale: '''Orang banyak'' adalah padanan baku dan alami bagi kerumunan dalam narasi Alkitab Indonesia, tanpa nada arkais yang berlebihan.'
theological_decisions:
- issue: Urutan narasi dan kemungkinan gema ekaristis
  choice: εὐχαριστήσας diterjemahkan secara langsung sebagai 'mengucap syukur' tanpa istilah sakramental.
  alternative: Memakai istilah yang secara eksplisit mengaitkan tindakan ini dengan Ekaristi atau Perjamuan Kudus.
  rationale: Bahasa ayat ini adalah bahasa jamuan yang dapat memiliki gema bagi praktik Kristen kemudian, tetapi ayat tersebut tidak secara eksplisit mengajarkan doktrin sakramental. Terjemahan mempertahankan ungkapannya tanpa perluasan doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Duduk di tanah' dipilih demi kewajaran, dengan nuansa posisi makan dunia kuno dipertahankan dalam catatan kaki. Pronomina untuk Yesus ditulis 'ia' sesuai gaya narasi umum dan tanpa menambahkan penafsiran kehormatan yang tidak ditandai dalam teks Yunani.
