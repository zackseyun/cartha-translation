  text: And they were discussing with one another that they had no bread[a].
translation:
  language: id
  text: Mereka sedang berdiskusi satu sama lain tentang tidak adanya roti[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “roti-roti.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διελογίζοντο
  choice: membicarakan
  rationale: Bentuk imperfek menunjukkan pembicaraan yang sedang berlangsung. 'Membicarakan' alami dalam bahasa Indonesia dan mempertahankan gagasan pertukaran pikiran tanpa memperkuatnya menjadi perdebatan.
- source_word: πρὸς ἀλλήλους
  choice: satu sama lain
  rationale: Ungkapan ini menyatakan interaksi timbal balik di antara para murid; 'satu sama lain' menerjemahkannya secara langsung dan wajar.
- source_word: ὅτι
  choice: bahwa
  rationale: Di sini ὅτι memperkenalkan isi pembicaraan, bukan alasan atau sebab.
- source_word: ἄρτους
  choice: roti
  rationale: '''Roti'' merupakan padanan Indonesia yang alami dan dapat dipakai tanpa penanda jamak; bentuk Yunani jamak juga dapat menunjuk roti-roti yang dapat dihitung dalam konteks dekat.'
- source_word: οὐκ ἔχουσιν
  choice: mereka tidak mempunyai
  rationale: Bentuk kini Yunani dipertahankan secara semantis sebagai isi pembicaraan langsung dalam bingkai narasi lampau; bahasa Indonesia tidak memerlukan perubahan bentuk verba menurut kala.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan 'membicarakan satu sama lain bahwa' dipilih untuk menjaga bahwa ὅτι memperkenalkan isi pembicaraan, meskipun 'berbicara di antara mereka' juga mungkin secara idiomatis.
