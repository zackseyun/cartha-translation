base_translation:
  language: en
  yaml_path: translation/nt/mark/008/001.yaml
  text: In those days[a], when again a large crowd was present and they had nothing to eat, he called his disciples and says to them[b],
translation:
  language: id
  text: 'Pada hari-hari itu, ketika sekali lagi ada orang banyak dan mereka tidak mempunyai apa pun untuk dimakan, Yesus memanggil murid-murid-Nya dan berkata[a] kepada mereka:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kata kerja Yunani berbentuk kini: “berkata kepada mereka.” Markus sering memakai bentuk kini historis dalam penuturan peristiwa lampau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείναις ταῖς ἡμέραις
  choice: Pada hari-hari itu
  rationale: Menerjemahkan ungkapan waktu Yunani secara langsung dan wajar dalam bahasa Indonesia tanpa menentukan lamanya waktu.
- source_word: πάλιν πολλοῦ ὄχλου ὄντος
  choice: ketika sekali lagi ada banyak orang berkumpul
  rationale: Genetif absolut dipahami sebagai latar keadaan; πάλιν menyatakan terulangnya situasi, sedangkan πολλοῦ ὄχλου menunjukkan kerumunan besar.
- source_word: καὶ μὴ ἐχόντων τί φάγωσιν
  choice: dan mereka tidak mempunyai apa pun untuk dimakan
  rationale: Subjek tersirat tetap merujuk kepada orang banyak; ungkapan ini menyampaikan ketiadaan makanan secara jelas dan alami.
- source_word: προσκαλεσάμενος τοὺς μαθητάς
  choice: Yesus memanggil murid-murid-Nya
  rationale: Nama Yesus dan akhiran posesif disediakan dari konteks agar rujukannya jelas dalam bahasa Indonesia; προσκαλεσάμενος berarti memanggil atau menyuruh datang mendekat.
- source_word: λέγει αὐτοῖς
  choice: lalu berkata kepada mereka
  rationale: Kala kini historis Markus dialihkan ke bentuk lampau naratif yang alami dalam bahasa Indonesia; 'lalu' menandai hubungan tindakan partisipial dengan verba utama.
theological_decisions:
- issue: Kala kini historis pada λέγει
  choice: Dialihkan menjadi bentuk naratif 'berkata'
  alternative: 'Mempertahankan bentuk kini secara harfiah: ''berkata kepada mereka'' dalam pembacaan kini historis, atau ''mengatakan kepada mereka'''
  rationale: Bahasa Indonesia tidak menandai kala secara morfologis seperti bahasa Yunani. Dalam konteks narasi lampau, 'lalu berkata' terdengar alami tanpa mengubah urutan atau isi tindakan; catatan kaki mempertahankan informasi mengenai bentuk Yunani.
- issue: Subjek Yesus tidak disebutkan secara eksplisit dalam ayat ini
  choice: Menyebut 'Yesus' demi kejelasan
  alternative: Memakai 'Ia'
  rationale: Subjek προσκαλεσάμενος dan λέγει diperoleh dari konteks sebelumnya. Penyebutan nama menjernihkan referen tanpa menambahkan klaim teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dibaca. Susunan genetif absolut dijadikan anak kalimat keadaan. Diksi 'banyak orang berkumpul' lebih alami daripada 'kerumunan besar hadir', sedangkan bentuk kini historis dijelaskan dalam catatan kaki.
