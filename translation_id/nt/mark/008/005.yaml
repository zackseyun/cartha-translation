  text: And he asked them, “How many loaves do you have?” They said, “Seven.”
translation:
  language: id
  text: Lalu Ia bertanya kepada mereka, “Berapa banyak roti yang kalian punya?” Mereka menjawab, “Tujuh.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Penghubung naratif ini meneruskan alur secara alami dalam bahasa Indonesia; “lalu” sesuai dengan urutan tindakan dalam konteks tanpa memberi penekanan berlebihan.
- source_word: ἠρώτα
  choice: Ia bertanya
  rationale: Bentuk imperfek dapat menggambarkan tindakan yang sedang berlangsung, tetapi dalam narasi bahasa Indonesia, “bertanya” menyampaikan tindakan ini secara alami tanpa harus memakai bentuk progresif.
- source_word: αὐτούς
  choice: kepada mereka
  rationale: Pronomina ini merujuk kepada para murid sebagai pihak yang ditanyai; verba “bertanya” secara idiomatis diikuti “kepada” dalam bahasa Indonesia.
- source_word: Πόσους
  choice: Berapa banyak
  rationale: Padanan interogatif kuantitatif yang wajar dan mempertahankan pertanyaan tentang jumlah.
- source_word: ἔχετε
  choice: yang kalian punya
  rationale: Menyatakan orang kedua jamak secara jelas dan alami. “Kalian” cocok untuk sapaan Yesus kepada sekelompok murid dalam register modern.
- source_word: ἄρτους
  choice: roti
  rationale: Dalam bahasa Indonesia, “roti” lazim dipakai sebagai nomina yang dapat dihitung melalui konteks angka; pilihan ini lebih alami daripada “potong roti” atau “roti-roti,” yang akan menambahkan atau terasa kurang wajar.
- source_word: οἱ δὲ εἶπαν
  choice: Mereka menjawab
  rationale: Walaupun verba Yunani secara harfiah berarti “berkata,” dalam konteks respons langsung terhadap pertanyaan, “menjawab” adalah ungkapan Indonesia yang paling alami; δέ tercermin dalam peralihan ke respons tanpa konjungsi tersendiri.
- source_word: Ἑπτά
  choice: Tujuh
  rationale: Angka kardinal diterjemahkan langsung sebagai jawaban singkat para murid.
