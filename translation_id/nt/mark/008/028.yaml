  text: οἱ δὲ ⸂εἶπαν αὐτῷ λέγοντες⸃ ⸀ὅτι Ἰωάννην τὸν βαπτιστήν, καὶ ἄλλοι Ἠλίαν, ἄλλοι δὲ ⸂ὅτι εἷς⸃ τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/028.yaml
  text: They told him[a], saying, “John the Baptist; and others, Elijah; but others, one of the prophets.”
translation:
  language: id
  text: Mereka berkata kepada-Nya, “Yohanes Pembaptis; yang lain, Elia; dan yang lain lagi, salah seorang nabi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mereka
  rationale: Artikel dengan δέ melanjutkan subjek dari konteks sebelumnya, yaitu para murid. Dalam bahasa Indonesia, “Mereka” sudah alami; daya sambung ringan δέ tidak perlu dinyatakan.
- source_word: εἶπαν αὐτῷ λέγοντες
  choice: menjawab Dia
  rationale: Konstruksi verba finit dan partisip dari λέγω memperkenalkan jawaban langsung. Menggandakan verba sebagai “berkata kepada-Nya, katanya” terasa kaku dalam bahasa Indonesia; “menjawab Dia” menyampaikan fungsi tuturan dalam konteks pertanyaan sebelumnya.
- source_word: ὅτι
  choice: ditampilkan melalui tanda petik langsung
  rationale: ὅτι memperkenalkan isi laporan. Kutipan langsung paling wajar dalam bahasa Indonesia dan tidak memerlukan padanan tersendiri.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Yohanes Pembaptis
  rationale: Ini adalah bentuk baku dan luas dikenal dalam Alkitab bahasa Indonesia, sekaligus tetap mencerminkan fungsi Yohanes sebagai pembaptis.
- source_word: ἄλλοι ... ἄλλοι δὲ
  choice: yang lain ... sedangkan yang lain
  rationale: Ungkapan ini mempertahankan pembagian beberapa kelompok dan kontras ringan yang ditandai δέ pada kelompok terakhir.
- source_word: Ἠλίαν
  choice: Elia
  rationale: “Elia” adalah bentuk nama yang baku dalam bahasa Indonesia.
- source_word: ὅτι εἷς τῶν προφητῶν
  choice: salah seorang nabi
  rationale: Padanan ini mempertahankan elipsis Yunani tanpa menambahkan “Engkau adalah”; frasa tetap jelas sebagai salah satu identifikasi yang dilaporkan.
- source_word: προφητῶν
  choice: nabi
  rationale: Dalam konstruksi “salah seorang,” bentuk tunggal kolektif “nabi” merupakan ungkapan Indonesia yang alami untuk εἷς τῶν προφητῶν.
theological_decisions:
- issue: Penyajian berbagai pendapat orang tentang identitas Yesus
  choice: Daftar identifikasi disampaikan secara ringkas tanpa mengulang “Engkau adalah” dalam setiap bagian.
  alternative: Mereka menjawab Dia, “Ada yang mengatakan bahwa Engkau adalah Yohanes Pembaptis, yang lain Elia, dan yang lain lagi salah seorang nabi.”
  rationale: Teks Yunani bersifat eliptis dan menonjolkan ragam pendapat umum tentang Yesus. Bentuk ringkas menjaga ketegangan dan kepadatan sumber tanpa memperluas predikat yang hanya tersirat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Huruf kapital pada “Dia” mengikuti kebiasaan penghormatan yang lazim dalam penerjemahan Alkitab Indonesia. Struktur daftar yang padat dipertahankan, tetapi verba “berkata” ditambahkan pada bagian tengah agar hubungan sintaksis mudah dipahami pembaca umum.
