translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Susunan pertanyaan dibuat alami dalam bahasa Indonesia, tetapi tetap mempertahankan penekanan Πόθεν pada sumber persediaan.
