  text: καὶ ἀπεκρίθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ὅτι Πόθεν τούτους δυνήσεταί τις ὧδε χορτάσαι ἄρτων ἐπ’ ἐρημίας;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/004.yaml
  text: And his disciples answered him[a], “From where will anyone be able to satisfy these people with bread here in a desolate place?”
translation:
  language: id
  text: Murid-murid-Nya menjawab, “Dari mana seseorang akan dapat memperoleh roti untuk mengenyangkan orang-orang ini di tempat terpencil ini?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bagaimana mungkin seseorang dapat memberi makan orang-orang ini dengan roti di tempat terpencil ini?”
    reason: Alternatif idiomatis ini mengungkapkan pertanyaan tentang kemungkinan atau cara, bukan secara harfiah pertanyaan tentang sumber; "memberi makan" merupakan alternatif bagi χορτάσαι.
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: menjawab
  rationale: Kata kerja naratif ini secara langsung dan wajar menyatakan tanggapan para murid.
- source_word: ὅτι
  choice: tanda petik pembuka
  rationale: Partikel ini memperkenalkan ucapan langsung dan secara alami dinyatakan dengan tanda baca dalam bahasa Indonesia.
- source_word: Πόθεν
  choice: Dari mana
  rationale: Mempertahankan pertanyaan tentang sumber atau asal roti, tanpa mengubahnya menjadi pertanyaan yang lebih umum tentang cara.
- source_word: τούτους
  choice: orang-orang ini
  rationale: Kata ganti jamak ini menunjuk kepada orang banyak; penyebutan eksplisit membuat acuannya jelas tanpa membatasinya hanya kepada laki-laki.
- source_word: δυνήσεταί τις
  choice: orang akan mendapatkan
  rationale: Bentuk futur dan unsur kemampuan disampaikan secara alami dalam keseluruhan pertanyaan. Susunan ini mengungkapkan maksud bahwa tidak jelas dari mana seseorang dapat memperoleh persediaan roti.
- source_word: ὧδε
  choice: seperti ini
  rationale: Dalam gabungan 'di tempat terpencil seperti ini', unsur lokatif ὧδε dinyatakan secara idiomatis sambil menekankan keadaan tempat mereka berada.
- source_word: χορτάσαι
  choice: untuk mengenyangkan
  rationale: Mengungkapkan pemberian makanan sampai cukup atau kenyang, bukan sekadar tindakan memberi makan.
- source_word: ἄρτων
  choice: roti
  rationale: Padanan langsung yang mempertahankan jenis makanan yang disebutkan tanpa memperluasnya menjadi makanan secara umum.
- source_word: ἐπ’ ἐρημίας
  choice: di tempat terpencil
  rationale: Menggambarkan daerah yang sepi atau jauh dari permukiman dalam bahasa Indonesia modern dan alami.
