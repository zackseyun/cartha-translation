  text: εἶτα πάλιν ⸀ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ, καὶ ⸂διέβλεψεν καὶ ἀπεκατέστη καὶ ἐνέβλεπεν⸃ τηλαυγῶς ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/025.yaml
  text: Then again he laid his hands on his eyes[a], and he saw clearly and was restored[b], and he was seeing everything distinctly.
translation:
  language: id
  text: Kemudian Yesus kembali meletakkan tangan-Nya pada mata orang itu, lalu orang itu dapat melihat dengan jelas dan penglihatannya pulih. Ia pun terus melihat segala sesuatu dengan terang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah memiliki susunan kata yang berbeda, yang dapat diterjemahkan, “lalu ia memandang dengan saksama, penglihatannya pulih, dan ia melihat segala sesuatu dengan jelas.”
    reason: textual_variant
lexical_decisions:
- source_word: εἶτα πάλιν
  choice: Kemudian ... kembali
  rationale: εἶτα menyatakan urutan waktu, sedangkan πάλιν menunjukkan pengulangan tindakan Yesus.
- source_word: ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: Yesus ... meletakkan tangan-Nya pada mata orang itu
  rationale: Ungkapan ini mempertahankan tindakan fisik konkret; bentuk jamak Yunani dapat dinyatakan secara wajar dalam bahasa Indonesia dengan kata kolektif 'tangan-Nya'.
- source_word: διέβλεψεν
  choice: orang itu dapat melihat dengan jelas
  rationale: διαβλέπω di sini menyatakan tercapainya penglihatan yang jelas, sesuai perkembangan dari penglihatan yang sebelumnya belum sempurna.
- source_word: ἀπεκατέστη
  choice: penglihatannya pulih
  rationale: Kata ini berarti dikembalikan kepada keadaan semula atau semestinya; penyebutan 'penglihatannya' membuat rujukannya alami dan jelas dalam bahasa Indonesia tanpa menambahkan gagasan kesembuhan yang tidak dinyatakan secara khusus.
- source_word: ἐνέβλεπεν
  choice: Ia pun terus melihat
  rationale: Bentuk imperfek dipertahankan dengan 'terus' untuk menyatakan keadaan penglihatan yang berlangsung setelah pemulihan.
- source_word: τηλαυγῶς
  choice: dengan terang
  rationale: Adverbia ini menyatakan penglihatan yang terang atau jelas, mungkin juga mencakup kemampuan melihat dari jauh; 'dengan terang' menghindari pengulangan langsung atas 'dengan jelas'.
- source_word: ἅπαντα
  choice: segala sesuatu
  rationale: Bentuk netral jamak ini secara idiomatis berarti keseluruhan dari apa yang terlihat.
theological_decisions:
- issue: Penggambaran penyembuhan dalam dua tahap
  choice: 'Mempertahankan urutan: melihat dengan jelas, dipulihkan, lalu terus melihat segala sesuatu dengan terang.'
  alternative: Meratakan semua verba menjadi satu pernyataan bahwa orang itu langsung sembuh dan dapat melihat.
  rationale: Urutan verba Yunani, terutama bentuk imperfek ἐνέβλεπεν, menampilkan perkembangan dan keadaan hasil yang berlangsung. Terjemahan tidak menghapus ketegangan naratif dari penyembuhan bertahap ini.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Subjek 'Yesus' dan 'orang itu' dinyatakan untuk mencegah ketaksaan pronomina. Aspek imperfek dipertahankan secara wajar dengan 'terus melihat'; varian tekstual utama dicatat tanpa memasukkannya ke dalam teks utama.
