id: MRK.8.14
reference: Mark 8:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐπελάθοντο λαβεῖν ἄρτους, καὶ εἰ μὴ ἕνα ἄρτον οὐκ εἶχον μεθ’ ἑαυτῶν ἐν τῷ πλοίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/014.yaml
  text: And they had forgotten to take bread[a], and except for one loaf they had no bread with them in the boat.
translation:
  language: id
  text: Mereka lupa membawa roti[a]; di dalam perahu itu mereka hanya mempunyai satu roti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “membawa roti-roti.” Bentuk jamak ἄρτους dapat menunjuk pada beberapa roti, tetapi di sini kemungkinan besar berarti roti atau bekal secara umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελάθοντο
  choice: lupa
  rationale: Bentuk aoristus menyatakan bahwa para murid telah lupa. Dalam narasi bahasa Indonesia, bentuk sederhana “lupa” secara alami menyampaikan tindakan lampau tanpa perlu menambahkan “telah”.
- source_word: λαβεῖν
  choice: membawa
  rationale: Dalam konteks perjalanan dengan perahu, “membawa” lebih alami daripada “mengambil” dan menyampaikan maksud membawa bekal bersama mereka.
- source_word: ἄρτους
  choice: roti
  rationale: Bentuk jamak Yunani dapat menunjuk pada beberapa roti, tetapi dalam konteks ini juga dapat berfungsi sebagai sebutan umum untuk persediaan roti. Bahasa Indonesia lazim memakai “roti” tanpa penanda jamak.
- source_word: εἰ μὴ ἕνα ἄρτον
  choice: hanya mempunyai satu roti
  rationale: 'εἰ μή bersifat pengecualian: tidak ada roti selain satu. Susunan “hanya mempunyai satu roti” menyampaikan makna itu secara alami dalam bahasa Indonesia.'
- source_word: οὐκ εἶχον
  choice: hanya mempunyai
  rationale: Bersama frasa pengecualian, bentuk negatif ini menyatakan bahwa persediaan mereka terbatas pada satu roti saja. Bentuk positif dengan “hanya” menghindari pengulangan yang kaku tanpa mengubah maknanya.
- source_word: μεθ’ ἑαυτῶν
  choice: mereka mempunyai
  rationale: Makna ‘ada bersama mereka’ dinyatakan secara idiomatis melalui verba “mempunyai”; terjemahan harfiah “bersama diri mereka” tidak alami dalam bahasa Indonesia.
- source_word: ἐν τῷ πλοίῳ
  choice: di dalam perahu itu
  rationale: “Di dalam” mewakili ἐν secara jelas, sedangkan “itu” sesuai untuk perahu yang telah hadir dalam konteks narasi.
