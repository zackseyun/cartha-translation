  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ⸂ψυχὴν αὐτοῦ⸃ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ⸀ἀπολέσει τὴν ⸄ψυχὴν αὐτοῦ⸅ ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου ⸀σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/035.yaml
  text: For whoever wants to save his life will lose it[b][a], but whoever loses his life for my sake and for the gospel will save it.
translation:
  language: id
  text: Sebab siapa pun yang ingin menyelamatkan nyawanya akan kehilangan nyawanya; tetapi siapa pun yang kehilangan nyawanya demi Aku dan Injil akan menyelamatkannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jiwanya” di seluruh ayat ini; kata Yunani yang sama dapat berarti nyawa, hidup, diri, atau jiwa, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχή
  choice: nyawa
  rationale: Dalam konteks menyangkal diri dan kehilangan hidup demi Yesus, ψυχή terutama menunjuk pada nyawa atau kehidupan seseorang. “Nyawa” mempertahankan paradoks menyelamatkan dan kehilangan hidup tanpa mempersempit maknanya menjadi unsur manusia yang tak berjasad.
- source_word: σῶσαι / σώσει
  choice: menyelamatkan / akan menyelamatkan
  rationale: Pilihan ini mempertahankan korespondensi verbal dan bobot paradoks dengan ἀπολέσει.
- source_word: ἀπολέσει
  choice: akan kehilangan
  rationale: Ketika objeknya ψυχή, “kehilangan” merupakan padanan idiomatis yang tepat dan tidak sekuat “membinasakan”.
- source_word: ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου
  choice: karena Aku dan karena Injil
  rationale: ἕνεκεν menyatakan sebab atau alasan. Pengulangan “karena” membuat hubungan frasa itu dengan kedua unsur jelas dan alami dalam bahasa Indonesia.
- source_word: εὐαγγέλιον
  choice: Injil
  rationale: “Injil” adalah istilah baku, ringkas, dan mempertahankan motif penting εὐαγγέλιον dalam Markus.
- source_word: ὃς ... ὃς
  choice: siapa pun ... siapa pun
  rationale: Ungkapan ini menyampaikan sifat umum dan terbuka dari konstruksi Yunani.
- source_word: θέλῃ
  choice: ingin
  rationale: “Ingin” adalah padanan modern dan alami untuk menyatakan kehendak.
- source_word: αὐτοῦ / αὐτήν
  choice: -nya / -nya
  rationale: Pronomina Indonesia tidak menandai gender, tetap tunggal, dan merujuk secara jelas kepada nyawa orang tersebut.
theological_decisions:
- issue: Cakupan antropologis ψυχή dalam perkataan paradoks ini
  choice: Menerjemahkan ψυχή sebagai “nyawa” dalam teks utama
  alternative: “jiwa” atau “hidup”
  rationale: Konteks langsung berkenaan dengan kehilangan kehidupan demi Yesus dan Injil. “Nyawa” menyampaikan hal itu secara konkret, sedangkan “jiwa” dapat secara tidak sengaja membatasi makna pada bagian manusia yang tidak berjasad. Kemungkinan “jiwa” tetap dicatat dalam catatan kaki.
- issue: Makna ἕνεκεν
  choice: 'Menerjemahkannya sebagai sebab: “karena Aku dan karena Injil”'
  alternative: “demi Aku dan demi Injil”
  rationale: Keduanya mungkin secara leksikal. “Karena” secara langsung menyatakan bahwa kehilangan nyawa itu terjadi oleh sebab kesetiaan kepada Yesus dan Injil, tanpa menambahkan penafsiran lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas dan bernada luhur. “Siapa pun” menjaga daya berlaku umum; “nyawa” membuat paradoks konkret dan mudah dipahami. Huruf kapital pada “Aku” mengikuti kebiasaan penerbitan Alkitab Indonesia ketika pembicara adalah Yesus.
