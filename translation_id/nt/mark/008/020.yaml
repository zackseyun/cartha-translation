id: MRK.8.20
reference: Mark 8:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτε ⸀καὶ τοὺς ἑπτὰ εἰς τοὺς τετρακισχιλίους, πόσων σπυρίδων πληρώματα κλασμάτων ἤρατε; ⸂καὶ λέγουσιν αὐτῷ⸃· Ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/020.yaml
  text: And when the seven were for the four thousand[a], how many large baskets full of broken pieces did you pick up? They said to him, “Seven.”
translation:
  language: id
  text: Dan ketika tujuh roti itu dibagikan kepada empat ribu orang, berapa bakul besar yang penuh dengan potongan-potongan roti yang kalian kumpulkan?” Mereka menjawab-Nya, “Tujuh.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε καὶ
  choice: Dan ketika
  rationale: Menghubungkan pertanyaan ini dengan mukjizat pemberian makan sebelumnya sekaligus mempertahankan makna temporal secara alami dalam bahasa Indonesia.
- source_word: τοὺς ἑπτὰ
  choice: tujuh roti itu
  rationale: Angka dengan artikel menunjuk kembali kepada tujuh roti dalam konteks Markus 8:5–6. Penyebutan 'roti' membuat elipsis Yunani jelas dan alami dalam bahasa Indonesia.
- source_word: εἰς τοὺς τετρακισχιλίους
  choice: dibagikan kepada empat ribu orang
  rationale: Dalam konteks pemberian makan, frasa ini menyatakan bahwa ketujuh roti tersebut diperuntukkan bagi kelompok empat ribu orang; bentuk pasif melengkapi elipsis kalimat secara wajar.
- source_word: πόσων σπυρίδων
  choice: berapa bakul besar
  rationale: σπυρίς menunjuk pada bakul berukuran besar dan berbeda dari κόφινος yang dipakai dalam Markus 8:19; 'bakul besar' mempertahankan perbedaan leksikal itu.
- source_word: πληρώματα κλασμάτων
  choice: yang penuh dengan potongan-potongan roti
  rationale: Menyampaikan gambaran bakul-bakul yang terisi penuh oleh pecahan atau sisa roti secara konkret dan mudah dipahami.
- source_word: ἤρατε
  choice: yang kalian kumpulkan
  rationale: Dalam konteks ini αἴρω berarti mengangkat atau mengumpulkan sisa makanan; 'kumpulkan' paling alami dan tepat.
- source_word: καὶ λέγουσιν αὐτῷ
  choice: Mereka menjawab-Nya
  rationale: λέγουσιν adalah bentuk kini naratif; bentuk lampau kontekstual dalam bahasa Indonesia terasa alami. 'Menjawab' menyatakan fungsi ujaran itu dengan tepat.
- source_word: Ἑπτά
  choice: Tujuh
  rationale: Jawaban angka langsung dipertahankan secara lugas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata 'kalian' dipakai untuk orang kedua jamak agar pertanyaan kepada para murid tidak disalahpahami sebagai tunggal. Perbedaan antara σπυρίς dan jenis bakul dalam ayat sebelumnya dinyatakan langsung dengan 'bakul besar', sehingga tidak diperlukan catatan kaki.
