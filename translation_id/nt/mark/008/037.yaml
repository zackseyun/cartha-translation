  yaml_path: translation/nt/mark/008/037.yaml
  text: For what can a man give in exchange for his life?[a]
translation:
  language: id
  text: Sebab, apa yang dapat seseorang berikan sebagai ganti nyawanya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jiwanya”; kata Yunani yang digunakan dapat berarti “nyawa,” “hidup,” “diri,” atau “jiwa,” bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Sebab, apa
  rationale: τί menyatakan pertanyaan “apa,” sedangkan γάρ menghubungkan pertanyaan ini sebagai penjelasan bagi pernyataan sebelumnya. “Sebab, apa” mempertahankan hubungan tersebut secara wajar dalam bahasa Indonesia.
- source_word: δοῖ
  choice: dapat diberikan
  rationale: Bentuk aoristus subjungtif δίδωμι muncul dalam pertanyaan retoris mengenai kemungkinan. Bentuk pasif alami dalam bahasa Indonesia, “apa yang dapat diberikan seseorang,” menyampaikan maksudnya tanpa mengubah pelakunya.
- source_word: ἄνθρωπος
  choice: seseorang
  rationale: ἄνθρωπος di sini bersifat umum dan menunjuk kepada manusia mana pun. “Seseorang” alami, inklusif, dan tepat bagi fungsi generiknya.
- source_word: ἀντάλλαγμα
  choice: sebagai ganti
  rationale: Kata ini menunjuk pada sesuatu yang diberikan sebagai pertukaran atau tebusan pengganti. “Sebagai ganti” menyampaikan gagasan pertukaran dengan jelas dan idiomatis.
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: nyawanya
  rationale: Dalam konteks Markus 8:35–37, ψυχή mencakup hidup atau diri seseorang yang dapat hilang dan tidak dapat diperoleh kembali. “Nyawa” paling alami dalam pertanyaan ini, sementara kemungkinan “jiwa” dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna ψυχή dalam perkataan tentang keselamatan dan kehilangan diri
  choice: nyawa
  alternative: jiwa; hidup; dirinya sendiri
  rationale: Konteks langsung mengaitkan ψυχή dengan kehilangan dan menyelamatkan hidup, tetapi cakupannya dapat melampaui kehidupan biologis kepada seluruh diri. Teks utama memakai “nyawa” demi kejelasan kontekstual, sedangkan catatan kaki mempertahankan keluasan makna dan ketegangan teologis kata Yunani itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Susunan pertanyaan dibuat alami bagi pembaca umum, dan “seseorang” dipakai untuk fungsi generik ἄνθρωπος.
