review_pass:
  verdict: revise
  source_fidelity: Draf pada umumnya setia pada teks Yunani. Namun, «Karena mengetahui hal itu» memberi hubungan sebab-akibat yang tidak dinyatakan oleh καὶ γνούς; partisip tersebut lebih baik diungkapkan secara temporal/naratif. Pertanyaan kedua juga perlu memakai penanda tanya eksplisit untuk mencerminkan bentuk interogatif οὔπω ... οὐδέ.
  naturalness: «Belum juga kalian menangkap atau memahami?» kurang alami dalam bahasa Indonesia baku karena tidak memiliki penanda pertanyaan. «Mengapa kalian membicarakan bahwa ...» dapat dipahami, tetapi «membicarakan soal ...» lebih idiomatis tanpa mengubah isi pembicaraan.
  terminology: «Roti», «menangkap atau memahami», dan metafora «hati ... menjadi keras» layak. Bentuk jamak «hati kalian» alami untuk sapaan kepada beberapa murid dan tidak mengganggu idiom singular Yunani.
  issues:
  - severity: medium
    issue: «Karena mengetahui hal itu» menyatakan kausalitas.
    rationale: καὶ γνούς adalah koordinasi dengan partisip aoris yang menyatakan kesadaran Yesus dalam alur narasi, bukan alasan kausal eksplisit bagi perkataan-Nya.
  - severity: medium
    issue: Pertanyaan kedua tidak ditandai secara eksplisit.
    rationale: οὔπω νοεῖτε οὐδὲ συνίετε; adalah pertanyaan retoris. Bahasa Indonesia baku memerlukan «Apakah» agar fungsi sintaksisnya jelas.
  - severity: low
    issue: Konstruksi «membicarakan bahwa» terasa kaku.
    rationale: «Membicarakan soal kalian tidak mempunyai roti» lebih alami dalam bahasa Indonesia modern serta tetap mempertahankan isi klausa ὅτι.
  revised_text: Yesus mengetahui hal itu, lalu berkata kepada mereka, “Mengapa kalian membicarakan soal kalian tidak mempunyai roti? Apakah kalian belum juga menangkap atau memahami? Apakah hati kalian sudah menjadi keras?”
