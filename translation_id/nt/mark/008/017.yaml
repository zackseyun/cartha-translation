  text: καὶ ⸀γνοὺς λέγει αὐτοῖς· Τί διαλογίζεσθε ὅτι ἄρτους οὐκ ἔχετε; οὔπω νοεῖτε οὐδὲ συνίετε; ⸀πεπωρωμένην ἔχετε τὴν καρδίαν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/017.yaml
  text: And knowing[a], he says to them[c][b], “Why are you discussing that you have no bread? Do you not yet perceive or understand? Do you have your heart hardened?”
translation:
  language: id
  text: Yesus mengetahui hal itu, lalu berkata kepada mereka, “Mengapa kalian membicarakan soal kalian tidak mempunyai roti? Apakah kalian belum juga menangkap atau memahami? Apakah hati kalian sudah menjadi keras?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: karena mengetahui hal itu
  rationale: Partisip aoris ini menyatakan bahwa Yesus mengetahui pembicaraan para murid. Objek yang tersirat dijelaskan sebagai 'hal itu' agar alami dalam bahasa Indonesia; nama 'Yesus' dipakai sebagai subjek yang jelas sesuai konteks.
- source_word: διαλογίζεσθε
  choice: kalian membicarakan
  rationale: Bentuk ini dalam konteks menunjuk pada pembahasan atau pertimbangan di antara para murid mengenai tidak adanya roti.
- source_word: ἄρτους
  choice: roti
  rationale: Walaupun bentuk Yunani jamak, 'roti' secara alami dapat dipakai sebagai nomina massa dalam bahasa Indonesia tanpa menghilangkan pokok persoalannya.
- source_word: νοεῖτε
  choice: menangkap
  rationale: '''Menangkap'' menyampaikan persepsi atau pengenalan secara mental dan mempertahankan pembedaan dari συνίετε.'
- source_word: συνίετε
  choice: memahami
  rationale: '''Memahami'' menyatakan pengertian atau pemahaman yang lebih utuh dan membentuk pasangan retoris yang alami dengan ''menangkap''.'
- source_word: πεπωρωμένην
  choice: telah menjadi keras
  rationale: Partisip perfek menggambarkan keadaan hati yang sudah dikeraskan atau telah menjadi keras. Pilihan ini mempertahankan aspek keadaan yang dihasilkan tanpa menentukan pelakunya.
- source_word: καρδίαν
  choice: hati
  rationale: '''Hati'' mempertahankan metafora sumber bagi pusat pemahaman dan ketanggapan batin; bentuk jamak distributif alami dalam bahasa Indonesia karena yang disapa lebih dari satu orang.'
theological_decisions:
- issue: Bentuk pertanyaan terakhir mengenai keadaan hati para murid
  choice: Apakah hati kalian telah menjadi keras?
  alternative: Apakah kalian mempunyai hati yang keras?
  rationale: Konstruksi ἔχετε + objek + partisip secara harfiah memakai verba 'mempunyai', tetapi bahasa Indonesia yang alami lebih jelas menyatakan keadaan yang dihasilkan dengan 'telah menjadi keras'. Rumusan ini tetap mempertahankan pertanyaan dan metafora hati serta tidak menetapkan apakah pengerasan itu dilakukan sendiri atau oleh pihak lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian', sesuai Yesus yang berbicara langsung kepada para murid. Diksi dibuat lugas dan bermartabat; pembedaan dua verba kognitif dipertahankan melalui 'menangkap atau memahami'.
