  to: Yesus mengetahui hal itu, lalu berkata kepada mereka, “Mengapa kalian membicarakan soal kalian tidak mempunyai roti? Apakah kalian belum juga menangkap atau memahami? Apakah hati kalian sudah menjadi keras?”
