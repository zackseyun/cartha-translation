id: MRK.8.27
reference: Mark 8:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου· καὶ ἐν τῇ ὁδῷ ἐπηρώτα τοὺς μαθητὰς αὐτοῦ λέγων αὐτοῖς· Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/027.yaml
  text: And Jesus went out[a], with his disciples, to the villages of Caesarea Philippi. And on the way he was asking his disciples, saying to them, “Who do people say that I am?”
translation:
  language: id
  text: Yesus pergi bersama murid-murid-Nya ke desa-desa di wilayah Kaisarea Filipi. Dalam perjalanan, Ia bertanya kepada murid-murid-Nya, “Kata orang, siapakah Aku ini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: pergi
  rationale: Dalam konteks perjalanan menuju wilayah Kaisarea Filipi, bentuk aoris ἐξέρχομαι secara alami dinyatakan dengan “pergi”; “keluar” tanpa titik asal yang disebutkan akan terasa kurang wajar dalam bahasa Indonesia.
- source_word: κώμας
  choice: desa-desa
  rationale: κώμη biasanya menunjuk pada permukiman yang lebih kecil daripada kota; “desa-desa” mempertahankan pembedaan itu.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Kaisarea Filipi
  rationale: Mengikuti bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia.
- source_word: εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου
  choice: ke desa-desa di sekitar Kaisarea Filipi
  rationale: Genitif nama tempat menunjukkan desa-desa yang termasuk dalam kawasan Kaisarea Filipi, bukan bahwa Kaisarea Filipi sendiri terdiri atas beberapa desa.
- source_word: ἐν τῇ ὁδῷ
  choice: Dalam perjalanan
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan motif perjalanan yang penting dalam narasi Markus.
- source_word: ἐπηρώτα
  choice: bertanya
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung dalam latar narasi. Bahasa Indonesia tidak menandai aspek ini secara wajib, dan “bertanya” paling alami di sini tanpa melebihkan makna menjadi “terus bertanya”.
- source_word: λέγων αὐτοῖς
  choice: diungkapkan langsung melalui kutipan
  rationale: Konstruksi partisipial Yunani, secara harfiah “dengan berkata kepada mereka,” berfungsi memperkenalkan isi pertanyaan. Pengulangan “bertanya ... dengan berkata” tidak alami dalam bahasa Indonesia.
- source_word: Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
  choice: Kata orang, siapakah Aku ini?
  rationale: Rumusan ini alami dan tetap mempertahankan pertanyaan mengenai identitas Yesus. “Orang” mewakili ἄνθρωποι yang bersifat generik, sedangkan “Kata orang” menyampaikan present λέγουσιν sebagai pandangan yang sedang beredar.
- source_word: οἱ μαθηταὶ αὐτοῦ / τοὺς μαθητὰς αὐτοῦ
  choice: murid-murid-Nya
  rationale: Bentuk jamak dan posesif eksplisit dipertahankan pada kedua kemunculannya.
theological_decisions:
- issue: Cakupan generik οἱ ἄνθρωποι dalam pertanyaan Yesus
  choice: orang
  alternative: laki-laki / manusia
  rationale: Dalam konteks ini ἄνθρωποι menunjuk kepada masyarakat pada umumnya, bukan khusus kepada kaum laki-laki. “Orang” menyampaikan cakupan generik tersebut tanpa menambahkan pembatasan gender.
- issue: Sifat pertanyaan mengenai identitas Yesus
  choice: siapakah Aku ini?
  alternative: Aku ini siapa?
  rationale: Keduanya mungkin secara makna, tetapi “siapakah Aku ini?” mempertahankan fokus identitas dan memberi ragam yang lebih bermartabat tanpa menyelesaikan pertanyaan kristologis yang sengaja dibiarkan terbuka pada titik ini dalam narasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti ilahi “Ia” serta sufiks posesif “-Nya” dikapitalisasi sesuai kebiasaan luas penerbitan Alkitab Indonesia, tanpa menambahkan gelar atau penafsiran yang tidak ada dalam teks Yunani.
