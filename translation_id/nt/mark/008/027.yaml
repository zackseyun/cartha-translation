    issue: “di sekitar Kaisarea Filipi” menambahkan relasi spasial yang tidak eksplisit.
    rationale: Teks Yunani menyebut “desa-desa Kaisarea Filipi,” yang secara aman menunjuk desa-desa dalam/terkait wilayah itu. “Di sekitar” dapat dipahami sebagai desa-desa di luar wilayah atau mengelilingi kota. “Di wilayah” lebih dekat pada konstruksi sumber tanpa menjadi harfiah secara kaku.
