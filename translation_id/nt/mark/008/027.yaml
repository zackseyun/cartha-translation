  rationale: Revisi tunggal mengganti “di sekitar” dengan “di wilayah” untuk menghilangkan tambahan nuansa geografis sambil mempertahankan maksud yang paling mungkin dari genitif Καισαρείας τῆς Φιλίππου. Struktur pertanyaan, sifat generik “orang,” serta register dan istilah yang ada dipertahankan.
