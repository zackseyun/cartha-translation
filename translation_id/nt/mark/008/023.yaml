id: MRK.8.23
reference: Mark 8:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ ⸀ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης, καὶ πτύσας εἰς τὰ ὄμματα αὐτοῦ, ἐπιθεὶς τὰς χεῖρας αὐτῷ, ἐπηρώτα αὐτόν· Εἴ τι ⸀βλέπεις;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/023.yaml
  text: And taking the blind man by the hand[a], he led him out of the village; and after spitting on his eyes and laying his hands on him, he asked him, “Do you see anything?”
translation:
  language: id
  text: Yesus memegang tangan orang buta itu dan menuntunnya ke luar desa. Setelah meludahi mata orang itu[a] dan meletakkan kedua tangan-Nya padanya, Yesus bertanya, “Apakah kamu melihat sesuatu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “meludah ke dalam matanya.”
    reason: εἰς secara harfiah dapat diterjemahkan “ke dalam”, meskipun “meludahi mata” lebih alami dalam bahasa Indonesia pada konteks ini.
lexical_decisions:
- source_word: ἐπιλαβόμενος τῆς χειρὸς
  choice: memegang tangan
  rationale: Ungkapan ini berarti memegang atau menggandeng tangan seseorang. “Memegang tangan” alami dalam bahasa Indonesia dan mempertahankan tindakan konkret tanpa menyiratkan cengkeraman keras.
- source_word: τοῦ τυφλοῦ
  choice: orang buta itu
  rationale: Kata sifat τυφλός dipakai sebagai nomina bagi seorang laki-laki yang buta; “orang buta itu” merupakan padanan Indonesia yang wajar dalam konteks narasi.
- source_word: ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης
  choice: menuntunnya ke luar desa
  rationale: Walaupun ἐκφέρω dapat berarti membawa ke luar, tindakan memegang tangan orang buta mendukung gambaran menuntun. “Ke luar desa” mempertahankan arah gerak dan κώμη sebagai permukiman kecil.
- source_word: πτύσας εἰς τὰ ὄμματα αὐτοῦ
  choice: setelah meludahi mata orang itu
  rationale: Partisip aoris dinyatakan sebagai tindakan yang mendahului tindakan berikutnya. “Meludahi mata” alami dalam bahasa Indonesia dan tetap mempertahankan fisikalitas tindakan; arti yang lebih harfiah dari εἰς dicatat dalam catatan kaki.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: meletakkan kedua tangan-Nya padanya
  rationale: Terjemahan ini mempertahankan bentuk jamak τὰς χεῖρας dan sentuhan fisik, tanpa menjadikannya istilah teknis untuk suatu ritus.
- source_word: ἐπηρώτα αὐτόν
  choice: Yesus bertanya
  rationale: Imperfek Yunani dapat menggambarkan tindakan yang sedang berlangsung, tetapi dalam narasi Indonesia pertanyaan langsung paling alami diperkenalkan dengan bentuk sederhana “bertanya”. Nama “Yesus” diulang untuk memperjelas subjek.
- source_word: Εἴ τι βλέπεις;
  choice: Apakah kamu melihat sesuatu?
  rationale: Bentuk ini mempertahankan pertanyaan mengenai ada atau tidaknya sesuatu yang dapat dilihat, tanpa mengubahnya menjadi pertanyaan tentang kemampuan secara umum.
theological_decisions:
- issue: Tindakan penyembuhan yang bersifat jasmani dan mencolok
  choice: Urutan meludahi mata dan meletakkan kedua tangan dipertahankan secara konkret.
  alternative: Memuluskan atau mengaburkan tindakan fisik tersebut dalam parafrasa.
  rationale: Narasi Yunani menonjolkan tindakan jasmani Yesus; terjemahan tidak seharusnya menyamarkan detail yang mungkin terasa mengejutkan bagi pembaca modern.
- issue: Kemungkinan nuansa ritual pada tindakan meletakkan tangan
  choice: Diterjemahkan sebagai tindakan fisik “meletakkan kedua tangan-Nya padanya”.
  alternative: Memakai ungkapan teknis yang secara khusus menyiratkan ritus gerejawi.
  rationale: Dalam konteks ini frasa tersebut menggambarkan sentuhan dalam penyembuhan dan tidak dengan sendirinya menetapkan makna sakramental atau penahbisan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara urutan tindakan dan detail fisik teks Yunani tetap dipertahankan. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia.
