  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιστραφεὶς καὶ ἰδὼν τοὺς μαθητὰς αὐτοῦ ἐπετίμησεν ⸀Πέτρῳ ⸂καὶ λέγει⸃· Ὕπαγε ὀπίσω μου, Σατανᾶ, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/033.yaml
  text: But turning around and seeing his disciples[a], he rebuked Peter and said, “Get behind me, Satan, because you are not setting your mind on the things of God, but on the things of men.”
translation:
  language: id
  text: Namun, Yesus berpaling dan memandang murid-murid-Nya, lalu menegur Petrus dan berkata, “Pergilah ke belakang-Ku, Iblis! Sebab pikiranmu tidak tertuju pada perkara-perkara Allah, melainkan pada perkara-perkara manusia.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: berpaling
  rationale: Partisip aoris ini dipakai secara intransitif dan menggambarkan Yesus mengubah arah tubuh-Nya; 'berpaling' alami dan cukup jelas dalam bahasa Indonesia.
- source_word: ἰδὼν
  choice: memandang
  rationale: Menunjukkan bahwa Yesus mengarahkan pandangan kepada para murid; 'memandang' lebih kontekstual daripada sekadar 'melihat' dan tetap mempertahankan urutan tindakan.
- source_word: μαθητὰς
  choice: murid-murid
  rationale: Padanan baku bagi μαθητής dalam konteks Injil dan mempertahankan makna pengikut yang belajar dari Yesus.
- source_word: ἐπετίμησεν
  choice: menegur
  rationale: Dalam konteks ini menunjuk pada teguran lisan yang keras. 'Menegur' merupakan padanan Indonesia yang alami; kerasnya teguran tampak jelas dalam ucapan berikutnya.
- source_word: καὶ λέγει
  choice: kata-Nya
  rationale: λέγει adalah bentuk kini historis. Narasi Indonesia secara alami menggunakan bentuk lampau yang tersirat; 'kata-Nya' mengalir baik dan mempertahankan subjek Yesus.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Pergilah ke belakang-Ku
  rationale: Mempertahankan unsur perintah ὕπαγε dan posisi ὀπίσω μου tanpa menafsirkannya sekadar sebagai 'enyahlah'. Frasa ini memungkinkan nuansa bahwa Petrus harus kembali ke tempat pengikut, bukan mendahului atau menghalangi Yesus.
- source_word: Σατανᾶ
  choice: Iblis
  rationale: Dalam pemakaian Perjanjian Baru di sini, Σατανᾶ merupakan sapaan personal yang lazim diterjemahkan 'Iblis' dalam bahasa Indonesia. Terjemahan tidak memutuskan apakah Petrus secara harfiah adalah Iblis.
- source_word: φρονεῖς
  choice: pikiranmu tidak tertuju pada
  rationale: φρονέω mencakup orientasi batin, perhatian, dan pola pikir, bukan sekadar aktivitas berpikir. Ungkapan ini alami serta mempertahankan nuansa disposisional tersebut.
- source_word: τὰ τοῦ θεοῦ
  choice: perkara-perkara Allah
  rationale: Konstruksi netral jamak ini luas dan tidak menentukan apakah yang dimaksud adalah kehendak, kepentingan, atau jalan Allah. 'Perkara-perkara Allah' mempertahankan keluasan itu.
- source_word: τὰ τῶν ἀνθρώπων
  choice: perkara-perkara manusia
  rationale: ἄνθρωποι di sini merujuk secara generik kepada umat manusia. 'Manusia' akurat secara gender dan mempertahankan kontras dengan perkara-perkara Allah.
theological_decisions:
- issue: Acuan sapaan Σατανᾶ kepada Petrus
  choice: Yesus menegur Petrus secara langsung dengan sapaan 'Iblis', sehingga perkataan Petrus ditampilkan sejalan dengan perlawanan Iblis, tanpa menyatakan bahwa Petrus secara harfiah adalah Iblis.
  alternative: Yesus sedang menyapa Iblis yang berada di balik Petrus; atau Σατανᾶ hanya berarti 'lawan' secara nonpersonal.
  rationale: Objek langsung teguran dalam narasi adalah Petrus, lalu sapaan muncul dalam ucapan kepada dia. Terjemahan mempertahankan ketajaman dan ketegangan teks tanpa menambahkan penjelasan metafisis.
- issue: Makna posisi dalam ὀπίσω μου
  choice: Diterjemahkan secara formal sebagai 'ke belakang-Ku', yang dapat mengisyaratkan tempat seorang pengikut tanpa menutup makna penolakan keras.
  alternative: '''Enyahlah dari hadapan-Ku'' atau ''Menyingkirlah''.'
  rationale: Terjemahan alternatif menonjolkan pengusiran tetapi menghilangkan citra posisi 'di belakang' yang terdapat dalam bahasa Yunani dan penting dalam konteks kemuridan.
- issue: Cakupan ἀνθρώπων
  choice: manusia, yakni umat manusia secara umum
  alternative: laki-laki atau orang-orang
  rationale: ἄνθρωπος dalam bentuk jamak di sini bersifat generik dan dikontraskan dengan Allah, bukan menunjuk khusus kepada kaum laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat, dengan struktur kalimat yang mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas penerbitan Alkitab Indonesia. Tidak diperlukan catatan kaki karena 'manusia' secara langsung menyampaikan cakupan generik ἀνθρώπων dan teks utama mempertahankan ambiguitas penting.
