id: MRK.8.34
reference: Mark 8:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς· ⸂Εἴ τις⸃ θέλει ὀπίσω μου ⸀ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/034.yaml
  text: And after calling the crowd together with his disciples[a], he said to them, “If anyone wants to come after me, let him deny himself, take up his cross[b], and follow me.”
translation:
  language: id
  text: Setelah memanggil orang banyak bersama murid-murid-Nya, Yesus berkata kepada mereka, “Jika seseorang ingin mengikut Aku,[a] hendaklah ia menyangkal dirinya, memikul salibnya,[b] dan mengikut Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “datang di belakang-Ku.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “memikul salibnya” mempertahankan gambaran salib secara harfiah dan tidak sekadar berarti menanggung suatu beban.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: memanggil
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. Susunan dengan “kemudian” menyampaikan urutan itu secara alami; konteks menunjukkan bahwa Yesus memanggil orang banyak untuk datang kepada-Nya.
- source_word: τὸν ὄχλον
  choice: orang banyak
  rationale: Padanan Indonesia yang alami dan bermartabat untuk ὄχλος dalam konteks kerumunan yang mendengarkan pengajaran.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: bersama murid-murid-Nya
  rationale: σύν menandai kebersamaan; frasa ini mempertahankan bahwa orang banyak maupun para murid hadir dan menjadi sasaran perkataan Yesus.
- source_word: Εἴ τις θέλει
  choice: Jika seseorang ingin
  rationale: Konstruksi bersyarat ini membuka panggilan umum. “Seseorang” mempertahankan ketaktertentuan τις, sedangkan “ingin” merupakan padanan modern bagi θέλει.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: mengikut Aku
  rationale: Secara harfiah berarti datang di belakang Yesus dan dalam konteks berfungsi sebagai ungkapan pemuridan. “Mengikut Aku” alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan gambaran harfiahnya.
- source_word: ἀπαρνησάσθω ἑαυτόν
  choice: ia harus menyangkal dirinya
  rationale: Imperatif orang ketiga menuntut tindakan tegas. “Harus” menyampaikan daya perintah secara alami, dan “menyangkal dirinya” mempertahankan gagasan penolakan terhadap tuntutan diri sendiri tanpa mempersempitnya menjadi penyangkalan kesenangan semata.
- source_word: ἀράτω
  choice: memikul
  rationale: Dalam bahasa Indonesia, “memikul salib” adalah ungkapan alami yang tetap mempertahankan citra konkret mengambil dan membawa salib.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: salibnya
  rationale: σταυρός diterjemahkan secara harfiah sebagai “salib”, dan pronomina posesif dipertahankan untuk menegaskan penerapan pribadi tuntutan tersebut.
- source_word: ἀκολουθείτω μοι
  choice: terus mengikut Aku
  rationale: Imperatif kini dapat menyiratkan tindakan berkelanjutan. “Terus” membuat nuansa keberlanjutan itu jelas dalam bahasa Indonesia tanpa mengubahnya menjadi tindakan sesaat.
theological_decisions:
- issue: Daya tuntutan pemuridan
  choice: 'Panggilan terbuka bagi siapa pun yang ingin menjadi pengikut Yesus, diikuti tuntutan yang mengikat: menyangkal diri, memikul salib, dan terus mengikut Dia.'
  alternative: Mengulang bentuk “hendaklah ia” pada setiap perintah.
  rationale: Bahasa Yunani memakai klausa bersyarat lalu tiga imperatif orang ketiga. “Ia harus” secara alami menyampaikan daya imperatif dalam bahasa Indonesia tanpa memasukkan kerangka denominasi tertentu.
- issue: Makna σταυρός dalam konteks
  choice: Mempertahankan kata konkret “salib”.
  alternative: Menafsirkannya sebagai beban, penderitaan, atau kemartiran saja.
  rationale: Citra teks berakar pada salib Romawi yang nyata dan memiliki ketegangan historis serta teologis yang tidak boleh dipersempit melalui parafrasa.
- issue: Hubungan ὀπίσω μου ἐλθεῖν dan ἀκολουθείτω μοι
  choice: Keduanya diterjemahkan dengan bahasa mengikuti, tetapi perintah terakhir diberi “terus” untuk menyatakan keberlanjutan.
  alternative: Menerjemahkan frasa pertama secara harfiah sebagai “datang di belakang-Ku” dalam teks utama.
  rationale: Ungkapan pertama merupakan idiom pemuridan, sedangkan bentuk imperatif kini pada bagian akhir memungkinkan penekanan pada tindakan berkelanjutan. Catatan kaki menjaga citra spasial frasa pertama.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Tanda baca menempatkan penanda catatan kaki langsung sesudah unsur yang diterangkan.
