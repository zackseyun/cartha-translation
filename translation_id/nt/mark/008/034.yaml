revisions:
- from: Kemudian Yesus memanggil orang banyak bersama murid-murid-Nya dan berkata kepada mereka, “Jika seseorang ingin mengikut Aku,[a] ia harus menyangkal dirinya, memikul salibnya,[b] dan terus mengikut Aku.”
  to: Setelah memanggil orang banyak bersama murid-murid-Nya, Yesus berkata kepada mereka, “Jika seseorang ingin mengikut Aku,[a] hendaklah ia menyangkal dirinya, memikul salibnya,[b] dan mengikut Aku.”
  rationale: Revisi menyatakan secara eksplisit bahwa pemanggilan orang banyak dan para murid mendahului perkataan Yesus, sesuai fungsi partisip aoris Yunani. Rangkaian “hendaklah ia ...” mempertahankan kekuatan tiga imperatif orang ketiga. Penghapusan “terus” menghindari penambahan penekanan aspek yang tidak perlu, tanpa meniadakan sifat pemuridan yang berkelanjutan dalam konteks.
