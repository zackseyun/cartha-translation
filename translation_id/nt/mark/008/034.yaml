  naturalness: Dengan “Setelah memanggil ...” susunan peristiwa menjadi alami dan jelas dalam bahasa Indonesia modern. “Hendaklah ia” secara idiomatis menyampaikan rangkaian imperatif orang ketiga tanpa mengubahnya menjadi pernyataan abstrak. “Memikul salibnya” tetap merupakan kolokasi Indonesia yang lazim dan konkret.
  terminology: “Orang banyak,” “murid-murid-Nya,” “menyangkal dirinya,” “salibnya,” dan “mengikut Aku” sesuai register Alkitab Indonesia modern. “Salib” dipertahankan secara literal. Catatan a secara tepat mencatat citra spasial dari ὀπίσω μου ἐλθεῖν; catatan b menjaga agar “memikul salib” tidak direduksi menjadi sekadar metafora beban.
