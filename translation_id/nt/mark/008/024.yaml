  yaml_path: translation/nt/mark/008/024.yaml
  text: And looking up, he said, “I see people, because I see them walking around like trees.”
translation:
  language: id
  text: Setelah memandang ke atas, ia berkata, “Aku melihat orang-orang, sebab mereka kulihat seperti pohon-pohon yang berjalan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψας
  choice: Setelah dapat melihat
  rationale: Dalam konteks pemulihan penglihatan, verba ini paling wajar dipahami sebagai mulai atau kembali dapat melihat, bukan sekadar mengarahkan pandangan ke atas.
- source_word: τοὺς ἀνθρώπους
  choice: orang-orang
  rationale: Padanan alami bagi bentuk jamak yang merujuk kepada manusia yang tampak olehnya.
- source_word: ὅτι
  choice: sebab
  rationale: Mempertahankan hubungan penjelas atau kausal dalam ucapan orang itu tanpa menghaluskannya menjadi susunan yang lebih bebas.
- source_word: ὡς δένδρα
  choice: seperti pohon
  rationale: Mempertahankan perbandingan langsung yang menggambarkan penglihatannya yang masih kabur.
- source_word: περιπατοῦντας
  choice: berjalan ke sana kemari
  rationale: Menyampaikan gerak orang-orang yang terlihat, dengan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Tahap pertama pemulihan penglihatan belum sempurna
  choice: Mempertahankan gambaran bahwa orang-orang tampak seperti pohon yang berjalan
  alternative: Menjelaskan secara eksplisit bahwa penglihatannya masih kabur
  rationale: Teks menunjukkan ketidaksempurnaan penglihatan melalui citra konkret, bukan melalui penjelasan narator; terjemahan tidak menambahkan tafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan klausa dibuat alami sambil mempertahankan hubungan penjelas dalam bahasa Yunani dan citra penglihatan yang ganjil.
