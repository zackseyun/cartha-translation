  source_fidelity: Teks Indonesia dengan tepat menyampaikan ὀλίγα ἰχθύδια sebagai “beberapa ikan kecil,” tindakan pendahuluan εὐλογήσας sebagai “Setelah memberkati,” serta perintah yang dinyatakan melalui εἶπεν + infinitif παρατιθέναι. “Menghidangkan” merupakan padanan kontekstual yang baik untuk παρατιθέναι dalam konteks makanan. “Juga” mempertahankan unsur aditif καί dalam καὶ ταῦτα.
