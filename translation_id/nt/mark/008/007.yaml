  text: καὶ εἶχον ἰχθύδια ὀλίγα· καὶ εὐλογήσας ⸀αὐτὰ εἶπεν ⸂καὶ ταῦτα παρατιθέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/007.yaml
  text: And they had a few small fish[a]; and after blessing them[b], he said to set these also before them.
translation:
  language: id
  text: Mereka mempunyai beberapa ikan kecil. Setelah memberkati ikan-ikan itu, Ia berkata supaya mereka[a] menghidangkan ikan-ikan itu juga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Yunani tidak menyebutkan secara eksplisit siapa yang harus menghidangkannya; para murid dipahami dari konteks.
    reason: implicit_subject
lexical_decisions:
- source_word: ἰχθύδια ὀλίγα
  choice: beberapa ikan kecil
  rationale: Bentuk diminutif ἰχθύδια menunjukkan ikan kecil, sedangkan ὀλίγα menyatakan jumlah yang sedikit; frasa ini alami dalam bahasa Indonesia.
- source_word: εὐλογήσας αὐτά
  choice: setelah memberkati ikan-ikan itu
  rationale: Partisip aoris menunjukkan tindakan yang mendahului perkataan Yesus. Pilihan ini mempertahankan arti dasar εὐλογέω dan objek jamak yang merujuk kepada ikan.
- source_word: εἶπεν
  choice: Ia berkata
  rationale: Pilihan ini mempertahankan arti umum λέγω tanpa memperkuatnya menjadi 'memerintahkan' atau 'menyuruh'.
- source_word: καὶ ταῦτα
  choice: ikan-ikan itu juga
  rationale: Kata 'juga' mempertahankan daya aditif καί, sedangkan pengulangan 'ikan-ikan itu' lebih jelas dan alami daripada pronomina demonstratif netral dalam bahasa Indonesia.
- source_word: παρατιθέναι
  choice: menghidangkan
  rationale: Dalam konteks makanan, παρατίθημι berarti menaruh makanan di hadapan orang atau menghidangkannya; 'menghidangkan' menyampaikan maksud itu secara ringkas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bersahaja. Kata ganti hormat 'Ia' dipakai untuk Yesus sesuai register Alkitab Indonesia yang umum, tanpa menambahkan nama yang tidak terdapat dalam ayat ini.
