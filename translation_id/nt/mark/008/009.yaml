  yaml_path: translation/nt/mark/008/009.yaml
  text: There were about four thousand[a], and he sent them away.
translation:
  language: id
  text: Ada kira-kira empat ribu orang. Lalu Ia membubarkan mereka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menyuruh mereka pergi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν
  choice: Jumlah mereka
  rationale: Bentuk ini menyampaikan pemakaian eksistensial εἰμί secara wajar dalam bahasa Indonesia sambil menghubungkan angka dengan orang banyak dalam konteks.
- source_word: δὲ
  choice: Lalu
  rationale: δέ merupakan penghubung ringan; “lalu” menjaga kelancaran peralihan narasi tanpa menjadikannya penanda waktu yang kuat.
- source_word: ὡς
  choice: kira-kira
  rationale: ὡς di depan bilangan menunjukkan perkiraan, bukan jumlah yang persis.
- source_word: τετρακισχίλιοι
  choice: empat ribu orang
  rationale: Numeralia ini menyatakan jumlah orang banyak; penambahan “orang” diperlukan agar alami dan jelas dalam bahasa Indonesia.
- source_word: ἀπέλυσεν
  choice: menyuruh mereka pulang
  rationale: Dalam konteks ini ἀπολύω berarti menyuruh orang banyak pergi setelah mereka diberi makan. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan alternatif “membubarkan” dalam catatan kaki.
- source_word: αὐτούς
  choice: mereka
  rationale: Pronomina ini merujuk kembali kepada orang banyak.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Ia” merujuk kepada Yesus dari konteks tanpa menambahkan nama yang tidak terdapat dalam ayat Yunani. Penanda catatan kaki ditempatkan pada frasa yang diterangkannya, yaitu tindakan menyuruh orang banyak pergi.
