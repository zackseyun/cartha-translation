  text: Καὶ ἐξῆλθον οἱ Φαρισαῖοι καὶ ἤρξαντο συζητεῖν αὐτῷ, ζητοῦντες παρ’ αὐτοῦ σημεῖον ἀπὸ τοῦ οὐρανοῦ, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/011.yaml
  text: And the Pharisees came out and began to argue with him[a], seeking from him a sign from heaven, testing him.
translation:
  language: id
  text: Orang-orang Farisi itu keluar lalu mulai berdebat dengan-Nya; mereka meminta kepada-Nya sebuah tanda dari surga[a], dengan maksud menguji-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanda dari langit”; ungkapan ini lebih mungkin berarti tanda yang berasal dari surga, yakni dari Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: datang
  rationale: Dalam konteks masuknya orang-orang Farisi ke dalam adegan, bentuk ini paling alami diterjemahkan “datang”; lokasi asal gerakan mereka tidak dijelaskan dalam teks.
- source_word: ἤρξαντο συζητεῖν
  choice: mulai berdebat
  rationale: ἤρξαντο menyatakan awal tindakan, sedangkan συζητεῖν dalam konteks permusuhan dan pengujian berarti berdebat, bukan sekadar berdiskusi.
- source_word: αὐτῷ
  choice: dengan-Nya
  rationale: Datif yang menyertai συζητεῖν secara alami menunjukkan pihak yang diajak berdebat. Kata ganti dipertahankan tanpa menambahkan nama yang tidak terdapat dalam bahasa Yunani.
- source_word: ζητοῦντες παρ’ αὐτοῦ
  choice: meminta kepada-Nya
  rationale: Dalam konteks permohonan akan sebuah tanda, ζητέω dapat berarti meminta, dan παρά dengan genitif menunjukkan sumber atau pihak yang dimintai.
- source_word: σημεῖον
  choice: suatu tanda
  rationale: “Tanda” mempertahankan penekanan pada nilai pembuktian atau pengesahan, bukan hanya pada sifat ajaib suatu perbuatan.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: dari surga
  rationale: Ungkapan ini secara harfiah dipertahankan dan dalam konteks Injil paling wajar menunjuk pada asal atau pengesahan ilahi, tanpa menutup kemungkinan arti harfiah “dari langit”.
- source_word: πειράζοντες αὐτόν
  choice: untuk menguji-Nya
  rationale: Partisipel ini menyatakan maksud atau motif permintaan mereka. “Menguji” menangkap tantangan yang bermusuhan tanpa menyiratkan secara khusus upaya membujuk-Nya berbuat dosa.
theological_decisions:
- issue: Makna “dari surga” dalam permintaan akan tanda
  choice: Tanda yang berasal dari atau disahkan oleh Allah
  alternative: Tanda yang tampak datang dari langit
  rationale: Konteks Injil dan sifat tantangan orang-orang Farisi lebih mendukung asal atau pengesahan ilahi. Namun, teks utama tetap memakai ungkapan “dari surga” dan catatan kaki mencatat alternatif leksikalnya agar ambiguitas asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Yunani dibagi menjadi dua agar alur tindakan dan maksud pengujian mudah dipahami, sementara hubungan antargagasannya tetap dipertahankan.
