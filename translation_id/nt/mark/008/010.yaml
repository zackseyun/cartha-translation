id: MRK.8.10
reference: Mark 8:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐμβὰς εἰς τὸ πλοῖον μετὰ τῶν μαθητῶν αὐτοῦ ἦλθεν εἰς τὰ μέρη Δαλμανουθά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/010.yaml
  text: And immediately[a], getting into the boat with his disciples, he went to the region of Dalmanutha.
translation:
  language: id
  text: Lalu segera ia naik ke perahu bersama murid-muridnya dan pergi ke daerah Dalmanuta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Yunani memakai bentuk jamak, “bagian-bagian/wilayah-wilayah Dalmanuta”; ungkapan ini dapat juga diterjemahkan “kawasan Dalmanuta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: segera
  rationale: Mempertahankan daya temporal dan gerak cepat yang khas dalam narasi Markus dengan ungkapan Indonesia yang alami.
- source_word: ἐμβὰς
  choice: naik ke
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama; 'naik ke perahu' merupakan ungkapan Indonesia yang idiomatis.
- source_word: πλοῖον
  choice: perahu
  rationale: Dalam konteks Danau Galilea, 'perahu' lebih wajar dan tepat daripada 'kapal', yang dapat menyiratkan sarana air yang lebih besar.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: bersama murid-muridnya
  rationale: Menyampaikan penyertaan yang dinyatakan oleh μετά dengan genitif secara ringkas dan alami.
- source_word: ἦλθεν
  choice: pergi
  rationale: Dalam gerak naratif menuju suatu tempat, 'pergi' alami dari sudut pandang pencerita, meskipun verba Yunani juga dapat berarti 'datang'.
- source_word: τὰ μέρη
  choice: daerah
  rationale: Bentuk jamak Yunani secara idiomatis menunjuk pada kawasan atau wilayah; 'daerah' mempertahankan makna geografis tanpa terjemahan harfiah yang kaku.
- source_word: Δαλμανουθά
  choice: Dalmanuta
  rationale: Nama tempat ditransliterasikan ke ejaan Indonesia; θ direpresentasikan sebagai 't' sesuai kebiasaan bentuk nama Alkitab dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Susunan kalimat mempertahankan urutan tindakan dalam sumber Yunani, sedangkan ungkapan geografis dibuat idiomatis. Penanda catatan kaki ditempatkan setelah nama tempat karena catatan menjelaskan frasa tujuan secara keseluruhan.
