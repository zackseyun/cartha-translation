base_translation:
  language: en
  yaml_path: translation/nt/mark/008/018.yaml
  text: Having eyes[a], do you not see? And having ears, do you not hear? And do you not remember?
translation:
  language: id
  text: Kalian mempunyai mata, tetapi tidakkah kalian melihat?[a] Kalian mempunyai telinga, tetapi tidakkah kalian mendengar? Dan tidakkah kalian ingat?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Walaupun kalian mempunyai mata, tidakkah kalian menyadari? Dan walaupun kalian mempunyai telinga, tidakkah kalian memahami?” Bahasa Yunani memakai kata kerja biasa untuk “melihat” dan “mendengar”, yang dalam konteks ini juga dapat menyiratkan pemahaman rohani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοὺς ἔχοντες
  choice: Kalian mempunyai mata, tetapi
  rationale: 'Partisip ini berfungsi secara konsesif dalam pertanyaan retoris. Susunan ini alami dalam bahasa Indonesia dan mempertahankan pertentangan tersirat: mereka mempunyai mata, tetapi gagal melihat.'
- source_word: βλέπετε
  choice: tidakkah kalian melihat
  rationale: Kata kerja biasa untuk 'melihat' dipertahankan agar makna indrawi sekaligus kemungkinan daya tangkap rohani tetap terbuka.
- source_word: ὦτα ἔχοντες
  choice: Kalian mempunyai telinga, tetapi
  rationale: Diterjemahkan sejajar dengan frasa pertama untuk mempertahankan struktur dan tekanan retoris teks Yunani.
- source_word: ἀκούετε
  choice: tidakkah kalian mendengar
  rationale: Makna dasar 'mendengar' dipertahankan; konteks dapat menyiratkan kegagalan menyimak atau memahami tanpa memasukkannya secara eksplisit ke dalam teks utama.
- source_word: μνημονεύετε
  choice: tidakkah kalian ingat
  rationale: '''Ingat'' merupakan padanan modern dan langsung, sesuai dengan teguran Yesus tentang kegagalan para murid mengingat kejadian sebelumnya.'
- source_word: καὶ
  choice: Dan
  rationale: Konjungsi terakhir dipertahankan untuk menyampaikan daya kumulatif rangkaian pertanyaan.
- source_word: οὐ / οὐκ
  choice: tidakkah
  rationale: Negasi dalam pertanyaan retoris diterjemahkan secara alami dengan 'tidakkah'.
theological_decisions:
- issue: Daya indrawi atau kiasan dari 'melihat' dan 'mendengar'
  choice: Mempertahankan kata konkret 'melihat' dan 'mendengar' dalam teks utama.
  alternative: Menerjemahkan sebagai 'menyadari/memahami' untuk memperjelas makna kiasan.
  rationale: Bahasa Yunani memakai kata kerja indrawi biasa, sementara konteksnya menyiratkan ketumpulan rohani. Terjemahan konkret mempertahankan gema profetis dan ketegangan makna tanpa menafsirkannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina jamak 'kalian' memperjelas bahwa teguran ditujukan kepada para murid. Pengulangan struktur dipertahankan untuk menjaga daya retoris.
