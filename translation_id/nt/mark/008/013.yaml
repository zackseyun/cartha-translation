  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἐμβὰς⸃ ἀπῆλθεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/013.yaml
  text: And leaving them[a], he got back into the boat and went to the other side.
translation:
  language: id
  text: Lalu Ia meninggalkan mereka, naik kembali ke perahu,[a] dan pergi ke seberang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “naik lagi, lalu pergi ke seberang.” Kata πάλιν dapat diterjemahkan “lagi” dan bukan “kembali.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς
  choice: meninggalkan
  rationale: Partisip aoris ἀφίημι menyatakan bahwa Yesus meninggalkan orang-orang itu sebelum pergi; bentuk ini alami dalam narasi Indonesia dan tetap mempertahankan hubungan dengan verba utama.
- source_word: αὐτοὺς
  choice: mereka
  rationale: Pronomina ini merujuk kepada orang-orang Farisi dalam konteks langsung, sehingga padanan sederhana 'mereka' sudah jelas.
- source_word: πάλιν
  choice: kembali
  rationale: Dalam konteks perjalanan ini, πάλιν secara alami menerangkan tindakan naik lagi ke perahu dan dapat diterjemahkan 'kembali'; kemungkinan arti lebih harfiah 'lagi' dicatat dalam catatan kaki.
- source_word: ἐμβὰς
  choice: naik ... ke perahu
  rationale: Partisip ini berarti masuk atau naik ke suatu kendaraan; objek 'perahu' tersirat jelas dari konteks Markus dan perlu dinyatakan agar bahasa Indonesia wajar.
- source_word: ἀπῆλθεν
  choice: pergi
  rationale: Verba ἀπέρχομαι menyatakan keberangkatan. 'Pergi' ringkas dan alami karena tujuan langsung disebut sesudahnya.
- source_word: εἰς τὸ πέραν
  choice: ke seberang
  rationale: Ungkapan ini menunjuk ke sisi lain dan 'ke seberang' merupakan padanan Indonesia yang alami dalam konteks menyeberangi danau.
