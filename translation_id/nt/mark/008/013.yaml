  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. 'Ia' dipakai untuk Yesus sesuai register Alkitab Indonesia; 'perahu' ditambahkan berdasarkan konteks yang tersirat dalam verba Yunani.
