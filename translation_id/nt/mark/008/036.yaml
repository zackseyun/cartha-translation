  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφελεῖ ⸀ἄνθρωπον ⸂κερδῆσαι τὸν κόσμον ὅλον καὶ ζημιωθῆναι⸃ τὴν ψυχὴν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/036.yaml
  text: For what does it profit a man to gain the whole world and forfeit his life?[a][b]
translation:
  language: id
  text: Apa gunanya seseorang memperoleh seluruh dunia, tetapi kehilangan nyawanya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jiwanya” atau “dirinya.” Kata Yunani ψυχή dapat berarti “nyawa,” “jiwa,” atau “diri,” bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Apa gunanya
  rationale: τί membentuk pertanyaan retoris, sedangkan γάρ mengaitkannya sebagai penjelasan bagi ajaran sebelumnya. Dalam bahasa Indonesia, “Apa gunanya” menyampaikan hubungan dan daya retoris itu secara alami.
- source_word: ὠφελεῖ
  choice: gunanya
  rationale: ὠφελέω berarti memberi manfaat atau keuntungan. “Apa gunanya” mempertahankan gagasan manfaat sekaligus cocok dengan perbandingan untung-rugi dalam ayat ini.
- source_word: ἄνθρωπον
  choice: seseorang
  rationale: ἄνθρωπος berbentuk tunggal dan dipakai secara generik bagi manusia; “seseorang” mengungkapkan cakupan umum itu dengan wajar tanpa membatasi pada laki-laki.
- source_word: κερδῆσαι
  choice: memperoleh
  rationale: κερδαίνω berarti mendapat atau memperoleh keuntungan. “Memperoleh” mempertahankan nuansa mendapatkan sesuatu dan berpasangan alami dengan “kehilangan”.
- source_word: τὸν κόσμον ὅλον
  choice: seluruh dunia
  rationale: κόσμος menunjuk pada dunia dalam cakupan menyeluruh, dan ὅλον menegaskan totalitasnya.
- source_word: ζημιωθῆναι
  choice: kehilangan
  rationale: Bentuk pasif ζημιόω dapat berarti menderita kerugian atau kehilangan. “Kehilangan” jelas dan alami, serta mempertahankan pertentangan dengan “memperoleh”.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: nyawanya
  rationale: Dalam konteks Markus 8:35–37, ψυχή terutama menunjuk pada nyawa atau hidup seseorang yang dapat diselamatkan atau hilang. “Nyawanya” menjaga paradoks ucapan ini, sedangkan kemungkinan makna “jiwa” dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna ψυχή dalam perkataan tentang kemuridan
  choice: nyawanya
  alternative: jiwanya; dirinya
  rationale: Konteks langsung berbicara tentang menyelamatkan dan kehilangan ψυχή demi Yesus dan Injil, sehingga “nyawa” paling koheren tanpa menetapkan antropologi tertentu. Karena ψυχή juga dapat berarti “jiwa” atau “diri”, ambiguitas leksikal itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Bentuk generik ἄνθρωπον diterjemahkan sebagai “seseorang”; karena cakupan generiknya sudah jelas dalam bahasa Indonesia, tidak diperlukan catatan budaya tersendiri.
