id: MRK.8.15
reference: Mark 8:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ διεστέλλετο αὐτοῖς λέγων· Ὁρᾶτε, βλέπετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ τῆς ζύμης Ἡρῴδου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/015.yaml
  text: And he kept instructing them[a], saying, “Watch out[b]; beware of the leaven of the Pharisees and the leaven of Herod.”
translation:
  language: id
  text: Ia terus memperingatkan mereka, kata-Nya, “Awas! Waspadalah terhadap ragi orang Farisi dan ragi Herodes.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεστέλλετο
  choice: terus memperingatkan
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung atau berulang pada masa lampau. Dalam konteks ini, verba tersebut menyampaikan peringatan yang sungguh-sungguh; ungkapan ini mempertahankan aspek itu secara alami dalam bahasa Indonesia.
- source_word: λέγων
  choice: kata-Nya
  rationale: Partisipel ini memperkenalkan isi peringatan. 'Kata-Nya' merupakan bentuk naratif Indonesia yang alami tanpa perlu menerjemahkan struktur Yunani secara kaku.
- source_word: Ὁρᾶτε
  choice: Awas!
  rationale: Sebagai imperatif dalam konteks peringatan, kata ini menuntut kewaspadaan, bukan sekadar tindakan melihat.
- source_word: βλέπετε
  choice: Waspadalah
  rationale: Imperatif kedua menguatkan yang pertama. Dua ungkapan peringatan yang berbeda tetapi berdekatan maknanya mempertahankan pengulangan retoris teks Yunani.
- source_word: ἀπὸ
  choice: terhadap
  rationale: Sesudah 'waspadalah', preposisi 'terhadap' terdengar alami dalam bahasa Indonesia dan menyampaikan sikap berjaga-jaga terhadap bahaya atau pengaruh tertentu.
- source_word: ζύμης
  choice: ragi
  rationale: '''Ragi'' adalah padanan Indonesia yang umum dan mudah dipahami, sekaligus mempertahankan metafora tentang sesuatu yang meresapi adonan tanpa menjelaskan maknanya secara berlebihan.'
- source_word: Φαρισαίων
  choice: orang Farisi
  rationale: Sebutan baku dalam bahasa Indonesia untuk kelompok tersebut; bentuk genitif menyatakan kaitan dengan ragi yang disebutkan.
- source_word: Ἡρῴδου
  choice: Herodes
  rationale: Nama itu dipertahankan secara langsung sesuai teks Yunani, tanpa memperluasnya menjadi keluarga, pendukung, atau pengaruh Herodes.
theological_decisions:
- issue: Makna metafora 'ragi'
  choice: Metafora 'ragi' dipertahankan tanpa penjelasan dalam teks utama.
  alternative: ajaran; kemunafikan; pengaruh yang merusak
  rationale: Ayat ini sendiri tidak menetapkan secara eksplisit segi mana dari pengaruh orang Farisi dan Herodes yang dimaksud. Mempertahankan metafora menjaga keterbukaan penafsirannya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Ia' dipakai dalam narasi, sedangkan akhiran hormat '-Nya' menandai bahwa penuturnya Yesus. Pasangan 'Awas! Waspadalah' mempertahankan penekanan dari dua imperatif Yunani tanpa terdengar kaku.
