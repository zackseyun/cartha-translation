id: MRK.11.17
reference: Mark 11:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐδίδασκεν ⸂καὶ ἔλεγεν⸃ ⸀αὐτοῖς· Οὐ γέγραπται ὅτι Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται πᾶσιν τοῖς ἔθνεσιν; ὑμεῖς δὲ ⸀πεποιήκατε αὐτὸν σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/017.yaml
  text: And he was teaching and saying to them[a], “Is it not written[b], ‘My house will be called a house of prayer for all the nations’? But you have made it a den of robbers.”
translation:
  language: id
  text: Ia mengajar dan berkata kepada mereka, “Bukankah ada tertulis, ‘Rumah-Ku akan disebut rumah doa bagi segala bangsa’?[a] Namun, kamu telah menjadikannya sarang penyamun.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagi semua kaum.” Bahasa Yunani berbunyi “bagi segala bangsa,” menggemakan Yesaya 56:7 dan menegaskan cakupan rumah Allah yang melampaui Israel.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “sarang penyamun” menggemakan Yeremia 7:11. Kata Yunani yang diterjemahkan “penyamun” juga dapat berarti “perampok” atau “bandit” dalam konteks tertentu.
    reason: cross_reference
lexical_decisions:
- source_word: ἐδίδασκεν καὶ ἔλεγεν
  choice: terus mengajar dan berkata
  rationale: Kedua verba berbentuk imperfek. Ungkapan ini secara alami menyampaikan tindakan mengajar yang sedang berlangsung, tanpa membuat ujaran langsung berikutnya terasa janggal dalam bahasa Indonesia.
- source_word: Οὐ γέγραπται
  choice: Bukankah ada tertulis
  rationale: Mempertahankan bentuk pertanyaan retoris dan daya formula pasif perfek yang merujuk kepada kewibawaan Kitab Suci yang tetap berlaku.
- source_word: Ὁ οἶκός μου
  choice: Rumah-Ku
  rationale: Padanan langsung yang mempertahankan bunyi kutipan Yesaya 56:7 serta makna sakral rumah Allah, tanpa menggantinya secara interpretatif dengan 'Bait Allah'.
- source_word: οἶκος προσευχῆς
  choice: rumah doa
  rationale: Ungkapan Indonesia yang alami dan dikenal luas, sekaligus mempertahankan susunan serta gema kitabiah frasa sumber.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: bagi segala bangsa
  rationale: Menerjemahkan datif sebagai lingkup atau peruntukan dan mempertahankan ἔθνη sebagai 'bangsa', sehingga cakupan universal kutipan Yesaya tetap jelas.
- source_word: ὑμεῖς δὲ πεποιήκατε
  choice: Namun, kamu telah menjadikannya
  rationale: Kata 'Namun' menandai pertentangan kuat, 'kamu' mempertahankan pronomina yang eksplisit dan menegaskan pihak yang dituduh, sedangkan 'telah menjadikan' mencerminkan keadaan kini sebagai hasil tindakan sebelumnya dalam bentuk perfek.
- source_word: σπήλαιον λῃστῶν
  choice: sarang para penyamun
  rationale: '''Sarang'' merupakan padanan idiomatis bagi tempat persembunyian, sedangkan ''penyamun'' mempertahankan gema Yeremia 7:11 dan dapat mencakup perampok atau bandit tanpa menetapkan nuansa politik tertentu.'
theological_decisions:
- issue: Cakupan universal kutipan nubuat
  choice: bagi segala bangsa
  alternative: bagi semua kaum; oleh segala bangsa
  rationale: Pilihan ini mempertahankan ἔθνη dan maksud rumah Allah yang melampaui Israel, tanpa menentukan lebih jauh hubungan teologis bangsa-bangsa dengan Bait Allah.
- issue: Daya tuduhan λῃστῶν
  choice: para penyamun
  alternative: para perampok; para bandit
  rationale: Konteks menggemakan Yeremia 7:11. 'Penyamun' mempertahankan citra gerombolan perampok yang menjadikan suatu tempat sebagai sarang, tetapi tidak memasukkan tafsiran bahwa mereka secara khusus adalah pemberontak politik.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Ia terus mengajar' menyatakan aspek berkelanjutan; bentuk sapaan 'kamu' mempertahankan tuduhan langsung tanpa meninggikan atau merendahkan register secara tidak perlu. Kapitalisasi 'Rumah-Ku' mengikuti rujukan langsung kepada Allah dalam kutipan.
