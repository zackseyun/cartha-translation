  to: Ia mengajar dan berkata kepada mereka, “Bukankah ada tertulis, ‘Rumah-Ku akan disebut rumah doa bagi segala bangsa’?[a] Namun, kamu telah menjadikannya sarang penyamun.”[b]
  rationale: Revisi terbatas pada penghilangan «terus», yang tidak diperlukan untuk menerjemahkan imperfek secara wajar dalam bahasa Indonesia, dan pada penyederhanaan «sarang para penyamun» menjadi kolokasi yang lebih idiomatis. Catatan a juga diringkas agar tetap menjelaskan gema Yesaya dan cakupan «segala bangsa» tanpa menyatakan lebih dari yang diperlukan oleh teks.
