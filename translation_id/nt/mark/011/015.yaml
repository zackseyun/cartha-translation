  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἱεροσόλυμα. καὶ ⸀εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς πωλοῦντας καὶ ⸀τοὺς ἀγοράζοντας ἐν τῷ ἱερῷ, καὶ τὰς τραπέζας τῶν κολλυβιστῶν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστερὰς κατέστρεψεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/015.yaml
  text: And they came to Jerusalem. And entering the temple[a], he began to drive out those who were selling and those who were buying in the temple, and he overturned the tables of the money changers and the seats of those who were selling doves.
translation:
  language: id
  text: Lalu mereka tiba di Yerusalem. Setelah Yesus masuk ke Bait Allah[a], Ia mulai mengusir orang-orang yang menjual dan orang-orang yang membeli di Bait Allah. Ia menjungkirbalikkan meja-meja para penukar uang dan tempat-tempat duduk para penjual merpati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelataran Bait Allah” atau “kompleks Bait Allah.” Istilah Yunani ini menunjuk pada kawasan Bait Allah secara luas, bukan khusus ruang kudus bagian dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: mereka tiba
  rationale: Kala kini historis dialihkan ke bentuk lampau naratif yang alami dalam bahasa Indonesia; “tiba” menyatakan sampainya mereka di Yerusalem.
- source_word: εἰσελθὼν
  choice: setelah masuk
  rationale: Partisip aoris secara wajar menunjukkan tindakan yang mendahului tindakan utama; bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: τὸ ἱερὸν / ἐν τῷ ἱερῷ
  choice: pelataran Bait Allah / di sana
  rationale: ἱερόν menunjuk pada kompleks Bait Allah, bukan ruang kudus bagian dalam. Dalam konteks kegiatan jual beli, “pelataran Bait Allah” menyampaikan lokasi secara tepat; pengulangan kedua diganti “di sana” agar alami tanpa mengubah rujukan.
- source_word: ἤρξατο ἐκβάλλειν
  choice: mulai mengusir
  rationale: Mempertahankan aspek permulaan tindakan dan daya paksa ἐκβάλλω dengan ungkapan Indonesia yang lugas.
- source_word: τοὺς πωλοῦντας καὶ τοὺς ἀγοράζοντας
  choice: orang-orang yang berjual beli
  rationale: Ungkapan idiomatis ini mencakup baik penjual maupun pembeli, mempertahankan kedua kelompok tanpa susunan yang kaku.
- source_word: κολλυβιστῶν
  choice: para penukar uang
  rationale: Padanan Indonesia yang baku dan jelas bagi orang-orang yang menukarkan mata uang atau koin.
- source_word: καθέδρας
  choice: tempat duduk
  rationale: Padanan umum yang tidak menentukan secara berlebihan apakah benda itu kursi atau bangku.
- source_word: περιστερὰς
  choice: burung merpati
  rationale: Padanan lazim dalam konteks persembahan kurban; tidak perlu membedakan secara artifisial antara dove dan pigeon dalam bahasa Indonesia.
- source_word: κατέστρεψεν
  choice: menjungkirbalikkan
  rationale: Mengungkapkan tindakan membalikkan meja dan tempat duduk secara kuat dan hidup.
theological_decisions:
- issue: Cakupan makna ἱερόν dalam kisah pembersihan Bait Allah
  choice: pelataran Bait Allah
  alternative: Bait Allah; kompleks Bait Allah
  rationale: Istilah Yunani menunjuk pada kawasan Bait Allah yang lebih luas, bukan khusus ruang kudus bagian dalam. Konteks para pedagang mendukung pelataran sebagai lokasi tindakan, sementara catatan kaki menjaga cakupan leksikal yang lebih luas.
- issue: Subjek tersirat pada εἰσελθὼν dan verba tunggal berikutnya
  choice: Yesus
  alternative: dia
  rationale: Bahasa Yunani membiarkan subjek dipahami dari konteks sebelumnya. Penyebutan “Yesus” dalam bahasa Indonesia menghindari kerancuan setelah subjek jamak “mereka” tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kalimat dipecah agar alur tindakan mudah diikuti, sementara hubungan naratif dan kekuatan tindakan tetap dipertahankan.
