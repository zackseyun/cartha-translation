id: MRK.11.31
reference: Mark 11:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀διελογίζοντο πρὸς ἑαυτοὺς λέγοντες· ⸂Τί εἴπωμεν;⸃ ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί ⸀οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/031.yaml
  text: And they were reasoning among themselves[a], saying, “What should we say? If we say, ‘From heaven,’ he will say, ‘Why then did you not believe him?’”
translation:
  language: id
  text: Mereka berunding di antara mereka sendiri sambil berkata, “Apa yang harus kita katakan? Jika kita mengatakan, ‘Dari surga,’[a] Dia akan berkata, ‘Kalau begitu, mengapa kalian tidak memercayai dia?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dari surga” adalah ungkapan penghormatan Yahudi yang berarti “dari Allah” atau “berasal dari kuasa ilahi.”
    reason: cultural_note
lexical_decisions:
- source_word: διελογίζοντο
  choice: berunding
  rationale: Bentuk imperfek menggambarkan pertimbangan yang sedang berlangsung; dalam konteks kelompok, ‘berunding’ menyampaikan unsur berpikir dan membahas bersama secara alami.
- source_word: πρὸς ἑαυτοὺς
  choice: satu sama lain
  rationale: Frasa ini menunjuk pada pembicaraan timbal balik di antara anggota kelompok, bukan sekadar pikiran batin masing-masing.
- source_word: λέγοντες
  choice: katanya
  rationale: Mengantar isi perundingan mereka dengan ringkas dan wajar dalam bahasa Indonesia.
- source_word: Τί εἴπωμεν;
  choice: Apa yang harus kita katakan?
  rationale: Subjungtif deliberatif menanyakan jawaban yang sebaiknya mereka berikan; pilihan ini mempertahankan nuansa pertimbangan tersebut.
- source_word: ἐὰν εἴπωμεν
  choice: Jika kita menjawab
  rationale: Walaupun secara harfiah berarti ‘jika kita mengatakan’, konteksnya adalah pemberian jawaban atas pertanyaan Yesus, sehingga ‘menjawab’ lebih alami tanpa mengubah makna.
- source_word: Ἐξ οὐρανοῦ
  choice: Dari surga
  rationale: Mempertahankan ungkapan sumber yang secara harfiah menyebut surga dan tidak menggantinya secara interpretatif dengan ‘dari Allah’.
- source_word: ἐρεῖ
  choice: Dia akan berkata
  rationale: Menerjemahkan bentuk futur λέγω secara langsung; pertanyaan dalam kutipan memperjelas fungsi ujarannya.
- source_word: Διὰ τί οὖν
  choice: Kalau begitu, mengapa
  rationale: Menyampaikan kesimpulan logis yang ditarik dari jawaban hipotetis dengan ungkapan Indonesia yang alami.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: kalian tidak memercayai dia
  rationale: πιστεύω dengan datif di sini berarti menerima atau mempercayai kesaksian Yohanes; ‘memercayai dia’ lebih tepat daripada ‘percaya kepada dia’, yang dapat menyiratkan penyerahan iman yang lebih luas.
theological_decisions:
- issue: Makna ‘dari surga’ sehubungan dengan baptisan atau wewenang Yohanes
  choice: Mempertahankan ungkapan ‘Dari surga’ dalam teks utama
  alternative: Dari Allah
  rationale: Ungkapan ini menyiratkan asal atau kewenangan ilahi. Mempertahankan ‘surga’ menjaga bentuk sumber dan daya retoris narasi tanpa memasukkan penafsiran langsung ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Pronomina ‘kalian’ dipakai untuk bentuk jamak yang ditujukan kepada kelompok; ‘Dia’ merujuk kepada Yesus, sedangkan ‘dia’ kepada Yohanes. Penanda catatan kaki ditempatkan sesudah keseluruhan ayat karena catatan menjelaskan ungkapan di dalam kutipan.
