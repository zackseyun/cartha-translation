revisions:
- from: Mereka berunding satu sama lain, katanya, “Apa yang harus kita katakan? Jika kita menjawab, ‘Dari surga,’ Dia akan berkata, ‘Kalau begitu, mengapa kalian tidak memercayai dia?’”[a]
  to: Mereka berunding di antara mereka sendiri sambil berkata, “Apa yang harus kita katakan? Jika kita mengatakan, ‘Dari surga,’[a] Dia akan berkata, ‘Kalau begitu, mengapa kalian tidak memercayai dia?’”
  rationale: Revisi memperbaiki keselarasan subjek dan kelancaran sintaksis Indonesia, mengembalikan pengulangan ‘mengatakan’ yang mencerminkan εἴπωμεν, dan memindahkan ancang catatan kaki ke ungkapan ‘Dari surga’ yang menjadi objek penjelasan. Makna, register naratif, serta ambiguitas dan idiom sumber tetap dipertahankan.
