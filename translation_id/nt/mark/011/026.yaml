  yaml_path: translation/nt/mark/011/026.yaml
  text: But[a] if you do not forgive, neither will your Father who is in heaven forgive your trespasses.
translation:
  language: id
  text: Namun,[a] jika kamu tidak mengampuni, Bapamu yang di surga juga tidak akan mengampuni pelanggaran-pelanggaranmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini tidak terdapat dalam naskah-naskah Yunani paling awal, termasuk Sinaiticus dan Vaticanus dari abad ke-4, maupun dalam versi-versi Koptik awal. Namun, ayat ini terdapat dalam tradisi mayoritas Bizantium, tradisi Latin, dan sebagian besar naskah-naskah berbahasa Siria. Kemungkinan ayat ini ditambahkan oleh para penyalin kemudian untuk menyelaraskannya dengan perkataan Yesus dalam Matius 6:15.
    reason: textual_critical
lexical_decisions:
- source_word: ἀφίημι
  choice: mengampuni
  rationale: Dalam konteks kesalahan antarmanusia dan pengampunan ilahi, “mengampuni” merupakan padanan Indonesia yang alami dan tepat untuk melepaskan orang dari kesalahannya.
- source_word: παράπτωμα
  choice: pelanggaran
  rationale: “Pelanggaran” mempertahankan nuansa tindakan menyimpang atau langkah yang salah dan tidak menyamakannya begitu saja dengan istilah Yunani yang lebih umum untuk dosa.
- source_word: οὐδέ
  choice: juga tidak
  rationale: 'Dalam susunan negatif ini, “juga tidak” secara alami menyampaikan hubungan timbal balik: jika para murid tidak mengampuni, Bapa pun tidak akan mengampuni.'
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: Bapamu yang di surga
  rationale: Padanan ini mempertahankan klausa penjelas “yang di surga” serta bentuk orang kedua jamak yang dalam bahasa Indonesia secara wajar dapat dinyatakan dengan “-mu” kepada kelompok pendengar.
theological_decisions:
- issue: Hubungan antara kesediaan manusia mengampuni dan pengampunan Bapa
  choice: Mempertahankan pernyataan bersyarat secara langsung tanpa menjelaskan mekanisme teologisnya
  alternative: Menambahkan bahwa pengampunan manusia adalah bukti atau syarat untuk menerima pengampunan ilahi
  rationale: Teks menyatakan hubungan tersebut dengan tegas tetapi tidak menerangkan mekanismenya; terjemahan tidak boleh menyelesaikan ketegangan teologis dengan tambahan tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Namun” dipilih untuk δέ sebagai penghubung pertentangan; tanda catatan ditempatkan segera sesudahnya. Bentuk “Bapamu” alami dalam bahasa Indonesia dan tetap mengacu kepada para pendengar secara kolektif.
