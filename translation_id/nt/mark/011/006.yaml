base_translation:
  language: en
  yaml_path: translation/nt/mark/011/006.yaml
  text: And they said to them just as Jesus had said[a], and they let them go.
translation:
  language: id
  text: Mereka berkata kepada orang-orang itu seperti yang telah Yesus katakan, lalu orang-orang itu membiarkan mereka pergi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengizinkan mereka” atau “melepaskan mereka.” Kata kerja Yunani ini dapat berarti membiarkan, mengizinkan, melepaskan, atau menyuruh pergi. Dalam konteks ini, orang-orang itu tidak lagi menghalangi para murid membawa anak keledai tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mereka pun
  rationale: Artikel yang berfungsi substantival menunjuk kembali kepada para murid. Partikel δέ diterjemahkan dengan 'pun' agar alur narasi tetap alami tanpa menonjolkan pertentangan.
- source_word: εἶπαν αὐτοῖς
  choice: menyampaikan kepada orang-orang itu
  rationale: Bentuk λέγω di sini menyatakan tindakan berbicara kepada para penanya. 'Menyampaikan' secara alami mengungkapkan bahwa para murid mengatakan jawaban yang telah diberikan Yesus.
- source_word: καθὼς εἶπεν ὁ Ἰησοῦς
  choice: apa yang telah Yesus katakan
  rationale: καθώς menunjukkan kesesuaian antara jawaban para murid dan perkataan Yesus sebelumnya. Bentuk 'telah ... katakan' menandai bahwa perkataan Yesus mendahului jawaban mereka.
- source_word: ἀφῆκαν αὐτούς
  choice: orang-orang itu membiarkan mereka pergi
  rationale: ἀφίημι dapat berarti membiarkan, mengizinkan, melepaskan, atau menyuruh pergi. Dalam konteks ini, orang-orang yang bertanya tidak lagi menghalangi para murid membawa anak keledai itu.
