id: MRK.11.7
reference: Mark 11:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀φέρουσιν τὸν πῶλον πρὸς τὸν Ἰησοῦν, καὶ ⸀ἐπιβάλλουσιν αὐτῷ τὰ ἱμάτια αὐτῶν, καὶ ἐκάθισεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/007.yaml
  text: And they brought the colt to Jesus, and they threw their cloaks on it, and he sat on it.
translation:
  language: id
  text: Mereka membawa anak keledai itu kepada Yesus, lalu menghamparkan jubah-jubah mereka di atasnya, dan Yesus duduk di atasnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶλον
  choice: anak keledai
  rationale: Dalam konteks dekat (Markus 11:2), πῶλος merujuk pada keledai muda; pilihan ini alami dan jelas dalam bahasa Indonesia.
- source_word: ἐπιβάλλουσιν
  choice: menghamparkan ... di atasnya
  rationale: Secara harfiah berarti menaruh atau melemparkan ke atas; dalam konteks jubah yang dijadikan alas duduk, 'menghamparkan' menyampaikan tindakan itu secara alami tanpa mengubah fungsinya.
- source_word: ἱμάτια
  choice: jubah-jubah
  rationale: Merujuk pada pakaian luar; 'jubah' merupakan padanan ringkas dan lazim dalam konteks ini.
- source_word: ἐκάθισεν
  choice: duduk
  rationale: Padanan langsung dan alami bagi tindakan Yesus menaiki lalu mengambil posisi duduk pada anak keledai.
theological_decisions:
- issue: Subjek tersirat pada ἐκάθισεν
  choice: Yesus duduk
  alternative: ia duduk
  rationale: Bahasa Yunani mengandalkan subjek tersirat, tetapi penyebutan 'Yesus' dalam bahasa Indonesia menghindari kemungkinan rujukan yang kabur tanpa menambahkan tafsir teologis.
- issue: Rujukan kata ganti αὐτῷ dan αὐτόν
  choice: di atasnya
  alternative: di atas anak keledai itu
  rationale: Keduanya secara alami merujuk kepada anak keledai; kata ganti mempertahankan keringkasan sumber dan tidak menimbulkan ambiguitas berarti dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur tiga tindakan berurutan dipertahankan, dengan 'lalu' untuk alur narasi yang alami.
source_grounding:
  english_pob_role: consult_only
