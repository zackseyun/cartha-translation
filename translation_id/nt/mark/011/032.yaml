id: MRK.11.32
reference: Mark 11:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ εἴπωμεν· Ἐξ ἀνθρώπων;— ἐφοβοῦντο τὸν ⸀ὄχλον, ἅπαντες γὰρ εἶχον τὸν Ἰωάννην ⸂ὄντως ὅτι⸃ προφήτης ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/032.yaml
  text: But if we say[a], ‘From men’?”—they were afraid of the crowd[b], for everyone held that John truly was a prophet.
translation:
  language: id
  text: Namun, jika kita berkata, ‘Dari manusia’?”—mereka takut kepada orang banyak, sebab semua orang menganggap bahwa Yohanes benar-benar seorang nabi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ εἴπωμεν
  choice: Namun, jika kita berkata
  rationale: Mempertahankan kontras dan alur pertimbangan bersyarat dalam bahasa Indonesia yang wajar.
- source_word: Ἐξ ἀνθρώπων
  choice: Dari manusia
  rationale: Mencerminkan ungkapan sumber secara dekat dan mempertahankan kontras tersirat dengan sumber ilahi tanpa menambahkan penafsiran.
- source_word: ἐφοβοῦντο τὸν ὄχλον
  choice: mereka takut kepada orang banyak
  rationale: Mengungkapkan ketakutan situasional yang berkelanjutan; 'orang banyak' adalah padanan naratif yang alami untuk ὄχλος.
- source_word: ἅπαντες γὰρ
  choice: sebab semua orang
  rationale: Menjaga hubungan alasan yang diperkenalkan oleh γάρ dan makna menyeluruh ἅπαντες.
- source_word: εἶχον τὸν Ἰωάννην ὄντως ὅτι προφήτης ἦν
  choice: menganggap bahwa Yohanes benar-benar seorang nabi
  rationale: Menggunakan arti εἶχον sebagai memegang penilaian dan mempertahankan daya penegasan ὄντως, sambil tetap menempatkan penilaian itu dalam pandangan orang banyak.
theological_decisions:
- issue: Sumber baptisan atau wewenang Yohanes dalam frasa Ἐξ ἀνθρώπων
  choice: Dari manusia
  alternative: Berasal dari manusia
  rationale: Pilihan utama dekat dengan bentuk Yunani dan tidak secara eksplisit menambahkan kata 'asal' atau 'wewenang', meskipun makna sumber tersirat oleh konteks.
- issue: Status kenabian Yohanes dalam penilaian orang banyak
  choice: semua orang menganggap bahwa Yohanes benar-benar seorang nabi
  alternative: semua orang menganggap Yohanes memang seorang nabi
  rationale: Terjemahan ini mempertahankan penegasan ὄντως dan menunjukkan bahwa klausa tersebut melaporkan keyakinan orang banyak, bukan menyisipkan pernyataan teologis baru dari narator.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Namun' menandai pertentangan dengan jelas; 'orang banyak' sesuai dengan register narasi Alkitab yang tetap mudah dipahami. Tidak diperlukan catatan kaki karena alternatif leksikal dapat dipertanggungjawabkan tanpa adanya ambiguitas penting yang hilang dari teks utama.
