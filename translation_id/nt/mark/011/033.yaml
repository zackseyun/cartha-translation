base_translation:
  language: en
  yaml_path: translation/nt/mark/011/033.yaml
  text: And answering Jesus[a], they say, “We do not know.” And Jesus says to them, “Neither do I tell you by what authority I do these things.”
translation:
  language: id
  text: Mereka menjawab Yesus, “Kami tidak tahu.” Yesus berkata kepada mereka, “Aku juga tidak memberi tahu kalian dengan wewenang apa Aku melakukan hal-hal ini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: menjawab
  rationale: Partisipel ini memperkenalkan tanggapan mereka; bahasa Indonesia alami mengungkapkannya dengan verba utama “menjawab” tanpa mengubah hubungan logisnya.
- source_word: λέγουσιν / λέγει / λέγω
  choice: berkata / memberi tahu
  rationale: “Berkata” sesuai untuk memperkenalkan ujaran langsung, sedangkan “memberi tahu” lebih alami sebelum pertanyaan tak langsung pada klausa terakhir. Kala kini historis Yunani tidak perlu dipertahankan secara kaku karena bentuk verba Indonesia tidak menandai kala.
- source_word: Οὐκ οἴδαμεν
  choice: Kami tidak tahu
  rationale: Padanan langsung dan wajar untuk bentuk perfek Yunani yang bermakna keadaan kini.
- source_word: Οὐδὲ ἐγὼ
  choice: Aku pun tidak
  rationale: Mempertahankan kesejajaran retoris dengan jawaban negatif para penanya dan memberi penekanan pada ἐγώ.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: berdasarkan wewenang apa
  rationale: Mengungkapkan dasar atau legitimasi tindakan Yesus secara idiomatis, sambil mempertahankan pertanyaan mengenai sumber atau landasan wewenang.
- source_word: ταῦτα
  choice: semua ini
  rationale: Ungkapan Indonesia yang alami dan tetap menunjuk secara kolektif pada berbagai tindakan yang baru dibicarakan.
- source_word: ποιῶ
  choice: Aku melakukan
  rationale: Padanan langsung yang mempertahankan aspek tindakan kini tanpa mempersempit rujukannya.
