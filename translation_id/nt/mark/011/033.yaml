- from: Mereka menjawab Yesus, “Kami tidak tahu.” Lalu Yesus berkata kepada mereka, “Aku pun tidak memberi tahu kalian berdasarkan wewenang apa[a] Aku melakukan semua ini.”
  to: Mereka menjawab Yesus, “Kami tidak tahu.” Yesus berkata kepada mereka, “Aku juga tidak memberi tahu kalian dengan wewenang apa Aku melakukan hal-hal ini.”
  rationale: Revisi menghindari penambahan nuansa temporal, mempertahankan rujukan jamak dari ταῦτα, dan memakai padanan Indonesia yang lebih langsung untuk frasa tentang wewenang. Tidak ada perubahan makna teologis atau penyelesaian atas ambiguitas yang dipersengketakan.
