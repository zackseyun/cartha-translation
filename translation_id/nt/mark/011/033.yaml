review_pass:
  verdict: revise
  source_fidelity: Makna pokok terwakili, termasuk penolakan Yesus yang sejajar dengan jawaban para pemimpin. Namun, «semua ini» sedikit menggeneralisasi demonstratif jamak ταῦτα; «hal-hal ini» mempertahankan bentuk jamaknya dengan lebih dekat. «Lalu» juga memberi nuansa urutan waktu yang tidak perlu ditekankan oleh καί.
  naturalness: Teks revisi tetap memakai bahasa Indonesia baku modern, lugas, dan alami. Penghilangan «Lalu» membuat alur dialog lebih langsung, sementara «dengan wewenang apa» adalah susunan yang sangat idiomatis untuk pertanyaan ini.
  terminology: «Wewenang» tepat untuk ἐξουσία dalam konteks otoritas atau legitimasi bertindak. Pronomina «Aku» dan «kalian» konsisten dan dapat diterima dalam register naratif modern.
  issues:
  - severity: low
    issue: «Lalu» menerjemahkan καί secara lebih spesifik sebagai kelanjutan temporal.
    rationale: Konjungsi Yunani ini hanya menghubungkan ujaran berikutnya; nuansa temporal eksplisit tidak diperlukan.
  - severity: low
    issue: «semua ini» lebih luas daripada ταῦτα.
    rationale: Demonstratif netral jamak lebih dekat diterjemahkan «hal-hal ini», yang mempertahankan rujukan jamak kepada tindakan Yesus.
  - severity: low
    issue: Pilihan utama «berdasarkan wewenang apa» kurang idiomatis dibandingkan «dengan wewenang apa» dalam pertanyaan langsung ini.
    rationale: Keduanya mungkin, tetapi «dengan wewenang apa» secara langsung menyatakan otoritas yang digunakan untuk melakukan tindakan, sesuai ἐν ποίᾳ ἐξουσίᾳ.
  revised_text: Mereka menjawab Yesus, “Kami tidak tahu.” Yesus berkata kepada mereka, “Aku juga tidak memberi tahu kalian dengan wewenang apa Aku melakukan hal-hal ini.”
