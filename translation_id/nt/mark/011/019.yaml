  text: Καὶ ⸀ὅταν ὀψὲ ἐγένετο, ⸀ἐξεπορεύοντο ἔξω τῆς πόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/019.yaml
  text: And whenever evening came, they would go out of the city.
translation:
  language: id
  text: Setiap kali hari mulai petang, mereka keluar dari kota.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: setiap kali
  rationale: Bersama verba imperfek ἐξεπορεύοντο, konjungsi ini paling wajar menyatakan tindakan yang berulang atau menjadi kebiasaan, bukan hanya satu kejadian.
- source_word: ὀψὲ ἐγένετο
  choice: hari mulai malam
  rationale: Ungkapan ini secara idiomatis berarti bahwa waktu telah menjadi larut atau petang. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan nuansa datangnya waktu malam.
- source_word: ἐξεπορεύοντο
  choice: mereka keluar
  rationale: Bentuk imperfek dalam konteks ini menyatakan tindakan berulang. Nuansa kebiasaan sudah disampaikan oleh 'setiap kali', sehingga bentuk sederhana 'keluar' paling alami dan tidak berlebihan.
- source_word: ἔξω τῆς πόλεως
  choice: keluar dari kota
  rationale: Pilihan ini mempertahankan unsur gerak meninggalkan kota yang terkandung dalam verba dan frasa Yunani.
- source_word: πόλεως
  choice: kota
  rationale: Teks Yunani menyebut 'kota' tanpa menamainya. Walaupun konteks menunjuk kepada Yerusalem, nama itu tidak ditambahkan ke dalam terjemahan.
theological_decisions: []
