  naturalness: “Berdiri sambil berdoa” lebih alami sekaligus lebih setia pada struktur Yunani. Selebihnya, ragam baku modern dan sapaan jamak “kalian” sesuai.
  terminology: '“Ampunilah,” “Bapa,” dan “pelanggaran-pelanggaran” sesuai konteks. Catatan kaki b dalam draf tidak tepat karena alternatif “pelanggaran-pelanggaran terhadap kalian” membalik arah makna: παραπτώματα ὑμῶν berarti pelanggaran yang dilakukan oleh kalian, bukan terhadap kalian. Catatan itu dihapus karena tidak diperlukan.'
