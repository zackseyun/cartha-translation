  text: καὶ ὅταν ⸀στήκετε προσευχόμενοι, ἀφίετε εἴ τι ἔχετε κατά τινος, ἵνα καὶ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφῇ ὑμῖν τὰ παραπτώματα ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/025.yaml
  text: And whenever you stand praying[a], forgive, if you have anything against anyone[b], so that your Father who is in the heavens may also forgive you your trespasses.
translation:
  language: id
  text: Dan setiap kali kalian berdiri sambil berdoa, ampunilah jika kalian menyimpan sesuatu terhadap siapa pun, supaya Bapa kalian yang di surga[a] juga mengampuni pelanggaran-pelanggaran kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di surga-surga”; kata Yunani yang digunakan berbentuk jamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήκετε προσευχόμενοι
  choice: berdiri untuk berdoa
  rationale: Mempertahankan gambaran konkret tentang sikap berdiri sambil menyampaikan tindakan berdoa yang berlangsung bersamaan secara alami dalam bahasa Indonesia.
- source_word: ἀφίετε
  choice: ampunilah
  rationale: Dalam konteks hubungan antarmanusia, kata ini berarti melepaskan kesalahan atau mengampuni; bentuk imperatif dipertahankan.
- source_word: εἴ τι ἔχετε κατά τινος
  choice: jika kalian menyimpan sesuatu terhadap siapa pun
  rationale: Ungkapan ini mempertahankan keluasan τι dan τινος serta menyampaikan adanya keberatan atau ganjalan terhadap seseorang tanpa menentukan jenisnya.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: Bapa kalian yang di surga
  rationale: Bentuk ini alami dalam bahasa Indonesia; catatan kaki mencatat bahwa teks Yunani memakai bentuk jamak untuk 'surga'.
- source_word: ἀφῇ
  choice: juga mengampuni
  rationale: Kata 'juga' mempertahankan καί, sedangkan hubungan tujuan yang dibentuk oleh ἵνα dinyatakan dengan 'supaya'.
- source_word: παραπτώματα
  choice: pelanggaran-pelanggaran
  rationale: Pilihan ini menyampaikan kesalahan atau tindakan menyimpang dan tetap membedakannya dari istilah umum untuk dosa.
theological_decisions:
- issue: Hubungan antara pengampunan manusia dan pengampunan ilahi
  choice: 'Klausa diterjemahkan langsung sebagai tujuan: ''supaya ... juga mengampuni''.'
  alternative: Melemahkan hubungan itu menjadi sekadar bukti atau akibat tidak langsung.
  rationale: ἵνα ... ἀφῇ secara tekstual menghubungkan perintah untuk mengampuni orang lain dengan pengampunan Bapa. Terjemahan mempertahankan ketegangan teologis ini tanpa menjelaskannya melalui sistem doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' untuk mempertahankan bentuk orang kedua jamak. Nada dibuat lugas dan bermartabat. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
