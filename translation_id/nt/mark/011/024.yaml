  text: διὰ τοῦτο λέγω ὑμῖν, πάντα ὅσα ⸂προσεύχεσθε καὶ αἰτεῖσθε⸃, πιστεύετε ὅτι ⸀ἐλάβετε, καὶ ἔσται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/024.yaml
  text: For this reason I tell you[a], whatever you pray and ask for, believe that you have received it[b], and it will be yours.
translation:
  language: id
  text: 'Karena itu Aku berkata kepada kalian: Apa pun yang kalian doakan dan minta, percayalah bahwa kalian telah menerimanya[a], dan itu akan menjadi milik kalian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah atau pembacaan dipahami atau diterjemahkan sebagai “bahwa kalian menerimanya,” bukan “bahwa kalian telah menerimanya.” Teks Yunani yang dipakai di sini berbunyi “kalian telah menerima,” yang mempertahankan tindakan yang dipandang sudah selesai.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Ungkapan ini secara alami menghubungkan perkataan tersebut dengan ajaran sebelumnya mengenai iman dan doa serta mempertahankan daya simpulannya.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mempertahankan sapaan langsung dan wibawa pribadi Yesus dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: πάντα ὅσα
  choice: Apa pun
  rationale: Menyampaikan cakupan luas ungkapan Yunani tanpa membuat susunan bahasa Indonesia terasa berat.
- source_word: προσεύχεσθε καὶ αἰτεῖσθε
  choice: kamu doakan dan minta
  rationale: Mempertahankan kedua tindakan yang dibedakan dalam bahasa Yunani—berdoa dan memohon—sekaligus memakai satu objek bersama secara ringkas.
- source_word: πιστεύετε
  choice: percayalah
  rationale: Bentuk perintah dipertahankan dan secara alami mengantar klausa berisi hal yang harus dipercayai.
- source_word: ὅτι ἐλάβετε
  choice: bahwa kamu telah menerimanya
  rationale: Kata 'telah' mempertahankan daya tindakan yang dipandang sudah selesai dalam bentuk aoris Yunani dan menjaga urutan waktu yang mencolok dalam ayat ini.
- source_word: καὶ ἔσται ὑμῖν
  choice: dan itu akan menjadi milikmu
  rationale: Menyatakan hasil pada masa mendatang secara alami. Kata ganti tunggal kolektif merujuk pada 'apa pun' tanpa menghapus keluasan acuannya.
theological_decisions:
- issue: Hubungan waktu antara iman, penerimaan, dan terwujudnya jawaban doa
  choice: 'Mempertahankan urutan paradoksal: percaya bahwa sudah menerimanya, lalu itu akan menjadi milikmu.'
  alternative: Percayalah bahwa kamu menerimanya, lalu itu akan menjadi milikmu.
  rationale: Teks SBLGNT yang diberikan memakai ἐλάβετε, bentuk aoris. Terjemahan tidak meratakan ketegangan antara penerimaan yang dipandang telah selesai dan hasil yang masih dinyatakan pada masa mendatang, serta tidak memasukkan sistem doktrinal tertentu mengenai doa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'kamu', sesuai bentuk Yunani. Susunannya dibuat langsung dan mudah dipahami, tetapi ketegangan waktu dalam teks sumber tetap dipertahankan.
