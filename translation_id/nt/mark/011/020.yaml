base_translation:
  language: en
  yaml_path: translation/nt/mark/011/020.yaml
  text: And as they were passing by early in the morning[a], they saw the fig tree withered from the roots.
translation:
  language: id
  text: Pagi-pagi sekali, ketika mereka lewat, mereka melihat bahwa pohon ara itu telah mengering sampai ke akar-akarnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: ketika mereka lewat
  rationale: Partisipel kini menyatakan tindakan latar yang berlangsung bersamaan dengan verba utama; bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan waktunya.
- source_word: πρωῒ
  choice: pagi-pagi sekali
  rationale: Adverbia ini menunjuk waktu pagi yang dini; ungkapan ini mempertahankan penekanan pada awalnya waktu pagi.
- source_word: εἶδον
  choice: mereka melihat
  rationale: Padanan langsung bagi verba persepsi ini tanpa menambahkan gagasan bahwa mereka baru menyadari atau memperhatikan.
- source_word: συκῆν
  choice: pohon ara itu
  rationale: Padanan baku bagi συκῆ; bentuk definit dipertahankan dengan 'itu' karena pohon tersebut sudah dikenal dari konteks sebelumnya.
- source_word: ἐξηραμμένην
  choice: telah mengering
  rationale: Partisipel perfek pasif menggambarkan keadaan hasil dari proses sebelumnya. 'Telah mengering' alami untuk pohon dan menyampaikan keadaan yang sudah terjadi.
- source_word: ἐκ ῥιζῶν
  choice: sampai ke akar-akarnya
  rationale: Dalam konteks keadaan pohon, ungkapan ini secara alami menyatakan bahwa kekeringan menjangkau seluruh pohon hingga akarnya, tanpa mengharuskan arah proses tertentu.
