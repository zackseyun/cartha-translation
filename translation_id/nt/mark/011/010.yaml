  yaml_path: translation/nt/mark/011/010.yaml
  text: Blessed is the coming kingdom of our father David! Hosanna in the highest![a]
translation:
  language: id
  text: Diberkatilah kerajaan Daud, leluhur kita, yang akan datang! Hosana di tempat yang mahatinggi![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosana” dapat mencerminkan permohonan “Selamatkanlah kiranya” atau “Selamatkanlah sekarang”, meskipun di sini kata itu berfungsi sebagai seruan pujian dalam ibadah.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογημένη
  choice: Diberkatilah
  rationale: Mempertahankan bentuk seruan liturgis dan nuansa ucapan berkat; lebih tepat dalam konteks ini daripada sekadar 'Terpujilah'.
- source_word: ἡ ἐρχομένη βασιλεία
  choice: kerajaan yang akan datang
  rationale: Menyampaikan konstruksi artikel-partisipel secara alami dalam bahasa Indonesia serta mempertahankan gagasan kedatangan tanpa menjadikannya istilah eskatologis yang terlalu baku.
- source_word: βασιλεία
  choice: kerajaan
  rationale: Ungkapan ini paling wajar dalam konteks dinasti Daud dan dapat mencakup baik ranah kerajaan maupun pemerintahan rajawi.
- source_word: τοῦ πατρὸς ἡμῶν Δαυίδ
  choice: kerajaan Daud, leluhur kita
  rationale: '''Leluhur'' mengungkapkan πατήρ sebagai sebutan penghormatan bagi nenek moyang, bukan ayah biologis langsung; pengulangan ''kerajaan'' memperjelas hubungan genitif secara alami.'
- source_word: Ὡσαννὰ
  choice: Hosana
  rationale: Mempertahankan seruan liturgis yang telah diserap ke dalam pemakaian Kristen Indonesia; makna permohonan yang mendasarinya dijelaskan dalam catatan kaki.
- source_word: ἐν τοῖς ὑψίστοις
  choice: di tempat yang mahatinggi
  rationale: Menyampaikan idiom tentang ranah tertinggi secara ringkas tanpa secara eksplisit menambahkan 'surga', yang tidak tertulis dalam bahasa Yunani.
theological_decisions:
- issue: Sifat seruan tentang kerajaan Daud
  choice: Menerjemahkan secara langsung sebagai kerajaan Daud yang akan datang tanpa menambahkan kata 'Mesias'.
  alternative: Diberkatilah kerajaan Mesias dari Daud yang akan datang.
  rationale: Konteks menyiratkan pengharapan mesianis, tetapi teks Yunani hanya menyebut kerajaan Daud yang datang; terjemahan mempertahankan ketegangan dan alusi tersebut tanpa memperluasnya secara doktrinal.
- issue: Hubungan Daud dengan para penyeru
  choice: Daud, leluhur kita
  alternative: Daud, bapa kita
  rationale: Dalam bahasa Indonesia modern, 'leluhur' lebih jelas menyatakan hubungan nenek moyang dan menghindari kesan bahwa Daud adalah ayah langsung mereka, sambil mempertahankan penghormatan komunal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'Diberkatilah' dan 'Hosana' mempertahankan corak aklamasi liturgis, sedangkan 'leluhur kita' membuat hubungan dengan Daud jelas bagi pembaca umum.
