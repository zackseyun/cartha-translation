  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτῇ· Μηκέτι ⸂εἰς τὸν αἰῶνα ἐκ σοῦ⸃ μηδεὶς καρπὸν φάγοι. καὶ ἤκουον οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/014.yaml
  text: And answering[a], he said to it[c][b], “May no one ever eat fruit from you again.” And his disciples were listening.
translation:
  language: id
  text: Lalu Ia menjawab[a] dan berkata kepada pohon itu, “Semoga tidak seorang pun pernah lagi makan buah darimu.”[b] Murid-murid-Nya mendengar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Setelah menjawab, Ia berkata kepadanya.” Kata “menjawab” merupakan ungkapan naratif yang lazim dalam bahasa Yunani, sekalipun tidak dicatat adanya ucapan sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Semoga tidak seorang pun makan buah darimu untuk selama-lamanya.” Secara harfiah, bahasa Yunani berbunyi “ke dalam zaman.”
    reason: alternative_reading
  - marker: c
    text: Bentuk imperfek Yunani juga dapat diterjemahkan, “Murid-murid-Nya sedang mendengarkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: menanggapi
  rationale: Partisip ini secara harfiah menyatakan tindakan menjawab atau menanggapi. Walaupun tidak ada ucapan sebelumnya, bentuk ini merupakan ungkapan naratif Yunani yang lazim; terjemahan mempertahankan nuansa tersebut tanpa menyiratkan bahwa pohon itu benar-benar berbicara.
- source_word: αὐτῇ
  choice: kepada pohon itu
  rationale: Pronomina feminin ini merujuk kepada pohon ara yang disebut sebelumnya. Penyebutan ulang acuannya lebih jelas dan alami dalam bahasa Indonesia daripada memakai pronomina bergender.
- source_word: Μηκέτι
  choice: tidak ... pernah lagi
  rationale: Bersama εἰς τὸν αἰῶνα, kata ini menegaskan bahwa keadaan sebelumnya tidak akan terjadi lagi untuk seterusnya.
- source_word: εἰς τὸν αἰῶνα
  choice: pernah
  rationale: Ungkapan harfiahnya adalah 'ke dalam zaman' dan secara idiomatis berarti 'untuk selama-lamanya' atau 'selamanya'. Dalam susunan 'tidak ... pernah lagi', makna keberlanjutan tanpa batas tersampaikan secara alami.
- source_word: ἐκ σοῦ
  choice: darimu
  rationale: Bentuk orang kedua tunggal dipertahankan agar sapaan langsung Yesus kepada pohon itu tetap hidup.
- source_word: μηδεὶς
  choice: tidak seorang pun
  rationale: Padanan baku dan jelas bagi subjek negatif tak tentu dalam ucapan kutukan atau harapan ini.
- source_word: καρπὸν
  choice: buah
  rationale: Bentuk tunggal Yunani bersifat generik; 'buah' merupakan padanan alami dalam bahasa Indonesia.
- source_word: φάγοι
  choice: semoga ... makan
  rationale: Optatif aoris mengungkapkan kehendak atau ucapan kutukan, bukan sekadar ramalan. 'Semoga' mempertahankan daya volitifnya.
- source_word: ἤκουον
  choice: sedang mendengarkan
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung. Padanan ini mempertahankan aspek duratifnya, sedangkan 'mendengar' dapat dipahami sebagai kejadian sesaat.
- source_word: μαθηταὶ αὐτοῦ
  choice: murid-murid-Nya
  rationale: Padanan idiomatis dan baku untuk frasa posesif Yunani.
theological_decisions:
- issue: Sifat ucapan Yesus kepada pohon ara
  choice: 'Ucapan diterjemahkan sebagai kehendak atau kutukan: “Semoga tidak seorang pun pernah lagi makan buah darimu.”'
  alternative: 'Menerjemahkannya sebagai ramalan datar: “Tidak seorang pun akan pernah lagi makan buah darimu.”'
  rationale: φάγοι berbentuk optatif dan menyampaikan kehendak atau ucapan penghukuman, bukan indikatif masa depan. Terjemahan mempertahankan ketegangan bahwa Yesus menjatuhkan penghakiman atas pohon itu.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan ucapan dibuat alami tanpa menghilangkan bentuk optatif, sapaan langsung kepada pohon, ungkapan keberlangsungan tanpa batas, atau aspek imperfek pada tindakan para murid.
