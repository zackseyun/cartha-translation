  to: Lalu Ia menjawab[a] dan berkata kepada pohon itu, “Semoga tidak seorang pun pernah lagi makan buah darimu.”[b] Murid-murid-Nya mendengar.[c]
  rationale: Revisi mengganti "menanggapi" dengan "menjawab" untuk mencerminkan ἀποκριθεὶς secara lebih langsung dan alami, sambil mempertahankan penjelasan bahwa ini adalah idiom naratif. Klausa terakhir disederhanakan menjadi "Murid-murid-Nya mendengar" agar sesuai dengan penggunaan ἀκούω dalam narasi Indonesia; nuansa duratif imperfek tetap dicatat dalam catatan kaki. Penanda catatan kaki dipindahkan ke unsur yang dijelaskannya.
