  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Pengulangan 'menghamparkan' mempertahankan hubungan tindakan yang tersirat dalam bahasa Yunani; penanda catatan kaki ditempatkan tepat setelah ungkapan yang dijelaskan.
