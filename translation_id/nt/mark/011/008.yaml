  text: And many spread their cloaks on the road, and others spread leafy branches cut from the fields.
translation:
  language: id
  text: Banyak orang menghamparkan pakaian luar mereka di jalan, sedangkan yang lain menebarkan dedaunan atau ranting[a] yang mereka potong dari ladang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamparan vegetasi yang dipotong.” Kata Yunani ini dapat menunjuk secara luas pada dedaunan, ranting, atau vegetasi potong, bukan secara khusus pada daun palem.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: banyak orang
  rationale: Adjektiva ini berfungsi secara substantival dan menunjuk kepada sejumlah besar orang; 'banyak orang' alami dan jelas dalam bahasa Indonesia.
- source_word: ἱμάτια
  choice: jubah
  rationale: Dalam konteks ini kata tersebut menunjuk pada pakaian luar yang dapat dilepas dan dihamparkan; 'jubah' ringkas dan mudah dipahami.
- source_word: ἔστρωσαν
  choice: menghamparkan
  rationale: Kata kerja ini menyatakan tindakan membentangkan atau menebarkan sesuatu pada suatu permukaan; 'menghamparkan' cocok bagi jubah maupun ranting.
- source_word: εἰς τὴν ὁδόν
  choice: di jalan
  rationale: Dengan verba στρώννυμι, frasa ini secara idiomatis menyatakan penempatan pada permukaan jalan.
- source_word: ἄλλοι δὲ
  choice: sedangkan yang lain
  rationale: δέ menandai peralihan dan kontras ringan antara dua kelompok tanpa menyiratkan pertentangan kuat.
- source_word: στιβάδας
  choice: ranting-ranting berdaun
  rationale: στιβάς dapat menunjuk pada timbunan atau lapisan dedaunan, ranting, atau tumbuhan potong. Pilihan ini menyampaikan gambaran vegetasi yang dihamparkan tanpa secara keliru menyebutnya daun palem.
- source_word: κόψαντες
  choice: yang mereka potong
  rationale: Partisip aoris menyatakan tindakan memotong yang mendahului penghamparan; klausa relatif ini alami dalam bahasa Indonesia.
- source_word: ἐκ τῶν ἀγρῶν
  choice: dari ladang
  rationale: ἀγροί dapat berarti ladang atau daerah terbuka; 'dari ladang' merupakan padanan langsung yang sesuai dengan konteks pengambilan tumbuhan.
