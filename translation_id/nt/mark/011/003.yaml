source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ· Τί ποιεῖτε τοῦτο; εἴπατε ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει· καὶ ⸀εὐθὺς αὐτὸν ἀποστέλλει ⸀πάλιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/003.yaml
  text: And if anyone says to you[a], ‘Why are you doing this?’ say[b], ‘The Lord has need of it,’ and he will send it back here immediately.
translation:
  language: id
  text: Jika ada orang berkata kepada kalian, “Mengapa kalian melakukan itu?” katakanlah, “Tuhan[a] memerlukannya,” lalu ia akan segera mengirimkannya kembali ke sini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tuan”. Kata Yunani κύριος dapat berarti “Tuhan” atau “tuan”; di sini diterjemahkan “Tuhan” sesuai dengan konteks Injil.
    reason: alternative_reading
  - marker: b
    text: Atau, “lalu ia segera mengirimkannya kembali ke sini.” Kata Yunani ἀποστέλλει berbentuk kala kini, tetapi dalam konteks ini dapat dipahami dengan makna yang akan terjadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐάν τις ὑμῖν εἴπῃ
  choice: Jika ada orang berkata kepada kalian
  rationale: ἐάν dengan bentuk subjungtif menyatakan syarat yang terbuka dan mungkin terjadi. Ungkapan ini alami dalam bahasa Indonesia; καί tidak perlu diterjemahkan secara tersendiri pada awal kalimat.
- source_word: Τί ποιεῖτε τοῦτο;
  choice: Mengapa kalian melakukan itu?
  rationale: Secara leksikal τί berarti “apa”, tetapi dalam konteks ini pertanyaan tersebut menantang alasan tindakan para murid. “Mengapa kalian melakukan itu?” menyampaikan fungsi idiomatisnya dengan jelas.
- source_word: εἴπατε
  choice: katakanlah
  rationale: Bentuk imperatif aoris jamak ini diterjemahkan sebagai perintah langsung kepada para murid.
- source_word: ὅτι
  choice: kutipan langsung tanpa kata penghubung tersendiri
  rationale: ὅτι memperkenalkan isi perkataan. Dalam bahasa Indonesia, tanda kutip sudah menyatakan fungsi itu sehingga “bahwa” tidak diperlukan.
- source_word: Ὁ κύριος
  choice: Tuhan
  rationale: κύριος dapat berarti “Tuhan” atau “tuan”. Dalam konteks Injil Markus, sebutan ini paling wajar dipahami sebagai gelar bagi Yesus, tetapi kemungkinan leksikal “tuan” dicatat dalam catatan kaki.
- source_word: αὐτοῦ χρείαν ἔχει
  choice: memerlukannya
  rationale: Ungkapan Yunani secara harfiah berarti “mempunyai kebutuhan akan dia/itu”. “Memerlukannya” alami, jelas, dan mempertahankan rujukan kepada anak keledai.
- source_word: εὐθὺς
  choice: segera
  rationale: Kata ini menyatakan tindakan tanpa penundaan dan mempertahankan nuansa mendesak yang khas dalam Markus.
- source_word: ἀποστέλλει
  choice: akan mengirimkannya
  rationale: Walaupun bentuk Yunaninya adalah kala kini, konteks bersyarat mendukung pengertian futuristik. Bentuk “akan mengirimkannya” paling alami dalam bahasa Indonesia, sementara bentuk kini dicatat sebagai alternatif.
- source_word: πάλιν ὧδε
  choice: kembali ke sini
  rationale: Dalam konteks pengembalian anak keledai, πάλιν paling alami diterjemahkan “kembali”, sedangkan ὧδε berarti “ke sini”.
theological_decisions:
- issue: Makna dan rujukan κύριος
  choice: Tuhan, sebagai gelar yang merujuk kepada Yesus
  alternative: tuan, dalam arti pemilik atau orang yang berwenang
  rationale: Konteks narasi menunjukkan bahwa Yesus memberikan perintah ini dan menyebut diri-Nya dengan κύριος. Terjemahan “Tuhan” mempertahankan bobot gelar tersebut tanpa menambahkan klaim teologis yang tidak dinyatakan oleh ayat ini.
- issue: Subjek tersirat dalam ἀποστέλλει
  choice: ia, tanpa memperjelas identitas subjek di dalam teks utama
  alternative: orang itu akan mengirimkannya; atau Tuhan akan mengirimkannya
  rationale: Bahasa Yunani tidak menyebutkan subjek baru secara eksplisit. Kata “ia” mempertahankan ketidakjelasan gramatikal mengenai apakah yang dimaksud adalah orang yang bertanya atau Tuhan, alih-alih menyelesaikannya secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian” agar pembedaan jumlah dalam teks Yunani tetap jelas. Diksi dibuat lugas dan bermartabat; “memerlukannya” dipilih daripada bentuk harfiah yang kaku “mempunyai kebutuhan akan dia/itu”. Huruf kecil pada “ia” sengaja mempertahankan ambiguitas subjek tersirat.
