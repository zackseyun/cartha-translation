  yaml_path: translation/nt/mark/011/021.yaml
  text: And Peter[a], remembering, says to him, “Rabbi, look—the fig tree that you cursed has withered.”
translation:
  language: id
  text: Lalu Petrus teringat dan berkata kepada-Nya, “Rabi, lihat! Pohon ara yang Engkau kutuk itu sudah kering.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναμνησθεὶς
  choice: teringat
  rationale: Partisip aoris ini menyatakan bahwa Petrus teringat atau diingatkan. Dalam konteks ini, “teringat” alami dalam bahasa Indonesia dan tetap menghubungkan ingatan itu dengan ucapannya.
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis merupakan ciri khas narasi Markus. Bahasa Indonesia lazim memakai bentuk tak bertanda waktu “berkata”, yang tetap hidup dan tidak memaksakan aspek yang tidak tersedia dalam sistem verba Indonesia.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Teks Yunani memakai pronomina yang dalam konteks merujuk kepada Yesus. “kepada-Nya” mempertahankan bentuk pronominal tanpa menambahkan nama Yesus.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Sapaan Semitik yang ditransliterasikan dalam teks Yunani dipertahankan sebagai “Rabi”, bentuk baku bahasa Indonesia yang menjaga latar Yahudi dan nuansa gelarnya.
- source_word: ἴδε
  choice: lihat
  rationale: Imperatif ini mengarahkan perhatian kepada keadaan pohon ara. “Lihat!” jelas, langsung, dan wajar dalam bahasa Indonesia modern.
- source_word: συκῆ
  choice: pohon ara
  rationale: Dalam konteks ini kata tersebut menunjuk pada pohonnya, sehingga “pohon ara” lebih jelas daripada hanya “ara”.
- source_word: κατηράσω
  choice: Engkau kutuk
  rationale: Verba aoris orang kedua tunggal ini menyatakan tindakan kutuk yang sebelumnya dilakukan oleh Yesus. Susunan ini ringkas, alami, dan mempertahankan sapaan langsung Petrus.
- source_word: ἐξήρανται
  choice: sudah layu
  rationale: Bentuk perfektum menyatakan tindakan yang telah terjadi dengan hasil yang masih tampak. “sudah layu” secara alami menyampaikan keadaan kini sebagai hasil perubahan tersebut dan cocok untuk pohon.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Sapaan “Engkau” memakai huruf kapital karena secara kontekstual merujuk kepada Yesus, tanpa menambahkan penafsiran pada isi ayat. Tanda seru setelah “lihat” mencerminkan daya seru imperatif ἴδε.
