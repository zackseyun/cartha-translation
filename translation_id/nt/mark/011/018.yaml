source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ ⸂ἀρχιερεῖς καὶ οἱ γραμματεῖς⸃, καὶ ἐζήτουν πῶς αὐτὸν ἀπολέσωσιν· ἐφοβοῦντο γὰρ αὐτόν, ⸂πᾶς γὰρ⸃ ὁ ὄχλος ἐξεπλήσσετο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/018.yaml
  text: And the chief priests and the scribes heard it[a], and they were seeking how they might destroy him, for they feared him, because the whole crowd was astonished at his teaching.
translation:
  language: id
  text: Para imam kepala dan ahli-ahli Taurat mendengar tentang hal itu, lalu mereka mencari cara untuk membinasakan Dia[a]. Sebab mereka takut kepada-Nya, karena seluruh orang banyak itu takjub akan pengajaran-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membunuh Dia” atau “menjatuhkan hukuman mati atas Dia.” Kata kerja Yunani ini dapat berarti “membinasakan” secara lebih luas, meskipun konteksnya mengisyaratkan maksud untuk membunuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: mendengar tentang hal itu
  rationale: Kata kerja ini dapat berarti mendengar atau mengetahui. Frasa “tentang hal itu” secara wajar menunjuk kembali kepada tindakan dan perkataan Yesus di Bait Allah tanpa mempersempit acuannya.
- source_word: ἀρχιερεῖς
  choice: para imam kepala
  rationale: Ini adalah sebutan kelompok bagi para pemimpin keimaman di Yerusalem, bukan pernyataan bahwa ada beberapa pemegang jabatan imam besar pada saat yang sama.
- source_word: γραμματεῖς
  choice: ahli-ahli Taurat
  rationale: Padanan ini lazim dan mudah dipahami untuk golongan cendekiawan Yahudi yang terlatih dalam Kitab Suci dan hukum agama.
- source_word: ἐζήτουν πῶς
  choice: mereka mencari cara untuk
  rationale: Bentuk imperfek menunjukkan upaya yang sedang berlangsung, sedangkan πῶς memperkenalkan cara atau sarana yang sedang mereka pikirkan.
- source_word: ἀπολέσωσιν
  choice: membinasakan Dia
  rationale: ἀπόλλυμι memiliki cakupan makna membinasakan atau membunuh. “Membinasakan” mempertahankan keluasan leksikalnya, sementara konteks mengisyaratkan maksud mematikan.
- source_word: ἐφοβοῦντο
  choice: mereka takut kepada-Nya
  rationale: Bentuk imperfek menyatakan rasa takut yang berkelanjutan; dalam konteks, ketakutan itu berkaitan dengan pengaruh Yesus dan tanggapan orang banyak.
- source_word: πᾶς ὁ ὄχλος
  choice: seluruh orang banyak
  rationale: Ungkapan ini bersifat kolektif dan tegas, yakni orang banyak itu secara luas, bukan hanya beberapa orang.
- source_word: ἐξεπλήσσετο
  choice: takjub
  rationale: Kata ini menyatakan reaksi keheranan yang kuat; bentuk imperfek menggambarkan keadaan takjub yang sedang berlangsung.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: akan pengajaran-Nya
  rationale: ἐπί dengan datif di sini menandai dasar atau hal yang menimbulkan ketakjuban. “Takjub akan” merupakan ungkapan Indonesia yang alami dan bermartabat.
theological_decisions:
- issue: Cakupan maksud para pemimpin dalam ἀπολέσωσιν
  choice: membinasakan Dia
  alternative: membunuh Dia; membuat Dia mati
  rationale: Konteks mengarah kepada rencana mematikan, tetapi kata Yunani itu sendiri memiliki arti yang lebih luas. Teks utama mempertahankan keluasan tersebut, sedangkan catatan kaki menjelaskan maksud yang mungkin lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Istilah “imam kepala” dan “ahli Taurat” dipertahankan karena mapan dan cukup jelas. Kapitalisasi pronomina bagi Yesus mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
