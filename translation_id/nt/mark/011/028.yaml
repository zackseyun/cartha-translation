  text: καὶ ⸀ἔλεγον αὐτῷ· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; ⸀ἢ τίς σοι ⸂ἔδωκεν τὴν ἐξουσίαν ταύτην⸃ ἵνα ταῦτα ποιῇς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/028.yaml
  text: And they were saying to him[b][a], “By what authority are you doing these things? Or who gave you this authority to do these things?”
translation:
  language: id
  text: Mereka bertanya kepada-Nya, “Dengan wewenang apa Engkau melakukan hal-hal ini? Atau, siapa yang memberi-Mu wewenang ini untuk melakukan hal-hal tersebut?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: Mereka bertanya
  rationale: Bentuk imperfek menggambarkan tindakan berbicara yang sedang berlangsung, tetapi dalam bahasa Indonesia naratif, “bertanya” menyampaikan fungsi ujaran langsung ini dengan alami tanpa harus menambahkan aspek yang terasa kaku.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: Dengan wewenang apa
  rationale: Ungkapan ἐν dengan datif menanyakan dasar atau kapasitas yang memberi hak untuk bertindak. “Dengan wewenang apa” alami dalam bahasa Indonesia dan tetap mempertahankan tantangan terhadap legitimasi tindakan Yesus.
- source_word: ἐξουσίᾳ / ἐξουσίαν
  choice: wewenang
  rationale: ἐξουσία di sini menunjuk pada hak atau otorisasi untuk bertindak, bukan semata-mata kemampuan atau kuasa. “Wewenang” paling tepat dalam konteks pertanyaan para pemimpin di Bait Allah.
- source_word: ταῦτα ποιεῖς / ταῦτα ποιῇς
  choice: melakukan hal-hal ini / melakukan hal-hal tersebut
  rationale: Bentuk jamak ταῦτα dipertahankan dan merujuk secara luas pada tindakan serta pengajaran Yesus yang baru terjadi. Variasi “ini/tersebut” menghindari pengulangan yang kaku tanpa mengubah acuannya.
- source_word: ἢ
  choice: Atau
  rationale: ἢ memperkenalkan pertanyaan kedua sebagai rumusan alternatif yang berkaitan erat dengan pertanyaan pertama.
- source_word: τίς σοι ἔδωκεν
  choice: siapa yang memberi-Mu
  rationale: Aoristus ἔδωκεν wajar diterjemahkan dengan bentuk lampau kontekstual bahasa Indonesia; verba “memberi” tidak memerlukan penanda kala khusus.
- source_word: ἵνα ταῦτα ποιῇς
  choice: untuk melakukan hal-hal tersebut
  rationale: ἵνα dengan subjungtif menyatakan tujuan atau hasil yang dimaksud. Bentuk infinitival Indonesia dengan “untuk” adalah padanan yang alami dan tidak menutup nuansa tujuan.
theological_decisions:
- issue: Sumber wewenang Yesus
  choice: Pertanyaan diterjemahkan secara netral sebagai tantangan terhadap wewenang Yesus.
  alternative: Memperjelasnya sebagai pertanyaan tentang “wewenang ilahi”.
  rationale: Ayat ini mencatat pertanyaan para penentang dan tidak secara eksplisit menyebut sumber ilahi. Terjemahan tidak mendahului jawaban atau menyelesaikan ketegangan teologis dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia. Struktur dua pertanyaan dipertahankan, dengan diksi “wewenang” yang mudah dipahami dan tepat bagi konteks otorisasi.
