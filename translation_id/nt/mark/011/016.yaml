  text: And he would not allow anyone to carry a vessel through the temple courts[a][b].
translation:
  language: id
  text: Ia tidak membiarkan seorang pun membawa barang melintasi kawasan Bait Allah.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melintasi pelataran Bait Allah.” Istilah Yunani ini menunjuk pada kompleks Bait Allah secara luas, bukan secara khusus ruang suci bagian dalam.
    reason: lexical_alternative
  - marker: b
    text: Atau “membawa suatu benda” atau “membawa sebuah wadah.” Kata Yunani ini luas maknanya dan tidak menyebutkan jenis barang tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤφιεν
  choice: tidak membiarkan
  rationale: 'Bentuk imperfek menyatakan tindakan yang berlangsung atau berulang: selama berada di sana, Ia terus mencegah orang melakukannya.'
- source_word: ἵνα τις διενέγκῃ
  choice: seorang pun membawa
  rationale: Sesudah ἤφιεν, ἵνα dengan subjungtif menyatakan tindakan yang tidak diizinkan. Ungkapan Indonesia yang alami ialah 'tidak membiarkan seorang pun membawa'.
- source_word: διενέγκῃ
  choice: membawa ... melintasi
  rationale: Dalam konteks ini διαφέρω berarti membawa sesuatu dari satu tempat ke tempat lain melalui suatu kawasan. 'Melintasi' mempertahankan nuansa pergerakan menembus kawasan tersebut.
- source_word: σκεῦος
  choice: barang
  rationale: Kata ini luas cakupannya dan dapat berarti benda, wadah, perkakas, atau perlengkapan. 'Barang' alami dalam bahasa Indonesia dan tidak menentukan jenis bendanya secara berlebihan.
- source_word: διὰ τοῦ ἱεροῦ
  choice: melintasi pelataran Bait Allah
  rationale: ἱερόν menunjuk pada kompleks Bait Allah secara luas, bukan secara khusus ruang suci bagian dalam (ναός). 'Pelataran Bait Allah' menjelaskan kawasan terbuka kompleks tersebut tanpa menyiratkan ruang kudus bagian dalam.
theological_decisions:
- issue: Cakupan ἱερόν dalam kaitannya dengan Bait Allah di Yerusalem
  choice: kompleks Bait Allah yang lebih luas, diterjemahkan 'pelataran Bait Allah'
  alternative: '''Bait Allah'' atau ''kawasan Bait Allah'''
  rationale: 'Pembedaan ini penting bagi latar peristiwa: tindakan Yesus berkaitan dengan lalu lintas melalui kawasan Bait Allah, bukan dengan orang yang memasuki ruang suci bagian dalam.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Ia' mempertahankan gaya naratif formal; 'seorang pun' menyampaikan sifat tak tentu dari τις dalam konstruksi negatif. Dua catatan kaki mempertahankan keluasan makna ἱερόν dan σκεῦος.
