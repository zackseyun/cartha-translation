  text: ὁ δὲ ⸀Ἰησοῦς εἶπεν αὐτοῖς· Ἐπερωτήσω ⸀ὑμᾶς ἕνα λόγον, καὶ ἀποκρίθητέ μοι, καὶ ἐρῶ ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/029.yaml
  text: But Jesus said to them[a], “I will ask you one question. Answer me[b], and I will tell you by what authority I do these things.”
translation:
  language: id
  text: Tetapi Yesus berkata kepada mereka, “Aku akan mengajukan satu pertanyaan[a] kepada kalian. Jawablah Aku,[b] maka Aku akan memberitahukan kepada kalian dengan wewenang apakah Aku melakukan hal-hal ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “satu perkara”; secara lebih harfiah, “satu kata”.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah, klausa-klausa ini dihubungkan dengan “dan”: “Aku akan mengajukan satu pertanyaan kepada kalian, dan jawablah Aku, dan Aku akan memberitahukan kepada kalian dengan wewenang apakah Aku melakukan hal-hal ini.”'
    reason: previous_rendering
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang bernuansa kontras dari pertanyaan para pemimpin pada ayat sebelumnya; alami dalam narasi bahasa Indonesia.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Mengikuti bentuk nama yang baku dalam bahasa Indonesia.
- source_word: εἶπεν αὐτοῖς
  choice: berkata kepada mereka
  rationale: Padanan naratif yang langsung dan wajar untuk verba berkata dengan objek tak langsung.
- source_word: Ἐπερωτήσω ὑμᾶς
  choice: Aku akan mengajukan ... kepada kalian
  rationale: Mengungkapkan tindakan mengajukan pertanyaan balasan secara alami sambil mempertahankan bentuk waktu mendatang.
- source_word: ἕνα λόγον
  choice: satu pertanyaan
  rationale: λόγος secara harfiah dapat berarti 'kata', tetapi dalam konteks ini menunjuk pada satu perkara yang harus dijawab; 'pertanyaan' memperjelas fungsi ungkapan tersebut tanpa mengubah maksudnya.
- source_word: ἀποκρίθητέ μοι
  choice: Jawablah Aku
  rationale: Mempertahankan bentuk perintah aoris yang langsung dan tegas.
- source_word: ἐρῶ ὑμῖν
  choice: Aku akan memberitahukan kepada kalian
  rationale: Dalam konteks janji untuk mengungkapkan dasar tindakan-Nya, bentuk ini lebih alami daripada padanan harfiah 'Aku akan berkata kepada kalian'.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: dengan wewenang apa
  rationale: Menyatakan dasar atau hak yang memberi kewenangan kepada Yesus untuk bertindak; 'wewenang' alami dan tepat dalam konteks sengketa ini.
- source_word: ταῦτα ποιῶ
  choice: Aku melakukan semua ini
  rationale: Mengacu pada tindakan-tindakan Yesus yang sedang dipersoalkan; 'semua ini' merupakan padanan Indonesia yang alami bagi demonstratif jamak dalam konteks.
theological_decisions:
- issue: Makna ἐξουσία dalam konteks
  choice: wewenang
  alternative: kuasa; hak
  rationale: Perdebatan ini terutama menyangkut dasar yang sah bagi tindakan Yesus, bukan sekadar kemampuan atau kekuatan-Nya. 'Wewenang' mempertahankan dimensi kelembagaan dan teologis tanpa mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Bentuk 'kalian' membedakan objek jamak dari tunggal, sedangkan kapitalisasi 'Aku' mengikuti kebiasaan penulisan pronomina yang merujuk kepada Yesus dalam teks Alkitab bahasa Indonesia. Parataksis Yunani disusun menjadi kalimat Indonesia yang lebih alami; hubungan hasil pada klausa terakhir diungkapkan dengan 'maka' tanpa menjadikannya syarat formal yang lebih kuat daripada konteks.
