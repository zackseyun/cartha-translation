  yaml_path: translation/nt/mark/011/004.yaml
  text: And they went away and found a colt tied at a door outside on the street[a], and they untied it.
translation:
  language: id
  text: Mereka pun pergi dan mendapati seekor keledai muda tertambat di dekat sebuah pintu, di luar, di jalan[a]. Lalu mereka melepaskan ikatannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di dekat sebuah pintu yang berada di luar di jalan.” Ungkapan Yunani ini dapat dipahami dengan penekanan letak yang sedikit berbeda.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: pergi
  rationale: Bentuk aoris ini menyatakan bahwa mereka berangkat dari tempat Yesus memberi perintah. Kata “pergi” alami dalam narasi Indonesia, sedangkan partikel “pun” membantu menyampaikan kelanjutan tindakan.
- source_word: εὗρον
  choice: mendapati
  rationale: Dalam konteks naratif, “mendapati” menyatakan bahwa mereka pergi lalu menemukan keadaan yang telah digambarkan Yesus.
- source_word: πῶλον
  choice: seekor keledai muda
  rationale: πῶλος secara leksikal berarti hewan tunggangan yang masih muda dan tidak dengan sendirinya menyebut spesiesnya. Karena bahasa Indonesia tidak memiliki padanan umum yang alami seperti “colt,” “keledai muda” dipilih berdasarkan konteks perjalanan Yesus menuju Yerusalem, tanpa menambahkan rincian lain tentang hewan itu.
- source_word: δεδεμένον
  choice: tertambat
  rationale: Partisipel perfek pasif menggambarkan keadaan hewan yang sudah diikat. “Tertambat” alami untuk hewan yang diikat pada suatu tempat dan mempertahankan nuansa keadaan yang sedang berlangsung.
- source_word: πρὸς θύραν
  choice: di dekat sebuah pintu
  rationale: πρός dengan akusatif di sini menunjukkan kedekatan lokasi. “Di dekat sebuah pintu” jelas dan alami tanpa menganggap bahwa hewan itu terikat pada pintunya.
- source_word: ἔξω ἐπὶ τοῦ ἀμφόδου
  choice: di luar, di jalan
  rationale: Ungkapan ini menempatkan hewan di luar pada sebuah jalan atau lorong. Susunan Yunani memungkinkan sedikit perbedaan dalam penekanan hubungan antara pintu, bagian luar, dan jalan; tanda baca dan catatan kaki mempertahankan keluwesan itu.
- source_word: λύουσιν αὐτόν
  choice: mereka melepaskan ikatannya
  rationale: Bentuk kini historis diterjemahkan sebagai tindakan lampau sesuai kebiasaan narasi Indonesia. “Melepaskan ikatannya” lebih idiomatis daripada menerjemahkan pronomina benda secara kaku sebagai “melepaskannya” dan dengan jelas merujuk pada tambatan hewan itu.
