id: MRK.11.27
reference: Mark 11:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται πάλιν εἰς Ἱεροσόλυμα. καὶ ἐν τῷ ἱερῷ περιπατοῦντος αὐτοῦ ἔρχονται πρὸς αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/027.yaml
  text: And they came again to Jerusalem. And as he was walking in the temple courts[a], the chief priests and the scribes and the elders came to him.
translation:
  language: id
  text: Lalu mereka tiba lagi di Yerusalem. Ketika Yesus sedang berjalan di pelataran Bait Allah[a], datanglah kepada-Nya imam-imam kepala, ahli-ahli Taurat, dan tua-tua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di Bait Allah” atau “di kawasan Bait Allah”; kata Yunani yang digunakan menunjuk pada kompleks Bait Allah secara luas, bukan secara khusus ruang kudus bagian dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: mereka tiba / datanglah
  rationale: Bentuk kini historis Yunani dialihkan ke bentuk naratif Indonesia yang alami. Kemunculan pertama menyatakan tibanya Yesus dan para murid di Yerusalem; kemunculan kedua menyatakan datangnya para pemimpin kepada Yesus.
- source_word: πάλιν
  choice: lagi
  rationale: Menandai bahwa mereka kembali tiba di Yerusalem.
- source_word: Ἱεροσόλυμα
  choice: Yerusalem
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: ἐν τῷ ἱερῷ
  choice: di pelataran Bait Allah
  rationale: ἱερόν menunjuk pada kawasan Bait Allah secara luas, bukan secara khusus ruang kudus bagian dalam; 'pelataran Bait Allah' menyampaikan latar perjumpaan umum dengan jelas.
- source_word: περιπατοῦντος αὐτοῦ
  choice: Ketika Yesus sedang berjalan
  rationale: Konstruksi genitif absolut memberi latar tindakan yang sedang berlangsung. Nama 'Yesus' dipakai untuk menjernihkan rujukan pronomina secara alami tanpa mengubah makna.
- source_word: ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Dalam bentuk jamak, istilah ini menunjuk para pemimpin kalangan imam, bukan sejumlah imam besar yang sedang menjabat.
- source_word: γραμματεῖς
  choice: ahli-ahli Taurat
  rationale: Padanan Indonesia yang umum dan mudah dipahami bagi kelompok pakar kitab serta hukum agama Yahudi; konteks kelembagaannya tetap terjaga.
- source_word: πρεσβύτεροι
  choice: tua-tua
  rationale: Dalam konteks ini istilah tersebut menunjuk para pemimpin masyarakat Yahudi yang diakui, bukan sekadar laki-laki lanjut usia.
- source_word: πρὸς αὐτόν
  choice: kepada-Nya
  rationale: Menyatakan gerak mendekati Yesus secara idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan makna ἱερόν
  choice: pelataran Bait Allah
  alternative: Bait Allah; kawasan Bait Allah
  rationale: Pilihan ini menghindari kesan bahwa Yesus berada di ruang kudus bagian dalam dan mencerminkan kawasan kompleks Bait Allah tempat perjumpaan umum dapat berlangsung, tanpa memasukkan kesimpulan doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan 'datanglah kepada-Nya' mempertahankan gerak narasi, sedangkan pengulangan kata sandang Yunani tercermin melalui daftar tiga kelompok yang jelas.
