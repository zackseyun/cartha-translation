source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν εἰς ⸀Ἱεροσόλυμα εἰς τὸ ἱερόν· καὶ περιβλεψάμενος πάντα ⸀ὀψὲ ἤδη οὔσης τῆς ὥρας ἐξῆλθεν εἰς Βηθανίαν μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/011.yaml
  text: And he entered Jerusalem[a], into the temple courts; and after looking around at everything, since it was already late[c][b], he went out to Bethany with the twelve.
translation:
  language: id
  text: Ia masuk ke Yerusalem, lalu ke pelataran Bait Allah.[a] Setelah mengamati segala sesuatu di sekelilingnya, dan karena hari sudah larut,[b] ia keluar menuju Betania bersama kedua belas muridnya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kawasan Bait Allah” atau cukup “Bait Allah”. Istilah Yunani menunjuk pada seluruh kompleks Bait Allah, bukan khusus ruang suci bagian dalam.
    reason: lexical_alternative
  - marker: b
    text: Atau “karena waktunya sudah larut” atau “karena hari sudah sore”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah “bersama kedua belas”; yang dimaksud ialah kedua belas murid Yesus.
    reason: clarification
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: masuk
  rationale: Bentuk aoristus εἰσέρχομαι menyatakan tindakan memasuki suatu tempat; “masuk” wajar dan mempertahankan gerak naratif.
- source_word: Ἱεροσόλυμα
  choice: Yerusalem
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: τὸ ἱερόν
  choice: pelataran Bait Allah
  rationale: Ἱερόν menunjuk pada kompleks atau kawasan Bait Allah secara luas, bukan khusus ruang suci bagian dalam (ναός). “Pelataran Bait Allah” menyampaikan ruang umum yang dapat dimasuki dan diamati Yesus.
- source_word: περιβλεψάμενος
  choice: setelah mengamati ... di sekelilingnya
  rationale: Partisip ini menggambarkan tindakan memandang berkeliling dengan saksama dan mendahului tindakan utama berikutnya.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Bentuk jamak netral ini mencakup seluruh hal yang diamati tanpa menentukan rinciannya.
- source_word: ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: karena hari sudah menjelang malam
  rationale: Konstruksi genitif absolut memberi latar waktu yang juga menjelaskan kepergian Yesus. Ungkapan Indonesia ini alami dan tidak menyiratkan waktu yang lebih tepat daripada teks Yunani.
- source_word: ἐξῆλθεν
  choice: ia keluar menuju
  rationale: ἐξέρχομαι menyatakan keluar atau pergi dari tempat itu; “keluar menuju” mempertahankan arah keberangkatan ke Betania.
- source_word: Βηθανίαν
  choice: Betania
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: μετὰ τῶν δώδεκα
  choice: bersama kedua belas muridnya
  rationale: Secara harfiah frasa ini berbunyi “bersama kedua belas”; penambahan “muridnya” menjernihkan rujukan yang sudah dikenal dari konteks tanpa menjadikannya gelar formal.
theological_decisions:
- issue: Cakupan τὸ ἱερόν
  choice: pelataran Bait Allah, yaitu kompleks Bait Allah yang lebih luas
  alternative: Bait Allah
  rationale: Pilihan ini membedakan ἱερόν dari ναός dan menghindari kesan bahwa Yesus memasuki ruang suci bagian dalam. Ini merupakan ketepatan ruang, bukan penetapan doktrin tertentu.
- issue: Rujukan τῶν δώδεκα
  choice: kedua belas muridnya
  alternative: kedua belas orang itu
  rationale: Bahasa Yunani hanya menyebut “kedua belas”, tetapi konteks menunjukkan kelompok murid Yesus. Penyebutan “muridnya” membuat rujukan jelas bagi pembaca modern tanpa memakai kapitalisasi sebagai gelar.
- issue: Nuansa ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: karena hari sudah menjelang malam
  alternative: karena waktunya sudah larut
  rationale: Konstruksi tersebut dapat dipahami sebagai keterangan waktu dengan nuansa sebab. Terjemahan mempertahankan kedua nuansa itu tanpa menetapkan jam tertentu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kalimat mempertahankan urutan tindakan dalam narasi, memakai “Bait Allah” sebagai istilah yang lazim, serta menjelaskan ungkapan eliptis “kedua belas” tanpa mengubahnya menjadi gelar formal.
