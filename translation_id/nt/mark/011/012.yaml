  text: Καὶ τῇ ἐπαύριον ἐξελθόντων αὐτῶν ἀπὸ Βηθανίας ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/012.yaml
  text: And on the next day, when they had gone out from Bethany, he was hungry.
translation:
  language: id
  text: Keesokan harinya, sesudah mereka meninggalkan Betania, ia merasa lapar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Keesokan harinya
  rationale: Καί melanjutkan alur narasi. Dalam bahasa Indonesia, kesinambungan itu dapat dinyatakan secara alami oleh keterangan waktu tanpa harus memakai 'dan' pada awal kalimat.
- source_word: τῇ ἐπαύριον
  choice: Keesokan harinya
  rationale: Ungkapan ini berfungsi sebagai keterangan waktu dan menunjuk pada hari berikutnya dalam urutan narasi.
- source_word: ἐξελθόντων αὐτῶν
  choice: ketika mereka telah keluar
  rationale: Konstruksi genitif absolut dengan partisip aoris menunjukkan tindakan jamak yang mendahului verba utama. Bentuk 'telah keluar' mempertahankan hubungan waktunya tanpa mengubahnya menjadi tindakan yang masih berlangsung.
- source_word: ἀπὸ Βηθανίας
  choice: dari Betania
  rationale: ἀπό menyatakan gerak menjauhi suatu tempat; 'Betania' adalah bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: ἐπείνασεν
  choice: ia merasa lapar
  rationale: Aoris πεινάω melaporkan bahwa subjek mengalami rasa lapar. 'Merasa lapar' alami dalam bahasa Indonesia dan dapat mencakup nuansa timbulnya keadaan itu tanpa memaksakan terjemahan yang lebih eksplisit seperti 'menjadi lapar'.
theological_decisions:
- issue: Subjek tersirat dari ἐπείνασεν
  choice: Memakai pronomina 'ia' tanpa menambahkan nama 'Yesus'.
  alternative: Menambahkan 'Yesus' demi kejelasan.
  rationale: Verba Yunani berbentuk tunggal dan konteks menunjukkan bahwa subjeknya adalah Yesus, tetapi namanya tidak disebutkan dalam klausa ini. Pronomina mempertahankan keekonomisan teks sumber sekaligus menyatakan secara lugas pengalaman lapar yang sungguh manusiawi.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Ia' dipilih sebagai pronomina naratif yang netral; tidak ada penanda catatan kaki karena tidak diperlukan.
