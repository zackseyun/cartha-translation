  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς λέγει αὐτοῖς· Ἔχετε πίστιν θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/022.yaml
  text: And Jesus answered them[a], “Have faith in God.”
translation:
  language: id
  text: Lalu Yesus menjawab mereka, “Percayalah kepada Allah.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Milikilah iman Allah.” Ungkapan ini juga dapat dipahami sebagai “Milikilah kesetiaan Allah” atau “Milikilah iman yang berasal dari Allah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ... λέγει
  choice: Lalu Yesus menjawab mereka
  rationale: Partisip ἀποκριθείς bersama verba historis kini λέγει berfungsi memperkenalkan tanggapan Yesus. Bentuk lampau naratif dan verba ‘menjawab’ menghasilkan bahasa Indonesia yang alami; ‘lalu’ mengalirkan hubungan dengan konteks tanpa menambah isi substantif.
- source_word: Ἔχετε
  choice: Percayalah
  rationale: Imperatif harfiah ‘miliki’ tidak alami bila dipasangkan dengan ‘iman’ dalam bahasa Indonesia. ‘Percayalah’ menyampaikan seruan untuk menaruh iman atau kepercayaan, tanpa mempertegas aspek secara berlebihan.
- source_word: πίστιν
  choice: percaya
  rationale: Dalam konstruksi imperatif ini, verba ‘percaya’ merupakan ungkapan Indonesia yang paling alami untuk tindakan beriman. Nomina ‘iman’ dipertahankan dalam catatan agar bentuk sumber dan ambiguitas konstruksi tetap terlihat.
- source_word: θεοῦ
  choice: kepada Allah
  rationale: 'Genitif θεοῦ paling masuk akal secara kontekstual sebagai sasaran iman: percaya kepada Allah. Namun, bentuk Yunaninya secara harfiah ‘iman Allah’ dan tetap ambigu, sehingga kemungkinan lain dicatat.'
theological_decisions:
- issue: Genitif ambigu dalam πίστιν θεοῦ
  choice: 'Genitif objektif: ‘percaya kepada Allah’'
  alternative: ‘miliki iman Allah’, yang juga dapat dipahami sebagai ‘miliki kesetiaan Allah’ atau ‘miliki iman yang berasal dari Allah’
  rationale: Konteks ajaran berikutnya tentang percaya dan berdoa mendukung seruan agar murid-murid menaruh kepercayaan kepada Allah. Karena konstruksi Yunani sendiri tidak menetapkan hubungan genitif itu secara eksplisit, kemungkinan lain tidak dihapus, melainkan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. ‘Percayalah kepada Allah’ lebih alami bagi pembaca umum daripada ‘Milikilah iman kepada Allah’, sedangkan catatan kaki mempertahankan bentuk serta ambiguitas genitif Yunani.
