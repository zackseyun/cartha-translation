review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat menyampaikan pelaku yang tidak tentu, lokasi, penerima ujaran, dan tindakan melepaskan. Namun, ἔλεγον secara langsung berarti “berkata/mengatakan”; pilihan “bertanya” dapat diterima secara idiomatis karena ujarannya berbentuk pertanyaan, tetapi menghilangkan verba ujaran dan nuansa imperfektif yang dapat dipertahankan dengan lebih netral. Selain itu, πῶλος sendiri berarti hewan muda/colt dan tidak secara leksikal menyebut keledai; “anak keledai” dapat dipakai berdasarkan konteks, asalkan alternatif leksikalnya dicatat.
  naturalness: Kalimat draf pada dasarnya alami, tetapi “Apa yang sedang kalian lakukan dengan melepaskan ikatan anak keledai itu?” agak berat dan dapat terdengar seolah-olah “melepaskan ikatan” adalah sarana untuk melakukan sesuatu yang lain. “Apa yang kalian lakukan dengan melepaskan anak keledai itu?” lebih ringkas dan idiomatis. Penghilangan “sedang” tidak mengubah tindakan kini yang sudah jelas dari bentuk pertanyaan Indonesia.
  terminology: “Anak keledai” jelas dan lazim dalam konteks ini, tetapi perlu catatan karena πῶλος lebih umum daripada “keledai.” “Berkata kepada mereka” adalah padanan yang lebih dekat bagi ἔλεγον daripada “bertanya kepada mereka,” tanpa membuat kalimat Indonesia tidak alami.
  issues:
  - severity: medium
    issue: Pilihan “bertanya” untuk ἔλεγον
    rationale: Walaupun isi ujarannya berupa pertanyaan, ἔλεγον adalah verba “berkata/mengatakan,” bukan verba khusus “bertanya.” “Berkata kepada mereka” mempertahankan pilihan leksikal sumber dan tetap wajar sebelum kutipan pertanyaan.
  - severity: medium
    issue: Ambiguitas πῶλος tidak dicatat
    rationale: “Anak keledai” sesuai dengan konteks naratif, tetapi πῶλος secara leksikal dapat berarti hewan muda/colt. Catatan alternatif diperlukan agar terjemahan tidak menyajikan spesifikasi kontekstual itu seolah-olah eksplisit dalam kata Yunani.
  - severity: low
    issue: Frasa “melepaskan ikatan anak keledai” kurang langsung
    rationale: λύοντες τὸν πῶλον secara alami dapat diterjemahkan “melepaskan anak keledai itu”; penyebutan “ikatan” adalah penjelasan kontekstual yang tidak perlu dalam teks utama.
  revised_text: Beberapa orang yang berdiri di situ berkata kepada mereka, “Apa yang kalian lakukan dengan melepaskan anak keledai itu?”
  revised_footnotes:
  - marker: a
    text: Atau “hewan muda itu.” Kata Yunani πῶλος dapat berarti hewan muda; dalam konteks ini, kata itu merujuk pada seekor keledai.
    reason: lexical_alternative
