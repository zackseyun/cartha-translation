  yaml_path: translation/nt/mark/011/005.yaml
  text: And some of those standing there were saying to them[a], “What are you doing, untying the colt?”
translation:
  language: id
  text: Beberapa orang yang berdiri di situ berkata kepada mereka, “Apa yang kalian lakukan dengan melepaskan anak keledai itu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινες
  choice: beberapa orang
  rationale: Menunjukkan sekelompok orang yang tidak ditentukan dari antara mereka yang hadir, dengan ungkapan Indonesia yang alami.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: yang berdiri di situ
  rationale: Mencerminkan partisipel substantival dan keterangan tempat secara dekat tanpa memakai istilah yang lebih interpretatif seperti 'orang-orang yang berada di sekitar'.
- source_word: ἔλεγον
  choice: bertanya
  rationale: Secara leksikal berarti 'berkata', tetapi karena ujaran langsungnya berupa pertanyaan, 'bertanya' merupakan padanan alami dalam bahasa Indonesia. Aspek imperfektif tidak diberi penanda khusus karena bentuk progresif seperti 'sedang berkata' terasa kaku dalam konteks ini.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Mempertahankan objek tak langsung jamak yang merujuk kepada para murid.
- source_word: Τί ποιεῖτε
  choice: Apa yang sedang kalian lakukan
  rationale: Mempertahankan pertanyaan langsung serta tindakan yang sedang berlangsung. 'Kalian' secara jelas menyatakan orang kedua jamak.
- source_word: λύοντες
  choice: dengan melepaskan ikatan
  rationale: Dalam konteks hewan yang tertambat, ungkapan ini jelas dan alami serta mempertahankan hubungan partisipial dengan tindakan utama.
- source_word: τὸν πῶλον
  choice: anak keledai itu
  rationale: πῶλος secara umum dapat berarti hewan muda, tetapi konteks dekat Markus 11:2 dan latar kisah menunjukkan seekor keledai. Bahasa Indonesia tidak memiliki padanan umum yang sama alami dan tidak ambigu, sehingga 'anak keledai' menyampaikan rujukan kontekstual dengan jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Kalian' dipakai untuk menandai bentuk orang kedua jamak secara transparan. Susunan pertanyaan dibuat idiomatis tanpa menambahkan alasan atau motif yang tidak dinyatakan teks Yunani.
