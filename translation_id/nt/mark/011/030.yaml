  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων; ἀποκρίθητέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/030.yaml
  text: Was John's baptism from heaven or from men? Answer me[a][b].
translation:
  language: id
  text: Apakah baptisan Yohanes berasal dari surga[a] atau dari manusia[b]? Jawablah Aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari Allah.” Teks Yunani berbunyi “dari surga,” suatu ungkapan Yahudi yang menunjuk pada asal atau wewenang ilahi.
    reason: lexical_alternative
  - marker: b
    text: “Dari manusia” berarti berasal dari manusia, yaitu hanya memiliki asal atau wewenang manusiawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  choice: baptisan Yohanes
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap mencakup baptisan yang dikaitkan dengan atau dilayankan oleh Yohanes tanpa mempersempit relasi genitifnya secara berlebihan.
- source_word: ἐξ οὐρανοῦ
  choice: berasal dari surga
  rationale: Pilihan ini mempertahankan ungkapan sumber yang harfiah dalam bahasa Yunani serta idiom Yahudi yang menunjuk pada asal atau wewenang ilahi.
- source_word: ἐξ ἀνθρώπων
  choice: dari manusia
  rationale: Kata manusia bersifat generik dan inklusif dalam bahasa Indonesia, serta mempertahankan pertentangan antara sumber ilahi dan sumber yang semata-mata manusiawi.
- source_word: ἀποκρίθητέ μοι
  choice: Jawablah Aku
  rationale: Bentuk imperatif aoris menuntut jawaban langsung; Jawablah menyampaikan desakan itu secara alami dan bermartabat.
- source_word: ἦν ἢ
  choice: Apakah ... berasal ... atau ...?
  rationale: Walaupun teks Yunani secara formal memakai kata kerja 'adalah', konstruksi berasal dari lebih alami dalam bahasa Indonesia dan secara jelas menyatakan pertanyaan tentang sumber atau wewenang.
theological_decisions:
- issue: Makna frasa 'dari surga' dalam pertanyaan Yesus
  choice: Mempertahankan 'dari surga' dalam teks utama sebagai ungkapan tentang asal atau wewenang ilahi.
  alternative: dari Allah
  rationale: Ungkapan Yunani mempertahankan cara tutur Yahudi yang penuh hormat mengenai Allah. Terjemahan langsung menjaga daya retoris dan tidak menggantikan idiom sumber dengan penafsirannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pertanyaan dibuat alami dengan 'berasal dari', sedangkan ungkapan sumber 'surga' dipertahankan. Pronomina 'Aku' dikapitalisasi sesuai kebiasaan umum teks Alkitab bahasa Indonesia ketika merujuk kepada Yesus.
