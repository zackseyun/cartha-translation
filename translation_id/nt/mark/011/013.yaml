  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν ⸀ἀπὸ μακρόθεν ἔχουσαν φύλλα ἦλθεν εἰ ἄρα ⸂τι εὑρήσει⸃ ἐν αὐτῇ, καὶ ἐλθὼν ἐπ’ αὐτὴν οὐδὲν εὗρεν εἰ μὴ φύλλα, ⸂ὁ γὰρ καιρὸς οὐκ ἦν⸃ σύκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/013.yaml
  text: And seeing from a distance a fig tree having leaves[a], he went to see whether perhaps he would find anything on it. But when he came to it, he found nothing except leaves, for it was not the season for figs.
translation:
  language: id
  text: Ketika dari kejauhan Ia melihat sebatang pohon ara yang berdaun, Ia pergi untuk melihat kalau-kalau Ia menemukan sesuatu pada pohon itu. Namun, ketika Ia tiba di pohon itu, Ia tidak menemukan apa pun selain daun, sebab saat itu bukan musim buah ara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab saat itu bukan waktunya buah ara.”
    reason: Alternatif leksikal untuk καιρός, yang dapat diterjemahkan “musim” atau “waktu” dalam konteks ini.
lexical_decisions:
- source_word: ἰδὼν
  choice: ketika ... Ia melihat
  rationale: Partisip aoris ini menyatakan keadaan temporal; bentuk klausa dengan “ketika” alami dalam bahasa Indonesia tanpa menentukan urutan secara berlebihan.
- source_word: συκῆν
  choice: sebatang pohon ara
  rationale: Padanan baku dan alami; penggolong “sebatang” sesuai untuk pohon dalam bahasa Indonesia.
- source_word: ἀπὸ μακρόθεν
  choice: dari kejauhan
  rationale: Mempertahankan makna spasial dengan ungkapan Indonesia yang wajar.
- source_word: ἔχουσαν φύλλα
  choice: yang berdaun
  rationale: Ungkapan ringkas dan alami yang langsung menyampaikan bahwa pohon itu memiliki daun, tanpa menyiratkan lebih dari teks.
- source_word: ἦλθεν εἰ ἄρα τι εὑρήσει ἐν αὐτῇ
  choice: Ia pergi untuk melihat kalau-kalau Ia menemukan sesuatu pada pohon itu
  rationale: “Untuk melihat” menyampaikan tujuan, sedangkan “kalau-kalau” mempertahankan nuansa tentatif εἰ ἄρα.
- source_word: ἐν αὐτῇ
  choice: pada pohon itu
  rationale: “Pada” merupakan padanan idiomatis dalam konteks mencari buah pada pohon dan menghindari rujukan pronominal yang kurang jelas.
- source_word: ἐλθὼν ἐπ’ αὐτὴν
  choice: ketika sampai di sana
  rationale: Menyampaikan tibanya Yesus pada pohon tersebut secara alami dan menghindari pengulangan “pohon itu” yang kaku.
- source_word: οὐδὲν εὗρεν εἰ μὴ φύλλα
  choice: Ia tidak menemukan apa pun selain daun
  rationale: Mencerminkan konstruksi pengecualian εἰ μὴ secara dekat sekaligus idiomatis.
- source_word: ὁ γὰρ καιρὸς οὐκ ἦν σύκων
  choice: sebab saat itu bukan musim buah ara
  rationale: καιρός dalam konteks ini menunjuk pada waktu atau musim yang sesuai; terjemahan ini langsung, jelas, dan tidak menambahkan penjelasan agrikultural.
theological_decisions:
- issue: Daya penjelas klausa mengenai musim buah ara
  choice: 'Mempertahankan komentar narator secara langsung: “sebab saat itu bukan musim buah ara.”'
  alternative: Memperluasnya dengan penjelasan tentang tahap pertumbuhan atau kebiasaan pohon ara.
  rationale: Teks menampilkan ketegangan antara pencarian buah dan keterangan bahwa saat itu bukan musimnya. Terjemahan tidak menyelesaikan atau melunakkan ketegangan tersebut melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia standar modern, alami, dan bermartabat. Kapitalisasi pronomina “Ia” mengikuti kebiasaan umum teks Alkitab Indonesia tanpa menambahkan penafsiran pada isi ayat.
