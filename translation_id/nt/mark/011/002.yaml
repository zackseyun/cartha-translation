review_pass:
  verdict: revise
  source_fidelity: Terjemahan pada dasarnya setia. Namun, "di hadapan kalian" dapat berarti sekadar berada di depan, sedangkan κατέναντι lebih tepat menunjuk lokasi yang berseberangan. "Ke sini" juga tidak perlu ditambahkan, karena φέρετε hanya memerintahkan untuk membawa hewan itu tanpa adverbia arah eksplisit.
  naturalness: Bahasa draf sudah modern dan jelas. "Masuk ke desa itu" dan "lepaskan keledai itu" lebih lugas dalam konteks ini daripada bentuk pronominal yang dapat terasa kurang langsung.
  terminology: '"Keledai muda" merupakan pilihan yang dapat diterima untuk πῶλον dalam konteks ini. Istilah tersebut mempertahankan acuan hewan muda tanpa memasukkan penafsiran teologis. Tidak diperlukan catatan kaki.'
  issues:
  - severity: medium
    issue: '"di hadapan kalian" untuk τὴν κατέναντι ὑμῶν'
    rationale: Ungkapan Indonesia ini lazimnya dapat berarti "di depan kalian," sedangkan Yunani menyatakan desa yang berseberangan/di seberang posisi mereka. "Desa yang ada di seberang kalian" menyampaikan relasi spasial itu lebih tepat.
  - severity: low
    issue: Penambahan "kemari" untuk φέρετε
    rationale: Arah kepada Yesus mungkin tersirat secara pragmatis dalam "bawalah," tetapi tidak dinyatakan oleh kata Yunani itu sendiri. Menerjemahkan objek secara eksplisit sebagai "bawalah keledai itu" lebih dekat pada teks.
  revised_text: Ia berkata kepada mereka, “Pergilah ke desa yang ada di seberang kalian. Begitu kalian masuk ke desa itu, kalian akan menemukan seekor keledai muda yang tertambat, yang belum pernah ditunggangi seorang pun. Lepaskan keledai itu dan bawalah.”
