  to: Ia berkata kepada mereka, “Pergilah ke desa yang ada di seberang kalian. Begitu kalian masuk ke desa itu, kalian akan menemukan seekor keledai muda yang tertambat, yang belum pernah ditunggangi seorang pun. Lepaskan keledai itu dan bawalah.”
