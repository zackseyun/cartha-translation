  text: καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν κώμην τὴν κατέναντι ὑμῶν, καὶ ⸀εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν εὑρήσετε πῶλον δεδεμένον ἐφ’ ὃν οὐδεὶς ⸀οὔπω ἀνθρώπων ⸀ἐκάθισεν· ⸂λύσατε αὐτὸν καὶ φέρετε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/002.yaml
  text: And he says to them[a], “Go into the village opposite you, and as soon as you enter it, you will find a colt tied there, on which no one has yet sat[b]. Untie it and bring it.”
translation:
  language: id
  text: Ia berkata kepada mereka, “Pergilah ke desa yang ada di seberang kalian. Begitu kalian masuk ke desa itu, kalian akan menemukan seekor keledai muda yang tertambat, yang belum pernah ditunggangi seorang pun. Lepaskan keledai itu dan bawalah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Pergilah
  rationale: Bentuk imperatif gerak ini diterjemahkan secara langsung dan wajar dalam bahasa Indonesia.
- source_word: κώμην
  choice: desa
  rationale: κώμη lazim menunjuk pada permukiman berupa desa, bukan kota.
- source_word: τὴν κατέναντι ὑμῶν
  choice: di hadapan kalian
  rationale: Ungkapan ini menunjukkan desa yang terletak berseberangan atau tepat di depan posisi para murid; pilihan ini alami tanpa menetapkan detail geografis tambahan.
- source_word: εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν
  choice: Begitu kalian memasukinya
  rationale: Susunan partisipial dengan εὐθύς menyatakan bahwa penemuan itu terjadi segera saat mereka masuk.
- source_word: πῶλον
  choice: keledai muda
  rationale: πῶλος secara leksikal berarti hewan muda; dalam konteks masuknya Yesus ke Yerusalem, hewan itu adalah keledai muda. Penyebutan spesies menghindari ketidakjelasan istilah Indonesia seperti 'anak hewan'.
- source_word: δεδεμένον
  choice: tertambat
  rationale: Partisipel perfektif pasif menggambarkan hewan yang berada dalam keadaan terikat; 'tertambat' idiomatis untuk hewan.
- source_word: οὐδεὶς οὔπω ἀνθρώπων ἐκάθισεν
  choice: belum pernah ditunggangi seorang pun
  rationale: Ungkapan Yunani menegaskan bahwa belum ada manusia yang duduk di atas hewan itu. Bentuk pasif ini menyampaikan makna berkendara secara alami dalam bahasa Indonesia.
- source_word: λύσατε αὐτόν
  choice: Lepaskan ikatannya
  rationale: Dalam konteks hewan yang tertambat, frasa ini lebih alami daripada terjemahan harfiah 'lepaskan dia' dan tetap menyatakan tindakan membuka ikatan.
- source_word: φέρετε
  choice: bawalah kemari
  rationale: φέρω berarti membawa; 'kemari' mengungkapkan arah menuju Yesus yang tersirat dalam perintah tanpa menentukan apakah hewan itu dituntun atau dibawa dengan cara lain.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan jamak 'kalian' memperjelas bahwa perintah ditujukan kepada lebih dari satu murid. Tidak ada penanda catatan kaki karena tidak diperlukan untuk terjemahan ini.
