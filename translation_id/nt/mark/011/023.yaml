  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἀμὴν λέγω ὑμῖν ὅτι ὃς ἂν εἴπῃ τῷ ὄρει τούτῳ· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, καὶ μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ ἀλλὰ ⸀πιστεύῃ ὅτι ⸂ὃ λαλεῖ γίνεται, ἔσται αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/023.yaml
  text: Truly I tell you[a], whoever says to this mountain, ‘Be lifted up and be thrown into the sea,’ and does not doubt in his heart but believes that what he says is happening[b], it will be so for him.
translation:
  language: id
  text: Sesungguhnya Aku berkata kepadamu, siapa pun yang berkata kepada gunung ini, ‘Terangkatlah dan tercampaklah ke dalam laut,’ dan tidak bimbang dalam hatinya[a], melainkan percaya bahwa apa yang dikatakannya sedang terjadi[b], hal itu akan terjadi baginya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak goyah” atau “tidak terpecah dalam dirinya”; kata kerja Yunani ini dapat menyatakan keterbelahan batin maupun kebimbangan.
    reason: lexical_alternative
  - marker: b
    text: Atau “bahwa apa yang dikatakannya terjadi” atau “menjadi kenyataan.” Bahasa Yunani memakai bentuk kala kini (“sedang terjadi”/“terjadi”) sebelum klausa hasil yang berkala mendatang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya Aku berkata kepadamu
  rationale: Menyampaikan formula penegasan yang khidmat dan sapaan langsung secara wajar dalam bahasa Indonesia, tanpa mempertahankan 'Amin' yang dapat disalahpahami sebagai penutup doa.
- source_word: ὃς ἂν εἴπῃ
  choice: siapa pun yang berkata
  rationale: Mencerminkan konstruksi relatif tak tentu dengan ἄν dan subjungtif sebagai kondisi umum.
- source_word: τῷ ὄρει τούτῳ
  choice: kepada gunung ini
  rationale: Mempertahankan makna lazim ὄρος dan demonstratif yang membuat gambaran itu hidup.
- source_word: Ἄρθητι
  choice: Terangkatlah
  rationale: Mempertahankan bentuk pasif imperatif dan gambaran gunung diangkat dari tempatnya; ungkapan ini lebih dekat kepada bentuk sumber daripada parafrasa 'pindahlah'.
- source_word: βλήθητι εἰς τὴν θάλασσαν
  choice: tercampaklah ke dalam laut
  rationale: Menyampaikan bentuk pasif imperatif βάλλω dengan daya gambaran yang kuat dan mempertahankan arah εἰς.
- source_word: μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ
  choice: tidak bimbang dalam hatinya
  rationale: Dalam konteks ini διακρίνω menunjuk pada kebimbangan batin; 'bimbang' juga memberi ruang bagi nuansa goyah atau terpecah di dalam diri.
- source_word: πιστεύῃ
  choice: percaya
  rationale: Padanan langsung dan alami bagi πιστεύω dalam konteks keyakinan.
- source_word: ὅτι ὃ λαλεῖ γίνεται
  choice: bahwa apa yang dikatakannya sedang terjadi
  rationale: Mempertahankan kala kini γίνεται, termasuk ketegangan aspeknya sebelum klausa hasil berkala mendatang, tanpa mengubahnya diam-diam menjadi 'akan terjadi'.
- source_word: ἔσται αὐτῷ
  choice: hal itu akan terjadi baginya
  rationale: Menyampaikan hasil pada masa mendatang sambil mempertahankan ungkapan Yunani yang relatif terbuka tentang bagaimana hasil itu terwujud.
theological_decisions:
- issue: Sifat perkataan Yesus mengenai iman dan ucapan
  choice: Menerjemahkan janji bersyarat ini secara lugas tanpa menambahkan pembatas teologis yang tidak dinyatakan dalam ayat.
  alternative: Menjadikannya semata-mata hiperbola atau merumuskannya sebagai jaminan mutlak tanpa syarat lain.
  rationale: Teks memakai gambaran yang sangat kuat dan mengaitkan hasil dengan percaya tanpa kebimbangan. Terjemahan perlu mempertahankan daya dan ketegangan pernyataan itu, bukan menyelesaikannya melalui sistem teologis tertentu.
- issue: Bentuk maskulin tunggal αὐτοῦ / αὐτῷ
  choice: Memakai bentuk tunggal representatif 'hatinya' dan 'baginya'.
  alternative: Mengubahnya menjadi bentuk jamak atau menambahkan 'laki-laki'.
  rationale: Bahasa Indonesia tidak menandai gender pada akhiran ini; bentuk tunggal mempertahankan tata bahasa sumber dan tetap berlaku secara generik tanpa mengimpor penegasan gender yang tidak alami.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Kapital pada 'Aku' mengikuti konvensi hormat umum bagi tuturan Yesus. Diksi 'terangkatlah' dan 'tercampaklah' mempertahankan pasangan imperatif pasif serta daya gambaran teks; catatan kaki menjaga ambiguitas leksikal dan aspek verbal.
