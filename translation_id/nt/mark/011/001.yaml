  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐγγίζουσιν εἰς Ἱεροσόλυμα εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ Ὄρος τῶν Ἐλαιῶν, ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/001.yaml
  text: And when they were approaching Jerusalem[a], at Bethphage and Bethany, near the Mount of Olives[b], he sends two of his disciples
translation:
  language: id
  text: Ketika mereka mendekati Yerusalem[a]—di sekitar Betfage dan Betania, dekat Bukit Zaitun—Yesus mengutus[b] dua orang dari antara murid-murid-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “mendekati Yerusalem, ke Betfage dan Betania, ke arah Bukit Zaitun.” Preposisi-preposisi Yunani dalam rangkaian ini dapat dipahami secara spasial dengan nuansa arah atau lokasi; terjemahan utama menyatakan hubungan tempatnya tanpa memaksakan salah satu nuansa itu.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Yunani memakai bentuk kini, “mengutus,” sebagai kini historis yang sering dipakai Markus untuk membuat narasi lebih hidup. Dalam alur cerita lampau, bentuk ini juga dapat diterjemahkan “mengutus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζουσιν
  choice: mendekati
  rationale: Bentuk kini historis khas narasi Markus diterjemahkan secara alami dalam alur lampau bahasa Indonesia, sementara makna gerak mendekat tetap dipertahankan.
- source_word: εἰς Ἱεροσόλυμα
  choice: Yerusalem
  rationale: Sesudah 'mendekati', bahasa Indonesia tidak memerlukan preposisi tujuan; frasa ini menyatakan tempat yang mereka dekati.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: tiba di daerah Betfage dan Betania
  rationale: εἰς yang berulang mengaitkan kedua tempat itu dengan tahap perjalanan menuju Yerusalem. Ungkapan 'di daerah' menghindari kesan bahwa rombongan tiba secara bersamaan di dua desa yang berbeda.
- source_word: πρὸς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: dekat Bukit Zaitun
  rationale: πρός di sini paling wajar menyatakan hubungan ruang atau kedekatan; 'dekat' tidak memaksakan arah gerak yang mungkin tidak dimaksudkan.
- source_word: ἀποστέλλει
  choice: menyuruh
  rationale: Dalam konteks pengutusan dua murid untuk suatu tugas, 'menyuruh' merupakan ungkapan Indonesia yang alami. Pergeseran bentuk kini historis dinyatakan dalam catatan kaki.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: dua orang murid-Nya
  rationale: 'Menyampaikan konstruksi partitif secara alami: dua orang dari kelompok murid Yesus.'
- source_word: Βηθφαγὴ
  choice: Betfage
  rationale: Mengikuti bentuk nama tempat yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: Βηθανίαν
  choice: Betania
  rationale: Mengikuti bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: Ὄρος τῶν Ἐλαιῶν
  choice: Bukit Zaitun
  rationale: Padanan nama geografis yang baku dan mudah dikenali dalam bahasa Indonesia.
