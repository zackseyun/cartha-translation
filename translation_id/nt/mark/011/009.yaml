  text: καὶ οἱ προάγοντες καὶ οἱ ἀκολουθοῦντες ⸀ἔκραζον· Ὡσαννά· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/009.yaml
  text: And those going ahead and those following were crying out[b][a], “Hosanna! Blessed is the one who comes in the name of the Lord!”
translation:
  language: id
  text: Orang-orang yang berjalan di depan dan yang mengikuti terus berseru, “Hosana![b] Diberkatilah Dia yang datang dalam nama Tuhan!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Seruan ini menggemakan Mazmur 118:26.
    reason: cross_reference
  - marker: b
    text: “Hosana” berasal dari seruan liturgis Ibrani/Aram yang kurang lebih berarti “selamatkanlah kiranya” atau “selamatkanlah sekarang”; di sini seruan itu juga berfungsi sebagai aklamasi pujian.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: orang-orang yang berjalan di depan
  rationale: Partisipel kini substantival menunjuk kepada kelompok di bagian depan arak-arakan; pilihan ini alami dan mempertahankan gambaran tindakan yang sedang berlangsung.
- source_word: οἱ ἀκολουθοῦντες
  choice: yang mengikuti
  rationale: Partisipel kini substantival yang sejajar dengan οἱ προάγοντες; terjemahan ini menggambarkan kelompok yang berjalan di belakang tanpa mengubahnya menjadi tindakan lampau.
- source_word: ἔκραζον
  choice: terus berseru
  rationale: Bentuk imperfek menunjukkan seruan yang berlangsung atau berulang. 'Terus berseru' menyampaikan aspek itu dan cocok untuk aklamasi umum.
- source_word: Ὡσαννά
  choice: Hosana
  rationale: Ungkapan liturgis serapan dari bahasa Ibrani/Aram dipertahankan melalui transliterasi karena di sini berfungsi sebagai seruan aklamasi sekaligus masih mengandung gema permohonan keselamatan.
- source_word: Εὐλογημένος
  choice: Diberkatilah
  rationale: Bentuk ini mempertahankan nuansa pasif dan gaya formula berkat dalam gema Mazmur 118:26.
- source_word: ὁ ἐρχόμενος
  choice: Dia yang datang
  rationale: Partisipel kini berartikel berfungsi substantival. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan gelar mesianik yang tidak tersurat dalam teks Yunani.
- source_word: ἐν ὀνόματι κυρίου
  choice: dalam nama Tuhan
  rationale: Mempertahankan ungkapan alkitabiah yang menyiratkan datang dengan wewenang atau sebagai wakil Tuhan, sekaligus menjaga gema kutipan mazmur.
- source_word: κυρίου
  choice: Tuhan
  rationale: Padanan baku bagi κύριος dalam formula ini; kapitalisasi sesuai penggunaan sebagai sebutan ilahi.
theological_decisions:
- issue: Apakah identitas mesianik dalam aklamasi perlu dibuat eksplisit
  choice: Mempertahankan rumusan 'Diberkatilah Dia yang datang dalam nama Tuhan' tanpa menambahkan 'Mesias' atau 'Raja'.
  alternative: Menulis 'Diberkatilah Mesias yang datang dalam nama Tuhan' atau menafsirkan 'Dia yang datang' sebagai gelar eksplisit.
  rationale: Dalam konteksnya ucapan ini bermakna mesianik dan menggemakan Mazmur 118:26, tetapi teks Yunani ayat ini tidak menyebut gelar tersebut. Rumusan yang dekat dengan sumber mempertahankan daya teologis dan ketegangannya tanpa perluasan tafsiran.
translation_notes:
  register: 'Bahasa Indonesia modern yang wajar dan bermartabat. Paralel kedua kelompok dipertahankan, sedangkan aspek imperfek dinyatakan dengan ''terus''. Urutan penanda catatan kaki mengikuti urutan informasi yang dirujuk dalam teks: [a] pada keseluruhan seruan sebagai gema mazmur dan [b] sesudah ''Hosana'' secara konseptual, meski keduanya ditempatkan bersama setelah verba agar kalimat kutipan tetap lancar.'
