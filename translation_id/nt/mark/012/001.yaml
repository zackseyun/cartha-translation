  naturalness: 'Teks revisi memakai Bahasa Indonesia baku yang lebih lancar: «mulai berbicara kepada mereka dalam perumpamaan» merupakan idiom naratif yang alami; «menggali lubang penampungan sari anggur» menghindari rangkaian yang janggal «lubang penampung untuk tempat pemerasan anggur».'
  terminology: «Kebun anggur», «pagar», «menara», dan «para penggarap» sesuai register dan konteks agraris. «Seorang pria» secara wajar menyatakan ἄνθρωπος sebagai tokoh laki-laki dalam cerita tanpa menambah jabatan seperti pemilik. Catatan kaki mempertahankan alternatif leksikal dan gema Yesaya 5:1–2.
