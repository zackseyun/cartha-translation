source:
  edition: SBLGNT
  text: Καὶ ἤρξατο αὐτοῖς ἐν παραβολαῖς ⸀λαλεῖν· Ἀμπελῶνα ⸂ἄνθρωπος ἐφύτευσεν⸃, καὶ περιέθηκεν φραγμὸν καὶ ὤρυξεν ὑπολήνιον καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/001.yaml
  text: 'And he began to speak to them in parables: “A man planted a vineyard[a], and put a fence around it, and dug a winepress pit, and built a tower, and leased it to tenant farmers[d][c][b], and went away.”'
translation:
  language: id
  text: 'Lalu Yesus mulai berbicara kepada mereka dalam perumpamaan: “Seorang pria menanam sebuah kebun anggur, memasang pagar di sekelilingnya,[a] menggali lubang penampungan sari anggur,[b] dan membangun sebuah menara. Kemudian ia menyewakan kebun itu kepada para penggarap[c][d] lalu pergi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuat pagar tanaman di sekelilingnya.” Kata Yunani φραγμός dapat berarti pagar, pagar tanaman, atau pembatas yang mengelilingi suatu tempat.
    reason: lexical_alternative
  - marker: b
    text: Atau “menggali lubang untuk pemerasan anggur.” Kata Yunani ὑπολήνιον menunjuk secara khusus pada wadah atau lubang bagian bawah tempat sari anggur tertampung.
    reason: lexical_alternative
  - marker: c
    text: Atau “menyewakannya kepada para petani” atau “kepada para pekerja kebun anggur.”
    reason: lexical_alternative
  - marker: d
    text: Gambaran ini menggemakan Yesaya 5:1–2, yang menceritakan sebuah kebun anggur yang ditanami, dipagari, dan diperlengkapi.
    reason: cross_reference
lexical_decisions:
- source_word: ἤρξατο ... λαλεῖν
  choice: mulai berbicara
  rationale: Konstruksi inkoatif ini secara alami menyatakan awal tindakan berbicara.
- source_word: ἐν παραβολαῖς
  choice: dengan perumpamaan-perumpamaan
  rationale: Bentuk jamak dipertahankan; frasa ini menyatakan cara atau bentuk Yesus berbicara.
- source_word: Ἀμπελῶνα ἄνθρωπος ἐφύτευσεν
  choice: Seorang menanami sebuah kebun anggur
  rationale: Susunan Indonesia yang alami dengan referen laki-laki yang tidak ditentukan; verba 'menanami' cocok untuk objek berupa lahan kebun.
- source_word: περιέθηκεν φραγμόν
  choice: memasang pagar di sekelilingnya
  rationale: Mengungkapkan batas pelindung tanpa menentukan bahannya; kemungkinan 'pagar tanaman' dicatat dalam catatan kaki.
- source_word: ὤρυξεν ὑπολήνιον
  choice: menggali lubang penampung untuk tempat pemerasan anggur
  rationale: ὑπολήνιον menunjuk pada wadah atau lubang bagian bawah yang menampung sari anggur, bukan keseluruhan alat pemeras.
- source_word: ᾠκοδόμησεν πύργον
  choice: membangun sebuah menara
  rationale: Padanan langsung yang mempertahankan rangkaian persiapan kebun.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: menyewakan kebun itu kepada para penggarap
  rationale: Konteks sewa menunjukkan bahwa γεωργοί adalah penggarap lahan milik orang lain; 'para penggarap' jelas dan alami.
- source_word: ἀπεδήμησεν
  choice: pergi ke negeri lain
  rationale: Verba ini menyiratkan pergi meninggalkan tempat kediaman atau berada jauh untuk suatu waktu; pilihan ini lebih jelas daripada sekadar 'pergi' tanpa memaksakan gagasan perjalanan tertentu.
theological_decisions:
- issue: Subjek tersirat pada ἤρξατο
  choice: Yesus
  alternative: ia
  rationale: Bahasa Indonesia lebih jelas dengan menyebut kembali subjek yang tersedia dari konteks langsung, tanpa mengubah referennya.
- issue: Hubungan γεωργοί dengan pemilik kebun
  choice: para penggarap
  alternative: para petani; para penyewa kebun
  rationale: Pilihan ini mempertahankan peran pertanian mereka, sedangkan verba 'menyewakan' sudah menjelaskan hubungan sewa dan kepemilikan tanpa menjadikan nomina terlalu interpretatif.
- issue: Gema Yesaya 5:1–2
  choice: dipertahankan melalui citra kebun anggur, pagar, tempat pemerasan, dan menara
  alternative: menjelaskan identitas simbolis kebun dalam teks utama
  rationale: Ayat ini menggema gambaran Yesaya, tetapi tidak secara eksplisit menafsirkan setiap unsur; penjelasan lintas rujukan ditempatkan dalam catatan kaki agar ketegangan perumpamaan tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Rangkaian tindakan dibuat lancar, istilah pertanian dijelaskan tanpa bahasa teknis berlebihan, dan semua penanda catatan kaki ditempatkan pada unsur terkait dalam teks utama.
