revisions:
- from: 'Lalu Yesus mulai berbicara kepada mereka dengan perumpamaan-perumpamaan: “Seorang menanami sebuah kebun anggur, memasang pagar di sekelilingnya,[a] menggali lubang penampung untuk tempat pemerasan anggur,[b] dan membangun sebuah menara. Kemudian ia menyewakan kebun itu kepada para penggarap[c][d] lalu pergi ke negeri lain.”'
  to: 'Lalu Yesus mulai berbicara kepada mereka dalam perumpamaan: “Seorang pria menanam sebuah kebun anggur, memasang pagar di sekelilingnya,[a] menggali lubang penampungan sari anggur,[b] dan membangun sebuah menara. Kemudian ia menyewakan kebun itu kepada para penggarap[c][d] lalu pergi.”'
  rationale: Revisi mengoreksi dua penambahan/ketidakakuratan utama dan memperhalus idiom Indonesia tanpa mengubah makna perumpamaan. Bentuk tunggal «dalam perumpamaan» berfungsi idiomatis sebagai cara Yesus berbicara, sementara ketidakpastian cakupan plural Yunani tidak perlu dipaksakan menjadi pengulangan nomina yang kurang alami. Semua jangkar catatan kaki tetap melekat pada unsur yang tepat.
