id: MRK.12.29
reference: Mark 12:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂ἀπεκρίθη ὁ Ἰησοῦς⸃ ὅτι Πρώτη ⸀ἐστίν· Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/029.yaml
  text: 'Jesus answered[a], “The first is: Hear, O Israel, the Lord our God[b], the Lord is one.'
translation:
  language: id
  text: 'Yesus menjawab, “Yang pertama ialah: ‘Dengarlah, hai Israel, Tuhan Allah kita, Tuhan itu esa.[a]’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tuhan Allah kita adalah Tuhan yang esa,” atau, “Tuhanlah Allah kita, hanya Tuhan.” Teks Yunani menggemakan Ulangan 6:4 dan dapat menekankan keesaan Allah, bahwa hanya Dialah Tuhan, atau keduanya.
    reason: alternative_reading
  - marker: b
    text: Kalimat ini mengutip Syema (Ul. 6:4). Karena itu, “Tuhan” di sini menerjemahkan kata Yunani κύριος, yang dalam Septuaginta digunakan untuk nama ilahi YHWH.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Padanan naratif yang wajar untuk tanggapan Yesus dalam percakapan.
- source_word: Πρώτη
  choice: Yang pertama
  rationale: Kata sifat ini dipakai secara substantival dan mengacu pada perintah yang ditanyakan dalam konteks, tanpa perlu menambahkan kata itu ke dalam teks.
- source_word: Ἄκουε
  choice: Dengarlah
  rationale: Bentuk imperatif ini mempertahankan seruan pembuka Syema dan tetap alami dalam bahasa Indonesia.
- source_word: Ἰσραήλ
  choice: hai Israel
  rationale: Partikel “hai” menandai sapaan langsung dengan ragam yang bermartabat dan lazim dalam kutipan Kitab Suci.
- source_word: κύριος
  choice: Tuhan
  rationale: Dalam kutipan Syema ini, κύριος mencerminkan pemakaian Septuaginta untuk nama ilahi YHWH; “Tuhan” mempertahankan bentuk teks Yunani dan bobot teologisnya.
- source_word: θεὸς ἡμῶν
  choice: Allah kita
  rationale: Padanan langsung dan alami bagi konstruksi posesif Yunani.
- source_word: εἷς
  choice: esa
  rationale: “Esa” adalah ungkapan Indonesia yang ringkas, bermartabat, dan lazim bagi pengakuan tentang keesaan Allah, tanpa memperluasnya menjadi “satu-satunya”.
theological_decisions:
- issue: Terjemahan klausa terakhir Syema dan ketegangan antara keesaan serta keeksklusifan Allah
  choice: Tuhan Allah kita, Tuhan itu esa
  alternative: Tuhan Allah kita adalah Tuhan yang esa; Tuhanlah Allah kita, hanya Tuhan
  rationale: Pilihan utama mengikuti urutan Yunani secara cukup dekat dan menyatakan keesaan Allah tanpa memutuskan secara berlebihan apakah tekanannya hanya pada keesaan, hanya pada kesetiaan eksklusif, atau pada keduanya. Alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Dengarlah, hai Israel” mempertahankan corak seruan liturgis Syema, sedangkan “esa” mempertahankan kepadatan teologis εἷς. Penanda catatan [a] ditempatkan setelah klausa yang memiliki alternatif penafsiran, dan [b] setelah seluruh kutipan yang berlatar Syema.
