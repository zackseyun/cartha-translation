  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan unsur-unsur SBLGNT: ἀπεκρίθη (“menjawab”), Πρώτη (“Yang pertama”), seruan Ἄκουε, Ἰσραήλ (“Dengarlah, hai Israel”), serta pengakuan κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν. “Tuhan Allah kita, Tuhan itu esa” mempertahankan kepadatan dan susunan parataktis kutipan Syema tanpa memaksakan salah satu pembacaan eksklusivitas atau keesaan secara berlebihan.'
  naturalness: Bahasanya baku, modern, dan cocok untuk register Kitab Suci. “Dengarlah, hai Israel” wajar sebagai seruan liturgis/khidmat, dan “esa” merupakan pilihan yang idiomatis untuk pengakuan tentang Allah dalam bahasa Indonesia. Tanda kutip bersarang juga jelas.
  terminology: “Yesus,” “Tuhan,” “Allah,” dan “esa” digunakan secara konsisten dan tepat. Catatan tentang κύριος sebagai padanan Septuaginta bagi nama YHWH memberi konteks tekstual yang cukup tanpa mengubah terjemahan utama. Catatan alternatif secara tepat mempertahankan ambiguitas yang melekat pada kutipan Ulangan 6:4.
