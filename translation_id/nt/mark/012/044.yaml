source:
  edition: SBLGNT
  text: πάντες γὰρ ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον, αὕτη δὲ ἐκ τῆς ὑστερήσεως αὐτῆς πάντα ὅσα εἶχεν ἔβαλεν, ὅλον τὸν βίον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/044.yaml
  text: For they all gave out of their abundance[a], but she, out of her poverty, put in everything she had—her whole livelihood.
translation:
  language: id
  text: Sebab mereka semua memberi dari kelimpahan mereka, tetapi perempuan ini, dari kekurangannya, memasukkan segala yang dimilikinya—seluruh sumber penghidupannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “segala yang dimilikinya untuk menyambung hidup.”'
    reason: alternatif leksikal untuk “seluruh sumber penghidupannya” (ὅλον τὸν βίον αὐτῆς).
lexical_decisions:
- source_word: πάντες γὰρ
  choice: Sebab mereka semua
  rationale: Menjaga hubungan penjelas γὰρ dengan ayat sebelumnya dan cakupan menyeluruh πάντες dalam susunan Indonesia yang alami.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: dari kelimpahan mereka
  rationale: Mengungkapkan sumber pemberian sebagai harta yang melebihi kebutuhan, tanpa mempersempitnya hanya menjadi uang sisa.
- source_word: ἔβαλον
  choice: memberi
  rationale: Dalam konteks persembahan, 'memberi' menyampaikan fungsi tindakan secara alami, meskipun arti dasar βάλλω ialah memasukkan atau melemparkan.
- source_word: αὕτη δὲ
  choice: tetapi perempuan ini
  rationale: Menegaskan kontras dengan para pemberi lain dan membuat rujukan demonstratif αὕτη jelas dalam bahasa Indonesia.
- source_word: ἐκ τῆς ὑστερήσεως αὐτῆς
  choice: dari kekurangannya
  rationale: ὑστέρησις menunjuk keadaan berkekurangan atau kekurangan kebutuhan. Pilihan ini mempertahankan keluasan makna tanpa menyisipkan kategori sosial-ekonomi yang lebih spesifik daripada teks.
- source_word: πάντα ὅσα εἶχεν
  choice: segala yang dimilikinya
  rationale: Mempertahankan penekanan menyeluruh pada semua miliknya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: ἔβαλεν
  choice: memasukkan
  rationale: Mencerminkan tindakan konkret menaruh persembahan ke dalam peti persembahan dan mempertahankan nuansa dasar verba βάλλω.
- source_word: ὅλον τὸν βίον αὐτῆς
  choice: seluruh nafkah hidupnya
  rationale: Dalam konteks pemberian uang, βίος berarti sarana penghidupan atau bekal untuk hidup, bukan kehidupan biologisnya.
theological_decisions:
- issue: Makna βίος dalam ucapan tentang persembahan janda
  choice: sarana penghidupan ('nafkah hidup')
  alternative: seluruh hidupnya
  rationale: Konteksnya adalah pemberian uang, dan βίος dapat menunjuk sarana untuk mempertahankan hidup. Terjemahan ini menjaga bobot pengorbanan total tanpa menyatakan bahwa ia secara harfiah menyerahkan nyawanya.
- issue: Makna ὑστέρησις
  choice: keadaan berkekurangan
  alternative: kemiskinan
  rationale: '''Kekurangan'' dekat dengan makna leksikal keadaan tidak memiliki cukup dan tidak menentukan tingkat kemiskinan secara lebih khusus daripada ungkapan Yunani.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada sederhana dan bermartabat. Kontras antara kelimpahan banyak orang dan kekurangan perempuan itu dipertahankan. Tanda pisah menonjolkan penjelasan klimaks tentang seluruh sarana hidupnya.
