id: MRK.12.12
reference: Mark 12:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐζήτουν αὐτὸν κρατῆσαι, καὶ ἐφοβήθησαν τὸν ὄχλον, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς τὴν παραβολὴν εἶπεν. καὶ ἀφέντες αὐτὸν ἀπῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/012.yaml
  text: And they were seeking to seize him[a], but they feared the crowd, for they knew that he had spoken the parable against them. So they left him and went away.
translation:
  language: id
  text: Mereka berusaha menangkap-Nya, tetapi takut kepada orang banyak, sebab mereka tahu bahwa Yesus telah menyampaikan perumpamaan itu ditujukan kepada mereka.[a] Lalu mereka meninggalkan-Nya dan pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tentang mereka” atau “terhadap mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: berusaha
  rationale: Bentuk imperfek menggambarkan usaha yang sedang berlangsung atau dicoba; “berusaha” menyampaikan aspek tersebut secara alami dalam bahasa Indonesia.
- source_word: κρατῆσαι
  choice: menangkap
  rationale: Dalam konteks permusuhan ini, kata tersebut berarti memegang atau menangkap. “Menangkap” alami dan tidak secara khusus mengandaikan proses hukum resmi seperti “menahan”.
- source_word: ἐφοβήθησαν τὸν ὄχλον
  choice: mereka takut kepada orang banyak
  rationale: Terjemahan ini langsung, jelas, dan mempertahankan orang banyak sebagai pihak yang mereka takuti.
- source_word: ἔγνωσαν
  choice: mereka tahu
  rationale: Pilihan ini mempertahankan arti langsung pengenalan atau pengetahuan tanpa menambahkan penafsiran seperti “menyadari”.
- source_word: πρὸς αὐτοὺς
  choice: untuk menyindir mereka
  rationale: Dalam konteks yang bermusuhan, frasa ini menunjukkan bahwa perumpamaan tersebut diarahkan kepada mereka dengan maksud mengecam. “Menyindir mereka” mengungkapkan daya pragmatis itu secara alami, sementara kemungkinan arti yang lebih netral dipertahankan dalam catatan kaki.
- source_word: τὴν παραβολὴν
  choice: perumpamaan itu
  rationale: Kata penunjuk “itu” secara alami merujuk kepada perumpamaan yang baru saja disampaikan dalam konteks sebelumnya.
- source_word: εἶπεν
  choice: telah menyampaikan
  rationale: Kata “telah” menandai bahwa penyampaian perumpamaan mendahului pengetahuan mereka; “menyampaikan” idiomatis untuk sebuah perumpamaan.
- source_word: ἀφέντες αὐτὸν
  choice: meninggalkan Dia
  rationale: Partisip ini menyatakan bahwa mereka membiarkan Yesus dan menghentikan upaya tersebut; “meninggalkan Dia” paling jelas dalam konteks.
- source_word: ἀπῆλθον
  choice: pergi
  rationale: Pilihan sederhana dan alami ini menyampaikan gerak meninggalkan tempat tanpa corak arkais.
theological_decisions:
- issue: Daya makna πρὸς αὐτούς
  choice: untuk menyindir mereka
  alternative: mengenai mereka / ditujukan kepada mereka
  rationale: Konteks menunjukkan arah yang merugikan atau mengecam, tetapi konstruksi Yunani sendiri juga dapat dipahami secara lebih netral. Karena itu, teks utama memakai ungkapan alami yang sesuai konteks dan catatan kaki mempertahankan ambiguitas leksikal.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama “Yesus” dipakai untuk memperjelas rujukan pronomina Yunani dalam kalimat yang memiliki beberapa pelaku; “Dia” mempertahankan rujukan yang jelas tanpa terasa kaku.
