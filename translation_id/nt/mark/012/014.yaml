revisions:
- from: Lalu mereka datang dan berkata kepada-Nya, “Guru, kami tahu bahwa Engkau jujur dan tidak mencari muka kepada siapa pun,[a] sebab Engkau tidak memandang kedudukan orang, melainkan mengajarkan jalan Allah sesuai dengan kebenaran. Apakah membayar pajak kepala kepada Kaisar diperbolehkan atau tidak? Haruskah kami membayarnya,[b] atau tidak?”
  to: Lalu mereka datang dan berkata kepada-Nya, “Guru, kami tahu bahwa Engkau jujur dan tidak terpengaruh oleh siapa pun,[a] sebab Engkau tidak memandang kedudukan orang, melainkan mengajarkan jalan Allah dengan benar. Apakah membayar pajak kepala kepada Kaisar diperbolehkan atau tidak? Haruskah kami membayarnya,[b] atau tidak?”
  rationale: Revisi mengganti idiom Indonesia yang tidak sepadan pada klausa pertama dengan “tidak terpengaruh oleh siapa pun,” yang menyampaikan fungsi kontekstual ungkapan Yunani tanpa menyatakan bahwa Yesus tidak berbelas kasih terhadap manusia. Klausa kedua tetap menerjemahkan idiom “memandang wajah” secara alami sebagai mempertimbangkan kedudukan orang, sementara bentuk yang lebih harfiah dan maknanya didokumentasikan dalam catatan a. “Dengan benar” merupakan padanan Indonesia yang alami untuk ἐπ’ ἀληθείας dalam kaitannya dengan tindakan mengajar.
