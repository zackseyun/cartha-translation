  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀καὶ ἐλθόντες λέγουσιν αὐτῷ· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν ⸂δοῦναι κῆνσον Καίσαρι⸃ ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/014.yaml
  text: And they came and said to him[a], “Teacher, we know that you are truthful and do not care about anyone, for you do not look at the face of men, but truly teach the way of God. Is it lawful to pay the poll tax to Caesar or not? Should we pay it[b], or should we not pay it?”
translation:
  language: id
  text: Lalu mereka datang dan berkata kepada-Nya, “Guru, kami tahu bahwa Engkau jujur dan tidak terpengaruh oleh siapa pun,[a] sebab Engkau tidak memandang kedudukan orang, melainkan mengajarkan jalan Allah dengan benar. Apakah membayar pajak kepala kepada Kaisar diperbolehkan atau tidak? Haruskah kami membayarnya,[b] atau tidak?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Engkau tidak memedulikan siapa pun, sebab Engkau tidak memandang wajah manusia.” Maksudnya, Engkau tidak dipengaruhi oleh status, kedudukan, atau penampilan orang.'
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani κῆνσος menunjuk pada pajak sensus atau pajak kepala yang dipungut oleh pemerintahan Romawi.
    reason: cultural_note
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Sapaan baku dan alami dalam bahasa Indonesia yang mempertahankan peran Yesus sebagai pengajar.
- source_word: ἀληθὴς
  choice: jujur
  rationale: Dalam predikat tentang pribadi, kata ini menyatakan bahwa Yesus tulus dan mengatakan kebenaran; 'jujur' alami dalam bahasa Indonesia.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: tidak mencari muka kepada siapa pun
  rationale: Ungkapan ini dalam konteks menyatakan bahwa Yesus tidak berusaha menyenangkan atau mengambil hati orang demi kepentingan pribadi; pilihan ini juga berpaut dengan alasan yang menyusul tentang tidak memandang kedudukan.
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: sebab Engkau tidak memandang kedudukan orang
  rationale: Secara harfiah berbicara tentang memandang wajah manusia, tetapi secara idiomatis berarti tidak dipengaruhi status, gengsi, atau penampilan luar seseorang.
- source_word: ἐπ’ ἀληθείας
  choice: sesuai dengan kebenaran
  rationale: Mempertahankan kaitan eksplisit dengan kebenaran dan secara alami menerangkan cara Yesus mengajar.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: jalan Allah
  rationale: Mempertahankan metafora alkitabiah tentang jalan yang berasal dari atau ditetapkan Allah.
- source_word: ἔξεστιν
  choice: diperbolehkan
  rationale: Menyampaikan pertanyaan mengenai apa yang sah atau diizinkan tanpa membatasi rujukannya hanya pada hukum Romawi atau Taurat.
- source_word: δοῦναι κῆνσον Καίσαρι
  choice: membayar pajak kepala kepada Kaisar
  rationale: κῆνσος menunjuk pada pajak sensus atau pajak perorangan Romawi; dalam konteks pajak, δοῦναι secara alami diterjemahkan 'membayar'.
- source_word: Καίσαρι
  choice: Kaisar
  rationale: Bentuk konvensional bahasa Indonesia untuk gelar atau nama penguasa Romawi.
- source_word: δῶμεν ἢ μὴ δῶμεν
  choice: Haruskah kami membayarnya, atau tidak?
  rationale: Mempertahankan desakan pertanyaan jebakan, sementara sufiks '-nya' menjelaskan bahwa yang dimaksud ialah pajak tersebut.
theological_decisions:
- issue: Makna ungkapan tentang sikap terhadap manusia dan wajah manusia
  choice: tidak mencari muka kepada siapa pun ... tidak memandang kedudukan orang
  alternative: tidak peduli kepada siapa pun ... tidak memandang wajah manusia
  rationale: Terjemahan utama menyampaikan daya idiomatis kedua klausa tanpa memberi kesan bahwa Yesus tidak memiliki kepedulian terhadap manusia. Maknanya ialah Ia tidak dapat dipengaruhi oleh sanjungan, status, atau gengsi.
- issue: Lingkup pertanyaan ἔξεστιν
  choice: diperbolehkan
  alternative: sesuai dengan hukum
  rationale: Bahasa Yunani dapat menyangkut apa yang diizinkan secara hukum, moral, atau agama. 'Diperbolehkan' menjaga keluasan itu dan tidak memutuskan hukum mana yang terutama dipersoalkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan hormat kepada Yesus memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Diksi dibuat jelas bagi pembaca umum, sambil mempertahankan ungkapan alkitabiah 'jalan Allah' dan ketegangan pertanyaan mengenai apa yang diperbolehkan.
