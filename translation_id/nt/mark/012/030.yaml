  text: καὶ ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ψυχῆς σου καὶ ἐξ ὅλης τῆς διανοίας σου καὶ ἐξ ὅλης τῆς ἰσχύος ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/030.yaml
  text: And you shall love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength[a][b][c].
translation:
  language: id
  text: Dan kasihilah Tuhan, Allahmu, dengan segenap hatimu, dengan segenap jiwamu[a], dengan segenap pikiranmu[b], dan dengan segenap kekuatanmu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hidupmu” untuk “jiwamu” (ψυχῆς).
    reason: lexical_alternative
  - marker: b
    text: Atau “pengertianmu” untuk “pikiranmu” (διανοίας).
    reason: lexical_alternative
  - marker: c
    text: Atau “dayamu” untuk “kekuatanmu” (ἰσχύος).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπήσεις
  choice: Kasihilah
  rationale: Bentuk futurum dalam kutipan perintah ini berdaya imperatif. Imperatif Indonesia yang langsung dan wajar menyampaikan kekuatan perintah tanpa menjadi kuno.
- source_word: κύριον τὸν θεόν σου
  choice: Tuhan, Allahmu
  rationale: Menyampaikan rumusan perjanjian dengan alami dalam bahasa Indonesia; aposisi dengan koma memperjelas bahwa 'Tuhan' adalah 'Allahmu'.
- source_word: ἐξ ὅλης
  choice: dengan segenap
  rationale: Dalam idiom ini ἐξ menyatakan pengerahan seluruh diri. 'Dengan segenap' alami, bermartabat, dan mempertahankan penekanan pada totalitas.
- source_word: καρδίας
  choice: hati
  rationale: Padanan mapan yang mempertahankan gambaran pusat batin, kehendak, dan kasih tanpa mempersempit maknanya.
- source_word: ψυχῆς
  choice: jiwa
  rationale: Menjaga pembedaan leksikal dalam rangkaian empat unsur; kemungkinan makna 'hidup' dicatat dalam catatan kaki.
- source_word: διανοίας
  choice: pikiran
  rationale: Padanan Indonesia yang paling alami bagi kemampuan berpikir dan memahami; alternatif 'pengertian' dicatat.
- source_word: ἰσχύος
  choice: kekuatan
  rationale: Menyatakan daya atau kemampuan dengan jelas dan tetap berbeda dari hati, jiwa, dan pikiran.
- source_word: καὶ ... καὶ ... καὶ ... καὶ
  choice: pengulangan 'dengan segenap' serta 'dan' sebelum unsur terakhir
  rationale: Bahasa Indonesia tidak memerlukan 'dan' pada setiap unsur, tetapi pengulangan frasa 'dengan segenap' mempertahankan irama kumulatif dan penekanan totalitas sumber.
theological_decisions:
- issue: Penerjemahan κύριος dalam kutipan perintah
  choice: Tuhan
  alternative: TUHAN; Tuan
  rationale: Teks Yunani memakai κύριος. 'Tuhan' sesuai dengan penggunaan Perjanjian Baru dan gema rumusan perjanjian tanpa memasukkan tipografi nama ilahi yang tidak tampak dalam teks Yunani.
- issue: Istilah antropologis dalam perintah empat unsur
  choice: hati / jiwa / pikiran / kekuatan
  alternative: hati / hidup / pengertian / daya
  rationale: Istilah-istilah yang berbeda dipertahankan, bukan dilebur menjadi pernyataan umum tentang seluruh diri, sehingga keragaman dan ketegangan retoris-teologis teks tetap terbuka.
- issue: Daya perintah pada bentuk futurum ἀγαπήσεις
  choice: Kasihilah
  alternative: Engkau harus mengasihi; engkau akan mengasihi
  rationale: Dalam konteks kutipan hukum, futurum Yunani membawa daya imperatif. Imperatif langsung paling jelas dan alami dalam bahasa Indonesia modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'Kasihilah' mempertahankan nada perintah Kitab Suci tanpa kejanggalan arkais. Pengulangan 'dengan segenap' menjaga tekanan retoris pada pengabdian yang menyeluruh.
