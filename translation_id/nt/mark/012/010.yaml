source:
  edition: SBLGNT
  text: οὐδὲ τὴν γραφὴν ταύτην ἀνέγνωτε· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/010.yaml
  text: 'Have you not even read this Scripture: ‘The stone that the builders rejected[a], this has become the cornerstone’?”'
translation:
  language: id
  text: '“Tidakkah kamu bahkan pernah membaca nas Kitab Suci ini: ‘Batu yang ditolak oleh para pembangun, batu itu telah menjadi batu penjuru[a]’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepala sudut”; secara tradisional, “batu penjuru utama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφὴν
  choice: bagian Kitab Suci
  rationale: Dalam Perjanjian Baru, γραφή lazim menunjuk pada Kitab Suci. Kata penunjuk ταύτην membuat 'bagian Kitab Suci ini' alami dalam bahasa Indonesia dan sesuai dengan kutipan tertentu yang menyusul.
- source_word: οὐδὲ ... ἀνέγνωτε
  choice: Belum pernahkah kamu membaca
  rationale: Pertanyaan retoris ini menegur para pendengar karena gagal memperhatikan nas yang tersedia bagi mereka. 'Belum pernahkah' menyampaikan daya teguran οὐδέ secara alami tanpa terjemahan kaku 'bahkan tidak'.
- source_word: Λίθον
  choice: Batu
  rationale: Walaupun tanpa kata sandang dalam bahasa Yunani, batu yang dimaksud bersifat tertentu dalam kutipan Mazmur 118; bahasa Indonesia tidak memerlukan penanda definiteness tersendiri.
- source_word: ἀπεδοκίμασαν
  choice: ditolak
  rationale: Kata ini berarti menolak setelah menilai atau menguji. 'Ditolak' merupakan padanan Indonesia yang paling jelas dan alami dalam metafora tersebut.
- source_word: οἱ οἰκοδομοῦντες
  choice: tukang-tukang bangunan
  rationale: Partisipel ini berfungsi sebagai nomina dan menunjuk kepada orang-orang yang membangun. Bentuk ini jelas dan mempertahankan metafora pembangunan.
- source_word: ἐγενήθη
  choice: telah menjadi
  rationale: Bentuk aoris menyatakan perubahan status yang sudah terjadi; 'telah menjadi' secara alami menonjolkan hasilnya yang tetap penting.
- source_word: εἰς κεφαλὴν γωνίας
  choice: batu penjuru
  rationale: Ungkapan harfiahnya adalah 'kepala sudut'. 'Batu penjuru' merupakan istilah Indonesia yang mapan dan jelas, sambil tetap mempertahankan citra arsitektural.
theological_decisions:
- issue: Penggunaan mesianik atas gambaran Mazmur 118:22
  choice: Mempertahankan metafora batu, para pembangun, dan batu penjuru tanpa menjelaskan identitasnya di dalam teks utama.
  alternative: Menambahkan secara eksplisit bahwa batu itu adalah Mesias atau Yesus.
  rationale: Dalam konteksnya, kutipan ini diterapkan kepada Yesus, tetapi teks sumber mempertahankan bentuk metaforis. Terjemahan tidak boleh menyisipkan penafsiran itu ke dalam bunyi kutipan.
- issue: Makna κεφαλὴ γωνίας
  choice: batu penjuru
  alternative: kepala sudut; batu utama pada sudut; batu puncak
  rationale: Frasa Yunani dapat dipahami secara harfiah sebagai 'kepala sudut', dan rincian arsitekturalnya dapat diperdebatkan. 'Batu penjuru' mempertahankan metafora pokok tanpa memastikan secara berlebihan letak khusus batu tersebut.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina 'kamu' dipakai sebagai sapaan jamak yang alami dalam konteks percakapan, tanpa menambahkan penanda jumlah yang tidak diperlukan. Struktur pertanyaan mempertahankan nada teguran Yesus, sedangkan kutipan tetap ringkas dan puitis.
