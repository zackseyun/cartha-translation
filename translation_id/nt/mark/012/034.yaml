source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς ἰδὼν ⸀αὐτὸν ὅτι νουνεχῶς ἀπεκρίθη εἶπεν αὐτῷ· Οὐ μακρὰν εἶ ἀπὸ τῆς βασιλείας τοῦ θεοῦ. καὶ οὐδεὶς οὐκέτι ἐτόλμα αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/034.yaml
  text: And Jesus[a], seeing that he had answered wisely, said to him, “You are not far from the kingdom of God.” And no one any longer dared to question him.
translation:
  language: id
  text: Yesus melihat bahwa orang itu telah menjawab dengan bijaksana, lalu berkata kepadanya, “Engkau tidak jauh dari Kerajaan Allah.”[a] Dan tidak seorang pun lagi berani mengajukan pertanyaan kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau dekat dengan Kerajaan Allah.” Bahasa Yunani menyatakan kedekatan, bukan secara tegas bahwa orang itu telah masuk ke dalam Kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: ketika ... melihat
  rationale: Partisip aoris ini dialihkan menjadi anak kalimat waktu yang alami dalam bahasa Indonesia, sambil mempertahankan pengamatan Yesus sebagai latar bagi ucapan-Nya.
- source_word: νουνεχῶς
  choice: dengan bijaksana
  rationale: Adverbia ini menunjukkan jawaban yang penuh pengertian dan pertimbangan yang baik; ‘dengan bijaksana’ jelas, alami, dan bernada penghargaan.
- source_word: ἀπεκρίθη
  choice: telah menjawab
  rationale: Kata ‘telah’ memperjelas bahwa jawaban orang itu mendahului ucapan Yesus, tanpa membuat susunan kalimat menjadi kaku.
- source_word: Οὐ μακρὰν εἶ ἀπὸ
  choice: Engkau tidak jauh dari
  rationale: Pilihan ini mempertahankan metafora jarak dalam teks Yunani dan tidak mengubah kedekatan menjadi pernyataan bahwa orang itu sudah masuk.
- source_word: βασιλείας τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ungkapan baku ini mempertahankan cakupan makna pemerintahan dan ranah kekuasaan Allah dalam konteks Injil Sinoptik.
- source_word: οὐκέτι
  choice: Sesudah itu ... lagi
  rationale: Susunan ini menyampaikan bahwa sejak saat tersebut tidak ada lagi orang yang berani melanjutkan pertanyaan kepada Yesus.
- source_word: ἐτόλμα
  choice: berani
  rationale: Kata ini langsung dan idiomatis untuk tindakan yang tidak lagi mereka lakukan karena tidak memiliki keberanian.
- source_word: ἐπερωτῆσαι
  choice: mengajukan pertanyaan
  rationale: Ungkapan ini lebih tepat daripada sekadar ‘bertanya’ untuk konteks rangkaian pertanyaan yang diajukan kepada Yesus, tanpa melebihkannya menjadi ‘menginterogasi’.
theological_decisions:
- issue: Kedudukan ahli Taurat itu terhadap keselamatan atau Kerajaan Allah
  choice: Engkau tidak jauh dari Kerajaan Allah
  alternative: Engkau dekat dengan Kerajaan Allah
  rationale: Teks Yunani menyatakan kedekatan, bukan kepemilikan atau masuknya orang itu ke dalam Kerajaan. Terjemahan ini mempertahankan ketegangan antara pujian Yesus atas pengertiannya dan tidak adanya pernyataan tegas bahwa ia sudah berada di dalam Kerajaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia; ‘orang itu’ menjernihkan rujukan pronomina tanpa mengulang gelar dari konteks sebelumnya.
