  terminology: “Yesus,” “Kerajaan Allah,” dan kapitalisasi pronomina ilahi konsisten dengan register Alkitab Indonesia modern. Catatan kaki tepat mempertahankan ambiguitas kedekatan tanpa menyelesaikannya secara teologis.
