  text: καὶ ἀπέστειλεν πρὸς τοὺς γεωργοὺς τῷ καιρῷ δοῦλον, ἵνα παρὰ τῶν γεωργῶν λάβῃ ἀπὸ ⸂τῶν καρπῶν⸃ τοῦ ἀμπελῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/002.yaml
  text: And at the proper time he sent a servant to the vine-growers[b][a], so that he might receive from the vine-growers some of the fruit of the vineyard.
translation:
  language: id
  text: Pada waktu yang tepat, ia mengutus seorang hamba[a] kepada para penggarap kebun anggur[b] itu supaya ia dapat menerima dari para penggarap itu sebagian dari hasil kebun anggur tersebut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “budak”. Kata Yunani δοῦλος menunjuk kepada orang yang berada di bawah kuasa seorang tuan.
    reason: lexical_alternative
  - marker: b
    text: Atau “petani” atau “penyewa”. Kata Yunani ini menunjuk kepada orang yang mengerjakan tanah; konteksnya menunjukkan bahwa mereka menggarap kebun anggur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: mengutus
  rationale: Bentuk aoristus ἀποστέλλω menyatakan tindakan mengirim seseorang dengan suatu tugas; “mengutus” alami dalam bahasa Indonesia dan mempertahankan unsur penugasan.
- source_word: γεωργούς / γεωργῶν
  choice: para penggarap kebun anggur
  rationale: γεωργός menunjuk kepada orang yang mengerjakan tanah. Dalam konteks kebun anggur, “penggarap kebun anggur” mempertahankan kekhususan konteks tanpa memastikan bahwa mereka adalah pemilik atau penyewa.
- source_word: τῷ καιρῷ
  choice: pada waktu yang semestinya
  rationale: καιρός di sini menunjuk pada waktu yang sesuai, kemungkinan musim ketika hasil dapat dipungut. Pilihan ini menyampaikan kepantasan waktunya tanpa secara eksplisit menambahkan “musim panen”.
- source_word: δοῦλον
  choice: hamba
  rationale: δοῦλος menyatakan orang yang berada di bawah kuasa seorang tuan. “Hamba” sesuai dengan register perumpamaan yang bermartabat dan mudah dipahami; alternatif yang lebih tegas secara sosial, “budak”, dicatat dalam catatan kaki.
- source_word: ἵνα ... λάβῃ
  choice: supaya ia menerima
  rationale: Konstruksi ἵνα dengan bentuk subjungtif menyatakan tujuan. “Supaya ia menerima” mempertahankan hubungan tujuan tersebut secara alami.
- source_word: παρὰ τῶν γεωργῶν
  choice: dari para penggarap itu
  rationale: παρά dengan genitif menandai sumber. Pengulangan “para penggarap” mengikuti pengulangan dalam teks Yunani, sedangkan “itu” menghindari pengulangan frasa panjang yang kaku.
- source_word: ἀπὸ τῶν καρπῶν τοῦ ἀμπελῶνος
  choice: sebagian hasil kebun anggur tersebut
  rationale: ἀπό dengan genitif dalam konteks ini mengandung makna partitif, yaitu mengambil sebagian dari keseluruhan hasil. “Hasil” lebih wajar daripada “buah” untuk panen kebun anggur dan tidak menambahkan gagasan “bagiannya” yang tidak dinyatakan langsung.
- source_word: ἀμπελῶνος
  choice: kebun anggur
  rationale: Padanan baku dan jelas untuk ἀμπελών.
theological_decisions:
- issue: Status sosial δοῦλος
  choice: hamba dalam teks utama, dengan “budak” sebagai alternatif
  alternative: budak dalam teks utama
  rationale: Teks mempertahankan relasi tuan-hamba tanpa menjadikan pilihan Indonesia terdengar semata-mata sebagai pekerja sukarela. Catatan kaki menjaga dimensi perbudakan yang dapat dikandung istilah Yunani.
- issue: Hubungan para penggarap dengan pemilik
  choice: penggarap kebun anggur
  alternative: penyewa kebun anggur
  rationale: Perumpamaan dapat menyiratkan hubungan sewa, tetapi γεωργός sendiri terutama menyebut orang yang mengerjakan tanah. Terjemahan utama tidak memastikan rincian sosial yang tidak dinyatakan oleh kata tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Struktur tujuan serta pengulangan penting dari teks Yunani dipertahankan, tetapi ungkapan dibuat alami bagi pembaca umum.
