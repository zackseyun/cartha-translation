  text: ⸂ἔφη αὐτοῖς ὁ Ἰησοῦς⸃· Οὐ διὰ τοῦτο πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/024.yaml
  text: 'Jesus said to them[a], “Is this not why you are mistaken: because you know neither the Scriptures nor the power of God?”'
translation:
  language: id
  text: 'Yesus berkata kepada mereka[a], “Bukankah inilah sebabnya kalian keliru: kalian tidak mengenal Kitab Suci maupun kuasa Allah?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Bukankah inilah sebabnya kalian tersesat: kalian tidak mengenal Kitab Suci maupun kuasa Allah?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Ἰησοῦς
  choice: Yesus berkata kepada mereka
  rationale: φημί lazim memperkenalkan perkataan langsung dengan arti sederhana ‘berkata’; bentuk ini alami dan tidak menambahkan nuansa ‘menjawab’ yang tidak dinyatakan secara eksplisit.
- source_word: Οὐ διὰ τοῦτο
  choice: Bukankah karena inilah
  rationale: Οὐ membentuk pertanyaan retoris yang mengharapkan persetujuan, sedangkan διὰ τοῦτο menyatakan sebab; susunan ini mempertahankan keduanya dalam bahasa Indonesia yang wajar.
- source_word: πλανᾶσθε
  choice: kalian keliru
  rationale: Dalam konteks koreksi terhadap pemahaman orang Saduki, verba ini dapat berarti berada dalam kekeliruan. Pilihan ini mempertahankan teguran tanpa memastikan apakah penyebabnya penipuan dari luar atau kesesatan moral.
- source_word: μὴ εἰδότες
  choice: karena kalian tidak mengenal
  rationale: Partisip ini menyatakan dasar kekeliruan mereka. Klausa sebab eksplisit terdengar alami dalam bahasa Indonesia, sementara ‘mengenal’ di sini mencakup pengetahuan dan pemahaman yang relevan, bukan sekadar pernah mendengar.
- source_word: τὰς γραφὰς
  choice: Kitab Suci
  rationale: Bentuk jamak γραφαί dalam konteks Yahudi merujuk pada kumpulan tulisan suci; ‘Kitab Suci’ merupakan padanan baku dan mudah dipahami dalam bahasa Indonesia.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: maupun kuasa Allah
  rationale: μηδέ mengoordinasikan unsur negatif kedua, dan δύναμις τοῦ θεοῦ secara langsung berarti ‘kuasa Allah’. ‘Tidak ... maupun ...’ menjaga kesejajaran kedua objek.
theological_decisions:
- issue: Sifat kekeliruan yang dinyatakan oleh πλανᾶσθε
  choice: kalian keliru
  alternative: kalian tersesat / kalian disesatkan
  rationale: Bentuk Yunani memungkinkan arti ‘keliru’, ‘tersesat’, atau ‘disesatkan’. Konteks menyoroti kegagalan memahami kebangkitan, Kitab Suci, dan kuasa Allah. Teks utama memakai ungkapan netral yang tetap mengandung teguran, sedangkan alternatif yang lebih kuat dicatat tanpa menetapkan sumber atau sifat kesesatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kalian’ dipakai karena sapaan Yunani berbentuk jamak dan ditujukan langsung kepada sekelompok orang. Pertanyaan retoris serta hubungan sebab dipertahankan.
