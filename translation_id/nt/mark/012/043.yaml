  text: καὶ προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ ⸀εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ἡ χήρα αὕτη ἡ πτωχὴ πλεῖον πάντων ⸀ἔβαλεν τῶν βαλλόντων εἰς τὸ γαζοφυλάκιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/043.yaml
  text: And calling his disciples to himself[a], he said to them, “Truly I say to you that this poor widow has put in more than all those who are putting into the treasury.”
translation:
  language: id
  text: Ia memanggil murid-murid-Nya, lalu berkata kepada mereka, “Sesungguhnya Aku berkata kepadamu, janda miskin ini memasukkan lebih banyak daripada semua orang lain yang memasukkan ke dalam perbendaharaan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “peti persembahan” atau “tempat perbendaharaan”. Istilah Yunani ini dapat merujuk pada wadah penerimaan persembahan atau tempat perbendaharaan di Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: memanggil ... dan
  rationale: Partisip aoris medium ini menggambarkan Yesus memanggil murid-murid-Nya mendekat sebelum berbicara. Susunan dengan “lalu ... dan” menyampaikan urutan itu secara alami tanpa menambahkan penafsiran.
- source_word: μαθητὰς
  choice: murid-murid
  rationale: Padanan baku dan alami bagi μαθητής yang mempertahankan hubungan mereka sebagai pengikut dan orang yang belajar dari Yesus.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya Aku berkata kepadamu
  rationale: Menyampaikan rumusan penegasan yang khidmat dengan bahasa Indonesia yang jelas serta mempertahankan bentuk langsung “Aku berkata kepadamu”.
- source_word: χήρα ... πτωχὴ
  choice: janda miskin
  rationale: Padanan langsung dan wajar yang tidak memperkuat πτωχή menjadi “melarat” atau “sangat miskin” melampaui bunyi ayat ini.
- source_word: πλεῖον πάντων
  choice: lebih banyak daripada semua orang lain
  rationale: Mempertahankan perbandingan terbuka dalam bahasa Yunani. Kata “lain” memperjelas bahwa yang dibandingkan ialah janda itu dengan para pemberi lainnya, tanpa menentukan apakah “lebih banyak” bersifat nominal atau bernilai secara lain.
- source_word: ἔβαλεν / τῶν βαλλόντων
  choice: memasukkan / yang memasukkan
  rationale: Dalam konteks persembahan, βάλλω secara idiomatis berarti memasukkan uang. Bentuk pertama menyatakan tindakan janda yang telah terjadi, sedangkan partisip kini menggambarkan para pemberi lain yang sedang melakukan tindakan itu; bahasa Indonesia tidak perlu memaksakan perbedaan aspek tersebut secara kaku.
- source_word: γαζοφυλάκιον
  choice: peti persembahan
  rationale: Dalam konteks bait, istilah ini dapat menunjuk wadah penerimaan persembahan atau kawasan perbendaharaan. “Peti persembahan” konkret dan mudah dipahami, sementara cakupan istilah dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna penilaian bahwa persembahan janda itu “lebih banyak”
  choice: Mempertahankan ungkapan komparatif “lebih banyak daripada semua orang lain” tanpa menjelaskan dasar penilaiannya di dalam teks utama.
  alternative: Memparafrasakannya sebagai nilai rohani atau proporsi pemberian yang lebih besar, atau membacanya secara ketat sebagai jumlah uang yang secara nominal lebih besar.
  rationale: Ayat berikutnya menjelaskan kontras antara kemiskinan janda dan kelimpahan orang lain, tetapi ayat ini sendiri tidak menyebutkan secara eksplisit jenis perbandingannya. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Struktur kalimat dibuat alami tanpa menghilangkan rumusan penegasan Yesus atau ambiguitas perbandingan. Huruf kapital pada kata ganti yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia.
