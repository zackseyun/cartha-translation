  yaml_path: translation/nt/mark/012/007.yaml
  text: But those tenant farmers said to one another[a], ‘This is the heir. Come, let us kill him[b], and the inheritance will be ours.’
translation:
  language: id
  text: Tetapi para penggarap kebun anggur itu berkata satu sama lain[a], ‘Dialah ahli warisnya. Mari kita bunuh dia, maka warisan itu akan menjadi milik kita.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berkata di antara mereka sendiri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ οἱ γεωργοὶ
  choice: Tetapi para penggarap kebun anggur itu
  rationale: δέ menyatakan kontras ringan dan diterjemahkan ‘Tetapi’; ἐκεῖνοι dipertahankan melalui ‘itu’. Dalam konteks perumpamaan, γεωργοί ialah para penggarap yang dipercayai mengelola kebun anggur, bukan sekadar pekerja tani.
- source_word: πρὸς ἑαυτοὺς εἶπαν
  choice: berkata satu sama lain
  rationale: Ungkapan ini menunjuk pada pembicaraan di dalam kelompok; ‘satu sama lain’ secara alami menampilkan perundingan timbal balik.
- source_word: Οὗτός ἐστιν ὁ κληρονόμος
  choice: Dialah ahli warisnya
  rationale: Οὗτός menunjuk langsung kepada anak yang datang, sedangkan bentuk -lah memberi penegasan yang wajar. κληρονόμος diterjemahkan dengan istilah keluarga dan hukum yang lazim, ‘ahli waris’.
- source_word: δεῦτε ἀποκτείνωμεν αὐτόν
  choice: Mari kita bunuh dia
  rationale: δεῦτε bersama subjungtif orang pertama jamak merupakan ajakan. ‘Bunuh’ mempertahankan kelugasan verba tanpa menambahkan kategori hukum yang tersirat dalam ‘membunuh dengan sengaja sebagai kejahatan’.
- source_word: καὶ ἡμῶν ἔσται ἡ κληρονομία
  choice: maka warisan itu akan menjadi milik kita
  rationale: καί di sini secara alami menyampaikan hasil yang mereka harapkan dan diterjemahkan ‘maka’. Genitif ἡμῶν yang ditempatkan di depan dipertahankan melalui ungkapan kepemilikan yang jelas.
theological_decisions:
- issue: Peran γεωργοί dalam perumpamaan
  choice: para penggarap kebun anggur
  alternative: para petani penyewa; para penyewa
  rationale: Pilihan ini mempertahankan latar kebun anggur dan tanggung jawab mereka untuk mengelolanya, tanpa mempersempit makna menjadi buruh biasa atau menambahkan penafsiran alegoris.
- issue: Acuan kepemilikan dalam ἡ κληρονομία
  choice: warisan itu
  alternative: warisannya
  rationale: Bahasa Yunani memakai artikel, bukan kata ganti posesif yang berarti ‘miliknya’. Karena itu, teks utama tidak menambahkan pemilik warisan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. ‘Penggarap kebun anggur’ mudah dipahami dan sesuai konteks, sedangkan dialog dibuat langsung dan tajam. Penanda catatan kaki [a] dan [b] dicantumkan dalam teks utama.
