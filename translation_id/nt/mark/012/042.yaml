  text: καὶ ἐλθοῦσα μία χήρα πτωχὴ ἔβαλεν λεπτὰ δύο, ὅ ἐστιν κοδράντης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/042.yaml
  text: And a poor widow came and put in two lepta[c][b][a], which is a quadrans.
translation:
  language: id
  text: Lalu datanglah seorang janda miskin dan memasukkan dua lepton[a], yang nilainya sama dengan satu kuadran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lepton adalah koin yang sangat kecil; dua lepton bernilai satu kuadran Romawi. Atau: “dua keping uang tembaga kecil.”'
    reason: Catatan budaya dan alternatif leksikal membantu pembaca memahami nama serta kecilnya nilai koin itu.
  - marker: b
    text: Kuadran adalah koin Romawi yang disebut dalam teks Yunani.
    reason: Catatan budaya menjelaskan istilah mata uang kuno yang tidak umum bagi pembaca masa kini.
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: datanglah
  rationale: 'Partisip aoristus dari ἔρχομαι dialihkan secara alami sebagai verba berurutan dalam narasi Indonesia: “datanglah ... dan memasukkan”.'
- source_word: μία
  choice: seorang
  rationale: Dalam konteks ini μία memperkenalkan satu tokoh, bukan menekankan angka satu; “seorang” merupakan padanan idiomatis dalam bahasa Indonesia.
- source_word: χήρα πτωχὴ
  choice: janda miskin
  rationale: Padanan langsung dan alami bagi χήρα dan πτωχή, tanpa melebihkan tingkat kemiskinan yang dinyatakan dalam ayat ini.
- source_word: ἔβαλεν
  choice: memasukkan
  rationale: Dalam konteks peti persembahan, “memasukkan” menyampaikan tindakan secara jelas tanpa kesan melempar dengan keras.
- source_word: λεπτὰ δύο
  choice: dua lepton
  rationale: Mempertahankan nama mata uang kuno yang spesifik; bentuk “lepton” digunakan sebagai nama satuan, sedangkan nilai dan sifatnya dijelaskan dalam catatan kaki.
- source_word: ὅ ἐστιν
  choice: yang nilainya sama dengan
  rationale: Frasa ini menjelaskan kesetaraan nilai dua lepton dengan satu kuadran; terjemahan eksplisit ini lebih alami dan mencegah kesan bahwa kedua jenis koin itu identik secara fisik.
- source_word: κοδράντης
  choice: satu kuadran
  rationale: Transliterasi Indonesia untuk koin Romawi quadrans mempertahankan rujukan historis dan menghindari padanan mata uang modern yang menyesatkan.
