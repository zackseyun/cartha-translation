  text: καὶ ⸂οἱ ἑπτὰ⸃ οὐκ ἀφῆκαν σπέρμα· ⸀ἔσχατον πάντων ⸂καὶ ἡ γυνὴ ἀπέθανεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/022.yaml
  text: And the seven left no offspring. Last of all[a], the woman also died.
translation:
  language: id
  text: Ketujuh saudara itu tidak meninggalkan keturunan. Akhirnya, perempuan itu juga meninggal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἑπτὰ
  choice: ketujuh saudara itu
  rationale: Ungkapan dengan kata sandang dan bilangan ini merujuk secara substantival kepada tujuh saudara yang telah disebutkan dalam konteks. Menyebut 'saudara' membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: οὐκ ἀφῆκαν σπέρμα
  choice: tidak meninggalkan keturunan
  rationale: Secara harfiah berarti 'tidak meninggalkan benih', tetapi dalam konteks ini σπέρμα menunjuk kepada anak atau keturunan. 'Tidak meninggalkan keturunan' menyampaikan idiom tersebut dengan jelas tanpa ungkapan harfiah yang kabur.
- source_word: ἔσχατον πάντων
  choice: Terakhir dari semuanya
  rationale: Frasa ini menandai urutan dan secara alami berarti bahwa kematian perempuan itu terjadi paling akhir dalam rangkaian tersebut.
- source_word: καὶ ἡ γυνὴ
  choice: perempuan itu juga
  rationale: 'Kata καί memiliki daya tambah: perempuan yang sudah dikenal dalam cerita itu turut meninggal setelah ketujuh saudara tersebut.'
- source_word: ἀπέθανεν
  choice: meninggal
  rationale: Kata kerja ini secara langsung menyatakan kematian. 'Meninggal' merupakan padanan baku, wajar, dan bermartabat dalam bahasa Indonesia modern.
