id: MRK.12.5
reference: Mark 12:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀καὶ ἄλλον ἀπέστειλεν· κἀκεῖνον ἀπέκτειναν, καὶ πολλοὺς ἄλλους, ⸂οὓς μὲν δέροντες οὓς δὲ ἀποκτέννοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/005.yaml
  text: And he sent another[a], and they killed that one; and many others—some they beat, and some they killed.
translation:
  language: id
  text: Kemudian ia mengutus seorang lagi, dan orang itu pun mereka bunuh. Ia juga mengutus banyak orang lain; sebagian mereka pukuli dan sebagian lagi mereka bunuh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλον
  choice: seorang lagi
  rationale: Dalam rangkaian ini, ἄλλον menunjuk kepada seorang hamba lain yang diutus sesudah para utusan sebelumnya. “Seorang lagi” alami dalam bahasa Indonesia dan mempertahankan urutan naratif.
- source_word: ἀπέστειλεν
  choice: ia mengutus
  rationale: Kata kerja ini menyatakan tindakan mengirim seorang wakil atau hamba. “Mengutus” sesuai dengan konteks pemilik yang mengirim para hambanya dan tetap wajar dalam ragam naratif.
- source_word: κἀκεῖνον
  choice: orang itu pun
  rationale: Bentuk ini menggabungkan καί dengan kata tunjuk ἐκεῖνον. “Orang itu pun” mempertahankan baik penunjukan kepada utusan tersebut maupun daya tambahannya.
- source_word: ἀπέκτειναν
  choice: mereka bunuh
  rationale: ἀποκτείνω berarti membunuh atau menyebabkan kematian. “Mereka bunuh” lugas, alami, dan mempertahankan kekerasan tindakan tersebut.
- source_word: πολλοὺς ἄλλους
  choice: banyak orang lain
  rationale: Frasa ini menunjuk kepada banyak hamba tambahan. Karena objek yang dimaksud adalah manusia, “banyak orang lain” lebih jelas dan alami daripada bentuk yang terlalu eliptis.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: sebagian ... dan sebagian lagi
  rationale: Konstruksi korelatif ini membagi para utusan ke dalam dua kelompok menurut perlakuan yang mereka terima. Ungkapan Indonesia ini mempertahankan distribusi dan kontrasnya.
- source_word: δέροντες
  choice: mereka pukuli
  rationale: δέρω berarti memukul berulang kali atau menghajar. “Pukuli” menyampaikan tindakan keras dan berulang tanpa mempersempitnya menjadi pencambukan resmi.
- source_word: ἀποκτέννοντες
  choice: mereka bunuh
  rationale: Partisipel kini ini merangkum perlakuan berulang terhadap kelompok para utusan. Klausa finit “mereka bunuh” lebih alami dalam bahasa Indonesia sambil mempertahankan maknanya.
theological_decisions:
- issue: Bentuk partisipel dalam ringkasan perlakuan terhadap banyak utusan
  choice: 'Mengungkapkannya sebagai klausa finit: “sebagian mereka pukuli dan sebagian lagi mereka bunuh.”'
  alternative: “dengan memukuli sebagian dan membunuh sebagian lagi”
  rationale: Keputusan ini bersifat sintaksis, bukan doktrinal. Klausa finit menghasilkan bahasa Indonesia modern yang jelas, sedangkan pembagian dua kelompok dalam teks Yunani tetap dipertahankan.
- issue: Subjek tersirat sebelum “banyak orang lain”
  choice: Mengulangi “Ia juga mengutus” agar hubungan πολλοὺς ἄλλους dengan ἀπέστειλεν jelas dalam bahasa Indonesia.
  alternative: “dan banyak orang lain—sebagian mereka pukuli dan sebagian lagi mereka bunuh”
  rationale: Teks Yunani mengelipsis kata kerja untuk “banyak orang lain.” Bahasa Indonesia lebih jelas bila kata kerja itu dinyatakan kembali; tidak ada unsur teologis baru yang ditambahkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. “Ia” dipakai untuk tokoh pemilik kebun tanpa menambahkan identifikasi tafsir. Tidak diperlukan catatan kaki karena elipsis Yunani dapat dijelaskan secara alami dalam teks tanpa kehilangan ambiguitas bermakna.
