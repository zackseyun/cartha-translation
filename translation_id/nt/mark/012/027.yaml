  source_fidelity: Terjemahan dengan tepat menyampaikan οὐκ ἔστιν θεὸς νεκρῶν ἀλλὰ ζώντων sebagai penyangkalan bahwa Allah adalah Allah orang mati dan penegasan bahwa Ia adalah Allah orang hidup. Intensifier πολύ dan teguran jamak πλανᾶσθε juga tercakup dalam “Kalian sangat keliru.” Tidak ada perluasan doktrinal di luar kontras yang dinyatakan teks.
  naturalness: Bahasa Indonesia modern, baku, dan jelas. “Dia bukanlah Allah orang mati, melainkan Allah orang hidup” merupakan konstruksi yang wajar dan tegas; pengulangan “Allah” membantu kejelasan tanpa mengubah makna. “Kalian sangat keliru” alami sebagai teguran langsung kepada kelompok.
