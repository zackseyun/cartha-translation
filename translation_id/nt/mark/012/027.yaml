id: MRK.12.27
reference: Mark 12:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ⸀θεὸς νεκρῶν ⸀ἀλλὰ ζώντων· ⸀πολὺ πλανᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/027.yaml
  text: He is not God of the dead[a], but of the living[b]. You are greatly mistaken.
translation:
  language: id
  text: Dia bukanlah Allah orang mati, melainkan Allah orang hidup. Kalian sangat keliru.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεὸς
  choice: Allah
  rationale: Dalam konteks ini θεός menunjuk kepada Allah Abraham, Ishak, dan Yakub; bentuk tanpa artikel tidak berarti “seorang allah”.
- source_word: νεκρῶν
  choice: orang mati
  rationale: Genitif jamak ini dipakai secara substantival dan paling alami diterjemahkan sebagai “orang mati,” dengan tetap mempertahankan pertentangannya dengan “orang hidup.”
- source_word: ἀλλὰ ζώντων
  choice: melainkan Allah orang hidup
  rationale: Partisip ζώντων dipakai secara substantival untuk menyebut mereka yang hidup. Pengulangan “Allah” membuat hubungan genitif tersirat menjadi jelas dan alami dalam bahasa Indonesia.
- source_word: πολὺ
  choice: sangat
  rationale: πολύ berfungsi adverbial untuk menguatkan πλανᾶσθε; “sangat” menyampaikan intensitasnya secara wajar.
- source_word: πλανᾶσθε
  choice: kalian keliru
  rationale: Bentuk medio-pasif ini dalam konteks menyatakan bahwa para lawan bicara berada dalam kesalahan. “Keliru” tidak memutuskan apakah nuansanya tersesat sendiri atau disesatkan pihak lain.
- source_word: οὐκ ἔστιν
  choice: Dia bukanlah
  rationale: Subjek “Dia” dipahami dari konteks langsung mengenai Allah. “Bukanlah” tepat untuk menyangkal predikat identitas/relasi yang mengikuti.
theological_decisions:
- issue: Implikasi kehidupan yang berlanjut di hadapan Allah dalam argumen Yesus
  choice: Mempertahankan pertentangan langsung antara “orang mati” dan “orang hidup” tanpa menambahkan uraian tentang kebangkitan atau keadaan antara kematian dan kebangkitan.
  alternative: Allah bukanlah Allah orang mati, melainkan Allah orang hidup.
  rationale: Ucapan ini mendukung argumen Yesus mengenai kebangkitan, tetapi terjemahan tidak boleh memperluasnya menjadi penjelasan doktrinal yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Kalian” menandai orang kedua jamak secara jelas dan sesuai dengan teguran langsung kepada kelompok lawan bicara.
