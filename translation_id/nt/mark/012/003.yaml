  text: ⸀καὶ λαβόντες αὐτὸν ἔδειραν καὶ ἀπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/003.yaml
  text: And they took him[a], beat him, and sent him away empty-handed.
translation:
  language: id
  text: Mereka menangkap dia, memukulinya, lalu menyuruhnya pergi dengan tangan kosong.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kosong”; maksudnya, hamba itu disuruh pergi tanpa memperoleh apa pun.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: menangkap
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului tindakan utama. Dalam konteks para penggarap yang memperlakukan hamba itu dengan kasar, “menangkap” menyampaikan tindakan menguasai orang tersebut tanpa menambahkan gagasan penangkapan resmi.
- source_word: ἔδειραν
  choice: memukulinya
  rationale: Kata δέρω berarti memukul atau menghajar. “Memukulinya” jelas, wajar, dan tidak mempersempit makna menjadi pencambukan resmi.
- source_word: ἀπέστειλαν
  choice: menyuruhnya pergi
  rationale: Bentuk ἀποστέλλω di sini menggambarkan mereka mengirim hamba itu pergi dari hadapan mereka. “Menyuruhnya pergi” menyampaikan tindakan tersebut secara alami dalam bahasa Indonesia.
- source_word: κενόν
  choice: dengan tangan kosong
  rationale: Adjektiva ini secara harfiah berarti “kosong” dan di sini menerangkan bahwa hamba itu pergi tanpa memperoleh apa pun. Ungkapan Indonesia “dengan tangan kosong” menyampaikan maksud kontekstualnya dengan jelas.
- source_word: καὶ ... καὶ
  choice: lalu
  rationale: Rangkaian καί menghubungkan tindakan-tindakan dalam urutan naratif. “Lalu” membuat urutannya alami dalam bahasa Indonesia tanpa mengubah hubungan antartindakan.
