  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν ⸀αὐτοῖς· ⸂Τὰ Καίσαρος ἀπόδοτε⸃ Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ. καὶ ⸀ἐξεθαύμαζον ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/017.yaml
  text: But Jesus said to them[a], “Give back to Caesar the things that are Caesar’s, and to God the things that are God’s.” And they were utterly amazed at him.
translation:
  language: id
  text: Namun Yesus berkata kepada mereka[a], “Kembalikanlah kepada Kaisar apa yang menjadi milik Kaisar, dan kepada Allah apa yang menjadi milik Allah.” Mereka sangat takjub pada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Berikanlah kepada Kaisar apa yang menjadi milik Kaisar, dan kepada Allah apa yang menjadi milik Allah.” Kata kerja Yunani ini dapat berarti “mengembalikan,” “membayar,” atau “menyerahkan” apa yang menjadi hak seseorang.'
    reason: Mencatat alternatif leksikal untuk ἀπόδοτε serta mempertahankan cakupan maknanya tanpa membatasinya pada pembayaran pajak.
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Berikanlah
  rationale: Dalam konteks ini ἀποδίδωμι berarti memberikan atau menyerahkan kepada pihak yang berhak apa yang menjadi haknya. “Berikanlah” alami dalam bahasa Indonesia, sedangkan unsur kewajiban tetap tersampaikan melalui frasa “apa yang menjadi milik” tanpa mempersempit maknanya hanya pada pembayaran pajak.
- source_word: Τὰ Καίσαρος ... Καίσαρι
  choice: kepada Kaisar apa yang menjadi milik Kaisar
  rationale: Susunan ini mempertahankan hubungan kepemilikan dalam bentuk genitif Yunani dan mengungkapkannya secara wajar dalam bahasa Indonesia.
- source_word: τὰ τοῦ θεοῦ ... τῷ θεῷ
  choice: kepada Allah apa yang menjadi milik Allah
  rationale: Pilihan ini mempertahankan kesejajaran yang disengaja dengan klausa mengenai Kaisar serta tidak menentukan secara lebih sempit apa saja yang dimaksud.
- source_word: ἐξεθαύμαζον
  choice: sangat takjub
  rationale: Kata kerja ἐκθαυμάζω menyatakan rasa takjub yang kuat. “Sangat takjub” menyampaikan intensitas tersebut secara jelas dan alami.
- source_word: ἐπ’ αὐτῷ
  choice: kepada-Nya
  rationale: ἐπί dengan datif dapat menandai objek atau dasar ketakjuban. “Kepada-Nya” mempertahankan rujukan langsung kepada Yesus tanpa menggantinya secara interpretatif dengan “atas jawaban-Nya”.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai peralihan dengan nuansa kontras ringan. “Namun” sesuai dengan jawaban Yesus dalam percakapan yang bersifat menguji-Nya.
- source_word: εἶπεν αὐτοῖς
  choice: berkata kepada mereka
  rationale: Terjemahan langsung dan alami yang mempertahankan pengantar ujaran serta penerima perkataan itu.
theological_decisions:
- issue: Hubungan antara kewajiban kepada pemerintah dan kewajiban kepada Allah
  choice: Kedua klausa diterjemahkan secara sejajar tanpa menjabarkan teori tertentu tentang hubungan agama dan negara.
  alternative: Menafsirkannya sebagai dukungan kuat terhadap kekuasaan sipil atau sebagai pembatasan subversif atas tuntutan Kaisar.
  rationale: Ayat ini mengakui adanya sesuatu yang menjadi milik Kaisar dan sesuatu yang menjadi milik Allah, tetapi tidak menyusun teologi politik yang lengkap. Kesejajaran dan ketegangan dalam perkataan Yesus karena itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kaisar” serta “Allah” mengikuti pemakaian umum Alkitab bahasa Indonesia. Bentuk “kepada-Nya” dipakai untuk memperjelas rujukan kepada Yesus dalam gaya penerbitan yang lazim.
