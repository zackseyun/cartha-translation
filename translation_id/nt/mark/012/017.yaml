  - severity: low
    issue: “Takjub kepada-Nya” kurang idiomatis.
    rationale: Dalam pemakaian Indonesia modern, “takjub pada-Nya” lebih wajar untuk menyatakan objek ketakjuban dan menerjemahkan ἐπὶ dengan datif secara langsung.
