  source_fidelity: Partisipel εἰδὼς menyatakan bahwa Yesus mengetahui kemunafikan mereka; terjemahan draft pada dasarnya tepat. Namun, “karena mengetahui” secara eksplisit menjadikan pengetahuan itu alasan kausal bagi ucapan-Nya, sedangkan bentuk partisipel Yunani tidak perlu dibatasi demikian. Mengubahnya menjadi klausa koordinatif mempertahankan hubungan yang lebih netral. Selebihnya, “menguji Aku,” “bawakan kepada-Ku,” dan “supaya Aku dapat melihatnya” setia pada teks Yunani.
  naturalness: Bahasa draft umumnya baku dan lancar. “Namun, Ia mengetahui ... dan berkata ...” lebih langsung dan alami daripada pembuka “Namun, karena mengetahui ...”. “Sekeping uang dinar” tetap jelas bagi pembaca modern dan mempertahankan istilah koin yang lazim dalam pemakaian Alkitab bahasa Indonesia.
  terminology: “Kemunafikan” tepat untuk ὑπόκρισις, dan “menguji” tepat sebagai pilihan utama untuk πειράζετε dalam konteks upaya menjebak. “Dinar” dipertahankan sebagai istilah historis yang lazim; catatan menjelaskan bahwa yang dimaksud adalah koin perak Romawi. Kapitalisasi “Ia/Aku” konsisten dengan register naskah.
