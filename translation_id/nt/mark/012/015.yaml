  text: ὁ δὲ εἰδὼς αὐτῶν τὴν ὑπόκρισιν εἶπεν αὐτοῖς· Τί με πειράζετε; φέρετέ μοι δηνάριον ἵνα ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/015.yaml
  text: But knowing their hypocrisy[a], he said to them[b], “Why are you testing me? Bring me a denarius so that I may see it.”
translation:
  language: id
  text: Namun, Ia mengetahui kemunafikan mereka dan berkata kepada mereka, “Mengapa kalian menguji Aku[b]? Bawakan kepada-Ku sekeping uang dinar[a] supaya Aku dapat melihatnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dinar adalah uang perak Romawi yang nilainya umumnya setara dengan upah sehari seorang pekerja.
    reason: cultural_note
  - marker: b
    text: Atau “mencobai Aku?”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: mengetahui
  rationale: 'Mempertahankan daya kognitif bentuk partisipel itu: Ia sudah menyadari kemunafikan mereka. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan cara Ia memperoleh pengetahuan tersebut.'
- source_word: ὑπόκρισιν
  choice: kemunafikan
  rationale: Padanan baku yang mempertahankan kekuatan moral kata Yunani dalam konteks siasat yang disamarkan sebagai pertanyaan tulus.
- source_word: Τί
  choice: Mengapa
  rationale: Dalam konstruksi ini, Τί berfungsi secara adverbial untuk menanyakan alasan, sehingga “Mengapa” merupakan padanan Indonesia yang alami.
- source_word: πειράζετε
  choice: kalian menguji Aku
  rationale: “Menguji” menyampaikan tindakan mereka yang bermusuhan dan bertujuan menjebak tanpa membatasi maknanya pada bujukan untuk berbuat dosa. “Kalian” memperjelas subjek jamak yang terkandung dalam bentuk verba Yunani.
- source_word: φέρετέ μοι
  choice: Bawakan kepada-Ku
  rationale: Imperatif ini meminta mereka membawa benda tersebut kepada Yesus; “bawakan kepada-Ku” jelas dan idiomatis.
- source_word: δηνάριον
  choice: sekeping uang dinar
  rationale: Nama historis koin tetap dipertahankan sebagai “dinar”, sedangkan “sekeping uang” membantu pembaca modern langsung mengenalinya sebagai mata uang logam.
- source_word: ἵνα ἴδω
  choice: supaya Aku dapat melihatnya
  rationale: Menyatakan tujuan secara alami. Akhiran “-nya” memasok objek yang dipahami dari konteks, yaitu uang dinar itu.
theological_decisions:
- issue: Makna πειράζετε dalam tuduhan Yesus
  choice: menguji Aku
  alternative: mencobai Aku
  rationale: Konteks menunjukkan pengujian bermusuhan yang dimaksudkan untuk menjebak Yesus. “Menguji” mempertahankan cakupan itu tanpa secara khusus menyiratkan bujukan untuk berdosa; alternatifnya dicatat karena kata Yunani juga dapat diterjemahkan demikian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Ia” dipakai untuk narasi yang bermartabat, sedangkan “Aku” mempertahankan orang pertama dalam ucapan langsung. Urutan penanda catatan mengikuti kata yang dijelaskan dalam teks, sehingga [b] muncul sebelum [a].
