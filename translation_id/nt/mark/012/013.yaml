review_pass:
  verdict: revise
  source_fidelity: Teks utama dengan tepat mempertahankan subjek jamak yang tersirat, konstruksi partitif dari kedua kelompok, serta klausa tujuan. Namun, “pendukung Herodes” menyempitkan Ἡρῳδιανοί menjadi para pendukung Herodes, sedangkan identitas dan afiliasi tepat kelompok itu tidak dijelaskan oleh istilah Yunani. Selain itu, “melalui perkataan-Nya” menambahkan penanda posesif yang tidak ada pada λόγῳ dan lebih menafsirkan sarana jebakan daripada mempertahankan ungkapan tunggal yang ringkas.
  naturalness: Susunan kalimatnya baku dan mudah dipahami. “Orang-orang Herodian” adalah sebutan kelompok yang lazim dan lebih netral; istilah itu dapat dibiarkan sebagai nama kelompok tanpa penjelasan interpretatif di teks utama. “Dengan suatu perkataan” terdengar alami dalam register Alkitab yang formal dan mempertahankan ketaktertentuan ungkapan Yunani.
  terminology: “Farisi” tepat. “Herodian” lebih setia sebagai nama kelompok daripada “pendukung Herodes.” “Menjerat” menyampaikan metafora perburuan dalam ἀγρεύσωσιν dengan baik, sementara “menjebak” dapat dipakai sebagai penjelasan dalam catatan kaki.
  issues:
  - severity: medium
    issue: “pendukung Herodes” mempersempit Ἡρῳδιανῶν.
    rationale: Istilah Yunani menamai kelompok Herodian, tetapi ayat ini tidak mendefinisikan mereka sebagai pendukung Herodes. Terjemahan deskriptif tersebut menyatakan afiliasi sosial-politik yang lebih spesifik daripada yang diungkapkan teks.
  - severity: medium
    issue: “melalui perkataan-Nya” menambahkan posesif dan memperluas λόγῳ.
    rationale: λόγῳ berbentuk tunggal tanpa posesif dan secara harfiah berarti “dengan suatu perkataan.” Walaupun konteksnya melibatkan ucapan Yesus, teks utama sebaiknya mempertahankan ungkapan sumber yang lebih ringkas; penjelasan kontekstual dapat ditempatkan dalam catatan kaki.
