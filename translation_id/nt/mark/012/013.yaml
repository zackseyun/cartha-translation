revisions:
- from: Lalu mereka mengutus kepada-Nya beberapa orang dari kalangan Farisi dan beberapa orang dari kalangan pendukung Herodes untuk menjebak Dia melalui perkataan-Nya.[a]
  to: Lalu mereka mengutus kepada-Nya beberapa orang dari kalangan Farisi dan beberapa orang dari kalangan Herodian untuk menjerat-Nya dengan suatu perkataan.[a]
  rationale: Revisi mempertahankan nama kelompok Ἡρῳδιανοί secara netral sebagai “Herodian” dan mengembalikan λόγῳ kepada “dengan suatu perkataan,” tanpa posesif yang tidak dinyatakan dalam bahasa Yunani. Catatan kaki menyajikan penjelasan kontekstual yang idiomatis mengenai jebakan melalui ucapan Yesus, sambil tetap menandai metafora perburuan.
