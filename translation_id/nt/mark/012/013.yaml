source:
  edition: SBLGNT
  text: Καὶ ἀποστέλλουσιν πρὸς αὐτόν τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν ἵνα αὐτὸν ἀγρεύσωσιν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/013.yaml
  text: And they send to him some of the Pharisees and some of the Herodians[a], so that they might trap him by a word.
translation:
  language: id
  text: Lalu mereka mengutus kepada-Nya beberapa orang dari kalangan Farisi dan beberapa orang dari kalangan Herodian untuk menjerat-Nya dengan suatu perkataan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjebak-Nya melalui apa yang dikatakan-Nya.” Kata kerja Yunaninya memakai gambaran menangkap dalam perburuan; frasa terakhir menyatakan usaha untuk menjerat-Nya melalui ucapan-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: mereka mengutus
  rationale: Bentuk kini historis dipertahankan secara aspektual dalam alur dengan penghubung “Lalu”; “mengutus” menyampaikan tindakan mengirim dengan suatu tugas tanpa menambahkan identitas subjek yang tersirat.
- source_word: τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν
  choice: beberapa orang dari kalangan Farisi dan beberapa orang dari kalangan pendukung Herodes
  rationale: Konstruksi partitif τινας dengan bentuk genitif menunjukkan wakil-wakil dari kedua kelompok. Pengulangan “beberapa orang” memperjelas bahwa orang-orang berasal dari masing-masing kelompok.
- source_word: Φαρισαίων
  choice: Farisi
  rationale: “Farisi” adalah bentuk baku dan lazim dalam bahasa Indonesia untuk nama kelompok Yahudi ini.
- source_word: Ἡρῳδιανῶν
  choice: pendukung Herodes
  rationale: Istilah ini menunjuk para pengikut atau pendukung dinasti/kepentingan Herodes. Terjemahan deskriptif lebih mudah dipahami pembaca Indonesia daripada transliterasi yang tidak lazim, tanpa menentukan secara berlebihan sifat tepat kelompok tersebut.
- source_word: ἵνα
  choice: untuk
  rationale: “Untuk” menyatakan tujuan dengan alami dan jelas dalam bahasa Indonesia modern.
- source_word: ἀγρεύσωσιν
  choice: menjebak
  rationale: Kata kerja Yunani memakai metafora berburu, yakni menangkap atau menjerat. “Menjebak” mempertahankan maksud bermusuhan dan alami dalam konteks percakapan.
- source_word: λόγῳ
  choice: melalui perkataan-Nya
  rationale: Datif ini menyatakan sarana; frasa tersebut berarti bahwa ucapan Yesus sendiri hendak dijadikan dasar untuk menjebak-Nya. “Perkataan-Nya” tetap cukup dekat dengan bentuk tunggal λόγῳ.
theological_decisions:
- issue: Subjek jamak tidak dinyatakan secara eksplisit dalam ayat ini
  choice: mereka
  alternative: para imam kepala, ahli-ahli Taurat, dan tua-tua; para pemimpin
  rationale: Kata kerja Yunani hanya menyiratkan subjek jamak. “Mereka” menjaga ketidaktersuratan itu dan tidak memasukkan identifikasi dari konteks sebelumnya ke dalam teks ayat.
- issue: Identitas tepat Ἡρῳδιανοί
  choice: pendukung Herodes
  alternative: orang-orang Herodian; kelompok Herodes
  rationale: Sumber menandai hubungan mereka dengan Herodes tetapi tidak menguraikan struktur atau keyakinan kelompok tersebut. Pilihan ini menyatakan hubungan dasarnya tanpa menjadikannya secara pasti partai politik atau sekte agama.
- issue: Cara jebakan dilakukan melalui λόγῳ
  choice: melalui perkataan-Nya
  alternative: dengan suatu perkataan; dalam perkataan
  rationale: Konteks menunjukkan upaya untuk menjerat Yesus lewat jawaban atau ucapan-Nya, tetapi ungkapan dipertahankan cukup luas agar tidak membatasi jebakan pada satu bentuk tuduhan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kepada-Nya” serta “Dia” mengikuti kelaziman ortografi Alkitab bahasa Indonesia untuk rujukan kepada Yesus. Susunan dibuat alami, sementara subjek “mereka,” konstruksi partitif kedua kelompok, tujuan tindakan, dan metafora jebakan tetap dipertahankan.
