source:
  edition: SBLGNT
  text: Καὶ προσελθὼν εἷς τῶν γραμματέων ἀκούσας αὐτῶν συζητούντων, ⸀ἰδὼν ὅτι καλῶς ⸂ἀπεκρίθη αὐτοῖς⸃, ἐπηρώτησεν αὐτόν· Ποία ἐστὶν ⸂ἐντολὴ πρώτη πάντων⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/028.yaml
  text: And one of the scribes came up and heard them debating, and seeing that he had answered them well, he asked him, “Which commandment is the first of all?”
translation:
  language: id
  text: Lalu, seorang ahli Taurat datang mendekat dan mendengar mereka berdebat. Ketika melihat bahwa Yesus telah menjawab mereka dengan baik, ia bertanya kepada-Nya, “Perintah manakah yang pertama dari semuanya?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang terutama dari semuanya” atau “yang paling penting dari semuanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματέων
  choice: ahli Taurat
  rationale: Dalam konteks Injil, γραμματεύς menunjuk kepada ahli hukum dan Kitab Suci Yahudi yang diakui. “Ahli Taurat” adalah padanan Indonesia yang lazim dan tepat secara kontekstual.
- source_word: προσελθὼν
  choice: datang mendekat
  rationale: Bentuk partisipel προσέρχομαι menyatakan gerakan mendekati Yesus; frasa ini alami dalam bahasa Indonesia dan mempertahankan unsur geraknya.
- source_word: ἀκούσας αὐτῶν συζητούντων
  choice: mendengar mereka berdebat
  rationale: συζητέω dapat berarti berdiskusi, bersoal jawab, atau berdebat. “Berdebat” sesuai dengan pertukaran pendapat di muka umum tanpa dengan sendirinya menyiratkan permusuhan.
- source_word: ἰδὼν ὅτι καλῶς ἀπεκρίθη αὐτοῖς
  choice: ketika melihat bahwa Yesus telah menjawab mereka dengan baik
  rationale: “Dengan baik” menerjemahkan καλῶς secara langsung tanpa mempersempitnya menjadi penilaian bahwa jawabannya hanya benar secara doktrinal. Nama “Yesus” dipakai untuk menjernihkan rujukan pronomina dalam bahasa Indonesia.
- source_word: ἐπηρώτησεν
  choice: bertanya
  rationale: Padanan yang paling jelas dan alami untuk ἐπερωτάω dalam konteks ini.
- source_word: Ποία
  choice: manakah
  rationale: ποῖος meminta pemilihan atau identifikasi di antara sejumlah perintah; “manakah” menyampaikan fungsi tersebut secara alami.
- source_word: ἐντολή
  choice: perintah
  rationale: “Perintah” adalah padanan Indonesia yang jelas dan wajar bagi ἐντολή dalam pembicaraan tentang Taurat, tanpa kehilangan bobot normatifnya.
- source_word: πρώτη πάντων
  choice: yang pertama dari semuanya
  rationale: Terjemahan ini mempertahankan kata “pertama” dan dengan demikian membiarkan πρῶτος menyatakan urutan maupun keutamaan, sementara catatan kaki menjelaskan kemungkinan makna peringkat.
theological_decisions:
- issue: Makna πρώτη dalam pertanyaan tentang perintah
  choice: yang pertama dari semuanya
  alternative: yang terutama dari semuanya; yang paling penting dari semuanya
  rationale: πρώτη secara harfiah berarti “pertama”, tetapi dalam konteks ini dapat menunjukkan kedudukan atau keutamaan. Teks utama mempertahankan ambiguitas itu dan catatan kaki menyajikan kemungkinan makna lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ahli Taurat” mempertahankan istilah Alkitab yang telah dikenal luas; susunan kalimat dipecah agar alur narasi mudah dipahami. Penanda catatan kaki ditempatkan tepat sesudah pertanyaan yang diterangkannya.
