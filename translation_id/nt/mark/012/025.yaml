source:
  edition: SBLGNT
  text: ὅταν γὰρ ἐκ νεκρῶν ἀναστῶσιν, οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ εἰσὶν ὡς ⸀ἄγγελοι ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/025.yaml
  text: For when they rise from the dead[a], they neither marry nor are given in marriage, but are like angels in heaven.
translation:
  language: id
  text: Sebab, ketika mereka bangkit dari antara orang mati, mereka tidak menikah dan tidak dinikahkan, melainkan seperti malaikat di surga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di langit”; bahasa Yunani memakai bentuk jamak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν γὰρ
  choice: Sebab, ketika
  rationale: γάρ mempertahankan hubungan penjelasan dengan argumen sebelumnya, sedangkan ὅταν menyatakan waktu yang berlaku pada peristiwa kebangkitan.
- source_word: ἐκ νεκρῶν ἀναστῶσιν
  choice: mereka bangkit dari antara orang mati
  rationale: Bentuk aktif ἀναστῶσιν diterjemahkan sebagai 'bangkit', dan 'dari antara orang mati' mempertahankan gambaran ἐκ νεκρῶν secara alami serta lebih tepat daripada sekadar 'dari kematian'.
- source_word: οὔτε γαμοῦσιν οὔτε γαμίζονται
  choice: mereka tidak kawin dan tidak dikawinkan
  rationale: Terjemahan ini mempertahankan pembedaan antara tindakan memasuki perkawinan dan bentuk pasif 'dikawinkan', sekaligus mengungkapkan pasangan korelatif οὔτε ... οὔτε secara wajar dalam bahasa Indonesia.
- source_word: ἀλλ’ εἰσὶν
  choice: melainkan mereka
  rationale: '''Melainkan'' menyatakan pertentangan tegas setelah dua penyangkalan sebelumnya; kopula tidak perlu dinyatakan tersendiri sebelum frasa perbandingan dalam bahasa Indonesia.'
- source_word: ὡς ἄγγελοι
  choice: seperti malaikat-malaikat
  rationale: ὡς menandai kemiripan, bukan perubahan manusia menjadi malaikat. Bentuk ulang menyampaikan nomina jamak Yunani dengan jelas.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: di surga
  rationale: '''Di surga'' merupakan padanan Indonesia yang alami dalam konteks ini, sementara bentuk Yunani yang harfiah jamak dicatat dalam catatan kaki.'
theological_decisions:
- issue: Sifat perbandingan dengan para malaikat
  choice: Orang yang bangkit seperti malaikat dalam hal yang sedang dibahas, bukan menjadi malaikat.
  alternative: Orang yang bangkit berubah menjadi malaikat.
  rationale: Partikel perbandingan ὡς menyatakan kemiripan, bukan identitas ontologis; terjemahan 'seperti' mempertahankan batas gramatikal tersebut tanpa memperluas cakupan perbandingan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Kawin/dikawinkan' dipilih untuk mempertahankan kontras verba aktif-pasif secara ringkas; 'dari antara orang mati' menjaga idiom kebangkitan sumber. Penanda catatan kaki ditempatkan sesudah 'surga' karena catatan menjelaskan frasa tersebut.
