  naturalness: Kalimatnya pada dasarnya jelas, tetapi “malaikat-malaikat” terdengar kurang alami dalam bahasa Indonesia modern; bentuk tanpa reduplikasi sudah lazim untuk kelas/jamak generik dalam perbandingan ini. “Menikah dan dinikahkan” lebih umum dan jelas daripada “kawin dan dikawinkan,” sambil tetap mempertahankan kontras aktif-pasif.
