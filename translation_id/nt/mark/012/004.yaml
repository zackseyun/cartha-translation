  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Pemecahan menjadi dua kalimat menghindari rangkaian pronomina yang kaku. Semua penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
