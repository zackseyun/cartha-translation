  text: καὶ πάλιν ἀπέστειλεν πρὸς αὐτοὺς ἄλλον δοῦλον· ⸀κἀκεῖνον ⸀ἐκεφαλίωσαν καὶ ⸀ἠτίμασαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/004.yaml
  text: And again he sent another servant to them[c][b][a], and they struck him on the head and dishonored him.
translation:
  language: id
  text: Sekali lagi ia mengutus seorang hamba lain[a] kepada mereka. Orang itu juga mereka pukul di kepala[b] dan mereka perlakukan dengan hina[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "seorang budak lain". Kata Yunani doulos dapat berarti "hamba" atau "budak", bergantung pada konteks.
    reason: alternative_reading
  - marker: b
    text: Verba langka di sini merujuk pada kekerasan yang diarahkan ke kepala; mungkin berarti "memukulnya di kepala" atau "melukainya di kepala", bukan "memenggalnya".
    reason: lexical_alternative
  - marker: c
    text: Atau "mereka mempermalukannya".
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: kembali
  rationale: Menandai pengulangan tindakan dalam rangkaian perumpamaan secara alami dan ringkas.
- source_word: ἀπέστειλεν
  choice: mengutus
  rationale: Menyampaikan tindakan lampau sederhana; 'mengutus' sesuai untuk seorang pemilik yang mengirim hambanya dengan suatu tugas.
- source_word: πρὸς αὐτοὺς
  choice: kepada mereka
  rationale: Dengan verba pengutusan, frasa ini secara idiomatis berarti arah atau tujuan penerima.
- source_word: ἄλλον δοῦλον
  choice: seorang hamba lain
  rationale: '''Hamba'' alami dalam narasi perumpamaan dan mempertahankan relasi dengan tuan; kemungkinan makna sosial ''budak'' dicatat dalam catatan kaki.'
- source_word: κἀκεῖνον
  choice: Hamba itu pun
  rationale: Mengungkapkan baik rujukan kepada orang yang baru disebut maupun daya penghubung/penambahan dari κἀκεῖνον secara wajar dalam bahasa Indonesia.
- source_word: ἐκεφαλίωσαν
  choice: mereka pukul pada bagian kepala
  rationale: Verba langka ini menunjukkan kekerasan yang diarahkan ke kepala. Pilihan ini tidak menyimpulkan bahwa ia dipenggal dan tetap mempertahankan ketidakpastian mengenai bentuk persis lukanya.
- source_word: ἠτίμασαν
  choice: mereka permalukan
  rationale: Menyampaikan perlakuan yang mendatangkan aib atau kehinaan secara alami; alternatif yang lebih formal dicatat dalam catatan kaki.
