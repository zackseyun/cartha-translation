  source_fidelity: 'Teks dengan setia mencerminkan struktur dan makna Yunani: Yesus duduk di hadapan/berseberangan dengan γαζοφυλάκιον, mengamati secara berlangsung bagaimana orang banyak memasukkan uang, dan banyak orang kaya memasukkan dalam jumlah besar. “Bagaimana” mempertahankan πῶς, sedangkan “memasukkan” sesuai dengan βάλλω dalam konteks memasukkan uang ke wadah atau perbendaharaan. Penggunaan “uang” untuk χαλκόν dapat diterima secara idiomatis dalam konteks moneter tanpa mengklaim jenis denominasi tertentu.'
