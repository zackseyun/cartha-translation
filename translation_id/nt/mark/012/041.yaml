  terminology: “Yesus,” “orang banyak,” “orang kaya,” dan “peti persembahan” sesuai dengan register Alkitab Indonesia modern. Catatan kaki secara memadai memelihara cakupan leksikal γαζοφυλάκιον, yang dapat merujuk kepada perbendaharaan Bait Allah atau wadah-wadah persembahan yang terkait dengannya. Tidak ada istilah teologis yang memerlukan penyesuaian.
