id: MRK.12.41
reference: Mark 12:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ⸀καθίσας ⸀κατέναντι τοῦ γαζοφυλακίου ἐθεώρει πῶς ὁ ὄχλος βάλλει χαλκὸν εἰς τὸ γαζοφυλάκιον· καὶ πολλοὶ πλούσιοι ἔβαλλον πολλά·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/041.yaml
  text: And sitting opposite the treasury[a], he was watching how the crowd was putting money into the treasury; and many rich people were putting in much.
translation:
  language: id
  text: Lalu Yesus duduk berhadapan dengan peti persembahan[a] dan memperhatikan bagaimana orang banyak memasukkan uang ke dalamnya. Banyak orang kaya memasukkan uang dalam jumlah besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perbendaharaan”; istilah Yunani ini dapat menunjuk pada perbendaharaan Bait Allah atau pada peti-peti persembahan yang berkaitan dengannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθίσας
  choice: duduk
  rationale: Partisip aoris berfungsi sebagai pembuka adegan; urutan alami bahasa Indonesia dengan 'Lalu Yesus duduk ... dan memperhatikan' menyampaikan tindakan yang mendahului verba utama tanpa kekakuan.
- source_word: κατέναντι
  choice: berhadapan dengan
  rationale: Menyatakan posisi tepat di seberang atau menghadap sesuatu dan terdengar alami dalam narasi Indonesia.
- source_word: γαζοφυλάκιον
  choice: peti persembahan
  rationale: Dalam konteks orang memasukkan uang, acuan konkret pada wadah persembahan paling alami; catatan kaki mempertahankan kemungkinan bahwa istilah itu menunjuk perbendaharaan Bait Allah atau wadah-wadah yang terkait dengannya.
- source_word: ἐθεώρει
  choice: memperhatikan
  rationale: Bentuk imperfek menunjukkan pengamatan yang berlangsung; 'memperhatikan' juga mempertahankan nuansa pengamatan saksama.
- source_word: πῶς
  choice: bagaimana
  rationale: Mempertahankan fokus teks pada cara atau proses orang banyak memberi, bukan hanya fakta bahwa mereka memberi.
- source_word: ὄχλος
  choice: orang banyak
  rationale: Padanan naratif yang lazim, jelas, dan bermartabat bagi kelompok orang yang berkumpul.
- source_word: βάλλει / ἔβαλλον
  choice: memasukkan
  rationale: Dalam konteks uang dan wadah persembahan, 'memasukkan' adalah padanan idiomatis bagi tindakan menaruh atau menjatuhkan uang ke dalamnya.
- source_word: χαλκόν
  choice: uang
  rationale: Secara harfiah menunjuk tembaga atau uang logam tembaga, tetapi dalam konteks ini berfungsi sebagai sebutan bagi uang; 'uang' alami dan tidak membebani kalimat dengan rincian bahan logam.
- source_word: πολλοὶ πλούσιοι
  choice: banyak orang kaya
  rationale: Padanan langsung dan alami yang tidak mempersempit rujukan generik maskulin Yunani menjadi laki-laki saja.
- source_word: πολλά
  choice: dalam jumlah besar
  rationale: Neutrum jamak secara idiomatis menyatakan banyak uang; frasa ini jelas mengacu pada besarnya jumlah yang dimasukkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Nama 'Yesus' dibuat eksplisit karena subjek tersirat dalam bahasa Yunani dan diperlukan agar ayat dapat dipahami dengan lancar sebagai unit tersendiri. Pengulangan kedua atas γαζοφυλάκιον diganti dengan pronomina '-nya' untuk menghindari kekakuan tanpa mengubah acuan.
