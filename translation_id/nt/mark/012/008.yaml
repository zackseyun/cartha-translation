  yaml_path: translation/nt/mark/012/008.yaml
  text: And they took him[a], killed him, and threw him out of the vineyard.
translation:
  language: id
  text: Lalu mereka menangkapnya, membunuhnya, dan melemparkannya ke luar kebun anggur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian pembaca mungkin mengharapkan urutan “melemparkannya ke luar kebun anggur, lalu membunuhnya” berdasarkan perumpamaan yang sejajar. Namun, teks Yunani Markus di sini berbunyi “membunuhnya, dan melemparkannya ke luar kebun anggur.”
    reason: cross_reference
lexical_decisions:
- source_word: λαβόντες
  choice: menangkap dia
  rationale: Partisip aoristus dari λαμβάνω mengawali rangkaian tindakan. Dalam konteks para penggarap yang menyerang sang anak, “menangkap dia” menyampaikan tindakan menguasai orang itu secara alami tanpa melebihkan unsur kekerasannya.
- source_word: ἀπέκτειναν
  choice: membunuhnya
  rationale: ἀποκτείνω secara langsung berarti membunuh atau membuat mati; “membunuhnya” jelas, lugas, dan sesuai dengan ketegasan rangkaian tindakan dalam perumpamaan.
- source_word: ἐξέβαλον
  choice: melemparkannya ke luar
  rationale: ἐκβάλλω di sini menyatakan tindakan membuang dengan kuat ke luar suatu tempat. “Melemparkannya ke luar” mempertahankan daya ungkap verba tersebut dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: ke luar kebun anggur
  rationale: Dengan verba gerak ἐξέβαλον, frasa ini menunjukkan gerak dari dalam menuju luar kebun anggur; “ke luar kebun anggur” menyatakan arah itu secara alami.
- source_word: ἀμπελῶνος
  choice: kebun anggur
  rationale: ἀμπελών adalah lahan tempat tanaman anggur dibudidayakan; padanan baku dan mudah dipahami ialah “kebun anggur”.
theological_decisions:
- issue: Urutan pembunuhan dan pembuangan dalam perumpamaan
  choice: 'Teks mempertahankan urutan Yunani: mereka membunuhnya, kemudian melemparkannya ke luar kebun anggur.'
  alternative: Melemparkannya ke luar kebun anggur terlebih dahulu, kemudian membunuhnya.
  rationale: SBLGNT untuk Markus 12:8 menempatkan ἀπέκτειναν sebelum ἐξέβαλον. Terjemahan tidak menyelaraskan urutan ini dengan tradisi perumpamaan paralel atau dugaan urutan peristiwa lain.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Rangkaian verba dibuat ringkas untuk mempertahankan laju narasi, sedangkan penanda catatan kaki ditempatkan setelah seluruh kalimat karena menjelaskan urutan dua tindakan terakhir.
