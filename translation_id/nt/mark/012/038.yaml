  text: Καὶ ⸂ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν⸃· Βλέπετε ἀπὸ τῶν γραμματέων τῶν θελόντων ἐν στολαῖς περιπατεῖν καὶ ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/038.yaml
  text: And in his teaching he was saying[b][a], “Beware of the scribes who want to walk around in long robes and receive greetings in the marketplaces,”
translation:
  language: id
  text: Dalam pengajaran-Nya, Ia berkata, “Waspadalah terhadap ahli-ahli Taurat[a] yang ingin berjalan-jalan dengan jubah panjang[b] dan mendapat salam di pasar-pasar,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Hati-hatilah terhadap ahli-ahli Taurat” atau “Berjaga-jagalah terhadap ahli-ahli Taurat.”
    reason: lexical_alternative
  - marker: b
    text: “Jubah panjang” adalah pakaian luar mencolok yang berkaitan dengan kedudukan dan kehormatan di depan umum.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: Dalam pengajaran-Nya
  rationale: Mempertahankan gambaran pengajaran sebagai lingkup atau konteks perkataan Yesus, dengan susunan yang tetap wajar dalam bahasa Indonesia.
- source_word: ἔλεγεν
  choice: Ia berkata
  rationale: Bentuk ini alami untuk memperkenalkan ajaran langsung dalam narasi Indonesia. Aspek imperfek Yunani dipahami sebagai perkataan yang berlangsung dalam kegiatan mengajar, tanpa harus dibuat kaku dengan 'sedang mengatakan'.
- source_word: Βλέπετε ἀπὸ
  choice: Waspadalah terhadap
  rationale: Ungkapan ini menyampaikan perintah untuk berjaga-jaga terhadap bahaya atau pengaruh orang-orang yang disebutkan, serta mempertahankan nada peringatan yang tegas.
- source_word: γραμματέων
  choice: ahli-ahli Taurat
  rationale: Istilah baku dan mudah dipahami bagi kelompok ahli kitab dan hukum dalam konteks Yahudi, tanpa menyamakan mereka dengan penyalin naskah biasa.
- source_word: τῶν θελόντων
  choice: yang ingin
  rationale: Menyatakan kehendak atau hasrat khas kelompok yang digambarkan, dan tidak memperlemah unsur kemauan menjadi sekadar kebiasaan.
- source_word: ἐν στολαῖς περιπατεῖν
  choice: berjalan-jalan dengan jubah panjang
  rationale: στολή menunjuk pada jubah luar yang panjang atau megah, sedangkan περιπατεῖν di sini menggambarkan tampil berkeliling di depan umum.
- source_word: ἀσπασμοὺς
  choice: salam
  rationale: Padanan langsung yang tetap memungkinkan konteks menunjukkan bahwa yang dicari ialah pengakuan atau penghormatan di depan umum.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: di pasar-pasar
  rationale: ἀγοραί adalah kawasan pasar yang juga menjadi ruang pertemuan umum; 'pasar-pasar' mempertahankan latar konkret teks tanpa memperluasnya menjadi semua tempat umum.
theological_decisions:
- issue: Cakupan peringatan Yesus terhadap ahli-ahli Taurat
  choice: Klausa 'yang ingin...' dibiarkan membatasi atau mencirikan ahli-ahli Taurat yang menjadi sasaran peringatan.
  alternative: Memahami perkataan ini sebagai kecaman menyeluruh terhadap setiap ahli Taurat tanpa kecuali.
  rationale: Susunan Yunani menyebut ahli-ahli Taurat lalu mencirikan mereka dengan partisip τῶν θελόντων. Terjemahan tidak menambahkan tanda baca atau keterangan yang memutus hubungan pembatas tersebut, sehingga ketegangan cakupan dalam teks tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'Ia' dan akhiran '-Nya' mengikuti register narasi kitab suci yang sopan. Pengulangan 'pasar-pasar' dipilih untuk mewakili bentuk jamak Yunani dan ruang publik konkret pada masa itu. Tanda koma penutup dipertahankan karena perkataan Yesus berlanjut pada ayat berikutnya.
