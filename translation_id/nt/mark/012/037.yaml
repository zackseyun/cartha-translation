base_translation:
  language: en
  yaml_path: translation/nt/mark/012/037.yaml
  text: David himself calls him Lord[b][a], so how is he his son? And the large crowd was listening to him gladly.
translation:
  language: id
  text: Daud sendiri menyebut Dia ‘Tuhan’[a]. Jadi, bagaimana mungkin Dia anak Daud?[b] Dan orang banyak itu mendengarkan Dia dengan senang hati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tuan.”'
    reason: lexical_alternative
  - marker: b
    text: Kata “anak” di sini menggemakan gelar mesianik “Anak Daud” dan juga dapat berarti “keturunan”. Secara lebih harfiah, pertanyaannya berbunyi, “Dari manakah Ia menjadi anaknya?”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: Daud sendiri
  rationale: Pemakaian intensif αὐτός menegaskan bahwa Daud secara pribadi menyebut sosok tersebut Tuhan.
- source_word: λέγει αὐτὸν κύριον
  choice: menyebut Dia ‘Tuhan’
  rationale: Dalam konstruksi ini λέγει menyatakan penyebutan atau predikasi; ‘menyebut ... Tuhan’ alami dalam bahasa Indonesia dan mempertahankan κύριος sebagai gelar.
- source_word: πόθεν
  choice: bagaimana mungkin
  rationale: Secara harfiah berarti ‘dari mana’, tetapi di sini mempertanyakan dasar atau kemungkinan logis hubungan yang baru disebutkan.
- source_word: αὐτοῦ ἐστιν υἱός
  choice: Dia adalah anak Daud
  rationale: ‘Anak’ mempertahankan υἱός dan gaung gelar mesianik ‘Anak Daud’; nama Daud diulang agar rujukan pronomina tidak rancu dalam bahasa Indonesia.
- source_word: ὁ πολὺς ὄχλος
  choice: orang banyak itu
  rationale: Frasa ini menunjuk kepada kerumunan besar; ungkapan Indonesia yang alami ialah ‘orang banyak’, sedangkan jumlah besarnya sudah tersirat secara idiomatis.
- source_word: ἤκουεν αὐτοῦ ἡδέως
  choice: mendengarkan Dia dengan senang hati
  rationale: Bentuk imperfek mendukung tindakan yang sedang berlangsung, dan ἡδέως menyatakan bahwa mereka mendengarkan dengan rasa senang.
theological_decisions:
- issue: Daya kristologis ketika Daud menyebut Mesias ‘Tuhan’
  choice: Gelar ‘Tuhan’ dan pertanyaan retoris dipertahankan tanpa penjelasan doktrinal tambahan.
  alternative: Daud sendiri menyebut Mesias ‘Tuhan’; jadi, dalam arti apa Dia anak Daud?
  rationale: Teks menampilkan ketegangan antara status sebagai anak Daud dan sebutan Tuhan, tetapi tidak menjelaskan sepenuhnya bagaimana keduanya berkaitan.
- issue: Makna υἱός dalam konteks mesianik
  choice: anak
  alternative: keturunan
  rationale: ‘Anak’ mempertahankan bentuk ungkapan sumber dan gaung gelar mesianik ‘Anak Daud’, sementara catatan menjelaskan cakupan dinastiknya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Huruf kapital pada ‘Dia’ digunakan untuk kejernihan rujukan kepada sosok yang sedang dibicarakan, bukan untuk menyelesaikan ketegangan teologis teks.
