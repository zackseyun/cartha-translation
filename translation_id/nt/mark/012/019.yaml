revisions:
- from: '“Guru, Musa telah menulis bagi kita: Jika saudara seseorang meninggal dan meninggalkan seorang istri, tetapi tidak meninggalkan anak,[a][b] saudaranya harus mengambil istri itu dan membangkitkan keturunan bagi saudaranya.[c]”'
  to: '“Guru, Musa telah menulis bagi kita: Jika saudara laki-laki seseorang meninggal dan meninggalkan seorang istri serta tidak meninggalkan anak,[a][b] saudara laki-lakinya harus menikahi istri itu dan menghasilkan keturunan bagi saudaranya.[c]”'
  rationale: Revisi menandai gender maskulin yang dinyatakan oleh ἀδελφός, menghapus nuansa pertentangan yang tidak ada dalam καί, dan mengganti kalke “membangkitkan keturunan” dengan ungkapan Indonesia yang jelas dan wajar. “Menikahi” menerjemahkan idiom λάβῃ ... τὴν γυναῖκα secara idiomatis dalam konteks hukum perkawinan, sementara catatan mempertahankan bentuk harfiahnya pada idiom keturunan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:11:46Z'
review_pass:
  verdict: revise
  source_fidelity: Makna dasar hukum yang dikutip terjaga, tetapi ἀδελφός dalam kedua kemunculannya secara khusus menunjuk saudara laki-laki. Kata hubung καί tidak bernada pertentangan; karena itu “tetapi” sebaiknya tidak dipakai. Ungkapan ἐξαναστήσῃ σπέρμα adalah idiom untuk menghasilkan/menegakkan keturunan bagi saudara yang meninggal, bukan “membangkitkan keturunan” dalam arti biasa bahasa Indonesia.
  naturalness: “Saudara seseorang” dapat dipahami netral-gender dan “membangkitkan keturunan” merupakan kolokasi yang tidak lazim serta dapat mengingatkan pembangkitan dari kematian. “Saudara laki-laki seseorang,” “menikahi,” dan “menghasilkan keturunan” lebih alami dalam bahasa Indonesia baku tanpa mengurangi isi hukum tersebut.
  terminology: “Guru” dan “Musa” sudah tepat. Istilah “istri” dipertahankan sesuai γυνή dalam konteks hukum perkawinan. Catatan idiom diperpendek agar menjelaskan idiom tanpa menambahkan tujuan “meneruskan garis keturunan” sebagai penafsiran tersendiri.
  issues:
  - severity: medium
    issue: Istilah “saudara” tidak menandai laki-laki.
    rationale: ἀδελφός dalam hukum yang dikutip menunjuk saudara laki-laki, dan konteksnya menuntut saudara itu menikahi istri saudaranya yang meninggal.
  - severity: low
    issue: “Tetapi” memberi nuansa adversatif yang tidak ada dalam καί.
    rationale: 'Teks Yunani hanya menghubungkan dua keadaan: ia meninggalkan istri dan tidak meninggalkan anak.'
  - severity: medium
    issue: “Membangkitkan keturunan” tidak lazim dan berpotensi salah dipahami.
    rationale: Idiom Yunani tidak berbicara tentang membangkitkan keturunan yang telah ada, melainkan menghasilkan keturunan bagi saudara yang meninggal.
  - severity: low
    issue: Catatan c memuat penjelasan tujuan yang lebih spesifik daripada ungkapan Yunani.
    rationale: Penjelasan tentang perkawinan dengan janda saudara memadai; frasa “demi meneruskan garis keturunan” sebaiknya tidak diperlakukan sebagai isi eksplisit ayat.
