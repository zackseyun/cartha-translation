source:
  edition: SBLGNT
  text: Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν ὅτι ἐάν τινος ἀδελφὸς ἀποθάνῃ καὶ καταλίπῃ γυναῖκα καὶ ⸂μὴ ἀφῇ τέκνον⸃, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν ⸀γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/019.yaml
  text: Teacher[a], Moses wrote for us that if someone's brother dies and leaves behind a wife and leaves no child[c][b], his brother should take the wife and raise up offspring for his brother.
translation:
  language: id
  text: '“Guru, Musa telah menulis bagi kita: Jika saudara laki-laki seseorang meninggal dan meninggalkan seorang istri serta tidak meninggalkan anak,[a][b] saudara laki-lakinya harus menikahi istri itu dan menghasilkan keturunan bagi saudaranya.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak meninggalkan seorang anak”; bentuk tunggal ini dapat mencakup pengertian “tidak meninggalkan anak-anak.”
    reason: lexical_alternative
  - marker: b
    text: Lihat Ulangan 25:5 mengenai ketentuan dalam hukum Musa yang dirujuk di sini.
    reason: cross_reference
  - marker: c
    text: Secara harfiah, “membangkitkan benih bagi saudaranya”; ini adalah ungkapan untuk menghasilkan keturunan melalui perkawinan dengan janda saudaranya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Sapaan vokatif kepada Yesus; 'Guru' merupakan padanan baku, jelas, dan wajar dalam bahasa Indonesia modern.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: ἔγραψεν ἡμῖν
  choice: telah menulis bagi kita
  rationale: Datif ἡμῖν menyatakan kepentingan atau acuan; 'bagi kita' mempertahankan klaim para penutur bahwa ketentuan Musa berlaku bagi umat Israel.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: jika saudara seseorang meninggal
  rationale: τινος adalah genitif tak tentu; susunan ini mempertahankan sifat umum pernyataan tanpa menambahkan unsur yang tidak dinyatakan.
- source_word: καταλίπῃ γυναῖκα
  choice: meninggalkan seorang istri
  rationale: Dalam konteks kematian, καταλείπω berarti meninggalkan seseorang yang masih hidup; bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: μὴ ἀφῇ τέκνον
  choice: tidak meninggalkan anak
  rationale: τέκνον berbentuk tunggal dan dapat dipakai secara generik. Pengulangan 'meninggalkan' mencerminkan ἀφῇ serta memperjelas kesejajaran klausa.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: saudaranya harus mengambil istri itu
  rationale: Dalam konteks hukum perkawinan levirat, λάβῃ γυναῖκα menyiratkan mengambil sebagai istri. 'Mengambil istri itu' tetap dekat dengan ungkapan Yunani, sedangkan makna menikah dijelaskan dalam catatan.
- source_word: ἐξαναστήσῃ σπέρμα
  choice: membangkitkan keturunan
  rationale: Ungkapan ini secara harfiah berarti 'membangkitkan benih' dan mengacu pada memperoleh keturunan bagi saudara yang meninggal. 'Membangkitkan keturunan' mempertahankan citra sumber tanpa memakai 'benih' yang berpotensi kabur.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: bagi saudaranya
  rationale: Datif menyatakan kepentingan atau peruntukan. Status saudara itu sebagai orang yang telah meninggal sudah jelas dari klausa sebelumnya.
theological_decisions:
- issue: Penerjemahan ungkapan hukum perkawinan levirat tanpa menambahkan tafsiran
  choice: saudaranya harus mengambil istri itu dan membangkitkan keturunan bagi saudaranya
  alternative: saudaranya harus menikahi janda itu dan memperoleh keturunan bagi saudaranya yang meninggal
  rationale: Pilihan utama mempertahankan ungkapan Yunani dan ketegangan hukumnya, sementara catatan menjelaskan bahwa 'mengambil' berarti mengambil dalam perkawinan dan bahwa keturunan itu diperhitungkan bagi saudara yang meninggal.
- issue: Bahasa bergender dalam ketentuan hukum
  choice: Mempertahankan istilah 'saudara' dan 'istri'.
  alternative: Menggunakan istilah netral seperti 'saudara kandung' dan 'pasangan'.
  rationale: ἀδελφός dan γυνή secara eksplisit menunjuk laki-laki dan perempuan dalam konteks perkawinan ini; penetralan gender akan mengaburkan bentuk hukum yang dikutip.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kutipan hukum dipertahankan, dengan tanda titik dua untuk memperkenalkan isi yang ditulis Musa. 'Mengambil istri itu' dipilih demi kedekatan dengan teks sumber, sedangkan makna perkawinannya diterangkan dalam catatan kaki.
