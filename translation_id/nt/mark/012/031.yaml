  text: ⸀δευτέρα αὕτη· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν. μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/031.yaml
  text: 'The second is this: ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these[a].'
translation:
  language: id
  text: 'Yang kedua ialah: “Kasihilah sesamamu seperti dirimu sendiri.” Tidak ada perintah lain yang lebih besar daripada perintah-perintah ini.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δευτέρα αὕτη
  choice: Yang kedua ialah
  rationale: Ungkapan Yunani ini eliptis; kata benda ‘perintah’ dipahami dari konteks. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan penekanan pada urutan kedua.
- source_word: Ἀγαπήσεις
  choice: Kasihilah
  rationale: Bentuk future indicative dalam kutipan Kitab Suci berfungsi sebagai perintah. Imperatif ‘Kasihilah’ menyampaikan daya perintah secara alami sekaligus mempertahankan kaitan dengan Imamat 19:18.
- source_word: τὸν πλησίον σου
  choice: sesamamu
  rationale: ‘Sesamamu’ merupakan padanan Indonesia yang mapan dan tepat dalam konteks etis serta mempertahankan hubungan antarteks dengan Imamat 19:18.
- source_word: ὡς σεαυτόν
  choice: seperti dirimu sendiri
  rationale: Padanan ringkas ini mengikuti perbandingan dalam bahasa Yunani tanpa menambahkan kata kerja yang tidak dinyatakan.
- source_word: μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν
  choice: Tidak ada perintah lain yang lebih besar daripada kedua perintah ini
  rationale: Terjemahan ini mempertahankan perbandingan μείζων dan bentuk jamak τούτων. Penyebutan ‘kedua’ membuat rujukan jamaknya jelas dan alami dalam bahasa Indonesia berdasarkan konteks langsung.
- source_word: ἐντολή
  choice: perintah
  rationale: ‘Perintah’ adalah padanan modern, jelas, dan bermartabat untuk ἐντολή dalam pembicaraan tentang perintah-perintah Taurat; ‘hukum’ dapat mengaburkan perbedaan antara satu perintah dan keseluruhan Taurat.
theological_decisions:
- issue: Rujukan τούτων (‘ini’) dalam klausa terakhir
  choice: Merujuk pada dua perintah secara bersama-sama
  alternative: Merujuk hanya pada perintah kedua yang baru saja disebut, dalam pengertian umum
  rationale: Demonstrativa jamak τούτων paling wajar menunjuk kepada kedua perintah dalam konteks, yakni mengasihi Allah dan mengasihi sesama. Terjemahan mempertahankan rujukan jamak tersebut tanpa meleburkannya menjadi gagasan tunggal.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Yang kedua ialah’ mempertahankan susunan dan penekanan Yunani; ‘Kasihilah’ menjaga nada kutipan Kitab Suci tanpa terdengar kuno. Tidak diperlukan catatan kaki karena rujukan bentuk jamak dapat disampaikan secara jelas di dalam teks.
