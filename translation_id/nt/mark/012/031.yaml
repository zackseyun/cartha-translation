  naturalness: “Yang kedua ialah,” “Kasihilah sesamamu seperti dirimu sendiri,” dan “Tidak ada perintah lain yang lebih besar daripada perintah-perintah ini” adalah bahasa Indonesia modern yang wajar serta tetap bernada Kitab Suci.
