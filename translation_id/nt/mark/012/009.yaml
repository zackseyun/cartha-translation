id: MRK.12.9
reference: Mark 12:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀τί ποιήσει ὁ κύριος τοῦ ἀμπελῶνος; ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργούς, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/009.yaml
  text: What will the owner of the vineyard do? He will come and destroy the tenant farmers[a], and give the vineyard to others.
translation:
  language: id
  text: Apa yang akan dilakukan pemilik kebun anggur itu? Ia akan datang dan membinasakan para penggarap[a] itu, lalu memberikan kebun anggur itu kepada orang-orang lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para petani penyewa”; istilah Yunani ini menunjuk kepada orang-orang yang menggarap kebun milik orang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ποιήσει
  choice: Apa yang akan dilakukan
  rationale: Menerjemahkan pertanyaan retoris dan bentuk futur secara langsung serta alami dalam bahasa Indonesia tanpa menambahkan kata penghubung yang tidak terdapat dalam teks Yunani.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: pemilik kebun anggur itu
  rationale: Dalam dunia perumpamaan, κύριος menunjuk kepada orang yang memiliki kebun anggur. 'Pemilik' menyampaikan makna kontekstual tanpa memasukkan gelar ilahi secara eksplisit.
- source_word: ἀμπελῶνος / ἀμπελῶνα
  choice: kebun anggur
  rationale: Padanan Indonesia yang lazim dan tepat bagi ἀμπελών dalam konteks pertanian dan perumpamaan.
- source_word: ἐλεύσεται
  choice: Ia akan datang
  rationale: Mempertahankan bentuk futur dan gambaran jelas tentang kedatangan sang pemilik untuk bertindak.
- source_word: ἀπολέσει
  choice: membinasakan
  rationale: Menyampaikan kerasnya tindakan penghakiman yang dinyatakan oleh ἀπόλλυμι tanpa mempersempitnya secara otomatis menjadi 'membunuh'.
- source_word: τοὺς γεωργούς
  choice: para penggarap
  rationale: Dalam konteks ini, γεωργοί adalah orang-orang yang menggarap kebun milik orang lain. 'Para penggarap' alami dalam bahasa Indonesia dan mempertahankan dimensi pertanian; catatan kaki menjelaskan kemungkinan nuansa penyewa.
- source_word: δώσει
  choice: memberikan
  rationale: Padanan langsung bagi δίδωμι dan tidak mempersempit tindakan itu menjadi menyewakan atau memercayakan.
- source_word: ἄλλοις
  choice: kepada orang-orang lain
  rationale: Mempertahankan keterbukaan rujukan dalam bentuk jamak; teks Yunani tidak secara eksplisit menyebut mereka sebagai penggarap lain.
theological_decisions:
- issue: Penerjemahan κύριος ketika menunjuk kepada tokoh manusia dalam perumpamaan
  choice: pemilik
  alternative: tuan
  rationale: Rujukan langsungnya ialah pemilik kebun dalam dunia cerita. Pilihan 'pemilik' menghindari pemberian gelar ilahi secara tersurat, sementara makna teologis perumpamaan tetap dapat muncul dari konteks.
- issue: Cakupan tindakan ἀπολέσει
  choice: membinasakan
  alternative: membunuh
  rationale: '''Membinasakan'' mempertahankan cakupan leksikal dan bobot penghakiman verba Yunani; ''membunuh'' mungkin secara kontekstual, tetapi lebih sempit.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan pertanyaan dipertahankan ringkas; 'lalu' mengalirkan rangkaian tindakan secara alami tanpa mengubah hubungan dasarnya. Pronomina 'Ia' menggunakan huruf kapital karena mengawali kalimat, bukan sebagai penandaan gelar ilahi.
