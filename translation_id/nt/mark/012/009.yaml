  source_fidelity: 'Teks dengan setia menerjemahkan pertanyaan futur τί ποιήσει, subjek kontekstual ὁ κύριος τοῦ ἀμπελῶνος sebagai “pemilik kebun anggur itu,” serta urutan tindakan futur: datang, membinasakan para γεωργοί, dan memberikan kebun itu kepada ἄλλοις. “Orang-orang lain” mempertahankan rujukan ἄλλοις yang terbuka dan tidak menambahkan bahwa mereka adalah penggarap baru.'
