  terminology: “Pemilik” tepat untuk κύριος dalam dunia cerita dan tidak mengimpor penggunaan gelar ilahi. “Kebun anggur” merupakan padanan baku untuk ἀμπελών. “Membinasakan” secara tepat mempertahankan cakupan keras ἀπολέσει tanpa membatasi maknanya menjadi sekadar “membunuh.” Catatan kaki pada “penggarap” secara memadai mencatat nuansa petani penyewa yang ditentukan oleh konteks perumpamaan.
