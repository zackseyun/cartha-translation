  to: Tentang orang-orang mati, bahwa mereka dibangkitkan, tidakkah kamu membaca dalam kitab Musa, dalam bagian tentang semak duri,[a] bagaimana Allah berfirman kepadanya, ‘Akulah Allah Abraham, Allah Ishak, dan Allah Yakub’?
  rationale: Revisi hanya mengganti ‘belum pernahkah kamu baca’ dengan ‘tidakkah kamu membaca’ agar pertanyaan retoris Yunani diterjemahkan tanpa menambahkan nuansa pengalaman ‘pernah’. Unsur-unsur lain dipertahankan karena setia pada sumber dan alami dalam bahasa Indonesia baku.
