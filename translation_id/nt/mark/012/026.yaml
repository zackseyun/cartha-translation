    issue: ‘Belum pernahkah kamu baca’ terlalu mengkhususkan waktu/aspek.
    rationale: οὐκ ἀνέγνωτε adalah pertanyaan retoris aoris, ‘tidakkah kamu membaca/membaca’, tanpa kata yang berarti ‘pernah’. Frasa Indonesia tersebut dapat menyiratkan bahwa para pendengar sama sekali belum pernah membaca bagian itu.
