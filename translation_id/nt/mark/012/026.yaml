  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται οὐκ ἀνέγνωτε ἐν τῇ βίβλῳ Μωϋσέως ἐπὶ τοῦ βάτου ⸀πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων· Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ⸂ὁ θεὸς Ἰσαὰκ καὶ ὁ⸃ θεὸς Ἰακώβ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/026.yaml
  text: And concerning the dead[a], that they are raised, have you not read in the book of Moses, in the passage about the bush, how God spoke to him, saying, ‘I am the God of Abraham and the God of Isaac and the God of Jacob’?”
translation:
  language: id
  text: Tentang orang-orang mati, bahwa mereka dibangkitkan, tidakkah kamu membaca dalam kitab Musa, dalam bagian tentang semak duri,[a] bagaimana Allah berfirman kepadanya, ‘Akulah Allah Abraham, Allah Ishak, dan Allah Yakub’?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di semak duri”; ungkapan Yunani ini dapat menunjuk bagian Kitab Suci berdasarkan peristiwa semak duri.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τῶν νεκρῶν
  choice: Tentang orang-orang mati
  rationale: περί dengan genitif memperkenalkan pokok pembicaraan. δέ berfungsi sebagai penghubung ringan; dalam bahasa Indonesia, alur ini tetap alami tanpa harus menerjemahkannya secara eksplisit sebagai kontras.
- source_word: ὅτι ἐγείρονται
  choice: bahwa mereka dibangkitkan
  rationale: Bentuk kini pasif ἐγείρονται dalam konteks ini mengacu pada kebangkitan orang mati. ‘Dibangkitkan’ mempertahankan nuansa pasif tanpa menentukan pelaku secara eksplisit.
- source_word: οὐκ ἀνέγνωτε
  choice: belum pernahkah kamu baca
  rationale: Pertanyaan retoris ini merujuk pada pengetahuan mereka akan Kitab Suci. Bentuk Indonesia ini alami dan mempertahankan daya tegur rumusan Yunani.
- source_word: ἐν τῇ βίβλῳ Μωϋσέως
  choice: dalam kitab Musa
  rationale: βίβλος dapat berarti kitab atau gulungan. ‘Kitab Musa’ merupakan ungkapan Indonesia yang jelas dan wajar untuk tulisan Musa.
- source_word: ἐπὶ τοῦ βάτου
  choice: dalam bagian tentang semak duri
  rationale: Ungkapan ini dapat menunjuk bagian Kitab Suci yang dikenali melalui peristiwa semak duri, bukan hanya lokasi fisik. Terjemahan utama membuat fungsi rujukan itu jelas, sementara alternatif harfiahnya dicatat.
- source_word: πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων
  choice: bagaimana Allah berfirman kepadanya
  rationale: πῶς memperkenalkan bagaimana atau apa yang Allah katakan, sedangkan λέγων membuka kutipan. ‘Berfirman’ adalah padanan Indonesia yang alami dan bermartabat bagi perkataan Allah; satu verba cukup tanpa pengulangan ‘dengan berkata’.
- source_word: Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: Akulah Allah Abraham, Allah Ishak, dan Allah Yakub
  rationale: ‘Akulah’ menegaskan ἐγώ dan identifikasi dalam kutipan. Pengulangan ‘Allah’ mempertahankan tekanan retoris struktur Yunani, dengan susunan kepunyaan yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa kebangkitan dalam ὅτι ἐγείρονται
  choice: bahwa mereka dibangkitkan
  alternative: bahwa mereka bangkit
  rationale: Bentuk pasif dipertahankan agar nuansa bahwa kebangkitan dikenakan kepada orang mati tidak hilang, tanpa menambahkan keterangan yang tidak dinyatakan teks.
- issue: Identifikasi diri Allah dalam kutipan
  choice: Akulah Allah Abraham, Allah Ishak, dan Allah Yakub
  alternative: Aku adalah Allah Abraham, Allah Ishak, dan Allah Yakub
  rationale: ‘Akulah’ mempertahankan penekanan pada ἐγώ dan sifat kini dari pernyataan Allah, yang penting bagi alur argumen, tanpa menjelaskan kesimpulan teologisnya di dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kata ganti ‘kamu’ mengikuti sapaan jamak dalam konteks tanpa memasukkan bentuk yang terlalu formal. Tanda catatan [a] ditempatkan tepat setelah frasa yang dijelaskannya.
