lexical_decisions:
- source_word: πρωτοκαθεδρίας
  choice: tempat-tempat duduk terhormat
  rationale: Kata ini menunjuk pada tempat duduk dengan kedudukan atau kehormatan tertinggi dalam suatu pertemuan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penekanan pada status sosial.
- source_word: συναγωγαῖς
  choice: rumah-rumah ibadat
  rationale: Dalam konteks ini, kata tersebut menunjuk pada tempat pertemuan dan ibadah orang Yahudi. 'Rumah ibadat' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: πρωτοκλισίας
  choice: tempat-tempat kehormatan
  rationale: Kata ini menunjuk pada posisi berbaring atau tempat yang paling terhormat dalam jamuan kuno. Padanan ini menyampaikan fungsi sosialnya tanpa mengharuskan pembaca modern memahami tata cara makan kuno.
- source_word: δείπνοις
  choice: perjamuan
  rationale: Kata ini dapat berarti santapan atau jamuan makan; konteks menonjolkan acara sosial tempat kehormatan diperebutkan, sehingga 'perjamuan' sesuai dan bermartabat.
- source_word: καὶ ... καὶ
  choice: dan ... serta
  rationale: Kedua unsur koordinatif dipertahankan, sementara variasi 'dan ... serta' menghasilkan susunan Indonesia yang alami.
- source_word: ἐν ταῖς συναγωγαῖς ... ἐν τοῖς δείπνοις
  choice: di rumah-rumah ibadat ... dalam perjamuan
  rationale: 'Preposisi diterjemahkan secara idiomatis menurut konteks: ''di'' untuk lokasi dan ''dalam'' untuk lingkungan acara perjamuan.'
