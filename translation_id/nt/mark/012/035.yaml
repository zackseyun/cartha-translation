  terminology: “Bait Allah,” “Mesias,” “Kristus” dalam catatan kaki, dan “anak Daud” sudah tepat. “Anak Daud” perlu dipertahankan karena merupakan sebutan mesianik yang sedang dibahas, bukan diganti dengan penjelasan “keturunan Daud.”
