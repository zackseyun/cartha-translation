source:
  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς ἔλεγεν διδάσκων ἐν τῷ ἱερῷ· Πῶς λέγουσιν οἱ γραμματεῖς ὅτι ὁ χριστὸς υἱὸς ⸂Δαυίδ ἐστιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/035.yaml
  text: And Jesus answered and said[a], as he was teaching in the temple, “How do the scribes say that the Messiah is the son of David?”
translation:
  language: id
  text: Yesus menanggapi sambil mengajar di Bait Allah, “Bagaimana para ahli Taurat dapat mengatakan bahwa Mesias[a] adalah anak Daud?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.” Gelar Yunani Christos di sini digunakan dalam arti mesianik.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: menanggapi
  rationale: Partisip ini biasanya berarti ‘menjawab’ atau ‘menanggapi’, tetapi di sini tidak ada pertanyaan langsung sebelumnya. ‘Menanggapi’ mempertahankan nuansa respons terhadap pembahasan atau keadaan tanpa menyiratkan adanya pertanyaan yang tidak disebutkan.
- source_word: ἔλεγεν
  choice: dengan berkata
  rationale: Bentuk imperfek memperkenalkan ucapan Yesus dalam konteks kegiatan mengajar yang sedang berlangsung. Ungkapan ini menyatu secara alami dengan ‘menanggapi’ dalam bahasa Indonesia.
- source_word: διδάσκων
  choice: ketika mengajar
  rationale: Partisip kini menyatakan tindakan yang berlangsung bersamaan dengan ucapan Yesus.
- source_word: ἐν τῷ ἱερῷ
  choice: di Bait Allah
  rationale: Ἱερόν menunjuk pada kompleks Bait Allah, bukan hanya ruang kudus bagian dalam. ‘Bait Allah’ adalah istilah baku dan wajar dalam bahasa Indonesia.
- source_word: Πῶς
  choice: Bagaimana ... dapat
  rationale: Dalam pertanyaan retoris ini, Πῶς mempertanyakan dasar atau kemungkinan pernyataan para ahli Taurat, bukan sekadar cara mereka mengucapkannya. Bentuk ini menyampaikan daya retoris tersebut tanpa mengubahnya menjadi penyangkalan eksplisit.
- source_word: γραμματεῖς
  choice: ahli-ahli Taurat
  rationale: Istilah ini secara historis menunjuk pada para ahli kitab dan hukum Yahudi. ‘Ahli-ahli Taurat’ merupakan padanan Indonesia yang mapan dan lebih jelas daripada transliterasi profesi kunonya.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Χριστός dipakai sebagai gelar dalam konteks pengharapan mesianik Yahudi, sehingga ‘Mesias’ paling tepat dalam teks utama.
- source_word: υἱὸς Δαυίδ
  choice: anak Daud
  rationale: Ungkapan ini mempertahankan sebutan mesianik sekaligus kemungkinan makna keturunan Daud. Bahasa Indonesia tidak memerlukan kata sandang tertentu di sini.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam perdebatan ini Χριστός jelas berfungsi sebagai gelar yang berakar dalam pengharapan Yahudi. ‘Mesias’ dipakai dalam teks utama, sedangkan padanan tradisional ‘Kristus’ dicatat sebagai alternatif.
- issue: Hubungan Mesias dengan Daud
  choice: anak Daud
  alternative: keturunan Daud
  rationale: ‘Anak Daud’ mempertahankan bentuk dan ketegangan pertanyaan Yesus. Menggantikannya dengan ‘keturunan Daud’ akan menjelaskan makna genealogis, tetapi mengurangi bentuk gelar yang sedang dipersoalkan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan nuansa bahwa Yesus sedang menanggapi suatu pokok pembahasan dalam kegiatan mengajar-Nya. Istilah ‘Bait Allah’, ‘ahli-ahli Taurat’, dan ‘Mesias’ mengikuti pemakaian Alkitabiah Indonesia yang umum.
