id: MRK.12.16
reference: Mark 12:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ ἤνεγκαν. καὶ λέγει αὐτοῖς· Τίνος ἡ εἰκὼν αὕτη καὶ ἡ ἐπιγραφή; οἱ δὲ εἶπαν αὐτῷ· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/016.yaml
  text: And they brought one. And he says to them[a], “Whose image is this, and whose inscription?” And they said to him, “Caesar’s.”
translation:
  language: id
  text: Mereka pun membawa sekeping uang[a]. Lalu Ia bertanya kepada mereka, “Gambar dan tulisan siapakah ini?” Mereka menjawab-Nya, “Kaisar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “membawanya.” Objek yang tidak disebutkan itu dipahami dari konteks sebelumnya sebagai uang dinar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  choice: membawa sekeping uang
  rationale: Kata kerja φέρω berarti ‘membawa’. Objeknya tidak disebutkan dalam ayat ini, tetapi konteks sebelumnya menunjuk pada sekeping uang dinar. Ungkapan ini alami dalam bahasa Indonesia tanpa memasukkan nilai uang itu ke dalam teks utama.
- source_word: λέγει
  choice: bertanya
  rationale: Secara leksikal berarti ‘berkata’, tetapi karena tuturan berikutnya berupa pertanyaan, ‘bertanya’ menyampaikan fungsi ujarannya secara alami. Bahasa Indonesia tidak menandai perbedaan antara kala kini historis dan kala lampau pada bentuk verba.
- source_word: Τίνος
  choice: siapakah
  rationale: Bentuk genetif interogatif ini menanyakan hubungan kepunyaan atau keterkaitan. Dalam susunan ‘gambar dan tulisan siapakah ini?’, pilihan ini idiomatis dan tidak memaksakan arti kepemilikan mutlak.
- source_word: εἰκών
  choice: gambar
  rationale: Dalam konteks mata uang, ‘gambar’ merupakan padanan yang jelas dan lazim bagi sosok yang dicetak pada uang logam.
- source_word: ἐπιγραφή
  choice: tulisan
  rationale: Kata ini menunjuk pada tulisan yang tertera pada mata uang. ‘Tulisan’ mudah dipahami pembaca umum, sedangkan ‘inskripsi’ kurang lazim.
- source_word: Καίσαρος
  choice: Kaisar
  rationale: Jawaban singkat ini mengikuti bentuk pertanyaan ‘siapakah’ dan secara alami berarti bahwa gambar serta tulisan itu berkaitan dengan Kaisar. Ini menghindari kesan keliru dari ‘milik Kaisar’ bahwa yang sedang ditegaskan ialah kepemilikan atas uang tersebut.
theological_decisions:
- issue: Makna genetif Καίσαρος
  choice: Kaisar
  alternative: milik Kaisar
  rationale: Genetif menjawab pertanyaan tentang identitas yang terkait dengan gambar dan tulisan, bukan secara tegas menetapkan kepemilikan hukum atas uang itu. Jawaban eliptis ‘Kaisar’ mempertahankan keluasan hubungan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Partikel ‘pun’ menandai kelanjutan tanggapan mereka. Kata ganti ‘Ia’ dan akhiran ‘-Nya’ dipakai menurut kebiasaan penulisan Alkitab bahasa Indonesia tanpa menambahkan gelar atau penafsiran ke dalam ayat.
