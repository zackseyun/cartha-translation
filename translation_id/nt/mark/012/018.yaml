  text: Καὶ ἔρχονται Σαδδουκαῖοι πρὸς αὐτόν, οἵτινες λέγουσιν ἀνάστασιν μὴ εἶναι, καὶ ⸀ἐπηρώτων αὐτὸν λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/018.yaml
  text: And Sadducees came to him, who say there is no resurrection, and they began questioning him, saying,
translation:
  language: id
  text: Lalu orang-orang Saduki, yang mengatakan bahwa tidak ada kebangkitan, datang kepada Yesus dan mulai bertanya kepada-Nya, dengan berkata,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: beberapa orang Saduki
  rationale: Nama kelompok ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia; 'beberapa orang' menyampaikan bentuk jamak secara alami tanpa menyiratkan bahwa semua anggota kelompok hadir.
- source_word: πρὸς αὐτόν
  choice: kepada Yesus
  rationale: Pronomina Yunani merujuk kepada Yesus; nama disebut untuk memperjelas rujukan secara alami dalam bahasa Indonesia.
- source_word: ἀνάστασιν
  choice: kebangkitan
  rationale: Padanan baku yang mempertahankan makna kebangkitan orang mati dalam konteks perdebatan ini.
- source_word: ἐπηρώτων
  choice: mulai bertanya
  rationale: Bentuk imperfek mendukung tindakan yang mulai berlangsung atau berlanjut; pilihan ini selaras dengan bukti aspek dan konteks pengantar pertanyaan.
- source_word: λέγοντες
  choice: kata mereka
  rationale: Ungkapan pengantar ujaran diterjemahkan secara idiomatis dan tetap mempertahankan transisi menuju kutipan langsung.
theological_decisions:
- issue: Penyangkalan orang Saduki terhadap ἀνάστασις
  choice: tidak ada kebangkitan
  alternative: orang mati tidak bangkit
  rationale: Terjemahan nominal mempertahankan bentuk dan keluasan pernyataan Yunani tanpa mempersempit atau menjelaskan lebih jauh posisi teologis mereka.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan klausa disesuaikan agar mengalir alami, sementara hubungan antargagasan dan aspek imperfek tetap dipertahankan.
