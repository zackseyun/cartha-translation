  text: ἐν τῇ ἀναστάσει ⸂ὅταν ἀναστῶσιν⸃ τίνος αὐτῶν ἔσται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/023.yaml
  text: In the resurrection[a], when they rise, whose wife will she be? For the seven had her as wife.
translation:
  language: id
  text: Pada waktu kebangkitan, ketika mereka bangkit, perempuan itu akan menjadi istri siapa? Sebab, ketujuh orang itu pernah menjadi suaminya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνάστασις
  choice: kebangkitan
  rationale: Dalam perdebatan dengan orang Saduki, nomina ini menunjuk pada kebangkitan pada akhir zaman. “Kebangkitan” merupakan padanan Indonesia yang alami dan mapan tanpa menambahkan “dari antara orang mati,” yang tidak dinyatakan di ayat ini.
- source_word: ὅταν ἀναστῶσιν
  choice: ketika mereka bangkit
  rationale: ὅταν dengan subjungtif aoris membentuk klausa waktu yang berorientasi ke masa depan. Terjemahan ini mempertahankan ungkapan Yunani tanpa menambahkan gagasan “kembali” yang hanya tersirat dari konteks.
- source_word: τίνος αὐτῶν
  choice: istri siapa
  rationale: Genitif interogatif dengan nuansa partitif paling wajar dinyatakan dalam bahasa Indonesia sebagai “istri siapa”; konteks sebelumnya membuat arti “siapa di antara mereka” jelas.
- source_word: ἔσται γυνή
  choice: akan menjadi istri
  rationale: Konstruksi predikat ini menanyakan kepada siapa perempuan tersebut akan berstatus sebagai istri. “Akan menjadi istri siapa?” alami dalam bahasa Indonesia dan tidak memaksakan artikel yang tidak ada dalam bahasa Yunani.
- source_word: γυνή
  choice: istri
  rationale: Kedua kemunculannya berada dalam konteks perkawinan, sehingga makna relasional “istri,” bukan arti umum “perempuan,” yang dimaksud.
- source_word: οἱ γὰρ ἑπτὰ
  choice: sebab, ketujuh orang itu
  rationale: γάρ memperkenalkan alasan bagi pertanyaan tersebut. “Ketujuh orang itu” merujuk secara alami kepada tujuh saudara dalam konteks tanpa harus mengulang kata “saudara.”
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: pernah memperistrinya
  rationale: Idiom ἔχω dengan objek dan γυνή menyatakan bahwa mereka mempunyai perempuan itu sebagai istri. “Pernah memperistrinya” mengungkapkan hubungan perkawinan secara alami, sedangkan unsur lampau “pernah” membantu mencerminkan bentuk aoris dan konteks hubungan yang berturut-turut.
theological_decisions:
- issue: Bahasa kebangkitan dalam perdebatan dengan orang Saduki
  choice: kebangkitan ... ketika mereka bangkit
  alternative: kebangkitan dari antara orang mati ... ketika mereka bangkit kembali
  rationale: Terjemahan mempertahankan anggapan tentang kebangkitan pada masa depan, tetapi tidak memperluas teks dengan “dari antara orang mati” atau “kembali,” yang tidak dinyatakan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pertanyaan dibuat idiomatis, sedangkan pengulangan “kebangkitan ... bangkit” dipertahankan karena mencerminkan pengulangan leksikal dalam teks Yunani.
