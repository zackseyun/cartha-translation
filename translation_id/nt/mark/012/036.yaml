source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ εἶπεν ἐν ⸂τῷ πνεύματι τῷ⸃ ἁγίῳ· ⸀Εἶπεν ⸀κύριος τῷ κυρίῳ μου· ⸀Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/036.yaml
  text: David himself said in the Holy Spirit[a], ‘The Lord said to my Lord[b], “Sit at my right hand until I put your enemies under your feet.”’
translation:
  language: id
  text: Daud sendiri berkata dalam Roh Kudus[a], “Tuhan berkata kepada Tuhanku[b], ‘Duduklah di sebelah kanan-Ku sampai Aku menempatkan musuh-musuhmu di bawah kakimu.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “oleh Roh Kudus.”
    reason: alternative_reading
  - marker: b
    text: Kutipan ini berasal dari Mazmur 110:1. Dalam teks Ibrani, “Tuhan” yang pertama mewakili nama ilahi YHWH (yang secara tradisional diterjemahkan “TUHAN”), sedangkan sebutan yang kedua mengacu kepada tuan Daud.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτὸς
  choice: sendiri
  rationale: Pemakaian intensif αὐτός menegaskan bahwa Daudlah yang mengucapkannya; “sendiri” menyampaikan penekanan itu secara alami dalam bahasa Indonesia.
- source_word: ἐν τῷ πνεύματι τῷ ἁγίῳ
  choice: dalam Roh Kudus
  rationale: Terjemahan ini mempertahankan preposisi ἐν dan tidak mempersempit hubungan Roh Kudus dengan perkataan Daud menjadi satu cara kerja tertentu.
- source_word: κύριος
  choice: Tuhan
  rationale: “Tuhan” adalah padanan baku dan bermartabat bagi κύριος. Pengulangan kata yang sama dipertahankan dalam kutipan ini.
- source_word: τῷ κυρίῳ μου
  choice: kepada Tuhanku
  rationale: Bentuk ini mempertahankan pengulangan κύριος serta hubungan kepunyaan yang dinyatakan oleh μου, tanpa menggantinya dengan “tuanku” atau “majikanku” yang dapat mengurangi daya argumentasi ayat.
- source_word: Κάθου
  choice: Duduklah
  rationale: Imperatif ini diterjemahkan secara langsung dan alami, sesuai dengan konteks penobatan.
- source_word: ἐκ δεξιῶν μου
  choice: di sebelah kanan-Ku
  rationale: Ungkapan Yunani tersebut bersifat idiomatis dan berarti berada di sisi kanan, bukan bergerak keluar dari tangan kanan.
- source_word: ἕως ἂν θῶ
  choice: sampai Aku menempatkan
  rationale: Konstruksi ini menunjuk ke batas waktu mendatang; “sampai” dan “menempatkan” mempertahankan makna serta bentuk aktif teks.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: di bawah kakimu
  rationale: Terjemahan ini mengikuti bentuk Markus secara dekat dan tidak menambahkan gambaran “tumpuan kaki” yang tidak terdapat dalam teks Yunani ayat ini.
theological_decisions:
- issue: Rumusan tentang perkataan Daud dan Roh Kudus
  choice: Daud sendiri berkata dalam Roh Kudus
  alternative: Daud sendiri berkata oleh Roh Kudus
  rationale: “Dalam Roh Kudus” mengikuti susunan Yunani dan menegaskan peranan Roh Kudus tanpa menentukan secara lebih sempit bagaimana ilham itu berlangsung.
- issue: Daya kristologis kutipan Mazmur 110:1
  choice: Tuhan berkata kepada Tuhanku
  alternative: TUHAN berkata kepada Tuhanku
  rationale: Teks Yunani memakai κύριος bagi kedua sebutan, sehingga kata yang sama dipertahankan dalam teks utama. Latar Ibrani yang membedakan nama ilahi YHWH dari sebutan bagi tuan Daud dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya lugas dan bermartabat. Tanda petik bertingkat memperjelas kutipan di dalam ucapan Yesus. Kata ganti yang merujuk kepada Allah dalam kutipan ditulis dengan huruf kapital sesuai kaidah dan kebiasaan penerbitan Alkitab bahasa Indonesia.
