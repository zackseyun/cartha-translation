id: MRK.12.33
reference: Mark 12:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὸ ἀγαπᾶν αὐτὸν ἐξ ὅλης ⸀τῆς καρδίας καὶ ἐξ ὅλης τῆς ⸀συνέσεως καὶ ἐξ ὅλης τῆς ἰσχύος καὶ τὸ ἀγαπᾶν τὸν πλησίον ὡς ἑαυτὸν ⸀περισσότερόν ἐστιν πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/033.yaml
  text: and to love him with all the heart and with all the understanding and with all the strength[a], and to love one’s neighbor as oneself, is more than all burnt offerings and sacrifices.
translation:
  language: id
  text: dan mengasihi Dia dengan segenap hati, dengan segenap pengertian, dan dengan segenap kekuatan, serta mengasihi sesama seperti diri sendiri, lebih utama daripada segala korban bakaran[a] dan korban sembelihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Korban bakaran adalah korban yang seluruhnya dibakar di atas mezbah.
    reason: Menjelaskan kekhususan makna ὁλοκαυτωμάτων, bukan sekadar korban yang sebagian terkena api.
lexical_decisions:
- source_word: ἀγαπᾶν
  choice: mengasihi
  rationale: Bentuk infinitif berartikel diterjemahkan secara idiomatis sebagai verba “mengasihi”; pengulangannya mempertahankan kesejajaran kedua perintah kasih.
- source_word: αὐτόν
  choice: Dia
  rationale: Kata ganti ini merujuk kepada Allah dalam konteks sebelumnya. “Dia” mempertahankan bentuk pronominal teks Yunani tanpa mengganti kata ganti itu dengan antesedennya.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: dengan segenap hati
  rationale: Ungkapan Indonesia yang alami ini menyatakan totalitas pengabdian batin tanpa mengubahnya menjadi sapaan orang kedua.
- source_word: συνέσεως
  choice: pengertian
  rationale: σύνεσις menunjuk pada kemampuan memahami atau mencerap; “pengertian” membedakannya dari istilah Yunani lain yang lebih umum diterjemahkan “pikiran”.
- source_word: ἰσχύος
  choice: kekuatan
  rationale: “Kekuatan” menyampaikan seluruh daya atau kemampuan seseorang secara jelas dan wajar.
- source_word: πλησίον
  choice: sesama
  rationale: Bentuk tunggal dengan artikel dipakai secara umum. “Sesama” merupakan padanan Indonesia yang alami dan mencakup makna etis ‘orang lain yang menjadi dekat’ tanpa membatasi rujukannya.
- source_word: ὡς ἑαυτόν
  choice: seperti diri sendiri
  rationale: Ungkapan ini mempertahankan daya generik kata ganti refleksif dan tidak mengubah laporan tersebut menjadi sapaan langsung “seperti dirimu sendiri”.
- source_word: περισσότερόν ἐστιν
  choice: lebih utama daripada
  rationale: Padanan ini menyatakan keunggulan komparatif secara alami dalam bahasa Indonesia, tanpa menambahkan kesimpulan bahwa korban dengan sendirinya ditiadakan.
- source_word: πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν
  choice: segala korban bakaran dan korban sembelihan
  rationale: “Segala” mewakili πάντων, “korban bakaran” adalah istilah Indonesia yang lazim bagi persembahan yang dibakar seluruhnya, dan “korban sembelihan” membedakan θυσιῶν dari korban bakaran.
theological_decisions:
- issue: Hubungan perintah kasih dengan ibadah korban
  choice: Kasih kepada Allah dengan segenap diri dan kasih kepada sesama dinyatakan lebih utama daripada segala korban bakaran dan korban sembelihan.
  alternative: Menafsirkan ayat ini sebagai penghapusan eksplisit seluruh sistem korban, atau hanya menempatkan kasih sejajar dengan korban tanpa keunggulan yang jelas.
  rationale: περισσότερόν ἐστιν jelas menyatakan keunggulan. Namun, ayat ini sendiri tidak secara eksplisit menghapus sistem korban, sehingga ketegangan antara keutamaan kasih dan keberadaan ibadah korban tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur awal “dan” dipertahankan karena ayat ini melanjutkan perkataan pada ayat sebelumnya. “Segenap” dipakai untuk menjaga pengulangan dan tekanan pada totalitas. Huruf kapital pada “Dia” mengikuti kebiasaan ejaan religius Indonesia karena rujukannya kepada Allah jelas dari konteks.
