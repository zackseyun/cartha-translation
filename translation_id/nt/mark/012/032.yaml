  text: ⸀καὶ εἶπεν αὐτῷ ὁ γραμματεύς· Καλῶς, διδάσκαλε, ἐπ’ ἀληθείας εἶπες ὅτι εἷς ἐστιν καὶ οὐκ ἔστιν ἄλλος πλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/032.yaml
  text: And the scribe said to him[a], “Well said, Teacher. You have spoken truly that he is one, and there is no other besides him.”
translation:
  language: id
  text: Lalu ahli Taurat itu berkata kepada-Nya, “Tepat sekali, Guru. Engkau telah berkata dengan benar bahwa Ia esa[a] dan tidak ada yang lain selain Dia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan menyebutkan rujukannya secara lebih jelas sesuai konteks, “Allah itu esa.” Teks Yunani hanya mengatakan “Ia satu”; siapa yang dimaksud dipahami dari konteks sebelumnya.
    reason: alternative_reading
lexical_decisions:
- source_word: γραμματεύς
  choice: ahli Taurat
  rationale: Dalam konteks Injil, istilah ini menunjuk pada anggota golongan yang terdidik dalam Taurat. “Ahli Taurat” merupakan padanan Indonesia yang lazim, ringkas, dan lebih jelas bagi pembaca modern daripada “juru tulis”.
- source_word: Καλῶς
  choice: Tepat sekali
  rationale: Sebagai ungkapan persetujuan atas jawaban sebelumnya, kata ini menyatakan bahwa perkataan Yesus tepat atau baik. “Tepat sekali” terdengar alami dalam dialog Indonesia dan mempertahankan nada pujian.
- source_word: διδάσκαλε
  choice: Guru
  rationale: “Guru” adalah padanan langsung dan lazim bagi sapaan διδάσκαλε dalam konteks pengajaran.
- source_word: ἐπ’ ἀληθείας
  choice: yang benar
  rationale: Frasa ini berfungsi secara adverbial untuk menegaskan kebenaran perkataan Yesus. Dalam konstruksi “mengatakan yang benar,” maknanya tersampaikan secara alami dalam bahasa Indonesia.
- source_word: εἶπες
  choice: Engkau telah mengatakan
  rationale: Bentuk lampau Yunani merujuk pada ucapan Yesus yang baru saja disampaikan. Bentuk “telah mengatakan” menjaga keterkaitan langsung dengan percakapan yang sedang berlangsung.
- source_word: ὅτι
  choice: bahwa
  rationale: Di sini ὅτι memperkenalkan isi perkataan Yesus, bukan alasan persetujuan ahli Taurat.
- source_word: εἷς ἐστιν
  choice: Dia itu satu
  rationale: Teks Yunani tidak mengulangi kata “Allah”; subjeknya tersirat dari konteks sebelumnya. “Dia itu satu” mempertahankan bentuk eliptis sumber sekaligus dapat dipahami dalam konteks.
- source_word: ἄλλος
  choice: yang lain
  rationale: Dalam οὐκ ἔστιν ἄλλος, padanan alami bahasa Indonesia adalah “tidak ada yang lain.”
- source_word: πλὴν αὐτοῦ
  choice: selain Dia
  rationale: πλήν dengan bentuk genitif menyatakan pengecualian. “Selain Dia” menyampaikan keeksklusifan pernyataan itu secara alami tanpa menambah penafsiran.
theological_decisions:
- issue: Subjek tersirat dalam εἷς ἐστιν
  choice: Mempertahankan bentuk eliptis sebagai “Dia itu satu” dalam teks utama.
  alternative: “Allah itu esa” atau “hanya ada satu Allah.”
  rationale: Konteks sebelumnya dengan jelas merujuk kepada Allah Israel, tetapi ayat ini sendiri tidak mengulangi θεός. Mempertahankan subjek tersirat membuat terjemahan transparan terhadap bentuk sumber dan tidak memperjelas lebih jauh daripada teks Yunani.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan “Engkau” dipakai untuk mempertahankan nuansa dialog yang hormat; huruf kapital pada “Dia” membantu menunjukkan bahwa rujukannya adalah Allah tanpa menambahkan kata “Allah” ke dalam teks utama.
