  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Konjungsi 'tetapi' dipakai untuk mengalirkan rangkaian peristiwa secara alami; tidak dimaksudkan untuk menambah pertentangan teologis.
