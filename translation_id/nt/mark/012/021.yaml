  text: καὶ ὁ δεύτερος ἔλαβεν αὐτήν, καὶ ἀπέθανεν ⸂μὴ καταλιπὼν⸃ σπέρμα, καὶ ὁ τρίτος ὡσαύτως·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/021.yaml
  text: And the second took her[a], and died, leaving no offspring, and the third likewise.
translation:
  language: id
  text: Lalu yang kedua memperistri perempuan itu[a] dan meninggal tanpa meninggalkan keturunan. Demikian juga yang ketiga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengambil perempuan itu”; dalam konteks ini maksudnya mengambilnya sebagai istri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: yang kedua
  rationale: Kata bilangan bertingkat dengan artikel berfungsi sebagai nomina. Konteks menunjukkan saudara kedua, tetapi kata 'saudara' tidak dinyatakan dalam klausa ini, sehingga tidak ditambahkan.
- source_word: ἔλαβεν αὐτήν
  choice: memperistri perempuan itu
  rationale: Secara harfiah berarti 'mengambil dia', tetapi dalam konteks perkawinan levirat ungkapan ini berarti mengambil perempuan itu sebagai istri. 'Memperistri' menyampaikan makna idiomatisnya secara alami dalam bahasa Indonesia.
- source_word: ἀπέθανεν
  choice: meninggal
  rationale: Padanan langsung dan wajar bagi verba yang menyatakan kematian, tanpa eufemisme berlebihan.
- source_word: μὴ καταλιπὼν
  choice: tanpa meninggalkan
  rationale: Partisip aoris dengan μή menyatakan keadaan yang menyertai kematiannya; bentuk ini alami dan mempertahankan hubungan antargagasan.
- source_word: σπέρμα
  choice: keturunan
  rationale: Dalam konteks perkawinan levirat, kata ini menunjuk kepada anak atau garis keturunan, bukan benih secara harfiah. 'Keturunan' tidak mempersempit maknanya menjadi satu anak.
- source_word: ὁ τρίτος ὡσαύτως
  choice: Demikian juga yang ketiga
  rationale: 'Mempertahankan bentuk eliptis Yunani: tindakan dan hasil yang sama dipahami dari klausa sebelumnya.'
