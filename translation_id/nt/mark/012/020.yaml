base_translation:
  language: en
  yaml_path: translation/nt/mark/012/020.yaml
  text: There were seven brothers; and the first took a wife[a], and when he died he left no offspring.
translation:
  language: id
  text: Ada tujuh saudara laki-laki. Yang pertama menikahi seorang perempuan, lalu meninggal tanpa meninggalkan keturunan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benih”; kata Yunani ini dipakai secara kiasan untuk anak atau keturunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ ἀδελφοὶ ἦσαν
  choice: Ada tujuh orang bersaudara
  rationale: Merupakan bentuk eksistensial yang alami dalam bahasa Indonesia dan tetap menunjukkan bahwa mereka saudara laki-laki melalui konteks serta frasa “orang bersaudara”.
- source_word: ὁ πρῶτος
  choice: Yang pertama
  rationale: Menandai urutan di antara ketujuh saudara; “yang tertua” akan menambahkan gagasan usia yang tidak dinyatakan secara eksplisit.
- source_word: ἔλαβεν γυναῖκα
  choice: mengambil seorang istri
  rationale: Mempertahankan idiom sumber mengenai perkawinan dan tetap dapat dipahami dalam bahasa Indonesia yang bermartabat.
- source_word: ἀποθνῄσκων
  choice: lalu meninggal
  rationale: Mengungkapkan hubungan temporal partisipel secara alami dalam bahasa Indonesia tanpa terjemahan harfiah yang kaku.
- source_word: οὐκ ἀφῆκεν σπέρμα
  choice: tanpa meninggalkan keturunan
  rationale: Dalam konteks keluarga dan perkawinan levirat, σπέρμα secara idiomatis berarti anak atau keturunan; frasa ini jelas dan tidak membatasi maknanya pada satu anak.
