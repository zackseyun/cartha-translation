id: MRK.12.11
reference: Mark 12:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/011.yaml
  text: This came from the Lord[b][a], and it is marvelous in our eyes.
translation:
  language: id
  text: Hal itu berasal dari Tuhan[a][b], dan sungguh menakjubkan di mata kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini mengutip Mazmur 118:23.
    reason: cross_reference
  - marker: b
    text: Atau, “dikerjakan oleh Tuhan.” Frasa Yunani dapat menyatakan sumber atau pelaku.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὰ κυρίου
  choice: berasal dari Tuhan
  rationale: παρά dengan genitif menyatakan sumber atau asal. Frasa ini alami dalam bahasa Indonesia dan mempertahankan nuansa bahwa hal tersebut berasal dari Tuhan; kemungkinan nuansa pelaku dicatat dalam catatan kaki.
- source_word: κυρίου
  choice: Tuhan
  rationale: Dalam kutipan Mazmur ini κύριος merujuk kepada Allah. 'Tuhan' mengikuti pemakaian baku Perjanjian Baru tanpa mengganti bentuk Yunani dengan representasi langsung nama ilahi Ibrani.
- source_word: ἐγένετο
  choice: berasal
  rationale: Dalam konstruksi παρὰ κυρίου ἐγένετο, verba ini menunjuk pada sesuatu yang terjadi atau terwujud dengan Tuhan sebagai sumber. 'Berasal' menghasilkan ungkapan Indonesia yang lancar bersama frasa sumber tersebut.
- source_word: αὕτη
  choice: Hal itu
  rationale: Kata tunjuk feminin ini merujuk pada peristiwa yang baru disebutkan, khususnya batu yang ditolak menjadi batu penjuru. 'Hal itu' menjaga rujukannya tetap implisit dan tidak menambahkan kata 'batu' yang tidak terdapat dalam klausa ini.
- source_word: θαυμαστὴ
  choice: sungguh menakjubkan
  rationale: θαυμαστός berarti mengagumkan, luar biasa, atau menimbulkan rasa takjub. 'Sungguh menakjubkan' menyampaikan daya ungkap predikat Yunani secara alami dan bermartabat.
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: di mata kita
  rationale: Terjemahan ini mempertahankan citraan idiom Semitis-Yunani sambil tetap jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan κύριος dalam kutipan Mazmur yang merujuk kepada Allah
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani Perjanjian Baru memakai κυρίου. Karena itu, 'Tuhan' menerjemahkan bentuk yang ada secara langsung, sedangkan latar nama ilahi dalam Mazmur tidak dimasukkan ke teks utama.
- issue: Sumber atau pelaku dalam παρὰ κυρίου
  choice: berasal dari Tuhan
  alternative: dikerjakan oleh Tuhan
  rationale: παρά dengan genitif terutama menandai sumber atau asal, tetapi dalam konteks ini nuansa tindakan ilahi juga mungkin terasa. Teks utama mempertahankan nuansa sumber, sedangkan alternatif yang menonjolkan pelaku dicatat tanpa memutuskan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan 'di mata kita' sengaja mempertahankan citraan Alkitabiah. Penanda catatan kaki ditempatkan sesudah 'Tuhan'; urutannya [a][b] mengikuti urutan penyajian catatan.
