  text: οἱ κατεσθίοντες τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσευχόμενοι· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/040.yaml
  text: who devour widows’ houses and for appearance’s sake pray at length—these will receive greater condemnation[a][b].
translation:
  language: id
  text: yang melahap rumah-rumah para janda dan berdoa panjang-panjang sebagai kedok[a]—mereka ini akan menerima hukuman yang lebih berat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai dalih” atau “untuk pamer.”
    reason: lexical_alternative
  - marker: b
    text: Atau “penghakiman yang lebih besar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίοντες
  choice: melahap
  rationale: Mempertahankan gambaran metaforis yang kuat tentang menghabiskan milik orang lain dengan rakus, tanpa meratakannya menjadi sekadar ‘mengeksploitasi’.
- source_word: οἰκίας
  choice: rumah-rumah
  rationale: Menerjemahkan ungkapan konkret Yunani secara langsung. Dalam konteks, cakupannya dapat meliputi rumah tangga atau harta milik para janda, tetapi terjemahan tidak mempersempit maknanya.
- source_word: χηρῶν
  choice: para janda
  rationale: Genitif jamak ini menyatakan bahwa rumah-rumah tersebut adalah milik para janda, kelompok yang rentan secara sosial.
- source_word: προφάσει
  choice: sebagai kedok
  rationale: Menyampaikan gagasan tindakan lahiriah yang dipakai untuk menutupi maksud sebenarnya. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan tuduhan kemunafikan dalam konteks.
- source_word: μακρὰ
  choice: panjang-panjang
  rationale: Dipakai secara adverbial untuk menunjukkan doa yang panjang atau berlangsung lama; pengulangan kata sifat ini menghasilkan ungkapan Indonesia yang alami.
- source_word: προσευχόμενοι
  choice: berdoa
  rationale: Mempertahankan makna partisipial sebagai tindakan yang menjadi ciri orang-orang yang sedang dikecam.
- source_word: λήμψονται
  choice: akan menerima
  rationale: Mencerminkan bentuk futurum dan nada khidmat dalam konteks pertanggungjawaban ilahi.
- source_word: περισσότερον
  choice: lebih berat
  rationale: Walaupun secara harfiah berarti ‘lebih besar’, kolokasi Indonesia yang alami untuk tingkat hukuman adalah ‘lebih berat’.
- source_word: κρίμα
  choice: hukuman
  rationale: Dalam konteks peringatan ini, kata tersebut menunjuk pada keputusan penghakiman yang bersifat menghukum. ‘Hukuman’ jelas dan alami, sementara kemungkinan yang lebih luas, ‘penghakiman’, dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Daya makna κρίμα dalam peringatan terhadap kemunafikan beragama
  choice: hukuman
  alternative: penghakiman
  rationale: Konteks menunjukkan pertanggungjawaban yang berakibat menghukum, bukan sekadar penilaian netral. Namun, catatan kaki mempertahankan istilah ‘penghakiman’ agar keluasan leksikal kata Yunani tidak hilang.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. ‘Melahap rumah-rumah’ sengaja mempertahankan metafora tajam dari teks Yunani, sedangkan ‘hukuman yang lebih berat’ memakai kolokasi Indonesia yang wajar tanpa mengurangi bobot peringatannya.
