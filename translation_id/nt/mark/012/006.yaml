base_translation:
  language: en
  yaml_path: translation/nt/mark/012/006.yaml
  text: He still had one[a], a beloved son. He sent him last to them, saying[c][b], ‘They will respect my son.’
translation:
  language: id
  text: Ia masih mempunyai seorang lagi, seorang anak yang dikasihinya.[a] Ia mengutusnya kepada mereka sebagai utusan terakhir, dengan berkata, “Mereka akan menghormati[b] anakku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seorang anak yang terkasih.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Yunaninya juga dapat mengandung arti “merasa malu di hadapan” atau “bersikap segan terhadap”; dalam konteks ini artinya “menghormati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι ἕνα εἶχεν
  choice: Ia masih mempunyai seorang lagi
  rationale: Ungkapan ini menyatakan bahwa setelah para hamba sebelumnya diutus, masih ada satu orang yang tersisa. Bentuk ini alami dalam bahasa Indonesia dan tidak menambahkan bahwa ia adalah anak tunggal.
- source_word: υἱὸν ἀγαπητόν
  choice: yaitu anak yang dikasihinya
  rationale: Menerjemahkan ἀγαπητός dengan ungkapan Indonesia yang alami dan tetap mempertahankan bobot kasih khusus terhadap sang anak serta gema kristologisnya dalam Injil Markus.
- source_word: ἀπέστειλεν αὐτὸν
  choice: Ia mengutus anak itu
  rationale: Kata 'mengutus' mempertahankan nuansa penugasan dari ἀποστέλλω, sedangkan 'anak itu' menjernihkan rujukan kata ganti tanpa menambah tafsiran.
- source_word: ἔσχατον πρὸς αὐτούς
  choice: sebagai yang terakhir kepada mereka
  rationale: Menjaga arti klimaks bahwa anak tersebut merupakan utusan terakhir, bukan sekadar bahwa tindakan pengutusan terjadi pada akhirnya.
- source_word: λέγων ὅτι
  choice: dengan berkata
  rationale: Memperkenalkan ucapan langsung secara wajar dalam narasi Indonesia.
- source_word: Ἐντραπήσονται
  choice: Mereka akan menghormati
  rationale: Dalam konteks ini, verba tersebut menunjuk pada sikap segan atau hormat terhadap seseorang. 'Menghormati' jelas dan alami, sementara nuansa malu atau segan dicatat dalam catatan kaki.
- source_word: τὸν υἱόν μου
  choice: anakku
  rationale: Padanan langsung yang mempertahankan ungkapan kepunyaan dan kekuatan kristologis perumpamaan tanpa memperluasnya.
theological_decisions:
- issue: Gema kristologis ungkapan υἱὸν ἀγαπητόν
  choice: anak yang dikasihinya
  alternative: anaknya yang terkasih
  rationale: Terjemahan mempertahankan bahasa kasih yang menggemakan penyebutan Yesus sebagai Anak yang dikasihi dalam Markus, tetapi tidak menjelaskan identitas atau doktrinnya di dalam teks perumpamaan.
- issue: Status anak sebagai utusan terakhir
  choice: sebagai yang terakhir
  alternative: akhirnya
  rationale: Pilihan ini mempertahankan ketegangan naratif bahwa anak merupakan utusan terakhir dan tidak mengurangi ἔσχατον menjadi sekadar penanda urutan waktu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Struktur dipertahankan cukup dekat dengan bahasa Yunani, tetapi hubungan aposisional dijelaskan dengan 'yaitu' agar mudah dipahami pembaca umum.
