  text: ἡ δὲ Ἡρῳδιὰς ἐνεῖχεν αὐτῷ καὶ ἤθελεν αὐτὸν ἀποκτεῖναι, καὶ οὐκ ἠδύνατο·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/019.yaml
  text: But Herodias held a grudge against him and wanted to kill him[a], but she could not.
translation:
  language: id
  text: Namun, Herodias menyimpan dendam terhadap Yohanes dan ingin membunuhnya,[a] tetapi ia tidak dapat melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunaninya juga dapat diterjemahkan “terus memendam kebencian terhadapnya” atau “terus menaruh sakit hati terhadapnya.” Ungkapan itu menunjukkan permusuhan yang berkelanjutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan dengan pernyataan sebelumnya dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: Ἡρῳδιὰς
  choice: Herodias
  rationale: Nama diri ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: ἐνεῖχεν αὐτῷ
  choice: menyimpan dendam terhadap Yohanes
  rationale: Ungkapan ini menyampaikan permusuhan atau sakit hati yang terus berlangsung, sesuai aspek imperfek ἐνεῖχεν. Nama Yohanes dipakai untuk memperjelas rujukan pronomina tanpa mengubah makna.
- source_word: ἤθελεν
  choice: ingin
  rationale: Padanan langsung dan alami untuk kehendak atau niat yang berkelanjutan dalam konteks ini.
- source_word: αὐτὸν ἀποκτεῖναι
  choice: membunuhnya
  rationale: Menyampaikan arti ἀποκτείνω secara langsung tanpa menambahkan penilaian hukum yang tidak dinyatakan oleh verba Yunani.
- source_word: καὶ οὐκ ἠδύνατο
  choice: tetapi ia tidak dapat melakukannya
  rationale: 'Walaupun καί secara formal berarti ''dan'', di sini hubungan maknanya adversatif: Herodias ingin membunuh Yohanes, tetapi tidak mampu melaksanakan keinginannya. ''Melakukannya'' membuat pelengkap verba modal jelas dan alami.'
