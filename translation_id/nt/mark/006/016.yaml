id: MRK.6.16
reference: Mark 6:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ⸀ὁ Ἡρῴδης ⸀ἔλεγεν· Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην, οὗτος ⸀ἠγέρθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/016.yaml
  text: But when Herod heard it[a], he said, “John, whom I beheaded[b], has been raised.”
translation:
  language: id
  text: Namun, ketika Herodes mendengar hal itu, ia berkata[a], “Yohanes yang kupenggal kepalanya itu telah dibangkitkan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia terus berkata”; bentuk kata kerja Yunani dapat menunjukkan tindakan yang berlangsung atau berulang.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dibangkitkan.” Kata kerja Yunani berbentuk pasif; terjemahan lain sering memakai bentuk aktif, “telah bangkit” atau “bangkit.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: ketika ... mendengar
  rationale: Partisip aoris dipahami secara temporal dan diterjemahkan secara wajar dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan nuansa kontras ringan kepada reaksi Herodes.
- source_word: ἔλεγεν
  choice: ia berkata
  rationale: Bentuk imperfek dapat menyiratkan ujaran yang berlangsung atau berulang, tetapi bentuk naratif ini paling alami dalam teks utama; kemungkinan nuansa berulang dicatat dalam catatan kaki.
- source_word: Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην
  choice: Yohanes yang kupenggal kepalanya
  rationale: Susunan Indonesia menempatkan nama lebih dahulu, sementara bentuk ku- mempertahankan penekanan orang pertama ἐγώ dan ‘memenggal kepala’ menyampaikan arti khusus verba Yunani.
- source_word: οὗτος
  choice: itu
  rationale: Kata penunjuk itu mempertahankan daya demonstratif οὗτος secara alami dalam konstruksi ‘Yohanes ... itu’.
- source_word: ἠγέρθη
  choice: telah dibangkitkan
  rationale: Bentuk pasif dipertahankan dan menyatakan bahwa Yohanes telah dibawa kembali dari kematian tanpa menyebut pelakunya.
theological_decisions:
- issue: Bahasa kebangkitan dalam ἠγέρθη
  choice: telah dibangkitkan
  alternative: telah bangkit / bangkit
  rationale: Bahasa Yunani berbentuk pasif. Terjemahan pasif menjaga bentuk dan ketegangan teologis teks tanpa mengubah ucapan Herodes menjadi rumusan aktif atau menyebut pelaku yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Konstruksi ‘Yohanes ... itu’ mempertahankan penegasan demonstratif Yunani tanpa terasa kaku.
