  text: ⸀καὶ ἐξελθοῦσα εἶπεν τῇ μητρὶ αὐτῆς· Τί ⸀αἰτήσωμαι; ἡ δὲ εἶπεν· Τὴν κεφαλὴν Ἰωάννου τοῦ ⸀βαπτίζοντος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/024.yaml
  text: And after going out, she said to her mother, “What should I ask for?” And she said, “The head of John the Baptizer.”
translation:
  language: id
  text: Setelah keluar, ia berkata kepada ibunya, “Apa yang harus kuminta?” Ibunya menjawab, “Kepala Yohanes Pembaptis.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: Setelah keluar
  rationale: Partisip aoristus menunjukkan bahwa tindakan keluar terjadi sebelum ia berbicara. Ungkapan ini mempertahankan urutan waktu secara alami dalam bahasa Indonesia.
- source_word: Τί αἰτήσωμαι
  choice: Apa yang harus kuminta?
  rationale: Subjungtif deliberatif menyatakan pertimbangan mengenai apa yang patut atau perlu diminta. Bentuk “harus kuminta” ringkas dan idiomatis.
- source_word: μητρὶ αὐτῆς
  choice: kepada ibunya
  rationale: Padanan langsung dan alami bagi konstruksi datif dengan kata ganti posesif.
- source_word: κεφαλήν
  choice: Kepala
  rationale: Mempertahankan objek permintaan yang harfiah dan mengerikan tanpa penghalusan.
- source_word: τοῦ βαπτίζοντος
  choice: Pembaptis
  rationale: Partisip substantival ini mengenali Yohanes melalui kegiatan khasnya, yaitu membaptis. “Yohanes Pembaptis” merupakan bentuk Indonesia yang wajar dan tetap menyampaikan makna tersebut.
theological_decisions:
- issue: Sebutan bagi Yohanes dalam βαπτίζων
  choice: Yohanes Pembaptis
  alternative: Yohanes yang membaptis
  rationale: “Pembaptis” menerjemahkan fungsi partisip Yunani secara ringkas dan sudah jelas sebagai sebutan bagi Yohanes dalam bahasa Indonesia. Bentuk alternatif lebih harfiah secara struktur, tetapi kurang alami sebagai sebutan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Subjek tersirat pada verba Yunani dinyatakan dengan “ia”; pada jawaban kedua, “Ibunya” dipakai untuk memperjelas pergantian penutur tanpa menambah informasi baru.
