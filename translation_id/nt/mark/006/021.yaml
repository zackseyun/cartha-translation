  text: Καὶ γενομένης ἡμέρας εὐκαίρου ὅτε Ἡρῴδης τοῖς γενεσίοις αὐτοῦ δεῖπνον ⸀ἐποίησεν τοῖς μεγιστᾶσιν αὐτοῦ καὶ τοῖς χιλιάρχοις καὶ τοῖς πρώτοις τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/021.yaml
  text: And when an opportune day came[a], Herod gave a banquet on his birthday for his nobles and military commanders and the leading men of Galilee[d][c][b],
translation:
  language: id
  text: Lalu tibalah hari yang tepat[a], ketika Herodes mengadakan perjamuan[b] pada hari ulang tahunnya bagi para pembesarnya, para panglima militernya, dan orang-orang terkemuka di Galilea[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hari yang menguntungkan” atau “hari yang memberi kesempatan”. Kata Yunani ini menunjuk pada waktu yang sesuai atau strategis.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “membuat jamuan makan”.
    reason: lexical_alternative
  - marker: c
    text: Atau “para pemuka Galilea”. Ungkapan ini menunjuk kepada orang-orang yang paling menonjol atau berpangkat tinggi di wilayah itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Lalu
  rationale: Berfungsi sebagai penghubung naratif khas Markus; “Lalu” mempertahankan kesinambungan cerita secara alami dalam bahasa Indonesia.
- source_word: γενομένης ἡμέρας εὐκαίρου
  choice: tibalah hari yang tepat
  rationale: Genitivus absolutus ini memperkenalkan keadaan saat kesempatan yang dinantikan akhirnya tersedia. “Hari yang tepat” mempertahankan nuansa kesempatan yang sesuai atau strategis tanpa menjelaskan motif secara berlebihan.
- source_word: ὅτε
  choice: ketika
  rationale: Konjungsi temporal ini memperinci peristiwa yang menjadikan hari tersebut kesempatan yang tepat.
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Bentuk nama yang lazim dan mapan dalam bahasa Indonesia.
- source_word: τοῖς γενεσίοις αὐτοῦ
  choice: pada hari ulang tahunnya
  rationale: γενέσια menunjuk pada perayaan atau peringatan hari kelahiran; ungkapan ini alami dan tepat dalam bahasa Indonesia.
- source_word: δεῖπνον ἐποίησεν
  choice: mengadakan perjamuan
  rationale: Ungkapan Yunani yang secara harfiah berarti “membuat jamuan makan” secara idiomatis berarti menyelenggarakan jamuan resmi.
- source_word: τοῖς μεγιστᾶσιν αὐτοῦ
  choice: bagi para pembesarnya
  rationale: μεγιστᾶνες menunjuk kepada tokoh berpangkat tinggi di lingkungan penguasa. “Para pembesarnya” mempertahankan kaitan mereka dengan Herodes tanpa mempersempitnya hanya menjadi bangsawan turun-temurun.
- source_word: τοῖς χιλιάρχοις
  choice: para panglima militernya
  rationale: Istilah ini menunjuk kepada perwira atau komandan senior. Padanan fungsional ini jelas bagi pembaca modern dan tidak memaksakan gelar teknis Romawi tertentu.
- source_word: τοῖς πρώτοις τῆς Γαλιλαίας
  choice: orang-orang terkemuka di Galilea
  rationale: πρῶτοι berarti orang-orang yang utama atau berpangkat tinggi. Padanan ini menyampaikan kedudukan sosial mereka secara alami tanpa menambahkan jabatan yang tidak dinyatakan.
