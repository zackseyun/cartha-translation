  text: καὶ ἀπῆλθον ⸂ἐν τῷ πλοίῳ εἰς ἔρημον τόπον⸃ κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/032.yaml
  text: And they went away in the boat to a desolate place by themselves[a][b].
translation:
  language: id
  text: Lalu mereka pergi dengan perahu ke tempat yang sunyi[a], hanya mereka sendiri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat yang sepi,” “tempat terpencil,” atau “tempat yang tidak dihuni.”
    reason: lexical_alternative
  - marker: b
    text: Atau “secara tersendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Dalam alur naratif Markus, καί melanjutkan rangkaian peristiwa. “Lalu” terdengar alami dalam bahasa Indonesia modern tanpa menambahkan hubungan sebab-akibat.
- source_word: ἀπῆλθον
  choice: mereka pergi
  rationale: Bentuk aoris ἀπέρχομαι menyatakan pergerakan meninggalkan lokasi sebelumnya. “Pergi” alami dan cukup menyampaikan keberangkatan dalam konteks ini.
- source_word: ἐν τῷ πλοίῳ
  choice: dengan perahu
  rationale: Walaupun secara bentuk berarti “di dalam perahu,” ungkapan instrumental “dengan perahu” paling alami dalam bahasa Indonesia untuk menyatakan sarana perjalanan dan tetap sesuai dengan konteks.
- source_word: εἰς ἔρημον τόπον
  choice: ke tempat yang sunyi
  rationale: ἔρημος τόπος menunjuk pada tempat yang sepi, terpencil, atau tidak dihuni. “Tempat yang sunyi” mempertahankan gagasan keterpisahan tanpa harus menyiratkan gurun secara geografis.
- source_word: κατ’ ἰδίαν
  choice: hanya mereka sendiri
  rationale: Idiom ini berarti secara tersendiri atau terpisah dari orang lain. “Hanya mereka sendiri” menyatakan subjek jamak dan maksud untuk berada tanpa orang banyak.
