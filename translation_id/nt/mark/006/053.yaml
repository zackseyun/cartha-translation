  text: Καὶ διαπεράσαντες ⸂ἐπὶ τὴν γῆν ἦλθον εἰς⸃ Γεννησαρὲτ καὶ προσωρμίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/053.yaml
  text: And after crossing over to the land[b][a], they came to Gennesaret and moored there.
translation:
  language: id
  text: Setelah menyeberang, mereka tiba di daratan[a] Genesaret dan menambatkan perahu di sana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "di pantai"; secara harfiah, bahasa Yunani mengatakan "di daratan", yakni mencapai darat dari perahu.
    reason: lexical_alternative
  - marker: b
    text: Atau "berlabuh di sana" atau "mendarat di sana"; verba Yunani yang dipakai secara khusus berkaitan dengan membawa perahu ke tempat tambat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Setelah
  rationale: Hubungan naratif καί diserap secara wajar ke dalam konstruksi temporal yang dibentuk oleh partisip aoris berikutnya; bahasa Indonesia tidak memerlukan 'Dan' di awal agar alur tetap jelas.
- source_word: διαπεράσαντες
  choice: Setelah menyeberang
  rationale: Partisip aoris menunjukkan tindakan yang mendahului verba utama; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan urutan waktunya.
- source_word: ἐπὶ τὴν γῆν ... ἦλθον εἰς Γεννησαρὲτ
  choice: mereka tiba di daratan Genesaret
  rationale: γῆ secara harfiah berarti daratan/tanah dan dalam konteks pelayaran menunjuk pada sampainya mereka ke darat; susunan ini menyampaikan tujuan Genesaret tanpa membuat kalimat Indonesia terasa kaku.
- source_word: Γεννησαρὲτ
  choice: Genesaret
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: προσωρμίσθησαν
  choice: menambatkan perahu di sana
  rationale: Verba ini memiliki arti khusus dalam pelayaran, yaitu membawa atau mengikat perahu pada tempat tambat. Penyebutan 'perahu' dan 'di sana' tersirat dari konteks dan diperlukan agar bahasa Indonesia jelas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Daratan' mempertahankan gambaran kontras dengan perjalanan di air, sedangkan 'menambatkan perahu' menjaga nuansa nautis verba Yunani.
