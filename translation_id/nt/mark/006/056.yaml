  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/056.yaml
  text: And wherever he entered villages or cities or countryside[a], they were laying the sick in the marketplaces and begged him that they might even touch the fringe of his garment[c][b]; and as many as touched it were being healed.
translation:
  language: id
  text: Ke mana pun Ia masuk—ke desa-desa, kota-kota, atau daerah pedesaan—mereka menempatkan orang-orang sakit di pasar-pasar dan memohon kepada-Nya agar mereka dapat menyentuh walaupun hanya jumbai jubah-Nya.[a] Semua orang yang menyentuhnya menjadi sembuh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “jumbai” juga dapat berarti “tepi” atau “kelim” jubah, dan mungkin merujuk pada jumbai pakaian Yahudi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “diselamatkan.” Dalam konteks ini, kata Yunani tersebut berarti disembuhkan atau dipulihkan dari sakit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἂν εἰσεπορεύετο
  choice: Ke mana pun Ia masuk
  rationale: ὅπου dengan ἄν memberi makna umum dan tidak tentu, sedangkan bentuk imperfek εἰσεπορεύετο merangkum tindakan yang berulang. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan cakupan tersebut.
- source_word: κώμας ἢ εἰς πόλεις ἢ εἰς ἀγρούς
  choice: ke desa-desa, kota-kota, atau daerah pedesaan
  rationale: κώμαι menunjuk desa, πόλεις kota, dan ἀγροί dalam daftar lokasi ini paling mungkin menunjuk kawasan pedesaan, bukan hanya ladang tertentu.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: di tempat-tempat umum
  rationale: ἀγορά dapat berarti pasar atau lapangan umum. Dalam konteks berbagai desa, kota, dan kawasan pedesaan, 'tempat-tempat umum' menyampaikan fungsi ruang publik tanpa membatasi semuanya pada pasar niaga.
- source_word: ἐτίθεσαν τοὺς ἀσθενοῦντας
  choice: orang-orang terus membaringkan mereka yang sakit
  rationale: Bentuk imperfek menunjukkan kebiasaan atau tindakan berulang; 'terus membaringkan' mempertahankan daya iteratif itu. τοὺς ἀσθενοῦντας berarti orang-orang yang sedang sakit atau lemah.
- source_word: παρεκάλουν αὐτόν
  choice: memohon kepada-Nya
  rationale: παρακαλέω di sini menyatakan permohonan yang sungguh-sungguh. 'Memohon' bermartabat dan alami.
- source_word: ἵνα κἂν ... ἅψωνται
  choice: agar mereka diizinkan menyentuh ... saja
  rationale: κἄν menandai permintaan minimal, yaitu bahwa menyentuh bagian tersebut saja sudah cukup. Bentuk pasif idiomatis 'diizinkan' menyatakan isi permohonan tanpa menambahkan bahwa Yesus secara eksplisit menolak atau memberi izin.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: jumbai jubah-Nya
  rationale: κράσπεδον dapat menunjuk tepi, kelim, atau jumbai pakaian dan dalam konteks Yahudi dapat membangkitkan gambaran jumbai pakaian. 'Jumbai jubah' konkret tetapi alternatif leksikal tetap dicatat.
- source_word: ἥψαντο αὐτοῦ
  choice: menyentuhnya
  rationale: Secara gramatikal αὐτοῦ dapat merujuk kepada-Nya, sementara konteks langsung menyoroti jumbai jubah-Nya. Bentuk Indonesia 'menyentuhnya' secara wajar membiarkan rujukan ini tetap terbuka.
- source_word: ἐσῴζοντο
  choice: menjadi sembuh
  rationale: σῴζω memiliki rentang makna menyelamatkan, memulihkan, atau menyembuhkan. Karena subjeknya adalah orang sakit, 'menjadi sembuh' menyatakan makna kontekstual utama; arti harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna ἐσῴζοντο dari σῴζω
  choice: menjadi sembuh
  alternative: diselamatkan / dipulihkan
  rationale: Konteks langsung berbicara tentang orang sakit dan kesembuhan jasmani. Terjemahan utama tidak memaksakan makna keselamatan rohani, tetapi catatan kaki mempertahankan rentang semantis yang dapat menimbulkan gema teologis.
- issue: Objek ἥψαντο αὐτοῦ
  choice: menyentuhnya
  alternative: menyentuh Dia / menyentuh jubah-Nya
  rationale: Genitif αὐτοῦ secara formal menunjuk kepada-Nya, tetapi klausa sebelumnya secara khusus menyebut jumbai jubah-Nya. Kata ganti Indonesia mempertahankan ketegangan referensial ini tanpa menyelesaikannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Tanda pisah memperjelas daftar tujuan setelah klausa pembuka. Pengulangan tindakan dalam bentuk imperfek dipertahankan melalui 'terus membaringkan', sedangkan kalimat akhir dibuat ringkas dan alami.
