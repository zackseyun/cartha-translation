revisions:
- from: Ke mana pun Ia masuk—ke desa-desa, kota-kota, atau daerah pedesaan—orang-orang terus membaringkan mereka yang sakit di tempat-tempat umum dan memohon kepada-Nya agar mereka diizinkan menyentuh jumbai jubah-Nya saja.[a] Semua orang yang menyentuhnya menjadi sembuh.[b]
  to: Ke mana pun Ia masuk—ke desa-desa, kota-kota, atau daerah pedesaan—mereka menempatkan orang-orang sakit di pasar-pasar dan memohon kepada-Nya agar mereka dapat menyentuh walaupun hanya jumbai jubah-Nya.[a] Semua orang yang menyentuhnya menjadi sembuh.[b]
