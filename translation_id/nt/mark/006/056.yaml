review_pass:
  verdict: revise
  source_fidelity: Draf pada umumnya menangkap cakupan umum ὅπου ἄν, daftar lokasi, tindakan berulang dalam ringkasan naratif, permohonan, dan hasil kesembuhan. Namun, “diizinkan” menambahkan unsur izin yang tidak dinyatakan oleh ἵνα κἄν ... ἅψωνται. Selain itu, ἀγοραί lebih tepat diterjemahkan sebagai pasar-pasar atau lapangan pasar daripada istilah terlalu luas “tempat-tempat umum.”
  naturalness: Bahasa draf umumnya baku dan mudah dipahami. Revisi memakai “pasar-pasar” dan “agar mereka dapat menyentuh walaupun hanya jumbai ...” agar lebih idiomatis sekaligus lebih dekat pada teks sumber. Bentuk “mereka menempatkan” dalam kalimat dengan “ke mana pun” secara alami menyatakan tindakan yang lazim/berulang tanpa tambahan “terus” yang dapat terdengar berlebihan.
  terminology: “Jumbai jubah-Nya” merupakan pilihan yang sah untuk κράσπεδον, dengan alternatif tepi/kelim dijaga dalam catatan kaki. “Menjadi sembuh” tepat secara kontekstual untuk ἐσῴζοντο, sementara catatan kaki dengan tepat mencatat arti harfiah dan rentang semantisnya. Kata ganti “menyentuhnya” dipertahankan untuk tidak memaksakan penyelesaian rujukan antara Dia dan jumbai/jubah yang baru disebut.
  issues:
  - severity: medium
    issue: “diizinkan” menambahkan gagasan izin
    rationale: Klausa ἵνα κἄν ... ἅψωνται menyatakan isi permohonan—agar mereka dapat/berhasil menyentuh—bukan permintaan agar Yesus memberikan izin. Terjemahan ini berpotensi menyiratkan tindakan perizinan yang tidak eksplisit dalam sumber.
  - severity: medium
    issue: “tempat-tempat umum” terlalu umum untuk ἀγοραῖς
    rationale: ἀγορά terutama menunjuk pasar atau lapangan pasar/pusat publik. “Tempat-tempat umum” menghapus unsur pasar yang ada dalam kata Yunani.
