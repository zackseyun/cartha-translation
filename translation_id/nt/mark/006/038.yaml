  text: ὁ δὲ λέγει αὐτοῖς· Πόσους ⸂ἔχετε ἄρτους⸃; ⸀ὑπάγετε ἴδετε. καὶ γνόντες λέγουσιν· Πέντε, καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/038.yaml
  text: But he said to them, “How many loaves do you have? Go and see.” And when they found out, they said, “Five, and two fish.”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Berapa roti yang kalian punya? Pergilah dan lihatlah.” Setelah mereka mengetahuinya, mereka berkata, “Lima roti dan dua ikan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρτους
  choice: roti
  rationale: Dalam konteks ini bentuk jamak Yunani merujuk pada roti-roti sebagai benda yang dapat dihitung; bahasa Indonesia secara alami cukup memakai ‘roti’, dengan jumlah diperjelas oleh kata tanya dan jawaban.
- source_word: ὑπάγετε ἴδετε
  choice: Pergilah dan lihatlah
  rationale: Mempertahankan dua bentuk imperatif serta urutan perintah dalam teks sumber dengan ungkapan Indonesia yang alami.
- source_word: γνόντες
  choice: Setelah mengetahuinya
  rationale: 'Partisip aoris menyatakan tindakan yang mendahului jawaban mereka: mereka mencari tahu lalu melaporkan hasilnya.'
- source_word: ἰχθύας
  choice: ikan
  rationale: Padanan umum dan langsung bagi bentuk jamak Yunani; angka ‘dua’ sudah menyatakan kemajemukan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pronomina ‘Ia’ dipakai untuk Yesus sesuai konteks, sedangkan ‘kalian’ menyampaikan orang kedua jamak secara jelas. Bentuk waktu lampau dipilih dalam narasi Indonesia, tanpa meniru kala kini historis Yunani secara kaku.
