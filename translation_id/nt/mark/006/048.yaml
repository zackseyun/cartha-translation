  naturalness: “Ketika Ia melihat mereka bersusah payah mendayung” adalah bahasa Indonesia baku yang jelas dan alami. “Angin sakal” secara idiomatis menyampaikan bahwa angin berlawanan dengan arah perjalanan mereka.
  terminology: “Laut,” “giliran jaga malam,” dan “Ia bermaksud melewati mereka” mempertahankan istilah serta ambiguitas penting dari teks Yunani. Catatan tentang kemungkinan gema Perjanjian Lama dipertahankan sebagai kemungkinan, bukan penafsiran pasti.
