    rationale: Teks Yunani memakai τῆς θαλάσσης, “laut.” Walaupun lokasi itu dikenal sebagai Danau Galilea dalam pemakaian modern, terjemahan optimal-ekuivalen sebaiknya mempertahankan “laut”; penjelasan geografis dapat diberikan dalam catatan kaki.
