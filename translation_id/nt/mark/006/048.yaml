  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀ἰδὼν αὐτοὺς βασανιζομένους ἐν τῷ ἐλαύνειν, ἦν γὰρ ὁ ἄνεμος ἐναντίος ⸀αὐτοῖς, περὶ τετάρτην φυλακὴν τῆς νυκτὸς ἔρχεται πρὸς αὐτοὺς περιπατῶν ἐπὶ τῆς θαλάσσης· καὶ ἤθελεν παρελθεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/048.yaml
  text: And seeing them straining at the oars[a], because the wind was against them, about the fourth watch of the night he comes to them, walking on the sea[d][c][b]; and he intended to pass by them.
translation:
  language: id
  text: Ketika Ia melihat mereka bersusah payah mendayung, karena angin sakal, kira-kira pada giliran jaga malam yang keempat[a], Ia datang kepada mereka dengan berjalan di atas laut[b]. Ia bermaksud melewati mereka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Giliran jaga malam yang keempat adalah bagian akhir malam, kira-kira pukul 03.00–06.00 menurut pembagian waktu Romawi.
    reason: cultural_note
  - marker: b
    text: Atau “berjalan di atas air.” Secara harfiah, bahasa Yunani berbunyi “di atas laut.”
    reason: lexical_alternative
  - marker: c
    text: “Ia bermaksud melewati mereka” dapat berarti bahwa Ia hendak berjalan melampaui mereka. Namun, ungkapan ini juga mungkin menggemakan kisah-kisah Perjanjian Lama ketika Allah “melintas” dalam penyataan diri-Nya (misalnya Kel. 33:19, 22; 34:6; 1 Raj. 19:11).
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: Ketika melihat
  rationale: Partisip aoris ini menyatakan keadaan atau waktu yang terkait dengan tindakan utama tanpa perlu mempertegas urutan lebih daripada teks Yunani.
- source_word: βασανιζομένους ἐν τῷ ἐλαύνειν
  choice: bersusah payah mendayung
  rationale: Ungkapan ini secara harfiah menggambarkan mereka sangat tersiksa atau tertekan dalam kegiatan mendayung. Dalam bahasa Indonesia, 'bersusah payah mendayung' secara alami menyampaikan perjuangan berat mereka dalam konteks angin sakal.
- source_word: ἐναντίος αὐτοῖς
  choice: bertiup melawan mereka
  rationale: Dalam konteks angin, frasa ini secara alami berarti angin berembus dari arah yang berlawanan dan menghambat mereka; kata 'bertiup' ditambahkan secara kontekstual agar kalimat Indonesia jelas.
- source_word: περὶ τετάρτην φυλακὴν τῆς νυκτός
  choice: kira-kira pada giliran jaga malam yang keempat
  rationale: Mempertahankan sistem pembagian waktu kuno dalam teks utama; 'kira-kira' mewakili περὶ.
- source_word: ἔρχεται
  choice: Ia datang
  rationale: Present historis Markus diterjemahkan dengan bentuk Indonesia yang secara morfologis tidak membedakan kala, sehingga kelangsungan narasi tetap terasa alami.
- source_word: περιπατῶν ἐπὶ τῆς θαλάσσης
  choice: dengan berjalan di atas danau
  rationale: θάλασσα dapat menunjuk laut atau danau; dalam konteks Danau Galilea, 'danau' alami dan tepat secara geografis, sementara catatan kaki mempertahankan bentuk harfiah 'laut'.
- source_word: ἤθελεν παρελθεῖν αὐτούς
  choice: Ia bermaksud melewati mereka
  rationale: '''Bermaksud'' menyatakan maksud yang terkandung dalam ἤθελεν, sedangkan ''melewati mereka'' membiarkan terbuka apakah ini sekadar gerakan melintas atau gema penampakan ilahi.'
theological_decisions:
- issue: Makna Ia bermaksud melewati mereka
  choice: Mempertahankan ungkapan langsung 'Ia bermaksud melewati mereka' tanpa penjelasan interpretatif dalam teks utama.
  alternative: Ia hendak menyatakan diri kepada mereka seperti Allah yang 'melintas' dalam kisah-kisah Perjanjian Lama.
  rationale: Bahasa Yunani tidak menjelaskan maksud tindakan itu. Terjemahan mempertahankan ketegangan antara arti gerak biasa dan kemungkinan gema penampakan ilahi; kemungkinan kedua dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Bersusah payah mendayung' dipilih daripada ungkapan harfiah yang kaku seperti 'tersiksa dalam mendayung'. Sapaan bagi Yesus memakai 'Ia' sesuai register Alkitab Indonesia, tanpa menambahkan gelar yang tidak ada dalam ayat.
