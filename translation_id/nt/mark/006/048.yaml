revisions:
- from: Ketika melihat mereka bersusah payah mendayung, sebab angin bertiup melawan mereka, kira-kira pada giliran jaga malam yang keempat[a], Ia datang kepada mereka dengan berjalan di atas danau[b]. Ia bermaksud melewati mereka[c].
  to: Ketika Ia melihat mereka bersusah payah mendayung, karena angin sakal, kira-kira pada giliran jaga malam yang keempat[a], Ia datang kepada mereka dengan berjalan di atas laut[b]. Ia bermaksud melewati mereka[c].
  rationale: Revisi mengganti “danau” dengan “laut” untuk mengikuti θάλασσα dalam teks sumber dan menempatkan alternatif yang lebih umum, “air,” di catatan kaki. Subjek eksplisit “Ia” ditambahkan pada klausa pembuka, dan “karena angin sakal” memperjelas hubungan adversatif ἐναντίος αὐτοῖς secara idiomatis. Ambiguitas ἤθελεν παρελθεῖν αὐτούς tetap dipertahankan.
  reviewer_model: gpt-5.6-terra
