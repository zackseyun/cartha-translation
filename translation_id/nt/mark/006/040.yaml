  text: And they reclined in groups of hundreds and of fifties[a].
translation:
  language: id
  text: Lalu mereka duduk dalam kelompok-kelompok, seratus-seratus dan lima puluh-lima puluh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “petak-petak kebun,” suatu gambaran yang menyiratkan barisan atau bagian yang tersusun teratur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπεσαν
  choice: mengambil tempat
  rationale: Kata kerja ini berarti berbaring atau mengambil tempat untuk makan. Dalam bahasa Indonesia modern, “mengambil tempat” menyampaikan tindakan menempatkan diri untuk perjamuan tanpa menimbulkan kesan bahwa orang banyak benar-benar berbaring.
- source_word: πρασιαὶ πρασιαὶ
  choice: dalam kelompok-kelompok
  rationale: Secara harfiah, bentuk ulang ini berarti “petak-petak kebun”; dalam konteks ini, ungkapan tersebut menggambarkan kelompok-kelompok yang tersusun teratur. Bentuk ulang “kelompok-kelompok” mempertahankan nuansa distributifnya, sedangkan gambaran harfiahnya dijelaskan dalam catatan kaki.
- source_word: κατὰ ἑκατὸν καὶ κατὰ πεντήκοντα
  choice: ada yang seratus orang dan ada yang lima puluh orang
  rationale: κατά dengan angka menyatakan pembagian menurut jumlah. Rumusan ini alami dalam bahasa Indonesia dan mempertahankan dua ukuran kelompok, tanpa menyiratkan bahwa setiap kelompok sekaligus terdiri atas seratus dan lima puluh orang.
