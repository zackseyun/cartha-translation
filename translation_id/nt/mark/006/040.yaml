translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang jelas dan bermartabat. “Mengambil tempat” dipilih alih-alih “duduk” untuk mempertahankan nuansa mengambil posisi bagi perjamuan, namun tetap alami bagi pembaca umum.
