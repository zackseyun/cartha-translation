translation:
  language: id
  text: Sebab mereka tidak mengerti tentang roti-roti itu[a], tetapi hati mereka keras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak menangkap makna roti-roti itu.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “hati mereka tidak peka.” Secara harfiah, kata Yunani dapat menggambarkan sesuatu yang mengeras atau menjadi kapalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆκαν
  choice: memahami
  rationale: Kata συνίημι menyatakan tindakan memahami atau menangkap makna. “Memahami” merupakan padanan Indonesia modern yang jelas dan tetap mencakup kegagalan pemahaman para murid.
- source_word: ἐπὶ τοῖς ἄρτοις
  choice: perihal roti-roti itu
  rationale: Ungkapan dengan ἐπί dan datif menunjuk pada perkara atau makna yang berkaitan dengan mukjizat roti sebelumnya. “Perihal” mempertahankan keluasan hubungan itu tanpa menjelaskan maknanya secara berlebihan.
- source_word: ἄρτοις
  choice: roti-roti
  rationale: Bentuk jamak merujuk pada roti-roti tertentu dalam peristiwa pemberian makan, bukan sekadar roti sebagai bahan makanan secara umum.
- source_word: καρδία
  choice: hati
  rationale: Dalam konteks ini καρδία menunjuk pada batin manusia, termasuk pengertian dan kepekaan rohani. “Hati” adalah padanan Indonesia yang lazim dan cukup luas.
- source_word: πεπωρωμένη
  choice: telah menjadi keras
  rationale: Bentuk ini menggambarkan keadaan hati yang sudah mengeras atau menjadi tidak peka. Ungkapan tersebut mempertahankan metafora dan tidak menentukan siapa atau apa yang menyebabkan keadaan itu.
- source_word: ἀλλ’ ἦν
  choice: tetapi ... telah menjadi
  rationale: “Tetapi” mempertahankan pertentangan dengan klausa sebelumnya, sedangkan frasa verbal menyatakan keadaan yang sedang berlaku sebagai hasil dari proses sebelumnya.
- source_word: αὐτῶν ἡ καρδία
  choice: hati mereka
  rationale: Bahasa Yunani memakai nomina kolektif tunggal. “Hati mereka” alami dalam bahasa Indonesia dan dapat mempertahankan gambaran tentang keadaan batin bersama tanpa harus mengubahnya menjadi bentuk jamak eksplisit.
theological_decisions:
- issue: Sifat pengerasan hati para murid dalam πεπωρωμένη
  choice: hati mereka telah menjadi keras
  alternative: hati mereka telah menjadi kapalan / tidak peka
  rationale: Terjemahan mempertahankan gambaran ketidakpekaan rohani, tetapi tidak menambahkan klaim tentang penyebab atau pelaku pengerasan yang tidak disebutkan dalam ayat ini.
- issue: Hubungan roti-roti dengan kegagalan pemahaman
  choice: tidak memahami perihal roti-roti itu
  alternative: tidak menangkap makna roti-roti itu
  rationale: Pilihan utama menjaga ungkapan Yunani tetap agak terbuka, sementara catatan kaki menjelaskan bahwa konteks memungkinkan pengertian tentang makna penting mukjizat tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Perihal” dipilih untuk menjaga hubungan yang cukup terbuka antara kegagalan memahami dan mukjizat roti, sedangkan “hati mereka” mempertahankan bentuk kolektif sumber secara alami.
