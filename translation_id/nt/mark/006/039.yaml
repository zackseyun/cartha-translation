  - severity: low
    issue: Frasa ‘rumput yang hijau’ agak lebih panjang daripada perlu.
    rationale: ‘Rumput hijau’ mempertahankan χλωρῷ χόρτῳ secara alami dalam bahasa Indonesia modern.
  revised_text: Lalu Ia memerintahkan murid-murid-Nya agar menyuruh semua orang duduk berkelompok-kelompok di atas rumput hijau.[a]
