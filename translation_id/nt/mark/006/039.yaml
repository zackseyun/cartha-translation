  text: And he commanded them all to recline in groups on the green grass[a][b].
translation:
  language: id
  text: Lalu Ia memerintahkan murid-murid-Nya agar menyuruh semua orang duduk berkelompok-kelompok di atas rumput hijau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berbaring untuk makan”; kata Yunani ini dapat menunjuk pada posisi makan dengan berbaring atau bersandar.
    reason: cultural_and_lexical_clarification
lexical_decisions:
- source_word: ἐπέταξεν
  choice: memerintahkan
  rationale: Kata kerja ini menyatakan perintah yang berwibawa; “memerintahkan” mempertahankan kekuatannya secara alami dalam bahasa Indonesia.
- source_word: αὐτοῖς
  choice: murid-murid-Nya
  rationale: Pronomina datif ini merujuk kepada para murid dalam konteks. Penyebutan acuannya diperlukan agar struktur perintah tidak disalahartikan seolah-olah Yesus memerintah orang banyak secara langsung.
- source_word: ἀνακλῖναι
  choice: menyuruh ... duduk
  rationale: Dalam konteks jamuan, verba ini berarti mengambil posisi untuk makan, biasanya berbaring atau bersandar. “Duduk” lebih alami bagi pembaca Indonesia, sedangkan nuansa posisi makan kuno dijelaskan dalam catatan kaki.
- source_word: πάντας
  choice: semua orang
  rationale: Akusatif ini menunjuk kepada seluruh orang banyak yang harus ditempatkan, dan dibedakan dari αὐτοῖς, yaitu pihak yang menerima perintah.
- source_word: συμπόσια συμπόσια
  choice: berkelompok-kelompok
  rationale: Pengulangan ungkapan Yunani bersifat distributif dan menggambarkan kelompok-kelompok makan yang tersusun; bentuk ulang Indonesia menyampaikan nuansa itu dengan wajar.
- source_word: ἐπὶ τῷ χλωρῷ χόρτῳ
  choice: di atas rumput yang hijau
  rationale: Terjemahan langsung dan alami yang mempertahankan keterangan warna atau kesegaran rumput.
