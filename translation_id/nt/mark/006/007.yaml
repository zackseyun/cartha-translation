  text: καὶ προσκαλεῖται τοὺς δώδεκα, καὶ ἤρξατο αὐτοὺς ἀποστέλλειν δύο δύο, καὶ ἐδίδου αὐτοῖς ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/007.yaml
  text: And he called the Twelve and began to send them out two by two[c][b][a], and he was giving them authority over the unclean spirits.
translation:
  language: id
  text: Kemudian Yesus memanggil Kedua Belas itu dan mulai mengutus mereka berdua-dua[a]. Ia memberi mereka kuasa[b] atas roh-roh najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “secara berpasangan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “wewenang”; yaitu otoritas yang diberikan untuk bertindak terhadap roh-roh najis.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεῖται
  choice: memanggil
  rationale: Bentuk kini ini merupakan kala kini historis yang menghidupkan narasi. Karena bahasa Indonesia tidak menandai kala pada verba, “memanggil” tetap alami dan tidak memaksakan pergeseran waktu yang janggal.
- source_word: τοὺς δώδεκα
  choice: kedua belas murid itu
  rationale: Ungkapan ini menunjuk kepada kelompok khusus yang dikenal sebagai Kedua Belas. Penambahan “murid” membuat rujukannya jelas dan alami dalam bahasa Indonesia tanpa memasukkan gelar “rasul” yang tidak terdapat dalam ayat ini.
- source_word: ἤρξατο ... ἀποστέλλειν
  choice: mulai mengutus
  rationale: Mempertahankan konstruksi aspektual “mulai” dan makna pengutusan untuk suatu tugas.
- source_word: δύο δύο
  choice: berdua-dua
  rationale: Mengungkapkan pengulangan distributif Yunani secara ringkas dan berirama; maksudnya mereka diutus dalam kelompok yang masing-masing terdiri atas dua orang.
- source_word: ἐδίδου
  choice: memberi
  rationale: Bentuk imperfek menggambarkan tindakan yang berlangsung bersamaan dengan pengutusan. Dalam bahasa Indonesia, “memberi” secara alami mencakup tindakan itu tanpa tambahan seperti “terus-menerus,” yang dapat melebihkan maknanya.
- source_word: ἐξουσίαν
  choice: kuasa
  rationale: Dalam konteks ini, “kuasa” menyatakan kemampuan sekaligus otoritas yang diberikan Yesus. Alternatif “wewenang” lebih tegas menonjolkan sifat otoritas yang didelegasikan, tetapi terdengar lebih administratif dalam bahasa Indonesia umum.
- source_word: τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: roh-roh najis
  rationale: Terjemahan ini mempertahankan istilah khas Markus dan tidak langsung menggantinya dengan penafsiran yang lebih sempit seperti “roh-roh jahat” atau “setan-setan.”
theological_decisions:
- issue: Makna kuasa yang diberikan Yesus kepada kedua belas murid atas roh-roh najis
  choice: kuasa atas roh-roh najis
  alternative: wewenang atas roh-roh najis
  rationale: “Kuasa” adalah ungkapan Indonesia yang alami dan mencakup otoritas efektif untuk bertindak, sedangkan catatan kaki mempertahankan kemungkinan penekanan pada wewenang yang didelegasikan oleh Yesus.
translation_notes:
  register: Bahasa naratif modern, lugas, dan bermartabat. “Kemudian” menghubungkan tindakan ini dengan konteks sebelumnya. Nama “Yesus” dipakai untuk memperjelas subjek tersirat αὐτός bagi pembaca, sedangkan “kedua belas murid itu” mempertahankan rujukan kepada kelompok khusus tanpa memakai istilah teknis yang terasa kaku.
