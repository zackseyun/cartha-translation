  text: And when they got out of the boat[a], immediately they recognized him.
translation:
  language: id
  text: Ketika mereka keluar dari perahu, orang-orang di situ segera mengenali Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Ketika mereka keluar dari perahu, segera mengenali-Nya.” Bahasa Yunani tidak menyebutkan secara tersurat siapa yang mengenali Yesus; konteks menunjukkan bahwa mereka adalah orang-orang di daerah itu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξελθόντων αὐτῶν
  choice: ketika mereka keluar
  rationale: Konstruksi genitif absolut diterjemahkan sebagai anak kalimat waktu yang alami dalam bahasa Indonesia; kata ganti ini menunjuk kepada Yesus dan para murid yang keluar dari perahu.
- source_word: πλοίου
  choice: perahu
  rationale: Dalam konteks Danau Galilea, πλοῖον mengacu pada perahu, bukan kapal besar.
- source_word: εὐθὺς
  choice: segera
  rationale: Mempertahankan daya adverbia tersebut dan gaya naratif Markus yang bergerak cepat.
- source_word: ἐπιγνόντες
  choice: mengenali
  rationale: Dalam konteks ini, ἐπιγινώσκω menyatakan bahwa orang-orang setempat mengenali Yesus ketika melihat-Nya.
- source_word: αὐτὸν
  choice: Yesus
  rationale: Nama Yesus digunakan untuk menjernihkan rujukan pronomina dalam bahasa Indonesia, sebab klausa ini memiliki dua kelompok yang berbeda.
- source_word: implicit subject of ἐπιγνόντες
  choice: orang-orang di situ
  rationale: Partisipel nominatif jamak tidak merujuk secara gramatikal kepada αὐτῶν dalam genitif absolut. Konteks ayat berikutnya menunjukkan bahwa orang-orang setempatlah yang mengenali Yesus.
theological_decisions:
- issue: Identitas subjek yang mengenali Yesus
  choice: orang-orang di situ mengenali Yesus
  alternative: mereka mengenali-Nya, dengan membiarkan subjek tetap tidak tersurat
  rationale: Ini merupakan keputusan sintaksis dan kontekstual, bukan penetapan doktrinal. Bahasa Yunani tidak menyebut nomina sebagai subjek ἐπιγνόντες, tetapi bentuk nominatif jamak dan kelanjutan narasi menunjuk kepada penduduk setempat, bukan kepada kelompok yang keluar dari perahu.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Orang-orang di situ” menyampaikan rujukan kontekstual tanpa memakai istilah yang terlalu resmi, sedangkan nama “Yesus” mencegah kerancuan antara dua kelompok dalam kalimat.
