  text: καὶ ἀποταξάμενος αὐτοῖς ἀπῆλθεν εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/046.yaml
  text: And after saying goodbye to them[a], he went away to the mountain to pray.
translation:
  language: id
  text: Setelah berpamitan kepada mereka,[a] ia pergi ke gunung untuk berdoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "setelah mengucapkan selamat tinggal kepada mereka."
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποταξάμενος
  choice: setelah berpamitan
  rationale: Bentuk partisipel medium ini lazim berarti berpamitan atau mengucapkan selamat tinggal. "Berpamitan" alami dalam bahasa Indonesia dan sesuai dengan αὐτοῖς.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Pronomina datif jamak ini merujuk kepada orang-orang yang disebut dalam konteks sebelumnya dan secara alami melengkapi kata "berpamitan".
- source_word: ἀπῆλθεν
  choice: ia pergi
  rationale: Kata kerja ini menyatakan keberangkatan dari tempat atau kelompok sebelumnya. "Pergi" jelas dan alami; unsur meninggalkan sudah tersirat oleh konteks setelah berpamitan.
- source_word: εἰς τὸ ὄρος
  choice: ke gunung
  rationale: ὄρος berarti gunung atau kawasan perbukitan. Frasa ini diterjemahkan secara konkret sebagai "ke gunung"; bahasa Indonesia tidak memerlukan kata sandang untuk mencerminkan artikel Yunani.
- source_word: προσεύξασθαι
  choice: untuk berdoa
  rationale: Infinitif ini menyatakan tujuan kepergiannya, sehingga "untuk berdoa" merupakan padanan langsung dan alami.
- source_word: καὶ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Sebagai penghubung naratif, καὶ dapat tersirat secara alami pada awal ayat bahasa Indonesia. Memulai dengan "Setelah" mempertahankan kesinambungan dan hubungan waktunya tanpa ungkapan yang kaku.
theological_decisions:
- issue: Rujukan frasa τὸ ὄρος
  choice: Diterjemahkan sebagai "gunung" tanpa makna simbolis tambahan.
  alternative: '"sebuah gunung" atau menafsirkannya sebagai tempat penyataan khusus'
  rationale: Artikel Yunani menunjuk pada gunung yang tertentu dalam narasi, tetapi bahasa Indonesia lazim tidak menandai ketertentuan dengan kata sandang. Teks sendiri tidak menjelaskan makna teologis atau simbolis apa pun.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. "Berpamitan" dipilih karena ringkas serta mudah dipahami, sedangkan catatan kaki mempertahankan alternatif yang lebih harfiah.
