translation:
  language: id
  text: Yang makan roti itu berjumlah lima ribu laki-laki.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “beberapa buah roti itu.” Kata Yunani yang dipakai dapat berarti roti sebagai makanan atau beberapa buah roti; di sini bentuk jamaknya mengacu pada roti-roti tertentu dalam kisah ini.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “laki-laki” secara khusus menunjuk laki-laki dewasa, bukan istilah umum untuk semua orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν
  choice: Jumlah ... adalah
  rationale: Bentuk imperfek εἰμί di sini berfungsi sebagai kopula yang menyatakan jumlah. Susunan dengan “jumlah ... adalah” terdengar alami dalam bahasa Indonesia tanpa menambahkan gagasan bahwa mereka dihitung secara eksplisit.
- source_word: οἱ φαγόντες
  choice: yang makan
  rationale: Partisipel aoris berartikel menunjuk kepada kelompok yang dikenali melalui tindakan makan yang telah terjadi. “Yang makan” alami dan tidak memaksakan nuansa kala lampau tambahan yang tidak perlu dalam bahasa Indonesia.
- source_word: τοὺς ἄρτους
  choice: roti-roti itu
  rationale: Bentuk jamak ἄρτους mengacu pada roti-roti tertentu dalam kisah pemberian makan ini. Pengulangan “roti-roti” mempertahankan bentuk jamak konkret, sedangkan “itu” menandai bahwa roti tersebut sudah diketahui dari konteks.
- source_word: πεντακισχίλιοι
  choice: lima ribu
  rationale: Padanan langsung bagi bilangan kardinal Yunani tersebut.
- source_word: ἄνδρες
  choice: laki-laki ... orang
  rationale: ἀνήρ secara khusus berarti laki-laki dewasa, bukan manusia secara umum. Frasa Indonesia ini mempertahankan kekhususan gender sekaligus menyatakan jumlah orang secara wajar.
theological_decisions:
- issue: Istilah penghitungan yang khusus gender
  choice: Menerjemahkan ἄνδρες sebagai “laki-laki” dalam teks utama.
  alternative: orang
  rationale: Bahasa Yunani memakai ἀνήρ, istilah yang secara khusus menunjuk laki-laki, bukan istilah umum bagi manusia. Kekhususan itu dipertahankan agar angka lima ribu tidak secara diam-diam diubah menjadi jumlah semua orang yang hadir.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan “Jumlah ... adalah” menghindari bentuk kaku “mereka yang makan ... berjumlah,” sedangkan “roti-roti itu” mempertahankan bentuk jamak konkret dari teks sumber.
