  text: οἱ δὲ ἰδόντες αὐτὸν ⸂ἐπὶ τῆς θαλάσσης περιπατοῦντα⸃ ἔδοξαν ⸂ὅτι φάντασμά ἐστιν⸃ καὶ ἀνέκραξαν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/049.yaml
  text: But when they saw him walking on the sea[a], they thought that it was a ghost, and they cried out,
translation:
  language: id
  text: Namun, ketika mereka melihat Dia berjalan di atas laut, mereka menyangka bahwa Dia adalah hantu[a], lalu mereka berteriak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penampakan” atau “sosok gaib.” Kata Yunani φάντασμα menunjuk pada penampakan atau sosok yang tampak bersifat gaib.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Namun, mereka
  rationale: δέ menandai peralihan narasi dengan nuansa pertentangan ringan; kelompok yang dimaksud ialah para murid yang sudah disebut dalam konteks.
- source_word: ἰδόντες
  choice: ketika mereka melihat
  rationale: Partisip aoris dipahami secara temporal dan diterjemahkan secara alami dalam bahasa Indonesia.
- source_word: αὐτὸν
  choice: Dia
  rationale: Pronomina ini merujuk kepada Yesus; huruf kapital mengikuti kebiasaan umum penerjemahan Alkitab bahasa Indonesia.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: berjalan di atas danau
  rationale: ἐπί dengan genitif dalam konteks ini menunjukkan bahwa Ia berjalan pada permukaan air. θάλασσα menunjuk Danau Galilea, sehingga 'danau' jelas dan alami bagi pembaca Indonesia tanpa mengurangi sifat luar biasa peristiwa itu.
- source_word: ἔδοξαν
  choice: mereka menyangka
  rationale: δοκέω menyatakan anggapan yang ternyata keliru; 'menyangka' tepat dan idiomatis.
- source_word: ὅτι φάντασμά ἐστιν
  choice: bahwa Dia adalah penampakan
  rationale: φάντασμα berarti sosok atau penampakan gaib. 'Penampakan' mempertahankan keluasan makna tanpa memastikan bahwa yang mereka bayangkan adalah arwah orang mati; bentuk kini ἐστιν dipertahankan secara alami sebagai 'adalah' dalam klausa isi bahasa Indonesia.
- source_word: καὶ ἀνέκραξαν
  choice: lalu mereka berteriak
  rationale: ἀνακράζω menunjuk seruan keras; 'berteriak' menyampaikan intensitasnya, sedangkan 'lalu' memperjelas urutan reaksi secara alami.
theological_decisions:
- issue: Sifat tindakan Yesus di air
  choice: berjalan di atas danau
  alternative: berjalan di tepi danau
  rationale: Dalam konteks kisah ini, ἐπὶ τῆς θαλάσσης paling wajar berarti berjalan pada permukaan air, bukan menyusuri tepinya.
- issue: Sifat φάντασμα yang disangka para murid
  choice: penampakan
  alternative: hantu
  rationale: '''Penampakan'' mempertahankan ambiguitas leksikal φάντασμα sebagai sosok gaib atau bayangan yang tampak, tanpa secara khusus menyatakannya sebagai roh orang mati.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan naratif yang alami dan bermartabat. 'Danau' dipilih sesuai rujukan geografis Danau Galilea, sedangkan 'di atas' menjaga makna berjalan pada permukaan air. Penanda catatan kaki [a] ditempatkan langsung setelah istilah yang dijelaskan.
