id: MRK.6.20
reference: Mark 6:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ γὰρ Ἡρῴδης ἐφοβεῖτο τὸν Ἰωάννην, εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον, καὶ συνετήρει αὐτόν, καὶ ἀκούσας αὐτοῦ πολλὰ ⸀ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/020.yaml
  text: For Herod feared John[a], knowing that he was a righteous and holy man, and he kept him safe. And when he heard him, he was greatly perplexed, and yet he listened to him gladly.
translation:
  language: id
  text: Sebab Herodes takut kepada Yohanes karena ia tahu bahwa Yohanes adalah orang yang benar dan suci, dan ia melindunginya. Ketika mendengarkan Yohanes, Herodes sangat bingung[a], tetapi ia senang mendengarkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “ia melakukan banyak hal” alih-alih “ia sangat bingung”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐφοβεῖτο
  choice: takut kepada
  rationale: Bentuk imperfek menunjukkan sikap takut yang berlangsung. Pilihan ini mempertahankan arti langsung φοβέομαι tanpa mempersempitnya menjadi sekadar rasa hormat.
- source_word: εἰδὼς
  choice: karena ia tahu
  rationale: Partisip ini paling wajar dipahami secara kausal dalam konteks, yaitu bahwa Herodes takut kepada Yohanes karena mengetahui wataknya.
- source_word: ἄνδρα δίκαιον καὶ ἅγιον
  choice: orang yang benar dan suci
  rationale: “Benar” menyatakan kelurusan moral δίκαιος, sedangkan “suci” mempertahankan makna ἅγιος. “Orang” alami dalam bahasa Indonesia dan mencakup ἄνδρα dalam konteks ini.
- source_word: συνετήρει αὐτόν
  choice: ia melindunginya
  rationale: Dalam konteks ancaman Herodias terhadap Yohanes, συνετήρει paling mungkin berarti menjaga Yohanes dari bahaya. “Melindunginya” menyampaikan nuansa itu dengan jelas.
- source_word: ἀκούσας αὐτοῦ
  choice: ketika mendengarkan Yohanes
  rationale: Ungkapan ini menyatakan keadaan pada waktu Herodes mendengar Yohanes. Nama “Yohanes” dipakai untuk menghindari rangkaian pronomina yang kabur dalam bahasa Indonesia.
- source_word: πολλὰ ἠπόρει
  choice: sangat bingung
  rationale: ἠπόρει berarti berada dalam kebingungan atau tidak tahu harus berbuat apa, sedangkan πολλὰ berfungsi menguatkan kadar kebingungan tersebut.
- source_word: ἡδέως αὐτοῦ ἤκουεν
  choice: ia senang mendengarkannya
  rationale: ἡδέως menunjukkan bahwa Herodes mendengarkan dengan rasa senang. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan ketegangan dengan kebingungannya.
theological_decisions:
- issue: Varian teks dalam klausa tentang tanggapan Herodes setelah mendengar Yohanes
  choice: 'Mengikuti teks kritis SBLGNT: “sangat bingung” (πολλὰ ἠπόρει).'
  alternative: “melakukan banyak hal” (πολλὰ ἐποίει).
  rationale: Bacaan SBLGNT menggambarkan kebingungan batin Herodes dan mempertahankan ketegangan dengan kenyataan bahwa ia senang mendengarkan Yohanes. Karena bacaan alternatif memiliki arti yang sangat berbeda, bacaan itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Nama tokoh diulang pada klausa kedua untuk memperjelas rujukan, sementara kontras antara kebingungan Herodes dan kesenangannya mendengarkan Yohanes dipertahankan dengan “tetapi”.
