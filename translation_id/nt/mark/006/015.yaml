id: MRK.6.15
reference: Mark 6:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἄλλοι ⸀δὲ ἔλεγον ὅτι Ἠλίας ἐστίν· ἄλλοι δὲ ἔλεγον ὅτι ⸀προφήτης ὡς εἷς τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/015.yaml
  text: But others were saying[a], “He is Elijah,” and others were saying, “He is a prophet, like one of the prophets.”
translation:
  language: id
  text: Namun, yang lain mengatakan, “Dia adalah Elia,” sedangkan yang lain lagi mengatakan, “Dia seorang nabi[a], seperti salah seorang dari para nabi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, meskipun kemungkinannya lebih kecil, “Nabi itu,” jika yang dimaksud adalah tokoh eskatologis tertentu. Namun, bahasa Yunani di sini lebih wajar berarti “seorang nabi” karena dilanjutkan dengan “seperti salah seorang dari para nabi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι δὲ
  choice: Namun, yang lain / sedangkan yang lain lagi
  rationale: ἄλλοι membedakan kelompok-kelompok pendapat, sedangkan δέ menandai peralihan atau kontras ringan. Susunan ini alami dalam bahasa Indonesia dan tetap memperlihatkan pergantian tanggapan.
- source_word: ἔλεγον
  choice: mengatakan
  rationale: Bentuk imperfek menggambarkan perkataan yang sedang beredar atau berulang. Bahasa Indonesia tidak wajib menandai aspek tersebut secara gramatikal; “mengatakan” menyampaikan laporan umum tanpa menambahkan penekanan yang tidak pasti seperti “terus mengatakan”.
- source_word: ὅτι Ἠλίας ἐστίν
  choice: “Dia adalah Elia”
  rationale: Kutipan langsung terdengar alami setelah verba ujaran. Ἠλίας diterjemahkan dengan bentuk nama baku Indonesia, “Elia”.
- source_word: προφήτης
  choice: seorang nabi
  rationale: Nomina predikatif tanpa artikel ini paling wajar dipahami secara tak tentu, khususnya karena langsung diikuti perbandingan “seperti salah seorang dari para nabi.” Kata “seorang” diperlukan agar makna generiknya jelas dan alami.
- source_word: ὡς εἷς τῶν προφητῶν
  choice: seperti salah seorang dari para nabi
  rationale: ὡς menyatakan perbandingan, dan εἷς τῶν προφητῶν menunjuk kepada satu orang di antara kelompok para nabi. Terjemahan ini mempertahankan kedua unsur tersebut.
theological_decisions:
- issue: Apakah προφήτης menunjuk kepada seorang nabi secara umum atau kepada gelar eskatologis “Nabi itu”
  choice: seorang nabi
  alternative: Nabi itu
  rationale: Bahasa Yunani tidak memakai artikel, dan frasa lanjutan ὡς εἷς τῶν προφητῶν (“seperti salah seorang dari para nabi”) lebih mendukung identifikasi umum. Kemungkinan pembacaan sebagai tokoh eskatologis tertentu tetap dicatat dalam catatan kaki, bukan dimasukkan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. “Dia” dipakai dalam kutipan percakapan agar alami, sedangkan “yang lain lagi” memperjelas adanya kelompok pendapat berikutnya tanpa menambah isi.
