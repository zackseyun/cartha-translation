id: MRK.6.1
reference: Mark 6:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ἐκεῖθεν, καὶ ⸀ἔρχεται εἰς τὴν πατρίδα αὐτοῦ, καὶ ἀκολουθοῦσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/001.yaml
  text: And he went out from there and came to his hometown[a], and his disciples followed him.
translation:
  language: id
  text: Kemudian Yesus pergi dari sana dan tiba di kampung halaman-Nya,[a] lalu murid-murid-Nya mengikuti Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “datang ke kampung halaman-Nya, dan murid-murid-Nya mengikuti Dia.” Bahasa Yunani memakai bentuk kini historis untuk menghidupkan narasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: pergi
  rationale: Aoristus ἐξέρχομαι menyatakan keberangkatan dari tempat sebelumnya. Dalam konteks ini, 'pergi dari sana' alami dalam bahasa Indonesia dan menyampaikan gerak meninggalkan tempat itu tanpa kekakuan 'keluar'.
- source_word: ἐκεῖθεν
  choice: dari sana
  rationale: Keterangan tempat ini menunjuk titik keberangkatan; 'dari sana' merupakan padanan yang alami dan tepat.
- source_word: ἔρχεται
  choice: tiba
  rationale: Present historis ἔρχεται dialihkan ke bentuk naratif lampau yang secara alami tersirat dalam bahasa Indonesia. 'Tiba' mengungkapkan gerak menuju serta sampainya Yesus di tempat tujuan dengan lancar.
- source_word: πατρίδα
  choice: kampung halaman
  rationale: Dalam konteks Markus 6, πατρίς menunjuk daerah atau tempat asal Yesus, yakni Nazaret dan sekitarnya, bukan negara dalam arti politis. 'Kampung halaman' alami dan cukup luwes untuk cakupan tersebut.
- source_word: ἀκολουθοῦσιν
  choice: mengikuti
  rationale: Padanan ini mempertahankan makna dasar ἀκολουθέω dan nuansa relasi kemuridan, bukan sekadar menemani.
- source_word: μαθηταὶ
  choice: murid-murid
  rationale: '''Murid-murid'' adalah padanan baku yang mempertahankan dimensi belajar sekaligus relasi mereka dengan Yesus.'
theological_decisions:
- issue: Present historis pada ἔρχεται dan ἀκολουθοῦσιν
  choice: Disajikan dalam alur naratif Indonesia sebagai 'tiba' dan 'mengikuti'.
  alternative: 'Mempertahankan efek present historis secara lebih eksplisit: ''datang ... mengikuti''.'
  rationale: Bahasa Indonesia tidak menandai kala verba seperti bahasa Yunani. Susunan ini terdengar alami dalam narasi sambil mempertahankan urutan tindakan; catatan kaki memberitahukan bentuk present historis dan efek hidupnya tanpa memaksakan kejanggalan pada teks utama.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama 'Yesus' dinyatakan untuk menjernihkan rujukan pronomina Yunani tanpa mengubah makna. 'Kemudian' dan 'lalu' menyalurkan rangkaian καί secara alami; kapitalisasi pronomina ilahi mengikuti kebiasaan luas penerbitan Alkitab Indonesia.
