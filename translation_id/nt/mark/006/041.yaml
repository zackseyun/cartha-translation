  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κατέκλασεν τοὺς ἄρτους καὶ ἐδίδου τοῖς μαθηταῖς ⸀αὐτοῦ ἵνα ⸀παρατιθῶσιν αὐτοῖς, καὶ τοὺς δύο ἰχθύας ἐμέρισεν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/041.yaml
  text: And taking the five loaves and the two fish[a], looking up to heaven, he blessed and broke the loaves, and kept giving them to his disciples to set before them[b], and he divided the two fish among them all.
translation:
  language: id
  text: Lalu Yesus mengambil lima roti dan dua ikan itu. Sambil menengadah ke langit, Ia mengucapkan berkat,[a] lalu memecah-mecahkan roti-roti itu dan terus memberikannya kepada murid-murid-Nya untuk dihidangkan kepada orang banyak. Ia juga membagi-bagikan kedua ikan itu kepada mereka semua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengucap syukur.” Kata Yunani yang dipakai berarti “memberkati” atau “mengucapkan berkat”; dalam konteks makan, maknanya dapat bertumpang tindih dengan mengucap syukur.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: mengambil
  rationale: Partisip aoris ini mengawali rangkaian tindakan. Bentuk verba finit dengan penghubung alami menghasilkan bahasa Indonesia yang lancar tanpa mengubah urutan tindakan.
- source_word: τοὺς πέντε ἄρτους
  choice: lima roti
  rationale: Ἄρτος yang dihitung menunjuk pada roti-roti utuh; dalam bahasa Indonesia, nomina setelah bilangan tidak perlu diulang.
- source_word: τοὺς δύο ἰχθύας
  choice: dua ikan
  rationale: Padanan langsung dan alami untuk objek jamak yang didahului bilangan.
- source_word: ἀναβλέψας εἰς τὸν οὐρανόν
  choice: sambil menengadah ke langit
  rationale: Menengadah menyatakan gerakan memandang ke atas secara ringkas dan idiomatis; 'ke langit' mempertahankan arah εἰς serta resonansi teologis οὐρανός.
- source_word: εὐλόγησεν
  choice: mengucapkan berkat
  rationale: Mempertahankan makna dasar εὐλογέω tanpa menambahkan objek eksplisit yang tidak dinyatakan dalam Yunani. Ungkapan ini alami dalam konteks makan dan tidak menentukan apakah makanan itu sendiri menjadi objek berkat.
- source_word: κατέκλασεν τοὺς ἄρτους
  choice: memecah-mecahkan roti-roti itu
  rationale: Bentuk reduplikasi menyampaikan tindakan pemecahan, sedangkan pengulangan nomina berguna di sini untuk menunjukkan roti-roti yang telah disebut.
- source_word: ἐδίδου
  choice: terus memberikannya
  rationale: Kata 'terus' menyampaikan aspek imperfektif atau tindakan berulang selama pembagian berlangsung. Enklitik '-nya' secara alami merujuk pada roti yang dipecah-pecahkan.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: kepada murid-murid-Nya
  rationale: Mempertahankan bentuk jamak dan posesif αὐτοῦ.
- source_word: ἵνα παρατιθῶσιν αὐτοῖς
  choice: untuk dihidangkan kepada orang banyak
  rationale: Menunjukkan tujuan tindakan dan makna παρατίθημι dalam konteks penyajian makanan. 'Orang banyak' memperjelas referen αὐτοῖς dari konteks tanpa menambah kelompok baru.
- source_word: ἐμέρισεν πᾶσιν
  choice: membagi-bagikan ... kepada mereka semua
  rationale: Reduplikasi menyampaikan pembagian kepada banyak penerima; 'mereka semua' mempertahankan cakupan πᾶσιν.
theological_decisions:
- issue: Makna εὐλόγησεν dalam konteks makan
  choice: mengucapkan berkat
  alternative: mengucap syukur
  rationale: Teks memakai εὐλογέω, bukan εὐχαριστέω. 'Mengucapkan berkat' lebih transparan secara leksikal, sementara kemungkinan nuansa mengucap syukur tetap dicatat tanpa memutuskan ketegangan maknanya.
- issue: Objek berkat yang tidak dinyatakan
  choice: tidak menambahkan objek eksplisit
  alternative: memberkati roti dan ikan itu
  rationale: Bahasa Yunani tidak menyatakan objek langsung. Terjemahan menghindari penetapan bahwa makanan secara langsung menjadi objek berkat.
- issue: Referen αὐτοῖς dalam klausa tujuan
  choice: orang banyak
  alternative: mereka
  rationale: Dalam konteks narasi, murid-murid menyajikan makanan kepada orang banyak. Penyebutan referen mencegah pronomina Indonesia disalahpahami sebagai merujuk kembali kepada para murid.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Nama 'Yesus' dinyatakan untuk menghindari pembukaan dengan pronomina tanpa anteseden dalam kutipan ayat tunggal. Reduplikasi verbal dipakai secara selektif untuk menyampaikan tindakan pembagian yang berulang.
