  text: καὶ ⸂ὃς ἂν τόπος μὴ δέξηται⸃ ὑμᾶς μηδὲ ἀκούσωσιν ὑμῶν, ἐκπορευόμενοι ἐκεῖθεν ἐκτινάξατε τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν εἰς μαρτύριον ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/011.yaml
  text: And whatever place does not receive you or listen to you, as you leave there, shake off the dust that is under your feet as a testimony against them.
translation:
  language: id
  text: Jika suatu tempat tidak menerima kamu dan orang-orang di sana tidak mau mendengarkan kamu, ketika kamu pergi dari sana, kebaskanlah debu yang ada di bawah kakimu sebagai kesaksian bagi mereka.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “sebagai kesaksian terhadap mereka” atau “sebagai kesaksian yang menjadi dakwaan bagi mereka.” Ungkapan Yunani secara harfiah berarti “sebagai kesaksian bagi/kepada mereka”; dalam konteks penolakan, kesaksian itu dapat berfungsi sebagai peringatan atau dakwaan.
    reason: alternative_reading
  - marker: b
    text: Mengebaskan debu dari kaki merupakan tindakan simbolis yang menyatakan pemisahan diri dan peringatan sebagai tanggapan atas penolakan.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν τόπος
  choice: suatu tempat
  rationale: Konstruksi tak tentu ini menunjuk pada tempat mana pun yang mungkin mereka datangi. Dalam kalimat bersyarat bahasa Indonesia, 'jika suatu tempat' alami dan tetap mempertahankan nomina τόπος.
- source_word: μὴ δέξηται ὑμᾶς
  choice: tidak menerima kamu
  rationale: δέχομαι di sini mencakup penerimaan terhadap para utusan, termasuk nuansa keramahtamahan. 'Menerima' mempertahankan keluasan maknanya tanpa mempersempitnya menjadi sekadar menyambut.
- source_word: μηδὲ ἀκούσωσιν ὑμῶν
  choice: orang-orang di sana tidak mau mendengarkan kamu
  rationale: Subjek jamak tersirat di dalam bentuk verba ἀκούσωσιν, sedangkan τόπος berbentuk tunggal. Penyebutan 'orang-orang di sana' membuat pergantian subjek jelas dalam bahasa Indonesia; 'tidak mau mendengarkan' menyampaikan penolakan untuk menyimak, bukan sekadar tidak mendengar bunyi.
- source_word: ἐκπορευόμενοι ἐκεῖθεν
  choice: ketika kamu pergi dari sana
  rationale: Partisipel ini berfungsi temporal dan menyatakan tindakan yang menyertai keberangkatan. Rumusan ini alami dalam bahasa Indonesia modern.
- source_word: ἐκτινάξατε
  choice: kebaskanlah
  rationale: Verba ini berarti mengebaskan atau mengguncangkan sesuatu agar terlepas. 'Kebaskanlah' ringkas dan tepat untuk tindakan melepaskan debu dari kaki.
- source_word: τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν
  choice: debu yang ada di bawah kakimu
  rationale: Terjemahan ini mengikuti struktur Yunani dan mempertahankan penekanan pada debu di bawah kaki mereka.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: sebagai kesaksian terhadap mereka
  rationale: '''Terhadap mereka'' mempertahankan arah relasional αὐτοῖς tanpa menyatakan daya adversatif sekeras ''melawan mereka''; konteks penolakan tetap memungkinkan kesaksian itu berfungsi sebagai peringatan atau dakwaan. Ambiguitasnya dijelaskan dalam catatan.'
theological_decisions:
- issue: Arah dan daya kesaksian dalam εἰς μαρτύριον αὐτοῖς
  choice: sebagai kesaksian terhadap mereka
  alternative: sebagai kesaksian bagi mereka; sebagai kesaksian yang memberatkan mereka
  rationale: Bentuk Yunani secara harfiah memakai datif 'kepada/bagi mereka' dan tidak secara eksplisit memuat kata 'melawan'. Namun, konteks penolakan dan tindakan mengebaskan debu memberi kesaksian itu daya peringatan, bahkan kemungkinan dakwaan. Teks utama memakai rumusan yang tidak menutup salah satu nuansa, sementara catatan mempertahankan alternatifnya.
- issue: Makna tindakan mengebaskan debu
  choice: Tindakan simbolis yang menyatakan pemisahan dan memperingatkan pihak yang menolak
  alternative: Semata-mata pernyataan penghakiman; semata-mata tanda perpisahan netral
  rationale: Konteks mendukung unsur peringatan atau penghakiman, tetapi ayat ini sendiri menyebut tindakan itu sebagai kesaksian. Catatan budaya menjelaskan tindakan tersebut tanpa mengubahnya menjadi rumusan doktrinal yang lebih tegas daripada teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'kamu' mengikuti sapaan jamak kepada para murid; bentuknya tidak menandai jumlah dalam bahasa Indonesia. Pergantian dari subjek tunggal 'tempat' ke verba Yunani jamak diperjelas dengan 'orang-orang di sana' agar kalimat tidak memberi kesan bahwa tempat secara harfiah mendengarkan.
