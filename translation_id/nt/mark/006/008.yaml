  yaml_path: translation/nt/mark/006/008.yaml
  text: And he instructed them to take nothing for the journey except a staff only—no bread[a], no bag[b], no copper in their belt—
translation:
  language: id
  text: Ia berpesan kepada mereka agar tidak membawa apa pun untuk perjalanan itu, kecuali sebatang tongkat saja—jangan membawa roti, jangan membawa tas bekal,[a] dan jangan membawa uang tembaga[b] di ikat pinggang mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kantong perjalanan” untuk membawa perbekalan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “tembaga”, yaitu uang logam tembaga yang dibawa dalam ikat pinggang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλεν
  choice: berpesan
  rationale: Kata kerja ini menyatakan arahan yang berwibawa. 'Berpesan' alami dalam konteks pemberian petunjuk perjalanan, tanpa menghilangkan daya mengikatnya.
- source_word: μηδὲν αἴρωσιν
  choice: tidak membawa apa pun
  rationale: Dalam konteks perlengkapan perjalanan, αἴρω berarti membawa; ungkapan ini wajar dan tepat dalam bahasa Indonesia.
- source_word: εἰς ὁδὸν
  choice: untuk perjalanan itu
  rationale: Frasa ini menunjukkan keperluan perjalanan; bentuk tersebut lebih alami daripada terjemahan harfiah 'untuk jalan'.
- source_word: εἰ μὴ ῥάβδον μόνον
  choice: selain sebatang tongkat saja
  rationale: '''Tongkat'' sesuai untuk tongkat perjalanan, sedangkan ''saja'' mempertahankan penekanan μόνον.'
- source_word: ἄρτον
  choice: roti
  rationale: Terjemahan konkret ini mempertahankan makna ἄρτος dan tidak memperluasnya menjadi makanan secara umum.
- source_word: πήραν
  choice: tas bekal
  rationale: πήρα adalah tas yang digunakan pelancong untuk membawa perbekalan. 'Tas bekal' menyampaikan fungsi itu secara ringkas dan alami.
- source_word: ζώνην
  choice: ikat pinggang
  rationale: Istilah ini menyatakan sabuk atau ikat pinggang tempat uang dapat disimpan.
- source_word: χαλκόν
  choice: uang tembaga
  rationale: χαλκός secara harfiah berarti tembaga dan dalam konteks ini merujuk pada uang logam tembaga; terjemahan ini mempertahankan bahan sekaligus memperjelas acuannya.
