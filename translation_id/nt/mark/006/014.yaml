id: MRK.6.14
reference: Mark 6:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἤκουσεν ὁ βασιλεὺς Ἡρῴδης, φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ, καὶ ⸀ἔλεγον ὅτι Ἰωάννης ὁ βαπτίζων ⸂ἐγήγερται ἐκ νεκρῶν⸃, καὶ διὰ τοῦτο ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/014.yaml
  text: And King Herod heard of it[a], for his name had become well known, and people were saying, “John the Baptizer has been raised from the dead[c][b], and because of this these powers are at work in him.”
translation:
  language: id
  text: Raja Herodes pun mendengar tentang hal itu, sebab nama Yesus telah dikenal luas. Orang-orang berkata, “Yohanes Pembaptis telah dibangkitkan dari antara orang mati[a]. Itulah sebabnya kuasa-kuasa[b] itu bekerja di dalam dirinya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “telah bangkit dari antara orang mati.” Kata kerja Yunani berbentuk pasif: “telah dibangkitkan.”'
    reason: alternative_reading
  - marker: b
    text: Atau, “kuasa-kuasa ajaib” atau “perbuatan-perbuatan ajaib.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: Raja Herodes
  rationale: Susunan ini alami dalam bahasa Indonesia dan menerjemahkan gelar βασιλεύς secara langsung.
- source_word: ἤκουσεν
  choice: mendengar tentang hal itu
  rationale: Objeknya tersirat dari kisah sebelumnya tentang kegiatan dan kemasyhuran Yesus; frasa ini mengungkapkannya secara alami tanpa menambahkan objek baru.
- source_word: φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ
  choice: sebab nama Yesus telah dikenal luas
  rationale: Ungkapan Yunani secara harfiah berbicara tentang nama yang menjadi nyata atau dikenal. Penyebutan 'Yesus' menjernihkan rujukan pronomina yang dapat kabur dalam bahasa Indonesia.
- source_word: ἔλεγον
  choice: Orang-orang berkata
  rationale: Verba jamak tanpa subjek tertentu paling alami disampaikan sebagai subjek tak tentu 'orang-orang'.
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: Yohanes Pembaptis
  rationale: Sebutan baku bahasa Indonesia tetap mempertahankan hubungan dengan tindakan membaptis dan mudah dipahami pembaca umum.
- source_word: ἐγήγερται ἐκ νεκρῶν
  choice: telah dibangkitkan dari antara orang mati
  rationale: Bentuk pasif perfektum dipertahankan melalui 'telah dibangkitkan'; ἐκ νεκρῶν diterjemahkan secara idiomatis sebagai 'dari antara orang mati'.
- source_word: διὰ τοῦτο
  choice: Itulah sebabnya
  rationale: Mengungkapkan hubungan sebab-akibat yang dinyatakan frasa Yunani secara jelas dan alami.
- source_word: ἐνεργοῦσιν
  choice: bekerja
  rationale: Menyampaikan kegiatan yang sedang berlangsung dan cocok dengan subjek 'kuasa-kuasa'.
- source_word: αἱ δυνάμεις
  choice: kuasa-kuasa itu
  rationale: Mempertahankan bentuk jamak dan personifikasi dalam Yunani tanpa menetapkan apakah yang dimaksud adalah daya ajaib atau perbuatan-perbuatan ajaib.
- source_word: ἐν αὐτῷ
  choice: di dalam dirinya
  rationale: Mempertahankan arti paling langsung dari ἐν αὐτῷ dan menghindari pergeseran interpretatif menjadi 'melalui dia'.
theological_decisions:
- issue: Bentuk pasif ἐγήγερται dalam konteks kebangkitan
  choice: telah dibangkitkan dari antara orang mati
  alternative: telah bangkit dari antara orang mati
  rationale: Pilihan utama mempertahankan bentuk pasif Yunani dan tidak mengubahnya menjadi tindakan intransitif yang lebih aktif.
- issue: Makna αἱ δυνάμεις
  choice: kuasa-kuasa itu
  alternative: mukjizat-mukjizat itu / kuasa-kuasa ajaib itu
  rationale: Terjemahan utama menjaga ambiguitas antara kuasa ajaib dan perbuatan ajaib serta mempertahankan kuasa-kuasa sebagai subjek verba.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. 'Pun' menandai kelanjutan cerita; 'Yohanes Pembaptis' dipakai sebagai sebutan Indonesia yang alami. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
