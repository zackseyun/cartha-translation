translation_notes:
  register: Bahasa Indonesia baku-modern dengan sapaan jamak ‘kalian’ untuk membedakan para murid sebagai kelompok. Bentuk ‘Ia’ dan ‘kepada-Nya’ mempertahankan register Alkitab Indonesia yang bermartabat, sedangkan susunan kalimat tetap mudah dipahami pembaca umum.
