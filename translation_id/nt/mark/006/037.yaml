  to: Tetapi Ia menjawab mereka, “Kalian sendiri, berilah mereka makan.” Mereka berkata kepada-Nya, “Haruskah kami pergi membeli roti[a] seharga dua ratus dinar[b], lalu memberi mereka makan?”
