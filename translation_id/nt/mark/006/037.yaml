source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Δότε αὐτοῖς ὑμεῖς φαγεῖν. καὶ λέγουσιν αὐτῷ· Ἀπελθόντες ἀγοράσωμεν δηναρίων διακοσίων ἄρτους καὶ ⸀δώσομεν αὐτοῖς φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/037.yaml
  text: But he answered and said to them[a], “You yourselves give them something to eat.” And they said to him[b], “Should we go and buy bread for two hundred denarii and give it to them to eat?”
translation:
  language: id
  text: Tetapi Ia menjawab mereka, “Kalian sendiri, berilah mereka makan.” Mereka berkata kepada-Nya, “Haruskah kami pergi membeli roti[a] seharga dua ratus dinar[b], lalu memberi mereka makan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roti-roti.” Kata Yunani ἄρτους dapat berarti “roti” atau “roti-roti.”
    reason: lexical_alternative
  - marker: b
    text: Satu dinar adalah upah harian yang lazim bagi seorang pekerja atau prajurit.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: menjawab
  rationale: Gabungan naratif ini secara alami dinyatakan dengan satu verba dalam bahasa Indonesia; ‘menjawab’ mempertahankan fungsi tanggapan tanpa menghasilkan ungkapan kaku ‘menjawab dan berkata’.
- source_word: Δότε
  choice: harus memberi
  rationale: Dalam konteks perintah langsung, konstruksi ini menyampaikan tuntutan verba imperatif δίδωμι secara jelas dan wajar dalam bahasa Indonesia.
- source_word: ὑμεῖς
  choice: kalian sendiri
  rationale: Pronomina eksplisit itu bersifat menegaskan. ‘Kalian sendiri’ mempertahankan tekanan bahwa para muridlah yang harus bertindak.
- source_word: φαγεῖν
  choice: makan / untuk dimakan
  rationale: Infinitif ini menyatakan tujuan atau hasil pemberian. Pada perintah pertama, ‘memberi mereka makan’ merupakan idiom Indonesia yang alami; pada klausa terakhir, ‘memberikannya ... untuk dimakan’ mempertahankan kesejajaran verbal dengan δίδωμι.
- source_word: Ἀπελθόντες ἀγοράσωμεν
  choice: Haruskah kami pergi membeli
  rationale: Partisip Ἀπελθόντες berada di bawah pertanyaan deliberatif dengan ἀγοράσωμεν; terjemahan ini menyampaikan pertimbangan para murid secara alami.
- source_word: δηναρίων διακοσίων
  choice: seharga dua ratus dinar
  rationale: Genitif menyatakan harga. ‘Seharga’ menjelaskan hubungan biaya tanpa mengubah jumlah atau satuan mata uang kuno.
- source_word: ἄρτους
  choice: roti
  rationale: Ἄρτος dapat menunjuk pada roti sebagai makanan atau pada roti-roti/bongkahan roti yang dapat dihitung. ‘Roti’ paling alami dalam konteks pembelian makanan, sedangkan alternatif leksikal dipertahankan dalam catatan kaki.
- source_word: δώσομεν αὐτοῖς φαγεῖν
  choice: lalu memberikannya kepada mereka untuk dimakan
  rationale: Terjemahan ini mempertahankan verba ‘memberi’ dan hubungan tujuan dengan ‘makan’, sekaligus memakai pronomina yang secara alami merujuk kembali pada roti.
