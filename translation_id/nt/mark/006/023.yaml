  text: καὶ ὤμοσεν ⸀αὐτῇ· ⸂Ὅ τι⸃ ἐάν με αἰτήσῃς δώσω σοι ἕως ἡμίσους τῆς βασιλείας μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/023.yaml
  text: And he swore to her[a], “Whatever you ask me, I will give you[b], up to half of my kingdom.”
translation:
  language: id
  text: Lalu ia bersumpah kepadanya, “Apa pun yang kamu minta, akan kuberikan kepadamu, sampai setengah dari kerajaanku.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “sampai setengah dari kerajaanku” adalah tawaran kerajaan yang lazim dan bersifat hiperbolis.
    reason: cultural_note
lexical_decisions:
- source_word: ὤμοσεν
  choice: bersumpah
  rationale: Bentuk aoris dari ὀμνύω menyatakan tindakan mengucapkan sumpah. ‘Bersumpah’ alami dalam bahasa Indonesia dan mempertahankan kekuatan janji yang diteguhkan dengan sumpah.
- source_word: αὐτῇ
  choice: kepadanya
  rationale: Datif feminin tunggal ini merujuk kepada gadis yang sedang diajak bicara; ‘kepadanya’ menyampaikan hubungan tersebut secara langsung.
- source_word: Ὅ τι ἐάν
  choice: Apa pun
  rationale: Ungkapan relatif dengan ἐάν menyatakan cakupan yang tidak ditentukan dan terbuka. ‘Apa pun’ ringkas, alami, dan mempertahankan luasnya tawaran itu.
- source_word: με αἰτήσῃς
  choice: yang kauminta dariku
  rationale: αἰτέω berarti meminta atau memohon. Bentuk ‘kauminta dariku’ alami dalam ujaran langsung dan memperjelas bahwa sesuatu diminta dari sang pembicara.
- source_word: δώσω σοι
  choice: akan kuberikan kepadamu
  rationale: Bentuk futur δίδωμι dengan objek tak langsung σοι menyatakan janji pemberian; terjemahan ini mempertahankan daya janji tersebut.
- source_word: ἕως
  choice: sampai
  rationale: Di sini ἕως menandai batas kadar, bukan waktu. ‘Sampai’ menyampaikan batas kuantitatif tawaran tersebut secara wajar.
- source_word: ἡμίσους
  choice: setengah
  rationale: 'Bentuk genitif sesudah ἕως menyatakan ukuran atau batas: ‘sampai setengah’.'
- source_word: τῆς βασιλείας μου
  choice: dari kerajaanku
  rationale: βασιλεία dapat berarti pemerintahan, kekuasaan sebagai raja, atau kerajaan. Dalam tawaran bergaya kerajaan ini, ‘kerajaanku’ paling alami dan konkret tanpa memberi istilah itu makna teologis teknis.
theological_decisions:
- issue: Makna βασιλεία dalam ucapan Herodes
  choice: kerajaan
  alternative: pemerintahan; kekuasaan kerajaan
  rationale: Istilah ini dapat menunjuk kepada wilayah kerajaan atau pelaksanaan kuasa sebagai raja. Dalam konteks sumpah Herodes yang berlebihan, ‘kerajaan’ paling jelas menyampaikan ungkapan kerajaan yang konvensional tanpa memasukkan pengertian teologis khusus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Bentuk terikat ‘kauminta’ dan ‘kuberikan’ menjaga kelancaran ujaran langsung; ‘kepadanya’ mempertahankan rujukan feminin dari konteks tanpa menambahkan identitas yang tidak disebut dalam ayat ini.
