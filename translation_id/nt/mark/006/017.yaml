  text: Αὐτὸς γὰρ ὁ Ἡρῴδης ἀποστείλας ἐκράτησεν τὸν Ἰωάννην καὶ ἔδησεν αὐτὸν ἐν φυλακῇ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ, ὅτι αὐτὴν ἐγάμησεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/017.yaml
  text: For Herod himself had sent and seized John[a], and bound him in prison because of Herodias, the wife of Philip his brother[b], because he had married her.
translation:
  language: id
  text: Sebab Herodes sendiri telah mengutus orang untuk menangkap Yohanes[a] dan membelenggunya dalam penjara karena Herodias, istri Filipus, saudara Herodes, yang telah dinikahinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “setelah mengutus, ia menangkap Yohanes.” Partisip Yunani “setelah mengutus” menunjukkan bahwa Herodes memprakarsai penangkapan itu dengan mengutus orang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ Ἡρῴδης
  choice: Sebab Herodes sendiri
  rationale: γάρ menjelaskan pernyataan sebelumnya, sedangkan αὐτός memberi penekanan pada tanggung jawab Herodes. Susunan ini wajar dalam bahasa Indonesia dan mempertahankan kedua fungsi tersebut.
- source_word: ἀποστείλας ἐκράτησεν
  choice: telah menyuruh orang menangkap
  rationale: Partisip aoris ἀποστείλας mendahului verba utama dan menunjukkan bahwa Herodes memulai penangkapan dengan mengutus pihak lain. Ungkapan ini menyampaikan perantaraan itu secara alami tanpa memberi kesan bahwa Herodes menangkap Yohanes dengan tangannya sendiri.
- source_word: ἔδησεν αὐτὸν ἐν φυλακῇ
  choice: membelenggunya di penjara
  rationale: δέω berarti mengikat atau membelenggu, dan φυλακή di sini menunjuk pada penjara atau tempat penahanan. Pilihan ini mempertahankan gambaran konkret tanpa secara khusus menambahkan rantai.
- source_word: διὰ Ἡρῳδιάδα
  choice: karena Herodias
  rationale: διά dengan akusatif menyatakan sebab. 'Karena Herodias' merupakan padanan kausal yang jelas dan alami.
- source_word: τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: istri Filipus, saudara Herodes
  rationale: γυνή dalam hubungan ini berarti 'istri'. Nama 'Herodes' diulangi agar rujukan αὐτοῦ tidak kabur dalam bahasa Indonesia.
- source_word: ὅτι αὐτὴν ἐγάμησεν
  choice: sebab Herodes telah menikahinya
  rationale: ὅτι memperkenalkan alasan, dan γαμέω berarti menikahi. Subjek Herodes dinyatakan kembali demi kejelasan, sedangkan bentuk 'telah menikahinya' menunjukkan bahwa pernikahan itu mendahului pemenjaraan Yohanes.
theological_decisions:
- issue: Penilaian moral terhadap perkawinan Herodes dan Herodias
  choice: Ayat diterjemahkan secara deskriptif tanpa menambahkan penilaian bahwa perkawinan itu tidak sah.
  alternative: Menyebut Herodias sebagai istri yang tidak sah atau secara langsung menyatakan pelanggaran Herodes.
  rationale: Kalimat Yunani ini menyatakan rangkaian peristiwa dan penyebab penahanan Yohanes. Penilaian hukum dan moral muncul dalam konteks berikutnya dan tidak perlu dimasukkan ke dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan nama Herodes dipertahankan pada dua tempat untuk mencegah kerancuan pronomina. Bentuk kausal ganda 'karena ... sebab ...' mengikuti hubungan alasan bertingkat dalam teks Yunani.
