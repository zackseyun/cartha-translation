base_translation:
  language: en
  yaml_path: translation/nt/mark/006/047.yaml
  text: And when evening had come[a], the boat was in the middle of the sea, and he was alone on the land.
translation:
  language: id
  text: Ketika hari sudah petang, perahu itu berada di tengah laut, dan Yesus sendirian di darat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di atas daratan”; dapat juga diterjemahkan “di tepi pantai.” Ungkapan Yunaninya mengontraskan tempat Yesus berada dengan posisi perahu di laut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: Ketika hari sudah petang
  rationale: Genitivus absolutus ini menyatakan keadaan waktu. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan peralihan yang telah terjadi menuju waktu petang.
- source_word: τὸ πλοῖον
  choice: perahu itu
  rationale: Dalam konteks Danau Galilea, 'perahu' paling wajar dan tepat; 'kapal' dapat menyiratkan sarana air yang lebih besar.
- source_word: ἐν μέσῳ τῆς θαλάσσης
  choice: di tengah laut
  rationale: Terjemahan ini mempertahankan gambaran lokatif teks Yunani secara jelas dan alami.
- source_word: τῆς θαλάσσης
  choice: laut
  rationale: Walaupun secara geografis yang dimaksud adalah danau, teks Yunani memakai θάλασσα, sehingga 'laut' mempertahankan istilah sumber dan sebutan Injil bagi Laut Galilea.
- source_word: αὐτὸς μόνος
  choice: Yesus sendirian
  rationale: Konteks menunjukkan bahwa αὐτός merujuk kepada Yesus. Penyebutan nama menghindari ambiguitas pronominal yang tidak alami dalam bahasa Indonesia, sedangkan 'sendirian' mempertahankan penekanan μόνος.
- source_word: ἐπὶ τῆς γῆς
  choice: di darat
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kontras langsung antara posisi perahu di laut dan Yesus di darat.
