  text: but wear sandals[a], and do not put on two tunics.
translation:
  language: id
  text: tetapi pakailah sandal, dan jangan mengenakan[a] dua tunik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jangan memakai dua tunik.” Kata kerja Yunani untuk “mengenakan” dapat menunjuk pada tindakan mengenakan ataupun keadaan memakai; teks utama lebih dekat mempertahankan tindakan verbalnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: tetapi
  rationale: Menandai pertentangan dengan petunjuk perjalanan sebelumnya dan merupakan penghubung adversatif yang alami dalam bahasa Indonesia.
- source_word: ὑποδεδεμένους
  choice: pakailah
  rationale: Partisip perfek ini berfungsi sebagai perintah dan menggambarkan keadaan kaki yang telah beralas; bentuk perintah ini menyampaikannya dengan alami bersama objek 'sandal'.
- source_word: σανδάλια
  choice: sandal
  rationale: Padanan langsung dan lazim untuk alas kaki yang dimaksud.
- source_word: μὴ ἐνδύσησθε
  choice: jangan mengenakan
  rationale: Larangan ini secara dekat mempertahankan tindakan mengenakan pakaian, sambil tetap alami dalam bahasa Indonesia; makna keadaan 'memakai' tetap dicatat sebagai alternatif.
- source_word: δύο
  choice: dua
  rationale: Numeralia sederhana dipertahankan secara langsung.
- source_word: χιτῶνας
  choice: tunik
  rationale: χίτων adalah pakaian dasar yang dikenakan pada tubuh; 'tunik' lebih tepat secara historis daripada 'kemeja' dan lebih khusus daripada 'pakaian'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Bentuk perintah 'pakailah' sesuai dengan rangkaian instruksi dalam konteks. Istilah 'tunik' dipertahankan demi ketepatan historis tanpa memasukkan tafsiran denominasi.
