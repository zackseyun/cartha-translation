  yaml_path: translation/nt/mark/006/050.yaml
  text: For they all saw him and were troubled. But he immediately spoke with them and says to them, “Take courage; I am; do not be afraid.”
translation:
  language: id
  text: Sebab mereka semua melihat Dia dan terkejut. Namun, Dia segera berbicara kepada mereka dan berkata, “Tabahkanlah hati kalian! Aku ini.[a] Jangan takut.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ini Aku” atau “Akulah Dia.”'
    reason: Menunjukkan bahwa ἐγώ εἰμι dapat berfungsi sebagai pengenalan diri yang idiomatis, sementara teks utama mempertahankan bentuk eliptis Yunani dan tidak memutuskan bobot teologis ungkapan itu.
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: menjadi sangat terkejut
  rationale: Kata kerja ini menyatakan keguncangan atau ketakutan yang timbul mendadak; pilihan ini alami dalam konteks para murid yang menyangka melihat hantu.
- source_word: Θαρσεῖτε
  choice: Tabahkanlah hati kalian!
  rationale: Bentuk perintah ini mengajak para murid untuk berbesar hati atau berani; ungkapan Indonesia ini mempertahankan dorongan tersebut tanpa terdengar kaku.
- source_word: ἐγώ εἰμι
  choice: Aku ada
  rationale: Terjemahan ini mempertahankan bentuk lugas ungkapan Yunani serta kemungkinan gaung teologisnya, sementara catatan kaki mencatat arti pengenalan diri yang wajar dalam konteks.
- source_word: μὴ φοβεῖσθε
  choice: Jangan takut
  rationale: Padanan langsung dan alami bagi larangan Yunani dalam kala kini.
theological_decisions:
- issue: Ambiguitas ungkapan ἐγώ εἰμι
  choice: Aku ada
  alternative: Ini Aku / Akulah Dia
  rationale: Ungkapan Yunani dapat berfungsi sebagai pengenalan diri biasa, tetapi bentuknya juga dapat membawa gaung teologis. Teks utama mempertahankan bentuk yang lebih terbuka dan catatan kaki menyajikan arti kontekstual tanpa memaksakan salah satu tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti jamak “kalian” memperjelas bahwa Yesus berbicara kepada seluruh kelompok murid; kapitalisasi “Dia” mengikuti kebiasaan hormat dalam teks Alkitab bahasa Indonesia.
