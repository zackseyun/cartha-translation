  text: καὶ ⸀λέγει αὐτοῖς· Δεῦτε ὑμεῖς αὐτοὶ κατ’ ἰδίαν εἰς ἔρημον τόπον καὶ ⸀ἀναπαύσασθε ὀλίγον. ἦσαν γὰρ οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί, καὶ οὐδὲ φαγεῖν εὐκαίρουν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/031.yaml
  text: And he said to them[a], “Come away by yourselves to a desolate place and rest a little.” For many were coming and going[b], and they did not even have an opportunity to eat.
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Marilah kita pergi ke tempat yang sunyi[a], jauh dari orang-orang lain, dan beristirahat sebentar.” Sebab banyak orang datang dan pergi, dan mereka bahkan tidak sempat makan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat yang terpencil” atau “tempat yang tidak berpenghuni.” Kata Yunani ini tidak selalu berarti padang pasir.
    reason: lexical_alternative
  - marker: b
    text: Atau “bahkan tidak mempunyai kesempatan untuk makan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ia berkata
  rationale: Bentuk kini historis Yunani dialihkan ke bentuk naratif Indonesia yang wajar tanpa mengubah fungsi kisahnya.
- source_word: Δεῦτε
  choice: Marilah
  rationale: Bentuk ajakan ini mengundang para murid untuk ikut berpindah dari keramaian.
- source_word: ὑμεῖς αὐτοὶ κατ’ ἰδίαν
  choice: untuk menyendiri
  rationale: Gabungan kata ganti yang menegaskan dan frasa ‘secara tersendiri’ menyatakan bahwa mereka harus berada terpisah dari orang banyak; terjemahan ini menghindari pengulangan yang kaku dalam bahasa Indonesia.
- source_word: ἔρημον τόπον
  choice: tempat yang sunyi
  rationale: ἔρημος menunjuk pada tempat terpencil atau tidak dihuni, bukan selalu padang pasir; ‘tempat yang sunyi’ alami dan tepat dalam konteks ini.
- source_word: ἀναπαύσασθε ὀλίγον
  choice: beristirahatlah sebentar
  rationale: Imperatif tengah menyuruh mereka berhenti bekerja untuk memulihkan tenaga selama waktu yang singkat.
- source_word: οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί
  choice: banyak orang datang dan pergi
  rationale: Ungkapan ini menggambarkan arus orang yang terus berlangsung dalam susunan Indonesia yang alami.
- source_word: οὐδὲ φαγεῖν εὐκαίρουν
  choice: mereka bahkan tidak sempat makan
  rationale: εὐκαιρέω berarti mempunyai waktu luang atau kesempatan; ‘tidak sempat’ menyampaikan makna itu dengan ringkas dan alami, sedangkan ‘bahkan’ mencerminkan οὐδέ.
