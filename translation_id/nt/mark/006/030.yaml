  text: Καὶ συνάγονται οἱ ἀπόστολοι πρὸς τὸν Ἰησοῦν, καὶ ἀπήγγειλαν αὐτῷ ⸀πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/030.yaml
  text: And the apostles gathered to Jesus[a], and they reported to him all that they had done and taught.
translation:
  language: id
  text: Lalu para rasul berkumpul menghadap Yesus dan melaporkan kepada-Nya semua yang telah mereka lakukan dan ajarkan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνάγονται
  choice: berkumpul kembali
  rationale: Bentuk kini berfungsi sebagai present historis dalam narasi. Kata 'kembali' tersirat oleh konteks kepulangan para utusan dan membuat ungkapan Indonesia alami tanpa mengubah arah tindakan.
- source_word: οἱ ἀπόστολοι
  choice: para rasul
  rationale: Dalam konteks Markus, istilah ini menunjuk kepada kelompok yang telah diutus oleh Yesus dalam peran khusus, sehingga istilah baku 'rasul' paling tepat.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: kepada Yesus
  rationale: πρός dengan akusatif menyatakan gerak menuju seseorang; 'kepada Yesus' menyampaikan arah itu secara wajar dalam bahasa Indonesia.
- source_word: ἀπήγγειλαν
  choice: melaporkan
  rationale: Kata kerja ini menyatakan penyampaian laporan kembali setelah menjalankan tugas; 'melaporkan' cocok dengan konteks misi mereka.
- source_word: πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν
  choice: semua yang telah mereka lakukan dan ajarkan
  rationale: Ungkapan ini mempertahankan cakupan menyeluruh πάντα serta dua kegiatan sejajar, yakni melakukan dan mengajar. 'Telah' menandai bahwa kegiatan itu mendahului laporan mereka.
theological_decisions:
- issue: Sebutan ἀπόστολοι bagi murid-murid yang kembali
  choice: para rasul
  alternative: para utusan
  rationale: Istilah 'rasul' mempertahankan sebutan peran yang dikenal dalam narasi dan tidak mereduksinya menjadi utusan umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Susunan kalimat mempertahankan alur naratif serta kesejajaran tindakan tanpa membuatnya kaku.
