  text: καὶ οὐκ ἐδύνατο ἐκεῖ ⸂ποιῆσαι οὐδεμίαν δύναμιν⸃, εἰ μὴ ὀλίγοις ἀρρώστοις ἐπιθεὶς τὰς χεῖρας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/005.yaml
  text: And he was not able to do any mighty work there[a], except that he laid his hands on a few sick people and healed them.
translation:
  language: id
  text: Ia tidak dapat melakukan satu pun perbuatan ajaib di sana[a], kecuali Ia meletakkan tangan-Nya atas beberapa orang sakit lalu menyembuhkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "satu pun mukjizat" atau "satu pun tindakan penuh kuasa"; secara harfiah, bahasa Yunani menyebut "satu pun kuasa", ungkapan khas Markus untuk perbuatan ajaib.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: tidak dapat
  rationale: Menerjemahkan secara langsung bentuk imperfek δύναμαι yang dinegasikan dan mempertahankan pernyataan ketidakmampuan sebagaimana terdapat dalam teks.
- source_word: ποιῆσαι οὐδεμίαν δύναμιν
  choice: melakukan satu pun perbuatan penuh kuasa
  rationale: Ungkapan ini merujuk pada tindakan ajaib. Pilihan ini mempertahankan kaitan leksikal δύναμις dengan kuasa tanpa langsung mempersempitnya menjadi istilah 'mukjizat'.
- source_word: εἰ μὴ
  choice: kecuali
  rationale: Menandai pengecualian terhadap pernyataan negatif sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ὀλίγοις ἀρρώστοις
  choice: beberapa orang sakit
  rationale: Padanan modern dan wajar bagi frasa yang menyatakan sejumlah kecil orang yang sedang sakit.
- source_word: ἐπιθεὶς τὰς χεῖρας
  choice: dengan meletakkan tangan-Nya atas mereka
  rationale: Menyampaikan tindakan fisik partisip aoris secara alami dan memperjelas bahwa tangan yang dimaksud ialah tangan Yesus.
- source_word: ἐθεράπευσεν
  choice: menyembuhkan
  rationale: Padanan paling langsung dan lazim untuk θεραπεύω dalam konteks pemulihan orang sakit.
theological_decisions:
- issue: Apakah οὐκ ἐδύνατο perlu diperhalus agar tidak menyiratkan keterbatasan pada Yesus
  choice: 'Mempertahankan arti lugas: ''Ia tidak dapat melakukan satu pun perbuatan penuh kuasa di sana'''
  alternative: Ia tidak mau melakukan perbuatan penuh kuasa apa pun di sana
  rationale: Teks Yunani secara eksplisit memakai δύναμαι dalam bentuk negatif. Terjemahan mempertahankan ketegangan teologis dalam teks dan tidak mengubah ketidakmampuan menjadi sekadar ketidakmauan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina 'Ia' dan bentuk terikat '-Nya' dipakai untuk Yesus sesuai kebiasaan penerbitan Alkitab Indonesia. Susunan klausa pengecualian dibuat ringkas tanpa menghilangkan hubungan antara peletakan tangan dan penyembuhan.
