  text: καὶ εἶδον αὐτοὺς ὑπάγοντας καὶ ⸀ἐπέγνωσαν πολλοί, καὶ πεζῇ ἀπὸ πασῶν τῶν πόλεων συνέδραμον ἐκεῖ καὶ προῆλθον ⸀αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/033.yaml
  text: And many saw them going and recognized them[b][a], and on foot from all the towns they ran there together and got there ahead of them.
translation:
  language: id
  text: Banyak orang melihat mereka pergi dan mengenali mereka. Dari semua kota[b], mereka berlari beramai-ramai ke sana dengan berjalan kaki[a] dan tiba lebih dahulu daripada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melalui jalan darat”; ungkapan Yunani ini secara khusus menunjuk perjalanan dengan berjalan kaki, berlawanan dengan perjalanan menggunakan perahu.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang digunakan dapat merujuk pada kota besar ataupun kota kecil, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: melihat
  rationale: Padanan langsung yang sesuai dengan urutan narasi dan tidak menambahkan nuansa di luar persepsi visual.
- source_word: ὑπάγοντας
  choice: pergi
  rationale: Partisip ini menggambarkan mereka sedang berangkat; cara perjalanannya sudah diketahui dari konteks sebelumnya sehingga tidak perlu ditambahkan di sini.
- source_word: ἐπέγνωσαν
  choice: mengenali
  rationale: Dalam konteks ini kata tersebut berarti mengetahui identitas orang-orang yang dilihat, bukan memperoleh pengetahuan baru secara umum.
- source_word: πολλοί
  choice: banyak orang
  rationale: Adjektiva ini dipakai secara substantival; bahasa Indonesia alami memerlukan nomina eksplisit 'orang'.
- source_word: πεζῇ
  choice: melalui jalan darat
  rationale: Ungkapan ini mempertahankan kontras dengan perjalanan menggunakan perahu. Alternatif yang lebih harfiah, 'berjalan kaki', dicantumkan dalam catatan kaki.
- source_word: ἀπὸ πασῶν τῶν πόλεων
  choice: dari semua kota
  rationale: πόλις dapat menunjuk kota besar maupun kota kecil; 'kota' merupakan istilah Indonesia yang wajar tanpa menentukan ukurannya secara berlebihan.
- source_word: συνέδραμον
  choice: berlari ke sana
  rationale: Kata majemuk ini menyatakan gerak cepat dan berkumpulnya orang-orang menuju satu tempat; susunan kalimat Indonesia sudah mengungkapkan gerak bersama kelompok itu.
- source_word: ἐκεῖ
  choice: ke sana
  rationale: Padanan deiktis yang ringkas dan alami untuk tujuan gerakan.
- source_word: προῆλθον αὐτούς
  choice: tiba lebih dahulu daripada mereka
  rationale: Dalam konteks perjalanan menuju tempat yang sama, frasa ini menyatakan bahwa orang banyak mendahului mereka dalam hal kedatangan.
