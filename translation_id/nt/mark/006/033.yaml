translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan 'mereka' dipertahankan karena teks Yunani tidak menyebut ulang nama tokoh-tokohnya. Urutan klausa dibuat alami dalam bahasa Indonesia tanpa menghilangkan gerak orang banyak dari berbagai kota menuju satu tempat.
