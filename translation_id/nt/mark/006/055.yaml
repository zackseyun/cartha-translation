  text: ⸂περιέδραμον ὅλην τὴν χώραν ἐκείνην καὶ⸃ ἤρξαντο ἐπὶ τοῖς κραβάττοις τοὺς κακῶς ἔχοντας περιφέρειν ὅπου ἤκουον ⸀ὅτι ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/055.yaml
  text: They ran throughout that whole region and began carrying those who were sick on mats to wherever they heard he was[a].
translation:
  language: id
  text: Mereka berlari ke seluruh daerah itu dan mulai mengusung orang-orang sakit di atas tikar[a] ke setiap tempat yang mereka dengar bahwa Dia berada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kasur tipis” atau “tempat tidur sederhana”; kata Yunaninya menunjuk pada alas tidur sederhana yang mudah dibawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέδραμον
  choice: berlari ke seluruh
  rationale: Bentuk verba ini menyampaikan gerak cepat yang menjangkau berbagai tempat dalam suatu wilayah; ungkapan ini mempertahankan baik kesan mendesak maupun cakupan wilayahnya.
- source_word: ὅλην τὴν χώραν ἐκείνην
  choice: seluruh daerah itu
  rationale: χώρα di sini menunjuk pada kawasan atau wilayah sekitar, bukan negara dalam pengertian modern; bentuk ini juga mempertahankan penekanan demonstratif ἐκείνην.
- source_word: ἤρξαντο ... περιφέρειν
  choice: mulai mengusung
  rationale: ἤρξαντο menandai dimulainya tindakan, sedangkan mengusung menyatakan tindakan membawa orang sakit di atas alas portabel secara alami dalam bahasa Indonesia.
- source_word: ἐπὶ τοῖς κραβάττοις
  choice: di atas tikar
  rationale: κράβαττος menunjuk pada alas tidur sederhana yang dapat dibawa, seperti tikar, tilam, atau usungan; 'tikar' mudah dipahami dan sesuai dengan konteks.
- source_word: τοὺς κακῶς ἔχοντας
  choice: orang-orang sakit
  rationale: Ungkapan Yunani ini secara idiomatis berarti orang yang sedang sakit atau tidak sehat.
- source_word: ὅπου ἤκουον ὅτι ἐστίν
  choice: ke mana pun mereka mendengar bahwa Dia berada
  rationale: ὅπου berfungsi sebagai tujuan dalam konteks ini, sedangkan ὅτι memperkenalkan laporan tidak langsung; terjemahan ini mempertahankan makna bahwa mereka membawa orang sakit ke setiap tempat yang menurut kabar sedang didatangi Yesus.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Kata 'Dia' menggunakan kapital karena rujukannya adalah Yesus, sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia; kapitalisasi ini tidak menambahkan penafsiran pada teks Yunani.
