  text: καὶ ⸀ἐθαύμαζεν διὰ τὴν ἀπιστίαν αὐτῶν. Καὶ περιῆγεν τὰς κώμας κύκλῳ διδάσκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/006.yaml
  text: And he was amazed because of their unbelief[a]. And he went around among the villages[b], teaching.
translation:
  language: id
  text: Ia heran karena ketidakpercayaan mereka.[a] Lalu Ia berkeliling di desa-desa sekitar sambil mengajar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia takjub karena mereka tidak percaya.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Ia pergi berkeliling di antara desa-desa sambil mengajar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζεν
  choice: merasa heran
  rationale: Bentuk imperfek menggambarkan reaksi yang berlangsung dalam narasi. 'Merasa heran' alami dalam bahasa Indonesia modern dan mempertahankan daya θαυμάζω tanpa menjelaskan bagaimana hal itu berkaitan dengan pengetahuan Yesus.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: karena ketidakpercayaan mereka
  rationale: διά dengan akusatif menyatakan sebab. 'Ketidakpercayaan' mempertahankan tekanan pada sikap tidak percaya, bukan sekadar iman yang lemah.
- source_word: περιῆγεν
  choice: berkeliling
  rationale: Imperfek περιάγω menunjukkan kegiatan bergerak dari satu tempat ke tempat lain yang berlanjut.
- source_word: τὰς κώμας
  choice: dari desa ke desa
  rationale: κώμη berarti desa atau permukiman pedesaan. Ungkapan ini secara alami menyampaikan perjalanan melalui sejumlah desa.
- source_word: κύκλῳ
  choice: di daerah itu
  rationale: Adverbia κύκλῳ menunjukkan desa-desa di sekitar atau gerak berkeliling. Karena 'berkeliling dari desa ke desa' sudah menyatakan gerak sirkuit, 'di daerah itu' menyampaikan unsur sekitar tanpa pengulangan yang kaku.
- source_word: διδάσκων
  choice: sambil mengajar
  rationale: Partisipel kini menyatakan tindakan yang berlangsung bersamaan dengan perjalanan; 'sambil mengajar' membuat hubungan itu jelas dan wajar.
theological_decisions:
- issue: Reaksi Yesus terhadap ketidakpercayaan mereka
  choice: Ia merasa heran karena ketidakpercayaan mereka.
  alternative: Ia takjub karena ketidakpercayaan mereka.
  rationale: Terjemahan mempertahankan pernyataan naratif bahwa Yesus merasa heran, tanpa melunakkannya atau menambahkan penjelasan kristologis yang tidak terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'Ia' dipakai untuk Yesus sesuai kebiasaan penerbitan Alkitab Indonesia. Struktur kalimat kedua dibuat idiomatis sambil mempertahankan gerak berkeliling, lokasi desa-desa sekitar, dan kegiatan mengajar yang berlangsung bersamaan.
