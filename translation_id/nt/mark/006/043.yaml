translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Lalu” menjaga alur narasi; “bakul” konkret dan mudah dipahami. Penanda catatan kaki [a] ditempatkan tepat sesudah frasa yang memiliki alternatif susunan.
