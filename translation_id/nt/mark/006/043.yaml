translation:
  language: id
  text: Mereka mengumpulkan dua belas keranjang penuh potongan-potongan[a], dan juga sebagian dari ikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dua belas keranjang yang penuh dengan potongan-potongan.” Ungkapan Yunani secara harfiah memadukan “potongan-potongan,” “dua belas keranjang,” dan “isi/jumlah penuh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: mengumpulkan
  rationale: Dalam konteks sisa makanan sesudah orang banyak makan, verba ini menunjuk pada tindakan memungut dan menghimpunkan sisa; “mengumpulkan” alami dalam bahasa Indonesia.
- source_word: κλάσματα
  choice: potongan-potongan roti
  rationale: Kata ini berarti potongan atau pecahan dari sesuatu yang telah dipecah-pecahkan. “Roti” dibuat eksplisit berdasarkan konteks pemberian makan, sehingga pembaca tidak mengira ikan termasuk dalam κλάσματα; ikan disebut secara terpisah pada akhir ayat.
- source_word: δώδεκα κοφίνων πληρώματα
  choice: sebanyak dua belas bakul penuh
  rationale: Ungkapan ini mempertahankan jumlah dua belas, wadah berupa bakul, dan gagasan bahwa bakul-bakul itu terisi penuh, sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: κόφινος
  choice: bakul
  rationale: “Bakul” adalah istilah Indonesia yang alami bagi keranjang wadah makanan dan tidak menambahkan ukuran yang tidak dinyatakan teks.
- source_word: πληρώματα
  choice: penuh
  rationale: Dalam konstruksi ini bentuk jamak tersebut menyatakan isi atau jumlah yang memenuhi kedua belas bakul; “bakul penuh” menyampaikan hasil konkretnya tanpa ungkapan harfiah yang kaku.
- source_word: ἀπὸ τῶν ἰχθύων
  choice: juga sebagian dari ikan-ikan itu
  rationale: 'ἀπό di sini paling wajar dipahami dengan nuansa sumber/partitif: sisa yang dikumpulkan juga berasal dari ikan. “Sebagian” membuat nuansa partitif itu jelas dalam bahasa Indonesia, sedangkan bentuk jamak ikan dipertahankan.'
