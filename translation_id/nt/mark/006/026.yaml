  text: καὶ περίλυπος γενόμενος ὁ βασιλεὺς διὰ τοὺς ὅρκους καὶ τοὺς ⸀ἀνακειμένους οὐκ ἠθέλησεν ⸂ἀθετῆσαι αὐτήν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/026.yaml
  text: And the king[a], becoming deeply grieved, because of his oaths and those reclining at the table[c][b], did not want to refuse her.
translation:
  language: id
  text: Raja itu menjadi sangat sedih. Karena sumpah-sumpahnya dan para tamu yang makan bersamanya,[a] ia tidak mau menolak permintaan gadis itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “orang-orang yang berbaring pada jamuan.” Pada masa itu, orang biasanya makan dalam jamuan resmi dengan berbaring atau bersandar.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menolak dia” atau “mengingkari janjinya kepadanya.” Maksudnya, raja tidak mau mengesampingkan permintaan yang dibuat berdasarkan sumpahnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περίλυπος
  choice: sangat sedih
  rationale: Menyampaikan kesedihan yang mendalam dengan bahasa Indonesia modern dan wajar.
- source_word: γενόμενος
  choice: menjadi
  rationale: Mempertahankan nuansa perubahan keadaan yang dinyatakan oleh partisipel Yunani.
- source_word: ὁ βασιλεὺς
  choice: Raja itu
  rationale: Padanan langsung yang sesuai dengan cara Markus menyebut Herodes dalam konteks ini.
- source_word: διὰ τοὺς ὅρκους
  choice: karena sumpah-sumpahnya
  rationale: διά dengan akusatif menyatakan alasan; bentuk jamak ὅρκους dipertahankan, sedangkan akhiran posesif diperjelas dari konteks.
- source_word: τοὺς ἀνακειμένους
  choice: para tamu yang duduk makan bersamanya
  rationale: Mengungkapkan orang-orang yang hadir dalam perjamuan secara alami; postur harfiahnya adalah berbaring atau bersandar saat makan.
- source_word: οὐκ ἠθέλησεν
  choice: ia tidak mau
  rationale: Menjaga unsur kehendak, bukan ketidakmampuan.
- source_word: ἀθετῆσαι αὐτήν
  choice: menolak permintaan gadis itu
  rationale: Dalam konteks ini, tindakan terhadap 'dia' berarti menolak atau mengesampingkan permintaannya; objek tersirat dibuat jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan kesedihan raja dengan keputusannya
  choice: Memakai 'tetapi' untuk menyatakan kontras tersirat antara kesedihannya dan keengganannya menolak permintaan itu.
  alternative: 'Mengikuti susunan partisipial secara lebih harfiah tanpa kata penghubung: ''Raja itu menjadi sangat sedih dan, karena ...'''
  rationale: Partisipel γενόμενος dapat dipahami secara temporal atau keadaan, tetapi konteks kuat menyiratkan hubungan konsesif. 'Tetapi' membuat hubungan wacananya alami tanpa mengubah alasan yang dinyatakan oleh διά.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Duduk makan' dipilih dalam teks utama agar alami bagi pembaca masa kini, sedangkan kebiasaan berbaring saat jamuan dijelaskan dalam catatan kaki. 'Gadis itu' menghindari ambiguitas rujukan pronomina feminin.
