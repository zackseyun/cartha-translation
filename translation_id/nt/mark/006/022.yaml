  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἰσελθούσης τῆς θυγατρὸς ⸂αὐτῆς τῆς⸃ Ἡρῳδιάδος καὶ ὀρχησαμένης ⸂καὶ ἀρεσάσης⸃ τῷ Ἡρῴδῃ καὶ τοῖς συνανακειμένοις, ⸂εἶπεν ὁ βασιλεὺς⸃ τῷ κορασίῳ· Αἴτησόν με ὃ ἐὰν θέλῃς, καὶ δώσω σοι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/022.yaml
  text: And when Herodias's daughter came in and danced[a], and pleased Herod and those reclining at the table with him, the king said to the girl, “Ask me for whatever you want[b], and I will give it to you.”
translation:
  language: id
  text: Ketika anak perempuan Herodias[a] masuk dan menari, ia menyenangkan hati Herodes dan para tamu yang makan bersama Herodes[b]. Lalu raja berkata kepada gadis itu, “Mintalah kepadaku apa saja yang kauinginkan, dan aku akan memberikannya kepadamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah atau tradisi dapat dipahami sebagai “putrinya, Herodias”, bukan “anak perempuan Herodias”. Teks Yunani yang diikuti di sini berbunyi “anak perempuan Herodias”.
    reason: textual_variant
  - marker: b
    text: Secara harfiah, “orang-orang yang berbaring semeja dengannya”. Dalam perjamuan pada masa itu, para tamu biasanya makan sambil berbaring bertumpu di dekat meja.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθούσης
  choice: ketika ... masuk
  rationale: Partisip aoris dalam konstruksi genitif absolut menyatakan latar waktu; bentuk ini alami dalam bahasa Indonesia dan mempertahankan gerak masuk ke tempat perjamuan.
- source_word: τῆς θυγατρὸς αὐτῆς τῆς Ἡρῳδιάδος
  choice: anak perempuan Herodias
  rationale: Konstruksi genitif dalam teks yang diikuti paling wajar menunjukkan bahwa gadis itu adalah anak Herodias. Unsur αὐτῆς memberi penegasan, tetapi tidak perlu diterjemahkan secara kaku sebagai “sendiri” dalam teks utama.
- source_word: ὀρχησαμένης
  choice: menari
  rationale: Padanan langsung dan alami untuk tindakan yang dinyatakan partisip aoris ini.
- source_word: ἀρεσάσης
  choice: menyenangkan hati
  rationale: ἀρέσκω berarti membuat seseorang senang atau berkenan. “Menyenangkan hati” terdengar alami dalam konteks ini tanpa memperkuatnya menjadi “memukau” atau “menggairahkan”.
- source_word: τοῖς συνανακειμένοις
  choice: para tamu yang makan bersamanya
  rationale: Istilah ini menunjuk kepada orang-orang yang berbaring semeja dengan Herodes dalam perjamuan. Teks utama memakai ungkapan Indonesia yang alami, sedangkan postur budaya kuno dijelaskan dalam catatan kaki.
- source_word: εἶπεν ὁ βασιλεὺς
  choice: raja berkata
  rationale: Mengikuti sebutan naratif Markus, βασιλεύς, tanpa menggantinya dengan gelar historis teknis “raja wilayah” atau “tetrark”.
- source_word: τῷ κορασίῳ
  choice: kepada gadis itu
  rationale: κοράσιον menunjuk kepada seorang gadis; padanan ini modern, jelas, dan tidak arkais.
- source_word: Αἴτησόν με
  choice: Mintalah kepadaku
  rationale: Menyampaikan imperatif permintaan secara langsung dan wajar dalam bahasa Indonesia.
- source_word: ὃ ἐὰν θέλῃς
  choice: apa saja yang kauinginkan
  rationale: Mempertahankan cakupan pilihan yang terbuka dalam konstruksi relatif tak tentu tersebut. Bentuk “kauinginkan” sesuai untuk ujaran langsung kepada satu orang.
- source_word: δώσω σοι
  choice: aku akan memberikannya kepadamu
  rationale: Pronomina “-nya” merujuk secara alami kepada apa pun yang diminta, sedangkan bentuk mendatang dipertahankan dengan “akan”.
theological_decisions:
- issue: Penyebutan Herodes Antipas sebagai βασιλεύς
  choice: raja
  alternative: raja wilayah; penguasa
  rationale: Terjemahan mempertahankan sebutan yang dipakai Markus dan tidak mengoreksinya berdasarkan gelar historis teknis Herodes Antipas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Para tamu yang makan bersamanya” dipilih agar mudah dipahami, dengan gambaran postur perjamuan kuno dipertahankan melalui catatan kaki. Penanda catatan tekstual ditempatkan sesudah “Herodias”, dan penanda catatan budaya sesudah frasa tentang para tamu.
