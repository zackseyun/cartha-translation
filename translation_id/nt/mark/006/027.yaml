  text: καὶ ⸀εὐθὺς ἀποστείλας ὁ βασιλεὺς σπεκουλάτορα ἐπέταξεν ⸀ἐνέγκαι τὴν κεφαλὴν αὐτοῦ. ⸀καὶ ἀπελθὼν ἀπεκεφάλισεν αὐτὸν ἐν τῇ φυλακῇ
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/027.yaml
  text: And immediately the king sent an executioner and ordered him to bring his head[a]. And he went and beheaded him in the prison.
translation:
  language: id
  text: Segera sesudah itu, raja mengutus seorang algojo[a] dan memerintahkannya untuk membawa kepala Yohanes. Algojo itu pun pergi dan memenggal kepala Yohanes di dalam penjara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang pengawal” atau “seorang pengawal pribadi”; bahasa Yunani memakai kata pinjaman dari bahasa Latin (spekoulatōr) bagi anggota pasukan pengawal penguasa, yang di sini bertindak sebagai algojo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: segera sesudah itu
  rationale: Menyampaikan tindakan yang langsung dilakukan dalam alur cerita dengan bahasa Indonesia yang alami; unsur 'sesudah itu' memperjelas kesinambungan narasi tanpa mengurangi kesegeraan.
- source_word: ὁ βασιλεὺς
  choice: raja
  rationale: Mempertahankan sebutan narator dalam bahasa Yunani, meskipun secara historis Herodes Antipas adalah seorang tetrark, dan tidak menyelaraskannya dengan gelar lain.
- source_word: σπεκουλάτορα
  choice: seorang algojo
  rationale: Kata pinjaman Latin ini menunjuk anggota pasukan pengawal penguasa yang dalam konteks ini menjalankan hukuman mati. 'Algojo' paling jelas menyampaikan fungsinya, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: ἐπέταξεν ἐνέγκαι
  choice: memerintahkannya untuk membawa
  rationale: Mengungkapkan konstruksi perintah dan infinitif secara wajar dalam bahasa Indonesia serta mempertahankan daya perintahnya.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: kepala Yohanes
  rationale: Acuan pronomina Yunani kepada Yohanes dibuat eksplisit agar tidak rancu dalam bahasa Indonesia, tanpa mengubah maksud teks.
- source_word: ἀπεκεφάλισεν
  choice: memenggal kepala
  rationale: Padanan Indonesia yang jelas, lazim, dan sesuai dengan register naratif untuk tindakan memenggal.
- source_word: ἐν τῇ φυλακῇ
  choice: di dalam penjara
  rationale: Mempertahankan tempat konkret yang telah disebut dalam konteks dan mewakili bentuk berartikel dalam bahasa Yunani secara alami.
