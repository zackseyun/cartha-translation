  text: καὶ ἤνεγκεν τὴν κεφαλὴν αὐτοῦ ἐπὶ πίνακι καὶ ἔδωκεν αὐτὴν τῷ κορασίῳ, καὶ τὸ κοράσιον ἔδωκεν αὐτὴν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/028.yaml
  text: And he brought his head on a platter and gave it to the girl[a], and the girl gave it to her mother.
translation:
  language: id
  text: Ia membawa kepala Yohanes di atas sebuah nampan[a] dan memberikannya kepada gadis itu. Lalu gadis itu memberikannya kepada ibunya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “piring saji” atau “talam”. Kata Yunani πίναξ menunjuk pada piring atau wadah lebar yang digunakan untuk menyajikan makanan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκεν
  choice: membawa
  rationale: Bentuk aoristus dari φέρω menyatakan tindakan membawa kepala yang telah dipenggal ke tempat perjamuan. “Membawa” alami dan tidak menambahkan cara tindakan yang tidak disebutkan.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: kepala Yohanes
  rationale: Pronomina αὐτοῦ merujuk kepada Yohanes dalam konteks sebelumnya. Penyebutan nama membuat rujukannya jelas dalam bahasa Indonesia tanpa mengubah makna.
- source_word: ἐπὶ πίνακι
  choice: di atas sebuah nampan
  rationale: πίναξ dapat berarti piring saji, talam, atau nampan. “Nampan” merupakan istilah modern yang wajar untuk wadah saji dalam konteks perjamuan.
- source_word: ἔδωκεν
  choice: memberikannya
  rationale: δίδωμι berarti “memberikan”. Pengulangan “memberikannya” pada kedua klausa mempertahankan rantai penyerahan dan pengulangan naratif teks Yunani.
- source_word: τῷ κορασίῳ / τὸ κοράσιον
  choice: gadis itu
  rationale: κοράσιον menunjuk kepada seorang gadis. “Gadis itu” alami, jelas, dan menghindari istilah yang terasa arkais.
- source_word: τῇ μητρὶ αὐτῆς
  choice: kepada ibunya
  rationale: Ungkapan ini menerjemahkan datif dan pronomina posesif secara idiomatis serta mempertahankan bahwa gadis itu menyerahkan kepala tersebut kepada ibunya sendiri.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur dua tindakan penyerahan dipertahankan, sementara “lalu” dipakai untuk mengalirkan urutan narasi secara alami. Penanda catatan kaki ditempatkan sesudah “nampan”, yaitu kata yang dijelaskan oleh catatan.
