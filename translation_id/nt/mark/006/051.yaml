  text: And he got into the boat with them[a], and the wind stopped. And they were utterly astonished within themselves[b],
translation:
  language: id
  text: Lalu Yesus naik ke perahu tempat mereka berada, dan angin pun reda. Mereka sangat tercengang dalam hati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah, bahasa Yunani menumpuk ungkapan penguat: “sangat, melampaui batas.” Kata yang diterjemahkan “tercengang” juga dapat menggambarkan orang yang seperti kehilangan kendali karena takjub.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη ... εἰς τὸ πλοῖον
  choice: naik ke perahu
  rationale: Dalam konteks ini, ungkapan tersebut berarti masuk atau naik ke perahu. “Naik ke perahu” alami dalam bahasa Indonesia dan tetap mencerminkan verba gerak sumber.
- source_word: πρὸς αὐτούς
  choice: bersama mereka
  rationale: Frasa ini menyatakan bahwa Yesus masuk ke perahu dan berada bersama para murid; “bersama mereka” lebih alami daripada terjemahan harfiah “kepada mereka”.
- source_word: ἐκόπασεν ὁ ἄνεμος
  choice: angin pun reda
  rationale: κοπάζω menyatakan angin yang mereda atau berhenti. “Reda” merupakan ungkapan Indonesia yang wajar untuk angin dan tidak menentukan bahwa angin lenyap secara mutlak.
- source_word: λίαν ἐκ περισσοῦ
  choice: sangat
  rationale: Tumpukan penguat Yunani menandakan tingkat keterkejutan yang luar biasa. “Sangat” menjaga kelancaran teks utama, sedangkan kekuatan ungkapan sumber dijelaskan dalam catatan kaki.
- source_word: ἐν ἑαυτοῖς
  choice: dalam hati mereka
  rationale: Ungkapan ini menunjukkan reaksi batin mereka. “Dalam hati mereka” merupakan padanan Indonesia yang alami tanpa mengubahnya menjadi ucapan lahiriah.
- source_word: ἐξίσταντο
  choice: tercengang
  rationale: Bentuk ini menyatakan ketakjuban atau keterkejutan yang sangat kuat. “Tercengang” jelas dan alami, sementara kemungkinan nuansa seolah-olah kehilangan kendali dijaga dalam catatan kaki.
theological_decisions:
- issue: Kekuatan reaksi para murid terhadap tindakan Yesus
  choice: Mereka sangat tercengang dalam hati mereka
  alternative: Mereka luar biasa takjub; mereka seperti kehilangan kendali karena takjub
  rationale: Terjemahan mempertahankan penekanan narasi pada keterkejutan mendalam para murid tanpa menambahkan penjelasan teologis tentang identitas Yesus atau keadaan rohani mereka.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Partikel “pun” menandai kelanjutan langsung bahwa angin mereda ketika Yesus naik ke perahu. Catatan kaki mempertahankan intensitas luar biasa dari frasa Yunani yang sulit diungkapkan secara alami dalam teks utama.
