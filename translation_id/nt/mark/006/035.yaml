  text: Καὶ ἤδη ὥρας πολλῆς γενομένης προσελθόντες αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ἔλεγον ὅτι Ἔρημός ἐστιν ὁ τόπος, καὶ ἤδη ὥρα πολλή·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/035.yaml
  text: And when it was already very late[a], his disciples came to him and were saying, “This place is deserted[b], and it is already very late.”
translation:
  language: id
  text: Ketika hari sudah larut[a], murid-muridnya datang kepadanya dan berkata, “Tempat ini terpencil[b], dan hari sudah larut.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ketika waktu sudah sangat larut.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Tempat ini tidak berpenghuni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: sudah
  rationale: Menandai bahwa waktu telah berlanjut sampai tahap tersebut; “sudah” merupakan padanan yang langsung dan alami dalam kedua kemunculannya.
- source_word: ὥρας πολλῆς γενομένης
  choice: ketika hari sudah larut
  rationale: Konstruksi genitif absolut ini menyatakan bahwa waktu telah menjadi lanjut. Ungkapan “hari sudah larut” menyampaikan idiom waktunya secara alami tanpa terikat secara kaku pada bentuk Yunani.
- source_word: προσελθόντες αὐτῷ
  choice: datang kepadanya
  rationale: Menyampaikan tindakan mendekati Yesus dengan ungkapan naratif Indonesia yang wajar.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: murid-muridnya
  rationale: Bentuk posesif yang alami dan setia pada teks; huruf kecil tidak menambahkan pembedaan tipografis yang tidak terdapat dalam bahasa sumber.
- source_word: ἔλεγον
  choice: berkata
  rationale: Imperfek Yunani memandang tuturan sebagai tindakan yang sedang berlangsung, tetapi bahasa Indonesia lazim memakai “berkata” dalam narasi; “terus berkata” akan menambahkan gagasan pengulangan yang belum tentu dimaksudkan.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Tempat ini terpencil
  rationale: ἔρημος menggambarkan lokasi yang jauh dari permukiman atau tidak berpenghuni. “Terpencil” alami dalam konteks dan tidak menyiratkan bahwa tempat itu ditinggalkan setelah sebelumnya dihuni.
- source_word: καὶ ἤδη ὥρα πολλή
  choice: dan hari sudah larut
  rationale: Mengungkapkan kembali lanjutnya waktu dalam tuturan langsung secara ringkas dan idiomatis.
