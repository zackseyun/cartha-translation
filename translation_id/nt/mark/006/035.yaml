translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan “hari sudah larut” dipertahankan karena terdapat dalam teks Yunani. Pronomina ilahi tidak diberi kapitalisasi khusus karena bahasa sumber tidak menandainya secara tipografis.
