  text: ἔλεγεν γὰρ ὁ Ἰωάννης τῷ Ἡρῴδῃ ὅτι Οὐκ ἔξεστίν σοι ἔχειν τὴν γυναῖκα τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/018.yaml
  text: For John had been saying to Herod[a], “It is not lawful for you to have your brother’s wife.”
translation:
  language: id
  text: Sebab Yohanes terus berkata kepada Herodes, “Tidak diperbolehkan bagimu[a] mempunyai istri saudaramu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau tidak boleh mempunyai istri saudaramu.”
    reason: Alternatif yang lebih langsung dan idiomatis untuk Οὐκ ἔξεστίν σοι ἔχειν; tetap mempertahankan makna izin atau larangan serta verba “mempunyai”.
lexical_decisions:
- source_word: ἔλεγεν
  choice: telah berulang kali berkata
  rationale: Bentuk imperfek menunjukkan tindakan ujaran yang berlangsung atau berulang pada masa lampau. Dalam konteks naratif, frasa ini menyampaikan bahwa teguran Yohanes bukan sekadar satu ucapan.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini memperkenalkan penjelasan bagi peristiwa yang disebutkan dalam konteks sebelumnya.
- source_word: Ἡρῴδῃ
  choice: Herodes
  rationale: Bentuk nama yang lazim dalam tradisi dan penggunaan Alkitab bahasa Indonesia.
- source_word: Οὐκ ἔξεστίν σοι
  choice: Engkau tidak boleh
  rationale: Ungkapan ini menyatakan bahwa sesuatu tidak diizinkan atau tidak sah. 'Tidak boleh' alami dalam bahasa Indonesia dan tetap memuat daya larangan moral-hukum.
- source_word: ἔχειν
  choice: memperistri
  rationale: Secara harfiah berarti 'mempunyai', tetapi dalam konteks hubungan perkawinan, 'memperistri' menyampaikan maksudnya secara alami tanpa menyiratkan kepemilikan umum.
- source_word: γυναῖκα
  choice: istri
  rationale: Walaupun dapat berarti 'perempuan', frasa kepunyaan 'saudaramu' menuntut arti 'istri' dalam konteks ini.
- source_word: τοῦ ἀδελφοῦ σου
  choice: istri saudaramu
  rationale: Susunan ini merupakan bentuk Indonesia yang alami bagi frasa genitif Yunani dan mempertahankan hubungan keluarga yang menjadi pokok teguran Yohanes.
theological_decisions:
- issue: Sifat teguran Yohanes
  choice: 'Diterjemahkan sebagai larangan moral-hukum: ''Engkau tidak boleh'''
  alternative: '''Tidak sah bagimu'' atau ''Engkau tidak diizinkan'''
  rationale: ἔξεστιν menyangkut apa yang diizinkan atau sah. Terjemahan mempertahankan kekuatan larangan yang kemungkinan berlatar ketentuan Taurat tanpa menambahkan rujukan eksplisit yang tidak terdapat dalam ayat.
- issue: Makna ἔχειν dalam hubungan perkawinan
  choice: '''memperistri'''
  alternative: '''mempunyai'''
  rationale: Pilihan ini memperjelas bahwa yang dikecam adalah hubungan perkawinan, bukan sekadar keberadaan atau kepemilikan, sambil tetap tidak menentukan rincian hukum yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Engkau' dipakai dalam kutipan teguran langsung sesuai ragam Alkitab Indonesia; 'telah berulang kali berkata' mempertahankan aspek imperfek Yunani.
