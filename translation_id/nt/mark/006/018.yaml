  naturalness: “Sebab Yohanes terus berkata kepada Herodes” adalah bahasa Indonesia modern yang alami dan menyampaikan aspek imperfek tanpa memaksakan makna frekuensi tertentu. “Tidak diperbolehkan bagimu mempunyai istri saudaramu” bersifat formal tetapi jelas dan sesuai register teguran publik bernuansa hukum.
  terminology: Herodes dan Yohanes adalah bentuk nama yang lazim. “Tidak diperbolehkan” mempertahankan daya larangan dari ἔξεστιν tanpa menambahkan dasar hukum tertentu. “Mempunyai istri saudaramu” mempertahankan idiom sumber “mempunyai istri,” sedangkan “memperistri” lebih khusus berarti tindakan menikahi dan karena itu kurang dekat dengan verba Yunani.
