id: MRK.6.36
reference: Mark 6:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπόλυσον αὐτούς, ἵνα ἀπελθόντες εἰς τοὺς κύκλῳ ἀγροὺς καὶ κώμας ἀγοράσωσιν ἑαυτοῖς ⸂τί φάγωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/036.yaml
  text: Send them away[a], so that they may go into the surrounding countryside and villages and buy themselves something to eat.
translation:
  language: id
  text: Suruhlah mereka pergi[a], supaya mereka dapat pergi ke ladang-ladang dan desa-desa di sekitarnya untuk membeli makanan bagi diri mereka sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Bubarkanlah mereka, supaya setelah pergi ke ladang-ladang dan desa-desa di sekitarnya, mereka dapat membeli bagi diri mereka sendiri sesuatu untuk dimakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλυσον
  choice: Suruhlah mereka pergi
  rationale: Imperatif aoris ini dalam konteks berarti menyuruh atau membubarkan orang banyak agar pergi. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan; 'supaya' menyampaikan hubungan tujuan secara jelas dan wajar.
- source_word: ἀπελθόντες
  choice: mereka dapat pergi
  rationale: Partisip aoris yang secara harfiah berarti 'setelah pergi' diserap secara alami ke dalam klausa tujuan, dengan urutan tindakan tetap tersirat.
- source_word: τοὺς κύκλῳ ἀγροὺς καὶ κώμας
  choice: ladang-ladang dan desa-desa di sekitarnya
  rationale: ἀγροί dapat menunjuk pada ladang atau daerah pertanian, sedangkan κῶμαι berarti desa-desa; κύκλῳ menunjukkan bahwa tempat-tempat itu berada di sekitar lokasi tersebut.
- source_word: ἀγοράσωσιν
  choice: membeli
  rationale: Padanan langsung dan modern bagi tindakan memperoleh sesuatu dengan membayar.
- source_word: ἑαυτοῖς
  choice: bagi diri mereka sendiri
  rationale: Mempertahankan nuansa datif refleksif yang menunjukkan bahwa pembelian itu untuk kebutuhan mereka sendiri.
- source_word: τί φάγωσιν
  choice: makanan
  rationale: Secara idiomatis berarti sesuatu yang dapat mereka makan; 'makanan' menyampaikan maksud itu dengan ringkas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Bentuk 'suruhlah' mempertahankan perintah langsung tanpa kekakuan 'bubarkanlah', sementara catatan kaki mencatat susunan yang lebih formal dan harfiah.
