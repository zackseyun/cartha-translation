id: MRK.6.25
reference: Mark 6:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσα ⸀εὐθὺς μετὰ σπουδῆς πρὸς τὸν βασιλέα ᾐτήσατο λέγουσα· Θέλω ἵνα ⸂ἐξαυτῆς δῷς μοι⸃ ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/025.yaml
  text: And she immediately went in with haste to the king and asked[a], saying, “I want you to give me at once, on a platter, the head of John the Baptizer.”
translation:
  language: id
  text: Gadis itu pun segera masuk dengan tergesa-gesa menghadap raja dan meminta, “Aku mau engkau memberikan kepadaku sekarang juga kepala Yohanes Pembaptis di atas sebuah nampan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: masuk
  rationale: Partisip aoris ini menyatakan gerak gadis itu ke dalam ruang perjamuan atau ke hadapan raja; ‘masuk’ mempertahankan tindakan naratif secara ringkas dan wajar.
- source_word: εὐθὺς
  choice: segera
  rationale: Kata ini menandai kesegeraan dan mempertahankan desakan khas narasi Markus.
- source_word: μετὰ σπουδῆς
  choice: dengan tergesa-gesa
  rationale: Frasa ini menyampaikan gerak yang cepat dan mendesak tanpa harus memberi kesan bahwa ia bertindak dengan semangat yang positif.
- source_word: βασιλέα
  choice: raja
  rationale: Meskipun Herodes Antipas secara historis adalah penguasa wilayah, teks Yunani memakai βασιλεύς, sehingga gelar naratifnya diterjemahkan ‘raja’.
- source_word: ᾐτήσατο
  choice: meminta
  rationale: Verba ini menyatakan permintaan; ketegasan tuntutannya tampak dalam perkataan langsung dan tidak perlu dimasukkan secara berlebihan ke dalam verba pengantar.
- source_word: Θέλω
  choice: Aku mau
  rationale: Ungkapan ini menyampaikan kehendak secara lugas dan mempertahankan nada blak-blakan dari permintaan tersebut.
- source_word: ἵνα ... δῷς μοι
  choice: engkau memberikan kepadaku
  rationale: Klausa ἵνα menyatakan isi dari apa yang dikehendaki; susunan ini alami dalam bahasa Indonesia dan tetap dekat dengan bentuk Yunani.
- source_word: ἐξαυτῆς
  choice: sekarang juga
  rationale: Kata ini menuntut tindakan seketika. Terjemahan tersendiri mempertahankan perbedaannya dari εὐθὺς, yang menerangkan tindakan gadis itu masuk.
- source_word: ἐπὶ πίνακι
  choice: di atas sebuah nampan
  rationale: πίναξ menunjuk pada wadah saji atau nampan; pilihan ini sesuai dengan latar perjamuan dan jelas bagi pembaca modern.
- source_word: κεφαλὴν
  choice: kepala
  rationale: Terjemahan harfiah mempertahankan kekejaman spesifik dalam narasi tanpa memperhalusnya.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Yohanes Pembaptis
  rationale: βαπτιστής adalah gelar deskriptif bagi orang yang membaptis. ‘Pembaptis’ menerjemahkan fungsi gelar itu secara langsung dan juga merupakan bentuk Indonesia yang lazim.
theological_decisions:
- issue: Penerjemahan gelar Ἰωάννου τοῦ βαπτιστοῦ
  choice: Yohanes Pembaptis
  alternative: Yohanes yang Membaptis
  rationale: ‘Pembaptis’ mempertahankan daya deskriptif gelar Yunani sekaligus memakai bentuk yang alami dan sudah dikenal dalam bahasa Indonesia; tidak ada perbedaan doktrinal yang perlu dipaksakan.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. ‘Gadis itu pun’ menjaga kesinambungan cerita; ‘engkau’ mempertahankan orang kedua tunggal tanpa menambahkan gelar sapaan yang tidak terdapat dalam teks Yunani. Kedua penanda kesegeraan diterjemahkan secara terpisah: ‘segera’ untuk εὐθὺς dan ‘sekarang juga’ untuk ἐξαυτῆς.'
