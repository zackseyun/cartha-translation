  text: καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/013.yaml
  text: And they were casting out many demons[a], and were anointing many sick people with oil and healing them.
translation:
  language: id
  text: Mereka mengusir banyak roh jahat dan mengolesi banyak orang sakit dengan minyak[a] dan menyembuhkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “minyak zaitun.”
    reason: alternatif leksikal untuk ἐλαίῳ; minyak zaitun lazim dalam konteks Mediterania kuno, tetapi “minyak” cukup dan lebih dekat dengan bentuk umum teks utama.
lexical_decisions:
- source_word: δαιμόνια
  choice: roh jahat
  rationale: Dalam konteks ini δαιμόνια menunjuk kepada makhluk roh yang jahat. “Roh jahat” merupakan padanan Indonesia yang alami dan mudah dipahami tanpa menggantinya dengan istilah Yunani lain, seperti “roh najis”.
- source_word: πολλὰ
  choice: banyak
  rationale: Bentuk ini menerangkan δαιμόνια secara kuantitatif; “banyak” mempertahankan arti lugasnya.
- source_word: ἐξέβαλλον
  choice: mengusir
  rationale: Imperfek menggambarkan tindakan yang berulang atau berlangsung dalam rangkuman pelayanan para murid. Dalam narasi Indonesia, aspek tersebut dapat tersampaikan secara alami melalui konteks dan rangkaian tindakan tanpa menambahkan “terus-menerus”.
- source_word: ἤλειφον
  choice: mengolesi
  rationale: ἀλείφω berarti mengoleskan atau meminyaki. “Mengolesi ... dengan minyak” alami dalam bahasa Indonesia dan tidak memasukkan nuansa upacara yang belum tentu dimaksudkan oleh teks.
- source_word: ἐλαίῳ
  choice: dengan minyak
  rationale: ἔλαιον berarti minyak dan dalam lingkungan Mediterania biasanya minyak zaitun. Teks utama mempertahankan bentuk umum “minyak” karena sumber tidak secara eksplisit menambahkan kata “zaitun”.
- source_word: πολλοὺς ἀρρώστους
  choice: banyak orang sakit
  rationale: Adjektiva ἀρρώστους dipakai secara substantival dan diterangkan oleh πολλούς. Padanan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: ἐθεράπευον
  choice: menyembuhkan mereka
  rationale: θεραπεύω berarti menyembuhkan. Pronomina “mereka” secara alami merujuk kepada banyak orang sakit; konteks rangkuman menyampaikan sifat berulang dari bentuk imperfek.
- source_word: καὶ
  choice: dan ... lalu
  rationale: καί menghubungkan tindakan-tindakan dalam rangkaian naratif. “Dan” mempertahankan koordinasi pertama, sedangkan “lalu” membuat hubungan kalimat terakhir alami tanpa menetapkan bahwa minyak merupakan penyebab penyembuhan.
theological_decisions:
- issue: Fungsi pengolesan minyak dalam hubungannya dengan penyembuhan
  choice: Menerjemahkan tindakan itu secara deskriptif sebagai bagian dari pelayanan para murid tanpa menyatakan bahwa minyaklah yang menghasilkan kesembuhan.
  alternative: Memahami minyak sebagai sarana yang dengan sendirinya menghasilkan kesembuhan, atau sebagai lambang belaka yang sama sekali tidak berperan.
  rationale: Ayat ini melaporkan bahwa para murid mengolesi orang sakit dengan minyak dan menyembuhkan mereka, tetapi tidak menjelaskan mekanismenya atau menetapkan doktrin tentang daya sakramental minyak. Terjemahan mempertahankan rangkaian tindakan tersebut tanpa menyelesaikan ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. “Roh jahat” dipilih karena lebih alami bagi pembaca umum daripada transliterasi “demon”. “Mengolesi ... dengan minyak” menjaga makna konkret ἀλείφω dan menghindari konotasi denominasi yang mungkin melekat pada “mengurapi”.
