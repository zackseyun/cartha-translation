source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ὅπου ⸀ἐὰν εἰσέλθητε εἰς οἰκίαν, ἐκεῖ μένετε ἕως ἂν ἐξέλθητε ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/010.yaml
  text: And he was saying to them[a], “Wherever you enter a house, stay there until you leave that place.”
translation:
  language: id
  text: Ia berkata kepada mereka, “Di mana pun kalian masuk ke sebuah rumah, tinggallah di sana sampai kalian berangkat dari tempat itu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sampai kalian keluar dari sana.” Secara lebih harfiah, bahasa Yunani berbunyi “sampai kalian keluar dari sana”; dalam konteks ini, ungkapan tersebut kemungkinan menunjuk pada keberangkatan dari tempat atau daerah itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ia berkata
  rationale: Bentuk imperfek menggambarkan ujaran dalam alur narasi, tetapi dalam bahasa Indonesia bentuk lampau progresif tidak perlu dinyatakan secara kaku; 'berkata' merupakan ungkapan naratif yang alami tanpa menyangkal nuansa aspek sumber.
- source_word: Ὅπου ἐὰν
  choice: Di mana pun
  rationale: Gabungan ini menyatakan tempat yang tidak tentu; 'di mana pun' ringkas, alami, dan tepat.
- source_word: εἰσέλθητε εἰς οἰκίαν
  choice: kalian masuk ke sebuah rumah
  rationale: '''Masuk ke'' mempertahankan arah gerak yang dinyatakan oleh εἰς dan terdengar wajar dalam bahasa Indonesia.'
- source_word: οἰκίαν
  choice: sebuah rumah
  rationale: Dalam konteks ini οἰκία terutama menunjuk tempat tinggal tempat para murid menumpang, sehingga 'rumah' lebih langsung daripada istilah yang menekankan rumah tangga.
- source_word: ἐκεῖ μένετε
  choice: tinggallah di sana
  rationale: Bentuk imperatif 'tinggallah' menyampaikan perintah untuk tetap menetap di rumah tersebut selama pelayanan di lokasi itu.
- source_word: ἕως ἂν ἐξέλθητε ἐκεῖθεν
  choice: sampai kalian berangkat dari tempat itu
  rationale: '''Berangkat dari tempat itu'' secara alami dapat menunjuk kepergian dari lokasi pelayanan, sedangkan catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.'
theological_decisions:
- issue: Cakupan ἐκεῖθεν dalam klausa keberangkatan
  choice: Para murid tinggal di rumah yang sama sampai berangkat dari tempat atau daerah tersebut.
  alternative: Para murid tinggal di sana sampai keluar dari rumah itu.
  rationale: Konteks petunjuk mengenai tumpangan mendukung larangan berpindah-pindah rumah selama berada di satu lokasi. Namun, bahasa Yunani hanya mengatakan secara harfiah 'keluar dari sana', sehingga kemungkinan cakupan yang lebih sempit tetap dicatat dan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Kalian' dipakai untuk menyatakan orang kedua jamak secara jelas dan alami; 'Ia' mempertahankan rujukan pronominal teks sumber tanpa menambahkan nama.
