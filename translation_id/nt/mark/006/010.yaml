review_pass:
  verdict: approve
  source_fidelity: 'Terjemahan dengan tepat menyampaikan unsur-unsur utama teks Yunani: ujaran Yesus kepada para murid, lokasi tak tentu (Ὅπου ἐὰν), masuk ke sebuah rumah, perintah untuk tetap di sana, dan batas waktu hingga keberangkatan. Imperfek ἔλεγεν tidak harus diterjemahkan secara progresif dalam narasi bahasa Indonesia; “Ia berkata” wajar dan tidak menimbulkan penyimpangan makna yang berarti.'
  naturalness: Bahasa Indonesia baku, jelas, dan mengalir. “Di mana pun kalian masuk ke sebuah rumah” serta “tinggallah di sana” alami dalam register instruksional. Pemakaian “kalian” secara eksplisit menandai jamak dan cocok untuk gaya modern standar.
  terminology: “Rumah” tepat untuk οἰκία dalam konteks tempat menumpang. “Tinggallah” tepat untuk μένετε. “Berangkat dari tempat itu” menyampaikan pembacaan kontekstual atas ἐξέλθητε ἐκεῖθεν tanpa memaksakan makna sempit “keluar dari rumah”; catatan kaki secara memadai mempertahankan bentuk yang lebih harfiah dan ambiguitas cakupannya.
