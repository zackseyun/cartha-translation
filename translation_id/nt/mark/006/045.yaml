  text: Καὶ ⸀εὐθὺς ἠνάγκασεν τοὺς μαθητὰς αὐτοῦ ἐμβῆναι εἰς τὸ πλοῖον καὶ προάγειν ⸂εἰς τὸ πέραν⸃ πρὸς Βηθσαϊδάν, ἕως αὐτὸς ⸀ἀπολύει τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/045.yaml
  text: And immediately he compelled his disciples to get into the boat and go ahead to the other side[a], toward Bethsaida[b], until he himself dismissed the crowd.
translation:
  language: id
  text: Segera Yesus memaksa murid-murid-Nya naik ke perahu dan berangkat lebih dahulu ke seberang, ke arah Betsaida[a], sampai Ia sendiri membubarkan orang banyak itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke Betsaida.” Kata depan Yunani dapat menyatakan arah (“ke arah”) atau tujuan (“ke”).
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sampai Ia sendiri membubarkan orang banyak itu”; verba Yunani berbentuk kini dalam anak kalimat waktu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: segera sesudah itu
  rationale: Mempertahankan tempo naratif khas Markus sekaligus menghubungkan tindakan ini secara alami dengan peristiwa sebelumnya.
- source_word: ἠνάγκασεν
  choice: mendesak
  rationale: Menyatakan tekanan atau keharusan yang kuat tanpa harus menyiratkan paksaan fisik seperti yang dapat ditimbulkan oleh 'memaksa'.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: murid-murid-Nya
  rationale: Istilah baku dan tepat untuk relasi guru-murid dalam Injil; sufiks posesif merujuk kepada Yesus.
- source_word: ἐμβῆναι εἰς τὸ πλοῖον
  choice: naik ke perahu
  rationale: Ungkapan Indonesia yang alami untuk masuk dan menumpang perahu.
- source_word: προάγειν
  choice: berangkat lebih dahulu
  rationale: Menjaga makna bahwa para murid pergi mendahului Yesus, bukan sekadar meneruskan perjalanan.
- source_word: εἰς τὸ πέραν
  choice: ke seberang
  rationale: Ungkapan idiomatis Indonesia yang menunjuk sisi lain danau.
- source_word: πρὸς Βηθσαϊδάν
  choice: menuju Betsaida
  rationale: πρός dengan akusatif menyatakan arah; 'menuju' mempertahankan nuansa arah tanpa memastikan bahwa kota itu sendiri merupakan titik tiba.
- source_word: ἕως
  choice: sementara
  rationale: Dalam konteks tindakan yang berlangsung bersamaan—para murid berangkat dan Yesus membubarkan orang banyak—'sementara' lebih alami dalam bahasa Indonesia daripada 'sampai', yang dapat memberi urutan temporal yang janggal.
- source_word: αὐτὸς
  choice: Ia sendiri
  rationale: Mempertahankan penekanan pada Yesus sebagai pribadi yang tetap menangani orang banyak.
- source_word: ἀπολύει τὸν ὄχλον
  choice: menyuruh orang banyak itu pulang
  rationale: Menyampaikan makna kontekstual membubarkan atau menyuruh pergi dalam bahasa Indonesia yang jelas dan alami; bentuk kini Yunani dalam klausa temporal tidak perlu ditiru secara kaku.
