revisions:
- from: Segera sesudah itu, Yesus mendesak murid-murid-Nya naik ke perahu dan berangkat lebih dahulu ke seberang, menuju Betsaida, sementara Ia sendiri menyuruh orang banyak itu pulang.
  to: Segera Yesus memaksa murid-murid-Nya naik ke perahu dan berangkat lebih dahulu ke seberang, ke arah Betsaida[a], sampai Ia sendiri membubarkan orang banyak itu[b].
  rationale: Revisi memulihkan kekuatan ἠνάγκασεν dan fungsi temporal ἕως, sambil mempertahankan nuansa directional πρὸς dengan “ke arah.” Catatan kaki menandai alternatif yang sah untuk Betsaida serta bentuk kini ἀπολύει tanpa memaksakan bentuk gramatikal Yunani secara tidak alami ke dalam bahasa Indonesia.
