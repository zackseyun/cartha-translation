  verdict: revise
  source_fidelity: Revisi diperlukan terutama karena ἕως berarti “sampai,” bukan “sementara.” Selain itu, εὐθύς paling langsung diterjemahkan “Segera,” tanpa tambahan “sesudah itu,” dan ἠνάγκασεν menuntut ungkapan yang lebih kuat daripada “mendesak.” Nuansa arah dalam πρὸς Βηθσαϊδάν dipertahankan dengan “ke arah Betsaida.”
  naturalness: Teks revisi tetap memakai Bahasa Indonesia modern dan lugas. “Memaksa ... naik ke perahu” serta “membubarkan orang banyak itu” alami dalam register naratif Alkitab kontemporer.
  terminology: “Murid-murid-Nya,” “perahu,” “Betsaida,” dan “orang banyak” tepat dan konsisten. “Ia sendiri” mempertahankan penekanan αὐτός tanpa menambah penafsiran.
  issues:
  - severity: high
    issue: ἕως diterjemahkan “sementara.”
    rationale: Ἕως menetapkan batas waktu, “sampai,” bagi tindakan para murid berangkat mendahului Yesus. “Sementara” hanya menyatakan keserempakan dan menghilangkan relasi temporal yang dinyatakan teks Yunani.
  - severity: medium
    issue: ἠνάγκασεν diterjemahkan “mendesak.”
    rationale: ἀναγκάζω menyatakan membuat atau memaksa dengan tekanan kuat. “Mendesak” dapat berarti sekadar menganjurkan dengan kuat dan terlalu melemahkan verba sumber.
  - severity: low
    issue: εὐθύς diterjemahkan “Segera sesudah itu.”
    rationale: “Sesudah itu” bukan bagian eksplisit dari εὐθύς. Walaupun konteks naratif mengandaikan tindakan sebelumnya, “Segera” menyampaikan teks secara lebih langsung.
