id: MRK.6.34
reference: Mark 6:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν ⸀εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ ⸀αὐτοὺς ὅτι ἦσαν ὡς πρόβατα μὴ ἔχοντα ποιμένα, καὶ ἤρξατο διδάσκειν αὐτοὺς πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/034.yaml
  text: And when he went ashore[a], he saw a large crowd, and he had compassion on them, because they were like sheep without a shepherd[b]. And he began to teach them many things.
translation:
  language: id
  text: Ketika Yesus turun dari perahu[a], Ia melihat kerumunan besar. Hati-Nya tergerak oleh belas kasihan kepada mereka, karena mereka seperti domba yang tidak mempunyai gembala.[b] Lalu Ia mulai mengajarkan banyak hal kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “keluar”. Dalam konteks ini, maksudnya ialah keluar dari perahu atau turun ke darat.'
    reason: lexical_alternative
  - marker: b
    text: Gambaran “domba yang tidak mempunyai gembala” menggemakan bahasa Alkitab tentang umat yang tidak memiliki kepemimpinan yang setia; bandingkan Bil. 27:17; 1 Raj. 22:17; Yeh. 34:5.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθὼν
  choice: ketika Yesus turun dari perahu
  rationale: Secara harfiah berarti ‘setelah keluar’. Dalam konteks perjalanan dengan perahu (Mrk. 6:32-33), tindakan itu paling wajar dipahami sebagai turun dari perahu. Nama ‘Yesus’ dinyatakan agar subjek jelas dalam bahasa Indonesia.
- source_word: εἶδεν
  choice: Ia melihat
  rationale: Bentuk aoristus dari ὁράω secara langsung menyatakan tindakan melihat; tidak diperlukan nuansa tafsiran tambahan.
- source_word: πολὺν ὄχλον
  choice: kerumunan besar
  rationale: ὄχλος berarti kerumunan atau orang banyak, sedangkan πολύς menunjukkan jumlah yang besar. Ungkapan ini ringkas dan alami dalam bahasa Indonesia modern.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοὺς
  choice: Hati-Nya tergerak oleh belas kasihan kepada mereka
  rationale: Kata kerja ini menyatakan belas kasihan yang mendalam. Ungkapan Indonesia tersebut mempertahankan daya emosionalnya, sedangkan ‘kepada mereka’ menyatakan pihak yang menjadi sasaran belas kasihan.
- source_word: ὅτι
  choice: karena
  rationale: Kata ini memperkenalkan alasan bagi belas kasihan Yesus.
- source_word: ὡς πρόβατα μὴ ἔχοντα ποιμένα
  choice: seperti domba yang tidak mempunyai gembala
  rationale: Terjemahan ini mempertahankan perumpamaan pastoral tanpa menjelaskan atau membatasi makna teologisnya dalam teks utama.
- source_word: ἤρξατο διδάσκειν
  choice: Ia mulai mengajarkan
  rationale: Konstruksi ini menyatakan permulaan tindakan mengajar dan diterjemahkan secara alami tanpa kehilangan aspek ingresifnya.
- source_word: αὐτοὺς πολλά
  choice: banyak hal kepada mereka
  rationale: πολλά paling langsung dipahami sebagai banyak hal yang menjadi isi pengajaran. Susunan Indonesia diatur agar alami sambil mempertahankan cakupan pengajaran yang luas.
theological_decisions:
- issue: Gambaran umat sebagai domba tanpa gembala
  choice: Mempertahankan metafora ‘seperti domba yang tidak mempunyai gembala’ dalam teks utama.
  alternative: Menjelaskannya sebagai orang-orang yang tidak mempunyai pemimpin rohani.
  rationale: Ungkapan ini kemungkinan menggemakan bahasa Perjanjian Lama tentang umat dan kepemimpinan mereka. Metaforanya dipertahankan agar cakupan makna dan ketegangan teologisnya tidak dipersempit oleh penjelasan interpretatif.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam yang alami dan bermartabat. Struktur kalimat dibagi agar mudah dibaca. Metafora sumber dipertahankan, dan istilah yang terlalu teknis atau penjelasan teologis tambahan dihindari.
