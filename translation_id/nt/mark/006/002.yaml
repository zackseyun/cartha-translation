reference: Mark 6:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ γενομένου σαββάτου ἤρξατο ⸂διδάσκειν ἐν τῇ συναγωγῇ⸃· καὶ ⸀οἱ πολλοὶ ἀκούοντες ἐξεπλήσσοντο λέγοντες· Πόθεν τούτῳ ταῦτα, καὶ τίς ἡ σοφία ἡ δοθεῖσα ⸀τούτῳ, καὶ ⸀αἱ δυνάμεις τοιαῦται διὰ τῶν χειρῶν αὐτοῦ ⸀γινόμεναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/002.yaml
  text: And when the Sabbath came[a], he began to teach in the synagogue. And many who heard him were astonished, saying, “Where did this man get these things? And what is this wisdom given to him, and such mighty works happening through his hands?”
translation:
  language: id
  text: Ketika hari Sabat tiba, ia mulai mengajar di sinagoge. Banyak orang yang mendengarnya tercengang dan berkata, “Dari mana orang ini memperoleh semuanya itu? Hikmat apakah yang telah diberikan kepadanya? Dan dari mana perbuatan-perbuatan penuh kuasa seperti itu, yang terjadi melalui tangannya[a], berasal?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mukjizat-mukjizat” atau “perbuatan-perbuatan kuasa”. Bentuk jamak Yunani δυνάμεις dapat menunjuk pada perbuatan ajaib atau wujud kuasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένου σαββάτου
  choice: Ketika hari Sabat tiba
  rationale: Konstruksi genitivus absolutus menyatakan keadaan waktu. Pilihan ini mempertahankan nuansa kedatangan hari Sabat dalam bahasa Indonesia yang alami.
- source_word: ἤρξατο διδάσκειν
  choice: ia mulai mengajar
  rationale: Mencerminkan konstruksi ingresif ἄρχομαι dengan infinitif secara langsung dan wajar.
- source_word: συναγωγῇ
  choice: sinagoge
  rationale: Dalam konteks Yahudi ini, kata tersebut menunjuk pada tempat atau lembaga ibadah yang khusus; 'sinagoge' lebih tepat daripada istilah umum 'rumah ibadat'.
- source_word: οἱ πολλοὶ ἀκούοντες
  choice: Banyak orang yang mendengarnya
  rationale: οἱ πολλοὶ mengacu pada banyak orang, sedangkan objek 'mendengar' dapat dinyatakan dari konteks agar kalimat Indonesia lengkap dan alami.
- source_word: ἐξεπλήσσοντο
  choice: tercengang
  rationale: Menyampaikan reaksi kuat berupa keheranan atau ketakjuban yang terkandung dalam verba Yunani, sementara bentuk naratifnya tetap alami.
- source_word: Πόθεν τούτῳ ταῦτα
  choice: Dari mana orang ini memperoleh semuanya itu?
  rationale: Πόθεν menanyakan asal atau sumber. 'Orang ini' mempertahankan daya demonstratif τούτῳ dan kemungkinan nada mengambil jarak.
- source_word: τίς ἡ σοφία ἡ δοθεῖσα τούτῳ
  choice: Hikmat apakah yang telah diberikan kepadanya?
  rationale: Mempertahankan bentuk pertanyaan serta bentuk pasif δοθεῖσα tanpa menentukan siapa pemberi hikmat tersebut.
- source_word: δυνάμεις
  choice: perbuatan-perbuatan penuh kuasa
  rationale: Dalam bentuk jamak dan konteks Markus, istilah ini menunjuk pada perbuatan luar biasa sebagai manifestasi kuasa. Pilihan ini lebih dekat dengan citra leksikal Yunani daripada langsung menafsirkannya sebagai 'mukjizat'.
- source_word: διὰ τῶν χειρῶν αὐτοῦ γινόμεναι
  choice: terjadi melalui tangannya
  rationale: Mempertahankan gambaran instrumental 'melalui tangannya' dan nuansa γινόμεναι sebagai sesuatu yang berlangsung atau terjadi.
theological_decisions:
- issue: Makna δυνάμεις dalam konteks pelayanan Yesus
  choice: perbuatan-perbuatan penuh kuasa
  alternative: mukjizat; kuasa-kuasa
  rationale: Terjemahan ini menyampaikan bahwa yang dimaksud adalah perbuatan luar biasa yang memperlihatkan kuasa, tetapi tidak menghapus citra leksikal atau mempersempitnya lebih jauh daripada konteks.
- issue: Nada demonstratif τούτῳ
  choice: orang ini pada pertanyaan pertama, lalu -nya pada pertanyaan berikutnya
  alternative: dia; orang itu
  rationale: '''Orang ini'' mempertahankan kemungkinan nada mengambil jarak atau meremehkan, sedangkan pengulangan dengan pronomina menjaga kelancaran bahasa Indonesia tanpa memperkuat nada tersebut secara berlebihan.'
- issue: Pelaku yang memberikan hikmat
  choice: bentuk pasif 'telah diberikan kepadanya' tanpa menyebut pelaku
  alternative: hikmat yang diberikan Allah kepadanya
  rationale: Teks Yunani tidak menyebut pemberinya; mempertahankan bentuk pasif menjaga ambiguitas dan tidak memasukkan kesimpulan teologis ke dalam teks.
- issue: Bentuk klausa terakhir yang eliptis
  choice: Dan bagaimana ... dapat terjadi melalui tangannya?
  alternative: dan perbuatan-perbuatan penuh kuasa seperti itu yang terjadi melalui tangannya?
  rationale: Bahasa Yunani memiliki susunan eliptis dalam rangkaian pertanyaan. Penambahan 'bagaimana' dan 'dapat' membuat pertanyaan dapat dipahami dalam bahasa Indonesia tanpa menetapkan sumber kuasa atau pelakunya.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. 'Sinagoge' dipakai demi ketepatan latar Yahudi. Pronomina 'ia' dan '-nya' ditulis dengan huruf kecil sebagai pilihan editorial netral. Penanda catatan kaki ditempatkan setelah frasa yang diterangkannya, bukan setelah 'hari Sabat' seperti pada lapisan konsultasi Inggris yang tampaknya salah tempat.
