    rationale: Teks Yunani tidak secara eksplisit menanyakan mekanisme (‘bagaimana’) atau kemungkinan (‘dapat’). Dalam susunan eliptisnya, frasa tentang perbuatan-perbuatan penuh kuasa melanjutkan pertanyaan-pertanyaan tentang asal yang dinyatakan pada Πόθεν. Terjemahan revisi menyatakan elipsis itu secara alami tanpa menetapkan pelaku atau sumber kuasa.
  - severity: low
    issue: Catatan kaki memakai frasa ‘pernyataan kuasa’.
    rationale: Frasa ini tidak sejelas dan tidak sealami ‘wujud kuasa’ atau ‘manifestasi kuasa’ untuk kemungkinan rentang makna δυνάμεις dalam konteks ini.
