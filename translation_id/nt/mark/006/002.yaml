  verdict: revise
  source_fidelity: Dua pertanyaan pertama menerjemahkan teks Yunani dengan baik dan mempertahankan bentuk pasif pada ‘hikmat ... diberikan kepadanya’. Namun, klausa terakhir Yunani adalah rangkaian eliptis yang mengaitkan ‘perbuatan-perbuatan penuh kuasa seperti itu’ dengan yang terjadi melalui tangan-Nya; ‘bagaimana ... dapat terjadi’ menggeser fokus menjadi cara atau kemungkinan terjadinya. Penyelesaian elipsis sebagai pertanyaan asal lebih selaras dengan Πόθεν pada rangkaian pertanyaan itu tanpa menyebut sumber kuasa.
  naturalness: 'Bahasanya pada umumnya modern, formal, dan alami. ‘Dari mana ... berasal?’ pada pertanyaan terakhir membuat koordinasi pertanyaan retoris itu jelas dalam bahasa Indonesia. Catatan kaki diperhalus: ‘pernyataan kuasa’ kurang idiomatis untuk makna δυνάμεις.'
  terminology: ‘Hari Sabat’, ‘sinagoge’, dan ‘hikmat’ tepat serta konsisten dengan register Alkitab Indonesia modern. ‘Perbuatan-perbuatan penuh kuasa’ adalah pilihan yang sah untuk δυνάμεις dan catatan kaki secara tepat menyediakan ‘mukjizat-mukjizat’ sebagai alternatif. ‘Melalui tangannya’ mempertahankan citra instrumental Yunani.
  issues:
