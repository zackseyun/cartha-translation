- from: Ketika hari Sabat tiba, ia mulai mengajar di sinagoge. Banyak orang yang mendengarnya tercengang dan berkata, “Dari mana orang ini memperoleh semuanya itu? Hikmat apakah yang telah diberikan kepadanya? Dan bagaimana perbuatan-perbuatan penuh kuasa seperti itu dapat terjadi melalui tangannya[a]?”
  to: Ketika hari Sabat tiba, ia mulai mengajar di sinagoge. Banyak orang yang mendengarnya tercengang dan berkata, “Dari mana orang ini memperoleh semuanya itu? Hikmat apakah yang telah diberikan kepadanya? Dan dari mana perbuatan-perbuatan penuh kuasa seperti itu, yang terjadi melalui tangannya[a], berasal?”
  rationale: Revisi terbatas pada klausa terakhir dan perumusan catatan kaki. ‘Dari mana ... berasal?’ mengungkapkan secara wajar dalam bahasa Indonesia pertanyaan eliptis Yunani mengenai perbuatan-perbuatan penuh kuasa, tanpa menambahkan pertanyaan tentang mekanisme atau kemampuan. Penanda catatan kaki tetap menempel pada frasa yang diterangkannya.
