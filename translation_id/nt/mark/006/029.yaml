  text: καὶ ἀκούσαντες οἱ μαθηταὶ αὐτοῦ ἦλθον καὶ ἦραν τὸ πτῶμα αὐτοῦ καὶ ἔθηκαν αὐτὸ ἐν μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/029.yaml
  text: And when his disciples heard[a], they came and took up his body and laid it in a tomb.
translation:
  language: id
  text: Ketika murid-muridnya mendengar hal itu, mereka datang, mengambil jenazahnya, lalu meletakkannya di dalam sebuah makam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: ketika ... mendengar hal itu
  rationale: Partisip aoris ini berfungsi secara temporal. Tambahan “hal itu” merupakan pelengkap alami dalam bahasa Indonesia dan merujuk pada kabar tentang kematian Yohanes dalam konteks sebelumnya.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: murid-muridnya
  rationale: μαθηταί secara lazim berarti “murid-murid”; dalam konteks langsung, akhiran -nya mengacu kepada Yohanes Pembaptis.
- source_word: ἦλθον
  choice: mereka datang
  rationale: Padanan langsung dan alami bagi ἔρχομαι dalam narasi ini, yang menggambarkan kedatangan mereka ke tempat jenazah berada.
- source_word: ἦραν
  choice: mengambil
  rationale: αἴρω dapat berarti mengangkat, mengambil, atau membawa pergi. “Mengambil” alami dalam konteks pengurusan jenazah tanpa menambahkan rincian gerak yang tidak dinyatakan secara eksplisit.
- source_word: τὸ πτῶμα αὐτοῦ
  choice: jenazahnya
  rationale: πτῶμα secara khusus menunjuk kepada tubuh orang yang telah mati. “Jenazah” menyampaikan makna itu secara tepat, wajar, dan bermartabat dalam bahasa Indonesia.
- source_word: ἔθηκαν
  choice: membaringkannya
  rationale: τίθημι berarti menaruh atau meletakkan. Dalam konteks pemakaman, “membaringkannya” terdengar alami dan bermartabat sambil mempertahankan tindakan penempatan jenazah.
- source_word: ἐν μνημείῳ
  choice: di dalam sebuah makam
  rationale: μνημεῖον di sini adalah tempat penguburan. “Makam” merupakan padanan Indonesia yang umum dan tepat; artikel tak tentu diterjemahkan dengan “sebuah” karena makam itu belum disebut sebelumnya.
theological_decisions:
- issue: Acuan pada “murid-muridnya”
  choice: Murid-murid Yohanes Pembaptis
  alternative: Murid-murid Yesus
  rationale: Konteks terdekat mengisahkan eksekusi Yohanes, dan jenazah yang diambil adalah jenazah Yohanes. Terjemahan mempertahankan bentuk pronominal teks Yunani tanpa mengganti “-nya” dengan nama Yohanes.
translation_notes:
  register: Bahasa Indonesia modern baku dengan nada naratif yang lugas dan bermartabat. “Jenazah” dipilih alih-alih “tubuh” agar kekhususan makna πτῶμα sebagai tubuh orang mati tersampaikan langsung; karena itu tidak diperlukan catatan kaki alternatif.
