  text: And they went out and proclaimed that people should repent[a].
translation:
  language: id
  text: Mereka pun pergi dan memberitakan bahwa orang-orang harus bertobat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “supaya mereka bertobat”; kata “mereka” merujuk kepada orang-orang yang mendengar pemberitaan itu.'
    reason: Menjelaskan subjek jamak yang tersirat dalam verba Yunani serta alternatif yang lebih dekat dengan konstruksi ἵνα.
lexical_decisions:
- source_word: Καὶ
  choice: pun
  rationale: Partikel ini menghubungkan ayat dengan pengutusan sebelumnya dan menjaga alur narasi secara alami tanpa menambahkan urutan waktu yang tegas.
- source_word: ἐξελθόντες
  choice: pergi
  rationale: Partisip aoris ini merujuk kepada murid-murid yang keluar untuk melaksanakan pengutusan. Bentuk verba finit menghasilkan bahasa Indonesia yang alami.
- source_word: ἐκήρυξαν
  choice: memberitakan
  rationale: Verba κηρύσσω menunjuk pada penyampaian berita secara terbuka. 'Memberitakan' mempertahankan gagasan proklamasi tanpa membatasi tindakan itu pada khotbah dalam konteks ibadah.
- source_word: ἵνα
  choice: bahwa ... harus
  rationale: Dalam konstruksi ini ἵνα dapat menyatakan isi atau hasil yang dikehendaki dari pemberitaan. Ungkapan ini menyampaikan seruan kepada para pendengar secara wajar dalam bahasa Indonesia.
- source_word: μετανοῶσιν
  choice: bertobat
  rationale: '''Bertobat'' merupakan padanan ringkas dan lazim bagi μετανοέω, yang dalam konteks Injil mencakup perubahan sikap batin dan arah hidup, bukan sekadar perubahan pendapat.'
theological_decisions:
- issue: Subjek tersirat dari μετανοῶσιν
  choice: orang-orang harus bertobat
  alternative: mereka harus bertobat
  rationale: Bentuk verba Yunani memiliki subjek jamak tersirat yang merujuk kepada para pendengar pemberitaan, bukan kepada para murid. 'Orang-orang' memperjelas rujukan itu tanpa menambahkan isi doktrinal.
- issue: Nuansa ἵνα sebagai isi atau tujuan pemberitaan
  choice: bahwa ... harus
  alternative: agar orang-orang bertobat
  rationale: Konteks mendukung pemahaman bahwa para murid memberitakan tuntutan untuk bertobat. Terjemahan utama mengutamakan isi seruan, sementara nuansa tujuan tetap mungkin secara gramatikal dan tidak dijadikan dasar bagi penafsiran teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara istilah 'bertobat' dipertahankan karena tepat secara leksikal dan lazim dalam wacana Alkitab.
