reference: Mark 6:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/003.yaml
  text: Is this not the carpenter[b][a], the son of Mary and brother of James and Joses and Judas and Simon? And are not his sisters here with us? And they took offense at him.
translation:
  language: id
  text: “Bukankah Dia ini tukang kayu, anak Maria, dan saudara laki-laki dari Yakobus, Yoses, Yudas, dan Simon?[a] Bukankah saudara-saudara perempuan-Nya ada di sini bersama kita?” Lalu mereka merasa tersinggung terhadap Dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata-kata Yunani yang diterjemahkan “saudara laki-laki” dan “saudara-saudara perempuan” biasanya berarti saudara laki-laki dan perempuan, tetapi dapat juga dipahami sebagai kerabat dekat atau saudara tiri.
    reason: alternative_reading
  - marker: b
    text: Atau “mereka tersandung oleh Dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκτων
  choice: tukang kayu
  rationale: Istilah ini dapat menunjuk pada perajin atau tukang bangunan secara lebih luas, tetapi dalam konteks ini arti tradisional dan paling mungkin adalah pekerja kayu; 'tukang kayu' jelas dan alami dalam bahasa Indonesia.
- source_word: υἱὸς τῆς Μαρίας
  choice: anak Maria
  rationale: Mempertahankan identifikasi yang mencolok melalui ibu-Nya dalam ucapan penduduk setempat tanpa menambahkan apakah ungkapan itu netral atau bernada merendahkan.
- source_word: ἀδελφὸς / ἀδελφαὶ
  choice: saudara laki-laki / saudara-saudara perempuan
  rationale: Ini adalah arti leksikal yang biasa. Terjemahan utama tidak memutuskan perdebatan apakah mereka saudara kandung, saudara tiri, atau kerabat dekat.
- source_word: Ἰωσῆτος
  choice: Yoses
  rationale: Mentransliterasikan bentuk nama Yunani yang terdapat di sini dan tidak menormalkannya menjadi 'Yusuf'.
- source_word: ὧδε πρὸς ἡμᾶς
  choice: ada di sini bersama kita
  rationale: Ungkapan ini menyatakan keberadaan setempat dan kedekatan sosial dengan para pembicara; pilihan ini alami dalam bahasa Indonesia modern.
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: mereka tersandung karena Dia
  rationale: Mempertahankan metafora verba Yunani dan menunjukkan bahwa Yesus menjadi penyebab penolakan mereka; catatan kaki memberikan padanan idiomatis.
theological_decisions:
- issue: Hubungan keluarga yang dinyatakan oleh ἀδελφός dan ἀδελφαί
  choice: Memakai 'saudara laki-laki' dan 'saudara-saudara perempuan' dalam teks utama tanpa menentukan hubungan biologis yang lebih khusus.
  alternative: Kerabat dekat; atau saudara tiri.
  rationale: Istilah Yunani biasanya berarti saudara laki-laki dan perempuan, tetapi dapat dipahami lebih luas dalam sejumlah konteks dan tradisi. Terjemahan mempertahankan ketegangan tersebut.
- issue: Daya sosial ungkapan 'anak Maria'
  choice: Menerjemahkannya langsung sebagai 'anak Maria'.
  alternative: Menjelaskannya sebagai sebutan netral atau sebagai sindiran yang merendahkan.
  rationale: Teks tidak secara eksplisit menjelaskan nadanya, sehingga terjemahan tidak menambahkan penilaian sosial tertentu.
- issue: Metafora skandal atau sandungan
  choice: Memakai 'tersandung karena Dia' dengan alternatif idiomatis dalam catatan kaki.
  alternative: Mereka merasa tersinggung oleh-Nya; mereka menolak Dia.
  rationale: Pilihan utama mempertahankan citra leksikal dan ambiguitas antara merasa tersinggung, menemukan batu sandungan, dan kemudian menolak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dialog dibuat alami dengan bentuk tanya retoris. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia tanpa mengubah makna sumber.
