  text: And they all ate and were satisfied.
translation:
  language: id
  text: Mereka semua makan sampai kenyang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: makan
  rationale: Bentuk aoris aktif dari ἐσθίω, verba biasa untuk tindakan makan. “Makan” merupakan padanan Indonesia yang lugas; objek tidak perlu ditambahkan karena sudah jelas dari konteks.
- source_word: πάντες
  choice: mereka semua
  rationale: Adjektiva nominatif jamak ini dipakai secara substantival dan menunjuk kepada seluruh orang banyak dalam konteks. “Mereka semua” menyatakan subjek tersirat sekaligus mempertahankan cakupan universalnya.
- source_word: ἐχορτάσθησαν
  choice: sampai kenyang
  rationale: Bentuk pasif dari χορτάζω menyatakan bahwa mereka mendapat makanan hingga puas atau kenyang. Dalam bahasa Indonesia, “makan sampai kenyang” secara alami menyampaikan hasil tersebut tanpa terjemahan pasif yang kaku seperti “dipuaskan”.
- source_word: καὶ ... καὶ
  choice: '[tidak dinyatakan] ... sampai ...'
  rationale: καί pertama menghubungkan ayat ini dengan narasi sebelumnya, tetapi pembukaan dengan “Dan” kurang alami dalam bahasa Indonesia modern. καί kedua mengoordinasikan tindakan makan dengan hasil kenyang; hubungan ini secara idiomatis dinyatakan dengan “sampai” tanpa mengubah urutan makna.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, alami, dan bermartabat. Susunan “makan sampai kenyang” menggabungkan tindakan dan hasil secara idiomatis serta tetap mempertahankan bahwa seluruh orang banyak makan dan memperoleh kecukupan.
