  text: ⸂καὶ ἔλεγεν⸃ αὐτοῖς ὁ Ἰησοῦς ὅτι Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ πατρίδι αὐτοῦ καὶ ἐν τοῖς ⸂συγγενεῦσιν αὐτοῦ⸃ καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/004.yaml
  text: And Jesus was saying to them[c][b][a], “A prophet is not without honor except in his hometown and among his relatives and in his household.”
translation:
  language: id
  text: Lalu Yesus berkata kepada mereka, “Seorang nabi dihormati, kecuali di tempat asalnya[a], di antara sanak saudaranya[b], dan di rumah tangganya[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kampung halamannya” atau “daerah asalnya.” Kata Yunani ini menunjuk tempat asal seseorang; dalam konteks ini, Nazaret.
    reason: lexical_alternative
  - marker: b
    text: Atau “kaum kerabatnya.” Kata Yunani ini menunjuk orang-orang yang memiliki hubungan kekerabatan.
    reason: lexical_alternative
  - marker: c
    text: Atau “rumahnya.” Kata Yunani ini dapat menunjuk bangunan rumah maupun orang-orang dalam rumah atau keluarga itu; “rumah tangga” dipilih agar dapat dibedakan dari sanak saudara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: berkata
  rationale: Imperfek Yunani dapat menggambarkan tindakan tutur yang sedang berlangsung dalam narasi, tetapi dalam bahasa Indonesia bentuk alami untuk memperkenalkan ucapan langsung ialah 'berkata'; aspek tidak perlu dipaksakan menjadi 'sedang berkata'.
- source_word: προφήτης
  choice: nabi
  rationale: Padanan baku dan langsung untuk προφήτης.
- source_word: οὐκ ἔστιν ... ἄτιμος εἰ μὴ
  choice: dihormati di mana-mana, kecuali
  rationale: Mengungkapkan secara alami idiom litotes Yunani 'tidak tanpa kehormatan kecuali', sambil mempertahankan kontras kehormatan dan pengecualian.
- source_word: πατρίδι
  choice: tempat asalnya
  rationale: πατρίς menunjuk tempat asal seseorang; dalam konteks ini Nazaret. 'Tempat asal' lebih luwes daripada 'tanah air' dan tidak membatasi makna hanya pada kota secara leksikal.
- source_word: συγγενεῦσιν
  choice: sanak saudaranya
  rationale: Menunjuk kelompok kerabat atau orang-orang yang memiliki hubungan kekerabatan; ungkapan ini alami dan berbeda dari rumah tangga.
- source_word: οἰκίᾳ
  choice: rumah tangganya
  rationale: οἰκία dapat berarti rumah fisik atau seisi rumah/keluarga. Dalam urutan sosial yang makin menyempit, 'rumah tangga' paling sesuai tanpa menutup alternatif leksikal.
- source_word: καὶ ... καὶ ... καὶ
  choice: di ..., di antara ..., dan di ...
  rationale: Mempertahankan penumpukan tiga lingkup penolakan, dengan koordinasi yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan peribahasa Yesus tentang kehormatan seorang nabi
  choice: Disajikan sebagai pernyataan umum tentang seorang nabi yang dalam konteks diterapkan Yesus kepada diri-Nya, tanpa penjelasan doktrinal tambahan.
  alternative: Memparafrasakannya secara eksplisit sebagai identifikasi Yesus sebagai Mesias yang ditolak atau sebagai ajaran umum mengenai ketidakpercayaan.
  rationale: Teks Yunani menyatakan peribahasa tentang nabi dan konteks menerapkannya kepada Yesus; terjemahan tidak seharusnya menyelesaikan ketegangan teologis dengan tambahan yang tidak dinyatakan.
- issue: Bentuk litotes οὐκ ... ἄτιμος
  choice: Diungkapkan secara positif sebagai 'dihormati di mana-mana, kecuali'.
  alternative: Mempertahankan bentuk harfiah 'tidak tanpa kehormatan, kecuali'.
  rationale: Bentuk positif menyampaikan daya peribahasa secara jelas dan wajar dalam bahasa Indonesia tanpa mengubah lingkup pengecualian atau tema kehormatan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan tiga lingkup dipertahankan, sedangkan litotes Yunani dialihkan menjadi ungkapan positif yang lebih mudah dipahami pembaca umum.
