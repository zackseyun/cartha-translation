  yaml_path: translation/nt/mark/014/052.yaml
  text: But he left the linen cloth behind and fled naked[a][b].
translation:
  language: id
  text: Tetapi ia meninggalkan kain lenan itu dan melarikan diri dalam keadaan telanjang[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sehelai kain lenan” atau “pakaian lenan” untuk “kain lenan” (σινδόνα).
    reason: lexical_alternative
  - marker: b
    text: Kata “telanjang” (γυμνός) dalam beberapa konteks dapat berarti berpakaian tidak lengkap. Namun, dalam konteks ini, artinya yang paling langsung ialah bahwa ia melarikan diri tanpa kain yang dikenakannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Partikel δέ menandai peralihan yang agak kontras dari upaya menangkap orang muda itu kepada tindakannya meloloskan diri.
- source_word: καταλιπὼν
  choice: meninggalkan
  rationale: Partisip aoris καταλείπω menyatakan bahwa ia meninggalkan kain tersebut agar dapat melarikan diri; bentuk ini alami dalam bahasa Indonesia.
- source_word: σινδόνα
  choice: kain linen
  rationale: σινδών menunjuk pada kain linen yang dapat dikenakan atau dililitkan. 'Kain linen' mempertahankan bahannya tanpa menentukan secara berlebihan bentuknya.
- source_word: γυμνὸς
  choice: dengan telanjang
  rationale: γυμνός paling langsung berarti telanjang dalam konteks ini, karena satu-satunya kain yang dikenakannya telah ditinggalkan.
- source_word: ἔφυγεν
  choice: melarikan diri
  rationale: φεύγω menyatakan lari untuk menghindari bahaya atau penangkapan; 'melarikan diri' menyampaikan tindakan dan urgensinya secara wajar.
