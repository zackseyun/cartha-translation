  text: καὶ ἡ παιδίσκη ἰδοῦσα αὐτὸν ⸂ἤρξατο πάλιν⸃ λέγειν τοῖς ⸀παρεστῶσιν ὅτι Οὗτος ἐξ αὐτῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/069.yaml
  text: And the servant girl[a], seeing him, began again to say to those standing nearby, “This man is one of them.”
translation:
  language: id
  text: Ketika melihat Petrus, pelayan perempuan itu mulai berkata lagi kepada orang-orang yang berdiri di dekat situ, “Orang ini salah seorang dari mereka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδίσκη
  choice: pelayan perempuan
  rationale: Menunjuk kepada seorang pelayan perempuan muda. Pilihan ini alami dalam bahasa Indonesia modern dan tidak memastikan status perbudakan yang tidak menjadi fokus ayat ini.
- source_word: ἰδοῦσα αὐτόν
  choice: Ketika melihat Petrus
  rationale: Partisip aoris dinyatakan sebagai anak kalimat waktu yang alami. Nama Petrus dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia tanpa mengubah identitas tokoh dalam konteks.
- source_word: ἤρξατο πάλιν λέγειν
  choice: mulai berkata lagi
  rationale: Mempertahankan baik aspek permulaan tindakan maupun makna πάλιν, dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: τοῖς παρεστῶσιν
  choice: kepada orang-orang yang berdiri di dekat situ
  rationale: Mempertahankan gambaran orang-orang yang hadir atau berdiri di sekitar tempat itu, bukan sekadar memakai istilah umum seperti 'orang-orang yang ada di situ'.
- source_word: Οὗτος
  choice: Orang ini
  rationale: Padanan demonstratif yang langsung dan alami untuk menunjuk Petrus, tanpa menambahkan nada merendahkan.
- source_word: ἐξ αὐτῶν ἐστιν
  choice: salah seorang dari mereka
  rationale: Ungkapan ini secara idiomatis menyatakan bahwa Petrus termasuk dalam kelompok yang dimaksud, sambil tetap dekat dengan bentuk sumber.
theological_decisions: []
