  text: εἷς δέ ⸀τις τῶν παρεστηκότων σπασάμενος τὴν μάχαιραν ἔπαισεν τὸν δοῦλον τοῦ ἀρχιερέως καὶ ἀφεῖλεν αὐτοῦ τὸ ⸀ὠτάριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/047.yaml
  text: But one of those standing nearby drew his sword and struck the high priest’s servant[a], and cut off his ear.
translation:
  language: id
  text: Namun, salah seorang dari mereka yang berdiri di situ menghunus pedangnya, lalu menebas budak imam besar itu sehingga telinganya terputus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelayan imam besar itu”; kata Yunani δοῦλος juga dapat diterjemahkan “pelayan,” tetapi sering menunjuk kepada seorang budak.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις
  choice: Namun, salah seorang
  rationale: Ungkapan ini memperkenalkan satu orang dari kelompok itu tanpa menyebut identitasnya. “Namun” menyampaikan kesinambungan bernuansa kontras dari δέ, sedangkan “salah seorang” mempertahankan ketidakpastian τις secara alami.
- source_word: τῶν παρεστηκότων
  choice: yang berdiri di situ
  rationale: Partisip perfektum παρίστημι menunjuk kepada orang-orang yang sedang berdiri atau berada di tempat kejadian. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan unsur ruang.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: menghunus pedangnya
  rationale: Dalam konteks senjata, σπάομαι berarti menarik atau menghunus. μάχαιρα dapat berarti pedang pendek, belati, atau pisau besar; “pedang” paling jelas dalam konteks ini. Bentuk posesif alami dalam bahasa Indonesia meskipun teks Yunani memakai artikel.
- source_word: ἔπαισεν
  choice: menyerang
  rationale: παίω menyatakan pukulan keras. “Menyerang” sesuai dengan tindakan menggunakan pedang dan tidak menyiratkan bahwa satu-satunya akibatnya sekadar pukulan tumpul.
- source_word: τὸν δοῦλον τοῦ ἀρχιερέως
  choice: budak imam besar itu
  rationale: δοῦλος menyatakan status ketundukan atau kepemilikan yang lebih kuat daripada sekadar pelayan. “Budak” mempertahankan kenyataan sosial tersebut; alternatif yang lebih lunak dicatat dalam catatan kaki. Artikel pada ἀρχιερεύς diterjemahkan secara alami dengan “itu”.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτάριον
  choice: memotong telinganya
  rationale: ἀφαιρέω secara harfiah berarti mengambil atau menyingkirkan, tetapi dalam konteks serangan dengan pedang, “memotong” menyampaikan tindakan dan hasilnya dengan wajar. Bentuk diminutif ὠτάριον tidak perlu diterjemahkan sebagai “telinga kecil,” dan Markus tidak menyebut telinga kanan.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam konteks status sosial
  choice: budak
  alternative: pelayan
  rationale: Hubungan δοῦλος dengan imam besar menyiratkan ketundukan rumah tangga atau kelembagaan. “Budak” menjaga bobot status sosial dalam istilah Yunani tanpa melunakkannya, sedangkan “pelayan” tetap diberikan sebagai alternatif leksikal.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan tindakan dibuat alami dengan “lalu,” sementara identitas penyerang tetap tidak disebutkan sebagaimana dalam teks Markus.
