  terminology: “Pencobaan” secara tepat mempertahankan pilihan utama untuk πειρασμόν, sementara catatan kaki dengan tepat membuka kemungkinan “pengujian” atau “ujian.” “Daging” tepat untuk σάρξ dalam kontras antropologis ini.
