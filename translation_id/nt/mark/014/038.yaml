  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ ⸀ἔλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/038.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: id
  text: Berjaga-jagalah dan berdoalah supaya kalian tidak masuk ke dalam pencobaan[a]. Memang roh itu bersedia, tetapi daging itu lemah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengujian” atau “ujian” untuk kata “pencobaan” (πειρασμόν).
    reason: 'Alternatif leksikal: πειρασμός dapat menunjuk pada godaan untuk berbuat salah maupun keadaan yang menguji.'
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Tetaplah berjaga-jaga
  rationale: Imperatif jamak ini berarti tetap terjaga sekaligus waspada. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kedua nuansa tersebut dalam konteks Getsemani.
- source_word: προσεύχεσθε
  choice: berdoa
  rationale: Imperatif kini jamak menyampaikan seruan untuk terus berdoa; bentuk sederhana ini paling wajar dalam bahasa Indonesia.
- source_word: ἵνα μὴ ἔλθητε εἰς πειρασμόν
  choice: supaya kalian tidak jatuh ke dalam pencobaan
  rationale: ἵνα μή menyatakan tujuan atau pencegahan. 'Jatuh ke dalam' menyampaikan keterlibatan atau keterjerumusan dalam pencobaan secara idiomatis, meskipun verba sumber secara harfiah berarti 'masuk' atau 'datang ke dalam'.
- source_word: πειρασμόν
  choice: pencobaan
  rationale: Kata ini dapat berarti pencobaan, pengujian, atau ujian. Dalam konteks peringatan kepada para murid, 'pencobaan' paling sesuai, sementara keluasan maknanya dipertahankan dalam catatan kaki.
- source_word: τὸ μὲν πνεῦμα πρόθυμον
  choice: Memang roh itu bersedia
  rationale: πνεῦμα paling mungkin menunjuk pada batin atau roh manusia sebagai pusat kehendak. πρόθυμον menyatakan kesiapan atau kemauan; 'bersedia' mempertahankan makna itu tanpa menambahkan objek yang tidak disebutkan.
- source_word: ἡ δὲ σὰρξ ἀσθενής
  choice: tetapi daging itu lemah
  rationale: '''Daging'' mempertahankan kontras antropologis sumber antara kehendak batin dan kelemahan manusia, tanpa mempersempit σάρξ menjadi sekadar tubuh atau menafsirkannya sebagai natur berdosa.'
theological_decisions:
- issue: Acuan πνεῦμα
  choice: roh manusia atau kesediaan batin, ditulis dengan huruf kecil
  alternative: Roh Kudus
  rationale: Kontras langsung dengan 'daging' serta keadaan para murid yang mengantuk lebih mendukung roh manusia sebagai pusat niat. Huruf kecil menghindari penetapan bahwa yang dimaksud pasti Roh Kudus.
- issue: Makna σάρξ
  choice: daging
  alternative: tubuh; natur berdosa
  rationale: Ayat ini menyoroti kelemahan manusia berhadapan dengan kesediaan batin. 'Daging' menjaga ungkapan dan ketegangan teologis teks tanpa memasukkan kategori doktrinal yang lebih sempit.
- issue: Subjek jamak dalam perintah dan klausa tujuan
  choice: kalian
  alternative: kamu; Anda sekalian
  rationale: Bentuk Yunani bersifat jamak dan ditujukan kepada para murid. 'Kalian' menandai jamak secara jelas dalam bahasa Indonesia modern tanpa tingkat formalitas yang tidak diperlukan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Tetaplah berjaga-jaga' menjaga kaitan dengan keadaan para murid yang tertidur serta seruan untuk waspada. Pronomina 'kalian' dipakai untuk memperjelas bentuk jamak Yunani.
