  text: καὶ ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν πόλιν, καὶ ἀπαντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/013.yaml
  text: And he sends two of his disciples and says to them[a], “Go into the city, and a man carrying a jar of water will meet you. Follow him,”
translation:
  language: id
  text: Lalu Ia mengutus dua orang dari antara murid-murid-Nya dan berkata kepada mereka, “Pergilah ke dalam kota. Seorang laki-laki yang membawa sebuah kendi[a] berisi air akan menemui kalian. Ikutilah dia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sebuah bejana tanah liat berisi air.”'
    reason: κεράμιον dapat secara lebih eksplisit menunjuk pada wadah yang terbuat dari tanah liat.
lexical_decisions:
- source_word: ἀποστέλλει
  choice: mengutus
  rationale: Kata ini menyatakan tindakan mengirim dengan suatu tugas. Bahasa Indonesia tidak menandai kala kini secara morfologis, sehingga bentuk naratif ini tetap wajar tanpa mengubahnya menjadi lampau secara eksplisit.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: dua orang dari antara murid-murid-Nya
  rationale: 'Ungkapan ini mempertahankan konstruksi partitif Yunani: kedua orang itu berasal dari kelompok murid Yesus.'
- source_word: λέγει αὐτοῖς
  choice: berkata kepada mereka
  rationale: Padanan langsung dan alami untuk verba ujaran beserta objek tidak langsungnya; bentuk Indonesia tidak perlu menetapkan kala lampau.
- source_word: Ὑπάγετε εἰς τὴν πόλιν
  choice: Pergilah ke dalam kota
  rationale: Bentuk imperatif dipertahankan, sedangkan 'ke dalam' mencerminkan gerak memasuki kota yang dinyatakan oleh εἰς.
- source_word: ἀπαντήσει ὑμῖν
  choice: akan menemui kalian
  rationale: Bentuk futur diterjemahkan secara eksplisit dengan 'akan'; 'kalian' menunjukkan bahwa perintah ditujukan kepada kedua murid.
- source_word: ἄνθρωπος
  choice: seorang laki-laki
  rationale: Dalam konteks ini kata benda maskulin tersebut menunjuk kepada seorang pria tertentu, bukan manusia secara umum.
- source_word: κεράμιον ὕδατος
  choice: sebuah kendi berisi air
  rationale: '''Kendi'' merupakan sebutan Indonesia yang alami bagi wadah air; ''berisi air'' menghindari kemungkinan bahwa ''kendi air'' hanya menyatakan fungsi wadah tersebut.'
- source_word: βαστάζων
  choice: yang membawa
  rationale: Klausa relatif ini menyampaikan tindakan yang sedang dilakukan laki-laki itu secara alami dalam bahasa Indonesia.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: Ikutilah dia
  rationale: Perintah langsung ini mempertahankan daya imperatif aoristus tanpa menambahkan nuansa yang tidak dinyatakan sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia; 'kalian' dipakai untuk memperjelas bentuk jamak Yunani tanpa menjadi terlalu formal.
