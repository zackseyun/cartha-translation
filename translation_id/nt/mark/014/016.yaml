  text: καὶ ἐξῆλθον οἱ ⸀μαθηταὶ καὶ ἦλθον εἰς τὴν πόλιν καὶ εὗρον καθὼς εἶπεν αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/016.yaml
  text: And the disciples went out and came into the city[a], and found it just as he had told them, and they prepared the Passover.
translation:
  language: id
  text: Lalu murid-murid itu berangkat dan masuk ke kota. Mereka mendapati semuanya seperti yang telah dikatakan Yesus kepada mereka, lalu mereka mempersiapkan Paskah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perjamuan Paskah.” Istilah Yunani τὸ πάσχα dapat menunjuk pada Paskah secara umum atau, dalam konteks ini, pada perjamuan yang dipersiapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: berangkat
  rationale: Bentuk aoristus dari ἐξέρχομαι menyatakan bahwa mereka meninggalkan tempat sebelumnya. Dalam konteks perjalanan, “berangkat” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “keluar”.
- source_word: οἱ μαθηταὶ
  choice: murid-murid itu
  rationale: “Murid” merupakan istilah Injil yang baku dan mempertahankan hubungan sebagai pengikut sekaligus orang yang diajar; penentu “itu” menandai kelompok yang sudah disebut dalam konteks.
- source_word: ἦλθον εἰς τὴν πόλιν
  choice: masuk ke kota
  rationale: Frasa ini menyatakan gerak menuju dan memasuki kota. “Masuk ke kota” alami dalam narasi Indonesia dan mempertahankan unsur εἰς.
- source_word: εὗρον καθὼς εἶπεν αὐτοῖς
  choice: mendapati semuanya tepat seperti yang telah dikatakan Yesus kepada mereka
  rationale: Objek εὗρον tersirat, yakni keadaan yang mereka jumpai. “Semuanya” membuat kalimat Indonesia wajar tanpa menentukan satu benda tertentu; nama “Yesus” memperjelas subjek tersirat sesuai konteks, sedangkan “telah dikatakan” menunjukkan bahwa perkataan itu mendahului peristiwa ini.
- source_word: ἡτοίμασαν
  choice: mempersiapkan
  rationale: Padanan langsung dan wajar untuk tindakan menyediakan segala sesuatu yang diperlukan.
- source_word: τὸ πάσχα
  choice: perjamuan Paskah
  rationale: Dalam konteks langsung, para murid sedang menyiapkan apa yang akan dimakan untuk Paskah. “Perjamuan Paskah” menyampaikan rujukan kontekstual dengan jelas, sementara catatan kaki mempertahankan keluasan makna istilah Yunani.
theological_decisions:
- issue: Cakupan makna τὸ πάσχα
  choice: perjamuan Paskah
  alternative: Paskah
  rationale: Istilah Yunani dapat menunjuk pada perayaan Paskah secara luas atau pada perjamuan/kurban Paskah. Karena konteksnya adalah persiapan untuk makan bersama, teks utama memakai “perjamuan Paskah,” tetapi catatan mempertahankan alternatif yang lebih umum.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Koordinasi berulang dalam bahasa Yunani ditata menjadi dua kalimat agar alur narasi alami tanpa menghilangkan urutan tindakan.
