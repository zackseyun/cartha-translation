  text: ἠδύνατο γὰρ τοῦτο ⸂τὸ μύρον⸃ πραθῆναι ἐπάνω ⸂δηναρίων τριακοσίων⸃ καὶ δοθῆναι τοῖς πτωχοῖς· καὶ ἐνεβριμῶντο αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/005.yaml
  text: For this perfume could have been sold for more than three hundred denarii and given to the poor.” And they scolded her[a][b].
translation:
  language: id
  text: “Sebab minyak wangi[a] ini dapat dijual seharga lebih dari tiga ratus dinar dan hasilnya diberikan kepada orang-orang miskin.” Lalu mereka memarahi perempuan itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “minyak harum” atau “salep wangi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menegur perempuan itu dengan keras.” Kata Yunani yang digunakan menyatakan ketidaksenangan yang kuat atau teguran yang tajam.
    reason: lexical_alternative
lexical_decisions:
- source_word: μύρον
  choice: minyak wangi
  rationale: Istilah ini menunjuk pada minyak atau salep beraroma. “Minyak wangi” alami dalam bahasa Indonesia modern dan sesuai dengan bahan harum yang mahal dalam konteks ini.
- source_word: πραθῆναι
  choice: dapat dijual
  rationale: Infinitif pasif ini, bersama ἠδύνατο, menyatakan kemungkinan yang tidak diwujudkan. Bentuk “dapat dijual” menyampaikan makna itu secara ringkas dan alami.
- source_word: ἐπάνω δηναρίων τριακοσίων
  choice: seharga lebih dari tiga ratus dinar
  rationale: ἐπάνω dengan jumlah berkasus genitif menunjukkan nilai yang melampaui jumlah tersebut. “Seharga lebih dari” merupakan ungkapan Indonesia yang jelas, sedangkan “dinar” mempertahankan latar mata uang kuno tanpa mengubahnya menjadi mata uang modern.
- source_word: δοθῆναι τοῖς πτωχοῖς
  choice: hasilnya diberikan kepada orang-orang miskin
  rationale: Secara gramatikal, kata kerja pasif kedua berkoordinasi dengan tindakan menjual; yang secara alami diberikan setelah penjualan ialah hasil penjualannya. “Hasilnya” membuat hubungan yang tersirat itu jelas tanpa mengubah maksud.
- source_word: ἐνεβριμῶντο αὐτῇ
  choice: mereka memarahi perempuan itu
  rationale: Kata kerja ini menyatakan ketidaksenangan kuat yang diarahkan kepadanya, termasuk teguran keras. “Memarahi” mempertahankan daya interpersonal tersebut dalam bahasa Indonesia yang umum.
- source_word: γὰρ
  choice: Sebab
  rationale: Partikel ini memberikan alasan bagi keluhan sebelumnya. “Sebab” mempertahankan hubungan penjelas itu.
- source_word: ἠδύνατο
  choice: dapat
  rationale: Bentuk imperfek δύναμαι di sini menyatakan kemungkinan yang tidak terlaksana; dalam konteks lampau, konstruksi pasif “dapat dijual” menyampaikannya secara wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Orang-orang miskin” dipilih untuk menyatakan kelompok sosial yang dimaksud, dan “perempuan itu” mempertahankan rujukan feminin eksplisit dari αὐτῇ dalam bentuk yang alami.
