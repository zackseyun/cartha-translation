  text: Καὶ ἐσθιόντων αὐτῶν ⸀λαβὼν ἄρτον εὐλογήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς καὶ εἶπεν· ⸀Λάβετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/022.yaml
  text: And as they were eating[a], he took bread, blessed it, broke it, and gave it to them, and said, “Take; this is my body.”
translation:
  language: id
  text: Ketika mereka sedang makan, Yesus mengambil roti, mengucapkan berkat atasnya, memecahkannya, lalu memberikannya kepada mereka dan berkata, “Ambillah; inilah tubuh-Ku.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ini melambangkan tubuh-Ku” atau “ini berarti tubuh-Ku.” Bahasa Yunani secara harfiah berbunyi, “ini adalah tubuh-Ku.”
    reason: Mencatat terjemahan interpretatif yang mungkin tanpa menggantikannya dalam teks utama, serta menjelaskan bunyi harfiah Yunani.
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: ketika mereka sedang makan
  rationale: Konstruksi genitif absolut dengan partisipel kini menunjukkan tindakan yang sedang berlangsung dan bersamaan dengan tindakan utama.
- source_word: λαβὼν ἄρτον
  choice: Yesus mengambil roti
  rationale: Partisipel aoris dialihkan menjadi verba finit agar narasi alami dalam bahasa Indonesia. Subjek 'Yesus' disebut untuk kejelasan, sedangkan ἄρτον diterjemahkan umum sebagai 'roti' tanpa mempersempitnya menjadi satu jenis atau bentuk tertentu.
- source_word: εὐλογήσας
  choice: mengucapkan berkat atasnya
  rationale: Dalam konteks perjamuan, kata ini menunjuk pada pengucapan berkat atas roti. Pilihan ini lebih alami dan lebih jelas daripada 'memberkatinya', tanpa mengubahnya menjadi istilah lain seperti 'mengucap syukur'.
- source_word: ἔκλασεν
  choice: memecah-mecahkannya
  rationale: Kata kerja ini menyatakan pemecahan roti untuk dibagikan. Bentuk ulang idiomatis menandakan bahwa roti dipecah menjadi bagian-bagian, tanpa menambahkan gagasan pembagian yang tidak dinyatakan oleh verba ini sendiri.
- source_word: ἔδωκεν αὐτοῖς
  choice: memberikannya kepada mereka
  rationale: Objek yang tersirat, yaitu roti, dinyatakan dengan pronomina '-nya' agar alami dalam bahasa Indonesia.
- source_word: Λάβετε
  choice: Ambillah
  rationale: Imperatif aoris diterjemahkan sebagai perintah langsung. Sufiks '-lah' memberi nada ajakan/perintah yang wajar dan bermartabat.
- source_word: τοῦτό ἐστιν
  choice: inilah
  rationale: '''Inilah'' merupakan padanan Indonesia yang alami dan langsung bagi pernyataan identifikasi ''ini adalah'', tanpa menafsirkannya sebagai ''melambangkan'' atau ''berarti''.'
- source_word: τὸ σῶμά μου
  choice: tubuh-Ku
  rationale: σῶμα secara langsung berarti 'tubuh'. Huruf kapital pada pronomina mengikuti kebiasaan ejaan Alkitab bahasa Indonesia ketika merujuk kepada Yesus.
theological_decisions:
- issue: Makna perkataan Yesus dalam perjamuan, τοῦτό ἐστιν τὸ σῶμά μου
  choice: inilah tubuh-Ku
  alternative: ini melambangkan tubuh-Ku / ini berarti tubuh-Ku
  rationale: Teks Yunani memakai kopula biasa ἐστιν ('adalah'). Terjemahan utama mempertahankan pernyataan langsung dan ketegangan teologisnya, tanpa memutuskan perdebatan sakramental melalui parafrasa interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, alami, dan bermartabat. Urutan tindakan dalam bahasa Yunani dipertahankan. Penanda catatan kaki ditempatkan tepat setelah perkataan yang menjadi pokok penafsiran.
