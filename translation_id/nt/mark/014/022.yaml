  terminology: '"Tubuh-Ku" tepat untuk σῶμά μου dan kapitalisasi pronomina konsisten dengan kebiasaan Alkitab Indonesia. "Inilah tubuh-Ku" merupakan padanan idiomatis bagi "ini adalah tubuh-Ku" dan tidak memaksakan penafsiran sakramental. Catatan kaki sebaiknya menyatakan alternatif sebagai alternatif terjemahan/penafsiran dan membedakannya dari bunyi harfiah Yunani.'
