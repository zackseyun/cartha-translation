  yaml_path: translation/nt/mark/014/008.yaml
  text: She did what she could[a]; she anointed my body beforehand for burial.
translation:
  language: id
  text: Ia telah melakukan apa yang dapat ia lakukan[a]. Ia telah terlebih dahulu meminyaki tubuh-Ku untuk penguburan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Apa yang dimilikinya, itulah yang dilakukannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἔσχεν ἐποίησεν
  choice: Ia telah melakukan apa yang dapat dilakukannya
  rationale: Ungkapan ini secara harfiah berbunyi kira-kira 'apa yang dimilikinya, dilakukannya', tetapi secara idiomatis menyatakan bahwa perempuan itu melakukan apa yang sanggup ia lakukan. Bentuk Indonesia ini jelas dan alami, sementara alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: προέλαβεν
  choice: telah lebih dahulu
  rationale: Kata kerja ini menyatakan tindakan yang dilakukan sebelumnya atau di muka; frasa ini mempertahankan unsur waktu tanpa menambahkan gagasan gerak seperti 'datang lebih dahulu'.
- source_word: μυρίσαι
  choice: meminyaki
  rationale: Dalam konteks ini kata tersebut berarti mengoleskan minyak wangi atau rempah cair pada tubuh. 'Meminyaki' menyampaikan tindakan konkret dengan bahasa Indonesia yang wajar; kaitannya dengan penguburan diperjelas oleh frasa berikutnya.
- source_word: τὸ σῶμά μου
  choice: tubuh-Ku
  rationale: Padanan langsung yang mempertahankan rujukan orang pertama kepada Yesus.
- source_word: εἰς τὸν ἐνταφιασμόν
  choice: sebagai persiapan untuk penguburan
  rationale: Preposisi εἰς di sini menunjukkan tujuan tindakan, sedangkan ἐνταφιασμός merujuk pada penguburan atau persiapannya. Rumusan ini alami dan membuat hubungan tujuannya jelas.
theological_decisions:
- issue: Subjek perempuan tidak disebutkan secara eksplisit dalam klausa Yunani
  choice: Ia
  alternative: Perempuan itu
  rationale: Bentuk verba orang ketiga tunggal dan konteks langsung mengidentifikasi pelakunya sebagai perempuan tersebut. 'Ia' cukup jelas dalam konteks dan tidak menambahkan penekanan yang tidak ada dalam klausa.
- issue: Hubungan tindakan pengurapan dengan penguburan Yesus
  choice: Ia telah lebih dahulu meminyaki tubuh-Ku sebagai persiapan untuk penguburan
  alternative: Ia mendahului meminyaki tubuh-Ku untuk penguburan
  rationale: Pilihan utama mempertahankan bahwa tindakan itu dilakukan sebelum penguburan dan bertujuan mempersiapkan tubuh, tanpa menyiratkan bahwa perempuan itu tentu memahami seluruh makna tindakan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk 'tubuh-Ku' mengikuti kaidah penulisan pronomina yang merujuk kepada Yesus. Istilah 'penguburan' dipilih karena umum dan jelas.
