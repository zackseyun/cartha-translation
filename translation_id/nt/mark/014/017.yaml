translation:
  language: id
  text: Ketika hari sudah petang, Yesus datang bersama Kedua Belas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersama kedua belas murid itu.” “Kedua Belas” adalah sebutan bagi kelompok inti dua belas murid Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Tidak diterjemahkan secara tersendiri
  rationale: Dalam bahasa Indonesia, hubungan urutan dengan peristiwa sebelumnya sudah jelas tanpa kata penghubung. Mengawali kalimat dengan “Dan” akan terasa kurang alami, sedangkan makna naratifnya tetap terpelihara.
- source_word: ὀψίας γενομένης
  choice: Ketika hari mulai malam
  rationale: Konstruksi genitif absolut menyatakan waktu. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan datangnya waktu malam tanpa kekakuan harfiah.
- source_word: ἔρχεται
  choice: datang
  rationale: Bentuk kini historis Yunani menghidupkan alur cerita. Bahasa Indonesia tidak menandai kala pada verba, sehingga “datang” dapat menyampaikan peristiwa naratif secara alami tanpa harus memaksakan pembedaan kala.
- source_word: μετὰ τῶν δώδεκα
  choice: bersama kedua belas murid itu
  rationale: μετά dengan genitif menyatakan penyertaan. Penambahan “murid” memperjelas acuan yang sudah diketahui dari konteks, sementara “itu” menunjukkan kelompok tertentu tanpa menambahkan gelar kerasulan.
- source_word: subjek tersirat pada ἔρχεται
  choice: Yesus
  rationale: Subjek verba dipahami dari konteks sebagai Yesus. Menyebut namanya menghindari kata ganti tanpa anteseden yang jelas dalam kutipan ayat mandiri.
theological_decisions:
- issue: Acuan frasa “kedua belas”
  choice: Kelompok dua belas murid Yesus, termasuk Yudas pada tahap cerita ini
  alternative: Memperlakukan “Kedua Belas” sebagai sebutan khusus tanpa menambahkan kata “murid”
  rationale: Konteks narasi menunjuk pada kelompok inti dua belas murid. Teks utama memperjelas acuannya tetapi tidak menyebut mereka “rasul”, sehingga tidak menambahkan penafsiran jabatan yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Susunan kalimat dibuat alami bagi pembaca umum, dengan penjelasan minimal atas subjek tersirat dan acuan “kedua belas”. Penanda catatan kaki ditempatkan pada frasa yang dijelaskannya.
