id: MRK.14.9
reference: Mark 14:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀμὴν ⸀δὲ λέγω ὑμῖν, ὅπου ⸀ἐὰν κηρυχθῇ τὸ ⸀εὐαγγέλιον εἰς ὅλον τὸν κόσμον, καὶ ὃ ἐποίησεν αὕτη λαληθήσεται εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/009.yaml
  text: Truly I tell you[a], wherever the good news is proclaimed in the whole world[b], what this woman has done will also be spoken of in memory of her.
translation:
  language: id
  text: Sesungguhnya Aku berkata kepadamu, di mana pun kabar baik[a] diberitakan di seluruh dunia, apa yang telah dilakukan perempuan ini juga akan diceritakan untuk mengenangnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Injil.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “sebagai kenangan tentang dia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Sesungguhnya
  rationale: Mengungkapkan pembukaan perkataan yang khidmat dan berwibawa dalam bahasa Indonesia modern tanpa mempertahankan bentuk pinjaman “amin” yang dapat disalahpahami sebagai penutup doa.
- source_word: δὲ
  choice: '[tersirat dalam alur kalimat]'
  rationale: Partikel penghubung ringan ini tidak perlu dinyatakan secara eksplisit karena kesinambungan wacananya sudah alami dalam bahasa Indonesia.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mempertahankan perkataan langsung dan kata ganti orang kedua jamak yang dalam bahasa Indonesia baku dapat dinyatakan secara kolektif dengan “kepadamu”.
- source_word: ὅπου ἐὰν
  choice: di mana pun
  rationale: Menyampaikan sifat tak tentu dan cakupan umum gabungan kata Yunani tersebut secara ringkas dan alami.
- source_word: κηρυχθῇ
  choice: diberitakan
  rationale: Menunjukkan penyampaian kepada umum dan cocok dengan objek “kabar baik”; tidak membatasinya hanya pada kegiatan berkhotbah.
- source_word: τὸ εὐαγγέλιον
  choice: kabar baik
  rationale: Menerjemahkan makna leksikal istilah Yunani secara langsung dan mudah dipahami; istilah Kristen yang telah mapan, “Injil”, dicantumkan sebagai alternatif.
- source_word: εἰς ὅλον τὸν κόσμον
  choice: di seluruh dunia
  rationale: Ungkapan Indonesia yang alami untuk cakupan universal yang dimaksud oleh frasa Yunani ini.
- source_word: καὶ
  choice: juga
  rationale: 'Menegaskan daya tambah: bersamaan dengan pemberitaan kabar baik, perbuatan perempuan itu pun akan diceritakan.'
- source_word: ὃ ἐποίησεν αὕτη
  choice: apa yang dilakukan perempuan ini
  rationale: Demonstrativa feminin αὕτη menunjuk kepada perempuan dalam konteks terdekat. Penyebutan “perempuan” memperjelas rujukan tanpa menambahkan tafsiran.
- source_word: λαληθήσεται
  choice: akan diceritakan
  rationale: Bentuk pasif masa depan menunjukkan bahwa perbuatannya akan menjadi bagian dari penuturan; “diceritakan” alami ketika objeknya adalah sesuatu yang telah dilakukan.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: untuk mengenang dia
  rationale: Mengungkapkan tujuan memorial atau pengenangan secara jelas, sambil mempertahankan kemungkinan bentuk nominal yang lebih harfiah dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan εὐαγγέλιον dalam perkataan tentang pemberitaan ke seluruh dunia
  choice: kabar baik
  alternative: Injil
  rationale: “Kabar baik” menyampaikan makna leksikal secara transparan bagi pembaca umum, sedangkan “Injil” merupakan istilah Kristen tradisional yang sah dan dipertahankan dalam catatan kaki.
- issue: Pengungkapan rujukan αὕτη
  choice: perempuan ini
  alternative: dia / orang ini
  rationale: Bentuk feminin tunggal menunjuk jelas kepada perempuan dalam konteks. Menyebutkan nomina rujukannya memperjelas bahasa Indonesia tanpa memasukkan identitas atau penafsiran tambahan.
- issue: Nuansa εἰς μνημόσυνον αὐτῆς
  choice: untuk mengenang dia
  alternative: sebagai peringatan akan dia
  rationale: Pilihan utama alami dalam bahasa Indonesia dan mempertahankan gagasan pengenangan. Alternatif tersebut lebih dekat dengan bentuk nominal μνημόσυνον dan menjaga kemungkinan nuansa tindakan memorial.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. “Aku” memakai huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia ketika merujuk kepada Yesus. Penanda catatan kaki ditempatkan langsung sesudah ungkapan yang dijelaskannya.
