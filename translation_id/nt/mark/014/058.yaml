  text: ὅτι Ἡμεῖς ἠκούσαμεν αὐτοῦ λέγοντος ὅτι Ἐγὼ καταλύσω τὸν ναὸν τοῦτον τὸν χειροποίητον καὶ διὰ τριῶν ἡμερῶν ἄλλον ἀχειροποίητον οἰκοδομήσω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/058.yaml
  text: that[a], ‘We heard him saying, “I will destroy this temple made with hands[b], and in three days I will build another not made with hands.”’
translation:
  language: id
  text: bahwa, “Kami mendengar Dia berkata, ‘Aku akan merobohkan Bait Allah ini, buatan tangan manusia, dan dalam waktu tiga hari[a] Aku akan membangun Bait Allah yang lain, yang bukan buatan tangan manusia.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani yang diterjemahkan “dalam waktu tiga hari” juga dapat diterjemahkan “dalam tiga hari”. Ungkapan itu paling wajar menunjukkan rentang waktu berlangsungnya tindakan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi kesaksian atau tuduhan, bukan menyatakan sebab.
- source_word: Ἡμεῖς ἠκούσαμεν αὐτοῦ λέγοντος
  choice: Kami mendengar Dia berkata
  rationale: Mempertahankan penegasan pada ‘kami’ sekaligus mengungkapkan konstruksi partisipial Yunani secara wajar dalam bahasa Indonesia.
- source_word: καταλύσω
  choice: Aku akan merobohkan
  rationale: Dalam konteks bangunan, kata ini menyatakan tindakan membongkar atau menghancurkan; ‘merobohkan’ paling alami dan konkret.
- source_word: τὸν ναὸν τοῦτον
  choice: Bait Allah ini
  rationale: ναός menunjuk pada bait atau tempat suci; ‘Bait Allah’ merupakan padanan Indonesia yang jelas, dan ‘ini’ mempertahankan daya tunjuk τοῦτον.
- source_word: χειροποίητον
  choice: yang dibuat oleh tangan manusia
  rationale: Menjaga gambaran harfiah serta kontras langsung dengan ἀχειροποίητον, sambil memperjelas bahwa yang dimaksud ialah tangan manusia.
- source_word: διὰ τριῶν ἡμερῶν
  choice: dalam waktu tiga hari
  rationale: διά dengan genitif dalam ungkapan waktu menyatakan rentang waktu yang dilalui; padanan ini mempertahankan cakupan waktu tanpa memaksakan arti ‘setelah tiga hari’.
- source_word: ἄλλον ἀχειροποίητον
  choice: yang lain, yang tidak dibuat oleh tangan manusia
  rationale: Mempertahankan gagasan tentang bait lain dan kesejajaran retoris antara χειροποίητον dan ἀχειροποίητον.
- source_word: οἰκοδομήσω
  choice: Aku akan membangun
  rationale: Kata Yunani berarti ‘membangun’, bukan secara khusus ‘membangun kembali’.
theological_decisions:
- issue: Status ucapan sebagai bagian dari kesaksian yang bermusuhan
  choice: Menyajikannya sebagai kutipan dalam laporan para saksi tanpa penjelasan tambahan
  alternative: Menambahkan bahwa para saksi diduga memutarbalikkan perkataan Yesus
  rationale: Ayat ini melaporkan klaim para saksi. Terjemahan tidak semestinya memasukkan harmonisasi atau penilaian yang tidak dinyatakan dalam ayat.
- issue: Makna teologis kontras χειροποίητον dan ἀχειροποίητον
  choice: Mempertahankan ‘dibuat oleh tangan manusia’ dan ‘tidak dibuat oleh tangan manusia’
  alternative: Menafsirkannya sebagai ‘buatan manusia’ dan ‘buatan Allah’
  rationale: Kontras tersebut mungkin mengandung resonansi teologis, tetapi teks tidak secara eksplisit menyebut pembuat bait yang kedua; formulasi yang sejajar menjaga ketegangan dan ambiguitas itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Bentuk ‘Dia’ dan ‘Aku’ mengikuti kebiasaan ejaan hormat dalam teks Alkitab Indonesia. Kontras ‘dibuat oleh tangan manusia’ dan ‘tidak dibuat oleh tangan manusia’ sengaja dipertahankan secara penuh.
