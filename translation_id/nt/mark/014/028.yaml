  text: ἀλλὰ μετὰ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/028.yaml
  text: But after I am raised[a], I will go ahead of you into Galilee.
translation:
  language: id
  text: Tetapi, setelah Aku dibangkitkan[a], Aku akan pergi mendahului kalian ke Galilea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesudah Aku dibangkitkan.” Bahasa Yunani menggunakan infinitif pasif dari kata kerja “membangkitkan”, suatu ungkapan yang lazim untuk kebangkitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan dengan nubuat sebelumnya tentang tercerai-berainya para murid; alami dan ringkas dalam bahasa Indonesia.
- source_word: μετὰ τὸ ἐγερθῆναί με
  choice: setelah Aku dibangkitkan
  rationale: Konstruksi μετά dengan infinitif berartikel menyatakan urutan waktu, sedangkan bentuk pasif ἐγερθῆναί dipertahankan.
- source_word: προάξω
  choice: Aku akan mendahului
  rationale: Menyampaikan tindakan pergi lebih dahulu menuju tempat tujuan; lebih alami daripada ungkapan harfiah yang panjang.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Menunjukkan dengan jelas bahwa kata ganti orang kedua ini berbentuk jamak.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ke Galilea
  rationale: Dalam bahasa Indonesia, 'ke' merupakan ungkapan gerak menuju tempat yang paling alami dan cukup mewakili εἰς.
theological_decisions:
- issue: Bentuk pasif ungkapan kebangkitan ἐγερθῆναί με
  choice: setelah Aku dibangkitkan
  alternative: setelah Aku bangkit
  rationale: Bentuk pasif Yunani dipertahankan dan tidak diubah menjadi bentuk aktif/intransitif, sehingga ketegangan serta nuansa ungkapan kebangkitan dalam sumber tetap terjaga.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Huruf kapital pada Aku mengikuti kebiasaan penerjemahan Indonesia untuk rujukan kepada Yesus; 'kalian' memperjelas bentuk jamak tanpa terdengar kaku.
