base_translation:
  language: en
  yaml_path: translation/nt/mark/014/004.yaml
  text: 'But some were indignant among themselves: “Why has this waste of the perfume happened?”[a][b]'
translation:
  language: id
  text: 'Namun, beberapa orang merasa geram di antara mereka sendiri[a]: “Untuk apa minyak wangi ini diboroskan?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada diri mereka sendiri” atau “dalam hati mereka sendiri.” Frasa Yunani ini dapat menunjuk pada keluhan di antara anggota kelompok itu atau pada reaksi batin mereka sendiri.
    reason: lexical_alternative
  - marker: b
    text: Atau “minyak harum” atau “salep wangi.” Kata Yunani μύρον mengacu pada minyak atau salep beraroma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Namun, ... merasa
  rationale: δέ menandai peralihan sekaligus pertentangan ringan antara tindakan perempuan itu dan reaksi beberapa orang; “Namun” menyatakannya secara alami.
- source_word: τινες
  choice: beberapa orang
  rationale: Pronomina jamak tak tentu ini tidak menyebut identitas mereka; “beberapa orang” mempertahankan ketidakspesifikan tersebut.
- source_word: ἀγανακτοῦντες
  choice: merasa geram
  rationale: Partisipel ini menyatakan ketidaksenangan kuat yang bernada keberatan moral; “merasa geram” alami dalam bahasa Indonesia dan lebih kuat daripada sekadar “kesal”.
- source_word: πρὸς ἑαυτούς
  choice: berkata satu sama lain
  rationale: Dalam konteks keluhan yang langsung dikutip, frasa ini paling wajar dipahami sebagai reaksi yang mereka ungkapkan di antara kelompok mereka. Catatan kaki mempertahankan kemungkinan bahwa reaksi itu berlangsung dalam batin masing-masing.
- source_word: Εἰς τί
  choice: Mengapa
  rationale: Ungkapan idiomatis ini menanyakan tujuan atau alasan; “Mengapa” merupakan padanan Indonesia yang paling alami.
- source_word: ἡ ἀπώλεια αὕτη
  choice: ini dibuang-buang
  rationale: ἀπώλεια di sini menunjuk pada tindakan yang oleh para pengkritik dianggap sebagai pemborosan atau penyia-nyiaan. Bentuk verbal “dibuang-buang” menghasilkan pertanyaan Indonesia yang alami.
- source_word: τοῦ μύρου
  choice: minyak wangi
  rationale: μύρον adalah minyak atau salep beraroma. “Minyak wangi” jelas bagi pembaca modern dan sesuai dengan bahan cair yang dicurahkan dalam konteks ini.
- source_word: γέγονεν
  choice: dibuang-buang
  rationale: Perfek γίνομαι menyajikan pemborosan yang telah terjadi dengan akibat yang masih nyata. Dalam bahasa Indonesia, makna peristiwanya terserap secara alami ke dalam konstruksi pasif pertanyaan tersebut.
