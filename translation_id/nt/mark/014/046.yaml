  text: Then they laid hands on him and seized him[a][b].
translation:
  language: id
  text: Lalu mereka memegang Dia[a] dan menangkap-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menaruh tangan pada Dia.” Ungkapan Yunani ini berarti memegang seseorang, sering kali untuk menangkapnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Lalu mereka
  rationale: οἱ dipakai secara substantival, sedangkan δέ menandai perkembangan ringan dalam alur cerita. “Lalu mereka” alami dalam narasi Indonesia tanpa memberi tekanan pertentangan yang berlebihan.
- source_word: ἐπέβαλαν τὰς χεῖρας αὐτῷ
  choice: menangkap
  rationale: Ungkapan ini secara harfiah berarti mengenakan atau menaruh tangan pada seseorang, tetapi dalam konteks bermakna menangkap dengan maksud menahannya. “Menangkap” menyampaikan fungsi idiom itu secara wajar.
- source_word: ἐκράτησαν αὐτόν
  choice: menahan Dia
  rationale: κρατέω di sini berarti memegang kuat-kuat atau menguasai seseorang. “Menahan” mempertahankan unsur penguasaan fisik setelah tindakan menangkap tanpa mengulang kata yang sama.
theological_decisions: []
