  source_fidelity: Draf menyampaikan konteks penangkapan, tetapi urutan dan pembedaan dua verba Yunani kurang terjaga. ἐπέβαλαν τὰς χεῖρας αὐτῷ adalah tindakan memegang/menaruh tangan pada Dia, kemudian ἐκράτησαν αὐτόν adalah tindakan menangkap atau menguasai Dia. “Menangkap dan menahan” membalik perkembangan itu dan membuat kedua tindakan terdengar sebagai padanan yang berlebihan.
  naturalness: “Lalu mereka memegang Dia dan menangkap-Nya” adalah bahasa Indonesia modern yang jelas dan cukup alami dalam narasi. Pengulangan konseptualnya mencerminkan dua verba berurutan dalam teks Yunani tanpa memakai istilah gerejawi “menumpangkan tangan,” yang dapat disalahpahami.
  terminology: “Memegang” sesuai untuk tindakan awal secara fisik; “menangkap-Nya” sesuai untuk κρατέω dalam konteks penahanan paksa. Kapitalisasi “Dia/-Nya” dipertahankan sesuai gaya draf.
