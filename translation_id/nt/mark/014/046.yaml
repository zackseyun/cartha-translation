    rationale: Catatan menjelaskan dua tindakan sebagai “menaruh tangan” dan “memegang erat-erat”, sedangkan teks utama memakai “menangkap dan menahan”. Setelah revisi, catatan perlu diarahkan khusus kepada idiom tindakan pertama.
