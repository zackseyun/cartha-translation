  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Terjemahan menghindari ungkapan “menumpangkan tangan,” yang dalam pemakaian gerejawi Indonesia mudah dipahami sebagai tindakan pemberkatan, bukan penangkapan dengan kekerasan.
