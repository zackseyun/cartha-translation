id: MRK.14.36
reference: Mark 14:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Αββα ὁ πατήρ, πάντα δυνατά σοι· παρένεγκε τὸ ποτήριον ⸂τοῦτο ἀπ’ ἐμοῦ⸃· ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/036.yaml
  text: And he was saying[a], “Abba, Father, all things are possible for you. Take this cup away from me. Yet not what I will[c][b], but what you will.”
translation:
  language: id
  text: Ia terus berkata[a], “Abba[b], Bapa, segala sesuatu mungkin bagi-Mu. Jauhkanlah cawan ini[c] dari-Ku. Namun, bukan apa yang Aku kehendaki, melainkan apa yang Engkau kehendaki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Ia berkata.” Bentuk imperfek Yunani dapat menunjukkan perkataan yang berlangsung atau diulangi: “Ia terus berkata.”'
    reason: lexical_alternative
  - marker: b
    text: “Abba” adalah bentuk sapaan bahasa Aram untuk ayah atau bapa; di sini bentuk itu dipertahankan berdampingan dengan kata Yunani “Bapa”.
    reason: cultural_note
  - marker: c
    text: “Cawan” adalah metafora alkitabiah bagi penderitaan yang ditetapkan untuk-Nya; bandingkan Markus 10:38.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ia terus berkata
  rationale: Bentuk imperfek dapat menunjukkan ujaran yang berlangsung atau diulangi. “Terus berkata” mempertahankan aspek itu dalam bahasa Indonesia yang wajar; kemungkinan terjemahan sederhana dicatat dalam catatan kaki.
- source_word: Αββα ὁ πατήρ
  choice: Abba, Bapa
  rationale: “Abba” dipertahankan sebagai sapaan bahasa Aram, sedangkan unsur Yunani berikutnya diterjemahkan sebagai sapaan “Bapa”. Tidak ditambahkan kata “-Ku” karena unsur kepemilikan tidak dinyatakan secara eksplisit.
- source_word: πάντα δυνατά σοι
  choice: segala sesuatu mungkin bagi-Mu
  rationale: Ungkapan ini mempertahankan cakupan menyeluruh πάντα dan menyampaikan konstruksi dengan datif secara alami dalam bahasa Indonesia.
- source_word: παρένεγκε
  choice: Jauhkanlah
  rationale: Imperatif aoris παραφέρω dalam konteks ini merupakan permohonan agar cawan itu disingkirkan dari Yesus. “Jauhkanlah ... dari-Ku” jelas, alami, dan sesuai dengan konteks doa.
- source_word: τὸ ποτήριον τοῦτο
  choice: cawan ini
  rationale: Metafora “cawan” dipertahankan karena memiliki bobot alkitabiah dan menunjuk pada penderitaan yang akan dihadapi Yesus tanpa menafsirkan gambaran itu secara berlebihan di dalam teks utama.
- source_word: ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ
  choice: Namun, bukan apa yang Aku kehendaki, melainkan apa yang Engkau kehendaki
  rationale: Kata kerja yang tersirat pada klausa kedua diulang agar jelas dalam bahasa Indonesia. “Kehendaki” mempertahankan bobot θέλω dan pertentangan antara kehendak Yesus dan kehendak Bapa tanpa menghapus ketegangannya.
theological_decisions:
- issue: Sapaan Yesus kepada Allah dalam bentuk Aram dan Yunani
  choice: Abba, Bapa
  alternative: Abba, Bapa-Ku
  rationale: Teks sumber mempertahankan sapaan Aram sekaligus padanan atau penjelasan Yunaninya. Keduanya dipertahankan tanpa menambahkan bentuk kepemilikan yang tidak eksplisit.
- issue: Daya metaforis “cawan”
  choice: cawan ini
  alternative: penderitaan ini
  rationale: Metafora sumber dipertahankan agar kaitan alkitabiah dan ketegangan teologisnya tetap terbuka; maknanya dijelaskan secara ringkas dalam catatan kaki, bukan dimasukkan sebagai tafsiran ke dalam teks.
- issue: Pertentangan antara kehendak Yesus dan kehendak Bapa
  choice: bukan apa yang Aku kehendaki, melainkan apa yang Engkau kehendaki
  alternative: bukan kehendak-Ku, melainkan kehendak-Mu
  rationale: Susunan relatif “apa yang” lebih dekat dengan τί pada kedua klausa dan mempertahankan paralelisme serta ketegangan yang dinyatakan teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Bentuk sapaan dan pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Metafora sumber dan paralelisme doa dipertahankan.
