  text: καὶ ἰδοῦσα τὸν Πέτρον θερμαινόμενον ἐμβλέψασα αὐτῷ λέγει· Καὶ σὺ μετὰ τοῦ Ναζαρηνοῦ ⸂ἦσθα τοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/067.yaml
  text: And seeing Peter warming himself, she looked at him and says, “You also were with Jesus the Nazarene.”
translation:
  language: id
  text: Ketika melihat Petrus sedang menghangatkan diri, ia menatapnya dan berkata, “Kamu juga bersama Yesus, orang Nazaret itu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψασα αὐτῷ
  choice: ia menatapnya
  rationale: Mengungkapkan pandangan yang terarah dan saksama, bukan sekadar melihat.
- source_word: λέγει
  choice: berkata
  rationale: Kala kini historis Yunani dinaturalkan menjadi bentuk lampau dalam narasi bahasa Indonesia; daya hidup adegan tetap terpelihara oleh konteks.
- source_word: τοῦ Ναζαρηνοῦ ... τοῦ Ἰησοῦ
  choice: Yesus, orang Nazaret itu
  rationale: Menyampaikan identifikasi Yesus sebagai orang dari Nazaret secara alami, sekaligus mempertahankan nuansa penunjukan tertentu dari artikel Yunani.
- source_word: μετὰ
  choice: bersama
  rationale: Padanan langsung yang mempertahankan tuduhan bahwa Petrus termasuk dalam lingkungan atau rombongan Yesus.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Partisipel Yunani disusun sebagai anak kalimat waktu agar alami. Pronomina “ia” merujuk kepada pelayan perempuan dalam konteks ayat sebelumnya, sedangkan “kamu” sesuai dengan sapaan tunggal langsung.
