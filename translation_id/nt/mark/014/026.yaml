  text: Καὶ ὑμνήσαντες ἐξῆλθον εἰς τὸ Ὄρος τῶν Ἐλαιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/026.yaml
  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: id
  text: Sesudah menyanyikan nyanyian pujian[a], mereka pergi ke Bukit Zaitun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “setelah menyanyi.” Bentuk partisip dalam bahasa Yunani menunjukkan bahwa tindakan ini terjadi sebelum mereka pergi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Sesudah
  rationale: Dalam bahasa Indonesia, hubungan urutan yang melekat pada partisip aoristis berikutnya dapat diungkapkan secara alami dengan 'Sesudah'; koordinasi naratif tetap terjaga tanpa perlu menerjemahkan Καὶ secara terpisah sebagai 'Dan'.
- source_word: ὑμνήσαντες
  choice: menyanyikan nyanyian pujian
  rationale: Partisip aoristis aktif dari ὑμνέω menunjuk pada tindakan menyanyi untuk memuji; frasa ini alami dalam bahasa Indonesia dan tidak menentukan jenis atau jumlah lagu secara berlebihan.
- source_word: ἐξῆλθον
  choice: mereka pergi
  rationale: Dalam konteks perpindahan menuju tempat tujuan, 'pergi' menyampaikan tindakan utama secara wajar. Unsur harfiah 'keluar' tidak perlu dinyatakan karena tempat asal tidak disebutkan dalam ayat ini.
- source_word: εἰς
  choice: ke
  rationale: Preposisi tujuan εἰς paling alami diterjemahkan 'ke' sebelum nama tempat.
- source_word: τὸ Ὄρος τῶν Ἐλαιῶν
  choice: Bukit Zaitun
  rationale: Ini adalah sebutan geografis yang mapan dalam bahasa Indonesia; 'bukit' sesuai dengan penggunaan ὄρος bagi lokasi tersebut, sedangkan bentuk tunggal kolektif 'Zaitun' alami sebagai nama tempat.
