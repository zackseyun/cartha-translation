  yaml_path: translation/nt/mark/014/039.yaml
  text: And again he went away and prayed[b][a], saying the same words.
translation:
  language: id
  text: Ia pergi lagi dan berdoa dengan mengucapkan hal yang sama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perkataan yang sama”; dapat juga diterjemahkan “ucapan yang sama.” Kata Yunani λόγος di sini menunjuk pada isi doa-Nya yang diulangi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: lagi
  rationale: Menandai pengulangan tindakan secara ringkas dan alami dalam bahasa Indonesia.
- source_word: ἀπελθὼν
  choice: Ia pergi
  rationale: Partisip aoris ini menunjukkan tindakan pergi yang mendahului doa; klausa berurutan lebih alami dalam bahasa Indonesia.
- source_word: προσηύξατο
  choice: berdoa
  rationale: Padanan baku dan jelas bagi tindakan berdoa; bentuk medialnya tidak perlu dinyatakan secara khusus.
- source_word: τὸν αὐτὸν λόγον
  choice: hal yang sama
  rationale: Dalam konteks ini λόγος menunjuk pada isi doa yang diulangi, bukan satu kata saja. Pilihan ini alami sekaligus mempertahankan kemungkinan bahwa yang dimaksud ialah perkataan atau isi yang sama.
- source_word: εἰπών
  choice: dengan mengucapkan
  rationale: Partisip ini menerangkan cara atau isi doa. Bentuk ini mempertahankan unsur 'mengatakan' tanpa menghasilkan susunan yang janggal.
theological_decisions: []
