id: MRK.14.11
reference: Mark 14:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐχάρησαν καὶ ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι. καὶ ἐζήτει πῶς ⸂αὐτὸν εὐκαίρως παραδοῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/011.yaml
  text: When they heard it[a], they rejoiced and promised to give him money[b]. And he began seeking how he might betray him at an opportune time.
translation:
  language: id
  text: Ketika mendengar hal itu, mereka bersukacita dan berjanji akan memberikan uang[a] kepadanya. Lalu ia mulai mencari cara untuk mengkhianati[b] Dia pada kesempatan yang tepat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perak”. Istilah Yunani ini dapat berarti logam perak secara harfiah atau uang secara umum.
    reason: lexical_alternative
  - marker: b
    text: Atau “menyerahkan”. Kata kerja Yunani ini dapat berarti menyerahkan seseorang kepada pihak lain; dalam konteks tindakan Yudas, “mengkhianati” menonjolkan sifat berkhianat dari tindakan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀκούσαντες
  choice: Ketika mendengar hal itu, mereka
  rationale: Partisipel berartikel dengan δέ memperkenalkan tanggapan para imam kepala. Frasa “hal itu” dilengkapi secara wajar dari konteks agar kalimat alami dalam bahasa Indonesia.
- source_word: ἐχάρησαν
  choice: bersukacita
  rationale: Kata ini menyatakan kegembiraan mereka dan mempertahankan daya verbal serta bobot moral dari reaksi tersebut.
- source_word: ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι
  choice: berjanji akan memberikan uang kepadanya
  rationale: ἐπαγγέλλομαι berarti berjanji atau berikrar, sedangkan ἀργύριον dalam konteks ini secara idiomatis berarti uang; Markus tidak menyebut jumlah atau jenis koin.
- source_word: ἐζήτει
  choice: ia mulai mencari
  rationale: Bentuk imperfek menunjukkan tindakan yang mulai berlangsung dan berlanjut setelah tercapainya kesepakatan.
- source_word: πῶς
  choice: cara
  rationale: πῶς menyatakan cara atau sarana pelaksanaan tindakan; konstruksi “mencari cara untuk” alami dalam bahasa Indonesia.
- source_word: εὐκαίρως
  choice: pada kesempatan yang tepat
  rationale: Adverbia ini menunjuk pada kesempatan yang sesuai atau menguntungkan, tanpa menambahkan keadaan yang tidak dinyatakan dalam ayat.
- source_word: παραδοῖ
  choice: mengkhianati
  rationale: παραδίδωμι secara harfiah dapat berarti menyerahkan, tetapi dalam konteks tindakan Yudas kata “mengkhianati” menyampaikan sifat berkhianat dari penyerahan itu. Makna yang lebih harfiah dicantumkan dalam catatan kaki.
theological_decisions:
- issue: Pemaknaan παραδίδωμι dalam tindakan Yudas
  choice: mengkhianati
  alternative: menyerahkan
  rationale: Konteks langsung menggambarkan kerja sama Yudas yang berkhianat dengan para lawan Yesus. Pilihan ini menyampaikan daya kontekstual tersebut tanpa menghapus arti dasar “menyerahkan”, yang dipertahankan sebagai alternatif dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan bermartabat. Pronomina “Dia” dikapitalisasi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia untuk merujuk kepada Yesus; kapitalisasi ini tidak terdapat dalam naskah Yunani.
