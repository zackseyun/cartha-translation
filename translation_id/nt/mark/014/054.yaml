  source_fidelity: 'Terjemahan setia pada unsur-unsur utama Yunani: Petrus mengikuti dari jauh hingga masuk ke halaman kediaman imam besar; ia duduk bersama para petugas dan menghangatkan diri dekat api. “Sampai masuk ke” menangkap penekanan ἕως ἔσω εἰς tanpa menyatakan bahwa Petrus masuk ke dalam bangunan. “Di dekat api” adalah penafsiran kontekstual yang wajar atas πρὸς τὸ φῶς, dan alternatif literalnya dicatat.'
