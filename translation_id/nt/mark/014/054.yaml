id: MRK.14.54
reference: Mark 14:54
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ἀπὸ μακρόθεν ἠκολούθησεν αὐτῷ ἕως ἔσω εἰς τὴν αὐλὴν τοῦ ἀρχιερέως καὶ ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν καὶ θερμαινόμενος πρὸς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/054.yaml
  text: And Peter followed him from a distance[a], as far as inside the courtyard of the high priest. He was sitting with the officers and warming himself by the fire.
translation:
  language: id
  text: Petrus mengikuti Dia dari jauh sampai masuk ke halaman rumah imam besar. Di sana ia duduk bersama para petugas dan menghangatkan diri di dekat api.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di dekat cahaya.” Secara harfiah, bahasa Yunani berbunyi “dekat/ke arah cahaya,” yang kemungkinan menunjuk pada cahaya api di halaman itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν
  choice: dari jauh
  rationale: Ungkapan Indonesia yang alami dan mempertahankan jarak fisik dalam alur cerita.
- source_word: ἠκολούθησεν αὐτῷ
  choice: mengikuti Dia
  rationale: Aoristus naratif diterjemahkan dengan bentuk lampau kontekstual bahasa Indonesia; pronomina merujuk kepada Yesus.
- source_word: ἕως ἔσω εἰς
  choice: sampai masuk ke
  rationale: Menyampaikan batas sekaligus gerak menuju bagian dalam, tanpa menyiratkan bahwa Petrus masuk ke dalam bangunan rumah.
- source_word: αὐλήν
  choice: halaman rumah
  rationale: Dalam konteks ini αὐλή adalah halaman tertutup pada kediaman imam besar; penambahan 'rumah' memperjelas lokasinya secara alami.
- source_word: ἀρχιερέως
  choice: imam besar
  rationale: Padanan baku dan tepat dalam konteks kisah sengsara.
- source_word: ἦν συγκαθήμενος
  choice: ia duduk bersama
  rationale: Menyampaikan keadaan yang sedang berlangsung, sedangkan unsur σύν dipertahankan melalui 'bersama'.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: bersama para petugas
  rationale: ὑπηρέται di sini menunjuk para pelayan atau petugas resmi yang menjalankan fungsi kelembagaan, bukan semata-mata hamba rumah tangga.
- source_word: θερμαινόμενος
  choice: menghangatkan diri
  rationale: Padanan idiomatis yang tepat bagi tindakan Petrus.
- source_word: πρὸς τὸ φῶς
  choice: di dekat api
  rationale: Secara harfiah berarti 'dekat/ke arah cahaya', tetapi konteks menghangatkan diri menunjukkan api sebagai sumber cahaya; alternatif literal dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Dia' dikapitalisasi sesuai kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Yesus. Struktur dibagi menjadi dua kalimat agar jelas dan alami, sambil mempertahankan kesinambungan adegan.
