  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς καὶ ὅλον τὸ συνέδριον ἐζήτουν κατὰ τοῦ Ἰησοῦ μαρτυρίαν εἰς τὸ θανατῶσαι αὐτόν, καὶ οὐχ ηὕρισκον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/055.yaml
  text: The chief priests and the whole council were seeking testimony against Jesus in order to put him to death, and they were not finding any.
translation:
  language: id
  text: Para imam kepala dan seluruh dewan[a] terus mencari kesaksian yang memberatkan Yesus untuk menghukum mati Dia, tetapi mereka tidak menemukan satu pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih khusus, “seluruh Sanhedrin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀρχιερεῖς
  choice: Para imam kepala
  rationale: ἀρχιερεῖς menunjuk pada para pemimpin keimaman di Yerusalem. Partikel δέ berfungsi ringan dalam alur narasi dan tidak perlu diterjemahkan dengan kata penghubung tersendiri dalam bahasa Indonesia.
- source_word: ὅλον τὸ συνέδριον
  choice: seluruh dewan
  rationale: συνέδριον berarti dewan penguasa atau peradilan. 'Seluruh dewan' menerjemahkan maknanya dan mempertahankan cakupan ὅλον, sedangkan nama historis 'Sanhedrin' dicantumkan dalam catatan kaki.
- source_word: ἐζήτουν
  choice: terus mencari
  rationale: Bentuk imperfek menggambarkan usaha yang sedang berlangsung atau berulang; 'terus mencari' menyampaikan aspek duratif itu secara wajar.
- source_word: κατὰ τοῦ Ἰησοῦ μαρτυρίαν
  choice: kesaksian yang memberatkan Yesus
  rationale: κατά dengan genitif menyatakan arah yang bermusuhan, dan μαρτυρία merujuk pada isi kesaksian dalam konteks hukum. Ungkapan ini alami dalam bahasa Indonesia tanpa mengubah kesaksian menjadi sekadar bukti material.
- source_word: εἰς τὸ θανατῶσαι αὐτόν
  choice: untuk menghukum mati Dia
  rationale: Konstruksi εἰς dengan infinitif artikular menyatakan tujuan. 'Menghukum mati' mempertahankan nuansa tindakan yudisial dari θανατόω dalam konteks persidangan.
- source_word: καὶ οὐχ ηὕρισκον
  choice: tetapi mereka tidak menemukan satu pun
  rationale: Walaupun καί secara dasar berarti 'dan', hubungan antarklausa secara alami bersifat kontras dalam bahasa Indonesia. Bentuk imperfek tetap dipahami dalam rangkaian dengan 'terus mencari', dan 'satu pun' merujuk kembali pada kesaksian.
theological_decisions:
- issue: Identifikasi συνέδριον
  choice: seluruh dewan
  alternative: seluruh Sanhedrin
  rationale: Teks Yunani menyebut lembaga dewan tersebut tanpa mengharuskan transliterasi nama historisnya. Terjemahan umum dipakai dalam teks utama, sementara identifikasi yang lebih khusus dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan konteks hukum serta tindakan yang berlangsung, tetapi menghindari istilah teknis yang tidak langsung dipahami pembaca umum.
