  text: Καὶ ὄντος τοῦ Πέτρου ⸂κάτω ἐν τῇ αὐλῇ⸃ ἔρχεται μία τῶν παιδισκῶν τοῦ ἀρχιερέως,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/066.yaml
  text: And while Peter was below in the courtyard[a], one of the high priest’s servant girls came,
translation:
  language: id
  text: Sementara Petrus berada di bawah di halaman, datanglah salah seorang pelayan perempuan imam besar[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “salah seorang budak perempuan imam besar.” Kata Yunani παιδίσκη dapat berarti pelayan perempuan atau budak perempuan; status hukum perempuan ini tidak dijelaskan secara pasti dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος τοῦ Πέτρου
  choice: Ketika Petrus berada
  rationale: Genitivus absolutus dengan partisipel kini berfungsi sebagai keterangan waktu dan latar; bentuk ini alami dalam bahasa Indonesia serta mempertahankan keadaan yang sedang berlangsung.
- source_word: κάτω
  choice: di bawah
  rationale: Menunjukkan posisi yang lebih rendah, kemungkinan relatif terhadap ruang tempat pemeriksaan berlangsung; ungkapan ini mempertahankan keterangan ruang tanpa menambah rincian yang tidak dinyatakan.
- source_word: ἐν τῇ αὐλῇ
  choice: di halaman dalam
  rationale: Dalam konteks rumah imam besar, αὐλή menunjuk pada pelataran terbuka yang berada di dalam kompleks bangunan. 'Halaman dalam' lebih jelas daripada sekadar 'halaman' dan tidak memperluasnya menjadi istana.
- source_word: ἔρχεται
  choice: datanglah
  rationale: Walaupun bentuk Yunani adalah kala kini historis, bentuk lampau naratif tidak wajib ditandai secara morfologis dalam bahasa Indonesia. 'Datanglah' menjaga gerak narasi dan urutan peristiwa secara wajar.
- source_word: μία τῶν παιδισκῶν
  choice: seorang dari antara hamba perempuan
  rationale: παιδίσκη dapat berarti pelayan perempuan atau budak perempuan. 'Hamba perempuan' mempertahankan status rumah tangga yang rendah sekaligus membiarkan ketepatan status hukumnya tetap terbuka.
- source_word: τοῦ ἀρχιερέως
  choice: imam besar
  rationale: Genitif ini menyatakan hubungan dengan rumah tangga imam besar. Susunan 'hamba perempuan imam besar' alami dan ringkas dalam bahasa Indonesia.
