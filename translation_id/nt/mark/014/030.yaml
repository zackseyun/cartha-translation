  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι σὺ σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃ πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι τρίς ⸂με ἀπαρνήσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/030.yaml
  text: And Jesus says to him[a], “Truly I tell you, today, this very night, before a rooster crows twice, you will deny me three times.”
translation:
  language: id
  text: 'Lalu Yesus berkata kepadanya, “Sesungguhnya Aku berkata kepadamu: hari ini, malam ini juga, sebelum ayam berkokok dua kali, engkau akan menyangkal Aku tiga kali.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis khas Markus diterjemahkan secara alami dalam narasi bahasa Indonesia; kata kerja Indonesia tidak menandai kala, sehingga ‘berkata’ tidak menghapus maupun melebihkan aspek waktunya.
- source_word: Ἀμὴν λέγω σοι
  choice: Sesungguhnya Aku berkata kepadamu
  rationale: Menyampaikan penegasan khidmat Ἀμήν dan ujaran langsung λέγω σοι dengan bentuk yang jelas, wajar, dan bermartabat.
- source_word: σὺ
  choice: engkau
  rationale: Pronomina eksplisit Yunani tercermin melalui ‘engkau’ sebagai subjek klausa prediksi; bentuk ini juga membedakan sapaan tunggal kepada Petrus.
- source_word: σήμερον · ταύτῃ τῇ νυκτί
  choice: hari ini, malam ini juga
  rationale: Kedua ungkapan waktu dipertahankan. ‘Juga’ memberi penekanan alami pada malam yang sedang berlangsung tanpa menghapus ‘hari ini’.
- source_word: πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι
  choice: sebelum ayam berkokok dua kali
  rationale: Mengalihkan konstruksi infinitif Yunani ke klausa waktu Indonesia yang idiomatis sambil mempertahankan keterangan ‘dua kali’ yang khas dalam Markus.
- source_word: τρίς με ἀπαρνήσῃ
  choice: engkau akan menyangkal Aku tiga kali
  rationale: ‘Menyangkal Aku’ merupakan padanan langsung dan lazim bagi penolakan yang dinubuatkan; ‘tiga kali’ mempertahankan kontras numerik dengan dua kali kokok ayam.
theological_decisions:
- issue: Gabungan σήμερον dan ταύτῃ τῇ νυκτί
  choice: Mempertahankan keduanya sebagai ‘hari ini, malam ini juga’
  alternative: Meringkasnya menjadi ‘malam ini juga’
  rationale: Teks Yunani memuat kedua keterangan waktu untuk menekankan dekatnya peristiwa; menghilangkan salah satunya akan mengurangi unsur sumber.
- issue: Penekanan pronomina σὺ
  choice: Memakai ‘engkau’ secara eksplisit pada klausa utama
  alternative: Mengandalkan subjek tersirat atau menambahkan ‘kamulah’
  rationale: Pronomina tunggal perlu tampak, tetapi bentuk ‘kamulah’ dapat memberi fokus eksklusif yang lebih kuat daripada yang dituntut konteks.
- issue: Makna ἀπαρνέομαι
  choice: ‘menyangkal Aku’
  alternative: ‘tidak mengakui Aku’ atau ‘menolak Aku’
  rationale: ‘Menyangkal’ menjaga keluasan makna tindakan Petrus tanpa mempersempitnya menjadi rumusan doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Engkau’ dipakai karena Yesus berbicara langsung kepada satu orang, sedangkan kapitalisasi ‘Aku’ mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Yesus. Tidak diperlukan catatan kaki karena susunan ‘sebelum ayam berkokok dua kali’ sudah menyampaikan teks Yunani dengan jelas.
