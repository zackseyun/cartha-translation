  text: And some stood up and were giving false testimony against him[a], saying,
translation:
  language: id
  text: Kemudian beberapa orang berdiri dan sedang memberikan kesaksian palsu terhadap Dia[a] dengan berkata,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih tradisional, “bersaksi dusta terhadap Dia.”
