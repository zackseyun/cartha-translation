lexical_decisions:
- source_word: καί
  choice: Lalu
  rationale: Kata penghubung ini melanjutkan alur narasi. “Lalu” alami dalam narasi Indonesia dan menunjukkan perkembangan tindakan tanpa menambahkan hubungan sebab-akibat.
- source_word: τινες
  choice: beberapa orang
  rationale: Mempertahankan rujukan jamak yang tidak tentu dengan ungkapan Indonesia yang alami.
- source_word: ἀναστάντες
  choice: berdiri
  rationale: Partisip aoristus ini menggambarkan tindakan mereka bangkit untuk memberi kesaksian dalam suasana persidangan; “berdiri” ringkas dan wajar.
- source_word: ἐψευδομαρτύρουν
  choice: memberikan kesaksian palsu
  rationale: Menyampaikan makna forensik verba tersebut dengan jelas. Dalam konteks rangkaian narasi, bentuk ini dapat mencakup tindakan yang sedang berlangsung tanpa harus memakai konstruksi progresif yang kaku.
- source_word: κατ’ αὐτοῦ
  choice: terhadap Dia
  rationale: κατά dengan genitif di sini bernuansa melawan dalam konteks hukum. “Terhadap Dia” menyampaikan arah kesaksian yang merugikan Yesus secara alami.
- source_word: λέγοντες
  choice: kata mereka,
  rationale: Partisip kini ini memperkenalkan isi kesaksian pada ayat berikutnya. “Kata mereka,” merupakan pengantar kutipan yang alami dalam bahasa Indonesia.
