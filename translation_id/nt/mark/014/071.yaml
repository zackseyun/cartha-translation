  text: ὁ δὲ ἤρξατο ἀναθεματίζειν καὶ ὀμνύναι ὅτι Οὐκ οἶδα τὸν ἄνθρωπον τοῦτον ὃν λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/071.yaml
  text: But he began to call down curses and to swear[a], “I do not know this man you are talking about.”
translation:
  language: id
  text: Namun ia mulai menyerukan kutukan dan bersumpah,[a] “Aku tidak mengenal orang ini yang kalian bicarakan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mulai mengutuk”; mungkin juga “memohon agar dirinya sendiri terkena kutuk.” Teks Yunani tidak menyebutkan secara eksplisit siapa atau apa yang menjadi sasaran kutuk itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Namun, ia
  rationale: δέ menandai perkembangan narasi dengan nuansa kontras; “Namun” menyampaikan peningkatan tajam dari penyangkalan sebelumnya.
- source_word: ἤρξατο
  choice: mulai
  rationale: Bentuk ini menyatakan awal suatu tindakan dan secara alami diterjemahkan “mulai”.
- source_word: ἀναθεματίζειν
  choice: mengucapkan kutuk
  rationale: Kata kerja ini menunjuk pada pengucapan atau pemanggilan kutuk, bukan sekadar penggunaan kata-kata kasar. Terjemahan ini tidak menentukan sasaran kutuk yang memang tidak disebutkan dalam teks Yunani.
- source_word: ὀμνύναι
  choice: bersumpah
  rationale: Kata ini berarti mengucapkan sumpah; “bersumpah” ringkas, alami, dan tetap mempertahankan sifat formal tindakan tersebut.
- source_word: ὅτι
  choice: tanda kutip langsung
  rationale: ὅτι memperkenalkan isi sumpah dan penyangkalan Petrus; kutipan langsung paling alami dalam bahasa Indonesia.
- source_word: Οὐκ οἶδα
  choice: Aku tidak mengenal
  rationale: Dalam konteks penyangkalan terhadap seseorang, “tidak mengenal” menyampaikan arti οἶδα secara alami tanpa memperluasnya menjadi penyangkalan hubungan tertentu.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: orang ... itu
  rationale: Susunan “orang yang kalian bicarakan itu” mempertahankan daya tunjuk τοῦτον dan terdengar wajar dalam bahasa Indonesia.
- source_word: ὃν λέγετε
  choice: yang kalian bicarakan
  rationale: Ungkapan ini secara alami menyatakan orang yang sedang disebut atau dibicarakan oleh para penuduh.
theological_decisions:
- issue: Sifat kutuk dalam ἀναθεματίζειν
  choice: Menyatakan bahwa Petrus mengucapkan kutuk tanpa menentukan sasaran kutuk tersebut.
  alternative: Ia mulai mengutuk; atau ia mulai memohon agar dirinya sendiri terkena kutuk.
  rationale: Dalam konteks sumpah, kata kerja ini mungkin menyiratkan kutuk atas diri sendiri, tetapi teks Yunani tidak menyebutkan objeknya. Terjemahan utama mempertahankan ketidakjelasan itu agar tidak menyatakan bahwa Petrus mengutuk Yesus ataupun secara eksplisit mengutuk dirinya sendiri.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan khidmat. “Kalian” dipakai karena orang kedua jamak tersirat dalam λέγετε dan sesuai dengan konteks sekelompok penuduh.
