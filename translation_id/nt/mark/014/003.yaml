revisions:
- from: Ketika Yesus berada di Betania dan sedang makan sambil berbaring di rumah Simon si penderita kusta, datanglah seorang perempuan membawa sebuah buli-buli pualam berisi minyak wangi narwastu murni[a] yang sangat mahal. Ia memecahkan buli-buli itu lalu menuangkan minyak wangi tersebut ke atas kepala Yesus.
  to: Ketika Yesus berada di Betania, sedang berbaring di rumah Simon si penderita kusta, datanglah seorang perempuan membawa sebuah botol alabaster berisi minyak wangi dari narwastu murni[a] yang sangat mahal. Ia memecahkan botol itu lalu menuangkan minyak wangi tersebut ke atas kepala Yesus.
  rationale: Revisi menghapus penambahan aktivitas makan agar terjemahan hanya menyatakan latar yang diberikan oleh κατακειμένου, yaitu Yesus sedang berbaring/bersandar. Istilah wadah diubah menjadi “botol alabaster” untuk membedakannya dari “pualam” (marmer) dan merepresentasikan ἀλάβαστρον dengan lebih tepat. Ambiguitas πιστικῆς tetap ditandai dalam catatan kaki.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:12:08Z'
review_pass:
  verdict: revise
  source_fidelity: Draf menambahkan unsur “sedang makan,” padahal κατακείμενος menyatakan bahwa Yesus sedang berbaring/bersandar (umumnya dalam konteks jamuan), tetapi ayat ini tidak secara eksplisit menyebut aktivitas makan. Unsur tambahan tersebut perlu dihapus. Selebihnya, urutan tindakan—perempuan datang, memecahkan wadah, lalu mencurahkan isinya ke kepala Yesus—setia kepada teks Yunani.
  naturalness: Bahasa draf umumnya jelas dan modern. “Sedang berbaring” cukup alami untuk mempertahankan gambaran κατακείμενος tanpa menambahkan tindakan makan. “Botol alabaster” lebih langsung dan tepat daripada “buli-buli pualam,” karena ἀλάβαστρον menunjuk pada wadah alabaster dan “pualam” dalam pemakaian Indonesia lazimnya merujuk kepada marmer, bukan alabaster.
  terminology: “Betania,” “Simon si penderita kusta,” “minyak wangi,” dan “narwastu” dapat dipertahankan. Sebutan Simon tidak boleh diubah menjadi “mantan” atau “dahulu penderita,” sebab sumber tidak memberi keterangan itu. “Murni” layak dipertahankan dengan catatan kaki karena πιστικῆς diperdebatkan.
  issues:
  - severity: medium
    issue: Tambahan “sedang makan”
    rationale: Teks hanya menyebut Yesus sedang berbaring/bersandar (κατακειμένου). Walaupun posisi ini lazim pada jamuan makan, teks ayat ini tidak menyatakan bahwa ia sedang makan.
  - severity: low
    issue: “Buli-buli pualam” kurang tepat secara leksikal-material
    rationale: ἀλάβαστρον adalah wadah alabaster. Dalam bahasa Indonesia modern, “pualam” terutama berarti marmer; “botol alabaster” menyampaikan referen dengan lebih tepat dan tetap alami.
