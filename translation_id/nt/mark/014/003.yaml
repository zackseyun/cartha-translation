source:
  edition: SBLGNT
  text: Καὶ ὄντος αὐτοῦ ἐν Βηθανίᾳ ἐν τῇ οἰκίᾳ Σίμωνος τοῦ λεπροῦ κατακειμένου αὐτοῦ ἦλθεν γυνὴ ἔχουσα ἀλάβαστρον μύρου νάρδου πιστικῆς πολυτελοῦς· ⸀συντρίψασα ⸀τὴν ἀλάβαστρον κατέχεεν ⸀αὐτοῦ τῆς κεφαλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/003.yaml
  text: And while he was in Bethany[a], reclining at the house of Simon the leper, a woman came with an alabaster jar of very expensive pure nard perfume; she broke the jar and poured it on his head.
translation:
  language: id
  text: Ketika Yesus berada di Betania, sedang berbaring di rumah Simon si penderita kusta, datanglah seorang perempuan membawa sebuah botol alabaster berisi minyak wangi dari narwastu murni[a] yang sangat mahal. Ia memecahkan botol itu lalu menuangkan minyak wangi tersebut ke atas kepala Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “narwastu asli”; makna kata Yunani yang diterjemahkan “murni” diperdebatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος αὐτοῦ ... κατακειμένου αὐτοῦ
  choice: Ketika Yesus berada ... dan sedang makan sambil berbaring
  rationale: Konstruksi genitif absolut memberi latar keadaan yang sedang berlangsung. Nama “Yesus” dipakai agar rujukannya jelas dalam ayat yang berdiri sendiri, sedangkan “makan sambil berbaring” menyampaikan kebiasaan bersantap dengan posisi bersandar tanpa pengulangan yang kaku.
- source_word: Βηθανίᾳ
  choice: Betania
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: οἰκίᾳ Σίμωνος τοῦ λεπροῦ
  choice: rumah Simon si penderita kusta
  rationale: Mempertahankan sebutan Yunani bagi Simon tanpa menambahkan dugaan bahwa ia adalah mantan penderita kusta.
- source_word: γυνὴ
  choice: seorang perempuan
  rationale: Tokoh ini tidak disebutkan namanya atau diidentifikasi lebih lanjut dalam ayat ini.
- source_word: ἀλάβαστρον
  choice: buli-buli pualam
  rationale: Kata ini menunjuk pada wadah yang secara tradisional terbuat dari alabaster. “Buli-buli” sesuai untuk wadah kecil minyak wangi dan memungkinkan tindakan memecahkannya dipahami secara alami.
- source_word: μύρου
  choice: minyak wangi
  rationale: μύρον adalah minyak atau salep beraroma; “minyak wangi” jelas dan lazim dalam bahasa Indonesia serta tidak menyiratkan bentuk semprotan modern.
- source_word: νάρδου
  choice: narwastu
  rationale: “Narwastu” adalah nama Indonesia yang mapan bagi bahan aromatik nard dan mempertahankan kekhususan zat tersebut.
- source_word: πιστικῆς
  choice: murni
  rationale: Kata sifat ini sulit dan diperdebatkan. “Murni” menyampaikan kemungkinan makna keaslian atau kemurnian, sementara alternatif “asli” dicatat dalam catatan kaki.
- source_word: πολυτελοῦς
  choice: sangat mahal
  rationale: Mengungkapkan nilai ekonomis yang tinggi dengan bahasa Indonesia yang alami dan menyiapkan reaksi dalam konteks selanjutnya.
- source_word: συντρίψασα τὴν ἀλάβαστρον
  choice: Ia memecahkan buli-buli itu
  rationale: Partisip ini menyatakan tindakan yang mendahului penuangan. Bentuk klausa berurutan lebih alami dalam narasi Indonesia.
- source_word: κατέχεεν αὐτοῦ τῆς κεφαλῆς
  choice: lalu menuangkan minyak wangi tersebut ke atas kepala Yesus
  rationale: Menyampaikan tindakan menuang ke atas kepala dengan rujukan yang jelas; penyebutan kembali “minyak wangi” dan “Yesus” menghindari pronomina yang berpotensi kabur.
theological_decisions:
- issue: Apakah sebutan bagi Simon perlu dilunakkan menjadi mantan penderita kusta
  choice: Mempertahankan “Simon si penderita kusta”
  alternative: Simon yang dahulu menderita kusta
  rationale: Teks Yunani hanya menyebutnya “si penderita kusta” dan tidak menyatakan bahwa ia telah sembuh. Menambahkan “dahulu” akan memasukkan kesimpulan yang tidak dinyatakan sumber.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah “buli-buli pualam” dan “narwastu” mempertahankan warna dunia kuno, sedangkan susunan kalimat dibuat mengalir bagi pembaca umum. Penanda catatan kaki ditempatkan langsung setelah kata “murni” yang diterangkannya.
