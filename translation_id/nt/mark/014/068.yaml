  text: ὁ δὲ ἠρνήσατο λέγων· ⸂Οὔτε οἶδα οὔτε ἐπίσταμαι σὺ τί⸃ λέγεις, καὶ ἐξῆλθεν ἔξω εἰς τὸ προαύλιον ⸂καὶ ἀλέκτωρ ἐφώνησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/068.yaml
  text: But he denied it[a], saying, “I neither know nor understand what you are saying.” And he went out into the forecourt, and a rooster crowed.
translation:
  language: id
  text: Tetapi ia menyangkalnya dengan berkata, “Aku tidak tahu dan juga tidak mengerti apa yang kamu katakan.” Lalu ia keluar ke pelataran depan, dan seekor ayam jantan berkokok.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sejumlah naskah tidak memuat: “dan seekor ayam jantan berkokok.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνήσατο
  choice: menyangkalnya
  rationale: Bentuk ini berarti menyangkal atau tidak mengakui. Akhiran -nya secara wajar menunjuk pada tuduhan yang baru disampaikan, tanpa secara eksplisit menambahkan bahwa Petrus menyangkal Yesus.
- source_word: Οὔτε οἶδα οὔτε ἐπίσταμαι
  choice: Aku tidak tahu dan tidak mengerti
  rationale: Dua verba yang berdekatan dipertahankan untuk menyampaikan penegasan ganda dalam penyangkalan Petrus; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: σὺ τί λέγεις
  choice: apa yang kamu katakan
  rationale: Terjemahan langsung ini tetap alami dan mempertahankan hubungan verbal dengan λέγων serta λέγεις.
- source_word: ἐξῆλθεν ἔξω
  choice: ia pergi ke luar
  rationale: Ungkapan ini mempertahankan penekanan gerak menuju bagian luar tanpa menghasilkan pengulangan yang janggal dalam bahasa Indonesia.
- source_word: προαύλιον
  choice: serambi halaman
  rationale: Istilah ini menunjuk pada area depan atau jalan masuk di luar halaman utama. 'Serambi halaman' menyampaikan nuansa ruang peralihan tersebut dengan bahasa yang cukup mudah dipahami.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: seekor ayam jantan berkokok
  rationale: Ini adalah padanan idiomatis dan tepat; bentuk nomina tanpa artikel dapat dinyatakan secara alami dengan 'seekor'.
theological_decisions:
- issue: Pencantuman frasa καὶ ἀλέκτωρ ἐφώνησεν
  choice: Dicantumkan dalam teks utama sebagai 'dan seekor ayam jantan berkokok.'
  alternative: Menghilangkan frasa tersebut sesuai sejumlah naskah.
  rationale: SBLGNT yang disediakan mencantumkan frasa ini sebagai bacaan yang memiliki variasi tekstual. Karena itu, frasa diterjemahkan dalam teks utama dan ketidakpastian tekstual dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dialog memakai 'aku' dan 'kamu' agar terdengar alami dalam percakapan langsung, sedangkan narasi memakai 'ia'. Istilah spasial dipilih untuk membedakan προαύλιον dari halaman utama.
