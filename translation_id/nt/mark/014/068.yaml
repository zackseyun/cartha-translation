  naturalness: Dialognya alami dalam bahasa Indonesia modern. "Namun" dapat diterima, tetapi "Tetapi" lebih langsung untuk δέ. "Pelataran depan" lebih jelas dan lazim daripada "serambi halaman."
  terminology: '"Menyangkal" dan "ayam jantan berkokok" tepat. "Pelataran depan" mempertahankan pembedaan spasial προαύλιον dari halaman utama tanpa menyiratkan bangunan serambi tertentu.'
