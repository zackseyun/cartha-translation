base_translation:
  language: en
  yaml_path: translation/nt/mark/014/056.yaml
  text: For many were giving false testimony against him[a], and their testimonies were not consistent.
translation:
  language: id
  text: Sebab banyak orang memberikan kesaksian palsu terhadap Dia, dan kesaksian mereka tidak saling bersesuaian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih harfiah: “dan kesaksian-kesaksian itu tidak sama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: banyak orang
  rationale: Adjektiva ini dipakai secara substantival untuk sejumlah orang. “Banyak orang” alami dalam bahasa Indonesia dan tidak menambahkan bahwa mereka adalah saksi secara eksplisit.
- source_word: γὰρ
  choice: Sebab
  rationale: Konjungsi ini memberi penjelasan bagi alur narasi sebelumnya; “sebab” mempertahankan hubungan penjelas tersebut.
- source_word: ἐψευδομαρτύρουν
  choice: memberikan kesaksian palsu
  rationale: Ungkapan ini mempertahankan nuansa hukum dari verba Yunani. Bentuk imperfek menggambarkan tindakan yang berlangsung atau berulang dalam adegan; dalam bahasa Indonesia, aspek itu cukup tersampaikan oleh konteks tanpa penanda tambahan yang kaku.
- source_word: κατ’ αὐτοῦ
  choice: terhadap Dia
  rationale: Dalam konteks pengadilan, κατά dengan genitif menunjukkan kesaksian yang diarahkan secara memusuhi kepada Yesus. “Terhadap Dia” jelas dan wajar dalam register hukum-naratif.
- source_word: ἴσαι
  choice: saling bersesuaian
  rationale: Secara harfiah berarti “sama”, tetapi ketika menerangkan berbagai kesaksian, maksudnya ialah bahwa pernyataan-pernyataan itu cocok atau sepakat satu dengan yang lain.
- source_word: αἱ μαρτυρίαι
  choice: kesaksian mereka
  rationale: Artikel Yunani menunjuk kembali kepada kesaksian yang baru disebut. Pronomina “mereka” memperjelas rujukan secara alami tanpa mengubah makna.
- source_word: οὐκ ἦσαν
  choice: tidak
  rationale: 'Negasi dengan bentuk imperfek dari “ada/adalah” diterjemahkan secara idiomatis bersama predikatnya: “tidak saling bersesuaian”.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan register naratif-hukum yang jelas dan bermartabat. “Dia” memakai huruf kapital sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia ketika merujuk kepada Yesus. Penanda catatan kaki ditempatkan sesudah klausa yang diterangkannya.
