  text: ⸀ἤρξαντο λυπεῖσθαι καὶ λέγειν αὐτῷ εἷς κατὰ εἷς· Μήτι ⸀ἐγώ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/019.yaml
  text: They began to be grieved and to say to him[a], one by one, “Surely not I?”
translation:
  language: id
  text: Mereka mulai bersedih hati dan berkata kepada-Nya seorang demi seorang, “Tentunya bukan aku?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Bukankah aku?” Pertanyaan Yunani memakai μήτι, yang mengharapkan jawaban negatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: mulai
  rationale: Bentuk aoris dari ἄρχω bersama dua infinitif menandai permulaan kedua tindakan; “mulai” merupakan padanan Indonesia yang langsung dan alami.
- source_word: λυπεῖσθαι
  choice: bersedih hati
  rationale: Infinitif ini menyatakan mengalami kesedihan atau dukacita. “Bersedih hati” alami dalam bahasa Indonesia dan sesuai dengan suasana khidmat konteks.
- source_word: καὶ λέγειν
  choice: dan berkata
  rationale: λέγω berarti berkata atau berbicara. Meskipun ucapannya berbentuk pertanyaan, “berkata” mempertahankan pilihan verba sumber tanpa mempersempitnya menjadi “bertanya”.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Pronomina ini merujuk kepada Yesus. Bentuk pronominal dipertahankan; kapitalisasi mengikuti kebiasaan terjemahan Alkitab bahasa Indonesia untuk rujukan kepada Yesus.
- source_word: εἷς κατὰ εἷς
  choice: seorang demi seorang
  rationale: Ungkapan distributif ini menunjukkan bahwa masing-masing berbicara secara bergiliran. “Seorang demi seorang” ringkas, jelas, dan wajar.
- source_word: Μήτι ἐγώ;
  choice: Tentunya bukan aku?
  rationale: μήτι membentuk pertanyaan yang mengharapkan jawaban negatif. Padanan ini mempertahankan bentuk eliptis dan nada cemas atau menyangkal tanpa menambahkan “orangnya” yang tidak tersurat.
theological_decisions:
- issue: Daya pertanyaan para murid
  choice: 'Pertanyaan diterjemahkan sebagai pertanyaan yang mengharapkan jawaban negatif: “Tentunya bukan aku?”'
  alternative: “Apakah aku?”
  rationale: Partikel μήτι menunjukkan bahwa penutur mengharapkan jawaban “bukan.” Terjemahan alternatif menghilangkan nuansa pengharapan itu dan meratakan daya emosional pertanyaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat tetap dekat dengan struktur Yunani, tetapi dibuat alami bagi pembaca umum. Penanda catatan kaki [a] ditempatkan langsung sesudah pertanyaan yang dijelaskannya.
