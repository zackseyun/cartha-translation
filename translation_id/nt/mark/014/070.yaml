  text: ὁ δὲ πάλιν ἠρνεῖτο. καὶ μετὰ μικρὸν πάλιν οἱ παρεστῶτες ἔλεγον τῷ Πέτρῳ· Ἀληθῶς ἐξ αὐτῶν εἶ, καὶ γὰρ Γαλιλαῖος εἶ ⸂καὶ ἡ λαλιά σου ὁμοιάζει⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/070.yaml
  text: But he again denied it[a]. And after a little while, those standing nearby again were saying to Peter, “Surely you are one of them, for you are also a Galilean[b], and your speech is similar.”
translation:
  language: id
  text: Namun, ia menyangkal lagi. Tidak lama kemudian, orang-orang yang berdiri di dekat situ kembali berkata kepada Petrus, “Kamu pasti salah seorang dari mereka, sebab kamu juga orang Galilea, dan cara bicaramu[a] serupa.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “logatmu pun serupa” atau “cara bicaramu seperti cara bicara mereka.” Kata Yunani λαλιά dapat menunjuk kepada pola tutur, dialek, atau logat.
    reason: lexical_alternative
  - marker: b
    text: Sejumlah naskah tidak memuat “dan cara bicaramu serupa.”
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνεῖτο
  choice: menyangkal lagi
  rationale: Bentuk imperfek menggambarkan penyangkalan yang berlangsung atau berulang, sedangkan πάλιν berarti ‘lagi’. Ungkapan ini alami dalam bahasa Indonesia dan tidak perlu menambahkan objek yang tidak dinyatakan dalam teks Yunani.
- source_word: μετὰ μικρὸν
  choice: tidak lama kemudian
  rationale: Ungkapan ini menunjukkan selang waktu yang singkat; pilihan ini alami dan mempertahankan hubungan waktunya.
- source_word: οἱ παρεστῶτες
  choice: orang-orang yang berdiri di dekat situ
  rationale: Mempertahankan nuansa harfiah partisip yang menunjuk kepada orang-orang yang sedang berdiri di dekat Petrus.
- source_word: ἔλεγον
  choice: kembali berkata
  rationale: Imperfek dapat menunjukkan ujaran yang berlangsung atau berulang. Bersama πάλιν, ‘kembali berkata’ menyampaikan pengulangan secara wajar tanpa membuat durasinya terlalu tegas.
- source_word: Ἀληθῶς
  choice: pasti
  rationale: Adverbia ini menyatakan keyakinan kuat. ‘Pasti’ terdengar alami dalam tuduhan langsung.
- source_word: ἐξ αὐτῶν εἶ
  choice: kamu ... salah seorang dari mereka
  rationale: Menyampaikan bahwa Petrus termasuk kelompok yang dikaitkan dengan Yesus tanpa memperluas identitas kelompok itu.
- source_word: καὶ γὰρ Γαλιλαῖος εἶ
  choice: sebab kamu juga orang Galilea
  rationale: ‘Sebab’ mempertahankan fungsi penjelasan γάρ, sedangkan ‘juga’ mewakili καί.
- source_word: ἡ λαλιά σου
  choice: cara bicaramu
  rationale: λαλιά dapat menunjuk kepada pola tutur, dialek, atau logat. ‘Cara bicara’ cukup luas untuk menjaga rentang makna tersebut.
- source_word: ὁμοιάζει
  choice: pun serupa
  rationale: Verba ini berarti ‘menyerupai’ atau ‘serupa’. Karena objek pembanding tidak dinyatakan, terjemahan tidak menambahkannya secara eksplisit.
