  register: Bahasa Indonesia modern yang lugas dan bermartabat. Sapaan ‘kamu’ dipakai karena merupakan tuduhan langsung kepada Petrus. Susunan akhir sengaja mempertahankan objek pembanding yang tersirat dalam bahasa Yunani; catatan kaki menjelaskan kemungkinan maknanya.
