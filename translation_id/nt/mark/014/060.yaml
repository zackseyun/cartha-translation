  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἰς μέσον ἐπηρώτησεν τὸν Ἰησοῦν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/060.yaml
  text: And the high priest stood up in the middle and questioned Jesus[a], saying[c][b], “Do you answer nothing? What are these men testifying against you?”
translation:
  language: id
  text: Lalu Imam Besar berdiri di tengah sidang[a] dan bertanya kepada Yesus, “Apakah Engkau tidak menjawab apa-apa? Apa yang disaksikan orang-orang ini terhadap Engkau?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “ke tengah-tengah”; maksudnya, Imam Besar mengambil posisi di tengah perhimpunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: berdiri
  rationale: Partisip aoris dari ἀνίστημι di sini menyatakan tindakan fisik bangkit atau berdiri; “berdiri” alami dalam narasi Indonesia dan tidak menambahkan gerakan lain.
- source_word: ὁ ἀρχιερεὺς
  choice: Imam Besar
  rationale: Istilah baku untuk imam tertinggi yang memimpin pemeriksaan ini, bukan sebutan bagi para imam kepala secara umum.
- source_word: εἰς μέσον
  choice: di tengah sidang
  rationale: Ungkapan ini menunjukkan posisi sentral di hadapan perhimpunan. “Di tengah sidang” wajar dalam bahasa Indonesia dan membuat konteks ruangnya jelas tanpa bahasa arkais.
- source_word: ἐπηρώτησεν
  choice: bertanya kepada
  rationale: ἐπερωτάω dapat berarti bertanya atau menanyai. Dalam bahasa Indonesia, “bertanya kepada” tetap alami dan konteks persidangan sudah menyampaikan tekanan pemeriksaannya.
- source_word: ἀποκρίνῃ οὐδέν
  choice: Apakah Engkau tidak menjawab apa-apa?
  rationale: Mempertahankan bentuk pertanyaan retoris yang tajam serta cakupan negatif οὐδέν tanpa menambahkan isi jawaban tertentu.
- source_word: οὗτοί
  choice: orang-orang ini
  rationale: Demonstrativa jamak menunjuk langsung kepada para saksi yang hadir. Bahasa Indonesia tidak menandai gender gramatikal, sehingga “orang-orang ini” menyatakan rujukannya secara alami tanpa menonjolkan jenis kelamin secara tidak wajar.
- source_word: καταμαρτυροῦσιν
  choice: kesaksikan untuk melawan Engkau
  rationale: Menyampaikan arti memberikan kesaksian yang memberatkan seseorang serta nuansa yudisial verba tersebut, tanpa mereduksinya menjadi sekadar “menuduh”.
theological_decisions:
- issue: Rujukan maskulin οὗτοί
  choice: orang-orang ini
  alternative: laki-laki ini
  rationale: Bentuk Yunani adalah maskulin jamak dan merujuk kepada para saksi dalam adegan ini, tetapi bahasa Indonesia tidak memiliki gender gramatikal pada demonstrativa. “Orang-orang ini” mempertahankan rujukan khusus tanpa menambahkan penekanan pada jenis kelamin yang tidak diperlukan oleh wacana.
- issue: Isi pertanyaan imam besar
  choice: Apa yang orang-orang ini kesaksikan untuk melawan Engkau?
  alternative: Mengapa orang-orang ini bersaksi melawan Engkau?
  rationale: τί paling wajar dipahami menanyakan apa isi kesaksian mereka, bukan alasan mereka bersaksi. Terjemahan mempertahankan ketegangan dan bentuk pertanyaan tanpa mengubahnya menjadi pertanyaan sebab.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan kepada Yesus memakai “Engkau” sesuai register Alkitabiah Indonesia yang tetap mudah dipahami. Struktur pertanyaan dipertahankan tajam dan langsung seperti teks Yunani.
