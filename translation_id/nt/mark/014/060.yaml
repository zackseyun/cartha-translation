  naturalness: 'Registernya modern dan bermartabat. “Apakah Engkau tidak menjawab apa-apa?” alami dan tajam. Kalimat kedua perlu dibentuk ulang menjadi pertanyaan Indonesia yang wajar: “Apa yang disaksikan orang-orang ini terhadap Engkau?”'
