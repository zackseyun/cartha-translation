base_translation:
  language: en
  yaml_path: translation/nt/mark/014/045.yaml
  text: And when he came[a], he immediately went up to him and said, “Rabbi!” and kissed him repeatedly.
translation:
  language: id
  text: Sesudah tiba, ia segera menghampiri Yesus dan berkata, “Rabi!” lalu mencium-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencium-Nya berkali-kali” atau “mencium-Nya dengan hangat.” Kata kerja Yunani yang digunakan lebih tegas daripada sekadar “mencium.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: begitu tiba
  rationale: Partisip aoris ini berfungsi secara temporal. “Begitu tiba” menyampaikan urutan kejadian secara alami dan berkaitan erat dengan εὐθὺς.
- source_word: εὐθὺς
  choice: segera
  rationale: Padanan ini mempertahankan gerak narasi Markus yang cepat dalam bahasa Indonesia modern.
- source_word: προσελθὼν αὐτῷ
  choice: menghampiri Yesus
  rationale: Kata kerja ini menyatakan gerakan mendekat. Nama “Yesus” dipakai untuk memperjelas acuan pronomina dalam bahasa Indonesia tanpa mengubah referennya.
- source_word: λέγει
  choice: berkata
  rationale: Walaupun bahasa Yunani memakai bentuk kini historis, bentuk lampau tersirat melalui alur naratif bahasa Indonesia dan terdengar lebih alami.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Transliterasi ini mempertahankan sapaan historis dan budaya yang digunakan Yudas; menerjemahkannya sebagai “Guru” akan menghilangkan sebagian warna teks.
- source_word: κατεφίλησεν
  choice: mencium-Nya dengan hangat
  rationale: Kata kerja majemuk ini lebih tegas daripada kata biasa untuk “mencium” dan dapat menyatakan ciuman yang hangat atau berulang. Pilihan utama menyampaikan penekanan tanpa memastikan bahwa tindakan itu pasti diulang.
theological_decisions:
- issue: Sapaan Yudas kepada Yesus, Ῥαββί
  choice: Rabi
  alternative: Guru
  rationale: Mempertahankan gelar Semitis yang terdapat dalam teks Yunani menjaga latar historis dan ironi adegan tanpa menambahkan tafsiran doktrinal.
- issue: Kekuatan tindakan dalam κατεφίλησεν
  choice: mencium-Nya dengan hangat
  alternative: mencium-Nya berkali-kali
  rationale: Bentuk Yunani bersifat lebih tegas daripada “mencium” biasa, tetapi tidak dengan sendirinya memastikan apakah penekanannya terletak pada kehangatan atau pengulangan. Teks utama dan catatan kaki mempertahankan kemungkinan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Rabi” mempertahankan latar budaya, sedangkan “menghampiri Yesus” memperjelas acuan pronomina. Penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskannya.
