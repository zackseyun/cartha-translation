  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε αὐτήν· τί αὐτῇ κόπους παρέχετε; καλὸν ἔργον ἠργάσατο ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/006.yaml
  text: But Jesus said[a], “Leave her alone[c][b]. Why are you troubling her? She has done a beautiful work for me.”
translation:
  language: id
  text: Namun, Yesus berkata, “Biarkan dia. Mengapa kalian menyusahkannya? Dia telah melakukan perbuatan yang indah bagi-Ku.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di dalam-Ku”; dapat juga diterjemahkan “kepada-Ku” atau, sesuai tindakan pengurapan dalam konteksnya, “atas-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε αὐτήν
  choice: Biarkan dia
  rationale: Imperatif aoristus ini menyerukan agar gangguan terhadap perempuan itu segera dihentikan. Ungkapan ini lugas, alami, dan tetap memuat daya perlindungan dalam perkataan Yesus.
- source_word: τί αὐτῇ κόπους παρέχετε;
  choice: Mengapa kalian menyusahkannya?
  rationale: Ungkapan κόπους παρέχετε secara idiomatis berarti menyebabkan kesusahan atau gangguan. Bentuk 'kalian' sesuai dengan verba jamak dan konteks para pengkritik.
- source_word: καλὸν ἔργον
  choice: perbuatan yang indah
  rationale: καλός dapat berarti baik, indah, luhur, atau patut. 'Perbuatan yang indah' mempertahankan pujian Yesus terhadap tindakan yang baik sekaligus tepat dan elok dalam konteks ini.
- source_word: ἠργάσατο
  choice: telah melakukan
  rationale: Bentuk ini secara alami menyatakan tindakan yang sudah dilakukan; 'telah melakukan' cocok dengan nomina 'perbuatan' dalam bahasa Indonesia modern.
- source_word: ἐν ἐμοί
  choice: bagi-Ku
  rationale: Walaupun secara harfiah berarti 'di dalam-Ku', dalam konstruksi ini frasa tersebut menunjuk pada perbuatan yang diarahkan kepada Yesus. 'Bagi-Ku' menyampaikan makna relasional itu secara idiomatis tanpa terlalu mempersempitnya menjadi lokasi fisik.
- source_word: δὲ
  choice: Namun
  rationale: Partikel δέ menandai peralihan yang berlawanan dengan kecaman sebelumnya. 'Namun' menyatakan kontras ringan itu dalam ragam naratif yang wajar.
theological_decisions:
- issue: Nuansa καλὸν ἔργον dalam penilaian Yesus atas tindakan perempuan itu
  choice: perbuatan yang indah
  alternative: perbuatan yang baik; perbuatan yang luhur
  rationale: Pilihan ini mempertahankan keluasan makna καλός dan pujian atas kepatutan tindakan tersebut tanpa memasukkan gagasan teologis tentang jasa atau ritus tertentu.
- issue: Daya makna ἐν ἐμοί
  choice: bagi-Ku
  alternative: kepada-Ku; atas-Ku; di dalam-Ku
  rationale: '''Bagi-Ku'' mengungkapkan bahwa tindakan itu ditujukan kepada Yesus, sambil mempertahankan dalam catatan kaki bentuk harfiah dan kemungkinan terjemahan lain.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kata ganti 'kalian' dipakai karena verba Yunani berbentuk jamak. Kapitalisasi pada '-Ku' mengikuti kebiasaan penulisan kata ganti yang merujuk kepada Yesus dalam terjemahan Alkitab bahasa Indonesia.
