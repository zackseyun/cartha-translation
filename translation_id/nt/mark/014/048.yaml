  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/048.yaml
  text: And Jesus answered and said to them[a], “Have you come out as against a robber, with swords and clubs, to arrest me?”
translation:
  language: id
  text: Lalu Yesus berkata kepada mereka, “Apakah kalian datang dengan membawa pedang dan pentung untuk menangkap Aku seolah-olah Aku seorang perampok?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penyamun,” “bandit,” atau “pemberontak.” Kata Yunani λῃστής dapat merujuk kepada perampok bersenjata atau pemberontak, bukan hanya pencuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: berkata
  rationale: Gabungan ini merupakan rumusan naratif Semitis untuk memperkenalkan ucapan. Dalam bahasa Indonesia modern, 'berkata' menyampaikan fungsinya secara alami; 'menjawab dan berkata' terasa kaku, terutama karena tidak ada pertanyaan langsung sebelumnya.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: seolah-olah Aku ini seorang perampok
  rationale: Ungkapan ini menyatakan bahwa rombongan tersebut memperlakukan Yesus seperti penjahat berbahaya yang harus dihadapi dengan senjata. Susunan ini mempertahankan daya retoris ὡς tanpa menghasilkan bahasa Indonesia yang janggal.
- source_word: λῃστὴν
  choice: perampok
  rationale: '''Perampok'' merupakan padanan Indonesia yang jelas dan lazim, serta lebih kuat daripada ''pencuri''. Karena kata Yunani ini juga dapat merujuk kepada penyamun atau pemberontak bersenjata, keluasan maknanya dicatat dalam catatan kaki.'
- source_word: ἐξήλθατε
  choice: kalian datang
  rationale: Dalam konteks para penangkap yang mendatangi Yesus, 'datang' adalah ungkapan Indonesia yang alami. Subjek jamak eksplisit 'kalian' membuat pertanyaan retoris mudah dipahami.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: dengan membawa pedang dan pentung
  rationale: μάχαιρα dapat menunjuk pada pedang atau pisau besar, sedangkan ξύλον secara harfiah berarti kayu atau tongkat; dalam adegan ini keduanya berfungsi sebagai senjata. 'Pedang dan pentung' menyampaikan fungsi tersebut dengan jelas.
- source_word: συλλαβεῖν με
  choice: untuk menangkap Aku
  rationale: '''Menangkap'' tepat untuk tindakan menahan seseorang dalam konteks penangkapan ini, tanpa menambahkan rincian legal yang tidak dinyatakan secara eksplisit oleh kata Yunani.'
theological_decisions:
- issue: Nuansa λῃστής dalam pertanyaan retoris Yesus
  choice: '''perampok'' dalam teks utama, dengan arti yang lebih luas dijelaskan dalam catatan kaki'
  alternative: '''penyamun'', ''bandit'', atau ''pemberontak'' dalam teks utama'
  rationale: Ayat ini menyoroti ironi bahwa Yesus diperlakukan seperti penjahat bersenjata atau pelaku kekerasan. 'Perampok' tetap alami dan mudah dikenali, sementara catatan kaki menjaga kemungkinan nuansa penyamun atau pemberontak tanpa menetapkan satu identifikasi historis secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'Aku' dipakai dalam ucapan Yesus sesuai kebiasaan penerjemahan Alkitab Indonesia. 'Kalian' memperjelas bahwa pihak yang disapa berbentuk jamak. Pertanyaan retoris dan nuansa tindakan rombongan bersenjata dipertahankan.
