  text: καὶ παραλαμβάνει τὸν Πέτρον καὶ ⸂Ἰάκωβον καὶ⸃ Ἰωάννην μετ’ ⸀αὐτοῦ, καὶ ἤρξατο ἐκθαμβεῖσθαι καὶ ἀδημονεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/033.yaml
  text: And he takes Peter and James and John with him[a], and he began to be greatly distressed and troubled,
translation:
  language: id
  text: Lalu Ia membawa Petrus, Yakobus, dan Yohanes bersama-Nya, dan Ia mulai merasa sangat terguncang dan tertekan,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mulai merasa sangat terkejut dan tertekan.” Kata pertama dapat menyatakan keterkejutan, kegentaran, atau tekanan batin yang sangat kuat dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαμβάνει
  choice: mengajak ... menyertai-Nya
  rationale: Ungkapan ini secara alami menyampaikan tindakan membawa beberapa orang sebagai pendamping. Kala kini historis Yunani dinaturalkan menjadi bentuk lampau naratif bahasa Indonesia tanpa kehilangan urutan peristiwa.
- source_word: μετ’ αὐτοῦ
  choice: menyertai-Nya
  rationale: Menyatakan bahwa Petrus, Yakobus, dan Yohanes ikut bersama Yesus, sekaligus menyatu secara wajar dengan παραλαμβάνει dalam bahasa Indonesia.
- source_word: ἤρξατο
  choice: Ia mulai
  rationale: Mempertahankan aspek ingresif, yakni awal munculnya keadaan emosional yang disebutkan sesudahnya.
- source_word: ἐκθαμβεῖσθαι
  choice: merasa sangat gentar
  rationale: Dalam konteks Getsemani, verba ini menunjuk pada keguncangan atau ketakutan yang sangat kuat, bukan sekadar rasa heran. 'Sangat gentar' mempertahankan intensitas tanpa menambahkan sebab yang tidak dinyatakan.
- source_word: ἀδημονεῖν
  choice: tertekan
  rationale: Mengungkapkan penderitaan batin yang berat dan membedakannya dari kegentaran yang dinyatakan oleh verba sebelumnya.
- source_word: καὶ ... καὶ
  choice: Petrus, Yakobus, dan Yohanes; ... dan ...
  rationale: Koordinasi ketiga nama dan kedua keadaan tetap dipertahankan secara alami menurut kaidah daftar bahasa Indonesia.
theological_decisions:
- issue: Keadaan emosional Yesus di Getsemani
  choice: 'Menerjemahkan kedua verba sebagai pengalaman emosional yang nyata dan sangat kuat: ''sangat gentar dan tertekan''.'
  alternative: ‘sangat terguncang dan tertekan’ atau ungkapan yang lebih ringan seperti ‘heran dan gelisah’.
  rationale: Teks menampilkan kemanusiaan Yesus dan pergumulan-Nya secara nyata. Terjemahan tidak meredam intensitasnya, tetapi juga tidak memasukkan penjelasan teologis atau penyebab emosinya yang tidak disebutkan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ilahi memakai bentuk kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia. Kalimat dipecah menjadi dua agar alami, sementara hubungan berurutan dalam narasi tetap jelas.
