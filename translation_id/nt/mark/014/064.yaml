  yaml_path: translation/nt/mark/014/064.yaml
  text: You have heard the blasphemy[b][a]. What does it seem to you? And they all condemned him as deserving death.
translation:
  language: id
  text: “Kalian sudah mendengar penghujatan itu. Bagaimana pendapat kalian?”[a] Lalu mereka semua memutuskan bahwa Dia patut dihukum mati.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Apa yang tampak bagi kalian?” Ungkapan ini juga dapat berarti, “Apa putusan kalian?”'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “memutuskan bahwa Dia layak dihukum mati” atau “menyatakan Dia terancam hukuman mati.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσατε
  choice: Kalian sudah mendengar
  rationale: Aoristus ini menunjuk pada ucapan yang baru saja mereka dengar. Bentuk “sudah mendengar” menyampaikan kaitan langsung itu secara alami dalam bahasa Indonesia.
- source_word: τῆς βλασφημίας
  choice: penghujatan itu
  rationale: Istilah “penghujatan” mempertahankan bobot hukum dan keagamaan dari tuduhan tersebut, sedangkan “itu” menunjuk pada ucapan tertentu yang baru saja terdengar.
- source_word: τί ὑμῖν φαίνεται
  choice: Bagaimana pendapat kalian?
  rationale: Ungkapan Yunani ini secara idiomatis meminta pendapat atau putusan. Terjemahan ini alami dalam bahasa Indonesia dan tidak mempersempitnya hanya menjadi putusan hukum.
- source_word: οἱ δὲ πάντες
  choice: Lalu mereka semua
  rationale: “Semua” mempertahankan penekanan πάντες pada kesepakatan bulat mereka; “lalu” menghubungkan tanggapan mereka dengan pertanyaan sebelumnya.
- source_word: κατέκριναν
  choice: menyatakan ... bersalah
  rationale: κατακρίνω merupakan istilah yudisial untuk menjatuhkan putusan bersalah atau menghukum. Frasa ini jelas dan alami dalam konteks persidangan.
- source_word: ἔνοχον εἶναι θανάτου
  choice: bersalah dan patut dihukum mati
  rationale: Konstruksi ini menyatakan bahwa seseorang diputuskan berada di bawah ancaman atau layak menerima hukuman mati. Pilihan ini menyampaikan baik putusan bersalah maupun konsekuensi hukumnya dalam bahasa Indonesia yang jelas.
theological_decisions:
- issue: Status tuduhan βλασφημία dalam konteks persidangan
  choice: penghujatan
  alternative: ucapan yang menghujat
  rationale: Ayat ini melaporkan tuduhan dan putusan majelis, bukan menegaskan bahwa tuduhan itu benar. Istilah formal “penghujatan” mempertahankan bobot teologis dan yudisial tanpa menyelesaikan ketegangan naratif tersebut.
- issue: Makna ἔνοχον εἶναι θανάτου
  choice: bersalah dan patut dihukum mati
  alternative: bersalah sehingga terancam hukuman mati
  rationale: Pilihan utama mempertahankan hubungan antara vonis bersalah dan kelayakan menerima hukuman mati, tanpa menentukan lebih jauh apakah frasa itu terutama menyatakan kelayakan moral, tanggung jawab hukum, atau vonis hukuman.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “kalian” sesuai dengan sapaan jamak ὑμῖν; “Dia” mengikuti konvensi penerbitan Alkitab Indonesia untuk rujukan kepada Yesus. Semua penanda catatan kaki ditempatkan pada bagian teks yang relevan.
