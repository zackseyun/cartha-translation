  terminology: “Penghujatan” tepat untuk βλασφημία dan tidak menyiratkan bahwa narator mengesahkan tuduhan itu. “Patut dihukum mati” secara jelas menyampaikan status hukum ἔνοχος θανάτου tanpa memaksakan nuansa “bersalah” sebagai unsur leksikal tambahan.
