revisions:
- from: Lalu beberapa orang mulai meludahi Dia, menutupi wajah-Nya,[a] meninju-Nya, dan berkata kepada-Nya, “Bernubuatlah!” Para petugas pun menyambut Dia dengan pukulan-pukulan.[b]
