  rationale: Revisi hanya mengganti idiom yang tidak alami dalam terjemahan utama dengan padanan Indonesia yang menyatakan tindakan pemukulan secara jelas, serta memperjelas alternatif pada catatan a agar tidak mengubah tindakan menutupi wajah menjadi sekadar memejamkan mata. Tidak ada penambahan penafsiran teologis.
