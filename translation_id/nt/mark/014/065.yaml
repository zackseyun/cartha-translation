  text: καὶ ἤρξαντό τινες ἐμπτύειν αὐτῷ καὶ περικαλύπτειν ⸂αὐτοῦ τὸ πρόσωπον⸃ καὶ κολαφίζειν αὐτὸν καὶ λέγειν αὐτῷ· Προφήτευσον, καὶ οἱ ὑπηρέται ῥαπίσμασιν αὐτὸν ⸀ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/065.yaml
  text: And some began to spit on him[a], and to cover his face, and to strike him with their fists, and to say to him[b], “Prophesy!” And the officers received him with blows.
translation:
  language: id
  text: Lalu beberapa orang mulai meludahi Dia, menutupi wajah-Nya,[a] meninju-Nya, dan berkata kepada-Nya, “Bernubuatlah!” Para petugas juga memukuli Dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menutup wajah-Nya sehingga Ia tidak dapat melihat.” Teks Yunani secara harfiah berbunyi “menutupi wajah-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, ungkapan Yunani berbunyi “para petugas menerima Dia dengan pukulan-pukulan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντό
  choice: mulai
  rationale: Menandai awal rangkaian tindakan dan mempertahankan perkembangan narasi yang dinyatakan oleh ἄρχομαι dengan infinitif.
- source_word: τινες
  choice: beberapa orang
  rationale: Merujuk secara tak tentu kepada sejumlah anggota kelompok; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: ἐμπτύειν αὐτῷ
  choice: meludahi Dia
  rationale: Menyampaikan penghinaan langsung yang dinyatakan oleh verba dengan objek datif secara idiomatis dalam bahasa Indonesia.
- source_word: περικαλύπτειν αὐτοῦ τὸ πρόσωπον
  choice: menutupi wajah-Nya
  rationale: Mengikuti ungkapan Yunani secara dekat tanpa memastikan bahwa tindakan itu secara khusus merupakan pemasangan penutup mata; kemungkinan tersebut dicatat dalam catatan kaki.
- source_word: κολαφίζειν αὐτὸν
  choice: meninju-Nya
  rationale: κολαφίζω lazimnya berarti memukul dengan kepalan tangan; 'meninju' menyampaikan tindakan itu secara ringkas dan alami.
- source_word: λέγειν αὐτῷ· Προφήτευσον
  choice: berkata kepada-Nya, “Bernubuatlah!”
  rationale: Mempertahankan imperatif ejekan yang singkat tanpa menambahkan objek atau penjelasan yang tidak terdapat dalam teks.
- source_word: ὑπηρέται
  choice: para petugas
  rationale: Dalam konteks pengadilan, kata ini menunjuk kepada bawahan resmi atau penjaga, bukan pelayan rumah tangga; 'para petugas' mempertahankan peran kelembagaan tanpa terlalu mempersempitnya.
- source_word: ῥαπίσμασιν
  choice: dengan pukulan-pukulan
  rationale: Bentuk datif bersifat instrumental dan dapat menunjuk pada pukulan atau tamparan; istilah umum 'pukulan-pukulan' menghindari ketepatan semu.
- source_word: ἔλαβον
  choice: menyambut
  rationale: Dalam konstruksi idiomatis ῥαπίσμασιν αὐτὸν ἔλαβον, pilihan ini mempertahankan gambaran harfiah 'menerima/menyambut dengan pukulan', meskipun bernada ironis dan tidak lazim; arti idiomatis dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan perintah ejekan Προφήτευσον dalam kaitannya dengan identitas Yesus
  choice: Bernubuatlah!
  alternative: Bernubuatlah kepada kami! / Buktikan bahwa Engkau seorang nabi!
  rationale: Teks hanya memuat imperatif singkat. Terjemahan tidak menambahkan sasaran nubuat atau penjelasan tentang ejekan itu, sehingga ironi naratif dan ketegangan teologis tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Bentuk sapaan ilahi menggunakan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Struktur rangkaian tindakan dipertahankan, sementara diksi dibuat wajar bagi pembaca umum. Semua penanda catatan kaki muncul dalam teks utama.
