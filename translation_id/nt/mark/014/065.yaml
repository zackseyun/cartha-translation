review_pass:
  verdict: revise
  source_fidelity: Rangkaian tindakan, aspek ingresif pada ἤρξαντο ('mulai'), pelaku tak tentu τινες, serta imperatif ejekan Προφήτευσον telah diterjemahkan dengan tepat. Namun, ῥαπίσμασιν αὐτὸν ἔλαβον adalah ungkapan yang bermakna tindakan memukul, bukan tindakan menyambut secara harfiah dalam bahasa Indonesia; terjemahan utama perlu memakai padanan idiomatis sambil mencatat bentuk harfiahnya.
  naturalness: Kalimat pertama alami dalam bahasa Indonesia baku. Sebaliknya, 'Para petugas pun menyambut Dia dengan pukulan-pukulan' tidak wajar dan dapat terbaca seolah-olah 'menyambut' adalah tindakan terpisah. 'Para petugas juga memukuli Dia' menyampaikan maksudnya secara lugas dan alami.
  terminology: '''Para petugas'' layak untuk ὑπηρέται dalam konteks ini. ''Bernubuatlah!'' mempertahankan perintah singkat tanpa memasukkan penafsiran. Catatan a perlu diperbaiki karena ''menutup mata-Nya'' dalam bahasa Indonesia terutama berarti membuat Dia memejamkan mata, bukan menutupi wajah atau menutup pandangan-Nya.'
  issues:
  - severity: medium
    issue: Terjemahan utama 'menyambut Dia dengan pukulan-pukulan' tidak idiomatis dan mengaburkan makna ungkapan ῥαπίσμασιν αὐτὸν ἔλαβον.
    rationale: Walaupun konstruksi Yunani secara leksikal memuat 'menerima/mengambil', dalam konteks ini idiom tersebut menyatakan bahwa para petugas memukul Yesus. Terjemahan utama Indonesia sebaiknya menyampaikan tindakan itu langsung; bentuk harfiah dapat dipertahankan dalam catatan kaki.
  - severity: low
    issue: Catatan kaki a memakai alternatif 'menutup mata-Nya.'
    rationale: Alternatif ini dapat berarti membuat mata-Nya terpejam dan bukan 'menutupi wajah-Nya' atau 'menutup pandangan-Nya.' Alternatif yang lebih tepat ialah 'menutup wajah-Nya sehingga Ia tidak dapat melihat.'
