  text: Ἦν δὲ τὸ πάσχα καὶ τὰ ἄζυμα μετὰ δύο ἡμέρας. καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς πῶς αὐτὸν ἐν δόλῳ κρατήσαντες ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/001.yaml
  text: The Passover and Unleavened Bread were two days away[a]. And the chief priests and the scribes were seeking how, by deceit, they might arrest him and kill him[c][b],
translation:
  language: id
  text: Paskah dan Hari Raya Roti Tidak Beragi[b] tinggal dua hari lagi.[a] Para imam kepala dan para ahli Taurat sedang mencari cara untuk menangkap Dia dengan tipu daya[c], lalu membunuh-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “sesudah dua hari.” Ungkapan ini menunjukkan bahwa Paskah dan Hari Raya Roti Tidak Beragi sudah dekat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang tidak beragi,” suatu ungkapan yang lazim untuk menyebut Hari Raya Roti Tidak Beragi.
    reason: cultural_note
  - marker: c
    text: Kata Yunani untuk “menangkap” juga dapat diterjemahkan “menahan” atau “menyergap.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: tinggal
  rationale: Konstruksi ini ditempatkan dalam ungkapan waktu alami bahasa Indonesia, “tinggal dua hari lagi.” Daya peralihan ringan dari δέ tidak perlu dinyatakan dengan kata tersendiri karena alur narasi sudah jelas.
- source_word: τὸ πάσχα
  choice: Hari Paskah
  rationale: Istilah baku dan mudah dipahami untuk perayaan Yahudi yang dimaksud dalam konteks ini.
- source_word: τὰ ἄζυμα
  choice: Hari Raya Roti Tidak Beragi
  rationale: Secara harfiah berarti “yang tidak beragi,” tetapi dalam konteks perayaan menunjuk pada Hari Raya Roti Tidak Beragi; penambahan “Hari Raya” memperjelas acuannya.
- source_word: μετὰ δύο ἡμέρας
  choice: tinggal dua hari lagi
  rationale: Menyampaikan bahwa kedua perayaan itu sudah dekat dengan ungkapan waktu yang wajar dalam bahasa Indonesia, sambil mempertahankan alternatif harfiah dalam catatan kaki.
- source_word: ἐζήτουν
  choice: sedang mencari
  rationale: Bentuk imperfek menunjukkan upaya yang sedang berlangsung, bukan tindakan sesaat.
- source_word: οἱ ἀρχιερεῖς
  choice: para imam kepala
  rationale: Padanan baku bagi kalangan pemimpin keimaman; bentuk jamak dipertahankan.
- source_word: οἱ γραμματεῖς
  choice: ahli-ahli Taurat
  rationale: Padanan Indonesia yang lazim dan jelas bagi para ahli kitab dan hukum agama Yahudi.
- source_word: πῶς
  choice: cara untuk
  rationale: Mengungkapkan pertanyaan mengenai cara atau sarana tindakan mereka secara alami dalam bahasa Indonesia.
- source_word: ἐν δόλῳ
  choice: dengan tipu daya
  rationale: Mempertahankan unsur penipuan dan kelicikan dalam δόλος, bukan sekadar kerahasiaan.
- source_word: κρατήσαντες
  choice: menangkap Dia
  rationale: Dalam konteks tindakan para penguasa terhadap Yesus, kata ini menunjuk pada penangkapan, sementara kemungkinan arti “menangkap dengan paksa” atau “menciduk” dicatat sebagai alternatif.
- source_word: ἀποκτείνωσιν
  choice: membunuh-Nya
  rationale: Padanan langsung dan alami bagi tindakan membunuh atau membuat seseorang mati.
theological_decisions:
- issue: Hubungan antara Paskah dan Roti Tidak Beragi
  choice: 'Kedua perayaan disebut secara tersendiri: “Hari Paskah dan Hari Raya Roti Tidak Beragi.”'
  alternative: Memperlakukan keduanya sebagai satu nama perayaan gabungan.
  rationale: Teks Yunani menyebut πάσχα dan ἄζυμα secara terpisah meskipun keduanya berkaitan erat; terjemahan mempertahankan pembedaan tersebut.
- issue: Sifat moral rencana para pemimpin
  choice: ἐν δόλῳ diterjemahkan “dengan tipu daya.”
  alternative: “secara diam-diam” atau “dengan sembunyi-sembunyi.”
  rationale: δόλος menyatakan penipuan atau kelicikan, bukan hanya tindakan rahasia, sehingga daya etis ungkapan sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum. Sebutan perayaan diberi bentuk yang jelas, sedangkan unsur duratif pada ἐζήτουν dipertahankan melalui kata “sedang.” Kapitalisasi pronomina untuk Yesus mengikuti kebiasaan luas dalam terjemahan Alkitab bahasa Indonesia tanpa menambah gelar yang tidak terdapat dalam teks sumber.
