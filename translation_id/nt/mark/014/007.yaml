id: MRK.14.7
reference: Mark 14:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, καὶ ὅταν θέλητε δύνασθε ⸀αὐτοῖς εὖ ποιῆσαι, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/007.yaml
  text: For you always have the poor with you[a], and whenever you want, you are able to do good to them; but you do not always have me.
translation:
  language: id
  text: Sebab orang-orang miskin selalu ada bersama kalian, dan kapan pun kalian mau, kalian dapat berbuat baik kepada mereka[a]. Namun, Aku tidak selalu ada bersama kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani ini berarti bertindak demi kebaikan mereka, bukan sekadar memiliki niat baik terhadap mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: selalu
  rationale: Padanan alami bagi adverbia yang menyatakan keberadaan atau ketersediaan yang terus-menerus, sekaligus mempertahankan pengulangan kontras dalam ayat ini.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai bahwa perkataan ini menjelaskan pernyataan sebelumnya tanpa mempersempit hubungan logisnya.
- source_word: τοὺς πτωχούς
  choice: orang-orang miskin
  rationale: Adjektiva substantival ini menunjuk kepada orang yang miskin; bentuk eksplisit ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: ada bersama kalian
  rationale: Secara idiomatis menyatakan keberadaan mereka di tengah atau dalam jangkauan para pendengar, bukan kepemilikan.
- source_word: ὅταν θέλητε
  choice: kapan pun kalian mau
  rationale: Mempertahankan sifat waktu yang tidak tertentu dan terbuka dari ὅταν dengan subjungtif.
- source_word: δύνασθε
  choice: kalian dapat
  rationale: Menyatakan kemampuan dengan bentuk yang alami dan langsung dalam bahasa Indonesia.
- source_word: αὐτοῖς εὖ ποιῆσαι
  choice: berbuat baik kepada mereka
  rationale: Mempertahankan makna idiom Yunani, yaitu bertindak demi kebaikan mereka, tanpa mempersempitnya hanya menjadi pemberian sedekah.
- source_word: ἐμὲ δὲ
  choice: Namun, Aku
  rationale: Menampilkan kontras yang jelas antara keberadaan orang miskin dan keberadaan Yesus.
- source_word: οὐ πάντοτε ἔχετε
  choice: tidak selalu ada bersama kalian
  rationale: Mempertahankan bentuk kini dan kontras temporal teks Yunani, tanpa mengubahnya menjadi pernyataan berjangka depan.
theological_decisions:
- issue: Potensi anggapan bahwa Yesus meremehkan kepedulian kepada orang miskin
  choice: Mempertahankan kontras antara keberadaan orang miskin yang terus berlangsung dan keberadaan Yesus yang tidak selalu bersama mereka, sambil tetap menegaskan kesempatan untuk berbuat baik kepada orang miskin.
  alternative: Menafsirkan ucapan ini sebagai penolakan terhadap kepedulian kepada orang miskin demi pengabdian kepada Yesus.
  rationale: Klausa “kapan pun kalian mau, kalian dapat berbuat baik kepada mereka” secara langsung menegaskan kesempatan berkelanjutan untuk menolong mereka. Kontrasnya bersifat temporal dan situasional; teks tidak meniadakan kewajiban belas kasih.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti jamak “kalian” dipakai karena verba Yunani berbentuk jamak. Huruf kapital pada “Aku” mengikuti konvensi umum terjemahan Alkitab Indonesia ketika Yesus berbicara. Penanda catatan kaki [a] ditempatkan tepat sesudah klausa yang diterangkannya.
