  source_fidelity: Teks Indonesia secara akurat menyampaikan γάρ sebagai penjelasan, kehadiran terus-menerus orang miskin, kondisi waktu terbuka “kapan pun kalian mau,” kemampuan untuk εὖ ποιῆσαι kepada mereka, serta kontras bahwa Yesus tidak selalu bersama para pendengar. Bentuk “Aku tidak selalu ada bersama kalian” merupakan pengungkapan Indonesia yang wajar untuk kontras ἐμὲ δὲ οὐ πάντοτε ἔχετε tanpa mengubahnya menjadi prediksi masa depan.
  naturalness: Bahasanya modern, jelas, dan sesuai register Alkitab Indonesia yang bermartabat. “Orang-orang miskin,” “kapan pun kalian mau,” dan “berbuat baik kepada mereka” terdengar alami. Penggunaan “kalian” konsisten dengan bentuk jamak Yunani.
  terminology: Istilah “orang-orang miskin” tepat untuk τοὺς πτωχούς. “Berbuat baik kepada mereka” mempertahankan cakupan luas εὖ ποιῆσαι dan tidak membatasinya pada sedekah. Kapitalisasi “Aku” selaras dengan konvensi yang dinyatakan untuk ucapan Yesus dan tidak memengaruhi makna.
