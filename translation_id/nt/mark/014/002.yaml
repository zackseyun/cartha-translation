  yaml_path: translation/nt/mark/014/002.yaml
  text: For they were saying[a], “Not during the feast, lest there be an uproar from the people.”
translation:
  language: id
  text: Sebab mereka berkata, “Jangan pada waktu perayaan itu, supaya jangan timbul keributan di antara rakyat[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari rakyat.” Bentuk genitif Yunani τοῦ λαοῦ dapat menunjukkan bahwa keributan itu terjadi di antara rakyat atau berasal dari mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: mereka berkata
  rationale: Bentuk imperfek menunjukkan ujaran yang sedang berlangsung atau berulang. Dalam bahasa Indonesia, aspek itu cukup tersirat oleh konteks; terjemahan seperti “terus berkata” dapat memberi penekanan berlebihan.
- source_word: γάρ
  choice: Sebab
  rationale: Menandai penjelasan bagi pernyataan sebelumnya dan mempertahankan hubungan logis antarayat.
- source_word: Μὴ
  choice: Jangan
  rationale: Negasi eliptis ini menyiratkan “jangan melakukannya.” “Jangan” mempertahankan bentuk ujaran yang ringkas dan deliberatif secara alami dalam bahasa Indonesia.
- source_word: ἐν τῇ ἑορτῇ
  choice: pada waktu perayaan itu
  rationale: ἐν digunakan secara temporal. “Perayaan itu” merujuk pada masa perayaan yang telah disebut dalam konteks, tanpa mempersempitnya secara tidak perlu.
- source_word: μήποτε
  choice: supaya jangan
  rationale: Mengungkapkan akibat yang dikhawatirkan dan hendak dicegah; bentuk ini alami serta jelas dalam bahasa Indonesia modern.
- source_word: ἔσται
  choice: timbul
  rationale: Dalam konstruksi ini, “timbul” mengungkapkan kemungkinan terjadinya kerusuhan secara idiomatis, sambil mempertahankan orientasi prospektif bentuk verba Yunani.
- source_word: θόρυβος
  choice: kerusuhan
  rationale: Kata ini menunjuk pada kekacauan atau kegemparan umum yang gaduh. “Kerusuhan” menyampaikan ancaman gangguan publik tanpa harus menyiratkan pemberontakan berskala besar.
- source_word: τοῦ λαοῦ
  choice: dari rakyat
  rationale: Genitif ini dapat menunjukkan sumber kerusuhan, yakni kerusuhan yang timbul dari rakyat; kemungkinan bahwa kerusuhan terjadi di tengah rakyat dipertahankan dalam catatan kaki.
