  terminology: Nama 'Petrus' dan 'Simon' konsisten dengan bentuk Indonesia yang lazim. Istilah 'berjaga-jaga' tidak memaksakan penafsiran teologis dan mempertahankan rentang makna γρηγορέω dalam konteks kontras dengan tidur.
