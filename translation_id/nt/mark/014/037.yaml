id: MRK.14.37
reference: Mark 14:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔρχεται καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Σίμων, καθεύδεις; οὐκ ἴσχυσας μίαν ὥραν γρηγορῆσαι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/037.yaml
  text: And he comes and finds them sleeping[a], and he says to Peter, “Simon, are you sleeping? Were you not able to stay awake one hour?”
translation:
  language: id
  text: Lalu Ia datang dan mendapati mereka sedang tidur. Ia berkata kepada Petrus, “Simon, apakah kamu sedang tidur? Tidak sanggupkah kamu tetap berjaga-jaga selama satu jam?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: Ia datang
  rationale: Mempertahankan kala kini historis Markus untuk menghadirkan narasi secara hidup; dalam bahasa Indonesia bentuk verba tidak menandai kala secara morfologis.
- source_word: εὑρίσκει
  choice: mendapati
  rationale: Menyatakan bahwa ketika datang Ia menemukan mereka dalam keadaan sedang tidur; pilihan ini alami dan tetap dekat dengan makna sumber.
- source_word: καθεύδοντας
  choice: sedang tidur
  rationale: Aspek berlangsung dari partisip Yunani dinyatakan dengan 'sedang', bukan sekadar keadaan 'tertidur'.
- source_word: λέγει
  choice: Ia berkata
  rationale: Padanan naratif Indonesia yang alami; ketiadaan penandaan kala pada verba Indonesia memungkinkan daya hidup kala kini historis tetap terasa tanpa bentuk yang janggal.
- source_word: τῷ Πέτρῳ
  choice: kepada Petrus
  rationale: Dativ penerima diterjemahkan secara idiomatis, dan nama Πέτρος mengikuti bentuk baku Indonesia.
- source_word: Σίμων
  choice: Simon
  rationale: Mempertahankan nama pribadi yang dipakai Yesus ketika menyapa Petrus.
- source_word: καθεύδεις
  choice: apakah kamu sedang tidur?
  rationale: Menyampaikan pertanyaan langsung dan teguran tentang tindakan yang sedang berlangsung dengan bahasa Indonesia modern.
- source_word: οὐκ ἴσχυσας
  choice: Tidak sanggupkah kamu
  rationale: ἰσχύω di sini menyatakan kemampuan atau kesanggupan; 'sanggup' alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi kekuatan fisik.
- source_word: μίαν ὥραν
  choice: selama satu jam
  rationale: Akusatif durasi dibuat eksplisit dengan 'selama' agar alami dan jelas dalam bahasa Indonesia.
- source_word: γρηγορῆσαι
  choice: tetap berjaga-jaga
  rationale: Dalam kontras dengan tidur, frasa ini mencakup tetap terjaga sekaligus waspada, sehingga mempertahankan keluasan makna γρηγορέω.
theological_decisions:
- issue: Kala kini historis dalam gaya narasi Markus
  choice: Tidak menambahkan penanda lampau dan memakai urutan naratif 'Ia datang ... mendapati ... berkata'.
  alternative: Menambahkan penanda lampau seperti 'telah' atau 'kemudian ... berkata' untuk meratakan narasi menjadi lampau eksplisit.
  rationale: Bahasa Indonesia tidak mewajibkan penandaan kala. Bentuk tanpa penanda waktu mencerminkan daya hidup narasi Markus tanpa menghasilkan konstruksi yang tidak alami.
- issue: Makna γρηγορέω dalam konteks tidur dan kewaspadaan
  choice: tetap berjaga-jaga
  alternative: tetap terjaga
  rationale: Konteks langsung menekankan tidak tidur, tetapi verba itu juga membawa unsur kesiagaan. 'Berjaga-jaga' mempertahankan kedua lapisan tersebut tanpa menentukan makna hanya sebagai melek secara fisik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'kamu' dipilih karena Yesus berbicara langsung kepada seorang murid; kapitalisasi pronomina 'Ia' mengikuti kebiasaan penerbitan Alkitab Indonesia. Tanda tanya pada teguran kedua mempertahankan bentuk pertanyaan retoris sumber.
