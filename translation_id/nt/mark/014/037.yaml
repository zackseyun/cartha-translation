  source_fidelity: 'Teks Indonesia secara akurat menerjemahkan urutan δράμα dan makna utama Yunani: ἔρχεται/εὑρίσκει/λέγει terwakili secara wajar dalam narasi Indonesia, καθεύδοντας dan καθεύδεις dinyatakan sebagai tindakan yang sedang berlangsung, dan pertanyaan retoris οὐκ ἴσχυσας ... γρηγορῆσαι dipertahankan sebagai teguran tentang ketidaksanggupan untuk tetap terjaga. Sapaan ''Simon'' kepada Petrus dipertahankan dengan tepat.'
