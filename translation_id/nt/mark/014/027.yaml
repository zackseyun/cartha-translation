  text: Καὶ λέγει αὐτοῖς ὁ Ἰησοῦς ὅτι Πάντες ⸀σκανδαλισθήσεσθε, ὅτι γέγραπται· Πατάξω τὸν ποιμένα, καὶ ⸂τὰ πρόβατα διασκορπισθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/027.yaml
  text: 'And Jesus says to them[a], “You will all fall away, because it is written: ‘I will strike the shepherd, and the sheep will be scattered.’”'
translation:
  language: id
  text: Lalu Yesus berkata kepada mereka, “Kamu semua akan tersandung[a], sebab ada tertulis, ‘Aku akan memukul gembala itu, dan domba-domba akan tercerai-berai.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan goyah” atau “akan dibuat tersandung.” Dalam konteks ini, ungkapan tersebut juga dapat menunjuk pada kegagalan para murid dan tindakan mereka meninggalkan Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bahasa Indonesia tidak memiliki kala kini historis yang sepadan secara gramatikal; bentuk naratif “berkata” menyampaikan tindakan tersebut secara alami tanpa menghilangkan gaya langsung Markus.
- source_word: σκανδαλισθήσεσθε
  choice: akan meninggalkan Aku
  rationale: Dalam konteks ini verba tersebut menunjuk pada kegagalan para murid ketika menghadapi penangkapan Yesus, yang tampak dalam tercerai-berainya mereka. Ungkapan ini alami dalam bahasa Indonesia, sedangkan arti harfiah dan bentuk pasifnya dipertahankan dalam catatan kaki.
- source_word: γέγραπται
  choice: ada tertulis
  rationale: Rumusan baku untuk memperkenalkan kutipan Kitab Suci dan mencerminkan keadaan yang tetap berlaku dari bentuk perfektum pasif Yunani.
- source_word: Πατάξω
  choice: Aku akan memukul
  rationale: Padanan langsung dan modern yang mempertahankan daya verba serta bentuk orang pertama dalam kutipan nubuat.
- source_word: τὸν ποιμένα
  choice: gembala itu
  rationale: Mempertahankan bentuk tunggal dan ketakrifan nomina dalam gambaran nubuat.
- source_word: τὰ πρόβατα
  choice: domba-domba
  rationale: Padanan Indonesia yang alami untuk bentuk jamak dan mempertahankan metafora kawanan.
- source_word: διασκορπισθήσονται
  choice: akan tercerai-berai
  rationale: Mengungkapkan hasil pasif berupa tercerainya kawanan sesudah gembala dipukul; bentuk ini lebih alami daripada konstruksi pasif yang kaku dalam bahasa Indonesia.
theological_decisions:
- issue: Makna σκανδαλισθήσεσθε mengenai tanggapan para murid terhadap Yesus
  choice: akan meninggalkan Aku
  alternative: akan tersandung; akan dibuat tersandung; akan goyah
  rationale: Konteks langsung menubuatkan kegagalan dan tercerai-berainya para murid, sehingga “meninggalkan Aku” menyampaikan tindakan nyata mereka tanpa harus menyatakan kemurtadan permanen. Karena teks Yunani tidak menyebut objek “Aku” secara eksplisit dan bentuk verbanya dapat dipahami secara lebih harfiah atau pasif, kemungkinan itu dicatat agar ketegangan maknanya tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Lalu” menghubungkan ujaran ini dengan alur sebelumnya; kapitalisasi “Aku” mengikuti rujukan langsung kepada Yesus. Kutipan nubuat dipertahankan sebagai ujaran orang pertama.
