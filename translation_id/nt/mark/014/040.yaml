  text: καὶ ⸂πάλιν ἐλθὼν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ ⸂αὐτῶν οἱ ὀφθαλμοὶ⸃ ⸀καταβαρυνόμενοι, καὶ οὐκ ᾔδεισαν τί ⸂ἀποκριθῶσιν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/040.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down, and they did not know what they should answer him.
translation:
  language: id
  text: Ketika Ia datang lagi, Ia mendapati mereka sedang tidur, sebab mata mereka terasa berat[a], dan mereka tidak tahu apa yang harus mereka jawab kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, mata mereka “sedang dibebani” atau “dibuat berat.” Gambaran Yunani ini menyatakan bahwa mata mereka terasa berat karena kantuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐλθὼν
  choice: Ketika Ia datang lagi
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama; bentuk temporal ini alami dalam bahasa Indonesia dan πάλιν dipertahankan sebagai “lagi” untuk menandai pengulangan.
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: didapati-Nya mereka sedang tidur
  rationale: Konstruksi ini mempertahankan Yesus sebagai pelaku dan menampilkan καθεύδοντας sebagai tindakan yang sedang berlangsung.
- source_word: ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ καταβαρυνόμενοι
  choice: sebab mata mereka terasa berat
  rationale: Ungkapan Indonesia yang alami ini mempertahankan citra mata yang terbebani kantuk, sedangkan “sebab” menyampaikan fungsi penjelas γάρ.
- source_word: οὐκ ᾔδεισαν
  choice: mereka tidak tahu
  rationale: Padanan langsung bagi οἶδα dalam konteks ini, tanpa mengubahnya menjadi persoalan pemahaman.
- source_word: τί ἀποκριθῶσιν αὐτῷ
  choice: harus menjawab apa kepada-Nya
  rationale: Menyampaikan pertanyaan tak langsung dengan subjungtif deliberatif secara alami serta mempertahankan arah jawaban kepada Yesus.
