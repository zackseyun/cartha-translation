id: MRK.14.41
reference: Mark 14:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔρχεται τὸ τρίτον καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἀπέχει· ἦλθεν ἡ ὥρα, ἰδοὺ παραδίδοται ὁ υἱὸς τοῦ ἀνθρώπου εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/041.yaml
  text: And he comes the third time and says to them[a], “Are you still sleeping and resting? It is enough; the hour has come. Look[c][b], the Son of Man is being handed over into the hands of sinners.”
translation:
  language: id
  text: Lalu Ia datang untuk ketiga kalinya dan berkata kepada mereka, “Masihkah kalian tidur dan beristirahat?[a] Cukuplah![b] Saatnya sudah tiba. Lihat, Anak Manusia sedang diserahkan ke tangan orang-orang berdosa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tidurlah terus dan beristirahatlah.” Susunan bahasa Yunani dapat dipahami sebagai izin atau perintah ironis, ataupun sebagai pertanyaan retoris.
    reason: alternative_reading
  - marker: b
    text: Ungkapan yang diterjemahkan “Cukuplah!” sulit dipastikan artinya. Kemungkinan lain ialah “Sudah cukup”; sebagian orang mengusulkan arti komersial seperti “pembayarannya telah diterima lunas,” tetapi arti itu kurang mungkin dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται τὸ τρίτον
  choice: Ia datang untuk ketiga kalinya
  rationale: Bentuk kini naratif diterjemahkan secara lugas, sedangkan τὸ τρίτον diungkapkan dengan idiom Indonesia yang alami.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Masihkah kalian tidur dan beristirahat?
  rationale: Dalam konteks ini, bentuk tersebut wajar dipahami sebagai pertanyaan retoris bernada teguran. Karena bahasa Yunani juga dapat dipahami sebagai pernyataan atau izin ironis, kemungkinan itu dicatat dalam catatan kaki.
- source_word: ἀπέχει
  choice: Cukuplah!
  rationale: Ungkapan Yunani ini sulit ditafsirkan. 'Cukuplah!' menyampaikan peralihan tegas menuju datangnya saat penangkapan tanpa memasukkan arti teknis yang spekulatif.
- source_word: ἦλθεν ἡ ὥρα
  choice: Saatnya sudah tiba
  rationale: Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan gagasan tentang waktu yang telah ditetapkan.
- source_word: ἰδοὺ
  choice: Lihat
  rationale: Padanan modern dan langsung yang mempertahankan daya penunjuk serta penarik perhatian.
- source_word: παραδίδοται
  choice: sedang diserahkan
  rationale: Mempertahankan arti dasar tindakan menyerahkan dan bentuk pasif kini, tanpa mempersempitnya hanya menjadi pengkhianatan Yudas.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Padanan baku bagi sebutan ini yang mempertahankan fungsi idiomatis dan titulernya.
- source_word: εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν
  choice: ke tangan orang-orang berdosa
  rationale: Mempertahankan gambaran konkret tentang penyerahan ke dalam kuasa pihak lain, dengan susunan yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Daya Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: 'Pertanyaan retoris: ''Masihkah kalian tidur dan beristirahat?'''
  alternative: 'Pernyataan atau izin ironis: ''Tidurlah terus dan beristirahatlah.'''
  rationale: Naskah Yunani paling awal tidak menentukan tanda baca, dan bentuk verba dapat dipahami dengan kedua cara. Teks utama memakai teguran retoris yang alami dalam konteks, sementara ambiguitas asli dipertahankan dalam catatan kaki.
- issue: Arti ἀπέχει
  choice: '''Cukuplah!'''
  alternative: '''Sudah cukup'' atau, dengan arti komersial yang kurang mungkin di sini, ''pembayarannya telah diterima lunas.'''
  rationale: Ungkapan tersebut sulit dan bergantung pada konteks. Pilihan utama cocok dengan perubahan dramatis dalam adegan tanpa memasukkan penafsiran teologis yang spekulatif.
- issue: Terjemahan παραδίδοται
  choice: '''sedang diserahkan'''
  alternative: '''sedang dikhianati'''
  rationale: Pilihan ini mempertahankan cakupan makna verba Yunani dan tidak membatasi pelaku atau prosesnya hanya pada pengkhianatan Yudas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. Sapaan jamak 'kalian' memperjelas bahwa Yesus berbicara kepada beberapa murid. Tanda seru pada 'Cukuplah!' menandai peralihan tegas dalam adegan tanpa menghapus kesulitan leksikal yang dijelaskan dalam catatan kaki.
