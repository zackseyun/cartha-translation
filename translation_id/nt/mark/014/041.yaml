  verdict: approve
  source_fidelity: 'Teks Indonesia secara setia mencerminkan unsur-unsur utama Yunani: kedatangan untuk ketiga kali, ujaran kepada beberapa murid, kemungkinan pembacaan interogatif pada Καθεύδετε ... ἀναπαύεσθε, ungkapan sulit ἀπέχει, tibanya ώρα, seruan ἰδού, serta penyerahan Anak Manusia ke dalam tangan orang-orang berdosa. “Sedang diserahkan” dengan baik mempertahankan bentuk pasif kini dan tidak mempersempit παραδίδοται menjadi pengkhianatan oleh Yudas saja.'
  naturalness: Bahasanya baku, modern, dan lancar. “Masihkah kalian tidur dan beristirahat?” berfungsi alami sebagai teguran retoris; “Saatnya sudah tiba” dan “ke tangan orang-orang berdosa” juga idiomatis dalam register naratif yang khidmat.
  terminology: “Anak Manusia” adalah padanan baku dan tepat untuk ὁ υἱὸς τοῦ ἀνθρώπου. “Orang-orang berdosa” secara wajar menerjemahkan substantiva plural τῶν ἁμαρτωλῶν. Catatan kaki a dan b terpasang pada unsur yang memang diperselisihkan dan tidak memaksakan pembacaan doktrinal tertentu.
