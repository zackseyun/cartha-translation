  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν εἰσέλθῃ εἴπατε τῷ οἰκοδεσπότῃ ὅτι Ὁ διδάσκαλος λέγει· Ποῦ ἐστιν τὸ κατάλυμά ⸀μου ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/014.yaml
  text: And wherever he enters[a], say to the master of the house, ‘The Teacher says, “Where is my guest room where I may eat the Passover with my disciples?”’
translation:
  language: id
  text: Ke mana pun ia masuk, katakanlah kepada tuan rumah itu, “Sang Guru berkata, ‘Di manakah ruangan tamu saya, tempat saya dapat makan perjamuan Paskah bersama murid-murid saya?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου ἐὰν εἰσέλθῃ
  choice: Di mana pun ia masuk
  rationale: Konstruksi ὅπου dengan ἐάν dan bentuk subjungtif menyatakan tempat yang tidak ditentukan; “di mana pun” mempertahankan nuansa itu tanpa menambahkan lokasi yang tidak disebutkan secara eksplisit.
- source_word: εἴπατε
  choice: katakanlah
  rationale: Bentuk imperatif jamak ini merupakan perintah kepada kedua murid dan secara alami memperkenalkan perkataan langsung.
- source_word: οἰκοδεσπότῃ
  choice: tuan rumah
  rationale: Istilah ini menunjuk kepada orang yang memegang wewenang atas rumah tangga; “tuan rumah” merupakan padanan Indonesia yang alami dalam konteks ini.
- source_word: Ὁ διδάσκαλος
  choice: Sang Guru
  rationale: διδάσκαλος dipakai sebagai sebutan yang dapat dikenali bagi Yesus. “Sang Guru” mempertahankan fungsi sebutan itu tanpa mengubahnya menjadi gelar kristologis lain.
- source_word: κατάλυμά μου
  choice: ruangan untuk saya
  rationale: κατάλυμα di sini menunjuk pada tempat atau ruangan bagi tamu, sedangkan μου menyatakan kaitannya dengan Yesus. Ungkapan ini alami dalam permintaan mengenai ruangan yang disediakan baginya dan menghindari “ruang tamu,” yang dalam bahasa Indonesia biasanya berarti ruang untuk menerima tamu.
- source_word: τὸ πάσχα
  choice: perjamuan Paskah
  rationale: Dalam hubungan dengan kata kerja “makan,” πάσχα menunjuk pada santapan Paskah. “Perjamuan Paskah” membuat maksud itu jelas bagi pembaca Indonesia dan menghindari ungkapan janggal “makan Paskah.”
- source_word: μετὰ τῶν μαθητῶν μου
  choice: bersama murid-murid saya
  rationale: “Murid-murid” mempertahankan makna relasional dan pembentukan dari μαθηταί, sementara “saya” menerjemahkan μου.
- source_word: φάγω
  choice: saya dapat makan
  rationale: Bentuk subjungtif dalam klausa yang menerangkan tempat menyatakan tindakan yang dimaksud atau dimungkinkan di ruangan yang dicari; “dapat makan” mempertahankan nuansa tersebut tanpa menjadikannya sekadar pernyataan masa depan.
theological_decisions:
- issue: Penerjemahan sebutan διδάσκαλος bagi Yesus
  choice: Sang Guru
  alternative: Guru itu; Tuan
  rationale: Makna leksikal biasa adalah “guru.” Bentuk “Sang Guru” menunjukkan pemakaian sebagai sebutan yang dikenal dalam narasi, tanpa memasukkan gagasan kewenangan tambahan yang dapat tersirat dalam “Tuan.”
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Bentuk “ruangan untuk saya” dipilih agar alami dalam konteks permintaan tempat yang telah disediakan, sekaligus mempertahankan kata ganti milik Yunani. Huruf kecil pada kata ganti orang mengikuti ejaan Indonesia umum dan tidak dimaksudkan sebagai penilaian teologis.
