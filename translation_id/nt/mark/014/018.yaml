  text: καὶ ἀνακειμένων αὐτῶν καὶ ἐσθιόντων ⸂ὁ Ἰησοῦς εἶπεν⸃· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με ὁ ἐσθίων μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/018.yaml
  text: And while they were reclining and eating[a], Jesus said, “Truly I tell you[c][b], one of you will betray me—one who is eating with me.”
translation:
  language: id
  text: Sementara mereka sedang bersandar sambil makan,[a] Yesus berkata, “Sesungguhnya, Aku berkata kepada kalian,[b] salah seorang di antara kalian akan mengkhianati Aku[c]—seorang yang makan bersama-Ku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bersandar merupakan posisi yang lazim dalam jamuan resmi pada masa itu.
    reason: cultural_note
  - marker: b
    text: Atau, secara lebih harfiah, “Amin, Aku berkata kepada kalian.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “akan menyerahkan Aku.” Kata Yunani yang dipakai dapat berarti menyerahkan, menyerahkan, atau mengkhianati; dalam konteks ini, tindakan itu dilakukan dengan tidak setia oleh salah seorang yang makan bersama Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακειμένων
  choice: duduk bersandar
  rationale: Partisipel ini menggambarkan posisi berbaring atau bersandar di tempat makan yang lazim dalam jamuan resmi dunia Mediterania kuno. “Duduk bersandar” mempertahankan latar sejarah tanpa memberi kesan bahwa mereka sekadar berbaring untuk tidur.
- source_word: ἐσθιόντων / ἐσθίων
  choice: makan / yang makan
  rationale: Kata kerja ini secara langsung berarti “makan”. Partisipel berartikel pada bagian akhir diterjemahkan sebagai frasa relatif, “seorang yang makan bersama-Ku”.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya, Aku berkata kepada kalian
  rationale: Ini adalah formula pembuka khidmat yang khas dalam ucapan Yesus. “Sesungguhnya” menyampaikan daya penegasan Ἀμήν secara wajar dalam bahasa Indonesia modern; bentuk harfiah dicatat dalam catatan kaki.
- source_word: εἷς ἐξ ὑμῶν
  choice: salah seorang dari antara kalian
  rationale: Ungkapan partitif ini menunjukkan bahwa orang tersebut merupakan satu anggota kelompok yang sedang hadir. “Dari antara” mempertahankan unsur ἐξ tanpa terasa tidak alami.
- source_word: παραδώσει
  choice: akan mengkhianati
  rationale: Secara leksikal kata ini dapat berarti “menyerahkan”, tetapi dalam konteks seorang sahabat semeja yang menyerahkan Yesus kepada lawan-lawannya, “mengkhianati” menyampaikan dimensi relasional dan moralnya. Makna yang lebih harfiah tetap dicantumkan dalam catatan kaki.
- source_word: μετ’ ἐμοῦ
  choice: bersama-Ku
  rationale: Terjemahan langsung dan alami bagi ungkapan penyertaan sederhana ini.
theological_decisions:
- issue: Makna παραδώσει dalam kisah penderitaan
  choice: akan mengkhianati Aku
  alternative: akan menyerahkan Aku
  rationale: Kata Yunani itu sendiri tidak selalu berarti “mengkhianati”, tetapi konteksnya menyangkut seorang rekan dekat yang makan bersama Yesus dan bertindak melawan-Nya. Teks utama menyatakan pengkhianatan tersebut, sementara catatan kaki mempertahankan keluasan makna leksikalnya.
translation_notes:
  register: Bahasa dibuat modern, jelas, dan khidmat. “Kalian” dipakai untuk menandai dengan jelas bahwa kata ganti Yunani ὑμῖν/ὑμῶν berbentuk jamak. Huruf kapital pada “Aku/-Ku” mengikuti kebiasaan ortografi Alkitab bahasa Indonesia ketika Yesus berbicara, tanpa menambahkan penafsiran ke dalam isi ayat.
