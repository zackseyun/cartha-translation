  terminology: “Jiwa-Ku” mempertahankan ψυχή tanpa memaksakan penafsiran antropologis tertentu. “Berjaga-jagalah” merupakan padanan yang baik untuk γρηγορεῖτε. Kapitalisasi pronomina ilahi dipertahankan sesuai kebiasaan editorial Indonesia.
