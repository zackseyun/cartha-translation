  text: καὶ λέγει αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/034.yaml
  text: And he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch.”
translation:
  language: id
  text: Ia berkata kepada mereka, “Jiwa-Ku sangat sedih, sampai mati.[a] Tinggallah di sini dan berjaga-jagalah.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jiwa-Ku sangat berdukacita, bahkan sampai mati” atau “sampai pada titik kematian.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tetaplah terjaga”; perintah ini dapat mencakup baik tidak tidur maupun tetap waspada.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bahasa Indonesia tidak menandai kala pada verba. Bentuk “berkata” secara alami dapat menyampaikan kala kini historis yang menghidupkan narasi Markus tanpa perlu menambahkan penanda waktu.
- source_word: Περίλυπός
  choice: diliputi kesedihan yang amat dalam
  rationale: Ungkapan ini menyampaikan dukacita atau tekanan batin yang sangat kuat dengan bahasa Indonesia modern dan wajar.
- source_word: ψυχή
  choice: jiwa
  rationale: “Jiwa” mempertahankan gambaran Yunani tentang batin atau keseluruhan diri Yesus dalam penderitaan, tanpa mempersempitnya hanya menjadi perasaan.
- source_word: ἕως θανάτου
  choice: sampai mati rasanya
  rationale: Ungkapan idiomatis ini menyatakan kesedihan yang mencapai batas kematian dan terdengar alami dalam bahasa Indonesia, sambil mempertahankan daya emosional teks.
- source_word: μείνατε
  choice: tinggallah
  rationale: Bentuk perintah ini meminta para murid tetap berada di tempat itu; “tinggallah” jelas, alami, dan sesuai dengan nada khidmat adegan.
- source_word: ὧδε
  choice: di sini
  rationale: Padanan lokatif langsung dan alami untuk ὧδε.
- source_word: γρηγορεῖτε
  choice: tetaplah berjaga-jaga
  rationale: Pilihan ini mencakup tindakan tidak tertidur sekaligus kewaspadaan yang lebih luas, sesuai dengan konteks.
theological_decisions:
- issue: Makna ψυχή dalam perkataan Yesus
  choice: jiwa
  alternative: diri; hidup
  rationale: “Jiwa” mempertahankan kedalaman antropologis ungkapan tersebut dan menggambarkan penderitaan manusiawi Yesus tanpa memasukkan penjelasan doktrinal tambahan.
- issue: Daya ungkapan ἕως θανάτου
  choice: sampai mati rasanya
  alternative: bahkan sampai mati; sampai pada titik kematian
  rationale: Terjemahan utama menyatakan hebatnya kesedihan tanpa memutuskan secara kaku apakah frasa itu menunjuk pada rasa seakan-akan akan mati atau kesedihan yang berlanjut hingga kematian.
- issue: Cakupan perintah γρηγορεῖτε
  choice: tetaplah berjaga-jaga
  alternative: tetaplah terjaga; jangan tidur
  rationale: Perintah ini mencakup keterjagaan jasmani dan kewaspadaan batin; terjemahan tidak membatasinya hanya pada larangan tidur.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan langsung. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan kalimat dibuat alami tanpa menghilangkan intensitas emosi atau cakupan ganda perintah untuk berjaga-jaga.
