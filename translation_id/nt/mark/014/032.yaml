  verdict: revise
  source_fidelity: Frasa “sampai Aku selesai berdoa” menambahkan gagasan penyelesaian tindakan yang tidak dinyatakan secara eksplisit oleh ἕως προσεύξωμαι. Konstruksi Yunani menandai batas waktu ‘sampai Aku berdoa’ tanpa perlu memperjelasnya sebagai ‘selesai’. Selebihnya, ‘suatu tempat’, ‘Getsemani’, ‘murid-murid-Nya’, dan perintah ‘Duduklah di sini’ setia pada teks sumber.
  naturalness: Teksnya modern, jelas, dan berregister pantas. “Duduklah di sini sampai Aku berdoa” tetap alami dalam bahasa Indonesia naratif dan menghindari penambahan aspek ‘selesai’. Penggunaan bentuk lampau/naratif untuk kala kini historis Markus dapat diterima dalam bahasa Indonesia.
  terminology: “Getsemani” dan “murid-murid-Nya” merupakan istilah dan ejaan yang lazim. Kapitalisasi pronomina bagi Yesus konsisten dengan konvensi penerbitan Alkitab Indonesia dan tidak mengubah makna.
