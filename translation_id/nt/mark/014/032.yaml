  text: Καὶ ἔρχονται εἰς χωρίον οὗ τὸ ὄνομα Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς αὐτοῦ· Καθίσατε ὧδε ἕως προσεύξωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/032.yaml
  text: And they came to a place whose name was Gethsemane[a], and he says to his disciples, “Sit here until I pray.”
translation:
  language: id
  text: Lalu mereka tiba di suatu tempat yang bernama Getsemani, dan Yesus berkata kepada murid-murid-Nya, “Duduklah di sini sampai Aku berdoa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: mereka tiba
  rationale: Bentuk kini historis Yunani dialihkan ke bentuk naratif lampau yang wajar dalam bahasa Indonesia; 'tiba' menyampaikan gerak menuju tempat itu tanpa ungkapan kaku.
- source_word: χωρίον
  choice: suatu tempat
  rationale: Kata ini dapat menunjuk tempat, bidang tanah, atau lahan milik. 'Suatu tempat' mempertahankan keluasan makna tanpa menentukan bahwa lokasi itu kebun, ladang, atau perkebunan.
- source_word: οὗ τὸ ὄνομα Γεθσημανί
  choice: yang bernama Getsemani
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan setia pada keterangan nama dalam teks Yunani.
- source_word: λέγει
  choice: Yesus berkata
  rationale: Bentuk kini historis diterjemahkan dengan bentuk naratif Indonesia yang alami. Subjek tersirat diperjelas sebagai 'Yesus' agar rujukannya jelas, tanpa menambah pelaku baru.
- source_word: μαθηταῖς
  choice: murid-murid-Nya
  rationale: '''Murid'' mempertahankan hubungan guru-murid yang dinyatakan oleh μαθητής; akhiran ''-Nya'' mewakili αὐτοῦ.'
- source_word: Καθίσατε
  choice: Duduklah
  rationale: Imperatif langsung ini diterjemahkan secara ringkas, alami, dan santun sesuai bentuk perintah bahasa Indonesia.
- source_word: ὧδε
  choice: di sini
  rationale: Padanan deiktis langsung dan alami.
- source_word: ἕως προσεύξωμαι
  choice: sampai Aku selesai berdoa
  rationale: ἕως dengan aoristus subjungtif menandai batas waktu. Penambahan 'selesai' membuat makna batas akhir itu jelas dan alami dalam bahasa Indonesia, bukan sekadar berlangsung bersamaan seperti 'sementara Aku berdoa'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kala kini historis Markus dinaturalkan menjadi narasi lampau karena bahasa Indonesia tidak menandai kala secara gramatikal dan pergantian ke bentuk kini akan terasa kurang alami. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
