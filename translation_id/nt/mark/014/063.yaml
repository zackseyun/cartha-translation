  text: Then the high priest tore his garments and said[b][a], “What further need do we have of witnesses?”
translation:
  language: id
  text: Lalu Imam Besar merobek pakaian-pakaiannya[a] dan berkata[b], “Untuk apa lagi kita memerlukan saksi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pakaian yang dikenakannya”; lebih khusus, “tunik-tuniknya.”
    reason: lexical_alternative
  - marker: b
    text: 'Kata kerja Yunani berbentuk kini historis: “berkata” atau “mengatakan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεὺς
  choice: Imam Besar
  rationale: Padanan baku untuk pemegang jabatan tunggal yang memimpin pemeriksaan ini; huruf kapital menandai jabatan khusus dalam konteks tersebut.
- source_word: διαρρήξας
  choice: merobek
  rationale: Menyampaikan tindakan merobek dengan jelas dan wajar dalam bahasa Indonesia modern tanpa nuansa arkais.
- source_word: τοὺς χιτῶνας αὐτοῦ
  choice: pakaiannya
  rationale: χίτων dapat menunjuk pada tunik, tetapi 'pakaian' lebih alami dalam adegan idiomatis ini dan tidak mempersempitnya menjadi busana upacara. Bentuk kepemilikan Indonesia tidak menandai perbedaan tunggal-jamak sejelas bahasa Yunani.
- source_word: λέγει
  choice: berkata
  rationale: Kala kini historis Yunani dialihkan menjadi bentuk naratif Indonesia yang alami; perbedaan bentuk sumber dicatat dalam catatan kaki.
- source_word: Τί ἔτι χρείαν ἔχομεν
  choice: Untuk apa lagi kita memerlukan
  rationale: Ungkapan ini alami dan retoris dalam bahasa Indonesia, serta mempertahankan gagasan bahwa saksi tambahan dianggap tidak lagi diperlukan.
- source_word: μαρτύρων
  choice: saksi
  rationale: Dalam bahasa Indonesia, nomina setelah 'memerlukan' tidak wajib ditandai jumlahnya; konteks menyampaikan kebutuhan akan para saksi atau kesaksian lebih lanjut.
theological_decisions:
- issue: Makna tindakan Imam Besar merobek pakaian
  choice: Tindakan itu diterjemahkan secara harfiah tanpa menjelaskan motifnya.
  alternative: Menambahkan bahwa tindakan itu mengungkapkan kemarahan atau tanggapan terhadap penghujatan.
  rationale: Ayat ini hanya menuturkan tindakan dan perkataannya, tanpa secara eksplisit menafsirkan arti gerak tersebut; terjemahan mempertahankan ketegangan naratif dan teologis itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan pertanyaan dibuat idiomatis bagi pembaca umum, sementara penafsiran atas tindakan merobek pakaian tidak dimasukkan ke dalam teks.
