  text: ὁ ⸀δὲ εἶπεν αὐτοῖς· ⸀Εἷς τῶν δώδεκα, ὁ ἐμβαπτόμενος μετ’ ἐμοῦ εἰς ⸀τὸ τρύβλιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/020.yaml
  text: And he said to them[a], “One of the twelve, the one dipping with me into the bowl.”
translation:
  language: id
  text: Ia berkata kepada mereka, “Salah seorang dari kedua belas itu, yaitu dia yang mencelupkan bersama-Ku ke dalam mangkuk[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pinggan.” Kata Yunani τρύβλιον dapat merujuk pada mangkuk atau pinggan yang digunakan untuk makan.
    reason: alternatif leksikal untuk τρύβλιον
lexical_decisions:
- source_word: δὲ
  choice: Ia berkata
  rationale: δέ berfungsi sebagai penghubung naratif ringan; dalam bahasa Indonesia hubungan ini dapat dibiarkan implisit agar kalimat mengalir alami.
- source_word: εἶπεν αὐτοῖς
  choice: Ia berkata kepada mereka
  rationale: Terjemahan langsung yang mempertahankan pengantar ujaran tanpa menambah nuansa penafsiran.
- source_word: Εἷς τῶν δώδεκα
  choice: Salah seorang dari kedua belas itu
  rationale: Frasa ini mengidentifikasi pengkhianat sebagai anggota kelompok inti yang sudah dikenal; 'itu' memberi kekhususan secara alami tanpa harus menjadikannya gelar.
- source_word: ὁ ἐμβαπτόμενος
  choice: yaitu dia yang mencelupkan
  rationale: Bentuk partisipel kini mempertahankan tindakan yang sedang berlangsung atau langsung terkait dengan perjamuan; 'yaitu dia yang' menyampaikan daya identifikasinya.
- source_word: μετ’ ἐμοῦ
  choice: bersama-Ku
  rationale: μετά dengan genitif menyatakan kebersamaan; 'bersama-Ku' lebih jelas daripada sekadar 'dengan-Ku' dalam konstruksi ini.
- source_word: εἰς τὸ τρύβλιον
  choice: ke dalam mangkuk
  rationale: εἰς menunjukkan gerak masuk, sedangkan τρύβλιον menunjuk pada wadah makan yang dapat berupa mangkuk atau pinggan; 'mangkuk' merupakan padanan modern yang mudah dipahami.
