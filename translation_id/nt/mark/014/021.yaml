    issue: Demonstratif “orang itu” tidak tampak dalam klausa ucapan celaka.
    rationale: Teks Yunani berbunyi τῷ ἀνθρώπῳ ἐκείνῳ (“kepada/orang itu”). Bentuk “orang yang” menyampaikan rujukan relatif, tetapi mengurangi penegasan demonstratif yang sengaja dipakai dan diulang dalam kalimat berikutnya.
  - severity: low
    issue: Predikat idiomatis pada kalimat terakhir dapat diperjelas.
    rationale: “Lebih baik bagi orang itu sekiranya ...” dapat dipahami, tetapi “Adalah lebih baik bagi orang itu jika ...” lebih lengkap dan alami dalam ragam Indonesia modern, sambil tetap menyatakan evaluasi kontrafaktual καλὸν αὐτῷ εἰ.
