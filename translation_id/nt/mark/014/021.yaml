  to: Sebab Anak Manusia akan pergi sebagaimana ada tertulis tentang Dia, tetapi celakalah orang itu, yang olehnya Anak Manusia dikhianati.[a] Adalah lebih baik bagi orang itu jika ia tidak dilahirkan.
  rationale: Revisi mempertahankan penanda demonstratif “orang itu” untuk τῷ ἀνθρώπῳ ἐκείνῳ dan memperbaiki kelancaran idiom kontrafaktual pada kalimat terakhir. “Yang olehnya” merupakan padanan Indonesia yang jelas untuk διά dengan genitif dalam konteks ini, sementara “dikhianati” dan alternatif harfiahnya tetap menjaga rentang makna παραδίδοται.
