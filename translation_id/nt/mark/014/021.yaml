id: MRK.14.21
reference: Mark 14:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ὅτι ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· ⸀καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/021.yaml
  text: For the Son of Man goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been good for him if that man had not been born.
translation:
  language: id
  text: Sebab Anak Manusia akan pergi sebagaimana ada tertulis tentang Dia, tetapi celakalah orang itu, yang olehnya Anak Manusia dikhianati.[a] Adalah lebih baik bagi orang itu jika ia tidak dilahirkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “diserahkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Mengungkapkan daya penjelas atau kausal yang menghubungkan perkataan ini dengan konteks sebelumnya.
- source_word: ὁ μὲν ... δὲ
  choice: akan pergi ... tetapi celakalah
  rationale: Kontras μέν...δέ dinyatakan secara alami dalam bahasa Indonesia dengan 'tetapi', sementara μέν tidak perlu diterjemahkan tersendiri.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan gelar khas yang digunakan Yesus bagi diri-Nya serta kemungkinan gema Danielisnya.
- source_word: ὑπάγει
  choice: akan pergi
  rationale: Dalam konteks sengsara, bentuk kini Yunani menunjuk pada perjalanan menuju hasil yang sudah dekat; bahasa Indonesia secara alami memakai 'akan' untuk orientasi waktu tersebut tanpa menentukan secara eksplisit bahwa artinya adalah mati.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: sebagaimana ada tertulis tentang Dia
  rationale: Mempertahankan daya perbandingan καθώς dan keadaan tetap dari γέγραπται dengan ungkapan Indonesia yang lazim dalam konteks Kitab Suci.
- source_word: οὐαὶ
  choice: celakalah
  rationale: Padanan profetis yang alami dan khidmat, dengan daya kecaman yang lebih kuat daripada sekadar ungkapan kesedihan.
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: orang yang
  rationale: Menunjuk kepada individu tertentu yang kemudian diterangkan oleh klausa relatif; 'orang' alami dalam bahasa Indonesia dan tidak mengaburkan bahwa konteksnya merujuk kepada Yudas.
- source_word: δι’ οὗ
  choice: yang melaluinya
  rationale: Mempertahankan nuansa perantaraan atau keagenan διά dengan genitif.
- source_word: παραδίδοται
  choice: dikhianati
  rationale: Dalam konteks tindakan Yudas, 'dikhianati' menyampaikan watak moral peristiwa itu dengan jelas; arti lebih harfiah 'diserahkan' dicatat dalam catatan kaki.
- source_word: καλὸν αὐτῷ
  choice: Lebih baik bagi orang itu
  rationale: Ungkapan idiomatis Indonesia yang menyampaikan penilaian kontrafaktual secara alami dalam hubungannya dengan syarat berikutnya.
- source_word: εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος
  choice: sekiranya ia tidak dilahirkan
  rationale: Menyatakan kondisi yang berlawanan dengan kenyataan tanpa menambahkan penekanan 'tidak pernah' yang tidak diwajibkan oleh teks Yunani.
theological_decisions:
- issue: Makna παραδίδοται dalam kisah sengsara
  choice: dikhianati
  alternative: diserahkan
  rationale: Konteks langsung menyoroti pengkhianatan Yudas, sehingga 'dikhianati' paling jelas dalam teks utama. Namun, arti dasar 'diserahkan' dipertahankan dalam catatan kaki agar pola leksikal yang lebih luas dalam kisah sengsara tidak hilang.
- issue: Kedaulatan ilahi dan tanggung jawab manusia
  choice: Mempertahankan berdampingannya 'sebagaimana ada tertulis' dan 'celakalah orang itu'
  alternative: Menjelaskan salah satu klausa dengan cara yang mengurangi ketegangan antara keduanya
  rationale: Teks sekaligus menegaskan bahwa jalan Anak Manusia sesuai dengan yang tertulis dan bahwa pengkhianat tetap berada di bawah ucapan celaka. Terjemahan tidak menyelesaikan ketegangan ini ke arah determinisme ataupun pembebasan pelaku dari tanggung jawab.
- issue: Rujukan καλὸν αὐτῷ
  choice: Lebih baik bagi orang itu
  alternative: Baik baginya
  rationale: Bahasa Indonesia memerlukan bentuk komparatif idiomatis untuk menyampaikan akibat kontrafaktual yang dimaksud, tanpa mengubahnya menjadi pernyataan sederhana bahwa keadaan tersebut 'baik'.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Kapitalisasi 'Dia' dipakai untuk rujukan kepada Anak Manusia sesuai kebiasaan penerbitan Alkitab Indonesia. Susunan kalimat mempertahankan pengulangan dan kontras teks Yunani tanpa terdengar kaku.
