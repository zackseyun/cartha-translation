  source_fidelity: Terjemahan pada dasarnya setia pada kontras μεταξύ jalan Anak Manusia yang sesuai dengan yang tertulis dan ucapan celaka atas pelaku. Namun, demonstratif ἐκείνῳ pada klausa kedua lebih baik dipertahankan secara eksplisit sebagai “orang itu.”
  naturalness: Kalimat dapat dibuat lebih alami dan tegas dalam bahasa Indonesia modern dengan memakai “orang itu, yang olehnya ...” serta dengan menambahkan “Adalah” pada idiom penilaian kontrafaktual.
  terminology: “Anak Manusia,” “celakalah,” “dikhianati,” dan alternatif catatan kaki “diserahkan” tepat. Kapitalisasi “Dia” konsisten dengan konvensi penerbitan Alkitab Indonesia dan tidak mengubah makna sumber.
