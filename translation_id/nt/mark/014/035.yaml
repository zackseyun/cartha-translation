  source_fidelity: 'Draf umumnya setia pada teks Yunani: gerak menjauh sedikit, jatuh ke tanah, doa yang berlangsung, serta permohonan bersyarat dipertahankan. Namun, “saat itu” memberi nuansa demonstratif (“that moment”) yang tidak dinyatakan secara eksplisit oleh ἡ ὥρα. “Waktu itu” lebih wajar sebagai padanan ungkapan definit dalam bahasa Indonesia dan tetap tidak menjelaskan maknanya secara interpretatif.'
  naturalness: Kalimatnya alami dan bernada khidmat. “Pergi sedikit lebih jauh” lebih idiomatis daripada “maju sedikit lebih jauh” dalam konteks Yesus meninggalkan para murid untuk berdoa. “Terus berdoa” menyampaikan imperfect προσηύχετο dengan baik.
  terminology: Pemakaian “waktu itu” mempertahankan ungkapan penting ἡ ὥρα tanpa menggantinya dengan penjelasan seperti penderitaan atau kematian. Bentuk hormat “-Nya” sesuai dengan register Alkitab Indonesia modern.
