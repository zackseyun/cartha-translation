  - severity: low
    issue: “Maju sedikit lebih jauh”
    rationale: “Maju” dapat menyiratkan gerak ke depan secara arah, sedangkan προελθὼν μικρὸν terutama menyatakan pergi lebih jauh/sejenak melampaui yang lain. “Pergi sedikit lebih jauh” lebih netral dan idiomatis.
  revised_text: Ia pergi sedikit lebih jauh[a], lalu tersungkur ke tanah dan terus berdoa agar, jika mungkin, waktu itu berlalu dari-Nya.
