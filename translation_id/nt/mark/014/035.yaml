  text: καὶ ⸂προελθὼν μικρὸν ἔπιπτεν⸃ ἐπὶ τῆς γῆς, καὶ προσηύχετο ἵνα εἰ δυνατόν ἐστιν παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/035.yaml
  text: And going a little farther[a], he fell to the ground and was praying that, if it were possible, the hour might pass from him.
translation:
  language: id
  text: Ia pergi sedikit lebih jauh[a], lalu tersungkur ke tanah dan terus berdoa agar, jika mungkin, waktu itu berlalu dari-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pergi sedikit ke depan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: maju sedikit lebih jauh
  rationale: Ungkapan ini menunjukkan bahwa Yesus bergerak sedikit lebih jauh dari orang-orang lain. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan nuansa gerak melampaui posisi mereka.
- source_word: ἔπιπτεν ἐπὶ τῆς γῆς
  choice: lalu tersungkur ke tanah
  rationale: Imperfek Yunani dapat menggambarkan tindakan yang sedang berlangsung atau mulai terjadi dalam narasi. 'Tersungkur ke tanah' menyampaikan gerak jatuh dengan alami dan sesuai dengan ketegangan adegan.
- source_word: προσηύχετο
  choice: terus berdoa
  rationale: Imperfek menonjolkan tindakan yang berlangsung atau berulang. 'Terus berdoa' mempertahankan aspek duratif itu tanpa terasa kaku.
- source_word: ἵνα
  choice: supaya
  rationale: Di sini ἵνα memperkenalkan isi sekaligus arah permohonan. 'Supaya' wajar dalam bahasa Indonesia dan tidak memaksakan pembedaan yang terlalu tegas antara isi dan tujuan.
- source_word: εἰ δυνατόν ἐστιν
  choice: jika mungkin
  rationale: Bentuk ringkas ini alami dalam bahasa Indonesia serta mempertahankan sifat bersyarat dari permohonan tanpa menambahkan penafsiran.
- source_word: παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα
  choice: saat itu berlalu dari-Nya
  rationale: '''Berlalu dari-Nya'' mempertahankan gambaran verba παρέρχομαι, sedangkan ''saat itu'' menyampaikan ἡ ὥρα secara alami tanpa menjabarkannya sebagai penderitaan atau kematian.'
theological_decisions:
- issue: Makna ἡ ὥρα ('saat itu')
  choice: Mempertahankan ungkapan 'saat itu' sebagai sebutan bagi waktu yang telah mendekat tanpa menjelaskan isinya dalam teks.
  alternative: waktu penderitaan itu; saat kematian-Nya
  rationale: Ungkapan tersebut sarat makna dalam konteks kisah sengsara. Tidak memparafrasakannya menjaga ketegangan naratif dan teologis mengenai apa yang akan Yesus hadapi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Pronomina hormat '-Nya' mengikuti kelaziman penerbitan Alkitab Indonesia untuk merujuk kepada Yesus. Struktur kalimat dibuat mengalir sambil mempertahankan aspek doa yang berlangsung dan ungkapan teologis 'saat itu'.
