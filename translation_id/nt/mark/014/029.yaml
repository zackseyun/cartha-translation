  text: But Peter said to him[a], “Even if all fall away, I will not.”
translation:
  language: id
  text: Namun Petrus berkata kepada-Nya, “Sekalipun semua tersandung[a], aku tidak akan tersandung.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
