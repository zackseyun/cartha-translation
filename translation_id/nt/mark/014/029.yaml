lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan antara perkataan Petrus dan nubuat Yesus sebelumnya dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: ἔφη αὐτῷ
  choice: berkata kepada-Nya
  rationale: Mempertahankan verba tutur yang umum serta pronomina yang merujuk kepada Yesus; huruf kapital memperjelas rujukan tanpa mengganti pronomina Yunani dengan nama.
- source_word: Εἰ καὶ
  choice: Sekalipun
  rationale: Mengungkapkan daya konsesif-kondisional secara alami dalam bahasa Indonesia.
- source_word: πάντες
  choice: semua orang
  rationale: Dalam konteksnya menunjuk kepada seluruh kelompok murid; ungkapan ini alami tanpa mempersempit rujukan secara eksplisit.
- source_word: σκανδαλισθήσονται
  choice: meninggalkan Engkau
  rationale: Dalam konteks nubuat bahwa para murid akan tercerai-berai, pilihan ini menyampaikan kegagalan relasional dan pembelotan mereka dengan jelas, sambil mencantumkan keluasan makna verba Yunani dalam catatan kaki.
- source_word: ἀλλ’ οὐκ ἐγώ
  choice: aku tidak akan
  rationale: Mempertahankan penekanan kontras pada Petrus dan melengkapi verba yang tersirat agar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna σκανδαλισθήσονται dalam konteks kegagalan para murid
  choice: meninggalkan Engkau
  alternative: tersandung; dibuat tersandung; murtad
  rationale: Konteks langsung berbicara tentang para murid yang tercerai-berai dan gagal tetap bersama Yesus. Terjemahan ini mempertahankan keseriusan tindakan itu tanpa memutuskan bahwa mereka mengalami kemurtadan yang final; kemungkinan leksikal lainnya tetap dicatat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk “kepada-Nya” dan “Engkau” mengikuti kebiasaan penulisan rujukan ilahi dalam terjemahan Alkitab Indonesia; susunan ujaran dibuat alami tanpa menghilangkan penekanan kontras Petrus.
