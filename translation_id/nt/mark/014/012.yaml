source:
  edition: SBLGNT
  text: Καὶ τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων, ὅτε τὸ πάσχα ἔθυον, λέγουσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ· Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν ἵνα φάγῃς τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/012.yaml
  text: And on the first day of Unleavened Bread[a], when they were sacrificing the Passover lamb, his disciples said to him, “Where do you want us to go and prepare so that you may eat the Passover?”
translation:
  language: id
  text: Pada hari pertama perayaan Roti Tidak Beragi, ketika orang-orang menyembelih anak domba Paskah[a], murid-murid Yesus bertanya kepada-Nya, “Ke mana Engkau ingin kami pergi dan mempersiapkan perjamuan Paskah, supaya Engkau dapat memakannya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ketika mereka menyembelih Paskah.” Dalam konteks ini, kata Yunani untuk “Paskah” kemungkinan menunjuk pada anak domba Paskah yang disembelih.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων
  choice: Pada hari pertama perayaan Roti Tidak Beragi
  rationale: Genitif Yunani menunjuk pada hari pertama masa perayaan tersebut. Kata “perayaan” ditambahkan demi kejelasan alami dalam bahasa Indonesia, tanpa menyatakan sesuatu yang tidak tersirat oleh konteks.
- source_word: ὅτε τὸ πάσχα ἔθυον
  choice: ketika orang-orang menyembelih anak domba Paskah
  rationale: Bentuk imperfek ἔθυον menggambarkan kegiatan yang sedang atau lazim berlangsung. Dengan verba θύω, πάσχα secara kontekstual menunjuk pada hewan kurban Paskah, sehingga “anak domba Paskah” menyampaikan maksudnya secara wajar.
- source_word: λέγουσιν
  choice: bertanya
  rationale: Present historis Yunani dialihkan ke bentuk lampau naratif yang alami. Karena ujaran berikut berupa pertanyaan, “bertanya” lebih idiomatis daripada “berkata”.
- source_word: Ποῦ θέλεις
  choice: Ke mana Engkau ingin
  rationale: θέλω di sini menyatakan kehendak atau keinginan. “Ingin” merupakan padanan Indonesia modern yang alami; “ke mana” sesuai dengan tindakan pergi yang menyusul.
- source_word: ἀπελθόντες ἑτοιμάσωμεν
  choice: kami pergi untuk mempersiapkan
  rationale: Partisip ἀπελθόντες menyatakan tindakan pergi yang mendahului atau menyertai persiapan. Susunan ini mempertahankan urutan gagasan secara alami dalam bahasa Indonesia.
- source_word: ἵνα φάγῃς τὸ πάσχα
  choice: mempersiapkan perjamuan Paskah bagi-Mu
  rationale: Klausa ἵνα menyatakan tujuan. Dalam konteks verba “makan”, πάσχα menunjuk pada perjamuan Paskah. Formulasi “bagi-Mu” menyampaikan tujuan persiapan secara idiomatis, meskipun bentuk yang lebih harfiah ialah “supaya Engkau makan perjamuan Paskah”.
theological_decisions:
- issue: Rujukan πάσχα dalam dua kemunculannya
  choice: Kemunculan pertama dijelaskan sebagai “anak domba Paskah”; kemunculan kedua sebagai “perjamuan Paskah.”
  alternative: Kedua kemunculan dapat diterjemahkan secara lebih formal hanya sebagai “Paskah.”
  rationale: 'Konteks verbal membedakan nuansanya: bersama θύω istilah itu menunjuk pada hewan kurban, sedangkan bersama φάγῃς menunjuk pada santapan atau perjamuan. Pembedaan ini bersifat leksikal-kontekstual, bukan penetapan doktrinal.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan kepada Yesus memakai “Engkau” dan pronomina “-Nya” sesuai register Alkitab Indonesia yang lazim. Istilah perayaan ditulis dengan huruf kapital sebagai nama khusus.
