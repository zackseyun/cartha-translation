  text: καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ αἷμά μου ⸀τῆς διαθήκης τὸ ⸂ἐκχυννόμενον ὑπὲρ πολλῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/024.yaml
  text: And he said to them[a], “This is my blood of the covenant[c][b], which is poured out for many.”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Inilah darah-Ku, yaitu darah perjanjian[a], yang dicurahkan[b] bagi banyak orang[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah dan bagian-bagian paralel berbunyi, “darah-Ku, yaitu darah perjanjian baru.” Teks Yunani Markus di sini sebaiknya dibaca, “darah-Ku, yaitu darah perjanjian.”
    reason: textual_variant
  - marker: b
    text: Atau “yang sedang dicurahkan”; secara tradisional, “yang ditumpahkan.”
    reason: lexical_alternative
  - marker: c
    text: Atau “demi banyak orang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτό ἐστιν
  choice: Inilah
  rationale: Menyampaikan kopula Yunani secara langsung dan alami tanpa menafsirkannya sebagai ‘melambangkan’ atau ‘berarti’.
- source_word: τὸ αἷμά μου
  choice: darah-Ku
  rationale: Mempertahankan ungkapan kepunyaan serta gambaran darah yang nyata dalam konteks korban dan perjanjian, tanpa memparafrasakannya sebagai ‘kematian-Ku’.
- source_word: τῆς διαθήκης
  choice: yaitu darah perjanjian
  rationale: Kata ‘perjanjian’ sesuai dengan konteks pengikatan perjanjian dan gema Keluaran 24:8. ‘Yaitu’ membuat hubungan frasa Yunani terdengar alami dalam bahasa Indonesia tanpa menambahkan gagasan baru.
- source_word: ἐκχυννόμενον
  choice: yang dicurahkan
  rationale: Klausa relatif alami dalam bahasa Indonesia dan mempertahankan gambaran darah yang dicurahkan. Bentuk partisipel kini dapat pula menonjolkan tindakan yang sedang berlangsung.
- source_word: ὑπὲρ πολλῶν
  choice: bagi banyak orang
  rationale: Ungkapan ini alami dan mempertahankan arti manfaat atau perwakilan dari ὑπέρ tanpa mempersempitnya menjadi satu rumusan teologis tertentu atau mengganti ‘banyak’ dengan ‘semua’.
theological_decisions:
- issue: Makna διαθήκη sebagai perjanjian atau wasiat
  choice: perjanjian
  alternative: wasiat
  rationale: Dalam konteks Perjamuan Terakhir dan bahasa tentang darah yang menggemakan Keluaran 24:8, makna perjanjian paling sesuai.
- issue: Apakah kata ‘baru’ perlu ditambahkan sebelum ‘perjanjian’
  choice: darah perjanjian
  alternative: darah perjanjian baru
  rationale: Teks SBLGNT yang diterjemahkan tidak memuat καινῆς (‘baru’). Karena itu, teks utama tidak diselaraskan dengan tradisi paralel; variasi naskah dicatat dalam catatan kaki.
- issue: Implikasi ὑπὲρ πολλῶν bagi cakupan pendamaian
  choice: bagi banyak orang
  alternative: demi banyak orang; bagi semua orang
  rationale: Terjemahan mempertahankan kata ‘banyak’ dan tidak menyelesaikan perdebatan teologis yang lebih luas dengan menggantinya menjadi ‘semua’. ‘Demi’ tetap merupakan kemungkinan bagi nuansa tindakan atas nama mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ‘Ia’ dan enklitik ‘-Ku’ mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan ‘darah-Ku, yaitu darah perjanjian’ menjaga bahwa ‘-Ku’ secara langsung menerangkan ‘darah’, sekaligus membuat konstruksi genitif Yunani mudah dipahami.
