id: MRK.14.51
reference: Mark 14:51
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ⸂νεανίσκος τις⸃ ⸀συνηκολούθει αὐτῷ περιβεβλημένος σινδόνα ἐπὶ γυμνοῦ, καὶ κρατοῦσιν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/051.yaml
  text: And a certain young man was following him[a], wearing only a linen cloth over his naked body, and they seize him,
translation:
  language: id
  text: Ada seorang pemuda yang sedang mengikuti Yesus. Ia hanya mengenakan sehelai kain linen[a] pada tubuhnya yang telanjang, lalu orang-orang itu menangkapnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sehelai kain lebar dari linen.” Kata Yunani sindōn dapat merujuk pada kain linen atau kain lebar yang dikenakan seperti pakaian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεανίσκος τις
  choice: seorang pemuda
  rationale: νεανίσκος berarti pemuda, sedangkan τις memperkenalkannya sebagai orang yang tidak disebutkan namanya. Dalam bahasa Indonesia, 'seorang pemuda' menyampaikan ketakrifan ini secara alami tanpa tambahan 'tertentu' yang terasa kaku.
- source_word: συνηκολούθει αὐτῷ
  choice: sedang mengikuti Yesus
  rationale: Bentuk imperfek menyatakan tindakan yang sedang berlangsung. Nama 'Yesus' dipakai untuk memperjelas rujukan αὐτῷ secara alami dalam bahasa Indonesia.
- source_word: περιβεβλημένος
  choice: mengenakan
  rationale: Partisipel ini menggambarkan kain yang dikenakan atau diselubungkan pada tubuh; 'mengenakan' ringkas dan alami dalam konteks.
- source_word: σινδόνα
  choice: sehelai kain linen
  rationale: σινδών dapat menunjuk pada kain linen, kain lebar, atau pakaian seperti lembaran. 'Sehelai kain linen' mempertahankan keluasan makna tanpa menentukan bentuknya secara berlebihan.
- source_word: ἐπὶ γυμνοῦ
  choice: pada tubuhnya yang telanjang
  rationale: Frasa ini menunjukkan bahwa kain tersebut dikenakan langsung pada tubuh tanpa pakaian lain di bawahnya.
- source_word: κρατοῦσιν αὐτόν
  choice: orang-orang itu menangkapnya
  rationale: κρατοῦσιν adalah present historis yang menghidupkan narasi dan di sini berarti memegang atau menangkap pemuda itu. Bahasa Indonesia lebih alami memakai bentuk lampau kontekstual 'lalu ... menangkapnya' tanpa mengubah urutan peristiwa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kalimat Yunani yang panjang dipecah menjadi dua kalimat agar mudah dipahami. 'Hanya' memperjelas bahwa kain linen itu satu-satunya penutup tubuh, sesuai ἐπὶ γυμνοῦ. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskan.
