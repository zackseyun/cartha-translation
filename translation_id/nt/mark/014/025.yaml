base_translation:
  language: en
  yaml_path: translation/nt/mark/014/025.yaml
  text: Truly I tell you[c][b][a], I will certainly not drink again from the fruit of the vine until that day when I drink it new in the kingdom of God.
translation:
  language: id
  text: 'Sesungguhnya Aku berkata kepadamu: Aku pasti tidak akan minum lagi dari hasil pokok anggur[a] sampai hari itu, ketika Aku meminumnya dalam keadaan yang baru[b] dalam Kerajaan Allah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunaninya adalah “hasil pokok anggur”; yang dimaksud ialah minuman dari pokok anggur yang digunakan dalam perjamuan. Bahasa Yunani tidak langsung menyebutnya “anggur.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “ketika Aku meminumnya kembali.” Kata Yunani dapat berarti “baru” dan mungkin menyiratkan kebaruan pada masa Kerajaan Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya Aku berkata kepadamu
  rationale: Ungkapan ini mempertahankan formula pernyataan yang khidmat dan sapaan langsung, sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: οὐκέτι οὐ μὴ πίω
  choice: Aku pasti tidak akan minum lagi
  rationale: “Lagi” menyampaikan οὐκέτι, sedangkan “pasti tidak akan” mencerminkan penyangkalan masa depan yang sangat tegas dalam οὐ μή dengan bentuk subjungtif.
- source_word: ἐκ τοῦ γενήματος τῆς ἀμπέλου
  choice: dari hasil pokok anggur
  rationale: Pilihan ini mempertahankan idiom Yunani dan tidak mempersempit maknanya menjadi “anggur” sebagai nama minuman, meskipun dalam konteks frasa itu mengacu pada minuman dari pokok anggur.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: sampai hari itu
  rationale: Terjemahan langsung dan alami yang mempertahankan penekanan demonstratif pada hari yang dimaksud.
- source_word: ὅταν αὐτὸ πίνω
  choice: ketika Aku meminumnya
  rationale: “Ketika” sesuai dengan satu peristiwa mendatang yang dipandang dalam klausa ini; akhiran “-nya” merujuk kembali kepada hasil pokok anggur yang diminum.
- source_word: καινὸν
  choice: sebagai sesuatu yang baru
  rationale: Bentuk ini membuat adjektiva Yunani yang menerangkan objek minum dapat dipahami secara alami dalam bahasa Indonesia, tanpa menetapkan apakah maksudnya “kembali” atau baru dalam sifat/kualitas.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: dalam Kerajaan Allah
  rationale: Mempertahankan ungkapan teologis Perjanjian Baru secara langsung dan bermartabat.
theological_decisions:
- issue: Makna καινὸν dalam klausa terakhir
  choice: Diterjemahkan “sebagai sesuatu yang baru” tanpa menjelaskan bentuk kebaruannya.
  alternative: “kembali”; “dalam keadaan baru”; atau kebaruan jamuan akhir zaman
  rationale: καινός dapat menunjuk pada kebaruan sifat atau kualitas, sementara konteks juga memungkinkan nuansa minum kembali. Teks utama mempertahankan ketegangan tersebut.
- issue: Rujukan frasa “hasil pokok anggur”
  choice: Idiom sumber dipertahankan dan tidak langsung ditafsirkan sebagai “anggur” atau “air anggur.”
  alternative: “anggur” sebagai nama minuman
  rationale: Konteks menunjukkan minuman yang digunakan dalam perjamuan, tetapi bahasa Yunani sendiri memakai ungkapan “hasil pokok anggur”; terjemahan tidak perlu menjadi lebih spesifik daripada sumber.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Huruf kapital pada “Aku” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk ucapan Yesus; “Kerajaan Allah” dipertahankan sebagai istilah teologis baku. Semua penanda catatan kaki muncul dalam teks utama.
