  text: καθ’ ἡμέραν ἤμην πρὸς ὑμᾶς ἐν τῷ ἱερῷ διδάσκων καὶ οὐκ ἐκρατήσατέ με· ἀλλ’ ἵνα πληρωθῶσιν αἱ γραφαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/049.yaml
  text: Day after day I was with you in the temple[a], teaching, and you did not seize me[c][b]. But let the Scriptures be fulfilled.
translation:
  language: id
  text: Setiap hari Aku bersama kalian di Bait Allah[a] sambil mengajar, tetapi kalian tidak menangkap Aku.[b] Namun, hal ini terjadi supaya Kitab Suci digenapi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah seluruh kompleks atau pelataran Bait Allah, bukan hanya ruang kudus di bagian dalam.
    reason: cultural_note
  - marker: b
    text: Atau, “menahan Aku.”
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “Namun, supaya Kitab Suci digenapi.” Bahasa Yunani membiarkan verba utama dalam klausa ini tersirat.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Setiap hari
  rationale: Ungkapan distributif ini berarti ‘tiap-tiap hari’ atau ‘hari demi hari’. ‘Setiap hari’ alami dalam bahasa Indonesia dan tetap menyampaikan kegiatan yang berulang.
- source_word: ἤμην πρὸς ὑμᾶς
  choice: Aku bersama kalian
  rationale: πρός dengan orang di sini menyatakan kehadiran di tengah atau bersama mereka. ‘Kalian’ memperjelas bahwa ὑμᾶς berbentuk jamak.
- source_word: ἐν τῷ ἱερῷ
  choice: di Bait Allah
  rationale: ἱερόν mengacu pada kompleks Bait Allah, bukan hanya ruang kudus bagian dalam. ‘Bait Allah’ adalah sebutan Indonesia yang lazim, sedangkan cakupannya dijelaskan dalam catatan kaki.
- source_word: διδάσκων
  choice: sambil mengajar
  rationale: Partisipel kini ini menggambarkan kegiatan mengajar yang berlangsung bersamaan dengan keberadaan Yesus di sana.
- source_word: οὐκ ἐκρατήσατέ με
  choice: kalian tidak menangkap Aku
  rationale: Dalam konteks penangkapan, κρατέω berarti menangkap atau menahan. ‘Menangkap’ menyampaikan tindakan fisik sekaligus maksud penahanan tanpa menjadikannya istilah hukum yang terlalu teknis.
- source_word: ἀλλ’ ἵνα
  choice: Namun, hal ini terjadi supaya
  rationale: Bahasa Yunani memakai klausa eliptis dan tidak menyebutkan verba utama. Penambahan minimal ‘hal ini terjadi’ membuat kalimat wajar dalam bahasa Indonesia tanpa menentukan secara lebih rinci apa saja yang termasuk dalam peristiwa tersebut.
- source_word: πληρωθῶσιν
  choice: digenapi
  rationale: Bentuk pasif aoristus subjungtif setelah ἵνα menyatakan tujuan atau hasil. ‘Digenapi’ mempertahankan bentuk pasif dan merupakan ungkapan Indonesia yang lazim mengenai penggenapan Kitab Suci.
- source_word: αἱ γραφαί
  choice: Kitab Suci
  rationale: Bentuk jamak γραφαί menunjuk pada tulisan-tulisan suci Israel sebagai satu kumpulan. ‘Kitab Suci’ adalah padanan kolektif yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Klausa tujuan yang eliptis dan maksud ilahi
  choice: Namun, hal ini terjadi supaya Kitab Suci digenapi
  alternative: Namun, supaya Kitab Suci digenapi
  rationale: Teks Yunani membiarkan verba utama tersirat sesudah ἀλλ’ ἵνα. ‘Hal ini terjadi’ memasok unsur minimum yang diperlukan untuk kelancaran bahasa Indonesia, sambil mempertahankan hubungan tujuan/hasil dan tidak memperkuatnya menjadi rumusan deterministis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kalian’ dipakai untuk mempertahankan bentuk jamak orang kedua secara jelas; susunan kalimat dibuat alami tanpa menghilangkan ellipsis sumber, yang dicatat sebagai alternatif lebih harfiah.
