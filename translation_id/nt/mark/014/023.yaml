id: MRK.14.23
reference: Mark 14:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀λαβὼν ποτήριον εὐχαριστήσας ἔδωκεν αὐτοῖς, καὶ ἔπιον ἐξ αὐτοῦ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/023.yaml
  text: And taking a cup[a], after giving thanks he gave it to them, and they all drank from it.
translation:
  language: id
  text: Lalu, setelah mengambil sebuah cawan[a] dan mengucap syukur, ia memberikannya kepada mereka, dan mereka semua minum dari cawan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “cawan itu.” Dalam bahasa Yunani, kata “cawan” tidak memakai artikel, meskipun konteks perjamuan dapat menyiratkan cawan tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: setelah mengambil
  rationale: Partisip aoristus ini menyatakan tindakan yang mendahului verba utama; bentuk ini alami dalam bahasa Indonesia dan mempertahankan urutan tindakan.
- source_word: ποτήριον
  choice: sebuah cawan
  rationale: Nomina Yunani ini tidak memakai artikel. 'Sebuah cawan' mencerminkan bentuk tersebut, sementara konteks perjamuan dapat menunjuk pada cawan tertentu.
- source_word: εὐχαριστήσας
  choice: mengucap syukur
  rationale: Ungkapan ini menyampaikan makna memberi syukur secara lugas tanpa memasukkan istilah liturgis yang berkembang kemudian.
- source_word: ἔδωκεν αὐτοῖς
  choice: ia memberikannya kepada mereka
  rationale: Akhiran '-nya' secara wajar merujuk pada cawan yang baru disebut dan membuat kalimat Indonesia jelas.
- source_word: ἔπιον
  choice: minum
  rationale: Padanan Indonesia yang alami bagi verba aoristus ini; aspek lampau sudah ditentukan oleh konteks naratif.
- source_word: ἐξ αὐτοῦ
  choice: dari cawan itu
  rationale: Rujukan pronomina kepada ποτήριον dibuat eksplisit agar alami dan tidak ambigu dalam bahasa Indonesia.
- source_word: πάντες
  choice: mereka semua
  rationale: Susunan ini secara alami menegaskan bahwa setiap orang di antara mereka minum.
theological_decisions:
- issue: Kemungkinan nuansa ekaristis pada εὐχαριστήσας
  choice: mengucap syukur
  alternative: memberkati cawan itu; mengucapkan doa syukur
  rationale: Verba εὐχαριστέω secara langsung berarti mengucap atau memberi syukur. Terjemahan ini tidak memasukkan terminologi sakramental atau menyatakan bahwa objeknya diberkati ketika hal itu tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. 'Cawan' dipertahankan karena lazim dan tepat dalam konteks perjamuan, tanpa menjadi terlalu teknis.
