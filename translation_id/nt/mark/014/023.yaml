  source_fidelity: Teks dengan setia mencerminkan urutan partisip aoristus λαβών dan εὐχαριστήσας sebelum verba utama ἔδωκεν. “Sebuah cawan” mempertahankan sifat anartros ποτήριον, sedangkan “dari cawan itu” secara tepat menjelaskan rujukan ἐξ αὐτοῦ kepada cawan. Penegasan πάντες tersampaikan melalui “mereka semua.”
