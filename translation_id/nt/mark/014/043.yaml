source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἔτι αὐτοῦ λαλοῦντος παραγίνεται ⸀Ἰούδας ⸀εἷς τῶν δώδεκα καὶ μετ’ αὐτοῦ ⸀ὄχλος μετὰ μαχαιρῶν καὶ ξύλων παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/043.yaml
  text: And immediately[a], while he was still speaking, Judas arrived, one of the Twelve, and with him a crowd with swords and clubs[d][c][b], from the chief priests and the scribes and the elders.
translation:
  language: id
  text: Dan segera, ketika Ia masih berbicara, datang Yudas, salah seorang dari Kedua Belas, dan bersama dia sekumpulan orang yang membawa pedang dan pentung, dari imam-imam kepala, para ahli Taurat, dan para tua-tua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: saat itu juga
  rationale: Menyampaikan kesegeraan dan ketiba-tibaan yang khas dalam alur narasi Markus dengan ungkapan Indonesia yang alami.
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: ketika Dia masih berbicara
  rationale: Mempertahankan tindakan yang berlangsung bersamaan; ἔτι diterjemahkan dengan “masih”.
- source_word: παραγίνεται
  choice: datanglah
  rationale: Menyatakan kedatangan Yudas ke tempat kejadian. Bentuk kini historis Yunani dialihkan ke bentuk naratif Indonesia yang alami, sementara daya hidupnya dibantu oleh susunan inversi.
- source_word: εἷς τῶν δώδεκα
  choice: salah seorang dari Kedua Belas
  rationale: Mempertahankan sebutan ringkas bagi kelompok inti Yesus tanpa menambahkan kata “murid” yang tidak terdapat dalam ayat ini.
- source_word: ὄχλος
  choice: serombongan orang
  rationale: Mengungkapkan arti dasar “kerumunan/rombongan” tanpa memasukkan penilaian “gerombolan” ke dalam nomina itu sendiri; sifat mengancam tampak dari senjata yang mereka bawa.
- source_word: μαχαιρῶν
  choice: pedang
  rationale: Padanan umum yang cukup tepat untuk senjata berbilah dalam konteks penangkapan ini, tanpa memaksakan ukuran tertentu.
- source_word: ξύλων
  choice: pentung
  rationale: Secara harfiah berarti benda-benda kayu atau kayu; dalam konteks ini menunjuk pada tongkat pemukul yang dibawa sebagai senjata.
- source_word: παρὰ τῶν
  choice: dari pihak
  rationale: Menjaga gagasan sumber atau keterkaitan dengan para penguasa tersebut tanpa secara eksplisit menambahkan bahwa rombongan itu “diutus”.
- source_word: ἀρχιερέων
  choice: imam-imam kepala
  rationale: Menunjuk pada kalangan pemimpin keimaman, bukan sejumlah imam besar yang sedang menjabat pada waktu yang sama.
- source_word: γραμματέων
  choice: para ahli Taurat
  rationale: Padanan Indonesia yang mapan untuk para pakar dan penafsir hukum tertulis Yahudi.
- source_word: πρεσβυτέρων
  choice: para tua-tua
  rationale: Mempertahankan sebutan kelembagaan bagi para pemimpin Yahudi yang diakui, alih-alih menggantinya dengan istilah umum “pemimpin”.
theological_decisions:
- issue: Bentuk kini historis παραγίνεται
  choice: Diterjemahkan secara naratif sebagai “datanglah”
  alternative: “datang” dalam bentuk kini untuk meniru secara lebih langsung daya hidup bahasa Yunani
  rationale: Bahasa Yunani memakai bentuk kini historis untuk membuat adegan terasa hidup. Bentuk “datanglah” lebih wajar dalam narasi Indonesia dan tetap memberi tekanan pada munculnya Yudas di tempat kejadian.
- issue: Daya makna παρὰ bersama para pemimpin
  choice: “dari pihak imam-imam kepala, para ahli Taurat, dan para tua-tua”
  alternative: “diutus oleh imam-imam kepala, para ahli Taurat, dan para tua-tua”
  rationale: Preposisi itu menunjukkan sumber atau hubungan otoritas, tetapi tidak dengan sendirinya menjelaskan mekanisme pengutusan. Terjemahan utama mempertahankan ruang makna tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif khidmat. “Kedua Belas” diperlakukan sebagai sebutan kelompok. Susunan kalimat mempertahankan laju mendadak teks Markus serta daftar tiga kelompok pemimpin, tanpa memperkuat “rombongan” menjadi “gerombolan” atau mengubah hubungan “dari pihak” menjadi pengutusan yang eksplisit.
