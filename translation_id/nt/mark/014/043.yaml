    issue: “dari pihak” untuk παρὰ τῶν
    rationale: Ungkapan ini dapat menyiratkan bahwa rombongan sekadar berpihak kepada para pemimpin. Preposisi Yunani menyatakan asal/sumber, dengan kemungkinan nuansa otorisasi; “dari” menyampaikan hal itu lebih langsung tanpa menambahkan tindakan pengutusan.
  - severity: low
    issue: Pilihan “serombongan orang”
    rationale: Maknanya tidak keliru, tetapi “sekumpulan orang” lebih alami dalam bahasa Indonesia modern untuk suatu ὄχλος dan tidak menambahkan nuansa organisasi.
