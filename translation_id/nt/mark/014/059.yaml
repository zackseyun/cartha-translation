  text: καὶ οὐδὲ οὕτως ἴση ἦν ἡ μαρτυρία αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/059.yaml
  text: And not even in this way was their testimony consistent[a].
translation:
  language: id
  text: Dan bahkan dalam hal ini pun, kesaksian mereka tidak sesuai satu sama lain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tidak sejalan satu sama lain"; secara lebih harfiah, "tidak sama".
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐδὲ
  choice: Bahkan ... pun ... tidak
  rationale: Gabungan ini menyampaikan kesinambungan sekaligus penyangkalan yang ditekankan; susunan 'bahkan ... pun ... tidak' alami dalam bahasa Indonesia.
- source_word: οὕτως
  choice: dengan kesaksian seperti itu
  rationale: Merujuk pada bentuk kesaksian yang baru disebutkan; penambahan 'kesaksian' memperjelas acuannya tanpa mengubah makna.
- source_word: ἴση
  choice: saling bersesuaian
  rationale: Secara harfiah berarti 'sama/setara', tetapi dalam konteks beberapa saksi, maksudnya ialah kesaksian mereka tidak cocok satu sama lain.
- source_word: ἦν
  choice: tidak saling bersesuaian
  rationale: Bentuk imperfek εἰμί menyatakan keadaan pada waktu itu; dalam bahasa Indonesia kopula lampau tidak perlu dinyatakan tersendiri.
- source_word: ἡ μαρτυρία αὐτῶν
  choice: kesaksian mereka
  rationale: Mempertahankan nomina tunggal kolektif dan genitif kepunyaan secara wajar dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan kata 'kesaksian' dipertahankan demi memperjelas rujukan οὕτως dan konteks hukum; ungkapan 'saling bersesuaian' menyampaikan ketidakcocokan di antara para saksi.
