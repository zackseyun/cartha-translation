id: MRK.14.61
reference: Mark 14:61
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ἐσιώπα καὶ ⸂οὐκ ἀπεκρίνατο οὐδέν⸃. πάλιν ὁ ἀρχιερεὺς ἐπηρώτα αὐτὸν καὶ λέγει αὐτῷ· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ εὐλογητοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/061.yaml
  text: But he kept silent and answered nothing[a]. Again the high priest questioned him and says to him, “Are you the Messiah[b], the Son of the Blessed One?”
translation:
  language: id
  text: Namun, Yesus tetap diam dan tidak menjawab apa pun. Imam besar itu kembali menanyai dia dan berkata kepadanya, “Apakah engkau Mesias[a], Anak dari Yang Terpuji[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Gelar Yunani Χριστός (Christos) di sini diterjemahkan “Mesias” karena berfungsi sebagai gelar dalam konteks mesianik Yahudi.
    reason: alternative_reading
  - marker: b
    text: “Yang Terpuji” adalah cara hormat orang Yahudi untuk merujuk kepada Allah.
    reason: cultural_note
lexical_decisions:
- source_word: ἐσιώπα
  choice: tetap diam
  rationale: Bentuk imperfek menggambarkan sikap diam yang berlangsung; “tetap diam” menyampaikan aspek itu secara alami.
- source_word: ἀπεκρίνατο οὐδέν
  choice: tidak menjawab apa pun
  rationale: Ungkapan ini mempertahankan penyangkalan menyeluruh yang dinyatakan oleh οὐδέν dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: πάλιν
  choice: kembali
  rationale: Menandai bahwa imam besar mengulangi tindakannya menanyai Yesus.
- source_word: ἀρχιερεὺς
  choice: imam besar
  rationale: Istilah baku dan tepat untuk jabatan keimaman tertinggi Yahudi dalam konteks persidangan ini.
- source_word: ἐπηρώτα
  choice: menanyai
  rationale: Bentuk imperfek dapat menunjukkan pertanyaan yang berlanjut atau diulangi; “menanyai” sesuai dengan konteks pemeriksaan tanpa menambahkan gagasan interogasi yang terlalu kuat.
- source_word: λέγει
  choice: berkata
  rationale: Present historis khas Markus dialihkan ke bentuk lampau naratif yang alami dalam bahasa Indonesia; penggunaan “berkata” menjaga alur tanpa menghasilkan pergantian kala yang janggal.
- source_word: χριστός
  choice: Mesias
  rationale: Di sini kata tersebut berfungsi sebagai gelar dalam konteks pengharapan mesianik Yahudi, sehingga “Mesias” lebih langsung menyampaikan fungsi dan latar Ibraninya.
- source_word: ὁ υἱὸς τοῦ εὐλογητοῦ
  choice: Anak dari Yang Terpuji
  rationale: Terjemahan ini mempertahankan ungkapan penghormatan tidak langsung kepada Allah dan relasi genitif dalam teks Yunani tanpa menggantinya dengan sebutan yang lebih eksplisit.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar mesianik langsung
  choice: Mesias
  alternative: Kristus
  rationale: Dalam pertanyaan imam besar, istilah ini merupakan gelar yang berakar pada pengharapan mesianik Yahudi, bukan sekadar sebutan yang menyerupai nama diri.
- issue: Penerjemahan τοῦ εὐλογητοῦ
  choice: Yang Terpuji
  alternative: Allah
  rationale: Ungkapan sumber merupakan cara hormat untuk merujuk kepada Allah. Mempertahankan ungkapan tidak langsung itu menjaga warna budaya dan ketegangan teologis teks.
- issue: Subjek tersirat pada ἐσιώπα
  choice: Yesus
  alternative: dia
  rationale: Bahasa Yunani memakai pronomina tersirat yang merujuk jelas kepada Yesus. Menyebut nama Yesus mencegah ambiguitas dalam bahasa Indonesia setelah konteks sebelumnya, tanpa mengubah referennya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai dalam pertanyaan langsung agar tetap khidmat tanpa menjadi arkais. Semua penanda catatan kaki ditempatkan tepat setelah istilah yang dijelaskan.
