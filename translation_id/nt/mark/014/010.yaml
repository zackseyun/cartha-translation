source:
  edition: SBLGNT
  text: ⸀Καὶ Ἰούδας ⸂Ἰσκαριὼθ ὁ⸃ εἷς τῶν δώδεκα ἀπῆλθεν πρὸς τοὺς ἀρχιερεῖς ἵνα αὐτὸν ⸂παραδοῖ αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/010.yaml
  text: And Judas Iscariot[a], one of the Twelve, went to the chief priests in order to hand him over to them.
translation:
  language: id
  text: Lalu Yudas Iskariot, salah seorang dari Kedua Belas, pergi menemui imam-imam kepala untuk menyerahkan Yesus kepada mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengkhianati Yesus dengan menyerahkan-Nya kepada mereka.” Kata kerja Yunani yang digunakan berarti “menyerahkan”; dalam tindakan Yudas, penyerahan ini merupakan pengkhianatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Lalu
  rationale: Sebagai penghubung naratif, «Lalu» mengaitkan tindakan ini dengan peristiwa sebelumnya secara alami tanpa menambah hubungan sebab-akibat.
- source_word: Ἰούδας Ἰσκαριὼθ
  choice: Yudas Iskariot
  rationale: Nama dan julukan ditransliterasikan dalam bentuk yang sudah lazim dalam bahasa Indonesia.
- source_word: ὁ εἷς τῶν δώδεκα
  choice: salah seorang dari Kedua Belas Murid
  rationale: Frasa ini menunjuk kepada kelompok khusus yang dikenal sebagai kedua belas murid Yesus; penambahan «Murid» membuat sebutan kelompok itu jelas dan alami bagi pembaca Indonesia.
- source_word: ἀπῆλθεν πρὸς
  choice: pergi menemui
  rationale: Gabungan ini menyatakan gerak menuju para imam kepala; «pergi menemui» lebih alami daripada «pergi kepada» dalam bahasa Indonesia modern.
- source_word: τοὺς ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Bentuk jamak ini menunjuk kepada para pemimpin keimaman di Yerusalem, bukan kepada beberapa imam besar yang sedang menjabat.
- source_word: ἵνα
  choice: untuk
  rationale: Kata ini menyatakan tujuan tindakan Yudas secara ringkas dan alami.
- source_word: παραδοῖ
  choice: menyerahkan
  rationale: «Menyerahkan» mempertahankan arti luas παραδίδωμι dan tidak mempersempitnya menjadi «mengkhianati», meskipun dalam konteks ini tindakan tersebut memang merupakan pengkhianatan.
- source_word: αὐτὸν ... αὐτοῖς
  choice: Yesus kepada mereka
  rationale: Bahasa Yunani memakai kata ganti «dia» yang acuannya adalah Yesus. Menyebut «Yesus» menghindari ketidakjelasan dalam bahasa Indonesia, sedangkan «mereka» tetap merujuk kepada imam-imam kepala.
theological_decisions:
- issue: Makna παραδοῖ dalam konteks pengkhianatan Yudas
  choice: menyerahkan Yesus kepada mereka
  alternative: mengkhianati Yesus dengan menyerahkan-Nya kepada mereka
  rationale: Kata kerja Yunani itu lebih luas daripada «mengkhianati» dan menjadi istilah penting dalam kisah penderitaan untuk tindakan menyerahkan Yesus. Terjemahan utama mempertahankan keluasan dan ketegangan tersebut, sementara catatan kaki menjelaskan nuansa pengkhianatannya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. «Imam-imam kepala» mempertahankan istilah kelembagaan yang lazim, sedangkan «Kedua Belas Murid» memperjelas bahwa angka tersebut merupakan sebutan bagi kelompok khusus.
