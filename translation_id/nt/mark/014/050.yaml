  text: καὶ ἀφέντες αὐτὸν ⸂ἔφυγον πάντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/050.yaml
  text: And leaving him, they all fled.
translation:
  language: id
  text: Lalu mereka semua meninggalkan Dia dan melarikan diri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Dalam alur narasi penangkapan, καί menghubungkan tindakan ini dengan kejadian sebelumnya. “Lalu” menyampaikan kelanjutan naratif secara alami dalam bahasa Indonesia tanpa memberi hubungan sebab-akibat yang tidak dinyatakan.
- source_word: ἀφέντες
  choice: meninggalkan
  rationale: Partisip aoris aktif dari ἀφίημι di sini berarti meninggalkan seseorang. “Meninggalkan” alami dan tepat, sekaligus tidak menambahkan tekanan tafsir sekuat “menelantarkan” atau “mengkhianati”.
- source_word: αὐτὸν
  choice: Dia
  rationale: Pronomina ini merujuk kepada Yesus. “Dia” jelas dari konteks dan sesuai dengan gaya bahasa Indonesia yang bermartabat.
- source_word: ἔφυγον
  choice: melarikan diri
  rationale: Bentuk aoris indikatif dari φεύγω menyatakan lari menjauh dari bahaya. “Melarikan diri” merupakan padanan bahasa Indonesia yang alami dan mempertahankan kesan mundur karena ancaman.
- source_word: πάντες
  choice: mereka semua
  rationale: πάντες menekankan keseluruhan kelompok. “Mereka semua” mempertahankan penekanan bahwa tidak seorang pun dari mereka tetap tinggal.
theological_decisions:
- issue: Cakupan tindakan meninggalkan Yesus
  choice: mereka semua meninggalkan Dia dan melarikan diri
  alternative: mereka meninggalkan Dia, lalu semuanya melarikan diri
  rationale: Susunan yang dipilih secara alami mengaitkan “semua” dengan subjek kedua tindakan, sebagaimana partisip dan verba utamanya memiliki subjek yang sama. Terjemahan mempertahankan totalitas tindakan mereka tanpa memperluas siapa yang termasuk dalam kelompok itu melampaui konteks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur partisip Yunani dialihkan menjadi dua verba berurutan agar alami, sambil mempertahankan hubungan erat antara meninggalkan Yesus dan melarikan diri.
