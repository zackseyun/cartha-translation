  verdict: revise
  source_fidelity: 'Sebagian besar padanan setia kepada teks Yunani: urutan “segera,” kokok kedua, ingatan Petrus akan perkataan Yesus, serta penyangkalan tiga kali semuanya terpelihara. Namun, konstruksi terakhir draft, “Maka, hancur hatinya,[a] ia pun menangis,” tidak membentuk kalimat Indonesia baku dan menjadikan makna partisip ἐπιβαλών terlalu eksplisit sebagai keadaan batin (“hatinya hancur”). Karena makna partisip itu diperdebatkan, terjemahan utama sebaiknya memakai ungkapan yang lebih dekat dengan pilihan audit Inggris sambil mempertahankan catatan alternatif.'
  naturalness: '“Saat itu juga,” “untuk kedua kalinya,” dan “Petrus teringat akan perkataan” alami dalam bahasa Indonesia modern. Perbaikan utama diperlukan pada kalimat terakhir: “Ia pun hancur dan menangis” adalah kalimat utuh, mengalir, dan menyatakan keruntuhan emosi tanpa memaksakan idiom “hancur hati” atau gerakan fisik tertentu.'
  terminology: “Ayam jantan berkokok,” “perkataan,” dan “menyangkal Aku” tepat dan berdaftar baku. Kapitalisasi “Aku” dalam ujaran Yesus konsisten dengan kebiasaan penerjemahan Indonesia dan tidak mengubah makna. Catatan kaki perlu menyebut bahwa alternatif “ketika memikirkannya” merupakan salah satu pemahaman, bukan makna pasti.
