  to: 'Saat itu juga, ayam jantan berkokok untuk kedua kalinya. Lalu Petrus teringat akan perkataan yang telah Yesus sampaikan kepadanya: “Sebelum ayam jantan berkokok dua kali, kamu akan menyangkal Aku tiga kali.” Ia pun hancur dan menangis.[a]'
