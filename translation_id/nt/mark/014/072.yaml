  text: καὶ ⸀εὐθὺς ἐκ δευτέρου ἀλέκτωρ ἐφώνησεν· καὶ ἀνεμνήσθη ὁ Πέτρος τὸ ῥῆμα ⸀ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Πρὶν ἀλέκτορα ⸂φωνῆσαι δὶς τρίς με ἀπαρνήσῃ⸃, καὶ ἐπιβαλὼν ἔκλαιεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/072.yaml
  text: And immediately a rooster crowed a second time. And Peter remembered the word[a], how Jesus had said to him, “Before a rooster crows twice, you will deny me three times.” And breaking down, he wept.
translation:
  language: id
  text: 'Saat itu juga, ayam jantan berkokok untuk kedua kalinya. Lalu Petrus teringat akan perkataan yang telah Yesus sampaikan kepadanya: “Sebelum ayam jantan berkokok dua kali, kamu akan menyangkal Aku tiga kali.” Ia pun hancur dan menangis.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani yang diterjemahkan “Ia pun hancur” sulit dipastikan maknanya. Ungkapan itu juga dapat dipahami sebagai “ketika memikirkannya, ia menangis” atau sebagai suatu gerakan lahiriah, misalnya menutupi kepalanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: saat itu juga
  rationale: Menyampaikan makna temporal ‘segera’ serta urgensi khas narasi Markus dalam ungkapan Indonesia yang alami.
- source_word: ἐκ δευτέρου
  choice: untuk kedua kalinya
  rationale: Mempertahankan penomoran eksplisit dalam idiom Indonesia yang wajar.
- source_word: ἀλέκτωρ ... ἐφώνησεν
  choice: ayam jantan berkokok
  rationale: Merupakan padanan kontekstual yang tepat dan lazim untuk bunyi ayam jantan.
- source_word: ἀνεμνήσθη
  choice: teringat
  rationale: Mengungkapkan tindakan Petrus mengingat kembali perkataan Yesus secara alami.
- source_word: τὸ ῥῆμα
  choice: perkataan
  rationale: Dalam konteks ini berarti ucapan atau pernyataan tertentu; ‘perkataan’ lebih alami daripada ‘firman’ dan tidak memberi muatan teknis yang tidak diperlukan.
- source_word: ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: yang telah Yesus sampaikan kepadanya
  rationale: Menghubungkan ‘perkataan’ dengan isi ucapan terdahulu serta menyatakan urutan waktu naratif secara jelas.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι δὶς
  choice: Sebelum ayam jantan berkokok dua kali
  rationale: Mempertahankan hubungan temporal dan jumlah dua kali tanpa menyiratkan seekor ayam tertentu.
- source_word: τρίς με ἀπαρνήσῃ
  choice: kamu akan menyangkal Aku tiga kali
  rationale: ‘Menyangkal Aku’ adalah padanan langsung dan lazim yang mempertahankan daya relasional verba tersebut.
- source_word: ἐπιβαλών
  choice: hancur hatinya
  rationale: Mengungkapkan keruntuhan emosi Petrus secara idiomatis tanpa menetapkan gerakan fisik tertentu; ketidakpastian ungkapan Yunani dijelaskan dalam catatan kaki.
- source_word: ἔκλαιεν
  choice: ia pun menangis
  rationale: Bentuk lampau naratif Indonesia menyampaikan tindakan menangis dengan alami; ‘pun’ menandai akibat emosional tanpa berlebihan.
theological_decisions:
- issue: Makna partisip ἐπιβαλών yang sulit
  choice: hancur hatinya
  alternative: ketika memikirkannya; menutupi kepalanya; menghamburkan diri ke luar
  rationale: Ungkapan Yunani ini ditafsirkan dengan beberapa cara dan dapat menunjuk pada pergolakan batin atau tindakan lahiriah. Terjemahan utama mempertahankan daya emosional konteks tanpa memastikan gerakan fisik yang tidak jelas, sementara alternatif dicatat demi transparansi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat mengalir bagi pembaca umum, dengan pengulangan ‘ayam jantan berkokok’ dipertahankan karena penting bagi kaitan naratif. Kapitalisasi ‘Aku’ mengikuti rujukan langsung kepada Yesus.
