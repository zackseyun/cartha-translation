  text: ὁ δὲ ⸂ἐκπερισσῶς ἐλάλει⸃· Ἐὰν ⸂δέῃ με⸃ συναποθανεῖν σοι, οὐ μή σε ⸀ἀπαρνήσομαι. ὡσαύτως δὲ καὶ πάντες ἔλεγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/031.yaml
  text: But he kept insisting all the more[a], “If I must die together with you[c][b], I will certainly not deny you.” And they all were saying the same thing.
translation:
  language: id
  text: Namun, ia makin bersikeras[a], “Jika aku harus mati bersama engkau[b], aku sama sekali tidak akan menyangkal engkau[c].” Mereka semua pun mengatakan hal yang sama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia berbicara dengan sangat tegas.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mati bersama dengan engkau.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “aku tidak akan pernah menyangkal engkau.” Bahasa Yunani memakai penyangkalan yang sangat kuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπερισσῶς ἐλάλει
  choice: terus bersikeras, bahkan lebih kuat lagi
  rationale: Imperfek ἐλάλει menunjukkan ujaran yang berlanjut atau berulang, sedangkan ἐκπερισσῶς memperkuat dan meningkatkan ketegasan ucapan Petrus. Ungkapan ini menyampaikan kedua unsur itu secara alami dalam bahasa Indonesia.
- source_word: Ἐὰν δέῃ με
  choice: Jika aku harus
  rationale: δέῃ menyatakan keharusan, bukan sekadar kemungkinan; bentuk ini ringkas dan mempertahankan struktur bersyarat Yunani.
- source_word: συναποθανεῖν σοι
  choice: mati bersama-sama dengan engkau
  rationale: Unsur συν- pada verba menyatakan mati bersama seseorang. Pengulangan makna kebersamaan dipertahankan agar daya ungkap verba majemuk itu tampak.
- source_word: οὐ μή
  choice: sama sekali tidak akan
  rationale: Gabungan οὐ μή dengan bentuk mendatang merupakan penyangkalan yang sangat tegas. Ungkapan Indonesia ini mempertahankan kekuatannya tanpa terdengar kuno.
- source_word: ἀπαρνήσομαι
  choice: menyangkal
  rationale: Dalam konteks nubuat tentang tindakan Petrus kelak, 'menyangkal' merupakan padanan yang jelas dan konsisten dengan alur narasi.
- source_word: ὡσαύτως δὲ καὶ πάντες ἔλεγον
  choice: Mereka semua pun mengatakan hal yang sama
  rationale: ὡσαύτως menunjuk pada isi pernyataan yang serupa, πάντες mencakup semuanya, dan bentuk imperfek ἔλεγον tetap diungkapkan dengan verba ujaran yang wajar dalam narasi Indonesia.
theological_decisions:
- issue: Kekuatan sumpah Petrus untuk tidak menyangkal Yesus
  choice: aku sama sekali tidak akan menyangkal engkau
  alternative: aku tidak akan pernah menyangkal engkau
  rationale: Terjemahan mempertahankan penyangkalan Yunani yang sangat kuat serta keyakinan diri Petrus, tanpa menerangkan atau meredakan ketegangan naratif dengan kegagalannya kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'ia' mempertahankan rujukan orang ketiga dalam teks sumber; 'aku' dan 'engkau' menjaga nada langsung serta serius dalam ucapan Petrus. Semua penanda catatan kaki dicantumkan pada bagian teks yang relevan.
