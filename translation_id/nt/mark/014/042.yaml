  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ὁ παραδιδούς με ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/042.yaml
  text: Get up; let us go. Look[a], the one betraying me has come near.
translation:
  language: id
  text: Bangunlah, mari kita pergi. Lihat, orang yang mengkhianati Aku sudah mendekat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “orang yang menyerahkan Aku sudah mendekat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Bangunlah
  rationale: Bentuk perintah orang kedua jamak. Dalam konteks ini Yesus menyuruh para murid bangkit untuk bergerak, bukan sekadar terjaga dari tidur; 'Bangunlah' alami dan tetap sesuai dengan situasi.
- source_word: ἄγωμεν
  choice: mari kita pergi
  rationale: Subjungtif orang pertama jamak yang bersifat ajakan. 'Mari kita pergi' merupakan padanan Indonesia yang jelas dan wajar.
- source_word: ἰδού
  choice: Lihat
  rationale: Kata seru penunjuk yang menarik perhatian kepada peristiwa yang segera terjadi. 'Lihat' mempertahankan daya serunya dalam bahasa Indonesia modern.
- source_word: ὁ παραδιδούς με
  choice: orang yang mengkhianati Aku
  rationale: Partisipel aktif dengan artikel berfungsi sebagai nomina. Dalam konteks Yudas dan kisah sengsara, 'mengkhianati' menyampaikan makna relasionalnya, sedangkan arti yang lebih harfiah, 'menyerahkan', dipertahankan dalam catatan kaki.
- source_word: ἤγγικεν
  choice: sudah mendekat
  rationale: Bentuk perfek menyatakan tindakan mendekat yang telah berlangsung dengan hasil yang kini nyata. 'Sudah mendekat' mempertahankan aspek tersebut tanpa memastikan bahwa orang itu telah tiba sepenuhnya.
theological_decisions:
- issue: Pemaknaan παραδίδωμι dalam konteks kisah sengsara
  choice: mengkhianati
  alternative: menyerahkan
  rationale: Karena pelakunya adalah Yudas, unsur pengkhianatan nyata dalam konteks. Namun verba Yunani pada dasarnya juga berarti 'menyerahkan'; alternatif itu dicatat agar keluasan makna dan kaitannya dengan tema penyerahan Yesus tidak hilang.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Huruf kapital pada 'Aku' mengikuti konvensi umum teks Alkitab bahasa Indonesia ketika Yesus berbicara. Penanda catatan kaki ditempatkan setelah klausa yang dijelaskannya.
