base_translation:
  language: en
  yaml_path: translation/nt/mark/014/044.yaml
  text: The one betraying him had given them a signal[a], saying, “The one I kiss is he[c][b]. Seize him and lead him away securely.”
translation:
  language: id
  text: Orang yang mengkhianati Yesus telah memberi mereka sebuah tanda[a], katanya, “Orang yang kucium[b], dialah orangnya. Tangkap dia dan bawa dia pergi dengan penjagaan ketat.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “isyarat”; kata Yunani ini menunjuk pada tanda pengenal yang telah disepakati sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Ciuman merupakan salam yang lazim pada masa itu; di sini Yudas memakainya sebagai tanda untuk mengenali Yesus.
    reason: cultural_note
  - marker: c
    text: Atau “bawa dia pergi dengan aman.” Dalam konteks ini, kemungkinan maksudnya ialah memastikan bahwa ia tetap berada di bawah penguasaan mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: δεδώκει
  choice: telah memberi
  rationale: Bentuk pluperfek menunjukkan bahwa tanda itu sudah diberikan atau disepakati sebelumnya. Dalam bahasa Indonesia, “telah memberi” menyampaikan keberlangsungan narasi secara alami tanpa harus memakai bentuk yang kaku.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: orang yang mengkhianati Yesus
  rationale: Partisipel substantival diterjemahkan sebagai klausa relatif yang alami. Nama “Yesus” dipakai untuk memperjelas rujukan pronomina dalam ayat yang berdiri sendiri; παραδίδωμι dalam konteks ini bermakna mengkhianati dengan menyerahkan kepada pihak lawan.
- source_word: σύσσημον
  choice: sebuah tanda
  rationale: Kata ini menunjuk pada tanda pengenal yang telah disepakati. “Tanda” alami dalam bahasa Indonesia, sedangkan sifatnya sebagai isyarat yang disepakati dijelaskan dalam catatan kaki.
- source_word: λέγων
  choice: katanya
  rationale: Bentuk partisipel diterjemahkan secara idiomatis untuk memperkenalkan isi ucapan tanpa mengubah hubungan sintaksis utamanya.
- source_word: Ὃν ἂν φιλήσω
  choice: Orang yang akan kucium
  rationale: Konstruksi relatif tak tentu dengan ἄν menyatakan orang mana pun yang nantinya dicium Yudas; “akan” menangkap orientasi prospektif dalam ucapan tersebut.
- source_word: αὐτός ἐστιν
  choice: dialah orangnya
  rationale: Bentuk ini mempertahankan penegasan identifikasi dalam bahasa Indonesia yang wajar.
- source_word: κρατήσατε
  choice: Tangkap
  rationale: Dalam konteks penangkapan, kata ini menyatakan tindakan memegang atau menguasai secara paksa. “Tangkap” jelas dan tetap mempertahankan daya perintahnya.
- source_word: ἀπάγετε
  choice: bawa dia pergi
  rationale: Ungkapan ini menyampaikan gerakan membawa seseorang meninggalkan tempat itu secara alami dalam bahasa Indonesia.
- source_word: ἀσφαλῶς
  choice: dengan penjagaan ketat
  rationale: Dalam konteks penangkapan, adverbia ini paling mungkin berarti membawa Yesus dengan aman dari sudut pandang para penangkap, yakni memastikan Ia tetap dikuasai dan tidak lolos; pilihan ini menghindari kesan bahwa mereka menjaga keselamatan-Nya.
theological_decisions:
- issue: Makna ἀσφαλῶς dalam perintah membawa Yesus pergi
  choice: dengan penjagaan ketat
  alternative: dengan aman
  rationale: Keduanya mungkin secara leksikal, tetapi konteks penangkapan lebih mendukung gagasan pengawalan yang memastikan tahanan tidak lolos. Catatan kaki mempertahankan alternatif yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Bentuk “kucium” dan “dialah” mempertahankan kepadatan serta penegasan ucapan langsung. Catatan kaki ditempatkan tepat sesudah unsur yang dijelaskannya.
