  naturalness: Bahasa Indonesia baku dan mengalir dengan baik. "Orang yang akan kucium" dapat dipahami, tetapi "Orang yang kucium" lebih padat dan tidak menambahkan penandaan masa depan yang tidak perlu. Penempatan penanda catatan kaki budaya perlu dipindahkan agar langsung melekat pada kata "cium" yang dijelaskannya.
