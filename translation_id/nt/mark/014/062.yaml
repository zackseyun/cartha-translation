  naturalness: “Akulah” merupakan jawaban Indonesia yang wajar dan tegas dalam dialog, sambil tidak menambahkan predikat. “Duduk di sebelah kanan Kuasa” bersifat khidmat dan agak berciri alkitabiah, tetapi tepat untuk mempertahankan diksi sumber; catatan kaki menjelaskan rujukan ilahinya.
  terminology: “Anak Manusia” dipertahankan sebagai sebutan baku dan penting secara intertekstual. “Kuasa” dikapitalisasi sebagai sirkumlokusi penuh hormat bagi Allah, tanpa menggantikannya dengan “Allah” atau “Yang Mahakuasa.” “Awan-awan di langit” mempertahankan bentuk jamak dan citra Daniel 7:13.
