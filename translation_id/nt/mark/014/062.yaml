  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἐγώ εἰμι, καὶ ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν καθήμενον τῆς δυνάμεως καὶ ἐρχόμενον μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/062.yaml
  text: And Jesus said[a], “I am[c][b], and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven.”
translation:
  language: id
  text: Namun Yesus berkata, “Akulah[a], dan kamu akan melihat Anak Manusia duduk di sebelah kanan Kuasa[b] dan datang bersama awan-awan di langit.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani secara harfiah berbunyi “Aku adalah,” tanpa predikat eksplisit. Dapat juga diterjemahkan “Akulah dia.”
    reason: alternative_reading
  - marker: b
    text: “Kuasa” adalah sebutan penuh hormat yang merujuk kepada Allah.
    reason: cultural_note
  - marker: c
    text: Lihat Mazmur 110:1 dan Daniel 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Akulah Dia
  rationale: Dalam konteks pertanyaan imam besar, ungkapan ini merupakan jawaban tegas tentang identitas Yesus. Bahasa Indonesia memerlukan pelengkap agar jawaban afirmatif itu alami; catatan kaki mempertahankan bentuk harfiah Yunani yang hanya berbunyi “Aku adalah.”
- source_word: ὄψεσθε
  choice: kamu akan melihat
  rationale: Menerjemahkan bentuk futur secara langsung dan wajar, serta mempertahankan nada nubuat yang ditujukan kepada para pendengar.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan sebutan khas Yesus dan kaitannya dengan Daniel 7 tanpa memparafrasakannya.
- source_word: ἐκ δεξιῶν
  choice: di sebelah kanan
  rationale: Ungkapan Indonesia yang alami untuk tempat kehormatan dan wewenang tertinggi.
- source_word: τῆς δυνάμεως
  choice: Yang Mahakuasa
  rationale: Kata “Kuasa” di sini merupakan ungkapan hormat yang merujuk kepada Allah. “Yang Mahakuasa” menyampaikan fungsi rujukan ilahi itu secara alami dalam bahasa Indonesia tanpa langsung menggantinya dengan nama “Allah”; catatan kaki menjelaskan ungkapan sumber.
- source_word: καθήμενον
  choice: duduk
  rationale: Menyatakan posisi bertakhta secara langsung; dalam gabungan dengan tempat di sebelah kanan Yang Mahakuasa, martabat dan wewenangnya jelas.
- source_word: ἐρχόμενον
  choice: datang
  rationale: Padanan baku yang mempertahankan gema eskatologis Daniel 7.
- source_word: μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: bersama awan-awan di langit
  rationale: Mengikuti hubungan Yunani μετὰ, “bersama/dengan,” dan menyampaikan τοῦ οὐρανοῦ secara wajar dalam bahasa Indonesia, sambil mempertahankan citra apokaliptiknya.
- source_word: καὶ ... καὶ
  choice: dan ... dan
  rationale: 'Mempertahankan susunan kumulatif kedua klaim: duduk dalam kedudukan mulia dan datang bersama awan-awan.'
theological_decisions:
- issue: Cara menerjemahkan Ἐγώ εἰμι sebagai jawaban afirmatif tanpa menutup kemungkinan gema teologisnya
  choice: Akulah Dia dalam teks utama, dengan bentuk harfiah Yunani dalam catatan kaki
  alternative: Aku adalah
  rationale: “Akulah Dia” merupakan jawaban identifikasi yang alami dalam bahasa Indonesia dan sesuai dengan konteks langsung. Catatan kaki menunjukkan bahwa bahasa Yunani tidak memiliki predikat eksplisit, sehingga kemungkinan gema yang lebih luas tidak disembunyikan.
- issue: Cara menyampaikan τῆς δυνάμεως sebagai sebutan hormat bagi Allah
  choice: Yang Mahakuasa
  alternative: Kuasa; Allah
  rationale: Terjemahan ini tetap memakai sebutan tidak langsung bagi Allah dan terdengar wajar serta khidmat dalam bahasa Indonesia. Catatan kaki menjelaskan bahwa teks Yunani secara harfiah memakai “Kuasa,” sehingga bentuk ungkapan sumber tetap transparan.
- issue: Gema Mazmur 110:1 dan Daniel 7:13
  choice: Dipertahankan melalui istilah Anak Manusia, sebelah kanan, dan awan-awan, serta diberi catatan silang
  alternative: Menjelaskan penggenapan secara eksplisit di dalam teks utama
  rationale: Teks sumber menggemakan kedua bagian Kitab Suci itu tanpa menyisipkan penjelasan tafsir. Karena itu, hubungan antarteks dipertahankan tetapi tidak diperluas menjadi pernyataan doktrinal tambahan.
translation_notes:
  register: Bahasa modern, lugas, dan khidmat. “Namun” menandai kontras δέ secara alami. Kapitalisasi “Anak Manusia” dan “Yang Mahakuasa” menandai gelar atau rujukan ilahi. Semua penanda catatan kaki ditempatkan pada bagian teks yang dijelaskannya.
