- from: Namun Yesus berkata, “Akulah Dia[a], dan kamu akan melihat Anak Manusia duduk di sebelah kanan Yang Mahakuasa[b] dan datang bersama awan-awan di langit.[c]”
  to: Namun Yesus berkata, “Akulah[a], dan kamu akan melihat Anak Manusia duduk di sebelah kanan Kuasa[b] dan datang bersama awan-awan di langit.”[c]
  rationale: Revisi menghapus tambahan interpretatif “Dia” dari jawaban Yesus dan mengganti “Yang Mahakuasa” dengan “Kuasa” agar bentuk sirkumlokusif Yunani tetap terlihat. Istilah, susunan dua klaim yang dihubungkan “dan,” serta rujukan silang dipertahankan.
