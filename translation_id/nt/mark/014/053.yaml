  text: Καὶ ἀπήγαγον τὸν Ἰησοῦν πρὸς τὸν ἀρχιερέα, καὶ ⸀συνέρχονται πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι καὶ οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/053.yaml
  text: And they led Jesus away to the high priest[a], and all the chief priests and the elders and the scribes gathered together.
translation:
  language: id
  text: Lalu mereka membawa Yesus kepada Imam Besar. Semua imam kepala, tua-tua, dan ahli-ahli Taurat pun berkumpul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani memakai bentuk kini historis, secara harfiah “berkumpul”, untuk menghidupkan narasi tentang peristiwa lampau.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  choice: membawa
  rationale: Dalam konteks penahanan, ἀπάγω berarti membawa atau menggiring seseorang pergi. “Membawa” alami dalam bahasa Indonesia dan tidak menambahkan rincian tentang caranya.
- source_word: ἀρχιερέα
  choice: Imam Besar
  rationale: Bentuk tunggal ini menunjuk kepada pemegang jabatan imam besar. Kapitalisasi menandai jabatan khusus dalam konteks ini.
- source_word: συνέρχονται
  choice: berkumpul
  rationale: Kata ini menyatakan bahwa para pemimpin datang bersama sebagai suatu kelompok. Bentuk kini historis Yunani dipertahankan secara leksikal sebagai “berkumpul”, tetapi ditempatkan dalam narasi lampau dengan bantuan partikel “pun”; catatan kaki menjelaskan peralihan kala tersebut.
- source_word: πάντες
  choice: semua
  rationale: “Semua” mempertahankan penekanan pada keseluruhan kelompok kepemimpinan yang disebutkan.
- source_word: ἀρχιερεῖς
  choice: imam kepala
  rationale: Bentuk jamak mengacu pada kalangan pemimpin keimaman, berbeda dari Imam Besar tunggal yang baru disebut.
- source_word: πρεσβύτεροι
  choice: tua-tua
  rationale: Dalam konteks kelembagaan Yahudi, istilah ini menunjuk para pemimpin yang diakui, bukan sekadar orang lanjut usia. “Tua-tua” merupakan istilah Alkitabiah Indonesia yang ringkas dan dikenal.
- source_word: γραμματεῖς
  choice: ahli-ahli Taurat
  rationale: Dalam konteks Injil, istilah ini menunjuk para pakar dan pengajar hukum Taurat. Pilihan ini lebih jelas bagi pembaca Indonesia modern daripada “juru tulis” dan sesuai dengan fungsi kelompok tersebut.
theological_decisions:
- issue: Bentuk kini historis συνέρχονται di tengah narasi lampau
  choice: Diterjemahkan “pun berkumpul” dalam alur narasi lampau, dengan catatan tentang bentuk Yunani
  alternative: “berkumpullah” atau terjemahan yang secara lebih kentara mempertahankan bentuk kini historis
  rationale: Keputusan ini menyangkut gaya narasi, bukan doktrin. Susunan yang dipilih terdengar alami dalam bahasa Indonesia sambil tetap memberi tahu pembaca bahwa teks Yunani memakai bentuk kini yang menghidupkan adegan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Lalu” menjaga kesinambungan narasi; “pun” menandai perkembangan berikutnya secara alami. Istilah kelembagaan Yahudi diterjemahkan dengan bentuk yang umum dikenal pembaca Alkitab Indonesia.
