source:
  edition: WLC
  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: id
  text: Uap segala uap[a], kata Qohelet[b]; uap segala uap, segala sesuatu hanyalah uap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani הֶבֶל (hevel) secara harfiah berarti “embusan napas” atau “uap.” Di seluruh kitab ini, kata tersebut menggambarkan sesuatu yang cepat berlalu, sukar digenggam atau dipahami, dan sering kali tidak sesuai dengan yang diharapkan. Tidak ada satu kata abstrak dalam bahasa Indonesia yang mencakup semua nuansa itu. Ungkapan “uap segala uap” adalah bentuk superlatif Ibrani, seperti “kidung segala kidung” atau “yang mahakudus.” Terjemahan tradisional “kesia-siaan” hanya menonjolkan sebagian maknanya.
    reason: lexical_choice
  - marker: b
    text: Qohelet adalah sebutan Ibrani yang secara tradisional diterjemahkan “Pengajar” atau “Pengkhotbah.” Karena masing-masing terjemahan mempersempit kemungkinan maknanya, sebutan Ibrani itu dipertahankan dalam bentuk transliterasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵל / הָבֶל
  choice: uap / hanyalah uap
  rationale: Kata Ibrani hevel secara konkret menunjuk pada embusan napas atau uap. Dalam Pengkhotbah, gambaran itu memuat secara bersamaan kesan fana, sukar digenggam, dan ketimpangan antara harapan dengan kenyataan. “Uap” mempertahankan gambaran konkret tersebut; dalam klausa predikatif, “hanyalah” menyampaikan nada penilaian dan perendahan yang tersirat dalam konteks.
- source_word: הֲבֵל הֲבָלִים
  choice: uap segala uap
  rationale: Susunan konstruksi dengan bentuk jamak ini merupakan ungkapan superlatif mutlak dalam bahasa Ibrani, sejenis dengan “kidung segala kidung” dan “yang mahakudus.” Bentuk “uap segala uap” mempertahankan citra dan susunan puitis sumber tanpa membatasinya menjadi satu gagasan abstrak saja.
- source_word: אָמַר
  choice: kata
  rationale: Dalam formula ujaran sastra ini, bentuk lampau Ibrani berfungsi memperkenalkan pernyataan yang tetap hadir bagi pembaca. Bahasa Indonesia secara alami memakai “kata” untuk fungsi tersebut.
- source_word: קֹהֶלֶת
  choice: Qohelet
  rationale: Transliterasi mempertahankan sebutan Ibrani yang nuansanya tidak pasti, alih-alih langsung mempersempitnya menjadi “Pengajar” atau “Pengkhotbah.” Ejaan “Qohelet” mendekati bentuk Ibrani dan mudah dibaca dalam bahasa Indonesia.
- source_word: הַכֹּל
  choice: segala sesuatu
  rationale: Ungkapan ini bersifat menyeluruh. “Segala sesuatu” menyampaikan cakupan totalnya secara alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Cara menerjemahkan הֶבֶל sebagai motif utama kitab
  choice: Mempertahankan citra konkret “uap,” dengan “uap segala uap” pada ungkapan superlatif dan “hanyalah uap” pada predikat.
  alternative: kesia-siaan; ketidakbermaknaan; kefanaan; kemustahilan; hal yang sia-sia
  rationale: Padanan abstrak cenderung memilih hanya satu sisi makna dan dapat mengarahkan pembaca pada nihilisme atau kegagalan tujuan yang tidak selalu dinyatakan teks. Citra “uap” membiarkan kefanaan, ketakterjangkauan, dan ironi tetap hadir bersama-sama.
- issue: Status קֹהֶלֶת sebagai nama, gelar, atau sebutan peran
  choice: Mentransliterasikannya sebagai “Qohelet.”
  alternative: Sang Pengajar; Sang Pengkhotbah; Penghimpun
  rationale: Bentuk dan fungsi kata Ibrani ini tidak sepenuhnya pasti. Transliterasi menjaga keterbukaan makna dan menghindari penetapan peran tertentu yang melampaui bukti sumber.
translation_notes:
  register: Bahasa dibuat ringkas, puitis, dan bermartabat. Susunan “uap segala uap” sengaja terasa agung dan tidak biasa karena mencerminkan superlatif puitis Ibrani, sedangkan “segala sesuatu hanyalah uap” tetap alami dan jelas bagi pembaca Indonesia modern.
