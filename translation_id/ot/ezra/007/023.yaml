base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/023.yaml
  text: Whatever is commanded by the God of heaven[a], let it be done diligently for the house of the God of heaven[b], lest wrath come upon the kingdom of the king and his sons.
translation:
  language: id
  text: Apa pun yang diperintahkan oleh Allah semesta langit hendaklah dilaksanakan dengan saksama untuk rumah Allah semesta langit[a], supaya murka tidak menimpa kerajaan raja dan anak-anaknya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rumah Allah semesta langit” merujuk kepada Bait Allah.
    reason: cultural_note
  - marker: b
    text: Atau, secara lebih harfiah, “Mengapa harus ada murka atas kerajaan raja dan anak-anaknya?”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל דִּי
  choice: Segala sesuatu yang
  rationale: Ungkapan relatif yang mencakup keseluruhan diterjemahkan secara alami sekaligus mempertahankan daya cakup ‘apa pun/semua yang’.
- source_word: מִן טַעַם אֱלָהּ שְׁמַיָּא
  choice: diperintahkan oleh Allah semesta langit
  rationale: טַעַם dalam konteks administratif berarti perintah atau ketetapan, sedangkan מִן menandai sumber. Gelar ilahi dipertahankan dengan ungkapan baku dan bermartabat ‘Allah semesta langit’.
- source_word: יִתְעֲבֵד
  choice: harus dilaksanakan
  rationale: Bentuk pasif imperfek berdaya perintah dalam konteks surat keputusan. ‘Harus dilaksanakan’ menyampaikan kewajiban secara wajar dalam bahasa Indonesia.
- source_word: אַדְרַזְדָּא
  choice: dengan saksama
  rationale: Kata ini menyiratkan pelaksanaan yang tekun, cermat, dan tepat. ‘Dengan saksama’ sesuai dengan konteks administratif tanpa mempersempitnya hanya kepada kecepatan.
- source_word: לְבֵית אֱלָהּ שְׁמַיָּא
  choice: bagi rumah Allah semesta langit
  rationale: ‘Rumah’ mempertahankan metafora sumber, sementara catatan menjelaskan bahwa yang dimaksud ialah Bait Allah.
- source_word: דִּי לְמָה לֶהֱוֵא קְצַף
  choice: supaya jangan timbul murka
  rationale: Ungkapan ini secara harfiah dapat dibaca sebagai pertanyaan ‘mengapa harus ada murka?’, tetapi dalam konteks berfungsi sebagai peringatan untuk mencegah murka. Catatan mempertahankan bentuk alternatifnya.
- source_word: עַל מַלְכוּת מַלְכָּא
  choice: atas kerajaan raja
  rationale: Terjemahan dekat dengan struktur sumber dan menunjukkan bahwa sasaran murka adalah wilayah kekuasaan sang raja, bukan hanya pribadi raja.
- source_word: וּבְנוֹהִי
  choice: dan anak-anaknya
  rationale: Nomina ini secara langsung berarti anak-anak lelaki atau putra-putranya. ‘Anak-anaknya’ alami dalam bahasa Indonesia dan tidak memperluasnya secara eksplisit menjadi seluruh keturunan.
theological_decisions:
- issue: Makna ‘rumah Allah semesta langit’
  choice: Mempertahankan kata ‘rumah’ dalam teks utama
  alternative: Menerjemahkannya langsung sebagai ‘Bait Allah’ atau ‘bait Allah semesta langit’
  rationale: Teks sumber memakai kata ‘rumah’, yang dalam konteks ini merujuk kepada Bait Allah. Metafora asli dipertahankan, sedangkan acuannya dijelaskan dalam catatan.
- issue: Bentuk klausa peringatan tentang murka
  choice: supaya jangan timbul murka
  alternative: sebab mengapa harus ada murka?
  rationale: Pilihan utama menyampaikan fungsi pragmatis klausa sebagai peringatan, tetapi bentuk pertanyaan retoris yang lebih harfiah dicatat agar ambiguitas ungkapan Aram tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Gaya administratif dekret dipertahankan melalui ‘harus dilaksanakan dengan saksama’. Istilah ‘rumah’ dipertahankan dari sumber, dengan penjelasan singkat dalam catatan kaki.
