lexical_decisions:
- source_word: בֶּן
  choice: anak
  rationale: Dalam silsilah, בֶּן paling wajar diterjemahkan dengan rumusan genealogis Indonesia “anak”. Meskipun silsilah dapat melompati generasi, bentuk Ibrani tidak diperluas menjadi “keturunan”.
- source_word: זְרַחְיָה
  choice: Zerahya
  rationale: Nama pribadi dialihaksarakan menurut bunyi Ibrani dan pola ejaan Indonesia; unsur akhir יָה direpresentasikan sebagai “ya”.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Nama pribadi dialihaksarakan secara wajar dalam bahasa Indonesia. Konsonan rangkap akibat dages tidak perlu ditulis ganda karena ejaan Indonesia tidak lazim menandainya.
- source_word: בֻּקִּי
  choice: Buki
  rationale: Nama pribadi dialihaksarakan secara wajar dalam bahasa Indonesia. Konsonan rangkap akibat dages tidak perlu ditulis ganda.
