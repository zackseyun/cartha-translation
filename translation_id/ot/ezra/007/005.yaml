  text: בֶּן אֲבִישׁ֗וּעַ בֶּן פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּן אַהֲרֹ֥ן הַ/כֹּהֵ֖ן הָ/רֹֽאשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/005.yaml
  text: son of Abishua[a], son of Phinehas, son of Eleazar[b], son of Aaron the chief priest.
translation:
  language: id
  text: anak Abisua[a], anak Pinehas, anak Eleazar, anak Harun, imam utama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam silsilah Ibrani, “anak” dapat juga berarti “keturunan”; beberapa generasi mungkin tidak disebutkan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “imam, [yang] kepala/utama.” Secara tradisional diterjemahkan “imam besar,” tetapi ungkapan Ibrani di sini bukan sebutan yang lebih lazim untuk “imam besar.”
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן
  choice: anak
  rationale: Dalam silsilah, בֶּן secara langsung berarti “anak,” tetapi dapat pula menunjuk kepada keturunan dalam garis keluarga ketika beberapa generasi tidak disebutkan. Pengulangan rumus Ibrani dipertahankan.
- source_word: אֲבִישׁוּעַ
  choice: Abisua
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang alami dan lazim dalam bahasa Indonesia.
- source_word: פִּינְחָס
  choice: Pinehas
  rationale: Nama pribadi ditransliterasikan menurut bentuk Alkitab yang lazim dalam bahasa Indonesia.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אַהֲרֹן
  choice: Harun
  rationale: Dipakai bentuk nama yang telah mapan dalam bahasa Indonesia.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: כֹּהֵן berarti imam; bersama הָרֹאשׁ, kata ini membentuk sebutan bagi imam yang utama.
- source_word: הָרֹאשׁ
  choice: kepala
  rationale: רֹאשׁ secara harfiah berarti “kepala” dan dalam sebutan jabatan menyatakan kedudukan utama. “Imam kepala” mencerminkan susunan khusus teks ini tanpa menggantinya dengan gelar teknis yang lebih lazim, “imam besar.”
theological_decisions:
- issue: Sebutan keimaman Harun
  choice: imam kepala
  alternative: imam besar
  rationale: Teks Ibrani berbunyi הַכֹּהֵן הָרֹאשׁ, secara harfiah “imam, [yang] kepala/utama,” bukan ungkapan yang lebih lazim bagi “imam besar,” yaitu הַכֹּהֵן הַגָּדוֹל. Pilihan ini mempertahankan perbedaan leksikal tanpa menyangkal kedudukan Harun sebagai imam utama.
- issue: Cakupan hubungan silsilah בֶּן
  choice: anak dalam teks utama, dengan catatan bahwa maknanya dapat lebih luas
  alternative: keturunan
  rationale: “Anak” mempertahankan bentuk berulang teks Ibrani, sedangkan catatan kaki menjaga kemungkinan bahwa silsilah ini memakai בֶּן untuk keturunan dalam garis keluarga dan tidak selalu untuk hubungan ayah-anak langsung.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur silsilah yang berulang dipertahankan agar hubungan dengan ayat-ayat sebelumnya tetap jelas. Bentuk nama mengikuti pemakaian Indonesia yang mapan.
