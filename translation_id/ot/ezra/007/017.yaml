base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/017.yaml
  text: Therefore you shall diligently buy with this silver bulls[a], rams, lambs, along with their grain offerings and their drink offerings[c][b], and you shall offer them on the altar of the house of your God that is in Jerusalem.
translation:
  language: id
  text: Karena itu, dengan perak ini[b] belilah dengan saksama[a] lembu-lembu jantan, domba-domba jantan, dan anak-anak domba, beserta kurban sajian dan kurban curahan yang menyertainya. Persembahkanlah semuanya di atas mazbah di rumah Allah kalian[c] yang ada di Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan cermat” atau “dengan tepat”; kata keterangan Aramnya menekankan pelaksanaan perintah secara teliti.
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ini, “perak” berfungsi sebagai uang atau dana, tetapi teksnya secara harfiah menyebut “perak”.
    reason: lexical_alternative
  - marker: c
    text: Atau “Bait Allah kalian”; secara harfiah, “rumah Allah kalian”. Kata ganti “kalian” berbentuk jamak dalam teks Aram.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: Karena itu
  rationale: Ungkapan Aram ini menyatakan kesimpulan atau alasan, ‘karena itu/oleh sebab itu’. ‘Karena itu’ alami dan mempertahankan daya inferensialnya.
- source_word: אָסְפַּרְנָא
  choice: dengan saksama
  rationale: Kata keterangan ini menekankan pelaksanaan yang cermat atau tepat. ‘Dengan saksama’ terdengar wajar dalam instruksi resmi dan tidak sekadar menyiratkan kecepatan.
- source_word: תִקְנֵא
  choice: belilah
  rationale: Bentuk ini ditujukan kepada satu orang dan berarti membeli atau memperoleh. Imperatif ‘belilah’ mempertahankan daya perintah surat kerajaan.
- source_word: בְּכַסְפָּא דְנָה
  choice: memakai perak ini
  rationale: כַּסְפָּא secara harfiah berarti ‘perak’, tetapi dalam konteks administratif berfungsi sebagai dana. ‘Memakai perak ini’ mempertahankan citra sumber sekaligus jelas sebagai alat pembayaran.
- source_word: תּוֹרִין דִּכְרִין אִמְּרִין
  choice: sapi-sapi jantan, domba-domba jantan, dan anak-anak domba
  rationale: 'Istilah-istilah ini menunjuk hewan kurban: sapi jantan, domba jantan, dan anak domba. Bentuk ulang memperjelas jamak dalam bahasa Indonesia.'
- source_word: מִנְחָתְהוֹן
  choice: kurban-kurban sajian
  rationale: Dalam konteks ibadah, מִנְחָה menunjuk kurban berbahan hasil bumi yang menyertai kurban hewan. ‘Kurban sajian’ merupakan istilah Indonesia yang jelas dan lazim.
- source_word: נִסְכֵּיהוֹן
  choice: kurban-kurban curahannya
  rationale: Istilah ini menunjuk persembahan cair yang dicurahkan. Akhiran ‘-nya’ mempertahankan hubungan dengan hewan-hewan kurban yang baru disebut.
- source_word: וּתְקָרֵב הִמּוֹ
  choice: Persembahkanlah semuanya
  rationale: Kata kerja ini secara harfiah berarti membawa mendekat dan lazim dipakai untuk tindakan mempersembahkan kurban. ‘Semuanya’ secara alami merangkum barang-barang yang disebut.
- source_word: עַל מַדְבְּחָה
  choice: di atas mazbah
  rationale: Terjemahan langsung dan alami bagi lokasi tindakan kurban; ‘mazbah’ mempertahankan istilah khusus untuk altar persembahan.
- source_word: בֵּית אֱלָהֲכֹם
  choice: Rumah Allah kalian
  rationale: Secara harfiah frasa ini berbunyi ‘rumah Allah kalian’. Pronomina sumber berbentuk jamak, walaupun perintah sebelumnya ditujukan kepada satu orang; terjemahan mempertahankan peralihan gramatikal tersebut.
