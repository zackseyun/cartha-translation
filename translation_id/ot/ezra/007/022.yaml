base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/022.yaml
  text: up to one hundred talents of silver[a], and up to one hundred cors of wheat, and up to one hundred baths of wine, and up to one hundred baths of oil, and salt without limit.
translation:
  language: id
  text: hingga seratus talenta perak, hingga seratus kor gandum, hingga seratus bat anggur, hingga seratus bat minyak, dan garam tanpa jumlah yang ditetapkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “yang tidak tertulis”, yakni tidak ada jumlah garam tertentu yang dicantumkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: hingga
  rationale: Dalam daftar administratif ini, kata tersebut menandai batas maksimum pemberian. Pengulangan “hingga” mempertahankan susunan dan irama resmi teks Aram.
- source_word: כְּסַף
  choice: perak
  rationale: Kata ini secara harfiah menunjuk pada perak; penyebutan satuan berat talenta mendukung terjemahan logamnya, bukan istilah umum “uang”.
- source_word: כַּכְּרִין
  choice: talenta
  rationale: Satuan berat kuno ini dipertahankan dengan istilah yang lazim dalam bahasa Indonesia, tanpa konversi modern yang belum tentu tepat.
- source_word: חִנְטִין
  choice: gandum
  rationale: Kata Aram ini secara khusus berarti gandum, bukan biji-bijian secara umum.
- source_word: כֹּרִין
  choice: kor
  rationale: Kor adalah satuan takaran kering kuno. Transliterasi mempertahankan satuan khusus dalam teks sumber.
- source_word: חֲמַר
  choice: anggur
  rationale: Dalam daftar perbekalan ini, kata tersebut menunjuk pada minuman anggur.
- source_word: בַּתִּין
  choice: bat
  rationale: Bat adalah satuan takaran cair kuno; bentuk nama satuannya dipertahankan dan tidak dikonversi secara spekulatif.
- source_word: מְשַׁח
  choice: minyak
  rationale: Teks menyebut minyak tanpa secara eksplisit menentukan bahwa itu minyak zaitun.
- source_word: מְלַח
  choice: garam
  rationale: Padanan langsung dan alami bagi komoditas terakhir dalam daftar.
- source_word: דִּי לָא כְתָב
  choice: tanpa jumlah yang ditetapkan
  rationale: Secara harfiah frasa ini berarti “yang tidak tertulis”, tetapi dalam konteks keputusan administratif maksudnya ialah tidak ada jumlah tertentu yang dicantumkan. Terjemahan ini menyampaikan makna itu tanpa menyimpulkan secara berlebihan bahwa persediaannya benar-benar tak terbatas.
