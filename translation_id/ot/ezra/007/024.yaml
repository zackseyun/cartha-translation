base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/024.yaml
  text: And we make known to you that it is not permitted to impose tribute[a], tax, or toll on any of the priests, Levites, singers, gatekeepers, temple servants[b], or servants of this house of God.
translation:
  language: id
  text: Kami memberitahukan kepada kalian bahwa tidak diperbolehkan mengenakan upeti, pajak, atau bea[a] kepada siapa pun di antara para imam, orang Lewi, penyanyi, penjaga pintu gerbang, pelayan Bait Allah[b], atau orang-orang yang melayani di rumah Allah ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ketiga istilah fiskal ini tampaknya menunjuk pada jenis pungutan kerajaan yang berbeda-beda. Istilah terakhir juga dapat diterjemahkan “bea perjalanan” atau “bea lintas”.
    reason: lexical_alternative
  - marker: b
    text: Secara tradisional disebut “Netinim”, yaitu transliterasi dari נְתִינַיָּא.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהוֹדְעִין
  choice: Kami memberitahukan
  rationale: Partisipel Aram ini berfungsi sebagai rumusan pemberitahuan resmi; bentuk ini mempertahankan nada administratif dan subjek jamak tersirat.
- source_word: לְכֹם
  choice: kepada kalian
  rationale: Pronomina Aramnya jamak; 'kalian' mempertahankan jumlah tersebut dengan bahasa Indonesia modern.
- source_word: כָל
  choice: siapa pun dari antara
  rationale: Dalam konstruksi daftar yang diikuti larangan, ungkapan ini menyatakan bahwa tidak seorang pun dalam golongan-golongan tersebut boleh dikenai pungutan.
- source_word: כָּהֲנַיָּא וְלֵוָיֵא זַמָּרַיָּא תָרָעַיָּא
  choice: para imam, orang Lewi, penyanyi, penjaga pintu gerbang
  rationale: Padanan langsung dan lazim bagi empat kelompok petugas ibadah yang disebutkan.
- source_word: נְתִינַיָּא
  choice: pelayan Bait Allah
  rationale: Padanan fungsional ini lebih mudah dipahami daripada transliterasi 'Netinim', sekaligus membedakan kelompok khusus tersebut dari kategori pelayan berikutnya.
- source_word: פָלְחֵי בֵּית אֱלָהָא דְנָה
  choice: mereka yang melayani rumah Allah ini
  rationale: פָלְחֵי secara luas menunjuk orang-orang yang melayani atau bekerja dalam rumah Allah; frasa verbal menghindari penambahan kata 'lain' yang tidak eksplisit dalam sumber.
- source_word: מִנְדָּה בְלוֹ וַהֲלָךְ
  choice: upeti, pajak, atau bea
  rationale: Tiga istilah dipertahankan sebagai jenis pungutan yang berbeda; rincian tepat masing-masing istilah tidak sepenuhnya pasti.
- source_word: לָא שַׁלִּיט לְמִרְמֵא עֲלֵיהֹם
  choice: tidak diperbolehkan mengenakan ... kepada
  rationale: Ungkapan ini menyatakan tidak adanya kewenangan legal untuk membebankan pungutan atas mereka.
