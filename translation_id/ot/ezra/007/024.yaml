  register: Bahasa Indonesia baku modern dengan nada resmi-administratif. 'Kalian' dipakai untuk mempertahankan bentuk jamak לְכֹם. Kapitalisasi 'Bait Allah' dipakai sebagai sebutan institusional bagi kelompok Netinim, sedangkan 'rumah Allah ini' menerjemahkan frasa penunjuk sumber secara lebih harfiah.
