  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עָלַ֣/י הִטָּה חֶ֗סֶד לִ/פְנֵ֤י הַ/מֶּ֨לֶךְ֙ וְ/יֽוֹעֲצָ֔י/ו וּ/לְ/כָל שָׂרֵ֥י הַ/מֶּ֖לֶךְ הַ/גִּבֹּרִ֑ים וַ/אֲנִ֣י הִתְחַזַּ֗קְתִּי כְּ/יַד יְהוָ֤ה אֱלֹהַ/י֙ עָלַ֔/י וָ/אֶקְבְּצָ֧/ה מִ/יִּשְׂרָאֵ֛ל רָאשִׁ֖ים לַ/עֲל֥וֹת עִמִּֽ/י־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/028.yaml
  text: and who extended steadfast love to me before the king and his counselors and all the king’s mighty officials[a]. And I took courage, because the hand of Yahweh my God was upon me[c][b], and I gathered leading men from Israel to go up with me.
translation:
  language: id
  text: dan yang menunjukkan kasih setia-Nya kepadaku[a] di hadapan raja, para penasihatnya, dan semua pejabat raja yang perkasa. Aku pun menguatkan diri karena tangan Yahweh, Allahku, ada atasku[b], lalu aku mengumpulkan para pemimpin dari Israel[c] untuk naik bersamaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengarahkan kasih setia kepada aku”; ungkapan ini juga dapat dipahami sebagai “menunjukkan kemurahan kepadaku.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “aku menguatkan diriku sesuai dengan tangan Yahweh, Allahku, yang ada atasku.”'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “kepala-kepala”; maksudnya, para pemimpin atau orang-orang terkemuka dari Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִטָּה חֶסֶד
  choice: menunjukkan kasih setia-Nya kepadaku
  rationale: Ungkapan Ibrani secara harfiah menggambarkan tindakan mengarahkan atau mencondongkan חֶסֶד kepada seseorang. Terjemahan ini mempertahankan bobot relasional חֶסֶד melalui 'kasih setia' sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Padanan langsung dan wajar untuk konteks istana, mencakup raja, para penasihatnya, dan para pejabatnya.
- source_word: יֹעֲצָיו
  choice: para penasihatnya
  rationale: Istilah ini sesuai dengan orang-orang yang memberi nasihat dalam lingkungan istana dan mudah dipahami pembaca modern.
- source_word: שָׂרֵי הַמֶּלֶךְ הַגִּבֹּרִים
  choice: semua pejabat raja yang berkuasa
  rationale: שָׂרִים menunjuk para pejabat atau pembesar, sedangkan הַגִּבֹּרִים menandai kekuatan atau kuasa mereka. Pilihan ini sesuai dengan latar pemerintahan Persia.
- source_word: הִתְחַזַּקְתִּי
  choice: aku pun menguatkan hati
  rationale: Bentuk refleksif ini menyatakan bahwa Ezra meneguhkan atau memberanikan dirinya. 'Menguatkan hati' menyampaikan makna keberanian secara idiomatis tanpa meniadakan bentuk refleksifnya.
- source_word: כְּיַד יְהוָה אֱלֹהַי עָלַי
  choice: karena tangan Yahweh, Allahku, menyertai aku
  rationale: Metafora 'tangan' dipertahankan sebagai gambaran kuasa dan pertolongan ilahi. 'Karena' menyatakan hubungan kontekstual antara penyertaan Allah dan keberanian Ezra, sedangkan 'menyertai' mengungkapkan עָלַי secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan sebuah gelar.
- source_word: וָאֶקְבְּצָה
  choice: lalu aku mengumpulkan
  rationale: Padanan naratif yang langsung; 'lalu' menyampaikan kelanjutan tindakan tanpa membebani kalimat.
- source_word: רָאשִׁים
  choice: para pemimpin
  rationale: Secara harfiah berarti 'kepala-kepala', tetapi di sini menunjuk orang-orang yang mempunyai kedudukan kepemimpinan di antara Israel.
- source_word: לַעֲלוֹת
  choice: untuk naik
  rationale: Mempertahankan ungkapan arah tradisional untuk perjalanan menuju Yerusalem tanpa menambahkan nama tempat yang tidak disebut dalam ayat ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankannya sebagai nama perjanjian Allah dan bukan menggantinya dengan gelar.
- issue: Sumber keberanian Ezra dalam frasa כְּיַד ... עָלַי
  choice: hubungan sebab dinyatakan dengan 'karena', sambil mempertahankan metafora tangan ilahi
  alternative: aku menguatkan diri sesuai dengan tangan Yahweh, Allahku, yang ada atasku
  rationale: כְּיַד secara formal dapat berarti 'sesuai dengan tangan', tetapi dalam konteks frasa itu menjelaskan dasar keberanian Ezra. Terjemahan utama mengungkapkan hubungan tersebut tanpa menghapus citra tangan Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pronomina penghormatan '-Nya' dipakai untuk tindakan Allah. Metafora alkitabiah 'tangan Yahweh' dan gerak 'naik' dipertahankan, sementara susunan kalimat dibuat alami bagi pembaca umum.
