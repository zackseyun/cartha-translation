source:
  edition: WLC
  text: מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל מִתְנַדַּ֣ב בְּ/מַלְכוּתִ/י֩ מִן עַמָּ֨/ה יִשְׂרָאֵ֜ל וְ/כָהֲנ֣וֹ/הִי וְ/לֵוָיֵ֗/א לִ/מְהָ֧ךְ לִֽ/ירוּשְׁלֶ֛ם עִמָּ֖/ךְ יְהָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/013.yaml
  text: A decree is issued by me that anyone in my kingdom from the people of Israel[a], and their priests and Levites, who freely offers himself to go to Jerusalem with you[b], may go.
translation:
  language: id
  text: 'Aku mengeluarkan ketetapan ini: Setiap orang di dalam kerajaanku yang dari antara umat Israel, para imamnya[a], dan orang-orang Lewi dengan sukarela menawarkan diri[b] untuk pergi bersamamu ke Yerusalem boleh pergi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “para imamnya.” Akhiran Aram ini secara tata bahasa juga dapat merujuk kepada seorang laki-laki, tetapi konteks paling wajar menghubungkannya dengan umat Israel.
    reason: alternative_reading
  - marker: b
    text: Atau, “yang bersedia.” Bentuk partisipel Aram menekankan bahwa tindakan itu dilakukan dengan sukarela.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּי שִׂים טְעֵם
  choice: Aku menetapkan keputusan ini
  rationale: Ungkapan administratif Aram ini secara harfiah berbicara tentang ‘menetapkan keputusan’ yang berasal dari raja. Bentuk aktif ini alami dalam bahasa Indonesia dan tetap mempertahankan sumber kerajaan dari keputusan tersebut.
- source_word: דִּי
  choice: ':'
  rationale: Kata ini memperkenalkan isi keputusan. Tanda titik dua menyampaikan fungsi itu secara alami sesudah formula pembuka dalam bahasa Indonesia.
- source_word: כָל מִתְנַדַּב
  choice: Siapa pun ... yang dengan sukarela menawarkan diri
  rationale: Partisipel Hitpael menyatakan tindakan yang dilakukan dengan kemauan sendiri. ‘Menawarkan diri’ mempertahankan nuansa refleksif dan sukarela.
- source_word: בְּמַלְכוּתִי
  choice: di dalam kerajaanku
  rationale: Frasa ini menunjuk pada wilayah yang berada di bawah kekuasaan raja; ‘kerajaanku’ jelas dan sesuai dengan ragam maklumat kerajaan.
- source_word: מִן עַמָּה יִשְׂרָאֵל וְכָהֲנוֹהִי וְלֵוָיֵא
  choice: baik dari umat Israel, dari para imam umat itu, maupun dari orang-orang Lewi
  rationale: Susunan ‘baik ... maupun ...’ memperjelas daftar kelompok dalam bahasa Indonesia tanpa menghapus hubungan akhiran posesif pada ‘imam’ dengan umat Israel.
- source_word: לִמְהָךְ לִירוּשְׁלֶם עִמָּךְ
  choice: untuk pergi bersamamu ke Yerusalem
  rationale: Terjemahan langsung dan alami yang mempertahankan tujuan perjalanan serta penyertaan bersama Ezra.
- source_word: יְהָךְ
  choice: boleh pergi
  rationale: Dalam konteks keputusan kerajaan, bentuk ini memberikan izin, bukan sekadar menyatakan masa depan atau memberi perintah.
theological_decisions: []
translation_notes:
  register: Ragam bahasa resmi dan bermartabat sesuai maklumat kerajaan, tetapi tetap memakai susunan dan kosakata yang mudah dipahami pembaca Indonesia masa kini. Tanda pisah membantu pembaca mengenali daftar kelompok tanpa mengaburkan syarat kesukarelaan yang berlaku atas siapa pun yang hendak pergi.
