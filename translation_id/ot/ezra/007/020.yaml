  text: And whatever other need of the house of your God falls to you to provide[a], you shall provide it from the house of the king’s treasuries.
translation:
  language: id
  text: Dan kebutuhan lain apa pun untuk rumah Allahmu yang perlu engkau sediakan, hendaklah engkau menyediakannya dari perbendaharaan raja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari rumah perbendaharaan raja.” Istilah “perbendaharaan” dalam bahasa Aram berbentuk jamak dan dapat merujuk pada perbendaharaan atau ruang-ruang perbendaharaan raja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר חַשְׁחוּת
  choice: Dan apa pun kebutuhan lain
  rationale: Ungkapan ini menunjuk pada kebutuhan tambahan yang belum diperinci. Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan cakupan yang tidak ditentukan.
- source_word: בֵּית אֱלָהָךְ
  choice: bagi rumah Allahmu
  rationale: Mempertahankan idiom Aram tentang tempat ibadah sebagai 'rumah Allah' tanpa menggantinya dengan istilah yang lebih interpretatif seperti 'Bait Allah' atau 'kuil'.
- source_word: יִפֶּל לָךְ לְמִנְתַּן
  choice: yang harus engkau sediakan
  rationale: Secara harfiah, ungkapan ini berarti sesuatu yang 'jatuh kepadamu untuk diberikan', yakni menjadi tanggung jawab Ezra untuk memenuhinya. 'Harus engkau sediakan' menyampaikan kewajiban administratif itu secara wajar.
- source_word: תִּנְתֵּן
  choice: harus engkau sediakan
  rationale: Pengulangan verba penyediaan dipertahankan untuk mencerminkan penegasan dalam teks sumber.
- source_word: מִן בֵּית גִּנְזֵי מַלְכָּא
  choice: dari perbendaharaan raja
  rationale: Ini adalah padanan Indonesia yang alami bagi tempat penyimpanan harta kerajaan. Bentuk sumber yang lebih harfiah dicatat dalam catatan kaki.
