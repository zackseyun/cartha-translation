  text: וְ/כָל דִּי לָא֩ לֶהֱוֵ֨א עָבֵ֜ד דָּתָ֣/א דִֽי אֱלָהָ֗/ךְ וְ/דָתָ/א֙ דִּ֣י מַלְכָּ֔/א אָסְפַּ֕רְנָא דִּינָ֕/ה לֶהֱוֵ֥א מִתְעֲבֵ֖ד מִנֵּ֑/הּ הֵ֤ן לְ/מוֹת֙ הֵ֣ן ל/שרשו הֵן לַ/עֲנָ֥שׁ נִכְסִ֖ין וְ/לֶ/אֱסוּרִֽין־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/026.yaml
  text: And anyone who will not obey the law of your God and the law of the king[a], let judgment be executed on him promptly, whether for death, or for banishment, or for confiscation of goods, or for imprisonment.
translation:
  language: id
  text: Siapa pun yang tidak menaati hukum Allahmu dan hukum raja, hendaklah hukuman segera dijatuhkan kepadanya, entah hukuman mati, pembuangan[a], penyitaan harta benda, atau pemenjaraan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengusiran”; secara lebih harfiah, “pencabutan sampai ke akar.” Istilah Aram ini jarang ditemukan dan mungkin menunjuk pada pembuangan seseorang dari tempat tinggal atau komunitasnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל דִּי
  choice: Siapa pun yang
  rationale: Mengungkapkan klausa relatif tak tentu dengan daya distributif yang wajar dalam bahasa Indonesia modern.
- source_word: לָא לֶהֱוֵא עָבֵד
  choice: tidak menaati
  rationale: Secara harfiah berkaitan dengan tidak melakukan, tetapi bersama kata 'hukum' menunjuk pada ketidakpatuhan; 'menaati' menyampaikan fungsi hukumnya secara alami.
- source_word: דָּתָא
  choice: hukum
  rationale: Istilah Aram ini dapat berarti hukum, ketetapan, atau peraturan; 'hukum' mempertahankan kesejajaran antara hukum Allah dan hukum raja.
- source_word: אֱלָהָךְ
  choice: Allahmu
  rationale: Mencerminkan bentuk posesif orang kedua tunggal yang ditujukan kepada Ezra.
- source_word: וְדָתָא דִּי מַלְכָּא
  choice: dan hukum raja
  rationale: Mempertahankan koordinasi dan kesejajaran formal dengan 'hukum Allahmu'.
- source_word: אָסְפַּרְנָא
  choice: segera
  rationale: Dalam konteks pengadilan, kata ini menyatakan tindakan yang cepat atau saksama; 'segera' paling jelas menyampaikan unsur kecepatan.
- source_word: דִּינָה לֶהֱוֵא מִתְעֲבֵד מִנֵּהּ
  choice: hendaklah hukuman ... dijatuhkan kepadanya
  rationale: Menyampaikan konstruksi pasif yuridis tentang pelaksanaan putusan terhadap pelanggar; 'hukuman' selaras dengan daftar sanksi yang mengikutinya.
- source_word: הֵן ... הֵן ... הֵן ... וְ
  choice: entah ... atau ...
  rationale: Menyajikan beberapa kemungkinan sanksi sebagai pilihan-pilihan yudisial secara alami dalam bahasa Indonesia.
- source_word: לְמוֹת
  choice: hukuman mati
  rationale: Menyatakan sanksi kematian secara jelas dan baku tanpa memperhalus kerasnya ketentuan.
- source_word: לשרשו
  choice: pembuangan
  rationale: Istilah langka ini secara harfiah berkaitan dengan pencabutan sampai ke akar dan dalam konteks hukum mungkin berarti pengusiran atau pembuangan; pilihan ini menjaga makna yudisial sambil diberi catatan tentang ketidakpastiannya.
- source_word: לַעֲנָשׁ נִכְסִין
  choice: penyitaan harta benda
  rationale: Menyampaikan hukuman yang dikenakan pada harta atau milik sebagai sanksi negara, meskipun frasanya juga dapat dipahami lebih umum sebagai denda atas harta.
- source_word: וְלֶאֱסוּרִין
  choice: pemenjaraan
  rationale: Dalam daftar sanksi hukum, istilah yang secara dasar berkaitan dengan belenggu paling alami dipahami sebagai penahanan atau pemenjaraan.
theological_decisions:
- issue: Hubungan hukum ilahi dan hukum kerajaan dalam titah
  choice: Keduanya diterjemahkan secara setara dan koordinatif sebagai 'hukum Allahmu dan hukum raja'.
  alternative: Menjadikan salah satunya berada di bawah yang lain, atau menafsirkan hukum raja hanya sebagai sarana pelaksanaan hukum Allah.
  rationale: Teks itu sendiri menempatkan kedua hukum secara berdampingan sebagai dua acuan legal. Terjemahan mempertahankan ketegangan tersebut tanpa memasukkan hierarki teologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada yuridis. Susunan daftar dibuat ringkas dan alami, sementara istilah Aram yang langka tetap ditandai dengan catatan kaki agar ketidakpastian leksikalnya tidak disembunyikan.
