lexical_decisions:
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar silsilah, בֶּן secara alami diterjemahkan sebagai “anak”. Istilah ini dapat menunjuk kepada keturunan yang lebih jauh dan tidak selalu menyatakan hubungan ayah-anak langsung.
- source_word: אֲמַרְיָה
  choice: Amarya
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani dengan ejaan yang wajar bagi pembaca bahasa Indonesia.
- source_word: עֲזַרְיָה
  choice: Azarya
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani dengan ejaan yang wajar bagi pembaca bahasa Indonesia.
- source_word: מְרָיוֹת
  choice: Merayot
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani; “Merayot” mencerminkan konsonan dan bunyi nama tersebut secara alami dalam bahasa Indonesia.
