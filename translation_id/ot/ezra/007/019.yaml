base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/019.yaml
  text: And the vessels that are given to you for the service of the house of your God[b][a], deliver in full before the God of Jerusalem.
translation:
  language: id
  text: Dan perlengkapan yang diberikan kepadamu untuk pelayanan di rumah Allahmu[a], serahkanlah seluruhnya[b] di hadapan Allah yang di Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: untuk ibadah di rumah Allahmu.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: persembahkanlah seluruhnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָאנַיָּא
  choice: perlengkapan
  rationale: Kata Aram ini menunjuk pada berbagai perkakas atau bejana. Dalam konteks rumah Allah, “perlengkapan” terdengar alami dan cukup luas untuk mencakup semua benda yang dimaksud.
- source_word: דִּי
  choice: yang
  rationale: Partikel relatif ini memperkenalkan klausa yang menerangkan perlengkapan tersebut; “yang” merupakan padanan Indonesia yang langsung dan alami.
- source_word: מִתְיַהֲבִין לָךְ
  choice: diberikan kepadamu
  rationale: Bentuk partisip pasif dari יהב dipertahankan sebagai bentuk pasif tanpa menentukan secara berlebihan apakah pemberian itu sedang berlangsung atau sudah selesai.
- source_word: לְפָלְחָן בֵּית אֱלָהָךְ
  choice: untuk pelayanan di rumah Allahmu
  rationale: פָלְחָן dapat berarti pelayanan, khususnya pelayanan keagamaan. Ungkapan ini mempertahankan keluasan maknanya, sementara “di rumah Allahmu” menghasilkan susunan Indonesia yang alami.
- source_word: הַשְׁלֵם
  choice: serahkanlah seluruhnya
  rationale: Imperatif ini mengandung gagasan menyerahkan atau menunaikan secara lengkap. “Serahkanlah seluruhnya” sesuai dengan konteks benda-benda yang harus disampaikan dengan lengkap.
- source_word: קֳדָם
  choice: di hadapan
  rationale: Padanan ini menyampaikan arti berada di depan atau dalam hadirat pihak yang disebut.
- source_word: אֱלָהּ יְרוּשְׁלֶם
  choice: Allah Yerusalem
  rationale: Terjemahan langsung ini mempertahankan cara administratif zaman Persia mengidentifikasi Allah menurut kaitan-Nya dengan Yerusalem, tanpa mengubahnya menjadi pernyataan bahwa Ia hanya berada di sana.
theological_decisions:
- issue: Istilah untuk kegiatan di rumah Allah
  choice: pelayanan di rumah Allahmu
  alternative: ibadah di rumah Allahmu
  rationale: Kata Aramnya mencakup pelayanan keagamaan tetapi tidak terbatas pada tindakan ibadah dalam arti sempit. “Pelayanan” mempertahankan keluasan makna dan konteks bait Allah.
- issue: Sebutan “Allah Yerusalem”
  choice: Allah Yerusalem
  alternative: Allah yang di Yerusalem
  rationale: Bentuk sumber mengaitkan Allah dengan Yerusalem dalam gaya administratif. Terjemahan utama mempertahankan bentuk itu tanpa menyiratkan bahwa keberadaan Allah dibatasi pada Yerusalem.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Perlengkapan” lebih mudah dipahami pembaca umum daripada “bejana-bejana” dan tidak membatasi benda-benda itu pada wadah. Susunan kalimat mempertahankan gaya perintah resmi dalam dekret.
