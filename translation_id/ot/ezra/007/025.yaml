  text: וְ/אַ֣נְתְּ עֶזְרָ֗א כְּ/חָכְמַ֨ת אֱלָהָ֤/ךְ דִּֽי בִ/ידָ/ךְ֙ מֶ֣נִּי שָׁפְטִ֞ין וְ/דַיָּנִ֗ין דִּי לֶהֱוֺ֤ן דאנין לְ/כָל עַמָּ/ה֙ דִּ֚י בַּ/עֲבַ֣ר נַהֲרָ֔/ה לְ/כָל יָדְעֵ֖י דָּתֵ֣י אֱלָהָ֑/ךְ וְ/דִ֧י לָ֦א יָדַ֖ע תְּהוֹדְעֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/025.yaml
  text: And you[a], Ezra, according to the wisdom of your God that is in your hand, appoint magistrates and judges who may judge all the people who are beyond the River—all who know the laws of your God; and those who do not know them[b], you shall teach.
translation:
  language: id
  text: Dan engkau, Ezra, sesuai dengan hikmat Allahmu yang ada padamu,[a] angkatlah para pejabat peradilan dan hakim untuk mengadili seluruh rakyat di wilayah Seberang Sungai,[b] semua yang mengetahui hukum-hukum Allahmu. Mereka yang tidak mengetahuinya haruslah kalian ajar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang ada di tanganmu”; idiom Aramiah ini dapat berarti hikmat yang Ezra miliki atau wewenang yang dipercayakan kepadanya.
    reason: lexical_alternative
  - marker: b
    text: “Seberang Sungai” adalah sebutan administratif Persia bagi wilayah di sebelah barat Sungai Efrat.
    reason: cultural_note
  - marker: c
    text: 'Kata “engkau” dan perintah “angkatlah” berbentuk tunggal, tetapi kata kerja terakhir berbentuk jamak: “kalian ajar”. Pergeseran ini mungkin melibatkan Ezra bersama para pejabat yang diangkatnya.'
    reason: grammatical_note
lexical_decisions:
- source_word: כְּחָכְמַת אֱלָהָךְ
  choice: sesuai dengan hikmat Allahmu
  rationale: Kata depan כְּ menyatakan kesesuaian atau patokan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan hubungan formal dengan hikmat Allah sebagai dasar tindakan Ezra.
- source_word: דִּי בִידָךְ
  choice: yang ada padamu
  rationale: Idiom Aramiah ini secara harfiah berarti 'yang ada di tanganmu' dan dapat menunjuk pada sesuatu yang dimiliki atau wewenang yang dipercayakan. 'Ada padamu' mempertahankan keluasan makna tanpa terdengar janggal.
- source_word: מֶנִּי
  choice: angkatlah
  rationale: Dalam konteks administrasi, verba ini memerintahkan Ezra menetapkan orang-orang untuk suatu jabatan. 'Angkatlah' merupakan istilah Indonesia yang wajar bagi pengangkatan pejabat.
- source_word: שָׁפְטִין וְדַיָּנִין
  choice: para pejabat pengadilan dan hakim
  rationale: Dua istilah sumber dipertahankan sebagai dua kelompok petugas hukum yang berbeda, tanpa memastikan secara berlebihan batas fungsi masing-masing.
- source_word: דִּי לֶהֱוֺן דאנין
  choice: untuk mengadili
  rationale: Klausa ini menyatakan fungsi atau tujuan pengangkatan para pejabat tersebut. Bentuk tujuan paling alami dalam bahasa Indonesia.
- source_word: לְכָל עַמָּה
  choice: seluruh rakyat
  rationale: Nomina kolektif dengan כָּל paling alami diterjemahkan sebagai 'seluruh rakyat'.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: di wilayah Seberang Sungai
  rationale: Ungkapan ini adalah sebutan administratif Persia untuk wilayah di sebelah barat Sungai Efrat. Penambahan 'wilayah' memperjelas bahwa ini merupakan nama kawasan administratif.
- source_word: לְכָל יָדְעֵי דָּתֵי אֱלָהָךְ
  choice: yaitu semua orang yang mengetahui hukum-hukum Allahmu
  rationale: דָּתֵי berbentuk jamak dan menunjuk pada hukum atau ketetapan. 'Yaitu' memperjelas hubungan aposisional dengan 'seluruh rakyat' tanpa memperluas cakupan sumber.
- source_word: וְדִי לָא יָדַע
  choice: Orang-orang yang tidak mengetahuinya
  rationale: Acuan objek yang tersirat dibuat jelas melalui '-nya', yakni hukum-hukum Allah yang baru disebutkan.
- source_word: תְּהוֹדְעוּן
  choice: harus kalian ajar
  rationale: Bentuk kausatif berarti 'membuat tahu', yang dalam konteks hukum secara alami berarti 'mengajar'. Pronomina jamak 'kalian' mempertahankan perubahan jumlah gramatikal dalam teks Aramiah.
theological_decisions:
- issue: Cakupan orang yang harus diadili dan diajar
  choice: Mempertahankan bahwa para pejabat mengadili seluruh rakyat, dengan frasa berikut mengidentifikasi mereka yang mengetahui hukum Allah, sedangkan yang belum tahu harus diajar.
  alternative: Menafsirkan 'semua orang yang mengetahui hukum-hukum Allahmu' sebagai pembatas mutlak atas pihak yang boleh diadili.
  rationale: Susunan Aramiah dapat menimbulkan ketegangan antara 'seluruh rakyat' dan 'semua orang yang mengetahui'. Terjemahan tidak membatasi yurisdiksi secara teologis atau administratif melampaui apa yang dinyatakan teks, sementara kalimat terakhir tetap mencakup mereka yang belum tahu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah hukum dibuat jelas bagi pembaca umum. Perubahan dari orang kedua tunggal ke jamak dalam teks Aramiah dipertahankan dan dijelaskan dalam catatan kaki.
