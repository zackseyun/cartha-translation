  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה בְּ/מַלְכ֖וּת אַרְתַּחְשַׁ֣סְתְּא מֶֽלֶךְ פָּרָ֑ס עֶזְרָא֙ בֶּן שְׂרָיָ֔ה בֶּן עֲזַרְיָ֖ה בֶּן חִלְקִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/001.yaml
  text: After these things[a], in the reign of Artaxerxes king of Persia, Ezra son of Seraiah, son of Azariah, son of Hilkiah—
translation:
  language: id
  text: Sesudah peristiwa-peristiwa ini, pada masa pemerintahan Artahsasta, raja Persia, Ezra, anak[a] Seraya, anak Azarya, anak Hilkia—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam silsilah, kata Ibrani yang diterjemahkan “anak” juga dapat berarti keturunan yang lebih jauh, bukan hanya anak langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחַר
  choice: Sesudah
  rationale: Ungkapan ini menghubungkan bagian baru dengan kisah sebelumnya sekaligus menunjukkan urutan waktu. Dalam bahasa Indonesia, “Sesudah” menyampaikan hubungan itu secara alami tanpa menambahkan penanda seperti “Adapun” yang tidak dinyatakan secara eksplisit.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: peristiwa-peristiwa ini
  rationale: Dalam konteks naratif, דְּבָרִים menunjuk pada kejadian-kejadian yang telah diceritakan. “Peristiwa-peristiwa ini” lebih jelas bagi pembaca modern daripada ungkapan harfiah “hal-hal ini”.
- source_word: בְּ/מַלְכוּת
  choice: pada masa pemerintahan
  rationale: Kata ini di sini menunjuk pada masa seorang raja memerintah, bukan wilayah kerajaannya. Pilihan ini tepat dan wajar dalam bahasa Indonesia.
- source_word: אַרְתַּחְשַׁסְתְּא
  choice: Artahsasta
  rationale: Bentuk nama yang sudah mapan dalam tradisi Alkitab berbahasa Indonesia untuk raja Persia ini.
- source_word: מֶלֶךְ פָּרָס
  choice: raja Persia
  rationale: Frasa konstruksi ini menjelaskan kedudukan Artahsasta secara ringkas dan alami.
- source_word: עֶזְרָא
  choice: Ezra
  rationale: Transliterasi nama diri yang sudah mapan dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: “Anak” mempertahankan rumus silsilah Ibrani. Dalam silsilah, בֶּן dapat pula menunjuk pada keturunan yang lebih jauh; kemungkinan itu dijelaskan dalam catatan kaki.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Bentuk nama yang sudah mapan dalam tradisi Alkitab berbahasa Indonesia.
- source_word: עֲזַרְיָה
  choice: Azarya
  rationale: Bentuk nama yang sudah mapan dalam tradisi Alkitab berbahasa Indonesia.
- source_word: חִלְקִיָּה
  choice: Hilkia
  rationale: Bentuk nama yang sudah mapan dalam tradisi Alkitab berbahasa Indonesia.
theological_decisions:
- issue: Hubungan antargenerasi dalam rumus silsilah בֶּן
  choice: Teks utama memakai “anak” sambil mempertahankan kemungkinan hubungan keturunan yang lebih jauh melalui catatan kaki.
  alternative: Menerjemahkan setiap kemunculan sebagai “keturunan”.
  rationale: “Anak” menjaga bentuk dan gaya silsilah sumber, sedangkan catatan kaki mencegah pembaca menganggap setiap nama selalu menunjuk pada hubungan ayah-anak langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Koma mempertahankan struktur aposisi dan rangkaian silsilah; tanda pisah panjang menunjukkan bahwa kalimat dan silsilah berlanjut ke ayat berikutnya.
