translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum kerajaan dipertahankan, tetapi ungkapan sumber yang sangat harfiah dihaluskan secukupnya agar alami. Sapaan jamak diterjemahkan “kalian” supaya jumlah gramatikalnya jelas.
