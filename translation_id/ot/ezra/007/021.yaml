base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/021.yaml
  text: 'And from me, I, King Artaxerxes, issue a decree to all the treasurers in Beyond the River: whatever Ezra the priest, the scribe of the law of the God of heaven, asks of you, let it be done diligently.'
translation:
  language: id
  text: Maka aku sendiri, Raja Artahsasta, mengeluarkan perintah kepada semua bendahara di daerah Seberang Sungai:[a] Apa pun yang diminta dari kalian oleh Ezra, imam dan ahli kitab hukum Allah semesta langit, harus dilaksanakan dengan saksama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seberang Sungai” adalah nama administratif Persia untuk wilayah di sebelah barat Sungai Efrat.
    reason: cultural_note
  - marker: b
    text: Atau “dengan tepat” atau “dengan segera”; kata Aramnya menekankan pelaksanaan yang cermat dan penuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנִּי אֲנָה
  choice: Dan aku
  rationale: Ungkapan Aram ini menegaskan bahwa perintah tersebut berasal langsung dari raja. Dalam bahasa Indonesia, “Dan aku” mempertahankan kesinambungan dan penekanan tanpa pengulangan yang janggal seperti “dan dari aku, aku”.
- source_word: אַרְתַּחְשַׁסְתְּא מַלְכָּא
  choice: Raja Artahsasta
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia dan susunan gelar yang alami.
- source_word: שִׂים טְעֵם
  choice: mengeluarkan perintah
  rationale: Idiom administratif ini berarti menetapkan atau mengumumkan ketetapan resmi. “Mengeluarkan perintah” alami dan mempertahankan daya wajibnya.
- source_word: לְכֹל גִּזַּבְרַיָּא
  choice: kepada semua bendahara
  rationale: Istilah ini menunjuk para pejabat perbendaharaan; “bendahara” ringkas dan jelas dalam konteks administratif.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: di daerah Seberang Sungai
  rationale: Ini adalah sebutan administratif Persia bagi wilayah di sebelah barat Sungai Efrat. Kata “daerah” membantu pembaca mengenalinya sebagai nama wilayah.
- source_word: כָל דִּי
  choice: Apa pun yang
  rationale: Menyampaikan konstruksi relatif tak tentu secara alami dalam bahasa Indonesia.
- source_word: יִשְׁאֲלֶנְכוֹן
  choice: diminta dari kalian
  rationale: Kata kerja berarti meminta; bentuk pasif memungkinkan Ezra beserta kedua gelarnya tetap ditempatkan bersama dengan alami dan tidak memperkuatnya menjadi ‘menuntut’.
- source_word: עֶזְרָא כָהֲנָה סָפַר דָּתָא
  choice: Ezra, imam dan ahli kitab dalam hukum
  rationale: “Imam” mempertahankan jabatan keagamaan Ezra, sedangkan “ahli kitab” menyampaikan fungsi terpelajar dan resmi dari סָפַר. “Dalam hukum” secara alami menunjukkan bidang keahliannya.
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: Allah semesta langit
  rationale: Menerjemahkan gelar Aram secara idiomatis dan agung, sambil mempertahankan unsur jamak שְׁמַיָּא tanpa memberi kesan adanya banyak surga yang terpisah.
- source_word: אָסְפַּרְנָא
  choice: dengan saksama
  rationale: Adverbia ini dapat menekankan ketepatan, kecermatan, atau kesegeraan pelaksanaan. “Dengan saksama” paling baik menyampaikan kepatuhan yang teliti dan penuh tanpa membatasi maknanya pada kecepatan.
