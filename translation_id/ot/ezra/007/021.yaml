revisions:
- from: Dan aku, Raja Artahsasta, mengeluarkan perintah kepada semua bendahara di daerah Seberang Sungai:[a] Apa pun yang diminta dari kalian oleh Ezra, imam dan ahli kitab dalam hukum Allah semesta langit, harus dilaksanakan dengan saksama.[b]
  to: Maka aku sendiri, Raja Artahsasta, mengeluarkan perintah kepada semua bendahara di daerah Seberang Sungai:[a] Apa pun yang diminta dari kalian oleh Ezra, imam dan ahli kitab hukum Allah semesta langit, harus dilaksanakan dengan saksama.[b]
  rationale: Revisi memulihkan penekanan bahwa perintah itu merupakan otorisasi pribadi raja melalui “aku sendiri,” tanpa menghasilkan pengulangan yang janggal dalam bahasa Indonesia. Revisi juga memulihkan hubungan “ahli kitab hukum Allah semesta langit” sebagaimana konstruksi Aram, sambil mempertahankan seluruh makna, register resmi, penanda catatan, dan catatan kaki yang relevan.
