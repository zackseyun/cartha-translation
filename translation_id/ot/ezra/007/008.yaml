  text: וַ/יָּבֹ֥א יְרוּשָׁלִַ֖ם בַּ/חֹ֣דֶשׁ הַ/חֲמִישִׁ֑י הִ֛יא שְׁנַ֥ת הַ/שְּׁבִיעִ֖ית לַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/008.yaml
  text: And he came to Jerusalem in the fifth month[a], which was the seventh year of the king.
translation:
  language: id
  text: Ia tiba di Yerusalem pada bulan kelima[a], yaitu pada tahun ketujuh pemerintahan raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia tiba di Yerusalem pada bulan kelima; waktu itu adalah tahun ketujuh pemerintahan raja.”'
    reason: Alternatif ini mempertahankan kemungkinan bahwa הִיא membuka keterangan waktu sebagai klausa tersendiri, bukan sekadar penghubung relatif.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Ia tiba
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa. Dalam konteks perjalanan Ezra menuju Yerusalem, 'tiba' menyampaikan hasil gerak secara alami tanpa menambah keterangan yang tidak ada dalam teks.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalem
  rationale: Nama tempat ini ditulis menurut bentuk baku dalam bahasa Indonesia.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: pada bulan kelima
  rationale: Preposisi ב menyatakan waktu; 'pada bulan kelima' merupakan ungkapan penanggalan yang alami dan tepat dalam bahasa Indonesia.
- source_word: הִיא
  choice: yaitu pada
  rationale: Pronomina feminin ini menghubungkan keterangan waktu sebelumnya dengan penanggalan berdasarkan tahun pemerintahan raja. 'Yaitu pada' mempertahankan fungsi penjelasnya dalam susunan Indonesia yang wajar.
- source_word: שְׁנַת הַשְּׁבִיעִית
  choice: tahun ketujuh pemerintahan
  rationale: Frasa konstruksi ini menunjukkan tahun pemerintahan seorang raja. Penambahan kata 'pemerintahan' memperjelas idiom penanggalan kerajaan yang sudah tersirat dalam konstruksi Ibrani.
- source_word: לַמֶּלֶךְ
  choice: raja
  rationale: Lamed menyatakan hubungan dalam penanggalan menurut masa pemerintahan. Nama Artahsasta tidak ditambahkan karena ayat ini sendiri hanya menyebut 'raja'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'Ia' dipakai untuk tokoh manusia dalam narasi; susunan kalimat dibuat alami sambil mempertahankan urutan keterangan waktu dalam teks Ibrani.
