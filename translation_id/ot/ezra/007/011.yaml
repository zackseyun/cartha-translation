id: EZR.7.11
reference: Ezra 7:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/זֶ֣ה פַּרְשֶׁ֣גֶן הַֽ/נִּשְׁתְּוָ֗ן אֲשֶׁ֤ר נָתַן֙ הַ/מֶּ֣לֶךְ אַרְתַּחְשַׁ֔סְתְּא לְ/עֶזְרָ֥א הַ/כֹּהֵ֖ן הַ/סֹּפֵ֑ר סֹפֵ֞ר דִּבְרֵ֧י מִצְוֺת יְהוָ֛ה וְ/חֻקָּ֖י/ו עַל יִשְׂרָאֵֽל׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/011.yaml
  text: 'This is the copy of the document that King Artaxerxes gave to Ezra the priest[a], the scribe[b], a scribe of the words of the commandments of Yahweh and of his statutes for Israel:'
translation:
  language: id
  text: 'Inilah salinan dokumen[a] yang diberikan Raja Artahsasta kepada Ezra, imam, ahli kitab itu, seorang ahli kitab dalam perkataan-perkataan perintah Yahweh dan ketetapan-ketetapan-Nya bagi Israel[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “teks surat itu” atau “transkrip dokumen itu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “mengenai Israel” atau “atas Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: Inilah
  rationale: Bentuk ini secara alami memperkenalkan kutipan dokumen yang menyusul dan menyampaikan fungsi penghubung וְ tanpa menambahkan penanda waktu.
- source_word: פַּרְשֶׁגֶן הַנִּשְׁתְּוָן
  choice: salinan dokumen
  rationale: פַּרְשֶׁגֶן menunjuk pada salinan atau transkrip, sedangkan הַנִּשְׁתְּוָן adalah komunikasi resmi tertulis. 'Salinan dokumen' jelas dan tidak membatasi bentuknya hanya sebagai surat.
- source_word: נָתַן
  choice: diberikan
  rationale: Mempertahankan arti dasar verba 'memberikan' dan cocok dengan susunan pasif bahasa Indonesia yang berfokus pada dokumen.
- source_word: הַמֶּלֶךְ אַרְתַּחְשַׁסְתְּא
  choice: Raja Artahsasta
  rationale: Gelar diterjemahkan dan nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: imam dan ahli kitab itu
  rationale: '''Imam'' menyatakan jabatan keimaman Ezra. ''Ahli kitab'' mempertahankan cakupan סֹפֵר sebagai orang yang menangani dan menguasai tulisan resmi serta Taurat, dan lebih alami daripada ''juru tulis'' dalam konteks ini.'
- source_word: סֹפֵר דִּבְרֵי מִצְוֺת יְהוָה
  choice: seorang ahli kitab yang mendalami kata-kata perintah Yahweh
  rationale: Pengulangan 'ahli kitab' mempertahankan aposisi dalam bahasa Ibrani. 'Mendalami' membuat hubungan frasa dapat dipahami tanpa menghilangkan penekanan pada kata-kata tertulis dari perintah Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וְחֻקָּיו
  choice: serta ketetapan-ketetapan-Nya
  rationale: '''Ketetapan'' merupakan padanan hukum yang wajar bagi חֹק; bentuk jamak dipertahankan dan pronomina merujuk kepada Yahweh.'
- source_word: עַל יִשְׂרָאֵל
  choice: bagi Israel
  rationale: Menyampaikan kemungkinan bahwa perintah dan ketetapan itu berlaku atau ditujukan bagi Israel, sambil mencatat alternatif relasional dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Cakupan עַל יִשְׂרָאֵל
  choice: bagi Israel
  alternative: mengenai Israel atau atas Israel
  rationale: Preposisi עַל memungkinkan nuansa penerapan, pokok pembicaraan, atau kewenangan. Teks utama memakai ungkapan paling alami dalam konteks hukum, sedangkan ketaksaan aslinya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada resmi dan bermartabat. Tanda pisah memperjelas aposisi kedua mengenai Ezra. Istilah 'ahli kitab' dipilih untuk konteks Taurat dan administrasi Persia, sedangkan bentuk yang lebih harfiah tetapi kaku dihaluskan tanpa menghapus pengulangan sumber.
