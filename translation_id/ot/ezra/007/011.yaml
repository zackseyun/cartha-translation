revisions:
- from: 'Inilah salinan dokumen[a] yang diberikan Raja Artahsasta kepada Ezra, imam dan ahli kitab itu—seorang ahli kitab yang mendalami kata-kata perintah Yahweh serta ketetapan-ketetapan-Nya bagi Israel[b]:'
  to: 'Inilah salinan dokumen[a] yang diberikan Raja Artahsasta kepada Ezra, imam, ahli kitab itu, seorang ahli kitab dalam perkataan-perkataan perintah Yahweh dan ketetapan-ketetapan-Nya bagi Israel[b]:'
