  yaml_path: translation/ot/ezra/007/018.yaml
  text: And whatever seems good to you and your brothers to do with the rest of the silver and the gold[b][a], do according to the will of your God.
translation:
  language: id
  text: Apa pun yang kamu dan saudara-saudaramu anggap baik[a] untuk dilakukan dengan sisa perak dan emas itu, lakukanlah sesuai dengan kehendak Allahmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Apa pun yang baik bagimu dan saudara-saudaramu.” Ungkapan bahasa Aram ini dapat diterjemahkan lebih harfiah dengan “baik bagi” atau lebih idiomatis dengan “dianggap baik.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “sesuai dengan keinginan Allahmu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה דִי
  choice: Apa pun yang
  rationale: Gabungan bahasa Aram ini memperkenalkan klausa relatif tak tentu; 'apa pun yang' menyampaikan cakupan terbuka secara alami dalam bahasa Indonesia.
- source_word: עֲלָיִךְ וְעַל אַחַיִךְ יֵיטַב
  choice: menurutmu dan saudara-saudaramu baik
  rationale: Ungkapan יטב dengan עַל menyatakan apa yang dipandang baik atau berkenan oleh seseorang. Rumusan ini mempertahankan nuansa pertimbangan tanpa membuatnya sekadar penilaian objektif.
- source_word: אַחַיִךְ
  choice: saudara-saudaramu
  rationale: Kata sumber secara harfiah berarti 'saudara-saudaramu'. Konteks mungkin menunjuk kepada sesama orang Yahudi atau rekan Ezra, tetapi istilah kekerabatan dipertahankan.
- source_word: בִּשְׁאָר כַּסְפָּא וְדַהֲבָה
  choice: dengan sisa perak dan emas itu
  rationale: שְׁאָר menunjuk pada bagian yang masih tersisa, sedangkan 'itu' menandai bahwa dana tersebut telah disebut sebelumnya.
- source_word: לְמֶעְבַּד
  choice: untuk dilakukan
  rationale: Infinitif עבד di sini bermakna luas, yakni melakukan atau mengerjakan sesuatu dengan dana tersebut; terjemahan ini menjaga keluasan maknanya.
- source_word: כִּרְעוּת
  choice: sesuai dengan kehendak
  rationale: רְעוּת dapat berarti kehendak, keinginan, atau kesenangan. 'Kehendak' sesuai dengan ragam resmi surat keputusan dan tetap alami dalam konteks ilahi.
- source_word: אֱלָהֲכֹם
  choice: Allahmu
  rationale: Bentuk ini merujuk secara khusus kepada Allah yang disembah Ezra dan kelompoknya. 'Allahmu' merupakan padanan Indonesia yang langsung dan wajar.
- source_word: תַּעַבְדוּן
  choice: lakukanlah
  rationale: Bentuk imperfek ini berfungsi sebagai pemberian izin sekaligus arahan dalam surat keputusan; imperatif sopan 'lakukanlah' menyampaikan fungsi tersebut secara alami.
theological_decisions:
- issue: Rujukan ilahi אֱלָהֲכֹם
  choice: Allahmu
  alternative: allahmu / dewamu
  rationale: Rujukannya adalah Allah yang disembah Ezra dan kelompoknya, bukan suatu ilah yang tidak tertentu. Pilihan ini menandai referen khusus tanpa menambahkan rincian doktrinal.
- issue: Makna כִּרְעוּת
  choice: kehendak
  alternative: keinginan
  rationale: Kata sumber dapat mencakup kehendak atau keinginan. Teks utama memakai 'kehendak' karena sesuai dengan konteks tindakan yang diarahkan oleh Allah, sementara alternatif yang asli dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan cakupan izin dalam surat keputusan, istilah kekerabatan, serta keluasan makna tindakan terhadap sisa dana. Penanda catatan ditempatkan pada unsur yang dijelaskan.
