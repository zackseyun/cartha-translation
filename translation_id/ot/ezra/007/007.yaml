  text: וַ/יַּֽעֲל֣וּ מִ/בְּנֵֽי יִ֠שְׂרָאֵל וּ/מִן הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֜ם וְ/הַ/מְשֹׁרְרִ֧ים וְ/הַ/שֹּׁעֲרִ֛ים וְ/הַ/נְּתִינִ֖ים אֶל יְרוּשָׁלִָ֑ם בִּ/שְׁנַת שֶׁ֖בַע לְ/אַרְתַּחְשַׁ֥סְתְּא הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/007.yaml
  text: And some of the sons of Israel[a], and some of the priests, and the Levites, and the singers, and the gatekeepers[b], and the temple servants went up to Jerusalem in the seventh year of King Artaxerxes.
translation:
  language: id
  text: Sebagian dari keturunan Israel[a], sebagian dari para imam, dan orang-orang Lewi, para penyanyi, para penjaga pintu gerbang, dan para pelayan Bait Allah[b] naik ke Yerusalem pada tahun ketujuh pemerintahan Raja Artahsasta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagian dari orang Israel.” Secara harfiah, bahasa Ibrani berbunyi “sebagian dari anak-anak Israel” dan menunjukkan bahwa hanya sebagian dari kelompok itu yang naik.
    reason: lexical_alternative
  - marker: b
    text: Atau “kaum Netinim”, istilah khusus bagi suatu golongan pelayan Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: pergi ke
  rationale: Kata עָלָה secara harfiah berarti ‘naik’ dan lazim dipakai untuk perjalanan ke Yerusalem. Dalam bahasa Indonesia, ‘pergi ke Yerusalem’ menyampaikan gerak perjalanan secara alami tanpa menimbulkan kesan bahwa yang terutama dimaksud ialah mendaki secara fisik.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: sebagian dari keturunan Israel
  rationale: Kata depan מִן mempunyai arti partitif, sehingga ‘sebagian dari’ perlu dinyatakan. ‘Keturunan Israel’ mempertahankan gambaran harfiah ‘anak-anak Israel’ dalam bentuk yang lebih wajar bagi pembaca Indonesia modern.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku untuk kelompok imam dalam pelayanan keagamaan Israel.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Padanan yang jelas dan lazim bagi anggota kelompok Lewi.
- source_word: הַמְשֹׁרְרִים
  choice: para penyanyi
  rationale: Istilah ini secara khusus menunjuk kepada orang-orang yang bernyanyi dalam pelayanan Bait Allah, bukan pemusik secara umum.
- source_word: הַשֹּׁעֲרִים
  choice: para penjaga pintu gerbang
  rationale: Menyatakan tugas kelompok petugas yang menjaga pintu-pintu gerbang, khususnya dalam lingkungan Bait Allah.
- source_word: הַנְּתִינִים
  choice: para pelayan Bait Allah
  rationale: Terjemahan fungsional ini menjelaskan peranan kelompok khusus tersebut kepada pembaca modern; bentuk teknisnya, ‘kaum Netinim’, dicantumkan dalam catatan kaki.
- source_word: אֶל יְרוּשָׁלִָם
  choice: ke Yerusalem
  rationale: Padanan arah yang alami untuk אֶל diikuti nama tempat.
- source_word: בִּשְׁנַת שֶׁבַע
  choice: pada tahun ketujuh
  rationale: Ungkapan ordinal ini merupakan bentuk Indonesia yang alami untuk penanggalan menurut tahun pemerintahan raja.
- source_word: לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: pemerintahan Raja Artahsasta
  rationale: Konteks penanggalan kerajaan mendukung penyebutan ‘pemerintahan’, sedangkan ‘Artahsasta’ ialah bentuk nama yang telah lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Daftar kelompok dibuat mengalir secara alami dengan ‘serta’ dan koma, sementara arti partitif pada dua frasa pertama dinyatakan secara eksplisit. Istilah teknis yang kurang dikenal dijelaskan melalui terjemahan fungsional dan catatan kaki.
