id: EZR.7.27
reference: Ezra 7:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בָּר֥וּךְ יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵ֑י/נוּ אֲשֶׁ֨ר נָתַ֤ן כָּ/זֹאת֙ בְּ/לֵ֣ב הַ/מֶּ֔לֶךְ לְ/פָאֵ֕ר אֶת בֵּ֥ית יְהוָ֖ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/027.yaml
  text: Blessed be Yahweh[a], the God of our fathers, who put this into the king’s heart, to beautify the house of Yahweh that is in Jerusalem,
translation:
  language: id
  text: Terpujilah Yahweh, Allah nenek moyang kita, yang menaruh hal ini dalam hati raja untuk memperindah[a] rumah Yahweh yang ada di Yerusalem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghiasi” atau “memuliakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Dalam rumusan pujian kepada Allah, bentuk ini menyampaikan fungsi doksologis partisip pasif Ibrani secara alami dalam bahasa Indonesia; terjemahan harfiah “diberkatilah” kurang wajar bila ditujukan kepada Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: אֱלֹהֵי אֲבוֹתֵינוּ
  choice: Allah nenek moyang kita
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mencakup para leluhur Israel tanpa menghilangkan makna perjanjian dari frasa tersebut.
- source_word: אֲשֶׁר נָתַן כָּזֹאת בְּלֵב הַמֶּלֶךְ
  choice: yang menaruh hal ini dalam hati raja
  rationale: “Menaruh ... dalam hati” mempertahankan gambaran Ibrani tentang Allah yang menanamkan maksud atau keinginan batin; כָּזֹאת menunjuk kepada hal yang baru disebut atau tersirat dalam konteks.
- source_word: לְפָאֵר
  choice: untuk memperindah
  rationale: Bentuk piel ini menyatakan tindakan membuat rumah Yahweh menjadi indah atau megah. “Memperindah” paling langsung menyampaikan makna konkret dalam konteks pemugaran dan pemberian bagi rumah Allah.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan konkret Ibrani “rumah Yahweh”; dalam konteksnya, yang dimaksud ialah Bait Allah.
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: yang ada di Yerusalem
  rationale: Klausa relatif ini diterjemahkan secara langsung dan alami untuk menunjukkan lokasi rumah Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi Allah. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Makna tindakan לְפָאֵר terhadap rumah Yahweh
  choice: memperindah
  alternative: menghiasi atau memuliakan
  rationale: Konteks mendukung tindakan konkret membuat Bait Allah indah atau megah, tetapi verba itu juga dapat membawa nuansa kehormatan atau kemuliaan; alternatif dipertahankan dalam catatan kaki tanpa memaksakan satu nuansa teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Koma pada akhir ayat dipertahankan karena kalimat berlanjut ke ayat berikutnya. Penanda catatan kaki ditempatkan sesudah “memperindah,” yaitu kata yang diterangkan.
