  text: כָּ/ל קֳבֵ֗ל דִּי֩ מִן קֳדָ֨ם מַלְכָּ֜/א וְ/שִׁבְעַ֤ת יָעֲטֹ֨/הִי֙ שְׁלִ֔יחַ לְ/בַקָּרָ֥א עַל יְה֖וּד וְ/לִֽ/ירוּשְׁלֶ֑ם בְּ/דָ֥ת אֱלָהָ֖/ךְ דִּ֥י בִ/ידָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/014.yaml
  text: because you are sent from before the king and his seven counselors to inquire concerning Judah and Jerusalem according to the law of your God that is in your hand[a][b].
translation:
  language: id
  text: sebab engkau diutus dari hadapan raja dan tujuh penasihatnya untuk menyelidiki Yehuda dan Yerusalem menurut hukum Allahmu yang ada di tanganmu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari hadirat raja.” Ungkapan resmi istana dalam bahasa Aram ini menekankan bahwa penugasan Ezra berasal dari hadirat raja.
    reason: lexical_alternative
  - marker: b
    text: 'Atau “yang ada dalam penguasaanmu” atau “yang dipercayakan kepadamu.” Secara harfiah: “yang ada di tanganmu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: sebab
  rationale: Ungkapan Aram ini memperkenalkan alasan bagi ketetapan tersebut. “Sebab” mempertahankan hubungan kausal dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: מִן קֳדָם מַלְכָּא
  choice: dari hadapan raja
  rationale: Secara harfiah berarti “dari hadapan raja” dan merupakan ungkapan resmi istana yang menandakan bahwa penugasan Ezra berasal dari hadirat serta kewenangan raja.
- source_word: וְשִׁבְעַת יָעֲטֹהִי
  choice: dan ketujuh penasihatnya
  rationale: Nomina ini menunjuk kepada para penasihat kerajaan. “Penasihat” merupakan istilah Indonesia modern yang tepat bagi pejabat istana tersebut.
- source_word: שְׁלִיחַ
  choice: engkau diutus
  rationale: Partisip pasif ini menyatakan status Ezra sebagai orang yang secara resmi dikirim. “Diutus” jelas dan tetap mempertahankan nuansa penugasan resmi.
- source_word: לְבַקָּרָא
  choice: untuk menyelidiki keadaan
  rationale: Verba ini mencakup arti memeriksa, mencari tahu, atau mengadakan penyelidikan. Penambahan “keadaan” menghasilkan konstruksi Indonesia yang alami tanpa menentukan secara sempit objek penyelidikannya.
- source_word: עַל יְהוּד וְלִירוּשְׁלֶם
  choice: Yehuda dan Yerusalem
  rationale: Dengan verba sebelumnya, preposisi עַל menandai pihak atau wilayah yang menjadi pokok penyelidikan. Dalam bahasa Indonesia hubungan ini sudah jelas melalui frasa “menyelidiki keadaan”.
- source_word: בְּדָת אֱלָהָךְ
  choice: menurut hukum Allahmu
  rationale: Preposisi בְּ di sini menyatakan patokan bagi penyelidikan. “Menurut” secara jelas menyampaikan bahwa hukum Allah menjadi norma pemeriksaan.
- source_word: דִּי בִידָךְ
  choice: yang ada di tanganmu
  rationale: 'Terjemahan harfiah ini mempertahankan idiom Aram dan ambiguitasnya: hukum itu dapat dipahami berada dalam kepemilikan, penguasaan, atau tanggung jawab Ezra.'
