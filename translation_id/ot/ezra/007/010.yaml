  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י עֶזְרָא֙ הֵכִ֣ין לְבָב֔/וֹ לִ/דְר֛וֹשׁ אֶת תּוֹרַ֥ת יְהוָ֖ה וְ/לַ/עֲשֹׂ֑ת וּ/לְ/לַמֵּ֥ד בְּ/יִשְׂרָאֵ֖ל חֹ֥ק וּ/מִשְׁפָּֽט־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/010.yaml
  text: For Ezra had set his heart to seek the Law of Yahweh[a], and to do it[d][c][b], and to teach statutes and judgments in Israel.
translation:
  language: id
  text: Sebab Ezra telah membulatkan hatinya untuk menyelidiki Taurat Yahweh[a], melakukannya, serta mengajarkan ketetapan dan hukum di Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencari” atau “mempelajari Taurat Yahweh.” Kata Ibrani yang dipakai dapat mencakup pencarian, penyelidikan, dan penelaahan yang sungguh-sungguh.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menjelaskan alasan bagi penyertaan dan keberhasilan Ezra dalam konteks sebelumnya.
- source_word: הֵכִין לְבָבוֹ
  choice: telah membulatkan hatinya
  rationale: Ungkapan Ibrani ini menyatakan tekad batin yang disengaja; frasa Indonesia ini alami dan mempertahankan unsur kemauan yang kuat.
- source_word: לִדְרוֹשׁ
  choice: untuk menyelidiki
  rationale: דרש dapat berarti mencari, menyelidiki, atau menelaah. Dalam konteks Taurat, 'menyelidiki' mencakup upaya memahami secara sungguh-sungguh tanpa membatasinya pada kajian akademis.
- source_word: תּוֹרַת יְהוָה
  choice: Taurat Yahweh
  rationale: Dalam konteks keimaman dan kepaniteraan Ezra, תּוֹרָה menunjuk pada hukum serta pengajaran perjanjian; 'Taurat' merupakan istilah Indonesia yang dikenal dan tepat.
- source_word: וְלַעֲשֹׂת
  choice: melakukannya
  rationale: Objek yang tersirat adalah Taurat yang baru disebutkan. Bentuk ini mempertahankan penekanan teks pada penerapan nyata.
- source_word: וּלְלַמֵּד
  choice: serta mengajarkan
  rationale: Bentuk Piel dari למד berarti mengajar; 'mengajarkan' meneruskan rangkaian tujuan Ezra secara alami.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Frasa ini menyatakan lingkup pelayanan pengajaran Ezra.
- source_word: חֹק וּמִשְׁפָּט
  choice: ketetapan dan hukum
  rationale: Kedua nomina tunggal ini berfungsi secara kolektif sebagai pasangan istilah hukum. Bentuk Indonesia yang tidak ditandai jumlah mempertahankan keluwesan tersebut dan terdengar wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian YHWH secara langsung; 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Cakupan makna תּוֹרָה
  choice: Taurat
  alternative: hukum; pengajaran
  rationale: Dalam konteks Ezra sebagai imam dan ahli kitab, istilah ini menunjuk pada pengajaran hukum perjanjian. 'Taurat' mempertahankan dimensi kanonis sekaligus dikenal luas oleh pembaca Indonesia.
- issue: Makna לִדְרוֹשׁ dalam hubungan dengan Taurat
  choice: menyelidiki
  alternative: mencari; mempelajari
  rationale: Pilihan ini menjaga unsur pencarian dan penelaahan yang sungguh-sungguh, tanpa menyelesaikan ketegangan antara dimensi intelektual dan kesalehan menjadi salah satunya saja.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Struktur tiga tujuan Ezra dipertahankan: menyelidiki, melakukan, dan mengajarkan. ''Membulatkan hatinya'' dipilih sebagai ungkapan alami untuk tekad batin yang disengaja.'
