    issue: ‘Provinsi Babel’ dikapitalisasi.
    rationale: Dalam bahasa Indonesia baku, ‘provinsi’ biasanya ditulis dengan huruf kecil ketika berfungsi sebagai nomina jenis dalam frasa administratif ini. Kapitalisasi tidak diperlukan oleh teks sumber.
  - severity: medium
    issue: ‘yang dengan sukarela memberikannya’ kurang eksplisit dan kurang idiomatis.
    rationale: Akhiran ‘-nya’ dapat dipahami merujuk kepada persembahan, tetapi acuan itu tidak dinyatakan langsung. Verba Aram mengulang gagasan memberi dengan sukarela; ‘yang dengan sukarela mempersembahkan persembahan itu’ mempertahankan pengulangan tersebut dan memperjelas objeknya.
