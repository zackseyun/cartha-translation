base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/016.yaml
  text: and all the silver and gold that you find in all the province of Babylon[a], together with the freewill offering of the people and the priests[b], who are freely offering for the house of their God that is in Jerusalem.
translation:
  language: id
  text: dan seluruh perak dan emas yang kaudapati di seluruh provinsi Babel, bersama dengan persembahan sukarela[a] dari rakyat dan para imam, yang dengan sukarela mempersembahkan persembahan itu bagi rumah Allah mereka[b] di Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemberian sukarela.” Istilah bahasa Aram ini menunjuk pada pemberian yang diberikan dengan rela, khususnya dalam konteks rumah ibadah.
    reason: lexical_alternative
  - marker: b
    text: “Rumah Allah mereka” merujuk pada Bait Allah di Yerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: וְכֹל
  choice: dan seluruh
  rationale: Menjaga hubungan dengan daftar pada ayat sebelumnya serta daya cakup כֹּל.
- source_word: כְּסַף וּדְהַב
  choice: perak dan emas
  rationale: Padanan baku dan alami bagi pasangan logam berharga ini.
- source_word: דִּי תְהַשְׁכַּח
  choice: yang kaudapati
  rationale: Mempertahankan klausa relatif dan sapaan orang kedua tunggal kepada Ezra; 'dapati' sesuai dengan makna langsung verba.
- source_word: בְּכֹל מְדִינַת בָּבֶל
  choice: di seluruh Provinsi Babel
  rationale: מְדִינָה menunjuk pada wilayah administratif; huruf kapital memperjelas bahwa yang dimaksud ialah satuan pemerintahan.
- source_word: עִם
  choice: bersama dengan
  rationale: Menandai penambahan sumber dana lain dengan bahasa Indonesia yang wajar.
- source_word: הִתְנַדָּבוּת
  choice: persembahan sukarela
  rationale: Mengungkapkan pemberian yang dilakukan dengan kemauan sendiri dan mempertahankan nuansa peribadatan.
- source_word: עַמָּא וְכָהֲנַיָּא
  choice: dari rakyat dan para imam
  rationale: Bentuk definit dalam bahasa Aram merujuk kepada kelompok rakyat dan imam yang menyumbang; 'rakyat' sesuai dengan konteks komunitas di wilayah kekaisaran.
- source_word: מִתְנַדְּבִין
  choice: yang dengan sukarela memberikannya
  rationale: Partisipel ini menggambarkan tindakan sukarela rakyat dan para imam serta mempertahankan kaitan leksikal dengan הִתְנַדָּבוּת tanpa pengulangan yang kaku.
- source_word: לְבֵית אֱלָהֲהֹם
  choice: bagi rumah Allah mereka
  rationale: Mempertahankan ungkapan harfiah 'rumah Allah mereka', sedangkan 'bagi' menyatakan tujuan pemberian.
- source_word: דִּי בִירוּשְׁלֶם
  choice: di Yerusalem
  rationale: Secara alami menyatakan lokasi rumah Allah tanpa perlu mengulang klausa relatif dalam bahasa Indonesia.
theological_decisions:
- issue: Makna 'rumah Allah mereka'
  choice: Ungkapan sumber dipertahankan dalam teks dan dijelaskan sebagai Bait Allah.
  alternative: Menerjemahkan langsung sebagai 'Bait Allah mereka'.
  rationale: Pilihan ini menjaga metafora asli dan rujukan kepemilikan komunal tanpa memasukkan penafsiran tambahan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kaudapati' mempertahankan sapaan tunggal kepada Ezra. Susunan kalimat mengikuti alur bahasa Aram, tetapi tanda koma dan frasa verbal dibuat alami bagi pembaca Indonesia.
