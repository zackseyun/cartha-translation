  text: כִּ֗י בְּ/אֶחָד֙ לַ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן ה֣וּא יְסֻ֔ד הַֽ/מַּעֲלָ֖ה מִ/בָּבֶ֑ל וּ/בְ/אֶחָ֞ד לַ/חֹ֣דֶשׁ הַ/חֲמִישִׁ֗י בָּ֚א אֶל יְר֣וּשָׁלִַ֔ם כְּ/יַד אֱלֹהָ֖י/ו הַ/טּוֹבָ֥ה עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/009.yaml
  text: For on the first day of the first month he began the journey up from Babylon, and on the first day of the fifth month he came to Jerusalem, according to the good hand of his God upon him.
translation:
  language: id
  text: Sebab pada hari pertama bulan pertama ia memulai perjalanan naik dari Babel, dan pada hari pertama bulan kelima ia tiba di Yerusalem, karena tangan Allahnya yang baik menyertainya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְסֻד הַמַּעֲלָה
  choice: memulai perjalanan naik
  rationale: Bentuk pasif יְסֻד secara harfiah berkaitan dengan ‘diletakkan dasarnya’, tetapi bersama הַמַּעֲלָה dalam konteks perjalanan Ezra menunjuk pada dimulainya perjalanan naik dari Babel. Ungkapan ini diterjemahkan secara alami tanpa menyiratkan pembangunan fisik.
- source_word: כְּיַד אֱלֹהָיו הַטּוֹבָה עָלָיו
  choice: karena tangan Allahnya yang baik menyertainya
  rationale: Metafora ‘tangan’ dipertahankan sebagai gambaran kuasa dan perkenanan ilahi. כְּ dipahami secara kausal atau sesuai keadaan yang memungkinkan keberhasilan perjalanan; ‘menyertainya’ mengungkapkan עָלָיו secara wajar dalam bahasa Indonesia.
- source_word: בָּבֶל
  choice: Babel
  rationale: Nama tempat baku dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Hubungan pemeliharaan Allah dengan keberhasilan perjalanan Ezra
  choice: karena tangan Allahnya yang baik menyertainya
  alternative: sesuai dengan tangan Allahnya yang baik atasnya
  rationale: Terjemahan utama mempertahankan pengakuan bahwa perkenanan dan kuasa Allah memungkinkan tibanya Ezra, tanpa merinci mekanisme pemeliharaan ilahi atau mengimpor tafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan tanggal dipertahankan. ‘Perjalanan naik’ mempertahankan idiom geografis-teologis tentang pergi ke Yerusalem, sedangkan ‘tangan Allahnya yang baik’ menjaga metafora Ibrani.
