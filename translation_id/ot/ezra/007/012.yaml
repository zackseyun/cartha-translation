base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/012.yaml
  text: 'Artaxerxes[a], king of kings, to Ezra the priest, the scribe of the law of the God of heaven: complete peace[b]. And now—'
translation:
  language: id
  text: 'Artahsasta, raja segala raja, kepada Ezra, imam dan ahli kitab hukum Allah semesta langit[a]: Salam sejahtera yang sempurna[b]. Dan sekarang—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ahli kitab ketetapan Allah semesta langit,” jika דָּתָא dipahami dalam arti administratif yang lebih luas, yaitu “ketetapan,” bukan “hukum”.
    reason: lexical_alternative
  - marker: b
    text: Salam dalam bahasa Aram ini merupakan formula surat resmi. “Salam sejahtera yang sempurna” juga dapat diterjemahkan “salam sejahtera sepenuhnya” atau, secara lebih idiomatis, “salam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֨רְתַּחְשַׁ֔סְתְּא
  choice: Artahsasta
  rationale: Nama raja ditransliterasikan dalam bentuk Indonesia yang lazim dipakai dalam tradisi Alkitab bahasa Indonesia.
- source_word: מֶ֖לֶךְ מַלְכַיָּ֑א
  choice: raja segala raja
  rationale: Gelar kerajaan Aram ini diterjemahkan dengan ungkapan Indonesia yang alami dan tetap mempertahankan bentuk superlatifnya.
- source_word: לְעֶזְרָ֣א
  choice: kepada Ezra
  rationale: Preposisi lamed menandai Ezra sebagai penerima surat.
- source_word: כָהֲנָא
  choice: imam
  rationale: Bentuk tertentu dalam bahasa Aram berfungsi sebagai aposisi yang menerangkan jabatan Ezra; bahasa Indonesia tidak memerlukan kata sandang.
- source_word: סָפַר דָּתָא
  choice: ahli kitab dalam hukum
  rationale: סָפַר menunjuk kepada seorang juru tulis atau ahli kitab, sedangkan דָּתָא di sini paling tepat dipahami sebagai hukum ilahi. Frasa 'ahli kitab dalam hukum' menyampaikan peran keahlian Ezra secara alami tanpa mengubahnya menjadi gelar denominasi tertentu.
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: Allah semesta langit
  rationale: Ungkapan ini mempertahankan gelar ilahi 'Allah langit/surga' dalam bentuk Indonesia yang alami dan tidak menyiratkan bahwa Allah hanya berada di suatu lokasi.
- source_word: גְּמִיר
  choice: sepenuhnya
  rationale: Kata ini berarti lengkap, penuh, atau sempurna; sebagai bagian dari formula salam, kata tersebut menerangkan kesejahteraan yang disampaikan.
- source_word: וּכְעֶנֶת
  choice: Dan sekarang—
  rationale: Formula surat resmi ini mengalihkan salam pembuka kepada isi ketetapan. Tanda pisah menunjukkan bahwa kalimat berlanjut ke ayat berikutnya.
theological_decisions:
- issue: Makna דָּתָא dalam uraian mengenai Ezra dan Allah Israel
  choice: hukum
  alternative: ketetapan
  rationale: Walaupun kata Aram ini dapat berarti ketetapan kerajaan atau peraturan, dalam uraian tentang Ezra sebagai imam dan ahli kitab milik Allah semesta langit, konteks lebih menunjuk kepada hukum atau pengajaran ilahi.
- issue: Penanganan formula surat גְּמִיר וּכְעֶנֶת
  choice: Salam sejahtera sepenuhnya. Dan sekarang—
  alternative: Salam; dan sekarang—
  rationale: Terjemahan ini mempertahankan unsur kelengkapan dalam גְּמִיר sekaligus fungsi וּכְעֶנֶת sebagai peralihan menuju isi surat, tanpa menyamarkan kepadatan formula Aram tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kepala surat dipertahankan secara ringkas; tanda pisah pada akhir ayat menandai bahwa peralihannya belum selesai dan berlanjut ke ayat berikutnya.
