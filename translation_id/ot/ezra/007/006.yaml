  text: ה֤וּא עֶזְרָא֙ עָלָ֣ה מִ/בָּבֶ֔ל וְ/הֽוּא סֹפֵ֤ר מָהִיר֙ בְּ/תוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר נָתַ֥ן יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּתֶּן ל֣/וֹ הַ/מֶּ֗לֶךְ כְּ/יַד יְהוָ֤ה אֱלֹהָי/ו֙ עָלָ֔י/ו כֹּ֖ל בַּקָּשָׁתֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/006.yaml
  text: This Ezra went up from Babylon[a], and he was a skilled scribe in the Law of Moses, which Yahweh, the God of Israel, had given. And the king granted him all his request, according to the hand of Yahweh his God upon him.
translation:
  language: id
  text: Ezra inilah yang berangkat dari Babel. Ia seorang ahli kitab yang mahir dalam Taurat Musa, yang telah diberikan oleh Yahweh, Allah Israel. Raja mengabulkan seluruh permintaannya, sesuai dengan tangan Yahweh, Allahnya, atas dirinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “sesuai dengan tangan Yahweh, Allahnya, atas dirinya” dapat menyatakan perkenanan, kuasa, atau pertolongan Yahweh yang memelihara.
    reason: Menjelaskan idiom Ibrani yang dipertahankan dalam teks utama tanpa membatasi maknanya pada satu tafsiran.
lexical_decisions:
- source_word: עָלָה מִבָּבֶל
  choice: berangkat dari Babel
  rationale: Kata עָלָה secara harfiah menggambarkan perjalanan 'naik', khususnya menuju Yerusalem. Namun, dalam bahasa Indonesia, 'naik dari Babel' kurang wajar dan dapat disalahpahami sebagai gerak vertikal; 'berangkat dari Babel' menyampaikan gerak perjalanan tanpa menentukan sudut pandang kedatangan.
- source_word: סֹפֵר
  choice: ahli kitab
  rationale: Dalam konteks Taurat Musa, istilah ini menunjuk kepada orang yang terdidik dan ahli dalam teks serta hukum suci, bukan sekadar penyalin atau sekretaris. 'Ahli kitab' mempertahankan cakupan keilmuan dan fungsi keagamaannya.
- source_word: מָהִיר
  choice: mahir
  rationale: Walaupun makna dasarnya dapat mencakup cepat atau tangkas, dalam hubungan dengan keahlian Ezra terhadap Taurat, 'mahir' secara alami menyatakan kecakapan tanpa memberi kesan kecepatan fisik.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: dalam Taurat Musa
  rationale: '''Taurat'' merupakan padanan Indonesia yang mapan dan mudah dikenali untuk תּוֹרָה dalam konteks kitab serta hukum Musa, sekaligus lebih dekat dengan istilah sumber daripada hanya ''hukum''.'
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: yang telah diberikan oleh Yahweh, Allah Israel
  rationale: Klausa relatif ini menerangkan Taurat Musa. Bentuk 'telah diberikan' menandai tindakan yang mendahului masa Ezra, sedangkan Yahweh dipertahankan sebagai nama ilahi.
- source_word: וַיִּתֶּן לוֹ הַמֶּלֶךְ כֹּל בַּקָּשָׁתוֹ
  choice: Raja mengabulkan segala permintaannya
  rationale: Dalam konteks permintaan, נתן paling alami diterjemahkan 'mengabulkan'. 'Segala permintaannya' menyatakan bahwa seluruh yang dimohon Ezra diberikan, tanpa menambah rincian yang tidak ada dalam teks.
- source_word: כְּיַד יְהוָה אֱלֹהָיו עָלָיו
  choice: karena tangan Yahweh, Allahnya, menyertainya
  rationale: 'Ungkapan ini mempertahankan gambaran konkret ''tangan Yahweh'' sambil memakai susunan Indonesia yang wajar. Hubungan kausal tersirat dalam konteks: pengabulan raja terjadi sesuai dengan karya, kuasa, atau perkenanan ilahi atas Ezra; nuansa tepatnya dibiarkan terbuka melalui catatan kaki.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan nama tersebut dan menghindari penggantian dengan sebuah gelar.
- issue: Makna ungkapan 'tangan Yahweh ... atasnya'
  choice: Mempertahankan metafora tangan dalam teks utama dan menjelaskan rentang maknanya dalam catatan kaki
  alternative: Menguraikannya langsung sebagai perkenanan, kuasa, perlindungan, atau pertolongan Yahweh
  rationale: Ungkapan Ibrani dapat mencakup perkenanan, kuasa, dan pertolongan providensial. Memilih hanya satu arti akan menyempitkan ketegangan makna yang memang ada dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ahli kitab' dan 'Taurat Musa' memakai istilah yang telah dikenal luas; susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan metafora teologis utama.
