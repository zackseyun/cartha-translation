base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/015.yaml
  text: and to bring the silver and gold that the king and his counselors have freely offered to the God of Israel[a], whose dwelling is in Jerusalem,
translation:
  language: id
  text: dan untuk membawa perak dan emas yang telah dipersembahkan dengan sukarela oleh raja dan para penasihatnya kepada Allah Israel[a], yang kediaman-Nya di Yerusalem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang berdiam di Yerusalem.” Secara lebih harfiah, bahasa Aram berbunyi “yang kediaman-Nya di Yerusalem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהֵיבָלָה
  choice: dan untuk membawa
  rationale: Infinitif bahasa Aram dengan awalan konjungsi dan preposisi menyatakan tujuan dalam surat perintah kerajaan. “Membawa” alami dalam bahasa Indonesia dan sesuai dengan pemindahan dana ke Yerusalem.
- source_word: כְּסַף וּדְהַב
  choice: perak dan emas
  rationale: Padanan langsung yang alami; klausa relatif berikutnya sudah memperjelas bahwa yang dimaksud ialah perak dan emas tertentu.
- source_word: דִּי
  choice: yang
  rationale: Partikel relatif ini memperkenalkan klausa yang menerangkan perak dan emas.
- source_word: מַלְכָּא
  choice: raja
  rationale: Nomina dalam status emfatik berfungsi definit; dalam konstruksi pasif bahasa Indonesia, “oleh raja” sudah menyatakan tokoh tertentu dalam konteks.
- source_word: וְיָעֲטוֹהִי
  choice: dan para penasihatnya
  rationale: Istilah ini menunjuk para penasihat kerajaan. “Para penasihatnya” mempertahankan latar istana dan terdengar alami dalam bahasa Indonesia modern.
- source_word: הִתְנַדַּבוּ
  choice: telah dipersembahkan dengan sukarela
  rationale: Bentuk verba menyatakan pemberian yang dilakukan dengan kemauan sendiri. Konstruksi pasif menjaga perak dan emas sebagai pokok klausa serta menyampaikan sifat sukarela pemberian itu.
- source_word: לֶאֱלָהּ יִשְׂרָאֵל
  choice: kepada Allah Israel
  rationale: Padanan baku bagi sebutan ilahi ini; “kepada” menyatakan bahwa persembahan tersebut diperuntukkan bagi Allah Israel.
- source_word: דִּי בִירוּשְׁלֶם מִשְׁכְּנֵהּ
  choice: yang tempat kediaman-Nya ada di Yerusalem
  rationale: Terjemahan ini mempertahankan ungkapan nominal bahasa Aram tentang tempat kediaman-Nya, tanpa mengubahnya menjadi sekadar verba “berdiam” atau mempersempitnya menjadi “Kemah Suci”.
theological_decisions:
- issue: Hubungan Allah dengan Yerusalem dalam מִשְׁכְּנֵהּ
  choice: yang tempat kediaman-Nya ada di Yerusalem
  alternative: yang berdiam di Yerusalem
  rationale: Bahasa Aram memakai nomina “tempat kediaman” dan bukan hanya predikat verbal. Terjemahan utama mempertahankan penekanan pada tempat kediaman Allah yang berpusat pada Bait Allah sekaligus membiarkan ketegangan teologis teks tetap ada, tanpa menambahkan penjelasan bahwa Allah dibatasi secara ruang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pasif dipilih agar fokus tetap pada perak dan emas. Huruf kapital pada pronomina “-Nya” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Allah.
