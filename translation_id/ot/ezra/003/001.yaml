base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/001.yaml
  text: When the seventh month arrived[a], and the sons of Israel were in the cities[b], the people gathered as one man to Jerusalem.
translation:
  language: id
  text: Ketika bulan ketujuh tiba dan orang-orang Israel[a] berada di kota-kota, umat itu berkumpul di Yerusalem seperti satu orang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “putra-putra Israel”; yakni, orang Israel.'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “seperti satu orang” berarti bertindak dalam kesatuan atau dengan sehati.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּגַּע
  choice: tiba
  rationale: Dengan ungkapan waktu sebagai subjek, נגע berarti bulan itu telah datang atau tiba; “tiba” alami dalam bahasa Indonesia.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: bulan ketujuh
  rationale: Menerjemahkan penanggalan Ibrani secara langsung tanpa menggantinya dengan nama bulan yang lebih kemudian.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: בני ישראל di sini merupakan sebutan kolektif bagi umat Israel. “Orang Israel” jelas dan alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בֶּעָרִים
  choice: berada di kota-kota
  rationale: Frasa Ibrani bersifat eliptis dan menyiratkan kopula. Kata “berada” melengkapinya secara wajar tanpa menambahkan kata kepunyaan yang tidak tertulis.
- source_word: וַיֵּאָסְפוּ
  choice: datang berkumpul
  rationale: Nifal אסף menyatakan tindakan berhimpun. “Datang berkumpul” juga membuat arah tujuan yang ditandai אֶל dapat diungkapkan secara alami dengan “di Yerusalem”.
- source_word: הָעָם
  choice: rakyat
  rationale: Mengungkapkan komunitas Israel secara kolektif dengan istilah Indonesia yang ringkas dan bermartabat.
- source_word: כְּאִישׁ אֶחָד
  choice: seperti satu orang
  rationale: Mempertahankan gambaran harfiah idiom Ibrani yang menekankan kesatuan tindakan; maknanya dijelaskan dalam catatan kaki.
- source_word: אֶל יְרוּשָׁלִָם
  choice: di Yerusalem
  rationale: Dalam konstruksi “datang berkumpul di Yerusalem,” tujuan gerak yang ditandai אֶל tetap tersampaikan secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa kolektif bergender dalam בְּנֵי יִשְׂרָאֵל dan כְּאִישׁ אֶחָד
  choice: Gunakan “orang Israel” untuk sebutan etnis kolektif, tetapi pertahankan “seperti satu orang” dalam teks utama.
  alternative: “anak-anak lelaki Israel” dan “dengan sehati”
  rationale: Dalam konteks ini בני ישראל berfungsi sebagai nama kolektif umat, sehingga “orang Israel” tidak membatasi kelompok hanya pada laki-laki; bentuk sumber tetap transparan melalui catatan kaki. Sebaliknya, כְּאִישׁ אֶחָד adalah citra kesatuan yang khas dan dapat dipertahankan secara jelas dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “sementara” mempertahankan hubungan keadaan dalam bahasa Ibrani; “datang berkumpul” dipilih agar arah menuju Yerusalem terdengar alami. Semua penanda catatan kaki ditempatkan tepat pada ungkapan yang dijelaskan.
