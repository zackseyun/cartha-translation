translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “Rumah” dipertahankan untuk בַּיִת agar metafora sumber tidak diratakan menjadi “Bait Suci”. Struktur kalimat menonjolkan kontras serentak antara tangisan orang-orang tua dan sorak kegembiraan banyak orang.
