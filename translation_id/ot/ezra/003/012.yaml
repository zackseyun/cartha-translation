source:
  edition: WLC
  text: וְ/רַבִּ֡ים מֵ/הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּם֩ וְ/רָאשֵׁ֨י הָ/אָב֜וֹת הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר רָא֜וּ אֶת הַ/בַּ֤יִת הָֽ/רִאשׁוֹן֙ בְּ/יָסְד֔/וֹ זֶ֤ה הַ/בַּ֨יִת֙ בְּ/עֵ֣ינֵי/הֶ֔ם בֹּכִ֖ים בְּ/ק֣וֹל גָּד֑וֹל וְ/רַבִּ֛ים בִּ/תְרוּעָ֥ה בְ/שִׂמְחָ֖ה לְ/הָרִ֥ים קֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/012.yaml
  text: But many of the priests and the Levites and the heads of the fathers’ houses[a], the old men who had seen the first house, were weeping with a loud voice when this house was founded before their eyes[c][b], while many were raising their voice with a shout of joy.
translation:
  language: id
  text: Namun, banyak di antara para imam, orang Lewi, dan para kepala kaum keluarga[a]—orang-orang tua yang pernah melihat Rumah yang pertama[b]—menangis dengan suara nyaring ketika dasar Rumah ini diletakkan di depan mata mereka[c], sedangkan banyak orang mengangkat suara dalam sorak kegembiraan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kepala kaum keluarga” adalah para pemimpin kelompok keluarga besar atau kaum yang berasal dari leluhur yang sama.
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan “Rumah yang terdahulu”. Secara harfiah, bahasa Ibrani berbunyi “Rumah yang pertama”, yaitu Bait Suci sebelumnya.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “ketika Rumah ini didirikan di depan mata mereka”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרַבִּים
  choice: Namun, banyak dari antara
  rationale: Kata sambung ו dapat berarti “dan”, tetapi di sini “namun” menyatakan kontras dengan sorak kegembiraan pada ayat sebelumnya. מִן menyatakan sebagian dari kelompok yang disebutkan.
- source_word: מֵהַכֹּהֲנִים וְהַלְוִיִּם וְרָאשֵׁי הָאָבוֹת
  choice: dari antara para imam, orang Lewi, dan para kepala kaum keluarga
  rationale: Ungkapan ini menunjuk pada sebagian imam, orang Lewi, dan pemimpin kelompok kekerabatan leluhur. “Kepala kaum keluarga” alami dalam bahasa Indonesia sekaligus mempertahankan struktur sosial yang dimaksud.
- source_word: הַזְּקֵנִים
  choice: orang-orang tua
  rationale: Dalam konteks ini, usia mereka penting karena mereka pernah melihat rumah terdahulu; karena itu, “orang-orang tua” lebih tepat daripada istilah jabatan “para tua-tua”.
- source_word: הַבַּיִת הָרִאשׁוֹן
  choice: Rumah yang pertama
  rationale: Terjemahan ini mempertahankan sebutan Ibrani “rumah” dan urutan “yang pertama”, dengan huruf kapital untuk memperjelas bahwa yang dimaksud ialah Rumah Allah, yaitu Bait Suci.
- source_word: בְּיָסְדוֹ זֶה הַבַּיִת
  choice: ketika dasar Rumah ini diletakkan
  rationale: Ungkapan dari akar יסד merujuk pada peletakan dasar bangunan. Bentuk pasif ini alami dalam bahasa Indonesia dan sesuai dengan adegan pembangunan.
- source_word: בְּעֵינֵיהֶם
  choice: di depan mata mereka
  rationale: Terjemahan idiomatis ini mempertahankan gambaran bahwa mereka menyaksikan peristiwa itu secara langsung.
- source_word: בֹּכִים בְּקוֹל גָּדוֹל
  choice: menangis dengan suara nyaring
  rationale: Partisipelnya menggambarkan tindakan yang sedang berlangsung, sedangkan frasa “dengan suara nyaring” mempertahankan gambaran harfiah tentang suara yang besar atau keras.
- source_word: בִּתְרוּעָה בְשִׂמְחָה לְהָרִים קוֹל
  choice: mengangkat suara dalam sorak kegembiraan
  rationale: Pilihan ini mempertahankan idiom “mengangkat suara” serta kedua unsur seruan nyaring dan kegembiraan.
