source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/בוֹאָ֞/ם אֶל בֵּ֤ית הָֽ/אֱלֹהִים֙ לִ/יר֣וּשָׁלִַ֔ם בַּ/חֹ֖דֶשׁ הַ/שֵּׁנִ֑י הֵחֵ֡לּוּ זְרֻבָּבֶ֣ל בֶּן שְׁ֠אַלְתִּיאֵל וְ/יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וּ/שְׁאָ֥ר אֲחֵי/הֶ֣ם הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֗ם וְ/כָל הַ/בָּאִים֙ מֵ/הַ/שְּׁבִ֣י יְרֽוּשָׁלִַ֔ם וַ/יַּעֲמִ֣ידוּ אֶת הַ/לְוִיִּ֗ם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה לְ/נַצֵּ֖חַ עַל מְלֶ֥אכֶת בֵּית יְהוָֽה־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/008.yaml
  text: And in the second year after their coming to the house of God at Jerusalem[a], in the second month, Zerubbabel son of Shealtiel and Jeshua son of Jozadak, and the rest of their brothers the priests and the Levites, and all who had come from the captivity to Jerusalem, began and appointed the Levites from twenty years old and upward to oversee the work of the house of Yahweh.
translation:
  language: id
  text: Pada tahun kedua setelah mereka tiba di rumah Allah di Yerusalem, dalam bulan kedua, Zerubabel anak Sealtiel dan Yesua anak Yozadak, bersama saudara-saudara mereka yang selebihnya, yaitu para imam dan orang-orang Lewi, serta semua orang yang telah datang dari pembuangan ke Yerusalem, mulai dan menugaskan orang-orang Lewi yang berumur dua puluh tahun ke atas untuk mengawasi pekerjaan di rumah Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבוֹאָם אֶל בֵּית הָאֱלֹהִים לִירוּשָׁלִַם
  choice: setelah mereka tiba di rumah Allah di Yerusalem
  rationale: Infinitif berawalan לְ dengan sufiks orang ketiga jamak berfungsi sebagai penanda waktu. Frasa 'rumah Allah' dipertahankan tanpa menggantinya dengan 'Bait Allah', sedangkan לִירוּשָׁלִַם dipahami sebagai keterangan lokasi.
- source_word: הֵחֵלּוּ
  choice: memulai pekerjaan itu
  rationale: Verba ini berarti 'mulai', tetapi objeknya tidak dinyatakan. Bahasa Indonesia memerlukan pelengkap agar kalimat alami; 'pekerjaan itu' merujuk ke pekerjaan rumah Yahweh yang disebut pada akhir ayat tanpa menentukan tahap pekerjaan secara lebih sempit.
- source_word: וַיַּעֲמִידוּ
  choice: menugaskan
  rationale: Bentuk Hifil dari עמד di sini menunjuk pada penempatan orang dalam suatu tanggung jawab. 'Menugaskan' lebih alami daripada terjemahan harfiah 'membuat berdiri' dan sesuai dengan fungsi pengawasan yang menyusul.
- source_word: אֲחֵיהֶם
  choice: saudara-saudara mereka
  rationale: Mempertahankan sebutan kekerabatan maskulin jamak dalam teks Ibrani; konteks selanjutnya menjelaskan bahwa yang dimaksud ialah para imam dan orang-orang Lewi.
- source_word: מֵהַשְּׁבִי
  choice: dari pembuangan
  rationale: הַשְּׁבִי dapat menunjuk pada keadaan atau komunitas dalam pembuangan. Ungkapan Indonesia 'pulang dari pembuangan' menyampaikan gerak kembali ke Yerusalem secara alami.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: yang berumur dua puluh tahun ke atas
  rationale: Ini adalah rumusan ambang usia; pilihan ini merupakan ungkapan baku dan jelas dalam bahasa Indonesia modern.
- source_word: לְנַצֵּחַ
  choice: untuk mengawasi
  rationale: Dalam konteks pekerjaan bangunan, verba ini menyatakan tanggung jawab pengawasan atau penyeliaan, bukan kepemimpinan musik.
- source_word: מְלֶאכֶת בֵּית יְהוָה
  choice: pekerjaan pembangunan rumah Yahweh
  rationale: מְלֶאכָה berarti pekerjaan atau pengerjaan. Konteks Ezra 3 adalah pembangunan kembali rumah Allah, sehingga 'pekerjaan pembangunan' memperjelas hubungan genitif Ibrani yang akan terasa janggal jika diterjemahkan secara mekanis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan nama itu secara langsung dan membedakannya dari gelar אֲדֹנָי.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama disesuaikan dengan bentuk yang lazim dalam Alkitab bahasa Indonesia. Kalimat panjang Ibrani dibagi menjadi dua agar mudah dipahami, tanpa mengubah urutan peristiwa. Tanda pisah memperjelas bahwa 'para imam dan orang-orang Lewi' menerangkan kelompok saudara-saudara mereka.
