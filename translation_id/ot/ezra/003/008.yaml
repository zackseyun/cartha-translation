revisions:
- from: Pada tahun kedua setelah mereka tiba di rumah Allah di Yerusalem, dalam bulan kedua, Zerubabel anak Sealtiel, Yesua anak Yozadak, saudara-saudara mereka yang lain—para imam dan orang-orang Lewi—serta semua orang yang telah pulang dari pembuangan ke Yerusalem, memulai pekerjaan itu. Mereka menugaskan orang-orang Lewi yang berumur dua puluh tahun ke atas untuk mengawasi pekerjaan pembangunan rumah Yahweh.
  to: Pada tahun kedua setelah mereka tiba di rumah Allah di Yerusalem, dalam bulan kedua, Zerubabel anak Sealtiel dan Yesua anak Yozadak, bersama saudara-saudara mereka yang selebihnya, yaitu para imam dan orang-orang Lewi, serta semua orang yang telah datang dari pembuangan ke Yerusalem, mulai dan menugaskan orang-orang Lewi yang berumur dua puluh tahun ke atas untuk mengawasi pekerjaan di rumah Yahweh.
  rationale: Revisi menghilangkan objek tambahan pada “mulai” dan mengganti “pekerjaan pembangunan rumah Yahweh” dengan “pekerjaan di rumah Yahweh” agar cakupan מְלֶאכֶת tetap luas. Susunan kelompok “saudara-saudara mereka yang selebihnya, yaitu para imam dan orang-orang Lewi” mempertahankan hubungan aposisional dalam teks Ibrani secara jelas.
