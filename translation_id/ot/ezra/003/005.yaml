  naturalness: Bahasa draf umumnya baku dan jelas. Revisi kecil diperlukan agar rangkaian terakhir idiomatis dalam bahasa Indonesia serta agar pengulangan kata 'sukarela' mencerminkan pengulangan kognat Ibrani tanpa menghasilkan rujukan pronominal yang kabur.
