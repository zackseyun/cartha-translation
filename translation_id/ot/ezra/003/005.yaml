  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֞ן עֹלַ֤ת תָּמִיד֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּ/לְ/כָל מוֹעֲדֵ֥י יְהוָ֖ה הַ/מְקֻדָּשִׁ֑ים וּ/לְ/כֹ֛ל מִתְנַדֵּ֥ב נְדָבָ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/005.yaml
  text: And after that came the regular burnt offering[a], and the offerings for the new moons and for all the appointed feasts of Yahweh that were consecrated[c][b], and for everyone who willingly offered a freewill offering to Yahweh.
translation:
  language: id
  text: Setelah itu, mereka mempersembahkan kurban bakaran yang tetap[a], juga kurban-kurban untuk perayaan bulan baru[b] dan untuk semua hari raya Yahweh yang dikuduskan[c], serta persembahan sukarela kepada Yahweh dari setiap orang yang dengan rela mempersembahkan persembahan sukarela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kurban bakaran yang terus-menerus” atau “kurban bakaran harian.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “bulan-bulan baru”, yaitu perayaan kudus bulanan pada awal setiap bulan.'
    reason: cultural_note
  - marker: c
    text: 'Atau: “semua waktu yang ditetapkan Yahweh” atau “semua hari raya Yahweh yang kudus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Menandai urutan waktu dan menghubungkan ayat ini dengan kegiatan persembahan dalam ayat sebelumnya; konjungsi Ibrani terwakili secara alami dalam alur bahasa Indonesia.
- source_word: עֹלַת תָּמִיד
  choice: kurban bakaran yang tetap
  rationale: עֹלָה adalah kurban yang dibakar seluruhnya, sedangkan תָּמִיד menunjukkan pelaksanaan yang tetap atau terus-menerus. Pilihan ini tidak mempersempit artinya menjadi hanya 'setiap hari', meskipun persembahan harian menjadi latar kultisnya.
- source_word: וְלֶחֳדָשִׁים
  choice: kurban-kurban untuk perayaan bulan baru
  rationale: חֹדֶשׁ dalam konteks ini menunjuk pada perayaan bulan baru yang menandai awal bulan. Kata 'kurban-kurban' disuplai dari konteks persembahan agar hubungan sintaksisnya jelas dalam bahasa Indonesia.
- source_word: וּלְכָל מוֹעֲדֵי יְהוָה
  choice: untuk semua waktu perayaan Yahweh
  rationale: מוֹעֵד mencakup waktu yang ditetapkan dan perayaan yang berlangsung pada waktu itu. 'Waktu perayaan' mempertahankan kedua unsur tersebut tanpa membatasinya pada pesta semata.
- source_word: הַמְקֻדָּשִׁים
  choice: yang telah dikuduskan
  rationale: Partisip pasif ini menerangkan waktu-waktu perayaan sebagai waktu yang telah dikhususkan bagi ibadah.
- source_word: וּלְכֹל מִתְנַדֵּב נְדָבָה
  choice: serta persembahan sukarela dari setiap orang yang dengan sukarela mempersembahkannya
  rationale: Terjemahan mempertahankan hubungan kata serumpun antara מִתְנַדֵּב dan נְדָבָה sekaligus menyatakan bahwa pemberian itu dilakukan atas kemauan sendiri.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk 'Yahweh' mempertahankan nama pribadi ilahi dan selaras dengan lapisan konsultasi yang telah diaudit.
- issue: Subjek dan verba yang tersirat dalam rangkaian persembahan
  choice: mereka mempersembahkan
  alternative: mempertahankan rangkaian nominal tanpa verba eksplisit
  rationale: Bahasa Ibrani melanjutkan tindakan dari konteks sebelumnya tanpa menyatakan kembali verba. Bahasa Indonesia memerlukan predikat yang lebih eksplisit; penambahan ini ditandai sebagai pelengkap kontekstual dan tidak menentukan identitas subjek lebih jauh daripada bentuk jamak dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah 'kurban bakaran', 'perayaan bulan baru', dan 'persembahan sukarela' dipilih agar dapat dipahami pembaca umum sambil mempertahankan istilah kultis. Verba 'mereka mempersembahkan' serta kata 'kurban-kurban' disuplai dari konteks untuk menghasilkan kalimat Indonesia yang lengkap; ambiguitas leksikal utama dipertahankan dalam catatan kaki.
