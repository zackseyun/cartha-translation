  source_fidelity: Terjemahan dengan setia menyampaikan titik awal waktu (מִיּוֹם), tindakan jamak yang mulai dilakukan, persembahan bakaran kepada Yahweh, dan keadaan bahwa fondasi bait Yahweh belum diletakkan. Hubungan konsesif yang dinyatakan dengan “meskipun” dapat dipertanggungjawabkan secara kontekstual, sementara catatan kaki dengan tepat mempertahankan kemungkinan fungsi waw yang lebih netral atau adversatif.
