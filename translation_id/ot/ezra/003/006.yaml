id: EZR.3.6
reference: Ezra 3:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ/יּ֤וֹם אֶחָד֙ לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י הֵחֵ֕לּוּ לְ/הַעֲל֥וֹת עֹל֖וֹת לַ/יהוָ֑ה וְ/הֵיכַ֥ל יְהוָ֖ה לֹ֥א יֻסָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/006.yaml
  text: From the first day of the seventh month they began to offer burnt offerings to Yahweh[a], though the foundation of the temple of Yahweh had not been laid.
translation:
  language: id
  text: Sejak hari pertama bulan ketujuh, mereka mulai mempersembahkan kurban bakaran kepada Yahweh, meskipun[a] fondasi bait Yahweh belum diletakkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata penghubung Ibrani juga dapat diterjemahkan secara lebih sederhana sebagai “dan” atau secara adversatif sebagai “tetapi”. Maksud konteksnya ialah bahwa persembahan mulai dipersembahkan sebelum fondasi bait diletakkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיּוֹם אֶחָד
  choice: Sejak hari pertama
  rationale: Preposisi מִן menandai titik awal dalam waktu. “Sejak hari pertama” mempertahankan nuansa bahwa kegiatan itu dimulai pada tanggal tersebut.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: bulan ketujuh
  rationale: Ungkapan ini menentukan bulan yang dimaksud secara langsung dan alami dalam bahasa Indonesia.
- source_word: הֵחֵלּוּ
  choice: mereka mulai
  rationale: Bentuk ini secara wajar menyatakan permulaan tindakan dan mempertahankan subjek jamak yang tersirat dalam verba Ibrani.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: mempersembahkan kurban bakaran
  rationale: Dalam konteks persembahan, idiom yang secara harfiah berkaitan dengan ‘menaikkan’ paling alami diterjemahkan sebagai tindakan mempersembahkan kurban yang dibakar seluruhnya.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi לְ menandai penerima persembahan, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: הֵיכַל יְהוָה
  choice: bait Yahweh
  rationale: הֵיכָל dapat berarti istana atau tempat suci; dalam konteks pembangunan kembali di Ezra, “bait” menyampaikan makna rumah ibadah utama secara ringkas dan tepat.
- source_word: לֹא יֻסָּד
  choice: fondasi ... belum diletakkan
  rationale: Bentuk pasif יסד menyatakan tindakan mendirikan atau meletakkan dasar. Ungkapan Indonesia ini membuat gambaran pembangunan yang tersirat menjadi jelas tanpa mengubah maksudnya.
- source_word: וְ
  choice: meskipun
  rationale: 'Dalam konteks ini, kata penghubung tersebut dapat dipahami secara konsesif: persembahan sudah dimulai walaupun fondasi bait belum diletakkan. Alternatif yang lebih netral atau adversatif dipertahankan dalam catatan kaki.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Hubungan antara dimulainya persembahan dan belum dibangunnya bait
  choice: meskipun
  alternative: dan; tetapi
  rationale: Terjemahan utama menampilkan hubungan konsesif yang sesuai dengan konteks, tetapi waw Ibrani sendiri cukup luas sehingga hubungan netral atau adversatif tetap mungkin dan tidak boleh dihapus.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kurban bakaran” dipilih sebagai istilah ibadah yang mudah dipahami, sedangkan “bait” mempertahankan nuansa tempat suci utama. Penanda catatan kaki ditempatkan langsung pada kata penghubung yang dijelaskannya.
