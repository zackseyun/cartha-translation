  text: וַֽ֠/יַּעֲנוּ בְּ/הַלֵּ֨ל וּ/בְ/הוֹדֹ֤ת לַֽ/יהוָה֙ כִּ֣י ט֔וֹב כִּֽי לְ/עוֹלָ֥ם חַסְדּ֖/וֹ עַל יִשְׂרָאֵ֑ל וְ/כָל הָ/עָ֡ם הֵרִיעוּ֩ תְרוּעָ֨ה גְדוֹלָ֤ה בְ/הַלֵּל֙ לַֽ/יהוָ֔ה עַ֖ל הוּסַ֥ד בֵּית יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/011.yaml
  text: 'And they sang responsively praising and giving thanks to Yahweh: “For he is good[c][b][a], for his steadfast love toward Israel is forever.” And all the people shouted a great shout in praise to Yahweh because the house of Yahweh had been founded.'
translation:
  language: id
  text: 'Mereka bernyanyi bersahut-sahutan[a] sambil memuji dan mengucap syukur kepada Yahweh: “Sebab Dia baik, sebab kasih setia-Nya kepada Israel tetap untuk selama-lamanya.”[b] Seluruh rakyat bersorak dengan sorak-sorai yang hebat dalam memuji Yahweh, sebab dasar rumah Yahweh telah diletakkan.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka menyahut.” Kata kerja Ibrani dapat berarti menjawab atau menanggapi; dalam konteks ini kemungkinan yang dimaksud ialah pujian yang dinyanyikan secara berbalasan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “sebab untuk selama-lamanya kasih setia-Nya atas Israel.” Bahasa Ibrani tidak menyatakan verba dalam klausa ini.
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “sebab rumah Yahweh telah diberi dasar.” Dalam konteks ini yang dimaksud ialah peletakan dasar bait.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: mereka bernyanyi bersahut-sahutan
  rationale: Dalam konteks ibadah, ענה menunjuk pada tanggapan yang kemungkinan dinyanyikan secara berbalasan. Pilihan ini menyatakan latar musikal-liturgis tanpa menutup arti dasarnya, yang dicatat dalam catatan kaki.
- source_word: בְּהַלֵּל וּבְהוֹדֹת
  choice: sambil memuji dan mengucap syukur
  rationale: 'Bentuk verbal ini alami dalam bahasa Indonesia dan mempertahankan dua tindakan ibadah yang berbeda: memuji dan mengucap syukur.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan secara langsung sebagai Yahweh, bukan diganti dengan gelar.
- source_word: כִּי טוֹב
  choice: sebab Dia baik
  rationale: Melengkapi klausa nominal Ibrani dengan pronomina menghasilkan pengakuan pujian yang jelas dan alami dalam bahasa Indonesia.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ עַל יִשְׂרָאֵל
  choice: sebab kasih setia-Nya kepada Israel tetap untuk selama-lamanya
  rationale: Kasih setia menyampaikan loyalitas dan kemurahan yang teguh dalam חֶסֶד; 'kepada Israel' menyatakan arah atau sasaran עַל, sedangkan 'tetap' membuat klausa tanpa verba itu wajar dalam bahasa Indonesia.
- source_word: הֵרִיעוּ תְרוּעָה גְדוֹלָה
  choice: bersorak dengan sorak-sorai yang nyaring
  rationale: Pengulangan akar kata Ibrani dipertahankan sejauh mungkin melalui 'bersorak' dan 'sorak-sorai', sementara 'nyaring' secara alami menyampaikan besarnya sorakan.
- source_word: בְּהַלֵּל לַיהוָה
  choice: dalam memuji Yahweh
  rationale: Frasa ini menjelaskan sifat dan tujuan sorakan rakyat sebagai pujian kepada Yahweh.
- source_word: עַל הוּסַד בֵּית יְהוָה
  choice: sebab dasar rumah Yahweh telah diletakkan
  rationale: Hophal dari יסד menyatakan bahwa rumah itu telah diberi dasar atau mulai didirikan. Dalam konteks pembangunan kembali bait, ungkapan Indonesia ini menghindari kesan bahwa seluruh bangunan sudah selesai.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut nama perjanjian itu secara langsung; bentuk 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Makna חַסְדּוֹ dalam rumusan pujian perjanjian
  choice: kasih setia-Nya
  alternative: belas kasih-Nya; kasih perjanjian-Nya
  rationale: '''Kasih setia'' mempertahankan cakupan kasih, kemurahan, dan kesetiaan tanpa mempersempitnya hanya menjadi belas kasihan atau memasukkan istilah penjelas yang tidak eksplisit.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak ibadah yang khidmat namun mudah dipahami. Struktur puitis dan pengulangan Ibrani dipertahankan bila tetap alami; ambiguitas pada וַיַּעֲנוּ dan klausa kasih setia dijelaskan melalui catatan kaki.
