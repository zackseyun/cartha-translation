base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/004.yaml
  text: They kept the Festival of Booths as it is written, and offered the daily burnt offerings by number according to the ordinance, as each day required.
translation:
  language: id
  text: Mereka merayakan Hari Raya Pondok Daun seperti yang tertulis, dan mempersembahkan kurban bakaran harian menurut jumlah yang ditetapkan, sesuai dengan ketentuan bagi setiap hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַג הַסֻּכּוֹת
  choice: Hari Raya Pondok Daun
  rationale: Padanan Indonesia yang lazim dan mudah dipahami untuk perayaan pondok-pondok sementara; unsur חַג dipertahankan sebagai 'Hari Raya'.
- source_word: וְעֹלַת יוֹם בְּיוֹם
  choice: dan mempersembahkan kurban bakaran setiap hari
  rationale: עֹלָה menunjuk kurban yang dibakar seluruhnya; konstruksi יוֹם בְּיוֹם menyatakan pelaksanaan dari hari ke hari.
- source_word: בְּמִסְפָּר
  choice: sesuai dengan jumlah yang ditetapkan
  rationale: Menyampaikan bahwa jumlah kurban mengikuti hitungan yang telah ditentukan, bukan sekadar bahwa kurban itu dapat dihitung.
- source_word: כְּמִשְׁפָּט
  choice: menurut peraturan
  rationale: Dalam konteks ritual, מִשְׁפָּט berarti ketentuan atau tata aturan yang berlaku.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: bagi hari itu
  rationale: Ungkapan ini berarti jatah atau tuntutan khusus tiap-tiap hari; diringkas secara alami tanpa menghilangkan distribusi harian.
theological_decisions:
- issue: Sifat pelaksanaan kurban pada Hari Raya Pondok Daun
  choice: Jumlah kurban dinyatakan mengikuti peraturan bagi setiap hari.
  alternative: 'Menerjemahkan secara lebih harfiah: ''perkara setiap hari pada harinya''.'
  rationale: Bilangan 29:12–38 menetapkan jumlah yang berbeda menurut hari; terjemahan ini mempertahankan acuan hukum ritual tanpa menambahkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan jelas. 'Merayakan' dipilih untuk ויעשו dalam konteks pelaksanaan hari raya, sedangkan susunan akhir dibuat alami sambil mempertahankan gagasan jumlah yang ditentukan bagi tiap hari.
