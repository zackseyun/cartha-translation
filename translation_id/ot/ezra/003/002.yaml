reference: Ezra 3:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּקָם֩ יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וּ/זְרֻבָּבֶ֤ל בֶּן שְׁאַלְתִּיאֵל֙ וְ/אֶחָ֔י/ו וַ/יִּבְנ֕וּ אֶת מִזְבַּ֖ח אֱלֹהֵ֣י יִשְׂרָאֵ֑ל לְ/הַעֲל֤וֹת עָלָי/ו֙ עֹל֔וֹת כַּ/כָּת֕וּב בְּ/תוֹרַ֖ת מֹשֶׁ֥ה אִישׁ הָ/אֱלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/002.yaml
  text: Then Jeshua son of Jozadak arose with his brothers the priests[a], and Zerubbabel son of Shealtiel with his brothers, and they built the altar of the God of Israel to offer burnt offerings on it, as it is written in the Law of Moses[b], the man of God.
translation:
  language: id
  text: Lalu Yesua anak Yozadak, bersama saudara-saudaranya, para imam, dan Zerubabel anak Sealtiel bersama saudara-saudaranya, bangkit. Mereka membangun mazbah Allah Israel untuk mempersembahkan kurban bakaran di atasnya, seperti yang tertulis dalam Taurat Musa[a], abdi Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani torah dapat berarti “pengajaran” maupun “hukum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkitlah
  rationale: Kata kerja קום menandai dimulainya tindakan tegas dalam alur cerita. “Bangkitlah” mempertahankan gerak naratif tanpa membatasinya pada tindakan berdiri secara fisik.
- source_word: יֵשׁוּעַ
  choice: Yesua
  rationale: Nama pribadi ditransliterasikan menurut bentuk Ibrani dan kelaziman Indonesia untuk tokoh pascapembuangan ini.
- source_word: בֶּן
  choice: anak
  rationale: Dalam silsilah nama, בֶּן secara langsung menyatakan hubungan keturunan; “anak” lebih transparan dalam bahasa Indonesia modern daripada gelar tradisional “bin”.
- source_word: וְאֶחָיו
  choice: bersama saudara-saudaranya
  rationale: אָח terutama berarti saudara, tetapi dapat pula mencakup kerabat atau rekan sekelompok. Terjemahan ini mempertahankan istilah kekerabatan dan membiarkan frasa berikutnya menjelaskan kelompok Yesua sebagai para imam.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan langsung bagi nomina yang menjelaskan siapa saudara-saudara atau rekan-rekan Yesua.
- source_word: זְרֻבָּבֶל
  choice: Zerubabel
  rationale: Transliterasi nama pribadi yang sudah lazim dalam bahasa Indonesia.
- source_word: שְׁאַלְתִּיאֵל
  choice: Sealtiel
  rationale: Transliterasi bentuk nama Ibrani yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַיִּבְנוּ
  choice: mereka membangun
  rationale: בנה berarti membangun. Walaupun konteks sejarah dapat mengisyaratkan pemulihan, teks tidak secara eksplisit memakai kata yang berarti membangun kembali.
- source_word: מִזְבַּח
  choice: mazbah
  rationale: “Mazbah” merupakan istilah ibadah yang mapan untuk tempat mempersembahkan kurban dan sesuai dengan konteks kultis ayat ini.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Bentuk konstruksi Ibrani diterjemahkan secara ringkas dan alami sebagai sebutan bagi Allah yang disembah Israel.
- source_word: לְהַעֲלוֹת עָלָיו עֹלוֹת
  choice: untuk mempersembahkan kurban bakaran di atasnya
  rationale: Bentuk kausatif עלה bersama עֹלוֹת adalah ungkapan ibadah untuk mempersembahkan kurban bakaran; “di atasnya” mempertahankan rujukan eksplisit kepada mazbah.
- source_word: עֹלוֹת
  choice: kurban bakaran
  rationale: Padanan baku untuk persembahan yang dibakar seluruhnya di atas mazbah.
- source_word: כַּכָּתוּב
  choice: seperti yang tertulis
  rationale: Ungkapan ini memperkenalkan kesesuaian tindakan mereka dengan ketetapan tertulis dan dapat diterjemahkan secara alami demikian.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: dalam Taurat Musa
  rationale: Dalam konteks ini תּוֹרָה menunjuk kepada ketetapan tertulis mengenai kurban. “Taurat Musa” alami dalam bahasa Indonesia serta tetap membuka cakupan makna pengajaran dan hukum.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah itu
  rationale: Ungkapan Ibrani harfiah “orang Allah” merupakan gelar bagi seorang yang mengabdi dan berbicara atas nama Allah; “abdi Allah” adalah padanan Indonesia yang alami dan mapan.
theological_decisions:
- issue: Cakupan istilah kekerabatan אֶחָיו bagi kelompok perwakilan
  choice: saudara-saudaranya
  alternative: kerabat-kerabatnya; rekan-rekannya; sesama imam
  rationale: Bentuk Ibrani secara harfiah berarti saudara-saudaranya, tetapi dapat merujuk lebih luas kepada kerabat atau rekan. Teks utama mempertahankan citra kekerabatan, sedangkan catatan kaki mengakui keluasan maknanya tanpa memastikan hubungan biologis.
- issue: Makna תּוֹרָה dalam rujukan aturan kurban
  choice: Taurat Musa
  alternative: pengajaran Musa; hukum Musa
  rationale: Konteks menekankan kepatuhan kepada ketetapan kurban yang tertulis. “Taurat” merupakan istilah Indonesia yang dikenal dan mempertahankan ketegangan antara arti pengajaran yang luas dan daya normatif hukum.
- issue: Identifikasi Musa sebagai אִישׁ הָאֱלֹהִים
  choice: abdi Allah itu
  alternative: orang Allah; hamba Allah
  rationale: Frasa ini dipertahankan sebagai gelar yang melekat pada Musa, tanpa menambahkan penjelasan doktrinal tentang jabatan atau perannya.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dengan susunan naratif yang jelas. Istilah ibadah “mazbah”, “kurban bakaran”, “Taurat”, dan “abdi Allah” dipakai karena telah dikenal luas, sementara catatan kaki menjelaskan ambiguitas leksikal yang sungguh ada dalam bahasa Ibrani.
