id: EZR.3.10
reference: Ezra 3:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יִסְּד֥וּ הַ/בֹּנִ֖ים אֶת הֵיכַ֣ל יְהוָ֑ה וַ/יַּעֲמִידוּ֩ הַ/כֹּהֲנִ֨ים מְלֻבָּשִׁ֜ים בַּ/חֲצֹֽצְר֗וֹת וְ/הַ/לְוִיִּ֤ם בְּנֵֽי אָסָף֙ בַּֽ/מְצִלְתַּ֔יִם לְ/הַלֵּל֙ אֶת יְהוָ֔ה עַל יְדֵ֖י דָּוִ֥יד מֶֽלֶךְ יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/010.yaml
  text: When the builders laid the foundation of the temple of Yahweh[a], they stationed the priests, clothed in their vestments, with trumpets, and the Levites, the sons of Asaph, with cymbals, to praise Yahweh according to the directions of David king of Israel.
translation:
  language: id
  text: Ketika para pembangun meletakkan fondasi Bait Yahweh, mereka menempatkan para imam yang berpakaian, dengan trompet, serta orang-orang Lewi, keturunan Asaf, dengan simbal, untuk memuji Yahweh menurut petunjuk Daud[a], raja Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “oleh tangan Daud, raja Israel.”'
    reason: Menunjukkan bentuk idiom Ibrani di balik terjemahan “menurut petunjuk Daud”.
lexical_decisions:
- source_word: וְיִסְּדוּ
  choice: meletakkan fondasi
  rationale: Dalam konteks pembangunan, verba יסד menunjuk pada peletakan fondasi; ungkapan ini alami dan spesifik dalam bahasa Indonesia.
- source_word: הַבֹּנִים
  choice: para pembangun
  rationale: Partisip ini berfungsi sebagai nomina bagi orang-orang yang mengerjakan pembangunan.
- source_word: הֵיכַל יְהוָה
  choice: bait Yahweh
  rationale: הֵיכָל di sini adalah bangunan bait suci, sedangkan יְהוָה dipertahankan sebagai nama ilahi Yahweh. 'Bait' sesuai dengan konteks ibadah dan tetap mudah dikenali.
- source_word: וַיַּעֲמִידוּ
  choice: mereka menempatkan
  rationale: Bentuk kausatif עמד menggambarkan pengaturan para pelayan agar mengambil tempat bagi pelayanan liturgis.
- source_word: הַכֹּהֲנִים מְלֻבָּשִׁים
  choice: para imam yang mengenakan pakaian jabatan
  rationale: מְלֻבָּשִׁים berarti 'berpakaian'; dalam konteks pelayanan resmi para imam, 'pakaian jabatan' menyampaikan fungsi seremonialnya tanpa menentukan rincian pakaian yang tidak disebutkan.
- source_word: בַּחֲצֹצְרוֹת
  choice: dengan trompet
  rationale: חֲצֹצְרוֹת adalah trompet lurus seremonial. 'Trompet' merupakan istilah Indonesia modern yang jelas.
- source_word: וְהַלְוִיִּם בְּנֵי אָסָף
  choice: serta orang-orang Lewi, keturunan Asaf
  rationale: בְּנֵי dapat menandai garis keturunan atau kelompok keluarga; 'keturunan Asaf' lebih alami daripada 'anak-anak Asaf' dan tidak mengharuskan mereka anak kandung langsung.
- source_word: בַּמְצִלְתַּיִם
  choice: dengan simbal
  rationale: Istilah ini menunjuk pada simbal yang dipakai dalam musik ibadah; 'simbal' adalah padanan modern yang tepat.
- source_word: לְהַלֵּל אֶת יְהוָה
  choice: untuk memuji Yahweh
  rationale: Infinitif menyatakan tujuan penempatan para imam dan orang Lewi.
- source_word: עַל יְדֵי דָּוִיד
  choice: menurut petunjuk Daud
  rationale: Secara harfiah ungkapan ini berarti 'melalui tangan Daud', tetapi dalam konteks tata ibadah menunjuk pada petunjuk atau pengaturan yang berasal dari Daud.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Padanan langsung bagi gelar kerajaan tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Transliterasi 'Yahweh' mempertahankan nama pribadi ilahi yang muncul dua kali dalam ayat ini, alih-alih menggantinya dengan gelar.
- issue: Makna עַל יְדֵי דָּוִיד dalam konteks tata ibadah
  choice: menurut petunjuk Daud
  alternative: melalui tangan Daud; atas ketetapan Daud
  rationale: Pilihan ini menyampaikan makna idiomatis berupa arahan atau pengaturan Daud, sambil mempertahankan alternatif harfiahnya dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'bait' mempertahankan nuansa tempat ibadah, sementara 'trompet' dan 'simbal' dipilih agar mudah dipahami pembaca masa kini. Tanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
