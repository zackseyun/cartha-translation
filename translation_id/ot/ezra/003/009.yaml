  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד יֵשׁ֡וּעַ בָּנָ֣י/ו וְ֠/אֶחָי/ו קַדְמִיאֵ֨ל וּ/בָנָ֤י/ו בְּנֵֽי יְהוּדָה֙ כְּ/אֶחָ֔ד לְ/נַצֵּ֛חַ עַל עֹשֵׂ֥ה הַ/מְּלָאכָ֖ה בְּ/בֵ֣ית הָ/אֱלֹהִ֑ים בְּנֵי֙ חֵֽנָדָ֔ד בְּנֵי/הֶ֥ם וַ/אֲחֵי/הֶ֖ם הַ/לְוִיִּֽם־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/009.yaml
  text: Then Jeshua[a], his sons and his brothers, and Kadmiel and his sons, the sons of Judah, stood together as one to oversee those doing the work in the house of God, along with the sons of Henadad, their sons and their brothers, the Levites.
translation:
  language: id
  text: Kemudian Yesua, anak-anaknya dan saudara-saudaranya, Kadmiel dan anak-anaknya, keturunan Yehuda[a], berdiri bersama sebagai satu untuk mengawasi orang-orang yang mengerjakan pekerjaan di rumah Allah, bersama keturunan Henadad, anak-anak mereka dan saudara-saudara mereka, orang-orang Lewi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “keturunan Yehuda.” Sebagian versi kuno dan terjemahan modern berbunyi “keturunan Hodawya.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: berdiri
  rationale: Kata kerja עמד pada dasarnya berarti “berdiri” atau “mengambil tempat.” Dalam konteks ini, kata tersebut menggambarkan para orang Lewi yang mengambil posisi untuk menjalankan pengawasan; “berdiri” mempertahankan gambaran konkret bahasa Ibrani.
- source_word: יֵשׁוּעַ
  choice: Yesua
  rationale: Nama ini ditransliterasikan dalam bentuk yang lazim dipakai dalam Alkitab bahasa Indonesia untuk tokoh dalam kitab Ezra.
- source_word: בָּנָיו וְאֶחָיו
  choice: anak-anaknya dan saudara-saudaranya
  rationale: Pilihan ini mempertahankan hubungan keluarga yang dinyatakan teks. Dalam konteks silsilah dan kelompok kerja laki-laki ini, bentuk jamak bahasa Indonesia tetap alami tanpa menambahkan keterangan yang tidak dinyatakan secara eksplisit.
- source_word: קַדְמִיאֵל וּבָנָיו
  choice: serta Kadmiel dan anak-anaknya
  rationale: Koordinasi sederhana mempertahankan susunan kelompok keluarga kedua yang sejajar dengan kelompok Yesua.
- source_word: בְּנֵי יְהוּדָה
  choice: keturunan Yehuda
  rationale: Teks Masoret berbunyi “anak-anak lelaki Yehuda,” suatu ungkapan yang dalam konteks kelompok keluarga lebih alami diterjemahkan “keturunan Yehuda.” Varian “keturunan Hodawya” dicatat dalam catatan kaki.
- source_word: כְּאֶחָד
  choice: bersama-sama sebagai satu kesatuan
  rationale: Ungkapan ini menekankan tindakan yang terpadu. Terjemahan tersebut mempertahankan unsur kebersamaan dan kesatuan tanpa memakai bahasa yang kuno.
- source_word: לְנַצֵּחַ
  choice: untuk mengawasi
  rationale: Dalam konteks pekerjaan pembangunan, bentuk piel dari נצח menunjuk pada pengarahan atau pengawasan para pekerja, bukan kepemimpinan musik.
- source_word: עַל עֹשֵׂה הַמְּלָאכָה
  choice: orang-orang yang mengerjakan pekerjaan
  rationale: Partisipel tunggal dengan artikel berfungsi secara kolektif. Terjemahan ini mempertahankan nuansa tindakan dan tidak mempersempit maknanya menjadi jabatan tertentu.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: di rumah Allah
  rationale: Ini adalah ungkapan baku bagi tempat ibadah atau bait Allah. “Rumah Allah” mempertahankan metafora formal teks sumber.
- source_word: בְּנֵי חֵנָדָד בְּנֵיהֶם וַאֲחֵיהֶם הַלְוִיִּם
  choice: keturunan Henadad, anak-anak dan saudara-saudara mereka, yaitu orang-orang Lewi
  rationale: Frasa penutup menambahkan kelompok keluarga lain dan mengidentifikasi mereka sebagai orang Lewi. “Bersama mereka berdiri” diulangi demi kejelasan hubungan sintaksis tanpa mengubah fungsi kelompok tersebut.
theological_decisions:
- issue: Ketidakpastian tekstual dalam בְּנֵי יְהוּדָה
  choice: Menerjemahkan teks Masoret secara langsung sebagai “keturunan Yehuda.”
  alternative: “keturunan Hodawya”
  rationale: WLC yang menjadi sumber utama memuat bacaan “Yehuda.” Sejumlah versi kuno dan terjemahan modern mencerminkan “Hodawya”; karena itu, bacaan alternatif dipertahankan dalam catatan kaki dan tidak dimasukkan diam-diam ke dalam teks utama.
- issue: Hubungan kelompok keturunan Henadad dengan tindakan mengawasi
  choice: Memahami mereka sebagai kelompok orang Lewi tambahan yang turut berdiri untuk mengawasi pekerjaan.
  alternative: Membaca frasa penutup semata-mata sebagai aposisi yang longgar tanpa mengulang kata kerja.
  rationale: Susunan Ibrani padat dan koordinatif. Pengulangan “berdiri” dalam bahasa Indonesia menjelaskan bahwa kelompok Henadad turut serta, sambil tetap mempertahankan identifikasi penutup “orang-orang Lewi.”
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar keluarga dipertahankan, tetapi tanda pisah dan pengulangan kata kerja dipakai untuk memperjelas sintaksis Ibrani yang padat. Istilah “rumah Allah” dipertahankan sebagai ungkapan alkitabiah yang tetap mudah dipahami.
