  to: Kemudian Yesua, anak-anaknya dan saudara-saudaranya, Kadmiel dan anak-anaknya, keturunan Yehuda[a], berdiri bersama sebagai satu untuk mengawasi orang-orang yang mengerjakan pekerjaan di rumah Allah, bersama keturunan Henadad, anak-anak mereka dan saudara-saudara mereka, orang-orang Lewi.
