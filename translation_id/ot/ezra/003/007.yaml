  text: וַ/יִּ֨תְּנוּ כֶ֔סֶף לַ/חֹצְבִ֖ים וְ/לֶ/חָרָשִׁ֑ים וּ/מַאֲכָ֨ל וּ/מִשְׁתֶּ֜ה וָ/שֶׁ֗מֶן לַ/צִּֽדֹנִים֙ וְ/לַ/צֹּרִ֔ים לְ/הָבִיא֩ עֲצֵ֨י אֲרָזִ֤ים מִן הַ/לְּבָנוֹן֙ אֶל יָ֣ם יָפ֔וֹא כְּ/רִשְׁי֛וֹן כּ֥וֹרֶשׁ מֶֽלֶךְ פָּרַ֖ס עֲלֵי/הֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/007.yaml
  text: So they gave money to the stonecutters and to the craftsmen[a], and food and drink and oil to the Sidonians and the Tyrians, to bring cedar timber from Lebanon to the sea at Joppa[c][b], according to the authorization of Cyrus king of Persia upon them.
translation:
  language: id
  text: Lalu mereka memberikan uang[a] kepada para pemotong batu dan para pengrajin, serta makanan, minuman, dan minyak kepada orang Sidon dan orang Tirus, supaya mereka membawa kayu aras dari Lebanon ke laut di Yafo[b], sesuai dengan izin yang diberikan Koresh, raja Persia, kepada mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perak”. Kata Ibrani yang dipakai dapat berarti logam perak atau uang dalam konteks pembayaran.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ke laut Yafo”; dapat juga diterjemahkan “ke pelabuhan Yafo”.
    reason: lexical_alternative
  - marker: c
    text: Atau “sesuai dengan kewenangan yang diberikan Koresh, raja Persia, kepada mereka”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Lalu mereka memberikan
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyampaikan daya sekuensialnya secara alami dalam bahasa Indonesia.
- source_word: כֶסֶף
  choice: uang
  rationale: Walaupun kata ini juga dapat berarti logam “perak”, konteks pembayaran kepada para pekerja mendukung makna “uang”.
- source_word: לַחֹצְבִים
  choice: kepada para pemotong batu
  rationale: Partisip dari חצב menunjuk kepada orang yang memotong atau menambang batu; pilihan ini jelas dan sesuai dengan konteks pembangunan Bait Allah.
- source_word: וְלֶחָרָשִׁים
  choice: dan para pengrajin
  rationale: חָרָשׁ adalah pekerja terampil yang bahannya tidak ditentukan di sini; “pengrajin” mempertahankan keluasan itu.
- source_word: וּמַאֲכָל וּמִשְׁתֶּה וָשֶׁמֶן
  choice: serta makanan, minuman, dan minyak
  rationale: Ketiga kata menunjuk kepada barang persediaan; “minyak” tidak diperinci menjadi minyak zaitun karena teks Ibrani tidak menyatakannya.
- source_word: לַצִּדֹנִים וְלַצֹּרִים
  choice: kepada orang Sidon dan orang Tirus
  rationale: Bentuk gentilik Ibrani diterjemahkan secara alami sebagai penduduk atau orang yang berasal dari kedua kota itu.
- source_word: לְהָבִיא
  choice: supaya mereka membawa
  rationale: Infinitif ini menyatakan tujuan pemberian bekal; subjek tersiratnya diperjelas secara wajar sebagai orang Sidon dan orang Tirus.
- source_word: עֲצֵי אֲרָזִים
  choice: kayu aras
  rationale: Ungkapan ini menunjuk kepada kayu cedar sebagai bahan bangunan; “kayu aras” merupakan padanan Alkitabiah Indonesia yang mapan dan tidak memaksakan bentuk khusus seperti gelondongan.
- source_word: מִן הַלְּבָנוֹן
  choice: dari Lebanon
  rationale: Terjemahan langsung bagi tempat asal kayu aras.
- source_word: אֶל יָם יָפוֹא
  choice: melalui laut ke Yafo
  rationale: Secara harfiah ungkapan ini adalah “ke laut Yafo”; dalam konteks pengangkutan kayu dari Lebanon, pilihan ini menyampaikan tujuan pesisir Yafo dan jalur laut secara alami, sementara bentuk harfiahnya dicatat.
- source_word: כְּרִשְׁיוֹן כּוֹרֶשׁ מֶלֶךְ פָּרַס עֲלֵיהֶם
  choice: sesuai dengan izin yang diberikan Koresh, raja Persia, kepada mereka
  rationale: רִשְׁיוֹן berarti izin atau wewenang resmi, sedangkan עֲלֵיהֶם dalam idiom ini paling alami dinyatakan sebagai izin yang diberikan kepada mereka.
