  terminology: “Bunyi,” “sorak kegembiraan,” “tangisan,” dan “terdengar sampai jauh” sesuai dengan konteks dan ragam naratif modern. Pengulangan “bersorak dengan sorak” dengan tepat mempertahankan konstruksi serumpun Ibrani.
