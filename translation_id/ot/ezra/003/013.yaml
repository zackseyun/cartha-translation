translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan akar kata pada 'bersorak dengan sorak' dipertahankan untuk mencerminkan permainan kata Ibrani, sedangkan 'dahsyat' menyampaikan intensitasnya secara wajar.
