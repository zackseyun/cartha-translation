base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/013.yaml
  text: And the people could not distinguish the sound of the shout of joy from the sound of the people’s weeping[a], for the people were shouting with a great shout[b], and the sound was heard far away.
translation:
  language: id
  text: Orang-orang tidak dapat membedakan bunyi sorak kegembiraan dari bunyi tangisan orang-orang itu[a], sebab mereka bersorak dengan sorak yang keras[b], dan bunyi itu terdengar sampai jauh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak dapat mengenali bunyi sorak kegembiraan dari bunyi tangisan orang-orang itu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dengan sorak yang besar”; dapat juga diterjemahkan “dengan sorak yang nyaring.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכִּירִים
  choice: tidak dapat membedakan
  rationale: Bentuk Hifil dari נכר di sini menyatakan ketidakmampuan membedakan dua bunyi, bukan sekadar mengenalinya.
- source_word: קוֹל
  choice: bunyi
  rationale: Kata ini dapat berarti suara atau bunyi; konteks membandingkan gejala yang terdengar, sehingga 'bunyi' paling tepat.
- source_word: תְּרוּעַת הַשִּׂמְחָה
  choice: sorak kegembiraan
  rationale: Terjemahan ini mempertahankan gagasan seruan keras dan hubungan konstruksi dengan kegembiraan secara alami dalam bahasa Indonesia.
- source_word: לְקוֹל בְּכִי הָעָם
  choice: dari bunyi tangisan orang-orang itu
  rationale: Preposisi לְ berfungsi dalam perbandingan setelah מַכִּירִים; 'tangisan' mempertahankan daya emosional בְּכִי dan kaitannya dengan konteks sebelumnya.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan alasan mengapa kedua bunyi tidak dapat dibedakan.
- source_word: מְרִיעִים
  choice: bersorak
  rationale: Bentuk Hifil dari רוע dalam konteks ini berarti meneriakkan sorak keras; 'bersorak' ringkas dan alami.
- source_word: תְּרוּעָה גְדוֹלָה
  choice: dengan sorak yang dahsyat
  rationale: '''Dahsyat'' mencerminkan גְדוֹלָה sebagai besarnya atau kuatnya sorak, sambil mempertahankan konstruksi serumpun dengan verba ''bersorak''.'
- source_word: נִשְׁמַע
  choice: terdengar
  rationale: Bentuk Nifal dari שׁמע secara alami dinyatakan dengan verba pasif Indonesia 'terdengar'.
- source_word: עַד לְמֵרָחוֹק
  choice: sampai jauh
  rationale: Ungkapan ini menunjukkan bahwa bunyi tersebut mencapai jarak yang jauh; terjemahan ini singkat dan idiomatis.
