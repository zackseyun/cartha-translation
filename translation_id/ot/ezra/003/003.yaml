  text: וַ/יָּכִ֤ינוּ הַ/מִּזְבֵּ֨חַ֙ עַל מְכ֣וֹנֹתָ֔י/ו כִּ֚י בְּ/אֵימָ֣ה עֲלֵי/הֶ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת ו/יעל עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה עֹל֖וֹת לַ/בֹּ֥קֶר וְ/לָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/003.yaml
  text: They set up the altar on its foundations[a], for fear was upon them because of the peoples of the lands, and they offered up burnt offerings on it to Yahweh[b], burnt offerings morning and evening.
translation:
  language: id
  text: Mereka mendirikan mazbah itu pada fondasinya[a], sebab ketakutan menimpa mereka karena bangsa-bangsa dari negeri-negeri itu[b]; lalu mereka mempersembahkan[c] di atasnya kurban-kurban bakaran kepada Yahweh, kurban bakaran pada pagi dan petang hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di atas alasnya” atau “di tempatnya yang tetap.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sebab ketakutan ada atas mereka dari bangsa-bangsa di negeri-negeri itu.” Kata depan Ibrani dapat menunjukkan sumber atau penyebab ketakutan.
    reason: lexical_alternative
  - marker: c
    text: Bentuk kata kerja Ibrani yang diterjemahkan “mereka mempersembahkan” tampak tunggal dan dapat diterjemahkan “ia mempersembahkan”; konteks sebelumnya menyebut kelompok itu sebagai pelaku.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: Mereka mendirikan
  rationale: Bentuk Hifil dari כון di sini menunjuk pada tindakan menempatkan dan menyiapkan mazbah agar dapat digunakan. “Mendirikan” alami dalam bahasa Indonesia untuk pemasangan sebuah mazbah.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah itu
  rationale: “Mazbah” merupakan istilah baku dan ringkas dalam konteks persembahan kurban; penunjuk “itu” mewakili artikel tertentu Ibrani dan merujuk pada mazbah yang sedang dipulihkan.
- source_word: עַל מְכֹנוֹתָיו
  choice: di atas fondasinya
  rationale: מְכוֹנוֹתָיו dapat menunjuk pada fondasi, alas, atau tempat tetapnya. Pilihan ini mempertahankan gambaran konkret tanpa menutup alternatif leksikal.
- source_word: כִּי בְּאֵימָה עֲלֵיהֶם מֵעַמֵּי הָאֲרָצוֹת
  choice: Mereka diliputi ketakutan terhadap bangsa-bangsa di negeri-negeri sekitar
  rationale: Ungkapan harfiahnya menyatakan bahwa ketakutan berada “atas mereka,” sedangkan מִן dapat menandai sumber atau penyebab rasa takut. “Diliputi ketakutan terhadap” mempertahankan daya ungkap itu dalam bahasa Indonesia yang wajar. “Sekitar” menjelaskan acuan kontekstual jamak הָאֲרָצוֹת tanpa menyiratkan satu negeri saja.
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: lalu mereka mempersembahkan kurban-kurban bakaran di atasnya
  rationale: Hifil עלה bersama עֹלוֹת adalah ungkapan baku untuk mempersembahkan kurban bakaran. Subjek jamak diteruskan secara kontekstual dari klausa sebelumnya, walaupun bentuk verba Masoretik sendiri tunggal.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan “Yahweh” untuk mempertahankan nama perjanjian yang hadir langsung dalam teks.
- source_word: עֹלוֹת לַבֹּקֶר וְלָעָרֶב
  choice: yaitu kurban bakaran pada pagi dan petang hari
  rationale: Pengulangan עֹלוֹת dipertahankan dengan “yaitu kurban bakaran,” sedangkan “pada pagi dan petang hari” menyampaikan kedua waktu persembahan harian secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan fungsi nama diri dan tidak menggantinya dengan gelar.
- issue: Subjek verba וַיַּעַל yang berbentuk tunggal
  choice: mereka mempersembahkan
  alternative: ia mempersembahkan
  rationale: Alur kalimat dan subjek jamak sebelumnya mendukung kelanjutan tindakan kelompok. Namun, karena bentuk Masoretiknya tunggal, pilihan harfiah “ia” tetap merupakan kemungkinan gramatikal dan dicatat agar ketegangan teks tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam khidmat tetapi mudah dipahami. Struktur kalimat dipecah menjadi dua untuk kejernihan. Istilah “mazbah” dan “kurban bakaran” dipakai secara konsisten dalam konteks ibadah Israel. Semua alternatif yang bermakna dicatat tanpa memaksakan identitas subjek tunggal pada verba terakhir.
