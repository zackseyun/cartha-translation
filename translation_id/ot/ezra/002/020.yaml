lexical_decisions:
- source_word: בְּנֵי
  choice: Keturunan
  rationale: Secara harfiah berarti “anak-anak lelaki dari,” tetapi dalam daftar orang yang kembali, bentuk ini lazim menunjuk pada kelompok keluarga atau keturunan. “Keturunan” menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia.
- source_word: גִבָּר
  choice: Gibar
  rationale: Nama diri ini ditransliterasikan dari bentuk Ibrani גִבָּר. Ejaan “Gibar” mengikuti pelafalan Ibrani dan kaidah ejaan Indonesia tanpa menggandakan konsonan yang tidak diperlukan.
- source_word: תִּשְׁעִים וַחֲמִשָּׁה
  choice: sembilan puluh lima orang
  rationale: Ungkapan bilangan Ibrani secara harfiah berbunyi “sembilan puluh dan lima.” Susunan bilangan Indonesia yang wajar ialah “sembilan puluh lima”; “orang” ditambahkan untuk memperjelas bahwa angka itu menyatakan jumlah anggota kelompok.
