lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar orang yang kembali di Ezra 2, bentuk ini memperkenalkan kelompok berdasarkan leluhur atau tempat. “Keturunan” menyampaikan fungsi kelompok tersebut secara alami dalam bahasa Indonesia tanpa memaksakan arti anak kandung laki-laki.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Nama diri ini ditransliterasikan sebagai “Nebo”. Dalam konteks daftar ini, nama tersebut dapat menunjuk pada leluhur, kaum, atau tempat, sehingga terjemahan tidak mempersempit rujukannya.
- source_word: חֲמִשִּׁים וּשְׁנָיִם
  choice: lima puluh dua orang
  rationale: Bilangan Ibrani berarti 52. Kata “orang” ditambahkan secara wajar dalam bahasa Indonesia untuk menjelaskan bahwa angka itu adalah jumlah anggota kelompok.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan sesuai dengan pola daftar sensus. Pilihan “keturunan” mempertahankan kemungkinan kelompok kekerabatan tanpa mengesankan bahwa semuanya anak kandung langsung; rujukan nama Nebo dibiarkan tetap ambigu antara leluhur, kaum, dan tempat.
