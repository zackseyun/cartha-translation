  text: 'The sons of Kiriath-arim[a], Kephirah, and Beeroth: 743.'
translation:
  language: id
  text: 'Orang-orang[a] dari Kiryat-Arim, Kefira, dan Beerot: 743 orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak”; dalam konteks ini dapat berarti keturunan atau orang-orang yang berasal dari tempat-tempat tersebut.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: בְּנֵי
  choice: Orang-orang dari
  rationale: Dalam daftar orang yang kembali, ungkapan ini memperkenalkan kelompok yang terkait dengan suatu tempat. Terjemahan ini lebih alami dalam bahasa Indonesia daripada bentuk harfiah “anak-anak”, tanpa menentukan secara berlebihan apakah yang dimaksud ialah keturunan atau penduduk asal.
- source_word: קִרְיַת עָרִים
  choice: Kiryat-Arim
  rationale: Nama tempat ini ditransliterasikan dari bentuk Ibrani dan tidak diterjemahkan.
- source_word: כְּפִירָה
  choice: Kefira
  rationale: Nama tempat ini ditransliterasikan dengan ejaan yang alami dan mudah dibaca dalam bahasa Indonesia.
- source_word: וּבְאֵרוֹת
  choice: dan Beerot
  rationale: Kata penghubung diterjemahkan secara eksplisit, sedangkan nama tempat ditransliterasikan sesuai bunyi Ibrani.
- source_word: שְׁבַע מֵאוֹת וְאַרְבָּעִים וּשְׁלֹשָׁה
  choice: 743 orang
  rationale: Angka ditulis dengan numeral modern agar daftar sensus mudah dibaca; penambahan “orang” memperjelas satuan yang tersirat dalam konteks.
