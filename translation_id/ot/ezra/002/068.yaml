  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מֵ/רָאשֵׁי֙ הָֽ/אָב֔וֹת בְּ/בוֹאָ֕/ם לְ/בֵ֥ית יְהוָ֖ה אֲשֶׁ֣ר בִּ/ירוּשָׁלִָ֑ם הִֽתְנַדְּבוּ֙ לְ/בֵ֣ית הָֽ/אֱלֹהִ֔ים לְ/הַעֲמִיד֖/וֹ עַל מְכוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/068.yaml
  text: And some of the heads of the fathers’ houses[a], when they came to the house of Yahweh that is in Jerusalem, gave freewill offerings for the house of God[c][b], to set it up on its foundation.
translation:
  language: id
  text: Beberapa dari antara para kepala kaum keluarga[a], ketika mereka tiba di rumah Yahweh di Yerusalem, memberikan persembahan sukarela[b] bagi rumah Allah untuk mendirikannya pada tempatnya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepala-kepala kaum leluhur”; maksudnya ialah para pemimpin kelompok kekerabatan Israel.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “memberi dengan sukarela.” Kata Ibraninya menekankan kerelaan dalam memberi.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “di atas fondasinya” atau “di lokasinya.” Kata Ibraninya dapat menunjuk dasar bangunan ataupun tempatnya yang tetap.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: Beberapa kepala kaum keluarga
  rationale: מִן bersifat partitif, sehingga yang dimaksud ialah beberapa orang dari antara para pemimpin kelompok kekerabatan Israel. “Kepala kaum keluarga” menyampaikan fungsi sosial itu secara wajar dalam bahasa Indonesia.
- source_word: בְּבוֹאָם
  choice: ketika tiba
  rationale: Preposisi ב dengan infinitif konstruk bersufiks menyatakan waktu. Bentuk ini ringkas dan alami dalam bahasa Indonesia.
- source_word: לְבֵית יְהוָה
  choice: di rumah Yahweh
  rationale: בַּיִת dipertahankan sebagai “rumah,” bukan diperjelas menjadi “Bait Allah,” untuk menjaga pengulangan leksikal dengan “rumah Allah.” Dalam konteks verba datang, לְ diterjemahkan secara idiomatis sebagai tujuan kedatangan, “di” setelah “tiba.”
- source_word: הִתְנַדְּבוּ
  choice: memberikan persembahan sukarela
  rationale: Bentuk Hitpael dari נדב menekankan tindakan memberi dengan sukarela; konteks ayat berikutnya menunjukkan bahwa pemberian tersebut berupa harta untuk pembangunan.
- source_word: לְבֵית הָאֱלֹהִים
  choice: bagi rumah Allah
  rationale: לְ menyatakan sasaran atau tujuan pemberian, sedangkan “rumah Allah” mempertahankan kesejajaran dengan “rumah Yahweh.”
- source_word: לְהַעֲמִידוֹ
  choice: untuk mendirikannya
  rationale: Bentuk Hifil dari עמד berarti membuat berdiri atau mendirikan. Pilihan ini sesuai dengan konteks pembangunan tanpa menambahkan tahap pekerjaan yang tidak dinyatakan.
- source_word: עַל מְכוֹנוֹ
  choice: di tempatnya semula
  rationale: מָכוֹן dapat menunjuk tempat yang tetap, lokasi, atau dasar. “Di tempatnya semula” mempertahankan gagasan pendirian kembali pada lokasi yang sudah ditetapkan tanpa membatasi makna hanya pada fondasi fisik.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama perjanjian ilahi secara langsung. “Yahweh” mempertahankan nama tersebut dan membedakannya dari gelar אֱלֹהִים, yang diterjemahkan “Allah.”
- issue: Makna sosial רָאשֵׁי הָאָבוֹת
  choice: kepala kaum keluarga
  alternative: kepala kaum leluhur atau para kepala keluarga
  rationale: Ungkapan itu menunjuk para pemimpin unit kekerabatan berdasarkan garis leluhur. Pilihan utama menyampaikan struktur sosialnya tanpa memberi kesan bahwa mereka sekadar ayah dalam keluarga inti.
- issue: Cakupan makna מְכוֹנוֹ
  choice: tempatnya semula
  alternative: fondasinya
  rationale: Kata tersebut dapat merujuk pada lokasi tetap maupun dasar bangunan. Teks utama memakai ungkapan lokatif yang cukup luas, sedangkan kemungkinan makna fondasi dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah “rumah Yahweh” dan “rumah Allah” sengaja dipertahankan untuk mencerminkan pengulangan dalam teks Ibrani; catatan kaki menjelaskan ungkapan sosial kuno dan ambiguitas lokasi/fondasi.
