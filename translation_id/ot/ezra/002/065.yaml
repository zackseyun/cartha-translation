translation:
  language: id
  text: Selain budak laki-laki dan perempuan mereka[a], yang berjumlah 7.337 orang, mereka mempunyai 200 penyanyi laki-laki dan perempuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: pelayan laki-laki dan perempuan mereka. Istilah-istilah Ibrani ini dapat menunjuk kepada pelayan rumah tangga secara lebih umum, tetapi dalam konteks sensus ini “budak” lebih jelas menggambarkan kedudukan mereka yang bergantung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: selain
  rationale: Menandai kelompok tambahan di luar jumlah orang yang disebut sebelumnya dan terdengar alami dalam catatan sensus.
- source_word: עַבְדֵיהֶם וְאַמְהֹתֵיהֶם
  choice: budak laki-laki dan perempuan mereka
  rationale: Kedua istilah menunjuk secara eksplisit kepada orang laki-laki dan perempuan dalam kedudukan bergantung; dalam konteks daftar rumah tangga, 'budak' menyatakan kenyataan sosial itu dengan lebih jelas daripada 'pelayan', sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: אֵלֶּה שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה
  choice: yang berjumlah 7.337 orang
  rationale: Menyampaikan klausa jumlah secara wajar dalam bahasa Indonesia serta mempertahankan angka tepatnya; 'orang' ditambahkan sebagai penggolong yang alami.
- source_word: וְלָהֶם
  choice: mereka mempunyai
  rationale: Konstruksi posesif-eksistensial Ibrani diterjemahkan dengan ungkapan Indonesia yang langsung dan alami.
- source_word: מְשֹׁרְרִים וּמְשֹׁרְרוֹת
  choice: penyanyi laki-laki dan perempuan
  rationale: Mempertahankan pembedaan gender yang dinyatakan oleh bentuk maskulin dan feminin dalam bahasa Ibrani.
- source_word: מָאתָיִם
  choice: '200'
  rationale: Angka ditulis dengan digit agar mudah dibaca dalam konteks daftar sensus.
