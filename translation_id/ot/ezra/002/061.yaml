revisions:
- from: 'Dari antara keturunan para imam: keturunan Hobaya, keturunan Hakos, dan keturunan Barzilai. Barzilai ini memperistri salah seorang anak perempuan Barzilai, orang Gilead itu, lalu disebut menurut nama keluarga mereka.[a]'
  to: 'Dari antara keturunan para imam: keturunan Hobaya, keturunan Hakos, dan keturunan Barzilai, yang telah memperistri seorang dari antara anak-anak perempuan Barzilai, orang Gilead itu, dan disebut menurut nama mereka.[a]'
  rationale: Revisi menghapus penambahan “keluarga” agar rujukan “mereka” tetap sama terbukanya dengan teks Ibrani. Klausa relatif disatukan kembali dengan entri Barzilai, sementara makna idiomatis “memperistri” dan nuansa partitif “seorang dari antara anak-anak perempuan” dipertahankan.
