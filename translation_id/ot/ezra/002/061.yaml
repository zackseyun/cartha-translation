source:
  edition: WLC
  text: וּ/מִ/בְּנֵי֙ הַ/כֹּ֣הֲנִ֔ים בְּנֵ֥י חֳבַיָּ֖ה בְּנֵ֣י הַקּ֑וֹץ בְּנֵ֣י בַרְזִלַּ֗י אֲשֶׁ֣ר לָ֠קַח מִ/בְּנ֞וֹת בַּרְזִלַּ֤י הַ/גִּלְעָדִי֙ אִשָּׁ֔ה וַ/יִּקָּרֵ֖א עַל שְׁמָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/061.yaml
  text: 'And from among the sons of the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: id
  text: 'Dari antara keturunan para imam: keturunan Hobaya, keturunan Hakos, dan keturunan Barzilai, yang telah memperistri seorang dari antara anak-anak perempuan Barzilai, orang Gilead itu, dan disebut menurut nama mereka.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dan disebut menurut nama mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי הַכֹּהֲנִים
  choice: Dari antara keturunan para imam
  rationale: Prefiks מן menyatakan makna partitif, yaitu sebagian dari kelompok keturunan imam. Dalam daftar silsilah, בְּנֵי secara alami diterjemahkan sebagai 'keturunan' dalam bahasa Indonesia modern tanpa menghilangkan makna garis keluarga.
- source_word: בְּנֵי חֳבַיָּה ... בְּנֵי הַקּוֹץ ... בְּנֵי בַרְזִלַּי
  choice: keturunan Hobaya, keturunan Hakos, dan keturunan Barzilai
  rationale: Pengulangan בְּנֵי dipertahankan untuk mencerminkan susunan daftar keluarga dalam bahasa Ibrani. Nama-nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת ... אִשָּׁה
  choice: Barzilai ini memperistri salah seorang anak perempuan
  rationale: Ungkapan לָקַח ... אִשָּׁה berarti mengambil seorang perempuan sebagai istri atau menikahinya. 'Memperistri' menyampaikan idiom itu dengan wajar, sedangkan 'salah seorang' menyatakan makna partitif מן pada מִבְּנוֹת.
- source_word: בַּרְזִלַּי הַגִּלְעָדִי
  choice: Barzilai, orang Gilead itu
  rationale: Adjektiva gentilika הַגִּלְעָדִי menunjukkan asal atau identitas dari Gilead. Bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: lalu disebut menurut nama keluarga mereka
  rationale: Bentuk nifal יִקָּרֵא bersifat pasif, 'disebut', dan frasa עַל שְׁמָם berkaitan dengan pemakaian nama mereka. Kata 'keluarga' memperjelas bahwa sufiks jamak merujuk kepada pihak keluarga Barzilai melalui anak-anak perempuannya, tanpa menentukan mekanisme sosialnya secara berlebihan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah 'keturunan' dipakai dalam daftar silsilah agar alami bagi pembaca umum. Klausa relatif yang berpotensi membingungkan dijadikan kalimat baru dengan 'Barzilai ini' untuk memperjelas anteseden, sementara bentuk pasif dan ketidakpastian mengenai cara pemakaian nama tetap dipertahankan.
