  text: הַ/לְוִיִּ֑ם בְּנֵי יֵשׁ֧וּעַ וְ/קַדְמִיאֵ֛ל לִ/בְנֵ֥י הוֹדַוְיָ֖ה שִׁבְעִ֥ים וְ/אַרְבָּעָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/040.yaml
  text: 'The Levites: the sons of Jeshua and Kadmiel[a], of the sons of Hodaviah, seventy-four.'
translation:
  language: id
  text: 'Orang-orang Lewi: keturunan Yesua dan Kadmiel, dari keturunan Hodawya[a], berjumlah tujuh puluh empat orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “Hodawya”; daftar sejajar dalam Nehemia 7:43 memakai bentuk “Hodewa”.
    reason: textual_variant
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: Orang-orang Lewi
  rationale: Bentuk tentu dan nama kelompok ini membuka kategori baru dalam daftar sensus. Bentuk jamak ini alami dalam bahasa Indonesia dan mempertahankan fungsi judul kategorinya.
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam konteks silsilah dan sensus, istilah ini dapat menunjuk anggota keluarga atau kaum, bukan hanya anak kandung langsung. 'Keturunan' menyampaikan cakupan itu secara alami.
- source_word: יֵשׁוּעַ
  choice: Yesua
  rationale: Nama Ibrani pascapembuangan ini ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: וְקַדְמִיאֵל
  choice: dan Kadmiel
  rationale: Konjungsi sederhana diikuti nama diri; nama tersebut dipertahankan melalui transliterasi.
- source_word: לִבְנֵי
  choice: dari keturunan
  rationale: Prefiks ל dipahami sebagai penanda hubungan silsilah atau penggolongan yang mengaitkan Yesua dan Kadmiel dengan kaum Hodawya. Terjemahan ini mempertahankan relasi tersebut tanpa memaksakan bahwa mereka anak langsung.
- source_word: הוֹדַוְיָה
  choice: Hodawya
  rationale: Teks Masoret Ezra memuat bentuk Hodawya; bentuk berbeda dalam daftar sejajar dicatat dalam catatan kaki, bukan menggantikan bacaan utama.
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: berjumlah tujuh puluh empat orang
  rationale: Angka diterjemahkan dengan susunan bilangan Indonesia modern; 'berjumlah' dan 'orang' memperjelas fungsi angka sebagai jumlah anggota kelompok.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Keturunan' dipilih alih-alih 'anak-anak' karena daftar ini mengacu pada kelompok keluarga atau kaum. Tanda catatan kaki ditempatkan sesudah nama Hodawya, yakni kata yang memiliki varian dalam daftar sejajar.
