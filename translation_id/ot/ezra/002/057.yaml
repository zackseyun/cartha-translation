  text: the sons of Shephatiah[a], the sons of Hattil, the sons of Pokereth-hazzebaim, the sons of Ami.
translation:
  language: id
  text: keturunan Sefaca, keturunan Hatil, keturunan Pokeret-Hazebaim[a], keturunan Ami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau mungkin: “Pokeret dari Zebaim”. Teks Ibrani dapat dipahami sebagai nama keluarga majemuk atau sebagai nama yang diikuti unsur penjelas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam konteks daftar keluarga atau kaum, istilah ini menunjuk pada anggota garis keturunan, bukan hanya anak laki-laki langsung. “Keturunan” alami dalam bahasa Indonesia dan sesuai dengan fungsi genealogisnya.
- source_word: שְׁפַטְיָה
  choice: Sefaca
  rationale: Nama diri Ibrani ditransliterasikan dalam bentuk yang lazim dan mudah dibaca oleh pembaca Indonesia.
- source_word: חַטִּיל
  choice: Hatil
  rationale: Nama orang atau kaum ditransliterasikan, bukan diterjemahkan.
- source_word: פֹּכֶרֶת הַצְּבָיִים
  choice: Pokeret-Hazebaim
  rationale: Kedua unsur dipertahankan sebagai nama majemuk dengan tanda hubung agar hubungan erat dalam teks Ibrani tetap terlihat tanpa memastikan secara berlebihan fungsi unsur kedua.
- source_word: אָמִי
  choice: Ami
  rationale: Nama orang atau kaum ditransliterasikan, bukan diterjemahkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan sesuai dengan bentuk daftar silsilah. “Keturunan” dipilih daripada “anak-anak lelaki” karena kelompok-kelompok ini merupakan keluarga atau kaum. Penanda catatan kaki ditempatkan pada nama yang memang memiliki ambiguitas tekstual.
