  text: the sons of Pahath-moab, of the sons of Jeshua and Joab, 2,812.
translation:
  language: id
  text: 'keturunan Pahat-Moab, dari keturunan Yesua dan Yoab: 2.812 orang.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar orang yang kembali, istilah ini menunjuk pada kelompok keluarga atau kaum, bukan hanya anak laki-laki langsung. “Keturunan” menyampaikan maksud itu secara wajar dalam bahasa Indonesia modern.
- source_word: פַחַת מוֹאָב
  choice: Pahat-Moab
  rationale: Nama diri ini ditransliterasikan, bukan diterjemahkan. Tanda hubung mempertahankan bentuk nama majemuknya.
- source_word: לִבְנֵי
  choice: dari keturunan
  rationale: Prefiks ל menghubungkan kelompok Pahat-Moab dengan garis keluarga Yesua dan Yoab. “Dari keturunan” mempertahankan hubungan tersebut tanpa memaksanya menjadi penjelasan yang sepenuhnya ekuatif.
- source_word: יֵשׁוּעַ
  choice: Yesua
  rationale: Bentuk pascapembuangan dari nama ini lazim ditransliterasikan sebagai “Yesua” dalam konteks Ezra–Nehemia.
- source_word: יוֹאָב
  choice: Yoab
  rationale: Transliterasi Indonesia yang lazim untuk nama pribadi ini.
- source_word: אַלְפַּיִם שְׁמֹנֶה מֵאוֹת וּשְׁנֵים עָשָׂר
  choice: '2.812'
  rationale: Bilangan Ibrani berarti dua ribu delapan ratus dua belas. Angka dan pemisah ribuan Indonesia sesuai untuk daftar sensus dan mudah dibaca.
