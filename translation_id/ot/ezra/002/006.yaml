translation_notes:
  register: Gaya berupa potongan daftar dipertahankan agar sesuai dengan konteks sensus. Kata “orang” ditambahkan secara wajar untuk memperjelas bahwa angka tersebut adalah jumlah anggota kelompok, tanpa mengubah isi sumber.
