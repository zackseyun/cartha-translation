lexical_decisions:
- source_word: סוּסֵיהֶם
  choice: kuda mereka
  rationale: Nomina סוּס berarti “kuda”; bentuk jamak dengan akhiran orang ketiga jamak maskulin menyatakan kepunyaan, yang secara alami diterjemahkan “kuda mereka”.
- source_word: שְׁבַע מֵאוֹת שְׁלֹשִׁים וְשִׁשָּׁה
  choice: tujuh ratus tiga puluh enam
  rationale: Rangkaian bilangan Ibrani ini menyatakan jumlah 736 secara langsung.
- source_word: פִּרְדֵיהֶם
  choice: bagal mereka
  rationale: פֶּרֶד secara khusus berarti “bagal”, yakni hewan hasil persilangan kuda dan keledai; bentuk dengan akhiran menyatakan kepunyaan mereka.
- source_word: מָאתַיִם אַרְבָּעִים וַחֲמִשָּׁה
  choice: dua ratus empat puluh lima
  rationale: Rangkaian bilangan tersebut menyatakan jumlah 245.
