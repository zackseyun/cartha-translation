  rationale: Nama diri ditransliterasikan menurut pelafalan Ibrani dan kebiasaan ejaan bahasa Indonesia.
- source_word: אַרְבָּעִים וּשְׁנָיִם
  choice: empat puluh dua orang
  rationale: Bilangan Ibrani berarti “empat puluh dua”; penambahan “orang” memperjelas bahwa yang dihitung adalah anggota kelompok dan wajar dalam daftar sensus bahasa Indonesia.
