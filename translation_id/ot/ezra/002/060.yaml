  text: 'the sons of Delaiah, the sons of Tobiah, the sons of Nekoda: six hundred fifty-two.'
translation:
  language: id
  text: 'Keturunan Delaya, keturunan Tobia, keturunan Nekoda: 652 orang.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam konteks daftar keluarga, bentuk konstruksi ini menunjuk pada anggota garis keluarga atau kaum, bukan hanya anak laki-laki langsung. 'Keturunan' menyampaikan maknanya secara alami dalam bahasa Indonesia.
- source_word: דְלָיָה
  choice: Delaya
  rationale: Nama diri ditransliterasikan ke dalam bentuk yang wajar bagi pembaca bahasa Indonesia.
- source_word: טוֹבִיָּה
  choice: Tobia
  rationale: Nama diri ditransliterasikan mengikuti ejaan Indonesia yang ringkas dan mudah dibaca.
- source_word: נְקוֹדָא
  choice: Nekoda
  rationale: Nama diri ditransliterasikan secara dekat dengan bentuk Ibraninya dan sesuai dengan pola ejaan Indonesia.
- source_word: שֵׁשׁ מֵאוֹת חֲמִשִּׁים וּשְׁנָיִם
  choice: 652 orang
  rationale: Bilangan Ibrani berarti enam ratus lima puluh dua. Angka ditulis dengan digit agar daftar sensus ringkas dan jelas; 'orang' ditambahkan secara wajar untuk memperjelas bahwa jumlah ini menghitung anggota kelompok.
