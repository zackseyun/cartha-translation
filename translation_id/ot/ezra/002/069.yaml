  text: כְּ/כֹחָ֗/ם נָתְנוּ֮ לְ/אוֹצַ֣ר הַ/מְּלָאכָה֒ זָהָ֗ב דַּרְכְּמוֹנִים֙ שֵׁשׁ רִבֹּ֣אות וָ/אֶ֔לֶף וְ/כֶ֕סֶף מָנִ֖ים חֲמֵ֣שֶׁת אֲלָפִ֑ים וְ/כָתְנֹ֥ת כֹּהֲנִ֖ים מֵאָֽה־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/069.yaml
  text: 'According to their ability they gave to the treasury for the work: 61,000 gold darics[a], 5,000 minas of silver[b], and 100 priests’ tunics.'
translation:
  language: id
  text: 'Sesuai dengan kemampuan mereka, mereka memberikan kepada perbendaharaan untuk pekerjaan itu: 61.000 darik emas[a], 5.000 mina perak[b], dan 100 tunik para imam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “koin emas”; istilah Ibrani ini secara khusus menunjuk pada darik Persia.
    reason: lexical_alternative
  - marker: b
    text: Mina adalah satuan berat dan nilai uang pada zaman kuno.
    reason: cultural_note
lexical_decisions:
- source_word: כְּכֹחָם
  choice: Sesuai dengan kemampuan mereka
  rationale: Ungkapan ini menyatakan ukuran atau proporsi pemberian berdasarkan kemampuan masing-masing; pilihan ini alami dalam bahasa Indonesia dan mempertahankan makna tersebut.
- source_word: נָתְנוּ
  choice: mereka memberikan
  rationale: Menerjemahkan secara langsung verba umum נתן tanpa menambahkan nuansa yang tidak dinyatakan oleh teks.
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: kepada perbendaharaan untuk pekerjaan itu
  rationale: אוֹצָר menunjuk pada perbendaharaan atau tempat penyimpanan, sedangkan הַמְּלָאכָה dalam konteks ini adalah pekerjaan pembangunan; susunan ini menyampaikan bahwa dana tersebut diperuntukkan bagi pekerjaan itu.
- source_word: דַּרְכְּמוֹנִים
  choice: darik
  rationale: Istilah pinjaman Persia ini secara khusus menunjuk pada koin emas darik; bentuk historisnya dipertahankan dan dijelaskan dalam catatan kaki.
- source_word: שֵׁשׁ רִבֹּאות וָאֶלֶף
  choice: '61.000'
  rationale: Secara harfiah berarti enam puluh ribu ditambah seribu; penulisan angka mengikuti kaidah angka bahasa Indonesia dan memudahkan pembacaan daftar.
- source_word: מָנִים
  choice: mina
  rationale: מָנֶה adalah satuan kuno untuk berat dan nilai uang; istilah historisnya dipertahankan alih-alih diganti dengan padanan modern yang tidak tepat.
- source_word: חֲמֵשֶׁת אֲלָפִים
  choice: '5.000'
  rationale: Angka dinyatakan secara ringkas dan konsisten dalam daftar sumbangan.
- source_word: כָתְנֹת כֹּהֲנִים
  choice: tunik imam
  rationale: כָתְנֹת menunjuk pada tunik atau pakaian panjang, bukan pakaian keimaman secara umum. Frasa ringkas ini mempertahankan hubungan genitif yang dapat berarti tunik milik atau diperuntukkan bagi para imam.
- source_word: מֵאָה
  choice: '100'
  rationale: Penulisan angka konsisten dengan unsur lain dalam daftar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya lugas dan bermartabat. Istilah historis “darik” dan “mina” dipertahankan demi ketepatan, lalu dijelaskan melalui catatan kaki.
