base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/063.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b][c].
translation:
  language: id
  text: Lalu gubernur[a] berkata kepada mereka bahwa mereka tidak boleh makan dari bagian-bagian persembahan yang mahakudus[b] sampai tampil seorang imam dengan Urim dan Tumim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tirsyata”, sebuah gelar administratif Persia.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah bagian-bagian persembahan yang dianggap paling kudus dan diperuntukkan bagi para imam, bukan ruang Mahakudus.
    reason: cultural_note
  - marker: c
    text: Urim dan Tumim merupakan sarana kudus untuk meminta petunjuk melalui imam; bentuk dan tata cara penggunaannya tidak diketahui dengan pasti.
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: gubernur
  rationale: Istilah ini adalah gelar administratif Persia. Padanan 'gubernur' menyampaikan fungsinya secara jelas dalam bahasa Indonesia modern, sementara bentuk tradisionalnya dicatat dalam catatan kaki.
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: bahwa mereka tidak boleh makan
  rationale: Ungkapan ini melaporkan isi larangan gubernur. 'Tidak boleh makan' terdengar alami dan mempertahankan daya perintah tidak langsung.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: dari persembahan-persembahan yang mahakudus
  rationale: Dalam konteks penetapan kelayakan imam, frasa ini mengacu pada bagian makanan dari persembahan yang berstatus paling kudus, bukan pada ruang Mahakudus. 'Persembahan-persembahan' memperjelas rujukan yang dapat dimakan, sedangkan 'mahakudus' mempertahankan daya superlatifnya.
- source_word: עַד עֲמֹד כֹּהֵן
  choice: sampai tampil seorang imam
  rationale: Konstruksi dengan עַד menunjuk pada batas waktu mendatang. 'Tampil' secara alami menyatakan hadirnya seorang imam yang memenuhi fungsi yang diperlukan tanpa mengandaikan bahwa ia bangkit secara harfiah.
- source_word: לְאוּרִים וּלְתֻמִּים
  choice: dengan Urim dan Tumim
  rationale: Nama teknis kultis ini ditransliterasikan karena bentuk dan makna tepatnya tidak pasti. Kata depan diterjemahkan 'dengan' untuk menyatakan imam yang diperlengkapi guna melakukan penyelidikan melalui sarana tersebut.
theological_decisions:
- issue: Rujukan קֹדֶשׁ הַקֳּדָשִׁים dalam konteks ini
  choice: Bagian-bagian persembahan mahakudus yang boleh dimakan imam
  alternative: Ruang Mahakudus di dalam tempat kudus
  rationale: Konteksnya adalah status keimaman yang dipersoalkan dan izin untuk makan. Karena larangannya menyangkut makan, frasa ini menunjuk pada makanan kudus bagi imam, bukan akses ke suatu ruang.
- issue: Penyajian Urim dan Tumim
  choice: Mempertahankan nama teknis melalui transliterasi
  alternative: Menerjemahkannya secara etimologis, misalnya 'terang dan kesempurnaan'
  rationale: Wujud serta tata cara penggunaannya tidak diketahui dengan pasti. Transliterasi mempertahankan kekhususan historis dan ketidakpastian yang ada tanpa memaksakan tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan corak keputusan administratif, tetapi memakai ungkapan yang mudah dipahami. Ejaan 'Tumim' dipilih sebagai transliterasi yang wajar dalam bahasa Indonesia.
