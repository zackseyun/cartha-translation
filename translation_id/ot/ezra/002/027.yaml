  rationale: Bentuk konstruksi jamak dari אִישׁ menunjuk kepada laki-laki atau wakil keluarga yang terkait dengan tempat berikutnya. Dalam daftar sensus bahasa Indonesia, “orang-orang” paling alami; pengulangan “orang” setelah jumlah tetap menandai bahwa yang dihitung adalah manusia.
- source_word: מִכְמָס
  choice: Mikmas
  rationale: Nama tempat ditransliterasikan dari bentuk Ibrani. Ejaan “Mikmas” dekat dengan pelafalan sumber dan wajar dalam bahasa Indonesia.
- source_word: מֵאָה עֶשְׂרִים וּשְׁנָיִם
  choice: seratus dua puluh dua
  rationale: Urutan bilangan Ibrani bersifat aditif, yaitu 100 + 20 + 2, dan diterjemahkan dengan bentuk bilangan baku serta alami dalam bahasa Indonesia.
