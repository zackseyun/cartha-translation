  text: the sons of Rezin[a], the sons of Nekoda, the sons of Gazzam;
translation:
  language: id
  text: keturunan Rezin[a], keturunan Nekoda, keturunan Gazam;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Rezin”; demikian juga untuk setiap pengulangan ungkapan ini. Dalam konteks ini, ungkapan tersebut dapat menunjuk pada keturunan, garis keluarga, atau kaum, bukan hanya anak laki-laki langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar kaum yang pulang, bentuk jamak konstruksi dari בֵּן menunjuk pada anggota garis keluarga atau kaum, bukan semata-mata anak laki-laki langsung. “Keturunan” menyampaikan maksud itu secara alami dalam bahasa Indonesia modern.
- source_word: רְצִין
  choice: Rezin
  rationale: Nama diri ditransliterasikan. Bentuk “Rezin” sudah dikenal dalam tradisi penamaan Alkitab bahasa Indonesia dan cukup mewakili bentuk Ibrani.
- source_word: נְקוֹדָא
  choice: Nekoda
  rationale: Nama diri ditransliterasikan sesuai bentuk vokal dalam teks Masoret.
- source_word: גַזָּם
  choice: Gazam
  rationale: Nama diri ditransliterasikan sebagai “Gazam”; penggandaan konsonan akibat dagesh tidak perlu ditampilkan dalam ejaan Indonesia.
