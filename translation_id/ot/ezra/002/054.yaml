lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar orang yang kembali di Ezra, bentuk ini memperkenalkan kelompok keluarga atau kaum. 'Keturunan' menyampaikan fungsi genealogisnya secara alami dalam bahasa Indonesia tanpa mengharuskan bahwa mereka semua adalah anak kandung langsung.
- source_word: נְצִיחַ
  choice: Neziah
  rationale: Nama diri ini ditransliterasikan, bukan diterjemahkan. Bentuk 'Neziah' cukup dekat dengan bunyi Ibrani dan mempertahankan konsonan akhir yang lazim diwakili dengan h.
- source_word: חֲטִיפָא
  choice: Hatifa
  rationale: Nama diri ini ditransliterasikan menurut ejaan Indonesia; huruf Ibrani pe tanpa dagesh di sini dilafalkan sebagai /f/, sehingga 'Hatifa' lebih sesuai daripada bentuk berpengaruh ejaan Inggris 'Hatipha'.
