  rationale: Nama diri ditransliterasikan mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: פָסֵחַ
  choice: Paseah
  rationale: Nama diri ditransliterasikan sebagai “Paseah”, dengan mempertahankan bentuk nama Ibrani secara wajar dalam ejaan Indonesia.
- source_word: בֵסָי
  choice: Besai
  rationale: Nama diri ditransliterasikan sebagai “Besai”; yod akhir direpresentasikan dengan bunyi -i sesuai bentuk yang lazim.
