lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar orang yang kembali di Ezra, bentuk ini memperkenalkan kelompok keluarga atau kaum. “Keturunan” terdengar alami dalam bahasa Indonesia dan tidak membatasi maknanya pada anak laki-laki langsung.
- source_word: מַגְבִּישׁ
  choice: Magbis
  rationale: Nama ini dialihaksarakan dari bentuk Ibrani. Identitasnya sebagai nama leluhur atau nama tempat tidak pasti, sehingga teks utama mempertahankan ambiguitas itu.
- source_word: מֵאָה חֲמִשִּׁים וְשִׁשָּׁה
  choice: seratus lima puluh enam orang
  rationale: Rangkaian bilangan Ibrani berjumlah 156. Kata “orang” ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas bahwa angka tersebut adalah jumlah anggota kelompok.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat, sesuai bentuk daftar sensus. Tanda titik dua memperjelas hubungan antara nama kelompok dan jumlahnya tanpa menambah tafsiran.
