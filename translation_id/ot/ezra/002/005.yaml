lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam konteks daftar keluarga atau kaum, bentuk ini menunjuk pada kelompok yang berasal dari seorang leluhur bernama. “Keturunan” menyampaikan makna kolektif tersebut secara alami dalam bahasa Indonesia dan menghindari kesan bahwa semuanya adalah anak laki-laki langsung Arah.
- source_word: אָרַח
  choice: Arah
  rationale: Nama pribadi atau leluhur keluarga ini ditransliterasikan sesuai bentuk Ibrani dan kebiasaan penamaan Alkitab dalam bahasa Indonesia.
- source_word: שְׁבַע מֵאוֹת חֲמִשָּׁה וְשִׁבְעִים
  choice: tujuh ratus tujuh puluh lima
  rationale: Ungkapan bilangan Ibrani berjumlah 700 + 5 + 70, yaitu 775. Bilangan ditulis dengan kata-kata agar selaras dengan gaya sastra daftar.
- source_word: בְּנֵי ... שְׁבַע מֵאוֹת חֲמִשָּׁה וְשִׁבְעִים
  choice: keturunan Arah, tujuh ratus tujuh puluh lima orang
  rationale: Kata “orang” ditambahkan sebagai pelengkap idiomatis yang tersirat dalam daftar sensus, sehingga jumlah anggota kelompok terbaca jelas dan alami tanpa mengubah isi.
