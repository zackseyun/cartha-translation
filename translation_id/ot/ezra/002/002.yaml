id: EZR.2.2
reference: Ezra 2:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲשֶׁר בָּ֣אוּ עִם זְרֻבָּבֶ֗ל יֵשׁ֡וּעַ נְ֠חֶמְיָה שְׂרָיָ֨ה רְֽעֵלָיָ֜ה מָרְדֳּכַ֥י בִּלְשָׁ֛ן מִסְפָּ֥ר בִּגְוַ֖י רְח֣וּם בַּעֲנָ֑ה מִסְפַּ֕ר אַנְשֵׁ֖י עַ֥ם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/002.yaml
  text: 'who came with Zerubbabel: Jeshua[a], Nehemiah, Seraiah, Reelaiah, Mordecai, Bilshan, Mispar, Bigvai, Rehum, and Baanah[d][c][b]. The number of the men of the people of Israel:'
translation:
  language: id
  text: 'yang datang bersama Zerubabel: Yesua, Nehemia, Seraya, Reelaya[a], Mordekhai, Bilsan, Mispar[b], Bigwai, Rehum[c], dan Baana. Jumlah laki-laki dari umat Israel[d]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam daftar sejajar di Nehemia 7:7, “Reelaya” disebut “Raamya.”
    reason: alternative_reading
  - marker: b
    text: Dalam daftar sejajar di Nehemia 7:7, “Mispar” disebut “Misperet.”
    reason: alternative_reading
  - marker: c
    text: Dalam daftar sejajar di Nehemia 7:7, “Rehum” disebut “Nehum.”
    reason: alternative_reading
  - marker: d
    text: Frasa ini memperkenalkan perincian jumlah orang yang dimulai pada ayat berikutnya.
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Partikel relatif ini melanjutkan daftar dari ayat sebelumnya; “yang” merupakan penghubung alami dalam bahasa Indonesia tanpa menambahkan unsur yang tidak tersurat.
- source_word: בָּאוּ
  choice: datang
  rationale: Bentuk qal perfektum jamak dari בוא secara langsung berarti “datang.” Konteksnya memang kepulangan dari pembuangan, tetapi verba ini sendiri tidak menyatakan “kembali.”
- source_word: עִם
  choice: bersama
  rationale: Preposisi ini menyatakan penyertaan; “bersama” alami dan tepat dalam konteks daftar orang.
- source_word: זְרֻבָּבֶל
  choice: Zerubabel
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan cukup dekat dengan nama Ibrani.
- source_word: יֵשׁוּעַ
  choice: Yesua
  rationale: Transliterasi bentuk Ibrani pascapembuangan ini mempertahankan perbedaannya dari bentuk nama “Yosua.”
- source_word: נְחֶמְיָה
  choice: Nehemia
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Teks Masoret membaca Seraya; bentuk ini dipertahankan dalam teks utama.
- source_word: רְעֵלָיָה
  choice: Reelaya
  rationale: Transliterasi yang mewakili bentuk dalam WLC; bentuk berbeda pada daftar sejajar dicatat dalam catatan kaki.
- source_word: מָרְדֳּכַי
  choice: Mordekhai
  rationale: Transliterasi Indonesia yang mencerminkan konsonan akhir nama Ibrani secara jelas.
- source_word: בִּלְשָׁן
  choice: Bilsan
  rationale: Transliterasi langsung yang sesuai dengan ejaan bahasa Indonesia.
- source_word: מִסְפָּר
  choice: Mispar
  rationale: Dalam posisi ini kata tersebut adalah nama diri, bukan nomina umum “jumlah”; bentuk dalam daftar sejajar dicatat di catatan kaki.
- source_word: בִּגְוַי
  choice: Bigwai
  rationale: Transliterasi yang dekat dengan bentuk Ibrani dan mudah dibaca dalam bahasa Indonesia.
- source_word: רְחוּם
  choice: Rehum
  rationale: Bentuk nama dalam teks Masoret dipertahankan; variasi pada Nehemia 7:7 dicatat.
- source_word: בַּעֲנָה
  choice: Baana
  rationale: Transliterasi alami dalam ejaan Indonesia.
- source_word: מִסְפַּר אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: Jumlah laki-laki dari umat Israel
  rationale: מִסְפַּר berarti “jumlah,” אַנְשֵׁי menunjuk para laki-laki, dan konstruksi ini menjadi judul pengantar bagi perincian sensus yang menyusul.
