  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: Orang-orang
  rationale: Bentuk jamak konstruksi dari אִישׁ memperkenalkan kelompok yang berasal dari kedua kota dalam daftar sensus. Dalam bahasa Indonesia, “orang-orang” merupakan ungkapan yang paling alami dan tidak memaksakan keterangan gender atau rumah tangga yang tidak perlu dinyatakan dalam konteks ini.
- source_word: בֵית אֵל
  choice: Betel
  rationale: Nama tempat ini ditransliterasikan menurut bentuk yang sudah lazim dalam bahasa Indonesia.
- source_word: וְהָעָי
  choice: dan Ai
  rationale: Konjungsi diterjemahkan “dan”; artikel Ibrani pada nama tempat tidak perlu dinyatakan dalam bahasa Indonesia.
- source_word: מָאתַיִם עֶשְׂרִים וּשְׁלֹשָׁה
  choice: 223 orang
  rationale: Bilangan kardinal diterjemahkan secara langsung. Kata “orang” sesudah angka memperjelas bahwa yang dihitung adalah manusia dan menghasilkan susunan Indonesia yang alami.
