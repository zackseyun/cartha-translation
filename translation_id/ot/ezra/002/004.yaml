  choice: 372 orang
  rationale: Bilangan Ibrani berarti tiga ratus tujuh puluh dua. Angka ditulis dengan digit agar daftar sensus ringkas dan mudah dibaca; “orang” ditambahkan secara wajar untuk memperjelas bahwa angka tersebut menyatakan jumlah anggota keluarga.
