  text: the sons of Lebanah[a], the sons of Hagabah, the sons of Akkub.
translation:
  language: id
  text: keturunan Lebana[a], keturunan Hagaba, keturunan Akub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak laki-laki Lebana”; ungkapan Ibrani ini dapat menunjuk pada garis keluarga atau kelompok kaum, bukan hanya anak laki-laki langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Secara harfiah berarti “anak-anak laki-laki dari”, tetapi dalam daftar kepulangan ini menunjuk pada garis keluarga atau kelompok kaum. “Keturunan” menyampaikan fungsi istilah itu secara alami dalam bahasa Indonesia, sementara pengulangannya mempertahankan pola daftar Ibrani.
- source_word: לְבָנָה
  choice: Lebana
  rationale: Nama diri ditransliterasikan sesuai pelafalan Ibrani dan kaidah nama Alkitab dalam bahasa Indonesia; huruf he pada akhir nama tidak perlu diwujudkan sebagai bunyi tersendiri.
- source_word: חֲגָבָה
  choice: Hagaba
  rationale: Nama diri ditransliterasikan secara wajar ke dalam bahasa Indonesia berdasarkan bentuk Ibrani.
- source_word: עַקּוּב
  choice: Akub
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim; konsonan qoph rangkap direpresentasikan secara alami dengan k.
