  yaml_path: translation/ot/ezra/002/047.yaml
  text: the sons of Giddel[a], the sons of Gahar, the sons of Reaiah.
translation:
  language: id
  text: keturunan Gidel, keturunan Gahar, dan keturunan Reaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar orang yang kembali, bentuk konstruksi jamak ini menunjuk pada anggota keluarga atau kaum yang berasal dari tokoh bernama; “keturunan” lebih alami dan tepat dalam bahasa Indonesia daripada “anak-anak” yang dapat menyiratkan anak kandung langsung.
- source_word: גִדֵּל
  choice: Gidel
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani dengan ejaan yang wajar bagi pembaca Indonesia; konsonan rangkap tidak perlu dipertahankan karena tidak membedakan pelafalan dalam bahasa Indonesia.
- source_word: גַחַר
  choice: Gahar
  rationale: Nama diri ditransliterasikan sesuai bentuk konsonan dan vokal dalam teks Ibrani.
- source_word: רְאָיָה
  choice: Reaya
  rationale: Nama diri ditransliterasikan dari rəʾāyāh; bentuk “Reaya” mencerminkan susunan vokal dan konsonannya secara wajar dalam ejaan Indonesia.
theological_decisions: []
