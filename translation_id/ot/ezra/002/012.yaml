lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam konteks daftar orang yang kembali, bentuk konstruksi jamak ini menunjuk pada anggota garis keluarga atau kaum. “Keturunan” menyampaikan fungsi genealogisnya secara alami dalam bahasa Indonesia tanpa membatasi mereka sebagai anak kandung langsung.
- source_word: עַזְגָּד
  choice: Azgad
  rationale: Nama diri atau nama keluarga ini ditransliterasikan, bukan diterjemahkan.
- source_word: אֶלֶף מָאתַיִם עֶשְׂרִים וּשְׁנָיִם
  choice: 1.222 orang
  rationale: Rangkaian bilangan Ibrani berjumlah 1.222. Angka Arab dengan tanda titik sebagai pemisah ribuan mengikuti kaidah penulisan Indonesia; “orang” ditambahkan secara wajar untuk memperjelas bahwa angka tersebut adalah jumlah anggota kelompok.
