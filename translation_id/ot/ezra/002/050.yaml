  text: keturunan Asnah, keturunan Meunim[a], dan keturunan Nefisim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Meunim juga dapat dialihaksarakan sebagai “Maonim”.
