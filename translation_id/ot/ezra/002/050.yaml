lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar kaum yang kembali dan daftar silsilah, kata ini memperkenalkan kelompok atau kaum yang dinamai menurut leluhur atau nama asalnya. “Keturunan” alami dalam bahasa Indonesia dan tidak membatasi maknanya pada anak laki-laki langsung.
- source_word: אַסְנָה
  choice: Asna
  rationale: Nama diri atau nama kaum dialihaksarakan sesuai bentuk Ibrani Masoret.
- source_word: מעינים
  choice: Meunim
  rationale: Nama kelompok ini dialihaksarakan sebagai “Meunim”, bentuk yang lazim untuk nama tersebut; variasi “Maonim” dicatat dalam catatan kaki.
- source_word: נפיסים
  choice: Nefisim
  rationale: Nama kelompok dialihaksarakan berdasarkan bentuk Masoret; variasi “Nefusim” dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan sesuai gaya daftar silsilah. “Keturunan” dipilih daripada “anak-anak lelaki” karena yang dimaksud ialah kelompok atau kaum, bukan semata-mata putra langsung. Penanda catatan kaki ditempatkan pada nama yang memiliki variasi alih aksara.
