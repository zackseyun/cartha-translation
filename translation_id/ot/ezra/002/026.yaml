  text: the sons of Ramah and Geba[a], six hundred twenty-one.
translation:
  language: id
  text: 'Keturunan Rama dan Geba[a]: 621 orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Rama dan Geba”. Ungkapan Ibrani “anak-anak” dalam daftar sensus ini dapat menunjuk pada kelompok keluarga atau masyarakat yang lebih luas, bukan hanya anak kandung langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar orang yang kembali ini, istilah Ibrani tersebut dapat menunjuk pada kelompok keluarga atau penduduk suatu tempat, bukan hanya anak laki-laki langsung. 'Keturunan' menyampaikan makna idiomatis itu secara alami dalam bahasa Indonesia.
- source_word: הָרָמָה
  choice: Rama
  rationale: Nama tempat ini ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וָגָבַע
  choice: dan Geba
  rationale: Waw diterjemahkan 'dan', sedangkan nama tempatnya ditransliterasikan sebagai 'Geba'.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וְאֶחָד
  choice: 621 orang
  rationale: Bilangan sensus diterjemahkan dengan angka agar daftar mudah dibaca; 'orang' ditambahkan secara wajar untuk memperjelas bahwa angka itu adalah jumlah anggota kelompok.
