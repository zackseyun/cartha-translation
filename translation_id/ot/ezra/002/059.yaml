  text: וְ/אֵ֗לֶּה הָֽ/עֹלִים֙ מִ/תֵּ֥ל מֶ֨לַח֙ תֵּ֣ל חַרְשָׁ֔א כְּר֥וּב אַדָּ֖ן אִמֵּ֑ר וְ/לֹ֣א יָֽכְל֗וּ לְ/הַגִּ֤יד בֵּית אֲבוֹתָ/ם֙ וְ/זַרְעָ֔/ם אִ֥ם מִ/יִּשְׂרָאֵ֖ל הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/059.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addan, and Immer, but they were not able to declare their fathers’ house and their offspring, whether they were from Israel.
translation:
  language: id
  text: Inilah orang-orang yang datang dari Tel-Melah, Tel-Harsa, Kerub, Adan, dan Imer. Namun, mereka tidak dapat menyatakan kaum keluarga dan keturunan mereka[a], apakah mereka termasuk orang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah para ayah mereka dan keturunan mereka.” Ungkapan Ibrani ini menunjuk pada kaum keluarga menurut garis ayah serta keturunan mereka dalam pencatatan silsilah.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹלִים
  choice: orang-orang yang datang
  rationale: Dalam konteks daftar kepulangan pascapembuangan, verba עלה secara harfiah menggambarkan gerak 'naik'. Bahasa Indonesia lebih alami memakai 'datang' di sini, sementara konteks tetap menunjukkan bahwa mereka termasuk rombongan yang pulang.
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדָּן אִמֵּר
  choice: dari Tel-Melah, Tel-Harsa, Kerub, Adan, dan Imer
  rationale: Nama-nama tempat atau kelompok ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia, bukan diterjemahkan.
- source_word: לֹא יָכְלוּ לְהַגִּיד
  choice: tidak dapat menyatakan
  rationale: Ungkapan ini menyampaikan ketidakmampuan mereka memberikan keterangan dalam konteks pencatatan silsilah; 'menyatakan' mempertahankan nuansa administratif tanpa menambahkan gagasan pembuktian yang tidak dinyatakan secara eksplisit.
- source_word: בֵּית אֲבוֹתָם
  choice: kaum leluhur mereka
  rationale: Istilah teknis ini menunjuk pada kelompok keluarga berdasarkan garis ayah. 'Kaum leluhur' mempertahankan sifat kolektifnya dan lebih alami daripada terjemahan harfiah 'rumah para ayah'.
- source_word: וְזַרְעָם
  choice: dan garis keturunan mereka
  rationale: זֶרַע di sini merujuk pada asal-usul atau silsilah genealogis, bukan benih secara harfiah. 'Garis keturunan' sesuai dengan konteks pemeriksaan status Israel.
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: apakah mereka berasal dari Israel
  rationale: Frasa ini menyatakan ketidakpastian mengenai asal-usul Israel mereka. 'Berasal dari Israel' menjaga ambiguitas antara keturunan dan keanggotaan tanpa mempersempitnya secara doktrinal.
