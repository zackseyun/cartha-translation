  text: the sons of Hagab[a], the sons of Shamlai, the sons of Hanan.
translation:
  language: id
  text: keturunan Hagab, keturunan Shamlai[a], keturunan Hanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Shamlai: dalam beberapa terjemahan dan tradisi penamaan terkait, nama ini juga ditulis “Shalmai”.'
