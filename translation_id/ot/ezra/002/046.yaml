lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar keluarga orang-orang yang kembali, bentuk konstruksi ini menunjuk pada anggota garis keluarga atau kelompok keturunan. “Keturunan” terdengar alami dalam bahasa Indonesia dan menghindari kesan bahwa semuanya adalah anak kandung langsung.
- source_word: חָגָב
  choice: Hagab
  rationale: Nama diri atau nama leluhur suatu kelompok keluarga; ditransliterasikan dari bahasa Ibrani.
- source_word: שמלי
  choice: Shamlai
  rationale: Nama diri yang ditransliterasikan sesuai bentuk konsonantal teks Ibrani. Bentuk “Shalmai” dikenal sebagai alternatif dalam sejumlah tradisi terjemahan dan dicatat dalam catatan kaki.
- source_word: חָנָן
  choice: Hanan
  rationale: Nama diri atau nama leluhur suatu kelompok keluarga; ditransliterasikan dari bahasa Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Pengulangan “keturunan” mempertahankan pola daftar silsilah Ibrani, sedangkan nama-nama ditransliterasikan. Penanda catatan kaki ditempatkan sesudah nama yang dibahas.
