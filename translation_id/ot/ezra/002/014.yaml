- source_word: אַלְפַּיִם חֲמִשִּׁים וְשִׁשָּׁה
  choice: 2.056 orang
  rationale: Rangkaian bilangan Ibrani secara harfiah berarti “dua ribu, lima puluh, dan enam”; disajikan sebagai jumlah utuh menurut kaidah penulisan angka bahasa Indonesia. Kata “orang” ditambahkan secara wajar karena konteksnya adalah daftar jumlah anggota kelompok.
