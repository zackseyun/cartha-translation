  choice: Seluruh jemaah itu
  rationale: Frasa ini menyatakan keseluruhan komunitas yang berkumpul. 'Jemaah' alami dalam bahasa Indonesia dan tidak harus menunjuk pada lembaga keagamaan tertentu.
