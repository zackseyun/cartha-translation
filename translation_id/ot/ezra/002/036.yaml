  text: הַֽ/כֹּהֲנִ֑ים בְּנֵ֤י יְדַֽעְיָה֙ לְ/בֵ֣ית יֵשׁ֔וּעַ תְּשַׁ֥ע מֵא֖וֹת שִׁבְעִ֥ים וּ/שְׁלֹשָֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/036.yaml
  text: 'The priests: the sons of Jedaiah[a], of the house of Jeshua[b], 973.'
translation:
  language: id
  text: 'Para imam: keturunan Yedaya[a], dari keluarga Yesua[b], 973 orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Yedaya”; ungkapan ini lazim dipakai untuk para keturunan atau anggota suatu garis keluarga.'
    reason: lexical_alternative
  - marker: b
    text: Yesua adalah bentuk nama pribadi yang dipakai pada masa sesudah pembuangan dan berkaitan dengan nama Yosua.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: Para imam
  rationale: Nomina jamak tertentu ini secara langsung berarti para imam dan dalam konteks daftar memperkenalkan kelompok imam yang dihitung.
- source_word: בְּנֵי
  choice: keturunan
  rationale: Secara harfiah berarti 'anak-anak lelaki', tetapi dalam daftar silsilah dapat menunjuk kepada para keturunan atau anggota garis keluarga; 'keturunan' paling alami dan tidak menyiratkan bahwa semuanya anak kandung langsung.
- source_word: יְדַעְיָה
  choice: Yedaya
  rationale: Nama diri Ibrani ditransliterasikan dengan bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: לְבֵית
  choice: dari keluarga
  rationale: Frasa ini menandai afiliasi dengan suatu rumah atau garis keluarga; 'dari keluarga' menyampaikan fungsi genealogisnya secara alami.
- source_word: יֵשׁוּעַ
  choice: Yesua
  rationale: Transliterasi ini membedakan bentuk nama pascapembuangan יֵשׁוּעַ sekaligus mempertahankan bentuk yang dekat dengan bahasa sumber.
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: 973 orang
  rationale: Rangkaian bilangan Ibrani berjumlah 973; angka dipakai agar daftar mudah dibaca, dan 'orang' ditambahkan secara wajar untuk memperjelas satuan hitungan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat untuk daftar sensus. Tanda titik dua mempertahankan fungsi judul kelompok, sedangkan pilihan 'keturunan' dan 'keluarga' membuat hubungan genealogis jelas bagi pembaca modern tanpa menambah rincian yang tidak terdapat dalam teks.
