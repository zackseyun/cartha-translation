  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Harim.” Ungkapan Ibrani ini dapat menunjuk pada garis keturunan atau kelompok keluarga yang lebih luas, bukan hanya anak-anak langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar sensus Ezra, istilah ini menunjuk pada kelompok keluarga atau garis keturunan, bukan hanya anak laki-laki langsung. Pilihan ini alami dan tidak menimbulkan kesan bahwa 1.017 orang tersebut semuanya putra langsung Harim.
- source_word: חָרִם
  choice: Harim
  rationale: Nama diri atau nama keluarga ini ditransliterasikan, bukan diterjemahkan.
- source_word: אֶלֶף וְשִׁבְעָה עָשָׂר
  choice: 1.017 orang
  rationale: Bilangan Ibrani berarti 'seribu tujuh belas'. Angka ditulis dengan digit sesuai kelaziman daftar sensus dalam bahasa Indonesia; 'orang' ditambahkan untuk memperjelas bahwa angka tersebut menyatakan jumlah anggota kelompok.
