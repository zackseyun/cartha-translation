  yaml_path: translation/ot/ezra/002/052.yaml
  text: the sons of Bazluth[a], the sons of Mehida, the sons of Harsha—
translation:
  language: id
  text: keturunan Bazlut[a], keturunan Mehida, keturunan Harsa—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak” pada setiap kemunculannya; rumus daftar Ibrani בְּנֵי sering menunjuk pada garis keluarga atau kaum, bukan hanya anak-anak langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar orang yang kembali ini, bentuk בְּנֵי menunjuk pada anggota garis keluarga atau kaum, bukan hanya anak laki-laki langsung. “Keturunan” menyampaikan fungsi rumus daftar itu secara alami dan tepat dalam bahasa Indonesia.
- source_word: בַצְלוּת
  choice: Bazlut
  rationale: Nama diri ditransliterasikan berdasarkan bentuk Ibrani dan disesuaikan dengan ejaan Indonesia; huruf akhir taw diwakili dengan “t”.
- source_word: מְחִידָא
  choice: Mehida
  rationale: Nama diri ditransliterasikan dalam bentuk yang mudah dibaca dalam bahasa Indonesia; huruf het diwakili secara sederhana dengan “h”.
- source_word: חַרְשָׁא
  choice: Harsa
  rationale: Nama diri ditransliterasikan sesuai ejaan Indonesia; bunyi shin diwakili dengan “s”, sedangkan alef akhir tidak diberi lambang tersendiri.
