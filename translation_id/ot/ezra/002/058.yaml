  yaml_path: translation/ot/ezra/002/058.yaml
  text: All the temple servants and the sons of Solomon’s servants were three hundred ninety-two[a].
translation:
  language: id
  text: Seluruh pelayan Bait Allah[a] dan keturunan para hamba Salomo berjumlah 392 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani נְתִינִים (netinim), istilah teknis bagi suatu golongan yang ditugaskan untuk pelayanan Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Seluruh
  rationale: Kata ini mencakup jumlah lengkap dari kedua kelompok yang disebutkan dan diterjemahkan secara alami sebagai “seluruh”.
- source_word: הַנְּתִינִים
  choice: pelayan Bait Allah
  rationale: נְתִינִים adalah istilah teknis pascapembuangan bagi suatu golongan yang ditugaskan untuk pelayanan Bait Allah. Terjemahan fungsional ini lebih mudah dipahami daripada transliterasi “kaum Netinim”.
- source_word: וּבְנֵי
  choice: dan keturunan
  rationale: Secara harfiah berarti “dan anak-anak lelaki,” tetapi dalam daftar administratif-genealogis ini menunjuk kepada kelompok berdasarkan garis keturunan; “keturunan” terdengar alami dan tidak mempersempitnya pada satu generasi.
- source_word: עַבְדֵי
  choice: para hamba
  rationale: עֶבֶד dapat berarti hamba atau budak. Di sini ungkapan tersebut merupakan nama kelompok tradisional, sehingga “hamba” mempertahankan rentang makna sumber tanpa menegaskan status perbudakan yang tidak ditonjolkan konteks.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: 392 orang
  rationale: Angka diterjemahkan secara langsung; penambahan “orang” membuat jumlah manusia yang dimaksud jelas dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Bait Allah” dipilih sebagai sebutan yang bermartabat dan lazim untuk kompleks ibadah di Yerusalem; susunan “berjumlah 392 orang” menyampaikan predikat bilangan Ibrani secara alami.
