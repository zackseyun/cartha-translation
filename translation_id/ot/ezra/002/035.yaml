- source_word: בְּנֵי
  choice: keturunan
  rationale: Bentuk jamak konstruksi dari kata 'anak laki-laki' ini dalam daftar sensus dapat menunjuk pada kelompok keturunan atau kaum. 'Keturunan' menyampaikan fungsi genealogisnya secara wajar dalam bahasa Indonesia modern tanpa membatasi kelompok itu hanya pada anak kandung langsung.
- source_word: סְנָאָה
  choice: Senaa
  rationale: Nama diri ini ditransliterasikan dari bentuk Ibrani Masoret tanpa diterjemahkan.
- source_word: שְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת וּשְׁלֹשִׁים
