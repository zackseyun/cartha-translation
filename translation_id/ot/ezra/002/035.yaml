  rationale: Susunan bilangan aditif Ibrani dialihkan ke bentuk bilangan Indonesia yang alami dan tepat, yaitu 3.630.
- source_word: implicit census referent
  choice: orang
  rationale: Kata 'orang' ditambahkan secara idiomatis untuk memperjelas bahwa angka tersebut menghitung anggota kelompok, sebagaimana dituntut konteks daftar sensus, tanpa mengubah jumlah atau identitas kelompok.
