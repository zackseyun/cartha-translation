lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar silsilah dan rombongan yang kembali, bentuk konstruksi ini menunjuk pada anggota garis keluarga atau kaum, bukan hanya anak laki-laki langsung. “Keturunan” menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia modern.
- source_word: בַרְקוֹס
  choice: Barkos
  rationale: Nama diri ini ditransliterasikan sesuai bentuk Ibrani dan kebiasaan penamaan dalam bahasa Indonesia.
- source_word: סִיסְרָא
  choice: Sisera
  rationale: Nama diri ini ditransliterasikan sebagai “Sisera”; dalam ayat ini nama tersebut berfungsi sebagai nama leluhur suatu kelompok keluarga.
- source_word: תָמַח
  choice: Temah
  rationale: Vokalisasi Masoret mendukung transliterasi “Temah”. Bentuk “Tamah” tetap dicatat sebagai kemungkinan transliterasi lain.
