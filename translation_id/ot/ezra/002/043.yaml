base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/043.yaml
  text: 'The temple servants: the sons of Ziha[a], the sons of Hasupha[c][b], the sons of Tabbaoth.'
translation:
  language: id
  text: 'Para pelayan Bait Allah[a]: keturunan Ziha[b], keturunan Hasufa, dan keturunan Tabaot.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “kaum Netinim”, yaitu kelompok pelayan yang ditugaskan untuk pelayanan di tempat ibadah.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak”; dalam daftar silsilah, ungkapan Ibrani yang diulang sebelum setiap nama ini dapat berarti “keturunan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: para pelayan Bait Allah
  rationale: Istilah ini menunjuk pada kelompok khusus yang diserahkan untuk melayani di tempat ibadah. Terjemahan fungsional ini lebih jelas bagi pembaca Indonesia modern daripada transliterasi “kaum Netinim”.
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar silsilah, bentuk ini dapat menunjuk pada anggota suatu garis keluarga atau kaum, bukan hanya anak laki-laki langsung. “Keturunan” menyampaikan maksud tersebut secara alami dalam bahasa Indonesia.
- source_word: צִיחָא
  choice: Ziha
  rationale: Nama diri ditransliterasikan menurut bentuk yang wajar dan dikenal dalam bahasa Indonesia.
- source_word: חֲשׂוּפָא
  choice: Hasufa
  rationale: Nama diri ditransliterasikan ke ejaan Indonesia; huruf f mewakili bunyi konsonan פ tanpa dages dalam bentuk Ibrani ini.
- source_word: טַבָּעוֹת
  choice: Tabaot
  rationale: Dalam konteks daftar ini, bentuk tersebut berfungsi sebagai nama orang atau nama kaum, sehingga ditransliterasikan dan tidak diterjemahkan sebagai kata benda umum.
theological_decisions: []
translation_notes:
  register: Bahasa dibuat ringkas dan bermartabat sesuai gaya sebuah daftar. “Bait Allah” dipakai untuk memperjelas tempat pelayanan kelompok tersebut, sedangkan “keturunan” menjaga cakupan genealogis בְּנֵי tanpa memberi kesan bahwa yang dimaksud selalu anak langsung.
