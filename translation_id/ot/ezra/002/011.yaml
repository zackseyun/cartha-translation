lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar silsilah dan rombongan yang kembali, bentuk jamak konstruksi dari בֵּן menunjuk pada anggota garis keluarga atau kaum. “Keturunan” menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia tanpa membatasi maknanya pada anak laki-laki langsung.
- source_word: בֵבָי
  choice: Bebai
  rationale: Nama diri atau nama keluarga ini ditransliterasikan dan dipertahankan sebagai “Bebai”.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וּשְׁלֹשָׁה
  choice: enam ratus dua puluh tiga orang
  rationale: Urutan bilangan Ibrani menyatakan jumlah tepat 623. Kata “orang” ditambahkan secara wajar untuk memperjelas bahwa angka itu menghitung para anggota kelompok, sebagaimana tersirat oleh konteks.
