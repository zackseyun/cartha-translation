  text: אֵ֗לֶּה בִּקְשׁ֧וּ כְתָבָ֛/ם הַ/מִּתְיַחְשִׂ֖ים וְ/לֹ֣א נִמְצָ֑אוּ וַֽ/יְגֹאֲל֖וּ מִן הַ/כְּהֻנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/062.yaml
  text: These sought their record among those enrolled by genealogy[a], but they were not found, and they were excluded from the priesthood.
translation:
  language: id
  text: Mereka mencari catatan mereka dalam daftar silsilah, tetapi mereka tidak ditemukan di sana; lalu mereka dinyatakan tidak layak untuk keimaman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibrani juga dapat berarti bahwa mereka dianggap tercemar atau tidak memenuhi syarat sehubungan dengan keimaman. Maksudnya ialah bahwa status imam mereka tidak diakui karena silsilah mereka tidak dapat dibuktikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Mereka
  rationale: Kata tunjuk jamak ini mengacu kepada para pemohon pengakuan sebagai imam yang disebut dalam konteks sebelumnya. Dalam bahasa Indonesia, pronomina “mereka” menghasilkan rujukan yang alami.
- source_word: בִּקְשׁוּ
  choice: mencari
  rationale: Kata kerja בקשׁ berarti mencari atau berusaha menemukan; “mencari” tepat dan wajar dalam konteks pemeriksaan dokumen.
- source_word: כְתָבָם
  choice: catatan tentang diri mereka
  rationale: כְּתָב menunjuk pada tulisan atau dokumen. Tambahan “tentang diri mereka” menjelaskan sufiks posesif dalam konteks catatan resmi tanpa menentukan bentuk dokumennya secara berlebihan.
- source_word: הַמִּתְיַחְשִׂים
  choice: dalam daftar silsilah
  rationale: Bentuk partisipel dari יחס berkaitan dengan pencatatan atau penetapan garis keturunan. Ungkapan ini menyampaikan konteks administratifnya dengan jelas dalam bahasa Indonesia.
- source_word: וְלֹא נִמְצָאוּ
  choice: tetapi catatan itu tidak ditemukan
  rationale: Walaupun verba Ibrani berbentuk jamak dan secara harfiah dapat menunjuk kepada orang-orang yang tidak ditemukan dalam daftar, konteks pencarian catatan memungkinkan penyampaian elipsis itu secara alami sebagai tidak ditemukannya catatan mereka.
- source_word: וַיְגֹאֲלוּ
  choice: mereka dinyatakan tidak layak
  rationale: Dalam pemakaian pasif di sini, גאל menyatakan bahwa mereka diperlakukan sebagai tercemar atau tidak memenuhi syarat. “Dinyatakan tidak layak” mengungkapkan keputusan mengenai status mereka tanpa menghilangkan unsur penilaian tersebut.
- source_word: מִן הַכְּהֻנָּה
  choice: untuk menjalankan tugas keimaman
  rationale: כְּהֻנָּה berarti keimaman atau jabatan imam. Pilihan ini menjelaskan akibat praktis keputusan itu dalam bahasa Indonesia yang alami.
theological_decisions:
- issue: Makna וַיְגֹאֲלוּ bagi status keimaman
  choice: mereka dinyatakan tidak layak untuk menjalankan tugas keimaman
  alternative: mereka dianggap najis sehingga dikeluarkan dari keimaman
  rationale: Verba Ibrani memuat gagasan dicemarkan atau diperlakukan sebagai tidak memenuhi syarat. Teks utama menyatakan akibat status itu dengan jelas, sedangkan catatan kaki mempertahankan nuansa kenajisan dan kemungkinan terjemahan alternatif tanpa menetapkan bahwa mereka secara moral bersalah.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan mudah dipahami. Istilah “daftar silsilah” mempertahankan latar administratif, sedangkan “tugas keimaman” menghindari ungkapan yang kaku tanpa mengubah akibat keputusan tersebut.
