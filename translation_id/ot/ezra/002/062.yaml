revisions:
- from: Mereka mencari catatan tentang diri mereka dalam daftar silsilah, tetapi catatan itu tidak ditemukan. Karena itu, mereka dinyatakan tidak layak untuk menjalankan tugas keimaman.[a]
  to: Mereka mencari catatan mereka dalam daftar silsilah, tetapi mereka tidak ditemukan di sana; lalu mereka dinyatakan tidak layak untuk keimaman.[a]
  rationale: Revisi mengembalikan subjek jamak "mereka" pada klausa "tidak ditemukan," mempertahankan lokasi implisitnya dengan "di sana," dan menerjemahkan status keimaman tanpa membatasinya pada pelaksanaan tugas. Catatan kaki tetap menyajikan nuansa leksikal alternatif dari verba Ibrani tanpa menyatakan adanya kenajisan moral.
