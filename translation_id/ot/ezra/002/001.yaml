  terminology: “Provinsi,” “Nebukadnezar,” “Babel,” “Yerusalem,” dan “Yehuda” tepat dan konsisten dengan penggunaan Alkitab bahasa Indonesia. “Masing-masing ke kotanya sendiri” menyampaikan daya distributif אִישׁ לְעִירוֹ dengan baik.
