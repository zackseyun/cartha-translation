revisions:
- from: Inilah penduduk provinsi[a] yang naik dari tempat penawanan orang-orang buangan[b], yaitu mereka yang dahulu dibuang ke Babel oleh Nebukadnezar, raja Babel. Mereka kembali ke Yerusalem dan Yehuda, masing-masing ke kotanya sendiri.
  to: Inilah penduduk provinsi[a] yang naik dari penawanan orang-orang buangan[b], yang telah dibuang ke Babel oleh Nebukadnezar, raja Babel. Mereka kembali ke Yerusalem dan Yehuda, masing-masing ke kotanya sendiri.
  rationale: Mengganti “tempat penawanan” dengan “penawanan” menghilangkan unsur lokasi yang tidak ada dalam teks Ibrani sambil tetap mempertahankan kedua unsur ungkapan שְׁבִי הַגּוֹלָה. Mengganti “dahulu dibuang” dengan “telah dibuang” menyatakan dengan lebih akurat deportasi yang mendahului kepulangan mereka. Tidak diperlukan perubahan pada jangkar atau isi catatan kaki.
