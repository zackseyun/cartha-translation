  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה בְּנֵ֣י הַ/מְּדִינָ֗ה הָֽ/עֹלִים֙ מִ/שְּׁבִ֣י הַ/גּוֹלָ֔ה אֲשֶׁ֥ר הֶגְלָ֛ה נבוכדנצור מֶֽלֶךְ בָּבֶ֖ל לְ/בָבֶ֑ל וַ/יָּשׁ֛וּבוּ לִ/ירוּשָׁלִַ֥ם וִֽ/יהוּדָ֖ה אִ֥ישׁ לְ/עִירֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/001.yaml
  text: These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away to Babylon, and they returned to Jerusalem and Judah[c][b], each to his own city.
translation:
  language: id
  text: Inilah penduduk provinsi[a] yang naik dari penawanan orang-orang buangan[b], yang telah dibuang ke Babel oleh Nebukadnezar, raja Babel. Mereka kembali ke Yerusalem dan Yehuda, masing-masing ke kotanya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak provinsi”, suatu ungkapan Ibrani yang berarti orang-orang atau penduduk provinsi itu.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani secara harfiah memuat kedua gagasan, yaitu “penawanan” dan “orang-orang buangan”; dapat juga diterjemahkan “dari pembuangan” atau “dari penawanan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: penduduk provinsi
  rationale: Ungkapan harfiah 'anak-anak provinsi' merupakan idiom Ibrani bagi orang-orang yang termasuk dalam provinsi itu. 'Penduduk provinsi' menyampaikan maknanya secara alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan bentuk sumber.
- source_word: הָעֹלִים
  choice: yang naik
  rationale: Bentuk partisip ini secara harfiah berarti 'orang-orang yang naik'. Pemakaian 'naik' mempertahankan gambaran geografis dan idiom perjalanan menuju Yehuda, tanpa mencampurkannya dengan kata שׁוּב ('kembali') yang muncul kemudian.
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: dari tempat penawanan orang-orang buangan
  rationale: 'Terjemahan ini mempertahankan kedua unsur ungkapan Ibrani: שְׁבִי sebagai penawanan dan גּוֹלָה sebagai orang-orang buangan. ''Tempat penawanan'' membuat hubungan keduanya lebih mudah dipahami dalam bahasa Indonesia tanpa mereduksinya menjadi satu istilah saja.'
- source_word: הֶגְלָה
  choice: dahulu dibuang
  rationale: Bentuk kausatif גלה menunjuk pada tindakan memaksa orang pergi ke pembuangan. 'Dibuang' merupakan ungkapan Indonesia yang wajar dalam konteks sejarah ini; 'dahulu' menandai bahwa tindakan itu mendahului kepulangan mereka.
- source_word: נבוכדנצור
  choice: Nebukadnezar
  rationale: Bentuk ini adalah ejaan nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַיָּשׁוּבוּ
  choice: Mereka kembali
  rationale: Kata kerja ini secara eksplisit menyatakan kepulangan. Kalimat baru membuat urutan tindakan jelas dan menghasilkan bahasa Indonesia yang alami.
- source_word: לִירוּשָׁלַם וִיהוּדָה
  choice: ke Yerusalem dan Yehuda
  rationale: Kedua tujuan diterjemahkan langsung sesuai sintaksis sumber.
- source_word: אִישׁ לְעִירוֹ
  choice: masing-masing ke kotanya sendiri
  rationale: אִישׁ dipakai secara distributif. 'Masing-masing' menyampaikan bahwa setiap orang atau keluarga kembali ke kotanya, sedangkan 'sendiri' memperjelas sufiks posesif tanpa membuat kalimat kaku.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibagi dua agar rangkaian klausa Ibrani tetap jelas bagi pembaca umum. Istilah administratif 'provinsi' dipertahankan karena sesuai dengan latar zaman Persia. Bentuk idiomatis yang janggal dalam bahasa Indonesia dijelaskan melalui catatan kaki, sementara gambaran 'naik' dari teks sumber tetap dipertahankan.
