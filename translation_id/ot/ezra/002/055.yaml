source:
  edition: WLC
  text: בְּנֵ֖י עַבְדֵ֣י שְׁלֹמֹ֑ה בְּנֵי סֹטַ֥י בְּנֵי הַ/סֹּפֶ֖רֶת בְּנֵ֥י פְרוּדָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/055.yaml
  text: 'the sons of Solomon’s servants: the sons of Sotai[a], the sons of Hassophereth, the sons of Peruda.'
translation:
  language: id
  text: 'Keturunan para hamba Salomo: keturunan Sotai, keturunan Hasoferet, dan keturunan Peruda.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani Ezra berbunyi “Peruda”; daftar sejajar dalam Nehemia 7:57 berbunyi “Perida”.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar silsilah dan kelompok ini, bentuk jamak konstruksi tersebut menunjuk pada garis keluarga atau kelompok keturunan, bukan hanya anak laki-laki langsung. “Keturunan” mempertahankan maksud genealogisnya dalam bahasa Indonesia yang alami.
- source_word: עַבְדֵי
  choice: para hamba
  rationale: Kata עֶבֶד dapat berarti “hamba” atau “budak”, tetapi di sini frasa tersebut merupakan nama golongan yang dikenal sebagai “hamba-hamba Salomo”. “Para hamba” wajar dan tidak menetapkan status sosial mereka secara lebih khusus daripada yang dituntut konteks.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Nama pribadi ini memakai bentuk baku yang dikenal luas dalam bahasa Indonesia.
- source_word: סֹטַי
  choice: Sotai
  rationale: Nama pribadi ditransliterasikan secara langsung dan selaras dengan ejaan Indonesia.
- source_word: הַסֹּפֶרֶת
  choice: Hasoferet
  rationale: Bentuk Ibrani mencakup unsur הַ yang melekat pada nama atau sebutan tersebut. “Hasoferet” mempertahankan bentuk konsonantalnya dalam transliterasi yang mudah dibaca dalam bahasa Indonesia tanpa mengubahnya menjadi nomina umum.
- source_word: פְרוּדָא
  choice: Peruda
  rationale: Teks Masoret Ezra membaca Peruda. Bentuk ini dipertahankan dalam teks utama, sedangkan perbedaan pada daftar sejajar dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Pengulangan “keturunan” mempertahankan irama daftar Ibrani, sedangkan “dan” sebelum unsur terakhir membuat rangkaian nama alami bagi pembaca modern. Penanda catatan ditempatkan sesudah “Peruda” karena catatan menjelaskan varian nama tersebut.
