  text: 'The sons of Lod[a], Hadid[b], and Ono: seven hundred twenty-five.'
translation:
  language: id
  text: 'Orang-orang[a] dari Lod[b], Hadid, dan Ono: 725 orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Anak-anak Lod, Hadid, dan Ono.” Dalam daftar ini, ungkapan tersebut dapat berarti keturunan, kelompok keluarga, atau penduduk dari tempat-tempat itu.
    reason: lexical_alternative
  - marker: b
    text: Lod kemudian dikenal dengan nama Lida.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: Orang-orang dari
  rationale: Dalam daftar para pemulangan ini, בְּנֵי dapat menunjuk pada kelompok keluarga atau penduduk yang terkait dengan tempat-tempat yang disebutkan, bukan hanya anak laki-laki langsung. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan cakupan maknanya.
- source_word: לֹד
  choice: Lod
  rationale: Nama tempat ini ditransliterasikan langsung dari bentuk Ibrani; bentuk yang dikenal kemudian ialah Lida.
- source_word: חָדִיד
  choice: Hadid
  rationale: Nama tempat ditransliterasikan dari bahasa Ibrani.
- source_word: וְאוֹנוֹ
  choice: dan Ono
  rationale: Waw diterjemahkan dengan kata penghubung Indonesia yang lazim, “dan”, sedangkan nama tempat ditransliterasikan.
- source_word: שְׁבַע מֵאוֹת עֶשְׂרִים וַחֲמִשָּׁה
  choice: 725 orang
  rationale: Rangkaian bilangan Ibrani menyatakan jumlah tepat 725; “orang” ditambahkan secara wajar untuk memperjelas bahwa angka itu menghitung anggota kelompok.
