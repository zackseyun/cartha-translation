  yaml_path: translation/ot/ezra/002/041.yaml
  text: 'The singers: the sons of Asaph, one hundred twenty-eight.'
translation:
  language: id
  text: 'Para penyanyi: keturunan Asaf, seratus dua puluh delapan orang.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: para penyanyi
  rationale: Partisipel dari שׁיר menunjuk kepada orang-orang yang menyanyi. Dalam daftar ini, “para penyanyi” langsung, alami, dan tidak menambahkan keterangan “Bait Allah” yang tidak dinyatakan secara eksplisit dalam ayat.
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar silsilah atau kelompok, בְּנֵי dapat menunjuk kepada garis keluarga atau kelompok yang berasal dari seorang leluhur. “Keturunan” lebih alami dan tidak menyiratkan bahwa semuanya anak kandung Asaf secara langsung.
- source_word: אָסָף
  choice: Asaf
  rationale: Nama diri ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: seratus dua puluh delapan orang
  rationale: Urutan bilangan Ibrani berarti 100 + 20 + 8. Kata “orang” ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas bahwa angka tersebut menghitung anggota kelompok.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas yang sesuai untuk daftar sensus. Tanda titik dua mempertahankan struktur penggolongan dalam teks Ibrani; “keturunan” dipilih agar hubungan kelompok dengan Asaf tersampaikan secara alami tanpa mempersempitnya menjadi anak biologis langsung.
