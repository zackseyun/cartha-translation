- source_word: עָדִין
  choice: Adin
  rationale: Nama diri Ibrani ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אַרְבַּע מֵאוֹת חֲמִשִּׁים וְאַרְבָּעָה
  choice: 454 orang
  rationale: Frasa bilangan Ibrani menyatakan jumlah tepat 454. Angka dipakai agar daftar sensus ringkas dan mudah dibaca; "orang" ditambahkan secara wajar untuk memperjelas bahwa angka tersebut adalah jumlah anggota kelompok.
