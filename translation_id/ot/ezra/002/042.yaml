base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/042.yaml
  text: 'The sons of the gatekeepers: the sons of Shallum, the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, all together one hundred thirty-nine.'
translation:
  language: id
  text: 'Keturunan para penjaga gerbang: keturunan Salum, keturunan Ater, keturunan Talmon, keturunan Akub, keturunan Hatita, keturunan Syobai; seluruhnya 139 orang.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam konteks daftar kelompok keluarga, bentuk ini menyatakan hubungan leluhur atau keanggotaan dalam suatu kaum. “Keturunan” menyampaikan maksudnya secara alami dalam bahasa Indonesia tanpa membatasi rujukan pada anak laki-laki langsung.
- source_word: הַשֹּׁעֲרִים
  choice: para penjaga gerbang
  rationale: Istilah ini menunjuk kepada orang-orang yang bertugas menjaga atau melayani di gerbang, khususnya dalam lingkungan Bait Allah. “Penjaga gerbang” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: שַׁלּוּם
  choice: Salum
  rationale: Nama pribadi dialihaksarakan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אָטֵר
  choice: Ater
  rationale: Nama pribadi dialihaksarakan secara langsung dan sesuai dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: טַלְמוֹן
  choice: Talmon
  rationale: Nama pribadi dialihaksarakan secara langsung.
- source_word: עַקּוּב
  choice: Akub
  rationale: Nama pribadi dialihaksarakan dengan “k” ganda Ibrani disederhanakan sesuai kebiasaan ejaan nama Alkitab dalam bahasa Indonesia.
- source_word: חֲטִיטָא
  choice: Hatita
  rationale: Nama pribadi dialihaksarakan sesuai vokalisasi Masoret dan bentuk yang lazim dalam bahasa Indonesia.
- source_word: שֹׁבָי
  choice: Sobai
  rationale: Nama pribadi dialihaksarakan sesuai vokalisasi Masoret; “sy” tidak diperlukan karena konsonan awalnya adalah shin yang lazim ditulis “s” dalam nama-nama Alkitab Indonesia.
- source_word: הַכֹּל
  choice: seluruhnya
  rationale: Dalam daftar sensus, kata ini merangkum semua kelompok yang baru disebutkan dan memperkenalkan jumlah total.
- source_word: מֵאָה שְׁלֹשִׁים וְתִשְׁעָה
  choice: 139 orang
  rationale: Bilangan diterjemahkan dengan angka agar daftar sensus mudah dibaca; “orang” ditambahkan secara wajar untuk memperjelas bahwa angka tersebut adalah jumlah anggota kelompok.
