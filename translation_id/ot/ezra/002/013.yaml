lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam konteks daftar keluarga orang-orang yang kembali, bentuk jamak konstruktus dari בֵּן menunjuk pada anggota garis keluarga atau kaum Adonikam. “Keturunan” lebih alami dan tepat dalam bahasa Indonesia daripada terjemahan harfiah “anak-anak lelaki”.
- source_word: אֲדֹנִיקָם
  choice: Adonikam
  rationale: Nama diri ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia, bukan diterjemahkan.
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וְשִׁשָּׁה
  choice: enam ratus enam puluh enam orang
  rationale: Urutan bilangan Ibrani menyatakan 666. Kata “orang” ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas bahwa angka itu adalah jumlah anggota kelompok, tanpa mengubah makna sumber.
