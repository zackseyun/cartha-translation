  text: the sons of Bakbuk[a], the sons of Hakupha, the sons of Harhur.
translation:
  language: id
  text: keturunan Bakbuk[a], keturunan Hakufa, dan keturunan Harhur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Bakbuk”; demikian juga untuk Hakufa dan Harhur. Ungkapan Ibrani ini dapat menunjuk kepada keturunan atau kelompok keluarga, bukan hanya anak langsung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar silsilah dan kelompok orang yang kembali, bentuk konstruksi jamak dari בֵּן dapat menunjuk kepada garis keluarga atau anggota kaum, bukan hanya anak laki-laki langsung. “Keturunan” menyampaikan fungsi ungkapan itu secara alami dalam bahasa Indonesia modern.
- source_word: בַקְבּוּק
  choice: Bakbuk
  rationale: Nama diri ditransliterasikan sesuai bunyi dan bentuk Ibrani.
- source_word: חֲקוּפָא
  choice: Hakufa
  rationale: Nama diri ditransliterasikan ke ejaan Indonesia; huruf פ tanpa dagesh direpresentasikan dengan “f”.
- source_word: חַרְחוּר
  choice: Harhur
  rationale: Nama diri ditransliterasikan secara langsung ke ejaan Indonesia.
