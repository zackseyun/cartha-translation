  text: וַ/יֵּשְׁב֣וּ הַ/כֹּהֲנִ֣ים וְ֠/הַ/לְוִיִּם וּֽ/מִן הָ/עָ֞ם וְ/הַ/מְשֹׁרְרִ֧ים וְ/הַ/שּׁוֹעֲרִ֛ים וְ/הַ/נְּתִינִ֖ים בְּ/עָרֵי/הֶ֑ם וְ/כָל יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/070.yaml
  text: So the priests[a], the Levites, some of the people, the singers, the gatekeepers, and the temple servants lived in their cities, and all Israel lived in their cities.
translation:
  language: id
  text: Maka para imam, orang-orang Lewi, sebagian dari rakyat, para penyanyi, para penjaga gerbang, dan para pelayan Bait Allah[a] tinggal di kota-kota mereka, dan seluruh Israel tinggal di kota-kota mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “orang-orang Netinim,” istilah teknis bagi suatu golongan yang ditugaskan untuk pelayanan Bait Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: tinggal
  rationale: Dalam konteks kepulangan dan penempatan kembali ini, verba ישׁב menyatakan bahwa mereka mengambil tempat kediaman. “Tinggal” alami dalam bahasa Indonesia dan dapat mencakup nuansa menetap tanpa membuatnya terlalu tegas.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku bagi kelompok imam dalam konteks ibadah Israel pascapembuangan.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Padanan yang jelas dan lazim bagi kelompok suku Lewi yang dibedakan dari para imam.
- source_word: וּמִן הָעָם
  choice: sebagian dari rakyat
  rationale: Preposisi מִן bersifat partitif di sini dan menunjuk kepada sebagian rakyat di luar kelompok petugas Bait Allah yang disebutkan.
- source_word: הַמְשֹׁרְרִים
  choice: para penyanyi
  rationale: Bentuk ini menunjuk kepada orang-orang yang bertugas menyanyi dalam pelayanan ibadah; “para penyanyi” merupakan padanan langsung dan wajar.
- source_word: הַשּׁוֹעֲרִים
  choice: para penjaga pintu gerbang
  rationale: Istilah ini menunjuk kepada para petugas yang menjaga atau melayani di pintu-pintu gerbang, khususnya dalam lingkungan Bait Allah.
- source_word: הַנְּתִינִים
  choice: para pelayan Bait Allah
  rationale: נְתִינִים adalah istilah teknis bagi suatu golongan yang ditugaskan untuk pelayanan Bait Allah. Padanan fungsional ini lebih mudah dipahami pembaca modern, sedangkan nama teknisnya dipertahankan dalam catatan kaki.
- source_word: בְּעָרֵיהֶם
  choice: di kota-kota mereka
  rationale: עִיר dapat berarti kota atau permukiman; “kota-kota” mempertahankan ungkapan geografis yang lazim dan formula berulang dalam ayat ini.
- source_word: וְכָל יִשְׂרָאֵל
  choice: Seluruh Israel juga
  rationale: Ungkapan kolektif ini dipertahankan sebagai “seluruh Israel”. Kata “juga” menyampaikan hubungan koordinatif dengan kelompok-kelompok yang telah disebutkan tanpa mengubah cakupan ungkapan tersebut.
theological_decisions:
- issue: Penerjemahan istilah teknis הַנְּתִינִים
  choice: para pelayan Bait Allah
  alternative: orang-orang Netinim
  rationale: Ayat ini memakai sebutan khusus pascapembuangan bagi kelompok yang ditugaskan melayani Bait Allah. Terjemahan utama menyampaikan fungsi kelompok itu, sementara transliterasi dicantumkan dalam catatan kaki agar identitas istilah Ibraninya tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dipertahankan, pengulangan “tinggal di kota-kota mereka” mengikuti penekanan teks Ibrani, dan penanda catatan kaki ditempatkan tepat sesudah istilah yang dijelaskannya.
