  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar orang yang kembali di Ezra, istilah ini memperkenalkan kelompok keluarga atau kaum, bukan hanya anak laki-laki langsung. “Keturunan” menyampaikan fungsi kolektif itu secara alami dalam bahasa Indonesia.
- source_word: זַתּוּא
  choice: Zatu
  rationale: Nama diri Ibrani ini ditransliterasikan secara wajar ke dalam ejaan bahasa Indonesia; konsonan rangkap tidak diperlukan untuk mewakili bentuk Ibraninya.
- source_word: תְּשַׁע מֵאוֹת וְאַרְבָּעִים וַחֲמִשָּׁה
  choice: sembilan ratus empat puluh lima
  rationale: Urutan bilangan Ibrani menyatakan 900 + 40 + 5. Bentuk ini menyampaikan jumlah tersebut secara tepat dan alami dalam bahasa Indonesia.
- source_word: (tersirat oleh konteks daftar)
  choice: orang
  rationale: Kata “orang” ditambahkan untuk memperjelas bahwa bilangan tersebut menghitung anggota kelompok keluarga, tanpa mengubah isi sumber.
