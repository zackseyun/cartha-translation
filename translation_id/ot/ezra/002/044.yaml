  text: בְּנֵי קֵרֹ֥ס בְּֽנֵי סִֽיעֲהָ֖א בְּנֵ֥י פָדֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/044.yaml
  text: the sons of Keros[a], the sons of Siaha, the sons of Padon.
translation:
  language: id
  text: keturunan Keros[a], keturunan Siaha, keturunan Padon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Keros.” Dalam daftar silsilah, ungkapan ini dapat berarti keturunan atau anggota suatu garis keluarga, bukan hanya anak laki-laki langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar orang yang kembali dan daftar keluarga ini, bentuk tersebut menunjuk kepada anggota atau keturunan suatu garis keluarga, bukan hanya anak laki-laki langsung. 'Keturunan' menyampaikan fungsi genealogisnya secara alami dalam bahasa Indonesia.
- source_word: קֵרֹס
  choice: Keros
  rationale: Nama diri ini dialihaksarakan sesuai bentuk Ibrani Masoretik.
- source_word: סִיעֲהָא
  choice: Siaha
  rationale: Nama diri ini dialihaksarakan dari bentuk teks Masoretik; bentuk yang lebih pendek terdapat dalam tradisi paralel, tetapi tidak dipakai untuk menggantikan bacaan sumber di sini.
- source_word: פָדוֹן
  choice: Padon
  rationale: Nama diri ini dialihaksarakan sesuai vokalisasi Ibrani Masoretik.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan sesuai gaya daftar silsilah. Pengulangan formula Ibrani dipertahankan secara wajar melalui kata 'keturunan'.
