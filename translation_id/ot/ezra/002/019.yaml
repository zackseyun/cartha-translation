lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar orang yang kembali di Ezra 2, istilah ini memperkenalkan kelompok keluarga atau kaum yang ditelusuri melalui seorang leluhur laki-laki. Dalam bahasa Indonesia modern, “keturunan” menyampaikan maksud tersebut dengan lebih alami daripada terjemahan harfiah “anak-anak lelaki” dan tidak menyiratkan bahwa mereka semua adalah putra langsung.
- source_word: חָשֻׁם
  choice: Hasum
  rationale: Nama diri Ibrani ditransliterasikan sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מָאתַיִם עֶשְׂרִים וּשְׁלֹשָׁה
  choice: 223 orang
  rationale: Rangkaian bilangan Ibrani berarti dua ratus dua puluh tiga. Angka ditulis dengan digit agar daftar panjang mudah dibaca, sedangkan “orang” ditambahkan secara wajar untuk memperjelas bahwa angka itu menyatakan jumlah anggota kelompok.
