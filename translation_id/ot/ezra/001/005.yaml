  text: וַ/יָּק֜וּמוּ רָאשֵׁ֣י הָ/אָב֗וֹת לִֽ/יהוּדָה֙ וּ/בִנְיָמִ֔ן וְ/הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְ/כֹ֨ל הֵעִ֤יר הָ/אֱלֹהִים֙ אֶת רוּח֔/וֹ לַ/עֲל֣וֹת לִ/בְנ֔וֹת אֶת בֵּ֥ית יְהוָ֖ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/005.yaml
  text: Then the heads of the fathers’ houses of Judah and Benjamin[a], and the priests and the Levites[b], arose—everyone whose spirit God had stirred—to go up to build the house of Yahweh that is in Jerusalem.
translation:
  language: id
  text: Kemudian bangkitlah para kepala kaum keluarga Yehuda dan Benyamin, para imam, dan orang-orang Lewi—semua orang yang rohnya telah Allah gerakkan[a]—untuk naik membangun rumah Yahweh[b] yang di Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan "yang rohnya telah dibangunkan Allah" atau "yang telah didorong Allah dalam batinnya."
    reason: lexical_alternative
  - marker: b
    text: '"Rumah Yahweh" merujuk kepada bait Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֜וּמוּ
  choice: bangkit
  rationale: Menandai awal tindakan sebagai tanggapan terhadap dorongan Allah tanpa menafsirkannya langsung sebagai keberangkatan.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: para kepala kaum keluarga
  rationale: Mengungkapkan kepemimpinan kelompok kekerabatan dengan bahasa Indonesia yang alami sambil mempertahankan struktur sosial dalam teks Ibrani.
- source_word: לִיהוּדָה וּבִנְיָמִן
  choice: Yehuda dan Benyamin
  rationale: Dalam frasa ini, prefiks ל menandai hubungan atau afiliasi; susunan 'kaum keluarga Yehuda dan Benyamin' menyatakannya secara alami.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku untuk kelompok pelayan keagamaan yang disebut dalam konteks ini.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Padanan Indonesia yang lazim dan jelas bagi kelompok suku sekaligus pelayan ibadah tersebut.
- source_word: לְכֹל הֵעִיר הָאֱלֹהִים אֶת רוּחוֹ
  choice: yaitu setiap orang yang rohnya telah digerakkan Allah
  rationale: Mencerminkan konstruksi distributif dan menyatakan bahwa Allah menyebabkan dorongan batin itu, tanpa menentukan mekanismenya lebih jauh.
- source_word: רוּחַ
  choice: roh
  rationale: Mempertahankan istilah Ibrani bagi batin atau daya pendorong seseorang beserta gaung teologisnya.
- source_word: לַעֲלוֹת
  choice: untuk naik ke Yerusalem
  rationale: Mempertahankan ungkapan konvensional dan topografis tentang perjalanan menuju Yerusalem.
- source_word: לִבְנוֹת
  choice: membangun
  rationale: Teks Ibrani memakai verba 'membangun', bukan bentuk yang secara eksplisit berarti 'membangun kembali'.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan citra harfiah 'rumah' dalam bahasa sumber; konteksnya menunjukkan bahwa yang dimaksud ialah bait.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang dinyatakan langsung dalam teks Ibrani.
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: yang ada di sana
  rationale: Karena Yerusalem sudah disebut sebagai tujuan tepat sebelumnya, 'di sana' secara alami mempertahankan keterangan lokasi rumah Yahweh tanpa pengulangan yang kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menggunakan Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Kadar penafsiran dalam הֵעִיר הָאֱלֹהִים אֶת רוּחוֹ
  choice: setiap orang yang rohnya telah digerakkan Allah
  alternative: setiap orang yang diilhami Allah atau didorong Allah
  rationale: Pilihan ini mempertahankan tindakan Allah atas roh batin manusia sebagaimana dinyatakan teks, tanpa menjelaskan pengalaman atau mekanisme teologisnya secara lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'kaum keluarga' menjaga nuansa struktur kekerabatan, sedangkan 'naik ke Yerusalem' mempertahankan idiom perjalanan dalam sumber. Tanda pisah mengapit penjelasan distributif agar hubungan antara kelompok-kelompok yang disebut dan orang-orang yang digerakkan Allah tetap jelas.
