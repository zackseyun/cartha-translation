base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/009.yaml
  text: 'And this was their number: 30 gold basins[a], 1,000 silver basins, and 29 knives.'
translation:
  language: id
  text: 'Inilah jumlahnya: 30 baskom emas, 1.000 baskom perak, dan 29 pisau[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “29 bejana lain”, “29 bejana duplikat”, atau “29 bejana pengganti”; arti istilah Ibraninya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה מִסְפָּרָם
  choice: Inilah jumlahnya
  rationale: Ungkapan ini memperkenalkan daftar inventaris. Bentuk Indonesia ini alami dan tetap menyampaikan arti harfiah ‘dan inilah jumlah mereka’.
- source_word: אֲגַרְטְלֵי
  choice: baskom
  rationale: Kata ini menunjuk pada wadah atau bejana yang dipakai dalam lingkungan Bait Allah. ‘Baskom’ menyampaikan bentuk wadah cekung secara jelas bagi pembaca modern; ‘mangkuk’ atau ‘bokor’ juga mungkin.
- source_word: זָהָב
  choice: emas
  rationale: Menunjukkan bahan baskom pertama.
- source_word: שְׁלֹשִׁים
  choice: '30'
  rationale: Bilangan pokok ditulis dengan angka agar daftar inventaris mudah dibaca.
- source_word: כֶסֶף
  choice: perak
  rationale: Menunjukkan bahan baskom kedua.
- source_word: אָלֶף
  choice: '1.000'
  rationale: Bilangan pokok ditulis menurut kaidah penulisan angka bahasa Indonesia.
- source_word: מַחֲלָפִים
  choice: pisau
  rationale: Makna kata Ibrani yang langka ini tidak pasti. ‘Pisau’ merupakan tafsiran lama yang masuk akal dalam daftar perlengkapan ibadah, tetapi kemungkinan lain dipertahankan dalam catatan kaki.
- source_word: תִּשְׁעָה וְעֶשְׂרִים
  choice: '29'
  rationale: Bilangan pokok ditulis dengan angka agar konsisten dalam daftar.
