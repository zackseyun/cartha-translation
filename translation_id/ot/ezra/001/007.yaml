  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ כּ֔וֹרֶשׁ הוֹצִ֖יא אֶת כְּלֵ֣י בֵית יְהוָ֑ה אֲשֶׁ֨ר הוֹצִ֤יא נְבֽוּכַדְנֶצַּר֙ מִ/יר֣וּשָׁלִַ֔ם וַֽ/יִּתְּנֵ֖/ם בְּ/בֵ֥ית אֱלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/007.yaml
  text: And King Cyrus brought out the vessels of the house of Yahweh[b][a], which Nebuchadnezzar had brought out from Jerusalem and had put in the house of his god.
translation:
  language: id
  text: Raja Koresh mengeluarkan perlengkapan Bait Yahweh[a], yang telah dikeluarkan Nebukadnezar dari Yerusalem lalu ditempatkannya di rumah dewanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah Yahweh”; atau “Bait Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ
  choice: Raja Koresh
  rationale: Urutan gelar sebelum nama merupakan bentuk yang alami dalam bahasa Indonesia dan tetap mewakili bentuk Ibrani secara tepat.
- source_word: הוֹצִיא ... הוֹצִיא
  choice: membawa keluar ... dibawa keluar
  rationale: Mengulang padanan verba yang sama mempertahankan kaitan verbal antara tindakan Koresh dan tindakan Nebukadnezar sebelumnya; bentuk pasif pada klausa relatif menghasilkan susunan Indonesia yang alami.
- source_word: כְּלֵי
  choice: perlengkapan
  rationale: Dalam konteks tempat ibadah, kata ini menunjuk berbagai benda atau perkakas yang dipakai di sana tanpa menentukan bentuknya secara lebih sempit.
- source_word: בֵית יְהוָה
  choice: rumah Yahweh
  rationale: Padanan ini mempertahankan arti dasar בֵית dan kesejajarannya dengan 'rumah dewanya'; makna kontekstualnya sebagai bait atau tempat ibadah dijelaskan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan sebuah gelar.
- source_word: וַיִּתְּנֵם
  choice: ditempatkannya
  rationale: Dalam konstruksi dengan keterangan tempat, נתן bermakna menaruh atau menempatkan. Akhiran -nya secara wajar menunjuk kembali kepada Nebukadnezar.
- source_word: בְּבֵית אֱלֹהָיו
  choice: di rumah dewanya
  rationale: Bentuk tunggal bersufiks orang ketiga maskulin dipertahankan, sekaligus menjaga kesejajaran leksikal dengan 'rumah Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Identitas ilah yang berkaitan dengan Nebukadnezar
  choice: dewanya
  alternative: dewa-dewanya
  rationale: אֱלֹהָיו secara gramatikal dapat memiliki bentuk yang menyerupai jamak, tetapi kesesuaian konteks dan terjemahan tradisional memahami sufiks ini sebagai bentuk tunggal, 'ilah/dewanya'. Terjemahan tidak memperluasnya menjadi seluruh panteon Babel.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Perlengkapan' dipilih daripada 'bejana' karena cakupan כְּלֵי dapat meliputi beragam perkakas tempat ibadah. Pengulangan 'membawa keluar' sengaja dipertahankan dari teks Ibrani.
