  source_fidelity: Makna pokok dan hubungan verba berulang dipertahankan dengan baik. Namun, “rumah Yahweh” kurang jelas dan kurang idiomatis sebagai sebutan bagi בֵּית יְהוָה dalam konteks perlengkapan kultis; “Bait Yahweh” menyampaikan rujukan tempat ibadah secara tepat tanpa mengubah makna.
