  terminology: “Perlengkapan” dapat dipakai untuk כְּלֵי tanpa membatasi jenis benda. “Yahweh” tepat untuk יְהוָה. “Dewanya” mempertahankan bentuk tunggal dengan sufiks orang ketiga maskulin. “Bait Yahweh” adalah istilah Indonesia yang lebih lazim dan jelas untuk בית יהוה.
