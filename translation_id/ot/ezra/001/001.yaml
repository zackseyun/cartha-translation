reference: Ezra 1:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה מִ/פִּ֣י יִרְמְיָ֑ה הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כֹּ֣רֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/001.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh from the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he sent a proclamation throughout all his kingdom, and also in writing[c][b], saying:'
translation:
  language: id
  text: 'Pada tahun pertama pemerintahan Koresh, raja Persia, agar firman Yahweh yang disampaikan melalui Yeremia digenapi[a], Yahweh menggerakkan roh Koresh, raja Persia. Lalu Koresh menyebarkan pengumuman ke seluruh kerajaannya, dan juga secara tertulis[c], demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “untuk menyelesaikan firman Yahweh dari mulut Yeremia.” Ungkapan “dari mulut Yeremia” berarti bahwa Yeremia menyampaikan firman itu sebagai juru bicara Yahweh.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan ini menunjukkan bahwa pengumuman tersebut juga dibuat atau diedarkan dalam bentuk tulisan.
    reason: clarification
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת לְכוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Pada tahun pertama pemerintahan Koresh, raja Persia
  rationale: Rumus penanggalan Ibrani menunjuk pada tahun pertama Koresh sebagai raja. Penambahan 'pemerintahan' membuat maksud itu jelas dan alami dalam bahasa Indonesia tanpa menambah isi substantif.
- source_word: לִכְלוֹת דְּבַר יְהוָה
  choice: agar firman Yahweh ... digenapi
  rationale: Infinitif לִכְלוֹת menyatakan tujuan atau hasil berupa terlaksananya firman ilahi. 'Digenapi' merupakan ungkapan Indonesia yang wajar untuk realisasi nubuat, sementara catatan kaki mempertahankan bentuk yang lebih harfiah.
- source_word: מִפִּי יִרְמְיָה
  choice: yang disampaikan melalui Yeremia
  rationale: Secara harfiah berarti 'dari mulut Yeremia'. Pilihan ini menyampaikan peran Yeremia sebagai perantara atau juru bicara tanpa mempertahankan idiom yang terasa kaku.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, sesuai bentuk Tetragramaton dalam teks sumber.
- source_word: הֵעִיר יְהוָה אֶת רוּחַ כֹּרֶשׁ
  choice: Yahweh menggerakkan hati Koresh
  rationale: Ungkapan itu menggambarkan dorongan batin yang berasal dari Yahweh. 'Hati' alami dalam bahasa Indonesia, tetapi 'roh' tetap dicatat karena רוּחַ memiliki cakupan makna yang lebih luas.
- source_word: וַיַּעֲבֶר קוֹל בְּכָל מַלְכוּתוֹ
  choice: Lalu Koresh menyebarkan pengumuman ke seluruh kerajaannya
  rationale: Idiom harfiahnya adalah 'membuat suara/pengumuman melintas'. 'Menyebarkan pengumuman' menyampaikan tindakan mengedarkan pengumuman resmi ke seluruh wilayah kekuasaan.
- source_word: וְגַם בְּמִכְתָּב
  choice: juga secara tertulis
  rationale: Frasa ini menegaskan bahwa pengumuman tersebut bukan hanya diumumkan, tetapi juga dibuat atau diedarkan dalam bentuk tulisan.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Kata ini memperkenalkan kutipan langsung. 'Demikian:' lebih alami daripada 'dengan berkata:' pada pembukaan maklumat resmi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi. 'Yahweh' mempertahankan sifatnya sebagai nama dan tidak menggantinya dengan gelar.
- issue: Hubungan nubuat Yeremia dengan tindakan Koresh
  choice: agar firman Yahweh yang disampaikan melalui Yeremia digenapi
  alternative: untuk menyelesaikan firman Yahweh dari mulut Yeremia
  rationale: '''Digenapi'' menyatakan realisasi firman nubuat dalam sejarah tanpa menentukan secara berlebihan bagaimana tujuan ilahi dan tindakan manusia berhubungan.'
- issue: Makna רוּחַ dalam diri Koresh
  choice: hati
  alternative: roh
  rationale: Dalam konteks ini רוּחַ menunjuk pada batin, kecenderungan, atau dorongan Koresh. 'Hati' paling alami bagi pembaca Indonesia, sedangkan catatan kaki menjaga kemungkinan terjemahan formal 'roh'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang khidmat tetapi mudah dipahami. Struktur kalimat panjang Ibrani dibagi menjadi dua kalimat agar hubungan antarklausa tetap jelas. Nama Koresh mengikuti bentuk yang lazim dalam Alkitab berbahasa Indonesia.
