id: EZR.1.2
reference: Ezra 1:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֗ר כֹּ֚רֶשׁ מֶ֣לֶךְ פָּרַ֔ס כֹּ֚ל מַמְלְכ֣וֹת הָ/אָ֔רֶץ נָ֣תַן לִ֔/י יְהוָ֖ה אֱלֹהֵ֣י הַ/שָּׁמָ֑יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֥ר בִּֽ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/002.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has appointed me to build a house for him in Jerusalem[b], which is in Judah.'
translation:
  language: id
  text: '“Beginilah kata Koresh, raja Persia: ‘Yahweh, Allah semesta langit, telah memberikan kepadaku segala kerajaan di bumi, dan Dialah yang menugaskan aku[a] untuk membangun sebuah rumah[b] bagi-Nya di Yerusalem, yang terletak di Yehuda.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberi amanat kepadaku” untuk membangun sebuah rumah bagi-Nya.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah Bait Allah di Yerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Beginilah kata
  rationale: Menyampaikan rumusan proklamasi resmi secara alami dalam bahasa Indonesia tanpa menjadikan ucapan raja sebagai ‘firman’ ilahi.
- source_word: כֹּרֶשׁ מֶלֶךְ פָּרַס
  choice: Koresh, raja Persia
  rationale: Menggunakan bentuk nama yang lazim dalam bahasa Indonesia dan mempertahankan gelar kerajaan sebagai aposisi.
- source_word: כֹּל מַמְלְכוֹת הָאָרֶץ
  choice: segala kerajaan di bumi
  rationale: Mempertahankan bentuk jamak ‘kerajaan’ dan cakupan luas הָאָרֶץ dalam retorika kekaisaran.
- source_word: נָתַן לִי
  choice: telah memberikan kepadaku
  rationale: Bentuk ‘telah’ menyatakan tindakan lampau yang hasilnya masih berlaku bagi kekuasaan Koresh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: Allah semesta langit
  rationale: Ungkapan Indonesia yang ringkas dan bermartabat untuk gelar konstruksi Ibrani ‘Allah dari langit/surga’, dengan bentuk jamak Ibrani dipahami secara kolektif.
- source_word: וְהוּא
  choice: dan Dialah
  rationale: Bentuk ini mempertahankan penekanan pada pronomina eksplisit dalam bahasa Ibrani.
- source_word: פָקַד עָלַי
  choice: menugaskan aku
  rationale: Dalam konteks ini kata kerja menunjuk pada pemberian tugas atau amanat; ‘menugaskan’ alami dan tidak mempersempit maknanya menjadi perintah semata.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: untuk membangun sebuah rumah bagi-Nya
  rationale: Mempertahankan arti harfiah בַיִת sebagai ‘rumah’, sementara konteks bahwa itu bait dijelaskan dalam catatan kaki.
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: di Yerusalem, yang terletak di Yehuda
  rationale: Mempertahankan klausa relatif dan keterangan geografis secara jelas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks sumber memakai nama ilahi secara langsung; transliterasi ‘Yahweh’ mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Makna בַיִת dalam konteks pembangunan tempat ibadah
  choice: rumah
  alternative: bait; Bait Allah
  rationale: Teks utama mempertahankan arti leksikal ‘rumah’ agar tidak membuat unsur tersirat menjadi eksplisit; rujukannya kepada bait dijelaskan dalam catatan kaki.
- issue: Nuansa פָקַד עָלַי
  choice: menugaskan aku
  alternative: memberi amanat kepadaku; memerintahkan aku
  rationale: Kata tersebut dapat menyatakan penugasan atau pemberian amanat. ‘Menugaskan’ mempertahankan cakupan ini tanpa memastikan bahwa nuansanya semata-mata perintah keras.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan corak proklamasi kerajaan yang bermartabat. Nama tempat memakai bentuk Indonesia yang lazim: Koresh, Persia, Yerusalem, dan Yehuda. Kapitalisasi pronomina ilahi dipakai untuk kejelasan rujukan dan kelaziman register keagamaan Indonesia.'
