base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/006.yaml
  text: And all those around them strengthened their hands with vessels of silver[a], with gold, with goods, with livestock, and with precious things[b], besides all that was freely offered.
translation:
  language: id
  text: Semua orang di sekitar mereka membantu mereka[a] dengan barang-barang dari perak, emas, harta benda, ternak, dan berbagai barang berharga, di samping segala sesuatu yang dipersembahkan dengan sukarela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “menguatkan tangan mereka.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “di samping semua persembahan sukarela.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבִיבֹתֵיהֶם
  choice: semua orang yang tinggal di sekitar mereka
  rationale: Ungkapan ini menunjuk kepada orang-orang di daerah sekitar mereka. Terjemahan ini mempertahankan cakupan geografisnya tanpa mempersempitnya menjadi tetangga yang tinggal tepat di sebelah.
- source_word: חִזְּקוּ בִידֵיהֶם
  choice: mendukung mereka
  rationale: Secara harfiah ungkapan ini berarti 'menguatkan tangan mereka', tetapi dalam konteks ini merupakan idiom untuk memberi bantuan nyata. 'Mendukung mereka' alami dalam bahasa Indonesia dan sesuai dengan daftar bantuan yang menyusul.
- source_word: בִּכְלֵי כֶסֶף
  choice: dengan barang-barang dari perak
  rationale: כְּלִי dapat berarti bejana, perkakas, atau barang. Dalam daftar sumbangan ini, 'barang-barang' mempertahankan keluasan makna tanpa membatasi bentuk bendanya.
- source_word: בַּזָּהָב
  choice: emas
  rationale: Nomina tanpa keterangan ini paling wajar dipahami sebagai emas yang diberikan; tidak perlu menambahkan 'barang-barang dari' yang tidak dinyatakan secara eksplisit.
- source_word: בָּרְכוּשׁ
  choice: harta benda
  rationale: רְכוּשׁ menunjuk kepada milik atau kekayaan yang dapat dibawa. 'Harta benda' cocok dengan konteks dukungan material dan tidak menyiratkan tanah.
- source_word: וּבַבְּהֵמָה
  choice: ternak
  rationale: בְּהֵמָה dipakai secara kolektif untuk hewan peliharaan yang bernilai ekonomi; 'ternak' menyampaikan makna itu dengan tepat.
- source_word: וּבַמִּגְדָּנוֹת
  choice: berbagai barang berharga
  rationale: מִגְדָּנוֹת dapat menunjuk kepada benda pilihan atau berharga, dan dalam konteks tertentu kepada makanan lezat. Pilihan ini menjaga keluasan istilah dalam konteks pemberian material.
- source_word: לְבַד עַל כָּל הִתְנַדֵּב
  choice: di samping semua persembahan sukarela
  rationale: Frasa Ibrani yang padat ini menyatakan tambahan di luar barang-barang yang sudah disebutkan dan mengandung gagasan pemberian secara sukarela.
