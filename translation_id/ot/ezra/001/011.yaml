  source_fidelity: Makna pokok, jumlah, nama, arah perjalanan, dan pengulangan akar עלה telah diterjemahkan dengan tepat. Namun, susunan “Jumlah seluruh perlengkapan ... itu lima ribu empat ratus” kurang langsung untuk הַכֹּל dan dapat diperjelas dengan verba “berjumlah.” Rujukan “mereka” pada klausa terakhir juga lebih baik dinyatakan secara eksplisit sebagai orang-orang buangan, sesuai dengan הַגּוֹלָה.
  naturalness: Bahasa draft umumnya baku dan mudah dipahami. “Seluruh perlengkapan ... itu berjumlah” lebih idiomatis dalam prosa Indonesia modern daripada susunan nominal yang ada. Pengulangan nomina pada klausa terakhir menghindari ambiguitas pronomina tanpa menjadi tidak wajar.
  terminology: “Perlengkapan” merupakan padanan luas yang sesuai untuk כֵּלִים dalam konteks perlengkapan Bait Allah. “Sesbazar,” “Babel,” dan “Yerusalem” tepat. “Orang-orang buangan” dapat dipertahankan untuk הַגּוֹלָה, dan “naik” dengan tepat mempertahankan idiom gerak menuju Yerusalem.
