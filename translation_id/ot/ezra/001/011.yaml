  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּל כֵּלִים֙ לַ/זָּהָ֣ב וְ/לַ/כֶּ֔סֶף חֲמֵ֥שֶׁת אֲלָפִ֖ים וְ/אַרְבַּ֣ע מֵא֑וֹת הַ/כֹּ֞ל הֶעֱלָ֣ה שֵׁשְׁבַּצַּ֗ר עִ֚ם הֵעָל֣וֹת הַ/גּוֹלָ֔ה מִ/בָּבֶ֖ל לִ/ירוּשָׁלִָֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/011.yaml
  text: All the articles of gold and silver were five thousand four hundred in all[c][b][a]. Sheshbazzar brought them up with the exiles when they were brought up from Babylon to Jerusalem.
translation:
  language: id
  text: Seluruh perlengkapan[a] dari emas dan perak itu berjumlah lima ribu empat ratus. Sesbazar membawa semuanya naik[b] bersama orang-orang buangan[c] ketika orang-orang buangan itu dibawa naik dari Babel ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkakas-perkakas”. Istilah Ibraninya dapat merujuk secara luas pada perkakas, wadah, atau berbagai benda, khususnya perlengkapan Bait Allah.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai kata “naik” dua kali dalam ayat ini, sesuai dengan ungkapan lazim tentang perjalanan naik ke Yerusalem.
    reason: cultural_note
  - marker: c
    text: Atau “komunitas buangan” atau “orang-orang yang dibuang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל כֵּלִים
  choice: seluruh perlengkapan
  rationale: כֵּלִים merupakan istilah luas untuk perkakas, wadah, atau berbagai benda. Dalam konteks perbendaharaan Bait Allah, “perlengkapan” terdengar alami dan cukup luas tanpa membatasinya hanya pada wadah.
- source_word: לַזָּהָב וְלַכֶּסֶף
  choice: emas dan perak
  rationale: Prefiks ל di sini mengelompokkan benda-benda itu menurut bahannya; bahasa Indonesia secara alami memakai frasa “perlengkapan emas dan perak”.
- source_word: חֲמֵשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת
  choice: lima ribu empat ratus
  rationale: Bilangan ditulis dengan kata agar sesuai dengan gaya prosa Alkitab yang formal dan mudah dibaca.
- source_word: הַכֹּל
  choice: jumlah seluruh ... itu
  rationale: הַכֹּל menandai jumlah keseluruhan. Susunan ini menyampaikan fungsi rangkuman tersebut secara wajar dalam bahasa Indonesia.
- source_word: הֶעֱלָה
  choice: membawa semuanya naik
  rationale: Bentuk Hifil dari עלה berarti membawa atau menyebabkan naik. Kata “naik” dipertahankan karena tujuan perjalanannya ialah Yerusalem dan karena akar yang sama muncul dua kali dalam ayat ini.
- source_word: שֵׁשְׁבַּצַּר
  choice: Sesbazar
  rationale: Nama pribadi ditransliterasikan mengikuti bentuk Indonesia yang lazim.
- source_word: עִם
  choice: bersama
  rationale: 'Kata ini menyatakan penyertaan: benda-benda tersebut dibawa seiring dengan rombongan orang buangan.'
- source_word: הֵעָלוֹת הַגּוֹלָה
  choice: ketika mereka dibawa naik
  rationale: Konstruksi infinitif Hifil menyatakan keadaan atau waktu kepulangan komunitas buangan. Klausa waktu mempertahankan nuansa kausatif/pasif sambil tetap alami dalam bahasa Indonesia.
- source_word: הַגּוֹלָה
  choice: orang-orang buangan
  rationale: Dalam konteks ini kata tersebut menunjuk kepada komunitas yang dahulu dibuang dan kini kembali, bukan hanya keadaan abstrak berupa pembuangan.
- source_word: מִבָּבֶל לִירוּשָׁלִָם
  choice: dari Babel ke Yerusalem
  rationale: Terjemahan langsung bagi nama tempat dan arah gerakan.
theological_decisions:
- issue: Bahasa kenaikan menuju Yerusalem dalam עלה
  choice: Mempertahankan “naik” pada kedua kemunculan gagasan tersebut
  alternative: membawa; pergi
  rationale: Bahasa Ibrani memakai akar עלה dua kali dan mencerminkan ungkapan lazim tentang perjalanan naik ke Yerusalem. Mempertahankannya menjaga nuansa geografis dan sastra tanpa menambahkan klaim doktrinal.
- issue: Rujukan הַגּוֹלָה
  choice: orang-orang buangan, yaitu komunitas manusia
  alternative: pembuangan; masa pembuangan; komunitas pembuangan
  rationale: Konteks menggambarkan rombongan yang kembali dari Babel. Pilihan ini jelas bagi pembaca modern sekaligus tidak menghapus kemungkinan bahwa nomina itu memandang mereka sebagai komunitas buangan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Perlengkapan” dipilih sebagai istilah umum yang mudah dipahami; “orang-orang buangan” menghindari ungkapan abstrak atau arkais; dan pengulangan “naik” sengaja dipertahankan untuk mencerminkan corak sumber Ibrani.
