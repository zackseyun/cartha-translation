  text: וַ/יּֽוֹצִיאֵ֗/ם כּ֚וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס עַל יַ֖ד מִתְרְדָ֣ת הַ/גִּזְבָּ֑ר וַֽ/יִּסְפְּרֵ/ם֙ לְ/שֵׁשְׁבַּצַּ֔ר הַ/נָּשִׂ֖יא לִ/יהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/008.yaml
  text: King Cyrus of Persia brought them out by the hand of Mithredath the treasurer[a], and counted them out to Sheshbazzar[b], the prince of Judah.
translation:
  language: id
  text: Kores, raja Persia, mengeluarkan benda-benda itu melalui Mitredat, bendahara itu,[a] lalu menghitungnya bagi Sesbazar, pemimpin Yehuda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “melalui tangan Mitredat, bendahara itu.” Ungkapan Ibrani ini menunjukkan perantaraan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “pangeran Yehuda.” Istilah Ibrani ini dapat berarti kepala, pemimpin, atau penguasa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: mengeluarkan semuanya
  rationale: Bentuk Hifil dari יצא menyatakan tindakan menyebabkan keluar. Pronomina objek merujuk kepada perlengkapan rumah TUHAN pada ayat sebelumnya; 'semuanya' secara alami menunjukkan seluruh benda tersebut tanpa menyiratkan orang.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Kores, raja Persia
  rationale: Mempertahankan nama dan gelar lengkap dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: עַל יַד
  choice: melalui
  rationale: Ungkapan Ibrani yang secara harfiah berarti 'melalui tangan' menyatakan perantaraan atau keagenan. 'Melalui' alami dalam bahasa Indonesia dan tidak menambahkan rincian tentang tata cara penyerahan.
- source_word: מִתְרְדָת
  choice: Mitredat
  rationale: Transliterasi nama Persia yang mengikuti bentuk konvensional dalam Alkitab bahasa Indonesia.
- source_word: הַגִּזְבָּר
  choice: bendahara itu
  rationale: Menunjuk pejabat yang bertanggung jawab atas perbendaharaan; kata sandang tertentu dipertahankan dengan 'itu'.
- source_word: וַיִּסְפְּרֵם
  choice: menghitung dan menyerahkannya
  rationale: Kata ספר secara langsung berarti menghitung atau mencatat jumlah. Dalam konteks benda yang dikeluarkan melalui seorang pejabat kepada Sesbazar, konstruksi dengan לְ juga mencakup penghitungan kepada penerima; ungkapan ini menyampaikan tindakan menghitung dalam proses serah terima tanpa mengaburkan makna dasarnya.
- source_word: לְשֵׁשְׁבַּצַּר
  choice: kepada Sesbazar
  rationale: Preposisi לְ menandai Sesbazar sebagai penerima; nama ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: הַנָּשִׂיא
  choice: pemimpin
  rationale: נָשִׂיא dapat berarti kepala, pemimpin, atau penguasa. 'Pemimpin' mempertahankan keluasan maknanya dan tidak memasukkan gelar administratif Persia yang lebih khusus seperti 'gubernur'.
- source_word: לִיהוּדָה
  choice: Yehuda
  rationale: Dengan sebutan 'pemimpin', hubungan yang ditandai לְ dapat dinyatakan secara alami sebagai 'pemimpin Yehuda', yakni pemimpin yang berkaitan dengan Yehuda.
theological_decisions:
- issue: Gelar Sesbazar dan sifat kedudukannya
  choice: pemimpin Yehuda
  alternative: pangeran Yehuda; gubernur Yehuda
  rationale: Teks memakai נָשִׂיא, sebutan luas untuk orang terkemuka atau penguasa. 'Pemimpin' tidak memastikan garis keturunan kerajaan seperti yang mungkin disiratkan 'pangeran' dan tidak menggantikannya dengan gelar administratif khusus 'gubernur'.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Kalimat mempertahankan urutan tindakan dalam teks Ibrani, sedangkan idiom keagenan dialihkan secara alami. Semua penanda catatan kaki ditempatkan dalam teks utama.
