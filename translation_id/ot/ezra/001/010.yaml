  text: 30 mangkuk emas, 410 mangkuk perak dari jenis kedua[a], dan 1.000 benda-benda lainnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “410 mangkuk perak rangkap.” Arti istilah Ibrani yang diterjemahkan “jenis kedua” tidak pasti dalam konteks daftar inventaris ini; istilah itu mungkin menunjukkan golongan kedua, barang duplikat, atau bentuk rangkap.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפוֹרֵי
  choice: mangkuk
  rationale: Kata ini menunjuk pada sejenis wadah. Dalam daftar inventaris ini, “mangkuk” merupakan padanan Indonesia yang jelas dan alami tanpa menentukan bentuknya secara berlebihan.
- source_word: זָהָב
  choice: emas
  rationale: Istilah baku untuk bahan; di sini menerangkan jenis wadah.
- source_word: שְׁלֹשִׁים
  choice: '30'
  rationale: Angka ditulis dengan numeralia agar daftar inventaris mudah dibaca.
- source_word: כְּפוֹרֵי כֶסֶף
  choice: mangkuk perak
  rationale: Istilah wadah diterjemahkan secara konsisten, sedangkan “perak” menyatakan bahannya.
- source_word: מִשְׁנִים
  choice: jenis kedua
  rationale: Makna istilah ini tidak pasti dalam konteks inventaris. Pilihan ini mempertahankan pembedaan kelompok tanpa memastikan bahwa artinya harus “rangkap” atau “duplikat”.
- source_word: אַרְבַּע מֵאוֹת וַעֲשָׂרָה
  choice: '410'
  rationale: Angka majemuk ditulis dengan numeralia agar ringkas dan konsisten.
- source_word: כֵּלִים
  choice: perkakas
  rationale: Istilah ini luas, mencakup berbagai benda atau perlengkapan, termasuk perlengkapan ibadah. “Perkakas” alami dalam bahasa Indonesia dan tidak membatasi semua benda itu sebagai wadah.
- source_word: אֲחֵרִים
  choice: lainnya
  rationale: Menandai benda-benda selain kelompok yang baru disebutkan.
- source_word: אָלֶף
  choice: '1.000'
  rationale: Angka ditulis dengan numeralia dan mengikuti kaidah penulisan bilangan bahasa Indonesia.
