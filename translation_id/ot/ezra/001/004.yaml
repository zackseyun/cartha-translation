revisions:
- from: Dan setiap orang yang masih tinggal, di mana pun ia menetap,[a] harus dibantu oleh orang-orang di tempat tinggalnya[b] dengan perak dan emas, barang-barang, serta ternak,[c] di samping persembahan sukarela untuk rumah Allah yang ada di Yerusalem.
  to: Dan setiap orang yang masih tinggal, di mana pun ia menetap,[a] hendaklah laki-laki di tempatnya[b] membantunya[c] dengan perak, emas, barang-barang, dan ternak, bersama dengan persembahan sukarela untuk rumah Allah yang ada di Yerusalem.
  rationale: Revisi memulihkan padanan maskulin eksplisit bagi אַנְשֵׁי, menjadikan daya perintah lebih transparan melalui “hendaklah”, memindahkan jangkar catatan verba ke “membantunya”, dan mengganti “di samping” dengan “bersama dengan” untuk mengikuti עִם secara lebih netral. Makna keseluruhan tidak diubah.
