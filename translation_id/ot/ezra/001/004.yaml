  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כָל הַ/נִּשְׁאָ֗ר מִֽ/כָּל הַ/מְּקֹמוֹת֮ אֲשֶׁ֣ר ה֣וּא גָֽר שָׁם֒ יְנַשְּׂא֨וּ/הוּ֙ אַנְשֵׁ֣י מְקֹמ֔/וֹ בְּ/כֶ֥סֶף וּ/בְ/זָהָ֖ב וּ/בִ/רְכ֣וּשׁ וּ/בִ/בְהֵמָ֑ה עִם הַ֨/נְּדָבָ֔ה לְ/בֵ֥ית הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/004.yaml
  text: And everyone who remains[a], in any place where he is living, let the men of his place support him with silver and gold, with goods and with livestock[c][b], together with the freewill offering for the house of God that is in Jerusalem.
translation:
  language: id
  text: Dan setiap orang yang masih tinggal, di mana pun ia menetap,[a] hendaklah laki-laki di tempatnya[b] membantunya[c] dengan perak, emas, barang-barang, dan ternak, bersama dengan persembahan sukarela untuk rumah Allah yang ada di Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di mana pun ia tinggal sebagai pendatang.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “laki-laki di tempatnya”; ungkapan ini mungkin menunjuk lebih luas kepada penduduk setempat atau para tetangganya.'
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani yang diterjemahkan “membantunya” secara harfiah berarti “mengangkat” atau “membawa”; di sini maksudnya memberikan bantuan praktis.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָר
  choice: setiap orang yang masih tinggal
  rationale: Partisipel Nifal dari שׁאר menunjuk kepada orang yang tetap tinggal atau tertinggal, dalam konteks ini orang Yehuda yang tidak ikut kembali pada saat itu.
- source_word: מִכָּל הַמְּקֹמוֹת אֲשֶׁר הוּא גָר שָׁם
  choice: di mana pun ia menetap
  rationale: Ungkapan ini menunjukkan tempat kediamannya di perantauan. גּוּר dapat berarti tinggal sementara atau menetap; terjemahan ini alami tanpa menentukan lamanya tinggal.
- source_word: יְנַשְּׂאֻהוּ
  choice: harus dibantu
  rationale: נשׂא secara harfiah berarti mengangkat atau membawa, tetapi bersama daftar sarana materi di sini menyatakan bantuan praktis.
- source_word: אַנְשֵׁי מְקֹמוֹ
  choice: orang-orang di tempat tinggalnya
  rationale: Secara harfiah berarti 'laki-laki dari tempatnya', tetapi dalam konteks sosial dapat menunjuk lebih luas kepada penduduk setempat atau para tetangga.
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: dengan perak dan emas
  rationale: Mempertahankan istilah logam mulia tanpa mempersempit כֶּסֶף menjadi uang.
- source_word: וּבִרְכוּשׁ
  choice: barang-barang
  rationale: רְכוּשׁ menunjuk kepada harta benda atau milik bergerak; 'barang-barang' wajar dalam daftar bantuan materi.
- source_word: וּבִבְהֵמָה
  choice: serta ternak
  rationale: בְּהֵמָה berbentuk kolektif dan di sini menunjuk kepada hewan piaraan sebagai milik atau sarana perjalanan.
- source_word: עִם הַנְּדָבָה
  choice: di samping persembahan sukarela
  rationale: נְדָבָה adalah pemberian yang diberikan dengan sukarela; עִם di sini menghubungkannya dengan bantuan materi lain.
- source_word: לְבֵית הָאֱלֹהִים
  choice: untuk rumah Allah
  rationale: Mempertahankan ungkapan Ibrani 'rumah Allah' daripada menggantinya secara interpretatif dengan 'Bait Allah' atau 'bait suci'.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: yang ada di Yerusalem
  rationale: Klausa relatif sederhana yang menunjukkan lokasi rumah Allah.
theological_decisions:
- issue: Cakupan gender אַנְשֵׁי מְקֹמוֹ
  choice: orang-orang di tempat tinggalnya
  alternative: laki-laki di tempat tinggalnya
  rationale: Bentuk Ibraninya maskulin jamak, tetapi konstruksi ini dapat berfungsi sebagai sebutan sosial bagi penduduk setempat. Catatan kaki mempertahankan informasi bentuk harfiahnya tanpa membatasi cakupan secara tidak pasti.
- issue: Makna kontekstual יְנַשְּׂאֻהוּ
  choice: harus dibantu
  alternative: harus diangkat/dibawa
  rationale: Makna harfiah 'mengangkat/membawa' akan menyesatkan dalam konteks penyediaan perak, emas, barang, dan ternak. 'Dibantu' menyampaikan fungsi idiomatisnya sambil mencatat citra harfiah.
- issue: Hubungan עִם הַנְּדָבָה dengan daftar bantuan
  choice: di samping persembahan sukarela
  alternative: bersama dengan persembahan sukarela
  rationale: Teks dapat dipahami sebagai bantuan bagi orang yang pulang ditambah persembahan khusus bagi rumah Allah. 'Di samping' membuat pembedaan tujuan ini jelas, tanpa mengubah sifat sukarela persembahan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada resmi dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum; istilah 'rumah Allah', 'persembahan sukarela', serta daftar benda mempertahankan warna teks Ibrani. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskannya.
