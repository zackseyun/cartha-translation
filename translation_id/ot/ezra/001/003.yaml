  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִֽי בָ/כֶ֣ם מִ/כָּל עַמּ֗/וֹ יְהִ֤י אֱלֹהָי/ו֙ עִמּ֔/וֹ וְ/יַ֕עַל לִ/ירוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּ/יהוּדָ֑ה וְ/יִ֗בֶן אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל ה֥וּא הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/003.yaml
  text: Whoever among all his people is among you[a], may his God be with him, and let him go up to Jerusalem, which is in Judah, and rebuild the house of Yahweh[b], the God of Israel—he is the God who is in Jerusalem.
translation:
  language: id
  text: Siapa pun di antara kalian yang termasuk umat-Nya, semoga Allahnya menyertainya. Hendaklah ia naik ke Yerusalem yang terletak di Yehuda dan membangun kembali rumah Yahweh, Allah Israel—Dialah Allah yang ada di Yerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membangun rumah Yahweh.” Kata kerja Ibraninya berarti “membangun”; “membangun kembali” memperjelas konteks pemulihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: Siapa pun di antara kalian yang termasuk umat-Nya
  rationale: מִי dalam konteks maklumat ini berfungsi sebagai undangan tak tentu, sehingga wajar diterjemahkan 'siapa pun'. Susunan Indonesia ini mempertahankan unsur 'di antara kalian' dan 'dari seluruh umat-Nya' tanpa kekakuan yang tidak perlu; 'umat-Nya' mempertahankan sufiks orang ketiga tanpa menambahkan rujukan yang tidak tersurat.
- source_word: יְהִי אֱלֹהָיו עִמּוֹ
  choice: semoga Allahnya menyertainya
  rationale: Bentuk jusif יְהִי menyatakan harapan atau berkat. 'Semoga' mempertahankan nada restu dalam maklumat kerajaan.
- source_word: וְיַעַל
  choice: Biarlah ia pergi
  rationale: עלה secara harfiah berarti 'naik' dan lazim dipakai untuk perjalanan menuju Yerusalem. Dalam bahasa Indonesia, 'pergi' lebih alami dalam konteks ini, sementara tujuan Yerusalem tetap mempertahankan maksud ungkapan tersebut.
- source_word: לִירוּשָׁלַם אֲשֶׁר בִּיהוּדָה
  choice: ke Yerusalem yang terletak di Yehuda
  rationale: Klausa relatif mengidentifikasi Yerusalem secara geografis. 'Yang terletak di Yehuda' jelas dan alami dalam bahasa Indonesia modern.
- source_word: וְיִבֶן
  choice: dan membangun kembali
  rationale: בנה berarti 'membangun', tetapi konteks pemulihan sesudah kehancuran Bait Allah mendukung 'membangun kembali'. Alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan metafora Ibrani 'rumah' dan menerjemahkan nama ilahi יהוה sebagai 'Yahweh'.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Terjemahan lugas dari konstruksi posesif Ibrani dan alami dalam pemakaian bahasa Indonesia Alkitabiah.
- source_word: הוּא הָאֱלֹהִים
  choice: Dialah Allah
  rationale: Kata ganti הוּא memberi penegasan, sedangkan artikel pada הָאֱלֹהִים mendukung identifikasi tertentu. 'Dialah Allah' menyampaikan keduanya secara alami.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: yang ada di Yerusalem
  rationale: Mempertahankan klausa lokatif dalam bentuk historisnya tanpa melunakkan atau menyelaraskannya dengan rumusan teologis lain.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memuat Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Klausa yang mengaitkan Allah dengan Yerusalem
  choice: Dialah Allah yang ada di Yerusalem
  alternative: Dialah Allah, yang disembah di Yerusalem; Dialah Allah atas Yerusalem
  rationale: Maklumat Koresh memakai ungkapan lokatif yang mencerminkan idiom kerajaan kuno dan hubungan Allah Israel dengan rumah-Nya di Yerusalem. Terjemahan mempertahankan ketegangan historis-teologis itu tanpa penjelasan harmonisasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada resmi dan bermartabat. 'Kalian' dipilih untuk menandai bentuk jamak בָכֶם dengan jelas; 'ia' menjaga gaya tertulis yang wajar. Klausa-klausa panjang dipecah menjadi dua kalimat agar mudah dipahami tanpa mengubah hubungan logis teks.
