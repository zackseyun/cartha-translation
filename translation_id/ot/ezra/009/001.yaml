source:
  edition: WLC
  text: וּ/כְ/כַלּ֣וֹת אֵ֗לֶּה נִגְּשׁ֨וּ אֵלַ֤/י הַ/שָּׂרִים֙ לֵ/אמֹ֔ר לֹֽא נִבְדְּל֞וּ הָ/עָ֤ם יִשְׂרָאֵל֙ וְ/הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת כְּ֠/תוֹעֲבֹֽתֵי/הֶם לַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הַ/פְּרִזִּ֣י הַ/יְבוּסִ֗י הָֽ/עַמֹּנִי֙ הַ/מֹּ֣אָבִ֔י הַ/מִּצְרִ֖י וְ/הָ/אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/001.yaml
  text: When these things were finished[a], the officials approached me, saying, “The people of Israel, and the priests and the Levites, have not separated themselves from the peoples of the lands, according to their abominations—the Canaanites, the Hittites, the Perizzites, the Jebusites, the Ammonites, the Moabites, the Egyptians, and the Amorites.”
translation:
  language: id
  text: Ketika semua hal ini telah selesai, para pejabat menghampiri aku dan berkata, “Bangsa Israel, para imam, dan orang-orang Lewi tidak memisahkan diri dari bangsa-bangsa negeri-negeri itu, sesuai dengan kekejian mereka[a]—orang Kanaan, orang Het, orang Feris, orang Yebus, orang Amon, orang Moab, orang Mesir, dan orang Amori.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menurut kekejian-kekejian mereka.” Istilah Ibrani ini sangat kuat dan sering dipakai untuk tindakan yang tercela secara keagamaan, termasuk praktik penyembahan berhala.
    reason: Menjelaskan kekuatan istilah תועבות dan mempertahankan kemungkinan lain bagi hubungan yang dinyatakan oleh preposisi כ.
lexical_decisions:
- source_word: וּכְכַלּוֹת אֵלֶּה
  choice: Ketika semua hal ini telah selesai
  rationale: Konjungsi, preposisi temporal, dan infinitif konstruk dari כלה membentuk klausa waktu. Ungkapan ini mempertahankan urutan narasi tanpa menambahkan penanda waktu yang tidak ada dalam bahasa sumber.
- source_word: נִגְּשׁוּ אֵלַי
  choice: menghampiri aku
  rationale: Bentuk Nifal dari נגשׁ menyatakan gerakan mendekat kepada Ezra; ‘menghampiri’ alami dalam bahasa Indonesia dan mempertahankan unsur geraknya.
- source_word: הַשָּׂרִים
  choice: para pejabat
  rationale: שׂרים menunjuk kepada para pemimpin atau pejabat pemerintahan. ‘Para pejabat’ sesuai dengan latar administratif zaman Persia dan tidak memberi kesan bahwa mereka putra raja.
- source_word: לֵאמֹר
  choice: dan berkata
  rationale: Infinitif pengutip ini memperkenalkan perkataan langsung. Dalam narasi Indonesia, ‘dan berkata’ lebih alami daripada terjemahan harfiah ‘dengan mengatakan’.
- source_word: לֹא נִבְדְּלוּ
  choice: tidak memisahkan diri
  rationale: 'Bentuk Nifal בדל di sini memiliki nuansa refleksif: kelompok-kelompok tersebut tidak menjaga pemisahan mereka dari bangsa-bangsa lain.'
- source_word: הָעָם יִשְׂרָאֵל וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: Bangsa Israel, para imam, dan orang-orang Lewi
  rationale: Ketiga kelompok dikoordinasikan di bawah tuduhan verbal yang sama. Bentuk ini jelas dan wajar bagi pembaca Indonesia.
- source_word: מֵעַמֵּי הָאֲרָצוֹת
  choice: dari bangsa-bangsa di berbagai negeri
  rationale: Terjemahan ini mempertahankan bentuk jamak ‘bangsa-bangsa’ dan ‘negeri-negeri’ tanpa menambahkan gagasan bahwa semuanya pasti negeri yang berdekatan.
- source_word: כְּתוֹעֲבֹתֵיהֶם
  choice: dalam hal praktik-praktik mereka yang menjijikkan
  rationale: כ dapat menyatakan hubungan, perbandingan, atau kesesuaian. ‘Dalam hal’ menjaga kelonggaran hubungan sintaksis itu, sedangkan ‘praktik-praktik ... yang menjijikkan’ menyampaikan daya moral-religius תועבות dalam bahasa Indonesia yang alami.
- source_word: לַכְּנַעֲנִי ... וְהָאֱמֹרִי
  choice: orang Kanaan, orang Het, orang Feris, orang Yebus, orang Amon, orang Moab, orang Mesir, dan orang Amori
  rationale: Walaupun setiap sebutan bangsa berbentuk gentilisia tunggal dalam bahasa Ibrani, daftar ini mengacu kepada kelompok-kelompok etnis. Pengulangan ‘orang’ membuat setiap nama jelas dan sejajar dalam bahasa Indonesia.
theological_decisions:
- issue: Kekuatan moral-religius istilah תועבות
  choice: praktik-praktik mereka yang menjijikkan
  alternative: kekejian-kekejian mereka
  rationale: Pilihan utama menyatakan bahwa yang dimaksud ialah tindakan atau kebiasaan yang sangat tercela, termasuk yang bersifat religius atau berhala, tanpa membatasi istilah hanya pada satu jenis dosa. Catatan kaki mempertahankan padanan formalnya.
- issue: Cakupan tuduhan terhadap kelompok-kelompok Israel
  choice: Bangsa Israel, para imam, dan orang-orang Lewi semuanya berada di bawah klausa ‘tidak memisahkan diri’
  alternative: Tuduhan terutama ditujukan kepada rakyat biasa, sedangkan imam dan orang Lewi hanya tambahan sekunder
  rationale: Sintaksis Ibrani mengoordinasikan ketiga kelompok sebagai subjek klausa yang sama; terjemahan tidak mempersempit cakupan tuduhan.
- issue: Hubungan sintaksis כְּתוֹעֲבֹתֵיהֶם dengan tindakan tidak memisahkan diri
  choice: dalam hal praktik-praktik mereka yang menjijikkan
  alternative: sesuai dengan kekejian-kekejian mereka
  rationale: Preposisi כ memungkinkan nuansa hubungan, perbandingan, atau kesesuaian. Rumusan utama menghindari penambahan kata kerja seperti ‘mengikuti’ sebagai kepastian eksplisit, sehingga ambiguitas sumber tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Istilah administratif ‘para pejabat’ dipilih sesuai konteks sejarah, sedangkan daftar etnis disajikan dengan pola yang jelas bagi pembaca umum.
