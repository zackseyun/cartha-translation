  verdict: revise
  source_fidelity: Perlu koreksi kecil. ‘Di berbagai negeri’ tidak secara tepat menerjemahkan מֵעַמֵּי הָאֲרָצוֹת (‘dari bangsa-bangsa negeri-negeri/tanah-tanah’), karena ‘berbagai’ menambahkan nuansa distributif yang tidak dinyatakan. Selain itu, ‘dalam hal praktik-praktik’ kurang langsung menyatakan relasi כְּתוֹעֲבֹתֵיהֶם dan menggeser nomina kuat ‘kekejian’ menjadi uraian yang lebih lunak.
  naturalness: Susunan naratif, ‘para pejabat menghampiri aku’, dan daftar etnisnya sudah alami dalam bahasa Indonesia baku modern. ‘Sesuai dengan kekejian mereka’ tetap alami, lebih dekat pada bentuk sumber, dan membiarkan hubungan sintaksisnya tidak terlalu ditafsirkan.
  terminology: ‘Para pejabat’, ‘para imam’, dan ‘orang-orang Lewi’ sesuai register dan konteks. ‘Kekejian’ adalah padanan yang tepat untuk תּוֹעֵבוֹת dan mempertahankan daya religius-etisnya tanpa menentukan praktik tertentu.
  issues:
  - severity: medium
    issue: ‘di berbagai negeri’
    rationale: Frasa ini mengubah preposisi מִן (‘dari’) menjadi lokasi ‘di’ dan menambahkan ‘berbagai’. Bentuk jamak sumber dapat diterjemahkan tanpa tambahan tersebut sebagai ‘dari bangsa-bangsa negeri-negeri itu’.
  - severity: low
    issue: ‘dalam hal praktik-praktik mereka yang menjijikkan’
    rationale: Parafrasa ini kurang mempertahankan nomina kunci תּוֹעֵבוֹת (‘kekejian’) dan hubungan yang ditandai כְּ. ‘Sesuai dengan kekejian mereka’ lebih setia dan tetap tidak memaksakan penafsiran seperti ‘mengikuti’.
  revised_text: Ketika semua hal ini telah selesai, para pejabat menghampiri aku dan berkata, “Bangsa Israel, para imam, dan orang-orang Lewi tidak memisahkan diri dari bangsa-bangsa negeri-negeri itu, sesuai dengan kekejian mereka[a]—orang Kanaan, orang Het, orang Feris, orang Yebus, orang Amon, orang Moab, orang Mesir, dan orang Amori.”
