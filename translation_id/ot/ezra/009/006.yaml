  text: וָ/אֹמְרָ֗/ה אֱלֹהַ/י֙ בֹּ֣שְׁתִּי וְ/נִכְלַ֔מְתִּי לְ/הָרִ֧ים אֱלֹהַ֛/י פָּנַ֖/י אֵלֶ֑י/ךָ כִּ֣י עֲוֺנֹתֵ֤י/נוּ רָבוּ֙ לְ/מַ֣עְלָ/ה רֹּ֔אשׁ וְ/אַשְׁמָתֵ֥/נוּ גָדְלָ֖ה עַ֥ד לַ/שָּׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/006.yaml
  text: And I said[a], “My God, I am ashamed and humiliated to lift up my face to you, my God, because our iniquities have multiplied above our heads, and our guilt has grown as high as the heavens.”
translation:
  language: id
  text: Lalu aku berkata, “Ya Allahku, aku malu dan merasa terhina untuk mengangkat wajahku kepada-Mu, ya Allahku, sebab pelanggaran kami telah bertambah banyak hingga melampaui kepala kami,[a] dan kesalahan kami telah menjadi besar hingga mencapai langit.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di atas kepala kami.” Dalam bahasa Ibrani, “kepala” berbentuk tunggal, tetapi dipakai secara kolektif untuk kami.
    reason: Menjelaskan idiom Ibrani dan bentuk tunggal kolektif tanpa mengubah gambaran teks sumber.
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Lalu aku berkata
  rationale: Menyampaikan kelanjutan narasi dari waw-konsekutif secara alami dalam bahasa Indonesia tanpa menambahkan penafsiran.
- source_word: בֹּשְׁתִּי וְנִכְלַמְתִּי
  choice: aku malu dan merasa terhina
  rationale: 'Mempertahankan dua ungkapan yang saling menguatkan: rasa malu pribadi dan pengalaman aib atau kehinaan.'
- source_word: לְהָרִים ... פָּנַי אֵלֶיךָ
  choice: untuk mengangkat wajahku kepada-Mu
  rationale: Mempertahankan gambaran Ibrani tentang menghadap Allah secara terbuka; 'wajah' tidak diganti dengan 'mata'.
- source_word: עֲוֺנֹתֵינוּ
  choice: kedurhakaan-kedurhakaan kami
  rationale: Mengungkapkan bobot moral עָוֹן dan membedakannya dari אַשְׁמָה pada klausa berikutnya.
- source_word: רָבוּ
  choice: telah bertambah banyak
  rationale: Menunjukkan proses menjadi banyak, bukan sekadar keadaan statis.
- source_word: לְמַעְלָה רֹאשׁ
  choice: hingga melampaui kepala kami
  rationale: Mempertahankan citra vertikal dari ungkapan Ibrani sambil memakai bentuk Indonesia yang dapat dipahami; bentuk sumber memakai 'kepala' tunggal dengan kepunyaan jamak.
- source_word: אַשְׁמָתֵנוּ
  choice: kesalahan kami
  rationale: Dalam konteks ini menunjuk pada kesalahan atau keadaan bersalah, bukan persembahan penebus salah; dipilih berbeda dari 'kedurhakaan-kedurhakaan'.
- source_word: גָדְלָה עַד לַשָּׁמָיִם
  choice: telah membesar sampai ke langit
  rationale: Menjaga hiperbola dan arah vertikal teks sumber dengan ungkapan Indonesia yang lugas.
- source_word: אֱלֹהַי
  choice: Ya Allahku
  rationale: Menandai sapaan langsung secara alami dan mempertahankan pengulangannya untuk penekanan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'Ya Allahku' serta citra 'mengangkat wajah', kepala, dan langit dipertahankan. Bentuk jamak ulang pada 'kedurhakaan-kedurhakaan' menyampaikan banyaknya pelanggaran, sedangkan 'kesalahan' pada klausa kedua menjaga pembedaan leksikal.
