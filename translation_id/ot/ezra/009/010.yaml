id: EZR.9.10
reference: Ezra 9:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֛ה מַה נֹּאמַ֥ר אֱלֹהֵ֖י/נוּ אַֽחֲרֵי זֹ֑את כִּ֥י עָזַ֖בְנוּ מִצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/010.yaml
  text: And now[a], what shall we say, our God, after this? For we have forsaken your commandments.
translation:
  language: id
  text: Dan sekarang, apakah yang dapat kami katakan[a], ya Allah kami, setelah ini? Sebab kami telah meninggalkan perintah-perintah-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “apakah yang akan kami katakan.” Bentuk imperfek Ibrani dapat dipahami secara lebih formal demikian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Dan sekarang
  rationale: Mempertahankan baik kata penghubung וְ maupun penanda waktu עַתָּה tanpa menentukan hubungan wacana secara lebih sempit.
- source_word: מַה נֹּאמַר
  choice: apakah yang dapat kami katakan
  rationale: Bentuk imperfek orang pertama jamak di sini bernuansa deliberatif dan retoris; ungkapan ini menyampaikan ketidakberdayaan Ezra untuk berkata-kata dalam pengakuan dosanya.
- source_word: אֱלֹהֵינוּ
  choice: ya Allah kami
  rationale: Bentuk posesif ini berfungsi sebagai sapaan langsung dalam doa; partikel 'ya' menyatakan fungsi vokatif secara alami dalam bahasa Indonesia modern.
- source_word: אַחֲרֵי זֹאת
  choice: setelah ini
  rationale: Ungkapan temporal yang secara ringkas menunjuk kembali kepada dosa dan keadaan yang baru dipaparkan.
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan mengapa Ezra tidak sanggup berkata-kata.
- source_word: עָזַבְנוּ
  choice: kami telah meninggalkan
  rationale: Menjaga bobot tindakan meninggalkan kewajiban perjanjian tanpa menambahkan penafsiran yang tidak dinyatakan.
- source_word: מִצְוֺתֶיךָ
  choice: perintah-perintah-Mu
  rationale: Padanan baku dan bermartabat bagi bentuk jamak 'perintah', dengan akhiran sapaan ilahi dipertahankan.
theological_decisions:
- issue: Nada pengakuan Ezra
  choice: Pertanyaan retoris yang mengungkapkan rasa bersalah dan ketidakmampuan berkata-kata di hadapan Allah
  alternative: Permintaan biasa untuk mendapat petunjuk tentang apa yang harus dikatakan selanjutnya
  rationale: Alasan yang menyusul—bahwa umat telah meninggalkan perintah-perintah Allah—menunjukkan bahwa ini adalah bahasa penyesalan, bukan sekadar pertimbangan netral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan sapaan dibuat alami bagi doa dalam bahasa Indonesia, sedangkan pengulangan 'perintah-perintah' mempertahankan bentuk jamak sumber.
