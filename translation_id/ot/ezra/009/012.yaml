revisions:
- from: Maka sekarang, janganlah kamu memberikan anak-anak perempuanmu kepada anak-anak laki-laki mereka, dan janganlah kamu mengambil anak-anak perempuan mereka bagi anak-anak laki-lakimu. Janganlah sekali-kali mengusahakan kedamaian ataupun kesejahteraan[a] mereka, supaya kamu menjadi kuat, menikmati hasil baik negeri itu, dan mewariskan negeri itu kepada anak-anak laki-lakimu untuk selama-lamanya.[b]
  to: Maka sekarang, janganlah kamu memberikan putri-putrimu kepada putra-putra mereka, dan janganlah kamu mengambil putri-putri mereka bagi putra-putramu. Janganlah kamu sekali-kali mengusahakan kedamaian dan kesejahteraan mereka[a], supaya kamu menjadi kuat, menikmati yang baik dari negeri itu, dan mewariskannya kepada putra-putramu untuk selama-lamanya.[b]
  rationale: Revisi memindahkan catatan tentang bentuk harfiah larangan ke lokasi yang tepat, mempertahankan ambiguitas objek pada kata kerja kausatif “mewariskan”, dan memperhalus istilah kekerabatan ke bahasa Indonesia baku modern. Larangan historis dalam konteks Ezra tetap diterjemahkan secara langsung tanpa pelunakan atau perluasan penerapan.
