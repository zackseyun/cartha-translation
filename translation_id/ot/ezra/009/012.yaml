source:
  edition: WLC
  text: וְ֠/עַתָּה בְּֽנוֹתֵי/כֶ֞ם אַל תִּתְּנ֣וּ לִ/בְנֵי/הֶ֗ם וּ/בְנֹֽתֵי/הֶם֙ אַל תִּשְׂא֣וּ לִ/בְנֵי/כֶ֔ם וְ/לֹֽא תִדְרְשׁ֧וּ שְׁלֹמָ֛/ם וְ/טוֹבָתָ֖/ם עַד עוֹלָ֑ם לְמַ֣עַן תֶּחֶזְק֗וּ וַ/אֲכַלְתֶּם֙ אֶת ט֣וּב הָ/אָ֔רֶץ וְ/הוֹרַשְׁתֶּ֥ם לִ/בְנֵי/כֶ֖ם עַד עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/012.yaml
  text: So now[a], do not give your daughters to their sons, and do not take their daughters for your sons. Never seek their peace or their prosperity[b], so that you may be strong and eat the good of the land and leave it as an inheritance to your sons forever.
translation:
  language: id
  text: Maka sekarang, janganlah kamu memberikan putri-putrimu kepada putra-putra mereka, dan janganlah kamu mengambil putri-putri mereka bagi putra-putramu. Janganlah kamu sekali-kali mengusahakan kedamaian dan kesejahteraan mereka[a], supaya kamu menjadi kuat, menikmati yang baik dari negeri itu, dan mewariskannya kepada putra-putramu untuk selama-lamanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “janganlah mencari kedamaian dan kebaikan mereka untuk selama-lamanya.”
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani ini tidak menyebutkan ulang objeknya; dapat dipahami sebagai “membuat putra-putramu mewarisinya untuk selama-lamanya.”
    reason: source_ambiguity
lexical_decisions:
- source_word: בְּנוֹתֵיכֶם ... לִבְנֵיהֶם
  choice: memberikan anak-anak perempuanmu kepada anak-anak laki-laki mereka
  rationale: Mempertahankan susunan konkret bahasa Ibrani. Dalam kesejajaran dengan klausa berikutnya, pemberian ini jelas merujuk pada perkawinan tanpa perlu menambahkan kata yang tidak dinyatakan.
- source_word: וּבְנֹתֵיהֶם אַל תִּשְׂאוּ לִבְנֵיכֶם
  choice: janganlah kamu mengambil anak-anak perempuan mereka bagi anak-anak laki-lakimu
  rationale: Kata נשׂא di sini merupakan ungkapan tentang mengambil perempuan sebagai istri. Terjemahan ini mempertahankan kesejajaran dengan klausa pertama dan frasa לִבְנֵיכֶם.
- source_word: תִדְרְשׁוּ
  choice: mengusahakan
  rationale: דרש berarti mencari atau mengupayakan dengan aktif. Dalam bahasa Indonesia, 'mengusahakan kedamaian ataupun kesejahteraan mereka' menyampaikan kepedulian aktif terhadap keadaan mereka dengan lebih wajar daripada 'mencari kedamaian mereka'.
- source_word: שְׁלֹמָם
  choice: kedamaian mereka
  rationale: שׁלום dapat menunjuk pada damai, keutuhan, atau keadaan baik. 'Kedamaian' mempertahankan padanan langsung sambil membiarkan kata berikutnya melengkapi cakupan maknanya.
- source_word: וְטוֹבָתָם
  choice: kesejahteraan mereka
  rationale: טובה di sini berarti kebaikan, manfaat, atau keadaan sejahtera. 'Kesejahteraan' alami dalam konteks ini; arti harfiahnya dicatat dalam catatan kaki.
- source_word: עַד עוֹלָם
  choice: sekali-kali
  rationale: Dalam larangan, frasa ini menyatakan larangan yang terus berlaku. 'Janganlah sekali-kali' menyampaikan daya larangan itu secara alami, meskipun unsur durasinya secara harfiah adalah 'untuk selama-lamanya'.
- source_word: לְמַעַן תֶּחֶזְקוּ
  choice: supaya kamu menjadi kuat
  rationale: Mempertahankan fungsi tujuan/hasil dari לְמַעַן dan arti Qal חזק, yaitu menjadi atau tetap kuat.
- source_word: וַאֲכַלְתֶּם אֶת טוּב הָאָרֶץ
  choice: menikmati hasil baik negeri itu
  rationale: Secara harfiah ungkapan ini berbunyi 'memakan yang baik dari negeri itu'. 'Menikmati hasil baik' menyampaikan idiom tentang menikmati kelimpahan negeri secara alami sambil mempertahankan kaitannya dengan hasil negeri.
- source_word: וְהוֹרַשְׁתֶּם
  choice: mewariskan negeri itu
  rationale: Bentuk Hifil dari ירש bersifat kausatif, yakni membuat generasi berikutnya memiliki atau mewarisi. Objeknya tidak diulang dalam bahasa Ibrani; 'negeri itu' dipasok dari konteks agar kalimat Indonesia jelas.
- source_word: לִבְנֵיכֶם
  choice: kepada anak-anak laki-lakimu
  rationale: Bentuk Ibrani secara leksikal adalah maskulin jamak, 'anak-anak laki-laki'. Terjemahan mempertahankan kekhususan bentuk tersebut tanpa menetralkannya menjadi 'anak-anak'.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Pada akhir ayat, frasa ini menyatakan keberlangsungan warisan lintas generasi. Padanan ini mempertahankan unsur durasi secara langsung.
theological_decisions:
- issue: Bahasa pemisahan etnis dan keagamaan dalam konteks perjanjian pascapembuangan
  choice: Menyampaikan secara langsung larangan perkawinan campur dan larangan mengusahakan kedamaian atau kesejahteraan bangsa-bangsa yang sedang dibicarakan dalam konteks historis Ezra.
  alternative: Melunakkannya menjadi peringatan umum terhadap hubungan yang merusak kerohanian, atau memperluasnya menjadi perintah universal tentang semua orang luar.
  rationale: Ayat ini berada dalam konteks khusus kesetiaan perjanjian Israel pascapembuangan. Terjemahan tidak boleh mengurangi kerasnya kata-kata ayat ataupun mengubahnya menjadi penerapan doktrinal yang tidak dinyatakan teks.
- issue: Objek tersirat pada וְהוֹרַשְׁתֶּם
  choice: Memahami negeri itu sebagai objek yang diwariskan kepada anak-anak laki-laki mereka.
  alternative: 'Memahami ''hasil baik negeri itu'' sebagai objek, atau menerjemahkan tanpa objek: ''membuat anak-anak laki-lakimu mewarisi''.'
  rationale: Konteks terdekat menyebut negeri itu, dan gagasan mewariskan negeri kepada keturunan lazim dalam bahasa perjanjian. Karena objek tidak dinyatakan ulang dalam bahasa Ibrani, catatan kaki mempertahankan bentuk alternatif yang lebih dekat dengan struktur sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Bentuk larangan 'janganlah' mempertahankan nada perintah, sedangkan pengulangan 'anak-anak perempuan' dan 'anak-anak laki-laki' menjaga ketepatan gender dan kesejajaran teks sumber. Istilah 'negeri' dipilih untuk הָאָרֶץ karena konteksnya adalah tanah yang didiami dan diwariskan.
