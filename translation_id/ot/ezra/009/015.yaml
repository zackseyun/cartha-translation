    rationale: Frasa Ibrani itu menyatakan keadaan umat di hadapan Allah—"dalam kesalahan kami"—bukan hanya bahwa mereka membawa kesalahan sebagai suatu pendamping.
  - severity: low
    issue: '"Kaum yang terluput" kurang alami dalam bahasa Indonesia modern.'
    rationale: Pְלֵיטָה menunjuk pada kelompok sisa yang lolos/selamat. "Sisa orang yang terluput" menyampaikan kedua unsur tersebut dengan lebih jelas.
