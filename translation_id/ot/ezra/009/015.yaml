id: EZR.9.15
reference: Ezra 9:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ צַדִּ֣יק אַ֔תָּה כִּֽי נִשְׁאַ֥רְנוּ פְלֵיטָ֖ה כְּ/הַ/יּ֣וֹם הַ/זֶּ֑ה הִנְ/נ֤וּ לְ/פָנֶ֨י/ךָ֙ בְּ/אַשְׁמָתֵ֔י/נוּ כִּ֣י אֵ֥ין לַ/עֲמ֛וֹד לְ/פָנֶ֖י/ךָ עַל זֹֽאת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/015.yaml
  text: O Yahweh[a], God of Israel, you are righteous, for we have been left as a remnant, as it is this day. Here we are before you in our guilt[c][b], for no one can stand before you because of this.
translation:
  language: id
  text: Ya Yahweh, Allah Israel, Engkau adil[a], sebab kami telah dibiarkan tersisa sebagai sisa orang yang terluput[b], sebagaimana pada hari ini. Sesungguhnya, kami berada di hadapan-Mu dalam kesalahan kami, sebab tidak seorang pun dapat berdiri di hadapan-Mu karena hal ini.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “benar.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “kelompok yang selamat” atau “para penyintas.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “tidak ada yang dapat berdiri di hadapan-Mu karena hal ini”; ungkapan ini menyatakan bahwa orang tidak sanggup tetap bertahan di hadirat Allah di bawah kesalahan tersebut.
    reason: idiom_explanation
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar אֱלֹהִים.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Bentuk konstruksi Ibrani diterjemahkan secara ringkas dan wajar dalam ragam Alkitab bahasa Indonesia.
- source_word: צַדִּיק
  choice: benar
  rationale: Mencakup kelurusan moral dan keadilan Allah tanpa membatasi maknanya hanya pada keputusan hukum.
- source_word: נִשְׁאַרְנוּ פְלֵיטָה
  choice: kami telah dibiarkan tersisa sebagai kaum yang terluput
  rationale: Menjaga nuansa pasif bentuk Niphal serta gagasan sekelompok orang yang lolos dari penghukuman dan tetap ada.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: seperti keadaan kami pada hari ini
  rationale: Mengungkapkan keadaan yang nyata pada waktu itu dengan bahasa Indonesia yang alami.
- source_word: הִנְנוּ לְפָנֶיךָ
  choice: Sesungguhnya, kami berada di hadapan-Mu
  rationale: הִנְנוּ merupakan ungkapan presentatif yang menekankan keadaan mereka saat itu; 'Sesungguhnya' mempertahankan penekanan tanpa memakai ungkapan arkais.
- source_word: בְּאַשְׁמָתֵינוּ
  choice: dengan kesalahan kami
  rationale: Menunjukkan bahwa umat datang ke hadapan Allah sambil menanggung keadaan bersalah akibat pelanggaran mereka.
- source_word: כִּי אֵין לַעֲמוֹד לְפָנֶיךָ עַל זֹאת
  choice: sebab tidak seorang pun dapat bertahan di hadapan-Mu karena hal ini
  rationale: Mempertahankan hubungan kausal כִּי dan konstruksi eksistensial impersonal, sambil menyampaikan makna idiomatis 'berdiri' sebagai sanggup bertahan dalam hadirat Allah.
theological_decisions:
- issue: Makna kebenaran Allah dalam pengakuan Ezra
  choice: Engkau benar
  alternative: Engkau adil
  rationale: '''Benar'' mempertahankan cakupan moral dan yudisial צַדִּיק serta ketegangan konteks: Allah benar dalam penghakiman-Nya, tetapi umat yang bersalah masih dibiarkan tersisa.'
- issue: Subjek dalam ungkapan אֵין לַעֲמוֹד
  choice: tidak seorang pun dapat bertahan
  alternative: kami tidak dapat bertahan
  rationale: Bahasa Ibrani memakai konstruksi impersonal, bukan subjek orang pertama yang dinyatakan secara eksplisit. Pilihan ini menjaga bentuk umum pernyataannya, meskipun konteks terutama menunjuk kepada umat yang mengaku bersalah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'Ya Yahweh' serta pronomina ilahi berhuruf kapital mengikuti ragam Alkitab Indonesia. Struktur kausal ayat dipertahankan dengan dua pemakaian 'sebab', dan idiom Ibrani dijelaskan tanpa menghapus daya yudisialnya.
