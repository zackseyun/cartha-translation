revisions:
- from: Ya Yahweh, Allah Israel, Engkau benar[a], sebab kami telah dibiarkan tersisa sebagai kaum yang terluput[b], seperti keadaan kami pada hari ini. Sesungguhnya, kami berada di hadapan-Mu dengan kesalahan kami, sebab tidak seorang pun dapat bertahan di hadapan-Mu karena hal ini.[c]
  to: Ya Yahweh, Allah Israel, Engkau adil[a], sebab kami telah dibiarkan tersisa sebagai sisa orang yang terluput[b], sebagaimana pada hari ini. Sesungguhnya, kami berada di hadapan-Mu dalam kesalahan kami, sebab tidak seorang pun dapat berdiri di hadapan-Mu karena hal ini.[c]
  rationale: Revisi memperjelas keadaan bersalah yang dinyatakan oleh preposisi בְּ, memperhalus ungkapan bagi פְלֵיטָה, dan memakai "adil" sebagai padanan utama untuk צַדִּיק dalam konteks ini. Citra "berdiri di hadapan-Mu," konstruksi impersonal "tidak seorang pun," dan acuan "hal ini" yang tetap umum dipertahankan.
