  text: As soon as I heard this matter[a], I tore my garment and my robe, pulled out some of the hair of my head and my beard[b], and sat appalled.
translation:
  language: id
  text: Begitu mendengar perkara ini[a], aku mengoyakkan pakaianku dan jubahku, mencabut sebagian rambut di kepalaku dan janggutku[b], lalu duduk termangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ketika aku mendengar laporan ini, aku mengoyakkan pakaianku dan jubahku ... lalu duduk tercengang.”
    reason: lexical_alternative
  - marker: b
    text: Mengoyakkan pakaian dan mencabut rambut merupakan ungkapan dukacita, kengerian, atau perkabungan pada masa itu.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְשָׁמְעִי
  choice: Begitu mendengar
  rationale: Gabungan konjungsi, preposisi temporal, dan bentuk infinitif menyatakan waktu serta kesegeraan reaksi. Ungkapan ini alami dalam bahasa Indonesia dan lebih kuat daripada sekadar 'ketika mendengar'.
- source_word: הַדָּבָר הַזֶּה
  choice: perkara ini
  rationale: דָּבָר dapat berarti perkataan, hal, atau perkara. Dalam konteks ini yang dimaksud ialah keadaan yang baru dilaporkan kepada Ezra; 'perkara ini' mempertahankan keluasan maknanya.
- source_word: קָרַעְתִּי
  choice: aku mengoyakkan
  rationale: Kata kerja ini menunjuk pada tindakan merobek pakaian sebagai ungkapan dukacita atau kengerian. 'Mengoyakkan' sesuai dengan suasana narasi yang khidmat.
- source_word: בִּגְדִי
  choice: pakaianku
  rationale: בֶּגֶד merupakan istilah umum untuk pakaian. Bentuk tunggal kolektif bahasa Indonesia terdengar alami dan tetap membedakannya dari jubah luar.
- source_word: וּמְעִילִי
  choice: dan jubahku
  rationale: מְעִיל biasanya menunjuk pada jubah atau pakaian luar. 'Jubah' jelas dan ringkas dalam bahasa Indonesia.
- source_word: וָאֶמְרְטָה
  choice: mencabut
  rationale: Kata kerja ini menyatakan pencabutan rambut secara paksa. 'Mencabut' merupakan padanan Indonesia yang langsung dan alami.
- source_word: מִשְּׂעַר רֹאשִׁי וּזְקָנִי
  choice: sebagian rambut kepala dan janggutku
  rationale: Preposisi מִן mendukung arti partitif, yakni rambut diambil dari kepala dan janggut, bukan bahwa seluruh rambut dicabut. 'Sebagian' membuat nuansa tersebut jelas.
- source_word: וָאֵשְׁבָה
  choice: lalu duduk
  rationale: Kata kerja ini berarti duduk atau tetap tinggal. 'Lalu duduk' secara alami melanjutkan urutan tindakan dalam narasi.
- source_word: מְשׁוֹמֵם
  choice: terpaku dalam kengerian
  rationale: Partisipel ini menggambarkan keadaan tercengang, hancur batin, atau dilumpuhkan oleh kengerian. Frasa ini menangkap keterpakuan dan dahsyatnya reaksi tanpa mereduksinya menjadi sekadar keheranan.
