language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ/ימֵ֣י אֲבֹתֵ֗י/נוּ אֲנַ֨חְנוּ֙ בְּ/אַשְׁמָ֣ה גְדֹלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בַ/עֲוֺנֹתֵ֡י/נוּ נִתַּ֡נּוּ אֲנַחְנוּ֩ מְלָכֵ֨י/נוּ כֹהֲנֵ֜י/נוּ בְּ/יַ֣ד מַלְכֵ֣י הָ/אֲרָצ֗וֹת בַּ/חֶ֜רֶב בַּ/שְּׁבִ֧י וּ/בַ/בִּזָּ֛ה וּ/בְ/בֹ֥שֶׁת פָּנִ֖ים כְּ/הַ/יּ֥וֹם הַ/זֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/007.yaml
  text: From the days of our fathers until this day[a], we have been in great guilt. Because of our iniquities, we, our kings, and our priests have been given into the hand of the kings of the lands, to the sword, to captivity, to plunder, and to shame of face, as it is this day.
translation:
  language: id
  text: Sejak zaman nenek moyang kami sampai hari ini, kami telah sangat bersalah. Karena kejahatan-kejahatan kami, kami, raja-raja kami, dan imam-imam kami telah diserahkan ke tangan raja-raja berbagai negeri, kepada pedang, penawanan, penjarahan, dan aib terbuka[a], seperti yang terjadi pada hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “penghinaan”; secara harfiah, “malu wajah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִימֵי אֲבֹתֵינוּ
  choice: Sejak zaman nenek moyang kami
  rationale: מִן dengan יְמֵי menunjukkan titik awal waktu yang berlanjut hingga kini. 'Sejak zaman' alami dalam bahasa Indonesia, sedangkan 'nenek moyang' menyampaikan אֲבוֹת sebagai para leluhur.
- source_word: אֲנַחְנוּ בְּאַשְׁמָה גְדֹלָה
  choice: kami berada dalam kesalahan yang besar
  rationale: אַשְׁמָה menunjuk pada keadaan bersalah, bukan sekadar rasa malu. Bentuk kini mempertahankan klausa nominal Ibrani dan kesinambungannya sampai hari ini.
- source_word: וּבַעֲוֹנֹתֵינוּ
  choice: Karena kejahatan-kejahatan kami
  rationale: בְּ dipahami secara kausal dalam konteks penghukuman, sedangkan עָוֹן menyatakan perbuatan jahat beserta kesalahannya. Bentuk jamak mengikuti teks.
- source_word: נִתַּנּוּ
  choice: telah diserahkan
  rationale: Nifal נָתַן bersifat pasif. 'Diserahkan' secara alami mengungkapkan penyerahan ke dalam kuasa musuh dan mempertahankan akibat yang masih terasa.
- source_word: בְּיַד מַלְכֵי הָאֲרָצוֹת
  choice: ke dalam tangan raja-raja berbagai negeri
  rationale: Ungkapan 'ke dalam tangan' mempertahankan metafora Ibrani tentang masuk ke bawah kuasa pihak lain. Bentuk jamak הָאֲרָצוֹת merujuk pada berbagai negeri, bukan seluruh bumi.
- source_word: בַּחֶרֶב בַּשְּׁבִי וּבַבִּזָּה
  choice: kepada pedang, penawanan, penjarahan
  rationale: Rangkaian nomina hukuman dipertahankan secara sejajar. 'Pedang' melambangkan kematian atau kehancuran dalam perang; שְׁבִי adalah keadaan ditawan; בִּזָּה adalah perampasan harta oleh musuh.
- source_word: וּבְבֹשֶׁת פָּנִים
  choice: dan malu yang tampak di wajah
  rationale: Terjemahan ini mempertahankan unsur konkret פָּנִים ('wajah') sambil menjelaskan bahwa frasa tersebut menyatakan aib atau penghinaan yang terbuka.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: seperti pada hari ini
  rationale: Ungkapan ini menunjuk keadaan nyata pada waktu doa diucapkan dan mengaitkannya dengan hukuman yang baru disebutkan.
theological_decisions:
- issue: Pembedaan istilah moral אַשְׁמָה dan עָוֹן
  choice: Menerjemahkan אַשְׁמָה sebagai 'kesalahan' dan עָוֹן sebagai 'kejahatan-kejahatan'
  alternative: Menerjemahkan keduanya dengan istilah umum 'dosa'
  rationale: 'Pembedaan ini menjaga lapisan pengakuan dalam teks: keadaan bersalah yang besar dan perbuatan-perbuatan jahat yang menjadi sebab penghukuman, tanpa menambahkan rumusan doktrinal tertentu.'
- issue: Solidaritas umat dan pemimpinnya dalam pengakuan
  choice: Mempertahankan 'kami, raja-raja kami, dan imam-imam kami' sebagai satu kelompok yang diserahkan
  alternative: Menyusun ulang kalimat sehingga para pemimpin tampak terpisah dari umat
  rationale: Teks Ibrani secara eksplisit menempatkan komunitas, raja, dan imam bersama-sama di bawah akibat kesalahan mereka.
- issue: Pelaku ilahi dalam bentuk pasif נִתַּנּוּ
  choice: Mempertahankan bentuk pasif 'telah diserahkan' tanpa menyebut pelaku
  alternative: Menambahkan 'Allah telah menyerahkan'
  rationale: Dalam konteks doa, Allah dapat dipahami sebagai pelaku utama, tetapi ayat ini tidak menyebut-Nya secara eksplisit. Bentuk pasif mempertahankan ketidaktersuratan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan pengakuan kolektif serta deretan bentuk hukuman dipertahankan. Ungkapan Ibrani yang masih mudah dipahami, seperti 'ke dalam tangan', dipertahankan; sedangkan 'malu wajah' dijelaskan secara alami dalam teks dan diberi alternatif harfiah dalam catatan kaki.
