  source_fidelity: Makna pokok terjaga, termasuk kemurahan dari Yahweh, gambaran pasak, idiom mata yang diterangi, dan keadaan perbudakan. Namun, "suatu kaum sisa dari antara kami lolos" tidak tepat menangkap לְהַשְׁאִיר לָנוּ פְּלֵיטָה, yang berarti menyisakan bagi kami orang-orang yang luput/selamat, bukan menyatakan bahwa suatu kaum sisa itu sedang melakukan tindakan "lolos".
  naturalness: Bahasa umumnya baku dan sesuai register khidmat, tetapi frasa "suatu kaum sisa dari antara kami lolos" dan "sedikit kehidupan kembali" kurang alami dalam bahasa Indonesia modern. Susunan yang direvisi lebih lancar sambil tetap dekat dengan struktur dan citra Ibrani.
  terminology: '"Yahweh," "Allah kita," "pasak," "tempat kudus-Nya," dan "perbudakan kami" tepat. "Menerangi mata kami" lebih dekat kepada idiom Ibrani daripada "membuat mata kami bercahaya" dan tetap dapat dijelaskan dalam catatan kaki.'
