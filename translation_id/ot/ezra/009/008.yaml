id: EZR.9.8
reference: Ezra 9:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֡ה כִּ/מְעַט רֶגַע֩ הָיְתָ֨ה תְחִנָּ֜ה מֵ/אֵ֣ת יְהוָ֣ה אֱלֹהֵ֗י/נוּ לְ/הַשְׁאִ֥יר לָ֨/נוּ֙ פְּלֵיטָ֔ה וְ/לָ/תֶת לָ֥/נוּ יָתֵ֖ד בִּ/מְק֣וֹם קָדְשׁ֑/וֹ לְ/הָאִ֤יר עֵינֵ֨י/נוּ֙ אֱלֹהֵ֔י/נוּ וּ/לְ/תִתֵּ֛/נוּ מִֽחְיָ֥ה מְעַ֖ט בְּ/עַבְדֻתֵֽ/נוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/008.yaml
  text: But now[a], for a brief moment, favor has come from Yahweh our God, to leave us a remnant that has escaped and to give us a peg in his holy place[c][b], so that our God may brighten our eyes and give us a little reviving in our slavery.
translation:
  language: id
  text: Namun sekarang, untuk sesaat, Yahweh, Allah kita, telah menunjukkan kemurahan dengan menyisakan bagi kami orang-orang yang luput dan dengan memberi kami sebuah pasak[a] di tempat kudus-Nya, supaya Allah kita menerangi mata kami[b] dan memberi kami sedikit pemulihan hidup dalam perbudakan kami[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat berpijak yang kokoh”. Bahasa Ibrani mempertahankan gambaran konkret sebuah pasak yang tertancap kuat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menerangi mata kami”; ungkapan ini menyatakan pulihnya daya hidup, semangat, atau harapan.
    reason: idiom_explanation
  - marker: c
    text: Atau “dalam penghambaan kami” atau “dalam keadaan kami sebagai hamba”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט רֶגַע
  choice: untuk sesaat
  rationale: Mengungkapkan singkat dan terbatasnya masa kelonggaran itu dalam bahasa Indonesia yang alami.
- source_word: תְחִנָּה
  choice: kemurahan
  rationale: Dalam konstruksi הָיְתָה ... מֵאֵת, nomina ini menunjuk pada kemurahan yang berasal dari Yahweh, bukan tindakan umat memohon.
- source_word: פְּלֵיטָה
  choice: suatu kaum sisa dari antara kami lolos
  rationale: Mempertahankan sekaligus gagasan tentang kelompok yang tersisa dan keselamatan karena telah luput.
- source_word: יָתֵד
  choice: sebuah pasak
  rationale: Mempertahankan gambaran konkret Ibrani tentang sesuatu yang tertancap kukuh, alih-alih langsung menggantinya dengan makna metaforis.
- source_word: בִּמְקוֹם קָדְשׁוֹ
  choice: di tempat kudus-Nya
  rationale: Terjemahan langsung yang mempertahankan cakupan ungkapan Ibrani tanpa mempersempitnya secara mutlak menjadi bangunan tertentu.
- source_word: לְהָאִיר עֵינֵינוּ
  choice: membuat mata kami bercahaya
  rationale: Mempertahankan idiom tentang pulihnya daya hidup, semangat, dan harapan dalam bentuk yang dapat dipahami pembaca Indonesia.
- source_word: מִחְיָה מְעַט
  choice: sedikit kehidupan kembali
  rationale: Menyampaikan pemulihan atau pemeliharaan hidup tanpa menghilangkan kata pembatas מְעַט, 'sedikit'.
- source_word: בְּעַבְדֻתֵנוּ
  choice: dalam perbudakan kami
  rationale: Mempertahankan kuatnya keadaan ketundukan umat di bawah kekuasaan asing; 'pelayanan' akan terlalu lunak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani.
theological_decisions:
- issue: Makna pasak di tempat kudus Allah
  choice: Gambaran konkret 'sebuah pasak' dipertahankan dalam teks utama.
  alternative: tempat berpijak yang kokoh
  rationale: Metafora itu mengisyaratkan kedudukan atau pegangan yang aman, tetapi teks Ibrani sendiri memakai benda konkret sehingga penafsirannya tidak dijadikan teks utama.
- issue: Daya hidup di tengah perbudakan
  choice: memberi kami sedikit kehidupan kembali dalam perbudakan kami
  alternative: membebaskan kami dari perbudakan
  rationale: Ayat ini berbicara tentang pemulihan terbatas ketika umat masih berada dalam ketundukan, bukan pembebasan penuh dari keadaan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Struktur kalimat dipecah setelah klausa tentang kemurahan agar hubungan antargagasan jelas. Pronomina “kami” mengikuti sudut pandang doa Ezra, sedangkan “Ia” memperjelas bahwa Yahweh adalah pelaku rangkaian infinitif tanpa mengubah isinya.
