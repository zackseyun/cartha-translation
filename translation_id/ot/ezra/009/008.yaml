  to: Namun sekarang, untuk sesaat, Yahweh, Allah kita, telah menunjukkan kemurahan dengan menyisakan bagi kami orang-orang yang luput dan dengan memberi kami sebuah pasak[a] di tempat kudus-Nya, supaya Allah kita menerangi mata kami[b] dan memberi kami sedikit pemulihan hidup dalam perbudakan kami[c].
