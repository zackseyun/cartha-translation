base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/005.yaml
  text: At the evening offering I rose from my fasting[a], with my garment and my robe torn, and I fell on my knees and spread out my hands to Yahweh my God.
translation:
  language: id
  text: Pada waktu persembahan petang, aku bangkit dari puasaku[a], dengan pakaianku dan jubahku terkoyak. Lalu aku berlutut dan menadahkan tanganku kepada Yahweh, Allahku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari tindakan merendahkan diriku.” Kata Ibrani yang dipakai biasanya menunjuk pada puasa sebagai bentuk perendahan diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְמִנְחַת הָעֶרֶב
  choice: Pada waktu persembahan petang
  rationale: מִנְחָה dapat berarti pemberian atau persembahan sajian. Dalam frasa ini, kata tersebut menunjuk pada waktu persembahan petang; pilihan yang lebih umum mempertahankan kemungkinan bahwa yang dimaksud ialah keseluruhan waktu ibadah korban petang.
- source_word: קַמְתִּי מִתַּעֲנִיתִי
  choice: aku bangkit dari puasaku
  rationale: קום berarti bangkit, sedangkan תַּעֲנִית paling mungkin menunjuk pada puasa sebagai tindakan merendahkan diri dalam dukacita.
- source_word: וּבְקָרְעִי בִגְדִי וּמְעִילִי
  choice: dengan pakaian dan jubahku dalam keadaan terkoyak
  rationale: Konstruksi infinitif dengan ב menyatakan keadaan yang menyertai. 'Pakaian' dan 'jubah' mempertahankan pembedaan antara בֶּגֶד dan מְעִיל.
- source_word: וָאֶכְרְעָה עַל בִּרְכַּי
  choice: Lalu aku berlutut
  rationale: כרע berarti menekuk tubuh atau berlutut. Ungkapan Indonesia ini alami dan tidak memerlukan pengulangan harfiah 'di atas lututku'.
- source_word: וָאֶפְרְשָׂה כַפַּי
  choice: menadahkan tanganku
  rationale: פרשׂ dengan כף menggambarkan membuka dan mengulurkan telapak tangan dalam doa. 'Menadahkan tangan' merupakan ungkapan Indonesia yang alami untuk sikap tersebut.
- source_word: אֶל יְהוָה אֱלֹהָי
  choice: kepada Yahweh, Allahku
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh', dan אֱלֹהָי diterjemahkan 'Allahku'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani menyebut Tetragramaton secara langsung. 'Yahweh' mempertahankan nama diri ilahi, bukan menggantinya dengan gelar.
- issue: Makna תַּעֲנִית
  choice: puasa
  alternative: perendahan diri / penderitaan diri
  rationale: Kata ini berakar pada gagasan merendahkan atau menyengsarakan diri, tetapi dalam konteks tindakan dukacita Ezra paling wajar menunjuk pada puasa. Ambiguitas dasarnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat alami bagi pembaca umum, sementara rincian pakaian yang terkoyak, sikap berlutut, dan tangan yang ditadahkan tetap dipertahankan.
