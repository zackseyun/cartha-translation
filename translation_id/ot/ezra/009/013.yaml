id: EZR.9.13
reference: Ezra 9:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַֽחֲרֵי֙ כָּל הַ/בָּ֣א עָלֵ֔י/נוּ בְּ/מַעֲשֵׂ֨י/נוּ֙ הָ/רָעִ֔ים וּ/בְ/אַשְׁמָתֵ֖/נוּ הַ/גְּדֹלָ֑ה כִּ֣י אַתָּ֣ה אֱלֹהֵ֗י/נוּ חָשַׂ֤כְתָּֽ לְ/מַ֨טָּה֙ מֵֽ/עֲוֺנֵ֔/נוּ וְ/נָתַ֥תָּה לָּ֛/נוּ פְּלֵיטָ֖ה כָּ/זֹֽאת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/013.yaml
  text: And after all that has come upon us because of our evil deeds and our great guilt—though you, our God, have punished us less than our iniquities deserve and have given us such a remnant as this—
translation:
  language: id
  text: Dan setelah segala yang menimpa kami karena perbuatan-perbuatan kami yang jahat dan kesalahan kami yang besar—padahal Engkau, ya Allah kami, telah menghukum kami tidak seberat kesalahan kami[a] dan telah memberikan kepada kami orang-orang yang luput seperti ini[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “telah menahan lebih rendah daripada kesalahan kami.” Idiom Ibrani ini menyatakan bahwa Allah tidak menjatuhkan hukuman sepenuh kadar kesalahan kami.
    reason: lexical_alternative
  - marker: b
    text: Atau, “sisa umat seperti ini” atau “suatu kelolosan seperti ini.” Istilah Ibrani ini dapat menunjuk pada orang-orang yang dipelihara hidup melewati penghukuman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי
  choice: Dan setelah
  rationale: Mempertahankan waw penghubung dan menunjukkan bahwa ayat ini melanjutkan doa Ezra dari ayat sebelumnya.
- source_word: כָּל הַבָּא עָלֵינוּ
  choice: segala yang menimpa kami
  rationale: Ungkapan alami dalam bahasa Indonesia yang tetap mencerminkan idiom Ibrani tentang malapetaka yang datang atas mereka.
- source_word: בְּמַעֲשֵׂינוּ הָרָעִים
  choice: karena perbuatan-perbuatan kami yang jahat
  rationale: Preposisi ב dipahami secara kausal; bentuk jamak dan bobot moral frasa sumber dipertahankan.
- source_word: וּבְאַשְׁמָתֵנוּ הַגְּדֹלָה
  choice: dan kesalahan kami yang besar
  rationale: אַשְׁמָה menunjuk pada kesalahan atau keadaan bersalah secara objektif, bukan sekadar perasaan bersalah.
- source_word: כִּי
  choice: padahal
  rationale: Dalam konteks ini partikel tersebut paling wajar dibaca secara konsesif, dengan mempertentangkan beratnya kesalahan umat dan kemurahan Allah.
- source_word: חָשַׂכְתָּ לְמַטָּה מֵעֲוֺנֵנוּ
  choice: telah menghukum kami lebih ringan daripada yang patut kami tanggung karena kejahatan kami
  rationale: Mengungkapkan maksud idiom Ibrani bahwa Allah menahan hukuman sehingga umat tidak menerima sepenuhnya akibat yang sepadan dengan kesalahan mereka.
- source_word: עָוֺן
  choice: kejahatan
  rationale: Dalam ungkapan ini עָוֺן mencakup perbuatan salah beserta tanggungan akibatnya; 'kejahatan' menjaga bobot moral tanpa menyamarkannya sebagai emosi.
- source_word: וְנָתַתָּה לָּנוּ
  choice: dan telah memberikan kepada kami
  rationale: Bentuk perfektif diterjemahkan sebagai tindakan lampau yang hasilnya masih nyata bagi komunitas Ezra.
- source_word: פְּלֵיטָה
  choice: orang-orang yang luput
  rationale: Kata ini dapat menunjuk pada pelarian, kelolosan, atau kelompok penyintas. Pilihan ini mempertahankan acuan konkretnya tanpa langsung memasukkan istilah teologis 'sisa umat' ke dalam teks utama.
- source_word: כָּזֹאת
  choice: seperti ini
  rationale: Demonstratif tersebut menunjuk pada komunitas penyintas yang sedang ada di hadapan Ezra.
theological_decisions:
- issue: Hubungan antara kemurahan Allah dan hukuman yang layak diterima
  choice: telah menghukum kami lebih ringan daripada yang patut kami tanggung karena kejahatan kami
  alternative: telah menahan hukuman atas kami di bawah kadar kejahatan kami
  rationale: Pilihan utama menyampaikan maksud idiom secara jelas dalam bahasa Indonesia sambil tetap mempertahankan ketegangan antara keadilan dan kemurahan Allah.
- issue: Makna פְּלֵיטָה dalam konteks pascapembuangan
  choice: orang-orang yang luput
  alternative: sisa umat; suatu kelolosan
  rationale: Istilah sumber terutama menyoroti mereka yang selamat atau luput. Nuansa 'sisa umat' memang hadir dalam konteks sejarah Ezra, tetapi diletakkan dalam catatan agar teks utama tidak mempersempit ambiguitas leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda pisah pada akhir ayat dipertahankan karena kalimat doa ini secara sintaksis berlanjut ke ayat 14. Sapaan “Engkau” memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia, tanpa menambah penafsiran pada teks sumber.
