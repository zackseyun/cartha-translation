base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/002.yaml
  text: For they have taken some of their daughters for themselves and for their sons[a], and the holy seed has mixed itself with the peoples of the lands[c][b]. And the hand of the officials and the deputies has been foremost in this unfaithfulness.
translation:
  language: id
  text: Sebab mereka telah mengambil beberapa anak perempuan bangsa-bangsa itu sebagai istri bagi diri mereka sendiri dan bagi anak-anak laki-laki mereka[a], dan keturunan yang kudus[b] telah bercampur dengan bangsa-bangsa dari berbagai negeri. Para pejabat dan para wakillah yang paling menonjol dalam ketidaksetiaan ini[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “telah mengambil dari antara anak-anak perempuan mereka”; dalam konteks ini maksudnya mengambil mereka sebagai istri.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “benih yang kudus.” Ungkapan ini juga dapat diterjemahkan “keturunan kudus.”'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “tangan para pejabat dan para wakil adalah yang pertama dalam ketidaksetiaan ini.” Ungkapan itu menunjukkan keterlibatan dan tanggung jawab utama mereka; kata “yang pertama” juga dapat bernuansa urutan.'
    reason: idiom_and_ambiguity
lexical_decisions:
- source_word: נָשְׂאוּ מִבְּנֹתֵיהֶם
  choice: mengambil beberapa anak perempuan bangsa-bangsa itu
  rationale: Secara harfiah berarti mengambil dari antara anak-anak perempuan mereka. Dalam konteks ini tindakan tersebut merujuk pada pengambilan sebagai istri; 'beberapa' menyampaikan fungsi partitif מִן, sedangkan rujukan 'bangsa-bangsa itu' dibuat eksplisit dan alami dalam bahasa Indonesia.
- source_word: לָהֶם וְלִבְנֵיהֶם
  choice: bagi diri mereka sendiri dan bagi anak-anak lelaki mereka
  rationale: Preposisi ל menandai pihak yang menerima manfaat atau menjadi tujuan; frasa ini menyatakan bahwa perempuan-perempuan itu diambil baik bagi mereka sendiri maupun bagi anak laki-laki mereka.
- source_word: וְהִתְעָרְבוּ
  choice: telah bercampur
  rationale: Bentuk hitpael menyatakan percampuran atau pembauran. Bahasa Indonesia tidak memerlukan padanan refleksif eksplisit seperti 'mencampurkan diri' dalam konteks ini.
- source_word: זֶרַע הַקֹּדֶשׁ
  choice: keturunan yang kudus
  rationale: '''Keturunan'' mempertahankan makna genealogis dan komunal זֶרַע dengan lebih alami daripada ''benih'' dalam bahasa Indonesia, tanpa mengembangkannya menjadi teori rasial.'
- source_word: בְּעַמֵּי הָאֲרָצוֹת
  choice: dengan bangsa-bangsa dari berbagai negeri
  rationale: Padanan ini mempertahankan bentuk jamak עַמֵּי dan אֲרָצוֹת serta menyampaikan acuan kepada bangsa-bangsa di wilayah sekitar secara wajar.
- source_word: הַשָּׂרִים וְהַסְּגָנִים
  choice: para pejabat dan penguasa bawahan
  rationale: Kedua istilah menunjuk pada kalangan pimpinan administratif. 'Penguasa bawahan' membedakan סְגָנִים dari pejabat pertama tanpa memberi kesan jabatan modern yang terlalu spesifik.
- source_word: מַּעַל
  choice: ketidaksetiaan
  rationale: מעל menunjuk pada pelanggaran kepercayaan, khususnya ketidaksetiaan dalam hubungan perjanjian, bukan sekadar pelanggaran umum.
- source_word: וְיַד ... רִאשׁוֹנָה
  choice: yang paling menonjol
  rationale: Ungkapan harfiah 'tangan ... adalah yang pertama' menandakan keterlibatan aktif dan peran utama. Padanan idiomatis ini menyampaikan besarnya keterlibatan tanpa membatasi makna pada urutan waktu.
theological_decisions:
- issue: Makna 'keturunan yang kudus' dalam konteks perkawinan campur
  choice: Mempertahankan ungkapan perjanjian 'keturunan yang kudus' tanpa memperluasnya menjadi gagasan kemurnian ras.
  alternative: Menerjemahkan sebagai 'benih yang kudus' atau menafsirkannya terutama sebagai kemurnian etnis.
  rationale: Teks memakai bahasa genealogis untuk umat yang dikhususkan dalam konteks pascapembuangan. Terjemahan perlu mempertahankan ketegangan ini tanpa memasukkan kategori rasial yang tidak dinyatakan teks.
- issue: Hubungan antarklausa pertama dan kedua
  choice: Menggunakan 'sehingga' untuk menyatakan akibat kontekstual dari perkawinan tersebut.
  alternative: Menggunakan 'dan' sebagai padanan formal langsung bagi וְ.
  rationale: Konjungsi Ibrani secara bentuk adalah 'dan', tetapi dalam rangkaian ini klausa kedua menggambarkan akibat perkawinan campur. 'Sehingga' membuat hubungan wacana alami dalam bahasa Indonesia tanpa menyatakan tujuan.
- issue: Kesalahan utama para pemimpin
  choice: Mengungkapkan idiom sebagai para pejabat dan penguasa bawahan yang 'paling menonjol' dalam ketidaksetiaan itu.
  alternative: Mempertahankan secara harfiah 'tangan ... adalah yang pertama' atau menerjemahkan 'mereka yang pertama kali melakukannya'.
  rationale: Ungkapan tersebut menekankan peran utama atau keterlibatan terdepan, tetapi dapat juga dibaca sebagai keutamaan dalam urutan. Terjemahan utama menyampaikan tanggung jawab utama, sementara catatan kaki menjaga bentuk dan kemungkinan nuansa Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur Ibrani dipertahankan bila tetap jelas, tetapi idiom 'tangan ... yang pertama' dialihkan secara alami. Istilah 'anak-anak lelaki' dipakai agar hubungan generasi jelas; 'keturunan yang kudus' menjaga bahasa perjanjian tanpa nuansa rasial modern.
