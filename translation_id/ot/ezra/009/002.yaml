  to: Sebab mereka telah mengambil beberapa anak perempuan bangsa-bangsa itu sebagai istri bagi diri mereka sendiri dan bagi anak-anak laki-laki mereka[a], dan keturunan yang kudus[b] telah bercampur dengan bangsa-bangsa dari berbagai negeri. Para pejabat dan para wakillah yang paling menonjol dalam ketidaksetiaan ini[c].
