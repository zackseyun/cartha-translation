- from: Lalu berkumpullah di sekelilingku semua orang yang gentar akan segala firman Allah Israel karena ketidaksetiaan kaum buangan[a]. Sementara itu, aku tetap duduk terpaku karena ngeri sampai waktu persembahan petang[b].
