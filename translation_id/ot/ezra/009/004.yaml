  rationale: Revisi menghapus rincian spasial dan emosional yang tidak ditegaskan oleh bahasa Ibrani, sambil mempertahankan hubungan sebab dalam “karena ketidaksetiaan kaum buangan,” keadaan Ezra yang berlanjut, serta rujukan waktu kultis pada persembahan petang. Penanda catatan kaki tetap ditempatkan pada unsur yang relevan.
