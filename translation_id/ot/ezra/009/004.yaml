source:
  edition: WLC
  text: וְ/אֵלַ֣/י יֵאָסְפ֗וּ כֹּ֤ל חָרֵד֙ בְּ/דִבְרֵ֣י אֱלֹהֵֽי יִשְׂרָאֵ֔ל עַ֖ל מַ֣עַל הַ/גּוֹלָ֑ה וַ/אֲנִי֙ יֹשֵׁ֣ב מְשׁוֹמֵ֔ם עַ֖ד לְ/מִנְחַ֥ת הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/004.yaml
  text: Then everyone who trembled at the words of the God of Israel because of the unfaithfulness of the exiles gathered to me[b][a], while I sat appalled until the evening offering.
translation:
  language: id
  text: Lalu semua orang yang gentar terhadap firman Allah Israel karena ketidaksetiaan kaum buangan[a] datang berkumpul kepadaku, sedangkan aku tetap duduk tercengang sampai waktu persembahan petang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pelanggaran komunitas orang buangan.”
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “persembahan” adalah minḥah, yang sering secara khusus berarti persembahan sajian. Di sini ungkapan itu juga menunjukkan waktu persembahan rutin di Bait Allah pada petang hari.
    reason: cultural_note
lexical_decisions:
- source_word: יֵאָסְפוּ
  choice: berkumpullah di sekelilingku
  rationale: Bentuk Nifal dari אסף menyatakan orang-orang datang berkumpul kepada Ezra. Ungkapan ini alami dalam bahasa Indonesia dan tidak memaksakan nuansa pasif.
- source_word: כֹּל חָרֵד
  choice: semua orang yang gentar
  rationale: Adjektiva tunggal sesudah כֹּל berfungsi kolektif. 'Semua orang yang gentar' mempertahankan rasa takut penuh hormat dan kesungguhan rohani.
- source_word: בְּדִבְרֵי אֱלֹהֵי יִשְׂרָאֵל
  choice: akan segala firman Allah Israel
  rationale: Preposisi ב dengan חָרֵד menandai hal yang menimbulkan kegentaran. 'Segala firman' menyampaikan bentuk jamak דִבְרֵי secara wajar tanpa ungkapan kaku 'firman-firman'.
- source_word: עַל מַעַל הַגּוֹלָה
  choice: karena ketidaksetiaan kaum buangan
  rationale: מַעַל menunjuk pada pelanggaran kepercayaan atau ketidaksetiaan, dengan gema hubungan perjanjian. הַגּוֹלָה menunjuk pada komunitas orang buangan, termasuk mereka yang telah kembali.
- source_word: יֹשֵׁב מְשׁוֹמֵם
  choice: tetap duduk terpaku karena ngeri
  rationale: Gabungan partisip יֹשֵׁב dan מְשׁוֹמֵם menggambarkan sikap duduk yang berlanjut serta keadaan terguncang dan ngeri. Pilihan ini mengungkap kedua unsur itu dalam bahasa Indonesia yang alami.
- source_word: עַד לְמִנְחַת הָעָרֶב
  choice: sampai waktu persembahan petang
  rationale: מִנְחָה dapat secara khusus berarti persembahan sajian, tetapi di sini juga berfungsi sebagai penanda waktu ibadah rutin. 'Persembahan petang' mempertahankan rujukan kultis tanpa mempersempitnya secara tidak pasti.
theological_decisions:
- issue: Makna מַעַל dalam konteks dosa terhadap Allah
  choice: ketidaksetiaan
  alternative: pelanggaran; pengkhianatan
  rationale: Istilah ini bukan sekadar kesalahan umum, melainkan pelanggaran kepercayaan terhadap Allah. 'Ketidaksetiaan' menyampaikan dimensi relasional dan perjanjian tanpa memasukkan kategori doktrinal tambahan.
- issue: Rujukan הַגּוֹלָה
  choice: kaum buangan
  alternative: komunitas orang buangan; orang-orang yang kembali dari pembuangan
  rationale: Nomina ini merujuk secara kolektif kepada masyarakat pembuangan, khususnya komunitas yang telah kembali. 'Kaum buangan' ringkas, personal, dan tetap mempertahankan hubungan mereka dengan pengalaman pembuangan.
- issue: Cakupan מִנְחַת הָעָרֶב
  choice: persembahan petang
  alternative: persembahan sajian petang
  rationale: Meskipun מִנְחָה kerap menunjuk persembahan sajian, dalam ungkapan waktu ini istilah tersebut dapat menunjuk lebih luas pada waktu persembahan rutin petang. Terjemahan utama menjaga ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Inversi ringan 'berkumpullah' mempertahankan gerak narasi, sedangkan 'segala firman' mengungkap bentuk jamak Ibrani secara alami. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
