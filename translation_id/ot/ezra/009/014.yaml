  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֲ/נָשׁוּב֙ לְ/הָפֵ֣ר מִצְוֺתֶ֔י/ךָ וּ֨/לְ/הִתְחַתֵּ֔ן בְּ/עַמֵּ֥י הַ/תֹּעֵב֖וֹת הָ/אֵ֑לֶּה הֲ/ל֤וֹא תֶֽאֱנַף בָּ֨/נוּ֙ עַד כַּלֵּ֔ה לְ/אֵ֥ין שְׁאֵרִ֖ית וּ/פְלֵיטָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/014.yaml
  text: Shall we again break your commandments and intermarry with the peoples of these abominations? Would you not be angry with us until you had consumed us[b][a], leaving no remnant or survivor?
translation:
  language: id
  text: Apakah kami akan kembali melanggar perintah-perintah-Mu dan kawin campur dengan bangsa-bangsa yang melakukan kekejian-kekejian ini?[a] Bukankah Engkau akan murka terhadap kami sampai membinasakan kami, sehingga tidak ada sisa ataupun orang yang luput?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dengan bangsa-bangsa dari kekejian-kekejian ini.” Ungkapan Ibrani ini kemungkinan menunjuk pada bangsa-bangsa yang dicirikan oleh praktik-praktik keji tersebut.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “sehingga tidak ada sisa maupun keluputan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָשׁוּב
  choice: Apakah kami akan kembali
  rationale: Kata kerja שׁוב secara harfiah berarti 'kembali'; bersama infinitif yang mengikutinya, frasa ini menyatakan pengulangan ketidaktaatan.
- source_word: לְהָפֵר
  choice: melanggar
  rationale: Dalam konteks hukum dan perjanjian, הפר berarti melanggar atau merusak keberlakuan suatu ketetapan; 'melanggar' alami dalam bahasa Indonesia.
- source_word: מִצְוֺתֶיךָ
  choice: perintah-perintah-Mu
  rationale: Bentuk jamak dengan sufiks orang kedua tunggal merujuk langsung kepada perintah-perintah Allah.
- source_word: וּלְהִתְחַתֵּן
  choice: dan kawin campur
  rationale: Bentuk hitpael dari חתן menunjuk pada masuk ke dalam hubungan perkawinan antarkelompok; 'kawin campur' menyampaikan makna kelompok dan timbal baliknya.
- source_word: בְּעַמֵּי הַתֹּעֵבוֹת הָאֵלֶּה
  choice: dengan bangsa-bangsa yang melakukan kekejian-kekejian ini
  rationale: Ungkapan harfiahnya ialah 'dengan bangsa-bangsa dari kekejian-kekejian ini'. Terjemahan ini memahami konstruksi padat tersebut sebagai pencirian berdasarkan praktik mereka, bukan hakikat etnis mereka, sambil mencatat bentuk harfiahnya.
- source_word: הֲלוֹא תֶאֱנַף בָּנוּ
  choice: Bukankah Engkau akan murka terhadap kami
  rationale: אנף menyatakan kemarahan atau murka; 'murka terhadap kami' mempertahankan bobot retoris dan konteks penghakiman ilahi.
- source_word: עַד כַּלֵּה
  choice: sampai membinasakan kami
  rationale: כלה di sini menyatakan membawa sampai habis atau memusnahkan. Objek 'kami' tersirat oleh konteks dan dibuat eksplisit agar alami dalam bahasa Indonesia.
- source_word: לְאֵין
  choice: sehingga tidak ada
  rationale: Frasa ini menyatakan akibat berupa ketiadaan sama sekali dari hal-hal yang disebut sesudahnya.
- source_word: שְׁאֵרִית
  choice: sisa
  rationale: שְׁאֵרִית menunjuk pada apa atau siapa yang masih tersisa sesudah penghukuman; 'sisa' alami dan tetap mempertahankan konsep tersebut.
- source_word: וּפְלֵיטָה
  choice: ataupun orang yang luput
  rationale: פְלֵיטָה dapat berarti keluputan atau orang yang berhasil lolos; sejajar dengan 'sisa', makna konkret 'orang yang luput' paling sesuai.
theological_decisions:
- issue: Pencirian bangsa-bangsa dalam kaitannya dengan kekejian
  choice: Memahami frasa itu sebagai bangsa-bangsa yang dicirikan oleh praktik-praktik keji tersebut.
  alternative: bangsa-bangsa dari kekejian-kekejian ini
  rationale: Konstruksi Ibrani bersifat padat dan ambigu. Teks utama menyampaikan makna kontekstual tanpa menjadikan etnisitas mereka sebagai kekejian pada dirinya sendiri; catatan kaki mempertahankan bentuk yang lebih harfiah.
- issue: Bahasa tentang mereka yang tersisa setelah penghukuman
  choice: 'Mempertahankan dua unsur yang sejajar: ''sisa'' dan ''orang yang luput''.'
  alternative: tidak menyisakan seorang pun yang selamat
  rationale: Dua istilah Ibrani yang berbeda sengaja dipertahankan agar gambaran tentang kemusnahan total dan gema tema umat sisa tidak diratakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti bagi Allah ditulis dengan huruf kapital. Pertanyaan retoris ganda dipertahankan, demikian pula ketegangan antara ungkapan Ibrani yang harfiah dan makna kontekstualnya.
