language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲשֶׁ֣ר צִוִּ֗יתָ בְּ/יַ֨ד עֲבָדֶ֣י/ךָ הַ/נְּבִיאִים֮ לֵ/אמֹר֒ הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתֶּ֤ם בָּאִים֙ לְ/רִשְׁתָּ֔/הּ אֶ֤רֶץ נִדָּה֙ הִ֔יא בְּ/נִדַּ֖ת עַמֵּ֣י הָ/אֲרָצ֑וֹת בְּ/תוֹעֲבֹֽתֵי/הֶ֗ם אֲשֶׁ֥ר מִלְא֛וּ/הָ מִ/פֶּ֥ה אֶל פֶּ֖ה בְּ/טֻמְאָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/011.yaml
  text: which you commanded by the hand of your servants the prophets[a], saying, ‘The land that you are entering to possess is a land of impurity because of the impurity of the peoples of the lands[b], because of their abominations with which they have filled it from end to end with their uncleanness.’
translation:
  language: id
  text: yang telah Kauperintahkan melalui hamba-hamba-Mu, para nabi, dengan berfirman, “Negeri yang kamu masuki untuk kamu miliki itu adalah negeri yang najis karena kenajisan bangsa-bangsa di negeri-negeri itu, karena kekejian mereka, yang dengannya mereka telah memenuhi negeri itu dari ujung ke ujung[a] dengan kenajisan mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari mulut ke mulut”, sebuah ungkapan yang berarti seluruh negeri, dari satu ujung ke ujung lainnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: melalui
  rationale: Idiom Ibrani ini menyatakan perantaraan atau pelaku. 'Melalui' alami dalam bahasa Indonesia dan tetap menunjukkan bahwa para nabi menjadi perantara firman Allah.
- source_word: עֲבָדֶיךָ הַנְּבִיאִים
  choice: hamba-hamba-Mu, para nabi
  rationale: '''Hamba'' mempertahankan sebutan hormat bagi para utusan Allah, sedangkan aposisi ''para nabi'' mengikuti struktur dan identitas mereka dalam sumber.'
- source_word: לְרִשְׁתָּהּ
  choice: untuk diduduki
  rationale: Dalam konteks tanah, ירשׁ berarti mengambil dan memegangnya sebagai milik. 'Diduduki' menyampaikan tindakan memperoleh penguasaan secara wajar tanpa membatasi maknanya hanya pada warisan.
- source_word: אֶרֶץ נִדָּה
  choice: negeri yang najis
  rationale: Ungkapan ini menyatakan keadaan tercemar atau tidak tahir. 'Najis' mempertahankan kemungkinan nuansa ritual sekaligus moral-keagamaan dan lebih alami daripada bentuk abstrak yang kaku.
- source_word: בְּנִדַּת עַמֵּי הָאֲרָצוֹת
  choice: karena kenajisan bangsa-bangsa di berbagai negeri
  rationale: Bet dipahami secara kausal. Bentuk jamak הָאֲרָצוֹת dipertahankan melalui 'berbagai negeri', sementara עַמֵּי diterjemahkan 'bangsa-bangsa'.
- source_word: בְּתוֹעֲבֹתֵיהֶם
  choice: karena perbuatan-perbuatan mereka yang menjijikkan
  rationale: תּוֹעֵבָה menunjuk pada hal atau praktik yang sangat menjijikkan dalam penilaian perjanjian dan keagamaan. Bentuk konkret ini lebih jelas bagi pembaca modern daripada 'kekejian-kekejian'.
- source_word: מִפֶּה אֶל־פֶּה
  choice: dari ujung ke ujung
  rationale: Secara harfiah 'dari mulut ke mulut', tetapi di sini merupakan idiom ruang yang berarti seluruh negeri dipenuhi.
- source_word: בְּטֻמְאָתָם
  choice: dengan kenajisan mereka
  rationale: Terjemahan ini mempertahankan bidang makna ketidaktahiran atau pencemaran dan tidak mempersempitnya menjadi kategori ritual atau moral saja.
theological_decisions:
- issue: Sifat kenajisan negeri
  choice: Menggunakan 'najis/kenajisan' tanpa menentukan bahwa pencemaran itu semata-mata ritual atau semata-mata moral.
  alternative: Menerjemahkannya seluruhnya sebagai ketidaktahiran ritual atau seluruhnya sebagai kebobrokan moral.
  rationale: נִדָּה, טֻמְאָה, dan תּוֹעֵבָה bersama-sama dapat membawa nuansa ritual serta moral-perjanjian; terjemahan sebaiknya mempertahankan ketegangan tersebut.
- issue: Subjek yang memenuhi negeri
  choice: Mengulang 'bangsa-bangsa itu' untuk memperjelas subjek tersirat dari מִלְאוּהָ.
  alternative: Memakai hanya 'mereka', yang secara gramatikal dapat pula terbaca mengacu pada perbuatan-perbuatan menjijikkan.
  rationale: Bentuk verba maskulin jamak paling langsung kembali kepada bangsa-bangsa; pengulangan nomina menghindari ambiguitas rujukan yang timbul dalam bahasa Indonesia tanpa menambahkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa dan kutipan ilahi yang bermartabat. Kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan ejaan rohani Indonesia. Istilah 'najis/kenajisan' sengaja dipertahankan untuk membawa gema ritual dan moral sekaligus. Penanda catatan kaki [a] ditempatkan tepat setelah idiom yang dijelaskan.
