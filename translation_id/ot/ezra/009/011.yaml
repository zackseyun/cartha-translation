revisions:
- from: yang telah Kauperintahkan melalui hamba-hamba-Mu, para nabi, dengan berfirman, “Negeri yang sedang kamu masuki untuk diduduki itu adalah negeri yang najis karena kenajisan bangsa-bangsa di berbagai negeri dan karena perbuatan-perbuatan mereka yang menjijikkan. Dengan kenajisan mereka, bangsa-bangsa itu telah memenuhi negeri tersebut dari ujung ke ujung.[a]”
  to: yang telah Kauperintahkan melalui hamba-hamba-Mu, para nabi, dengan berfirman, “Negeri yang kamu masuki untuk kamu miliki itu adalah negeri yang najis karena kenajisan bangsa-bangsa di negeri-negeri itu, karena kekejian mereka, yang dengannya mereka telah memenuhi negeri itu dari ujung ke ujung[a] dengan kenajisan mereka.”
  rationale: 'Revisi memperbaiki ketepatan sintaksis dan leksikal tanpa mengubah makna: bangsa-bangsa memenuhi negeri melalui kekejian mereka dan dengan kenajisan mereka. Catatan kaki tetap ditambatkan langsung pada idiom yang dijelaskannya.'
