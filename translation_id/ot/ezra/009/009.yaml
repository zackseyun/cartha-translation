id: EZR.9.9
reference: Ezra 9:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי עֲבָדִ֣ים אֲנַ֔חְנוּ וּ/בְ/עַבְדֻ֔תֵ/נוּ לֹ֥א עֲזָבָ֖/נוּ אֱלֹהֵ֑י/נוּ וַֽ/יַּט עָלֵ֣י/נוּ חֶ֡סֶד לִ/פְנֵי֩ מַלְכֵ֨י פָרַ֜ס לָֽ/תֶת לָ֣/נוּ מִֽחְיָ֗ה לְ/רוֹמֵ֞ם אֶת בֵּ֤ית אֱלֹהֵ֨י/נוּ֙ וּ/לְ/הַעֲמִ֣יד אֶת חָרְבֹתָ֔י/ו וְ/לָֽ/תֶת לָ֣/נוּ גָדֵ֔ר בִּֽ/יהוּדָ֖ה וּ/בִ/ירוּשָׁלִָֽם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/009.yaml
  text: For we are servants[a]; yet in our slavery our God has not forsaken us, but has extended covenant faithfulness to us before the kings of Persia, to give us reviving, to raise up the house of our God, to set up its ruins[b], and to give us a wall in Judah and in Jerusalem.
translation:
  language: id
  text: Sebab kami adalah budak. Namun, dalam perbudakan kami, Allah kami tidak meninggalkan kami. Ia mengulurkan kasih setia-Nya[a] kepada kami di hadapan raja-raja Persia untuk mengaruniakan kehidupan baru kepada kami, menegakkan kembali rumah Allah kami, memulihkan reruntuhannya, serta memberi kami tembok[b] di Yehuda dan Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “belas kasih yang teguh”, “kebaikan”, atau “kemurahan”. Kata Ibrani חֶסֶד mencakup kasih dan kemurahan yang loyal serta teguh.
    reason: lexical_alternative
  - marker: b
    text: Atau “pagar pelindung”. Gambaran ini mungkin menunjuk secara lebih luas pada keamanan dan perlindungan di Yehuda dan Yerusalem, bukan hanya pada tembok harfiah.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדִים / בְעַבְדֻתֵנוּ
  choice: budak / dalam perbudakan kami
  rationale: Kedua kata serumpun ini menyatakan keadaan takluk dan terikat di bawah kuasa asing; pasangan terjemahan tersebut mempertahankan hubungan leksikal dan daya retoris teks.
- source_word: עֲזָבָנוּ
  choice: meninggalkan kami
  rationale: Pilihan ini alami dalam bahasa Indonesia dan mencakup makna meninggalkan atau menelantarkan tanpa memakai ungkapan yang terlalu arkais.
- source_word: וַיַּט עָלֵינוּ חֶסֶד
  choice: Ia mengulurkan kasih setia-Nya kepada kami
  rationale: ‘Mengulurkan’ mempertahankan citra verba נטה, sedangkan ‘kasih setia’ menyampaikan kemurahan yang loyal dan teguh dalam חֶסֶד tanpa membatasinya pada satu rumusan teologis.
- source_word: לִפְנֵי מַלְכֵי פָרַס
  choice: di hadapan raja-raja Persia
  rationale: Ungkapan ini mempertahankan arti relasional-lokatif לִפְנֵי dan menunjukkan bahwa kemurahan Allah terwujud dalam sikap para penguasa Persia.
- source_word: מִחְיָה
  choice: kehidupan baru
  rationale: Dalam konteks pascapembuangan, nomina ini menunjuk pada pemeliharaan sekaligus pemulihan hidup umat; ‘kehidupan baru’ menyampaikan kedua nuansa itu secara wajar.
- source_word: לְרוֹמֵם אֶת בֵּית אֱלֹהֵינוּ
  choice: menegakkan kembali rumah Allah kami
  rationale: ‘Menegakkan kembali’ mempertahankan gambaran mengangkat atau mendirikan serta menyatakan pemulihan bait Allah, sementara ‘rumah Allah’ menjaga bentuk ungkapan Ibrani.
- source_word: וּלְהַעֲמִיד אֶת חָרְבֹתָיו
  choice: memulihkan reruntuhannya
  rationale: Secara harfiah verba kausatif berarti membuat berdiri. Dalam kolokasi dengan ‘reruntuhan’, ‘memulihkan’ menyampaikan hasil yang dimaksud secara jelas dan idiomatis.
- source_word: גָדֵר
  choice: tembok
  rationale: Nomina ini dapat berarti tembok, pagar, atau pembatas. ‘Tembok’ mempertahankan citra konkret, sedangkan kemungkinan makna perlindungan yang lebih luas dicatat dalam catatan kaki.
- source_word: בִיהוּדָה וּבִירוּשָׁלִָם
  choice: di Yehuda dan Yerusalem
  rationale: Preposisi ב bersifat lokatif; terjemahan ini tidak menambahkan gagasan bahwa tembok tersebut secara harfiah mengelilingi seluruh Yehuda dan Yerusalem.
theological_decisions:
- issue: Makna חֶסֶד
  choice: kasih setia
  alternative: belas kasih yang teguh; kebaikan; kemurahan
  rationale: ‘Kasih setia’ mempertahankan unsur kasih, kemurahan, dan loyalitas yang kaya dalam חֶסֶד tanpa menjadikan istilah ‘perjanjian’ eksplisit ketika kata itu sendiri tidak muncul.
- issue: Sifat גָדֵר
  choice: tembok
  alternative: pagar pelindung; perlindungan
  rationale: Teks utama mempertahankan gambaran fisik yang konkret, sedangkan catatan kaki menjaga kemungkinan bahwa gambaran itu menunjuk secara lebih luas pada keamanan yang Allah berikan melalui pemerintahan Persia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa-pengakuan yang khidmat. Kalimat Ibrani yang panjang dipecah agar mudah dipahami, tetapi urutan gagasan dan rangkaian tujuan tetap dipertahankan. Pengulangan ‘kami’ dipertahankan karena penting bagi suara pengakuan komunal.
