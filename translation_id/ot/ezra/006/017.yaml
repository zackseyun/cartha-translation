  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַקְרִ֗בוּ לַ/חֲנֻכַּת֮ בֵּית אֱלָהָ֣/א דְנָה֒ תּוֹרִ֣ין מְאָ֔ה דִּכְרִ֣ין מָאתַ֔יִן אִמְּרִ֖ין אַרְבַּ֣ע מְאָ֑ה וּ/צְפִירֵ֨י עִזִּ֜ין ל/חטיא עַל כָּל יִשְׂרָאֵל֙ תְּרֵֽי עֲשַׂ֔ר לְ/מִנְיָ֖ן שִׁבְטֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/017.yaml
  text: And they offered for the dedication of this house of God one hundred bulls[a], two hundred rams, four hundred lambs, and twelve male goats as a sin offering for all Israel[b], according to the number of the tribes of Israel.
translation:
  language: id
  text: Mereka mempersembahkan untuk penahbisan rumah Allah ini seratus ekor sapi jantan, dua ratus ekor domba jantan, empat ratus ekor anak domba, dan dua belas ekor kambing jantan sebagai kurban penghapus dosa bagi seluruh Israel[a], sesuai dengan jumlah suku-suku Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “atas nama seluruh Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Kedua belas kambing jantan itu sesuai dengan kedua belas suku Israel dan menyatakan bahwa persembahan tersebut mencakup seluruh Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַקְרִבוּ
  choice: Mereka mempersembahkan
  rationale: Bentuk kausatif dari קרב dalam konteks ibadah menunjuk pada tindakan membawa dan mempersembahkan hewan kurban; “mempersembahkan” merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: לַחֲנֻכַּת
  choice: untuk penahbisan
  rationale: חנכה menyatakan upacara dedikasi atau inaugurasi. “Penahbisan” mempertahankan nuansa pengkhususan resmi bagi rumah Allah, sedangkan preposisi ל diterjemahkan “untuk” sebagai penanda tujuan.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: rumah Allah ini
  rationale: Terjemahan ini mempertahankan metafora sumber “rumah Allah” dan penunjuk “ini” tanpa menggantinya dengan istilah penjelas “Bait Allah” atau “kuil”.
- source_word: תּוֹרִין
  choice: sapi jantan
  rationale: Dalam daftar kurban, istilah ini menunjuk pada lembu jantan. “Sapi jantan” jelas dan lazim bagi pembaca Indonesia modern.
- source_word: דִּכְרִין
  choice: domba jantan
  rationale: Istilah Aram ini berarti domba jantan; pilihan tersebut tepat dan mudah dipahami dalam konteks kurban.
- source_word: אִמְּרִין
  choice: anak domba
  rationale: Kata ini menunjuk pada domba muda; “anak domba” adalah padanan Indonesia yang alami.
- source_word: וּצְפִירֵי עִזִּין
  choice: kambing jantan
  rationale: Frasa ini secara khusus menyatakan kambing berkelamin jantan; terjemahan mempertahankan kekhususan tersebut.
- source_word: לחטיא
  choice: sebagai kurban penghapus dosa
  rationale: Istilah ini merupakan sebutan teknis bagi persembahan yang berkaitan dengan dosa atau pemurnian. “Kurban penghapus dosa” menyampaikan fungsi kultisnya tanpa menguraikan teori teologis tertentu.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: bagi seluruh Israel
  rationale: Preposisi עַל di sini menyatakan kepentingan atau perwakilan. “Bagi seluruh Israel” mempertahankan cakupan korporat dan ambiguitas tentang cara persembahan itu mewakili mereka.
- source_word: תְּרֵי עֲשַׂר
  choice: dua belas
  rationale: Padanan langsung bagi bilangan sumber.
- source_word: לְמִנְיָן שִׁבְטֵי יִשְׂרָאֵל
  choice: sesuai dengan jumlah suku-suku Israel
  rationale: Frasa tersebut menjelaskan hubungan bilangan dua belas dengan suku-suku Israel; “sesuai dengan jumlah” mempertahankan daya penjelasnya secara alami.
theological_decisions:
- issue: Cakupan korporat “seluruh Israel” dalam keadaan sesudah pembuangan
  choice: Mempertahankan “bagi seluruh Israel” tanpa membatasinya pada orang-orang buangan yang telah kembali.
  alternative: bagi semua orang buangan yang telah kembali
  rationale: Teks secara eksplisit menyebut “seluruh Israel” dan menghubungkan dua belas kambing dengan jumlah suku Israel. Terjemahan mempertahankan cakupan luas tersebut tanpa menentukan lebih jauh bagaimana semua Israel hadir atau terwakili.
- issue: Makna kultis לחטיא
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Kedua pengertian memiliki dukungan leksikal. “Kurban penghapus dosa” adalah istilah yang jelas dan dikenal luas, tetapi tidak dipakai untuk menjelaskan mekanisme teologis kurban itu secara lebih sempit daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam khidmat tetapi mudah dipahami. Kata bantu bilangan “ekor” dipakai secara konsisten untuk daftar hewan. Susunan daftar mengikuti sumber, sedangkan keterangan fungsi kurban ditempatkan setelah “dua belas ekor kambing jantan” agar alami dalam bahasa Indonesia. Penanda catatan [a] ditempatkan pada frasa yang benar-benar memiliki alternatif leksikal, bukan pada “sapi jantan”.
