base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/019.yaml
  text: And the sons of the exile kept the Passover on the fourteenth day of the first month[a].
translation:
  language: id
  text: Pada hari keempat belas bulan pertama, orang-orang buangan merayakan Paskah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak pembuangan”; maksudnya ialah komunitas orang buangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: merayakan
  rationale: Secara harfiah verba ini berarti 'melakukan' atau 'membuat', tetapi ketika berobjek הַפָּסַח maknanya secara idiomatis ialah menjalankan atau merayakan Paskah. 'Merayakan' alami dalam bahasa Indonesia dan mencakup pelaksanaan ritualnya.
- source_word: בְנֵי הַגּוֹלָה
  choice: orang-orang buangan
  rationale: Ungkapan Ibrani ini secara harfiah berarti 'anak-anak pembuangan', tetapi berfungsi sebagai sebutan kolektif bagi komunitas orang yang mengalami pembuangan. 'Orang-orang buangan' menyampaikan identitas kolektif itu secara alami tanpa membatasi rujukan kepada laki-laki atau menambahkan secara eksplisit bahwa mereka telah kembali.
- source_word: הַפָּסַח
  choice: Paskah
  rationale: Dalam konteks ini istilah tersebut menunjuk pada perayaan Paskah secara luas. Padanan ini tidak mempersempit maknanya hanya kepada kurban, perjamuan, atau hari rayanya.
- source_word: בְאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: Pada hari keempat belas bulan pertama
  rationale: Rumus tanggal Ibrani secara alami diterjemahkan dengan menambahkan 'hari'. Susunan ini jelas dan idiomatis dalam bahasa Indonesia serta mempertahankan sistem penanggalan sumber.
