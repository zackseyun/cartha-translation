  text: וַ/עֲבַ֣דוּ בְנֵֽי יִ֠שְׂרָאֵל כָּהֲנַיָּ֨/א וְ/לֵוָיֵ֜/א וּ/שְׁאָ֣ר בְּנֵי גָלוּתָ֗/א חֲנֻכַּ֛ת בֵּית אֱלָהָ֥/א דְנָ֖ה בְּ/חֶדְוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/016.yaml
  text: And the sons of Israel[a], the priests, the Levites, and the rest of the sons of the exile celebrated the dedication of this house of God with joy.
translation:
  language: id
  text: Lalu orang Israel, para imam, orang Lewi, dan orang-orang buangan yang selebihnya[a] merayakan penahbisan rumah Allah ini dengan sukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “selebihnya dari anak-anak pembuangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבַדוּ
  choice: merayakan
  rationale: Dalam konteks upacara ini, verba tersebut berarti melaksanakan atau menyelenggarakan suatu perayaan. Dengan objek ‘penahbisan’, ‘merayakan’ merupakan padanan Indonesia yang alami.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah ‘anak-anak Israel’ merupakan idiom bagi bangsa Israel; ‘orang Israel’ menyampaikan maknanya secara wajar dalam bahasa Indonesia modern.
- source_word: כָּהֲנַיָּא
  choice: para imam
  rationale: Padanan baku bagi kelompok imam; ‘para’ memperjelas bahwa bentuk sumbernya jamak.
- source_word: וְלֵוָיֵא
  choice: orang Lewi
  rationale: Padanan baku dan alami bagi anggota kelompok Lewi dalam konteks pelayanan rumah Allah.
- source_word: וּשְׁאָר בְּנֵי גָלוּתָא
  choice: dan orang-orang buangan lainnya[a]
  rationale: Ungkapan Aramnya secara harfiah berarti ‘dan selebihnya dari anak-anak pembuangan’. ‘Orang-orang buangan lainnya’ alami dan mempertahankan acuan kepada komunitas pembuangan tanpa menambahkan secara eksplisit bahwa mereka telah kembali.
- source_word: חֲנֻכַּת
  choice: penahbisan
  rationale: Nomina ini menunjuk pada pendedikasian rumah atau mazbah bagi penggunaan kudus. ‘Penahbisan’ sesuai untuk upacara dedikasi rumah Allah dalam konteks ini.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: rumah Allah ini
  rationale: Padanan langsung yang mempertahankan metafora dan istilah sumber ‘rumah Allah’; ‘Bait Allah’ atau ‘kuil’ akan lebih interpretatif.
- source_word: בְּחֶדְוָה
  choice: dengan sukacita
  rationale: Mencerminkan konstruksi preposisi dan nomina dalam sumber serta terdengar wajar dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Makna חֲנֻכַּת sebagai dedikasi rumah Allah
  choice: penahbisan
  alternative: peresmian
  rationale: ‘Penahbisan’ mempertahankan nuansa pengkhususan bagi tujuan kudus, sedangkan ‘peresmian’ dapat terdengar hanya administratif atau seremonial. Pilihan ini tidak menyatakan rincian ritual yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dalam teks Aram dipertahankan, sementara idiom semitis diterjemahkan secara alami. ‘Lalu’ mewakili penghubung naratif וַ tanpa memberi penekanan berlebihan.
