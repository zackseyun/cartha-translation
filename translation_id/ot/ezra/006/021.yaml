  naturalness: Bahasa draft umumnya baku dan alami. Penggunaan “Orang-orang Israel” dan “semua orang” lebih lancar daripada bentuk tunggal-kolektif “Orang Israel” dan “setiap orang” dalam struktur kalimat ini. Penataan koma juga membantu pembaca membedakan kelompok-kelompok yang turut makan.
