  text: וַ/יֹּאכְל֣וּ בְנֵֽי יִשְׂרָאֵ֗ל הַ/שָּׁבִים֙ מֵֽ/הַ/גּוֹלָ֔ה וְ/כֹ֗ל הַ/נִּבְדָּ֛ל מִ/טֻּמְאַ֥ת גּוֹיֵֽ הָ/אָ֖רֶץ אֲלֵ/הֶ֑ם לִ/דְרֹ֕שׁ לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/021.yaml
  text: The sons of Israel who had returned from the exile ate, together with everyone who had separated himself from the uncleanness of the peoples of the land to join them, to seek Yahweh, the God of Israel.
translation:
  language: id
  text: Orang-orang Israel yang telah kembali dari pembuangan itu makan, bersama semua orang yang telah memisahkan diri dari kenajisan bangsa-bangsa negeri itu dan bergabung dengan orang-orang Israel itu[a], untuk mencari TUHAN, Allah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kepada mereka”; maksudnya, mereka menggabungkan diri dengan komunitas yang telah kembali dari pembuangan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: makan
  rationale: Kata kerja ini berarti “makan”. Objeknya, yaitu hidangan Paskah, tersirat dari ayat sebelumnya dan tidak perlu ditambahkan ke dalam teks utama.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan harfiahnya ialah “anak-anak Israel”, tetapi “Orang Israel” lebih alami dalam bahasa Indonesia dan mencakup seluruh umat tanpa memberi kesan bahwa hanya laki-laki yang dimaksud.
- source_word: הַשָּׁבִים מֵהַגּוֹלָה
  choice: yang telah kembali dari pembuangan
  rationale: Frasa partisipial ini menunjuk kepada orang-orang Yehuda yang pulang dari pembuangan.
- source_word: וְכֹל הַנִּבְדָּל
  choice: bersama setiap orang yang telah memisahkan diri
  rationale: Bentuk partisipel tunggal kolektif diterjemahkan secara wajar sebagai “setiap orang”. Kata “bersama” memperlihatkan bahwa kelompok ini turut makan dengan orang-orang yang kembali dari pembuangan.
- source_word: מִטֻּמְאַת גּוֹיֵי הָאָרֶץ
  choice: dari kenajisan bangsa-bangsa negeri itu
  rationale: “Kenajisan” mempertahankan nuansa ritual sekaligus moral dari טֻמְאָה. Bentuk jamak גּוֹיֵי diterjemahkan “bangsa-bangsa” tanpa menentukan identitas mereka secara lebih sempit.
- source_word: אֲלֵהֶם
  choice: dan bergabung dengan mereka
  rationale: Secara harfiah berarti “kepada mereka”. Dalam konteks ini, frasa tersebut menunjukkan keterikatan dengan komunitas yang kembali; unsur penjelas “bergabung” dibuat transparan melalui catatan kaki.
- source_word: לִדְרֹשׁ
  choice: untuk mencari
  rationale: Kata דרשׁ dengan Allah sebagai objek menyatakan tindakan berpaling kepada-Nya dengan kesetiaan dan pengabdian. “Mencari” mempertahankan keluasan makna itu.
- source_word: לַיהוָה
  choice: TUHAN
  rationale: Nama perjanjian YHWH diterjemahkan menurut kebiasaan baku Alkitab bahasa Indonesia sebagai “TUHAN” dengan huruf kapital.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Terjemahan konstruksi yang alami dan tetap mempertahankan identifikasi perjanjian Allah dengan Israel.
theological_decisions:
- issue: Identitas para peserta tambahan dalam perayaan Paskah
  choice: Menyebut mereka secara luas sebagai setiap orang yang memisahkan diri dari kenajisan bangsa-bangsa negeri itu dan bergabung dengan komunitas yang kembali.
  alternative: Menentukan mereka secara khusus sebagai orang non-Israel yang menjadi penganut agama Israel, atau sebagai orang Israel yang tetap tinggal di negeri itu.
  rationale: Teks Ibrani tidak secara tegas menyebut etnis atau asal kelompok ini. Terjemahan mempertahankan keterbukaan tersebut dan tidak memasukkan kategori identitas yang lebih sempit.
- issue: Makna אֲלֵהֶם dalam hubungan dengan kelompok yang kembali
  choice: Menampilkan makna relasionalnya sebagai “bergabung dengan mereka”, disertai catatan tentang bentuk harfiahnya.
  alternative: Menerjemahkannya secara formal sebagai “kepada mereka” atau menghilangkannya sebagai unsur yang dianggap tersirat.
  rationale: Kata ini hadir secara eksplisit dalam teks Ibrani. “Bergabung dengan mereka” menghasilkan bahasa Indonesia yang dapat dipahami, sementara catatan kaki menjaga transparansi terhadap ambiguitas bentuk aslinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat mengalir bagi pembaca umum, sambil mempertahankan istilah penting seperti “pembuangan”, “kenajisan”, “mencari TUHAN”, serta ketidakpastian identitas kelompok peserta tambahan.
