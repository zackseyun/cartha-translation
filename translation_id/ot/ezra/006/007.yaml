  variant: modern standard Indonesian
source:
  edition: WLC
  text: שְׁבֻ֕קוּ לַ/עֲבִידַ֖ת בֵּית אֱלָהָ֣/א דֵ֑ךְ פַּחַ֤ת יְהוּדָיֵ/א֙ וּ/לְ/שָׂבֵ֣י יְהוּדָיֵ֔/א בֵּית אֱלָהָ֥/א דֵ֖ךְ יִבְנ֥וֹן עַל אַתְרֵֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/007.yaml
  text: Leave the work on this house of God alone[a]; let the governor of the Jews and the elders of the Jews rebuild this house of God on its site.
translation:
  language: id
  text: Jangan mengganggu pekerjaan pembangunan rumah Allah ini. Biarlah gubernur orang Yahudi[a] dan para tua-tua orang Yahudi membangun kembali rumah Allah ini di tempatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Yudea.” Istilah Aramnya dapat menunjuk orang-orang dari Yehuda dalam arti etnis ataupun wilayah.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻקוּ
  choice: Jangan mengganggu
  rationale: Bentuk imperatif jamak ini memerintahkan para pejabat agar berhenti mencampuri atau menghalangi pekerjaan. Ungkapan ini menyampaikan daya larangan secara wajar dalam bahasa Indonesia.
- source_word: לַעֲבִידַת
  choice: pekerjaan pembangunan
  rationale: Kata Aram ini berarti pekerjaan atau pelayanan; konteks pembangunan kembali Bait Allah menunjukkan pekerjaan konstruksi.
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: rumah Allah ini
  rationale: Penunjuk דֵךְ mengacu pada rumah Allah tertentu yang sedang dibicarakan; “ini” mempertahankan acuan langsung tersebut.
- source_word: פַּחַת
  choice: gubernur
  rationale: Istilah ini menunjuk pejabat pemerintahan provinsi. “Gubernur” jelas dan tidak terlalu mempersempit jabatan itu.
- source_word: יְהוּדָיֵא
  choice: orang Yahudi
  rationale: Istilah etnogeografis ini dapat menunjuk orang Yahudi atau orang Yudea. “Orang Yahudi” mudah dipahami, sementara kemungkinan regional dicatat dalam catatan kaki.
- source_word: וּלְשָׂבֵי יְהוּדָיֵא
  choice: dan para tua-tua orang Yahudi
  rationale: Kata שָׂבֵי menunjuk para pemimpin senior masyarakat. “Para tua-tua” merupakan padanan yang lazim dalam konteks kepemimpinan komunal.
- source_word: יִבְנוֹן
  choice: biarlah ... membangun kembali
  rationale: Bentuk imperfek jamak dalam gaya dekret memiliki daya yusif atau permisif. “Biarlah” menyampaikan perintah pemberian izin, sedangkan “membangun kembali” sesuai dengan konteks pemulihan Bait Allah.
- source_word: עַל אַתְרֵהּ
  choice: di tempatnya
  rationale: אַתַר berarti tempat atau lokasi. Frasa ini menyatakan bahwa rumah Allah harus didirikan kembali pada tempatnya sendiri tanpa menambahkan unsur yang tidak dinyatakan secara eksplisit.
