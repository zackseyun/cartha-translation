  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שָׂבֵ֤י יְהוּדָיֵ/א֙ בָּנַ֣יִן וּ/מַצְלְחִ֔ין בִּ/נְבוּאַת֙ חַגַּ֣י נביא/ה וּ/זְכַרְיָ֖ה בַּר עִדּ֑וֹא וּ/בְנ֣וֹ וְ/שַׁכְלִ֗לוּ מִן טַ֨עַם֙ אֱלָ֣הּ יִשְׂרָאֵ֔ל וּ/מִ/טְּעֵם֙ כּ֣וֹרֶשׁ וְ/דָרְיָ֔וֶשׁ וְ/אַרְתַּחְשַׁ֖שְׂתְּא מֶ֥לֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/014.yaml
  text: And the elders of the Jews were building and prospering through the prophecy of Haggai the prophet and Zechariah son of Iddo[c][b][a]. They finished building by the decree of the God of Israel and by the decree of Cyrus and Darius and Artaxerxes king of Persia.
translation:
  language: id
  text: Para tua-tua orang Yahudi terus membangun dan berhasil dalam pekerjaan mereka.[a] melalui nubuat Nabi Hagai dan Zakharia anak Ido. Mereka membangun dan menyelesaikannya berdasarkan ketetapan Allah Israel dan berdasarkan ketetapan Koresh, Darius, dan Artahsasta, raja Persia.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan maju dalam pekerjaan mereka” atau “dan pekerjaan mereka berjalan lancar.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menurut perintah”; ungkapan Aram yang sama dipakai untuk Allah dan para raja.
    reason: lexical_alternative
  - marker: c
    text: Ayat ini menghubungkan penyelesaian pembangunan dengan ketetapan Allah Israel dan ketetapan para raja Persia; ketetapan Allah disebut lebih dahulu.
    reason: theological_tension
lexical_decisions:
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: para tua-tua orang Yahudi
  rationale: Ungkapan Aram ini menunjuk pada para pemimpin masyarakat Yahudi. Pilihan ini mempertahankan peran sosial dan sebutan etnis tanpa mengubahnya menjadi keterangan geografis.
- source_word: בָּנַיִן
  choice: terus membangun
  rationale: Partisipel Aram menyatakan tindakan yang sedang berlangsung; 'terus membangun' menyampaikan aspek progresif itu secara alami.
- source_word: וּמַצְלְחִין
  choice: dan berhasil dalam pekerjaan mereka
  rationale: Kata ini dapat berarti berhasil, makmur, atau maju. Frasa ini menyatakan bahwa pekerjaan pembangunan berjalan dengan berhasil tanpa menyiratkan kemakmuran materi.
- source_word: בִּנְבוּאַת
  choice: melalui nubuat
  rationale: Preposisi menandai sarana; pelayanan kenabian Hagai dan Zakharia menjadi sarana yang mendorong keberhasilan pekerjaan tersebut.
- source_word: חַגַּי נביאה
  choice: Nabi Hagai
  rationale: Bentuk nama dan gelar diterjemahkan dengan susunan gelar-nama yang lazim dalam bahasa Indonesia.
- source_word: וּזְכַרְיָה בַּר עִדּוֹא
  choice: dan Zakharia anak Ido
  rationale: '''Bar'' adalah penanda hubungan anak dengan ayah dalam bahasa Aram; ''anak Ido'' merupakan padanan Indonesia yang langsung.'
- source_word: וּבְנוֹ וְשַׁכְלִלוּ
  choice: Mereka membangun dan menyelesaikannya
  rationale: 'Dua verba sumber dipertahankan: mereka membangun lalu membawa pekerjaan itu sampai selesai. Akhiran ''-nya'' secara alami merujuk pada bangunan bait dalam konteks.'
- source_word: מִן טַעַם
  choice: berdasarkan ketetapan
  rationale: Dalam bahasa Aram Kekaisaran, ungkapan ini merujuk pada perintah, keputusan, atau dekret yang berwenang. 'Ketetapan' dapat digunakan secara wajar baik untuk Allah maupun para raja.
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Terjemahan langsung bagi gelar genitif dalam sumber.
- source_word: כּוֹרֶשׁ וְדָרְיָוֶשׁ וְאַרְתַּחְשַׁשְׂתְּא
  choice: Koresh, Darius, dan Artahsasta
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia dan menyajikan daftar secara idiomatis.
- source_word: מֶלֶךְ פָּרָס
  choice: raja Persia
  rationale: Gelar tunggal secara gramatikal paling dekat dengan Artahsasta, sehingga dipertahankan dalam bentuk tunggal dan ditempatkan sesudah nama terakhir.
theological_decisions:
- issue: Hubungan antara ketetapan ilahi dan ketetapan kerajaan
  choice: Penyelesaian pembangunan dikaitkan dengan ketetapan Allah Israel sekaligus ketetapan para raja Persia, dengan ketetapan Allah disebut lebih dahulu.
  alternative: Ketetapan para raja dipahami secara eksplisit sebagai perwujudan yang berada di bawah ketetapan Allah.
  rationale: Teks menyebut kedua tingkat kewenangan itu tanpa menjelaskan hubungan metafisiknya. Terjemahan mempertahankan atribusi ganda dan urutan sumber tanpa menambahkan kesimpulan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Para tua-tua' mempertahankan istilah sosial Alkitab yang mudah dikenali; 'berhasil dalam pekerjaan mereka' menghindari kesan bahwa mereka menjadi kaya. Tanda catatan kaki ditempatkan pada klausa yang diterangkannya.
