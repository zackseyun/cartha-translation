translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Terjemahan mempertahankan sebutan harfiah 'Rumah' bagi Bait Allah dan memakai 'paling lambat pada' untuk menampilkan fungsi batas waktu dari עַד tanpa menghilangkan alternatif bahwa hari ketiga adalah tanggal tepat penyelesaian.
