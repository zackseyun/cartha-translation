  yaml_path: translation/ot/ezra/006/015.yaml
  text: And this house was finished by the third day of the month Adar[b][a], which was the sixth year of the reign of King Darius.
translation:
  language: id
  text: Rumah ini selesai dibangun pada hari ketiga bulan Adar[a], yaitu dalam tahun keenam pemerintahan Raja Darius.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “selambat-lambatnya pada hari ketiga bulan Adar.” Frasa Aram ini dapat menyatakan batas waktu penyelesaian. “Rumah” di sini merujuk pada Bait Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשֵׁיצִיא
  choice: selesai dibangun
  rationale: Bentuk verba Aram ini menyatakan bahwa pembangunan telah dituntaskan. Ungkapan pasif alami dalam bahasa Indonesia mempertahankan fokus pada bangunan, bukan pada para pembangunnya.
- source_word: בַּיְתָה דְנָה
  choice: Rumah ini
  rationale: Secara harfiah berarti 'rumah ini'. Dalam konteks Ezra, 'rumah' merupakan sebutan lazim bagi rumah Allah atau Bait Allah; mempertahankan 'rumah' menjaga bentuk sumber tanpa menutup makna kontekstualnya.
- source_word: עַד יוֹם תְּלָתָה
  choice: paling lambat pada hari ketiga
  rationale: Preposisi עַד menandai batas waktu yang telah dicapai. 'Paling lambat pada' menyampaikan nuansa 'by' secara jelas dalam bahasa Indonesia, sambil mengakui bahwa tanggal itu dapat dipahami sebagai hari tepat penyelesaiannya.
- source_word: לִירַח אֲדָר
  choice: bulan Adar
  rationale: Padanan tanggal yang wajar dan langsung dalam bahasa Indonesia untuk frasa 'bulan Adar'.
- source_word: דִּי הִיא
  choice: yaitu pada
  rationale: Dalam rumus penanggalan ini, frasa tersebut menghubungkan tanggal dengan tahun pemerintahan. 'Yaitu pada' menghasilkan susunan Indonesia yang alami tanpa mengubah hubungan sintaksisnya.
- source_word: שְׁנַת שֵׁת
  choice: tahun keenam
  rationale: Padanan baku bahasa Indonesia bagi penyebutan tahun pemerintahan secara ordinal.
- source_word: לְמַלְכוּת
  choice: pemerintahan
  rationale: Dalam rumus kronologis ini, kata tersebut menunjuk pada masa kekuasaan raja, sehingga 'pemerintahan' merupakan padanan idiomatis.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: Raja Darius
  rationale: Urutan gelar dan nama ini alami dalam bahasa Indonesia serta tetap menyatakan gelar kerajaan yang ada dalam teks Aram.
