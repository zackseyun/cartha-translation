  text: וֵֽ/אלָהָ֞/א דִּ֣י שַׁכִּ֧ן שְׁמֵ֣/הּ תַּמָּ֗ה יְמַגַּ֞ר כָּל מֶ֤לֶךְ וְ/עַם֙ דִּ֣י יִשְׁלַ֣ח יְדֵ֗/הּ לְ/הַשְׁנָיָ֛ה לְ/חַבָּלָ֛ה בֵּית אֱלָהָ֥/א דֵ֖ךְ דִּ֣י בִ/ירוּשְׁלֶ֑ם אֲנָ֤ה דָרְיָ֨וֶשׁ֙ שָׂ֣מֶת טְעֵ֔ם אָסְפַּ֖רְנָא יִתְעֲבִֽד־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/012.yaml
  text: And may the God who has caused his name to dwell there overthrow any king or people who stretches out his hand to alter this[a], to destroy this house of God that is in Jerusalem. I, Darius, have issued a decree[b]; let it be done with all diligence.
translation:
  language: id
  text: Semoga Allah yang telah membuat nama-Nya berdiam di sana[a] menjatuhkan setiap raja atau bangsa yang mengulurkan tangannya untuk mengubahnya dan menghancurkan rumah Allah ini di Yerusalem. Aku, Darius, telah mengeluarkan perintah; hendaklah itu dilaksanakan dengan segera dan saksama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “telah menempatkan nama-Nya di sana.” Ungkapan bahasa Aram ini menghubungkan nama Allah dengan bait sebagai tempat nama-Nya berdiam.
    reason: lexical_alternative
  - marker: b
    text: Kata bahasa Aram ini dapat menyiratkan pelaksanaan yang segera, sungguh-sungguh, atau saksama.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁכִּן שְׁמֵהּ תַּמָּה
  choice: telah membuat nama-Nya berdiam di sana
  rationale: Mempertahankan bentuk kausatif dan ungkapan teologis tentang nama Allah yang dikaitkan dengan tempat ibadah, tanpa menyatakan bahwa keberadaan Allah terbatas pada bait itu.
- source_word: יְמַגַּר
  choice: merobohkan
  rationale: Kata ini menyatakan tindakan menjatuhkan atau meruntuhkan dalam rumusan kutuk kerajaan; 'merobohkan' mempertahankan citra tersebut.
- source_word: כָּל מֶלֶךְ וְעַם
  choice: setiap raja atau bangsa
  rationale: Dalam konteks ancaman umum, frasa ini mencakup siapa pun—raja maupun bangsa—yang menentang ketetapan. 'Atau' menghasilkan bahasa Indonesia yang alami dalam konstruksi bersyarat ini.
- source_word: יִשְׁלַח יְדֵהּ
  choice: mengulurkan tangannya
  rationale: Mempertahankan metafora Semitik untuk mulai bertindak melawan atau mengusik sesuatu.
- source_word: לְהַשְׁנָיָה
  choice: untuk mengubah ketetapan ini
  rationale: Kata kerja berarti mengubah, tetapi objeknya tidak dinyatakan secara eksplisit dalam bahasa Aram. 'Ketetapan ini' dipasok dari konteks administratif agar hubungan kalimat jelas dalam bahasa Indonesia.
- source_word: לְחַבָּלָה בֵּית אֱלָהָא דֵךְ
  choice: dan menghancurkan rumah Allah ... itu
  rationale: Infinitif kedua menyatakan perusakan berat terhadap bait yang sedang dibicarakan; demonstratif דֵךְ secara langsung menerangkan rumah Allah dan secara alami diterjemahkan 'itu'.
- source_word: שָׂמֶת טְעֵם
  choice: telah mengeluarkan perintah
  rationale: Ungkapan administratif kerajaan ini paling wajar dinyatakan sebagai tindakan resmi mengeluarkan perintah.
- source_word: אָסְפַּרְנָא יִתְעֲבִד
  choice: Hendaklah itu dilaksanakan dengan segera
  rationale: Bentuk pasif berfungsi sebagai perintah, sedangkan adverbia menekankan pelaksanaan yang sigap; 'dengan segera' mempertahankan tekanan utamanya tanpa bahasa yang kuno.
theological_decisions:
- issue: Teologi nama Allah dalam kaitannya dengan bait di Yerusalem
  choice: Mempertahankan ungkapan 'membuat nama-Nya berdiam di sana'
  alternative: menempatkan nama-Nya di sana; berdiam di sana
  rationale: Ungkapan sumber mengaitkan nama Allah secara khusus dengan bait, tetapi tidak mengatakan bahwa Allah sendiri terbatas secara ruang di sana. Terjemahan mempertahankan ketegangan dan citra asli itu.
- issue: Sasaran tindakan 'mengubah' yang tidak dinyatakan
  choice: Menambahkan 'ketetapan ini' dalam teks dengan catatan kaki
  alternative: Membiarkan 'untuk mengubah' tanpa objek; memahami yang diubah sebagai rumah Allah
  rationale: Konteks dekret mendukung ketetapan atau pengaturan yang baru diperintahkan sebagai objek tersirat, tetapi sumber tidak menyatakannya secara eksplisit; karena itu tambahan dijelaskan dan alternatif tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada resmi yang sesuai dengan dekret kerajaan. Metafora 'mengulurkan tangannya' dan ungkapan 'nama-Nya berdiam' dipertahankan karena keduanya penting bagi bentuk dan nuansa sumber; unsur yang dipasok demi kejelasan ditandai dalam catatan kaki.
