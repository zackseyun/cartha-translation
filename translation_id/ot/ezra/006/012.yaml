  naturalness: Teks pada dasarnya baku dan bernada resmi. "Menjatuhkan setiap raja atau bangsa" lebih lazim dan tepat secara kolokasi daripada "merobohkan setiap raja atau bangsa." "Dengan segera dan saksama" menyampaikan daya dorong אָסְפַּרְנָא secara alami.
