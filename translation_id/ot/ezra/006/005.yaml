    rationale: Bentuk Aram yang sulit tidak mendukung penambahan “semuanya” secara tegas. Catatan perlu menyampaikan ambiguitas tanpa menentukan jumlah atau rincian gramatikal yang diperselisihkan.
  - severity: low
    issue: “Perkakas-perkakas” kurang alami dalam konteks ini.
    rationale: Nomina kolektif “perkakas” sudah memadai untuk benda-benda bait dan menghasilkan bahasa Indonesia modern yang lebih lancar.
