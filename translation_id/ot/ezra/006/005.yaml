  text: וְ֠/אַף מָאנֵ֣י בֵית אֱלָהָ/א֮ דִּ֣י דַהֲבָ֣/ה וְ/כַסְפָּ/א֒ דִּ֣י נְבֽוּכַדְנֶצַּ֗ר הַנְפֵּ֛ק מִן הֵיכְלָ֥/א דִי בִ/ירוּשְׁלֶ֖ם וְ/הֵיבֵ֣ל לְ/בָבֶ֑ל יַהֲתִיב֗וּן וִ֠/יהָךְ לְ/הֵיכְלָ֤/א דִי בִ/ירֽוּשְׁלֶם֙ לְ/אַתְרֵ֔/הּ וְ/תַחֵ֖ת בְּ/בֵ֥ית אֱלָהָֽ/א־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/005.yaml
  text: And also let the gold and silver vessels of the house of God[a], which Nebuchadnezzar took out of the temple that was in Jerusalem and brought to Babylon, be returned and brought to the temple that is in Jerusalem, each to its place; and you shall put them in the house of God.
translation:
  language: id
  text: Selain itu, hendaklah perkakas emas dan perak milik rumah Allah, yang dikeluarkan Nebukadnezar dari bait yang di Yerusalem dan dibawa ke Babel, dikembalikan dan dibawa[a] ke bait yang di Yerusalem, masing-masing ke tempatnya. Hendaklah engkau menempatkannya di rumah Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dikembalikan, dan biarlah itu pergi ke bait di Yerusalem, ke tempatnya.” Susunan bahasa Aram pada bagian ini sulit; maksud umumnya ialah pemulangan perkakas-perkakas bait ke tempatnya masing-masing di Yerusalem.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַף
  choice: Selain itu
  rationale: Mengungkapkan unsur tambahan dalam ketetapan secara alami dan tetap mempertahankan daya aditifnya.
- source_word: מָאנֵי
  choice: perkakas-perkakas
  rationale: Istilah ini cukup luas untuk berbagai benda dan perlengkapan bait, tanpa membatasi bentuk atau fungsi khususnya.
- source_word: בֵית אֱלָהָא
  choice: rumah Allah
  rationale: Mempertahankan ungkapan harfiah dan membedakannya dari הֵיכְלָא, yang diterjemahkan 'bait'.
- source_word: דִּי דַהֲבָה וְכַסְפָּא
  choice: emas dan perak
  rationale: Menunjukkan bahan pembuat perkakas-perkakas tersebut dengan susunan yang alami dalam bahasa Indonesia.
- source_word: הַנְפֵּק
  choice: dikeluarkan
  rationale: Bentuk kausatif menyatakan bahwa Nebukadnezar mengeluarkan atau memindahkan benda-benda itu dari bait.
- source_word: הֵיכְלָא
  choice: bait
  rationale: Dalam konteks ini menunjuk kepada bangunan suci di Yerusalem; 'bait' mempertahankan register Alkitab yang dikenal dan perbedaan leksikal dengan 'rumah Allah'.
- source_word: וְהֵיבֵל
  choice: dibawa
  rationale: Menyampaikan tindakan pemindahan perkakas-perkakas itu ke Babel secara lugas.
- source_word: יַהֲתִיבוּן
  choice: harus dikembalikan
  rationale: Mencerminkan perintah kerajaan dengan makna pemulangan atau pemulihan benda-benda itu.
- source_word: וִיהָךְ
  choice: dan dibawa
  rationale: Bentuk Aramnya sulit, tetapi dalam konteks meneruskan perintah agar benda-benda itu bergerak kembali menuju bait di Yerusalem; terjemahan ini tidak memaksakan rincian gramatikal yang tidak pasti.
- source_word: לְאַתְרֵהּ
  choice: masing-masing ke tempatnya
  rationale: Pronomina tunggal distributif paling alami dipahami sebagai tempat yang sesuai bagi tiap perkakas.
- source_word: וְתַחֵת
  choice: Engkau harus menempatkannya
  rationale: Mempertahankan perubahan ke orang kedua tunggal dan daya perintah yang ditujukan kepada pejabat pelaksana.
- source_word: בְּבֵית אֱלָהָא
  choice: di rumah Allah
  rationale: Mengikuti ungkapan sumber secara konsisten dan membingkai bait sebagai rumah milik Allah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Perkakas-perkakas' dipakai untuk benda-benda kultis secara umum; 'bait' dan 'rumah Allah' dibedakan untuk mencerminkan dua istilah Aram. Bentuk keputusan kerajaan dipertahankan melalui 'harus' dan sapaan orang kedua tunggal 'Engkau'.
