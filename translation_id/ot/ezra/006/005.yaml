revisions:
- from: Selain itu, perkakas-perkakas emas dan perak dari rumah Allah[a], yang dikeluarkan Nebukadnezar dari bait di Yerusalem dan dibawa ke Babel, harus dikembalikan dan dibawa ke bait di Yerusalem, masing-masing ke tempatnya. Engkau harus menempatkannya di rumah Allah.
  to: Selain itu, hendaklah perkakas emas dan perak milik rumah Allah, yang dikeluarkan Nebukadnezar dari bait yang di Yerusalem dan dibawa ke Babel, dikembalikan dan dibawa[a] ke bait yang di Yerusalem, masing-masing ke tempatnya. Hendaklah engkau menempatkannya di rumah Allah.
  rationale: Revisi memindahkan jangkar catatan ke frasa Aram yang sukar, memperbaiki catatan agar tidak menambahkan penanda jamak yang tidak pasti, dan melancarkan gaya ketetapan dalam bahasa Indonesia. Perbedaan leksikal antara “rumah Allah” dan “bait” tetap dipertahankan, demikian pula sifat distributif “masing-masing ke tempatnya.”
