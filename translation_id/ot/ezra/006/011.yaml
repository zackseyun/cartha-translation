  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל אֱנָ֗שׁ דִּ֤י יְהַשְׁנֵא֙ פִּתְגָמָ֣/א דְנָ֔ה יִתְנְסַ֥ח אָע֙ מִן בַּיְתֵ֔/הּ וּ/זְקִ֖יף יִתְמְחֵ֣א עֲלֹ֑/הִי וּ/בַיְתֵ֛/הּ נְוָל֥וּ יִתְעֲבֵ֖ד עַל דְּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/011.yaml
  text: 'And from me a decree is issued: if any man alters this edict[a], a beam shall be pulled out from his house, and he shall be impaled on it[c][b]; and his house shall be made a refuse heap because of this.'
translation:
  language: id
  text: 'Dan aku mengeluarkan perintah: Setiap orang yang mengubah ketetapan ini, sebatang balok[a] akan dicabut dari rumahnya, lalu orang itu akan disulakan pada balok tersebut[b]. Karena perbuatannya itu, rumahnya akan dijadikan timbunan sampah[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: sebatang kayu.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: digantung pada balok tersebut.'
    reason: alternative_reading
  - marker: c
    text: 'Secara tradisional: timbunan kotoran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים טְעֵם
  choice: aku mengeluarkan perintah
  rationale: Ungkapan administratif ini secara harfiah berarti ‘menetapkan perintah’. Bentuk ‘mengeluarkan perintah’ alami dalam bahasa Indonesia dan sesuai dengan konteks titah kerajaan.
- source_word: יְהַשְׁנֵא
  choice: mengubah
  rationale: Dalam konteks ketetapan kerajaan, kata ini menunjuk pada tindakan mengubah atau mengutak-atik isi ketetapan, bukan sekadar tidak menaatinya.
- source_word: פִּתְגָמָא
  choice: ketetapan
  rationale: Istilah Aram ini merujuk pada pernyataan resmi atau titah. ‘Ketetapan’ mempertahankan nuansa administratif dan tidak terdengar usang.
- source_word: יִתְנְסַח אָע מִן בַּיְתֵהּ
  choice: sebatang balok akan dicabut dari rumahnya
  rationale: Frasa ini menggambarkan kayu bangunan yang dicabut dari rumah pelanggar untuk digunakan dalam penghukuman. ‘Balok’ konkret dan sesuai dengan konteks bangunan.
- source_word: וּזְקִיף יִתְמְחֵא עֲלֹהִי
  choice: orang itu akan disulakan pada balok tersebut
  rationale: Ungkapan ini menggambarkan seseorang yang dipancangkan atau dipasang pada kayu. ‘Disulakan’ paling baik mempertahankan latar penghukuman kuno, sementara kemungkinan ‘digantung’ dicatat dalam catatan kaki.
- source_word: נְוָלוּ
  choice: timbunan sampah
  rationale: Kata ini menunjuk pada timbunan kotoran atau puing yang hina. ‘Timbunan sampah’ jelas bagi pembaca modern dan mempertahankan unsur penghinaan serta penajisan.
- source_word: יִתְעֲבֵד
  choice: akan dijadikan
  rationale: 'Bentuk pasif cocok dengan rumusan hukuman resmi: rumah pelanggar akan diubah menjadi timbunan yang hina.'
- source_word: כָל אֱנָשׁ
  choice: setiap orang
  rationale: Ungkapan ini bersifat umum dan mencakup siapa pun yang melanggar. ‘Setiap orang’ alami dalam bahasa Indonesia tanpa mempersempit cakupannya.
theological_decisions:
- issue: Sifat hukuman mati dalam bahasa pidana kekaisaran
  choice: disulakan pada balok tersebut
  alternative: digantung pada balok tersebut
  rationale: Bahasa Aram menggambarkan tubuh yang ditegakkan atau dipasang pada kayu yang dicabut dari rumah pelanggar. ‘Disulakan’ mempertahankan gambaran penghukuman kuno dan menghindari kesan tiang gantungan modern, tetapi ambiguitas ‘digantung’ tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada resmi yang sesuai bagi maklumat kerajaan. Struktur kalimat dibuat lugas dan bermartabat; pengulangan ‘balok tersebut’ dipakai untuk memperjelas rujukan kata ganti Aram tanpa mengurangi kekerasan hukuman dalam teks.
