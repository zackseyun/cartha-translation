base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/006.yaml
  text: Now Tattenai[a], governor of the province Beyond the River, Shethar-bozenai, and your associates, the officials of Persia who are in Beyond the River[c][b], keep far away from there.
translation:
  language: id
  text: Sekarang, Tatnai, gubernur daerah Seberang Sungai, Syetar-Boznai, dan rekan-rekan mereka, orang-orang Afarsakh[a] yang berada di Seberang Sungai[b], tetaplah jauh dari sana.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Aram ini mungkin menunjuk kepada suatu kelompok pejabat dan dapat juga diterjemahkan “para pejabat.” Identitas tepat kelompok ini tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: “Seberang Sungai” adalah nama administratif Persia bagi wilayah di sebelah barat Sungai Efrat.
    reason: cultural_note
  - marker: c
    text: 'Secara harfiah: “hendaklah kalian berada jauh dari sana.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: Sekarang
  rationale: Penanda wacana bahasa Aram ini membuka perintah raja sebagai tanggapan atas laporan sebelumnya. “Sekarang” mempertahankan peralihannya tanpa menjadikannya hubungan sebab-akibat yang terlalu tegas.
- source_word: תַּתְּנַי
  choice: Tatnai
  rationale: Nama diri dialihaksarakan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: gubernur daerah Seberang Sungai
  rationale: פַּחַת menunjuk kepada gubernur dalam pemerintahan kekaisaran, sedangkan עֲבַר נַהֲרָה merupakan sebutan administratif bagi wilayah di sebelah barat Sungai Efrat dari sudut pandang kekaisaran. “Daerah” menjelaskan fungsi nama itu tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: שְׁתַר בּוֹזְנַי
  choice: Syetar-Boznai
  rationale: Nama majemuk dialihaksarakan dengan ejaan Indonesia dan tanda hubung.
- source_word: וּכְנָוָתְהוֹן
  choice: dan rekan-rekan mereka
  rationale: Nomina ini berarti teman atau rekan, dan akhiran הוֹן adalah orang ketiga maskulin jamak, sehingga “mereka” lebih sesuai dengan teks Aram daripada “kalian”.
- source_word: אֲפַרְסְכָיֵא
  choice: orang-orang Afarsakh
  rationale: Istilah ini tidak pasti dan dapat menunjuk kepada kelompok etnis atau golongan pejabat. Alih aksara menghindari penetapan makna “pejabat Persia” yang tidak dinyatakan secara pasti oleh bentuk Aram.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: yang berada di Seberang Sungai
  rationale: Klausa relatif ini menunjukkan lokasi kelompok tersebut dalam wilayah administratif yang disebut Seberang Sungai.
- source_word: רַחִיקִין הֲוֹו מִן תַּמָּה
  choice: jauhilah tempat itu
  rationale: Ungkapan Aram secara harfiah berarti “hendaklah kalian berada jauh dari sana.” Bentuk imperatif Indonesia ini menyampaikan larangan kerajaan secara alami tanpa menambah objek tindakan tertentu.
