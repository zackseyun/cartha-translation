base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/009.yaml
  text: And whatever is needed—young bulls[a], rams, and lambs for burnt offerings to the God of heaven, wheat, salt, wine, and oil, according to the word of the priests who are in Jerusalem—let it be given to them day by day without fail[b],
translation:
  language: id
  text: Apa pun yang diperlukan—lembu-lembu jantan muda, domba-domba jantan, dan anak-anak domba untuk kurban bakaran kepada Allah semesta langit, juga gandum, garam, anggur, dan minyak—sesuai dengan perkataan[a] para imam di Yerusalem, hendaklah diberikan kepada mereka setiap hari tanpa ada kekurangan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesuai dengan petunjuk para imam di Yerusalem.” Secara harfiah, “sesuai dengan perkataan para imam.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “supaya tidak ada kekurangan.” Maksudnya, persediaan setiap hari itu tidak boleh terlewat atau kurang.
    reason: lexical_and_syntactic_clarification
lexical_decisions:
- source_word: וּמָה חַשְׁחָן
  choice: Apa pun yang diperlukan
  rationale: Gabungan kata tak tentu dan nomina Aram yang berarti kebutuhan menyatakan segala sesuatu yang diperlukan; bentuk ini alami dalam bahasa Indonesia dan sesuai dengan konteks ketetapan administratif.
- source_word: בְנֵי תוֹרִין
  choice: lembu-lembu jantan muda
  rationale: Ungkapan harfiah 'anak-anak lembu' menunjuk kepada lembu jantan muda yang layak dipersembahkan.
- source_word: דִכְרִין
  choice: domba-domba jantan
  rationale: Istilah ini secara khusus menunjuk kepada domba jantan dalam daftar hewan kurban.
- source_word: אִמְּרִין
  choice: anak-anak domba
  rationale: Padanan langsung dan wajar bagi hewan muda dalam daftar kurban.
- source_word: לַעֲלָוָן
  choice: untuk kurban bakaran
  rationale: Istilah kultis ini menunjuk kepada persembahan yang dibakar; 'kurban bakaran' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: kepada Allah semesta langit
  rationale: Mempertahankan gelar khas Aram dalam Ezra. 'Semesta langit' menyampaikan bentuk jamak שְׁמַיָּא secara alami dan bermartabat.
- source_word: חִנְטִין מְלַח חֲמַר וּמְשַׁח
  choice: gandum, garam, anggur, dan minyak
  rationale: Masing-masing unsur diterjemahkan secara langsung; חִנְטִין secara khusus berarti gandum, bukan biji-bijian secara umum.
- source_word: כְּמֵאמַר
  choice: sesuai dengan perkataan
  rationale: Secara formal berarti 'menurut/sesuai perkataan'. Terjemahan utama mempertahankan ungkapan sumber, sementara catatan menjelaskan makna administratifnya.
- source_word: יֹום בְּיֹום דִּי לָא שָׁלוּ
  choice: hari demi hari ... tanpa terputus
  rationale: Ungkapan ini menuntut penyediaan setiap hari dan menegaskan bahwa pemberian itu tidak boleh berhenti atau terlewat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, resmi, dan mudah dipahami. Tanda pisah menata daftar panjang tanpa mengaburkan perintah utama. Istilah 'kurban bakaran' mempertahankan register keagamaan Alkitab, sedangkan 'harus diberikan' mencerminkan nada dekret administratif.
