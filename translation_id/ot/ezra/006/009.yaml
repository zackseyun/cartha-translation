review_pass:
  verdict: revise
  source_fidelity: Draf pada umumnya setia pada daftar kebutuhan, jenis hewan, tujuan kurban, serta ketentuan pemberian harian. Namun, frasa akhir Aram דִּי לָא שָׁלוּ menekankan agar tidak ada kekurangan/kelalaian dalam penyediaan, bukan secara harfiah bahwa pemberian itu “tidak terhenti.” Susunan revisi juga menempatkan “sesuai dengan perkataan para imam” dekat dengan daftar bekal, sebagaimana dalam sumber.
  naturalness: Bahasa draf jelas dan berdaftar resmi. “Hendaklah diberikan” lebih idiomatis untuk bentuk perintah pasif dalam dekret daripada “harus diberikan,” dan “setiap hari tanpa ada kekurangan” menyatakan penegasan akhir dengan alami tanpa mengubah makna.
  terminology: “Kurban bakaran,” “Allah semesta langit,” “lembu-lembu jantan muda,” “domba-domba jantan,” dan “anak-anak domba” merupakan padanan yang tepat dan sesuai register Alkitab. Gelar “Allah semesta langit” mempertahankan idiom khas Ezra-Aram.
  issues:
  - severity: medium
    issue: Catatan b menyebut arti harfiah “supaya tidak terhenti.”
    rationale: Klausa דִּי לָא שָׁלוּ secara lebih tepat berarti “supaya tidak ada kekurangan/kelalaian/omisi,” bukan terutama berhentinya suatu proses. Catatan perlu dikoreksi agar tidak memberi penjelasan leksikal yang menyesatkan.
  - severity: low
    issue: Letak “sesuai dengan perkataan para imam” dalam draf berada setelah “hari demi hari.”
    rationale: Makna masih dapat dipahami, tetapi sumber mengaitkan petunjuk para imam dengan perincian persediaan sebelum perintah pemberian. Menempatkannya lebih awal memperjelas cakupan frasa itu.
  revised_text: Apa pun yang diperlukan—lembu-lembu jantan muda, domba-domba jantan, dan anak-anak domba untuk kurban bakaran kepada Allah semesta langit, juga gandum, garam, anggur, dan minyak—sesuai dengan perkataan[a] para imam di Yerusalem, hendaklah diberikan kepada mereka setiap hari tanpa ada kekurangan[b],
