- from: supaya mereka mempersembahkan kurban yang berbau harum[a] kepada Allah semesta langit dan berdoa bagi kehidupan raja dan anak-anak lelakinya[b].
  to: supaya mereka mempersembahkan aroma yang menyenangkan[a] kepada Allah langit dan berdoa untuk kehidupan raja dan putra-putranya[b].
  rationale: Revised the cultic expression to preserve the source's reference to pleasing aromas rather than adding 'kurban' to the main wording; restored the compact source title 'Allah langit'; and used 'putra-putranya' for a natural formal Indonesian rendering that remains explicitly masculine. The purpose relation and the literal 'life' expression are retained, with contextual alternatives supplied in footnotes.
