  variant: modern standard Indonesian
source:
  edition: WLC
  text: דִּֽי לֶהֱוֺ֧ן מְהַקְרְבִ֛ין נִיחוֹחִ֖ין לֶ/אֱלָ֣הּ שְׁמַיָּ֑/א וּ/מְצַלַּ֕יִן לְ/חַיֵּ֥י מַלְכָּ֖/א וּ/בְנֽוֹ/הִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/010.yaml
  text: so that they may offer pleasing aromas to the God of heaven and pray for the life of the king and his sons[a][b].
translation:
  language: id
  text: supaya mereka mempersembahkan aroma yang menyenangkan[a] kepada Allah langit dan berdoa untuk kehidupan raja dan putra-putranya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aroma yang harum” atau “aroma yang menenangkan.” Istilah Aramiah ini merujuk pada aroma yang menyenangkan dari persembahan kurban yang diterima.
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk kesejahteraan raja dan putra-putranya.” Secara harfiah, “untuk kehidupan raja dan putra-putranya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּי
  choice: supaya
  rationale: Partikel ini memperkenalkan tujuan dari penyediaan kerajaan yang disebutkan sebelumnya; “supaya” menyatakan hubungan tujuan itu secara alami dalam bahasa Indonesia.
- source_word: לֶהֱוֺן מְהַקְרְבִין
  choice: mereka mempersembahkan
  rationale: Bentuk verba dengan partisipel menyampaikan maksud atau tujuan, sedangkan קרב dalam konteks ibadah berarti mempersembahkan kurban.
- source_word: נִיחוֹחִין
  choice: kurban yang berbau harum
  rationale: Istilah ini secara harfiah menunjuk pada aroma yang menyenangkan dari kurban yang diterima. Penambahan “kurban” membuat konteks ritual jelas tanpa menghilangkan gambaran aroma.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: kepada Allah semesta langit
  rationale: Preposisi ל cocok diterjemahkan “kepada” dalam konteks persembahan. Gelar Aramiah harfiah “Allah langit”; “Allah semesta langit” terdengar alami dan menunjukkan bahwa yang dimaksud ialah Allah yang berkuasa atas langit, bukan Allah yang berada di sana saja.
- source_word: וּמְצַלַּיִן
  choice: dan berdoa
  rationale: Partisipel ini menyatakan tindakan berdoa yang sejajar dengan tindakan mempersembahkan.
- source_word: לְחַיֵּי
  choice: bagi kehidupan
  rationale: Terjemahan ini mempertahankan arti harfiah “bagi kehidupan,” sambil memberi catatan bahwa dalam konteks doa kerajaan ungkapan itu dapat berarti kesejahteraan atau keselamatan.
- source_word: מַלְכָּא
  choice: raja
  rationale: Istilah Aramiah ini adalah sebutan biasa untuk raja; meskipun tokohnya penguasa Persia, padanan “raja” paling dekat dengan teks.
- source_word: וּבְנוֹהִי
  choice: dan anak-anak lelakinya
  rationale: Nomina ini berbentuk jamak maskulin dan secara khusus berarti anak-anak lelaki atau putra-putra; pilihan ini mempertahankan kekhususan gender sumber.
theological_decisions:
- issue: Ungkapan ritual נִיחוֹחִין dalam titah kerajaan Persia
  choice: kurban yang berbau harum
  alternative: bau yang menyenangkan; kurban yang menyenangkan hati
  rationale: Terjemahan mempertahankan gambaran indrawi tentang aroma kurban yang berkenan tanpa mereduksinya menjadi sekadar “kurban” atau memasukkan istilah teologis tambahan.
- issue: Cakupan gelar אֱלָהּ שְׁמַיָּא
  choice: Allah semesta langit
  alternative: Allah yang di surga; Allah langit
  rationale: Pilihan ini mempertahankan gelar ilahi dan secara alami menyatakan hubungan Allah dengan seluruh langit, tanpa membatasi maknanya pada lokasi.
- issue: Makna לְחַיֵּי dalam doa bagi penguasa
  choice: bagi kehidupan raja dan anak-anak lelakinya
  alternative: bagi kesejahteraan raja dan anak-anak lelakinya
  rationale: Teks harfiah menyebut “kehidupan,” yang dapat mencakup kelangsungan hidup, keselamatan, dan kesejahteraan. Teks utama mempertahankan bentuk konkret itu dan catatan kaki menyajikan perluasan kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya lugas dan khidmat. “Anak-anak lelakinya” dipilih daripada “putra-putranya” agar mudah dipahami dan tetap mempertahankan gender gramatikal sumber. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
