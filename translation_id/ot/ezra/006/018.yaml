  text: וַ/הֲקִ֨ימוּ כָהֲנַיָּ֜/א בִּ/פְלֻגָּתְ/ה֗וֹן וְ/לֵוָיֵ/א֙ בְּ/מַחְלְקָ֣תְ/ה֔וֹן עַל עֲבִידַ֥ת אֱלָהָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם כִּ/כְתָ֖ב סְפַ֥ר מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/018.yaml
  text: And they set up the priests in their divisions and the Levites in their divisions for the service of God that is in Jerusalem[b][a], as it is written in the Book of Moses.
translation:
  language: id
  text: Mereka menetapkan para imam dalam kelompok-kelompok mereka dan orang-orang Lewi dalam bagian-bagian mereka[a] untuk melaksanakan pelayanan kepada Allah di Yerusalem, sebagaimana tertulis dalam Kitab Musa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kedua kata Aram yang diterjemahkan “kelompok-kelompok” dan “bagian-bagian” adalah istilah organisasi yang maknanya berdekatan; keduanya juga dapat diterjemahkan “bagian-bagian mereka”.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “sesuai dengan yang tertulis dalam Kitab Musa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִימוּ
  choice: mereka menetapkan
  rationale: Bentuk kausatif dari קום berarti membuat berdiri, menempatkan, atau menetapkan. Dalam konteks pengaturan petugas Bait Allah, “menetapkan” menyampaikan tindakan penugasan secara alami.
- source_word: בִּפְלֻגָּתְהוֹן
  choice: menurut kelompok-kelompok mereka
  rationale: Nomina ini menunjuk pada pembagian atau kelompok yang terorganisasi. “Menurut” memperjelas bahwa para imam ditata berdasarkan kelompok masing-masing.
- source_word: בְּמַחְלְקָתְהוֹן
  choice: menurut bagian-bagian mereka
  rationale: Istilah ini juga menunjuk pada pembagian organisasi. “Bagian-bagian” mempertahankan perbedaan leksikal kecil dari istilah sebelumnya tanpa menyiratkan perbedaan fungsi yang tidak dinyatakan teks.
- source_word: עַל עֲבִידַת אֱלָהָא
  choice: untuk melaksanakan pelayanan kepada Allah
  rationale: Gabungan preposisi dan nomina menunjukkan penugasan bagi pekerjaan atau pelayanan Allah. Bentuk verbal ini alami dalam bahasa Indonesia dan tetap mempertahankan tujuan penetapan mereka.
- source_word: דִּי בִירוּשְׁלֶם
  choice: di Yerusalem
  rationale: Frasa relatif Aram mengaitkan pelayanan tersebut dengan Yerusalem. Dalam bahasa Indonesia, hubungan ini tersampaikan secara alami tanpa harus meniru struktur relatif secara kaku.
- source_word: כִּכְתָב סְפַר מֹשֶׁה
  choice: sebagaimana tertulis dalam Kitab Musa
  rationale: Ungkapan ini menyatakan kesesuaian dengan pedoman tertulis yang dikaitkan dengan Musa. “Kitab Musa” mempertahankan sebutan teks tanpa memperluas klaim tentang cakupan atau bentuk dokumennya.
theological_decisions:
- issue: Hubungan pengaturan pelayanan Bait Allah dengan kewibawaan petunjuk Musa
  choice: Pengaturan para imam dan orang Lewi dinyatakan sesuai dengan apa yang tertulis dalam Kitab Musa.
  alternative: Kalimat dapat dibuat lebih longgar seolah-olah hanya menggambarkan kebiasaan organisasi.
  rationale: Frasa penutup secara eksplisit menghubungkan pengaturan tersebut dengan tulisan dalam Kitab Musa. Terjemahan mempertahankan hubungan normatif itu tanpa memasukkan kesimpulan doktrinal tambahan mengenai kanon atau kepengarangan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah organisasi dibuat mudah dipahami tanpa memakai istilah teknis gerejawi; susunan kalimat menjaga kaitan langsung antara penugasan petugas Bait Allah dan Kitab Musa.
