id: EZR.6.13
reference: Ezra 6:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֱ֠דַיִן תַּתְּנַ֞י פַּחַ֧ת עֲבַֽר נַהֲרָ֛/ה שְׁתַ֥ר בּוֹזְנַ֖י וּ/כְנָוָתְ/ה֑וֹן לָ/קֳבֵ֗ל דִּֽי שְׁלַ֞ח דָּרְיָ֧וֶשׁ מַלְכָּ֛/א כְּנֵ֖מָא אָסְפַּ֥רְנָא עֲבַֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/013.yaml
  text: Then Tattenai[a], the governor of Beyond the River, Shethar-bozenai, and their associates did exactly so[b], in accordance with what King Darius had sent.
translation:
  language: id
  text: Kemudian Tatnai, gubernur wilayah Seberang Sungai[a], Syetar-Bozenai, dan rekan-rekan mereka melaksanakannya dengan saksama[b], sesuai dengan apa yang telah dikirimkan Raja Darius.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seberang Sungai” adalah istilah administratif Persia untuk wilayah di sebelah barat Sungai Efrat, dilihat dari pusat kekaisaran.
    reason: cultural_note
  - marker: b
    text: Atau “melaksanakannya dengan tepat” atau “melaksanakannya dengan segala ketelitian.” Ungkapan Aram ini menekankan kepatuhan yang cermat terhadap arahan raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Kemudian
  rationale: Penanda urutan naratif Aram ini secara alami menyatakan peristiwa berikutnya.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: gubernur wilayah Seberang Sungai
  rationale: פַּחַת menunjuk gubernur provinsi, sedangkan עֲבַר נַהֲרָה adalah sebutan administratif Persia bagi daerah di sebelah barat Sungai Efrat. Kata 'wilayah' memperjelas fungsinya tanpa menggantinya dengan nama modern.
- source_word: שְׁתַר בּוֹזְנַי
  choice: Syetar-Bozenai
  rationale: Nama diri ditransliterasikan dengan ejaan yang wajar bagi pembaca Indonesia.
- source_word: וּכְנָוָתְהוֹן
  choice: dan rekan-rekan mereka
  rationale: Istilah ini merujuk kepada orang-orang yang menyertai atau berhubungan dengan kedua pejabat tersebut, kemungkinan dalam kapasitas resmi.
- source_word: לָקֳבֵל דִּי
  choice: sesuai dengan apa yang
  rationale: Ungkapan ini menyatakan kesesuaian tindakan dengan arahan yang diterima.
- source_word: שְׁלַח
  choice: telah dikirimkan
  rationale: Mempertahankan arti dasar verba 'mengirim'; bentuk lampau menunjukkan bahwa kiriman Raja Darius mendahului pelaksanaannya. Objeknya tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: כְּנֵמָא אָסְפַּרְנָא
  choice: dengan saksama
  rationale: Ungkapan adverbial ini menekankan pelaksanaan yang teliti dan tepat. 'Dengan saksama' alami dalam bahasa Indonesia dan tidak membatasi maknanya hanya pada kecepatan atau kerajinan.
- source_word: עֲבַדוּ
  choice: melaksanakannya
  rationale: Secara harfiah berarti 'melakukan', tetapi dalam konteks ini menunjuk pada pelaksanaan arahan raja. Bentuk ini lebih alami daripada 'melakukan' tanpa objek dalam bahasa Indonesia.
