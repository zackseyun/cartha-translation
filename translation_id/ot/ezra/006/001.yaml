base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/001.yaml
  text: Then King Darius issued a decree[a], and they searched in the house of the archives, where the treasures were stored[c][b], there in Babylon.
translation:
  language: id
  text: Kemudian Raja Darius mengeluarkan perintah[a], lalu mereka mencari di gedung arsip[b], tempat harta benda[c] disimpan di Babel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menetapkan perintah.” Ungkapan ini juga dapat diterjemahkan “mengeluarkan ketetapan.”
    reason: alternative_reading
  - marker: b
    text: “Gedung arsip” secara harfiah berarti “rumah kitab-kitab/dokumen-dokumen,” yaitu tempat penyimpanan catatan resmi.
    reason: lexical_alternative
  - marker: c
    text: “Harta benda” juga dapat dipahami secara lebih luas sebagai barang berharga atau simpanan yang ditempatkan dalam kompleks arsip itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Kemudian
  rationale: Penanda wacana Aram ini melanjutkan urutan peristiwa; “Kemudian” alami dalam narasi Indonesia modern.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: Raja Darius
  rationale: Susunan gelar dan nama ini paling wajar dalam bahasa Indonesia.
- source_word: שָׂם טְעֵם
  choice: mengeluarkan perintah
  rationale: Ungkapan harfiahnya berarti menetapkan perintah atau keputusan. Dalam konteks tindakan administratif raja, “mengeluarkan perintah” jelas dan tidak terlalu mempersempit makna menjadi jenis ketetapan tertentu.
- source_word: וּבַקַּרוּ
  choice: lalu orang-orang melakukan pencarian
  rationale: Bentuk verba orang ketiga jamak dipertahankan secara aktif, sedangkan “orang-orang” menyatakan pelaku yang tidak disebutkan secara khusus.
- source_word: בְּבֵית סִפְרַיָּא
  choice: di gedung arsip
  rationale: Secara harfiah berarti “rumah kitab-kitab/dokumen-dokumen”; dalam konteks administrasi, ini menunjuk tempat penyimpanan arsip resmi.
- source_word: דִּי
  choice: tempat
  rationale: Partikel relatif ini memiliki fungsi lokatif dalam konteks tersebut dan secara alami menghubungkan gedung arsip dengan klausa berikutnya.
- source_word: גִנְזַיָּא
  choice: harta benda
  rationale: Kata ini menunjuk barang berharga, simpanan, atau deposit. “Harta benda” mempertahankan keluasan maknanya tanpa menganggap bahwa yang dimaksud pasti dokumen.
- source_word: מְהַחֲתִין
  choice: disimpan
  rationale: Partisip pasif/resultatif ini menggambarkan barang-barang yang ditempatkan dan tetap berada dalam penyimpanan.
- source_word: תַּמָּה
  choice: di
  rationale: Adverbia lokatif sumber tercermin dalam frasa penutup “di Babel”; pengulangan “di sana” akan terasa janggal setelah “tempat” dalam bahasa Indonesia.
- source_word: בְּבָבֶל
  choice: di Babel
  rationale: Padanan baku bagi nama tempat dan preposisi lokatif tersebut.
