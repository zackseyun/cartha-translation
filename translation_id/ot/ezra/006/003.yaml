  register: Bahasa Indonesia baku, modern, dan bernada resmi sesuai konteks ketetapan kerajaan. Pengulangan ‘Raja Koresh’ dipertahankan karena terdapat dalam teks Aram. Tanda catatan kaki ditempatkan pada frasa yang benar-benar memiliki ketidakpastian tekstual-leksikal.
