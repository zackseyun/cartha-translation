base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/003.yaml
  text: 'In the first year of King Cyrus[a], Cyrus the king issued a decree: Concerning the house of God in Jerusalem, let the house be rebuilt, the place where they offer sacrifices, and let its foundations be laid. Its height shall be sixty cubits, and its width sixty cubits,'
translation:
  language: id
  text: 'Pada tahun pertama pemerintahan Raja Koresh, Raja Koresh mengeluarkan ketetapan: “Mengenai rumah Allah di Yerusalem, hendaklah rumah itu dibangun sebagai tempat orang mempersembahkan kurban, dan hendaklah fondasinya diletakkan.[a] Tingginya harus enam puluh hasta dan lebarnya enam puluh hasta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “fondasinya dipertahankan” atau “fondasinya ditegakkan.” Frasa bahasa Aram ini sulit dan diterjemahkan dengan beragam cara; “fondasinya diletakkan” paling sesuai dengan konteks pembangunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂם טְעֵם
  choice: mengeluarkan ketetapan
  rationale: Ungkapan administratif bahasa Aram ini secara harfiah berarti ‘menetapkan suatu ketetapan’ dan menunjuk pada pemberlakuan keputusan resmi. Pilihan ini alami dalam bahasa Indonesia modern sekaligus mempertahankan nuansa resminya.
- source_word: בֵּית אֱלָהָא
  choice: rumah Allah
  rationale: Terjemahan harfiahnya adalah ‘rumah Allah’. Walaupun yang dimaksud ialah Bait Allah, ‘rumah Allah’ mempertahankan pengulangan kata ‘rumah’ dalam teks sumber.
- source_word: יִתְבְּנֵא
  choice: hendaklah rumah itu dibangun kembali
  rationale: Bentuk imperfek pasif dalam konteks ketetapan ini menyatakan perintah. Kata kerjanya sendiri berarti ‘dibangun’, sedangkan ‘kembali’ dibuat tersurat berdasarkan konteks pemulihan bangunan yang telah dihancurkan.
- source_word: אֲתַר דִּי דָבְחִין דִּבְחִין
  choice: sebagai tempat orang mempersembahkan kurban
  rationale: Bahasa Aram memakai ungkapan serumpun secara harfiah, ‘tempat mereka mengurbankan kurban’. Rumusan Indonesia ini menghindari pengulangan yang janggal tanpa menghilangkan fungsi tempat tersebut.
- source_word: וְאֻשּׁוֹהִי מְסוֹבְלִין
  choice: dan hendaklah fondasinya diletakkan
  rationale: Frasa bahasa Aram ini sulit dan telah dipahami dengan beberapa cara. Dalam konteks pembangunan, ‘fondasinya diletakkan’ memberi makna yang masuk akal, sementara ketidakpastian leksikal dipertahankan dalam catatan kaki.
- source_word: רוּמֵהּ
  choice: tingginya
  rationale: Kata ini menunjuk pada tinggi atau ketinggian bangunan; ‘tingginya’ merupakan istilah arsitektural yang alami.
- source_word: אַמִּין שִׁתִּין
  choice: enam puluh hasta
  rationale: Hasta adalah satuan panjang kuno yang sepadan dengan cubit. Mempertahankan satuan kuno menghindari konversi modern yang tampak terlalu pasti.
- source_word: פְּתָיֵהּ
  choice: lebarnya
  rationale: Kata ini berarti lebar atau keluasan; ‘lebarnya’ adalah padanan Indonesia modern yang langsung dan alami.
