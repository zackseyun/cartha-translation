base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/020.yaml
  text: For the priests and the Levites had purified themselves as one; all of them were clean. And they slaughtered the Passover lamb for all the sons of the exile, and for their brothers the priests, and for themselves.
translation:
  language: id
  text: Sebab para imam dan orang Lewi bersama-sama telah menyucikan diri; semuanya tahir. Mereka menyembelih kurban Paskah bagi semua orang buangan, bagi saudara-saudara mereka, para imam, dan bagi diri mereka sendiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְאֶחָד
  choice: sebagai satu kesatuan
  rationale: Mempertahankan gambaran harfiah ‘sebagai satu’ sekaligus menyampaikan bahwa para imam dan orang Lewi bersama-sama berada dalam keadaan tahir.
- source_word: טְהוֹרִים
  choice: tahir
  rationale: Istilah baku dalam konteks kemurnian ritual, bukan sekadar kebersihan jasmani.
- source_word: הַפֶּסַח
  choice: kurban Paskah
  rationale: Karena kata ini menjadi objek dari ‘menyembelih’, yang dimaksud ialah hewan kurban Paskah; pilihan ini tidak menambahkan jenis hewan atau jumlah yang tidak dinyatakan dalam teks.
- source_word: בְּנֵי הַגּוֹלָה
  choice: orang buangan
  rationale: Ungkapan idiomatis ini menunjuk kepada komunitas yang mengalami pembuangan, bukan secara harfiah hanya anak-anak mereka.
- source_word: אֲחֵיהֶם
  choice: saudara-saudara mereka
  rationale: Mempertahankan sebutan kekerabatan komunal bagi sesama anggota umat.
theological_decisions:
- issue: Makna kemurnian para imam dan orang Lewi
  choice: menyucikan diri ... tahir
  alternative: membersihkan diri ... bersih
  rationale: Konteks perayaan Paskah berbicara tentang kesiapan ritual; istilah ‘menyucikan’ dan ‘tahir’ mempertahankan dimensi itu tanpa menjelaskan tata caranya melampaui teks.
- issue: Identitas pelaku penyembelihan
  choice: Mereka
  alternative: orang-orang Lewi
  rationale: Bentuk verba Ibrani merujuk secara gramatikal kepada para imam dan orang Lewi yang disebut bersama; terjemahan tidak mempersempit pelakunya hanya kepada orang Lewi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur tiga kelompok penerima dipertahankan, sedangkan ‘yaitu para imam’ memperjelas aposisi dalam teks Ibrani tanpa mengubah rujukannya.
