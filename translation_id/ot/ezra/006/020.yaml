  to: Sebab para imam dan orang Lewi bersama-sama telah menyucikan diri; semuanya tahir. Mereka menyembelih kurban Paskah bagi semua orang buangan, bagi saudara-saudara mereka, para imam, dan bagi diri mereka sendiri.
  rationale: Revisi hanya mengganti ungkapan yang kurang alami untuk כְאֶחָד dengan padanan Indonesia yang menyatakan tindakan bersama-sama, serta merapikan aposisi. Semua kelompok penerima, istilah kemurnian ritual, dan ambiguitas mengenai pelaku penyembelihan tetap dipertahankan.
