  - marker: b
    text: “Rumah raja” kemungkinan besar merujuk pada perbendaharaan atau dana kerajaan.
    reason: cultural_note
lexical_decisions:
- source_word: נִדְבָּכִין / נִדְבָּךְ
  choice: lapis / satu lapis
  rationale: Istilah ini menunjuk pada lapisan atau susunan mendatar dalam konstruksi. “Lapis” alami dalam bahasa Indonesia dan dapat dipakai secara konsisten untuk bentuk jamak maupun tunggal.
- source_word: אֶבֶן גְּלָל
  choice: batu pahat
  rationale: Dalam konteks pembangunan, frasa ini paling mungkin menunjuk pada batu bangunan yang telah dibentuk atau dikerjakan. “Batu pahat” jelas bagi pembaca umum tanpa memaksakan arti harfiah “batu gulung” yang kurang wajar dalam konteks ini.
- source_word: תְּלָתָא
  choice: tiga
  rationale: Bilangan pokok yang menerangkan jumlah lapisan konstruksi.
- source_word: אָע חֲדַת
  choice: kayu baru
  rationale: אָע berarti kayu atau bahan kayu, sedangkan חֲדַת berarti baru. “Kayu baru” merupakan ungkapan konstruksi yang alami dan mempertahankan kedua unsur sumber.
- source_word: נִפְקְתָא
  choice: biayanya
  rationale: Kata ini menunjuk pada pengeluaran atau biaya. Bentuk dengan akhiran “-nya” mengacu secara alami pada pekerjaan pembangunan yang sedang diperintahkan.
- source_word: מִן בֵּית מַלְכָּא
  choice: dari rumah raja
  rationale: Terjemahan ini mempertahankan ungkapan harfiah bahasa Aram. Kemungkinan makna administratifnya sebagai perbendaharaan atau dana kerajaan dijelaskan dalam catatan kaki.
- source_word: תִּתְיְהִב
  choice: harus diberikan
  rationale: Bentuk pasif ini menyatakan ketetapan administratif bahwa biaya wajib disediakan. “Harus diberikan” mempertahankan daya perintah sekaligus dekat dengan bentuk sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bernada administratif. Struktur fragmen dipertahankan karena ayat ini melanjutkan ketetapan pada konteks sebelumnya; ungkapan “rumah raja” dipertahankan dalam teks untuk menjaga bentuk sumber, dengan penjelasan kontekstual dalam catatan kaki.
