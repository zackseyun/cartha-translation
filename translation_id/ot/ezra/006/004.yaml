translation:
  language: id
  text: dengan tiga lapis batu yang dipahat[a] dan satu lapis kayu baru, dan biaya itu harus disediakan dari rumah raja[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tiga susun batu yang dipahat.”
