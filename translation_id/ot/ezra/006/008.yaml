  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ לְ/מָ֣א דִֽי תַֽעַבְד֗וּן עִם שָׂבֵ֤י יְהוּדָיֵ/א֙ אִלֵּ֔ךְ לְ/מִבְנֵ֖א בֵּית אֱלָהָ֣/א דֵ֑ךְ וּ/מִ/נִּכְסֵ֣י מַלְכָּ֗/א דִּ֚י מִדַּת֙ עֲבַ֣ר נַהֲרָ֔/ה אָסְפַּ֗רְנָא נִפְקְתָ֛/א תֶּהֱוֵ֧א מִֽתְיַהֲבָ֛א לְ/גֻבְרַיָּ֥/א אִלֵּ֖ךְ דִּי לָ֥א לְ/בַטָּלָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/008.yaml
  text: 'Moreover, I issue a decree concerning what you are to do for these Jewish elders as they rebuild this house of God: Their expenses are to be paid promptly from the royal revenues—the tribute collected in Beyond the River[a]—so that the work is not interrupted.'
translation:
  language: id
  text: 'Selain itu, aku menetapkan suatu ketetapan mengenai apa yang harus kamu lakukan bagi para tua-tua Yahudi ini dalam pembangunan kembali rumah Allah ini: Biaya pembangunan itu harus segera disediakan bagi mereka dari pendapatan kerajaan, yaitu pajak dari wilayah Seberang Sungai[a], supaya pekerjaan itu tidak terhenti.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seberang Sungai” adalah nama administratif Persia bagi wilayah-wilayah di sebelah barat Sungai Efrat.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: Selain itu, aku menetapkan suatu titah
  rationale: Ungkapan Aram ini menyatakan penetapan keputusan resmi oleh raja. Bentuk aktif mempertahankan penutur kerajaan dan daya administratifnya.
- source_word: שָׂבֵי יְהוּדָיֵא אִלֵּךְ
  choice: para tua-tua Yahudi ini
  rationale: Frasa ini menunjuk para pemimpin komunitas Yahudi; 'tua-tua' mempertahankan sebutan jabatan yang lazim dalam bahasa Alkitab Indonesia.
- source_word: לְמִבְנֵא בֵּית אֱלָהָא דֵךְ
  choice: sementara mereka membangun kembali rumah Allah ini
  rationale: דֵךְ adalah kata tunjuk 'ini', bukan bentuk milik. 'Membangun kembali' sesuai dengan konteks pemulihan rumah Allah.
- source_word: מִנִּכְסֵי מַלְכָּא דִּי מִדַּת עֲבַר נַהֲרָה
  choice: dari pendapatan kerajaan—pajak yang dipungut di wilayah Seberang Sungai
  rationale: מִדַּת berarti pajak atau upeti, bukan provinsi. Pajak dari kawasan seberang Efrat merupakan sumber dana pembayaran kerajaan.
- source_word: אָסְפַּרְנָא
  choice: segera
  rationale: Kata pinjaman administratif ini menekankan pelaksanaan yang cepat dan saksama; dalam konteks pembayaran, 'segera' paling jelas dan wajar.
- source_word: נִפְקְתָא תֶּהֱוֵא מִתְיַהֲבָא לְגֻבְרַיָּא אִלֵּךְ
  choice: Biaya mereka harus segera dibayarkan
  rationale: Konstruksi pasif mengharuskan biaya pekerjaan disediakan bagi para tua-tua tersebut; pronomina menghindari pengulangan yang kaku.
- source_word: דִּי לָא לְבַטָּלָא
  choice: supaya pekerjaan itu tidak terhenti
  rationale: Klausa tujuan ini mencegah penghentian pekerjaan. Penyebutan 'pekerjaan itu' memperjelas objek yang tersirat oleh konteks tanpa menetapkan subjek jamak yang tidak dinyatakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Aku' mempertahankan suara langsung raja dalam surat keputusan; 'titah' menyampaikan keputusan resmi tanpa gaya hukum yang terlalu teknis. Istilah administratif diberi bentuk yang alami dan catatan kaki menjelaskan nama kawasan Persia.
