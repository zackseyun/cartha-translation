revisions:
- from: 'Selain itu, aku menetapkan suatu titah tentang apa yang harus kamu lakukan bagi para tua-tua Yahudi ini sementara mereka membangun kembali rumah Allah ini: Biaya mereka harus segera dibayarkan dari pendapatan kerajaan—pajak yang dipungut di wilayah Seberang Sungai[a]—supaya pekerjaan itu tidak terhenti.'
  to: 'Selain itu, aku menetapkan suatu ketetapan mengenai apa yang harus kamu lakukan bagi para tua-tua Yahudi ini dalam pembangunan kembali rumah Allah ini: Biaya pembangunan itu harus segera disediakan bagi mereka dari pendapatan kerajaan, yaitu pajak dari wilayah Seberang Sungai[a], supaya pekerjaan itu tidak terhenti.'
  rationale: Revisi memperjelas bahwa dana biaya pembangunan harus disediakan bagi para tua-tua, bukan sekadar bahwa biaya pribadi mereka dibayar. Revisi juga memakai padanan administratif yang lebih modern dan mengungkapkan fungsi frasa pembangunan secara lebih langsung, sambil mempertahankan nama kawasan Persia serta catatan penjelasnya.
