language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂ֧וּ חַג מַצּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים בְּ/שִׂמְחָ֑ה כִּ֣י שִׂמְּחָ֣/ם יְהוָ֗ה וְֽ/הֵסֵ֞ב לֵ֤ב מֶֽלֶךְ אַשּׁוּר֙ עֲלֵי/הֶ֔ם לְ/חַזֵּ֣ק יְדֵי/הֶ֔ם בִּ/מְלֶ֥אכֶת בֵּית הָ/אֱלֹהִ֖ים אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/022.yaml
  text: And they kept the Feast of Unleavened Bread for seven days with joy[a], because Yahweh had made them joyful and had turned the heart of the king of Assyria toward them, to strengthen their hands in the work of the house of God[c][b], the God of Israel.
translation:
  language: id
  text: Mereka merayakan Hari Raya Roti Tidak Beragi selama tujuh hari dengan sukacita, sebab Yahweh telah membuat mereka bersukacita dan telah menggerakkan hati raja Asyur kepada mereka[a], untuk menguatkan tangan mereka[b] dalam pekerjaan di Rumah Allah, Allah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani menyebut “raja Asyur”. Dalam konteks zaman Ezra, sebutan ini tampaknya digunakan bagi penguasa kekaisaran yang juga mencakup bekas wilayah Asyur.
    reason: cultural_note
  - marker: b
    text: Ungkapan “menguatkan tangan mereka” berarti memberi mereka kekuatan atau dukungan.
    reason: idiom_note
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: mereka merayakan
  rationale: Dengan objek hari raya, עשה berarti merayakan atau menjalankan perayaan, bukan secara harfiah 'membuat'.
- source_word: חַג מַצּוֹת
  choice: Hari Raya Roti Tidak Beragi
  rationale: Nama baku perayaan Israel ini disampaikan dengan istilah Indonesia yang jelas dan lazim.
- source_word: שִׁבְעַת יָמִים בְּשִׂמְחָה
  choice: selama tujuh hari dengan sukacita
  rationale: Mempertahankan keterangan waktu dan nomina 'sukacita' secara alami.
- source_word: שִׂמְּחָם
  choice: telah membuat mereka bersukacita
  rationale: Bentuk Piel menyatakan bahwa Yahweh menyebabkan mereka bersukacita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: וְהֵסֵב לֵב
  choice: dan membalikkan hati
  rationale: Mempertahankan gambaran Ibrani tentang perubahan arah sikap hati tanpa mempersempitnya menjadi sekadar 'memberi perkenanan'.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: raja Asyur
  rationale: Mengikuti sebutan eksplisit dalam teks sumber, meskipun konteksnya berada pada zaman Persia.
- source_word: עֲלֵיהֶם
  choice: kepada mereka
  rationale: Dengan ungkapan 'membalikkan hati', preposisi ini menunjukkan arah sikap kepada mereka.
- source_word: לְחַזֵּק יְדֵיהֶם
  choice: sehingga ia menguatkan tangan mereka
  rationale: Mempertahankan idiom Ibrani mengenai pemberian kekuatan atau dukungan; subjek tersirat dijelaskan sebagai sang raja sesuai hubungan sintaksis yang paling wajar.
- source_word: בִּמְלֶאכֶת בֵּית הָאֱלֹהִים
  choice: dalam pekerjaan pembangunan rumah Allah
  rationale: Konteks Ezra menunjukkan pekerjaan pada rumah Allah; 'pembangunan' memperjelas jenis pekerjaan tanpa mengganti objeknya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi mempertahankan perbedaan antara nama dan gelar.
- issue: Sebutan raja Asyur dalam konteks zaman Persia
  choice: raja Asyur
  alternative: raja Persia
  rationale: Teks Ibrani secara eksplisit menyebut 'raja Asyur'; harmonisasi historis tidak dimasukkan ke dalam teks utama.
- issue: Subjek tindakan 'menguatkan tangan mereka'
  choice: sang raja, dinyatakan dengan 'ia'
  alternative: Yahweh
  rationale: Klausa tujuan paling dekat mengikuti tindakan membalikkan hati raja, sehingga dukungan raja menjadi sarana penguatan; kemungkinan hubungan sintaksis lain tetap diberi catatan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Idiom 'menguatkan tangan' dipertahankan agar citra sumber tidak hilang, dengan penjelasan dalam catatan kaki. Semua penanda catatan kaki hadir dalam teks utama.
