base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/002.yaml
  text: 'And in Ecbatana[a], the fortress that is in the province of Media, a scroll was found[c][b], and this was written in it as a record:'
translation:
  language: id
  text: 'Di Ekbatana[a], di benteng[b] yang terletak di Provinsi Media, ditemukan sebuah gulungan. Di dalamnya tertulis catatan[c] berikut:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "Ahmeta", alih aksara yang lebih dekat dengan nama Aram bagi Ekbatana.
    reason: lexical_alternative
  - marker: b
    text: Atau "kubu". Istilah Aramnya menunjuk kepada kompleks kerajaan atau pemerintahan yang diperkuat.
    reason: lexical_alternative
  - marker: c
    text: Atau "memorandum". Istilah ini menunjuk kepada catatan pengingat resmi atau dokumen arsip.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁתְּכַח
  choice: ditemukan
  rationale: Bentuk pasif verba Aram ini berarti 'ditemukan' dan sesuai dengan konteks pencarian arsip.
- source_word: אַחְמְתָא
  choice: Ekbatana
  rationale: Ekbatana adalah nama historis yang lazim dalam bahasa Indonesia untuk ibu kota Media; bentuk 'Ahmeta' lebih dekat kepada bunyi Aram dan dicatat sebagai alternatif.
- source_word: בִּירְתָא
  choice: benteng
  rationale: Istilah ini menunjuk kepada kompleks kerajaan atau pemerintahan yang diperkuat. 'Benteng' jelas dan alami, sedangkan 'kubu' merupakan kemungkinan lain.
- source_word: דִּי בְּמָדַי מְדִינְתָּה
  choice: yang terletak di Provinsi Media
  rationale: Mempertahankan klausa relatif dan sebutan administratif wilayah tersebut dalam bahasa Indonesia yang alami.
- source_word: מְגִלָּה חֲדָה
  choice: sebuah gulungan
  rationale: Kata bilangan 'satu' di sini dapat berfungsi sebagai penanda ketaktentuan; 'sebuah gulungan' alami tanpa menekankan jumlah secara berlebihan.
- source_word: וְכֵן כְּתִיב
  choice: tertulis ... berikut
  rationale: Ungkapan ini memperkenalkan isi dokumen yang akan dikutip; susunan 'tertulis ... berikut' menyampaikan fungsi deiktisnya secara alami.
- source_word: בְּגַוַּהּ
  choice: di dalamnya
  rationale: Merujuk secara langsung kepada isi gulungan.
- source_word: דִּכְרוֹנָה
  choice: catatan
  rationale: Dalam konteks administrasi, kata ini menunjuk kepada catatan pengingat atau memorandum resmi dalam arsip.
