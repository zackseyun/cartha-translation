translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'rumah Allah' dipertahankan untuk membedakannya dari הֵיכְלָא. 'Bait' digunakan untuk tempat ibadah di Yerusalem dan 'kuil' untuk tempat ibadah di Babel agar rujukan jelas dan ungkapan tetap alami.
