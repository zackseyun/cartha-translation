  text: וְ֠/אַף מָאנַיָּ֣/א דִֽי בֵית אֱלָהָ/א֮ דִּ֣י דַהֲבָ֣/ה וְ/כַסְפָּ/א֒ דִּ֣י נְבוּכַדְנֶצַּ֗ר הַנְפֵּק֙ מִן הֵֽיכְלָ/א֙ דִּ֣י בִֽ/ירוּשְׁלֶ֔ם וְ/הֵיבֵ֣ל הִמּ֔וֹ לְ/הֵיכְלָ֖/א דִּ֣י בָבֶ֑ל הַנְפֵּ֨ק הִמּ֜וֹ כּ֣וֹרֶשׁ מַלְכָּ֗/א מִן הֵֽיכְלָ/א֙ דִּ֣י בָבֶ֔ל וִ/יהִ֨יבוּ֙ לְ/שֵׁשְׁבַּצַּ֣ר שְׁמֵ֔/הּ דִּ֥י פֶחָ֖ה שָׂמֵֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/014.yaml
  text: Also[a], the gold and silver vessels of the house of God, which Nebuchadnezzar had taken out from the temple that was in Jerusalem and brought them to the temple of Babylon—Cyrus the king took them out from the temple of Babylon and gave them to one named Sheshbazzar, whom he had appointed governor.
translation:
  language: id
  text: Juga, perkakas emas dan perak dari rumah Allah, yang telah dikeluarkan Nebukadnezar dari bait yang di Yerusalem dan dibawanya ke bait di Babel—semuanya itu dikeluarkan Raja Koresh dari bait di Babel lalu diberikannya kepada seseorang bernama Sesbazar, yang telah diangkatnya menjadi gubernur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “lalu memberikannya kepada Sesbazar—namanya—yang telah diangkatnya menjadi gubernur.”'
    reason: Menunjukkan rumus penamaan Aram yang secara harfiah menempatkan “namanya” setelah nama Sesbazar; teks utama menyatakannya secara alami sebagai “seseorang bernama Sesbazar.”
lexical_decisions:
- source_word: וְאַף
  choice: Juga
  rationale: Mempertahankan fungsi penghubung yang menambahkan hal lain dalam laporan dengan ungkapan Indonesia yang alami.
- source_word: מָאנַיָּא
  choice: perlengkapan-perlengkapan
  rationale: Menunjuk pada berbagai benda atau perkakas ibadah; pilihan ini konkret dan mudah dipahami tanpa membatasi bentuk bendanya.
- source_word: בֵית אֱלָהָא
  choice: rumah Allah
  rationale: Mempertahankan ungkapan harfiah 'rumah Allah' dan membedakannya dari הֵיכְלָא yang diterjemahkan menurut konteks sebagai bait atau kuil.
- source_word: דִּי דַהֲבָה וְכַסְפָּא
  choice: emas dan perak
  rationale: Menunjukkan bahan perlengkapan tersebut dalam susunan Indonesia yang alami.
- source_word: הַנְפֵּק
  choice: telah dikeluarkan
  rationale: Bentuk lampau dengan 'telah' memperjelas bahwa tindakan Nebukadnezar mendahului tindakan Koresh.
- source_word: הֵיכְלָא
  choice: bait / kuil
  rationale: Istilah yang sama merujuk pada tempat ibadah di Yerusalem dan Babel. 'Bait' alami untuk Bait Allah di Yerusalem, sedangkan 'kuil' lebih wajar bagi tempat ibadah di Babel, tanpa mengubah referennya.
- source_word: וְהֵיבֵל הִמּוֹ
  choice: dan dibawanya
  rationale: Akhiran objek jamak dipahami kembali kepada perlengkapan; bentuk ini mempertahankan objek secara idiomatis dalam bahasa Indonesia.
- source_word: כּוֹרֶשׁ מַלְכָּא
  choice: Raja Koresh
  rationale: Urutan gelar dan nama ini paling alami dalam bahasa Indonesia.
- source_word: הַנְפֵּק הִמּוֹ
  choice: semuanya itu dikeluarkan
  rationale: Frasa resumtif ini mengangkat kembali perlengkapan sebagai objek setelah klausa relatif yang panjang.
- source_word: וִיהִיבוּ לְשֵׁשְׁבַּצַּר שְׁמֵהּ
  choice: lalu diserahkannya kepada seseorang bernama Sesbazar
  rationale: Menyampaikan verba pemberian dan rumus penamaan 'namanya' secara alami tanpa kehilangan identifikasi tokoh.
- source_word: פֶחָה
  choice: gubernur
  rationale: Padanan yang baku dan mudah dipahami untuk jabatan administratif Persia ini.
- source_word: שָׂמֵהּ
  choice: telah diangkatnya
  rationale: Dalam konteks jabatan, verba ini berarti menetapkan atau mengangkat seseorang; 'telah' menunjukkan pengangkatan yang terkait dengan penyerahan perlengkapan.
