  text: בֵּ/אדַ֡יִן קָ֠מוּ זְרֻבָּבֶ֤ל בַּר שְׁאַלְתִּיאֵל֙ וְ/יֵשׁ֣וּעַ בַּר יֽוֹצָדָ֔ק וְ/שָׁרִ֣יו לְ/מִבְנֵ֔א בֵּ֥ית אֱלָהָ֖/א דִּ֣י בִ/ירֽוּשְׁלֶ֑ם וְ/עִמְּ/ה֛וֹן נביאי/א דִֽי אֱלָהָ֖/א מְסָעֲדִ֥ין לְ/הֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/002.yaml
  text: Then Zerubbabel son of Shealtiel and Jeshua son of Jozadak arose and began to build the house of God that is in Jerusalem[a], and with them were the prophets of God[c][b], supporting them.
translation:
  language: id
  text: Kemudian Zerubabel anak Sealtiel dan Yesua[b] anak Yozadak bangkit dan mulai membangun rumah Allah yang ada di Yerusalem[a]. Nabi-nabi Allah menyertai mereka dan mendukung[c] mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bait Allah.” Secara harfiah, bahasa Aram berbunyi “rumah Allah.”
    reason: lexical_alternative
  - marker: b
    text: Yesua adalah bentuk nama pribadi yang dipakai di sini; bandingkan bentuk nama yang berkaitan, “Yosua,” di bagian lain.
    reason: lexical_alternative
  - marker: c
    text: Atau “membantu” atau “menolong.” Bentuk partisipel ini menyatakan dukungan yang aktif.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Kemudian
  rationale: Penanda wacana bahasa Aram ini melanjutkan urutan peristiwa; “Kemudian” alami dalam narasi bahasa Indonesia.
- source_word: קָמוּ
  choice: bangkit
  rationale: Mempertahankan arti dasar ‘bangun/berdiri’ sekaligus menyampaikan tindakan tegas untuk memulai pekerjaan.
- source_word: זְרֻבָּבֶל בַּר שְׁאַלְתִּיאֵל
  choice: Zerubabel anak Sealtiel
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan menerjemahkan patronimik Aram בַּר secara langsung sebagai “anak”.
- source_word: יֵשׁוּעַ בַּר יוֹצָדָק
  choice: Yesua anak Yozadak
  rationale: “Yesua” mempertahankan bentuk nama pendek dalam teks sumber, sedangkan “anak” menerjemahkan patronimik secara langsung.
- source_word: וְשָׁרִיו לְמִבְנֵא
  choice: dan mulai membangun
  rationale: Mengungkapkan konstruksi verba ‘mulai’ dengan infinitif secara alami dan tepat dalam bahasa Indonesia.
- source_word: בֵּית אֱלָהָא
  choice: rumah Allah
  rationale: Menerjemahkan ungkapan Aram secara harfiah tanpa menggantinya dalam teks utama dengan istilah kontekstual “Bait Allah” atau “kuil”.
- source_word: דִּי בִירוּשְׁלֶם
  choice: yang ada di Yerusalem
  rationale: Mempertahankan klausa relatif yang menerangkan lokasi rumah Allah.
- source_word: וְעִמְּהוֹן נביאיא דִי אֱלָהָא מְסָעֲדִין לְהוֹן
  choice: Nabi-nabi Allah menyertai mereka dan mendukung mereka
  rationale: Menyampaikan bahwa para nabi hadir bersama mereka dan secara aktif memberi bantuan; susunan ini lebih alami dalam bahasa Indonesia daripada mempertahankan inversi Aram.
theological_decisions:
- issue: Sebutan bagi bangunan yang dibangun
  choice: rumah Allah
  alternative: Bait Allah; rumah ibadah Allah
  rationale: Teks Aram secara harfiah berbunyi “rumah Allah.” Pilihan ini mempertahankan ungkapan sumber dan membiarkan catatan kaki menjelaskan bahwa yang dimaksud adalah Bait Allah.
- issue: Sifat peran para nabi
  choice: menyertai dan mendukung mereka secara aktif
  alternative: membantu mereka; menolong mereka
  rationale: Partisipel Aram menunjukkan dukungan yang berlangsung atau aktif, tetapi tidak menentukan secara lebih sempit bentuk bantuan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama-nama mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Struktur kalimat terakhir disusun ulang secara wajar tanpa menghilangkan kehadiran dan dukungan aktif para nabi.
