  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בֵּ/הּ זִמְנָ/א֩ אֲתָ֨א עֲלֵי/ה֜וֹן תַּ֠תְּנַי פַּחַ֧ת עֲבַֽר נַהֲרָ֛/ה וּ/שְׁתַ֥ר בּוֹזְנַ֖י וּ/כְנָוָתְ/ה֑וֹן וְ/כֵן֙ אָמְרִ֣ין לְ/הֹ֔ם מַן שָׂ֨ם לְ/כֹ֜ם טְעֵ֗ם בַּיְתָ֤/א דְנָה֙ לִ/בְּנֵ֔א וְ/אֻשַּׁרְנָ֥/א דְנָ֖ה לְ/שַׁכְלָלָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/003.yaml
  text: 'At that time Tattenai[a], the governor of Beyond the River[c][b], and Shethar-bozenai and their associates came to them and spoke thus to them: “Who gave you a decree to build this house and to complete this structure?”'
translation:
  language: id
  text: Pada waktu itu, Tatenai, gubernur wilayah Seberang Sungai[a], bersama Syetar-Bozenai dan rekan-rekan mereka, datang menemui orang-orang itu dan bertanya kepada mereka, “Siapa yang memberi kalian perintah untuk membangun rumah ini dan menyelesaikan bangunan ini[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seberang Sungai” adalah nama administratif Persia bagi wilayah di sebelah barat Sungai Efrat.
    reason: cultural_note
  - marker: b
    text: Istilah bahasa Aram yang diterjemahkan “bangunan” tidak sepenuhnya pasti. Istilah itu mungkin merujuk secara lebih khusus kepada pekerjaan pembangunan Bait Allah; sebagian orang memahaminya sebagai “tembok” atau “kerangka”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ זִמְנָא
  choice: Pada waktu itu
  rationale: Ungkapan waktu bahasa Aram ini secara alami menempatkan peristiwa dalam latar narasi tanpa menentukan bahwa peristiwa itu tepat bersamaan dengan kejadian sebelumnya.
- source_word: אֲתָא עֲלֵיהוֹן
  choice: datang menemui orang-orang itu
  rationale: Mengungkapkan gerak mendekati para pembangun secara wajar dalam bahasa Indonesia; rujukan pronomina dibuat eksplisit demi kejelasan.
- source_word: תַּתְּנַי
  choice: Tatenai
  rationale: Nama diri ditransliterasikan dalam bentuk yang mudah dibaca oleh pembaca Indonesia.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: gubernur wilayah Seberang Sungai
  rationale: פַּחַת adalah gubernur provinsi, sedangkan עֲבַר נַהֲרָה merupakan sebutan administratif Persia bagi kawasan di sebelah barat Sungai Efrat.
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: bersama Syetar-Bozenai
  rationale: Nama diri ditransliterasikan, sementara konjungsi diterjemahkan secara alami untuk memperlihatkan bahwa ia datang bersama Tatenai.
- source_word: וּכְנָוָתְהוֹן
  choice: dan rekan-rekan mereka
  rationale: Istilah ini menunjuk kepada orang-orang yang tergabung atau berhubungan dengan kedua pejabat tersebut; 'rekan-rekan' mempertahankan cakupan yang luas.
- source_word: וְכֵן אָמְרִין לְהֹם
  choice: dan bertanya kepada mereka
  rationale: Secara harfiah konstruksi ini memperkenalkan perkataan mereka, tetapi karena ucapan langsungnya berupa pertanyaan, 'bertanya' menghasilkan bahasa Indonesia yang alami tanpa mengubah fungsi ujarannya.
- source_word: מַן שָׂם לְכֹם טְעֵם
  choice: Siapa yang memberi kalian perintah
  rationale: טְעֵם dalam bahasa Aram Kekaisaran dapat berarti keputusan, titah, atau perintah resmi. 'Perintah' terdengar alami dan tetap menyampaikan unsur kewenangan resmi.
- source_word: בַּיְתָא דְנָה לִבְנֵא
  choice: untuk membangun rumah ini
  rationale: '''Rumah'' mempertahankan istilah sumber dan rujukannya kepada Bait Allah dapat dipahami dari konteks; verba sumber berarti ''membangun'', bukan secara eksplisit ''membangun kembali''.'
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: bangunan ini
  rationale: Nomina ini tidak sepenuhnya pasti dan dapat menunjuk kepada bangunan, struktur, kerangka, atau mungkin bagian pekerjaan pembangunan. 'Bangunan' mempertahankan keluasan maknanya.
- source_word: לְשַׁכְלָלָה
  choice: menyelesaikan
  rationale: Verba ini menyatakan tindakan membawa sesuatu sampai rampung atau selesai.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk sapaan jamak 'kalian' dipakai karena pertanyaan ditujukan kepada kelompok pembangun. Istilah resmi Persia dijelaskan melalui catatan kaki, sementara ambiguitas אֻשַּׁרְנָא dipertahankan dengan padanan umum 'bangunan'.
