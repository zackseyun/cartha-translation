reference: Ezra 5:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְדִ֣יעַ לֶהֱוֵ֣א לְ/מַלְכָּ֗/א דִּֽי אֲזַ֜לְנָא לִ/יה֤וּד מְדִֽינְתָּ/א֙ לְ/בֵית֙ אֱלָהָ֣/א רַבָּ֔/א וְ/ה֤וּא מִתְבְּנֵא֙ אֶ֣בֶן גְּלָ֔ל וְ/אָ֖ע מִתְּשָׂ֣ם בְּ/כֻתְלַיָּ֑/א וַ/עֲבִ֥ידְתָּ/א דָ֛ךְ אָסְפַּ֥רְנָא מִתְעַבְדָ֖א וּ/מַצְלַ֥ח בְּ/יֶדְ/הֹֽם׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/008.yaml
  text: Let it be known to the king that we went to the province of Judah[a], to the house of the great God. It is being built with great stones, and timber is being laid in the walls[b]. This work is being done diligently and is prospering in their hands.
translation:
  language: id
  text: Hendaklah raja mengetahui bahwa kami telah pergi ke Provinsi Yehuda, ke rumah Allah yang agung. Rumah itu sedang dibangun dengan batu-batu besar[a], dan kayu sedang dipasang di dalam dinding-dindingnya. Pekerjaan ini sedang dikerjakan dengan tekun[b] dan berhasil di tangan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Aram ini dapat merujuk secara umum pada batu-batu bangunan yang sangat besar.
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan cermat”; mungkin juga “dengan cepat”. Nuansa tepat kata Aram ini diperdebatkan, tetapi kata itu jelas menggambarkan pekerjaan yang berlangsung secara efektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא
  choice: Hendaklah ... mengetahui
  rationale: Mencerminkan rumusan administratif Aram yang formal, tetapi tetap wajar dalam bahasa Indonesia modern.
- source_word: לְמַלְכָּא
  choice: raja
  rationale: Menandai raja sebagai penerima laporan; susunan 'Hendaklah raja mengetahui' lebih alami daripada terjemahan harfiah pasif.
- source_word: אֲזַלְנָא
  choice: kami telah pergi
  rationale: Verba ini berarti 'pergi'; bentuk perfektif diterjemahkan sebagai tindakan yang telah dilakukan.
- source_word: לִיהוּד מְדִינְתָּא
  choice: ke Provinsi Yehuda
  rationale: מְדִינְתָּא menunjuk pada satuan administratif kekaisaran, sedangkan Yehuda mempertahankan nama daerah dalam konteks pascapembuangan.
- source_word: לְבֵית אֱלָהָא רַבָּא
  choice: ke rumah Allah yang agung
  rationale: Mempertahankan arti harfiah 'rumah', meskipun yang dimaksud adalah bait Allah, serta menerjemahkan רַבָּא tanpa menambahkan gelar teologis yang lebih khusus.
- source_word: מִתְבְּנֵא
  choice: sedang dibangun
  rationale: Menjaga bentuk pasif dan aspek kegiatan pembangunan yang sedang berlangsung.
- source_word: אֶבֶן גְּלָל
  choice: dengan batu-batu besar
  rationale: Ungkapan itu menunjuk pada batu bangunan berukuran besar; terjemahan ini jelas dan tidak memaksakan etimologi 'digulingkan'.
- source_word: וְאָע
  choice: dan kayu
  rationale: Kata Aram ini berarti kayu atau bahan kayu; 'kayu' alami dalam konteks konstruksi dan tidak mempersempitnya secara pasti menjadi balok.
- source_word: מִתְּשָׂם בְּכֻתְלַיָּא
  choice: sedang dipasang pada dinding-dindingnya
  rationale: Menggambarkan kayu yang ditempatkan pada atau di dalam struktur dinding sambil mempertahankan bentuk pasif.
- source_word: וַעֲבִידְתָּא דָךְ
  choice: Pekerjaan ini
  rationale: Terjemahan langsung yang mencakup seluruh kegiatan pembangunan tanpa mempersempit maknanya.
- source_word: אָסְפַּרְנָא
  choice: dengan tekun
  rationale: Menyampaikan pelaksanaan yang sungguh-sungguh dan efektif, sambil mencatat dalam catatan kaki bahwa nuansa tepat adverbia ini diperdebatkan.
- source_word: מִתְעַבְדָא
  choice: dilaksanakan
  rationale: Bentuk pasif ini secara alami menggambarkan pekerjaan yang sedang dikerjakan.
- source_word: וּמַצְלַח בְּיֶדְהֹם
  choice: dan maju dengan baik di tangan mereka
  rationale: Mempertahankan citra 'di tangan mereka' dan menyampaikan bahwa pekerjaan itu berhasil serta mengalami kemajuan di bawah pelaksanaannya.
theological_decisions:
- issue: Sebutan אֱלָהָא רַבָּא
  choice: Allah yang agung
  alternative: Allah Yang Mahabesar
  rationale: Pilihan ini mempertahankan sifat 'agung/besar' dalam laporan resmi tanpa mengubahnya menjadi gelar ilahi teknis atau memperkuatnya melampaui bentuk Aram.
translation_notes:
  register: Bahasa laporan resmi yang bermartabat dan jelas. Rumusan pembuka mempertahankan nada administratif, sedangkan bentuk-bentuk pasif menjaga sudut pandang naskah Aram. Semua penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskannya.
