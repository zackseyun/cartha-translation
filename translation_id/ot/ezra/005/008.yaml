revisions:
- from: Hendaklah raja mengetahui bahwa kami telah pergi ke Provinsi Yehuda, ke rumah Allah yang agung. Rumah itu sedang dibangun dengan batu-batu besar[a], dan kayu sedang dipasang pada dinding-dindingnya. Pekerjaan ini dilaksanakan dengan tekun[b] dan maju dengan baik di tangan mereka.
  to: Hendaklah raja mengetahui bahwa kami telah pergi ke Provinsi Yehuda, ke rumah Allah yang agung. Rumah itu sedang dibangun dengan batu-batu besar[a], dan kayu sedang dipasang di dalam dinding-dindingnya. Pekerjaan ini sedang dikerjakan dengan tekun[b] dan berhasil di tangan mereka.
  rationale: Revisi kecil ini memperjelas aspek progresif dari bentuk partisipel Aram, memperbaiki relasi spasial kayu dengan dinding, dan mengganti ungkapan yang kurang idiomatis dengan padanan Indonesia modern yang tetap setia pada idiom sumber. Penanda dan isi catatan kaki dipertahankan pada frasa yang relevan.
