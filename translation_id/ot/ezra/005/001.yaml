id: EZR.5.1
reference: Ezra 5:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִתְנַבִּ֞י חַגַּ֣י נביא/ה וּ/זְכַרְיָ֤ה בַר עִדּוֹא֙ נביאי/א עַל יְה֣וּדָיֵ֔/א דִּ֥י בִ/יה֖וּד וּ/בִ/ירוּשְׁלֶ֑ם בְּ/שֻׁ֛ם אֱלָ֥הּ יִשְׂרָאֵ֖ל עֲלֵי/הֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/001.yaml
  text: Haggai the prophet and Zechariah son of Iddo[a], the prophets, prophesied to the Jews who were in Judah and in Jerusalem[b], in the name of the God of Israel who was over them.
translation:
  language: id
  text: Nabi Hagai dan Zakharia anak Ido—kedua nabi itu—bernubuat kepada orang-orang Yahudi[a] yang berada di Yehuda dan Yerusalem, dalam nama Allah Israel[b] yang berkuasa atas mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Yehuda.” Istilah Aramnya dapat menunjuk bangsa Yahudi atau, secara lebih geografis, penduduk Yehuda.
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan wewenang Allah Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְנַבִּי
  choice: bernubuat
  rationale: Bentuk perfek Peal memperkenalkan tindakan kedua nabi. Konjungsi awal tidak perlu diberi penanda waktu seperti “sekarang”; alur narasi tetap alami tanpa tambahan itu.
- source_word: חַגַּי נביאה
  choice: Nabi Hagai
  rationale: Bentuk tertentu נביאה merupakan aposisi bagi Hagai. Susunan “Nabi Hagai” adalah padanan Indonesia yang alami dan bermartabat.
- source_word: וּזְכַרְיָה בַר עִדּוֹא
  choice: dan Zakharia anak Ido
  rationale: Nama-nama mengikuti bentuk baku Indonesia, sedangkan בַר diterjemahkan secara langsung sebagai “anak”.
- source_word: נביאיא
  choice: kedua nabi itu
  rationale: Aposisi jamak yang merangkum Hagai dan Zakharia dipertahankan, tetapi disusun sebagai sisipan agar tidak terasa janggal dalam bahasa Indonesia.
- source_word: עַל
  choice: kepada
  rationale: Sesudah verba “bernubuat”, preposisi ini menandai pihak yang menerima perkataan. Konteks tidak mengharuskan nuansa permusuhan “menentang”.
- source_word: יְהוּדָיֵא
  choice: orang-orang Yahudi
  rationale: Istilah ini dapat menunjuk orang Yahudi secara etnis-komunal maupun penduduk Yehuda. Pilihan utama memakai ungkapan yang paling lazim, sementara nuansa geografis dicatat dalam catatan kaki.
- source_word: דִּי בִיהוּד וּבִירוּשְׁלֶם
  choice: yang tinggal di Yehuda dan Yerusalem
  rationale: דִּי membuka klausa relatif. “Tinggal” menyampaikan keberadaan komunitas itu secara alami; Yehuda cocok dengan latar wilayah pascapembuangan.
- source_word: בְּשֻׁם
  choice: dalam nama
  rationale: Ungkapan ini menyatakan bahwa para nabi berbicara sebagai wakil Allah dan berdasarkan wewenang-Nya. Bentuk tradisional yang masih jelas, “dalam nama”, mempertahankan citra sumber.
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Rangkaian konstruksi ini diterjemahkan langsung dan tentu maknanya.
- source_word: עֲלֵיהוֹן
  choice: yang berkuasa atas mereka
  rationale: Frasa penutup paling mungkin menerangkan Allah Israel. Pilihan ini mengungkapkan posisi Allah “atas” komunitas tersebut dalam bahasa Indonesia yang alami tanpa menghapus unsur otoritas.
theological_decisions:
- issue: Acuan dan daya makna עֲלֵיהוֹן pada akhir ayat
  choice: 'Dipahami sebagai keterangan tentang Allah Israel: “yang berkuasa atas mereka.”'
  alternative: Frasa ini dapat dipertahankan lebih harfiah sebagai “yang ada di atas mereka” atau dipahami dengan penekanan pada kehadiran dan perlindungan Allah atas mereka.
  rationale: Hubungan sintaksis dengan “Allah Israel” paling masuk akal. “Berkuasa atas” menyampaikan otoritas ilahi tanpa memasukkan ajaran khusus di luar teks, sedangkan kemungkinan nuansa kehadiran atau perlindungan tetap diakui.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sisipan dengan tanda pisah mempertahankan aposisi jamak sumber tanpa menghasilkan pengulangan yang kaku. Semua penanda catatan kaki ditempatkan tepat setelah ungkapan yang dijelaskannya.
