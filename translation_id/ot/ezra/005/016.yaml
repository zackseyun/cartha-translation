  text: אֱדַ֨יִן֙ שֵׁשְׁבַּצַּ֣ר דֵּ֔ךְ אֲתָ֗א יְהַ֧ב אֻשַּׁיָּ֛/א דִּי בֵ֥ית אֱלָהָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם וּ/מִן אֱדַ֧יִן וְ/עַד כְּעַ֛ן מִתְבְּנֵ֖א וְ/לָ֥א שְׁלִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/016.yaml
  text: Then this Sheshbazzar came and laid the foundations of the house of God that is in Jerusalem[a]; and from then until now it has been being built[b], but it is not finished.
translation:
  language: id
  text: Kemudian Sesbazar itu datang dan meletakkan fondasi rumah Allah yang ada di Yerusalem[a]. Sejak saat itu sampai sekarang, rumah itu terus dibangun[b], tetapi belum selesai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “meletakkan fondasi.” Ungkapan Aramnya secara literal berbunyi “memberikan fondasi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “rumah itu sedang dibangun.” Kata kerja Aramnya dapat menyatakan proses pasif yang masih berlangsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Kemudian
  rationale: Menandai urutan waktu dalam narasi secara alami dan langsung.
- source_word: שֵׁשְׁבַּצַּר דֵּךְ
  choice: Sesbazar itu
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim, sedangkan demonstratif דֵּךְ dipertahankan dengan 'itu' untuk merujuk kembali kepada tokoh yang baru disebut.
- source_word: אֲתָא
  choice: datang
  rationale: Padanan langsung bagi verba naratif ini.
- source_word: יְהַב אֻשַּׁיָּא
  choice: meletakkan fondasi
  rationale: Ungkapan Aram secara harfiah berarti 'memberikan fondasi', tetapi 'meletakkan fondasi' merupakan padanan idiomatis konstruksi yang akurat dalam bahasa Indonesia.
- source_word: בֵית אֱלָהָא
  choice: rumah Allah
  rationale: Mempertahankan ungkapan sumber tanpa menafsirkannya langsung sebagai 'Bait Allah' atau 'kuil Allah'.
- source_word: דִּי בִירוּשְׁלֶם
  choice: yang ada di Yerusalem
  rationale: Menyampaikan klausa relatif lokatif secara wajar dalam bahasa Indonesia.
- source_word: וּמִן אֱדַיִן וְעַד כְּעַן
  choice: Sejak saat itu sampai sekarang
  rationale: Mempertahankan rentang waktu dari peletakan fondasi hingga waktu penuturan.
- source_word: מִתְבְּנֵא
  choice: rumah itu terus dibangun
  rationale: Bentuk pasif dan nuansa proses yang berlangsung diungkapkan secara alami dengan 'terus dibangun'; subjek 'rumah itu' diperjelas agar tidak rancu.
- source_word: וְלָא שְׁלִם
  choice: tetapi belum selesai
  rationale: '''Belum'' secara alami menyatakan bahwa penyelesaian belum tercapai sampai waktu yang dimaksud, sedangkan ''tetapi'' menangkap pertentangan kontekstual.'
