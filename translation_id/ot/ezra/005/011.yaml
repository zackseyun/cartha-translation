  to: 'Inilah jawaban yang mereka berikan kepada kami[a]: “Kami adalah hamba-hamba Allah langit dan bumi. Kami sedang membangun kembali rumah yang telah dibangun bertahun-tahun yang lalu[b]. Seorang raja besar Israel dahulu membangunnya dan menyelesaikannya.”'
