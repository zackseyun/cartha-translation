reference: Ezra 5:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/כְנֵ֥מָא פִתְגָמָ֖/א הֲתִיב֣וּ/נָא לְ/מֵמַ֑ר אֲנַ֣חְנָא הִמּ֡וֹ עַבְדוֹ/הִי֩ דִֽי אֱלָ֨הּ שְׁמַיָּ֜/א וְ/אַרְעָ֗/א וּ/בָנַ֤יִן בַּיְתָ/א֙ דִּֽי הֲוָ֨א בְנֵ֜ה מִ/קַּדְמַ֤ת דְּנָה֙ שְׁנִ֣ין שַׂגִּיאָ֔ן וּ/מֶ֤לֶךְ לְ/יִשְׂרָאֵל֙ רַ֔ב בְּנָ֖/הִי וְ/שַׁכְלְלֵֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/011.yaml
  text: 'And this is the answer they returned to us[a], saying: We are the servants of the God of heaven and earth, and we are rebuilding the house that was built many years ago[b], which a great king of Israel built and completed.'
translation:
  language: id
  text: 'Inilah jawaban yang mereka berikan kepada kami[a]: “Kami adalah hamba-hamba Allah langit dan bumi. Kami sedang membangun kembali rumah yang telah dibangun bertahun-tahun yang lalu[b]. Seorang raja besar Israel dahulu membangunnya dan menyelesaikannya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Demikianlah pesan yang mereka sampaikan kepada kami.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Kami sedang membangun rumah”; bentuk partisipel Aram menunjukkan tindakan yang sedang berlangsung, sedangkan “membangun kembali” memperjelas bahwa rumah ini pernah berdiri sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְנֵמָא פִתְגָמָא הֲתִיבוּנָא
  choice: Inilah jawaban yang mereka berikan kepada kami
  rationale: Ungkapan Aram ini memperkenalkan isi tanggapan mereka. 'Jawaban' sesuai dengan fungsi פִתְגָם dalam konteks, sedangkan 'mereka berikan kepada kami' mengungkapkan secara alami gagasan harfiah 'mereka kembalikan kepada kami'.
- source_word: לְמֵמַר
  choice: tanda titik dua sebelum kutipan langsung
  rationale: Infinitif pengutip ini secara harfiah berarti 'dengan mengatakan'; dalam bahasa Indonesia modern, titik dua yang langsung diikuti kutipan menyampaikan fungsi wacananya dengan lebih alami.
- source_word: עַבְדוֹהִי
  choice: hamba-hamba
  rationale: Istilah ini dapat berarti budak atau pelayan, tetapi di sini menyatakan pengabdian dan ketaatan kepada Allah; 'hamba-hamba' merupakan padanan yang wajar dan bermartabat.
- source_word: אֱלָהּ שְׁמַיָּא וְאַרְעָא
  choice: Allah semesta langit dan bumi
  rationale: Pilihan ini mempertahankan gelar ilahi yang menyatakan kekuasaan universal. Kata 'semesta' membantu bahasa Indonesia mengungkapkan bentuk jamak Aram שְׁמַיָּא tanpa frasa yang kaku.
- source_word: וּבָנַיִן
  choice: Kami sedang membangun kembali
  rationale: Partisipel Aram menunjukkan tindakan yang sedang berlangsung. 'Membangun kembali' menjelaskan dari konteks bahwa rumah itu pernah berdiri sebelumnya, sambil mencatat alternatif yang lebih harfiah dalam catatan kaki.
- source_word: בַּיְתָא
  choice: rumah
  rationale: Terjemahan harfiah ini mempertahankan sebutan sumber bagi Bait Allah; konteks keseluruhan membuat acuannya dapat dipahami.
- source_word: דִּי הֲוָא בְנֵה מִקַּדְמַת דְּנָה שְׁנִין שַׂגִּיאָן
  choice: yang telah dibangun bertahun-tahun yang lalu
  rationale: Frasa waktu secara harfiah berarti 'sebelum ini, banyak tahun'. Bentuk Indonesia ini alami dan tetap menunjukkan jauhnya waktu pembangunan terdahulu.
- source_word: וּמֶלֶךְ לְיִשְׂרָאֵל רַב
  choice: seorang raja besar Israel
  rationale: רַב menyatakan kebesaran atau keunggulan. Frasa sumber mengacu kepada Salomo tanpa menyebut namanya, sehingga terjemahan juga tidak menambahkannya.
- source_word: בְּנָהִי וְשַׁכְלְלֵהּ
  choice: dibangun dan diselesaikan
  rationale: Kedua verba membedakan tindakan mendirikan bangunan dan menuntaskannya; bentuk pasif dalam klausa relatif menghasilkan kalimat Indonesia yang jelas.
theological_decisions:
- issue: Gelar ilahi dalam surat-menyurat kekaisaran
  choice: Allah semesta langit dan bumi
  alternative: Allah langit dan bumi
  rationale: Gelar ini diterjemahkan sebagai pernyataan langsung tentang kekuasaan universal Allah, bukan sebagai sebutan bagi dewa lokal. 'Semesta' juga mencerminkan keluasan bentuk 'langit' dalam bahasa sumber tanpa menambahkan doktrin tertentu.
- issue: Status para pembangun sebagai עַבְדוֹהִי Allah
  choice: hamba-hamba Allah
  alternative: budak-budak Allah
  rationale: Dalam konteks ini istilah tersebut terutama mengungkapkan pengabdian dan kepatuhan kepada Allah. 'Hamba-hamba' menjaga makna relasional dan religius tanpa menonjolkan perbudakan sebagai status sosial.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kutipan langsung dibuat alami dengan titik dua. 'Rumah' dipertahankan daripada langsung menggantinya dengan 'Bait Allah', dan penanda catatan kaki [a] serta [b] ditempatkan tepat pada bagian yang dijelaskan.
