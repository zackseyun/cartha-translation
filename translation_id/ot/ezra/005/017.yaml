translation_notes:
  register: Bahasa Indonesia baku modern dengan nada resmi dan hormat yang sesuai dengan surat kepada raja. Struktur kalimat diperjelas agar mudah dipahami, tetapi istilah “rumah Allah” dan “perbendaharaan kerajaan” dipertahankan dekat dengan ungkapan Aram. Semua penanda catatan kaki muncul dalam teks utama.
