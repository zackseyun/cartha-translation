  text: וּ/כְעַ֞ן הֵ֧ן עַל מַלְכָּ֣/א טָ֗ב יִ֠תְבַּקַּר בְּ/בֵ֨ית גִּנְזַיָּ֜/א דִּי מַלְכָּ֣/א תַמָּה֮ דִּ֣י בְּ/בָבֶל֒ הֵ֣ן אִיתַ֗י דִּֽי מִן כּ֤וֹרֶשׁ מַלְכָּ/א֙ שִׂ֣ים טְעֵ֔ם לְ/מִבְנֵ֛א בֵּית אֱלָהָ֥/א דֵ֖ךְ בִּ/ירוּשְׁלֶ֑ם וּ/רְע֥וּת מַלְכָּ֛/א עַל דְּנָ֖ה יִשְׁלַ֥ח עֲלֶֽי/נָא־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/017.yaml
  text: And now[a], if it seems good to the king, let a search be made in the royal treasury there in Babylon, whether it is so that a decree was issued by King Cyrus to rebuild this house of God in Jerusalem[b]; and let the king send to us his pleasure concerning this matter.
translation:
  language: id
  text: Sekarang, jika raja berkenan, hendaklah diadakan pemeriksaan di perbendaharaan kerajaan yang ada di Babel, apakah memang ada titah dari Raja Koresh untuk membangun kembali rumah Allah ini di Yerusalem[a]. Kemudian, hendaklah raja menyampaikan kepada kami kehendak raja mengenai perkara ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk membangun rumah Allah ini di Yerusalem.” Kata kerja bahasa Aram secara harfiah berarti “membangun”; “membangun kembali” mencerminkan konteks pemulihan rumah Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau, “perkenanan raja” atau “keputusan raja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעַן
  choice: Sekarang
  rationale: Penanda wacana Aram ini mengantar permohonan sebagai langkah selanjutnya; “Sekarang” alami dalam bahasa Indonesia dan cukup mempertahankan daya penghubungnya.
- source_word: הֵן עַל מַלְכָּא טָב
  choice: jika raja berkenan
  rationale: Ungkapan istana yang sopan ini paling alami diterjemahkan sebagai “jika raja berkenan” dalam bahasa Indonesia modern.
- source_word: יִתְבַּקַּר
  choice: hendaklah diadakan pemeriksaan
  rationale: Bentuk pasif dengan daya permohonan/jusif menunjuk pada pencarian atau pemeriksaan resmi dalam catatan kerajaan.
- source_word: בְּבֵית גִּנְזַיָּא דִּי מַלְכָּא
  choice: di perbendaharaan kerajaan
  rationale: Secara harfiah berarti “rumah harta milik raja”; dalam konteks ini tempat tersebut juga menyimpan dokumen kerajaan. “Perbendaharaan kerajaan” mempertahankan citra sumber tanpa mengubahnya secara pasti menjadi “arsip”.
- source_word: הֵן אִיתַי דִּי
  choice: untuk memastikan apakah benar
  rationale: Ungkapan ini memperkenalkan hal yang hendak dibuktikan melalui pemeriksaan, yakni keberadaan atau kebenaran titah tersebut.
- source_word: מִן כּוֹרֶשׁ מַלְכָּא שִׂים טְעֵם
  choice: Raja Koresh pernah mengeluarkan titah
  rationale: טְעֵם dalam bahasa Aram kerajaan menunjuk pada perintah atau keputusan resmi; “titah” sesuai dengan konteks kerajaan dan “pernah” menyatakan tindakan terdahulu yang sedang diverifikasi.
- source_word: לְמִבְנֵא
  choice: dibangun kembali
  rationale: Kata kerjanya secara bentuk berarti “membangun”, tetapi konteks pemulihan rumah Allah yang telah dihancurkan mendukung “dibangun kembali”; alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: rumah Allah ... ini
  rationale: “Rumah Allah” mempertahankan istilah sumber, sedangkan demonstratif דֵךְ diterjemahkan “ini” sesuai sudut pandang para pengirim.
- source_word: וּרְעוּת מַלְכָּא
  choice: keputusan raja
  rationale: רְעוּת dapat berarti kehendak, perkenanan, atau keputusan raja. Dalam permohonan administratif ini, “keputusan raja” paling jelas menyatakan jawaban resmi yang diminta tanpa meniadakan nuansa kehendak kerajaan.
- source_word: יִשְׁלַח עֲלֵינָא
  choice: hendaklah raja menyampaikan kepada kami
  rationale: Terjemahan ini mempertahankan daya permohonan dan subjek eksplisit, sambil memakai verba Indonesia yang alami untuk pengiriman keputusan atau jawaban resmi.
