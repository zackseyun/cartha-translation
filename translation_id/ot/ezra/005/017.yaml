revisions:
- from: Sekarang, jika raja berkenan, hendaklah diadakan pemeriksaan di perbendaharaan kerajaan yang ada di Babel untuk memastikan apakah benar Raja Koresh pernah mengeluarkan titah agar rumah Allah di Yerusalem ini dibangun kembali[a]. Lalu, hendaklah raja menyampaikan kepada kami keputusan raja mengenai perkara ini.[b]
  to: Sekarang, jika raja berkenan, hendaklah diadakan pemeriksaan di perbendaharaan kerajaan yang ada di Babel, apakah memang ada titah dari Raja Koresh untuk membangun kembali rumah Allah ini di Yerusalem[a]. Kemudian, hendaklah raja menyampaikan kepada kami kehendak raja mengenai perkara ini.[b]
  rationale: Revisi menghilangkan penambahan kecil pada pertanyaan tentang keberadaan titah Koresh, mempertahankan susunan dan fokus sumber, serta memakai "kehendak raja" sebagai padanan utama yang lebih dekat untuk istilah Aram רְעוּת. Catatan kaki a juga dipindahkan agar melekat pada pilihan "membangun kembali" dan mencerminkan alternatif secara utuh.
  reviewer_model: gpt-5.6-terra
