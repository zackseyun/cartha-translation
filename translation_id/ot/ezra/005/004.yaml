translation:
  language: id
  text: Kemudian kami berkata kepada mereka demikian, “Apa nama-nama orang yang membangun bangunan ini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱדַיִן
  choice: Kemudian
  rationale: Keterangan waktu yang melanjutkan urutan tindakan dalam narasi; “kemudian” alami dan tepat dalam bahasa Indonesia.
- source_word: כְּנֵמָא אֲמַרְנָא לְּהֹם
  choice: kami berkata kepada mereka
  rationale: Mempertahankan arti dasar verba “berkata” serta bentuk orang pertama jamak “kami”; כְּנֵמָא berfungsi memperkenalkan isi ucapan dan tidak perlu diterjemahkan tersendiri karena kutipan langsung sudah menyatakannya secara alami.
- source_word: מַן אִנּוּן שְׁמָהָת
  choice: Siapa nama
  rationale: Ungkapan Aram menanyakan identitas melalui nama-nama. Dalam bahasa Indonesia, “Siapa nama orang-orang ...?” menyampaikan pertanyaan itu secara alami tanpa meniru susunan Aram secara kaku.
- source_word: גֻּבְרַיָּא
  choice: orang-orang
  rationale: Dalam konteks ini kata tersebut menunjuk pada sekelompok laki-laki, tetapi bahasa Indonesia lazim memakai “orang-orang” ketika menanyakan nama para pelaku; pilihan ini tidak mengubah identitas kelompok yang dimaksud.
- source_word: דִּי
  choice: yang
  rationale: Partikel relatif yang menghubungkan orang-orang tersebut dengan tindakan membangun.
- source_word: דְנָה בִנְיָנָא
  choice: bangunan ini
  rationale: Menerjemahkan demonstratif dan nomina secara langsung dengan urutan yang alami dalam bahasa Indonesia.
- source_word: בָּנַיִן
  choice: sedang membangun
  rationale: Partisipel menunjukkan tindakan yang berlangsung; “sedang membangun” mempertahankan aspek progresif tanpa menambahkan gagasan “membangun kembali” yang tidak dinyatakan oleh kata ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Bentuk “kami” dipertahankan sesuai teks Aram yang tersedia, tanpa menyelaraskannya secara diam-diam dengan sudut pandang ayat sebelumnya. Kutipan pertanyaan dibuat alami sambil mempertahankan pengulangan leksikal antara “bangunan” dan “membangun”.
