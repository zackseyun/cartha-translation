base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/006.yaml
  text: This is a copy of the letter that Tattenai[a], the governor of Beyond the River, and Shethar-bozenai and his associates, the officials who were in Beyond the River, sent to King Darius.
translation:
  language: id
  text: Inilah salinan surat yang dikirim oleh Tatnai, gubernur wilayah Seberang Sungai, serta Syetar-Bozenai dan rekan-rekannya, yaitu para pejabat[a] di wilayah Seberang Sungai, kepada Raja Darius.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Afarsekhi”, jika istilah ini dipahami sebagai nama suatu kelompok etnis atau administratif, bukan sebutan jabatan.
    reason: alternative_reading
lexical_decisions:
- source_word: פַּרְשֶׁגֶן
  choice: salinan
  rationale: Kata ini menunjuk pada salinan atau reproduksi tertulis sebuah dokumen; “salinan” tepat dan alami dalam konteks surat resmi.
- source_word: אִגַּרְתָּא
  choice: surat
  rationale: Istilah ini berarti komunikasi tertulis resmi; “surat” merupakan padanan Indonesia yang jelas dan wajar.
- source_word: שְׁלַח
  choice: dikirimkan
  rationale: Bentuk pasif menghasilkan susunan Indonesia yang alami karena para pengirim disebut setelah nomina “surat”, tanpa mengubah pelaku atau tindakan dalam teks sumber.
- source_word: תַּתְּנַי
  choice: Tatnai
  rationale: Nama diri dialihaksarakan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: פַּחַת
  choice: gubernur
  rationale: Dalam administrasi Persia Akhemeniyah, istilah ini menunjuk pada kepala pemerintahan suatu wilayah; “gubernur” merupakan padanan modern yang paling mudah dipahami.
- source_word: עֲבַר נַהֲרָה
  choice: daerah Seberang Sungai
  rationale: Ungkapan ini berfungsi sebagai sebutan administratif Persia bagi wilayah di sebelah barat Sungai Efrat. Kata “daerah” memperjelas bahwa ini nama wilayah, bukan sekadar keterangan arah.
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: Setar-Boznai
  rationale: Nama diri dialihaksarakan; tanda hubung mempertahankan bentuk nama majemuk secara mudah dibaca.
- source_word: וּכְנָוָתֵהּ
  choice: dan rekan-rekannya
  rationale: Nomina ini menunjuk kepada orang-orang yang berhubungan atau bertugas bersama tokoh tersebut. “Rekan-rekannya” sesuai dengan konteks administratif dan mempertahankan akhiran pronominal orang ketiga tunggal.
- source_word: אֲפַרְסְכָיֵא
  choice: para pejabat
  rationale: Istilah yang sukar ini mungkin merupakan sebutan fungsional bagi pejabat atau nama kelompok etnis/administratif. Dalam konteks ini, “para pejabat” menyampaikan kemungkinan fungsi tanpa memastikan identitas etnis yang tidak pasti.
- source_word: עַל
  choice: kepada
  rationale: Bersama verba “mengirimkan” dan nama penerima surat, preposisi ini paling alami diterjemahkan “kepada”.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: Raja Darius
  rationale: Susunan gelar di depan nama merupakan bentuk yang alami dalam bahasa Indonesia dan tetap mempertahankan gelar kerajaan.
theological_decisions: []
