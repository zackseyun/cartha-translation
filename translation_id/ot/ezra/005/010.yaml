  text: We also asked them their names[a], to make them known to you[b], that we might write down the names of the men who were at their head.
translation:
  language: id
  text: Kami juga menanyakan nama-nama mereka kepada mereka, untuk memberitahukannya kepadamu[a], supaya kami dapat menuliskan nama orang-orang yang menjadi pemimpin mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk membuat [nama-nama itu] diketahui olehmu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang berada di kepala mereka,” yaitu orang-orang terkemuka di antara mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: Kami juga
  rationale: Gabungan kata sambung dan adverbia menambahkan hal lain dalam laporan para pejabat. “Kami juga” menyampaikan daya aditif itu secara wajar dalam bahasa Indonesia.
- source_word: שְׁמָהָתְהֹם
  choice: nama-nama mereka
  rationale: Nomina jamak dengan pronomina orang ketiga jamak ini secara langsung berarti “nama-nama mereka”.
- source_word: שְׁאֵלְנָא לְּהֹם
  choice: menanyakan ... kepada mereka
  rationale: Verba Aram ini berarti bertanya atau meminta keterangan. Susunan Indonesia “menanyakan nama-nama mereka” menyampaikan maknanya secara alami tanpa mengubah objek pertanyaan.
- source_word: לְהוֹדָעוּתָךְ
  choice: agar dapat kami beritahukan kepada Tuanku
  rationale: 'Infinitif kausatif dari ידע dengan akhiran orang kedua tunggal menyatakan tujuan: nama-nama itu hendak diberitahukan kepada penerima laporan. “Tuanku” sesuai dengan sapaan hormat kepada raja dalam konteks surat resmi.'
- source_word: דִּי נִכְתֻּב
  choice: supaya kami dapat menuliskan
  rationale: Partikel דִּי mengantar klausa tujuan atau hasil, sedangkan verba berarti “menulis”. “Menuliskan” cocok dengan konteks pencatatan nama dalam laporan.
- source_word: שֻׁם גֻּבְרַיָּא
  choice: nama orang-orang
  rationale: שֻׁם berbentuk tunggal tetapi dapat berfungsi kolektif di hadapan nomina jamak. Bahasa Indonesia secara wajar memakai “nama orang-orang”.
- source_word: דִּי בְרָאשֵׁיהֹם
  choice: yang memimpin mereka
  rationale: Ungkapan harfiahnya menggambarkan orang-orang yang berada “di kepala” kelompok. “Yang memimpin mereka” menyampaikan idiom kepemimpinan itu dengan jelas, sementara metafora sumber dipertahankan dalam catatan kaki.
