  text: However[a], in the first year of Cyrus king of Babylon, Cyrus the king issued a decree to rebuild this house of God.
translation:
  language: id
  text: Namun, pada tahun pertama pemerintahan Kores, raja Babel, Kores, sang raja, mengeluarkan ketetapan agar rumah Allah ini dibangun kembali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “agar rumah Allah ini dibangun.” Kata kerja Aramnya sendiri berarti “membangun”; “dibangun kembali” mencerminkan konteks pemulihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַם
  choice: Namun
  rationale: Kata penghubung adversatif Aram ini menyatakan pertentangan dengan uraian sebelumnya; “Namun” wajar dan bermartabat dalam bahasa Indonesia modern.
- source_word: בִּשְׁנַת חֲדָה
  choice: pada tahun pertama pemerintahan
  rationale: Ungkapan ini merujuk pada tahun pertama masa pemerintahan raja. Penambahan “pemerintahan” memperjelas formula penanggalan tanpa mengubah makna.
- source_word: לְכוֹרֶשׁ מַלְכָּא דִּי בָבֶל
  choice: Kores, raja Babel
  rationale: Lamed pada nama raja menandai acuan tahun pemerintahan; susunan ini alami dalam bahasa Indonesia dan mempertahankan gelar yang terdapat dalam teks.
- source_word: שָׂם טְעֵם
  choice: mengeluarkan ketetapan
  rationale: Secara harfiah berarti “menetapkan/menaruh perintah”; dalam konteks administrasi kerajaan, frasa ini menunjuk pada penerbitan keputusan resmi.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: rumah Allah ini
  rationale: Terjemahan ini mempertahankan ungkapan sumber secara formal. Yang dimaksud adalah bait Allah, tetapi “rumah Allah” menjaga citra leksikal teks Aram.
- source_word: לִבְנֵא
  choice: agar ... dibangun kembali
  rationale: Verba Aram pada dasarnya berarti “membangun”. Konteks pemulihan sesudah kehancuran mendukung “dibangun kembali”, sementara arti harfiahnya dipertahankan dalam catatan kaki.
