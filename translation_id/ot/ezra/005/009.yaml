  text: 'Then we asked those elders and said to them as follows: “Who gave you a decree to build this house and to complete this structure?”[a][b]'
translation:
  language: id
  text: 'Kemudian kami bertanya kepada para tua-tua itu dan berkata kepada mereka demikian: “Siapa yang memberi kalian perintah untuk membangun rumah ini dan menyelesaikan bangunan ini?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata bahasa Aram yang diterjemahkan “bangunan” dapat juga menunjuk pada struktur, kerangka, atau bagian konstruksi bangunan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Kemudian
  rationale: Menandai urutan dalam laporan naratif dengan bahasa Indonesia yang alami.
- source_word: שְׁאֵלְנָא לְשָׂבַיָּא אִלֵּךְ
  choice: kami bertanya kepada para tua-tua itu
  rationale: Mempertahankan tindakan bertanya serta penunjukan kepada para pemimpin yang telah disebutkan.
- source_word: כְּנֵמָא אֲמַרְנָא לְּהֹם
  choice: berkata kepada mereka demikian
  rationale: Mengantar kutipan langsung secara cukup formal tanpa menambahkan makna.
- source_word: מַן שָׂם לְכֹם טְעֵם
  choice: Siapa yang memberi kalian titah
  rationale: טְעֵם dalam konteks administratif menunjuk pada perintah atau keputusan resmi; 'titah' mempertahankan nuansa kewenangan.
- source_word: בַּיְתָא דְנָה לְמִבְנְיָה
  choice: untuk membangun rumah ini
  rationale: Menerjemahkan 'rumah' dan 'membangun' secara langsung; konteksnya adalah Bait Allah, tetapi kata sumber tidak secara eksplisit berarti 'membangun kembali'.
- source_word: וְאֻשַּׁרְנָא דְנָה לְשַׁכְלָלָה
  choice: dan menyelesaikan bangunan ini
  rationale: Kata benda yang jarang ini dapat menunjuk pada bangunan, struktur, atau bagian konstruksinya; 'bangunan' alami dalam bahasa Indonesia dan tetap cukup luas, sedangkan kata kerja menyatakan penyelesaian pekerjaan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'para tua-tua' dipakai untuk jabatan kepemimpinan komunal; 'kalian' memperjelas bentuk jamak orang kedua. Pengulangan 'rumah ini ... bangunan ini' dipertahankan karena teks Aram memakai dua nomina, walaupun keduanya mungkin merujuk pada proyek Bait Allah yang sama.
