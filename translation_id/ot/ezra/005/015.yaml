base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/015.yaml
  text: And he said to him[a], ‘Take these vessels, go and put them in the temple that is in Jerusalem, and let the house of God be rebuilt on its site.’
translation:
  language: id
  text: Lalu ia berkata kepadanya, “Ambillah perkakas-perkakas ini, pergilah dan taruhlah semuanya di dalam bait yang ada di Yerusalem. Biarlah rumah Allah dibangun kembali di tempatnya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dibangun di tempatnya.” Kata Aram untuk “tempat” juga dapat diterjemahkan “lokasi” atau “situs.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַר לֵהּ
  choice: Lalu ia berkata kepadanya
  rationale: Bentuk verba orang ketiga maskulin tunggal dan pronomina objek dipertahankan. “Lalu” mengalir alami sebagai penghubung naratif.
- source_word: אֵלֶּה מָאנַיָּא
  choice: perkakas-perkakas ini
  rationale: מָאנַיָּא menunjuk pada benda atau perlengkapan yang dipakai dalam bait; “perkakas-perkakas” cukup luas dan sesuai dengan konteks benda-benda suci.
- source_word: שֵׂא אֵזֶל אֲחֵת הִמּוֹ
  choice: Ambillah ... pergilah dan taruhlah semuanya
  rationale: Rangkaian imperatif dipertahankan dengan bentuk perintah Indonesia yang alami. “Semuanya” menyatakan objek jamak הִמּוֹ dan menghindari pengulangan yang kaku.
- source_word: בְּהֵיכְלָא דִּי בִירוּשְׁלֶם
  choice: di dalam bait yang ada di Yerusalem
  rationale: הֵיכְלָא dalam konteks ini adalah bait atau tempat suci, bukan istana. Klausa relatif דִּי dipertahankan.
- source_word: וּבֵית אֱלָהָא
  choice: Biarlah rumah Allah
  rationale: Terjemahan ini mempertahankan ungkapan harfiah “rumah Allah” serta hubungan kehendak/perintah yang tersirat dalam bentuk verbal berikutnya.
- source_word: יִתְבְּנֵא
  choice: dibangun kembali
  rationale: Secara bentuk berarti “dibangun”, tetapi konteks pemulihan sesudah kehancuran mendukung “dibangun kembali” tanpa mengubah arah makna.
- source_word: עַל אַתְרֵהּ
  choice: di tempatnya semula
  rationale: אַתְרָא berarti tempat atau lokasi. “Semula” menjelaskan bahwa pembangunan dilakukan kembali pada lokasi rumah Allah tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “bait” dipakai untuk הֵיכְלָא, sedangkan “rumah Allah” mempertahankan perbedaan leksikal dengan בֵּית אֱלָהָא. Penanda catatan kaki ditempatkan pada frasa yang dijelaskannya.
