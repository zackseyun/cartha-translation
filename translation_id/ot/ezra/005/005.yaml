    rationale: Waw Aram menghubungkan klausa secara koordinatif. Konteks memang mendukung kontras providensial, tetapi teks tidak secara gramatikal menyatakan akibat dengan 'sehingga'.
  - severity: medium
    issue: Klausa terakhir diterjemahkan pasif sebagai surat yang 'diterima'.
    rationale: יְתִיבוּן memiliki subjek jamak tersirat dan, bersama נִשְׁתְּוָנָא, menunjuk pada tindakan mengirim atau mengembalikan surat. Terjemahan pasif menggeser tindakan dari pengirim kepada penerima.
  - severity: low
    issue: '''Mengenai perkara itu'' ditempatkan pada ketetapan yang disampaikan kepada Darius.'
    rationale: עַל דְּנָה ('mengenai hal ini') menerangkan surat pada klausa terakhir, bukan ketetapan pada klausa sebelumnya.
  revised_text: Namun, mata Allah mereka tertuju pada para tua-tua orang Yahudi,[a] dan para pejabat itu tidak menghentikan mereka sampai suatu ketetapan disampaikan kepada Darius; lalu mereka akan mengirim surat mengenai hal ini.[b]
