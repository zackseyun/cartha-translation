  text: וְ/עֵ֣ין אֱלָהֲ/הֹ֗ם הֲוָת֙ עַל שָׂבֵ֣י יְהוּדָיֵ֔/א וְ/לָא בַטִּ֣לוּ הִמּ֔וֹ עַד טַעְמָ֖/א לְ/דָרְיָ֣וֶשׁ יְהָ֑ךְ וֶ/אֱדַ֛יִן יְתִיב֥וּן נִשְׁתְּוָנָ֖/א עַל דְּנָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/005.yaml
  text: But the eye of their God was on the elders of the Jews[a], and they did not make them stop until a decree should go to Darius[c][b]; then they would send back a letter concerning this matter.
translation:
  language: id
  text: Namun, mata Allah mereka tertuju pada para tua-tua orang Yahudi,[a] dan para pejabat itu tidak menghentikan mereka sampai suatu ketetapan disampaikan kepada Darius; lalu mereka akan mengirim surat mengenai hal ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Allah mereka mengawasi para tua-tua orang Yahudi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “sampai suatu keputusan atau perintah disampaikan kepada Darius; lalu mereka akan mengirimkan surat balasan mengenai hal ini.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵין אֱלָהֲהֹם הֲוָת עַל
  choice: Namun, mata Allah mereka tertuju kepada
  rationale: Mempertahankan metafora tunggal 'mata' dan sufiks 'mereka'. 'Namun' menyatakan kontras dengan tindakan para pejabat pada ayat sebelumnya; 'tertuju kepada' merupakan ungkapan Indonesia yang alami tanpa menghilangkan citra konkret.
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: para tua-tua orang Yahudi
  rationale: שָׂבֵי menunjuk kepada tua-tua sebagai pemimpin komunitas, bukan sekadar pemimpin pada umumnya.
- source_word: וְלָא בַטִּלוּ הִמּוֹ
  choice: sehingga para pejabat itu tidak menghentikan mereka
  rationale: Bentuk Pael menyatakan tindakan menyebabkan pekerjaan berhenti. Subjek tersirat diperjelas dari konteks sebelumnya agar bahasa Indonesia tidak membingungkan; hubungan kalimat dipahami sebagai akibat dari pengawasan Allah.
- source_word: עַד טַעְמָא לְדָרְיָוֶשׁ יְהָךְ
  choice: sampai keputusan mengenai perkara itu disampaikan kepada Darius
  rationale: טַעְמָא dapat berarti keputusan atau ketetapan resmi. Konstruksi Aramnya ringkas dan diperdebatkan; dalam konteks surat kepada raja, frasa ini secara alami menunjuk pada penyampaian perkara/keputusan kepada Darius.
- source_word: וֶאֱדַיִן יְתִיבוּן נִשְׁתְּוָנָא עַל דְּנָה
  choice: dan kemudian jawaban tertulis tentang hal itu diterima
  rationale: יְתִיבוּן dapat berkaitan dengan mengembalikan atau menjawab, dan נִשְׁתְּוָנָא ialah komunikasi tertulis resmi. Terjemahan ini menyajikan urutan administratif secara alami sambil menandai alternatif dalam catatan kaki.
theological_decisions:
- issue: Gambaran antropomorfis tentang pengawasan ilahi
  choice: mata Allah mereka tertuju kepada
  alternative: Allah mereka mengawasi/melindungi
  rationale: Metafora konkret dalam teks dipertahankan tanpa mengubahnya menjadi pernyataan doktrinal yang lebih abstrak tentang pemeliharaan Allah.
- issue: Hubungan pengawasan Allah dengan tindakan para pejabat
  choice: sehingga para pejabat itu tidak menghentikan mereka
  alternative: dan mereka tidak menghentikan mereka
  rationale: Konteks mendukung hubungan akibat, tetapi tidak ditambahkan klaim mengenai cara intervensi ilahi berlangsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora sumber dipertahankan, sedangkan rangkaian administratif dibuat jelas bagi pembaca umum tanpa memasukkan istilah denominasi.
