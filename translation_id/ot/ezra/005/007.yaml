  text: פִּתְגָמָ֖/א שְׁלַ֣חוּ עֲל֑וֹ/הִי וְ/כִ/דְנָה֙ כְּתִ֣יב בְּ/גַוֵּ֔/הּ לְ/דָרְיָ֥וֶשׁ מַלְכָּ֖/א שְׁלָמָ֥/א כֹֽלָּ/א׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/007.yaml
  text: 'They sent a report to him[b][a], and this was what was written in it: “To Darius the king: all peace.”'
translation:
  language: id
  text: 'Mereka mengirimkan laporan kepadanya,[a] dan beginilah yang tertulis di dalamnya: “Kepada Raja Darius: semoga sejahtera sepenuhnya.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mereka mengirimkan kepadanya sebuah pesan/dokumen.” Kata bahasa Aram פִּתְגָמָא dapat berarti pesan resmi, laporan, atau dokumen.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “segenap kesejahteraan.” Ini adalah salam resmi dalam surat yang mengungkapkan harapan akan kedamaian dan kesejahteraan sepenuhnya.
    reason: cultural_note
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: laporan
  rationale: Dalam bahasa Aram pemerintahan, kata ini dapat menunjuk pada pesan, laporan, atau dokumen resmi. Dalam konteks komunikasi tertulis kepada raja, “laporan” paling sesuai dengan suasana administratif.
- source_word: שְׁלַחוּ
  choice: mereka mengirimkan
  rationale: Menerjemahkan bentuk Peal perfektif orang ketiga jamak secara langsung dan alami dalam bahasa Indonesia.
- source_word: עֲלֹוהִי
  choice: kepadanya
  rationale: Bersama verba “mengirimkan”, preposisi ini secara kontekstual menunjukkan arah kepada penerima, yakni Darius.
- source_word: וְכִדְנָה
  choice: dan beginilah
  rationale: Ungkapan ini memperkenalkan isi dokumen sebagaimana tertulis; “beginilah” mempertahankan daya penunjuknya dengan bahasa Indonesia yang alami.
- source_word: כְּתִיב
  choice: yang tertulis
  rationale: Bentuk pasif menyatakan bahwa perkataan berikut merupakan isi tertulis dari laporan tersebut.
- source_word: בְּגַוֵּהּ
  choice: di dalamnya
  rationale: Mengacu pada isi di dalam laporan atau dokumen tertulis itu.
- source_word: לְדָרְיָוֶשׁ
  choice: Kepada ... Darius
  rationale: Preposisi menandai pihak yang dituju dalam kepala surat.
- source_word: מַלְכָּא
  choice: Raja
  rationale: 'Gelar ini ditempatkan secara alami sebelum nama dalam bahasa Indonesia: “Raja Darius”.'
- source_word: שְׁלָמָא
  choice: sejahtera
  rationale: Kata ini menyatakan damai atau kesejahteraan dalam salam surat. “Sejahtera” lebih alami untuk sapaan resmi bahasa Indonesia tanpa menghilangkan makna dasarnya.
- source_word: כֹלָּא
  choice: sepenuhnya
  rationale: Kata ini menguatkan gagasan kesejahteraan yang penuh atau lengkap. Bentuk adverbial “sepenuhnya” sesuai dengan konstruksi bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan formal digunakan sesuai konteks surat pemerintahan. Rumusan “semoga sejahtera sepenuhnya” membuat salam eliptis bahasa Aram dapat dipahami secara alami, sementara catatan kaki mempertahankan bentuk harfiahnya.
