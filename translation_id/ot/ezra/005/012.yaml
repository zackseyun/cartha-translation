language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לָהֵ֗ן מִן דִּ֨י הַרְגִּ֤זוּ אֲבָהֳתַ֨/נָא֙ לֶ/אֱלָ֣הּ שְׁמַיָּ֔/א יְהַ֣ב הִמּ֔וֹ בְּ/יַ֛ד נְבוּכַדְנֶצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל כסדי/א וּ/בַיְתָ֤/ה דְנָה֙ סַתְרֵ֔/הּ וְ/עַמָּ֖/ה הַגְלִ֥י לְ/בָבֶֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/012.yaml
  text: Therefore[a], because our fathers provoked the God of heaven to wrath, he gave them into the hand of Nebuchadnezzar king of Babylon, the Chaldean[c][b], and he destroyed this house and carried the people away to Babylon.
translation:
  language: id
  text: Sebab nenek moyang kami membangkitkan murka Allah semesta langit[a], Dia menyerahkan mereka ke dalam tangan Nebukadnezar, raja Babel, orang Kasdim itu. Nebukadnezar meruntuhkan rumah ini[b] dan membawa rakyat itu ke pembuangan di Babel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membuat Allah semesta langit murka.”'
    reason: lexical_alternative
  - marker: b
    text: “Rumah ini” adalah Bait Allah.
    reason: cultural_note
  - marker: c
    text: 'Atau: “mengasingkan rakyat itu ke Babel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֵן
  choice: Namun
  rationale: Dalam konteks ini penanda wacana Aram tersebut mengalihkan perhatian dari kemegahan rumah Allah dahulu kepada alasan kehancurannya; “Namun” mempertahankan daya kontras itu secara alami.
- source_word: מִן דִּי
  choice: karena
  rationale: Gabungan ini berfungsi sebagai penghubung kausal dan memperkenalkan alasan bagi penghukuman yang menyusul.
- source_word: הַרְגִּזוּ
  choice: membangkitkan murka
  rationale: Bentuk kausatif verba רגז menyatakan bahwa nenek moyang menyebabkan Allah murka; pilihan ini mempertahankan unsur sebab dan bahasa penghakiman ilahi.
- source_word: אֲבָהֳתַנָא
  choice: nenek moyang kami
  rationale: Ungkapan ini menunjuk kepada generasi leluhur. “Nenek moyang” lebih wajar dan tidak ambigu dalam bahasa Indonesia modern daripada terjemahan harfiah “bapa-bapa”.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: Allah semesta langit
  rationale: Ini mempertahankan gelar pascapembuangan bagi Allah Israel sekaligus mengikuti ungkapan Indonesia yang alami dan bermartabat.
- source_word: יְהַב הִמּוֹ בְּיַד
  choice: Dia menyerahkan mereka ke dalam tangan
  rationale: Terjemahan ini mempertahankan idiom sumber yang menyatakan penyerahan ke dalam kuasa pihak lain, tanpa memperlemah tindakan langsung Allah.
- source_word: נְבוּכַדְנֶצַּר מֶלֶךְ בָּבֶל כסדיא
  choice: Nebukadnezar, raja Babel, orang Kasdim itu
  rationale: Nama dan gelar diterjemahkan secara langsung; bentuk tunggal gentilisia כסדיא dipertahankan sebagai aposisi yang menerangkan Nebukadnezar.
- source_word: וּבַיְתָה דְנָה
  choice: rumah ini
  rationale: Kata sumber berarti “rumah”, meskipun dalam konteks ini yang dimaksud ialah Bait Allah. Teks utama mempertahankan diksi sumber dan catatan menjelaskan acuannya.
- source_word: סַתְרֵהּ
  choice: meruntuhkan
  rationale: Verba ini secara khusus menggambarkan tindakan merobohkan atau menghancurkan sebuah bangunan; “meruntuhkan” tepat bagi konteks rumah Allah.
- source_word: וְעַמָּה הַגְלִי לְבָבֶל
  choice: mengangkut bangsa itu ke pembuangan di Babel
  rationale: Bentuk kausatif גלה menyatakan pemindahan paksa ke pembuangan. Frasa ini mempertahankan baik gerak pemindahan maupun keadaan pembuangan.
theological_decisions:
- issue: Kausalitas langsung dalam penghakiman ilahi
  choice: Dia menyerahkan mereka ke dalam tangan Nebukadnezar
  alternative: Dia membiarkan mereka jatuh ke dalam tangan Nebukadnezar
  rationale: Teks secara langsung menyatakan bahwa Allah menyerahkan mereka sebagai tanggapan atas dosa nenek moyang; terjemahan tidak mengubah tindakan itu menjadi izin pasif.
- issue: Sebutan bagi Bait Allah
  choice: rumah ini
  alternative: Bait Allah ini
  rationale: Walaupun acuannya jelas Bait Allah, sumber memakai kata “rumah”. Mempertahankannya menjaga diksi dan hubungan teologis rumah milik Allah tanpa memasukkan penjelasan ke dalam teks utama.
- issue: Subjek tindakan setelah penyebutan Nebukadnezar
  choice: Nebukadnezar meruntuhkan
  alternative: dia meruntuhkan
  rationale: Bentuk pronominal Aram merujuk kepada Nebukadnezar, bukan kepada Allah. Nama diulangi dalam bahasa Indonesia untuk mencegah kekaburan subjek tanpa mengubah isi pernyataan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kausal serta bahasa penghakiman dipertahankan. “Nenek moyang” dipilih demi kejelasan pembaca umum, sedangkan idiom “ke dalam tangan” dipertahankan karena masih dapat dipahami dan penting bagi citra penyerahan ke dalam kuasa pihak lain.
