review_pass:
  verdict: revise
  source_fidelity: Penanda לָהֵן bersifat inferensial (“oleh sebab itu/karena itu”), bukan kontrasif (“Namun”). Hubungan sebab dalam מִן דִּי dan tindakan langsung Allah dalam יְהַב tetap perlu dipertahankan. Bentuk “membawa rakyat itu ke pembuangan di Babel” menyampaikan dengan jelas makna kausatif הַגְלִי, yakni deportasi/pengasingan ke Babel.
  naturalness: Selain “Namun”, draf ini umumnya baku dan mudah dipahami. “Oleh sebab itu, karena ...” mempertahankan dua penanda wacana sumber, tetapi terasa berlebihan dalam bahasa Indonesia. “Sebab nenek moyang kami ...” menyampaikan hubungan argumentatif dan kausal secara alami dalam konteks jawaban ini.
  terminology: “Allah semesta langit,” “Nebukadnezar,” “Babel,” “orang Kasdim,” dan “rumah ini” tepat serta sesuai register Alkitab bahasa Indonesia. “Rakyat itu” lebih alami daripada “bangsa itu” untuk עַמָּה dalam konteks orang-orang yang dibuang.
  issues:
  - severity: medium
    issue: “Namun” menerjemahkan לָהֵן secara kontrasif.
    rationale: Sumber dan audit bahasa Inggris menandai לָהֵן sebagai penanda konsekuensi/inferensi (“therefore”), bukan lawan atau kontras. Dalam ayat ini, sebab kehancuran rumah dijelaskan sebagai akibat kemarahan Allah.
  - severity: low
    issue: “mengangkut bangsa itu ke pembuangan di Babel” kurang langsung dan “bangsa” kurang idiomatis bagi kelompok penduduk yang dideportasi.
    rationale: הַגְלִי menyatakan membawa ke dalam pembuangan. “Membawa rakyat itu ke pembuangan di Babel” mempertahankan gerak dan pengasingan dengan bahasa Indonesia yang lebih alami.
