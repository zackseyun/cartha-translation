revisions:
- from: Lalu kutimbang dan kuserahkan kepada mereka perak, emas, dan berbagai perkakas itu, yaitu sumbangan[a] bagi rumah Allah kita yang telah dipersembahkan oleh raja, para penasihat dan para pejabatnya, serta seluruh orang Israel yang berada di sana.
  to: Aku menimbang untuk mereka perak, emas, dan perkakas itu, yakni sumbangan[a] bagi rumah Allah kita, yang telah dipersembahkan oleh raja beserta para penasihat dan pejabatnya, serta seluruh orang Israel yang hadir.
  rationale: Revisi menghapus tindakan ‘menyerahkan’ yang tidak dinyatakan sebagai verba tersendiri dalam sumber, menghapus tambahan ‘berbagai’, dan menerjemahkan partisip ‘yang didapati/hadir’ dengan “yang hadir”. Susunan donor juga memperjelas bahwa para penasihat dan pejabat adalah milik raja. Catatan kaki dipertahankan karena secara akurat menyatakan alternatif leksikal bagi תְּרוּמָה.
  reviewer_model: gpt-5.6-terra
