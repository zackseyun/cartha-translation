  text: ו/אשקול/ה לָ/הֶ֔ם אֶת הַ/כֶּ֥סֶף וְ/אֶת הַ/זָּהָ֖ב וְ/אֶת הַ/כֵּלִ֑ים תְּרוּמַ֣ת בֵּית אֱלֹהֵ֗י/נוּ הַ/הֵרִ֨ימוּ֙ הַ/מֶּ֨לֶךְ֙ וְ/יֹעֲצָ֣י/ו וְ/שָׂרָ֔י/ו וְ/כָל יִשְׂרָאֵ֖ל הַ/נִּמְצָאִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/025.yaml
  text: And I weighed out to them the silver[a], the gold, and the vessels—the contribution for the house of our God that the king, his counselors, his officials, and all Israel who were present had offered.
translation:
  language: id
  text: Aku menimbang untuk mereka perak, emas, dan perkakas itu, yakni sumbangan[a] bagi rumah Allah kita, yang telah dipersembahkan oleh raja beserta para penasihat dan pejabatnya, serta seluruh orang Israel yang hadir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan”. Istilah Ibrani ini dapat menunjuk pada sumbangan yang dikhususkan untuk penggunaan suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁקֳלָה לָהֶם
  choice: kutimbang dan kuserahkan kepada mereka
  rationale: שקל berarti menimbang, sedangkan לָהֶם menunjukkan penerima. Dalam konteks penyerahan resmi barang berharga yang telah diukur beratnya, ungkapan ini menyampaikan tindakan harfiah sekaligus tujuan praktisnya secara wajar dalam bahasa Indonesia.
- source_word: הַכֶּסֶף וְאֶת־הַזָּהָב
  choice: perak, emas
  rationale: כֶּסֶף di sini menunjuk pada logam perak, bukan uang, karena disejajarkan dengan emas dan perkakas sebagai barang berharga untuk rumah Allah.
- source_word: הַכֵּלִים
  choice: berbagai perkakas itu
  rationale: כֵּלִים adalah istilah luas untuk benda, alat, atau perlengkapan. 'Berbagai perkakas' alami dalam konteks rumah Allah dan tidak membatasi maknanya pada satu jenis benda saja.
- source_word: תְּרוּמַת
  choice: sumbangan
  rationale: תְּרוּמָה menunjuk pada sesuatu yang diberikan dan dikhususkan bagi penggunaan suci. 'Sumbangan' mempertahankan gagasan pemberian tanpa menyiratkan jenis kurban ritual tertentu.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: rumah Allah kita
  rationale: Terjemahan ini mempertahankan gambaran harfiah 'rumah' dalam bahasa Ibrani; acuannya adalah bait Allah.
- source_word: הֵרִימוּ
  choice: telah dipersembahkan
  rationale: Bentuk Hifil dari רום secara harfiah berkaitan dengan mengangkat, tetapi dalam konteks ini merupakan idiom untuk menyerahkan pemberian yang dikhususkan. Bentuk 'telah' menunjukkan bahwa pemberian itu mendahului tindakan Ezra menimbangnya.
- source_word: יֹעֲצָיו וְשָׂרָיו
  choice: para penasihat dan para pejabatnya
  rationale: יֹעֲצִים adalah para pemberi nasihat, sedangkan שָׂרִים dalam lingkungan pemerintahan Persia paling tepat dipahami sebagai pejabat, tanpa mengharuskan arti keturunan raja.
- source_word: וְכָל־יִשְׂרָאֵל הַנִּמְצָאִים
  choice: serta seluruh orang Israel yang berada di sana
  rationale: Ungkapan ini merujuk secara kolektif kepada orang Israel yang hadir atau didapati di tempat itu. 'Yang berada di sana' jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Istilah kultis תְּרוּמָה dalam konteks pemberian untuk rumah Allah
  choice: sumbangan
  alternative: persembahan
  rationale: '''Sumbangan'' menonjolkan bahwa barang-barang itu diberikan dan dikhususkan bagi rumah Allah tanpa memasukkan gagasan tentang tata cara kurban tertentu. Alternatif ''persembahan'' tetap dicatat karena dapat menyampaikan nuansa suci istilah tersebut.'
- issue: Penerjemahan בֵּית אֱלֹהֵינוּ
  choice: rumah Allah kita
  alternative: bait Allah kita
  rationale: '''Rumah Allah kita'' mempertahankan metafora sumber dan tetap mudah dipahami. ''Bait Allah'' akan memperjelas acuannya, tetapi lebih interpretatif dan bernuansa tradisional.'
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Bentuk persona pertama terikat 'kutimbang' mempertahankan narasi Ezra. Frasa 'dan kuserahkan' membuat fungsi penimbangan kepada para penerima tersampaikan secara alami, sedangkan 'rumah Allah kita' menjaga citra teks Ibrani.
