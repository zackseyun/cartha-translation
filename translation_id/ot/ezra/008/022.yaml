  to: Sebab aku malu meminta pasukan dan para penunggang kuda kepada raja untuk menolong kami menghadapi musuh di perjalanan[a], karena kami telah berkata kepada raja, “Tangan Allah kita ada atas semua orang yang mencari Dia untuk mendatangkan kebaikan[b], tetapi kekuatan dan murka-Nya menimpa semua orang yang meninggalkan-Nya.”
