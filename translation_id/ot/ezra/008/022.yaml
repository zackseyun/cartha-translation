  text: כִּ֣י בֹ֗שְׁתִּי לִ/שְׁא֤וֹל מִן הַ/מֶּ֨לֶךְ֙ חַ֣יִל וּ/פָרָשִׁ֔ים לְ/עָזְרֵ֥/נוּ מֵ/אוֹיֵ֖ב בַּ/דָּ֑רֶךְ כִּֽי אָמַ֨רְנוּ לַ/מֶּ֜לֶךְ לֵ/אמֹ֗ר יַד אֱלֹהֵ֤י/נוּ עַל כָּל מְבַקְשָׁי/ו֙ לְ/טוֹבָ֔ה וְ/עֻזּ֣/וֹ וְ/אַפּ֔/וֹ עַ֖ל כָּל עֹזְבָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/022.yaml
  text: For I was ashamed to ask the king for troops and horsemen to help us against the enemy on the way[a], because we had said to the king, “The hand of our God is for good on all who seek him[b], but his strength and his anger are against all who forsake him.”
translation:
  language: id
  text: Sebab aku malu meminta pasukan dan para penunggang kuda kepada raja untuk menolong kami menghadapi musuh di perjalanan[a], karena kami telah berkata kepada raja, “Tangan Allah kita ada atas semua orang yang mencari Dia untuk mendatangkan kebaikan[b], tetapi kekuatan dan murka-Nya menimpa semua orang yang meninggalkan-Nya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “untuk menolong kami dari musuh di perjalanan.” Dalam konteks permintaan perlindungan militer, “menghadapi musuh” menyampaikan maksud ungkapan itu secara lebih alami.'
    reason: lexical_alternative
  - marker: b
    text: “Tangan Allah” adalah ungkapan Ibrani yang menggambarkan tindakan aktif, kuasa, atau perkenanan-Nya.
    reason: cultural_note
lexical_decisions:
- source_word: בֹשְׁתִּי
  choice: aku malu
  rationale: Kata kerja ini menyatakan rasa malu yang berbobot, bukan sekadar rasa kikuk; bentuk ini alami dalam narasi orang pertama.
- source_word: חַיִל וּפָרָשִׁים
  choice: pasukan dan para penunggang kuda
  rationale: חַיִל di sini menunjuk pada kekuatan bersenjata, sedangkan פָרָשִׁים pada pasukan berkuda; terjemahan ini mempertahankan kedua unsur secara konkret.
- source_word: לְעָזְרֵנוּ מֵאוֹיֵב בַּדָּרֶךְ
  choice: untuk menolong kami menghadapi musuh di perjalanan
  rationale: Ungkapan tujuan dan perlindungan militer disampaikan secara alami; מִן secara harfiah dapat berarti ‘dari’, tetapi dalam konteks ini bantuan diminta untuk menghadapi ancaman musuh.
- source_word: יַד אֱלֹהֵינוּ
  choice: Tangan Allah kami
  rationale: Metafora Ibrani tentang tindakan, kuasa, dan perkenanan Allah dipertahankan daripada dipersempit menjadi satu konsep abstrak.
- source_word: עַל כָּל מְבַקְשָׁיו לְטוֹבָה
  choice: mendatangkan kebaikan bagi semua orang yang mencari Dia
  rationale: Terjemahan ini mengungkapkan arah tindakan ilahi yang menguntungkan sambil tetap menghubungkannya dengan metafora ‘tangan’.
- source_word: וְעֻזּוֹ וְאַפּוֹ
  choice: kekuatan dan murka-Nya
  rationale: Kedua nomina yang sejajar dipertahankan secara terpisah; ‘murka’ sesuai dengan konteks penghakiman ilahi dan tetap mudah dipahami.
- source_word: עַל כָּל עֹזְבָיו
  choice: menimpa semua orang yang meninggalkan Dia
  rationale: עַל dapat menyatakan sesuatu yang datang atas mereka; ‘meninggalkan’ mempertahankan tindakan berpaling dari Allah tanpa memasukkan istilah teologis tambahan.
theological_decisions:
- issue: Metafora antropomorfis יַד אֱלֹהֵינוּ
  choice: Mempertahankan ‘Tangan Allah kami’ dan menjelaskan fungsinya lewat predikat ‘mendatangkan kebaikan’.
  alternative: ‘Kuasa Allah kami’ atau ‘perkenanan Allah kami’.
  rationale: Teks sumber sengaja memakai citra anggota tubuh untuk tindakan aktif Allah. Mempertahankannya menjaga tekstur teologis tanpa membatasi maknanya hanya pada kuasa atau perkenanan.
- issue: Hubungan עֻזּוֹ dan אַפּוֹ dalam hukuman ilahi
  choice: Menerjemahkan keduanya secara koordinatif sebagai ‘kekuatan dan murka-Nya’.
  alternative: Menggabungkannya menjadi ‘murka-Nya yang dahsyat’.
  rationale: Bahasa Ibrani menyebut dua nomina tersendiri, sehingga kekuatan aktif dan murka Allah tidak seharusnya dilebur menjadi satu gagasan.
- issue: Nuansa עֹזְבָיו
  choice: ‘semua orang yang meninggalkan Dia’.
  alternative: ‘semua orang yang membelakangi Dia’ atau ‘semua orang yang meninggalkan-Nya’.
  rationale: Pilihan ini menjaga keluasan makna tindakan meninggalkan atau berpaling dari Allah tanpa secara diam-diam menambahkan kerangka denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kata ganti orang pertama tunggal ‘aku’ sesuai dengan tuturan Ezra, sedangkan ‘Dia’ dan bentuk ‘-Nya’ dipakai secara konsisten untuk Allah. Struktur kontras ‘tetapi’ dipertahankan agar ketegangan antara kebaikan bagi pencari Allah dan murka terhadap mereka yang meninggalkan-Nya tetap jelas.
