  yaml_path: translation/ot/ezra/008/026.yaml
  text: And I weighed out into their hands six hundred and fifty talents of silver[a], and one hundred talents worth of silver vessels, and one hundred talents of gold.
translation:
  language: id
  text: Lalu aku menimbang dan menyerahkan kepada mereka 650 talenta perak, barang-barang perak senilai 100 talenta,[a] dan 100 talenta emas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani di sini ringkas; secara harfiah, “barang-barang perak, seratus untuk talenta.” Maksudnya tampaknya barang-barang perak itu secara keseluruhan bernilai 100 talenta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁקֲלָה עַל יָדָם
  choice: aku menimbang dan menyerahkan kepada mereka
  rationale: Kata kerja שׁקל menyatakan tindakan menimbang barang berharga, sedangkan ungkapan עַל יָדָם menunjukkan penyerahan ke dalam tanggung jawab mereka. Terjemahan ini menyampaikan kedua unsur tersebut secara alami dalam bahasa Indonesia.
- source_word: כֶּסֶף כִּכָּרִים שֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 650 talenta perak
  rationale: כֶּסֶף di sini adalah logam perak yang ditimbang, bukan uang logam. כִּכָּר adalah satuan berat besar yang secara tradisional disebut “talenta”.
- source_word: וּכְלֵי כֶסֶף
  choice: perkakas-perkakas perak
  rationale: כְּלִי adalah istilah luas untuk wadah, barang, atau perkakas. “Perkakas-perkakas” cukup umum untuk inventaris benda-benda perak tanpa mempersempit bentuk atau fungsinya.
- source_word: מֵאָה לְכִכָּרִים
  choice: seberat 100 talenta
  rationale: Frasa Ibrani ini ringkas dan eliptis. Dalam konteks penimbangan, לְכִכָּרִים paling wajar menunjukkan jumlah berat keseluruhan perkakas perak, yakni 100 talenta.
- source_word: זָהָב מֵאָה כִכָּר
  choice: 100 talenta emas
  rationale: Ini adalah konstruksi langsung yang menyebut logam emas beserta jumlah beratnya.
