base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/013.yaml
  text: 'And from the sons of Adonikam[a], the last ones, and these were their names: Eliphelet, Jeiel, and Shemaiah, and with them sixty males.'
translation:
  language: id
  text: 'Dan dari keturunan Adonikam, yang terakhir[a]; dan inilah nama mereka: Elifelet, Yeiel, dan Semaya; bersama mereka enam puluh laki-laki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang belakangan” atau “yang terakhir.” Ungkapan Ibrani ini mungkin menunjuk pada kelompok terakhir dari garis keturunan Adonikam, mungkin untuk membedakannya dari kelompok terdahulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Dan dari keturunan
  rationale: בְּנֵי secara harfiah berarti ‘anak-anak lelaki’, tetapi dalam daftar silsilah menunjuk kepada keturunan atau anggota garis keluarga. ‘Keturunan’ menyampaikan fungsi itu secara alami dalam bahasa Indonesia, sedangkan ‘Dan dari’ mempertahankan kesinambungan daftar Ibrani.
- source_word: אֲדֹנִיקָם
  choice: Adonikam
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אַחֲרֹנִים
  choice: orang-orang yang terakhir
  rationale: Kata ini dapat berarti ‘yang terakhir’, ‘yang kemudian’, atau ‘yang belakangan’. Terjemahan utama mempertahankan kemungkinan bahwa mereka adalah rombongan terakhir dari garis Adonikam tanpa menentukan lebih jauh maksudnya.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: nama mereka ialah
  rationale: Ungkapan Ibrani ini merupakan rumus untuk memperkenalkan daftar nama. Bentuk Indonesia dibuat alami tanpa mengubah fungsinya.
- source_word: אֱלִיפֶלֶט
  choice: Elifelet
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia.
- source_word: יְעִיאֵל
  choice: Yeiel
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia.
- source_word: וּשְׁמַעְיָה
  choice: dan Semaya
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia dan kata penghubungnya dipertahankan dalam daftar.
- source_word: וְעִמָּהֶם
  choice: bersama mereka
  rationale: עִם dengan akhiran pronominal menyatakan penyertaan. Ungkapan ini alami dan tepat dalam bahasa Indonesia.
- source_word: שִׁשִּׁים
  choice: enam puluh
  rationale: Padanan langsung untuk bilangan kardinal Ibrani.
- source_word: הַזְּכָרִים
  choice: laki-laki
  rationale: Kata זְכָרִים secara khusus menandai jenis kelamin laki-laki, bukan usia atau kedudukan sosial; karena itu ‘laki-laki’ lebih tepat daripada ‘orang’.
