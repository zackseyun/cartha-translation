base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/001.yaml
  text: 'These are the heads of their fathers’ houses[a], and their genealogy, of those who went up with me from Babylon in the reign of King Artaxerxes:'
translation:
  language: id
  text: 'Inilah para kepala kaum keluarga mereka beserta daftar silsilah mereka[a], yakni daftar orang-orang yang berangkat bersama aku dari Babel pada masa pemerintahan Raja Artahsasta:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pendaftaran mereka menurut silsilah.” Istilah Ibrani ini menunjuk kepada pencatatan atau pendaftaran berdasarkan silsilah, bukan hanya garis keturunan dalam pengertian umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Memperkenalkan daftar baru secara alami dalam bahasa Indonesia, dengan tetap mempertahankan fungsi penunjuk dan penghubung ungkapan Ibrani.
- source_word: רָאשֵׁי אֲבֹתֵיהֶם
  choice: para kepala kaum keluarga mereka
  rationale: Dalam konteks administratif dan silsilah, ungkapan ini menunjuk kepada para pemimpin unit keluarga leluhur, bukan sekadar para ayah secara harfiah.
- source_word: וְהִתְיַחְשָׂם
  choice: beserta daftar silsilah mereka
  rationale: Bentuk Ibrani ini mengacu pada pencatatan atau pendaftaran berdasarkan silsilah. 'Daftar silsilah' menyampaikan adanya catatan konkret dengan bahasa Indonesia yang wajar.
- source_word: הָעֹלִים עִמִּי
  choice: orang-orang yang berangkat bersama aku
  rationale: Partisipel Ibrani menunjuk kepada rombongan yang pergi bersama Ezra. 'Berangkat' terdengar alami dalam narasi perjalanan bahasa Indonesia; idiom Ibrani 'naik' tidak dipaksakan karena tujuan tidak disebutkan dalam ayat ini.
- source_word: בְּמַלְכוּת
  choice: pada masa pemerintahan
  rationale: Menyatakan kurun waktu ketika raja tersebut memerintah, bukan wilayah kerajaannya.
- source_word: אַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: Raja Artahsasta
  rationale: Memakai bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan susunan gelar-nama yang alami.
- source_word: מִבָּבֶל
  choice: dari Babel
  rationale: Menyatakan tempat asal perjalanan secara langsung.
