id: EZR.8.36
reference: Ezra 8:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יִּתְּנ֣וּ אֶת דָּתֵ֣י הַ/מֶּ֗לֶךְ לַ/אֲחַשְׁדַּרְפְּנֵי֙ הַ/מֶּ֔לֶךְ וּ/פַחֲו֖וֹת עֵ֣בֶר הַ/נָּהָ֑ר וְ/נִשְּׂא֥וּ אֶת הָ/עָ֖ם וְ/אֶת בֵּֽית הָ/אֱלֹהִֽים׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/036.yaml
  text: And they delivered the king’s decrees to the king’s satraps and the governors Beyond the River[c][b][a], and they supported the people and the house of God.
translation:
  language: id
  text: Mereka menyerahkan ketetapan-ketetapan raja kepada para satrap raja dan para gubernur di wilayah Seberang Sungai[a]. Para pejabat itu mendukung[b] rakyat dan rumah Allah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seberang Sungai” adalah istilah administratif Persia untuk wilayah di sebelah barat Sungai Efrat.
    reason: cultural_note
  - marker: b
    text: Atau “membantu”. Kata Ibrani yang digunakan secara harfiah berarti “mengangkat” atau “menanggung”, dan di sini bermakna memberikan dukungan.
    reason: lexical_alternative
  - marker: c
    text: Atau “bait Allah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: menyerahkan
  rationale: Dalam konteks penyampaian dokumen resmi kepada pejabat kekaisaran, 'menyerahkan' menyatakan tindakan memberikan secara formal.
- source_word: דָּתֵי הַמֶּלֶךְ
  choice: ketetapan-ketetapan raja
  rationale: דָּת dalam konteks Persia menunjuk pada perintah atau ketetapan resmi, bukan keseluruhan kitab hukum.
- source_word: אֲחַשְׁדַּרְפְּנֵי הַמֶּלֶךְ
  choice: para satrap raja
  rationale: '''Satrap'' adalah istilah historis yang tepat bagi penguasa wilayah besar dalam tata pemerintahan Persia; frasa ''raja'' dipertahankan sesuai teks Ibrani.'
- source_word: פַחֲווֹת
  choice: para gubernur
  rationale: Istilah ini menunjuk kepada para penguasa atau administrator daerah; 'gubernur' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: עֵבֶר הַנָּהָר
  choice: wilayah Seberang Sungai
  rationale: Frasa ini merupakan sebutan administratif Persia bagi daerah di sebelah barat Sungai Efrat. Penambahan 'wilayah' memperjelas fungsi nama tersebut tanpa mengubah rujukannya.
- source_word: וְנִשְּׂאוּ
  choice: mendukung
  rationale: נשׂא secara harfiah berarti 'mengangkat' atau 'menanggung', tetapi di sini secara idiomatis menyatakan pemberian bantuan atau dukungan.
- source_word: הָעָם
  choice: rakyat
  rationale: Teks hanya menyebut 'rakyat'; identitas yang lebih khusus tidak ditambahkan.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani secara langsung, meskipun dalam konteks ini yang dimaksud ialah bait Allah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat kedua memakai 'Para pejabat itu' untuk menjernihkan bahwa subjek kata kerja jamak וְנִשְּׂאוּ paling wajar merujuk kepada para satrap dan gubernur, sambil tetap mempertahankan hubungan antarklausa. Istilah historis 'satrap' dipertahankan dan nama administratif 'Seberang Sungai' ditulis dengan huruf kapital.
