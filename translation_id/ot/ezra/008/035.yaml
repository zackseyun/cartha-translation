  source_fidelity: 'Terjemahan dengan setia mencerminkan struktur dan isi Ibrani: kelompok yang datang dari penawanan dijelaskan secara aposisional sebagai kaum buangan; persembahan bakaran ditujukan kepada Allah Israel; semua jenis hewan dan jumlahnya tepat; fungsi kedua belas kambing jantan sebagai korban penghapus dosa dipertahankan; dan pernyataan penutup yang secara lahiriah menegaskan bahwa semuanya adalah korban bakaran tidak diharmonisasikan. Nama יהוה diterjemahkan konsisten sebagai “Yahweh.”'
