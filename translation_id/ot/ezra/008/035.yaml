  variant: modern standard Indonesian
source:
  edition: WLC
  text: הַ֠/בָּאִים מֵֽ/הַ/שְּׁבִ֨י בְנֵֽי הַ/גּוֹלָ֜ה הִקְרִ֥יבוּ עֹל֣וֹת לֵ/אלֹהֵ֣י יִשְׂרָאֵ֗ל פָּרִ֨ים שְׁנֵים עָשָׂ֤ר עַל כָּל יִשְׂרָאֵל֙ אֵילִ֣ים תִּשְׁעִ֣ים וְ/שִׁשָּׁ֗ה כְּבָשִׂים֙ שִׁבְעִ֣ים וְ/שִׁבְעָ֔ה צְפִירֵ֥י חַטָּ֖את שְׁנֵ֣ים עָשָׂ֑ר הַ/כֹּ֖ל עוֹלָ֥ה לַ/יהוָֽה־׀־־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/035.yaml
  text: 'Those who had come from the captivity[a], the sons of the exile, offered burnt offerings to the God of Israel: twelve bulls for all Israel, ninety-six rams, seventy-seven lambs, and twelve male goats as a sin offering[c][b]. All of it was a burnt offering to Yahweh.'
translation:
  language: id
  text: 'Mereka yang telah datang dari penawanan—kaum buangan[a]—mempersembahkan korban-korban bakaran kepada Allah Israel: dua belas ekor sapi jantan bagi seluruh Israel[b], sembilan puluh enam ekor domba jantan, tujuh puluh tujuh ekor anak domba, dan dua belas ekor kambing jantan sebagai korban penghapus dosa. Semua itu adalah korban bakaran bagi Yahweh.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak pembuangan”, sebuah ungkapan Ibrani yang menunjuk kepada kaum buangan yang kembali.
    reason: cultural_note
  - marker: b
    text: Atau “atas nama seluruh Israel”.
    reason: lexical_alternative
  - marker: c
    text: Teks Ibrani berbunyi, “Semua itu adalah korban bakaran bagi Yahweh.” Pernyataan ini dipertahankan sebagaimana adanya meskipun sebelumnya disebutkan kambing-kambing jantan sebagai korban penghapus dosa.
    reason: textual_tension
lexical_decisions:
- source_word: הַבָּאִים מֵהַשְּׁבִי
  choice: mereka yang telah datang dari penawanan
  rationale: Partisipel berartikel menunjuk kepada kelompok tertentu yang sudah tiba dalam konteks narasi. 'Penawanan' mempertahankan nuansa keadaan sebagai tawanan dan membedakannya dari גּוֹלָה.
- source_word: בְנֵי הַגּוֹלָה
  choice: kaum buangan
  rationale: Ungkapan Ibrani harfiah 'anak-anak pembuangan' merupakan idiom identitas kelompok. 'Kaum buangan' menyampaikan maksudnya secara alami dalam bahasa Indonesia, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: הִקְרִיבוּ עֹלוֹת
  choice: mempersembahkan korban-korban bakaran
  rationale: Dalam konteks kurban, הקריב berarti mempersembahkan, sedangkan עֹלוֹת adalah bentuk jamak dari istilah teknis untuk korban bakaran.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: kepada Allah Israel
  rationale: Preposisi ל menandai penerima persembahan; 'kepada' merupakan padanan Indonesia yang alami.
- source_word: פָּרִים שְׁנֵים עָשָׂר עַל כָּל יִשְׂרָאֵל
  choice: dua belas ekor sapi jantan bagi seluruh Israel
  rationale: עַל dalam konteks ini dapat menyatakan perwakilan atau kepentingan. 'Bagi' mempertahankan keluasan makna itu, dengan alternatif yang lebih eksplisit diberikan dalam catatan kaki.
- source_word: אֵילִים תִּשְׁעִים וְשִׁשָּׁה
  choice: sembilan puluh enam ekor domba jantan
  rationale: Padanan langsung dan lazim bagi frasa bilangan serta nama hewannya.
- source_word: כְּבָשִׂים שִׁבְעִים וְשִׁבְעָה
  choice: tujuh puluh tujuh ekor anak domba
  rationale: כְּבָשִׂים lazim menunjuk kepada anak domba dalam daftar kurban.
- source_word: צְפִירֵי חַטָּאת
  choice: kambing jantan sebagai korban penghapus dosa
  rationale: צְפִירֵי menyatakan kambing jantan, dan חַטָּאת di sini adalah kategori kurban. Rumusan ini menjelaskan fungsi kurbannya tanpa menambah tafsiran.
- source_word: הַכֹּל עוֹלָה לַיהוָה
  choice: Semua itu adalah korban bakaran bagi Yahweh
  rationale: Terjemahan mempertahankan pernyataan rangkuman teks Ibrani dan nama ilahi יהוה, tanpa menyelaraskan ketegangannya dengan penyebutan korban penghapus dosa sebelumnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu dan selaras dengan keputusan teologis yang diberikan.
- issue: Ketegangan antara kambing sebagai korban penghapus dosa dan rangkuman bahwa semuanya adalah korban bakaran
  choice: Mempertahankan pernyataan rangkuman Ibrani tanpa menghaluskannya
  alternative: Membatasi 'semua itu' hanya pada hewan-hewan korban bakaran atau memparafrasakan kalimat agar ketegangan hilang
  rationale: Teks sumber menyebut kedua hal tersebut. Terjemahan tidak diam-diam menyelesaikan ketegangan tekstual dan teologis itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Kata bantu bilangan 'ekor' dipakai secara konsisten untuk kejelasan, sedangkan istilah kurban mengikuti ungkapan Indonesia yang umum dipahami.
