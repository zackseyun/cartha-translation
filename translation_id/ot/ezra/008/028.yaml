base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/028.yaml
  text: And I said to them, “You are holy to Yahweh, and the vessels are holy; and the silver and the gold are a freewill offering to Yahweh, the God of your fathers.”
translation:
  language: id
  text: Lalu aku berkata kepada mereka, “Kalian kudus bagi Yahweh, dan perlengkapan itu pun kudus. Perak dan emas itu adalah persembahan sukarela kepada Yahweh, Allah nenek moyang kalian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Lalu aku berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi dan memperkenalkan perkataan langsung Ezra; “lalu” menyatakannya secara alami dalam bahasa Indonesia.
- source_word: אַתֶּם קֹדֶשׁ לַיהוָה
  choice: Kalian kudus bagi Yahweh
  rationale: “Kalian” memperjelas orang kedua jamak, sedangkan “kudus bagi” mempertahankan bahasa pengudusan dan makna bahwa mereka dikhususkan bagi Yahweh.
- source_word: הַכֵּלִים
  choice: perlengkapan itu
  rationale: Dalam konteks Bait Allah, כֵּלִים menunjuk pada benda atau perlengkapan suci yang dipakai dalam pelayanan. Bentuk kolektif ini alami dalam bahasa Indonesia dan cakupannya tidak dipersempit menjadi bejana saja.
- source_word: וְהַכֵּלִים קֹדֶשׁ
  choice: dan perlengkapan itu pun kudus
  rationale: Partikel “pun” menampilkan kesejajaran antara status para pembawa dan perlengkapan yang mereka bawa tanpa menambah gagasan baru.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: Perak dan emas itu
  rationale: Penunjuk “itu” secara alami mewakili kejelasan kedua nomina Ibrani dan merujuk pada perak serta emas yang telah disebut dalam konteks.
- source_word: נְדָבָה
  choice: persembahan sukarela
  rationale: Istilah ini menunjuk pada pemberian yang dipersembahkan dengan sukarela, bukan karena paksaan atau kewajiban.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Allah leluhur kalian
  rationale: אֲבוֹת dalam rumusan perjanjian ini menunjuk kepada generasi pendahulu Israel. “Leluhur” merupakan padanan Indonesia modern yang alami dan tidak mengubah rujukan historisnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi, bukan gelar. Transliterasi “Yahweh” mempertahankan fungsi nama tersebut.
- issue: Makna kultis קֹדֶשׁ לַיהוָה
  choice: kudus bagi Yahweh
  alternative: dikhususkan bagi Yahweh
  rationale: “Kudus bagi” mempertahankan istilah teologis sumber sekaligus mencakup makna pengkhususan dan kepunyaan; alternatif lebih eksplisit tetapi mengurangi kesejajaran leksikal dengan kekudusan perlengkapan.
- issue: Rumusan perjanjian אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Allah leluhur kalian
  alternative: Allah nenek moyang kalian
  rationale: Kedua pilihan menyampaikan hubungan dengan generasi pendahulu dalam sejarah perjanjian. “Leluhur” dipilih karena ringkas, bermartabat, dan wajar dalam bahasa Indonesia modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menandai sapaan jamak secara jelas; “perlengkapan” dipakai sebagai nomina kolektif untuk benda-benda suci Bait Allah. Kesejajaran kata “kudus” pada orang dan perlengkapan dipertahankan.
