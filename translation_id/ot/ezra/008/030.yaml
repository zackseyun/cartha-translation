base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/030.yaml
  text: So the priests and the Levites received the weighed amount of the silver[a], the gold, and the vessels, to bring them to Jerusalem[b], to the house of our God.
translation:
  language: id
  text: Jadi, para imam dan orang Lewi menerima sejumlah perak, emas, dan perlengkapan, yang semuanya telah ditimbang,[a] untuk dibawa ke Yerusalem, ke rumah Allah kita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “berat perak, emas, dan perlengkapan itu.” Istilah Ibraninya dapat menunjuk pada berat yang diukur atau jumlah yang telah ditimbang.
    reason: lexical_alternative
  - marker: b
    text: Atau, “bait Allah kita.” Secara harfiah, “rumah Allah kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבְּלוּ
  choice: menerima
  rationale: Verba Qal ini menyatakan bahwa para imam dan orang Lewi menerima barang-barang tersebut untuk berada dalam tanggung jawab mereka.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: para imam dan orang Lewi
  rationale: Padanan baku dan alami dalam bahasa Indonesia; bentuk jamak dinyatakan dengan 'para' untuk imam, sedangkan nama kelompok 'orang Lewi' sudah jelas bersifat kolektif.
- source_word: מִשְׁקַל
  choice: sejumlah ... yang telah ditimbang
  rationale: Istilah ini dapat menunjuk pada berat atau jumlah menurut timbangan. Susunan ini menyampaikan kuantitas hasil penimbangan secara alami tanpa menghilangkan nuansa administratifnya.
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: perak, emas, dan perlengkapan
  rationale: כסף dan זהב diterjemahkan secara langsung. כלים merupakan istilah luas bagi benda atau peralatan; 'perlengkapan' sesuai dengan konteks barang-barang bagi rumah Allah tanpa mempersempitnya menjadi hanya bejana.
- source_word: לְהָבִיא
  choice: untuk dibawa
  rationale: Infinitif dengan ל menyatakan tujuan. Bentuk pasif alami dalam bahasa Indonesia karena barang-barang yang diterima menjadi hal yang dibawa.
- source_word: לִירוּשָׁלַם
  choice: ke Yerusalem
  rationale: Padanan langsung nama tempat dengan preposisi arah.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: ke rumah Allah kita
  rationale: Mempertahankan ungkapan harfiah Ibrani dan hubungan posesifnya; 'Bait Allah kita' atau 'rumah ibadah Allah kita' akan lebih interpretatif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Orang Lewi' mengikuti istilah Alkitab Indonesia yang lazim. 'Perlengkapan' dipilih daripada 'bejana' agar keluasan makna כֵּלִים tetap terjaga. Penanda catatan kaki [a] dan [b] dicantumkan dalam teks utama.
