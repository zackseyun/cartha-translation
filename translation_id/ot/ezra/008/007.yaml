  text: וּ/מִ/בְּנֵ֣י עֵילָ֔ם יְשַֽׁעְיָ֖ה בֶּן עֲתַלְיָ֑ה וְ/עִמּ֖/וֹ שִׁבְעִ֥ים הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/007.yaml
  text: 'And from the sons of Elam: Jeshaiah son of Athaliah[a], and with him seventy males.'
translation:
  language: id
  text: 'Dari keturunan Elam: Yesaya anak Atalya, dan bersama dia tujuh puluh laki-laki.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי עֵילָם
  choice: Dari keturunan Elam
  rationale: Dalam daftar silsilah ini, בְּנֵי menunjuk kepada anggota garis keluarga atau keturunan Elam, bukan hanya anak-anak langsung. “Keturunan” alami dan tepat dalam bahasa Indonesia; waw pembuka tidak perlu diterjemahkan tersendiri karena ayat ini merupakan butir lanjutan dalam daftar.
- source_word: יְשַׁעְיָה
  choice: Yesaya
  rationale: Bentuk nama Ibrani ini sama dengan bentuk yang lazim dialihaksarakan sebagai Yesaya dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן עֲתַלְיָה
  choice: anak Atalya
  rationale: Konstruksi patronimik langsung; “anak” mempertahankan hubungan yang dinyatakan teks tanpa menambahkan kata depan yang tidak diperlukan dalam bahasa Indonesia.
- source_word: וְ/עִמּוֹ
  choice: dan bersama dia
  rationale: 'Menerjemahkan konjungsi dan penanda penyertaan serta mempertahankan pola daftar: pemimpin yang disebut namanya, lalu jumlah orang yang menyertainya.'
- source_word: שִׁבְעִים
  choice: tujuh puluh
  rationale: Padanan langsung bagi bilangan pokok Ibrani.
- source_word: הַזְּכָרִים
  choice: laki-laki
  rationale: Kata Ibrani secara khusus menunjuk orang berjenis kelamin laki-laki. “Laki-laki” lebih alami daripada “jantan” atau “kaum lelaki” untuk manusia dalam bahasa Indonesia, sambil tetap mempertahankan kekhususan gendernya.
theological_decisions: []
translation_notes:
  register: 'Bahasa daftar yang ringkas, jelas, dan bermartabat dipertahankan. Nama-nama menggunakan bentuk Indonesia yang lazim: Yesaya dan Atalya. Tidak diperlukan catatan kaki karena “laki-laki” secara langsung dan alami menyampaikan arti spesifik הַזְּכָרִים.'
