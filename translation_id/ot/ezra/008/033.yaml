  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ayat dibuat alami dengan dua kalimat tanpa menghilangkan hubungan antarpelaku. Penanda catatan kaki ditempatkan tepat pada istilah atau ungkapan yang diterangkannya; urutannya diperbaiki berdasarkan isi catatan dan teks sumber.
