revisions:
- from: Pada hari keempat, perak, emas, dan berbagai perkakas[a] itu ditimbang di rumah Allah kami, lalu diserahkan kepada Meremot bin Uria, sang imam.[b] Bersama dia ada Eleazar bin Pinehas, dan bersama mereka ada Yozabad bin Yesua serta Noadya bin Binui, orang-orang Lewi.
  to: Pada hari keempat, perak, emas, dan perkakas[a] itu ditimbang di rumah Allah kami dan diserahkan kepada Meremot bin Uria, imam[b]. Bersama dia ada Eleazar bin Pinehas, dan bersama mereka ada Yozabad bin Yesua serta Noadya bin Binui, orang-orang Lewi.
  rationale: Revisi menghilangkan penanda urutan yang tidak dinyatakan secara eksplisit, menghindari tambahan nuansa pada "perkakas", dan membetulkan penjelasan harfiah idiom Ibrani. Makna administratif bahwa harta ditimbang dan dipercayakan kepada Meremot tetap dinyatakan secara jelas dan alami.
