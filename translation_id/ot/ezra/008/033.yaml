  text: וּ/בַ/יּ֣וֹם הָ/רְבִיעִ֡י נִשְׁקַ֣ל הַ/כֶּסֶף֩ וְ/הַ/זָּהָ֨ב וְ/הַ/כֵּלִ֜ים בְּ/בֵ֣ית אֱלֹהֵ֗י/נוּ עַ֠ל יַד מְרֵמ֤וֹת בֶּן אֽוּרִיָּה֙ הַ/כֹּהֵ֔ן וְ/עִמּ֖/וֹ אֶלְעָזָ֣ר בֶּן פִּֽינְחָ֑ס וְ/עִמָּ/הֶ֞ם יוֹזָבָ֧ד בֶּן יֵשׁ֛וּעַ וְ/נֽוֹעַדְיָ֥ה בֶן בִּנּ֖וּי הַ/לְוִיִּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/033.yaml
  text: And on the fourth day[a], the silver and the gold and the vessels were weighed out in the house of our God into the hand of Meremoth son of Uriah the priest, and with him was Eleazar son of Phinehas, and with them were Jozabad son of Jeshua and Noadiah son of Binnui[b], the Levites.
translation:
  language: id
  text: Pada hari keempat, perak, emas, dan perkakas[a] itu ditimbang di rumah Allah kami dan diserahkan kepada Meremot bin Uria, imam[b]. Bersama dia ada Eleazar bin Pinehas, dan bersama mereka ada Yozabad bin Yesua serta Noadya bin Binui, orang-orang Lewi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yakni, perkakas atau barang perlengkapan yang digunakan dalam pelayanan di rumah Allah.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “ke tangan Meremot bin Uria, imam”; ungkapan Ibrani ini berarti bahwa barang-barang tersebut diserahkan ke dalam tanggung jawabnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הָרְבִיעִי
  choice: Pada hari keempat
  rationale: Menyampaikan kelanjutan waktu dalam narasi secara alami. Kata penghubung Ibrani tidak perlu diterjemahkan tersendiri pada awal kalimat bahasa Indonesia.
- source_word: נִשְׁקַל
  choice: ditimbang
  rationale: Bentuk pasif Niphal dipertahankan. Dalam bahasa Indonesia, bentuk verba tidak perlu berubah meskipun subjeknya majemuk.
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: perak, emas, dan berbagai perkakas
  rationale: כֵּלִים dalam konteks inventaris Bait Allah menunjuk pada perkakas atau barang perlengkapan. Kata 'berbagai' membuat bentuk jamak dan cakupan istilahnya wajar dalam bahasa Indonesia tanpa menentukan jenis bendanya secara berlebihan.
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: di rumah Allah kami
  rationale: Mempertahankan ungkapan harfiah 'rumah Allah kami' beserta nada komunalnya, alih-alih langsung menggantinya dengan 'Bait Allah'.
- source_word: עַל יַד
  choice: lalu diserahkan kepada
  rationale: Ungkapan yang secara harfiah berkaitan dengan 'tangan' menyatakan penyerahan ke dalam tanggung jawab atau pengawasan seseorang. Rumusan ini alami dalam bahasa Indonesia dan, bersama verba 'ditimbang', menyampaikan proses penimbangan resmi saat serah terima.
- source_word: מְרֵמוֹת בֶּן אֽוּרִיָּה הַכֹּהֵן
  choice: Meremot bin Uria, sang imam
  rationale: Nama-nama ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia. Frasa 'sang imam' paling wajar menerangkan Meremot.
- source_word: וְעִמּוֹ אֶלְעָזָר בֶּן פִּינְחָס
  choice: Bersama dia ada Eleazar bin Pinehas
  rationale: Menjaga susunan koordinatif teks Ibrani sambil menghasilkan kalimat Indonesia yang jelas.
- source_word: וְעִמָּהֶם יוֹזָבָד בֶּן יֵשׁוּעַ וְנוֹעַדְיָה בֶן בִּנּוּי הַלְוִיִּם
  choice: dan bersama mereka ada Yozabad bin Yesua serta Noadya bin Binui, orang-orang Lewi
  rationale: Sebutan jamak 'orang-orang Lewi' dipertahankan sebagai keterangan kolektif bagi dua orang terakhir yang disebutkan.
