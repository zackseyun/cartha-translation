language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ו/אוצא/ה אוֹתָ/ם֙ עַל אִדּ֣וֹ הָ/רֹ֔אשׁ בְּ/כָסִפְיָ֖א הַ/מָּק֑וֹם וָ/אָשִׂימָ/ה֩ בְּ/פִי/הֶ֨ם דְּבָרִ֜ים לְ֠/דַבֵּר אֶל אִדּ֨וֹ אָחִ֤י/ו ה/נתונים בְּ/כָסִפְיָ֣א הַ/מָּק֔וֹם לְ/הָֽבִיא לָ֥/נוּ מְשָׁרְתִ֖ים לְ/בֵ֥ית אֱלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/017.yaml
  text: And I sent them to Iddo[a], the chief at the place Casiphia, and I put in their mouths words to speak to Iddo and his brothers, the temple servants at the place Casiphia[b], to bring us ministers for the house of our God.
translation:
  language: id
  text: Aku mengutus mereka kepada Ido, pemimpin di Kasifia. Aku membekali mereka dengan pesan untuk disampaikan kepada Ido dan saudara-saudaranya, para pelayan Bait Allah[a] di Kasifia, supaya mereka membawa kepada kami orang-orang untuk melayani[b] di rumah Allah kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang yang diberikan”; kelompok ini juga dikenal sebagai kaum Netinim, yaitu golongan yang dikhususkan untuk membantu pelayanan di Bait Allah.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah orang-orang yang melakukan pelayanan di Bait Allah, bukan mesti pemegang jabatan keagamaan formal dari masa yang lebih kemudian.
    reason: cultural_note
lexical_decisions:
- source_word: וָאוֹצִיאָה אוֹתָם
  choice: Aku mengutus mereka
  rationale: Bentuk Hifil dari יצא secara harfiah berarti menyebabkan keluar/pergi; dalam konteks penugasan para utusan, “mengutus” menyampaikan maksudnya secara alami dan tepat.
- source_word: אִדּוֹ הָרֹאשׁ
  choice: Ido, pemimpin
  rationale: רֹאשׁ secara harfiah berarti “kepala”, tetapi di sini merupakan sebutan bagi orang yang memimpin atau bertanggung jawab.
- source_word: בְּכָסִפְיָא הַמָּקוֹם
  choice: di daerah Kasifia
  rationale: מָקוֹם menunjukkan suatu tempat atau lokasi. “Daerah Kasifia” mempertahankan unsur tempat dalam teks Ibrani tanpa menghasilkan susunan yang kaku dalam bahasa Indonesia.
- source_word: וָאָשִׂימָה בְּפִיהֶם דְּבָרִים לְדַבֵּר
  choice: Aku membekali mereka dengan pesan untuk disampaikan
  rationale: Ungkapan Ibrani secara harfiah berarti “menaruh perkataan dalam mulut mereka”. Terjemahan ini menyampaikan idiom pemberian pesan secara jelas, sambil mempertahankan tujuan agar pesan itu disampaikan.
- source_word: אֶל אִדּוֹ אָחִיו
  choice: kepada Ido dan saudara-saudaranya
  rationale: אָחִיו dapat merujuk secara kolektif kepada saudara-saudara atau rekan-rekan Ido; unsur jamak sesudahnya mendukung pemahaman kelompok tanpa menentukan apakah hubungan mereka biologis.
- source_word: הַנְּתוּנִים
  choice: para pelayan Bait Allah
  rationale: Dalam Ezra-Nehemia, istilah ini menunjuk pada suatu kelompok yang dikhususkan bagi pelayanan tempat ibadah. Terjemahan fungsional lebih mudah dipahami daripada transliterasi “kaum Netinim”, yang tetap dicatat dalam catatan kaki.
- source_word: מְשָׁרְתִים
  choice: orang-orang yang dapat melayani
  rationale: Partisipel ini menunjuk kepada orang yang melakukan pelayanan. Ungkapan ini dibedakan dari הַנְּתוּנִים, nama golongan tertentu, dan tidak mengesankan jabatan keagamaan formal dari masa yang lebih kemudian.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: di rumah Allah kita
  rationale: “Rumah Allah kita” mempertahankan ungkapan sumber dan nuansa relasionalnya; preposisi tujuan diterjemahkan secara alami sebagai tempat lingkup pelayanan.
theological_decisions:
- issue: Identitas הַנְּתוּנִים dalam lingkungan pelayanan Bait Allah
  choice: para pelayan Bait Allah
  alternative: kaum Netinim
  rationale: Pilihan fungsional menjelaskan peran kelompok tersebut kepada pembaca modern tanpa menambahkan struktur jabatan dari tradisi keagamaan kemudian. Nama tradisionalnya dipertahankan dalam catatan kaki.
- issue: Pembedaan antara הַנְּתוּנִים dan מְשָׁרְתִים
  choice: para pelayan Bait Allah … orang-orang yang dapat melayani
  alternative: para pelayan … para pelayan
  rationale: Istilah pertama diperlakukan sebagai sebutan bagi kelompok yang dikenal, sedangkan istilah kedua menggambarkan fungsi orang-orang yang hendak dibawa. Pembedaan ini mempertahankan ketegangan leksikal teks tanpa menganggap mereka pemegang jabatan rohani formal.
- issue: Hubungan frasa אָחִיו הַנְּתוּנִים dengan Ido
  choice: Ido dan saudara-saudaranya, para pelayan Bait Allah
  alternative: Ido, saudaranya, dan para pelayan Bait Allah
  rationale: Bentuk אָחִיו dapat dibaca “saudaranya” atau “saudara-saudaranya”. Konteks kelompok dan bentuk jamak הַנְּתוּנִים mendukung pembacaan kolektif, tetapi terjemahan tidak mempersempit “saudara” menjadi hubungan biologis semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum; idiom Ibrani tentang “menaruh perkataan dalam mulut” diterjemahkan menurut maknanya. Nama Ido dan Kasifia mengikuti bentuk yang lazim dalam bahasa Indonesia. Semua penanda catatan kaki ditempatkan langsung pada istilah yang dijelaskan.
