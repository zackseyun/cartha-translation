revisions:
- from: Aku mengutus mereka kepada Ido, pemimpin di daerah Kasifia. Aku membekali mereka dengan pesan untuk disampaikan kepada Ido dan saudara-saudaranya, para pelayan Bait Allah[a] di daerah Kasifia, supaya mereka membawa kepada kami orang-orang yang dapat melayani[b] di rumah Allah kita.
  to: Aku mengutus mereka kepada Ido, pemimpin di Kasifia. Aku membekali mereka dengan pesan untuk disampaikan kepada Ido dan saudara-saudaranya, para pelayan Bait Allah[a] di Kasifia, supaya mereka membawa kepada kami orang-orang untuk melayani[b] di rumah Allah kita.
  rationale: 'Revisi terbatas pada dua frasa: “daerah Kasifia” diganti dengan “Kasifia” agar tidak menambahkan cakupan geografis, dan “yang dapat melayani” diganti dengan “untuk melayani” agar fungsi yang dimaksud oleh מְשָׁרְתִים tersampaikan tanpa nuansa kemampuan. Penanda catatan kaki tetap melekat pada istilah yang dijelaskan.'
