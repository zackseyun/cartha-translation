  text: Semuanya dihitung menurut jumlah dan beratnya, lalu seluruh beratnya dicatat pada waktu itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּמִסְפָּר
  choice: dihitung menurut jumlah
  rationale: מִסְפָּר berarti jumlah atau hitungan. Dalam konteks pemeriksaan barang-barang berharga, frasa ini menyatakan penghitungan berdasarkan jumlah benda.
- source_word: בְּמִשְׁקָל
  choice: menurut beratnya
  rationale: מִשְׁקָל berarti berat. Ungkapan ini dipasangkan dengan בְּמִסְפָּר dan menunjukkan bahwa barang-barang diperiksa berdasarkan jumlah maupun berat.
- source_word: לַכֹּל
  choice: semuanya
  rationale: 'Frasa ini menegaskan cakupan menyeluruh: penghitungan dan penimbangan berlaku atas seluruh barang yang diserahkan.'
- source_word: וַיִּכָּתֵב
  choice: lalu ... dicatat
  rationale: Bentuk pasif כתב secara harfiah berarti 'ditulis'; dalam konteks administrasi, 'dicatat' secara alami menyampaikan pembuatan catatan resmi.
- source_word: כָּל הַמִּשְׁקָל
  choice: seluruh beratnya
  rationale: Secara harfiah berarti 'seluruh berat'. Pilihan ini mempertahankan unsur כָּל sekaligus wajar dalam konteks pencatatan hasil penimbangan seluruh barang.
- source_word: בָּעֵת הַהִיא
  choice: pada waktu itu
  rationale: Terjemahan langsung ini mempertahankan penunjukan pada waktu penyerahan dan pemeriksaan tersebut.
