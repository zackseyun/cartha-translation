base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/024.yaml
  text: 'Then I set apart twelve of the leading priests: Sherebiah[a], Hashabiah[b], and with them ten of their brothers.'
translation:
  language: id
  text: 'Kemudian aku mengkhususkan dua belas orang dari antara para pemimpin imam: Serebya, Hasabya, dan bersama mereka sepuluh orang dari antara saudara-saudara mereka.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “saudara-saudara” dapat mencakup kerabat atau rekan sekelompok mereka, tetapi bahasa Ibrani memakai istilah kekerabatan maskulin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַבְדִּילָה
  choice: Kemudian aku mengkhususkan
  rationale: Bentuk Hifil dari בדל berarti memisahkan atau mengkhususkan. Dalam konteks penugasan untuk menjaga persembahan kudus, “mengkhususkan” menyampaikan pemilihan bagi tugas tertentu, sedangkan “Kemudian” mempertahankan urutan narasi.
- source_word: מִשָּׂרֵי הַכֹּהֲנִים
  choice: dari antara para pemimpin imam
  rationale: 'שָׂרֵי menunjuk kepada para pemimpin atau kepala, dan מִן bersifat partitif: dua belas orang dipilih dari kelompok para pemimpin imam.'
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas orang
  rationale: Bilangan diterjemahkan langsung; “orang” ditambahkan secara wajar dalam bahasa Indonesia karena yang dihitung adalah manusia.
- source_word: לְשֵׁרֵבְיָה חֲשַׁבְיָה
  choice: serta Serebya, Hasabya
  rationale: Nama ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia. “Serta” menyajikan nama-nama ini sebagai tambahan kepada dua belas pemimpin imam, tetapi ambiguitas hubungan sintaksisnya dicatat dalam catatan kaki.
- source_word: וְעִמָּהֶם
  choice: dan bersama mereka
  rationale: Mempertahankan secara eksplisit struktur aditif dan frasa penyerta dalam bahasa Ibrani.
- source_word: מֵאֲחֵיהֶם
  choice: dari antara saudara-saudara mereka
  rationale: Terjemahan langsung mempertahankan istilah kekerabatan maskulin אָח beserta nuansa partitif מִן; cakupannya yang mungkin lebih luas dijelaskan dalam catatan kaki.
- source_word: עֲשָׂרָה
  choice: sepuluh orang
  rationale: Bilangan diterjemahkan langsung dengan penambahan “orang” yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan Serebya, Hasabya, dan sepuluh saudara mereka dengan dua belas pemimpin imam
  choice: Menyajikan mereka sebagai kelompok tambahan melalui kata “serta”
  alternative: Memahami Serebya, Hasabya, dan sepuluh saudara mereka sebagai dua belas orang yang disebut sebelumnya
  rationale: Susunan Ibrani dengan לְ sebelum nama Serebya tidak sepenuhnya transparan. Konteks dekat menyebut Serebya dan Hasabya sebagai orang Lewi, sehingga pembacaan sebagai kelompok tambahan menghindari penyamaan mereka secara langsung dengan para pemimpin imam; pembacaan alternatif tetap dicatat agar ambiguitas sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Mengkhususkan” dipilih karena alami dalam konteks penugasan kudus. Nama memakai bentuk Indonesia Serebya dan Hasabya. Struktur kalimat dijaga ringkas sambil mempertahankan ambiguitas sintaksis melalui catatan kaki.
