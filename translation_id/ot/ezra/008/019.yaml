  text: וְ/אֶת חֲשַׁבְיָ֔ה וְ/אִתּ֥/וֹ יְשַֽׁעְיָ֖ה מִ/בְּנֵ֣י מְרָרִ֑י אֶחָ֥י/ו וּ/בְנֵי/הֶ֖ם עֶשְׂרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/019.yaml
  text: and Hashabiah[a], and with him Jeshaiah, from the sons of Merari, his brothers and their sons, twenty[b];
translation:
  language: id
  text: juga Hasabya, dan bersama dia Yesaya, dari keturunan Merari[a], beserta saudara-saudaranya[b] dan anak-anak lelaki mereka, dua puluh orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari anak-anak Merari.”'
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks daftar kaum seperti ini, “saudara-saudaranya” dapat mencakup kerabat laki-laki atau sesama anggota kaum Merari, bukan hanya saudara kandung.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֶת
  choice: juga
  rationale: Kata sambung dan penanda objek melanjutkan daftar dari ayat sebelumnya. Dalam bahasa Indonesia, “juga” secara alami menyatakan tambahan, sedangkan penanda objek tidak diterjemahkan tersendiri.
- source_word: חֲשַׁבְיָה
  choice: Hasabya
  rationale: Nama orang ditransliterasikan menurut bentuk yang wajar dan lazim dalam bahasa Indonesia.
- source_word: וְאִתּוֹ
  choice: dan bersama dia
  rationale: Mempertahankan baik unsur penghubung maupun makna penyertaan dari preposisi dengan sufiks orang ketiga tunggal maskulin.
- source_word: יְשַׁעְיָה
  choice: Yesaya
  rationale: Nama Ibrani ini disajikan dalam bentuk Indonesia yang sudah dikenal; konteks menjelaskan bahwa orang ini bukan nabi Yesaya.
- source_word: מִבְּנֵי מְרָרִי
  choice: dari keturunan Merari
  rationale: Secara harfiah berarti “dari anak-anak Merari,” tetapi dalam daftar silsilah ungkapan itu menunjuk kepada garis keturunan atau kaum Merari. “Keturunan” menyampaikan maksudnya dengan alami tanpa menghilangkan hubungan genealogis.
- source_word: אֶחָיו
  choice: saudara-saudaranya
  rationale: Mempertahankan arti dasar kata Ibrani dan sufiks tunggal “-nya,” sambil membiarkan konteks menentukan apakah mereka saudara kandung atau kerabat sekaum.
- source_word: וּבְנֵיהֶם
  choice: dan anak-anak lelaki mereka
  rationale: Bentuk maskulin jamak secara harfiah berarti “anak-anak lelaki mereka”; sufiks jamak “mereka” dipertahankan.
- source_word: עֶשְׂרִים
  choice: dua puluh orang
  rationale: Bilangan ini paling wajar dipahami sebagai jumlah orang dalam kelompok yang baru disebutkan. Kata “orang” ditambahkan agar fungsi bilangannya jelas dalam bahasa Indonesia.
theological_decisions: []
