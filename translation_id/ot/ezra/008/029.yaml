  text: שִׁקְד֣וּ וְ/שִׁמְר֗וּ עַֽד תִּשְׁקְל֡וּ לִ/פְנֵי֩ שָׂרֵ֨י הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם וְ/שָׂרֵֽי הָ/אָב֥וֹת לְ/יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם הַ/לִּשְׁכ֖וֹת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/029.yaml
  text: Be watchful and guard them until you weigh them out before the chief priests and the Levites and the heads of the fathers’ houses of Israel in Jerusalem[c][b][a], in the chambers of the house of Yahweh.
translation:
  language: id
  text: Berjaga-jagalah dan jagalah semuanya[a] sampai kalian menimbangnya di hadapan para pemimpin imam, orang-orang Lewi, serta para kepala keluarga Israel[b] di Yerusalem, di ruang-ruang rumah Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bersungguh-sungguhlah dan jagalah semuanya.” Kedua perintah Ibrani menekankan kewaspadaan dan penjagaan yang cermat atas barang-barang yang dipercayakan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “para pemimpin para leluhur bagi Israel”; maksudnya ialah para kepala kelompok keluarga atau wangsa berdasarkan garis leluhur.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “rumah Yahweh”; yakni bait.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁקְדוּ וְשִׁמְרוּ
  choice: Berjaga-jagalah dan jagalah semuanya
  rationale: Kedua bentuk perintah menekankan kewaspadaan dan penjagaan yang cermat. Kata “semuanya” dipasok dari konteks untuk menunjuk pada barang-barang berharga yang dipercayakan dalam ayat sebelumnya.
- source_word: עַד תִּשְׁקְלוּ
  choice: sampai kalian menimbangnya
  rationale: שׁקל menunjuk pada penimbangan barang berharga sebagai bentuk pertanggungjawaban. Bentuk orang kedua jamak dipertahankan dengan “kalian”.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini berarti di depan atau dalam kehadiran para pejabat yang menyaksikan penimbangan.
- source_word: שָׂרֵי הַכֹּהֲנִים וְהַלְוִיִּם
  choice: para pemimpin imam dan orang Lewi
  rationale: Susunan Ibrani paling wajar dipahami sebagai para pemimpin dari kalangan imam dan orang Lewi. “Pemimpin” mempertahankan arti שָׂרֵי tanpa memasukkan pengertian teknis yang mungkin melekat pada istilah “imam kepala”.
- source_word: שָׂרֵי הָאָבוֹת לְיִשְׂרָאֵל
  choice: para pemimpin kaum leluhur Israel
  rationale: Ungkapan ini menunjuk pada kepala kelompok kekerabatan atau wangsa berdasarkan garis leluhur. “Kaum leluhur” mempertahankan nuansa sosial Ibrani dengan bahasa Indonesia yang cukup alami.
- source_word: הַלִּשְׁכוֹת
  choice: bilik-bilik
  rationale: Kata ini menunjuk pada ruang-ruang dalam kompleks rumah ibadah; “bilik-bilik” tidak membatasi fungsinya secara khusus sebagai gudang.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan konkret “rumah” dan menyajikan nama ilahi yang terdapat langsung dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung. “Yahweh” mempertahankannya sebagai nama diri, sementara catatan menjelaskan bahwa rumah itu adalah bait-Nya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “berjaga-jagalah dan jagalah” sengaja dipertahankan untuk mencerminkan dua perintah Ibrani, sedangkan istilah sosial dan arsitektural dijelaskan singkat melalui catatan kaki.
