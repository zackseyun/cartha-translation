  text: וַֽ/נִּסְעָ֞/ה מִ/נְּהַ֣ר אַֽהֲוָ֗א בִּ/שְׁנֵ֤ים עָשָׂר֙ לַ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן לָ/לֶ֖כֶת יְרוּשָׁלִָ֑ם וְ/יַד אֱלֹהֵ֨י/נוּ֙ הָיְתָ֣ה עָלֵ֔י/נוּ וַ/יַּ֨צִּילֵ֔/נוּ מִ/כַּ֥ף אוֹיֵ֛ב וְ/אוֹרֵ֖ב עַל הַ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/031.yaml
  text: Then we set out from the river Ahava on the twelfth day of the first month to go to Jerusalem[a], and the hand of our God was upon us, and he delivered us from the hand of the enemy and the ambushes along the way.
translation:
  language: id
  text: Pada hari kedua belas bulan pertama, kami berangkat dari Sungai Ahawa untuk pergi ke Yerusalem. Tangan Allah kami menyertai kami, dan Dia melepaskan kami dari tangan musuh dan dari penyergap[a] di jalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang menghadang” atau “penyergapan.” Kata Ibrani ini berbentuk partisipel dan dapat menunjuk kepada orang yang menunggu untuk menyerang; dalam konteksnya, kata itu juga dapat dipahami sebagai bahaya penyergapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּסְעָה
  choice: kami berangkat
  rationale: Dalam konteks perjalanan, נסע berarti membongkar perkemahan lalu berangkat. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gerak narasi.
- source_word: מִנְּהַר אֲהֲוָא
  choice: dari Sungai Ahawa
  rationale: נָהָר berarti sungai, sedangkan nama tempat ditransliterasikan sebagai Ahawa.
- source_word: בִּשְׁנֵים עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: Pada hari kedua belas bulan pertama
  rationale: Kata 'hari' tersirat dalam ungkapan tanggal Ibrani dan ditambahkan agar jelas serta alami dalam bahasa Indonesia.
- source_word: לָלֶכֶת יְרוּשָׁלִָם
  choice: untuk pergi ke Yerusalem
  rationale: Bentuk infinitif לָלֶכֶת menyatakan tujuan keberangkatan.
- source_word: וְיַד אֱלֹהֵינוּ הָיְתָה עָלֵינוּ
  choice: Tangan Allah kami menyertai kami
  rationale: Pilihan ini mempertahankan gambaran 'tangan Allah', motif penting dalam Ezra, sambil mengungkapkan הָיְתָה עָלֵינוּ secara wajar dan mudah dipahami dalam bahasa Indonesia.
- source_word: וַיַּצִּילֵנוּ
  choice: Dia melepaskan kami
  rationale: נצל menyatakan tindakan membebaskan atau menyelamatkan dari bahaya. 'Melepaskan' cocok dengan frasa lanjutan 'dari tangan musuh'.
- source_word: מִכַּף אוֹיֵב
  choice: dari tangan musuh
  rationale: כַּף secara harfiah berarti telapak atau tangan dan dalam ungkapan ini menunjuk pada kuasa atau cengkeraman. Mempertahankan 'tangan' juga menjaga kesejajaran dengan tangan Allah.
- source_word: וְאוֹרֵב
  choice: dan dari penyergap[a]
  rationale: אוֹרֵב adalah bentuk partisipel tunggal yang secara langsung dapat menunjuk kepada orang yang mengadang atau mengintai untuk menyerang. Kata depan 'dari' diulangi demi kejelasan dalam bahasa Indonesia.
- source_word: עַל הַדָּרֶךְ
  choice: di jalan
  rationale: Terjemahan langsung dan alami bagi ancaman yang menunggu di sepanjang rute perjalanan.
theological_decisions:
- issue: Ungkapan antropomorfis mengenai perlindungan ilahi
  choice: Mempertahankan gambaran 'Tangan Allah kami menyertai kami'
  alternative: Allah kami melindungi kami
  rationale: Teks Ibrani secara eksplisit memakai gambaran tangan Allah, motif berulang dalam Ezra-Nehemia yang menyatakan perkenanan dan tindakan perlindungan Allah. Gambaran itu dipertahankan tanpa mengubahnya menjadi penjelasan abstrak.
- issue: Identitas אוֹרֵב sebagai pelaku atau bahaya penyergapan
  choice: penyergap
  alternative: penyergapan
  rationale: Bentuk Ibraninya adalah partisipel tunggal dan paling langsung menunjuk kepada orang yang mengadang, tetapi secara konteks dapat dipahami sebagai ancaman penyergapan. Ambiguitas ini dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami, sementara citra penting teks Ibrani—khususnya 'tangan Allah' dan 'tangan musuh'—dipertahankan. Penanda catatan kaki ditempatkan langsung pada kata 'penyergap', yaitu unsur yang diterangkannya.
