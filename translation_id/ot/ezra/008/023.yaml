  text: So we fasted and sought our God concerning this[a], and he answered our plea.
translation:
  language: id
  text: Maka kami berpuasa dan memohon kepada Allah kami mengenai hal ini, dan Dia mengabulkan permohonan kami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih formal, “Dia berkenan atas permohonan kami” atau “Dia menanggapi doa kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנָּצוּמָה
  choice: kami berpuasa
  rationale: Bentuk dari צום secara langsung menyatakan tindakan berpuasa oleh kelompok itu; tidak perlu diperluas menjadi ‘kami mengumumkan puasa’.
- source_word: וַנְּבַקְשָׁה מֵאֱלֹהֵינוּ
  choice: memohon kepada Allah kami
  rationale: בקשׁ dengan מן menunjuk kepada Allah sebagai pihak yang dimintai pertolongan. Dalam konteks doa, ‘memohon kepada’ lebih alami dalam bahasa Indonesia daripada terjemahan harfiah ‘mencari dari’, tanpa mengubah maksud sumber.
- source_word: עַל זֹאת
  choice: mengenai hal ini
  rationale: Ungkapan ini merujuk pada perkara yang baru disebutkan dalam konteks sebelumnya; ‘mengenai hal ini’ mempertahankan hubungan tersebut dengan jelas.
- source_word: וַיֵּעָתֵר לָנוּ
  choice: Dia mengabulkan permohonan kami
  rationale: Nifal dari עתר menyatakan tanggapan yang baik terhadap permohonan. Pilihan ini menyampaikan maknanya secara wajar dalam bahasa Indonesia, sedangkan bentuk harfiah pasif terdengar kaku.
theological_decisions:
- issue: Makna tanggapan ilahi dalam וַיֵּעָתֵר לָנוּ
  choice: Dia mengabulkan permohonan kami
  alternative: Dia berkenan mendengarkan kami; Dia menanggapi doa kami
  rationale: Kata kerja Ibrani menunjukkan bahwa Allah menanggapi permohonan mereka dengan baik. ‘Mengabulkan’ mempertahankan hasil positif itu tanpa menambahkan rincian tentang cara atau waktu jawaban-Nya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Maka’ menghubungkan tindakan ini dengan keputusan pada ayat sebelumnya; ‘memohon kepada’ dipilih agar konstruksi doa terdengar alami bagi pembaca umum.
