  text: וָֽ/אֶקְבְּצֵ֗/ם אֶל הַ/נָּהָר֙ הַ/בָּ֣א אֶֽל אַהֲוָ֔א וַ/נַּחֲנֶ֥ה שָׁ֖ם יָמִ֣ים שְׁלֹשָׁ֑ה וָ/אָבִ֤ינָ/ה בָ/עָם֙ וּ/בַ/כֹּ֣הֲנִ֔ים וּ/מִ/בְּנֵ֥י לֵוִ֖י לֹא מָצָ֥אתִי שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/015.yaml
  text: I gathered them to the river that comes to Ahava[a], and we camped there three days. Then I examined the people and the priests[b], but I found none of the sons of Levi there.
translation:
  language: id
  text: Aku mengumpulkan mereka ke sungai yang mengalir ke Ahawa[a], lalu kami berkemah di sana selama tiga hari. Aku memeriksa orang-orang dan para imam, tetapi tidak menemukan seorang pun dari keturunan Lewi[b] di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kanal yang mengalir ke Ahawa.” Dalam konteks ini, kata Ibrani tersebut dapat berarti sungai atau saluran air.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “anak-anak Lewi,” yaitu orang-orang Lewi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְבְּצֵם
  choice: Aku mengumpulkan mereka
  rationale: Kata קבץ berarti mengumpulkan atau menghimpun; bentuk ini alami dalam bahasa Indonesia dan mempertahankan peran aktif Ezra.
- source_word: הַנָּהָר הַבָּא אֶל אַהֲוָא
  choice: sungai yang mengalir ke Ahawa
  rationale: נָהָר biasanya berarti sungai, meskipun dalam konteks Babilonia dapat menunjuk kanal; הַבָּא dinyatakan secara alami sebagai 'yang mengalir ke'.
- source_word: וַנַּחֲנֶה
  choice: kami berkemah
  rationale: חנה berarti berkemah; padanan ini jelas dan lazim dalam bahasa Indonesia modern.
- source_word: יָמִים שְׁלֹשָׁה
  choice: selama tiga hari
  rationale: Ungkapan durasi dibuat eksplisit dan alami tanpa mengubah makna.
- source_word: וָאָבִינָה
  choice: Aku memeriksa
  rationale: Dalam konteks ini בין menyatakan perhatian atau pemeriksaan saksama terhadap susunan rombongan.
- source_word: בָעָם
  choice: rakyat
  rationale: עָם menunjuk kelompok umum dalam rombongan, yang dibedakan dari para imam dan keturunan Lewi.
- source_word: וּבַכֹּהֲנִים
  choice: dan para imam
  rationale: Padanan standar bagi כֹּהֲנִים.
- source_word: וּמִבְּנֵי לֵוִי
  choice: dari keturunan Lewi
  rationale: Secara harfiah 'dari anak-anak Lewi'; 'keturunan Lewi' mempertahankan unsur genealogis sekaligus terdengar alami.
- source_word: לֹא מָצָאתִי שָׁם
  choice: tidak menemukan seorang pun ... di sana
  rationale: Objek tersirat dinyatakan sebagai 'seorang pun' agar penyangkalan total terbaca jelas dan wajar.
