  source_fidelity: Perlu koreksi kecil pada preposisi dan istilah bagi עָם. Ibrani menyatakan bahwa Ezra mengumpulkan mereka ke tempat di sungai/saluran air itu, bukan di dalam sungai. Selain itu, עָם dalam konteks daftar rombongan lebih tepat diterjemahkan “orang-orang” daripada “rakyat,” yang dalam bahasa Indonesia dapat menyiratkan penduduk atau kawula suatu negeri.
  naturalness: Teks umumnya lancar dan baku. “Ke sungai” dan “orang-orang” membuat narasi lebih idiomatis sekaligus lebih tepat konteksnya.
  terminology: “Para imam,” “keturunan Lewi,” dan nama “Ahawa” sudah sesuai. Catatan varian sungai/kanal perlu dipertahankan; “saluran air” lebih netral daripada membatasi pada kanal buatan.
