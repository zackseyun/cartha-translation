  - severity: low
    issue: “rakyat” untuk בָעָם
    rationale: Dalam konteks pemeriksaan anggota rombongan, “orang-orang” menyatakan kelompok yang hadir tanpa konotasi politis atau sosial yang lazim pada “rakyat.”
