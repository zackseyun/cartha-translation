base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/003.yaml
  text: 'From the sons of Shecaniah[a], from the sons of Parosh: Zechariah, and with him were enrolled by genealogy 150 males.'
translation:
  language: id
  text: 'Dari keturunan Sekhanya[a]; dari keturunan Paros: Zakharia. Bersama dia, 150 orang laki-laki terdaftar menurut silsilah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Susunan teks Ibrani pada awal ayat ini tidak jelas: “keturunan Sekhanya” tidak disertai nama pemimpin atau jumlah tersendiri. Ada yang menghubungkannya dengan ayat sebelumnya atau memahaminya sebagai bagian dari garis keluarga Paros.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: מִבְּנֵי שְׁכַנְיָה
  choice: Dari keturunan Sekhanya
  rationale: Ungkapan ini dipertahankan sebagai unsur tersendiri dalam daftar karena teks Ibrani mengulang מִבְּנֵי sebelum nama Paros. Tanda titik koma mencerminkan jeda tanpa memaksakan hubungan sintaksis yang tidak dinyatakan dengan jelas.
- source_word: מִבְּנֵי פַרְעֹשׁ
  choice: dari keturunan Paros
  rationale: Keturunan merupakan padanan Indonesia yang alami untuk בְּנֵי dalam konteks daftar keluarga, sedangkan preposisi מִן menandai orang yang berasal dari kelompok tersebut.
- source_word: זְכַרְיָה
  choice: Zakharia
  rationale: Bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: וְעִמּוֹ
  choice: dan bersama dia
  rationale: Mempertahankan koordinasi ringkas teks Ibrani dan menunjukkan bahwa jumlah berikut mencakup rombongan yang menyertai Zakharia.
- source_word: הִתְיַחֵשׂ
  choice: tercatat menurut silsilah
  rationale: Bentuk hitpael dari יחס menunjuk pada pencatatan atau penghitungan resmi berdasarkan silsilah, bukan sekadar hubungan biologis.
- source_word: לִזְכָרִים
  choice: orang laki-laki
  rationale: Teks secara eksplisit menyebut jenis kelamin, bukan usia dewasa; frasa ini lebih alami dalam bahasa Indonesia daripada bentuk substantif 'jantan' atau istilah yang terlalu teknis.
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: '150'
  rationale: Angka dipertahankan secara tepat dan disajikan sebagai numeral agar daftar sensus mudah dibaca.
theological_decisions:
- issue: Hubungan sintaksis antara 'keturunan Sekhanya' dan 'keturunan Paros'
  choice: Mempertahankan keduanya sebagai dua unsur berurutan yang dipisahkan titik koma
  alternative: Menganggap Sekhanya sebagai leluhur dalam garis Paros, atau menghubungkan frasa Sekhanya dengan ayat sebelumnya
  rationale: Teks Masoret mengulang formula מִבְּנֵי dan tidak menjelaskan hubungannya. Terjemahan tidak sepatutnya menyisipkan hubungan genealogis atau memindahkan frasa tanpa kepastian tekstual.
translation_notes:
  register: 'Bahasa daftar dibuat ringkas, formal, dan tetap mudah dipahami. Nama-nama ditulis menurut bentuk yang lazim dalam Alkitab bahasa Indonesia: Sekhanya, Paros, dan Zakharia. Ketidakjelasan susunan Ibrani dipertahankan dalam teks utama dan diterangkan dalam catatan kaki.'
