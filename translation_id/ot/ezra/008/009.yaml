  text: 'From the sons of Joab: Obadiah son of Jehiel[a], and with him 218 males.'
translation:
  language: id
  text: 'Dari keturunan Yoab: Obaja anak Yehiel, dan bersama dia 218 orang laki-laki.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבְּנֵי
  choice: Dari keturunan
  rationale: Dalam konteks daftar rombongan, frasa ini menunjukkan anggota dari garis keluarga Yoab. “Keturunan” terdengar alami dalam bahasa Indonesia dan tidak membatasi maknanya pada anak kandung langsung.
- source_word: יוֹאָב
  choice: Yoab
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: עֹבַדְיָה
  choice: Obaja
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן יְחִיאֵל
  choice: anak Yehiel
  rationale: בֶּן menyatakan hubungan anak laki-laki dengan ayahnya; bentuk tanpa kata sandang paling alami dalam susunan daftar bahasa Indonesia.
- source_word: וְעִמּוֹ
  choice: dan bersama dia
  rationale: Mempertahankan kata penghubung serta menunjukkan bahwa jumlah berikut adalah orang-orang yang menyertai pemimpin rombongan tersebut.
- source_word: מָאתַיִם וּשְׁמֹנָה עָשָׂר
  choice: '218'
  rationale: Bilangan Ibrani berarti dua ratus delapan belas; angka dipakai agar daftar ringkas dan mudah dibaca.
- source_word: הַזְּכָרִים
  choice: orang laki-laki
  rationale: Istilah Ibrani secara khusus menunjuk pada jenis kelamin laki-laki dan tidak dengan sendirinya membatasi mereka pada laki-laki dewasa.
