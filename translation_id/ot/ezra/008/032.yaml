  text: So we came to Jerusalem and stayed there three days.
translation:
  language: id
  text: Lalu, kami tiba di Yerusalem dan tinggal di sana selama tiga hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנָּבוֹא
  choice: Jadi, kami tiba
  rationale: Bentuk wayyiqtol dari בוא melanjutkan urutan narasi. Dalam konteks perjalanan menuju Yerusalem, “tiba” menyampaikan tercapainya tujuan dengan wajar dalam bahasa Indonesia; “jadi” menandai kelanjutan peristiwa.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalem
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: וַנֵּשֶׁב
  choice: dan tinggal
  rationale: Kata ישב dapat berarti duduk, berdiam, menetap, atau tinggal. Dalam konteks persinggahan sesudah perjalanan, “tinggal” paling alami dan tidak menyiratkan bahwa mereka menetap secara permanen.
- source_word: שָׁם
  choice: di sana
  rationale: Keterangan tempat ini merujuk kembali kepada Yerusalem; “di sana” merupakan padanan Indonesia yang alami.
- source_word: יָמִים שְׁלֹשָׁה
  choice: selama tiga hari
  rationale: Frasa ini menyatakan durasi. Kata “selama” membuat fungsi waktunya jelas dan alami dalam bahasa Indonesia.
