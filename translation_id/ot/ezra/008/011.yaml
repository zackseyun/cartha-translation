base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/011.yaml
  text: 'And from the sons of Bebai: Zechariah son of Bebai[a], and with him twenty-eight males.'
translation:
  language: id
  text: 'Dari keturunan Bebai: Zakharia anak Bebai, dan bersama dia dua puluh delapan orang laki-laki.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Dari keturunan
  rationale: Dalam konteks daftar silsilah, בְּנֵי dapat menunjuk bukan hanya kepada anak kandung, melainkan juga kepada keturunan atau anggota garis keluarga. 'Keturunan' menyampaikan maksud itu secara alami dalam bahasa Indonesia; waw penghubung tidak perlu diterjemahkan tersendiri pada awal butir daftar.
- source_word: בֵבַי
  choice: Bebai
  rationale: Nama diri ditransliterasikan ke dalam bentuk yang lazim dan langsung dari Ibrani.
- source_word: זְכַרְיָה
  choice: Zakharia
  rationale: Transliterasi Indonesia yang lazim untuk nama Ibrani זְכַרְיָה.
- source_word: בֶּן
  choice: anak
  rationale: Dalam konstruksi patronimik langsung ini, 'anak' merupakan padanan yang paling wajar dan tepat.
- source_word: וְעִמּוֹ
  choice: dan bersama dia
  rationale: Mempertahankan kata penghubung dan menyatakan bahwa dua puluh delapan orang tersebut menyertai Zakharia.
- source_word: עֶשְׂרִים וּשְׁמֹנָה
  choice: dua puluh delapan
  rationale: Padanan langsung bilangan kardinal Ibrani dalam bentuk Indonesia yang baku.
- source_word: הַזְּכָרִים
  choice: laki-laki
  rationale: Kata Ibrani secara khusus menandai jenis kelamin, bukan kedewasaan. 'Laki-laki' lebih tepat daripada 'pria' atau 'orang dewasa' dalam konteks daftar ini.
theological_decisions: []
