  yaml_path: translation/ot/ezra/008/008.yaml
  text: 'And from the sons of Shephatiah: Zebadiah son of Michael[a], and with him eighty males.'
translation:
  language: id
  text: 'Dan dari keturunan Sefaca[a]: Zebaja anak Mikhael, dan bersama dia delapan puluh laki-laki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Sefaca.” Dalam konteks silsilah, ungkapan Ibrani ini dapat menunjuk kepada keturunan atau garis keluarga yang lebih luas, bukan hanya anak-anak langsung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Dan dari keturunan
  rationale: Ungkapan Ibrani ini secara harfiah berbunyi “dan dari anak-anak,” tetapi dalam daftar silsilah בני sering menunjuk kepada garis keturunan atau kelompok keluarga yang lebih luas. “Keturunan” menyampaikan maksud konteks secara alami dalam bahasa Indonesia, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: שְׁפַטְיָה
  choice: Sefaca
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: זְבַדְיָה
  choice: Zebaja
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam hubungan langsung antara dua nama pribadi, בֶּן paling wajar dipahami sebagai “anak”; pilihan ini jelas dan alami bagi pembaca Indonesia.
- source_word: מִיכָאֵל
  choice: Mikhael
  rationale: Nama diri ditransliterasikan dengan bentuk Indonesia yang mempertahankan bunyi dan pengenalan nama Ibrani tersebut.
- source_word: וְ/עִמּוֹ
  choice: dan bersama dia
  rationale: Konjungsi dipertahankan untuk mencerminkan susunan daftar, dan frasa ini secara langsung menyatakan bahwa rombongan tersebut menyertai Zebaja.
- source_word: שְׁמֹנִים
  choice: delapan puluh
  rationale: Padanan langsung untuk bilangan kardinal Ibrani.
- source_word: הַזְּכָרִים
  choice: laki-laki
  rationale: Kata Ibrani secara khusus menandai jenis kelamin laki-laki, bukan usia atau kedudukan sosial. “Laki-laki” tepat dan lebih alami daripada istilah nominal “jantan” atau bentuk teknis lainnya.
