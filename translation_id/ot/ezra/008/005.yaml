  text: From the sons of Shecaniah[a], the son of Jahaziel, and with him three hundred males.
translation:
  language: id
  text: Dari bani Sekhanya, anak Yahaziel, dan bersamanya tiga ratus orang laki-laki[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani secara khusus berarti orang berjenis kelamin laki-laki, bukan hanya pria dewasa atau orang yang memiliki kedudukan sosial tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: Dari bani
  rationale: Frasa ini mempertahankan rumusan daftar silsilah dan menunjukkan satu kelompok yang berasal dari bani atau keturunan tertentu.
- source_word: שְׁכַנְיָה
  choice: Sekhanya
  rationale: Nama diri ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Mencerminkan hubungan silsilah secara langsung tanpa menambahkan unsur yang tidak ada dalam teks.
- source_word: יַחֲזִיאֵל
  choice: Yahaziel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: וְעִמּוֹ
  choice: dan bersamanya
  rationale: Mempertahankan hubungan koordinatif serta menunjukkan bahwa kelompok yang dihitung menyertai tokoh yang disebutkan.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: tiga ratus
  rationale: Padanan langsung bagi bilangan kardinal Ibrani.
- source_word: הַזְּכָרִים
  choice: orang laki-laki
  rationale: Kata Ibrani secara khusus menandai jenis kelamin laki-laki, bukan usia dewasa atau kedudukan sosial; penambahan 'orang' menghasilkan ungkapan Indonesia yang alami.
