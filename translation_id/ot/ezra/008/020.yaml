  text: וּ/מִן הַ/נְּתִינִ֗ים שֶׁ/נָּתַ֨ן דָּוִ֤יד וְ/הַ/שָּׂרִים֙ לַ/עֲבֹדַ֣ת הַ/לְוִיִּ֔ם נְתִינִ֖ים מָאתַ֣יִם וְ/עֶשְׂרִ֑ים כֻּלָּ֖/ם נִקְּב֥וּ בְ/שֵׁמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/020.yaml
  text: And from the temple servants whom David and the officials had assigned to the service of the Levites[a], there were 220 temple servants[b]; all of them were designated by name.
translation:
  language: id
  text: Juga dari antara para pelayan Bait Allah[a], yang telah ditugaskan oleh Daud dan para pemimpin untuk pekerjaan orang-orang Lewi, ada 220 orang. Mereka semua disebutkan namanya masing-masing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Netinim, istilah khusus untuk suatu kelompok pelayan Bait Allah.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: Mereka semua didaftarkan menurut nama masing-masing.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַנְּתִינִים / נְתִינִים
  choice: para pelayan Bait Allah
  rationale: Istilah teknis ini menunjuk pada suatu kelompok yang dikhususkan untuk pelayanan Bait Allah, bukan sekadar pelayan pada umumnya. Terjemahan fungsional ini jelas bagi pembaca Indonesia masa kini, sementara istilah Ibraninya dijelaskan dalam catatan kaki.
- source_word: שֶׁנָּתַן
  choice: yang telah ditugaskan
  rationale: Arti harfiahnya ialah 'yang telah diberikan', tetapi dalam konteks penetapan orang untuk pekerjaan ibadah, 'ditugaskan' menyampaikan fungsi administratifnya secara alami.
- source_word: וְהַשָּׂרִים
  choice: para pemimpin
  rationale: Kata ini menyatakan orang-orang berpangkat atau berwenang. 'Para pemimpin' alami dalam bahasa Indonesia dan tidak menyiratkan bahwa mereka pasti pangeran dalam pengertian dinasti.
- source_word: לַעֲבֹדַת הַלְוִיִּם
  choice: untuk membantu pelayanan orang-orang Lewi
  rationale: Ungkapan ini menunjukkan bahwa mereka ditetapkan bagi pekerjaan atau pelayanan yang menjadi tanggung jawab orang Lewi. Kata 'membantu' membuat relasi fungsionalnya jelas tanpa menyatakan rincian hierarki yang tidak diberikan teks.
- source_word: מָאתַיִם וְעֶשְׂרִים
  choice: 220 orang
  rationale: Angka mempertahankan jumlah persis dan bentuk 'orang' diperlukan secara alami dalam bahasa Indonesia karena yang dihitung adalah para pelayan.
- source_word: כֻּלָּם
  choice: mereka semua
  rationale: Bentuk ini mempertahankan penekanan menyeluruh pada setiap anggota kelompok.
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: disebutkan namanya masing-masing
  rationale: Frasa pasif ini menyatakan identifikasi secara khusus berdasarkan nama. Pilihan ini alami dan mempertahankan kemungkinan bahwa mereka disebut, ditetapkan, atau dicatat satu per satu.
