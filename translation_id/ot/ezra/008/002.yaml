lexical_decisions:
- source_word: מִבְּנֵי
  choice: dari keturunan
  rationale: Gabungan preposisi מִן dan bentuk konstruksi jamak בֵּן memperkenalkan garis keturunan dalam daftar ini. Dalam bahasa Indonesia modern, “dari keturunan” menyampaikan makna genealogis dengan alami sambil mempertahankan pola yang berulang.
- source_word: פִינְחָס
  choice: Pinehas
  rationale: Nama diri, ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: גֵּרְשֹׁם
  choice: Gersom
  rationale: Nama diri, ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אִיתָמָר
  choice: Itamar
  rationale: Nama diri, ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: דָּנִיֵּאל
  choice: Daniel
  rationale: Nama diri, ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: דָוִיד
  choice: Daud
  rationale: Nama diri dalam bentuk tradisional yang mapan dalam bahasa Indonesia; di sini menunjukkan garis keturunan kerajaan.
- source_word: חַטּוּשׁ
  choice: Hatus
  rationale: Nama diri, ditransliterasikan secara wajar ke dalam ejaan bahasa Indonesia.
