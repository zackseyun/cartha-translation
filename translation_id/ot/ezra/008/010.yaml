  text: And from the sons of Shelomith[a], the son of Josiphiah, and with him 160 males.
translation:
  language: id
  text: Dari keturunan Selomit, anak Yosifya, serta 160 orang laki-laki yang menyertainya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani secara harfiah: “Dari anak-anak Selomit.” Ungkapan ini dalam daftar silsilah dapat merujuk pada keturunan atau kelompok keluarganya.'
    reason: Mempertahankan bentuk harfiah בְּנֵי sambil menjelaskan pemakaiannya dalam konteks silsilah.
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Dari keturunan
  rationale: Dalam daftar silsilah ini, בְּנֵי secara harfiah berarti “anak-anak,” tetapi dapat menunjuk kepada keturunan atau kelompok keluarga; “keturunan” lebih alami dan tidak memberi kesan bahwa semuanya anak kandung langsung.
- source_word: שְׁלוֹמִית
  choice: Selomit
  rationale: Nama Ibrani ditransliterasikan sesuai bentuk yang lazim dan alami dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Kata ini mengidentifikasi Selomit melalui hubungan dengan Yosifya; terjemahan mempertahankan hubungan yang dinyatakan teks tanpa menambahkan kepastian di luar bentuk Ibraninya.
- source_word: יוֹסִפְיָה
  choice: Yosifya
  rationale: Transliterasi ini mencerminkan konsonan dan unsur akhir nama Ibrani secara wajar dalam ejaan Indonesia.
- source_word: וְעִמּוֹ
  choice: bersama dia
  rationale: Frasa ini menyatakan bahwa jumlah berikut adalah orang-orang yang menyertai tokoh yang baru disebut.
- source_word: מֵאָה וְשִׁשִּׁים
  choice: '160'
  rationale: Angka ditulis dengan digit agar jelas dan ringkas dalam daftar.
- source_word: הַזְּכָרִים
  choice: orang laki-laki
  rationale: Istilah Ibrani secara khusus menyatakan jenis kelamin laki-laki dan tidak dengan sendirinya membatasi jumlah itu pada laki-laki dewasa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan sesuai gaya daftar. Konjungsi awal Ibrani tidak diterjemahkan tersendiri karena hubungan antardaftar sudah alami tanpa “dan” dalam bahasa Indonesia. Penanda catatan kaki ditempatkan setelah seluruh entri.
