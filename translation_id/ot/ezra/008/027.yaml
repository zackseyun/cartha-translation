source:
  edition: WLC
  text: וּ/כְפֹרֵ֤י זָהָב֙ עֶשְׂרִ֔ים לַ/אֲדַרְכֹנִ֖ים אָ֑לֶף וּ/כְלֵ֨י נְחֹ֜שֶׁת מֻצְהָ֤ב טוֹבָה֙ שְׁנַ֔יִם חֲמוּדֹ֖ת כַּ/זָּהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/027.yaml
  text: and twenty bowls of gold worth a thousand darics[a], and two vessels of fine gleaming bronze[b], precious as gold.
translation:
  language: id
  text: dan dua puluh mangkuk emas senilai seribu darik[a], serta dua bejana dari perunggu bermutu tinggi yang berkilau[b], berharga seperti emas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dua puluh mangkuk emas yang seluruhnya bernilai seribu darik.” Teks Ibrani dapat dipahami sebagai menyebutkan nilai keseluruhan mangkuk-mangkuk itu.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dua bejana dari perunggu baik yang digosok hingga mengilap.” Ungkapan Ibrani yang menggambarkan perunggu ini jarang digunakan dan kemungkinan menunjuk pada mutu serta kilau pengerjaannya yang istimewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפֹרֵי
  choice: mangkuk
  rationale: Kata ini menunjuk pada wadah berbentuk mangkuk. “Mangkuk” alami dalam bahasa Indonesia modern dan sesuai dengan konteks daftar perlengkapan berharga.
- source_word: זָהָב
  choice: emas
  rationale: Padanan langsung untuk bahan yang disebutkan dalam teks.
- source_word: עֶשְׂרִים
  choice: dua puluh
  rationale: Bilangan pokok diterjemahkan secara langsung.
- source_word: לַאֲדַרְכֹנִים אָלֶף
  choice: senilai seribu darik
  rationale: אֲדַרְכֹנִים adalah darik Persia, yaitu satuan mata uang atau berat. Prefiks ל paling mungkin menyatakan nilai; istilah historis “darik” dipertahankan.
- source_word: וּכְלֵי
  choice: serta ... bejana
  rationale: כְּלִי dapat berarti benda, perkakas, atau bejana. Dalam daftar perlengkapan rumah Allah, “bejana” paling sesuai; “serta” menghubungkannya dengan lancar pada unsur sebelumnya.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Kata ini dapat menunjuk pada tembaga atau perunggu. Untuk bejana buatan dalam konteks kuno, “perunggu” merupakan pilihan yang wajar.
- source_word: מֻצְהָב טוֹבָה
  choice: bermutu tinggi yang berkilau
  rationale: Ungkapan langka ini tampaknya menggambarkan perunggu berkualitas baik dengan tampilan mengilap. Terjemahan ini tidak memastikan bahwa bejana tersebut berlapis emas.
- source_word: שְׁנַיִם
  choice: dua
  rationale: Bilangan pokok diterjemahkan secara langsung.
- source_word: חֲמוּדֹת
  choice: berharga
  rationale: Kata ini menyatakan sesuatu yang diinginkan atau bernilai tinggi; “berharga” sesuai dengan perbandingan terhadap emas.
- source_word: כַּזָּהָב
  choice: seperti emas
  rationale: Kata depan perbandingan כ diterjemahkan secara langsung tanpa menghapus perbandingan eksplisit dalam teks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Istilah historis “darik” dipertahankan, sedangkan ungkapan langka tentang perunggu diterjemahkan secara terbuka tanpa menyimpulkan bahwa benda itu disepuh emas. Semua penanda catatan kaki muncul dalam teks utama.
