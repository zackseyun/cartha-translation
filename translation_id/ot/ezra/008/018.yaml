  text: וַ/יָּבִ֨יאּוּ לָ֜/נוּ כְּ/יַד אֱלֹהֵ֨י/נוּ הַ/טּוֹבָ֤ה עָלֵ֨י/נוּ֙ אִ֣ישׁ שֶׂ֔כֶל מִ/בְּנֵ֣י מַחְלִ֔י בֶּן לֵוִ֖י בֶּן יִשְׂרָאֵ֑ל וְ/שֵׁרֵֽבְיָ֛ה וּ/בָנָ֥י/ו וְ/אֶחָ֖י/ו שְׁמֹנָ֥ה עָשָֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/018.yaml
  text: And by the good hand of our God upon us[a], they brought to us a man of insight from the sons of Mahli son of Levi, son of Israel—namely Sherebiah, and his sons and his brothers, eighteen.
translation:
  language: id
  text: Karena tangan Allah kita yang baik ada atas kita,[a] mereka membawa kepada kita seorang yang berpengertian dari antara keturunan Mahli, anak Lewi, anak Israel, yaitu Serebya, beserta anak-anaknya dan saudara-saudaranya—delapan belas orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sesuai dengan tangan Allah kita yang baik atas kita.” Ungkapan Ibrani ini menunjuk pada perkenanan dan tindakan pemeliharaan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: mereka membawa kepada kita
  rationale: Bentuk Hifil dari בוא secara wajar berarti ‘membawa’; objek penerimanya dinyatakan oleh לָנוּ, ‘kepada kita’.
- source_word: כְּיַד אֱלֹהֵינוּ הַטּוֹבָה עָלֵינוּ
  choice: Berkat tangan Allah kita yang baik menyertai kita
  rationale: Ungkapan ini mempertahankan citra ‘tangan’ sebagai tindakan dan pemeliharaan Allah yang mendatangkan kebaikan, sambil mengungkapkan fungsi כְּ secara alami dalam bahasa Indonesia.
- source_word: אִישׁ שֶׂכֶל
  choice: seorang yang berpengertian
  rationale: שֶׂכֶל menunjuk pada pengertian, kebijaksanaan praktis, atau kecakapan menimbang; ‘berpengertian’ menjaga keluasan makna itu.
- source_word: מִבְּנֵי מַחְלִי
  choice: dari antara keturunan Mahli
  rationale: בְּנֵי dalam keterangan silsilah dapat mencakup keturunan, bukan hanya anak kandung; padanan ini alami dan tepat dalam konteks genealogis.
- source_word: בֶּן לֵוִי בֶּן יִשְׂרָאֵל
  choice: anak Lewi, anak Israel
  rationale: Pengulangan ‘anak’ mempertahankan bentuk ringkas rantai silsilah Ibrani dan tidak menghilangkan hubungan yang dinyatakan teks.
- source_word: וְשֵׁרֵבְיָה
  choice: yaitu Serebya
  rationale: Waw di sini paling wajar dipahami sebagai pengantar identifikasi orang yang baru saja dideskripsikan.
- source_word: וּבָנָיו וְאֶחָיו
  choice: beserta anak-anak dan saudara-saudaranya
  rationale: ‘Beserta’ secara alami menunjukkan bahwa keluarga Serebya termasuk dalam rombongan yang dibawa.
- source_word: שְׁמֹנָה עָשָׂר
  choice: delapan belas orang
  rationale: Bilangan itu merangkum orang-orang yang disebut; penambahan ‘orang’ diperlukan untuk kelancaran bahasa Indonesia tanpa mengubah acuannya.
theological_decisions:
- issue: Ungkapan pemeliharaan ilahi melalui ‘tangan’ Allah
  choice: Berkat tangan Allah kita yang baik menyertai kita
  alternative: Sesuai dengan tangan Allah kita yang baik atas kita
  rationale: Pilihan utama mempertahankan metafora tangan dan makna perkenanan serta tindakan pemeliharaan Allah, tanpa menjabarkannya menjadi rumusan teologis yang lebih sempit. Catatan kaki mempertahankan kemungkinan bentuk yang lebih dekat dengan susunan Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Nama שֵׁרֵבְיָה ditransliterasikan sebagai ‘Serebya’, selaras dengan pola penyesuaian nama Ibrani dalam bahasa Indonesia. Tanda pisah sebelum jumlah memperjelas bahwa ‘delapan belas orang’ merupakan jumlah keseluruhan kelompok yang baru disebut.
