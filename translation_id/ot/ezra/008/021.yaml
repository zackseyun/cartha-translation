base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/021.yaml
  text: Then I proclaimed a fast there[a], at the Ahava River, that we might humble ourselves before our God, to seek from him a straight path for us, for our little ones[b], and for all our possessions.
translation:
  language: id
  text: Lalu di sana, di tepi Sungai Ahawa, aku menyerukan puasa supaya kami merendahkan diri[a] di hadapan Allah kami dan memohon kepada-Nya jalan yang lurus[b] bagi kami, anak-anak kami, dan segala harta milik kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyengsarakan diri.” Dalam konteks puasa, idiom Ibrani ini menunjuk pada penyangkalan atau perendahan diri di hadapan Allah.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “jalan yang benar” atau, sesuai konteks perjalanan, “perjalanan yang aman.” Secara harfiah, bahasa Ibraninya berbunyi “jalan yang lurus.”
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶקְרָא
  choice: Lalu ... aku menyerukan
  rationale: Dalam konteks ini קרא berarti mengumumkan atau menyerukan secara terbuka. “Lalu” menyampaikan kesinambungan narasi secara wajar dalam bahasa Indonesia.
- source_word: צוֹם
  choice: puasa
  rationale: Nomina ini menunjuk pada pelaksanaan puasa sebagai tindakan bersama; “menyerukan puasa” merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: עַל הַנָּהָר אַהֲוָא
  choice: di tepi Sungai Ahawa
  rationale: Preposisi עַל bersama kata “sungai” dapat menunjukkan lokasi di dekat atau pada sungai. “Di tepi” alami dalam bahasa Indonesia tanpa mengubah Ahawa sebagai nama tempat.
- source_word: לְהִתְעַנּוֹת
  choice: supaya kami merendahkan diri
  rationale: Bentuk hitpael dari ענה dalam konteks puasa menyatakan tindakan merendahkan atau menyangkal diri di hadapan Allah. Pilihan ini menyampaikan idiom dengan jelas tanpa memberi kesan menyakiti diri secara fisik.
- source_word: לִפְנֵי אֱלֹהֵינוּ
  choice: di hadapan Allah kami
  rationale: Ungkapan relasional ini menyatakan sikap dan tindakan dalam hadirat Allah; “di hadapan Allah kami” bersifat alami sekaligus khidmat.
- source_word: לְבַקֵּשׁ מִמֶּנּוּ
  choice: memohon kepada-Nya
  rationale: בקש dapat berarti mencari atau meminta. Dalam konteks doa kepada Allah, “memohon kepada-Nya” menyampaikan ketergantungan dan maksud permohonan dengan bahasa Indonesia yang wajar.
- source_word: דֶּרֶךְ יְשָׁרָה
  choice: jalan yang lurus
  rationale: Pilihan ini mempertahankan gambaran harfiah Ibrani dan tidak mempersempit artinya hanya menjadi perjalanan yang aman; ungkapan itu juga dapat menyiratkan arah atau jalan yang benar.
- source_word: לָנוּ וּלְטַפֵּנוּ וּלְכָל רְכוּשֵׁנוּ
  choice: bagi kami, anak-anak kami, dan segala harta milik kami
  rationale: טף menunjuk terutama pada anak-anak kecil atau anggota rombongan yang masih kecil, sedangkan רְכוּשׁ menunjuk pada barang atau kekayaan milik mereka. Susunan ini jelas dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna idiom puasa לְהִתְעַנּוֹת
  choice: supaya kami merendahkan diri di hadapan Allah kami
  alternative: supaya kami menindas diri di hadapan Allah kami; supaya kami menyangkal diri di hadapan Allah kami
  rationale: Terjemahan utama mengungkapkan sikap rendah hati dan penyangkalan diri yang terkait dengan puasa, tanpa mengesankan tindakan mencederai diri. Catatan kaki mempertahankan kekuatan idiom Ibraninya.
- issue: Cakupan makna דֶּרֶךְ יְשָׁרָה
  choice: jalan yang lurus
  alternative: jalan yang benar; perjalanan yang aman
  rationale: Teks dapat mengacu secara konkret pada perjalanan yang selamat sekaligus secara lebih luas pada tuntunan yang benar. Metafora “jalan yang lurus” mempertahankan ketegangan makna tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Struktur kalimat dibuat lancar bagi pembaca umum, sementara metafora “jalan yang lurus” dan idiom perendahan diri tetap dijaga. Penanda catatan kaki ditempatkan langsung pada frasa yang dijelaskannya.
