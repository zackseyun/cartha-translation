  yaml_path: translation/ot/ezra/008/004.yaml
  text: 'From the sons of Pahath-moab: Eliehoenai son of Zerahiah[a], and with him two hundred males.'
translation:
  language: id
  text: 'Dari keturunan Pahat-Moab: Elyehoenai anak Zerahya, dan beserta dia dua ratus laki-laki[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang laki-laki.” Teks Ibrani secara khusus menyebut “laki-laki”, sehingga menekankan jenis kelamin, bukan memakai istilah umum untuk orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: Dari keturunan
  rationale: Dalam konteks daftar silsilah dan rombongan, בְּנֵי menunjuk kepada anggota garis keluarga atau kaum, bukan semata-mata anak kandung; bentuk מִן dipertahankan dengan “dari”.
- source_word: פַּחַת מוֹאָב
  choice: Pahat-Moab
  rationale: Nama keluarga atau kaum ini ditransliterasikan, bukan diterjemahkan; tanda hubung menunjukkan kesatuannya sebagai nama majemuk.
- source_word: אֶלְיְהוֹעֵינַי
  choice: Elyoenai
  rationale: Transliterasi Indonesia ini mengikuti bunyi Ibrani secara wajar dan mempertahankan unsur yo dari יהו tanpa bentuk ejaan Inggris.
- source_word: בֶּן זְרַחְיָה
  choice: anak Zerahya
  rationale: בֶּן menyatakan hubungan keturunan langsung; “anak” alami dalam daftar nama Indonesia, sedangkan Zerahya mencerminkan bentuk Ibrani זְרַחְיָה.
- source_word: וְעִמּוֹ
  choice: dan bersama dia
  rationale: Mempertahankan konjungsi וְ serta frasa pendamping עִמּוֹ dengan susunan Indonesia yang jelas.
- source_word: מָאתַיִם
  choice: dua ratus
  rationale: Padanan langsung untuk bilangan kardinal Ibrani.
- source_word: הַזְּכָרִים
  choice: laki-laki
  rationale: Istilah זָכָר secara khusus menandai jenis kelamin laki-laki. “Laki-laki” lebih alami dan bermartabat dalam bahasa Indonesia daripada “jantan”, sambil tetap mempertahankan kekhususan tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan sesuai gaya daftar silsilah. “Keturunan” dipilih agar makna kelompok keluarga jelas bagi pembaca modern. Semua nama ditransliterasikan langsung dari bentuk Ibrani, bukan mengikuti ejaan Inggris.
