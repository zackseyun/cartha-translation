  yaml_path: translation/ot/ezra/008/012.yaml
  text: 'And from the sons of Azgad: Johanan son of Hakkatan[b][a], and with him 110 males.'
translation:
  language: id
  text: 'Dari keturunan Azgad: Yohanan anak Hakatan[a], dan bersama dia 110 laki-laki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “anak yang lebih muda”, jika הַקָּטָן dipahami sebagai keterangan, bukan sebagai nama Hakatan.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Dari keturunan
  rationale: Dalam daftar silsilah ini, בְּנֵי menunjuk pada kelompok keluarga atau garis keturunan, bukan hanya anak kandung. 'Keturunan' menyampaikan maksud tersebut secara alami dalam bahasa Indonesia; waw penghubung tidak perlu ditampilkan sebagai 'dan' karena ayat ini berupa lanjutan daftar.
- source_word: עַזְגָּד
  choice: Azgad
  rationale: Nama diri atau nama keluarga ditransliterasikan ke bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: יוֹחָנָן
  choice: Yohanan
  rationale: Transliterasi nama Ibrani yang lazim dan mudah dikenali pembaca Indonesia.
- source_word: בֶּן הַ/קָּטָן
  choice: anak Hakatan[a]
  rationale: Dalam konteks daftar nama, הַקָּטָן paling mungkin berfungsi sebagai nama diri. Namun, kemungkinan bahwa ungkapan itu bersifat deskriptif tetap dicatat dalam catatan kaki.
- source_word: וְ/עִמּוֹ
  choice: dan bersama dia
  rationale: Mempertahankan formula daftar Ibrani yang menghubungkan pemimpin rombongan dengan jumlah orang yang menyertainya.
- source_word: מֵאָה וַ/עֲשָׂרָה
  choice: '110'
  rationale: Angka ditulis dengan digit agar ringkas dan mudah dibaca dalam daftar.
- source_word: הַ/זְּכָרִים
  choice: laki-laki
  rationale: Istilah זְכָרִים secara khusus menandai jenis kelamin laki-laki dan tidak dengan sendirinya membatasi kelompok itu pada orang dewasa.
theological_decisions: []
translation_notes:
  register: Bahasa daftar dibuat ringkas, alami, dan bermartabat. 'Keturunan' dipilih daripada terjemahan harfiah 'anak-anak' agar cakupan garis keluarga dalam konteks ini jelas. Semua nama ditampilkan dalam bentuk transliterasi Indonesia yang lazim.
