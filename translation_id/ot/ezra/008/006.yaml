  text: וּ/מִ/בְּנֵ֣י עָדִ֔ין עֶ֖בֶד בֶּן יוֹנָתָ֑ן וְ/עִמּ֖/וֹ חֲמִשִּׁ֥ים הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/006.yaml
  text: 'And from the sons of Adin: Ebed son of Jonathan[a], and with him fifty males.'
translation:
  language: id
  text: 'Dan dari keturunan Adin: Ebed anak Yonatan, dan bersama dia lima puluh orang laki-laki.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “lima puluh pria.” Kata Ibraninya secara khusus menunjuk kepada orang berjenis kelamin laki-laki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Dan dari keturunan
  rationale: Bentuk ini mempertahankan kata penghubung dan asal kelompok, sementara “keturunan” lebih alami daripada “anak-anak lelaki” untuk menyebut kaum atau garis keluarga dalam daftar silsilah.
- source_word: עָדִין
  choice: Adin
  rationale: Nama diri ditransliterasikan ke dalam bentuk yang wajar dalam bahasa Indonesia.
- source_word: עֶבֶד
  choice: Ebed
  rationale: Di sini עֶבֶד adalah nama orang, bukan nomina umum yang berarti “hamba”; bentuk “Ebed” mencerminkan nama Ibraninya.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rumusan silsilah Indonesia, “anak” menyampaikan hubungan yang dinyatakan oleh בֶּן secara ringkas dan alami.
- source_word: יוֹנָתָן
  choice: Yonatan
  rationale: Transliterasi baku bahasa Indonesia untuk nama Ibrani יוֹנָתָן.
- source_word: וְ/עִמּוֹ
  choice: dan bersama dia
  rationale: Mempertahankan kata penghubung serta keterangan bahwa jumlah berikut menyertai tokoh yang disebutkan.
- source_word: חֲמִשִּׁים
  choice: lima puluh
  rationale: Padanan langsung untuk bilangan kardinal Ibrani.
- source_word: הַזְּכָרִים
  choice: orang laki-laki
  rationale: Ungkapan ini mempertahankan makna khusus jenis kelamin dari זְכָרִים, namun tetap alami dan bermartabat dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa daftar dibuat ringkas, formal, dan alami. “Keturunan” dipilih untuk kelompok keluarga, sedangkan “orang laki-laki” mempertahankan kekhususan leksikal teks Ibrani. Penanda catatan kaki ditempatkan sesudah frasa yang dijelaskannya.
