  yaml_path: translation/ot/ezra/008/014.yaml
  text: 'And from the sons of Bigvai: Uthai and Zabbud[b][a], and with them seventy males.'
translation:
  language: id
  text: 'Dan dari keturunan Bigwai: Utai dan Zabud[b]; bersama dia[a] ada tujuh puluh laki-laki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “bersama dia” dalam bentuk tunggal, meskipun dua nama disebutkan. Sejumlah terjemahan menghaluskannya menjadi “bersama mereka”.
    reason: lexical_alternative
  - marker: b
    text: Beberapa tradisi teks dan versi kuno mencerminkan nama kedua yang berbeda di sini; Teks Masoret berbunyi “Zabud”.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Dan dari keturunan
  rationale: Ungkapan מִן + בְּנֵי memperkenalkan kelompok keluarga berikutnya dalam daftar. “Keturunan” menyampaikan cakupan genealogis yang dapat melampaui anak kandung langsung, sedangkan וּ diterjemahkan “Dan” untuk mempertahankan kesinambungan daftar.
- source_word: בִגְוַי
  choice: Bigwai
  rationale: Nama diri atau nama keluarga ditransliterasikan sesuai ejaan Indonesia; ו direpresentasikan dengan “w”.
- source_word: עוּתַי
  choice: Utai
  rationale: Nama diri ditransliterasikan secara wajar dalam bahasa Indonesia.
- source_word: ו/זבוד
  choice: dan Zabud
  rationale: Teks Masoret berbunyi זבוד, sehingga nama itu ditransliterasikan “Zabud”; prefiks ו diterjemahkan “dan”.
- source_word: וְ/עִמּ/וֹ
  choice: bersama dia
  rationale: Sufiks orang ketiga maskulin tunggal pada עִמּוֹ secara harfiah berarti “bersama dia”. Bentuk tunggal dipertahankan agar kejanggalan yang nyata dalam teks Ibrani tidak disamarkan.
- source_word: שִׁבְעִים
  choice: tujuh puluh
  rationale: Padanan langsung untuk bilangan kardinal שִׁבְעִים.
- source_word: הַ/זְּכָרִים
  choice: laki-laki
  rationale: זְכָרִים secara khusus menunjuk orang berjenis kelamin laki-laki. “Laki-laki” tepat dan alami dalam konteks daftar rombongan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan sesuai gaya daftar silsilah. “Keturunan” dipilih daripada “anak-anak” agar pembaca modern tidak membatasi maknanya pada putra langsung. Tanda titik koma memisahkan nama para pemimpin dari jumlah rombongan tanpa menghilangkan bentuk tunggal “dia” yang terdapat dalam sumber.
