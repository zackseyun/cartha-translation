  variant: modern standard Indonesian
source:
  edition: WLC
  text: וָ/אֶשְׁלְחָ֡/ה לֶ/אֱלִיעֶ֡זֶר לַ/אֲרִיאֵ֡ל לִֽ֠/שְׁמַעְיָה וּ/לְ/אֶלְנָתָ֨ן וּ/לְ/יָרִ֜יב וּ/לְ/אֶלְנָתָ֧ן וּ/לְ/נָתָ֛ן וְ/לִ/זְכַרְיָ֥ה וְ/לִ/מְשֻׁלָּ֖ם רָאשִׁ֑ים וּ/לְ/יוֹיָרִ֥יב וּ/לְ/אֶלְנָתָ֖ן מְבִינִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/016.yaml
  text: Then I sent for Eliezer[a], Ariel, Shemaiah, Elnathan, Jarib, Elnathan, Nathan, Zechariah, and Meshullam, heads, and for Joiarib and Elnathan[b], men of understanding.
translation:
  language: id
  text: Lalu aku menyuruh orang memanggil Eliezer, Ariel, Semaya, Elnatan, Yarib, Elnatan, Natan, Zakharia, dan Mesulam, para pemimpin[a], serta Yoyarib dan Elnatan, orang-orang yang berpengertian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kepala-kepala”; dapat juga diterjemahkan “orang-orang terkemuka”.'
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “orang-orang yang berwawasan” atau “orang-orang terpelajar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלְחָה
  choice: Lalu aku menyuruh orang memanggil
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. Dalam konteks ini, tindakan itu bertujuan menghadirkan orang-orang yang disebut; ungkapan Indonesia ini menyampaikan makna idiomatis 'mengirim untuk memanggil' dengan wajar.
- source_word: לֶאֱלִיעֶזֶר ... וּלְאֶלְנָתָן
  choice: Eliezer ... serta ... Elnatan
  rationale: Pengulangan ל menandai orang-orang yang menjadi sasaran panggilan. Dalam susunan Indonesia, hubungan itu sudah dinyatakan oleh 'memanggil' sehingga preposisinya tidak perlu diulang.
- source_word: רָאשִׁים
  choice: para pemimpin
  rationale: Secara harfiah berarti 'kepala-kepala', tetapi di sini menunjuk kepada orang-orang yang berkedudukan utama. 'Para pemimpin' jelas dan alami dalam bahasa Indonesia, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: מְבִינִים
  choice: orang-orang yang berpengertian
  rationale: Partisip dari בין menggambarkan orang yang memahami atau mampu membedakan dengan baik. Pilihan ini mempertahankan keluasan maknanya tanpa menetapkan jabatan khusus seperti 'pengajar'.
- source_word: וּלְיוֹיָרִיב וּלְאֶלְנָתָן מְבִינִים
  choice: serta Yoyarib dan Elnatan, orang-orang yang berpengertian
  rationale: Frasa aposisional terakhir paling wajar menerangkan dua nama terakhir dan membedakan mereka dari kelompok sebelumnya yang disebut para pemimpin.
- source_word: יוֹיָרִיב
  choice: Yoyarib
  rationale: Transliterasi ini mengikuti bunyi bentuk Ibrani יוֹיָרִיב dan pola ejaan nama yang wajar dalam bahasa Indonesia.
- source_word: אֶלְנָתָן
  choice: Elnatan
  rationale: Nama ini muncul tiga kali dan dipertahankan pada setiap kemunculannya karena teks sumber mungkin menunjuk kepada beberapa orang berbeda dengan nama yang sama.
theological_decisions: []
