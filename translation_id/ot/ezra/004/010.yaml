translation_notes:
  register: Bahasa Indonesia baku modern dengan nada resmi yang sesuai dengan surat administratif kerajaan. Susunan dibuat alami tanpa menghilangkan bentuk tunggal 'kota Samaria', nama Aram Osnapar, atau ketidakpastian formula penutup-pembuka surat.
