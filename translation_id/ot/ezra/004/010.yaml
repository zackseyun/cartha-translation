  text: וּ/שְׁאָ֣ר אֻמַּיָּ֗/א דִּ֤י הַגְלִי֙ אָסְנַפַּר֙ רַבָּ֣/א וְ/יַקִּירָ֔/א וְ/הוֹתֵ֣ב הִמּ֔וֹ בְּ/קִרְיָ֖ה דִּ֣י שָׁמְרָ֑יִן וּ/שְׁאָ֥ר עֲבַֽר נַהֲרָ֖/ה וּ/כְעֶֽנֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/010.yaml
  text: 'and the rest of the peoples whom the great and noble Osnappar deported and settled in the city of Samaria[c][b][a], and in the rest of Beyond the River—and now:'
translation:
  language: id
  text: dan bangsa-bangsa lainnya yang dibuang oleh Osnapar yang agung dan mulia, dan ditempatkannya di kota Samaria[a], serta orang-orang lainnya di Seberang Sungai[b]. Dan sekarang:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Osnapar sering diidentifikasikan dengan Asyurbanipal, raja Asyur, tetapi terjemahan ini mempertahankan bentuk nama Aram yang terdapat dalam teks.
    reason: cross_reference
  - marker: b
    text: Secara harfiah, “di seberang Sungai.” “Seberang Sungai” adalah istilah administratif Persia bagi wilayah di sebelah barat Sungai Efrat.
    reason: cultural_note
  - marker: c
    text: Ungkapan terakhir ini adalah formula surat dalam bahasa Aram; terjemahan lain yang mungkin ialah “dan seterusnya” atau “pada waktu itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָר אֻמַּיָּא
  choice: suku-suku bangsa lainnya
  rationale: Ungkapan ini menunjuk kepada kelompok-kelompok penduduk lain yang tersisa dalam daftar. Pilihan ini mempertahankan makna kolektif-etnis dan terdengar alami dalam bahasa Indonesia.
- source_word: הַגְלִי
  choice: telah dibuang
  rationale: Kata kerja ini menyatakan pemindahan paksa ke pembuangan oleh kekuasaan kekaisaran. 'Dibuang' sesuai dengan istilah Alkitab Indonesia dan tetap mudah dipahami.
- source_word: אָסְנַפַּר
  choice: Osnapar
  rationale: Nama Aram dalam teks dipertahankan melalui transliterasi Indonesia, tanpa menggantinya dengan identifikasi historis yang masih merupakan kesimpulan di luar teks.
- source_word: רַבָּא וְיַקִּירָא
  choice: yang agung dan mulia
  rationale: Kedua kata sifat merupakan gelar kehormatan dan mempertahankan nada resmi surat tersebut.
- source_word: וְהוֹתֵב הִמּוֹ
  choice: lalu ditempatkannya
  rationale: Bentuk kausatif menyatakan bahwa Osnapar menempatkan atau memukimkan orang-orang itu. Bentuk ini menjaga hubungan pelaku dan tindakan secara ringkas.
- source_word: בְּקִרְיָה דִּי שָׁמְרָיִן
  choice: di kota Samaria
  rationale: Teks Aram memakai bentuk tunggal 'kota', sehingga tidak diperhalus menjadi bentuk jamak meskipun sejumlah tradisi terjemahan memakai 'kota-kota'.
- source_word: וּשְׁאָר עֲבַר נַהֲרָה
  choice: dan di wilayah lain di Seberang Sungai
  rationale: '''Seberang Sungai'' dipertahankan sebagai nama wilayah administratif Persia. Penambahan ''wilayah'' membuat hubungan sintaksisnya jelas dalam bahasa Indonesia tanpa mengubah acuannya.'
- source_word: וּכְעֶנֶת
  choice: 'Dan sekarang:'
  rationale: Ungkapan ini berfungsi sebagai formula surat Aram yang mengantar isi pokok surat. Tanda titik dua memperjelas fungsi peralihannya.
