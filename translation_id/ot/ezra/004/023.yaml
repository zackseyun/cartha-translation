translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif resmi dipertahankan tanpa menjadi kaku; “sang juru tulis” memperjelas bahwa gelar tersebut terutama menerangkan Simsai.
