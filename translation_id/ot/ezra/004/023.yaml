  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֱדַ֗יִן מִן דִּ֞י פַּרְשֶׁ֤גֶן נִשְׁתְּוָנָ/א֙ דִּ֚י ארתחששתא מַלְכָּ֔/א קֱרִ֧י קֳדָם רְח֛וּם וְ/שִׁמְשַׁ֥י סָפְרָ֖/א וּ/כְנָוָתְ/ה֑וֹן אֲזַ֨לוּ בִ/בְהִיל֤וּ לִ/ירֽוּשְׁלֶם֙ עַל יְה֣וּדָיֵ֔/א וּ/בַטִּ֥לוּ הִמּ֖וֹ בְּ/אֶדְרָ֥ע וְ/חָֽיִל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/023.yaml
  text: Then[a], as soon as the copy of the letter of King Artaxerxes was read before Rehum and Shimshai the scribe and their associates, they went in haste to Jerusalem, to the Jews[b], and made them stop by force and power.
translation:
  language: id
  text: Kemudian, segera setelah salinan surat Raja Artahsasta dibacakan di hadapan Rehum, Simsai, sang juru tulis, dan rekan-rekan mereka, mereka bergegas ke Yerusalem, mendatangi orang-orang Yahudi[a], dan memaksa mereka berhenti dengan kekerasan dan kekuatan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melawan orang-orang Yahudi.” Kata depan Aramnya dapat menyatakan gerakan yang bermusuhan, sesuai dengan tindakan paksa yang menyusul.
    reason: lexical_alternative
  - marker: b
    text: Atau “menghentikan mereka dengan paksa dan dengan kekuatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Kemudian
  rationale: Kata keterangan wacana Aram ini menandai peristiwa berikutnya dalam urutan narasi; “Kemudian” alami dalam bahasa Indonesia modern.
- source_word: פַּרְשֶׁגֶן נִשְׁתְּוָנָא
  choice: salinan surat
  rationale: פַּרְשֶׁגֶן menunjuk pada salinan atau transkrip, sedangkan נִשְׁתְּוָנָא adalah surat atau dokumen resmi.
- source_word: קֱרִי קֳדָם
  choice: dibacakan di hadapan
  rationale: Bentuk ini menyatakan bahwa dokumen tersebut dibaca dalam kehadiran para pejabat; “dibacakan di hadapan” mempertahankan nilai pasif dan nuansa resmi.
- source_word: רְחוּם וְשִׁמְשַׁי סָפְרָא וּכְנָוָתְהוֹן
  choice: Rehum, Simsai sang juru tulis, dan rekan-rekan mereka
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia. סָפְרָא dapat berarti juru tulis atau sekretaris; “juru tulis” mempertahankan gelar secara transparan, dan כְנָוָתְהוֹן berarti para rekan mereka.
- source_word: אֲזַלוּ בִבְהִילוּ
  choice: mereka bergegas pergi
  rationale: Gabungan verba gerak dan nomina yang menyatakan ketergesa-gesaan menekankan baik gerakan maupun urgensinya.
- source_word: עַל יְהוּדָיֵא
  choice: untuk mendatangi orang-orang Yahudi
  rationale: עַל sesudah verba gerak dapat berarti menuju atau bergerak melawan seseorang. Teks utama memakai ungkapan Indonesia yang alami, sementara kemungkinan nuansa bermusuhan dipertahankan dalam catatan kaki dan diperjelas oleh tindakan paksa berikutnya.
- source_word: וּבַטִּלוּ הִמּוֹ
  choice: memaksa mereka berhenti
  rationale: Bentuk kausatif menyatakan bahwa para pejabat menyebabkan orang-orang Yahudi berhenti. Ungkapan ini jelas dan tidak perlu menyisipkan objek “pekerjaan” yang tidak dinyatakan secara eksplisit dalam ayat.
- source_word: בְּאֶדְרָע וְחָיִל
  choice: dengan kekerasan dan kekuatan
  rationale: Ungkapan ini menggambarkan penghentian melalui paksaan dan penggunaan kuasa, bukan melalui bujukan atau prosedur damai.
