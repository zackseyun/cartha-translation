  text: כְּעַ֗ן יְדִ֨יעַ֙ לֶהֱוֵ֣א לְ/מַלְכָּ֔/א דִּ֠י הֵ֣ן קִרְיְתָ֥/א דָךְ֙ תִּתְבְּנֵ֔א וְ/שׁוּרַיָּ֖/ה יִֽשְׁתַּכְלְל֑וּן מִנְדָּֽה בְל֤וֹ וַ/הֲלָךְ֙ לָ֣א יִנְתְּנ֔וּן וְ/אַפְּתֹ֥ם מַלְכִ֖ים תְּהַנְזִֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/013.yaml
  text: Now let it be known to the king that if this city is rebuilt and its walls are completed, they will not pay tribute, tax, or toll, and in the end it will damage the revenue of the kings.
translation:
  language: id
  text: Sekarang, hendaklah raja mengetahui bahwa jika kota ini dibangun kembali dan tembok-temboknya diselesaikan, penduduknya tidak akan membayar upeti, pajak, atau bea, dan pada akhirnya hal itu akan merugikan pendapatan raja-raja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan akhirnya hal itu akan mendatangkan kerugian kepada raja-raja.” Ungkapan bahasa Aramnya ringkas; bahwa kerugian itu menyangkut pendapatan disimpulkan dari konteks upeti, pajak, dan bea yang tidak dibayar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: Sekarang
  rationale: Kata keterangan wacana bahasa Aram ini mengantar peringatan atau kesimpulan. “Sekarang” mempertahankan daya peralihannya tanpa menjadikannya hubungan sebab-akibat yang terlalu tegas.
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: hendaklah raja mengetahui
  rationale: Ungkapan ini merupakan formula resmi dalam surat-menyurat bahasa Aram Kekaisaran. Bentuk ini terdengar formal dan alami dalam bahasa Indonesia modern.
- source_word: דִּי הֵן
  choice: bahwa jika
  rationale: Gabungan ini memperkenalkan isi pemberitahuan dalam bentuk syarat.
- source_word: קִרְיְתָא דָךְ
  choice: kota ini
  rationale: Demonstrativa tersebut menunjuk kepada Yerusalem dari sudut pandang para penulis surat.
- source_word: תִּתְבְּנֵא
  choice: dibangun kembali
  rationale: Dalam konteks kota yang pernah dihancurkan, verba pasif ini secara wajar menyatakan pembangunan kembali.
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: dan tembok-temboknya diselesaikan
  rationale: Verba ini menyatakan bahwa pekerjaan dibawa sampai selesai; sufiks kepemilikan diperjelas secara alami dalam bahasa Indonesia.
- source_word: מִנְדָּה בְלוֹ וַהֲלָךְ
  choice: upeti, pajak, atau bea
  rationale: Tiga istilah administratif Persia ini menunjuk pada pungutan yang berbeda. Pilihan ini mempertahankan tiga unsur tersebut dengan istilah fiskal Indonesia yang mudah dipahami.
- source_word: לָא יִנְתְּנוּן
  choice: penduduknya tidak akan membayar
  rationale: Secara harfiah berarti “tidak akan memberikan”, tetapi dalam konteks pungutan, “membayar” adalah padanan idiomatis. Subjek jamak yang tersirat dibuat sebagai “penduduknya” agar rujukannya jelas.
- source_word: וְאַפְּתֹם מַלְכִים תְּהַנְזִק
  choice: dan pada akhirnya hal itu akan merugikan pendapatan raja-raja
  rationale: Terjemahan ini mengikuti konteks hilangnya penerimaan fiskal, sambil mempertahankan bentuk jamak “raja-raja”. Karena ungkapan Aramnya ringkas dan nuansanya tidak sepenuhnya pasti, alternatif yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Sifat kerugian yang diperingatkan
  choice: Merugikan pendapatan raja-raja
  alternative: Mendatangkan kerugian kepada raja-raja
  rationale: Konteks langsung membahas upeti, pajak, dan bea, sehingga kerugian fiskal paling mungkin dimaksud. Namun, teks tidak boleh diperlakukan seolah-olah nuansa administratifnya sepenuhnya pasti.
translation_notes:
  register: Bahasa resmi dan bermartabat dipertahankan sesuai bentuk surat kepada raja, tetapi susunannya dibuat alami bagi pembaca Indonesia masa kini. Istilah fiskal dibedakan tanpa memakai kosakata teknis yang terlalu sempit.
