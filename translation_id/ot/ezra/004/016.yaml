  text: מְהוֹדְעִ֤ין אֲנַ֨חְנָה֙ לְ/מַלְכָּ֔/א דִּ֠י הֵ֣ן קִרְיְתָ֥/א דָךְ֙ תִּתְבְּנֵ֔א וְ/שׁוּרַיָּ֖/ה יִֽשְׁתַּכְלְל֑וּן לָ/קֳבֵ֣ל דְּנָ֔ה חֲלָק֙ בַּ/עֲבַ֣ר נַהֲרָ֔/א לָ֥א אִיתַ֖י לָֽ/ךְ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/016.yaml
  text: We make known to the king that if this city is rebuilt and its walls are completed[b][a], then because of this you will have no possession in the province Beyond the River.
translation:
  language: id
  text: Kami memberitahukan kepada raja bahwa jika kota ini dibangun kembali dan tembok-temboknya diselesaikan, maka karena hal itu raja tidak akan mempunyai bagian[a] di Seberang Sungai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata bahasa Aram yang diterjemahkan “bagian” juga dapat berarti “jatah” atau, secara lebih khusus dalam konteks ini, “pendapatan.”
    reason: lexical_alternative
  - marker: b
    text: “Seberang Sungai” adalah nama resmi Persia untuk wilayah di sebelah barat Sungai Efrat.
    reason: cultural_note
lexical_decisions:
- source_word: מְהוֹדְעִין אֲנַחְנָה
  choice: Kami memberitahukan
  rationale: Partisipel bahasa Aram berfungsi secara verbal dalam gaya surat resmi. Ungkapan ini alami dalam bahasa Indonesia sekaligus mempertahankan nada formal.
- source_word: לְמַלְכָּא ... לָךְ
  choice: kepada Raja ... Raja tidak akan mempunyai
  rationale: Preposisi menandai penerima pemberitahuan, sedangkan konstruksi eksistensial dengan datif menyatakan kepunyaan. Pengulangan 'Raja' menjaga sapaan resmi dan menghindari peralihan yang janggal ke 'engkau'.
- source_word: דִּי הֵן
  choice: bahwa jika
  rationale: Gabungan partikel ini memperkenalkan isi laporan sebagai syarat; 'bahwa jika' menyampaikan hubungan tersebut secara wajar.
- source_word: קִרְיְתָא דָךְ
  choice: kota ini
  rationale: Kata tunjuk bahasa Aram menunjuk kota yang sedang dibicarakan, yaitu Yerusalem, tanpa perlu menyebut namanya dalam ayat ini.
- source_word: תִּתְבְּנֵא
  choice: dibangun kembali
  rationale: Bentuk pasif imperfek berada dalam syarat yang berorientasi ke masa depan. Konteks pemulihan Yerusalem mendukung makna pembangunan kembali.
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: dan tembok-temboknya diselesaikan
  rationale: Bentuk jamak merujuk pada pertahanan kota, dan verba menyatakan bahwa pekerjaan itu dibawa sampai selesai.
- source_word: לָקֳבֵל דְּנָה
  choice: maka karena hal itu
  rationale: Ungkapan ini menarik akibat dari syarat sebelumnya; terjemahan mempertahankan baik hubungan konsekuensial maupun unsur penunjuknya.
- source_word: חֲלָק
  choice: bagian
  rationale: Pilihan ini mempertahankan arti dasar 'bagian/jatah' dan tidak mempersempitnya menjadi pendapatan atau pajak, meskipun nuansa administratif-ekonomis mungkin dimaksudkan.
- source_word: בַּעֲבַר נַהֲרָא
  choice: di Seberang Sungai
  rationale: Frasa ini adalah nama wilayah administratif Persia di sebelah barat Sungai Efrat. Terjemahan tidak menambahkan kata 'provinsi' ke dalam teks utama.
- source_word: לָא אִיתַי לָךְ
  choice: Raja tidak akan mempunyai
  rationale: Konstruksi eksistensial dengan datif menyatakan kepunyaan; bentuk mendatang sesuai dengan akibat dari syarat yang disebutkan.
theological_decisions: []
translation_notes:
  register: Bahasa surat resmi yang modern dan bermartabat dipertahankan tanpa menjadi kaku. Sebutan “Raja” diulang sebagai bentuk sapaan hormat dan untuk mencerminkan peralihan sumber dari penyebutan raja kepada orang kedua. Ambiguitas administratif-ekonomis חֲלָק dipertahankan melalui “bagian” dan dijelaskan dalam catatan kaki.
