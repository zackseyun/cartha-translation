id: EZR.4.12
reference: Ezra 4:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְדִ֨יעַ֙ לֶהֱוֵ֣א לְ/מַלְכָּ֔/א דִּ֣י יְהוּדָיֵ֗/א דִּ֤י סְלִ֨קוּ֙ מִן לְוָתָ֔/ךְ עֲלֶ֥י/נָא אֲת֖וֹ לִ/ירוּשְׁלֶ֑ם קִרְיְתָ֨/א מָֽרָדְתָּ֤/א ו/באישת/א בָּנַ֔יִן ו/שורי אשכללו וְ/אֻשַּׁיָּ֖/א יַחִֽיטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/012.yaml
  text: Let it be known to the king that the Jews who came up from you to us have come to Jerusalem[a]. They are rebuilding the rebellious and wicked city[b], finishing the walls and repairing the foundations.
translation:
  language: id
  text: Hendaklah raja mengetahui bahwa orang-orang Yahudi[a] yang datang dari hadapan Tuanku ke tempat kami telah tiba di Yerusalem. Mereka sedang membangun kembali kota yang durhaka dan jahat itu; tembok-temboknya telah mereka rampungkan, dan fondasi-fondasinya sedang mereka perbaiki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Yudea.” Istilah Aramnya dapat menunjuk kepada penduduk Yehuda/Yudea maupun kepada orang Yahudi secara lebih luas.
    reason: lexical_alternative
  - marker: b
    text: Atau “sedang mereka letakkan.” Ungkapan Aramnya agak sulit dan dapat merujuk pada perbaikan fondasi yang sudah ada atau pada peletakan fondasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: Hendaklah raja mengetahui
  rationale: Menyampaikan formula resmi surat berbahasa Aram dengan bahasa Indonesia yang alami dan tetap bernada formal.
- source_word: יְהוּדָיֵא
  choice: orang-orang Yahudi
  rationale: Sebutan ini dapat berarti orang Yahudi secara etnis maupun orang Yudea; bentuk yang dipilih paling lazim dipahami dalam bahasa Indonesia, sedangkan alternatifnya dicatat dalam catatan kaki.
- source_word: סְלִקוּ מִן לְוָתָךְ עֲלֶינָא
  choice: datang dari hadapan Tuanku ke tempat kami
  rationale: Mempertahankan arah gerak dari lingkungan raja menuju para penulis serta sapaan hormat yang sesuai dengan konteks surat kerajaan.
- source_word: אֲתוֹ לִירוּשְׁלֶם
  choice: telah tiba di Yerusalem
  rationale: Menerjemahkan verba kedatangan kedua secara khusus dan membedakannya dari gerak sebelumnya.
- source_word: קִרְיְתָא מָרָדְתָּא וּבִאישְׁתָּא
  choice: kota yang durhaka dan jahat itu
  rationale: Mempertahankan nada tuduhan politis dan moral para penulis tanpa melunakkannya.
- source_word: בָּנַיִן
  choice: sedang membangun kembali
  rationale: Bentuk partisip menunjukkan kegiatan yang berlangsung; 'kembali' sesuai dengan pemulihan kota yang sudah pernah berdiri.
- source_word: וְשׁוּרַיָּא אֶשְׁכְּלָלוּ
  choice: tembok-temboknya telah mereka rampungkan
  rationale: Mencerminkan bentuk verbal yang menyatakan penyelesaian dan mempertahankan perbedaan aspek dengan kegiatan membangun yang sedang berlangsung.
- source_word: וְאֻשַּׁיָּא יַחִיטוּ
  choice: fondasi-fondasinya sedang mereka perbaiki
  rationale: Ungkapan Aramnya sulit; dalam konteks pemulihan kota, 'memperbaiki' merupakan pilihan alami, sementara kemungkinan 'meletakkan' dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada resmi sebuah surat kepada raja. Sapaan “Tuanku” menjaga kesantunan istana, sedangkan susunan klausa mempertahankan perbedaan aspek verbal dalam sumber Aram.
