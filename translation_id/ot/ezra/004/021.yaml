base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/021.yaml
  text: Now issue a decree to make these men stop[b][a], and this city shall not be rebuilt until a decree is issued by me.
translation:
  language: id
  text: Sekarang, keluarkanlah perintah untuk menghentikan orang-orang ini, dan kota ini tidak boleh dibangun kembali sampai aku mengeluarkan perintah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sampai suatu perintah ditetapkan dariku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: Sekarang
  rationale: Adverbia Aram ini memperkenalkan perintah raja yang harus segera dilaksanakan; “Sekarang” alami dan tidak menambahkan hubungan logis yang tidak pasti.
- source_word: שִׂימוּ טְּעֵם
  choice: keluarkanlah perintah
  rationale: Ungkapan harfiahnya berarti “tetapkan keputusan/perintah.” Dalam konteks administrasi kerajaan, “keluarkanlah perintah” merupakan ungkapan Indonesia yang wajar dan berwibawa.
- source_word: לְבַטָּלָא גֻּבְרַיָּא אִלֵּךְ
  choice: untuk menghentikan orang-orang ini
  rationale: Bentuk infinitif menyatakan tindakan membuat kegiatan mereka berhenti. “Orang-orang ini” mempertahankan rujukan kepada kelompok tertentu tanpa membuat bahasa Indonesia terasa kaku.
- source_word: וְקִרְיְתָא דָךְ לָא תִתְבְּנֵא
  choice: dan kota ini tidak boleh dibangun kembali
  rationale: Terjemahan ini mempertahankan penghubung, bentuk pasif, dan larangan administratif dalam teks Aram.
- source_word: עַד מִנִּי טַעְמָא יִתְּשָׂם
  choice: sampai aku mengeluarkan perintah
  rationale: Secara harfiah, “sampai dari aku suatu perintah ditetapkan.” Bentuk aktif dalam bahasa Indonesia lebih alami, sambil tetap menyatakan bahwa wewenang dan perintah berikutnya berasal dari raja.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bernuansa administratif kerajaan. Imperatif “keluarkanlah” mempertahankan wibawa perintah, sedangkan “tidak boleh dibangun kembali” menyampaikan larangan tanpa menjadikannya pernyataan mutlak tentang masa depan.
