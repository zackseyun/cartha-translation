base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/006.yaml
  text: And in the reign of Ahasuerus[a], at the beginning of his reign, they wrote an accusation against the inhabitants of Judah and Jerusalem.
translation:
  language: id
  text: Pada awal pemerintahan Ahasyweros, mereka menulis tuduhan[a] terhadap penduduk Yehuda dan Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengaduan” atau “tuduhan yang bersifat memusuhi”. Kata Ibrani ini mengandung gagasan penentangan yang dinyatakan melalui suatu tuduhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/מַלְכוּת
  choice: Pada masa pemerintahan
  rationale: Gabungan kata depan dengan מַלְכוּת menyatakan latar waktu, yaitu masa seorang raja memerintah. Ungkapan ini alami dalam bahasa Indonesia modern; waw penghubung tidak perlu diterjemahkan tersendiri karena ayat ini berfungsi sebagai kelanjutan narasi.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasyweros
  rationale: Nama Ibrani ditransliterasikan dengan bentuk yang lazim dalam bahasa Indonesia, tanpa menggantinya dengan identifikasi historis “Xerxes”.
- source_word: בִּ/תְחִלַּת מַלְכוּת/וֹ
  choice: pada awal pemerintahannya
  rationale: Frasa konstruksi ini menunjuk pada periode awal kekuasaannya. Bentuk dengan pronomina “-nya” mempertahankan rujukan kepada Ahasyweros.
- source_word: כָּתְבוּ
  choice: mereka menulis
  rationale: Kata kerja ini secara langsung berarti “menulis”. Subjek jamaknya tidak disebutkan secara khusus dalam bahasa Ibrani, sehingga tetap diterjemahkan secara tak tentu sebagai “mereka”.
- source_word: שִׂטְנָה
  choice: tuduhan
  rationale: Nomina ini menyatakan tuduhan atau pengaduan yang bersifat menentang, kemungkinan dalam konteks administratif atau hukum. “Tuduhan” menyampaikan makna utamanya tanpa menetapkan jenis dokumen secara berlebihan.
- source_word: עַל
  choice: terhadap
  rationale: Dalam konteks penulisan tuduhan, preposisi ini menunjukkan pihak yang menjadi sasaran. “Terhadap” alami dan mempertahankan arah permusuhannya.
- source_word: יֹשְׁבֵי יְהוּדָה וִ/ירוּשָׁלִָם
  choice: penduduk Yehuda dan Yerusalem
  rationale: Partisip tersebut berfungsi sebagai nomina dan berarti orang-orang yang tinggal di wilayah-wilayah itu. “Penduduk” ringkas dan wajar dalam bahasa Indonesia.
