id: EZR.4.7
reference: Ezra 4:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בִ/ימֵ֣י אַרְתַּחְשַׁ֗שְׂתָּא כָּתַ֨ב בִּשְׁלָ֜ם מִתְרְדָ֤ת טָֽבְאֵל֙ וּ/שְׁאָ֣ר כנות/ו עַל ארתחששתא מֶ֣לֶךְ פָּרָ֑ס וּ/כְתָב֙ הַֽ/נִּשְׁתְּוָ֔ן כָּת֥וּב אֲרָמִ֖ית וּ/מְתֻרְגָּ֥ם אֲרָמִֽית־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/007.yaml
  text: And in the days of Artaxerxes[a], Bishlam, Mithredath, Tabeel, and the rest of his associates wrote to Artaxerxes king of Persia[b]. The text of the letter was written in Aramaic and translated from Aramaic.
translation:
  language: id
  text: Pada zaman Artahsasta, Bislam, Mitredat, Tabeel, dan rekan-rekannya yang lain[a] menulis kepada Artahsasta, raja Persia. Naskah surat itu ditulis dengan aksara Aram dan diterjemahkan ke dalam bahasa Aram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan rekan-rekan mereka yang lain.” Akhiran pada kata “rekan-rekannya” berbentuk tunggal, tetapi acuannya mungkin bersifat kolektif.
    reason: lexical_alternative
  - marker: b
    text: Atau “Naskah surat itu ditulis dalam bahasa Aram dan diterjemahkan dalam bahasa Aram.” Susunan teks Ibrani-Aram ini sulit. Para penafsir berbeda pendapat apakah yang dibedakan ialah aksara dan bahasa atau penulisan dan penerjemahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי אַרְתַּחְשַׁשְׂתָּא
  choice: Pada zaman Artahsasta
  rationale: Ungkapan waktu Ibrani dipertahankan secara alami dalam bahasa Indonesia, dan nama raja memakai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: כָּתַב
  choice: menulis
  rationale: Kata kerja ini hanya menyatakan tindakan menulis; terjemahan tidak menambahkan bahwa tulisan tersebut berupa tuduhan.
- source_word: בִּשְׁלָם מִתְרְדָת טָבְאֵל
  choice: Bislam, Mitredat, Tabeel
  rationale: Nama-nama pribadi dialihaksarakan dalam bentuk yang wajar dan dikenal oleh pembaca Indonesia.
- source_word: וּשְׁאָר כנותו
  choice: dan rekan-rekannya yang lain
  rationale: שְׁאָר berarti 'yang lain/sisanya', sedangkan kata yang sulit כנותו dipahami sebagai rekan atau kolega. Bentuk akhiran tunggal dipertahankan dalam teks utama, sementara kemungkinan acuan kolektif dicatat.
- source_word: עַל ארתחששתא
  choice: kepada Artahsasta
  rationale: Dalam konteks surat-menyurat administratif, עַל dapat menandai pihak yang dituju. 'Kepada' alami dan tidak menambahkan nuansa permusuhan yang tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: מֶלֶךְ פָּרָס
  choice: raja Persia
  rationale: Gelar ini berfungsi sebagai keterangan aposisi bagi Artahsasta.
- source_word: וּכְתָב הַנִּשְׁתְּוָן
  choice: Naskah surat itu
  rationale: כְתָב menunjuk pada tulisan atau naskah, sedangkan kata pinjaman yang langka נִּשְׁתְּוָן menunjuk pada dokumen tertulis, dalam konteks ini sebuah surat.
- source_word: כָּתוּב אֲרָמִית וּמְתֻרְגָּם אֲרָמִית
  choice: ditulis dengan aksara Aram dan diterjemahkan ke dalam bahasa Aram
  rationale: 'Terjemahan ini menyampaikan salah satu pemahaman utama atas pengulangan אֲרָמִית: bagian pertama mengacu pada sistem tulisan dan bagian kedua pada bahasa. Karena susunan sumber sulit dan dapat ditafsirkan lain, ketidakpastian itu dipertahankan dalam catatan kaki.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat jelas bagi pembaca umum tanpa menambahkan isi dari konteks sekitar. Istilah administratif diterjemahkan secara alami, dan ambiguitas nyata pada frasa penutup serta akhiran kata untuk 'rekan' dijelaskan melalui catatan kaki.
