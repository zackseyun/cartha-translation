  text: בֵּ/אדַ֗יִן בְּטֵלַת֙ עֲבִידַ֣ת בֵּית אֱלָהָ֔/א דִּ֖י בִּ/ירוּשְׁלֶ֑ם וַ/הֲוָת֙ בָּֽטְלָ֔א עַ֚ד שְׁנַ֣ת תַּרְתֵּ֔ין לְ/מַלְכ֖וּת דָּרְיָ֥וֶשׁ מֶֽלֶךְ פָּרָֽס־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/024.yaml
  text: Then the work on the house of God that is in Jerusalem stopped[c][b][a], and it remained stopped until the second year of the reign of Darius king of Persia.
translation:
  language: id
  text: Kemudian pekerjaan pada rumah Allah[b] yang ada di Yerusalem terhenti[a], dan tetap terhenti[c] sampai tahun kedua pemerintahan Darius, raja Persia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berhenti”; akar bahasa Aram בטל menyatakan berhenti atau terhenti.
    reason: lexical_alternative
  - marker: b
    text: Atau “Bait Allah.” Secara harfiah, “rumah Allah.”
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “tetap terhenti” menunjukkan keadaan yang berlangsung terus, bukan sekadar mengulangi bahwa pekerjaan itu berhenti.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Kemudian
  rationale: Kata keterangan wacana bahasa Aram ini menandai kelanjutan peristiwa dari narasi sebelumnya; “Kemudian” alami dalam bahasa Indonesia dan mempertahankan hubungan urutannya.
- source_word: בְּטֵלַת
  choice: terhenti
  rationale: Akar Aram בטל berarti berhenti, terhenti, atau tidak berlangsung lagi. “Terhenti” mempertahankan kemungkinan bahwa pekerjaan itu berhenti karena tindakan pihak lain tanpa menyatakannya secara eksplisit.
- source_word: עֲבִידַת
  choice: pekerjaan
  rationale: Nomina konstruksi ini berarti pekerjaan atau pengerjaan. Konteks menunjukkan proyek pembangunan, tetapi teks tidak secara eksplisit menambahkan kata “pembangunan”.
- source_word: בֵּית אֱלָהָא
  choice: rumah Allah
  rationale: Terjemahan formal frasa konstruksi tersebut; mempertahankan citra sumber, sementara “Bait Allah” atau “kuil Allah” merupakan padanan yang lebih interpretatif.
- source_word: דִּי בִּירוּשְׁלֶם
  choice: yang ada di Yerusalem
  rationale: Partikel relatif diikuti keterangan tempat mengidentifikasi lokasi rumah Allah. Ungkapan ini alami dan tidak menambahkan kontras waktu.
- source_word: וַהֲוָת בָּטְלָא
  choice: dan tetap terhenti
  rationale: Gabungan verba keadaan dengan bentuk dari בטל menyatakan keadaan yang berlanjut, bukan sekadar pengulangan bahwa pekerjaan itu berhenti.
- source_word: עַד שְׁנַת תַּרְתֵּין
  choice: sampai tahun kedua
  rationale: Padanan Indonesia yang lazim bagi penanggalan berdasarkan tahun pemerintahan.
- source_word: לְמַלְכוּת דָּרְיָוֶשׁ
  choice: pemerintahan Darius
  rationale: Frasa ini menunjuk masa atau kekuasaan kerajaan Darius; “pemerintahan Darius” jelas dan alami dalam penanggalan regnal bahasa Indonesia.
- source_word: מֶלֶךְ פָּרָס
  choice: raja Persia
  rationale: Mempertahankan gelar kerajaan yang diletakkan sebagai aposisi bagi Darius.
