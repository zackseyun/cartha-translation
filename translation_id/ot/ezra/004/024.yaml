  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Rumah Allah” dipertahankan untuk kedekatan dengan bentuk Aram, sedangkan catatan kaki memberi padanan idiomatis “Bait Allah”. Penanda catatan ditempatkan tepat setelah unsur yang dijelaskan.
