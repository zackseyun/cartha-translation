  text: דִּ֡י יְבַקַּר֩ בִּֽ/סְפַר דָּכְרָ֨נַיָּ֜/א דִּ֣י אֲבָהָתָ֗/ךְ וּ֠/תְהַשְׁכַּח בִּ/סְפַ֣ר דָּכְרָנַיָּ/א֮ וְ/תִנְדַּע֒ דִּי֩ קִרְיְתָ֨/א דָ֜ךְ קִרְיָ֣א מָֽרָדָ֗א וּֽ/מְהַנְזְקַ֤ת מַלְכִין֙ וּ/מְדִנָ֔ן וְ/אֶשְׁתַּדּוּר֙ עָבְדִ֣ין בְּ/גַוַּ֔/הּ מִן יוֹמָ֖ת עָלְמָ֑/א עַ֨ל דְּנָ֔ה קִרְיְתָ֥/א דָ֖ךְ הָֽחָרְבַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/015.yaml
  text: so that a search may be made in the book of records of your fathers[a], and you may find in the book of records and know that this city is a rebellious city, harmful to kings and provinces, and that sedition has been made within it from ancient days[b]; for this reason this city was laid waste.
translation:
  language: id
  text: supaya dilakukan penyelidikan dalam kitab catatan para leluhur Baginda[a], sehingga Baginda dapat menemukan dalam kitab catatan itu dan mengetahui bahwa kota ini adalah kota pemberontak, yang merugikan raja-raja dan provinsi-provinsi, dan bahwa pemberontakan telah dihasut di dalamnya sejak zaman dahulu[b]. Itulah sebabnya kota ini telah dihancurkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bapa-bapa Baginda”; dalam konteks ini dapat berarti leluhur atau para pendahulu Baginda.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Aram ini sulit dan dapat juga diterjemahkan, “pemberontakan telah dilakukan” atau “telah terjadi penghasutan” di dalamnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקַּר
  choice: orang menyelidiki
  rationale: Bentuk ini dapat dipahami secara impersonal dalam permohonan resmi. Ungkapan “supaya orang menyelidiki” mempertahankan ketidakjelasan pelaku sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: סְפַר דָּכְרָנַיָּא
  choice: kitab catatan
  rationale: Frasa ini menunjuk pada kumpulan catatan resmi tertulis; “kitab catatan” mempertahankan gambaran konkret naskah administratif.
- source_word: אֲבָהָתָךְ
  choice: para pendahulu Baginda
  rationale: Secara harfiah berarti “bapa-bapa Baginda,” tetapi dalam konteks surat kepada raja menunjuk pada para penguasa terdahulu. Makna harfiah dicatat dalam catatan kaki.
- source_word: וּתְהַשְׁכַּח וְתִנְדַּע
  choice: Baginda akan menemukan dan mengetahui
  rationale: Rangkaian ini menyatakan hasil yang diharapkan dari penyelidikan. “Baginda” sesuai dengan sapaan hormat kepada raja dalam bahasa Indonesia.
- source_word: קִרְיָא מָרָדָא
  choice: kota pemberontak
  rationale: Ungkapan ini menyampaikan tuduhan bahwa kota tersebut terus-menerus menentang kekuasaan kerajaan.
- source_word: מְהַנְזְקַת
  choice: yang merugikan
  rationale: Partisipel ini menyatakan tindakan mendatangkan kerugian atau kerusakan; “merugikan” mencakup dampak politik maupun ekonomi.
- source_word: מַלְכִין וּמְדִנָן
  choice: raja-raja dan provinsi-provinsi
  rationale: 'Terjemahan ini mempertahankan dua sasaran kerugian: para penguasa dan wilayah administratif mereka.'
- source_word: אֶשְׁתַּדּוּר עָבְדִין
  choice: orang telah mengobarkan pemberontakan
  rationale: Kolokasi Aram yang sulit ini menunjuk pada tindakan menimbulkan atau menghasut pergolakan. Terjemahan aktif impersonal menyampaikan maknanya secara alami tanpa menentukan pelaku.
- source_word: מִן יוֹמָת עָלְמָא
  choice: sejak zaman dahulu
  rationale: Idiom ini menunjuk pada masa lampau yang jauh, bukan pada kekekalan dalam arti metafisik.
- source_word: הָחָרְבַת
  choice: dihancurkan
  rationale: Bentuk pasif menyatakan bahwa kota itu dibuat menjadi reruntuhan, tanpa menyebut pelakunya.
theological_decisions: []
translation_notes:
  register: Bahasa surat kerajaan dibuat resmi dan hormat dengan sapaan “Baginda,” tetapi tetap mudah dipahami. Struktur sebab-akibat dan pengulangan “kitab catatan” dipertahankan karena penting bagi corak administratif ayat.
