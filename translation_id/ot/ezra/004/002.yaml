source:
  edition: WLC
  text: וַ/יִּגְּשׁ֨וּ אֶל זְרֻבָּבֶ֜ל וְ/אֶל רָאשֵׁ֣י הָֽ/אָב֗וֹת וַ/יֹּאמְר֤וּ לָ/הֶם֙ נִבְנֶ֣ה עִמָּ/כֶ֔ם כִּ֣י כָ/כֶ֔ם נִדְר֖וֹשׁ לֵֽ/אלֹהֵי/כֶ֑ם ו/לא אֲנַ֣חְנוּ זֹבְחִ֗ים מִ/ימֵי֙ אֵסַ֤ר חַדֹּן֙ מֶ֣לֶךְ אַשּׁ֔וּר הַ/מַּעֲלֶ֥ה אֹתָ֖/נוּ פֹּֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/002.yaml
  text: Then they approached Zerubbabel and the heads of the fathers’ houses and said to them[a], “Let us build with you, for like you we seek your God, and we have been sacrificing to him since the days of Esar-haddon king of Assyria[b], who brought us up here.”
translation:
  language: id
  text: Lalu mereka mendekati Zerubabel dan para kepala kaum keluarga serta berkata kepada mereka, “Biarkanlah kami membangun bersama kalian, sebab seperti kalian, kami mencari Allah kalian[a] dan mempersembahkan kurban kepada-Nya[b] sejak zaman Esar-Hadon, raja Asyur, yang membawa kami ke sini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyembah Allah kalian” atau “meminta petunjuk dari Allah kalian.” Kata Ibrani yang diterjemahkan “mencari” dapat memiliki nuansa keagamaan.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani tertulis berbunyi “dan kami tidak mempersembahkan kurban,” tetapi pembacaan tradisionalnya berbunyi “dan kepada-Nya kami mempersembahkan kurban,” yang sesuai dengan konteks.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: mereka mendekati
  rationale: Menyampaikan gerak mendekat kepada Zerubabel dan para pemimpin secara alami dalam narasi Indonesia modern.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: para kepala kaum keluarga
  rationale: Mengungkapkan para pemimpin kelompok kekerabatan leluhur dengan istilah Indonesia yang jelas tanpa mempertahankan idiom harfiah yang kaku, ‘kepala para ayah’.
- source_word: נִבְנֶה עִמָּכֶם
  choice: Biarkanlah kami membangun bersama kalian
  rationale: Bentuk orang pertama jamak dipahami secara volitif sebagai permohonan untuk ikut membangun; pilihan ini lebih alami daripada ‘marilah kami’ dan tetap mempertahankan unsur ‘bersama kalian’.
- source_word: כִּי כָכֶם
  choice: sebab seperti kalian
  rationale: Mempertahankan dasar perbandingan yang dikemukakan para pembicara dan membiarkan verba berikutnya melengkapi perbandingan itu.
- source_word: נִדְרֹשׁ לֵאלֹהֵיכֶם
  choice: kami mencari Allah kalian
  rationale: דרשׁ dalam konteks keagamaan dapat berarti mencari, meminta petunjuk, atau beribadah. ‘Mencari’ mempertahankan keluasan makna sumber; alternatif dicatat dalam catatan kaki.
- source_word: וְלֹא אֲנַחְנוּ זֹבְחִים
  choice: dan mempersembahkan kurban kepada-Nya
  rationale: Teks tertulis sulit karena memuat לא (‘tidak’), sedangkan pembacaan tradisional dan konteks menunjuk kepada לו (‘kepada-Nya’). Teks utama mengikuti makna kontekstual, sementara masalah tekstual dijelaskan dalam catatan kaki.
- source_word: מִימֵי אֵסַר חַדֹּן
  choice: sejak zaman Esar-Hadon
  rationale: Ungkapan temporal מן + ‘hari-hari’ secara idiomatis berarti sejak masa pemerintahan atau zaman tokoh tersebut hingga waktu pembicaraan.
- source_word: הַמַּעֲלֶה אֹתָנוּ פֹּה
  choice: yang membawa kami ke sini
  rationale: Menyampaikan bentuk kausatif dan tujuan gerak secara alami; unsur arah ‘naik’ dalam idiom Ibrani tidak perlu dipaksakan karena tidak jelas bermakna topografis dalam bahasa Indonesia.
theological_decisions:
- issue: Klaim keagamaan para pendatang
  choice: Klaim mereka dilaporkan secara netral dengan ‘mencari Allah kalian’ dan ‘mempersembahkan kurban kepada-Nya’.
  alternative: ‘menyembah Allah kalian’ atau ‘meminta petunjuk dari Allah kalian’
  rationale: Ayat ini melaporkan klaim para pembicara tanpa dengan sendirinya mengesahkan ketulusan atau kemurnian ibadah mereka. Ketegangan teologis dibiarkan ditentukan oleh konteks narasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Sapaan jamak ‘kalian’ dipakai untuk membedakan kelompok yang diajak bicara; nama אֵסַר חַדֹּן ditulis ‘Esar-Hadon’. Semua penanda catatan kaki ditempatkan tepat pada frasa yang dijelaskannya.
