  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רְח֣וּם בְּעֵל טְעֵ֗ם וְ/שִׁמְשַׁי֙ סָֽפְרָ֔/א כְּתַ֛בוּ אִגְּרָ֥ה חֲדָ֖ה עַל יְרוּשְׁלֶ֑ם לְ/אַרְתַּחְשַׁ֥שְׂתְּא מַלְכָּ֖/א כְּנֵֽמָא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/008.yaml
  text: Rehum the commander and Shimshai the scribe wrote a letter against Jerusalem to King Artaxerxes as follows:[a]
translation:
  language: id
  text: 'Rehum, pejabat tinggi[a], dan Simsai, juru tulis, menulis kepada Raja Artahsasta sepucuk surat yang menentang Yerusalem, sebagai berikut:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pemegang titah” atau “penguasa keputusan.” Ini adalah gelar jabatan dalam bahasa Aram, tetapi padanan tepatnya dalam tata pemerintahan Persia tidak diketahui; terjemahan lain yang mungkin ialah “kanselir” atau “kepala penasihat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵל טְעֵם
  choice: pejabat tinggi
  rationale: Ungkapan ini merupakan gelar resmi pemerintahan yang arti teknisnya tidak pasti. “Pejabat tinggi” menyampaikan kedudukan administratif tanpa secara keliru menetapkannya sebagai jabatan militer atau birokratis tertentu.
- source_word: סָפְרָא
  choice: juru tulis
  rationale: Istilah ini menunjuk pejabat yang menangani penulisan atau kesekretariatan; “juru tulis” mempertahankan hubungan leksikalnya dan tetap mudah dipahami.
- source_word: כְּתַבוּ
  choice: menulis
  rationale: Padanan langsung dan alami untuk verba Aram tersebut, tanpa menambahkan gagasan bahwa surat itu juga dikirim.
- source_word: אִגְּרָה חֲדָה
  choice: sepucuk surat
  rationale: Dalam Aram Kekaisaran, חֲדָה dapat memperkenalkan nomina secara tak tentu, bukan menekankan jumlah. “Sepucuk surat” alami dalam bahasa Indonesia dan tidak memberi tekanan berlebihan pada angka satu.
- source_word: עַל יְרוּשְׁלֶם
  choice: yang menentang Yerusalem
  rationale: Konteksnya bersifat memusuhi dan menuduh, sehingga “menentang” mempertahankan daya adversatif עַל tanpa menambahkan rincian tuduhan yang tidak dinyatakan dalam ayat ini.
- source_word: לְאַרְתַּחְשַׁשְׂתְּא מַלְכָּא
  choice: kepada Raja Artahsasta
  rationale: Susunan ini alami dalam bahasa Indonesia dan mempertahankan nama serta gelar kerajaan.
- source_word: כְּנֵמָא
  choice: 'sebagai berikut:'
  rationale: Penanda wacana ini memperkenalkan isi surat pada ayat berikutnya; “sebagai berikut” menjalankan fungsi itu secara jelas dan idiomatis.
- source_word: רְחוּם
  choice: Rehum
  rationale: Nama diri dialihaksarakan dalam bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: שִׁמְשַׁי
  choice: Simsai
  rationale: Nama diri dialihaksarakan dalam bentuk yang alami bagi pembaca Indonesia.
- source_word: אַרְתַּחְשַׁשְׂתְּא
  choice: Artahsasta
  rationale: Nama raja memakai bentuk yang sudah lazim dalam Alkitab bahasa Indonesia.
theological_decisions: []
