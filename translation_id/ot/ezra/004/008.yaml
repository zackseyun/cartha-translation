  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami sambil mempertahankan sifat surat yang memusuhi Yerusalem. Gelar administratif yang tidak pasti diterjemahkan secara umum dan dijelaskan dalam catatan kaki.
