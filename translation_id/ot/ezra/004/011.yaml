base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/011.yaml
  text: 'This is a copy of the letter that they sent to King Artaxerxes: “Your servants[a], the men of Beyond the River[b], and now—”'
translation:
  language: id
  text: 'Berikut ini salinan surat yang mereka kirim kepada Raja Artahsasta:


    “Hamba-hambamu, orang-orang dari Seberang Sungai[a], dan sekarang[b]—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Seberang Sungai”; ini adalah sebutan administratif Persia bagi wilayah di sebelah barat Sungai Efrat, yang juga disebut Trans-Efrat.
    reason: historical_geography
  - marker: b
    text: Ungkapan bahasa Aram ini merupakan rumusan resmi dalam surat, yang secara tradisional diterjemahkan “dan pada waktu ini” atau dipahami sebagai “dan seterusnya”. Isi surat berlanjut pada ayat berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה
  choice: Berikut ini
  rationale: Kata tunjuk bahasa Aram ini memperkenalkan kutipan dokumen. “Berikut ini” menyampaikan fungsi presentasionalnya secara alami dalam bahasa Indonesia.
- source_word: פַּרְשֶׁגֶן
  choice: salinan
  rationale: Menunjuk pada salinan atau transkrip suatu dokumen resmi; “salinan” merupakan padanan Indonesia yang jelas dan lazim.
- source_word: אִגַּרְתָּא
  choice: surat
  rationale: Menunjuk pada komunikasi tertulis resmi; “surat” paling alami dalam konteks administratif ini.
- source_word: דִּי
  choice: yang
  rationale: Partikel relatif yang menghubungkan “surat” dengan klausa berikutnya.
- source_word: שְׁלַחוּ
  choice: mereka kirim
  rationale: Mengungkapkan tindakan mengirim surat dengan bentuk Indonesia yang langsung dan wajar.
- source_word: עֲלוֹהִי ... עַל
  choice: kepada
  rationale: Dalam rumusan surat ini, gabungan preposisional tersebut menunjuk kepada penerima surat, yaitu Raja Artahsasta, bukan menyatakan bahwa surat itu menentangnya.
- source_word: אַרְתַּחְשַׁשְׂתְּא
  choice: Artahsasta
  rationale: Mengikuti bentuk nama raja yang telah mapan dalam tradisi Alkitab bahasa Indonesia.
- source_word: מַלְכָּא
  choice: Raja
  rationale: Gelar kerajaan yang melekat pada nama diri diterjemahkan secara idiomatis sebagai “Raja Artahsasta”.
- source_word: עַבְדָיךְ
  choice: Hamba-hambamu
  rationale: Mempertahankan sebutan resmi dan penuh takzim yang dipakai bawahan ketika menyapa raja, tanpa menafsirkannya secara lebih sempit sebagai “para pejabatmu”.
- source_word: אֱנָשׁ
  choice: orang-orang
  rationale: Nomina tunggal kolektif ini menunjuk kepada kelompok manusia. “Orang-orang” terdengar alami dan tidak menambahkan pembatasan yang tidak perlu dalam bahasa Indonesia.
- source_word: עֲבַר נַהֲרָה
  choice: di Seberang Sungai
  rationale: Mempertahankan bentuk sebutan geografis-administratif Persia bagi wilayah di sebelah barat Sungai Efrat. Preposisi “di” sesuai dengan cara kelompok itu menyatakan tempat kedudukannya.
- source_word: וּכְעֶנֶת
  choice: Dan sekarang—
  rationale: Ini adalah rumusan peralihan epistoler bahasa Aram. “Dan sekarang” mempertahankan bentuknya, sedangkan tanda pisah menunjukkan bahwa isi surat berlanjut pada ayat berikutnya.
