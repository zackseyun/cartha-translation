  yaml_path: translation/ot/ezra/004/020.yaml
  text: And mighty kings were over Jerusalem, ruling over all the region Beyond the River, and tribute, tax, and toll were paid to them.
translation:
  language: id
  text: Raja-raja yang perkasa berkuasa atas Yerusalem dan memerintah seluruh wilayah Seberang Sungai[a]. Upeti, pajak, dan bea[b] dibayarkan kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh Seberang Sungai”; ungkapan ini merupakan sebutan resmi bagi wilayah kekaisaran di sebelah barat Sungai Efrat.
    reason: cultural_note
  - marker: b
    text: Ketiga istilah “upeti, pajak, dan bea” menunjuk kategori penerimaan kerajaan yang berbeda. Padanan lain yang mungkin antara lain “upeti, cukai, dan bea” atau “upeti, pajak, dan bea masuk.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִין תַּקִּיפִין
  choice: raja-raja yang perkasa
  rationale: Bentuk jamak dan sifat kekuasaan para raja dipertahankan; “perkasa” wajar dalam konteks kerajaan dan menyatakan kekuatan atau kuasa.
- source_word: הֲווֹ עַל יְרוּשְׁלֶם
  choice: pernah berkuasa atas Yerusalem
  rationale: Konstruksi ini menunjukkan keberadaan para raja pada masa lampau sekaligus kekuasaan mereka atas Yerusalem, bukan sekadar lokasi mereka di kota itu.
- source_word: שַׁלִּיטִין בְּכֹל עֲבַר נַהֲרָה
  choice: memerintah seluruh wilayah Seberang Sungai
  rationale: Partisipel menyatakan pelaksanaan pemerintahan. “Seberang Sungai” dipertahankan sebagai sebutan geografis-administratif, sedangkan “wilayah” membuat maksudnya jelas bagi pembaca Indonesia.
- source_word: מִדָּה
  choice: upeti
  rationale: Istilah ini merupakan unsur pertama dalam rangkaian baku pungutan kerajaan dan paling tepat dinyatakan sebagai pembayaran wajib kepada penguasa.
- source_word: בְלוֹ
  choice: pajak
  rationale: Istilah ini menunjuk salah satu kategori pungutan yang berbeda dalam rumus administratif; “pajak” merupakan padanan umum yang jelas.
- source_word: הֲלָךְ
  choice: bea
  rationale: Kemungkinan menunjuk pungutan atas perjalanan, angkutan, atau lalu lintas barang. “Bea” cukup luas untuk mempertahankan ketidakpastian jenis pungutannya.
- source_word: מִתְיְהֵב לְהוֹן
  choice: dibayarkan kepada mereka
  rationale: Bentuk pasif menyatakan bahwa ketiga jenis penerimaan itu diserahkan kepada para raja; “dibayarkan” alami dalam konteks pungutan.
