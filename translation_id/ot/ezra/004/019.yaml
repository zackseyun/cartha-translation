  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ וּ/בַקַּ֣רוּ וְ/הַשְׁכַּ֔חוּ דִּ֚י קִרְיְתָ֣/א דָ֔ךְ מִן יוֹמָת֙ עָֽלְמָ֔/א עַל מַלְכִ֖ין מִֽתְנַשְּׂאָ֑ה וּ/מְרַ֥ד וְ/אֶשְׁתַּדּ֖וּר מִתְעֲבֶד בַּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/019.yaml
  text: And a decree was issued by me[a], and they searched and found that this city has from ancient days risen up against kings[b], and rebellion and sedition have been carried out in it.
translation:
  language: id
  text: Aku telah mengeluarkan perintah, lalu mereka menyelidiki dan mendapati bahwa sejak zaman dahulu kota ini telah bangkit menentang raja-raja[a], dan pemberontakan serta makar telah dilakukan di dalamnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah meninggikan diri terhadap raja-raja.” Verba Aramnya dapat menyiratkan tindakan meninggikan diri, tetapi dalam konteks ini bermakna bangkit melawan kekuasaan mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau “pemberontakan dan pembangkangan telah terjadi di dalamnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: Aku telah mengeluarkan perintah
  rationale: Ungkapan harfiah Aramnya berarti ‘dari aku ditetapkan perintah’. Bentuk aktif ini menyampaikan secara alami bahwa raja adalah sumber perintah resmi tersebut.
- source_word: וּבַקַּרוּ וְהַשְׁכַּחוּ
  choice: lalu mereka menyelidiki dan mendapati
  rationale: Kedua verba menggambarkan pemeriksaan resmi atas arsip beserta hasilnya. ‘Menyelidiki dan mendapati’ mempertahankan urutan tindakan dalam teks sumber.
- source_word: קִרְיְתָא דָךְ
  choice: kota ini
  rationale: Demonstrativa Aram menunjuk pada kota yang sedang dibicarakan dalam surat kerajaan.
- source_word: מִן יוֹמָת עָלְמָא
  choice: sejak zaman dahulu
  rationale: Ungkapan idiomatis ini menunjuk pada masa lampau yang jauh; padanan Indonesia ini alami sekaligus mempertahankan kedalaman historisnya.
- source_word: עַל מַלְכִין מִתְנַשְּׂאָה
  choice: telah bangkit menentang raja-raja
  rationale: Bentuk refleksif verba dapat berarti meninggikan diri atau bangkit. Dalam konteks politik, ‘bangkit menentang’ mempertahankan unsur pembangkangan tanpa menyamakannya dengan nomina ‘pemberontakan’ yang menyusul.
- source_word: וּמְרַד
  choice: pemberontakan
  rationale: Istilah politik yang lazim untuk perlawanan terhadap kekuasaan kerajaan.
- source_word: וְאֶשְׁתַּדּוּר
  choice: makar
  rationale: Kata ini menunjuk pada tindakan subversif atau pemberontakan politik. ‘Makar’ membedakannya dari ‘pemberontakan’ sebelumnya sambil mempertahankan nuansa ancaman terhadap pemerintahan.
- source_word: מִתְעֲבֶד בַּהּ
  choice: telah dilakukan di dalamnya
  rationale: Bentuk pasif atau impersonal menunjukkan bahwa tindakan-tindakan politik tersebut dilakukan di kota itu.
