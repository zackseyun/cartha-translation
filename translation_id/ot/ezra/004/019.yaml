  terminology: '"Pemberontakan serta makar" membedakan dua istilah politik Aram yang berdekatan tanpa menghilangkan tumpang tindih maknanya. Catatan a secara tepat memelihara kemungkinan leksikal "meninggikan diri." Catatan b merupakan alternatif yang wajar untuk ungkapan tindakan politik tersebut. Penanda catatan ditempatkan pada atau sesudah unsur yang dijelaskan dan tidak menimbulkan ambiguitas struktural.'
