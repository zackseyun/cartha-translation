  source_fidelity: 'Teks dengan tepat menyampaikan urutan Aram: perintah kerajaan dikeluarkan, penyelidikan dilakukan, lalu ditemukan bahwa kota itu sejak dahulu bersikap melawan raja-raja serta menjadi tempat dilakukannya pemberontakan dan makar. Bentuk aktif "Aku telah mengeluarkan perintah" adalah padanan Indonesia yang wajar bagi idiom Aram "dari aku ditetapkan perintah" dan tetap menandai raja sebagai sumber perintah.'
