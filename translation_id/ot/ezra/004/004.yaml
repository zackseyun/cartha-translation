lexical_decisions:
- source_word: וַיְהִי
  choice: Lalu
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa. “Lalu” mempertahankan alur cerita secara wajar tanpa ungkapan arkais seperti “maka terjadilah”.
- source_word: עַם הָאָרֶץ
  choice: penduduk negeri itu
  rationale: Ungkapan ini menunjuk kepada penduduk setempat di sekitar komunitas orang Yehuda. “Penduduk negeri itu” alami dalam bahasa Indonesia dan tetap dekat dengan bentuk Ibrani.
- source_word: מְרַפִּים יְדֵי
  choice: terus melemahkan semangat
  rationale: Secara harfiah ungkapan ini berarti “melemahkan tangan,” yaitu mengendurkan keberanian, tekad, atau kemampuan untuk bertindak. Kata “terus” mencerminkan tindakan yang berlangsung sebagaimana ditunjukkan oleh bentuk partisipelnya.
- source_word: עַם יְהוּדָה
  choice: orang-orang Yehuda
  rationale: Frasa ini menunjuk kepada komunitas Yehuda yang sedang membangun kembali. Bentuk jamak ini jelas dan alami dalam bahasa Indonesia.
- source_word: וּמְבַלְהִים
  choice: dan membuat ... takut
  rationale: Kata kerja ini menyatakan tindakan menimbulkan ketakutan, kegentaran, atau kepanikan. “Membuat ... takut” menyampaikan makna kausatifnya dengan jelas.
- source_word: אוֹתָם
  choice: mereka
  rationale: Pronomina objek ini merujuk kembali kepada orang-orang Yehuda.
- source_word: לִבְנוֹת
  choice: untuk membangun
  rationale: Infinitif dengan preposisi ל menyebut kegiatan pembangunan yang menjadi sasaran intimidasi. Susunan “takut untuk membangun” alami dan mempertahankan hubungan sintaksis tanpa menjelaskan secara berlebihan apakah mereka sama sekali berhenti membangun.
