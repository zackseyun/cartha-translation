  source_fidelity: 'Terjemahan pada dasarnya setia pada Aram: raja mengirim jawaban kepada Rehum, Simsai, rekan-rekan mereka di Samaria, dan orang-orang lain di Seberang Sungai. Gelar בְּעֵל טְעֵם memang tidak pasti, sehingga “pejabat utama” adalah pilihan yang cukup aman. Namun, “Damai sejahtera” sedikit memperluas שְׁלָם, yang secara langsung lebih baik diterjemahkan “Damai.”'
