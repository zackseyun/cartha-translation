  text: פִּתְגָמָ֞/א שְׁלַ֣ח מַלְכָּ֗/א עַל רְח֤וּם בְּעֵל טְעֵם֙ וְ/שִׁמְשַׁ֣י סָֽפְרָ֔/א וּ/שְׁאָר֙ כְּנָוָ֣תְ/ה֔וֹן דִּ֥י יָתְבִ֖ין בְּ/שָֽׁמְרָ֑יִן וּ/שְׁאָ֧ר עֲבַֽר נַהֲרָ֛/ה שְׁלָ֖ם וּ/כְעֶֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/017.yaml
  text: 'The king sent a reply to Rehum the commander[a], Shimshai the scribe, and the rest of their associates who live in Samaria, and the rest beyond the River: Peace[c][b]. And now—'
translation:
  language: id
  text: 'Raja mengirimkan jawaban kepada Rehum, pejabat utama[a], Simsai, juru tulis, dan rekan-rekan mereka yang lain yang tinggal di Samaria, serta kepada orang-orang lain di Seberang Sungai[b]: Damai.[c] Dan sekarang—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gelar Aram ini juga dapat diterjemahkan “kepala pemerintahan” atau “pejabat yang berwenang”; jabatan tepatnya tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: “Seberang Sungai” adalah nama wilayah pemerintahan Persia di sebelah barat Sungai Efrat.
    reason: cultural_note
  - marker: c
    text: Atau “Salam!”
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: jawaban
  rationale: Dalam konteks surat resmi ini, kata tersebut menunjuk pada pesan tertulis raja yang menanggapi surat sebelumnya; “jawaban” menyampaikan sifat responsifnya tanpa mempersempitnya menjadi dekret.
- source_word: שְׁלַח
  choice: mengirimkan
  rationale: Padanan Indonesia yang wajar untuk tindakan mengirim pesan atau surat resmi.
- source_word: מַלְכָּא
  choice: Raja
  rationale: Bentuk definit dan konteks menunjuk kepada raja Persia yang telah disebut; bahasa Indonesia tidak memerlukan kata sandang.
- source_word: עַל
  choice: kepada
  rationale: Sesudah verba “mengirimkan”, preposisi ini secara idiomatis menandai para penerima.
- source_word: בְּעֵל טְעֵם
  choice: pejabat utama
  rationale: Gelar administratif ini secara harfiah berkaitan dengan kewenangan atau pertimbangan, tetapi jabatan tepatnya tidak pasti. “Pejabat utama” mempertahankan fungsi kepemimpinan tanpa mengartikannya terlalu khusus sebagai komandan atau kanselir.
- source_word: סָפְרָא
  choice: juru tulis
  rationale: Sebutan baku bagi pejabat yang menangani penulisan dan administrasi; istilah ini jelas dan lazim dalam konteks Alkitab.
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: rekan-rekan mereka lainnya
  rationale: Ungkapan ini menunjuk kepada orang-orang lain yang tergabung atau bersekutu dengan kedua pejabat tersebut.
- source_word: דִּי יָתְבִין בְּשָׁמְרָיִן
  choice: yang tinggal di Samaria
  rationale: Partisip tersebut menyatakan tempat menetap; “tinggal” alami dalam bahasa Indonesia modern.
- source_word: וּשְׁאָר עֲבַר נַהֲרָה
  choice: serta kepada yang lain di Seberang Sungai
  rationale: Teks tidak memuat kata eksplisit untuk “provinsi”. “Seberang Sungai” dipertahankan sebagai nama wilayah administratif Persia di sebelah barat Sungai Efrat, sedangkan pengulangan “yang lain” mencerminkan שְׁאָר.
- source_word: שְׁלָם
  choice: Damai sejahtera!
  rationale: Sapaan surat ini secara leksikal berarti damai atau kesejahteraan. Bentuk “Damai sejahtera!” mempertahankan isi katanya sekaligus dapat dipahami sebagai salam.
- source_word: וּכְעֶת
  choice: Dan sekarang—
  rationale: Formula ini mengantar isi utama jawaban. Tanda pisah menunjukkan bahwa kalimat berlanjut ke ayat berikutnya.
