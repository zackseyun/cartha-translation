  text: Because we eat the salt of the palace, and it is not fitting for us to see the king’s dishonor, therefore we have sent and informed the king,
translation:
  language: id
  text: Oleh karena kami makan garam istana[a] dan tidak patut bagi kami melihat aib raja[b], maka kami telah mengirimkan kabar dan memberitahukan hal ini kepada raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “makan garam istana” berarti menerima nafkah dari istana dan karena itu berkewajiban setia kepada istana.
    reason: Idiom Aram dipertahankan secara harfiah dalam teks utama dan dijelaskan bagi pembaca modern.
  - marker: b
    text: 'Secara harfiah: “ketelanjangan raja”; ungkapan ini dapat menunjuk pada kehinaan, cela, atau kerugian yang menimpa raja.'
    reason: Menjelaskan metafora sumber sambil mempertahankan keluasan maknanya.
lexical_decisions:
- source_word: כְּעַן
  choice: Sekarang
  rationale: Kata Aram ini merupakan penanda waktu atau wacana yang eksplisit, sehingga dipertahankan sebagai “Sekarang” pada awal kalimat.
- source_word: מְלַח הֵיכְלָא מְלַחְנָא
  choice: kami makan garam istana
  rationale: Ungkapan harfiah dan idiomatis ini dipertahankan untuk menjaga citra sumber; maksudnya ialah menerima nafkah dari istana dan karena itu terikat kepadanya.
- source_word: עֶרְוַת מַלְכָּא
  choice: aib raja
  rationale: Secara harfiah berarti ‘ketelanjangan raja’, tetapi dalam konteks ini menunjuk pada kehinaan, kerugian, atau hal yang mempermalukan raja. “Aib” mempertahankan unsur tercela tanpa membatasi maknanya hanya pada kerugian material.
- source_word: שְׁלַחְנָא וְהוֹדַעְנָא
  choice: kami mengirimkan kabar ... untuk memberitahukan
  rationale: Merangkum dua verba sumber—‘mengirim’ dan ‘memberitahukan’—dalam susunan Indonesia yang alami tanpa menghilangkan salah satunya.
