id: EZR.4.5
reference: Ezra 4:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/סֹכְרִ֧ים עֲלֵי/הֶ֛ם יוֹעֲצִ֖ים לְ/הָפֵ֣ר עֲצָתָ֑/ם כָּל יְמֵ֗י כּ֚וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס וְ/עַד מַלְכ֖וּת דָּרְיָ֥וֶשׁ מֶֽלֶךְ פָּרָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/005.yaml
  text: And they hired counselors against them to frustrate their plan all the days of Cyrus king of Persia[a], even until the reign of Darius king of Persia.
translation:
  language: id
  text: Mereka menyewa para penasihat untuk menentang orang-orang itu dan menggagalkan rencana mereka sepanjang masa pemerintahan Koresh, raja Persia,[a] sampai masa pemerintahan Darius, raja Persia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menggagalkan keputusan mereka.” Kata Ibrani עֵצָה dapat berarti “nasihat,” “rencana,” “keputusan,” atau “maksud.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסֹכְרִים
  choice: Mereka menyewa
  rationale: Bentuk partisip dari שׂכר menunjukkan pembayaran untuk memperoleh jasa; “menyewa” wajar dalam bahasa Indonesia dan tidak secara tidak perlu menyiratkan penyuapan.
- source_word: עֲלֵיהֶם
  choice: untuk menentang orang-orang itu
  rationale: Dalam konteks permusuhan dan tujuan menggagalkan rencana, עַל memiliki daya adversatif. Penyebutan “orang-orang itu” memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: יוֹעֲצִים
  choice: para penasihat
  rationale: Kata dari akar יעץ menunjuk kepada orang-orang yang memberikan nasihat, khususnya dalam konteks administratif atau politik.
- source_word: לְהָפֵר
  choice: menggagalkan
  rationale: הפר dapat berarti membatalkan, merusak, atau menggagalkan; dengan objek berupa rencana, “menggagalkan” merupakan padanan Indonesia yang tepat dan alami.
- source_word: עֲצָתָם
  choice: rencana mereka
  rationale: עֵצָה dapat berarti nasihat, rencana, atau maksud. Dalam konteks pembangunan kembali, “rencana” paling jelas, sementara kemungkinan “keputusan” dipertahankan dalam catatan kaki.
- source_word: כָּל יְמֵי
  choice: sepanjang masa pemerintahan
  rationale: Ungkapan temporal ini menunjukkan keseluruhan periode yang terkait dengan Koresh; “sepanjang masa pemerintahan” alami dan sesuai dengan konteks raja.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Koresh, raja Persia
  rationale: Nama Ibrani כּוֹרֶשׁ ditransliterasikan menurut bentuk Indonesia yang lazim, sedangkan gelarnya diterjemahkan.
- source_word: וְעַד מַלְכוּת
  choice: sampai masa pemerintahan
  rationale: Dalam konstruksi temporal ini, מַלְכוּת menunjuk pada masa kekuasaan seorang raja, bukan wilayah kerajaannya.
- source_word: דָּרְיָוֶשׁ מֶלֶךְ פָּרָס
  choice: Darius, raja Persia
  rationale: Nama ditransliterasikan dalam bentuk Indonesia yang lazim dan gelar diterjemahkan secara langsung.
