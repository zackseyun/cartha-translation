  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ לָ/הֶ֨ם זְרֻבָּבֶ֜ל וְ/יֵשׁ֗וּעַ וּ/שְׁאָ֨ר רָאשֵׁ֤י הָֽ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לֹֽא לָ֣/כֶם וָ/לָ֔/נוּ לִ/בְנ֥וֹת בַּ֖יִת לֵ/אלֹהֵ֑י/נוּ כִּי֩ אֲנַ֨חְנוּ יַ֜חַד נִבְנֶ֗ה לַֽ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כַּ/אֲשֶׁ֣ר צִוָּ֔/נוּ הַ/מֶּ֖לֶךְ כּ֥וֹרֶשׁ מֶֽלֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/003.yaml
  text: But Zerubbabel[a], Jeshua, and the rest of the heads of the fathers’ houses of Israel said to them, “You have no part with us in building a house for our God, for we alone will build it for Yahweh, the God of Israel, just as King Cyrus, the king of Persia[b], commanded us.”
translation:
  language: id
  text: Namun Zerubabel, Yesua, dan para kepala kaum keluarga Israel yang lain berkata kepada mereka, “Kalian tidak memiliki bagian bersama kami dalam membangun rumah[a] bagi Allah kami, sebab kamilah[b] yang akan membangunnya bagi Yahweh, Allah Israel, sesuai dengan perintah Raja Kores, raja Persia, kepada kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rumah” di sini mengacu pada bait Allah.
    reason: cultural_note
  - marker: b
    text: Secara lebih harfiah, “kami bersama-sama akan membangun”; dalam konteks ini, “bersama-sama” berarti bahwa mereka sendiri, tanpa pihak yang menawarkan bantuan, akan melaksanakan pembangunan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר secara wajar diterjemahkan dengan verba ujaran umum “berkata”.
- source_word: זְרֻבָּבֶל וְיֵשׁוּעַ
  choice: Zerubabel, Yesua
  rationale: Nama-nama ini ditransliterasikan menurut bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: וּשְׁאָר רָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: dan para kepala kaum keluarga Israel yang lain
  rationale: Ungkapan רָאשֵׁי הָאָבוֹת menunjuk kepada para pemimpin kelompok keluarga atau marga; “kepala kaum keluarga” mempertahankan struktur sosial itu tanpa menjadi kaku.
- source_word: לֹא לָכֶם וָלָנוּ
  choice: Kalian tidak mendapat bagian bersama kami
  rationale: Ungkapan ini menolak hak atau keikutsertaan bersama. Terjemahan tersebut menyampaikan daya pengecualiannya dalam bahasa Indonesia yang alami.
- source_word: לִבְנוֹת בַּיִת לֵאלֹהֵינוּ
  choice: dalam membangun rumah bagi Allah kami
  rationale: “Rumah” mempertahankan arti dasar בַּיִת, sedangkan konteksnya sebagai bait atau tempat ibadah dijelaskan dalam catatan kaki.
- source_word: כִּי אֲנַחְנוּ יַחַד
  choice: Sebab, kami sendirilah
  rationale: יַחַד secara harfiah berarti “bersama-sama”, tetapi dalam pertentangan ini menunjuk kepada kelompok Israel yang akan membangun tanpa para penawar bantuan tersebut. Partikel “-lah” menegaskan subjek eksklusif.
- source_word: נִבְנֶה
  choice: akan membangunnya
  rationale: Bentuk imperfek orang pertama jamak menyatakan tindakan yang akan dilakukan; objeknya diambil secara alami dari klausa sebelumnya.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Terjemahan konstruksi genitif ini ringkas, baku, dan transparan dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר צִוָּנוּ
  choice: sesuai dengan perintah ... kepada kami
  rationale: Frasa ini menyatakan kesesuaian tindakan dengan perintah resmi Kores; susunan nominal menghasilkan bahasa Indonesia yang lebih alami.
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ מֶלֶךְ פָּרָס
  choice: Kores, raja Persia
  rationale: Gelar kerajaan dipertahankan, tetapi pengulangan kata “raja” yang alami dalam bahasa Ibrani tidak perlu direproduksi secara kaku dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri ilahi tanpa menggantinya dengan gelar atau memilih bentuk tradisional alternatif.
- issue: Daya pengecualian לֹא לָכֶם וָלָנוּ dan יַחַד
  choice: Kalian tidak mendapat bagian bersama kami ... kami sendirilah
  alternative: Bukanlah urusan kalian dan kami ... kami bersama-sama
  rationale: Konteksnya jelas menolak kerja sama yang ditawarkan, tetapi catatan kaki tetap mempertahankan arti harfiah יַחַד agar ketegangan antara bentuk leksikal dan fungsi kontekstual tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Sapaan “kalian” dipakai karena ujaran ditujukan kepada kelompok jamak dan membedakannya dari “kami”. Nama-nama ditulis sebagai Zerubabel, Yesua, dan Kores. Susunan kalimat mengutamakan kejelasan idiomatis sambil mempertahankan istilah “rumah” dan memberi catatan tentang makna kontekstualnya.
