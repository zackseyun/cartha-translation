  text: And be careful not to neglect doing this[b][a]. Why should the damage increase to the detriment of kings?
translation:
  language: id
  text: Berhati-hatilah agar kalian tidak lalai melaksanakan hal ini.[a] Mengapa kerusakan itu bertambah hingga merugikan para raja?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Waspadalah, jangan sampai kalian lalai melaksanakan hal ini.”'
    reason: lexical_alternative
  - marker: b
    text: Bentuk “para raja” mempertahankan bentuk jamak dalam bahasa Aram dan mungkin merujuk secara luas pada kepentingan kerajaan atau dinasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְהִירִין הֱווֹ
  choice: Berhati-hatilah
  rationale: Gabungan adjektiva dan verba ini membentuk ungkapan bernilai perintah. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan nada peringatan.
- source_word: שָׁלוּ
  choice: lalai
  rationale: Bentuk Aram ini menyatakan kelalaian atau sikap tidak sungguh-sungguh; bersama konteks larangan, 'tidak lalai' menyampaikan maksudnya secara ringkas.
- source_word: לְמֶעְבַּד עַל דְּנָה
  choice: melaksanakan hal ini
  rationale: Ungkapan ini mengacu pada pelaksanaan perintah kerajaan yang baru disebutkan; 'melaksanakan' sesuai dengan konteks administratif.
- source_word: לְמָה יִשְׂגֵּא
  choice: Mengapa ... dibiarkan bertambah
  rationale: Pertanyaan retoris menolak kemungkinan membiarkan kerugian berkembang. Bentuk pasif 'dibiarkan' membuat implikasi kontekstual itu alami dalam bahasa Indonesia tanpa mengubah daya retorisnya.
- source_word: חֲבָלָא
  choice: kerugian
  rationale: Kata ini menunjuk pada kerusakan, bahaya, atau kerugian akibat pembangkangan; 'kerugian' cocok dengan konteks kepentingan pemerintahan.
- source_word: לְהַנְזָקַת מַלְכִין
  choice: sehingga merugikan para raja
  rationale: Prefiks ל menyatakan akibat atau kerugian yang ditimbulkan. Bentuk jamak eksplisit מַלְכִין dipertahankan sebagai 'para raja'.
