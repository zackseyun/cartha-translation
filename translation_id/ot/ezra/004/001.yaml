id: EZR.4.1
reference: Ezra 4:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֔וּ צָרֵ֥י יְהוּדָ֖ה וּ/בִנְיָמִ֑ן כִּֽי בְנֵ֤י הַ/גּוֹלָה֙ בּוֹנִ֣ים הֵיכָ֔ל לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/001.yaml
  text: The adversaries of Judah and Benjamin heard that the sons of the exile were building a temple for Yahweh[a], the God of Israel.
translation:
  language: id
  text: Musuh-musuh Yehuda dan Benyamin mendengar bahwa kaum buangan[a] sedang membangun sebuah bait bagi Yahweh, Allah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak pembuangan”; maksudnya, komunitas orang-orang yang telah dibuang dan kemudian kembali.'
    reason: Ungkapan idiomatis Ibrani בְנֵי הַגּוֹלָה tidak dapat dipindahkan secara harfiah ke bahasa Indonesia tanpa menimbulkan kesan bahwa yang dimaksud hanya anak-anak atau keturunan biologis.
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: mendengar
  rationale: Bentuk naratif ini menyatakan peristiwa lampau secara langsung; bahasa Indonesia tidak memerlukan penanda waktu tambahan seperti “pada waktu itu”.
- source_word: צָרֵי
  choice: musuh-musuh
  rationale: Bentuk jamak konstruksi dari צַר menunjuk kepada pihak-pihak yang bermusuhan atau menentang; “musuh-musuh” alami dan tidak membatasi maknanya pada lawan militer.
- source_word: יְהוּדָה וּבִנְיָמִן
  choice: Yehuda dan Benyamin
  rationale: Keduanya adalah nama suku atau wilayah dan ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi berita yang mereka dengar, bukan alasan sebab-akibat.
- source_word: בְנֵי הַגּוֹלָה
  choice: kaum buangan[a]
  rationale: Ungkapan harfiahnya “anak-anak pembuangan,” tetapi dalam konteks menunjuk kepada komunitas yang terkait dengan pembuangan. “Kaum buangan” menyampaikan rujukannya secara alami, sedangkan catatan kaki mempertahankan bentuk khas bahasa Ibrani.
- source_word: בּוֹנִים
  choice: sedang membangun
  rationale: Partisipel menyatakan tindakan yang tengah berlangsung dalam konteks narasi lampau.
- source_word: הֵיכָל
  choice: bait
  rationale: Walaupun הֵיכָל dapat berarti istana, penyebutan Yahweh sebagai penerimanya memastikan bahwa yang dimaksud adalah bait atau rumah ibadah; “bait” merupakan istilah Indonesia yang ringkas dan lazim dalam konteks ini.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan bahwa bait itu dibangun bagi Yahweh; nama ilahi יהוה ditransliterasikan sebagai “Yahweh.”
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Rangkaian konstruksi ini secara langsung mengidentifikasi Yahweh sebagai Allah Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kaum buangan” dipilih demi kealamian, sementara bentuk khas Ibrani dijelaskan dalam catatan kaki. Penanda [a] ditempatkan tepat sesudah frasa yang dijelaskannya.
