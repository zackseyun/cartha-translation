translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Deretan nama kelompok dibuat alami dengan satu penanda “orang-orang” yang berlaku bagi seluruh daftar. Tanda pisah pada akhir ayat dipertahankan karena kalimat berlanjut ke ayat berikutnya.
