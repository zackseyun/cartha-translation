  naturalness: Kalimat dan tanda pisah akhir sudah sesuai karena daftar ini berlanjut ke ayat berikutnya. Akan tetapi, “orang-orang Dini, Afarsatki, Tarpeli, Afarsi, Erek, Babel, dan Susan” kurang jelas dalam bahasa Indonesia karena beberapa unsur terakhir tampak seperti nama tempat tanpa penanda penduduk. Pengulangan “orang-orang” membuat daftar lebih alami dan tidak ambigu.
