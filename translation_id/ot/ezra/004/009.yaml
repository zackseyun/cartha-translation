reference: Ezra 4:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֱדַ֜יִן רְח֣וּם בְּעֵל טְעֵ֗ם וְ/שִׁמְשַׁי֙ סָֽפְרָ֔/א וּ/שְׁאָ֖ר כְּנָוָתְ/ה֑וֹן דִּ֠ינָיֵ/א וַ/אֲפַרְסַתְכָיֵ֞/א טַרְפְּלָיֵ֣/א אֲפָֽרְסָיֵ֗/א ארכוי בָבְלָיֵ/א֙ שֽׁוּשַׁנְכָיֵ֔/א ד/הוא עֵלְמָיֵֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/009.yaml
  text: Then Rehum the commander[a], Shimshai the scribe, and the rest of their associates—the judges, the officials, the Tarpelites, the Persians, the Erechites, the Babylonians, the men of Susa (that is[b], the Elamites)—
translation:
  language: id
  text: Kemudian Rehum, pejabat utama[a], Simsai, juru tulis, dan rekan-rekan mereka yang lain—orang-orang Dini[b], orang-orang Afarsatki[c], orang-orang Tarpeli, orang-orang Persia, orang-orang Erek, orang-orang Babel, dan orang-orang Susan, yaitu orang-orang Elam—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gelar Aram ini diperdebatkan. Gelar ini juga diterjemahkan “panglima”, “kanselir”, atau “gubernur”.
    reason: Istilah gelar administratif ini tidak memiliki padanan Indonesia yang pasti.
  - marker: b
    text: Atau “para hakim”. Bentuk Aram ini dapat dipahami sebagai nama kelompok, “orang-orang Dini”, atau sebagai sebutan jabatan.
    reason: Mempertahankan ambiguitas leksikal antara nama kelompok dan jabatan administratif.
  - marker: c
    text: Identitas orang-orang Afarsatki tidak diketahui dengan pasti. Sebagian memahami istilah Aram ini sebagai sebutan bagi para pejabat.
    reason: Menjelaskan transliterasi atas istilah sulit dan mencatat alternatif administratif tanpa menetapkannya dalam teks.
lexical_decisions:
- source_word: אֱדַיִן
  choice: Kemudian
  rationale: Kata keterangan wacana ini menandai kelanjutan urutan peristiwa; “Kemudian” alami dalam bahasa Indonesia dan tetap mempertahankan hubungan dengan ayat sebelumnya.
- source_word: רְחוּם
  choice: Rehum
  rationale: Nama diri ditransliterasikan dengan ejaan yang mudah dibaca dalam bahasa Indonesia.
- source_word: בְּעֵל טְעֵם
  choice: pejabat utama
  rationale: Gelar administratif ini secara harfiah berkaitan dengan orang yang memegang perintah atau keputusan, tetapi fungsi tepatnya tidak pasti. “Pejabat utama” menyampaikan kewenangan resmi tanpa secara khusus menjadikannya pejabat militer, gubernur, atau kanselir.
- source_word: שִׁמְשַׁי
  choice: Simsai
  rationale: Nama diri ditransliterasikan menurut pola ejaan bahasa Indonesia.
- source_word: סָפְרָא
  choice: juru tulis
  rationale: Istilah ini menunjuk kepada penulis atau sekretaris resmi; “juru tulis” mempertahankan makna dasarnya dan cocok dengan konteks administrasi.
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: rekan-rekan mereka yang lain
  rationale: Ungkapan ini menunjuk kepada anggota lain dari kelompok yang bersekutu atau bekerja bersama dengan Rehum dan Simsai.
- source_word: דִּינָיֵא
  choice: orang-orang Dini
  rationale: Bentuk jamak ini paling transparan diperlakukan sebagai nama kelompok, sejajar dengan deretan nama bangsa atau daerah yang mengikutinya. Kemungkinan makna jabatan “para hakim” dipertahankan dalam catatan kaki.
- source_word: אֲפַרְסַתְכָיֵא
  choice: Afarsatki
  rationale: Identitas dan etimologi kelompok ini tidak pasti; transliterasi menghindari pemberian arti administratif yang belum dapat dipastikan.
- source_word: טַרְפְּלָיֵא
  choice: Tarpeli
  rationale: Nama kelompok yang identitasnya tidak pasti ditransliterasikan.
- source_word: אֲפָרְסָיֵא
  choice: Afarsi
  rationale: Bentuk ini mungkin menunjuk kepada orang Persia, tetapi transliterasi mempertahankan perbedaannya dari nama kelompok sebelumnya dan tidak menutup kemungkinan identifikasi lain.
- source_word: ארכוי
  choice: Erek
  rationale: Bentuk nisbah ini menunjuk kepada orang yang berasal dari Erek atau Uruk; nama tempat yang sudah dikenal dipakai secara langsung setelah “orang-orang”.
- source_word: בָבְלָיֵא
  choice: Babel
  rationale: Bentuk nisbah ini berarti orang-orang Babel; nama tempat dipakai setelah penanda kolektif “orang-orang”.
- source_word: שׁוּשַׁנְכָיֵא דהוא עֵלְמָיֵא
  choice: Susan, yaitu orang-orang Elam
  rationale: Teks mengidentifikasi orang-orang Susan sebagai orang-orang Elam. Rumusan “yaitu” mempertahankan hubungan penjelas tersebut.
