  yaml_path: translation/ot/ezra/004/018.yaml
  text: The document that you sent to us has been read plainly before me[a].
translation:
  language: id
  text: Dokumen yang kalian kirimkan kepada kami telah dibacakan dengan jelas di hadapanku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Surat yang kalian kirimkan kepada kami telah dibacakan dengan jelas di hadapanku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁתְּוָנָא
  choice: dokumen
  rationale: Istilah Aram Kekaisaran ini menunjuk pada komunikasi resmi tertulis. “Dokumen” mempertahankan cakupan administratifnya, sedangkan “surat” tetap merupakan kemungkinan yang wajar.
- source_word: דִּי
  choice: yang
  rationale: Partikel relatif ini secara alami memperkenalkan klausa yang menerangkan “dokumen” dalam bahasa Indonesia.
- source_word: שְׁלַחְתּוּן
  choice: kalian kirimkan
  rationale: Bentuk perfek orang kedua maskulin jamak ditujukan kepada sekelompok penerima. “Kalian” mempertahankan kemajemukan itu, dan “kirimkan” sesuai dengan konteks surat-menyurat.
- source_word: עֲלֶינָא
  choice: kepada kami
  rationale: Dalam konteks korespondensi resmi, preposisi ini paling alami menyatakan tujuan pengiriman kepada pihak istana, bukan tindakan melawan mereka.
- source_word: מְפָרַשׁ
  choice: dengan jelas
  rationale: Bentuk ini menyatakan bahwa pembacaan dilakukan secara jelas atau terang, tanpa menetapkan apakah yang dimaksud mencakup penerjemahan atau penjelasan.
- source_word: קֱרִי
  choice: telah dibacakan
  rationale: 'Konteks menuntut makna pasif: dokumen itu dibaca dengan suara nyaring di hadapan raja. “Dibacakan” mengungkapkan tindakan tersebut secara alami dalam bahasa Indonesia.'
- source_word: קָדָמָי
  choice: di hadapanku
  rationale: Ungkapan istana ini berarti bahwa tindakan tersebut berlangsung dalam kehadiran raja; “di hadapanku” ringkas dan wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern dan berwibawa. “Kalian” dipakai untuk mempertahankan bentuk orang kedua jamak dalam sumber; “kami” dan “-ku” mempertahankan peralihan antara pihak kerajaan dan pribadi raja. Penanda catatan kaki ditempatkan sesudah kalimat.
