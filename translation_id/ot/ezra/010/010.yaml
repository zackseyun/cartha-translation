source:
  edition: WLC
  text: וַ/יָּ֨קָם עֶזְרָ֤א הַ/כֹּהֵן֙ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אַתֶּ֣ם מְעַלְתֶּ֔ם וַ/תֹּשִׁ֖יבוּ נָשִׁ֣ים נָכְרִיּ֑וֹת לְ/הוֹסִ֖יף עַל אַשְׁמַ֥ת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/010.yaml
  text: Then Ezra the priest stood up and said to them[a], “You have acted unfaithfully and have taken foreign women as wives, adding to the guilt of Israel.”
translation:
  language: id
  text: Lalu Ezra, imam itu, berdiri dan berkata kepada mereka, “Kalian telah berlaku tidak setia dan mengambil perempuan asing sebagai istri[a], sehingga menambah kesalahan Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengambil istri-istri asing.” Frasa Ibraninya secara harfiah berbunyi “perempuan-perempuan asing,” tetapi dalam konteks ini merujuk kepada perempuan yang diambil sebagai istri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: berdiri
  rationale: Kata kerja קום dalam rangkaian naratif ini menggambarkan Ezra bangkit untuk berbicara di depan perhimpunan; “berdiri” alami dan mempertahankan tindakan fisiknya.
- source_word: הַכֹּהֵן
  choice: Imam
  rationale: Gelar ini mengidentifikasi Ezra sebagai imam. Susunan “Imam Ezra” wajar dalam bahasa Indonesia modern.
- source_word: מְעַלְתֶּם
  choice: telah berlaku tidak setia
  rationale: Kata מעל menyatakan pelanggaran kesetiaan, khususnya dalam hubungan perjanjian; pilihan ini mempertahankan dimensi moral dan perjanjiannya tanpa istilah teknis.
- source_word: וַתֹּשִׁיבוּ
  choice: mengambil ... sebagai istri
  rationale: Bentuk Hifil dari ישב secara harfiah berarti membuat tinggal atau menempatkan untuk tinggal. Dalam konteks ini, ungkapan tersebut merujuk pada membawa para perempuan itu ke dalam rumah tangga sebagai istri, tanpa mengganti ungkapan sumber secara langsung dengan “menikahi”.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: perempuan-perempuan asing sebagai istri
  rationale: נָשִׁים dapat berarti perempuan atau istri. Terjemahan ini mempertahankan arti dasar “perempuan-perempuan asing” sambil menyatakan hubungan perkawinan yang dituntut konteks.
- source_word: לְהוֹסִיף
  choice: sehingga menambah
  rationale: Infinitif ini dapat mengungkapkan akibat atau tujuan. “Sehingga menambah” menyampaikan akibat tindakan tersebut secara alami tanpa memastikan nuansa tujuan yang tidak dinyatakan secara tegas.
- source_word: אַשְׁמַת
  choice: kesalahan
  rationale: Dalam konteks ini אַשְׁמָה menunjuk pada keadaan bersalah atau tanggungan kesalahan, bukan persembahan penebus salah.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama ini dipertahankan dan secara kolektif merujuk kepada umat Israel.
theological_decisions:
- issue: Tanggung jawab kesalahan umat secara kolektif
  choice: menambah kesalahan Israel
  alternative: menambah kesalahan mereka sendiri
  rationale: Teks Ibrani secara eksplisit menyatakan bahwa tindakan itu menambah אַשְׁמַת יִשְׂרָאֵל, yaitu kesalahan Israel sebagai umat, bukan hanya kesalahan pribadi para pelaku.
- issue: Sifat hubungan dengan perempuan-perempuan asing
  choice: mengambil perempuan-perempuan asing sebagai istri
  alternative: membuat perempuan-perempuan asing tinggal
  rationale: Konteks pasal menunjukkan hubungan perkawinan. Terjemahan menyatakan hubungan itu, tetapi tetap mencerminkan idiom kausatif sumber dan tidak menambahkan penilaian teologis yang melampaui ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” menyatakan orang kedua jamak dengan jelas. Pengulangan “perempuan-perempuan” dipertahankan untuk menunjukkan bentuk jamak, sedangkan “sehingga” menyampaikan hubungan akibat secara alami.
