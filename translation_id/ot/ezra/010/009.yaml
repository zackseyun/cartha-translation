  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara istilah “rumah Allah” mempertahankan ungkapan sumber bagi Bait Allah. Ambiguitas lokasi lapangan dan nuansa bentuk jamak untuk hujan dijelaskan dalam catatan kaki tanpa dipastikan secara berlebihan dalam teks utama.
