source:
  edition: WLC
  text: וַ/יִּקָּבְצ֣וּ כָל אַנְשֵֽׁי יְהוּדָה֩ וּ/בִנְיָמִ֨ן יְרוּשָׁלִַ֜ם לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים ה֛וּא חֹ֥דֶשׁ הַ/תְּשִׁיעִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ וַ/יֵּשְׁב֣וּ כָל הָ/עָ֗ם בִּ/רְחוֹב֙ בֵּ֣ית הָ/אֱלֹהִ֔ים מַרְעִידִ֥ים עַל הַ/דָּבָ֖ר וּ/מֵ/הַ/גְּשָׁמִֽים־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/009.yaml
  text: So all the men of Judah and Benjamin gathered in Jerusalem within the three days[a]. It was the ninth month, on the twentieth day of the month. And all the people sat in the open square of the house of God[c][b], trembling because of this matter and because of the heavy rain.
translation:
  language: id
  text: Maka semua laki-laki dari Yehuda dan Benyamin[a] berkumpul di Yerusalem dalam batas waktu tiga hari.[b] Saat itu bulan kesembilan, pada hari kedua puluh bulan itu. Seluruh rakyat duduk di lapangan terbuka rumah Allah[c], sambil gemetar karena perkara itu dan karena hujan deras.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibraninya secara gramatikal berarti “semua laki-laki dari Yehuda dan Benyamin” dan kemungkinan menunjuk pada para laki-laki atau wakil keluarga yang dipanggil menghadiri pertemuan itu.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam tiga hari”; konteks sebelumnya menunjukkan bahwa tiga hari itu merupakan batas waktu untuk datang berkumpul.
    reason: lexical_alternative
  - marker: c
    text: Atau “di lapangan di depan rumah Allah.” Kata Ibrani yang dipakai menunjuk pada ruang terbuka yang luas, bukan secara khusus pada pelataran dalam.
    reason: lexical_alternative
  - marker: d
    text: Secara harfiah, “hujan-hujan”; bentuk jamak ini dapat menunjuk pada hujan musiman atau hujan yang deras.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: berkumpul
  rationale: Bentuk Nifal dari קבץ menyatakan bahwa mereka berkumpul atau berhimpun; “berkumpul” paling alami dalam narasi Indonesia.
- source_word: כָל אַנְשֵׁי יְהוּדָה וּבִנְיָמִן
  choice: semua laki-laki dari Yehuda dan Benyamin
  rationale: אַנְשֵׁי secara gramatikal berarti “laki-laki dari”; terjemahan ini mempertahankan cakupan maskulin dari orang-orang yang dipanggil untuk berhimpun.
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: dalam batas waktu tiga hari
  rationale: Ungkapan ini menunjuk pada tenggat tiga hari yang telah ditetapkan sebelumnya; pilihan ini menghindari kesan bahwa perjalanan atau pertemuannya berlangsung selama tiga hari.
- source_word: הוּא חֹדֶשׁ הַתְּשִׁיעִי בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: Saat itu bulan kesembilan, pada hari kedua puluh bulan itu
  rationale: Menyampaikan keterangan kalender Ibrani secara langsung tanpa mengubahnya menjadi nama bulan atau kalender modern.
- source_word: וַיֵּשְׁבוּ
  choice: duduk
  rationale: ישׁב dalam rangkaian naratif ini secara langsung berarti duduk; tidak perlu diperluas menjadi “mengambil tempat duduk”.
- source_word: בִּרְחוֹב בֵּית הָאֱלֹהִים
  choice: di lapangan terbuka rumah Allah
  rationale: רְחוֹב adalah ruang luas atau lapangan terbuka, bukan istilah khusus bagi pelataran dalam Bait Allah; hubungan konstruksi dengan rumah Allah tetap dipertahankan.
- source_word: מַרְעִידִים
  choice: sambil gemetar
  rationale: Partisip Hifil dari רעד menggambarkan keadaan gemetar secara fisik, dengan dua penyebab yang disebut sesudahnya.
- source_word: עַל הַדָּבָר
  choice: karena perkara itu
  rationale: הַדָּבָר menunjuk pada perkara yang sedang dihadapi dalam konteks, tanpa perlu menjelaskan atau menafsirkan isinya di dalam ayat.
- source_word: וּמֵהַגְּשָׁמִים
  choice: dan karena hujan deras
  rationale: Preposisi מִן menyatakan sebab, sedangkan bentuk jamak גְּשָׁמִים dalam konteks musim hujan dapat secara idiomatis menunjuk pada curahan hujan yang deras.
