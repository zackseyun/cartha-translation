lexical_decisions:
- source_word: מִבְּנֵי
  choice: Dari keturunan
  rationale: Gabungan preposisi מִן dan bentuk konstruksi בְּנֵי memperkenalkan sebagian anggota kelompok keluarga Bani. Dalam daftar silsilah, “dari keturunan” mengungkapkan makna partitif secara alami dalam bahasa Indonesia.
- source_word: בָנִי
  choice: Bani
  rationale: Nama diri ditransliterasikan dan dipertahankan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מַעֲדַי
  choice: Maadai
  rationale: Nama diri Ibrani ditransliterasikan tanpa diterjemahkan.
- source_word: עַמְרָם
  choice: Amram
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְאוּאֵל
  choice: dan Uel
  rationale: Konjungsi וְ diterjemahkan “dan”, sedangkan nama אוּאֵל ditransliterasikan sebagai “Uel”.
