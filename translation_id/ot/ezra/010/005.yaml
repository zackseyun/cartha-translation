base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/005.yaml
  text: So Ezra arose and made the chief priests[a], the Levites, and all Israel swear to do according to this word, and they swore.
translation:
  language: id
  text: Lalu Ezra bangkit dan menyuruh para pemimpin imam, orang-orang Lewi, dan seluruh Israel bersumpah untuk melaksanakan perkara ini[a], dan mereka pun bersumpah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesuai dengan perkataan ini” atau “sesuai dengan usul ini.” Kata Ibrani yang digunakan dapat menunjuk pada perkataan yang diucapkan maupun perkara yang sedang dibahas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Bentuk wayyiqtol dari קום menggambarkan Ezra bangkit untuk bertindak; “bangkit” mempertahankan gerak naratif yang tegas dan bernada luhur.
- source_word: וַיַּשְׁבַּע
  choice: menyuruh ... bersumpah
  rationale: Bentuk hiphil dari שׁבע bersifat kausatif, yakni membuat atau meminta orang mengucapkan sumpah. Ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: שָׂרֵי הַכֹּהֲנִים
  choice: para pemimpin imam
  rationale: שָׂרֵי menunjuk kepada para pemimpin atau pejabat di antara para imam. Pilihan ini lebih langsung terhadap susunan Ibrani dan tidak menyamakan istilah tersebut tanpa kepastian dengan jabatan teknis tertentu.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan baku dan mudah dipahami untuk kelompok לְוִיִּם.
- source_word: וְכָל יִשְׂרָאֵל
  choice: dan seluruh Israel
  rationale: Mempertahankan ungkapan kolektif perjanjian dalam teks Ibrani.
- source_word: לַעֲשׂוֹת
  choice: untuk bertindak
  rationale: Dalam konteks sumpah untuk melaksanakan usul yang baru diajukan, “bertindak” menyampaikan daya tindakan dari עשה secara alami, tanpa menambahkan rincian.
- source_word: כַּדָּבָר הַזֶּה
  choice: sesuai dengan perkara ini
  rationale: דָּבָר dapat berarti perkataan, perkara, atau hal. Dalam konteks ini acuannya adalah perkara atau usul yang sedang dibahas; catatan kaki mempertahankan kemungkinan leksikal lainnya.
- source_word: וַיִּשָּׁבֵעוּ
  choice: dan mereka pun bersumpah
  rationale: Bentuk niphal menyatakan bahwa mereka mengucapkan sumpah. “Pun” menandai hasil langsung tanpa menghilangkan pengulangan khidmat dalam bahasa Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang alami, khidmat, dan mudah dipahami. Struktur pengucapan sumpah serta pengulangan pada akhir ayat dipertahankan. “Para pemimpin imam” dipilih untuk menghindari pemaksaan istilah jabatan teknis yang tidak dinyatakan secara eksplisit oleh frasa Ibrani.
