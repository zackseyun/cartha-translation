base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/033.yaml
  text: 'From the sons of Hashum: Mattenai[a], Mattattah, Zabad, Eliphelet, Jeremai, Manasseh, and Shimei.'
translation:
  language: id
  text: 'Dari keturunan Hasum: Matnai, Matata[a], Zabad, Elifelet, Yeremai, Manasye, dan Simei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dapat ditransliterasikan sebagai “Matattah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי חָשֻׁם
  choice: Dari keturunan Hasum
  rationale: Dalam konteks daftar ini, frasa tersebut memperkenalkan orang-orang yang berasal dari kelompok keluarga Hasum. “Keturunan” lebih alami dalam bahasa Indonesia modern daripada terjemahan harfiah “anak-anak” atau istilah tradisional “bani”.
- source_word: מַתְּנַי
  choice: Matnai
  rationale: Nama diri ditransliterasikan secara ringkas sesuai pola yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מַתַּתָּה
  choice: Matata
  rationale: Nama diri ditransliterasikan mengikuti bentuk Ibrani dan kebiasaan ejaan Indonesia; bentuk Matatah juga mungkin jika huruf akhir ה ditampilkan dalam transliterasi.
- source_word: זָבָד
  choice: Zabad
  rationale: Transliterasi langsung nama diri Ibrani.
- source_word: אֱלִיפֶלֶט
  choice: Elifelet
  rationale: Transliterasi nama diri dengan “f” untuk bunyi pe tanpa dages, sesuai ejaan Indonesia.
- source_word: יְרֵמַי
  choice: Yeremai
  rationale: Transliterasi nama diri dengan “Y” untuk yod awal, sesuai ejaan Indonesia.
- source_word: מְנַשֶּׁה
  choice: Manasye
  rationale: Mengikuti bentuk nama yang sudah dikenal dalam tradisi Alkitab bahasa Indonesia.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Mengikuti bentuk nama yang lazim dan mudah dikenali oleh pembaca Alkitab bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur daftar dipertahankan, sementara “keturunan” dipilih agar hubungan keluarga terdengar alami bagi pembaca umum. Tanda akhir ס pada teks WLC merupakan penanda pembagian teks (setumah), bukan bagian dari isi ayat.
