lexical_decisions:
- source_word: עֲזַרְאֵל
  choice: Azarel
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan. Bentuk “Azarel” mempertahankan unsur dan pola nama Ibrani secara jelas dan wajar dalam bahasa Indonesia.
- source_word: וְ/שֶׁלֶמְיָהוּ
  choice: dan Selemya
  rationale: Konjungsi וְ diterjemahkan “dan”. Nama שֶׁלֶמְיָהוּ ditransliterasikan sebagai “Selemya”, bentuk yang alami bagi pembaca Indonesia dan mewakili bentuk nama Ibrani tanpa mempertahankan akhiran -yahu secara penuh.
- source_word: שְׁמַרְיָה
  choice: Semarya
  rationale: Nama diri ditransliterasikan sebagai “Semarya”, mengikuti bunyi konsonan Ibrani dan pola ejaan nama yang mudah dibaca dalam bahasa Indonesia.
