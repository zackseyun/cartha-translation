  text: וּ/בְנֵ֖י חָרִ֑ם אֱלִיעֶ֧זֶר יִשִּׁיָּ֛ה מַלְכִּיָּ֖ה שְׁמַֽעְיָ֥ה שִׁמְעֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/031.yaml
  text: 'And from the sons of Harim: Eliezer[a], Isshijah, Malkijah, Shemaiah[c][b], and Shimeon.'
translation:
  language: id
  text: 'Dan dari keturunan Harim[a]: Eliezer, Yisia[b], Malkia, Semaya, dan Simeon[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Dan keturunan Harim: Eliezer, Yisia, Malkia, Semaya, dan Simeon,” jika frasa ini dipahami hanya sebagai judul bagi daftar, tanpa menambahkan gagasan “dari”.'
    reason: lexical_alternative
  - marker: b
    text: Nama ini juga dapat ditransliterasikan “Isia” atau “Yisyia”.
    reason: lexical_alternative
  - marker: c
    text: Bentuk yang lebih langsung mencerminkan bunyi awal nama Ibrani ialah “Syimeon”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Dan dari keturunan
  rationale: Konjungsi וּ diterjemahkan “Dan”, sedangkan bentuk konstruksi jamak בְנֵי secara harfiah berarti “anak-anak lelaki dari”. Dalam konteks daftar anggota kaum, “dari keturunan” secara alami menunjukkan orang-orang yang berasal dari keluarga Harim tanpa membatasi maknanya pada putra langsung.
- source_word: חָרִם
  choice: Harim
  rationale: Nama keluarga atau leluhur ditransliterasikan sebagai “Harim”, sesuai bentuk Ibrani dan pemakaian nama Alkitab yang lazim dalam bahasa Indonesia.
- source_word: אֱלִיעֶזֶר
  choice: Eliezer
  rationale: Bentuk “Eliezer” sudah lazim dalam bahasa Indonesia dan mencerminkan nama Ibrani dengan baik.
- source_word: יִשִּׁיָּה
  choice: Yisia
  rationale: Nama Ibrani ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia. Ejaan Ibrani memungkinkan variasi penyajian, yang dicatat dalam catatan kaki.
- source_word: מַלְכִּיָּה
  choice: Malkia
  rationale: Transliterasi Indonesia yang lugas; unsur akhir יָה disajikan sebagai “-ia”, sebagaimana lazim pada banyak nama Alkitab Indonesia.
- source_word: שְׁמַעְיָה
  choice: Semaya
  rationale: Bentuk Indonesia yang alami dan dikenal, dengan שׁ awal disesuaikan menjadi “s” serta unsur nama ilahi di akhir disajikan sebagai “-ya”.
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: “Simeon” merupakan bentuk tradisional yang paling dikenal dalam bahasa Indonesia, walaupun “Syimeon” lebih langsung memperlihatkan bunyi שׁ Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat, sesuai bentuk ayat yang merupakan daftar nama. “Keturunan” dipilih daripada “anak-anak lelaki” karena konteksnya adalah kelompok keluarga atau kaum, sedangkan semua nama memakai bentuk yang mudah dibaca oleh pembaca Indonesia modern.
