id: EZR.10.11
reference: Ezra 10:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה תְּנ֥וּ תוֹדָ֛ה לַ/יהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם וַ/עֲשׂ֣וּ רְצוֹנ֑/וֹ וְ/הִבָּֽדְלוּ֙ מֵ/עַמֵּ֣י הָ/אָ֔רֶץ וּ/מִן הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/011.yaml
  text: So now give praise to Yahweh[a], the God of your fathers, and do his will[b]. Separate yourselves from the peoples of the land and from the foreign women.
translation:
  language: id
  text: Jadi sekarang, berilah pujian[a] kepada Yahweh, Allah nenek moyang kalian, dan lakukanlah kehendak-Nya. Pisahkanlah diri kalian dari bangsa-bangsa di negeri itu dan dari perempuan-perempuan asing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengakulah kepada Yahweh.” Ungkapan Ibrani ini dapat berarti memberikan syukur atau pujian, tetapi dalam konteks ini juga dapat menunjuk pada pengakuan.
    reason: alternative_reading
  - marker: b
    text: Atau “istri-istri asing.” Konteks yang lebih luas membicarakan perkawinan, meskipun teks Ibrani ayat ini berbunyi “perempuan-perempuan asing.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ תוֹדָה
  choice: berilah pujian
  rationale: Ungkapan Ibrani ini secara harfiah menyuruh orang memberikan syukur atau pujian, tetapi dalam konteks pengakuan kesalahan juga dapat bermakna mengaku dosa. Teks utama mempertahankan nuansa pujian, sedangkan kemungkinan pengakuan dosa dicatat dalam catatan kaki.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama diri dalam teks sumber tetap tampak.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Allah nenek moyang kalian
  rationale: “Nenek moyang” adalah ungkapan Indonesia yang alami dan tepat untuk para leluhur yang dimaksud oleh bentuk jamak אָבוֹת; “kalian” mempertahankan sapaan orang kedua jamak.
- source_word: וַעֲשׂוּ רְצוֹנוֹ
  choice: dan lakukanlah kehendak-Nya
  rationale: Terjemahan ini mempertahankan bentuk perintah serta arti רָצוֹן sebagai kehendak atau apa yang dikehendaki Allah.
- source_word: וְהִבָּדְלוּ
  choice: Pisahkanlah diri kalian
  rationale: 'Bentuk Niphal imperatif di sini memiliki daya refleksif: umat diperintahkan untuk memisahkan diri mereka sendiri.'
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: dari bangsa-bangsa negeri ini
  rationale: Bentuk jamak עַמֵּי dipertahankan sebagai “bangsa-bangsa”; “negeri ini” menyampaikan הָאָרֶץ secara alami tanpa menentukan identitas bangsa-bangsa tersebut lebih jauh.
- source_word: וּמִן הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: dan dari perempuan-perempuan asing
  rationale: Teks ayat ini menyebut “perempuan-perempuan asing,” bukan secara eksplisit “istri-istri,” meskipun konteks pasal menunjukkan bahwa para istri asing sedang dibicarakan. Alternatif kontekstual itu dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Apakah תְּנוּ תוֹדָה berarti memberikan pujian atau mengaku dosa
  choice: berilah pujian
  alternative: mengakulah di hadapan Yahweh
  rationale: Makna dasar ungkapan ini berkaitan dengan syukur atau pujian, tetapi konteks pertobatan dan pemutusan perkawinan terlarang memungkinkan makna pengakuan dosa. Ambiguitas dipertahankan melalui catatan kaki, bukan diselesaikan secara diam-diam.
- issue: Apakah הַנָּשִׁים הַנָּכְרִיּוֹת harus diterjemahkan sebagai perempuan asing atau istri asing
  choice: perempuan-perempuan asing
  alternative: istri-istri asing
  rationale: Pilihan utama mengikuti bentuk leksikal ayat dengan cermat, sementara alternatif mencerminkan konteks perkawinan dalam pasal ini tanpa memasukkannya secara tersirat ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kalian” memperjelas bahwa semua perintah ditujukan kepada orang kedua jamak. Kapitalisasi pronomina “-Nya” mengikuti kelaziman penulisan religius Indonesia.
