translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Istilah ‘kaum keluarga’ dipakai untuk unit kekerabatan leluhur, sedangkan ‘bersidang’ membuat konteks administratif jelas. Ambiguitas sintaksis pada וַיִּבָּדְלוּ dipertahankan dalam catatan kaki dan tidak diam-diam diubah menjadi tindakan tunggal Ezra memilih para wakil.
