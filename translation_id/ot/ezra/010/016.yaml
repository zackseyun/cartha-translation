base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/016.yaml
  text: So the sons of the exile did so. And Ezra the priest set apart men, heads of fathers’ houses according to their fathers’ houses, all of them by name; and they sat down on the first day of the tenth month to investigate the matter.
translation:
  language: id
  text: Maka kaum buangan[a] melakukan demikian. Ezra, imam itu, dan orang-orang—para kepala keluarga menurut kelompok keluarga leluhur mereka—semuanya disebutkan menurut nama[b], memisahkan diri[c]. Pada hari pertama bulan kesepuluh, mereka duduk untuk menyelidiki perkara itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak pembuangan”; ini adalah sebutan kolektif bagi komunitas orang buangan yang telah kembali.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kepala-kepala leluhur menurut rumah leluhur mereka”; ungkapan ini menunjuk kepada para pemimpin kelompok keluarga atau marga. Frasa “semuanya disebutkan menurut nama” menyatakan bahwa mereka diidentifikasi satu per satu menurut nama.
    reason: cultural_note
  - marker: c
    text: 'Atau, “dipisahkan” atau “ditetapkan terpisah”. Bentuk kata kerja Ibrani ini berbentuk jamak dan susunannya dapat dipahami berbeda-beda: Ezra dan para kepala keluarga itu dapat dipandang sebagai pihak-pihak yang memisahkan diri, atau sebagai orang-orang yang ditetapkan terpisah untuk tugas ini.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי הַגּוֹלָה
  choice: kaum buangan
  rationale: Ungkapan harfiahnya berarti ‘anak-anak pembuangan’, tetapi merupakan sebutan kolektif bagi komunitas orang buangan yang telah kembali. ‘Kaum buangan’ mempertahankan identitas kolektif itu dalam bahasa Indonesia yang wajar.
- source_word: וַיִּבָּדְלוּ
  choice: memisahkan diri
  rationale: Bentuk Nifal jamak paling langsung berarti ‘memisahkan diri’ atau ‘dipisahkan’. Susunan Ibrani memungkinkan Ezra dan para kepala keluarga menjadi subjek bersama; karena itu terjemahan tidak mengubah verba tersebut menjadi tindakan Ezra memilih orang lain.
- source_word: עֶזְרָא הַכֹּהֵן
  choice: Ezra sang imam
  rationale: Teks hanya menyebut Ezra sebagai imam; gelar ‘ahli kitab’ tidak ditambahkan dari konteks lain.
- source_word: אֲנָשִׁים רָאשֵׁי הָאָבוֹת לְבֵית אֲבֹתָם
  choice: beberapa orang laki-laki yang menjadi kepala kaum keluarga menurut keluarga leluhur masing-masing
  rationale: ‘Orang laki-laki’ mewakili אֲנָשִׁים, sedangkan ‘kepala kaum keluarga’ menyampaikan struktur sosial rumah leluhur tanpa memakai ungkapan Indonesia yang kaku seperti ‘rumah-rumah bapa’.
- source_word: וְכֻלָּם בְּשֵׁמוֹת
  choice: mereka semua telah ditentukan namanya
  rationale: Frasa ini menunjukkan bahwa setiap anggota kelompok dikenali atau didaftarkan secara khusus menurut nama.
- source_word: וַיֵּשְׁבוּ
  choice: mereka mulai bersidang
  rationale: Secara harfiah berarti ‘mereka duduk’, tetapi dalam konteks penyelidikan administratif menunjuk pada duduk bersama untuk menjalankan sidang. ‘Mulai bersidang’ menyampaikan fungsi kontekstualnya.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הָעֲשִׂירִי
  choice: pada hari pertama bulan kesepuluh
  rationale: Ungkapan Ibrani ‘hari satu’ adalah cara lazim menyatakan hari pertama suatu bulan.
- source_word: לְדַרְיוֹשׁ הַדָּבָר
  choice: untuk menyelidiki perkara itu
  rationale: דרש dalam konteks ini berarti mencari tahu atau memeriksa secara saksama, dan הַדָּבָר menunjuk pada perkara yang sedang ditangani.
