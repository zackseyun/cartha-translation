revisions:
- from: Maka kaum buangan[a] melakukan hal itu. Ezra sang imam dan beberapa orang laki-laki yang menjadi kepala kaum keluarga menurut keluarga leluhur masing-masing[b] memisahkan diri[c]; mereka semua telah ditentukan namanya. Pada hari pertama bulan kesepuluh, mereka mulai bersidang untuk menyelidiki perkara itu.
  to: Maka kaum buangan[a] melakukan demikian. Ezra, imam itu, dan orang-orang—para kepala keluarga menurut kelompok keluarga leluhur mereka—semuanya disebutkan menurut nama[b], memisahkan diri[c]. Pada hari pertama bulan kesepuluh, mereka duduk untuk menyelidiki perkara itu.
  rationale: Revisi mengoreksi pengertian frasa ‘semuanya menurut nama’, menghapus nuansa tambahan ‘mulai’, dan melunakkan penjelasan atas sintaks Ibrani yang tidak pasti. Terjemahan utama mempertahankan pembacaan refleksif yang tersedia dalam bentuk Nifal sambil mencatat alternatif pasif/penetapan, sehingga tidak memaksakan satu analisis sintaktis yang diperdebatkan.
