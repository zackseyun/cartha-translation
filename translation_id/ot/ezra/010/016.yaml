  naturalness: Teks revisi memakai Bahasa Indonesia baku dan lebih lancar. 'Duduk untuk menyelidiki' tetap dekat dengan metafora Ibrani dalam konteks administratif dan tidak menambahkan aspek 'mulai' yang tidak dinyatakan oleh teks.
  terminology: '''Kaum buangan'' wajar sebagai sebutan kolektif. ''Ezra, imam itu'' menerjemahkan gelar definitif Ibrani tanpa menambahkan ''ahli kitab''. ''Para kepala keluarga menurut kelompok keluarga leluhur mereka'' menyampaikan struktur kekerabatan tanpa mempertahankan ungkapan harfiah yang kaku.'
