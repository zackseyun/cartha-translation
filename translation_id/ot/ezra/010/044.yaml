translation:
  language: id
  text: Semua orang ini telah memperistri perempuan asing, dan beberapa di antara mereka mempunyai istri yang telah melahirkan anak-anak bagi mereka.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dan di antara mereka ada istri-istri, dan mereka menempatkan anak-anak lelaki.” Bagian akhir teks Ibrani sangat padat dan maknanya agak sulit dipastikan.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “anak-anak lelaki”; di sini diterjemahkan “anak-anak” karena dalam konteks kata itu dapat menunjuk kepada keturunan secara umum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נשא/י נָשִׁים
  choice: telah memperistri
  rationale: Dalam ungkapan ini, נשׂא dengan objek ‘perempuan’ menyatakan tindakan mengambil perempuan sebagai istri. ‘Memperistri’ menyampaikan makna perkawinan secara alami dan ringkas dalam bahasa Indonesia.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: perempuan asing
  rationale: Ungkapan ini menunjuk kepada perempuan dari luar umat atau komunitas perjanjian. ‘Perempuan asing’ mempertahankan pembedaan tersebut tanpa menyiratkan bahwa mereka sekadar tidak dikenal.
- source_word: וְיֵשׁ מֵהֶם נָשִׁים
  choice: dan beberapa dari mereka mempunyai istri
  rationale: Susunan Ibrani bersifat eksistensial dan padat. Terjemahan ini menyatakan secara wajar bahwa di antara para lelaki tersebut ada yang mempunyai istri dalam keadaan yang kemudian dijelaskan.
- source_word: וַיָּשִׂימוּ בָּנִים
  choice: yang telah melahirkan anak-anak
  rationale: Ungkapan Ibrani pada akhir ayat sulit dan eliptis; terjemahan harfiah dengan ‘menaruh/menempatkan’ tidak jelas dalam bahasa Indonesia. Dalam konteks, klausa itu menyatakan bahwa perkawinan tersebut telah menghasilkan keturunan.
- source_word: בָּנִים
  choice: anak-anak
  rationale: Kata ini secara bentuk berarti ‘anak-anak lelaki’, tetapi dapat dipakai lebih luas untuk keturunan. Konteks menyoroti adanya keturunan dari perkawinan itu, bukan jenis kelamin mereka; arti yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Memperistri’ dipilih karena jelas menyatakan relasi perkawinan, sedangkan bentuk akhir yang sulit diterjemahkan secara kontekstual sambil mempertahankan ketidakpastian teks dalam catatan kaki.
