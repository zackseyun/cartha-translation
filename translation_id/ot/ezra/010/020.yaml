  text: 'Dan dari keturunan Imer: Hanani dan Zebaja.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Dari antara keturunan
  rationale: Gabungan וּמִן dengan bentuk konstruksi בְּנֵי memperkenalkan orang-orang dari kelompok keluarga berikutnya. Dalam konteks daftar, “dari antara keturunan” menyampaikan fungsi partitif dan hubungan genealogis secara alami dalam bahasa Indonesia; konjungsi ו dapat tidak dinyatakan karena ayat ini merupakan kelanjutan langsung dari daftar.
- source_word: אִמֵּר
  choice: Imer
  rationale: Nama keluarga imam ditransliterasikan dengan ejaan Indonesia yang wajar dan selaras dengan bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: חֲנָנִי
  choice: Hanani
  rationale: Nama diri ditransliterasikan sebagai Hanani.
- source_word: וּ/זְבַדְיָה
  choice: dan Zebaja
  rationale: Konjungsi prefiks diterjemahkan “dan” untuk menghubungkan nama terakhir; nama זְבַדְיָה ditransliterasikan dalam bentuk Indonesia yang lazim, Zebaja.
