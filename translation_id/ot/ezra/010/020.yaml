translation_notes:
  register: Bahasa ringkas dan bermartabat sesuai bentuk daftar nama. “Keturunan” dipilih daripada “anak-anak” karena בְּנֵי di sini menunjuk anggota suatu keluarga imam, bukan harus anak biologis langsung.
