  text: 'Dan dari para penyanyi: Elyasib; dan dari para penjaga gerbang: Salum, Telem, dan Uri.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן
  choice: dan dari antara
  rationale: Gabungan kata penghubung dan preposisi ini menambahkan kelompok lain dalam daftar; bentuk ini dipertahankan pada penyebutan kelompok kedua, sedangkan pada awal ayat kata penghubung tidak perlu ditampilkan dalam bahasa Indonesia.
- source_word: הַמְשֹׁרְרִים
  choice: para penyanyi
  rationale: Partisip dari שׁיר menunjuk kepada orang-orang yang bertugas sebagai penyanyi, khususnya dalam pelayanan ibadah.
- source_word: אֶלְיָשִׁיב
  choice: Elyasib
  rationale: Nama Ibrani ditransliterasikan dengan ejaan yang wajar dalam bahasa Indonesia.
- source_word: הַשֹּׁעֲרִים
  choice: para penjaga pintu gerbang
  rationale: Dalam konteks pelayanan Bait Allah, istilah ini menunjuk kepada petugas yang menjaga pintu-pintu gerbang.
- source_word: שַׁלֻּם
  choice: Salum
  rationale: Nama Ibrani ditransliterasikan dengan ejaan yang wajar dalam bahasa Indonesia.
- source_word: טֶלֶם
  choice: Telem
  rationale: Nama pribadi ditransliterasikan secara langsung.
- source_word: אוּרִי
  choice: Uri
  rationale: Nama pribadi ditransliterasikan secara langsung.
