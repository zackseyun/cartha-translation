  text: וּ/מִ/בְּנֵ֛י פַּחַ֥ת מוֹאָ֖ב עַדְנָ֣א וּ/כְלָ֑ל בְּנָיָ֤ה מַעֲשֵׂיָה֙ מַתַּנְיָ֣ה בְצַלְאֵ֔ל וּ/בִנּ֖וּי וּ/מְנַשֶּֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/030.yaml
  text: 'And from the sons of Pahath-moab: Adna, Chelal, Benaiah, Maaseiah, Mattaniah, Bezalel, Binnui, and Manasseh.'
translation:
  language: id
  text: 'Dari antara keturunan Pahat-Moab: Adna, Kelal, Benaya, Maaseya, Matanya, Bezaleel, Binui, dan Manasye.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Dari antara keturunan
  rationale: Dalam daftar silsilah ini, בְּנֵי menunjuk pada anggota atau keturunan suatu kaum, bukan semata-mata anak kandung. Ungkapan ini juga mencerminkan prefiks מִן dengan wajar dalam bahasa Indonesia; waw penghubung tidak perlu diterjemahkan secara mekanis pada awal ayat.
- source_word: פַּחַת מוֹאָב
  choice: Pahat-Moab
  rationale: Nama kaum ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia, dengan tanda hubung untuk mempertahankan kesatuan nama majemuk.
- source_word: עַדְנָא
  choice: Adna
  rationale: Nama diri ditransliterasikan secara langsung dan wajar dalam bahasa Indonesia.
- source_word: וּ/כְלָל
  choice: Kelal
  rationale: Huruf כ ditransliterasikan dengan k, sesuai bunyinya dan kebiasaan bahasa Indonesia; waw di sini menghubungkan unsur daftar dan tidak harus diulang sebagai 'dan' sebelum setiap nama.
- source_word: בְּנָיָה
  choice: Benaya
  rationale: Bentuk Indonesia yang alami bagi nama Ibrani Bənāyāh, tanpa mempertahankan akhiran ejaan Inggris -iah.
- source_word: מַעֲשֵׂיָה
  choice: Maaseya
  rationale: Transliterasi Indonesia mempertahankan rangkaian vokal nama dan unsur akhir -ya(h) tanpa mengikuti ejaan Inggris.
- source_word: מַתַּנְיָה
  choice: Matanya
  rationale: Bentuk ini mencerminkan nama Ibrani secara wajar dalam ortografi Indonesia; penggandaan konsonan Ibrani tidak perlu ditandai dengan dua huruf t.
- source_word: בְצַלְאֵל
  choice: Bezaleel
  rationale: Dipakai bentuk nama yang telah dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: וּ/בִנּוּי
  choice: Binui
  rationale: Transliterasi Indonesia tidak perlu menandai penggandaan konsonan dengan dua n; waw berfungsi sebagai penghubung dalam daftar.
- source_word: וּ/מְנַשֶּׁה
  choice: dan Manasye
  rationale: Nama ditampilkan dalam bentuk Indonesia yang lazim, sedangkan waw diterjemahkan sebagai 'dan' untuk menandai unsur terakhir daftar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. 'Keturunan' dipilih daripada 'anak-anak' karena konteksnya adalah kelompok keluarga atau kaum dalam sebuah daftar nama. Ejaan nama mengikuti pola transliterasi Indonesia dan, bila sesuai, bentuk yang telah dikenal pembaca Alkitab Indonesia.
