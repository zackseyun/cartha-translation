base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/023.yaml
  text: 'And from the Levites: Jozabad[a], Shimei, Keliah (that is, Kelita), Pethahiah, Judah, and Eliezer.'
translation:
  language: id
  text: 'Dari antara orang Lewi: Yozabad, Simei, Kelaya (yaitu Kelita), Petahya, Yehuda, dan Eliezer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַלְוִיִּם
  choice: Dari antara orang Lewi
  rationale: Ungkapan ini memperkenalkan kelompok orang Lewi dalam daftar yang lebih besar. 'Dari antara' mempertahankan makna partitif מִן secara alami dalam bahasa Indonesia.
- source_word: יוֹזָבָד
  choice: Yozabad
  rationale: Nama pribadi ditransliterasikan sesuai bentuk Ibrani dan kebiasaan penamaan Alkitab dalam bahasa Indonesia.
- source_word: וְשִׁמְעִי
  choice: Simei
  rationale: Transliterasi nama pribadi yang lazim dan mudah dikenali pembaca Indonesia.
- source_word: וְקֵלָיָה הוּא קְלִיטָא
  choice: Kelaya—yaitu Kelita—
  rationale: Kata ganti הוּא berfungsi menjelaskan atau menyamakan kedua bentuk nama tersebut. 'Yaitu' mempertahankan identifikasi eksplisit tanpa menentukan lebih jauh apakah Kelita merupakan nama lain atau variasi nama.
- source_word: פְּתַחְיָה
  choice: Petahya
  rationale: Transliterasi yang dekat dengan bentuk Ibrani dan alami dalam ejaan Indonesia.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Konteks menunjukkan nama seorang individu; bentuk Ibrani ditransliterasikan secara konsisten.
- source_word: וֶאֱלִיעֶזֶר
  choice: dan Eliezer
  rationale: Bentuk konsonantal dan vokalisasinya mendukung Eliezer; konjungsi akhir diterjemahkan dengan 'dan'.
