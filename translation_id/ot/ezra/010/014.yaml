- from: Kiranya para pemimpin kita bertindak mewakili seluruh jemaah. Hendaklah setiap orang di kota-kota kita yang telah mengambil istri asing[a] datang pada waktu-waktu yang ditentukan, bersama para tua-tua dan hakim-hakim dari kotanya, sampai murka Allah kita yang menyala-nyala dijauhkan dari kita dalam perkara ini.[b]
  to: Kiranya para pemimpin kita bertindak bagi seluruh jemaah. Hendaklah setiap orang di kota-kota kita yang telah mengambil perempuan asing sebagai istri[a] datang pada waktu-waktu yang ditentukan, bersama para tua-tua setiap kota dan para hakimnya, sampai murka Allah kita yang menyala-nyala berbalik dari kita dalam perkara ini.[b]
