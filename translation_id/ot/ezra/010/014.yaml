source:
  edition: WLC
  text: יַֽעֲמְדוּ נָ֣א שָׂ֠רֵי/נוּ לְֽ/כָל הַ/קָּהָ֞ל וְ/כֹ֣ל אֲשֶׁ֣ר בֶּ/עָרֵ֗י/נוּ הַ/הֹשִׁ֞יב נָשִׁ֤ים נָכְרִיּוֹת֙ יָבֹא֙ לְ/עִתִּ֣ים מְזֻמָּנִ֔ים וְ/עִמָּ/הֶ֛ם זִקְנֵי עִ֥יר וָ/עִ֖יר וְ/שֹׁפְטֶ֑י/הָ עַ֠ד לְ/הָשִׁ֞יב חֲר֤וֹן אַף אֱלֹהֵ֨י/נוּ֙ מִמֶּ֔/נּוּ עַ֖ד לַ/דָּבָ֥ר הַ/זֶּֽה־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/014.yaml
  text: Please let our leaders stand for the whole assembly[a], and let everyone in our cities who has taken foreign wives come at appointed times, with them the elders of each city and its judges[b], until the burning anger of our God is turned back from us in this matter.
translation:
  language: id
  text: Kiranya para pemimpin kita bertindak bagi seluruh jemaah. Hendaklah setiap orang di kota-kota kita yang telah mengambil perempuan asing sebagai istri[a] datang pada waktu-waktu yang ditentukan, bersama para tua-tua setiap kota dan para hakimnya, sampai murka Allah kita yang menyala-nyala berbalik dari kita dalam perkara ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibrani ini berarti “membuat perempuan-perempuan asing tinggal” atau “menempatkan mereka dalam rumah tangga”; maksudnya ialah mengambil perempuan asing sebagai istri. Dapat juga diterjemahkan “yang telah menikahi perempuan asing.”
    reason: lexical_alternative
  - marker: b
    text: Frasa Ibrani pada bagian akhir sangat ringkas. Dapat juga diterjemahkan “sampai murka Allah kita yang menyala-nyala berbalik dari kita sehubungan dengan perkara ini.”
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲמְדוּ נָא שָׂרֵינוּ לְכָל הַקָּהָל
  choice: Kiranya para pemimpin kita bertindak mewakili seluruh jemaah
  rationale: Partikel נָא memberi nuansa usul atau permohonan yang sopan, sedangkan עמד dengan לְכָל הַקָּהָל dalam konteks administratif menyatakan bahwa para pemimpin mengambil posisi untuk mewakili seluruh jemaah. 'Bertindak mewakili' menyampaikan fungsi itu secara wajar dalam bahasa Indonesia.
- source_word: הַהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: yang telah mengambil istri asing
  rationale: Ungkapan dengan bentuk kausatif ישׁב secara harfiah berbicara tentang membuat perempuan asing tinggal dalam rumah tangga, tetapi dalam konteks ini menunjuk pada pengambilan mereka sebagai istri. Pilihan ini mempertahankan idiom sumber tanpa menyiratkan rincian upacara pernikahan yang tidak dinyatakan.
- source_word: לְעִתִּים מְזֻמָּנִים
  choice: pada waktu-waktu yang ditentukan
  rationale: Frasa ini menunjuk pada waktu resmi yang telah dijadwalkan untuk penanganan perkara-perkara tersebut.
- source_word: זִקְנֵי עִיר וָעִיר וְשֹׁפְטֶיהָ
  choice: para tua-tua dan hakim-hakim dari kotanya
  rationale: Bentuk distributif עִיר וָעִיר berarti setiap kota. Bentuk tunggal 'kotanya' selaras dengan 'setiap orang' dan memperjelas bahwa pejabat setempat menyertai orang dari kota mereka.
- source_word: חֲרוֹן אַף אֱלֹהֵינוּ
  choice: murka Allah kita yang menyala-nyala
  rationale: Ungkapan Ibrani menggambarkan kemarahan yang berkobar. 'Murka ... yang menyala-nyala' mempertahankan metafora dan bobot teologisnya dalam ragam bahasa yang bermartabat.
- source_word: עַד לְהָשִׁיב ... מִמֶּנּוּ
  choice: sampai ... dijauhkan dari kita
  rationale: Bentuk ini menyatakan tujuan atau batas waktu hingga murka itu berbalik atau disingkirkan. Bentuk pasif tidak menentukan pelaku secara lebih khusus daripada teks sumber.
- source_word: עַד לַדָּבָר הַזֶּה
  choice: dalam perkara ini
  rationale: Frasa penutup menghubungkan murka ilahi dan proses penyelesaiannya dengan perkara yang sedang ditangani. Terjemahan ini mempertahankan hubungan itu tanpa mencoba menyelesaikan secara berlebihan konstruksi Ibraninya yang ringkas.
theological_decisions:
- issue: Bahasa tentang murka ilahi
  choice: murka Allah kita yang menyala-nyala
  alternative: kemarahan Allah kita yang hebat
  rationale: Teks secara eksplisit menyebut murka Allah sebagai tanggapan terhadap pelanggaran umat. Terjemahan mempertahankan gambaran kuat itu tanpa melunakkannya atau memasukkan kerangka doktrinal tambahan.
- issue: Cara murka ilahi berakhir
  choice: dijauhkan dari kita
  alternative: berbalik dari kita
  rationale: Konstruksi Ibrani dapat digambarkan sebagai murka yang dikembalikan atau dialihkan. Bentuk pasif mempertahankan hasil yang dinyatakan teks tanpa menentukan mekanisme atau pelakunya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada resmi dan bermartabat. 'Jemaah', 'para tua-tua', dan 'hakim-hakim' dipertahankan untuk konteks komunitas serta administrasi Israel pascapembuangan; susunan kalimat dibuat alami tanpa menghilangkan nuansa usul, proses peradilan setempat, atau bahasa kuat mengenai murka Allah.
