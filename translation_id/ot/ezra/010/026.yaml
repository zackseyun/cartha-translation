  yaml_path: translation/ot/ezra/010/026.yaml
  text: 'And from the sons of Elam: Mattaniah, Zechariah, Jehiel, Abdi, Jeremoth, and Elijah.'
translation:
  language: id
  text: 'Dan dari keturunan Elam: Matanya, Zakharia, Yehiel, Abdi, Yeremot, dan Elia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Dari keturunan
  rationale: Dalam daftar keluarga ini, בְּנֵי menunjuk pada anggota garis keluarga atau kaum, bukan hanya anak kandung langsung. 'Keturunan' menyampaikan maksud itu secara alami dalam bahasa Indonesia; וּ penghubung tidak harus ditampilkan pada awal ayat yang berdiri sendiri.
- source_word: עֵילָם
  choice: Elam
  rationale: Nama leluhur atau kaum ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מַתַּנְיָה
  choice: Matanya
  rationale: Transliterasi Indonesia yang lazim dan mudah dibaca untuk nama Ibrani Mattanyah.
- source_word: זְכַרְיָה
  choice: Zakharia
  rationale: Bentuk Indonesia yang lazim bagi nama Ibrani Zekharyah.
- source_word: וִ/יחִיאֵל
  choice: Yehiel
  rationale: Nama diri ditransliterasikan secara langsung; konjungsi waw diwujudkan melalui tanda baca dalam rangkaian daftar.
- source_word: וְ/עַבְדִּי
  choice: Abdi
  rationale: Dalam struktur daftar ini, bentuk tersebut adalah nama diri, bukan frasa nomina 'hambaku'.
- source_word: וִ/ירֵמוֹת
  choice: Yeremot
  rationale: Transliterasi yang mendekati bunyi Ibrani dan sesuai dengan ejaan Indonesia.
- source_word: וְ/אֵלִיָּה
  choice: Elia
  rationale: Bentuk nama yang mapan dalam bahasa Indonesia untuk Ibrani Eliyyah.
theological_decisions: []
