  text: And they made a proclamation throughout Judah and Jerusalem to all the sons of the exile[a], that they should gather in Jerusalem.
translation:
  language: id
  text: Lalu mereka menyebarkan pengumuman di seluruh Yehuda dan Yerusalem kepada semua anak-anak pembuangan[a], supaya mereka berkumpul di Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “semua anak-anak pembuangan.” Dapat juga diterjemahkan “semua orang buangan”; ungkapan ini dapat merujuk kepada komunitas yang terkait dengan pembuangan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: mereka menyebarkan pengumuman
  rationale: Bentuk Hifil dari עבר bersama קוֹל merupakan ungkapan untuk mengedarkan atau menyampaikan pengumuman. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan nuansa penyebaran pesan resmi.
- source_word: בִּיהוּדָה וִירוּשָׁלִַם
  choice: ke seluruh Yehuda dan Yerusalem
  rationale: Preposisi ב dalam konteks pengumuman yang diedarkan menunjuk wilayah tempat pengumuman itu disebarkan; 'ke seluruh' menyampaikan cakupan distributifnya secara wajar.
- source_word: לְכֹל בְּנֵי הַגּוֹלָה
  choice: kepada semua orang buangan yang telah kembali
  rationale: Secara harfiah frasa ini berarti 'semua anak pembuangan', tetapi merupakan sebutan bagi komunitas orang yang pernah dibuang dan kini berada kembali di Yehuda. Terjemahan ini menyampaikan rujukan komunitas tersebut dengan jelas dan alami tanpa menganggap frasa maskulin itu hanya mencakup laki-laki.
- source_word: לְהִקָּבֵץ
  choice: supaya mereka berkumpul
  rationale: Infinitif Nifal dengan ל menyatakan tujuan atau isi seruan. 'Supaya mereka berkumpul' mengungkapkan fungsi panggilan itu secara jelas.
- source_word: יְרוּשָׁלִָם
  choice: di Yerusalem
  rationale: Sesudah 'berkumpul', bentuk 'di Yerusalem' merupakan ungkapan lokasi pertemuan yang paling alami dalam bahasa Indonesia.
