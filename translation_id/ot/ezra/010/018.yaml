base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/018.yaml
  text: 'And among the sons of the priests who had taken foreign wives[a], there were found from the sons of Jeshua son of Jozadak and his brothers: Maaseiah, Eliezer, Jarib, and Gedaliah.'
translation:
  language: id
  text: 'Di antara keturunan para imam yang telah mengambil istri-istri asing, didapati: dari keturunan Yesua, anak Yozadak, dan saudara-saudaranya, Maaseya, Eliezer, Yarib, dan Gedalya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמָּצֵא
  choice: didapati orang-orang
  rationale: Bentuk Ibrani secara morfologis tunggal, tetapi memperkenalkan daftar beberapa laki-laki. Ungkapan ini mempertahankan nuansa pasif 'didapati' sekaligus menyampaikan rujukan jamaknya secara alami dalam bahasa Indonesia.
- source_word: מִבְּנֵי הַכֹּהֲנִים
  choice: di antara keturunan para imam
  rationale: בְּנֵי secara harfiah berarti 'anak-anak laki-laki', tetapi dalam daftar silsilah menunjuk pada anggota garis keturunan. 'Keturunan' lebih alami dan tidak menyiratkan bahwa mereka semua anak kandung langsung para imam.
- source_word: אֲשֶׁר הֹשִׁיבוּ נָשִׁים נָכְרִיּוֹת
  choice: yang telah mengambil istri asing
  rationale: Dalam konteks Ezra 10, ungkapan ini menunjuk pada ikatan perkawinan dengan perempuan asing. 'Mengambil istri' dekat dengan idiom sumber dan tetap dapat dipahami dalam bahasa Indonesia modern.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: istri asing
  rationale: Kata-katanya dapat diterjemahkan secara lebih harfiah sebagai 'perempuan asing', tetapi konteksnya jelas menyangkut hubungan perkawinan; catatan kaki mempertahankan alternatif leksikal tersebut.
- source_word: מִבְּנֵי יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: dari keturunan Yesua anak Yozadak
  rationale: מִבְּנֵי menandai cabang garis keturunan di dalam kelompok imam. 'Keturunan' menyampaikan fungsi genealogisnya, sedangkan 'anak Yozadak' mempertahankan hubungan langsung yang dinyatakan teks.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: Ini merupakan padanan langsung yang mempertahankan kemungkinan saudara dalam arti keluarga atau kelompok sekerabat tanpa memperluasnya secara tidak perlu.
- source_word: מַעֲשֵׂיָה וֶאֱלִיעֶזֶר וְיָרִיב וּגְדַלְיָה
  choice: Maaseya, Eliezer, Yarib, dan Gedalya
  rationale: Nama-nama pribadi ditransliterasikan dengan bentuk yang wajar dalam tradisi ejaan Alkitab bahasa Indonesia.
