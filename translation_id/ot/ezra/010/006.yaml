id: EZR.10.6
reference: Ezra 10:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֣קָם עֶזְרָ֗א מִ/לִּ/פְנֵי֙ בֵּ֣ית הָֽ/אֱלֹהִ֔ים וַ/יֵּ֕לֶךְ אֶל לִשְׁכַּ֖ת יְהוֹחָנָ֣ן בֶּן אֶלְיָשִׁ֑יב וַ/יֵּ֣לֶךְ שָׁ֗ם לֶ֤חֶם לֹֽא אָכַל֙ וּ/מַ֣יִם לֹֽא שָׁתָ֔ה כִּ֥י מִתְאַבֵּ֖ל עַל מַ֥עַל הַ/גּוֹלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/006.yaml
  text: Then Ezra rose from before the house of God and went to the chamber of Jehohanan son of Eliashib[a]. He went there and ate no bread and drank no water[c][b], because he was mourning over the unfaithfulness of the exiles.
translation:
  language: id
  text: Lalu Ezra bangkit dari hadapan rumah Allah dan pergi ke bilik Yehokhanan anak Elyasib.[a] Ia pergi ke sana dan tidak makan roti ataupun minum air, sebab ia berkabung atas ketidaksetiaan[b] kaum buangan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dapat ditulis “Yohanan anak Elyasib.”
    reason: lexical_alternative
  - marker: b
    text: “Ketidaksetiaan” juga dapat diterjemahkan “pengkhianatan” atau “pelanggaran kepercayaan.”
    reason: lexical_alternative
  - marker: c
    text: “Kaum buangan” di sini menunjuk kepada komunitas orang buangan yang telah kembali.
    reason: cultural_note
lexical_decisions:
- source_word: מִלִּפְנֵי
  choice: dari hadapan
  rationale: Ungkapan ini mempertahankan gambaran ruang dalam bahasa Ibrani dan sesuai dengan konteks Ezra yang sebelumnya berada di depan rumah Allah.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Terjemahan harfiah ini jelas menunjuk kepada bait Allah dalam konteks Ezra, sekaligus mempertahankan ungkapan dan nada hormat teks sumber.
- source_word: לִשְׁכַּת
  choice: bilik
  rationale: Kata Ibrani ini menunjuk pada suatu ruang dalam kompleks bait atau bangunan resmi; 'bilik' lebih khusus dan khidmat daripada 'kamar'.
- source_word: יְהוֹחָנָן בֶּן אֶלְיָשִׁיב
  choice: Yehokhanan anak Elyasib
  rationale: Nama-nama ditransliterasikan sesuai bentuk Ibrani, sedangkan בֶּן diterjemahkan secara alami sebagai 'anak'.
- source_word: וַיֵּלֶךְ שָׁם
  choice: Ia pergi ke sana
  rationale: Pengulangan kata kerja 'pergi' dipertahankan karena teks Ibrani mengulanginya dan tidak secara tegas mengatakan bahwa Ezra masuk atau menetap di sana.
- source_word: לֶחֶם לֹא אָכַל
  choice: tidak makan roti
  rationale: Teks menyebut roti secara konkret. Walaupun 'roti' dapat mewakili makanan secara umum, bentuk sumber tetap dipertahankan.
- source_word: וּמַיִם לֹא שָׁתָה
  choice: ataupun minum air
  rationale: Objek 'air' dinyatakan secara eksplisit dalam teks sumber dan, bersama ketiadaan makan, menggambarkan puasa penuh.
- source_word: מִתְאַבֵּל
  choice: berkabung
  rationale: Bentuk kata ini menyatakan dukacita mendalam yang dapat disertai tindakan lahiriah seperti berpuasa; 'berkabung' mempertahankan bobot suasana tersebut.
- source_word: מַעַל
  choice: ketidaksetiaan
  rationale: Kata ini menyatakan pelanggaran kepercayaan atau kesetiaan, khususnya dalam hubungan perjanjian. 'Ketidaksetiaan' mempertahankan bobot moral dan teologisnya tanpa mempersempit makna.
- source_word: הַגּוֹלָה
  choice: kaum buangan
  rationale: Istilah ini menunjuk kepada komunitas orang yang mengalami pembuangan, termasuk mereka yang telah kembali. 'Kaum buangan' ringkas dan tetap dekat dengan teks.
theological_decisions:
- issue: Makna מַעַל dalam konteks pelanggaran perjanjian
  choice: ketidaksetiaan
  alternative: pengkhianatan; pelanggaran kepercayaan
  rationale: Pilihan ini menyampaikan kegagalan kesetiaan umat kepada Allah tanpa membatasi istilah itu hanya pada kategori hukum atau emosi.
- issue: Apakah בֵּית הָאֱלֹהִים diterjemahkan secara formal atau dijelaskan sebagai bait
  choice: rumah Allah
  alternative: bait Allah
  rationale: Ungkapan sumber dapat dipahami dalam bahasa Indonesia dan mempertahankan citra Ibrani; konteks sudah menunjukkan bahwa yang dimaksud adalah bait Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan pengulangan naratif bahasa Ibrani tanpa menjadi sukar dipahami; istilah konkret seperti 'rumah', 'bilik', 'roti', dan 'air' tetap dipertahankan.
