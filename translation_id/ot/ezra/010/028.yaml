base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/028.yaml
  text: 'And from the sons of Bebai: Jehohanan[a], Hananiah, Zabbai[b], Athlai.'
translation:
  language: id
  text: 'Dan dari keturunan Bebai[a]: Yehohanan[b], Hananya, Zabai, dan Atlai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Bebai”; ungkapan Ibrani ini dapat merujuk lebih luas kepada keturunan atau anggota keluarga Bebai.
    reason: lexical_alternative
  - marker: b
    text: Nama ini juga sering ditulis dalam bentuk yang lebih ringkas, “Yohanan.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Dan dari keturunan
  rationale: Secara harfiah berarti “dan dari anak-anak,” tetapi dalam konteks daftar keluarga, בְּנֵי dapat menunjuk kepada keturunan atau anggota garis keluarga. “Keturunan” menyampaikan fungsi ungkapan itu secara alami dalam bahasa Indonesia modern, sementara catatan kaki mempertahankan bentuk dan keluasan makna Ibraninya.
- source_word: בֵּבָי
  choice: Bebai
  rationale: Nama pribadi atau keluarga ditransliterasikan dari bahasa Ibrani.
- source_word: יְהוֹחָנָן
  choice: Yehohanan
  rationale: Transliterasi ini mempertahankan bentuk lengkap nama Ibrani beserta unsur awal teoforiknya; bentuk ringkas yang lazim, “Yohanan,” dicatat sebagai alternatif.
- source_word: חֲנַנְיָה
  choice: Hananya
  rationale: Bentuk transliterasi Indonesia yang alami untuk nama Ibrani ini.
- source_word: זַבַּי
  choice: Zabai
  rationale: Nama Ibrani ditransliterasikan dengan ejaan yang wajar dalam bahasa Indonesia.
- source_word: עַתְלָי
  choice: Atlai
  rationale: Nama Ibrani ditransliterasikan langsung dengan ejaan Indonesia yang mudah dibaca.
