  text: אֲבָ֞ל הָ/עָ֥ם רָב֙ וְ/הָ/עֵ֣ת גְּשָׁמִ֔ים וְ/אֵ֥ין כֹּ֖חַ לַ/עֲמ֣וֹד בַּ/ח֑וּץ וְ/הַ/מְּלָאכָ֗ה לֹֽא לְ/י֤וֹם אֶחָד֙ וְ/לֹ֣א לִ/שְׁנַ֔יִם כִּֽי הִרְבִּ֥ינוּ לִ/פְשֹׁ֖עַ בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/013.yaml
  text: But the people are many[a], and it is the rainy season, and there is no strength to stand outside. And the work is not for one day or for two[c][b], for we have greatly transgressed in this matter.
translation:
  language: id
  text: Namun, orang-orang itu banyak jumlahnya, sekarang musim hujan[a], dan kami tidak sanggup berdiri di luar. Pekerjaan ini tidak dapat diselesaikan dalam satu atau dua hari[b], sebab kami telah banyak melakukan pelanggaran dalam perkara ini[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “waktunya adalah waktu hujan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “pekerjaan ini bukan untuk satu hari dan bukan untuk dua hari.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “sebab kami telah sangat melanggar dalam perkara ini.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Namun
  rationale: Menandai pertentangan dengan usul pada ayat sebelumnya secara alami dan tetap formal.
- source_word: הָעָם רָב
  choice: orang-orang ini sangat banyak
  rationale: Menyampaikan bahwa jumlah orang dalam perhimpunan itu besar; bentuk ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'rakyat itu banyak'.
- source_word: וְהָעֵת גְּשָׁמִים
  choice: sekarang musim hujan
  rationale: Ungkapan Ibrani secara harfiah berarti 'waktu hujan'; 'musim hujan' menyampaikan maksudnya secara wajar dalam bahasa Indonesia.
- source_word: וְאֵין כֹּחַ לַעֲמֹד בַּחוּץ
  choice: kami tidak sanggup berdiri di luar
  rationale: Mengungkapkan konstruksi impersonal Ibrani menurut idiom Indonesia dan mempertahankan gagasan tidak mampu bertahan di luar dalam hujan.
- source_word: וְהַמְּלָאכָה
  choice: pekerjaan ini
  rationale: Merujuk pada tugas praktis untuk memeriksa dan menyelesaikan perkara tersebut, bukan khusus pada kerja fisik.
- source_word: לֹא לְיוֹם אֶחָד וְלֹא לִשְׁנַיִם
  choice: tidak dapat diselesaikan dalam satu atau dua hari
  rationale: 'Menyatakan maksud duratif konstruksi Ibrani dengan jelas dan alami: tugas itu memerlukan lebih dari satu atau dua hari.'
- source_word: כִּי הִרְבִּינוּ לִפְשֹׁעַ
  choice: sebab kami telah melakukan pelanggaran besar
  rationale: Hifil dari רבה bersama infinitif פשׁע menekankan besarnya atau banyaknya pelanggaran. Rumusan ini alami dan tidak mengubahnya menjadi klaim eksplisit bahwa 'banyak dari kami' bersalah.
- source_word: בַּדָּבָר הַזֶּה
  choice: dalam perkara ini
  rationale: Padanan idiomatis yang merujuk pada persoalan perkawinan yang sedang dibahas.
theological_decisions:
- issue: Sifat pelanggaran yang dinyatakan oleh לִפְשֹׁעַ
  choice: pelanggaran besar
  alternative: telah banyak berbuat durhaka; telah sangat berdosa
  rationale: פשׁע mengandung gagasan pelanggaran serius dan dapat bernuansa pemberontakan. 'Pelanggaran' mempertahankan bobot moral-perjanjian tanpa menetapkan kategori doktrinal yang tidak dijelaskan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan kalimat dibuat alami, sedangkan catatan kaki mempertahankan bentuk yang lebih harfiah dan nuansa alternatif dari teks Ibrani.
