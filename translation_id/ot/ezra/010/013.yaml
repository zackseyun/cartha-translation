  to: Namun, orang-orang itu banyak jumlahnya, sekarang musim hujan[a], dan kami tidak sanggup berdiri di luar. Pekerjaan ini tidak dapat diselesaikan dalam satu atau dua hari[b], sebab kami telah banyak melakukan pelanggaran dalam perkara ini[c].
