lexical_decisions:
- source_word: וַנְיָה
  choice: Wanya
  rationale: Nama diri ditransliterasikan menurut bunyi Ibrani ke ejaan Indonesia; huruf waw awal diwakili dengan W, dan akhiran -yāh disederhanakan menjadi -ya sesuai bentuk nama yang wajar dalam bahasa Indonesia.
- source_word: מְרֵמוֹת
  choice: Meremot
  rationale: Nama diri ditransliterasikan langsung; huruf taw akhir diwakili dengan t, bukan bentuk Inggris th.
- source_word: אֶלְיָשִׁיב
  choice: Elyasib
  rationale: Nama diri ditransliterasikan dengan y untuk yod dan s untuk syin, mengikuti kebiasaan ejaan nama Ibrani dalam bahasa Indonesia.
