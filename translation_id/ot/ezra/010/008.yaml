  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר לֹֽא יָב֜וֹא לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים כַּ/עֲצַ֤ת הַ/שָּׂרִים֙ וְ/הַ/זְּקֵנִ֔ים יָחֳרַ֖ם כָּל רְכוּשׁ֑/וֹ וְ/ה֥וּא יִבָּדֵ֖ל מִ/קְּהַ֥ל הַ/גּוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/008.yaml
  text: And everyone who does not come within three days[a], according to the counsel of the officials and the elders, all his property shall be forfeited, and he himself shall be separated from the assembly of the exiles.
translation:
  language: id
  text: Setiap orang yang tidak datang dalam waktu tiga hari, sesuai dengan keputusan para pejabat dan para tua-tua, seluruh harta miliknya akan disita[a], dan ia sendiri akan dipisahkan dari perhimpunan orang-orang buangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "akan ditempatkan di bawah herem." Kata kerja Ibrani ini menunjuk pada penempatan di bawah חֵרֶם (herem), suatu larangan atau penyerahan yang tidak dapat ditarik kembali dan dapat mencakup pemusnahan maupun penyitaan.
    reason: Mempertahankan rentang makna istilah teknis חרם, sementara "akan disita" menyampaikan kemungkinan yang paling sesuai dalam konteks hukuman atas harta.
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: Setiap orang yang
  rationale: Mengungkapkan cakupan distributif dari ketentuan umum ini secara wajar dalam bahasa Indonesia.
- source_word: לֹא יָבוֹא
  choice: tidak datang
  rationale: Dalam konteks panggilan resmi, verba ini menunjuk pada ketidakhadiran sebagai tanggapan terhadap panggilan tersebut.
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: dalam waktu tiga hari
  rationale: Menyampaikan batas waktu yang ditetapkan tanpa mempersempitnya secara tidak perlu menjadi tepat pada hari ketiga.
- source_word: כַּעֲצַת
  choice: sesuai dengan keputusan
  rationale: עֵצָה dapat berarti nasihat, pertimbangan, atau keputusan; konteks administratif dan daya mengikat ketetapan ini mendukung 'keputusan'.
- source_word: הַשָּׂרִים וְהַזְּקֵנִים
  choice: para pejabat dan para tua-tua
  rationale: שָׂרִים menunjuk pada pemegang jabatan pemerintahan, sedangkan 'tua-tua' mempertahankan sebutan sosial resmi bagi זְקֵנִים tanpa memodernisasikannya menjadi kategori lain.
- source_word: יָחֳרַם
  choice: akan dikhususkan untuk dimusnahkan
  rationale: Bentuk dari חרם menyatakan penempatan sesuatu di bawah status khusus yang tak dapat ditarik kembali, sering kali menuju pemusnahan. Pilihan ini mempertahankan bobot istilah itu, sementara kemungkinan makna praktis berupa penyitaan dijelaskan dalam catatan kaki.
- source_word: כָּל רְכוּשׁוֹ
  choice: seluruh harta miliknya
  rationale: רְכוּשׁ mencakup harta atau barang kepunyaan; frasa ini jelas dan sesuai dengan konteks hukuman administratif.
- source_word: וְהוּא יִבָּדֵל
  choice: dan ia sendiri akan dipisahkan
  rationale: Kata ganti yang dinyatakan secara eksplisit dipertahankan dengan 'ia sendiri', dan bentuk pasif בדל diterjemahkan tanpa memasukkan gagasan kelembagaan yang tidak disebutkan teks.
- source_word: מִקְּהַל הַגּוֹלָה
  choice: dari perhimpunan orang-orang buangan
  rationale: '''Perhimpunan'' menyampaikan makna קָהָל sebagai kumpulan resmi tanpa konotasi gerejawi yang kuat; הַגּוֹלָה diterjemahkan langsung sebagai komunitas orang-orang buangan.'
theological_decisions:
- issue: Makna hukuman חרם atas harta milik
  choice: Diterjemahkan 'dikhususkan untuk dimusnahkan' dalam teks utama.
  alternative: akan disita; akan ditempatkan di bawah larangan khusus
  rationale: Istilah Ibrani teknis ini lebih kuat daripada penyitaan biasa dan dapat menunjuk pada sesuatu yang dikhususkan secara tidak dapat ditarik kembali, sering kali untuk dimusnahkan. Namun, dalam konteks administratif ini akibat praktisnya mungkin berupa perampasan harta; ambiguitas tersebut dipertahankan dalam catatan kaki.
- issue: Sifat pemisahan dari komunitas
  choice: Diterjemahkan 'dipisahkan dari perhimpunan'.
  alternative: dikeluarkan; dikucilkan
  rationale: Teks menyatakan pemisahan dari perhimpunan kaum buangan, tetapi tidak mendefinisikannya dengan kategori kelembagaan atau gerejawi yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum ayat dipertahankan, tetapi susunan katanya dibuat alami. 'Perhimpunan' dipilih untuk menghindari pembacaan gerejawi yang tidak dinyatakan oleh teks.
