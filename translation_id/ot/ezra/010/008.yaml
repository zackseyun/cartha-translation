  - severity: low
    issue: Ungkapan catatan kaki "ditempatkan di bawah larangan khusus" tidak alami dan kurang menjelaskan istilah teknis.
    rationale: Istilah "herem" dapat dijelaskan secara langsung sebagai penyerahan kepada larangan/ketetapan yang tak dapat ditarik kembali, yang dapat berakibat pemusnahan atau penyitaan.
