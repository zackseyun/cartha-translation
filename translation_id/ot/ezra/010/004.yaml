translation_notes:
  register: Bahasa Indonesia modern yang lugas, mendesak, dan bermartabat. Bentuk imperatif dengan -lah mempertahankan daya seruan teks. Idiom tanggung jawab dibuat jelas dalam teks utama, sedangkan metafora Ibraninya dipertahankan dalam catatan kaki.
