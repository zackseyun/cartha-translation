  yaml_path: translation/ot/ezra/010/004.yaml
  text: Rise up[a], for this matter is on you, and we are with you. Be strong and do it.
translation:
  language: id
  text: Bangkitlah, sebab perkara ini menjadi tanggung jawabmu[a], dan kami bersamamu. Jadilah kuat dan bertindaklah!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perkara ini ada di atasmu”; maksudnya, tanggung jawab untuk menangani perkara ini berada pada Ezra.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּם
  choice: Bangkitlah
  rationale: Bentuk imperatif ini mendesak Ezra untuk segera mengambil tindakan. “Bangkitlah” alami, tegas, dan lebih bermartabat dalam konteks ini daripada “Berdirilah” atau “Bangunlah”.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi perintah sebelumnya; “sebab” mempertahankan hubungan penjelas secara ringkas dan alami.
- source_word: עָלֶיךָ הַדָּבָר
  choice: perkara ini menjadi tanggung jawabmu
  rationale: Ungkapan idiomatis dengan עַל menyatakan bahwa urusan atau kewajiban tersebut dibebankan kepada Ezra. Terjemahan ini menyampaikan maknanya dengan jelas dalam bahasa Indonesia modern; catatan kaki mempertahankan gambaran harfiahnya.
- source_word: וַאֲנַחְנוּ עִמָּךְ
  choice: dan kami menyertaimu
  rationale: Menyatakan kebersamaan, solidaritas, dan dukungan. “Menyertaimu” sesuai dengan konteks dukungan untuk menjalankan tugas.
- source_word: חֲזַק
  choice: Kuatkanlah hatimu
  rationale: Imperatif חזק menyerukan keteguhan dan keberanian untuk bertindak. Ungkapan Indonesia ini lebih alami dalam nasihat langsung daripada “Jadilah kuat,” tanpa membatasi maknanya pada perasaan semata.
- source_word: וַעֲשֵׂה
  choice: dan bertindaklah
  rationale: Imperatif ini menuntut pelaksanaan nyata atas perkara yang sedang dibahas. “Bertindaklah” alami dan tidak perlu menambahkan objek yang hanya tersirat dalam bahasa Ibrani.
