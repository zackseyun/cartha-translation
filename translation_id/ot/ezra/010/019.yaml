  text: They pledged themselves to send away their wives[a], and being guilty[b], they offered a ram from the flock for their guilt.
translation:
  language: id
  text: Mereka berjanji untuk menyuruh istri-istri mereka pergi[a]. Karena mereka bersalah, mereka mempersembahkan seekor domba jantan dari kawanan karena kesalahan mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memberikan tangan mereka,” sebuah ungkapan Ibrani yang berarti memberikan janji atau mengikatkan diri pada suatu kesepakatan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan lebih eksplisit, “mereka mempersembahkan seekor domba jantan dari kawanan sebagai kurban penebus salah atas kesalahan mereka.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנוּ יָדָם
  choice: Mereka berjanji
  rationale: Secara harfiah ungkapan ini berarti “mereka memberikan tangan mereka,” suatu idiom Ibrani untuk memberikan janji atau mengikatkan diri pada suatu kesepakatan. “Mereka berjanji” menyampaikan maknanya secara wajar dalam bahasa Indonesia.
- source_word: לְהוֹצִיא
  choice: untuk menyuruh pergi
  rationale: Bentuk Hifil dari יצא berarti menyebabkan seseorang keluar atau pergi. Dalam konteks ini, ungkapan tersebut menunjuk pada tindakan menyuruh para istri itu pergi, tanpa menambahkan istilah hukum yang tidak dinyatakan langsung.
- source_word: נְשֵׁיהֶם
  choice: istri-istri mereka
  rationale: Dalam konteks perkawinan ini, maknanya adalah “istri-istri,” bukan sekadar “perempuan-perempuan.”
- source_word: וַאֲשֵׁמִים
  choice: Karena bersalah
  rationale: Kata sifat ini menyatakan keadaan mereka sebagai pihak yang bersalah. Susunan ini menghubungkan kesalahan mereka dengan persembahan yang disebut sesudahnya.
- source_word: אֵיל צֹאן
  choice: seekor domba jantan dari kawanan
  rationale: Frasa ini menunjuk pada seekor domba jantan sebagai hewan kurban. “Dari kawanan” alami dalam bahasa Indonesia dan tetap mempertahankan gambaran konkretnya.
- source_word: עַל אַשְׁמָתָם
  choice: sebagai ganti atas kesalahan mereka
  rationale: Frasa ini menyatakan bahwa domba jantan tersebut dipersembahkan berkenaan dengan kesalahan mereka. Pilihan ini menjaga hubungan dengan konsep kurban penebus salah tanpa mengulang kata “bersalah” secara kaku.
theological_decisions:
- issue: Apakah istilah teknis “kurban penebus salah” perlu dinyatakan secara eksplisit dalam teks utama
  choice: Tidak memasukkan istilah teknis itu dalam teks utama; menerjemahkan hubungan kurbannya sebagai “mempersembahkan ... sebagai ganti atas kesalahan mereka”
  alternative: mereka mempersembahkan seekor domba jantan dari kawanan sebagai kurban penebus salah atas kesalahan mereka
  rationale: Teks Ibrani menyebut domba jantan dan kesalahan mereka, tetapi tidak memakai nomina tersendiri yang secara eksplisit berarti “kurban penebus salah” dalam klausa ini. Kata kerja “mempersembahkan” diperlukan agar tindakan kurban tersampaikan dengan wajar, sedangkan pembacaan teknis yang lebih eksplisit dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Terjemahan memakai ungkapan idiomatis untuk formula pemberian janji, mempertahankan tindakan menyuruh para istri pergi tanpa mempersempitnya menjadi istilah hukum tertentu, serta menjaga agar istilah kurban teknis tidak ditambahkan secara berlebihan ke dalam teks utama.
