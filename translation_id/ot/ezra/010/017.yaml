  text: And they finished with all the men who had taken foreign wives by the first day of the first month[a].
translation:
  language: id
  text: Mereka menyelesaikan pemeriksaan terhadap semua laki-laki yang telah mengambil perempuan asing sebagai istri pada hari pertama bulan pertama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sampai hari pertama bulan pertama.” Ungkapan waktu Ibrani dapat menyatakan tanggal penyelesaian atau batas waktu proses itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ
  choice: mereka menyelesaikan pemeriksaan
  rationale: Bentuk dari כלה menyatakan selesainya proses yang sedang berlangsung. Objek tersirat diperjelas secara kontekstual sebagai pemeriksaan perkara-perkara, sebagaimana proses dalam ayat-ayat sebelumnya.
- source_word: בַכֹּל אֲנָשִׁים
  choice: terhadap semua laki-laki
  rationale: בַכֹּל menunjukkan cakupan menyeluruh atas perkara orang-orang yang ditangani, sedangkan אֲנָשִׁים secara gramatikal merujuk kepada laki-laki.
- source_word: הַהֹשִׁיבוּ
  choice: yang telah mengambil ... sebagai istri
  rationale: Secara harfiah bentuk ini berarti 'menyebabkan tinggal', tetapi dalam konteks Ezra 10 menunjuk pada membawa perempuan ke dalam rumah tangga sebagai istri. Ungkapan ini mempertahankan idiom tanpa langsung menyamakannya dengan istilah hukum 'menikahi'.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: perempuan asing sebagai istri
  rationale: נָשִׁים dapat berarti perempuan atau istri; konteks rumah tangga menunjukkan kedudukan mereka sebagai istri. 'Asing' mempertahankan penandaan נָכְרִיּוֹת tanpa menambahkan penafsiran teologis.
- source_word: עַד יוֹם אֶחָד לַחֹדֶשׁ הָרִאשׁוֹן
  choice: pada hari pertama bulan pertama
  rationale: עַד menandai batas waktu tercapainya penyelesaian. Dalam bahasa Indonesia, 'pada' alami ketika tanggal penyelesaian dinyatakan, sementara kemungkinan nuansa 'sampai' dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata 'pemeriksaan' ditambahkan secara kontekstual untuk membuat objek verba yang tersirat menjadi jelas; susunan 'mengambil perempuan asing sebagai istri' mempertahankan idiom Ibrani dan menghindari penafsiran hukum yang lebih sempit.
