source:
  edition: WLC
  text: וַ/יַּעַן֩ שְׁכַנְיָ֨ה בֶן יְחִיאֵ֜ל מִ/בְּנֵ֤י עולם וַ/יֹּ֣אמֶר לְ/עֶזְרָ֔א אֲנַ֨חְנוּ֙ מָעַ֣לְנוּ בֵ/אלֹהֵ֔י/נוּ וַ/נֹּ֛שֶׁב נָשִׁ֥ים נָכְרִיּ֖וֹת מֵ/עַמֵּ֣י הָ/אָ֑רֶץ וְ/עַתָּ֛ה יֵשׁ מִקְוֶ֥ה לְ/יִשְׂרָאֵ֖ל עַל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/002.yaml
  text: Then Shecaniah son of Jehiel[a], from the sons of Elam, answered and said to Ezra, “We have acted unfaithfully against our God and have married foreign women from the peoples of the land[c][b]. Yet now there is hope for Israel concerning this.
translation:
  language: id
  text: Lalu Sekhanya anak Yehiel, dari keturunan Elam, menjawab dan berkata kepada Ezra, “Kami telah berlaku tidak setia[a] kepada Allah kita dan telah memperistri perempuan-perempuan asing dari bangsa-bangsa negeri itu[b]. Namun sekarang masih ada harapan bagi Israel mengenai hal ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “telah melakukan pelanggaran kesetiaan terhadap Allah kita.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “telah mengambil perempuan-perempuan asing sebagai istri dari bangsa-bangsa negeri itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Kata kerja naratif ini secara baku berarti ‘menjawab’ atau ‘menanggapi’; ‘menjawab’ mempertahankan bentuk ungkapan Ibrani dan sesuai dengan konteks percakapan.
- source_word: שְׁכַנְיָה בֶן יְחִיאֵל
  choice: Sekhanya bin Yehiel
  rationale: Nama-nama ditransliterasikan ke dalam bentuk yang wajar dalam bahasa Indonesia; ‘bin’ secara ringkas dan jelas menyatakan hubungan anak laki-laki dengan ayahnya.
- source_word: מִבְּנֵי עוֹלָם
  choice: dari bani Elam
  rationale: עוֹלָם di sini adalah nama diri Elam, sedangkan בְּנֵי menunjuk pada kelompok keturunan atau kaum; ‘bani Elam’ merupakan ungkapan Indonesia yang ringkas dan lazim dalam konteks silsilah Alkitab.
- source_word: מָעַלְנוּ
  choice: telah berlaku tidak setia
  rationale: Kata מעל menyatakan pelanggaran kepercayaan atau ketidaksetiaan, khususnya terhadap Allah; pilihan ini mempertahankan bobot relasional dan perjanjian tanpa meratakannya menjadi sekadar ‘berdosa’.
- source_word: בֵּאלֹהֵינוּ
  choice: kepada Allah kita
  rationale: Dengan kata kerja מעל, preposisi ב menandai pihak yang menjadi sasaran ketidaksetiaan. Bahasa Indonesia secara alami memakai ‘tidak setia kepada’.
- source_word: וַנֹּשֶׁב
  choice: dengan memperistri
  rationale: Dalam konteks ini bentuk kata kerja tersebut mengacu pada mengambil perempuan untuk hidup sebagai istri. ‘Memperistri’ menyampaikan makna perkawinan secara jelas, sedangkan ‘dengan’ menunjukkan bagaimana ketidaksetiaan itu dilakukan.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: perempuan-perempuan asing
  rationale: Terjemahan ini mempertahankan nomina ‘perempuan’ dan sifat ‘asing’ sebagaimana teks Ibrani; hubungan perkawinan sudah dinyatakan oleh kata kerja ‘memperistri’.
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: dari antara bangsa-bangsa negeri ini
  rationale: Bentuk jamak עַמֵּי dipertahankan dengan ‘bangsa-bangsa’. ‘Dari antara’ alami dalam bahasa Indonesia untuk asal kelompok, dan ‘negeri ini’ menyampaikan frasa definit הָאָרֶץ dalam konteks setempat.
- source_word: וְעַתָּה
  choice: Namun sekarang
  rationale: Ungkapan ini menandai peralihan dari pengakuan ketidaksetiaan kepada adanya harapan; ‘namun’ menghadirkan kontras itu secara alami.
- source_word: יֵשׁ מִקְוֶה לְיִשְׂרָאֵל
  choice: masih ada harapan bagi Israel
  rationale: מִקְוֶה di sini berarti harapan atau dasar untuk berharap. Kata ‘masih’ mengungkapkan daya kontras kontekstual tanpa meniadakan makna dasar ‘ada harapan’.
- source_word: עַל זֹאת
  choice: dalam perkara ini
  rationale: Frasa ini dapat menunjuk pada perkara yang sedang dihadapi, sementara makna konsesif ‘sekalipun demikian’ juga mungkin. Teks utama mempertahankan rujukan kepada perkara tersebut dan catatan kaki mencatat alternatifnya.
theological_decisions:
- issue: Nuansa ketidaksetiaan dalam מָעַלְנוּ
  choice: telah berlaku tidak setia kepada Allah kita
  alternative: telah berdosa terhadap Allah kita; telah mengkhianati kepercayaan Allah kita
  rationale: Kata Ibrani ini lebih khusus daripada istilah umum untuk dosa dan menekankan pelanggaran kesetiaan terhadap Allah. Terjemahan dipertahankan cukup luas agar tidak memasukkan rumusan teologis tambahan.
- issue: Identitas נָשִׁים נָכְרִיּוֹת
  choice: perempuan-perempuan asing
  alternative: istri-istri asing
  rationale: Nomina Ibraninya berarti ‘perempuan’, sedangkan status perkawinan dinyatakan oleh kata kerja. Pilihan ini mengikuti bentuk sumber dan tidak mengubah persoalan dalam ayat menjadi pernyataan etnis atau teologis yang lebih luas daripada teks.
- issue: Hubungan עַל זֹאת dengan harapan Israel
  choice: dalam perkara ini
  alternative: sekalipun demikian; mengenai hal ini
  rationale: Preposisi עַל memungkinkan hubungan yang bersifat topikal, sedangkan konteks juga mendukung nuansa konsesif. Terjemahan utama tidak menetapkan secara mutlak bagaimana harapan itu akan terwujud, dan alternatif dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan ‘menjawab dan berkata’ dipertahankan untuk mencerminkan formula naratif Ibrani, sedangkan ‘bani’ dipakai sebagai istilah keturunan yang ringkas dan mudah dikenali. Pengulangan jamak pada ‘perempuan-perempuan’ mempertahankan bentuk sumber dan tetap wajar dalam konteks resmi.
