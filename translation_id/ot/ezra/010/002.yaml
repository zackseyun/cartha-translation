revisions:
- from: Lalu Sekhanya bin Yehiel, dari bani Elam, menjawab dan berkata kepada Ezra, “Kami telah berlaku tidak setia[a] kepada Allah kita dengan memperistri[b] perempuan-perempuan asing dari antara bangsa-bangsa negeri ini. Namun sekarang masih ada harapan bagi Israel dalam perkara ini[c].”
  to: Lalu Sekhanya anak Yehiel, dari keturunan Elam, menjawab dan berkata kepada Ezra, “Kami telah berlaku tidak setia[a] kepada Allah kita dan telah memperistri perempuan-perempuan asing dari bangsa-bangsa negeri itu[b]. Namun sekarang masih ada harapan bagi Israel mengenai hal ini.”
  rationale: Revisi menyelaraskan struktur koordinatif kedua verba Ibrani, menghilangkan alternatif catatan kaki yang tidak berlandaskan langsung pada frasa sumber, serta memakai istilah silsilah yang lebih netral dalam bahasa Indonesia modern. Makna ayat, termasuk nuansa ketidaksetiaan kepada Allah dan rujukan “mengenai hal ini,” tidak diubah.
