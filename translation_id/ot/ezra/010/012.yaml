  yaml_path: translation/ot/ezra/010/012.yaml
  text: Then all the assembly answered and said with a loud voice[a], “Yes, according to your words, so it is upon us to do.”
translation:
  language: id
  text: Lalu seluruh jemaah itu menjawab dengan suara lantang, “Benar! Seperti yang engkau katakan, itulah yang harus kami lakukan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ כָל־הַקָּהָל
  choice: seluruh jemaah itu menjawab
  rationale: עָנָה memperkenalkan tanggapan umat, sedangkan קָהָל menunjuk kepada komunitas yang sedang berhimpun. “Seluruh jemaah itu” mempertahankan sifat kolektif dan konteks pertemuan tersebut.
- source_word: וַיֹּאמְרוּ
  choice: menjawab
  rationale: Dalam rangkaian Ibrani “menjawab dan berkata”, unsur “berkata” berfungsi memperkenalkan isi jawaban. Dalam bahasa Indonesia, satu verba “menjawab” sudah menyampaikan fungsi wacana itu secara alami tanpa mengubah makna.
- source_word: קוֹל גָּדוֹל
  choice: dengan suara lantang
  rationale: Ungkapan harfiahnya adalah “dengan suara besar”. “Dengan suara lantang” merupakan padanan Indonesia yang alami dan tetap menyampaikan jawaban publik yang keras serta tegas.
- source_word: כֵּן
  choice: Benar!
  rationale: Di sini כֵּן menyatakan persetujuan tegas terhadap perkataan sebelumnya. “Benar!” menyampaikan penegasan itu secara langsung.
- source_word: כִּדְבָרֶיךָ
  choice: Seperti yang engkau katakan
  rationale: Frasa ini secara harfiah berarti “sesuai dengan perkataan-perkataanmu”. Padanan yang dipilih alami dalam bahasa Indonesia dan mempertahankan acuan kepada ucapan lawan bicara tunggal.
- source_word: עָלֵינוּ לַעֲשׂוֹת
  choice: itulah yang harus kami lakukan
  rationale: Ungkapan “atas kami untuk melakukan” menyatakan kewajiban yang dipikul para pembicara. “Harus kami lakukan” menyampaikan kewajiban itu dengan jelas tanpa menambahkan dasar teologis yang tidak dinyatakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Pronomina “engkau” dipertahankan karena lawan bicara dalam bentuk tunggal. Susunan “menjawab dan berkata” tidak ditiru secara kaku karena tidak alami dalam bahasa Indonesia; isi ujaran langsung sudah membuat unsur berkata tersirat dengan jelas.
