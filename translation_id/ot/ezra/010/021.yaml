  text: 'And from the sons of Harim: Maaseiah[a], Elijah, Shemaiah, Jehiel, and Uzziah.'
translation:
  language: id
  text: 'Dan dari antara keturunan Harim[a]: Maaseya, Elia, Semaya, Yehiel, dan Uzia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Dan dari anak-anak Harim.” Susunan bahasa Ibrani menandai mereka sebagai kelompok keluarga berikutnya dalam daftar ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Dan dari antara keturunan
  rationale: Gabungan ו, מִן, dan בְּנֵי menghubungkan ayat ini dengan daftar sebelumnya sekaligus memperkenalkan sejumlah orang dari kelompok keluarga Harim. “Dari antara keturunan” menyampaikan makna partitif secara alami dalam bahasa Indonesia.
- source_word: חָרִם
  choice: Harim
  rationale: Nama diri sekaligus nama kelompok keluarga; ditransliterasikan sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מַעֲשֵׂיָה
  choice: Maaseya
  rationale: Nama diri Ibrani; bentuk “Maaseya” mengikuti konvensi transliterasi nama Alkitab dalam bahasa Indonesia.
- source_word: וְ/אֵלִיָּה
  choice: Elia
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia; prefiks penghubung diwakili oleh susunan daftar.
- source_word: וּֽ/שְׁמַֽעְיָה
  choice: Semaya
  rationale: Transliterasi Indonesia yang alami untuk nama Ibrani ini; prefiks penghubung diwakili oleh tanda baca dan susunan daftar.
- source_word: וִ/יחִיאֵל
  choice: Yehiel
  rationale: Transliterasi yang mempertahankan bunyi awal Ibrani yod dan dapat dibaca dengan wajar oleh pembaca Indonesia.
- source_word: וְ/עֻזִיָּה
  choice: Uzia
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia; kata penghubung diterjemahkan sebagai “dan” sebelum unsur terakhir daftar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Keturunan” dipilih daripada “anak-anak” karena בְּנֵי dalam daftar keluarga ini menunjuk anggota garis keluarga, bukan hanya putra langsung. Nama-nama memakai bentuk Indonesia yang wajar dan konsisten.
