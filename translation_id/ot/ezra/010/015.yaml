  source_fidelity: 'Terjemahan utama secara tepat menyampaikan pembatasan אַךְ, dua nama dan patronimnya, pembacaan adversatif yang lazim bagi עָמְדוּ עַל זֹאת, serta bantuan Mesulam dan Sabetai kepada kedua orang itu. Namun, catatan untuk ungkapan tersebut perlu dirumuskan lebih cermat: alternatifnya bukan terutama bahwa mereka ''ditugaskan'', melainkan bahwa mereka berdiri atas/bertanggung jawab menangani perkara itu. Keterangan bahwa Sabetai seorang Lewi juga perlu dibuat jelas hanya menerangkan Sabetai.'
  naturalness: Bahasa draf pada dasarnya baku dan jelas. Frasa 'orang Lewi itu' terdengar agak kurang alami dan, setelah dua nama yang dikoordinasikan, dapat secara sepintas dibaca sebagai menerangkan keduanya. Pengulangan nama dalam tanda pisah menghasilkan rujukan yang tegas tanpa mengubah makna.
  terminology: Transliterasi Yonatan, Asael, Yahzeya, Tikwa, Mesulam, dan Sabetai konsisten dan wajar dalam bahasa Indonesia. 'Anak' sesuai untuk בֶּן dalam silsilah. 'Mendukung mereka' dapat dipertahankan sebagai terjemahan kontekstual עֲזָרֻם, dengan alternatif 'menolong' dan 'membantu' dalam catatan kaki.
