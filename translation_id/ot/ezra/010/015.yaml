  rationale: Revisi mempertahankan pembacaan utama 'menentang hal itu', yang didukung konteks, sambil menyatakan alternatif yang diperselisihkan tanpa memasukkan gagasan penugasan secara berlebihan. Klausa mengenai Sabetai diperjelas agar sebutan 'seorang Lewi' hanya melekat padanya, sebagaimana urutan Ibrani paling alami. Tidak ada perubahan terhadap makna pokok ayat.
