  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֣ךְ יוֹנָתָ֧ן בֶּן עֲשָׂהאֵ֛ל וְ/יַחְזְיָ֥ה בֶן תִּקְוָ֖ה עָמְד֣וּ עַל זֹ֑את וּ/מְשֻׁלָּ֛ם וְ/שַׁבְּתַ֥י הַ/לֵּוִ֖י עֲזָרֻֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/015.yaml
  text: Only Jonathan son of Asahel and Jahzeiah son of Tikvah stood against this[b][a], and Meshullam and Shabbethai the Levite supported them.
translation:
  language: id
  text: Hanya Yonatan anak Asael dan Yahzeya anak Tikwa[a] yang menentang hal itu,[b] dan Mesulam serta Sabetai—Sabetai seorang Lewi—mendukung mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yahazya anak Tikwa.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini juga dapat dipahami bahwa mereka bertanggung jawab atas atau mengurus perkara ini.
    reason: source_ambiguity
  - marker: c
    text: Atau “menolong mereka” atau “membantu mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hanya
  rationale: Dalam konteks ini אַךְ membatasi pernyataan sebelumnya dengan menyebutkan orang-orang yang menjadi pengecualian; “Hanya” menyampaikan fungsi restriktif itu secara alami.
- source_word: יוֹנָתָן בֶּן עֲשָׂהאֵל
  choice: Yonatan anak Asael
  rationale: Nama-nama ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia, dan בֶּן diterjemahkan “anak” untuk menyatakan hubungan keturunan.
- source_word: יַחְזְיָה בֶן תִּקְוָה
  choice: Yahzeya anak Tikwa
  rationale: “Yahzeya” mencerminkan bentuk konsonantal dan vokalisasi Masoret; ejaan alternatif yang lebih tradisional dicatat dalam catatan kaki.
- source_word: עָמְדוּ עַל זֹאת
  choice: menentang hal itu
  rationale: Dalam konteks usulan yang baru disetujui orang banyak, ungkapan ini paling wajar dipahami sebagai mengambil sikap menentang. Kemungkinan bahwa ungkapan itu berarti mengambil tanggung jawab atas perkara tersebut tetap dicatat karena konstruksi Ibraninya dapat dipahami demikian.
- source_word: וּמְשֻׁלָּם וְשַׁבְּתַי הַלֵּוִי
  choice: sedangkan Mesulam dan Sabetai, orang Lewi itu
  rationale: Urutan bahasa Ibrani paling alami membuat sebutan “orang Lewi” menerangkan Sabetai saja. “Sedangkan” memperjelas hubungan antarklausa tanpa menghilangkan kontras dalam konteks.
- source_word: עֲזָרֻם
  choice: mendukung mereka
  rationale: Kata kerja עזר dengan akhiran orang ketiga jamak berarti “menolong mereka”; dalam konteks sikap terhadap suatu usulan, “mendukung mereka” menyatakan bantuan atau sokongan kepada kedua orang tersebut secara alami.
theological_decisions:
- issue: Peran Yonatan dan Yahzeya dalam perkara itu
  choice: Mereka menentang usulan tersebut
  alternative: Mereka ditugaskan menangani atau mengawasi perkara tersebut
  rationale: Konteks dan pemakaian עמד על dapat menunjuk pada sikap menentang, tetapi susunan katanya juga memungkinkan arti berdiri atas atau bertanggung jawab atas perkara itu. Terjemahan utama mengikuti pembacaan adversatif, sementara catatan mempertahankan ambiguitas yang nyata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Anak” dipakai alih-alih “bin” agar narasi Alkitabiah tetap mudah dipahami secara luas. Nama-nama mengikuti transliterasi Indonesia yang wajar; struktur kalimat mempertahankan pembatasan, kontras, dan ketegangan penafsiran dalam teks Ibrani.
