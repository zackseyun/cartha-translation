  text: וּ/כְ/הִתְפַּלֵּ֤ל עֶזְרָא֙ וּ/כְ֨/הִתְוַדֹּת֔/וֹ בֹּכֶה֙ וּ/מִתְנַפֵּ֔ל לִ/פְנֵ֖י בֵּ֣ית הָ/אֱלֹהִ֑ים נִקְבְּצוּ֩ אֵלָ֨י/ו מִ/יִּשְׂרָאֵ֜ל קָהָ֣ל רַב מְאֹ֗ד אֲנָשִׁ֤ים וְ/נָשִׁים֙ וִֽ/ילָדִ֔ים כִּֽי בָכ֥וּ הָ/עָ֖ם הַרְבֵּה בֶֽכֶה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/001.yaml
  text: While Ezra was praying and making confession[a], weeping and falling down before the house of God, a very large assembly from Israel gathered to him—men, women, and children—for the people wept bitterly.
translation:
  language: id
  text: Sementara Ezra berdoa dan mengaku dosa, sambil menangis dan menjatuhkan diri di hadapan rumah Allah, suatu kumpulan yang sangat besar dari antara orang Israel—laki-laki, perempuan, dan anak-anak—berkumpul mendatanginya, sebab umat itu banyak menangis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “sebab umat itu menangis dengan banyak tangisan.”'
    reason: Ungkapan Ibrani memakai kata keterangan penguat bersama kata benda “tangisan”; “banyak menangis” menyampaikan tekanannya secara alami.
lexical_decisions:
- source_word: וּכְהִתְפַּלֵּל עֶזְרָא וּכְהִתְוַדֹּתוֹ
  choice: Sementara Ezra berdoa dan mengaku dosa
  rationale: Dua bentuk dengan וּכְ menyatakan tindakan yang berlangsung bersamaan sebagai latar. Hitpael ידה di sini menunjuk pada pengakuan dosa; objek 'dosa' tersirat dalam konteks dan wajar dinyatakan dalam bahasa Indonesia.
- source_word: בֹּכֶה וּמִתְנַפֵּל
  choice: sambil menangis dan menjatuhkan diri
  rationale: Kedua partisipel menggambarkan tindakan Ezra yang terus berlangsung. 'Menjatuhkan diri' mempertahankan nuansa refleksif נפל tanpa memastikan postur sujud penuh yang tidak dinyatakan secara eksplisit.
- source_word: לִפְנֵי בֵּית הָאֱלֹהִים
  choice: di depan rumah Allah
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani 'rumah Allah' dan menyampaikan posisi Ezra secara alami.
- source_word: נִקְבְּצוּ אֵלָיו מִיִּשְׂרָאֵל קָהָל רַב מְאֹד
  choice: sejumlah sangat besar orang Israel berkumpul kepadanya
  rationale: Susunan ini menyampaikan adanya kumpulan yang amat besar dari antara komunitas Israel tanpa memakai 'jemaat', yang dalam bahasa Indonesia dapat membawa konotasi gerejawi.
- source_word: אֲנָשִׁים וְנָשִׁים וִילָדִים
  choice: laki-laki, perempuan, dan anak-anak
  rationale: Ketiga kelompok yang disebutkan secara eksplisit dalam teks sumber dipertahankan.
- source_word: כִּי בָכוּ הָעָם הַרְבֵּה בֶכֶה
  choice: sebab umat itu menangis tersedu-sedu
  rationale: '''Sebab'' mempertahankan hubungan penjelas כִּי. Ungkapan idiomatis ''menangis tersedu-sedu'' menyampaikan intensifikasi Ibrani הַרְבֵּה בֶכֶה; bentuk yang lebih harfiah dicatat dalam catatan kaki.'
