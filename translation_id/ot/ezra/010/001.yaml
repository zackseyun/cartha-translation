revisions:
- from: Sementara Ezra berdoa dan mengaku dosa sambil menangis dan menjatuhkan diri di depan rumah Allah, sejumlah sangat besar orang Israel berkumpul kepadanya—laki-laki, perempuan, dan anak-anak—sebab umat itu menangis tersedu-sedu.[a]
  to: Sementara Ezra berdoa dan mengaku dosa, sambil menangis dan menjatuhkan diri di hadapan rumah Allah, suatu kumpulan yang sangat besar dari antara orang Israel—laki-laki, perempuan, dan anak-anak—berkumpul mendatanginya, sebab umat itu banyak menangis.[a]
  rationale: Revisi memperjelas bahwa yang berkumpul ialah sebuah kumpulan besar dari antara orang Israel dan mengganti ungkapan yang secara spesifik berarti menangis sambil tersedu-sedu dengan padanan yang lebih dekat kepada intensifikasi umum dalam bahasa Ibrani. Susunan tindakan Ezra, hubungan sebab, dan catatan kaki dipertahankan.
