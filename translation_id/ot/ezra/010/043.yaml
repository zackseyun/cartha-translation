  text: מִ/בְּנֵ֖י נְב֑וֹ יְעִיאֵ֤ל מַתִּתְיָה֙ זָבָ֣ד זְבִינָ֔א ידו וְ/יוֹאֵ֖ל בְּנָיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/043.yaml
  text: 'From the sons of Nebo: Jeiel[a], Mattithiah, Zabad, Zebina, Jaddai, Joel, and Benaiah.'
translation:
  language: id
  text: 'Dari keturunan Nebo: Yeiel, Matitya, Zabad, Zebina, Yadai[a], Yoel, dan Benaya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk nama Ibrani ini tidak pasti; nama ini juga dapat ditransliterasikan sebagai Ido atau Yedo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: Dari keturunan
  rationale: Gabungan preposisi מִן dengan בְּנֵי memperkenalkan anggota-anggota dari kelompok keluarga yang lebih besar. “Dari keturunan” alami dalam bahasa Indonesia dan mempertahankan fungsi genealogis daftar ini.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: יְעִיאֵל
  choice: Yeiel
  rationale: Transliterasi Indonesia yang mencerminkan bunyi awal Ibrani yod dan bentuk nama tersebut.
- source_word: מַתִּתְיָה
  choice: Matitya
  rationale: Transliterasi yang cukup dekat dengan bentuk Ibrani dan alami dibaca dalam bahasa Indonesia.
- source_word: זָבָד
  choice: Zabad
  rationale: Nama diri ditransliterasikan secara langsung.
- source_word: זְבִינָא
  choice: Zebina
  rationale: Nama diri ditransliterasikan secara langsung dalam bentuk yang alami bagi pembaca Indonesia.
- source_word: ידו
  choice: Yadai[a]
  rationale: Bentuk nama dalam teks Ibrani sulit dipastikan. “Yadai” dipakai dalam teks utama sebagai representasi yang dapat dibaca dalam bahasa Indonesia, sedangkan ketidakpastian dan alternatif transliterasinya dipertahankan dalam catatan kaki.
- source_word: וְ/יוֹאֵל
  choice: Yoel
  rationale: Nama ditransliterasikan sebagai “Yoel”. Konjungsi Ibrani diwujudkan melalui pola daftar Indonesia dengan “dan” sebelum nama terakhir.
- source_word: בְּנָיָה
  choice: Benaya
  rationale: Transliterasi Indonesia yang dekat dengan bentuk Ibrani dan sesuai dengan pola nama Alkitab yang dikenal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan wajar untuk sebuah daftar nama. “Keturunan” dipilih alih-alih “anak-anak” karena בְּנֵי di sini menunjuk kelompok keluarga. Ejaan nama mengikuti pola transliterasi Indonesia; penanda catatan kaki ditempatkan pada Yadai, yaitu nama yang memang tidak pasti dalam sumber Ibrani.
