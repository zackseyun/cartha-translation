base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/022.yaml
  text: 'And from the sons of Pashhur: Elioenai, Maaseiah, Ishmael, Nethanel, Jozabad, and Elasah.'
translation:
  language: id
  text: 'Dan dari antara keturunan Pasyhur: Elyoenai, Maaseya, Ismael, Netaneel, Yozabad, dan Elasa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Dari antara keturunan
  rationale: Bentuk gabungan ini memperkenalkan kelompok berikutnya dalam daftar dan mengandung nuansa partitif. Dalam bahasa Indonesia, “dari antara keturunan” menyampaikan fungsi itu secara alami; hubungan dengan ayat sebelumnya sudah tampak dari kesinambungan daftar sehingga וּ tidak perlu diterjemahkan secara kaku sebagai “dan”.
- source_word: פַּשְׁחוּר
  choice: Pasyhur
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia; שׁ dilambangkan dengan “sy”.
- source_word: אֶלְיוֹעֵינַי
  choice: Elyoenai
  rationale: Transliterasi nama Ibrani yang mempertahankan unsur bunyi utama dan memakai ejaan yang wajar bagi pembaca Indonesia.
- source_word: מַעֲשֵׂיָה
  choice: Maaseya
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang mudah dibaca, dengan akhiran -יה direpresentasikan sebagai “-ya”.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Dipakai bentuk nama yang telah lazim dalam bahasa Indonesia.
- source_word: נְתַנְאֵל
  choice: Netaneel
  rationale: Transliterasi menjaga rangkaian bunyi nama Ibrani dan membedakan dua vokal pada bagian akhirnya.
- source_word: יוֹזָבָד
  choice: Yozabad
  rationale: Nama ditransliterasikan secara langsung; huruf awal yod direpresentasikan dengan “Y”.
- source_word: וְ/אֶלְעָשָׂה
  choice: dan Elasa
  rationale: Konjungsi וְ diterjemahkan “dan” untuk menandai nama terakhir dalam daftar; nama אֶלְעָשָׂה ditransliterasikan sebagai “Elasa”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Istilah “keturunan” dipilih alih-alih “anak-anak” karena konteksnya adalah kelompok keluarga atau garis keturunan dalam sebuah daftar nama.
