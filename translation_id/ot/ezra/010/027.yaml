  text: וּ/מִ/בְּנֵ֖י זַתּ֑וּא אֶלְיוֹעֵנַ֤י אֶלְיָשִׁיב֙ מַתַּנְיָ֣ה וִֽ/ירֵמ֔וֹת וְ/זָבָ֖ד וַ/עֲזִיזָֽא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/027.yaml
  text: 'And from the sons of Zattu: Elioenai, Eliashib, Mattaniah, Jeremoth, Zabad, and Aziza.'
translation:
  language: id
  text: 'Dan dari keturunan Zatu: Elyoenai, Elyasib, Matanya, Yeremot, Zabad, dan Aziza.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Dari antara keturunan
  rationale: Dalam daftar keluarga ini, בְּנֵי dapat menunjuk bukan hanya kepada anak kandung, melainkan juga keturunan atau anggota kaum. Ungkapan ini alami dalam bahasa Indonesia dan meneruskan susunan daftar dari ayat-ayat sebelumnya; waw tidak perlu diterjemahkan secara mekanis sebagai “dan” pada awal ayat.
- source_word: זַתּוּא
  choice: Zatu
  rationale: Nama keluarga ditransliterasikan menurut pola ejaan nama Ibrani yang wajar dalam bahasa Indonesia.
- source_word: אֶלְיוֹעֵנַי
  choice: Elyoenai
  rationale: Nama diri ditransliterasikan dengan “y” untuk bunyi konsonan yod dan susunan vokal Ibraninya dipertahankan secara wajar.
- source_word: אֶלְיָשִׁיב
  choice: Elyasib
  rationale: Transliterasi Indonesia memakai “sy” untuk שׁ dan “y” untuk yod.
- source_word: מַתַּנְיָה
  choice: Matanya
  rationale: Bentuk Indonesia yang ringkas dan wajar mempertahankan unsur nama Ibrani tanpa mengikuti akhiran ejaan Inggris “-iah”.
- source_word: וִֽ/ירֵמוֹת
  choice: Yeremot
  rationale: Nama ditransliterasikan dari bentuk Ibrani; waw penghubung ditangani melalui tanda baca dan konjungsi pada unsur terakhir daftar.
- source_word: וְ/זָבָד
  choice: Zabad
  rationale: Nama diri ditransliterasikan secara langsung; waw penghubung tidak perlu diulang dalam gaya daftar bahasa Indonesia.
- source_word: וַ/עֲזִיזָא
  choice: dan Aziza
  rationale: Waw diterjemahkan sebagai “dan” sebelum nama terakhir sesuai tata daftar bahasa Indonesia; nama ditransliterasikan sebagai Aziza.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Keturunan” dipilih daripada “anak-anak lelaki” karena konteksnya adalah daftar kaum/keluarga dan cakupan istilah Ibrani dapat lebih luas daripada putra biologis. Ejaan nama mengikuti kebiasaan fonologis Indonesia, bukan bentuk Inggris.
