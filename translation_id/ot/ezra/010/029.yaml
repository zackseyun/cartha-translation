lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Dan dari antara anak-anak
  rationale: Gabungan kata penghubung, kata depan, dan bentuk jamak konstruksi בֵּן diterjemahkan secara alami sambil mempertahankan bahasa daftar keturunan Ibrani.
- source_word: בָּנִי
  choice: Bani
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia.
- source_word: מְשֻׁלָּם
  choice: Mesulam
  rationale: Transliterasi nama diri yang mengikuti bentuk Ibrani dan pola ejaan Indonesia.
- source_word: מַלּוּךְ
  choice: Malukh
  rationale: Bentuk ini mencerminkan konsonan akhir כ dan membedakannya dari ejaan alternatif Maluk.
- source_word: וַ/עֲדָיָה
  choice: Adaya
  rationale: Kata penghubung diserap ke dalam deretan nama, sedangkan nama diri ditransliterasikan menurut pelafalan Masoret.
- source_word: יָשׁוּב
  choice: Yasub
  rationale: Transliterasi Indonesia dari nama Ibrani dengan konsonan awal yod dan bunyi syin.
- source_word: וּ/שְׁאָל
  choice: Seal
  rationale: Kata penghubung diserap ke dalam deretan nama; nama mengikuti vokalisasi Masoret.
- source_word: ירמות
  choice: Yeremot
  rationale: Dipahami sebagai bentuk nama Yeremot dalam konteks daftar ini, sambil mencatat bahwa bentuk konsonantalnya juga melahirkan pembacaan nama lain dalam tradisi.
