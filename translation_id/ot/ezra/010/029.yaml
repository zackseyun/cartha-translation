translation:
  language: id
  text: 'Dan dari antara anak-anak Bani: Mesulam, Malukh[a], Adaya, Yasub, Se''al, dan Yeremot[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Malukh juga dapat dieja Maluk.
