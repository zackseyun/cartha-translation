  rationale: Nama diri ditransliterasikan dengan pola bunyi yang jelas bagi pembaca Indonesia, termasuk akhiran -ai.
- source_word: ו/יעשו
  choice: dan Yaasai
  rationale: Awalan ו diterjemahkan sebagai “dan”. Dalam konteks daftar ini, unsur berikutnya dipahami sebagai nama diri yang langka dan ditransliterasikan “Yaasai”, sambil mengakui adanya ketidakpastian dalam pelafalan dan penyajiannya.
