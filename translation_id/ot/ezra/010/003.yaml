source:
  edition: WLC
  text: וְ/עַתָּ֣ה נִֽכְרָת בְּרִ֣ית לֵ֠/אלֹהֵי/נוּ לְ/הוֹצִ֨יא כָל נָשִׁ֜ים וְ/הַ/נּוֹלָ֤ד מֵ/הֶם֙ בַּ/עֲצַ֣ת אֲדֹנָ֔/י וְ/הַ/חֲרֵדִ֖ים בְּ/מִצְוַ֣ת אֱלֹהֵ֑י/נוּ וְ/כַ/תּוֹרָ֖ה יֵעָשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/003.yaml
  text: So now let us make a covenant with our God to send away all the women and what has been born from them, according to the counsel of my lord and of those who tremble at the commandment of our God; and let it be done according to the law.
translation:
  language: id
  text: Sekarang, marilah kita mengikat perjanjian dengan Allah kita untuk menyuruh pergi semua istri itu beserta anak-anak yang lahir dari mereka, sesuai dengan nasihat tuanku dan orang-orang yang gemetar terhadap perintah Allah kita. Hendaklah hal itu dilakukan sesuai dengan Hukum Taurat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִכְרָת בְּרִית
  choice: mengikat perjanjian
  rationale: Ungkapan Ibrani harfiahnya adalah “memotong perjanjian”, tetapi padanan idiomatis dan baku dalam bahasa Indonesia ialah “mengikat perjanjian”.
- source_word: כָל נָשִׁים
  choice: semua istri itu
  rationale: נָשִׁים dapat berarti “perempuan-perempuan” atau “istri-istri”; konteks pasal ini menunjuk kepada para perempuan asing yang telah diperistri, sehingga “istri” menyampaikan rujukannya secara alami.
- source_word: וְהַנּוֹלָד מֵהֶם
  choice: beserta anak-anak yang lahir dari mereka
  rationale: Bentuk Ibrani memakai ungkapan kolektif, secara harfiah “yang lahir dari mereka”; konteks menunjukkan keturunan atau anak-anak mereka tanpa menentukan jenis kelamin.
- source_word: אֲדֹנָי
  choice: tuanku
  rationale: Dalam konstruksi ini kata tersebut merujuk kepada seorang pemimpin manusia yang disapa dengan hormat, bukan kepada nama ilahi; “tuanku” mempertahankan sapaan hormat orang pertama.
- source_word: הַחֲרֵדִים בְּמִצְוַת
  choice: orang-orang yang gemetar terhadap perintah
  rationale: Terjemahan ini mempertahankan citra kuat חָרֵד tentang rasa gentar dan hormat yang mendalam terhadap perintah Allah.
- source_word: כַתּוֹרָה
  choice: sesuai dengan Hukum Taurat
  rationale: Dalam konteks Ezra, תּוֹרָה merujuk pada hukum atau pengajaran Allah yang berwibawa; bentuk ini alami dan dikenal luas dalam bahasa Indonesia.
theological_decisions:
- issue: Identitas אֲדֹנָי dalam frasa “nasihat tuanku”
  choice: Dipahami sebagai sapaan kepada pemimpin manusia, kemungkinan Ezra
  alternative: “Tuhan” sebagai sebutan ilahi
  rationale: Kesejajaran antara “tuanku” dan “orang-orang yang gemetar terhadap perintah Allah kita”, serta konteks ujaran Sekhanya kepada Ezra, mendukung rujukan manusia dan mencegah penyamaan yang tidak berdasar dengan nama atau gelar ilahi.
- issue: Cakupan tindakan terhadap keturunan
  choice: Menyatakan secara langsung bahwa istri dan anak-anak mereka disuruh pergi
  alternative: Mengaburkan anak-anak sebagai sekadar “apa yang lahir dari mereka”
  rationale: Teks Ibrani secara eksplisit memasukkan הַנּוֹלָד מֵהֶם; terjemahan tidak melunakkan ketegangan etis dan teologis dalam usulan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur kalimat dipecah menjadi dua kalimat agar mudah dipahami tanpa menghilangkan hubungan logis teks. “Menyuruh pergi” dipilih alih-alih istilah yang lebih keras seperti “mengusir” karena bentuk kausatif יָצָא menyatakan membuat mereka keluar atau pergi, sementara nada tepat tindakan ditentukan oleh konteks.
