  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur daftar dipertahankan, sementara istilah kekerabatan dibuat alami bagi pembaca modern. Penanda catatan ditempatkan pada kemunculan kedua nama Malkia agar kaitannya jelas.
