base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/025.yaml
  text: 'And from Israel[a], from the sons of Parosh: Ramiah, Izziah, Malkijah, Mijamin, Eleazar, Malkijah, and Benaiah.'
translation:
  language: id
  text: 'Dan dari antara orang Israel, dari keturunan Paros: Ramya, Yizia, Malkia, Miyamin, Eleazar, Malkia[a], dan Benaya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani mencantumkan nama Malkia dua kali dalam daftar ini, tampaknya untuk dua orang berbeda yang memiliki nama sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִֽיִּשְׂרָאֵל
  choice: Dari antara orang Israel
  rationale: Ungkapan ini memperkenalkan kelompok berikutnya dalam daftar. Kata depan מִן dinyatakan secara alami dengan “dari antara”; waw berfungsi melanjutkan daftar dan tidak perlu diterjemahkan sebagai “dan” dalam kalimat Indonesia ini.
- source_word: מִבְּנֵי
  choice: dari keturunan
  rationale: Secara harfiah berarti “dari anak-anak”, tetapi dalam daftar keluarga atau kaum menunjuk kepada keturunan atau anggota keluarga; “keturunan” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: פַרְעֹשׁ
  choice: Paros
  rationale: Nama diri dialihaksarakan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: רַמְיָה
  choice: Ramya
  rationale: Alih aksara nama Ibrani ke bentuk Indonesia; unsur konsonan yod dipertahankan dengan “y”.
- source_word: יִזִּיָּה
  choice: Yizia
  rationale: Alih aksara yang mengikuti bunyi awal yod dan mempertahankan bentuk nama tanpa menerjemahkan maknanya.
- source_word: מַלְכִּיָּה
  choice: Malkia
  rationale: Bentuk alih aksara Indonesia dipakai secara konsisten untuk kedua kemunculan nama yang sama.
- source_word: מִיָּמִן
  choice: Miyamin
  rationale: Alih aksara ini mempertahankan rangkaian bunyi nama Ibrani dan mudah dibaca dalam bahasa Indonesia.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Bentuk nama yang sudah mapan dan dekat dengan bentuk Ibraninya.
- source_word: בְנָיָה
  choice: Benaya
  rationale: Alih aksara Indonesia yang mencerminkan bentuk Ibrani nama tersebut.
- source_word: וּמַלְכִּיָּה ... וּבְנָיָה
  choice: Malkia, ... Malkia, dan Benaya
  rationale: Nama Malkia yang muncul dua kali dipertahankan, sedangkan rangkaian waw Ibrani disajikan dengan tanda baca daftar Indonesia dan “dan” sebelum nama terakhir.
