  text: וּ/בְנֵ֣י כ֔וּשׁ סְבָא֙ וַ/חֲוִילָ֔ה וְ/סַבְתָּ֥א וְ/רַעְמָ֖א וְ/סַבְתְּכָ֑א וּ/בְנֵ֥י רַעְמָ֖א שְׁבָ֥א וּ/דְדָֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/009.yaml
  text: 'The sons of Cush: Seba[a], Havilah, Sabta, Raama, and Sabteca[c][b]. And the sons of Raama: Sheba and Dedan.'
translation:
  language: id
  text: Anak-anak Kush ialah Seba, Hawila, Sabta, Raema, dan Sabtekha. Anak-anak Raema ialah Syeba dan Dedan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי כוּשׁ
  choice: Anak-anak Kush ialah
  rationale: בְּנֵי secara harfiah berarti “anak-anak lelaki/anak-anak”; dalam daftar silsilah, “anak-anak” mempertahankan bentuk rumusan Ibrani dengan wajar. Kata “ialah” membantu memperkenalkan daftar nama dalam bahasa Indonesia.
- source_word: סְבָא
  choice: Seba
  rationale: Nama diri ditransliterasikan; bentuk ini juga membedakannya dari שְׁבָא (Syeba) di bagian akhir ayat.
- source_word: חֲוִילָה
  choice: Hawila
  rationale: Transliterasi nama diri menurut bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: סַבְתָּא
  choice: Sabta
  rationale: Transliterasi langsung nama diri tanpa menambahkan bunyi yang tidak dituntut oleh bentuk Ibrani.
- source_word: רַעְמָא
  choice: Raema
  rationale: Transliterasi Indonesia yang mempertahankan urutan konsonan dan vokalisasi nama Ibrani serta membedakannya dari nama Rama yang lain.
- source_word: סַבְתְּכָא
  choice: Sabtekha
  rationale: Bentuk ini mempertahankan konsonan akhir kaf yang beraspirasi/frikatif dalam pelafalan Masoret sebagai “kh”.
- source_word: וּבְנֵי רַעְמָא
  choice: Anak-anak Raema ialah
  rationale: Rumusan silsilah diulang untuk menandai cabang baru. Konjungsi waw tidak perlu diterjemahkan secara mekanis karena pemisahan menjadi kalimat baru sudah menyatakan peralihannya secara alami.
- source_word: שְׁבָא
  choice: Syeba
  rationale: “Sy” mewakili שׁ dan membedakan nama ini dari סְבָא, yang diterjemahkan “Seba”.
- source_word: דְדָן
  choice: Dedan
  rationale: Nama diri ditransliterasikan langsung tanpa memperluasnya menjadi nama suku atau garis keturunan.
