  text: Jetur[a], Naphish, and Kedemah. These were the sons of Ishmael.
translation:
  language: id
  text: Yetur, Nafis, dan Kedma. Itulah anak-anak Ismael.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְטוּר
  choice: Yetur
  rationale: Nama diri ditransliterasikan dengan bentuk yang mencerminkan bunyi Ibrani dan lazim dipakai dalam Alkitab bahasa Indonesia.
- source_word: נָפִישׁ
  choice: Nafis
  rationale: Nama diri ditransliterasikan secara alami dalam ejaan Indonesia; huruf שׁ direpresentasikan sebagai s sesuai bentuk nama yang lazim.
- source_word: וָ/קֵדְמָה
  choice: dan Kedma
  rationale: Konjungsi ו diterjemahkan 'dan'; nama קֵדְמָה ditransliterasikan 'Kedma' secara ringkas dan sesuai pelafalan Ibrani.
- source_word: אֵלֶּה הֵם
  choice: Mereka inilah
  rationale: Klausa identifikasi nominal ini dirender secara alami sambil mempertahankan penegasan dari gabungan demonstratif dan pronomina.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Dalam daftar silsilah ini kata tersebut menunjuk kepada keturunan laki-laki Ismael; 'anak-anak' adalah ungkapan Indonesia yang alami dan tetap tepat dalam konteks.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Menggunakan bentuk nama yang mapan dalam tradisi dan ejaan Alkitab bahasa Indonesia.
