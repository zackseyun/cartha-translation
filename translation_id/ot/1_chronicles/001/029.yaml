source:
  edition: WLC
  text: אֵ֖לֶּה תֹּלְדוֹתָ֑/ם בְּכ֤וֹר יִשְׁמָעֵאל֙ נְבָי֔וֹת וְ/קֵדָ֥ר וְ/אַדְבְּאֵ֖ל וּ/מִבְשָֽׂם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/029.yaml
  text: 'These are their generations: the firstborn of Ishmael[a], Nebaioth, Kedar, Adbeel, and Mibsam.'
translation:
  language: id
  text: 'Inilah keturunan mereka: Nebayot[a], anak sulung Ismael, Kedar, Adbeel, dan Mibsam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dapat ditransliterasikan Nebaiot.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Bentuk penunjuk jamak ini memperkenalkan daftar silsilah; “Inilah” merupakan rumusan pembuka yang alami dalam bahasa Indonesia.
- source_word: תֹּלְדוֹתָם
  choice: keturunan mereka
  rationale: Dalam konteks silsilah, kata ini menunjuk kepada keturunan atau garis keturunan. “Keturunan mereka” dekat dengan bentuk Ibrani sekaligus mudah dipahami.
- source_word: בְּכוֹר
  choice: anak sulung
  rationale: Menunjukkan kedudukan sebagai yang lahir pertama. Kata “anak” dinyatakan agar hubungan dengan Ismael jelas dan alami dalam bahasa Indonesia.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Bentuk nama yang telah mapan dalam tradisi Alkitab bahasa Indonesia.
- source_word: נְבָיוֹת
  choice: Nebayot
  rationale: Transliterasi yang lazim dalam Alkitab bahasa Indonesia dan cukup dekat dengan bentuk Ibrani.
- source_word: קֵדָר
  choice: Kedar
  rationale: Transliterasi langsung dan bentuk yang telah dikenal dalam bahasa Indonesia.
- source_word: אַדְבְּאֵל
  choice: Adbeel
  rationale: Transliterasi langsung nama Ibrani.
- source_word: מִבְשָׂם
  choice: Mibsam
  rationale: Transliterasi langsung nama Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan nama pertama ditata sebagai aposisi—“Nebayot, anak sulung Ismael”—agar hubungan sintaksisnya jelas tanpa menambah tafsiran. Kata “lalu” menjaga aliran daftar tanpa menyiratkan hubungan teologis tambahan.
