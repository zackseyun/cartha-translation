id: 1CH.1.8
reference: 1 Chronicles 1:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּנֵ֖י חָ֑ם כּ֥וּשׁ וּ/מִצְרַ֖יִם פּ֥וּט וּ/כְנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/008.yaml
  text: 'The sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: id
  text: 'Anak-anak Ham[a]: Kus, Misraim[b], Put, dan Kanaan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keturunan Ham”. Dalam rumus silsilah Ibrani, “anak-anak” dapat menunjuk kepada anak langsung ataupun keturunan dalam garis yang lebih luas.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “Misraim”, nama yang secara tradisional dikaitkan dengan Mesir. Bentuk nama ini dipertahankan karena muncul dalam daftar silsilah bersama Kus, Put, dan Kanaan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Bentuk jamak konstruksi dari בֵּן dalam rumus silsilah. “Anak-anak” mempertahankan ungkapan sumber dan tetap wajar dalam bahasa Indonesia, meskipun dalam silsilah dapat mencakup keturunan yang lebih luas.
- source_word: חָם
  choice: Ham
  rationale: Nama diri; ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: כּוּשׁ
  choice: Kus
  rationale: Nama diri atau nama leluhur eponim; “Kus” mencerminkan bentuk Ibrani dan merupakan bentuk yang dikenal dalam tradisi Alkitab bahasa Indonesia.
- source_word: מִצְרַיִם
  choice: Misraim
  rationale: Dalam daftar silsilah ini kata tersebut berfungsi sebagai nama diri/eponim bersama Kus, Put, dan Kanaan, sehingga bentuk transliterasi dipertahankan, bukan diterjemahkan menjadi “Mesir”.
- source_word: פּוּט
  choice: Put
  rationale: Nama diri; transliterasi langsung dan lazim dari bentuk Ibrani.
- source_word: כְנָעַן
  choice: Kanaan
  rationale: Nama diri/eponim; digunakan bentuk baku yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan istilah silsilah בְּנֵי
  choice: Menerjemahkannya sebagai “anak-anak” dan menjelaskan cakupan yang lebih luas dalam catatan kaki.
  alternative: “Keturunan”
  rationale: Pilihan ini mempertahankan bentuk konkret rumus Ibrani tanpa menutup kemungkinan bahwa istilah tersebut menunjuk kepada keturunan dalam arti lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan daftar serta bentuk nama diri dipertahankan; penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskan.
