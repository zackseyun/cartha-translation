  text: וְֽ/אֶת פַּתְרֻסִ֞ים וְ/אֶת כַּסְלֻחִ֗ים אֲשֶׁ֨ר יָצְא֥וּ מִ/שָּׁ֛ם פְּלִשְׁתִּ֖ים וְ/אֶת כַּפְתֹּרִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/012.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: id
  text: dan orang Patrusim, orang Kasluhim—dari sanalah orang Filistin berasal[a]—dan orang Kaftorim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari sanalah orang Filistin keluar.” Dalam ayat ini, susunan bahasa Ibrani paling wajar menghubungkan klausa tersebut dengan orang Kasluhim. Namun, Kejadian 10:14 memuat susunan yang sama, sedangkan tradisi Alkitab yang lebih luas juga mengaitkan orang Filistin dengan Kaftor (bdk. Amos 9:7; Yeremia 47:4).
    reason: cross_reference
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: orang Patrusim
  rationale: Nama kelompok bangsa yang berasal dari Patros; bentuk yang lazim dalam bahasa Indonesia dipertahankan sebagai transliterasi dan didahului “orang” agar jelas menunjuk suatu kelompok.
- source_word: כַּסְלֻחִים
  choice: orang Kasluhim
  rationale: Etnonim dengan rujukan yang tidak pasti; transliterasi mempertahankan bentuk Ibrani tanpa menambahkan tafsiran geografis.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: dari merekalah ... berasal
  rationale: Secara harfiah berarti “yang keluar dari sana.” Dalam konteks silsilah, ungkapan ini secara alami menyatakan asal-usul dari kelompok yang baru disebut, sambil tetap menjelaskan hubungan gramatikalnya.
- source_word: פְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Sebutan baku dalam bahasa Indonesia untuk kelompok bangsa ini.
- source_word: כַּפְתֹּרִים
  choice: orang Kaftorim
  rationale: Etnonim yang berkaitan dengan Kaftor; ditransliterasikan sesuai bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וְאֶת
  choice: dan
  rationale: Penanda objek tidak perlu dinyatakan tersendiri dalam bahasa Indonesia; pengulangan waw diterjemahkan sebagai penghubung daftar “dan”.
theological_decisions:
- issue: Acuan klausa tentang asal orang Filistin
  choice: Klausa utama dihubungkan dengan orang Kasluhim, kelompok yang tepat mendahuluinya.
  alternative: Menghubungkannya dengan orang Kaftorim berdasarkan tradisi Alkitab yang lebih luas.
  rationale: Susunan teks Ibrani Tawarikh paling wajar menjadikan Kasluhim sebagai anteseden langsung. Namun, karena teks lain mengaitkan orang Filistin dengan Kaftor, ketegangan tekstual dan tradisional ini dijelaskan dalam catatan kaki, bukan diselesaikan diam-diam.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Nama-nama bangsa ditransliterasikan dalam bentuk yang lazim bagi pembaca Alkitab Indonesia, dengan kata “orang” untuk menandai kelompok etnis. Tanda pisah memperjelas bahwa klausa relatif merupakan keterangan sisipan dalam daftar silsilah.
