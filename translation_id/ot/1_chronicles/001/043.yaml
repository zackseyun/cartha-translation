  text: וְ/אֵ֣לֶּה הַ/מְּלָכִ֗ים אֲשֶׁ֤ר מָלְכוּ֙ בְּ/אֶ֣רֶץ אֱד֔וֹם לִ/פְנֵ֥י מְלָךְ מֶ֖לֶךְ לִ/בְנֵ֣י יִשְׂרָאֵ֑ל בֶּ֚לַע בֶּן בְּע֔וֹר וְ/שֵׁ֥ם עִיר֖/וֹ דִּנְהָֽבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/043.yaml
  text: 'And these are the kings who reigned in the land of Edom before any king reigned over the sons of Israel: Bela son of Beor, and the name of his city was Dinhabah.'
translation:
  language: id
  text: 'Inilah raja-raja yang memerintah di tanah Edom sebelum seorang raja memerintah atas orang Israel[a]: Bela anak Beor; nama kotanya Dinhaba.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebelum ada raja yang memerintah atas orang Israel.” Secara harfiah, bahasa Ibrani berbunyi, “sebelum seorang raja memerintah bagi/atas anak-anak Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Formula presentasional ini secara alami membuka daftar dalam bahasa Indonesia; kesinambungan dengan konteks sudah tersirat sehingga וְ tidak perlu diterjemahkan secara kaku sebagai “dan”.
- source_word: הַמְּלָכִים אֲשֶׁר מָלְכוּ
  choice: raja-raja yang memerintah
  rationale: Mempertahankan permainan akar מלך melalui istilah kerajaan yang wajar dalam bahasa Indonesia, tanpa ungkapan berlebihan.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: di tanah Edom
  rationale: Menerjemahkan אֶרֶץ secara eksplisit sekaligus menjaga bentuk yang alami dan geografis.
- source_word: לִפְנֵי מְלָךְ מֶלֶךְ
  choice: sebelum seorang raja memerintah
  rationale: Mengikuti bentuk tunggal dan konstruksi verbal Ibrani dengan dekat. Karena frasa ini juga dapat dipahami secara tak tentu sebagai “sebelum ada raja,” alternatif dicatat dalam catatan kaki.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: atas orang Israel
  rationale: Kata depan dipahami sebagai hubungan pemerintahan, sedangkan idiom harfiah “anak-anak Israel” disampaikan dengan padanan modern yang merujuk kepada bangsa Israel.
- source_word: בֶּלַע בֶּן בְּעוֹר
  choice: Bela anak Beor
  rationale: Nama-nama ditransliterasikan dan hubungan keturunan diterjemahkan secara ringkas serta alami.
- source_word: וְשֵׁם עִירוֹ דִּנְהָבָה
  choice: nama kotanya Dinhaba
  rationale: Klausa nominal Ibrani diterjemahkan secara ringkas dan idiomatis; nama tempat ditransliterasikan sesuai kelaziman bahasa Indonesia.
theological_decisions:
- issue: Apakah frasa לִפְנֵי מְלָךְ מֶלֶךְ menunjuk kepada seorang raja tertentu atau kepada adanya monarki secara umum
  choice: Teks utama memakai “sebelum seorang raja memerintah,” mengikuti bentuk tunggal tak tentu dalam bahasa Ibrani.
  alternative: “sebelum ada raja yang memerintah” atau “sebelum raja mana pun memerintah”
  rationale: Bahasa Ibrani secara harfiah menyatakan “sebelum memerintahnya seorang raja bagi/atas orang Israel” dan tidak secara tegas menentukan apakah fokusnya satu raja atau munculnya monarki. Catatan kaki mempertahankan kemungkinan kedua.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur daftar dipertahankan, tetapi konstruksi nominal dan idiom etnis Ibrani dibuat alami bagi pembaca umum.
