  text: וַ/יָּ֖מָת הֲדָ֑ד וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו שַׂמְלָ֖ה מִ/מַּשְׂרֵקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/047.yaml
  text: Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: id
  text: Hadad mati, lalu Samla dari Masreka menjadi raja menggantikan dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesudah dia.” Ungkapan Ibraninya secara harfiah berarti “di tempatnya” dan di sini menandai pergantian raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mati
  rationale: Bentuk wayyiqtol dari מוּת secara langsung menyatakan kematian. “Mati” adalah padanan Indonesia yang lugas dan tidak memperhalus maknanya.
- source_word: הֲדָד
  choice: Hadad
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam rumus pergantian raja, kata kerja מָלַךְ menyatakan bahwa seseorang mulai menduduki dan menjalankan jabatan raja. “Menjadi raja” alami dalam bahasa Indonesia dan sesuai dengan konteks daftar kerajaan.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: תַּחַת dengan akhiran pronominal di sini menandai pergantian dalam jabatan. Pilihan ini menyampaikan arti “di tempatnya” secara alami tanpa mengaburkan hubungan suksesi.
- source_word: שַׂמְלָה
  choice: Samla
  rationale: Nama diri ditransliterasikan ke dalam bentuk Indonesia tanpa mempertahankan huruf akhir yang tidak diperlukan untuk pelafalan.
- source_word: מִמַּשְׂרֵקָה
  choice: dari Masreka
  rationale: Awalan מִן menunjukkan asal atau hubungan dengan suatu tempat; “dari Masreka” merupakan ungkapan Indonesia yang jelas dan wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata “lalu” mempertahankan alur naratif ringkas daftar raja. Penanda catatan kaki ditempatkan sesudah frasa pergantian raja karena catatan tersebut menjelaskan תַּחְתָּיו, bukan kata “mati”.
