  yaml_path: translation/ot/1_chronicles/001/048.yaml
  text: Samlah died[a], and Shaul from Rehoboth by the River reigned in his place.
translation:
  language: id
  text: Samla mati, lalu Saul dari Rehobot di tepi Sungai[a] menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sungai itu”; banyak orang memahami sebutan ini sebagai Sungai Efrat.
    reason: Bahasa Ibrani hanya menyebut “sungai itu”, walaupun sebutan tersebut sering dipahami mengacu pada Sungai Efrat.
lexical_decisions:
- source_word: וַיָּמָת
  choice: mati
  rationale: Bentuk Qal wayyiqtol dari מות secara langsung menyatakan kematian; “mati” merupakan ungkapan naratif yang lugas tanpa eufemisme.
- source_word: שַׂמְלָה
  choice: Semla
  rationale: Nama diri ditransliterasikan ke dalam bentuk yang wajar dalam bahasa Indonesia.
- source_word: וַיִּמְלֹךְ
  choice: memerintah
  rationale: Dalam rumusan pergantian raja, מלך berarti memerintah sebagai raja; konteks sudah memperjelas kedudukan kerajaan tanpa harus menambahkan kata yang tidak tersurat.
- source_word: תַּחְתָּיו
  choice: menggantikannya
  rationale: Dalam konteks suksesi, תחת dengan akhiran pronominal berarti mengambil tempat orang sebelumnya; “menggantikannya” alami dan ringkas dalam bahasa Indonesia.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Nama diri ini memakai bentuk transliterasi yang sudah mapan dan mudah dikenali dalam bahasa Indonesia; konteks membedakannya dari Saul orang Israel.
- source_word: מֵרְחֹבוֹת
  choice: dari Rehobot
  rationale: Prefiks מ־ menyatakan asal atau hubungan dengan suatu tempat; Rehobot dipertahankan sebagai nama tempat.
- source_word: הַנָּהָר
  choice: Sungai
  rationale: Secara harfiah berarti “sungai itu” dan mungkin berfungsi sebagai sebutan geografis khusus. Huruf kapital mempertahankan kemungkinan tersebut tanpa menyisipkan nama Efrat ke dalam teks.
