  text: בְּנֵ֣י יֶ֔פֶת גֹּ֣מֶר וּ/מָג֔וֹג וּ/מָדַ֖י וְ/יָוָ֣ן וְ/תֻבָ֑ל וּ/מֶ֖שֶׁךְ וְ/תִירָֽס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/005.yaml
  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: id
  text: 'Anak-anak Yafet: Gomer[a], Magog, Madai, Yawan, Tubal, Mesekh, dan Tiras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam silsilah, kata Ibrani yang diterjemahkan “anak-anak” dapat menunjuk kepada anak langsung atau keturunan dalam arti yang lebih luas; di sini kata itu memperkenalkan garis keturunan Yafet dalam bentuk daftar.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן yang membuka daftar silsilah. Dalam konteks ini kata tersebut secara langsung menyebut anak-anak Yafet, tetapi dalam pemakaian silsilah dapat pula mencakup keturunan yang lebih luas.
- source_word: יֶפֶת
  choice: Yafet
  rationale: Nama diri, ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: גֹּמֶר
  choice: Gomer
  rationale: Nama diri dalam daftar silsilah; ditransliterasikan, bukan diterjemahkan.
- source_word: מָגוֹג
  choice: Magog
  rationale: Nama diri; ditransliterasikan menurut bentuk yang lazim.
- source_word: מָדַי
  choice: Madai
  rationale: Nama diri dalam silsilah. Hubungannya dengan bangsa Media tidak dijadikan tafsiran etnis dalam teks utama.
- source_word: יָוָן
  choice: Yawan
  rationale: Nama diri; transliterasi dengan Y mencerminkan bentuk Ibrani dan mengikuti kelaziman Indonesia, tanpa menggantinya dengan nama etnis Yunani.
- source_word: תֻבָל
  choice: Tubal
  rationale: Nama diri; ditransliterasikan.
- source_word: מֶשֶׁךְ
  choice: Mesekh
  rationale: Nama diri; bentuk kh dipakai untuk mencerminkan konsonan akhir כ secara wajar dalam transliterasi Indonesia.
- source_word: תִירָס
  choice: Tiras
  rationale: Nama diri; ditransliterasikan.
- source_word: וְ / וּ
  choice: daftar dengan koma dan 'dan' sebelum unsur terakhir
  rationale: Bahasa Ibrani mengulang kata penghubung pada sebagian besar unsur. Tanda koma serta 'dan' sebelum nama terakhir menghasilkan daftar yang alami dalam bahasa Indonesia tanpa mengubah fungsinya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan nominal tanpa kata kerja dipertahankan karena sesuai dengan gaya daftar silsilah sumber Ibrani. Ejaan nama mengikuti bentuk yang lazim atau transliterasi yang wajar dalam bahasa Indonesia.
