  yaml_path: translation/ot/1_chronicles/001/023.yaml
  text: and Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: id
  text: serta Ofir, Hawila, dan Yobab. Mereka semua adalah putra-putra Yoktan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keturunan Yoktan.” Teks Ibrani berbunyi “putra-putra Yoktan,” tetapi dalam konteks silsilah, kata ini kadang-kadang dapat menunjuk lebih luas kepada garis keturunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: serta / dan
  rationale: אֵת adalah penanda objek langsung dan tidak diterjemahkan tersendiri; prefiks וְ mengoordinasikan nama-nama dalam daftar. “Serta” melanjutkan daftar dari ayat sebelumnya, sedangkan “dan” menandai unsur terakhir secara alami dalam bahasa Indonesia.
- source_word: אוֹפִיר
  choice: Ofir
  rationale: Nama diri ini ditransliterasikan dalam bentuk yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: חֲוִילָה
  choice: Hawila
  rationale: Nama diri ini ditransliterasikan mengikuti bentuk yang lazim dalam bahasa Indonesia.
- source_word: יוֹבָב
  choice: Yobab
  rationale: Nama diri ini ditransliterasikan secara langsung dan selaras dengan ejaan Indonesia.
- source_word: כָּל אֵלֶּה
  choice: Mereka semua
  rationale: Frasa ini merangkum semua nama yang disebut sebelumnya. Karena acuannya adalah orang-orang, “mereka semua” terdengar lebih alami daripada “semua ini” tanpa menghilangkan cakupan menyeluruhnya.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Bentuk jamak בְּנֵי secara harfiah berarti “anak-anak lelaki dari,” tetapi “anak-anak” merupakan ungkapan silsilah Indonesia yang alami dan tetap mempertahankan hubungan keturunan langsung yang dinyatakan teks; kemungkinan makna garis keturunan yang lebih luas dicatat dalam catatan kaki.
- source_word: יָקְטָן
  choice: Yoktan
  rationale: Transliterasi ini lebih dekat dengan bentuk Ibrani dan tetap mudah dibaca dalam bahasa Indonesia.
