  register: Bahasa Indonesia baku, modern, dan ringkas dengan gaya daftar silsilah. “Serta” menjaga kesinambungan dengan nama-nama pada ayat sebelumnya; tanda [a] ditempatkan setelah seluruh pernyataan tentang anak-anak Yoktan karena catatan menerangkan istilah בְּנֵי.
