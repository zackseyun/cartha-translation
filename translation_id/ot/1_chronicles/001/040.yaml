base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/040.yaml
  text: 'The sons of Shobal: Alian[a], Manahath, Ebal, Shephi, and Onam[b]. And the sons of Zibeon: Aiah and Anah.'
translation:
  language: id
  text: 'Anak-anak laki-laki Syobal: Alyan[a], Manahat, Ebal, Syefi[b], dan Onam. Anak-anak laki-laki Zibeon: Aya dan Ana.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani di sini berbunyi “Alyan”; silsilah sejajar dalam Kejadian 36:23 berbunyi “Alwan”.
    reason: alternative_reading
  - marker: b
    text: Kitab Tawarikh berbunyi “Syefi”; bagian sejajar dalam Kejadian 36:23 berbunyi “Syefo”.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Dalam daftar silsilah ini, bentuk tersebut menunjuk pada anak-anak laki-laki yang disebutkan satu per satu. Bahasa Indonesia lazim memakai “anak-anak” dalam rumusan silsilah tanpa harus mengulang kata “laki-laki”.
- source_word: שׁוֹבָל
  choice: Syobal
  rationale: Nama diri ditransliterasikan dengan ejaan Indonesia; שׁ diwakili oleh “sy”.
- source_word: עַלְיָן
  choice: Alyan
  rationale: Mencerminkan bentuk Ibrani dalam Tawarikh secara langsung, dengan “y” untuk unsur konsonantal sebelum vokal; perbedaan pada silsilah sejajar dicatat dalam catatan kaki.
- source_word: מָנַחַת
  choice: Manahat
  rationale: Transliterasi nama diri yang alami dalam bahasa Indonesia; bunyi ח disederhanakan menjadi “h”.
- source_word: עֵיבָל
  choice: Ebal
  rationale: Transliterasi langsung bentuk nama dalam teks Ibrani ayat ini.
- source_word: שְׁפִי
  choice: Syefi
  rationale: Mencerminkan vokal akhir bentuk Tawarikh dan memakai ejaan Indonesia “sy” untuk שׁ; bentuk berbeda dalam Kejadian dicatat dalam catatan kaki.
- source_word: אוֹנָם
  choice: Onam
  rationale: Transliterasi langsung nama diri Ibrani.
- source_word: צִבְעוֹן
  choice: Zibeon
  rationale: Transliterasi yang jelas dan lazim dibaca dalam bahasa Indonesia, dengan tetap mempertahankan bentuk nama Ibrani.
- source_word: אַיָּה
  choice: Aya
  rationale: Transliterasi nama Ibrani ke ejaan Indonesia; “y” mewakili bunyi konsonantal ganda tanpa mempertahankan penggandaan yang tidak diperlukan.
- source_word: עֲנָה
  choice: Ana
  rationale: Transliterasi alami dalam bahasa Indonesia; konsonan tenggorokan awal tidak diberi tanda teknis dalam teks umum.
- source_word: וְ / וּ / וַ
  choice: dan
  rationale: Konjungsi Ibrani menghubungkan nama dan bagian daftar; “dan” mempertahankan koordinasinya secara alami.
