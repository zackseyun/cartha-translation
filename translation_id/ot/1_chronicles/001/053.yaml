lexical_decisions:
- source_word: אַלּוּף
  choice: pemimpin
  rationale: Dalam daftar para pemimpin Edom, istilah ini menunjuk kepada pemimpin suku atau kaum. “Pemimpin” jelas, ringkas, dan wajar dalam bahasa Indonesia modern, sementara nuansa khususnya dicatat dalam catatan kaki.
- source_word: קְנַז
  choice: Kenas
  rationale: Nama diri yang ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: תֵּימָן
  choice: Teman
  rationale: Dalam konteks daftar ini, kata tersebut berfungsi sebagai nama diri atau nama kaum, sehingga ditransliterasikan sebagai “Teman” tanpa mempersempit rujukannya.
- source_word: מִבְצָר
  choice: Mibzar
  rationale: Nama diri yang ditransliterasikan, bukan diterjemahkan berdasarkan arti leksikalnya.
