id: 1CH.1.42
reference: 1 Chronicles 1:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּֽנֵי אֵ֔צֶר בִּלְהָ֥ן וְ/זַעֲוָ֖ן יַעֲקָ֑ן בְּנֵ֥י דִישׁ֖וֹן ע֥וּץ וַ/אֲרָֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/042.yaml
  text: 'The sons of Ezer: Bilhan[a], Zaavan, and Jaakan[b]. The sons of Dishon: Uz and Aran.'
translation:
  language: id
  text: 'Anak-anak Ezer: Bilhan, Zaawan, dan Yaakan.[a] Anak-anak Disyon: Us dan Aran.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam teks Ibrani ayat ini tertulis Yaakan; dalam silsilah sejajar di Kejadian 36:27 tertulis Akan.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן yang memperkenalkan daftar silsilah; dalam konteks ini menunjuk kepada anak-anak laki-laki, tetapi bahasa Indonesia lazim memakai “anak-anak” secara alami tanpa harus menambahkan “laki-laki”.
- source_word: אֵצֶר
  choice: Ezer
  rationale: Nama diri, dialihaksarakan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בִּלְהָן
  choice: Bilhan
  rationale: Nama diri yang dialihaksarakan langsung.
- source_word: זַעֲוָן
  choice: Zaawan
  rationale: Nama diri; bentuk “Zaawan” mencerminkan vokal dan konsonan Ibrani serta mengikuti kebiasaan ejaan nama Alkitab dalam bahasa Indonesia.
- source_word: יַעֲקָן
  choice: Yaakan
  rationale: Nama diri; bentuk ini mempertahankan yod awal dalam teks Tawarikh. Bentuk paralelnya di Kejadian 36:27 adalah Akan dan dicatat dalam catatan kaki.
- source_word: דִישׁוֹן
  choice: Disyon
  rationale: Nama diri; “sy” mewakili bunyi שׁ dan membedakannya dari דִישָׁן, “Disyan”, dalam silsilah Edom.
- source_word: עוּץ
  choice: Us
  rationale: Nama diri yang memakai bentuk Indonesia yang sudah lazim untuk עוּץ.
- source_word: אֲרָן
  choice: Aran
  rationale: Nama diri yang dialihaksarakan langsung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Tanda titik dua dipakai untuk memperkenalkan nama-nama dalam daftar silsilah. Catatan Inggris tentang “Zaavan/Zavan” tidak dipertahankan karena kedua bagian dalam WLC memakai bentuk Ibrani yang sama, זַעֲוָן; perbedaannya hanya cara alih aksara, bukan bacaan sumber yang berlainan.
