lexical_decisions:
- source_word: אַלּוּף
  choice: pemimpin kaum
  rationale: Dalam daftar keturunan dan kelompok Edom, istilah ini menunjuk kepada kepala suatu kaum atau kelompok kekerabatan, bukan khusus panglima militer. Frasa ini alami dalam bahasa Indonesia dan mempertahankan fungsi gelar yang diulang sebelum setiap nama.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Nama diri dialihaksarakan dari bahasa Ibrani dengan bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: אֵלָה
  choice: Ela
  rationale: Nama diri dialihaksarakan, bukan diterjemahkan.
- source_word: פִּינֹן
  choice: Pinon
  rationale: Nama diri dialihaksarakan secara ringkas dari bentuk Ibrani.
