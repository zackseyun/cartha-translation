  text: Pemimpin kaum Oholibama[a], pemimpin kaum Ela, pemimpin kaum Pinon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepala kaum”. Istilah Ibrani ini menunjuk kepada pemimpin suatu kaum atau kelompok kekerabatan.
