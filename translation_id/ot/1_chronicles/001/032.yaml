source:
  edition: WLC
  text: וּ/בְנֵ֨י קְטוּרָ֜ה פִּילֶ֣גֶשׁ אַבְרָהָ֗ם יָלְדָ֞ה אֶת זִמְרָ֧ן וְ/יָקְשָׁ֛ן וּ/מְדָ֥ן וּ/מִדְיָ֖ן וְ/יִשְׁבָּ֣ק וְ/שׁ֑וּחַ וּ/בְנֵ֥י יָקְשָׁ֖ן שְׁבָ֥א וּ/דְדָֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/032.yaml
  text: 'And the sons of Keturah[a], Abraham’s concubine: she bore Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah. And the sons of Jokshan: Sheba and Dedan.'
translation:
  language: id
  text: Anak-anak Ketura, gundik Abraham, yang ia lahirkan ialah Zimran, Yoksan, Medan, Midian, Isybak, dan Suah. Anak-anak Yoksan ialah Syeba dan Dedan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְטוּרָה
  choice: Anak-anak Ketura
  rationale: Bentuk konstruksi jamak berarti “anak-anak Ketura.” Konjungsi waw tidak diterjemahkan secara tersendiri karena ayat ini melanjutkan daftar silsilah dan pembukaan tanpa “dan” lebih alami dalam bahasa Indonesia.
- source_word: פִּילֶגֶשׁ אַבְרָהָם
  choice: gundik Abraham
  rationale: פִּילֶגֶשׁ menunjuk pada perempuan dalam ikatan yang diakui tetapi berstatus lebih rendah daripada istri utama. “Gundik” merupakan padanan Indonesia yang ringkas dan mempertahankan pembedaan istilah dalam teks.
- source_word: יָלְדָה
  choice: yang dilahirkannya
  rationale: Verba feminin tunggal merujuk kepada Ketura. Susunan ini mempertahankan Ketura sebagai pelaku dan menghasilkan kalimat silsilah yang alami dalam bahasa Indonesia.
- source_word: זִמְרָן
  choice: Zimran
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: יָקְשָׁן
  choice: Yoksan
  rationale: Nama diri ditransliterasikan dengan ejaan Indonesia yang mencerminkan konsonan awal Ibrani yod.
- source_word: מְדָן
  choice: Medan
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מִדְיָן
  choice: Midian
  rationale: Nama diri memakai bentuk konvensional dalam bahasa Indonesia.
- source_word: יִשְׁבָּק
  choice: Isybak
  rationale: Nama diri ditransliterasikan dengan “sy” untuk bunyi shin dan bentuk yang mudah dibaca dalam bahasa Indonesia.
- source_word: שׁוּחַ
  choice: Suah
  rationale: Nama diri ditransliterasikan menurut bentuk konvensional Indonesia.
- source_word: שְׁבָא וּדְדָן
  choice: Syeba dan Dedan
  rationale: Kedua nama diri memakai bentuk yang lazim dalam Alkitab bahasa Indonesia; waw diterjemahkan “dan.”
theological_decisions:
- issue: Status Ketura dalam hubungannya dengan Abraham
  choice: gundik
  alternative: istri; istri sekunder
  rationale: Ayat ini secara eksplisit memakai פִּילֶגֶשׁ. Terjemahan mempertahankan istilah tersebut dan tidak menyelaraskannya secara diam-diam dengan Kejadian 25:1, yang menyebut Ketura sebagai istri Abraham.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar silsilah dibuat alami dengan “ialah,” sementara hubungan sintaksis verba feminin dengan Ketura tetap dinyatakan. Ejaan nama mengikuti kelaziman Alkitab bahasa Indonesia sejauh sesuai dengan bentuk Ibrani.
