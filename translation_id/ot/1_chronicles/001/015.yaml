base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/015.yaml
  text: and the Hivites[a], and the Arkites, and the Sinites.
translation:
  language: id
  text: serta orang Hewi[a], orang Arki, dan orang Sini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani memakai bentuk gentilik tunggal dengan kata sandang (secara harfiah, “orang Hewi itu”, demikian pula “orang Arki” dan “orang Sini”), tetapi dalam konteks silsilah ini bentuk-bentuk tersebut menunjuk kepada bangsa atau kaum secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: serta / dan
  rationale: Konjungsi ו menyambungkan unsur-unsur dalam daftar; אֵת adalah penanda objek langsung dan tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia. "Serta" dipakai pada awal petikan agar alami, sedangkan "dan" menandai unsur terakhir.
- source_word: הַחִוִּי
  choice: orang Hewi
  rationale: Bentuk gentilik berartikel ini menunjuk secara kolektif kepada suatu bangsa atau kaum. Dalam bahasa Indonesia, pola "orang + nama kelompok" wajar dan tidak perlu diberi penanda jamak.
- source_word: הָעַרְקִי
  choice: orang Arki
  rationale: Sebutan gentilik bagi kelompok yang berasal dari tempat atau kaum tertentu; diterjemahkan dengan pola kolektif Indonesia "orang Arki".
- source_word: הַסִּינִי
  choice: orang Sini
  rationale: Sebutan gentilik yang dalam konteks silsilah ini menunjuk kepada suatu kelompok bangsa; bentuk "orang Sini" mempertahankan nama tersebut secara ringkas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Bentuk kolektif "orang Hewi/Arki/Sini" dipilih karena "orang" dalam bahasa Indonesia dapat menunjuk kepada kelompok tanpa penandaan jamak; susunan tetap mengikuti daftar Ibrani.
