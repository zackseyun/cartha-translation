translation:
  language: id
  text: Mizraim memperanakkan Ludim[a], Anamim, Lehabim, dan Naftuhim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, sebagai nama-nama bangsa: “Ludi, Anami, Lehabi, dan Naftuhi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: Mizraim
  rationale: Dalam silsilah ini kata tersebut berfungsi sebagai nama diri, sehingga ditransliterasikan, bukan diterjemahkan sebagai nama tempat “Mesir”.
- source_word: יָלַד
  choice: memperanakkan
  rationale: Kata kerja ini merupakan istilah silsilah yang menyatakan asal-usul atau keturunan. “Memperanakkan” mempertahankan bingkai genealogis teks tanpa mengubahnya menjadi sekadar hubungan geografis atau politis.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai objek langsung dalam bahasa Ibrani; fungsinya sudah tercermin dalam susunan kalimat bahasa Indonesia.
- source_word: לודיים
  choice: bangsa Ludi
  rationale: Bentuk Ibrani menunjuk kepada suatu kelompok bangsa. Bentuk “Ludi” sesudah kata “bangsa” terdengar alami dalam bahasa Indonesia, sedangkan transliterasi yang lebih langsung dicatat dalam catatan kaki.
- source_word: עֲנָמִים
  choice: Anami
  rationale: Dirender sebagai nama kelompok bangsa yang sejajar dengan nama-nama lain dalam daftar; kata “bangsa” berlaku bagi seluruh rangkaian.
- source_word: לְהָבִים
  choice: Lehabi
  rationale: Dirender sebagai etnonim Indonesia yang ringkas dan sejajar dengan nama kelompok lainnya.
- source_word: נַפְתֻּחִים
  choice: Naftuhi
  rationale: Dirender sebagai etnonim Indonesia; ejaan “f” mewakili bunyi konsonan Ibrani dalam bentuk ini, sementara bentuk transliterasi langsung disediakan dalam catatan kaki.
