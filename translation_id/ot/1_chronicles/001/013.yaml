  text: וּ/כְנַ֗עַן יָלַ֛ד אֶת צִיד֥וֹן בְּכֹר֖/וֹ וְ/אֶת חֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/013.yaml
  text: And Canaan fathered Sidon his firstborn[b][a], and Heth.
translation:
  language: id
  text: Kanaan memperanakkan Sidon, anak sulungnya, dan Het.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Het adalah leluhur yang dikaitkan dengan orang Het.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: Kanaan
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim. Konjungsi waw tidak diterjemahkan tersendiri karena ayat ini merupakan kelanjutan langsung dalam daftar silsilah dan bahasa Indonesia tidak memerlukan kata penghubung pada awal entri ini.
- source_word: יָלַד
  choice: memperanakkan
  rationale: Dalam konteks silsilah dengan subjek laki-laki, verba ini menyatakan bahwa seseorang menjadi ayah atau leluhur dari orang yang disebut. 'Memperanakkan' ringkas dan mempertahankan pola genealogis teks.
- source_word: אֶת
  choice: '[tidak diterjemahkan tersendiri]'
  rationale: Penanda objek langsung bahasa Ibrani tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia.
- source_word: צִידוֹן
  choice: Sidon
  rationale: Bentuk ini mengikuti transliterasi nama tempat dan nama diri yang lazim dalam bahasa Indonesia.
- source_word: בְּכֹר/וֹ
  choice: anak sulungnya
  rationale: Menerjemahkan nomina 'anak sulung' beserta sufiks orang ketiga maskulin tunggal secara alami dan mempertahankan penekanan pada urutan kelahiran.
- source_word: וְ/אֶת
  choice: dan
  rationale: Konjungsi diterjemahkan 'dan' untuk memperkenalkan keturunan kedua, sedangkan penanda objek langsung tidak diterjemahkan tersendiri.
- source_word: חֵת
  choice: Het
  rationale: Teks memakai nama diri tunggal Het, bukan bentuk jamak etnonim. Karena itu, nama leluhur dipertahankan dan tidak diganti dengan 'orang Het'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Istilah 'memperanakkan' dipertahankan sebagai ungkapan genealogis yang tepat, sedangkan tanda baca memperjelas bahwa 'anak sulungnya' menerangkan Sidon.
