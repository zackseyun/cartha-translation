  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan nominal dengan titik dua mempertahankan corak daftar silsilah Ibrani. Nama-nama ditransliterasikan dalam bentuk yang alami bagi pembaca Indonesia.
