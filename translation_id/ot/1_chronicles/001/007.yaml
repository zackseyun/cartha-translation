  text: וּ/בְנֵ֥י יָוָ֖ן אֱלִישָׁ֣ה וְ/תַרְשִׁ֑ישָׁ/ה כִּתִּ֖ים וְ/רוֹדָנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/007.yaml
  text: 'And the sons of Javan: Elishah[a], Tarshish, Kittim, and Rodanim.'
translation:
  language: id
  text: Dan anak-anak Yawan ialah Elisa, Tarsis, Kitim, dan Rodanim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kejadian 10:4 menyebut “Dodanim”, bukan “Rodanim”; perbedaan ini mencerminkan varian tekstual pada nama tersebut.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruksi בְּנֵי secara harfiah berarti “anak-anak lelaki dari”; “anak-anak” mempertahankan gaya silsilah secara alami dalam bahasa Indonesia tanpa menambahkan penafsiran “keturunan”.
- source_word: יָוָן
  choice: Yawan
  rationale: Nama diri ditransliterasikan menurut bunyi Ibrani dan tidak diganti dengan “Yunani,” karena teks menyajikannya sebagai nama dalam silsilah.
- source_word: אֱלִישָׁה
  choice: Elisa
  rationale: Nama diri ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: תַּרְשִׁישָׁה
  choice: Tarsis
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim; akhiran he pada bentuk Ibrani tidak perlu diterjemahkan tersendiri.
- source_word: כִּתִּים
  choice: Kitim
  rationale: Nama kelompok atau tempat ini ditransliterasikan; bentuk jamaknya dipertahankan sebagai bagian dari nama tanpa menambahkan kata penjelas “orang” yang tidak dinyatakan secara eksplisit.
- source_word: וְרוֹדָנִים
  choice: dan Rodanim
  rationale: Teks Masoret kitab Tawarikh berbunyi רוֹדָנִים, sehingga teks utama mengikuti “Rodanim”; varian “Dodanim” dalam Kejadian 10:4 dicatat dalam catatan kaki.
