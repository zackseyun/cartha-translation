  text: Joktan fathered Almodad[a], Sheleph, Hazarmaveth, and Jerah.
translation:
  language: id
  text: Yoktan menjadi ayah dari Almodad[a], Selef, Hazarmawet, dan Yerah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperanakkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקְטָן
  choice: Yoktan
  rationale: Nama diri ditransliterasikan menurut kebiasaan Alkitab bahasa Indonesia, dengan huruf Y untuk yod Ibrani.
- source_word: יָלַד
  choice: memperanakkan
  rationale: Dalam silsilah dengan subjek laki-laki, kata ini menyatakan hubungan ayah dengan keturunannya. 'Memperanakkan' ringkas, wajar dalam register silsilah Alkitab, dan tidak menyiratkan bahwa sang ayah melahirkan.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara terpisah; penanda objek langsung]'
  rationale: Partikel ini menandai objek langsung tertentu dan tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia.
- source_word: אַלְמוֹדָד
  choice: Almodad
  rationale: Nama diri ditransliterasikan; bentuk ini sudah lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: שָׁלֶף
  choice: Selef
  rationale: Nama diri ditransliterasikan berdasarkan pelafalan Ibrani dan mengikuti bentuk yang dikenal pembaca Alkitab Indonesia.
- source_word: חֲצַרְמָוֶת
  choice: Hazarmawet
  rationale: Nama diri ditransliterasikan dengan mempertahankan bentuk konsonantal Ibrani dalam ejaan Indonesia.
- source_word: יָרַח
  choice: Yerah
  rationale: Nama diri ditransliterasikan dekat dengan pelafalan Ibrani, memakai Y untuk yod dan h akhir untuk konsonan het.
