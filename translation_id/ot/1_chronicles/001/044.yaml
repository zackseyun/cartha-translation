  text: וַ/יָּ֖מָת בָּ֑לַע וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו יוֹבָ֥ב בֶּן זֶ֖רַח מִ/בָּצְרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/044.yaml
  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: id
  text: Bela mati, lalu Yobab anak Zerah dari Bozra[a] menjadi raja menggantikan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata depan Ibrani dapat menunjukkan bahwa Yobab berasal dari Bozra atau berhubungan dengan kota itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mati
  rationale: Bentuk wayyiqtol dari מוּת menyatakan peristiwa berikutnya dalam rangkaian narasi. Kata penghubungnya diwujudkan secara alami melalui “lalu” pada klausa selanjutnya.
- source_word: בָּלַע
  choice: Bela
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam rumus pergantian raja ini, bentuk Qal wayyiqtol dari מלך menunjuk pada naiknya seseorang ke takhta. “Menjadi raja” menyampaikan peralihan itu secara alami dalam bahasa Indonesia.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Dalam konteks suksesi, תַּחַת dengan sufiks pronominal berarti mengambil kedudukan pendahulunya. Ungkapan ini alami dan tetap mempertahankan gagasan pergantian.
- source_word: יוֹבָב
  choice: Yobab
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן זֶרַח
  choice: bin Zerah
  rationale: Konstruksi patronimik Ibrani diterjemahkan dengan “bin,” bentuk ringkas dan umum dalam bahasa Indonesia untuk menyatakan anak laki-laki dari seseorang.
- source_word: מִבָּצְרָה
  choice: dari Bozra
  rationale: Preposisi מִן biasanya menyatakan asal, tetapi di sini juga dapat menunjukkan hubungan dengan kota tersebut. “Dari Bozra” merupakan padanan langsung dan alami tanpa menutup kemungkinan hubungan yang lebih umum.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat, sesuai dengan gaya daftar suksesi. “Lalu” memperjelas urutan naratif, sedangkan “menjadi raja menggantikan dia” menyampaikan rumus pergantian pemerintahan secara alami.
