  text: the Jebusites[a], the Amorites, and the Girgashites.
translation:
  language: id
  text: orang Yebusi[a], orang Amori, dan orang Girgasi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, nama-nama bangsa pada ayat ini berbentuk tunggal, tetapi digunakan secara kolektif untuk menyebut orang Yebusi, orang Amori, dan orang Girgasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: orang Yebus
  rationale: Bentuk nisbah tunggal Ibrani dipakai secara kolektif untuk suatu kelompok bangsa. Dalam bahasa Indonesia, pola “orang + nama bangsa” secara alami dapat menyatakan kelompok secara kolektif.
- source_word: הָאֱמֹרִי
  choice: orang Amori
  rationale: Seperti nama-nama bangsa di sekitarnya, bentuk nisbah tunggal ini mengacu secara kolektif kepada bangsa Amori.
- source_word: הַגִּרְגָּשִׁי
  choice: orang Girgasi
  rationale: Diterjemahkan sebagai nama kelompok bangsa secara kolektif, selaras dengan gaya daftar silsilah dan pemakaian bahasa Indonesia.
- source_word: וְאֶת / וְאֵת
  choice: dan
  rationale: אֶת adalah penanda objek langsung dan tidak perlu diterjemahkan tersendiri. Konjungsi וְ dinyatakan melalui tanda koma dan “dan” pada unsur terakhir.
