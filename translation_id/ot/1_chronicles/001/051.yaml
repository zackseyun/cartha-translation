  register: Bahasa Indonesia baku, modern, dan ringkas. Struktur daftar serta pengulangan אַלּוּף dipertahankan dengan frasa “kepala kaum”. Tanda catatan kaki ditempatkan tepat pada istilah atau nama yang dijelaskannya.
