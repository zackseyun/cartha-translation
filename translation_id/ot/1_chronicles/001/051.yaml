id: 1CH.1.51
reference: 1 Chronicles 1:51
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֖מָת הֲדָ֑ד וַ/יִּהְיוּ֙ אַלּוּפֵ֣י אֱד֔וֹם אַלּ֥וּף תִּמְנָ֛ע אַלּ֥וּף עליה אַלּ֥וּף יְתֵֽתס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/051.yaml
  text: 'Hadad died[a], and the chiefs of Edom were: Chief Timna, Chief Aliah[c][b], Chief Jetheth.'
translation:
  language: id
  text: Hadad mati. Para kepala kaum[a] Edom adalah kepala kaum Timna[b], kepala kaum Alya[c], dan kepala kaum Yetet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani אַלּוּף menunjuk kepada kepala suatu kaum atau kelompok suku Edom. Terjemahan lama kadang memakai gelar “adipati”.
    reason: lexical_alternative
  - marker: b
    text: Nama Timna juga dapat ditransliterasikan sebagai “Timnah”.
    reason: lexical_alternative
  - marker: c
    text: Dalam Kejadian 36:40, nama yang sejajar berbentuk “Alwa”, sedangkan Tawarikh di sini berbunyi “Alya”.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: mati
  rationale: Bentuk wayyiqtol dari מות melanjutkan urutan narasi. Dalam bahasa Indonesia, bentuk sederhana “mati” menyampaikan peristiwa itu secara alami; hubungan dengan daftar berikutnya tetap jelas dari susunan kalimat.
- source_word: הֲדָד
  choice: Hadad
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani.
- source_word: וַיִּהְיוּ
  choice: adalah
  rationale: Di sini היה memperkenalkan daftar para kepala kaum Edom. “Adalah” merupakan penghubung yang wajar untuk membuka daftar tersebut.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: para kepala kaum / kepala kaum
  rationale: Dalam daftar politik dan kekerabatan Edom, אַלּוּף menunjuk kepada pemimpin kelompok suku atau kaum. “Kepala kaum” jelas bagi pembaca modern serta mempertahankan pengulangan gelar pada teks sumber.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Bentuk nama tempat dan bangsa yang sudah baku dalam bahasa Indonesia.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Transliterasi ini dekat dengan bentuk Ibrani dan lazim dipakai untuk nama tersebut.
- source_word: עליה
  choice: Alya
  rationale: Bentuk dalam Tawarikh mendukung transliterasi “Alya”; bentuk berbeda pada Kejadian 36:40 dicatat tanpa menggantikan bacaan teks ini.
- source_word: יְתֵת
  choice: Yetet
  rationale: Transliterasi Indonesia yang mengikuti bunyi konsonan Ibrani dan memakai “Y” untuk yod.
theological_decisions: []
