  text: Ebal[a], Abimael, and Sheba.
translation:
  language: id
  text: Ebal[a], Abimael, dan Syeba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam silsilah sejajar di Kejadian 10:28, nama ini muncul sebagai “Obal”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶת
  choice: dan
  rationale: Gabungan וְ dengan penanda objek אֶת memperkenalkan setiap nama dalam daftar silsilah. Dalam bahasa Indonesia, penanda objek itu tidak diterjemahkan tersendiri; hubungan antarnama dinyatakan dengan tanda baca dan kata “dan” sebelum nama terakhir.
- source_word: עֵיבָל
  choice: Ebal
  rationale: Nama diri ini ditransliterasikan sesuai bentuk Ibrani dalam ayat ini. Bentuk “Obal” dalam silsilah sejajar di Kejadian 10:28 dicatat dalam catatan kaki.
- source_word: אֲבִימָאֵל
  choice: Abimael
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani dan tidak diterjemahkan maknanya.
- source_word: שְׁבָא
  choice: Syeba
  rationale: Nama diri ini memakai bentuk Indonesia yang lazim untuk שְׁבָא, serta dibedakan dari nama serupa yang biasa ditulis “Seba”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan wajar untuk sebuah daftar silsilah. Ejaan nama mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia, sambil mempertahankan perbedaan tekstual melalui catatan kaki.
