lexical_decisions:
- source_word: מִשְׁמָע
  choice: Misya
  rationale: Nama diri dalam daftar silsilah; dialihaksarakan menurut bentuk Ibrani dan disesuaikan dengan ejaan Indonesia.
- source_word: וְ/דוּמָה
  choice: Duma
  rationale: דוּמָה adalah nama diri dan dialihaksarakan sebagai Duma. Konjungsi וְ tidak perlu diungkapkan pada unsur ini karena kaidah daftar bahasa Indonesia menempatkan 'dan' sebelum unsur terakhir.
- source_word: מַשָּׂא
  choice: Masa
  rationale: Dalam konteks silsilah, bentuk ini merupakan nama diri, bukan nomina umum yang berarti 'beban' atau 'ucapan ilahi'; karena itu dialihaksarakan.
- source_word: חֲדַד
  choice: Hadad
  rationale: Teks Tawarikh yang menjadi sumber membaca Hadad; bentuk ini dipertahankan meskipun daftar sejajar dalam Kejadian memuat Hadar.
- source_word: וְ/תֵימָא
  choice: dan Tema
  rationale: תֵימָא dialihaksarakan sebagai Tema, sedangkan וְ diterjemahkan 'dan' sesuai susunan alami daftar dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan wajar untuk daftar silsilah. Nama-nama diri dialihaksarakan dengan ejaan yang mudah dibaca pembaca Indonesia; tanda koma dan 'dan' mengikuti kaidah daftar bahasa Indonesia.
