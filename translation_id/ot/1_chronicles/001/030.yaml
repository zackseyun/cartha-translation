translation:
  language: id
  text: Misma[a], Duma, Masa, Hadad, dan Tema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam daftar sejajar di Kejadian 25:15 tertulis “Hadar”, sedangkan 1 Tawarikh di sini membaca “Hadad”.
