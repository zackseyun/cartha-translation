base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/046.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab; and the name of his city was Avith.
translation:
  language: id
  text: Husyam mati, lalu Hadad anak Bedad menjadi raja menggantikannya, yaitu yang memukul orang Midian di padang Moab. Nama kotanya ialah Awit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ayot”, transliterasi lain untuk nama kota ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת חוּשָׁם
  choice: Husyam mati
  rationale: Bentuk naratif dari מות berarti langsung ‘mati’; ‘Husyam’ mengikuti transliterasi yang wajar dalam bahasa Indonesia untuk nama חוּשָׁם.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: menjadi raja menggantikannya
  rationale: מלך dalam rangkaian raja-raja ini menyatakan naik takhta, sedangkan תחתיו berarti mengambil tempat pendahulunya. Ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: הֲדַד בֶּן בְּדַד
  choice: Hadad anak Bedad
  rationale: Konstruksi patronimik בן diterjemahkan secara langsung sebagai ‘anak’; kedua nama ditransliterasikan.
- source_word: הַמַּכֶּה אֶת מִדְיָן
  choice: Hadadlah yang mengalahkan orang Midian
  rationale: Partisipel נכה mengenalkan Hadad melalui tindakan militernya. Dalam konteks peperangan, ‘mengalahkan’ menyampaikan makna idiomatisnya; ‘orang Midian’ menjelaskan bahwa yang dimaksud ialah kelompok bangsa, bukan sekadar wilayah.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: di padang Moab
  rationale: שְׂדֵה secara harfiah menunjuk pada padang atau daerah terbuka. ‘Padang Moab’ mempertahankan citra dan bentuk ringkas teks Ibrani.
- source_word: וְשֵׁם עִירוֹ
  choice: Nama kotanya ialah
  rationale: Terjemahan ini mempertahankan formula penamaan Ibrani dengan susunan yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: עיות
  choice: Awit
  rationale: Nama tempat ini ditransliterasikan sebagai ‘Awit’, bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia; variasi pembacaan atau transliterasi dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Kalimat panjang Ibrani dibagi menjadi tiga kalimat agar mudah dipahami tanpa menghilangkan hubungan antarinformasi. Penegasan ‘Hadadlah’ menjaga fungsi partisipel yang mengidentifikasi Hadad sebagai pelaku tindakan tersebut.
