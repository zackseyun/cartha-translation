  text: וַ/יָּ֨מָת֙ בַּ֣עַל חָנָ֔ן וַ/יִּמְלֹ֤ךְ תַּחְתָּי/ו֙ הֲדַ֔ד וְ/שֵׁ֥ם עִיר֖/וֹ פָּ֑עִי וְ/שֵׁ֨ם אִשְׁתּ֤/וֹ מְהֵיטַבְאֵל֙ בַּת מַטְרֵ֔ד בַּ֖ת מֵ֥י זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/050.yaml
  text: Baal-hanan died[a], and Hadad reigned in his place. The name of his city was Pai, and the name of his wife was Mehetabel daughter of Matred[b], daughter of Mezahab.
translation:
  language: id
  text: Baal-Hanan mati, lalu Hadad menjadi raja menggantikannya. Kotanya bernama Pai[a], dan istrinya bernama Mehetabel, anak perempuan Matred, anak perempuan Mezahab.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam Kejadian 36:39, nama kota ini tertulis “Pau”, sedangkan dalam Tawarikh tertulis “Pai”.
    reason: textual_variant
  - marker: b
    text: Pengulangan “anak perempuan” dapat berarti bahwa Mehetabel adalah cucu perempuan Mezahab dalam pemakaian silsilah, tetapi terjemahan ini mempertahankan susunan kata Ibraninya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת בַּעַל חָנָן
  choice: Baal-Hanan mati
  rationale: Bentuk naratif וַיָּמָת menyatakan kematian dalam urutan pergantian raja; nama diri ditransliterasikan secara wajar dalam bahasa Indonesia.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: lalu Hadad menjadi raja menggantikan dia
  rationale: מלך dalam daftar kerajaan ini menunjuk pada naiknya seseorang menjadi raja, sedangkan תַּחְתָּיו menyatakan bahwa ia menggantikan pendahulunya.
- source_word: וְשֵׁם עִירוֹ פָּעִי
  choice: Kotanya bernama Pai
  rationale: Klausa penamaan tanpa verba dialihkan ke ungkapan Indonesia yang alami; bentuk nama dalam Tawarikh adalah Pai, bukan bentuk Pau dalam bagian paralel di Kejadian.
- source_word: וְשֵׁם אִשְׁתּוֹ מְהֵיטַבְאֵל
  choice: dan istrinya bernama Mehetabel
  rationale: Ungkapan ini mempertahankan rumus penamaan Ibrani dengan susunan yang alami dalam bahasa Indonesia.
- source_word: בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: anak perempuan Matred, anak perempuan Mezahab
  rationale: Pengulangan בַּת dipertahankan agar hubungan silsilah tidak diselesaikan secara interpretatif; dalam pemakaian silsilah, frasa itu dapat membuat Mehetabel disebut cucu perempuan Mezahab.
- source_word: מֵי זָהָב
  choice: Mezahab
  rationale: Dalam konteks silsilah, bentuk ini diperlakukan sebagai nama diri dan ditransliterasikan, bukan diterjemahkan secara harfiah.
