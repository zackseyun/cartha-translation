  text: Arpachshad fathered Shelah[b][a], and Shelah fathered Eber.
translation:
  language: id
  text: Arpakhsad[a] menjadi ayah dari Selah[b], dan Selah menjadi ayah dari Eber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini secara tradisional juga ditulis “Arfaksad” dalam sejumlah terjemahan, mengikuti bentuk yang dipengaruhi bahasa Yunani.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: Selah; dalam sejumlah terjemahan dan bagian silsilah terkait, nama ini juga ditulis “Salah”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְפַּכְשַׁד
  choice: Arpakhsad
  rationale: Nama ini ditransliterasikan langsung dari bentuk Ibrani dengan ejaan yang wajar dalam bahasa Indonesia. Bentuk “Arfaksad” mencerminkan tradisi yang dipengaruhi bentuk Yunani.
- source_word: יָלַד
  choice: menjadi ayah
  rationale: Dalam silsilah ini, verba tersebut menyatakan hubungan keturunan dari pihak laki-laki. Ungkapan “menjadi ayah” jelas, alami, dan lebih mudah dipahami pembaca modern daripada “memperanakkan” atau bentuk arkais lainnya.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai objek langsung dalam bahasa Ibrani dan fungsinya sudah terwakili oleh susunan kalimat bahasa Indonesia.
- source_word: שָׁלַח / שֶׁלַח
  choice: Selah
  rationale: Kedua bentuk vokalisasi dalam ayat ini menunjuk kepada orang yang sama. “Selah” mengikuti bentuk Ibrani, sedangkan “Salah” merupakan bentuk tradisional yang dikenal dari beberapa terjemahan dan bagian silsilah terkait.
- source_word: עֵבֶר
  choice: Eber
  rationale: Transliterasi ini paling langsung mewakili bentuk Ibrani עֵבֶר dan merupakan bentuk nama yang lazim dalam bahasa Indonesia.
