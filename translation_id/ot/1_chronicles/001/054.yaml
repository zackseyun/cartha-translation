  yaml_path: translation/ot/1_chronicles/001/054.yaml
  text: Chief Magdiel[a], chief Iram. These were the chiefs of Edom.
translation:
  language: id
  text: Pemimpin Magdiel, pemimpin Iram. Inilah para pemimpin Edom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para kepala kaum Edom.” Istilah Ibrani ini dapat menunjuk pada kepala suku atau kaum.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: pemimpin
  rationale: Dalam daftar politik dan silsilah Edom, istilah ini menunjuk pada pemimpin kelompok suku atau kaum. “Pemimpin” alami dan mudah dipahami dalam bahasa Indonesia modern, sekaligus tidak mempersempit maknanya menjadi jabatan tertentu.
- source_word: מַגְדִּיאֵל
  choice: Magdiel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, bukan diterjemahkan berdasarkan kemungkinan arti etimologisnya.
- source_word: עִירָם
  choice: Iram
  rationale: Nama diri ditransliterasikan sebagai “Iram”, sesuai dengan bentuk Ibrani dan kelaziman penulisan nama Alkitab dalam bahasa Indonesia.
- source_word: אֵלֶּה
  choice: Mereka inilah
  rationale: Klausa Ibrani tidak memiliki kopula. “Mereka inilah” menghasilkan rangkuman yang alami dalam bahasa Indonesia dan mempertahankan penekanan demonstratif pada orang-orang yang baru disebutkan.
- source_word: אַלּוּפֵי אֱדוֹם
  choice: para pemimpin Edom
  rationale: Frasa konstruksi ini merangkum nama-nama sebelumnya sebagai para pemimpin Edom. Pilihan ini ringkas dan konsisten dengan terjemahan אַלּוּף sebelumnya.
