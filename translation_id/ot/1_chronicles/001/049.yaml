  text: וַ/יָּ֖מָת שָׁא֑וּל וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו בַּ֥עַל חָנָ֖ן בֶּן עַכְבּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/049.yaml
  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: id
  text: Lalu Saul meninggal, dan Baal-Hanan anak Akhbor menjadi raja menggantikan dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: meninggal
  rationale: Bentuk naratif Qal dari מות menyatakan kematian secara langsung; “meninggal” merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Menggunakan bentuk nama yang sudah mapan dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia, sambil tetap mewakili nama Ibrani שָׁאוּל.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam rumusan pergantian raja, verba מלך dapat menyatakan naiknya seseorang menjadi raja; pilihan ini alami dalam bahasa Indonesia dan cocok dengan תַּחְתָּיו.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Preposisi תַּחַת dengan sufiks orang ketiga menyatakan penggantian atau suksesi; “menggantikan dia” menyampaikan fungsi itu secara jelas.
- source_word: בַּעַל חָנָן
  choice: Baal-Hanan
  rationale: Transliterasi nama diri dengan tanda hubung mempertahankan unsur-unsur nama majemuk Ibrani dan sesuai dengan bentuk yang mudah dibaca dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam silsilah ini בֶּן menunjukkan hubungan langsung ayah-anak; bahasa Indonesia lazim memakai “anak” sebelum nama ayah.
- source_word: עַכְבּוֹר
  choice: Akhbor
  rationale: Transliterasi “Akhbor” mempertahankan bunyi konsonan ח sebagai kh dan cukup alami bagi pembaca Indonesia.
