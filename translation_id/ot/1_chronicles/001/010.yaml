id: 1CH.1.10
reference: 1 Chronicles 1:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כ֖וּשׁ יָלַ֣ד אֶת נִמְר֑וֹד ה֣וּא הֵחֵ֔ל לִ/הְי֥וֹת גִּבּ֖וֹר בָּ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/010.yaml
  text: And Cush fathered Nimrod[a]; he began to be a mighty one in the land.
translation:
  language: id
  text: Kush memperanakkan Nimrod; ia mulai menjadi orang yang perkasa di negeri itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: di bumi. Kata Ibrani אֶרֶץ dapat berarti “negeri” atau “bumi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכּוּשׁ
  choice: Kush
  rationale: Konjungsi וְ menghubungkan catatan silsilah ini dengan konteks sebelumnya dan tidak perlu dinyatakan secara tersendiri dalam bahasa Indonesia; כּוּשׁ dialihaksarakan sebagai nama diri "Kush".
- source_word: יָלַד
  choice: memperanakkan
  rationale: Dalam konteks silsilah, ילד menyatakan hubungan ayah dengan keturunannya. "Memperanakkan" ringkas, lazim dalam silsilah Alkitab, dan tetap dekat dengan bentuk Ibrani.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara tersendiri]'
  rationale: אֶת merupakan penanda objek langsung tertentu dan tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia.
- source_word: נִמְרֹד
  choice: Nimrod
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: הוּא
  choice: ia
  rationale: Pronomina mandiri ini melanjutkan sekaligus memberi sedikit penegasan pada Nimrod. "Ia" mempertahankan rujukannya tanpa menambahkan kesan eksklusif yang dapat timbul dari "dialah".
- source_word: הֵחֵל
  choice: mulai
  rationale: Bentuk Hifil dari חלל bersama infinitif lazim berarti "mulai". Pilihan ini mempertahankan konstruksi verbal tanpa mengubahnya menjadi klaim bahwa Nimrod adalah orang pertama.
- source_word: לִהְיוֹת
  choice: menjadi
  rationale: Infinitif היה dapat berarti "ada/menjadi"; sesudah "mulai", "menjadi" merupakan ungkapan Indonesia yang alami dan menyampaikan nuansa ingresif konteks ini.
- source_word: גִּבּוֹר
  choice: orang yang perkasa
  rationale: גִּבּוֹר dapat menunjuk orang perkasa, pahlawan, atau pejuang. Konteks ini belum secara eksplisit menyebut kegiatan militer, sehingga "orang yang perkasa" mempertahankan cakupan maknanya tanpa mempersempitnya menjadi "pejuang".
- source_word: בָּאָרֶץ
  choice: di negeri itu
  rationale: אֶרֶץ dapat berarti "negeri/tanah" maupun "bumi". "Di negeri itu" menyajikan pembacaan lokal yang wajar dan alami dalam bahasa Indonesia; kemungkinan cakupan universal dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Cakupan בָּאָרֶץ dalam gambaran tentang keperkasaan Nimrod
  choice: di negeri itu
  alternative: di bumi
  rationale: Ayat ini tidak menentukan secara tegas apakah אֶרֶץ menunjuk suatu negeri atau seluruh bumi. Teks utama memakai pengertian yang lebih terbatas, sedangkan kemungkinan universal dicatat agar ambiguitas sumber tidak dihapus.
- issue: Apakah הֵחֵל menyatakan bahwa Nimrod adalah orang pertama
  choice: ia mulai menjadi
  alternative: dialah yang pertama menjadi
  rationale: Makna dasar konstruksi הֵחֵל לִהְיוֹת adalah "mulai menjadi". Terjemahan "yang pertama" mungkin merupakan penafsiran kontekstual, tetapi tidak dinyatakan secara pasti oleh bentuk ini dan karena itu tidak dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur silsilah dibuat ringkas; istilah "orang yang perkasa" dipilih agar mudah dipahami tanpa mempersempit makna menjadi peran militer.
