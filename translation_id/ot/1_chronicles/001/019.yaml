  text: וּ/לְ/עֵ֥בֶר יֻלַּ֖ד שְׁנֵ֣י בָנִ֑ים שֵׁ֣ם הָ/אֶחָ֞ד פֶּ֗לֶג כִּ֤י בְ/יָמָי/ו֙ נִפְלְגָ֣ה הָ/אָ֔רֶץ וְ/שֵׁ֥ם אָחִ֖י/ו יָקְטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/019.yaml
  text: 'And to Eber were born two sons: the name of the one was Peleg[a], because in his days the earth was divided; and his brother’s name was Joktan.'
translation:
  language: id
  text: Bagi Eber lahir dua anak laki-laki. Yang satu bernama Peleg, karena pada zamannya bumi terbagi[a]; dan saudaranya bernama Yoktan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “negeri itu terbagi.” Kata Ibrani yang dipakai dapat berarti seluruh bumi atau suatu negeri/wilayah; teks ini tidak menjelaskan bentuk pembagian tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעֵבֶר
  choice: Bagi Eber
  rationale: Konstruksi preposisional dengan verba pasif dipertahankan secara alami dalam bahasa Indonesia; hubungan dengan alur silsilah tetap tersirat tanpa harus menerjemahkan waw secara kaku.
- source_word: יֻלַּד שְׁנֵי בָנִים
  choice: lahir dua anak laki-laki
  rationale: Bentuk pasif ילד menyatakan kelahiran, sedangkan בָנִים dalam konteks silsilah secara khusus berarti anak laki-laki.
- source_word: שֵׁם הָאֶחָד
  choice: Yang satu bernama
  rationale: Ungkapan ini membedakan salah satu dari kedua anak tanpa menafsirkannya sebagai anak pertama; susunannya alami dalam bahasa Indonesia.
- source_word: פֶּלֶג
  choice: Peleg
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: כִּי בְיָמָיו
  choice: karena pada zamannya
  rationale: כִּי berfungsi memberi alasan bagi nama Peleg; 'pada zamannya' merupakan ungkapan Indonesia yang alami untuk בְיָמָיו.
- source_word: נִפְלְגָה הָאָרֶץ
  choice: bumi terbagi
  rationale: נִפְלְגָה adalah bentuk pasif yang berarti 'terbagi', sedangkan הָאָרֶץ dapat berarti bumi atau negeri/tanah. 'Bumi' mempertahankan cakupan luas dalam teks utama, dengan alternatif leksikal dicatat dalam catatan kaki.
- source_word: וְשֵׁם אָחִיו
  choice: dan saudaranya bernama
  rationale: Terjemahan ini mempertahankan hubungan persaudaraan sekaligus memakai susunan yang ringkas dan alami.
- source_word: יָקְטָן
  choice: Yoktan
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Makna pembagian bumi pada zaman Peleg
  choice: bumi terbagi
  alternative: negeri atau tanah itu terbagi; pembagian bangsa dan bahasa sesudah Babel; pembagian geografis
  rationale: Teks Ibrani tidak menjelaskan jenis atau cakupan pembagian tersebut. Terjemahan utama dibiarkan luas dan catatan kaki menyampaikan kemungkinan leksikal tanpa menetapkan penafsiran tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur silsilah dipertahankan, tetapi susunan idiomatis Indonesia digunakan agar mudah dipahami. Nama Peleg dan Yoktan mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia.
