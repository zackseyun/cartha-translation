  yaml_path: translation/ot/1_chronicles/001/037.yaml
  text: 'The sons of Reuel: Nahath, Zerah, Shammah, and Mizzah.'
translation:
  language: id
  text: Anak-anak Rehuel ialah Nahat, Zerah, Syama, dan Miza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן yang memperkenalkan daftar silsilah; konteks ini menunjuk pada anak-anak langsung.
- source_word: רְעוּאֵל
  choice: Rehuel
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani dengan ejaan yang wajar dalam bahasa Indonesia; huruf h membantu mencerminkan unsur konsonantal di tengah nama.
- source_word: נַחַת
  choice: Nahat
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan.
- source_word: זֶרַח
  choice: Zerah
  rationale: Nama diri ditransliterasikan; makna leksikal akar katanya tidak dimasukkan ke dalam terjemahan nama.
- source_word: שַׁמָּה
  choice: Syama
  rationale: Nama diri ditransliterasikan menurut kebiasaan bunyi bahasa Indonesia; sy mewakili שׁ, sedangkan penggandaan konsonan dan h akhir tidak diperlukan dalam ejaan pembaca umum.
- source_word: וּ/מִזָּה
  choice: dan Miza
  rationale: Konjungsi וּ diterjemahkan 'dan', sedangkan nama diri מִזָּה ditransliterasikan secara alami sebagai Miza.
