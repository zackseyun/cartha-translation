  text: וַ/יּ֥וֹלֶד אַבְרָהָ֖ם אֶת יִצְחָ֑ק בְּנֵ֣י יִצְחָ֔ק עֵשָׂ֖ו וְ/יִשְׂרָאֵֽל־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/034.yaml
  text: 'Abraham fathered Isaac[a]. The sons of Isaac: Esau and Israel.'
translation:
  language: id
  text: 'Abraham menjadi ayah Ishak. Anak-anak Ishak: Esau dan Israel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani: “Israel,” yaitu Yakub.'
    reason: Menjelaskan bahwa teks sumber memakai nama Israel untuk Yakub.
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah menyatakan bahwa Abraham menjadi ayah yang menghasilkan keturunan; “memperanakkan” ringkas, wajar dalam konteks silsilah, dan mempertahankan hubungan ayah-anak.
- source_word: אֶת
  choice: tidak diterjemahkan secara terpisah
  rationale: Penanda objek langsung ini tidak mempunyai padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya tercermin dalam susunan “memperanakkan Ishak”.
- source_word: בְּנֵי
  choice: Anak-anak ... ialah
  rationale: Bentuk jamak konstruktus dari בֵּן memperkenalkan keturunan Ishak. Dalam konteks ini kedua anak yang disebut adalah laki-laki, tetapi “anak-anak Ishak” merupakan ungkapan silsilah yang alami dan jelas dalam bahasa Indonesia.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Bentuk nama yang baku dan dikenal dalam bahasa Indonesia.
- source_word: וְיִשְׂרָאֵל
  choice: dan Israel
  rationale: Teks Ibrani secara eksplisit memakai nama Israel. Terjemahan mempertahankannya dan tidak menggantinya dengan nama Yakub.
theological_decisions:
- issue: Pemakaian יִשְׂרָאֵל dalam daftar silsilah ketika yang dimaksud adalah Yakub
  choice: Israel
  alternative: Yakub
  rationale: Nama dalam teks sumber adalah “Israel”. Meskipun orang yang dimaksud ialah Yakub, mempertahankan “Israel” menghindari harmonisasi yang tidak dinyatakan oleh ayat ini dan menjaga bentuk teks Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat, dengan gaya formula silsilah. “Memperanakkan” dipilih karena tepat dan lazim dalam konteks genealogi; “ialah” membantu membuat bagian kedua terbaca alami sebagai pernyataan daftar.
