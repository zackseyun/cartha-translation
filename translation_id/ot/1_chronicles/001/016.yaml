  text: and the Arvadites[a], and the Zemarites, and the Hamathites.
translation:
  language: id
  text: dan orang Arwadi[a], orang Semari, dan orang Hamati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Ibrani, sebutan-sebutan kaum di sini berbentuk tunggal secara tata bahasa, tetapi dipakai secara kolektif untuk menunjuk kepada kelompok orang atau kaum: orang Arwadi, orang Semari, dan orang Hamati.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: dan
  rationale: Dalam daftar silsilah ini, וְ menghubungkan setiap unsur dengan rangkaian sebelumnya, sedangkan אֵת adalah penanda objek yang tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia.
- source_word: הָאַרְוָדִי
  choice: orang Arwad
  rationale: Bentuk nisbah tunggal ini berfungsi secara kolektif dan menunjuk kepada kelompok orang atau kaum yang terkait dengan Arwad. Ungkapan 'orang Arwad' alami dalam bahasa Indonesia dan tetap dekat dengan bentuk sumber.
- source_word: הַצְּמָרִי
  choice: orang Semar
  rationale: Bentuk nisbah tunggal ini dipakai secara kolektif bagi kelompok yang terkait dengan Semar. Nama צְמָר ditransliterasikan 'Semar' sesuai bunyi Ibrani dan pola nama Indonesia.
- source_word: הַחֲמָתִי
  choice: orang Hamat
  rationale: Bentuk ini menunjuk secara kolektif kepada orang-orang atau kaum yang terkait dengan Hamat; 'orang Hamat' menyampaikan makna etnis tersebut tanpa memaksakan bentuk jamak morfologis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pengulangan 'orang' mempertahankan bentuk daftar kaum, sedangkan koma dan 'dan' terakhir mengikuti tata daftar Indonesia yang alami. Kata 'dan' pada awal ayat dipertahankan karena ayat ini melanjutkan daftar dari ayat sebelumnya.
