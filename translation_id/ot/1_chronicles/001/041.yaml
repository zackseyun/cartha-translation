  yaml_path: translation/ot/1_chronicles/001/041.yaml
  text: 'The sons of Anah: Dishon. And the sons of Dishon: Hamran[a], Eshban, Ithran, and Keran.'
translation:
  language: id
  text: 'Anak-anak Ana: Disyon. Anak-anak Disyon: Hamran[a], Esyban, Yitran, dan Keran.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam silsilah sejajar di Kejadian 36:26, nama itu tertulis “Hemdan”, bukan “Hamran”. Teks utama di sini mengikuti Teks Masoretik dalam 1 Tawarikh.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Dalam daftar silsilah, bentuk jamak konstruksi dari בֵּן menunjuk kepada anak-anak laki-laki. Bahasa Indonesia lazim memakai “anak-anak” dalam rumusan silsilah; semua nama yang disebut menunjukkan bahwa yang dimaksud di sini ialah para putra.
- source_word: עֲנָה
  choice: Ana
  rationale: Nama diri ditransliterasikan ke bentuk yang wajar dalam bahasa Indonesia.
- source_word: דִּישׁוֹן
  choice: Dison
  rationale: Nama diri ditransliterasikan secara konsisten pada kedua kemunculannya, pertama sebagai anak Ana dan kemudian sebagai ayah dari nama-nama berikutnya.
- source_word: וּבְנֵי
  choice: Anak-anak
  rationale: Waw penghubung tidak perlu dinyatakan dengan “dan” pada awal kalimat kedua karena tanda baca sudah menyampaikan kelanjutan daftar secara alami dalam bahasa Indonesia.
- source_word: חַמְרָן
  choice: Hamran
  rationale: Teks Masoret 1 Tawarikh dibaca Hamran; bentuk ini dipertahankan dalam teks utama, sedangkan bacaan paralel di Kejadian dicatat dalam catatan kaki.
- source_word: אֶשְׁבָּן
  choice: Esban
  rationale: Nama diri ditransliterasikan mengikuti padanan bunyi yang alami dalam bahasa Indonesia.
- source_word: יִתְרָן
  choice: Yitran
  rationale: Konsonan awal yod dinyatakan dengan “Y”, sesuai kebiasaan transliterasi Indonesia dan bentuk Ibrani.
- source_word: כְרָן
  choice: Keran
  rationale: Nama diri ditransliterasikan langsung; waw prefiksnya dinyatakan dengan “dan” sebelum unsur terakhir dalam daftar.
