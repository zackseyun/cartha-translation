lexical_decisions:
- source_word: הֲדוֹרָם
  choice: Hadoram
  rationale: Nama diri ditransliterasikan menurut bentuk Ibrani dan ejaan yang lazim serta mudah dibaca dalam bahasa Indonesia.
- source_word: אוּזָל
  choice: Uzal
  rationale: Nama diri ditransliterasikan langsung ke dalam ejaan Latin yang wajar dalam bahasa Indonesia.
- source_word: דִּקְלָה
  choice: Dikla
  rationale: Nama diri ditransliterasikan sebagai “Dikla”; huruf he pada akhir bentuk Ibrani berfungsi sebagai penanda vokal akhir dan tidak perlu ditampilkan sebagai h dalam ejaan Indonesia.
- source_word: וְ/אֶת ... וְ/אֶת ... וְ/אֶת
  choice: daftar dengan “dan” sebelum unsur terakhir
  rationale: Pengulangan waw dan penanda objek memperkenalkan setiap nama. Dalam bahasa Indonesia, daftar sederhana mempertahankan maknanya dengan lebih alami.
