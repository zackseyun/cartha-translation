  text: בְּנֵ֖י אֱלִיפָ֑ז תֵּימָ֤ן וְ/אוֹמָר֙ צְפִ֣י וְ/גַעְתָּ֔ם קְנַ֖ז וְ/תִמְנָ֥ע וַ/עֲמָלֵֽק׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/036.yaml
  text: 'The sons of Eliphaz: Teman[a], Omar, Zephi, Gatam, Kenaz, Timna[b], and Amalek.'
translation:
  language: id
  text: Anak-anak Elifas ialah Teman, Omar, Zefi[a], Gaetam, Kenas, Timna[b], dan Amalek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani di sini berbunyi Zefi; Kejadian 36:11 memakai bentuk lain, yaitu Zefo.
    reason: textual_variant
  - marker: b
    text: Kejadian 36:12 menyebut Timna sebagai gundik Elifas dan Amalek sebagai anak yang dilahirkannya. Di sini Tawarikh mencantumkan kedua nama itu dalam daftar anak-anak Elifas.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי אֱלִיפָז
  choice: Anak-anak Elifas ialah
  rationale: Bentuk jamak konstruksi בְּנֵי memperkenalkan daftar silsilah. “Anak-anak” mempertahankan hubungan yang dinyatakan teks, sedangkan “ialah” membuat pembukaan daftar terdengar wajar dalam bahasa Indonesia.
- source_word: תֵּימָן
  choice: Teman
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אוֹמָר
  choice: Omar
  rationale: Nama diri ditransliterasikan secara langsung.
- source_word: צְפִי
  choice: Zefi
  rationale: Pilihan ini mencerminkan bentuk Ibrani צְפִי dalam Tawarikh dan membedakannya dari bentuk צְפוֹ dalam Kejadian 36:11.
- source_word: גַעְתָּם
  choice: Gaetam
  rationale: Transliterasi Indonesia yang lazim untuk nama diri ini.
- source_word: קְנַז
  choice: Kenas
  rationale: Transliterasi yang mapan dalam penggunaan Alkitab bahasa Indonesia.
- source_word: תִמְנָע
  choice: Timna
  rationale: Nama ini dipertahankan sebagai salah satu unsur dalam daftar sebagaimana tertulis dalam ayat Ibrani.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Nama diri dan nama leluhur suatu kelompok, ditransliterasikan secara langsung.
- source_word: וְ / וַ
  choice: tanda koma dengan “dan” sebelum unsur terakhir
  rationale: Konjungsi Ibrani berulang disampaikan sebagai daftar alami dalam bahasa Indonesia tanpa menghilangkan susunannya.
theological_decisions:
- issue: Hubungan silsilah Timna dan Amalek dibandingkan dengan Kejadian 36:12
  choice: Teks utama mencantumkan Timna dan Amalek di bawah judul “Anak-anak Elifas”, sesuai bentuk lugas ayat dalam Tawarikh.
  alternative: Menafsirkan Timna sebagai gundik Elifas dan Amalek sebagai anak yang dilahirkannya, selaras dengan Kejadian 36:12.
  rationale: Terjemahan mengikuti susunan sumber Ibrani Tawarikh dan tidak menyelaraskannya secara diam-diam dengan catatan paralel. Perbedaannya dijelaskan dalam catatan kaki.
translation_notes:
  register: 'Bahasa Indonesia baku, ringkas, dan bermartabat. Nama-nama mengikuti bentuk yang dikenal pembaca Alkitab Indonesia sejauh tidak mengaburkan bentuk khusus teks Ibrani Tawarikh. Penanda catatan ditempatkan pada nama yang benar: [a] pada Zefi dan [b] pada Timna.'
