  text: And Yobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: id
  text: Yobab[a] pun mati, lalu Husyam dari negeri Teman[b] menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam terjemahan tradisional, “Jobab.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dari negeri orang Teman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: pun mati
  rationale: Bentuk wayyiqtol dari מות melanjutkan urutan peristiwa. Partikel “pun” secara alami menandai kelanjutan narasi dalam bahasa Indonesia tanpa menambah makna kausal.
- source_word: יוֹבָב
  choice: Yobab
  rationale: Nama ini dialihaksarakan langsung dari bentuk Ibrani; “Yobab” lebih dekat dengan pelafalan sumber daripada bentuk tradisional “Jobab”.
- source_word: וַיִּמְלֹךְ
  choice: lalu ... memerintah
  rationale: Dalam rumus pergantian raja, מלך menyatakan bahwa seseorang naik takhta dan memerintah. “Memerintah” wajar dalam daftar kerajaan, sedangkan “lalu” menyampaikan urutan naratif.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Dalam konteks suksesi, תחת dengan sufiks pronominal menyatakan bahwa orang berikutnya mengambil kedudukan pendahulunya. Ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: חוּשָׁם
  choice: Husyam
  rationale: Alih aksara nama Ibrani חוּשָׁם dengan “sy” untuk bunyi שׁ mengikuti kebiasaan ejaan Indonesia.
- source_word: מֵאֶרֶץ
  choice: dari negeri
  rationale: מן ditambah אֶרֶץ menunjukkan asal geografis. “Dari negeri” mempertahankan unsur אֶרֶץ sekaligus terdengar alami.
- source_word: הַתֵּימָנִי
  choice: orang Teman
  rationale: Bentuk ini merupakan sebutan nisbah yang dapat menunjuk orang atau wilayah yang berkaitan dengan Teman. Dalam konstruksi “negeri orang Teman,” terjemahan ini terbaca alami sambil mempertahankan kaitan etnis atau regionalnya.
