  text: בְּנֵ֣י שֵׁ֔ם עֵילָ֣ם וְ/אַשּׁ֔וּר וְ/אַרְפַּכְשַׁ֖ד וְ/ל֣וּד וַ/אֲרָ֑ם וְ/ע֥וּץ וְ/ח֖וּל וְ/גֶ֥תֶר וָ/מֶֽשֶׁךְ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/017.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud, and Aram; Uz, Hul, Gether, and Meshech.'
translation:
  language: id
  text: 'Anak-anak Sem: Elam, Asyur, Arpakhsad, Lud, dan Aram; Us, Hul, Geter, dan Mesekh.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam silsilah sejajar, Kejadian 10:23 menyebut “Mas”, bukan “Mesekh”.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן yang memperkenalkan silsilah; padanan langsung dan wajar dalam bahasa Indonesia.
- source_word: שֵׁם
  choice: Sem
  rationale: Menggunakan bentuk nama yang sudah baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: עֵילָם
  choice: Elam
  rationale: Transliterasi baku nama diri atau nama leluhur.
- source_word: אַשּׁוּר
  choice: Asyur
  rationale: Dalam daftar silsilah ini kata tersebut berfungsi sebagai nama diri; bentuk Asyur mempertahankan nama itu tanpa menggantinya dengan nama wilayah atau bangsa.
- source_word: אַרְפַּכְשַׁד
  choice: Arpakhsad
  rationale: Transliterasi yang mengikuti bentuk Ibrani dan tetap mudah dibaca dalam bahasa Indonesia.
- source_word: לוּד
  choice: Lud
  rationale: Teks memakai nama tunggal Lud, bukan bentuk jamak etnonim Ludim.
- source_word: אֲרָם
  choice: Aram
  rationale: Konteks silsilah mendukung pemakaian nama leluhur Aram, bukan nama wilayah yang muncul kemudian.
- source_word: עוּץ
  choice: Us
  rationale: Bentuk nama yang lazim dan mudah dibaca dalam bahasa Indonesia untuk עוּץ.
- source_word: חוּל
  choice: Hul
  rationale: Transliterasi langsung nama diri Ibrani.
- source_word: גֶתֶר
  choice: Geter
  rationale: Transliterasi alami dalam ejaan bahasa Indonesia.
- source_word: מֶשֶׁךְ
  choice: Mesekh
  rationale: Menerjemahkan langsung bacaan Teks Masoret pada ayat ini; perbedaan dengan daftar sejajar dalam Kejadian 10:23 dicatat dalam catatan kaki.
theological_decisions:
- issue: Hubungan Us, Hul, Geter, dan Mesekh dengan nama-nama sebelumnya
  choice: Mempertahankan semuanya sebagai bagian dari daftar yang diperkenalkan oleh frasa “Anak-anak Sem”, dengan tanda titik koma sesudah Aram.
  alternative: Menambahkan “anak-anak Aram” sebelum Us, seperti hubungan yang dinyatakan dalam Kejadian 10:23.
  rationale: Teks Ibrani 1 Tawarikh 1:17 tidak memuat frasa “anak-anak Aram”. Tanda titik koma mengikuti pembagian internal daftar tanpa memasukkan kata-kata yang tidak terdapat dalam sumber.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Nama-nama ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia. Titik koma mempertahankan pembagian daftar sesudah Aram sebagaimana ditandai oleh aksentuasi Masoret tanpa menjelaskan hubungan yang tidak dinyatakan secara eksplisit.
