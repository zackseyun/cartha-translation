base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/033.yaml
  text: 'The sons of Midian: Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.'
translation:
  language: id
  text: Anak-anak Midian ialah Efa, Efer, Henokh, Abida, dan Eldaa. Mereka semua adalah anak-anak Ketura.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: Anak-anak Midian ialah
  rationale: Bentuk konstruksi jamak בְּנֵי berarti “anak-anak dari.” Kata penghubung awal tidak perlu diterjemahkan tersendiri dalam gaya daftar silsilah Indonesia; “ialah” melengkapi kalimat nominal secara wajar.
- source_word: עֵיפָה
  choice: Efa
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: וָעֵפֶר
  choice: Efer
  rationale: Nama diri ditransliterasikan; prefiks penghubung diwujudkan melalui tanda koma dalam daftar bahasa Indonesia.
- source_word: וַחֲנוֹךְ
  choice: Henokh
  rationale: Nama diri ditransliterasikan dengan bentuk Indonesia yang sudah dikenal dan tetap dekat dengan bunyi Ibrani חֲנוֹךְ.
- source_word: וַאֲבִידָע
  choice: Abida
  rationale: Transliterasi nama diri yang alami dalam bahasa Indonesia.
- source_word: וְאֶלְדָּעָה
  choice: dan Eldaa
  rationale: Konjungsi Ibrani pada unsur terakhir dinyatakan dengan “dan,” sesuai kaidah daftar bahasa Indonesia.
- source_word: כָּל אֵלֶּה
  choice: Mereka semua
  rationale: Ungkapan ini merangkum semua orang yang baru disebut. Pronomina “mereka” lebih alami daripada terjemahan harfiah “semua ini” untuk manusia.
- source_word: בְּנֵי קְטוּרָה
  choice: adalah anak-anak Ketura
  rationale: Frasa konstruksi menyatakan bahwa semua nama tersebut adalah keturunan langsung Ketura; kopula ditambahkan agar kalimat Indonesia lengkap dan jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat, dengan susunan yang sesuai bagi daftar silsilah. Bentuk nama mengikuti transliterasi Indonesia yang mudah dikenali. Catatan kaki pada lapisan konsultasi Inggris tidak dibawa karena isinya khusus membahas tradisi ejaan Inggris dan penandanya tampak tidak selaras dengan nama yang dibahas.
