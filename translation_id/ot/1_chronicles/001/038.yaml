source:
  edition: WLC
  text: וּ/בְנֵ֣י שֵׂעִ֔יר לוֹטָ֥ן וְ/שׁוֹבָ֖ל וְ/צִבְע֣וֹן וַֽ/עֲנָ֑ה וְ/דִישֹׁ֥ן וְ/אֵ֖צֶר וְ/דִישָֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/038.yaml
  text: 'And the sons of Seir: Lotan[a], Shobal, Zibeon, Anah, Dishon, Ezer, and Dishan.'
translation:
  language: id
  text: Dan anak-anak[a] Seir ialah Lotan, Syobal, Zibeon, Ana, Disyon, Ezer, dan Disyan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks silsilah, kata Ibrani yang diterjemahkan “anak-anak” dapat berarti anak kandung atau, secara lebih luas, keturunan maupun anggota kaum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Dan anak-anak
  rationale: Bentuk jamak konstruksi בְּנֵי memperkenalkan daftar silsilah, sedangkan awalan וּ menyambungkan ayat ini dengan daftar sebelumnya. Ungkapan formal “anak-anak” dipertahankan, tanpa membatasi maknanya hanya pada keturunan langsung.
- source_word: שֵׂעִיר
  choice: Seir
  rationale: Nama diri dalam konteks silsilah; ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: לוֹטָן
  choice: Lotan
  rationale: Nama diri; ditransliterasikan sebagai Lotan.
- source_word: שׁוֹבָל
  choice: Syobal
  rationale: Nama diri; huruf שׁ diwakili dengan “sy” sesuai kebiasaan transliterasi nama Alkitab dalam bahasa Indonesia.
- source_word: צִבְעוֹן
  choice: Zibeon
  rationale: Nama diri; bentuk Zibeon dipilih karena jelas dan lazim dikenal dalam bahasa Indonesia.
- source_word: עֲנָה
  choice: Ana
  rationale: Nama diri; ditransliterasikan secara wajar untuk pembaca Indonesia tanpa mempertahankan huruf h akhir yang tidak mewakili konsonan dalam bentuk Ibrani ini.
- source_word: דִישֹׁן
  choice: Disyon
  rationale: Nama diri; ditransliterasikan sebagai Disyon dan dibedakan dari nama דִישָׁן yang muncul kemudian.
- source_word: אֵצֶר
  choice: Ezer
  rationale: Nama diri; bentuk Ezer mempertahankan pengenalan nama sekaligus mengikuti ejaan Indonesia yang sederhana.
- source_word: דִישָׁן
  choice: Disyan
  rationale: Nama diri; bentuk Disyan mencerminkan perbedaan vokal dalam teks Ibrani dan membedakannya dari Disyon.
theological_decisions:
- issue: Cakupan istilah silsilah בְּנֵי
  choice: “anak-anak” dipertahankan dalam teks, dengan keluasan maknanya dijelaskan dalam catatan kaki
  alternative: “keturunan” atau “anggota kaum”
  rationale: Bahasa Ibrani silsilah dapat menunjuk kepada anak kandung maupun keturunan atau anggota kelompok yang lebih luas. Terjemahan formal mempertahankan bentuk sumber tanpa secara diam-diam menentukan hubungan yang lebih sempit atau lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Kata “ialah” membantu memperkenalkan deretan nama secara alami, sementara “Dan” mempertahankan kesinambungan daftar silsilah. Ejaan nama membedakan Disyon dari Disyan sebagaimana teks Ibrani membedakan kedua nama tersebut.
