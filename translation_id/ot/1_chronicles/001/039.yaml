base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/039.yaml
  text: 'The sons of Lotan: Hori and Homam[a]; and Lotan’s sister was Timna.'
translation:
  language: id
  text: 'Putra-putra Lotan: Hori dan Homam[a]. Saudara perempuan Lotan ialah Timna.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam silsilah sejajar di Kejadian 36:22, nama ini tertulis Hemam, bukan Homam.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruksi בְּנֵי secara harfiah menunjuk kepada anak-anak laki-laki. Dalam daftar silsilah bahasa Indonesia, “anak-anak” merupakan ungkapan yang alami dan jelas; jenis kelamin mereka tampak dari nama-nama yang disebutkan.
- source_word: לוֹטָן
  choice: Lotan
  rationale: Nama diri ditransliterasikan sebagai “Lotan” sesuai bentuk Ibrani.
- source_word: חֹרִי
  choice: Hori
  rationale: Dalam konteks silsilah, bentuk ini adalah nama pribadi dan ditransliterasikan “Hori”, bukan diterjemahkan sebagai nama kelompok etnis.
- source_word: וְהוֹמָם
  choice: dan Homam
  rationale: Bentuk nama dalam teks Tawarikh ialah הוֹמָם, sehingga diterjemahkan “Homam”; bentuk berbeda dalam Kejadian 36:22 dicatat dalam catatan kaki.
- source_word: וַאֲחוֹת לוֹטָן
  choice: saudara perempuan Lotan ialah
  rationale: אֲחוֹת berarti “saudara perempuan”. Kopula yang tidak dinyatakan dalam klausa nominal Ibrani diungkapkan dengan “ialah” agar kalimat Indonesia jelas dan tetap bermartabat.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Nama diri ditransliterasikan “Timna”, mencerminkan bentuk konsonantal yang terdapat dalam ayat ini.
