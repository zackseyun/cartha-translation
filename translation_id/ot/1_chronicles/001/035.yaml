base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/035.yaml
  text: 'The sons of Esau: Eliphaz[a], Reuel, Jeush, Jalam, and Korah.'
translation:
  language: id
  text: Anak-anak Esau ialah Elifas, Rehuel, Yeush, Yaelam, dan Korah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruksi dari בֵּן yang memperkenalkan daftar silsilah; dalam konteks ini menunjuk secara langsung kepada anak-anak laki-laki Esau. Bahasa Indonesia lazim memakai 'anak-anak' tanpa harus menambahkan 'laki-laki' karena semua nama dalam daftar menjelaskannya.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Nama pribadi mengikuti bentuk yang sudah baku dan dikenal luas dalam bahasa Indonesia.
- source_word: אֱלִיפַז
  choice: Elifas
  rationale: Transliterasi nama Ibrani yang sudah lazim dalam Alkitab bahasa Indonesia.
- source_word: רְעוּאֵל
  choice: Rehuel
  rationale: Bentuk ini dekat dengan bunyi nama Ibrani dan lazim dalam tradisi Alkitab bahasa Indonesia; huruf h membantu menunjukkan pemisahan unsur vokal dalam nama tersebut.
- source_word: וִיעוּשׁ
  choice: Yeush
  rationale: Transliterasi langsung nama Ibrani יְעוּשׁ dengan Y untuk yod, sesuai pola transliterasi modern bahasa Indonesia.
- source_word: וְיַעְלָם
  choice: Yaelam
  rationale: Transliterasi yang mempertahankan unsur konsonan dan urutan vokal nama Ibrani יַעְלָם secara cukup transparan bagi pembaca Indonesia.
- source_word: וְקֹרַח
  choice: dan Korah
  rationale: Nama terakhir disertai konjungsi; 'Korah' merupakan bentuk yang sudah baku dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa silsilah dibuat ringkas, alami, dan bermartabat. Kopula 'ialah' dipakai untuk memperkenalkan daftar nama dengan jelas. Nama-nama mengikuti bentuk Indonesia yang lazim bila tersedia dan transliterasi yang dekat dengan bahasa Ibrani untuk nama lainnya.
