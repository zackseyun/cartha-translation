  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר חָלִילָ/ה֩ לִּ֨/י מֵ/אֱלֹהַ֜/י מֵ/עֲשׂ֣וֹת זֹ֗את הֲ/דַ֣ם הָ/אֲנָשִׁים֩ הָ/אֵ֨לֶּה אֶשְׁתֶּ֤ה בְ/נַפְשׁוֹתָ/ם֙ כִּ֣י בְ/נַפְשׁוֹתָ֣/ם הֱבִיא֔וּ/ם וְ/לֹ֥א אָבָ֖ה לִ/שְׁתּוֹתָ֑/ם אֵ֣לֶּה עָשׂ֔וּ שְׁלֹ֖שֶׁת הַ/גִּבּוֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/019.yaml
  text: And he said[a], “Far be it from me, by my God, to do this! Shall I drink the blood of these men at the cost of their lives? For they brought it at the cost of their lives.” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: id
  text: Lalu berkatalah ia, “Demi Allahku, pantang aku melakukan hal ini! Masakan aku meminum darah[b] orang-orang ini dengan mempertaruhkan nyawa mereka?[a] Sebab mereka membawanya dengan mempertaruhkan nyawa mereka.” Maka ia tidak mau meminumnya. Itulah yang dilakukan oleh ketiga pahlawan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, frasa Ibrani yang diulang dalam ayat ini berbunyi “dengan nyawa mereka”; maksudnya, mereka membawa air itu dengan mempertaruhkan nyawa.
    reason: lexical_alternative
  - marker: b
    text: Daud menyebut air itu “darah” karena orang-orang tersebut mendapatkannya dengan menghadapi bahaya maut.
    reason: cultural_note
lexical_decisions:
- source_word: חָלִילָה לִּי מֵאֱלֹהַי
  choice: Kiranya Allahku menjauhkan aku
  rationale: Ungkapan ini menyatakan penolakan yang sangat kuat dengan seruan kepada Allah. Bentuk ini alami dalam bahasa Indonesia, mempertahankan hubungan dengan Allah, dan tidak memaksakan apakah מֵאֱלֹהַי terutama bernuansa sumpah atau 'di hadapan Allahku'.
- source_word: מֵעֲשׂוֹת זֹאת
  choice: dari melakukan hal ini
  rationale: Prefiks מ pada infinitif menyatakan penjauhan atau pencegahan; 'dari melakukan hal ini' menyatu secara alami dengan ungkapan penolakan sebelumnya.
- source_word: הֲדַם הָאֲנָשִׁים הָאֵלֶּה אֶשְׁתֶּה
  choice: Masakan aku meminum darah orang-orang ini
  rationale: Partikel tanya membuka pertanyaan retoris. 'Darah' dipertahankan secara harfiah agar gambaran tajam dalam bahasa Ibrani tidak dihilangkan.
- source_word: בְנַפְשׁוֹתָם
  choice: dengan mempertaruhkan nyawa mereka
  rationale: נֶפֶשׁ di sini berarti kehidupan atau nyawa, sedangkan ב menandai keadaan yang menyertai tindakan. Pilihan ini menyampaikan bahwa mereka menghadapi bahaya maut tanpa menyiratkan bahwa nyawa mereka benar-benar telah hilang.
- source_word: כִּי בְנַפְשׁוֹתָם הֱבִיאוּם
  choice: Sebab mereka membawanya dengan mempertaruhkan nyawa mereka
  rationale: Pengulangan frasa tentang nyawa dipertahankan untuk mengikuti penekanan teks Ibrani; akhiran objek dipahami merujuk pada air tersebut dan diterjemahkan 'membawanya'.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: Maka ia tidak mau meminumnya
  rationale: אָבָה menyatakan kemauan atau persetujuan. 'Tidak mau' tepat dan alami, tanpa memperkuatnya secara berlebihan menjadi tindakan penolakan formal.
- source_word: אֵלֶּה עָשׂוּ שְׁלֹשֶׁת הַגִּבּוֹרִים
  choice: Itulah yang dilakukan oleh ketiga pahlawan itu
  rationale: Kalimat ini merangkum tindakan mereka. Dalam konteks pasukan elite Daud, 'pahlawan' menyampaikan daya militer dan kepahlawanan גִּבּוֹרִים secara alami.
theological_decisions:
- issue: Makna 'darah' dalam perkataan Daud
  choice: Mempertahankan kata 'darah' secara harfiah sambil membiarkan konteks menunjukkan bahwa air itu dipandang seolah-olah darah karena diperoleh dengan bahaya maut.
  alternative: Menggantikannya dengan parafrasa seperti 'air yang diperoleh dengan mempertaruhkan nyawa mereka'.
  rationale: Teks Ibrani secara eksplisit memakai 'darah'. Mempertahankannya menjaga daya etis dan teologis perkataan Daud tanpa menghapus metafora evaluatifnya.
- issue: Makna נֶפֶשׁ
  choice: Menerjemahkannya sebagai 'nyawa'.
  alternative: jiwa
  rationale: Konteks berbicara tentang kehidupan jasmani yang terancam, bukan tentang unsur tak berwujud dalam diri manusia; 'nyawa' menghindari klaim antropologis yang tidak dibuat oleh teks.
- issue: Apakah nyawa para pahlawan benar-benar menjadi harga yang dibayar
  choice: Menerjemahkan frasa sebagai tindakan 'mempertaruhkan nyawa', bukan kehilangan nyawa secara nyata.
  alternative: dengan mengorbankan nyawa mereka
  rationale: Ketiga orang itu kembali hidup-hidup. Frasa Ibrani mengandung bahaya maut, tetapi konteks tidak menyatakan bahwa mereka tewas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. Pronomina 'ia' dipakai sesuai register Alkitabiah modern; 'masakan' mempertahankan kekuatan pertanyaan retoris. Semua penanda catatan kaki ditempatkan pada bagian teks yang dijelaskannya.
