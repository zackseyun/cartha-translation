source:
  edition: WLC
  text: וַ/יִּֽתְיַצְּב֤וּ בְ/תוֹךְ הַ/חֶלְקָה֙ וַ/יַּצִּיל֔וּ/הָ וַ/יַּכּ֖וּ אֶת פְּלִשְׁתִּ֑ים וַ/יּ֥וֹשַׁע יְהוָ֖ה תְּשׁוּעָ֥ה גְדוֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/014.yaml
  text: And they took their stand in the middle of the plot and delivered it[a], and they struck down the Philistines, and Yahweh saved by a great victory.
translation:
  language: id
  text: Mereka bertahan di tengah petak tanah itu dan mempertahankannya. Mereka memukul orang-orang Filistin, dan Yahweh memberikan kemenangan besar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Yahweh mendatangkan pembebasan besar.”'
    reason: תְּשׁוּעָה dapat berarti kemenangan, keselamatan, atau pembebasan. Dalam konteks pertempuran, “kemenangan besar” merupakan pilihan utama yang alami, sedangkan alternatif yang lebih umum dipertahankan.
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: mengambil posisi
  rationale: Bentuk hitpael dari יצב menyatakan tindakan menempatkan diri atau bertahan pada suatu posisi; frasa ini alami dalam konteks pertempuran.
- source_word: בְתוֹךְ הַחֶלְקָה
  choice: di tengah-tengah petak ladang itu
  rationale: תוך berarti 'di tengah', sedangkan חלקה menunjuk pada sebidang atau petak tanah; 'petak ladang' memperjelas latar pertanian tanpa menggeneralisasikannya menjadi seluruh medan.
- source_word: וַיַּצִּילוּהָ
  choice: menyelamatkannya
  rationale: נצל berarti melepaskan atau menyelamatkan dari bahaya maupun penguasaan musuh. Akhiran feminin tunggal merujuk kepada petak ladang tersebut.
- source_word: וַיַּכּוּ אֶת־פְּלִשְׁתִּים
  choice: menewaskan orang-orang Filistin
  rationale: Dalam konteks pertempuran, נכה lazim berarti menghantam hingga jatuh atau mati; 'menewaskan' mempertahankan daya ungkapnya.
- source_word: וַיּוֹשַׁע יְהוָה תְּשׁוּעָה גְדוֹלָה
  choice: Yahweh memberikan kemenangan besar
  rationale: Konstruksi verba ישׁע dengan nomina serumpun תשועה merupakan ungkapan penegasan. Dalam konteks militer, 'memberikan kemenangan besar' menyampaikan hasil penyelamatan secara alami tanpa menambahkan objek yang tidak tersurat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi Tetragramaton ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung; transliterasi mempertahankan fungsi nama tersebut.
- issue: Makna keselamatan dalam frasa תְּשׁוּעָה גְדוֹלָה
  choice: kemenangan besar
  alternative: pembebasan besar
  rationale: Konteks langsungnya adalah pertempuran melawan orang Filistin, sehingga 'kemenangan' merupakan makna kontekstual yang kuat, sedangkan kemungkinan arti 'pembebasan' dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Rangkaian waw konsekutif dipecah menjadi dua kalimat agar alami dalam bahasa Indonesia, sementara urutan tindakan dan penekanan bahwa kemenangan berasal dari Yahweh tetap dipertahankan.
