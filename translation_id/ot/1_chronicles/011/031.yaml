  source_fidelity: 'Teks dengan tepat mencerminkan שני nama tokoh dan keterangan asalnya: Itai sebagai anak Ribai, berasal dari Gibea yang terkait dengan bani/keturunan Benyamin, serta Benaya sebagai orang Piraton. Pengulangan "dari" mengikuti dua unsur preposisional dalam susunan Ibrani dan tidak mengubah hubungan sintaktisnya.'
