  text: אִיתַ֣י בֶּן רִיבַ֗י מִ/גִּבְעַת֙ בְּנֵ֣י בִנְיָמִ֔ן בְּנָיָ֖ה הַ/פִּרְעָתֹנִֽי־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/031.yaml
  text: Ittai son of Ribai[a], from Gibeah of the sons of Benjamin; Benaiah the Pirathonite;
translation:
  language: id
  text: Itai anak Ribai, dari Gibea, dari keturunan Benyamin[a]; Benaya, orang Piraton;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Benyamin,” yaitu anggota suku Benyamin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִיתַי
  choice: Itai
  rationale: Nama diri ditransliterasikan dalam bentuk yang wajar dan lazim dalam bahasa Indonesia.
- source_word: בֶּן רִיבַי
  choice: anak Ribai
  rationale: Dalam konteks daftar nama ini, bentuk konstruksi Ibrani menyatakan hubungan keturunan langsung; 'anak Ribai' merupakan padanan Indonesia yang alami.
- source_word: מִגִּבְעַת
  choice: dari Gibea
  rationale: Preposisi מִן menunjukkan asal atau keterkaitan, sedangkan גִּבְעַת berfungsi sebagai nama tempat.
- source_word: בְּנֵי בִנְיָמִן
  choice: dari keturunan Benyamin
  rationale: Secara harfiah berarti 'anak-anak Benyamin', tetapi dalam konteks kesukuan menunjuk kepada anggota suku atau keturunan Benyamin.
- source_word: בְּנָיָה
  choice: Benaya
  rationale: Nama diri ditransliterasikan sesuai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַפִּרְעָתֹנִי
  choice: orang Piraton
  rationale: Bentuk nisbah dengan kata sandang menunjukkan orang yang berasal dari atau terkait dengan Piraton; ungkapan 'orang Piraton' jelas dan alami dalam bahasa Indonesia.
