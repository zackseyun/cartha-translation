id: 1CH.11.5
reference: 1 Chronicles 11:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ יֹשְׁבֵ֤י יְבוּס֙ לְ/דָוִ֔יד לֹ֥א תָב֖וֹא הֵ֑נָּה וַ/יִּלְכֹּ֤ד דָּוִיד֙ אֶת מְצֻדַ֣ת צִיּ֔וֹן הִ֖יא עִ֥יר דָּוִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/005.yaml
  text: The inhabitants of Jebus said to David[a], “You will not come in here.” But David captured the stronghold of Zion, that is, the City of David.
translation:
  language: id
  text: Penduduk Yebus berkata kepada Daud, “Engkau tidak akan masuk ke sini.”[a] Namun, Daud merebut benteng Sion, yaitu Kota Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Engkau tidak boleh datang ke sini” atau “Engkau tidak akan datang ke sini.” Secara harfiah, teks Ibrani berbunyi “Engkau tidak akan datang ke sini,” yang dalam konteks ini berfungsi sebagai penolakan untuk masuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי יְבוּס
  choice: Penduduk Yebus
  rationale: Frasa konstruksi ini secara harfiah menunjuk kepada orang-orang yang tinggal di Yebus. “Penduduk Yebus” alami dalam bahasa Indonesia modern dan mempertahankan makna kolektifnya.
- source_word: לֹא תָבוֹא הֵנָּה
  choice: Engkau tidak akan masuk ke sini
  rationale: Secara harfiah berarti “engkau tidak akan datang ke sini”, tetapi dalam konteks tantangan terhadap Daud ungkapan itu berfungsi sebagai penolakan untuk masuk. “Masuk ke sini” menyampaikan maksud spasial tersebut dengan wajar tanpa menghilangkan bentuk pernyataannya.
- source_word: וַיִּלְכֹּד
  choice: merebut
  rationale: Dalam konteks militer, לכד berarti menangkap, menguasai, atau merebut suatu tempat. “Merebut” paling alami untuk pengambilalihan tempat pertahanan melalui aksi militer.
- source_word: מְצֻדַת צִיּוֹן
  choice: benteng Sion
  rationale: מְצוּדָה menunjuk pada benteng atau kubu pertahanan. “Benteng” merupakan istilah Indonesia yang jelas, umum, dan sesuai dengan konteks militer.
- source_word: הִיא עִיר דָּוִיד
  choice: yaitu Kota Daud
  rationale: Klausa nominal ini mengidentifikasi benteng Sion sebagai Kota Daud. “Yaitu” menyampaikan fungsi penjelas atau identifikasinya secara alami.
- source_word: עִיר דָּוִיד
  choice: Kota Daud
  rationale: Dalam konteks ini frasa tersebut merupakan sebutan khusus bagi suatu tempat, sehingga huruf kapital tepat digunakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kata ganti “engkau” mempertahankan sapaan tunggal langsung dalam konteks historis; “namun” menandai kontras dengan jelas.
