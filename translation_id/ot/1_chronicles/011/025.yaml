  text: Among the Thirty[a], he was indeed honored, but he did not attain to the Three[b]; and David appointed him over his bodyguard.
translation:
  language: id
  text: Di antara Ketiga Puluh Orang itu, ia memang dihormati, tetapi ia tidak mencapai kedudukan Tiga Orang itu.[a] Daud mengangkatnya sebagai pemimpin pasukan pengawal Daud.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “tidak datang kepada Tiga Orang itu”; maksudnya, ia tidak mencapai peringkat mereka.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “atas pengawalnya” atau “atas orang-orang yang berada di bawah perintahnya.” Istilah Ibrani ini dapat menunjuk kepada kesatuan penjaga atau kelompok yang berada di bawah komando Daud.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשִׁים
  choice: Di antara Ketiga Puluh Orang itu
  rationale: מִן di depan sebutan kelompok dipahami secara partitif dalam konteks perbandingan jenjang para kesatria. Ungkapan ini menyatakan kedudukannya di kalangan kelompok yang dikenal sebagai Ketiga Puluh Orang tanpa menambahkan gagasan yang tidak eksplisit.
- source_word: הִנּוֹ נִכְבָּד הוּא
  choice: ia memang dihormati
  rationale: הִנּוֹ memberi penegasan, sedangkan bentuk Niphal נִכְבָּד menyatakan bahwa ia dipandang terhormat atau terpandang. 'Memang dihormati' mempertahankan penekanan itu secara wajar dalam bahasa Indonesia.
- source_word: וְאֶל הַשְּׁלוֹשָׁה לֹא בָא
  choice: tetapi ia tidak mencapai kedudukan Tiga Orang itu
  rationale: Secara harfiah frasa ini berbunyi 'tidak datang kepada Tiga Orang itu', tetapi בוא dengan אֶל di sini digunakan secara idiomatis untuk mencapai taraf atau peringkat. Penambahan 'kedudukan' memperjelas maksud tanpa menyamakan dia dengan kelompok elite tersebut.
- source_word: וַיְשִׂימֵהוּ דָוִיד
  choice: Daud mengangkatnya menjadi kepala
  rationale: Dalam konteks penugasan militer, שׂים berarti menetapkan atau mengangkat seseorang atas suatu kelompok. 'Mengangkatnya menjadi kepala' menyampaikan fungsi jabatan yang ditunjukkan oleh konstruksi berikutnya dengan עַל.
- source_word: עַל מִשְׁמַעְתּוֹ
  choice: menjadi kepala pasukan pengawalnya
  rationale: מִשְׁמַעַת dapat menunjuk kepada orang-orang yang berada di bawah perintah, suatu kesatuan penjaga, atau tanggung jawab komando. Dalam organisasi militer Daud, 'pasukan pengawalnya' merupakan padanan alami, sementara ketidakpastian cakupannya dicatat dalam catatan kaki.
