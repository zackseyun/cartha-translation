translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sebutan kelompok militer khusus, 'Ketiga Puluh Orang' dan 'Tiga Orang', ditulis dengan huruf kapital agar terbaca sebagai gelar kelompok. Struktur dua kalimat dipakai untuk kejernihan, tanpa mengubah hubungan isi antarklausa.
