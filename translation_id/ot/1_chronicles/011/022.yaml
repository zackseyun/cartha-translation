  naturalness: Revisi mempertahankan bahasa Indonesia modern dan wajar, sambil membuat rangkaian keterangan tentang Benaya lebih lancar. “Seorang pria perkasa yang banyak melakukan perbuatan” cukup dekat dengan bentuk apposisi Ibrani tanpa tambahan makna ketenaran.
  terminology: Nama Benaya, Yoyada, dan Kabzeel konsisten. “Dua pahlawan Moab” adalah pilihan teks utama yang dapat diterima asalkan ambiguitas אֲרִיאֵל dipertahankan dalam catatan kaki. Catatan kaki perlu menandai bahwa ketidakpastian mencakup keseluruhan frasa yang relevan dan menyajikan alternatif tanpa memilihnya secara dogmatis.
