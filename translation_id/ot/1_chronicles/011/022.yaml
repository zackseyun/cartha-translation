source:
  edition: WLC
  text: בְּנָיָ֨ה בֶן יְהוֹיָדָ֧ע בֶּן אִֽישׁ חַ֛יִל רַב פְּעָלִ֖ים מִֽן קַבְצְאֵ֑ל ה֣וּא הִכָּ֗ה אֵ֣ת שְׁנֵ֤י אֲרִיאֵל֙ מוֹאָ֔ב וְ֠/הוּא יָרַ֞ד וְ/הִכָּ֧ה אֶֽת הָ/אֲרִ֛י בְּ/ת֥וֹךְ הַ/בּ֖וֹר בְּ/י֥וֹם הַ/שָּֽׁלֶג־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/022.yaml
  text: Benaiah son of Jehoiada[a], son of a mighty man, a man of many deeds, from Kabzeel—he struck down the two heroes of Moab. He also went down and struck down the lion in the midst of a pit on a snowy day.
translation:
  language: id
  text: Benaya anak Yoyada, anak seorang pria perkasa yang banyak melakukan perbuatan, dari Kabzeel, menewaskan dua pahlawan Moab[a]. Ia juga turun ke dalam sebuah lubang dan menewaskan seekor singa di sana pada hari bersalju.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani אֲרִיאֵל מוֹאָב tidak pasti. Ungkapan ini mungkin berarti “dua anak Ariel dari Moab”, “dua orang Ariel dari Moab”, atau “dua pahlawan Moab yang seperti singa”.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ חַיִל
  choice: seorang yang gagah perkasa
  rationale: Dalam konteks daftar kesatria, frasa ini menunjuk pada keberanian, kekuatan, atau kecakapan yang telah terbukti. Ungkapan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi status sosial tertentu.
- source_word: רַב פְּעָלִים
  choice: terkenal karena banyak perbuatan besar
  rationale: Secara harfiah berarti ‘banyak perbuatan/tindakan’. Terjemahan ini menyampaikan bahwa orang tersebut dikenal karena berbagai tindakan atau kepahlawanannya, tanpa merinci hal yang tidak dinyatakan teks.
- source_word: מִן קַבְצְאֵל
  choice: dari Kabzeel
  rationale: Preposisi מִן paling langsung menyatakan tempat asal.
- source_word: הִכָּה
  choice: menewaskan
  rationale: Kata נכה pada dasarnya berarti memukul atau merobohkan. Dalam konteks prestasi seorang kesatria dan serangan terhadap singa, akibat mematikan sangat mungkin dimaksudkan; ‘menewaskan’ menyampaikan konteks itu secara wajar dalam bahasa Indonesia.
- source_word: שְׁנֵי אֲרִיאֵל מוֹאָב
  choice: dua pahlawan Moab
  rationale: אֲרִיאֵל sulit dipastikan artinya dalam frasa ini dan mungkin merupakan sebutan bagi tokoh perkasa yang bercitra singa. ‘Dua pahlawan Moab’ menghasilkan teks utama yang jelas, sedangkan kemungkinan pembacaan lainnya dipertahankan dalam catatan kaki.
- source_word: יָרַד
  choice: turun ke dalam
  rationale: Kata kerja ini berarti ‘turun’; konteksnya menunjukkan gerakan turun memasuki lubang.
- source_word: הָאֲרִי
  choice: seekor singa
  rationale: Nomina ini dengan jelas merujuk kepada singa. Bahasa Indonesia lazim memakai penggolong ‘seekor’ ketika hewan itu pertama kali disebut.
- source_word: בְּתוֹךְ הַבּוֹר
  choice: di dalam sebuah lubang ... di sana
  rationale: Frasa ini menyatakan lokasi di bagian dalam lubang. Susunan Indonesia membagi keterangan gerak dan lokasi agar kalimat alami tanpa mengubah gambaran sumber.
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: pada hari bersalju
  rationale: Secara harfiah, ‘pada hari salju’. Pilihan ini ringkas, idiomatis, dan mempertahankan keadaan pada hari kejadian.
theological_decisions:
- issue: Identitas אֲרִיאֵל dalam frasa שְׁנֵי אֲרִיאֵל מוֹאָב
  choice: Teks utama memakai ‘dua pahlawan Moab’ dan menandai ketidakpastian lewat catatan kaki.
  alternative: ‘dua anak Ariel dari Moab’, ‘dua Ariel dari Moab’, atau ‘dua pahlawan Moab yang seperti singa’
  rationale: Bentuk Ibraninya sungguh tidak pasti. Memilih satu identifikasi genealogis secara mutlak akan menghilangkan ambiguitas sumber; karena itu, alternatif utama dicatat secara terbuka tanpa membangun kesimpulan teologis darinya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama diri ditransliterasikan dalam bentuk yang lazim bagi pembaca Indonesia. Pengulangan ‘Benaya’ pada kalimat kedua memperjelas subjek setelah rangkaian keterangan silsilah. Catatan kaki ditempatkan tepat sesudah frasa yang dipersoalkan.
