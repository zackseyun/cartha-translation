  yaml_path: translation/ot/1_chronicles/011/016.yaml
  text: David was in the stronghold[b][a], and the garrison of the Philistines was then in Bethlehem.
translation:
  language: id
  text: Pada waktu itu Daud berada di kubu pertahanan[a], dan garnisun Filistin pada waktu itu berada di Betlehem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “benteng”.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani mengulang ungkapan “pada waktu itu” dalam kedua klausa untuk memberi penekanan.
    reason: source_structure
lexical_decisions:
- source_word: מְּצוּדָה
  choice: kubu pertahanan
  rationale: Istilah ini menunjuk pada tempat berkubu atau tempat perlindungan yang dapat dipertahankan. “Kubu pertahanan” alami dalam konteks militer dan mempertahankan makna konkretnya.
- source_word: נְצִיב
  choice: pasukan ... ditempatkan
  rationale: Dalam konteks pendudukan Filistin di sebuah kota, kata ini paling mungkin menunjuk pada garnisun atau pos militer. Ungkapan verbal ini lebih mudah dipahami pembaca umum daripada istilah teknis “garnisun”, sambil tetap mempertahankan pengertian militernya.
- source_word: פְּלִשְׁתִּים
  choice: Filistin
  rationale: Bentuk baku bahasa Indonesia untuk nama bangsa tersebut; dalam susunan “pasukan Filistin” kata ini berfungsi sebagai penanda bangsa.
- source_word: בְּבֵית לָחֶם
  choice: di Betlehem
  rationale: Preposisi ב menandai lokasi, dan “di Betlehem” merupakan bentuk alami untuk lokasi di sebuah kota.
- source_word: אָז ... אָז
  choice: pada waktu itu ... pada waktu itu
  rationale: Pengulangan temporal dalam bahasa Ibrani dipertahankan untuk mencerminkan struktur dan penekanan ayat sumber.
- source_word: וְדָוִיד
  choice: Daud
  rationale: Waw pembuka menghubungkan ayat ini dengan narasi sebelumnya, tetapi tidak perlu diterjemahkan secara mekanis dengan “dan” dalam bahasa Indonesia; hubungan naratif tetap jelas.
