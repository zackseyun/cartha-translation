translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan temporal sumber dipertahankan, sedangkan istilah militer נְצִיב diungkapkan secara komunikatif sebagai pasukan yang ditempatkan di kota.
