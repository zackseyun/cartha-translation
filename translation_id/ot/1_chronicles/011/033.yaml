  text: Azmawet, orang Baharum[a], Elyahba, orang Syaalbon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “orang Baharum”; mungkin berkaitan dengan Bahurim, sehingga dapat diterjemahkan “orang Bahurim.”'
