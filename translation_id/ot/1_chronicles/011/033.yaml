lexical_decisions:
- source_word: עַזְמָוֶת
  choice: Azmawet
  rationale: Nama diri ditransliterasikan menurut kebiasaan ejaan bahasa Indonesia; huruf Ibrani ו dalam unsur akhir dicerminkan dengan w.
- source_word: הַבַּחֲרוּמִי
  choice: orang Baharum
  rationale: Bentuk nisbah berartikel ini menunjukkan asal tempat atau kelompok. 'Orang Baharum' mempertahankan bentuk vokal Teks Masoret sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: אֶלְיַחְבָּא
  choice: Elyahba
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani dan unsur yod dipertahankan sebagai y dalam ejaan Indonesia.
- source_word: הַשַּׁעַלְבֹנִי
  choice: orang Syaalbon
  rationale: Bentuk nisbah berartikel menyatakan hubungan dengan Syaalbon; konstruksi 'orang Syaalbon' lebih alami daripada membentuk adjektiva nisbah asing dalam bahasa Indonesia.
