  register: Bahasa Indonesia baku, ringkas, dan wajar untuk daftar nama. Nama-nama diri dipertahankan melalui transliterasi, sedangkan sebutan gentilika dibuat mudah dipahami. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang diterangkannya.
