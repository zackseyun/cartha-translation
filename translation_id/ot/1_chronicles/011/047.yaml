translation:
  language: id
  text: Eliel, Obed, dan Yaasiel, orang Mezoba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, sebutan ini menunjukkan asal tempat atau kelompok, mungkin berarti bahwa Yaasiel berasal dari Mezoba atau dari tempat maupun kaum dengan nama serupa. Nama yang mendasarinya tidak pasti; bentuk transliterasi lain juga mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיאֵל
  choice: Eliel
  rationale: Nama diri ditransliterasikan sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְ/עוֹבֵד
  choice: Obed
  rationale: Nama diri ditransliterasikan; konjungsi Ibrani ditata secara alami dalam daftar bahasa Indonesia.
- source_word: וְ/יַעֲשִׂיאֵל
  choice: dan Yaasiel
  rationale: Nama diri ditransliterasikan dekat dengan bentuk Ibrani; prefiks konjungsi diterjemahkan sebagai 'dan' pada unsur terakhir daftar.
- source_word: הַ/מְּצֹבָיָה
  choice: orang Mezoba
  rationale: Bentuk ini merupakan sebutan asal tempat atau kelompok. Ungkapan 'orang Mezoba' menyampaikan fungsi gentilika secara alami tanpa memastikan secara berlebihan nama tempat atau kaum yang mendasarinya.
theological_decisions: []
