  yaml_path: translation/ot/1_chronicles/011/021.yaml
  text: He was more honored than the two among the three[a], and he became their commander; but he did not attain to the three.
translation:
  language: id
  text: Ia lebih dihormati daripada dua orang di antara ketiga orang itu[a] dan menjadi pemimpin mereka. Namun, ia tidak mencapai kedudukan ketiga orang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "Ia lebih dihormati daripada ketiga orang itu dalam hubungannya dengan dua orang." Ungkapan Ibrani ini sangat padat dan sulit; susunan tepat hubungan antara "tiga" dan "dua" tidak pasti. Maksud umumnya ialah bahwa ia sangat dihormati dalam kelompok yang bertingkat, tetapi tidak mencapai kedudukan ketiga orang itu.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשָׁה בַשְּׁנַיִם
  choice: Di antara ketiga orang itu, ia lebih dihormati daripada dua orang lainnya
  rationale: 'Ungkapan Ibraninya padat, eliptis, dan sulit. Terjemahan ini menyampaikan perbandingan yang paling wajar dalam konteks: ia memiliki kehormatan lebih tinggi daripada dua anggota lain dalam kelompok yang disebutkan, tanpa menyembunyikan ketidakpastian teks; alternatifnya dicatat dalam catatan kaki.'
- source_word: נִכְבָּד
  choice: lebih dihormati
  rationale: Bentuk Nifal dari כבד di sini menunjuk pada keadaan dihormati atau dipandang tinggi. Kata 'lebih' mengungkapkan fungsi komparatif konstruksi tersebut.
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: dan menjadi pemimpin mereka
  rationale: שַׂר berarti pemimpin, kepala, atau panglima. 'Pemimpin' terdengar alami dan cukup luas, sambil tetap sesuai dengan konteks kemiliteran.
- source_word: וְעַד הַשְּׁלוֹשָׁה לֹא בָא
  choice: Namun, ia tidak menyamai Tiga Pahlawan itu
  rationale: בוא dengan עַד secara idiomatis menyatakan mencapai tingkat atau kedudukan. 'Tidak menyamai' menjelaskan bahwa yang dimaksud bukan gerakan fisik, melainkan bahwa ia tidak mencapai kedudukan kelompok utama tersebut. Kapitalisasi 'Tiga Pahlawan' menandai sebutan kelompok dalam konteks.
