revisions:
- from: Di antara ketiga orang itu, ia lebih dihormati daripada dua orang lainnya[a] dan menjadi pemimpin mereka. Namun, ia tidak menyamai Tiga Pahlawan itu.
  to: Ia lebih dihormati daripada dua orang di antara ketiga orang itu[a] dan menjadi pemimpin mereka. Namun, ia tidak mencapai kedudukan ketiga orang itu.
  rationale: Revisi menghapus implikasi yang tidak pasti dalam "lainnya," mengganti label tambahan "Tiga Pahlawan" dengan rujukan yang mengikuti teks sumber, dan menyusun ulang catatan kaki agar ambiguitas sintaksis Ibrani dijelaskan dengan jujur dan jelas. Makna peringkat dalam klausa terakhir dipertahankan.
