  text: וְ/אֵ֛לֶּה מִסְפַּ֥ר הַ/גִּבֹּרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑יד יָשָׁבְעָ֣ם בֶּן חַכְמוֹנִ֗י רֹ֚אשׁ ה/שלושים הֽוּא עוֹרֵ֧ר אֶת חֲנִית֛/וֹ עַל שְׁלֹשׁ מֵא֥וֹת חָלָ֖ל בְּ/פַ֥עַם אֶחָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/011.yaml
  text: 'And these are the number of David’s mighty men: Jashobeam son of Hachmoni[a], the chief of the Thirty; he wielded his spear against three hundred slain in one encounter.'
translation:
  language: id
  text: 'Inilah daftar para pejuang perkasa Daud: Yasobam anak Hakhmoni, kepala Tiga Puluh; ia mengacungkan tombaknya terhadap tiga ratus orang yang tewas pada satu kesempatan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengangkat/mengayunkan tombaknya terhadap tiga ratus orang yang tewas pada satu kali.” Ungkapan Ibraninya padat. Kata kerja itu secara harfiah dapat berarti “membangkitkan” atau “menggerakkan,” dan dalam konteks ini menggambarkan penggunaan tombak dalam pertempuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: daftar
  rationale: Makna dasarnya ialah “jumlah” atau “hitungan”, tetapi di sini kata itu memperkenalkan nama-nama kesatria. “Daftar” menyampaikan fungsi ungkapan tersebut secara wajar dalam bahasa Indonesia.
- source_word: הַגִּבֹּרִים
  choice: para kesatria
  rationale: Kata ini menunjuk kepada orang-orang yang gagah atau perkasa, khususnya pejuang yang menonjol. “Para kesatria” sesuai dengan konteks pasukan elite Daud dan tetap bernada luhur.
- source_word: אֲשֶׁר לְדָוִיד
  choice: Daud
  rationale: Preposisi לְ menyatakan hubungan atau kepunyaan. Susunan “para kesatria Daud” merupakan bentuk Indonesia yang ringkas dan alami.
- source_word: יָשָׁבְעָם בֶּן חַכְמוֹנִי
  choice: Yasobam anak Hakhmoni
  rationale: Nama-nama ditransliterasikan ke dalam ejaan Indonesia, sedangkan hubungan ayah-anak yang dinyatakan secara eksplisit dipertahankan.
- source_word: רֹאשׁ הַשלושים
  choice: pemimpin Kelompok Tiga Puluh
  rationale: רֹאשׁ berarti “kepala” dan dalam konteks jabatan berarti “pemimpin”. “Kelompok Tiga Puluh” diperlakukan sebagai sebutan bagi kelompok kesatria elite tersebut.
- source_word: עוֹרֵר אֶת חֲנִיתוֹ
  choice: mengacungkan tombaknya
  rationale: Secara dasar, verba עורר berarti membangkitkan atau menggerakkan. Dalam ungkapan militer dengan tombak, “mengacungkan tombaknya” memberikan gambaran tindakan siap menyerang tanpa menerjemahkannya secara kaku.
- source_word: עַל שְׁלֹשׁ מֵאוֹת
  choice: melawan tiga ratus orang
  rationale: Dalam konteks penggunaan senjata, עַל menunjukkan tindakan bermusuhan yang diarahkan kepada lawan.
- source_word: חָלָל
  choice: orang yang tewas
  rationale: Kata ini menunjuk kepada orang yang tertikam atau terbunuh. “Orang yang tewas” wajar dalam bahasa Indonesia dan mempertahankan hasil mematikan dari pertempuran itu.
- source_word: בְּפַעַם אֶחָת
  choice: dalam satu pertempuran
  rationale: Secara harfiah berarti “dalam satu kali/kejadian”. Konteks militer mendukung “dalam satu pertempuran”, tanpa menyiratkan bahwa semuanya tewas oleh satu ayunan senjata.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “kesatria” mempertahankan nuansa pasukan elite, sedangkan “Kelompok Tiga Puluh” dibuat sebagai gelar kelompok. Susunan kalimat tetap dekat dengan bentuk Ibrani tanpa menjadi kaku.
