review_pass:
  verdict: revise
  source_fidelity: Teks Ibrani menyebutkan para gibborim Daud dan menyatakan Yasobam sebagai ראש השלושים, lalu secara padat menghubungkan tindakan tombaknya dengan tiga ratus orang yang tewas pada satu kesempatan. Draf pada dasarnya menangkap unsur-unsur ini, tetapi «Kelompok» dan kapitalisasi frasa itu menambahkan pengelompokan yang tidak dinyatakan secara eksplisit, sedangkan «dalam satu pertempuran» lebih sempit daripada «pada satu kali/satu kesempatan».
  naturalness: Bahasa draf umumnya baku dan mudah dipahami. Namun, «melawan tiga ratus orang yang tewas» dapat terdengar seolah-olah tombak diarahkan kepada orang yang sudah mati. Susunan yang direvisi mempertahankan kepadatan teks sumber sambil mengurangi ketidaklaziman itu.
  terminology: «Para kesatria» dapat dipakai, tetapi «para pejuang perkasa» lebih langsung mencerminkan גִּבֹּרִים tanpa konotasi kesatriaan feodal. «Kepala Tiga Puluh» menerjemahkan gelar itu tanpa menambahkan kata «Kelompok». Nama Yasobam dan Hakhmoni dipertahankan.
  issues:
  - severity: medium
    issue: «Kelompok Tiga Puluh» menambahkan unsur «kelompok» dan memperlakukan sebutan itu sebagai nama resmi.
    rationale: הַשְּׁלֹשִׁים secara harfiah adalah «Tiga Puluh»; konteks memang menyiratkan suatu korps, tetapi teks tidak memakai kata «kelompok». «Kepala Tiga Puluh» lebih dekat dan tetap alami.
  - severity: medium
    issue: «Dalam satu pertempuran» menyempitkan בְּפַעַם אֶחָת.
    rationale: Ungkapan itu secara harfiah menunjuk satu kali atau satu kesempatan. Konteksnya militer, tetapi sumber tidak secara leksikal menyebut satu pertempuran.
  - severity: low
    issue: «Para kesatria» membawa nuansa kesatriaan yang lebih khusus daripada גִּבֹּרִים.
    rationale: Istilah Ibrani terutama menunjuk para pejuang yang gagah/perkasa. «Para pejuang perkasa» menyampaikan makna itu secara lebih netral dalam bahasa Indonesia modern.
