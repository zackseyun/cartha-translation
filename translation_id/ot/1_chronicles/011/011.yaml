revisions:
- from: 'Inilah daftar para kesatria Daud: Yasobam anak Hakhmoni, pemimpin Kelompok Tiga Puluh. Ia mengacungkan tombaknya[a] melawan tiga ratus orang yang tewas dalam satu pertempuran.'
  to: 'Inilah daftar para pejuang perkasa Daud: Yasobam anak Hakhmoni, kepala Tiga Puluh; ia mengacungkan tombaknya terhadap tiga ratus orang yang tewas pada satu kesempatan.[a]'
  rationale: Revisi ini mempertahankan fungsi kontekstual מִסְפָּר sebagai pengantar daftar, menerjemahkan גִּבֹּרִים secara lebih netral, dan menghindari penambahan «Kelompok». «Pada satu kesempatan» menjaga keluasan בְּפַעַם אֶחָת. Catatan kaki tetap menandai ketidakpastian idiom tindakan tombak tanpa mengklaim penafsiran yang lebih spesifik daripada teks Ibrani.
