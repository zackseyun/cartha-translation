lexical_decisions:
- source_word: עִירָא
  choice: Ira
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בֶן
  choice: anak
  rationale: Dalam daftar nama, 'anak' secara alami menyatakan hubungan keturunan tanpa memerlukan kata sandang.
- source_word: עִקֵּשׁ
  choice: Ikesh
  rationale: Nama diri ditransliterasikan secara wajar ke dalam ejaan bahasa Indonesia; konsonan rangkap Ibrani tidak perlu dipertahankan karena tidak membedakan makna dalam bahasa Indonesia.
- source_word: הַתְּקוֹעִי
  choice: orang Tekoa
  rationale: Bentuk gentilik berartikel menunjukkan seseorang yang berasal dari atau terkait dengan Tekoa; 'orang Tekoa' mempertahankan bentuk penamaan kelompok secara alami.
- source_word: אֲבִיעֶזֶר
  choice: Abiezer
  rationale: Nama diri ditransliterasikan sesuai bentuk Indonesia yang telah dikenal.
- source_word: הָעֲנְּתוֹתִי
  choice: orang Anatot
  rationale: Bentuk gentilik berartikel menunjukkan seseorang yang berasal dari atau terkait dengan Anatot; 'orang Anatot' adalah padanan Indonesia yang ringkas dan alami.
