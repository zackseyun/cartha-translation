  text: Hezro the Carmelite[a], Naarai son of Ezbai[b];
translation:
  language: id
  text: Hezro, orang Karmel[a], dan Naarai anak Ezbai[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bentuk Ibrani ini adalah sebutan bagi orang yang berasal dari atau terkait dengan Karmel.
    reason: lexical_alternative
  - marker: b
    text: 'Dalam daftar sejajar di 2 Samuel 23:35, nama-nama yang bersesuaian berbeda: “Hezrai, orang Karmel, dan Paarai, orang Arba.” Kitab Tawarikh mempertahankan bentuk yang berbeda di sini.'
    reason: cross_reference
lexical_decisions:
- source_word: חֶצְרוֹ
  choice: Hezro
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani dalam Tawarikh; bentuk berbeda terdapat dalam daftar sejajar.
- source_word: הַכַּרְמְלִי
  choice: orang Karmel
  rationale: Bentuk nisbah dengan kata sandang menunjukkan orang yang berasal dari atau terkait dengan Karmel. Ungkapan ini alami dalam bahasa Indonesia dan tidak menimbulkan kesan sebagai nama suatu ordo keagamaan.
- source_word: נַעֲרַי
  choice: Naarai
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani sambil mempertahankan urutan vokalnya.
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar nama, kata ini paling wajar menyatakan hubungan ayah-anak; bahasa Indonesia lazim memakai 'anak' tanpa kata depan.
- source_word: אֶזְבָּי
  choice: Ezbai
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani.
