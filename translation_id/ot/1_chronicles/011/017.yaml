base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/017.yaml
  text: And David longed and said[b][a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: id
  text: Daud sangat ingin minum, lalu berkata, “Siapa yang akan memberiku air minum dari sumur Betlehem yang berada di dekat gerbang?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ויתאו
  choice: sangat ingin minum
  rationale: Bentuk hitpael dari אוה menyatakan keinginan yang kuat. Dalam konteks ini, objek keinginan dijelaskan oleh perkataan Daud, sehingga frasa ini alami dalam bahasa Indonesia tanpa mengurangi intensitasnya.
- source_word: מי
  choice: Siapa yang akan
  rationale: Mempertahankan bentuk pertanyaan langsung dalam bahasa Ibrani, yang dalam konteks ini sekaligus mengungkapkan suatu harapan.
- source_word: ישקני מים
  choice: memberiku air minum
  rationale: Hifil dari שקה berarti memberi minum; pilihan ini alami dalam bahasa Indonesia dan tetap menyatakan air sebagai sesuatu yang diminum.
- source_word: מבּור
  choice: dari sumur
  rationale: בור dapat berarti lubang, perigi, atau tempat penampungan air. Dalam konteks sumber air minum yang dikenal di Betlehem, 'sumur' paling jelas dan wajar.
- source_word: בית לחם
  choice: Betlehem
  rationale: Mengikuti bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: אשר בשער
  choice: yang berada di dekat gerbang
  rationale: Menunjukkan letak sumur sehubungan dengan gerbang kota secara alami dan jelas dalam bahasa Indonesia.
