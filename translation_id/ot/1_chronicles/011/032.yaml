base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/032.yaml
  text: Hurai from the wadis of Gaash[b][a], Abiel the Arbathite.
translation:
  language: id
  text: Hurai dari wadi-wadi Gaas[a], Abiel, orang Arbat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lembah-lembah Gaas” atau “alur-alur sungai Gaas”. Kata Ibrani yang dipakai dapat berarti wadi, jurang, dasar aliran deras, atau lembah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang Arbati”, yaitu orang yang berasal dari atau berkaitan dengan Arbat; tempat ini mungkin berhubungan dengan Araba.
    reason: cultural_note
lexical_decisions:
- source_word: חוּרַי
  choice: Hurai
  rationale: Nama diri ditransliterasikan sesuai bentuk Ibrani dan kebiasaan ejaan nama Alkitab dalam bahasa Indonesia.
- source_word: מִנַּחֲלֵי
  choice: dari wadi-wadi
  rationale: Bentuk jamak נַחֲלֵי dapat menunjuk pada lembah, alur sungai musiman, atau dasar aliran deras. 'Wadi-wadi' mempertahankan ciri geografis daerah kering tanpa membatasi maknanya pada sungai yang terus mengalir.
- source_word: גָעַשׁ
  choice: Gaas
  rationale: Nama tempat ditransliterasikan; huruf ע tidak diberi padanan tersendiri agar bentuknya alami dalam ejaan Indonesia.
- source_word: אֲבִיאֵל
  choice: Abiel
  rationale: Nama diri ditransliterasikan.
- source_word: הָעַרְבָתִי
  choice: orang Arbat
  rationale: Kata nisbah ini menyatakan asal atau keterkaitan geografis. Ungkapan Indonesia 'orang Arbat' lebih alami daripada membentuk adjektiva serapan dan tidak memastikan secara berlebihan lokasi yang dimaksud.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan sesuai dengan bentuk daftar nama. Istilah geografis 'wadi' dipertahankan karena dikenal dalam bahasa Indonesia dan paling dekat dengan rentang makna konteks daerah kering. Penanda catatan kaki ditempatkan langsung setelah unsur yang diterangkan.
