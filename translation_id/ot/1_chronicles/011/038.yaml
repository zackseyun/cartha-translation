lexical_decisions:
- source_word: יוֹאֵל
  choice: Yoel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֲחִי
  choice: saudara
  rationale: Bentuk konstruksi dari אָח, paling wajar dipahami sebagai hubungan saudara dalam daftar nama ini; bahasa Ibrani tidak mengharuskan penambahan kata sandang.
- source_word: נָתָן
  choice: Natan
  rationale: Nama diri ditransliterasikan menurut konvensi bahasa Indonesia.
- source_word: מִבְחָר
  choice: Mibhar
  rationale: Dipahami sebagai nama diri dan ditransliterasikan, bukan diterjemahkan.
- source_word: בֶּן
  choice: anak
  rationale: Penanda hubungan keturunan yang umum; dalam konteks daftar ini paling alami diterjemahkan 'anak' tanpa memperluasnya menjadi 'keturunan'.
- source_word: הַגְרִי
  choice: Hagri
  rationale: Dalam teks utama diperlakukan sebagai nama diri sesudah 'anak'; kemungkinan sebagai sebutan etnis dipertahankan dalam catatan kaki.
