  text: אֲחִיאָ֧ם בֶּן שָׂכָ֛ר הַ/הֲרָרִ֖י אֱלִיפַ֥ל בֶּן אֽוּר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/035.yaml
  text: Ahiam son of Sachar the Hararite[a], Eliphal son of Ur.
translation:
  language: id
  text: Ahiam anak Sakhar, orang Harar; Elifal anak Ur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחִיאָם
  choice: Ahiam
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia; bentuk ini mempertahankan pengenalan nama Ibrani.
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar para kesatria ini, kata tersebut paling wajar menunjuk pada hubungan ayah-anak langsung. Arti yang lebih luas, yaitu keturunan, dimungkinkan secara leksikal tetapi kurang mungkin dalam konteks ini.
- source_word: שָׂכָר
  choice: Sakhar
  rationale: Nama diri ditransliterasikan dengan kh untuk mencerminkan konsonan akhir Ibrani dan membedakannya dari bunyi k biasa.
- source_word: הֲרָרִי
  choice: orang Harar
  rationale: Bentuk nisbah ini menunjukkan asal geografis atau kelompok. 'Orang Harar' terdengar alami dalam bahasa Indonesia tanpa mengartikan unsur dasarnya secara spekulatif sebagai 'orang pegunungan'.
- source_word: אֱלִיפַל
  choice: Elifal
  rationale: Nama diri ditransliterasikan secara langsung dan alami dalam ejaan Indonesia.
- source_word: אֽוּר
  choice: Ur
  rationale: Nama diri dipertahankan sebagai Ur; dalam konteks ini nama tersebut menunjuk kepada seseorang, bukan kota Ur.
