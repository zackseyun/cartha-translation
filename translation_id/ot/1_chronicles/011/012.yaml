base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/012.yaml
  text: After him was Eleazar son of Dodo the Ahohite[a]; he was among the three mighty men.
translation:
  language: id
  text: Sesudahnya adalah Eleazar, anak Dodo, orang Ahohi. Ia termasuk di antara ketiga pahlawan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia adalah salah seorang dari ketiga pahlawan itu.” Ungkapan Ibrani dapat menyatakan bahwa ia termasuk dalam kelompok elite yang terdiri atas tiga orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Sesudah dia
  rationale: Frasa ini menunjukkan urutan dalam daftar para pejuang Daud. Kata penghubung וְ tidak perlu diterjemahkan tersendiri agar bahasa Indonesia tetap alami.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן דּוֹדוֹ
  choice: anak Dodo
  rationale: בֶּן paling wajar menunjuk pada hubungan ayah-anak langsung dalam daftar ini; bentuk nama pada teks ini mendukung transliterasi Dodo.
- source_word: הָאֲחוֹחִי
  choice: orang Ahohi
  rationale: Sebutan marga atau kelompok ini dipertahankan melalui transliterasi dan dinyatakan dengan bentuk Indonesia yang alami.
- source_word: בִּשְׁלוֹשָׁה הַגִּבֹּרִים
  choice: termasuk dalam kelompok tiga pahlawan itu
  rationale: Preposisi בְּ dengan bilangan menyatakan keanggotaan dalam kelompok tiga orang yang sudah dikenal. 'Pahlawan' mempertahankan nuansa gelar bagi para pejuang utama Daud.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Struktur kalimat pertama mempertahankan urutan daftar dalam teks Ibrani, sedangkan kalimat kedua mengungkapkan konstruksi predikatif Ibrani secara jelas tanpa menentukan peringkat Eleazar di antara ketiga pahlawan.
