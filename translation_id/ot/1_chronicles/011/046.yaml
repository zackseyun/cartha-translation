  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֱלִיאֵל֙ הַֽ/מַּחֲוִ֔ים וִ/ירִיבַ֥י וְ/יוֹשַׁוְיָ֖ה בְּנֵ֣י אֶלְנָ֑עַם וְ/יִתְמָ֖ה הַ/מּוֹאָבִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/046.yaml
  text: Eliel the Mahavite[a], and Jeribai and Joshaviah, the sons of Elnaam[b], and Ithmah the Moabite.
translation:
  language: id
  text: Eliel, orang Mahawi[a], Yeribai dan Yosyawya, anak-anak Elnaam, serta Yitma, orang Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk Ibrani Mahawi tampaknya merupakan sebutan tempat asal atau kelompok, tetapi identitas tepatnya tidak diketahui.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלִיאֵל
  choice: Eliel
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani.
- source_word: הַמַּחֲוִים
  choice: orang Mahawi[a]
  rationale: Sebutan asal atau kelompok ini tidak dapat diidentifikasi secara pasti. Bentuk transliterasi mempertahankan bunyi Ibrani tanpa mengklaim lokasi tertentu; 'orang' membuat fungsinya sebagai sebutan asal atau kelompok jelas dan alami dalam bahasa Indonesia.
- source_word: וִירִיבַי
  choice: Yeribai
  rationale: Nama diri ditransliterasikan menurut pelafalan Ibrani Masoret.
- source_word: וְיוֹשַׁוְיָה
  choice: Yosawya
  rationale: Transliterasi yang wajar bagi pembaca Indonesia, dengan 'sy' untuk bunyi שׁ dan 'y' untuk unsur konsonantal yod.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Bentuk jamak konstruksi ini menerangkan bahwa Yeribai dan Yosawya adalah anak-anak Elnaam.
- source_word: אֶלְנָעַם
  choice: Elnaam
  rationale: Nama diri ditransliterasikan, dengan vokal rangkap dipertahankan agar unsur nama Ibrani tetap terbaca.
- source_word: וְיִתְמָה
  choice: serta Yitma
  rationale: Nama diri ditransliterasikan menurut bentuk Ibrani; 'serta' menandai unsur terakhir dalam daftar secara alami.
- source_word: הַמּוֹאָבִי
  choice: orang Moab
  rationale: Sebutan kebangsaan dengan artikel berfungsi sebagai identitas Yitma. 'Orang Moab' adalah ungkapan Indonesia yang alami dan setia pada maknanya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Tanda koma mempertahankan susunan daftar, sedangkan pengulangan 'orang' memperjelas dua sebutan asal. Nama-nama ditransliterasikan dari teks Ibrani, bukan disalin dari bentuk Inggris.
