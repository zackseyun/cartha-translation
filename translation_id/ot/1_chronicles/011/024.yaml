  yaml_path: translation/ot/1_chronicles/011/024.yaml
  text: These things Benaiah son of Jehoiada did[a], and he had a name among the three mighty men.
translation:
  language: id
  text: Inilah yang dilakukan Benaya anak Yoyada; ia pun termasyhur[a] di antara ketiga pahlawan perkasa itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dan baginya ada nama di antara ketiga pahlawan perkasa itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: Hal-hal inilah yang dilakukan
  rationale: Ungkapan ini merangkum kembali berbagai tindakan kepahlawanan yang baru saja diceritakan. Bentuk dengan '-lah' mempertahankan tekanan demonstratif Ibrani dalam bahasa Indonesia yang wajar.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaya anak Yoyada
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia, sedangkan hubungan בֶּן diterjemahkan secara langsung sebagai 'anak'.
- source_word: וְלוֹ שֵׁם
  choice: dan ia ternama
  rationale: Secara harfiah ungkapan ini berarti 'dan baginya ada nama'. 'Ia ternama' menyampaikan idiom reputasi itu secara alami, sementara arti harfiahnya dipertahankan dalam catatan kaki.
- source_word: בִּשְׁלוֹשָׁה הַגִּבֹּרִים
  choice: di antara ketiga kesatria itu
  rationale: Preposisi בְּ menyatakan kedudukan atau pengakuan dalam kaitannya dengan suatu kelompok. 'Kesatria' menunjukkan para pejuang pilihan Daud, dan 'itu' menandai kelompok tertentu yang dikenal dari konteks.
theological_decisions:
- issue: Hubungan Benaya dengan kelompok 'ketiga kesatria'
  choice: di antara ketiga kesatria itu
  alternative: bersama ketiga kesatria itu
  rationale: Teks menyatakan ketenarannya dalam hubungan dengan kelompok tersebut, tetapi tidak dengan sendirinya memastikan secara tegas bahwa ia anggota kelompok itu. Rumusan ini mempertahankan kelonggaran makna preposisi Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kesatria' dipilih sebagai sebutan ringkas bagi pejuang pilihan, sedangkan idiom Ibrani tentang 'nama' dijelaskan melalui catatan kaki.
