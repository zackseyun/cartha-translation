base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/009.yaml
  text: And David became greater and greater[a], and Yahweh of hosts was with him.
translation:
  language: id
  text: Daud menjadi semakin besar[a], dan Yahweh Semesta Alam menyertainya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibraninya berbunyi, “Daud pergi, terus pergi dan besar”; ini adalah ungkapan yang berarti bahwa ia semakin lama semakin besar.
    reason: Menjelaskan bentuk ungkapan Ibrani yang menyatakan perkembangan bertahap dan berkelanjutan, tanpa memasukkan “menjadi” ke dalam kutipan yang diberi label harfiah.
lexical_decisions:
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדוֹל
  choice: menjadi semakin besar
  rationale: Rangkaian verba finit, infinitif absolut, dan unsur yang berarti ‘besar’ merupakan ungkapan Ibrani yang menyatakan perkembangan terus-menerus. Pilihan ini menyampaikan maknanya secara alami dalam bahasa Indonesia tanpa mengartikannya sebagai gerak harfiah.
- source_word: דָּוִיד
  choice: Daud
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: וַיהוָה צְבָאוֹת
  choice: dan Yahweh Semesta Alam
  rationale: Konjungsi וַ diterjemahkan langsung sebagai ‘dan’, tanpa menambahkan hubungan sebab-akibat. Nama ilahi יְהוָה dipertahankan sebagai ‘Yahweh’, sedangkan צְבָאוֹת diterjemahkan dengan gelar Indonesia yang mapan ‘Semesta Alam’, yang menunjuk kepada segala bala atau pasukan di bawah kekuasaan-Nya.
- source_word: עִמּוֹ
  choice: menyertainya
  rationale: Ungkapan ini berarti ‘bersama dia’. ‘Menyertainya’ merupakan padanan Indonesia yang alami dan tetap menyatakan kehadiran serta pendampingan, tanpa mempersempitnya menjadi sekadar keberpihakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. Transliterasi ‘Yahweh’ mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Hubungan antara kebesaran Daud dan penyertaan Yahweh
  choice: Dihubungkan dengan ‘dan’
  alternative: Dihubungkan dengan ‘sebab’ atau ‘karena’
  rationale: Bahasa Ibrani memakai konjungsi waw biasa. Walaupun konteks dapat menyiratkan hubungan antara kedua pernyataan itu, terjemahan tidak menambahkan hubungan sebab-akibat yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. ‘Menjadi semakin besar’ mudah dipahami pembaca umum dan mempertahankan gagasan peningkatan yang terus berlangsung. Gelar ‘Yahweh Semesta Alam’ dipertahankan dalam bentuk yang akrab dalam ragam Alkitabiah Indonesia.
