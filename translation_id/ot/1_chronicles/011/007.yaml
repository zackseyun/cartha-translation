  text: וַ/יֵּ֥שֶׁב דָּוִ֖יד בַּ/מְצָ֑ד עַל כֵּ֥ן קָרְאוּ ל֖/וֹ עִ֥יר דָּוִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/007.yaml
  text: David lived in the stronghold[a]; therefore they called it the City of David.
translation:
  language: id
  text: Daud tinggal di benteng[a] itu; karena itu orang menyebutnya Kota Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kubu pertahanan.” Kata Ibrani מְצָד menunjuk pada tempat pertahanan yang diperkuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Dalam narasi yang menyebut lokasi, verba יָשַׁב secara idiomatis berarti menetap atau tinggal, bukan sekadar duduk.
- source_word: בַּמְצָד
  choice: di benteng itu
  rationale: מְצָד menunjuk pada tempat pertahanan yang diperkuat. 'Benteng' alami dalam bahasa Indonesia dan mempertahankan nuansa militernya; bentuk tertentu Ibrani ditampilkan dengan 'itu'.
- source_word: עַל כֵּן
  choice: karena itu
  rationale: Ungkapan ini menandai akibat atau konsekuensi dari tindakan sebelumnya.
- source_word: קָרְאוּ לוֹ
  choice: orang menyebutnya
  rationale: Bentuk Ibrani memakai verba aktif jamak tanpa subjek yang disebutkan. 'Orang menyebutnya' mempertahankan sifat subjek tak tentu dan terdengar alami dalam bahasa Indonesia.
- source_word: עִיר דָּוִיד
  choice: Kota Daud
  rationale: Ungkapan ini merupakan nama tempat yang dikenal dalam pemakaian Alkitab, sehingga ditulis sebagai nama diri.
