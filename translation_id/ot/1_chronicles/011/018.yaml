  text: וַ/יִּבְקְע֨וּ הַ/שְּׁלֹשָׁ֜ה בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בּ֤וֹר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑יד וְ/לֹֽא אָבָ֤ה דָוִיד֙ לִ/שְׁתּוֹתָ֔/ם וַ/יְנַסֵּ֥ךְ אֹתָ֖/ם לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/018.yaml
  text: So the three broke through into the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But David was not willing to drink it; instead, he poured it out to Yahweh.
translation:
  language: id
  text: Ketiga orang itu pun menerobos masuk ke perkemahan orang Filistin, menimba air dari sumur Betlehem yang berada di pintu gerbang, lalu membawanya kepada Daud. Namun, Daud tidak mau meminumnya. Sebaliknya, ia mencurahkannya kepada Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih eksplisit, “ia mencurahkannya sebagai persembahan curahan kepada Yahweh.” Verba Ibrani yang digunakan dapat mengandung makna persembahan curahan atau pencurahan ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: menerobos masuk
  rationale: Dalam konteks militer, verba ini menggambarkan tindakan menembus pertahanan atau barisan musuh. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya tindakan tersebut.
- source_word: הַשְּׁלֹשָׁה
  choice: ketiga orang itu
  rationale: Teks Ibrani hanya menyebut 'ketiganya'. Kata 'orang' diperlukan agar ungkapannya alami dalam bahasa Indonesia, sedangkan identitas mereka sebagai para kesatria dibiarkan berasal dari konteks.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: ke perkemahan orang Filistin
  rationale: Preposisi dipahami sebagai arah gerakan bersama verba 'menerobos masuk'. 'Perkemahan orang Filistin' menerjemahkan frasa konstruksi tersebut dengan jelas.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: menimba air
  rationale: Ini merupakan padanan Indonesia yang lazim untuk mengambil air dari sebuah sumur.
- source_word: מִבּוֹר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: dari sumur Betlehem yang berada dekat pintu gerbang
  rationale: בּוֹר dapat berarti lubang, perigi, sumur, atau bak penampung air. Karena air dalam kisah ini ditimba untuk diminum, 'sumur' merupakan pilihan paling alami. 'Dekat pintu gerbang' menyampaikan lokasi tanpa memperinci secara berlebihan.
- source_word: וַיִּשְׂאוּ וַיָּבִיאוּ אֶל דָּוִיד
  choice: lalu membawanya kepada Daud
  rationale: Dua verba berurutan—mengangkat atau membawa dan membawa kepada—diringkas secara alami tanpa kehilangan tindakan pemindahan air kepada Daud. Akhiran '-nya' merujuk pada air.
- source_word: וְלֹא אָבָה דָוִיד לִשְׁתּוֹתָם
  choice: Daud tidak mau meminumnya
  rationale: אָבָה menyatakan kemauan atau persetujuan. 'Tidak mau' mempertahankan nuansa tersebut tanpa memperkuatnya menjadi penolakan keras. Meskipun sufiks Ibraninya jamak karena bentuk 'air', bahasa Indonesia secara wajar memakai '-nya'.
- source_word: וַיְנַסֵּךְ אֹתָם לַיהוָה
  choice: ia mencurahkannya bagi Yahweh
  rationale: נסך menyatakan tindakan mencurahkan dan dalam konteks keagamaan dapat berarti mempersembahkan persembahan curahan. Teks utama mempertahankan tindakan konkret, sedangkan nuansa ritualnya dijelaskan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Makna kultis tindakan Daud terhadap air itu
  choice: Teks utama menerjemahkan tindakan konkretnya sebagai 'mencurahkannya bagi Yahweh', dengan makna persembahan curahan dijelaskan dalam catatan kaki.
  alternative: Menerjemahkan langsung 'mempersembahkannya sebagai persembahan curahan kepada Yahweh'.
  rationale: Verba Ibrani mengandung nuansa ritual atau pengurbanan, tetapi narasi juga menggambarkan tindakan mencurahkan yang kasatmata. Pilihan ini mempertahankan keduanya tanpa memaksakan penjelasan ritual ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur naratif dibuat mengalir dengan 'pun', 'lalu', dan 'namun', sementara istilah yang tidak dinyatakan langsung dalam teks—seperti 'kesatria'—tidak ditambahkan.
