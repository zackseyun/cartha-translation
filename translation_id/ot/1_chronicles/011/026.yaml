  text: וְ/גִבּוֹרֵ֖י הַ/חֲיָלִ֑ים עֲשָׂה אֵל֙ אֲחִ֣י יוֹאָ֔ב אֶלְחָנָ֥ן בֶּן דּוֹד֖וֹ מִ/בֵּ֥ית לָֽחֶם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/026.yaml
  text: 'And the mighty warriors were: Asahel the brother of Joab[a], Elhanan son of Dodo, from Bethlehem.'
translation:
  language: id
  text: 'Para pejuang yang gagah perkasa itu ialah: Asael, saudara laki-laki Yoab; Elhanan, anak Dodo, dari Betlehem.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Betlehem.” Secara harfiah, teks Ibrani berbunyi “dari Betlehem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגִבּוֹרֵי הַחֲיָלִים
  choice: Para pejuang yang gagah perkasa itu
  rationale: Frasa ini menunjuk kepada para petarung unggulan yang memiliki keberanian dan kecakapan militer. Ungkapan ini alami dalam bahasa Indonesia modern, mempertahankan nuansa militer, dan kata sambung Ibrani diteruskan melalui kesinambungan daftar tanpa harus diterjemahkan secara kaku dengan “dan”.
- source_word: עֲשָׂהאֵל
  choice: Asael
  rationale: Transliterasi baku Indonesia untuk nama diri עֲשָׂה־אֵל.
- source_word: אֲחִי יוֹאָב
  choice: saudara Yoab
  rationale: Frasa konstruksi ini mengidentifikasi Asael berdasarkan hubungan keluarganya dengan Yoab; bentuk ringkas ini jelas dan alami dalam bahasa Indonesia.
- source_word: אֶלְחָנָן
  choice: Elhanan
  rationale: Transliterasi langsung nama diri Ibrani.
- source_word: בֶּן דּוֹדוֹ
  choice: anak Dodo
  rationale: Rumus silsilah diterjemahkan secara langsung. דּוֹדוֹ dipahami sebagai nama diri Dodo, bukan sebagai nomina umum.
- source_word: מִבֵּית לָחֶם
  choice: dari Betlehem
  rationale: Preposisi מִן dengan nama tempat secara langsung menyatakan asal. Terjemahan ini mempertahankan bentuk teks Ibrani dan tidak mengubahnya menjadi sebutan penduduk.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Tanda titik koma membantu membedakan kedua nama dalam daftar beserta keterangan masing-masing. Penanda catatan kaki ditempatkan sesudah “Betlehem” karena catatan itu menerangkan frasa asal tersebut.
