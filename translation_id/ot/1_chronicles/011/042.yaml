base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/042.yaml
  text: Adina son of Shiza the Reubenite[a], a chief of the Reubenites, and with him were thirty.
translation:
  language: id
  text: Adina anak Siza, orang Ruben, adalah seorang pemimpin bani Ruben. Bersama dia ada tiga puluh orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dan atas dia ada tiga puluh.” Dalam daftar militer ini, ungkapan Ibrani tersebut kemungkinan berarti bahwa tiga puluh orang menyertai dia atau berada di bawah tanggung jawabnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדִינָא
  choice: Adina
  rationale: Nama diri ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: בֶן שִׁיזָא
  choice: anak Siza
  rationale: בֶן dalam daftar tokoh ini paling alami menyatakan hubungan ayah-anak; nama שִׁיזָא ditransliterasikan sebagai Siza.
- source_word: הָרְאוּבֵנִי
  choice: orang Ruben
  rationale: Bentuk gentilik berartikel ini menunjukkan keanggotaan suku Ruben; 'orang Ruben' alami dan jelas dalam bahasa Indonesia.
- source_word: רֹאשׁ לָרְאוּבֵנִי
  choice: seorang pemimpin bani Ruben
  rationale: רֹאשׁ di sini menyatakan kedudukan kepemimpinan, bukan arti harfiah 'kepala'; ל menunjukkan lingkup kelompok yang dipimpinnya. 'Bani Ruben' membedakan kelompok suku dari individu Ruben.
- source_word: וְעָלָיו שְׁלוֹשִׁים
  choice: Bersama dia ada tiga puluh orang
  rationale: Secara harfiah עָלָיו berarti 'di atasnya' atau 'atas dia', tetapi dalam konteks daftar militer kemungkinan menunjuk kepada tiga puluh orang yang menyertai atau terikat kepadanya. Kata 'orang' ditambahkan secara tersirat dari konteks agar kalimat Indonesia lengkap dan jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah 'pemimpin' mempertahankan arti jabatan tanpa menentukan pangkat militer yang tidak dinyatakan teks. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskannya.
