source:
  edition: WLC
  text: גַּם תְּמ֣וֹל גַּם שִׁלְשׁ֗וֹם גַּ֚ם בִּ/הְי֣וֹת שָׁא֣וּל מֶ֔לֶךְ אַתָּ֛ה הַ/מּוֹצִ֥יא וְ/הַ/מֵּבִ֖יא אֶת יִשְׂרָאֵ֑ל וַ/יֹּאמֶר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אַתָּ֨ה תִרְעֶ֤ה אֶת עַמִּ/י֙ אֶת יִשְׂרָאֵ֔ל וְ/אַתָּה֙ תִּהְיֶ֣ה נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/002.yaml
  text: Even in times past[a], even before, when Saul was king, you were the one who led Israel out and brought them in; and Yahweh your God said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over my people Israel.’
translation:
  language: id
  text: Bahkan dahulu,[a] ketika Saul masih menjadi raja, engkaulah yang memimpin Israel keluar dan masuk.[b] Yahweh, Allahmu, telah berfirman kepadamu, ‘Engkaulah yang akan menggembalakan umat-Ku Israel, dan engkaulah yang akan menjadi penguasa atas umat-Ku Israel.’[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “baik kemarin maupun hari sebelum kemarin,” sebuah ungkapan Ibrani yang berarti “dahulu” atau “pada masa lampau.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “engkaulah yang membawa Israel keluar dan membawanya masuk,” sebuah ungkapan Ibrani tentang memimpin umat.
    reason: lexical_alternative
  - marker: c
    text: Atau “pemimpin”; kata Ibrani ini bukan kata yang biasa diterjemahkan “raja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם תְּמוֹל גַּם שִׁלְשׁוֹם
  choice: Dahulu pun
  rationale: Ungkapan Ibrani yang secara harfiah menyebut ‘kemarin dan hari sebelumnya’ merupakan idiom untuk masa lampau. ‘Dahulu pun’ menyampaikan makna temporal sekaligus penekanannya secara wajar dalam bahasa Indonesia.
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ
  choice: ketika Saul menjadi raja
  rationale: Infinitif dengan preposisi ב membentuk klausa temporal; terjemahan ini alami dan mempertahankan gelar מֶלֶךְ sebagai ‘raja’.
- source_word: אַתָּה הַמּוֹצִיא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  choice: engkaulah yang memimpin Israel keluar dan membawa mereka kembali
  rationale: Teks memakai gambaran membawa Israel keluar dan masuk. ‘Kembali’ mengungkapkan arah pulang yang tersirat dalam idiom tanpa menghilangkan citra kepemimpinan tersebut.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, sedangkan sufiks orang kedua tunggal pada אֱלֹהֶיךָ diterjemahkan ‘Allahmu’, sesuai sapaan kepada Daud.
- source_word: תִרְעֶה
  choice: menggembalakan
  rationale: Kata kerja רעה mempertahankan metafora gembala bagi kepemimpinan raja dan lebih tepat daripada meratakannya menjadi sekadar ‘memerintah’.
- source_word: נָגִיד
  choice: penguasa
  rationale: נָגִיד menunjuk orang yang ditetapkan sebagai pemimpin atau penguasa, tetapi bukan istilah biasa untuk ‘raja’ (מֶלֶךְ). ‘Penguasa’ menjaga pembedaan itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memuat nama diri ilahi, bukan gelar; transliterasi mempertahankan nama perjanjian itu tanpa menggantinya dengan sebuah gelar.
- issue: Metafora kepemimpinan dalam תִרְעֶה
  choice: menggembalakan
  alternative: memerintah atau memimpin
  rationale: Bahasa sumber dengan sengaja memakai citra seorang gembala. Mempertahankannya menjaga hubungan teologis antara pemeliharaan umat dan pemerintahan raja.
- issue: Hubungan נָגִיד dengan gelar raja
  choice: penguasa
  alternative: pemimpin atau pangeran
  rationale: Pilihan ini menyatakan kewenangan Daud, tetapi tidak menyamakan נָגִיד begitu saja dengan מֶלֶךְ, ‘raja’, yang telah dipakai bagi Saul.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk ‘engkau’ dipakai karena tuturan diarahkan kepada Daud dalam suasana resmi; ‘umat-Ku’ mempertahankan bahasa perjanjian, sedangkan metafora gembala dan citra keluar-masuk tetap terlihat.
