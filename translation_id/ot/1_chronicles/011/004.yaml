id: 1CH.11.4
reference: 1 Chronicles 11:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ דָּוִ֧יד וְ/כָל יִשְׂרָאֵ֛ל יְרוּשָׁלִַ֖ם הִ֣יא יְב֑וּס וְ/שָׁם֙ הַ/יְבוּסִ֔י יֹשְׁבֵ֖י הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/004.yaml
  text: Then David and all Israel went to Jerusalem—that is[a], Jebus—where the Jebusites, the inhabitants of the land, were.
translation:
  language: id
  text: Lalu Daud dan seluruh Israel pergi ke Yerusalem, yaitu Yebus. Orang Yebus[a], penduduk negeri itu, tinggal di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, “orang Yebus” berbentuk tunggal tetapi digunakan untuk menyebut kelompok secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Lalu ... pergi
  rationale: Bentuk wayyiqtol melanjutkan rangkaian cerita; “lalu” menyampaikan urutan peristiwa secara wajar dalam bahasa Indonesia.
- source_word: וְכָל יִשְׂרָאֵל
  choice: dan seluruh Israel
  rationale: Menerjemahkan frasa kolektif nasional secara langsung dan alami tanpa mengubahnya menjadi keterangan penyerta.
- source_word: יְרוּשָׁלִַם הִיא יְבוּס
  choice: Yerusalem, yaitu Yebus
  rationale: Pronomina הִיא menyamakan Yerusalem dengan nama lamanya, Yebus; “yaitu” menyatakan hubungan penjelas itu dengan jelas.
- source_word: הַיְבוּסִי
  choice: Orang Yebus
  rationale: Bentuk Ibrani ini tunggal secara morfologis tetapi digunakan secara kolektif, sebagaimana ditunjukkan oleh partisipel jamak yang mengikutinya. “Orang Yebus” dapat berfungsi kolektif secara alami dalam bahasa Indonesia.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: penduduk negeri itu
  rationale: Partisipel konstruktus berarti “para penghuni/penduduk.” Dalam konteks ini הָאָרֶץ menunjuk pada negeri atau wilayah setempat; “negeri itu” mempertahankan acuan kontekstual tersebut.
- source_word: וְשָׁם
  choice: tinggal di sana
  rationale: Unsur lokatif “di sana” ditempatkan bersama predikat tersirat “tinggal,” yang dapat dipahami dari partisipel יֹשְׁבֵי, sehingga menghasilkan susunan Indonesia yang alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang lugas. Nama etnis “orang Yebus” dipertahankan dalam bentuk kolektif yang alami, sedangkan susunan klausa terakhir diatur ulang agar jelas bagi pembaca Indonesia tanpa mengubah isinya.
