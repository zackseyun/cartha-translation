  text: יְדִֽיעֲאֵל֙ בֶּן שִׁמְרִ֔י וְ/יֹחָ֥א אָחִ֖י/ו הַ/תִּיצִֽי־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/045.yaml
  text: Jediael son of Shimri[a], and Joha his brother, the Tizite;
translation:
  language: id
  text: Yediael anak Simri, dan Yoha, saudaranya, orang Tizi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “orang Zizi”, bergantung pada vokalisasi sebutan Ibrani ini dan kaitannya dengan nama tempat atau kaum.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעֲאֵל
  choice: Yediael
  rationale: Nama diri ditransliterasikan menurut pola yang alami dalam bahasa Indonesia, dengan huruf awal Y untuk bunyi Ibrani yod.
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar tokoh ini, kata tersebut paling wajar menunjukkan hubungan langsung ayah-anak; bentuk ringkas “anak” sesuai dengan gaya daftar nama.
- source_word: שִׁמְרִי
  choice: Simri
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia; שׁ diwakili dengan “s” sesuai kebiasaan nama Alkitab dalam bahasa Indonesia.
- source_word: וְיֹחָא
  choice: dan Yoha
  rationale: Konjungsi diterjemahkan “dan”, sedangkan nama diri ditransliterasikan secara langsung dan alami dalam ejaan Indonesia.
- source_word: אָחִיו
  choice: saudaranya
  rationale: Makna biasa אָח adalah saudara laki-laki; “saudaranya” mempertahankan hubungan kekeluargaan tanpa menambahkan keterangan yang tidak dinyatakan.
- source_word: הַתִּיצִי
  choice: orang Tizi
  rationale: Bentuk dengan kata sandang merupakan sebutan asal tempat atau kelompok. Ungkapan Indonesia “orang Tizi” lebih alami daripada membentuk istilah nisbah yang asing, sambil tetap mempertahankan nama yang mendasarinya.
