translation_notes:
  register: Terjemahan menggunakan bahasa Indonesia modern yang ringkas dan bermartabat, sesuai bentuk daftar nama. Tanda catatan kaki ditempatkan langsung setelah sebutan yang dipersoalkan, yaitu “orang Tizi”.
