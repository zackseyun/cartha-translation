  text: וְ/הֽוּא הִכָּה֩ אֶת הָ/אִ֨ישׁ הַ/מִּצְרִ֜י אִ֥ישׁ מִדָּ֣ה חָמֵ֣שׁ בָּ/אַמָּ֗ה וּ/בְ/יַ֨ד הַ/מִּצְרִ֤י חֲנִית֙ כִּ/מְנ֣וֹר אֹרְגִ֔ים וַ/יֵּ֥רֶד אֵלָ֖י/ו בַּ/שָּׁ֑בֶט וַ/יִּגְזֹ֤ל אֶֽת הַ/חֲנִית֙ מִ/יַּ֣ד הַ/מִּצְרִ֔י וַ/יַּהַרְגֵ֖/הוּ בַּ/חֲנִיתֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/023.yaml
  text: And he struck down the Egyptian[a], a man five cubits tall. In the Egyptian’s hand was a spear like a weaver’s beam, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[c][b], and killed him with his own spear.
translation:
  language: id
  text: Ia memukul orang Mesir itu, seorang yang tingginya lima hasta.[a] Di tangan orang Mesir itu ada tombak seperti balok penenun. Ia turun menghampirinya dengan tongkat,[b] merampas tombak itu dari tangan orang Mesir itu, lalu membunuhnya dengan tombak orang Mesir itu sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hasta adalah satuan panjang kuno yang kira-kira sama dengan jarak dari siku sampai ujung jari. Frasa Ibrani yang mendahului ukuran ini secara harfiah berarti “seorang yang berukuran” dan dapat menunjuk pada perawakan yang luar biasa.
    reason: cultural_note; lexical_alternative
  - marker: b
    text: Kata Ibrani ini juga dapat diterjemahkan “gada” atau “batang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: menewaskan
  rationale: Dalam konteks pertempuran, נכה menyatakan tindakan menjatuhkan lawan. 'Menewaskan' alami dalam bahasa Indonesia, sementara verba pembunuhan yang eksplisit tetap diterjemahkan tersendiri pada akhir ayat.
- source_word: הָאִישׁ הַמִּצְרִי
  choice: orang Mesir itu
  rationale: Ungkapan ini secara alami menunjuk seorang laki-laki Mesir tertentu; 'orang Mesir itu' jelas dan tidak kaku.
- source_word: אִישׁ מִדָּה חָמֵשׁ בָּאַמָּה
  choice: seorang yang tingginya lima hasta
  rationale: Frasa harfiahnya 'seorang yang berukuran' menunjuk pada perawakan luar biasa, lalu ukurannya dinyatakan sebagai lima hasta. Terjemahan ini menyampaikan maksud tersebut tanpa menghilangkan satuan kuno.
- source_word: חֲנִית
  choice: tombak
  rationale: Tombak cocok dengan senjata besar yang batangnya dibandingkan dengan balok penenun.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: seperti balok penenun
  rationale: Perbandingan ini menggambarkan besarnya batang tombak dengan bagian besar pada alat tenun; istilah sumber dipertahankan secara ringkas.
- source_word: וַיֵּרֶד אֵלָיו
  choice: ia mendatanginya
  rationale: ירד secara harfiah berarti 'turun', tetapi di sini menggambarkan gerak mendekati lawan. 'Mendatanginya' alami dan tidak menambahkan rincian medan yang tidak diketahui.
- source_word: בַּשָּׁבֶט
  choice: hanya dengan tongkat
  rationale: שבט dapat berarti tongkat, gada, atau batang. 'Tongkat' merupakan pilihan luas dan netral; 'hanya' membuat kontras senjata tersampaikan secara alami tanpa mengubah isi tindakan.
- source_word: וַיִּגְזֹל
  choice: merampas
  rationale: Verba ini menyatakan pengambilan secara paksa, sehingga 'merampas' tepat bagi tindakan dalam perkelahian.
- source_word: וַיַּהַרְגֵהוּ
  choice: membunuhnya
  rationale: Verba הרג secara eksplisit menyatakan pembunuhan; pilihan ini lugas dan modern.
- source_word: בַּחֲנִיתוֹ
  choice: dengan tombaknya sendiri
  rationale: Akhiran pronominal paling wajar merujuk kepada orang Mesir yang tombaknya baru dirampas. 'Sendiri' memperjelas ironi naratif secara alami.
