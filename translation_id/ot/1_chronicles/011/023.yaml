translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Istilah ukuran kuno 'hasta' dipertahankan dengan catatan budaya. Struktur dibuat mengalir bagi pembaca umum sambil mempertahankan urutan tindakan dan ketegangan antara tombak besar dan tongkat.
