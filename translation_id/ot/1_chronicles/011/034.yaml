  text: the sons of Hashem the Gizonite[a], Jonathan son of Shagee the Hararite;
translation:
  language: id
  text: anak-anak Hasem, orang Gizoni[a], Yonatan anak Sage, orang Harari;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “anak-anak Hasem, orang Gizoni.” Daftar sejajar dalam 2 Samuel 23:32 memiliki urutan nama yang berbeda, yang kerap tercermin dalam berbagai terjemahan atau rekonstruksi.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן secara harfiah berarti 'anak-anak dari'. Terjemahan mempertahankan bentuk jamak Teks Masoret dan tidak menyelaraskannya dengan daftar sejajar.
- source_word: הָשֵׁם
  choice: Hasem
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia; huruf שׁ diwakili oleh 's' karena bahasa Indonesia tidak lazim memakai digraf Inggris 'sh'.
- source_word: הַגִּזוֹנִי
  choice: orang Gizon itu
  rationale: Bentuk nisbah dengan kata sandang menunjukkan asal atau kelompok. Ungkapan 'orang Gizon itu' alami dalam bahasa Indonesia dan mempertahankan kekhususan kata sandang.
- source_word: יוֹנָתָן
  choice: Yonatan
  rationale: Transliterasi nama Ibrani yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Bentuk konstruktus tunggal yang menyatakan hubungan keturunan; dalam rangkaian nama Indonesia, 'anak Sage' jelas dan alami.
- source_word: שָׁגֵה
  choice: Sage
  rationale: Nama diri ditransliterasikan secara langsung dengan ejaan Indonesia.
- source_word: הַהֲרָרִי
  choice: orang Harar itu
  rationale: Bentuk nisbah dengan kata sandang kemungkinan menyatakan asal daerah atau kelompok; diterjemahkan dengan pola yang sama seperti הַגִּזוֹנִי.
