  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה רָאשֵׁ֤י הַ/גִּבּוֹרִים֙ אֲשֶׁ֣ר לְ/דָוִ֔יד הַ/מִּתְחַזְּקִ֨ים עִמּ֧/וֹ בְ/מַלְכוּת֛/וֹ עִם כָּל יִשְׂרָאֵ֖ל לְ/הַמְלִיכ֑/וֹ כִּ/דְבַ֥ר יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/010.yaml
  text: These were the chiefs of the mighty men who belonged to David[a], who strengthened themselves with him in his kingdom, together with all Israel, to make him king[b], according to the word of Yahweh concerning Israel.
translation:
  language: id
  text: Inilah para pemimpin kesatria Daud yang memberikan dukungan kuat kepadanya[a] dalam kerajaannya. Bersama seluruh Israel, mereka mengangkatnya menjadi raja, sesuai dengan firman Yahweh mengenai Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “yang menguatkan diri bersama dia.” Ungkapan Ibrani ini kemungkinan menunjuk pada keberpihakan dan dukungan kuat mereka kepada Daud sebagai raja.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “firman Yahweh atas Israel.” Dalam konstruksi ini, ungkapan tersebut kemungkinan berarti “firman Yahweh mengenai Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הַגִּבּוֹרִים
  choice: para pemimpin kesatria
  rationale: רָאשֵׁי menunjuk para tokoh utama, sedangkan הַגִּבּוֹרִים dalam konteks Daud menunjuk kelompok kesatria atau pejuang unggulan. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan corak militer-heroiknya.
- source_word: אֲשֶׁר לְדָוִיד
  choice: Daud
  rationale: Konstruksi dengan לְ menyatakan hubungan atau kepemilikan. Dalam frasa Indonesia 'para pemimpin kesatria Daud', hubungan mereka dengan Daud tersampaikan secara ringkas dan wajar.
- source_word: הַמִּתְחַזְּקִים עִמּוֹ
  choice: yang memberikan dukungan kuat kepadanya
  rationale: Bentuk hitpael dari חזק dengan עִם secara harfiah dapat menggambarkan tindakan menguatkan diri bersama seseorang, tetapi dalam konteks pengangkatan Daud menjadi raja kemungkinan besar berarti berpihak dan memberi dukungan kuat kepadanya.
- source_word: בְמַלְכוּתוֹ
  choice: dalam pemerintahannya
  rationale: מַלְכוּת dapat berarti kerajaan, pemerintahan, kekuasaan raja, atau masa pemerintahan. Konteksnya adalah peneguhan kekuasaan kerajaan Daud; 'dalam pemerintahannya' tetap cukup luas dan alami.
- source_word: עִם כָּל יִשְׂרָאֵל
  choice: bersama seluruh Israel
  rationale: עִם menyatakan kebersamaan. Pilihan ini memperlihatkan bahwa para kesatria itu bertindak bersama bangsa Israel secara keseluruhan.
- source_word: לְהַמְלִיכוֹ
  choice: mereka mengangkatnya menjadi raja
  rationale: Bentuk hifil dari מלך berarti membuat atau menetapkan seseorang menjadi raja. 'Mengangkatnya menjadi raja' merupakan padanan Indonesia yang langsung dan lazim.
- source_word: כִּדְבַר יְהוָה
  choice: sesuai dengan firman Yahweh
  rationale: דָּבָר dipertahankan sebagai 'firman' untuk menyatakan perkataan ilahi tanpa mempersempitnya menjadi janji; nama יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: עַל יִשְׂרָאֵל
  choice: mengenai Israel
  rationale: Dengan דָּבָר, עַל lazim berarti 'mengenai' atau 'tentang'. Ini mengaitkan Israel dengan isi firman Yahweh, bukan secara tidak sengaja dengan cakupan pemerintahan Daud.
theological_decisions:
- issue: Makna tindakan para pendukung Daud dalam הַמִּתְחַזְּקִים עִמּוֹ
  choice: dukungan politik-militer yang kuat kepada Daud
  alternative: menguatkan diri bersama Daud atau saling menguatkan dengannya
  rationale: Konteks langsung berbicara tentang menjadikan Daud raja. Terjemahan utama menyampaikan makna kontekstual yang paling mungkin, sementara catatan kaki mempertahankan kemungkinan bentuk yang lebih harfiah.
- issue: Cakupan makna בְמַלְכוּתוֹ
  choice: dalam pemerintahannya
  alternative: dalam kerajaannya atau dalam kedudukannya sebagai raja
  rationale: Istilah Ibrani dapat merujuk pada pemerintahan, kekuasaan kerajaan, atau kerajaan sebagai ranah. Pilihan ini cocok dengan konteks peneguhan takhta tanpa menuntaskan seluruh ambiguitas leksikal.
- issue: Hubungan עַל יִשְׂרָאֵל
  choice: firman Yahweh mengenai Israel
  alternative: firman Yahweh atas Israel
  rationale: Secara sintaksis frasa tersebut paling wajar menerangkan isi firman Yahweh. Bentuk yang lebih harfiah tetap dicatat agar hubungan preposisional aslinya tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kalimat panjang sumber dibagi menjadi dua agar mudah dipahami tanpa mengubah hubungan logisnya. 'Kesatria' dipakai untuk kelompok pejuang unggulan Daud, dan nama ilahi ditampilkan sebagai 'Yahweh'.
