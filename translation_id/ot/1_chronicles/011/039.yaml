source:
  edition: WLC
  text: צֶ֖לֶק הָ/עַמּוֹנִ֑י נַחְרַי֙ הַ/בֵּ֣רֹתִ֔י נֹשֵׂ֕א כְּלֵ֖י יוֹאָ֥ב בֶּן צְרוּיָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/039.yaml
  text: Zelek the Ammonite[a], Naharai the Beerothite, the armor-bearer of Joab son of Zeruiah;
translation:
  language: id
  text: Zelek, orang Amon; Naharai, orang Beerot, pembawa senjata[a] Yoab anak Zeruya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pembawa perlengkapan perang.”
    reason: Menunjukkan keluasan makna כְּלֵי, yang dapat merujuk pada senjata maupun perlengkapan perang.
lexical_decisions:
- source_word: צֶלֶק
  choice: Zelek
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia.
- source_word: הָעַמּוֹנִי
  choice: orang Amon
  rationale: Sebutan etnis dengan kata sandang; bentuk ini alami dalam bahasa Indonesia dan mengidentifikasi asal Zelek.
- source_word: נַחְרַי
  choice: Naharai
  rationale: Nama diri ditransliterasikan dengan mempertahankan pola vokal Masoret.
- source_word: הַבֵּרֹתִי
  choice: orang Beerot
  rationale: Sebutan berdasarkan tempat asal; 'orang Beerot' lebih wajar dalam bahasa Indonesia modern daripada membentuk kata nisbah yang tidak lazim.
- source_word: נֹשֵׂא כְּלֵי
  choice: pembawa senjata
  rationale: Ungkapan Ibrani yang menunjuk pada orang yang membawa senjata atau perlengkapan perang seorang pemimpin; 'pembawa senjata' ringkas, alami, dan sesuai konteks.
- source_word: יוֹאָב
  choice: Yoab
  rationale: Bentuk nama yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן צְרוּיָה
  choice: anak Zeruya
  rationale: Menerjemahkan hubungan keturunan secara langsung dan mempertahankan identifikasi Yoab melalui nama ibunya.
