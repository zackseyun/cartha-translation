  text: וַ/יֵּרְד֡וּ שְֽׁלוֹשָׁה֩ מִן הַ/שְּׁלוֹשִׁ֨ים רֹ֤אשׁ עַל הַ/צֻּר֙ אֶל דָּוִ֔יד אֶל מְעָרַ֖ת עֲדֻלָּ֑ם וּ/מַחֲנֵ֣ה פְלִשְׁתִּ֔ים חֹנָ֖ה בְּ/עֵ֥מֶק רְפָאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/015.yaml
  text: Then three of the thirty chiefs went down to the rock[a], to David, at the cave of Adullam, while the camp of the Philistines was encamped in the Valley of Rephaim.
translation:
  language: id
  text: Kemudian tiga orang dari antara ketiga puluh pemimpin itu turun ke batu itu[a] menemui Daud di Gua Adulam, sementara pasukan orang Filistin berkemah di Lembah Refaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “turun ke atas batu itu, kepada Daud, ke Gua Adulam.” Susunan bahasa Ibrani sangat padat; dalam teks utama, “di Gua Adulam” memperjelas lokasi Daud.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: turun
  rationale: Bentuk naratif dari ירד menyatakan gerak turun; 'turun' alami dalam bahasa Indonesia dan mempertahankan arah gerak.
- source_word: שְׁלוֹשָׁה מִן־הַשְּׁלוֹשִׁים רֹאשׁ
  choice: tiga orang dari antara ketiga puluh pemimpin itu
  rationale: Frasa ini menunjuk tiga orang yang berasal dari kelompok tiga puluh dan berkedudukan sebagai pemimpin; susunan Indonesia ini jelas tanpa menetapkan jabatan militer yang tidak dinyatakan teks.
- source_word: עַל־הַצּוּר
  choice: ke bukit batu
  rationale: צּוּר berarti batu besar atau kawasan berbatu, sedangkan עַל dalam konteks gerak dapat berarti menuju atau ke atas suatu tempat. 'Bukit batu' mempertahankan unsur topografis dan lebih alami daripada 'ke atas batu'.
- source_word: אֶל־דָּוִיד
  choice: menemui Daud
  rationale: אֶל menyatakan arah menuju Daud; 'menemui Daud' menyampaikan tujuan personal secara alami.
- source_word: אֶל־מְעָרַת עֲדֻלָּם
  choice: di Gua Adulam
  rationale: Secara harfiah frasa itu dapat berarti 'ke Gua Adulam', tetapi dalam sintaksis padat ini frasa tersebut menjelaskan lokasi Daud. 'Di Gua Adulam' menghasilkan bahasa Indonesia yang jelas.
- source_word: וּמַחֲנֵה פְלִשְׁתִּים חֹנָה
  choice: sementara pasukan orang Filistin berkemah
  rationale: Klausa partisipial memberi latar keadaan yang sedang berlangsung. מַחֲנֶה secara konkret dapat menunjuk perkemahan atau pasukan yang berkemah; 'pasukan ... berkemah' alami dan menghindari ungkapan janggal 'perkemahan berkemah'.
- source_word: בְּעֵמֶק רְפָאִים
  choice: di Lembah Refaim
  rationale: Nama geografis diterjemahkan sebagai 'Lembah' dan nama רְפָאִים ditransliterasikan 'Refaim' menurut pola Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Penanda definit pada הַצּוּר dipahami secara kontekstual, sedangkan nama tempat ditulis 'Adulam' dan 'Refaim'.
