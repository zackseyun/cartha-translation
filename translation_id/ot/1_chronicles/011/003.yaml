source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ כָּל זִקְנֵ֨י יִשְׂרָאֵ֤ל אֶל הַ/מֶּ֨לֶךְ֙ חֶבְר֔וֹנָ/ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם דָּוִ֥יד בְּרִ֛ית בְּ/חֶבְר֖וֹן לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּמְשְׁח֨וּ אֶת דָּוִ֤יד לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל כִּ/דְבַ֥ר יְהוָ֖ה בְּ/יַד שְׁמוּאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and David made a covenant with them at Hebron before Yahweh. Then they anointed David king over Israel, according to the word of Yahweh by Samuel.
translation:
  language: id
  text: Maka semua tua-tua Israel datang kepada raja di Hebron. Daud mengadakan perjanjian dengan mereka di Hebron di hadapan Yahweh. Lalu mereka mengurapi Daud menjadi raja atas Israel, sesuai dengan firman Yahweh melalui Samuel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dengan tangan Samuel,” sebuah idiom yang berarti “melalui Samuel.”'
    reason: Menjelaskan idiom Ibrani בְּיַד שְׁמוּאֵל tanpa mengubah makna perantaraan Samuel.
lexical_decisions:
- source_word: זִקְנֵי
  choice: tua-tua
  rationale: Istilah ini menunjuk kepada para wakil atau pemimpin masyarakat Israel yang diakui. “Tua-tua” mempertahankan kekhususan jabatan sosial-politiknya.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Teks Ibrani memakai gelar definit tanpa menyebut nama pada bagian ini; klausa berikutnya menyebut Daud secara langsung.
- source_word: חֶבְרוֹנָה / בְּחֶבְרוֹן
  choice: di Hebron
  rationale: Bentuk pertama menandakan arah menuju Hebron, tetapi dalam susunan “datang kepada raja di Hebron,” bahasa Indonesia secara alami menyatakan lokasi raja. Bentuk kedua secara jelas menyatakan lokasi perjanjian.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: mengikat perjanjian
  rationale: Secara harfiah idiom ini berarti “memotong perjanjian.” “Mengikat perjanjian” merupakan padanan Indonesia yang alami dan tetap menyampaikan tindakan resmi Daud.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Padanan ini mempertahankan nuansa bahwa perjanjian tersebut dibuat dalam kehadiran dan kesaksian ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַיִּמְשְׁחוּ
  choice: mereka mengurapi
  rationale: Kata kerja ini secara khusus menyatakan pengurapan dalam pelantikan seorang raja; “menahbiskan” akan lebih interpretatif.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: menjadi raja atas Israel
  rationale: Ungkapan ini secara alami menyatakan pengangkatan Daud ke dalam kedudukan kerajaan dan ruang lingkup pemerintahannya.
- source_word: כִּדְבַר יְהוָה
  choice: sesuai dengan firman Yahweh
  rationale: “Firman” mempertahankan acuan langsung kepada perkataan ilahi tanpa mempersempitnya menjadi “janji.”
- source_word: בְּיַד שְׁמוּאֵל
  choice: melalui Samuel
  rationale: Ungkapan harfiahnya “dengan/perantaraan tangan Samuel” merupakan idiom untuk penyampaian atau perantaraan. “Melalui Samuel” jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Peran Samuel dalam firman ilahi
  choice: melalui Samuel
  alternative: oleh Samuel; dengan perantaraan tangan Samuel
  rationale: Pilihan ini mempertahankan Yahweh sebagai sumber firman dan Samuel sebagai perantara penyampaiannya, sesuai idiom Ibrani בְּיַד.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur Ibrani tanpa mempertahankan idiom yang terasa asing. Penanda catatan kaki ditempatkan sesudah “Samuel,” yaitu pada frasa yang diterangkannya.
