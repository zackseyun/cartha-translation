  text: עֻזִיָּ֖א הָ/עֲשְׁתְּרָתִ֑י שָׁמָע֙ ו/יעואל בְּנֵ֖י חוֹתָ֥ם הָ/עֲרֹעֵרִֽיס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/044.yaml
  text: Uzzia the Ashterathite[a], Shama and Jeiel[b], the sons of Hotham the Aroerite.
translation:
  language: id
  text: Uzia, orang Asyterat[a]; Syama dan Yeuel[b], putra-putra Hotam, orang Aroer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: orang Asytarot. Bentuk Ibrani ini menunjuk kepada seseorang yang berasal dari Asyterat atau Asytarot.'
    reason: lexical_alternative
  - marker: b
    text: Nama ini juga ditulis “Yeiel” dalam sebagian tradisi transliterasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻזִיָּא
  choice: Uzia
  rationale: Nama pribadi ditransliterasikan dengan bentuk yang alami dan lazim dalam bahasa Indonesia.
- source_word: הָעֲשְׁתְּרָתִי
  choice: orang Asyterat
  rationale: Bentuk nisbah Ibrani menunjukkan seseorang yang berasal dari Asyterat; ungkapan 'orang Asyterat' lebih alami dalam bahasa Indonesia daripada membentuk adjektiva baru.
- source_word: שָׁמָע
  choice: Syama
  rationale: Transliterasi nama pribadi mengikuti bentuk Ibrani yang tertulis, tanpa menambahkan konsonan rangkap.
- source_word: ויעואל
  choice: dan Yeuel
  rationale: Konjungsi ו diterjemahkan 'dan', sedangkan nama ditransliterasikan Yeuel berdasarkan bentuk konsonantal sumber Ibrani; bentuk tradisional Yeiel dicatat sebagai alternatif.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Bentuk jamak konstruksi dari 'anak laki-laki'; dalam silsilah atau daftar nama, 'anak-anak Hotam' menyampaikan hubungan keluarga secara wajar tanpa harus menentukan bahwa hanya anak laki-laki yang dimaksud dalam bahasa sasaran.
- source_word: חוֹתָם
  choice: Hotam
  rationale: Nama pribadi ditransliterasikan secara langsung ke ejaan Indonesia.
- source_word: הָעֲרֹעֵרִי
  choice: orang Aroer
  rationale: Bentuk nisbah menyatakan asal dari Aroer; konstruksi 'orang Aroer' jelas dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa dibuat ringkas dan bermartabat sesuai gaya daftar nama. Tanda titik koma membantu memperjelas bahwa keterangan 'anak-anak Hotam' melekat pada Syama dan Yeuel, bukan pada Uzia. Semua nama disesuaikan dengan ejaan Indonesia, dan sebutan asal diterjemahkan dengan pola alami 'orang + nama tempat'.
