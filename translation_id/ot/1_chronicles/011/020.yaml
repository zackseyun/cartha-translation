revisions:
- from: Abisai, saudara Yoab, adalah kepala Ketiga Orang Itu.[a] Ia mengayunkan tombaknya melawan tiga ratus orang dan menewaskan mereka,[b] sehingga ia ternama di antara Ketiga Orang Itu.[c]
  to: Abisai, saudara Yoab, adalah pemimpin Tiga Orang Itu.[a] Ia mengayunkan tombaknya terhadap tiga ratus orang yang tewas, dan ia termasyhur di antara Tiga Orang Itu.[b][c]
  rationale: Revisi mengganti ordinal yang kurang tepat dengan 'Tiga Orang Itu,' memakai 'pemimpin' untuk jabatan militer, dan menghapus tambahan verba 'menewaskan mereka.' Frasa 'tiga ratus orang yang tewas' mempertahankan חָלָל sebagai sebutan bagi yang tewas tanpa memaksakan hubungan sintaksis yang lebih eksplisit daripada teks Ibrani. Catatan kaki juga diperbaiki agar bentuk literal dan idiom Ibraninya lebih akurat.
