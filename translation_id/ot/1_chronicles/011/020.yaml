translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sebutan “Ketiga Orang Itu” memakai huruf kapital untuk menandai kelompok prajurit tertentu, sedangkan ungkapan tindakan tempur dibuat alami tanpa menyelaraskan persoalan tekstual “tiga” dan “tiga puluh”.
