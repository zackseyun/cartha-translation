  text: וְ/אַבְשַׁ֣י אֲחִֽי יוֹאָ֗ב ה֤וּא הָיָה֙ רֹ֣אשׁ הַ/שְּׁלוֹשָׁ֔ה וְ/הוּא֙ עוֹרֵ֣ר אֶת חֲנִית֔/וֹ עַל שְׁלֹ֥שׁ מֵא֖וֹת חָלָ֑ל ו/לא שֵׁ֖ם בַּ/שְּׁלוֹשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/020.yaml
  text: And Abishai[a], the brother of Joab, was chief of the Three. He brandished his spear against three hundred slain[c][b], and had a name among the Three.
translation:
  language: id
  text: Abisai, saudara Yoab, adalah pemimpin Tiga Orang Itu.[a] Ia mengayunkan tombaknya terhadap tiga ratus orang yang tewas, dan ia termasyhur di antara Tiga Orang Itu.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “tiga orang itu.” Dalam bagian paralel (2 Samuel 23:18), sejumlah terjemahan menerjemahkan kelompok ini secara berbeda karena kesulitan tekstual dan kontekstual yang berkaitan dengan “tiga” dan “tiga puluh.”
    reason: textual_variant
  - marker: b
    text: Dapat juga diterjemahkan “mengacungkan tombaknya” atau “menggerakkan tombaknya.”
    reason: lexical_alternative
  - marker: c
    text: Ungkapan Ibrani secara harfiah berarti “mempunyai nama,” yaitu terkenal atau termasyhur.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: kepala
  rationale: Dalam konteks kelompok prajurit, kata ini menunjukkan kedudukan sebagai pemimpin. “Kepala” tetap dekat dengan metafora Ibrani dan wajar dalam bahasa Indonesia.
- source_word: הַשְּׁלוֹשָׁה / בַּשְּׁלוֹשָׁה
  choice: Ketiga Orang Itu / di antara Ketiga Orang Itu
  rationale: Teks Masoret secara jelas berbunyi “ketiganya.” Terjemahan ini mempertahankan bentuk tersebut dan tidak menyelaraskannya dengan “tiga puluh” dalam tradisi atau konteks paralel.
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: mengayunkan tombaknya
  rationale: Ungkapan Ibrani secara harfiah menggambarkan tindakan membangkitkan atau menggerakkan tombak. “Mengayunkan tombaknya” menyampaikan tindakan tempur secara hidup dan alami tanpa menghilangkan citra sumber.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: melawan tiga ratus orang dan menewaskan mereka
  rationale: חָלָל berarti orang yang tertikam atau tewas. Susunan bahasa Indonesia ini mengungkapkan hasil tindakan Abisai dengan jelas sambil mempertahankan jumlah dan hubungan tempurnya.
- source_word: שֵׁם
  choice: ternama
  rationale: Ungkapan Ibrani “ada nama baginya” menyatakan reputasi atau kemasyhuran. “Ternama” adalah padanan alami dan ringkas dalam bahasa Indonesia modern.
- source_word: אַבְשַׁי
  choice: Abisai
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: אֲחִי יוֹאָב
  choice: saudara Yoab
  rationale: Padanan ini mengikuti konstruksi Ibrani secara dekat dan terdengar alami dalam bahasa Indonesia.
