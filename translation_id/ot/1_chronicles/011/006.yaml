    rationale: Penanda sebaiknya ditempatkan langsung setelah frasa yang memiliki alternatif leksikal agar jangkar catatan kaki jelas.
  - severity: low
    issue: Penanda [b] lebih tepat melekat pada “naik” daripada pada seluruh frasa “maju lebih dahulu.”
    rationale: Catatan tersebut khusus menjelaskan verba וַיַּעַל, bukan keterangan waktu “lebih dahulu.”
