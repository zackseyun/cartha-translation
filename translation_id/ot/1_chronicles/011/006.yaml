  naturalness: Bahasa baku dan alur naratifnya baik. “Naik lebih dahulu” tetap jelas dan cukup alami dalam konteks serangan terhadap kota berkubu. Penempatan penanda catatan kaki perlu dipindahkan agar tepat melekat pada kata atau frasa yang dijelaskan.
  terminology: “Orang Yebus,” “Yoab anak Zeruya,” “kepala,” dan “panglima” dapat dipertahankan. “Kepala” menjaga keterkaitan leksikal dengan רֹאשׁ pada kedua kemunculannya; alternatif yang lebih idiomatis dapat tetap disediakan dalam catatan kaki.
