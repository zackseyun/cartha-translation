  text: וַ/יֹּ֣אמֶר דָּוִ֔יד כָּל מַכֵּ֤ה יְבוּסִי֙ בָּ/רִ֣אשׁוֹנָ֔ה יִהְיֶ֥ה לְ/רֹ֖אשׁ וּ/לְ/שָׂ֑ר וַ/יַּ֧עַל בָּ/רִאשׁוֹנָ֛ה יוֹאָ֥ב בֶּן צְרוּיָ֖ה וַ/יְהִ֥י לְ/רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/006.yaml
  text: And David said[a], “Whoever strikes down a Jebusite first shall become chief and commander.” So Joab son of Zeruiah went up first[b], and he became chief.
translation:
  language: id
  text: Daud berkata, “Siapa pun yang lebih dahulu mengalahkan orang Yebus akan menjadi kepala[a] dan panglima.” Maka Yoab anak Zeruya naik[b] lebih dahulu, lalu ia menjadi kepala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan menjadi pemimpin dan panglima.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “naik”. Kata “naik” dalam konteks ini mungkin menggambarkan gerak mendaki ketika menyerbu kubu pertahanan.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל מַכֵּה יְבוּסִי
  choice: Siapa pun yang ... mengalahkan orang Yebus
  rationale: כָּל dengan bentuk partisip מַכֵּה berfungsi sebagai ungkapan relatif tak tentu, ‘siapa pun yang’. Dalam konteks militer, נכה dapat berarti memukul, menaklukkan, atau mengalahkan; ‘mengalahkan’ menyampaikan tindakan militer tanpa mempersempit maknanya menjadi pasti membunuh. Bentuk tunggal יְבוּסִי dipahami secara generik sebagai ‘orang Yebus’.
- source_word: בָּרִאשׁוֹנָה
  choice: lebih dahulu
  rationale: Bentuk adverbial ini menunjukkan prioritas dalam tindakan. ‘Lebih dahulu’ wajar dalam bahasa Indonesia dan cocok pada kedua kemunculannya.
- source_word: יִהְיֶה לְרֹאשׁ וּלְשָׂר
  choice: akan menjadi kepala dan panglima
  rationale: Konstruksi היה + ל menyatakan peralihan status, sehingga diterjemahkan ‘menjadi’. רֹאשׁ mempertahankan metafora kepemimpinan sebagai ‘kepala’, sedangkan שָׂר dalam konteks ini paling alami dipahami sebagai pejabat atau pemimpin militer, yaitu ‘panglima’.
- source_word: וַיַּעַל
  choice: maju
  rationale: עלה secara dasar berarti ‘naik’. Dalam konteks penyerbuan ke kubu pertahanan, kata ini menyatakan gerak maju yang mungkin sekaligus mendaki. ‘Maju’ alami dalam narasi militer, sementara catatan kaki mempertahankan nuansa harfiahnya.
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: Yoab anak Zeruya
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia, dan hubungan keturunan diterjemahkan langsung dengan ‘anak’.
- source_word: וַיְהִי לְרֹאשׁ
  choice: lalu ia menjadi kepala
  rationale: Terjemahan ini menggemakan רֹאשׁ dalam janji sebelumnya. Teks pada bagian ini hanya menyebut ‘kepala’, bukan pula ‘panglima’, sehingga gelar kedua tidak ditambahkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan pengulangan ‘lebih dahulu’ dan ‘kepala’ yang terdapat dalam teks Ibrani, sambil memakai ‘maju’ agar tindakan Yoab terbaca alami dalam konteks militer.
