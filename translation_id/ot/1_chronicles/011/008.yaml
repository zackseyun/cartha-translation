base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/008.yaml
  text: He built the city all around[a], from the Millo even to the surrounding area[b], and Joab restored the rest of the city.
translation:
  language: id
  text: Ia membangun kota itu di sekelilingnya, mulai dari Milo[a] sampai ke daerah sekitarnya, dan Yoab memulihkan bagian kota yang tersisa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Milo” adalah istilah topografis di Yerusalem yang arti tepatnya tidak pasti. Mungkin yang dimaksud adalah bangunan berteras atau timbunan tanah.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, kata Ibrani yang diterjemahkan “memulihkan” berarti “membuat hidup”; di sini tampaknya dipakai secara kiasan untuk memperbaiki atau membangun kembali bagian kota tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ia membangun
  rationale: Bentuk Qal wayyiqtol dari בנה menyatakan tindakan lampau dalam narasi. Subjeknya adalah Daud dari ayat sebelumnya; 'membangun kembali' akan menambahkan makna yang tidak dinyatakan secara eksplisit.
- source_word: הָעִיר
  choice: kota itu
  rationale: עִיר berarti 'kota'; bentuk definitnya menunjuk kepada kota Daud yang disebut dalam konteks sebelumnya.
- source_word: מִסָּבִיב
  choice: di sekelilingnya
  rationale: Ungkapan adverbial ini menunjukkan pembangunan mengitari kota. Bentuk pronominal membuat hubungan dengan 'kota itu' jelas dan alami dalam bahasa Indonesia.
- source_word: מִן הַמִּלּוֹא
  choice: mulai dari Milo
  rationale: מִלּוֹא dipertahankan sebagai nama tempat atau bangunan karena rujukan topografisnya tidak pasti. 'Mulai dari' secara alami menandai titik awal rentang.
- source_word: וְעַד הַסָּבִיב
  choice: sampai ke daerah sekitarnya
  rationale: Frasa Ibrani yang padat ini menunjukkan batas atau jangkauan pembangunan tanpa memaksakan arti teknis yang tidak pasti.
- source_word: וְיוֹאָב
  choice: dan Yoab
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: יְחַיֶּה
  choice: memulihkan
  rationale: Piel dari חיה secara harfiah berarti 'membuat hidup'; ketika objeknya kota, maknanya kemungkinan idiomatis, yaitu memperbaiki atau memulihkannya.
- source_word: אֶת שְׁאָר הָעִיר
  choice: bagian kota yang lain
  rationale: שְׁאָר menunjuk kepada bagian yang tersisa. Ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa bagian tersebut sama sekali tidak termasuk dalam pembangunan sebelumnya.
