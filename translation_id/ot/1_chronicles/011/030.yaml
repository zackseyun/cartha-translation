  yaml_path: translation/ot/1_chronicles/011/030.yaml
  text: Maharai the Netophathite[a], Heled son of Baanah the Netophathite;
translation:
  language: id
  text: Maharai, orang Netofa[a]; Heled anak Baana, orang Netofa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang berasal dari Netofa”; demikian juga pada penyebutan kedua.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהְרַי
  choice: Maharai
  rationale: Nama diri ditransliterasikan secara langsung sesuai bentuk Ibrani.
- source_word: הַנְּטֹפָתִי / הַנְּטוֹפָתִי
  choice: orang Netofa
  rationale: Kata sifat nisbah dengan kata sandang ini menunjukkan orang yang berasal dari Netofa. Ungkapan ini alami dalam bahasa Indonesia dan dipertahankan pada kedua kemunculannya.
- source_word: חֵלֶד
  choice: Heled
  rationale: Nama diri ditransliterasikan dari bahasa Ibrani.
- source_word: בֶּן
  choice: anak
  rationale: Padanan alami bagi hubungan ayah-anak dalam daftar nama; konteks menunjukkan arti 'anak laki-laki'.
- source_word: בַּעֲנָה
  choice: Baana
  rationale: Nama diri ditransliterasikan dari bahasa Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pengulangan “orang Netofa” dipertahankan agar struktur daftar Ibrani tetap terlihat dan sebutan kedua tetap melekat pada Baana, tanpa mengalihkannya secara diam-diam kepada Heled.
