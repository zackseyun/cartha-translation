  text: חָנָן֙ בֶּֽן מַעֲכָ֔ה וְ/יוֹשָׁפָ֖ט הַ/מִּתְנִֽי־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/043.yaml
  text: Hanan son of Maacah[a], and Joshaphat the Mithnite;
translation:
  language: id
  text: Hanan anak Maakha, dan Yosafat[a], orang Mitni;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk nama Ibrani di sini lebih pendek daripada bentuk lengkap Yehosafat yang terdapat di bagian lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנָן
  choice: Hanan
  rationale: Nama diri ditransliterasikan secara langsung ke dalam ejaan Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar nama ini, kata tersebut menyatakan hubungan keturunan; bentuk alami dalam bahasa Indonesia ialah “anak”.
- source_word: מַעֲכָה
  choice: Maakha
  rationale: Nama diri Ibrani ditransliterasikan; “kh” mewakili bunyi konsonan akhir yang tidak sama dengan “k” biasa.
- source_word: וְיוֹשָׁפָט
  choice: dan Yosafat
  rationale: Konjungsi diterjemahkan “dan”; nama ditransliterasikan sesuai bentuk Ibrani yang lebih pendek dalam ayat ini dan ejaan Indonesia yang alami.
- source_word: הַמִּתְנִי
  choice: orang Mitni
  rationale: Bentuk nisbah dengan kata sandang menunjukkan asal tempat atau hubungan kelompok. “Orang Mitni” mempertahankan identifikasi itu tanpa menentukan secara berlebihan apakah Mitni adalah tempat atau kaum.
