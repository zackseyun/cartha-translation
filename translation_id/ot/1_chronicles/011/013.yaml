source:
  edition: WLC
  text: הֽוּא הָיָ֨ה עִם דָּוִ֜יד בַּ/פַּ֣ס דַּמִּ֗ים וְ/הַ/פְּלִשְׁתִּים֙ נֶאֱסְפוּ שָׁ֣ם לַ/מִּלְחָמָ֔ה וַ/תְּהִ֛י חֶלְקַ֥ת הַ/שָּׂדֶ֖ה מְלֵאָ֣ה שְׂעוֹרִ֑ים וְ/הָ/עָ֥ם נָ֖סוּ מִ/פְּנֵ֥י פְלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/013.yaml
  text: He was with David at Pas-dammim[a], where the Philistines had gathered for battle. Now the plot of the field was full of barley[b], and the people fled from before the Philistines.
translation:
  language: id
  text: Ia bersama Daud di Pas-Damim[a], tempat orang Filistin telah berkumpul untuk berperang. Di sana ada sebidang ladang yang penuh dengan jelai, dan rakyat melarikan diri dari hadapan orang Filistin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pas-Damim adalah nama tempat. Bandingkan kisah sejajarnya dalam 1 Samuel 17:1, yang menyebut tempat itu Efes-Damim.
    reason: cross_reference
lexical_decisions:
- source_word: בַּפַּס דַּמִּים
  choice: di Pas-Damim
  rationale: Bentuk ini dipahami sebagai nama tempat dalam Tawarikh. Transliterasi mempertahankan fungsi nama diri tanpa mengubahnya menjadi tafsiran etimologis.
- source_word: נֶאֱסְפוּ
  choice: telah berkumpul
  rationale: Bentuk Nifal dari אסף di sini menyatakan bahwa orang Filistin berhimpun atau berkumpul; 'telah berkumpul' sesuai dengan hubungan waktunya terhadap adegan utama.
- source_word: לַמִּלְחָמָה
  choice: untuk berperang
  rationale: Ungkapan ini secara alami menyatakan tujuan mereka berkumpul, yakni untuk melakukan pertempuran.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: sebidang ladang
  rationale: חלקה menunjuk pada bagian atau petak tanah tertentu; 'sebidang ladang' alami dalam bahasa Indonesia dan tetap konkret.
- source_word: מְלֵאָה שְׂעוֹרִים
  choice: penuh dengan jelai
  rationale: Teks Ibrani secara khusus menyebut jelai, sehingga tidak digeneralisasi menjadi gandum atau biji-bijian.
- source_word: וְהָעָם
  choice: dan rakyat
  rationale: עם secara langsung berarti rakyat atau orang banyak. Konteks mungkin menunjuk pada pasukan Israel, tetapi terjemahan tidak mempersempit rujukannya secara pasti.
- source_word: נָסוּ מִפְּנֵי פְלִשְׁתִּים
  choice: melarikan diri dari hadapan orang Filistin
  rationale: Pilihan ini mempertahankan citra idiom Ibrani מִפְּנֵי sambil tetap jelas sebagai tindakan mundur atau lari menghadapi musuh.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama tempat ditransliterasikan; istilah pertanian dibuat spesifik sesuai teks sumber. Ungkapan 'dari hadapan' dipertahankan untuk mencerminkan idiom Ibrani tanpa mengaburkan maknanya.
