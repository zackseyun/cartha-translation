lexical_decisions:
- source_word: סִבְּכַי
  choice: Sibkhai
  rationale: Nama diri ditransliterasikan secara langsung dari bentuk Ibrani; ejaan ini mencerminkan konsonan dan bunyi nama itu secara wajar dalam bahasa Indonesia.
- source_word: הַחֻשָׁתִי
  choice: orang Husa
  rationale: Sebutan asal atau kekerabatan dengan artikel; bentuk alami dalam bahasa Indonesia ialah 'orang Husa', yang mempertahankan nama dasarnya tanpa akhiran gentilik asing.
- source_word: עִילַי
  choice: Ilai
  rationale: Nama diri ditransliterasikan dari teks Ibrani pasal ini, yang mendukung bentuk Ilai, bukan Irai.
- source_word: הָאֲחוֹחִי
  choice: orang Ahohi
  rationale: Sebutan kaum atau keturunan diterjemahkan dengan pola Indonesia 'orang Ahohi', sambil mempertahankan nama kelompoknya.
