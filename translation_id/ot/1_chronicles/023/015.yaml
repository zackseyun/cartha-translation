  text: 'The sons of Moses: Gershom and Eliezer.'
translation:
  language: id
  text: Anak-anak Musa ialah Gersom dan Eliezer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruksi dari בֵּן memperkenalkan daftar silsilah dan di sini menunjuk langsung kepada dua anak laki-laki Musa. Dalam bahasa Indonesia, "anak-anak Musa" alami dan cukup tepat dalam konteks ini.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Nama diri ini memakai bentuk baku yang lazim dalam bahasa Indonesia.
- source_word: גֵּרְשֹׁם
  choice: Gersom
  rationale: Nama diri ini ditransliterasikan dengan bentuk Indonesia yang lazim untuk putra Musa, serta dibedakan dari Gerson, nama lain yang mirip.
- source_word: וֶ/אֱלִיעֶזֶר
  choice: dan Eliezer
  rationale: Konjungsi ו diterjemahkan secara aditif sebagai "dan"; אֱלִיעֶזֶר memakai bentuk nama Indonesia yang lazim, Eliezer, dan tidak disamakan dengan Eleazar.
