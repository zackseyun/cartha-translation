lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן. Dalam konteks silsilah ini, terjemahan langsung “anak-anak” mempertahankan bentuk sumber dan tetap wajar dalam bahasa Indonesia.
- source_word: יִצְהָר
  choice: Yizhar
  rationale: Nama diri ditransliterasikan menurut pola yang mendekati bentuk Ibrani dan lazim dipahami dalam konteks Alkitab bahasa Indonesia.
- source_word: שְׁלֹמִית
  choice: Selomit
  rationale: Nama diri ditransliterasikan dalam bentuk yang alami dan lazim dalam bahasa Indonesia.
- source_word: הָרֹאשׁ
  choice: sang kepala
  rationale: Kata רֹאשׁ dengan artikel dapat menunjukkan orang yang berkedudukan sebagai kepala atau pemimpin. “Sang kepala” mempertahankan citra leksikal sumber sekaligus berfungsi sebagai sebutan kedudukan; kemungkinan arti “yang pertama” dicatat dalam catatan kaki.
