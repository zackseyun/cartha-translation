translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan sesuai gaya daftar silsilah. Penanda “sang” membuat “kepala” terbaca sebagai sebutan bagi seseorang, bukan anggota tubuh, tanpa menghilangkan ambiguitas antara kedudukan dan urutan.
