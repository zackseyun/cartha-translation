  text: וּ/בְנֵ֣י שִׁמְעִ֔י יַ֣חַת זִינָ֔א וִ/יע֖וּשׁ וּ/בְרִיעָ֑ה אֵ֥לֶּה בְנֵי שִׁמְעִ֖י אַרְבָּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/010.yaml
  text: 'And the sons of Shimei: Jahath[a], Zina, Jeush, and Beriah. These were the sons of Shimei—four.'
translation:
  language: id
  text: Anak-anak Simei ialah Yahat, Zina[a], Yeush, dan Beria. Mereka inilah keempat anak Simei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian terjemahan memakai nama “Ziza” (bandingkan 1 Tawarikh 23:11); teks Ibrani di sini berbunyi “Zina”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעִי
  choice: Anak-anak Simei ialah
  rationale: Kata penghubung וּ berfungsi sebagai pengait dalam daftar dan tidak perlu dinyatakan secara kaku dalam bahasa Indonesia. Bentuk konstruksi בְנֵי שִׁמְעִי diterjemahkan secara langsung sebagai 'anak-anak Simei'; 'ialah' melengkapi klausa nominal secara alami.
- source_word: יַחַת
  choice: Yahat
  rationale: Nama Ibrani ditransliterasikan menurut bunyi sumber ke dalam ejaan Indonesia.
- source_word: זִינָא
  choice: Zina
  rationale: Bentuk teks Ibrani pada ayat ini adalah זִינָא, yang mendukung 'Zina'. Perbedaan dengan bentuk nama pada ayat 11 dicatat dalam catatan kaki tanpa mengubah teks utama.
- source_word: וִיעוּשׁ
  choice: Yeush
  rationale: Nama ditransliterasikan dari Ibrani; konjungsi prefiks dinyatakan melalui susunan daftar bahasa Indonesia.
- source_word: וּבְרִיעָה
  choice: dan Beria
  rationale: Nama ditransliterasikan sebagai 'Beria', sedangkan konjungsi וּ diterjemahkan 'dan' untuk menutup daftar secara alami.
- source_word: אֵלֶּה בְנֵי שִׁמְעִי אַרְבָּעָה
  choice: Mereka inilah keempat anak Simei
  rationale: Ungkapan ini mempertahankan penegasan אֵלֶּה dan rangkuman jumlah empat, sekaligus memakai susunan yang wajar dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat, sesuai gaya daftar silsilah. Nama-nama ditransliterasikan langsung dari bentuk Ibrani, bukan melalui bentuk konvensional Inggris.
