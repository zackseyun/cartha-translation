base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/011.yaml
  text: Jahath was the first and Zizah the second[a]; Jeush and Beriah did not have many sons[b], so they became one father’s house for one reckoning.
translation:
  language: id
  text: Yahat adalah yang pertama dan Ziza yang kedua[a]. Yeush dan Beria tidak mempunyai banyak anak laki-laki, sehingga mereka menjadi satu kaum keluarga yang dihitung sebagai satu unit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Ziza juga dapat ditransliterasikan sebagai “Zizah”.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “menjadi satu keluarga pihak ayah untuk satu pencatatan.” Maksudnya, mereka dicatat bersama sebagai satu kelompok keluarga menurut garis ayah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יַחַת הָרֹאשׁ
  choice: Yahat adalah yang pertama
  rationale: Dalam daftar berurutan yang dilanjutkan dengan ‘yang kedua’, הָרֹאשׁ paling wajar menyatakan urutan pertama, bukan semata-mata jabatan kepala.
- source_word: וְזִיזָה הַשֵּׁנִי
  choice: dan Ziza yang kedua
  rationale: Nama Ibrani ditransliterasikan secara wajar ke dalam bahasa Indonesia, sedangkan ordinalnya dipertahankan.
- source_word: וִיעוּשׁ וּבְרִיעָה
  choice: Yeus dan Beria
  rationale: Nama-nama diri ditransliterasikan sesuai pola ejaan Indonesia yang mudah dibaca.
- source_word: לֹא הִרְבּוּ בָנִים
  choice: tidak mempunyai banyak anak laki-laki
  rationale: Ungkapan harfiahnya ‘tidak memperbanyak anak-anak laki-laki’; terjemahan ini idiomatis dan tetap mempertahankan acuan khusus kepada anak laki-laki dalam בָנִים.
- source_word: וַיִּהְיוּ לְבֵית אָב
  choice: sehingga mereka menjadi satu kaum keluarga
  rationale: וַיִּהְיוּ menyatakan keadaan yang dihasilkan oleh sedikitnya anak laki-laki. בֵּית אָב adalah istilah kekerabatan bagi kelompok keluarga menurut garis ayah; ‘kaum keluarga’ lebih alami daripada terjemahan harfiah ‘rumah ayah’.
- source_word: לִפְקֻדָּה אֶחָת
  choice: yang dihitung sebagai satu unit
  rationale: Dalam konteks penataan orang Lewi, פְּקֻדָּה dapat menunjuk pada pencatatan atau penghitungan administratif. Pilihan ini menyampaikan bahwa kedua cabang diperlakukan bersama sebagai satu kesatuan tanpa mengartikannya sebagai sekadar tugas.
