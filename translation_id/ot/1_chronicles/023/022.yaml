  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֨מָת֙ אֶלְעָזָ֔ר וְ/לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וַ/יִּשָּׂא֥וּ/ם בְּנֵי קִ֖ישׁ אֲחֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/022.yaml
  text: Eleazar died and had no sons[a], but only daughters; and the sons of Kish, their brothers[b], married them.
translation:
  language: id
  text: Eleazar meninggal tanpa mempunyai anak laki-laki, melainkan hanya anak-anak perempuan. Putra-putra Kish, saudara-saudara mereka[a], memperistri mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks silsilah ini, “saudara-saudara mereka” kemungkinan berarti kerabat laki-laki dekat dari garis keluarga yang berkaitan, bukan harus saudara kandung.
    reason: cultural_note
  - marker: b
    text: 'Secara lebih harfiah: “mengambil mereka menjadi istri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: meninggal
  rationale: Kata kerja מות berarti ‘mati’. ‘Meninggal’ merupakan ungkapan Indonesia yang langsung, wajar, dan tetap bermartabat.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְלֹא הָיוּ לוֹ בָּנִים
  choice: tanpa mempunyai anak laki-laki
  rationale: Dalam pertentangannya dengan ‘anak-anak perempuan’, בָּנִים secara khusus berarti anak laki-laki, bukan anak-anak secara umum. Susunan ini mengalihkan idiom Ibrani ‘tidak ada padanya’ ke dalam bahasa Indonesia yang alami.
- source_word: כִּי אִם בָּנוֹת
  choice: melainkan hanya anak-anak perempuan
  rationale: 'Ungkapan כִּי אִם menyatakan pengecualian sekaligus pertentangan: Eleazar tidak mempunyai anak laki-laki, hanya anak perempuan.'
- source_word: וַיִּשָּׂאוּם
  choice: memperistri mereka
  rationale: Kata נשׂא dengan perempuan sebagai objek dalam konteks ini berarti mengambil mereka dalam perkawinan. ‘Memperistri’ menyampaikan makna itu secara ringkas dan alami.
- source_word: בְּנֵי קִישׁ
  choice: Putra-putra Kish
  rationale: Bentuk konstruksi ini secara langsung berarti para putra Kish. ‘Putra-putra’ mempertahankan corak silsilah kitab Tawarikh dan menghindari kemungkinan bahwa ‘anak-anak’ dipahami mencakup perempuan.
- source_word: אֲחֵיהֶם
  choice: saudara-saudara mereka
  rationale: Terjemahan ini mempertahankan arti paling langsung dari bentuk Ibrani, sambil membiarkan catatan kaki menjelaskan bahwa dalam konteks silsilah istilah tersebut dapat menunjuk kerabat laki-laki dalam kaum mereka.
