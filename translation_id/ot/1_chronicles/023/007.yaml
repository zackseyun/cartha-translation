lexical_decisions:
- source_word: לַגֵּרְשֻׁנִּי
  choice: Dari keturunan Gerson
  rationale: Bentuk nisbah dengan prefiks ל berfungsi sebagai judul kategori dalam daftar orang Lewi. Ungkapan “keturunan Gerson” menyampaikan makna kolektifnya secara alami dalam bahasa Indonesia.
- source_word: לַעְדָּן
  choice: Ladan
  rationale: Nama diri ini ditransliterasikan, bukan diterjemahkan. Bentuk “Ladan” jelas dan lazim untuk pembaca Indonesia; varian “Laadan” dicatat dalam catatan kaki.
- source_word: וְשִׁמְעִי
  choice: dan Simei
  rationale: Konjungsi ו diterjemahkan “dan”, sedangkan nama diri שִׁמְעִי ditransliterasikan sebagai “Simei”, bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
