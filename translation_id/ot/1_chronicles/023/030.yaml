  text: וְ/לַ/עֲמֹד֙ בַּ/בֹּ֣קֶר בַּ/בֹּ֔קֶר לְ/הֹד֥וֹת וּ/לְ/הַלֵּ֖ל לַ/יהוָ֑ה וְ/כֵ֖ן לָ/עָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/030.yaml
  text: and to stand every morning to give thanks and to praise Yahweh[a], and likewise at evening,
translation:
  language: id
  text: dan untuk berdiri setiap pagi[a] guna mengucap syukur dan memuji Yahweh, demikian juga pada waktu petang,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “pagi demi pagi,” yang menyatakan tugas rutin setiap hari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/עֲמֹד
  choice: dan untuk berdiri
  rationale: Infinitif עמד menyatakan tugas atau tujuan dalam konteks pelayanan yang ditetapkan; “berdiri” mempertahankan gambaran konkret dari teks Ibrani tanpa mempersempitnya menjadi “melayani”.
- source_word: בַּ/בֹּקֶר בַּ/בֹּקֶר
  choice: setiap pagi
  rationale: Pengulangan kata “pagi” bersifat distributif dan menyatakan kewajiban yang dilakukan secara teratur setiap hari. “Setiap pagi” alami dalam bahasa Indonesia modern.
- source_word: לְ/הֹדֹות
  choice: guna mengucap syukur
  rationale: Dalam konteks ibadah, bentuk Hifil dari ידה lazim berarti mengucap syukur; pilihan ini juga selaras dengan tindakan “memuji” yang mengikutinya.
- source_word: וּ/לְ/הַלֵּל
  choice: dan memuji
  rationale: Bentuk Piel dari הלל secara langsung menyatakan tindakan memuji. Terjemahan ini tidak menambahkan unsur bernyanyi yang tidak dinyatakan secara eksplisit.
- source_word: לַ/יהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה diterjemahkan sebagai “Yahweh” untuk mempertahankan nama diri yang terdapat langsung dalam teks sumber.
- source_word: וְ/כֵן
  choice: demikian juga
  rationale: Ungkapan ini menghubungkan tugas pada waktu petang dengan tindakan yang sama pada pagi hari.
- source_word: לָ/עָרֶב
  choice: pada waktu petang
  rationale: Frasa ini menunjukkan waktu petang sebagai pasangan dari tugas rutin pada pagi hari; bentuk ini wajar dan tetap bernada formal dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar, sedangkan “Yehuwa” mencerminkan pelafalan tradisional yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan ayat dipertahankan sebagai kelanjutan kalimat dari konteks sebelumnya; koma penutup mencerminkan bahwa ayat ini merupakan bagian dari rangkaian tugas.
