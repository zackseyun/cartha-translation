  text: For by the last words of David[a], the sons of Levi were numbered from twenty years old and upward.
translation:
  language: id
  text: Sebab, berdasarkan perkataan terakhir Daud,[a] keturunan Lewi dihitung mulai dari usia dua puluh tahun ke atas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menurut perkataan terakhir Daud.” Preposisi Ibrani dapat menunjukkan bahwa penghitungan ini dilakukan berdasarkan arahan terakhir Daud.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ayat ini sebagai penjelasan bagi pernyataan sebelumnya.
- source_word: בְדִבְרֵי דָוִיד הָאַחֲרֹנִים
  choice: berdasarkan perkataan-perkataan terakhir Daud
  rationale: Preposisi בְּ dapat menyatakan dasar atau patokan. Ungkapan ini secara alami menunjuk pada arahan terakhir Daud, tetapi terjemahan mempertahankan istilah umum 'perkataan-perkataan' agar tidak mempersempit maknanya.
- source_word: הֵמָּה מִסְפַּר
  choice: dihitung
  rationale: Ungkapan Ibrani bersifat eliptis dan dalam konteks menyatakan bahwa kelompok tersebut dimasukkan dalam penghitungan.
- source_word: בְּנֵי לֵוִי
  choice: keturunan Lewi
  rationale: Dalam konteks korporat dan genealogis, frasa ini merujuk kepada orang-orang dari garis keturunan Lewi; 'keturunan Lewi' lebih alami daripada 'anak-anak Lewi' dalam bahasa Indonesia modern.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וּלְמָעְלָה
  choice: mulai dari yang berumur dua puluh tahun ke atas
  rationale: Menyampaikan rumusan usia Ibrani dengan jelas dan alami, termasuk semua orang yang berusia dua puluh tahun atau lebih.
