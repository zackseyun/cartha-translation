  text: וְ/גַ֖ם לַ/לְוִיִּ֑ם אֵין לָ/שֵׂ֧את אֶת הַ/מִּשְׁכָּ֛ן וְ/אֶת כָּל כֵּלָ֖י/ו לַ/עֲבֹדָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/026.yaml
  text: And also[a], the Levites no longer need to carry the tabernacle and all its utensils for its service.
translation:
  language: id
  text: Dan orang Lewi juga tidak perlu lagi[a] mengangkut Kemah Suci dan segala perlengkapannya untuk pelayanan di Kemah Suci itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak ada lagi keperluan bagi orang Lewi untuk mengangkut Kemah Suci dan segala perlengkapannya untuk pelayanan di Kemah Suci itu.”'
    reason: Alternatif ini mempertahankan bentuk konstruksi Ibrani yang lebih impersonal, sedangkan teks utama menyampaikan maknanya secara lebih alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: וְגַם
  choice: Dan ... juga
  rationale: Mempertahankan baik daya penghubung וְ maupun daya penambahan גַם dalam susunan bahasa Indonesia yang alami.
- source_word: לַלְוִיִּם
  choice: orang Lewi
  rationale: Prefiks ל menandai pihak yang berkepentingan dalam konstruksi eksistensial negatif; dalam bahasa Indonesia, frasa ini paling wajar dijadikan pokok klausa.
- source_word: אֵין לָשֵׂאת
  choice: tidak perlu lagi mengangkut
  rationale: Konstruksi ini menyatakan bahwa tindakan mengangkut tidak lagi diperlukan, bukan larangan moral. Kata 'lagi' tersirat dari konteks menetapnya Kemah Suci dan penataan kembali tugas orang Lewi.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Istilah yang jelas dan lazim bagi tempat kediaman ibadah Israel dalam konteks ini.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: serta segala perlengkapannya
  rationale: כֵּלִים mencakup berbagai benda, perkakas, dan peralatan yang terkait dengan Kemah Suci; 'segala perlengkapannya' mempertahankan cakupan כָּל dan terdengar alami.
- source_word: לַעֲבֹדָתוֹ
  choice: untuk pelayanannya
  rationale: Akhiran pronominal tunggal maskulin paling wajar merujuk kepada Kemah Suci; terjemahan ini mempertahankan hubungan tersebut tanpa menjabarkannya secara berlebihan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Kemah Suci' dipilih sebagai istilah yang akrab, sedangkan 'perlengkapan' menjaga keluasan makna tanpa memberi kesan hanya alat makan atau bejana.
