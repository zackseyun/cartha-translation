base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/017.yaml
  text: 'The sons of Eliezer: Rehabiah was the chief[a], and Eliezer had no other sons; but the sons of Rehabiah became very many.'
translation:
  language: id
  text: 'Anak-anak Eliezer: Rehabya adalah yang utama[a]. Eliezer tidak mempunyai anak laki-laki lain, tetapi anak-anak Rehabya bertambah banyak sekali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: kepala; atau: yang pertama.'
    reason: Kata Ibrani dapat menunjuk pada orang yang utama atau kepala, dan dalam rumus silsilah juga dapat dipahami sebagai yang pertama.
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי אֱלִיעֶזֶר
  choice: 'Anak-anak Eliezer:'
  rationale: Rumus silsilah ini disajikan sebagai pengantar daftar agar alami dalam bahasa Indonesia, sambil mempertahankan bentuk jamak dari teks Ibrani meskipun hanya satu nama disebutkan.
- source_word: רְחַבְיָה
  choice: Rehabya
  rationale: Nama diri ditransliterasikan dalam bentuk yang wajar bagi pembaca bahasa Indonesia.
- source_word: הָרֹאשׁ
  choice: adalah yang terutama
  rationale: Istilah ini dapat menyatakan orang yang utama, kepala, atau yang pertama. Pilihan ini mempertahankan nuansa kedudukan tanpa menentukan jabatan khusus yang tidak dinyatakan teks.
- source_word: וְלֹא הָיָה לֶאֱלִיעֶזֶר בָּנִים אֲחֵרִים
  choice: Eliezer tidak mempunyai anak laki-laki lain
  rationale: Konstruksi keberadaan-kepunyaan Ibrani diterjemahkan secara idiomatis dan menjelaskan bahwa yang dimaksud dengan בָּנִים adalah anak laki-laki.
- source_word: וּבְנֵי רְחַבְיָה
  choice: tetapi keturunan Rehabya
  rationale: Kata hubung diterjemahkan 'tetapi' untuk menampilkan kontras dengan kenyataan bahwa Eliezer tidak mempunyai anak laki-laki lain. 'Keturunan' lebih alami karena kelompok ini berkembang lintas generasi.
- source_word: רָבוּ לְמָעְלָה
  choice: bertambah banyak sekali
  rationale: Gabungan verba yang menyatakan pertambahan dan unsur penguat diterjemahkan sebagai peningkatan jumlah yang sangat besar.
