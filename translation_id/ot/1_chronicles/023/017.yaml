  naturalness: “Anak-anak Eliezer” dan “tidak mempunyai anak laki-laki lain” alami dalam bahasa Indonesia modern. “Yang utama” lebih idiomatis daripada “yang terutama” dalam fungsi predikatif di sini.
  terminology: Transliterasi “Eliezer” dan “Rehabya” konsisten. Catatan untuk הָרֹאשׁ dengan tepat mempertahankan kemungkinan makna “kepala” dan “yang pertama,” tanpa menetapkan salah satunya secara berlebihan.
