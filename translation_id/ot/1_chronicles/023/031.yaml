base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/031.yaml
  text: and for all the burnt offerings offered to Yahweh on the Sabbaths[a], at the new moons, and at the appointed feasts, by number according to the ordinance concerning them, continually before Yahweh.
translation:
  language: id
  text: dan untuk mempersembahkan semua kurban bakaran kepada Yahweh pada hari-hari Sabat, pada perayaan-perayaan bulan baru, dan pada hari-hari raya yang ditetapkan, menurut jumlah, sesuai dengan ketentuan yang berlaku bagi semuanya itu, secara tetap di hadapan Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְכֹל הַעֲלוֹת עֹלוֹת
  choice: dan untuk mempersembahkan semua kurban bakaran
  rationale: Rangkaian infinitif הַעֲלוֹת dan nomina עֹלוֹת menyatakan tindakan mempersembahkan kurban bakaran. Rumusan ini alami dalam bahasa Indonesia sekaligus mempertahankan cakupan כֹל.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל dalam konteks kurban menunjukkan pihak yang menerima persembahan; nama ilahi יהוה ditransliterasikan sebagai Yahweh.
- source_word: לַשַּׁבָּתוֹת
  choice: pada hari-hari Sabat
  rationale: Bentuk jamak menunjuk pada kesempatan Sabat yang berulang; 'pada' menyatakan waktu pelaksanaan.
- source_word: לֶחֳדָשִׁים
  choice: pada perayaan-perayaan bulan baru
  rationale: Dalam rangkaian kalender ibadah, חֳדָשִׁים menunjuk pada perayaan bulan baru, bukan sekadar bulan-bulan kalender.
- source_word: וְלַמּוֹעֲדִים
  choice: dan pada hari-hari raya yang ditetapkan
  rationale: מוֹעֲדִים di sini adalah waktu-waktu raya yang telah ditetapkan dalam kalender ibadah.
- source_word: בְּמִסְפָּר כְּמִשְׁפָּט עֲלֵיהֶם
  choice: sesuai dengan jumlah dan ketentuan bagi masing-masing perayaan itu
  rationale: Frasa tersebut menunjukkan bahwa jumlah kurban mengikuti peraturan yang berlaku bagi setiap kesempatan yang baru disebutkan; 'masing-masing' memperjelas rujukan jamak tanpa menentukan rincian di luar teks.
- source_word: תָּמִיד
  choice: secara tetap
  rationale: Dalam konteks pelayanan ibadah, kata ini menekankan keteraturan yang terus berlangsung, bukan tindakan tanpa jeda.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Terjemahan langsung dan alami bagi ungkapan kultis yang menyatakan pelayanan dalam hadirat Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani mencantumkan nama perjanjian יהוה; bentuk 'Yahweh' mempertahankan nama tersebut secara langsung.
- issue: Rujukan עֲלֵיהֶם dalam ketentuan kurban
  choice: bagi masing-masing perayaan itu
  alternative: mengenai semuanya itu
  rationale: Konteks terdekat adalah tiga jenis kesempatan kalender, masing-masing dengan jumlah kurban yang ditentukan. Namun, frasa Ibrani dapat pula mencakup kurban-kurban tersebut; pilihan ini menjaga maksud praktis tanpa menambahkan rincian teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kurban bakaran' dipakai sebagai istilah ibadah yang mudah dipahami; pengulangan bentuk jamak dipertahankan untuk mencerminkan kalender ibadah yang berulang.
