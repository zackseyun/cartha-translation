  text: And as for Moses, the man of God, his sons were counted among the tribe of Levi.
translation:
  language: id
  text: Adapun Musa, abdi Allah itu, anak-anaknya terhitung dalam suku Lewi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan Ibrani ini secara harfiah berarti “orang Allah”, tetapi dalam pemakaian alkitabiah merupakan sebutan bagi seseorang yang mengabdi kepada Allah; “abdi Allah” menyampaikan gelar tersebut secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: יִקָּרְאוּ עַל שֵׁבֶט הַלֵּוִי
  choice: terhitung dalam suku Lewi
  rationale: Secara harfiah, bentuk ini dapat berarti “disebut/didaftarkan menurut suku Lewi”. Dalam konteks pembagian dan pencatatan orang Lewi, “terhitung dalam” menyatakan afiliasi genealogis-administratif tanpa menyiratkan bahwa mereka baru dipanggil masuk ke suku itu.
theological_decisions:
- issue: Status anak-anak Musa dalam suku Lewi
  choice: terhitung dalam suku Lewi
  alternative: disebut menurut suku Lewi
  rationale: Terjemahan ini mempertahankan pokok teks bahwa keturunan Musa dicatat sebagai bagian dari Lewi, bukan diberi kedudukan kesukuan tersendiri, tanpa menambahkan kesimpulan teologis di luar ayat.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. “Adapun” mempertahankan penonjolan topik pada וּמֹשֶׁה, sedangkan susunan “abdi Allah itu” menandai ungkapan tersebut sebagai aposisi bagi Musa.
