  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י מַעֲמָדָ֞/ם לְ/יַד בְּנֵ֣י אַהֲרֹ֗ן לַ/עֲבֹדַת֙ בֵּ֣ית יְהוָ֔ה עַל הַ/חֲצֵרוֹת֙ וְ/עַל הַ/לְּשָׁכ֔וֹת וְ/עַֽל טָהֳרַ֖ת לְ/כָל קֹ֑דֶשׁ וּ/מַֽעֲשֵׂ֔ה עֲבֹדַ֖ת בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/028.yaml
  text: For their duty was to assist the sons of Aaron in the service of the house of Yahweh, concerning the courts and the chambers, and the purification of all that is holy, and the work of the service of the house of God.
translation:
  language: id
  text: Sebab tugas mereka[a] adalah membantu[b] anak-anak Harun dalam pelayanan di rumah Yahweh, berkenaan dengan pelataran-pelataran dan kamar-kamar, pentahiran segala sesuatu yang kudus[c], serta pekerjaan pelayanan di rumah Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kedudukan mereka” atau “jabatan mereka”.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “di sisi anak-anak Harun”, yaitu melayani bersama atau membantu mereka.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “pentahiran setiap benda kudus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan ayat ini dengan penetapan tugas orang Lewi dalam konteks sebelumnya.
- source_word: מַעֲמָדָם
  choice: tugas mereka
  rationale: Dalam konteks pembagian pelayanan, kata ini menunjuk pada kedudukan atau penugasan yang ditetapkan; 'tugas mereka' paling jelas dan alami dalam bahasa Indonesia.
- source_word: לְיַד בְּנֵי אַהֲרֹן
  choice: membantu keturunan Harun
  rationale: Ungkapan harfiahnya 'di sisi/tangan anak-anak Harun' dan di sini menyatakan peran pendukung, tanpa harus menegaskan hubungan kewenangan yang lebih kuat daripada teks.
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: dalam pelayanan di rumah Yahweh
  rationale: עֲבֹדָה menunjuk pada pelayanan peribadatan, sedangkan 'rumah Yahweh' mempertahankan sebutan bagi Bait Allah dan nama ilahi dalam teks.
- source_word: עַל הַחֲצֵרוֹת וְעַל הַלְּשָׁכוֹת
  choice: berkenaan dengan pelataran-pelataran dan kamar-kamar
  rationale: עַל memperkenalkan bidang tanggung jawab. 'Berkenaan dengan' mempertahankan cakupan makna tanpa secara berlebihan menyiratkan kekuasaan atas tempat-tempat itu.
- source_word: וְעַל טָהֳרַת לְכָל קֹדֶשׁ
  choice: pentahiran segala sesuatu yang kudus
  rationale: Mempertahankan gagasan kemurnian ritual dan cakupan kolektif קֹדֶשׁ tanpa menentukan benda tertentu yang tidak disebutkan teks.
- source_word: וּמַעֲשֵׂה עֲבֹדַת בֵּית הָאֱלֹהִים
  choice: serta pekerjaan pelayanan di rumah Allah
  rationale: Menjaga kedua unsur, 'pekerjaan' dan 'pelayanan', dalam susunan yang tetap wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Hubungan orang Lewi dengan para imam keturunan Harun dalam לְיַד בְּנֵי אַהֲרֹן
  choice: membantu keturunan Harun
  alternative: berada di bawah wewenang keturunan Harun
  rationale: '''Membantu'' menyatakan peran pendukung yang tampak dalam idiom tersebut tanpa memasukkan klaim hierarkis yang lebih tegas daripada bunyi teks.'
- issue: Cakupan frasa לְכָל קֹדֶשׁ
  choice: segala sesuatu yang kudus
  alternative: setiap benda kudus
  rationale: Bentuk tunggal kolektif dapat mencakup segala hal yang kudus; terjemahan ini mempertahankan keluasan dan ambiguitas objeknya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan administratif yang sesuai dengan kitab Tawarikh. 'Pelataran' dan 'kamar' dipilih sebagai istilah arsitektural yang mudah dipahami; 'pentahiran' mempertahankan nuansa ritual. Semua penanda catatan kaki ditempatkan pada bagian teks yang relevan.
