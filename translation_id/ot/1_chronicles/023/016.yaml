  text: 'The sons of Gershom: Shebuel the chief[a].'
translation:
  language: id
  text: 'Anak-anak Gersom: Sebuel adalah kepala.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani juga dapat berarti “yang terutama” atau “pemimpin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן secara langsung memperkenalkan garis keturunan Gersom. Dalam daftar silsilah dan pembagian tugas ini, “anak-anak” mempertahankan bentuk sumber tanpa memperluasnya menjadi “keturunan.”
- source_word: גֵרְשׁוֹם
  choice: Gersom
  rationale: Nama diri ditransliterasikan menurut bentuk Ibrani גֵרְשׁוֹם dan ejaan Indonesia yang lazim; nama ini dibedakan dari Gershon.
- source_word: שְׁבוּאֵל
  choice: Sebuel
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia yang alami dan lazim.
- source_word: הָרֹאשׁ
  choice: kepala
  rationale: רֹאשׁ dengan kata sandang menyatakan kedudukan utama atau kepemimpinan dalam daftar organisasi. “Kepala” dekat dengan bentuk sumber dan tetap wajar sebagai sebutan jabatan dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa ringkas dan formal sesuai gaya daftar silsilah-organisasi. Klausa nominal Ibrani dibuat alami dalam bahasa Indonesia dengan menambahkan “adalah,” tanpa menentukan secara eksplisit kelompok yang dipimpin Sebuel.
