revisions:
- from: Anak-anak Amram ialah Harun dan Musa. Harun dipisahkan untuk dikuduskan sebagai yang mahakudus[a]—dia dan anak-anaknya untuk selama-lamanya—untuk membakar dupa di hadapan Yahweh, melayani-Nya, dan memberkati dalam nama-Nya untuk selama-lamanya.
  to: Anak-anak Amram ialah Harun dan Musa. Harun dipisahkan—dia dan anak-anaknya untuk selama-lamanya—untuk menguduskannya sebagai yang mahakudus, untuk membakar dupa di hadapan Yahweh, melayani-Nya, dan memberkati dalam nama-Nya untuk selama-lamanya.
  rationale: Revisi mempertahankan seluruh isi dan pengulangan teks sumber, tetapi mengganti infinitif pasif dengan “untuk menguduskannya” agar lebih dekat dengan Hifil aktif dan objek tunggal Ibrani. Sisipan tentang Harun dan anak-anaknya dipertahankan untuk menunjukkan bahwa garis imam itu berlangsung selama-lamanya dan menjalankan tugas-tugas yang disebutkan. Catatan kaki diringkas dan diperjelas.
