  text: בְּנֵ֥י עַמְרָ֖ם אַהֲרֹ֣ן וּ/מֹשֶׁ֑ה וַ/יִּבָּדֵ֣ל אַהֲרֹ֡ן לְֽ/הַקְדִּישׁ/וֹ֩ קֹ֨דֶשׁ קָֽדָשִׁ֤ים הֽוּא וּ/בָנָי/ו֙ עַד עוֹלָ֔ם לְ/הַקְטִיר֩ לִ/פְנֵ֨י יְהוָ֧ה לְ/שָׁרְת֛/וֹ וּ/לְ/בָרֵ֥ךְ בִּ/שְׁמ֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/013.yaml
  text: 'The sons of Amram: Aaron and Moses. And Aaron was set apart[a], he and his sons forever, to sanctify him as most holy, to burn incense before Yahweh, to minister to him, and to bless in his name forever.'
translation:
  language: id
  text: Anak-anak Amram ialah Harun dan Musa. Harun dipisahkan—dia dan anak-anaknya untuk selama-lamanya—untuk menguduskannya sebagai yang mahakudus, untuk membakar dupa di hadapan Yahweh, melayani-Nya, dan memberkati dalam nama-Nya untuk selama-lamanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי עַמְרָם
  choice: Anak-anak Amram
  rationale: Bentuk Ibrani secara langsung berarti ‘anak-anak lelaki Amram’; karena Harun dan Musa adalah anak langsung Amram, ungkapan sederhana ini paling tepat.
- source_word: וַיִּבָּדֵל
  choice: dipisahkan
  rationale: Bentuk nifal dari בדל menyatakan bahwa Harun dipisahkan atau dikhususkan bagi tugas khusus. ‘Dipisahkan’ mempertahankan gambaran dasar teks.
- source_word: לְהַקְדִּישׁוֹ
  choice: untuk dikuduskan
  rationale: Bentuk hifil dengan akhiran orang ketiga tunggal menunjuk pada tindakan menjadikan atau menetapkan ‘dia’ kudus; bentuk pasif Indonesia mengalir alami sesudah ‘Harun dipisahkan’ tanpa menghilangkan objek tunggalnya.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: yang mahakudus
  rationale: Susunan ‘kekudusan segala kekudusan’ berfungsi sebagai bentuk superlatif. Dalam konteks ini ungkapan tersebut menerangkan status Harun dan garis keimamannya, bukan nama ruang dalam tempat suci.
- source_word: הוּא וּבָנָיו
  choice: dia dan anak-anaknya
  rationale: Terjemahan ini mempertahankan kata ganti tunggal dan sebutan harfiah bagi anak-anak Harun, yang bersama dia membentuk garis imam.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan kelangsungan tetap dan berulang dua kali dalam ayat; pengulangan tersebut dipertahankan.
- source_word: לְהַקְטִיר
  choice: untuk membakar dupa
  rationale: Dalam konteks tugas imam, kata קטר lazim menunjuk pada pembakaran dupa, meskipun secara lebih luas dapat mencakup mempersembahkan sesuatu sebagai asap.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי menyatakan keberadaan atau tindakan di hadapan seseorang, sedangkan nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’.
- source_word: לְשָׁרְתוֹ
  choice: melayani-Nya
  rationale: שרת menunjuk pada pelayanan resmi, khususnya pelayanan imam. Akhiran tunggal paling wajar merujuk kepada Yahweh yang disebut tepat sebelumnya.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: dan memberkati dalam nama-Nya
  rationale: Ungkapan ini mempertahankan bahasa sumber mengenai berkat yang diucapkan dalam nama atau kewenangan Yahweh tanpa mempersempit nuansanya.
theological_decisions:
- issue: Rujukan akhiran tunggal dalam לְהַקְדִּישׁוֹ dan לְשָׁרְתוֹ
  choice: ‘untuk dikuduskan’ merujuk kepada Harun; ‘melayani-Nya’ merujuk kepada Yahweh
  alternative: Akhiran pertama dapat dipahami secara impersonal atau sebagai ‘menguduskan apa yang mahakudus’; akhiran kedua secara tata bahasa dapat saja dikaitkan dengan Harun.
  rationale: Harun adalah subjek terdekat sebelum infinitif pertama, sehingga dirinya paling alami menjadi pihak yang dikuduskan. Yahweh adalah rujukan terdekat sebelum infinitif pelayanan, dan pelayanan imam secara kontekstual ditujukan kepada-Nya.
- issue: Fungsi frasa קֹדֶשׁ קָדָשִׁים
  choice: 'predikat superlatif bagi Harun bersama garis keimamannya: ‘yang mahakudus’'
  alternative: ‘tempat mahakudus’ atau ‘benda-benda mahakudus’
  rationale: Tidak ada kata yang secara eksplisit berarti ‘tempat’ atau ‘benda-benda’. Susunan ayat mengaitkan ungkapan itu dengan Harun dan anak-anaknya, tetapi bentuk harfiahnya tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda pisah menandai sisipan ‘dia dan anak-anaknya untuk selama-lamanya’ agar hubungan sintaksis rangkaian tujuan tetap terbaca. Nama ilahi ditampilkan sebagai ‘Yahweh’; akhiran ‘-Nya’ membedakan pelayanan dan berkat yang diarahkan kepada-Nya.
