  text: מֵ/אֵ֗לֶּה לְ/נַצֵּ֨חַ֙ עַל מְלֶ֣אכֶת בֵּית יְהוָ֔ה עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָ֑לֶף וְ/שֹׁטְרִ֥ים וְ/שֹׁפְטִ֖ים שֵׁ֥שֶׁת אֲלָפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/004.yaml
  text: Of these, twenty-four thousand were to oversee the work of the house of Yahweh, and six thousand were officers and judges.
translation:
  language: id
  text: Dari antara mereka, dua puluh empat ribu orang ditugaskan untuk mengawasi pekerjaan di Rumah Yahweh, dan enam ribu orang menjadi pejabat dan hakim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: Dari antara mereka
  rationale: Ungkapan ini menyatakan sebagian dari kelompok orang Lewi yang disebut sebelumnya; bentuk ini alami dalam bahasa Indonesia dan mempertahankan makna partitif.
- source_word: לְנַצֵּחַ
  choice: ditugaskan untuk mengawasi
  rationale: Infinitif piel ini dalam konteks pembagian tugas menyatakan penugasan untuk memimpin atau mengawasi, bukan kepemimpinan musik.
- source_word: עַל מְלֶאכֶת בֵּית יְהוָה
  choice: pekerjaan di rumah Yahweh
  rationale: מְלָאכָה mencakup pekerjaan atau tugas secara luas, sedangkan בֵּית יְהוָה dipertahankan secara formal sebagai 'rumah Yahweh' tanpa mempersempitnya menjadi 'Bait Allah'.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: dua puluh empat ribu orang
  rationale: Bilangan diterjemahkan langsung dan 'orang' ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas bahwa angka itu menunjuk kepada anggota kelompok.
- source_word: וְשֹׁטְרִים
  choice: pengurus
  rationale: שֹׁטְרִים menunjuk kepada para pejabat yang menjalankan fungsi administratif. 'Pengurus' dapat dipahami pembaca modern dan tidak menyiratkan pangkat militer.
- source_word: וְשֹׁפְטִים
  choice: hakim
  rationale: Padanan langsung bagi mereka yang menjalankan fungsi pengadilan atau pemberian keputusan hukum.
- source_word: שֵׁשֶׁת אֲלָפִים
  choice: enam ribu orang
  rationale: Bilangan diterjemahkan langsung, dengan 'orang' untuk kejelasan dan kelancaran bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu secara langsung dan selaras dengan keputusan edisi POB.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan pembagian dua kelompok dan fungsi administratifnya.
