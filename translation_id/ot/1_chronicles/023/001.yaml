  edition: WLC
  text: וְ/דָוִ֥יד זָקֵ֖ן וְ/שָׂבַ֣ע יָמִ֑ים וַ/יַּמְלֵ֛ךְ אֶת שְׁלֹמֹ֥ה בְנ֖/וֹ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/001.yaml
  text: David was old and full of days[a], and he made his son Solomon king over Israel.
translation:
  language: id
  text: Daud telah tua dan lanjut usia[a]. Ia mengangkat Salomo, anaknya, menjadi raja atas Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tua dan kenyang dengan hari-hari,” yaitu telah mencapai umur yang panjang.
    reason: Menjelaskan idiom Ibrani dan mempertahankan akses pembaca kepada gambaran harfiahnya.
lexical_decisions:
- source_word: זָקֵן
  choice: sudah tua
  rationale: Bentuk qatal menyatakan keadaan Daud yang telah mencapai usia tua. “Sudah tua” alami dan ringkas dalam bahasa Indonesia.
- source_word: וְשָׂבַע יָמִים
  choice: dan lanjut umurnya
  rationale: Ungkapan Ibrani ini secara harfiah berarti “kenyang dengan hari-hari” dan menunjuk pada umur yang telah panjang. “Lanjut umurnya” menyampaikan maknanya secara wajar, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וַיַּמְלֵךְ
  choice: Ia mengangkat ... menjadi raja
  rationale: 'Bentuk Hifil dari מלך bersifat kausatif: Daud menjadikan atau menetapkan Salomo sebagai raja. “Mengangkat ... menjadi raja” mempertahankan daya kausatif tanpa menambahkan upacara penobatan yang tidak dinyatakan.'
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  choice: Salomo, anaknya
  rationale: Susunan ini mempertahankan identifikasi Salomo sebagai anak Daud dan terdengar alami dalam bahasa Indonesia.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Preposisi עַל dalam konteks pemerintahan menunjukkan lingkup kekuasaan, yaitu memerintah atas Israel. Kata “seluruh” tidak ditambahkan karena tidak terdapat dalam teks.
- source_word: וְ
  choice: tidak diterjemahkan sebagai kata penghubung tersendiri
  rationale: Waw awal berfungsi melanjutkan narasi. Dalam bahasa Indonesia modern, kesinambungan ini dapat tersirat dari konteks tanpa memulai ayat dengan “Dan” atau menambahkan penanda waktu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Ayat dibagi menjadi dua kalimat agar alurnya alami, tanpa mengubah hubungan naratif atau kausatif dalam teks Ibrani.
