  yaml_path: translation/ot/1_chronicles/023/021.yaml
  text: 'The sons of Merari: Mahli and Mushi. The sons of Mahli: Eleazar and Kish.'
translation:
  language: id
  text: Anak-anak Merari ialah Mahli dan Musi. Anak-anak Mahli ialah Eleazar dan Kish.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן yang memperkenalkan daftar silsilah. “Anak-anak” merupakan padanan langsung dan wajar dalam bahasa Indonesia; makna yang lebih luas seperti “keturunan” tidak diperlukan dalam konteks ini.
- source_word: מְרָרִי
  choice: Merari
  rationale: Nama diri yang dialihaksarakan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מַחְלִי
  choice: Mahli
  rationale: Nama diri yang dialihaksarakan. Nama ini muncul dua kali, pertama sebagai anak Merari dan kemudian dalam frasa “anak-anak Mahli”.
- source_word: וּמוּשִׁי
  choice: dan Musi
  rationale: Kata sambung yang diikuti nama diri. Bentuk “Musi” mengikuti penyesuaian ejaan yang wajar dalam bahasa Indonesia.
- source_word: בְּנֵי מַחְלִי
  choice: Anak-anak Mahli
  rationale: Judul silsilah kedua dalam ayat ini. Pengulangan “anak-anak” mempertahankan struktur Ibrani dan memperjelas hubungan keluarga.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Nama diri yang dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְקִישׁ
  choice: dan Kish
  rationale: Kata sambung yang diikuti nama diri; nama tersebut dipertahankan dalam bentuk transliterasi yang lazim.
