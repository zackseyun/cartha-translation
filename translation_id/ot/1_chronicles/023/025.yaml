id: 1CH.23.25
reference: 1 Chronicles 23:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֚י אָמַ֣ר דָּוִ֔יד הֵנִ֛יחַ יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל לְ/עַמּ֑/וֹ וַ/יִּשְׁכֹּ֥ן בִּ/ירוּשָׁלִַ֖ם עַד לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/025.yaml
  text: For David said[a], “Yahweh, the God of Israel, has given rest to his people, and he has dwelt in Jerusalem forever.”
translation:
  language: id
  text: Sebab Daud berkata, “Yahweh, Allah Israel, telah memberikan ketenteraman kepada umat-Nya dan tinggal[a] di Yerusalem untuk selama-lamanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “dan akan tinggal di Yerusalem untuk selama-lamanya.” Kata kerja Ibraninya dapat dipahami sebagai menyatakan kediaman Yahweh yang tetap dan berkelanjutan di sana.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi ketentuan pada konteks sebelumnya; “sebab” mempertahankan fungsi penjelasnya secara alami.
- source_word: אָמַר דָּוִיד
  choice: Daud berkata
  rationale: Bentuk lampau naratif ini diterjemahkan secara langsung dan wajar dalam bahasa Indonesia.
- source_word: הֵנִיחַ
  choice: telah memberikan ketenteraman
  rationale: Bentuk hifil dari נוח menyatakan tindakan membuat atau memberi keadaan tenteram dan aman; pilihan ini mempertahankan nuansa kausatif serta hasil yang masih relevan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Terjemahan konstruksi kepunyaan yang baku dan alami; frasa ini beraposisi dengan “Yahweh”.
- source_word: לְעַמּוֹ
  choice: kepada umat-Nya
  rationale: Preposisi ל menandai penerima atau pihak yang memperoleh ketenteraman.
- source_word: וַיִּשְׁכֹּן
  choice: dan tinggal
  rationale: Kata kerja שכן berarti “tinggal/berdiam”. Bentuk tanpa penanda waktu eksplisit dalam bahasa Indonesia menjaga keterbukaan antara keadaan menetap, tindakan yang telah terjadi, dan implikasi keberlanjutannya.
- source_word: בִּירוּשָׁלִַם
  choice: di Yerusalem
  rationale: Terjemahan lokatif langsung.
- source_word: עַד לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa batas; pilihan tersebut jelas, bermartabat, dan lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama diri.
- issue: Waktu dan sifat kediaman Yahweh di Yerusalem
  choice: dan tinggal di Yerusalem untuk selama-lamanya
  alternative: dan telah tinggal di Yerusalem untuk selama-lamanya; dan akan tinggal di Yerusalem untuk selama-lamanya
  rationale: Rangkaian verbal Ibrani dapat dipahami sebagai menyatakan kediaman yang telah ditetapkan dan terus berlangsung, atau sebagai kediaman yang akan berlangsung. Bentuk Indonesia “tinggal” tidak memaksakan waktu tertentu, sedangkan catatan kaki mempertahankan kemungkinan pembacaan futur.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam naratif yang lugas dan khidmat. “Ketenteraman” dipilih untuk menyampaikan bukan sekadar berhenti bekerja, melainkan keadaan aman dan tenteram yang diberikan kepada umat.
