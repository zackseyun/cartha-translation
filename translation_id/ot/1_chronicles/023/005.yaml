base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/005.yaml
  text: and four thousand gatekeepers[a], and four thousand praising Yahweh with the instruments that I made to praise him.
translation:
  language: id
  text: dan empat ribu penjaga pintu gerbang, serta empat ribu orang yang memuji Yahweh dengan alat-alat yang kubuat untuk memuji.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dengan alat-alat yang kubuat untuk memuji.” Frasa ini dapat dipahami sebagai alat-alat yang dibuat untuk memuji Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁעֲרִים
  choice: penjaga pintu gerbang
  rationale: Bentuk ini menunjuk kepada orang-orang yang ditugaskan menjaga gerbang. Ungkapan ini wajar dalam bahasa Indonesia dan sesuai dengan konteks pelayanan di kompleks Bait Allah.
- source_word: מְהַלְלִים
  choice: orang yang memuji
  rationale: Partisip Ibrani menyatakan fungsi atau kegiatan yang berlangsung. Bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה diterjemahkan sebagai nama diri 'Yahweh', selaras dengan bukti teks sumber dan lapisan konsultasi yang telah diaudit.
- source_word: בַּכֵּלִים
  choice: dengan alat-alat
  rationale: כֵּלִים dapat berarti perkakas, perlengkapan, atau alat. Konteks pujian mengisyaratkan alat musik, tetapi pilihan yang lebih luas ini mempertahankan cakupan leksikal teks Ibrani.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: yang kubuat
  rationale: Klausa relatif ini secara langsung menerangkan alat-alat tersebut; bentuk 'kubuat' mempertahankan orang pertama tunggal dan terdengar alami.
- source_word: לְהַלֵּל
  choice: untuk melantunkan pujian
  rationale: Infinitif ini menyatakan tujuan. Pilihan ini menghasilkan bahasa Indonesia yang alami tanpa menambahkan objek pronominal yang tidak dinyatakan secara eksplisit dalam frasa Ibrani terakhir.
- source_word: וְאַרְבַּעַת אֲלָפִים ... וְאַרְבַּעַת אֲלָפִים
  choice: dan empat ribu ... serta empat ribu
  rationale: Kedua jumlah dipertahankan untuk menunjukkan dua kelompok yang berbeda; 'serta' menghindari pengulangan yang kaku tanpa menghilangkan koordinasi teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Objek tersirat pada לְהַלֵּל
  choice: tidak menambahkan '-Nya' pada klausa tujuan terakhir
  alternative: untuk memuji-Nya
  rationale: Secara teologis dan kontekstual, pujian itu tertuju kepada Yahweh, tetapi bentuk Ibrani terakhir tidak menyatakan objek pronominal. Terjemahan utama mempertahankan ketidaktersuratannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah administratif 'penjaga pintu gerbang' dibuat jelas, sedangkan 'alat-alat' mempertahankan keluasan istilah Ibrani; konteks tetap menunjukkan bahwa yang dimaksud ialah alat untuk mengiringi pujian.
