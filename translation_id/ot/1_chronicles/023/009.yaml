source:
  edition: WLC
  text: בְּנֵ֣י שִׁמְעִ֗י שלמות וַ/חֲזִיאֵ֛ל וְ/הָרָ֖ן שְׁלֹשָׁ֑ה אֵ֛לֶּה רָאשֵׁ֥י הָ/אָב֖וֹת לְ/לַעְדָּֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/009.yaml
  text: 'The sons of Shimei: Shelomoth[a], Haziel, and Haran—three. These were the heads of the fathers’ houses of Ladan.'
translation:
  language: id
  text: 'Anak-anak Simei: Selomot[a], Haziel, dan Haran—tiga orang. Mereka inilah para kepala kaum keluarga Laadan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "Selomit", bentuk transliterasi alternatif untuk nama ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שִׁמְעִי
  choice: Anak-anak Simei
  rationale: Dalam daftar silsilah ini, בְּנֵי paling wajar menunjuk kepada anak-anak langsung, bukan sekadar keturunan; nama שִׁמְעִי ditransliterasikan menurut kebiasaan Indonesia sebagai Simei.
- source_word: שלמות
  choice: Selomot
  rationale: Transliterasi Indonesia ini mencerminkan bentuk nama Ibrani yang ditunjukkan oleh teks dan vokalisasinya; bentuk alternatif Selomit dicatat dalam catatan kaki.
- source_word: וַחֲזִיאֵל
  choice: Haziel
  rationale: Nama ini ditransliterasikan langsung dari bentuk חֲזִיאֵל tanpa menggantinya dengan bentuk nama lain yang berkerabat, seperti Yahaziel.
- source_word: וְהָרָן
  choice: dan Haran
  rationale: Konjungsi diterjemahkan secara langsung, sedangkan nama pribadi ditransliterasikan sebagai Haran.
- source_word: שְׁלֹשָׁה
  choice: tiga orang
  rationale: Jumlah tiga dipertahankan secara eksplisit seperti dalam bahasa Ibrani; penambahan 'orang' membuat ungkapan itu alami dalam bahasa Indonesia tanpa mengubah makna.
- source_word: אֵלֶּה רָאשֵׁי הָאָבוֹת
  choice: Mereka adalah para kepala kaum keluarga
  rationale: אֵלֶּה merujuk kepada tiga orang yang baru disebut. רָאשֵׁי menyatakan para pemimpin atau kepala, sedangkan הָאָבוֹת dalam konteks Tawarikh menunjuk pada kelompok keluarga berdasarkan garis leluhur; 'kaum keluarga' menyampaikan struktur tersebut secara alami.
- source_word: לְלַעְדָּן
  choice: Ladan
  rationale: Prefiks לְ menyatakan hubungan genealogis; dalam susunan Indonesia, hubungan itu cukup dinyatakan dengan 'kaum keluarga Ladan'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan genealogis dipertahankan, termasuk jumlah eksplisit 'tiga orang'. Istilah 'kaum keluarga' dipilih agar konsep kelompok keluarga leluhur tetap terlihat tanpa memakai ungkapan harfiah yang kaku seperti 'rumah para ayah'.
