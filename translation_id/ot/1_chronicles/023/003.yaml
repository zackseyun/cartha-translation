base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/003.yaml
  text: The Levites were counted from thirty years old and upward[a], and their number by heads, man by man, was thirty-eight thousand.
translation:
  language: id
  text: Orang-orang Lewi yang berumur tiga puluh tahun ke atas dihitung. Jumlah mereka menurut hitungan per orang laki-laki[a] adalah 38.000 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut kepala mereka, sebagai laki-laki”; ungkapan ini menunjukkan penghitungan setiap laki-laki secara individual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּפְרוּ
  choice: dihitung
  rationale: Bentuk Nifal menunjukkan bahwa orang-orang Lewi menjadi pihak yang dihitung; “dihitung” wajar dalam bahasa Indonesia dan mempertahankan konteks pendataan.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan baku bagi anggota suku Lewi dalam bahasa Indonesia.
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמָעְלָה
  choice: yang berumur tiga puluh tahun ke atas
  rationale: Mengungkapkan batas usia minimum secara alami dan tepat.
- source_word: וַיְהִי מִסְפָּרָם
  choice: Jumlah mereka ... adalah
  rationale: Mengalihkan klausa yang memperkenalkan hasil akhir penghitungan secara lugas.
- source_word: לְגֻלְגְּלֹתָם
  choice: seorang demi seorang
  rationale: Ungkapan Ibrani harfiah “menurut kepala mereka” merupakan idiom penghitungan per individu; pilihan ini menyampaikan fungsinya dengan bahasa Indonesia alami.
- source_word: לִגְבָרִים
  choice: setiap laki-laki
  rationale: Mempertahankan kekhususan gender dalam teks sumber dan menyatu secara alami dengan ungkapan penghitungan individual.
- source_word: שְׁלֹשִׁים וּשְׁמוֹנָה אָלֶף
  choice: 38.000 orang
  rationale: Menyampaikan jumlah secara langsung; “orang” ditambahkan sebagai penggolong alami dalam bahasa Indonesia.
