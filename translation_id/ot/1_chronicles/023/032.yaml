review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat menyampaikan bentuk kewajiban yang ditetapkan, tiga kali pengulangan מִשְׁמֶרֶת, serta istilah Kemah Pertemuan, tempat kudus, dan Yahweh. Namun, “tanggung jawab terhadap bani Harun” terlalu mudah dipahami sebagai tanggung jawab kepada/atas pribadi para imam. Genitif Ibrani “tanggung jawab/tugas anak-anak Harun” lebih baik dibiarkan luas sebagai tugas yang berkenaan dengan mereka.
  naturalness: Bahasanya umumnya baku dan jelas. “Demi pelayanan di rumah Yahweh” kurang langsung untuk לַעֲבֹדַת בֵּית יְהוָה; “untuk pelayanan di Rumah Yahweh” lebih dekat dengan konstruksi sumber dan tetap alami.
  terminology: “Kemah Pertemuan,” “tempat kudus,” dan “Yahweh” tepat. “Anak-anak Harun” adalah padanan yang lebih langsung dan modern untuk בְּנֵי אַהֲרֹן daripada “bani Harun,” tanpa meniadakan kemungkinan makna keturunan dalam konteksnya.
  issues:
  - severity: medium
    issue: “Tanggung jawab terhadap bani Harun” mempersempit hubungan genitif dengan בני אהרן.
    rationale: Kata “terhadap” dalam bahasa Indonesia cenderung menyatakan arah tanggung jawab kepada atau atas orang-orang Harun. Teks Ibrani hanya menghubungkan מִשְׁמֶרֶת dengan “anak-anak Harun, saudara-saudara mereka”; terjemahan perlu mempertahankan keluasan itu.
  - severity: low
    issue: “Demi pelayanan di rumah Yahweh” kurang dekat dengan frasa “untuk pelayanan Rumah Yahweh.”
    rationale: לַעֲבֹדַת menandai tujuan, sedangkan בֵּית יְהוָה adalah genitif dari pelayanan. “Untuk pelayanan di Rumah Yahweh” menyampaikan keduanya secara idiomatis, tanpa menafsirkan lebih jauh.
  revised_text: Mereka harus menjalankan tanggung jawab atas Kemah Pertemuan, tanggung jawab atas tempat kudus[a], dan tanggung jawab yang berkenaan dengan anak-anak Harun, saudara-saudara mereka, untuk pelayanan di Rumah Yahweh.
  revised_footnotes:
  - marker: a
    text: Atau “kawasan suci.” Istilah Ibraninya dapat menunjuk pada tempat kudus secara khusus atau kawasan suci secara lebih luas.
    reason: lexical_alternative
  revision_rationale: Revisi mempertahankan pengulangan tiga kali “tanggung jawab” dan modal kewajiban dalam teks Ibrani. Frasa ketiga diubah agar tidak menyatakan secara berlebihan bahwa orang Lewi bertanggung jawab terhadap pribadi para imam, sambil tetap jelas bahwa tugas itu berkaitan dengan anak-anak Harun. Frasa penutup dibuat lebih dekat dengan relasi “pelayanan Rumah Yahweh.”
