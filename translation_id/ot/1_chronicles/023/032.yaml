  text: וְ/שָׁמְר֞וּ אֶת מִשְׁמֶ֣רֶת אֹֽהֶל מוֹעֵ֗ד וְ/אֵת֙ מִשְׁמֶ֣רֶת הַ/קֹּ֔דֶשׁ וּ/מִשְׁמֶ֕רֶת בְּנֵ֥י אַהֲרֹ֖ן אֲחֵי/הֶ֑ם לַ/עֲבֹדַ֖ת בֵּ֥ית יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/032.yaml
  text: And they were to keep charge of the tent of meeting[a], the charge of the holy place, and the charge of the sons of Aaron their brothers, for the service of the house of Yahweh.
translation:
  language: id
  text: Mereka harus menjalankan tanggung jawab atas Kemah Pertemuan, tanggung jawab atas tempat kudus[a], dan tanggung jawab yang berkenaan dengan anak-anak Harun, saudara-saudara mereka, untuk pelayanan di Rumah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kawasan suci.” Istilah Ibraninya dapat menunjuk pada tempat kudus secara khusus atau kawasan suci secara lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: Mereka harus menjalankan
  rationale: Kata שׁמר berarti menjaga, memelihara, atau menjalankan kewajiban. Dalam rangkuman penugasan orang Lewi ini, bentuk modal “harus menjalankan” menyatakan tanggung jawab yang ditetapkan, bukan sekadar peristiwa lampau.
- source_word: מִשְׁמֶרֶת
  choice: tanggung jawab
  rationale: Nomina ini menunjuk pada kewajiban, tugas penjagaan, atau tanggung jawab yang dipercayakan. Pengulangan “tanggung jawab” mempertahankan struktur tiga serangkai dalam bahasa Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Terjemahan langsung dan lazim bagi nama tempat suci ini; lebih transparan daripada istilah tradisional yang kurang mudah dipahami pembaca umum.
- source_word: הַקֹּדֶשׁ
  choice: tempat kudus
  rationale: Dalam konteks ibadah, istilah ini menunjuk pada kawasan atau tempat yang suci. Terjemahan ini mempertahankan nuansa kultis tanpa menentukan batas kawasan itu secara terlalu sempit.
- source_word: בְּנֵי אַהֲרֹן אֲחֵיהֶם
  choice: bani Harun, saudara-saudara mereka
  rationale: “Bani Harun” mempertahankan ungkapan genealogis sekaligus identitas keimaman mereka; aposisi berikutnya menjelaskan hubungan mereka dengan orang Lewi.
- source_word: לַעֲבֹדַת
  choice: demi pelayanan di
  rationale: עֲבֹדָה dalam konteks rumah ibadah berarti pekerjaan atau pelayanan yang dilakukan di sana. “Demi pelayanan di” menyatakan tujuan seluruh tanggung jawab tersebut secara alami.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: “Rumah” menerjemahkan בַּיִת secara langsung, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh” dan tidak diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu dan membedakannya dari gelar ilahi.
- issue: Hubungan tanggung jawab orang Lewi dengan bani Harun
  choice: tanggung jawab terhadap bani Harun
  alternative: tugas yang diberikan bani Harun atau menjaga bani Harun
  rationale: Konstruksi מִשְׁמֶרֶת בְּנֵי אַהֲרֹן dapat dipahami sebagai tanggung jawab yang berkaitan dengan para imam keturunan Harun. “Terhadap” mempertahankan keluasan hubungan tersebut tanpa menetapkan bahwa mereka menjaga pribadi para imam atau bahwa tugas itu berasal dari para imam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “tanggung jawab” sengaja dipertahankan untuk mencerminkan susunan Ibrani, sementara “bani Harun” mempertahankan corak genealogis yang lazim dalam bahasa Alkitab Indonesia. Penanda catatan kaki ditempatkan sesudah “tempat kudus,” yaitu frasa yang diterangkan oleh catatan tersebut.
