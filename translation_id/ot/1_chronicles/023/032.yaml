- from: Mereka harus menjalankan tanggung jawab atas Kemah Pertemuan, tanggung jawab atas tempat kudus[a], dan tanggung jawab terhadap bani Harun, saudara-saudara mereka, demi pelayanan di rumah Yahweh.
  to: Mereka harus menjalankan tanggung jawab atas Kemah Pertemuan, tanggung jawab atas tempat kudus[a], dan tanggung jawab yang berkenaan dengan anak-anak Harun, saudara-saudara mereka, untuk pelayanan di Rumah Yahweh.
