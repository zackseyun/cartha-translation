  source_fidelity: 'Makna pokok terwakili dengan baik: pengelompokan orang Lewi menurut keluarga leluhur, pencatatan per nama dan per orang, tugas pelayanan di rumah Yahweh, serta batas usia dua puluh tahun. Namun, frasa "yaitu para kepala" terlalu kuat menjadikan seluruh "keturunan Lewi" identik dengan para kepala keluarga. Teks Ibrani lebih baik dipertahankan sebagai aposisi daftar, tanpa penegasan eksplanatoris tersebut.'
  naturalness: Bahasa draf umumnya baku, tetapi pengulangan "kaum keluarga leluhur" terasa berat. "Sesuai daftar mereka" dan "keluarga-keluarga leluhur" lebih alami dalam bahasa Indonesia modern sambil tetap mempertahankan fungsi penggolongan dan sensus.
