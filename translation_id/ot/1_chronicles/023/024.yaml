  to: Inilah keturunan Lewi menurut keluarga-keluarga leluhur mereka, para kepala keluarga, sesuai daftar mereka, menurut jumlah nama, orang demi orang[a], yang melakukan pekerjaan pelayanan di rumah Yahweh, dari usia dua puluh tahun ke atas.
  rationale: Revisi menghilangkan kata "yaitu" agar tidak mempersempit atau terlalu menafsirkan hubungan antara keturunan Lewi dan para kepala keluarga. Diksi untuk struktur keluarga dan daftar sensus dibuat lebih alami, sementara urutan informasi, idiom penghitungan individual, nama Yahweh, dan batas usia tetap setia pada teks Ibrani.
