  text: אֵ֣לֶּה בְנֵֽי לֵוִי֩ לְ/בֵ֨ית אֲבֹתֵי/הֶ֜ם רָאשֵׁ֧י הָ/אָב֣וֹת לִ/פְקוּדֵי/הֶ֗ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם עֹשֵׂה֙ הַ/מְּלָאכָ֔ה לַ/עֲבֹדַ֖ת בֵּ֣ית יְהוָ֑ה מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/024.yaml
  text: These were the sons of Levi by their fathers’ houses[a], the heads of the fathers’ houses, according to those counted of them, by the number of names, head by head, doing the work for the service of the house of Yahweh, from twenty years old and upward.
translation:
  language: id
  text: Inilah keturunan Lewi menurut keluarga-keluarga leluhur mereka, para kepala keluarga, sesuai daftar mereka, menurut jumlah nama, orang demi orang[a], yang melakukan pekerjaan pelayanan di rumah Yahweh, dari usia dua puluh tahun ke atas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut tengkorak/kepala mereka,” sebuah ungkapan yang berarti bahwa setiap orang dihitung secara tersendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי לֵוִי
  choice: keturunan Lewi
  rationale: Secara harfiah berarti 'anak-anak Lewi', tetapi dalam konteks daftar silsilah ungkapan ini mencakup para keturunan laki-laki Lewi, bukan hanya anak kandung langsung.
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: menurut kaum keluarga leluhur mereka
  rationale: Ungkapan ini menggolongkan orang Lewi berdasarkan unit kekerabatan turun-temurun. 'Kaum keluarga leluhur' lebih jelas dalam bahasa Indonesia modern daripada terjemahan harfiah 'rumah bapa'.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: para kepala kaum keluarga leluhur
  rationale: Secara harfiah 'kepala-kepala para leluhur'; dalam konteks, yang dimaksud ialah para pemimpin atau wakil utama kelompok keluarga leluhur.
- source_word: לִפְקוּדֵיהֶם
  choice: berdasarkan pencatatan mereka
  rationale: Bentuk dari פקד di sini merujuk pada pendataan atau pencacahan resmi. 'Pencatatan' mempertahankan kaitannya dengan daftar orang yang dihitung.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: menurut jumlah nama
  rationale: Ungkapan sensus ini menunjukkan bahwa orang-orang didaftarkan dan dihitung berdasarkan nama mereka.
- source_word: לְגֻלְגְּלֹתָם
  choice: orang demi orang
  rationale: Secara harfiah 'menurut tengkorak/kepala mereka', sebuah idiom yang berarti setiap orang dihitung secara tersendiri. Terjemahan idiomatis dipakai dalam teks dan citra harfiahnya dijelaskan dalam catatan kaki.
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: yang melakukan pekerjaan
  rationale: Partisipel tunggal berfungsi secara kolektif bagi orang-orang Lewi yang terdaftar dan menjalankan tugas.
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: untuk pelayanan rumah Yahweh
  rationale: עֲבֹדָה menunjuk pada pekerjaan pelayanan yang berkaitan dengan rumah ibadah, mencakup tugas praktis maupun ibadah tanpa mempersempitnya menjadi jabatan tertentu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri 'Yahweh', bukan diganti dengan gelar.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: dari yang berumur dua puluh tahun ke atas
  rationale: Ungkapan Ibrani ini menetapkan usia minimum untuk mereka yang menjalankan pelayanan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk 'Yahweh' mempertahankan fungsi nama ilahi tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'kaum keluarga leluhur' dipakai untuk menjelaskan struktur kekerabatan Israel tanpa ungkapan harfiah yang janggal. Kalimat mempertahankan corak daftar resmi, tetapi susunannya dibuat wajar bagi pembaca Indonesia.
