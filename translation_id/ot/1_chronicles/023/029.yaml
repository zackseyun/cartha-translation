base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/029.yaml
  text: and for the bread of the arrangement[a], and for the fine flour for the grain offering, and for the wafers of unleavened bread, and for what is cooked on the griddle, and for what is well-mixed, and for every measure and size,
translation:
  language: id
  text: dan untuk roti yang disusun[a], tepung halus untuk persembahan sajian, kue-kue tipis tidak beragi, apa yang dipanggang di atas wajan, apa yang dicampur, serta segala takaran dan ukuran,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau "roti sajian" atau "roti Hadirat". Secara harfiah: "roti susunan".'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: roti yang disusun
  rationale: Secara harfiah berarti roti yang diatur atau disusun. Pilihan ini mempertahankan istilah yang dipakai ayat ini tanpa memasukkan sebutan kultis dari teks terkait ke dalam teks utama.
- source_word: סֹלֶת
  choice: tepung terbaik
  rationale: Menunjukkan tepung halus bermutu tinggi yang digunakan dalam persembahan; ungkapan ini alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: מִנְחָה
  choice: persembahan sajian
  rationale: Dalam konteks ibadah ini menunjuk pada persembahan berbahan hasil bumi atau tepung, bukan persembahan secara umum. 'Persembahan sajian' merupakan istilah Indonesia yang jelas dan mapan.
- source_word: רְקִיקֵי הַמַּצּוֹת
  choice: kue-kue tipis tidak beragi
  rationale: רְקִיקִים menunjuk pada kue tipis, sedangkan מַצּוֹת menyatakan bahwa kue itu tidak beragi.
- source_word: מַּחֲבַת
  choice: apa yang dipanggang di atas wajan
  rationale: Kata ini pada dasarnya menunjuk pada wajan atau pelat datar untuk mengolah persembahan. Dalam daftar makanan dan persiapannya, terjemahan ini menyatakan hasil olahan tanpa mengaburkan alat yang dipakai.
- source_word: מֻּרְבָּכֶת
  choice: apa yang dicampur
  rationale: Bentuk pasif ini menunjuk pada sesuatu yang telah dicampur atau diolah, tetapi cara persisnya tidak pasti. Terjemahan umum ini mempertahankan ketidakjelasan tersebut dan tidak menambahkan bahan seperti minyak yang tidak disebutkan dalam ayat.
- source_word: מְשׂוּרָה
  choice: takaran
  rationale: Menunjuk pada takaran baku atau jumlah yang ditakar.
- source_word: מִדָּה
  choice: ukuran
  rationale: Dalam pasangan dengan מְשׂוּרָה, kata ini mencakup ukuran atau standar pengukuran secara lebih luas.
theological_decisions:
- issue: Istilah kultis לֶחֶם הַמַּעֲרֶכֶת
  choice: roti yang disusun
  alternative: roti sajian; roti Hadirat
  rationale: Teks Ibrani ayat ini secara khusus memakai kata 'susunan/pengaturan'. Terjemahan utama mengikuti bentuk tersebut, sementara istilah kultis tradisional dan padanannya dari teks terkait dicatat sebagai alternatif, tanpa menentukan satu penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar dipertahankan sebagai kelanjutan kalimat dari ayat sebelumnya; koma penutup mencerminkan bahwa kalimat berlanjut. Istilah ibadah dibuat jelas bagi pembaca umum tanpa menghilangkan kekhususan konteks keimaman.
