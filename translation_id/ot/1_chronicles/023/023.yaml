  text: בְּנֵ֣י מוּשִׁ֗י מַחְלִ֥י וְ/עֵ֛דֶר וִ/ירֵמ֖וֹת שְׁלֹשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/023.yaml
  text: 'The sons of Mushi: Mahli[a], Eder, and Jeremoth—three.'
translation:
  language: id
  text: 'Anak-anak Musi: Mahli, Eder, dan Yeremot—tiga orang.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari 'anak laki-laki' yang memperkenalkan daftar silsilah. 'Anak-anak' merupakan padanan langsung dan wajar; konteks tidak menuntut arti yang lebih luas seperti 'keturunan'.
- source_word: מוּשִׁי
  choice: Musi
  rationale: Nama diri yang ditransliterasikan secara wajar ke dalam ejaan bahasa Indonesia.
- source_word: מַחְלִי
  choice: Mahli
  rationale: Nama diri yang ditransliterasikan; bentuk ini mempertahankan konsonan sumber dan lazim dipakai dalam tradisi Alkitab Indonesia.
- source_word: וְעֵדֶר
  choice: Eder
  rationale: Nama diri dengan konjungsi. Konjungsi Ibrani diwujudkan sebagai 'dan' sebelum unsur terakhir dalam daftar Indonesia.
- source_word: וִירֵמוֹת
  choice: Yeremot
  rationale: Nama diri yang ditransliterasikan berdasarkan bentuk Ibrani dalam ayat ini; bunyi awal yod diwakili dengan 'Y' dan akhiran ת dengan 't'.
- source_word: שְׁלֹשָׁה
  choice: tiga orang
  rationale: Bilangan pokok yang merangkum jumlah anak yang disebut. Penambahan penggolong 'orang' membuat rangkuman itu alami dan jelas dalam bahasa Indonesia tanpa menambah makna substantif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Tanda pisah mempertahankan struktur daftar yang diikuti rangkuman jumlah. Catatan kaki Inggris tentang variasi ejaan Inggris tidak dibawa ke teks Indonesia karena bukan variasi dalam sumber Ibrani dan tidak relevan bagi transliterasi Indonesia.
