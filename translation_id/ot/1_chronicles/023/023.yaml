  source_fidelity: 'Teks Indonesia dengan tepat mencerminkan struktur Ibrani: daftar בני מושי diikuti tiga nama dan ringkasan jumlah שְׁלֹשָׁה. "Anak-anak Musi" adalah idiom silsilah yang wajar dalam bahasa Indonesia dan, dalam konteks daftar nama laki-laki, memadai untuk בני. "Tiga orang" secara tepat menyatakan jumlah tiga yang merangkum daftar tersebut.'
