  register: 'Bahasa Indonesia modern, jelas, dan bermartabat. Nama-nama mengikuti bentuk Indonesia yang lazim: Gerson, Kehat, dan Merari. “Kelompok-kelompok” dipilih daripada istilah administratif yang lebih teknis agar mudah dipahami pembaca umum.'
