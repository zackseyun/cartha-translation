  text: 'David divided them into divisions for the sons of Levi: Gershon[a], Kohath, and Merari.'
translation:
  language: id
  text: 'Daud membagi mereka ke dalam kelompok-kelompok di antara keturunan Lewi: Gerson[a], Kehat, dan Merari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bagi Gerson, Kehat, dan Merari.”
    reason: Bahasa Ibrani memakai kata depan ל pada nama Gerson; kata depan itu dapat dipahami sebagai pengantar bagi seluruh daftar.
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: membagi mereka
  rationale: Bentuk piel dari חלק menyatakan tindakan membagi atau mengelompokkan, dan akhiran orang ketiga jamak menuntut objek “mereka” dipertahankan.
- source_word: מַחְלְקוֹת
  choice: ke dalam kelompok-kelompok
  rationale: Kata ini menunjuk pada pembagian atau kelompok yang teratur. Ungkapan “ke dalam kelompok-kelompok” menyampaikan hasil tindakan membagi secara alami dalam bahasa Indonesia.
- source_word: לִבְנֵי לֵוִי
  choice: menurut keturunan Lewi
  rationale: Secara harfiah berarti “bagi anak-anak Lewi”. Dalam konteks silsilah dan daftar tiga leluhur kaum Lewi, “menurut keturunan Lewi” secara alami menunjukkan bahwa pembagian itu mengikuti garis-garis keturunan Lewi tanpa menyederhanakannya menjadi sekadar “orang Lewi”.
- source_word: לְגֵרְשׁוֹן קְהָת וּמְרָרִי
  choice: Gerson, Kehat, dan Merari
  rationale: Ketiganya adalah nama leluhur utama kaum Lewi. Daftar sesudah titik dua dapat dipahami sebagai perincian keturunan Lewi; awalan ל pada nama pertama juga memungkinkan terjemahan eksplisit “bagi Gerson, Kehat, dan Merari”, yang dicatat dalam catatan kaki.
