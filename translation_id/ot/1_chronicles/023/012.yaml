  text: בְּנֵ֣י קְהָ֗ת עַמְרָ֥ם יִצְהָ֛ר חֶבְר֥וֹן וְ/עֻזִּיאֵ֖ל אַרְבָּעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/012.yaml
  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel—four.'
translation:
  language: id
  text: Anak-anak Kehat ialah Amram, Yizhar, Hebron, dan Uziel—empat orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן yang membuka daftar silsilah. Karena ayat ini langsung menyebut empat nama, makna harfiah 'anak-anak' lebih tepat daripada 'keturunan'.
- source_word: קְהָת
  choice: Kehat
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia dan cukup dekat dengan nama Ibraninya.
- source_word: עַמְרָם
  choice: Amram
  rationale: Transliterasi nama diri yang lazim dalam bahasa Indonesia.
- source_word: יִצְהָר
  choice: Yizhar
  rationale: Transliterasi yang mencerminkan konsonan awal yod dalam bahasa Ibrani serta tetap mudah dibaca dalam bahasa Indonesia.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Transliterasi nama diri yang lazim; dalam konteks ini nama tersebut menunjuk kepada seorang anak Kehat, bukan nama tempat.
- source_word: וְעֻזִּיאֵל
  choice: dan Uziel
  rationale: Konjungsi וְ diterjemahkan 'dan', sedangkan nama diri ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: אַרְבָּעָה
  choice: empat orang
  rationale: Bilangan ini merangkum jumlah nama yang baru disebut. Penambahan penggolong 'orang' membuat ungkapan tersebut alami dan memperjelas bahwa yang dihitung adalah pribadi-pribadi.
