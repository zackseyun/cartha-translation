  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Kopula 'ialah' memperjelas hubungan antara judul daftar dan nama-nama tanpa menambah isi; tanda pisah mempertahankan penutup ringkas dari teks sumber.
