  text: וַ/יֶּאֱסֹף֙ אֶת כָּל שָׂרֵ֣י יִשְׂרָאֵ֔ל וְ/הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/002.yaml
  text: And he gathered all the leaders of Israel[a], and the priests and the Levites.
translation:
  language: id
  text: Lalu ia mengumpulkan semua pemimpin Israel[a], para imam, dan orang-orang Lewi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pembesar Israel”, “para pejabat Israel”, atau “para kepala Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: Lalu ia mengumpulkan
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. “Lalu” menyatakan urutan naratif secara alami, sedangkan “mengumpulkan” langsung mencerminkan makna umum אסף. Subjek pronominal “ia” dipertahankan sebagaimana teks Ibrani.
- source_word: כָּל
  choice: semua
  rationale: Kata ini menyatakan keseluruhan dan paling wajar diterjemahkan “semua” di depan nomina jamak.
- source_word: שָׂרֵי יִשְׂרָאֵל
  choice: pemimpin Israel
  rationale: שָׂרִים dapat menunjuk para pemimpin, pembesar, pejabat, atau kepala. “Pemimpin” jelas dalam bahasa Indonesia modern dan tidak memberi kesan bahwa mereka semua adalah putra raja.
- source_word: וְהַכֹּהֲנִים
  choice: para imam
  rationale: Terjemahan langsung dan alami bagi nomina jamak tentu ini; “para” menyatakan kelompok yang dimaksud.
- source_word: וְהַלְוִיִּם
  choice: dan orang-orang Lewi
  rationale: “Orang-orang Lewi” adalah sebutan yang jelas dan lazim bagi kelompok suku tersebut, serta mempertahankan konjungsi Ibrani.
