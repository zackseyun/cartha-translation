  text: 'The sons of Ladan: Jehiel the head[a], and Zetham and Joel—three.'
translation:
  language: id
  text: 'Anak-anak Ladan: Yehiel, kepala[a], Zetam, dan Yoel—tiga orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang utama” atau “yang pertama”; kata Ibrani ini secara harfiah berarti “kepala” dan mungkin menunjukkan bahwa Yehiel adalah anak yang terkemuka atau yang pertama.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus ini secara harfiah berarti “anak-anak laki-laki dari.” Dalam daftar ini tiga nama diperkenalkan sebagai anak Ladan, sehingga “anak-anak” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: לַעְדָּן
  choice: Ladan
  rationale: Nama diri ditransliterasikan secara ringkas sesuai bentuk konsonantal Ibrani dan pemakaian Indonesia yang wajar.
- source_word: הָרֹאשׁ
  choice: yang menjadi kepala
  rationale: Secara harfiah berarti “kepala” dan dapat menunjuk orang yang utama atau memimpin. Ungkapan ini mempertahankan gambaran dan kemungkinan kedudukan Yehiel tanpa mengubahnya menjadi bilangan urut “yang pertama.”
- source_word: יְחִיאֵל
  choice: Yehiel
  rationale: Nama diri ditransliterasikan dengan ejaan yang sesuai dengan kebiasaan bahasa Indonesia.
- source_word: וְזֵתָם
  choice: Zetam
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia; konjungsi Ibrani diwujudkan secara alami dalam rangkaian nama.
- source_word: וְיוֹאֵל
  choice: dan Yoel
  rationale: Konjungsi dan nama diri diterjemahkan secara langsung, dengan transliterasi Indonesia “Yoel.”
- source_word: שְׁלֹשָׁה
  choice: tiga orang
  rationale: Bilangan ini merangkum jumlah nama yang disebutkan. “Orang” ditambahkan secara idiomatis karena yang dihitung adalah manusia.
