translation:
  language: id
  text: 'Anak-anak Hebron: Yeria, yang pertama[a]; Amarya, yang kedua; Yahaziel, yang ketiga; dan Yekameam, yang keempat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepala” atau “yang utama”; dalam rangkaian ini kata tersebut dipahami sebagai “yang pertama”, sejajar dengan “yang kedua”, “yang ketiga”, dan “yang keempat”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי חֶבְרוֹן
  choice: Anak-anak Hebron
  rationale: Bentuk jamak konstruksi בְּנֵי memperkenalkan daftar silsilah. 'Anak-anak' merupakan padanan langsung dan sesuai dengan konteks nama-nama keturunan langsung.
- source_word: יְרִיָּהוּ
  choice: Yeria
  rationale: Nama diri dialihaksarakan dalam bentuk yang wajar bagi pembaca bahasa Indonesia.
- source_word: הָרֹאשׁ
  choice: yang sulung
  rationale: Secara harfiah berarti 'kepala' atau 'yang utama', tetapi dalam rangkaian yang dilanjutkan dengan 'yang kedua', 'yang ketiga', dan 'yang keempat', kata ini menunjukkan urutan. 'Yang sulung' menyampaikan posisi pertama dalam daftar keluarga tanpa mengesankan jabatan kepemimpinan.
- source_word: אֲמַרְיָה
  choice: Amarya
  rationale: Nama diri dialihaksarakan secara wajar ke dalam bahasa Indonesia.
- source_word: הַשֵּׁנִי
  choice: yang kedua
  rationale: Bilangan tingkat yang menandai urutan dalam daftar.
- source_word: יַחֲזִיאֵל
  choice: Yahaziel
  rationale: Nama diri dialihaksarakan dengan mempertahankan unsur bunyi Ibrani yang lazim direpresentasikan sebagai 'Yah'.
- source_word: הַשְּׁלִישִׁי
  choice: yang ketiga
  rationale: Bilangan tingkat yang menandai urutan dalam daftar.
- source_word: וִיקַמְעָם
  choice: dan Yekameam
  rationale: Kata sambung וְ diterjemahkan 'dan'; nama diri dialihaksarakan secara wajar ke dalam bahasa Indonesia.
- source_word: הָרְבִיעִי
  choice: yang keempat
  rationale: Bilangan tingkat yang menandai urutan dalam daftar.
