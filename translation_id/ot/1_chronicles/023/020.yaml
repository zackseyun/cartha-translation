  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan daftar dipertahankan, sementara ungkapan ordinal dibuat alami. Ambiguitas רֹאשׁ antara urutan pertama dan kedudukan sebagai kepala dipertahankan melalui catatan kaki.
