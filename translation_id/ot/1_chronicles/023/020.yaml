base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/020.yaml
  text: 'The sons of Uzziel: Micah the first[b][a], and Isshiah the second.'
translation:
  language: id
  text: 'Anak-anak Uziel: Mikha, kepala[a], dan Yisia[b], yang kedua.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang pertama”; secara harfiah, “kepala”.
    reason: lexical_alternative
  - marker: b
    text: Nama ini juga dapat ditransliterasikan sebagai Yisyia.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן yang memperkenalkan daftar silsilah; dalam konteks ini menunjuk kepada anak-anak langsung Uziel.
- source_word: עֻזִּיאֵל
  choice: Uziel
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: מִיכָה
  choice: Mikha
  rationale: Transliterasi Indonesia yang lazim bagi nama pribadi Ibrani ini.
- source_word: הָרֹאשׁ
  choice: yang pertama
  rationale: Secara harfiah berarti 'kepala', tetapi dalam daftar ini, khususnya karena dipasangkan dengan הַשֵּׁנִי ('yang kedua'), paling wajar menyatakan urutan atau kedudukan pertama.
- source_word: וְיִשִּׁיָּה
  choice: dan Yisia
  rationale: Konjungsi וְ diterjemahkan 'dan'; nama tersebut ditransliterasikan secara wajar bagi pembaca Indonesia, sementara variasi bentuk nama dicatat dalam catatan kaki.
- source_word: הַשֵּׁנִי
  choice: yang kedua
  rationale: Terjemahan langsung kata bilangan bertingkat yang menandai orang kedua dalam daftar.
