base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/001.yaml
  text: Then Hiram king of Tyre sent messengers to David[a], and cedar timber, masons, and carpenters[b], to build a house for him.
translation:
  language: id
  text: Kemudian Hiram, raja Tirus, mengirim utusan kepada Daud[a], serta kayu aras, tukang batu, dan tukang kayu, untuk membangun sebuah rumah baginya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wakil-wakil resmi.” Istilah Ibrani ini dapat menunjuk para wakil kerajaan dalam konteks diplomatik.
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk membangun sebuah istana baginya.” Kata Ibrani yang diterjemahkan “rumah” dapat merujuk pada kediaman raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Kemudian ... mengirim
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “Kemudian” menyatakan urutan peristiwa secara alami dalam bahasa Indonesia.
- source_word: חירם
  choice: Hiram
  rationale: Mengikuti bentuk nama dalam teks Ibrani pada ayat ini dan bentuk yang lazim dalam bahasa Indonesia.
- source_word: מֶלֶךְ צֹר
  choice: raja Tirus
  rationale: Rangkaian konstruksi ini secara langsung menyatakan jabatan Hiram dan wilayah pemerintahannya.
- source_word: מַלְאָכִים
  choice: utusan
  rationale: Istilah ini berarti orang yang diutus; dalam konteks kerajaan dapat pula menunjuk wakil resmi, tanpa harus menetapkan pangkat diplomatik tertentu.
- source_word: וַעֲצֵי אֲרָזִים
  choice: juga kayu aras
  rationale: Dalam konteks pembangunan, frasa ini menunjuk bahan kayu aras, bukan pohon yang masih hidup. “Juga” membuat koordinasi barang dan tenaga kerja setelah verba “mengirim” terasa wajar dalam bahasa Indonesia.
- source_word: חָרָשֵׁי קִיר
  choice: tukang batu
  rationale: Secara harfiah menunjuk para perajin atau pekerja dinding; dalam konteks pembangunan, padanan Indonesia yang alami ialah “tukang batu.”
- source_word: חָרָשֵׁי עֵצִים
  choice: tukang kayu
  rationale: Rangkaian ini menunjuk para perajin yang bekerja dengan kayu; “tukang kayu” merupakan padanan Indonesia yang jelas dan alami.
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: untuk membangun sebuah rumah baginya
  rationale: Infinitif menyatakan tujuan. “Rumah” mempertahankan arti dasar בָּיִת, sementara konteks kerajaan memungkinkan makna kediaman istana tanpa memasukkannya secara pasti ke dalam teks utama.
