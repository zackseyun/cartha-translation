  edition: WLC
  text: וַ/יַּעַזְבוּ שָׁ֖ם אֶת אֱלֹֽהֵי/הֶ֑ם וַ/יֹּ֣אמֶר דָּוִ֔יד וַ/יִּשָּׂרְפ֖וּ בָּ/אֵֽשׁ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/012.yaml
  text: And they left their gods there[a], and David gave the order[b], and they were burned with fire.
translation:
  language: id
  text: Mereka meninggalkan ilah-ilah mereka di sana[a]. Lalu Daud memberi perintah, dan ilah-ilah itu dibakar dengan api[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berhala-berhala mereka.” Secara harfiah teks Ibrani berbunyi “ilah-ilah mereka,” tetapi kemungkinan yang dimaksud ialah patung-patung pemujaan mereka.'
    reason: lexical_alternative
  - marker: b
    text: Dalam kisah sejajar di 2 Samuel 5:21 tertulis bahwa Daud dan orang-orangnya mengangkut benda-benda itu. Di sini Kitab Tawarikh menyatakan bahwa benda-benda itu dibakar dengan api atas perintah Daud.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: mereka meninggalkan
  rationale: Kata עזב berarti meninggalkan atau membiarkan. 'Meninggalkan' alami dalam bahasa Indonesia dan menggambarkan orang Filistin yang meninggalkan benda-benda itu tanpa menambahkan penafsiran.
- source_word: שָׁם
  choice: di sana
  rationale: Keterangan tempat ini diterjemahkan secara langsung dan wajar.
- source_word: אֶת אֱלֹהֵיהֶם
  choice: ilah-ilah mereka
  rationale: Secara harfiah teks menyebut 'ilah-ilah mereka'. Kemungkinan yang dimaksud ialah patung atau benda pemujaan, tetapi terjemahan utama mempertahankan ungkapan sumber dan mencatat alternatif interpretatif dalam catatan kaki.
- source_word: וַיֹּאמֶר דָּוִיד
  choice: Lalu Daud memberi perintah
  rationale: Secara bentuk berarti 'Daud berkata', tetapi dalam konteks perkataan itu berfungsi sebagai perintah agar ilah-ilah tersebut dibakar. Ungkapan ini alami dan tidak perlu memasok isi ucapan langsung.
- source_word: וַיִּשָּׂרְפוּ
  choice: ilah-ilah itu dibakar
  rationale: Bentuk ini dipahami secara pasif, 'dibakar'. Pengulangan 'ilah-ilah itu' memperjelas subjek dalam bahasa Indonesia tanpa mengubah acuan teks.
- source_word: בָּאֵשׁ
  choice: dengan api
  rationale: Frasa preposisional ini menyatakan sarana; 'dengan api' mempertahankan bentuk ungkapan Ibrani secara jelas.
theological_decisions:
- issue: Makna אֱלֹהֵיהֶם dalam konteks benda-benda pemujaan bangsa Filistin
  choice: ilah-ilah mereka
  alternative: berhala-berhala mereka
  rationale: Teks Ibrani secara leksikal mengatakan 'ilah-ilah mereka'. Pilihan ini mempertahankan bahasa sumber dan tidak menggantinya secara diam-diam dengan istilah polemis atau interpretatif, sementara kemungkinan bahwa yang dimaksud adalah patung pemujaan dijelaskan dalam catatan kaki.
- issue: Hubungan tindakan Daud dengan pembakaran
  choice: Daud memberi perintah, dan ilah-ilah itu dibakar
  alternative: Daud berkata, lalu mereka membakarnya
  rationale: Teks Tawarikh tidak menyatakan secara eksplisit siapa pelaksana pembakaran. Terjemahan mempertahankan konstruksi pasif dan menghindari penambahan pelaku, sekaligus menyampaikan fungsi ujaran Daud sebagai perintah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Ilah-ilah' dipilih untuk membedakan dewa-dewa bangsa lain dari Allah serta mempertahankan bentuk jamak sumber. Acuan nomina diulang pada klausa terakhir demi kejelasan karena bentuk pasif Indonesia akan terasa kabur jika hanya memakai 'mereka'.
