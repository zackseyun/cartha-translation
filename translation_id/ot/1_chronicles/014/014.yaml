  yaml_path: translation/ot/1_chronicles/014/014.yaml
  text: So David inquired of God again[a], and God said to him, “You shall not go up after them. Circle around from behind them, and come against them opposite the balsam trees.”
translation:
  language: id
  text: Lalu Daud kembali meminta petunjuk kepada Allah. Allah berfirman kepadanya, “Jangan maju mengejar mereka. Berputarlah menjauhi mereka, lalu datanglah menyerang mereka dari arah seberang pohon-pohon baka[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jenis pohon yang dimaksud dalam bahasa Ibrani tidak diketahui dengan pasti. Ada yang menerjemahkannya sebagai pohon balsam atau pohon murbei.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל עוֹד דָּוִיד בֵּאלֹהִים
  choice: Lalu Daud kembali meminta petunjuk Allah
  rationale: Konstruksi שׁאל dengan ב dalam konteks ini berarti meminta petunjuk atau jawaban ilahi, bukan sekadar mengajukan pertanyaan. עוֹד menunjukkan pengulangan tindakan.
- source_word: וַיֹּאמֶר לוֹ הָאֱלֹהִים
  choice: Allah berfirman kepadanya
  rationale: Rumus ujaran naratif ini diterjemahkan secara wajar dan bermartabat; “berfirman” lazim dipakai ketika Allah menjadi subjek.
- source_word: לֹא תַעֲלֶה אַחֲרֵיהֶם
  choice: Jangan maju mengejar mereka
  rationale: עלה secara harfiah berarti “naik/maju”, sedangkan אַחֲרֵיהֶם berarti “mengikuti/mengejar mereka”. Dalam konteks militer, “maju mengejar” mempertahankan gambaran gerak tanpa langsung mengubahnya menjadi “menyerang”.
- source_word: הָסֵב מֵעֲלֵיהֶם
  choice: Berputarlah menjauhi mereka
  rationale: Imperatif הָסֵב menyatakan perubahan arah atau gerakan memutar, sementara מֵעֲלֵיהֶם menunjukkan gerakan menjauh dari posisi langsung terhadap mereka. Teks Tawarikh tidak secara eksplisit mengatakan “ke belakang mereka”.
- source_word: וּבָאתָ לָהֶם
  choice: lalu datanglah menyerang mereka
  rationale: בוא dengan ל dalam konteks pertempuran dapat berarti mendatangi atau maju melawan pihak musuh. “Menyerang” menjelaskan daya bermusuhan yang sudah nyata dari konteks.
- source_word: מִמּוּל הַבְּכָאִים
  choice: dari arah yang berhadapan dengan pohon-pohon baka
  rationale: מִמּוּל menunjukkan posisi di depan atau berhadapan dengan sesuatu. Nama tumbuhan בְּכָאִים ditransliterasikan karena identifikasi spesiesnya tidak pasti.
