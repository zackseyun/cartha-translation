  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּי נִמְשַׁ֨ח דָּוִ֤יד לְ/מֶ֨לֶךְ֙ עַל כָּל יִשְׂרָאֵ֔ל וַ/יַּעֲל֥וּ כָל פְּלִשְׁתִּ֖ים לְ/בַקֵּ֣שׁ אֶת דָּוִ֑יד וַ/יִּשְׁמַ֣ע דָּוִ֔יד וַ/יֵּצֵ֖א לִ/פְנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/008.yaml
  text: When the Philistines heard that David had been anointed king over all Israel[a], all the Philistines went up to seek David. And David heard, and went out before them.
translation:
  language: id
  text: Ketika orang Filistin mendengar bahwa Daud telah diurapi menjadi raja atas seluruh Israel, semua orang Filistin maju untuk mencari Daud. Daud pun mendengar hal itu dan keluar ke hadapan mereka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keluar untuk menemui mereka” atau “keluar melawan mereka.” Secara harfiah, bahasa Ibraninya berbunyi “keluar ke hadapan mereka,” yang dalam konteks ini dapat menyiratkan konfrontasi militer tanpa menyatakannya secara tegas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: mendengar
  rationale: Dalam narasi, שׁמע lazim berarti menerima atau mengetahui suatu kabar. “Mendengar” mempertahankan ungkapan langsung bahasa Ibrani dan pengulangan akar yang juga dipakai untuk Daud.
- source_word: פְלִשְׁתִּים
  choice: orang Filistin
  rationale: Ini adalah sebutan baku dan alami dalam bahasa Indonesia untuk kelompok bangsa tersebut.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi kabar yang didengar oleh orang Filistin.
- source_word: נִמְשַׁח
  choice: telah diurapi
  rationale: Bentuk Nifal menyatakan bahwa Daud menerima tindakan pengurapan; “telah” menunjukkan bahwa tindakan itu sudah terjadi sebelum kabarnya didengar.
- source_word: לְמֶלֶךְ
  choice: menjadi raja
  rationale: Preposisi לְ menandai jabatan atau hasil pengurapan. “Menjadi raja” merupakan ungkapan Indonesia yang alami.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: atas seluruh Israel
  rationale: עַל dalam kaitan dengan jabatan raja menunjukkan lingkup pemerintahannya; “seluruh Israel” mempertahankan cakupan politis yang ditekankan teks.
- source_word: וַיַּעֲלוּ
  choice: maju
  rationale: עלה secara harfiah berarti “naik,” tetapi dalam konteks pergerakan pasukan dapat menyatakan gerak maju. “Maju” terdengar alami dalam narasi Indonesia tanpa secara eksplisit menambahkan bahwa mereka berbaris atau menyerang.
- source_word: כָל פְּלִשְׁתִּים
  choice: semua orang Filistin
  rationale: Terjemahan ini mempertahankan ungkapan kolektif teks Ibrani tanpa menafsirkannya secara lebih sempit sebagai pasukan saja.
- source_word: לְבַקֵּשׁ אֶת דָּוִיד
  choice: untuk mencari Daud
  rationale: בקשׁ berarti “mencari.” Konteksnya bersifat bermusuhan, tetapi terjemahan ini tidak menetapkan lebih jauh maksud mereka daripada yang dinyatakan oleh kata Ibraninya.
- source_word: וַיִּשְׁמַע דָּוִיד
  choice: Daud pun mendengar hal itu
  rationale: Terjemahan ini mempertahankan pengulangan kata “mendengar” dan mengungkapkan secara alami bahwa yang didengar Daud adalah gerakan orang Filistin tersebut.
- source_word: וַיֵּצֵא לִפְנֵיהֶם
  choice: keluar ke hadapan mereka
  rationale: Ungkapan ini mengikuti arti harfiah לפני, “di hadapan mereka,” sehingga kemungkinan makna menemui atau menghadapi secara militer tidak dipastikan di dalam teks utama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur narasi dibuat lancar, sementara pengulangan “mendengar” serta ambiguitas ungkapan terakhir dipertahankan. Penanda catatan kaki ditempatkan setelah frasa yang dijelaskannya.
