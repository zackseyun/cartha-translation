  to: Lalu mereka maju ke Baal-Perazim[a], dan Daud mengalahkan mereka di sana. Daud berkata, “Allah telah menerobos musuh-musuhku melalui tanganku, seperti luapan air.” Itulah sebabnya orang menamai tempat itu Baal-Perazim.
  rationale: Revisi menghapus tambahan “barisan,” memakai “melalui tanganku” untuk sarana ilahi melalui Daud, dan membentuk kembali perbandingan air sebagai “seperti luapan air,” yang lebih dekat dengan konstruksi Ibrani serta tetap mempertahankan permainan kata dengan “menerobos.”
