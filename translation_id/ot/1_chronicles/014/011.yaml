  naturalness: Bahasa draft lancar dan bernada naratif modern. “Melalui tanganku” lebih langsung dan alami untuk menyampaikan idiom בְּיָדִי daripada “dengan perantaraanku,” sambil tetap mempertahankan Daud sebagai sarana tindakan Allah.
  terminology: “Allah,” “Daud,” dan “Baal-Perazim” konsisten dan sesuai register. Catatan kaki perlu dibatasi pada permainan kata antara nama tempat dan verba “menerobos,” tanpa memasukkan gambaran “barisan musuhnya” yang bukan unsur leksikal sumber.
