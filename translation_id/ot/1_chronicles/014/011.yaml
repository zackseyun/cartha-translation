  text: וַ/יַּעֲל֥וּ בְּ/בַֽעַל פְּרָצִים֮ וַ/יַּכֵּ֣/ם שָׁ֣ם דָּוִיד֒ וַ/יֹּ֣אמֶר דָּוִ֔יד פָּרַ֨ץ הָֽ/אֱלֹהִ֧ים אֶת אוֹיְבַ֛/י בְּ/יָדִ֖/י כְּ/פֶ֣רֶץ מָ֑יִם עַל כֵּ֗ן קָֽרְא֛וּ שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בַּ֥עַל פְּרָצִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/011.yaml
  text: So they went up to Baal-perazim[a], and David struck them down there. And David said, “God has broken through my enemies by my hand, like a bursting flood of waters.” Therefore they called the name of that place Baal-perazim.
translation:
  language: id
  text: Lalu mereka maju ke Baal-Perazim[a], dan Daud mengalahkan mereka di sana. Daud berkata, “Allah telah menerobos musuh-musuhku melalui tanganku, seperti luapan air.” Itulah sebabnya orang menamai tempat itu Baal-Perazim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Baal-Perazim berkaitan dengan kata Ibrani yang berarti “menerobos” atau “luapan,” dan menggemakan perkataan Daud bahwa Allah telah menerobos musuh-musuhnya.
    reason: Menjelaskan arti nama tempat dan permainan kata Ibrani yang tidak sepenuhnya tampak dalam transliterasi.
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: mereka maju
  rationale: Dalam konteks gerakan militer, עלה dapat berarti bergerak naik atau maju. 'Maju' alami dalam bahasa Indonesia dan tidak memaksakan arah geografis yang tidak dijelaskan.
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: Baal-Perazim
  rationale: Nama tempat ditransliterasikan, sedangkan permainan katanya dengan פרץ dijelaskan dalam catatan kaki.
- source_word: וַיַּכֵּם
  choice: Daud mengalahkan mereka
  rationale: Dalam konteks pertempuran, נכה menyatakan tindakan memukul atau menaklukkan. 'Mengalahkan' menyampaikan hasil tindakan secara jelas tanpa menentukan bahwa setiap orang dibunuh.
- source_word: פָּרַץ
  choice: telah menerobos
  rationale: פרץ menggambarkan tindakan mendobrak atau menerobos dan mempertahankan kaitan leksikal dengan Perazim serta gambaran air yang menerobos.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Kata ini merujuk kepada Allah sebagai subjek tunggal, sebagaimana ditunjukkan oleh verba tunggal.
- source_word: אֶת אוֹיְבַי
  choice: barisan musuh-musuhku
  rationale: '''Musuh-musuhku'' menerjemahkan objek secara langsung; ''barisan'' ditambahkan secara idiomatis agar gambaran menerobos pihak musuh terasa alami, tanpa mengubah referennya.'
- source_word: בְּיָדִי
  choice: dengan perantaraanku
  rationale: Ungkapan harfiah 'dengan tanganku' menyatakan sarana atau perantaraan. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan Allah sebagai pelaku utama serta Daud sebagai perantara manusia.
- source_word: כְּפֶרֶץ מָיִם
  choice: seperti air menerobos dengan dahsyat
  rationale: Terjemahan ini mempertahankan citra air yang menjebol atau menerobos serta pengulangan akar פרץ, dengan ungkapan yang alami dalam bahasa Indonesia.
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Penghubung ini secara alami menyatakan alasan penamaan tempat tersebut.
- source_word: קָרְאוּ שֵׁם הַמָּקוֹם הַהוּא
  choice: orang menamai tempat itu
  rationale: Verba Ibrani berbentuk jamak tanpa subjek tertentu. 'Orang menamai' mempertahankan subjek jamak tak tentu dan menghasilkan formula penamaan yang alami.
theological_decisions:
- issue: Hubungan tindakan Allah dan perantaraan Daud
  choice: Allah menjadi pelaku utama yang bertindak dengan perantaraan Daud
  alternative: Allah dan Daud digambarkan sebagai pelaku yang terpisah atau kemenangan hanya dikaitkan dengan Daud
  rationale: Verba tunggal menempatkan Allah sebagai subjek tindakan menerobos, sedangkan בְּיָדִי menunjukkan Daud sebagai sarana atau perantara. Terjemahan mempertahankan kedua unsur itu tanpa menghapus salah satunya.
translation_notes:
  register: Bahasa Indonesia modern, naratif, dan bermartabat. Bentuk 'Allah' digunakan untuk אֱלֹהִים; formula penamaan dibuat alami tanpa menghilangkan bentuk jamak tak tentu pada teks sumber.
