  text: וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת הַ/יְלוּדִ֔ים אֲשֶׁ֥ר הָיוּ ל֖/וֹ בִּ/ירוּשָׁלִָ֑ם שַׁמּ֣וּעַ וְ/שׁוֹבָ֔ב נָתָ֖ן וּ/שְׁלֹמֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/004.yaml
  text: 'And these are the names of the children born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
translation:
  language: id
  text: 'Inilah nama anak-anak yang lahir baginya di Yerusalem: Syamua, Sobab, Natan, dan Salomo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Ungkapan ini secara alami memperkenalkan daftar sambil mempertahankan kaitan dengan konteks sebelumnya; dalam bahasa Indonesia, “Inilah” lebih lancar daripada meniru konjungsi Ibrani secara kaku.
- source_word: שְׁמוֹת
  choice: nama
  rationale: Bentuk jamak konstruksi memperkenalkan daftar beberapa orang. Bahasa Indonesia lazim memakai “nama” tanpa penandaan jamak karena kemajemukannya sudah jelas dari daftar.
- source_word: הַיְלוּדִים אֲשֶׁר הָיוּ לוֹ
  choice: anak-anak yang lahir baginya
  rationale: Partisip pasif הַיְלוּדִים berarti orang-orang yang dilahirkan, bukan kata biasa untuk “anak laki-laki.” Frasa “lahir baginya” mempertahankan konstruksi kepunyaan/keberadaan dengan ל tanpa menentukan lebih jauh identitas ibu.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Frasa lokatif yang menunjukkan tempat kelahiran.
- source_word: שַׁמּוּעַ
  choice: Syamua
  rationale: Transliterasi nama pribadi yang mengikuti ejaan Indonesia dan cukup dekat dengan bentuk Ibrani.
- source_word: שׁוֹבָב
  choice: Syobab
  rationale: Transliterasi nama pribadi dengan “sy” untuk bunyi שׁ sesuai kebiasaan ejaan nama Alkitab dalam bahasa Indonesia.
- source_word: נָתָן
  choice: Natan
  rationale: Bentuk nama yang mapan dan dekat dengan Ibrani dalam tradisi bahasa Indonesia.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Bentuk nama yang telah mapan dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern, wajar, dan bermartabat. Diksi “anak-anak yang lahir” mempertahankan nuansa bentuk Ibrani tanpa memakai istilah yang terlalu teknis; karena semua nama yang tercantum adalah laki-laki, konteksnya tetap jelas meski kata Ibraninya bukan kata biasa untuk “anak-anak lelaki.”
