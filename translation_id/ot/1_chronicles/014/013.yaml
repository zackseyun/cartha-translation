lexical_decisions:
- source_word: וַיֹּסִיפוּ עוֹד
  choice: kembali
  rationale: Gabungan verba יסף dan adverbia עוֹד menegaskan pengulangan tindakan. Dalam bahasa Indonesia, "kembali" menyampaikan makna idiomatis itu tanpa menerjemahkan kedua unsur secara kaku.
- source_word: פְּלִשְׁתִּים
  choice: Orang Filistin
  rationale: Bentuk baku dan alami dalam bahasa Indonesia untuk nama kelompok bangsa ini.
- source_word: וַיִּפְשְׁטוּ
  choice: datang dan menyebar
  rationale: Dalam konteks militer, פשט menggambarkan pasukan yang bergerak masuk lalu menyebar atau mengerahkan diri. "Datang dan menyebar" mempertahankan gerak tindakan tanpa membatasinya pada perampokan.
- source_word: בָּעֵמֶק
  choice: di lembah itu
  rationale: Preposisi ב paling wajar dipahami secara lokatif, sedangkan artikel Ibrani dinyatakan dengan "itu" dalam bahasa Indonesia.
