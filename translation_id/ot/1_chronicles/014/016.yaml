base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/016.yaml
  text: So David did as God had commanded him, and they struck down the Philistine army from Gibeon as far as Gezer.
translation:
  language: id
  text: Lalu Daud melakukan seperti yang diperintahkan Allah kepadanya, dan mereka mengalahkan pasukan Filistin[a] dari Gibeon sampai ke Gezer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “perkemahan orang Filistin”; dalam konteks ini tampaknya menunjuk kepada pasukan mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ דָּוִיד כַּאֲשֶׁר
  choice: Daud melakukan seperti
  rationale: Ungkapan ini menyatakan bahwa tindakan Daud sesuai dengan perintah Allah; bentuk Indonesia ini alami dan tetap dekat dengan susunan Ibrani.
- source_word: צִוָּהוּ הָאֱלֹהִים
  choice: yang diperintahkan Allah kepadanya
  rationale: צוה berarti memerintahkan, sedangkan sufiks objek merujuk kepada Daud. Sebutan הָאֱלֹהִים berfungsi sebagai sebutan bagi Allah.
- source_word: וַיַּכּוּ
  choice: mereka mengalahkan
  rationale: Bentuk verba Ibrani ini jamak, sehingga subjeknya dipahami sebagai Daud bersama pasukannya. Dalam konteks peperangan, נכה dapat menyatakan pemukulan yang menghasilkan kekalahan.
- source_word: מַחֲנֵה פְלִשְׁתִּים
  choice: pasukan Filistin
  rationale: מַחֲנֶה secara harfiah berarti perkemahan, tetapi dalam konteks militer dapat secara metonimis menunjuk kepada pasukan yang berkemah. Pilihan ini jelas dalam bahasa Indonesia modern, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: מִגִּבְעוֹן וְעַד גָּזְרָה
  choice: dari Gibeon sampai ke Gezer
  rationale: Konstruksi מִן ... וְעַד menandai rentang atau batas tindakan, yang secara alami dinyatakan dengan 'dari ... sampai ke'.
theological_decisions:
- issue: Subjek jamak וַיַּכּוּ
  choice: mereka, yaitu Daud dan pasukannya
  alternative: Daud sebagai subjek tunggal kolektif
  rationale: Verba Ibrani berbentuk jamak. Terjemahan mempertahankan rincian gramatikal ini tanpa menambahkan identifikasi subjek ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. 'Lalu' menghubungkan ayat dengan rangkaian tindakan sebelumnya; 'melakukan seperti yang diperintahkan' mempertahankan pola ketaatan dalam sumber. Catatan kaki menjaga makna harfiah מַחֲנֶה tanpa membuat teks utama terasa kaku.
