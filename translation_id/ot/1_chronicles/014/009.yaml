  text: וּ/פְלִשְׁתִּ֖ים בָּ֑אוּ וַֽ/יִּפְשְׁט֖וּ בְּ/עֵ֥מֶק רְפָאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/009.yaml
  text: The Philistines came and raided the Valley of Rephaim[a].
translation:
  language: id
  text: Orang Filistin datang dan menyerbu Lembah Refaim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyebar di Lembah Refaim.” Kata kerja Ibrani yang digunakan dapat berarti menggelar atau menyebarkan pasukan, maupun melakukan penyerbuan; konteksnya menunjuk pada gerakan militer yang bermusuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: Orang Filistin
  rationale: Nama bangsa פְלִשְׁתִּים diterjemahkan dengan bentuk baku Indonesia “orang Filistin”. Konjungsi וּ tidak dinyatakan secara tersendiri karena alur naratif sudah jelas dan pembukaan dengan “dan” kurang alami dalam konteks ini.
- source_word: בָּאוּ
  choice: datang
  rationale: Bentuk Qal perfekt orang ketiga jamak dari בוא secara langsung berarti “datang”; dalam narasi Indonesia bentuk ini wajar tanpa penandaan kala tambahan.
- source_word: וַיִּפְשְׁטוּ
  choice: menyerbu
  rationale: Dalam konteks militer, פשט dapat menunjuk pada penyebaran pasukan atau serangan/penyerbuan. “Menyerbu” menyampaikan gerakan militer yang bermusuhan secara alami, sementara kemungkinan arti spasial dipertahankan dalam catatan kaki.
- source_word: בְּ/עֵמֶק
  choice: Lembah
  rationale: עֵמֶק berarti “lembah”. Preposisi בְּ dipadukan secara alami dengan verba transitif “menyerbu”, sehingga tidak perlu diterjemahkan terpisah sebagai “di”.
- source_word: רְפָאִים
  choice: Refaim
  rationale: Di sini רְפָאִים merupakan unsur nama tempat “Lembah Refaim”, sehingga ditransliterasikan menurut pola bunyi yang wajar dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. “Orang Filistin” dipilih sebagai sebutan etnis yang lazim, dan “menyerbu” memberi kelancaran alami tanpa menghapus ambiguitas leksikal, yang dicatat dalam catatan kaki.
