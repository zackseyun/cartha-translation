id: 1CH.14.15
reference: 1 Chronicles 14:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וִ֠/יהִי כְּֽ/שָׁמְעֲ/ךָ֞ אֶת ק֤וֹל הַ/צְּעָדָה֙ בְּ/רָאשֵׁ֣י הַ/בְּכָאִ֔ים אָ֖ז תֵּצֵ֣א בַ/מִּלְחָמָ֑ה כִּֽי יָצָ֤א הָֽ/אֱלֹהִים֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת אֶת מַחֲנֵ֥ה פְלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/015.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then go out to battle, for God has gone out before you to strike down the camp of the Philistines.
translation:
  language: id
  text: Ketika engkau mendengar bunyi langkah-langkah di pucuk pohon-pohon balsam[a], majulah untuk bertempur, sebab Allah telah maju di depanmu untuk menghantam perkemahan orang Filistin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pohon baka”; menurut terjemahan tradisional, “pohon murbei”. Jenis pohon yang dimaksud oleh kata Ibrani ini tidak diketahui dengan pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי כְּשָׁמְעֲךָ
  choice: Ketika engkau mendengar
  rationale: Rangkaian waw + היה dan כ dengan infinitif konstruk memperkenalkan keadaan waktu. Bentuk ini alami dalam bahasa Indonesia tanpa menambahkan penekanan 'segera' yang tidak dinyatakan secara tegas.
- source_word: קוֹל הַצְּעָדָה
  choice: bunyi langkah-langkah
  rationale: קוֹל di sini menunjuk pada sesuatu yang terdengar, sedangkan הַצְּעָדָה berasal dari akar 'melangkah'. Ungkapan ini mempertahankan citra bunyi langkah tanpa terlalu memastikan bahwa yang terdengar ialah pasukan yang berbaris.
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: di pucuk pohon-pohon balsam
  rationale: רָאשׁ dalam bentuk jamak menunjuk bagian atas atau pucuk. Identitas pohon בְּכָאִים tidak pasti; 'pohon balsam' merupakan padanan ilmiah yang umum dan ketidakpastiannya dijelaskan dalam catatan kaki.
- source_word: אָז תֵּצֵא בַמִּלְחָמָה
  choice: majulah untuk bertempur
  rationale: Secara harfiah יצא berarti 'keluar', tetapi dalam konteks militer bersama בַמִּלְחָמָה ungkapan ini berarti bergerak maju memasuki pertempuran. 'Majulah untuk bertempur' alami dan mempertahankan daya perintahnya.
- source_word: כִּי יָצָא הָאֱלֹהִים לְפָנֶיךָ
  choice: sebab Allah telah maju mendahuluimu
  rationale: כִּי memberikan alasan bagi perintah sebelumnya. Bentuk perfektif יָצָא menggambarkan tindakan Allah sebagai telah dimulai, dan לְפָנֶיךָ berarti di depan atau mendahului orang yang disapa.
- source_word: לְהַכּוֹת אֶת מַחֲנֵה פְלִשְׁתִּים
  choice: untuk menghantam perkemahan orang Filistin
  rationale: Hifil נכה dapat berarti menghantam atau mengalahkan. 'Menghantam' menjaga citra tindakan militer tanpa mengganti verba itu dengan hasil yang lebih interpretatif; מַחֲנֶה merujuk pada perkemahan atau pasukan yang berkemah.
theological_decisions:
- issue: Pemaknaan הָאֱלֹהִים
  choice: Allah
  alternative: allah-allah
  rationale: Walaupun bentuk אֱלֹהִים secara morfologis jamak, verba tunggal יָצָא dan konteks menunjukkan bahwa subjeknya adalah Allah Israel, sehingga padanan tunggal 'Allah' tepat.
- issue: Allah mendahului dalam pertempuran
  choice: Allah telah maju mendahuluimu
  alternative: Allah telah keluar di depanmu
  rationale: Pilihan utama mempertahankan gambaran Allah bergerak lebih dahulu dalam konteks militer sambil menghindari ungkapan Indonesia yang kaku. Teks menyatakan tindakan ilahi sebagai alasan untuk maju, tanpa menjelaskan mekanismenya lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'engkau' dipakai karena sapaan tunggal kepada Daud. Struktur dibuat lugas untuk pembaca umum, sementara citra bunyi langkah di pucuk pohon dan gerak Allah mendahului dalam pertempuran dipertahankan.
