  text: and Elishama[a], and Beeliada, and Eliphelet.
translation:
  language: id
  text: Elisama, Beelyada[a], dan Elifelet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam daftar sejajar di 2 Samuel 5:16, nama ini muncul sebagai “Elyada”. Di sini teks Ibrani berbunyi “Beelyada”.
    reason: alternative_reading
lexical_decisions:
- source_word: וֶ/אֱלִישָׁמָע
  choice: dan Elisama
  rationale: 'Konjungsi ו diterjemahkan sebagai “dan”, sedangkan nama אֱלִישָׁמָע ditransliterasikan menurut bentuk yang lazim dan alami dalam bahasa Indonesia: “Elisama”.'
- source_word: וּ/בְעֶלְיָדָע
  choice: Beelyada
  rationale: Bentuk konsonantal Teks Masoret di ayat ini adalah בְעֶלְיָדָע; transliterasi “Beelyada” mempertahankan unsur nama tersebut dan membedakannya dari bentuk “Elyada” dalam daftar sejajar. Konjungsi tidak diulang dalam bahasa Indonesia karena rangkaian tiga nama secara alami memakai “dan” sebelum unsur terakhir.
- source_word: וֶ/אֱלִיפָלֶט
  choice: dan Elifelet
  rationale: Konjungsi ו diterjemahkan sebagai “dan”. Nama אֱלִיפָלֶט ditransliterasikan “Elifelet”, mengikuti penyesuaian bunyi nama Ibrani yang lazim dalam ejaan Indonesia.
