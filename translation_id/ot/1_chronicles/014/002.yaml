base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/002.yaml
  text: And David knew that Yahweh had established him as king over Israel[b][a], for his kingdom had been greatly exalted for the sake of his people Israel.
translation:
  language: id
  text: Daud mengetahui bahwa Yahweh telah mengukuhkan dia sebagai raja atas Israel, sebab kerajaannya telah sangat ditinggikan[a] demi umat-Nya, Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “telah diangkat tinggi.”'
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, Israel sebagai umat Yahweh; frasa Ibrani ini juga dapat dipahami sebagai “umat Daud”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: menyadari
  rationale: Bentuk wayyiqtol dari ידע dapat berarti mengetahui atau sampai pada kesadaran. Dalam konteks perkembangan keadaan yang dipahami Daud, 'menyadari' alami dalam bahasa Indonesia tanpa menentukan proses kognitif secara berlebihan.
- source_word: הֱכִינוֹ
  choice: telah meneguhkan dia
  rationale: Bentuk Hifil dari כון menyatakan membuat kokoh, menetapkan, atau meneguhkan. 'Meneguhkan dia' cocok dengan konteks kedudukan kerajaan dan tetap mempertahankan nuansa kestabilan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterusaksarakan sebagai 'Yahweh', bukan diganti dengan gelar, agar nama pribadi dalam teks sumber tetap terlihat.
- source_word: לְמֶלֶךְ
  choice: sebagai raja
  rationale: Preposisi ל menandai pengangkatan atau kedudukan; 'sebagai raja' merupakan ungkapan Indonesia yang wajar.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Dalam konteks pemerintahan, עַל menunjukkan lingkup kekuasaan; 'atas Israel' menyampaikan hubungan tersebut secara langsung.
- source_word: נִשֵּׂאת לְמַעְלָה
  choice: telah ditinggikan sedemikian rupa
  rationale: Gabungan bentuk Nifal נשׂא dan לְמַעְלָה menggambarkan kerajaan yang diangkat tinggi atau sangat ditinggikan. Pilihan ini alami sekaligus mempertahankan gambaran peninggian.
- source_word: מַלְכוּתוֹ
  choice: kerajaannya
  rationale: מַלְכוּת dapat berarti kerajaan, kekuasaan kerajaan, atau pemerintahan. 'Kerajaannya' mempertahankan pilihan paling langsung sekaligus membiarkan cakupan istilah tetap cukup luas.
- source_word: בַּעֲבוּר
  choice: demi
  rationale: בַּעֲבוּר menyatakan tujuan atau manfaat. 'Demi' secara ringkas menunjukkan bahwa peninggian kerajaan itu berlangsung untuk kepentingan Israel.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: umat-Nya, Israel
  rationale: Frasa ini secara harfiah berarti 'umatnya, Israel'. Kapitalisasi pronomina mengikuti pembacaan utama bahwa akhiran milik merujuk kepada Yahweh, sementara catatan kaki mempertahankan kemungkinan rujukan kepada Daud.
theological_decisions:
- issue: Rujukan akhiran posesif dalam עַמּוֹ ('umatnya')
  choice: '''Nya'' dipahami merujuk kepada Yahweh'
  alternative: '''nya'' merujuk kepada Daud'
  rationale: Konteks paling wajar memandang Israel sebagai umat Yahweh, yang demi kepentingannya kerajaan Daud ditinggikan. Namun, struktur Ibrani memungkinkan rujukan gramatikal kepada Daud, sehingga alternatif dicatat tanpa dihapus.
- issue: Daya penghubung כִּי yang kedua
  choice: 'kausal: ''sebab'''
  alternative: 'penjelas atau isi: ''bahwa'''
  rationale: Anak kalimat kedua paling alami memberi dasar bagi kesadaran Daud. 'Sebab' mempertahankan hubungan kausal, sedangkan kemungkinan penjelas tetap diakui.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama 'Yahweh' dipertahankan. Susunan kalimat dibuat lancar bagi pembaca umum, dengan ambiguitas rujukan posesif dan gambaran harfiah tentang kerajaan yang diangkat tinggi disajikan dalam catatan kaki.
