  yaml_path: translation/ot/1_chronicles/014/003.yaml
  text: And David took more wives in Jerusalem[a], and David fathered more sons and daughters.
translation:
  language: id
  text: Daud mengambil lebih banyak istri di Yerusalem[a], dan Daud menjadi ayah bagi lebih banyak anak laki-laki dan perempuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menikahi lebih banyak perempuan”; bahasa Ibrani secara harfiah berbunyi “mengambil lebih banyak istri.”
    reason: Menunjukkan alternatif kontekstual yang lebih lancar dan menjelaskan bahwa kata kerja Ibrani secara harfiah berarti “mengambil,” sementara unsur “lebih banyak” menerjemahkan עוֹד.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Kata kerja לָקַח pada dasarnya berarti “mengambil”. Dalam konteks ini objeknya adalah para istri; pilihan ini mempertahankan ungkapan sumber tanpa menggantinya dengan kata kerja yang secara khusus berarti menikah.
- source_word: עוֹד
  choice: lagi / lebih banyak
  rationale: Dalam kedua pemakaiannya, עוֹד menunjukkan tambahan. “Lagi” paling alami bersama “beberapa istri”, sedangkan “lebih banyak” jelas menyatakan pertambahan jumlah anak.
- source_word: נָשִׁים
  choice: istri
  rationale: Kata ini dapat berarti “perempuan” atau “istri”, tetapi konteks Daud mengambil mereka menunjukkan hubungan sebagai istri.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi בְּ dipakai secara lokatif dan paling langsung diterjemahkan “di”.
- source_word: וַיּוֹלֶד
  choice: menjadi ayah dari
  rationale: Bentuk verba יָלַד dengan subjek laki-laki menyatakan bahwa ia memperanakkan atau menjadi ayah. “Menjadi ayah dari” akurat dan lebih wajar dalam bahasa Indonesia modern daripada “memperanakkan”.
- source_word: בָּנִים וּבָנוֹת
  choice: anak laki-laki dan perempuan
  rationale: Teks Ibrani menyebut kedua kelompok secara eksplisit; terjemahan ini mempertahankan kekhususan tersebut dan tidak menggeneralisasikannya menjadi sekadar “anak-anak”.
- source_word: דָּוִיד
  choice: Daud
  rationale: Bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Penggambaran naratif tentang poligami Daud
  choice: Ayat diterjemahkan sebagai laporan deskriptif tanpa penilaian moral tambahan.
  alternative: Menambahkan nada yang menyiratkan persetujuan atau kecaman terhadap tindakan Daud.
  rationale: Ayat ini melaporkan bahwa Daud mengambil istri-istri tambahan dan menjadi ayah dari anak-anak lagi, tetapi tidak memberikan penilaian moral secara eksplisit. Terjemahan mempertahankan sikap narasi tersebut.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pengulangan nama “Daud” dipertahankan karena terdapat dalam teks Ibrani dan memberi struktur paralel pada kedua klausa. Istilah “menjadi ayah dari” dipilih untuk menghindari bentuk “memperanakkan” yang kurang alami bagi pembaca umum.
