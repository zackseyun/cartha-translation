  text: Ibhar[a], Elishua[b], and Elpelet.
translation:
  language: id
  text: Yibhar, Elisua,[a] dan Elpelet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam daftar sejajar di 2 Samuel 5:16, nama yang bersesuaian tertulis “Elisama”. Namun, teks Ibrani Tawarikh di sini berbunyi “Elisua”.
    reason: textual_variant
  - marker: b
    text: Nama ini kadang juga ditulis “Elpalet”; “Elpelet” mengikuti vokalisasi teks Ibrani di ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְחָר
  choice: Yibhar
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani. Huruf awal yod dilafalkan sebagai /y/ dan secara wajar ditulis “Y” dalam bahasa Indonesia.
- source_word: אֱלִישׁוּעַ
  choice: Elisua
  rationale: Nama diri ditransliterasikan sesuai bentuk Teks Masoret. Bunyi שׁ disesuaikan dengan ejaan nama Alkitab yang lazim dan mudah dibaca dalam bahasa Indonesia sebagai “s”.
- source_word: אֶלְפָּלֶט
  choice: Elpelet
  rationale: Nama diri ditransliterasikan dengan mengikuti vokalisasi Teks Masoret; bentuk ini lebih dekat dengan אֶלְפָּלֶט daripada alternatif “Elpalet”.
- source_word: וְ
  choice: dan
  rationale: Konjungsi berawalan ini menghubungkan nama-nama dalam sebuah daftar; dalam bahasa Indonesia, konjungsi terakhir dinyatakan secara alami dengan “dan”, sedangkan hubungan antarnama sebelumnya cukup ditandai koma.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan sesuai bentuk daftar nama. Nama-nama ditransliterasikan secara terbaca bagi pembaca Indonesia tanpa menerjemahkan maknanya.
