  text: וַ/יֵּצֵ֥א שֵׁם דָּוִ֖יד בְּ/כָל הָֽ/אֲרָצ֑וֹת וַֽ/יהוָ֛ה נָתַ֥ן אֶת פַּחְדּ֖/וֹ עַל כָּל הַ/גּוֹיִֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/017.yaml
  text: And David’s name went out into all the lands[b][a], and Yahweh put the fear of him on all the nations.
translation:
  language: id
  text: Nama Daud pun tersebar ke semua negeri,[a] dan Yahweh membuat semua bangsa takut kepadanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Nama Daud pun keluar ke semua negeri.” Maksudnya, kemasyhuran Daud tersebar ke berbagai negeri.'
    reason: lexical_alternative
  - marker: b
    text: Kata ganti dalam bahasa Ibrani kemungkinan besar merujuk kepada Daud; artinya, Yahweh menyebabkan semua bangsa takut kepada Daud. Mungkin juga dipahami sebagai rasa takut kepada Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא שֵׁם דָּוִיד
  choice: Nama Daud pun tersebar
  rationale: Secara harfiah, ungkapan ini menyatakan bahwa 'nama Daud keluar'. Dalam bahasa Ibrani, 'nama' di sini merujuk secara metonimis pada kemasyhuran atau reputasinya. 'Nama Daud pun tersebar' mempertahankan gambaran sumber dengan bahasa Indonesia yang wajar.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: ke seluruh negeri
  rationale: Bentuk jamak אֲרָצוֹת menunjuk pada berbagai negeri atau wilayah di sekeliling Israel. 'Ke seluruh negeri' menyampaikan cakupan serta arah penyebaran nama Daud.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri 'Yahweh', bukan diganti dengan gelar.
- source_word: נָתַן אֶת פַּחְדּוֹ עַל
  choice: membuat ... takut kepadanya
  rationale: Ungkapan harfiah 'menaruh ketakutan terhadap dia atas' paling alami disampaikan dalam bahasa Indonesia sebagai konstruksi kausatif 'membuat ... takut kepadanya'.
- source_word: כָּל הַגּוֹיִם
  choice: semua bangsa
  rationale: גּוֹיִם di sini merujuk pada bangsa-bangsa di sekitar Israel; 'semua bangsa' merupakan padanan langsung dan alami.
theological_decisions:
- issue: Rujukan akhiran pronominal pada פַּחְדּוֹ
  choice: 'Akhiran tersebut merujuk kepada Daud: bangsa-bangsa dibuat takut kepada Daud.'
  alternative: 'Akhiran tersebut merujuk kepada Yahweh: bangsa-bangsa memiliki rasa takut kepada Yahweh.'
  rationale: Konteks langsung menyoroti nama dan kemasyhuran Daud setelah kemenangan militernya. Karena itu, rujukan kepada Daud paling koheren, tetapi catatan kaki mempertahankan kesadaran akan kemungkinan gramatikal lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan kalimat mengutamakan kealamian tanpa menghilangkan citra 'nama' dalam teks Ibrani. Partikel 'pun' mencerminkan kelanjutan narasi וַ־.
