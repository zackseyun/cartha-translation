  text: וַ/יִּשְׁאַ֨ל דָּוִ֤יד בֵּ/אלֹהִים֙ לֵ/אמֹ֔ר הַ/אֶֽעֱלֶה֙ עַל פלשתיים וּ/נְתַתָּ֖/ם בְּ/יָדִ֑/י וַ/יֹּ֨אמֶר ל֤/וֹ יְהוָה֙ עֲלֵ֔ה וּ/נְתַתִּ֖י/ם בְּ/יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/010.yaml
  text: And David inquired of God[a], saying, “Shall I go up against the Philistines, and will you give them into my hand?” And Yahweh said to him, “Go up, and I will give them into your hand.”
translation:
  language: id
  text: Lalu Daud meminta petunjuk kepada Allah, katanya, “Haruskah aku maju menyerang orang Filistin? Akankah Engkau menyerahkan mereka ke dalam tanganku[a]?” Yahweh menjawabnya, “Majulah! Aku akan menyerahkan mereka ke dalam tanganmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memberikan mereka ke dalam tanganku.” Ungkapan Ibrani ini berarti menyerahkan mereka ke dalam kuasaku.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: meminta petunjuk kepada Allah
  rationale: Dalam konteks ini, שׁאל dengan בּ menunjuk pada tindakan mencari petunjuk ilahi, bukan sekadar mengajukan pertanyaan biasa.
- source_word: הַאֶעֱלֶה עַל פלשתיים
  choice: Haruskah aku maju menyerang orang Filistin?
  rationale: עלה dalam konteks militer menyatakan gerak maju, sedangkan עַל menandai sasaran yang diserang. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan maksud pertanyaannya.
- source_word: וּנְתַתָּם בְּיָדִי
  choice: Akankah Engkau menyerahkan mereka ke dalam tanganku
  rationale: נתן ביד adalah ungkapan yang berarti menyerahkan seseorang ke dalam kuasa pihak lain. Citra 'tangan' dipertahankan, sedangkan 'menyerahkan' menyampaikan maknanya secara wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: עֲלֵה
  choice: Majulah!
  rationale: Bentuk perintah ini mengulangi verba עלה dari pertanyaan Daud; 'Majulah' sesuai dengan konteks gerakan militer dan menjaga kaitan verbal tersebut.
- source_word: וּנְתַתִּים בְּיָדֶךָ
  choice: Aku akan menyerahkan mereka ke dalam tanganmu
  rationale: Jawaban Yahweh menggemakan kata-kata Daud. Terjemahan yang sejajar mempertahankan simetri sastra teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi, sehingga transliterasi mempertahankan pembedaan antara nama tersebut dan gelar אֲדֹנָי.
- issue: Makna נתן ביד dalam janji kemenangan
  choice: menyerahkan mereka ke dalam tanganmu
  alternative: memberikan mereka ke dalam tanganmu
  rationale: Pilihan ini mempertahankan citra tangan sebagai kuasa tanpa menambahkan penjelasan teologis yang tidak tersurat; alternatif harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'Engkau' dipakai ketika Daud menyapa Allah. Pengulangan antara pertanyaan Daud dan jawaban Yahweh dipertahankan, termasuk citra 'ke dalam tangan'.
