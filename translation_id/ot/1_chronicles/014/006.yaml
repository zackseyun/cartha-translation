  text: Noga, Nefeg, dan Yafia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹגַהּ
  choice: Noga
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan. Bentuk “Noga” mengikuti pelafalan Ibrani dan ejaan Indonesia yang wajar; konsonan akhir הּ tidak perlu ditampilkan sebagai huruf h yang terdengar.
- source_word: נֶפֶג
  choice: Nefeg
  rationale: Nama diri ditransliterasikan langsung; huruf פ tanpa dages dilafalkan /f/, sedangkan ג direpresentasikan dengan g.
- source_word: יָפִיעַ
  choice: Yafia
  rationale: 'Nama diri ditransliterasikan menurut bunyi Ibrani dan kebiasaan ejaan Indonesia: yod menjadi Y, pe tanpa dages menjadi f, dan akhiran guttural tidak dipaksakan ke dalam bentuk yang tidak alami.'
theological_decisions: []
translation_notes:
  register: Daftar nama yang ringkas, bermartabat, dan mudah dibaca dalam bahasa Indonesia modern. Ejaan mengutamakan transliterasi yang dekat dengan pelafalan Ibrani sekaligus alami bagi pembaca Indonesia.
