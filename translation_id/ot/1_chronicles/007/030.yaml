base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/030.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah, and Serah their sister.'
translation:
  language: id
  text: 'Putra-putra Asyer: Yimna, Yiswa, Yiswi, dan Beria, serta Serah, saudara perempuan mereka.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי אָשֵׁר
  choice: Anak-anak Asyer
  rationale: בְּנֵי adalah bentuk jamak konstruksi yang secara langsung berarti “anak-anak lelaki dari.” Namun, karena daftar itu juga menyebut Serah sebagai saudara perempuan mereka, ungkapan Indonesia “anak-anak Asyer” menjadi judul silsilah yang alami tanpa meniadakan jenis kelamin nama-nama yang didaftarkan.
- source_word: יִמְנָה
  choice: Yimna
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani Masoretik; huruf yod awal dipertahankan sebagai Y sesuai kebiasaan Indonesia.
- source_word: יִשְׁוָה
  choice: Yiswa
  rationale: Transliterasi mengikuti vokalisasi Masoretik dan menyesuaikan bunyi konsonan Ibrani ke ejaan Indonesia yang wajar.
- source_word: יִשְׁוִי
  choice: Yiswi
  rationale: Transliterasi mengikuti bentuk Ibrani dalam ayat ini dan mempertahankan perbedaannya dari Yiswa.
- source_word: בְרִיעָה
  choice: Beria
  rationale: Nama diri disajikan dalam bentuk transliterasi Indonesia yang alami.
- source_word: שֶׂרַח
  choice: Serah
  rationale: Transliterasi ini mempertahankan nama Ibrani tersebut dan membedakannya dari Sara, yang merupakan nama Ibrani lain.
- source_word: אֲחוֹתָם
  choice: saudara perempuan mereka
  rationale: Akhiran orang ketiga jamak maskulin berarti “mereka”; frasa itu menyatakan bahwa Serah adalah saudara perempuan dari para lelaki yang baru disebutkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Bentuk “ialah” menandai pembukaan daftar silsilah dengan alami. Nama-nama mengikuti transliterasi yang lazim dan mudah dibaca dalam bahasa Indonesia; catatan varian ejaan Inggris tidak dibawa masuk karena tidak relevan bagi pembaca Indonesia.
