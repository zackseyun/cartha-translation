base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/020.yaml
  text: 'The sons of Ephraim: Shuthelah[a], and Bered his son, and Tahath his son, and Eleadah his son, and Tahath his son.'
translation:
  language: id
  text: 'Anak-anak Efraim: Sutelah[a]; dan Bered, anaknya; dan Tahat, anaknya; dan Eleada, anaknya; dan Tahat, anaknya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam silsilah, kata Ibrani yang berarti “anak” kadang-kadang dapat menunjuk kepada keturunan yang lebih jauh, tetapi pada setiap tahap teks ini secara harfiah berbunyi “anaknya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶפְרַיִם
  choice: Keturunan Efraim
  rationale: Dalam silsilah, bentuk jamak konstruksi בְּנֵי dapat menunjuk kepada anak-anak atau keturunan dalam garis keluarga. Karena daftar berikut bergerak dari satu generasi ke generasi berikutnya, 'Keturunan Efraim' menjadi judul yang alami dan tidak menyiratkan bahwa semua nama sesudahnya adalah anak langsung Efraim.
- source_word: שׁוּתָלַח
  choice: Syutelah
  rationale: Nama diri ditransliterasikan menurut kebiasaan ejaan Indonesia; שׁוּ direpresentasikan dengan 'Syu'.
- source_word: וּבֶרֶד
  choice: Bered
  rationale: Nama diri dipertahankan melalui transliterasi; waw penghubung diwujudkan melalui susunan daftar dan kata 'dan' sebelum unsur terakhir.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: בן dengan sufiks orang ketiga maskulin tunggal secara harfiah berarti 'anaknya'. Makna yang mungkin lebih luas dalam silsilah tidak dimasukkan diam-diam ke dalam teks, tetapi dijelaskan dalam catatan kaki.
- source_word: וְתַחַת
  choice: Tahat
  rationale: תַחַת di sini adalah nama orang, bukan kata depan 'di bawah'; bentuk 'Tahat' mengikuti transliterasi Indonesia yang mudah dibaca.
- source_word: וְאֶלְעָדָה
  choice: Eleada
  rationale: Nama diri ditransliterasikan secara wajar dalam bahasa Indonesia, tanpa menerjemahkan unsur pembentuk namanya.
- source_word: וְתַחַת בְּנוֹ
  choice: dan Tahat anaknya
  rationale: Rumus silsilah yang berulang dipertahankan agar urutan generasi dan pengulangan dalam teks Ibrani tetap tampak.
