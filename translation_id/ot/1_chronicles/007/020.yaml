translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. 'Keturunan' dipakai pada judul silsilah agar struktur berantai ayat terbaca alami, sedangkan 'anaknya' dipertahankan pada setiap mata rantai untuk mencerminkan bunyi harfiah sumber. Ejaan nama disesuaikan dengan kebiasaan transliterasi Indonesia.
