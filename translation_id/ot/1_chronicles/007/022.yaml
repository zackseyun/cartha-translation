  text: וַ/יִּתְאַבֵּ֛ל אֶפְרַ֥יִם אֲבִי/הֶ֖ם יָמִ֣ים רַבִּ֑ים וַ/יָּבֹ֥אוּ אֶחָ֖י/ו לְ/נַחֲמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/022.yaml
  text: And Ephraim their father mourned for many days[a], and his brothers came to comfort him.
translation:
  language: id
  text: Efraim, ayah mereka, berkabung berhari-hari lamanya. Saudara-saudaranya datang untuk menghiburnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: memberinya penghiburan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַבֵּל
  choice: berkabung
  rationale: Bentuk Hitpael dari אבל menyatakan tindakan berkabung karena kematian; konteks ayat sebelumnya mendukung makna ini.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֲבִיהֶם
  choice: ayah mereka
  rationale: Bentuk konstruk dengan akhiran orang ketiga jamak maskulin menunjuk Efraim sebagai ayah dari orang-orang yang disebut sebelumnya.
- source_word: יָמִים רַבִּים
  choice: berhari-hari lamanya
  rationale: Ungkapan ini menyatakan masa yang panjang; padanan Indonesia tersebut alami dan mempertahankan gagasan durasi tanpa menetapkan jumlah tertentu.
- source_word: וַיָּבֹאוּ
  choice: datang
  rationale: Dalam alur narasi, בוא secara wajar menyatakan bahwa saudara-saudara Efraim datang menghampirinya.
- source_word: אֶחָיו
  choice: saudara-saudaranya
  rationale: Makna langsungnya adalah saudara-saudara laki-laki atau saudara sedarah; bahasa Indonesia lazim memakai bentuk umum ini tanpa perlu mempersempit jenis kelamin dalam konteks tersebut.
- source_word: לְנַחֲמוֹ
  choice: untuk menghiburnya
  rationale: Infinitif נחם dalam bentuk ini berarti menghibur atau memberi penghiburan kepada orang yang berduka; 'menghiburnya' ringkas, alami, dan tepat dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kalimat Ibrani dibagi menjadi dua kalimat Indonesia agar alur narasi mudah dipahami. Penanda catatan ditempatkan pada kata yang diterangkannya, yaitu לְנַחֲמוֹ, bukan setelah keterangan waktu.
