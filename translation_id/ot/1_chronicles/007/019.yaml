  text: The sons of Shemida were Ahian[a], Shechem, Likhi, and Aniam.
translation:
  language: id
  text: Anak-anak laki-laki Semida[a] ialah Ahian, Sekhem, Likhi, dan Aniam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keturunan laki-laki Semida.” Dalam silsilah, “anak-anak laki-laki” kadang-kadang dapat menunjuk secara lebih luas kepada keturunan laki-laki, meskipun konteks langsung di sini mendukung arti “anak-anak laki-laki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ialah
  rationale: Dalam daftar silsilah, bentuk ini secara idiomatis memperkenalkan orang-orang yang disebut sebagai anak Semida. Kopula “ialah” menghasilkan kalimat Indonesia yang wajar tanpa menambahkan gagasan ‘menjadi’.
- source_word: בְּנֵי
  choice: anak-anak lelaki
  rationale: Kata ini berbentuk maskulin dan nama-nama yang dicantumkan adalah laki-laki. Ungkapan ini mempertahankan kekhususan silsilah Ibrani, sementara catatan kaki mencatat kemungkinan makna yang lebih luas.
- source_word: שְׁמִידָע
  choice: Semida
  rationale: Nama diri dialihaksarakan ke dalam ejaan Indonesia yang mudah dibaca.
- source_word: אַחְיָן
  choice: Ahian
  rationale: Nama diri dialihaksarakan langsung dengan bentuk yang alami dalam ejaan Indonesia.
- source_word: שֶׁכֶם
  choice: Sekhem
  rationale: Alih aksara mengikuti vokalisasi teks Ibrani dan memakai “kh” untuk bunyi kaf tanpa dages.
- source_word: לִקְחִי
  choice: Likhi
  rationale: Nama diri dialihaksarakan dengan “kh” untuk huruf het agar bentuk Ibraninya tetap tercermin.
- source_word: אֲנִיעָם
  choice: Aniam
  rationale: Nama diri dialihaksarakan langsung ke dalam ejaan Indonesia tanpa menerjemahkan unsur-unsurnya.
