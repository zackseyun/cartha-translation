base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/036.yaml
  text: 'The sons of Zophah: Suah[a], Harnepher, Shual, Beri, and Imrah.'
translation:
  language: id
  text: 'Putra-putra Zofah[a]: Suah, Harnefer, Syual, Beri, dan Yimra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Keturunan Zofah.” Dalam daftar silsilah, kata Ibrani בְּנֵי kadang-kadang dapat menunjuk pada garis keturunan yang lebih luas, meskipun “putra-putra” merupakan terjemahan yang lebih langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak lelaki
  rationale: Bentuk jamak konstruktus dari בֵּן secara langsung berarti “anak-anak lelaki.” Dalam silsilah, istilah ini juga dapat mencakup keturunan yang lebih luas; kemungkinan itu dipertahankan dalam catatan kaki.
- source_word: צוֹפָח
  choice: Zofah
  rationale: Nama diri ditransliterasikan mengikuti bentuk konsonantal dan vokalisasi Teks Masoret dalam ejaan yang wajar bagi pembaca Indonesia.
- source_word: סוּחַ
  choice: Suah
  rationale: Nama diri ditransliterasikan secara dekat dari bentuk Ibrani dan sesuai dengan pola ejaan bahasa Indonesia.
- source_word: חַרְנֶפֶר
  choice: Harnefer
  rationale: Nama diri ditransliterasikan dari bahasa Ibrani; huruf פ tanpa dagesh direpresentasikan sebagai “f.”
- source_word: שׁוּעָל
  choice: Syual
  rationale: Dalam konteks silsilah, bentuk ini adalah nama diri, bukan nomina umum. “Sy” mewakili bunyi שׁ secara alami dalam ejaan Indonesia.
- source_word: בֵרִי
  choice: Beri
  rationale: Transliterasi langsung nama diri sesuai vokalisasi Teks Masoret pada ayat ini.
- source_word: יִמְרָה
  choice: Yimra
  rationale: Nama diri ditransliterasikan dengan “Y” untuk yod awal dan tanpa “h” akhir karena ה di sini tidak perlu dilafalkan sebagai konsonan tersendiri dalam ejaan Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur daftar dengan titik dua mempertahankan bentuk eliptis teks Ibrani. Nama-nama ditransliterasikan agar wajar bagi pembaca Indonesia tanpa menerjemahkan makna nama.
