translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Rumus silsilah dipertahankan secara sejajar, tetapi kata sambung pembuka yang terasa kaku dalam bahasa Indonesia tidak diterjemahkan secara mekanis. Semua nama dieja menurut pola transliterasi Indonesia, dengan bentuk yang telah mapan seperti Benyamin dan Tarsis dipertahankan.
