base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/010.yaml
  text: 'And the sons of Jediael: Bilhan. And the sons of Bilhan: Jeush[a], Benjamin, Ehud, Chenaanah, Zethan, Tarshish, and Ahishahar.'
translation:
  language: id
  text: Anak-anak Yediael ialah Bilhan. Anak-anak Bilhan ialah Yeush[a], Benyamin, Ehud, Kenaana, Zetan, Tarsis, dan Ahisyahar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk Ibrani nama pertama ini tidak lazim (יעיש). Teks ini memakai “Yeush” sebagai nama yang kemungkinan dimaksud dalam silsilah ini; kemungkinan lain ialah “Yaaish” atau “Yaish”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak ... ialah
  rationale: Dalam daftar silsilah ini, בְּנֵי paling wajar berarti anak-anak laki-laki. Struktur nominal Ibrani disampaikan secara alami dalam bahasa Indonesia dengan 'ialah'.
- source_word: יְדִיעֲאֵל
  choice: Yediael
  rationale: Nama diri ditransliterasikan dengan ejaan yang alami bagi pembaca Indonesia dan sedekat mungkin dengan bentuk Ibrani.
- source_word: בִּלְהָן
  choice: Bilhan
  rationale: Nama diri ditransliterasikan langsung; huruf h mempertahankan konsonan Ibrani ה.
- source_word: יעיש
  choice: Yeush
  rationale: Bentuk konsonantal ini tidak lazim dan kemungkinan menunjuk pada nama יְעוּשׁ; 'Yeush' mencerminkan nama yang mungkin dimaksud tanpa menyembunyikan persoalan tekstual, yang dicatat dalam catatan kaki.
- source_word: וּבִנְיָמִן
  choice: Benyamin
  rationale: Dipakai bentuk nama Alkitab yang sudah mapan dalam bahasa Indonesia.
- source_word: וְאֵהוּד
  choice: Ehud
  rationale: Transliterasi langsung nama diri Ibrani.
- source_word: וּכְנַעֲנָה
  choice: Kenaana
  rationale: Nama orang ditransliterasikan sebagai Kenaana, bukan diperlakukan sebagai nama wilayah Kanaan; vokal akhirnya dipertahankan.
- source_word: וְזֵיתָן
  choice: Zetan
  rationale: Transliterasi yang ringkas dan mudah dibaca untuk nama diri זֵיתָן.
- source_word: וְתַרְשִׁישׁ
  choice: Tarsis
  rationale: Bentuk Indonesia yang mapan digunakan; dalam konteks ini Tarsis adalah nama orang, bukan nama tempat.
- source_word: וַאֲחִישָׁחַר
  choice: Ahisyahar
  rationale: Nama ditransliterasikan dengan 'sy' untuk bunyi שׁ dan 'h' untuk ח, sehingga bentuk Ibraninya tetap terlihat dalam ejaan Indonesia.
