revisions:
- from: Mereka dicatat dalam daftar silsilah[a] menurut garis keturunan mereka sebagai kepala kaum keluarga leluhur[b] dan orang-orang yang gagah perkasa. Jumlah mereka 20.200 orang.
  to: Mereka terdaftar dalam silsilah[a] menurut garis keturunan mereka sebagai kepala-kepala kelompok keluarga berdasarkan leluhur mereka[b], orang-orang yang gagah perkasa. Jumlah mereka dua puluh ribu dua ratus orang.
