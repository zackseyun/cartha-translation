base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/009.yaml
  text: 'They were enrolled by genealogy[a], according to their generations, as heads of their fathers’ houses[b], mighty men of valor: twenty thousand two hundred.'
translation:
  language: id
  text: Mereka terdaftar dalam silsilah[a] menurut garis keturunan mereka sebagai kepala-kepala kelompok keluarga berdasarkan leluhur mereka[b], orang-orang yang gagah perkasa. Jumlah mereka dua puluh ribu dua ratus orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “didaftarkan berdasarkan silsilah.” Kata kerja Ibrani ini menunjuk pada pencatatan dalam daftar silsilah.'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan ini menunjuk pada kelompok-kelompok keluarga yang ditentukan oleh leluhur bersama, bukan sekadar keluarga inti.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְיַחְשָׂם
  choice: Mereka dicatat dalam daftar silsilah
  rationale: Bentuk hitpael dari יחשׂ dalam Kitab Tawarikh menunjuk pada pencatatan seseorang dalam daftar silsilah. Ungkapan ini mempertahankan nuansa administratif dan genealogisnya secara alami dalam bahasa Indonesia.
- source_word: לְתֹלְדוֹתָם
  choice: menurut garis keturunan mereka
  rationale: תולדות dapat berarti generasi atau urutan keturunan. Dalam konteks pencatatan silsilah, 'garis keturunan' lebih jelas dan alami daripada terjemahan harfiah 'generasi-generasi'.
- source_word: רָאשֵׁי בֵּית אֲבוֹתָם
  choice: sebagai kepala kaum keluarga leluhur
  rationale: Ungkapan Ibrani ini menunjuk pada para pemimpin unit kekerabatan berdasarkan leluhur. 'Kaum keluarga leluhur' mempertahankan struktur sosial yang dimaksud tanpa memberi kesan bahwa yang dibicarakan hanya keluarga inti.
- source_word: גִּבּוֹרֵי חָיִל
  choice: orang-orang yang gagah perkasa
  rationale: Frasa ini mencakup kekuatan, keberanian, dan kecakapan, termasuk kemampuan militer. Pilihan ini mempertahankan keluasan maknanya tanpa membatasinya hanya pada peperangan.
- source_word: עֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: 20.200 orang
  rationale: Bilangan Ibraninya berarti dua puluh ribu dua ratus. Penulisan dengan angka mudah dibaca dalam bahasa Indonesia modern, dan 'orang' memperjelas satuan yang dihitung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibagi menjadi dua agar daftar keterangan genealogis tetap jelas dan jumlah akhirnya mudah dipahami. Istilah sosial Ibrani dijelaskan secara ringkas melalui catatan kaki.
