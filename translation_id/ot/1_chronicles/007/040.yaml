  terminology: Nama Asyer konsisten dengan pemakaian Indonesia. Istilah sosial-genealogis dan militer dipilih secara wajar. "Para pemimpin terkemuka" merupakan pemadanan yang aman bagi frasa Ibrani yang padat, tanpa memasukkan penafsiran politis atau monarkis yang tidak perlu. Catatan kaki ditambatkan dengan benar pada "silsilah" dan menyajikan alternatif leksikal yang relevan.
