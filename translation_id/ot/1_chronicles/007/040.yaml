source:
  edition: WLC
  text: כָּל אֵ֣לֶּה בְנֵי אָ֠שֵׁר רָאשֵׁ֨י בֵית הָ/אָב֤וֹת בְּרוּרִים֙ גִּבּוֹרֵ֣י חֲיָלִ֔ים רָאשֵׁ֖י הַ/נְּשִׂיאִ֑ים וְ/הִתְיַחְשָׂ֤/ם בַּ/צָּבָא֙ בַּ/מִּלְחָמָ֔ה מִסְפָּרָ֣/ם אֲנָשִׁ֔ים עֶשְׂרִ֥ים וְ/שִׁשָּׁ֖ה אָֽלֶף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/040.yaml
  text: All these were sons of Asher[a], heads of fathers’ houses, select men, mighty warriors, chief leaders; and they were enrolled for service in the army for war. Their number in men was twenty-six thousand.
translation:
  language: id
  text: Mereka semua adalah keturunan Asyer, para kepala kaum keluarga, orang-orang pilihan, para pejuang yang gagah perkasa, dan para pemimpin terkemuka. Mereka terdaftar menurut silsilah[a] untuk bertugas dalam pasukan pada waktu perang. Jumlah mereka 26.000 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “silsilah mereka dicatat.” Kata kerja Ibrani ini sering menunjuk pada pencatatan berdasarkan silsilah dalam kitab Tawarikh.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי אָשֵׁר
  choice: keturunan Asyer
  rationale: Secara harfiah berarti 'anak-anak Asyer', tetapi dalam daftar suku ungkapan ini mencakup para keturunan Asyer dan bukan hanya anak-anak langsungnya.
- source_word: רָאשֵׁי בֵית הָאָבוֹת
  choice: para kepala kaum keluarga
  rationale: Ungkapan sosial-genealogis ini menunjuk kepada para kepala kelompok keluarga leluhur. 'Kaum keluarga' menyampaikan maksudnya secara wajar dalam bahasa Indonesia tanpa mempertahankan idiom Ibrani yang kaku.
- source_word: בְּרוּרִים
  choice: orang-orang pilihan
  rationale: Partisip pasif ini menggambarkan orang-orang yang dipilih atau dianggap unggul; 'orang-orang pilihan' mempertahankan nuansa tersebut dalam konteks militer.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: para pejuang yang gagah perkasa
  rationale: Ungkapan militer ini menyatakan keberanian, kemampuan, dan kekuatan; terjemahan ini alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: רָאשֵׁי הַנְּשִׂיאִים
  choice: para pemimpin terkemuka
  rationale: Frasa yang padat ini menunjukkan kedudukan tinggi di antara para pemimpin. Terjemahan ini mempertahankan gagasan keutamaan tanpa memasukkan nuansa kerajaan yang tidak diperlukan.
- source_word: וְהִתְיַחְשָׂם
  choice: Mereka terdaftar menurut silsilah
  rationale: Bentuk dari יחס dalam Tawarikh lazim menunjuk pada pencatatan atau pendaftaran berdasarkan silsilah. Bentuk pasif Indonesia menyampaikan hasil administratifnya dengan jelas.
- source_word: בַּצָּבָא בַּמִּלְחָמָה
  choice: untuk bertugas dalam pasukan pada waktu perang
  rationale: צָבָא menunjuk pada pasukan atau dinas militer, sedangkan בַּמִּלְחָמָה memberi konteks perang. Rumusan ini jelas dan idiomatis.
- source_word: מִסְפָּרָם אֲנָשִׁים עֶשְׂרִים וְשִׁשָּׁה אָלֶף
  choice: Jumlah mereka 26.000 orang
  rationale: Rumusan ini menyampaikan secara alami bahwa angka tersebut adalah jumlah laki-laki yang dicatat, dengan 'orang' sebagai satuan hitung manusia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-genealogis yang ringkas dan bermartabat. Istilah sosial dan militer dibuat mudah dipahami tanpa menghilangkan unsur pendaftaran silsilah dalam teks Ibrani.
