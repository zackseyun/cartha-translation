  source_fidelity: 'Teks Indonesia dengan setia menyampaikan unsur-unsur utama Ibrani: keturunan Asyer, kepala-kepala kaum keluarga, orang-orang pilihan, pejuang gagah perkasa, pemimpin terkemuka, pendaftaran berdasarkan silsilah untuk dinas pasukan dalam perang, dan jumlah 26.000 orang. Terjemahan "menurut silsilah" secara tepat mempertahankan nuansa refleksif-administratif dari וְהִתְיַחְשָׂם tanpa menghilangkan kaitannya dengan silsilah.'
