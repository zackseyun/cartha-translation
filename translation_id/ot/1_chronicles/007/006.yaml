  text: בִּנְיָמִ֗ן בֶּ֧לַע וָ/בֶ֛כֶר וִ/ידִֽיעֲאֵ֖ל שְׁלֹשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/006.yaml
  text: 'The sons of Benjamin: Bela[a], Beker, and Jediael—three.'
translation:
  language: id
  text: 'Anak-anak Benyamin: Bela, Bekher[a], dan Yediael—tiga orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dapat ditulis “Beker”; bentuk “Bekher” lebih langsung mencerminkan pelafalan Ibrani pada ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְיָמִן
  choice: Benyamin
  rationale: Nama orang dan suku; bentuk “Benyamin” sudah mapan dalam bahasa Indonesia dan sesuai dengan bentuk Ibrani.
- source_word: בֶּלַע
  choice: Bela
  rationale: Transliterasi langsung nama diri Ibrani ke dalam ejaan Indonesia.
- source_word: בֶּכֶר
  choice: Bekher
  rationale: Ejaan “kh” mencerminkan pelafalan kaf tanpa dages dalam teks Masoret dan tetap mudah dibaca dalam bahasa Indonesia.
- source_word: יְדִיעֲאֵל
  choice: Yediael
  rationale: Transliterasi nama Ibrani dengan yod awal sebagai “Y”, sesuai kaidah ejaan Indonesia.
- source_word: שְׁלֹשָׁה
  choice: tiga orang
  rationale: Bilangan ini merangkum jumlah nama yang disebutkan; “orang” ditambahkan secara wajar karena yang dihitung adalah manusia.
- source_word: '[judul silsilah tersirat]'
  choice: 'Anak-anak Benyamin:'
  rationale: Teks Ibrani bersifat eliptis dan tanpa verba. Hubungan keturunan dibuat eksplisit sesuai konteks silsilah tanpa mengubah maksudnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan eliptis silsilah dipertahankan dengan tanda titik dua, sedangkan “anak-anak” dan “orang” ditambahkan agar maknanya alami dan jelas bagi pembaca modern.
