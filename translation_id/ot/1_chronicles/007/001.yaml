  text: 'The sons of Issachar: Tola[a], Puah, Jashub[b], and Shimron—four.'
translation:
  language: id
  text: 'Anak-anak Isakhar: Tola, Pua[a], Yasub[b], dan Simron—empat orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Pua; beberapa terjemahan Inggris memakai bentuk “Puvah,” berdasarkan bentuk paralel dalam daftar silsilah lainnya.'
    reason: alternative_reading
  - marker: b
    text: 'Ibrani: Yasub; dalam Kejadian 46:13, nama yang sejajar berbentuk Iswi.'
    reason: cross_reference
lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  choice: Anak-anak
  rationale: Bentuk ini memperkenalkan daftar silsilah berikutnya. Konjungsi dan preposisi Ibrani tidak perlu dinyatakan tersendiri dalam bahasa Indonesia karena fungsinya terutama sebagai penghubung bagian.
- source_word: יִשָׂשכָר
  choice: Isakhar
  rationale: Nama diri ditransliterasikan menurut bentuk yang wajar dan sudah dikenal dalam bahasa Indonesia.
- source_word: תּוֹלָע
  choice: Tola
  rationale: Nama diri dalam daftar silsilah; ditransliterasikan, bukan diterjemahkan.
- source_word: וּ/פוּאָה
  choice: Pua
  rationale: Mengikuti bentuk yang divokalisasi dalam teks Ibrani Tawarikh, dengan ejaan alami bahasa Indonesia.
- source_word: ישיב
  choice: Yasub
  rationale: Mengikuti bentuk nama dalam ayat ini; bentuk paralel dalam Kejadian 46:13 berbeda dan dicatat dalam catatan kaki.
- source_word: וְ/שִׁמְרוֹן
  choice: dan Simron
  rationale: Nama diri ditransliterasikan dan konjungsinya dinyatakan karena menandai unsur terakhir dalam daftar.
- source_word: אַרְבָּעָה
  choice: empat orang
  rationale: Bilangan ini merangkum jumlah nama yang baru disebutkan; kata 'orang' membuat ungkapan tersebut alami dan jelas dalam bahasa Indonesia.
