base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/005.yaml
  text: And their brothers[a], throughout all the families of Issachar, were mighty men of valor, eighty-seven thousand in all[b], enrolled by genealogy.
translation:
  language: id
  text: Saudara-saudara mereka[a] di seluruh kaum keluarga Isakhar adalah pejuang-pejuang yang gagah perkasa; seluruhnya berjumlah 87.000 orang yang terdaftar menurut silsilah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sanak saudara mereka” atau “kerabat mereka”; kata Ibrani yang berarti “saudara” dapat mencakup anggota kerabat atau kaum dalam konteks marga dan silsilah.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang dicatat dalam daftar silsilah.” Kata kerja Ibrani ini menunjuk pada pencatatan seseorang berdasarkan silsilah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Saudara-saudara mereka
  rationale: Mempertahankan padanan dasar אָח, sementara konteks silsilah memungkinkan cakupan yang lebih luas daripada saudara kandung; kemungkinan itu dijelaskan dalam catatan kaki.
- source_word: לְכֹל מִשְׁפְּחוֹת יִשָׂשכָר
  choice: dari seluruh kaum Isakhar
  rationale: Frasa ini menyatakan cakupan dalam semua kelompok keluarga atau marga Isakhar. 'Kaum' alami dalam konteks kesukuan dan silsilah Indonesia.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: para pejuang yang gagah perkasa
  rationale: Ungkapan baku ini menunjuk kepada orang-orang kuat dan cakap berperang; pilihan ini menyampaikan daya tempur sekaligus keberanian tanpa terdengar usang.
- source_word: שְׁמוֹנִים וְשִׁבְעָה אֶלֶף
  choice: 87.000 orang
  rationale: Menyampaikan bilangan kardinal secara jelas dalam konvensi penulisan angka bahasa Indonesia.
- source_word: הִתְיַחְשָׂם
  choice: yang terdaftar menurut silsilah
  rationale: Bentuk verba ini mengacu pada pencatatan atau pendaftaran berdasarkan garis keturunan, bukan sekadar penyebutan silsilah.
- source_word: לַכֹּל
  choice: Seluruhnya berjumlah
  rationale: Menyatakan jumlah keseluruhan dengan ungkapan Indonesia yang ringkas dan alami.
