translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ayat dibagi menjadi dua kalimat agar susunan nominal Ibrani yang padat tetap mudah dipahami, tanpa menghilangkan hubungan antara jumlah keseluruhan dan pendaftaran silsilah.
