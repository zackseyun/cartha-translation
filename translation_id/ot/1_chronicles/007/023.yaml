base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/023.yaml
  text: Then he went in to his wife[a], and she conceived and bore a son, and he called his name Beriah[c][b], because disaster had been in his house.
translation:
  language: id
  text: Kemudian ia menghampiri istrinya, lalu istrinya mengandung dan melahirkan seorang anak laki-laki. Ia menamai anak itu Beria[a], sebab malapetaka telah menimpa keluarganya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Beria menyerupai kata Ibrani yang berarti “dalam malapetaka” atau “dalam kemalangan”.
    reason: wordplay
  - marker: b
    text: 'Secara harfiah: “sebab malapetaka ada di rumahnya.” “Rumah” di sini dapat berarti rumah tangga atau keluarga.'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיָּבֹא אֶל אִשְׁתּוֹ
  choice: ia menghampiri istrinya
  rationale: Ungkapan בוא אל dengan 'istri' merupakan eufemisme lazim untuk hubungan suami istri. 'Menghampiri istrinya' mempertahankan ungkapan yang santun dan dapat dipahami dalam bahasa Indonesia.
- source_word: וַתַּהַר
  choice: istrinya mengandung
  rationale: Padanan alami untuk הרה dalam kisah kelahiran; subjek diulangi agar rujukannya jelas dalam bahasa Indonesia.
- source_word: וַתֵּלֶד בֵּן
  choice: melahirkan seorang anak laki-laki
  rationale: Padanan alami dan jelas untuk formula Ibrani yang secara harfiah berarti 'melahirkan seorang putra'.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ בְּרִיעָה
  choice: Ia menamai anak itu Beria
  rationale: Menyampaikan formula penamaan Ibrani secara wajar dalam bahasa Indonesia modern.
- source_word: בְּרִיעָה
  choice: Beria
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan pemberian nama dengan penghubung naratif yang alami dan bermartabat.
- source_word: בְרָעָה
  choice: malapetaka
  rationale: Dalam konteks ini רָעָה menunjuk pada bencana atau kemalangan yang menimpa keluarga, bukan kejahatan moral. 'Malapetaka' juga membantu mempertahankan permainan bunyi dengan nama Beria.
- source_word: הָיְתָה בְּבֵיתוֹ
  choice: telah menimpa keluarganya
  rationale: בית dapat menunjuk rumah tangga atau keluarga. Ungkapan eventif ini menyampaikan secara alami bahwa kemalangan telah dialami keluarganya, meskipun bentuk Ibraninya secara harfiah adalah 'ada di rumahnya'.
