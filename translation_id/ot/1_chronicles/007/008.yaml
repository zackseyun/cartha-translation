  terminology: Transliterasi nama konsisten dengan ejaan Indonesia yang lazim dan mempertahankan identitas nama sumber. “Bekher,” “Zemira,” “Yoas,” “Elyoenai,” “Yeremot,” “Abia,” “Anatot,” dan “Alemet” dapat diterima sebagai bentuk Indonesia. Catatan kaki pada Yeremot relevan dan penandanya ditempatkan tepat.
