source:
  edition: WLC
  text: וּ/בְנֵ֣י בֶ֗כֶר זְמִירָ֡ה וְ/יוֹעָ֡שׁ וֶ֠/אֱלִיעֶזֶר וְ/אֶלְיוֹעֵינַ֤י וְ/עָמְרִי֙ וִ/ירֵמ֣וֹת וַ/אֲבִיָּ֔ה וַ/עֲנָת֖וֹת וְ/עָלָ֑מֶת כָּל אֵ֖לֶּה בְּנֵי בָֽכֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/008.yaml
  text: 'And the sons of Becher: Zemirah[a], Joash, Eliezer, Elioenai, Omri, Jeremoth, Abijah, Anathoth, and Alemeth. All these were the sons of Becher.'
translation:
  language: id
  text: Anak-anak lelaki Bekher ialah Zemira, Yoas, Eliezer, Elyoenai, Omri, Yeremot[a], Abia, Anatot, dan Alemet. Mereka semua adalah anak-anak lelaki Bekher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dapat ditulis “Yerimot”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי בֶכֶר
  choice: Anak-anak lelaki Bekher ialah
  rationale: בְּנֵי secara harfiah berarti “anak-anak lelaki dari” dalam rumusan silsilah. Kopula “ialah” ditambahkan agar daftar nama terdengar alami dalam bahasa Indonesia, sedangkan waw penghubung tidak perlu diterjemahkan secara tersurat pada awal ayat yang berdiri sendiri.
- source_word: זְמִירָה
  choice: Zemira
  rationale: Nama diri ditransliterasikan ke bentuk yang wajar dalam tradisi ejaan Alkitab bahasa Indonesia; akhiran ה tidak perlu diwakili dengan huruf h.
- source_word: יוֹעָשׁ
  choice: Yoas
  rationale: Transliterasi Indonesia yang lazim bagi nama Ibrani ini.
- source_word: אֱלִיעֶזֶר
  choice: Eliezer
  rationale: Transliterasi langsung yang sudah lazim dalam bahasa Indonesia.
- source_word: אֶלְיוֹעֵינַי
  choice: Elyoenai
  rationale: Transliterasi yang mempertahankan unsur bunyi nama Ibrani dan mengikuti pola ejaan nama Alkitab dalam bahasa Indonesia.
- source_word: עָמְרִי
  choice: Omri
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: יְרֵמוֹת
  choice: Yeremot
  rationale: Transliterasi Indonesia memakai Y untuk yod dan tidak menambahkan h pada taw akhir; variasi vokal nama ini dicatat dalam catatan kaki.
- source_word: אֲבִיָּה
  choice: Abia
  rationale: Bentuk Indonesia yang alami bagi nama ini; unsur akhir יה diwakili sebagai -ia tanpa memaksakan bentuk transliterasi Inggris.
- source_word: עֲנָתוֹת
  choice: Anatot
  rationale: Nama ini berfungsi sebagai nama orang dalam konteks silsilah dan ditransliterasikan menurut ejaan Indonesia.
- source_word: עָלָמֶת
  choice: Alemet
  rationale: Transliterasi dekat dengan bentuk Masoret dan sesuai dengan pola ejaan Indonesia.
- source_word: כָּל אֵלֶּה בְּנֵי בָכֶר
  choice: Mereka semua adalah anak-anak lelaki Bekher
  rationale: Merender ringkasan Ibrani secara jelas dan alami sambil mempertahankan istilah kekerabatan maskulin.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk “anak-anak lelaki” dipilih untuk mempertahankan ketepatan istilah silsilah Ibrani בנים, sedangkan nama-nama disesuaikan dengan pola transliterasi Indonesia. Penanda catatan ditempatkan pada Yeremot karena catatan tersebut membahas variasi ejaan nama itu.
