  source_fidelity: 'Teks Indonesia secara tepat mencerminkan struktur silsilah Ibrani: בני diterjemahkan eksplisit sebagai “anak-anak lelaki,” kesembilan nama dipertahankan dalam urutan sumber, dan simpulan “Mereka semua adalah anak-anak lelaki Bekher” sesuai dengan כל אלה בני בכר. Penghilangan “Dan” di awal tidak mengubah makna dalam konteks daftar silsilah.'
