base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/013.yaml
  text: 'The sons of Naphtali: Jahziel[a], Guni, Jezer, and Shallum—the sons of Bilhah.'
translation:
  language: id
  text: 'Putra-putra Naftali: Yahziel[a], Guni, Yezer, dan Salum—putra-putra Bilha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam Kejadian 46:24, nama ini berbentuk “Yahzeel”. Teks Tawarikh di sini berbentuk “Yahziel”.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: Anak-anak lelaki Naftali
  rationale: Bentuk jamak konstruktif בְּנֵי secara langsung berarti ‘anak-anak lelaki dari’. Dalam daftar silsilah ini, empat laki-laki disebutkan sebagai anak-anak Naftali.
- source_word: יַחֲצִיאֵל
  choice: Yahziel
  rationale: Nama Ibrani ini dialihaksarakan dengan bentuk yang wajar dan mudah dibaca dalam bahasa Indonesia.
- source_word: וְ/גוּנִי וְ/יֵצֶר וְ/שַׁלּוּם
  choice: Guni, Yezer, dan Salum
  rationale: Nama-nama dialihaksarakan menurut kebiasaan bahasa Indonesia; rangkaian waw diterjemahkan secara alami sebagai daftar dengan ‘dan’ sebelum unsur terakhir.
- source_word: בְּנֵי בִלְהָה
  choice: anak-anak lelaki Bilha
  rationale: Frasa penutup dipertahankan sebagai keterangan genealogis yang melekat pada daftar tersebut. Tanda pisah mencerminkan hubungan aposisional tanpa menjelaskan lebih jauh daripada teks sumber.
