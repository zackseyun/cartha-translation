id: 1CH.7.11
reference: 1 Chronicles 7:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּל אֵ֜לֶּה בְּנֵ֤י יְדִֽיעֲאֵל֙ לְ/רָאשֵׁ֣י הָ/אָב֔וֹת גִּבּוֹרֵ֖י חֲיָלִ֑ים שִׁבְעָֽה עָשָׂ֥ר אֶ֨לֶף֙ וּ/מָאתַ֔יִם יֹצְאֵ֥י צָבָ֖א לַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/011.yaml
  text: All these were sons of Jediael[a], according to the heads of the fathers’ houses, mighty men of valor, seventeen thousand two hundred[d][c][b], able to go out in the army for war.
translation:
  language: id
  text: Semua ini adalah anak-anak Yediael[a], menurut kepala-kepala kaum keluarga[b]—pejuang-pejuang yang gagah perkasa[c]—berjumlah 17.200 orang, yang siap bertugas dalam pasukan untuk berperang[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keturunan Yediael.” Dalam daftar silsilah, istilah Ibrani yang berarti “anak-anak” dapat digunakan dengan arti yang lebih luas.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, para kepala kelompok keluarga atau marga leluhur.
    reason: cultural_note
  - marker: c
    text: Atau “orang-orang gagah perkasa.” Ungkapan ini menunjuk kepada orang-orang yang kuat dan cakap dalam konteks militer.
    reason: lexical_alternative
  - marker: d
    text: Secara harfiah, “orang-orang yang keluar bersama pasukan untuk berperang,” yaitu orang-orang yang tersedia atau layak untuk tugas militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Semua orang ini
  rationale: Ungkapan ini merangkum orang-orang yang baru disebutkan. Kata “orang” ditambahkan secara wajar dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: בְּנֵי יְדִיעֲאֵל
  choice: anak-anak Yediael
  rationale: בְּנֵי secara harfiah berarti “anak-anak,” tetapi dalam silsilah juga dapat mencakup keturunan yang lebih jauh; kemungkinan itu dicatat dalam catatan kaki.
- source_word: לְרָאשֵׁי הָאָבוֹת
  choice: menurut para kepala kaum keluarga
  rationale: Frasa ini mengacu kepada para pemimpin kelompok keluarga atau marga leluhur. Terjemahan ini mempertahankan hubungan penggolongan yang ditandai oleh לְ.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: para pejuang yang gagah perkasa
  rationale: Ungkapan ini menggambarkan orang-orang kuat dan cakap dalam konteks militer. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan unsur keberanian serta kekuatan.
- source_word: שִׁבְעָה עָשָׂר אֶלֶף וּמָאתַיִם
  choice: 17.200 orang
  rationale: Bilangan tepat dalam sensus dipertahankan, dengan penulisan angka yang lazim dalam bahasa Indonesia.
- source_word: יֹצְאֵי צָבָא לַמִּלְחָמָה
  choice: yang siap maju sebagai tentara untuk berperang
  rationale: Secara harfiah frasa ini menyebut orang-orang yang “keluar” dalam pasukan untuk perang; dalam konteks sensus, maksudnya ialah mereka yang tersedia atau layak menjalankan tugas militer.
