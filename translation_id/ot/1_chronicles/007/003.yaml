source:
  edition: WLC
  text: וּ/בְנֵ֥י עֻזִּ֖י יִֽזְרַֽחְיָ֑ה וּ/בְנֵ֣י יִֽזְרַֽחְיָ֗ה מִֽיכָאֵ֡ל וְ֠/עֹבַדְיָה וְ/יוֹאֵ֧ל יִשִּׁיָּ֛ה חֲמִשָּׁ֖ה רָאשִׁ֥ים כֻּלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/003.yaml
  text: 'And the sons of Uzzi: Izrahiah. And the sons of Izrahiah: Michael[a], Obadiah, Joel, and Isshiah—five, all of them heads.'
translation:
  language: id
  text: 'Anak-anak Uzi: Yizrahya. Anak-anak Yizrahya: Mikhael, Obaja, Yoel, dan Yisia—lima orang, semuanya kepala kaum.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “lima kepala, semuanya.” Teks menyebut empat nama anak Yizrahya tetapi memberikan jumlah lima; mungkin Yizrahya ikut dihitung, atau teks mencerminkan persoalan penyalinan kuno.'
    reason: Menjelaskan ungkapan Ibrani yang ringkas dan mempertahankan ketegangan tekstual antara jumlah nama dan angka yang disebutkan tanpa menyelesaikannya secara dogmatis.
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruksi ini merupakan rumus silsilah yang berarti ‘anak-anak dari’. Kata sambung Ibrani tidak perlu selalu dinyatakan dalam daftar silsilah bahasa Indonesia agar kalimat tetap alami.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Nama diri ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: יִזְרַחְיָה
  choice: Yizrahya
  rationale: Transliterasi ini mempertahankan unsur bunyi nama Ibrani dan digunakan secara konsisten pada kedua kemunculannya.
- source_word: מִיכָאֵל
  choice: Mikhael
  rationale: Nama diri ditransliterasikan sesuai bentuk yang lazim dan tetap dekat dengan bunyi Ibrani.
- source_word: וְעֹבַדְיָה
  choice: Obaja
  rationale: Dipakai bentuk nama yang sudah wajar dalam tradisi bahasa Indonesia; prefiks penghubung disampaikan melalui susunan daftar.
- source_word: וְיוֹאֵל
  choice: Yoel
  rationale: Transliterasi langsung dan mudah dibaca dalam bahasa Indonesia.
- source_word: יִשִּׁיָּה
  choice: Yisia
  rationale: Transliterasi yang terbaca alami dalam bahasa Indonesia sambil mencerminkan bentuk konsonantal Ibrani.
- source_word: חֲמִשָּׁה
  choice: lima orang
  rationale: Bilangan diterjemahkan secara langsung, dengan ‘orang’ ditambahkan demi kejelasan alami tanpa menyelesaikan ketegangan antara empat nama yang tercantum dan jumlah lima.
- source_word: רָאשִׁים
  choice: kepala kaum
  rationale: רָאשִׁים secara harfiah berarti ‘kepala-kepala’ dan dalam konteks silsilah menunjuk orang-orang yang mengepalai kelompok keluarga atau kaum. ‘Kepala kaum’ mempertahankan citra sumber sekaligus menjelaskan fungsinya.
- source_word: כֻּלָּם
  choice: semuanya
  rationale: Mempertahankan penegasan bahwa seluruh kelompok yang dihitung berkedudukan sebagai kepala.
