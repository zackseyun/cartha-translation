base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/016.yaml
  text: Maacah the wife of Machir bore a son[a], and she called his name Peresh; and the name of his brother was Sheresh[b], and his sons were Ulam and Rakem.
translation:
  language: id
  text: Maakha, istri Makhir, melahirkan seorang anak laki-laki dan menamainya Peres.[a] Nama saudara laki-laki Peres ialah Seres, dan anak-anak laki-laki Seres ialah Ulam dan Rekem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “memanggil namanya Peres.”'
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani berbunyi “anak-anak lelakinya”; dalam rangkaian silsilah ini, rujukannya dipahami sebagai Seres.
    reason: referent_clarification
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: melahirkan
  rationale: Bentuk wayyiqtol dari ילד dalam catatan silsilah menyatakan bahwa Maakha melahirkan anak tersebut; pilihan ini alami dan jelas dalam bahasa Indonesia.
- source_word: אֵשֶׁת מָכִיר
  choice: istri Makhir
  rationale: Frasa konstruksi ini mengidentifikasi Maakha melalui hubungannya dengan Makhir dan dapat diterjemahkan secara ringkas serta alami.
- source_word: בֵּן
  choice: seorang anak laki-laki
  rationale: Nomina tunggal ini secara khusus berarti anak laki-laki dalam konteks silsilah, bukan sekadar anak tanpa penandaan jenis kelamin.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: dan menamainya
  rationale: Secara harfiah berarti 'dan ia menyebut namanya'; 'menamainya' menyampaikan idiom Ibrani itu secara alami tanpa mengubah makna.
- source_word: פֶּרֶשׁ
  choice: Peres
  rationale: Nama diri ditransliterasikan ke dalam bentuk yang mudah dibaca oleh pembaca bahasa Indonesia.
- source_word: וְשֵׁם אָחִיו
  choice: Saudara Peres bernama
  rationale: Ungkapan nominal Ibrani secara harfiah berbunyi 'dan nama saudaranya'; penyebutan kembali Peres memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: שָׁרֶשׁ
  choice: Seres
  rationale: Nama diri ditransliterasikan ke dalam ejaan yang wajar bagi pembaca bahasa Indonesia.
- source_word: וּבָנָיו
  choice: dan anak-anak lelaki Seres
  rationale: בָּנִים dalam silsilah ini menunjuk kepada keturunan laki-laki. Nama Seres diulangi karena akhiran pronominal tunggal maskulin paling dekat merujuk kepadanya, sementara bentuk 'anak-anaknya' dapat terasa kurang jelas dalam bahasa Indonesia.
- source_word: אוּלָם וָרָקֶם
  choice: Ulam dan Rekem
  rationale: Kedua nama diri ditransliterasikan, dan konjungsi Ibrani pada nama kedua diterjemahkan dengan 'dan'.
