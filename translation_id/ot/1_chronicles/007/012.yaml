  text: And Shuppim and Huppim were the sons of Ir[b][a]; Hushim was the son of Aher.
translation:
  language: id
  text: Supim dan Hupim[b] adalah anak-anak Ir; Husim, anak-anak Aher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani berbunyi “anak-anak Aher”. Teks ini memakai bentuk jamak “anak-anak” sesudah nama tunggal Husim, sehingga susunannya sukar. Sebagian memahami Aher sebagai nama diri; yang lain memahaminya sebagai “yang lain”.
    reason: lexical_alternative
  - marker: b
    text: Berdasarkan daftar silsilah yang berkaitan, beberapa tradisi menuliskan nama-nama ini dengan bentuk lain, seperti “Sefufam” dan “Hufam”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשֻׁפִּם וְחֻפִּם
  choice: Supim dan Hupim
  rationale: Keduanya diperlakukan sebagai nama diri dan ditransliterasikan menurut bentuk Teks Masoret. Konjungsi Ibrani diungkapkan secara alami dengan “dan” tanpa harus membuka ayat dengan “Dan” dalam bahasa Indonesia.
- source_word: בְּנֵי עִיר
  choice: adalah anak-anak Ir
  rationale: בְּנֵי berbentuk jamak dan dalam daftar silsilah paling wajar berarti “anak-anak”. Kata “adalah” melengkapi klausa tanpa verba agar alami dalam bahasa Indonesia, sedangkan עִיר ditransliterasikan sebagai nama Ir.
- source_word: חֻשִׁם
  choice: Husim
  rationale: Nama diri ini ditransliterasikan langsung ke dalam ejaan Indonesia; bunyi š diwakili oleh “s” sebagaimana lazim dalam nama-nama Alkitab bahasa Indonesia.
- source_word: בְּנֵי אַחֵר
  choice: adalah anak Aher
  rationale: Terjemahan utama memahami אַחֵר sebagai nama diri Aher dan menghaluskan ketidakselarasan antara nama tunggal Husim dan bentuk jamak בְּנֵי menjadi “anak”. Kesulitan bentuk Ibrani dan kemungkinan arti lain tetap dicatat dalam catatan kaki.
