base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/004.yaml
  text: And with them, by their generations, according to their fathers' houses, were 36,000 troops for the army of war, for they had many wives and sons.
translation:
  language: id
  text: Bersama mereka, menurut keturunan mereka, menurut keluarga-keluarga dari pihak ayah mereka, ada 36.000 kelompok pasukan untuk perang.[a] Sebab mereka mempunyai banyak istri[b] dan anak laki-laki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini secara harfiah memuat rangkaian “kelompok-kelompok pasukan untuk perang”; ungkapan militer yang padat ini juga dapat diterjemahkan “kesatuan-kesatuan tentara untuk bertempur.”
    reason: lexical_alternative
  - marker: b
    text: Atau “perempuan”. Kata Ibrani נָשִׁים dapat berarti “perempuan” maupun “istri”, tetapi “istri” paling sesuai dengan konteks silsilah dan keluarga di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲלֵיהֶם
  choice: Bersama mereka
  rationale: Dalam konteks daftar sensus, עַל dengan sufiks pronominal menyatakan orang-orang yang menyertai atau terhitung bersama mereka, bukan posisi secara harfiah ‘di atas mereka’.
- source_word: לְתֹלְדוֹתָם
  choice: menurut silsilah
  rationale: תּוֹלְדוֹת di sini menunjuk pada pengelompokan berdasarkan keturunan; ‘silsilah’ menyampaikan konteks genealogis secara wajar dalam bahasa Indonesia.
- source_word: לְבֵית אֲבוֹתָם
  choice: menurut kaum keluarga leluhur mereka
  rationale: Ungkapan ini menunjuk pada rumah-rumah pihak ayah atau kelompok keluarga leluhur. ‘Kaum keluarga leluhur’ mempertahankan struktur sosial-genealogis tanpa terdengar terlalu harfiah.
- source_word: גְּדוּדֵי צְבָא מִלְחָמָה
  choice: pasukan dalam bala tentara untuk berperang
  rationale: Terjemahan ini mempertahankan rangkaian istilah militer גְּדוּדֵי, צְבָא, dan מִלְחָמָה, sambil tetap terbaca alami dalam bahasa Indonesia.
- source_word: שְׁלֹשִׁים וְשִׁשָּׁה אָלֶף
  choice: '36.000'
  rationale: Angka dipertahankan secara tepat dengan format pemisah ribuan yang lazim dalam bahasa Indonesia.
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi besarnya jumlah pasukan tersebut.
- source_word: הִרְבּוּ
  choice: mempunyai banyak
  rationale: Hifil dari רבה menyatakan membuat menjadi banyak atau memperbanyak. Dengan objek ‘istri dan anak laki-laki’, ungkapan idiomatis Indonesianya adalah ‘mempunyai banyak’.
- source_word: נָשִׁים
  choice: istri
  rationale: נָשִׁים dapat berarti ‘perempuan’ atau ‘istri’. Dalam konteks keluarga dan silsilah, serta karena dipasangkan dengan ‘anak laki-laki’, ‘istri’ paling sesuai.
- source_word: וּבָנִים
  choice: dan anak laki-laki
  rationale: בָּנִים secara harfiah berarti ‘anak-anak laki-laki’; makna ini dipertahankan karena konteksnya adalah silsilah dan sensus.
