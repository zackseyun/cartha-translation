  naturalness: Teks dapat dipahami, tetapi "menurut silsilah dan kaum keluarga leluhur mereka" kurang idiomatis dan kurang jelas hubungan kedua frasa itu. "Menurut keturunan mereka, menurut keluarga-keluarga dari pihak ayah mereka" lebih jelas dalam bahasa Indonesia baku tanpa menjadi terlalu teknis.
  terminology: '"Istri" tepat sebagai pilihan utama untuk נָשִׁים, dengan alternatif "perempuan" dalam catatan kaki. "Anak laki-laki" tepat untuk בָנִים. Untuk frasa militer yang padat, "kelompok-kelompok pasukan untuk perang" lebih mencerminkan bentuk jamak גְּדוּדֵי dan tetap wajar.'
