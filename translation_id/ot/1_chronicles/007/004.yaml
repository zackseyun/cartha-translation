  to: Bersama mereka, menurut keturunan mereka, menurut keluarga-keluarga dari pihak ayah mereka, ada 36.000 kelompok pasukan untuk perang.[a] Sebab mereka mempunyai banyak istri[b] dan anak laki-laki.
  rationale: Revisi membedakan secara eksplisit pengelompokan menurut keturunan dan menurut keluarga dari garis ayah, memperbaiki ketepatan istilah sosial-genealogis tanpa menambahkan penafsiran. Frasa militer dirapikan agar bentuk jamak dan kepadatan ungkapan Ibrani tetap terwakili. Catatan kaki diperbarui agar sesuai dengan padanan yang direvisi.
