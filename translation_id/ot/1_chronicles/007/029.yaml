  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַל יְדֵ֣י בְנֵי מְנַשֶּׁ֗ה בֵּית שְׁאָ֤ן וּ/בְנֹתֶ֨י/הָ֙ תַּעְנַ֣ךְ וּ/בְנֹתֶ֔י/הָ מְגִדּ֥וֹ וּ/בְנוֹתֶ֖י/הָ דּ֣וֹר וּ/בְנוֹתֶ֑י/הָ בְּ/אֵ֨לֶּה֙ יָשְׁב֔וּ בְּנֵ֥י יוֹסֵ֖ף בֶּן יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/029.yaml
  text: And along the borders of the sons of Manasseh were Beth-shean and its daughter towns[a], Taanach and its daughter towns, Megiddo and its daughter towns, Dor and its daughter towns[b]. In these lived the sons of Joseph son of Israel.
translation:
  language: id
  text: Di sepanjang perbatasan keturunan Manasye terdapat Bet-Sean dan kota-kota di sekitarnya[a], Taanakh dan kota-kota di sekitarnya, Megido dan kota-kota di sekitarnya, serta Dor dan kota-kota di sekitarnya.[b] Di tempat-tempat itulah keturunan Yusuf, anak Israel, tinggal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak perempuannya”; maksudnya permukiman-permukiman bawahan yang berada di sekitar dan bergantung pada kota utama.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani yang diterjemahkan “di sepanjang perbatasan keturunan Manasye” juga dapat diterjemahkan “di sisi keturunan Manasye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יְדֵי
  choice: Di sepanjang perbatasan
  rationale: Dalam konteks daftar wilayah, ungkapan ini menunjukkan letak berdampingan atau sepanjang batas wilayah, bukan arti harfiah 'di tangan'.
- source_word: בְנֵי מְנַשֶּׁה
  choice: keturunan Manasye
  rationale: Ungkapan harfiah 'anak-anak Manasye' menunjuk pada kelompok suku; 'keturunan Manasye' lebih alami dan jelas dalam bahasa Indonesia modern.
- source_word: בֵּית שְׁאָן
  choice: Bet-Sean
  rationale: Transliterasi Indonesia yang mengikuti bentuk Masoretik nama tempat tersebut.
- source_word: וּבְנֹתֶיהָ / וּבְנוֹתֶיהָ
  choice: dan kota-kota di sekitarnya
  rationale: Secara harfiah berarti 'anak-anak perempuannya', yakni permukiman bawahan yang bergantung pada sebuah kota induk; pilihan ini menyampaikan hubungan geografisnya dengan wajar.
- source_word: תַּעְנַךְ
  choice: Taanakh
  rationale: Transliterasi nama tempat yang sesuai dengan bentuk Ibrani dan kebiasaan ejaan Indonesia.
- source_word: מְגִדּוֹ
  choice: Megido
  rationale: Transliterasi nama tempat dalam ejaan Indonesia.
- source_word: דּוֹר
  choice: Dor
  rationale: Transliterasi langsung nama tempat.
- source_word: בְאֵלֶּה
  choice: Di tempat-tempat itulah
  rationale: Kata tunjuk ini merujuk kembali pada kota-kota dan permukiman yang baru disebut; penambahan 'tempat-tempat' memperjelas acuannya secara alami.
- source_word: יָשְׁבוּ
  choice: tinggal
  rationale: Dalam konteks ini verba tersebut menyatakan keberadaan sebagai penghuni, tanpa harus menyiratkan tindakan pendudukan awal.
- source_word: בְנֵי יוֹסֵף
  choice: keturunan Yusuf
  rationale: Ungkapan genealogis ini menunjuk pada kelompok-kelompok suku yang berasal dari Yusuf.
- source_word: בֶּן יִשְׂרָאֵל
  choice: anak Israel
  rationale: Mempertahankan keterangan genealogis yang mengidentifikasi Yusuf sebagai anak Israel.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah genealogis diterjemahkan secara kontekstual sebagai 'keturunan', sedangkan metafora permukiman bawahan dijelaskan melalui catatan kaki. Nama tempat ditransliterasikan menurut ejaan Indonesia.
