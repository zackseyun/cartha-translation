  text: וְ/רֶ֣פַח בְּנ֗/וֹ וְ/רֶ֧שֶׁף וְ/תֶ֛לַח בְּנ֖/וֹ וְ/תַ֥חַן בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/025.yaml
  text: Rephah his son[a], Resheph, Telah his son, Tahan his son.
translation:
  language: id
  text: Refah, anaknya[a], Resef, Telah, anaknya, dan Tahan, anaknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Silsilah Ibrani sering tidak mencantumkan kata kerja secara tersurat. Bagian ini merupakan rangkaian keturunan: “Refah, anaknya, Resef, Telah, anaknya, dan Tahan, anaknya.”'
    reason: cultural_note
lexical_decisions:
- source_word: רֶפַח
  choice: Refah
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia yang wajar; huruf פ tanpa dagesh direpresentasikan sebagai f.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Nomina dengan sufiks orang ketiga tunggal maskulin diterjemahkan secara idiomatis sebagai 'anaknya'. Pengulangan rumus silsilah dipertahankan.
- source_word: רֶשֶׁף
  choice: Resef
  rationale: Dalam konteks silsilah, bentuk ini adalah nama orang, bukan nomina umum; karena itu ditransliterasikan. Konsonan שׁ direpresentasikan sebagai s dan פ tanpa dagesh sebagai f sesuai bentuk Indonesia yang mudah dibaca.
- source_word: תֶלַח
  choice: Telah
  rationale: Nama diri ditransliterasikan; konsonan akhir ח diwakili dengan h dalam ejaan Indonesia yang sederhana dan mudah dibaca.
- source_word: תַחַן
  choice: Tahan
  rationale: Nama diri ditransliterasikan ke bentuk Indonesia yang mudah dibaca, dengan ח diwakili oleh h.
- source_word: וְ
  choice: koma / dan
  rationale: Konjungsi Ibrani menghubungkan unsur-unsur dalam rangkaian silsilah. Koma dan 'dan' digunakan agar daftar terdengar alami dalam bahasa Indonesia tanpa mengubah strukturnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Bentuk eliptis teks Ibrani dipertahankan, sementara tanda baca membantu pembaca mengenali susunan daftar silsilah.
