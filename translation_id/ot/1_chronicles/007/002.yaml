base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/002.yaml
  text: 'The sons of Tola: Uzzi[a], Rephaiah, Jeriel, Jahmai, Ibsam, and Samuel, heads of their fathers’ houses belonging to Tola, mighty men of valor according to their generations[c][b]. Their number in the days of David was twenty-two thousand six hundred.'
translation:
  language: id
  text: Anak-anak Tola ialah Uzi, Refaya, Yeriel, Yahmai, Yibsam, dan Samuel. Mereka adalah para kepala kaum keluarga[a] dari garis Tola dan orang-orang gagah perkasa[b], menurut garis keturunan mereka[c]. Pada zaman Daud, jumlah mereka 22.600 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “para kepala keluarga leluhur mereka” atau “para pemimpin kaum keluarga mereka.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “para pejuang perkasa” atau “pahlawan-pahlawan yang tangguh.”
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “berdasarkan generasi mereka” atau “menurut silsilah mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי תוֹלָע
  choice: Anak-anak Tola ialah
  rationale: Dalam konteks silsilah, בְּנֵי paling langsung berarti anak-anak; penghubung awal tidak perlu diterjemahkan tersendiri agar bahasa Indonesia alami.
- source_word: עֻזִּי וּרְפָיָה וִירִיאֵל וְיַחְמַי וְיִבְשָׂם וּשְׁמוּאֵל
  choice: Uzi, Refaya, Yeriel, Yahmai, Yibsam, dan Samuel
  rationale: Nama-nama ditransliterasikan sesuai pola yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: para kepala kaum keluarga
  rationale: רָאשִׁים berarti kepala atau pemimpin, sedangkan בֵּית אָבוֹת menunjuk unit kekerabatan leluhur; 'kaum keluarga' menyampaikan fungsi sosialnya secara alami.
- source_word: לְתוֹלָע
  choice: dari garis Tola
  rationale: Frasa ini menghubungkan para kepala tersebut dengan kelompok keturunan Tola; 'dari garis Tola' menyatakan afiliasi genealogis tanpa berlebihan.
- source_word: גִּבּוֹרֵי חַיִל
  choice: para pejuang perkasa
  rationale: Ungkapan ini dapat menyatakan keberanian dan kemampuan militer; konteks penghitungan laki-laki dalam silsilah mendukung nuansa bela perang.
- source_word: לְתֹלְדוֹתָם
  choice: menurut garis keturunan mereka
  rationale: תּוֹלְדוֹת dalam daftar silsilah menunjuk generasi, catatan silsilah, atau pengelompokan berdasarkan keturunan.
- source_word: מִסְפָּרָם בִּימֵי דָוִיד עֶשְׂרִים וּשְׁנַיִם אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: Pada zaman Daud, jumlah mereka 22.600 orang
  rationale: Susunan diubah secara wajar dalam bahasa Indonesia, sementara angka dan kerangka waktunya dipertahankan tepat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur silsilah dibuat alami bagi pembaca umum; ambiguitas istilah kekerabatan, status kepemimpinan, kecakapan militer, dan pengelompokan genealogis dipertahankan melalui catatan kaki.
