revisions:
- from: Anak-anak Tola ialah Uzi, Refaya, Yeriel, Yahmai, Yibsam, dan Samuel. Mereka adalah para kepala kaum keluarga[a] dari garis Tola dan para pejuang perkasa[b], menurut garis keturunan mereka[c]. Pada zaman Daud, jumlah mereka 22.600 orang.
  to: Anak-anak Tola ialah Uzi, Refaya, Yeriel, Yahmai, Yibsam, dan Samuel. Mereka adalah para kepala kaum keluarga[a] dari garis Tola dan orang-orang gagah perkasa[b], menurut garis keturunan mereka[c]. Pada zaman Daud, jumlah mereka 22.600 orang.
  rationale: Revisi mengganti istilah yang terlalu khusus “para pejuang perkasa” dengan “orang-orang gagah perkasa”, yang lebih baik mempertahankan keluasan גִּבּוֹרֵי חַיִל sambil tetap wajar dalam bahasa Indonesia. Catatan a juga diperbaiki agar tidak menyajikan parafrasa yang kurang tepat sebagai terjemahan harfiah. Susunan, nama, afiliasi dengan Tola, pengelompokan genealogis, dan jumlah dipertahankan.
