reference: 1 Chronicles 7:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְנֵ֣י יַפְלֵ֔ט פָּסַ֥ךְ וּ/בִמְהָ֖ל וְ/עַשְׁוָ֑ת אֵ֖לֶּה בְּנֵ֥י יַפְלֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/033.yaml
  text: 'The sons of Japhlet: Pasach[a], Bimhal, and Ashvath[b]. These were the sons of Japhlet.'
translation:
  language: id
  text: Anak-anak Yaflet ialah Pasakh[a], Bimhal, dan Asywat. Mereka inilah anak-anak Yaflet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "Pasah"; alih aksara nama Ibrani dapat berbeda-beda.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי
  choice: anak-anak
  rationale: Dalam daftar silsilah ini, bentuk jamak konstruktus dari בֵּן paling wajar menunjuk kepada anak-anak laki-laki yang disebutkan; bahasa Indonesia lazim memakai 'anak-anak' tanpa perlu menambahkan 'laki-laki' karena nama-nama yang didaftarkan menjelaskan maksudnya.
- source_word: יַפְלֵט
  choice: Yaflet
  rationale: Nama diri dialihaksarakan dengan ejaan yang alami bagi pembaca Indonesia; huruf awal yod diwakili dengan 'Y' dan konsonan akhir tet dengan 't'.
- source_word: פָּסַךְ
  choice: Pasakh
  rationale: Nama diri dialihaksarakan; 'kh' mempertahankan bunyi frikatif dari kaf akhir. Bentuk 'Pasah' dicatat sebagai alternatif karena tradisi alih aksara nama dapat berbeda.
- source_word: וּבִמְהָל
  choice: Bimhal
  rationale: Konjungsi waw diterjemahkan terpisah dalam rangkaian nama, sedangkan nama diri dialihaksarakan sebagai 'Bimhal'.
- source_word: וְעַשְׁוָת
  choice: Asywat
  rationale: 'Nama diri dialihaksarakan menurut kebiasaan Indonesia: שׁ menjadi ''sy'', sedangkan waw dalam rangkaian tersebut diwakili dengan ''w''.'
- source_word: אֵלֶּה
  choice: Mereka inilah
  rationale: Ungkapan ini mempertahankan fungsi penunjuk dan penegasan dalam formula penutup silsilah, sekaligus terdengar alami dalam bahasa Indonesia tanpa memaksakan perbedaan kala kini atau lampau yang tidak ditandai pada verba Ibrani.
- source_word: בְּנֵי יַפְלֵט
  choice: anak-anak Yaflet
  rationale: Pengulangan frasa pada akhir ayat dipertahankan agar struktur rangkuman teks Ibrani tetap tampak.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat sesuai gaya daftar silsilah. Nama-nama mengikuti alih aksara yang mudah dibaca dalam bahasa Indonesia. Penanda [a] dicantumkan langsung setelah nama yang dijelaskan.
