  text: וּ/בְנֵ֣י בֶ֗לַע אֶצְבּ֡וֹן וְ/עֻזִּ֡י וְ֠/עֻזִּיאֵל וִ/ירִימ֨וֹת וְ/עִירִ֜י חֲמִשָּׁ֗ה רָאשֵׁי֙ בֵּ֣ית אָב֔וֹת גִּבּוֹרֵ֖י חֲיָלִ֑ים וְ/הִתְיַחְשָׂ֗/ם עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וּ/שְׁלֹשִׁ֖ים וְ/אַרְבָּעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/007.yaml
  text: 'And the sons of Bela: Ezbon[a], Uzzi, Uzziel, Jerimoth, and Iri—five heads of fathers’ houses, mighty men of valor; and their genealogical enrollment was twenty-two thousand and thirty-four.'
translation:
  language: id
  text: Anak-anak Bela ialah Ezbon, Uzi, Uziel, Yerimot, dan Iri. Kelima orang ini adalah para kepala kaum keluarga dan para pejuang yang gagah perkasa. Jumlah mereka yang terdaftar menurut silsilah[a] ialah 22.034 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang dicatat dalam daftar silsilah mereka.” Kata Ibrani ini mengacu pada pencatatan seseorang dalam daftar berdasarkan silsilah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי בֶלַע
  choice: Anak-anak Bela ialah
  rationale: בְּנֵי secara harfiah berarti “anak-anak lelaki” dan dapat pula menunjuk keturunan. Karena ayat ini langsung menyebut lima nama laki-laki, “anak-anak Bela” alami dan cukup tepat.
- source_word: אֶצְבּוֹן וְעֻזִּי וְעֻזִּיאֵל וִירִימוֹת וְעִירִי
  choice: Ezbon, Uzi, Uziel, Yerimot, dan Iri
  rationale: Nama-nama pribadi ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia; huruf awal י pada יְרִימוֹת ditampilkan sebagai Y.
- source_word: חֲמִשָּׁה רָאשֵׁי בֵּית אָבוֹת
  choice: Kelima orang ini adalah para kepala kaum keluarga
  rationale: רָאשֵׁי menyatakan kepemimpinan, sedangkan בֵּית אָבוֹת adalah istilah sosial-genealogis bagi kelompok keluarga leluhur. “Kaum keluarga” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “rumah para ayah” tanpa menghilangkan sifat genealogisnya.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: para pejuang yang gagah perkasa
  rationale: Ungkapan ini menunjuk orang-orang kuat, cakap, atau berani, khususnya dalam konteks kemiliteran. “Pejuang yang gagah perkasa” mempertahankan daya ungkap Ibraninya dengan bahasa Indonesia yang jelas.
- source_word: וְהִתְיַחְשָׂם
  choice: mereka yang terdaftar menurut silsilah
  rationale: Bentuk Hitpael dari יחס dalam Tawarikh mengacu pada pencatatan atau pendaftaran berdasarkan silsilah. Susunan ini juga cocok dengan jumlah orang yang menyusul.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף וּשְׁלֹשִׁים וְאַרְבָּעָה
  choice: 22.034 orang
  rationale: Bilangan Ibrani berarti 22.000 ditambah 34. Angka ditulis dengan format Indonesia agar mudah dibaca; “orang” ditambahkan secara wajar untuk memperjelas bahwa yang dihitung adalah anggota yang terdaftar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur ayat dipecah menjadi tiga kalimat agar daftar nama, kedudukan kelima orang, dan jumlah pendaftaran mudah dipahami. Istilah teknis genealogis dipertahankan melalui frasa “menurut silsilah” dan dijelaskan dalam catatan kaki.
