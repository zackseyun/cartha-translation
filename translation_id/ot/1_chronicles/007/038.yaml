base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/038.yaml
  text: 'And the sons of Jether: Jephunneh[a], Pispa, and Ara.'
translation:
  language: id
  text: 'Dan anak-anak Yeter: Yefune, Pispa, dan Ara.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak ... ialah
  rationale: בְנֵי adalah bentuk jamak konstruktus yang secara harfiah berarti 'anak-anak lelaki dari' dan lazim dipakai dalam daftar silsilah. Dalam bahasa Indonesia, 'anak-anak' sudah wajar dan tidak perlu dibatasi dengan kata 'lelaki'; kopula 'ialah' memperjelas rumusan daftar tanpa menambah makna substantif.
- source_word: יֶתֶר
  choice: Yeter
  rationale: Nama diri ditransliterasikan langsung dari Ibrani dengan ejaan Indonesia; huruf awal י diwakili oleh y dan ת oleh t.
- source_word: יְפֻנֶּה
  choice: Yefune
  rationale: Nama diri ditransliterasikan menurut bunyi Ibrani dalam ejaan Indonesia. Konsonan rangkap nun tidak perlu ditandai dalam bentuk Indonesia.
- source_word: וּפִסְפָּה
  choice: Pispa
  rationale: Nama diri ditransliterasikan sebagai 'Pispa'; he pada akhir nama tidak dibunyikan, sehingga bentuk ini alami dalam ejaan Indonesia. Waw prefiks terwakili oleh 'dan' dalam rangkaian nama.
- source_word: וַאְרָא
  choice: dan Ara
  rationale: Bentuk ini dipahami sebagai nama diri Ara dengan waw penghubung; 'dan' mempertahankan penanda unsur terakhir dalam daftar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur ayat dipertahankan sebagai rumusan silsilah, sedangkan nama-nama dialihaksarakan langsung dari teks Ibrani, bukan melalui bentuk Inggris.
