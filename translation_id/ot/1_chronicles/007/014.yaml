  text: בְּנֵ֣י מְנַשֶּׁ֔ה אַשְׂרִיאֵ֖ל אֲשֶׁ֣ר יָלָ֑דָה פִּֽילַגְשׁ/וֹ֙ הָֽ/אֲרַמִּיָּ֔ה יָלְדָ֕ה אֶת מָכִ֖יר אֲבִ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/014.yaml
  text: 'The sons of Manasseh: Asriel[a], whom his Aramean concubine bore[c][b]; she bore Machir the father of Gilead.'
translation:
  language: id
  text: 'Anak-anak Manasye[a]: Asriel, yang dilahirkan oleh gundik Manasye, perempuan Aram itu[b]. Perempuan itu melahirkan Makhir, ayah Gilead[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Keturunan Manasye.” Dalam silsilah, “anak-anak” kadang-kadang dapat menunjuk secara lebih luas kepada keturunan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “perempuan Aram itu”; secara tradisional diterjemahkan “perempuan Siria.”
    reason: lexical_alternative
  - marker: c
    text: Dalam silsilah, “ayah” dapat juga berarti “leluhur” atau “pendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: Anak-anak Manasye
  rationale: בְּנֵי secara harfiah berarti ‘anak-anak lelaki dari’; dalam daftar silsilah istilah ini dapat mencakup keturunan. Bentuk ‘anak-anak Manasye’ mempertahankan gaya silsilah Ibrani tanpa menutup kemungkinan makna yang lebih luas.
- source_word: אַשְׂרִיאֵל
  choice: Asriel
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֲשֶׁר יָלָדָה
  choice: yang dilahirkan oleh
  rationale: Bentuk verba feminin tunggal berarti ‘yang ia lahirkan’. Bentuk pasif dalam bahasa Indonesia menghubungkan klausa relatif itu secara alami dengan Asriel dan memungkinkan subjek perempuan disebut sesudahnya.
- source_word: פִּילַגְשׁוֹ
  choice: gundik Manasye
  rationale: פִּילֶגֶשׁ berarti ‘gundik’. Sufiks ‘-nya’ merujuk kepada Manasye; nama Manasye diulang agar rujukannya tidak keliru dipahami sebagai Asriel.
- source_word: הָאֲרַמִּיָּה
  choice: seorang perempuan Aram
  rationale: Istilah ini menunjuk kepada seorang perempuan Aram. ‘Aram’ lebih tepat secara historis daripada sebutan tradisional ‘Siria’.
- source_word: יָלְדָה אֶת מָכִיר
  choice: Perempuan itu juga melahirkan Makhir
  rationale: Verba feminin yang diulang kembali menunjuk kepada perempuan Aram tersebut dan memperkenalkan Makhir. ‘Juga’ membuat kelanjutan pemberitahuan kelahiran itu alami dalam bahasa Indonesia.
- source_word: אֲבִי גִלְעָד
  choice: ayah Gilead
  rationale: אָב paling langsung berarti ‘ayah’, meskipun dalam silsilah dapat pula berarti leluhur atau pendiri suatu kelompok.
