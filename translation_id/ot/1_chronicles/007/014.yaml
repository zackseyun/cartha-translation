translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dipecah menjadi dua agar rangkaian subjek perempuan dalam teks Ibrani mudah diikuti. Pengulangan nama Manasye menghindari ambiguitas pronominal yang tidak alami dalam bahasa Indonesia, sedangkan istilah kekerabatan dan struktur silsilah tetap dipertahankan.
