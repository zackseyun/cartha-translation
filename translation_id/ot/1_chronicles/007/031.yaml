  yaml_path: translation/ot/1_chronicles/007/031.yaml
  text: 'The sons of Beriah: Heber and Malchiel[b][a]; he was the father of Birzaith.'
translation:
  language: id
  text: Anak-anak Beria ialah Heber dan Malkiel. Malkiel adalah ayah dari Birzait.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks silsilah, “ayah dari” juga dapat berarti leluhur atau pendiri suatu kaum atau permukiman, bukan hanya ayah kandung langsung.
    reason: lexical_alternative
  - marker: b
    text: Nama ini juga dapat ditransliterasikan sebagai Birzot atau Berazot.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי בְרִיעָה
  choice: Anak-anak Beria ialah
  rationale: Bentuk jamak konstruktus memperkenalkan cabang silsilah. Kata penghubung awal tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia, sedangkan “ialah” membuat daftar nama terbaca alami.
- source_word: חֶבֶר
  choice: Heber
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וּמַלְכִּיאֵל
  choice: dan Malkiel
  rationale: Nama diri dipertahankan sebagai transliterasi dan waw penghubung diterjemahkan “dan”.
- source_word: הוּא
  choice: Malkiel
  rationale: Pronomina maskulin tunggal merujuk secara paling alami kepada nama maskulin tunggal yang tepat mendahuluinya. Pengulangan nama menghindari ketidakjelasan pronomina dalam bahasa Indonesia tanpa mengubah rujukannya.
- source_word: אֲבִי
  choice: ayah
  rationale: Terjemahan formal mempertahankan ungkapan kekerabatan Ibrani, sambil memberi catatan bahwa dalam silsilah cakupannya dapat lebih luas daripada ayah biologis langsung.
- source_word: ברזות
  choice: Birzait
  rationale: Nama yang langka dan tanpa vokalisasi pasti ditransliterasikan secara konservatif; identitasnya sebagai orang, kaum, atau tempat tidak dipastikan dalam teks utama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur silsilah dibuat alami bagi pembaca modern. Rujukan “Malkiel” dinyatakan eksplisit untuk menghindari ambiguitas kata “dia”, sementara ketidakpastian cakupan “ayah” dan bentuk nama terakhir dipertahankan melalui catatan kaki.
