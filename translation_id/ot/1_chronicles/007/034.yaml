id: 1CH.7.34
reference: 1 Chronicles 7:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְנֵ֖י שָׁ֑מֶר אֲחִ֥י ו/רוהגה יחבה וַ/אֲרָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/034.yaml
  text: 'And the sons of Shemer: Ahi[a], Rohgah, Jehubbah[b], and Aram.'
translation:
  language: id
  text: Anak-anak[a] Semer ialah Ahi, Rohga, Yehuba[b], dan Aram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam rumusan silsilah Ibrani, “anak-anak” dapat berarti keturunan laki-laki atau anggota suatu kaum, bukan hanya anak kandung langsung.
    reason: cultural_note
  - marker: b
    text: Nama Ibrani ini juga dapat dialihaksarakan sebagai “Yehubba” atau “Hubba”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruksi dari בֵּן dengan kata penghubung. Dalam daftar silsilah, “anak-anak” merupakan padanan Indonesia yang alami, meskipun rumusan Ibrani ini dapat mencakup keturunan laki-laki atau anggota kaum.
- source_word: שָׁמֶר
  choice: Semer
  rationale: Nama diri ditransliterasikan dengan ejaan yang alami dalam bahasa Indonesia; שׁ diwakili oleh “s” dan vokal nama dipertahankan secara wajar.
- source_word: אֲחִי
  choice: Ahi
  rationale: Dalam konteks daftar silsilah, bentuk ini berfungsi sebagai nama diri, bukan diterjemahkan menurut kemungkinan kaitannya dengan kata “saudara”.
- source_word: וְרוֹהְגָה
  choice: Rohga
  rationale: Nama diri ditransliterasikan secara ringkas dan alami; kata penghubung Ibrani tidak perlu diulang pada setiap unsur dalam daftar Indonesia.
- source_word: יְחֻבָּה
  choice: Yehuba
  rationale: Yod awal ditransliterasikan sebagai “Y”, sesuai pelafalan yang lebih langsung dan kebiasaan Indonesia; konsonan rangkap tidak perlu dipertahankan dalam ejaan Indonesia.
- source_word: וַאֲרָם
  choice: dan Aram
  rationale: Kata penghubung diterjemahkan “dan”, sedangkan nama אֲרָם ditransliterasikan langsung sebagai “Aram”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan “ialah” memperjelas bahwa ayat ini memperkenalkan daftar nama tanpa menambah hubungan yang tidak dinyatakan oleh teks sumber.
