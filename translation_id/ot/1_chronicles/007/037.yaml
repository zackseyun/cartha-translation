translation:
  language: id
  text: Bezer, Hod, Syama, Silsya, Yitran, dan Beera.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Ibrani ini dapat ditransliterasikan lebih eksplisit sebagai Be'era untuk menandai alef di tengah nama.
