lexical_decisions:
- source_word: בֶּצֶר
  choice: Bezer
  rationale: Nama orang dalam daftar silsilah; ditransliterasikan dengan bentuk yang sudah wajar dalam bahasa Indonesia.
- source_word: הוֹד
  choice: Hod
  rationale: Dalam konteks ini merupakan nama orang, bukan kata benda umum yang berarti kemegahan atau keagungan.
- source_word: שַׁמָּא
  choice: Syama
  rationale: Transliterasi nama Ibrani dengan שׁ diwakili oleh “sy”; penggandaan konsonan tidak dipertahankan karena tidak diperlukan dalam ejaan Indonesia.
- source_word: שִׁלְשָׁה
  choice: Syilsa
  rationale: Transliterasi yang cukup dekat dengan bunyi Ibrani dan tetap mudah dibaca dalam bahasa Indonesia; ה pada akhir bentuk ini tidak perlu ditampilkan sebagai bunyi h tersendiri.
- source_word: יִתְרָן
  choice: Yitran
  rationale: Yod awal ditampilkan sebagai “Y”, sesuai nilai bunyinya dan kebiasaan ejaan Indonesia.
- source_word: בְאֵרָא
  choice: Beera
  rationale: Bentuk yang lancar dibaca dalam bahasa Indonesia; dua vokal tetap dipertahankan untuk mencerminkan adanya א di tengah nama.
