  register: Ayat berupa daftar nama, sehingga susunan dan pengulangan kata penghubung Ibrani disajikan sebagai daftar alami dalam bahasa Indonesia, dengan “dan” sebelum nama terakhir. Ragam bahasa ringkas, modern, dan bermartabat.
