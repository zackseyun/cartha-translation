  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מָכִ֞יר לָקַ֤ח אִשָּׁה֙ לְ/חֻפִּ֣ים וּ/לְ/שֻׁפִּ֔ים וְ/שֵׁ֤ם אֲחֹת/וֹ֙ מַעֲכָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖י צְלָפְחָ֑ד וַ/תִּהְיֶ֥נָה לִ/צְלָפְחָ֖ד בָּנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/015.yaml
  text: Machir took a wife for Huppim and for Shuppim. The name of his sister was Maacah[a], and the name of the second was Zelophehad; and Zelophehad had daughters.
translation:
  language: id
  text: Makhir mengambil seorang istri bagi Hupim dan bagi Supim. Nama saudara perempuannya ialah Maakha,[a] dan nama yang kedua ialah Zelafehad. Zelafehad mempunyai anak-anak perempuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan nama anak laki-laki yang kedua ialah Zelafehad.” Teks Ibrani hanya mengatakan “yang kedua” tanpa menyebutkan acuannya.
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח אִשָּׁה
  choice: mengambil seorang istri
  rationale: Ungkapan Ibrani ini lazim berarti mengambil istri atau menikah. Karena frasa berikutnya memakai 'bagi Hupim dan bagi Supim', susunan yang tidak biasa itu dipertahankan dan tidak diubah menjadi seolah-olah Makhir sendiri menikahinya.
- source_word: לְחֻפִּים וּלְשֻׁפִּים
  choice: bagi Hupim dan bagi Supim
  rationale: Preposisi לְ yang diulang diterjemahkan pada kedua nama untuk mempertahankan konstruksi Ibrani yang tidak biasa tanpa memastikan bagaimana pengaturan perkawinan itu berlangsung.
- source_word: וְשֵׁם אֲחֹתוֹ מַעֲכָה
  choice: Nama saudara perempuannya ialah Maakha
  rationale: Ini menerjemahkan rumus penamaan secara langsung. Kata ganti 'nya' dibiarkan mengikuti teks; dalam konteks terdekat kemungkinan besar merujuk kepada Makhir.
- source_word: וְשֵׁם הַשֵּׁנִי צְלָפְחָד
  choice: dan nama yang kedua ialah Zelafehad
  rationale: Teks Ibrani hanya menyebut 'yang kedua' tanpa menyatakan acuannya. Terjemahan utama mempertahankan ketidakjelasan itu dan tidak menambahkan kata 'anak laki-laki'.
- source_word: וַתִּהְיֶנָה לִצְלָפְחָד בָּנוֹת
  choice: Zelafehad mempunyai anak-anak perempuan
  rationale: Ini adalah ungkapan Indonesia yang alami bagi konstruksi eksistensial-kepemilikan Ibrani dan tetap mempertahankan keterangan genealogis bahwa anak-anak Zelafehad adalah perempuan.
theological_decisions:
- issue: Ketidakjelasan genealogis pada הַשֵּׁנִי ('yang kedua')
  choice: Mempertahankan frasa 'yang kedua' dalam teks utama tanpa menambahkan 'anak laki-laki'.
  alternative: nama anak laki-laki yang kedua ialah Zelafehad
  rationale: Bahasa Ibrani bersifat ringkas dan tidak menyebutkan acuan 'yang kedua'. Menambahkan 'anak laki-laki' akan menyelesaikan ketidakjelasan genealogis secara interpretatif, sehingga pilihan itu hanya dicatat dalam catatan kaki.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Ejaan nama mengikuti bentuk Indonesia yang lazim: Makhir, Hupim, Supim, Maakha, dan Zelafehad. Struktur yang janggal pada bagian awal serta acuan yang tersirat pada ''yang kedua'' sengaja tidak diperhalus secara berlebihan agar ketegangan teks sumber tetap terlihat.'
