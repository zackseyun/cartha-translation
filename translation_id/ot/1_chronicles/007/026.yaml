  text: לַעְדָּ֥ן בְּנ֛/וֹ עַמִּיה֥וּד בְּנ֖/וֹ אֱלִישָׁמָ֥ע בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/026.yaml
  text: Ladan his son[a], Ammihud his son, Elishama his son.
translation:
  language: id
  text: Ladan, anaknya[a]; Amihud, anaknya; Elisama, anaknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “Laadan”, sebagai pilihan transliterasi lain dari ejaan Ibrani yang sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעְדָּן
  choice: Ladan
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan. Bentuk “Ladan” wajar dalam bahasa Indonesia; ejaan “Laadan” juga mungkin untuk lebih menampakkan vokal panjang dalam bentuk Ibrani.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Secara harfiah berarti “anak laki-lakinya/anaknya”. Dalam daftar silsilah ini, “anaknya” merupakan padanan Indonesia yang alami dan cukup dekat dengan bentuk Ibrani.
- source_word: עַמִּיהוּד
  choice: Amihud
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: אֱלִישָׁמָע
  choice: Elisama
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim, tanpa mempertahankan huruf h akhir yang tidak diucapkan.
