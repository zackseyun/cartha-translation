base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/017.yaml
  text: 'And the sons of Ulam: Bedan. These were the sons of Gilead son of Machir[a], son of Manasseh.'
translation:
  language: id
  text: 'Dan anak-anak Ulam: Bedan. Inilah anak-anak Gilead, anak Makhir, anak Manasye[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi, “Inilah anak-anak Gilead ...”. Klausa ini mungkin berfungsi sebagai rangkuman silsilah yang menghubungkan garis Ulam dengan Gilead melalui Makhir dan Manasye.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Dan anak-anak
  rationale: Konjungsi ו diterjemahkan sebagai penghubung sederhana “Dan”, sedangkan bentuk jamak konstruksi בְנֵי dipertahankan dengan ungkapan silsilah “anak-anak”.
- source_word: אוּלָם
  choice: Ulam
  rationale: Nama orang ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בְּדָן
  choice: Bedan
  rationale: Nama orang ditransliterasikan; bentuk tunggal nama ini tetap dipertahankan meskipun didahului rumus jamak “anak-anak Ulam”.
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Kata tunjuk Ibrani berarti “ini/inilah”; bentuk ini alami dalam daftar silsilah Indonesia dan tidak memaksakan kala lampau yang tidak dinyatakan dalam bahasa Ibrani.
- source_word: בְּנֵי גִלְעָד
  choice: anak-anak Gilead
  rationale: Ungkapan formal silsilah “anak-anak Gilead” dipertahankan daripada diperluas menjadi “keturunan Gilead”, sehingga idiom Ibrani tetap terlihat.
- source_word: בֶּן מָכִיר
  choice: anak Makhir
  rationale: Hubungan silsilah tunggal diterjemahkan secara langsung; nama מָכִיר ditransliterasikan sebagai Makhir.
- source_word: בֶּן מְנַשֶּׁה
  choice: anak Manasye
  rationale: Rangkaian silsilah diterjemahkan secara langsung, dengan bentuk nama Manasye yang lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Fungsi klausa אֵלֶּה בְּנֵי גִלְעָד
  choice: Diterjemahkan secara langsung sebagai “Inilah anak-anak Gilead” dan diberi catatan kaki.
  alternative: Menjadikannya secara eksplisit rangkuman silsilah yang menghubungkan garis Ulam dengan Gilead, Makhir, dan Manasye.
  rationale: Teks Ibrani memungkinkan klausa ini berfungsi sebagai rangkuman genealogis, tetapi tidak menyatakan hubungan tersebut secara eksplisit. Terjemahan utama mempertahankan ketegangan sintaksis itu tanpa menambahkan penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Rumus silsilah “anak-anak” dan “anak” dipertahankan secara cukup formal, sedangkan “Inilah” menjaga ketidakbertandaan kala dalam bahasa Ibrani. Semua nama ditulis dalam bentuk yang mudah dibaca dan lazim dalam bahasa Indonesia.
