  text: 'The sons of Ulla: Arah[a], Hanniel[d][c][b], and Rizia.'
translation:
  language: id
  text: Anak-anak Ula ialah Arah, Haniel, dan Rizia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak
  rationale: בְּנֵי adalah bentuk jamak konstruktus yang berarti “anak-anak dari”; dalam silsilah, “anak-anak” merupakan padanan Indonesia yang alami. Kata sambung וּ tidak dinyatakan tersendiri karena ayat ini berupa entri silsilah dan bahasa Indonesia tidak memerlukannya pada awal kalimat.
- source_word: עֻלָּא
  choice: Ula
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia; satu huruf l cukup untuk mewakili konsonan Ibrani yang diberi dages.
- source_word: אָרַח
  choice: Arah
  rationale: Nama diri ditransliterasikan secara langsung, dengan h mewakili konsonan akhir ח dalam bentuk Indonesia yang mudah dibaca.
- source_word: חַנִּיאֵל
  choice: Haniel
  rationale: Nama diri ditransliterasikan menurut kebiasaan ejaan Indonesia; penggandaan nun secara fonetis tidak perlu ditampilkan dalam ejaan Indonesia.
- source_word: רִצְיָא
  choice: Rizia
  rationale: Nama diri ditransliterasikan dekat dengan bentuk konsonan dan vokal teks Masoret, menggunakan z sebagai padanan Indonesia yang wajar bagi צ dalam nama ini.
