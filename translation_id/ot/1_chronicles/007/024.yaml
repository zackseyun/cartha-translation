  yaml_path: translation/ot/1_chronicles/007/024.yaml
  text: His daughter was Sheerah[a], and she built Lower Beth-horon and Upper Beth-horon[b], and Uzzen-sheerah.
translation:
  language: id
  text: Anak perempuannya ialah Seera[a]. Ia membangun Bet-Horon Bawah dan Bet-Horon Atas[b], serta Uzen-Seera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “dan anak perempuannya, Seera.”
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “dan yang atas”; nama “Bet-Horon” dipahami dari frasa sebelumnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִתּוֹ שֶׁאֱרָה
  choice: Anak perempuannya ialah Seera
  rationale: Ungkapan Ibrani secara harfiah berbunyi 'dan anak perempuannya, Seera'. Dalam konteks silsilah, kopula 'ialah' memperjelas bahwa Seera adalah nama anak perempuan itu tanpa mengubah hubungan keluarganya; kemungkinan terjemahan yang lebih harfiah dicatat dalam catatan kaki.
- source_word: שֶׁאֱרָה
  choice: Seera
  rationale: Nama diri ditransliterasikan dalam bentuk yang alami bagi pembaca Indonesia, tanpa diterjemahkan maknanya.
- source_word: וַתִּבֶן
  choice: Dialah yang membangun
  rationale: Kata kerja בנה lazim berarti 'membangun'. Bentuk feminin menunjuk kembali kepada Seera; 'Dialah yang' mempertahankan penekanan dan menghindari ketidakjelasan subjek dalam bahasa Indonesia.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: Bet-Horon Bawah
  rationale: Nama tempat ditransliterasikan, sedangkan penunjuk lokasinya diterjemahkan secara idiomatis sebagai 'Bawah'.
- source_word: הָעֶלְיוֹן
  choice: Bet-Horon Atas
  rationale: Teks Ibrani hanya menyatakan 'yang atas', dengan Bet-Horon dipahami dari frasa sebelumnya. Nama tersebut dilengkapi dalam teks Indonesia agar rujukannya jelas, dan elipsis aslinya dijelaskan dalam catatan kaki.
- source_word: אֻזֵּן שֶׁאֱרָה
  choice: Uzen-Seera
  rationale: Kesatuan ini diperlakukan sebagai satu nama tempat majemuk dan ditulis dengan tanda hubung agar tidak disalahpahami sebagai dua unsur daftar yang terpisah.
