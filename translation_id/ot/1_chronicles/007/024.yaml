  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Bentuk nama mengikuti ejaan yang mudah dibaca dalam bahasa Indonesia; struktur silsilah dibuat alami tanpa menghilangkan hubungan sintaksis atau elipsis dalam teks Ibrani.
