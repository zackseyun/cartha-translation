base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/021.yaml
  text: Zabad his son[a], and Shuthelah his son, and Ezer and Elead; the men of Gath who were born in the land killed them[b], because they had gone down to take their livestock.
translation:
  language: id
  text: Zabad, anaknya, dan Sutelah, anaknya, serta Ezer dan Elead; orang-orang Gat yang lahir di negeri itu[a] membunuh mereka, karena mereka telah turun[b] untuk mengambil ternak orang-orang Gat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang Gat yang merupakan penduduk asli negeri itu.” Secara harfiah bahasa Ibrani berbunyi, “orang-orang Gat, mereka yang lahir di negeri itu.”
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ini, subjek “telah turun” kemungkinan adalah Ezer dan Elead, dua nama terakhir yang disebut sebelumnya.
    reason: referent_ambiguity
lexical_decisions:
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Bentuk בֵּן dengan sufiks orang ketiga tunggal maskulin berarti ‘anaknya’; pengulangannya dipertahankan sebagai penanda silsilah.
- source_word: וְעֵזֶר וְאֶלְעָד
  choice: serta Ezer dan Elad
  rationale: Nama-nama ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia, sedangkan ‘serta’ menjaga kelancaran daftar.
- source_word: וַהֲרָגוּם
  choice: membunuh mereka
  rationale: Verba הרג dengan sufiks objek jamak secara langsung menyatakan bahwa mereka dibunuh.
- source_word: אַנְשֵׁי גַת
  choice: orang-orang Gat
  rationale: Ungkapan ini menunjuk kepada para lelaki atau penduduk Gat; ‘orang-orang Gat’ alami dalam bahasa Indonesia tanpa mempersempitnya menjadi tentara.
- source_word: הַנּוֹלָדִים בָּאָרֶץ
  choice: yang lahir di negeri itu
  rationale: Terjemahan dekat ini mempertahankan bentuk partisip pasif dan ungkapan Ibrani, tanpa langsung menafsirkannya sebagai ‘penduduk asli’.
- source_word: כִּי
  choice: karena
  rationale: Konjungsi ini memperkenalkan alasan pembunuhan.
- source_word: יָרְדוּ
  choice: telah turun
  rationale: Makna spasial ‘turun’ dipertahankan, sementara ‘telah’ menunjukkan bahwa tindakan itu mendahului pembunuhan.
- source_word: לָקַחַת
  choice: untuk mengambil
  rationale: ‘Mengambil’ mempertahankan arti umum לקח dan tidak menambahkan nuansa ‘merampas’ yang tidak dinyatakan secara eksplisit.
- source_word: מִקְנֵיהֶם
  choice: ternak orang-orang Gat
  rationale: מִקְנֶה berarti ternak atau kawanan. Acuan sufiks jamak diperjelas sebagai orang-orang Gat agar dua kelompok yang sama-sama dapat dirujuk oleh ‘mereka’ tidak tertukar dalam bahasa Indonesia.
theological_decisions:
- issue: Subjek יָרְדוּ (‘telah turun’)
  choice: Teks utama mempertahankan subjek tersirat ‘mereka’, dengan catatan bahwa dalam konteks ini yang dimaksud kemungkinan Ezer dan Elad.
  alternative: Mengungkapkan langsung ‘Ezer dan Elad telah turun’.
  rationale: Bentuk verba Ibrani hanya menandai subjek jamak dan tidak menyebut nama. Catatan menjelaskan acuan kontekstual yang paling mungkin tanpa menghapus ambiguitas gramatikal dari teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda titik koma memisahkan lanjutan silsilah dari peristiwa pembunuhan. Nama Gat, Sutelah, dan Elad memakai bentuk Indonesia yang lazim. Acuan kepemilikan pada ‘ternak’ dibuat eksplisit demi kejelasan, sedangkan ambiguitas subjek verba jamak dipertahankan dan dijelaskan dalam catatan kaki.
