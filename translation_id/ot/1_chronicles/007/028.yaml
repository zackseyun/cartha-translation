base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/028.yaml
  text: Their holdings and settlements were Bethel and its daughter towns[a], and to the east Naaran, and to the west Gezer and its daughter towns, and Shechem and its daughter towns[c][b], as far as Ayyah and its daughter towns.
translation:
  language: id
  text: Tanah milik dan permukiman mereka meliputi Betel dan kota-kota bawahannya[b]; di sebelah timur, Naaran[a]; dan di sebelah barat, Gezer dan kota-kota bawahannya, serta Sikhem dan kota-kota bawahannya, sampai ke Ayyah[c] dan kota-kota bawahannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian penerjemah menuliskan nama Naaran sebagai “Naara” berdasarkan tradisi nama tempat yang berkaitan di bagian lain.
    reason: alternative_reading
  - marker: b
    text: Ungkapan Ibrani secara harfiah berbunyi “anak-anak perempuannya” dan menunjuk pada kota-kota kecil atau desa-desa yang bergantung pada sebuah kota utama.
    reason: cultural_note
  - marker: c
    text: Teks Ibrani berbunyi “Ayyah”; beberapa saksi kuno dan terjemahan mencerminkan bacaan “Gaza”.
    reason: textual_variant
lexical_decisions:
- source_word: אֲחֻזָּתָם
  choice: tanah milik mereka
  rationale: Kata ini menunjuk pada kepemilikan teritorial atau tanah yang dikuasai. Pilihan ini sesuai dengan daftar geografis dan lebih khusus daripada sekadar 'milik'.
- source_word: מֹשְׁבוֹתָם
  choice: permukiman mereka
  rationale: Dalam konteks wilayah, kata ini menunjuk pada tempat-tempat yang dihuni. 'Permukiman' alami dan jelas dalam bahasa Indonesia modern.
- source_word: בְנֹתֶיהָ
  choice: kota-kota bawahannya
  rationale: Secara harfiah berarti 'anak-anak perempuannya', tetapi merupakan idiom bagi kota-kota kecil atau permukiman yang bergantung pada sebuah kota utama. 'Kota-kota bawahannya' menyampaikan hubungan tersebut dengan jelas.
- source_word: לַמִּזְרָח
  choice: di sebelah timur
  rationale: Menyatakan arah atau sisi timur wilayah dengan ungkapan Indonesia yang alami.
- source_word: נַעֲרָן
  choice: Naaran
  rationale: Mengikuti bentuk teks Masoret; tradisi nama tempat terkait yang berbunyi 'Naara' dicatat dalam catatan kaki.
- source_word: לַמַּעֲרָב
  choice: di sebelah barat
  rationale: Padanan alami bagi penanda arah yang berpasangan dengan 'di sebelah timur'.
- source_word: גֶּזֶר
  choice: Gezer
  rationale: Transliterasi nama tempat Ibrani yang lazim dalam bahasa Indonesia.
- source_word: שְׁכֶם
  choice: Sikhem
  rationale: Bentuk nama tempat yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: עַד
  choice: sampai ke
  rationale: Menandai batas atau jangkauan wilayah secara jelas dan alami.
- source_word: עַיָּה
  choice: Aya
  rationale: Merepresentasikan bacaan teks Masoret עַיָּה dalam ejaan Indonesia; varian 'Gaza' dipertahankan dalam catatan kaki.
