translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar geografis diperjelas dengan tanda baca tanpa mengubah urutan unsur dalam teks Ibrani. Istilah 'kota-kota bawahannya' dipilih agar idiom Ibrani dipahami pembaca umum, sementara metafora harfiahnya dijelaskan dalam catatan kaki.
