  text: וּ/בֶן הֵ֖לֶם אָחִ֑י/ו צוֹפַ֥ח וְ/יִמְנָ֖ע וְ/שֵׁ֥לֶשׁ וְ/עָמָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/035.yaml
  text: 'The son of Helem his brother: Zophah[a], Imna, Shelesh, and Amal.'
translation:
  language: id
  text: 'Dan anak Helem, saudaranya: Zofah[a], Imna, Shelesh, dan Amal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Ibrani צוֹפַח juga dapat ditransliterasikan sebagai “Zofakh”, bergantung pada cara huruf akhir ח dialihaksarakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: Anak-anak
  rationale: Secara bentuk, kata Ibrani ini tunggal, 'anak laki-laki dari'. Namun, empat nama yang menyusul menunjukkan daftar beberapa anak; dalam bahasa Indonesia, bentuk jamak membuat struktur silsilah ini wajar tanpa mengubah hubungan yang dinyatakan.
- source_word: הֵלֶם
  choice: Helem
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan.
- source_word: אָחִיו
  choice: saudaranya
  rationale: Mempertahankan istilah kekerabatan beserta sufiks orang ketiga tunggal dan tidak menentukan secara eksplisit siapa antesedennya.
- source_word: צוֹפַח
  choice: Zofah
  rationale: Transliterasi Indonesia memakai z untuk צ, f untuk פ tanpa dages, dan h untuk ח pada akhir nama.
- source_word: וְיִמְנָע
  choice: Imna
  rationale: Nama diri ditransliterasikan; konjungsi diwujudkan melalui tanda baca daftar dalam bahasa Indonesia.
- source_word: וְשֵׁלֶשׁ
  choice: Seles
  rationale: Nama diri ditransliterasikan menurut kebiasaan bunyi Indonesia, dengan syin menjadi s.
- source_word: וְעָמָל
  choice: dan Amal
  rationale: Nama terakhir dalam daftar didahului 'dan' untuk mewakili konjungsi Ibrani.
theological_decisions:
- issue: Ketidaksesuaian antara bentuk tunggal וּבֶן dan empat nama dalam daftar
  choice: Anak-anak Helem
  alternative: Anak Helem
  rationale: Konteks sintaksis memperlakukan empat nama berikut sebagai keturunan Helem. Bentuk jamak Indonesia menghindari kesan bahwa hanya Zofah yang merupakan anak Helem, meskipun bentuk tunggal sumber dicatat sebagai ketegangan tekstual.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan sesuai gaya daftar silsilah. Nama-nama dialihaksarakan menurut pola yang mudah dibaca penutur Indonesia; ambiguitas rujukan pada 'saudaranya' dipertahankan.
