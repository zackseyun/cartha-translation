  text: His sister Hammoleketh bore Ishhod[a], Abiezer, and Mahlah.
translation:
  language: id
  text: Saudara perempuannya, Hamolekhet[a], melahirkan Isyhod, Abiezer, dan Mahla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Molekhet. Bentuk nama ini berkaitan dengan kata yang berarti “ratu” atau “perempuan yang memerintah”, tetapi di sini paling tepat dipahami sebagai nama diri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֹתוֹ
  choice: Saudara perempuannya
  rationale: Kata אֲחוֹת dengan akhiran orang ketiga tunggal maskulin berarti ‘saudara perempuannya’. Waw menghubungkan ayat ini dengan silsilah sebelumnya, tetapi tidak perlu diterjemahkan secara eksplisit agar kalimat Indonesia mengalir alami.
- source_word: הַמֹּלֶכֶת
  choice: Hamoleket
  rationale: Dalam konteks silsilah, bentuk ini paling tepat dipahami sebagai nama diri dan dialihaksarakan. Bentuk ‘Hamoleket’ mempertahankan unsur ha- yang menyatu dalam bentuk nama Ibrani.
- source_word: יָלְדָה
  choice: melahirkan
  rationale: Bentuk verba feminin ini menyatakan bahwa Hamoleket melahirkan orang-orang yang disebutkan; ‘melahirkan’ alami dalam bahasa Indonesia dan mempertahankan makna maternalnya.
- source_word: אֶת
  choice: tidak diterjemahkan
  rationale: Partikel ini menandai objek langsung dalam bahasa Ibrani dan tidak memiliki padanan yang perlu dinyatakan dalam bahasa Indonesia.
- source_word: אִישְׁהוֹד
  choice: Isyhod
  rationale: Nama diri dialihaksarakan dengan ‘sy’ untuk bunyi שׁ sesuai kebiasaan ejaan nama-nama Alkitab dalam bahasa Indonesia.
- source_word: אֲבִיעֶזֶר
  choice: Abiezer
  rationale: Nama diri dialihaksarakan dalam bentuk yang sudah lazim dalam bahasa Indonesia.
- source_word: מַחְלָה
  choice: Mahla
  rationale: Nama diri dialihaksarakan secara ringkas dan sesuai bentuk yang lazim dalam bahasa Indonesia.
