reference: 1 Chronicles 7:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/חֶ֨בֶר֙ הוֹלִ֣יד אֶת יַפְלֵ֔ט וְ/אֶת שׁוֹמֵ֖ר וְ/אֶת חוֹתָ֑ם וְ/אֵ֖ת שׁוּעָ֥א אֲחוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/032.yaml
  text: Heber fathered Japhlet[a], Shomer, Hotham[b], and Shua their sister.
translation:
  language: id
  text: Heber memperanakkan Yaflet, Somer, Hotam, dan saudara perempuan mereka, Sua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶבֶר
  choice: Heber
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Dalam konteks silsilah, bentuk Hifil dari ילד menyatakan bahwa seseorang menjadi ayah atau menghasilkan keturunan; 'memperanakkan' ringkas dan sesuai dengan ragam silsilah Alkitab.
- source_word: אֶת
  choice: tidak diterjemahkan
  rationale: Penanda objek langsung bahasa Ibrani tidak memiliki padanan tersendiri dalam bahasa Indonesia.
- source_word: יַפְלֵט
  choice: Yaflet
  rationale: Nama diri ditransliterasikan dengan menyesuaikan bunyi Ibrani ke ejaan Indonesia.
- source_word: שׁוֹמֵר
  choice: Somer
  rationale: Nama diri ditransliterasikan dari bentuk Masoret שׁוֹמֵר; bunyi שׁ diwakili dengan 's' sesuai kebiasaan nama Alkitab Indonesia.
- source_word: חוֹתָם
  choice: Hotam
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani dengan 'h' untuk ח, mengikuti bentuk yang mudah dibaca dalam bahasa Indonesia.
- source_word: שׁוּעָא
  choice: Sua
  rationale: Nama diri ditransliterasikan langsung ke ejaan Indonesia; bentuk Ibrani di ayat ini berakhir dengan alef tanpa konsonan h.
- source_word: אֲחוֹתָם
  choice: saudara perempuan mereka
  rationale: Nomina 'saudara perempuan' memiliki akhiran orang ketiga jamak maskulin, sehingga secara formal berarti 'saudara perempuan mereka' dan paling wajar merujuk kepada laki-laki yang baru disebutkan.
theological_decisions:
- issue: Rujukan akhiran jamak pada אֲחוֹתָם
  choice: saudara perempuan mereka
  alternative: saudara perempuannya
  rationale: Teks Masoret memakai akhiran jamak 'mereka'. Terjemahan mempertahankannya tanpa mengubah hubungan kekerabatan menjadi bentuk tunggal.
translation_notes:
  register: Bahasa Indonesia modern dengan ragam silsilah yang ringkas dan bermartabat. Nama-nama ditransliterasikan menurut bunyi Ibrani dan kebiasaan ejaan Indonesia. Tidak ditambahkan catatan varian karena 'Shemer' dan 'Shuah' dalam lapisan konsultasi Inggris merupakan varian konvensi ejaan Inggris, bukan ambiguitas leksikal yang perlu dipertahankan dalam bahasa Indonesia.
