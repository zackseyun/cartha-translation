  text: וּ/בְנֵי֙ כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה עִ֥ירוּ אֵלָ֖ה וָ/נָ֑עַם וּ/בְנֵ֥י אֵלָ֖ה וּ/קְנַֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/015.yaml
  text: 'And the sons of Caleb son of Jephunneh: Iru[a], Elah, and Naam; and the sons of Elah: Kenaz.'
translation:
  language: id
  text: Anak-anak Kaleb bin Yefune ialah Iru, Ela, dan Naam; dan anak-anak Ela ialah Kenas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak
  rationale: Dalam daftar silsilah, בְּנֵי paling langsung berarti anak-anak laki-laki; bentuk Indonesia ini wajar dan tetap dapat memiliki cakupan keluarga yang lebih luas menurut konteks.
- source_word: כָּלֵב
  choice: Kaleb
  rationale: Nama diri ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן יְפֻנֶּה
  choice: bin Yefune
  rationale: Ungkapan genealogis ini mengidentifikasi Kaleb yang dimaksud. 'Bin' ringkas, alami, dan tepat untuk 'anak laki-laki dari' dalam rangkaian nama.
- source_word: עִירוּ
  choice: Iru
  rationale: Transliterasi langsung nama diri Ibrani.
- source_word: אֵלָה
  choice: Ela
  rationale: Dalam konteks ini bentuk tersebut adalah nama pribadi, bukan nomina umum; transliterasi tanpa huruf akhir h sesuai pelafalan Indonesia.
- source_word: וָנָעַם
  choice: dan Naam
  rationale: Teks ber-vokal mendukung nama maskulin Naam, bukan Naama.
- source_word: וּבְנֵי אֵלָה
  choice: dan anak-anak Ela
  rationale: Pengulangan susunan genealogis Ibrani dipertahankan untuk memperkenalkan cabang keluarga di bawah Ela.
- source_word: וּקְנַז
  choice: Kenas
  rationale: Nama diri ditransliterasikan dengan s untuk mencerminkan bunyi akhir Ibrani dan mengikuti ejaan Indonesia yang mudah dibaca.
