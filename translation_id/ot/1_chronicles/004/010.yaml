reference: 1 Chronicles 4:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א יַ֠עְבֵּץ לֵ/אלֹהֵ֨י יִשְׂרָאֵ֜ל לֵ/אמֹ֗ר אִם בָּרֵ֨ךְ תְּבָרֲכֵ֜/נִי וְ/הִרְבִּ֤יתָ אֶת גְּבוּלִ/י֙ וְ/הָיְתָ֤ה יָדְ/ךָ֙ עִמִּ֔/י וְ/עָשִׂ֥יתָ מֵּ/רָעָ֖ה לְ/בִלְתִּ֣י עָצְבִּ֑/י וַ/יָּבֵ֥א אֱלֹהִ֖ים אֵ֥ת אֲשֶׁר שָׁאָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/010.yaml
  text: And Jabez called on the God of Israel[a], saying, “If you would indeed bless me and enlarge my territory, and let your hand be with me[b], and keep me from harm so that I may not suffer pain!” And God granted what he asked.
translation:
  language: id
  text: Yabes berseru kepada Allah Israel, katanya, “Kiranya Engkau sungguh-sungguh memberkati aku dan memperluas wilayahku. Kiranya tangan-Mu menyertai aku dan Engkau melindungi aku dari malapetaka[a], supaya aku tidak menderita sakit[b]!” Lalu Allah mengabulkan permintaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kejahatan.” Kata Ibrani רָעָה dapat berarti kejahatan moral maupun malapetaka yang mencelakakan; konteks di sini lebih mendukung arti malapetaka.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “menderita sakit” menggemakan penjelasan nama Yabes pada ayat sebelumnya.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: berseru kepada
  rationale: Dalam konteks doa, verba ini menyatakan tindakan memohon atau berseru kepada Allah, bukan sekadar memanggil.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: kepada Allah Israel
  rationale: Menerjemahkan konstruksi kepunyaan secara lugas dan alami dalam bahasa Indonesia.
- source_word: אִם בָּרֵךְ תְּבָרֲכֵנִי
  choice: Kiranya Engkau sungguh-sungguh memberkati aku
  rationale: Partikel אִם di sini memperkenalkan permohonan yang kuat, sedangkan infinitif absolut bersama verba finit memberi penegasan. 'Kiranya' menyampaikan fungsi doa dan 'sungguh-sungguh' mempertahankan intensitasnya.
- source_word: וְהִרְבִּיתָ אֶת גְּבוּלִי
  choice: dan memperluas wilayahku
  rationale: גְּבוּל dapat berarti batas atau wilayah; konteks berkat paling wajar menunjuk pada perluasan tanah atau daerah milik Yabes.
- source_word: וְהָיְתָה יָדְךָ עִמִּי
  choice: Kiranya tangan-Mu menyertai aku
  rationale: Ungkapan Ibrani 'tangan-Mu' dipertahankan sebagai gambaran kuasa dan pertolongan Allah; bentuk permohonan dinyatakan secara alami dengan 'kiranya'.
- source_word: וְעָשִׂיתָ מֵּרָעָה
  choice: dan lindungilah aku dari malapetaka
  rationale: Frasa Ibrani ini padat dan agak sulit. Dalam kaitannya dengan kesakitan pada klausa berikutnya, רָעָה paling mungkin menunjuk pada bahaya atau bencana, sementara kemungkinan arti moral 'kejahatan' dicatat dalam catatan kaki.
- source_word: לְבִלְתִּי עָצְבִּי
  choice: supaya aku tidak mengalami kesakitan
  rationale: Terjemahan ini menyampaikan permohonan agar Yabes tidak ditimpa rasa sakit dan mempertahankan kaitan katanya dengan penjelasan nama Yabes pada ayat sebelumnya.
- source_word: וַיָּבֵא אֱלֹהִים אֵת אֲשֶׁר שָׁאָל
  choice: Lalu Allah mengabulkan permintaannya
  rationale: Ungkapan dengan בוא menyatakan bahwa Allah membuat hal yang diminta itu terwujud; 'mengabulkan permintaannya' merupakan padanan Indonesia yang alami.
theological_decisions:
- issue: Sifat permohonan Yabes untuk memperluas גְּבוּל
  choice: Diterjemahkan sebagai 'memperluas wilayahku' dalam arti kewilayahan biasa.
  alternative: Memperluas pengaruhku.
  rationale: Makna paling langsung adalah batas atau wilayah. Terjemahan tidak mengubahnya menjadi metafora modern dan tidak memasukkan gagasan teologi kemakmuran yang tidak dinyatakan teks.
- issue: Makna רָעָה dalam doa
  choice: Diterjemahkan sebagai 'malapetaka'.
  alternative: Kejahatan.
  rationale: Klausa tujuan tentang kesakitan mendukung arti kemalangan, bahaya, atau bencana. Namun, karena kata itu juga dapat berarti kejahatan moral, kemungkinan tersebut dipertahankan dalam catatan kaki.
- issue: Arah makna לְבִלְתִּי עָצְבִּי
  choice: Supaya aku tidak mengalami kesakitan.
  alternative: Supaya itu tidak menyakiti aku; atau, supaya aku tidak menyebabkan kesakitan.
  rationale: Bentuk Ibrani dapat dipahami dalam kaitan dengan rasa sakit atau dukacita dan sengaja menggemakan nama Yabes. Bacaan utama mengikuti konteks permohonan perlindungan, sedangkan ketidakpastian sintaksis dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat tetapi mudah dipahami. Paralelisme permohonan dipertahankan melalui pengulangan 'kiranya', dan idiom 'tangan-Mu' dipertahankan karena masih jelas serta penting bagi citra teks Ibrani.
