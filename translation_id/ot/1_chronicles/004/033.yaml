base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/033.yaml
  text: And all their villages that were around these cities, as far as Baal—these were their settlements, and they had their genealogy recorded.
translation:
  language: id
  text: Semua desa mereka[a] yang berada di sekitar kota-kota ini, sampai ke Baal—itulah permukiman mereka, dan mereka mendaftarkan diri menurut silsilah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkampungan mereka” atau “permukiman kecil mereka.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dan silsilah mereka dicatat.” Ungkapan Ibrani merujuk pada pendaftaran berdasarkan silsilah.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: desa mereka
  rationale: Dalam konteks daftar tempat yang dihuni di sekitar kota-kota, חָצֵר menunjuk pada desa atau permukiman kecil, bukan terutama halaman atau pelataran.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: yang berada di sekitar kota-kota ini
  rationale: Ungkapan ini secara alami menyatakan letak desa-desa tersebut dalam hubungannya dengan kota-kota yang baru disebutkan.
- source_word: עַד בָּעַל
  choice: sampai ke Baal
  rationale: עַד menunjukkan batas wilayah, sedangkan בָּעַל di sini adalah nama tempat dan karena itu ditransliterasikan.
- source_word: זֹאת
  choice: itulah
  rationale: Bentuk tunggal feminin ini dipakai secara resumtif untuk merangkum daftar sebelumnya; 'itulah' mempertahankan bentuk rangkuman tanpa memaksakan persesuaian jumlah.
- source_word: מוֹשְׁבֹתָם
  choice: tempat-tempat permukiman mereka
  rationale: מוֹשָׁב berarti tempat tinggal atau tempat menetap; 'tempat-tempat permukiman' sesuai dengan konteks geografis dan administratif.
- source_word: וְהִתְיַחְשָׂם לָהֶם
  choice: dan mereka mendaftarkan diri menurut silsilah
  rationale: Bentuk Hitpael dari יחס berkaitan dengan pencatatan atau pendaftaran berdasarkan silsilah. Terjemahan ini menyampaikan nuansa refleksif bentuk Ibrani sambil tetap mengakui bahwa susunan frasanya padat.
