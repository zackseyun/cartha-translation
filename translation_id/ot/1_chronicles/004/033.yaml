translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar. Tanda pisah mempertahankan fungsi rangkuman זֹאת, sedangkan istilah geografis dibedakan secara jelas antara desa, kota, dan tempat permukiman.
