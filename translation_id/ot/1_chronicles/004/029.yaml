  text: and in Bilhah[a], and in Ezem, and in Tolad.
translation:
  language: id
  text: dan di Bilha, di Ezem, serta di Tolad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְ/בִלְהָה
  choice: dan di Bilha
  rationale: Gabungan וּ dan בְ menyambung daftar tempat dengan arti lokatif. Kata depan Indonesia “di” secara alami mencakup nuansa ‘di dalam/di tempat’, sedangkan nama tempat בִלְהָה ditransliterasikan sebagai “Bilha” sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: וּ/בְ/עֶצֶם
  choice: di Ezem
  rationale: בְ diterjemahkan dengan kata depan lokatif “di”. עֶצֶם dalam konteks ini adalah nama tempat, sehingga ditransliterasikan sebagai “Ezem”. Konjungsi Ibrani tidak diulang secara kaku karena daftar bahasa Indonesia lebih alami dengan penghubung pada unsur terakhir.
- source_word: וּ/בְ/תוֹלָד
  choice: serta di Tolad
  rationale: וּ menutup rangkaian daftar dan diterjemahkan “serta”, sementara בְ diterjemahkan “di”. תוֹלָד dipertahankan sebagai nama tempat “Tolad”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan wajar untuk kelanjutan sebuah daftar permukiman. Tidak diperlukan catatan kaki tentang alternatif Inggris ‘in/at’, sebab kata depan Indonesia “di” sudah mencakup kedua nuansa lokatif itu tanpa meniadakan ambiguitas sumber.
