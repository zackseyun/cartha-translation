  yaml_path: translation/ot/1_chronicles/004/032.yaml
  text: And their settlements were Etam[a], Ain, Rimmon, Tochen, and Ashan—five cities.
translation:
  language: id
  text: Permukiman[a] mereka ialah Etam, Ain, Rimon, Tokhen, dan Asan—lima kota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “desa-desa mereka.” Istilah Ibrani ini dapat merujuk pada permukiman kecil atau tempat tinggal yang berpagar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: permukiman mereka
  rationale: חָצֵר dapat merujuk pada permukiman, desa, atau tempat tinggal berpagar. Dalam daftar geografis ini, “permukiman” merupakan istilah Indonesia modern yang alami dan cukup luas tanpa menentukan ukuran tempat tersebut.
- source_word: עֵיטָם
  choice: Etam
  rationale: Nama tempat; ditransliterasikan secara wajar ke dalam bahasa Indonesia.
- source_word: עַיִן
  choice: Ain
  rationale: Dalam konteks daftar kota, kata ini berfungsi sebagai nama tempat, bukan sebagai nomina umum yang berarti “mata” atau “mata air”.
- source_word: רִמּוֹן
  choice: Rimon
  rationale: Nama tempat; bentuk dengan satu huruf m mengikuti ejaan nama yang alami dalam bahasa Indonesia.
- source_word: תֹכֶן
  choice: Token
  rationale: Nama tempat; transliterasi Indonesia memakai k untuk konsonan כ dan mempertahankan vokal yang ditunjukkan teks Masoret.
- source_word: עָשָׁן
  choice: Asan
  rationale: Nama tempat; bunyi שׁ dilambangkan dengan s sesuai kebiasaan ejaan nama Ibrani dalam bahasa Indonesia.
- source_word: עָרִים חָמֵשׁ
  choice: lima kota
  rationale: עִיר lazim berarti kota; frasa ini merangkum dan menghitung kelima tempat yang baru disebutkan.
