base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/028.yaml
  text: They lived in Beer-sheba[a], Moladah[b], and Hazar-shual.
translation:
  language: id
  text: Mereka tinggal di Bersyeba, Molada, dan Hazar-Sual.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Mereka tinggal
  rationale: Bentuk wayyiqtol jamak dari יׁשב menyatakan bahwa mereka berdiam di tempat-tempat tersebut. “Tinggal” alami dalam bahasa Indonesia modern dan tidak secara khusus menyiratkan tindakan awal membuka permukiman.
- source_word: בִּבְאֵר שֶׁבַע
  choice: di Bersyeba
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia; preposisi בְּ diterjemahkan “di”.
- source_word: וּמוֹלָדָה
  choice: Molada
  rationale: Nama tempat מוֹלָדָה ditransliterasikan secara wajar ke dalam ejaan bahasa Indonesia.
- source_word: וַחֲצַר שׁוּעָל
  choice: dan Hazar-Sual
  rationale: Nama tempat majemuk ditransliterasikan dengan mempertahankan kedua unsurnya; waw diterjemahkan “dan”, dan tanda hubung memperjelas bahwa keduanya membentuk satu nama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Nama-nama tempat memakai bentuk transliterasi yang sesuai dengan kebiasaan ejaan Indonesia; tidak diperlukan catatan kaki karena variasi ejaan Inggris tidak relevan bagi edisi Indonesia.
