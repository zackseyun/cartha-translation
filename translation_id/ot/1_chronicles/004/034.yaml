  text: dan Mesobab, dan Yamlek, dan Yosa anak Amazia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשׁוֹבָב
  choice: Mesobab
  rationale: Nama diri Ibrani dialihaksarakan ke ejaan yang wajar bagi pembaca Indonesia.
- source_word: יַמְלֵךְ
  choice: Yamlekh
  rationale: Nama diri dialihaksarakan langsung dari Ibrani; huruf awal yod dipertahankan sebagai Y dan kaf akhir bertanda dagesh lemah direpresentasikan sebagai kh sesuai pengucapan tradisional.
- source_word: יוֹשָׁה
  choice: Yosa
  rationale: Nama diri dialihaksarakan dalam bentuk yang alami dalam bahasa Indonesia, dengan yod sebagai Y dan syin sebagai s.
- source_word: בֶּן
  choice: anak
  rationale: Dalam silsilah atau daftar nama, kata Ibrani ini menyatakan hubungan keturunan dan secara alami diterjemahkan 'anak'.
- source_word: אֲמַצְיָה
  choice: Amazia
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וְ
  choice: dan
  rationale: Konjungsi yang berulang sebelum setiap nama dipertahankan untuk mencerminkan susunan daftar dalam teks Ibrani.
