translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Pengulangan 'dan' dipertahankan karena merupakan ciri nyata susunan teks Ibrani. Ejaan nama mengikuti kaidah yang mudah dibaca dalam bahasa Indonesia sambil tetap dekat dengan bentuk Ibrani.
