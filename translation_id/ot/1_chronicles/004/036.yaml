  text: and Elioenai, and Jaakobah, and Jeshohaiah, and Asaiah, and Adiel, and Jesimiel, and Benaiah.
translation:
  language: id
  text: Dan Elyoenai, dan Yaakoba, dan Yesohaya, dan Asaya, dan Adiel, dan Yesimiel, dan Benaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְיוֹעֵינַי
  choice: Elyoenai
  rationale: Nama diri ditransliterasikan menurut pelafalan Ibrani dan ejaan Indonesia; huruf yod di tengah nama dinyatakan dengan y.
- source_word: יַעֲקֹבָה
  choice: Yaakoba
  rationale: Nama diri ditransliterasikan dengan Y untuk yod dan aa untuk mempertahankan pemisahan vokal yang terdengar, dalam bentuk yang tetap mudah dibaca oleh pembaca Indonesia.
- source_word: יְשׁוֹחָיָה
  choice: Yesohaya
  rationale: Nama diri ditransliterasikan langsung ke ejaan Indonesia; syin ditulis s karena dalam bentuk Masoret ini syin tidak bertitik kanan, sedangkan yod dinyatakan dengan y.
- source_word: עֲשָׂיָה
  choice: Asaya
  rationale: Nama diri ditransliterasikan secara wajar dalam bahasa Indonesia, tanpa akhiran ejaan Inggris -iah.
- source_word: עֲדִיאֵל
  choice: Adiel
  rationale: Bentuk ini ringkas, dekat dengan bunyi Ibrani, dan sudah alami dalam ejaan Indonesia.
- source_word: יְשִׂימִיאֵל
  choice: Yesimiel
  rationale: Nama diri ditransliterasikan dari bentuk Masoret ke ejaan Indonesia, dengan y untuk yod dan tanpa mengikuti kebiasaan Inggris memakai J.
- source_word: בְּנָיָה
  choice: Benaya
  rationale: Nama diri ditransliterasikan ke ejaan Indonesia; bentuk -yāh dinyatakan sebagai -ya, bukan ejaan Inggris -iah.
- source_word: וְ / וַ / וִ / וּ
  choice: dan
  rationale: Waw yang mengawali setiap nama dipertahankan sebagai 'dan' untuk mencerminkan gaya polisindeton dalam daftar Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Deretan kata 'dan' sengaja dipertahankan karena setiap nama dalam teks sumber diawali waw. Ejaan nama mengikuti transliterasi yang berorientasi pada pembaca Indonesia, bukan bentuk yang diinggriskan.
