base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/022.yaml
  text: and Jokim[a], and the men of Cozeba, and Joash, and Saraph, who ruled in Moab and returned to Lehem[c][b]. These records are ancient.
translation:
  language: id
  text: dan Yokim, orang-orang dari Kozeba, Yoas, dan Saraf, yang berkuasa di Moab[a], serta Yasubi-Lehem[b]. Hal-hal ini berasal dari zaman dahulu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini tidak pasti. Dapat juga berarti “yang memiliki Moab”, “yang menjadi tuan di Moab”, atau mungkin “yang menikah dengan perempuan Moab”.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani tidak pasti. Frasa ini mungkin merupakan nama diri, “Yasubi-Lehem” (atau “Yasub-Lehem”), bukan “yang kembali ke Lehem”. Sebagian juga menghubungkan tempat itu dengan Betlehem.
    reason: alternative_reading
  - marker: c
    text: Dapat juga diterjemahkan, “Perkara-perkara ini kuno” atau “Hal-hal ini berasal dari masa lampau”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹקִים
  choice: Yokim
  rationale: Nama diri ditransliterasikan dengan ejaan yang alami dalam bahasa Indonesia.
- source_word: אַנְשֵׁי כֹזֵבָא
  choice: orang-orang Kozeba
  rationale: אַנְשֵׁי adalah bentuk jamak konstruktus yang secara harfiah berarti 'orang-orang dari'; כֹזֵבָא diperlakukan sebagai nama tempat.
- source_word: יוֹאָשׁ
  choice: Yoas
  rationale: Memakai bentuk nama Alkitab yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: שָׂרָף
  choice: Saraf
  rationale: Dalam konteks silsilah, bentuk ini dipahami sebagai nama orang, bukan diterjemahkan menurut arti kata bendanya.
- source_word: אֲשֶׁר בָּעֲלוּ לְמוֹאָב
  choice: yang berkuasa di Moab
  rationale: Verba בעל dapat menyatakan penguasaan atau kedudukan sebagai tuan. 'Berkuasa di' menyampaikan kemungkinan itu secara alami tanpa memperinci bentuk pemerintahannya.
- source_word: יָשֻׁבִי לָחֶם
  choice: serta Yasubi-Lehem
  rationale: Frasa Ibrani ini sangat sulit dan mungkin merupakan nama diri gabungan. Teks utama mempertahankannya sebagai nama agar tidak mengubah bacaan yang tidak pasti menjadi pernyataan bahwa seseorang kembali ke suatu tempat.
- source_word: הַדְּבָרִים עַתִּיקִים
  choice: Hal-hal ini berasal dari zaman dahulu
  rationale: דְּבָרִים dapat berarti perkataan, perkara, atau hal-hal; עַתִּיקִים menyatakan sifat kuno. Terjemahan ini mempertahankan keluasan makna tanpa secara tidak pasti menambahkan gagasan 'catatan'.
