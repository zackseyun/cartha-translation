  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat, sesuai konteks daftar silsilah. Nama-nama ditulis dalam bentuk yang mudah dibaca oleh pembaca Indonesia. Ketidakpastian dua ungkapan Ibrani dipertahankan melalui catatan kaki, bukan diselesaikan secara dogmatis dalam teks utama.
