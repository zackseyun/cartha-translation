base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/020.yaml
  text: 'The sons of Shimon: Amnon and Rinnah[a], Ben-Hanan and Tilon[b]. And the sons of Ishi: Zoheth and Ben-Zoheth.'
translation:
  language: id
  text: 'Anak-anak Shimon: Amnon dan Rina, Ben-Hanan[a] dan Tilon. Dan anak-anak Yishi: Zohet dan Ben-Zohet[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “anak Hanan”; tetapi dalam daftar silsilah ini, Ben-Hanan kemungkinan besar merupakan nama pribadi.
    reason: lexical_alternative
  - marker: b
    text: Atau, “anak Zohet”; tetapi dalam daftar silsilah ini, Ben-Zohet kemungkinan besar merupakan nama pribadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן memperkenalkan daftar silsilah. Kata penghubung pada awal ayat tidak ditampilkan karena ayat ini melanjutkan daftar dan bahasa Indonesia lebih alami tanpa “Dan” di sini.
- source_word: שִׁימוֹן
  choice: Shimon
  rationale: Nama pribadi ditransliterasikan langsung dari bentuk Ibrani, bukan diganti dengan bentuk tradisional yang berasal melalui bahasa lain.
- source_word: אַמְנוֹן
  choice: Amnon
  rationale: Transliterasi langsung nama pribadi.
- source_word: וְרִנָּה
  choice: Rina
  rationale: Nama pribadi ditransliterasikan dengan ejaan Indonesia; konsonan rangkap tidak diperlukan untuk mewakili nun berdages dalam ejaan pembaca umum.
- source_word: בֶּן חָנָן
  choice: Ben-Hanan
  rationale: Dalam rangkaian nama ini, frasa tersebut paling wajar berfungsi sebagai satu nama pribadi. Tanda hubung memperjelas kesatuan nama sambil tetap mempertahankan unsur ben.
- source_word: וְתולון
  choice: Tilon
  rationale: Nama pribadi ditransliterasikan menurut pembacaan vokal tradisional teks WLC.
- source_word: וּבְנֵי יִשְׁעִי
  choice: Anak-anak Yishi
  rationale: Rumus silsilah diterjemahkan secara langsung. Bentuk “Yishi” mencerminkan konsonan awal yod dan membedakannya dari kata Indonesia biasa.
- source_word: זוֹחֵת
  choice: Zohet
  rationale: Transliterasi nama pribadi disesuaikan dengan ejaan Indonesia; tav akhir diwakili dengan t.
- source_word: וּבֶן זוֹחֵת
  choice: dan Ben-Zohet
  rationale: Karena tidak ada nama lain sesudah ungkapan “anak Zohet”, konteks daftar nama mendukung pembacaan seluruh bentuk sebagai nama pribadi, sambil tetap mengakui kemungkinan analisis harfiahnya dalam catatan kaki.
