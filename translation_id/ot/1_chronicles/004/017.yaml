  yaml_path: translation/ot/1_chronicles/004/017.yaml
  text: 'The sons of Ezrah: Jether[a], Mered, Epher, and Jalon; and she conceived Miriam, Shammai, and Ishbah[c][b], the father of Eshtemoa.'
translation:
  language: id
  text: Anak-anak Ezrah ialah Yeter, Mered, Efer, dan Yalon[a]; lalu ia mengandung Miryam, Samai, dan Yisbah, ayah Estemoa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi, “Dan anak Ezrah.” Karena sesudahnya tercantum beberapa nama, ungkapan itu dipahami di sini sebagai “Anak-anak Ezrah.”
    reason: textual_variant
  - marker: b
    text: Teks Ibrani hanya mengatakan, “lalu ia mengandung”; subjeknya berbentuk feminin, tetapi perempuan yang dimaksud tidak disebutkan dalam klausa ini. Atau “pendiri Estemoa”, jika Estemoa dipahami sebagai nama kaum atau permukiman, bukan sebagai nama seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן עֶזְרָה
  choice: Anak-anak Ezra
  rationale: Secara harfiah bentuk Ibraninya tunggal, “dan anak Ezra,” tetapi sesudahnya tercantum beberapa nama. Bentuk jamak paling wajar sebagai judul silsilah; bentuk tunggal dicatat dalam catatan kaki.
- source_word: יֶתֶר וּמֶרֶד וְעֵפֶר וְיָלוֹן
  choice: Yeter, Mered, Efer, dan Yalon
  rationale: Nama-nama pribadi dialihaksarakan dalam bentuk yang wajar bagi pembaca bahasa Indonesia.
- source_word: וַתַּהַר
  choice: Lalu perempuan itu mengandung
  rationale: Kata kerja הרה berarti “mengandung/menjadi hamil.” Bentuk feminin tunggalnya dipertahankan tanpa memasukkan nama seorang perempuan yang tidak disebut dalam klausa ini.
- source_word: מִרְיָם וְאֶת שַׁמַּי וְאֶת יִשְׁבָּח
  choice: Miryam, Samai, dan Yisbah
  rationale: Nama-nama tersebut dialihaksarakan tanpa menyimpulkan jenis kelamin atau hubungan silsilah yang tidak dinyatakan secara eksplisit.
- source_word: אֲבִי אֶשְׁתְּמֹעַ
  choice: ayah Estemoa
  rationale: Ini mempertahankan arti formal אָבִי. Dalam konteks silsilah, ungkapan tersebut juga dapat berarti pendiri atau leluhur suatu kaum atau permukiman; kemungkinan itu dicatat dalam catatan kaki.
