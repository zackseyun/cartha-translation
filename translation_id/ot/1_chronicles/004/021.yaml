    rationale: Preposisi לְ dalam לְבֵית אַשְׁבֵּעַ dan konstruksi yang padat tidak memastikan bahwa kelompok itu 'berasal dari' keluarga Asbea. 'Dari keluarga Asbea' mempertahankan hubungan tanpa penambahan makna.
  - severity: low
    issue: Nuansa 'halus' pada בּוּץ belum muncul dalam teks utama.
    rationale: בּוּץ lazim merujuk kepada lenan halus. Karena nuansa ini dapat disampaikan secara alami dalam bahasa Indonesia, sebaiknya dicantumkan.
  - severity: low
    issue: Ejaan 'Lekha' kurang konsisten dengan konvensi ejaan Alkitab Indonesia yang lazim.
    rationale: '''Leka'' adalah bentuk yang lebih umum dalam terjemahan Alkitab Indonesia, sedangkan bentuk Ibrani tidak mengharuskan penggunaan ''kh''.'
