  text: בְּנֵי֙ שֵׁלָ֣ה בֶן יְהוּדָ֔ה עֵ֚ר אֲבִ֣י לֵכָ֔ה וְ/לַעְדָּ֖ה אֲבִ֣י מָרֵשָׁ֑ה וּ/מִשְׁפְּח֛וֹת בֵּית עֲבֹדַ֥ת הַ/בֻּ֖ץ לְ/בֵ֥ית אַשְׁבֵּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/021.yaml
  text: 'The sons of Shelah son of Judah: Er the father of Lecah[a], and Laadah the father of Mareshah, and the clans of the house of linen workers of the house of Ashbea.'
translation:
  language: id
  text: Keturunan Syela, anak Yehuda, ialah Er, leluhur Leka, dan Laeda, leluhur Maresa, serta kaum-kaum dari keluarga para pekerja kain lenan halus, dari keluarga Asbea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani pada bagian akhir ayat ini sangat padat. Secara lebih harfiah dapat diterjemahkan, “kaum-kaum dari keluarga pekerjaan kain lenan halus, dari keluarga Asbea.” Hubungan tepat antara para pekerja itu dan keluarga Asbea tidak pasti. Kata yang diterjemahkan “leluhur” juga dapat berarti “ayah” atau “pendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Keturunan
  rationale: Dalam daftar silsilah, kata ini dapat mencakup keturunan yang lebih luas daripada anak langsung; pilihan ini alami dalam bahasa Indonesia dan sesuai dengan nama-nama kaum serta tempat yang menyusul.
- source_word: שֵׁלָה בֶן יְהוּדָה
  choice: Syela anak Yehuda
  rationale: Nama ditransliterasikan menurut kebiasaan Alkitab bahasa Indonesia, sedangkan hubungan genealogis yang dinyatakan secara eksplisit tetap dipertahankan.
- source_word: אֲבִי
  choice: leluhur
  rationale: Dalam daftar genealogis dan permukiman, istilah ini dapat menunjuk kepada nenek moyang, pendiri, atau tokoh asal suatu kaum atau tempat. 'Leluhur' lebih wajar daripada 'ayah' ketika objeknya mungkin nama tempat, tanpa menghapus nuansa genealogis.
- source_word: לֵכָה
  choice: Lekha
  rationale: Nama diri atau nama tempat ditransliterasikan secara dekat dengan bentuk Ibrani.
- source_word: לַעְדָּה
  choice: Laeda
  rationale: Nama diri ditransliterasikan dalam bentuk yang mudah dibaca penutur bahasa Indonesia sambil mempertahankan unsur vokalnya.
- source_word: מָרֵשָׁה
  choice: Maresa
  rationale: Nama tempat ditransliterasikan menurut pola ejaan Alkitab bahasa Indonesia.
- source_word: מִשְׁפְּחוֹת
  choice: kaum-kaum
  rationale: Dalam konteks suku dan silsilah, istilah ini menunjuk kelompok kekerabatan yang lebih luas daripada keluarga inti.
- source_word: בֵּית עֲבֹדַת הַבֻּץ
  choice: keluarga para pekerja lenan
  rationale: Ungkapan Ibrani yang padat dipahami sebagai suatu rumah atau kelompok kekerabatan yang dikenal karena pekerjaan mengolah bus, yaitu lenan halus.
- source_word: לְבֵית אַשְׁבֵּעַ
  choice: yang berasal dari keluarga Asbea
  rationale: Preposisi לְ dan pengulangan בֵּית menyatakan hubungan dengan rumah atau keluarga Asbea, tetapi jenis hubungan tepatnya tidak pasti; 'berasal dari' menjaga kaitan tersebut tanpa menjadikannya pasti sebagai lokasi.
theological_decisions: []
