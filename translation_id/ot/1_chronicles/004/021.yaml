revisions:
- from: Keturunan Syela anak Yehuda ialah Er, leluhur Lekha, dan Laeda, leluhur Maresa, serta kaum-kaum dari keluarga para pekerja lenan yang berasal dari keluarga Asbea.[a]
  to: Keturunan Syela, anak Yehuda, ialah Er, leluhur Leka, dan Laeda, leluhur Maresa, serta kaum-kaum dari keluarga para pekerja kain lenan halus, dari keluarga Asbea.[a]
  rationale: Revisi menghilangkan tambahan makna 'berasal dari', memulihkan nuansa 'lenan halus', dan menyesuaikan ejaan Leka dengan pemakaian Indonesia yang lazim. Catatan kaki kini menjelaskan kepadatan sintaksis dan ketidakpastian hubungan dengan keluarga Asbea tanpa menyatakannya sebagai nama tempat atau asal-usul yang pasti.
