  register: Bahasa Indonesia baku, modern, dan naratif. Susunan dengan tanda pisah mempertahankan keterangan jumlah yang disisipkan dalam teks Ibrani, sedangkan 'sebagai pemimpin mereka' menyampaikan idiom Ibrani secara alami.
