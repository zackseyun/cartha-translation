id: 1CH.4.42
reference: 1 Chronicles 4:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מֵ/הֶ֣ם מִן בְּנֵ֣י שִׁמְע֗וֹן הָלְכוּ֙ לְ/הַ֣ר שֵׂעִ֔יר אֲנָשִׁ֖ים חֲמֵ֣שׁ מֵא֑וֹת וּ/פְלַטְיָ֡ה וּ֠/נְעַרְיָה וּ/רְפָיָ֧ה וְ/עֻזִּיאֵ֛ל בְּנֵ֥י יִשְׁעִ֖י בְּ/רֹאשָֽׁ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/042.yaml
  text: And some of them[a], from the sons of Simeon, went to Mount Seir—five hundred men—with Pelatiah, Neariah, Rephaiah, and Uzziel, sons of Ishi, at their head.
translation:
  language: id
  text: Sebagian dari mereka, yaitu dari keturunan Simeon, pergi ke Gunung Seir—lima ratus orang—bersama Pelaca, Nearia, Refaya, dan Uziel, anak-anak Yisei, sebagai pemimpin mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di depan mereka” atau “di kepala mereka”; ungkapan Ibrani ini menunjukkan bahwa keempat anak Yisei memimpin rombongan tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם מִן בְּנֵי שִׁמְעוֹן
  choice: Sebagian dari mereka, yaitu dari keturunan Simeon
  rationale: Frasa pertama menyatakan sebagian dari kelompok yang disebut sebelumnya, sedangkan frasa berikutnya memperjelas bahwa mereka berasal dari garis keturunan Simeon. 'Keturunan Simeon' mempertahankan corak silsilah tanpa terdengar kaku dalam bahasa Indonesia.
- source_word: הָלְכוּ לְהַר שֵׂעִיר
  choice: pergi ke Gunung Seir
  rationale: Kata kerja ini adalah kata umum untuk gerak dan tidak dengan sendirinya menyiratkan perjalanan atau gerakan militer. 'Gunung Seir' mempertahankan bentuk nama tempat tradisional.
- source_word: אֲנָשִׁים חֲמֵשׁ מֵאוֹת
  choice: lima ratus orang
  rationale: Ungkapan bilangan ini menerangkan jumlah kelompok tanpa menambahkan nuansa pasukan yang tidak dinyatakan secara eksplisit.
- source_word: וּפְלַטְיָה וּנְעַרְיָה וּרְפָיָה וְעֻזִּיאֵל
  choice: bersama Pelaca, Nearia, Refaya, dan Uziel
  rationale: '''Bersama'' menghubungkan keempat nama secara wajar dengan rombongan tersebut. Ejaan nama mengikuti bentuk yang lazim dan mudah dibaca dalam Alkitab bahasa Indonesia.'
- source_word: בְּנֵי יִשְׁעִי
  choice: anak-anak Yisei
  rationale: Terjemahan ini mempertahankan penyebutan hubungan keluarga secara langsung; keempat nama sebelumnya dipahami sebagai anak-anak Yisei.
- source_word: בְּרֹאשָׁם
  choice: sebagai pemimpin mereka
  rationale: Secara harfiah ungkapan ini berarti 'di kepala/depan mereka', sebuah idiom yang menunjukkan bahwa anak-anak Yisei memimpin rombongan itu.
