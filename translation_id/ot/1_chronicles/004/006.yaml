  text: וַ/תֵּ֨לֶד ל֤/וֹ נַעֲרָה֙ אֶת אֲחֻזָּ֣ם וְ/אֶת חֵ֔פֶר וְ/אֶת תֵּימְנִ֖י וְ/אֶת הָ/אֲחַשְׁתָּרִ֑י אֵ֖לֶּה בְּנֵ֥י נַעֲרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/006.yaml
  text: Naarah bore to him Ahuzzam[a], Hepher, Temeni, and Haahashtari[b]. These were the sons of Naarah.
translation:
  language: id
  text: Naara melahirkan baginya Ahuzam, Hefer, Temeni[a], dan Haahastari[b]. Mereka inilah anak-anak lelaki Naara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Temeni juga dapat dipahami sebagai sebutan, misalnya “Temenit” atau “orang selatan”, tetapi dalam silsilah ini dipertahankan sebagai nama diri.
    reason: lexical_alternative
  - marker: b
    text: Haahastari juga dapat ditransliterasikan “Ahastari”. Bentuk Ibraninya memakai kata sandang di awal, yang mungkin telah menjadi bagian tetap dari nama tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: melahirkan
  rationale: Bentuk wayyiqtol dari ילד menyampaikan pemberitahuan kelahiran dalam silsilah dan mempertahankan Naara sebagai subjek perempuan.
- source_word: לוֹ
  choice: baginya
  rationale: Preposisi ל dengan akhiran pronominal menunjuk kepada pihak laki-laki dalam rumus silsilah. Terjemahan ini mempertahankan rujukan tersebut tanpa menambahkan identitas atau hubungan yang tidak dinyatakan dalam ayat.
- source_word: נַעֲרָה
  choice: Naara
  rationale: Nama diri ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia dan dipertahankan secara konsisten pada kedua kemunculannya.
- source_word: אֶת ... וְאֶת ...
  choice: diwakili oleh urutan kata dan susunan daftar
  rationale: Partikel objek langsung yang berulang tidak memiliki padanan yang perlu dinyatakan tersendiri dalam bahasa Indonesia.
- source_word: אֲחֻזָּם
  choice: Ahuzam
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia; konsonan rangkap Ibrani tidak perlu digandakan dalam ejaan Indonesia.
- source_word: חֵפֶר
  choice: Hefer
  rationale: Nama diri ditransliterasikan dengan f untuk huruf פ tanpa dagesh, sesuai pelafalan Ibrani dan ejaan Indonesia.
- source_word: תֵּימְנִי
  choice: Temeni
  rationale: Walaupun bentuknya dapat dipahami sebagai kata sifat atau sebutan asal, posisinya dalam daftar silsilah paling wajar dipertahankan sebagai nama diri tanpa menutup kemungkinan leksikal lain.
- source_word: הָאֲחַשְׁתָּרִי
  choice: Haahastari
  rationale: Unsur הָ yang mengawali bentuk Ibrani dipertahankan sebagai bagian nama, sedangkan ח ditransliterasikan secara wajar sebagai h dalam bentuk nama Indonesia.
- source_word: אֵלֶּה
  choice: Mereka inilah
  rationale: Ungkapan ini secara alami menandai bahwa nama-nama yang baru disebut adalah kelompok yang diringkas oleh pernyataan berikutnya.
- source_word: בְּנֵי
  choice: anak-anak lelaki
  rationale: Dalam konteks silsilah, bentuk ini secara khusus merujuk kepada keturunan laki-laki; pilihan ini mempertahankan informasi gender yang ada dalam teks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Rumus silsilah dipertahankan tanpa memperjelas secara spekulatif siapa yang dirujuk oleh “baginya”. Penanda catatan kaki ditempatkan langsung pada nama yang dibahas.
