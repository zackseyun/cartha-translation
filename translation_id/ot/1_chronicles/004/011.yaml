  text: וּ/כְל֥וּב אֲחִֽי שׁוּחָ֖ה הוֹלִ֣יד אֶת מְחִ֑יר ה֖וּא אֲבִ֥י אֶשְׁתּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/011.yaml
  text: Chelub[a], the brother of Shuhah, fathered Mehir; he was the father of Eshton.
translation:
  language: id
  text: Kelub, saudara Suha, memperanakkan Mehir; dialah ayah Eston.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “leluhur/pendiri Eston.” Dalam daftar silsilah, “ayah” kadang-kadang dapat berarti leluhur suatu kaum atau pendiri sebuah permukiman, bukan hanya ayah biologis langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְלוּב
  choice: Kelub
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia; waw penghubung tidak perlu diterjemahkan dengan “dan” karena ayat ini dapat berdiri sebagai pemberitahuan silsilah yang alami.
- source_word: אֲחִי שׁוּחָה
  choice: saudara Suha
  rationale: Rangkaian konstruksi ini menyatakan hubungan kekerabatan secara langsung. Bahasa Indonesia tidak mengharuskan penandaan jenis kelamin pada kata “saudara”; konteks nama laki-laki mencukupi.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah menyatakan bahwa seseorang menghasilkan keturunan atau menjadi ayah. “Memperanakkan” ringkas, lazim dalam teks silsilah, dan tidak membatasi hubungan itu secara lebih ketat daripada konteks.
- source_word: מְחִיר
  choice: Mehir
  rationale: Nama diri ditransliterasikan dengan bentuk yang sesuai bagi pembaca Indonesia.
- source_word: הוּא
  choice: dialah
  rationale: Pronomina mandiri mempertahankan penegasan dalam bahasa Ibrani dan secara alami merujuk kepada Mehir, tokoh yang baru disebut, tanpa mengganti struktur itu dengan nama yang diulang.
- source_word: אֲבִי
  choice: ayah
  rationale: Makna dasar אב dipertahankan. Dalam daftar silsilah, istilah ini juga dapat menunjuk leluhur atau pendiri suatu kaum maupun permukiman; kemungkinan itu dijelaskan dalam catatan kaki.
- source_word: אֶשְׁתּוֹן
  choice: Eston
  rationale: Nama diri ditransliterasikan dengan menyesuaikan bunyi שׁ sebagai “s” dan gugus konsonan bagi ejaan Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat, dengan gaya silsilah yang tetap mudah dipahami. Tanda titik koma mempertahankan hubungan erat antara kedua klausa. Penanda catatan kaki ditempatkan sesudah frasa “ayah Eston,” yaitu pada unsur yang memiliki kemungkinan makna alternatif.
