  text: וּ/בְנֵ֖י יְהַלֶּלְאֵ֑ל זִ֣יף וְ/זִיפָ֔ה תִּירְיָ֖א וַ/אֲשַׂרְאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/016.yaml
  text: 'And the sons of Jehallelel: Ziph[a], Ziphah, Tiria, and Asarel.'
translation:
  language: id
  text: Anak-anak Yehaleleel ialah Zif, Zifa, Tiria, dan Asarel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Asarel juga dapat dieja “Asareel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak ... ialah
  rationale: Bentuk jamak konstruksi בְנֵי memperkenalkan anak-anak atau keturunan dalam silsilah. Dalam bahasa Indonesia, susunan dengan “ialah” membuat daftar nama terbaca alami; waw penghubung tidak perlu diterjemahkan tersendiri pada awal ayat yang berupa fragmen silsilah.
- source_word: יְהַלֶּלְאֵל
  choice: Yehaleleel
  rationale: Nama diri dialihaksarakan dengan bentuk yang wajar dalam bahasa Indonesia dan mempertahankan unsur-unsur konsonantal nama Ibrani.
- source_word: זִיף
  choice: Zif
  rationale: Nama diri dialihaksarakan secara langsung; huruf akhir fe tanpa dagesh dinyatakan dengan “f” dalam ejaan Indonesia.
- source_word: וְזִיפָה
  choice: Zifa
  rationale: Nama diri dialihaksarakan sebagai Zifa; waw penghubung di antara unsur-unsur daftar tidak harus dinyatakan berulang kali dalam bahasa Indonesia.
- source_word: תִּירְיָא
  choice: Tiria
  rationale: Alih aksara yang dekat dengan pelafalan bentuk Masoret dan alami dalam ejaan Indonesia.
- source_word: וַאֲשַׂרְאֵל
  choice: dan Asarel
  rationale: Waw diterjemahkan “dan” untuk menandai unsur terakhir daftar. Bentuk “Asarel” mengikuti vokalisasi Masoret secara langsung, sementara ejaan tradisional alternatif dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan sesuai dengan gaya daftar silsilah. Nama-nama diri dialihaksarakan tanpa diterjemahkan. Tanda catatan kaki ditempatkan sesudah nama Asarel karena catatan menjelaskan variasi ejaan nama tersebut.
