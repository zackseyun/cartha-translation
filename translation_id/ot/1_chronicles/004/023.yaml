base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/023.yaml
  text: These were the potters and the inhabitants of Netaim and Gederah[a]; they lived there with the king for his work.
translation:
  language: id
  text: Mereka inilah para pembuat tembikar dan penduduk Netaim dan Gederah[a]. Mereka tinggal di sana bersama raja dalam pekerjaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “Mereka inilah para pembuat tembikar dan orang-orang yang tinggal di antara tanaman-tanaman dan tembok atau pagar pembatas.” Istilah Ibrani yang diterjemahkan sebagai Netaim dan Gederah dapat dibaca sebagai nama tempat atau sebagai kata benda umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Mereka adalah
  rationale: Kata ganti penunjuk ini merujuk kembali kepada kelompok dalam silsilah sebelumnya; bahasa Indonesia secara alami memakai kopula “adalah” dalam klausa identifikasi.
- source_word: הַיּוֹצְרִים
  choice: para pembuat tembikar
  rationale: Bentuk dari יצר menunjuk kepada orang-orang yang membentuk bahan, dan dalam konteks ini secara lazim dipahami sebagai pekerja yang membuat tembikar.
- source_word: וְיֹשְׁבֵי
  choice: dan penduduk
  rationale: Partisip konstruk dari ישב menunjuk kepada orang-orang yang menetap; “penduduk” mempertahankan daya nominalnya dan terdengar wajar dalam bahasa Indonesia.
- source_word: נְטָעִים
  choice: Netaim
  rationale: Dalam konteks silsilah-geografis, istilah ini paling mungkin merupakan nama tempat, meskipun secara leksikal juga dapat berarti “tanaman-tanaman” atau “tempat-tempat penanaman”.
- source_word: וּגְדֵרָה
  choice: serta Gedera
  rationale: Sejajar dengan Netaim, istilah ini paling mungkin dibaca sebagai nama tempat; “serta” menghindari rangkaian kata “dan” yang kaku.
- source_word: עִם הַמֶּלֶךְ
  choice: bersama raja
  rationale: Terjemahan ini mempertahankan arti dasar preposisi עִם, tanpa secara diam-diam mempersempit hubungan tersebut menjadi semata-mata pelayanan resmi.
- source_word: בִּמְלַאכְתּוֹ
  choice: untuk mengerjakan pekerjaannya
  rationale: מְלָאכָה dapat berarti pekerjaan, tugas, atau pelayanan. Rumusan ini menyatakan keterlibatan mereka dalam pekerjaan milik raja sambil mempertahankan rujukan pronominal yang ada dalam teks.
- source_word: יָשְׁבוּ שָׁם
  choice: Mereka tinggal di sana
  rationale: Bentuk kata kerja ישב bersama שָׁם menyatakan bahwa mereka menetap atau tinggal di tempat tersebut; pilihan ini alami dalam bahasa Indonesia modern.
