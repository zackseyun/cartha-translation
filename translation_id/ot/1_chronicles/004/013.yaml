base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/013.yaml
  text: 'The sons of Kenaz: Othniel and Seraiah[a]. And the sons of Othniel: Hathath.'
translation:
  language: id
  text: 'Anak-anak Kenas: Otniel dan Seraya. Dan anak-anak Otniel: Hatat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְנַז
  choice: Anak-anak Kenas
  rationale: Bentuk jamak konstruktus בְנֵי diterjemahkan secara transparan sebagai “anak-anak”; waw pembuka tidak dinyatakan karena ayat ini memulai baris silsilah baru. Nama קְנַז ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: עָתְנִיאֵל
  choice: Otniel
  rationale: Nama diri Ibrani ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: וּשְׂרָיָה
  choice: dan Seraya
  rationale: Waw dinyatakan sebagai “dan”, sedangkan nama שְׂרָיָה ditransliterasikan sesuai pelafalan Ibrani dan kebiasaan ejaan Indonesia.
- source_word: וּבְנֵי עָתְנִיאֵל
  choice: Anak-anak Otniel
  rationale: Rumus silsilah yang berulang dipertahankan. Kata “dan” tidak diperlukan pada awal kalimat Indonesia yang baru, sementara bentuk jamak “anak-anak” tetap dipertahankan meskipun hanya Hatat yang disebut.
- source_word: חֲתַת
  choice: Hatat
  rationale: Nama diri ditransliterasikan langsung ke ejaan Indonesia.
