id: 1CH.4.12
reference: 1 Chronicles 4:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶשְׁתּ֗וֹן הוֹלִ֞יד אֶת בֵּ֤ית רָפָא֙ וְ/אֶת פָּסֵ֔חַ וְ/אֶת תְּחִנָּ֖ה אֲבִ֣י עִ֣יר נָחָ֑שׁ אֵ֖לֶּה אַנְשֵׁ֥י רֵכָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/012.yaml
  text: Eshton fathered Beth-rapha[a], Paseah, and Tehinnah, the father of Ir-nahash[b]. These were the men of Rekah.
translation:
  language: id
  text: Eston memperanakkan Bet-Rafa, Paseah, dan Tehina, ayah[a] Ir-Nahas[b]. Mereka inilah orang-orang Rekha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam silsilah, “ayah” juga dapat berarti leluhur atau pendiri suatu kaum atau permukiman, bukan hanya ayah biologis langsung.
    reason: lexical_alternative
  - marker: b
    text: Ir-Nahas dapat berarti “kota Nahas”, tetapi di sini kemungkinan besar berfungsi sebagai nama tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Dalam silsilah, bentuk kausatif dari ילד menyatakan bahwa seseorang menjadi ayah atau menghasilkan garis keturunan. “Memperanakkan” mempertahankan bentuk ringkas khas silsilah tanpa memakai ungkapan arkais.
- source_word: בֵּית רָפָא
  choice: Bet-Rafa
  rationale: Dalam susunan nama-nama ini, bentuk tersebut paling wajar diperlakukan sebagai nama diri dan ditransliterasikan, bukan diterjemahkan menjadi “rumah Rafa”.
- source_word: פָּסֵחַ
  choice: Paseah
  rationale: Nama diri ini ditransliterasikan sesuai pola ejaan nama Ibrani yang lazim dalam bahasa Indonesia.
- source_word: תְּחִנָּה
  choice: Tehina
  rationale: Di sini kata tersebut berfungsi sebagai nama diri, sehingga ditransliterasikan dan tidak diterjemahkan menurut arti kata bendanya, “permohonan”.
- source_word: אֲבִי עִיר נָחָשׁ
  choice: ayah Ir-Nahas
  rationale: “Ayah” mempertahankan ungkapan genealogis Ibrani. Dalam konteks seperti ini, istilah itu dapat menunjuk kepada ayah biologis, leluhur, atau pendiri suatu kelompok maupun permukiman; ambiguitas tersebut dijelaskan dalam catatan kaki.
- source_word: אֵלֶּה אַנְשֵׁי רֵכָה
  choice: Mereka inilah orang-orang Rekha
  rationale: אַנְשֵׁי dapat berarti para lelaki atau, dalam catatan silsilah, orang-orang yang terkait dengan suatu kaum atau tempat. “Orang-orang Rekha” alami dalam bahasa Indonesia dan tidak membatasi rujukannya secara tidak perlu.
- source_word: רֵכָה
  choice: Rekha
  rationale: Bentuk ini adalah nama diri atau nama tempat dan karena itu ditransliterasikan.
theological_decisions:
- issue: Makna genealogis אֲבִי (“ayah”)
  choice: Mempertahankan “ayah” dalam teks dan menjelaskan keluasan maknanya dalam catatan kaki
  alternative: “pendiri Ir-Nahas”
  rationale: Teks Ibrani tidak memastikan apakah hubungan yang dimaksud adalah ayah biologis, leluhur, atau pendiri. Menerjemahkan langsung sebagai “pendiri” akan menutup ambiguitas yang asli.
translation_notes:
  register: 'Bahasa Indonesia baku, ringkas, dan bermartabat, dengan pola kalimat silsilah yang tetap mudah dipahami. Nama-nama Ibrani disesuaikan dengan ejaan Indonesia: Eston, Bet-Rafa, Paseah, Tehina, Ir-Nahas, dan Rekha.'
