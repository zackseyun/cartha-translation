  source_fidelity: 'Teks Indonesia dengan tepat mencerminkan struktur Ibrani: Eston sebagai subjek הוֹלִיד, tiga nama sebagai objek, dan “ayah Ir-Nahas” sebagai keterangan aposisional bagi Tehina. Terjemahan “ayah” mempertahankan keluasan makna אֲבִי dalam silsilah tanpa secara prematur memilih “pendiri.” Ir-Nahas diperlakukan sebagai nama tempat, selaras dengan konteks onomastik dan audit bahasa Inggris.'
