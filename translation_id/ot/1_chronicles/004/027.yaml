  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/לְ/שִׁמְעִ֞י בָּנִ֨ים שִׁשָּׁ֤ה עָשָׂר֙ וּ/בָנ֣וֹת שֵׁ֔שׁ וּ/לְ/אֶחָ֕י/ו אֵ֖ין בָּנִ֣ים רַבִּ֑ים וְ/כֹל֙ מִשְׁפַּחְתָּ֔/ם לֹ֥א הִרְבּ֖וּ עַד בְּנֵ֥י יְהוּדָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/027.yaml
  text: Shimei had sixteen sons and six daughters[a], but his brothers did not have many sons, and all their clans did not multiply as much as the sons of Judah.
translation:
  language: id
  text: Simei mempunyai enam belas anak laki-laki dan enam anak perempuan. Namun, saudara-saudaranya tidak mempunyai banyak anak laki-laki, dan seluruh kaum mereka tidak bertambah banyak seperti keturunan Yehuda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak menjadi sebanyak keturunan Yehuda.”'
    reason: Alternatif ini mempertahankan nuansa langsung הִרְבּוּ sebagai menjadi atau mencapai jumlah yang banyak, alih-alih proses “bertambah banyak”.
lexical_decisions:
- source_word: וּלְשִׁמְעִי
  choice: Simei mempunyai
  rationale: Konstruksi ל dengan subjek silsilah menyatakan kepunyaan atau keberadaan, sehingga secara alami diterjemahkan dengan “mempunyai”. Nama שִׁמְעִי ditransliterasikan menurut bentuk Indonesia yang lazim, “Simei”.
- source_word: בָּנִים שִׁשָּׁה עָשָׂר וּבָנוֹת שֵׁשׁ
  choice: enam belas anak laki-laki dan enam anak perempuan
  rationale: Jumlah ditempatkan sebelum nomina sesuai susunan alami bahasa Indonesia, dengan pembedaan jenis kelamin yang dinyatakan dalam teks Ibrani.
- source_word: וּלְאֶחָיו
  choice: Namun, saudara-saudaranya
  rationale: ו secara harfiah berarti “dan”, tetapi di sini menghubungkan klausa yang berlawanan dengan banyaknya anak Simei; “Namun” menyatakan hubungan wacana itu secara alami.
- source_word: אֵין בָּנִים רַבִּים
  choice: tidak mempunyai banyak anak laki-laki
  rationale: Konstruksi eksistensial אֵין bersama subjek berpreposisi menyatakan ketiadaan atau kekurangan. Pilihan ini mempertahankan רַבִּים sebagai “banyak” tanpa melebihkannya.
- source_word: וְכֹל מִשְׁפַּחְתָּם
  choice: dan seluruh kaum mereka
  rationale: מִשְׁפָּחָה dalam konteks silsilah menunjuk pada kelompok kekerabatan atau kaum, bukan semata-mata keluarga inti. Bentuk tunggal kolektif dipertahankan melalui “seluruh kaum mereka”.
- source_word: לֹא הִרְבּוּ
  choice: tidak bertambah banyak
  rationale: Bentuk Hifil dari רבה di sini menyatakan peningkatan jumlah. “Bertambah banyak” menyampaikan makna demografis tersebut secara wajar.
- source_word: עַד בְּנֵי יְהוּדָה
  choice: seperti keturunan Yehuda
  rationale: 'עַד menyatakan batas atau taraf perbandingan: kaum mereka tidak mencapai jumlah kelompok Yehuda. Dalam konteks silsilah, בְּנֵי paling jelas dan alami diterjemahkan “keturunan”.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “kaum” dipakai untuk satuan kekerabatan dalam silsilah, sedangkan “keturunan Yehuda” menghindari kesan bahwa yang dimaksud hanya anak-anak langsung Yehuda. Penanda catatan kaki ditempatkan pada klausa yang diterangkannya.
