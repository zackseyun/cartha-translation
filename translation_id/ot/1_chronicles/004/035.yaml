translation:
  language: id
  text: dan Yoel[a], dan Yehu anak Yosibya, anak Seraya, anak Asiel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam silsilah, kata Ibrani yang diterjemahkan “anak” kadang-kadang dapat berarti keturunan yang lebih jauh, tetapi di sini diterjemahkan secara harfiah sesuai dengan rumus silsilah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: dan
  rationale: Kata sambung berprefiks ini menghubungkan nama tersebut dengan daftar sebelumnya; diterjemahkan secara langsung sebagai “dan”.
- source_word: יוֹאֵל
  choice: Yoel
  rationale: Nama diri ini dialihaksarakan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְ
  choice: dan
  rationale: Kata sambung kedua memperkenalkan orang berikutnya dalam daftar dan mempertahankan susunan berantai silsilah.
- source_word: יֵהוּא
  choice: Yehu
  rationale: Nama diri ini dialihaksarakan dalam bentuk Indonesia yang lazim dan cukup dekat dengan bentuk Ibraninya.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rumus silsilah, kata ini biasanya menunjukkan hubungan anak laki-laki, tetapi dapat pula merujuk kepada keturunan yang lebih jauh; “anak” mempertahankan bentuk harfiahnya.
- source_word: יֹשִׁבְיָה
  choice: Yosibya
  rationale: Nama diri dialihaksarakan ke ejaan Indonesia dengan bentuk yang wajar dan dekat dengan bunyi Ibrani.
- source_word: בֶּן
  choice: anak
  rationale: Penanda silsilah yang berulang diterjemahkan secara konsisten untuk mempertahankan ritme dan keterbukaan struktur sumber.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Nama diri dialihaksarakan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Penanda silsilah yang berulang diterjemahkan secara konsisten sebagai “anak”.
- source_word: עֲשִׂיאֵל
  choice: Asiel
  rationale: Nama diri dialihaksarakan sebagai “Asiel”, bentuk yang ringkas dan sesuai dengan nama Ibrani.
