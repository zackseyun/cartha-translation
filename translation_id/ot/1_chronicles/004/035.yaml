  source_fidelity: 'Teks Indonesia secara tepat mempertahankan dua waw berturut-turut sebagai “dan” dan rantai silsilah בן tiga kali sebagai “anak”. Semua nama sesuai dengan bentuk Ibrani dan bentuk yang lazim dalam bahasa Indonesia: Yoel, Yehu, Yosibya, Seraya, dan Asiel. Tidak ada unsur makna sumber yang ditambah atau dihilangkan.'
  naturalness: Ungkapan “dan Yoel, dan Yehu anak Yosibya, anak Seraya, anak Asiel” baku dan dapat dipahami dalam gaya daftar silsilah Alkitab. Pengulangan “dan” dan “anak” memang agak formal, tetapi wajar serta mencerminkan struktur sumber.
