  text: And they struck down the remnant of the survivors of Amalek[b][a], and they lived there to this day.
translation:
  language: id
  text: Mereka menumpas sisa orang-orang Amalek yang selamat[a], lalu menetap di sana sampai hari ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sisa dari orang-orang Amalek yang lolos.” Bahasa Ibrani menggabungkan dua istilah yang hampir bersinonim untuk orang-orang yang masih tersisa setelah kehancuran.
    reason: lexical_alternative
  - marker: b
    text: Atau “tinggal di sana sampai hari ini.” Kata Ibrani ini dapat berarti tinggal atau menetap di suatu tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: mereka menumpas
  rationale: Bentuk naratif dari נכה menyatakan tindakan menyerang atau memukul kalah dalam konteks militer. “Menumpas” menyampaikan akibat keras yang sangat mungkin dimaksudkan di sini tanpa memakai uraian yang panjang.
- source_word: שְׁאֵרִית הַפְּלֵטָה
  choice: sisa ... yang selamat
  rationale: Kedua nomina Ibrani yang hampir bersinonim menekankan bahwa kelompok ini adalah orang-orang yang masih tersisa setelah kehancuran sebelumnya. Ungkapan Indonesia ini mempertahankan kedua unsur gagasan tersebut secara wajar.
- source_word: לַעֲמָלֵק
  choice: orang-orang Amalek
  rationale: Nama Amalek di sini menunjuk kepada kelompok bangsa yang terkait dengannya. Bentuk “orang-orang Amalek” jelas dan alami dalam bahasa Indonesia modern.
- source_word: וַיֵּשְׁבוּ
  choice: lalu menetap
  rationale: ישׁב dapat berarti duduk, tinggal, atau menetap. Dalam konteks penguasaan wilayah, “menetap” paling alami dan tetap mempertahankan nuansa pembentukan tempat tinggal.
- source_word: שָׁם
  choice: di sana
  rationale: Adverbia tempat ini merujuk kepada wilayah yang baru disebut dalam konteks sebelumnya.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ini adalah padanan idiomatis baku bagi ungkapan waktu Ibrani yang melihat keadaan tersebut masih berlangsung pada masa penutur.
