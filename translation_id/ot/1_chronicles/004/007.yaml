  text: וּ/בְנֵ֖י חֶלְאָ֑ה צֶ֥רֶת יצחר וְ/אֶתְנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/007.yaml
  text: 'And the sons of Helah: Zereth[a], Izhar[b], and Ethnan.'
translation:
  language: id
  text: Anak-anak[a] Hela ialah Zeret, Yizhar, dan Etnan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam rumus silsilah Ibrani, “anak-anak” dapat berarti anak langsung atau, secara lebih luas, keturunan dalam suatu garis keluarga.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruksi בְנֵי secara harfiah berarti “anak-anak lelaki dari” dan merupakan rumus silsilah yang lazim. Dalam bahasa Indonesia, “anak-anak” terdengar alami dan, sesuai konteks silsilah, dapat pula mencakup keturunan. Konjungsi ו tidak perlu diterjemahkan tersendiri karena ayat ini melanjutkan daftar nama dan pembukaan dengan “Dan” akan terasa kaku.
- source_word: חֶלְאָה
  choice: Hela
  rationale: Nama diri ditransliterasikan menurut bunyi Ibrani ke dalam ejaan Indonesia; akhiran ה pada nama ini diwakili oleh vokal akhir “a”.
- source_word: צֶרֶת
  choice: Zeret
  rationale: Nama diri ditransliterasikan secara langsung; huruf ת diwujudkan sebagai “t”, sesuai ejaan Indonesia dan tanpa mengikuti konvensi Inggris “th”.
- source_word: יצחר
  choice: Yizhar
  rationale: Nama diri dipertahankan sebagai transliterasi. Huruf awal י diwakili oleh “Y”, sedangkan צ dan ח dalam bentuk nama yang dikenal ini direpresentasikan secara wajar sebagai “z” dan “h” bagi pembaca Indonesia.
- source_word: וְאֶתְנָן
  choice: dan Etnan
  rationale: Konjungsi ו diterjemahkan “dan” untuk menghubungkan nama terakhir dalam deret; nama אֶתְנָן ditransliterasikan “Etnan” dalam ejaan Indonesia.
theological_decisions:
- issue: Cakupan istilah silsilah בְנֵי
  choice: Diterjemahkan “anak-anak” dan diberi catatan bahwa istilah itu dapat berarti keturunan.
  alternative: “keturunan” langsung dalam teks utama
  rationale: Terjemahan ini mempertahankan bentuk dasar ungkapan Ibrani tanpa membatasi secara tidak perlu apakah hubungan yang dimaksud adalah anak langsung atau anggota garis keturunan yang lebih luas.
translation_notes:
  register: Bahasa dibuat ringkas dan wajar sesuai bentuk daftar silsilah. Nama-nama ditransliterasikan menurut kebiasaan ejaan Indonesia, bukan konvensi transliterasi Inggris.
