base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/008.yaml
  text: Koz fathered Anub[a], Hazzobebah[b], and the families of Aharhel son of Harum.
translation:
  language: id
  text: Koz memperanakkan Anub, Hazzobeba[a], dan kaum-kaum[b] Aharhel, anak Harum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Zobeba”, jika kata sandang yang melekat dalam bahasa Ibrani tidak dimasukkan ke dalam transliterasi nama.
    reason: lexical_alternative
  - marker: b
    text: Atau “klan-klan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹץ
  choice: Koz
  rationale: Nama diri ditransliterasikan langsung dari bentuk konsonantal Ibrani; bentuk ini tidak memakai kata sandang yang dapat mendukung bentuk “Hakos” atau “Hakkoz”.
- source_word: הוֹלִ֔יד
  choice: memperanakkan
  rationale: Dalam silsilah, bentuk Hifil dari ילד menyatakan hubungan memperanakkan atau menurunkan. “Memperanakkan” ringkas dan mempertahankan bentuk aktif teks, termasuk ketika hubungan itu mencakup kelompok keturunan.
- source_word: עָנ֖וּב
  choice: Anub
  rationale: Nama diri ditransliterasikan sesuai bentuk Masoret.
- source_word: הַ/צֹּבֵבָ֑ה
  choice: Hazobeba
  rationale: Transliterasi nama ini mempertahankan unsur awal dari kata sandang Ibrani dan menyesuaikan ejaannya agar wajar dalam bahasa Indonesia. Bentuk “Zobeba” tetap mungkin jika kata sandang tidak dimasukkan ke dalam nama.
- source_word: וּ/מִשְׁפְּח֥וֹת
  choice: dan kaum-kaum
  rationale: Dalam konteks silsilah, מִשְׁפָּחוֹת menunjuk pada kelompok-kelompok kekerabatan. “Kaum-kaum” alami dalam ragam Alkitab Indonesia dan tidak membatasi maknanya pada keluarga inti.
- source_word: אֲחַרְחֵ֖ל
  choice: Aharhel
  rationale: Nama diri ditransliterasikan langsung.
- source_word: בֶּן
  choice: anak
  rationale: Penanda silsilah Ibrani ini diterjemahkan dengan istilah Indonesia yang jelas dan netral.
- source_word: הָרֽוּם
  choice: Harum
  rationale: Nama diri mengikuti vokalisasi Masoret; bentuk alternatif “Haram” tidak dipilih karena kurang sesuai dengan penunjukan vokal dalam WLC.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern dan bermartabat dengan susunan silsilah yang ringkas. “Memperanakkan” dipertahankan karena tepat dalam konteks genealogis, sedangkan “anak” dipilih daripada “bin” agar netral dan mudah dipahami luas. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
