base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/026.yaml
  text: 'The sons of Mishma: Hammuel his son, Zaccur his son, Shimei his son.'
translation:
  language: id
  text: Anak-anak Misma ialah Hamuel, anaknya; Zakur, anaknya; dan Simei, anaknya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak ... ialah
  rationale: בְנֵי adalah bentuk jamak terikat dari 'anak laki-laki'. Dalam daftar silsilah, konstruksi ini paling alami diperkenalkan dengan 'Anak-anak ... ialah'; waw penghubung tidak perlu diterjemahkan tersendiri karena ayat ini melanjutkan sebuah daftar.
- source_word: מִשְׁמָע
  choice: Misma
  rationale: Nama diri Ibrani ditransliterasikan dengan ejaan yang alami dalam bahasa Indonesia.
- source_word: חַמּוּאֵל
  choice: Hamuel
  rationale: Nama diri ditransliterasikan sebagai 'Hamuel'; ejaan ini menyampaikan bentuk Ibrani secara jelas tanpa menggandakan konsonan yang tidak lazim dalam ejaan Indonesia.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Bentuk tunggal dengan sufiks orang ketiga maskulin berarti 'anaknya' dan di sini menunjukkan urutan ayah-anak dalam silsilah.
- source_word: זַכּוּר
  choice: Zakur
  rationale: Nama diri ditransliterasikan menurut bunyi teks Masoret dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Nama diri ditransliterasikan sebagai 'Simei', mengikuti pelafalan Ibrani dan kebiasaan ejaan nama Alkitab dalam bahasa Indonesia.
