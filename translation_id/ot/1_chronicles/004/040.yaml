reference: 1 Chronicles 4:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יִּמְצְא֤וּ מִרְעֶה֙ שָׁמֵ֣ן וָ/ט֔וֹב וְ/הָ/אָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם וְ/שֹׁקֶ֖טֶת וּ/שְׁלֵוָ֑ה כִּ֣י מִן חָ֔ם הַ/יֹּשְׁבִ֥ים שָׁ֖ם לְ/פָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/040.yaml
  text: And they found rich and good pasture[a], and the land was broad, quiet, and peaceful, for those from Ham who had lived there formerly were there before.
translation:
  language: id
  text: Mereka menemukan padang rumput yang subur dan baik. Negeri itu luas, tenang, dan tenteram, karena orang-orang yang dahulu tinggal di sana berasal dari Ham.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “karena keturunan Ham dahulu tinggal di sana.”'
    reason: Klausa Ibrani dapat diungkapkan secara lebih idiomatis dengan menyebut orang-orang yang “berasal dari Ham” sebagai “keturunan Ham”; teks Ibrani sendiri tidak memakai kata khusus untuk “keturunan”.
lexical_decisions:
- source_word: מִרְעֶה
  choice: padang rumput
  rationale: Nomina ini menunjuk pada tempat ternak merumput; “padang rumput” merupakan ungkapan Indonesia yang alami dan sesuai dengan konteks.
- source_word: שָׁמֵן
  choice: subur
  rationale: Secara harfiah berarti “gemuk”, tetapi ketika menerangkan padang rumput, kata ini menyatakan kesuburan dan kelimpahan.
- source_word: טוֹב
  choice: baik
  rationale: Mempertahankan nilai positif umum dari kata Ibrani dan berpadu secara alami dengan “subur”.
- source_word: רַחֲבַת יָדַיִם
  choice: luas
  rationale: Ungkapan harfiah “lebar tangan-tangan” berarti lapang atau terbentang luas; “luas” menyampaikan maknanya dengan wajar.
- source_word: שֹׁקֶטֶת
  choice: tenang
  rationale: Menggambarkan negeri yang tidak terganggu atau berada dalam keadaan tenteram.
- source_word: שְׁלֵוָה
  choice: tenteram
  rationale: Dapat menyatakan ketenteraman, keamanan, atau keadaan tanpa gangguan. “Tenteram” mempertahankan nuansa keadaan yang aman tanpa secara khusus menafsirkannya sebagai kemakmuran.
- source_word: כִּי מִן חָם הַיֹּשְׁבִים שָׁם לְפָנִים
  choice: karena orang-orang yang dahulu tinggal di sana berasal dari Ham
  rationale: 'Mengikuti susunan dan hubungan predikatif klausa Ibrani: para penghuni terdahulu di tempat itu berasal dari Ham. Rumusan ini tidak menambahkan kata “sebagian” atau secara mutlak menentukan apakah yang dimaksud adalah keturunan Ham.'
- source_word: חָם
  choice: Ham
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi dua agar mudah dipahami, tanpa mengubah hubungan sebab pada klausa terakhir.
