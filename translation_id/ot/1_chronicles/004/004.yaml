id: 1CH.4.4
reference: 1 Chronicles 4:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/פְנוּאֵל֙ אֲבִ֣י גְדֹ֔ר וְ/עֵ֖זֶר אֲבִ֣י חוּשָׁ֑ה אֵ֤לֶּה בְנֵי חוּר֙ בְּכ֣וֹר אֶפְרָ֔תָה אֲבִ֖י בֵּ֥ית לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/004.yaml
  text: Penuel[a], the father of Gedor, and Ezer, the father of Hushah—these were the sons of Hur, the firstborn of Ephrathah[b], the father of Bethlehem.
translation:
  language: id
  text: Penuel[b], ayah Gedor[a], dan Ezer, ayah Husa—mereka inilah anak-anak Hur, anak sulung Efrata, ayah Betlehem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks silsilah seperti ini, kata Ibrani yang diterjemahkan “ayah” dapat juga berarti “leluhur” atau “pendiri”, khususnya bila berkaitan dengan kota atau kaum.
    reason: lexical_alternative
  - marker: b
    text: Nama “Penuel” ditulis “Peniel” dalam beberapa bagian lain; keduanya merupakan bentuk varian dari nama yang sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנוּאֵל
  choice: Penuel
  rationale: Nama diri ditransliterasikan sesuai bentuk konsonantal pada ayat ini; bentuk Peniel dikenal di bagian lain dan dicatat sebagai varian.
- source_word: אֲבִי
  choice: ayah
  rationale: Mempertahankan ungkapan Ibrani dalam silsilah. Dalam kaitannya dengan kota atau kaum, istilah ini dapat pula berarti leluhur, pendiri, atau tokoh asal.
- source_word: גְדֹר
  choice: Gedor
  rationale: Nama tempat atau kaum ditransliterasikan.
- source_word: עֵזֶר
  choice: Ezer
  rationale: Nama diri ditransliterasikan.
- source_word: חוּשָׁה
  choice: Husa
  rationale: Nama tempat atau kaum ditransliterasikan ke dalam ejaan Indonesia yang mudah dibaca.
- source_word: אֵלֶּה
  choice: mereka inilah
  rationale: Klausa Ibrani tanpa kopula diterjemahkan secara alami sambil mempertahankan penekanan pada kelompok yang baru disebut.
- source_word: בְנֵי
  choice: anak-anak
  rationale: Mempertahankan arti dasar istilah Ibrani; dalam silsilah maknanya dapat mencakup keturunan.
- source_word: חוּר
  choice: Hur
  rationale: Nama diri ditransliterasikan.
- source_word: בְּכֹר
  choice: anak sulung
  rationale: Menyatakan kedudukan Hur terhadap Efrata tanpa menambahkan penafsiran lain.
- source_word: אֶפְרָתָה
  choice: Efrata
  rationale: Menggunakan bentuk nama yang lazim dan alami dalam ejaan Alkitab bahasa Indonesia.
- source_word: בֵּית לָחֶם
  choice: Betlehem
  rationale: Menggunakan bentuk nama tempat yang mapan dalam bahasa Indonesia, bukan menerjemahkan unsur harfiahnya.
theological_decisions:
- issue: Cakupan hubungan yang dinyatakan oleh אֲבִי
  choice: ayah
  alternative: leluhur; pendiri; kepala kaum
  rationale: Terjemahan utama mempertahankan ungkapan sumber, sedangkan catatan kaki menjaga keluasan maknanya dalam konteks kota dan kaum tanpa menetapkan satu hubungan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur silsilah serta pengulangan “ayah” dipertahankan untuk mencerminkan bentuk Ibrani. Tanda pisah membantu pembaca mengenali bahwa bagian akhir merangkum orang-orang yang baru disebut.
