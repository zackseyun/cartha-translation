base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/003.yaml
  text: 'These were the sons of the father of Etam: Jezreel[a], Ishma, and Idbash[b]; and the name of their sister was Hazzelelponi.'
translation:
  language: id
  text: 'Inilah anak-anak[a] dari bapak Etam[b]: Yizreel, Yisma, dan Yidbasy. Nama saudara perempuan mereka ialah Hazelelponi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “anak-anak” tidak tertulis dalam teks Ibrani, tetapi ditambahkan untuk memperjelas daftar nama dan ungkapan “saudara perempuan mereka.”
    reason: textual_clarity
  - marker: b
    text: Secara harfiah, “bapak Etam”; dalam silsilah Tawarikh ungkapan ini dapat juga berarti leluhur atau pendiri Etam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Ungkapan ini memperkenalkan daftar silsilah. “Inilah” alami dalam bahasa Indonesia dan tetap mempertahankan fungsi penyajian teks Ibrani.
- source_word: אֲבִי עֵיטָם
  choice: bapak Etam
  rationale: Secara harfiah berarti “bapak Etam.” Dalam silsilah Tawarikh, אָב dapat menunjuk kepada ayah, leluhur, atau pendiri suatu tempat atau kaum; karena itu terjemahan utama mempertahankan istilah yang umum dan memberi catatan tentang cakupan maknanya.
- source_word: יִזְרְעֶאל
  choice: Yizreel
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan dekat dengan bunyi Ibrani.
- source_word: יִשְׁמָא
  choice: Yisma
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani.
- source_word: יִדְבָּשׁ
  choice: Yidbas
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani dengan ejaan Indonesia.
- source_word: וְשֵׁם אֲחוֹתָם
  choice: Nama saudara perempuan mereka ialah
  rationale: Terjemahan ini menyampaikan konstruksi nominal Ibrani secara jelas dan mempertahankan akhiran jamak “mereka,” yang merujuk kepada ketiga laki-laki yang disebut sebelumnya.
- source_word: הַצְלֶלְפּוֹנִי
  choice: Hazelelponi
  rationale: Nama perempuan ini ditransliterasikan dengan ejaan yang mudah dibaca dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan sintaksis antara bentuk jamak “inilah” dan frasa tunggal אֲבִי עֵיטָם
  choice: Menambahkan “anak-anak” dalam teks dan menandainya dengan catatan kaki
  alternative: Menerjemahkan secara sangat harfiah, “Inilah bapak Etam,” atau mengubahnya menjadi “anak-anak Etam”
  rationale: Teks Masoret secara harfiah tidak memuat kata “anak-anak,” tetapi daftar tiga laki-laki dan penyebutan “saudara perempuan mereka” menuntut acuan jamak. Penambahan yang ditandai menghasilkan bahasa Indonesia yang dapat dipahami tanpa menyembunyikan kesulitan tekstual atau menghapus frasa “bapak Etam.”
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Bentuk “ialah” dipakai secara alami dalam pernyataan nominal, sedangkan nama-nama diri ditulis dengan ejaan Indonesia yang dekat dengan bentuk Ibrani.
