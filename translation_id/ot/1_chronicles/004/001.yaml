source:
  edition: WLC
  text: בְּנֵ֖י יְהוּדָ֑ה פֶּ֧רֶץ חֶצְר֛וֹן וְ/כַרְמִ֖י וְ/ח֥וּר וְ/שׁוֹבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/001.yaml
  text: 'The sons of Judah: Perez[a], Hezron, Carmi, Hur, and Shobal.'
translation:
  language: id
  text: 'Keturunan Yehuda: Peres[a], Hezron, Karmi, Hur, dan Syobal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai ungkapan “anak-anak lelaki Yehuda”; dalam silsilah, ungkapan itu juga dapat berarti keturunannya secara lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Bentuk jamak konstruksi dari בֵּן secara harfiah berarti “anak-anak lelaki dari”, tetapi dalam daftar silsilah dapat mencakup keturunan yang tidak langsung. Karena beberapa nama dalam daftar ini bukan semuanya putra langsung Yehuda, “keturunan” menyampaikan fungsi genealogisnya secara wajar dalam bahasa Indonesia.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama leluhur dan suku; bentuk baku yang lazim dalam Alkitab bahasa Indonesia.
- source_word: פֶּרֶץ
  choice: Peres
  rationale: Transliterasi nama Ibrani yang lazim dalam bahasa Indonesia.
- source_word: חֶצְרוֹן
  choice: Hezron
  rationale: Transliterasi nama Ibrani yang lazim dalam bahasa Indonesia.
- source_word: כַרְמִי
  choice: Karmi
  rationale: Transliterasi langsung nama diri Ibrani dengan ejaan yang alami dalam bahasa Indonesia.
- source_word: חוּר
  choice: Hur
  rationale: Transliterasi nama diri Ibrani yang ringkas dan lazim.
- source_word: שׁוֹבָל
  choice: Syobal
  rationale: Transliterasi yang mencerminkan konsonan awal Ibrani שׁ dan mengikuti pola ejaan nama Ibrani dalam bahasa Indonesia.
- source_word: וְ
  choice: dan
  rationale: Konjungsi Ibrani berulang membentuk daftar. Dalam bahasa Indonesia alami, koma digunakan di antara nama dan “dan” sebelum nama terakhir.
theological_decisions:
- issue: Hubungan genealogis yang dinyatakan oleh בְּנֵי
  choice: keturunan Yehuda
  alternative: anak-anak lelaki Yehuda
  rationale: Daftar tersebut merangkum garis-garis keturunan Yehuda dan tidak harus menyatakan bahwa setiap orang yang disebut adalah putra langsungnya. Pilihan ini menghindari kesan hubungan biologis langsung tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Istilah genealogis dibuat alami bagi pembaca modern, sedangkan catatan kaki mempertahankan bentuk harfiah dan keluasan makna ungkapan Ibrani.
