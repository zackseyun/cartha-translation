  text: וּ/לְ/אַשְׁחוּר֙ אֲבִ֣י תְק֔וֹעַ הָי֖וּ שְׁתֵּ֣י נָשִׁ֑ים חֶלְאָ֖ה וְ/נַעֲרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/005.yaml
  text: 'Ashhur the father of Tekoa had two wives: Helah and Naarah[a].'
translation:
  language: id
  text: 'Asyhur, bapak Tekoa, mempunyai dua istri: Hela dan Naara.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pendiri Tekoa” atau “leluhur Tekoa”. Dalam silsilah, “bapak” dapat menunjuk kepada pendiri suatu kaum atau permukiman, bukan hanya ayah biologis langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַשְׁחוּר
  choice: Asyur
  rationale: Kata sambung dan preposisi yang melekat pada nama ini berfungsi menghubungkan bagian silsilah. Dalam bahasa Indonesia yang wajar, nama tokohnya dapat langsung disebut tanpa menerjemahkan bentuk Ibrani secara kaku sebagai 'dan bagi Asyur'.
- source_word: אֲבִי תְקוֹעַ
  choice: bapak Tekoa
  rationale: Kata אָב dapat berarti ayah biologis, leluhur, atau pendiri/pemimpin suatu kaum atau permukiman. Terjemahan formal 'bapak Tekoa' mempertahankan keluasan makna itu; kemungkinan lain dijelaskan dalam catatan kaki.
- source_word: הָיוּ
  choice: mempunyai
  rationale: Secara harfiah verba ini berarti 'ada/adalah', tetapi dalam konstruksi ini menyatakan kepemilikan. 'Mempunyai dua istri' merupakan ungkapan bahasa Indonesia yang alami dan tepat.
- source_word: שְׁתֵּי נָשִׁים
  choice: dua istri
  rationale: Dalam pemberitahuan silsilah tentang seorang laki-laki, נָשִׁים di sini menunjuk kepada para istrinya, bukan sekadar dua perempuan.
- source_word: חֶלְאָה
  choice: Hela
  rationale: Nama Ibrani חֶלְאָה dialihaksarakan secara sederhana dan wajar dalam ejaan Indonesia sebagai 'Hela'.
- source_word: וְנַעֲרָה
  choice: dan Naara
  rationale: Kata sambung dipertahankan dalam daftar dua nama, sedangkan נַעֲרָה dialihaksarakan sebagai 'Naara' sesuai pola ejaan nama Ibrani dalam bahasa Indonesia.
theological_decisions:
- issue: Makna hubungan Asyur dengan Tekoa
  choice: bapak Tekoa
  alternative: pendiri Tekoa / leluhur Tekoa
  rationale: Teks Ibrani memakai istilah hubungan yang luas dan tidak memastikan apakah Tekoa adalah orang, kaum, atau permukiman. Teks utama mempertahankan ungkapan sumber, sementara catatan kaki menjaga kemungkinan makna genealogis dan sosialnya.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Nama-nama disesuaikan dengan ejaan Indonesia. Ungkapan 'bapak Tekoa' sengaja dipertahankan untuk mencerminkan ambiguitas istilah Ibrani, dengan penjelasan pada catatan kaki.
