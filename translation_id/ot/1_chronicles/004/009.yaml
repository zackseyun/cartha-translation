  text: וַ/יְהִ֣י יַעְבֵּ֔ץ נִכְבָּ֖ד מֵ/אֶחָ֑י/ו וְ/אִמּ֗/וֹ קָרְאָ֨ה שְׁמ֤/וֹ יַעְבֵּץ֙ לֵ/אמֹ֔ר כִּ֥י יָלַ֖דְתִּי בְּ/עֹֽצֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/009.yaml
  text: Jabez was more honored than his brothers[a], and his mother called his name Jabez, saying[b], “Because I bore him in pain.”
translation:
  language: id
  text: Yabes lebih dihormati daripada saudara-saudaranya. Ibunya menamainya Yabes[a], katanya, “Sebab aku melahirkannya dengan kesakitan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Yabes terdengar mirip dengan kata Ibrani yang berarti rasa sakit atau kesedihan dalam penjelasan ibunya.
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan kesedihan.” Kata Ibrani עֹצֶב dapat berarti rasa sakit, kesedihan, atau kesusahan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: (tidak diterjemahkan secara tersendiri)
  rationale: Bentuk naratif ini memperkenalkan pernyataan tentang Yabes. Dalam bahasa Indonesia modern, alur narasinya sudah jelas tanpa ungkapan tambahan seperti “Adapun” atau “Maka tersebutlah”.
- source_word: יַעְבֵּץ
  choice: Yabes
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim, sambil menjelaskan permainan bunyinya dengan עֹצֶב dalam catatan kaki.
- source_word: נִכְבָּד מֵאֶחָיו
  choice: lebih dihormati daripada saudara-saudaranya
  rationale: נִכְבָּד menyatakan keadaan sebagai orang yang dihormati, dan מִן menyampaikan perbandingan. Bentuk ini mempertahankan makna komparatif tanpa menentukan alasan ia dihormati.
- source_word: קָרְאָה שְׁמוֹ
  choice: menamainya
  rationale: Ini adalah padanan Indonesia yang alami untuk ungkapan Ibrani harfiah “memanggil namanya”, dan fungsi formula pemberian nama tetap jelas.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Memperkenalkan ucapan ibu Yabes secara alami dalam bahasa Indonesia modern.
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan yang diberikan sang ibu bagi penamaan itu.
- source_word: יָלַדְתִּי
  choice: aku melahirkannya
  rationale: Kata kerja ini berarti melahirkan; objek “-nya” tersirat dari konteks dan diperlukan agar kalimat Indonesia jelas.
- source_word: בְּעֹצֶב
  choice: dengan kesakitan
  rationale: עֹצֶב dapat menunjuk pada rasa sakit, kesedihan, atau kesusahan. Dalam konteks melahirkan, “kesakitan” merupakan makna konkret yang paling alami, sementara keluasan maknanya dipertahankan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Lebih dihormati” mempertahankan perbandingan dalam teks Ibrani, sedangkan “menamainya” menghindari kekakuan ungkapan harfiah tanpa menghilangkan formula pemberian nama. Penanda catatan permainan kata ditempatkan langsung sesudah nama Yabes agar hubungannya jelas.
