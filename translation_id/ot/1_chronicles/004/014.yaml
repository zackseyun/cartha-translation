  source_fidelity: 'Teks Indonesia dengan tepat mencerminkan struktur silsilah Ibrani: Meonotai dan Seraya sebagai subjek הוֹלִיד, Ofra dan Yoab sebagai objek, serta Yoab sebagai “bapak” Ge-Harasim. “Sebab mereka adalah para pengrajin” secara memadai mempertahankan klausa penjelas כִּי חֲרָשִׁים הָיוּ tanpa memaksakan identitas rujukan “mereka” yang tidak dinyatakan secara eksplisit.'
