id: 1CH.4.14
reference: 1 Chronicles 4:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מְעוֹנֹתַ֖י הוֹלִ֣יד אֶת עָפְרָ֑ה וּ/שְׂרָיָ֗ה הוֹלִ֤יד אֶת יוֹאָב֙ אֲבִי֙ גֵּ֣יא חֲרָשִׁ֔ים כִּ֥י חֲרָשִׁ֖ים הָיֽוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/014.yaml
  text: Meonothai fathered Ophrah[a], and Seraiah fathered Joab, the father of Ge-harashim[b], for they were craftsmen.
translation:
  language: id
  text: Meonotai memperanakkan Ofra, dan Seraya memperanakkan Yoab, bapak Ge-Harasim[a][b], sebab mereka adalah para pengrajin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ge-Harasim kemungkinan berarti “Lembah Para Pengrajin”. Bahasa Ibrani mempertahankannya sebagai nama tempat, lalu klausa berikutnya menjelaskan nama itu.
    reason: lexical_alternative
  - marker: b
    text: Atau “pendiri Ge-Harasim”. Dalam konteks silsilah, ungkapan “bapak” dapat menunjuk kepada seorang pendiri atau kepala leluhur.
    reason: alternative_reading
lexical_decisions:
- source_word: מְעוֹנֹתַי
  choice: Meonotai
  rationale: Nama diri ditransliterasikan dengan ejaan yang alami dalam bahasa Indonesia.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Dalam silsilah, bentuk Hifil dari ילד menyatakan bahwa seseorang menjadi ayah atau menghasilkan keturunan; “memperanakkan” mempertahankan bentuk genealogis secara ringkas.
- source_word: עָפְרָה
  choice: Ofra
  rationale: Nama diri ditransliterasikan menurut kebiasaan ejaan nama Ibrani dalam bahasa Indonesia.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang mudah dibaca.
- source_word: יוֹאָב
  choice: Yoab
  rationale: Mengikuti bentuk nama Ibrani yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֲבִי
  choice: bapak
  rationale: Mempertahankan ungkapan Ibrani yang dapat berarti ayah, leluhur, kepala asal-usul, atau pendiri; kemungkinan makna “pendiri” dijelaskan dalam catatan kaki.
- source_word: גֵּיא חֲרָשִׁים
  choice: Ge-Harasim
  rationale: Konstruksi ini berfungsi sebagai nama tempat. Transliterasi mempertahankan sifatnya sebagai toponim, sedangkan arti unsur-unsurnya dijelaskan dalam catatan kaki.
- source_word: כִּי
  choice: sebab
  rationale: Menandai hubungan penjelasan antara nama tempat dan keterangan tentang para pengrajin.
- source_word: חֲרָשִׁים
  choice: para pengrajin
  rationale: Istilah ini menunjuk secara luas kepada pekerja terampil; “pengrajin” tidak mempersempit artinya hanya kepada pandai besi.
- source_word: הָיוּ
  choice: mereka adalah
  rationale: Mempertahankan konstruksi kopulatif dan rujukan jamak yang tidak disebutkan secara eksplisit dalam teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Bentuk silsilah “memperanakkan” dipakai untuk ketepatan genealogis. Nama tempat ditransliterasikan, sementara permainan makna yang menjelaskan nama tersebut dipertahankan melalui catatan kaki. Rujukan “mereka” dibiarkan sebagaimana ketidakjelasan wajar dalam sumber Ibrani.
