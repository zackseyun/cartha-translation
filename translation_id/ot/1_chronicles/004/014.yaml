  terminology: Transliterasi nama konsisten dan dapat dibaca dalam bahasa Indonesia. “Pengrajin” tepat untuk חֲרָשִׁים yang bersifat luas, tidak dibatasi pada tukang logam. Catatan kaki mempertahankan Ge-Harasim sebagai toponim dan dengan tepat menyatakan kemungkinan makna “pendiri” bagi אֲבִי dalam konteks silsilah.
