base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/039.yaml
  text: They went to the entrance of Gedor[a], as far as the east side of the valley[b], to seek pasture for their flocks.
translation:
  language: id
  text: Mereka pergi ke pintu masuk Gedor[a], sampai ke sisi timur lembah itu[b], untuk mencari padang rumput bagi kawanan domba dan kambing mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke daerah pendekatan Gedor”; kata Ibrani ini dapat berarti pintu masuk, jalan masuk, daerah pendekatan, atau tempat masuk.
    reason: lexical_alternative
  - marker: b
    text: Atau “di sebelah timur lembah itu” atau “ke arah timur lembah itu”; ungkapan Ibraninya merupakan frasa topografis yang ringkas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Mereka pergi
  rationale: Bentuk wayyiqtol dari הלך melanjutkan urutan tindakan dalam narasi; “pergi” merupakan padanan langsung dan alami.
- source_word: לִמְבוֹא
  choice: ke jalan masuk ke
  rationale: מָבוֹא dapat menunjuk pada jalan masuk, tempat masuk, atau daerah pendekatan menuju suatu tempat. “Jalan masuk ke” mempertahankan makna ruang secara alami dalam bahasa Indonesia.
- source_word: גְדֹר
  choice: Gedor
  rationale: Nama tempat ini ditransliterasikan, bukan diterjemahkan.
- source_word: עַד
  choice: sampai ke
  rationale: Kata ini menunjukkan batas atau jangkauan secara geografis, bukan waktu.
- source_word: לְמִזְרַח
  choice: sisi timur
  rationale: מִזְרָח menunjuk pada timur atau arah timur. Dalam frasa topografis ini, “sisi timur” memberi bacaan utama yang alami tanpa meniadakan kemungkinan lain yang dicatat dalam catatan kaki.
- source_word: הַגָּיְא
  choice: lembah itu
  rationale: גַּיְא berarti lembah atau jurang. “Lembah” adalah istilah umum yang paling wajar; artikel Ibrani diterjemahkan dengan “itu” karena tempat tersebut diperlakukan sebagai lokasi tertentu.
- source_word: לְבַקֵּשׁ
  choice: untuk mencari
  rationale: Infinitif dari בקש menyatakan tujuan; “untuk mencari” alami dalam bahasa Indonesia modern.
- source_word: מִרְעֶה
  choice: padang rumput
  rationale: Kata ini menunjuk pada tempat penggembalaan atau lahan tempat ternak merumput.
- source_word: לְצֹאנָם
  choice: bagi kawanan ternak mereka
  rationale: צֹאן dapat mencakup domba dan kambing secara kolektif. “Kawanan ternak” menghindari pembatasan yang tidak terdapat dalam teks sumber.
