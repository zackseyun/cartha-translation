source:
  edition: WLC
  text: וַ/יָּבֹ֡אוּ אֵלֶּה֩ הַ/כְּתוּבִ֨ים בְּ/שֵׁמ֜וֹת בִּ/ימֵ֣י יְחִזְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֗ה וַ/יַּכּ֨וּ אֶת אָהֳלֵי/הֶ֜ם וְ/אֶת ה/מעינים אֲשֶׁ֤ר נִמְצְאוּ שָׁ֨מָּ/ה֙ וַ/יַּחֲרִימֻ/ם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יֵּשְׁב֖וּ תַּחְתֵּי/הֶ֑ם כִּֽי מִרְעֶ֥ה לְ/צֹאנָ֖/ם שָֽׁם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/041.yaml
  text: These[a], who were recorded by name, came in the days of Hezekiah king of Judah, and they struck down their tents and the Meunites who were found there, and devoted them to destruction to this day. Then they settled in their place, because there was pasture there for their flocks.
translation:
  language: id
  text: Orang-orang yang namanya tercatat ini datang pada zaman Hizkia, raja Yehuda. Mereka menyerang orang Meunim[a] yang didapati di sana beserta kemah-kemah mereka, lalu mengkhususkan mereka untuk dimusnahkan sampai hari ini. Kemudian mereka menetap di tempat mereka, karena di sana terdapat padang rumput bagi kawanan ternak mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani הַמְּעִינִים sulit dipastikan. Secara tradisional kata ini dipahami sebagai “orang Meunim,” yaitu suatu kelompok etnis; sebagian memahaminya sebagai “tempat-tempat kediaman” atau “permukiman.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּתוּבִים בְּשֵׁמוֹת
  choice: yang namanya tercatat
  rationale: Frasa ini menunjuk kepada orang-orang yang dimasukkan ke dalam daftar menurut nama. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan nuansa pencatatan resmi atau silsilah.
- source_word: וַיָּבֹאוּ
  choice: datang
  rationale: Kata kerja בוא lazim berarti datang atau tiba; 'datang' sesuai dengan urutan narasi tanpa menambahkan arah yang tidak dinyatakan.
- source_word: וַיַּכּוּ
  choice: menyerang
  rationale: Dalam konteks militer נכה menyatakan serangan keras yang mengakibatkan kekalahan atau kehancuran. Karena objeknya mencakup kemah-kemah dan suatu kelompok manusia, 'menyerang' terdengar alami dan tidak menentukan secara berlebihan tingkat kematian.
- source_word: אָהֳלֵיהֶם
  choice: kemah-kemah orang-orang itu
  rationale: אָהֳלִים adalah kata biasa untuk kemah. Rujukan pronomina diperjelas secara wajar dalam bahasa Indonesia sebagai penduduk yang tempatnya kemudian diduduki oleh kelompok yang disebut pada awal ayat.
- source_word: המעינים
  choice: orang-orang Meunim
  rationale: Bentuk konsonantal yang sulit ini secara tradisional dipahami sebagai nama suatu kelompok etnis. Transliterasi 'Meunim' mempertahankan bentuk nama Ibrani, sedangkan kemungkinan bahwa kata ini menunjuk kepada tempat tinggal dicatat dalam catatan kaki.
- source_word: אֲשֶׁר נִמְצְאוּ שָׁמָּה
  choice: yang didapati di sana
  rationale: Dengan memahami kata sebelumnya sebagai kelompok manusia, klausa relatif ini diterjemahkan secara personal. 'Didapati' mempertahankan bentuk pasif dan tidak menyiratkan bahwa mereka ditemukan secara kebetulan.
- source_word: וַיַּחֲרִימֻם
  choice: mengkhususkan mereka untuk dimusnahkan
  rationale: Bentuk Hifil dari חרם membawa gagasan teknis penyerahan kepada ḥerem, yakni pengkhususan untuk pemusnahan. Terjemahan ini mempertahankan unsur pengkhususan dan unsur penghancuran tanpa meratakannya menjadi sekadar 'membunuh'.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ini adalah padanan Indonesia yang langsung dan idiomatis bagi rumusan waktu Ibrani tersebut.
- source_word: וַיֵּשְׁבוּ תַּחְתֵּיהֶם
  choice: mereka menetap menggantikan orang-orang itu
  rationale: תַּחְתֵּיהֶם dalam konteks ini berarti menempati tempat pihak lain atau menggantikan mereka, bukan secara harfiah tinggal di bawah mereka.
- source_word: מִרְעֶה לְצֹאנָם
  choice: padang rumput bagi kawanan ternak mereka
  rationale: מִרְעֶה berarti tempat merumput atau padang rumput, sedangkan צֹאן dapat mencakup domba dan kambing; 'kawanan ternak' menjaga cakupan itu.
theological_decisions:
- issue: Makna teknis חרם dalam kisah penaklukan
  choice: mengkhususkan mereka untuk dimusnahkan
  alternative: memusnahkan mereka sama sekali
  rationale: Pilihan utama mempertahankan ketegangan antara tindakan pengkhususan dan pemusnahan yang terkandung dalam istilah Ibrani, tanpa menambahkan penjelasan denominatif tentang sifat tindakan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Kalimat dipecah agar hubungan naratif mudah diikuti. Istilah teknis חרם diterjemahkan cukup formal demi menjaga muatan sumber, sementara nama kelompok yang tidak pasti diberi catatan kaki tepat pada istilah terkait.
