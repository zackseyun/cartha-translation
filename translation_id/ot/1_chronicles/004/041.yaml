revisions:
- from: Orang-orang yang namanya tercatat ini datang pada zaman Hizkia, raja Yehuda. Mereka menyerang kemah-kemah orang-orang itu dan orang-orang Meunim[a] yang didapati di sana, lalu mengkhususkan mereka untuk dimusnahkan, sampai hari ini. Kemudian mereka menetap menggantikan orang-orang itu, karena di sana ada padang rumput bagi kawanan ternak mereka.
  to: Orang-orang yang namanya tercatat ini datang pada zaman Hizkia, raja Yehuda. Mereka menyerang orang Meunim[a] yang didapati di sana beserta kemah-kemah mereka, lalu mengkhususkan mereka untuk dimusnahkan sampai hari ini. Kemudian mereka menetap di tempat mereka, karena di sana terdapat padang rumput bagi kawanan ternak mereka.
