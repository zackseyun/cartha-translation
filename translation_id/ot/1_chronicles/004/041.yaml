  - severity: low
    issue: ‘Menetap menggantikan orang-orang itu’ kurang langsung untuk תַּחְתֵּיהֶם.
    rationale: Dalam konteks ini idiom tersebut menunjuk pada pendudukan tempat pihak yang disingkirkan. ‘Menetap di tempat mereka’ menyampaikan aspek lokasi dan penggantian secara lebih tepat.
