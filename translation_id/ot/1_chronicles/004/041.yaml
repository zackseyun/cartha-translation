  source_fidelity: Revisi diperlukan untuk membuat hubungan antara kemah-kemah dan orang Meunim lebih jelas tanpa menambah kelompok lain yang tidak disebutkan dalam teks Ibrani. Ungkapan תַּחְתֵּיהֶם lebih tepat diterjemahkan sebagai menetap di tempat mereka daripada ‘menggantikan orang-orang itu’. Makna teknis חרם tetap dipertahankan dengan ‘mengkhususkan ... untuk dimusnahkan’.
  naturalness: 'Teks revisi memakai susunan yang lebih alami dalam bahasa Indonesia modern: orang Meunim disebut lebih dahulu, kemudian kemah-kemah mereka. ‘Menetap di tempat mereka’ juga lebih langsung dan idiomatis.'
  terminology: ‘Hizkia’ dan ‘orang Meunim’ sesuai dengan penggunaan nama yang lazim dalam bahasa Indonesia. ‘Mengkhususkan mereka untuk dimusnahkan’ secara hati-hati mempertahankan daya teknis חרם tanpa memaksakan penafsiran teologis. Catatan kaki tetap menandai ketidakpastian pada הַמְּעִינִים.
