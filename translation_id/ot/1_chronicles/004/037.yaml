source:
  edition: WLC
  text: וְ/זִיזָ֨א בֶן שִׁפְעִ֧י בֶן אַלּ֛וֹן בֶּן יְדָיָ֥ה בֶן שִׁמְרִ֖י בֶּן שְׁמַֽעְיָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/037.yaml
  text: and Ziza son of Shiphi[a], son of Allon, son of Jedaiah, son of Shimri, son of Shemaiah.
translation:
  language: id
  text: dan Ziza, anak Sifei, anak Alon, anak Yedaya, anak Simri, anak Semaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/זִיזָא
  choice: dan Ziza
  rationale: Kata penghubung וְ diterjemahkan “dan” karena melanjutkan daftar silsilah. Nama זִיזָא dialihaksarakan sebagai “Ziza”; bentuk Ibraninya berakhir dengan alef, sehingga tidak perlu diberi akhiran h.
- source_word: בֶן
  choice: anak
  rationale: Dalam rangkaian silsilah, בֶן berarti “anak.” Pengulangannya dipertahankan agar struktur dan hubungan antargenerasi dalam teks Ibrani tetap jelas.
- source_word: שִׁפְעִי
  choice: Sifei
  rationale: Nama diri dialihaksarakan ke ejaan Indonesia yang mudah dibaca; שׁ menjadi s dan rangkaian vokal akhirnya dicerminkan dengan “ei.”
- source_word: אַלּוֹן
  choice: Alon
  rationale: Dalam konteks ini kata tersebut adalah nama orang, bukan kata benda umum yang berarti sejenis pohon, sehingga dialihaksarakan dan tidak diterjemahkan.
- source_word: יְדָיָה
  choice: Yedaya
  rationale: Alih aksara ini mengikuti kebiasaan ejaan nama Ibrani dalam bahasa Indonesia, dengan y untuk י dan bentuk “-yaya” yang mencerminkan unsur bunyi nama tersebut secara wajar.
- source_word: שִׁמְרִי
  choice: Simri
  rationale: Nama diri dialihaksarakan dalam bentuk yang alami bagi pembaca Indonesia; שׁ direpresentasikan dengan s.
- source_word: שְׁמַעְיָה
  choice: Semaya
  rationale: Nama diri dialihaksarakan dalam bentuk Indonesia yang lancar dan tetap cukup dekat dengan pelafalan Ibraninya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pola “anak ... anak ...” sengaja dipertahankan karena ayat ini merupakan mata rantai silsilah. Tidak digunakan catatan kaki mengenai bentuk Inggris “Zizah” karena perbedaan itu khusus bagi konvensi ejaan bahasa Inggris dan tidak relevan dalam bahasa Indonesia.
