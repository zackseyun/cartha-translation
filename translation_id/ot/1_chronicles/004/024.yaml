id: 1CH.4.24
reference: 1 Chronicles 4:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּנֵ֖י שִׁמְע֑וֹן נְמוּאֵ֣ל וְ/יָמִ֔ין יָרִ֖יב זֶ֥רַח שָׁאֽוּל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/024.yaml
  text: 'The sons of Simeon: Nemuel[a], Jamin, Jarib, Zerah[c][b], and Shaul.'
translation:
  language: id
  text: Anak-anak Simeon ialah Nemuel[a], Yamin, Yarib, Zerah[b], dan Saul.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam silsilah sejajar di Kejadian 46:10, nama ini muncul dalam bentuk Yemuel; teks Ibrani di sini berbunyi Nemuel.
    reason: alternative_reading
  - marker: b
    text: Dalam silsilah sejajar di Kejadian 46:10 dan Keluaran 6:15, nama yang bersesuaian adalah Zohar.
    reason: textual_variant
  - marker: c
    text: Bentuk nama ini dalam bahasa Ibrani adalah Syaul.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari kata 'anak laki-laki' membuka daftar silsilah yang berisi nama-nama anak Simeon; terjemahan langsung ini lebih tepat daripada 'keturunan' dalam konteks ini.
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: Nama diri ini memakai bentuk yang sudah baku dan dikenal dalam bahasa Indonesia.
- source_word: נְמוּאֵל
  choice: Nemuel
  rationale: Bentuk ini mengikuti bunyi teks Ibrani pada ayat ini; bentuk terkait, Yemuel, dicatat dalam catatan kaki karena muncul dalam silsilah sejajar.
- source_word: וְיָמִין
  choice: Yamin
  rationale: Huruf awal nama Ibrani י paling wajar dialihaksarakan sebagai Y dalam bahasa Indonesia. Konjungsi ו tidak perlu diterjemahkan pada posisi ini karena daftar Indonesia secara alami memakai koma dan 'dan' sebelum unsur terakhir.
- source_word: יָרִיב
  choice: Yarib
  rationale: Alih aksara nama diri dari bahasa Ibrani yang disesuaikan dengan ejaan Indonesia; arti leksikal nama tidak diterjemahkan.
- source_word: זֶרַח
  choice: Zerah
  rationale: Mengikuti bentuk Ibrani yang terdapat dalam ayat ini. Bentuk Zohar dalam silsilah sejajar dipertahankan sebagai informasi catatan kaki, bukan dimasukkan ke teks utama.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Saul adalah bentuk nama yang mapan dan mudah dikenali dalam bahasa Indonesia. Bentuk Ibraninya, Syaul, dicatat agar hubungan dengan ejaan sumber tetap jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Partikel 'ialah' memperkenalkan daftar nama secara alami. Nama-nama disesuaikan dengan kaidah bunyi dan ejaan Indonesia, sambil mempertahankan bentuk khusus teks Ibrani dan menjelaskan bentuk sejajar dalam catatan kaki.
