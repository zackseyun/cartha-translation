  yaml_path: translation/ot/1_chronicles/004/038.yaml
  text: These[a], who were mentioned by name, were leaders in their clans[b], and their ancestral houses increased greatly.
translation:
  language: id
  text: Orang-orang ini, yang tercatat menurut nama,[a] adalah para pemimpin di antara kaum mereka, dan keluarga leluhur mereka bertambah banyak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang ini yang datang, disebut menurut nama.” Partisip Ibrani itu secara harfiah berarti “yang datang”; dalam konteks daftar silsilah, ungkapan ini kemungkinan merujuk kepada mereka yang tercatat atau disebut satu per satu menurut nama.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “rumah leluhur mereka menerobos menjadi banyak.” Ungkapan ini menggambarkan keluarga atau garis keturunan leluhur mereka yang bertambah besar dalam jumlah.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Orang-orang ini
  rationale: Kata tunjuk jamak ini merujuk kepada kelompok laki-laki yang disebut dalam daftar sebelumnya. Penambahan “orang-orang” membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: הַבָּאִים בְּשֵׁמוֹת
  choice: yang tercatat menurut nama mereka
  rationale: Secara harfiah הַבָּאִים berarti “yang datang,” tetapi bersama בְּשֵׁמוֹת dalam konteks silsilah ungkapan ini kemungkinan menunjuk kepada orang-orang yang dimasukkan atau disebut satu per satu dalam catatan nama.
- source_word: נְשִׂיאִים
  choice: para pemimpin
  rationale: Istilah ini menunjuk kepada kepala atau tokoh utama kelompok kekerabatan. “Para pemimpin” menyampaikan kedudukan sosial tersebut tanpa memberi kesan gelar kebangsawanan tertentu.
- source_word: בְּמִשְׁפְּחוֹתָם
  choice: dalam kaum-kaum mereka
  rationale: Dalam konteks silsilah, מִשְׁפָּחָה menunjuk kepada kelompok kekerabatan yang lebih luas daripada keluarga inti; “kaum” mempertahankan cakupan itu.
- source_word: וּבֵית אֲבוֹתֵיהֶם
  choice: Kaum-kaum leluhur mereka
  rationale: Ungkapan “rumah ayah-ayah mereka” merupakan sebutan bagi kelompok keluarga atau garis keturunan berdasarkan leluhur. Bentuk ini alami dalam bahasa Indonesia dan tetap menunjukkan hubungan keturunan.
- source_word: פָּרְצוּ לָרֹב
  choice: berkembang menjadi sangat banyak
  rationale: פָּרְצוּ menggambarkan pertumbuhan yang meluas atau melimpah, sedangkan לָרֹב menekankan jumlah yang besar. Terjemahan ini mempertahankan nuansa pertambahan jumlah.
