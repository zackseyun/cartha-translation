revisions:
- from: Orang-orang ini, yang tercatat menurut nama mereka,[a] adalah para pemimpin dalam kaum-kaum mereka. Kaum-kaum leluhur mereka berkembang menjadi sangat banyak.[b]
  to: Orang-orang ini, yang tercatat menurut nama,[a] adalah para pemimpin di antara kaum mereka, dan keluarga leluhur mereka bertambah banyak.[b]
  rationale: Revisi mempertahankan makna daftar nama, kepemimpinan kekerabatan, dan pertumbuhan besar yang dinyatakan teks Ibrani. Subjek kolektif בֵּית אֲבוֹתֵיהֶם dipulihkan sebagai “keluarga leluhur mereka,” sementara catatan kaki diperjelas tanpa menghilangkan ambiguitas leksikal הַבָּאִים.
