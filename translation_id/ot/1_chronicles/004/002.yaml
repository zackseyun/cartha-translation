base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/002.yaml
  text: Reaiah son of Shobal fathered Jahath[a], and Jahath fathered Ahumai and Lahad. These were the clans of the Zorathites.
translation:
  language: id
  text: Reaya, anak Syobal, memperanakkan Yahat, dan Yahat memperanakkan Ahumai dan Lahad. Itulah kaum-kaum orang Zora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keluarga-keluarga orang Zora.” Istilah Ibrani yang dipakai dapat menunjuk kelompok-kelompok kekerabatan luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאָיָה
  choice: Reaya
  rationale: Nama diri ditransliterasikan ke bentuk yang wajar dalam bahasa Indonesia.
- source_word: בֶן
  choice: anak
  rationale: Mempertahankan rumusan silsilah Ibrani; dalam daftar silsilah istilah ini tetap dapat memiliki keluwesan genealogis.
- source_word: הוֹלִיד / הֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah menyatakan bahwa seorang laki-laki menjadi ayah atau menurunkan orang yang disebut; 'memperanakkan' ringkas dan mempertahankan corak genealogis.
- source_word: יַחַת
  choice: Yahat
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia.
- source_word: אֲחוּמַי
  choice: Ahumai
  rationale: Nama diri ditransliterasikan.
- source_word: לָהַד
  choice: Lahad
  rationale: Nama diri ditransliterasikan.
- source_word: אֵלֶּה
  choice: Mereka inilah
  rationale: Mengacu kepada orang-orang yang baru disebut tanpa menambahkan unsur yang tidak tersurat.
- source_word: מִשְׁפְּחֹות
  choice: kaum-kaum
  rationale: Dalam konteks kesukuan dan silsilah, istilah ini menunjuk kelompok-kelompok kekerabatan yang lebih luas daripada keluarga inti.
- source_word: הַצָּרְעָתִי
  choice: orang Zora
  rationale: Bentuk nisbah Ibrani menunjuk kelompok yang terkait dengan tempat atau kaum Zora; ungkapan ini alami dalam bahasa Indonesia.
