id: 1CH.4.19
reference: 1 Chronicles 4:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְנֵי֙ אֵ֣שֶׁת הֽוֹדִיָּ֔ה אֲח֣וֹת נַ֔חַם אֲבִ֥י קְעִילָ֖ה הַ/גַּרְמִ֑י וְ/אֶשְׁתְּמֹ֖עַ הַ/מַּעֲכָתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/019.yaml
  text: And the sons of the wife of Hodiah[a], the sister of Naham[b], were the father of Keilah the Garmite and Eshtemoa the Maacathite.
translation:
  language: id
  text: Putra-putra[a] istri Hodia, saudara perempuan Naham, adalah ayah[b] dari Kehila, orang Garmi, dan Estemoa, orang Maakha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam silsilah, kata Ibrani yang diterjemahkan “putra-putra” juga dapat berarti “keturunan”.
    reason: lexical_alternative
  - marker: b
    text: Dalam silsilah, “ayah” dapat berarti leluhur, pendiri, atau kepala kaum, bukan hanya ayah kandung langsung. Karena teks Ibrani memakai “putra-putra” dalam bentuk jamak tetapi “ayah” dalam bentuk tunggal, kalimat ini mungkin merupakan ringkasan hubungan antarkelompok atau silsilah yang dipadatkan.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak
  rationale: Dalam silsilah, בנים paling langsung berarti anak-anak lelaki, tetapi dapat pula mencakup keturunan. Bentuk jamak dipertahankan karena penting bagi ketegangan tata bahasa dalam ayat ini.
- source_word: אֵשֶׁת הוֹדִיָּה
  choice: istri Hodia
  rationale: Frasa konstruksi ini menyatakan hubungan perkawinan secara langsung dan alami dalam bahasa Indonesia.
- source_word: אֲחוֹת נַחַם
  choice: saudara perempuan Naham
  rationale: Keterangan ini mengidentifikasi istri Hodia dan mempertahankan hubungan kekerabatan yang dinyatakan teks Ibrani.
- source_word: אֲבִי
  choice: ialah ayah dari
  rationale: אבי secara harfiah berarti 'ayah dari', tetapi dalam silsilah dapat menunjuk leluhur, pendiri, atau kepala kelompok. Ungkapan harfiah dipertahankan, sementara cakupan maknanya dijelaskan dalam catatan kaki.
- source_word: קְעִילָה
  choice: Kehila
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dan tidak dipastikan apakah menunjuk individu, kaum, atau tempat.
- source_word: הַגַּרְמִי
  choice: orang Garmi
  rationale: Bentuk nisbah dengan kata sandang menunjukkan identitas kaum atau kelompok; 'orang Garmi' menyampaikannya secara alami tanpa menentukan hubungan biologis tertentu.
- source_word: וְאֶשְׁתְּמֹעַ
  choice: dan Estemoa
  rationale: Nama ini dikoordinasikan dengan Kehila sebagai unsur kedua yang bergantung pada 'ayah dari'.
- source_word: הַמַּעֲכָתִי
  choice: orang Maakha
  rationale: Bentuk nisbah dipertahankan sebagai sebutan asal atau kelompok, tanpa mempersempitnya menjadi keturunan biologis.
theological_decisions:
- issue: Ketidakselarasan antara subjek jamak וּבְנֵי dan predikat tunggal אֲבִי
  choice: Mempertahankan bentuk 'Anak-anak ... ialah ayah' dan menjelaskan pemadatan silsilah dalam catatan kaki.
  alternative: Melancarkan kalimat menjadi 'keturunan ... menjadi leluhur' atau mengubah subjek menjadi tunggal.
  rationale: Teks Ibrani memang memuat ketegangan jumlah ini. Menormalkannya akan menyembunyikan ambiguitas apakah ayat tersebut merangkum hubungan antarklan, leluhur, atau urutan silsilah yang dipadatkan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur jamak-tunggal yang terasa tidak biasa sengaja dipertahankan untuk mencerminkan teks sumber; catatan kaki mencegah pembaca menganggapnya sekadar kesalahan tata bahasa. Nama-nama ditulis Hodia, Naham, Kehila, Garmi, Estemoa, dan Maakha.
