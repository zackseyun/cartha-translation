base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/031.yaml
  text: and in Beth-marcaboth[a], and in Hazar-susim, and in Beth-biri, and in Shaaraim[d][c][b]. These were their cities until David reigned.
translation:
  language: id
  text: juga di Bet-Markabot[a], di Hazar-Susim[b], di Bet-Biri[c], dan di Syaaraim[d]. Itulah kota-kota mereka sampai Daud menjadi raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bet-Markabot secara lebih harfiah dapat diterjemahkan “Rumah Kereta-kereta”, tetapi di sini diperlakukan sebagai nama tempat.
    reason: lexical_alternative
  - marker: b
    text: Hazar-Susim secara lebih harfiah dapat diterjemahkan “Halaman Kuda” atau “Perkampungan Kuda”, tetapi di sini diperlakukan sebagai nama tempat.
    reason: lexical_alternative
  - marker: c
    text: Bet-Biri juga dapat ditransliterasikan “Bet-Birei”.
    reason: alternative_reading
  - marker: d
    text: Syaaraim mungkin memiliki arti etimologis “Dua Gerbang”, tetapi di sini diperlakukan sebagai nama tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/בֵית מַרְכָּבוֹת
  choice: juga di Bet-Markabot
  rationale: Ungkapan ini merupakan nama tempat dalam daftar permukiman, sehingga ditransliterasikan. Unsur-unsurnya secara harfiah dapat berarti “Rumah Kereta,” tetapi menerjemahkannya sebagai frasa biasa dapat mengaburkan fungsinya sebagai toponim.
- source_word: וּ/בַ/חֲצַר סוּסִים
  choice: Hazar-Susim
  rationale: Nama tempat ini ditransliterasikan karena konteksnya adalah daftar kota. Secara etimologis unsur-unsurnya dapat dipahami sebagai “Pekarangan Kuda” atau “Perkampungan Kuda.”
- source_word: וּ/בְ/בֵית בִּרְאִי
  choice: Bet-Biri
  rationale: Bentuk ini diperlakukan sebagai nama tempat, sejajar dengan nama-nama di sekitarnya. Vokalisasi unsur terakhir memungkinkan variasi transliterasi.
- source_word: וּֽ/בְ/שַׁעֲרָיִם
  choice: Saaraim
  rationale: Nama permukiman ini ditransliterasikan. Bentuk Ibraninya mungkin mengandung arti etimologis “Dua Gerbang,” tetapi konteks tidak menuntut penerjemahan arti nama.
- source_word: אֵלֶּה עָרֵי/הֶם
  choice: Itulah kota-kota mereka
  rationale: Kata penunjuk merujuk kembali pada tempat-tempat yang baru disebutkan. “Kota-kota” merupakan padanan langsung dan sesuai dengan corak teritorial kitab Tawarikh.
- source_word: עַד מְלֹךְ דָּוִיד
  choice: sampai Daud menjadi raja
  rationale: Konstruksi dengan עַד menyatakan batas waktu. Dalam bahasa Indonesia, “sampai Daud menjadi raja” menyampaikan awal pemerintahan Daud secara alami tanpa memperluas makna.
