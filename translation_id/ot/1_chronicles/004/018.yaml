  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִשְׁתּ֣/וֹ הַ/יְהֻדִיָּ֗ה יָלְדָ֞ה אֶת יֶ֨רֶד אֲבִ֤י גְדוֹר֙ וְ/אֶת חֶ֨בֶר֙ אֲבִ֣י שׂוֹכ֔וֹ וְ/אֶת יְקֽוּתִיאֵ֖ל אֲבִ֣י זָנ֑וֹחַ וְ/אֵ֗לֶּה בְּנֵי֙ בִּתְיָ֣ה בַת פַּרְעֹ֔ה אֲשֶׁ֥ר לָקַ֖ח מָֽרֶד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/018.yaml
  text: And his wife the Jewess bore Jered the father of Gedor[a], Heber the father of Soco, and Jekuthiel the father of Zanoah. These are the sons of Bithiah daughter of Pharaoh[c][b], whom Mered took as wife.
translation:
  language: id
  text: Istrinya, perempuan Yehuda itu,[a] melahirkan Yered, ayah Gedor,[b] Heber, ayah Sokho, dan Yekutiel, ayah Zanoah. Mereka inilah anak-anak Bitya, putri Firaun,[c] yang diambil Mered sebagai istrinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “perempuan Yahudi itu.”
    reason: lexical_alternative
  - marker: b
    text: Dalam kitab Tawarikh, “ayah” juga dapat berarti pendiri, leluhur, atau kepala kaum yang berkaitan dengan suatu tempat.
    reason: lexical_alternative
  - marker: c
    text: 'Teks Ibrani sulit dipahami. Hubungan antara “istrinya, perempuan Yehuda itu” dan Bitya, putri Firaun, diperdebatkan: sebagian memahami keduanya sebagai perempuan yang sama, sedangkan yang lain memahaminya sebagai dua istri Mered yang berbeda.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַיְהֻדִּיָּה
  choice: perempuan Yehuda
  rationale: Bentuk feminin nisba ini menunjuk pada seorang perempuan Yehuda atau perempuan Yahudi. “Perempuan Yehuda” mempertahankan kaitan etnis-geografisnya tanpa memakai bentuk feminin yang terasa tidak alami dalam bahasa Indonesia.
- source_word: יָלְדָה
  choice: melahirkan
  rationale: Dalam rumusan silsilah, verba ini menyatakan bahwa seorang perempuan melahirkan orang-orang yang disebutkan; “melahirkan” alami dan tepat dalam bahasa Indonesia.
- source_word: אֲבִי
  choice: ayah
  rationale: Terjemahan formal “ayah” mempertahankan ungkapan Ibrani, yang dalam Tawarikh juga dapat menunjuk pada pendiri, leluhur, atau kepala kelompok yang berkaitan dengan suatu tempat.
- source_word: שׂוֹכוֹ
  choice: Sokho
  rationale: Nama tempat ini dialihaksarakan ke dalam bentuk yang mudah dibaca menurut ejaan bahasa Indonesia.
- source_word: יְקוּתִיאֵל
  choice: Yekutiel
  rationale: Nama orang dialihaksarakan dengan bentuk yang sesuai bagi pembaca bahasa Indonesia.
- source_word: זָנוֹחַ
  choice: Zanoah
  rationale: Nama tempat dipertahankan melalui alih aksara yang lazim dan mudah dikenali.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Walaupun bentuk Ibraninya secara harfiah berarti “anak-anak lelaki,” dalam rangkaian silsilah bahasa Indonesia, “anak-anak” secara alami menyatakan keturunan yang sedang disebutkan tanpa mengubah identitas mereka.
- source_word: בִּתְיָה בַת פַּרְעֹה
  choice: Bitya, putri Firaun
  rationale: Konstruksi aposisional Ibrani dipertahankan secara langsung dan alami; “putri” menyatakan hubungan yang sama dengan “anak perempuan.”
- source_word: לָקַח
  choice: diambil ... sebagai istrinya
  rationale: Verba ini secara harfiah berarti “mengambil,” tetapi dalam konteks perkawinan bermakna mengambil seorang perempuan menjadi istri. Rumusan ini mempertahankan citra sumber sekaligus memperjelas maksud perkawinannya.
- source_word: וְאֵלֶּה
  choice: Mereka inilah
  rationale: Ungkapan ini memperkenalkan identifikasi rangkuman. “Mereka inilah” mengacu dengan jelas pada nama-nama sebelumnya dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan antara “istrinya, perempuan Yehuda itu” dan “Bitya, putri Firaun”
  choice: Urutan dan ketegangan sintaksis teks Ibrani dipertahankan tanpa menetapkan apakah kedua sebutan itu menunjuk kepada perempuan yang sama atau kepada dua istri Mered.
  alternative: Mengidentikkan perempuan Yehuda itu dengan Bitya, atau menyusun ulang ayat agar keduanya secara tegas dipahami sebagai dua istri yang berbeda.
  rationale: Teks Ibrani sulit dan memungkinkan lebih dari satu pemahaman. Terjemahan tidak seharusnya menyelesaikan hubungan silsilah yang tidak dijelaskan secara tegas oleh sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya silsilah yang ringkas dan bermartabat. Ejaan “istri” digunakan sesuai bentuk baku. Nama-nama dialihaksarakan agar alami bagi pembaca Indonesia, sementara ketidakjelasan hubungan genealogis dalam teks sumber tetap dipertahankan.
