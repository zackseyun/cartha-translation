  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kata “ibadah” dipakai untuk pelayanan di Bait Allah agar mudah dipahami pembaca umum, sedangkan catatan kaki mempertahankan keluasan istilah Ibraninya.
