  text: Some of them were in charge of the vessels of service[a], for they brought them in by count and took them out by count.
translation:
  language: id
  text: Sebagian dari mereka bertanggung jawab atas perlengkapan ibadah[a], sebab mereka membawanya masuk dengan perhitungan dan membawanya keluar dengan perhitungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “barang-barang untuk ibadah” atau “perkakas yang digunakan dalam ibadah.” Istilah Ibrani ini dapat merujuk secara luas pada wadah, perkakas, atau berbagai jenis perlengkapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם
  choice: Sebagian dari mereka
  rationale: Bentuk מִן dengan sufiks pronominal menyatakan sebagian dari kelompok yang telah disebutkan; ungkapan ini alami dan tepat dalam bahasa Indonesia.
- source_word: עַל
  choice: bertanggung jawab atas
  rationale: Dalam konteks penugasan, עַל menunjukkan tanggung jawab atau pengawasan, bukan sekadar posisi di atas sesuatu.
- source_word: כְּלֵי הָעֲבוֹדָה
  choice: perlengkapan untuk ibadah
  rationale: כְּלִי merupakan istilah luas bagi wadah, perkakas, atau berbagai barang; הָעֲבוֹדָה dalam konteks ini menunjuk pada pelayanan ibadah di Bait Allah. Pilihan ini mempertahankan keluasan makna tanpa menjadikannya terlalu teknis.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan penjelasan mengenai bentuk tanggung jawab mereka.
- source_word: בְמִסְפָּר
  choice: menurut jumlahnya
  rationale: Frasa ini menyatakan penghitungan atau pencatatan jumlah barang secara teliti; pengulangannya dipertahankan untuk menonjolkan pertanggungjawaban inventaris.
- source_word: יְבִיאוּם
  choice: mereka membawanya masuk
  rationale: Bentuk Hifil dari בוא dengan sufiks objek berarti membawa barang-barang itu masuk; bentuk imperfek di sini menggambarkan kebiasaan dalam konteks naratif.
- source_word: יוֹצִיאוּם
  choice: membawanya keluar
  rationale: Bentuk Hifil dari יצא berarti membawa keluar dan dipadankan secara simetris dengan tindakan membawa masuk.
