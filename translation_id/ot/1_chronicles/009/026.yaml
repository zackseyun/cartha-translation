base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/026.yaml
  text: For these four mighty gatekeepers[a], who were Levites[b], were entrusted with the chambers and with the storehouses of the house of God.
translation:
  language: id
  text: Sebab keempat penjaga pintu yang tangguh itu, yaitu orang-orang Lewi, dipercaya[a] untuk mengawasi kamar-kamar dan tempat-tempat penyimpanan[b] di rumah Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan setia” atau “dengan dapat dipercaya”; bahasa Ibrani menekankan kesetiaan atau keterandalan mereka dalam memegang tugas ini.
    reason: lexical_alternative
  - marker: b
    text: Atau “perbendaharaan-perbendaharaan” atau “gudang-gudang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan penjelasan tentang pengaturan tugas pada ayat sebelumnya; “sebab” mempertahankan hubungan wacananya.
- source_word: בֶאֱמוּנָה
  choice: menjalankan tugas dengan setia
  rationale: Nomina אֱמוּנָה menekankan kesetiaan atau keterandalan. Dalam konteks jabatan, ungkapan ini menyampaikan bahwa mereka melaksanakan amanat dengan dapat dipercaya tanpa melebur maknanya ke dalam frasa tanggung jawab berikutnya.
- source_word: אַרְבַּעַת גִּבֹּרֵי הַשֹּׁעֲרִים
  choice: keempat penjaga pintu yang tangguh itu
  rationale: גִּבֹּרֵי secara leksikal menunjuk pada orang-orang yang kuat, perkasa, atau cakap. “Tangguh” terdengar alami dalam bahasa Indonesia dan tidak secara diam-diam mengubahnya menjadi gelar kepemimpinan.
- source_word: הֵם הַלְוִיִּם
  choice: Mereka adalah orang Lewi
  rationale: Mempertahankan penegasan identitas pada klausa Ibrani dengan kalimat Indonesia yang jelas dan alami.
- source_word: וְהָיוּ עַל
  choice: bertanggung jawab atas
  rationale: Konstruksi היה dengan עַל dalam konteks administratif menyatakan pengawasan atau tanggung jawab resmi.
- source_word: הַלְּשָׁכוֹת
  choice: kamar-kamar
  rationale: Istilah ini menunjuk pada kamar atau ruangan yang berkaitan dengan pelayanan rumah Allah; “kamar-kamar” jelas bagi pembaca modern.
- source_word: הָאֹצְרוֹת
  choice: tempat-tempat penyimpanan
  rationale: אֹצָר dapat berarti gudang penyimpanan maupun perbendaharaan. Pilihan umum ini mencakup barang dan benda berharga tanpa membatasi maknanya hanya pada uang.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Terjemahan formal yang mempertahankan metafora sumber dan dalam konteks ini merujuk pada kompleks tempat ibadah.
