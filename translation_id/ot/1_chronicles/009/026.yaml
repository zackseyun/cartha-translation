  naturalness: Bahasanya pada dasarnya baku dan jelas. Kalimat tunggal yang menempatkan 'dipercaya' bersama tugas pengawasan lebih padat dan alami, sekaligus lebih dekat dengan struktur administratif teks sumber.
  terminology: '''Penjaga pintu,'' ''orang-orang Lewi,'' ''kamar-kamar,'' dan ''rumah Allah'' sesuai. ''Tempat-tempat penyimpanan'' merupakan padanan luas yang baik untuk אֹצְרוֹת; alternatif ''perbendaharaan'' layak dipertahankan dalam catatan.'
