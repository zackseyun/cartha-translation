base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/044.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan[b]. These were the sons of Azel.'
translation:
  language: id
  text: 'Azel mempunyai enam putra. Inilah nama mereka: Azrikam, Bokru[a], Ismael, Searia, Obaja, dan Hanan. Itulah putra-putra Azel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani yang divokalkan berbunyi “anak sulungnya,” yang akan menjadikan Azrikam anak sulung Azel dan hanya menyisakan lima nama. Namun, konsonan yang sama dapat dibaca sebagai nama Bokru; pembacaan ini didukung oleh daftar sejajar dalam 1 Tawarikh 8:38, yang menyebut enam putra.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וּלְאָצֵל שִׁשָּׁה בָנִים
  choice: Azel mempunyai enam anak laki-laki
  rationale: Ungkapan silsilah dengan ל menyatakan bahwa Azel mempunyai enam putra. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan jumlah serta jenis kelamin yang dinyatakan teks.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: dan inilah nama mereka
  rationale: Akhiran jamak pada שְׁמוֹתָם merujuk kepada anak-anak laki-laki yang baru disebutkan.
- source_word: עַזְרִיקָם
  choice: Azrikam
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan dekat dengan bunyi Ibrani.
- source_word: בֹּכְרוּ
  choice: Bokru
  rationale: Dalam konteks daftar yang menyatakan enam anak laki-laki, bentuk ini paling wajar dipahami sebagai nama orang keenam; daftar sejajarnya dalam 1 Tawarikh 8:38 juga mendukung pemahaman tersebut. Kemungkinan pembacaan leksikal lain dipertahankan dalam catatan kaki.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Dipakai bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: שְׁעַרְיָה
  choice: Searya
  rationale: Transliterasi Indonesia yang cukup dekat dengan bentuk Ibrani.
- source_word: עֹבַדְיָה
  choice: Obaja
  rationale: Dipakai bentuk nama Alkitab yang lazim dalam bahasa Indonesia.
- source_word: חָנָן
  choice: Hanan
  rationale: Nama diri ditransliterasikan secara langsung.
- source_word: אֵלֶּה בְּנֵי אָצַל
  choice: Mereka inilah anak-anak laki-laki Azel
  rationale: Formula penutup silsilah dipertahankan, termasuk pengulangan nama Azel untuk kejelasan.
