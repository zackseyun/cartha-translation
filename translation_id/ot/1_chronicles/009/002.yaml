  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/יּוֹשְׁבִים֙ הָ/רִ֣אשֹׁנִ֔ים אֲשֶׁ֥ר בַּ/אֲחֻזָּתָ֖/ם בְּ/עָרֵי/הֶ֑ם יִשְׂרָאֵל֙ הַ/כֹּ֣הֲנִ֔ים הַ/לְוִיִּ֖ם וְ/הַ/נְּתִינִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/002.yaml
  text: The first inhabitants who lived in their possessions in their cities were Israel[a], the priests, the Levites, and the temple servants.
translation:
  language: id
  text: Penduduk pertama yang tinggal di tanah milik mereka, di kota-kota mereka, ialah orang Israel, para imam, orang Lewi, dan para pelayan Bait Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Netinim, nama tradisional bagi kelompok yang ditugaskan untuk melayani di Bait Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיּוֹשְׁבִים
  choice: Penduduk
  rationale: Partisipel dari יׁשב menunjuk kepada orang-orang yang menetap atau tinggal; “penduduk” alami dalam konteks daftar pemukiman.
- source_word: הָרִאשֹׁנִים
  choice: pertama
  rationale: Mempertahankan arti dasar “pertama” dan menunjuk kepada kelompok awal yang mendiami kembali tempat-tempat tersebut.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif yang memperkenalkan keterangan mengenai para penduduk.
- source_word: בַּאֲחֻזָּתָם
  choice: di tanah milik mereka
  rationale: אֲחֻזָּה berarti milik atau tanah pegangan; pilihan ini menyampaikan unsur kepemilikan tanah secara wajar tanpa mempersempitnya menjadi istilah hukum tertentu.
- source_word: בְּעָרֵיהֶם
  choice: di kota-kota mereka
  rationale: Terjemahan langsung dan lazim bagi bentuk jamak עִיר dengan sufiks kepunyaan.
- source_word: יִשְׂרָאֵל
  choice: orang Israel
  rationale: Dalam daftar kelompok manusia, “orang Israel” lebih alami dalam bahasa Indonesia daripada nama kolektif “Israel”, sambil mempertahankan cakupan kolektif teks Ibrani.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku untuk kelompok imam dalam konteks ibadah Israel.
- source_word: הַלְוִיִּם
  choice: orang Lewi
  rationale: Padanan Indonesia yang lazim untuk kelompok keturunan Lewi, dibedakan dari para imam.
- source_word: וְהַנְּתִינִים
  choice: dan para pelayan Bait Allah
  rationale: נְתִינִים adalah nama bagi kelompok yang ditugaskan untuk pelayanan tempat ibadah. Terjemahan fungsional ini mudah dipahami pembaca modern; bentuk “Netinim” dicatat dalam catatan kaki.
theological_decisions:
- issue: Hubungan “orang Israel” dengan para imam, orang Lewi, dan para pelayan Bait Allah
  choice: Mempertahankan semuanya sebagai unsur dalam daftar tanpa menjelaskan secara tambahan apakah tiga kelompok terakhir merupakan subkelompok orang Israel atau kategori sejajar.
  alternative: Menambahkan kata-kata yang secara eksplisit menjadikan para imam dan orang Lewi subkelompok orang Israel.
  rationale: Susunan aposisional teks Ibrani ringkas dan dapat dipahami lebih dari satu cara; terjemahan tidak boleh menyelesaikan hubungan klasifikasinya secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Frasa “tanah milik mereka” menghindari ungkapan kaku “dalam milik pusaka mereka”. Penanda catatan kaki ditempatkan sesudah “pelayan Bait Allah”, karena catatan menerangkan נְתִינִים, bukan “orang Israel”.
