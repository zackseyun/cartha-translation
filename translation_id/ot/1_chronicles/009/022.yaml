  text: כֻּלָּ֤/ם הַ/בְּרוּרִים֙ לְ/שֹׁעֲרִ֣ים בַּ/סִּפִּ֔ים מָאתַ֖יִם וּ/שְׁנֵ֣ים עָשָׂ֑ר הֵ֤מָּה בְ/חַצְרֵי/הֶם֙ הִתְיַחְשָׂ֔/ם הֵ֣מָּה יִסַּ֥ד דָּוִ֛יד וּ/שְׁמוּאֵ֥ל הָ/רֹאֶ֖ה בֶּ/אֱמוּנָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/022.yaml
  text: All these who were chosen as gatekeepers at the thresholds were two hundred and twelve[a]. They were enrolled by genealogy in their villages. David and Samuel the seer established them in their office of trust.
translation:
  language: id
  text: Semua orang yang dipilih menjadi penjaga pintu pada ambang-ambang pintu masuk itu berjumlah dua ratus dua belas orang. Mereka terdaftar menurut silsilah di desa-desa mereka. Daud dan Samuel, sang pelihat, menetapkan mereka dalam tugas yang dipercayakan kepada mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menetapkan mereka karena kesetiaan mereka,” atau “menetapkan mereka dalam kesetiaan mereka.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַבְּרוּרִים
  choice: yang dipilih
  rationale: Partisip pasif ini menunjukkan orang-orang yang diseleksi untuk suatu peran; “dipilih” alami dan tidak menentukan lebih jauh mekanisme pemilihannya.
- source_word: לְשֹׁעֲרִים
  choice: menjadi penjaga pintu
  rationale: שֹׁעֵר adalah orang yang menjaga gerbang atau jalan masuk; “penjaga pintu” jelas dalam konteks pelayanan rumah Allah.
- source_word: בַּסִּפִּים
  choice: di ambang-ambang pintu
  rationale: סַף terutama berarti ambang; tambahan “pintu” membuat gambaran tempat penjagaan jelas dalam bahasa Indonesia tanpa menggantinya dengan istilah yang lebih luas, “gerbang”.
- source_word: מָאתַיִם וּשְׁנֵים עָשָׂר
  choice: dua ratus dua belas orang
  rationale: Terjemahan langsung angka kardinal, dengan “orang” untuk kelancaran bahasa Indonesia.
- source_word: בְחַצְרֵיהֶם
  choice: di desa-desa mereka
  rationale: Dalam konteks permukiman dan pencatatan silsilah, חָצֵר menunjuk pada desa atau permukiman, bukan pelataran Bait Allah.
- source_word: הִתְיַחְשָׂם
  choice: mereka terdaftar menurut silsilah
  rationale: Bentuk hitpael dari יחס mengacu pada pencatatan resmi berdasarkan garis keturunan.
- source_word: יִסַּד
  choice: menetapkan
  rationale: Dalam konteks pengaturan administratif, kata ini menyatakan bahwa Daud dan Samuel membentuk atau mengukuhkan penugasan tersebut; “menetapkan” terdengar alami tanpa memasukkan terminologi gerejawi kemudian.
- source_word: הָרֹאֶה
  choice: sang pelihat
  rationale: Mempertahankan gelar khusus רֹאֶה bagi Samuel dan tidak meratakannya menjadi “nabi”.
- source_word: בֶּאֱמוּנָתָם
  choice: dalam tugas kepercayaan mereka
  rationale: Frasa tersebut dapat menunjuk pada tanggung jawab yang dipercayakan dan dijalankan dengan setia. Pilihan ini mempertahankan nuansa jabatan sekaligus keandalan, sementara alternatifnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna בֶּאֱמוּנָתָם pada akhir ayat
  choice: Daud dan Samuel menetapkan mereka dalam tugas kepercayaan mereka
  alternative: Daud dan Samuel menetapkan mereka karena kesetiaan mereka; atau menetapkan mereka dalam kesetiaan mereka
  rationale: Ungkapan Ibrani ini padat dan dapat menyatakan tugas yang dipercayakan ataupun kesetiaan para penjaga. Konteks pencatatan dan pengaturan pelayanan mendukung makna administratif, tetapi ambiguitas asli dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat mudah dipahami, gelar teknis “pelihat” dipertahankan, dan ambiguitas frasa penutup tidak dihapus.
