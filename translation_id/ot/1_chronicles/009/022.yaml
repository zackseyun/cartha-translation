  source_fidelity: 'Terjemahan menangkap seluruh unsur utama teks Ibrani: orang-orang yang dipilih, tugas penjagaan pada ambang, jumlah 212, pendaftaran silsilah di desa-desa mereka, serta peran Daud dan Samuel sang pelihat. Frasa penutup memang ambigu; terjemahan utama yang bernuansa penugasan administratif dan catatan kaki yang memuat alternatif kesetiaan mempertahankan ambiguitas tersebut dengan baik.'
  naturalness: Dua ungkapan perlu diperhalus. “di ambang-ambang pintu itu” terasa berulang dan kurang idiomatis sesudah “penjaga pintu”; “pada ambang-ambang pintu masuk” lebih jelas. “tugas kepercayaan mereka” juga merupakan kolokasi yang kurang lazim dalam bahasa Indonesia modern; “tugas yang dipercayakan kepada mereka” lebih alami sambil mempertahankan nuansa amanat/jabatan.
  terminology: “Penjaga pintu,” “silsilah,” dan “sang pelihat” sesuai dengan konteks dan register. Gelar “pelihat” tepat mempertahankan רֹאֶה, tanpa meratakannya menjadi “nabi”.
