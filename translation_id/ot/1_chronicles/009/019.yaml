reference: 1 Chronicles 9:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שַׁלּ֣וּם בֶּן ק֠וֹרֵא בֶּן אֶבְיָסָ֨ף בֶּן קֹ֜רַח וְֽ/אֶחָ֧י/ו לְ/בֵית אָבִ֣י/ו הַ/קָּרְחִ֗ים עַ֚ל מְלֶ֣אכֶת הָ/עֲבוֹדָ֔ה שֹׁמְרֵ֥י הַ/סִּפִּ֖ים לָ/אֹ֑הֶל וַ/אֲבֹֽתֵי/הֶם֙ עַל מַחֲנֵ֣ה יְהוָ֔ה שֹׁמְרֵ֖י הַ/מָּבֽוֹא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/019.yaml
  text: And Shallum son of Kore[a], son of Ebiasaph, son of Korah, and his brothers from his father’s house, the Korahites, were over the work of the service, keepers of the thresholds of the tent; and their fathers had been over the camp of Yahweh[b], keepers of the entrance.
translation:
  language: id
  text: Dan Salum bin Kore, bin Ebyasaf, bin Korah, serta saudara-saudaranya dari keluarga ayahnya, yaitu orang-orang Korah, bertanggung jawab atas pekerjaan pelayanan sebagai penjaga ambang-ambang Kemah[a]. Leluhur mereka dahulu bertanggung jawab atas perkemahan Yahweh[b] sebagai penjaga pintu masuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penjaga gerbang-gerbang Kemah”. Secara harfiah, teks Ibrani berbunyi “penjaga ambang-ambang Kemah”.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: YHWH, nama ilahi yang di sini ditulis “Yahweh”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁלּוּם
  choice: Dan Salum
  rationale: Kata penghubung וְ mempertahankan kesinambungan dengan daftar sebelumnya; “Dan” tidak menambahkan nuansa penafsiran.
- source_word: בֶּן קוֹרֵא בֶּן אֶבְיָסָף בֶּן קֹרַח
  choice: bin Kore, bin Ebyasaf, bin Korah
  rationale: Rumus silsilah berulang dipertahankan. “Bin” merupakan bentuk Indonesia yang ringkas dan lazim untuk menyatakan ‘anak laki-laki dari’ dalam silsilah.
- source_word: וְאֶחָיו לְבֵית אָבִיו
  choice: bersama saudara-saudaranya dari kaum keluarga ayahnya
  rationale: “Saudara-saudaranya” mempertahankan bentuk maskulin jamak, sedangkan “kaum keluarga ayahnya” menyampaikan afiliasi keluarga atau marga dari ungkapan בית אב.
- source_word: הַקָּרְחִים
  choice: orang-orang Korah
  rationale: Bentuk gentilik jamak menunjuk kepada para anggota garis keturunan atau kaum Korah.
- source_word: עַל מְלֶאכֶת הָעֲבוֹדָה
  choice: bertanggung jawab atas pekerjaan pelayanan
  rationale: עַל menyatakan tanggung jawab atau pengawasan. “Pelayanan” cocok untuk tugas resmi di tempat kudus tanpa menjadikannya istilah gerejawi yang lebih kemudian.
- source_word: שֹׁמְרֵי הַסִּפִּים לָאֹהֶל
  choice: sebagai penjaga ambang-ambang Kemah
  rationale: Partisipel שֹׁמְרֵי menyatakan tugas yang terus dijalankan, dan הַסִּפִּים secara konkret berarti ambang-ambang. “Kemah” mengikuti kata אֹהֶל tanpa menggantinya dengan istilah yang lebih teknis.
- source_word: וַאֲבֹתֵיהֶם
  choice: Leluhur mereka dahulu
  rationale: Dalam konteks perbandingan dengan tugas generasi lampau, “leluhur” menyampaikan cakupan historis אָבוֹת dengan wajar; “dahulu” memperjelas acuan retrospektif.
- source_word: עַל מַחֲנֵה יְהוָה
  choice: bertanggung jawab atas perkemahan Yahweh
  rationale: Ungkapan ini menggambarkan tugas pengawasan terhadap perkemahan yang berkaitan dengan hadirat dan tempat kudus Yahweh.
- source_word: שֹׁמְרֵי הַמָּבוֹא
  choice: sebagai penjaga pintu masuk
  rationale: מָבוֹא menunjuk pada jalan atau tempat masuk; “pintu masuk” merupakan padanan Indonesia yang alami dan tetap konkret.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga bentuk nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi, sedangkan “TUHAN” merupakan penggantian dengan gelar dan “Yehuwa” mencerminkan pelafalan tradisional yang berbeda.
- issue: Seberapa teknis istilah tempat kudus diterjemahkan
  choice: Kemah
  alternative: Kemah Suci atau tabernakel
  rationale: Teks hanya memakai אֹהֶל, ‘kemah’. Terjemahan tidak mempersempitnya menjadi istilah teknis yang tidak dinyatakan secara eksplisit, meskipun konteksnya jelas berkaitan dengan tempat kudus.
- issue: Hubungan tugas generasi Salum dengan tugas para leluhur
  choice: Keduanya dinyatakan sebagai tanggung jawab penjagaan tanpa menyamakan persis objeknya
  alternative: Menafsirkan kedua tugas sebagai jabatan penjaga gerbang yang identik
  rationale: Ayat ini menghubungkan kedua generasi secara tipologis dan fungsional, tetapi memakai “ambang-ambang Kemah” untuk generasi kini dan “pintu masuk” perkemahan untuk para leluhur. Perbedaan ungkapan itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur silsilah dibuat ringkas dengan “bin”, sedangkan ungkapan tugas dibuat alami melalui “bertanggung jawab atas”. Huruf kapital pada “Kemah” membantu menandai rujukan khusus kepada kemah tempat kudus tanpa mengganti kata sumber dengan istilah teknis.
