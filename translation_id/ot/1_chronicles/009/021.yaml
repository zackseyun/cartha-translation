  text: Zechariah son of Meshelemiah was gatekeeper at the entrance to the tent of meeting[a].
translation:
  language: id
  text: Zakharia anak Meselemya adalah penjaga pintu pada pintu masuk ke Kemah Pertemuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “penjaga pintu di ambang Kemah Pertemuan.”
    reason: Alternatif ini mencerminkan kemungkinan memahami פֶּתַח secara lebih fisik sebagai ambang atau bukaan pintu.
lexical_decisions:
- source_word: זְכַרְיָה
  choice: Zakharia
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Konteks silsilah mendukung arti hubungan langsung, yaitu 'anak', bukan arti lebih luas 'keturunan'.
- source_word: מְשֶׁלֶמְיָה
  choice: Meselemya
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia dengan mempertahankan bentuk Ibrani sedekat mungkin.
- source_word: שֹׁעֵר
  choice: penjaga pintu
  rationale: Kata ini menunjuk kepada orang yang menjaga suatu pintu atau jalan masuk; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: פֶּתַח
  choice: jalan masuk
  rationale: Kata ini berarti bukaan, pintu masuk, atau jalan masuk; 'jalan masuk' sesuai dengan fungsi penjaga dalam konteks ini.
- source_word: לְאֹהֶל
  choice: menuju Kemah
  rationale: Preposisi ל dipahami secara arah-relasional bersama פֶּתַח, yakni jalan masuk yang menuju kemah.
- source_word: מוֹעֵד
  choice: Pertemuan
  rationale: Dalam ungkapan tetap אֹהֶל מוֹעֵד, kata ini menunjuk pada pertemuan yang ditetapkan antara Allah dan umat-Nya.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Sebutan baku tempat kudus ini menerjemahkan unsur-unsur Ibraninya secara langsung dan sudah dikenal oleh pembaca Alkitab Indonesia.
