  register: Bahasa Indonesia baku, modern, dan lugas. Nama serta istilah tempat kudus memakai bentuk yang dikenal luas, sedangkan susunan kalimat dibuat alami tanpa menghilangkan hubungan antarkata dalam teks Ibrani.
