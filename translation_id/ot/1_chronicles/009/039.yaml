reference: 1 Chronicles 9:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/039.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: id
  text: Ner memperanakkan Kish, Kish memperanakkan Saul, dan Saul memperanakkan Yonatan, Malkisua, Abinadab, serta Esybaal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esybaal disebut Isyboset dalam 2 Samuel 2:8 dan bagian-bagian terkait.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Dalam silsilah, bentuk Hifil dari ילד menyatakan bahwa seorang laki-laki menjadi ayah atau memperanakkan seseorang. “Memperanakkan” ringkas, lazim dalam gaya silsilah Alkitab bahasa Indonesia, dan mempertahankan hubungan genealogis tanpa menambahkan penafsiran.
- source_word: נֵר
  choice: Ner
  rationale: Nama diri; bentuk Ner sudah alami dan dikenal dalam bahasa Indonesia.
- source_word: קִישׁ
  choice: Kish
  rationale: Nama diri; ditransliterasikan secara langsung dan sesuai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Nama diri; bentuk konvensional dan mudah dikenali dalam bahasa Indonesia.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Nama diri; bentuk konvensional bahasa Indonesia yang mencerminkan pelafalan Ibrani dengan wajar.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malkisua
  rationale: Nama majemuk yang berfungsi sebagai satu nama diri; ditulis serangkai menurut kebiasaan ejaan nama Alkitab dalam bahasa Indonesia.
- source_word: אֲבִינָדָב
  choice: Abinadab
  rationale: Nama diri; bentuk konvensional bahasa Indonesia.
- source_word: אֶשְׁבָּעַל
  choice: Esybaal
  rationale: Teks Tawarikh secara langsung memakai nama אֶשְׁבָּעַל, sehingga nama ini dipertahankan dan tidak diselaraskan dengan bentuk Isyboset dalam kitab Samuel.
- source_word: וְ
  choice: dan; serta
  rationale: Konjungsi waw menyusun urutan silsilah dan daftar anak. “Dan” mempertahankan rantai silsilah, sedangkan “serta” pada unsur terakhir menghasilkan daftar yang alami dalam bahasa Indonesia tanpa mengubah hubungan sintaksis.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Penanda objek langsung Ibrani tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya tercermin dalam susunan kalimat.
theological_decisions:
- issue: Perbedaan nama Esybaal dan Isyboset
  choice: Memakai “Esybaal” dalam teks utama
  alternative: Isyboset
  rationale: Sumber Ibrani ayat ini membaca אֶשְׁבָּעַל. Bentuk berbeda dalam 2 Samuel tidak boleh menggantikan bacaan Tawarikh, tetapi hubungan kedua nama itu dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Pengulangan “memperanakkan” dipertahankan untuk menampilkan struktur silsilah Ibrani dengan jelas; daftar terakhir dibuat alami dengan “serta”.
