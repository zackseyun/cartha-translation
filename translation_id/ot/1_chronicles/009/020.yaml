  text: וּ/פִֽינְחָ֣ס בֶּן אֶלְעָזָ֗ר נָגִ֨יד הָיָ֧ה עֲלֵי/הֶ֛ם לְ/פָנִ֖ים יְהוָ֥ה עִמּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/020.yaml
  text: And Phinehas son of Eleazar had formerly been chief over them[a]; Yahweh was with him.
translation:
  language: id
  text: Pinehas anak Eleazar dahulu adalah pemimpin mereka[a]; Yahweh menyertainya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Pinehas anak Eleazar adalah pemimpin mereka dahulu.” Susunan kata Ibrani memungkinkan keterangan waktu “dahulu” dihubungkan erat dengan “adalah pemimpin” atau dengan seluruh pernyataan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס
  choice: Pinehas
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia. Konjungsi וּ tidak diterjemahkan secara tersendiri karena hubungan dengan konteks tetap jelas dan pembukaan dengan “Dan” kurang alami dalam bahasa Indonesia modern.
- source_word: בֶּן אֶלְעָזָר
  choice: anak Eleazar
  rationale: Konstruksi silsilah Ibrani diterjemahkan secara ringkas dan alami sebagai “anak Eleazar”.
- source_word: נָגִיד
  choice: pemimpin
  rationale: Kata ini menunjuk kepada orang yang memegang kedudukan kepemimpinan atau kewenangan. “Pemimpin” sesuai dengan konteks administratif-keagamaan tanpa menyiratkan kedudukan raja.
- source_word: הָיָה עֲלֵיהֶם
  choice: menjadi pemimpin mereka
  rationale: Secara idiomatis mengungkapkan bahwa Pinehas berkedudukan di atas atau berwenang atas kelompok yang telah disebutkan.
- source_word: לְפָנִים
  choice: dahulu
  rationale: Kata keterangan ini menunjuk kepada masa sebelumnya. “Dahulu” alami, ringkas, dan mempertahankan rujukan waktunya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan suatu gelar.
- source_word: עִמּוֹ
  choice: menyertai dia
  rationale: Ungkapan ini menyatakan kehadiran dan dukungan ilahi. “Menyertai dia” merupakan ungkapan Indonesia yang alami tanpa memperluas maknanya secara berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama pribadi dan mengikuti transliterasi ilmiah yang umum.
- issue: Makna kehadiran ilahi dalam עִמּוֹ
  choice: menyertai dia
  alternative: bersama dia
  rationale: “Menyertai dia” secara alami menyampaikan kehadiran dan dukungan Yahweh, tetapi tidak menjelaskan lebih jauh bentuk dukungan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara catatan kaki mempertahankan keluwesan hubungan keterangan waktu dalam bahasa Ibrani.
