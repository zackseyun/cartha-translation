  text: וְ/עֹבַדְיָה֙ בֶּֽן שְׁמַֽעְיָ֔ה בֶּן גָּלָ֖ל בֶּן יְדוּת֑וּן וּ/בֶרֶכְיָ֤ה בֶן אָסָא֙ בֶּן אֶלְקָנָ֔ה הַ/יּוֹשֵׁ֖ב בְּ/חַצְרֵ֥י נְטוֹפָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/016.yaml
  text: and Obadiah son of Shemaiah[a], son of Galal, son of Jeduthun, and Berechiah son of Asa, son of Elkanah, who lived in the villages of the Netophathites.
translation:
  language: id
  text: dan Obaja anak Semaya, anak Galal, anak Yedutun, serta Berekhya—anak Asa, anak Elkana—yang tinggal di desa-desa orang Netofa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di permukiman-permukiman Netofa.” Bentuk gentilisia Ibrani dapat dinyatakan sebagai kelompok penduduk (“orang Netofa”) atau dengan nama tempatnya (“Netofa”).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עֹבַדְיָה
  choice: dan Obaja
  rationale: Prefiks penghubung dipertahankan karena nama ini melanjutkan daftar sebelumnya; bentuk nama mengikuti ejaan Alkitab Indonesia yang lazim.
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar silsilah, בֶּן secara langsung berarti 'anak'; pilihan ini mempertahankan bentuk genealogis teks tanpa menutup kemungkinan bahwa silsilah kuno kadang meringkas generasi.
- source_word: שְׁמַעְיָה
  choice: Semaya
  rationale: Nama diri dialihaksarakan dalam bentuk yang alami dan lazim bagi pembaca Indonesia.
- source_word: גָּלָל
  choice: Galal
  rationale: Nama diri dialihaksarakan secara langsung.
- source_word: יְדוּתוּן
  choice: Yedutun
  rationale: Nama diri memakai bentuk Indonesia yang lazim.
- source_word: וּ/בֶרֶכְיָה
  choice: serta Berekhya
  rationale: Konjungsi melanjutkan daftar dengan orang Lewi berikutnya; 'serta' menghindari rangkaian 'dan' yang kaku, sedangkan nama dialihaksarakan secara transparan.
- source_word: אָסָא
  choice: Asa
  rationale: Nama diri dialihaksarakan secara langsung; teks hanya menyebutnya sebagai leluhur Berekhya.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Nama diri memakai bentuk Indonesia yang lazim.
- source_word: הַ/יּוֹשֵׁב
  choice: yang tinggal
  rationale: Partisip berartikel ini berfungsi sebagai keterangan relatif bagi Berekhya dan menyatakan tempat kediamannya; 'yang tinggal' alami dalam bahasa Indonesia.
- source_word: בְּ/חַצְרֵי
  choice: di desa-desa
  rationale: Dalam konteks geografis, חָצֵר menunjuk permukiman atau desa, bukan halaman rumah; bentuk jamak konstruk dipertahankan.
- source_word: נְטוֹפָתִי
  choice: orang Netofa
  rationale: Kata ini adalah bentuk gentilisia yang menunjuk orang-orang yang terkait dengan Netofa; 'orang Netofa' lebih mudah dipahami daripada membentuk istilah etnis baru dalam bahasa Indonesia.
