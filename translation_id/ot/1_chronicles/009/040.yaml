  yaml_path: translation/ot/1_chronicles/009/040.yaml
  text: And the son of Jehonathan was Merib-baal[b][a], and Merib-baal fathered Micah.
translation:
  language: id
  text: Dan putra Yehonatan ialah Merib-Baal[b][a], dan Merib-Baal memperanakkan Mikha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Ibrani, nama Merib-Baal dieja dengan dua bentuk yang sedikit berbeda dalam ayat ini: “Merib-Baal” dan bentuk yang lebih pendek, “Meri-Baal”. Terjemahan ini menyeragamkannya menjadi “Merib-Baal” demi kejelasan.'
    reason: textual_variant
  - marker: b
    text: Dalam silsilah sejajar di 1 Samuel 14:49, anak Saul ini disebut “Yonatan”, bukan “Yehonatan”. Di sini teks Ibrani kitab Tawarikh memakai bentuk “Yehonatan”.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: Anak ... ialah
  rationale: בֶן berarti “anak laki-laki/anak”; dalam konteks silsilah, “anak” sudah jelas dan alami. Waw penghubung tidak perlu diterjemahkan secara mekanis pada awal ayat karena hubungan dengan silsilah sebelumnya tetap nyata.
- source_word: יְהוֹנָתָן
  choice: Yehonatan
  rationale: Nama ini ditransliterasikan menurut bentuk Ibrani yang dipakai oleh penulis Tawarikh, tanpa dinormalkan menjadi Yonatan.
- source_word: מְרִיב בָּעַל
  choice: Merib-Baal
  rationale: Nama diri majemuk ini ditransliterasikan dan diberi tanda hubung agar kedua unsurnya mudah dikenali.
- source_word: וּ/מְרִי בַעַל
  choice: dan Merib-Baal
  rationale: Bentuk kedua dalam bahasa Ibrani sedikit lebih pendek, tetapi menunjuk kepada orang yang sama; nama diseragamkan dalam teks utama demi kejelasan, sementara perbedaannya dicatat dalam catatan kaki.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Dalam konteks silsilah, bentuk Hifil dari ילד menyatakan bahwa seorang laki-laki menjadi ayah dari keturunannya. “Memperanakkan” ringkas, bermartabat, dan lazim dalam silsilah Alkitab.
- source_word: אֶת מִיכָה
  choice: Mikha
  rationale: אֶת adalah penanda objek langsung dan tidak diterjemahkan; מִיכָה ditransliterasikan dalam bentuk Indonesia yang lazim, “Mikha”.
