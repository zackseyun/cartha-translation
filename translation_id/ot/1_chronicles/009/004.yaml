  text: עוּתַ֨י בֶּן עַמִּיה֤וּד בֶּן עָמְרִי֙ בֶּן אִמְרִ֣י בֶן בני/מן בְּנֵי פֶ֖רֶץ בֶּן יְהוּדָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/004.yaml
  text: Uthai son of Ammihud[a], son of Omri, son of Imri, son of Bani, from the sons of Perez son of Judah.
translation:
  language: id
  text: Utai anak Amihud, anak Omri, anak Imri, anak Bani[a], dari keturunan Peres, anak Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradisi teks Ibrani di bagian ini sulit dipastikan. Kata yang diterjemahkan “Bani” dapat juga dibaca “dari”, sehingga kalimatnya menjadi: “anak Imri, dari keturunan Peres, anak Yehuda.” Teks utama mengikuti bacaan sebagai nama dalam silsilah karena paling sesuai dengan rangkaian nama.'
    reason: textual_variant
lexical_decisions:
- source_word: עוּתַי
  choice: Utai
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang wajar dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam silsilah, kata ini secara langsung berarti “anak”, meskipun silsilah Ibrani dapat melewati beberapa generasi.
- source_word: עַמִּיהוּד
  choice: Amihud
  rationale: Nama pribadi ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: עָמְרִי
  choice: Omri
  rationale: Nama pribadi ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: אִמְרִי
  choice: Imri
  rationale: Nama pribadi ditransliterasikan secara langsung.
- source_word: בני/מן
  choice: Bani
  rationale: Bacaan sebagai nama pribadi paling sesuai dengan rangkaian nama dalam silsilah; kemungkinan bacaan “dari” dipertahankan dalam catatan kaki.
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam ungkapan kelompok silsilah, bentuk jamak ini menunjuk kepada para keturunan atau kaum Peres; “keturunan” lebih alami daripada “anak-anak” dalam bahasa Indonesia modern.
- source_word: פֶרֶץ
  choice: Peres
  rationale: Mengikuti bentuk nama Alkitab yang lazim dalam bahasa Indonesia.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Mengikuti bentuk nama Alkitab yang lazim dalam bahasa Indonesia dan mempertahankan hubungan silsilah dengan Peres.
