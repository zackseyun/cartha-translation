  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Rangkaian silsilah dipertahankan dengan pengulangan “anak”, sedangkan בְּנֵי diterjemahkan “keturunan” agar hubungan kaum atau garis leluhur terdengar alami. Penanda catatan kaki ditempatkan langsung setelah “Bani”, yaitu pada unsur yang memiliki varian tekstual.
