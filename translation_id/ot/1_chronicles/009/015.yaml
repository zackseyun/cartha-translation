base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/015.yaml
  text: and Bakbakkar[a], Heresh, and Galal, and Mattaniah son of Mica, son of Zichri[b], son of Asaph.
translation:
  language: id
  text: juga Bakbakar, Heres, Galal, dan Matanya, anak[a] Mika[b], anak Zikhri, anak Asaf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam silsilah, kata Ibrani yang diterjemahkan “anak” juga dapat berarti keturunan yang lebih jauh.
    reason: lexical_alternative
  - marker: b
    text: Nama Ibrani di sini adalah מִיכָא (Mika), berbeda dari מִיכָה, yang biasanya ditulis “Mikha”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַקְבַּקַּר
  choice: juga Bakbakar
  rationale: Konjungsi ו melanjutkan daftar orang Lewi dari ayat sebelumnya; “juga” lebih alami dalam bahasa Indonesia pada awal petikan ayat ini. Nama diri ditransliterasikan.
- source_word: חֶרֶשׁ
  choice: Heres
  rationale: Nama diri ditransliterasikan menurut bentuk Ibraninya dengan ejaan yang wajar dalam bahasa Indonesia.
- source_word: וְ/גָלָל
  choice: Galal
  rationale: Nama diri ditransliterasikan; konjungsinya tercakup secara alami dalam rangkaian daftar.
- source_word: וּ/מַתַּנְיָה
  choice: dan Matanya
  rationale: Konjungsi penutup daftar dipertahankan sebagai “dan”; nama Ibrani ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rangkaian silsilah ini, בֶּן paling langsung berarti “anak”, walaupun dalam pemakaian silsilah dapat pula menunjuk keturunan yang lebih jauh.
- source_word: מִיכָא
  choice: Mikha
  rationale: Transliterasi ini mencerminkan konsonan Ibrani dan sesuai dengan ejaan nama Semitik yang alami bagi pembaca Indonesia.
- source_word: זִכְרִי
  choice: Zikhri
  rationale: Bentuk ini mempertahankan bunyi frikatif כ melalui “kh” dan membedakannya dari bunyi k biasa.
- source_word: אָסָף
  choice: Asaf
  rationale: Bentuk nama yang mapan dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Jarak hubungan dalam rangkaian silsilah בֶּן
  choice: Diterjemahkan secara harfiah sebagai “anak” sambil memberi catatan bahwa istilah itu dapat mencakup keturunan yang lebih jauh.
  alternative: keturunan
  rationale: Konteks menyajikan rantai leluhur secara langsung, tetapi keluasan semantis istilah Ibrani tidak boleh dihilangkan.
translation_notes:
  register: Bahasa dibuat ringkas dan bermartabat sesuai bentuk daftar silsilah. Tanda koma membantu memperjelas bahwa Matanya termasuk dalam daftar, sedangkan rangkaian sesudahnya menyatakan garis leluhurnya.
