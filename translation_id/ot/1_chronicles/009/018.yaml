  text: Until then they were at the king’s gate on the east[b][a]; they were the gatekeepers for the camps of the sons of Levi.
translation:
  language: id
  text: Sampai sekarang mereka berada di gerbang raja di sebelah timur.[a] Merekalah para penjaga gerbang bagi perkemahan-perkemahan keturunan Lewi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sampai saat itu” atau “Sampai titik itu.” Ungkapan Ibrani ini dapat dipahami sebagai keterangan waktu yang menyatakan kelanjutan.
    reason: lexical_alternative
  - marker: b
    text: Atau “bagi kelompok-kelompok keturunan Lewi.” Kata Ibrani yang digunakan dapat berarti perkemahan atau kelompok yang terorganisasi, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד הֵנָּה
  choice: Sampai saat itu
  rationale: Ungkapan ini merupakan keterangan waktu yang menunjukkan kelanjutan sampai suatu titik; konteks naratif mendukung arti retrospektif, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: di Gerbang Raja
  rationale: Preposisi בְּ bersifat lokatif, dan frasa konstruksi Ibrani dipertahankan secara alami sebagai nama atau sebutan gerbang.
- source_word: מִזְרָחָה
  choice: di sebelah timur
  rationale: Bentuk berakhiran arah ini di sini paling wajar menyatakan letak pada sisi timur.
- source_word: הֵמָּה
  choice: Merekalah
  rationale: Pronomina mandiri bersifat menegaskan dan mengidentifikasi kelompok yang baru disebut.
- source_word: הַשֹּׁעֲרִים
  choice: para penjaga gerbang
  rationale: Dalam konteks tata pelayanan, nomina ini menunjuk orang-orang yang bertugas menjaga gerbang.
- source_word: לְמַחֲנוֹת
  choice: bagi perkemahan-perkemahan
  rationale: Terjemahan ini mempertahankan arti dasar מַחֲנֶה dan bentuk jamaknya, tanpa menutup kemungkinan bahwa yang dimaksud ialah kelompok-kelompok terorganisasi.
- source_word: בְּנֵי לֵוִי
  choice: keturunan Lewi
  rationale: Secara harfiah 'anak-anak Lewi'; dalam bahasa Indonesia modern, 'keturunan Lewi' menyampaikan hubungan genealogis tanpa memberi kesan bahwa mereka semua putra langsung Lewi.
