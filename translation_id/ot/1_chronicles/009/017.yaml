  text: וְ/הַ/שֹּׁעֲרִים֙ שַׁלּ֣וּם וְ/עַקּ֔וּב וְ/טַלְמֹ֖ן וַ/אֲחִימָ֑ן וַ/אֲחִי/הֶ֥ם שַׁלּ֖וּם הָ/רֹֽאשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/017.yaml
  text: And the gatekeepers were Shallum[a], Akkub, Talmon, Ahiman, and their brothers; Shallum was the chief.
translation:
  language: id
  text: Para penjaga pintu gerbang ialah Salum, Akub, Talmon, Ahiman, dan saudara mereka[a]. Salum adalah pemimpin mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerabat mereka”; kata Ibrani yang secara harfiah berarti “saudara mereka” dalam daftar semacam ini juga dapat menunjuk kepada kerabat atau sesama anggota kaum.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  choice: para penjaga pintu gerbang
  rationale: Istilah ini menunjuk kepada orang-orang yang ditugaskan menjaga pintu-pintu gerbang. Ungkapan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: שַׁלּוּם
  choice: Salum
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: עַקּוּב
  choice: Akub
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia.
- source_word: טַלְמֹן
  choice: Talmon
  rationale: Nama diri ditransliterasikan secara langsung.
- source_word: אֲחִימָן
  choice: Ahiman
  rationale: Nama diri ditransliterasikan secara langsung.
- source_word: אֲחִיהֶם
  choice: saudara mereka
  rationale: Bentuk Ibrani secara harfiah berbentuk tunggal, tetapi dalam konteks daftar kelompok dapat menunjuk kepada seorang saudara, kerabat, atau anggota kaum yang terkait. Terjemahan utama mempertahankan bentuk tunggal dan catatan kaki menjaga keluasan maknanya.
- source_word: הָרֹאשׁ
  choice: pemimpin mereka
  rationale: Secara harfiah berarti 'kepala' dan di sini menyatakan kedudukan kepemimpinan. 'Pemimpin mereka' alami dalam bahasa Indonesia dan memperjelas relasi yang tersirat oleh konteks.
- source_word: וְ...וְ...וַ...וַ
  choice: dan
  rationale: Rangkaian konjungsi Ibrani disajikan sebagai daftar Indonesia yang alami tanpa menghilangkan hubungan penambahannya.
theological_decisions: []
