  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama-nama ditulis dengan bentuk yang lazim dalam tradisi Alkitab Indonesia. Struktur daftar dibuat alami, sedangkan kemungkinan makna luas dari istilah kekerabatan dipertahankan dalam catatan kaki.
