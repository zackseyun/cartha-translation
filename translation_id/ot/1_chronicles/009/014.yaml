id: 1CH.9.14
reference: 1 Chronicles 9:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מִֽן הַ/לְוִיִּ֑ם שְׁמַֽעְיָ֧ה בֶן חַשּׁ֛וּב בֶּן עַזְרִיקָ֥ם בֶּן חֲשַׁבְיָ֖ה מִן בְּנֵ֥י מְרָרִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/014.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, from the sons of Merari.'
translation:
  language: id
  text: 'Dari orang-orang Lewi: Semaya anak Hasub, anak Azrikam, anak Hasabya, dari keturunan Merari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן
  choice: Dari
  rationale: Dalam konteks daftar yang berlanjut, unsur penghubung waw tidak perlu diterjemahkan dengan “dan” agar pembukaan entri tetap alami dalam bahasa Indonesia; preposisi מִן menyatakan bahwa tokoh berikut berasal dari kelompok tersebut.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan ini secara alami menyatakan para anggota suku Lewi dalam bahasa Indonesia; artikelnya terwakili oleh kelompok yang tertentu dalam konteks.
- source_word: שְׁמַעְיָה
  choice: Semaya
  rationale: Nama diri dialihaksarakan dalam bentuk yang lazim dan mudah dibaca dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶן
  choice: anak
  rationale: Dalam rangkaian silsilah, בֶן paling wajar menyatakan hubungan anak dengan ayah; pilihan ini juga mempertahankan bentuk ringkas teks Ibrani.
- source_word: חַשּׁוּב
  choice: Hasub
  rationale: Alih aksara nama Ibrani disesuaikan dengan ejaan Indonesia; penggandaan konsonan tidak diperlukan dalam bentuk Indonesia.
- source_word: עַזְרִיקָם
  choice: Azrikam
  rationale: Nama diri dialihaksarakan secara langsung dan sesuai dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: חֲשַׁבְיָה
  choice: Hasabya
  rationale: Alih aksara ini mempertahankan unsur bunyi nama Ibrani dan memakai bentuk ejaan yang alami bagi pembaca Indonesia.
- source_word: מִן בְּנֵי מְרָרִי
  choice: dari keturunan Merari
  rationale: Dalam ungkapan garis kaum ini, בְּנֵי mencakup kelompok keturunan, bukan hanya anak-anak langsung Merari; “keturunan” menyampaikan maksud tersebut secara alami dan tepat.
theological_decisions: []
