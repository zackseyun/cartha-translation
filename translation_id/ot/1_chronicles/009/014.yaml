  register: Bahasa Indonesia baku, ringkas, dan bermartabat, dengan susunan alami untuk daftar silsilah. Nama-nama menggunakan ejaan Indonesia, dan ambiguitas generasional pada rangkaian “anak” dipertahankan tanpa penjelasan tambahan.
