  text: 'And from the sons of Zerah: Jeuel and their brothers[a], six hundred and ninety.'
translation:
  language: id
  text: 'Dan dari keturunan Zerah: Yeuel dan saudara-saudara mereka[a], 690 orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yeuel dan saudara-saudaranya, 690 orang,” jika Yeuel dipahami sebagai kepala yang mewakili kaum itu. Akhiran dalam teks Ibrani pada “saudara-saudara mereka” berbentuk jamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן
  choice: Dari
  rationale: Bentuk ini menyatakan bahwa kelompok berikut berasal dari garis Zerah. Dalam bahasa Indonesia, hubungan tambahan dengan daftar sebelumnya tetap wajar tanpa harus menerjemahkan waw secara tersendiri sebagai “dan”.
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar silsilah, בְּנֵי dapat menunjuk pada anggota garis keluarga atau kaum, bukan hanya anak kandung langsung. “Keturunan” menyampaikan cakupan itu secara alami.
- source_word: זֶרַח
  choice: Zerah
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: יְעוּאֵל
  choice: Yeuel
  rationale: Nama pribadi ditransliterasikan secara langsung dan sesuai dengan pola ejaan nama Ibrani dalam bahasa Indonesia.
- source_word: וַ/אֲחֵי/הֶם
  choice: dan saudara-saudara mereka
  rationale: Akhiran pronomina Ibrani berbentuk jamak, sehingga “mereka” mempertahankan bentuk sumber dan memungkinkan rujukan kepada kelompok keturunan Zerah, meskipun Yeuel tampil sebagai tokoh yang disebutkan.
- source_word: שֵׁשׁ מֵאוֹת וְ/תִשְׁעִים
  choice: 690 orang
  rationale: Bilangan ini menyatakan jumlah orang dalam daftar. Angka dan penambahan “orang” menghasilkan ungkapan ringkas serta jelas dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa dibuat ringkas dan bermartabat sesuai gaya daftar silsilah. “Keturunan” dipilih daripada “anak-anak” agar pembaca tidak membatasi maknanya pada putra kandung langsung. Penanda catatan kaki ditempatkan tepat setelah frasa yang memiliki kemungkinan terjemahan lain.
