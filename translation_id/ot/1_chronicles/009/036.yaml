  text: And his firstborn son was Abdon[a], then Zur, Kish, Baal, Ner, and Nadab.
translation:
  language: id
  text: Dan putranya yang sulung ialah Abdon[a], kemudian Zur, Kish, Baal, Ner, dan Nadab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Dan putranya, yang sulung: Abdon, lalu Zur, Kish, Baal, Ner, dan Nadab.” Kata penghubung Ibrani yang muncul sebelum setiap nama disajikan secara wajar sebagai sebuah daftar dalam bahasa Indonesia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנוֹ הַבְּכוֹר
  choice: Anak sulungnya
  rationale: Ungkapan ini mempertahankan hubungan kepemilikan dan makna genealogis ‘anak yang pertama lahir’; waw pembuka tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia karena ayat ini melanjutkan daftar dari konteks sebelumnya.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְצוּר
  choice: kemudian Zur
  rationale: Kata ‘kemudian’ memperkenalkan kelanjutan daftar secara alami tanpa dimaksudkan untuk menegaskan urutan waktu.
- source_word: וְקִישׁ
  choice: Kish
  rationale: Nama diri ditransliterasikan; konjungsi Ibrani diserap ke dalam susunan daftar bahasa Indonesia.
- source_word: וּבַעַל
  choice: Baal
  rationale: Dalam konteks silsilah, bentuk ini adalah nama pribadi dan dipertahankan tanpa penghalusan teologis.
- source_word: וְנֵר
  choice: Ner
  rationale: Nama diri ditransliterasikan dan ditempatkan sebagai unsur dalam daftar.
- source_word: וְנָדָב
  choice: dan Nadab
  rationale: Konjungsi pada unsur terakhir diterjemahkan secara idiomatis dengan ‘dan’.
theological_decisions:
- issue: Penerjemahan nama pribadi בַּעַל dalam silsilah orang Israel
  choice: Baal sebagai nama pribadi
  alternative: Mengganti atau menghaluskan nama itu untuk menghindari kaitannya dengan nama dewa Kanaan
  rationale: Teks Ibrani dengan jelas memuat nama בַּעַל. Mempertahankannya mencerminkan sumber dan tidak menyiratkan persetujuan terhadap penyembahan berhala.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur nominal Ibrani dilengkapi dengan ‘ialah’ agar menjadi kalimat Indonesia yang alami; nama-nama dipertahankan sebagai nama diri.
