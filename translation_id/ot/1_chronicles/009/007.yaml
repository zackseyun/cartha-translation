base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/007.yaml
  text: 'And from the sons of Benjamin: Sallu son of Meshullam[a], son of Hodaviah[c][b], son of Hassenuah.'
translation:
  language: id
  text: 'Dan dari keturunan Benyamin[a]: Salu, anak Mesulam[b], anak Hodawya[c], anak Hasenua.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari anak-anak Benyamin”; ungkapan ini menunjuk kepada anggota suku Benyamin.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani mengulang kata “anak” dalam silsilah ini. Istilah itu dapat menunjuk kepada anak langsung ataupun keturunan dalam garis silsilah.
    reason: cultural_note
  - marker: c
    text: Nama Hodawya ditulis dalam bentuk yang berbeda dalam beberapa tradisi silsilah yang berkaitan.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִן
  choice: Dari
  rationale: Bentuk ini melanjutkan daftar sebelumnya dan memperkenalkan kelompok berikutnya. Kata sambung וּ tidak perlu dinyatakan secara terpisah dalam bahasa Indonesia karena kesinambungan daftar sudah jelas dari susunannya.
- source_word: בְּנֵי בִּנְיָמִן
  choice: keturunan Benyamin
  rationale: Secara harfiah berarti 'anak-anak Benyamin', tetapi dalam daftar silsilah ungkapan ini menunjuk kepada anggota atau keturunan suku Benyamin. 'Keturunan Benyamin' alami dalam bahasa Indonesia tanpa menghilangkan makna genealogisnya.
- source_word: סַלּוּא
  choice: Salu
  rationale: Nama diri Ibrani dialihaksarakan dalam bentuk yang wajar dan lazim bagi pembaca Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Padanan langsung bagi istilah hubungan genealogis ini. Pengulangan 'anak' dipertahankan sesuai bentuk rantai silsilah Ibrani, sementara catatan menjelaskan bahwa silsilah dapat melompati generasi.
- source_word: מְשֻׁלָּם
  choice: Mesulam
  rationale: Alih aksara nama diri yang sesuai dengan pelafalan Ibrani dan kebiasaan bahasa Indonesia.
- source_word: הוֹדַוְיָה
  choice: Hodawya
  rationale: Mengikuti bentuk teks Masoret dalam ayat ini; unsur konsonantal dan vokalisasinya mendukung bentuk Hodawya.
- source_word: הַסְּנֻאָה
  choice: Hasenua
  rationale: Dalam konteks silsilah, bentuk ini dipahami sebagai nama diri. Artikel Ibrani yang melebur dengan konsonan berikutnya tercermin dalam bentuk 'Hasenua'.
