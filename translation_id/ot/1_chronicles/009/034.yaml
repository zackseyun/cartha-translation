  text: אֵלֶּה֩ רָאשֵׁ֨י הָ/אָב֧וֹת לַ/לְוִיִּ֛ם לְ/תֹלְדוֹתָ֖/ם רָאשִׁ֑ים אֵ֖לֶּה יָשְׁב֥וּ בִ/ירוּשָׁלִָֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/034.yaml
  text: These were the heads of the fathers’ houses of the Levites[a], according to their generations, heads[b]. These lived in Jerusalem.
translation:
  language: id
  text: Mereka inilah para kepala kelompok-kelompok keluarga orang Lewi[a], menurut garis keturunan mereka—para kepala.[b] Mereka ini tinggal di Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kelompok-kelompok keluarga” adalah kelompok kekerabatan atau marga yang diturunkan dari leluhur yang sama, bukan hanya satu rumah tangga.
    reason: cultural_note
  - marker: b
    text: Bahasa Ibrani mengulangi kata yang berarti “kepala” untuk memberi penegasan; kata ini juga dapat diterjemahkan “pemimpin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי
  choice: para kepala
  rationale: Bentuk konstruksi ini menunjuk kepada orang-orang yang mengepalai suatu kelompok sosial. Pilihan ini mempertahankan ungkapan Ibrani dan cocok dengan konteks silsilah serta kepemimpinan.
- source_word: הָאָבוֹת
  choice: kaum leluhur
  rationale: Dalam konteks Tawarikh, istilah ini menunjuk kepada satuan kekerabatan berdasarkan leluhur, bukan sekadar ayah-ayah atau rumah tangga perseorangan.
- source_word: לַלְוִיִּם
  choice: orang Lewi
  rationale: Prefiks ל menyatakan hubungan atau penggolongan; susunan Indonesia ini secara alami menunjukkan bahwa kaum leluhur tersebut termasuk golongan Lewi.
- source_word: לְתֹלְדוֹתָם
  choice: menurut garis keturunan mereka
  rationale: תּוֹלְדוֹת dalam konteks silsilah berkaitan dengan keturunan atau generasi. Pilihan ini jelas dalam bahasa Indonesia tanpa menganggap bahwa yang dimaksud pasti catatan tertulis.
- source_word: רָאשִׁים
  choice: para kepala
  rationale: Nomina yang sama diulang secara aposisional untuk menegaskan kedudukan mereka. Pengulangan dipertahankan, sedangkan tanda pisah membantu menghasilkan kalimat Indonesia yang wajar.
- source_word: יָשְׁבוּ
  choice: tinggal
  rationale: Dalam konteks ini verba tersebut menyatakan tempat kediaman; 'tinggal' merupakan padanan modern dan langsung.
- source_word: בִירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Padanan lokatif baku untuk nama tempat tersebut.
