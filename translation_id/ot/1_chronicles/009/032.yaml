base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/032.yaml
  text: And some of the sons of the Kohathites[a], from among their brothers, were in charge of the bread of the arrangement, to prepare it Sabbath by Sabbath.
translation:
  language: id
  text: Sebagian dari keturunan Kehat, dari antara saudara-saudara mereka, bertanggung jawab atas roti yang ditata[a], untuk menyiapkannya setiap hari Sabat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “roti susunan,” yaitu roti yang ditata atau disusun. Secara tradisional disebut “roti sajian” atau “roti hadirat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Sebagian
  rationale: Gabungan konjungsi dan preposisi ini memperkenalkan sebagian orang dari kelompok Lewi yang telah disebutkan. Dalam bahasa Indonesia, 'sebagian' menyampaikan makna partitif secara alami; konjungsi Ibrani tidak harus diterjemahkan tersendiri pada awal kalimat.
- source_word: בְּנֵי הַקְּהָתִי
  choice: keturunan Kehat
  rationale: Ungkapan ini menunjuk kepada anggota kaum atau puak Kehat. 'Keturunan Kehat' mempertahankan gagasan kekerabatan tanpa memberi kesan bahwa mereka semua anak langsung Kehat.
- source_word: מִן אֲחֵיהֶם
  choice: yaitu saudara-saudara mereka
  rationale: Preposisi partitif mengaitkan orang-orang Kehat itu dengan sesama saudara Lewi mereka. 'Yaitu' membuat hubungan sintaksis yang padat dalam bahasa Ibrani dapat dipahami dalam bahasa Indonesia tanpa mengubah identitas kelompok tersebut.
- source_word: עַל
  choice: bertanggung jawab atas
  rationale: Dalam konteks tugas keagamaan atau administratif, preposisi ini menyatakan tanggung jawab atau pengawasan.
- source_word: לֶחֶם הַמַּעֲרָכֶת
  choice: roti yang disusun
  rationale: Frasa ini secara harfiah menunjuk kepada roti yang ditata atau disusun. Pilihan ini mempertahankan citra tindakan penataan dan menghindari istilah tradisional yang kurang transparan bagi pembaca modern.
- source_word: לְהָכִין
  choice: untuk menyiapkannya
  rationale: Infinitif menyatakan tujuan tugas mereka; akhiran '-nya' memperjelas bahwa objek yang disiapkan adalah roti tersebut.
- source_word: שַׁבַּת שַׁבָּת
  choice: setiap hari Sabat
  rationale: Pengulangan nomina Ibrani bersifat distributif, yakni dari satu Sabat ke Sabat berikutnya. 'Setiap hari Sabat' merupakan ungkapan Indonesia yang alami dan tepat.
