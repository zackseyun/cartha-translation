base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/008.yaml
  text: and Ibneiah son of Jeroham[a], and Elah son of Uzzi, son of Michri, and Meshullam son of Shephatiah, son of Reuel, son of Ibnijah.
translation:
  language: id
  text: dan Yibneya anak Yeroham[a], Ela anak Uzi, anak Mikhri, dan Mesulam anak Sefatya, anak Rehuel, anak Yibniya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama-nama Ibrani ditransliterasikan, bukan diterjemahkan. Dalam terjemahan lain, beberapa nama dapat memiliki ejaan yang berbeda, misalnya Jibneya atau Raguel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: dan
  rationale: Kata sambung berawalan ini menghubungkan daftar nama dengan konteks sebelumnya; pengulangan “dan” dipertahankan sesuai rangkaian Ibrani.
- source_word: יִבְנְיָה
  choice: Yibneya
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani dengan ejaan yang wajar bagi pembaca Indonesia; yod awal diwakili dengan “Y”.
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar silsilah ini, kata tersebut paling wajar menunjukkan hubungan ayah-anak. “Anak” lebih alami dalam bahasa Indonesia daripada mempertahankan bentuk Semitik “bin”.
- source_word: יְרֹחָם
  choice: Yeroham
  rationale: Nama diri ditransliterasikan dari bahasa Ibrani, bukan melalui bentuk Inggris.
- source_word: אֵלָה
  choice: Ela
  rationale: Nama diri ditransliterasikan secara ringkas sesuai bunyi Ibrani.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani; konsonan ganda tidak perlu ditandai dalam ejaan Indonesia.
- source_word: מִכְרִי
  choice: Mikhri
  rationale: Gabungan “kh” dipakai untuk mewakili konsonan Ibrani כ רפה dan membedakannya dari bunyi k biasa.
- source_word: מְשֻׁלָּם
  choice: Mesulam
  rationale: Nama diri ditransliterasikan dengan bentuk yang mudah dibaca dalam bahasa Indonesia; konsonan ganda tidak ditandai.
- source_word: שְׁפַטְיָה
  choice: Sefaca
  rationale: Nama diri mengikuti bentuk Indonesia yang lazim dan mudah dibaca, dengan “c” mewakili bunyi /tʃ/ yang timbul dari rangkaian Ibrani terkait.
- source_word: רְעוּאֵל
  choice: Rehuel
  rationale: Transliterasi ini mencerminkan bentuk Masoret רְעוּאֵל secara langsung dan tidak mengikuti varian tradisional “Raguel”.
- source_word: יִבְנִיָּה
  choice: Yibniya
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani; unsur akhir -ya dipertahankan tanpa memaksakan ejaan Inggris -jah.
