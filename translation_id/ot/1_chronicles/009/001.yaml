source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵל֙ הִתְיַחְשׂ֔וּ וְ/הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֖פֶר מַלְכֵ֣י יִשְׂרָאֵ֑ל וִ/יהוּדָ֛ה הָגְל֥וּ לְ/בָבֶ֖ל בְּ/מַעֲלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/001.yaml
  text: So all Israel was enrolled by genealogy[a], and behold, they are written in the Book of the Kings of Israel[b]; and Judah was taken into exile to Babylon because of their unfaithfulness.
translation:
  language: id
  text: Seluruh Israel didaftarkan menurut silsilah[a], dan sesungguhnya nama-nama mereka tercatat dalam Kitab Raja-Raja Israel; orang Yehuda dibuang ke Babel karena ketidaksetiaan mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dicatat berdasarkan silsilah” atau “dimasukkan ke dalam daftar silsilah.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “pelanggaran mereka” atau “pengkhianatan mereka.” Kata Ibrani ini mengandung makna melanggar kepercayaan atau tidak setia, sering kali dalam hubungan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַחְשׂוּ
  choice: didaftarkan menurut silsilah mereka
  rationale: Bentuk hitpael dari יחס menunjuk pada penetapan atau pencatatan garis keturunan, bukan sekadar penghitungan. Ungkapan ini mempertahankan makna administratif-genealogis dalam bahasa Indonesia yang alami.
- source_word: וְהִנָּם
  choice: dan sesungguhnya
  rationale: Penanda wacana ini menarik perhatian kepada fakta bahwa nama-nama itu tercatat. “Sesungguhnya” mempertahankan daya penegas-presentatif tanpa memakai bentuk arkais “lihatlah” dalam konteks ini.
- source_word: כְּתוּבִים
  choice: tercatat
  rationale: Partisipel pasif ini menyatakan keadaan bahwa mereka sudah tercantum dalam catatan. “Tercatat” lebih idiomatis daripada terjemahan harfiah “tertulis” untuk daftar nama.
- source_word: עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: dalam Kitab Raja-Raja Israel
  rationale: Dalam konteks dokumenter, עַל dengan כתב wajar diterjemahkan “dalam”. Kapitalisasi menandai judul suatu sumber atau catatan yang dapat dikenali.
- source_word: וִיהוּדָה
  choice: Orang Yehuda
  rationale: “Yehuda” di sini menunjuk secara kolektif kepada penduduk kerajaan selatan. “Orang Yehuda” membuat acuan kolektif itu jelas dan cocok dengan kata ganti jamak pada akhir ayat.
- source_word: הָגְלוּ
  choice: dibuang
  rationale: Bentuk hofal menyatakan bahwa Yehuda dikenai tindakan deportasi, bukan pergi atas prakarsa sendiri. “Dibuang ke Babel” menyampaikan bentuk pasif itu secara ringkas dan alami.
- source_word: לְבָבֶל
  choice: ke Babel
  rationale: Ini adalah ungkapan tujuan yang baku bagi nama tempat tersebut.
- source_word: בְּמַעֲלָם
  choice: karena ketidaksetiaan mereka
  rationale: מַעַל dapat berarti pelanggaran kepercayaan, pengkhianatan, atau ketidaksetiaan, sering dalam hubungan perjanjian. Pilihan ini menyampaikan sebab pembuangan dan dimensi pelanggaran iman tanpa memperluas teks.
theological_decisions:
- issue: Sifat kesalahan Yehuda dalam בְּמַעֲלָם
  choice: ketidaksetiaan
  alternative: pelanggaran; pengkhianatan
  rationale: Istilah מַעַל lebih khusus daripada kesalahan umum dan sering menyiratkan rusaknya kesetiaan kepada Allah. “Ketidaksetiaan” mempertahankan nuansa itu tanpa memasukkan penafsiran denominasi tertentu.
- issue: Diatesis הָגְלוּ
  choice: 'pasif: “dibuang”'
  alternative: 'aktif/intransitif: “pergi ke pembuangan”'
  rationale: Bentuk hofal menunjukkan bahwa orang Yehuda mengalami deportasi. Terjemahan pasif mempertahankan konteks penghukuman dan tidak memberi kesan bahwa mereka pergi dengan kemauan sendiri.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Kitab Raja-Raja Israel” dipertahankan sebagai judul catatan sumber. Penanda wacana וְהִנָּם diterjemahkan eksplisit, sedangkan acuan kolektif “Yehuda” diperjelas menjadi “Orang Yehuda” agar hubungan dengan “mereka” tetap alami.
