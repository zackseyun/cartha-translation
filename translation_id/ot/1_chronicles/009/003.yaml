source:
  edition: WLC
  text: וּ/בִ/ירוּשָׁלִַ֨ם֙ יָשְׁב֔וּ מִן בְּנֵ֥י יְהוּדָ֖ה וּ/מִן בְּנֵ֣י בִנְיָמִ֑ן וּ/מִן בְּנֵ֥י אֶפְרַ֖יִם וּ/מְנַשֶּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/003.yaml
  text: And in Jerusalem some from the sons of Judah, and some from the sons of Benjamin, and some from the sons of Ephraim and Manasseh, lived there.
translation:
  language: id
  text: Di Yerusalem tinggal beberapa orang dari keturunan Yehuda, beberapa orang dari keturunan Benyamin, serta beberapa orang dari keturunan Efraim dan Manasye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “dari anak-anak Yehuda ... dari anak-anak Benyamin ... dari anak-anak Efraim dan Manasye.”
    reason: Menjelaskan bahwa “keturunan” menerjemahkan idiom genealogis Ibrani בְּנֵי, yang secara harfiah berarti “anak-anak” atau “putra-putra”.
lexical_decisions:
- source_word: וּ/בִ/ירוּשָׁלִַם
  choice: Di Yerusalem
  rationale: Kata penghubung waw mengaitkan ayat ini dengan konteks sebelumnya, tetapi dalam bahasa Indonesia hubungan itu tetap alami tanpa harus diterjemahkan secara eksplisit sebagai “dan”; preposisi בִּ dipertahankan dengan “di”.
- source_word: יָשְׁבוּ
  choice: tinggal
  rationale: Dalam konteks daftar penduduk, ישׁב menyatakan menetap atau berdiam. “Tinggal” adalah padanan Indonesia modern yang alami dan tidak memerlukan tambahan “di sana” karena lokasi sudah disebutkan.
- source_word: מִן
  choice: beberapa orang dari
  rationale: Pengulangan מִן menunjukkan orang-orang yang berasal dari masing-masing kelompok suku, bukan seluruh suku. Penambahan “beberapa orang” membentuk subjek yang wajar dalam bahasa Indonesia sekaligus mempertahankan makna parsial.
- source_word: בְּנֵי יְהוּדָה
  choice: keturunan Yehuda
  rationale: Ungkapan בְּנֵי + nama leluhur merupakan idiom genealogis-sukuis. “Keturunan Yehuda” menyampaikan maknanya secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: בְּנֵי בִנְיָמִן
  choice: keturunan Benyamin
  rationale: Diterjemahkan konsisten sebagai ungkapan genealogis-sukuis, bukan sebagai sebutan geografis atau politis.
- source_word: בְּנֵי אֶפְרַיִם
  choice: keturunan Efraim
  rationale: “Keturunan Efraim” mempertahankan rujukan genealogis dan pola berulang dalam ayat.
- source_word: וּ/מְנַשֶּׁה
  choice: dan Manasye
  rationale: Teks Ibrani tidak mengulang בְּנֵי sebelum Manasye. Dalam frasa Indonesia “keturunan Efraim dan Manasye”, kata “keturunan” secara alami berlaku bagi kedua nama.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan susunan yang ringkas dan mudah dipahami. “Serta” dipakai pada unsur terakhir untuk memperjelas koordinasi daftar, sedangkan nama-nama mengikuti bentuk Indonesia yang lazim: Yehuda, Benyamin, Efraim, dan Manasye.'
