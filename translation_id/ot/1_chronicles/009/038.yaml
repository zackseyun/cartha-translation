base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/038.yaml
  text: Mikloth fathered Shimeam[a]. They also lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: id
  text: Miklot menjadi ayah bagi Simeam[a]. Mereka juga tinggal berhadapan dengan saudara-saudara mereka di Yerusalem[b], bersama saudara-saudara mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Simeam; beberapa terjemahan memakai “Simea”, kemungkinan karena diselaraskan dengan bentuk nama dalam silsilah yang sejajar.'
    reason: alternative_reading
  - marker: b
    text: Atau “di hadapan saudara-saudara mereka” atau “dekat saudara-saudara mereka”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: Miklot
  rationale: Nama diri ditransliterasikan menurut bentuk Ibrani; waw penghubung tidak dinyatakan tersendiri karena ayat ini melanjutkan silsilah sebelumnya.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Dalam konteks silsilah, bentuk Hifil dari ילד berarti menjadi ayah atau memperanakkan; pilihan ini ringkas dan mempertahankan hubungan genealogis laki-laki.
- source_word: אֶת שִׁמְאָם
  choice: Simeam
  rationale: Penanda objek langsung tidak diterjemahkan. Nama mengikuti bentuk konsonantal שִׁמְאָם dalam ayat ini, tanpa menyelaraskannya dengan bentuk nama pada bagian sejajar.
- source_word: וְאַף הֵם
  choice: Mereka juga
  rationale: Mengungkapkan makna tambahan וְאַף secara wajar dalam bahasa Indonesia; hubungan dengan kalimat sebelumnya tetap jelas tanpa harus memulai kalimat dengan 'Dan'.
- source_word: נֶגֶד
  choice: berhadapan dengan
  rationale: Mempertahankan arti spasial dasar 'di hadapan/berseberangan dengan' tanpa menentukan secara berlebihan letak persis tempat tinggal mereka.
- source_word: אֲחֵיהֶם
  choice: saudara-saudara mereka
  rationale: Menerjemahkan ungkapan Ibrani secara langsung; dalam konteks silsilah dapat merujuk kepada kerabat satu kelompok, tetapi teks memakai istilah 'saudara'.
- source_word: יָשְׁבוּ
  choice: tinggal
  rationale: Dalam konteks ini ישב menyatakan tempat kediaman; 'tinggal' alami dalam bahasa Indonesia modern.
- source_word: בִירוּשָׁלִַם
  choice: di Yerusalem
  rationale: Mempertahankan preposisi tempat dan memakai bentuk baku nama kota dalam bahasa Indonesia.
- source_word: עִם אֲחֵיהֶם
  choice: bersama saudara-saudara mereka
  rationale: עִם menyatakan kebersamaan. Pengulangan 'saudara-saudara mereka' dipertahankan karena juga terdapat dalam teks Ibrani dan dapat memberi penekanan pada kedekatan kelompok kerabat.
