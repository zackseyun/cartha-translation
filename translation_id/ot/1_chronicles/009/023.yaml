base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/023.yaml
  text: They and their sons were over the gates of the house of Yahweh[a], that is, the house of the tent, as guards.
translation:
  language: id
  text: Mereka dan anak-anak lelaki mereka bertanggung jawab atas gerbang-gerbang rumah Yahweh, yaitu rumah kemah[a], sebagai penjaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kemah Suci.” Secara harfiah: “rumah kemah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Mereka
  rationale: Konjungsi dan pronomina ini melanjutkan serta menegaskan kembali subjek; dalam bahasa Indonesia, pembukaan tanpa “dan” lebih alami tanpa menghilangkan rujukannya.
- source_word: וּבְנֵיהֶם
  choice: dan anak-anak lelaki mereka
  rationale: בנים dalam konteks tugas penjaga gerbang turun-temurun menunjuk kepada keturunan laki-laki, sehingga unsur gender dipertahankan.
- source_word: עַל הַשְּׁעָרִים
  choice: bertanggung jawab atas gerbang-gerbang
  rationale: Dalam konteks administratif ini, עַל menyatakan tanggung jawab atau pengawasan, bukan sekadar keberadaan di dekat gerbang.
- source_word: לְבֵית יְהוָה
  choice: rumah Yahweh
  rationale: Frasa ini mengaitkan gerbang-gerbang tersebut dengan rumah ibadah milik Yahweh; nama ilahi ditransliterasikan secara langsung.
- source_word: לְבֵית הָאֹהֶל
  choice: rumah kemah
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani yang tidak biasa dan kaitannya dengan tempat ibadah berbentuk kemah, tanpa langsung menyamakannya dengan istilah interpretatif “Kemah Suci”.
- source_word: לְמִשְׁמָרוֹת
  choice: sebagai penjaga
  rationale: Bentuk ini menyampaikan fungsi penjagaan secara jelas dalam bahasa Indonesia modern, tanpa memaksakan arti teknis “giliran-giliran jaga” yang tidak pasti di sini.
theological_decisions:
- issue: Hubungan antara “rumah Yahweh” dan “rumah kemah”
  choice: Frasa kedua diterjemahkan sebagai keterangan penjelas bagi frasa pertama dengan “yaitu”, sambil mempertahankan kedua ungkapan.
  alternative: Memahami “rumah kemah” langsung sebagai “Kemah Suci”, atau menganggap keduanya sebagai dua tempat yang berbeda.
  rationale: Susunan ini memungkinkan kaitan antara pelayanan di rumah Yahweh dan tempat ibadah berbentuk kemah tetap terlihat, tanpa menghapus ketegangan historis-teologis atau menjadikannya dua lokasi terpisah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan “bertanggung jawab atas” mengungkapkan fungsi pengawasan dengan jelas, sedangkan “rumah kemah” sengaja dipertahankan karena mencerminkan bentuk sumber yang khas.
