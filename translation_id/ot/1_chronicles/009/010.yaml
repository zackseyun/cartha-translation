  text: וּ/מִן הַֽ/כֹּהֲנִ֑ים יְדַֽעְיָ֥ה וִ/יהוֹיָרִ֖יב וְ/יָכִֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/010.yaml
  text: 'And from the priests: Jedaiah, Jehoiarib, and Jakin.'
translation:
  language: id
  text: 'Dan dari antara para imam: Yedaya, Yoyarib, dan Yakhin.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן
  choice: Dari antara
  rationale: Preposisi מִן memperkenalkan orang-orang yang berasal dari kelompok imam. Dalam bahasa Indonesia, “dari antara” menyatakan hubungan partitif itu secara alami; waw penghubung tidak perlu diterjemahkan tersendiri pada awal ayat karena ayat ini melanjutkan daftar sebelumnya.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Bentuk jamak dengan artikel menunjuk kepada kelompok imam yang sedang didaftarkan. “Para imam” merupakan padanan Indonesia yang baku dan jelas.
- source_word: יְדַעְיָה
  choice: Yedaya
  rationale: Nama Ibrani ditransliterasikan mengikuti bentuk yang lazim dan mudah dibaca dalam tradisi Alkitab bahasa Indonesia.
- source_word: וִיהוֹיָרִיב
  choice: Yoyarib
  rationale: Nama ini ditransliterasikan dengan bentuk Indonesia; waw yang melekat berfungsi sebagai penghubung dalam daftar dan secara alami tidak perlu dinyatakan sebelum unsur kedua.
- source_word: וְיָכִין
  choice: dan Yakhin
  rationale: Waw diterjemahkan “dan” untuk menandai unsur terakhir dalam daftar, sedangkan nama ditransliterasikan dalam bentuk Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur daftar dipertahankan dengan tanda titik dua; nama-nama ditransliterasikan secara konsisten untuk pembaca Indonesia.
