  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/גְד֣וֹר
  choice: Gedor
  rationale: Nama diri Ibrani גְדוֹר ditransliterasikan sebagai “Gedor”; waw pada awal kata melanjutkan daftar dan tidak perlu diulang sebagai “dan” dalam gaya daftar bahasa Indonesia.
- source_word: וְ/אַחְי֔וֹ
  choice: Ahio
  rationale: Nama diri אַחְיוֹ ditransliterasikan sebagai “Ahio”, bentuk yang alami dan lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וּ/זְכַרְיָ֖ה
  choice: Zakharia
  rationale: Nama זְכַרְיָה memakai bentuk “Zakharia”, yang dikenal pembaca Indonesia sekaligus cukup dekat dengan bunyi Ibraninya.
- source_word: וּ/מִקְלֽוֹת
  choice: Miklot
  rationale: Nama מִקְלוֹת ditransliterasikan “Miklot”; huruf akhir ת direpresentasikan sebagai t, sesuai pelafalan Ibrani dan pola transliterasi Indonesia.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia modern, ringkas, dan bermartabat. Konjungsi Ibrani yang berulang dinaturalkan menjadi pola daftar Indonesia: koma dan satu “dan” sebelum unsur terakhir. Nama-nama ditransliterasikan, bukan diterjemahkan.'
