  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מֵ/הֶ֗ם מְמֻנִּים֙ עַל הַ/כֵּלִ֔ים וְ/עַ֖ל כָּל כְּלֵ֣י הַ/קֹּ֑דֶשׁ וְ/עַל הַ/סֹּ֨לֶת֙ וְ/הַ/יַּ֣יִן וְ/הַ/שֶּׁ֔מֶן וְ/הַ/לְּבוֹנָ֖ה וְ/הַ/בְּשָׂמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/029.yaml
  text: And some of them were appointed over the vessels[a], over all the holy vessels, and over the fine flour, the wine, the oil, the frankincense, and the spices.
translation:
  language: id
  text: Sebagian dari mereka ditugaskan untuk mengurus peralatan, segala perlengkapan kudus[a], tepung halus, anggur, minyak, kemenyan, dan rempah-rempah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “segala perlengkapan tempat kudus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם
  choice: Sebagian dari mereka
  rationale: Ungkapan ini mempertahankan makna partitif מן, yaitu orang-orang tertentu yang dipilih dari kelompok yang lebih besar, dengan bahasa Indonesia yang alami.
- source_word: מְמֻנִּים עַל
  choice: ditugaskan untuk mengurus
  rationale: Partisipel pasif מְמֻנִּים menunjukkan penetapan tanggung jawab, sedangkan עַל menandai bidang yang menjadi tanggung jawab mereka. Gabungan ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah ‘ditetapkan atas’.
- source_word: הַכֵּלִים
  choice: peralatan
  rationale: כְּלִי merupakan istilah luas bagi alat, perkakas, wadah, atau barang perlengkapan. ‘Peralatan’ menjaga keluasan maknanya tanpa membatasinya hanya pada bejana.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: segala perlengkapan kudus
  rationale: Frasa konstruksi ini secara harfiah berarti perlengkapan ‘kekudusan’ atau ‘tempat kudus’. Pilihan utama mempertahankan nuansa bahwa barang-barang itu dikhususkan bagi ibadah, sementara kemungkinan lokatif dicatat dalam catatan kaki.
- source_word: הַסֹּלֶת
  choice: tepung terbaik
  rationale: סֹלֶת menunjuk pada tepung bermutu halus yang dipakai dalam persembahan. ‘Tepung terbaik’ menyampaikan mutu khususnya dalam bahasa Indonesia umum tanpa menyiratkan jenis biji-bijian yang tidak dinyatakan.
- source_word: הַיַּיִן
  choice: anggur
  rationale: Padanan langsung dan wajar untuk יַיִן dalam konteks persediaan bagi pelayanan ibadah.
- source_word: הַשֶּׁמֶן
  choice: minyak
  rationale: Teks hanya menyebut minyak; meskipun kemungkinan besar minyak zaitun, jenisnya tidak dinyatakan secara eksplisit.
- source_word: הַלְּבוֹנָה
  choice: kemenyan
  rationale: לְבוֹנָה secara khusus menunjuk pada frankincense; ‘kemenyan’ adalah padanan Indonesia yang lazim dalam konteks bahan dupa kudus.
- source_word: הַבְּשָׂמִים
  choice: rempah-rempah
  rationale: Istilah ini menunjuk pada bahan-bahan aromatik. ‘Rempah-rempah’ alami dan cukup luas untuk konteks persiapan bahan kudus.
theological_decisions:
- issue: Makna כְּלֵי הַקֹּדֶשׁ
  choice: segala perlengkapan kudus
  alternative: segala perlengkapan tempat kudus
  rationale: הַקֹּדֶשׁ dapat menyatakan sifat kudus atau merujuk pada tempat kudus. Teks utama mempertahankan bentuk yang lebih formal dan ringkas, sedangkan alternatif lokatif dicatat agar ambiguitas sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan עַל tidak ditiru secara kaku; satu frasa ‘untuk mengurus’ menaungi seluruh daftar agar kalimat alami dan jelas.
