  yaml_path: translation/ot/1_chronicles/009/025.yaml
  text: And their brothers in their villages were to come in every seven days[a], from time to time[b], with these.
translation:
  language: id
  text: Saudara-saudara mereka yang tinggal di desa-desa mereka harus datang dari waktu ke waktu untuk bertugas selama tujuh hari bersama mereka[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap tujuh hari”; frasa Ibrani ini mungkin menunjuk pada giliran pelayanan tujuh-harian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “bersama orang-orang ini”, yang merujuk kepada mereka yang sudah bertugas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Saudara-saudara mereka
  rationale: Secara harfiah berarti saudara-saudara mereka; dalam konteks pelayanan orang Lewi dapat mencakup kerabat atau rekan sekelompok, tetapi terjemahan ini mempertahankan ungkapan Ibrani.
- source_word: בְּחַצְרֵיהֶם
  choice: yang tinggal di desa-desa mereka
  rationale: חָצֵר dapat berarti pelataran, permukiman, atau desa. Di sini konteks tempat tinggal di luar kawasan Bait Allah mendukung desa-desa; penambahan 'yang tinggal' menghasilkan bahasa Indonesia yang alami.
- source_word: לָבוֹא
  choice: harus datang
  rationale: Infinitif dengan ל dalam uraian tugas ini menyatakan kewajiban atau jadwal pelayanan, bukan sekadar tindakan lampau.
- source_word: לְשִׁבְעַת הַיָּמִים
  choice: setiap tujuh hari
  rationale: Ungkapan ini paling mungkin menunjuk pada giliran atau selang tujuh hari, tetapi kemungkinan arti 'selama tujuh hari' dipertahankan dalam catatan kaki.
- source_word: מֵעֵת אֶל עֵת
  choice: dari waktu ke waktu
  rationale: Terjemahan langsung yang mempertahankan gagasan waktu-waktu yang berulang tanpa menentukan jadwal lebih jauh daripada teks.
- source_word: עִם אֵלֶּה
  choice: untuk bergabung dengan mereka
  rationale: Secara harfiah 'bersama orang-orang ini'; pronomina Indonesia memperjelas bahwa acuannya ialah para penjaga yang sedang bertugas, sedangkan bentuk harfiahnya dicatat.
