- from: Saudara-saudara mereka yang tinggal di desa-desa mereka harus datang setiap tujuh hari[a], dari waktu ke waktu, untuk bergabung dengan mereka.[b]
  to: Saudara-saudara mereka yang tinggal di desa-desa mereka harus datang dari waktu ke waktu untuk bertugas selama tujuh hari bersama mereka[b].[a]
  rationale: Revisi menjadikan arti langsung “selama tujuh hari” sebagai teks utama, sedangkan kemungkinan rotasi tujuh-harian dipindahkan ke catatan kaki. Frasa “bersama mereka” mempertahankan relasi yang dinyatakan sumber tanpa menambahkan gagasan “bergabung”, dan penanda catatan kaki dipasang pada frasa yang dijelaskannya.
