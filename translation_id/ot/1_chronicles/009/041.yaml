  text: 'And the sons of Micah: Pithon, Melech, and Tahrea.'
translation:
  language: id
  text: 'Anak-anak Mikha: Piton, Melekh, dan Tahrea.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן menyatakan keturunan laki-laki dalam rumus silsilah. Konjungsi ו tidak diterjemahkan secara tersendiri karena ayat ini secara alami berfungsi sebagai kelanjutan daftar silsilah dalam bahasa Indonesia.
- source_word: מִיכָה
  choice: Mikha
  rationale: Nama diri ini ditransliterasikan menurut bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: פִּיתוֹן
  choice: Piton
  rationale: Nama diri ditransliterasikan secara langsung ke dalam ejaan Indonesia.
- source_word: וָמֶלֶךְ
  choice: Melekh
  rationale: Nama diri ditransliterasikan dengan “kh” untuk mewakili bunyi konsonan akhir Ibrani כ. Konjungsi prefiksnya dinyatakan melalui susunan daftar bahasa Indonesia.
- source_word: וְתַחְרֵעַ
  choice: dan Tahrea
  rationale: Nama diri ditransliterasikan sebagai “Tahrea”; konjungsi ו diterjemahkan sebagai “dan” sebelum unsur terakhir sesuai susunan daftar yang alami dalam bahasa Indonesia.
