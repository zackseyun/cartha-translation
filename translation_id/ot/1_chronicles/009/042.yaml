  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אָחָז֙ הוֹלִ֣יד אֶת יַעְרָ֔ה וְ/יַעְרָ֗ה הוֹלִ֛יד אֶת עָלֶ֥מֶת וְ/אֶת עַזְמָ֖וֶת וְ/אֶת זִמְרִ֑י וְ/זִמְרִ֖י הוֹלִ֥יד אֶת מוֹצָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/042.yaml
  text: Ahaz fathered Jarah[a], and Jarah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: id
  text: Ahas memperanakkan Yara[a], dan Yara memperanakkan Alemet, Azmawet, dan Zimri. Zimri memperanakkan Moza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Silsilah sejajar dalam 1 Tawarikh 8:36 menyebut "Yehoyada" sebagai ganti "Yara". Naskah-naskah Tawarikh pada ayat ini menyebut "Yara", dan bentuk itu dipertahankan dalam teks utama.
    reason: textual_variant
lexical_decisions:
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Dalam konteks silsilah, bentuk Hifil dari ילד menyatakan bahwa seorang laki-laki menjadi ayah dari keturunannya. "Memperanakkan" ringkas, lazim dalam gaya silsilah Alkitab bahasa Indonesia, dan mempertahankan hubungan genealogis laki-laki.
- source_word: יַעְרָה
  choice: Yara
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani pada ayat ini; huruf י diwakili dengan y dan ע tidak diberi padanan bunyi khusus dalam ejaan Indonesia.
- source_word: עָלֶמֶת
  choice: Alemet
  rationale: Nama diri ditransliterasikan secara wajar ke dalam ejaan Indonesia; ת direpresentasikan sebagai t.
- source_word: עַזְמָוֶת
  choice: Azmawet
  rationale: Nama diri ditransliterasikan ke ejaan Indonesia, dengan ו konsonantal sebagai w dan ת sebagai t.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Nama diri ditransliterasikan langsung dan bentuknya sesuai dengan ejaan Indonesia.
- source_word: מוֹצָא
  choice: Moza
  rationale: Nama diri ditransliterasikan secara langsung; צ direpresentasikan sebagai z sesuai bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: וְ
  choice: dan
  rationale: Konjungsi ini menghubungkan mata rantai silsilah secara aditif. Pada klausa terakhir, hubungan tetap jelas meskipun "dan" tidak diulang agar kalimat Indonesia lebih alami.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Penanda objek langsung dalam bahasa Ibrani tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya tercermin dalam susunan kalimat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Pola berulang "memperanakkan" mempertahankan bentuk silsilah sumber, sedangkan nama-nama ditransliterasikan menurut kebiasaan ejaan Indonesia. Penanda catatan kaki ditempatkan tepat sesudah nama yang memiliki varian tekstual.
