id: 1CH.9.27
reference: 1 Chronicles 9:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/סְבִיב֥וֹת בֵּית הָ/אֱלֹהִ֖ים יָלִ֑ינוּ כִּֽי עֲלֵי/הֶ֣ם מִשְׁמֶ֔רֶת וְ/הֵ֥ם עַל הַ/מַּפְתֵּ֖חַ וְ/לַ/בֹּ֥קֶר לַ/בֹּֽקֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/027.yaml
  text: They spent the night around the house of God[a], because the duty of guarding it was upon them, and they were in charge of opening it morning by morning.
translation:
  language: id
  text: Mereka bermalam di sekeliling rumah Allah karena tugas penjagaan dibebankan kepada mereka. Mereka bertanggung jawab untuk membukanya[a] pagi demi pagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “mereka bertanggung jawab atas kunci.” Bahasa Ibrani dapat menunjuk pada pemeliharaan kunci atau pada tanggung jawab untuk membuka rumah Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְבִיבוֹת
  choice: di sekeliling
  rationale: Bentuk ini menunjuk pada kawasan yang mengitari suatu tempat; “di sekeliling” mempertahankan makna ruang secara wajar dalam bahasa Indonesia.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Terjemahan langsung ungkapan Ibrani ini mempertahankan sebutan sumber, meskipun dalam konteksnya yang dimaksud ialah kompleks Bait Allah.
- source_word: יָלִינוּ
  choice: bermalam
  rationale: Kata kerja ini berarti tinggal atau menginap sepanjang malam; “bermalam” ringkas, alami, dan tidak menyiratkan bahwa mereka hanya tidur.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan mereka bermalam di tempat itu.
- source_word: עֲלֵיהֶם מִשְׁמֶרֶת
  choice: tugas penjagaan dibebankan kepada mereka
  rationale: Ungkapan harfiahnya menyatakan bahwa penjagaan berada “atas mereka”; pilihan ini mempertahankan nuansa tanggung jawab yang dipercayakan atau dibebankan.
- source_word: וְהֵם עַל הַמַּפְתֵּחַ
  choice: mereka bertanggung jawab untuk membukanya
  rationale: Secara harfiah frasa ini berarti “mereka atas kunci.” Dalam konteks tugas para penjaga dan keterangan waktu berikutnya, frasa tersebut kemungkinan menunjuk pada tanggung jawab membuka rumah Allah; makna harfiahnya dicatat dalam catatan kaki.
- source_word: וְלַבֹּקֶר לַבֹּקֶר
  choice: pagi demi pagi
  rationale: Pengulangan kata “pagi” menyatakan tindakan yang berlangsung secara teratur dan berulang; pilihan ini juga mempertahankan irama Ibraninya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang lugas dan bermartabat. Ungkapan “rumah Allah” dipertahankan agar dekat dengan bentuk Ibrani, sedangkan konstruksi mengenai kunci diterjemahkan secara fungsional dan ambiguitas leksikalnya dicatat.
