  source_fidelity: 'Terjemahan secara setia menyampaikan unsur-unsur utama teks Ibrani: mereka bermalam di sekitar rumah Allah, sebab tugas penjagaan berada pada mereka, dan mereka bertanggung jawab atas pembukaan setiap pagi. Catatan kaki dengan tepat mempertahankan ambiguitas מַפְתֵּחַ (“kunci” atau, secara kontekstual, tanggung jawab membuka).'
