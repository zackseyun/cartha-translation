  text: וּ/מוֹצָ֖א הוֹלִ֣יד אֶת בִּנְעָ֑א וּ/רְפָיָ֥ה בְנ֛/וֹ אֶלְעָשָׂ֥ה בְנ֖/וֹ אָצֵ֥ל בְּנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/043.yaml
  text: And Moza fathered Binea[a], and his son was Rephaiah, his son Eleasah, his son Azel.
translation:
  language: id
  text: Moza memperanakkan Binea.[a] Anak Binea ialah Refaya, anak Refaya ialah Elasa, dan anak Elasa ialah Azel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian selanjutnya berbunyi, “dan Refaya anaknya, Elasa anaknya, Azel anaknya.” Nama-nama ayah dinyatakan dalam teks utama agar urutan silsilah jelas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא
  choice: Moza
  rationale: Nama diri ditransliterasikan sesuai bentuk Masoretik dan kebiasaan penamaan Alkitab bahasa Indonesia.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah menyatakan bahwa seseorang menjadi ayah dari keturunannya; 'memperanakkan' ringkas dan sesuai dengan ragam silsilah yang bermartabat.
- source_word: בִּנְעָא
  choice: Binea
  rationale: Nama diri ditransliterasikan dari vokalisasi Masoretik.
- source_word: וּרְפָיָה בְנוֹ
  choice: Anak Binea ialah Refaya
  rationale: Teks Ibrani harfiah berbunyi 'dan Refaya, anaknya'. Nama Binea dijelaskan sebagai anteseden pronomina agar urutan keturunan mudah dipahami tanpa mengubah hubungan silsilah.
- source_word: אֶלְעָשָׂה בְנוֹ
  choice: anak Refaya ialah Elasa
  rationale: Klausa nominal Ibrani diperjelas secara alami dalam bahasa Indonesia, dengan anteseden pronomina dinyatakan untuk menjaga urutan generasi.
- source_word: אָצֵל בְּנוֹ
  choice: anak Elasa ialah Azel
  rationale: Hubungan ayah-anak pada akhir rantai silsilah dinyatakan secara eksplisit dan alami.
