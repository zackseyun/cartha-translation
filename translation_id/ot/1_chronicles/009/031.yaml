base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/031.yaml
  text: And Mattithiah[a], from the Levites, the firstborn of Shallum the Korahite[b], was entrusted with the work of the flat cakes.
translation:
  language: id
  text: Matitya, salah seorang dari orang Lewi, anak sulung Salum, orang Korah itu, dipercaya[a] untuk mengurus pembuatan roti-roti pipih.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan setia mengerjakan tugas pembuatan roti-roti pipih.” Ungkapan Ibrani dapat menggambarkan kesetiaan Matitya dalam menjalankan tugasnya atau tanggung jawab yang dipercayakan kepadanya.'
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini menunjuk pada sejenis roti atau kue yang dipanggang, mungkin dimasak di atas wajan datar.
    reason: cultural_note
lexical_decisions:
- source_word: וּמַתִּתְיָה
  choice: Matitya
  rationale: Nama diri ditransliterasikan ke bentuk Indonesia yang dekat dengan bunyi Ibrani; waw berfungsi melanjutkan daftar dan tidak perlu selalu diterjemahkan secara eksplisit.
- source_word: מִן הַלְוִיִּם
  choice: salah seorang dari orang Lewi
  rationale: Ungkapan מן menyatakan keanggotaan kelompok; bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: הוּא הַבְּכוֹר לְשַׁלֻּם
  choice: anak sulung Salum
  rationale: בכור secara harfiah berarti 'anak sulung' dan di sini menunjukkan hubungan keluarga Matitya dengan Salum.
- source_word: הַקָּרְחִי
  choice: orang Korah itu
  rationale: Sebutan nisbah ini menunjuk kepada anggota atau keturunan kaum Korah; frasa Indonesia mempertahankan identifikasi keluarga tersebut tanpa menambah rincian yang tidak eksplisit.
- source_word: בֶּאֱמוּנָה עַל
  choice: dipercaya untuk mengurus
  rationale: Dalam konteks tugas administratif, frasa ini dapat menyatakan tanggung jawab yang dipercayakan atau pelaksanaan yang setia. Terjemahan utama menyampaikan penugasan yang dipercayakan, sementara ambiguitas dicatat dalam catatan kaki.
- source_word: מַעֲשֵׂה
  choice: pembuatan
  rationale: Dalam konteks pangan, kata umum untuk pekerjaan atau perbuatan ini secara alami menunjuk pada proses membuat atau menyiapkan.
- source_word: הַחֲבִתִּים
  choice: roti-roti pipih
  rationale: Istilah ini menunjuk pada sejenis roti atau kue yang dimasak, mungkin di atas wajan datar. 'Roti-roti pipih' memberi gambaran kuliner yang konkret tanpa memasukkan fungsi persembahan yang tidak dinyatakan dalam ayat.
