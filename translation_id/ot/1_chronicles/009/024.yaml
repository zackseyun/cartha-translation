base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/024.yaml
  text: 'The gatekeepers were at the four directions: east[a], west, north, and south.'
translation:
  language: id
  text: 'Para penjaga gerbang berada di keempat arah mata angin[a]: timur, barat, utara, dan selatan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “ke/untuk keempat angin”; di sini “angin” berarti empat arah atau penjuru.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבַּע רוּחוֹת
  choice: di keempat arah mata angin
  rationale: Preposisi לְ menyatakan penempatan atau persebaran, sedangkan רוּחוֹת secara harfiah berarti ‘angin’ tetapi dalam konteks spasial ini menunjuk pada empat penjuru. Ungkapan ‘arah mata angin’ alami dan jelas dalam bahasa Indonesia.
- source_word: יִהְיוּ
  choice: berada
  rationale: Bentuk verba היה menyatakan keberadaan atau lokasi. ‘Berada’ mempertahankan pernyataan lokasi tanpa menambahkan gagasan eksplisit bahwa mereka ‘ditempatkan’.
- source_word: הַשֹּׁעֲרִים
  choice: para penjaga gerbang
  rationale: Nomina ini menunjuk kepada orang-orang yang bertugas menjaga gerbang. Bentuk ‘para penjaga gerbang’ jelas dan wajar dalam konteks Bait Allah.
- source_word: מִזְרָח
  choice: timur
  rationale: Nama arah mata angin dalam daftar empat penjuru.
- source_word: יָמָּה
  choice: barat
  rationale: Secara harfiah berbentuk ‘ke arah laut’, tetapi dalam geografi Israel dan dalam daftar arah mata angin ini maknanya adalah barat.
- source_word: צָפוֹנָה
  choice: utara
  rationale: Bentuk berarah yang secara idiomatis dinyatakan sebagai ‘utara’ dalam daftar penjuru.
- source_word: וָנֶגְבָּה
  choice: dan selatan
  rationale: Dalam rangkaian empat penjuru, נֶגֶב berfungsi sebagai arah selatan, bukan sebagai nama khusus wilayah Negeb.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. ‘Para penjaga gerbang’ sesuai dengan konteks tugas di Bait Allah, sedangkan ‘berada’ sengaja dipilih agar tidak menambahkan unsur penugasan yang tidak dinyatakan secara eksplisit oleh verba Ibrani.
