  yaml_path: translation/ot/1_chronicles/009/035.yaml
  text: In Gibeon lived Jeiel the father of Gibeon[b][a], and his wife's name was Maacah.
translation:
  language: id
  text: Di Gibeon tinggal Yeiel[a], bapak Gibeon[b], dan nama istrinya ialah Maakha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dieja “Yeuel” menurut bentuk konsonantal Ibrani di ayat ini; bandingkan bagian sejajar dalam 1 Tawarikh 8:29.
    reason: textual_variant
  - marker: b
    text: Atau “pendiri Gibeon” atau “pemimpin Gibeon”; secara harfiah, bahasa Ibrani berbunyi “bapak Gibeon”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/גִבְע֛וֹן
  choice: Di Gibeon
  rationale: Gabungan kata penghubung dan preposisi berarti secara harfiah “dan di Gibeon”. Kata penghubung tidak dinyatakan tersendiri karena pembukaan “Di Gibeon” lebih alami dalam bahasa Indonesia dan tetap mempertahankan keterangan tempat.
- source_word: יָשְׁב֥וּ
  choice: tinggal
  rationale: Kata kerja ישב dalam rumusan silsilah ini menyatakan tempat kediaman. Bahasa Indonesia tidak menandai jumlah pada bentuk verba, sehingga “tinggal” tetap alami tanpa harus memaksakan bentuk jamak Ibrani ke dalam terjemahan.
- source_word: יעואל
  choice: Yeiel
  rationale: “Yeiel” dipilih sebagai bentuk nama yang lazim dan sesuai dengan identifikasi pada bagian sejajar di 1 Tawarikh 8:29; bentuk “Yeuel” dicatat dalam catatan kaki karena ejaan konsonantal di ayat ini.
- source_word: אֲבִֽי גִבְע֖וֹן
  choice: bapak Gibeon
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani secara dekat. Dalam konteks kota atau kaum, “bapak” dapat berarti pendiri, leluhur, atau pemimpin; kemungkinan-kemungkinan itu dijelaskan tanpa menetapkan salah satunya di teks utama.
- source_word: וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ
  choice: Nama istrinya ialah
  rationale: Ungkapan nominal Ibrani secara harfiah berarti “dan nama istrinya”. Bentuk ini alami dalam bahasa Indonesia modern, sedangkan “ialah” melengkapi predikat nominal dengan jelas.
- source_word: מַעֲכָֽה
  choice: Maakha
  rationale: Transliterasi Indonesia yang mempertahankan dua vokal a dan bunyi konsonan akhir nama Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas khas catatan silsilah. Istilah “bapak” dipertahankan untuk transparansi terhadap metafora Ibrani, sementara makna kontekstualnya diterangkan dalam catatan kaki. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
