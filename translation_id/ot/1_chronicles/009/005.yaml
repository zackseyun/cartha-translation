  text: וּ/מִן הַ/שִּׁ֣ילוֹנִ֔י עֲשָׂיָ֥ה הַ/בְּכ֖וֹר וּ/בָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/005.yaml
  text: 'And from the Shilonites: Asaiah the firstborn and his sons[a].'
translation:
  language: id
  text: 'Dari kaum Syilo[a]: Asaya, anak sulung, dan putra-putranya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “kaum Syela”, sesuai dengan identifikasi tradisional lain untuk nama kaum ini.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִן
  choice: Dari
  rationale: Preposisi מִן menyatakan asal kelompok dalam rangkaian daftar. Hubungan tambahan dari ו tetap tersirat secara alami dalam susunan daftar bahasa Indonesia tanpa perlu memulai ayat dengan “Dan”.
- source_word: הַ/שִּׁילוֹנִי
  choice: kaum Syilo
  rationale: Bentuk nisbah tunggal ini berfungsi secara kolektif dalam konteks daftar keluarga. “Kaum Syilo” menyampaikan kelompok yang berasal dari atau terkait dengan Syilo, sambil mempertahankan nama yang tercermin dalam bentuk konsonantal teks.
- source_word: עֲשָׂיָה
  choice: Asaya
  rationale: Nama pribadi ini ditransliterasikan menurut bentuk yang wajar dan lazim dalam bahasa Indonesia.
- source_word: הַ/בְּכ֖וֹר
  choice: anak sulung
  rationale: Istilah בְּכוֹר menunjuk pada status sebagai anak laki-laki yang lahir pertama, bukan sekadar orang yang paling tua.
- source_word: וּ/בָנָֽי/ו
  choice: dan putra-putranya
  rationale: בָּנִים secara khusus berarti anak-anak laki-laki. “Putra-putranya” menjaga ketepatan itu, sedangkan “dan” mempertahankan struktur koordinatif daftar.
