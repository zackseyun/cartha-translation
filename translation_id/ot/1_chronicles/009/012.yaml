id: 1CH.9.12
reference: 1 Chronicles 9:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/עֲדָיָה֙ בֶּן יְרֹחָ֔ם בֶּן פַּשְׁח֖וּר בֶּן מַלְכִּיָּ֑ה וּ/מַעְשַׂ֨י בֶּן עֲדִיאֵ֧ל בֶּן יַחְזֵ֛רָה בֶּן מְשֻׁלָּ֥ם בֶּן מְשִׁלֵּמִ֖ית בֶּן אִמֵּֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/012.yaml
  text: and Adaiah son of Jeroham[a], son of Pashhur, son of Malchijah, and Maasai son of Adiel, son of Jahzerah, son of Meshullam, son of Meshillemith, son of Immer.
translation:
  language: id
  text: dan Adaya, anak Yeroham, anak Pasyhur, anak Malkia, serta Maasai, anak Adiel, anak Yahzera, anak Mesulam, anak Mesilemit[a], anak Imer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani di sini berbunyi “Mesilemit”; bentuk nama yang berkaitan muncul di tempat lain sebagai “Mesilemot”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲדָיָה
  choice: dan Adaya
  rationale: Konjungsi ו melanjutkan daftar dari ayat sebelumnya dan diterjemahkan “dan”; nama diri ditransliterasikan sesuai kelaziman bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rangkaian silsilah, בֶּן secara wajar berarti “anak”. Kata ini kadang dapat menunjuk keturunan yang lebih jauh, tetapi struktur harfiahnya dipertahankan tanpa mempersempit atau memperluas hubungan tersebut.
- source_word: יְרֹחָם
  choice: Yeroham
  rationale: Nama diri ditransliterasikan dengan ejaan yang alami dalam bahasa Indonesia.
- source_word: פַּשְׁחוּר
  choice: Pasyhur
  rationale: Nama diri ditransliterasikan dengan “sy” untuk bunyi שׁ.
- source_word: מַלְכִּיָּה
  choice: Malkia
  rationale: Transliterasi ini mengikuti bentuk Ibrani dan pola nama Alkitab yang lazim dalam bahasa Indonesia.
- source_word: וּמַעְשַׂי
  choice: serta Maasai
  rationale: Konjungsi menambahkan tokoh kedua dalam daftar dan diterjemahkan “serta” agar rangkaian panjang jelas; bentuk nama mengikuti bentuk konsonantal teks ini, bukan nama yang lebih panjang Maaseya.
- source_word: עֲדִיאֵל
  choice: Adiel
  rationale: Nama diri ditransliterasikan secara langsung dan alami dalam bahasa Indonesia.
- source_word: יַחְזֵרָה
  choice: Yahzera
  rationale: Transliterasi mempertahankan konsonan awal י sebagai “Y” dan bunyi ז sebagai “z” sesuai kelaziman bahasa Indonesia.
- source_word: מְשֻׁלָּם
  choice: Mesulam
  rationale: Nama diri ditransliterasikan dalam bentuk yang mudah dibaca dalam bahasa Indonesia.
- source_word: מְשִׁלֵּמִית
  choice: Mesilemit
  rationale: Pilihan ini mengikuti secara langsung bentuk Teks Masoret pada ayat ini; bentuk nama terkait di tempat lain dapat ditransliterasikan Mesilemot.
- source_word: אִמֵּר
  choice: Imer
  rationale: Nama diri ditransliterasikan secara langsung dengan penyederhanaan konsonan rangkap yang wajar dalam ejaan Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Pengulangan “anak” mempertahankan susunan silsilah Ibrani. Tanda koma membantu keterbacaan, sedangkan “serta” membedakan awal garis nama kedua. Penanda catatan kaki ditempatkan tepat sesudah nama yang dijelaskannya.
