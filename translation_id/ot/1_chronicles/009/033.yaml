  text: וְ/אֵ֣לֶּה הַ֠/מְשֹׁרְרִים רָאשֵׁ֨י אָב֧וֹת לַ/לְוִיִּ֛ם בַּ/לְּשָׁכֹ֖ת פטירים כִּֽי יוֹמָ֥ם וָ/לַ֛יְלָה עֲלֵי/הֶ֖ם בַּ/מְּלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/033.yaml
  text: These were the singers[a], heads of fathers’ houses of the Levites, in the chambers, free from other duties, for they were occupied in the work day and night.
translation:
  language: id
  text: Merekalah para penyanyi, para kepala kaum keluarga dari kaum Lewi, yang tinggal di bilik-bilik dan dibebaskan dari tugas-tugas lain,[a] sebab siang dan malam pekerjaan itu menjadi tanggung jawab mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini jarang dipakai dan dapat berarti “dibebaskan”, “dikecualikan”, atau “dilepaskan”; kemungkinan mereka dibebaskan dari tugas-tugas lain karena terus bertanggung jawab atas pelayanan nyanyian.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: para penyanyi
  rationale: Partisipel dari שׁיר menunjuk kepada orang-orang yang bertugas menyanyi; “penyanyi” lebih tepat daripada istilah yang lebih luas seperti “pemusik”.
- source_word: רָאשֵׁי אָבוֹת
  choice: para kepala kaum keluarga
  rationale: Ungkapan ini menunjuk kepada para pemimpin kelompok keluarga leluhur. Pilihan ini mempertahankan struktur sosial-genealogisnya dalam bahasa Indonesia yang wajar.
- source_word: לַלְוִיִּם
  choice: orang Lewi
  rationale: Frasa ini mengidentifikasi para kepala kaum keluarga tersebut sebagai bagian dari orang Lewi.
- source_word: בַּלְּשָׁכֹת
  choice: di bilik-bilik
  rationale: לשכה berarti bilik atau ruangan, lazimnya dalam kompleks ibadah. “Bilik-bilik” mempertahankan latar kelembagaan tanpa menambahkan kata “Bait Allah” yang tidak tersurat.
- source_word: פטירים
  choice: dibebaskan dari tugas-tugas lain
  rationale: Bentuk yang jarang ini kemungkinan berarti bebas, dilepaskan, atau dikecualikan. Konteks menunjukkan pembebasan dari tugas lain karena tanggung jawab mereka berlangsung terus-menerus.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan mereka dibebaskan dari tugas-tugas lain.
- source_word: יוֹמָם וָלַיְלָה
  choice: siang dan malam
  rationale: Padanan langsung yang mempertahankan ungkapan temporal Ibrani tentang tanggung jawab yang terus berlangsung.
- source_word: עֲלֵיהֶם בַּמְּלָאכָה
  choice: pekerjaan itu menjadi tanggung jawab mereka
  rationale: Secara harfiah, pekerjaan itu “atas mereka”; ungkapan Indonesia ini menyampaikan makna kewajiban tanpa mempersempit jenis pekerjaannya.
