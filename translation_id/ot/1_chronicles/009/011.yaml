id: 1CH.9.11
reference: 1 Chronicles 9:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/עֲזַרְיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖יד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/011.yaml
  text: and Azariah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub, chief officer of the house of God.
translation:
  language: id
  text: Dan Azarya bin Hilkia, bin Mesulam, bin Zadok, bin Merayot, bin Ahitub, pemimpin rumah Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: kepala atau penguasa rumah Allah.'
    reason: Menunjukkan beberapa padanan yang mungkin bagi נְגִיד, yang dapat menyatakan pemimpin, kepala, atau penguasa.
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: dan Azarya
  rationale: Konjungsi ו diterjemahkan “dan” karena ayat ini melanjutkan daftar pada ayat sebelumnya; nama pribadi dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶן
  choice: bin
  rationale: Dalam silsilah, בֶן berarti “anak laki-laki dari/putra dari”. Bentuk “bin” ringkas, alami, dan lazim dipakai dalam daftar silsilah Alkitab berbahasa Indonesia; kemungkinan pemampatan generasi tetap tidak ditutup.
- source_word: חִלְקִיָּה
  choice: Hilkia
  rationale: Nama pribadi dialihaksarakan dalam bentuk Indonesia yang lazim.
- source_word: מְשֻׁלָּם
  choice: Mesulam
  rationale: Nama pribadi dialihaksarakan dalam bentuk Indonesia yang lazim.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Nama pribadi dialihaksarakan dalam bentuk Indonesia yang lazim.
- source_word: מְרָיוֹת
  choice: Merayot
  rationale: Nama pribadi dialihaksarakan sedekat mungkin dengan bentuk Ibrani dan sesuai pola ejaan Indonesia.
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Nama pribadi dialihaksarakan dalam bentuk Indonesia yang lazim.
- source_word: נְגִיד
  choice: pemimpin
  rationale: Kata ini menunjuk kepada orang yang ditempatkan sebagai kepala atau penguasa. “Pemimpin” alami dalam bahasa Indonesia dan mempertahankan keluasan maknanya tanpa menentukan jabatan administratif yang tidak dinyatakan secara eksplisit.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Terjemahan ini mempertahankan ungkapan konkret Ibrani. Dalam konteks ini ungkapan tersebut merujuk pada bait Allah, tetapi “rumah Allah” tidak menghilangkan resonansi asli frasa itu.
theological_decisions:
- issue: Makna אֱלֹהִים dalam sebutan tempat ibadah
  choice: Allah
  alternative: allah-allah
  rationale: Dalam konteks tempat ibadah Israel, אֱלֹהִים merujuk kepada Allah Israel, sehingga bentuk tunggal “Allah” diperlukan demi ketepatan.
- issue: Cakupan jabatan נְגִיד
  choice: pemimpin
  alternative: kepala atau penguasa
  rationale: Teks menyatakan kedudukan kepemimpinan atas rumah Allah, tetapi tidak merinci jabatan modern tertentu. Karena itu, terjemahan tidak mempersempitnya menjadi gelar administratif khusus.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pola berulang “bin” dipertahankan untuk menampilkan struktur silsilah secara jelas. Penanda catatan ditempatkan sesudah frasa yang diterangkannya, yaitu “pemimpin rumah Allah”.
