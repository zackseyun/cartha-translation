base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/009.yaml
  text: And their brothers[a], according to their generations, were nine hundred and fifty-six[b]. All these men were heads of fathers’ houses in their fathers’ households.
translation:
  language: id
  text: Saudara-saudara mereka, menurut silsilah mereka, berjumlah 956 orang. Semua laki-laki ini adalah kepala-kepala kaum keluarga berdasarkan garis ayah, menurut kaum keluarga berdasarkan garis ayah mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepala-kepala bapa-bapa menurut rumah bapa-bapa mereka.” Ungkapan ini adalah sebutan silsilah bagi kepala-kepala kelompok keluarga berdasarkan garis ayah.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Saudara-saudara mereka
  rationale: Kata אָח pada dasarnya berarti ‘saudara’, tetapi dalam konteks suku dan silsilah dapat mencakup kerabat atau sesama anggota kaum. Pilihan ini mempertahankan istilah kekerabatan Ibrani tanpa mempersempit maknanya secara berlebihan.
- source_word: לְתֹלְדוֹתָם
  choice: menurut daftar keturunan mereka
  rationale: Dalam konteks Tawarikh, תּוֹלְדוֹת menunjuk pada garis keturunan atau catatan silsilah. ‘Daftar keturunan’ lebih alami dan jelas dalam bahasa Indonesia modern daripada terjemahan harfiah ‘menurut generasi-generasi mereka’.
- source_word: תְּשַׁע מֵאוֹת וַחֲמִשִּׁים וְשִׁשָּׁה
  choice: 956 orang
  rationale: Bilangan kardinal diterjemahkan secara langsung; ‘orang’ ditambahkan secara wajar dalam bahasa Indonesia untuk menjelaskan bahwa angka tersebut menghitung manusia.
- source_word: כָּל אֵלֶּה אֲנָשִׁים
  choice: Semua laki-laki ini
  rationale: אֲנָשִׁים berbentuk maskulin dan dalam konteks ini menunjuk kepada para laki-laki yang tercatat dalam silsilah serta memegang kedudukan sebagai kepala kaum.
- source_word: רָאשֵׁי אָבוֹת
  choice: kepala kaum keluarga
  rationale: Ungkapan ini merupakan sebutan sosial-genealogis bagi para pemimpin kelompok keluarga berdasarkan garis ayah. ‘Kepala kaum keluarga’ mempertahankan unsur kepemimpinan dan struktur kekerabatannya dalam bahasa Indonesia yang alami.
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: dalam keluarga besar leluhur mereka
  rationale: בֵּית אָבוֹת merujuk pada kelompok keluarga atau marga patrilineal yang lebih luas, bukan hanya rumah tangga inti. ‘Keluarga besar leluhur’ menyampaikan cakupan tersebut sekaligus menghindari pengulangan yang kaku.
