base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/013.yaml
  text: And their brothers[a], heads of their fathers’ houses[c][b], were 1,760 mighty men of valor for the work of the service of the house of God.
translation:
  language: id
  text: Saudara-saudara mereka[a], para kepala kaum keluarga leluhur mereka, berjumlah 1.760 orang, yaitu orang-orang perkasa dan cakap[b] untuk melaksanakan tugas pelayanan di rumah Allah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kerabat-kerabat mereka.” Kata Ibrani untuk “saudara” dapat mencakup anggota kaum yang lebih luas, bukan hanya saudara kandung.'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani dapat juga diterjemahkan “orang-orang gagah berani” atau “orang-orang yang mampu.” Dalam konteks ini, ungkapan tersebut menyatakan kekuatan dan kemampuan yang terbukti, tidak harus kecakapan berperang.
    reason: lexical_alternative
  - marker: c
    text: Yang dimaksud ialah Bait Allah.
    reason: clarification
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Bersama saudara-saudara mereka
  rationale: Bentuk jamak אָח dapat menunjuk saudara kandung maupun kerabat satu kaum. 'Saudara-saudara' mempertahankan bahasa kekerabatan sumber, sedangkan 'bersama' secara alami menghubungkan kelompok ini dengan daftar sebelumnya.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: para kepala kaum keluarga leluhur mereka
  rationale: Ungkapan genealogis-administratif ini menunjuk para pemimpin unit keluarga berdasarkan garis leluhur. 'Kaum keluarga leluhur' lebih wajar dalam bahasa Indonesia daripada terjemahan harfiah 'rumah ayah-ayah'.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: 1.760 orang
  rationale: Urutan bilangan Ibrani berjumlah 1.760; penambahan 'orang' memperjelas yang dihitung dan sesuai tata bahasa Indonesia.
- source_word: גִּבּוֹרֵי חֵיל
  choice: orang-orang perkasa dan cakap
  rationale: Ungkapan kehormatan ini dapat menyatakan kekuatan, keberanian, kemampuan, atau kecakapan. Karena konteksnya pelayanan rumah Allah, pilihan ini mempertahankan unsur keperkasaan tanpa membatasinya pada peperangan.
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: melaksanakan tugas pelayanan
  rationale: Kedua nomina, 'pekerjaan/tugas' dan 'pelayanan', dipertahankan secara alami sebagai 'tugas pelayanan', tanpa menghasilkan pengulangan kaku.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani secara langsung; dalam konteks ini yang dimaksud ialah Bait Allah.
theological_decisions:
- issue: Cakupan istilah kekerabatan maskulin
  choice: saudara-saudara
  alternative: kerabat-kerabat
  rationale: Teks memakai istilah kekerabatan maskulin yang dapat mencakup hubungan kaum lebih luas. Terjemahan utama mempertahankan citra kekeluargaan, sementara catatan menjaga keluasan maknanya.
- issue: Nuansa גִּבּוֹרֵי חֵיל dalam konteks nonmiliter
  choice: orang-orang perkasa dan cakap
  alternative: para pahlawan yang gagah berani
  rationale: Konteksnya adalah tugas pelayanan di rumah Allah, bukan pertempuran. Terjemahan tidak menghapus kekuatan ungkapan, tetapi juga tidak memaksakan arti militer.
- issue: Sebutan tempat ibadah
  choice: rumah Allah
  alternative: Bait Allah
  rationale: Pilihan utama mengikuti bentuk sumber dan mempertahankan metafora 'rumah'; catatan menjelaskan rujukannya tanpa mengganti ungkapan asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan istilah kekerabatan, struktur kepemimpinan leluhur, dua unsur dalam 'tugas pelayanan', dan metafora 'rumah Allah'.
