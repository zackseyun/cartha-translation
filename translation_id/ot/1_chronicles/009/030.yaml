source:
  edition: WLC
  text: וּ/מִן בְּנֵי֙ הַ/כֹּ֣הֲנִ֔ים רֹקְחֵ֥י הַ/מִּרְקַ֖חַת לַ/בְּשָׂמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/030.yaml
  text: And some of the sons of the priests were compounders of the ointment of spices[a].
translation:
  language: id
  text: Dan sebagian dari keturunan para imam adalah peracik ramuan rempah-rempah[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “peracik campuran wangi untuk bahan-bahan aromatik.”'
    reason: Bahasa Ibrani dapat dipahami sebagai campuran atau sediaan beraroma yang berkaitan dengan bahan-bahan aromatik; fungsi preposisi dan jenis tepat racikannya tidak sepenuhnya pasti.
lexical_decisions:
- source_word: וּמִן
  choice: Dan sebagian dari
  rationale: Gabungan konjungsi dan preposisi ini secara harfiah berarti ‘dan dari’; dalam konteks daftar, ‘dan sebagian dari’ menyampaikan makna partitifnya dengan wajar.
- source_word: בְּנֵי הַכֹּהֲנִים
  choice: keturunan para imam
  rationale: Ungkapan Ibrani harfiah ‘anak-anak para imam’ menunjuk pada anggota keluarga-keluarga imam. ‘Keturunan para imam’ mempertahankan nuansa silsilah tanpa menyiratkan bahwa mereka semua anak langsung.
- source_word: רֹקְחֵי
  choice: peracik
  rationale: Partisip ini menunjuk kepada orang-orang yang meramu atau mencampur suatu sediaan. ‘Peracik’ tepat, alami, dan tidak membatasi mereka pada profesi pembuat parfum.
- source_word: הַמִּרְקַחַת
  choice: ramuan
  rationale: Nomina ini berarti sediaan atau campuran yang diracik, khususnya sediaan beraroma. ‘Ramuan’ cukup luas untuk tidak menentukan bentuknya sebagai minyak atau salep.
- source_word: לַבְּשָׂמִים
  choice: rempah-rempah
  rationale: Kata ini merujuk pada bahan-bahan aromatik atau rempah-rempah. Dalam konteks ini, frasa Indonesia ‘ramuan rempah-rempah’ secara alami menyatakan hubungan bahan atau kandungan, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. ‘Keturunan’ mempertahankan konteks keluarga imam, sedangkan ‘peracik ramuan’ terdengar alami bagi pembaca masa kini tanpa memakai istilah teknis atau kuno.
