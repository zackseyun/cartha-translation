  yaml_path: translation/ot/1_chronicles/006/014.yaml
  text: 'The sons of Merari: Mahli[a], Libni his son, Shimei his son, Uzzah his son.'
translation:
  language: id
  text: 'Anak-anak Merari: Mahli[a], Libni anaknya, Simei anaknya, Uza anaknya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dalam arti yang lebih luas menurut gaya silsilah, “keturunan Merari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן yang memperkenalkan silsilah. 'Anak-anak' merupakan padanan langsung; dalam gaya silsilah istilah ini dapat pula mencakup keturunan.
- source_word: מְרָרִי
  choice: Merari
  rationale: Nama diri, ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מַחְלִי
  choice: Mahli
  rationale: Nama diri, ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: לִבְנִי
  choice: Libni
  rationale: Nama diri, ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בְנוֹ
  choice: anaknya
  rationale: Kata benda dengan sufiks orang ketiga tunggal maskulin menunjukkan hubungan ayah-anak. Pengulangan 'anaknya' mempertahankan rantai silsilah yang eksplisit dalam teks Ibrani.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Nama diri, ditransliterasikan dalam bentuk yang lazim dan mudah dikenali pembaca Indonesia.
- source_word: עֻזָּה
  choice: Uza
  rationale: Nama diri, ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
