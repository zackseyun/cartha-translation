translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Pengulangan frasa dipertahankan karena mencerminkan susunan daftar dalam teks Ibrani; 'beserta' dipakai agar hubungan setiap kota dengan tanahnya jelas.
