  text: Ramoth with its pasturelands[a], and Anem with its pasturelands.
translation:
  language: id
  text: Ramot beserta tanah penggembalaannya, dan Anem[a] beserta tanah penggembalaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “Anem”; daftar sejajar dalam Yosua 21:25 menyebut “Aner.”
    reason: alternative_reading
lexical_decisions:
- source_word: רָאמוֹת
  choice: Ramot
  rationale: Nama tempat ditransliterasikan sesuai bentuk Ibrani dan kebiasaan ejaan bahasa Indonesia, tanpa akhiran -h konvensional dalam transliterasi Inggris.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah penggembalaan di sekelilingnya
  rationale: מִגְרָשׁ menunjuk pada tanah terbuka milik sebuah kota, terutama untuk penggembalaan. Ungkapan ini menyampaikan fungsi sekaligus letaknya dengan jelas dalam bahasa Indonesia modern; akhiran feminin tunggal diterjemahkan sebagai -nya dan mengacu pada masing-masing kota.
- source_word: עָנֵם
  choice: Anem
  rationale: Nama tempat ditransliterasikan dari bacaan Teks Masoret עָנֵם. Perbedaan dengan nama dalam daftar sejajar dipertahankan dalam catatan kaki, bukan diselaraskan di dalam teks.
- source_word: וְאֶת
  choice: dan
  rationale: אֶת adalah penanda objek langsung dan tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia, sedangkan וְ dinyatakan dengan 'dan' untuk menyusun daftar.
