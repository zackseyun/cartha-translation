  text: 'And the sons of Elkanah: Amasai and Ahimoth[a].'
translation:
  language: id
  text: Anak-anak Elkana ialah Amasai dan Ahimot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Anak-anak ... ialah
  rationale: בְנֵי adalah bentuk jamak konstruktus yang berarti “anak-anak dari”; dalam konteks daftar silsilah, kopula “ialah” membuat susunan ini alami dalam bahasa Indonesia. Konjungsi ו tidak diterjemahkan secara tersendiri karena awal dengan “Dan anak-anak ...” terasa kaku, sedangkan kesinambungan silsilah tetap jelas dari konteks.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Nama diri Ibrani ditransliterasikan dalam bentuk yang lazim dan alami dalam bahasa Indonesia.
- source_word: עֲמָשַׂי
  choice: Amasai
  rationale: Nama diri ditransliterasikan secara langsung dari bentuk Ibrani ʿĂmāśay, dengan ejaan Indonesia yang lazim.
- source_word: וַ/אֲחִימוֹת
  choice: dan Ahimot
  rationale: Konjungsi prefiks diterjemahkan “dan”; nama diri ditransliterasikan sebagai “Ahimot”, sesuai pengucapan dan ejaan Indonesia tanpa mempertahankan th bahasa Inggris.
