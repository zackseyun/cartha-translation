base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/007.yaml
  text: 'The sons of Kohath: Amminadab his son[a], Korah his son, Assir his son.'
translation:
  language: id
  text: 'Anak-anak Kehat: Aminadab, anaknya[a]; Korah, anaknya; Asir, anaknya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa silsilah sejajar menyebut Izhar sebagai leluhur yang bersesuaian, bukan Aminadab; teks Ibrani di sini berbunyi “Aminadab”.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruksi dari בֵּן membuka daftar silsilah. Padanan ini mempertahankan rumusan hubungan anak secara langsung, selaras dengan pengulangan בְּנוֹ.
- source_word: קְהָת
  choice: Kehat
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: עַמִּינָדָב
  choice: Aminadab
  rationale: Nama diri ditransliterasikan sesuai kelaziman bahasa Indonesia. Teks Ibrani pada ayat ini menyebut Aminadab, meskipun silsilah sejajar menyebut Izhar.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Nomina tunggal dengan akhiran orang ketiga maskulin menyatakan hubungan filial. 'Anaknya' mempertahankan bentuk Ibrani tanpa memperluasnya menjadi 'keturunannya'.
- source_word: קֹרַח
  choice: Korah
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אַסִּיר
  choice: Asir
  rationale: Nama diri ditransliterasikan menurut kelaziman bahasa Indonesia; di sini kata tersebut berfungsi sebagai nama diri, bukan diterjemahkan berdasarkan kemungkinan makna leksikalnya.
