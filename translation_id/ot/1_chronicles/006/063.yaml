base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/063.yaml
  text: 'And beyond the Jordan at Jericho[a], east of the Jordan, from the tribe of Reuben: Bezer in the wilderness, with its pasturelands, and Jahzah, with its pasturelands.'
translation:
  language: id
  text: 'Dan di seberang Sungai Yordan, dekat Yerikho, di sebelah timur Sungai Yordan, dari suku Ruben: Bezer di padang gurun beserta tanah penggembalaannya, dan Yahza[a] beserta tanah penggembalaannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dapat ditulis “Yahas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר
  choice: Dan di seberang
  rationale: Gabungan kata depan ini melanjutkan daftar pembagian wilayah dan menunjukkan kawasan di sisi lain Sungai Yordan.
- source_word: לְיַרְדֵּן יְרֵחוֹ
  choice: Sungai Yordan, dekat Yerikho
  rationale: Nama Yerikho berfungsi menunjukkan lokasi bagian Sungai Yordan yang dimaksud. Kata 'dekat' menyampaikan hubungan geografis itu secara alami tanpa menganggap kota tersebut berada tepat di sungai.
- source_word: לְמִזְרַח הַיַּרְדֵּן
  choice: di sebelah timur Sungai Yordan
  rationale: Terjemahan ini menyampaikan arah geografis מִזְרָח dengan jelas dan wajar dalam bahasa Indonesia.
- source_word: מִמַּטֵּה רְאוּבֵן
  choice: dari suku Ruben
  rationale: Dalam konteks pembagian wilayah Israel, מַטֶּה berarti suku, bukan tongkat atau kelompok keluarga.
- source_word: בֶּצֶר
  choice: Bezer
  rationale: Nama tempat ini ditransliterasikan langsung ke bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בַּמִּדְבָּר
  choice: di padang gurun
  rationale: מִדְבָּר menunjuk kawasan liar atau gersang; 'padang gurun' merupakan padanan Indonesia yang lazim dalam konteks geografis ini.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah penggembalaannya
  rationale: Dalam daftar kota orang Lewi, מִגְרָשׁ menunjuk tanah terbuka milik kota yang digunakan antara lain untuk ternak. Bentuk kolektif Indonesia ini alami dan tetap tepat.
- source_word: יַהְצָה
  choice: Yahza
  rationale: Bentuk ini mengikuti konsonan dan vokalisasi nama tempat dalam teks Ibrani serta sesuai dengan pola transliterasi Indonesia.
