  yaml_path: translation/ot/1_chronicles/006/059.yaml
  text: 'and from the tribe of Asher: Mashal with its pasturelands[a], and Abdon with its pasturelands.'
translation:
  language: id
  text: 'dan dari suku Asyer: Masal dengan tanah penggembalaannya[a], dan Abdon dengan tanah penggembalaannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Di sini nama itu mengikuti bentuk dalam kitab Tawarikh, yaitu Masal; daftar sejajarnya dalam Yosua 21:30 menyebutnya Misal.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: dan dari suku
  rationale: Dalam konteks pembagian kota menurut wilayah Israel, מַטֶּה berarti 'suku'; prefiks penghubung dan preposisi diterjemahkan sebagai 'dan dari'.
- source_word: אָשֵׁר
  choice: Asyer
  rationale: Nama suku ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: אֶת מָשָׁל
  choice: Masal
  rationale: Penanda objek langsung אֶת tidak perlu dinyatakan. Nama tempat mengikuti bentuk teks Tawarikh, מָשָׁל; perbedaan dengan bentuk dalam Yosua 21:30 dicatat dalam catatan kaki.
- source_word: מִגְרָשֶׁיהָ
  choice: padang-padangnya
  rationale: מִגְרָשׁ menunjuk pada lahan terbuka di sekitar kota, khususnya yang digunakan sebagai padang penggembalaan dalam daftar kota orang Lewi. Bentuk berulang menyampaikan jamak, sedangkan sufiks feminin merujuk kepada kota tersebut.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Nama tempat ditransliterasikan secara langsung dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Frasa 'beserta padang-padangnya' dipilih agar hubungan setiap kota dengan lahan terbuka miliknya terbaca alami; nama Asyer, Masal, dan Misal disesuaikan dengan ejaan Indonesia.
