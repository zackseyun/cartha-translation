lexical_decisions:
- source_word: עָשָׁן
  choice: Asan
  rationale: Nama tempat ini ditransliterasikan dari bentuk Teks Masoret, עָשָׁן, dengan ejaan yang wajar dalam bahasa Indonesia.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah-tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada lahan terbuka atau padang penggembalaan milik sebuah kota; bentuk jamak dan sufiks kepemilikannya dipertahankan secara alami dalam bahasa Indonesia.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bet-Semes
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan; bentuk Bet-Semes mengikuti pelafalan unsur-unsur Ibrani dan konvensi ejaan Indonesia.
- source_word: וְאֶת
  choice: dan
  rationale: Penanda objek אֶת tidak memiliki padanan langsung dalam bahasa Indonesia, sedangkan konjungsi וְ diterjemahkan untuk mempertahankan susunan daftar.
