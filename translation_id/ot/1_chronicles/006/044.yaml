translation:
  language: id
  text: Asan beserta tanah penggembalaannya[a], dan Bet-Semes beserta tanah penggembalaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa saksi teks paralel dan terjemahan mencantumkan “Ain” sebagai ganti “Asan” di sini; Teks Masoret dalam kitab Tawarikh berbunyi “Asan”.
