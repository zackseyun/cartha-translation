  text: But the fields of the city and its pasturelands they gave to Caleb son of Jephunneh[a].
translation:
  language: id
  text: Namun, ladang-ladang kota itu dan desa-desanya[a] mereka berikan kepada Kaleb anak Yefune.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “permukiman-permukimannya”. Dalam konteks pembagian tanah, kata Ibrani ini juga dapat dipahami sebagai kawasan terbuka atau lahan yang terkait dengan kota itu, bukan halaman di dalam kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: tanah ladang kota itu
  rationale: שָׂדֶה menunjuk pada ladang, tanah terbuka, atau lahan pertanian. Bentuk kolektif dalam konstruksi ini paling wajar diterjemahkan sebagai tanah ladang yang terkait dengan kota tersebut.
- source_word: חֲצֵרֶיהָ
  choice: tanah penggembalaannya
  rationale: Dalam konteks pembagian kota, חָצֵר dapat menunjuk pada permukiman bawahan atau tanah terbuka yang terkait dengan kota. 'Tanah penggembalaan' menyampaikan fungsi lahan di sekitar kota, sementara alternatif leksikalnya dipertahankan dalam catatan kaki.
- source_word: נָתְנוּ
  choice: mereka berikan
  rationale: Bentuk Qal perfektum dari נתן berarti 'memberikan'. Pilihan ini mempertahankan makna verbal yang sederhana tanpa menambahkan gagasan penetapan administratif.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: kepada Kaleb bin Yefune
  rationale: Preposisi לְ menandai penerima. Nama-nama ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: וְאֶת ... וְאֶת
  choice: Namun, ... dan ...
  rationale: Waw pertama menghubungkan ayat ini dengan ayat sebelumnya sekaligus menandai kontras antara kota yang diberikan kepada para imam dan lahan terkait yang diberikan kepada Kaleb. 'Namun' mengungkapkan hubungan wacana itu secara alami.
