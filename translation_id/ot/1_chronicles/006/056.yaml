base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/056.yaml
  text: 'To the sons of Gershom[a], from the clan of the half-tribe of Manasseh: Golan in Bashan with its pasturelands, and Ashtaroth with its pasturelands.'
translation:
  language: id
  text: 'Kepada keturunan Gerson, dari kaum setengah suku Manasye: Golan di Basan beserta padang penggembalaannya[a], dan Asytarot beserta padang penggembalaannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah terbukanya”; kata Ibrani ini menunjuk pada tanah milik sebuah kota yang terletak di sekelilingnya dan sering digunakan untuk menggembalakan ternak.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גֵּרְשׁוֹם
  choice: Kepada keturunan Gersom
  rationale: Awalan ל menandai pihak penerima dalam pembagian kota. Ungkapan harfiah 'anak-anak Gersom' merupakan idiom silsilah yang di sini mencakup keturunannya; 'keturunan Gersom' lebih wajar dan tidak menimbulkan kesan bahwa yang dimaksud hanya anak kandung.
- source_word: מִמִּשְׁפַּחַת
  choice: dari kaum yang termasuk
  rationale: Dalam konteks pembagian wilayah, מִשְׁפָּחָה menunjuk pada kelompok kekerabatan di dalam suku. 'Kaum' mempertahankan tingkat sosial tersebut, sedangkan 'yang termasuk' memperjelas hubungan konstruksi dalam bahasa Indonesia.
- source_word: חֲצִי מַטֵּה מְנַשֶּׁה
  choice: setengah suku Manasye
  rationale: Ungkapan ini menunjuk pada bagian suku Manasye yang memiliki wilayah tersendiri; bentuk ini ringkas dan lazim dalam bahasa Indonesia Alkitabiah.
- source_word: אֶת גּוֹלָן בַּבָּשָׁן
  choice: Golan di Basan
  rationale: Golan adalah nama kota dan Basan nama wilayah; preposisi בּ diterjemahkan secara alami sebagai 'di'.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada tanah terbuka milik kota Lewi di sekelilingnya, yang antara lain digunakan untuk menggembalakan ternak. Pilihan ini menyampaikan fungsi konkret utamanya, sementara cakupan yang lebih luas dicatat dalam catatan kaki.
- source_word: עַשְׁתָּרוֹת
  choice: Asytarot
  rationale: Transliterasi ini menyesuaikan bunyi nama Ibrani dengan ejaan Indonesia yang lazim, termasuk שׁ sebagai 'sy' dan ת tanpa pengerasan sebagai 't'.
- source_word: וְאֶת ... וְאֶת
  choice: dan ... beserta
  rationale: Rangkaian penanda objek menyebut setiap kota bersama tanah di sekelilingnya. 'Beserta' mengungkapkan hubungan kota dan tanahnya secara alami tanpa mengubah unsur daftar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda titik dua mempertahankan bentuk daftar eliptis dalam teks Ibrani tanpa menyisipkan kata kerja seperti 'diberikan' yang tidak muncul dalam ayat ini. Istilah 'keturunan' dipilih untuk membuat idiom silsilah jelas bagi pembaca umum.
