  source_fidelity: Struktur penerima alokasi dan daftar dua kota dipertahankan dengan tepat. אולם, nama Gershom sebaiknya mengikuti bentuk Indonesia baku yang telah mapan, “Gerson,” bukan “Gersom.”
  naturalness: “Dari kaum yang termasuk setengah suku Manasye” dapat dipahami, tetapi “dari kaum setengah suku Manasye” lebih langsung dan alami. “Tanah penggembalaannya” kurang idiomatis; “padang penggembalaannya” lebih lazim untuk מִגְרָשׁ dalam konteks ini.
  terminology: “Setengah suku Manasye,” “Golan di Basan,” dan “Asytarot” sesuai. “Keturunan Gerson” menyampaikan idiom silsilah tanpa membatasinya pada anak kandung.
  issues:
