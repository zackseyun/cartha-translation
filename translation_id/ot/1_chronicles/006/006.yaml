lexical_decisions:
- source_word: יוֹאָח
  choice: Yoah
  rationale: Nama diri ditransliterasikan sesuai bunyi Ibrani dan bentuk yang lazim dalam bahasa Indonesia.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Dalam susunan silsilah ini, בֵּן dengan akhiran orang ketiga tunggal maskulin paling wajar berarti “anaknya”. Walaupun silsilah kadang melompati generasi, nilai leksikal langsungnya tetap dipertahankan.
- source_word: עִדּוֹ
  choice: Ido
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia secara langsung.
- source_word: זֶרַח
  choice: Zerah
  rationale: Nama diri ditransliterasikan dengan bentuk Indonesia yang lazim.
- source_word: יְאָתְרַי
  choice: Yeaterai
  rationale: Transliterasi ini mencerminkan bentuk vokal teks Masoret; “Yeterai” dicatat sebagai bentuk alternatif yang lebih ringkas.
