translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Tanda titik dua mempertahankan bentuk daftar nominal teks Ibrani. Nama-nama memakai bentuk yang alami bagi pembaca Indonesia sambil tetap sedekat mungkin dengan bentuk Ibrani pada ayat ini.
