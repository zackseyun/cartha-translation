  text: בְּנֵ֖י לֵוִ֑י גֵּרְשֹׁ֕ם קְהָ֖ת וּ/מְרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/001.yaml
  text: 'The sons of Levi: Gershom[a], Kohath[b], and Merari.'
translation:
  language: id
  text: 'Putra-putra Lewi[a]: Gersom[b], Kehat, dan Merari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam silsilah Ibrani, kata yang diterjemahkan “putra-putra” kadang-kadang dapat mencakup keturunan yang lebih jauh. Namun, dalam ayat ini yang dimaksud adalah putra-putra langsung Lewi.
    reason: cultural_note
  - marker: b
    text: Teks Ibrani di sini berbunyi “Gersom”; dalam sejumlah tradisi, nama ini juga ditulis “Gerson”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: anak-anak lelaki
  rationale: Bentuk jamak konstruktif dari בֵּן. Ungkapan ini menunjuk kepada putra-putra Lewi; dalam konteks ini yang disebut adalah ketiga putra langsungnya.
- source_word: לֵוִי
  choice: Lewi
  rationale: Nama diri yang ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: גֵּרְשֹׁם
  choice: Gersom
  rationale: Transliterasi ini mempertahankan konsonan akhir mem (ם) dalam bentuk Ibrani pada ayat ini. Bentuk “Gerson” dikenal dalam tradisi Indonesia, tetapi kurang langsung mencerminkan bentuk teks sumber di sini.
- source_word: קְהָת
  choice: Kehat
  rationale: Bentuk nama yang lazim dan mudah dikenali dalam bahasa Indonesia, serta cukup dekat dengan nama Ibraninya.
- source_word: וּ/מְרָרִי
  choice: dan Merari
  rationale: Konjungsi וּ diterjemahkan “dan”, diikuti transliterasi nama diri מְרָרִי sebagai “Merari”.
