  text: Buki, anaknya; Uzi, anaknya; Zerahya, anaknya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֻּקִּי
  choice: Buki
  rationale: Nama diri ditransliterasikan sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia; konsonan rangkap Ibrani tidak perlu dipertahankan dalam ejaan Indonesia.
- source_word: בְנ/וֹ
  choice: anaknya
  rationale: בְּנוֹ secara harfiah berarti ‘anak laki-lakinya’; dalam daftar silsilah ini, ‘anaknya’ merupakan ungkapan Indonesia yang alami dan tetap mempertahankan hubungan keturunan langsung yang dinyatakan teks.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Nama diri ditransliterasikan secara wajar ke dalam ejaan Indonesia.
- source_word: זְרַחְיָה
  choice: Zerahya
  rationale: Nama teoforis Ibrani ditransliterasikan secara ringkas dan wajar dalam bahasa Indonesia, dengan unsur akhir -ya yang mencerminkan bentuk יה.
