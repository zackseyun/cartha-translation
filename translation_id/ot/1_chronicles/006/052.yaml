base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/052.yaml
  text: 'They gave them the cities of refuge: Shechem with its pasturelands in the hill country of Ephraim[a], and Gezer with its pasturelands.'
translation:
  language: id
  text: Mereka memberikan kepada mereka kota-kota perlindungan, yaitu Sikhem beserta tanah penggembalaannya di daerah pegunungan Efraim,[a] dan Gezer beserta tanah penggembalaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih harfiah, “kota-kota perlindungan: Sikhem beserta tanah penggembalaannya di daerah pegunungan Efraim, dan Gezer beserta tanah penggembalaannya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Mereka memberikan
  rationale: Bentuk wayyiqtol dari נתן menyatakan tindakan berikutnya dalam narasi. Konjungsi waw tidak perlu diterjemahkan secara tersurat agar kalimat Indonesia mengalir alami.
- source_word: לָהֶם
  choice: kepada mereka
  rationale: Pronomina ini menunjuk kepada para penerima yang disebut dalam konteks sebelumnya dan dipertahankan secara eksplisit.
- source_word: עָרֵי הַמִּקְלָט
  choice: kota-kota perlindungan
  rationale: Ini adalah istilah teknis bagi kota-kota yang ditetapkan sebagai tempat perlindungan; pilihan ini jelas dan lazim dalam bahasa Indonesia.
- source_word: שְׁכֶם
  choice: Sikhem
  rationale: Nama tempat ditransliterasikan dalam bentuk yang sudah lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada tanah terbuka di sekitar kota, khususnya yang digunakan untuk ternak. Bentuk tunggal kolektif terdengar alami dalam bahasa Indonesia.
- source_word: בְּהַר אֶפְרָיִם
  choice: di daerah pegunungan Efraim
  rationale: Ungkapan ini menunjuk pada kawasan perbukitan atau dataran tinggi Efraim, bukan satu gunung tertentu.
- source_word: גֶּזֶר
  choice: Gezer
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim.
- source_word: וְאֶת ... וְאֶת
  choice: dan ... beserta
  rationale: Rangkaian konjungsi dan penanda objek Ibrani disajikan dengan susunan Indonesia yang alami, sambil tetap mengaitkan setiap kota dengan tanah penggembalaannya.
theological_decisions:
- issue: Hubungan sintaksis antara 'kota-kota perlindungan' dan daftar Sikhem serta Gezer
  choice: Menggunakan 'yaitu' untuk menyajikan nama-nama berikut sebagai penjelasan bagi frasa sebelumnya, sesuai pembacaan yang paling langsung dalam konteks daftar.
  alternative: 'Mempertahankan susunan formal tanpa kata penjelas: ''kota-kota perlindungan: Sikhem ... dan Gezer ...''.'
  rationale: Teks Ibrani berbentuk daftar dengan אֶת yang berulang dan tidak memakai kata yang secara eksplisit berarti 'yaitu'. Terjemahan utama dibuat alami, sedangkan catatan kaki mempertahankan bentuk formal dan tidak menyembunyikan ketegangan bahwa Gezer ikut berada di bawah tajuk 'kota-kota perlindungan' dalam susunan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah teknis dipertahankan secara jelas, sementara struktur daftar dibuat mudah dipahami. Semua nama tempat mengikuti bentuk Indonesia yang lazim.
