  text: and Aijalon with its pasturelands[a], and Gath-rimmon with its pasturelands.
translation:
  language: id
  text: dan Ayalon dengan tanah penggembalaannya[a], dan Gat-Rimon dengan tanah penggembalaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah bersama” atau “lahan terbuka di sekeliling kota”. Istilah Ibrani ini menunjuk pada lahan terbuka yang menjadi milik sebuah kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּלוֹן
  choice: Ayalon
  rationale: Nama tempat ditransliterasikan langsung dari bentuk Ibrani; ejaan Ayalon secara wajar mencerminkan אַיָּלוֹן dalam bahasa Indonesia.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah-tanah penggembalaannya
  rationale: Istilah ini menunjuk pada lahan terbuka milik kota, terutama untuk penggembalaan; bentuk jamak mempertahankan bentuk Ibrani dan cocok dalam konteks daftar kota orang Lewi.
- source_word: גַּת רִמּוֹן
  choice: Gat-Rimon
  rationale: Nama tempat majemuk ditransliterasikan; tanda hubung memperjelas bahwa unsur-unsurnya membentuk satu nama tempat.
- source_word: וְאֶת
  choice: serta / dan
  rationale: Partikel objek tidak perlu diterjemahkan tersendiri, sedangkan waw penghubung diwujudkan sebagai penghubung alami dalam daftar. 'Serta' mengaitkan ayat ini dengan daftar yang mendahuluinya, lalu 'dan' menghubungkan unsur berikutnya.
