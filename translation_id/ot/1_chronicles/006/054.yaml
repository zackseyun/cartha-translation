translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Ayat ini merupakan kelanjutan daftar dari konteks sebelumnya; karena itu dibuka dengan 'serta'. Pengulangan frasa Ibrani dipertahankan demi kesejajaran.
