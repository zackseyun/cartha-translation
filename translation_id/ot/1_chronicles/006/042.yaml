  text: וְ/לִ/בְנֵ֣י אַהֲרֹ֗ן נָתְנוּ֙ אֶת עָרֵ֣י הַ/מִּקְלָ֔ט אֶת חֶבְר֥וֹן וְ/אֶת לִבְנָ֖ה וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת יַתִּ֥ר וְ/אֶֽת אֶשְׁתְּמֹ֖עַ וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/042.yaml
  text: 'And to the sons of Aaron they gave the cities of refuge: Hebron[a], and Libnah with its pasturelands, and Jattir, and Eshtemoa with its pasturelands.'
translation:
  language: id
  text: 'Kepada keturunan Harun mereka memberikan kota-kota perlindungan: Hebron, Libna beserta tanah lapangnya[a], Yatir, dan Estemoa beserta tanah lapangnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tanah penggembalaan"; kata Ibrani ini menunjuk pada tanah terbuka yang menjadi milik sebuah kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן
  choice: Kepada keturunan Harun
  rationale: Preposisi ל menandai penerima. Dalam konteks suku dan silsilah, בְּנֵי secara alami mencakup garis keturunan Harun, sehingga “keturunan” lebih jelas dalam bahasa Indonesia modern daripada “anak-anak” tanpa mengubah rujukannya.
- source_word: נָתְנוּ
  choice: mereka memberikan
  rationale: Bentuk jamak ini secara langsung berarti “mereka memberikan”; subjeknya dibiarkan tersirat sebagaimana dalam sumber dan konteks ayat-ayat sebelumnya.
- source_word: עָרֵי הַמִּקְלָט
  choice: kota-kota perlindungan
  rationale: Ungkapan ini adalah istilah hukum bagi kota-kota yang ditetapkan sebagai tempat berlindung; pilihan ini jelas, alami, dan mempertahankan bentuk jamak sumber.
- source_word: חֶבְרוֹן ... לִבְנָה ... יַתִּר ... אֶשְׁתְּמֹעַ
  choice: Hebron ... Libna ... Yatir ... Estemoa
  rationale: Nama-nama tempat dialihaksarakan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: מִגְרָשֶׁיהָ
  choice: dengan tanah lapangnya
  rationale: מִגְרָשׁ menunjuk pada tanah terbuka milik sebuah kota, yang dapat dipakai antara lain untuk penggembalaan. “Tanah lapang” mempertahankan keluasan makna tanpa membatasinya hanya pada padang rumput; akhiran feminin tunggal merujuk pada kota yang langsung mendahuluinya.
theological_decisions:
- issue: Apakah semua kota dalam daftar ini disebut kota perlindungan
  choice: Mempertahankan susunan gramatikal Ibrani yang memperkenalkan seluruh daftar sesudah frasa “kota-kota perlindungan”.
  alternative: Menafsirkan hanya Hebron sebagai kota perlindungan dan kota-kota berikutnya sebagai kota biasa.
  rationale: Teks ayat ini sendiri tidak memberi penanda sintaksis eksplisit untuk memisahkan Hebron dari daftar sesudahnya. Terjemahan tidak menyisipkan penjelasan yang menyelesaikan ketegangan dengan daftar paralel atau ketentuan Taurat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Tanda koma dipakai untuk memperjelas bahwa Hebron, Libna, Yatir, dan Estemoa merupakan unsur-unsur terpisah dalam daftar; frasa “dengan tanah lapangnya” hanya mengikuti Libna dan Estemoa sesuai teks Ibrani.
