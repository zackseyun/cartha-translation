  text: 'To Gershom: Libni his son, Jahath his son, Zimmah his son.'
translation:
  language: id
  text: 'Keturunan Gersom: Libni, anaknya; Yahat, anaknya; Zima, anaknya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹם
  choice: Keturunan Gersom
  rationale: Prefiks לְ memperkenalkan garis keturunan Gersom. Dalam bahasa Indonesia, “Keturunan Gersom” menandai fungsi judul silsilah secara alami tanpa memaksakan arti datif yang kaku.
- source_word: לִבְנִי
  choice: Libni
  rationale: Nama diri ditransliterasikan ke dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בְנוֹ
  choice: anaknya
  rationale: Nomina בֵּן dengan sufiks orang ketiga tunggal maskulin menunjukkan hubungan ayah-anak dalam silsilah; “anaknya” merupakan padanan Indonesia yang ringkas dan alami.
- source_word: יַחַת
  choice: Yahat
  rationale: Nama diri ditransliterasikan dengan huruf y untuk mencerminkan konsonan awal Ibrani י dalam kebiasaan bahasa Indonesia.
- source_word: זִמָּה
  choice: Zima
  rationale: Di sini bentuk tersebut berfungsi sebagai nama orang, sehingga ditransliterasikan dan tidak diterjemahkan menurut arti kata seakar di konteks lain.
