  text: וְ/אֵ֖לֶּה בְּנֵ֣י אַהֲרֹ֑ן אֶלְעָזָ֥ר בְּנ֛/וֹ פִּֽינְחָ֥ס בְּנ֖/וֹ אֲבִישׁ֥וּעַ בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/035.yaml
  text: 'And these were the sons of Aaron: Eleazar his son, Phinehas his son, Abishua his son.'
translation:
  language: id
  text: 'Inilah anak-anak Harun: Eleazar, anaknya; Pinehas, anaknya; Abisua, anaknya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Inilah
  rationale: Gabungan konjungsi dan kata tunjuk memperkenalkan daftar silsilah. Dalam bahasa Indonesia, “Inilah” menyampaikan fungsi pengantar itu secara alami tanpa perlu memaksakan kata “dan” pada awal ayat.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Kata ini dapat berarti keturunan dalam konteks tertentu, tetapi rangkaian berikut menyebut hubungan ayah-anak secara langsung, sehingga “anak-anak” paling tepat.
- source_word: אַהֲרֹן
  choice: Harun
  rationale: Bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Bentuk nama yang baku dalam tradisi Alkitab bahasa Indonesia dan cukup dekat dengan bentuk Ibrani.
- source_word: בְּנ/וֹ
  choice: anaknya
  rationale: Nomina dengan akhiran orang ketiga tunggal maskulin menandai hubungan anak langsung; “anaknya” ringkas, alami, dan mempertahankan pola silsilah.
- source_word: פִּינְחָס
  choice: Pinehas
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֲבִישׁוּעַ
  choice: Abisua
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan mencerminkan nama Ibrani secara memadai.
