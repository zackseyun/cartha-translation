translation:
  language: id
  text: Orang Israel memberikan kepada orang Lewi kota-kota itu beserta tanah-tanah penggembalaannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah-tanah terbuka di sekitar kota-kota itu” atau “lahan-lahan di sekitarnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: memberikan
  rationale: Bentuk wayyiqtol Qal dari נתן; 'memberikan' merupakan padanan langsung dan alami dalam narasi pembagian kota.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Secara harfiah berarti 'anak-anak lelaki Israel', tetapi dalam konteks ini ungkapan tersebut menunjuk kepada bangsa Israel secara kolektif; 'Orang Israel' adalah ungkapan Indonesia yang alami tanpa membatasi pelakunya hanya pada laki-laki.
- source_word: לַלְוִיִּם
  choice: kepada orang Lewi
  rationale: Padanan baku dan jelas bagi sebutan kelompok suku Lewi dengan fungsi datif.
- source_word: הֶעָרִים
  choice: kota-kota itu
  rationale: Bentuknya definit dan merujuk pada kota-kota yang dibicarakan dalam konteks pembagian; 'kota-kota' mempertahankan istilah yang lazim bagi kota-kota orang Lewi.
- source_word: מִגְרְשֵׁיהֶם
  choice: tanah-tanah penggembalaan di sekelilingnya
  rationale: מִגְרָשׁ menunjuk pada tanah terbuka di sekitar kota yang terkait dengan kota tersebut dan dapat digunakan untuk menggembalakan ternak. Frasa ini menyampaikan baik letak maupun fungsi umumnya.
