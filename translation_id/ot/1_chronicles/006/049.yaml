translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ungkapan kolektif 'Orang Israel' dipilih daripada terjemahan harfiah 'anak-anak lelaki Israel'. Penanda jamak pada 'tanah-tanah' membantu menyatakan bahwa setiap kota memiliki lahan terkait; pronomina '-nya' merujuk pada kota-kota tersebut.
