  yaml_path: translation/ot/1_chronicles/006/026.yaml
  text: the son of Ethni, the son of Zerah, the son of Adaiah.
translation:
  language: id
  text: anak Etni, anak Zerah, anak Adaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar silsilah ini, בֶּן menandai hubungan keturunan langsung. Pengulangan “anak” mempertahankan susunan genealogis teks Ibrani dan terdengar wajar dalam bahasa Indonesia.
- source_word: אֶתְנִי
  choice: Etni
  rationale: Nama diri ditransliterasikan ke ejaan Indonesia; huruf Ibrani א tidak perlu ditandai secara khusus, dan תְנִי secara wajar menjadi “tni”.
- source_word: זֶרַח
  choice: Zerah
  rationale: Nama diri ditransliterasikan dengan bentuk “Zerah”, yang mempertahankan konsonan utama nama Ibrani dan mudah dibaca oleh pembaca Indonesia.
- source_word: עֲדָיָה
  choice: Adaya
  rationale: Nama diri ini ditransliterasikan secara alami ke bahasa Indonesia. Bentuk “Adaya” mencerminkan bunyi Ibrani ʿăḏāyāh tanpa mempertahankan huruf h akhir yang tidak dilafalkan sebagai konsonan tersendiri.
