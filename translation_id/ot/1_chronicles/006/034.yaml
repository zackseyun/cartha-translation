base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/034.yaml
  text: And Aaron and his sons were offering on the altar of burnt offering and on the altar of incense[a], for all the work of the Most Holy Place and to make atonement for Israel, according to all that Moses the servant of God had commanded.
translation:
  language: id
  text: Harun dan anak-anaknya membakar persembahan pada mezbah kurban bakaran dan pada mezbah dupa, untuk melaksanakan segala tugas yang berkaitan dengan tempat mahakudus[a] dan untuk mengadakan pendamaian bagi Israel, sesuai dengan semua yang diperintahkan Musa, hamba Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hal-hal yang mahakudus.” Ungkapan Ibrani ini dapat menunjuk pada tempat mahakudus atau pada hal-hal yang paling kudus, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְטִירִים
  choice: membakar persembahan
  rationale: Bentuk partisip Hifil dari קטר menunjuk pada tindakan membuat kurban atau dupa naik sebagai asap. Ungkapan ini cukup luas untuk mencakup pelayanan pada mezbah kurban bakaran maupun mezbah dupa tanpa menambahkan kata 'kurban' secara sempit.
- source_word: מִזְבַּח הָעוֹלָה
  choice: mezbah kurban bakaran
  rationale: Istilah ini secara khusus menunjuk pada mezbah untuk persembahan yang dibakar seluruhnya; 'kurban bakaran' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: mezbah dupa
  rationale: Padanan ringkas dan alami untuk mezbah tempat dupa dibakar.
- source_word: לְכֹל מְלֶאכֶת
  choice: melaksanakan segala tugas yang berkaitan dengan
  rationale: מְלָאכָה dalam konteks ini berarti pekerjaan atau tugas pelayanan yang dipercayakan. Susunan verbal ini menghasilkan bahasa Indonesia yang alami sambil mempertahankan cakupan menyeluruh dari לְכֹל.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: tempat mahakudus
  rationale: Ungkapan superlatif ini dapat menunjuk pada ruang terdalam tempat kudus atau pada hal-hal yang paling kudus. Konteks pelayanan imam mendukung pembacaan tempat, sementara kemungkinan lain dipertahankan dalam catatan kaki.
- source_word: וּלְכַפֵּר עַל יִשְׂרָאֵל
  choice: dan mengadakan pendamaian bagi Israel
  rationale: Padanan ini mempertahankan arti ritual-imamat dari כפר tanpa menentukan teori teologis tertentu mengenai pendamaian.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: sesuai dengan semua yang diperintahkan
  rationale: Terjemahan ini mempertahankan gagasan kesesuaian dengan keseluruhan perintah.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: hamba Allah
  rationale: Padanan Indonesia yang wajar dan bermartabat untuk gelar formal Musa.
theological_decisions:
- issue: Rujukan קֹדֶשׁ הַקֳּדָשִׁים
  choice: tempat mahakudus
  alternative: hal-hal yang mahakudus
  rationale: Konteks pelayanan mezbah dan pendamaian memungkinkan rujukan pada kawasan tempat kudus, tetapi bentuk Ibraninya juga dapat berarti benda atau perkara yang paling kudus. Catatan kaki menjaga ketaksaan asli itu.
- issue: Makna כפר
  choice: mengadakan pendamaian
  alternative: mengadakan penebusan; mendamaikan
  rationale: Pilihan ini mempertahankan cakupan ritual dan perjanjian dari istilah tersebut tanpa memasukkan suatu model doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi dua kalimat agar mudah dipahami tanpa mengubah hubungan antargagasan. Istilah kultis utama dipertahankan secara konsisten.
