  text: וּ/מִֽ/מִּשְׁפְּח֖וֹת בְּנֵ֣י קְהָ֑ת וַ/יְהִי֙ עָרֵ֣י גְבוּלָ֔/ם מִ/מַּטֵּ֖ה אֶפְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/051.yaml
  text: And from the families of the sons of Kohath[b][a], the cities of their territory were from the tribe of Ephraim.
translation:
  language: id
  text: Dan dari antara kaum-kaum keturunan Kehat[a], kota-kota di wilayah mereka[b] berasal dari suku Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kaum-kaum anak-anak Kehat”; maksudnya ialah kelompok-kelompok keluarga keturunan Kehat.
    reason: lexical_alternative
  - marker: b
    text: Atau “kota-kota perbatasan mereka”; kata Ibrani גְּבוּל dapat berarti “perbatasan”, “batas”, atau “wilayah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמִּשְׁפְּחוֹת
  choice: Dan dari antara kaum-kaum
  rationale: Kata מִשְׁפָּחוֹת menunjuk pada kelompok-kelompok kekerabatan atau kaum. Frasa “dari antara” mempertahankan daya partitif מִן, sedangkan “Dan” mempertahankan kesinambungan daftar.
- source_word: בְּנֵי קְהָת
  choice: keturunan Kehat
  rationale: Secara harfiah berarti “anak-anak Kehat”, tetapi dalam konteks silsilah dan kesukuan ungkapan ini menunjuk pada para keturunannya. “Keturunan Kehat” alami dan jelas dalam bahasa Indonesia modern.
- source_word: וַיְהִי
  choice: berasal
  rationale: Dalam pernyataan pembagian kota ini, bentuk היה menghubungkan kota-kota tersebut dengan suku yang menyediakannya. “Berasal” menyampaikan hubungan itu secara wajar tanpa menerjemahkannya secara kaku sebagai “terjadilah”.
- source_word: עָרֵי גְבוּלָם
  choice: kota-kota di wilayah mereka
  rationale: גְבוּל dapat berarti perbatasan, batas, atau wilayah. Dalam konteks pembagian tanah, “wilayah” paling wajar, sementara catatan kaki mempertahankan kemungkinan arti “kota-kota perbatasan mereka”.
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: dari suku Efraim
  rationale: Dalam konteks pembagian wilayah, מַטֶּה berarti “suku”, bukan tongkat. Preposisi “dari” mempertahankan sumber kota-kota itu.
