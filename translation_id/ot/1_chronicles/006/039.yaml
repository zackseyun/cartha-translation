base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/039.yaml
  text: These were their dwelling places according to their settlements within their territory[a], for the sons of Aaron, of the family of the Kohathites; for the lot was theirs.
translation:
  language: id
  text: Inilah tempat-tempat kediaman mereka menurut permukiman mereka di dalam wilayah mereka[a], bagi keturunan Harun dari kaum Kehat, sebab undian itu adalah milik mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut perkemahan mereka” atau “di desa-desa mereka” untuk “menurut permukiman mereka”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשְׁבוֹתָם
  choice: tempat-tempat kediaman mereka
  rationale: Bentuk jamak menunjuk pada lokasi-lokasi tempat tinggal; ungkapan ini konkret, jelas, dan wajar dalam bahasa Indonesia.
- source_word: לְטִירוֹתָם
  choice: menurut permukiman-permukiman mereka
  rationale: טִירָה dapat berarti permukiman, perkemahan, atau desa berkubu. 'Permukiman' sesuai dengan konteks pembagian tempat tinggal tanpa mempersempitnya menjadi perkemahan atau desa.
- source_word: בִּגְבוּלָם
  choice: di dalam wilayah mereka
  rationale: גְּבוּל di sini lebih wajar dipahami sebagai kawasan teritorial daripada garis batas semata.
- source_word: לִבְנֵי אַהֲרֹן
  choice: bagi keturunan Harun
  rationale: בֵּן dalam konteks silsilah dan pembagian tanah mencakup para keturunan, bukan hanya anak kandung langsung.
- source_word: לְמִשְׁפַּחַת הַקְּהָתִי
  choice: dari kaum Kehat
  rationale: Frasa ini menyatakan afiliasi kelompok keluarga besar; 'kaum Kehat' ringkas dan alami dalam bahasa Indonesia.
- source_word: כִּי לָהֶם הָיָה הַגּוֹרָל
  choice: sebab undian itu menjadi bagian mereka
  rationale: Terjemahan ini mempertahankan konstruksi kepunyaan dalam bahasa Ibrani sekaligus menjelaskan bahwa hasil undian tersebut merupakan jatah mereka, tanpa menggantinya dengan idiom 'jatuh kepada mereka'.
