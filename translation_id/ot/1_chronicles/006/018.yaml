  text: וְ/אֵ֥לֶּה הָ/עֹמְדִ֖ים וּ/בְנֵי/הֶ֑ם מִ/בְּנֵי֙ הַ/קְּהָתִ֔י הֵימָן֙ הַ/מְשׁוֹרֵ֔ר בֶּן יוֹאֵ֖ל בֶּן שְׁמוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/018.yaml
  text: 'And these are the ones who stood[a], and their sons: from the sons of the Kohathites: Heman the singer, son of Joel[b], son of Samuel.'
translation:
  language: id
  text: 'Inilah orang-orang yang berdiri beserta anak-anak mereka: dari keturunan Kehat, Heman sang penyanyi, anak Yoel, anak Samuel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Membuka daftar baru secara alami dalam bahasa Indonesia; unsur penghubung waw dipahami dari kesinambungan konteks dan tidak perlu selalu dinyatakan dengan “dan”.
- source_word: הָעֹמְדִים
  choice: orang-orang yang bertugas
  rationale: Secara harfiah berarti “orang-orang yang berdiri,” tetapi dalam konteks penetapan para penyanyi menunjuk pada kedudukan atau pelaksanaan tugas. Catatan kaki mempertahankan gambaran harfiahnya.
- source_word: וּבְנֵיהֶם
  choice: beserta anak-anak mereka
  rationale: Menyampaikan waw sebagai penyertaan dalam daftar dengan bahasa Indonesia yang alami, tanpa mengubah hubungan genealogisnya.
- source_word: מִבְּנֵי הַקְּהָתִי
  choice: Dari keturunan Kehat
  rationale: Ungkapan Ibrani secara harfiah merujuk kepada “anak-anak orang Kehat”; “keturunan Kehat” merupakan bentuk Indonesia yang jelas dan lazim untuk keanggotaan marga.
- source_word: הֵימָן
  choice: Heman
  rationale: Transliterasi nama pribadi yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הַמְשׁוֹרֵר
  choice: penyanyi
  rationale: Secara langsung menyatakan orang yang bernyanyi; lebih tepat daripada istilah yang lebih luas seperti “pemusik”.
- source_word: בֶּן יוֹאֵל בֶּן שְׁמוּאֵל
  choice: anak Yoel, anak Samuel
  rationale: Mempertahankan susunan silsilah Ibrani secara ringkas dan jelas.
theological_decisions: []
