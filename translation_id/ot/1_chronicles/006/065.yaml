base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/065.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead with its pasturelands[a], and Mahanaim with its pasturelands.'
translation:
  language: id
  text: 'Dan dari suku Gad: Ramot di Gilead beserta tanah penggembalaannya, dan Mahanaim beserta tanah penggembalaannya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: Dan dari suku
  rationale: Dalam konteks pembagian kota menurut kelompok Israel, מַטֶּה berarti “suku”; awalan וּ dan מִ diterjemahkan secara alami sebagai “Dan dari”.
- source_word: גָד
  choice: Gad
  rationale: Nama suku ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: רָאמוֹת בַּגִּלְעָד
  choice: Ramot di Gilead
  rationale: Preposisi בְּ menunjukkan lokasi, sehingga “di Gilead” mempertahankan susunan Ibrani secara jelas dan alami.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah-tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada lahan terbuka di sekitar kota yang diperuntukkan bagi ternak; bentuk jamak dan sufiks feminin tunggal dipertahankan.
- source_word: מַחֲנַיִם
  choice: Mahanaim
  rationale: Nama tempat ditransliterasikan dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְאֶת
  choice: dan
  rationale: Penanda objek langsung tidak perlu diterjemahkan tersendiri; konjungsi וְ secara alami menghubungkan unsur-unsur daftar dengan “dan”.
