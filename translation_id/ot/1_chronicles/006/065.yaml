  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar dibuat ringkas; istilah “tanah-tanah penggembalaan” dipilih untuk menjelaskan fungsi lahan milik kota Lewi tanpa menambahkan tafsiran teologis.
