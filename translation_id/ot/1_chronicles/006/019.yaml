  text: anak Elkana, anak Yeroham, anak Eliel, anak Toah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam silsilah paralel di 1 Samuel 1:1, nama yang bersesuaian adalah Tohu.
