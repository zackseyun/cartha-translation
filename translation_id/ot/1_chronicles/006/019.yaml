lexical_decisions:
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar silsilah, בֶּן menyatakan hubungan anak atau garis keturunan. Pengulangan “anak” mempertahankan bentuk ringkas dan berirama dari teks Ibrani.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: יְרֹחָם
  choice: Yeroham
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani dengan ejaan Indonesia; יְ diwakili “Ye-”.
- source_word: אֱלִיאֵל
  choice: Eliel
  rationale: Transliterasi langsung dan lazim dari nama Ibrani אֱלִיאֵל.
- source_word: תּוֹחַ
  choice: Toah
  rationale: Bentuk WLC תּוֹחַ ditransliterasikan sebagai “Toah”; huruf ח tidak memiliki padanan tepat dalam ejaan Indonesia dan di sini diwakili dengan “h” tanpa memasukkan nama dari silsilah paralel ke teks utama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan berulang teks silsilah dipertahankan. Catatan kaki ditempatkan pada Toah, nama yang benar-benar terkait dengan perbedaan dalam silsilah paralel; data konsultasi Inggris tampaknya salah menempatkan penanda [a] sesudah Elkana dan memberi keterangan [b] yang tidak sesuai dengan אֱלִיאֵל.
