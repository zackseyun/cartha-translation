  text: אֶלְקָנָ֥ה בְנ֛/וֹ וְ/אֶבְיָסָ֥ף בְּנ֖/וֹ וְ/אַסִּ֥יר בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/008.yaml
  text: Elkanah his son[a], and Ebiasaph his son, and Assir his son.
translation:
  language: id
  text: Elkana, anaknya; Ebiasaf[a], anaknya; dan Asir, anaknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Abiasaf”, mengikuti transliterasi tradisional yang lebih dikenal dalam beberapa terjemahan dan bentuk silsilah paralel.
    reason: alternatif leksikal/transliterasi
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Nama diri Ibrani ditransliterasikan dalam bentuk yang alami dan lazim untuk pembaca Indonesia.
- source_word: בְנוֹ
  choice: anaknya
  rationale: Secara langsung berarti 'anak laki-lakinya'; dalam daftar silsilah bahasa Indonesia, 'anaknya' menyampaikan hubungan itu secara ringkas dan alami, tanpa menutup kemungkinan pemakaian silsilah yang lebih luas.
- source_word: וְ
  choice: dan; tanda titik koma pada dua mata rantai pertama
  rationale: Konjungsi Ibrani menghubungkan mata-mata rantai silsilah. Tanda titik koma membantu keterbacaan dalam bahasa Indonesia, sedangkan 'dan' dipertahankan pada unsur terakhir.
- source_word: אֶבְיָסָף
  choice: Abyasaf
  rationale: Transliterasi mengikuti bentuk Ibrani אֶבְיָסָף dan kaidah nama Ibrani yang wajar dalam bahasa Indonesia; bunyi awal direpresentasikan sebagai A karena vokal pendek Ibrani di sini terwarnai oleh konsonan gutural berikutnya.
- source_word: אַסִּיר
  choice: Asir
  rationale: Nama diri ditransliterasikan langsung; rangkap konsonan tidak perlu ditampilkan dalam ejaan Indonesia.
