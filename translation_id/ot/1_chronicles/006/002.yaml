base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/002.yaml
  text: 'These are the names of the sons of Gershom: Libni and Shimei[a].'
translation:
  language: id
  text: 'Inilah nama anak-anak Gersom: Libni dan Simei.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Naskah-naskah Ibrani di sini berbunyi “Gersom”; dalam beberapa tradisi bahasa Inggris, nama “Gerson” digunakan dalam konteks silsilah yang berkaitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Gabungan waw dan kata penunjuk memperkenalkan sebuah daftar. “Inilah” menyampaikan fungsi presentasionalnya secara alami dalam bahasa Indonesia; waw tidak perlu diterjemahkan terpisah.
- source_word: שְׁמוֹת
  choice: nama
  rationale: Dalam frasa konstruksi שְׁמוֹת בְּנֵי, bentuk yang alami ialah “nama anak-anak”; bahasa Indonesia tidak memerlukan penanda definit seperti dalam bahasa Inggris.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Walaupun istilah ini dapat berarti keturunan dalam silsilah, dua orang yang disebut di sini disajikan sebagai anak langsung Gersom.
- source_word: גֵרְשׁוֹם
  choice: Gersom
  rationale: Nama diri ini ditransliterasikan dari bentuk Ibrani yang tertulis di ayat ini, dengan ejaan yang alami bagi pembaca Indonesia.
- source_word: לִבְנִי
  choice: Libni
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְשִׁמְעִי
  choice: dan Simei
  rationale: Waw menghubungkan nama kedua dalam daftar; שִׁמְעִי ditransliterasikan sebagai “Simei” sesuai kelaziman ejaan Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan presentasional “Inilah nama …” alami bagi pembaca modern sekaligus dekat dengan bentuk Ibrani.
