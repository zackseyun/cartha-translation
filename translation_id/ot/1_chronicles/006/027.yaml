  text: בֶּן אֵיתָ֥ן בֶּן זִמָּ֖ה בֶּן שִׁמְעִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/027.yaml
  text: son of Ethan[a], son of Zimmah, son of Shimei.
translation:
  language: id
  text: anak Etan[a], anak Zima, anak Simei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Silsilah Ibrani kadang melompati satu atau beberapa generasi. Karena itu, dalam konteks tertentu, “anak” dapat bermakna lebih luas, yaitu “keturunan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar silsilah, bentuk ini paling wajar diterjemahkan sebagai "anak". Namun, silsilah Ibrani kadang melompati generasi, sehingga dalam konteks tertentu hubungan yang dimaksud dapat lebih luas, yakni "keturunan".
- source_word: אֵיתָן
  choice: Etan
  rationale: Nama diri Ibrani ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: זִמָּה
  choice: Zima
  rationale: Di sini kata tersebut berfungsi sebagai nama diri, sehingga ditransliterasikan dan tidak diterjemahkan menurut kemungkinan arti akar katanya.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Nama diri ditransliterasikan dengan bentuk yang sudah dikenal dalam tradisi Alkitab bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan wajar untuk formula silsilah. Tanda [a] ditempatkan setelah nama Etan sesuai lapisan konsultasi, sambil mempertahankan arti permukaan בֶּן sebagai “anak”.
