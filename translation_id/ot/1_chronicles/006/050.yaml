base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/050.yaml
  text: They assigned by lot from the tribe of the sons of Judah[a], and from the tribe of the sons of Simeon, and from the tribe of the sons of Benjamin, these cities, which they called by name.
translation:
  language: id
  text: Mereka menetapkan dengan undian, dari suku keturunan Yehuda, dari suku keturunan Simeon, dan dari suku keturunan Benyamin, kota-kota ini yang mereka sebutkan menurut nama-namanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “yang mereka sebut menurut nama-namanya.” Ungkapan Ibrani ini memperkenalkan daftar nama kota yang menyusul.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Mereka memberikan
  rationale: Makna dasar נתן adalah ‘memberikan’. Dalam konteks pembagian kota-kota kepada orang Lewi, pilihan ini alami dan tetap dekat dengan bentuk Ibrani; frasa ‘dengan undian’ menjelaskan cara pembagiannya.
- source_word: בַגּוֹרָל
  choice: dengan undian
  rationale: גורל menunjuk pada undi atau hasil penetapan melalui undi. ‘Dengan undian’ merupakan ungkapan Indonesia yang jelas untuk cara pembagian tersebut.
- source_word: מִמַּטֵּה בְנֵי יְהוּדָה
  choice: dari suku keturunan Yehuda
  rationale: מַטֶּה berarti ‘suku’ dalam konteks ini, sedangkan בְנֵי secara harfiah ‘anak-anak’ berfungsi sebagai sebutan genealogis kolektif. ‘Keturunan Yehuda’ lebih alami dalam bahasa Indonesia modern.
- source_word: וּמִמַּטֵּה בְנֵי שִׁמְעוֹן
  choice: dari suku keturunan Simeon
  rationale: Menerapkan padanan yang sama secara konsisten bagi ungkapan kesukuan-genealogis.
- source_word: וּמִמַּטֵּה בְּנֵי בִנְיָמִן
  choice: dari suku keturunan Benyamin
  rationale: Menerapkan padanan yang sama secara konsisten bagi ungkapan kesukuan-genealogis.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: kota-kota berikut
  rationale: Demonstratif ‘ini/berikut’ menunjuk kepada daftar kota yang menyusul. ‘Berikut’ membuat fungsi prospektif itu jelas tanpa mengubah acuannya.
- source_word: אֲשֶׁר יִקְרְאוּ אֶתְהֶם בְּשֵׁמוֹת
  choice: kota-kota itu disebutkan menurut namanya masing-masing
  rationale: Secara harfiah konstruksi ini memakai קרא, ‘memanggil/menyebut’, bersama ‘dengan/menurut nama-nama’. Dalam konteks, ini adalah formula yang memperkenalkan daftar nama kota; ‘disebutkan menurut namanya masing-masing’ mempertahankan unsur verbal dan fungsi formula tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ‘keturunan’ dipakai untuk ungkapan kesukuan בְנֵי agar wajar bagi pembaca umum. Tanda titik koma membantu membedakan sumber kota-kota dari keterangan tentang penyebutan namanya.
