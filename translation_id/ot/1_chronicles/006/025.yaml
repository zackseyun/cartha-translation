  register: Bahasa ringkas dan bermartabat dipertahankan sesuai gaya daftar silsilah. Pengulangan “anak” mencerminkan struktur Ibrani. Ayat diawali huruf kecil karena secara sintaksis merupakan lanjutan daftar dari ayat sebelumnya.
