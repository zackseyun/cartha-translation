  text: anak Mikhael, anak Baaseya[a], anak Malkia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani yang diterima berbunyi “Baaseya”; dalam silsilah Alkitab lain dan sebagian tradisi terjemahan terdapat nama serupa, “Maaseya.”
