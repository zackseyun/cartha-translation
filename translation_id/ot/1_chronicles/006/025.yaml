lexical_decisions:
- source_word: בֶּן
  choice: anak
  rationale: Dalam rangkaian silsilah, kata ini paling langsung menyatakan hubungan anak dengan ayah dan mempertahankan bentuk berulang teks Ibrani.
- source_word: מִיכָאֵל
  choice: Mikhael
  rationale: Transliterasi ini mengikuti bentuk nama Ibrani dan konvensi nama Alkitab yang lazim dalam bahasa Indonesia.
- source_word: בַּעֲשֵׂיָה
  choice: Baaseya
  rationale: Bentuk ini mencerminkan teks Ibrani yang diterima, termasuk konsonan awal bet, sekaligus memakai ejaan yang wajar dalam bahasa Indonesia.
- source_word: מַלְכִּיָּה
  choice: Malkia
  rationale: Bentuk ini dekat dengan bunyi nama Ibrani dan mudah dibaca oleh pembaca Indonesia.
