lexical_decisions:
- source_word: בֶּן
  choice: anak
  rationale: Dalam silsilah, בֶּן menyatakan hubungan keturunan dan secara paling langsung berarti “anak”. Pengulangan “anak” mempertahankan corak daftar silsilah Ibrani.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: יוֹאֵל
  choice: Yoel
  rationale: Transliterasi ini cukup dekat dengan bunyi nama Ibrani dan lazim dikenal oleh pembaca Indonesia.
- source_word: עֲזַרְיָה
  choice: Azarya
  rationale: Bentuk ini mencerminkan nama Ibrani secara wajar dalam ejaan Indonesia.
- source_word: צְפַנְיָה
  choice: Zefanya
  rationale: Bentuk nama yang lazim dan mudah dikenali dalam bahasa Indonesia.
