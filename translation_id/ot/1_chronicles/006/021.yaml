  text: anak Elkana[a], anak Yoel, anak Azarya, anak Zefanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “keturunan Elkana”, dan demikian juga pada setiap kemunculan kata “anak”, sebab silsilah Ibrani kadang-kadang dapat melewatkan beberapa generasi. Namun, urutan silsilah langsung di sini lebih mendukung arti “anak”.
