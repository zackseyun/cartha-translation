base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/045.yaml
  text: 'and from the tribe of Benjamin: Geba with its pasturelands[a], Alemeth with its pasturelands, and Anathoth with its pasturelands—all their cities were thirteen cities according to their families.'
translation:
  language: id
  text: 'dan dari suku Benyamin: Geba beserta tanah penggembalaannya, Alemet beserta tanah penggembalaannya[a], dan Anatot beserta tanah penggembalaannya. Kota-kota mereka seluruhnya berjumlah tiga belas, menurut kaum-kaum mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk Ibrani di ayat ini adalah “Alemet”; daftar sejajar dalam Yosua 21:18 menyebutnya “Almon”.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה בִנְיָמִן
  choice: dan dari suku Benyamin
  rationale: מַטֶּה dalam konteks pembagian wilayah berarti suku; awalan וּמִן melanjutkan daftar dengan arti 'dan dari'.
- source_word: גֶּבַע
  choice: Geba
  rationale: Nama tempat ditransliterasikan menurut bentuk Ibrani.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada tanah terbuka di sekitar kota yang digunakan sebagai padang penggembalaan; bentuk tunggal kolektif ini alami dalam bahasa Indonesia.
- source_word: עָלֶמֶת
  choice: Alemet
  rationale: Teks WLC memakai bentuk עָלֶמֶת; bentuk ini dipertahankan dalam teks utama, bukan diselaraskan dengan daftar paralel.
- source_word: עֲנָתוֹת
  choice: Anatot
  rationale: Nama tempat ditransliterasikan secara wajar ke dalam bahasa Indonesia.
- source_word: כָּל עָרֵיהֶם שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: Seluruhnya ada tiga belas kota
  rationale: Ungkapan ini menyampaikan fungsi frasa Ibrani sebagai ringkasan jumlah seluruh kota dengan alami.
- source_word: בְּמִשְׁפְּחוֹתֵיהֶם
  choice: bagi kaum-kaum mereka
  rationale: מִשְׁפָּחוֹת menunjuk pada kelompok keluarga besar atau kaum; preposisi ב dapat menyatakan pembagian atau pengaturan menurut kelompok tersebut.
