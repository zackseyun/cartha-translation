  text: וְ/אֵ֗לֶּה אֲשֶׁ֨ר הֶעֱמִ֥יד דָּוִ֛יד עַל יְדֵי שִׁ֖יר בֵּ֣ית יְהוָ֑ה מִ/מְּנ֖וֹחַ הָ/אָרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/016.yaml
  text: These are the men whom David appointed over the service of song in the house of Yahweh[b][a], after the ark came to rest.
translation:
  language: id
  text: Inilah orang-orang yang ditetapkan Daud untuk bertanggung jawab atas nyanyian[a] di rumah Yahweh, sesudah tabut itu mendapat tempat perhentian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk menangani kegiatan bernyanyi” atau “untuk mengurus nyanyian.” Ungkapan Ibrani menunjukkan tanggung jawab atas nyanyian di tempat kudus.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari perhentian tabut.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah orang-orang
  rationale: Ungkapan ini memperkenalkan daftar berikutnya. Kata “orang-orang” tersirat dari nama-nama orang yang menyusul dan diperlukan agar kalimat Indonesia alami.
- source_word: הֶעֱמִיד דָּוִיד
  choice: yang ditetapkan Daud
  rationale: Bentuk Hifil dari עמד dalam konteks penugasan menunjukkan bahwa Daud menempatkan atau mengangkat mereka untuk menjalankan fungsi tertentu.
- source_word: עַל יְדֵי שִׁיר
  choice: untuk bertanggung jawab atas nyanyian
  rationale: Ungkapan עַל יְדֵי menyatakan tanggung jawab atas suatu tugas, sedangkan שִׁיר berarti nyanyian atau kegiatan bernyanyi. Pilihan ini mempertahankan unsur tanggung jawab tanpa menentukan secara berlebihan bentuk kepemimpinan musiknya.
- source_word: בֵּית יְהוָה
  choice: di rumah Yahweh
  rationale: “Rumah” mempertahankan metafora Ibrani בַּיִת bagi tempat kudus, dan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: מִמְּנוֹחַ הָאָרוֹן
  choice: sejak tabut itu mendapat tempat perhentian
  rationale: Frasa nominal ini secara harfiah menunjuk pada “perhentian tabut.” “Sejak” mempertahankan daya temporal preposisi מִן, sementara “mendapat tempat perhentian” menyampaikan keadaan tabut yang telah ditempatkan secara tetap.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama ilahi sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Sifat tugas nyanyian di tempat kudus
  choice: bertanggung jawab atas nyanyian
  alternative: memimpin nyanyian / melayani dengan nyanyian
  rationale: Teks menunjukkan penugasan atau tanggung jawab, tetapi tidak merinci bahwa mereka semata-mata bertindak sebagai pemimpin paduan suara atau memakai istilah teknis tertentu untuk pelayanan musik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami tanpa menghilangkan ungkapan “rumah Yahweh” atau nuansa temporal “sejak” dalam teks Ibrani.
