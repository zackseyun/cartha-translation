  text: 'The sons of Merari: Mahli and Mushi[b][a]. These were the clans of the Levites according to their fathers’ houses.'
translation:
  language: id
  text: Anak-anak Merari ialah Mahli dan Musi. Inilah kaum-kaum[a] keturunan Lewi menurut nenek moyang mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keluarga-keluarga.”
    reason: lexical_alternative
  - marker: b
    text: Ibrani secara harfiah, “menurut ayah-ayah mereka”; dalam konteks silsilah, ungkapan ini mengacu pada pengelompokan berdasarkan garis atau rumah pihak ayah.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן membuka daftar silsilah. “Anak-anak” mempertahankan hubungan langsung yang dinyatakan dalam teks dan lazim dalam bahasa silsilah Indonesia.
- source_word: מְרָרִי
  choice: Merari
  rationale: Nama diri, ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מַחְלִי
  choice: Mahli
  rationale: Nama diri, ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וּמֻשִׁי
  choice: dan Musi
  rationale: Nama diri dengan kata penghubung; “Musi” merupakan bentuk transliterasi Indonesia yang lazim.
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Kata penunjuk jamak dengan penghubung memperkenalkan rangkuman. “Inilah” alami dalam bahasa Indonesia dan cukup mencerminkan fungsi penunjuknya tanpa mempertahankan “dan” secara kaku.
- source_word: מִשְׁפְּחוֹת
  choice: kaum-kaum
  rationale: Dalam konteks kesukuan dan silsilah, kata ini menunjuk kelompok-kelompok kekerabatan, bukan hanya keluarga inti. “Kaum-kaum” mempertahankan cakupan sosial tersebut.
- source_word: הַלֵּוִי
  choice: orang Lewi
  rationale: Bentuk nisbah tunggal berartikel dipahami secara kolektif dalam rumusan silsilah. Bahasa Indonesia secara alami memakai “orang Lewi” untuk kelompok keturunan Lewi.
- source_word: לַאֲבוֹתֵיהֶם
  choice: menurut keluarga leluhur mereka
  rationale: Secara harfiah berarti “menurut leluhur/ayah mereka”; dalam konteks silsilah, ungkapan ini menunjukkan pengelompokan berdasarkan rumah atau keluarga pihak ayah. “Keluarga leluhur” menyampaikan maksud itu dengan jelas dan wajar.
