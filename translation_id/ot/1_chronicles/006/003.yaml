  text: 'And the sons of Kohath: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: id
  text: 'Dan anak-anak Kehat: Amram, Yizhar, Hebron, dan Uziel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak ... ialah
  rationale: בְנֵי dalam bentuk konstruksi menunjuk kepada anak-anak laki-laki Kehat yang disebutkan satu per satu. Konjungsi וּ dipahami sebagai penghubung dalam rangkaian silsilah; dalam bahasa Indonesia, kesinambungan itu tersampaikan secara alami tanpa harus memakai “dan” pada awal kalimat.
- source_word: קְהָת
  choice: Kehat
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: עַמְרָם
  choice: Amram
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: וְיִצְהָר
  choice: Yizhar
  rationale: Nama diri ditransliterasikan dekat dengan bunyi Ibrani; konjungsi prefiksnya dinyatakan melalui susunan daftar bahasa Indonesia.
- source_word: וְחֶבְרוֹן
  choice: Hebron
  rationale: Di sini Hebron adalah nama orang, bukan nama tempat, dan ditransliterasikan dalam bentuk yang lazim.
- source_word: וְעֻזִּיאֵל
  choice: Uziel
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim; konjungsi וְ dinyatakan dengan “dan” sebelum unsur terakhir dalam daftar.
