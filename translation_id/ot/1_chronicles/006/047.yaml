base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/047.yaml
  text: 'And to the sons of Gershom[a], according to their clans, from the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali[b], and from the tribe of Manasseh in Bashan: thirteen cities.'
translation:
  language: id
  text: Kepada keturunan Gersom[a], menurut kaum-kaum mereka, diberikan tiga belas kota dari suku Isakhar, suku Asyer, suku Naftali, dan suku Manasye di Basan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani mengeja nama kaum ini “Gersom”; di bagian-bagian lain nama itu juga dikenal sebagai “Gerson”.
    reason: alternative_reading
  - marker: b
    text: Sebagian terjemahan menuliskan “setengah suku Manasye di Basan” untuk memperjelas letak wilayahnya. Namun, kata “setengah” tidak terdapat dalam teks Ibrani ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי גֵרְשׁוֹם
  choice: Kepada keturunan Gersom
  rationale: Dalam konteks pembagian kota, לִבְנֵי menunjuk kepada para keturunan atau anggota kaum Lewi, bukan hanya anak kandung. Bentuk Ibrani pada ayat ini adalah גֵרְשׁוֹם, sehingga nama diterjemahkan sebagai “Gersom”.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחָה dalam susunan kesukuan menunjuk pada kelompok kekerabatan atau kaum. “Kaum-kaum” lebih tepat dalam konteks silsilah daripada “keluarga-keluarga”.
- source_word: מִמַּטֵּה
  choice: dari suku
  rationale: Dalam konteks pembagian wilayah dan silsilah, מַטֶּה berarti “suku”. Pengulangan unsur ini diringkas secara wajar dalam bahasa Indonesia tanpa mengubah daftar sumber kota.
- source_word: יִשָׂשכָר וְאָשֵׁר וְנַפְתָּלִי
  choice: Isakhar, Asyer, suku Naftali
  rationale: Dipakai bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia, dengan hubungan koordinatif yang alami.
- source_word: מְנַשֶּׁה בַּבָּשָׁן
  choice: suku Manasye di Basan
  rationale: Teks Ibrani hanya menyebut Manasye di Basan. Terjemahan tidak menambahkan “setengah suku”, meskipun konteks geografis menunjuk pada bagian Manasye di sebelah timur Yordan.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: tiga belas kota
  rationale: Padanan langsung dan alami bagi frasa bilangan Ibrani.
- source_word: '[verba eliptis dalam daftar pembagian]'
  choice: diberikan
  rationale: Ayat Ibrani berupa lanjutan daftar dengan verba yang dipahami dari konteks. “Diberikan” melengkapi kalimat Indonesia agar jelas dan alami, tanpa mengubah siapa penerima maupun jumlah kota.
theological_decisions:
- issue: Apakah Manasye harus disebut “setengah suku Manasye”
  choice: suku Manasye di Basan
  alternative: setengah suku Manasye di Basan
  rationale: “Setengah suku” sesuai dengan konteks sejarah-geografis, tetapi tidak dinyatakan dalam teks Ibrani ayat ini. Terjemahan mempertahankan bentuk sumber dan menjelaskan persoalannya dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dibuat alami dengan satu verba eksplisit, “diberikan”, yang dipahami dari konteks pembagian kota. Istilah “kaum” mempertahankan nuansa organisasi kekerabatan dalam struktur kesukuan.
