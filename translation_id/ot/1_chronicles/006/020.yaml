lexical_decisions:
- source_word: בֶּן
  choice: anak
  rationale: Dalam rangkaian silsilah, בֶּן menandai hubungan keturunan. Pengulangan “anak” mempertahankan struktur Ibrani dan tetap alami dalam daftar silsilah bahasa Indonesia.
- source_word: ציף
  choice: Zif
  rationale: Nama diri laki-laki; ditransliterasikan dari bentuk Ibrani ציף menurut kebiasaan ejaan nama Alkitab dalam bahasa Indonesia.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Nama diri laki-laki; bentuk “Elkana” mengikuti transliterasi yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מַחַת
  choice: Mahat
  rationale: Nama diri laki-laki; ditransliterasikan sebagai “Mahat” sesuai bentuk Ibrani dan kelaziman Indonesia.
- source_word: עֲמָשָׂי
  choice: Amasai
  rationale: Nama diri laki-laki; ditransliterasikan sebagai “Amasai”, tanpa menerjemahkan makna namanya.
