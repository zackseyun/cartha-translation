base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/024.yaml
  text: 'And his brother Asaph stood at his right hand: Asaph son of Berechiah[a], son of Shimea.'
translation:
  language: id
  text: 'Dan saudaranya, Asaf, berdiri di sebelah kanannya[a]: Asaf anak Berekhya, anak Simea.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada tangan kanannya”; ungkapan Ibrani ini berarti berada di sisi kanan seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָחִיו
  choice: Saudaranya
  rationale: אָח dengan akhiran orang ketiga tunggal maskulin secara langsung berarti “saudaranya.” Dalam konteks kelompok Lewi, kata ini juga dapat mencakup kerabat atau rekan sekaum, tetapi arti dasarnya tetap dipertahankan.
- source_word: אָסָף
  choice: Asaf
  rationale: Nama diri Ibrani ditransliterasikan dalam bentuk Indonesia yang lazim. Pengulangan nama dipertahankan karena teks Ibrani mula-mula mengidentifikasi Asaf, lalu menguraikan garis keturunannya.
- source_word: הָעֹמֵד
  choice: berdiri
  rationale: Partisipel Qal dari עמד menggambarkan posisi Asaf. Bentuk “berdiri” alami dalam bahasa Indonesia dan mempertahankan gambaran spasial teks.
- source_word: עַל יְמִינוֹ
  choice: di sebelah kanannya
  rationale: Ungkapan ini menunjukkan posisi pada sisi kanan seseorang. “Di sebelah kanannya” menyampaikan makna ruang secara alami tanpa menambahkan makna kehormatan yang tidak dinyatakan secara eksplisit.
- source_word: בֶּן
  choice: anak
  rationale: 'Rumus silsilah Ibrani diterjemahkan dengan bentuk Indonesia yang wajar. Pengulangannya dipertahankan: “anak Berekhya, anak Simea.”'
- source_word: בֶּרֶכְיָהוּ
  choice: Berekhya
  rationale: Transliterasi nama Ibrani ke ejaan Indonesia, dengan kh untuk bunyi konsonan ח.
- source_word: שִׁמְעָא
  choice: Simea
  rationale: Transliterasi nama diri dalam bentuk yang jelas dan sesuai dengan kebiasaan ejaan Alkitab bahasa Indonesia.
theological_decisions: []
