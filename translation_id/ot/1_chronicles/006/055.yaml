base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/055.yaml
  text: 'And from the half-tribe of Manasseh: Aner with its pasturelands[a], and Bileam with its pasturelands, for the clan of the remaining sons of Kohath.'
translation:
  language: id
  text: Dari setengah suku Manasye diberikan Aner beserta tanah penggembalaannya dan Bileam[a] beserta tanah penggembalaannya bagi kaum dari keturunan Kehat yang selebihnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani di sini berbunyi Bileam; bagian sejajarnya dalam Yosua 21:25 berbunyi Ibleam.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה מְנַשֶּׁה
  choice: Dari setengah suku Manasye
  rationale: מַחֲצִית berarti “setengah”, sedangkan מַטֶּה dalam konteks pembagian wilayah berarti “suku”. Ungkapan ini menunjuk pada setengah bagian suku Manasye.
- source_word: אֶת עָנֵר
  choice: Aner
  rationale: Nama tempat ditransliterasikan sesuai bentuk Ibraninya.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah-tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada tanah terbuka di sekitar kota, khususnya lahan penggembalaan yang menyertai kota-kota orang Lewi.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Teks konsonantal WLC berbunyi בִּלְעָם, sehingga diterjemahkan sebagai Bileam; perbedaan dengan bacaan paralel dipertahankan dalam catatan kaki.
- source_word: לְמִשְׁפַּחַת לִבְנֵי קְהָת הַנּוֹתָרִים
  choice: kepada kaum keturunan Kehat yang selebihnya
  rationale: מִשְׁפָּחָה berbentuk tunggal tetapi dapat bermakna kelompok kekerabatan atau kaum. הַנּוֹתָרִים menunjuk pada keturunan Kehat yang belum disebut atau belum memperoleh bagian.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata kerja “diberikan” disediakan dari konteks daftar pembagian kota agar kalimat alami, meskipun tidak dinyatakan secara eksplisit dalam ayat Ibrani ini. Istilah “kaum” mempertahankan nuansa kelompok kekerabatan tanpa mempersempitnya menjadi keluarga inti.
