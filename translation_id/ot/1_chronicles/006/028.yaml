  text: son of Jahath[a], son of Gershom[b], son of Levi.
translation:
  language: id
  text: anak Yahat[a], anak Gersom[b], anak Lewi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dalam pemakaian silsilah yang lebih luas, “keturunan Yahat ... keturunan Gersom ... keturunan Lewi.”
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani berbunyi “Gersom”; nama ini tidak diseragamkan menjadi “Gerson”, bentuk nama terkait yang terdapat dalam konteks silsilah lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: anak
  rationale: Dalam silsilah, בֶּן paling wajar berarti 'anak'. Namun, karena silsilah dapat melompati generasi, catatan kaki mempertahankan kemungkinan arti yang lebih luas, yaitu 'keturunan'.
- source_word: יַחַת
  choice: Yahat
  rationale: Nama Ibrani ditransliterasikan secara langsung dan disesuaikan dengan ejaan Indonesia; huruf awal י direpresentasikan sebagai Y.
- source_word: גֵּרְשֹׁם
  choice: Gersom
  rationale: Bentuk sumber adalah גֵּרְשֹׁם, dengan konsonan akhir mem, sehingga diterjemahkan sebagai 'Gersom' dan tidak diseragamkan menjadi 'Gerson'.
- source_word: לֵוִי
  choice: Lewi
  rationale: Bentuk nama yang lazim dan mudah dikenali dalam bahasa Indonesia adalah 'Lewi'.
