  text: and Jokmeam with its pasturelands[b][a], and Beth-horon with its pasturelands.
translation:
  language: id
  text: dan Yokmeam beserta tanah padang rumputnya[a][b], dan Bet-Horon beserta tanah padang rumputnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Yokmeam”; beberapa tradisi terjemahan memakai “Yokneam” berdasarkan kaitannya dengan bentuk nama tempat dalam bagian-bagian sejajar.'
    reason: alternative_reading
  - marker: b
    text: Atau “tanah bersama” atau “lahan terbuka di sekeliling kota”, yaitu tanah yang disediakan bagi setiap kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקְמְעָם
  choice: Yokmeam
  rationale: Nama tempat ini ditransliterasikan menurut bentuk konsonantal teks Masoret dalam Tawarikh. Bentuk ini juga mengikuti penyesuaian bunyi Ibrani ke ejaan Indonesia, yakni huruf awal yod menjadi Y.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah-tanah penggembalaannya
  rationale: Dalam konteks kota-kota orang Lewi, מִגְרָשׁ menunjuk pada lahan terbuka di sekitar kota yang disediakan antara lain untuk penggembalaan. Ungkapan ini jelas bagi pembaca Indonesia dan mempertahankan bentuk jamak Ibrani.
- source_word: בֵּית חוֹרוֹן
  choice: Bet-Horon
  rationale: Nama tempat majemuk ini ditransliterasikan secara wajar dalam bahasa Indonesia; tanda hubung membantu menunjukkan bahwa unsur-unsurnya membentuk satu nama tempat.
- source_word: וְאֶת
  choice: dan
  rationale: Dalam konteks daftar, waw diterjemahkan sebagai penghubung 'dan', sedangkan penanda objek אֶת tidak perlu dinyatakan tersendiri dalam bahasa Indonesia.
