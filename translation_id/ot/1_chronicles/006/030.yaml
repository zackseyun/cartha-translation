  text: the son of Hashabiah, the son of Amaziah, the son of Hilkiah.
translation:
  language: id
  text: anak Hasabya, anak Amazia, anak Hilkia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar silsilah, בֶּן menyatakan hubungan anak atau keturunan dalam garis keluarga. Pengulangan “anak” mempertahankan bentuk formula Ibrani dan wajar dalam silsilah bahasa Indonesia.
- source_word: חֲשַׁבְיָה
  choice: Hasabya
  rationale: Nama diri dialihaksarakan dengan bentuk yang alami dalam bahasa Indonesia; unsur akhir יָה dipertahankan sebagai “ya”.
- source_word: אֲמַצְיָה
  choice: Amazya
  rationale: Nama diri dialihaksarakan dari bahasa Ibrani dengan bentuk ringkas yang sesuai pola nama Alkitab dalam bahasa Indonesia.
- source_word: חִלְקִיָּה
  choice: Hilkia
  rationale: Bentuk “Hilkia” merupakan alih aksara yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Apakah בֶּן menunjuk anak langsung atau keturunan dalam garis silsilah
  choice: anak
  alternative: keturunan
  rationale: Teks memakai formula silsilah בֶּן secara berulang tanpa menjelaskan apakah setiap mata rantai adalah hubungan langsung. “Anak” mempertahankan ungkapan sumber dan tidak perlu memperluasnya menjadi “keturunan”.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur berulang dipertahankan karena ayat ini merupakan bagian dari daftar silsilah.
