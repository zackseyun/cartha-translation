  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּהְי֨וּ מְשָׁרְתִ֜ים לִ/פְנֵ֨י מִשְׁכַּ֤ן אֹֽהֶל מוֹעֵד֙ בַּ/שִּׁ֔יר עַד בְּנ֧וֹת שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה בִּ/ירוּשָׁלִָ֑ם וַ/יַּעַמְד֥וּ כְ/מִשְׁפָּטָ֖/ם עַל עֲבוֹדָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/017.yaml
  text: They were ministering before the tabernacle[a], the tent of meeting, with song until Solomon built the house of Yahweh in Jerusalem[c][b], and they stood according to their ordinance over their service.
translation:
  language: id
  text: Mereka melayani di hadapan Kemah Suci, yakni Kemah Pertemuan, dengan nyanyian[a] sampai Salomo membangun rumah Yahweh[b] di Yerusalem, dan mereka menjalankan pelayanan mereka menurut ketetapan mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dalam nyanyian” atau “dengan bernyanyi”.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud dengan “rumah Yahweh” ialah bait.
    reason: clarification
  - marker: c
    text: Dapat juga diterjemahkan “menurut tata yang ditetapkan bagi mereka” atau “menurut kebiasaan mereka”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתִים
  choice: melayani
  rationale: Partisip ini menunjuk pada pelaksanaan tugas pelayanan ibadah; “melayani” alami dalam bahasa Indonesia dan tetap mempertahankan nuansa kultisnya.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini mempertahankan hubungan ruang dan pelayanan yang dilakukan di depan atau dalam hadirat tempat kudus.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: Kemah Suci, yakni Kemah Pertemuan
  rationale: Kedua unsur Ibrani dipertahankan, dengan unsur kedua sebagai aposisi. “Kemah Suci” merupakan padanan Indonesia yang lazim bagi tempat kediaman suci tersebut.
- source_word: בַּשִּׁיר
  choice: dengan nyanyian
  rationale: Frasa ini menyatakan cara atau sarana pelayanan mereka dan mempertahankan unsur musikal tanpa memperluas makna.
- source_word: עַד בְּנוֹת שְׁלֹמֹה
  choice: sampai Salomo membangun
  rationale: Konstruksi infinitif diterjemahkan secara verbal agar alami dalam bahasa Indonesia sambil mempertahankan batas waktu yang ditandai עַד.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Kata “rumah” dipertahankan sebagaimana teks Ibrani, tanpa langsung menggantinya dengan tafsiran “bait”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
- source_word: וַיַּעַמְדוּ
  choice: mereka bertugas
  rationale: Secara harfiah verba ini berarti “mereka berdiri”, tetapi dalam konteks pembagian pelayanan ungkapan tersebut menunjuk pada penempatan atau pelaksanaan tugas. “Mereka bertugas” menyampaikan fungsi kontekstualnya secara alami.
- source_word: כְמִשְׁפָּטָם
  choice: menurut ketetapan yang berlaku bagi mereka
  rationale: מִשְׁפָּט di sini menunjuk pada aturan atau tata yang telah ditetapkan bagi kelompok pelayan tersebut; pilihan ini tidak mempersempitnya hanya menjadi kebiasaan.
- source_word: עַל עֲבוֹדָתָם
  choice: bertugas
  rationale: Dalam gabungan klausa, frasa ini menyatakan hubungan mereka dengan tugas pelayanan yang menjadi tanggung jawab mereka. Maknanya dirangkum secara alami dalam “bertugas” tanpa menyiratkan bahwa mereka mengawasi pelayanan orang lain.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menyebut nama perjanjian Allah Israel. Bentuk “Yahweh” mempertahankan nama tersebut sebagai nama diri tanpa mengubahnya menjadi gelar.
- issue: Makna rumah Yahweh
  choice: Mempertahankan “rumah Yahweh” dalam teks utama
  alternative: bait Yahweh
  rationale: Kata sumber adalah בַּיִת, “rumah”; konteks memang menunjuk pada bait yang dibangun Salomo, dan hal itu dijelaskan dalam catatan kaki tanpa mengganti bentuk teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat pertama mempertahankan aposisi dua sebutan tempat kudus, sedangkan kalimat kedua mengungkapkan fungsi idiomatis verba “berdiri” dalam konteks penugasan pelayanan agar mudah dipahami pembaca umum.
