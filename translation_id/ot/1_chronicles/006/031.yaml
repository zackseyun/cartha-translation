lexical_decisions:
- source_word: בֶּן
  choice: anak
  rationale: Dalam silsilah Ibrani, בֶּן dapat menyatakan anak langsung maupun keturunan dalam suatu garis. “Anak” mempertahankan bentuk ringkas dan lazim dari daftar silsilah, sedangkan kemungkinan pemampatan generasi dijelaskan dalam catatan kaki.
- source_word: אַמְצִי
  choice: Amzi
  rationale: Nama orang ditransliterasikan secara langsung dan sesuai dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: בָּנִי
  choice: Bani
  rationale: Nama orang ditransliterasikan secara langsung dari bahasa Ibrani.
- source_word: שָׁמֶר
  choice: Semer
  rationale: Nama orang ditransliterasikan menurut kaidah ejaan bahasa Indonesia; huruf Ibrani שׁ diwakili dengan “s”, sehingga bentuknya “Semer”.
