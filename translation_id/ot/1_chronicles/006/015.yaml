lexical_decisions:
- source_word: שִׁמְעָא
  choice: Simea
  rationale: Nama diri ditransliterasikan dalam bentuk yang alami menurut ejaan bahasa Indonesia.
- source_word: בְנוֹ
  choice: anaknya
  rationale: Bentuk בֵּן dengan sufiks orang ketiga tunggal maskulin menyatakan hubungan keturunan; pengulangannya dipertahankan sebagaimana dalam teks Ibrani.
- source_word: חַגִּיָּה
  choice: Hagia
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia; unsur akhir -יה direpresentasikan dengan bentuk -ia yang wajar.
- source_word: עֲשָׂיָה
  choice: Asaya
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani dengan ejaan yang mudah dibaca dalam bahasa Indonesia.
