  text: וּ/מִ/מַּטֵּ֣ה יִשָׂשכָ֔ר אֶת קֶ֖דֶשׁ וְ/אֶת מִגְרָשֶׁ֑י/הָ אֶת דָּבְרַ֖ת וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/057.yaml
  text: 'And from the tribe of Issachar: Kedesh with its pasturelands[a], and Daberath with its pasturelands.'
translation:
  language: id
  text: 'Dan dari suku Isakhar: Kedesh beserta tanah-tanah penggembalaannya, dan Daberat[a] beserta tanah-tanah penggembalaannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Daberat juga ditulis Dabrat dalam sejumlah terjemahan dan dalam daftar kota yang sejajar (bdk. Yos. 21:28).
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: Dan dari suku
  rationale: Kata מַטֶּה dalam konteks pembagian wilayah menunjuk pada suku. Awalan וּ dan מִ dipertahankan sebagai “dan dari” karena ayat ini melanjutkan daftar sebelumnya.
- source_word: יִשָּׂשכָר
  choice: Isakhar
  rationale: Bentuk nama suku yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: קֶדֶשׁ
  choice: Kedesh
  rationale: Nama tempat ditransliterasikan tanpa menambahkan keterangan geografis yang tidak terdapat dalam teks Ibrani.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada tanah terbuka di sekitar kota yang digunakan bersama, terutama untuk menggembalakan ternak. Akhiran feminin tunggal mengacu pada masing-masing kota.
- source_word: דָּבְרַת
  choice: Daberat
  rationale: Nama tempat ditransliterasikan secara wajar ke dalam ejaan Indonesia; variasi bentuk nama dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Struktur daftar dipertahankan, sementara “beserta” dipakai agar hubungan antara setiap kota dan tanah penggembalaannya jelas.
