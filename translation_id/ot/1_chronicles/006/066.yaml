  text: and Heshbon with its pasturelands[a], and Jazer with its pasturelands.
translation:
  language: id
  text: serta Hesbon dengan tanah-tanah penggembalaannya[a], dan Yaezer dengan tanah-tanah penggembalaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah-tanah umum” atau “lahan-lahan terbuka di sekelilingnya”; istilah Ibrani ini menunjuk pada lahan terbuka yang menjadi milik sebuah kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: Hesbon
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah-tanah penggembalaannya
  rationale: Dalam konteks kota-kota orang Lewi, istilah ini menunjuk pada lahan terbuka milik kota yang digunakan antara lain untuk menggembalakan ternak; akhiran feminin tunggal merujuk kepada tiap kota.
- source_word: יַעְזֵיר
  choice: Yaezer
  rationale: Nama tempat ditransliterasikan dengan mempertahankan bunyi konsonan Ibrani dan bentuk yang dikenal pembaca Alkitab Indonesia.
- source_word: וְאֶת
  choice: serta / dan
  rationale: Penanda objek tidak perlu diterjemahkan secara tersendiri; konjungsi mempertahankan susunan daftar dan menghubungkannya secara alami dengan ayat sebelumnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Ayat merupakan kelanjutan daftar dari konteks sebelumnya, sehingga diawali dengan “serta”. Pengulangan frasa dipertahankan sesuai teks Ibrani.
