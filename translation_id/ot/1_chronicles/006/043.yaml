  text: and Hilen with its pasturelands[a], Debir with its pasturelands.
translation:
  language: id
  text: dan Hilen beserta tanah-tanah penggembalaannya[a], serta Debir beserta tanah-tanah penggembalaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama tempat “Hilen” mengikuti bentuk Ibrani dalam Kitab Tawarikh. Daftar sejajar dalam Yosua 21:15 menyebutnya “Holon”.
    reason: alternative_reading
lexical_decisions:
- source_word: חִילֵז
  choice: Hilen
  rationale: Nama tempat ini ditransliterasikan langsung dari bentuk teks Ibrani Tawarikh. Huruf akhir dipahami sebagai nun, selaras dengan tradisi Masoret dan bentuk yang tercermin dalam lapisan konsultasi.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah-tanah penggembalaannya
  rationale: Istilah ini menunjuk pada lahan terbuka di sekitar kota orang Lewi, khususnya yang dapat dipakai untuk ternak. Pilihan ini lebih jelas dalam bahasa Indonesia daripada istilah teknis seperti 'tanah bersama'.
- source_word: דְּבִיר
  choice: Debir
  rationale: Nama tempat ditransliterasikan menurut bentuk Ibraninya dan ejaan yang lazim dalam bahasa Indonesia.
- source_word: וְ/אֶת
  choice: dan / serta
  rationale: Dalam konteks daftar, konjungsi memperkenalkan unsur berikutnya, sedangkan penanda objek tidak memiliki padanan tersendiri dalam bahasa Indonesia. Variasi 'dan' dan 'serta' menjaga alur daftar tetap alami.
- source_word: אֶת
  choice: —
  rationale: Penanda objek langsung dalam bahasa Ibrani tidak diterjemahkan secara tersendiri; fungsinya tercermin dalam susunan daftar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Frasa 'beserta tanah-tanah penggembalaannya' dipakai untuk memperjelas bahwa lahan tersebut terkait dengan masing-masing kota. Penanda catatan kaki [a] ditempatkan tepat setelah 'Hilen' karena catatan membahas bentuk nama tempat itu.
