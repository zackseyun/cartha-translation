  text: תַּ֤חַת בְּנ/וֹ֙ אוּרִיאֵ֣ל בְּנ֔/וֹ עֻזִּיָּ֥ה בְנ֖/וֹ וְ/שָׁא֥וּל בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/009.yaml
  text: Tahath his son[a], Uriel his son, Uzziah his son, and Shaul his son.
translation:
  language: id
  text: Tahat, anaknya; Uriel, anaknya; Uzia, anaknya; dan Saul[a], anaknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Shaul.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: Tahat
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia yang wajar; huruf akhir ת direpresentasikan dengan t.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Rumus silsilah ini secara harfiah berarti ‘anaknya’. Walaupun בֵּן kadang dapat menunjuk keturunan yang lebih jauh, teks di sini tidak memberi alasan untuk memperluas maknanya.
- source_word: אוּרִיאֵל
  choice: Uriel
  rationale: Transliterasi nama diri ini sudah alami dan lazim dalam bahasa Indonesia.
- source_word: עֻזִּיָּה
  choice: Uzia
  rationale: Bentuk ‘Uzia’ mengikuti penyesuaian ejaan nama Ibrani yang lazim dalam bahasa Indonesia, dengan unsur akhir יָּה direpresentasikan sebagai ‘-ia’.
- source_word: וְשָׁאוּל
  choice: dan Saul
  rationale: Konjungsi וְ diterjemahkan ‘dan’. ‘Saul’ adalah bentuk Indonesia yang sudah dikenal untuk nama Ibrani שָׁאוּל; bentuk yang lebih langsung, ‘Shaul’, dicatat dalam catatan kaki.
