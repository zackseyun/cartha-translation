lexical_decisions:
- source_word: בֶּן
  choice: anak
  rationale: Rumus silsilah בֶּן diulang untuk menyatakan hubungan anak dengan ayah. Padanan “anak” mempertahankan bentuk ringkas dan makna langsung teks Ibrani, tanpa menutup kemungkinan bahwa silsilah Alkitab kadang diringkas.
- source_word: מַחְלִי
  choice: Mahli
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מוּשִׁי
  choice: Musi
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia; huruf שׁ diwakili dengan “s” sesuai kelaziman nama ini dalam tradisi Alkitab Indonesia.
- source_word: מְרָרִי
  choice: Merari
  rationale: Nama diri ditransliterasikan sebagai “Merari”, bentuk yang jelas dan lazim dalam bahasa Indonesia.
- source_word: לֵוִי
  choice: Lewi
  rationale: Nama sang leluhur ditransliterasikan dengan bentuk Indonesia yang lazim, “Lewi”; konteksnya menunjuk kepada pribadi Lewi.
