  yaml_path: translation/ot/1_chronicles/006/040.yaml
  text: They gave them Hebron in the land of Judah[a], with its pasturelands around it.
translation:
  language: id
  text: Lalu mereka memberikan Hebron di tanah Yehuda kepada mereka, beserta tanah-tanah penggembalaan di sekelilingnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah-tanah terbuka”. Istilah Ibrani ini menunjuk pada lahan terbuka yang terkait dengan sebuah kota dan sering digunakan sebagai padang penggembalaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Mereka memberikan
  rationale: Bentuk wayyiqtol Qal dari נתן meneruskan rangkaian narasi dengan arti ‘lalu/dan mereka memberikan’. Dalam bahasa Indonesia, hubungan naratif dapat disampaikan secara alami tanpa menerjemahkan waw secara tersendiri.
- source_word: לָהֶם
  choice: kepada orang-orang itu
  rationale: Preposisi ל menandai penerima jamak. Karena rujukannya berasal dari konteks sebelumnya, ‘kepada orang-orang itu’ lebih jelas dan alami daripada ‘kepada mereka’ yang dapat terasa ambigu dalam ayat tunggal.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Nama tempat ini ditransliterasikan dalam bentuk yang sudah lazim dalam bahasa Indonesia.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: di tanah Yehuda
  rationale: אֶרֶץ berarti ‘tanah’, ‘negeri’, atau ‘wilayah’. ‘Tanah Yehuda’ mempertahankan ungkapan geografis teks Ibrani tanpa mempersempitnya secara berlebihan.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah-tanah penggembalaan
  rationale: מִגְרָשׁ menunjuk pada lahan terbuka yang melekat pada sebuah kota, khususnya dalam konteks kota-kota orang Lewi, dan sering dipakai untuk menggembalakan ternak. Bentuk jamak Indonesia mencerminkan bentuk jamak Ibrani.
- source_word: סְבִיבֹתֶיהָ
  choice: di sekelilingnya
  rationale: Ungkapan ini menunjukkan bahwa lahan-lahan tersebut terletak mengelilingi Hebron. Akhiran feminin tunggal merujuk pada kota itu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Beserta’ menghubungkan kota dengan lahan yang turut diberikan, sedangkan ‘tanah-tanah penggembalaan’ dipilih agar fungsi lahan mudah dipahami tanpa menutup alternatif leksikal yang dicatat dalam catatan kaki.
