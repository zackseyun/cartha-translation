lexical_decisions:
- source_word: חוּקֹק
  choice: Hukok
  rationale: Nama tempat ini ditransliterasikan sesuai teks Masoret (WLC), yang berbunyi Hukok.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah penggembalaannya
  rationale: Istilah ini menunjuk pada lahan terbuka milik kota yang antara lain digunakan untuk menggembalakan ternak; pilihan ini konkret dan sesuai dengan konteks daftar kota orang Lewi.
- source_word: רְחֹב
  choice: Rehob
  rationale: Nama tempat ditransliterasikan ke dalam bentuk yang wajar dalam bahasa Indonesia.
- source_word: וְאֶת
  choice: dan / serta
  rationale: Dalam konteks daftar, konjungsi dan penanda objek berulang disampaikan sebagai koordinasi alami; hubungan kota dengan lahannya dinyatakan melalui kata 'beserta'.
