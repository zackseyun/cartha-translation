revisions:
- from: Kepada keturunan Kehat yang masih tersisa, dari kaum-kaum suku itu, dari setengah suku—yakni bagian Manasye—diberikan sepuluh kota melalui undian.[a]
  to: Kepada keturunan Kehat yang tersisa, dari kaum dalam suku itu, dari setengah suku—yaitu setengah Manasye[a]—diberikan sepuluh kota melalui undian.
  rationale: Revisi mempertahankan susunan formulaik dan pengulangan sumber sejauh dapat dilakukan dalam bahasa Indonesia yang jelas. “Setengah Manasye” memulihkan makna eksplisit חֲצִי, “kaum” mempertahankan bentuk tunggal sumber, dan penanda catatan dipindahkan ke frasa yang dijelaskan.
