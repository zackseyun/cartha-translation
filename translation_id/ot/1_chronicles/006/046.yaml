translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar pembagian serta pengulangan penting dalam teks Ibrani dipertahankan sejauh masih jelas bagi pembaca umum; tanda pisah membantu menunjukkan bahwa frasa berikutnya menjelaskan setengah suku yang dimaksud.
