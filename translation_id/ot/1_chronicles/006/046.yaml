base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/046.yaml
  text: And to the sons of Kohath[a] who remained, from the families of the tribe, from the half-tribe, the half of Manasseh, ten cities were given by lot.
translation:
  language: id
  text: Kepada keturunan Kehat yang tersisa, dari kaum dalam suku itu, dari setengah suku—yaitu setengah Manasye[a]—diberikan sepuluh kota melalui undian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani secara harfiah berbunyi kurang lebih, “dari kaum suku itu, dari setengah suku, setengah Manasye,” sebuah rumusan yang merujuk kepada setengah suku Manasye.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: Kepada keturunan Kehat
  rationale: Dalam daftar pembagian ini, לְ menandai penerima. בְּנֵי merupakan ungkapan genealogis kolektif; “keturunan” menyampaikan maksudnya dengan wajar dalam bahasa Indonesia. “Kehat” adalah bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הַנּוֹתָרִים
  choice: yang masih tersisa
  rationale: Partisip ini menunjuk kepada kelompok keturunan Kehat yang belum memperoleh pembagian dalam daftar sebelumnya; bentuk relatif ini mempertahankan gagasan keberlanjutan keadaan tersebut.
- source_word: מִמִּשְׁפַּחַת הַמַּטֶּה
  choice: dari kaum-kaum suku itu
  rationale: מִשְׁפָּחָה menunjuk pada kelompok kekerabatan atau kaum, sedangkan מַטֶּה dalam konteks pembagian wilayah berarti suku. Bentuk “kaum-kaum” mengikuti fungsi kolektif formula daftar meskipun bentuk Ibraninya tunggal.
- source_word: מִמַּחֲצִית מַטֵּה חֲצִי מְנַשֶּׁה
  choice: dari setengah suku—yakni bagian Manasye
  rationale: Teks Ibrani bersifat padat dan berulang. Terjemahan ini mempertahankan unsur “setengah suku” serta “bagian Manasye”, sambil memakai tanda pisah dan “yakni” agar hubungan formula tersebut dapat dipahami tanpa menghapus kekhasan sumber.
- source_word: בַּגּוֹרָל
  choice: melalui undian
  rationale: Ungkapan ini menyatakan cara penetapan pembagian, yaitu dengan undian; “melalui undian” alami dan jelas dalam bahasa Indonesia.
- source_word: עָרִים עָשֶׂר
  choice: diberikan sepuluh kota
  rationale: Bahasa Ibrani tidak menyatakan verba dalam formula ini. “Diberikan” dipasok dari konteks pembagian kota, sedangkan urutan Indonesia dibuat alami.
