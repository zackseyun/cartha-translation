  variant: modern standard Indonesian
source:
  edition: WLC
  text: בֶּן יִצְהָ֣ר בֶּן קְהָ֔ת בֶּן לֵוִ֖י בֶּן יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/023.yaml
  text: son of Izhar[a], son of Kohath, son of Levi, son of Israel.
translation:
  language: id
  text: anak Yizhar, anak Kehat, anak Lewi, anak Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Israel adalah nama yang diberikan kepada Yakub.
    reason: Menjelaskan identitas tokoh tanpa mengganti nama yang digunakan dalam teks Ibrani. Penanda ditempatkan sesudah “Israel”; penempatannya sesudah “Yizhar” dalam lapisan konsultasi Inggris tampaknya tidak sesuai dengan isi catatan.
lexical_decisions:
- source_word: בֶּן
  choice: anak
  rationale: Dalam rumusan silsilah, pengulangan בֶּן paling wajar diterjemahkan secara langsung sebagai “anak”. Walaupun silsilah Ibrani kadang-kadang dapat melompati generasi, konteks langsung ayat ini tidak menuntut arti yang lebih umum seperti “keturunan”.
- source_word: יִצְהָר
  choice: Yizhar
  rationale: Nama pribadi ini ditransliterasikan mengikuti bentuk yang lazim dan dekat dengan pelafalan Ibrani dalam bahasa Indonesia.
- source_word: קְהָת
  choice: Kehat
  rationale: Nama pribadi ditransliterasikan sebagai “Kehat”, bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: לֵוִי
  choice: Lewi
  rationale: Nama pribadi ditransliterasikan sebagai “Lewi”, sesuai ejaan Indonesia yang lazim.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Teks Ibrani secara eksplisit memakai nama “Israel”, bukan “Yakub”; karena itu nama yang terdapat dalam sumber dipertahankan.
theological_decisions:
- issue: Identitas Israel dalam silsilah ini
  choice: Mempertahankan “Israel” dalam teks utama dan menjelaskan identitasnya sebagai Yakub dalam catatan kaki.
  alternative: Mengganti “Israel” dengan “Yakub” dalam teks utama.
  rationale: Penggantian dengan “Yakub” akan menjelaskan identitas tokoh tetapi tidak mereproduksi nama perjanjian yang benar-benar digunakan oleh teks Ibrani.
translation_notes:
  register: Bahasa dibuat ringkas dan formal sesuai bentuk fragmen silsilah. Pengulangan “anak” dipertahankan untuk mencerminkan struktur berantai teks Ibrani. Nama-nama memakai bentuk yang lazim bagi pembaca Alkitab bahasa Indonesia.
