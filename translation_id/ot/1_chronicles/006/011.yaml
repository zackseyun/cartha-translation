  yaml_path: translation/ot/1_chronicles/006/011.yaml
  text: Elkanah his son[a], Elkanah his son, Zophai his son, and Nahath his son.
translation:
  language: id
  text: Elkana, anaknya; Elkana, anaknya; Zofai[a], anaknya; dan Nahat, anaknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Zufai”, menurut tradisi vokalisasi atau transliterasi yang berbeda untuk nama צוֹפַי.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan alami dalam bahasa Indonesia.
- source_word: בְּנוֹ / בנו
  choice: anaknya
  rationale: Nomina dengan sufiks orang ketiga maskulin tunggal; pengulangannya dipertahankan untuk menjaga irama silsilah Ibrani.
- source_word: צוֹפַי
  choice: Zofai
  rationale: Transliterasi nama diri berdasarkan vokalisasi teks Masoret; bunyi konsonan awal צ direpresentasikan secara wajar dengan 'Z' dalam tradisi nama Alkitab bahasa Indonesia.
- source_word: וְ
  choice: dan
  rationale: Konjungsi sederhana yang menghubungkan unsur terakhir dalam rangkaian silsilah.
- source_word: נַחַת
  choice: Nahat
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia, dengan ח direpresentasikan sebagai 'h'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Tanda titik koma dipakai untuk memperjelas setiap mata rantai silsilah tanpa menghilangkan pola berulang teks Ibrani. Penanda catatan kaki ditempatkan langsung sesudah nama yang diterangkannya.
