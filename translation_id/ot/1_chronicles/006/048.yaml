base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/048.yaml
  text: To the sons of Merari, according to their clans, from the tribe of Reuben, from the tribe of Gad, and from the tribe of Zebulun, twelve cities by lot.
translation:
  language: id
  text: Kepada keturunan Merari, menurut kaum mereka, dari suku Ruben, dari suku Gad, dan dari suku Zebulon, diberikan melalui undian dua belas kota.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: kepada keturunan Merari
  rationale: Dalam konteks pembagian pusaka, frasa ini menunjuk kepada para anggota garis keturunan Merari sebagai penerima. “Keturunan” lebih alami daripada “anak-anak” dalam bahasa Indonesia ketika yang dimaksud ialah kelompok genealogis lintas generasi.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחָה di sini adalah kelompok kekerabatan di bawah tingkat suku. “Kaum” mempertahankan nuansa pembagian genealogis dan lebih tepat daripada keluarga inti.
- source_word: מִמַּטֵּה
  choice: dari suku
  rationale: Dalam konteks daftar pembagian wilayah, מַטֶּה berarti suku; pengulangannya dalam bahasa sumber dipadatkan secara wajar dalam bahasa Indonesia tanpa mengubah sumber ketiga kelompok kota tersebut.
- source_word: רְאוּבֵן ... גָד ... זְבוּלֻן
  choice: Ruben ... Gad ... Zebulon
  rationale: Nama-nama suku memakai bentuk Indonesia yang lazim dan mudah dikenali.
- source_word: בַּגּוֹרָל
  choice: melalui undian
  rationale: Frasa ini menyatakan cara penetapan pembagian kota-kota. “Melalui undian” alami dalam bahasa Indonesia dan tidak menambahkan pelaku yang tidak disebutkan.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: dua belas kota
  rationale: Urutan numeralia sebelum nomina mengikuti tata bahasa Indonesia modern, sedangkan עָרִים diterjemahkan “kota” sesuai konteks daftar permukiman.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata kerja “diberikan” disuplai untuk menghasilkan kalimat Indonesia yang utuh; tindakan pembagian tersirat oleh konstruksi datif dan konteks daftar kota. Tidak ada penanda catatan kaki karena tidak diperlukan.
