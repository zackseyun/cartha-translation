  text: לִ/בְנֵ֣י מְרָרִי֮ הַ/נּוֹתָרִים֒ מִ/מַּטֵּ֣ה זְבוּלֻ֔ן אֶת רִמּוֹנ֖וֹ וְ/אֶת מִגְרָשֶׁ֑י/הָ אֶת תָּב֖וֹר וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/062.yaml
  text: 'To the sons of Merari who remained[a], from the tribe of Zebulun: Rimmono and its pasturelands, Tabor and its pasturelands.'
translation:
  language: id
  text: Kepada keturunan Merari yang selebihnya, dari suku Zebulon, diberikan Rimono[a] beserta tanah penggembalaannya dan Tabor beserta tanah penggembalaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani di sini berbunyi “Rimono”; bagian paralel dalam Yosua 21:35 berbunyi “Dimna.”
    reason: textual_variant
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: kepada keturunan Merari
  rationale: Prefiks ל menandai pihak penerima dalam daftar pembagian kota. בְּנֵי secara harfiah berarti “anak-anak,” tetapi dalam konteks silsilah dan kelompok suku menunjuk kepada keturunan Merari.
- source_word: הַנּוֹתָרִים
  choice: yang selebihnya
  rationale: Partisip ini menunjuk kepada anggota kelompok Merari yang masih tersisa untuk menerima bagian setelah pembagian sebelumnya; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan urutan daftar.
- source_word: מִמַּטֵּה זְבוּלֻן
  choice: dari suku Zebulon
  rationale: Dalam konteks pembagian wilayah, מַטֶּה berarti “suku,” bukan tongkat secara harfiah.
- source_word: רִמּוֹנוֹ
  choice: Rimono
  rationale: Nama tempat ini ditransliterasikan dari bacaan Teks Masoret; perbedaan dengan nama dalam daftar paralel dicatat dalam catatan kaki.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah-tanah penggembalaannya
  rationale: Dalam daftar kota orang Lewi, מִגְרָשׁ menunjuk kepada lahan terbuka di sekitar kota yang digunakan antara lain untuk ternak. Pilihan ini lebih tepat daripada sekadar “daerah sekitarnya.”
- source_word: תָּבוֹר
  choice: Tabor
  rationale: Nama tempat ditransliterasikan; dalam daftar ini kata tersebut menunjuk kepada sebuah kota.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata “diberikan” ditambahkan secara implisit untuk memperjelas fungsi daftar pembagian tanpa mengubah isinya. Penanda catatan kaki ditempatkan sesudah “Rimono,” yaitu pada kata yang memiliki varian tekstual.
