  text: וְ/אֶת קְדֵמוֹת֙ וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת מֵיפַ֖עַת וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/064.yaml
  text: and Kedemoth with its pasturelands[a], and Mephaath with its pasturelands.
translation:
  language: id
  text: dan Kedemot beserta tanah penggembalaannya[a], dan Mefaat beserta tanah penggembalaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tanah terbukanya"; istilah Ibrani ini menunjuk pada lahan terbuka milik sebuah kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵמוֹת
  choice: Kedemot
  rationale: Nama tempat ditransliterasikan menurut pola yang wajar dalam bahasa Indonesia; huruf akhir ת direpresentasikan dengan t.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah penggembalaannya
  rationale: Istilah ini menunjuk pada lahan terbuka milik sebuah kota, khususnya kota-kota orang Lewi, yang dapat digunakan sebagai tempat penggembalaan. Akhiran feminin tunggal diterjemahkan dengan -nya dan merujuk pada masing-masing kota.
- source_word: מֵיפַעַת
  choice: Mefaat
  rationale: Nama tempat ditransliterasikan menurut pelafalan sumber dan ejaan Indonesia, tanpa bentuk Inggris 'ph' atau 'th'.
- source_word: וְאֶת ... וְאֶת
  choice: dan ... dan
  rationale: Gabungan konjungsi dan penanda objek langsung membentuk daftar tambahan; pengulangan 'dan' mempertahankan susunan aditif teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Frasa 'beserta' memperjelas bahwa tanah tersebut menyertai setiap kota, sedangkan pengulangan 'dan' mempertahankan bentuk daftar dalam teks sumber.
