  text: וּ/בְנֵ֧י מְרָרִ֛י אֲחֵי/הֶ֖ם עַֽל הַ/שְּׂמֹ֑אול אֵיתָן֙ בֶּן קִישִׁ֔י בֶּן עַבְדִּ֖י בֶּן מַלּֽוּךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/029.yaml
  text: 'And the sons of Merari[a], their brothers, were on the left: Ethan son of Kishi, son of Abdi, son of Malluch.'
translation:
  language: id
  text: 'Dan anak-anak Merari, saudara-saudara mereka,[a] berada di sebelah kiri: Etan anak Kisi, anak Abdi, anak Malukh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerabat mereka”; kata Ibrani yang berarti “saudara” dapat merujuk lebih luas kepada sesama anggota kaum dalam konteks silsilah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מְרָרִי
  choice: Keturunan Merari
  rationale: Dalam konteks silsilah dan kelompok suku, בְּנֵי dapat menunjuk kepada keturunan, bukan hanya anak kandung. Ungkapan ini juga lebih alami dalam bahasa Indonesia untuk memperkenalkan garis kaum Merari.
- source_word: אֲחֵיהֶם
  choice: saudara-saudara mereka
  rationale: Makna dasarnya ialah 'saudara-saudara mereka', tetapi dalam konteks suku atau silsilah dapat mencakup kerabat atau sesama anggota kaum; nuansa luas itu dicatat dalam catatan kaki.
- source_word: עַל הַשְּׂמֹאול
  choice: berada di sebelah kiri
  rationale: Frasa Ibrani secara harfiah berarti 'di sebelah kiri'. Kata 'berada' melengkapi elipsis agar kalimat alami dalam bahasa Indonesia tanpa mengubah hubungan ruangnya.
- source_word: אֵיתָן
  choice: Etan
  rationale: Transliterasi nama Ibrani yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Rumus silsilah ini secara alami diterjemahkan 'anak'; meskipun dapat mencakup keturunan yang lebih jauh dalam konteks tertentu, tidak ada alasan untuk memperlemah bentuk langsungnya di sini.
- source_word: קִישִׁי
  choice: Kisi
  rationale: Transliterasi nama Ibrani yang sesuai dengan ejaan bahasa Indonesia.
- source_word: עַבְדִּי
  choice: Abdi
  rationale: Transliterasi langsung nama diri Ibrani dan bentuk yang alami dalam ejaan Indonesia.
- source_word: מַלּוּךְ
  choice: Malukh
  rationale: Transliterasi yang mempertahankan konsonan akhir Ibrani dan membedakannya dari bentuk nama lain.
