  yaml_path: translation/ot/1_chronicles/006/033.yaml
  text: And their brothers the Levites were appointed for all the service of the tabernacle of the house of God[a].
translation:
  language: id
  text: Dan saudara-saudara mereka, yaitu orang-orang Lewi, ditugaskan[a] untuk seluruh pelayanan Kemah Suci, rumah Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “diberikan”; dalam konteks ini maksudnya ditempatkan atau ditugaskan untuk menjalankan pelayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Saudara-saudara mereka
  rationale: Mempertahankan istilah kekerabatan Ibrani secara transparan; dalam konteks ini dapat mencakup saudara sesuku atau sekerabat.
- source_word: הַלְוִיִּם
  choice: yaitu orang-orang Lewi
  rationale: Artikel dan sebutan kesukuan diterjemahkan secara wajar dalam bahasa Indonesia; “yaitu” memperjelas aposisi tanpa mengubah acuannya.
- source_word: נְתוּנִים
  choice: ditugaskan
  rationale: Partisip pasif dari נתן secara harfiah berarti “diberikan”, tetapi dalam konteks pelayanan kultis menyatakan penempatan atau penugasan untuk menjalankan pekerjaan tertentu.
- source_word: לְכָל עֲבוֹדַת
  choice: untuk seluruh pelayanan
  rationale: ל menandai tujuan atau bidang penugasan, sedangkan עֲבוֹדָה dalam konteks ibadah menunjuk pada pekerjaan pelayanan. “Seluruh” menyampaikan cakupan כָּל secara alami.
- source_word: מִשְׁכַּן
  choice: Kemah Suci
  rationale: Padanan Indonesia yang lazim dan mudah dipahami untuk tempat kediaman kudus Allah, tanpa mereduksinya menjadi Bait Allah.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Menerjemahkan frasa Ibrani secara langsung dan mempertahankannya sebagai unsur tersendiri bersama מִשְׁכַּן.
theological_decisions:
- issue: Hubungan antara “Kemah Suci” dan “rumah Allah” dalam konteks Tawarikh
  choice: Kemah Suci rumah Allah
  alternative: rumah Allah; atau Kemah Suci, yaitu rumah Allah
  rationale: Teks Ibrani memuat baik מִשְׁכַּן maupun בֵּית הָאֱלֹהִים. Keduanya dipertahankan tanpa dilebur menjadi satu istilah seperti “Bait Allah” dan tanpa menjelaskan hubungan keduanya lebih jauh daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Orang-orang Lewi” lebih alami daripada bentuk serapan “kaum Lewi” dalam aposisi ini. Frasa “Kemah Suci rumah Allah” sengaja mempertahankan kedua sebutan dalam teks Ibrani serta ketegangan hubungan di antaranya.
