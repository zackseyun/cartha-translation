  terminology: “Orang-orang Lewi,” “ditugaskan,” “pelayanan,” “Kemah Suci,” dan “Allah” sesuai dengan register Alkitab bahasa Indonesia modern. “Kemah Suci, rumah Allah” mempertahankan מִשְׁכָּן dan בֵּית הָאֱלֹהִים secara terpisah dan tidak menggantinya dengan “Bait Allah.”
