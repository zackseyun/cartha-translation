  text: son of Tahath[a], son of Assir, son of Ebiasaph, son of Korah.
translation:
  language: id
  text: anak Tahat, anak Asir, anak Ebyasaf[a], anak Korah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Abiasaf”, bentuk lain dari nama yang sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: anak
  rationale: Dalam rangkaian silsilah ini, בֶּן menyatakan hubungan sebagai anak. Pilihan “anak” paling langsung dan wajar dalam bahasa Indonesia, meskipun silsilah kuno pada umumnya kadang dapat melompati generasi.
- source_word: תַּחַת
  choice: Tahat
  rationale: Nama diri Ibrani ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia.
- source_word: אַסִּיר
  choice: Asir
  rationale: Nama diri Ibrani ditransliterasikan secara langsung dan alami dalam bahasa Indonesia.
- source_word: אֶבְיָסָף
  choice: Ebyasaf
  rationale: Transliterasi ini mencerminkan bentuk konsonantal dan vokalisasi teks Ibrani; “Abiasaf” merupakan bentuk alternatif nama yang sama.
- source_word: קֹרַח
  choice: Korah
  rationale: Nama diri Ibrani ditransliterasikan dengan bentuk yang sudah lazim dalam bahasa Indonesia.
theological_decisions: []
