  text: וּ/מִ/מַּטֵּ֣ה נַפְתָּלִ֗י אֶת קֶ֤דֶשׁ בַּ/גָּלִיל֙ וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת חַמּ֖וֹן וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת קִרְיָתַ֖יִם וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/061.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee with its pasturelands[a], Hammon with its pasturelands, and Kiriathaim with its pasturelands.'
translation:
  language: id
  text: 'Dan dari suku Naftali: Kedesh di Galilea beserta tanah penggembalaannya[a], Hamon beserta tanah penggembalaannya, dan Kiryataim beserta tanah penggembalaannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah terbukanya”; kata Ibrani ini menunjuk pada lahan terbuka milik setiap kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: Dari suku
  rationale: Dalam konteks pembagian wilayah, מַטֶּה berarti “suku”. Unsur penghubung וּ tidak perlu diterjemahkan secara tersendiri karena ayat ini merupakan kelanjutan daftar dan pembukaan “Dari” lebih alami dalam bahasa Indonesia.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Nama suku ini ditulis menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: Kedesh di Galilea
  rationale: Preposisi בְּ menunjukkan lokasi; “di Galilea” merupakan ungkapan Indonesia yang alami dan membedakan kota ini dari tempat lain yang bernama Kedesh.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada lahan terbuka milik atau di sekitar kota, khususnya untuk penggembalaan dalam konteks kota-kota Lewi. Sufiks feminin tunggal merujuk kepada masing-masing kota.
- source_word: חַמּוֹן
  choice: Hamon
  rationale: Nama tempat ini dialihaksarakan langsung ke ejaan Indonesia; konsonan rangkap tidak diperlukan untuk mewakili bentuk Ibrani dalam pemakaian Indonesia.
- source_word: קִרְיָתַיִם
  choice: Kiryataim
  rationale: Alih aksara ini mempertahankan bunyi nama Ibrani secara wajar dalam ejaan Indonesia.
theological_decisions: []
