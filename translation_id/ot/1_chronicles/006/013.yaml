source:
  edition: WLC
  text: וּ/בְנֵ֧י שְׁמוּאֵ֛ל הַ/בְּכֹ֥ר וַשְׁנִ֖י וַ/אֲבִיָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/013.yaml
  text: 'And the sons of Samuel: the firstborn[a], Vashni, and Abijah.'
translation:
  language: id
  text: 'Anak-anak Samuel ialah: yang sulung, Wasni,[a] dan Abia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Wasni. Ungkapan ini juga dapat dipahami sebagai “dan yang kedua”. Bandingkan 1 Samuel 8:2, yang menyebut anak-anak Samuel sebagai Yoel dan Abia.'
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak ... ialah
  rationale: Bentuk konstruksi בְנֵי menyatakan 'anak-anak dari'; dalam konteks silsilah bahasa Indonesia, kopula 'ialah' membuat daftar nama terbaca alami, sementara waw pembuka tidak perlu diterjemahkan secara kaku.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Nama pribadi ditransliterasikan menurut bentuk baku yang lazim dalam bahasa Indonesia.
- source_word: הַבְּכֹר
  choice: yang sulung
  rationale: Kata ini menunjukkan kedudukan berdasarkan urutan kelahiran; 'yang sulung' merupakan ungkapan genealogis yang alami dan tepat dalam bahasa Indonesia.
- source_word: וַשְׁנִי
  choice: Wasni
  rationale: Vokalisasi Masoret memperlakukannya sebagai nama diri. Bentuk tersebut dipertahankan dalam teks utama, sedangkan kemungkinan pemahaman 'dan yang kedua' dijelaskan dalam catatan kaki.
- source_word: וַאֲבִיָּה
  choice: dan Abia
  rationale: Konjungsi dan nama pribadi diterjemahkan langsung; 'Abia' mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Kesulitan nama dan urutan anak-anak Samuel dalam silsilah
  choice: Mempertahankan bentuk Masoret 'Wasni' dalam teks utama
  alternative: Memahami וַשְׁנִי sebagai 'dan yang kedua', atau menyisipkan nama Yoel berdasarkan 1 Samuel 8:2
  rationale: Teks Ibrani yang diterima dipertahankan tanpa harmonisasi diam-diam dengan 1 Samuel 8:2. Karena bentuknya dapat dipahami dengan cara lain dan ayat paralel menyebut Yoel, ketegangan tekstual dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat, dengan susunan yang alami untuk sebuah catatan silsilah. Penanda catatan kaki ditempatkan langsung sesudah 'Wasni'.
