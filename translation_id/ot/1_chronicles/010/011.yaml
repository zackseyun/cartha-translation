lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: Ketika ... mendengar
  rationale: Bentuk wayyiqtol melanjutkan alur cerita, tetapi dalam konteks ini klausa tersebut berfungsi sebagai pengantar waktu bagi tindakan pada ayat berikutnya. “Ketika ... mendengar” menyampaikan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: כֹּל יָבֵישׁ גִּלְעָד
  choice: seluruh penduduk Yabesh-Gilead
  rationale: Secara harfiah teks berbunyi “seluruh Yabesh-Gilead,” tetapi yang dimaksud dalam konteks ialah penduduk kota itu. Penyebutan “penduduk” membuat maknanya jelas dan alami tanpa mengubah acuannya.
- source_word: אֵת כָּל אֲשֶׁר
  choice: segala yang
  rationale: Ungkapan ini menyatakan keseluruhan tindakan yang diberitakan. “Segala yang” ringkas, wajar, dan dekat dengan susunan sumber.
- source_word: עָשׂוּ
  choice: telah dilakukan
  rationale: Kata “telah” menunjukkan bahwa tindakan orang Filistin terjadi sebelum kabarnya didengar oleh penduduk Yabesh-Gilead.
- source_word: פְלִשְׁתִּים
  choice: orang Filistin
  rationale: Ini adalah bentuk baku dan alami dalam bahasa Indonesia untuk menyebut kelompok bangsa tersebut.
- source_word: לְשָׁאוּל
  choice: terhadap Saul
  rationale: Preposisi לְ menandai Saul sebagai orang yang dikenai tindakan. “Terhadap Saul” alami dalam bahasa Indonesia dan tidak menentukan tindakan tertentu yang tidak dinyatakan dalam klausa ini.
