  text: וּ/פְלִשְׁתִּ֖ים נִלְחֲמ֣וּ בְ/יִשְׂרָאֵ֑ל וַ/יָּ֑נָס אִֽישׁ יִשְׂרָאֵל֙ מִ/פְּנֵ֣י פְלִשְׁתִּ֔ים וַ/יִּפְּל֥וּ חֲלָלִ֖ים בְּ/הַ֥ר גִּלְבֹּֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/001.yaml
  text: The Philistines fought against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: id
  text: Orang Filistin berperang melawan Israel, dan orang-orang Israel[a] melarikan diri dari hadapan orang Filistin serta gugur di Gunung Gilboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang Israel”; bentuk tunggal itu dipakai secara kolektif di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Orang Filistin
  rationale: Nama bangsa dinyatakan secara alami dalam bahasa Indonesia dengan bentuk “orang Filistin.” Konjungsi וּ menghubungkan narasi, tetapi tidak perlu diterjemahkan secara tersendiri pada awal ayat ini.
- source_word: נִלְחֲמוּ בְיִשְׂרָאֵל
  choice: berperang melawan Israel
  rationale: Bentuk Niphal dari לחם dengan preposisi ב dalam konteks permusuhan berarti berperang atau bertempur melawan pihak lain. “Berperang melawan” jelas dan wajar dalam bahasa Indonesia.
- source_word: וַיָּנָס אִישׁ יִשְׂרָאֵל
  choice: Orang-orang Israel melarikan diri
  rationale: אִישׁ berbentuk tunggal, tetapi berfungsi kolektif/distributif dalam konteks ini. Bentuk jamak Indonesia menyampaikan bahwa para prajurit Israel melarikan diri tanpa menimbulkan kesan bahwa hanya satu orang yang dimaksud.
- source_word: מִפְּנֵי פְלִשְׁתִּים
  choice: dari hadapan orang Filistin
  rationale: Ungkapan ini secara harfiah berarti “dari hadapan” dan dalam konteks pertempuran menyatakan mundur atau melarikan diri ketika menghadapi musuh. Pilihan ini mempertahankan citra Ibrani dan tetap dapat dipahami.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: gugur terbunuh
  rationale: Gabungan נפל dan חֲלָלִים merupakan ungkapan medan perang bagi orang-orang yang jatuh sebagai korban tewas. “Gugur terbunuh” ringkas, bermartabat, dan mempertahankan unsur jatuh serta kematian akibat kekerasan.
- source_word: בְּהַר גִּלְבֹּעַ
  choice: di Gunung Gilboa
  rationale: Preposisi ב dengan nama gunung dan konteks lokasi pertempuran secara alami diterjemahkan “di Gunung Gilboa” dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Ayat dibagi menjadi dua kalimat agar alur pertempuran mudah diikuti. “Dari hadapan” sengaja dipertahankan untuk mencerminkan idiom sumber, sedangkan “gugur terbunuh” mempertahankan nuansa medan perang.
