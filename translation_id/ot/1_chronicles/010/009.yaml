base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/009.yaml
  text: They stripped him[a], took his head and his weapons, and sent word throughout the land of the Philistines to proclaim the news to their idols and to the people.
translation:
  language: id
  text: 'Mereka melucuti dia, mengambil kepalanya dan senjata-senjatanya, lalu mengirim kabar ke seluruh negeri orang Filistin untuk memberitakan hal itu kepada berhala-berhala mereka[a] dan kepada rakyat.


    [a] Atau: “patung-patung mereka.” Istilah Ibrani ini dapat merujuk pada patung yang disembah sebagai berhala.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “patung-patung mereka.” Istilah Ibrani ini dapat merujuk pada patung yang disembah sebagai berhala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשִׁיטֻהוּ
  choice: Mereka melucuti dia
  rationale: Bentuk kausatif פשט dengan Saul sebagai objek berarti menanggalkan pakaian, perlengkapan, atau zirah dari tubuhnya. “Melucuti dia” ringkas dan wajar, tanpa secara tidak tersurat membatasi objeknya pada zirah.
- source_word: וַיִּשְׂאוּ אֶת רֹאשׁוֹ
  choice: mengambil kepalanya
  rationale: נשא dapat berarti mengangkat, membawa, atau mengambil. Dalam konteks rampasan perang, “mengambil kepalanya” menyampaikan tindakan menjadikannya tanda kemenangan tanpa menambahkan rincian yang tidak dinyatakan dalam ayat ini.
- source_word: כֵּלָיו
  choice: senjata-senjatanya
  rationale: כְּלִי mencakup perkakas, perlengkapan, dan senjata. Konteks medan perang mendukung “senjata-senjatanya,” sedangkan “zirah” lebih sempit daripada istilah Ibraninya.
- source_word: וַיְשַׁלְּחוּ בְאֶרֶץ פְלִשְׁתִּים סָבִיב
  choice: lalu mengirim kabar ke seluruh negeri orang Filistin
  rationale: Kata kerja “mengirim” tidak menyebutkan objek secara eksplisit; tujuan berikutnya menunjukkan penyampaian berita. “Mengirim kabar” mengungkapkan maksud tersebut secara alami tanpa secara khusus menambahkan para utusan.
- source_word: לְבַשֵּׂר
  choice: untuk memberitakan hal itu
  rationale: בשר berarti mengumumkan atau membawa berita, di sini berita kemenangan. “Memberitakan hal itu” mempertahankan fungsi pengumuman tanpa memberi konotasi keagamaan khusus pada kata “kabar baik.”
- source_word: עֲצַבֵּיהֶם
  choice: berhala-berhala mereka
  rationale: עֶצֶב dapat menunjuk pada patung atau gambar berhala dan dalam konteks ini bersifat kultis serta bernada negatif. Alternatif leksikal “patung-patung mereka” dipertahankan dalam catatan kaki.
- source_word: הָעָם
  choice: rakyat
  rationale: Nomina definit tunggal kolektif ini merujuk kepada masyarakat Filistin. “Rakyat” alami dalam bahasa Indonesia dan tidak menambahkan pronomina kepunyaan yang tidak terdapat dalam teks.
theological_decisions:
- issue: Makna עֲצַבֵּיהֶם dalam konteks ibadah Filistin
  choice: berhala-berhala mereka
  alternative: patung-patung mereka
  rationale: “Berhala” mempertahankan penilaian negatif yang lazim melekat pada istilah ini dalam Alkitab Ibrani, sementara catatan kaki menjaga kemungkinan bahwa rujukan konkretnya ialah patung-patung kultis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur rangkaian tindakan dipertahankan secara ringkas; istilah yang terlalu teknis atau bernuansa denominasi dihindari.
