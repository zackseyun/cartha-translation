  text: וַ/יָּשִׂ֨ימוּ֙ אֶת כֵּלָ֔י/ו בֵּ֖ית אֱלֹהֵי/הֶ֑ם וְ/אֶת גֻּלְגָּלְתּ֥/וֹ תָקְע֖וּ בֵּ֥ית דָּגֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/010.yaml
  text: They put his armor in the house of their gods[b][a], and they fastened his skull in the house of Dagon.
translation:
  language: id
  text: Mereka menaruh perlengkapan perangnya[a] di kuil dewa-dewa mereka[b], lalu memasang tengkoraknya[c] di kuil Dagon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “senjata-senjatanya” atau “zirahnya”. Kata Ibrani yang dipakai dapat mencakup berbagai jenis perlengkapan atau peralatan perang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “rumah dewa-dewa mereka” dan “rumah Dagon”. Kata Ibrani untuk “rumah” juga lazim dipakai untuk tempat ibadah atau kuil suatu dewa.
    reason: lexical_alternative
  - marker: c
    text: Atau “kepalanya”. Kata Ibrani ini dapat berarti tengkorak atau kepala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Mereka menaruh
  rationale: Kata kerja שׂים berarti menaruh, meletakkan, atau menempatkan. “Menaruh” merupakan padanan Indonesia modern yang alami dalam konteks ini.
- source_word: כֵּלָיו
  choice: perlengkapan perangnya
  rationale: כְּלִי dapat menunjuk pada barang, perkakas, senjata, atau perlengkapan. Dalam konteks kematian Saul di medan perang, “perlengkapan perangnya” mempertahankan keluasan makna tanpa membatasinya hanya pada senjata atau zirah.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: di kuil dewa-dewa mereka
  rationale: בַּיִת secara harfiah berarti “rumah”, tetapi dalam konteks pemujaan lazim menunjuk pada kuil. “Kuil” menyampaikan maksud ungkapan itu secara jelas dalam bahasa Indonesia.
- source_word: גֻּלְגָּלְתּוֹ
  choice: tengkoraknya
  rationale: גֻּלְגֹּלֶת secara khusus dapat berarti tengkorak atau kepala. “Tengkorak” lebih tepat secara leksikal dan sesuai dengan konteks pemajangan bagian tubuh sebagai trofi.
- source_word: תָקְעוּ
  choice: memasang
  rationale: תקע dapat berarti menancapkan, memasang, atau mengikatkan dengan kuat. “Memasang” menyatakan bahwa tengkorak itu ditempatkan dan dilekatkan untuk dipajang tanpa menambahkan gambaran penyaliban atau penyulaan yang tidak pasti.
- source_word: בֵּית דָּגוֹן
  choice: di kuil Dagon
  rationale: Dalam konteks tempat pemujaan, בֵּית (“rumah”) mengacu pada kuil. Dagon dipertahankan sebagai nama diri ilahi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Perlengkapan perang” dipilih untuk mempertahankan keluasan makna istilah Ibrani; “kuil” dipakai agar ungkapan kultis mudah dipahami, sedangkan bentuk harfiahnya dicatat dalam catatan kaki. Penghubung “lalu” menjaga alur naratif tanpa menyatakan hubungan sebab-akibat.
