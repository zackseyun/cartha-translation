translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan rincian konkret teks Ibrani, termasuk perbedaan antara jenazah dan tulang-belulang. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskan.
