base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/012.yaml
  text: Then all the valiant men arose and carried away the body of Saul and the bodies of his sons[a], and brought them to Jabesh[b]. They buried their bones under the oak in Jabesh and fasted seven days.
translation:
  language: id
  text: Lalu bangkitlah semua orang yang gagah berani. Mereka mengangkat jenazah Saul dan jenazah anak-anaknya, lalu membawa jenazah-jenazah itu ke Yabesh.[a] Mereka menguburkan tulang-belulang mereka di bawah pohon besar[b] di Yabesh, kemudian berpuasa selama tujuh hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam kisah yang lebih luas, tempat ini dikenal sebagai Yabesh-Gilead; teks Ibrani ayat ini hanya menyebut “Yabesh”.
    reason: cross_reference
  - marker: b
    text: Atau “pohon tarbantin” atau “pohon ek”. Kata Ibrani אֵלָה dapat menunjuk kepada pohon besar dari jenis tarbantin atau ek.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: semua orang yang gagah berani
  rationale: Ungkapan baku ini menunjuk kepada orang-orang yang memiliki kekuatan, keberanian, atau kecakapan tempur. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan nuansa keberanian mereka.
- source_word: וַיִּשְׂאוּ
  choice: mereka mengangkat
  rationale: Dalam konteks ini נשׂא berarti mengangkat dan membawa jenazah. Kata 'mengangkat' mempertahankan tindakan konkret, sementara tujuan pemindahannya dinyatakan oleh klausa berikutnya.
- source_word: גּוּפַת שָׁאוּל וְאֵת גּוּפֹת בָּנָיו
  choice: jenazah Saul dan jenazah anak-anaknya
  rationale: גּוּפָה menunjuk kepada tubuh orang mati. 'Jenazah' jelas, wajar, dan bermartabat dalam bahasa Indonesia; pengulangan mengikuti peralihan bentuk tunggal dan jamak dalam bahasa Ibrani.
- source_word: וַיְבִיאוּם יָבֵשָׁה
  choice: lalu membawanya ke Yabesh
  rationale: Teks ayat ini menyebut Yabesh, bukan bentuk lengkap Yabesh-Gilead. Akhiran pronominal Ibrani merujuk secara kolektif kepada jenazah-jenazah tersebut, sehingga 'membawanya' sesuai dengan tata bahasa Indonesia.
- source_word: עַצְמוֹתֵיהֶם
  choice: tulang-belulang mereka
  rationale: עֶצֶם secara konkret berarti 'tulang'. 'Tulang-belulang' merupakan ungkapan Indonesia yang alami untuk keseluruhan tulang atau sisa jasmani tanpa menghaluskan teks menjadi sekadar 'sisa-sisa'.
- source_word: תַּחַת הָאֵלָה
  choice: di bawah pohon besar
  rationale: אֵלָה dapat menunjuk kepada tarbantin atau jenis pohon besar yang kerap diterjemahkan sebagai pohon tarbantin atau ek. Terjemahan umum mempertahankan kepastian bahwa ini sebuah pohon besar tanpa menetapkan spesies yang tidak pasti; alternatif dicatat dalam catatan kaki.
- source_word: וַיָּצֻמוּ שִׁבְעַת יָמִים
  choice: kemudian berpuasa selama tujuh hari
  rationale: Terjemahan langsung dan alami untuk tindakan puasa perkabungan selama jangka waktu tujuh hari.
