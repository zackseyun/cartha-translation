base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/014.yaml
  text: He did not seek Yahweh[b][a], so he put him to death and turned the kingdom over to David son of Jesse.
translation:
  language: id
  text: Ia tidak mencari Yahweh[a], maka Ia membunuhnya dan mengalihkan kerajaan itu[b] kepada Daud anak Isai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “meminta petunjuk kepada Yahweh” atau “berkonsultasi dengan Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kedudukan raja” atau “kekuasaan sebagai raja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דָרַשׁ בַּיהוָה
  choice: mencari Yahweh
  rationale: Konstruksi דָרַשׁ dengan ב dan objek ilahi dapat berarti mencari, meminta petunjuk kepada, atau berkonsultasi dengan. Pilihan ini mempertahankan cakupan relasional yang luas, sementara catatan kaki menjelaskan makna meminta petunjuk dalam konteks ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap tampak.
- source_word: וַיְמִיתֵהוּ
  choice: maka Ia mematikannya
  rationale: 'Bentuk Hifil dari מות menyatakan sebab: Yahweh menyebabkan Saul mati. “Mematikannya” mempertahankan daya kausatif dan atribusi langsung dalam teks tanpa mengubahnya menjadi sekadar izin ilahi.'
- source_word: וַיַּסֵּב
  choice: mengalihkan ... kepada
  rationale: Bentuk Hifil dari סבב di sini menyatakan bahwa kekuasaan kerajaan dibuat beralih kepada penerima lain. “Mengalihkan” wajar dalam bahasa Indonesia dan mempertahankan gagasan perpindahan.
- source_word: הַמְּלוּכָה
  choice: kerajaan itu
  rationale: מְלוּכָה dapat berarti kerajaan, pemerintahan, atau kedudukan sebagai raja. “Kerajaan itu” alami dalam konteks, sedangkan kemungkinan makna “kekuasaan sebagai raja” dicatat sebagai alternatif.
- source_word: לְדָוִיד בֶּן־יִשַׁי
  choice: kepada Daud, anak Isai
  rationale: Ungkapan patronimik Ibrani diterjemahkan secara langsung dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Peran Yahweh dalam kematian Saul
  choice: Ayat ini menyatakan bahwa Yahweh mematikan Saul.
  alternative: Yahweh hanya membiarkan Saul mati.
  rationale: Subjek verba berurutan dipahami sebagai Yahweh, dan bentuk kausatif וַיְמִיתֵהוּ menyatakan tindakan ilahi tanpa pembatasan. Terjemahan tidak melunakkannya menjadi izin pasif dan juga tidak menambahkan teori mengenai sebab-sebab perantara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti “Ia” dengan huruf kapital merujuk kepada Yahweh sebagai subjek verba berikutnya; “-nya” merujuk kepada Saul. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
