source:
  edition: WLC
  text: וַ֠/יִּרְאוּ כָּל אִ֨ישׁ יִשְׂרָאֵ֤ל אֲשֶׁר בָּ/עֵ֨מֶק֙ כִּ֣י נָ֔סוּ וְ/כִי מֵ֖תוּ שָׁא֣וּל וּ/בָנָ֑י/ו וַ/יַּעַזְב֤וּ עָרֵי/הֶם֙ וַ/יָּנֻ֔סוּ וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים וַ/יֵּשְׁב֖וּ בָּ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/007.yaml
  text: When all the men of Israel who were in the valley saw that they had fled and that Saul and his sons were dead[a], they abandoned their cities and fled[c][b]; then the Philistines came and lived in them.
translation:
  language: id
  text: Ketika semua laki-laki Israel[b] yang berada di lembah[a] melihat bahwa mereka telah melarikan diri dan bahwa Saul serta anak-anaknya sudah mati, mereka meninggalkan kota-kota mereka lalu melarikan diri. Kemudian orang Filistin datang dan tinggal[c] di kota-kota itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dataran.”
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani secara harfiah memakai ungkapan maskulin, “semua laki-laki Israel.”
    reason: lexical_alternative
  - marker: c
    text: Atau “menetap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: melihat
  rationale: Mempertahankan makna dasar ראה sebagai pengamatan langsung dan kekonkretan narasi, tanpa menafsirkannya sebagai sekadar ‘menyadari’.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: semua laki-laki Israel
  rationale: אִישׁ berbentuk tunggal setelah כָּל dan memiliki daya distributif; ‘laki-laki’ mempertahankan bahasa maskulin yang nyata dalam teks Ibrani.
- source_word: אֲשֶׁר בָּעֵמֶק
  choice: yang berada di lembah
  rationale: עֵמֶק lazim berarti ‘lembah’; ‘dataran’ tetap dicatat sebagai kemungkinan leksikal.
- source_word: כִּי נָסוּ
  choice: bahwa mereka telah melarikan diri
  rationale: Subjek verba tidak dinyatakan secara eksplisit dalam bahasa Ibrani. Kata ‘mereka’ mempertahankan ketidakjelasan itu, sedangkan ‘telah’ menunjukkan bahwa pelarian sudah terjadi ketika dilihat.
- source_word: וְכִי מֵתוּ שָׁאוּל וּבָנָיו
  choice: dan bahwa Saul serta anak-anaknya sudah mati
  rationale: Ungkapan ini secara alami menyatakan keadaan yang teramati sebagai hasil kematian mereka; ‘sudah mati’ cocok dengan urutan naratif.
- source_word: וַיַּעַזְבוּ עָרֵיהֶם
  choice: mereka meninggalkan kota-kota mereka
  rationale: עזב berarti meninggalkan atau membiarkan di belakang. ‘Meninggalkan’ merupakan padanan Indonesia yang alami; konteks militer sudah menyiratkan pengosongan paksa.
- source_word: וַיָּנֻסוּ
  choice: lalu melarikan diri
  rationale: נוס merupakan verba umum untuk melarikan diri; ‘lalu’ memperjelas urutan tindakan dalam narasi.
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: Kemudian orang Filistin datang
  rationale: ‘Kemudian’ menyampaikan kemajuan urutan yang ditandai waw-konsekutif tanpa menambah isi.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: dan tinggal di kota-kota itu
  rationale: ישב dapat berarti tinggal, mendiami, atau menetap. ‘Tinggal’ jelas dan modern, sementara pengulangan ‘kota-kota itu’ memperjelas rujukan pronominal Ibrani secara alami dalam bahasa Indonesia.
theological_decisions: []
