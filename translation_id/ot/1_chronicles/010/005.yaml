translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan “Ketika …, ia pun …” menghasilkan alur narasi yang alami. Istilah peran militer “pembawa senjata” dipertahankan, dan ungkapan tentang pedang dijelaskan melalui catatan kaki tanpa menambahkan bahwa pedang itu milik pembawa senjata.
