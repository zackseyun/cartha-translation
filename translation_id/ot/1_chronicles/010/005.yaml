  text: When his armor-bearer saw that Saul was dead[b][a], he too fell on the sword and died.
translation:
  language: id
  text: Ketika pembawa senjatanya[a] melihat bahwa Saul sudah mati, ia pun jatuh ke atas pedang[b] dan mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “orang yang membawa senjata-senjatanya.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “jatuh ke atas pedang” berarti membunuh diri dengan pedang.
    reason: cultural_note
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: pembawa senjatanya
  rationale: Frasa konstruksi ini secara harfiah berarti orang yang membawa perlengkapan atau senjata Saul. “Pembawa senjata” merupakan sebutan peran militer yang alami dan tepat dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang dilihat oleh pembawa senjata, yakni keadaan Saul yang sudah mati.
- source_word: מֵת
  choice: sudah mati
  rationale: Bentuk ini menyatakan keadaan Saul pada saat dilihat. “Sudah mati” alami dalam narasi Indonesia dan tetap membedakannya dari tindakan pembawa senjata yang menyusul.
- source_word: וַיִּפֹּל
  choice: menjatuhkan diri
  rationale: Makna dasar verba ini adalah “jatuh”, tetapi bersama frasa “ke atas pedang” konteksnya menunjukkan tindakan yang disengaja. Pilihan ini membuat maksud tindakan tersebut dapat dipahami tanpa mengganti citra aslinya.
- source_word: גַּם הוּא
  choice: ia pun
  rationale: Partikel aditif dan pronomina yang ditegaskan menunjukkan bahwa pembawa senjata mengikuti Saul dalam kematian. “Ia pun” menyampaikan penekanan itu secara ringkas dan alami.
- source_word: עַל הַחֶרֶב
  choice: ke atas pedang itu
  rationale: Bahasa Ibrani menyebut “pedang itu”, bukan secara eksplisit “pedangnya”. Preposisi dan citra pedang dipertahankan, sedangkan catatan kaki menjelaskan fungsi ungkapannya.
- source_word: וַיָּמֹת
  choice: dan mati
  rationale: Terjemahan langsung ini mempertahankan urutan narasi yang singkat dan menegaskan akibat tindakannya.
