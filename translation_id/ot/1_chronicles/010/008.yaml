translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat sumber dibagi menjadi dua agar alurnya jelas bagi pembaca umum, sementara urutan kejadian dan gambaran medan perang tetap dipertahankan.
