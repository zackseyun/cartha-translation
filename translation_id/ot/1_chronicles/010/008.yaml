revisions:
- from: Keesokan harinya[a], orang Filistin datang untuk menanggalkan barang-barang dari mereka yang terbunuh[b]. Mereka menemukan Saul dan anak-anaknya telah gugur di Gunung Gilboa.
  to: Keesokan harinya[a], orang-orang Filistin datang untuk melucuti orang-orang yang terbunuh itu[b]. Mereka menemukan Saul dan putra-putranya telah gugur di Gunung Gilboa.
  rationale: Revisi mengganti ungkapan yang tidak idiomatis dengan “melucuti,” yang secara wajar menyatakan tindakan mengambil perlengkapan dari korban pertempuran dan selaras dengan לְפַשֵּׁט. “Putra-putranya” menggantikan “anak-anaknya” agar sesuai dengan בָּנָיו. Pemisahan menjadi dua kalimat tetap mempertahankan urutan dan hubungan naratif sumber.
