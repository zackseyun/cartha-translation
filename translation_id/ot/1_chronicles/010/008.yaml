base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/008.yaml
  text: It happened on the next day that the Philistines came to strip the slain[b][a], and they found Saul and his sons fallen on Mount Gilboa.
translation:
  language: id
  text: Keesokan harinya[a], orang-orang Filistin datang untuk melucuti orang-orang yang terbunuh itu[b]. Mereka menemukan Saul dan putra-putranya telah gugur di Gunung Gilboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Pada hari berikutnya.”
    reason: lexical_alternative
  - marker: b
    text: Tindakan ini berarti mengambil pakaian, perlengkapan perang, atau barang berharga dari orang-orang yang tewas di medan perang.
    reason: cultural_note
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Keesokan harinya
  rationale: Ungkapan waktu ini menunjuk pada hari sesudah peristiwa pertempuran yang baru diceritakan; bentuk ini alami dan ringkas dalam bahasa Indonesia.
- source_word: לְפַשֵּׁט
  choice: untuk menanggalkan barang-barang dari
  rationale: Dalam konteks medan perang, verba ini berarti melucuti pakaian, perlengkapan, atau barang berharga dari orang-orang yang tewas. Frasa ini menyampaikan tindakan tersebut tanpa menyiratkan bahwa yang ditanggalkan hanya pakaian.
- source_word: הַחֲלָלִים
  choice: mereka yang terbunuh
  rationale: Nomina ini secara khusus menunjuk kepada orang-orang yang terbunuh dalam pertempuran, bukan sekadar orang mati pada umumnya.
- source_word: נֹפְלִים
  choice: telah gugur
  rationale: Partisip Ibrani secara harfiah berarti 'jatuh' dan dalam narasi perang berarti tewas. 'Gugur' mempertahankan nuansa kematian dalam pertempuran secara alami dalam bahasa Indonesia.
- source_word: בְּהַר גִּלְבֹּעַ
  choice: di Gunung Gilboa
  rationale: Ini adalah padanan baku dan alami bagi nama tempat tersebut dalam bahasa Indonesia.
- source_word: וַיְהִי
  choice: Keesokan harinya
  rationale: Formula naratif dilancarkan bersama ungkapan waktu sesudahnya. Tidak ditambahkan kata 'sekarang' karena sumber tidak memuat kata waktu eksplisit dengan arti itu.
