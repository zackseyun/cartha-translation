    reason: lexical_alternative
  - marker: b
    text: Tindakan ini berarti mengambil pakaian, perlengkapan perang, atau barang berharga dari orang-orang yang tewas di medan perang.
    reason: cultural_note
  revision_rationale: Revisi mengganti ungkapan yang tidak idiomatis dengan “melucuti,” yang secara wajar menyatakan tindakan mengambil perlengkapan dari korban pertempuran dan selaras dengan לְפַשֵּׁט. “Putra-putranya” menggantikan “anak-anaknya” agar sesuai dengan בָּנָיו. Pemisahan menjadi dua kalimat tetap mempertahankan urutan dan hubungan naratif sumber.
