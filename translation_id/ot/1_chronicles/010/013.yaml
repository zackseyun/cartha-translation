id: 1CH.10.13
reference: 1 Chronicles 10:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֣מָת שָׁא֗וּל בְּ/מַֽעֲל/וֹ֙ אֲשֶׁ֣ר מָעַ֣ל בַּֽ/יהוָ֔ה עַל דְּבַ֥ר יְהוָ֖ה אֲשֶׁ֣ר לֹא שָׁמָ֑ר וְ/גַם לִ/שְׁא֥וֹל בָּ/א֖וֹב לִ/דְרֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/013.yaml
  text: So Saul died for his unfaithfulness by which he was unfaithful to Yahweh[a], because of the word of Yahweh, which he did not keep, and also because he asked counsel of a medium[b], to inquire.
translation:
  language: id
  text: Demikianlah Saul mati karena ketidaksetiaannya. Ia berlaku tidak setia terhadap Yahweh karena tidak menaati firman Yahweh, dan juga karena ia meminta petunjuk kepada seorang pemanggil arwah[a] untuk mencari jawaban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini dapat berkaitan dengan arwah atau roh yang dipanggil, maupun dengan orang yang menjadi perantaranya; bandingkan 1 Samuel 28:7.
    reason: Catatan budaya dan ambiguitas leksikal.
lexical_decisions:
- source_word: וַיָּמָת
  choice: Demikianlah ... mati
  rationale: Bentuk naratif ini melanjutkan sekaligus menyimpulkan peristiwa sebelumnya; “demikianlah” menyampaikan nuansa akibat secara wajar dalam bahasa Indonesia.
- source_word: בְּמַעֲלוֹ אֲשֶׁר מָעַל
  choice: karena ketidaksetiaannya; ia berlaku tidak setia
  rationale: Nomina dan verba serumpun menekankan pelanggaran kesetiaan perjanjian. Pengulangan akar makna dipertahankan dengan “ketidaksetiaan” dan “berlaku tidak setia”.
- source_word: בַּיהוָה
  choice: terhadap Yahweh
  rationale: Preposisi menandai pihak yang menjadi sasaran ketidaksetiaan Saul; “terhadap” alami dan tetap mempertahankan daya tuduhan teks.
- source_word: עַל דְּבַר יְהוָה אֲשֶׁר לֹא שָׁמָר
  choice: karena tidak menaati firman Yahweh
  rationale: Secara idiomatis שׁמר terhadap firman berarti memegang atau menaati. Susunan ini menyatakan alasan ketidaksetiaan tanpa menjadikan “firman” sekadar informasi.
- source_word: וְגַם לִשְׁאוֹל בָּאוֹב
  choice: dan juga karena ia meminta petunjuk kepada seorang pemanggil arwah
  rationale: Infinitif diperlakukan sebagai alasan tambahan bagi kematian Saul. אוֹב berkaitan dengan praktik meminta keterangan dari orang mati atau roh; “pemanggil arwah” jelas bagi pembaca Indonesia, sementara catatan kaki mengakui cakupan istilahnya.
- source_word: לִדְרֹשׁ
  choice: untuk mencari jawaban
  rationale: Infinitif ini menyatakan tujuan konsultasi. “Mencari jawaban” menghindari pengulangan kaku setelah “meminta petunjuk” sambil mempertahankan tindakan mencari keterangan.
theological_decisions:
- issue: Penerjemahan nama perjanjian יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi יהוה secara langsung; bentuk “Yahweh” mempertahankan nama khusus itu dan membedakannya dari gelar umum.
- issue: Sifat pelanggaran Saul
  choice: ketidaksetiaan / berlaku tidak setia
  alternative: pelanggaran / berbuat salah
  rationale: Akar מעל menggambarkan pengkhianatan atau ketidaksetiaan, khususnya dalam hubungan dengan Yahweh, bukan sekadar kesalahan umum.
- issue: Rujukan אוֹב
  choice: seorang pemanggil arwah
  alternative: arwah; perantara roh
  rationale: Dalam konteks kisah Saul, rujukannya paling wajar dipahami sebagai orang yang dimintai keterangan melalui praktik pemanggilan arwah, tetapi catatan kaki mempertahankan kemungkinan bahwa istilah Ibrani juga berkaitan dengan roh atau arwah yang dipanggil.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Struktur kalimat dipecah agar hubungan alasan jelas dan pengulangan akar kata Ibrani tetap terasa tanpa menghasilkan kalimat yang kaku.
