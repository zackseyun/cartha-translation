  text: וַ/תִּכְבַּ֤ד הַ/מִּלְחָמָה֙ עַל שָׁא֔וּל וַ/יִּמְצָאֻ֖/הוּ הַ/מּוֹרִ֣ים בַּ/קָּ֑שֶׁת וַ/יָּ֖חֶל מִן הַ/יּוֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/003.yaml
  text: The battle grew heavy against Saul, and the archers found him, and he was badly wounded by the archers.
translation:
  language: id
  text: Pertempuran makin sengit melawan Saul. Para pemanah menemukannya, dan ia terluka oleh para pemanah itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia sangat menderita karena para pemanah itu.” Verba Ibrani ini dapat dipahami sebagai penderitaan atau kegentaran yang hebat, bukan luka fisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד
  choice: makin sengit
  rationale: Secara harfiah verba כבד berarti menjadi berat, tetapi dalam konteks pertempuran menyatakan bahwa pertempuran semakin hebat atau menekan. 'Makin sengit' menyampaikan idiom itu secara alami dalam bahasa Indonesia.
- source_word: הַמִּלְחָמָה עַל שָׁאוּל
  choice: Pertempuran ... terhadap Saul
  rationale: מִלְחָמָה berarti 'pertempuran', sedangkan עַל dalam konteks permusuhan menunjukkan arah tekanan yang ditujukan kepada Saul.
- source_word: וַיִּמְצָאֻהוּ
  choice: menemukannya
  rationale: מצא lazim berarti 'menemukan'. Dalam narasi militer ungkapan ini juga dapat menyiratkan bahwa para pemanah berhasil mencapai atau mendapati Saul.
- source_word: הַמּוֹרִים בַּקָּשֶׁת
  choice: para pemanah
  rationale: Frasa ini secara harfiah menunjuk kepada orang-orang yang menembak dengan busur; 'para pemanah' adalah padanan Indonesia yang ringkas dan wajar.
- source_word: וַיָּחֶל
  choice: ia sangat terluka
  rationale: Bentuk verba yang sulit ini dapat menunjuk pada luka fisik atau penderitaan dan kegentaran yang berat. Dalam alur narasi pertempuran, luka fisik merupakan pembacaan yang masuk akal, sementara tingkat keparahannya tercermin dalam 'sangat'; ambiguitasnya tetap dicatat dalam catatan kaki.
- source_word: מִן הַיּוֹרִים
  choice: oleh para pemanah itu
  rationale: מִן dapat menandai sumber, sebab, atau pelaku. Dengan pembacaan pasif 'terluka', bahasa Indonesia secara alami memakai 'oleh'.
theological_decisions:
- issue: Apakah וַיָּחֶל menyatakan luka fisik atau penderitaan batin yang berat
  choice: ia sangat terluka
  alternative: ia sangat menderita karena para pemanah itu
  rationale: Konteks langsung mendukung pembacaan luka fisik, tetapi bentuk Ibraninya sungguh dapat dipahami sebagai penderitaan atau kegentaran berat. Karena teks tidak boleh dibuat lebih pasti daripada bukti sumber, alternatif itu disajikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Makin sengit' dipilih daripada terjemahan harfiah 'makin berat' agar idiom pertempuran terdengar alami. Pengulangan 'para pemanah' dipertahankan karena terdapat dalam teks Ibrani.
