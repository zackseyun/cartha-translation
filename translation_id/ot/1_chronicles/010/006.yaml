  yaml_path: translation/ot/1_chronicles/010/006.yaml
  text: So Saul died[a], and his three sons, and all his house died together.
translation:
  language: id
  text: Demikianlah Saul mati; ketiga putranya dan seluruh isi rumahnya[a] juga mati bersama-sama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh rumahnya.” Ungkapan Ibrani ini dapat berarti seluruh rumah tangganya, kaum keluarganya, atau garis keluarganya, bukan bangunan rumah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Demikianlah ... mati
  rationale: Bentuk wayyiqtol melanjutkan sekaligus menyimpulkan rangkaian peristiwa sebelumnya. “Demikianlah” menyatakan hasil alur itu secara alami dalam bahasa Indonesia, sedangkan מוּת diterjemahkan langsung sebagai “mati”.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Bentuk nama yang baku dan dikenal dalam bahasa Indonesia.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: bersama ketiga putranya
  rationale: Frasa ini menunjuk kepada tiga putra Saul yang sudah disebut dalam konteks. “Ketiga” menyampaikan kekhususan itu, dan “putra” sesuai dengan konteks laki-laki.
- source_word: וְכָל בֵּיתוֹ
  choice: dan seluruh isi rumahnya[a]
  rationale: Ungkapan “isi rumah” mempertahankan metafora Ibrani בַּיִת sambil menunjukkan orang-orang dalam rumah tangga atau kaum keluarga, bukan bangunan fisik semata. Catatan kaki mempertahankan keluasan maknanya.
- source_word: יַחְדָּו
  choice: bersama-sama
  rationale: Adverbia ini menekankan bahwa kematian Saul, putra-putranya, dan isi rumahnya dipandang sebagai satu peristiwa bersama.
- source_word: מֵתוּ
  choice: mati
  rationale: Bentuk perfek jamak diterjemahkan dengan verba sederhana “mati”. Pengulangan verba mengikuti penekanan dan struktur teks Ibrani.
theological_decisions:
- issue: Cakupan frasa “seluruh isi rumahnya”
  choice: Mempertahankan ungkapan luas “seluruh isi rumahnya” tanpa menafsirkannya sebagai setiap kerabat Saul tanpa kecuali.
  alternative: seluruh rumah tangganya; seluruh keluarganya; seluruh garis keluarganya
  rationale: בֵּיתוֹ dapat menunjuk kepada rumah tangga, kaum keluarga, atau garis keluarga. Terjemahan tidak boleh mengubahnya menjadi pernyataan yang lebih mutlak dan terperinci daripada teks, khususnya karena konteks langsung membicarakan mereka yang gugur bersama Saul.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Struktur kalimat mempertahankan pengulangan “mati” dari teks Ibrani, sedangkan “Demikianlah” dan “bersama” membuat hubungan antarbagiannya alami tanpa menghapus penekanan kolektif.
