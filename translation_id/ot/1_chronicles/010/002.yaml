source:
  edition: WLC
  text: וַ/יַּדְבְּק֣וּ פְלִשְׁתִּ֔ים אַחֲרֵ֥י שָׁא֖וּל וְ/אַחֲרֵ֣י בָנָ֑י/ו וַ/יַּכּ֣וּ פְלִשְׁתִּ֗ים אֶת יוֹנָתָ֧ן וְ/אֶת אֲבִינָדָ֛ב וְ/אֶת מַלְכִּי שׁ֖וּעַ בְּנֵ֥י שָׁאֽוּל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/002.yaml
  text: And the Philistines pursued Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua, the sons of Saul.
translation:
  language: id
  text: Orang Filistin mengejar Saul dan putra-putranya dari dekat[a]. Lalu orang Filistin menewaskan Yonatan, Abinadab, dan Malkisua, putra-putra Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “terus memburu Saul dan putra-putranya.” Kata Ibrani yang dipakai secara harfiah berarti “melekat” dan di sini menggambarkan pengejaran tanpa henti dalam pertempuran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ ... אַחֲרֵי
  choice: mengejar ... dari dekat
  rationale: Kata kerja דבק pada dasarnya berarti ‘melekat’ atau ‘berpegang erat’. Bersama אַחֲרֵי dalam konteks pertempuran, ungkapan ini menggambarkan pengejaran yang rapat dan tak kenal lelah. Pilihan ini alami dalam bahasa Indonesia sekaligus mempertahankan intensitasnya.
- source_word: פְלִשְׁתִּים
  choice: orang Filistin
  rationale: Bentuk baku dan lazim untuk menyebut kelompok bangsa ini. Penyebutan ulang pada klausa kedua dipertahankan sesuai penekanan narasi Ibrani.
- source_word: בָנָיו / בְּנֵי שָׁאוּל
  choice: putra-putranya / putra-putra Saul
  rationale: Kata Ibrani menunjuk kepada keturunan laki-laki, sebagaimana ditegaskan oleh nama-nama yang menyusul. ‘Putra’ tepat, ringkas, dan bermartabat dalam bahasa Indonesia modern.
- source_word: וַיַּכּוּ
  choice: menewaskan
  rationale: נכה memiliki cakupan arti ‘memukul, menghantam, merobohkan’. Dalam konteks pertempuran ini, objeknya adalah putra-putra Saul yang gugur; ‘menewaskan’ menyampaikan hasil tindakan secara alami tanpa bahasa arkais.
- source_word: יוֹנָתָן
  choice: Yonatan
  rationale: Transliterasi baku bahasa Indonesia untuk nama Ibrani ini.
- source_word: אֲבִינָדָב
  choice: Abinadab
  rationale: Transliterasi baku dan mudah dikenali dalam bahasa Indonesia.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malkisua
  rationale: Transliterasi Indonesia yang alami untuk nama Ibrani majemuk ini.
theological_decisions: []
