  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua klausa serta pengulangan ‘orang Filistin’ dipertahankan untuk mengikuti penekanan narasi sumber, sedangkan ‘lalu’ memperjelas urutan tindakan secara alami.
