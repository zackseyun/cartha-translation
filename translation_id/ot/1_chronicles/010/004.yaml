  text: וַ/יֹּ֣אמֶר שָׁאוּל֩ אֶל נֹשֵׂ֨א כֵלָ֜י/ו שְׁלֹ֥ף חַרְבְּ/ךָ֣ וְ/דָקְרֵ֣/נִי בָ֗/הּ פֶּן יָבֹ֜אוּ הָ/עֲרֵלִ֤ים הָ/אֵ֨לֶּה֙ וְ/הִתְעַלְּלוּ בִ֔/י וְ/לֹ֤א אָבָה֙ נֹשֵׂ֣א כֵלָ֔י/ו כִּ֥י יָרֵ֖א מְאֹ֑ד וַ/יִּקַּ֤ח שָׁאוּל֙ אֶת הַ/חֶ֔רֶב וַ/יִּפֹּ֖ל עָלֶֽי/הָ־׀־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and mistreat me.” But his armor-bearer was not willing, because he was very afraid[c][b]. So Saul took the sword and fell on it.
translation:
  language: id
  text: Lalu Saul berkata kepada pembawa senjatanya, “Hunuslah pedangmu dan tikamlah aku dengannya, agar orang-orang yang tidak bersunat ini tidak datang dan memperlakukan aku semena-mena.”[a] Tetapi pembawa senjatanya tidak mau, sebab ia sangat takut. Maka Saul mengambil pedang itu dan jatuh ke atasnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini juga dapat diterjemahkan “mempermainkan aku,” “memperlakukan aku dengan kejam,” atau “memperlakukan aku secara memalukan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: pembawa senjatanya
  rationale: Ungkapan ini secara harfiah menunjuk kepada orang yang membawa perlengkapan atau senjata Saul; “pembawa senjata” merupakan padanan militer yang wajar dalam bahasa Indonesia.
- source_word: שְׁלֹף חַרְבְּךָ
  choice: Hunuslah pedangmu
  rationale: Dalam konteks pedang, kata kerja שלף berarti menarik senjata dari sarungnya; “hunuslah” tepat, ringkas, dan bermartabat.
- source_word: וְדָקְרֵנִי בָהּ
  choice: dan tikamlah aku dengannya
  rationale: דקר menyatakan tindakan menusuk dengan senjata. “Tikamlah” menyampaikan tindakan dan maksud mematikan tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: פֶּן
  choice: supaya jangan
  rationale: Padanan ini mempertahankan nuansa pencegahan terhadap hasil yang ditakuti Saul dan tetap alami dalam bahasa Indonesia.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: orang-orang yang tidak bersunat ini
  rationale: Terjemahan ini mempertahankan sebutan polemis etnis-keagamaan dalam teks dan tidak menggantinya secara interpretatif dengan “orang Filistin.”
- source_word: וְהִתְעַלְּלוּ בִי
  choice: dan berbuat sewenang-wenang terhadapku
  rationale: Bentuk ini mencakup perlakuan kejam, merendahkan, atau mempermainkan korban tanpa menentukan satu bentuk penghinaan atau kekerasan tertentu.
- source_word: וְלֹא אָבָה
  choice: tidak mau
  rationale: אָבָה berarti bersedia atau menyetujui; bentuk negatifnya paling alami diterjemahkan “tidak mau.”
- source_word: כִּי יָרֵא מְאֹד
  choice: sebab ia sangat takut
  rationale: Terjemahan langsung ini mempertahankan alasan yang diberikan teks serta penegasan מְאֹד.
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: dan menjatuhkan dirinya ke atasnya
  rationale: Secara harfiah berarti “jatuh ke atasnya.” Bentuk refleksif dalam bahasa Indonesia memperjelas tindakan Saul yang disengaja, sedangkan pronomina tetap merujuk kepada pedang.
theological_decisions:
- issue: Sifat perlakuan yang ditakuti Saul
  choice: berbuat sewenang-wenang terhadapku
  alternative: mempermainkan aku; memperlakukan aku dengan kejam; mempermalukan aku
  rationale: Kata Ibrani menggambarkan perlakuan yang kejam dan merendahkan, tetapi tidak menetapkan bentuknya secara khusus. Pilihan ini mempertahankan keluasan dan ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “hunuslah” mempertahankan suasana militer, sementara susunan kalimat dibuat jelas bagi pembaca umum. Penanda catatan kaki [a] ditempatkan tepat setelah klausa yang dijelaskannya.
