source:
  edition: WLC
  text: עַתָּ֗ה תְּנ֤וּ לְבַבְ/כֶם֙ וְ/נַפְשְׁ/כֶ֔ם לִ/דְר֖וֹשׁ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/ק֗וּמוּ וּ/בְנוּ֙ אֶת מִקְדַּשׁ֙ יְהוָ֣ה הָֽ/אֱלֹהִ֔ים לְ/הָבִ֞יא אֶת אֲר֣וֹן בְּרִית יְהוָ֗ה וּ/כְלֵי֙ קֹ֣דֶשׁ הָֽ/אֱלֹהִ֔ים לַ/בַּ֖יִת הַ/נִּבְנֶ֥ה לְ/שֵׁם יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/019.yaml
  text: Now set your heart and your soul to seek Yahweh your God[a]. Rise up and build the sanctuary of Yahweh God[b], to bring the ark of the covenant of Yahweh and the holy vessels of God into the house that is to be built for the name of Yahweh.
translation:
  language: id
  text: Sekarang, arahkanlah hati dan jiwa kalian untuk mencari Yahweh, Allah kalian.[a] Bangkitlah dan bangunlah tempat kudus Yahweh Allah untuk membawa Tabut Perjanjian Yahweh dan perlengkapan kudus Allah ke dalam rumah[b] yang akan dibangun bagi nama Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “berikanlah hati dan jiwa kalian” untuk mencari Yahweh, Allah kalian.'
    reason: lexical_alternative
  - marker: b
    text: “Rumah” di sini mengacu pada bangunan bait yang akan didirikan bagi nama Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: Sekarang
  rationale: Penanda waktu sekaligus wacana yang mengawali desakan; “Sekarang” langsung dan alami dalam bahasa Indonesia.
- source_word: תְּנוּ לְבַבְכֶם וְנַפְשְׁכֶם
  choice: arahkanlah hati dan jiwamu
  rationale: Secara harfiah berarti “berikanlah hati dan jiwamu.” Pilihan “arahkanlah” menyampaikan tekad yang disengaja secara alami sambil mempertahankan kedua istilah antropologis Ibrani.
- source_word: לִדְרוֹשׁ
  choice: untuk mencari
  rationale: Dalam hubungan dengan Allah, דרשׁ lazim menunjuk pada tindakan mencari Dia dengan kesungguhan dan ketergantungan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang hadir langsung dalam teks Ibrani.
- source_word: וְקוּמוּ וּבְנוּ
  choice: Bangkitlah dan bangunlah
  rationale: Mempertahankan dua bentuk perintah yang terkoordinasi serta nada seruan yang kuat dan bermartabat.
- source_word: מִקְדַּשׁ
  choice: tempat kudus
  rationale: Menyatakan sebuah tempat yang dikhususkan sebagai kudus tanpa menyamakannya begitu saja dengan seluruh bangunan rumah yang disebut kemudian.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: Tabut Perjanjian Yahweh
  rationale: Ungkapan baku dan jelas yang mempertahankan hubungan antara tabut, perjanjian, dan Yahweh.
- source_word: כְלֵי קֹדֶשׁ הָאֱלֹהִים
  choice: perkakas-perkakas kudus Allah
  rationale: כְּלִי mencakup berbagai benda atau perlengkapan ibadah; “perkakas-perkakas” mempertahankan bentuk jamak dan fungsi kultisnya.
- source_word: לַבַּיִת הַנִּבְנֶה לְשֵׁם יְהוָה
  choice: ke dalam rumah yang akan dibangun bagi nama Yahweh
  rationale: Mempertahankan metafora “rumah,” konstruksi partisipial yang berorientasi ke masa depan, dan ungkapan teologis “bagi nama Yahweh.”
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Pasangan antropologis לֵבָב dan נֶפֶשׁ
  choice: hati dan jiwa
  alternative: seluruh dirimu atau pikiran dan jiwamu
  rationale: Kedua istilah dipertahankan agar daya retoris dan keluasan pengabdian tetap terasa tanpa menetapkan antropologi teknis yang tidak dinyatakan teks.
- issue: Hubungan מִקְדַּשׁ dengan בַּיִת
  choice: tempat kudus dan rumah dibedakan dalam teks utama
  alternative: keduanya diterjemahkan sebagai bait
  rationale: Bahasa Ibrani memakai dua kata berbeda. Mempertahankan keduanya menjaga nuansa bahwa bangunan itu adalah rumah yang dikhususkan sebagai tempat kudus.
- issue: Makna “bagi nama Yahweh”
  choice: dipertahankan secara formal
  alternative: untuk menghormati Yahweh
  rationale: Ungkapan nama ilahi memiliki bobot teologis dan tidak boleh direduksi diam-diam menjadi sekadar penghormatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “-lah” mempertahankan nada seruan tanpa menjadi terlalu arkais. Pronomina tunggal “-mu” mengikuti sasaran nasihat dalam konteks, sedangkan ungkapan sumber berbentuk jamak sebagai sapaan kolektif; terjemahan Indonesia membiarkan cakupan kolektif dipahami dari konteks.
