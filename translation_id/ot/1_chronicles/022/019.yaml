  naturalness: Bahasanya baku dan mudah dipahami. “Arahkanlah hati dan jiwa kalian” adalah ungkapan modern yang wajar. “Perkakas-perkakas” dapat dipahami, tetapi “perlengkapan kudus” lebih lazim untuk כלי dalam konteks peribadatan.
  terminology: “Yahweh,” “Allah,” “Tabut Perjanjian,” “tempat kudus,” dan “nama Yahweh” tepat. “Rumah” perlu tetap dipertahankan dalam teks, dengan catatan yang menerangkan bahwa yang dimaksud adalah bangunan bait.
