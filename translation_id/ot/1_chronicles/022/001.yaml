base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/001.yaml
  text: Then David said[a], “This is the house of Yahweh God[b], and this is the altar for burnt offering for Israel.”
translation:
  language: id
  text: Lalu Daud berkata, “Inilah rumah Yahweh Allah,[a] dan inilah mazbah untuk kurban bakaran bagi Israel.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan, “Bait Yahweh Allah.” Ibrani secara harfiah: “rumah Yahweh Allah.” Dalam konteks ini, “rumah” menunjuk kepada Bait Allah yang akan dibangun.'
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “mazbah untuk kurban-kurban bakaran bagi Israel.” Bentuk Ibraninya tunggal, tetapi dapat dipahami secara generik atau kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk waw-konsekutif melanjutkan alur kisah; “lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: דָּוִיד
  choice: Daud
  rationale: Bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: זֶה הוּא
  choice: Inilah
  rationale: Gabungan kata penunjuk dan pronomina memberi penegasan identifikasi; “inilah” mempertahankan daya tunjuk tersebut secara alami.
- source_word: בֵּית
  choice: rumah
  rationale: Terjemahan langsung yang mempertahankan ungkapan sumber dan gaung teologisnya; “Bait” atau “kuil” akan lebih interpretatif dalam konteks ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani dan tidak menggantinya dengan gelar.
- source_word: הָאֱלֹהִים
  choice: Allah itu
  rationale: 'Artikel pada bentuk Ibrani dipertahankan sebagai penegasan apposisional: Yahweh adalah Allah itu. Catatan kaki memberi alternatif Indonesia yang lebih tradisional.'
- source_word: מִּזְבֵּחַ
  choice: mazbah
  rationale: Istilah Indonesia yang tepat dan bermartabat untuk bangunan tempat persembahan kurban.
- source_word: לְעֹלָה
  choice: untuk kurban bakaran
  rationale: Nomina tunggal Ibrani dipertahankan, tetapi dapat berfungsi secara generik atau kolektif.
- source_word: לְיִשְׂרָאֵל
  choice: bagi Israel
  rationale: Menyatakan hubungan atau peruntukan bagi umat Israel secara ringkas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi; “Yahweh” mempertahankan nama tersebut, bukan menggantinya dengan gelar.
- issue: Hubungan יְהוָה dengan הָאֱלֹהִים yang berartikel
  choice: Yahweh, Allah itu
  alternative: Yahweh Allah
  rationale: Bentuk “Allah itu” mempertahankan kemungkinan daya identifikasi dari artikel Ibrani tanpa menutup pembacaan tradisional sebagai rangkaian sebutan ilahi.
- issue: Arti בֵּית dalam konteks lokasi Bait Allah
  choice: rumah
  alternative: Bait Allah
  rationale: Teks Ibrani secara langsung mengatakan “rumah”; pilihan ini menghindari penggantian dengan istilah arsitektural yang lebih interpretatif.
- issue: Bilangan pada עֹלָה
  choice: kurban bakaran (tunggal generik)
  alternative: kurban-kurban bakaran
  rationale: Bentuk Ibrani tunggal dapat menunjuk jenis persembahan secara umum, sehingga ambiguitas jumlah dipertahankan dan dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Inilah” mempertahankan penegasan deiktis, “rumah” mengikuti citra Ibrani, dan “mazbah” mempertahankan istilah kultis yang lazim dalam bahasa Alkitab Indonesia.
