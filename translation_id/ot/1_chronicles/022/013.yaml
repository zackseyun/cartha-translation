  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָ֣ז תַּצְלִ֔יחַ אִם תִּשְׁמ֗וֹר לַ/עֲשׂוֹת֙ אֶת הַֽ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה עַל יִשְׂרָאֵ֑ל חֲזַ֣ק וֶ/אֱמָ֔ץ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/013.yaml
  text: Then you will prosper[a], if you are careful to do the statutes and the judgments that Yahweh commanded Moses for Israel. Be strong and courageous. Do not fear[b], and do not be dismayed.
translation:
  language: id
  text: Maka engkau akan berhasil[a], jika engkau berhati-hati untuk melakukan ketetapan-ketetapan dan peraturan-peraturan[b] yang Yahweh perintahkan kepada Musa bagi Israel.[c] Kuatlah dan beranilah. Jangan takut dan jangan patah semangat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan menjadi makmur.” Kata kerja Ibrani dapat menyatakan keberhasilan ataupun keadaan yang makmur.
    reason: lexical_alternative
  - marker: b
    text: Dua istilah hukum Ibrani yang berbeda juga dapat diterjemahkan “ketetapan-ketetapan dan hukum-hukum.”
    reason: lexical_alternative
  - marker: c
    text: Atau “mengenai Israel.”
    reason: source_ambiguity
lexical_decisions:
- source_word: אָז
  choice: Maka
  rationale: Menandai hasil yang mengikuti nasihat sebelumnya; “maka” alami sebagai penghubung konsekuensi dalam bahasa Indonesia.
- source_word: תַּצְלִיחַ
  choice: engkau akan berhasil
  rationale: Bentuk Hifil dari צלח dapat berarti berhasil atau menjadi makmur. “Berhasil” paling alami dalam konteks pelaksanaan tugas, sementara alternatif makna dipertahankan dalam catatan kaki.
- source_word: אִם תִּשְׁמֹר לַעֲשׂוֹת
  choice: jika engkau dengan cermat melakukan
  rationale: Gabungan verba “menjaga” dengan infinitif “melakukan” menyatakan pelaksanaan yang penuh perhatian dan ketaatan.
- source_word: הַחֻקִּים וְאֶת הַמִּשְׁפָּטִים
  choice: segala ketetapan dan peraturan
  rationale: Dua istilah hukum Ibrani dipertahankan sebagai dua sebutan berbeda. “Ketetapan” mencerminkan חֻקִּים, sedangkan “peraturan” menyampaikan nuansa normatif-yudisial מִשְׁפָּטִים secara wajar dalam bahasa Indonesia.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה עַל יִשְׂרָאֵל
  choice: yang Yahweh perintahkan kepada Musa untuk Israel
  rationale: Musa adalah orang yang diperintah, sedangkan עַל יִשְׂרָאֵל menunjukkan Israel sebagai pihak atau lingkup yang dituju. Kemungkinan “mengenai Israel” dicatat sebagai alternatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang dinyatakan oleh Tetragramaton, bukan menggantinya dengan gelar.
- source_word: חֲזַק וֶאֱמָץ
  choice: Kuatlah dan beranilah
  rationale: Menyampaikan rumusan seruan Ibrani secara ringkas, alami, dan tegas.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: Jangan takut dan jangan patah semangat
  rationale: Larangan pertama menyangkut rasa takut; yang kedua menggambarkan keadaan batin yang runtuh atau kehilangan keberanian. “Patah semangat” membedakan keduanya secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Hubungan ketaatan dan keberhasilan
  choice: 'Pernyataan bersyarat dipertahankan: “akan berhasil ... jika”'
  alternative: Mengubahnya menjadi jaminan kemakmuran tanpa syarat
  rationale: Struktur Ibrani mengaitkan keberhasilan dalam konteks tugas Salomo dengan ketaatan terhadap ketetapan dan peraturan; terjemahan tidak memperluasnya menjadi janji umum tentang kekayaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “engkau” sesuai dengan sapaan langsung seorang ayah kepada anaknya dalam konteks naratif. Pengulangan imperatif dibuat ringkas agar kekuatan retoris teks Ibrani tetap terasa.
