  text: וַ/עֲצֵ֥י אֲרָזִ֖ים לְ/אֵ֣ין מִסְפָּ֑ר כִּֽי הֵ֠בִיאוּ הַ/צִּֽידֹנִ֨ים וְ/הַ/צֹּרִ֜ים עֲצֵ֧י אֲרָזִ֛ים לָ/רֹ֖ב לְ/דָוִֽיד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/004.yaml
  text: and cedar timbers without number[a], for the Sidonians and Tyrians had brought cedar timbers in abundance to David.
translation:
  language: id
  text: dan kayu aras yang tidak terhitung banyaknya,[a] karena orang Sidon dan orang Tirus telah membawa kayu aras dalam jumlah besar kepada Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batang-batang kayu aras.” Kata Ibrani dapat menunjuk secara umum pada bahan dari pohon aras, tetapi dalam konteks pembangunan ini kemungkinan besar yang dimaksud ialah kayu untuk konstruksi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲצֵי אֲרָזִים
  choice: dan kayu aras
  rationale: Dalam konteks persediaan untuk pembangunan, frasa ini menunjuk pada bahan kayu aras, bukan terutama pohon yang masih berdiri. 'Kayu aras' alami dalam bahasa Indonesia dan tetap mempertahankan keluasan makna Ibrani.
- source_word: לְ/אֵין מִסְפָּר
  choice: yang tidak terhitung banyaknya
  rationale: Ungkapan ini menyatakan jumlah yang tak dapat dihitung. Pilihan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan bagi banyaknya persediaan kayu aras.
- source_word: הֵבִיאוּ
  choice: telah membawa
  rationale: Bentuk perfektif menyatakan tindakan membawa yang sudah terjadi dan menjelaskan tersedianya kayu tersebut bagi Daud.
- source_word: הַ/צִּידֹנִים
  choice: orang Sidon
  rationale: Bentuk gentilika jamak ini menunjuk kepada penduduk Sidon; 'orang Sidon' merupakan bentuk Indonesia yang ringkas dan lazim.
- source_word: וְ/הַ/צֹּרִים
  choice: dan orang Tirus
  rationale: Bentuk gentilika jamak ini menunjuk kepada penduduk Tirus dan berpadanan alami dengan 'orang Sidon'.
- source_word: לָ/רֹב
  choice: dalam jumlah besar
  rationale: Frasa ini menyatakan kuantitas yang berlimpah; pilihan ini konkret dan sesuai dengan konteks bahan bangunan.
- source_word: לְ/דָוִד
  choice: kepada Daud
  rationale: Preposisi ל menandai Daud sebagai penerima, sehingga 'kepada Daud' adalah padanan langsung.
theological_decisions: []
