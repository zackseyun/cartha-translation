  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Struktur sebab-akibat dipertahankan, dan istilah bagi penduduk kota diterjemahkan secara alami sebagai 'orang Sidon' dan 'orang Tirus'.
