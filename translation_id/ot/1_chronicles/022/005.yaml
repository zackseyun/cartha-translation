  text: וַ/יֹּ֣אמֶר דָּוִ֗יד שְׁלֹמֹ֣ה בְנִ/י֮ נַ֣עַר וָ/רָךְ֒ וְ/הַ/בַּ֜יִת לִ/בְנ֣וֹת לַ/יהוָ֗ה לְ/הַגְדִּ֨יל לְ/מַ֜עְלָ/ה לְ/שֵׁ֤ם וּ/לְ/תִפְאֶ֨רֶת֙ לְ/כָל הָ֣/אֲרָצ֔וֹת אָכִ֥ינָה נָּ֖א ל֑/וֹ וַ/יָּ֧כֶן דָּוִ֛יד לָ/רֹ֖ב לִ/פְנֵ֥י מוֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/005.yaml
  text: And David said[a], “My son Solomon is young and inexperienced, and the house to be built for Yahweh must be made exceedingly great in fame and splendor in all lands[c][b]. I will now make preparation for it.” So David made abundant preparations before his death.
translation:
  language: id
  text: Daud berkata, “Salomo, anakku, masih muda dan belum berpengalaman[a], sedangkan rumah yang akan dibangun bagi Yahweh[b] harus dibuat sangat megah, supaya namanya termasyhur dan keagungannya dikenal di segala negeri[c]. Sekarang aku akan mengadakan persiapan baginya[d].” Maka Daud mengadakan persiapan berlimpah-limpah sebelum ia meninggal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “muda dan lembut.” Kata Ibrani yang diterjemahkan “belum berpengalaman” dapat berarti lembut, lemah, atau belum matang.
    reason: lexical_alternative
  - marker: b
    text: Yahweh adalah nama Allah dalam teks Ibrani.
    reason: divine_name
  - marker: c
    text: Atau, “untuk nama dan keagungan di segala negeri.”
    reason: lexical_alternative
  - marker: d
    text: Kata “baginya” dapat merujuk kepada Salomo atau kepada rumah yang akan dibangun.
    reason: referential_ambiguity
lexical_decisions:
- source_word: נַעַר וָרָךְ
  choice: masih muda dan belum berpengalaman
  rationale: נַעַר menunjukkan usia yang relatif muda, sedangkan רַךְ secara harfiah berarti lembut atau belum matang. Dalam konteks alasan Daud menyiapkan pembangunan, gabungan ini secara alami menyatakan kemudaan dan kurangnya pengalaman Salomo.
- source_word: הַבַּיִת
  choice: rumah
  rationale: Mempertahankan istilah konkret dalam bahasa Ibrani. Konteks menjelaskan bahwa yang dimaksud ialah rumah ibadah bagi Yahweh; catatan kaki memberi alternatif interpretatif 'Bait Allah'.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai Yahweh, sesuai bentuk nama perjanjian dalam teks sumber.
- source_word: לְהַגְדִּיל לְמַעְלָה
  choice: harus dibuat luar biasa megah
  rationale: Ungkapan intensif ini menyatakan bahwa bangunan tersebut harus dibuat sangat besar atau luhur. 'Luar biasa megah' menyampaikan skala dan keagungannya dalam bahasa Indonesia yang wajar.
- source_word: לְשֵׁם וּלְתִפְאֶרֶת לְכָל הָאֲרָצוֹת
  choice: supaya termasyhur dan menjadi kemuliaan di segala negeri
  rationale: Mempertahankan dua unsur tujuan/hasil, yaitu nama atau kemasyhuran dan kemuliaan atau keindahan, serta jangkauannya di berbagai negeri.
- source_word: אָכִינָה נָּא לוֹ
  choice: Karena itu, sekarang aku akan membuat persiapan baginya
  rationale: Bentuk kohortatif menyatakan tekad Daud. נָא di sini wajar dipahami sebagai penegas dorongan atau tindakan segera. Sufiks לוֹ secara gramatikal dapat merujuk kepada Salomo ataupun rumah/proyek, sehingga 'baginya' mempertahankan ambiguitas itu.
- source_word: לָרֹב
  choice: dalam jumlah besar
  rationale: Ungkapan adverbial ini menekankan banyaknya persiapan yang dibuat Daud.
- source_word: לִפְנֵי מוֹתוֹ
  choice: sebelum meninggal
  rationale: Terjemahan temporal yang alami dan setia pada makna 'sebelum kematiannya'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi יהוה; 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Apakah הַבַּיִת diterjemahkan secara harfiah atau interpretatif
  choice: rumah
  alternative: Bait Allah
  rationale: Kata sumber berarti 'rumah'. Terjemahan utama mempertahankan metafora dan istilah Ibrani, sementara alternatif interpretatif dijelaskan dalam catatan kaki.
- issue: Rujukan sufiks לוֹ
  choice: baginya, dengan rujukan sengaja dibiarkan terbuka
  alternative: untuk rumah itu / untuk Salomo
  rationale: Bentuk maskulin tunggal dapat dikaitkan dengan Salomo atau dengan הַבַּיִת ('rumah'), yang juga bergender maskulin. Terjemahan tidak memaksakan salah satu rujukan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan istilah 'rumah', nama 'Yahweh', tujuan ganda dalam לְשֵׁם וּלְתִפְאֶרֶת, serta ambiguitas rujukan לוֹ.
