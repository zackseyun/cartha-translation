  text: לַ/זָּהָ֥ב לַ/כֶּ֛סֶף וְ/לַ/נְּחֹ֥שֶׁת וְ/לַ/בַּרְזֶ֖ל אֵ֣ין מִסְפָּ֑ר ק֣וּם וַ/עֲשֵׂ֔ה וִ/יהִ֥י יְהוָ֖ה עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/016.yaml
  text: For the gold[a], the silver, the bronze, and the iron, there is no number. Rise up and work[c][b], and may Yahweh be with you.
translation:
  language: id
  text: Mengenai emas, perak, perunggu, dan besi, jumlahnya tidak terhitung.[a] Bangkitlah dan bekerjalah, dan kiranya Yahweh menyertaimu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “tidak ada jumlah.” Maksudnya, jumlahnya melampaui hitungan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dan Yahweh akan menyertaimu” atau “dan biarlah Yahweh menyertaimu.” Bentuk Ibraninya dapat menyatakan harapan atau berkat.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַזָּהָב לַכֶּסֶף וְלַנְּחֹשֶׁת וְלַבַּרְזֶל
  choice: Mengenai emas, perak, perunggu, dan besi
  rationale: Prefiks ל pada daftar bahan dipahami secara topikal, yakni ‘mengenai’, yang secara alami meneruskan pembicaraan tentang bahan-bahan untuk pembangunan.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam daftar bahan bangunan dan perlengkapan ibadah kuno, istilah ini lazim menunjuk pada perunggu, meskipun secara leksikal dapat pula berarti tembaga.
- source_word: אֵין מִסְפָּר
  choice: jumlahnya tidak terhitung
  rationale: Ungkapan Ibrani menyatakan jumlah yang tak dapat dihitung; pilihan ini alami dalam bahasa Indonesia sekaligus mempertahankan gagasan jumlah.
- source_word: קוּם וַעֲשֵׂה
  choice: Bangkitlah dan bekerjalah
  rationale: Dua bentuk imperatif dipertahankan. ‘Bangkitlah’ menyampaikan dorongan untuk mulai bertindak, sedangkan ‘bekerjalah’ sesuai dengan konteks pekerjaan pembangunan.
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: dan kiranya Yahweh menyertaimu
  rationale: Bentuk yiqtol/jusif di sini paling wajar dibaca sebagai harapan atau berkat. ‘Kiranya’ mempertahankan nuansa tersebut tanpa mengubahnya menjadi pernyataan masa depan yang pasti.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. ‘Yahweh’ mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Nuansa וִיהִי dalam ucapan penutup
  choice: kiranya Yahweh menyertaimu
  alternative: Yahweh akan menyertaimu; biarlah Yahweh menyertaimu
  rationale: Bentuk Ibrani dapat dipahami sebagai harapan atau berkat, bukan semata-mata prediksi. Terjemahan utama mempertahankan nuansa optatif tersebut, sementara kemungkinan lain dicatat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk tunggal ‘-mu’ dipakai karena ucapan ditujukan kepada Salomo. Susunan daftar bahan dibuat ringkas, sedangkan dua perintah dan nuansa berkat dipertahankan.
