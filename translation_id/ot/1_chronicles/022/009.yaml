  variant: modern standard Indonesian
source:
  edition: WLC
  text: הִנֵּה בֵ֞ן נוֹלָ֣ד לָ֗/ךְ ה֤וּא יִהְיֶה֙ אִ֣ישׁ מְנוּחָ֔ה וַ/הֲנִח֥וֹתִי ל֛/וֹ מִ/כָּל אוֹיְבָ֖י/ו מִ/סָּבִ֑יב כִּ֤י שְׁלֹמֹה֙ יִהְיֶ֣ה שְׁמ֔/וֹ וְ/שָׁל֥וֹם וָ/שֶׁ֛קֶט אֶתֵּ֥ן עַל יִשְׂרָאֵ֖ל בְּ/יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/009.yaml
  text: Behold[a], a son will be born to you. He will be a man of rest, and I will give him rest from all his enemies all around; for Solomon will be his name[b], and I will give peace and quiet to Israel in his days.
translation:
  language: id
  text: Lihatlah, seorang anak laki-laki akan lahir bagimu. Ia akan menjadi seorang yang hidup dalam ketenteraman, dan Aku akan memberinya ketenteraman dari semua musuhnya di sekelilingnya. Sebab ia akan bernama Salomo[a], dan Aku akan memberikan damai dan ketenangan kepada Israel pada zamannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, nama “Salomo” berkaitan dengan kata untuk “damai”; ayat ini juga berbicara tentang ketenteraman yang akan Allah berikan kepadanya.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Ketahuilah
  rationale: Menyampaikan fungsi penarik perhatian dari kata Ibrani ini secara alami dan khidmat, tanpa menyiratkan bahwa pendengar harus melihat sesuatu secara harfiah.
- source_word: בֵן נוֹלָד לָךְ
  choice: seorang anak laki-laki akan lahir bagimu
  rationale: Bentuk partisip pasif dipahami mengacu pada kelahiran yang masih akan datang dalam konteks janji ilahi; 'bagimu' mempertahankan datif yang mengaitkan anak itu dengan Daud.
- source_word: אִישׁ מְנוּחָה
  choice: orang yang hidup tenteram
  rationale: Ungkapan ini menyatakan keadaan tenteram atau bebas dari peperangan. Rumusan tersebut alami dalam bahasa Indonesia dan tetap berkaitan dengan kata kerja berikutnya yang berakar נוח.
- source_word: וַהֲנִחוֹתִי לוֹ
  choice: Aku akan mengaruniakan kepadanya ketenteraman
  rationale: '''Mengaruniakan ... ketenteraman'' mengungkapkan bahwa Allah menyebabkan atau memberikan keadaan aman dan tenteram, sekaligus mempertahankan pengulangan tematis dengan מְנוּחָה.'
- source_word: מִכָּל אוֹיְבָיו מִסָּבִיב
  choice: dari semua musuhnya di sekelilingnya
  rationale: Mempertahankan cakupan menyeluruh dan gambaran musuh-musuh yang berada pada segala sisi.
- source_word: כִּי שְׁלֹמֹה יִהְיֶה שְׁמוֹ
  choice: Sebab, ia akan bernama Salomo
  rationale: כִּי berfungsi memberi penjelasan, sedangkan susunan Indonesia ini menyampaikan pemberian nama dengan wajar. Catatan kaki menjelaskan hubungan bunyi dan tema yang lebih jelas dalam bahasa Ibrani.
- source_word: וְשָׁלוֹם וָשֶׁקֶט
  choice: kedamaian dan ketenangan
  rationale: 'Kedua nomina dibedakan: שָׁלוֹם menunjuk pada damai atau kesejahteraan, sedangkan שֶׁקֶט menunjuk pada keadaan tenang dan bebas dari gangguan.'
- source_word: עַל יִשְׂרָאֵל בְּיָמָיו
  choice: kepada Israel pada zamannya
  rationale: Rumusan ini alami dalam bahasa Indonesia dan menyatakan bahwa keadaan tersebut diberikan atas Israel selama masa pemerintahan sang anak.
theological_decisions:
- issue: Hubungan tematis antara ketenteraman, nama Salomo, dan kedamaian
  choice: Membedakan מְנוּחָה sebagai 'ketenteraman' dan שָׁלוֹם sebagai 'kedamaian', lalu menjelaskan kaitan nama Salomo dengan שָׁלוֹם dalam catatan kaki.
  alternative: Menerjemahkan אִישׁ מְנוּחָה sebagai 'orang yang damai' agar kaitannya dengan nama Salomo lebih langsung.
  rationale: Teks memakai kata Ibrani yang berbeda untuk ketenteraman dan damai. Membedakannya mempertahankan ragam leksikal sekaligus tidak menghilangkan rangkaian teologis tentang keamanan yang Allah berikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti ilahi ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerjemahan Alkitab bahasa Indonesia. Diksi 'ketenteraman', 'kedamaian', dan 'ketenangan' menjaga perbedaan tiga unsur Ibrani sambil tetap mudah dipahami.
