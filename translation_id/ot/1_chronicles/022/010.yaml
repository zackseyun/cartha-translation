  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֽוּא יִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י וְ/הוּא֙ יִהְיֶה לִּ֣/י לְ/בֵ֔ן וַ/אֲנִי ל֖/וֹ לְ/אָ֑ב וַ/הֲכִ֨ינוֹתִ֜י כִּסֵּ֧א מַלְכוּת֛/וֹ עַל יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/010.yaml
  text: He will build a house for my name[a], and he will be a son to me, and I will be a father to him, and I will establish the throne of his kingdom over Israel forever.
translation:
  language: id
  text: Dialah yang akan membangun rumah bagi nama-Ku[a]. Ia akan menjadi anak-Ku, dan Aku akan menjadi Bapanya. Aku akan meneguhkan takhta kerajaannya atas Israel untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "bait bagi nama-Ku". Secara harfiah, bahasa Ibrani berbunyi "rumah bagi nama-Ku".
    reason: lexical_alternative
lexical_decisions:
- source_word: בַיִת
  choice: rumah
  rationale: Makna dasarnya adalah 'rumah'. Dalam konteks ini yang dimaksud ialah bait Allah, tetapi 'rumah bagi nama-Ku' mempertahankan ungkapan Ibrani dalam teks utama.
- source_word: לִשְׁמִי
  choice: bagi nama-Ku
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani tentang rumah yang dikhususkan bagi nama dan kehadiran Allah tanpa memperluas maknanya secara parafrastis.
- source_word: לְבֵן
  choice: anak bagi-Ku
  rationale: Predikat dengan ל menyatakan hubungan. Susunan ini mempertahankan rumusan perjanjian ayah-anak secara langsung.
- source_word: לְאָב
  choice: Bapa baginya
  rationale: Pilihan ini sejajar dengan 'anak bagi-Ku' dan mempertahankan rumusan hubungan perjanjian; huruf kapital menandai Allah sebagai pembicara.
- source_word: וַהֲכִינוֹתִי
  choice: Aku akan meneguhkan
  rationale: Bentuk Hifil dari כון berarti membuat kukuh atau menetapkan. 'Meneguhkan' secara alami menyampaikan kekokohan dan kesinambungan dinasti.
- source_word: כִּסֵּא מַלְכוּתוֹ
  choice: takhta kerajaannya
  rationale: Terjemahan ini mempertahankan kedua unsur Ibrani, yaitu 'takhta' dan 'kerajaan', beserta dimensi pemerintahan dinastisnya.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Dalam konteks pemerintahan raja, עַל menyatakan kekuasaan atau pemerintahan atas Israel.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyampaikan keberlangsungan tanpa akhir dengan bahasa Indonesia yang wajar dan khidmat.
theological_decisions:
- issue: Rumusan perjanjian ayah-anak yang secara langsung berlaku bagi Salomo dan memiliki arti lebih luas dalam janji dinasti Daud
  choice: 'Mempertahankan bahasa hubungan secara langsung: ''Dia akan menjadi anak bagi-Ku, dan Aku akan menjadi Bapa baginya.'''
  alternative: Parafrasa yang memperlemah rumusan tersebut, misalnya 'Aku akan memperlakukannya seperti anak.'
  rationale: Teks Ibrani menyatakan hubungan itu secara langsung. Terjemahan ini mempertahankan rujukan langsung kepada Salomo sekaligus tidak menutup arti kanonis yang lebih luas atau memasukkan kesimpulan doktrinal ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Dialah' mempertahankan penekanan pada הוּא; 'rumah' menjaga metafora sumber, sedangkan catatan kaki menjelaskan bahwa konteksnya adalah bait Allah.
