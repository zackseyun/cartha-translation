  text: וַ/יִּקְרָ֖א לִ/שְׁלֹמֹ֣ה בְנ֑/וֹ וַ/יְצַוֵּ֨/הוּ֙ לִ/בְנ֣וֹת בַּ֔יִת לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/006.yaml
  text: Then he called for Solomon his son and commanded him to build a house for Yahweh[a], the God of Israel.
translation:
  language: id
  text: Lalu ia memanggil Salomo, anaknya, dan memerintahkannya untuk membangun sebuah rumah[a] bagi Yahweh, Allah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah bait”. Secara harfiah, bahasa Ibrani berbunyi “sebuah rumah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Lalu ia memanggil
  rationale: Bentuk naratif dengan waw memajukan rangkaian peristiwa; “lalu” menyatakan urutan secara alami, sedangkan קרא dengan ל pada orang berarti memanggil atau menyuruh datang.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: Salomo, anaknya
  rationale: Nama diri disesuaikan dengan bentuk baku bahasa Indonesia, dan בְנוֹ menyatakan hubungan Salomo sebagai anak dari tokoh yang sedang dibicarakan.
- source_word: וַיְצַוֵּהוּ
  choice: dan memerintahkannya
  rationale: Kata צוה menyampaikan perintah yang berwibawa; bentuk pronominal objeknya dipertahankan dengan “-nya”.
- source_word: לִבְנוֹת
  choice: untuk membangun
  rationale: Infinitif בנה sesudah צוה menyatakan isi perintah.
- source_word: בַּיִת
  choice: sebuah rumah
  rationale: Arti harfiahnya adalah “rumah”. Dalam konteks ini yang dimaksud ialah rumah ibadah atau bait bagi Yahweh, tetapi pilihan “rumah” mempertahankan ungkapan sumber dan alternatif kontekstual dijelaskan dalam catatan kaki.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan bahwa rumah itu dibangun dan diperuntukkan bagi Yahweh; nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Frasa konstruksi ini mengidentifikasi Yahweh sebagai Allah Israel; bentuk tersebut alami dan baku dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi יהוה secara langsung. “Yahweh” mempertahankan nama khusus itu tanpa menggantinya dengan gelar.
- issue: Makna בַּיִת dalam konteks rumah ibadah
  choice: rumah
  alternative: Bait Allah
  rationale: “Rumah” mempertahankan citra dan bentuk leksikal teks Ibrani, sementara konteks menunjukkan bahwa bangunan itu adalah tempat ibadah. Alternatif yang lebih interpretatif dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “ia” mempertahankan subjek tersirat dari konteks tanpa menambahkan nama Daud yang tidak muncul dalam ayat ini; tanda baca memperjelas bahwa “anaknya” menerangkan Salomo.
