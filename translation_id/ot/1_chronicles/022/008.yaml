  text: וַ/יְהִ֨י עָלַ֤/י דְּבַר יְהוָה֙ לֵ/אמֹ֔ר דָּ֤ם לָ/רֹב֙ שָׁפַ֔כְתָּ וּ/מִלְחָמ֥וֹת גְּדֹל֖וֹת עָשִׂ֑יתָ לֹֽא תִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י כִּ֚י דָּמִ֣ים רַבִּ֔ים שָׁפַ֥כְתָּ אַ֖רְצָ/ה לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/008.yaml
  text: But the word of Yahweh came to me[a], saying, ‘You have shed much blood and fought great wars. You shall not build a house for my name[d][c][b], because you have shed much blood on the earth before me.’
translation:
  language: id
  text: 'Firman Yahweh datang kepadaku, demikian: “Engkau telah menumpahkan banyak sekali darah dan mengobarkan peperangan-peperangan besar.[a] Engkau tidak akan membangun rumah bagi nama-Ku[b], sebab engkau telah menumpahkan banyak darah ke tanah[c] di hadapan-Ku.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melakukan peperangan-peperangan besar.”
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah Bait Allah; secara harfiah, “rumah bagi nama-Ku.”
    reason: cultural_note
  - marker: c
    text: Atau “di bumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עָלַי דְּבַר יְהוָה
  choice: Namun firman Yahweh datang kepadaku
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa firman Yahweh 'ada atas' Daud. 'Datang kepadaku' menyampaikan idiom pewahyuan itu secara alami, sedangkan 'firman' dan nama Yahweh mempertahankan bentuk serta identitas ilahi dalam sumber.
- source_word: דָּם לָרֹב שָׁפַכְתָּ
  choice: Engkau telah menumpahkan sangat banyak darah
  rationale: לָרֹב menyatakan kelimpahan atau jumlah yang besar. 'Sangat banyak darah' mempertahankan citra konkret darah dan membedakannya secara wajar dari frasa berikutnya דָּמִים רַבִּים.
- source_word: וּמִלְחָמוֹת גְּדֹלוֹת עָשִׂיתָ
  choice: dan melakukan peperangan-peperangan besar
  rationale: Kata kerja עשה secara harfiah berarti 'melakukan/membuat'. Dalam konteks peperangan, 'melakukan peperangan' dapat dipahami dalam bahasa Indonesia dan tidak mempersempit maknanya hanya menjadi bertempur secara pribadi; alternatif idiomatis dicatat dalam catatan kaki.
- source_word: לֹא תִבְנֶה בַיִת לִשְׁמִי
  choice: Engkau tidak akan membangun rumah bagi nama-Ku
  rationale: Bentuk imperfek dalam konteks pernyataan ilahi menyatakan apa yang tidak akan dilakukan Daud. 'Rumah' mempertahankan motif Ibrani, sementara 'bagi nama-Ku' menjaga ungkapan perjanjian tanpa menggantinya dengan parafrasa 'bagi-Ku'.
- source_word: כִּי דָּמִים רַבִּים שָׁפַכְתָּ
  choice: sebab engkau telah menumpahkan banyak darah
  rationale: כִּי memberi alasan bagi larangan tersebut. Walaupun bentuk jamak דָּמִים dapat menunjuk pada pertumpahan darah atau kesalahan darah, 'banyak darah' mempertahankan gambaran konkret dan pengulangan sumber.
- source_word: אַרְצָה לְפָנָי
  choice: ke tanah di hadapan-Ku
  rationale: Akhiran arah pada אַרְצָה paling langsung menyatakan gerak 'ke tanah'. 'Di hadapan-Ku' mempertahankan daya teologis bahwa tindakan itu terjadi dalam pandangan atau hadirat Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut nama perjanjian יְהוָה secara langsung. Transliterasi 'Yahweh' mempertahankan nama tersebut dan sesuai dengan lapisan konsultasi yang diberikan.
- issue: Makna בַיִת dalam konteks tempat ibadah
  choice: rumah
  alternative: Bait Allah
  rationale: Yang dimaksud dalam konteks ialah Bait Allah, tetapi kata Ibraninya adalah 'rumah'. Mempertahankan 'rumah' menjaga metafora dan motif kanonis tanpa memasukkan tafsiran ke dalam teks utama.
- issue: Nuansa לֹא תִבְנֶה sebagai larangan atau pernyataan masa depan
  choice: tidak akan membangun
  alternative: jangan membangun
  rationale: Dalam konteks penjelasan ilahi kepada Daud, bentuk ini paling alami dibaca sebagai penetapan bahwa Daud bukan pembangunnya, bukan semata-mata perintah langsung. Bentuk Ibrani tetap dapat bernuansa larangan, sehingga ketegangan modalnya tidak diperluas lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Sapaan 'engkau' dipakai untuk wacana langsung ilahi kepada satu orang, dan kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Pengulangan kata 'darah' serta ungkapan 'rumah bagi nama-Ku' sengaja dipertahankan.
