  terminology: «Yahweh», «firman», «rumah bagi nama-Ku», dan «di hadapan-Ku» tepat dan mempertahankan register Alkitab yang khidmat. Catatan tentang Bait Allah layak dipertahankan sebagai keterangan budaya, tanpa menggantikan «rumah» dalam teks utama.
