id: 1CH.22.12
reference: 1 Chronicles 22:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֣ךְ יִֽתֶּן לְּ/ךָ֤ יְהוָה֙ שֵׂ֣כֶל וּ/בִינָ֔ה וִֽ/יצַוְּ/ךָ֖ עַל יִשְׂרָאֵ֑ל וְ/לִ/שְׁמ֕וֹר אֶת תּוֹרַ֖ת יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/012.yaml
  text: Only[a], may Yahweh give you insight and understanding, and command you concerning Israel[b], that you may keep the law of Yahweh your God.
translation:
  language: id
  text: Kiranya saja[a] Yahweh memberimu kebijaksanaan dan pengertian, serta memberimu tanggung jawab atas Israel[b], supaya engkau menaati hukum[c] Yahweh, Allahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Hanya saja” atau “Sungguh.”
    reason: Partikel Ibrani dapat membatasi, menegaskan, atau memusatkan perhatian sesuai konteks.
  - marker: b
    text: Atau “memerintahkan kepadamu mengenai Israel” atau “memberimu wewenang atas Israel.”
    reason: Verba Ibrani biasanya berarti ‘memerintahkan’, tetapi bersama ‘atas Israel’ dalam konteks kerajaan dapat menyatakan penugasan atau pemberian tanggung jawab.
  - marker: c
    text: Atau “ajaran.”
    reason: Kata Ibrani torah dapat berarti hukum, ajaran, atau petunjuk.
lexical_decisions:
- source_word: אַךְ
  choice: Yang terutama
  rationale: Partikel ini memusatkan perhatian pada harapan utama Daud bagi Salomo. Ungkapan ini menyampaikan nuansa ‘di atas segalanya’ tanpa menjadikannya pertentangan yang tegas.
- source_word: יִתֶּן
  choice: kiranya ... memberi
  rationale: Bentuk imperfek ini berfungsi sebagai harapan atau berkat dalam konteks, sehingga ‘kiranya’ menyampaikan daya modalnya secara wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan, bukan diganti dengan gelar.
- source_word: שֵׂכֶל וּבִינָה
  choice: kebijaksanaan dan pengertian
  rationale: Pasangan ini mempertahankan perbedaan antara kecakapan atau kebijaksanaan praktis dan kemampuan memahami atau membedakan.
- source_word: וִיצַוְּךָ עַל יִשְׂרָאֵל
  choice: memberimu tanggung jawab atas Israel
  rationale: Pilihan ini sesuai dengan konteks kerajaan dan tetap cukup luas untuk mencakup gagasan penugasan atau pemberian wewenang, tanpa menutup kemungkinan arti yang lebih harfiah, yaitu memerintah atau memberi perintah mengenai Israel.
- source_word: וְלִשְׁמוֹר
  choice: supaya engkau menaati
  rationale: Waw ditambah infinitif menyatakan tujuan atau hasil. ‘Menaati’ menyampaikan tindakan menjaga ketentuan dengan setia secara alami dalam bahasa Indonesia.
- source_word: תּוֹרַת
  choice: hukum
  rationale: Dalam konteks perjanjian, תּוֹרָה menunjuk pada hukum yang diberikan Yahweh, sambil tetap memiliki nuansa ajaran atau petunjuk.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk ini mempertahankan sapaan orang kedua tunggal dan hubungan perjanjian yang dinyatakan teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi; transliterasi ‘Yahweh’ mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna וִיצַוְּךָ עַל יִשְׂרָאֵל dalam konteks kerajaan
  choice: memberimu tanggung jawab atas Israel
  alternative: memerintahkan kepadamu mengenai Israel
  rationale: Konteks menyangkut tugas Salomo atas Israel, tetapi verba צוה biasanya berarti ‘memerintahkan’. Terjemahan utama mempertahankan nuansa penugasan, sedangkan catatan kaki menjaga kemungkinan pembacaan yang lebih langsung.
- issue: Hubungan וְלִשְׁמוֹר dengan klausa sebelumnya
  choice: supaya engkau menaati
  alternative: dan untuk menaati
  rationale: Infinitif berpreposisi ini paling wajar dipahami sebagai tujuan atau hasil, namun terjemahan tidak menetapkan hubungan teologis yang lebih jauh daripada sintaksisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Yang terutama’ mengalir sebagai pembuka harapan Daud; ‘memberimu tanggung jawab atas Israel’ dipilih untuk menjaga keluwesan makna ungkapan Ibrani, dan alternatif penting dicatat secara eksplisit.
