  text: הֲ/לֹ֨א יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ עִמָּ/כֶ֔ם וְ/הֵנִ֥יחַ לָ/כֶ֖ם מִ/סָּבִ֑יב כִּ֣י נָתַ֣ן בְּ/יָדִ֗/י אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נִכְבְּשָׁ֥ה הָ/אָ֛רֶץ לִ/פְנֵ֥י יְהוָ֖ה וְ/לִ/פְנֵ֥י עַמּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/018.yaml
  text: Is not Yahweh your God with you? And has he not given you rest on every side? For he has given the inhabitants of the land into my hand[a], and the land has been subdued before Yahweh and before his people.
translation:
  language: id
  text: Bukankah Yahweh, Allah kalian, menyertai kalian dan telah memberikan kalian ketenteraman di segala penjuru? Sebab, Dia telah menyerahkan penduduk negeri itu ke dalam tanganku, dan negeri itu telah ditaklukkan di hadapan Yahweh dan di hadapan umat-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “umatnya.” Kata ganti ini paling mungkin mengacu kepada Yahweh, tetapi juga dapat dipahami mengacu kepada Daud.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Partikel ini membuka pertanyaan retoris yang mengharapkan jawaban ya; “Bukankah” mempertahankan daya retoris itu secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagaimana terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Dalam hubungan dengan Yahweh, bentuk ini menunjuk kepada Allah Israel; sufiks jamak mengacu kepada para pendengar secara kolektif, yang secara wajar diungkapkan dengan “-mu” dalam bahasa Indonesia.
- source_word: עִמָּכֶם
  choice: menyertai kamu
  rationale: Konteksnya menyatakan kehadiran dan dukungan ilahi; “menyertai” lebih alami daripada terjemahan spasial semata.
- source_word: וְהֵנִיחַ לָכֶם מִסָּבִיב
  choice: dan telah mengaruniakan ketenteraman kepadamu di segala penjuru
  rationale: Bentuk kausatif הֵנִיחַ menyatakan bahwa Allah memberi keadaan tenteram atau bebas dari ancaman musuh di sekeliling; “mengaruniakan ketenteraman” mempertahankan nuansa pemberian ilahi.
- source_word: כִּי
  choice: Sebab
  rationale: Mengantar alasan yang mendasari pertanyaan retoris sebelumnya.
- source_word: נָתַן בְּיָדִי
  choice: telah menyerahkan ... ke dalam tanganku
  rationale: Mempertahankan metafora Ibrani tentang penyerahan ke dalam kuasa seseorang sambil tetap jelas dalam bahasa Indonesia.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: penduduk negeri itu
  rationale: Ungkapan partisipial ini secara idiomatis menunjuk kepada orang-orang yang mendiami negeri tersebut.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: dan negeri itu telah ditaklukkan
  rationale: Bentuk nifal menyatakan bahwa negeri itu telah dibuat tunduk; bentuk pasif mempertahankan struktur dan hasil tindakan dalam teks sumber.
- source_word: לִפְנֵי יְהוָה וְלִפְנֵי עַמּוֹ
  choice: di hadapan Yahweh dan di hadapan umat-Nya
  rationale: Pengulangan “di hadapan” mempertahankan kesejajaran Ibrani. Kapitalisasi “-Nya” menyatakan pembacaan utama bahwa pronomina itu mengacu kepada Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai nama perjanjian secara langsung; “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Acuan pronomina dalam עַמּוֹ (“umatnya”)
  choice: “-Nya” mengacu kepada Yahweh
  alternative: “-nya” dapat dipahami mengacu kepada Daud
  rationale: Ungkapan “di hadapan Yahweh dan di hadapan umat-Nya” secara paling alami memasangkan Yahweh dengan umat-Nya. Namun, bentuk Ibraninya sendiri tidak membedakan kapitalisasi dan secara gramatikal memungkinkan sebagian pembaca menghubungkannya dengan Daud; kemungkinan itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Diksi “ketenteraman,” “di segala penjuru,” dan “ditaklukkan” dipilih agar jelas bagi pembaca umum sekaligus mempertahankan citra serta struktur utama teks Ibrani.
