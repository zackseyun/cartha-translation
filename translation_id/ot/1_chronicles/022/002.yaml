  text: וַ/יֹּ֣אמֶר דָּוִ֔יד לִ/כְנוֹס֙ אֶת הַ/גֵּרִ֔ים אֲשֶׁ֖ר בְּ/אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יַּעֲמֵ֣ד חֹֽצְבִ֗ים לַ/חְצוֹב֙ אַבְנֵ֣י גָזִ֔ית לִ/בְנ֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/002.yaml
  text: And David ordered the foreigners who were in the land of Israel to be gathered[c][b][a], and he appointed stonecutters to cut dressed stones for building the house of God.
translation:
  language: id
  text: Daud memerintahkan agar para pendatang yang tinggal di tanah Israel dikumpulkan[a]. Ia menugaskan para pemahat batu untuk memahat batu-batu yang dibentuk[b] guna membangun rumah Allah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang asing yang menetap”. Istilah Ibrani ini menunjuk kepada orang bukan Israel yang tinggal di negeri itu.
    reason: lexical_alternative
  - marker: b
    text: Atau “batu-batu potong” atau “batu-batu yang dipahat”.
    reason: lexical_alternative
  - marker: c
    text: Yang dimaksud adalah Bait Allah.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: memerintahkan
  rationale: Secara harfiah berarti “berkata”, tetapi bersama infinitif לִכְנוֹס bentuk ini menyampaikan perintah atau arahan. “Memerintahkan agar” mengungkapkan daya ungkap tersebut secara alami dalam bahasa Indonesia.
- source_word: לִכְנוֹס
  choice: agar ... dikumpulkan
  rationale: Infinitif ini menyatakan isi perintah Daud. Bentuk pasif menunjukkan bahwa Daud menyuruh orang lain mengumpulkan mereka, bukan bahwa ia melakukannya sendiri.
- source_word: הַגֵּרִים
  choice: para pendatang
  rationale: Istilah ini menunjuk kepada orang bukan pribumi yang tinggal di tengah Israel. “Para pendatang” mudah dipahami dan tidak bernada birokratis, sementara keterangan “yang tinggal” menegaskan bahwa mereka menetap di negeri itu.
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: di tanah Israel
  rationale: Kata “tanah” mempertahankan unsur אֶרֶץ dan nuansa kewilayahan dalam teks.
- source_word: וַיַּעֲמֵד
  choice: menugaskan
  rationale: Dalam konteks ini verba tersebut berarti menetapkan atau menempatkan para pekerja untuk suatu tugas. “Menugaskan” menyatakan fungsi administratifnya dengan jelas.
- source_word: חֹצְבִים
  choice: para pemahat batu
  rationale: Partisipel ini menunjuk kepada para pekerja yang memotong atau memahat batu. Pilihan ini alami dan jelas bagi pembaca Indonesia.
- source_word: לַחְצוֹב
  choice: untuk memahat
  rationale: Infinitif ini mengulang akar kata yang sama dengan חֹצְבִים. “Memahat” cocok dengan pekerjaan membentuk batu untuk bangunan.
- source_word: אַבְנֵי גָזִית
  choice: batu-batu pahat
  rationale: Frasa ini menunjuk kepada batu yang telah dipotong dan dibentuk untuk konstruksi. “Batu-batu pahat” mempertahankan istilah bangunan yang ringkas dan lazim dalam gaya Alkitab bahasa Indonesia.
- source_word: לִבְנוֹת
  choice: guna membangun
  rationale: Kata “guna” menyatakan tujuan dengan lancar sekaligus mempertahankan hubungan infinitif dalam sumber.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Pilihan ini menerjemahkan unsur-unsur Ibrani secara langsung dan tidak mengganti ungkapan sumber dengan istilah tafsiran “Bait Allah”, meskipun yang dimaksud adalah bait yang akan dibangun.
theological_decisions:
- issue: Penerjemahan בֵּית הָאֱלֹהִים
  choice: rumah Allah
  alternative: Bait Allah
  rationale: Frasa itu dalam konteks menunjuk kepada proyek pembangunan Bait Allah, tetapi bunyi Ibraninya adalah “rumah Allah”. Teks utama mempertahankan ungkapan sumber, sedangkan catatan menjelaskan acuannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur yang mudah dipahami. Kalimat panjang sumber dibagi menjadi dua kalimat agar alami dalam bahasa Indonesia, tanpa mengubah urutan tindakan. Istilah “rumah Allah” dipertahankan untuk kedekatan formal dengan sumber, sementara “Bait Allah” diberikan sebagai penjelasan referensial.
