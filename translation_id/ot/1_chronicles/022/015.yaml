    issue: “untuk melaksanakan pekerjaan itu” bersifat interpretatif dan berlebihan.
    rationale: עֹשֵׂי מְלָאכָה secara langsung berarti para pekerja/orang yang melakukan pekerjaan. Kata “itu” dan konstruksi tujuan tidak dinyatakan dalam teks sumber.
  - severity: medium
    issue: Catatan kaki menawarkan “penatah” sebagai arti harfiah.
    rationale: חֹצְבִים berkaitan dengan memotong atau menggali/mengeluarkan bahan, dan dalam konteks ini “pemotong batu” aman. “Penatah” mengarah pada pekerjaan mengukir atau memahat dan dapat menyesatkan.
  revised_text: 'Bersamamu ada banyak pekerja: pemotong batu, perajin batu dan kayu, serta setiap orang yang ahli dalam segala macam pekerjaan.'
