  text: וְ/עִמְּ/ךָ֤ לָ/רֹב֙ עֹשֵׂ֣י מְלָאכָ֔ה חֹצְבִ֕ים וְ/חָרָשֵׁ֥י אֶ֖בֶן וָ/עֵ֑ץ וְ/כָל חָכָ֖ם בְּ/כָל מְלָאכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/015.yaml
  text: 'And with you in abundance are workers for the task: stonecutters[a], and craftsmen of stone and wood, and every skilled man for every kind of work.'
translation:
  language: id
  text: 'Bersamamu ada banyak pekerja: pemotong batu, perajin batu dan kayu, serta setiap orang yang ahli dalam segala macam pekerjaan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעִמְּךָ לָרֹב
  choice: Bersamamu juga ada banyak
  rationale: Mengungkapkan keberadaan tenaga kerja yang menyertai Salomo serta jumlah mereka yang besar, sambil mempertahankan hubungan dengan ayat sebelumnya.
- source_word: עֹשֵׂי מְלָאכָה
  choice: pekerja untuk melaksanakan pekerjaan itu
  rationale: Partisip ini menunjuk kepada orang-orang yang mengerjakan proyek yang sedang dibicarakan; kata 'itu' memperjelas rujukan kontekstual tanpa menambah jenis pekerjaan baru.
- source_word: חֹצְבִים
  choice: para pemotong batu
  rationale: Kata ini secara harfiah berarti orang-orang yang memotong atau menatah; dalam konteks pembangunan, objek yang tersirat adalah batu.
- source_word: וְחָרָשֵׁי אֶבֶן וָעֵץ
  choice: para perajin batu dan kayu
  rationale: חָרָשׁ menunjuk kepada pekerja ahli atau perajin; ungkapan ini mempertahankan kedua bahan yang disebutkan dalam teks.
- source_word: וְכָל חָכָם בְּכָל מְלָאכָה
  choice: serta setiap orang yang ahli dalam segala macam pekerjaan
  rationale: חָכָם di sini menyatakan kecakapan praktis, bukan terutama kebijaksanaan intelektual. 'Segala macam pekerjaan' menyampaikan cakupan distributif frasa tersebut secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Bentuk maskulin tunggal pada וְכָל חָכָם
  choice: setiap orang yang ahli
  alternative: setiap laki-laki yang ahli
  rationale: Dalam konteks ini bentuk maskulin tunggal berfungsi secara representatif untuk anggota tenaga kerja yang terampil. Bahasa Indonesia tidak menandai gender secara gramatikal, sehingga 'orang' mempertahankan makna tanpa memasukkan penegasan jenis kelamin yang tidak dituntut oleh konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara daftar jenis tenaga kerja dan penekanan pada banyaknya pekerja tetap dipertahankan.
