  text: Then David commanded all the leaders of Israel to help Solomon his son.
translation:
  language: id
  text: Kemudian Daud memerintahkan semua pemimpin Israel untuk membantu Salomo, anaknya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: Kemudian ... memerintahkan
  rationale: Bentuk wayyiqtol dari צוה melanjutkan alur narasi dan menyatakan perintah yang berwibawa. 'Kemudian' menyampaikan urutan peristiwa secara alami dalam bahasa Indonesia.
- source_word: שָׂרֵי
  choice: pemimpin
  rationale: Kata שָׂרִים menunjuk kepada para pejabat atau pemimpin yang berwenang. 'Pemimpin' jelas, luas, dan wajar dalam bahasa Indonesia modern.
- source_word: לְכָל שָׂרֵי יִשְׂרָאֵל
  choice: semua pemimpin Israel
  rationale: Frasa ini mencakup seluruh jajaran kepemimpinan bangsa Israel tanpa menentukan jabatan tertentu yang tidak disebutkan dalam teks.
- source_word: לַעְזֹר
  choice: untuk membantu
  rationale: Infinitif עזר berarti 'menolong' atau 'membantu'. 'Untuk membantu' paling alami di sini dan menyatakan tujuan perintah Daud.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: Salomo, anaknya
  rationale: Terjemahan ini mempertahankan Salomo sebagai penerima bantuan dan בְנוֹ sebagai keterangan hubungan keluarga. Koma membantu menunjukkan bahwa 'anaknya' menerangkan Salomo.
