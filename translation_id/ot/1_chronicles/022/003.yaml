base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/003.yaml
  text: And David prepared iron in abundance for the nails for the doors of the gates and for the fastenings[b][a], and bronze in abundance without weight.
translation:
  language: id
  text: Daud menyiapkan besi dalam jumlah besar untuk paku-paku bagi pintu-pintu gerbang dan untuk alat-alat penyambung[a], serta perunggu dalam jumlah yang begitu besar sehingga tidak dapat ditimbang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “engsel-engsel”. Istilah Ibraninya lebih luas dan secara umum menunjuk pada benda-benda yang menghubungkan atau menyatukan bagian-bagian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak ada berat”; maksudnya, jumlahnya terlalu besar untuk ditimbang.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַרְזֶל
  choice: besi
  rationale: Kata ini secara langsung menunjuk pada besi sebagai bahan bangunan.
- source_word: לָרֹב
  choice: dalam jumlah besar
  rationale: Ungkapan ini menyatakan kelimpahan bahan; pilihan ini alami dalam bahasa Indonesia dan sesuai dengan konteks penyediaan bahan bangunan.
- source_word: מִּסְמְרִים
  choice: paku-paku
  rationale: Dalam konteks pembuatan pintu gerbang, istilah ini paling wajar dipahami sebagai paku, tanpa mempersempitnya menjadi jenis paku tertentu.
- source_word: דַלְתוֹת הַשְּׁעָרִים
  choice: pintu-pintu gerbang
  rationale: Frasa konstruksi Ibrani menunjuk pada daun atau pintu yang menjadi bagian dari gerbang; bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: מְחַבְּרוֹת
  choice: alat-alat penyambung
  rationale: Kata ini secara luas menunjuk pada benda yang menghubungkan atau menyatukan bagian-bagian konstruksi. Pilihan ini tidak mempersempit makna menjadi engsel saja.
- source_word: הֵכִין
  choice: menyiapkan
  rationale: Kata kerja ini berarti mempersiapkan atau menyediakan agar siap digunakan, sesuai dengan tindakan Daud menghimpun bahan pembangunan.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam daftar bahan bangunan Alkitab, istilah ini lazim menunjuk pada perunggu sebagai logam yang digunakan, meskipun secara leksikal dapat pula mencakup tembaga.
- source_word: אֵין מִשְׁקָל
  choice: begitu besar sehingga tidak dapat ditimbang
  rationale: Ungkapan harfiah 'tidak ada timbangan/berat' berfungsi sebagai hiperbola untuk jumlah yang terlalu besar untuk ditimbang; terjemahan ini menyampaikan maksudnya secara alami.
