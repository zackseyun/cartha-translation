source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר דָּוִ֖יד לִ/שְׁלֹמֹ֑ה בנ/ו אֲנִי֙ הָיָ֣ה עִם לְבָבִ֔/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֖ם יְהוָ֥ה אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/007.yaml
  text: And David said to Solomon his son[a], “As for me[b], it was in my heart to build a house for the name of Yahweh my God.”
translation:
  language: id
  text: Lalu Daud berkata kepada Salomo, anaknya, “Aku sendiri berniat dalam hati[a] untuk membangun sebuah rumah[b] bagi nama Yahweh, Allahku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “hal itu ada dalam hatiku.” Ungkapan Ibrani ini menyatakan niat atau tekad batin Daud.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebuah bait.” Secara harfiah, “sebuah rumah” bagi nama Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif dengan waw-konsekutif melanjutkan rangkaian peristiwa; “lalu” menyampaikan alur tersebut secara wajar dalam bahasa Indonesia.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: kepada Salomo, anaknya
  rationale: Susunan ini dekat dengan bahasa Ibrani dan tetap jelas serta alami dalam bahasa Indonesia.
- source_word: אֲנִי
  choice: Aku sendiri
  rationale: Pronomina eksplisit אֲנִי memberi penekanan pada Daud; “aku sendiri” mempertahankan penekanan itu.
- source_word: הָיָה עִם לְבָבִי
  choice: berniat dalam hati
  rationale: Ungkapan Ibrani ini menyatakan niat atau tekad batin. Pilihan ini alami dalam bahasa Indonesia sambil mempertahankan citra “hati” dari teks sumber.
- source_word: לִבְנוֹת בַּיִת
  choice: untuk membangun sebuah rumah
  rationale: בַּיִת secara harfiah berarti “rumah.” Walaupun yang dimaksud adalah bait atau rumah ibadah, mempertahankan “rumah” menjaga ungkapan khas teks sumber; alternatif interpretatif dijelaskan dalam catatan kaki.
- source_word: לְשֵׁם
  choice: bagi nama
  rationale: Ungkapan ini menunjuk pada rumah yang dipersembahkan bagi nama dan kehadiran Yahweh. “Bagi nama” mempertahankan bahasa teologis teks tanpa mereduksinya menjadi sekadar “untuk.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap terlihat.
- source_word: אֱלֹהָי
  choice: Allahku
  rationale: Akhiran orang pertama tunggal dipertahankan; Daud menyebut Yahweh secara pribadi sebagai Allahnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi dan paling dekat dengan bentuk yang lazim direkonstruksi.
- issue: Apakah בַּיִת diterjemahkan sebagai “rumah” atau “bait”
  choice: rumah
  alternative: bait
  rationale: Kata Ibrani secara harfiah berarti “rumah,” dan konteks menjelaskan bahwa rumah tersebut diperuntukkan bagi nama Yahweh. “Bait” adalah penjelasan referensial yang sah, tetapi lebih interpretatif dan karena itu ditempatkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Aku” sesuai dengan tuturan pribadi Daud kepada anaknya; “Aku sendiri” mempertahankan penekanan pronomina Ibrani. Istilah “rumah” dan “bagi nama Yahweh” sengaja dipertahankan untuk menjaga citra serta diksi teologis teks sumber.
