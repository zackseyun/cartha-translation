  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַתָּ֣ה בְנִ֔/י יְהִ֥י יְהוָ֖ה עִמָּ֑/ךְ וְ/הִצְלַחְתָּ֗ וּ/בָנִ֨יתָ֙ בֵּ֚ית יְהוָ֣ה אֱלֹהֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר עָלֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/011.yaml
  text: Now[a], my son, may Yahweh be with you, and may you prosper and build the house of Yahweh your God[c][b], as he has spoken concerning you.
translation:
  language: id
  text: Sekarang, anakku, kiranya Yahweh menyertaimu, dan kiranya engkau berhasil[a] serta membangun rumah Yahweh, Allahmu,[b] seperti yang telah Ia firmankan mengenai engkau.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjadi makmur”; kata Ibrani ini dapat berarti “berhasil” atau “menjadi makmur.”
    reason: lexical_alternative
  - marker: b
    text: 'Atau, “bait Yahweh, Allahmu.” Secara harfiah: “rumah Yahweh, Allahmu.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau, “seperti yang telah Ia janjikan berkenaan dengan engkau.” Secara lebih harfiah: “seperti yang telah Ia firmankan mengenai engkau.”'
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: Sekarang
  rationale: Berfungsi sebagai penanda waktu dan wacana yang membuka berkat serta nasihat Daud; “Sekarang” alami dan langsung dalam bahasa Indonesia.
- source_word: בְנִי
  choice: anakku
  rationale: Sapaan dengan akhiran orang pertama tunggal; “anakku” mempertahankan nada kebapakan.
- source_word: יְהִי יְהוָה עִמָּךְ
  choice: kiranya Yahweh menyertaimu
  rationale: Bentuk yiqtol jusif menyatakan harapan atau berkat, bukan sekadar ramalan. “Kiranya” mempertahankan daya benediktifnya.
- source_word: וְהִצְלַחְתָּ
  choice: dan kiranya engkau berhasil
  rationale: Bentuk Hifil dari צלח dapat berarti berhasil atau menjadi makmur. “Berhasil” sesuai dengan konteks tugas membangun tanpa mempersempit makna menjadi kemakmuran materi.
- source_word: וּבָנִיתָ
  choice: serta membangun
  rationale: Dikoordinasikan dengan harapan yang diawali bentuk jusif. Terjemahan ini mempertahankan pembangunan sebagai bagian dari rangkaian berkat dan pengharapan, bukan mengubahnya menjadi perintah tegas.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: rumah Yahweh, Allahmu
  rationale: “Rumah” mempertahankan metafora Ibrani dan gema teologisnya; “bait” merupakan padanan kontekstual yang lebih interpretatif.
- source_word: כַּאֲשֶׁר דִּבֶּר עָלֶיךָ
  choice: seperti yang telah Ia firmankan mengenai engkau
  rationale: דבר + על berarti berbicara atau berfirman mengenai seseorang. Rumusan ini menjaga acuan pada firman Yahweh sebelumnya tanpa secara eksplisit mengubahnya menjadi “janji”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama perjanjian dalam teks sumber tetap tampak dan tidak diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut, sedangkan “TUHAN” menggantinya dengan gelar.
- issue: Daya rangkaian verba dalam ucapan Daud kepada Salomo
  choice: 'Berkat atau harapan: “kiranya ... dan kiranya ...”'
  alternative: 'Ramalan: “Yahweh akan menyertaimu, dan engkau akan berhasil serta membangun”'
  rationale: Bentuk jusif יְהִי paling wajar dibaca sebagai harapan atau berkat. Verba-verba berikutnya dipahami dalam kesinambungan modal dengannya, sambil tetap mengakui adanya nuansa penggenapan yang diharapkan.
- issue: Makna דבר על dalam konteks firman Yahweh tentang Salomo
  choice: “Ia firmankan mengenai engkau”
  alternative: “Ia janjikan kepadamu”
  rationale: Konteks dapat mengandung gagasan janji, tetapi teks secara leksikal mengatakan bahwa Yahweh telah berfirman mengenai Salomo. Terjemahan utama tidak mempersempitnya menjadi janji eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “anakku” menjaga kehangatan paternal; “kiranya” menyampaikan bentuk berkat. Nama Yahweh dipertahankan, dan istilah “rumah” dipilih untuk menjaga citra sumber sambil menjelaskan “bait” dalam catatan kaki.
