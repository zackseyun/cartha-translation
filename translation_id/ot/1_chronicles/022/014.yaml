source:
  edition: WLC
  text: וְ/הִנֵּ֨ה בְ/עָנְיִ֜/י הֲכִינ֣וֹתִי לְ/בֵית יְהוָ֗ה זָהָ֞ב כִּכָּרִ֤ים מֵֽאָה אֶ֨לֶף֙ וְ/כֶ֗סֶף אֶ֤לֶף אֲלָפִים֙ כִּכָּרִ֔ים וְ/לַ/נְּחֹ֤שֶׁת וְ/לַ/בַּרְזֶל֙ אֵ֣ין מִשְׁקָ֔ל כִּ֥י לָ/רֹ֖ב הָיָ֑ה וְ/עֵצִ֤ים וַ/אֲבָנִים֙ הֲכִינ֔וֹתִי וַ/עֲלֵי/הֶ֖ם תּוֹסִֽיף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/014.yaml
  text: Behold[a], in my affliction I have prepared for the house of Yahweh one hundred thousand talents of gold, and one million talents of silver; and for the bronze and the iron there is no weighing, for it was in abundance. I have prepared timber and stones[c][b], and you may add to them.
translation:
  language: id
  text: Lihatlah, dalam kesusahanku[a] aku telah menyediakan bagi rumah Yahweh seratus ribu talenta emas dan sejuta[b] talenta perak. Untuk tembaga dan besi tidak ada timbangannya, sebab jumlahnya sangat banyak. Kayu dan batu juga telah kusediakan, dan engkau dapat menambahnya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dalam kemiskinanku.” Kata Ibrani ini dapat berarti kesusahan, penderitaan, keadaan sulit, atau kemiskinan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “seribu ribu.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “engkau harus menambahnya” atau “engkau akan menambahnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan penanda pengarah perhatian dalam bahasa Ibrani tanpa menambahkan keterangan waktu yang tidak terdapat dalam teks sumber.
- source_word: בְעָנְיִי
  choice: dalam kesusahanku
  rationale: עֳנִי dapat menunjuk pada kesusahan, penderitaan, keadaan sulit, atau kemiskinan. 'Dalam kesusahanku' mempertahankan keluasan makna yang paling sesuai dengan konteks persiapan Daud.
- source_word: הֲכִינוֹתִי
  choice: aku telah menyediakan
  rationale: Bentuk Hifil dari כון berarti menyiapkan atau menyediakan; bentuk perfektif menyatakan persiapan yang telah dilakukan dan kini tersedia.
- source_word: לְבֵית יְהוָה
  choice: bagi rumah Yahweh
  rationale: '''Rumah'' mempertahankan ungkapan Ibrani bagi bait, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai ''Yahweh''.'
- source_word: כִּכָּרִים
  choice: talenta
  rationale: כִּכָּר adalah satuan berat besar; 'talenta' merupakan padanan konvensional yang sesuai untuk daftar bahan bangunan bait.
- source_word: אֶלֶף אֲלָפִים
  choice: sejuta
  rationale: Ungkapan harfiah 'seribu ribu' secara kuantitatif berarti sejuta; bentuk modern dipakai dalam teks, sementara bentuk Ibraninya dicatat dalam catatan kaki.
- source_word: וְלַנְּחֹשֶׁת וְלַבַּרְזֶל אֵין מִשְׁקָל
  choice: Berat tembaga dan besi tidak terhitung
  rationale: Ungkapan itu secara harfiah menyatakan bahwa tidak ada ukuran berat bagi logam-logam tersebut. 'Tidak terhitung' menyampaikan bahwa kuantitasnya tidak dicatat atau terlalu besar untuk dihitung, bukan bahwa logam itu tidak memiliki berat.
- source_word: כִּי לָרֹב הָיָה
  choice: karena jumlahnya begitu banyak
  rationale: 'Frasa ini menjelaskan tidak adanya angka berat: bahan tersebut tersedia dalam kelimpahan yang sangat besar.'
- source_word: וְעֵצִים וַאֲבָנִים הֲכִינוֹתִי
  choice: Kayu dan batu juga telah kusediakan
  rationale: עֵצִים dalam konteks pembangunan berarti kayu sebagai bahan bangunan. Susunan Indonesia dibuat alami sambil mempertahankan pernyataan persiapan Daud.
- source_word: וַעֲלֵיהֶם תּוֹסִיף
  choice: dan engkau dapat menambahnya
  rationale: Bentuk imperfek yang ditujukan kepada Salomo dapat dipahami sebagai izin atau sebagai arahan/keharusan. Teks utama memakai nuansa permisif yang sesuai konteks, dan alternatif yang lebih tegas dicatat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi alih-alih menggantinya dengan gelar.
- issue: Nuansa keadaan Daud dalam בְעָנְיִי
  choice: dalam kesusahanku
  alternative: dalam kemiskinanku
  rationale: Kata tersebut memungkinkan makna penderitaan atau kemiskinan. Terjemahan utama tidak membatasi ucapan Daud pada keadaan finansial, sedangkan kemungkinan itu dipertahankan dalam catatan kaki.
- issue: Kekuatan modal תּוֹסִיף
  choice: engkau dapat menambahnya
  alternative: engkau harus menambahnya / engkau akan menambahnya
  rationale: Bentuk Ibrani tidak secara eksplisit membedakan izin, perintah, dan pernyataan masa depan. Nuansa permisif dipilih berdasarkan konteks, tanpa menghapus alternatif yang lebih tegas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'aku–engkau' sesuai dengan tuturan langsung Daud kepada Salomo. Istilah 'rumah Yahweh' mempertahankan idiom Ibrani, sedangkan susunan kalimat dan ungkapan jumlah dibuat alami bagi pembaca Indonesia masa kini.
