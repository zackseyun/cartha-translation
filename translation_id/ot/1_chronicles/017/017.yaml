  naturalness: Bahasa doa ini baku dan mudah dibaca. «Kauanggap» perlu ditulis terpisah menjadi «Kau anggap» menurut ejaan baku. «Keturunan hamba-Mu» lebih jelas daripada «keluarga hamba-Mu» untuk בית dalam konteks janji dinasti.
  terminology: «Yahweh Allah» konsisten dengan kebijakan nama ilahi. Kapitalisasi pronomina ilahi dan sapaan «ya Allah» juga sesuai register. Catatan kaki perlu menyatakan bahwa makna frasa akhir tidak pasti, bukan sekadar membuka beberapa «penafsiran».
