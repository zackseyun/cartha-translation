revisions:
- from: Hal ini pun Kauanggap kecil, ya Allah. Engkau bahkan telah berbicara tentang keluarga hamba-Mu sampai jauh ke masa depan, dan Engkau memandang aku seperti seorang manusia yang berkedudukan tinggi,[a] ya Yahweh Allah.
  to: Hal ini pun Kau anggap kecil di mata-Mu, ya Allah. Engkau telah berbicara tentang keturunan hamba-Mu sampai jauh ke masa depan, dan Engkau memandang aku menurut derajat manusia di tempat tinggi,[a] ya Yahweh Allah.
