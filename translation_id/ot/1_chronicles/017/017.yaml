source:
  edition: WLC
  text: וַ/תִּקְטַ֨ן זֹ֤את בְּ/עֵינֶ֨י/ךָ֙ אֱלֹהִ֔ים וַ/תְּדַבֵּ֥ר עַל בֵּֽית עַבְדְּ/ךָ֖ לְ/מֵ/רָח֑וֹק וּ/רְאִיתַ֗/נִי כְּ/ת֧וֹר הָ/אָדָ֛ם הַֽ/מַּעֲלָ֖ה יְהוָ֥ה אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/017.yaml
  text: And this was a small thing in your eyes[a], O God; yet you have spoken concerning your servant’s house for a long time to come, and you have regarded me according to the rank of man on high, O Yahweh God.
translation:
  language: id
  text: Hal ini pun Kau anggap kecil di mata-Mu, ya Allah. Engkau telah berbicara tentang keturunan hamba-Mu sampai jauh ke masa depan, dan Engkau memandang aku menurut derajat manusia di tempat tinggi,[a] ya Yahweh Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau telah memperlihatkan kepadaku generasi-generasi manusia yang akan datang,” atau, “Engkau memandang aku seperti seorang manusia yang berkedudukan tinggi.” Bahasa Ibrani pada bagian akhir klausa ini sulit dan dapat dipahami dengan beberapa cara.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן זֹאת בְּעֵינֶיךָ
  choice: Hal ini pun Kauanggap kecil
  rationale: Mengungkapkan idiom Ibrani tentang penilaian Allah secara alami dalam bahasa Indonesia; partikel 'pun' menghubungkannya dengan anugerah yang telah disebut sebelumnya.
- source_word: וַתְּדַבֵּר עַל בֵּית עַבְדְּךָ
  choice: Engkau bahkan telah berbicara tentang keluarga hamba-Mu
  rationale: דבר על pada dasarnya berarti 'berbicara tentang/mengenai'; 'keluarga' menyampaikan בַּיִת sebagai garis keturunan atau wangsa dalam konteks janji kepada Daud tanpa mempersempitnya menjadi bangunan.
- source_word: לְמֵרָחוֹק
  choice: sampai jauh ke masa depan
  rationale: Konteksnya bersifat temporal dan menunjuk kepada kelanjutan keluarga Daud pada masa yang jauh.
- source_word: וּרְאִיתַנִי
  choice: Engkau memandang aku
  rationale: ראה di sini mencakup cara Allah memandang atau memperlakukan Daud, bukan sekadar melihat secara visual.
- source_word: כְּתוֹר הָאָדָם הַמַּעֲלָה
  choice: seperti seorang manusia yang berkedudukan tinggi
  rationale: Terjemahan ini mempertahankan kemungkinan makna תור sebagai tatanan, derajat, atau kedudukan dan הַמַּעֲלָה sebagai keadaan yang ditinggikan, sambil tetap wajar dalam bahasa Indonesia. Ketidakpastian frasa dijelaskan dalam catatan kaki.
- source_word: יְהוָה אֱלֹהִים
  choice: ya Yahweh Allah
  rationale: Mempertahankan nama ilahi יהוה sebagai 'Yahweh' dan memahami gabungan ini sebagai sapaan langsung.
theological_decisions:
- issue: Makna klausa sulit וּרְאִיתַנִי כְּתוֹר הָאָדָם הַמַּעֲלָה
  choice: Engkau memandang aku seperti seorang manusia yang berkedudukan tinggi
  alternative: 'Engkau telah memperlihatkan kepadaku generasi-generasi manusia yang akan datang; atau: Engkau memandang aku menurut derajat manusia yang tinggi'
  rationale: Teks Masoret stabil, tetapi hubungan dan makna kata-katanya tidak jelas. Teks utama mempertahankan gagasan bahwa Allah memandang atau memperlakukan Daud sebagai orang berkedudukan tinggi, sedangkan kemungkinan utama lainnya disimpan dalam catatan kaki agar ambiguitas asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai kapitalisasi pronomina. Tanda baca membagi tiga gerak kalimat agar doa panjang ini mudah dipahami tanpa menghilangkan hubungan antarklausanya.
