  text: וָֽ/אֶהְיֶ֣ה עִמְּ/ךָ֗ בְּ/כֹל֙ אֲשֶׁ֣ר הָלַ֔כְתָּ וָ/אַכְרִ֥ית אֶת כָּל אוֹיְבֶ֖י/ךָ מִ/פָּנֶ֑י/ךָ וְ/עָשִׂ֤יתִֽי לְ/ךָ֙ שֵׁ֔ם כְּ/שֵׁ֥ם הַ/גְּדוֹלִ֖ים אֲשֶׁ֥ר בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/008.yaml
  text: And I have been with you wherever you have gone[a], and I have cut off all your enemies from before you[b], and I will make for you a name like the name of the great ones who are on the earth.
translation:
  language: id
  text: Aku telah menyertai engkau ke mana pun engkau pergi, dan telah melenyapkan semua musuhmu dari hadapanmu. Aku akan membuat namamu termasyhur[a] seperti nama orang-orang besar yang ada di bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “membuat bagimu sebuah nama.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “di negeri itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: Aku menyertai engkau
  rationale: Bentuk wayyiqtol menceritakan penyertaan TUHAN pada masa lampau. Ungkapan ini alami dalam bahasa Indonesia dan mencakup kehadiran serta dukungan-Nya.
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: ke mana pun engkau pergi
  rationale: Ungkapan Ibrani harfiahnya kurang lebih 'dalam segala yang engkau jalani'; dalam konteks perjalanan dan tindakan Daud, maknanya paling alami dinyatakan sebagai 'ke mana pun engkau pergi'.
- source_word: וָאַכְרִית
  choice: Aku melenyapkan
  rationale: Bentuk Hifil dari כרת menyatakan tindakan menyingkirkan atau membinasakan musuh. 'Melenyapkan' menyampaikan akibat tindakan itu secara alami tanpa menambahkan rincian cara.
- source_word: מִפָּנֶיךָ
  choice: dari hadapanmu
  rationale: Mempertahankan ungkapan ruang Ibrani, yaitu musuh-musuh disingkirkan dari depan atau kehadiran Daud.
- source_word: וְעָשִׂיתִי לְךָ שֵׁם
  choice: Aku akan membuat namamu termasyhur
  rationale: Dalam rangkaian janji, bentuk ini berdaya masa depan. שֵׁם di sini menunjuk pada nama dalam arti kemasyhuran atau reputasi; rumusan ini alami dalam bahasa Indonesia.
- source_word: כְּשֵׁם הַגְּדוֹלִים
  choice: seperti nama orang-orang besar
  rationale: Mempertahankan perbandingan dengan nama atau kemasyhuran tokoh-tokoh terkemuka tanpa membatasi mereka secara eksplisit pada jenis kelamin tertentu.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: yang ada di bumi
  rationale: אֶרֶץ dapat berarti 'bumi' atau 'negeri'. Cakupan luas mengenai kemasyhuran mendukung 'bumi', sementara alternatifnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Urutan waktu tindakan ilahi
  choice: Dua tindakan pertama dipahami sebagai karya Allah pada masa lampau, lalu klausa terakhir sebagai janji untuk masa depan.
  alternative: Semua klausa dapat diseragamkan sebagai tindakan lampau atau sebagai tindakan masa depan.
  rationale: Bentuk wayyiqtol pertama-tama mengenang penyertaan dan kemenangan yang telah Allah berikan kepada Daud, sedangkan bentuk terakhir dalam konteks rangkaian janji secara wajar menunjuk ke masa depan.
- issue: Makna 'nama' dalam janji kepada Daud
  choice: Dinyatakan sebagai 'membuat namamu termasyhur', dengan idiom Ibrani dijelaskan dalam catatan kaki.
  alternative: 'Terjemahan lebih harfiah: ''membuat bagimu sebuah nama''.'
  rationale: שֵׁם tetap mendasari terjemahan, tetapi dalam konteks ini menunjuk pada reputasi atau kemasyhuran, bukan sekadar sebutan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti 'Aku' dan '-mu' dipakai untuk tuturan langsung Allah kepada Daud. Struktur ayat dibuat alami tanpa menghilangkan peralihan dari tindakan lampau kepada janji masa depan; ambiguitas אֶרֶץ dipertahankan melalui catatan kaki.
