source:
  edition: WLC
  text: כִּ֣י לֹ֤א יָשַׁ֨בְתִּי֙ בְּ/בַ֔יִת מִן הַ/יּ֗וֹם אֲשֶׁ֤ר הֶעֱלֵ֨יתִי֙ אֶת יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָֽ/אֶהְיֶ֛ה מֵ/אֹ֥הֶל אֶל אֹ֖הֶל וּ/מִ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/005.yaml
  text: For I have not lived in a house from the day that I brought up Israel to this day[a], but I have gone from tent to tent and from dwelling place to dwelling place.
translation:
  language: id
  text: Sebab Aku tidak tinggal dalam sebuah rumah sejak hari Aku membawa Israel keluar sampai hari ini. Melainkan, Aku berpindah-pindah dari kemah ke kemah dan dari tempat kediaman ke tempat kediaman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian akhir berbunyi, “Aku berada dari kemah ke kemah dan dari tempat kediaman.” Dalam bahasa Ibrani, sesudah “dan dari tempat kediaman” pasangan tujuan kedua tidak disebutkan secara eksplisit; teks utama melengkapinya mengikuti pola sebelumnya. Kata yang diterjemahkan “tempat kediaman” juga dapat berarti “Kemah Suci.”
    reason: Menandai pelengkapan elipsis/teks yang tidak lengkap pada frasa penutup serta mempertahankan kemungkinan makna teknis מִשְׁכָּן.
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: tinggal
  rationale: Dalam konstruksi dengan lokasi, יָשַׁב berarti tinggal atau berdiam; “tinggal” alami dalam bahasa Indonesia modern dan tidak mengesankan tindakan duduk.
- source_word: בְּבַיִת
  choice: dalam sebuah rumah
  rationale: בַּיִת di sini menunjuk secara umum kepada bangunan permanen dan dikontraskan dengan kemah; “bait” atau “Bait Allah” akan terlalu cepat memasukkan gagasan tentang bangunan suci tertentu.
- source_word: הֶעֱלֵיתִי אֶת יִשְׂרָאֵל
  choice: Aku membawa Israel keluar
  rationale: Bentuk Hifil dari עלה berarti membawa atau menuntun naik. Dalam konteks perjalanan Israel dari Mesir, “membawa ... keluar” menyampaikan maksud ungkapan itu secara alami tanpa menambahkan nama Mesir yang tidak tertulis dalam ayat.
- source_word: וָאֶהְיֶה
  choice: Aku berpindah-pindah
  rationale: Secara bentuk berarti “Aku berada,” tetapi rangkaian מִן ... אֶל (“dari ... ke ...”) menyiratkan perpindahan. “Berpindah-pindah” mengungkapkan implikasi gerak tersebut dalam bahasa Indonesia yang wajar.
- source_word: מֵאֹהֶל אֶל אֹהֶל
  choice: dari kemah ke kemah
  rationale: Terjemahan ini mempertahankan pengulangan dan gambaran tempat tinggal yang dapat dipindahkan.
- source_word: וּמִמִּשְׁכָּן
  choice: dan dari satu tempat kediaman ke tempat kediaman lain
  rationale: מִשְׁכָּן dapat berarti tempat kediaman atau Kemah Suci. Teks Ibrani hanya menyatakan unsur awal “dan dari tempat kediaman,” sehingga tujuan kedua dipahami secara elipsis dari pola sebelumnya; pelengkapannya menghasilkan bahasa Indonesia yang dapat dipahami, sementara bentuk ringkas sumber dicatat dalam catatan kaki.
theological_decisions:
- issue: Istilah tempat suci tanpa memasukkan teologi Bait Allah yang lebih kemudian
  choice: Memakai “rumah,” “kemah,” dan “tempat kediaman” dalam teks utama.
  alternative: Memakai “Bait Allah” untuk בַּיִת dan “Kemah Suci” untuk מִשְׁכָּן.
  rationale: Ayat ini menekankan perbedaan antara bangunan permanen dan tempat kediaman yang dapat dipindahkan. Istilah teknis dapat mempersempit arti lebih daripada yang dinyatakan teks Ibrani.
- issue: Elipsis pada frasa penutup
  choice: Melengkapi pola menjadi “dari satu tempat kediaman ke tempat kediaman lain” dan mencatat bentuk harfiahnya.
  alternative: Menerjemahkan secara ketat, “dan dari tempat kediaman,” atau memahami מִשְׁכָּן secara teknis sebagai “Kemah Suci.”
  rationale: Frasa sumber berakhir secara ringkas sesudah וּמִמִּשְׁכָּן. Pola “dari ... ke ...” pada klausa sebelumnya mendukung elipsis, tetapi ketidaklengkapan bentuk Ibrani tidak boleh disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab Indonesia. “Sebaliknya” dipakai untuk memperjelas pertentangan antara rumah permanen dan perpindahan di antara tempat-tempat kediaman sementara.
