  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יְהוָ֔ה הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ יֵאָמֵ֖ן עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/023.yaml
  text: And now[a], Yahweh, let the word that you have spoken concerning your servant and concerning his house be established forever, and do as you have spoken.
translation:
  language: id
  text: Dan sekarang, ya Yahweh, kiranya perkataan yang telah Engkau ucapkan mengenai hamba-Mu dan mengenai rumahnya[a] diteguhkan untuk selama-lamanya. Lakukanlah seperti yang telah Engkau ucapkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “rumahnya” dapat merujuk pada rumah tangga, garis keturunan, atau dinasti kerajaannya dalam konteks perjanjian ini.
    reason: Menjelaskan cakupan makna בֵּיתוֹ tanpa menggantikan metafora “rumah” dalam teks utama.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Dan sekarang
  rationale: Mempertahankan kata penghubung dan penanda waktu yang mengalihkan doa Daud dari bagian sebelumnya kepada permohonan ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: הַדָּבָר
  choice: perkataan
  rationale: Mencerminkan arti dasar 'kata/perkataan' dan kaitannya dengan apa yang telah Allah ucapkan, tanpa mempersempitnya secara eksplisit menjadi 'janji'.
- source_word: עַל עַבְדְּךָ וְעַל בֵּיתוֹ
  choice: mengenai hamba-Mu dan mengenai kaum keluarganya
  rationale: עַל menyatakan pokok perkataan, sedangkan 'kaum keluarganya' mengungkapkan בֵּיתוֹ secara alami dalam bahasa Indonesia serta tetap dapat mencakup rumah tangga, garis keturunan, dan wangsa.
- source_word: יֵאָמֵן
  choice: kiranya ... diteguhkan
  rationale: Bentuk Nifal dari אמן menyatakan dibuat kukuh atau diteguhkan; 'kiranya' menyampaikan daya permohonan bentuk verbal tersebut.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan Indonesia yang wajar dan khidmat untuk keberlangsungan tanpa akhir.
- source_word: וַעֲשֵׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: Lakukanlah seperti yang telah Engkau ucapkan
  rationale: Mempertahankan permohonan langsung agar Allah bertindak sesuai dengan perkataan-Nya serta mengulang verba 'ucapkan' seperti dalam bahasa Ibrani.
theological_decisions:
- issue: Makna בֵּיתוֹ dalam konteks perjanjian dengan Daud
  choice: kaum keluarganya
  alternative: rumahnya; keturunannya; wangsanya
  rationale: Dalam konteks ini, 'rumah' menunjuk bukan hanya pada bangunan atau penghuni rumah, melainkan juga pada garis keluarga dan wangsa kerajaan Daud. 'Kaum keluarganya' cukup alami dalam bahasa Indonesia dan tidak mempersempit makna hanya kepada dinasti; catatan kaki mempertahankan metafora Ibraninya dan cakupan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk sapaan ilahi memakai “Engkau” dan akhiran “-Mu”. Pengulangan “mengenai” dan “ucapkan” dipertahankan untuk mencerminkan susunan serta kesejajaran teks Ibrani.
