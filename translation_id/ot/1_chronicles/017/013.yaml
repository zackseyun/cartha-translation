base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/013.yaml
  text: I will be a father to him[a], and he will be a son to me. And I will not remove my steadfast love from him[b], as I removed it from the one who was before you.
translation:
  language: id
  text: Aku akan menjadi bapa baginya[a], dan ia akan menjadi anak bagi-Ku. Aku tidak akan menarik kasih setia-Ku daripadanya, seperti yang telah Kutarik dari orang yang mendahului engkau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan menjadi bapanya, dan ia akan menjadi anak-Ku.”
    reason: lexical_alternative
  - marker: b
    text: “Orang yang mendahului engkau” merujuk kepada Saul, pendahulu Daud sebagai raja.
    reason: cross_reference
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: Aku akan menjadi bapa baginya
  rationale: Ungkapan ini mempertahankan susunan relasional Ibrani, secara harfiah ‘Aku akan menjadi baginya sebagai bapa’, sambil tetap wajar dalam bahasa Indonesia.
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: dan ia akan menjadi anak bagi-Ku
  rationale: Pilihan ini mencerminkan klausa pertama dan mempertahankan bahasa hubungan perjanjian serta pengangkatan sebagai anak.
- source_word: חַסְדִּי
  choice: kasih setia-Ku
  rationale: חֶסֶד mencakup kasih, kesetiaan, dan keteguhan dalam hubungan perjanjian. ‘Kasih setia’ mengungkapkan keluasan makna itu tanpa membatasinya hanya pada belas kasihan atau kewajiban hukum.
- source_word: לֹא אָסִיר מֵעִמּוֹ
  choice: Aku tidak akan menjauhkan ... darinya
  rationale: Bentuk kausatif סור berarti menyingkirkan atau menjauhkan. ‘Menjauhkan ... darinya’ alami dalam bahasa Indonesia dan memungkinkan pengulangan kata kerja pada klausa pembanding.
- source_word: כַּאֲשֶׁר הֲסִירוֹתִי
  choice: seperti Aku menjauhkannya
  rationale: Terjemahan ini menggemakan kata kerja sebelumnya. Akhiran ‘-nya’ menyatakan objek yang dipahami dari klausa terdahulu, yaitu kasih setia Allah.
- source_word: מֵאֲשֶׁר הָיָה לְפָנֶיךָ
  choice: dari orang yang ada sebelum engkau
  rationale: Teks Ibrani tidak menyebut Saul secara langsung. ‘Sebelum engkau’ mempertahankan ungkapan sumber dan menunjuk pada pendahulu Daud dalam kedudukan sebagai raja.
theological_decisions:
- issue: Bahasa bapa-anak dalam perjanjian dengan Daud
  choice: Mempertahankan ungkapan langsung ‘bapa’ dan ‘anak’.
  alternative: Aku akan memperlakukannya seperti seorang bapa, dan ia akan menjadi seperti anak bagi-Ku.
  rationale: Teks menyatakan hubungan perjanjian dan status kerajaan dengan bahasa kekeluargaan langsung. Parafrasa dengan ‘seperti’ akan melemahkan pernyataan itu.
- issue: Makna חֶסֶד dalam konteks perjanjian
  choice: kasih setia
  alternative: belas kasihan; kesetiaan perjanjian; kemurahan
  rationale: ‘Kasih setia’ mempertahankan sekaligus unsur kasih dan keteguhan kesetiaan perjanjian, tanpa menyelesaikan ketegangan maknanya secara terlalu sempit.
- issue: Identitas orang yang ada sebelum Daud
  choice: Tidak menyebut Saul dalam teks utama.
  alternative: Saul
  rationale: Walaupun rujukannya adalah Saul, teks Ibrani memakai ungkapan tidak langsung. Identifikasi dijelaskan dalam catatan kaki agar bentuk teks sumber tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. ‘Bapa’ dipilih untuk hubungan personal dan perjanjian, sedangkan ‘ayah’ dinilai terlalu sehari-hari untuk register ini.
