base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/004.yaml
  text: 'Go and say to David my servant[b][a], ‘Thus says Yahweh: You shall not build for me the house to dwell in.’'
translation:
  language: id
  text: 'Pergilah dan katakanlah kepada Daud, hamba-Ku, ‘Beginilah firman Yahweh: Bukan engkau yang akan membangun rumah bagi-Ku untuk Kudiami.’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau tidak akan membangun rumah bagi-Ku untuk Kudiami.” Secara harfiah, “Bukan engkau yang akan membangun bagi-Ku rumah untuk Kudiami.” Dalam konteks ini, rumah itu adalah tempat kediaman Yahweh, yaitu Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ וְאָמַרְתָּ
  choice: Pergilah dan katakanlah
  rationale: Rangkaian perintah ini diterjemahkan secara langsung dan wajar dalam bahasa Indonesia, dengan bentuk imperatif yang mempertahankan nada penugasan ilahi.
- source_word: דָּוִיד עַבְדִּי
  choice: Daud, hamba-Ku
  rationale: Sebutan עֶבֶד dalam konteks kerajaan dan perjanjian menunjuk pada Daud sebagai pelayan yang ditugaskan Yahweh; “hamba-Ku” lebih tepat daripada “budak-Ku”.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Ungkapan ini merupakan rumus berita kenabian. “Beginilah firman” alami dan bermartabat dalam bahasa Indonesia, sedangkan nama perjanjian יְהוָה dipertahankan sebagai “Yahweh”.
- source_word: לֹא אַתָּה תִּבְנֶה
  choice: Bukan engkau yang akan membangun
  rationale: 'Kehadiran eksplisit אַתָּה setelah negasi memberi penekanan pada pelakunya: bukan Daud yang akan membangun. Terjemahan ini mempertahankan fokus tersebut tanpa mengubahnya menjadi larangan biasa.'
- source_word: לִּי הַבַּיִת
  choice: bagi-Ku rumah
  rationale: לִי menyatakan kepentingan atau tujuan, sehingga “bagi-Ku” tepat. Kata בַּיִת tetap diterjemahkan “rumah,” bukan diperjelas menjadi “Bait Allah,” agar gambaran dan pilihan kata sumber terpelihara.
- source_word: לָשָׁבֶת
  choice: untuk Kudiami
  rationale: Infinitif ini menyatakan tujuan rumah tersebut. Subjek ilahi tersirat dari konteks dan dibuat jelas secara alami melalui “Kudiami”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama ilahi secara langsung; “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Penekanan dalam לֹא אַתָּה תִּבְנֶה
  choice: Bukan engkau yang akan membangun
  alternative: Engkau tidak akan membangun atau Engkau tidak boleh membangun
  rationale: Susunan Ibrani menonjolkan kata ganti “engkau,” sehingga persoalannya terutama identitas pembangun, bukan semata-mata larangan. Bentuk alternatif tetap mungkin secara gramatikal dan dicatat dalam catatan kaki.
- issue: Makna הַבַּיִת dalam konteks
  choice: rumah
  alternative: Bait Allah
  rationale: Secara kontekstual rumah itu adalah tempat ibadah yang hendak didirikan bagi Yahweh, tetapi teks memakai kata umum “rumah.” Pilihan utama mempertahankan metafora sumber.
translation_notes:
  register: Bahasa Indonesia modern yang formal dan mudah dipahami. Bentuk “Bukan engkau yang akan membangun” mempertahankan penekanan Ibrani, sementara “rumah” menjaga citra sumber; catatan kaki menjelaskan alternatif sintaksis dan rujukan kontekstualnya.
