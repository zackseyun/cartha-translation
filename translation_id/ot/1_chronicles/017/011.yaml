id: 1CH.17.11
reference: 1 Chronicles 17:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי מָלְא֤וּ יָמֶ֨י/ךָ֙ לָ/לֶ֣כֶת עִם אֲבֹתֶ֔י/ךָ וַ/הֲקִֽימוֹתִ֤י אֶֽת זַרְעֲ/ךָ֙ אַחֲרֶ֔י/ךָ אֲשֶׁ֥ר יִהְיֶ֖ה מִ/בָּנֶ֑י/ךָ וַ/הֲכִינוֹתִ֖י אֶת מַלְכוּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/011.yaml
  text: And it shall be[a], when your days are fulfilled to go to be with your fathers, that I will raise up your offspring after you, who shall be one of your sons, and I will establish his kingdom.
translation:
  language: id
  text: Kelak, ketika umurmu sudah genap dan engkau pergi bersama leluhurmu,[a] Aku akan membangkitkan keturunanmu sesudah engkau, yaitu salah seorang anakmu, dan Aku akan meneguhkan kerajaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pergi bersama leluhurmu,” sebuah ungkapan Ibrani yang berarti meninggal dan bergabung dengan para leluhur.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Kelak, ketika
  rationale: Ungkapan ini memperkenalkan keadaan pada masa mendatang. “Kelak, ketika” menyampaikan peralihan temporal secara alami dan khidmat dalam bahasa Indonesia.
- source_word: מָלְאוּ יָמֶיךָ
  choice: umurmu sudah genap
  rationale: Secara harfiah ungkapan ini berbicara tentang ‘hari-hari’ yang menjadi penuh, yakni berakhirnya masa hidup. “Umurmu sudah genap” mempertahankan corak idiomatis sekaligus jelas bagi pembaca modern.
- source_word: לָלֶכֶת עִם אֲבֹתֶיךָ
  choice: pergi bersama leluhurmu
  rationale: Terjemahan ini mempertahankan ungkapan khas Tawarikh, ‘pergi bersama leluhur,’ tanpa menggantinya dengan ungkapan Ibrani lain seperti ‘berbaring bersama leluhur.’ Maknanya dijelaskan dalam catatan kaki.
- source_word: וַהֲקִימוֹתִי
  choice: Aku akan membangkitkan
  rationale: Bentuk kausatif dari קום di sini menunjuk pada tindakan Allah memunculkan seorang penerus. “Membangkitkan” membedakannya dari הכין yang diterjemahkan “meneguhkan” pada akhir ayat.
- source_word: זַרְעֲךָ
  choice: keturunanmu
  rationale: “Keturunan” merupakan padanan Indonesia yang wajar bagi זרע dan dapat menampung nuansa kolektif maupun rujukan tunggal yang ditentukan konteks.
- source_word: אַחֲרֶיךָ
  choice: sesudah engkau
  rationale: Frasa ini menyatakan urutan waktu dan pergantian dinasti secara ringkas tanpa menambahkan keterangan yang tidak tersurat.
- source_word: אֲשֶׁר יִהְיֶה מִבָּנֶיךָ
  choice: yaitu salah seorang anakmu
  rationale: 'Terjemahan ini menyampaikan nilai partitif מן: penerus yang dijanjikan adalah seorang dari antara anak-anak Daud. Bentuk ini juga alami dalam bahasa Indonesia.'
- source_word: וַהֲכִינוֹתִי
  choice: Aku akan meneguhkan
  rationale: הכין dalam konteks kerajaan berarti membuat kokoh, mantap, atau terjamin. “Meneguhkan” mempertahankan nuansa tersebut dan tidak mengulang “membangkitkan.”
- source_word: מַלְכוּתוֹ
  choice: kerajaannya
  rationale: “Kerajaan” mencakup pemerintahan dan ranah dinasti yang dimaksud, sedangkan “kedudukan sebagai raja” akan mempersempit cakupannya.
theological_decisions:
- issue: Janji dinasti dan kemungkinan gema mesianik
  choice: Menerjemahkan rujukan langsung kepada seorang penerus Daud dari antara anak-anaknya tanpa menambahkan gelar mesianik.
  alternative: Menjadikan rujukan mesianik eksplisit dalam teks utama.
  rationale: Ayat ini secara langsung menjanjikan seorang keturunan Daud dari antara anak-anaknya dan peneguhan kerajaannya. Terjemahan mempertahankan makna historis langsung serta membiarkan perkembangan mesianik muncul dari konteks kanonis, bukan dari tambahan penerjemah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Aku” mengikuti rujukan kepada Allah. Ungkapan kematian dipertahankan cukup dekat dengan bentuk Ibrani dan diterangkan melalui catatan kaki.
