  text: וְ/עַתָּ֣ה יְהוָ֔ה אַתָּה ה֖וּא הָ/אֱלֹהִ֑ים וַ/תְּדַבֵּר֙ עַֽל עַבְדְּ/ךָ֔ הַ/טּוֹבָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/026.yaml
  text: And now[a], Yahweh, you are God, and you have spoken this good thing concerning your servant.
translation:
  language: id
  text: Dan sekarang, ya Yahweh, Engkaulah Allah, dan Engkau telah berfirman tentang hamba-Mu, hal yang baik ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “janji yang baik ini.” Secara harfiah, bahasa Ibrani berbunyi “hal yang baik ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Dan sekarang
  rationale: Mempertahankan daya penghubung וְ sekaligus peralihan temporal dan retoris dalam doa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, sesuai dengan bentuk nama perjanjian dalam teks sumber.
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: Engkaulah Allah
  rationale: Akhiran -lah menyampaikan penegasan pada rangkaian pronomina אַתָּה הוּא secara wajar dalam bahasa Indonesia.
- source_word: וַתְּדַבֵּר
  choice: dan Engkau telah menyatakan
  rationale: Bentuk perfektif dalam alur doa menunjuk pada firman yang telah disampaikan dan tetap relevan; 'menyatakan' mempertahankan tindakan berbicara tanpa langsung menafsirkannya sebagai janji.
- source_word: עַל עַבְדְּךָ
  choice: mengenai hamba-Mu
  rationale: עַל bersama verba berbicara menandai pokok pembicaraan; 'hamba-Mu' merupakan sebutan merendahkan diri yang sesuai dalam doa kepada Allah.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: hal yang baik ini
  rationale: Mengikuti ungkapan Ibrani yang secara harfiah berarti 'yang baik ini', dengan 'hal' ditambahkan agar alami dalam bahasa Indonesia; konteks memungkinkan makna janji tetapi tidak memaksakannya dalam teks utama.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar.
- issue: Apakah הַטּוֹבָה הַזֹּאת harus dijelaskan sebagai janji
  choice: hal yang baik ini
  alternative: janji yang baik ini
  rationale: Konteks memang mengarah pada janji Allah, tetapi nomina 'janji' tidak dinyatakan secara eksplisit dalam bahasa Ibrani. Ambiguitas leksikal dipertahankan dalam teks utama dan alternatif kontekstual dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai bentuk hormat berhuruf kapital. Struktur koordinatif dan penegasan asli dipertahankan tanpa membuat kalimat terasa kaku.
