source:
  edition: WLC
  text: וּ/מִי֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁר֩ הָלַ֨ךְ הָ/אֱלֹהִ֜ים לִ/פְדּ֧וֹת ל֣/וֹ עָ֗ם לָ/שׂ֤וּם לְ/ךָ֙ שֵׁ֚ם גְּדֻלּ֣וֹת וְ/נֹרָא֔וֹת לְ/גָרֵ֗שׁ מִ/פְּנֵ֧י עַמְּ/ךָ֛ אֲשֶׁר פָּדִ֥יתָ מִ/מִּצְרַ֖יִם גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/021.yaml
  text: And who is like your people Israel[a], one nation on the earth, whom God went to redeem for himself as a people, to make for yourself a name by great and fearsome deeds, driving out nations from before your people[b], whom you redeemed from Egypt?
translation:
  language: id
  text: Dan siapakah yang seperti umat-Mu, Israel, satu bangsa di bumi, yang Allah datangi untuk ditebus-Nya bagi diri-Nya sebagai umat, untuk menjadikan nama-Mu masyhur melalui perbuatan-perbuatan besar dan dahsyat, dengan menghalau bangsa-bangsa dari hadapan umat-Mu yang telah Kautebus dari Mesir?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata "bangsa-bangsa" dalam bahasa Ibrani muncul pada akhir kalimat dan dapat dipahami secara berbeda dalam hubungannya dengan klausa sebelumnya; bagian sejajarnya dalam 2 Samuel 7:23 juga memiliki persoalan tekstual.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ יִשְׂרָאֵל
  choice: Dan siapakah yang seperti umat-Mu Israel
  rationale: Mempertahankan kata tanya personal מִי, bentuk perbandingan, dan sapaan perjanjian 'umat-Mu'.
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: satu bangsa di bumi
  rationale: Menyampaikan arti formal tanpa memperluasnya secara tafsir menjadi 'satu-satunya bangsa' atau 'bangsa yang unik'.
- source_word: אֲשֶׁר הָלַךְ הָאֱלֹהִים לִפְדּוֹת לוֹ עָם
  choice: yang untuknya Allah pergi menebus suatu umat bagi diri-Nya
  rationale: Mempertahankan bahasa gerak antropomorfis הָלַךְ, tindakan penebusan, dan tujuan bahwa umat itu menjadi milik Allah.
- source_word: לָשׂוּם לְךָ שֵׁם
  choice: untuk membuat nama bagi-Mu
  rationale: Ungkapan ini menyatakan bahwa tindakan penebusan Allah menegakkan kemasyhuran-Nya; bentuk orang kedua dipertahankan.
- source_word: גְּדֻלּוֹת וְנוֹרָאוֹת
  choice: perbuatan-perbuatan besar dan dahsyat
  rationale: Kata benda 'perbuatan-perbuatan' melengkapi ungkapan eliptis Ibrani, sedangkan 'dahsyat' mencakup rasa gentar dan kagum dalam נוֹרָאוֹת.
- source_word: לְגָרֵשׁ מִפְּנֵי עַמְּךָ
  choice: menghalau ... dari hadapan umat-Mu
  rationale: Mempertahankan tindakan pengusiran dan gambaran spasial idiom Ibrani מִפְּנֵי.
- source_word: אֲשֶׁר פָּדִיתָ מִמִּצְרַיִם גּוֹיִם
  choice: bangsa-bangsa dari hadapan umat-Mu yang telah Kautebus dari Mesir
  rationale: Menempatkan גּוֹיִם sebagai objek 'menghalau', sambil mempertahankan peralihan ke sapaan orang kedua dan klausa penebusan dari Mesir.
theological_decisions:
- issue: Bahasa tentang Allah membuat nama bagi diri-Nya
  choice: untuk membuat nama bagi-Mu
  alternative: untuk menjadikan nama-Mu termasyhur
  rationale: Pilihan ini mempertahankan ungkapan konkret dan pernyataan bahwa karya penebusan Allah menegakkan kemasyhuran-Nya tanpa memasukkan kategori teologis tambahan.
- issue: Daya makna נוֹרָאוֹת
  choice: dahsyat
  alternative: menakjubkan; menggentarkan
  rationale: '''Dahsyat'' secara alami dapat menyatakan kedahsyatan yang membangkitkan kagum sekaligus gentar, sehingga ketegangan makna sumber tidak dipersempit hanya menjadi kekaguman atau ketakutan.'
- issue: Peralihan dari penyebutan Allah dalam orang ketiga ke sapaan orang kedua
  choice: Allah ... diri-Nya ... bagi-Mu ... Kautebus
  alternative: menyeragamkan semuanya menjadi sapaan orang kedua
  rationale: Teks Ibrani sendiri beralih dari הָאֱלֹהִים dan לוֹ ke לְךָ serta פָּדִיתָ. Peralihan retoris ini dipertahankan dan tidak dihaluskan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang luhur tetapi tetap mudah dipahami. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Susunan kalimat panjang dipertahankan karena ayat ini merupakan satu pertanyaan retoris, tetapi penghubung ditata agar alurnya jelas.
