  text: וַ/יָּבֹא֙ הַ/מֶּ֣לֶךְ דָּוִ֔יד וַ/יֵּ֖שֶׁב לִ/פְנֵ֣י יְהוָ֑ה וַ/יֹּ֗אמֶר מִֽי אֲנִ֞י יְהוָ֤ה אֱלֹהִים֙ וּ/מִ֣י בֵיתִ֔/י כִּ֥י הֲבִיאֹתַ֖/נִי עַד הֲלֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/016.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, O Yahweh God, and what is my house, that you have brought me this far?”
translation:
  language: id
  text: Kemudian Raja Daud masuk dan duduk di hadapan Yahweh, lalu berkata, “Siapakah aku ini, ya Yahweh Allah, dan siapakah keluargaku[a], sehingga Engkau telah membawa aku sampai sejauh ini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumahku.” Kata Ibrani ini dapat berarti rumah tangga, keluarga, wangsa, atau dinasti; dalam konteks ini, garis kerajaan Daud juga tercakup.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: masuk
  rationale: Kata בוא dapat berarti datang, pergi, atau masuk. Dalam konteks Daud menghadap hadirat ilahi, “masuk” menyampaikan gerak menuju suatu tempat tanpa menentukan lokasi yang tidak disebutkan.
- source_word: וַיֵּשֶׁב
  choice: duduk
  rationale: Walaupun ישב juga dapat berarti tinggal atau menetap, urutan tindakan setelah “masuk” mendukung arti konkret “duduk”.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini secara alami menyatakan kehadiran atau posisi di hadapan Allah, sedangkan nama perjanjian יְהוָה dipertahankan sebagai “Yahweh”.
- source_word: יְהוָה אֱלֹהִים
  choice: ya Yahweh Allah
  rationale: Partikel “ya” menandai sapaan langsung dengan wajar dalam bahasa Indonesia; יְהוָה diterjemahkan “Yahweh” dan אֱלֹהִים sebagai “Allah”.
- source_word: מִי אֲנִי
  choice: Siapakah aku ini
  rationale: Bentuk ini merupakan ungkapan Indonesia yang alami untuk kerendahan hati dan rasa tidak layak yang disampaikan Daud.
- source_word: וּמִי בֵיתִי
  choice: dan apakah keluargaku
  rationale: Bahasa Ibrani secara harfiah mengulang “siapa” dan memakai “rumahku”. Dalam bahasa Indonesia, “apakah keluargaku” lebih alami dan menyampaikan rujukan kolektifnya tanpa mempersempitnya hanya kepada bangunan.
- source_word: בֵיתִי
  choice: keluargaku
  rationale: בַּיִת dalam konteks ini merujuk kepada keluarga atau garis keturunan kerajaan Daud. “Keluargaku” mudah dipahami, sementara kemungkinan makna wangsa atau dinasti dicatat dalam catatan kaki.
- source_word: כִּי
  choice: sehingga
  rationale: Di sini כִּי menghubungkan pertanyaan retoris dengan keadaan yang menimbulkan keheranan Daud. “Sehingga” menyatakan hubungan itu secara alami.
- source_word: הֲבִיאֹתַנִי
  choice: Engkau membawa aku
  rationale: Bentuk kausatif dari בוא secara langsung berarti menyebabkan datang atau membawa; “membawa aku” mempertahankan tindakan Allah dalam mengangkat Daud sampai pada keadaannya sekarang.
- source_word: עַד הֲלֹם
  choice: sampai sejauh ini
  rationale: Ungkapan ini menunjukkan pencapaian hingga titik sekarang, baik dalam perjalanan hidup maupun kedudukan Daud; padanan ini mempertahankan keluwesan tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung. “Yahweh” mempertahankan nama diri itu dan membedakannya dari gelar ilahi.
- issue: Cakupan makna בֵּיתִי dalam janji kepada Daud
  choice: keluargaku, dengan catatan tentang rumah tangga, wangsa, dan dinasti
  alternative: rumahku
  rationale: Konteks pasal ini menyangkut keturunan dan garis kerajaan Daud. Pilihan utama dibuat alami dalam bahasa Indonesia, tetapi catatan mempertahankan keluasan metafora Ibrani serta kaitannya dengan dinasti tanpa memaksakan satu penafsiran sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “ya Yahweh Allah” mempertahankan bentuk langsung doa Daud. Kapitalisasi “Engkau” dipakai sebagai konvensi penghormatan dalam wacana religius Indonesia, bukan untuk menambahkan informasi gramatikal pada teks Ibrani.
