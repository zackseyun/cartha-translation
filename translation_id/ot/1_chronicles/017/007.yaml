  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗יד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מִֽן אַחֲרֵ֖י הַ/צֹּ֑אן לִ/הְי֣וֹת נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/007.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people Israel.'
translation:
  language: id
  text: 'Maka sekarang, katakanlah kepada hamba-Ku Daud: Beginilah Yahweh Semesta Alam berfirman: “Akulah yang mengambil engkau dari padang rumput, dari mengikuti kawanan domba, untuk menjadi pemimpin atas umat-Ku Israel.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Menandai peralihan sekaligus hubungan logis dengan perkataan sebelumnya; lebih alami daripada terjemahan yang semata-mata temporal.
- source_word: כֹּה תֹאמַר
  choice: katakanlah
  rationale: Imperatif bahasa Indonesia menyampaikan daya direktif bentuk Ibrani; isi yang harus dikatakan langsung menyusul setelah titik dua.
- source_word: לְעַבְדִּי לְדָוִיד
  choice: kepada hamba-Ku Daud
  rationale: Dalam konteks ini עֶבֶד merupakan sebutan kehormatan bagi orang yang mengabdi kepada Allah, bukan penekanan pada status perbudakan.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Rumusan kenabian yang wajar, khidmat, dan lazim dipahami dalam bahasa Indonesia; bentuk perfek Ibrani berfungsi memperkenalkan perkataan ilahi yang sedang disampaikan.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh Penguasa Semesta
  rationale: Nama perjanjian dipertahankan sebagai Yahweh. צְבָאוֹת secara harfiah berkaitan dengan bala tentara, tetapi dalam gelar ilahi cakupannya luas; 'Penguasa Semesta' menyampaikan kedaulatan universal tanpa membatasinya pada pasukan manusia.
- source_word: אֲנִי לְקַחְתִּיךָ
  choice: Akulah yang mengambil engkau
  rationale: Konstruksi dengan pronomina eksplisit אֲנִי menonjolkan prakarsa Yahweh; 'Akulah yang' mempertahankan penekanan tersebut.
- source_word: מִן הַנָּוֶה
  choice: dari padang rumput
  rationale: Dalam konteks penggembalaan, נָוֶה menunjuk tempat merumput atau kediaman kawanan; 'padang rumput' paling langsung dan alami.
- source_word: מִן אַחֲרֵי הַצֹּאן
  choice: dari belakang kawanan domba
  rationale: Mempertahankan secara konkret gambaran Daud berjalan di belakang kawanan sebagai gembala, tanpa menggantinya dengan uraian interpretatif seperti 'ketika menggembalakan.'
- source_word: לִהְיוֹת נָגִיד
  choice: untuk menjadi pemimpin
  rationale: נָגִיד menunjuk orang yang ditetapkan untuk memimpin atau memerintah. 'Pemimpin' menjaga keluasan istilah dan tidak memaksakan gelar teknis 'raja' atau 'pangeran.'
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: atas umat-Ku Israel
  rationale: Mempertahankan preposisi otoritas עַל serta penegasan bahwa Israel adalah umat milik Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menyebut Tetragramaton secara langsung; bentuk 'Yahweh' mempertahankan nama perjanjian dan membedakannya dari gelar umum.
- issue: Makna gelar צְבָאוֹת
  choice: Penguasa Semesta
  alternative: Bala Tentara atau bala tentara surgawi
  rationale: Gelar ini dapat membangkitkan gambaran bala tentara, tetapi tidak harus dibatasi pada pasukan manusia ataupun ditentukan hanya sebagai pasukan surgawi. Pilihan ini mengomunikasikan cakupan kedaulatan ilahi secara alami.
- issue: Status Daud sebagai עַבְדִּי
  choice: hamba-Ku
  alternative: budak-Ku
  rationale: Dalam konteks pengangkatan Daud, istilah tersebut berfungsi sebagai sebutan relasional dan kehormatan bagi pelayan pilihan Allah; 'budak' akan terlalu menonjolkan status sosial yang bukan fokus ayat.
- issue: Jabatan נָגִיד
  choice: pemimpin
  alternative: penguasa atau pangeran
  rationale: Istilah Ibrani mencakup kepemimpinan dan kewenangan pemerintahan tanpa identik secara sederhana dengan gelar 'raja'; 'pemimpin' mempertahankan keluasan itu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Sapaan orang kedua 'engkau' dipakai dalam firman ilahi langsung. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab Indonesia. Tidak ada penanda catatan kaki karena draf ini tidak memerlukan catatan untuk memahami ambiguitas utama; pilihan נָגִיד dipertahankan secara luas sebagai 'pemimpin'.
