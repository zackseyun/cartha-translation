  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הוֹאַ֨לְתָּ֙ לְ/בָרֵךְ֙ אֶת בֵּ֣ית עַבְדְּ/ךָ֔ לִ/הְי֥וֹת לְ/עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽי אַתָּ֤ה יְהוָה֙ בֵּרַ֔כְתָּ וּ/מְבֹרָ֖ךְ לְ/עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/027.yaml
  text: And now[a], you have been pleased to bless the house of your servant, that it may be before you forever; for you, O Yahweh, have blessed it[c][b], and it is blessed forever.
translation:
  language: id
  text: Dan sekarang, Engkau telah berkenan memberkati keluarga[a] hamba-Mu, supaya tetap berada di hadapan-Mu untuk selama-lamanya. Sebab Engkau, ya Yahweh, telah memberkatinya, dan keluarga itu diberkati untuk selama-lamanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah hamba-Mu.” Dalam konteks ini, “rumah” menunjuk kepada keluarga, wangsa Daud, atau keturunannya, bukan hanya bangunan tempat tinggal.
    reason: cultural_note
  - marker: b
    text: Atau, “dan kiranya keluarga itu diberkati untuk selama-lamanya.” Bentuk Ibraninya lebih wajar dibaca sebagai pernyataan tentang keadaan yang terus diberkati, tetapi sebagian orang memahaminya sebagai ungkapan harapan.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan wacana dan waktu secara alami dalam bahasa Indonesia; hubungan dengan kalimat sebelumnya tetap tersirat.
- source_word: הוֹאַלְתָּ
  choice: Engkau telah berkenan
  rationale: Dalam konteks doa, bentuk ini menyatakan kesediaan atau persetujuan penuh kemurahan, bukan sekadar mulai melakukan sesuatu.
- source_word: לְבָרֵךְ
  choice: memberkati
  rationale: Padanan langsung dan lazim bagi infinitif yang melengkapi הוֹאַלְתָּ.
- source_word: בֵּית עַבְדְּךָ
  choice: keluarga hamba-Mu
  rationale: בַּיִת dalam konteks janji kepada Daud terutama menunjuk kepada keluarga atau wangsa keturunannya, bukan bangunan tempat tinggal; 'keluarga' paling mudah dipahami pembaca umum, dengan keluasan dinastis dijelaskan dalam catatan kaki.
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: supaya tetap berada di hadapan-Mu untuk selama-lamanya
  rationale: Menyatakan hasil yang dimaksudkan, sambil mempertahankan gambaran Ibrani tentang keberadaan terus-menerus di hadapan Allah tanpa mempersempitnya menjadi sekadar kelangsungan waktu.
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan dasar bagi pernyataan sebelumnya dalam ragam Indonesia yang wajar dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: בֵּרַכְתָּ
  choice: telah memberkatinya
  rationale: Bentuk perfektif menyatakan tindakan pemberkatan yang sudah dilakukan dan hasilnya tetap relevan.
- source_word: וּמְבֹרָךְ לְעוֹלָם
  choice: dan keluarga itu diberkati untuk selama-lamanya
  rationale: 'Partisipel pasif paling wajar dipahami secara statif/resultatif: oleh karena Yahweh telah memberkati, keluarga itu berada dalam keadaan diberkati selamanya.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna בַּיִת dalam janji kepada Daud
  choice: keluarga, dengan cakupan wangsa/keturunan dijelaskan dalam catatan
  alternative: rumah atau keturunan/wangsa
  rationale: Konteks 1 Tawarikh 17 menunjukkan bahwa yang dimaksud bukan hanya tempat tinggal, melainkan keluarga Daud yang berlanjut secara dinastis. 'Keluarga' alami dalam teks utama dan catatan mempertahankan cakupan tersebut.
- issue: Daya kalimat וּמְבֹרָךְ לְעוֹלָם
  choice: 'pernyataan resultatif: ''diberkati untuk selama-lamanya'''
  alternative: 'harapan: ''kiranya diberkati untuk selama-lamanya'''
  rationale: Bahasa Ibrani memakai partisipel pasif, bukan imperatif atau bentuk yusif yang eksplisit. Karena itu, pembacaan deklaratif lebih langsung, sementara kemungkinan nuansa harapan dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan ilahi berhuruf kapital. Susunan dibuat alami bagi pembaca umum, tetapi ungkapan 'di hadapan-Mu' dan ketegangan pada klausa penutup dipertahankan. Alternatif leksikal הוֹאַלְתָּ tidak diberi catatan karena 'telah berkenan' sudah menyampaikan kesediaan penuh kemurahan secara memadai.
