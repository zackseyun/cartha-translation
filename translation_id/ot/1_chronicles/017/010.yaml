  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/לְ/מִ/יָּמִ֗ים אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הִכְנַ֖עְתִּי אֶת כָּל אוֹיְבֶ֑י/ךָ וָ/אַגִּ֣ד לָ֔/ךְ וּ/בַ֖יִת יִֽבְנֶה לְּ/ךָ֥ יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/010.yaml
  text: from the days when I appointed judges over my people Israel. And I will subdue all your enemies. Moreover[a], I tell you that Yahweh will build you a house.
translation:
  language: id
  text: sejak zaman ketika Aku mengangkat para hakim atas umat-Ku, Israel. Aku akan menundukkan semua musuhmu. Aku juga memberitahukan kepadamu bahwa Yahweh akan membangun rumah[a] bagimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks ini, “rumah” mengacu pada keluarga kerajaan atau dinasti yang akan Yahweh tegakkan bagi Daud.
    reason: Menjelaskan makna dinastis בַּיִת tanpa menghapus metafora dan permainan katanya dari teks utama.
lexical_decisions:
- source_word: וּלְמִיָּמִים
  choice: sejak masa
  rationale: Gabungan preposisi ini menyatakan titik awal waktu yang berhubungan dengan janji dalam konteks sebelumnya. “Sejak masa” alami dalam bahasa Indonesia dan tetap menunjukkan kesinambungan waktu.
- source_word: אֲשֶׁר צִוִּיתִי שֹׁפְטִים
  choice: Aku mengangkat para hakim
  rationale: Dalam konteks sejarah Israel, צוה di sini menunjuk pada tindakan Allah menetapkan atau menugaskan para hakim, bukan sekadar memberi mereka perintah.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: atas umat-Ku Israel
  rationale: Preposisi עַל menyatakan wewenang para hakim atas Israel, sedangkan bentuk posesif “umat-Ku” mempertahankan hubungan perjanjian yang dinyatakan teks.
- source_word: וְהִכְנַעְתִּי
  choice: Aku akan menundukkan
  rationale: Bentuk perfektum berawalan waw ini berada dalam rangkaian janji dan paling tepat dipahami berdaya futur. “Menundukkan” sesuai dengan objek berupa para musuh.
- source_word: אֶת כָּל אוֹיְבֶיךָ
  choice: semua musuhmu
  rationale: Pilihan ini mempertahankan cakupan menyeluruh dari כָּל dan bentuk orang kedua tunggal.
- source_word: וָאַגִּד לָךְ
  choice: Aku juga menyatakan kepadamu
  rationale: נגד menyampaikan pemberitahuan atau pernyataan yang tegas. “Juga” menandai perkembangan wacana menuju janji berikutnya tanpa menambahkan hubungan sebab-akibat.
- source_word: וּבַיִת יִבְנֶה לְּךָ יְהוָה
  choice: Yahweh akan membangun sebuah rumah bagimu
  rationale: 'Susunan ini mempertahankan metafora dan permainan kata בַּיִת: Daud tidak membangun rumah bagi Allah, tetapi Yahweh membangun “rumah” bagi Daud. Makna dinasti tidak dimasukkan langsung ke teks utama.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap terlihat.
theological_decisions:
- issue: Makna “rumah” dalam janji kepada Daud
  choice: Mempertahankan “rumah” dalam teks utama dan menjelaskan makna dinastinya dalam catatan kaki.
  alternative: Menerjemahkannya langsung sebagai “dinasti” atau “keluarga kerajaan”.
  rationale: בַּיִת sengaja memuat ketegangan sastra antara bangunan fisik dan garis keturunan kerajaan. Menerjemahkannya hanya sebagai “dinasti” akan menghilangkan permainan kata yang penting dalam perjanjian dengan Daud.
- issue: Nilai waktu וְהִכְנַעְתִּי
  choice: 'Menerjemahkannya sebagai janji mendatang: “Aku akan menundukkan”.'
  alternative: “Aku telah menundukkan”.
  rationale: Dalam alur nubuat dan janji pada bagian ini, bentuk tersebut melanjutkan tindakan ilahi yang dijanjikan, walaupun bentuk Ibraninya secara morfologis adalah perfektum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada “Aku” dan “umat-Ku” menandai rujukan kepada Allah menurut kebiasaan penerbitan Alkitab Indonesia. Ayat ini dimulai dengan huruf kecil karena secara sintaksis melanjutkan kalimat dari ayat sebelumnya.
