id: 1CH.17.9
reference: 1 Chronicles 17:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י יִשְׂרָאֵ֤ל וּ/נְטַעְתִּ֨י/הוּ֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹא יוֹסִ֤יפוּ בְנֵי עַוְלָה֙ לְ/בַלֹּת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/009.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], and they will dwell in their own place and be disturbed no more. And the sons of wickedness will no longer wear them down, as at the first[b],
translation:
  language: id
  text: Aku akan menetapkan suatu tempat bagi umat-Ku Israel dan menanam mereka di sana. Mereka akan tinggal di tempat mereka sendiri dan tidak akan diganggu lagi. Orang-orang jahat[a] tidak akan lagi menindas mereka seperti dahulu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak kelaliman”; maksudnya, orang-orang yang berbuat jahat.'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “seperti pada mulanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: Aku akan menetapkan suatu tempat
  rationale: Kata שׂוּם pada dasarnya berarti menaruh atau menetapkan. Bersama מָקוֹם, 'menetapkan suatu tempat' menyatakan tindakan Allah menyediakan tempat tertentu tanpa memperluas maknanya.
- source_word: לְעַמִּי יִשְׂרָאֵל
  choice: bagi umat-Ku Israel
  rationale: Mempertahankan sebutan perjanjian dan unsur kepunyaan dalam bentuk Indonesia yang wajar dan bermartabat.
- source_word: וּנְטַעְתִּיהוּ
  choice: dan menanam mereka di sana
  rationale: Metafora 'menanam' dipertahankan karena menggambarkan penetapan yang kokoh. Akhiran Ibrani berbentuk tunggal karena Israel dipandang sebagai satu umat; bahasa Indonesia memakai 'mereka' agar rujukannya jelas. 'Di sana' secara alami merujuk pada tempat yang baru disebut.
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: Mereka akan tinggal di tempat mereka sendiri
  rationale: Bentuk tunggal Ibrani merujuk pada Israel secara kolektif. תַּחְתָּיו secara harfiah dapat berbunyi 'di bawahnya', tetapi dalam konteks ini menyatakan tinggal dengan aman pada tempat yang telah ditetapkan.
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: dan tidak akan diganggu lagi
  rationale: רָגַז mencakup keguncangan, keresahan, atau gangguan. Bentuk pasif 'diganggu' sesuai dengan konteks keamanan umat dari serangan pihak lain.
- source_word: בְנֵי עַוְלָה
  choice: Orang-orang jahat
  rationale: Ungkapan harfiah 'anak-anak kejahatan/kelaliman' adalah idiom Semitik untuk orang yang bercirikan kejahatan. Terjemahan ini alami dalam bahasa Indonesia; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לְבַלֹּתוֹ
  choice: menindas mereka
  rationale: Bentuk ini menyampaikan tindakan yang menghabiskan, melemahkan, atau membuat aus melalui perlakuan berulang. 'Menindas' menyatakan tekanan bermusuhan yang berkepanjangan secara jelas, meski metafora 'membuat aus' tidak diterjemahkan secara harfiah.
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: seperti dahulu
  rationale: Ungkapan tersebut menunjuk pada masa sebelumnya. 'Seperti dahulu' ringkas, alami, dan tidak menentukan satu titik awal yang tidak dinyatakan tegas oleh teks.
theological_decisions:
- issue: Pergantian bentuk tunggal kolektif dan jamak dalam janji kepada Israel
  choice: Rujukan kepada Israel sebagai umat kolektif diterjemahkan dengan 'mereka'.
  alternative: Mempertahankan bentuk tunggal secara ketat dengan 'dia' atau '-nya'.
  rationale: Bahasa Ibrani memperlakukan Israel sebagai satu kesatuan, sedangkan 'mereka' lebih jelas dan alami dalam bahasa Indonesia ketika yang dimaksud ialah anggota umat Israel. Pilihan ini tidak mengubah cakupan janji.
- issue: Makna idiomatis תַּחְתָּיו
  choice: di tempat mereka sendiri
  alternative: di bawahnya
  rationale: Terjemahan harfiah 'di bawahnya' kabur dan berpotensi menyesatkan. Dalam rangkaian penetapan tempat, penanaman, dan kediaman, ungkapan ini menunjuk pada kediaman yang tetap dan aman.
- issue: Citra penanaman Israel
  choice: Mempertahankan metafora 'menanam'.
  alternative: Menggantikannya dengan 'menetapkan' atau 'memukimkan'.
  rationale: Metafora sumber bermakna teologis dan puitis, yaitu Allah membuat umat-Nya berakar dan kokoh. Bahasa Indonesia dapat memahaminya tanpa penjelasan denominatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-profetis yang bermartabat. Struktur kalimat dibuat mengalir bagi pembaca umum, metafora 'menanam' dipertahankan, sedangkan idiom yang akan kabur bila diterjemahkan harfiah dialihkan secara alami. Semua penanda catatan kaki ditempatkan langsung pada bagian teks yang diterangkannya.
