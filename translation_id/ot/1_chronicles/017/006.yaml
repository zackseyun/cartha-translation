source:
  edition: WLC
  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שֹׁפְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר צִוִּ֛יתִי לִ/רְע֥וֹת אֶת עַמִּ֖/י לֵ/אמֹ֑ר לָ֛/מָּה לֹא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/006.yaml
  text: In all the places where I have walked among all Israel[a], did I ever speak a word to one of the judges of Israel, whom I commanded to shepherd my people, saying, ‘Why have you not built for me a house of cedar?’
translation:
  language: id
  text: 'Di mana pun Aku berjalan di tengah seluruh Israel[a], pernahkah Aku mengatakan sepatah kata kepada salah seorang hakim Israel yang Kuperintahkan untuk menggembalakan umat-Ku, demikian: ‘Mengapa kalian tidak membangun bagi-Ku sebuah rumah dari kayu aras?’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bagian paralel dalam 2 Samuel 7:7 berbunyi “suku-suku Israel” (sementara beberapa saksi mencerminkan “pemimpin-pemimpin” atau “tongkat-tongkat kerajaan”), bukan “hakim-hakim Israel”. Teks Ibrani kitab Tawarikh di sini berbunyi “hakim-hakim”.
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: Aku berjalan
  rationale: Bentuk hitpael dari הלך di sini menggambarkan Allah yang bergerak menyertai umat-Nya; ‘berjalan’ mempertahankan metafora sumber dan tetap alami dalam bahasa Indonesia.
- source_word: בְּכָל יִשְׂרָאֵל
  choice: di tengah seluruh Israel
  rationale: Dengan verba gerak sebelumnya, frasa ini menyatakan kehadiran dan pergerakan di tengah bangsa Israel, bukan sekadar jangkauan geografis.
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: pernahkah Aku mengatakan sepatah kata
  rationale: Konstruksi interogatif dengan objek serumpun menegaskan penyangkalan retoris; ungkapan ini mempertahankan daya retoris sekaligus terdengar wajar.
- source_word: אֶת אַחַד שֹׁפְטֵי יִשְׂרָאֵל
  choice: kepada salah seorang hakim Israel
  rationale: Dengan דבר, אֶת memperkenalkan orang yang menjadi sasaran perkataan; ‘kepada’ menyampaikan arah tutur secara tepat dalam bahasa Indonesia.
- source_word: צִוִּיתִי לִרְעוֹת
  choice: yang Kuperintahkan untuk menggembalakan
  rationale: רעה memakai metafora penggembalaan bagi tugas memimpin dan memelihara umat; terjemahan ini mempertahankan citra sumber.
- source_word: עַמִּי
  choice: umat-Ku
  rationale: Ungkapan relasional perjanjian ini diterjemahkan secara langsung dan lazim dalam ragam Alkitab Indonesia.
- source_word: לָמָּה לֹא בְנִיתֶם לִי
  choice: Mengapa kalian tidak membangun bagi-Ku
  rationale: Bentuk jamak pada בְנִיתֶם dipertahankan dengan ‘kalian’, sedangkan ‘bagi-Ku’ menyatakan penerima atau kepentingan secara alami.
- source_word: בֵּית אֲרָזִים
  choice: sebuah rumah dari kayu aras
  rationale: Idiom ini menunjuk rumah yang dibangun dengan kayu aras; penyebutan ‘kayu’ memperjelas bahannya tanpa mengubah makna.
theological_decisions:
- issue: Perbedaan antara ‘hakim-hakim Israel’ dalam Teks Masoret kitab Tawarikh dan bacaan paralel dalam 2 Samuel 7:7
  choice: Menerjemahkan teks Tawarikh sebagai ‘hakim Israel’ dalam teks utama
  alternative: Mengikuti bagian paralel dengan ‘suku-suku Israel’ atau bacaan yang tercermin sebagai ‘pemimpin-pemimpin Israel’
  rationale: Keutamaan sumber bahasa asli menuntut agar bunyi teks Ibrani Tawarikh dipertahankan dan tidak diselaraskan secara diam-diam dengan Samuel; perbedaannya diterangkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Bentuk jamak ‘kalian’ dipakai dalam kutipan karena בְנִיתֶם berbentuk jamak; ‘rumah’ dibiarkan tetap ambigu secara kontekstual sebagai bangunan bagi Allah.
