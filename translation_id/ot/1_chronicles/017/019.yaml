  text: יְהוָ֕ה בַּ/עֲב֤וּר עַבְדְּ/ךָ֙ וּֽ/כְ/לִבְּ/ךָ֔ עָשִׂ֕יתָ אֵ֥ת כָּל הַ/גְּדוּלָּ֖ה הַ/זֹּ֑את לְ/הֹדִ֖יעַ אֶת כָּל הַ/גְּדֻלּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/019.yaml
  text: O Yahweh[a], for the sake of your servant and according to your heart, you have done all this greatness[b], to make known all these great things.
translation:
  language: id
  text: Ya Yahweh, demi hamba-Mu dan sesuai dengan hati-Mu[a], Engkau telah melakukan seluruh kebesaran ini[b] untuk memberitahukan segala perbuatan besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “sesuai dengan kehendak-Mu”. Secara harfiah: “sesuai dengan hati-Mu”.'
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani beralih dari bentuk tunggal, “seluruh kebesaran ini”, ke bentuk jamak, “segala perbuatan besar”. Bentuk tunggal tampaknya merangkum keseluruhan karya Allah, sedangkan bentuk jamak menunjuk pada berbagai wujudnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar identitas nama dalam teks Ibrani tetap tampak.
- source_word: בַּעֲבוּר עַבְדְּךָ
  choice: demi hamba-Mu
  rationale: “Demi” secara alami menyatakan bahwa tindakan Allah dilakukan dengan memperhatikan atau demi kepentingan hamba-Nya; “hamba” sesuai dengan bahasa doa kerajaan dan sikap tunduk Daud.
- source_word: וּכְלִבְּךָ
  choice: dan sesuai dengan hati-Mu
  rationale: Terjemahan ini mempertahankan metafora Ibrani “hati”, yang di sini mencakup kehendak, maksud, dan keinginan.
- source_word: עָשִׂיתָ
  choice: Engkau telah melakukan
  rationale: Bentuk perfektif menunjuk pada tindakan yang sudah dilaksanakan dan tetap relevan dalam pengakuan Daud.
- source_word: כָּל הַגְּדוּלָּה הַזֹּאת
  choice: seluruh kebesaran ini
  rationale: Bentuk abstrak tunggal dipertahankan sebagai rangkuman kolektif dari karya agung Allah.
- source_word: לְהֹדִיעַ
  choice: untuk memberitahukan
  rationale: Bentuk kausatif dari ידע berarti menyebabkan sesuatu diketahui; “memberitahukan” jelas dan wajar dalam bahasa Indonesia.
- source_word: כָּל הַגְּדֻלּוֹת
  choice: segala perbuatan besar itu
  rationale: Bentuk jamak menunjuk pada berbagai wujud kebesaran Allah. “Perbuatan besar” lebih alami daripada “kebesaran-kebesaran” sambil tetap memperlihatkan peralihan dari bentuk tunggal ke jamak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: “Yahweh” mempertahankan nama diri ilahi yang terdapat dalam teks sumber tanpa menggantinya dengan gelar.
- issue: Ungkapan antropomorfis “sesuai dengan hati-Mu”
  choice: mempertahankan metafora hati
  alternative: sesuai dengan kehendak-Mu
  rationale: Metafora asli dibiarkan terbuka pada nuansa kehendak, maksud, dan keinginan Allah, tanpa mempersempitnya menjadi satu penafsiran.
- issue: Peralihan dari “kebesaran” tunggal ke bentuk jamak
  choice: seluruh kebesaran ini ... segala perbuatan besar itu
  alternative: segala perkara besar ini ... segala perkara besar itu
  rationale: 'Pilihan ini mempertahankan peralihan gramatikal dan konseptual teks Ibrani: satu kebesaran sebagai rangkuman dan banyak perbuatan sebagai wujudnya.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Allah dipakai sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia. Susunan kalimat mempertahankan alur doa Ibrani, sementara “perbuatan besar” dipilih agar bentuk jamak terakhir terdengar alami.
