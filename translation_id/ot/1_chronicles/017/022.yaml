id: 1CH.17.22
reference: 1 Chronicles 17:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ֠/תִּתֵּן אֶת עַמְּ/ךָ֨ יִשְׂרָאֵ֧ל לְ/ךָ֛ לְ/עָ֖ם עַד עוֹלָ֑ם וְ/אַתָּ֣ה יְהוָ֔ה הָיִ֥יתָ לָ/הֶ֖ם לֵ/אלֹהִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/022.yaml
  text: And you made your people Israel your people forever[a], and you, O Yahweh, became their God.
translation:
  language: id
  text: Engkau menetapkan umat-Mu Israel menjadi umat-Mu untuk selama-lamanya, dan Engkau, ya Yahweh, menjadi Allah mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “adalah Allah mereka.” Bentuk Ibraninya juga dapat dipahami secara lebih statif.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Engkau menetapkan
  rationale: Secara harfiah berarti “memberikan”, tetapi bersama konstruksi לְךָ לְעָם kata ini menyatakan tindakan menetapkan atau membentuk Israel sebagai umat milik Allah. “Menetapkan” menyampaikan daya konstitutifnya secara alami dalam bahasa Indonesia.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: umat-Mu Israel
  rationale: Mempertahankan hubungan aposisional antara umat kepunyaan Allah dan nama bangsa Israel dalam susunan yang wajar.
- source_word: לְךָ לְעָם
  choice: menjadi umat-Mu
  rationale: 'Dua preposisi ל menyatakan kepemilikan dan status yang ditetapkan: Israel dijadikan umat yang menjadi milik Allah.'
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan Indonesia yang alami dan bermartabat untuk keberlangsungan tanpa akhir yang dinyatakan dalam konteks ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: menjadi Allah mereka
  rationale: Mencerminkan terbentuknya hubungan perjanjian dalam alur narasi, sambil tetap menyediakan pembacaan statif dalam catatan kaki.
theological_decisions:
- issue: Makna rumusan perjanjian היה + ל + אֱלֹהִים
  choice: menjadi Allah mereka
  alternative: adalah Allah mereka
  rationale: “Menjadi” menonjolkan penetapan hubungan perjanjian tanpa menyiratkan perubahan pada hakikat Allah. Karena bentuk Ibraninya juga dapat dipahami secara statif, alternatif tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Pronomina ilahi ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia; nama Yahweh dipertahankan sebagai nama diri.
