  text: וְ/הַֽעֲמַדְתִּ֛י/הוּ בְּ/בֵיתִ֥/י וּ/בְ/מַלְכוּתִ֖/י עַד הָ/עוֹלָ֑ם וְ/כִסְא֕/וֹ יִהְיֶ֥ה נָכ֖וֹן עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/014.yaml
  text: But I will establish him in my house and in my kingdom forever[c][b][a], and his throne will be established forever.
translation:
  language: id
  text: Namun, Aku akan meneguhkan dia di rumah-Ku dan di kerajaan-Ku untuk selama-lamanya,[a][b][c] dan takhtanya akan tetap teguh untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Aku akan menempatkan dia di rumah-Ku dan atas kerajaan-Ku untuk selama-lamanya.” Preposisi Ibrani dapat dipahami secara lebih harfiah sebagai penempatan dalam lingkup rumah dan kerajaan Allah; dalam kaitan dengan kerajaan, sebagian menerjemahkannya dengan nuansa kewenangan, “atas.”'
    reason: lexical_alternative
  - marker: b
    text: Kata “dia” dapat langsung menunjuk kepada keturunan Daud, terutama Salomo, sekaligus berperan dalam janji Daud yang lebih luas, yang kemudian dipahami secara mesianik.
    reason: alternative_reading
  - marker: c
    text: “Rumah-Ku” dapat berarti rumah Allah dalam pengertian perjanjian yang luas; sebagian orang memahaminya secara lebih khusus sebagai bait Allah atau rumah tangga kerajaan Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַעֲמַדְתִּיהוּ
  choice: Namun, Aku akan meneguhkan dia
  rationale: Bentuk kausatif dari עמד menyatakan tindakan membuat seseorang berdiri kokoh atau meneguhkannya dalam suatu kedudukan. 'Meneguhkan' wajar dalam konteks kerajaan dan perjanjian. Kata sambung diterjemahkan 'Namun' karena pernyataan ini beralih dari kemungkinan penghukuman pada ayat sebelumnya kepada komitmen positif Allah.
- source_word: בְּבֵיתִי
  choice: di dalam rumah-Ku
  rationale: Terjemahan ini mengikuti preposisi ב dan mempertahankan keluasan makna בית, yang dapat menunjuk pada rumah, rumah tangga, bait, atau lingkup pemerintahan Allah tanpa mempersempitnya.
- source_word: וּבְמַלְכוּתִי
  choice: dan di dalam kerajaan-Ku
  rationale: Ungkapan ini sejajar dengan 'di dalam rumah-Ku'. Pilihan 'di dalam' mempertahankan bentuk Ibrani dan tidak secara diam-diam mengubahnya menjadi pernyataan eksplisit tentang kekuasaan atas kerajaan.
- source_word: עַד הָעוֹלָם
  choice: untuk selama-lamanya
  rationale: Idiom עד + עולם menyatakan keberlangsungan yang tidak berkesudahan; bentuk ini alami, bermartabat, dan jelas dalam bahasa Indonesia.
- source_word: וְכִסְאוֹ
  choice: dan takhtanya
  rationale: כסא secara langsung berarti 'takhta', istilah penting dalam konteks kerajaan yang sebaiknya tidak diparafrasakan sebagai pemerintahan atau dinasti.
- source_word: יִהְיֶה נָכוֹן
  choice: akan tetap teguh
  rationale: נכון dalam konstruksi predikatif menyatakan keadaan yang kokoh, mantap, atau terjamin. 'Akan tetap teguh' alami dalam bahasa Indonesia dan membedakannya secara halus dari tindakan Allah 'meneguhkan' pada klausa pertama.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini kembali menegaskan keberlangsungan tetap dan diterjemahkan secara konsisten dengan frasa sebelumnya.
theological_decisions:
- issue: Rujukan kata ganti 'dia' dalam konteks perjanjian dengan Daud
  choice: Mempertahankan kata ganti 'dia' tanpa menyebut Salomo atau Mesias dalam teks utama.
  alternative: Salomo secara khusus; garis keturunan raja-raja Daud secara kolektif; atau Mesias sebagai penggenapan akhirnya.
  rationale: Teks Ibrani memakai kata ganti orang ketiga maskulin tunggal dan tidak mengidentifikasi tokohnya secara eksplisit dalam ayat ini. Terjemahan mempertahankan hubungan langsung dengan keturunan Daud sekaligus tidak menutup pemahaman mesianik yang lebih luas.
- issue: Cakupan makna 'rumah-Ku'
  choice: Menerjemahkannya secara langsung sebagai 'rumah-Ku'.
  alternative: Bait-Ku; rumah tangga-Ku; atau lingkup pemerintahan perjanjian Allah.
  rationale: בית dapat memiliki beberapa nuansa dalam konteks ini. Pilihan literal mempertahankan makna berlapis dan tidak memaksakan satu tafsiran.
- issue: Nuansa preposisi ב pada rumah dan kerajaan
  choice: Memakai 'di dalam' pada kedua frasa untuk mempertahankan paralelisme dan keluasan makna.
  alternative: Memakai 'atas', sehingga menjadi 'atas rumah-Ku dan atas kerajaan-Ku'.
  rationale: Preposisi Ibrani secara langsung mendukung arti lokatif 'di dalam', sementara 'atas' menonjolkan kedudukan memerintah. Karena teks memungkinkan nuansa penempatan dan kewenangan, teks utama mempertahankan bentuk yang lebih dekat dengan bahasa sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Huruf kapital pada kata ganti ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Pengulangan 'untuk selama-lamanya' dipertahankan karena merupakan penegasan yang disengaja dalam teks Ibrani.
