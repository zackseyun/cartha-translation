source:
  edition: WLC
  text: ה֥וּא יִבְנֶה לִּ֖/י בָּ֑יִת וְ/כֹנַנְתִּ֥י אֶת כִּסְא֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/012.yaml
  text: He will build a house for me[a], and I will establish his throne forever.
translation:
  language: id
  text: Dialah yang akan membangun rumah bagi-Ku[a], dan Aku akan meneguhkan takhtanya untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bait Allah”. Kata Ibrani ini secara harfiah berarti “rumah” dan dalam konteks menunjuk pada tempat suci yang akan dibangun Salomo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina mandiri orang ketiga maskulin tunggal memberi penegasan pada subjek. “Dialah” menyampaikan penekanan itu secara alami dalam bahasa Indonesia.
- source_word: יִבְנֶה
  choice: akan membangun
  rationale: Bentuk imperfek Qal orang ketiga maskulin tunggal dari בנה menunjuk pada tindakan mendatang dalam konteks janji.
- source_word: לִּי
  choice: bagi-Ku
  rationale: Preposisi ל dengan sufiks orang pertama tunggal menyatakan kepentingan atau peruntukan; “bagi-Ku” sesuai dengan ragam bahasa yang bermartabat.
- source_word: בָּיִת
  choice: rumah
  rationale: Arti leksikal dasarnya adalah “rumah”. Dalam konteks, kata ini menunjuk pada tempat suci yang akan dibangun Salomo, tetapi “rumah” mempertahankan keluasan dan kaitan sastra dari istilah Ibrani.
- source_word: וְכֹנַנְתִּי
  choice: dan Aku akan meneguhkan
  rationale: Bentuk dari כון menyatakan tindakan membuat kukuh atau mantap. “Meneguhkan” alami dalam konteks kerajaan dan menonjolkan kestabilan takhta.
- source_word: אֶת כִּסְאוֹ
  choice: takhtanya
  rationale: Penanda objek langsung diikuti kata benda dengan sufiks orang ketiga maskulin tunggal; “takhtanya” adalah padanan Indonesia yang wajar.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan yang tidak berakhir. “Untuk selama-lamanya” jelas, alami, dan sesuai dengan ragam janji perjanjian.
theological_decisions:
- issue: Apakah בָּיִת diterjemahkan secara harfiah sebagai “rumah” atau secara kontekstual sebagai “Bait Allah”
  choice: rumah
  alternative: Bait Allah
  rationale: Teks Ibrani memakai istilah umum “rumah”. Mempertahankannya menjaga kaitan sastra dan teologis dalam janji kepada Daud, sementara catatan kaki menjelaskan rujukan kontekstualnya.
- issue: Daya makna עַד עוֹלָם dalam janji kepada Daud
  choice: untuk selama-lamanya
  alternative: untuk selamanya
  rationale: Terjemahan ini menyampaikan klaim teks secara langsung tanpa menentukan bagaimana penggenapan akhirnya harus dipahami secara teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pada “-Ku” dan “Aku” mengikuti rujukan kepada Allah. “Dialah” mempertahankan penegasan eksplisit הוּא, sedangkan “meneguhkan takhtanya” menjaga citra kerajaan dalam teks sumber.
