  text: Sesuai dengan segala perkataan ini[a] dan sesuai dengan seluruh penglihatan ini[b], demikianlah Natan berbicara kepada Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala hal ini” atau “segala perkara ini”; kata Ibrani דְּבָרִים dapat berarti perkataan, hal, atau perkara, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
