    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל ... וּכְכֹל
  choice: Sesuai dengan segala ... dan seluruh ...
  rationale: Kata depan כ dengan כֹל menyatakan kesesuaian dengan keseluruhan isi. Pengulangan Ibrani dipertahankan secara semantis, tetapi frasa kedua dibuat lebih alami dalam bahasa Indonesia tanpa menghilangkan cakupannya.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: segala perkataan ini
  rationale: דְּבָרִים dapat berarti perkataan, hal, atau perkara. Dalam konteks pesan ilahi yang baru disampaikan, 'perkataan' paling tepat menonjolkan isi verbalnya sambil tetap memberi catatan atas alternatif leksikal.
- source_word: הֶחָזוֹן הַזֶּה
  choice: seluruh penglihatan ini
  rationale: חָזוֹן menunjuk pada penglihatan kenabian atau penyataan yang diterima. 'Penglihatan' merupakan padanan langsung dan lazim; 'seluruh' meneruskan cakupan כֹל.
- source_word: כֵּן
  choice: demikianlah
  rationale: כֵּן menandai kesesuaian antara apa yang diterima dan apa yang disampaikan Natan. 'Demikianlah' alami dalam narasi Indonesia yang bermartabat.
- source_word: דִּבֶּר נָתָן אֶל דָּוִיד
  choice: Natan berbicara kepada Daud
  rationale: דִּבֶּר berarti 'berbicara', sedangkan אֶל menandai arah pembicaraan kepada Daud. Urutan Indonesia yang alami menempatkan subjek sebelum verba.
