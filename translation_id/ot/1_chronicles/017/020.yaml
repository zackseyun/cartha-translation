id: 1CH.17.20
reference: 1 Chronicles 17:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהוָה֙ אֵ֣ין כָּמ֔וֹ/ךָ וְ/אֵ֥ין אֱלֹהִ֖ים זוּלָתֶ֑/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/020.yaml
  text: O Yahweh[a], there is none like you, and there is no God besides you, in all that we have heard with our own ears.
translation:
  language: id
  text: Ya Yahweh, tidak ada yang seperti Engkau, dan tidak ada Allah selain Engkau[a], sesuai dengan segala yang telah kami dengar dengan telinga kami sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak ada ilah kecuali Engkau” atau “tidak ada Allah di luar Engkau.”
    reason: Alternatif leksikal untuk אֱלֹהִים dan זוּלָתֶךָ, yang dapat diungkapkan dengan beberapa susunan alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dinyatakan secara langsung sebagai Yahweh, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: אֵין כָּמוֹךָ
  choice: tidak ada yang seperti Engkau
  rationale: Ungkapan ini mempertahankan bentuk eksistensial dan perbandingan dalam bahasa Ibrani serta terdengar wajar dalam bahasa Indonesia.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: dan tidak ada Allah selain Engkau
  rationale: זוּלָתֶךָ menyatakan pengecualian atau ketiadaan di luar pihak yang disapa; pilihan ini mempertahankan pernyataan eksklusif teks.
- source_word: בְּכֹל אֲשֶׁר
  choice: sesuai dengan segala yang
  rationale: Preposisi בְּ di sini paling wajar dipahami sebagai penanda kesesuaian dengan seluruh kesaksian yang telah didengar.
- source_word: שָׁמַעְנוּ
  choice: telah kami dengar
  rationale: Bentuk perfektif merangkum kesaksian yang sudah diterima hingga saat doa ini diucapkan.
- source_word: בְּאָזְנֵינוּ
  choice: dengan telinga kami sendiri
  rationale: Terjemahan idiomatis ini mempertahankan gambaran konkret bahasa Ibrani dan menegaskan bahwa mereka sendiri telah mendengarnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; transliterasi Yahweh mempertahankan pembedaan antara nama ilahi dan gelar.
- issue: Cakupan pernyataan וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: tidak ada Allah selain Engkau
  alternative: tidak ada ilah kecuali Engkau
  rationale: Huruf kapital sesuai dengan konteks pengakuan akan satu-satunya Allah, sedangkan catatan kaki mempertahankan kemungkinan ungkapan dengan nomina umum 'ilah' tanpa mengurangi ketegasan bahasa Ibrani.
translation_notes:
  register: Bahasa doa yang modern, khidmat, dan mudah dipahami. Sapaan “Ya Yahweh” mempertahankan nada langsung; kapitalisasi “Engkau” dipakai sebagai penghormatan dalam konteks doa tanpa mengubah makna gramatikal.
