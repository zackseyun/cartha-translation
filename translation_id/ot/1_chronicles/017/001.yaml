  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֛ר יָשַׁ֥ב דָּוִ֖יד בְּ/בֵית֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜יד אֶל נָתָ֣ן הַ/נָּבִ֗יא הִנֵּ֨ה אָנֹכִ֤י יוֹשֵׁב֙ בְּ/בֵ֣ית הָֽ/אֲרָזִ֔ים וַ/אֲר֥וֹן בְּרִית יְהוָ֖ה תַּ֥חַת יְרִיעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/001.yaml
  text: It happened[a], when David was living in his house, that David said to Nathan the prophet, “Look, I am living in a house of cedar, but the ark of the covenant of Yahweh is under curtains.”
translation:
  language: id
  text: Ketika Daud tinggal di rumahnya, Daud berkata kepada Nabi Natan, “Lihatlah, aku tinggal di rumah dari kayu aras, sedangkan tabut perjanjian Yahweh berada di bawah tirai-tirai[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kain-kain tenda.” Kata Ibrani יְרִיעוֹת berarti lembaran kain atau tirai, terutama yang dipakai pada tenda atau Kemah Suci.
    reason: Alternatif leksikal yang menjelaskan nuansa bahan dan tempat pemakaian istilah Ibrani.
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ketika
  rationale: Formula naratif ini memperkenalkan keadaan waktu bagi tindakan utama. Dalam bahasa Indonesia modern, “Ketika” menyampaikan fungsi tersebut secara alami tanpa ungkapan harfiah yang kaku seperti “terjadilah ketika”.
- source_word: יָשַׁב ... יוֹשֵׁב
  choice: tinggal ... tinggal
  rationale: Dalam konteks kediaman, יָשַׁב berarti tinggal atau menetap. Pengulangan kata dipertahankan antara narasi dan ucapan Daud.
- source_word: בְּבֵיתוֹ ... בְּבֵית הָאֲרָזִים
  choice: di rumahnya ... di rumah dari kayu aras
  rationale: “Rumah” mempertahankan istilah sumber dan pengulangan retorisnya; “dari kayu aras” menjelaskan bahan bangunan tanpa menggantinya dengan “istana”.
- source_word: נָתָן הַנָּבִיא
  choice: Nabi Natan
  rationale: Susunan gelar sebelum nama merupakan bentuk yang alami dalam bahasa Indonesia dan tetap menyatakan jabatan Natan.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Partikel ini mengarahkan perhatian kepada keadaan yang Daud amati. “Lihatlah” sesuai dengan ragam modern yang bermartabat.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: sedangkan tabut perjanjian Yahweh
  rationale: Waw di sini menghubungkan dua keadaan yang berlawanan. “Sedangkan” mengungkapkan kontras itu secara alami tanpa memperkerasnya secara berlebihan.
- source_word: תַּחַת יְרִיעוֹת
  choice: berada di bawah tirai-tirai
  rationale: יְרִיעוֹת menunjuk pada lembaran kain atau tirai, khususnya kain penutup tenda atau Kemah Suci. “Tirai-tirai” mempertahankan bentuk jamak dan tidak menutup kemungkinan nuansa tenda, yang dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi YHWH secara langsung. “Yahweh” mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pengulangan “Daud” dan “tinggal” dipertahankan karena menonjol dalam teks Ibrani. Penanda catatan kaki ditempatkan pada “tirai-tirai,” yaitu unsur yang diterangkan oleh catatan.
