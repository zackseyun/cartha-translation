  text: What more can David add before you for honoring your servant? You know your servant.
translation:
  language: id
  text: Apa lagi yang dapat Daud tambahkan kepada-Mu mengenai kehormatan hamba-Mu?[a] Engkau mengenal hamba-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani yang diterjemahkan “mengenai kehormatan hamba-Mu” sulit. Frasa itu juga dapat dipahami sebagai “demi kehormatan hamba-Mu” atau “untuk menghormati hamba-Mu.” Sejumlah terjemahan menyisipkan kata “katakan”, tetapi kata itu tidak tersurat dalam teks Ibrani.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה יּוֹסִיף עוֹד
  choice: Apa lagi yang dapat ... tambahkan
  rationale: Ungkapan יסף dengan עוד menyatakan penambahan lebih lanjut. Terjemahan ini mempertahankan kata kerja 'menambahkan' tanpa menyisipkan 'katakan', yang tidak tersurat dalam bahasa Ibrani.
- source_word: דָּוִיד
  choice: Daud
  rationale: Bentuk baku nama ini dalam tradisi Alkitab berbahasa Indonesia.
- source_word: אֵלֶיךָ
  choice: kepada-Mu
  rationale: Preposisi אֶל di sini menunjukkan arah tuturan kepada Allah. 'Kepada-Mu' dekat dengan bentuk Ibrani dan wajar dalam konteks doa.
- source_word: לְכָבוֹד אֶת עַבְדֶּךָ
  choice: mengenai kehormatan yang Engkau berikan kepada hamba-Mu
  rationale: Frasa Ibrani ini padat dan secara sintaksis sulit. Pilihan ini mengungkapkan konteks bahwa Allah telah menghormati Daud, sambil mempertahankan unsur 'kehormatan' dan memberi catatan tentang alternatif yang lebih harfiah.
- source_word: וְאַתָּה אֶת עַבְדְּךָ יָדָעְתָּ
  choice: Engkau mengenal hamba-Mu
  rationale: Bentuk perfektif ידע menyatakan pengetahuan Allah yang sudah tetap; kala kini bahasa Indonesia menyampaikannya secara alami. Kata sambung ו tidak perlu dinyatakan karena hubungan antarklausa tetap jelas.
theological_decisions:
- issue: Makna frasa sulit לְכָבוֹד אֶת עַבְדֶּךָ
  choice: Dipahami dalam konteks sebagai kehormatan yang Allah berikan kepada Daud, hamba-Nya.
  alternative: Frasa ini juga dapat diterjemahkan lebih dekat secara bentuk sebagai 'demi kehormatan hamba-Mu' atau 'untuk menghormati hamba-Mu'.
  rationale: Konteks doa menunjukkan bahwa Daud takjub atas kehormatan yang Allah karuniakan kepadanya. Karena sintaksis Ibraninya ringkas dan ambigu, catatan kaki mempertahankan kemungkinan pembacaan lain tanpa memasukkan klaim teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Ungkapan 'mengenai kehormatan yang Engkau berikan' dipilih demi kejelasan alami, sedangkan ketaksaan frasa Ibrani dipertahankan melalui catatan kaki.
