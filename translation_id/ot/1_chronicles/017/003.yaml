  yaml_path: translation/ot/1_chronicles/017/003.yaml
  text: But that night the word of God came to Nathan[a], saying,
translation:
  language: id
  text: 'Namun, pada malam itu firman Allah datang kepada Natan[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “suatu firman dari Allah datang kepada Natan.”
    reason: Alternatif leksikal bagi דְּבַר אֱלֹהִים, yang dapat diterjemahkan “firman Allah” atau “suatu firman dari Allah”.
lexical_decisions:
- source_word: וַיְהִי ... וַיְהִי
  choice: Namun, ... datang
  rationale: Bentuk naratif וַיְהִי menggerakkan kisah. Kemunculan pertama diterjemahkan “Namun” untuk menyatakan peralihan yang agak berlawanan dengan perkataan Natan sebelumnya, sedangkan kemunculan kedua diserap secara alami ke dalam frasa “firman Allah datang” tanpa mengulang “terjadilah”.
- source_word: בַּלַּיְלָה הַהוּא
  choice: pada malam itu
  rationale: Ungkapan waktu ini dipadankan secara alami dalam bahasa Indonesia sambil mempertahankan daya tunjuk הַהוּא, “itu”.
- source_word: דְּבַר אֱלֹהִים
  choice: firman Allah
  rationale: דָּבָר dapat berarti “firman”, “perkataan”, “hal”, atau “pesan”. Dalam rumus pewahyuan kenabian ini, “firman Allah” mempertahankan bobot formal dan teologis ungkapan Ibrani tanpa memperluas maknanya.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini אֱלֹהִים jelas merujuk secara tunggal kepada Allah Israel; “Allah” adalah padanan baku dalam bahasa Indonesia.
- source_word: אֶל נָתָן
  choice: kepada Natan
  rationale: אֶל menandai arah kepada penerima; “kepada Natan” merupakan ungkapan Indonesia yang alami.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan tuturan langsung. “Demikian:” menandai bahwa perkataan berikutnya segera dikutip, sekaligus menghindari susunan kaku “dengan mengatakan”.
theological_decisions:
- issue: Penerjemahan rumus pewahyuan דְּבַר אֱלֹהִים
  choice: firman Allah
  alternative: suatu firman dari Allah; pesan Allah
  rationale: “Firman Allah” mempertahankan bentuk dan bobot pewahyuan dalam teks. Kemungkinan memahami konstruksi ini sebagai “suatu firman dari Allah” tetap dicatat dalam catatan kaki agar ambiguitas relasinya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Namun” menyampaikan kontras ringan dengan konteks sebelumnya; “demikian:” memperkenalkan kutipan langsung secara alami. Penanda catatan kaki [a] ditempatkan tepat setelah “Natan”.
