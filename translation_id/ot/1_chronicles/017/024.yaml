  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֠/יֵֽאָמֵן וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֱלֹהִ֖ים לְ/יִשְׂרָאֵ֑ל וּ/בֵית דָּוִ֥יד עַבְדְּ/ךָ֖ נָכ֥וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/024.yaml
  text: May it be established[a], and may your name be magnified forever, saying, ‘Yahweh of hosts, the God of Israel[b], is God to Israel,’ and may the house of David your servant be established before you.
translation:
  language: id
  text: Kiranya hal itu diteguhkan, dan kiranya nama-Mu diagungkan untuk selama-lamanya dengan berkata, “Yahweh semesta alam, Allah Israel, adalah Allah bagi Israel[a].” Kiranya keluarga Daud[b], hamba-Mu, diteguhkan di hadapan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “adalah Allah Israel.” Secara lebih harfiah, teks Ibrani berbunyi, “adalah Allah bagi Israel.”
    reason: lexical_alternative
  - marker: b
    text: “Keluarga” di sini mencakup arti keluarga kerajaan atau wangsa Daud.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֵאָמֵן
  choice: Kiranya hal itu diteguhkan
  rationale: Bentuk nifal imperfek dalam konteks doa menyatakan permohonan agar janji yang baru disebut menjadi teguh. Kata ganti “hal itu” memasok subjek tersirat tanpa menentukan lebih jauh isinya.
- source_word: וְיִגְדַּל שִׁמְךָ
  choice: dan kiranya nama-Mu diagungkan
  rationale: Daya optatif dipertahankan dengan “kiranya”; “diagungkan” menyampaikan penghormatan dan kemasyhuran yang terkandung dalam גדל, sedangkan “nama” dipertahankan sebagai ungkapan Ibrani bagi nama dan kemasyhuran Allah.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan Indonesia yang wajar untuk keberlangsungan tanpa batas.
- source_word: לֵאמֹר
  choice: sehingga orang berkata
  rationale: Menunjukkan bahwa pengagungan nama Yahweh menghasilkan pengakuan yang menyusul. Subjek umum “orang” dibuat eksplisit demi kewajaran bahasa Indonesia.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh semesta alam
  rationale: Mempertahankan nama diri ilahi “Yahweh” dan memakai bentuk gelar yang dikenal serta bermartabat dalam bahasa Indonesia untuk צְבָאוֹת, yang menunjuk pada bala-bala di bawah kuasa-Nya.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Menerjemahkan konstruksi kepunyaan/relasional Ibrani secara ringkas dan alami.
- source_word: אֱלֹהִים לְיִשְׂרָאֵל
  choice: adalah Allah bagi Israel
  rationale: “Bagi” mempertahankan relasi yang ditandai preposisi ל tanpa langsung mengubahnya menjadi bentuk kepunyaan.
- source_word: וּבֵית דָּוִיד עַבְדְּךָ
  choice: Kiranya keluarga Daud, hamba-Mu
  rationale: “Keluarga Daud” mempertahankan metafora rumah sambil dapat dipahami sebagai garis keluarga atau wangsa; aposisi “hamba-Mu” menerangkan Daud.
- source_word: נָכוֹן לְפָנֶיךָ
  choice: diteguhkan di hadapan-Mu
  rationale: Menyampaikan keadaan yang kokoh dan tetap dalam hadirat serta perkenanan Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama diri.
- issue: Daya bentuk verba dalam konteks doa
  choice: 'Permohonan: “Kiranya ...”'
  alternative: 'Pernyataan masa depan: “Akan ...”'
  rationale: Konteksnya adalah doa Daud sebagai tanggapan terhadap janji Allah, sehingga nuansa harapan atau permohonan paling sesuai, meski bentuk Ibrani juga dapat dibaca sebagai pernyataan tentang masa depan.
- issue: Makna אֱלֹהִים לְיִשְׂרָאֵל
  choice: Allah bagi Israel
  alternative: Allah Israel atau Allah untuk Israel
  rationale: Pilihan utama mempertahankan preposisi ל dan nuansa relasional/peruntukannya tanpa mereduksinya menjadi kepunyaan semata.
- issue: Makna בֵּית דָּוִיד
  choice: keluarga Daud, dengan penjelasan bahwa ini dapat berarti wangsa kerajaan
  alternative: keturunan Daud atau wangsa Daud
  rationale: “Keluarga” menjaga citra “rumah” dan tetap mudah dipahami, sedangkan catatan menjelaskan makna dinastiknya dalam konteks janji kerajaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur doa dipertahankan dengan “kiranya”; pengulangan “diteguhkan” mencerminkan tema keteguhan janji dalam ayat. Tanda catatan kaki ditempatkan langsung pada frasa yang dijelaskan.
