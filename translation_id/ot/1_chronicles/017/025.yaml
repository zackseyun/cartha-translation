base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/025.yaml
  text: For you[a], my God, have revealed to your servant that you will build him a house[b]; therefore your servant has found courage to pray before you.
translation:
  language: id
  text: Sebab Engkau, ya Allahku, telah menyatakan[a] kepada hamba-Mu bahwa Engkau akan membangun rumah[b] baginya. Karena itu, hamba-Mu mendapat keberanian untuk berdoa di hadapan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “telah menyingkapkan telinga hamba-Mu,” sebuah ungkapan yang berarti “telah menyatakan kepada hamba-Mu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menegakkan dinasti baginya”; “rumah” di sini dapat mencakup rumah tangga dan garis keturunan kerajaan yang berkelanjutan.
    reason: alternative_reading
lexical_decisions:
- source_word: גָּלִיתָ אֶת אֹזֶן עַבְדְּךָ
  choice: telah menyatakan kepada hamba-Mu
  rationale: Ungkapan Ibrani ini secara harfiah berarti ‘telah menyingkapkan telinga hamba-Mu’, tetapi berfungsi sebagai idiom untuk memberitahukan atau menyatakan sesuatu. Terjemahan ini menyampaikan maknanya dengan jelas dalam bahasa Indonesia modern.
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: bahwa Engkau akan membangun rumah baginya
  rationale: Infinitif setelah ungkapan pewahyuan menyatakan isi yang telah diberitahukan. Bentuk ini juga mempertahankan citra ‘membangun rumah’ dan tidak membatasi maknanya hanya pada bangunan atau hanya pada dinasti.
- source_word: בָּיִת
  choice: rumah
  rationale: Kata ‘rumah’ mempertahankan citra sumber dan makna berlapis dalam konteks perjanjian dengan Daud, yang dapat menunjuk kepada rumah tangga sekaligus garis keturunan kerajaan yang berkelanjutan.
- source_word: מָצָא ... לְהִתְפַּלֵּל
  choice: mendapat keberanian untuk berdoa
  rationale: Pemakaian ‘menemukan’ dengan infinitif di sini menyatakan bahwa hamba itu memperoleh keberanian atau keteguhan untuk bertindak. ‘Mendapat keberanian’ menyampaikan fungsi idiom tersebut secara alami.
- source_word: לְפָנֶיךָ
  choice: di hadapan-Mu
  rationale: Ungkapan ini mempertahankan suasana relasional dan khidmat dari doa yang dipanjatkan di hadapan Allah.
- source_word: עַבְדְּךָ
  choice: hamba-Mu
  rationale: Dalam doa kerajaan, kata ini merupakan sebutan diri yang menyatakan kerendahan dan ketundukan kepada Allah. ‘Hamba’ sesuai dengan konteks dan ragam bahasa Indonesia Alkitabiah yang tetap mudah dipahami.
theological_decisions:
- issue: Makna ‘rumah’ dalam janji kepada Daud
  choice: Mempertahankan ‘rumah’ dalam teks utama dan membiarkan makna dinasti tetap tersirat
  alternative: Menerjemahkannya secara eksplisit sebagai ‘dinasti’ atau ‘garis keturunan kerajaan’
  rationale: Bahasa Ibrani mempertahankan makna berlapis yang penting dalam konteks ini. ‘Rumah’ dapat menunjuk kepada rumah tangga dan, terutama dalam janji kepada Daud, kepada garis keturunan kerajaan yang berkelanjutan. Terjemahan utama tidak seharusnya meniadakan ketegangan makna tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ilahi memakai huruf kapital sesuai konvensi penerbitan Alkitab bahasa Indonesia. Susunan kalimat dibuat alami tanpa menghilangkan pengulangan ‘hamba-Mu’ atau citra penting ‘membangun rumah’.
