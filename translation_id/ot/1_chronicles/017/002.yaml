  text: וַ/יֹּ֤אמֶר נָתָן֙ אֶל דָּוִ֔יד כֹּ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ עֲשֵׂ֑ה כִּ֥י הָ/אֱלֹהִ֖ים עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/002.yaml
  text: And Nathan said to David, “Do all that is in your heart, for God is with you.”
translation:
  language: id
  text: Lalu Natan berkata kepada Daud, “Lakukanlah segala yang ada dalam hatimu, sebab Allah menyertaimu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” wajar dalam narasi Indonesia modern tanpa membuat hubungan logis yang berlebihan.
- source_word: נָתָן
  choice: Natan
  rationale: Nama pribadi dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֶל דָּוִיד
  choice: kepada Daud
  rationale: Preposisi אֶל menandai arah ujaran; “kepada” merupakan padanan Indonesia yang alami. Nama דָּוִיד memakai bentuk Indonesia yang lazim, “Daud”.
- source_word: כֹּל אֲשֶׁר בִּלְבָבְךָ
  choice: segala yang ada dalam hatimu
  rationale: Ungkapan ini mencakup seluruh maksud atau niat batin Daud. “Hati” mempertahankan citra antropologis Ibrani, sementara “ada dalam” membuatnya alami dalam bahasa Indonesia.
- source_word: עֲשֵׂה
  choice: Lakukanlah
  rationale: Imperatif עשה berarti melakukan atau mengerjakan. “Lakukanlah” mempertahankan daya perintah sekaligus sesuai dengan objek berupa segala niat dalam hati.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi nasihat sebelumnya; “sebab” ringkas, jelas, dan sesuai dengan ragam bermartabat.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: אֱלֹהִים dengan artikel di sini merujuk secara definit kepada Allah. Dalam bahasa Indonesia, “Allah” adalah padanan alami dan tidak memerlukan artikel.
- source_word: עִמָּךְ
  choice: menyertaimu
  rationale: Secara harfiah berarti “bersamamu”; dalam konteks ini ungkapan tersebut menyatakan kehadiran dan dukungan ilahi. “Menyertaimu” alami dan tetap mempertahankan cakupan maknanya.
theological_decisions:
- issue: Penerjemahan gelar ilahi הָאֱלֹהִים
  choice: Allah
  alternative: TUHAN
  rationale: Teks sumber memakai אֱלֹהִים, bukan nama ilahi YHWH. Karena itu “Allah” mempertahankan pembedaan sumber dan tidak menggantinya dengan “TUHAN”.
- issue: Makna kehadiran ilahi dalam עִמָּךְ
  choice: menyertaimu
  alternative: bersamamu
  rationale: “Menyertaimu” menyampaikan kehadiran dan dukungan Allah tanpa menentukan secara berlebihan bagaimana penyertaan itu bekerja. Alternatif “bersamamu” lebih harfiah, tetapi sedikit kurang idiomatis dalam konteks nasihat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat langsung dipertahankan; partikel “-lah” memberi bentuk imperatif yang alami tanpa terdengar kasar. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal yang perlu ditampilkan kepada pembaca.
