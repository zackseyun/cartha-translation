  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לִ/שְׁלֹמֹ֣ה בְנ֗/וֹ חֲזַ֤ק וֶ/אֱמַץ֙ וַ/עֲשֵׂ֔ה אַל תִּירָ֖א וְ/אַל תֵּחָ֑ת כִּי֩ יְהוָ֨ה אֱלֹהִ֤ים אֱלֹהַ/י֙ עִמָּ֔/ךְ לֹ֤א יַרְפְּ/ךָ֙ וְ/לֹ֣א יַֽעַזְבֶ֔/ךָּ עַד לִ/כְל֕וֹת כָּל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/020.yaml
  text: And David said to Solomon his son[a], “Be strong and courageous, and do it. Do not fear or be dismayed, for Yahweh God, my God, is with you. He will not fail you or forsake you until all the work for the service of the house of Yahweh is finished.”
translation:
  language: id
  text: Lalu Daud berkata kepada Salomo, anaknya, “Jadilah kuat dan teguh, lalu kerjakanlah itu. Jangan takut dan jangan gentar, sebab Yahweh Allah, Allahku, menyertai engkau. Ia tidak akan melepaskan engkau[a] ataupun meninggalkan engkau sampai seluruh pekerjaan untuk pelayanan bagi rumah Yahweh selesai.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia tidak akan mengendurkan dukungan-Nya terhadapmu”; kata kerja Ibrani ini dapat menggambarkan tidak mengendurkan pegangan atau dukungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק וֶאֱמַץ
  choice: Kuatkanlah hatimu dan teguhkanlah dirimu
  rationale: Kedua imperatif ini merupakan pasangan seruan agar Salomo memiliki kekuatan batin dan keteguhan dalam menjalankan tugas. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kedua unsur Ibrani.
- source_word: וַעֲשֵׂה
  choice: lalu kerjakanlah itu
  rationale: Imperatif ini mendesak Salomo untuk bertindak dan melaksanakan pekerjaan rumah Yahweh yang sedang dibicarakan; kata “itu” wajar berdasarkan konteks.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: Jangan takut dan jangan gentar
  rationale: 'Menerjemahkan dua larangan yang saling melengkapi: tidak takut dan tidak kehilangan keberanian atau keteguhan.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהִים אֱלֹהַי
  choice: Allah, Allahku
  rationale: Mempertahankan pengulangan dan hubungan aposisional dalam bahasa Ibrani tanpa menjelaskannya secara berlebihan.
- source_word: עִמָּךְ
  choice: menyertai engkau
  rationale: Frasa nominal Ibrani menyatakan kehadiran Allah. Bentuk kini dipertahankan, sedangkan “menyertai” merupakan ungkapan Indonesia yang alami dan khidmat.
- source_word: לֹא יַרְפְּךָ
  choice: Ia tidak akan membiarkan engkau
  rationale: Hifil רפה dapat menyatakan mengendurkan pegangan, melepaskan dukungan, atau membiarkan seseorang. Pilihan utama dibuat ringkas, sementara nuansa alternatif dicatat dalam catatan kaki.
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: atau meninggalkan engkau
  rationale: עזב berarti meninggalkan atau menelantarkan. “Meninggalkan” jelas bagi pembaca modern dan tidak menambahkan konotasi yang tidak diperlukan.
- source_word: עַד לִכְלוֹת
  choice: sampai ... selesai
  rationale: Menandai titik selesainya seluruh pekerjaan yang ditugaskan; susunan klausa Indonesia ini alami.
- source_word: כָּל מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: seluruh pekerjaan untuk pelayanan di rumah Yahweh
  rationale: Mewakili baik מְלָאכָה sebagai pekerjaan maupun עֲבוֹדָה sebagai pelayanan, sekaligus menguraikan rangkaian konstruksi Ibrani secara wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri perjanjian secara langsung; transliterasi “Yahweh” mempertahankan fungsi nama itu tanpa menggantinya dengan gelar.
- issue: Jangka waktu dalam frasa עַד לִכְלוֹת
  choice: sampai seluruh pekerjaan ... selesai
  alternative: dengan pengertian bahwa penyertaan Allah berakhir setelah pekerjaan selesai
  rationale: Kata עַד menetapkan batas yang relevan bagi jaminan dalam konteks tugas tersebut, tetapi ayat ini tidak secara tegas menyatakan bahwa Allah akan berhenti menyertai Salomo sesudahnya. Terjemahan mempertahankan batas ujaran tanpa menarik kesimpulan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Pronomina “engkau” dipakai karena konteks wejangan langsung seorang ayah kepada anaknya dan karena sesuai dengan register Alkitab yang tetap mudah dipahami. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskan.
