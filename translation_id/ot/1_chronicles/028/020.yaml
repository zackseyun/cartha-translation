  to: Lalu Daud berkata kepada Salomo, anaknya, “Jadilah kuat dan teguh, lalu kerjakanlah itu. Jangan takut dan jangan gentar, sebab Yahweh Allah, Allahku, menyertai engkau. Ia tidak akan melepaskan engkau[a] ataupun meninggalkan engkau sampai seluruh pekerjaan untuk pelayanan bagi rumah Yahweh selesai.”
