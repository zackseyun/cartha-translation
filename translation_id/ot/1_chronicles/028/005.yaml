source:
  edition: WLC
  text: וּ/מִ/כָּ֨ל בָּנַ֔/י כִּ֚י רַבִּ֣ים בָּנִ֔ים נָ֥תַן לִ֖/י יְהוָ֑ה וַ/יִּבְחַר֙ בִּ/שְׁלֹמֹ֣ה בְנִ֔/י לָ/שֶׁ֗בֶת עַל כִּסֵּ֛א מַלְכ֥וּת יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/005.yaml
  text: And from among all my sons—for Yahweh has given me many sons—he chose Solomon my son to sit on the throne of the kingdom of Yahweh over Israel[a][b].
translation:
  language: id
  text: Dan dari antara semua anak laki-lakiku—sebab Yahweh telah mengaruniakan banyak anak laki-laki kepadaku—Ia memilih Salomo, anakku, untuk duduk di atas takhta kerajaan Yahweh atas Israel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab Yahweh mengaruniakan banyak anak laki-laki kepadaku.” Bentuk kata kerja Ibrani dapat diterjemahkan dengan tindakan lampau biasa atau dengan penekanan pada hasilnya yang masih berlaku.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “takhta kerajaan Yahweh” menegaskan bahwa kerajaan Israel pada akhirnya adalah milik Yahweh, meskipun Salomo adalah raja manusia.
    reason: cross_reference
lexical_decisions:
- source_word: וּמִכָּל בָּנַי
  choice: Dan dari antara semua anak laki-lakiku
  rationale: Frasa ini menyatakan pemilihan dari suatu kelompok. “Anak laki-laki” mempertahankan bentuk maskulin dan sesuai dengan konteks suksesi kerajaan.
- source_word: כִּי רַבִּים בָּנִים נָתַן לִי יְהוָה
  choice: sebab Yahweh telah mengaruniakan banyak anak laki-laki kepadaku
  rationale: כִּי memperkenalkan keterangan penjelas. “Mengaruniakan” menyampaikan pemberian ilahi secara alami tanpa mengubah makna dasar נתן; bentuk “telah” menyoroti hasil yang masih berlaku.
- source_word: וַיִּבְחַר בִּשְׁלֹמֹה בְנִי
  choice: Ia memilih Salomo, anakku
  rationale: Subjeknya tetap Yahweh dari klausa sebelumnya. Preposisi ב setelah בחר menandai orang yang dipilih dan tidak perlu diterjemahkan secara harfiah dalam bahasa Indonesia.
- source_word: לָשֶׁבֶת עַל כִּסֵּא
  choice: untuk duduk di atas takhta
  rationale: ישב dalam konteks takhta menunjuk pada kedudukan sebagai raja. Terjemahan harfiah yang wajar ini mempertahankan citra penobatan.
- source_word: מַלְכוּת יְהוָה
  choice: kerajaan Yahweh
  rationale: Rangkaian konstruksi Ibrani secara langsung mengaitkan kerajaan itu dengan Yahweh, sehingga kepemilikan dan kewenangan ilahi tetap nyata.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: עַל dalam konteks pemerintahan menyatakan lingkup kekuasaan; “atas Israel” mempertahankan bentuk dan maknanya secara ringkas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Transliterasi “Yahweh” mempertahankan rujukan kepada nama perjanjian Allah sebagaimana terdapat dalam teks sumber dan sesuai dengan kebijakan proyek.
- issue: Makna frasa “takhta kerajaan Yahweh”
  choice: Mempertahankan frasa lengkap
  alternative: takhta kerajaan Israel; takhta kerajaan
  rationale: Teks Ibrani secara eksplisit menyebut kerajaan itu sebagai kerajaan Yahweh. Bentuk lengkap mempertahankan ketegangan bahwa Salomo adalah raja manusia, sedangkan kerajaan tersebut pada akhirnya milik dan berada di bawah pemerintahan Yahweh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah menandai klausa penjelas dari teks Ibrani; “Ia” diawali huruf kapital untuk memperjelas bahwa subjeknya adalah Yahweh.
