  text: וַ/יַּקְהֵ֣ל דָּוִ֣יד אֶת כָּל שָׂרֵ֣י יִשְׂרָאֵ֡ל שָׂרֵ֣י הַ/שְּׁבָטִ֣ים וְ/שָׂרֵ֣י הַ/מַּחְלְק֣וֹת הַ/מְשָׁרְתִ֪ים אֶת הַ/מֶּ֟לֶךְ וְ/שָׂרֵ֣י הָ/אֲלָפִ֣ים וְ/שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/שָׂרֵ֣י כָל רְכוּשׁ וּ/מִקְנֶה֩ לַ/מֶּ֨לֶךְ וּ/לְ/בָנָ֜י/ו עִם הַ/סָּרִיסִ֧ים וְ/הַ/גִּבּוֹרִ֛ים וּֽ/לְ/כָל גִּבּ֥וֹר חָ֖יִל אֶל יְרוּשָׁלִָֽם־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/001.yaml
  text: 'Then David assembled at Jerusalem all the leaders of Israel: the leaders of the tribes[a], the leaders of the divisions that served the king, the commanders of thousands and of hundreds, and the leaders over all the property and livestock belonging to the king and to his sons, together with the officials, the mighty men, and every mighty man of valor.'
translation:
  language: id
  text: 'Kemudian Daud mengumpulkan di Yerusalem semua pemimpin Israel: para pemimpin suku, para pemimpin satuan-satuan yang melayani raja, para kepala pasukan seribu dan pasukan seratus, para pengawas seluruh harta benda dan ternak milik raja dan anak-anaknya, bersama para pejabat istana[a], para pahlawan, dan setiap pejuang yang gagah perkasa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para sida-sida”; istilah Ibrani ini dapat menunjuk pada sida-sida secara harfiah atau, secara lebih umum, pada pejabat istana kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: mengumpulkan
  rationale: Bentuk hifil menyatakan bahwa Daud menyebabkan suatu pertemuan resmi; “mengumpulkan” alami dalam bahasa Indonesia dan tetap menunjukkan tindakan Daud.
- source_word: שָׂרֵי יִשְׂרָאֵל
  choice: semua pemimpin Israel
  rationale: שַׂר mencakup pemimpin, pejabat, dan panglima; “pemimpin” merupakan istilah payung yang sesuai untuk daftar tokoh administratif dan militer berikutnya.
- source_word: שָׂרֵי הַשְּׁבָטִים
  choice: para pemimpin suku
  rationale: Terjemahan langsung dan alami yang mempertahankan kesinambungan istilah שַׂר.
- source_word: שָׂרֵי הַמַּחְלְקוֹת הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: para pemimpin satuan-satuan yang melayani raja
  rationale: מַחְלְקוֹת menunjuk pada kelompok atau satuan yang terorganisasi; “satuan-satuan” menjaga nuansa administratif-militer tanpa menentukan bentuk organisasinya secara berlebihan.
- source_word: שָׂרֵי הָאֲלָפִים וְשָׂרֵי הַמֵּאוֹת
  choice: para kepala pasukan seribu dan pasukan seratus
  rationale: Dalam konteks militer-administratif, שַׂר berarti kepala atau panglima. Angka dipertahankan sebagai nama satuan tanpa memastikan bahwa jumlahnya selalu harfiah.
- source_word: רְכוּשׁ וּמִקְנֶה
  choice: harta benda dan ternak
  rationale: רְכוּשׁ mencakup kekayaan atau milik, sedangkan מִקְנֶה mencakup hewan peliharaan secara umum; pasangan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: לַמֶּלֶךְ וּלְבָנָיו
  choice: milik raja dan anak-anaknya
  rationale: Preposisi לְ di sini paling wajar dipahami sebagai hubungan kepemilikan atau penguasaan.
- source_word: הַסָּרִיסִים
  choice: para pejabat istana
  rationale: סָרִיס dapat berarti sida-sida secara harfiah atau pejabat istana. Konteks daftar jabatan kerajaan mendukung fungsi istana, sementara kemungkinan harfiahnya dipertahankan dalam catatan kaki.
- source_word: הַגִּבּוֹרִים
  choice: para kesatria
  rationale: Dalam kitab Tawarikh, bentuk ini lazim menunjuk pada para pejuang terkemuka Daud; “kesatria” menyampaikan status dan kecakapan perang secara ringkas.
- source_word: כָל גִּבּוֹר חָיִל
  choice: setiap kesatria yang gagah perkasa
  rationale: Ungkapan ini memadukan sosok pejuang kuat dengan keberanian atau kemampuan militer; pilihan ini mempertahankan daya ungkap idiom Ibrani dalam bahasa Indonesia yang bermartabat.
