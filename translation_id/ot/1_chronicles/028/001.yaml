  to: 'Kemudian Daud mengumpulkan di Yerusalem semua pemimpin Israel: para pemimpin suku, para pemimpin satuan-satuan yang melayani raja, para kepala pasukan seribu dan pasukan seratus, para pengawas seluruh harta benda dan ternak milik raja dan anak-anaknya, bersama para pejabat istana[a], para pahlawan, dan setiap pejuang yang gagah perkasa.'
