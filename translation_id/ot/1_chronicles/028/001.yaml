translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif resmi. Kalimat panjang sumber dibagi menjadi dua agar daftar jabatan mudah dipahami, tanpa mengubah siapa saja yang dikumpulkan. Penanda catatan kaki ditempatkan sesudah “para pejabat istana”, yaitu padanan kata Ibrani yang memang memiliki alternatif leksikal.
