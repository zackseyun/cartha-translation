id: 1CH.28.8
reference: 1 Chronicles 28:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֠/עַתָּה לְ/עֵינֵ֨י כָל יִשְׂרָאֵ֤ל קְהַל יְהוָה֙ וּ/בְ/אָזְנֵ֣י אֱלֹהֵ֔י/נוּ שִׁמְר֣וּ וְ/דִרְשׁ֔וּ כָּל מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם לְמַ֤עַן תִּֽירְשׁוּ֙ אֶת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה וְ/הִנְחַלְתֶּ֛ם לִ/בְנֵי/כֶ֥ם אַחֲרֵי/כֶ֖ם עַד עוֹלָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/008.yaml
  text: And now[a], in the sight of all Israel, the assembly of Yahweh, and in the hearing of our God, keep and seek all the commandments of Yahweh your God[b], so that you may possess the good land and leave it as an inheritance to your sons after you forever.
translation:
  language: id
  text: Sekarang, di hadapan seluruh Israel, jemaah Yahweh, dan di hadapan Allah kita, peliharalah dan carilah semua perintah Yahweh, Allah kalian, supaya kalian memiliki[a] negeri yang baik itu dan mewariskannya kepada anak-anak lelaki kalian[b] sesudah kalian untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mewarisi.” Kata kerja Ibrani ini dapat berarti “mewarisi” atau “memiliki,” bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak lelaki”; kata Ibraninya berbentuk jamak maskulin, bukan istilah umum untuk semua anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan dalam amanat Daud secara alami; hubungan dengan perkataan sebelumnya tetap tersirat dalam konteks.
- source_word: לְעֵינֵי כָל־יִשְׂרָאֵל
  choice: di hadapan seluruh Israel
  rationale: Mengungkapkan idiom harfiah 'di mata' sebagai suasana kesaksian publik dalam bahasa Indonesia yang wajar.
- source_word: קְהַל יְהוָה
  choice: jemaah Yahweh
  rationale: קהל menunjuk kepada umat yang berhimpun; 'jemaah' jelas dan lazim tanpa mempersempitnya menjadi lembaga tertentu.
- source_word: וּבְאָזְנֵי אֱלֹהֵינוּ
  choice: dan dengan didengar oleh Allah kita
  rationale: Mempertahankan gambaran bahwa perkataan itu diucapkan dalam pendengaran Allah, tetapi menghindari ungkapan harfiah 'di telinga' yang kaku.
- source_word: שִׁמְרוּ וְדִרְשׁוּ
  choice: peliharalah dan carilah
  rationale: 'Mempertahankan dua perintah yang berbeda: menjaga atau menaati perintah-perintah itu serta dengan sungguh mencarinya. Terjemahan tidak melebur keduanya menjadi satu tindakan.'
- source_word: כָּל־מִצְוֺת
  choice: segala perintah
  rationale: Mewakili bentuk jamak dengan כל secara ringkas dan alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: תִּירְשׁוּ
  choice: memiliki
  rationale: Dalam konteks negeri, ירשׁ dapat berarti memiliki atau mewarisi. 'Memiliki' sesuai dengan keberlanjutan penguasaan Israel atas negeri itu, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: negeri yang baik ini
  rationale: '''Negeri yang baik'' mempertahankan ungkapan perjanjian; ''ini'' wajar karena objeknya tertentu dalam konteks dan memiliki artikel definit dalam bahasa Ibrani.'
- source_word: וְהִנְחַלְתֶּם
  choice: dan mewariskannya
  rationale: Bentuk kausatif נחל berarti menyebabkan keturunan menerima sebagai warisan; 'mewariskannya' menyampaikan makna itu secara alami.
- source_word: לִבְנֵיכֶם
  choice: kepada anak-anak lelaki kalian
  rationale: בנים berbentuk jamak maskulin dan secara eksplisit menunjuk kepada anak-anak lelaki dalam bunyi teks.
- source_word: עַד־עוֹלָם
  choice: untuk selama-lamanya
  rationale: Menyampaikan durasi berkelanjutan yang dinyatakan oleh ungkapan Ibrani tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi; transliterasi mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Cakupan gender בנים
  choice: anak-anak lelaki
  alternative: anak-anak
  rationale: Bentuk sumber secara gramatikal maskulin; terjemahan utama mempertahankan kekhususan itu tanpa memperluasnya secara diam-diam.
- issue: Makna ירשׁ sehubungan dengan negeri
  choice: memiliki
  alternative: mewarisi
  rationale: Kata ini dapat menyatakan penguasaan atau penerimaan sebagai warisan. Konteks mendukung 'memiliki', tetapi ambiguitas leksikal yang nyata dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk jamak 'kalian' dipakai karena seluruh perintah dalam ayat ini ditujukan kepada orang banyak. Susunan kalimat mempertahankan suasana deklarasi publik dan dua imperatif Ibrani tanpa memasukkan penafsiran denominasi.
