revisions:
- from: Sekarang, di hadapan seluruh Israel, yaitu jemaah Yahweh, dan dengan didengar oleh Allah kita, peliharalah dan carilah segala perintah Yahweh, Allah kalian, supaya kalian memiliki[a] negeri yang baik ini dan mewariskannya kepada anak-anak lelaki kalian[b] sesudah kalian untuk selama-lamanya.
  to: Sekarang, di hadapan seluruh Israel, jemaah Yahweh, dan di hadapan Allah kita, peliharalah dan carilah semua perintah Yahweh, Allah kalian, supaya kalian memiliki[a] negeri yang baik itu dan mewariskannya kepada anak-anak lelaki kalian[b] sesudah kalian untuk selama-lamanya.
  rationale: Revisi menghapus demonstratif yang tidak ada dalam sumber, memperbaiki padanan idiom “dalam telinga Allah kita” menjadi “di hadapan Allah kita,” dan memperjelas cakupan frasa duratif tanpa mengubah makna ayat. Dua imperatif, nama Yahweh, ambiguitas memiliki/mewarisi, dan rujukan eksplisit kepada anak-anak lelaki tetap dipertahankan.
