  text: וְ/אֶת הַ/זָּהָ֥ב מִשְׁקָ֛ל לְ/שֻׁלְחֲנ֥וֹת הַֽ/מַּעֲרֶ֖כֶת לְ/שֻׁלְחַ֣ן וְ/שֻׁלְחָ֑ן וְ/כֶ֖סֶף לְ/שֻׁלְחֲנ֥וֹת הַ/כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/016.yaml
  text: and the weight of the gold for the tables of the arrangement[a], for each table and table, and silver for the silver tables.
translation:
  language: id
  text: juga berat emas untuk meja-meja tempat roti sajian disusun[a], untuk setiap meja, dan perak untuk meja-meja perak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “meja-meja susunan”; secara tradisional, “meja-meja roti sajian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקָל
  choice: berat
  rationale: Dalam konteks daftar perlengkapan Bait Allah, kata ini menunjuk pada berat logam yang ditetapkan, bukan nilai abstrak.
- source_word: שֻׁלְחֲנוֹת הַמַּעֲרֶכֶת
  choice: meja-meja tempat roti sajian disusun
  rationale: Secara harfiah frasa ini berarti 'meja-meja susunan'. Konteks peribadatan menunjukkan bahwa yang disusun ialah roti; terjemahan ini membuat rujukannya jelas tanpa memakai istilah tradisional saja.
- source_word: לְשֻׁלְחָן וְשֻׁלְחָן
  choice: untuk setiap meja
  rationale: Pengulangan kata benda tunggal dalam bahasa Ibrani berfungsi distributif. 'Untuk setiap meja' menyampaikan maknanya secara alami dalam bahasa Indonesia.
- source_word: כֶּסֶף
  choice: perak
  rationale: Istilah bahan yang lugas ini berlawanan dengan emas pada bagian pertama ayat.
- source_word: שֻׁלְחֲנוֹת הַכָּסֶף
  choice: meja-meja perak
  rationale: Frasa konstruksi ini paling wajar dipahami sebagai meja-meja yang terbuat dari atau ditetapkan sebagai meja perak.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata 'juga' mempertahankan fungsi penghubung וְ dalam rangkaian daftar. Bentuk jamak dan pembagian berat bagi tiap meja dipertahankan, sedangkan pengulangan distributif Ibrani dialihkan secara alami menjadi 'setiap meja'.
