  text: וּ/לְ/מִזְבַּ֧ח הַ/קְּטֹ֛רֶת זָהָ֥ב מְזֻקָּ֖ק בַּ/מִּשְׁקָ֑ל וּ/לְ/תַבְנִ֣ית הַ/מֶּרְכָּבָ֗ה הַ/כְּרֻבִ֤ים זָהָב֙ לְ/פֹ֣רְשִׂ֔ים וְ/סֹכְכִ֖ים עַל אֲר֥וֹן בְּרִית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/018.yaml
  text: and for the altar of incense[a], refined gold by weight; and for the pattern of the chariot[b], the cherubim of gold spreading out their wings and overshadowing the ark of the covenant of Yahweh.
translation:
  language: id
  text: juga emas yang dimurnikan menurut beratnya untuk mezbah pembakaran dupa; dan untuk rancangan kereta[a], yakni kerub-kerub emas yang membentangkan sayapnya dan menaungi di atas tabut perjanjian Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani ini sulit. Dapat juga dipahami sebagai “pola” atau “model kereta” dan mungkin menunjuk pada susunan kerub yang berkaitan dengan tabut, yang digambarkan sebagai takhta-kereta.
    reason: alternative_reading
  - marker: b
    text: Atau “menutupi.” Gambarannya ialah kerub-kerub dengan sayap terbentang di atas tabut.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: mezbah pembakaran dupa
  rationale: Ungkapan ini menunjuk pada mezbah tempat dupa dibakar. Bentuk ini jelas dan alami dalam bahasa Indonesia serta mempertahankan hubungan konstruksi Ibrani.
- source_word: זָהָב מְזֻקָּק
  choice: emas murni
  rationale: Partisipel מְזֻקָּק berarti dimurnikan melalui pemurnian. Dalam konteks penetapan bahan, 'emas murni' merupakan padanan Indonesia yang alami; gagasan proses pemurniannya tetap mendasari istilah tersebut.
- source_word: בַּמִּשְׁקָל
  choice: menurut beratnya
  rationale: Frasa ini menyatakan bahwa jumlah emas ditetapkan berdasarkan ukuran berat.
- source_word: תַבְנִית
  choice: rancangan
  rationale: Dalam konteks rancangan perlengkapan bait, תַבְנִית dapat berarti pola, bentuk, model, atau rancangan. 'Rancangan' alami tanpa mengharuskan bahwa yang dimaksud adalah benda contoh tiga dimensi.
- source_word: הַמֶּרְכָּבָה
  choice: kereta
  rationale: Arti biasa nomina ini adalah 'kereta'. Terjemahan mempertahankan istilah konkret dan kejanggalan asli, tanpa secara diam-diam menafsirkannya sebagai takhta-kereta.
- source_word: הַכְּרֻבִים זָהָב
  choice: kerub-kerub emas
  rationale: '''Kerub'' mempertahankan istilah teknis Alkitab, sedangkan ''emas'' menyatakan bahan pembuatannya. Bentuk ulang menandai jamak secara wajar dalam bahasa Indonesia.'
- source_word: לְפֹרְשִׂים
  choice: yang mengembangkan sayap
  rationale: Partisipel פרשׂ berarti membentangkan atau mengembangkan. Objek 'sayap' tersirat jelas dari gambaran kerub di atas tabut dan perlu dinyatakan agar kalimat Indonesia lengkap.
- source_word: וְסֹכְכִים
  choice: dan menaungi
  rationale: Akar סכך mengandung arti menutupi atau menaungi. 'Menaungi' mempertahankan gambaran sayap yang terbentang di atas tabut.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: tabut perjanjian Yahweh
  rationale: Padanan ini mempertahankan rantai konstruksi Ibrani secara ringkas dan menerjemahkan nama ilahi יְהוָה sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Hubungan 'kereta' dengan kerub-kerub
  choice: Mempertahankan 'rancangan kereta' dan menghubungkan kerub-kerub dengannya melalui 'yaitu'
  alternative: rancangan takhta-kereta kerub
  rationale: Frasa Ibraninya sulit dan mungkin menggambarkan struktur kerub sebagai takhta bergerak atau kereta ilahi. Terjemahan utama tidak memasukkan tafsiran 'takhta', sementara catatan mempertahankan kemungkinan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Struktur ayat mempertahankan kesinambungan dengan daftar pemberian Daud dalam konteks sebelumnya melalui kata 'juga'. Tanda titik koma memisahkan dua alokasi bahan. Semua penanda catatan kaki ditempatkan tepat pada ungkapan yang dijelaskan.
