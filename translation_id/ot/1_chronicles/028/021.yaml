    text: Secara harfiah, “untuk segala perkataanmu”; maksudnya, mereka siap menjalankan semua arahan atau urusan yang engkau sampaikan.
    reason: lexical_alternative
  revision_rationale: Revisi mempertahankan penanda perhatian “Lihatlah”, pembedaan antara kelompok pelayanan yang tersedia bagi tugasnya dan para pekerja rela yang menyertai Salomo, serta makna idiomatis klausa penutup. Catatan kaki tetap menandai bentuk harfiah “segala perkataanmu” dan kemungkinan cakupan “arahan atau urusan”.
