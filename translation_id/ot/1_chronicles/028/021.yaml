- from: Lihatlah, kelompok-kelompok para imam dan orang Lewi siap untuk segala pelayanan di rumah Allah. Dalam setiap pekerjaan, engkau akan didampingi oleh setiap orang yang rela dan terampil untuk segala jenis pelayanan. Para pejabat dan seluruh rakyat[a] pun siap melaksanakan segala perkataanmu.
  to: Lihatlah, kelompok-kelompok para imam dan orang-orang Lewi tersedia bagi seluruh pelayanan di rumah Allah. Dalam setiap pekerjaan, setiap orang yang rela dan terampil akan menyertaimu untuk setiap jenis pelayanan. Para pejabat dan seluruh rakyat[a] pun siap melaksanakan segala perintahmu.
  rationale: Revisi mempertahankan penanda perhatian “Lihatlah”, pembedaan antara kelompok pelayanan yang tersedia bagi tugasnya dan para pekerja rela yang menyertai Salomo, serta makna idiomatis klausa penutup. Catatan kaki tetap menandai bentuk harfiah “segala perkataanmu” dan kemungkinan cakupan “arahan atau urusan”.
