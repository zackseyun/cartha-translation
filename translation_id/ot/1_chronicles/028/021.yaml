  text: וְ/הִנֵּ֗ה מַחְלְקוֹת֙ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם לְ/כָל עֲבוֹדַ֖ת בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/עִמְּ/ךָ֙ בְ/כָל מְלָאכָ֜ה לְ/כָל נָדִ֤יב בַּֽ/חָכְמָה֙ לְ/כָל עֲבוֹדָ֔ה וְ/הַ/שָּׂרִ֥ים וְ/כָל הָ/עָ֖ם לְ/כָל דְּבָרֶֽי/ךָ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/021.yaml
  text: And behold[a], the divisions of the priests and the Levites are for all the service of the house of God, and with you in all the work will be every willing man skilled in wisdom for every kind of service; the officials also, and all the people[b], will be wholly at your command.
translation:
  language: id
  text: Lihatlah, kelompok-kelompok para imam dan orang-orang Lewi tersedia bagi seluruh pelayanan di rumah Allah. Dalam setiap pekerjaan, setiap orang yang rela dan terampil akan menyertaimu untuk setiap jenis pelayanan. Para pejabat dan seluruh rakyat[a] pun siap melaksanakan segala perintahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk segala perkataanmu”; maksudnya, mereka siap menjalankan semua arahan atau urusan yang engkau sampaikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan fungsi penunjuk yang mengarahkan perhatian dan memberi penekanan pada jaminan Daud.
- source_word: מַחְלְקוֹת
  choice: kelompok-kelompok
  rationale: Menunjuk pada satuan pelayanan imam dan orang Lewi yang diatur; lebih alami dalam bahasa Indonesia modern daripada istilah teknis seperti 'giliran-giliran'.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: para imam dan orang Lewi
  rationale: Mempertahankan kedua kelompok khusus dalam pelayanan rumah Allah.
- source_word: לְכָל עֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: untuk segala pelayanan di rumah Allah
  rationale: Mempertahankan ungkapan konkret 'rumah Allah' serta cakupan penuh pelayanannya.
- source_word: וְעִמְּךָ
  choice: engkau akan didampingi
  rationale: Mengungkapkan secara alami bahwa para pekerja itu akan berada bersama Salomo untuk mendukungnya.
- source_word: בְכָל מְלָאכָה
  choice: dalam setiap pekerjaan
  rationale: Mencakup seluruh pekerjaan praktis yang berkaitan dengan pembangunan dan pelayanan rumah Allah.
- source_word: לְכָל נָדִיב בַּחָכְמָה
  choice: setiap orang yang rela dan terampil
  rationale: נָדִיב menyatakan kerelaan hati, sedangkan חָכְמָה dalam konteks pekerjaan menyatakan kecakapan praktis.
- source_word: לְכָל עֲבוֹדָה
  choice: untuk segala jenis pelayanan
  rationale: Menjaga keluasan cakupan dan membedakan secara wajar עֲבוֹדָה dari מְלָאכָה sebelumnya.
- source_word: וְהַשָּׂרִים
  choice: Para pejabat
  rationale: Sesuai dengan konteks pemerintahan dan tidak memberi kesan bahwa mereka harus merupakan bangsawan turun-temurun.
- source_word: וְכָל הָעָם
  choice: dan seluruh rakyat
  rationale: Menyampaikan dukungan yang menyeluruh dari umat atau rakyat.
- source_word: לְכָל דְּבָרֶיךָ
  choice: siap melaksanakan segala perkataanmu
  rationale: Tetap dekat dengan arti harfiah 'untuk segala perkataanmu', sekaligus menyampaikan maksud kontekstual bahwa mereka siap menjalankan arahan Salomo.
theological_decisions:
- issue: Cakupan gender pada נָדִיב
  choice: setiap orang yang rela
  alternative: setiap laki-laki yang rela; setiap relawan
  rationale: Bentuk Ibrani adalah maskulin tunggal, tetapi dalam konteks ini menunjuk secara umum kepada siapa pun dari kalangan pekerja yang rela. Bahasa Indonesia tidak menandai gender pada 'orang', sehingga pilihan ini alami tanpa memperluas atau mempersempit rujukan secara tidak perlu.
- issue: Terjemahan בֵּית הָאֱלֹהִים
  choice: rumah Allah
  alternative: Bait Allah
  rationale: Mempertahankan metafora konkret teks sumber. 'Rumah Allah' juga lebih transparan bagi pembaca modern, sementara konteks tetap menunjukkan bangunan suci yang akan didirikan.
- issue: Hubungan sintaksis לְכָל נָדִיב בַּחָכְמָה
  choice: setiap orang yang rela dan terampil
  alternative: setiap relawan yang terampil; setiap orang yang berhati luhur dalam hikmat
  rationale: Ungkapan Ibrani ringkas dan agak sukar. Dalam konteks pekerjaan rumah Allah, חָכְמָה paling wajar menyatakan keterampilan praktis, sedangkan נָדִיב menyatakan kesiapsediaan atau kerelaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dipakai karena Daud berbicara langsung kepada Salomo. Struktur kalimat dipecah agar mudah dipahami tanpa menghilangkan urutan gagasan dan cakupan menyeluruh dalam teks Ibrani.
