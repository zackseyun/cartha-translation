base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/015.yaml
  text: and the weight for the lampstands of gold and their lamps of gold[a], by the weight of each lampstand and its lamps; and for the lampstands of silver, by weight for each lampstand and its lamps, according to the service of each lampstand.
translation:
  language: id
  text: juga berat untuk kaki-kaki pelita emas dan pelita-pelitanya yang dari emas, menurut berat setiap kaki pelita dan pelita-pelitanya; serta untuk kaki-kaki pelita perak, menurut berat setiap kaki pelita dan pelita-pelitanya, sesuai dengan fungsi setiap kaki pelita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai ungkapan “kaki pelita demi kaki pelita” dalam frasa tentang berat dan fungsi; pengulangan ini menyatakan setiap kaki pelita secara tersendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקָל
  choice: berat
  rationale: Dalam konteks daftar perlengkapan Bait Allah, kata ini menunjuk pada jumlah bahan yang ditetapkan menurut beratnya.
- source_word: מְנֹרוֹת
  choice: kaki pelita
  rationale: Istilah ini menunjuk pada penyangga yang memegang beberapa pelita, bukan pada pelita itu sendiri.
- source_word: נֵרֹתֵיהֶם / נֵרֹתֶיהָ
  choice: pelita-pelitanya
  rationale: Kata ini menunjuk pada masing-masing pelita yang terpasang pada kaki pelita dan perlu dibedakan dari kaki pelitanya.
- source_word: זָהָב / כֶּסֶף
  choice: emas / perak
  rationale: Istilah bahan ini diterjemahkan secara langsung; susunan Indonesia dibuat alami tanpa menghilangkan kesejajaran kedua jenis kaki pelita.
- source_word: בְּמִשְׁקַל מְנוֹרָה וּמְנוֹרָה
  choice: berat ... untuk setiap kaki pelita
  rationale: Pengulangan nomina dalam bahasa Ibrani bersifat distributif, sehingga 'setiap' menyampaikan alokasi satu per satu secara alami.
- source_word: כַּעֲבוֹדַת מְנוֹרָה וּמְנוֹרָה
  choice: sesuai dengan fungsi masing-masing kaki pelita
  rationale: עֲבוֹדָה di sini paling mungkin menunjuk pada fungsi atau keperluan tiap kaki pelita; 'fungsi' lebih jelas dalam bahasa Indonesia daripada terjemahan harfiah 'pelayanan'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ayat dipertahankan sebagai kelanjutan sintaksis dari ayat sebelumnya. Ungkapan distributif Ibrani diterjemahkan dengan 'setiap' dan 'masing-masing' agar alami dan jelas.
