  text: רְאֵ֣ה עַתָּ֗ה כִּֽי יְהוָ֛ה בָּ֧חַר בְּ/ךָ֛ לִ/בְנֽוֹת בַּ֥יִת לַ/מִּקְדָּ֖שׁ חֲזַ֥ק וַ/עֲשֵֽׂה׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/010.yaml
  text: See now[a], for Yahweh has chosen you to build a house for the sanctuary. Be strong[b], and do it.
translation:
  language: id
  text: Perhatikanlah sekarang[a], sebab Yahweh telah memilih engkau untuk membangun sebuah rumah bagi tempat kudus[b]. Jadilah kuat dan lakukanlah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Pertimbangkanlah sekarang” atau “Camkanlah sekarang.” Imperatif pembuka ini menyerukan perhatian dan pertimbangan, bukan hanya penglihatan fisik.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sebuah rumah bagi tempat kudus”; maksudnya dapat dipahami sebagai rumah yang akan berfungsi sebagai tempat kudus, yaitu bangunan Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה עַתָּה
  choice: Perhatikanlah sekarang
  rationale: Imperatif ראה di sini merupakan seruan agar pendengar memberi perhatian dan mempertimbangkan pesan, bukan sekadar melihat secara fisik; עתה menegaskan kemendesakan nasihat itu.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan yang mendasari seruan pembuka.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: בָּחַר בְּךָ
  choice: telah memilih engkau
  rationale: Bentuk perfektif menyatakan pilihan yang sudah ditetapkan dan tetap relevan bagi penugasan Salomo; 'engkau' mempertahankan sapaan tunggal yang khidmat.
- source_word: לִבְנוֹת
  choice: untuk membangun
  rationale: Padanan langsung dan alami bagi infinitif בנה yang menyatakan tujuan pemilihan.
- source_word: בַּיִת לַמִּקְדָּשׁ
  choice: sebuah rumah bagi tempat kudus
  rationale: Mempertahankan kedua nomina dalam bahasa Ibrani—'rumah' dan 'tempat kudus'—tanpa langsung meleburkannya menjadi 'Bait Allah'.
- source_word: חֲזַק
  choice: Hendaklah engkau kuat
  rationale: Menyampaikan imperatif yang menuntut kekuatan dan keteguhan dengan ungkapan Indonesia yang jelas tanpa menambahkan objek seperti 'hati'.
- source_word: וַעֲשֵׂה
  choice: dan kerjakanlah itu
  rationale: Objek tindakan tersirat dari konteks, yakni tugas pembangunan; 'kerjakanlah itu' menyatakannya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi 'Yahweh' mempertahankan nama itu dan membedakannya dari gelar.
- issue: Hubungan antara בַּיִת dan מִקְדָּשׁ
  choice: sebuah rumah bagi tempat kudus
  alternative: Bait Allah atau sebuah rumah sebagai tempat kudus
  rationale: Susunan Ibrani secara harfiah menyebut 'rumah bagi tempat kudus'. Terjemahan utama mempertahankan bentuk tersebut, sedangkan catatan mengakui bahwa maksudnya dapat dipahami sebagai rumah yang berfungsi sebagai tempat kudus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan tunggal 'engkau' dipakai sesuai konteks pidato Daud kepada Salomo. Struktur Ibrani dipertahankan sejauh tetap dapat dipahami, sementara dua catatan kaki menjelaskan idiom pembuka dan frasa kultis yang padat.
