  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/תַבְנִ֗ית כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה בָ/ר֨וּחַ֙ עִמּ֔/וֹ לְ/חַצְר֧וֹת בֵּית יְהוָ֛ה וּ/לְ/כָל הַ/לְּשָׁכ֖וֹת סָבִ֑יב לְ/אֹֽצְרוֹת֙ בֵּ֣ית הָ/אֱלֹהִ֔ים וּ/לְ/אֹצְר֖וֹת הַ/קֳּדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/012.yaml
  text: 'and the plan of all that was in the Spirit with him: for the courts of the house of Yahweh[a], for all the surrounding chambers, for the treasuries of the house of God, and for the treasuries of the holy things.'
translation:
  language: id
  text: 'juga rancangan segala sesuatu yang ada dalam Roh bersamanya[a]: untuk pelataran-pelataran rumah TUHAN, semua ruang di sekelilingnya, perbendaharaan rumah Allah, dan perbendaharaan barang-barang kudus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “segala sesuatu yang ada dalam rohnya,” yaitu dalam pikiran atau batin Daud sendiri.
    reason: alternative_reading
lexical_decisions:
- source_word: תַבְנִית
  choice: rancangan
  rationale: Dalam konteks pembangunan Bait Allah, kata ini menunjuk pada rancangan atau pola arsitektural; “rancangan” akurat dan alami dalam bahasa Indonesia modern.
- source_word: כֹּל אֲשֶׁר
  choice: segala sesuatu yang
  rationale: Ungkapan ini mempertahankan cakupan menyeluruh dari teks Ibrani dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: הָיָה בָרוּחַ עִמּוֹ
  choice: ada dalam Roh bersamanya
  rationale: Susunan ini mempertahankan kejanggalan dan ambiguitas ungkapan Ibrani sambil mengikuti kemungkinan bahwa רוּחַ merujuk pada Roh ilahi. Alternatif bahwa yang dimaksud ialah roh, pikiran, atau batin Daud dicatat dalam catatan kaki.
- source_word: לְחַצְרוֹת
  choice: pelataran-pelataran
  rationale: Istilah ini lazim dan jelas untuk kawasan terbuka yang menjadi bagian dari kompleks Bait Allah.
- source_word: בֵּית יְהוָה
  choice: rumah TUHAN
  rationale: “Rumah” mempertahankan metafora Ibrani bagi Bait Allah, sedangkan nama ilahi יהוה diterjemahkan menurut konvensi Indonesia sebagai “TUHAN”.
- source_word: לְּשָׁכוֹת סָבִיב
  choice: semua ruang di sekelilingnya
  rationale: “Ruang” lebih mudah dipahami pembaca modern daripada “bilik” atau “kamar-kamar”, dan “di sekelilingnya” menyampaikan fungsi adverbial סָבִיב secara alami.
- source_word: אֹצְרוֹת
  choice: perbendaharaan
  rationale: Kata ini menunjuk pada ruang atau tempat penyimpanan harta dan persembahan dalam lingkungan Bait Allah; “perbendaharaan” sesuai dengan konteks sakral.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani serta kesejajarannya dengan “rumah TUHAN” pada bagian sebelumnya.
- source_word: הַקֳּדָשִׁים
  choice: barang-barang kudus
  rationale: Dalam konteks perbendaharaan, bentuk jamak ini paling mungkin menunjuk pada benda-benda yang dikuduskan atau dipersembahkan; “barang-barang kudus” menyatakan rujukan konkret tersebut tanpa mempersempitnya menjadi jenis persembahan tertentu.
theological_decisions:
- issue: Makna בָרוּחַ עִמּוֹ
  choice: 'Roh ilahi: “ada dalam Roh bersamanya”'
  alternative: 'Roh, pikiran, atau batin Daud sendiri: “ada dalam rohnya”'
  rationale: Konteks rancangan Bait Allah yang dinyatakan oleh TUHAN, khususnya ayat 19, mendukung rujukan kepada Roh ilahi. Namun, sintaksis Ibrani juga memungkinkan rujukan antropologis kepada batin Daud; karena itu kemungkinan tersebut tidak dihapus, melainkan dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah arsitektural dibuat mudah dipahami tanpa menghilangkan ungkapan khas Ibrani seperti “rumah TUHAN” dan “rumah Allah”. Ambiguitas mengenai רוּחַ dipertahankan melalui teks utama dan catatan kaki.
