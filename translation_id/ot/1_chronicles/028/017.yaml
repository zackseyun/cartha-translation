base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/017.yaml
  text: and the forks, the basins, and the pitchers of pure gold; and for the golden bowls, by weight for each bowl and bowl; and for the silver bowls, by weight for each bowl and bowl.
translation:
  language: id
  text: dan garpu-garpu, bokor-bokor, dan kendi-kendi[a] dari emas murni; untuk mangkuk-mangkuk emas, menurut berat masing-masing mangkuk, dan untuk mangkuk-mangkuk perak, menurut berat masing-masing mangkuk.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cawan-cawan.” Istilah Ibrani ini tampaknya menunjuk pada wadah untuk menuang, tetapi bentuk tepatnya tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bahasa Ibrani mengulang “untuk mangkuk dan mangkuk,” suatu ungkapan distributif yang berarti bahwa setiap mangkuk mempunyai berat yang ditentukan sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּזְלָגוֹת
  choice: garpu-garpu
  rationale: Kata ini menunjuk pada perkakas Bait Allah yang bercabang seperti garpu. Pilihan ini konkret, mudah dipahami, dan tidak menambahkan fungsi yang tidak dinyatakan dalam ayat.
- source_word: מִּזְרָקוֹת
  choice: bokor-bokor
  rationale: Istilah ini lazim menunjuk pada wadah upacara korban. 'Bokor' mempertahankan nuansa wadah lebar dan membedakannya dari כְפוֹרֵי yang diterjemahkan 'mangkuk-mangkuk'.
- source_word: קְּשָׂוֹת
  choice: kendi-kendi
  rationale: Istilah ini tampaknya menunjuk pada wadah untuk menuang. 'Kendi' merupakan padanan Indonesia modern yang alami, sementara ketidakpastian bentuk tepatnya dicatat dalam catatan kaki.
- source_word: זָהָב טָהוֹר
  choice: dari emas murni
  rationale: Frasa ini menerangkan bahan perkakas-perkakas yang disebut sebelumnya dan diterjemahkan secara alami tanpa mengurangi cakupannya.
- source_word: כְפוֹרֵי
  choice: mangkuk-mangkuk
  rationale: Dalam daftar perkakas ini, kata tersebut menunjuk pada wadah berbentuk mangkuk. Pilihan ini juga membedakannya dari מִּזְרָקוֹת yang diterjemahkan 'bokor-bokor'.
- source_word: בְּמִשְׁקָל
  choice: menurut berat
  rationale: Ungkapan ini menyatakan bahwa jumlah logam untuk setiap benda ditetapkan berdasarkan beratnya. 'Menurut berat' ringkas dan sesuai dengan susunan inventaris.
- source_word: לִכְפוֹר וּכְפוֹר
  choice: masing-masing mangkuk
  rationale: Pengulangan nomina dalam bahasa Ibrani berfungsi distributif. 'Masing-masing mangkuk' menyampaikan pembagian satu per satu secara alami dalam bahasa Indonesia, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: כֶּסֶף
  choice: perak
  rationale: Padanan baku untuk logam ini dan mempertahankan kontras dengan emas.
