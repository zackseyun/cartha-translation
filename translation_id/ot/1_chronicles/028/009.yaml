source:
  edition: WLC
  text: וְ/אַתָּ֣ה שְׁלֹמֹֽה בְנִ֡/י דַּע֩ אֶת אֱלֹהֵ֨י אָבִ֜י/ךָ וְ/עָבְדֵ֗/הוּ בְּ/לֵ֤ב שָׁלֵם֙ וּ/בְ/נֶ֣פֶשׁ חֲפֵצָ֔ה כִּ֤י כָל לְבָבוֹת֙ דּוֹרֵ֣שׁ יְהוָ֔ה וְ/כָל יֵ֥צֶר מַחֲשָׁב֖וֹת מֵבִ֑ין אִֽם תִּדְרְשֶׁ֨/נּוּ֙ יִמָּ֣צֵא לָ֔/ךְ וְ/אִם תַּֽעַזְבֶ֖/נּוּ יַזְנִיחֲ/ךָ֥ לָ/עַֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/009.yaml
  text: And you[a], Solomon my son, know the God of your father and serve him with a whole heart and a willing soul, for Yahweh searches all hearts and understands every intention of the thoughts. If you seek him, he will let himself be found by you; but if you forsake him[b], he will cast you off forever.
translation:
  language: id
  text: Dan engkau, Salomo, anakku, kenallah Allah ayahmu dan layanilah Dia dengan hati yang utuh dan jiwa yang rela, sebab Yahweh menyelidiki segala hati dan memahami setiap rancangan pikiran. Jika engkau mencari Dia, Dia akan membiarkan diri-Nya ditemukan olehmu[a]; tetapi jika engkau meninggalkan Dia, Dia akan menolakmu untuk selama-lamanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia akan ditemukan olehmu.” Bentuk kata kerja Ibraninya dapat dipahami sebagai pasif atau refleksif.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Dia akan membuangmu untuk selama-lamanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּע
  choice: kenallah
  rationale: Bentuk imperatif ini menyerukan pengenalan dan pengakuan pribadi terhadap Allah, bukan sekadar pengetahuan intelektual. "Kenallah" mempertahankan daya relasional dan kovenantalnya.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: Allah ayahmu
  rationale: 'Frasa konstruksi ini menyatakan kesinambungan keluarga dan perjanjian: Allah yang dikenal serta disembah oleh ayah Salomo.'
- source_word: וְעָבְדֵהוּ
  choice: dan layanilah Dia
  rationale: Kata עבד ketika ditujukan kepada Allah mencakup pengabdian, ketaatan, dan ibadah. "Layanilah" mempertahankan cakupan yang lebih luas daripada hanya tindakan ritual.
- source_word: בְּלֵב שָׁלֵם
  choice: dengan hati yang utuh
  rationale: שָׁלֵם menyatakan keutuhan, kelengkapan, dan ketulusan. "Hati yang utuh" menghindari kesan bahwa yang dimaksud adalah kesempurnaan tanpa dosa.
- source_word: וּבְנֶפֶשׁ חֲפֵצָה
  choice: dan jiwa yang rela
  rationale: נֶפֶשׁ menunjuk pada diri batin atau pribadi, sedangkan חֲפֵצָה menyatakan kerelaan, keinginan, atau kesukaan. Terjemahan ini mempertahankan unsur antropologis dan kehendak.
- source_word: כִּי כָל לְבָבוֹת דּוֹרֵשׁ יְהוָה
  choice: sebab Yahweh menyelidiki segala hati
  rationale: דרשׁ di sini berarti memeriksa atau menyelidiki secara menyeluruh, bukan mencari karena belum mengetahui.
- source_word: וְכָל יֵצֶר מַחֲשָׁבוֹת מֵבִין
  choice: dan memahami setiap kecenderungan pikiran
  rationale: יֵצֶר dapat berarti bentukan, kecenderungan, atau niat. Dalam hubungannya dengan מַחֲשָׁבוֹת, frasa ini menunjuk pada arah batin yang membentuk pikiran.
- source_word: אִם תִּדְרְשֶׁנּוּ
  choice: Jika engkau mencari Dia
  rationale: Dalam konteks perjanjian, דרשׁ menyatakan tindakan mencari Allah dengan pengabdian dan ketergantungan.
- source_word: יִמָּצֵא לָךְ
  choice: Dia akan membiarkan diri-Nya ditemukan olehmu
  rationale: Bentuk Niphal dapat bernuansa pasif atau refleksif, yaitu "ditemukan". Pilihan ini mempertahankan gagasan bahwa Allah sungguh dapat ditemukan sekaligus bahwa Ia memberikan diri-Nya untuk ditemukan.
- source_word: תַּעַזְבֶנּוּ
  choice: jika engkau meninggalkan Dia
  rationale: עזב dalam konteks perjanjian berarti meninggalkan atau menelantarkan kesetiaan kepada Allah. "Meninggalkan" jelas dan tetap khidmat dalam bahasa Indonesia modern.
- source_word: יַזְנִיחֲךָ לָעַד
  choice: Dia akan menolakmu untuk selama-lamanya
  rationale: Bentuk Hiphil dari זנח menyatakan penolakan atau pembuangan. "Menolakmu untuk selama-lamanya" mempertahankan kerasnya peringatan tanpa menambahkan penafsiran teologis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai "Yahweh" agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
theological_decisions:
- issue: Bahasa antropologis tentang hati dan jiwa
  choice: Mempertahankan pembedaan antara "hati" dan "jiwa".
  alternative: Melebur keduanya menjadi kategori psikologis seperti "pikiran" atau "batin".
  rationale: Teks Ibrani membedakan לֵב dan נֶפֶשׁ untuk menggambarkan pengabdian seluruh diri. Pembedaan ini tidak boleh diratakan.
- issue: Cara Allah ditemukan dalam יִמָּצֵא לָךְ
  choice: Dia akan membiarkan diri-Nya ditemukan olehmu.
  alternative: Dia akan ditemukan olehmu; engkau akan menemukan Dia.
  rationale: Bentuk Niphal menyisakan ketegangan antara pencarian manusia dan kesediaan Allah untuk ditemukan. Rumusan utama mempertahankan kedua sisi tanpa menjadikannya pernyataan suatu sistem doktrin tertentu.
- issue: Kerasnya peringatan perjanjian
  choice: Dia akan menolakmu untuk selama-lamanya.
  alternative: Dia akan membuangmu untuk selama-lamanya; Dia akan meninggalkanmu untuk selama-lamanya.
  rationale: Ucapan Daud menyampaikan peringatan yang tegas kepada Salomo. Terjemahan mempertahankan bobot ancaman tersebut tanpa melunakkannya atau menyelesaikan pertanyaan teologis yang lebih luas di luar ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan langsung, sesuai nasihat seorang ayah sekaligus raja. Pronomina orang kedua tunggal "engkau" mempertahankan sapaan pribadi kepada Salomo. Istilah "hati" dan "jiwa" dipertahankan sebagai bahasa antropologis sumber, sedangkan susunan frasa dibuat wajar bagi pembaca Indonesia masa kini.
