base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/013.yaml
  text: for the divisions of the priests and the Levites[a], and for all the work of the service of the house of Yahweh[b], and for all the vessels of service of the house of Yahweh.
translation:
  language: id
  text: dan untuk pembagian tugas para imam dan orang Lewi[a], untuk segala pekerjaan pelayanan di rumah Yahweh, dan untuk segala perlengkapan[b] pelayanan di rumah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelompok-kelompok tugas para imam dan orang Lewi” atau “giliran tugas para imam dan orang Lewi”.
    reason: lexical_alternative
  - marker: b
    text: Atau “perkakas” atau “berbagai benda”. Istilah Ibraninya mencakup beragam barang yang digunakan dalam pelayanan rumah Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְלְקוֹת
  choice: pembagian tugas
  rationale: Dalam Tawarikh, kata ini menunjuk pada pengelompokan orang menurut giliran atau tugas yang telah ditetapkan. “Pembagian tugas” menyampaikan makna administratif itu secara alami dalam bahasa Indonesia.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku bagi golongan imam Israel; bentuk jamak dan kekhususannya tercermin secara wajar dengan “para”.
- source_word: וְהַלְוִיִּם
  choice: dan orang Lewi
  rationale: Sebutan baku bagi anggota suku Lewi yang menjalankan tugas keagamaan.
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: pekerjaan pelayanan
  rationale: Gabungan ini secara harfiah menyatakan pekerjaan yang termasuk dalam pelayanan rumah Yahweh. Terjemahan ini mempertahankan kedua unsur tanpa mempersempitnya menjadi pelayanan jabatan gerejawi.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan ungkapan Ibrani “rumah” dan menyajikan nama ilahi secara langsung.
- source_word: כְּלֵי
  choice: perlengkapan
  rationale: Kata ini mencakup berbagai benda, perkakas, dan bejana yang digunakan dalam pelayanan, bukan hanya wadah; “perlengkapan” merupakan istilah Indonesia yang luas dan alami.
- source_word: לְכָל
  choice: untuk segala
  rationale: Mempertahankan struktur daftar yang berulang serta cakupan menyeluruh dari preposisi לְ dan כָל.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara eksplisit memakai Tetragramaton. “Yahweh” mempertahankan nama perjanjian itu sebagai nama diri, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ayat dipertahankan sebagai kelanjutan sintaksis dari konteks sebelumnya melalui kata “juga”. “Rumah Yahweh” menjaga metafora sumber, sedangkan “perlengkapan” menghindari kesan bahwa semua כְּלֵי adalah wadah.
