translation:
  language: id
  text: Emas menurut beratnya untuk semua perlengkapan emas bagi setiap jenis pelayanan[a], dan semua perlengkapan perak menurut beratnya bagi setiap jenis pelayanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bahasa Ibrani mengulang kata “pelayanan”: “pelayanan dan pelayanan.” Ini merupakan ungkapan distributif yang berarti kira-kira “bagi setiap jenis pelayanan” atau “untuk setiap penggunaan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָהָב
  choice: emas
  rationale: Istilah dasar untuk bahan emas; bentuk berartikelnya tidak perlu dinyatakan secara kaku dalam gaya daftar bahasa Indonesia.
- source_word: בַּמִּשְׁקָל
  choice: menurut beratnya
  rationale: Preposisi ב dengan מִשְׁקָל menunjukkan penetapan berdasarkan berat yang diukur. Ungkapan ini alami dan mempertahankan gaya inventaris.
- source_word: כְּלֵי
  choice: perlengkapan
  rationale: כְּלִי mencakup berbagai benda yang digunakan dalam pelayanan. 'Perlengkapan' cukup luas dan tidak membatasi makna hanya pada wadah atau perkakas.
- source_word: עֲבוֹדָה
  choice: pelayanan
  rationale: Dalam konteks ibadah di Bait Allah, kata ini menunjuk pada pelayanan atau pekerjaan yang dilaksanakan; 'pelayanan' mempertahankan nuansa kultis secara wajar.
- source_word: עֲבוֹדָה וַעֲבוֹדָה
  choice: setiap jenis pelayanan
  rationale: Pengulangan Ibrani berfungsi distributif, yaitu membedakan berbagai macam penggunaan atau tugas, bukan sekadar mengulang kata secara harfiah.
- source_word: כֶּסֶף
  choice: perak
  rationale: Menunjuk pada bahan perak yang ditetapkan bagi perlengkapan Bait Allah, sejajar dengan emas.
- source_word: לְכָל / לְכֹל
  choice: untuk semua
  rationale: Gabungan preposisi dan כֹּל menyatakan cakupan keseluruhan; 'untuk semua' alami dalam bahasa Indonesia dan tetap mempertahankan keluasan cakupan.
