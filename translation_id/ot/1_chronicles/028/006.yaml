  - severity: low
    issue: Ungkapan «Aku akan menjadi Bapa baginya» kurang alami.
    rationale: «Aku akan menjadi Bapanya» merupakan padanan Indonesia yang lazim bagi וַאֲנִי אֶהְיֶה לוֹ לְאָב dan tetap mempertahankan relasi Bapa–anak tanpa penambahan tafsiran.
