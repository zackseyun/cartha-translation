base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/006.yaml
  text: And he said to me[a], ‘Solomon your son—he will build my house and my courts, for I have chosen him for myself as a son, and I will be to him as a father.’
translation:
  language: id
  text: Ia berfirman kepadaku, “Salomo, anakmu, dialah yang akan membangun rumah-Ku dan pelataran-pelataran-Ku, sebab Aku telah memilih dia menjadi anak-Ku, dan Aku akan menjadi Bapanya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: Ia berfirman kepadaku
  rationale: Bentuk naratif lampau diterjemahkan secara wajar; karena pembicaranya adalah Allah, “berfirman” sesuai dengan ragam Alkitab Indonesia tanpa mengubah isi verba אָמַר.
- source_word: שְׁלֹמֹה בִנְךָ הוּא
  choice: Salomo, anakmu, dialah
  rationale: Susunan aposisi dipertahankan, sedangkan “dialah” menyampaikan penekanan dari pronomina mandiri הוּא.
- source_word: יִבְנֶה בֵיתִי
  choice: akan membangun rumah-Ku
  rationale: “Rumah” menerjemahkan בַּיִת secara langsung dan mempertahankan gema teologisnya; konteks sudah menunjukkan bahwa yang dimaksud ialah rumah ibadah Allah.
- source_word: וַחֲצֵרוֹתָי
  choice: dan pelataran-pelataran-Ku
  rationale: Bentuk jamak חֲצֵרוֹת menunjuk pada area-area pelataran yang mengelilingi rumah Allah.
- source_word: כִּי בָחַרְתִּי בוֹ
  choice: sebab Aku telah memilih dia
  rationale: כִּי memperkenalkan alasan, dan bentuk perfektif בָחַרְתִּי menyatakan pilihan yang telah dibuat serta tetap berlaku.
- source_word: לִי לְבֵן
  choice: menjadi anak bagi-Ku
  rationale: Ungkapan ini mempertahankan kedua unsur relasional dalam konstruksi berpreposisi tanpa mereduksinya langsung menjadi bentuk posesif “anak-Ku”.
- source_word: וַאֲנִי אֶהְיֶה לוֹ לְאָב
  choice: dan Aku akan menjadi Bapa baginya
  rationale: Terjemahan ini mengikuti rumusan Ibrani “menjadi ... baginya sebagai Bapa” sambil tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa Bapa-anak dalam hubungan Allah dengan Salomo
  choice: Aku telah memilih dia menjadi anak bagi-Ku, dan Aku akan menjadi Bapa baginya
  alternative: Aku telah memilih dia menjadi anak-Ku, dan Aku akan menjadi Bapanya
  rationale: Rumusan utama mempertahankan bahasa perjanjian dan konstruksi relasional Ibrani secara langsung, tanpa melemahkannya menjadi sekadar fungsi dan tanpa memasukkan kesimpulan kristologis kemudian ke dalam konteks langsung tentang Salomo.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina dan sebutan yang merujuk kepada Allah mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia. Pengulangan “pelataran-pelataran” dipakai untuk menyatakan bentuk jamak sumber secara jelas.
