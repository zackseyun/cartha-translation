  to: Kemudian Daud memberikan kepada Salomo, anaknya, rancangan serambi, bangunan-bangunannya, perbendaharaan-perbendaharaannya, ruang-ruang atasnya, kamar-kamar dalamnya, dan ruang untuk tutup pendamaian[a].
