base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/011.yaml
  text: Then David gave to Solomon his son the plan of the portico[a], its houses, its treasuries, its upper rooms, its inner chambers, and the house of the mercy seat.
translation:
  language: id
  text: Kemudian Daud memberikan kepada Salomo, anaknya, rancangan serambi, bangunan-bangunannya, perbendaharaan-perbendaharaannya, ruang-ruang atasnya, kamar-kamar dalamnya, dan ruang untuk tutup pendamaian[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah tutup pendamaian.” “Tutup pendamaian” adalah tutup tabut di Ruang Mahakudus.
    reason: Menjelaskan bentuk harfiah frasa Ibrani dan rujukan konkret כַּפֹּרֶת tanpa memasukkan alternatif yang tidak tepat dalam konteks ini.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Kemudian Daud memberikan
  rationale: Bentuk naratif ini melanjutkan urutan peristiwa; “kemudian” alami dalam bahasa Indonesia modern.
- source_word: תַּבְנִית
  choice: rancangan
  rationale: Dalam konteks pembangunan Bait Allah, kata ini menunjuk pada pola atau desain arsitektural yang diserahkan Daud.
- source_word: הָאוּלָם
  choice: serambi
  rationale: Istilah ini menunjuk pada balai atau bagian depan di pintu masuk bangunan; “serambi” jelas dan lazim dalam konteks arsitektur Bait Allah.
- source_word: בָּתָּיו
  choice: bangunan-bangunannya
  rationale: Bentuk jamak בַּיִת di sini paling wajar dipahami sebagai unit-unit bangunan dalam kompleks Bait Allah, bukan rumah tinggal.
- source_word: גַנְזַכָּיו
  choice: perbendaharaan-perbendaharaannya
  rationale: Kata ini menunjuk pada tempat penyimpanan harta atau barang-barang berharga yang dikhususkan.
- source_word: עֲלִיֹּתָיו
  choice: ruang-ruang atasnya
  rationale: Terjemahan ini mempertahankan acuan konkret kepada ruangan yang terletak di bagian atas.
- source_word: חֲדָרָיו הַפְּנִימִים
  choice: kamar-kamar dalamnya
  rationale: Terjemahan ini mempertahankan sifat interior ruangan tanpa menambahkan makna superlatif “paling dalam” yang tidak dinyatakan secara eksplisit.
- source_word: בֵית הַכַּפֹּרֶת
  choice: ruang tutup pendamaian
  rationale: Secara harfiah berarti “rumah/ruang dari kapporet”; dalam konteks arsitektur tempat kudus, frasa ini menunjuk pada ruang yang menampung tutup tabut.
- source_word: הַכַּפֹּרֶת
  choice: tutup pendamaian
  rationale: כַּפֹּרֶת adalah tutup tabut di Ruang Mahakudus dan berkaitan dengan ritus pendamaian; ungkapan ini lebih konkret daripada istilah tradisional yang dapat disalahpahami sebagai tempat duduk.
theological_decisions:
- issue: Terjemahan כַּפֹּרֶת dalam istilah tempat kudus
  choice: tutup pendamaian
  alternative: takhta anugerah
  rationale: “Tutup pendamaian” menyatakan bahwa benda yang dimaksud adalah tutup tabut serta mempertahankan kaitannya dengan pendamaian. Alternatif tradisional dicatat agar pembaca mengetahui padanan yang juga dikenal tanpa mengubah ayat menjadi pernyataan doktrinal yang lebih khusus.
- issue: Acuan בֵית הַכַּפֹּרֶת
  choice: ruang tutup pendamaian
  alternative: rumah tutup pendamaian
  rationale: Dalam daftar unsur arsitektural ini, בֵית paling alami merujuk pada ruang tempat tutup pendamaian berada, yakni Ruang Mahakudus; “ruang” menghindari kesan sebuah rumah tinggal terpisah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk ulang dipertahankan pada unsur-unsur jamak agar daftar arsitektural jelas; pronomina -nya mengikuti acuan kepada bangunan Bait Allah yang tersirat dalam konteks.
