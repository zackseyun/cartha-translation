  text: וַ/יִּבְחַ֡ר יְהוָ֣ה אֱלֹהֵי֩ יִשְׂרָאֵ֨ל בִּ֜/י מִ/כֹּ֣ל בֵּית אָבִ֗/י לִ/הְי֨וֹת לְ/מֶ֤לֶךְ עַל יִשְׂרָאֵל֙ לְ/עוֹלָ֔ם כִּ֤י בִֽ/יהוּדָה֙ בָּחַ֣ר לְ/נָגִ֔יד וּ/בְ/בֵ֥ית יְהוּדָ֖ה בֵּ֣ית אָבִ֑/י וּ/בִ/בְנֵ֣י אָבִ֔/י בִּ֣/י רָצָ֔ה לְ/הַמְלִ֖יךְ עַל כָּל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/004.yaml
  text: Yet Yahweh[a], the God of Israel, chose me from all my father's house to be king over Israel forever; for he chose Judah as leader, and in the house of Judah, my father's house, and among my father's sons[b], he took pleasure in me to make me king over all Israel.
translation:
  language: id
  text: Namun, Yahweh, Allah Israel, telah memilih aku dari seluruh keluarga ayahku untuk menjadi raja atas Israel selama-lamanya; sebab Ia telah memilih Yehuda sebagai pemimpin, dan di dalam keluarga Yehuda Ia memilih keluarga ayahku, lalu di antara anak-anak lelaki ayahku Ia berkenan kepadaku untuk mengangkat aku menjadi raja atas seluruh Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Selama-lamanya” dapat menunjuk kelanggengan pemerintahan dalam garis keturunan Daud, bukan hanya lamanya masa pemerintahan Daud sendiri.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi dalam bentuk transliterasi yang lazim dan membedakannya dari gelar 'Tuhan'.
- source_word: וַיִּבְחַר / בָּחַר
  choice: memilih
  rationale: Mengungkapkan tindakan pemilihan ilahi dan mempertahankan pengulangan akar בחר; pada klausa kedua, verba yang tersirat dalam rangkaian pemilihan ditambahkan agar bahasa Indonesia jelas.
- source_word: בֵּית אָבִי
  choice: keluarga ayahku
  rationale: Dalam konteks silsilah, בַּיִת menunjuk rumah tangga atau garis keluarga, bukan bangunan fisik.
- source_word: לְעוֹלָם
  choice: selama-lamanya
  rationale: Mempertahankan cakrawala kelanggengan pemerintahan Daud tanpa menjelaskan lebih jauh apakah acuannya pribadi atau dinastis.
- source_word: לְנָגִיד
  choice: untuk menjadi pemimpin
  rationale: נָגִיד menyatakan kedudukan kepemimpinan atau pemerintahan; 'pemimpin' alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi gelar 'pangeran'.
- source_word: בִּי רָצָה
  choice: Ia berkenan kepadaku
  rationale: רצה dengan preposisi ב menyatakan perkenanan atau penerimaan yang menyenangkan, lebih dari sekadar pengulangan 'memilih'.
- source_word: לְהַמְלִיךְ
  choice: untuk mengangkat aku menjadi raja
  rationale: Bentuk kausatif dari מלך berarti menjadikan atau menetapkan seseorang sebagai raja.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: atas seluruh Israel
  rationale: Menyampaikan lingkup kekuasaan atas segenap Israel secara alami.
theological_decisions:
- issue: Cakupan לְעוֹלָם pada pemerintahan Daud
  choice: selama-lamanya
  alternative: untuk seterusnya; untuk waktu yang sangat lama
  rationale: Terjemahan mempertahankan bobot janji mengenai kelanggengan pemerintahan Daud sekaligus tidak secara eksplisit memutuskan hubungan antara masa pemerintahan pribadi Daud dan kelanjutan dinastinya.
- issue: Makna jabatan נָגִיד
  choice: pemimpin
  alternative: penguasa; pangeran
  rationale: '''Pemimpin'' menyatakan otoritas yang dimaksud tanpa memasukkan hierarki teknis antara pemimpin dan raja yang tidak ditegaskan ayat ini.'
- issue: Rangkaian pemilihan dari Yehuda hingga Daud
  choice: memperjelas verba 'memilih' yang tersirat pada keluarga ayah Daud
  alternative: mempertahankan rangkaian preposisional secara harfiah tanpa verba tambahan
  rationale: Bahasa Ibrani menyusun tahapan Yehuda → kaum Yehuda → keluarga ayah → Daud secara padat. Penambahan verba yang sudah hadir dalam konteks membuat urutannya dapat dipahami dalam bahasa Indonesia tanpa mengubah pelakunya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah kekerabatan dibuat alami bagi pembaca umum, sedangkan nama Yahweh dan ketegangan mengenai kelanggengan kerajaan Daud dipertahankan.
