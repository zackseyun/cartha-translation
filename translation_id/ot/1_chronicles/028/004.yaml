    rationale: Ibrani memakai “putra-putra ayahku”; “anak-anak lelaki ayahku” mempertahankan kekhususan ini dan tetap alami dalam konteks silsilah.
  - severity: low
    issue: “di antara kaum Yehuda” agak menjauh dari preposisi ב pada בְּבֵית יְהוּדָה.
    rationale: “Di dalam keluarga Yehuda” lebih dekat pada bentuk sumber, sambil tetap memungkinkan verba “memilih” yang tersirat untuk memperjelas tahapan pemilihan dalam bahasa Indonesia.
