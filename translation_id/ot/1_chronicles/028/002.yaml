id: 1CH.28.2
reference: 1 Chronicles 28:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֨קָם דָּוִ֤יד הַ/מֶּ֨לֶךְ֙ עַל רַגְלָ֔י/ו וַ/יֹּ֕אמֶר שְׁמָע֖וּ/נִי אַחַ֣/י וְ/עַמִּ֑/י אֲנִ֣י עִם לְבָבִ֡/י לִ/בְנוֹת֩ בֵּ֨ית מְנוּחָ֜ה לַ/אֲר֣וֹן בְּרִית יְהוָ֗ה וְ/לַ/הֲדֹם֙ רַגְלֵ֣י אֱלֹהֵ֔י/נוּ וַ/הֲכִינ֖וֹתִי לִ/בְנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/002.yaml
  text: Then King David rose to his feet and said[a], “Hear me, my brothers and my people. It was in my heart to build a house of rest for the ark of the covenant of Yahweh, and for the footstool of our God[c][b], and I made preparations to build it.”
translation:
  language: id
  text: Lalu Raja Daud bangkit berdiri dan berkata, “Dengarkanlah aku, saudara-saudaraku[a] dan bangsaku. Dalam hatiku aku berniat membangun sebuah rumah perhentian[b] bagi tabut perjanjian Yahweh dan bagi tumpuan kaki Allah kita[c]. Aku pun telah mengadakan persiapan untuk membangunnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “kaum kerabatku”. Teks Ibrani secara harfiah berbunyi “saudara-saudaraku”, bentuk maskulin jamak yang dipakai dalam sapaan umum.
    reason: lexical_alternative
  - marker: b
    text: “Rumah perhentian” dapat juga diterjemahkan “tempat perhentian”, yaitu tempat tinggal tetap bagi tabut.
    reason: lexical_alternative
  - marker: c
    text: Tabut digambarkan berhubungan dengan kehadiran Allah Israel sebagai tumpuan kaki-Nya; bandingkan Mazmur 132:7.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּקָם דָּוִיד הַמֶּלֶךְ עַל רַגְלָיו
  choice: Lalu Raja Daud bangkit berdiri
  rationale: Ungkapan ini menyatakan bahwa Daud bangkit hingga berdiri. ‘Bangkit berdiri’ alami dalam bahasa Indonesia dan tetap mempertahankan tindakan yang dinyatakan teks Ibrani.
- source_word: שְׁמָעוּנִי
  choice: Dengarkanlah aku
  rationale: Bentuk imperatif שמע dengan akhiran orang pertama tunggal merupakan seruan agar hadirin memberi perhatian; partikel ‘-lah’ cocok dengan suasana pidato resmi.
- source_word: אַחַי וְעַמִּי
  choice: saudara-saudaraku dan bangsaku
  rationale: ‘Saudara-saudaraku’ mempertahankan sapaan kekerabatan maskulin jamak, sedangkan ‘bangsaku’ menyampaikan identitas nasional yang dinyatakan עַמִּי.
- source_word: אֲנִי עִם לְבָבִי
  choice: Dalam hatiku aku berniat
  rationale: Ungkapan Ibrani menyatakan niat atau tekad batin. Terjemahan ini alami dalam bahasa Indonesia tanpa menghilangkan citra ‘hati’.
- source_word: בֵּית מְנוּחָה
  choice: sebuah rumah perhentian
  rationale: Mempertahankan metafora harfiah ‘rumah’ dan ‘perhentian’, yang menunjuk pada tempat menetap bagi tabut.
- source_word: לַאֲרוֹן בְּרִית יְהוָה
  choice: bagi tabut perjanjian Yahweh
  rationale: Menyampaikan rangkaian konstruksi Ibrani secara langsung dan mempertahankan nama ilahi יהוה sebagai ‘Yahweh’.
- source_word: וְלַהֲדֹם רַגְלֵי אֱלֹהֵינוּ
  choice: dan bagi tumpuan kaki Allah kita
  rationale: Mempertahankan penghubung ‘dan’ serta metafora tumpuan kaki tanpa secara tersirat memutuskan apakah frasa ini berfungsi sebagai keterangan tambahan yang sepenuhnya menyamakan tabut dengannya.
- source_word: וַהֲכִינוֹתִי לִבְנוֹת
  choice: Aku pun telah mengadakan persiapan untuk membangunnya
  rationale: Bentuk hiphil dari כון menyatakan tindakan mempersiapkan. Objek ‘-nya’ dipasok secara alami dari rumah yang hendak dibangun.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. ‘Yahweh’ mempertahankan nama perjanjian tersebut tanpa menggantinya dengan gelar.
- issue: Hubungan tabut dengan ‘tumpuan kaki Allah kita’
  choice: Mempertahankan susunan ‘bagi ... dan bagi ...’
  alternative: 'Menjadikan frasa kedua penjelasan eksplisit: ‘tabut ..., yaitu tumpuan kaki Allah kita’'
  rationale: Konstruksi Ibrani memungkinkan hubungan erat atau aposisional, tetapi memakai וְלַ untuk kedua unsur. Terjemahan utama mempertahankan bentuk koordinatif dan membiarkan ketegangan metaforisnya tetap terbuka.
- issue: Sapaan maskulin אַחַי
  choice: saudara-saudaraku
  alternative: saudara-saudariku; kaum kerabatku
  rationale: Bentuk sumber adalah maskulin jamak. Pilihan utama mempertahankan bentuk kekerabatan tersebut, sementara catatan menjelaskan kemungkinan cakupan sapaan publik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat untuk pidato kerajaan. Bentuk ‘Dengarkanlah’ mempertahankan nada seruan resmi, sedangkan struktur kalimat dibuat cukup alami bagi pembaca umum. Semua penanda catatan kaki ditempatkan langsung pada frasa yang dijelaskan.
