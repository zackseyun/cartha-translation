  text: וְ/הָ/אֱלֹהִים֙ אָ֣מַר לִ֔/י לֹא תִבְנֶ֥ה בַ֖יִת לִ/שְׁמִ֑/י כִּ֣י אִ֧ישׁ מִלְחָמ֛וֹת אַ֖תָּה וְ/דָמִ֥ים שָׁפָֽכְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/003.yaml
  text: But God said to me[a], ‘You shall not build a house for my name[b], because you are a man of wars and have shed blood.’
translation:
  language: id
  text: Namun, Allah berfirman kepadaku, “Engkau tidak boleh membangun rumah bagi nama-Ku[a], karena engkau seorang yang banyak berperang[b] dan telah menumpahkan darah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rumah bagi nama-Ku” menunjuk kepada bait sebagai tempat yang dikaitkan dengan nama dan kehadiran Allah.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “seorang laki-laki perang-perang”; ungkapan ini dapat juga diterjemahkan “seorang prajurit” atau “orang yang terlibat dalam banyak peperangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֱלֹהִים
  choice: Namun, Allah
  rationale: Kata penghubung וְ secara harfiah berarti ‘dan’, tetapi di sini menandai pertentangan dengan keinginan Daud untuk membangun; ‘Namun’ menyampaikan hubungan wacana itu secara alami.
- source_word: אָמַר לִי
  choice: berfirman kepadaku
  rationale: Dalam bahasa Indonesia, ‘berfirman’ merupakan padanan yang wajar dan bermartabat untuk perkataan langsung Allah, sedangkan לִי diterjemahkan ‘kepadaku’.
- source_word: לֹא תִבְנֶה
  choice: Engkau tidak boleh membangun
  rationale: Bentuk imperfek dengan לֹא dalam ucapan ilahi menyatakan larangan atau penetapan bahwa Daud tidak diizinkan membangun. ‘Tidak boleh’ paling jelas menyampaikan daya larang dalam bahasa Indonesia tanpa menambahkan alasan yang tidak dinyatakan.
- source_word: בַיִת
  choice: rumah
  rationale: בַיִת secara harfiah berarti ‘rumah’. Konteksnya adalah bait Allah, tetapi mempertahankan ‘rumah’ menjaga ungkapan Ibrani dan tidak menggantinya dengan penafsiran ‘bait’ di dalam teks utama.
- source_word: לִשְׁמִי
  choice: bagi nama-Ku
  rationale: Terjemahan ini mempertahankan ungkapan teologis Ibrani tentang tempat kudus yang dikaitkan dengan nama Allah, tanpa menguraikan maknanya secara berlebihan dalam teks utama.
- source_word: כִּי
  choice: karena
  rationale: כִּי memperkenalkan alasan yang Allah berikan; ‘karena’ menyampaikan hubungan sebab secara jelas dalam bahasa Indonesia modern.
- source_word: אִישׁ מִלְחָמוֹת
  choice: seorang yang banyak berperang
  rationale: Secara harfiah frasa ini adalah ‘seorang laki-laki peperangan-peperangan’. Ungkapan Indonesia ini mempertahankan gagasan jamak tentang keterlibatan berulang dalam perang, tetapi tetap terdengar alami.
- source_word: וְדָמִים שָׁפָכְתָּ
  choice: dan telah menumpahkan darah
  rationale: ‘Menumpahkan darah’ adalah padanan idiomatis bagi דָמִים שָׁפַךְ. Bentuk ‘telah’ menyampaikan tindakan yang sudah dilakukan Daud tanpa menentukan apakah semua pertumpahan darah itu secara moral bersalah.
theological_decisions:
- issue: Alasan Daud tidak diperkenankan membangun rumah bagi nama Allah
  choice: Teks menyatakan bahwa keterlibatan Daud dalam banyak perang dan tindakannya menumpahkan darah menjadi alasan yang Allah berikan.
  alternative: Pertumpahan darah itu secara khusus berarti kekerasan berdosa, atau semata-mata ketidaklayakan seremonial meskipun peperangannya sah.
  rationale: Ayat ini tidak menjelaskan apakah pertumpahan darah tersebut berdosa, menimbulkan kenajisan ritual, atau hanya membuat Daud tidak sesuai dengan peran pembangun rumah Allah. Terjemahan mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan ‘Engkau’ serta bentuk ‘nama-Ku’ dipakai dalam ucapan langsung Allah. Struktur kalimat dibuat alami bagi pembaca umum sambil mempertahankan metafora ‘rumah bagi nama-Ku’ dan kemajemukan gagasan dalam ‘peperangan-peperangan’.
