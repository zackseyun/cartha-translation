base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/007.yaml
  text: And I will establish his kingdom forever[a], if he is strong to do my commandments and my judgments[c][b], as at this day.
translation:
  language: id
  text: Aku akan meneguhkan kerajaannya untuk selama-lamanya[a], jika ia berteguh hati untuk melakukan perintah-perintah-Ku dan ketetapan-ketetapan-Ku, seperti pada hari ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengukuhkan” atau “membuat kokoh” kerajaannya.'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “seperti pada hari ini” berarti seperti yang dilakukannya sekarang.
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲכִינוֹתִי
  choice: Aku akan meneguhkan
  rationale: Bentuk Hifil dari כון menyatakan tindakan membuat sesuatu berdiri kokoh atau teguh. Dalam konteks kerajaan, “meneguhkan” alami dan mempertahankan nuansa pengukuhan.
- source_word: מַלְכוּתוֹ
  choice: kerajaannya
  rationale: מַלְכוּת dapat berarti kerajaan, pemerintahan, atau kedudukan sebagai raja. “Kerajaannya” cukup luas dan sesuai dengan konteks kelangsungan dinasti.
- source_word: עַד לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir; bentuk Indonesia ini jelas, wajar, dan bernada luhur.
- source_word: אִם
  choice: jika
  rationale: Partikel ini secara langsung memperkenalkan syarat dan tidak boleh diperlemah.
- source_word: יֶחֱזַק
  choice: ia berteguh hati
  rationale: חזק di sini menunjuk pada keteguhan atau kebulatan tekad untuk taat, bukan terutama kekuatan jasmani. “Berteguh hati” menyampaikan nuansa itu secara alami.
- source_word: לַעֲשׂוֹת
  choice: untuk melakukan
  rationale: עשה secara harfiah berarti melakukan. Pilihan ini mempertahankan bentuk sumber dan tetap idiomatis dalam bahasa Indonesia.
- source_word: מִצְוֺתַי
  choice: perintah-perintah-Ku
  rationale: מִצְוָה adalah perintah yang mengikat; pengulangan jamak dipertahankan untuk mencerminkan bentuk Ibrani.
- source_word: וּמִשְׁפָּטַי
  choice: dan ketetapan-ketetapan-Ku
  rationale: מִשְׁפָּטִים dalam konteks hukum ilahi dapat berarti keputusan hukum atau ketetapan. “Ketetapan-ketetapan” menjaga corak legal tanpa memberi kesan bahwa yang dimaksud hanya putusan pengadilan.
- source_word: כַּיּוֹם הַזֶּה
  choice: seperti pada hari ini
  rationale: Terjemahan ini dekat dengan idiom Ibrani dan mempertahankan rujukan pada keadaan atau tindakan Salomo saat itu.
theological_decisions:
- issue: Syarat dalam janji mengenai kerajaan Salomo
  choice: 'Janji diteguhkan dengan syarat yang eksplisit: “jika ia berteguh hati”.'
  alternative: Menyajikan ketaatan Salomo hanya sebagai gambaran watak atau keadaan, bukan sebagai syarat.
  rationale: Partikel אִם secara terang memperkenalkan kondisi. Terjemahan mempertahankan ketegangan antara janji kerajaan dan tuntutan ketaatan, tanpa menyelaraskannya secara tersirat dengan bagian lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan ilahi memakai “Aku” serta akhiran “-Ku”. Susunan dibuat alami tanpa menghilangkan syarat eksplisit, idiom waktu Ibrani, atau nuansa hukum dari pasangan “perintah-perintah” dan “ketetapan-ketetapan”.
