base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/019.yaml
  text: All this he made clear to me in writing from the hand of Yahweh[b][a], all the works of the pattern.
translation:
  language: id
  text: 'Semua ini—dalam tulisan, dari tangan Yahweh yang ada atasku—Ia membuatku memahami: seluruh pekerjaan menurut rancangan itu.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Semua ini tertulis; tangan Yahweh ada atasku, dan Ia membuatku memahami seluruh pekerjaan menurut rancangan itu.”'
    reason: alternative_reading
  - marker: b
    text: “Rancangan” juga dapat diterjemahkan “pola” atau “desain”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: Semua ini
  rationale: Konteks menunjukkan bahwa Daud merujuk pada keseluruhan petunjuk mengenai rumah Allah yang baru saja diuraikan; bentuk ini mempertahankan cakupan כֹּל secara alami.
- source_word: בִּכְתָב
  choice: melalui tulisan
  rationale: Ungkapan ini menunjukkan bahwa penyataan tersebut diberikan dalam bentuk tertulis, bukan hanya secara lisan.
- source_word: מִיַּד יְהוָה
  choice: yang berasal dari tangan Yahweh
  rationale: Metafora Ibrani tentang 'tangan' dipertahankan untuk menyatakan asal dan tindakan langsung Allah, sementara susunannya dibuat wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh sesuai kebijakan proyek.
- source_word: עָלַי הִשְׂכִּיל
  choice: Ia buat kupahami
  rationale: Bentuk kausatif הִשְׂכִּיל menyatakan bahwa Yahweh memberi Daud pengertian. Unsur עָלַי tercermin dalam penerima orang pertama, sedangkan kemungkinan konstruksi yang lebih harfiah dipertahankan dalam catatan kaki.
- source_word: כֹּל מַלְאֲכוֹת
  choice: seluruh pekerjaan
  rationale: מַלְאֲכוֹת mencakup segala pekerjaan, bagian pengerjaan, atau tugas yang diperlukan untuk melaksanakan rancangan tersebut.
- source_word: הַתַּבְנִית
  choice: rancangan itu
  rationale: Dalam konteks pembangunan, תַּבְנִית menunjuk pada pola, bentuk acuan, atau rancangan yang menjadi pedoman pekerjaan.
theological_decisions:
- issue: Cara memahami klausa ringkas עָלַי הִשְׂכִּיל
  choice: Yahweh dipahami sebagai subjek tersirat yang membuat Daud memahami isi tulisan itu.
  alternative: “Tangan Yahweh ada atasku, dan Ia membuatku memahami seluruh pekerjaan menurut rancangan itu.”
  rationale: Bahasa Ibrani sangat padat dan memungkinkan עָלַי dihubungkan secara lebih langsung dengan 'tangan Yahweh'. Teks utama menyampaikan tindakan ilahi secara wajar tanpa meniadakan konstruksi alternatif, yang dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan utama dibuat mudah dipahami, sementara kepadatan sintaksis Ibrani dan alternatif pengaitan frasa 'atas aku' dijaga melalui catatan kaki.
