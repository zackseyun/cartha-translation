  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם דָּוִיד֙ בַּ/אֲרַ֣ם דַּרְמֶ֔שֶׂק וַ/יְהִ֤י אֲרָם֙ לְ/דָוִ֔יד עֲבָדִ֖ים נֹשְׂאֵ֣י מִנְחָ֑ה וַ/יּ֤וֹשַׁע יְהוָה֙ לְ/דָוִ֔יד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and the Arameans became David’s servants, bringing tribute[c][b]. And Yahweh gave victory to David wherever he went.
translation:
  language: id
  text: Daud menempatkan garnisun-garnisun di Aram-Damaskus[a]. Orang Aram pun menjadi hamba Daud dan membawa upeti[b]. Yahweh memberi Daud kemenangan ke mana pun ia pergi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Daud menempatkan di Aram-Damaskus.” Objek “garnisun-garnisun” dipahami dari konteks militer; dapat juga diterjemahkan “menempatkan pasukan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “Aram”; secara tradisional juga diterjemahkan “Siria” atau “orang Siria.”'
    reason: alternative_reading
  - marker: c
    text: Atau “Yahweh menyelamatkan Daud” atau “melepaskan Daud.” Dalam konteks peperangan ini, ungkapan tersebut berarti bahwa Yahweh memberinya kemenangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: menempatkan garnisun-garnisun
  rationale: Kata kerja שׂוּם secara harfiah berarti ‘menaruh/menempatkan’ dan tidak menyebut objek. Dalam konteks militer ini, objek berupa garnisun dipahami dari konteks dan didukung oleh kisah paralel; catatan kaki mempertahankan transparansi terhadap bentuk Ibrani.
- source_word: בַּאֲרָם דַּרְמֶשֶׂק
  choice: di Aram-Damaskus
  rationale: Gabungan nama ini dipertahankan agar sebutan wilayah/pemerintahan Aram yang berpusat di Damaskus tidak disederhanakan menjadi ‘Damaskus’ saja.
- source_word: אֲרָם
  choice: orang Aram
  rationale: Dalam klausa ini nama tersebut menunjuk kepada rakyat Aram. ‘Orang Aram’ mencerminkan etnonim Ibrani secara langsung dan lebih tepat secara historis daripada sebutan tradisional ‘orang Siria’.
- source_word: עֲבָדִים
  choice: hamba
  rationale: Dalam konteks politik, kata ini menyatakan ketundukan sebagai pihak taklukan atau bawahan. ‘Hamba’ mempertahankan bentuk leksikal tanpa mempersempit maknanya menjadi perbudakan perseorangan.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: membawa upeti
  rationale: Partisipel ini menggambarkan tindakan berkelanjutan menyerahkan persembahan kepada penguasa. Dalam konteks penaklukan, מִנְחָה paling tepat dipahami sebagai ‘upeti’, bukan sekadar ‘pemberian’.
- source_word: וַיּוֹשַׁע
  choice: memberi ... kemenangan
  rationale: Bentuk kausatif dari יָשַׁע secara dasar berarti menyelamatkan atau melepaskan. Dalam narasi peperangan, ungkapan ‘memberi kemenangan’ menyampaikan daya maknanya secara alami, sementara alternatif harfiahnya dicatat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks adalah Tetragramaton, sehingga ditransliterasikan sebagai nama diri ‘Yahweh’, bukan diganti dengan sebuah gelar.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: ke mana pun ia pergi
  rationale: Ungkapan Ibrani ini menyatakan cakupan menyeluruh dari perjalanan atau gerakan Daud. Terjemahan ini alami dalam bahasa Indonesia dan tidak membatasi acuannya hanya pada gerak maju militer.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama diri ilahi secara langsung. Bentuk ‘Yahweh’ mempertahankan fungsi nama itu dan menghindari penggantiannya dengan gelar.
- issue: Makna penyelamatan dalam konteks peperangan
  choice: Yahweh memberi Daud kemenangan
  alternative: Yahweh menyelamatkan atau melepaskan Daud
  rationale: Bentuk וַיּוֹשַׁע berasal dari akar ‘menyelamatkan/melepaskan’, tetapi dalam rangkaian kemenangan militer maknanya secara kontekstual ialah pemberian keberhasilan dalam perang. Catatan kaki menjaga nuansa dasar kata tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah historis ‘Aram-Damaskus’, ‘orang Aram’, ‘garnisun’, dan ‘upeti’ dipilih karena jelas bagi pembaca umum sekaligus cukup presisi. Susunan kalimat dipecah menjadi tiga kalimat pendek agar alurnya alami tanpa mengubah hubungan antarklausa.
