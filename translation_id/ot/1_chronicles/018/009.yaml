base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/009.yaml
  text: When Tou king of Hamath heard that David had struck down all the army of Hadadezer king of Zobah,[a]
translation:
  language: id
  text: Ketika Tou[a], raja Hamat, mendengar bahwa Daud telah mengalahkan seluruh pasukan Hadadezer, raja Zoba,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Ibrani: “Tou”; kisah sejajarnya dalam 2 Samuel 8:9 memakai nama “Toi”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Ketika ... mendengar
  rationale: Bentuk wayyiqtol melanjutkan alur narasi, tetapi ayat ini berfungsi sebagai anak kalimat waktu yang mengantar tindakan pada ayat berikutnya; bentuk ini alami dalam bahasa Indonesia.
- source_word: תֹּעוּ
  choice: Tou
  rationale: Nama pribadi ditransliterasikan menurut bentuk teks Tawarikh. Bentuk paralelnya dalam 2 Samuel 8:9 ialah Toi dan dicatat dalam catatan kaki.
- source_word: מֶלֶךְ חֲמָת
  choice: raja Hamat
  rationale: Rangkaian konstruksi ini secara langsung menyatakan jabatan dan wilayah kekuasaan Tou.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi berita yang didengar Tou.
- source_word: הִכָּה
  choice: telah mengalahkan
  rationale: Dalam konteks peperangan, נכה dapat berarti memukul atau menaklukkan. 'Mengalahkan' menyampaikan hasil tindakan militer secara alami tanpa memastikan bahwa setiap prajurit dibunuh.
- source_word: כָּל
  choice: seluruh
  rationale: Kuantor dalam teks sumber dipertahankan dan secara idiomatis menerangkan 'pasukan'.
- source_word: חֵיל
  choice: pasukan
  rationale: Dalam konteks militer, חֵיל menunjuk kepada kekuatan bersenjata; 'pasukan' jelas dan alami dalam bahasa Indonesia modern.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezer
  rationale: Nama pribadi ditransliterasikan dari bentuk yang terdapat dalam teks WLC ayat ini.
- source_word: מֶלֶךְ צוֹבָה
  choice: raja Zoba
  rationale: Rangkaian gelar dan nama tempat diterjemahkan langsung, dengan nama tempat ditransliterasikan secara wajar ke bahasa Indonesia.
