source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח אֶת הֲדֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִיד ל/שאול ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עוּ הָיָ֣ה הֲדַדְעָ֑זֶר וְ/כֹ֗ל כְּלֵ֛י זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/010.yaml
  text: So he sent Hadoram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Tou[d][c][b]; and he sent all kinds of articles of gold and silver and bronze.
translation:
  language: id
  text: Lalu Tou mengutus Hadoram, anaknya, kepada Raja Daud untuk menanyakan kabarnya dan memberkatinya[a], karena Daud telah berperang melawan Hadadezer dan mengalahkannya, sebab Hadadezer telah berperang melawan Tou. Tou juga mengirim segala macam barang dari emas, perak, dan perunggu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks diplomatik ini, “memberkatinya” juga dapat berarti “mengucapkan selamat kepadanya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, teks Ibrani hanya berbunyi, “dan segala barang dari emas, perak, dan perunggu”; kata “mengirim” dipasok dari konteks, dengan Tou sebagai subjeknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Lalu Tou mengutus
  rationale: Bentuk naratif menyatakan peristiwa berikutnya. Subjek Tou dipulihkan dari konteks ayat sebelumnya agar jelas dalam bahasa Indonesia.
- source_word: הֲדוֹרָם בְּנוֹ
  choice: Hadoram, anaknya
  rationale: Nama diri ditransliterasikan, dan hubungan anak dipertahankan secara eksplisit.
- source_word: לִשְׁאוֹל לוֹ לְשָׁלוֹם
  choice: untuk menanyakan kabarnya
  rationale: Ungkapan Ibrani secara harfiah berbicara tentang menanyakan kesejahteraan; 'menanyakan kabarnya' merupakan ungkapan Indonesia yang alami dan tetap menyampaikan perhatian pada keadaan Daud.
- source_word: וּלְבָרֲכוֹ
  choice: dan memberkatinya
  rationale: Mempertahankan arti dasar ברך, sekaligus memberi catatan bahwa dalam konteks diplomatik maknanya dapat mencakup ucapan selamat.
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: karena Daud telah berperang melawan Hadadezer dan mengalahkannya
  rationale: Nama Daud dipakai sebagai pengganti pronomina agar rujukannya tidak rancu. נכה dalam konteks perang menyatakan kemenangan militer tanpa harus berarti Hadadezer dibunuh.
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעוּ הָיָה הֲדַדְעָזֶר
  choice: Sebab Hadadezer sering berperang melawan Tou
  rationale: Ungkapan harfiah 'seorang laki-laki peperangan-peperangan dengan Tou' dinaturalkan. Bentuk jamak mendukung gagasan permusuhan atau peperangan yang berulang.
- source_word: וְכֹל כְּלֵי זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: Hadoram juga membawa berbagai barang dari emas, perak, dan perunggu
  rationale: Teks Ibrani tidak menyatakan verba pada klausa terakhir; 'membawa' dipasok dari konteks pengutusan. כְּלֵי diterjemahkan umum sebagai 'barang', dan נְחֹשֶׁת sebagai 'perunggu' sesuai konteks logam kuno.
