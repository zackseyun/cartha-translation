source:
  edition: WLC
  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יַּ֥ךְ דָּוִ֛יד אֶת פְּלִשְׁתִּ֖ים וַ/יַּכְנִיעֵ֑/ם וַ/יִּקַּ֛ח אֶת גַּ֥ת וּ/בְנֹתֶ֖י/הָ מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/001.yaml
  text: After this[a], David struck the Philistines and subdued them, and he took Gath and its surrounding towns from the hand of the Philistines.
translation:
  language: id
  text: Sesudah itu, Daud menggempur orang Filistin dan menundukkan mereka. Ia merebut Gat beserta kota-kota di sekitarnya[a] dari tangan orang Filistin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak perempuannya,” yaitu ungkapan untuk kota-kota kecil atau desa-desa yang bergantung pada Gat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Ungkapan peralihan naratif ini menunjukkan urutan waktu. “Sesudah itu” alami dalam bahasa Indonesia modern tanpa menerjemahkan secara kaku unsur “dan terjadilah”.
- source_word: וַיַּךְ
  choice: menggempur
  rationale: Dalam konteks militer, נכה menyatakan tindakan memukul atau menyerang dengan keras. “Menggempur” mempertahankan daya konkret verba itu, sedangkan verba berikutnya menyatakan hasil berupa penundukan.
- source_word: פְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Bentuk baku dan mudah dipahami untuk menyebut kelompok bangsa tersebut.
- source_word: וַיַּכְנִיעֵם
  choice: menundukkan mereka
  rationale: Bentuk Hifil dari כנע menyatakan tindakan membuat pihak lain tunduk. Pilihan ini mempertahankan nuansa militer dan politik tanpa menambahkan tafsiran.
- source_word: וַיִּקַּח
  choice: Ia merebut
  rationale: לקח secara dasar berarti “mengambil”, tetapi dalam konteks penguasaan kota, “merebut” menyampaikan tindakan pengambilalihan secara jelas dan alami.
- source_word: גַּת
  choice: Gat
  rationale: Transliterasi nama kota yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וּבְנֹתֶיהָ
  choice: beserta kota-kota di sekitarnya[a]
  rationale: Secara harfiah berarti “dan anak-anak perempuannya”, sebuah idiom bagi permukiman lebih kecil yang bergantung pada kota utama. Terjemahan utama menyampaikan maknanya secara alami, sedangkan gambaran harfiahnya dicatat dalam catatan kaki.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Ungkapan Ibrani ini menggambarkan pelepasan dari penguasaan atau kepemilikan. “Dari tangan” tetap dapat dipahami dalam bahasa Indonesia dan mempertahankan citra sumber.
