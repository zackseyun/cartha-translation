base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/002.yaml
  text: And he struck Moab[a], and the Moabites became servants to David, bringing tribute.
translation:
  language: id
  text: Ia memukul Moab, dan orang Moab menjadi hamba Daud dengan membawa upeti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “hamba” juga dapat berarti “pelayan” atau “budak”. Kata yang diterjemahkan “upeti” juga dapat berarti “pemberian” atau “persembahan”. Dalam konteks penaklukan ini, kedua kata itu menunjukkan ketundukan kepada Daud dan pemberian kepada penguasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: mengalahkan
  rationale: Dalam kisah peperangan, bentuk dari נכה menyatakan tindakan memukul atau menyerang yang berujung pada penundukan. “Mengalahkan” merupakan ungkapan Indonesia yang alami tanpa merinci cara atau luasnya kemenangan.
- source_word: אֶת
  choice: '[tidak diterjemahkan tersendiri]'
  rationale: Penanda objek langsung dalam bahasa Ibrani ini tidak mempunyai padanan tersendiri dalam bahasa Indonesia.
- source_word: מוֹאָב
  choice: Moab / orang Moab
  rationale: Kemunculan pertama menunjuk negeri atau bangsa sebagai objek tindakan militer; kemunculan kedua secara idiomatis diterjemahkan “orang Moab” karena merekalah yang menjadi hamba dan membawa upeti.
- source_word: וַיִּהְיוּ
  choice: menjadi
  rationale: Dalam urutan narasi ini, היה dengan predikat menyatakan perubahan keadaan sesudah tindakan militer, bukan sekadar keadaan statis.
- source_word: עֲבָדִים
  choice: hamba
  rationale: “Hamba” mempertahankan cakupan makna עבד yang dapat menunjuk pelayan maupun orang yang ditundukkan. Dalam konteks ini, kata tersebut menyatakan ketergantungan dan ketundukan politik yang dipaksakan tanpa menentukan secara berlebihan bentuk hukumnya.
- source_word: לְדָוִיד
  choice: Daud
  rationale: Relasi yang ditandai ל dinyatakan secara alami dalam frasa Indonesia “hamba Daud”.
- source_word: נֹשְׂאֵי
  choice: membawa
  rationale: Partisipel dari נשׂא secara harfiah berarti membawa atau memikul; “membawa” cocok untuk tindakan menyerahkan pembayaran kepada penguasa.
- source_word: מִנְחָה
  choice: upeti
  rationale: Dalam konteks militer-politik, מִנְחָה adalah pemberian wajib dari bangsa taklukan, sehingga “upeti” lebih tepat daripada “persembahan” atau “hadiah”.
theological_decisions:
- issue: Sifat ketundukan orang Moab kepada Daud
  choice: hamba Daud
  alternative: budak Daud / pelayan Daud / taklukan Daud
  rationale: Teks menyatakan ketundukan dengan עֲבָדִים tetapi tidak menjelaskan status hukum setiap orang Moab. “Hamba” menjaga ketegangan antara pelayanan, perbudakan, dan ketundukan politik tanpa melunakkan atau mempersempitnya.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada naratif. “Hamba” dipilih sebagai istilah bermartabat yang masih mempertahankan keluasan makna sumber; “upeti” menjelaskan konteks politik secara alami.
