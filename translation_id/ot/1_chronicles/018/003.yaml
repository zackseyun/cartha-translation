  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa dipertahankan cukup dekat dengan teks Ibrani agar rujukan “ia” tidak diselesaikan secara sepihak. Nama tempat memakai bentuk Indonesia yang lazim: Zoba, Hamat, dan Sungai Efrat.'
