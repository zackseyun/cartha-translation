  text: וַ/יַּ֥ךְ דָּוִ֛יד אֶת הֲדַדְעֶ֥זֶר מֶֽלֶךְ צוֹבָ֖ה חֲמָ֑תָ/ה בְּ/לֶכְתּ֕/וֹ לְ/הַצִּ֥יב יָד֖/וֹ בִּֽ/נְהַר פְּרָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/003.yaml
  text: David struck Hadadezer king of Zobah[b][a], as he went to establish his power at the Euphrates River.
translation:
  language: id
  text: Daud menyerang Hadadezer, raja Zoba,[a] ke arah Hamat,[b] ketika ia pergi untuk menegakkan kekuasaannya di Sungai Efrat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini dieja “Hadadezer” di sini; nas paralel dalam 2 Samuel 8:3 memiliki bentuk lain yang sering ditulis “Hadarezer”.
    reason: textual_variant
  - marker: b
    text: Atau “menuju Hamat”; bentuk nama tempat dalam bahasa Ibrani menunjukkan arah menuju Hamat.
    reason: lexical_alternative
  - marker: c
    text: Atau “memulihkan kekuasaannya”; secara lebih harfiah, “menegakkan tangannya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: menyerang
  rationale: Kata kerja נכה secara konkret berarti memukul atau menghantam. Dalam konteks perang, “menyerang” terdengar alami dalam bahasa Indonesia dan tidak secara berlebihan menyatakan bahwa lawan dikalahkan sepenuhnya.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezer
  rationale: Nama ini ditransliterasikan menurut ejaan teks Tawarikh, yang memuat unsur Hadad.
- source_word: מֶלֶךְ צוֹבָה
  choice: raja Zoba
  rationale: Rangkaian konstruksi Ibrani ini secara langsung menyatakan jabatan dan wilayah kerajaan Hadadezer.
- source_word: חֲמָתָה
  choice: ke arah Hamat
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak menuju Hamat. Terjemahan ini mempertahankan nuansa arah tanpa memaksanya menjadi lokasi statis.
- source_word: בְּלֶכְתּוֹ
  choice: ketika ia pergi
  rationale: Infinitif dengan awalan בְּ menyatakan keadaan waktu. Pronomina “ia” juga mempertahankan kemungkinan rujukan yang tidak dijelaskan secara eksplisit dalam teks Ibrani.
- source_word: לְהַצִּיב יָדוֹ
  choice: untuk menegakkan kekuasaannya
  rationale: Ungkapan harfiah “menegakkan tangannya” dalam konteks politik-militer menunjuk pada penegakan atau pemulihan kuasa. Pilihan ini menyampaikan maknanya secara wajar.
- source_word: בִּנְהַר פְּרָת
  choice: di Sungai Efrat
  rationale: נְהַר פְּרָת secara eksplisit menyebut Sungai Efrat; “di” sesuai dengan konteks wilayah tempat kuasa hendak ditegakkan.
