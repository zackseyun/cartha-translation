base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/008.yaml
  text: And from Tibhath and from Cun, cities of Hadadezer, David took a very great amount of bronze; with it Solomon made the bronze sea, the pillars, and the bronze articles.
translation:
  language: id
  text: Dari Tibhat dan Kun, kota-kota Hadadezer, Daud mengambil perunggu dalam jumlah yang sangat besar. Dengan perunggu itu Salomo membuat Laut Perunggu, tiang-tiang, dan perkakas perunggu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks benda logam kuno dan perlengkapan Bait Allah, istilah ini paling tepat dipahami sebagai perunggu, bukan tembaga murni.
- source_word: יָם הַנְּחֹשֶׁת
  choice: Laut Perunggu
  rationale: Mempertahankan sebutan khas harfiah bagi bejana besar di Bait Allah; huruf kapital membantu menunjukkan bahwa ini nama perlengkapan tertentu.
- source_word: כְּלֵי הַנְּחֹשֶׁת
  choice: berbagai perkakas perunggu
  rationale: כְּלִי dapat berarti perkakas, peralatan, atau wadah; 'berbagai perkakas' alami dalam bahasa Indonesia dan tetap cukup luas.
- source_word: בָּהּ
  choice: dari perunggu itulah
  rationale: Pronomina feminin tunggal merujuk pada נְחֹשֶׁת; ungkapan ini menyampaikan bahwa bahan tersebut dipakai Salomo sekaligus memberi penekanan yang alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama diri ditransliterasikan sebagai Tibhat, Kun, dan Hadadezer. Kalimat Ibrani yang panjang dibagi menjadi dua kalimat agar mudah dipahami tanpa mengubah hubungan maknanya.
