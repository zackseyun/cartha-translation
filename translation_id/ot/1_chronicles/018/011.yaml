id: 1CH.18.11
reference: 1 Chronicles 18:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: גַּם אֹתָ֗/ם הִקְדִּ֞ישׁ הַ/מֶּ֤לֶךְ דָּוִיד֙ לַ/יהוָ֔ה עִם הַ/כֶּ֨סֶף֙ וְ/הַ/זָּהָ֔ב אֲשֶׁ֥ר נָשָׂ֖א מִ/כָּל הַ/גּוֹיִ֑ם מֵֽ/אֱד֤וֹם וּ/מִ/מּוֹאָב֙ וּ/מִ/בְּנֵ֣י עַמּ֔וֹן וּ/מִ/פְּלִשְׁתִּ֖ים וּ/מֵֽ/עֲמָלֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/011.yaml
  text: 'King David also dedicated these to Yahweh[a], along with the silver and the gold that he had taken from all the nations: from Edom, Moab, the Ammonites, the Philistines[c][b], and Amalek.'
translation:
  language: id
  text: 'Raja Daud juga mengkhususkan benda-benda itu bagi Yahweh, bersama dengan perak dan emas yang telah diambilnya[b] dari semua bangsa: dari Edom, Moab, orang Amon[a], orang Filistin, dan Amalek.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Amon”, yaitu orang Amon.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “diambilnya” juga dapat berarti “dibawanya” atau “diambilnya sebagai rampasan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֹתָם
  choice: juga ... semuanya itu
  rationale: Menandai kelanjutan dari ayat sebelumnya dan mempertahankan rujukan pronomina jamak kepada barang-barang perunggu yang disebut di sana.
- source_word: הִקְדִּישׁ
  choice: mengkhususkan
  rationale: Menyampaikan tindakan memisahkan sesuatu secara khusus bagi Allah dalam konteks persembahan, tanpa harus menyiratkan ritual tertentu.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Mempertahankan nama ilahi יהוה secara langsung; preposisi ל menyatakan bahwa barang-barang itu diperuntukkan bagi Yahweh.
- source_word: עִם הַכֶּסֶף וְהַזָּהָב
  choice: bersama dengan perak dan emas
  rationale: Ungkapan alami dalam bahasa Indonesia yang tetap menunjukkan bahwa semua barang tersebut dikhususkan bersama-sama.
- source_word: אֲשֶׁר נָשָׂא
  choice: yang telah dibawanya
  rationale: Mempertahankan arti dasar נשׂא, 'mengangkat/membawa', sambil membiarkan konteks militer menunjukkan bahwa benda-benda itu diperoleh dari bangsa-bangsa tersebut.
- source_word: מִכָּל הַגּוֹיִם
  choice: dari segala bangsa
  rationale: Padanan wajar bagi ungkapan distributif Ibrani dalam konteks bangsa-bangsa asing di sekitar Israel.
- source_word: מִבְּנֵי עַמּוֹן
  choice: bani Amon
  rationale: Padanan Indonesia yang ringkas dan dikenal untuk ungkapan harfiah 'anak-anak Amon', yakni orang Amon.
- source_word: מִפְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Etnonim bahasa Indonesia yang lazim untuk kelompok bangsa tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memuat nama perjanjian יהוה; transliterasi 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Nuansa הִקְדִּישׁ dalam konteks barang rampasan atau upeti
  choice: mengkhususkan ... bagi Yahweh
  alternative: menguduskan bagi Yahweh
  rationale: '''Mengkhususkan'' menyatakan penetapan barang-barang itu bagi Yahweh, sedangkan ''menguduskan'' dalam pemakaian modern dapat terbaca sebagai perubahan moral atau pelaksanaan ritus tertentu yang tidak dinyatakan ayat ini.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dipertahankan, sedangkan istilah 'bani Amon' diberi penjelasan agar mudah dipahami. Penanda catatan kaki [a] dan [b] ditempatkan langsung pada unsur yang dijelaskan.
