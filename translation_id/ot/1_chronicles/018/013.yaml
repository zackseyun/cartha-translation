  text: וַ/יָּ֤שֶׂם בֶּֽ/אֱדוֹם֙ נְצִיבִ֔ים וַ/יִּהְי֥וּ כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑יד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔יד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/013.yaml
  text: He placed garrisons in Edom, and all Edom became servants to David. And the LORD gave David victory wherever he went.
translation:
  language: id
  text: Ia menempatkan garnisun-garnisun di Edom, dan seluruh Edom menjadi hamba Daud. TUHAN memberi Daud kemenangan ke mana pun ia pergi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְצִיבִים
  choice: pasukan-pasukan penjaga
  rationale: Bentuk jamak ini dalam konteks pendudukan militer paling wajar menunjuk pada garnisun atau pasukan yang ditempatkan; ungkapan ini lebih mudah dipahami pembaca umum daripada serapan “garnisun”.
- source_word: עֲבָדִים
  choice: hamba
  rationale: Kata ini dapat berarti hamba, pelayan, atau pihak taklukan. “Hamba” mempertahankan cakupan dan ketegangan istilah Ibrani tanpa secara khusus menyatakan bentuk perbudakan tertentu.
- source_word: וַיּוֹשַׁע
  choice: memberi ... kemenangan
  rationale: Secara harfiah berarti “menyelamatkan”; dalam konteks peperangan, tindakan penyelamatan ilahi itu secara alami dinyatakan sebagai pemberian kemenangan.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk menandai nama ilahi YHWH dengan huruf kapital.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: ke mana pun ia pergi
  rationale: Menyampaikan idiom Ibrani secara alami dan tepat dalam bahasa Indonesia.
theological_decisions:
- issue: Pelaku yang memberi kemenangan
  choice: TUHAN secara eksplisit disebut sebagai pemberi kemenangan Daud
  alternative: Daud menang ke mana pun ia pergi
  rationale: Teks Ibrani menempatkan יְהוָה sebagai subjek וַיּוֹשַׁע, sehingga peran ilahi tidak boleh dihilangkan.
- issue: Status seluruh Edom terhadap Daud
  choice: menjadi hamba Daud
  alternative: menjadi budak Daud / takluk kepada Daud
  rationale: “Hamba” mempertahankan ambiguitas עֲבָדִים antara perhambaan dan ketundukan politik, tanpa mempersempitnya menjadi kategori sosial tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “ia” dipakai untuk Daud, sedangkan nama ilahi ditulis “TUHAN” menurut konvensi umum. Tidak diperlukan catatan kaki karena ambiguitas utama dapat dipertahankan dalam teks utama.
