  register: 'Bahasa Indonesia baku, modern, dan bermartabat. ''Lalu ... tetapi ...'' menyajikan urutan serta pembalikan dalam adegan pertempuran secara alami. Nama-nama tempat memakai bentuk Indonesia yang lazim: Damsyik dan Zoba.'
