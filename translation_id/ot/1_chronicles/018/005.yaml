base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: id
  text: Lalu orang Aram dari Damsyik[b] datang untuk membantu Hadadezer[a], raja Zoba, dan Daud mengalahkan dua puluh dua ribu orang Aram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini dieja “Hadadezer” di sini; beberapa bagian sejajar memakai bentuk “Hadarezer”.
    reason: alternative_reading
  - marker: b
    text: Atau, “Aram dari Damsyik”; secara tradisional, “orang Siria dari Damsyik”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרַם דַּרְמֶשֶׂק
  choice: orang Aram dari Damsyik
  rationale: אֲרַם dapat menunjuk kepada negeri Aram atau orang Aram. Dalam konteks pasukan yang datang membantu, bentuk personal jamak paling alami dalam bahasa Indonesia; nama Aram dipertahankan agar tidak memasukkan istilah geopolitik yang lebih kemudian, yaitu Siria.
- source_word: לַעְזוֹר
  choice: untuk membantu
  rationale: Infinitif עזר secara langsung berarti membantu atau menolong; 'membantu' alami dan tepat dalam konteks bantuan militer.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezer
  rationale: Bentuk nama dalam ayat ini adalah הֲדַדְעֶזֶר, yang sesuai ditransliterasikan sebagai 'Hadadezer'; ejaan lain dalam bagian-bagian sejajar dicatat dalam catatan kaki.
- source_word: מֶלֶךְ צוֹבָה
  choice: raja Zoba
  rationale: Konstruksi genitif Ibrani diterjemahkan secara langsung dan alami sebagai gelar kerajaan yang diikuti nama tempat.
- source_word: וַיַּךְ
  choice: menewaskan
  rationale: Dalam konteks pertempuran, נכה dapat berarti memukul, mengalahkan, atau membunuh. Karena ayat menyebut jumlah orang yang terkena tindakan itu, 'menewaskan' menyampaikan hasil mematikan yang lazim tersirat dalam penghitungan korban, tanpa menambahkan istilah seperti 'prajurit' yang tidak tertulis.
- source_word: בַּאֲרָם
  choice: orang Aram
  rationale: Preposisi ב dengan sebutan etnogeografis ini secara idiomatis mengacu kepada pihak Aram yang menjadi sasaran; 'orang Aram' jelas dan alami dalam bahasa Indonesia.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: dua puluh dua ribu orang
  rationale: Terjemahan ini mempertahankan jumlah dan kata umum אִישׁ tanpa mempersempitnya menjadi 'prajurit' atau 'pasukan'.
