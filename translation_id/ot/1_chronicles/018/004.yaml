  text: וַ/יִּלְכֹּד֩ דָּוִ֨יד מִמֶּ֜/נּוּ אֶ֣לֶף רֶ֗כֶב וְ/שִׁבְעַ֤ת אֲלָפִים֙ פָּֽרָשִׁ֔ים וְ/עֶשְׂרִ֥ים אֶ֖לֶף אִ֣ישׁ רַגְלִ֑י וַ/יְעַקֵּ֤ר דָּוִיד֙ אֶת כָּל הָ/רֶ֔כֶב וַ/יּוֹתֵ֥ר מִמֶּ֖/נּוּ מֵ֥אָה רָֽכֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/004.yaml
  text: David captured from him 1,000 chariots, 7,000 horsemen, and 20,000 foot soldiers. Then David hamstrung all the chariot horses, but left from them enough for 100 chariots.
translation:
  language: id
  text: Daud merebut darinya 1.000 kereta perang, 7.000 pasukan berkuda,[a] dan 20.000 prajurit infanteri. Kemudian Daud memotong urat kaki semua kuda penarik kereta perang,[b] tetapi menyisakan sejumlah kuda yang cukup untuk 100 kereta perang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam 2 Samuel 8:4 tertulis “1.700 pasukan berkuda,” bukan “7.000 pasukan berkuda.” Ini merupakan perbedaan angka dalam tradisi teks pada bagian-bagian yang sejajar.
    reason: textual_variant
  - marker: b
    text: Secara harfiah, “semua kereta/pasukan kereta.” Karena kata kerja ini berarti melumpuhkan dengan memotong urat kaki, ungkapan tersebut dipahami secara metonimis sebagai kuda-kuda milik pasukan kereta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: merebut
  rationale: Dalam konteks perang, לכד berarti menangkap atau merebut. Karena objeknya mencakup kereta dan pasukan, 'merebut' paling alami dalam bahasa Indonesia.
- source_word: מִמֶּנּוּ
  choice: darinya
  rationale: Akhiran tunggal merujuk kembali kepada Hadadezer dalam konteks sebelumnya; bentuk tunggal dipertahankan.
- source_word: אֶלֶף רֶכֶב
  choice: 1.000 kereta perang
  rationale: רכב dapat menunjuk pada pasukan kereta secara kolektif, tetapi bersama bilangan paling wajar diterjemahkan sebagai kereta perang yang dapat dihitung.
- source_word: פָּרָשִׁים
  choice: pasukan berkuda
  rationale: Istilah ini menunjuk pada para prajurit berkuda; pilihan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: אִישׁ רַגְלִי
  choice: prajurit berjalan kaki
  rationale: Secara harfiah berarti orang yang berjalan kaki dan dalam konteks militer menunjuk pada prajurit infanteri; ungkapan ini mempertahankan gambaran konkret teks.
- source_word: וַיְעַקֵּר
  choice: melumpuhkan
  rationale: עקר dalam konteks ini berarti membuat kuda tidak dapat digunakan, khususnya dengan memotong urat kakinya. 'Melumpuhkan' menyampaikan hasil tindakan secara alami tanpa memasukkan rincian yang hanya tersirat.
- source_word: אֶת כָּל הָרֶכֶב
  choice: semua kuda penarik kereta perang
  rationale: Secara bentuk tertulis 'seluruh kereta/pasukan kereta', tetapi verba 'melumpuhkan dengan memotong urat kaki' berlaku pada kudanya. Referen metonimis diperjelas dalam teks.
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: tetapi menyisakan sejumlah kuda yang cukup untuk 100 kereta perang
  rationale: Klausa ini menyatakan bahwa sebagian dari tenaga kereta tidak dilumpuhkan, yakni sebanyak yang diperlukan untuk seratus kereta; subjek tersirat dijelaskan agar selaras dengan tindakan terhadap kuda.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Angka ditulis dengan numeralia agar daftar militer mudah dibaca. 'Pasukan berkuda' dipilih daripada istilah yang lebih teknis, sedangkan makna metonimis mengenai kuda dijelaskan dalam teks dan catatan kaki.
