  text: וְ/צָד֧וֹק בֶּן אֲחִיט֛וּב וַ/אֲבִימֶ֥לֶךְ בֶּן אֶבְיָתָ֖ר כֹּהֲנִ֑ים וְ/שַׁוְשָׁ֖א סוֹפֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/016.yaml
  text: Zadok son of Ahitub and Abimelech son of Abiathar were priests[a], and Shavsha was secretary.
translation:
  language: id
  text: Zadok, anak Ahitub, dan Abimelekh, anak Abyatar, adalah para imam; Sawsa adalah sekretaris.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat paralel dalam 2 Samuel 8:17 menyebut “Ahimelekh anak Abyatar”, bukan “Abimelekh anak Abyatar”. Terjemahan ini mengikuti teks Ibrani dalam Kitab Tawarikh.
    reason: textual_variant
lexical_decisions:
- source_word: צָדוֹק
  choice: Zadok
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar pejabat ini, kata tersebut paling wajar menunjukkan hubungan ayah-anak langsung.
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Nama diri ditransliterasikan.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelekh
  rationale: Mengikuti teks Ibrani Tawarikh yang berbunyi Abimelekh, tanpa menyelaraskannya dengan bacaan paralel.
- source_word: אֶבְיָתָר
  choice: Abyatar
  rationale: Nama diri ditransliterasikan secara wajar ke dalam ejaan Indonesia.
- source_word: כֹּהֲנִים
  choice: imam-imam
  rationale: Makna utama kata ini adalah para imam; konteks keluarga Zadok dan Abyatar mendukung jabatan keimaman, bukan sekadar pejabat kerajaan.
- source_word: שַׁוְשָׁא
  choice: Sawsa
  rationale: Nama diri ditransliterasikan berdasarkan bentuk Ibrani dalam Tawarikh dan disesuaikan dengan ejaan Indonesia.
- source_word: סוֹפֵר
  choice: sekretaris
  rationale: Dalam lingkungan pemerintahan kerajaan, kata ini menunjuk pejabat tulis-menulis atau sekretaris; 'sekretaris' menyampaikan fungsi administratifnya secara alami dalam bahasa Indonesia modern.
