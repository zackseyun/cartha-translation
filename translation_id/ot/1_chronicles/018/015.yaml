  text: וְ/יוֹאָ֥ב בֶּן צְרוּיָ֖ה עַל הַ/צָּבָ֑א וִ/יהוֹשָׁפָ֥ט בֶּן אֲחִיל֖וּד מַזְכִּֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/015.yaml
  text: And Joab son of Zeruiah was over the army[a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: id
  text: Yoab anak Zeruya mengepalai pasukan, dan Yosafat anak Ahilud menjabat sebagai pencatat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sekretaris” atau “penulis riwayat”; istilah Ibrani ini menunjuk seorang pejabat kerajaan yang bertugas mencatat berbagai perkara dan melaporkannya kepada raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹאָב בֶּן־צְרוּיָה
  choice: Yoab anak Zeruya
  rationale: Konjungsi Ibrani diteruskan melalui alur kalimat daftar jabatan tanpa harus diterjemahkan secara kaku sebagai “dan” pada awal ayat. Nama-nama ditransliterasikan dalam bentuk Indonesia yang lazim, dan konstruksi genealogis diterjemahkan langsung.
- source_word: עַל הַצָּבָא
  choice: mengepalai pasukan
  rationale: Preposisi עַל dalam konteks jabatan menyatakan kewenangan atas suatu bidang. “Mengepalai pasukan” alami dalam bahasa Indonesia dan mempertahankan makna bahwa Yoab berada di atas angkatan bersenjata tanpa menambahkan gelar khusus yang tidak dinyatakan dalam teks.
- source_word: וִיהוֹשָׁפָט בֶּן־אֲחִילוּד
  choice: dan Yosafat anak Ahilud
  rationale: Konjungsi dipertahankan untuk melanjutkan daftar pejabat, sedangkan hubungan ayah-anak diterjemahkan secara langsung.
- source_word: מַזְכִּיר
  choice: pencatat
  rationale: Dalam lingkungan kerajaan, istilah ini menunjuk pejabat yang berkaitan dengan pencatatan, pengingatan, dan pelaporan perkara. “Pencatat” cukup transparan dan tidak mempersempit fungsi tersebut menjadi pengertian sekretaris modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat, sesuai bentuk daftar pejabat istana. Kata “menjabat sebagai” melengkapi klausa nominal Ibrani secara alami. Penanda catatan kaki ditempatkan sesudah “pencatat”, yaitu istilah yang dijelaskan oleh catatan.
