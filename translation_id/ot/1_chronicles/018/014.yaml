  yaml_path: translation/ot/1_chronicles/018/014.yaml
  text: So David reigned over all Israel[a], and he administered justice and righteousness to all his people.
translation:
  language: id
  text: Daud memerintah atas seluruh Israel dan melaksanakan keadilan serta kebenaran[a] bagi seluruh rakyatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “penghakiman dan kebenaran.” Pasangan kata Ibrani ini memadukan keadilan hukum dengan kelurusan moral dalam menggambarkan pemerintahan Daud.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: memerintah
  rationale: Bentuk Qal wayyiqtol dari מלך menyatakan pemerintahan seorang raja. Dalam bahasa Indonesia, “memerintah” menyampaikan tindakan berkuasa sebagai raja secara alami tanpa perlu menambahkan unsur yang tidak tersurat.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: atas seluruh Israel
  rationale: Kata depan עַל bersama מלך menunjukkan wilayah atau bangsa yang diperintah, sedangkan כָּל menegaskan cakupan menyeluruh.
- source_word: וַיְהִי עֹשֶׂה
  choice: dan senantiasa menegakkan
  rationale: Gabungan היה dengan partisip menyatakan tindakan yang berlangsung atau menjadi kebiasaan. “Senantiasa” mempertahankan nuansa duratif tersebut, dan “menegakkan” sesuai dengan konteks pemerintahan serta objek abstrak yang mengikutinya.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: Dalam konteks pemerintahan raja, מִשְׁפָּט menunjuk pada pelaksanaan tata hukum yang adil; “keadilan” lebih alami daripada “penghakiman” dalam kalimat ini.
- source_word: וּצְדָקָה
  choice: serta kebenaran
  rationale: צְדָקָה menunjuk pada kelurusan moral atau keadaan yang benar. “Kebenaran” mempertahankan pembedaan dari מִשְׁפָּט, walaupun kedua konsep itu saling berkaitan.
- source_word: לְכָל עַמּוֹ
  choice: bagi seluruh rakyatnya
  rationale: לְ menandai pihak yang menerima manfaat pemerintahan Daud, dan sufiks orang ketiga tunggal pada עַמּוֹ dipertahankan dalam “rakyatnya”.
theological_decisions:
- issue: Pasangan etis kerajaan מִשְׁפָּט וּצְדָקָה
  choice: keadilan serta kebenaran
  alternative: penghakiman dan kebenaran; keadilan dan kelurusan
  rationale: 'Terjemahan ini mempertahankan dua unsur yang berbeda tetapi berkaitan: keadilan dalam tata hukum dan kelurusan moral. Keduanya tidak dilebur menjadi satu gagasan, sehingga gambaran tentang pemerintahan Daud tetap utuh tanpa menambahkan tafsiran denominasi tertentu.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Senantiasa menegakkan” dipilih untuk mengungkapkan tindakan pemerintahan yang berlangsung sebagai kebiasaan; “rakyatnya” lebih alami dalam konteks kerajaan daripada “bangsanya” atau “umatnya”.
