source:
  edition: WLC
  text: וְ/אַבְשַׁ֣י בֶּן צְרוּיָ֗ה הִכָּ֤ה אֶת אֱדוֹם֙ בְּ/גֵ֣יא הַמֶּ֔לַח שְׁמוֹנָ֥ה עָשָׂ֖ר אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/012.yaml
  text: And Abishai son of Zeruiah struck down eighteen thousand Edomites in the Valley of Salt[a].
translation:
  language: id
  text: Abisai anak Zeruya mengalahkan delapan belas ribu orang Edom di Lembah Garam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Edom”; dalam konteks pertempuran ini, yang dimaksud adalah orang-orang Edom.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשַׁי
  choice: Abisai
  rationale: Nama ditransliterasikan dalam bentuk Indonesia yang lazim. Konjungsi ו tidak diterjemahkan secara tersendiri karena bahasa Indonesia tidak memerlukannya untuk menjaga kesinambungan narasi pada ayat ini.
- source_word: בֶּן צְרוּיָה
  choice: anak Zeruya
  rationale: Ungkapan silsilah diterjemahkan langsung dan alami dalam bahasa Indonesia.
- source_word: הִכָּה
  choice: menewaskan
  rationale: Dalam konteks pertempuran yang disertai jumlah korban, bentuk kausatif dari נכה menyatakan tindakan memukul atau mengalahkan secara mematikan. 'Menewaskan' menyampaikan hasil tindakan tanpa menyiratkan bahwa Abisai membunuh setiap orang itu secara pribadi.
- source_word: אֶת אֱדוֹם
  choice: orang Edom
  rationale: Teks Ibrani secara harfiah menyebut 'Edom', tetapi verba perang dan jumlah delapan belas ribu menunjukkan bahwa yang dimaksud ialah orang-orang Edom, bukan wilayahnya.
- source_word: בְּ/גֵיא הַמֶּלַח
  choice: di Lembah Garam
  rationale: Frasa konstruksi Ibrani diterjemahkan sebagai nama tempat yang wajar dalam bahasa Indonesia.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: delapan belas ribu
  rationale: Bilangan ditulis dengan huruf sesuai gaya sastra Alkitab dan menerangkan orang-orang Edom yang tewas.
theological_decisions:
- issue: Apakah 'Edom' menunjuk kepada bangsa atau wilayah
  choice: orang Edom
  alternative: wilayah Edom
  rationale: Konteks pertempuran dan penyebutan jumlah delapan belas ribu mengharuskan pemahaman personal-kolektif. Catatan kaki mempertahankan bentuk harfiah sumber tanpa mengubahnya menjadi persoalan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan isi sumber; nama orang dan tempat mengikuti bentuk Indonesia yang lazim.
