  yaml_path: translation/ot/1_chronicles/018/017.yaml
  text: And Benaiah son of Jehoiada was over the Kerethites and the Pelethites[c][b][a], and David’s sons were the chief officials at the king’s side.
translation:
  language: id
  text: Benaya bin Yoyada mengepalai orang Kereti dan orang Peleti,[a] sedangkan anak-anak Daud menjadi para pejabat utama di sisi raja.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama kedua kelompok ini juga dapat ditulis “orang Kreti dan orang Pleti.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “orang-orang pertama” atau “orang-orang terkemuka”; kemungkinan merupakan gelar bagi pejabat tinggi istana.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “pada tangan raja,” suatu ungkapan bagi orang yang berada dekat dengan raja atau melayaninya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: mengepalai
  rationale: Dalam konteks pemerintahan atau kemiliteran, kata ini menyatakan wewenang atas suatu kelompok. “Mengepalai” alami dalam bahasa Indonesia dan tidak menambahkan rincian jabatan yang tidak disebutkan.
- source_word: הַכְּרֵתִי
  choice: orang Kreti
  rationale: Nama kelompok ini ditransliterasikan dari bahasa Ibrani, bukan ditafsirkan sebagai istilah lain.
- source_word: הַפְּלֵתִי
  choice: orang Pleti
  rationale: Nama kelompok ini juga ditransliterasikan sebagai nama kelompok, sesuai bentuk Ibraninya.
- source_word: הָרִאשֹׁנִים
  choice: para pejabat utama
  rationale: Secara harfiah berarti “orang-orang pertama/terkemuka.” Dalam konteks istana, ungkapan ini tampaknya menunjukkan kedudukan atau keutamaan, tetapi arti harfiahnya dipertahankan dalam catatan kaki.
- source_word: לְיַד הַמֶּלֶךְ
  choice: yang mendampingi raja
  rationale: Secara harfiah “di/pada tangan raja”; dalam konteks istana, idiom ini menyatakan kedekatan dan pelayanan langsung kepada raja.
- source_word: וּבְנֵי דָוִיד
  choice: anak-anak Daud
  rationale: Terjemahan langsung dan alami dari frasa konstruksi Ibrani.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaya anak Yoyada
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia, dan hubungan ayah-anak dinyatakan secara alami.
