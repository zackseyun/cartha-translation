  yaml_path: translation/ot/1_chronicles/018/007.yaml
  text: And David took the shields of gold that were on the servants of Hadadezer and brought them to Jerusalem[a][b][c].
translation:
  language: id
  text: Daud mengambil perisai-perisai emas[a] yang ada pada para abdi[b] Hadadezer[c], lalu membawanya ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perisai-perisai berlapis emas”; frasa Ibrani dapat menunjuk pada perisai yang dilapisi emas.
    reason: lexical_alternative
  - marker: b
    text: “Abdi” di sini kemungkinan berarti pengikut istana atau pengiring militer Hadadezer, bukan semata-mata budak rumah tangga dalam pengertian modern.
    reason: cultural_note
  - marker: c
    text: Sebagian tradisi teks dan bagian sejajar dalam 2 Samuel mengeja nama ini “Hadarezer”.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Kata לקח dalam narasi lazim berarti “mengambil”. Konteks peperangan dapat menyiratkan perampasan, tetapi terjemahan ini mempertahankan makna leksikal dasarnya.
- source_word: שִׁלְטֵי הַזָּהָב
  choice: perisai-perisai emas
  rationale: שִׁלְטֵי menunjuk pada perisai, mungkin perisai kecil; bentuk konstruksi dengan הַזָּהָב secara alami diterjemahkan “perisai-perisai emas”, tanpa memastikan apakah perisai itu terbuat dari atau hanya dilapisi emas.
- source_word: אֲשֶׁר הָיוּ עַל
  choice: yang dibawa oleh
  rationale: Secara harfiah frasa ini berarti “yang ada di atas/pada”. Dalam konteks perlengkapan para abdi, bahasa Indonesia alami mengungkapkan relasinya sebagai perisai yang mereka bawa, meskipun ungkapan Ibraninya sendiri tidak merinci cara pemakaiannya.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: para abdi Hadadezer
  rationale: עֲבָדִים dapat berarti hamba, pelayan, pejabat, atau pengikut raja. “Para abdi” sesuai dengan lingkungan kerajaan-militer dan tidak membatasi maknanya pada budak rumah tangga.
- source_word: הֲדַדְעָזֶר
  choice: Hadadezer
  rationale: Bentuk dalam teks Masoret ayat ini adalah Hadadezer; ejaan Hadarezer dicatat sebagai varian.
- source_word: וַיְבִיאֵם יְרוּשָׁלִָם
  choice: lalu membawanya ke Yerusalem
  rationale: Bentuk Hifil dari בוא berarti “membawa”; akhiran objek jamak merujuk pada kumpulan perisai, yang secara idiomatis dapat dirujuk dengan “-nya” dalam bahasa Indonesia.
