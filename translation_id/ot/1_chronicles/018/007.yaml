translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. “Abdi” dipilih untuk mempertahankan cakupan sosial-politik istilah Ibrani dalam konteks kerajaan, sedangkan “dibawa oleh” menghasilkan ungkapan alami bagi perlengkapan yang berada pada para pengiring.
