  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּנֵ֣י לַ֠עְדָּן בְּנֵ֨י הַ/גֵּרְשֻׁנִּ֜י לְ/לַעְדָּ֗ן רָאשֵׁ֧י הָ/אָב֛וֹת לְ/לַעְדָּ֥ן הַ/גֵּרְשֻׁנִּ֖י יְחִיאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/021.yaml
  text: 'The sons of Ladan[b][a], the sons of the Gershonite belonging to Ladan: the heads of the fathers’ houses belonging to Ladan the Gershonite were Jehieli.'
translation:
  language: id
  text: Anak-anak Ladan[a]—keturunan Gerson yang termasuk garis Ladan—, para kepala kaum keluarga[b] Ladan, orang Gerson itu, ialah Yehieli.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks silsilah, “anak-anak” dapat berarti keturunan dalam arti yang lebih luas.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, para pemimpin unit keluarga besar atau kaum yang ditelusuri melalui leluhur.
    reason: cultural_note
  - marker: c
    text: Bentuk Ibrani ini dapat dipahami sebagai nama “Yehieli” atau sebagai sebutan kelompok, “kaum Yehiel.”
    reason: morphological_contextual_ambiguity
lexical_decisions:
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Mempertahankan ungkapan silsilah Ibrani yang harfiah, sementara catatan kaki menjelaskan bahwa istilah ini dapat mencakup keturunan yang lebih luas.
- source_word: לַעְדָּן
  choice: Ladan
  rationale: Nama pribadi ditransliterasikan secara ringkas sesuai bentuk vokal teks Masoret.
- source_word: הַגֵּרְשֻׁנִּי
  choice: orang Gerson
  rationale: Bentuk nisbah ini menyatakan hubungan Ladan dengan garis atau kaum Gerson; ungkapan ini alami dalam bahasa Indonesia dan tidak memaksakan apakah yang dimaksud individu atau afiliasi kaum.
- source_word: לְלַעְדָּן
  choice: dari Ladan
  rationale: Prefiks ל menyatakan hubungan atau penggolongan dalam silsilah, bukan arah. 'Dari Ladan' menyampaikan afiliasi itu secara wajar.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: kepala-kepala keluarga leluhur
  rationale: Terjemahan ini mempertahankan gambaran tentang pemimpin unit keluarga berdasarkan garis leluhur, tetapi lebih mudah dipahami daripada ungkapan harfiah 'kepala-kepala para ayah'.
- source_word: יְחִיאֵלִי
  choice: Yehieli
  rationale: Bentuk nama dipertahankan sebagai nama atau sebutan diri tanpa memutuskan secara diam-diam apakah akhiran Ibrani berfungsi sebagai bagian nama pribadi atau sebagai penanda kelompok keturunan.
