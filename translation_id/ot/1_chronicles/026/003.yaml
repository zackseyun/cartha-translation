lexical_decisions:
- source_word: עֵילָם
  choice: Elam
  rationale: Nama diri; ditransliterasikan dalam bentuk yang lazim dan dekat dengan bentuk Ibrani.
- source_word: הַחֲמִישִׁי
  choice: yang kelima
  rationale: Kata bilangan tingkat dengan artikel; konstruksi 'yang kelima' alami dalam bahasa Indonesia dan mempertahankan fungsi urutan dalam daftar.
- source_word: יְהוֹחָנָן
  choice: Yohanan
  rationale: Nama diri Ibrani; bentuk 'Yohanan' lebih dekat dengan pelafalan sumber dan mudah dibaca dalam bahasa Indonesia.
- source_word: הַשִּׁשִּׁי
  choice: yang keenam
  rationale: Mempertahankan bentuk ordinal dan kesejajaran daftar.
- source_word: אֶלְיְהוֹעֵינַי
  choice: Elyoenai
  rationale: Nama diri ditransliterasikan secara ringkas dan terbaca, dengan 'y' untuk unsur konsonantal sebelum vokal.
- source_word: הַשְּׁבִיעִי
  choice: yang ketujuh
  rationale: Mempertahankan bentuk ordinal dan kesejajaran dengan dua unsur sebelumnya.
