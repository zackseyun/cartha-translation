source:
  edition: WLC
  text: לְ/מַחְלְק֖וֹת לְ/שֹׁעֲרִ֑ים לַ/קָּרְחִ֕ים מְשֶֽׁלֶמְיָ֥הוּ בֶן קֹרֵ֖א מִן בְּנֵ֥י אָסָֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/001.yaml
  text: 'For the divisions of the gatekeepers: of the Korahites[a], Meshelemiah son of Kore, from the sons of Asaph.'
translation:
  language: id
  text: 'Mengenai kelompok-kelompok penjaga gerbang[a]: dari kaum Korah, Meselemya anak Kore, dari antara keturunan Asaf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Menurut pembagian para penjaga gerbang.” Frasa pembuka ini berfungsi sebagai judul bagian yang memperkenalkan kelompok-kelompok penjaga gerbang.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַחְלְקוֹת לְשֹׁעֲרִים
  choice: Mengenai kelompok-kelompok penjaga gerbang
  rationale: Frasa berawalan לְ berfungsi sebagai judul bagian. מַחְלְקוֹת menunjuk pada kelompok atau giliran tugas yang terorganisasi, sedangkan שֹׁעֲרִים adalah para penjaga gerbang.
- source_word: לַקָּרְחִים
  choice: dari kaum Korah
  rationale: Ungkapan ini mengidentifikasi kelompok keluarga atau kaum yang berasal dari Korah; 'kaum Korah' alami dalam daftar silsilah Indonesia.
- source_word: מְשֶׁלֶמְיָהוּ
  choice: Meselemya
  rationale: Nama diri ditransliterasikan ke dalam bentuk yang sesuai dengan ejaan Indonesia sambil mencerminkan bentuk konsonantal Ibrani.
- source_word: בֶן קֹרֵא
  choice: anak Kore
  rationale: בֶן paling langsung menyatakan hubungan anak dengan ayah dalam konteks silsilah ini.
- source_word: מִן בְּנֵי אָסָף
  choice: dari antara keturunan Asaf
  rationale: מִן menyatakan keanggotaan dari dalam suatu garis keluarga, dan בְּנֵי dalam konteks silsilah dapat secara alami diterjemahkan 'keturunan'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan seperti daftar dipertahankan tanpa menambahkan kata kerja yang tidak terdapat dalam teks Ibrani.
