base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/017.yaml
  text: On the east were six Levites; on the north[a], four a day; on the south, four a day; and at the storehouses, two by two.
translation:
  language: id
  text: Di sebelah timur ada enam orang Lewi; di sebelah utara, empat orang setiap hari; di sebelah selatan, empat orang setiap hari; dan di gudang-gudang[a], masing-masing dua orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani Asuppim; istilah ini mungkin merupakan nama tempat atau kompleks ruangan tertentu, bukan gudang-gudang dalam arti umum.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמִּזְרָח
  choice: di sebelah timur
  rationale: Ungkapan arah dengan preposisi ini menunjukkan lokasi atau penugasan menurut sisi; pilihan ini alami dalam daftar penempatan para penjaga.
- source_word: הַלְוִיִּם
  choice: orang Lewi
  rationale: Menunjuk kepada para anggota suku Lewi yang bertugas sebagai penjaga pintu dalam konteks ini.
- source_word: שִׁשָּׁה
  choice: enam
  rationale: Bilangan pokok yang menyatakan jumlah orang Lewi yang ditempatkan di sisi timur.
- source_word: לַצָּפוֹנָה
  choice: di sebelah utara
  rationale: Ungkapan arah yang sejajar dengan sisi timur dan selatan, diterjemahkan secara lokatif.
- source_word: לַיּוֹם
  choice: setiap hari
  rationale: Dalam konteks pembagian tugas, frasa ini menyatakan jumlah yang ditugaskan per hari.
- source_word: אַרְבָּעָה
  choice: empat orang
  rationale: Bilangan pokok untuk penugasan di sisi utara dan selatan; kata 'orang' ditambahkan secara wajar untuk memperjelas unsur yang dihitung.
- source_word: לַנֶּגְבָּה
  choice: di sebelah selatan
  rationale: Ungkapan arah yang diterjemahkan sejajar dengan sisi-sisi lainnya.
- source_word: וְלָאֲסֻפִּים
  choice: dan di gudang-gudang[a]
  rationale: Istilah ini kemungkinan menunjuk pada ruang-ruang penyimpanan atau kompleks tertentu di lingkungan Bait Allah. Arti umum diterapkan dalam teks, sedangkan ketidakpastian rujukannya dipertahankan dalam catatan kaki.
- source_word: שְׁנַיִם שְׁנָיִם
  choice: masing-masing dua orang
  rationale: Pengulangan bilangan menyatakan pembagian secara distributif; ungkapan ini jelas dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Struktur daftar serta perbedaan antara enam orang di timur dan jumlah per hari di utara serta selatan dipertahankan. Tanda catatan kaki ditempatkan pada istilah yang benar-benar dijelaskannya, yaitu 'gudang-gudang'.
