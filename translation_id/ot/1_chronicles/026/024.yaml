base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/024.yaml
  text: And Shebuel son of Gershom[a], son of Moses[b], was chief over the treasuries.
translation:
  language: id
  text: Dan Sebuel, anak Gersom, anak Musa, adalah kepala perbendaharaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gudang-gudang harta” atau “harta-harta simpanan.” Kata Ibrani ini dapat menunjuk pada tempat penyimpanan maupun harta yang disimpan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁבֻאֵל
  choice: Dan Sebuel
  rationale: Konjungsi ו diterjemahkan “Dan” untuk mempertahankan kesinambungan daftar, sedangkan nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן גֵּרְשׁוֹם בֶּן מֹשֶׁה
  choice: anak Gersom, anak Musa
  rationale: בֶּן menyatakan hubungan anak secara langsung dalam rantai silsilah ini; pengulangannya dipertahankan agar hubungan Sebuel–Gersom–Musa jelas.
- source_word: נָגִיד עַל
  choice: kepala yang membawahi
  rationale: נָגִיד menunjuk orang yang ditempatkan dalam kedudukan berwenang, dan עַל menandai lingkup tanggung jawabnya. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan nuansa kepemimpinan administratif.
- source_word: הָאֹצָרוֹת
  choice: perbendaharaan
  rationale: Dalam konteks pengelolaan harta dan persembahan khusus, istilah ini paling wajar menunjuk perbendaharaan, meskipun kata Ibraninya juga dapat merujuk pada gudang atau harta yang disimpan.
