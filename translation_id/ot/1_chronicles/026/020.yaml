base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/020.yaml
  text: And of the Levites[b][a], Ahijah was over the treasuries of the house of God and the treasuries of the holy things.
translation:
  language: id
  text: Mengenai orang-orang Lewi,[a] Ahia mengawasi perbendaharaan rumah Allah dan perbendaharaan barang-barang kudus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan dari antara orang-orang Lewi, Ahia mengawasi ...” Pembukaan bahasa Ibraninya agak eliptis dan mungkin berfungsi sebagai peralihan seperti judul bagian.
    reason: alternative_reading
  - marker: b
    text: “Barang-barang kudus” dapat juga diterjemahkan “barang-barang yang dikhususkan” atau “barang-barang yang dipersembahkan”, yaitu benda-benda yang dipisahkan bagi penggunaan sakral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Mengenai orang-orang Lewi
  rationale: Frasa pembuka ini bersifat eliptis dan paling mungkin menjadi peralihan topikal. Pilihan ini alami dalam bahasa Indonesia sekaligus tidak menjadikannya secara langsung sebagai subjek jamak bagi nama tunggal yang menyusul.
- source_word: אֲחִיָּה
  choice: Ahiya
  rationale: Nama pribadi Ibrani ditransliterasikan ke dalam bentuk yang mudah dibaca dalam bahasa Indonesia.
- source_word: עַל
  choice: mengawasi
  rationale: Dalam konteks administratif, preposisi ini menyatakan kewenangan atau tanggung jawab atas sesuatu; 'mengawasi' menyampaikan fungsi tersebut secara wajar.
- source_word: אֹצְרוֹת
  choice: perbendaharaan
  rationale: Dalam konteks rumah Allah, kata ini menunjuk pada tempat atau kumpulan barang berharga dan persediaan yang disimpan; 'perbendaharaan' sesuai dengan latar kelembagaan dan sakralnya.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Terjemahan langsung ungkapan Ibrani ini tetap jelas dan wajar dalam bahasa Indonesia serta mempertahankan citra 'rumah', bukan menafsirkannya langsung sebagai 'Bait Allah'.
- source_word: וּלְאֹצְרוֹת
  choice: dan perbendaharaan
  rationale: Preposisi pada frasa kedua menghubungkannya dengan lingkup pengawasan yang sama. Kata kerja 'mengawasi' tidak perlu diulang dalam bahasa Indonesia.
- source_word: הַקֳּדָשִׁים
  choice: barang-barang kudus
  rationale: Bentuk jamak ini merujuk pada benda-benda yang dipisahkan bagi penggunaan sakral. Terjemahan ini langsung, sedangkan 'barang-barang yang dipersembahkan' atau 'dikhususkan' lebih interpretatif.
