source:
  edition: WLC
  text: בְּנֵ֣י שְׁמַֽעְיָ֗ה עָ֠תְנִי וּ/רְפָאֵ֨ל וְ/עוֹבֵ֧ד אֶלְזָבָ֛ד אֶחָ֖י/ו בְּנֵי חָ֑יִל אֱלִיה֖וּ וּ/סְמַכְיָֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/007.yaml
  text: 'The sons of Shemaiah: Othni[a], Rephael, Obed, Elzabad, whose brothers were capable men, Elihu and Semakiah.'
translation:
  language: id
  text: Anak-anak Semaya ialah Otni, Refael, Obed, dan Elzabad. Saudara-saudara Elzabad, yaitu Elihu dan Semakhya, adalah orang-orang tangguh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang perkasa” atau “orang-orang cakap.” Ungkapan Ibrani ini dapat menyatakan kekuatan, keberanian, atau kecakapan; di sini mungkin yang ditekankan ialah kemampuan mereka untuk melayani.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שְׁמַעְיָה
  choice: Anak-anak Semaya
  rationale: Rangkaian konstruksi ini menyatakan hubungan keturunan. Bentuk tersebut sesuai dengan gaya daftar silsilah dan tetap alami dalam bahasa Indonesia.
- source_word: עָתְנִי וּרְפָאֵל וְעוֹבֵד אֶלְזָבָד
  choice: Otni, Refael, Obed, dan Elzabad
  rationale: Nama-nama diri dialihaksarakan menurut bentuk yang jelas dan wajar bagi pembaca Indonesia.
- source_word: אֶחָיו
  choice: Saudara-saudara Elzabad
  rationale: Bentuk Ibrani secara harfiah berarti 'saudara-saudaranya' dengan akhiran orang ketiga tunggal maskulin. Pengulangan nama Elzabad memperjelas acuan terdekat tanpa mengubah jumlah tunggal pada pemiliknya.
- source_word: בְּנֵי חָיִל
  choice: orang-orang tangguh
  rationale: Ungkapan ini dapat menunjuk pada kekuatan, keberanian, kecakapan, atau kemampuan. 'Orang-orang tangguh' mempertahankan keluasan maknanya tanpa membatasinya pada konteks militer.
- source_word: אֱלִיהוּ וּסְמַכְיָהוּ
  choice: Elihu dan Semakhya
  rationale: Nama-nama ini dialihaksarakan dari bentuk Masoret dengan ejaan yang mudah dibaca dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar dibuat jelas dengan dua kalimat agar hubungan Elihu dan Semakhya dengan Elzabad mudah dipahami, sementara nuansa luas ungkapan Ibrani בְּנֵי חָיִל dipertahankan melalui catatan kaki.
