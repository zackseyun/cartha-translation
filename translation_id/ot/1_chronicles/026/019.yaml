translation:
  language: id
  text: Inilah pembagian para penjaga gerbang bagi keturunan Korah dan keturunan Merari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Itulah
  rationale: Kata tunjuk jamak ini memperkenalkan rangkuman dari daftar sebelumnya. Dalam bahasa Indonesia, “Itulah” secara alami mengacu kembali kepada pembagian yang baru saja diuraikan tanpa perlu menambahkan kala yang tidak dinyatakan dalam teks Ibrani.
- source_word: מַחְלְקוֹת
  choice: pembagian tugas
  rationale: Dalam konteks pelayanan Bait Allah, nomina ini menunjuk pada pengaturan orang ke dalam kelompok atau giliran pelayanan. “Pembagian tugas” menyampaikan fungsi administratifnya dengan jelas dan wajar.
- source_word: הַשֹּׁעֲרִים
  choice: para penjaga gerbang
  rationale: Istilah ini menunjuk kepada orang-orang yang ditugaskan menjaga gerbang. Padanan ini jelas, modern, dan sesuai dengan konteks Bait Allah.
- source_word: לִבְנֵי הַקָּרְחִי
  choice: dari keturunan Korah
  rationale: Ungkapan ini menyatakan afiliasi kelompok berdasarkan garis keturunan. “Keturunan Korah” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “anak-anak orang Korah” dan tetap mempertahankan pengertian klan.
- source_word: וְלִבְנֵי מְרָרִי
  choice: dan keturunan Merari
  rationale: Terjemahan ini mempertahankan kesejajaran dengan keturunan Korah serta menyatakan kelompok keluarga yang berasal dari Merari.
