  text: לְ/עֹבֵ֥ד אֱדֹ֖ם נֶ֑גְבָּ/ה וּ/לְ/בָנָ֖י/ו בֵּ֥ית הָ/אֲסֻפִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/015.yaml
  text: To Obed-edom[a], the south; and to his sons, the house of stores.
translation:
  language: id
  text: 'Untuk Obed-Edom: sebelah selatan; dan untuk anak-anak lelakinya: rumah penyimpanan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “rumah tempat barang-barang yang dikumpulkan.” Istilah Ibrani ini dapat menunjuk pada tempat penyimpanan atau ruang-ruang perbekalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹבֵד אֱדֹם
  choice: Untuk Obed-Edom
  rationale: Prefiks לְ menandai penerima bagian dalam konteks pembagian tugas berdasarkan undian. Bentuk ringkas ini mempertahankan rumusan eliptis bahasa Ibrani.
- source_word: נֶגְבָּה
  choice: sebelah selatan
  rationale: Akhiran penunjuk arah pada kata ini mengacu pada arah atau sisi selatan; dalam konteks penempatan para penjaga, 'sebelah selatan' paling jelas dan alami.
- source_word: וּלְבָנָיו
  choice: dan untuk anak-anaknya
  rationale: Frasa ini menunjuk kepada anak-anak laki-laki Obed-Edom sebagai penerima bagian berikutnya. Bahasa Indonesia lazim memakai 'anak-anaknya' tanpa perlu menambahkan jenis kelamin yang sudah tersirat oleh konteks genealogi.
- source_word: בֵּית הָאֲסֻפִּים
  choice: rumah penyimpanan
  rationale: בֵּית berarti 'rumah/bangunan', sedangkan הָאֲסֻפִּים berasal dari akar 'mengumpulkan' dan menunjuk pada tempat penyimpanan atau barang-barang yang dikumpulkan. 'Rumah penyimpanan' mempertahankan unsur bangunan tanpa mempersempit isinya menjadi uang atau harta berharga.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Tanda titik dua mempertahankan susunan pembagian yang eliptis dalam teks Ibrani tanpa menambahkan kata 'undian' atau 'pintu gerbang' dari konteks sekitar.
