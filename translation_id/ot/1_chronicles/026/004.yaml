  register: Bahasa Indonesia baku, modern, dan lugas. Struktur daftar dipertahankan dengan tanda titik koma agar urutan anak mudah dibaca. Konjungsi pembuka Ibrani tidak diterjemahkan secara mekanis karena ayat Indonesia ini berdiri alami sebagai kelanjutan daftar silsilah.
