  text: וּ/לְ/עֹבֵ֥ד אֱדֹ֖ם בָּנִ֑ים שְׁמַֽעְיָ֤ה הַ/בְּכוֹר֙ יְהוֹזָבָ֣ד הַ/שֵּׁנִ֔י יוֹאָ֤ח הַ/שְּׁלִשִׁי֙ וְ/שָׂכָ֣ר הָ/רְבִיעִ֔י וּ/נְתַנְאֵ֖ל הַ/חֲמִישִֽׁי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/004.yaml
  text: 'And Obed-edom had sons: Shemaiah the firstborn[a], Jehozabad the second, Joah the third, and Sakar the fourth[b], and Nethanel the fifth.'
translation:
  language: id
  text: 'Obed-Edom mempunyai anak-anak: Semaya, anak sulung; Yozabad, yang kedua; Yoah, yang ketiga; Sakhar[a], yang keempat; dan Netaneel, yang kelima.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Ibrani di sini adalah Sakhar, berbeda dari Isakhar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעֹבֵד אֱדֹם בָּנִים
  choice: Obed-Edom mempunyai anak-anak
  rationale: Ungkapan Ibrani secara harfiah berbentuk ‘dan bagi Obed-Edom, anak-anak’. Dalam daftar silsilah, ‘mempunyai anak-anak’ mengungkapkan konstruksi eliptis itu secara wajar dalam bahasa Indonesia tanpa menambahkan gagasan kelahiran yang tidak dinyatakan.
- source_word: שְׁמַעְיָה
  choice: Semaya
  rationale: Nama diri dialihaksarakan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: הַבְּכוֹר
  choice: anak sulung
  rationale: Kata ini menunjuk status kekeluargaan sebagai anak yang lahir pertama, bukan sekadar urutan pertama.
- source_word: יְהוֹזָבָד
  choice: Yozabad
  rationale: Alih aksara nama Ibrani yang jelas dan lazim dalam ejaan Indonesia.
- source_word: הַשֵּׁנִי ... הַשְּׁלִשִׁי ... הָרְבִיעִי ... הַחֲמִישִׁי
  choice: yang kedua ... yang ketiga ... yang keempat ... yang kelima
  rationale: Bilangan bertingkat diterjemahkan langsung untuk mempertahankan urutan anak-anak.
- source_word: יוֹאָח
  choice: Yoah
  rationale: Alih aksara langsung yang sesuai dengan ejaan Indonesia.
- source_word: שָׂכָר
  choice: Sakhar
  rationale: Bentuk nama di sini berbeda dari nama Isakhar; ejaan ‘kh’ membantu mencerminkan konsonan Ibrani כ.
- source_word: נְתַנְאֵל
  choice: Netaneel
  rationale: Alih aksara langsung dari nama Ibrani, tanpa memakai bentuk yang dipengaruhi bahasa Yunani.
theological_decisions: []
