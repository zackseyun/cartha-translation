base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/011.yaml
  text: Hilkiah the second[a], Tebaliah the third, Zechariah the fourth. All the sons and brothers of Hosah were thirteen.
translation:
  language: id
  text: Hilkia, yang kedua; Tebalya, yang ketiga; Zakharia, yang keempat. Semua anak laki-laki dan saudara laki-laki Hosa berjumlah tiga belas orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kerabat laki-laki” untuk “saudara laki-laki”, jika istilah Ibraninya dipahami lebih luas sebagai sanak laki-laki dalam kaum Hosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִלְקִיָּהוּ
  choice: Hilkia
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הַשֵּׁנִי
  choice: yang kedua
  rationale: Kata bilangan tingkat berartikel ini menyatakan urutan dalam daftar.
- source_word: טְבַלְיָהוּ
  choice: Tebalya
  rationale: Transliterasi nama Ibrani yang wajar dan mudah dibaca dalam bahasa Indonesia.
- source_word: הַשְּׁלִשִׁי
  choice: yang ketiga
  rationale: Mempertahankan urutan sejajar dalam daftar nama.
- source_word: זְכַרְיָהוּ
  choice: Zakharia
  rationale: Mengikuti bentuk nama yang telah mapan dalam tradisi Alkitab bahasa Indonesia.
- source_word: הָרְבִעִי
  choice: yang keempat
  rationale: Menerjemahkan bilangan tingkat secara langsung.
- source_word: כָּל
  choice: semua
  rationale: Merangkum keseluruhan kelompok yang dihitung.
- source_word: בָּנִים
  choice: anak laki-laki
  rationale: Menjaga kekhususan gender dari bentuk Ibrani dan sesuai dengan konteks daftar keluarga.
- source_word: וְאַחִים
  choice: dan saudara laki-laki
  rationale: Makna langsung adalah saudara laki-laki, meski dalam konteks klan dapat mencakup kerabat laki-laki yang lebih luas.
- source_word: לְחֹסָה
  choice: Hosa
  rationale: Relasi yang ditandai preposisi Ibrani dinyatakan secara alami melalui frasa posesif Indonesia 'anak ... Hosa'.
- source_word: שְׁלֹשָׁה עָשָׂר
  choice: tiga belas orang
  rationale: Bilangan diterjemahkan secara idiomatis, dengan penggolong 'orang' untuk memperjelas bahwa yang dihitung adalah manusia.
