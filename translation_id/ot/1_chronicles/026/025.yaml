  text: וְ/אֶחָ֖י/ו לֶֽ/אֱלִיעֶ֑זֶר רְחַבְיָ֨הוּ בְנ֜/וֹ וִֽ/ישַׁעְיָ֤הוּ בְנ/וֹ֙ וְ/יֹרָ֣ם בְּנ֔/וֹ וְ/זִכְרִ֥י בְנ֖/וֹ ו/שלמות בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/025.yaml
  text: 'And his brothers belonging to Eliezer: Rehabiah his son[a], and Jeshaiah his son, and Joram his son, and Zichri his son, and Shelomith his son.'
translation:
  language: id
  text: Dan saudara-saudaranya dari garis Eliezer ialah Rehabya, anaknya; Yesaya, anaknya; Yoram, anaknya; Zikhri, anaknya; dan Selomot, anaknya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “saudara-saudaranya dari Eliezer.” Susunan bahasa Ibrani tampaknya memperkenalkan cabang keluarga Eliezer, tetapi hubungan itu diungkapkan secara ringkas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶחָיו
  choice: Dan saudara-saudaranya
  rationale: Bentuk jamak אָח dengan akhiran orang ketiga tunggal secara harfiah berarti “saudara-saudaranya”; dalam konteks silsilah cakupannya dapat meluas kepada kaum kerabat.
- source_word: לֶאֱלִיעֶזֶר
  choice: dari garis Eliezer
  rationale: Prefiks לְ menyatakan hubungan dengan Eliezer dan di sini memperkenalkan cabang keluarganya. Ungkapan “dari garis” alami dalam bahasa Indonesia dan tidak mengubah daftar itu menjadi saudara kandung Eliezer.
- source_word: רְחַבְיָהוּ
  choice: Rehabya
  rationale: Transliterasi nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: בְנוֹ
  choice: anaknya
  rationale: Pengulangan penanda hubungan anak mempertahankan rantai keturunan yang dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: וִישַׁעְיָהוּ
  choice: Yesaya
  rationale: Bentuk nama Ibrani ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; konteks membedakan tokoh ini dari nabi Yesaya.
- source_word: וְיֹרָם
  choice: Yoram
  rationale: Mempertahankan bentuk pendek nama yang tertulis dalam ayat ini, bukan bentuk panjang Yehoram.
- source_word: וְזִכְרִי
  choice: Zikhri
  rationale: Transliterasi yang mempertahankan bunyi konsonan nama Ibrani dan sesuai dengan bentuk nama yang dikenal dalam bahasa Indonesia.
- source_word: וּשְׁלֹמוֹת
  choice: Selomit
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia untuk tokoh ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Pengulangan “anaknya” dipertahankan untuk mencerminkan susunan silsilah Ibrani, sedangkan “dari garis Eliezer” memperjelas hubungan genealogis tanpa menutup ambiguitas sumber.
