  text: וּ/לְ/חֹסָ֥ה מִן בְּנֵי מְרָרִ֖י בָּנִ֑ים שִׁמְרִ֤י הָ/רֹאשׁ֙ כִּ֣י לֹא הָיָ֣ה בְכ֔וֹר וַ/יְשִׂימֵ֥/הוּ אָבִ֖י/הוּ לְ/רֹֽאשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/010.yaml
  text: 'And Hosah[a], from the sons of Merari, had sons: Shimri the chief, though he was not the firstborn; his father made him chief.'
translation:
  language: id
  text: 'Hosa, dari antara keturunan Merari, mempunyai putra-putra: Simri, sang kepala, meskipun ia bukan anak sulung; ayahnya mengangkatnya menjadi kepala.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab ia bukan anak sulung”; kata penghubung Ibrani dapat dipahami sebagai penjelasan maupun sebagai ungkapan konsesif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְחֹסָה
  choice: Hosa
  rationale: Dalam konteks daftar silsilah, לְ pada nama pribadi memperkenalkan orang yang mempunyai keturunan. Hubungan dengan ayat sebelumnya tersirat secara alami tanpa perlu memaksakan kata penghubung "dan".
- source_word: מִן בְּנֵי מְרָרִי
  choice: dari antara keturunan Merari
  rationale: Ungkapan ini menyatakan asal kelompok atau garis keturunan Hosa. "Keturunan" lebih alami dalam bahasa Indonesia modern daripada terjemahan harfiah "anak-anak Merari" dalam konteks klan.
- source_word: בָּנִים
  choice: mempunyai anak-anak
  rationale: Teks Ibrani hanya menyebut "anak-anak", tetapi konteks daftar nominal memerlukan penghubung verbal agar alami dalam bahasa Indonesia. Bentuk jamak dipertahankan.
- source_word: שִׁמְרִי
  choice: Simri
  rationale: Nama pribadi ditransliterasikan mengikuti bentuk yang wajar dalam bahasa Indonesia.
- source_word: הָרֹאשׁ
  choice: sang kepala
  rationale: רֹאשׁ di sini menunjuk kedudukan utama atau kepemimpinan dalam kelompok keluarga. "Kepala" mempertahankan hubungan leksikal dengan pengangkatan pada klausa berikutnya.
- source_word: כִּי לֹא הָיָה בְכוֹר
  choice: Meskipun ia bukan anak sulung
  rationale: כִּי dapat bersifat menjelaskan atau menyatakan sebab, tetapi dalam konteks ini pembacaan konsesif menonjolkan kontras antara bukan anak sulung dan menjadi kepala. Ambiguitas dicatat dalam catatan kaki.
- source_word: בְכוֹר
  choice: anak sulung
  rationale: Padanan Indonesia yang baku dan alami untuk istilah urutan kelahiran ini.
- source_word: וַיְשִׂימֵהוּ אָבִיהוּ לְרֹאשׁ
  choice: ayahnya mengangkat dia menjadi kepala
  rationale: שׂים dengan לְ menyatakan penetapan pada suatu kedudukan. "Mengangkat ... menjadi kepala" alami dan mempertahankan pengulangan רֹאשׁ.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan daftar silsilah dibuat alami tanpa menghilangkan bentuk jamak "anak-anak" atau pengulangan istilah "kepala". Penanda catatan kaki ditempatkan sesudah nama Hosa sesuai lapisan konsultasi, sementara catatannya menjelaskan ambiguitas pada hubungan antarklausa.
