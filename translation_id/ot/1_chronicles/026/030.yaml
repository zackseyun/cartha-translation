language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לַֽ/חֶבְרוֹנִ֡י חֲשַׁבְיָהוּ֩ וְ/אֶחָ֨י/ו בְּנֵי חַ֜יִל אֶ֣לֶף וּ/שְׁבַע מֵא֗וֹת עַ֚ל פְּקֻדַּ֣ת יִשְׂרָאֵ֔ל מֵ/עֵ֥בֶר לַ/יַּרְדֵּ֖ן מַעְרָ֑בָ/ה לְ/כֹל֙ מְלֶ֣אכֶת יְהוָ֔ה וְ/לַ/עֲבֹדַ֖ת הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/030.yaml
  text: 'For the Hebronites: Hashabiah and his brothers[a], 1,700 capable men, were in charge of the oversight of Israel west of the Jordan, for all the work of the LORD and for the service of the king.'
translation:
  language: id
  text: Untuk kaum Hebron, Hasabya dan saudara-saudaranya—1.700 orang yang cakap—bertugas mengawasi Israel di sebelah barat Sungai Yordan[a], dalam segala pekerjaan bagi TUHAN dan dalam pelayanan kepada raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di seberang Yordan ke arah barat,” yaitu di sisi barat Sungai Yordan.'
    reason: Menjelaskan ungkapan geografis Ibrani yang jika diterjemahkan secara harfiah dapat terdengar ambigu dalam bahasa Indonesia.
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  choice: Untuk kaum Hebron
  rationale: Bentuk ini menunjuk kepada kelompok keturunan Hebron dalam daftar pembagian tugas, bukan hanya kepada satu orang.
- source_word: חֲשַׁבְיָהוּ
  choice: Hasabya
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dan alami dalam bahasa Indonesia.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: Mempertahankan istilah kekerabatan Ibrani; dalam konteks kaum, cakupannya mungkin lebih luas daripada saudara kandung.
- source_word: בְּנֵי חַיִל
  choice: orang yang cakap
  rationale: Dalam konteks penugasan administratif, frasa ini menekankan kemampuan dan kecakapan, bukan terutama keberanian militer.
- source_word: עַל פְּקֻדַּת יִשְׂרָאֵל
  choice: bertugas mengawasi Israel
  rationale: פְּקֻדָּה dapat menyatakan pengawasan, tanggung jawab, atau jabatan; ungkapan ini mempertahankan nuansa tanggung jawab administratif tanpa mempersempit jenis tugasnya.
- source_word: מֵעֵבֶר לַיַּרְדֵּן מַעְרָבָה
  choice: di sebelah barat Sungai Yordan
  rationale: Ungkapan arah tersebut secara kontekstual menunjuk kepada wilayah di sisi barat Yordan; terjemahan utama dibuat jelas dan alami, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לְכֹל מְלֶאכֶת יְהוָה
  choice: dalam segala pekerjaan bagi TUHAN
  rationale: מְלָאכָה mencakup pekerjaan atau urusan secara luas; 'bagi' menyatakan bahwa tugas-tugas itu dilakukan untuk kepentingan pelayanan kepada TUHAN.
- source_word: וְלַעֲבֹדַת הַמֶּלֶךְ
  choice: dan dalam pelayanan kepada raja
  rationale: עֲבֹדָה di sini menyatakan pelayanan atau kewajiban kepada raja dan membedakannya dari pekerjaan bagi TUHAN.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: TUHAN
  alternative: Yahweh
  rationale: Dipakai bentuk kapital yang lazim dalam Alkitab bahasa Indonesia untuk menandai Tetragramaton sebagai nama ilahi, bukan sekadar gelar biasa. Alternatif transliterasi 'Yahweh' tetap mungkin karena teks Ibrani memuat nama pribadi tersebut.
- issue: Cakupan tugas kaum Hebron
  choice: mengawasi Israel
  alternative: mengurus urusan Israel
  rationale: Teks menyatakan tanggung jawab atas פְּקֻדַּת יִשְׂרָאֵל tanpa merinci apakah tugas itu terutama sipil, keagamaan, atau gabungan; terjemahan tidak mempersempitnya menjadi satu bidang tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah menandai keterangan jumlah tanpa memutus alur kalimat. Istilah 'saudara-saudaranya' mempertahankan keluwesan makna kekerabatan dalam konteks kaum.
