id: 1CH.26.26
reference: 1 Chronicles 26:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ה֧וּא שְׁלֹמ֣וֹת וְ/אֶחָ֗י/ו עַ֣ל כָּל אֹצְר֤וֹת הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר הִקְדִּ֜ישׁ דָּוִ֣יד הַ/מֶּ֗לֶךְ וְ/רָאשֵׁ֧י הָ/אָב֛וֹת לְ/שָׂרֵֽי הָ/אֲלָפִ֥ים וְ/הַ/מֵּא֖וֹת וְ/שָׂרֵ֥י הַ/צָּבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/026.yaml
  text: Shelomoth and his brothers were over all the treasuries of the holy things that King David[a], the heads of the fathers’ houses, the commanders of thousands and of hundreds[b], and the commanders of the army had dedicated.
translation:
  language: id
  text: Selomot dan saudara-saudaranya mengawasi semua perbendaharaan barang-barang kudus[a] yang telah dikhususkan oleh Raja Daud, para kepala kaum keluarga[b], para pemimpin pasukan seribu dan pasukan seratus, serta para panglima tentara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “barang-barang suci” atau “persembahan-persembahan yang dikhususkan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “para kepala kaum bapak,” yaitu istilah administratif berdasarkan kelompok keluarga atau leluhur.
    reason: cultural_note
lexical_decisions:
- source_word: הוּא שְׁלֹמוֹת וְאֶחָיו
  choice: Selomot dan saudara-saudaranya
  rationale: Pronomina tunggal הוּא berfungsi memperkenalkan atau menegaskan Selomot, lalu subjeknya diperluas oleh וְאֶחָיו. Bahasa Indonesia secara alami memakai subjek majemuk tanpa mempertahankan pronomina tunggal secara kaku.
- source_word: עַל
  choice: mengawasi
  rationale: Dalam konteks administratif, עַל menyatakan tanggung jawab atau kewenangan atas sesuatu. 'Mengawasi' ringkas, alami, dan tidak menyiratkan kepemilikan.
- source_word: כָּל אֹצְרוֹת
  choice: semua perbendaharaan
  rationale: אֹצָר dapat menunjuk tempat penyimpanan ataupun kekayaan yang disimpan. Dalam konteks tata kelola Bait Allah, 'perbendaharaan' mempertahankan nuansa kelembagaan itu.
- source_word: הַקֳּדָשִׁים
  choice: barang-barang kudus
  rationale: Bentuk jamak ini menunjuk benda-benda yang telah dipisahkan bagi penggunaan kudus. Terjemahan ini langsung dan tetap membiarkan konteks menentukan jenis bendanya.
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: yang telah dikhususkan
  rationale: Bentuk Hifil dari קדשׁ berarti menguduskan atau mengkhususkan bagi tujuan suci. 'Dikhususkan' alami untuk persembahan atau barang yang diserahkan bagi tempat kudus.
- source_word: דָּוִיד הַמֶּלֶךְ
  choice: Raja Daud
  rationale: Urutan gelar sebelum nama merupakan susunan yang alami dalam bahasa Indonesia.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: para kepala kaum keluarga
  rationale: Ungkapan ini merupakan istilah kekerabatan-administratif yang menunjuk para pemimpin kelompok keluarga leluhur. 'Kaum keluarga' lebih alami daripada terjemahan harfiah 'kaum bapak'.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: para pemimpin pasukan seribu dan pasukan seratus
  rationale: שַׂר menunjuk pejabat atau pemimpin, sedangkan 'seribu' dan 'seratus' adalah satuan organisasi militer. Penambahan 'pasukan' menjelaskan fungsi angka tanpa mengubah strukturnya menjadi jumlah yang harus selalu dipahami secara matematis.
- source_word: שָׂרֵי הַצָּבָא
  choice: para panglima tentara
  rationale: Dalam konteks ini צָבָא menunjuk angkatan militer, dan 'panglima tentara' merupakan padanan Indonesia yang jelas serta bermartabat.
theological_decisions:
- issue: Cakupan para pelaku yang mengkhususkan barang-barang kudus
  choice: Raja Daud dan semua kelompok yang disebut sesudahnya dipahami bersama-sama sebagai pihak yang mengkhususkan barang-barang itu.
  alternative: Hanya Daud yang mengkhususkan barang-barang tersebut, sedangkan kelompok-kelompok berikutnya memiliki hubungan sintaksis lain.
  rationale: Rangkaian unsur yang dihubungkan dengan וְ paling wajar dibaca sebagai daftar pelaku bersama, meskipun verba Ibraninya berbentuk tunggal dan muncul sebelum daftar itu berkembang. Struktur kalimat Indonesia mempertahankan semua pihak dalam satu rangkaian tanpa menambahkan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-administratif yang bermartabat. Nama שְׁלֹמוֹת ditransliterasikan sebagai 'Selomot'. Istilah militer dibuat jelas bagi pembaca umum, sedangkan ungkapan kekerabatan teknis dijelaskan melalui catatan kaki.
