base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/023.yaml
  text: For the Amramites[a], the Izharites, the Hebronites, and the Uzzielites.
translation:
  language: id
  text: Mengenai kaum Amram[a], kaum Yizhar, kaum Hebron, dan kaum Uziel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dari kaum Amram, kaum Yizhar, kaum Hebron, dan kaum Uziel.” Teks Ibrani hanya terdiri atas empat sebutan kaum dengan kata depan ל, yang berfungsi sebagai judul daftar.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעַמְרָמִי
  choice: Mengenai kaum Amram
  rationale: Prefiks ל pada bentuk nama kaum ini berfungsi sebagai penanda pokok atau judul dalam daftar. “Mengenai” menyampaikan fungsi tersebut secara alami tanpa menambahkan hubungan yang tidak dinyatakan.
- source_word: לַיִּצְהָרִי
  choice: kaum Yizhar
  rationale: Bentuk nisbah ini menunjuk kepada kelompok keturunan Yizhar. “Kaum Yizhar” ringkas, jelas, dan sesuai dengan pola penamaan kelompok keluarga dalam bahasa Indonesia.
- source_word: לַחֶבְרוֹנִי
  choice: kaum Hebron
  rationale: Bentuk nisbah ini adalah sebutan bagi kelompok keluarga yang berasal dari Hebron; “kaum Hebron” mempertahankan bentuk daftar.
- source_word: לָעָזִּיאֵלִי
  choice: dan kaum Uziel
  rationale: Bentuk nisbah terakhir menunjuk kepada kelompok keturunan Uziel. Kata “dan” ditambahkan agar rangkaian daftar terdengar alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Istilah “kaum” dipakai untuk menyatakan kelompok keturunan tanpa bentuk transliterasi nisbah yang terasa asing; ejaan nama mengikuti bentuk Indonesia yang dekat dengan nama Ibrani.
