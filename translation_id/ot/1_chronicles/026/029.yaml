base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/029.yaml
  text: For the Izharites[a], Chenaniah and his sons were assigned to the outside work over Israel, as officers and judges.
translation:
  language: id
  text: Dari kaum Yizhar, Kenanya dan anak-anak lelakinya ditugaskan untuk menangani tugas di luar[a] sebagai pejabat dan hakim atas Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya mungkin tugas-tugas di luar pelayanan pusat di tempat suci, termasuk tanggung jawab administratif dan peradilan di tengah Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִּצְהָרִי
  choice: Dari kaum Yizhar
  rationale: Prefiks לְ pada nama kaum memperkenalkan kelompok dalam daftar. “Dari kaum Yizhar” alami dalam bahasa Indonesia dan menyatakan asal keluarga Kenanya.
- source_word: כְּנַנְיָהוּ
  choice: Kenanya
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: וּבָנָיו
  choice: dan anak-anak lelakinya
  rationale: בָּנִים berbentuk maskulin dan dalam konteks keluarga ini secara khusus menunjuk kepada para anak lelaki.
- source_word: לַמְּלָאכָה הַחִיצוֹנָה
  choice: ditugaskan menangani urusan di luar
  rationale: מְלָאכָה menunjuk pada pekerjaan atau tugas, sedangkan הַחִיצוֹנָה berarti yang di luar. Ungkapan ini menyampaikan penugasan yang tersirat dalam daftar dan tetap mempertahankan cakupan frasa yang tidak dijelaskan sepenuhnya.
- source_word: עַל יִשְׂרָאֵל
  choice: bagi Israel
  rationale: עַל dapat menyatakan lingkup tanggung jawab atau kewenangan. “Bagi Israel” terdengar alami dan tidak memaksakan gambaran kekuasaan yang lebih kuat daripada konteks administratifnya.
- source_word: לְשֹׁטְרִים
  choice: sebagai pejabat
  rationale: שֹׁטְרִים di sini menunjuk kepada para petugas administratif, bukan polisi atau perwira militer. “Pejabat” menyatakan fungsi resmi tersebut.
- source_word: וּלְשֹׁפְטִים
  choice: dan hakim
  rationale: Istilah ini secara langsung menunjuk kepada orang-orang yang menjalankan fungsi pengadilan.
theological_decisions:
- issue: Ruang lingkup “urusan di luar”
  choice: Mempertahankan ungkapan umum dalam teks utama dan menjelaskannya secara terbatas dalam catatan kaki.
  alternative: Menuliskan secara eksplisit “urusan di luar pelayanan tempat suci” dalam teks utama.
  rationale: Teks Ibrani hanya menyebut pekerjaan atau urusan “di luar”; hubungan dengan pelayanan pusat tempat suci sangat mungkin, tetapi tidak dinyatakan secara eksplisit dan karena itu tidak dimasukkan langsung ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Urusan di luar” dipilih agar alami sekaligus mempertahankan ketidakjelasan ringkas dari ungkapan Ibrani; penjelasan kontekstual ditempatkan dalam catatan kaki.
