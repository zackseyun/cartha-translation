base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/022.yaml
  text: 'The sons of Jehieli: Zetham and Joel his brother were over the treasuries of the house of Yahweh[a].'
translation:
  language: id
  text: 'Anak-anak Yehieli: Zetam dan saudaranya, Yoel, bertanggung jawab atas perbendaharaan rumah Yahweh[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah Yahweh”; secara tradisional diterjemahkan “rumah TUHAN.”
    reason: Menjelaskan bentuk harfiah ungkapan Ibrani dan padanan tradisional bagi nama ilahi.
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן. Dalam konteks silsilah dan administrasi ini, makna langsung ‘anak-anak’ lebih tepat daripada ‘keturunan’.
- source_word: יְחִיאֵלִי
  choice: Yehieli
  rationale: Diperlakukan sebagai nama diri yang menerangkan kelompok anak-anak tersebut. Bentuknya juga dapat dipahami sebagai nisbah, ‘orang Yehiel’, tetapi konteks paralel mendukung nama diri.
- source_word: זֵתָם
  choice: Zetam
  rationale: Nama diri Ibrani yang dialihaksarakan secara wajar ke dalam bahasa Indonesia.
- source_word: וְיוֹאֵל
  choice: dan Yoel
  rationale: Nama diri dengan kata penghubung; dikoordinasikan langsung dengan Zetam.
- source_word: אָחִיו
  choice: saudaranya
  rationale: Nomina tunggal dengan sufiks orang ketiga maskulin tunggal. Terjemahan ini mempertahankan bentuk tunggal dan hubungan bahwa Yoel adalah saudara Zetam tanpa mengubahnya menjadi ‘saudara mereka’.
- source_word: עַל
  choice: bertanggung jawab atas
  rationale: Dalam konteks jabatan administratif, עַל menyatakan pengawasan atau tanggung jawab. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan fungsi tersebut.
- source_word: אֹצְרוֹת
  choice: perbendaharaan
  rationale: Dalam konteks pengelolaan rumah ibadah, kata ini menunjuk pada harta dan tempat penyimpanan yang dikelola sebagai perbendaharaan, bukan sekadar ‘harta’ pribadi.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: 'Menerjemahkan unsur-unsurnya secara langsung: בֵּית sebagai ‘rumah’ dan nama ilahi יהוה sebagai ‘Yahweh’. ‘Rumah’ dipertahankan daripada diperjelas menjadi ‘Bait Allah’ agar citra dan bentuk Ibraninya tetap tampak.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memuat nama perjanjian יהוה secara langsung. ‘Yahweh’ mempertahankan nama diri itu, sedangkan tradisi tertentu menggantinya dengan gelar ‘TUHAN’.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat yang ringkas dipertahankan, sementara verba tersirat dalam kalimat nominal Ibrani dinyatakan sebagai ‘bertanggung jawab’ agar alami dan jelas dalam bahasa Indonesia.
