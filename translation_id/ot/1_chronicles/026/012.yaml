base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/012.yaml
  text: For these divisions of the gatekeepers[a], the chief men had assigned duties corresponding to those of their brothers, to minister in the house of Yahweh.
translation:
  language: id
  text: Mengenai kelompok-kelompok penjaga gerbang ini, para pemimpin di antara orang-orang itu mempunyai tugas-tugas pelayanan[a] yang sejajar dengan saudara-saudara mereka, untuk melayani di rumah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “giliran-giliran jaga.” Teks Ibrani sangat ringkas. Kata yang diterjemahkan “tugas-tugas pelayanan” juga dapat berarti “giliran-giliran jaga” atau “penugasan pelayanan”; hubungan yang diterjemahkan “sejajar dengan” dapat pula berarti “bersama” atau “berhadapan dengan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֵלֶּה מַחְלְקוֹת
  choice: Mengenai kelompok-kelompok ... ini
  rationale: Frasa dengan לְאֵלֶּה memperkenalkan pokok yang dirangkum. Bentuk ini alami dalam bahasa Indonesia dan tetap mencerminkan arti “bagi/mengenai mereka ini,” tanpa memaksakan fungsi sintaksis yang terlalu sempit.
- source_word: הַשֹּׁעֲרִים
  choice: penjaga pintu gerbang
  rationale: Istilah ini menunjuk kepada petugas yang menjaga dan mengurus gerbang, bukan sekadar orang yang membuka pintu.
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: para pemimpin laki-laki
  rationale: רָאשֵׁי menyatakan orang-orang utama atau pemimpin, sedangkan גְּבָרִים dipertahankan sebagai sebutan laki-laki sesuai konteks historis para petugas Bait Allah.
- source_word: מִשְׁמָרוֹת
  choice: mendapat tugas jaga
  rationale: Kata benda ini dapat berarti giliran jaga, tugas, atau penugasan pelayanan. Karena klausa Ibrani bersifat eliptis, “mendapat” melengkapi predikasi secara wajar dalam bahasa Indonesia tanpa menyatakan siapa yang menugaskan.
- source_word: לְעֻמַּת אֲחֵיהֶם
  choice: seperti saudara-saudara mereka
  rationale: לְעֻמַּת menyatakan hubungan kesejajaran atau kesepadanan. “Seperti” mempertahankan hubungan tersebut tanpa menyatakan bahwa tugas mereka persis identik.
- source_word: לְשָׁרֵת
  choice: untuk melayani
  rationale: Dalam konteks rumah ibadah, kata ini menunjuk pada pelayanan resmi atau sakral; “melayani” merupakan ungkapan Indonesia yang alami dan cukup luas.
- source_word: בְּבֵית יְהוָה
  choice: di rumah Yahweh
  rationale: “Rumah” mempertahankan ungkapan Ibrani, sedangkan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh.”
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi, sehingga “Yahweh” mempertahankan bentuk nama itu dan membedakannya dari gelar umum.
- issue: Apakah גְּבָרִים diterjemahkan secara spesifik menurut gender
  choice: laki-laki
  alternative: orang-orang
  rationale: Bentuk Ibrani dan konteks historis merujuk kepada petugas laki-laki; terjemahan tidak dinetralkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan eliptis bahasa Ibrani diperjelas secukupnya dengan “mendapat,” sementara ragam arti מִשְׁמָרוֹת dan לְעֻמַּת tetap dicatat dalam catatan kaki.
