revisions:
- from: Mengenai kelompok-kelompok penjaga pintu gerbang ini, para pemimpin laki-laki mendapat tugas jaga[a] seperti saudara-saudara mereka untuk melayani di rumah Yahweh.
  to: Mengenai kelompok-kelompok penjaga gerbang ini, para pemimpin di antara orang-orang itu mempunyai tugas-tugas pelayanan[a] yang sejajar dengan saudara-saudara mereka, untuk melayani di rumah Yahweh.
  rationale: Revisi menghilangkan “mendapat,” yang menambahkan relasi penerimaan tugas yang tidak dinyatakan. Istilah untuk מִשְׁמָרוֹת dibuat lebih luas, dan hubungan לְעֻמַּת diterjemahkan lebih dekat. Nama Yahweh serta ungkapan “rumah Yahweh” dipertahankan.
