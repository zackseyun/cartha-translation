  text: 'And Shelemiah had sons: Zechariah the firstborn[a], Jediael the second, Zebadiah the third[b], and Jathniel the fourth.'
translation:
  language: id
  text: 'Dan Mesyelemya mempunyai anak-anak lelaki[a]: Zakharia, anak sulung; Yediael, anak kedua; Zebaja, anak ketiga; dan Yatniel, anak keempat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Dan bagi Mesyelemya, anak-anak lelaki,” suatu susunan silsilah Ibrani yang berarti bahwa Mesyelemya mempunyai anak-anak lelaki.'
    reason: cultural_note
lexical_decisions:
- source_word: וְלִמְשֶׁלֶמְיָהוּ בָּנִים
  choice: Meselemya mempunyai anak-anak lelaki
  rationale: Secara harfiah susunan Ibraninya berbunyi “dan bagi Meselemya, anak-anak lelaki.” Dalam daftar silsilah, “mempunyai anak-anak lelaki” menyampaikan maknanya secara wajar sambil mempertahankan bahwa בָּנִים merujuk kepada putra-putra.
- source_word: זְכַרְיָהוּ
  choice: Zakharia
  rationale: Bentuk nama yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: הַבְּכוֹר
  choice: anak sulung
  rationale: בְּכוֹר secara khusus menunjuk kepada anak yang lahir pertama, bukan sekadar yang lebih tua.
- source_word: יְדִיעֲאֵל
  choice: Yediael
  rationale: Transliterasi nama Ibrani yang sesuai dengan kebiasaan bahasa Indonesia.
- source_word: זְבַדְיָהוּ
  choice: Zebaja
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: יַתְנִיאֵל
  choice: Yatniel
  rationale: Transliterasi langsung yang mempertahankan bunyi konsonan awal yod sebagai “Y” dalam bahasa Indonesia.
- source_word: הַשֵּׁנִי ... הַשְּׁלִישִׁי ... הָרְבִיעִי
  choice: anak kedua ... anak ketiga ... anak keempat
  rationale: Bilangan tingkat diterjemahkan secara langsung dan konsisten; kata “anak” diulang agar daftar itu jelas dan alami dalam bahasa Indonesia.
