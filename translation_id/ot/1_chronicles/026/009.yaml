  - marker: a
    text: Secara harfiah, “bagi Mesyelemya”; ungkapan Ibrani ini memperkenalkan orang yang kelompoknya sedang dihitung.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang perkasa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/מְשֶֽׁלֶמְיָ֗הוּ
  choice: Selemya mempunyai
  rationale: Secara harfiah bentuk ini berarti “dan bagi Selemya”. Dalam konteks daftar dan penghitungan, preposisi לְ memperkenalkan orang yang sedang dibicarakan. Ungkapan “Selemya mempunyai” menyampaikan fungsi tersebut secara wajar dalam bahasa Indonesia.
- source_word: בָּנִים
  choice: anak-anak lelaki
  rationale: Kata Ibrani ini secara khusus menunjuk kepada keturunan laki-laki, sehingga tidak diterjemahkan dengan istilah umum “anak-anak” saja.
- source_word: וְ/אַחִים
  choice: dan saudara-saudara
  rationale: Makna lazim אַחִים adalah saudara laki-laki. Dalam bahasa Indonesia, “saudara-saudara” wajar dipakai bagi sejumlah saudara laki-laki dalam konteks silsilah ini, tanpa memperluasnya menjadi kerabat secara umum.
- source_word: בְּנֵי חָיִל
  choice: orang-orang tangguh
  rationale: Idiom yang secara harfiah berarti “anak-anak kekuatan/keperkasaan” menggambarkan laki-laki yang kuat, cakap, dan bernilai. “Orang-orang tangguh” mempertahankan cakupan itu dengan bahasa Indonesia modern dan alami.
- source_word: שְׁמוֹנָה עָשָׂר
  choice: delapan belas orang
  rationale: Bilangan pokok diterjemahkan secara langsung; kata “orang” ditambahkan agar penghitungan manusia terdengar alami dalam bahasa Indonesia.
