  text: And Shelemiah had sons and brothers[a], valiant men[b], eighteen.
translation:
  language: id
  text: Mesyelemya mempunyai anak-anak lelaki dan saudara-saudara laki-laki[a], semuanya orang-orang gagah perkasa[b], berjumlah delapan belas orang.
  philosophy: optimal-equivalence
