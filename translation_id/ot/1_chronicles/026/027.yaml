base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/027.yaml
  text: From the wars and from the spoil they had dedicated things to strengthen the house of Yahweh.
translation:
  language: id
  text: Dari peperangan dan dari jarahan, mereka telah mendedikasikan barang-barang[a] untuk memperkuat Bait Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Objek dari kata kerja ini tidak disebutkan dalam teks Ibrani; "barang-barang" dilengkapi dalam terjemahan. "Jarahan" juga dapat diterjemahkan "rampasan perang."
    reason: Menjelaskan objek tersirat yang dilengkapi dalam terjemahan dan mencatat alternatif leksikal bagi שָׁלָל.
lexical_decisions:
- source_word: מִן הַמִּלְחָמוֹת
  choice: Dari peperangan
  rationale: מִן menyatakan sumber atau asal, sedangkan bentuk jamak מִלְחָמוֹת dapat dipahami secara kolektif sebagai berbagai peperangan. Ungkapan ini dipertahankan dekat dengan bentuk Ibrani.
- source_word: וּמִן הַשָּׁלָל
  choice: dan dari jarahan
  rationale: שָׁלָל menunjuk pada barang yang dirampas dalam perang; 'jarahan' merupakan padanan Indonesia yang alami dan tepat dalam konteks militer.
- source_word: הִקְדִּישׁוּ
  choice: mereka telah mengkhususkan barang-barang
  rationale: Bentuk Hifil dari קדשׁ berarti menjadikan khusus atau menyisihkan bagi tujuan suci. 'Barang-barang' ditambahkan demi kelancaran bahasa Indonesia, tetapi diberi catatan karena objeknya tidak dinyatakan dalam teks Ibrani. 'Telah' mencerminkan tindakan yang sudah selesai dalam konteks narasi.
- source_word: לְחַזֵּק
  choice: untuk memperkuat
  rationale: Infinitif חזק secara dasar berarti membuat kuat. 'Memperkuat' mempertahankan makna itu tanpa membatasi maksudnya hanya pada perbaikan atau pemeliharaan.
- source_word: לְבֵית יְהוָה
  choice: rumah Yahweh
  rationale: '''Rumah'' mempertahankan idiom Ibrani yang merujuk pada tempat suci atau bait, sedangkan nama ilahi יְהוָה ditransliterasikan sebagai ''Yahweh''.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יהוה secara langsung. 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Nuansa sakral הִקְדִּישׁוּ
  choice: mengkhususkan
  alternative: menguduskan atau mempersembahkan
  rationale: '''Mengkhususkan'' menyampaikan tindakan menyisihkan bagi penggunaan suci tanpa menyiratkan bahwa barang-barang itu sendiri mengalami perubahan moral, sementara konteks rumah Yahweh tetap menunjukkan tujuan sakralnya.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan sumber dipertahankan sejauh tetap jelas; istilah 'rumah Yahweh' menjaga idiom sumber, dan catatan kaki mempertahankan ketidakjelasan objek dalam bahasa Ibrani.
