  text: וְ/לִֽ/שְׁמַֽעְיָ֤ה בְנ/וֹ֙ נוֹלַ֣ד בָּנִ֔ים הַ/מִּמְשָׁלִ֖ים לְ/בֵ֣ית אֲבִי/הֶ֑ם כִּֽי גִבּ֥וֹרֵי חַ֖יִל הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/006.yaml
  text: And to Shemaiah his son[a], sons were born who ruled over their fathers’ house[b], for they were mighty men of valor.
translation:
  language: id
  text: Bagi Semaya, anaknya, lahirlah anak-anak lelaki yang berkuasa[a] atas kaum keluarga ayah mereka, sebab mereka adalah orang-orang yang gagah perkasa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “yang menjadi para pemimpin kaum keluarga ayah mereka.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini dapat menunjuk kepada orang-orang yang terbukti kuat, berani, cakap, atau terpandang, dan tidak selalu hanya kepada para pejuang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁמַעְיָה בְנוֹ
  choice: Bagi Semaya, anaknya
  rationale: Konstruksi dengan לְ dalam rumus kelahiran paling wajar diterjemahkan “bagi”; “anaknya” mempertahankan hubungan Semaya dengan tokoh yang disebut sebelumnya.
- source_word: נוֹלַד בָּנִים
  choice: lahirlah anak-anak lelaki
  rationale: Walaupun verba Ibraninya berbentuk tunggal, subjek efektifnya jamak. “Anak-anak lelaki” mempertahankan makna khusus בָּנִים.
- source_word: הַמִּמְשָׁלִים
  choice: yang berkuasa atas
  rationale: Bentuk ini berasal dari משל dalam arti memerintah atau menjalankan wewenang; pilihan ini mempertahankan gagasan otoritas tanpa sekadar memberi gelar.
- source_word: לְבֵית אֲבִיהֶם
  choice: atas kaum keluarga ayah mereka
  rationale: בֵּית אָב menunjuk pada satuan keluarga besar atau kaum berdasarkan garis ayah, bukan semata-mata sebuah bangunan. Bentuk sumber secara harfiah memakai “ayah mereka”.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan mereka memegang kekuasaan.
- source_word: גִבּוֹרֵי חַיִל
  choice: orang-orang yang gagah perkasa
  rationale: Ungkapan ini menyatakan kekuatan, keberanian, kemampuan, atau kedudukan yang terbukti. Pilihan tersebut menjaga daya ungkapnya tanpa membatasinya pada prajurit.
- source_word: הֵמָּה
  choice: mereka adalah
  rationale: Pronomina mandiri memberi penegasan pada identitas atau sifat mereka; susunan Indonesia ini menyampaikannya secara wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kaum keluarga ayah mereka” dipilih untuk mengungkapkan satuan keluarga besar menurut garis ayah, sedangkan “gagah perkasa” mempertahankan kekuatan ungkapan Ibrani dengan catatan kaki yang menjelaskan keluasan maknanya.
