base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/018.yaml
  text: 'For the Parbar on the west: four at the road[b][a], and two at the Parbar.'
translation:
  language: id
  text: 'Untuk Parbar[a] di sebelah barat: empat orang di jalan[b] dan dua orang di Parbar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Parbar adalah istilah Ibrani yang jarang dipakai. Arti tepat dan bagian bangunan yang dimaksud tidak pasti; mungkin berarti kawasan, pelataran, bangunan tambahan, atau, menurut terjemahan tradisional, daerah pinggiran.
    reason: lexical_alternative
  - marker: b
    text: Atau “jalan raya” atau “jalan yang ditinggikan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּרְבָּר
  choice: Parbar
  rationale: Istilah Ibrani ini sangat jarang dan acuan arsitekturalnya tidak pasti. Transliterasi mempertahankan ketidakpastian itu tanpa memaksakan arti seperti serambi, pelataran, bangunan tambahan, atau kawasan.
- source_word: מַעֲרָב
  choice: di sebelah barat
  rationale: Menunjukkan arah atau sisi barat dan diterjemahkan secara alami dalam bahasa Indonesia.
- source_word: אַרְבָּעָה
  choice: empat orang
  rationale: Bilangan ini menyatakan jumlah para penjaga pintu yang ditempatkan; kata 'orang' ditambahkan dari konteks agar kalimat Indonesia jelas.
- source_word: מְסִלָּה
  choice: jalan
  rationale: Kata ini dapat menunjuk jalan, jalan raya, atau jalan yang ditinggikan. 'Jalan' merupakan padanan yang alami dan cukup netral, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: שְׁנַיִם
  choice: dua orang
  rationale: Bilangan ini menyatakan jumlah kedua para penjaga pintu; 'orang' ditambahkan secara kontekstual demi kejelasan.
- source_word: לְ
  choice: untuk / di
  rationale: Preposisi yang berulang menandai penugasan menurut lokasi; bentuknya disesuaikan secara idiomatis dengan hubungan masing-masing frasa.
