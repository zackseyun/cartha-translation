revisions:
- from: Segala sesuatu yang telah dipersembahkan sebagai barang kudus oleh Samuel, sang pelihat[a], Saul anak Kish, Abner anak Ner, dan Yoab anak Zeruya—segala sesuatu yang dipersembahkan sebagai barang kudus oleh siapa pun—berada di bawah pengawasan[b] Selomit dan saudara-saudaranya.[c]
  to: Segala sesuatu yang telah dikhususkan oleh Samuel, sang pelihat[a], Saul anak Kish, Abner anak Ner, dan Yoab anak Zeruya—segala sesuatu yang dikhususkan—berada di bawah pengawasan[b] Selomit dan saudara-saudaranya.
  rationale: Revisi mengganti ungkapan yang lebih eksplikatif dengan “dikhususkan”, yang mencerminkan tindakan dedikasi sakral dalam teks Ibrani tanpa menambahkan “barang”. Pengulangan “segala sesuatu” dipertahankan. Catatan alternatif tentang “kerabat” dihapus karena “saudara-saudaranya” merupakan terjemahan langsung dan memadai.
