  text: וְ/כֹ֨ל הַֽ/הִקְדִּ֜ישׁ שְׁמוּאֵ֤ל הָ/רֹאֶה֙ וְ/שָׁא֣וּל בֶּן קִ֔ישׁ וְ/אַבְנֵ֣ר בֶּן נֵ֔ר וְ/יוֹאָ֖ב בֶּן צְרוּיָ֑ה כֹּ֚ל הַ/מַּקְדִּ֔ישׁ עַ֥ל יַד שְׁלֹמִ֖ית וְ/אֶחָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/028.yaml
  text: And all that Samuel the seer[a], Saul son of Kish, Abner son of Ner[b], and Joab son of Zeruiah had dedicated—everything that anyone had dedicated—was under the care of Shelomith and his brothers.
translation:
  language: id
  text: Segala sesuatu yang telah dikhususkan oleh Samuel, sang pelihat[a], Saul anak Kish, Abner anak Ner, dan Yoab anak Zeruya—segala sesuatu yang dikhususkan—berada di bawah pengawasan[b] Selomit dan saudara-saudaranya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pelihat” menerjemahkan gelar Ibrani רֹאֶה (ro’eh), istilah lama bagi seorang tokoh kenabian.
    reason: cultural_note
  - marker: b
    text: Atau “berada dalam tanggung jawab”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: Segala sesuatu
  rationale: כֹל menunjuk secara menyeluruh pada barang-barang kudus dalam konteks perbendaharaan; ungkapan ini alami sekaligus mempertahankan cakupan totalnya.
- source_word: הַהִקְדִּישׁ
  choice: telah dipersembahkan sebagai barang kudus
  rationale: Bentuk Hifil dari קדשׁ menyatakan tindakan mengkhususkan benda bagi penggunaan atau kepemilikan suci. Frasa ini lebih jelas dalam bahasa Indonesia modern daripada sekadar 'dikuduskan'.
- source_word: שְׁמוּאֵל הָרֹאֶה
  choice: Samuel, sang pelihat
  rationale: רֹאֶה adalah gelar lama bagi tokoh kenabian. 'Pelihat' mempertahankan istilah khusus Ibrani dan tidak menyamakannya begitu saja dengan istilah umum 'nabi'.
- source_word: בֶּן
  choice: anak
  rationale: Rumus silsilah ini secara langsung menyatakan hubungan anak laki-laki dengan ayahnya; 'anak' merupakan padanan Indonesia yang wajar.
- source_word: צְרוּיָה
  choice: Zeruya
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: כֹּל הַמַּקְדִּישׁ
  choice: segala sesuatu yang dipersembahkan sebagai barang kudus oleh siapa pun
  rationale: Partisip tunggal dengan כֹּל bersifat kolektif dan merangkum semua persembahan kudus, tanpa membatasi tindakan itu hanya kepada tokoh-tokoh yang baru disebutkan.
- source_word: עַל יַד
  choice: berada di bawah pengawasan
  rationale: Dalam konteks administrasi, idiom ini menunjukkan bahwa sesuatu berada dalam tanggung jawab atau pengelolaan seseorang, bukan secara harfiah berada 'di atas tangan'.
- source_word: שְׁלֹמִית
  choice: Selomit
  rationale: Nama diri ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: Bentuk jamak dengan akhiran orang ketiga tunggal maskulin paling langsung berarti saudara-saudara laki-laki Selomit, tetapi dalam konteks kelompok keluarga dapat pula mencakup kerabat dekat.
