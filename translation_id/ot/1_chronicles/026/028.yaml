translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Pengulangan 'segala sesuatu ... segala sesuatu' dipertahankan untuk mencerminkan struktur rangkuman dalam bahasa Ibrani. Frasa 'dipersembahkan sebagai barang kudus' dipilih agar tindakan pengkhususan sakral atas benda-benda tetap jelas tanpa terdengar terlalu teknis.
