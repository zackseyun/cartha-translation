  naturalness: Kalimatnya pada dasarnya jelas, tetapi ‘kaum keluarga leluhur mereka’ terdengar janggal dalam bahasa Indonesia modern. ‘Kelompok keluarga dari garis ayah mereka’ lebih jelas dan alami dalam konteks pengaturan tugas berdasarkan rumah bapa.
  terminology: ‘Membuang undi’ dan ‘pintu gerbang’ sesuai register Alkitab bahasa Indonesia. Catatan a sebaiknya dihapus karena ‘tingkat kepentingan’ tidak didukung secara langsung oleh frasa yang dalam konteks ini merujuk pada orang-orang; catatan itu juga tidak diperlukan untuk mempertahankan ambiguitas teks.
