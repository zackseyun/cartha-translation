  text: And they cast lots[a], small and great alike, according to their fathers’ houses, for each gate.
translation:
  language: id
  text: Mereka membuang undi, baik yang kecil maupun yang besar, sesuai dengan kelompok keluarga dari garis ayah mereka, untuk setiap pintu gerbang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk pintu gerbang demi pintu gerbang.” Bahasa Ibrani mengulang kata benda tunggal untuk menyatakan makna distributif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ גוֹרָלוֹת
  choice: membuang undi
  rationale: Ini adalah ungkapan baku bahasa Ibrani untuk menentukan pembagian melalui undian; terjemahan harfiah seperti “menjatuhkan undi-undian” tidak wajar dalam bahasa Indonesia.
- source_word: כַּקָּטֹן כַּגָּדוֹל
  choice: baik yang kecil maupun yang besar
  rationale: Mempertahankan pasangan idiomatis Ibrani dan gagasan bahwa keduanya diperlakukan tanpa pembedaan, tanpa mempersempit maknanya hanya pada umur atau kedudukan.
- source_word: לְבֵית אֲבוֹתָם
  choice: menurut kaum keluarga leluhur mereka
  rationale: Merujuk pada satuan keluarga atau marga yang ditelusuri melalui garis leluhur; “menurut” menyampaikan dasar pengelompokan dalam pembagian tugas.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: untuk tiap-tiap pintu gerbang
  rationale: Pengulangan kata benda tunggal dalam bahasa Ibrani bersifat distributif, yakni penetapan dilakukan bagi masing-masing pintu gerbang.
theological_decisions:
- issue: Cakupan ungkapan “yang kecil maupun yang besar”
  choice: Mempertahankan ungkapan umum tanpa menentukan apakah perbedaannya menyangkut umur, kedudukan, atau tingkat kepentingan.
  alternative: “yang muda maupun yang tua” atau “yang rendah maupun yang terkemuka”
  rationale: Teks Ibrani tidak menjelaskan dasar perbedaan itu; terjemahan yang lebih khusus akan menutup ambiguitas yang asli.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. “Membuang undi” merupakan ungkapan yang lazim; “kaum keluarga leluhur” mempertahankan struktur sosial keluarga dalam konteks Israel kuno tanpa memakai istilah teknis yang sukar dipahami.
