- from: Semua orang ini berasal dari keturunan Obed-Edom. Mereka, anak-anak mereka, dan saudara-saudara mereka[a] adalah orang-orang cakap[b] yang kuat untuk menjalankan tugas itu. Jumlah orang dari keluarga Obed-Edom adalah enam puluh dua orang.
  to: Semua orang ini adalah keturunan Obed-Edom. Mereka, anak-anak mereka, dan saudara-saudara mereka[a] adalah orang-orang cakap dan kuat untuk pelayanan. Jumlah keturunan Obed-Edom itu adalah enam puluh dua orang.
