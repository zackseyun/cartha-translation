    text: Atau “kerabat laki-laki mereka”; kata Ibrani yang diterjemahkan “saudara-saudara” dapat dipakai secara lebih luas untuk kerabat laki-laki dalam satu kaum.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani yang diterjemahkan “orang-orang cakap” juga dapat berarti “orang-orang gagah perkasa” atau “orang-orang yang tangguh”. Dalam konteks ini, ungkapan tersebut menekankan kemampuan mereka untuk melaksanakan pelayanan.
    reason: lexical_alternative
