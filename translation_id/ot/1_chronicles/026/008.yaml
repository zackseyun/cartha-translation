base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/008.yaml
  text: All these were from the sons of Obed-edom—they and their sons and their brothers, able men with strength for the service—sixty-two belonging to Obed-edom.
translation:
  language: id
  text: Semua orang ini adalah keturunan Obed-Edom. Mereka, anak-anak mereka, dan saudara-saudara mereka[a] adalah orang-orang cakap dan kuat untuk pelayanan. Jumlah keturunan Obed-Edom itu adalah enam puluh dua orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerabat laki-laki mereka”; kata Ibrani yang diterjemahkan “saudara-saudara” dapat dipakai secara lebih luas untuk kerabat laki-laki dalam satu kaum.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי עֹבֵד אֱדֹם
  choice: berasal dari keturunan Obed-Edom
  rationale: Ungkapan ini menunjukkan keanggotaan dalam garis keluarga Obed-Edom. Dalam konteks silsilah, 'keturunan' lebih wajar dan tidak membatasi maknanya hanya pada anak kandung langsung.
- source_word: הֵמָּה וּבְנֵיהֶם וַאֲחֵיהֶם
  choice: mereka, anak-anak mereka, dan saudara-saudara mereka
  rationale: Terjemahan ini mempertahankan tiga kelompok yang disebutkan secara eksplisit. 'Saudara-saudara' mempertahankan arti dasar אֲחֵיהֶם, sementara kemungkinan makna kerabat laki-laki yang lebih luas dicatat dalam catatan kaki.
- source_word: אִישׁ חַיִל
  choice: orang-orang cakap
  rationale: Dalam konteks penugasan pelayanan, ungkapan ini menekankan kemampuan dan kelayakan, bukan semata-mata keberanian dalam perang. Pilihan ini juga tetap membedakannya dari frasa berikutnya yang secara khusus menyebut kekuatan.
- source_word: בַּכֹּחַ
  choice: yang kuat
  rationale: Pilihan ini menyampaikan makna konkret כֹּחַ sebagai kekuatan dan menghubungkannya secara alami dengan kecakapan mereka untuk bertugas.
- source_word: לַעֲבֹדָה
  choice: untuk menjalankan tugas itu
  rationale: Dalam konteks 1 Tawarikh 26, עֲבֹדָה menunjuk pada pekerjaan atau pelayanan yang ditugaskan kepada para penjaga pintu. 'Tugas' terdengar alami tanpa mempersempitnya melampaui konteks.
- source_word: שִׁשִּׁים וּשְׁנַיִם לְעֹבֵד אֱדֹם
  choice: Jumlah orang dari keluarga Obed-Edom adalah enam puluh dua orang
  rationale: Frasa penutup merangkum jumlah yang terkait dengan garis keluarga Obed-Edom. Susunan ini jelas dan alami dalam bahasa Indonesia.
