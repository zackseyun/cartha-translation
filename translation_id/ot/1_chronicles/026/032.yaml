base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/032.yaml
  text: And his brothers[a], valiant men, were two thousand seven hundred heads of fathers’ houses; and King David appointed them over the Reubenites, the Gadites, and the half-tribe of Manasseh for every matter of God and of the king.
translation:
  language: id
  text: Saudara-saudaranya, orang-orang perkasa, berjumlah dua ribu tujuh ratus orang dan merupakan kepala-kepala kaum keluarga. Raja Daud mengangkat mereka untuk mengawasi orang Ruben, orang Gad, dan setengah suku Manasye dalam segala urusan Allah dan urusan raja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “untuk segala perkara Allah dan perkara raja.”'
    reason: Alternatif leksikal untuk דָּבָר, yang dapat berarti ‘urusan’, ‘perkara’, atau ‘kepentingan’; pengulangan ini mempertahankan kesejajaran dua frasa Ibrani.
lexical_decisions:
- source_word: וְאֶחָיו
  choice: Saudara-saudaranya
  rationale: Bentuk jamak maskulin dengan sufiks orang ketiga tunggal merujuk kembali kepada Hasabya pada ayat sebelumnya. Pilihan ini mempertahankan arti langsung ‘saudara-saudara’, meskipun dalam konteks kaum dapat mencakup kerabat laki-laki.
- source_word: בְּנֵי חַיִל
  choice: orang-orang perkasa
  rationale: Ungkapan ini menyatakan kekuatan, keberanian, atau kecakapan. ‘Orang-orang perkasa’ mempertahankan daya idiom Ibrani tanpa membatasinya hanya pada kecakapan administratif.
- source_word: אַלְפַּיִם וּשְׁבַע מֵאוֹת
  choice: 2.700 orang
  rationale: Bilangan kardinal diterjemahkan langsung; ‘orang’ ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas bahwa angka tersebut menghitung para saudara yang disebut.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: kepala kaum keluarga
  rationale: Ungkapan teknis ini menunjuk para pemimpin kelompok keluarga atau wangsa leluhur. ‘Kepala kaum keluarga’ alami dalam bahasa Indonesia dan mempertahankan struktur sosial-genealogisnya.
- source_word: וַיַּפְקִידֵם
  choice: mengangkat mereka
  rationale: Bentuk Hifil dari פקד di sini berarti menetapkan atau menugaskan seseorang dalam jabatan pengawasan. ‘Mengangkat’ menampilkan sifat resmi penugasan itu.
- source_word: עַל
  choice: untuk mengawasi
  rationale: Dalam konteks administratif, preposisi ini menandai wewenang atau tanggung jawab atas kelompok-kelompok yang disebut. Ungkapan ini lebih alami daripada terjemahan harfiah ‘atas’.
- source_word: הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: orang Ruben, orang Gad, dan setengah suku Manasye
  rationale: Bentuk gentilik tunggal Ibrani dipakai secara kolektif. Bahasa Indonesia secara alami menyatakannya sebagai ‘orang Ruben’ dan ‘orang Gad’, sedangkan pembagian suku Manasye dipertahankan secara eksplisit.
- source_word: לְכָל דְּבַר הָאֱלֹהִים וּדְבַר הַמֶּלֶךְ
  choice: dalam segala urusan Allah dan raja
  rationale: דבר dapat berarti perkara, urusan, atau kepentingan. ‘Urusan’ sesuai dengan konteks administratif dan bentuk ringkas ini mempertahankan kesejajaran antara lingkup ilahi dan kerajaan tanpa menjelaskannya secara berlebihan.
theological_decisions:
- issue: Lingkup tanggung jawab yang berkaitan dengan Allah dan raja
  choice: Para pemimpin itu bertanggung jawab atas segala urusan Allah dan raja.
  alternative: Para pemimpin itu menangani semua pekerjaan Allah dan pelayanan kepada raja.
  rationale: Teks membedakan dua lingkup tanggung jawab, yaitu yang berkaitan dengan Allah dan yang berkaitan dengan raja, tetapi tidak menjelaskan hubungan hierarkis antara keduanya. Terjemahan menghindari pemasukan kategori teologis atau politik yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dipecah menjadi dua agar daftar jabatan dan tanggung jawab mudah dipahami, tanpa menghilangkan hubungan antarklausa dalam teks Ibrani. Penulisan angka mengikuti kebiasaan Indonesia.
