base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/014.yaml
  text: The lot for the east fell to Shelemyahu. Then they cast lots for his son Zekaryahu[a], a counselor with insight, and his lot came out for the north.
translation:
  language: id
  text: Undi untuk sebelah timur jatuh kepada Selemya. Kemudian mereka membuang undi bagi Zakharia, anaknya, seorang penasihat yang penuh pengertian,[a] dan hasil undinya adalah sebelah utara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang penasihat yang bijaksana.” Secara harfiah, frasa Ibrani menggambarkan Zakharia sebagai “penasihat dengan pengertian/kebijaksanaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל הַגּוֹרָל
  choice: Undi ... jatuh
  rationale: Mempertahankan gambaran konkret idiom Ibrani נפל + גורל sekaligus tetap wajar dalam bahasa Indonesia Alkitabiah.
- source_word: מִזְרָחָה
  choice: untuk sebelah timur
  rationale: Akhiran penunjuk arah dipahami dalam konteks pembagian tugas sebagai wilayah atau gerbang yang ditetapkan.
- source_word: לְשֶׁלֶמְיָהוּ
  choice: kepada Selemya
  rationale: Preposisi ל menandai penerima hasil undian; bentuk nama mengikuti ejaan Indonesia yang lazim.
- source_word: וּזְכַרְיָהוּ בְנוֹ
  choice: Kemudian ... bagi Zakharia, anaknya
  rationale: Waw disampaikan sebagai kelanjutan urutan peristiwa, sedangkan hubungan Zakharia sebagai anak Selemya dipertahankan dengan jelas.
- source_word: יוֹעֵץ בְּשֶׂכֶל
  choice: seorang penasihat yang berpengertian
  rationale: 'Mempertahankan kedua unsur frasa: peran sebagai penasihat dan sifat wawasan, kecakapan, atau kebijaksanaan praktis.'
- source_word: הִפִּילוּ גּוֹרָלוֹת
  choice: mereka membuang undi
  rationale: Ungkapan Indonesia yang lazim untuk tindakan menentukan pembagian melalui undian.
- source_word: וַיֵּצֵא גוֹרָלוֹ
  choice: dan undinya keluar
  rationale: Mencerminkan verba יצא dan membedakannya dari idiom undi 'jatuh' pada awal ayat.
- source_word: צָפוֹנָה
  choice: untuk sebelah utara
  rationale: Menunjukkan wilayah penugasan dan sejajar dengan frasa 'untuk sebelah timur'.
