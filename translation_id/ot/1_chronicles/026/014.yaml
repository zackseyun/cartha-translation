  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah 'membuang undi' dipertahankan sebagai ungkapan yang dikenal luas, dan struktur ayat dibuat alami tanpa menghilangkan perbedaan antara verba 'jatuh' dan 'keluar' dalam teks Ibrani.
