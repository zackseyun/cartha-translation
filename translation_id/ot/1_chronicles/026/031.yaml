  text: לַֽ/חֶבְרוֹנִי֙ יְרִיָּ֣ה הָ/רֹ֔אשׁ לַֽ/חֶבְרוֹנִ֥י לְ/תֹלְדֹתָ֖י/ו לְ/אָב֑וֹת בִּ/שְׁנַ֨ת הָֽ/אַרְבָּעִ֜ים לְ/מַלְכ֤וּת דָּוִיד֙ נִדְרָ֔שׁוּ וַ/יִּמָּצֵ֥א בָ/הֶ֛ם גִּבּ֥וֹרֵי חַ֖יִל בְּ/יַעְזֵ֥יר גִּלְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/031.yaml
  text: For the Hebronites[a], Jeriah was the chief of the Hebronites according to his generations by fathers’ houses. In the fortieth year of David’s reign they were sought out[c][b], and among them mighty men of valor were found at Jazer of Gilead.
translation:
  language: id
  text: Mengenai kaum Hebron, Yerija adalah kepala kaum Hebron menurut silsilahnya, menurut kaum-kaum leluhurnya.[a] Pada tahun keempat puluh pemerintahan Daud, mereka ditelusuri,[b] dan di antara mereka ditemukan orang-orang gagah perkasa[c] di Yaazer, di Gilead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kaum-kaum leluhur” menunjuk pada kelompok kekerabatan berdasarkan leluhur bersama, bukan hanya keluarga inti.
    reason: cultural_note
  - marker: b
    text: Atau “mereka dicari” atau “mereka diperiksa.” Kata Ibrani dapat menunjuk pada pencarian atau penyelidikan resmi, mungkin berkaitan dengan silsilah mereka.
    reason: lexical_alternative
  - marker: c
    text: Atau “para pejuang perkasa” atau “orang-orang yang cakap.” Ungkapan Ibrani dapat menunjuk pada kekuatan, keberanian, atau kemampuan yang terbukti.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֶבְרוֹנִי ... לַחֶבְרוֹנִי
  choice: Mengenai orang Hebron, Yeria adalah kepala mereka
  rationale: Kata depan ל pertama memperkenalkan kaum Hebron sebagai topik, sedangkan pengulangannya menunjukkan kelompok yang dikepalai Yeria. Kata ganti “mereka” menghindari pengulangan yang kaku tanpa menghilangkan hubungan itu.
- source_word: יְרִיָּה
  choice: Yeria
  rationale: Bentuk nama ini mengikuti bunyi teks Ibrani dan ejaan nama yang wajar dalam bahasa Indonesia.
- source_word: הָרֹאשׁ
  choice: kepala
  rationale: Dalam konteks silsilah dan tata kepemimpinan, רֹאשׁ menunjuk kepada pemimpin utama suatu kelompok; “kepala” mempertahankan metafora dan nuansa administratifnya.
- source_word: לְתֹלְדֹתָיו לְאָבוֹת
  choice: menurut garis keturunan dan kaum keluarga leluhur mereka
  rationale: Ungkapan ini menggabungkan susunan menurut keturunan dengan kelompok kekerabatan berdasarkan leluhur. “Kaum keluarga leluhur” lebih luas daripada keluarga inti.
- source_word: בִּשְׁנַת הָאַרְבָּעִים לְמַלְכוּת דָּוִיד
  choice: Pada tahun keempat puluh pemerintahan Daud
  rationale: Ini merupakan rumus penanggalan berdasarkan masa pemerintahan raja; “pemerintahan” alami dan tepat dalam bahasa Indonesia.
- source_word: נִדְרָשׁוּ
  choice: mereka ditelusuri
  rationale: Bentuk pasif Niphal dipertahankan. Dalam konteks silsilah-administratif, kata ini menyiratkan pencarian atau pemeriksaan yang disengaja, tetapi objek persis penelusurannya tidak disebutkan.
- source_word: וַיִּמָּצֵא בָהֶם
  choice: di antara mereka ditemukan
  rationale: Walaupun verba Ibraninya berbentuk tunggal, susunan ini berfungsi secara impersonal dan diikuti kelompok jamak; bentuk pasif Indonesia menyampaikan maksudnya dengan alami.
- source_word: גִּבּוֹרֵי חַיִל
  choice: orang-orang yang gagah perkasa
  rationale: Ungkapan tetap ini dapat menyatakan kekuatan, keberanian, kecakapan, atau kemampuan berperang. Pilihan ini mempertahankan keluasan makna tanpa membatasinya hanya kepada prajurit.
- source_word: בְּיַעְזֵיר גִּלְעָד
  choice: di Yaezer, Gilead
  rationale: Frasa ini menyebut tempat ditemukannya mereka. Tanda koma menyajikan Gilead sebagai wilayah tempat Yaezer berada tanpa menambahkan relasi yang tidak dinyatakan secara eksplisit.
