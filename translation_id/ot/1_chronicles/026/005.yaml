  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַמִּיאֵ֤ל הַ/שִּׁשִּׁי֙ יִשָׂשכָ֣ר הַ/שְּׁבִיעִ֔י פְּעֻלְּתַ֖י הַ/שְּׁמִינִ֑י כִּ֥י בֵרֲכ֖/וֹ אֱלֹהִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/005.yaml
  text: Ammiel the sixth[a], Issachar the seventh, Peullethai the eighth; for God had blessed him.
translation:
  language: id
  text: Amiel, yang keenam; Isakhar, yang ketujuh; dan Peuletai, yang kedelapan, sebab Allah telah memberkatinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “-nya” kemungkinan besar merujuk kepada Obed-Edom, ayah dari anak-anak yang disebutkan dalam konteks; teks Ibrani hanya memakai kata ganti tunggal.
    reason: referential_ambiguity
lexical_decisions:
- source_word: עַמִּיאֵל
  choice: Amiel
  rationale: Nama diri ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia.
- source_word: הַשִּׁשִּׁי
  choice: yang keenam
  rationale: Bilangan bertingkat dengan kata sandang, sejajar dengan urutan anak-anak dalam konteks.
- source_word: יִשָׂשכָר
  choice: Isakhar
  rationale: Nama diri ini memakai bentuk Indonesia yang lazim, meskipun di bagian lain juga merupakan nama suku.
- source_word: הַשְּׁבִיעִי
  choice: yang ketujuh
  rationale: Mempertahankan bentuk bilangan bertingkat dan kesejajarannya dalam daftar.
- source_word: פְּעֻלְּתַי
  choice: Peuletai
  rationale: Transliterasi nama diri yang mencerminkan vokalisasi Ibrani dan tetap mudah dibaca dalam bahasa Indonesia.
- source_word: הַשְּׁמִינִי
  choice: yang kedelapan
  rationale: Melengkapi urutan dalam daftar dengan bentuk bilangan bertingkat yang alami.
- source_word: כִּי
  choice: sebab
  rationale: Mengungkapkan fungsi penjelas atau alasan dari klausa Ibrani tanpa mempersempit maknanya.
- source_word: בֵרֲכוֹ
  choice: telah memberkatinya
  rationale: Bentuk perfek menyatakan tindakan pemberkatan Allah; sufiks orang ketiga tunggal dipertahankan tanpa menyebut referennya secara eksplisit.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Padanan baku bahasa Indonesia untuk sebutan Ibrani bagi Allah dalam konteks tunggal ini.
theological_decisions:
- issue: Referen sufiks orang ketiga tunggal pada בֵרֲכוֹ
  choice: Dibiarkan sebagai “-nya”; dalam konteks kemungkinan besar merujuk kepada Obed-Edom.
  alternative: Dipahami secara lebih umum sebagai merujuk kepada garis keluarga atau rumah tangganya.
  rationale: Konteks 1 Tawarikh 26:4–8 menyebut anak-anak dan keturunan Obed-Edom, tetapi teks ayat ini sendiri hanya memakai sufiks tunggal. Terjemahan tidak mengganti kata ganti itu dengan nama sehingga ambiguitas sumber tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Kata “dan” sebelum nama terakhir membuat daftar alami dalam bahasa Indonesia tanpa mengubah hubungan unsur-unsurnya; titik koma mempertahankan struktur enumeratif.
