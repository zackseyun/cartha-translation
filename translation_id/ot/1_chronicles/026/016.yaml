id: 1CH.26.16
reference: 1 Chronicles 26:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְ/שֻׁפִּ֤ים וּ/לְ/חֹסָה֙ לַֽ/מַּעֲרָ֔ב עִ֚ם שַׁ֣עַר שַׁלֶּ֔כֶת בַּֽ/מְסִלָּ֖ה הָ/עוֹלָ֑ה מִשְׁמָ֖ר לְ/עֻמַּ֥ת מִשְׁמָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/016.yaml
  text: For Shuppim and Hosah[a], the lot fell to the west, with the Gate of Shallecheth on the ascending highway, guard corresponding to guard.
translation:
  language: id
  text: Bagi Supim dan Hosa, undian jatuh di sebelah barat, bersama Gerbang Salehet[a] di jalan raya yang menanjak; penjagaan berhadapan dengan penjagaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “Gerbang Pembuangan”; nama Salehet tampaknya berasal dari kata kerja yang berarti “membuang” atau “melemparkan ke bawah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֻׁפִּים וּלְחֹסָה
  choice: Bagi Supim dan Hosa
  rationale: Prefiks ל menandai penerima penugasan dalam konteks pembagian berdasarkan undian. Nama-nama itu ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: לַמַּעֲרָב
  choice: di sebelah barat
  rationale: Menunjuk sisi atau lokasi barat yang diperoleh dalam pembagian; bentuk ini alami dalam bahasa Indonesia.
- source_word: עִם
  choice: bersama
  rationale: Mempertahankan hubungan sederhana antara bagian barat dan gerbang yang disebutkan, tanpa mempersempitnya menjadi hubungan spasial yang lebih khusus.
- source_word: שַׁעַר שַׁלֶּכֶת
  choice: Gerbang Salehet
  rationale: שַׁלֶּכֶת kemungkinan merupakan nama diri sebuah gerbang, sehingga ditransliterasikan dalam teks utama; kemungkinan makna leksikalnya dicatat dalam catatan kaki.
- source_word: בַּמְסִלָּה הָעוֹלָה
  choice: di jalan raya yang menanjak
  rationale: מְסִלָּה adalah jalan yang ditinggikan atau jalan raya, sedangkan הָעוֹלָה menyatakan bahwa jalan itu naik. Terjemahan ini mempertahankan gambaran topografis secara alami.
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: penjagaan berhadapan dengan penjagaan
  rationale: Ungkapan ringkas ini mempertahankan susunan Ibrani dan menyampaikan bahwa pos atau giliran penjagaan saling berhadapan atau bersesuaian, tanpa menetapkan lebih jauh mana yang dimaksud.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Klausa “undian jatuh” dilengkapi dari konteks pembagian dalam ayat-ayat sekitar karena teks Ibrani ayat ini berbentuk eliptis. Ungkapan penutup sengaja tetap ringkas untuk mempertahankan ambiguitas antara posisi penjagaan yang saling berhadapan dan penugasan yang bersesuaian.
