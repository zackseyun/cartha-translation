base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/002.yaml
  text: And David took the crown of their king from his head and found that it weighed a talent of gold, and in it was a precious stone; and it was placed on David’s head. And he carried off very much plunder from the city.
translation:
  language: id
  text: Daud mengambil mahkota raja mereka[a] dari kepalanya. Ia mendapati bahwa mahkota itu seberat satu talenta emas[b], dan di dalamnya terdapat sebuah batu berharga. Mahkota itu berada di atas kepala Daud. Ia juga membawa keluar dari kota itu jarahan yang sangat banyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mahkota Milkom” (atau “Malkam”), jika מַלְכָּם dipahami sebagai nama dewa orang Amon, bukan “raja mereka”.'
    reason: alternative_reading
  - marker: b
    text: Talenta adalah satuan berat kuno yang besar, sering diperkirakan sekitar 34 kilogram, meskipun standar beratnya berbeda-beda menurut tempat dan zaman.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: mahkota
  rationale: Padanan Indonesia yang lazim dan jelas untuk tutup kepala kerajaan; lebih alami daripada istilah yang lebih teknis seperti “diadem”.
- source_word: מַלְכָּם
  choice: raja mereka
  rationale: Secara morfologis paling alami dipahami sebagai מֶלֶךְ dengan akhiran orang ketiga jamak, yaitu “raja mereka”; kemungkinan bahwa bentuk ini merupakan nama Milkom tetap dicatat dalam catatan kaki.
- source_word: מֵעַל רֹאשׁוֹ
  choice: dari kepalanya
  rationale: Mengungkapkan secara alami gambaran konkret bahwa mahkota itu diambil dari kepala tokoh yang baru disebut.
- source_word: וַיִּמְצָאָהּ מִשְׁקַל כִּכַּר זָהָב
  choice: Didapatinya bahwa berat mahkota itu satu talenta emas
  rationale: Mempertahankan tindakan “mendapati” dan satuan kuno tanpa mengubahnya menjadi ukuran modern yang lebih pasti daripada bukti sumber.
- source_word: אֶבֶן יְקָרָה
  choice: sebuah batu berharga
  rationale: Padanan langsung yang mempertahankan bentuk tunggal dan tidak menentukan jenis permatanya.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִיד
  choice: Mahkota itu kemudian berada di kepala Daud
  rationale: Mengikuti pernyataan Ibrani bahwa mahkota itu “berada di kepala Daud” tanpa menambahkan pelaku atau tindakan pasif “dikenakan” yang tidak dinyatakan secara eksplisit.
- source_word: וּשְׁלַל הָעִיר הוֹצִיא הַרְבֵּה מְאֹד
  choice: Daud juga mengangkut sangat banyak jarahan dari kota itu
  rationale: “Jarahan” merupakan padanan modern untuk hasil rampasan perang, sedangkan “mengangkut” menyampaikan tindakan membawa keluar dalam jumlah besar.
theological_decisions:
- issue: Apakah מַלְכָּם berarti “raja mereka” atau nama dewa Amon, Milkom/Malkam
  choice: raja mereka
  alternative: Milkom atau Malkam
  rationale: Bentuk berakhiran pronomina dan frasa “dari kepalanya” paling langsung menunjuk kepada seorang raja. Namun, pembacaan sebagai nama dewa Amon tetap mungkin berdasarkan bentuk konsonannya, sehingga ambiguitas itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dipecah secukupnya agar mudah dipahami, sementara pengulangan “mahkota” dipakai untuk memperjelas rujukan pronomina. Istilah kuno “talenta” dipertahankan dan dijelaskan melalui catatan kaki.
