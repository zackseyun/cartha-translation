  text: וַ/יְהִ֡י לְ/עֵת֩ תְּשׁוּבַ֨ת הַ/שָּׁנָ֜ה לְ/עֵ֣ת צֵ֣את הַ/מְּלָכִ֗ים וַ/יִּנְהַ֣ג יוֹאָב֩ אֶת חֵ֨יל הַ/צָּבָ֜א וַ/יַּשְׁחֵ֣ת אֶת אֶ֣רֶץ בְּנֵֽי עַמּ֗וֹן וַ/יָּבֹא֙ וַ/יָּ֣צַר אֶת רַבָּ֔ה וְ/דָוִ֖יד יֹשֵׁ֣ב בִּ/ירֽוּשָׁלִָ֑ם וַ/יַּ֥ךְ יוֹאָ֛ב אֶת רַבָּ֖ה וַ/יֶּֽהֶרְסֶֽ/הָ׀־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/001.yaml
  text: And it happened at the time of the turning of the year[a], at the time when kings go out, that Joab led out the army and devastated the land of the Ammonites, and he came and besieged Rabbah. But David stayed in Jerusalem. And Joab struck Rabbah and tore it down.
translation:
  language: id
  text: Pada waktu pergantian tahun[a], pada waktu raja-raja keluar, Yoab memimpin pasukan keluar dan menghancurkan negeri orang Amon. Ia datang lalu mengepung Raba. Namun, Daud tetap tinggal di Yerusalem. Yoab menyerang Raba dan merobohkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih interpretatif, “pada musim semi, saat raja-raja maju berperang.” Secara lebih harfiah, teks Ibrani berbunyi “pada pergantian tahun, pada waktu raja-raja keluar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשׁוּבַת הַשָּׁנָה
  choice: waktu pergantian tahun
  rationale: Mempertahankan idiom Ibrani tentang berbaliknya atau kembalinya tahun tanpa langsung menafsirkannya sebagai musim semi.
- source_word: לְעֵת צֵאת הַמְּלָכִים
  choice: saat raja-raja maju berperang
  rationale: Kata kerja harfiahnya berarti 'keluar'; dalam konteks pasukan dan pengepungan, 'maju berperang' menyampaikan implikasi militer secara alami dalam bahasa Indonesia.
- source_word: וַיִּנְהַג
  choice: memimpin ... keluar
  rationale: Mengungkapkan tindakan membawa atau memimpin pasukan bergerak keluar dalam suatu kampanye.
- source_word: חֵיל הַצָּבָא
  choice: pasukan
  rationale: Gabungan nomina ini menunjuk pada kekuatan militer; 'pasukan' ringkas dan wajar.
- source_word: וַיַּשְׁחֵת אֶת אֶרֶץ בְּנֵי עַמּוֹן
  choice: menghancurkan negeri orang Amon
  rationale: Menyampaikan tindakan merusak atau membinasakan wilayah dalam kampanye militer; 'orang Amon' adalah bentuk Indonesia yang alami untuk 'keturunan Amon'.
- source_word: וַיָּצַר
  choice: mengepung
  rationale: Istilah militer langsung untuk tindakan mengadakan pengepungan terhadap kota.
- source_word: וְדָוִיד יֹשֵׁב בִּירוּשָׁלִָם
  choice: Namun, Daud tetap tinggal di Yerusalem
  rationale: Partisip menunjukkan keadaan yang berlangsung; 'tetap tinggal' menegaskan bahwa Daud tidak ikut maju, sedangkan 'namun' menyatakan kontras kontekstual.
- source_word: וַיַּךְ
  choice: menyerang
  rationale: Kata Ibrani ini luas, dapat berarti memukul atau menyerang. Dalam hubungan dengan kota yang dikepung, 'menyerang' alami dan tidak mengulang hasil yang dinyatakan oleh verba berikutnya.
- source_word: וַיֶּהֶרְסֶהָ
  choice: merobohkannya
  rationale: Menunjukkan perobohan atau penghancuran kota dan membedakannya dari kerusakan wilayah sebelumnya.
- source_word: רַבָּה
  choice: Raba
  rationale: Transliterasi nama kota yang lazim dalam bahasa Indonesia.
