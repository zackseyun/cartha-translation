  text: וַ/תְּהִי ע֥וֹד מִלְחָמָ֖ה אֶת פְּלִשְׁתִּ֑ים וַ/יַּ֞ךְ אֶלְחָנָ֣ן בֶּן יעור אֶת לַחְמִי֙ אֲחִי֙ גָּלְיָ֣ת הַ/גִּתִּ֔י וְ/עֵ֣ץ חֲנִית֔/וֹ כִּ/מְנ֖וֹר אֹרְגִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/005.yaml
  text: And there was war with the Philistines again[a], and Elhanan son of Jair struck down Lahmi, the brother of Goliath the Gittite, whose spear shaft was like a weaver’s beam.
translation:
  language: id
  text: Sekali lagi terjadi perang melawan orang Filistin.[a] Elhanan anak Yair menewaskan Lahmi, saudara Goliat, orang Gat itu. Batang tombak Lahmi seperti balok alat tenun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani dalam bagian paralel di 2 Samuel 21:19 sulit dan sering dibahas sehubungan dengan ayat ini. Kitab Tawarikh secara eksplisit mengatakan bahwa Elhanan membunuh Lahmi, saudara Goliat.
    reason: textual_variant
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: Sekali lagi terjadi perang
  rationale: עוֹד memperkenalkan satu peristiwa lain dalam rangkaian peperangan, sehingga “sekali lagi” lebih alami daripada terjemahan harfiah “masih”; מִלְחָמָה diterjemahkan “perang” sesuai konteks.
- source_word: אֶת פְּלִשְׁתִּים
  choice: melawan orang Filistin
  rationale: Dalam konteks konflik, אֶת menandai pihak lawan. Ungkapan “perang melawan” merupakan bentuk Indonesia yang alami dan jelas.
- source_word: וַיַּךְ
  choice: menewaskan
  rationale: Bentuk נכה dapat berarti memukul atau merobohkan; dalam konteks pertempuran ini hasilnya adalah kematian. “Menewaskan” menyampaikan makna kontekstual secara ringkas tanpa memakai ungkapan arkais.
- source_word: אֶלְחָנָן בֶּן יעור
  choice: Elhanan anak Yair
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim, sedangkan בֶּן diterjemahkan langsung sebagai “anak”.
- source_word: אֶת לַחְמִי
  choice: Lahmi
  rationale: אֶת adalah penanda objek langsung dan tidak diterjemahkan. Sesuai vokalisasi Masoret, לַחְמִי dipahami sebagai nama diri, Lahmi.
- source_word: אֲחִי גָּלְיָת
  choice: saudara Goliat
  rationale: Frasa konstruksi Ibrani ini secara eksplisit menyatakan hubungan persaudaraan dan dipertahankan tanpa penambahan yang tidak terdapat dalam teks.
- source_word: הַגִּתִּי
  choice: orang Gat itu
  rationale: Sebutan gentilik הַגִּתִּי menunjukkan orang yang berasal dari Gat. “Orang Gat” lebih mudah dipahami pembaca Indonesia modern daripada bentuk serapan “orang Giti”.
- source_word: וְעֵץ חֲנִיתוֹ
  choice: Batang tombak Lahmi
  rationale: Secara harfiah frasa ini berarti “kayu/batang tombaknya”. Nama “Lahmi” dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: seperti balok alat tenun
  rationale: Perbandingan konkret dengan balok pada alat tenun dipertahankan. Bentuk ini alami dan dapat dimengerti tanpa menyisipkan ukuran yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Hubungan ayat ini dengan teks paralel dalam 2 Samuel 21:19 yang sulit dan dapat terdengar seolah-olah Elhanan membunuh Goliat
  choice: 'Mengikuti bunyi eksplisit Tawarikh: Elhanan menewaskan Lahmi, saudara Goliat.'
  alternative: Mengubah atau melengkapi ayat ini demi menyelaraskannya dengan salah satu rekonstruksi teks 2 Samuel 21:19.
  rationale: Teks Ibrani 1 Tawarikh secara jelas menyebut Lahmi sebagai saudara Goliat. Terjemahan mempertahankan kesaksian ayat ini sendiri, sementara persoalan teks paralelnya diberitahukan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan naratif yang ringkas dan bermartabat. Istilah geografis “orang Gat” dipilih agar langsung dipahami, dan gambaran konkret “balok alat tenun” dipertahankan.
