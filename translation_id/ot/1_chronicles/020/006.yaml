  text: וַ/תְּהִי ע֥וֹד מִלְחָמָ֖ה בְּ/גַ֑ת וַ/יְהִ֣י אִ֣ישׁ מִדָּ֗ה וְ/אֶצְבְּעֹתָ֤י/ו שֵׁשׁ וָ/שֵׁשׁ֙ עֶשְׂרִ֣ים וְ/אַרְבַּ֔ע וְ/גַם ה֖וּא נוֹלַ֥ד לְ/הָ/רָפָֽא־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/006.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six each, twenty-four in all; he also was born to Rapha.
translation:
  language: id
  text: Kemudian terjadilah lagi peperangan di Gat. Di sana ada seorang yang bertubuh sangat besar. Jari tangan dan jari kakinya masing-masing berjumlah enam—seluruhnya dua puluh empat. Ia pun lahir dari Rafa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lahir bagi Rafa.” Ungkapan ini juga dapat berarti “keturunan sang raksasa” atau “salah seorang dari kaum Refaim.”
    reason: Menjelaskan ungkapan Ibrani yang ambigu mengenai apakah Rafa adalah leluhur, sebutan bagi raksasa, atau nama suatu kelompok.
lexical_decisions:
- source_word: עוֹד
  choice: lagi
  rationale: Dalam rangkaian narasi, kata ini menunjukkan berulangnya peperangan.
- source_word: מִלְחָמָה
  choice: peperangan
  rationale: Nomina ini menunjuk pada konflik bersenjata secara umum; 'peperangan' sesuai dengan ringkasan naratif.
- source_word: בְּגַת
  choice: di Gat
  rationale: Preposisi Ibrani ב menyatakan lokasi; 'di Gat' merupakan ungkapan Indonesia yang alami.
- source_word: אִישׁ מִדָּה
  choice: seorang yang bertubuh sangat besar
  rationale: Secara harfiah berarti 'seorang yang berukuran/berperawakan'; konteks menunjukkan ukuran tubuh yang luar biasa.
- source_word: אֶצְבְּעֹתָיו
  choice: jari tangan dan jari kakinya
  rationale: Walaupun nomina dasarnya berarti 'jari', jumlah keseluruhan dua puluh empat dan paralel dalam 2 Samuel 21:20 menunjukkan bahwa jari tangan maupun kaki dimaksudkan.
- source_word: שֵׁשׁ וָשֵׁשׁ
  choice: masing-masing berjumlah enam
  rationale: Ungkapan berulang ini bersifat distributif, yakni enam pada setiap tangan dan kaki.
- source_word: עֶשְׂרִים וְאַרְבַּע
  choice: seluruhnya dua puluh empat
  rationale: Frasa ini menyatakan jumlah total semua jari.
- source_word: וְגַם הוּא
  choice: Ia pun
  rationale: Menandai bahwa orang ini, seperti para tokoh lain dalam konteks, memiliki hubungan yang sama dengan Rafa.
- source_word: נוֹלַד לְהָרָפָא
  choice: lahir dari Rafa
  rationale: Terjemahan ini cukup alami dalam bahasa Indonesia dan mempertahankan Rafa sebagai sebutan yang mungkin menunjuk kepada leluhur atau kelompok, sementara catatan kaki menjelaskan ambiguitasnya.
theological_decisions:
- issue: Identitas הָרָפָא
  choice: Rafa dipertahankan sebagai transliterasi dalam teks utama
  alternative: raksasa; kaum Refaim; keturunan Rafa
  rationale: Bentuk Ibraninya tunggal dengan kata sandang dan dapat menunjuk kepada leluhur, tokoh eponim, atau kelompok. Transliterasi menghindari pemastian tafsir yang tidak diberikan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat panjang sumber dipecah agar mudah dipahami tanpa menghilangkan hubungan naratif. Penanda catatan kaki ditempatkan langsung setelah 'Rafa', yaitu unsur yang dijelaskan.
