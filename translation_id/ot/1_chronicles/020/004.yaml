source:
  edition: WLC
  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/תַּעֲמֹ֧ד מִלְחָמָ֛ה בְּ/גֶ֖זֶר עִם פְּלִשְׁתִּ֑ים אָ֣ז הִכָּ֞ה סִבְּכַ֣י הַ/חֻֽשָׁתִ֗י אֶת סִפַּ֛י מִ/ילִדֵ֥י הָ/רְפָאִ֖ים וַ/יִּכָּנֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/004.yaml
  text: After this[a], war arose at Gezer with the Philistines. Then Sibbecai the Hushathite struck down Sippai, one of the descendants of the Rephaim[b], and they were subdued.
translation:
  language: id
  text: Setelah itu pecahlah perang di Gezer melawan orang Filistin. Kemudian Sibkhai, orang Husa, mengalahkan Sipai[a], salah seorang keturunan Refaim[b], lalu mereka pun ditundukkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dapat ditransliterasikan “Safai.”
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “kaum Refaim”; secara tradisional juga diterjemahkan “orang-orang raksasa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Setelah itu
  rationale: Ungkapan peralihan waktu dalam narasi diterjemahkan secara alami tanpa mempertahankan rumus Ibrani secara kaku.
- source_word: וַתַּעֲמֹד מִלְחָמָה
  choice: pecahlah perang
  rationale: Dalam konteks ini, עמד bersama מִלְחָמָה menyatakan timbulnya peperangan; ungkapan ini alami dan kuat dalam bahasa Indonesia.
- source_word: בְּגֶזֶר
  choice: di Gezer
  rationale: Preposisi lokasi diterjemahkan dengan 'di', sedangkan nama tempat ditransliterasikan.
- source_word: עִם פְּלִשְׁתִּים
  choice: melawan orang Filistin
  rationale: Walaupun עִם secara harfiah berarti 'dengan', dalam konteks perang relasinya bersifat bermusuhan; 'melawan' menyampaikan maksud itu secara wajar.
- source_word: אָז
  choice: Pada waktu itu
  rationale: Penanda urutan narasi ini diterjemahkan dengan ungkapan Indonesia yang alami dan tidak harus berarti waktu yang jauh berbeda.
- source_word: הִכָּה
  choice: menewaskan
  rationale: Dalam kisah pertempuran, נכה di sini menunjukkan pukulan yang mematikan; 'menewaskan' menyampaikan hasilnya secara ringkas dan wajar.
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: Sibkhai, orang Husa
  rationale: 'Nama pribadi ditransliterasikan, sedangkan bentuk nisbah הַחֻשָׁתִי dinyatakan secara alami sebagai asal atau kelompok: ''orang Husa''.'
- source_word: סִפַּי
  choice: Sipai
  rationale: Bentuk nama dalam teks Masoret ditransliterasikan sesuai ejaan Indonesia; ragam transliterasi dicatat dalam catatan kaki.
- source_word: מִילִדֵי הָרְפָאִים
  choice: salah seorang keturunan Refaim
  rationale: ילידי menunjuk kepada orang yang lahir dari atau berasal dari suatu garis keturunan. Bentuk tunggal yang dirujuk dibuat jelas, sedangkan רְפָאִים dipertahankan sebagai nama kelompok.
- source_word: וַיִּכָּנֵעוּ
  choice: mereka pun ditundukkan
  rationale: Bentuk nifal dari כנע dalam konteks militer menyatakan bahwa pihak lawan dibuat takluk. Kata ganti jamak dipertahankan sebagaimana teks sumber tanpa memperjelas rujukannya secara berlebihan.
theological_decisions:
- issue: Makna הָרְפָאִים
  choice: Refaim
  alternative: orang-orang raksasa
  rationale: Istilah ini dapat berfungsi sebagai nama suatu kelompok atau garis keturunan, bukan semata-mata keterangan ukuran tubuh. Transliterasi mempertahankan keterbukaan makna teks, sedangkan tafsiran tradisional dicatat dalam catatan kaki.
- issue: Rujukan subjek jamak dalam וַיִּכָּנֵעוּ
  choice: mereka pun ditundukkan
  alternative: orang Filistin pun ditundukkan
  rationale: Teks Ibrani memakai subjek tersirat berbentuk jamak. Walaupun konteks sangat mungkin menunjuk kepada orang Filistin, mempertahankan kata ganti menghindari penambahan identifikasi yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur narasi Ibrani, tetapi memakai ungkapan Indonesia yang alami. Nama-nama disesuaikan dengan kebiasaan transliterasi Indonesia, dan ambiguitas kata ganti penutup tetap dipertahankan.
