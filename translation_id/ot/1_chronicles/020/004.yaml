  source_fidelity: Kata kerja הִכָּה secara harfiah menyatakan tindakan memukul/menyerang dan, dalam konteks perang, dapat menyiratkan kematian. Namun, "menewaskan" menetapkan hasil kematian lebih tegas daripada yang perlu dinyatakan oleh bentuk Ibrani ini. "Mengalahkan" menyampaikan hasil militer tanpa menambahkan kepastian tersebut. Rujukan jamak dalam וַיִּכָּנֵעוּ tetap dibiarkan ambigu sebagaimana teks sumber.
  naturalness: Teks pada dasarnya baku dan mudah dibaca. "Kemudian" lebih alami sebagai penanda urutan untuk אָז daripada "Pada waktu itu" dalam konteks ini.
  terminology: Nama Sipai selaras dengan transliterasi Indonesia dari סִפַּי. Catatan kaki a sebaiknya hanya mencatat bentuk alternatif yang relevan, yaitu Safai; "Sippai" pada dasarnya hanya mencerminkan konvensi transliterasi Inggris, bukan alternatif tekstual yang perlu dicatat dalam terjemahan Indonesia.
