  - severity: low
    issue: Catatan kaki a mencantumkan "Sippai" sebagai alternatif bagi "Sipai".
    rationale: Bentuk itu hanya perbedaan konvensi ejaan/transliterasi Inggris dan tidak perlu diperlakukan sebagai varian nama dalam teks Indonesia. Alternatif audit yang relevan adalah Safai.
