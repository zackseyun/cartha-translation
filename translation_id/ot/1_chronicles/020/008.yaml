  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵ֛ל נוּלְּד֥וּ לְ/הָ/רָפָ֖א בְּ/גַ֑ת וַ/יִּפְּל֥וּ בְ/יַד דָּוִ֖יד וּ/בְ/יַד עֲבָדָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/008.yaml
  text: These were born to Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: id
  text: Mereka ini lahir dari Rafa[a] di Gat, lalu mereka gugur di tangan Daud dan di tangan hamba-hambanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lahir bagi sang Rafa”; mungkin menunjuk kepada keturunan orang Refaim, yaitu garis keturunan para raksasa di Gat.
    reason: Menjelaskan konstruksi Ibrani yang tidak alami jika diterjemahkan secara harfiah dan mempertahankan kemungkinan identitas Rafa yang diperdebatkan.
lexical_decisions:
- source_word: אֵל
  choice: Mereka ini
  rationale: Kata penunjuk ini merujuk kembali kepada para pejuang yang baru disebutkan. “Mereka ini” alami dalam bahasa Indonesia dan tidak menambahkan keterangan yang tidak dinyatakan ulang dalam bahasa Ibrani.
- source_word: נוּלְּדוּ
  choice: lahir
  rationale: Bentuk nifal dari ילד pada dasarnya berarti “lahir”. Dalam konteks silsilah, ungkapan ini juga menyiratkan garis keturunan, tetapi “lahir” mempertahankan gambaran sumber.
- source_word: לְהָרָפָא
  choice: dari Rafa
  rationale: Konstruksi ini menunjukkan hubungan kelahiran atau keturunan dengan Rafa. “Dari Rafa” lebih alami daripada “bagi Rafa” dalam bahasa Indonesia, tanpa memastikan apakah Rafa adalah leluhur pribadi atau sebutan suatu garis keturunan.
- source_word: בְּגַת
  choice: di Gat
  rationale: Preposisi ב digunakan secara lokatif bersama nama tempat Gat.
- source_word: וַיִּפְּלוּ
  choice: lalu mereka gugur
  rationale: נפל secara harfiah berarti “jatuh”, tetapi dalam konteks pertempuran menyatakan tewas. “Gugur” mempertahankan citra jatuh sekaligus menyampaikan makna konteks dengan wajar.
- source_word: בְיַד
  choice: di tangan
  rationale: Ungkapan ini menyatakan pelaku atau perantaraan. “Di tangan” mempertahankan idiom Ibrani yang juga lazim dipahami dalam bahasa Indonesia.
- source_word: עֲבָדָיו
  choice: hamba-hambanya
  rationale: עבד berarti “hamba” atau orang yang mengabdi. Dalam konteks kerajaan dan militer, istilah ini dapat mencakup para pejuang yang melayani Daud; terjemahan ini mempertahankan arti leksikal tanpa mempersempitnya menjadi “prajurit”.
theological_decisions:
- issue: Identitas הָרָפָא
  choice: Rafa sebagai nama atau sebutan garis keturunan, tanpa diterjemahkan menjadi “raksasa”
  alternative: Rafa sebagai leluhur pribadi; sang raksasa; orang Refaim
  rationale: Bentuk Ibrani bersifat tunggal dan memakai kata sandang, tetapi tidak secara eksplisit memakai bentuk jamak umum “Refaim”. Mempertahankan “Rafa” menjaga ketidakjelasan apakah yang dimaksud ialah seorang leluhur eponim atau suatu kelompok keturunan, serta tidak memasukkan penafsiran “raksasa” langsung ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Gugur di tangan” dipilih untuk menjaga citra Ibrani sekaligus terdengar alami dalam konteks pertempuran; pengulangan “di tangan” dipertahankan karena memberi penekanan yang terdapat dalam teks sumber.
