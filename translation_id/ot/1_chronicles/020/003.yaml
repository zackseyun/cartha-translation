source:
  edition: WLC
  text: וְ/אֶת הָ/עָ֨ם אֲשֶׁר בָּ֜/הּ הוֹצִ֗יא וַ/יָּ֨שַׂר בַּ/מְּגֵרָ֜ה וּ/בַ/חֲרִיצֵ֤י הַ/בַּרְזֶל֙ וּ/בַ/מְּגֵר֔וֹת וְ/כֵן֙ יַעֲשֶׂ֣ה דָוִ֔יד לְ/כֹ֖ל עָרֵ֣י בְנֵי עַמּ֑וֹן וַ/יָּ֧שָׁב דָּוִ֛יד וְ/כָל הָ/עָ֖ם יְרוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/003.yaml
  text: He brought out the people who were in it and put them to work with saws[a], iron tools, and axes. Thus David did to all the cities of the Ammonites[b]. Then David and all the people returned to Jerusalem.
translation:
  language: id
  text: Ia membawa keluar penduduk yang ada di dalam kota itu dan mempekerjakan mereka dengan gergaji, perkakas besi tajam, dan alat pemotong.[a][b] Demikianlah yang dilakukan Daud terhadap semua kota orang Amon. Kemudian Daud dan seluruh rakyat kembali ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “menempatkan mereka di bawah gergaji, alat pengirik besi, dan alat pemotong.” Sebagian penafsir, dengan mempertimbangkan 2 Samuel 12:31, memahami kalimat ini sebagai tindakan menghukum mati mereka dengan alat-alat tersebut.
    reason: alternative_reading
  - marker: b
    text: Nama-nama perkakas dalam teks Ibrani sebagian tidak pasti. Ungkapan yang diterjemahkan “perkakas besi tajam, dan alat pemotong” mungkin menunjuk pada alat pengirik besi atau jenis perkakas tajam lainnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיא
  choice: membawa keluar
  rationale: Bentuk Hifil dari יצא berarti membawa atau menyuruh keluar; ungkapan ini mempertahankan tindakan konkret mengeluarkan penduduk dari kota.
- source_word: וַיָּשַׂר
  choice: mempekerjakan mereka
  rationale: Kata kerja ini sulit dan maknanya diperdebatkan. Dalam susunan Tawarikh, kata ini dapat dipahami sebagai menempatkan atau menugaskan penduduk untuk bekerja dengan perkakas yang disebutkan. Alternatif yang lebih keras dicatat dalam catatan kaki.
- source_word: בַּמְּגֵרָה
  choice: dengan gergaji
  rationale: מְגֵרָה menunjuk pada gergaji; bentuk tunggal kolektif wajar diterjemahkan sebagai nama jenis perkakas dalam bahasa Indonesia.
- source_word: בַּחֲרִיצֵי הַבַּרְזֶל
  choice: perkakas besi tajam
  rationale: Istilah ini menunjuk pada benda tajam atau alat pengiris dari besi, tetapi jenis persisnya tidak pasti. Pilihan umum ini tidak memberi kepastian palsu.
- source_word: וּבַמְּגֵרוֹת
  choice: dan alat pemotong
  rationale: Bentuk ini secara leksikal sulit dan menyerupai kata untuk 'gergaji', tetapi dalam konteks daftar perkakas mungkin menunjuk pada jenis alat pemotong lain. Terjemahan umum menjaga kewajaran sekaligus ketidakpastian sumber.
- source_word: וְכֵן יַעֲשֶׂה
  choice: Demikianlah yang dilakukan Daud
  rationale: Bentuk ini merangkum tindakan Daud terhadap kota-kota Amon dan dapat bernuansa tindakan yang dilakukan berulang kali; susunan Indonesia ini alami dan tidak terlalu menentukan aspek waktunya.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: terhadap semua kota orang Amon
  rationale: בְנֵי עַמּוֹן adalah sebutan etnis bagi orang Amon; frasa ini menyatakan bahwa tindakan serupa berlaku pada semua kota mereka.
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  choice: kembali ke Yerusalem
  rationale: שׁוב dengan tujuan tempat secara alami berarti kembali ke tempat tersebut.
theological_decisions:
- issue: Apakah ayat ini menggambarkan kerja paksa atau pembunuhan penduduk Amon
  choice: Teks utama menyatakan bahwa Daud mempekerjakan para penduduk dengan perkakas yang disebutkan.
  alternative: Ayat ini mungkin dipahami sebagai tindakan menempatkan mereka di bawah gergaji dan perkakas besi, yakni menghukum mati mereka dengan alat-alat itu, terutama bila dibaca dalam terang 2 Samuel 12:31.
  rationale: Rumusan dalam Tawarikh berbeda dari paralelnya dalam 2 Samuel dan memungkinkan pengertian penugasan kerja. Terjemahan utama tidak memasukkan pengertian yang lebih keras dari teks paralel, tetapi mempertahankannya dalam catatan kaki karena ambiguitasnya nyata dan penting.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Penduduk” memperjelas bahwa הָעָם di sini adalah orang-orang di dalam kota, sedangkan “seluruh rakyat” mempertahankan penggunaan kolektif kata yang sama bagi rombongan Daud. Istilah perkakas dibuat cukup umum agar tidak melampaui kepastian leksikal teks Ibrani.
