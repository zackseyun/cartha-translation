  text: וַ/יְחָרֵ֖ף אֶת יִשְׂרָאֵ֑ל וַ/יַּכֵּ֨/הוּ֙ יְה֣וֹנָתָ֔ן בֶּן שִׁמְעָ֖א אֲחִ֥י דָוִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/007.yaml
  text: And when he taunted Israel[a], Jonathan son of Shimea, David’s brother, struck him down.
translation:
  language: id
  text: Ketika orang itu menghina Israel[a], Yonatan anak Simea, saudara Daud, menewaskannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menantang Israel.” Kata kerja Ibrani ini dapat menyatakan penghinaan yang mencemooh atau penentangan secara terbuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: mencela
  rationale: Dalam konteks ini, חרף menyatakan penghinaan lisan yang juga bernada menantang. “Mencela” merupakan ungkapan Indonesia modern yang alami dan cukup dekat dengan tindakan tutur dalam bahasa Ibrani; kemungkinan nuansa “menantang” dipertahankan dalam catatan kaki.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Objek langsungnya adalah nama bangsa Israel. Bentuk “Israel” mempertahankan ungkapan Ibrani dan secara wajar dapat merujuk kepada umat Israel secara keseluruhan.
- source_word: וַיַּכֵּהוּ
  choice: menewaskannya
  rationale: Bentuk dari נכה secara harfiah menyatakan tindakan memukul, tetapi dalam konteks pertempuran ini akibatnya mematikan. “Menewaskannya” menyampaikan hasil tindakan secara ringkas dan alami tanpa memakai ungkapan arkais.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Transliterasi nama pribadi yang lazim dan sesuai pola ejaan Alkitab bahasa Indonesia.
- source_word: בֶּן שִׁמְעָא
  choice: anak Simea
  rationale: Menerjemahkan hubungan keturunan secara langsung dan mempertahankan nama pribadi dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֲחִי דָוִיד
  choice: saudara Daud
  rationale: Frasa konstruksi Ibrani berarti “saudara Daud.” Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan hubungan keluarga tanpa menentukan kakak atau adik, yang tidak dinyatakan teks.
