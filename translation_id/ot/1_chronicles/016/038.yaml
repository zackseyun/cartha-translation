base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/038.yaml
  text: And Obed-edom and their brothers[a], sixty-eight; and Obed-edom son of Jeduthun and Hosah were gatekeepers.
translation:
  language: id
  text: Obed-Edom dan saudara-saudara mereka[a], enam puluh delapan orang; Obed-Edom anak Yedutun dan Hosa adalah penjaga pintu gerbang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi “saudara-saudara mereka”. Sejumlah terjemahan memakai “saudara-saudaranya” untuk memperjelas hubungan itu, tetapi teks utama mempertahankan sufiks jamak dalam teks Ibrani yang diterima.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/עֹבֵד אֱדֹם
  choice: Obed-Edom
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; waw melanjutkan daftar dan tidak perlu selalu dinyatakan dengan kata penghubung pada awal kalimat.
- source_word: וַ/אֲחֵי/הֶם
  choice: dan saudara-saudara mereka
  rationale: Mempertahankan sufiks orang ketiga jamak dalam teks Ibrani yang diterima, meskipun acuannya terasa padat dalam konteks daftar.
- source_word: שִׁשִּׁים וּ/שְׁמוֹנָה
  choice: enam puluh delapan orang
  rationale: Bilangan diterjemahkan dengan susunan Indonesia modern; 'orang' ditambahkan secara wajar untuk memperjelas bahwa angka itu menghitung orang.
- source_word: וְ/עֹבֵד אֱדֹם
  choice: Obed-Edom
  rationale: Pengulangan nama dipertahankan karena teks Ibrani menyebutkannya kembali untuk memperkenalkan keterangan berikutnya.
- source_word: בֶּן יְדִיתוּן
  choice: anak Yedutun
  rationale: Menerjemahkan hubungan keturunan secara langsung dan mempertahankan identifikasi genealogis yang penting dalam Tawarikh.
- source_word: וְ/חֹסָה
  choice: dan Hosa
  rationale: Nama diri ditransliterasikan dan dihubungkan dengan Obed-Edom sebagai pihak yang menjalankan tugas berikutnya.
- source_word: לְ/שֹׁעֲרִים
  choice: menjadi penjaga pintu gerbang
  rationale: Preposisi ל menyatakan fungsi atau penugasan; 'menjadi' menghasilkan predikasi yang alami dalam bahasa Indonesia.
