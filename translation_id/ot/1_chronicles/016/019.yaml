translation:
  language: id
  text: ketika kalian sedikit jumlahnya—sangat sedikit—dan tinggal di sana sebagai pendatang,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּהְיוֹתְכֶם
  choice: ketika ... kalian
  rationale: Preposisi ב dengan infinitif konstruktus היה dan akhiran orang kedua jamak maskulin membentuk anak kalimat waktu; ungkapan ini diterjemahkan secara alami sebagai “ketika ... kalian”.
- source_word: מְתֵי מִסְפָּר
  choice: jumlah kalian hanya sedikit
  rationale: Idiom Ibrani ini menunjuk pada kelompok yang kecil dan dapat dihitung; “jumlah kalian hanya sedikit” menyampaikan maknanya dalam bahasa Indonesia yang wajar.
- source_word: כִּמְעַט
  choice: sangat sedikit
  rationale: Dalam konteks ini, ungkapan tersebut menegaskan kecilnya jumlah mereka. “Sangat sedikit” mempertahankan penekanan itu, sementara kemungkinan nuansa “hampir tidak ada” dicatat dalam catatan kaki.
- source_word: וְגָרִים
  choice: dan kalian tinggal ... sebagai pendatang
  rationale: Partisip dari גור menggambarkan orang yang menetap di suatu tempat sebagai orang asing tanpa kepemilikan tetap. Bentuk verbal ini alami dalam bahasa Indonesia dan mempertahankan nuansa status sementara.
- source_word: בָּהּ
  choice: di sana
  rationale: Akhiran feminin tunggal merujuk kepada negeri dalam konteks sebelumnya. “Di sana” lebih alami daripada “di dalamnya” dan tetap mempertahankan rujukan tempat.
