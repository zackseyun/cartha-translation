translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kata ganti “kalian” mempertahankan orang kedua jamak dalam teks Ibrani; “pendatang” dipilih sebagai istilah yang mudah dipahami untuk orang yang tinggal di negeri asing tanpa kedudukan tetap.
